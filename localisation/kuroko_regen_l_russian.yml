l_russian:
  #Kuroko Regen System Localization
 kuroko_regen.1.t:0 "Активация системы регенерации Куроко"
 kuroko_regen.1.d:0 "Технология межпространственных врат успешно установила связь с Архивом Анубиса. Теперь наша продвинутая система слежения отслеживает состояние отрядов специального назначения Куроко на всех театрах военных действий. Если эти элитные отряды падут в бою, система автоматически инициирует протокол регенерации в течение 180 дней, обеспечивая постоянное тактическое преимущество."
 kuroko_regen.1.a:0 "Система полностью активирована."
 kuroko_regen.2.t:0 "Проверка состояния отрядов Куроко"
 kuroko_regen.2.d:0 "Система слежения проводит плановую проверку состояния развернутых отрядов специального назначения Куроко. Согласно текущим оперативным параметрам, все подразделения функционируют в штатном режиме в пределах ожидаемых показателей."
 kuroko_regen.2.a:0 "Продолжать наблюдение."

 kuroko_regen.3.t:0 "Потеря отряда Куроко - Инициация протокола регенерации"
 kuroko_regen.3.d:0 "Тревога: отряд специального назначения Куроко уничтожен при выполнении задачи. Архив Анубиса автоматически инициировал протокол регенерации. Новый отряд будет развернут на территории Цвета через межпространственные врата в течение 180 дней."
 kuroko_regen.3.a:0 "Обратный отсчет регенерации начат."

 kuroko_regen.4.t:0 "Регенерация отряда Куроко завершена"
 kuroko_regen.4.d:0 "Процедура регенерации завершена. Новые отряды специального назначения Куроко появились из межпространственных врат и были развернуты на нашей территории. Эти элитные подразделения сохраняют память и тактическую экспертизу предыдущих отрядов, поддерживая наше оперативное превосходство."
 kuroko_regen.4.a:0 "Развернуть новые отряды."

 kuroko_regen.5.t:0 "Столица под ударом - Система временно отключена"
 kuroko_regen.5.d:0 "Противник прорвал оборону столицы и нанес серьезный ущерб инфраструктуре межпространственных врат. Система регенерации Куроко временно приостановлена до тех пор, пока наша территория не будет очищена и полная операционная способность не восстановлена."
 kuroko_regen.5.a:0 "Удержать столицу!"

 kuroko_regen.6.t:0 "Столица очищена - Система восстановлена"
 kuroko_regen.6.d:0 "Нашим войскам успешно удалось отразить атаку противника на столицу. Инфраструктура межпространственных врат восстановлена до полной функциональности, система регенерации Куроко снова активна."
 kuroko_regen.6.a:0 "Возобновить операции."

 kuroko_regen.7.t:0 "Доступен экстренный призыв Куроко"
 kuroko_regen.7.d:0 "Военная ситуация для наших сил стала критической. Архив Анубиса предоставляет протокол экстренного развертывания, позволяющий игнорировать обычное время регенерации и немедленно призвать отряд специального назначения Куроко. Однако эта экстренная процедура потребует значительного количества ресурсов командования."
 kuroko_regen.7.a:0 "Экстренный призыв! (Командование -50)"
 kuroko_regen.7.b:0 "Ждать обычной регенерации."

 kuroko_regen.8.t:0 "Экстренное развертывание отряда Куроко завершено"
 kuroko_regen.8.d:0 "Экстренный протокол успешно выполнен. Отряд специального назначения Куроко был немедленно развернут на передовой через приоритетный канал межпространственных врат. Подразделение готово немедленно вступить в бой."
 kuroko_regen.8.a:0 "Отлично."

 kuroko_regen.9.t:0 "Протокол усиления Куроко"
 kuroko_regen.9.d:0 "Архив Анубиса обнаружил оптимальные условия для усиления отрядов специального назначения Куроко. Применение продвинутых боевых протоколов может значительно повысить их боевую эффективность, но потребует существенных ресурсов командования."
 kuroko_regen.9.a:0 "Усилить отряд! (Командование -75)"
 kuroko_regen.9.b:0 "Текущих возможностей достаточно."

 kuroko_regen.10.t:0 "Усиление отряда Куроко завершено"
 kuroko_regen.10.d:0 "Протокол усиления успешно применен к отрядам специального назначения Куроко. Благодаря продвинутым тактическим подпрограммам и улучшенной комплектации вооружения их боевая эффективность значительно повышена."
 kuroko_regen.10.a:0 "Идеально."

 kuroko_regen.11.t:0 "Протокол подкрепления Куроко"
 kuroko_regen.11.d:0 "Сеть межпространственных врат достигла оптимальной стабильности, что позволяет развернуть дополнительные отряды специального назначения Куроко. Эта возможность значительно расширит потенциал наших элитных сил."
 kuroko_regen.11.a:0 "Развернуть дополнительный отряд! (Командование -100)"
 kuroko_regen.11.b:0 "Пока достаточно и одного отряда."

 #Подсказки и описания эффектов
 kivotos_kuroko_add1_tt:0 "§YОтряд специального назначения Куроко§! разблокирован 1 слот"
 kuroko_regen_system_tooltip:0 "§YСистема регенерации Куроко§! автоматически восстанавливает потерянные отряды Куроко в течение 180 дней"
 kuroko_emergency_summon_tooltip:0 "Использование экстренного протокола позволяет немедленно призвать новый §Yотряд специального назначения Куроко§! ценой 50 ед. §YКомандования§!"
 kuroko_enhancement_tooltip:0 "Потратьте 75 ед. §YКомандования§! чтобы усилить текущий отряд Куроко продвинутыми боевыми протоколами"
 kuroko_reinforcement_tooltip:0 "Потратьте 100 ед. §YКомандования§! чтобы призвать дополнительный §Yотряд специального назначения Куроко§!"