l_english:
 #Kuroko Regen System Localization
 kuroko_regen.1.t:0 "Kuroko Regeneration System Activated"
 kuroko_regen.1.d:0 "Dimensional Gate technology has successfully established a link with the Anubis Archive. Our advanced surveillance systems are now tracking the status of Kuroko Special Forces across all operational sectors. Should these elite units fall in battle, the system will automatically initiate regeneration protocols within 180 days, ensuring sustained tactical superiority."
 kuroko_regen.1.a:0 "System fully operational."

 kuroko_regen.2.t:0 "Kuroko Unit Status Check"
 kuroko_regen.2.d:0 "The surveillance system is performing a routine check on the deployment status of the Kuroko Special Forces. According to current operational parameters, all units are functioning normally within expected ranges."
 kuroko_regen.2.a:0 "Continue monitoring."

 kuroko_regen.3.t:0 "Kuroko Unit Lost - Initiating Regeneration Protocol"
 kuroko_regen.3.d:0 "EMERGENCY ALERT: Kuroko Special Forces have been neutralized in operations. The Anubis Archive has automatically initiated regeneration protocols. New units will be deployed to the Chroma territory via Dimensional Gate technology within 180 days."
 kuroko_regen.3.a:0 "Commence regeneration countdown."

 kuroko_regen.4.t:0 "Kuroko Unit Regeneration Complete"
 kuroko_regen.4.d:0 "Regeneration procedures are complete. New Kuroko Special Forces have emerged through the Dimensional Gate and been deployed to friendly territory. These elite units retain the memories and tactical expertise of their predecessors, maintaining our operational advantage."
 kuroko_regen.4.a:0 "Deploy the new units."

 kuroko_regen.5.t:0 "Capital Under Attack - System Suspended"
 kuroko_regen.5.d:0 "Enemy forces have breached the capital's defenses, causing severe damage to the Dimensional Gate infrastructure. The Kuroko Regeneration System is temporarily suspended until friendly territory is secured and full operational capacity is restored."
 kuroko_regen.5.a:0 "Defend the capital at all costs."

 kuroko_regen.6.t:0 "Capital Secured - System Restored"
 kuroko_regen.6.d:0 "Friendly forces have successfully repelled the enemy assault on the capital. Dimensional Gate infrastructure has been restored to full functionality, and the Kuroko Regeneration System is back online."
 kuroko_regen.6.a:0 "Resume operations."

 kuroko_regen.7.t:0 "Emergency Kuroko Summon Available"
 kuroko_regen.7.d:0 "The military situation has reached a critical state. The Anubis Archive offers an emergency deployment protocol capable of bypassing standard regeneration times to summon Kuroko Special Forces immediately. However, this emergency procedure will consume a significant amount of Command Power."
 kuroko_regen.7.a:0 "Emergency Summon! (Command Power -50)"
 kuroko_regen.7.b:0 "Wait for standard regeneration."

 kuroko_regen.8.t:0 "Emergency Kuroko Unit Deployment Complete"
 kuroko_regen.8.d:0 "The emergency protocol has been successfully executed. Kuroko Special Forces have been immediately deployed to the front lines via high-priority Dimensional Gate channels. These units are ready for immediate combat engagement."
 kuroko_regen.8.a:0 "Excellent."

 kuroko_regen.9.t:0 "Kuroko Enhancement Protocol"
 kuroko_regen.9.d:0 "The Anubis Archive has detected optimal conditions to enhance the Kuroko Special Forces. Applying advanced combat protocols can significantly improve combat efficiency, but it requires substantial Command Power."
 kuroko_regen.9.a:0 "Enhance Units! (Command Power -75)"
 kuroko_regen.9.b:0 "Current capabilities are sufficient."

 kuroko_regen.10.t:0 "Kuroko Unit Enhancement Complete"
 kuroko_regen.10.d:0 "The enhancement protocol has been successfully applied to the Kuroko Special Forces. Combat efficiency has been greatly improved through advanced tactical subroutines and reinforced equipment configurations."
 kuroko_regen.10.a:0 "Perfect."

 kuroko_regen.11.t:0 "Kuroko Reinforcement Protocol"
 kuroko_regen.11.d:0 "The Dimensional Gate network has reached peak stability, allowing for the deployment of additional Kuroko Special Forces. This opportunity will significantly expand our elite unit capacity."
 kuroko_regen.11.a:0 "Deploy Additional Units! (Command Power -100)"
 kuroko_regen.11.b:0 "One unit is enough for now."

 #Tooltips and Effect Descriptions
 kivotes_kuroko_add1_tt:0 "Unlock 1 §YKuroko Special Forces§! slot"
 kuroko_regen_system_tooltip:0 "The §YKuroko Regeneration System§! automatically restores lost Kuroko units within 180 days"
 kuroko_emergency_summon_tooltip:0 "Use an emergency protocol to spend 50 §YCommand Power§! and immediately summon a new §YKuroko Special Forces§! unit"
 kuroko_enhancement_tooltip:0 "Spend 75 §YCommand Power§! to enhance current Kuroko units with advanced combat protocols"
 kuroko_reinforcement_tooltip:0 "Spend 100 §YCommand Power§! to summon an additional §YKuroko Special Forces§! unit"