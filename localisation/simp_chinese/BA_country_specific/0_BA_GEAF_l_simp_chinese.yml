l_simp_chinese:
 GEK_replace_mefo_bills_with_recovering_economy_tt: "赋予以下效果 §Y$GER_recovering_economy_modifier$§!"                               
 GEAF_Mefo_return: "重启梅福券"
 GEAF_Mefo_return_desc: "我们需要将我们拥有的货币资产现在转化成实物产业。通过这种方式，我们着手德国经济的复苏，并开始进行实质性的经济活动"
 GEAF_prioritize_economic_growth: "经济增长优先"
 GEAF_prioritize_economic_growth_desc: "多年疏忽的财政政策几乎毁了我们的经济。我们必须制造拖拉机而不是坦克，分发铲子而不是步枪，优先发展经济而不是扩大军工产业！"
 GEAF_currency_reforms: "货币改革"
 GEAF_currency_reforms_desc: "经济复苏的第一步是推行全面的货币改革。"
 GEAF_lower_taxes: "减税"
 GEAF_lower_taxes_desc: "对我们民众的税收负担逐渐变得越来越沉重，以支付重新武装计划的费用。通过减轻这一负担，我们可能会在短期内失去国家收入，但人们将能够花费更多辛苦赚来的钱。"
 GEAF_workers_rights: "工人权利"
 GEAF_workers_rights_desc: "过去几年里，工会发生了根本性的变化，已与过去截然不同。通过改革，我们可以团结工人并从中获益。"
 GEAF_abolish_price_controls: "取消物价管制"
 GEAF_abolish_price_controls_desc: "为了支持重新武装实施的价格控制措施正在扼杀经济。取消这些措施可能会减少国家资金，但将使人们能够创办新企业并盘活经济。"
 GEAF_increased_trade: "增进贸易"
 GEAF_increased_trade_desc: "如果德国人民要繁荣昌盛，我们必须引进我们在自己边界内无法提取或制造的东西。我们必须向外看，与其他国家签订新的贸易协议——当然是有利于我们的协议。"
 GEAF_housing_developments: "住房开发计划"
 GEAF_housing_developments_desc: "我们可以通过启动住房开发计划来振兴经济，旨在翻新和创建现代住宅，并设立新的生活标准。"
 GEAF_invest_in_vereinigte_stahlwerke: "投资联合钢铁公司"
 GEAF_invest_in_vereinigte_stahlwerke_desc: "联合钢铁公司是我们最大、最重要的钢铁生产商之一。向该公司投入资源肯定会提高生产力，并改变德国钢铁工业。"
 GEAF_industrial_expansion: "工业扩张"
 GEAF_industrial_expansion_desc: "拥有能在国际上竞争并引领新技术的强大工业对我们的持续增长至关重要。[ROOT.GetNameDefCap]将成为品质的代名词。"
 GEAF_agricultural_reforms: "农业改革"
 GEAF_agricultural_reforms_desc: "我们的农业部门大多由小规模、家庭经营的农场组成，他们从事大量的体力劳动。我们可以通过引入现代设备并提高每个农场的生产产出来改革整个农业部门。我们的整个国家都将从中受益！"
 GEAF_urbanization: "城市化"
 GEAF_urbanization_desc: "农业中现代机械的引入已经释放了许多人力，这些人现在涌向城市寻找新的就业机会。这些人可以在我们的工厂中发挥作用，继续使我们的经济成为世界上最强大的经济之一。"
 GEAF_wirtschaftswunder: "经济奇迹"
 GEAF_wirtschaftswunder_desc: "我们所有振兴经济的计划和举措终于取得了成效！世界各地的人们对我们的金融和工业复苏感到敬畏，称之为“经济奇迹”。"
 GEAF_mass_production: "大规模生产"
 GEAF_mass_production_desc: "随着我们最近在工业进步方面取得的成就，我们已经学到了很多关于生产方式的知识。我们应该将所有这些新发现的知识和理解应用于精简我们的装配线，并以前所未有的规模生产材料。"
 GEAF_build_defense_industry: "建设国防工业"
 GEAF_build_defense_industry_desc: "在终于能够稳定甚至大幅增强我们的经济之后，我们现在可以将注意力转向保障我们国家的主权并建立一个适当的国防工业，保障德国人民的勤奋精神和对进步及卓越的追求。"
 GEAF_war_production: "战时生产"
 GEAF_war_production_desc: "战争再次将我们卷入其中，但我们不会屈服，我们不会倒下！我们将动员我们的工业力量，去打到任何敢于认为他们可以压垮德国人民坚不可摧的意志的敌人！"
 GEAF_construct_the_reichsautobahn: "建设[GetAutobahnName]"
 GEAF_autobahn_fascism: "国家高速公路"
 GEAF_autobahn_neutral: "帝国高速公路"
 GEAF_autobahn_democratic: "高速公路"
 GEAF_autobahn_communism: "人民高速公路"
 GEAF_construct_the_reichsautobahn_desc: "$GER_autobahn_desc$"
 GEAF_kdf_wagen_factories: "[GetKfdWagenNames]"
 GEAF_kdf_wagen_factories_fascist: "力量来自欢乐汽车厂"
 GEAF_kdf_wagen_factories_neutral: "威廉汽车厂"
 GEAF_kdf_wagen_factories_volkswagen: "大众汽车厂"
 GEAF_kdf_wagen_factories_desc: "[GetKDFFactoriesText]"
 GEAF_kdf_wagen_factories_autarky_text: "$GER_kdf_wagen_desc$" #old loc
 GEAF_kdf_wagen_factories_economic_growth_text: "随着新的[GetAutobahnName]建成，我们必须让它们装满汽车。为了成为一个真正繁荣和现代化的经济体，我们需要建设工厂来生产这些汽车，同时创造就业机会。"
 GEAF_expand_the_reichsautobahn_south: "扩建南部[GetAutobahnName]"
 GEAF_expand_the_reichsautobahn_south_desc: "向南扩建高速公路网络将刺激该区域的经济增长和发展。它还能快速向阿尔卑斯山运送部队，加强我们的军事能力。"
 GEAF_expand_the_reichsautobahn_south_tt: "如果§Y[ROOT.GetName]§!或德国的一个附属国控制这些地区，在以下地区添加§G1§!点§Y$infrastructure$§!：§Y[53.GetName]§!、§Y[52.GetName]§!、§Y[152.GetName]§!、§Y[4.GetName]§!，并从§Y[53.GetName]§!到§Y[4.GetName]§!增设§Y1§!级铁路。当前效果："
 GEAF_expand_the_reichsautobahn_east: "扩建东部[GetAutobahnName]"
 GEAF_expand_the_reichsautobahn_east_desc: "将高速公路网络扩展到东普鲁士将展示我们国家再次将最东部地区与[ROOT.GetNameDef]其余部分连接和统一的决心。这也将使我们在需要时能够更快、更猛烈地向东发动攻击。"
 GEAF_expand_the_reichsautobahn_east_tt: "如果§Y[ROOT.GetName]§!或德国的一个附属国控制这些地区，在以下地区添加§G1§!点§Y$infrastructure$§!：§Y[68.GetName]§!、§Y[63.GetName]§!、§Y[807.GetName]§!、§Y[85.GetName]§!，并从§Y[63.GetName]§!到§Y[85.GetName]§!增设§Y1§!级铁路。当前效果："
 GEAF_develop_heraeus_facilities: "发展贺利氏研究设施"
 GEAF_develop_heraeus_facilities_desc: "投资新设施可以确保获得现代军事需求日益增长的贵金属。这些专业材料对于电子设备和高质量武器装备至关重要。"
 GEAF_build_the_rur_dam: "建造鲁尔水坝"
 GEAF_build_the_rur_dam_desc: "修建鲁尔大坝不仅仅是一项工程壮举——它是对未来的投资。大坝不仅将促进该地区的经济发展，还将助力我们的工业努力和生产产出。"
 GEAF_trade_deal_with_sweden: "与瑞典的贸易协议"
 GEAF_trade_deal_with_sweden_desc: "$GER_swedish_trade_agreement_desc$" #old loc
 GEAF_the_four_year_plan: "四年计划"
 GEAF_the_four_year_plan_desc: "$GER_four_year_plan_desc$" #old loc
 GEAF_autarky_efforts: "自给自足的努力"
 GEAF_autarky_efforts_desc: "$GER_autarky_desc$" #old loc
 GEAF_gain_autarkic_economy_lock_free_trade_tt: "§R锁定§!§Y$free_trade$§!和§Y$export_focus$§!。获得§Y$autarkic_economy$§!。"
 GEAF_improve_trade_relations_tt: "提升与现有和未来的§Y阵营成员§!的§Y贸易影响力§!"
 GEAF_institute_price_controls: "实施价格控制"
 GEAF_institute_price_controls_desc: "我们必须实施各种措施来加强对财政的控制，以支撑我们实现自给自足的雄心壮志。我们必须能够调节进口品、基本商品和工人工资的价格，以抑制通货膨胀并确保经济稳定。"
 GEAF_unlock_price_controls_decision_tt: "解锁决议：§Y$GER_price_controls_cat$§!，可以降低§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§!"
 GEAF_industrial_consumer_goods_factor_limit_tt: "§Y[GetIndustrialModifier]§!的$MODIFIER_CONSUMER_GOODS_FACTOR$§R低于§!§Y90%§!"
 GEAF_establish_the_reichswerke: "建立$GER_reichswerke$"
 GEAF_establish_the_reichswerke_desc: "$GER_hermann_goring_werke_desc$" #old loc
 GEAF_unlock_reichswerke_tt: "解锁工业企业§Y$GER_reichswerke$§!"
 GEAF_seize_foreign_industries: "兼并外国工业"
 GEAF_seize_foreign_industries_desc: "通过将外国工业整合到我们的经济中，我们确保了支持我们战争努力和生产的重要资源。"
 GEAF_coal_liquefaction: "煤液化"
 GEAF_coal_liquefaction_desc: "$GER_coal_liquidization_desc$" #old loc
 GEAF_subsidize_hoesch_benzin: "资助霍施-本钦公司"
 GEAF_subsidize_hoesch_benzin_desc: "曾经有句话说，军队靠胃部行军，但现代军队依赖燃料。为了维持我们的军事能力，我们必须加大合成燃料的生产力度。"
 GEAF_establish_buna_werke: "建立布纳工厂"
 GEAF_establish_buna_werke_desc: "由于我们在德国本土没有橡胶资源，而大规模的机械化和航空需要大量橡胶。为了减少对外贸的依赖，我们必须建立工厂生产合成橡胶。"
 GEAF_autarky_achieved: "实现自给自足"
 GEAF_autarky_achieved_desc: "我们终于实现了成为完全自给自足的雄心勃勃的目标！我们的国家已经充满了丰富的自然资源，这将进一步增强我们的实力——使我们无坚不摧！"
 GEAF_improve_autarkic_economy_tt: "改善§Y$autarkic_economy$§!"
 GEAF_accelerate_the_rearmament_program: "加速军备重整计划"
 GEAF_accelerate_the_rearmament_program_desc: "我们必须打破《凡尔赛条约》的枷锁，让工业的铁砧锻造[ROOT.GetNameDef]的辉煌命运。每一辆生产的坦克，每一架组装的飞机，都将成为德国人民不屈意志的见证。"
 GEAF_concentrated_armament_program: "集中军备计划"
 GEAF_concentrated_armament_program_desc: "我们的工业必须支持我们重新武装国家的军事需求。必须启动一项全面的军备重整计划，迅速现代化和扩展我们的武装力量！"
 GEAF_establish_production_targets: "设立生产指标"
 GEAF_establish_production_targets_desc: "在发动任何军事行动之前，我们必须首先让我们的武装力量现代化并配备装备。为了提高产量，我们必须实行限额，并设立雄心勃勃的生产指标。"
 GEAF_prioritize_the_army: "优先发展陆军"
 GEAF_prioritize_the_army_desc: "德国及其前身普鲁士一直是陆上强国，依靠陆军维护我们的主权和安全。我们必须重新调整我们的工业重心，确保我们的陆军装备精良，能够征服任何敌人。"
 GEAF_prioritize_the_navy: "优先发展海军"
 GEAF_prioritize_the_navy_desc: "如果我们想扩张我们的疆域，控制海洋将至关重要。我们必须优先发展海军，使其在规模和力量上能与任何敌方舰队匹敌。"
 GEAF_extra_funds_to_waffenamt: "拨付额外资金给武器署"
 GEAF_extra_funds_to_waffenamt_desc: "武器署负责监督军事装备的设计和发展。它与武器制造商和研究机构合作，通过拨付额外资金，我们可能会加快进度。"
 GEAF_zentrale_planung: "成立中央计划局"
 GEAF_zentrale_planung_desc: "战争暴露了我们军备建设的不足，这是我们必须解决的问题！通过成立一个由政府、工业和军方成员组成的中央规划局，我们可以协调经济政策，并有效地重新分配资源，以增强我们的武器生产，支持我们的国家目标和军事霸权。"
 GEAF_criteria_for_economy_laws_tt: "启用§Y$partial_economic_mobilisation$§!，将会在经济法可用时更改为§Y$war_economy$§!。"
 GEAF_create_rustungsstab: "创建武装部队司令部"
 GEAF_create_rustungsstab_desc: "我们简化武器制造的努力已经取得了成功，但还需要进一步改进！创建一个武装部队司令部将使我们能够制定策略来分配资源和优先考虑项目，以增加我们的武器生产。"
 GEAF_armament_rationalization: "武器合理化"
 GEAF_armament_rationalization_desc: "我们的生产线几乎跟不上我们武装部队的需求。我们必须实施武器合理化措施，提高我们的工业战争机器的效率和效果。"
 GEAF_totaler_krieg: "总体战"
 GEAF_totaler_krieg_desc: "为了取得全面胜利，我们必须动员全社会，把全面战争带到敌人家门口。[ROOT.GetNameDef]是时候起来了，让风暴爆发吧！"
 GEAF_gain_totaler_krieg_remove_total_mob_tt: "§R移除§!§Y$tot_economic_mobilisation$§!。获得§Y$totaler_krieg_economy$§!。"
 ########
 GE1_start_focus: "统一西德意志"
 GE1_start_focus_desc: "因为我们的军事行动上的成功，我们的军队已经统一了西德意志，现在是时候重新召集过去的政府官员了。"
 GE2_start_focus: "统一东德意志"
 GE2_start_focus_desc: "因为我们的军事行动上的成功，我们的军队已经统一了东德意志，现在是时候重新召集过去的政府官员了。"
 GE1_reorganize_nationale_volksarmee: "重建国家人民军"
 GE1_reorganize_nationale_volksarmee_desc: "我们军队中仍然存在腐败甚至是暴徒。为了防止反抗和叛乱，我们必须从我们中间清除这些叛徒。由于军队工作中出现了很大的漏洞，为了保障人民的安全，我们必须任命忠诚的将领来指挥我们勇敢的士兵。"
 GE1_monarchist_sentiment: "提升军国主义情绪"
 GE1_monarchist_sentiment_desc: "我们的人民“想要”君主制，我们就给他们君主制。尽管我国仍处于临时政府阶段，但德国人需要一个凯撒大帝是显而易见的。"
 GE2_return_of_the_kaiserreich: "德意志帝国的复兴"
 GE2_return_of_the_kaiserreich_desc: "在我们统一后，发生了许多出乎意料的事，现在追随我们的人希望恢复一战时的军国主义状态，并发誓将付诸努力重新建立德意志帝国。"
 GE2_start_the_proletarian_revolution: "发动无产阶级革命"
 GE2_start_the_proletarian_revolution_desc: "在我们国家统一了西德意志地区后，我们便拉开了无产阶级革命的幕布。同志们，我们已经走在革命的最前沿，人类的曙光已经显现。\n§R全世界无产者，联合起来！§!"

 GE2_ambition_for_the_west: "向西！为了祖国！"
 GE2_ambition_for_the_west_desc: "德国人民渴望祖国统一的愿望愈发蓬勃，我们的祖国大地已被异界人占领许久，我们再也无法忍受下去，向西去，解放我们的祖国，我们的人民！"
 GE2_united_homeland: "重组我们的家园"
 GE2_united_homeland_desc: "东德意志战火已经近乎平息，德意志的土地疮痍满面，我们必须重新让她焕发容光！"
 GE2_ideological_war: "意识形态竞争"
 GE2_ideological_war_desc: "孙子曰：“谋略至上，不战而胜。”"
 GE2_polish_border_adjustments: "解决德波边境问题"
 GE2_polish_border_adjustments_desc: "按照凡尔赛条约，我们现在是非法占有了波兰的土地，尽管它曾经属于我们。为了避免矛盾进一步演化，我们得尽快解决这个问题。"
 GE2_agreement_with_the_soviet_union: "与苏联交好"
 GE2_agreement_with_the_soviet_union_desc: "我们很有自知之明，波兰和它的狐朋狗友们根本无法扳倒东方的红色巨人，我们理应和苏联结盟，这是为了德国长远的利益。"
 GE2_watching_the_east: "面对东方的敌人"
 GE2_watching_the_east_desc: "又能怎么样？苏联表面上看起来很庞大，但只要我们共同给它踹上一脚，它便会轰然倒塌，是时候向波罗的海地区和波兰发送合作了。"
 GE2_partition_of_poland: "瓜分波兰"
 GE2_partition_of_poland_desc: "我们是不会放弃曾经的土地的，我们必须同苏联一起教训这自不量力的波兰。"
 GE2_western_offensive: "埋葬异乡人"
 GE2_western_offensive_desc: "她们亲手葬送了我们的祖国，我们也将亲手埋葬她们的学院......"
 GE2_german_unification: "东方欲晓"
 GE2_german_unification_desc: "我们胜利了！"
 GE1_german_unification: "莱茵河奇迹"
 GE1_german_unification_desc: "我们胜利了！"
 GEAF_german_unification: "宣布德意志统一"
 GEAF_german_unification_desc: "经过我们艰苦卓绝的努力，德意志祖国再次回到了世界地图上。现在，是时候向全世界宣布德国的重生了。"

 GE1_maginot_line_garrison_issue: "马奇诺防线的问题"
 GE1_maginot_line_garrison_issue_desc: "一战后，我们向法国割让了土地。现在，法国带着他们的人在非洲吃沙子去了，仅仅只有一部分残党在阿尔萨斯-洛林镇守着堡垒。是时候收回我们的领土了。"
 GE1_western_unification: "平息叛乱"
 GE1_western_unification_desc: "曾经哪些戴着光环的异界人仍不死心，她们甚至仍可能在某些巷子角落里密谋着推翻我们的统治，我们必须重拳出击！"
 GE1_attack_on_luxembourg: "进攻卢森堡"
 GE1_attack_on_luxembourg_desc: "卢森堡正由另一波异界人掌控着，如果不清除掉它，将会对我们造成很大的危害。"
 GE1_cooperation_with_luxembourg: "与卢森堡合作"
 GE1_cooperation_with_luxembourg_desc: "尽管卢森堡也由异界人控制着，但她们似乎并没有对我们产生敌意，与她们合作是不二之选。"
 GE1_attracting_defense_investment_from_western_allies: "争取西方支持"
 GE1_attracting_defense_investment_from_western_allies_desc: "仅凭靠百废待兴的祖国土地是不足以完成我们的统一大业的，我们必须争取西方未沦陷地区国家的支持。"


 GEAF_student_collaborator_category: "学生合作者"
 GEAF_pandemonium_invitation: "邀请万魔殿的学生"
 GEAF_perfect_team_invitation: "邀请格黑娜风纪委员会的学生"
 GEAF_club_invitation: "邀请各社团的学生"

