 #國策
 YUG_western_focus:0 "摄政委员会"
 YUG_western_focus_desc:0 "摄政保罗亲王的亲德政策，随着德国灭亡而告终，但摄政不应就此结束。彼得二世尚且年幼，不适宜治理国家。因此，我们将透过摄政委员会，来弥补受损的摄政权威。"
 YUG_expand_the_university_of_ljubljana:0 "支持研究"
 YUG_expand_the_university_of_ljubljana_desc:0 "必须支持国内研究以促进技术发展，才能守护我国免受侵略者侵犯。"
 YUG_establish_the_banovina_of_croatia_desc:0 "应在克罗埃西亚设立自治省级机构，借此分化克罗埃西亚民族主义势力，从而瓦解他们。"
 YUG_evolution:0 "控制"
 YUG_join_axis:0 "向义大利靠拢"
 YUG_join_axis_desc:0 "许多人目睹了我们传统盟友法国，在欧洲大陆惨遭驱逐的过程。若在过去，我们与义大利建立外交同盟关系几无可能；但在当前形势下，将无人能够反对，而这也将是守护南斯拉夫的最后选择。"
 YUG_united_kingdom_tt:0 "可对 §Y[SER.GetNameWithFlag]§!、§Y[SLV.GetNameWithFlag]§!、§Y[CRO.GetNameWithFlag]§!、§Y[MNT.GetNameWithFlag]§!、§Y[KOS.GetNameWithFlag]§!、§Y[BOS.GetNameWithFlag]§!、§Y[HRZ.GetNameWithFlag]§!、§Y[MAC.GetNameWithFlag]§!、§Y[TRA.GetNameWithFlag]§!、§Y[HUN.GetNameWithFlag]§!、§Y[BUL.GetNameWithFlag]§! 等国的 §Y核心州§!，新增我国的 §Y核心州§!。"

 #事件
 YUG_event.1.t:0 "反法西斯人民阵线"
 YUG_event.1.d:0 "我们在名义上主张人民阵线，实际上也有少数团体参与其中。日后势必有所帮助。"
 YUG_event.1.a:0 "但人数太少了。"
 YUG_event.2.t:0 "清洗反对派"
 YUG_event.2.d:0 "党内存在一些反对派，他们受反动势力的绥靖政策影响，主张改革而非革命。我们将把他们连同布哈林主义者，一同『派遣』到苏联去。"
 YUG_event.2.a:0 "永别了，同志们... 永远..."
 YUG_event.3.t:0 "王室的终结"
 YUG_event.3.d:0 "旨在终结反动封建王权的大革命成功，多数王室成员因革命突如其来，未能逃往海外。应如何处置他们？"
 YUG_event.3.a:0 "处决王室。"
 YUG_event.3.b:0 "驱逐王室出境。"
 YUG_event.3.c:0 "没收王室财产，让他们作为平民生活。"
 YUG_event.5.t:0 "南斯拉夫的支援提议"
 YUG_event.5.d:0 "一直支援我们革命的南斯拉夫，提出了直接介入的提议。我们可以接受此提议，以达成革命。"
 YUG_event.5.a:0 "接受提议。"
 YUG_event.5.b:0 "我们不是傀儡。"
 YUG_event.6.t:0 "革命的代价"
 YUG_event.6.d:0 "南斯拉夫一面赞扬我们和平的政权更迭，一面发来公文，要求我们彻底根除国内的反对势力。我们可以遵从南斯拉夫的指令行动，也可以与之为敌。"
 YUG_event.7.d:0 "[YUG.GetAdjective] 政府向我方提议，为增进巴尔干半岛诸民族间的理解与合作，应由中央政府主导完成巴尔干半岛的统一。根据 [YUG.GetLeader] 的说法，此举将是巴尔干联邦伟大的最终阶段，能让过往的冲突烟消云散，永久保障各国间的整合与和平。\n[YUG.GetNameDef] 方正在等待 [ROOT.GetAdjective] 政府的答覆，以推动巴尔干联邦的统一。"
 YUG_event.10.d:0 "[FROM.GetAdjective] 政府拒绝了在维持两国间同盟的同时，加入联合巴尔干联邦。\n然而，[FROM.GetLeader] 方公开主张，[FROM.GetAdjective] 的拒绝将可检验南斯拉夫政府的真实意图——究竟联邦的隐藏目的是将南斯拉夫国界扩张至想像之外的范围，抑或南斯拉夫确实不计任何加盟条件，只为追求一个统一的巴尔干社会主义共和国。无论如何，[FROM.GetNameDef] 方绝不会放弃独立或文化认同。"

 YUG_event.11.t:0 "[From.GetNameDefCap] 向法西斯国家靠拢" #DOD_yugoslavia.70
 YUG_event.11.desc:0 "今日，[From.GetLeader] 致电 [Root.Capital.GetName]，表示有兴趣与法西斯势力签署互不侵犯条约。在其国内，因恐惧 [SOV.GetAdjective] 的侵略与日益高涨的民族主义，[From.GetLeader] 试图使 [From.GetLeader.GetHerselfHimself] 与 [Root.GetNameDef] 保持一致。尽管这并不意味着正式的同盟，但它将把 [From.GetNameDef] 拉入我们的势力范围，并促进 [From.GetAdjective] 进入 [Root.GetFactionName] 的进程。"
 YUG_event.111.t:0 "[From.GetNameDefCap] 的反对！"
 YUG_event.111.tripartite_rejection:0 "[From.GetLeader] 对于 [Root.GetAdjective] 提出的与法西斯国家缔结互不侵犯条约的建议，表示他们「有其他想法」，并拒绝了此提议。 "
 YUG_event.111.allied_objection:0 "我们向法西斯国家靠拢的决定，在国内外引发了深刻争议，并动摇了担任彼得二世摄政的 [Root.GetLeader] 的权力正当性。南斯拉夫军队中的军官们宣布彼得二世已经成年，并在 [From.GetAdjective] 的支持下向贝尔格勒进军，要求 [Root.GetLeader] 立即下台。 "
 YUG_event.111.allied_objection_no_best:0 "[From.GetLeader] 对我们推行的外交政策表示严重关切。 "
 YUG_event.111.a:0 "只能接受了。 "
 YUG_event.111.b:0 "战斗准备！ "
 YUG_event.111.c:0 "无视他。 "
 YUG_event.112.t:0 "[From.GetNameDefCap] 与法西斯签署互不侵犯条约"
 YUG_event.112.desc:0 "[YUG.GetAdjective] 政府今日与法西斯国家共同签署了互不侵犯条约。虽然这尚不意味着 [YUG.GetNameDef] 加入 [From.GetFactionName]，但此举显示 [YUG.GetLeader] 可能日益同情法西斯，并对两国增强忠诚。许多人期待 [Root.GetAdjective] 对此令人忧心的发展作出回应，但迄今为止，[Root.GetLeader] 仅以沉默应对。 "
 YUG_event.112.a:0 "[YUG.GetLeader]，这个懦弱的杂种！ "
 YUG_event.112.b:0 "似乎无需在意。 "

 YUG_event.12.t:0 "[From.GetNameDefCap] 宣誓效忠"
 YUG_event.12.desc:0 "[YUG.GetAdjective] 政府已向我方请求保护。他们以允许大规模干涉内政为代价，请求 [ROOT.GetAdjective] 的保护。"
 YUG_event.12.a:0 "欢迎你，[YUG.GetLeader]。"
 YUG_event.12.b:0 "无视他。"

 YUG_event.121.t:0 "[From.GetAdjective] 接受！"
 YUG_event.121.desc:0 "我方提出的保护请求，[From.GetAdjective] 方经过深思熟虑后，已确认将提供保护。"
 YUG_event.121.a:0 "罗马的天空真清澈"

 YUG_event.122.t:0 "[From.GetAdjective] 拒绝！"
 YUG_event.122.desc:0 "我方提出的保护请求，[From.GetAdjective] 方似乎已决定拒绝。"
 YUG_event.122.a:0 "唉"

 YUG_event.13.t:0 "迈向共和国之路"
 YUG_event.13.desc:0 "德国垮了。\n在异界侵略面前，这个曾觊觎欧洲霸权的国家，消失得无影无踪；而依附其阴影下的保罗亲王的亲德政策，也随之烟消云散。\n\n军队进入紧急状态，残余兵力的大多数，已开赴斯洛维尼亚抵御异界威胁。\n\n年幼的国王保持沉默，王冠已无法再命令任何人。\n\n我不得不问。\n这个王政，何时曾守护过我们？\n这个王室，何时曾代替人民承受过痛苦？\n\n如今这片土地没有权威，唯有空白。\n而空白，将属于最先伸出手的那个人。\n\n历史正注视着我们。\n是要紧抓这个以国王之名苟延残喘的旧国家，\​​n还是要在倾颓的王座之上建立共和国？\n\n犹豫即是败北。\n今天，我们必须做出选择。"
 YUG_event.13.a:0 "历史是胜利者的记录。"

 YUG_event.14.t:0 "人民阵线"
 YUG_event.14.desc:0 "他们问道。\n为何我们有着不同的名字，为何我们举着不同的旗帜。\n\n但更重要的问题是这个。\n是谁在命令我们？\n又是谁靠着我们的饥饿维生？\n\n工厂里的工人，营房里的士兵，\n街头上的失业者，都在各自的位置低着头。\n他们都被教导彼此不同，\n但却接受着同样的命令，面对着同样的枪口。\n\n有人说。\n现在不是团结的时候。\n必须先分清是非对错。\n\n然而，分裂总是自上而始，\n而代价却总是自下而偿。\n\n今天，我们必须选择。\n是要以各自的名义迎接失败，\n还是要在统一的队伍下共同面对。"
 YUG_event.14.a:0 "加入工人统一战线吧。因为你也是劳动者！"

 YUG_event.15.t:0 "大字报"
 YUG_event.15.desc:0 "国王沉默，人民流泪\n\n摄政以国王之名统治。\n然而，无人承担责任。\n\n王政谈论秩序，\n但我们只见监狱与审查。\n​​\n是谁毁了这个国家？\n是王室。\n是保王党。\n是庇护他们的摄政。\n\n我们不再是臣民。\n这片土地不属于国王，\n而属于人民。\n\n打倒摄政！\n废除王政！\n建立共和国！"
 YUG_event.15.a:0 "代表无名的劳动者、农民、士兵与人民大众。"

 YUG_event.16.t:0 "摄政的一天"
 YUG_event.16.desc:0 "车行缓慢。\n在红绿灯前稍作停顿。\n我望向窗外。熟悉的街道，熟悉的表情。\n\n我以为这点维安足够了。\n不，正确来说，是我希望足够了。\n\n车窗开着。\n空气流入。\n思绪短暂地松懈。\n一声短促而尖锐的声响。\n这不只是单纯的爆炸。\n也不是警告。\n这是有明确意图的声音。\n\n胸口首先反应过来。\n然后疼痛才传来。\n我试图抓住什么，但双手无力。\n\n枪声又响了一次。\n玻璃龟裂。\n传来护卫的叫喊，但无法解读成话语。\n\n车子紧急移动。\n然而，我已经无法动弹。\n\n视野降低。\n看见地面，\n深红色的斑点在散落的文件上晕开。\n\n那些以国王之名写就的文章。\n我的血，滴落在那些文字之上。\n\n我不是国王。\n这点很明确。\n\n那么，这血究竟为了守护什么而流？\n\n思绪未能走到尽头。\n比枪声更寂静的沉默，覆盖了一切。"
 YUG_event.16.a:0 "早知道就看画了..."

 YUG_event.17.t:0 "分裂"
 YUG_event.17.desc:0 "传来椅子拉开的声音。\n有人从座位上站了起来。\n\n「王政已经垮台。但为何改革总是停滞不前？」\n\n一阵骚动，但他并未停止。 \n\n「土地改革延期，工会罢工遭镇压，旧王室官僚却以『经验』之名继续存活。」\n「这是偶然吗？还是因为这房间里，还有至今仍不愿与保王党切断关系的人？」\n\n有人试图抗议，但声音被淹没。 \n\n「拒绝全面改革者，无论意图为何，其结果都是在帮助王政。」\n\n他按住桌子。 \n\n「现在就下决断。是要与人民同行，还是要与王冠的残骸一同消失。」\n\n会议室只剩一片沉默。 "
 YUG_event.17.a:0 "右翼势力背叛了人民阵线！ "

 YUG_event.18.t:0 "义大利入侵"
 YUG_event.18.desc:0 "收音机只报导了事实。 \n义大利军已越过边境。 \n\n城市短暂地停顿。 \n工厂机器关闭，\n商店结帐延迟，\n街上的人们反覆确认着同一则消息。 \n\n军营中传来命令。 \n没有说明理由。 \n但无人追问。 \n因为所有人都知道，战争一旦开始，提问就是种奢侈。 \n\n乡下话语不多。 \n战争并非新鲜事。 \n只是这次，它来得更近。 \n年轻人面面相觑，\n老人们回想起过去的战争。 \n\n官厅与办公室里，文件快速流动。 \n盖章，电话铃声不断。 \n有人忧心国家，\n有人忧心体制，\n有人只是忧心明天。 \n\n有人愤怒，\n有人认命，\n有人默默准备。 \n\n明确的事实是，义大利的入侵，将改变这个国家所有人的日常。 "
 YUG_event.18.a:0 "既已开始，必将奋战到底。 "

 YUG_event.19.t:0 "对义大利宣战"
 YUG_event.19.desc:0 "决定并不漫长。 \n会议很短，文件更短。 \n\n对义大利宣战案通过了。 \n\n电报即刻发出，外交文书封缄，地图上的界线从此失去意义。 \n\n消息在城市中迅速传开。 \n有人点头，有人久久凝视窗外。 \n战争虽才开始，但人们早已知道战争终将降临。 \n\n军营中的态势改变。 \n警戒变成命令，等待变成移动。 \n士兵们不再提问。 \n因为宣言已使战争化为现实。 \n\n乡间，钟声与收音机同时响起。 \n战争就在不远处，这个事实首次变得清晰。 \n\n官厅与办公室，深夜仍灯火通明。 \n战争不再只是外交问题，而是需要国家全部机能应对的大事。 \n\n这个决定，不为体制，不为理念。 \n\n它只是对一个单纯事实的回答。 \n\n边界已被突破，如今别无选择。 \n\n明确的事实是，对义大利的战争，将改变这个国家所有人的日常。 "
 YUG_event.19.a:0 "这场战争将决定一切。 "

 YUG_event.20.t:0 "胜利，之后"
 YUG_event.20.desc:0 "我们胜利了。 \n\n从塞尔维亚的乡村，从波士尼亚的山区，从克罗埃西亚与斯洛维尼亚的城市，我们将义大利军逐出。 \n\n我们翻越阿尔卑斯山与皮亚韦河，占领了威尼斯、热那亚、波隆那、佛罗伦斯。 \n\n最终，我们占领了义大利的首都，那数千年欧洲文明的中心——罗马。 \n\n义大利全境飘扬着我们的国旗，贝尔格勒正举行阅兵式，我们的青年将返乡。 \n\n然而，这一切胜利并非平白获得。 \n\n墓园已无虚位，医院伤患满盈。 \n\n城市遭义大利轰炸摧毁，父母失其子，子失其父母。 \n\n没有人能回到战前。 \n\n无论那曾经是好是坏。 "
 YUG_event.20.a:0 "万物皆变，但我们终究是胜利了。 "

