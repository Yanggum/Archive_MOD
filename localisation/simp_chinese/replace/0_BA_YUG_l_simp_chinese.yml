 #開局介紹
 YUG_country_intro_header:0 "混乱的南斯拉夫人之地"
 YUG_country_intro_content:0 "自南斯拉夫建国以来，恐怕很少有人会说这个国家在外部或内部是平静的。\n这个打着团结南斯拉夫人名号建立的国家，南斯拉夫，与其「南斯拉夫人之地」的名称相反，其内部问题相当严重。 \n即便是美丽的颜料，一旦混合起来也会变成黑色。 \n克罗埃西亚人、斯洛维尼亚人、波士尼亚人、蒙特内哥罗人、马其顿人，还有塞尔维亚人，拜民族问题与各种难题所赐，南斯拉夫连喘息的时间都没有。 \n与马其顿人的对立、兴起的斯洛维尼亚民族主义、克罗埃西亚极右组织乌斯塔沙的活动，南斯拉夫正在内部燃烧。 \n1934年，国王亚历山大一世遭暗杀，他的兄弟保罗亲王，为年仅11岁的彼得二世担任摄政。 \n保罗亲王试图向觊觎南斯拉夫这块蛋糕的德国靠拢，以期稍微延长王国的寿命。 \n直到异界侵略者出现为止。 \n突如其来的存在们，摧毁了德国与法国，而勉强撑住的英国，也正准备流亡加拿大。 \n在这场天灾地变中，保罗亲王虽只能惊慌失措，但仍随即将军队部署至曾是奥地利领土的「山海经」边境地带。 \n南斯拉夫再次被抛入了战云密布的世界。 \n仍未解决的民族问题，使得南斯拉夫民众无力团结对抗侵略者；而依赖外国的我国经济，也在英、法、德被异界侵略者蹂躏后崩溃瓦解。 \n在此情况下，保罗亲王的权威摇摇欲坠，北方边境涌入大量难民，政治纷争更加剧烈。 \n在这南斯拉夫人之地，未来恐怕只有两种可能：要么在各种沉痾宿疾缠身下四分五裂，要么最终克服危机，坚持下去。 "
 YUG_guide:0 "- 请确立决定南斯拉夫未来的政治体制。 \n - 摄政委员会\n - 强化激进联盟（完成）\n - 驱逐法西斯总理-解散议会（制作中，可游玩）\n - 驱逐法西斯总理-修订宪法（制作中，不可游玩）\n - 建立共和国\n - 排斥左翼极端主义（制作中，不可游玩）\n - 承认共产主义政党（完成）\n- 请解决内部民族问题。 \n- 请从义大利等外国势力手中守护南斯拉夫。 \n- 请与异世界的人们和平共存，或是从他们手中解放欧洲人。 "

#新國策

 YUG_Establishment_of_the_Republic:0 "建立共和国"
 YUG_Establishment_of_the_Republic_desc:0 "保罗亲王的亲德政策，随着德国被异界侵略者灭亡而告终。在这混乱时期，我们的道路不是由无能的摄政与年幼不成熟的国王领导的王国，而是透过建立共和国来进行全面改革。"
 YUG_end_of_compromism:0 "拒绝妥协"
 YUG_end_of_compromism_desc:0 "温和派至今仍相信，王室能像大战时期那样正常运作。然而，大战之后，王室只会施行暴政、导致国家分裂，保王派也绝不会认同我们对民主的理想。我们不再与王室及其走狗妥协。因为其结局，只会是因背叛与分裂而导致的毁灭。"
 YUG_recognize_the_soviet_union:0 "承认共产主义政党"
 YUG_recognize_the_soviet_union_desc:0 "南斯拉夫共产主义者联​​盟曾被视为战后政府的主要威胁，因此遭政府强制解散。但他们可以成为我们共和国理想的同盟，为了建立共和国，我们将承认其为合法政党。"
 YUG_Creating_anti_monarchy_sentiment:0 "营造反王政情绪"
 YUG_Creating_anti_monarchy_sentiment_desc:0 "国王独裁体制数十年来阻碍了南斯拉夫的政治发展。在以整合多民族国家为名义下，王政打压反对派，瘫痪议会。我们将有组织地扩散反王政情绪，揭露君主制已不再能代表南斯拉夫人民的未来。"
 YUG_popular_front:0 "人民阵线"
 YUG_popular_front_desc:0 "南斯拉夫共产主义者联​​盟不仅仅是一个政党。他们拥有我们所不具备的地下斗争经验，以及在工厂和矿山深处扎根的工人细胞组织。若透过高举反法西斯、反王政旗帜的人民阵线与他们联合，我们将能共享其组织力与斗争经验，更有效地扩大反体制运动。"
 YUG_underground_organization_integration:0 "整合地下组织"
 YUG_underground_organization_integration_desc:0 "加入我们大业的政党和团体，各自拥有地下斗争组织。现在，将它们整合到单一指挥体系下，就能将分散的抵抗转化为有组织且有效的斗争。统一的命令与协同的行动，将使我们能对抗王政与法西斯势力，进行长期抵抗。"
 YUG_Assassination_of_the_Regent:0 "暗杀摄政"
 YUG_Assassination_of_the_Regent_desc:0 "那一天终于来临。我们的地下抵抗组织已扎根全国各地，只待信号。在南斯拉夫人民之间，对王室的失望与厌恶已达极点，摄政体制再也无法维持其统治的正当性。现在，是下决断的时刻。铲除摄政，透过全国性起义推翻旧有的王政体制。南斯拉夫的未来，将于今日，在街头与工厂中决定。"
 YUG_Establishment_of_the_Republic_Constitution:0 "制定共和国宪法"
 YUG_Establishment_of_the_Republic_Constitution_desc:0 "在摄政被铲除、全国革命之后，年幼的国王彼得二世不得不放弃继续统治。现在，我们将正式废除王政，制定基于万民平等与民主原则的共和国宪法。国王统治的南斯拉夫已死。一个由人民行使主权的新国家，将在此诞生；我们将透过这部宪法，宣告新时代的开始。"
 YUG_anti_rightist_struggle:0 "反右斗争"
 YUG_anti_rightist_struggle_desc:0 "共和国虽已建立，但支持王政的势力尚未完全消失。他们形成反动的右翼势力，勾结资本家、神职人员与地主，并持续对其他右翼政治势力施加影响。我们必须铲除他们的组织与根基，以守护革命成果，保障共和国的生存。在此过程中，虽不排除可能发生『无辜牺牲』，但放任革命的代价将远比这更大。"
 YUG_Seeking_support_from_the_Soviet_Union:0 "寻求苏联的支援"
 YUG_Seeking_support_from_the_Soviet_Union_desc:0 "苏联深知革命国家需要什么才能存活。若能获得其承认与支援，我们将能获取足以对抗内部反动与外部压力的实质力量。"
 YUG_Create_People_s_Army:0 "创建党军"
 YUG_Create_People_s_Army_desc:0 "南斯拉夫共产主义者联​​盟曾于1920年的制宪议会中获得超过八分之一议席，但因政府强制解散而丧失所有席次。共和国建立后，我们能保证这样的事情不再发生吗？为了避免重蹈覆辙，我们将渗透统一的指挥体系下的地下抵抗组织，掌控其指挥部以强化我们的控制权，并新建一支拥有独立秘密指挥体系的党军。"

 YUG_form_peasant_councils:0 "设立农民委员会"
 YUG_form_peasant_councils_desc:0 "为了建设平等的共和国，必须强化地方政治中贫农与小农的权力。透过设立农民委员会，我们能确保支持我们共和国理想的势力，并保障平等的土地所有权。"
 
 YUG_Purge_Reactionist_in_Party:0 "清洗党内反对派"
 YUG_Purge_Reactionist_in_Party_desc:0 "目前党内存在反对我们理想的反对派。反对派与布哈林主义者勾结，攻击现任领导层，加剧党内分裂。我们将把他们送往莫斯科，以终结党内分裂。"
 YUG_workers_republic:0 "劳动者共和国"
 YUG_workers_republic_desc:0 "随着南斯拉夫共产主义者联​​盟的政治影响力扩大，舆论更加认为议会内低估了其应得席位，工人与农民的罢工、示威和街头斗争正在全国展开。南斯拉夫共产主义者联​​盟将动员党军——游击队，以确保对全国的控制权。"
 YUG_With_Marshal_Tito:0 "与狄托元帅同行"
 YUG_With_Marshal_Tito_desc:0 "狄托作为党与党军的领导者，在我们夺取政权的过程中扮演了主导角色，证明了他的领导力。我们将推选他为我们共和国的总统。"
 YUG_federal_defense_council1:0 "联邦国防委员会"
 YUG_federal_defense_council1_desc:0 "共和国的军队由塞尔维亚裔将军们掌控。我们将透过设立联邦国防委员会，来削弱塞尔维亚将军参谋们的权力，确保晋升平等与更多元化的战略。"
 YUG_Peoples_Army_Reorganization:0 "重组党军"
 YUG_Peoples_Army_Reorganization_desc:0 "党军虽对我们夺取政权贡献良多，但它是将不同地下组织拼凑而成，命令体系与组织不够系统化，且许多人未受过充分训练。我们必须重组党军，使其成为一支高效、训练有素的强大军队。"
 YUG_Partisan_War_Tactics:0 "游击战术"
 YUG_Partisan_War_Tactics_desc:0 "我们自1920年代起积累了持续的地下斗争经验，而南斯拉夫的地形非常适合游击活动。我们必须利用我们的经验与地形，制定相关教条，为即便侵略者占领我国领土时，也能持续抵抗奠定基础。"
 YUG_Last_of_Royal_family:0 "王室的终结"
 YUG_Last_of_Royal_family_desc:0 "我们已推翻无能的卡拉乔杰维奇王朝，在南斯拉夫建立了劳动者共和国，现在必须决定他们的去留。"
 YUG_Brotherhood_And_Unity:0 "兄弟情谊与团结"
 YUG_Brotherhood_And_Unity_desc:0 "兄弟情谊与团结是关于南斯拉夫各民族与少数民族关系的官方政策，平等对待所有民族，鼓励和平地认识相似性与相互依存性，以克服民族冲突与仇恨。"
 YUG_Harmony_in_Religion:0 "宗教间的和谐"
 YUG_Harmony_in_Religion_desc:0 "南斯拉夫各民族长久以来受外族统治，接纳了统治国家的宗教。宗教对各民族的认同影响深远，若我们贸然攻击宗教，将对体制稳定构成巨大威胁。与其单方面攻击，不如促进宗教间对话，以减少民族冲突。"
 YUG_state_atheism:0 "没收宗教财产"
 YUG_state_atheism_desc:0 "宗教是人民的鸦片。在南斯拉夫，宗教除了加剧民族冲突外别无作用，因此我们将透过没收宗教财产，推行国家无神论政策。"
 YUG_Break_authoritarianism:0 "摆脱威权主义"
 YUG_Break_authoritarianism_desc:0 "威权主义只会带来党的腐败与堕落。为了建立更好的党，我们将摒弃威权主义。"
 YUG_workers_self_management:0 "劳动者自主管理制度"
 YUG_workers_self_management_desc:0 "南斯拉夫的劳动者自主管理，是根据狄托与爱德华·卡德尔的理论组织而成。劳动者对其工作场所的运营拥有权利，能够自主且民主地管理 workplace。"
 YUG_Centralized_Economy:0 "经济中央集权"
 YUG_Centralized_Economy_desc:0 "透过经济中央集权，可以建构高效经济，并强化党的经济权力。"
 YUG_strengthening_of_the_central_party:0 "强化中央党"
 YUG_strengthening_of_the_central_party_desc:0 "透过将职能与权力集中于中央党，可以促进更好的行政效率与稳定。"
 YUG_yugoslavia_expansion:0 "大南斯拉夫联邦共和国"
 YUG_yugoslavia_expansion_desc:0 "『大南斯拉夫联邦共和国方案』旨在将我们当前的盟友——保加利亚/阿尔巴尼亚共和国，并入南斯拉夫联邦共和国。尽管各共和国主导民族可能有所反弹，但此计划获得许多人支持，且为守护革命所必需。"
 YUG_balkan_federation:0 "巴尔干社会主义共和国联邦"
 YUG_balkan_federation_desc:0 "巴尔干联邦的概念出现于19世纪后期，其核心目标是建立新的政治统合体，即基于国际主义、社会主义、社会连带与经济平等，整合巴尔干半岛的共同联邦共和国。我们可以透过诱导巴尔干半岛各国革命，来实现此计划。"
 YUG_balkan_defense_training:0 "巴尔干防卫"
 YUG_balkan_defense_training_desc:0 "为了防卫巴尔干半岛，必须与其他国家的军队合作。我们将制定相关教条，并与他国分享。"
 YUG_internationalism:0 "国际主义"
 YUG_internationalism_desc:0 "我们虽已解放，但世界上仍有许多劳动者受压迫者之苦。我们将依据国际主义原则，支持他们的解放与斗争，并时而出动我军，以促成世界劳动者的团结与斗争。"
 YUG_industrial_integration:0 "整合产业"
 YUG_industrial_integration_desc:0 "透过整合南斯拉夫、保加利亚、阿尔巴尼亚的产业，可以更高效地强化经济。"
 YUG_eradication_of_nationalism:0 "摧毁『民族主义』"
 YUG_eradication_of_nationalism_desc:0 "民族主义不过是压迫者的工具。他们利用「民族」这虚构概念来分化劳动者，使其相互斗争。我们将摧毁民族主义，消除民族间的差别。 "
 YUG_equality_among_ethnic_groups:0 "民族间的平等"
 YUG_equality_among_ethnic_groups_desc:0 "随着保加利亚与阿尔巴尼亚近期加入联邦，各共和国的主要民族出现反弹。我们将强调民族间的平等，改善他们的待遇，以消除反弹。 "


 
 YUG_yugoslavian_nationalism:0 "南斯拉夫民族主义"

 YUG_multinational_state:0 "多民族国家"

 YUG_constitutional_monarchy:0 "君主立宪国"
 YUG_constitutional_monarchy_desc:0 "我们将透过修宪确立君主立宪政体，并任命前总理、同时也是首位非塞尔维亚裔总理的安东·科罗舍茨组阁，建立一个由国内大多数中间政党参与的大联合政府。 "

 YUG_Death_of_the_January_6th_Dictatorship:0 "1月6日体制的终结"
 YUG_Death_of_the_January_6th_Dictatorship_desc:0 "1月6日体制本质压迫，在王室信誉扫地的当下，只会徒增不稳定。我们必须清除其残余，建立新的南斯拉夫。"
 YUG_Election_Law_Reform:0 "修订选举法"
 YUG_Election_Law_Reform_desc:0 "现行的选举法与选区划分，有利于特定民族。为确保少数民族的代表性并促进民族平等，必须修订选举法。"
 YUG_Neutralize_the_Royal_Family:0 "王室象征化"
 YUG_Neutralize_the_Royal_Family_desc:0 "在王室的信誉跌至谷底，且彼得二世尚年幼之际，我们应将王室转化为象征性存在，防止其干预政治。"
 YUG_Establishment_of_an_Independent_Constitutional_Court:0 "设立独立宪法法院"
 YUG_Establishment_of_an_Independent_Constitutional_Court_desc:0 "设立独立的宪法法院，对国家的稳定至关重要。我们必须建立一个不受其他政治算计影响的宪法法院。"
 YUG_Depoliticization_of_State_Institutions:0 "国家机关去政治化"
 YUG_Depoliticization_of_State_Institutions_desc:0 "目前国家机关中存在由前总理任命的、具极右思想的公务员。此外，先前专制君主制时期任命的一些无能且反民主的公务员，导致了1935年的选举舞弊。我们必须免职这些人员，并对公务员进行去政治化教育。"
 YUG_Special_Committee_on_Eradication_of_Corruption:0 "反腐败特别委员会"
 YUG_Special_Committee_on_Eradication_of_Corruption_desc:0 "为彻底清除专制君主制时期蔓延的腐败，必须设立拥有全权的特别委员会，进行全面调查。"
 YUG_Farm_Support_Policy:0 "农户支持政策"
 YUG_Farm_Support_Policy_desc:0 "国以农为本。全球性的经济萧条使农户陷入困境，我们应为他们提供补贴，以振兴农业。"
 YUG_Agricultural_Modernization:0 "农业现代化"
 YUG_Agricultural_Modernization_desc:0 "农业现代化是我们的使命。必须引进拖拉机，为农村通电，以提高农业生产力。"
 YUG_Industrial_Subsidies:0 "产业补贴"
 YUG_Industrial_Subsidies_desc:0 "尽管农户持续受损，但若不优先推进工业化，国家经济也将停滞不前。应对工业提供补贴，以谋求产业发展。"
 YUG_Unemployment_Pension:0 "失业补助金"
 YUG_Unemployment_Pension_desc:0 "国内失业率急遽攀升。为维持国民消费力，必须发放失业补助金。"
 YUG_Partial_Removal_of_Press_Censorship:0 "部分解除言论审查"
 YUG_Partial_Removal_of_Press_Censorship_desc:0 "言论审查长期而言应予中止，但鉴于当前极端势力趁局势不稳蠢蠢欲动，应部分解除，同时保留国家干预言论的空间。"
 YUG_Wipe_Out_Fascist_Influence:0 "清除法西斯影响力"
 YUG_Wipe_Out_Fascist_Influence_desc:0 "我们维持的言论审查，可用于清除国内外法西斯势力的影响。"
 YUG_Complete_Removal_of_Press_Censorship:0 "完全解除言论审查"
 YUG_Complete_Removal_of_Press_Censorship_desc:0 "透过完全解除言论审查，展现我们接纳国内改革舆论的姿态。"
 YUG_Limited_Allowance_of_Communist_Parties:0 "有限度允许共产主义政党"
 YUG_Limited_Allowance_of_Communist_Parties_desc:0 "共产主义与王政虽相悖，但考量其规模，我们必须予以承认。应有限度允许其政党活动，使其在合法范围内运作。"
 YUG_Guaranteeing_Cultural_Autonomy:0 "保障文化自治"
 YUG_Guaranteeing_Cultural_Autonomy_desc:0 "我们应保障国内各民族的文化自治。允许学校除了塞尔维亚-克罗埃西亚语外，也教授少数民族语言；允许广播电台以各民族语言进行播音。"
 YUG_Special_Committee_on_Religious_Harmony:0 "宗教和谐特别委员会"
 YUG_Special_Committee_on_Religious_Harmony_desc:0 "国内存在多种宗教，多数民族问题源于宗教。应设立宗教和谐特别委员会，专责处理宗教事务。"
 YUG_Minority_Language_Coverage:0 "保障少数民族语言"
 YUG_Minority_Language_Coverage_desc:0 "允许在少数民族聚居地区的官署，并用其民族语言，以保障少数民族权益。"
 YUG_Constitution_Reform:0 "修订宪法"
 YUG_Constitution_Reform_desc:0 ""
 YUG_With_Socialist_Party:0 "与社会党协商"
 YUG_With_Socialist_Party_desc:0 ""
 YUG_Anti_Extremism:0 "排斥极端主义"
 YUG_Antxi_Extremism_desc:0 ""
 YUG_With_Independent_Democratic_Party:0 "与独立民主党协商"
 YUG_With_Independent_Democratic_Party_desc:0 ""
 YUG_Strengthening_Welfare:0 "强化福利"
 YUG_Strengthening_Welfare_desc:0 ""
 YUG_alliance_with_the_uk:0 "加入同盟国"
 YUG_alliance_with_the_uk_desc:0 ""
 YUG_alliance_with_france:0 "与法国结盟"
 YUG_alliance_with_france_desc:0 ""

 YUG_oust_the_fascists:0 "驱逐法西斯总理"
 YUG_oust_the_fascists_desc:0 "现任南斯拉夫总理米兰·斯托亚迪诺维奇滥用职权，在国家公共部门安插自己的支持者。他还被党内称为「领袖」，并领导党军。他对现行的王政体制构成威胁，因此我们将解除其总理职务，另任他人。 "
 YUG_Strengthening_Radical_Union:0 "强化激进联盟"
 YUG_Strengthening_Radical_Union_desc:0 "南斯拉夫激进联盟是现任总理米兰·斯托亚迪诺维奇所属的政党。透过支持激进联盟，稳固摄政委员会的权威，可促进国家稳定，并藉由总理的法西斯政策，改善与义大利的关系。 "
 YUG_regency_council:0 "摄政的统治"
 YUG_regency_council_desc:0 "保罗亲王已证明他有能力治理南斯拉夫。让年幼的国王退居幕后，由保罗亲王与摄政委员会继续守护南斯拉夫。 "
 YUG_dissolution_of_parliament:0 "解散议会"
 YUG_dissolution_of_parliament_desc:0 "随着总理兼执政党激进联盟党魁米兰·斯托亚迪诺维奇被逐出权力中心，南斯拉夫议会已失去其权势。是时候解散这个不必要的议会，回归专制君主政体了。 "
 YUG_defender_of_all_yugoslavia:0 "全南斯拉夫的守护者"
 YUG_defender_of_all_yugoslavia_desc:0 "国王是所有南斯拉夫人及南斯拉夫领土的守护者。理所当然地，国王拥有守护这一切的至高权力。 "
 YUG_Revial​​_of_the_January_6th_Dictatorship:0 "复活1月6日体制"
 YUG_Revial​​_of_the_January_6th_Dictatorship_desc:0 "复活1月6日体制，回归专制君主政体，将有助于我们克服当前遭遇的危机。 "
 YUG_Iron_Fist:0 "铁拳"
 YUG_Iron_Fist_desc:0 "反对实施专制君主政体者，将在国王的铁拳之下屈膝。 "
 YUG_Kings_Chetniks:0 "国王的切特尼克"
 YUG_Kings_Chetniks_desc:0 "自塞尔维亚王国时代起，切特尼克便一直是国家与王室的忠诚仆从。我们可以将其正式化，纳入国家体系，作为王室的臂膀。 "
 YUG_strengthening_of_parliamentary_powers:0 "强化议会"

 YUG_pledge_of_allegiance:0 "效忠宣誓"

 YUG_Kings_Goverment:0 "国王的政府"

 YUG_Rewards_For_Loyalty:0 "奖赏忠诚者"

 YUG_Economic_Centralization:0 "经济中央集权"

 YUG_Capitalist_Support:0 "支持资本家"

 YUG_Capitalist_Suppression:0 "压制资本家"

 YUG_Acquire_Deliverables:0 "取得成果"

 YUG_Industrial_Management:0 "产业管理"

 YUG_State_Capitalism:0 "国家资本主义"

 YUG_Agricultural_Subsidy:0 "农业补贴"

 YUG_Mining_Mechanization:0 "矿业机械化"

 YUG_duce_of_yugoslavia:0 "南斯拉夫的领袖"
 YUG_duce_of_yugoslavia_desc:0 "米兰·斯托亚迪诺维奇在激进联盟中被称为「领袖」。我们相信，他能像义大利的领袖一样，使新南斯拉夫变得强大。 "
 YUG_yugoslav_nationalism:0 "南斯拉夫民族"
 YUG_yugoslav_nationalism_desc:0 "南斯拉夫民族一词，原本是指塞尔维亚、克罗埃西亚等居住在欧洲南部、特别是巴尔干半岛的斯拉夫民族的总称。如今，这个词将成为意指「南斯拉夫人」本身的词汇。 "
 YUG_serbian_nationalism:0 "塞尔维亚民族"
 YUG_serbian_nationalism_desc:0 "南斯拉夫王国中人口最多的民族是塞尔维亚族。在南斯拉夫拥有最多权利的民族，也应是塞尔维亚族。 "
 YUG_support_for_chekhnite:0 "重组切特尼克"
 YUG_support_for_chekhnite_desc:0 "切特尼克是塞尔维亚王国时期创立的保王派民兵，其起源可追溯至反抗奥斯曼帝国的抵抗运动。在大战中，他们曾作为志愿军辅助塞尔维亚军队。我们可以根据我们的思想对其进行重组并加以利用。 "
 YUG_state_cooperativeism:0 "国家组合主义"
 YUG_state_cooperativeism_desc:0 "国家组合主义强调阶级间的合作，并由国家控制经济。国家组合主义是我们经济的选择。 "
 YUG_ORJUNA_reunion:0 "重新建立南斯拉夫民族主义者组织"
 YUG_ORJUNA_reunion_desc:0 "南斯拉夫民族主义者组织是1921年在塞尔维亚、克罗埃西亚、斯洛维尼亚王国成立的，以原始法西斯主义、反共主义为主要意识形态的南斯拉夫民族主义团体。他们支持单一的南斯拉夫民族主义，曾有效镇压克罗埃西亚、斯洛维尼亚分离主义者，但于1929年因专制君主政体而解散。如果我们复活这个组织，将其作为国家和政党的工具，就能有效遏制分离主义势力。 "
 YUG_border_retreat:0 "边界后撤"
 YUG_border_retreat_desc:0 "我们找到了一个能一次性解决南斯拉夫内部民族主义问题与义大利领土主张的完美方案。 "

 YUG_evolution2:0 "进化"
 YUG_evolution2_desc:0 "为了应对外来势力的威胁，我们需要一个更强大的国家。现在是时候建立一个解决了国家分裂问题的、进化后的南斯拉夫了。 "
 YUG_power_strengthening:0 "强化权力"
 YUG_power_strengthening_desc:0 "我们将透过加强对军方的控制来强化我们的权力。 "
 YUG_moschettieri_del_duce:0 "强化民兵"
 YUG_moschettieri_del_duce_desc:0 "必须强化为我们政权而战的民兵，以巩固我们政权的统治。 "
 YUG_deposition_of_the_king:0 "废黜国王"
 YUG_deposition_of_the_king_desc:0 "腐败的王室长期独揽大权，榨取我国财富，奴役人民。现在，我们要将他们拉下权力宝座，迈向新的南斯拉夫。 "
 YUG_symbol_of_the_nation:0 "民族的象征"
 YUG_symbol_of_the_nation_desc:0 "王室是南斯拉夫的象征，是南斯拉夫人的象征，也是我们军队的象征。驱逐他们将引发巨大反弹，并可能否定我们政权的正当性。我们将继续保留他们作为我们的象征。 "
 YUG_disintegration_of_yugoslavia:0 "解体南斯拉夫"
 YUG_disintegration_of_yugoslavia_desc:0 "南斯拉夫只是一个人为的、充满矛盾的集合体。我们将解体南斯拉夫。 "
 YUG_greater_serbia:0 "大塞尔维亚"
 YUG_greater_serbia_desc:0 "抛弃南斯拉夫这个虚幻的梦想，我们需要重新建立一个新的国家。无论旁人如何评说，南斯拉夫终究是、也将永远是塞尔维亚民族的国家。 "
 YUG_serbian_imperialism:0 "塞尔维亚帝国主义"
 YUG_serbian_imperialism_desc:0 "塞尔维亚必须在此基础上变得更大。为了塞尔维亚民族的安乐生活，需要更广阔的土地、更多的资源，以及更多的牺牲。 "
 YUG_greater_serbian_defense_force:0 "塞尔维亚防卫军"
 YUG_greater_serbian_defense_force_desc:0 "为了守护塞尔维亚，我们需要更强大、规模更大的军队。为新的祖国，建立新的军队。 "
 YUG_seeking_alliance_with_italy:0 "与义大利亲善"

 YUG_invasion_of_BUL:0 "入侵保加利亚"
 YUG_invasion_of_BUL_desc:0 "保加利亚对我国领土马其顿虎视眈眈。此外，保加利亚拥有我们所需的土地和资源，因此我们应先发制人入侵保加利亚，以谋求国家稳定。"
 YUG_invasion_of_ALB:0 "入侵阿尔巴尼亚"
 YUG_invasion_of_ALB_desc:0 "阿尔巴尼亚开采石油。我们需要石油，而阿尔巴尼亚有石油，所以我们必须入侵阿尔巴尼亚。"
 YUG_invasion_of_HUN:0 "入侵匈牙利"
 YUG_invasion_of_HUN_desc:0 "匈牙利拥有流经多瑙河的粮仓地带，以及用于林业的森林。此外，据悉当地还蕴藏大量铝土矿。我们将入侵他们，以确保资源。"
 YUG_invasion_of_ROM:0 "入侵罗马尼亚"
 YUG_invasion_of_ROM_desc:0 "罗马尼亚的普洛耶什蒂油田是欧洲最大的油田。沿多瑙河还有广大农田，因此我们必须控制罗马尼亚，以确保塞尔维亚人的幸福。"
 YUG_invasion_of_GRE:0 "入侵希腊"
 YUG_invasion_of_GRE_desc:0 "希腊拥有多种多样的资源。他们的岛屿也将成为我们向地中海延伸的跳板。我们将控制希腊。"
 YUG_invasion_of_TUR:0 "平定中东"
 YUG_invasion_of_TUR_desc:0 "土耳其是曾奴役我们的鄂图曼帝国的后裔，而土耳其之外是盛产石油的中东。我们将攻击土耳其和中东国家，为我们的民族复仇，并从他们那里夺取我们生活所需的资源。"
 YUG_oath_of_loyalty:0 "效忠宣誓"
 YUG_oath_of_loyalty_desc:0 "我们必须正确认识我们在国际政治中的地位。北方有敌意的异界侵略者，东方有觊觎巴尔干半岛霸权的苏联，西方有从我国割走领土的义大利。昔日的盟友现已无力，因此向友好的义大利宣誓效忠，是使我们价值获得最高评价的方法。"
 YUG_strengthening_of_syndicalist_economy:0 "发展组合主义经济"
 YUG_strengthening_of_syndicalist_economy_desc:0 "组合主义经济已在我国成功扎根，现在是收获成果的时候了。进一步发展组合主义经济，强化我国经济吧。"
 YUG_strengthening_production_plans:0 "巴尔干的兵工厂"
 YUG_strengthening_production_plans_desc:0 "我国作为义大利指向巴尔干的矛头，需要物资来辅助义大利军队。让我们成为巴尔干的兵工厂，为义大利和我国军队生产物资吧。"
 YUG_resource_production:0 "资源生产"
 YUG_resource_production_desc:0 "我国境内蕴藏着相当丰富的资源。我们必须开采这些资源，并供应给市场。"
 YUG_self_sufficient_economy:0 "国际性威胁"
 YUG_self_sufficient_economy_desc:0 "为了应对国际性威胁，需要更高效的经济和更多的军官。我们将建立一个高效的国家。"

 YUG_Gauge_Standardization:0 "标准化轨距"
 YUG_Gauge_Standardization_desc:0 "混杂着多种轨距的铁路网无法发挥应有功能。必须将国内铁路轨距标准化。"
 YUG_improve_light_industry:0 "支援汽车产业"
 YUG_improve_light_industry_desc:0 "透过支援汽车产业，可改善国内物流状况，并为未来即将到来的战争确保车辆。"
 YUG_Improve_Heavy_Industry:0 "振兴重工业"
 YUG_Improve_Heavy_Industry_desc:0 "为了保卫国家，需要足够数量的武器。振兴重工业，可为日后的军需产业奠定基础。"
 YUG_Rural_Electrification:0 "农村开发"
 YUG_Rural_Electrification_desc:0 "我们必须开发各地农村，以确保粮食安全。透过农村电气化，并铺设可供拖拉机、卡车等车辆通行的道路，可以提高农业产量。"
 YUG_Serbian_Urbanization:0 "塞尔维亚城市化"
 YUG_Serbian_Urbanization_desc:0 "由于鄂图曼帝国的长期统治，塞尔维亚相较于北部地区，工业化与城市化进程稍显迟缓。塞尔维亚的城市化应成为我们的首要目标。"
 YUG_Northen_Urbanization:0 "北部城市化"
 YUG_Northen_Urbanization_desc:0 "斯洛维尼亚和克罗埃西亚地区，在奥地利和匈牙利的统治下，已实现了一定程度的工业化与城市化，但仍逊于欧洲其他城市。必须加速北部城市化，以确保工业劳动力。"
 YUG_Bosnia_Urbanization:0 "波士尼亚城市化"
 YUG_Bosnia_Urbanization_desc:0 "波士尼亚地区因其崎岖地形，城市化和工业化进程受阻。为国家经济着想，波士尼亚的城市化势在必行，因此必须对波士尼亚进行投资。"
 YUG_Sourthen_Urbanization:0 "南部城市化"
 YUG_Sourthen_Urbanization_desc:0 "包括蒙特内哥罗、马其顿、科索沃地区在内的南部地区，至今仍未能摆脱鄂图曼帝国长期统治的影响。当地的工业与城市长年荒废，土地利用率低下。\n我们必须对南部地区进行城市化。"
 YUG_Expand_Shipyards:0 "扩建造船厂"
 YUG_Expand_Shipyards_desc:0 "我国濒临亚得里亚海，以义大利为首的列强正觊觎着我们。为了日后突破义大利或其他列强的海上封锁并抵抗入侵，我们需要能建造战舰和运输船的造船厂。"
 YUG_Construction_Improvements:0 "改善建设"
 YUG_Construction_Improvements_desc:0 "无房则人无法安居，无厂则无法生产所需之物。唯有提升国家的建设能力，才能在这艰困局势中存活下来。"
 YUG_Morava_Ironworks:0 "摩拉瓦炼钢厂"
 YUG_Morava_Ironworks_desc:0 "摩拉瓦河流域分布着生产多种资源的矿山。为了利用这些矿山的潜力，我们需要兴建炼钢厂来精炼资源。"
 YUG_Improved_Productivity:0 "改善生产力"
 YUG_Improved_Productivity_desc:0 "随着国家建设能力的提升，大量工厂得以兴建，\n 但生产力仍远不及其他先进工业国家。\n 我们必须设法更有效率地运用我们的工厂，\n 因此，改善工厂的生产力实属必要。"
 
 YUG_War_Against_Italy:0 "对义大利的战争"
 YUG_War_Against_Italy_desc:0 "与义大利的战争终究无可避免。战争既已爆发，我们就必须奋战到底。没有妥协，没有投降。那条路的尽头，只会是沦为奴隶。"
 YUG_National_Emergency_Declaration:0 "宣布国家紧急状态"
 YUG_National_Emergency_Declaration_desc:0 "与义大利的战争，关乎我国与国民的存亡。我们必须立即宣布国家紧急状态，呼吁全民团结一致。"
 YUG_Hold_the_Line:0 "守住战线！"
 YUG_Hold_the_Line_desc:0 "义大利军此刻仍不断涌入我国领土。我们不能无止境地后退。让我们铭记大战期间，德拉古廷·加夫里洛维奇上校与士兵们在贝尔格勒保卫战中，向奥匈军桥头堡发动决死冲锋的精神。我们将誓死坚守战线，直到最后一刻。"
 YUG_urgent_mobilization:0 "紧急动员令"
 YUG_urgent_mobilization_desc:0 "战线持续消耗兵力。为了补充死伤者，并让疲惫的部队获得最基本的休息，我们必须解决兵力不足的问题。要克服此困境，零星的措施远远不够。我们必须召集所有可动员的人力资源，将最大限度的兵力投入战线。"
 YUG_Short_term_production_increase:0 "短期增产"
 YUG_Short_term_production_increase_desc:0 "战争正瞬间吞噬着大量物资。没有步枪、大炮、无线电、绷带、弹药及其他无数物资，前线的士兵就无法正常作战。我们将重新整顿后方战线，重新组织，力求短期增产。"
 YUG_One_Gun_One_Man:0 "人手一枪"
 YUG_One_Gun_One_Man_desc:0 "透过大规模动员，虽能补充兵力，但若没有枪，在前线就无法发挥作用。我们必须增加步枪产量，确保至少人手一枪。"
 YUG_Scavenging_the_Legacy_of_the_Great_War:0 "翻找大战的遗产"
 YUG_Scavenging_the_Legacy_of_the_Great_War_desc:0 "军需物资总是短缺。我们将开放存放着大战剩余物资的仓库，取用其中可用的物资。"
 YUG_Coastal_Anti_Air_Base:0 "海岸防空基地"
 YUG_Coastal_Anti_Air_Base_desc:0 "义大利空军正在蹂躏我国国土。我们薄弱的航空战力或许无法拦截他们的空军，但藉由在沿海地区部署防空基地，应能进行一定程度的抵抗。"
 YUG_Molotov_Cocktail_Supply:0 "配发燃烧瓶"
 YUG_Molotov_Cocktail_Supply_desc:0 "义大利军的装甲车辆多数使用汽油引擎。而汽油引擎对火焰相当脆弱。我们将配发燃烧瓶作为临时的对抗装甲手段。"
 YUG_Mountain_Gun:0 "山炮"
 YUG_Mountain_Gun_desc:0 "南斯拉夫与义大利的国土遍布崇山峻岭。如果我们能设计出专精于此的炮，将能争取到山地作战的火力优势。"
 YUG_Strengthening_Communication_Network:0 "强化通讯网络"
 YUG_Strengthening_Communication_Network_desc:0 "若要列出现代战争中最关键的因素之一，通讯绝不能缺席。我们将在全国铺设军用通讯线路，并培育通讯兵，确保通讯畅通。"
 YUG_Full_Scale_Counterattack:0 "全面反击"
 YUG_Full_Scale_Counterattack_desc:0 "义大利军在攻击我们之后，已师老兵疲。他们的弹药即将耗尽，伤患激增，士气跌至谷底。现在，是我们将义大利军逐出国境的时候了。"
 YUG_Climbing_the_Mountain_Alps:0 "翻越阿尔卑斯山脉"
 YUG_Climbing_the_Mountain_Alps_desc:0 "虽然成功将义大利军逐出国境，但如今阿尔卑斯山脉横亘在我们面前。我们将对全军实施山地战训练，并准备冬季装备。阿尔卑斯山脉再也无法阻挡我们。"
 YUG_Crossing_the_Piave_River:0 "渡过皮亚韦河"
 YUG_Crossing_the_Piave_River_desc:0 "我们翻越了阿尔卑斯山，也占领了威尼斯。现在必须渡过皮亚韦河。准备工兵部队与浮桥。翻山越岭，渡河前行，迈向胜利。"
 YUG_Victory_in_Italy:0 "在义大利的胜利"
 YUG_Victory_in_Italy_desc:0 "我们胜利了。现在，我们将整理从义大利战役中汲取的教训，将其制定为教范，为未来的战争做好准备。"


 

