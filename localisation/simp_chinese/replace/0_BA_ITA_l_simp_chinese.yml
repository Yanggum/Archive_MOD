l_simp_chinese:
 #国策
 ITA_request_control_of_french_territories:0 "与法国条约"
 ITA_request_control_of_french_territories_desc:0 "既然法国已宣告收复本土，我们可以提出一项条约，以我们支援法国为条件，在法国流亡政府回归本土时，取得法国领土。"
 ITA_italy_first_desc:0 "为了实现义大利的伟大荣耀，需要强大的武力...即使欧洲被战火吞噬而崩塌，义大利的荣耀仍未消亡。"
 ITA_negotiate_italian_claims:0 "具体化史特雷萨战线"
 ITA_negotiate_italian_claims_desc:0 "我们将建立正式的史特雷萨战线，构筑义大利-法国-英国三国同盟。值此巨大威胁降临欧洲之际，是时候放下过去的恩怨，携手合作了。"
 ITA_ratify_the_stresa_front:0 "欧洲安全条约"
 ITA_ratify_the_stresa_front_desc:0 "为了对抗欧洲的敌人，需要更大规模的军事合作。义大利、法国、英国的军事合作将进一步扩大，未来亦可举行联合军事演习。"
 ITA_guarantee_austrian_independence:0 "笼罩欧洲的帷幕"
 ITA_guarantee_austrian_independence_desc:0 "北方的欧洲消亡后出现的异界敌人，正明显威胁着义大利北部。义大利作为史特雷萨战线的实质盟主，将与征服欧洲的侵略者明确划清界线，并透过强硬回应来展现意志。"
 ITA_german_military_cooperation:0 "接纳德国流亡者"
 ITA_german_military_cooperation_desc:0 "德国瞬间崩溃之际，我们可以引进包括德国科学家在内的各类人才，促进义大利科学技术的进步。"
 ITA_pact_of_steel:0 "废除史特雷萨战线"
 ITA_pact_of_steel_desc:0 "欧洲陷入混乱，史特雷萨战线这个仓促缔结的协定，在英国和法国已崩溃的当下，对义大利毫无益处。我们将废除协定，图谋向巴尔干扩张。"
 ITA_treaty_with_germany:0 "欧洲技术条约"
 ITA_treaty_with_germany_desc:0 "欧洲灭亡，英法崩溃之际，我们必须与新盟友建立更坚实的基础。"
 ITA_human_fascism:0 "人类法西斯宣言"
 ITA_human_fascism_desc:0 "义大利能独自避开大转移，其中必有缘故。必须开始为全人类的统一、为一个统一的欧洲而奋起。是时候迈出为人类的伟大第一步了。"
 ITA_human_fascism_tt:0 "[ROOT.GetNameWithFlag] 未与任何基沃托斯国家结盟。\n§R若 [ROOT.GetName] 与基沃托斯国家结盟，此决议将永久锁定。§!"
 ITA_rise_of_pan_europeanism:0 "泛欧洲主义高涨"
 ITA_rise_of_pan_europeanism_desc:0 "超越大义大利、罗马帝国等义大利民族主义，旨在强力统一全欧洲的泛欧洲主义，目前在义大利内部正被热烈讨论。"
 ITA_europea_citizens:0 "欧洲公民权"
 ITA_europea_citizens_desc:0 "我们都生活在同一个欧洲。必须摆脱过往细小的民族情感，实现伟大的欧洲统合。"
 ITA_comfort_more_comfort:0 "向北，再向北"
 ITA_comfort_more_comfort_desc:0 "义大利现正被基沃托斯国家环绕。为了实现泛欧洲主义的野心，我们必须打破这座监狱，向更北方进军。"
 ITA_europea_army:0 "欧洲军"
 ITA_europea_army_desc:0 "为了实现全欧洲人的野心，我们将创建从欧洲各地招募的欧洲军。我们的军队将成为欧洲最坚强、最强大的力量，现在将为实现伟大愿景而行动。"
 ITA_europea_army_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+10.0%§!\n\n"
 ITA_one_europea:0 "一个欧洲"
 ITA_one_europea_desc:0 "欧洲必须统一。我们的泛欧洲国将对全欧洲宣告圣战，借此将欧洲所有人类团结在同一旗帜、同一口号之下。"

 #事件
 PASTA_event.1.t:0 "史特雷萨战线形成"
 PASTA_event.1.d:0 "[ITA.GetName] 在履行史特雷萨条约后，决定将史特雷萨战线扩展为正式势力。我们必须决定我国是否加入 [ITA.GetName]。"
 PASTA_event.1.a:0 "为了欧洲的复兴"
 PASTA_event.1.b:0 "不，我们无意与义大利同行"

 PASTA_event.2.t:0 "[FROM.GetName] 加入史特雷萨战线"
 PASTA_event.2.d:0 "[FROM.GetName] 决定加入我们的史特雷萨战线，欧洲国家的团结正日益巩固。"
 PASTA_event.2.a:0 "团结起来！"

 PASTA_event.3.t:0 "史特雷萨战线遭拒"
 PASTA_event.3.d:0 "[FROM.GetName] 拒绝签署我们的条约，史特雷萨战线计画遭遇重大挫折。"
 PASTA_event.3.a:0 "打算孤军奋战吗？"

 PASTA_event.4.t:0 "义大利支援千禧年抗战之提议"
 PASTA_event.4.d:0 "[ITA.GetName] 方表示，愿以协助我方抗击千禧年为代价，换取法国南部部分领土。\n\n关于是否应以割让部分领土为代价，换取对千禧年战争中的盟友，抑或绝不能放弃法国领土，两种意见正激烈对立。"
 PASTA_event.4.a:0 "不，必须拒绝。"
 PASTA_event.4.b:0 "不过是几个省份而已。"

 PASTA_event.5.t:0 "法国拒绝"
 PASTA_event.5.d:0 "[FRA.GetName] 方拒绝了我们提出的、以参与对千禧年战争为代价换取日后割让南部领土的条约。"
 PASTA_event.5.a:0 "哼。"

 PASTA_event.6.t:0 "法国接受"
 PASTA_event.6.d:0 "[FRA.GetName] 方批准了我们提出的、以参与对千禧年战争为代价换取日后割让南部领土的条约。"
 PASTA_event.6.a:0 "很好。"

 PASTA_event.7.t:0 "低迷的气氛"
 PASTA_event.7.d:0 "衣索比亚战争结束后，义大利社会陷入了深深的沉默。整个欧洲被奇怪的人席卷而去的这空前绝后的事态，足以将全义大利国民驱入恐惧之中。\n\n在我们实施的媒体管制效果减弱的此刻，所有义大利公民只是努力隐藏着对北方人的恐惧。"
 PASTA_event.7.a:0 "这是必须直面的恐惧。"

 PASTA_event.8.t:0 "义大利法西斯分子的抗议示威！"
 PASTA_event.8.d:0 "对于 [ROOT.GetName] 宣布与因大转移而生的异界国家结盟，义大利的法西斯分子、民族主义者及各阶层国民都陷入了震惊。\n\n部分国民组织了反奇普托斯抗议团体，上街游行，全国各地的工业设施正逐渐爆发罢工！"
 PASTA_event.8.a:0 "别干涉我的外交政策！"

 italy.5.t:0 "义大利-匈牙利技术交流"
 italy.5.b:0 "我们无意与义大利同行。"

 italy.6.t:0 "义大利-匈牙利技术交流 - 接受！"
 italy.6.d:0 "正如我们所料，匈牙利欣然签署了一系列技术交流协议。值此欧洲面临新威胁之际，义大利必须寻找新的生路。"

 italy.7.t:0 "义大利-匈牙利技术交流 - 拒绝！"
 italy.7.d:0 "匈牙利拒绝了我们提出的技术交流。"

 #国民精神
 PASTA_signatories_of_the_stresa_idea:0 "史特雷萨战线签署国"
 PASTA_signatories_of_the_stresa_idea_desc:0 "在基沃托斯登陆欧洲后引发的混乱中，由英、法、义三国主导仓促组成的史特雷萨战线，因英法陷入危机而面临条约解体的困境。"
 PASTA_ratify_the_stresa_front_idea:0 "三国安全条约"
 PASTA_shock_to_daejeon:0 "大转移冲击"
 PASTA_shock_to_daejeon_desc:0 "整个欧洲被异界存在席卷而去的事实，对义大利造成了可怕的冲击。尽管以对衣索比亚战争为名实施了多种媒体管制，但此刻所有义大利国民仍笼罩在潜在的恐惧之中。"
 PASTA_shock_to_daejeon_tt: "与基沃托斯国家结盟时转换：\n与 §Y基沃托斯§! 国家结盟时，将产生大规模负面效果"
 PASTA_human_fascism_idea: "人类法西斯"
 PASTA_human_fascism_idea_desc: "义大利是欧洲灭亡中唯一幸免的列强，在多项反基沃托斯活动中担任核心角色。义大利将成为承载欧洲，不，是全人类昭昭天命之国。"
 PASTA_human_fascism_idea_tt: "§R无法与基沃托斯国家结盟。§!"
 PASTA_pan_europea_FRA_idea: "整合法兰西系欧洲人"
 PASTA_pan_europea_GER_idea: "解构德意志日耳曼民族主义"
 PASTA_pan_europea_HOL_idea: "重建低地国家"
