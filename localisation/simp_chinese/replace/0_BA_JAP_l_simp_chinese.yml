l_simp_chinese:
 JAP_guide: "天皇陛下之臣民\n\n£white_dot 完成对满洲与华北的统治。\n£white_dot 完成东南亚诸民族的解放。\n£white_dot §Y完成共荣。§!\n\n§R天下本一家，岂有不善哉？§!"
 JAP_country_intro_header: "旭日之国"
 JAP_country_intro_content: "明治维新将仅抓住过往遗产的日本焕然一新。这个拥有三千万人口的国家，不过短短七十年间，便成长为拥有超过其两倍、达七千万臣民聚居的家园，国家的财富更非仅止两倍，而是增长了数十倍有余。加之击败俄国，皇国的威势正如旭日东升之势，扩散至大东亚全境。\n\n维新使日本与过去彻底开辟新天，但一切并非全然顺遂。上个世纪获得的皇国荣耀，与工业化过程中农民的牺牲息息相关；国家积累的财富，则以畸形结构悬于阶层之上。所谓培育现代工业的骄傲，若揭开其内幕，不过是对西方产品的拙劣模仿。\n\n尽管剑指朝鲜与支那的扩张政策曾掩盖了黑暗面，但这也无法持久。庞大的军备与强化后的军队地位，正对政府施加巨大压力。除了台湾，殖民地经营持续出现赤字，而过去的昭和金融恐慌与经济大萧条，更是将皇国拥有的所有问题，如戈尔迪乌斯之结般纠缠在一起。本欲借此机会打破困局的满洲事变，反而触怒了英国与荷兰等国，使情势恶化。\n\n如此这般，昭和时代的过往岁月，不断散发着暗示：这夸耀旭日之势的皇国，正迈向可怕的停滞。"
 JAP_country_intro_header_1: "$JAP_country_intro_header$"
 JAP_country_intro_content_1: "德川家康蛰伏待机而终获胜利的往事，再次上演。一群与人类相似却又不全然一致的异质群体，完全覆盖在西方世界的上方，与此同时，施加于皇国的压力也随之消散。\n\n虽是好兆头，但不能单纯地看待。皇国必须着眼于在大东亚建立稳固地位之后的未来。知己知彼，百战不殆；然而至今对异界之人的了解仍旧有限。其中一些人有着白色皮肤，令人联想到那些消失或仍存于世的少数人；另一些人则怪异地酷似我皇国或支那。\n\n昭和十一年天光破晓之际，局势已进入不同阶段。留给皇国的课题依然繁多。即使撇开新物种的问题，农村贫困依旧，而随着欧洲的消逝，经济景气反而较前倒退。然而，与过往截然不同的是，皇国面前除了停滞，更出现了其他选项。"


 JAP_Revolution_democracy: "日本革命委员会"
 JAP_Revolution_democracy_DEF: "日本革命委员会"
 JAP_Revolution_democracy_ADJ: "日本革命委员会"
 JAP_No_More_militarism: "文官统制"
 JAP_No_More_militarism_desc: "经历大恐慌之际，军方介入诸多事件。革命成功后，带有军国主义倾向的军方依然存在。必须以民主方式统制他们。"
 JAP_zaibatsus: "财阀"
 JAP_zaibatsus_empowered: "强化的财阀"
 JAP_zaibatsus_challenged: "受挑战的财阀"
 JAP_challenge_the_zaibatsus: "挑战财阀"
 JAP_guide_the_zaibatsus: "向财阀下达指导方针"
 JAP_intervene_in_china_communism: "传播革命"
 JAP_intervene_in_china_communism_desc: "我们的革命不应止于日本。必须将革命传播至世界。"
 JAP_defeat_American_Imperialism: "打倒美帝国主义"
 JAP_defeat_American_Imperialism_desc: "美国对外持续宣传其为自由之乡，但实则与帝国主义国家别无二致。必须粉碎美国在太平洋的霸权，共同实现繁荣。"
 JAP_Remember_Daisho_Demokrashi: "大正民主的记忆"
 JAP_Remember_Daisho_Demokrashi_desc: "1920年代无论在文化或经济上，都是日本的黄金时代。让我们激发大众对日本「美好年代」的怀念，鼓励他们夺回权利。 "
 JAP_Opposition_of_Peace_Preservation_Act: "反对治安维持法"
 JAP_Opposition_of_Peace_Preservation_Act_desc: "治安维持法制定于1925年，是作为打压日本从左翼到右翼势力依据的法律，它压制了日本的民主与自由主义运动，是加速日本转变为军国主义国家的恶法。 "
 JAP_purge_the_militarists: "将军国主义者降职"
 JAP_remove_of_peace_preservation_act: "废除治安维持法"
 JAP_remove_of_peace_preservation_act_desc: "这部制定于1925年，长期荼毒日本社会与国民的恶法不复存在。它将仅作为历史的一页留存。 "
 JAP_Civil_War_Damage_Recovery: "修复内战损害"
 JAP_Civil_War_Damage_Recovery_desc: "席卷日本全境的内战造成了数十万受害者。必须向他们支付赔偿，修复倒塌的房屋与基础设施。 "
 JAP_Local_autonomy_expansion: "扩大地方自治"
 JAP_Local_autonomy_expansion_desc: ""
 JAP_remove_of_Ministry_of_Development: "废除拓务省"
 JAP_remove_of_Ministry_of_Development_desc: ""
 JAP_liberate_south_seas_mandate: "整合南洋群岛"
 JAP_liberate_south_seas_mandate_desc: "我们过去因参与欧洲大战而获得的原德属太平洋岛屿，目前虽以国际联盟委任统治之名进行治理，但该地区原住民的同化已​​达相当程度。因此，我们将正式将这些领土整合为我们的内地。 "
 JAP_the_taiwan_question: "台湾问题"
 JAP_the_taiwan_question_desc: "我们统治台湾已久，但台湾的自决问题正日益迫切。若拒绝邻近地区的自决，我们还能真正声称坚守民主理想吗？ "
 JAP_crush_chinese_communists: "清剿中国共产党"
 JAP_crush_chinese_communists_desc: ""
 JAP_develop_nanyo_gunto: "开发南洋群岛"
 JAP_develop_nanyo_gunto_desc: "南洋群岛是我们南进的跳板，是我们向大洋延伸的据点。我们必须对该地区投入更多投资。 "
 JAP_crush_soviet: "消除巨大威胁"
 JAP_crush_soviet_desc: "[SOV.GetName] 口口声声宣传是为劳动者的国家，实则是 [SOV.GetLeader] 独揽大权、满足私欲的独裁国家。必须拯救受 [SOV.GetLeader] 魔掌之苦的人民。 "
 JAP_the_korean_question: "朝鲜问题"
 JAP_devlop_korean: "开发朝鲜"
 JAP_devlop_korean_desc: ""
 JAP_develop_taiwan: "开发 [524.GetName]"
 JAP_develop_taiwan_desc: "开发 [524.GetName]"
 BA_japan.1.t: "要求废除治安维持法的市民们！ "
 BA_japan.1.d: "极密\n报告书\n大日本帝国 昭和 11年 [GetMonth]\n件名：关于要求废除治安维持法示威抗议之报告\n\n1. 东京、大阪、名古屋等主要城市发生要求废除治安维持法的大规模示威运动。 \n2. 示威群众主张应立即废除该法，持续在市中心集会。 \n3. 宪兵队已部署于现场，与示威群众对峙中。正致力防止事态恶化，严正应对。 \n4. 目前虽无大规模冲突，但有示威扩大之迹象。需持续监视。 \n\n以上"
 BA_japan.1.a: "不忠的家伙！非国民！开火！ "
 BA_japan.1.b: "我们必须倾听国民的呼声。 "
 BA_japan.2.t: "对不良分子示威的坚决镇压措施"
 BA_japan.2.d: "1. 总理大臣阁下已下令立即武力驱散示威群众。 \n2. 已指示宪兵队强硬镇压，必要时考虑投入军队。 \n3. 方针为逮捕示威主谋并严惩。 "
 BA_japan.2.a: "以上"
 BA_japan.3.t: "透过广纳民意的修法推动方案"
 BA_japan.3.d: "1. 总理大臣阁下决定接受示威群众的要求。 \n2. 指示组成废除治安维持法的特别委员会。 \n3. 预计与示威群众代表会面，正在进行和平解散的协商。 "
 BA_japan.4.t: "布施辰治"
 BA_japan.4.d: "今日，布施辰治在其住宅因涉嫌违反治安维持法，遭特别高等警察逮捕。他过去曾任检察官、人权律师，并于1928年众议院议员总选举中以劳动农民党籍参选当选，是备受一般民众尊敬的人物，亦是先前主导废除治安维持法示威游行者。 \n\n他指出治安维持法与现政权缺乏民主正当性，主张将继续为废除治安维持法与恢复民主而奋斗。 \n\n历经12小时的拷问后，他对所有指控供认不讳。应如何处置他？ "
 BA_japan.4.a: "以违反治安维持法起诉那家伙，关进大阪监狱！ "
 BA_japan.6.t_china: "沦为无政府状态的 [609.GetName]"
 BA_japan.6.t_manchu: "沦为无政府状态的 [745.GetName]"
 BA_japan.6.d: "日本爆发了内战，这个要处理吗？ "
 BA_japan.6.a: "开战进攻"
 BA_japan.7.t: "掠夺我国领土的 [FROM.GetAdjective]"
 BA_japan.7.d: "标题即内容"
 BA_japan.8.t: "[524.GetName] 的自由选举"
 BA_japan.8.d: "今日，原 [524.GetName] 总督府所在地，[524.GetName]州 [JAP.GetNameDef] 民政厅办公楼公告，将举行是否与中国统一的投票。此消息迅速透过当地媒体报导，预计明日举行投票。 \n\n现在，我们只能静待他们将选择与中国统一，抑或完全整合为内地..."
 BA_japan.9.t: "选择整合为内地的 [524.GetName]"
 BA_japan.9.d: "所幸，在针对 [524.GetName] 当地居民的投票中，[524.GetName] 岛的内地整合选项以些微差距高于独立，[524.GetName] 岛正式不再是海外属地，而被视为我们本土的一部分与内地，并整合入都道府县行政体系。 \n\n投票后，[524.GetName] 的独立主义者现已转向在 [JAP.GetNameDef] 国会中为增加 [524.GetName] 地区特权而斗争。 "
 BA_japan.9.a: "非常好。 "
 BA_japan.10.t: "选择与中国统一的 [524.GetName]"
 BA_japan.10.d: "遗憾地，在针对 [524.GetName] 当地居民的投票中，与中国统一的选项以些微差距高于内地整合。自今日午夜起，[524.GetName] 的行政权已移交给由当地人为主组成的「台湾临时过渡政府」。 \n\n尽管未来一段时间内，他们的政府仍将处于我们的强大影响力之下，但如今，台北 [524.GetName] 总督府的太阳旗已从旗杆上悄然降下，取而代之的是他们中国政府的青天白日满地红旗。 "
 BA_japan.10.a: "给予他们我们的祝福。 "
 BA_japan.11.t: "归还 [524.GetName] 的 [FROM.GetAdjective]"
 BA_japan.11.d: "标题即内容"
 BA_japan.11.a: "万岁！ "
 BA_japan.12.t: "来自 [FROM.GetAdjective] 的将军们抵达！ "
 BA_japan.12.d: "关于日本将带有军国主义倾向的将军降职至满洲的内容。 \n\n在蓝档案 MOD 中将日本的 AI 路线设定为民主，真的会有人玩满洲国吗？ "
 BA_japan.12.a: "哎呀..."
 BA_japan.13.t: "件名：关于军国主义倾向将军降职之报告"
 BA_japan.13.d: "极密\n报告书\n大日本帝国 昭和 11年 [GetMonth]\n件名：关于军国主义倾向将军降职至满洲之报告\n\n1. 近日，军方内具强烈军国主义倾向的将军陆续被降职至满洲。 \n2. 被降职的将军大抵是在日本国内政治及军事决策上，主张过度扩张主义与备战的人物。 \n3. 被降职的将军虽正执行满洲的新任务，但已察觉不满与反弹的迹象。需持续监视并搜集情报。 \n\n以上"
 BA_japan.14.t: "提出 [ROOT.GetName] 工业化计划的 [FROM.GetAdjective]！ "
 BA_japan.14.d: "[FROM.GetAdjective] 向我们提出了朝鲜工业化计划。这虽能大幅加速 [ROOT.GetAdjective] 的工业化，但也引发担忧：[ROOT.GetAdjective] 的整体经济可能因此依附于 [FROM.GetAdjective]。 "
 BA_japan.14.a: "两害相权取其轻..."
 BA_japan.14.b: "我们不需要那种东西"
 BA_japan.15.t: "赞同我们工业化计划的 [FROM.GetAdjective]"
 BA_japan.15.d: "[FROM.GetAdjective] 已接受我们的提议。如今，[ROOT.GetAdjective] 的熟练工人正为传授技术而前往 [FROM.GetAdjective]，[FROM.GetAdjective] 与 [ROOT.GetAdjective] 的关系将更加发展。"
 BA_japan.15.a: "太好了！！"
 BA_japan.16.t: "拒绝我们工业化计划的 [FROM.GetAdjective]"
 BA_japan.16.d: "[FROM.GetAdjective] 拒绝了我们的提议..."
 BA_japan.16.a: "太糟了..."
 BA_japan.17.t: "向我们归还领土的 [FROM.GetAdjective]！"
 BA_japan.17.d: "大意是归还了被夺走的领土"
 BA_japan.18.t: "免职林铣十郎"
 BA_japan.18.d: "天皇陛下为挫败统制派的趾高气昂，亲自免职了陆军大臣林铣十郎。其后，天皇陛下下谕停止统制派与皇道派的冲突，统制派气势受挫，皇道派则似乎感到满意。"
 BA_japan.18.a: "是何事？"
 BA_japan.19.t: "决断"
 BA_japan.19.d: "支持皇道派的青年军官团行动骤然活跃，政府内部对政变的担忧日益加剧。他们频繁举行秘密集会，与主要军方人士的接触亦日渐频繁。\n\n天皇陛下与日本政府正密切关注其动向，但尚未掌握直接证据。然而，气氛异常，日本仿佛笼罩在即将迎来重大事件的紧张感中。"
 BA_japan.19.a: "做好全面镇压的准备。"
 BA_japan.19.b: "秘密支援皇道派吧。"
 BA_japan.19.c: "勿操之过急。"
 BA_japan.20.t: "青年军官团的内乱企图"
 BA_japan.20.d: "青年军官团试图铲除内阁、掌控东京，但叛军未能成功刺杀总理等主要目标，亦未能逮捕政府高官，其在东京的武装起义也被迅速镇压。\n\n政府立即宣布进入紧急状态，并与军方忠诚派合作，强力镇压了叛军。政变主谋者被逮捕或当场击毙，叛乱被完全平息。\n\n天皇发表声明，谴责青年军官团的叛国行为，政府成功完成镇压。政变以失败告终，皇道派的残存势力将遭到彻底清洗。"
 BA_japan.20.a: "皇道派这下完了。"
 BA_japan.21.t: "冈田启介内阁总辞"
 BA_japan.21.d: "青年军官团政变遭镇压后，冈田启介的拙劣应对引发了军方与臣民不断的批评，不久后，冈田启介在军方压力下宣布内阁总辞。\n\n冈田启介内阁瓦解后，新政局的焦点集中于谁将出任新内阁总理大臣。"
 BA_japan.21.a: "广田弘毅，均衡的总理。"
 BA_japan.21.b: "宇垣一成，陆军抑制者。"
 BA_japan.21.c: "林铣十郎，统制派。"
 BA_japan.22.t: "广田弘毅的辞职"
 BA_japan.22.d: "在军方持续施压与大众低支持率的内外夹击下，广田弘毅最终选择辞去总理职务。\n\n广田弘毅辞职后，统制派透过多项政治运作，成功让林铣十郎获任命为总理。"
 BA_japan.22.a: "唉。"
 BA_japan.23.t: "近卫文麿的组阁"
 BA_japan.23.d: "随着反军方舆论高涨，统制派接连的政治失策持续发生，日本政界深切体认到变革的必要。在此背景下，近卫文麿接受天皇请托，在政界的注目下组织新内阁。无视军方施压，近卫文麿崛起为政治核心，成为承载国民期待的领导者。\n\n近卫就任后立即引起皇道派与大众的高度关注，其温和的政策基调备受瞩目。据悉，近卫目前正推动缓和国家保安法。"
 BA_japan.23.a: "姑且相信他吧。"
 BA_japan_23_tt: "§R若在 1940 年 10 月前未能完成国家改造，近卫文麿将失去政治改革的动力。§!"
 BA_japan.24.t: "林铣十郎解散议会"
 BA_japan.24.d: "总理大臣林铣十郎就任后，立即着手具体化瘫痪议会的行动。他仓促处理前任内阁悬而未决的问题，强行决定解散议会。尽管部分政党强烈反弹，林铣十郎无视反对，集结亲军方势力，实施了总选举。\n\n然而，总选举中亲军方政党惨败，为此试图再次解散议会以挽回颓势的企图亦告失败。最终，议会内的反对声浪高涨，伴随着内阁不信任决议案的通过，林铣十郎迅速下台。"
 BA_japan.24.a: "近卫文麿将接任总理职务。"
 BA_japan.25.t: "宇垣一成的辞职"
 BA_japan.25.d: "皇道派政变企图后获任总理职务的宇垣一成，为恢复经济而推动裁军，但军方内的少壮派与统制派对其政策不满。尤其是拒绝增兵满洲的决定，引发了强烈反弹。\n\n军方批评其领导力，甚至动摇国民支持，在统制派压力下，陆军大臣宣布辞职后，宇垣最终于判断内阁难以维持而宣布辞职。"
 BA_japan.25.a: "近卫文麿将接任总理职务。"
 BA_japan.27.t: "大政翼赞会的成立"
 BA_japan.27.d: "近卫文麿主导的新体制运动，怀抱着革新日本、摆脱军方影响的高贵目标起步。然而，随着时间流逝，近卫的理想在军方的强大压力下逐渐扭曲。改革的梦想渐行渐远，他的双手仿佛被军方的强力影响力所束缚。\n\n最终，今日「大政翼赞会」正式成立。此组织旨在统合日本国民，建立为战争服务的国家总动员体制，在构筑军方与政府密切合作的中集权政治体制上，扮演重要角色。所有政党皆告解散，大政翼赞会成为日本唯一的政治组织。 "
 BA_japan.27.a: "这将有所助益。 "
 BA_japan.27.b: "他完全被军方玩弄于股掌之间。 "
 BA_japan.27.c: "这对我们的大业毫无影响。 "
 BA_japan.27.d: "日本政坛将迎来巨大变革。 "
 BA_japan_27_flag: "§Y大政翼赞会§!沦为军方傀儡"
 BA_japan.28.t: "大政翼赞会的成立"
 BA_japan.28.d: "近卫文麿在日本面临的危机中，为重建国家、摆脱军方压力建立强大的统合国家，主导了新体制运动。基于陈腐无能的政党政治体制已无法引领日本走向未来的信念，近卫试图建立以国家革新与统合为目标的新秩序。 \n\n最终，在近卫主导下，「大政翼赞会」于今日正式成立。此组织将秉承天皇意旨，在团结日本国民、透过政治经济改革将日本重组为近代化高效率国家上，扮演核心角色。兼顾传统与现代，基于民族灵魂的新体制已然启动。 \n\n所有政党皆告解散，大政翼赞会作为国家改造的唯一原动力，将在天皇之名下，全体国民协力建设强韧帝国。日本的太阳如今绽放新光芒，帝国向前迈进的步伐永不停歇。 "
 BA_japan.28.a: "迈向新体制吧！ 。 "
 BA_japan.29.t: "设置大本营"
 BA_japan.29.d: "随着日本卷入与 [FROM.GetName] 的战争，在统制派主导下，为迅速指挥战争、有效动员国家资源，设置了「大本营」。统制派完全整合军方与内阁，建立了系统性引导战争的强力军事控制体制。 \n\n获得天皇批准的大本营，如今在统制派领导下，将完全掌控日本的战争遂行，作为主导军事决策与国家资源管理的核心机构发挥功能。日本将全面进入战时体制，遂行速战速决的战争。 "
 BA_japan.29.a: "知道了。 "
 BA_japan.30.t: "日本革命国体同盟成立"
 BA_japan.30.d: "近卫文麿的改革失败，使日本的改革派陷入混乱。在统制派强力政治压力下，近卫的温和改革终告挫折，而北一辉与皇道派的激进思想，趁隙再度浮现。获得倡导天皇中心国家革命的皇道派与激进军方势力支持，「革命国体同盟」宣告成立。 \n\n北一辉高举打倒腐败政治体制与统制派独裁统治，建立以天皇为中心的新日本的口号，凝聚了强大的革命势力。他整合军方激进派、民族主义知识分子、左翼社会改革论者，以日本根本改革为目标。 "
 BA_japan.30.a: "我们将彻底铲除日本的毒瘤。 "
 BA_japan.31.t: "近卫文麿的辞职"
 BA_japan.31.d: "近卫文麿总理今日宣布辞职。近卫文麿表明自己已完成任务，似乎无意复出。 \n\n近卫文麿辞职之际，推荐东久迩宫稔彦王殿下为下任总理，但亦有大臣主张任命东条英机为总理，以统制军方。 "
 BA_japan.31.a: "东条英机，愿他能听从我们的意见。 "
 BA_japan.31.b: "稔彦殿下，以其崇高权威，应能压制军方。 "
 BA_japan.32.t: "承担 [JAP_tojo_hideki_end.GetName] 占领责任而下台的东条英机"
 BA_japan.32.d: "在我们准备对 [USA.GetName] 方战争期间，东条英机总理持续面临诸多反对。而今，在东条英机内阁领导下发动战争的局势中，竟发生 [USA.GetName] 方占领我国领土之事，东条英机不得不下台。 \n\n在政治压力下辞职的东条英机，其继任者为前朝鲜总督小矶国昭。 "
 BA_japan.32.a: "小矶国昭能打开局面吗？ "

 BA_japan.40.t: "投靠日本的汪精卫！"
 BA_japan.40.d: "震撼的消息传来。被誉为革命英雄、孙文继承者的汪精卫，据传已逃离重庆，抵达目前由日本占领的上海。\n\n始于蒋汪合作的权力冲突，逐渐将他孤立。特别是蒋介石出任国民党总裁，将汪精卫排挤为副总裁后，两人关系完全破裂。\n\n其后，汪精卫在武汉沦陷后，判断抗战已无意义，与日本缔结密约后逃离重庆，转赴河内。此举足以被怀疑为变节，国民政府下令暗杀汪精卫。然而他幸运躲过暗杀企图，即使自己未曾确实做出卖国行为，仍与动用武力的国民政府及蒋介石断绝关系。"
 BA_japan.40.a: "「兄长请走易路，弟弟愿行难途。」"
 BA_japan_40_tt: "「悲痛而惋惜。惟盼其能自省归来。」\n- 蒋介石"

 BA_japan.41.t: "汪精卫加入维新政府"
 BA_japan.41.d: "特拉乌曼工作的失败，以及为结束长期化的中日战争而尝试的汪精卫工作，成功了！汪精卫抵达上海，与众多亲日人士开始商议，在汪精卫主导下成立中华民国国民政府。"
 BA_japan.41.a: "战争即将结束！"

 BA_japan.42.t: "[MEN.GetName] 的命运"
 BA_japan.42.d: "[MEN.GetName] 是个相当矛盾的政府。虽为蒙古人而设，但其实效统治的领土上，居住的中国人与满洲人反而比蒙古人更多。现在，我们必须决定他们的命运。"
 BA_japan.42.a: "将其作为吞并 [MON.GetAdjective] 的桥头堡"
 BA_japan.42.b: "如今已无需要，降格为 [WCH.GetAdjective] 的自治政府"
 BA_japan.42.c: "降格为 [WCH.GetAdjective] 的自治政府，并以此为名义，向 [MON.GetAdjective] 主张领土权"

 BA_japan.43.t: "与 [TIB.GetAdjective] 谈判"
 BA_japan.43.d: "西藏虽位处中国边疆，但正位于英国殖民地印度上方，因此利于侧翼攻击。然而反之，若英国对西藏施加影响力并将其纳为殖民地，则意味着中国侧翼危险。因此，我们必须确实将西藏引入大东亚共荣圈势力。"
 BA_japan.43.b: "若将 [601.GetName] 与 [604.GetName] 归还，我方愿与贵方合作。"

 BA_japan.44.t: "与 [FROM.GetAdjective] 谈判？"
 BA_japan.44.d: "巴拉巴拉，说实话，谁会去玩西藏？我觉得没人会吧"
 BA_japan.44.a: "正合我意"

 BA_japan.45.t: "决定参与我们大业的 [FROM.GetAdjective]"
 BA_japan.45.d: "[FROM.GetAdjective] 方决定参与我们的大业！借此，我们离大东亚共荣更近一步。"
 BA_japan.43.a: "万岁！"

