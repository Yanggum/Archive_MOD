 JAP_support_for_the_manchurian_faction: "支援满洲派"
 JAP_support_for_the_manchurian_faction_desc: "主导满洲事变的满洲派，是强烈支持日本大东亚整合政策的势力。他们企图强化在满洲的影响力，藉由资源与军事力量实现其终极目标。"

