 JAP_formation_of_fumimaro_konoe_cabinet_desc: "我们将任命同时获得皇道派与大众支持、能抑制军方、稳定日本政治的近卫文麿出任总理职务。"

 JAP_establishment_of_the_imperial_rule_assistance_association: "新体制运动"
