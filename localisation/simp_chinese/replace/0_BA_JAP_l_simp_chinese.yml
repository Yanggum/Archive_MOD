 JAP_establishment_of_special_economic_recovery_investigative_committee: "经济复苏特别调查委员会"
 JAP_establishment_of_special_economic_recovery_investigative_committee_desc: "统制派在上次大恐慌的应对中扮演主导角色。我们将借此问题，组织委员会批评统制派的经济失策，并提出替代经济体制。"

