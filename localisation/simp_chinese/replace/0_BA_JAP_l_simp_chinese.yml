 MEN_add_core_of_mongolia: "整合蒙古"
 MEN_add_core_of_mongolia_desc: "数年前起即主张对蒙古的领土权，但乌兰巴托非法政府一直拒绝我们的正当要求，持续侵夺领土。然而，我们最值得信赖的盟友 [JAP.GetAdjective] 已驱逐乌兰巴托非法政府，将正当统治权归还于我。现在，我们必须主张对蒙古的正统性，将蒙古人统合于单一政府之下。"