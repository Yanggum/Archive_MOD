 # 亞瑠不結盟/共產路線特質
 HEU_gehenna_german_culture_trait: "日耳曼民族的守护者"
 HEU_aru_depression_1: "忧郁症\n§g独处时或许会发作，但至少在便利屋员工面前，她能展现笑容。或许可以透过努力克服。至少亚瑠是这么想的。§!"
 HEU_aru_depression_2: "中度忧郁症\n§g难道是因为我活着，大家才会这么辛苦吗？如果我消失，大家是不是就会幸福？我为什么会在这里？为什么我得在这里看着别人为我而死？§!"
 HEU_aru_chroma_1: "§R重伤§!\n§g被色彩侵染恐怖化之后，亚瑠便昏迷不醒，只躺在医院病床上…§!"
 HEU_aru_chroma_2: "恐怖化\n§g即使被色彩侵染，她依然是便利屋68员工们珍视的老板、朋友、同事。§!"
 HEU_grand_prince_of_luxembourg: "卢森堡人的女大公\n§g陆八魔亚瑠作为陆八魔家族的创始者，登基为卢森堡大公国的女大公。为了纪念透过国民选举获得大公之位，爵位名称定为「卢森堡人的大公」，而非「卢森堡大公」。 §!"
 HEU_grand_prince_of_luxembourg_alt: "卢森堡人的女大公\n§g陆八魔亚瑠作为陆八魔家族的创始者，登基为卢森堡大公国的女大公。透过与共产党妥协，她成为不世袭的君主，若她退位或去世，卢森堡将转变为共和国。 §!"
 HEU_benriya_leader_trait: "便利屋68的实质领导者\n§g亚瑠在遭囚禁事件后对政治活动变得非常消极。说实话，更像是「对政治幻灭」了。现在必须由你来引领便利屋。 §!"
 HEU_trinity_leader_trait: "三一招待代理\n§g联邦法通过后，约翰派与救护骑士团长成为三一的领导者，因此这是国家总理兼任的名誉职。 §!"

