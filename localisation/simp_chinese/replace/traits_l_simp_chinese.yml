 GEH_friendly_sociopath: "友善的反社会者\n§g「日奈」完美模仿了真正空崎日奈的口头禅和举止，在辅导部办公室里，她扮演着资深行政官和所有部员憧憬的「完美辅导会长」。但对现在的她而言，所有国民只是为了格黑娜辅导部而应使用的适当零件，她对待非部员国民的态度中，感受不到一丝人性。 §!"
