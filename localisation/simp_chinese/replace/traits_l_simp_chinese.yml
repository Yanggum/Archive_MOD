 RED_bright_polar_star: "赤红闪耀的革命北极星"
 RED_bright_polar_star_desc: "\n §L"文明的进步与历史的发展，即「社会的变革」，源自何处？ ——源自社会矛盾的累积。 "\n\n 连河切里诺终于觉醒了。切里诺真正成为了革命家，她站在学园的中心、学生们的中央，作为「统一团结的核心」坚定地闪耀着光芒。以学生为首的民众们，以切里诺为中心，结成了钢铁般的团结！ \n\n 但这并非像过去那样，切里诺在进行压迫与钳制。民众随时可以推翻并驱逐她，但切里诺展现出的领导力不允许这样做。切里诺透过自身反覆的思想斗争与理念学习，获得新生，成功打破了赤冬的内在矛盾——例如威权主义的组织结构、与当地人的冲突、理念与现实的乖离，或是产业经济上的种种矛盾——实现了将旧社会消解为新社会的辉煌成就。 \n\n 切里诺已重生为引路人。在矛盾中彷徨的民众，终于找到了「革命的北极星」，并将其紧握手中。既已找到方向，现在该向前迈进了！ §!"
