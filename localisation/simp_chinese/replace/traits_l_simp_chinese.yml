 GEH_ako_trait_Z: "资深行政官\n§g代理退休的空崎日奈，暂行辅导会长职务。 §!"
 GEH_ako_trait_Y: "理性的学生会长\n§g继前辅导会长空崎日奈与前万魔殿议长羽沼真琴之后，成为格黑娜学生会长的天雨亚子。她如今试图着眼于格黑娜整体，而非仅是空崎日奈个人。 §!"
 GEH_ako_trait_X: "爱恶作剧的辅导会长\n§g继承前辅导会长空崎日奈，成为格黑娜辅导会长的天雨亚子。她努力填补空崎日奈的空缺，常透过向白子亚瑠下达不合理行政命令来纾解工作压力。 §!"
