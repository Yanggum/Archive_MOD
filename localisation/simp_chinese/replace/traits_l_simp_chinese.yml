 GEH_chairman_of_the_people_1: "坚定的人民总统\n§g枣伊吕波是联邦的建国者，也是首任总统。她如同在巨大斗争波澜中坚定屹立的辉煌巨城，将继续治理联邦。 §!"
 GEH_chairman_of_the_people_b_1: "民众的总统\n§g枣伊吕波是获得两派支持的历史人物，也是联邦合众国的总统。作为在派系政治的混乱中包容万象的温和领导者，她将治理联邦。 §!"
 GEH_chairman_of_the_people_b_2: "人民的元首\n§g枣伊吕波是联邦政府的象征，也是新恢复的元首职位的领导者。虽然无法像旧元首那样挥洒强大权威，但作为两派最重要的仲裁者，她将调解联邦。 §!"
 GEM_coordinator_trait: "联邦国家协调者"
 GEH_chairman_of_the_people_a: "橡树的领导者\n§g枣伊吕波是新德国人的象征，也是新民族的领导者。如同强韧的橡树，德意志将在这片土地上永世扎根。 §!"
 GEH_chairman_of_the_people_a2: "心脏之城\n§g枣伊吕波是所有德国联邦民的求道者，是为各民族建设安乐天堂的建设者。所有联邦民族的灿烂队伍将得到守护。 §!"
