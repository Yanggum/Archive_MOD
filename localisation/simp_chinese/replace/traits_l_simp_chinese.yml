 GEH_motomiya_chiaki_trait_OL1: "理性与合理性\n§g如同引领创新的哲学家国王，努力建设高效率国家的我们的领导者。§!"
 GEH_motomiya_chiaki_trait_OR1: "民众的书记长\n§g国家有义务保障公民的生活，这体现在「从摇篮到坟墓」的口号之下。 §!"
