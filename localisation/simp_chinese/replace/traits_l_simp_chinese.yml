 GEH_puppet_leader_hina: "傀儡领导者\n§g反正亚子会处理所有事，何必操心国政运营？ §!"
 GEH_ako_partner_leader_hina: "亚子的伙伴\n§g只要亚子在身边，日奈绝不会倒下。 §!"
 GEH_pioneer_of_science: "科学的先驱\n§g委员会体制正以追赶千禧年为目标发展。无论有何困难，我们都将追上千禧年的科学技术。 §!"
 GEH_yumeji_no_hana: "梦途之花\n§g空崎日奈击败了从辅导部情报部到德国中央党广泛存在的对亚子的批评声浪，实现了两人的幸福。 §!"
