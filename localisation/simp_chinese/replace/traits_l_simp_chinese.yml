 GEH_military_chairman_2: "军阀领导者"
 GEH_military_chairman_ako: "身着制服的公民\n§g空崎日奈不仅仅是军方领导人。她是联邦共和国的议长，是议会主义的热烈支持者，向委员会大幅移交权力，并支持技术官僚。§!"
 GEH_military_chairman_amau: "身着制服的公民\n§g空崎日奈不仅仅是军方领导人。作为守护联邦共和国宪法的委员会主席，她成为了法律、秩序与稳固管控式民主的象征。§!"
 GEH_military_chairman_c: "国防委员长\n§g空崎日奈投身于防卫格黑娜学园、守护祖国的事业。她是委员长、执行部的制衡者，为稳定守护格黑娜国家而进行着广泛的努力。§!"
 GEH_military_chairman_cl: "格黑娜学生会长\n§g空崎日奈是格黑娜学园的学生会长，也是格黑娜风纪委员会的委员长。有人批评空崎日奈是独裁者，也有人指责她过于软弱。但确凿的事实是，格黑娜学园能维持现状，全赖空崎日奈的选择。§!"
 GEM_horns_are_new_wings: "角是新的翅膀\n§g不能因为长了角就说不能成为日耳曼民族的领导者。她成为了全德国堂堂正正的领导者，羽沼真琴将作为德国的元首被永远铭记。§!"
 GEM_horns_are_new_wings_chiaki: "角是新的翅膀\n§g不能因为长了角就说不能成为欧洲的领导者。她成为了所有德国、巴伐利亚、莱茵等在内的泛德意志地区堂堂正正的领导者，元宫千夏将被历史永远铭记。§!"
