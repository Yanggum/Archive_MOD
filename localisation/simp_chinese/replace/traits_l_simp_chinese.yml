 GEH_motomiya_chiaki_trait_A1: "人民的元首\n§g社会共和国元首的职位，是保障全体人民公益的一份宪章，一份巨大的契约书。 §!"
 GEH_motomiya_chiaki_trait_A2: "国家大总统\n§g击退巨大邪恶，在各种危机中努力守护日耳曼-格黑娜文明的我们的领导者。 §!"
