 GEH_purist_l: "祖国的防波堤\n§g白子亚瑠学生委员长是筛选无数「民族文化污染」的滤网，是培育民族成长土壤的农夫。 §!"
 GEH_purist_r: "格黑娜的重建者\n§g白子亚瑠监管者是融合格黑娜与德意志文明的熔炉，是铲除格黑娜-德国颓废文化、稳定祖国的文明重建者。 §!"
