 GEM_fortress_of_progress_trait: "站在最前沿的领导者\n§g德意志联邦绝不能停滞不前。作为引领所有历史变革潮流的旗手、文明的前线步兵，我们必须冲在最前线射击敌人！ §!"
 GEM_leader_of_us_trait: "国家领导者\n§g德意志国的领导者，肩负最沉重负担的格黑娜希望。在无数政治混乱中，引领保护格黑娜与运作德意志国家这两大课题的，是我们堂堂正正的领导者。 §!"
 GEM_occult_reconstruction_trait: "神秘学家\n§g时而进行左翼革命，时而退步反动，在看似混乱的诸多举措中遵循自身规则行事的我们的神秘学家。 §!"
 GEM_gehennaism_trait: "格黑娜式的\n§g自宣告成立德意志国以来，羽沼真琴做出了颠覆既有德意志人预期的选择，正从社会各个层面灌输格黑娜文化。 §!"
 GEM_mini_gehenna_academy_trait: "兼任格黑娜学园学生会长\n§g格黑娜学园学生会长是在宣告成立德意志国后，明确规定其缩小化角色并重新设计的职务之一，成为某种为格黑娜系服务的代表团。 §!"
 GEM_small_gehenna_academy_trait: "小格黑娜学园\n§g小格黑娜学园是在宣告成立德意志国后，明确规定其缩小化角色并重新设计的新格黑娜学园，是为格黑娜系服务的代表团体之一，也是守护格黑娜学园传统与文化的小型共同体。 §!"
 GEM_better_integration_trait: "国家统合主义者\n§g格黑娜系与德意志系终究生活在同一个国家中。人为的分离只会造成人为的歧视，因此我们必须推动更好的统合。首先从格黑娜学园接纳德国学生开始。 §!"
