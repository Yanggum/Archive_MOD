 GEH_the_guardian_of_freedom: "自由的守护者"
 GEH_puppet_leader_hina_bad: "傀儡议长\n§g空崎日奈并非依自身意志统治国家，只是代言「大众意志」的象征性议长。 §!"
 GEH_military_chairman_hina: "失败的军人行政家"
 GEH_iori_trait_c_l: "格黑娜学生委员长\n§g在空崎日奈悲剧性失踪后，白子亚瑠高喊守护「纯粹奇普托斯文化」站到台前。她不再只是单纯的执行会长，而是引领所有格黑娜学生的委员长。在她的领导下，格黑娜将重生为崇拜拥有光环的奇普托斯人之优越性，排除所有污染祖国的外部影响的强大军事国家。 §!"
 GEH_iori_trait_c_r: "新任监管者\n§g空崎日奈的悲剧给格黑娜留下了深深的伤痕与治愈的需求。白子亚瑠挺身而出，为了重建这个破碎的祖国。她想证明，只有强大的秩序才能拯救格黑娜，清除所有摧毁日奈的混乱与污染。 §!"
 GEH_celestial_revolution_trait: "文化革命"
 GEH_celestial_revolution_trait_1: "文化革命"
 GEH_celestial_revolution_trait_2: "文化革命"
 GEH_celestial_revolution_trait_B: "渴望自由"
 GEH_celestial_revolution_trait_C: "渴望秩序"
 GEH_saint_gehenna_academy_A: "格黑娜的学生会长\n§g羽美绘里香是在空崎日奈消失后的格黑娜中，被认为最温和、立场最稳健的人物。她如今作为格黑娜的学生会长，将抹去疯狂与混乱的伤痕，重建圣格黑娜学园。 §!"
 GEH_saint_gehenna_academy_B: "格黑娜的学生会长\n§g日宫千夏在搜捕叛乱主义者的疯狂中，曾被指控为叛乱主义者，权力几乎被剥夺殆尽。但她透过持续努力改善形象，传达了真心，如今将作为圣格黑娜学园中近距离见证空崎日奈的人留存于世。 §!"
 GEH_saint_gehenna_academy_C: "格黑娜的学生会长\n§g爱清枫香被认为是格黑娜学生会长候选人中最不寻常的人物。她在混乱中只为格黑娜学生提供一餐而努力，结果获得了格黑娜内的大量支持。据传选举期间得到了美食研究会的热烈支持，大部分宣传由美食研究会代劳。 §!"
 GEH_eternal_hina_sorasaki: "我们永远的辅导部长\n§g空崎日奈虽已失踪，但我们决定推举空崎日奈为我们永远的辅导会长。空崎日奈委员会将以过去空崎日奈的发言与确立的日奈主义方法论，引导并保护国家。 §!"
 GEH_morning_star_club_A: "亲切的学生会长\n§g夜樱绮罗良因竞选期间展现的各种面貌，被认为是最温和的人物。她带领着联谊社团「闪亮亮部」，以「青春格黑娜」宣传赢得巨大欢迎。 §!"
 GEH_morning_star_club_B: "供给部长兼任学生会长\n§g爱清枫香在格黑娜学生会长候选人中获得了高支持率。她只为格黑娜学生提供一餐而努力，结果获得了格黑娜内的大量支持。据传选举期间得到了美食研究会的热烈支持，大部分宣传由美食研究会代劳。 §!"
