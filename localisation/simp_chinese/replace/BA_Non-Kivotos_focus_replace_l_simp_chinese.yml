 USA_intervention_in_europe:0 "干預舊秩序"
 USA_intervention_in_europe_desc:0 "新秩序已经降临。我们必须进行干预，以确保崩溃的旧秩序无法东山再起。"
 USA_war_plan_gold_desc:0 "法国正对千禧年学园虎视眈眈。如果让他们获取了千禧年的科学技术，将对我们构成巨大的威胁。"
 USA_war_plan_silver_desc:0 "意大利的扩张主义行动仍在持续。如果他们膨胀的帝国野心与我们的国家利益发生冲突，我们必须做好准备。"
 USA_war_plan_white_desc:0 "在旧秩序崩溃之际，共产主义的威胁正在扩张。对我国乃至全世界而言，没有比这更大的威胁了。"
 USA_war_plan_red_desc:0 "英国虽然在新秩序中遭受了沉重打击，但仍是欧洲的海军强国。这一事实令我们感到不安。"
 USA_war_plan_black:0 "靛青战争计画" 
 USA_war_plan_black_desc:0 "他们表面上看似沉寂，实则是世界上最危险的敌人。我们必须在局势失控之前，彻底将其击退。"

