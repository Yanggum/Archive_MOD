japanese_fascism: "日本军部"
japanese_fascism_desc: "九一八事变后，军部崛起为日本的实质统治势力。凭借强大的军事力量，压倒内阁和政治势力，主导着国家的所有重大决策。 "

imperial_rule_assistance_association: "大政翼赞会"
imperial_rule_assistance_association_desc: "大政翼赞会是近卫文磨作为新体制运动的一环而建立的政党。为了实现近卫文磨的理想而建立的大政翼赞会，作为当前日本唯一的政党，形成了庞大的政治结构。 "

imperial_rule_assistance_association_neutrality: "大政翼赞会"
imperial_rule_assistance_association_neutrality_desc: "大政翼赞会是近卫文磨为了摆脱军部傀儡地位而创立的政党。起初作为新体制运动看似取得了不错的成果，但最终因军部的掣肘而失败，现已沦为追认和支持军部方针、徒具虚名的政党。 "

decagramaton_neutrality: "十字神名思想"
decagramaton_neutrality_desc: "十字神名是自称为神圣求道者的人工智慧系统。这是一种由十字神名「启蒙」的人工智慧，以及追随十字神名的预言者们所组成的独特意识形态，其特色在于专注于证明自身的存在，并以迎来经证明、分析并再现的新神之降临为目标而行动。 "

