stalinism:0 "史达林主义"
stalinism_desc:0 "作为应用和发展马克思列宁主义政策的一种政府形式，史达林主义主张在单一国家内建设社会主义的「一国社会主义」论，以及建立强大、威权的社会主义国家以肃清反革命份子的必要性。 "

trotskyism:0 "托洛茨基主义"
trotskyism_desc:0 "作为应用和发展马克思列宁主义政策的一种政府形式，托洛茨基主义主张需要强大的先锋党来肃清反革命分子，同时主张透过不断革命论，在资本主义国家的封锁措施孤立工人国家之前，将其逐一推翻。 "

