 ##國民精神
 SPR_kivotos_bolshevism:0 "异界-布尔什维主义"
 SPR_kivotos_bolshevism_desc:0 "1935年的『大转移』事件彻底搞砸了西班牙的一切。而那些被称为奇普托斯的存在，全都有明显的社会主义倾向（大概吧），这使得西班牙那座长期以来摇摇欲坠的社会危楼，在『异界-布尔什维主义』这股集体狂热支撑下，勉强维持着一种畸形的平衡。这场狂热终结之日，唯有对抗奇普托斯的收复失地运动画下句点之时。 "
 SPR_catholic_revolution:0 "天主教革命"
 SPR_catholic_revolution_desc:0 "当共产主义侵略者企图吞噬西班牙时，劳动者们选择了相信教会与上帝，而非工会与马克思。在此过程中所发生的一系列国家天主教改革，被统称为天主教革命，旧有的社会主义文化正被新的天主教文化所取代。 "
