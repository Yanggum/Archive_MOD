 ##角色
 SPBA_gil_robles: "何塞·马利亚·希尔-罗夫莱斯"
 SPBA_indalecio_prieto: "因达莱西奥·普列托"

 ##事件
 SPBA_event.1.desc: "1936年的大选，虽因延长的国家紧急状态影响而在相当紧张的局势下举行，但最终以自治右翼联盟为首的全国阵线的大规模竞选活动取得成果而告终。资本家们无限制的选举资金支持，以及北部发生的「大转移」所引发的不安，为保守派提供了决定性的政治养分；由此引发的人民阵线的分裂，使得许多选民选择了承诺秩序与稳定的右翼，而非共和国的混乱与左翼的不负责任行为。 \n\n新掌权的西班牙自治右翼联盟在 [Root.GetLeader] 总统的领导下，高举基于「国民的信赖」重建国家的名义。然而，街头已响起「异界-布尔什维主义」的口号，整个左翼势力开始被污名化为叛徒。 \n\n西班牙自治右翼联盟的胜利虽是合法的选举结果，但政治暴力与社会分裂并未平息，反而似乎进入了新的阶段。如今，政府非但不安抚反对派，反而显现出将其彻底打压，并借外部威胁之名建立强大威权体制的迹象。 "
 SPBA_event.1.a: "没有比这更好的选择了！ "

 SPBA_event.2.t: "议会驱逐总统！ "
 SPBA_event.2.desc: "自治右翼联盟在大选中获胜后，马德里的政坛便展开了紧锣密鼓的行动。 \n\n[Root.GetLeader] 总统仍试图守护共和国的宪政秩序，但议会内的全国阵线多数派将其标签为无能且不合时宜的人物。 \n\n以北部发生的大转移与零星左翼抵抗为借口，议会提出紧急议案，几乎以偷袭的方式通过了总统弹劾案。 \n\n在军方与长枪党民兵的支持下，西班牙自治右翼联盟领导层仿佛早有预谋地迅速夺取了权力，新的国家领导层承诺建立以西班牙军队为中心的强大威权秩序。 \n\n尽管披着合法程序的外衣，此事件实质上是议会发动的政变，将被视为西班牙政治史上的重大转捩点。 "
 SPBA_event.2.a: "为了秩序，需要强大的政府。 "

 SPBA_event.3.t: "共和派军官的余烬"
 SPBA_event.3.desc: "「国防部的走廊静得连根针掉在地上都能听见。但那片寂静并非安宁，反而像是暴风雨前的不祥预兆。刚印好的公报在军官们手中传阅时，只有低沉的叹息和咒骂声轻轻划破空气。政府和国营媒体铺天盖地的宣传，几乎等同于赤裸裸的清洗宣言。\n\n一位支持工团主义的将军无力地放下文件，低声说道：『从议会用政变赶走总统那时起，我们就该察觉了... 希尔-罗夫莱斯这家伙，正穿着法律的外衣，一步步解体共和国。』他的话无人能应。无数同僚早已因『涉嫌勾结异界-布尔什维主义』而遭逮捕或监视。如今，在合法法律的刀锋下，军中所有左翼倾向的将领都成了待宰的羔羊。\n\n打破沉默的是维森特·罗霍·柳奇。他默默走回自己的办公室，拿起最珍爱的钢笔。他的辞呈上只简短写了一句话：『本人曾忠于共和国，但无法再为一个不复存在的共和国服务。』签名之后，他摘下自己的军阶章，放在桌上。\n\n他的辞职只是个开端。从总参谋部备受尊敬的战略家到一线的年轻军官，凡是信仰共和国理想的军人，开始一个接一个地放下武器和职位。一夜之间，国防部长的桌上便堆积起数百份辞呈，堆积如山。全国阵线政府不费一兵一卒，便成功『净化』了军方。但这代价，却是让视荣誉如生命的军队陷入分裂，并为尚未熄灭的抵抗意志火上浇油。马德里的政治虽被墨水而非鲜血玷污，但那天，西班牙军队已一分为二。」"
 SPBA_event.3.a: "历史的一页翻过去了。 "

 SPBA_event.4.t:0 "延长国家紧急状态"
 SPBA_event.4.desc:0 "国家紧急状态延长案在议会中，经由全国阵线与部分中间政党的密切合作下获得一致通过。法案一经表决，西班牙军队，尤其是精锐的北非军团，便以维护治安为名，被派往西班牙各地的各大城市。到处可见摩尔人抽着烟巡逻街头；佩戴红色肩章的社会主义者，在西班牙人狂热的支持下被揍得鼻青脸肿。国民卫队时常以在大城市抓获的「枪械」为由挑起事端，而在神父与修女们的夹道欢迎中，西班牙军队有效地掌控了城市。 \n\n尽管人民阵线多数成员不服延长案，但这反而使西班牙陷入狂热的反共与复仇情绪中，此事实已昭然若揭。 "
 SPBA_event.4.a:0 "抓住那些造反的叛徒，把他们吊起来！ "

