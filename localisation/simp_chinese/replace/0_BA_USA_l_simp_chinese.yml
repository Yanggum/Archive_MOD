#介入基沃托斯
 USA_intervention_in_kivotos: "介入新秩序"
 USA_intervention_in_kivotos_desc: "旧秩序已经崩溃。我们必须介入，防止“新秩序”统治世界。"

#千禧科学学院干预
 USA_war_plan_MIL: "蓝色战争计划"
 USA_war_plan_MIL_desc: "法国人民正顶着千年学园的残酷镇压进行激烈抵抗。只要与他们的反抗意志并肩作战，即便是压倒性的科学技术也能被克服。"

#格赫娜学园干预
 USA_war_plan_GEH: "粉色战争计划"
 USA_war_plan_GEH_desc: "那些长着恶魔模样、甚至可能本身就是恶魔的家伙，是我们必须优先铲除的存在。"

#圣三一综合学园介入
 USA_war_plan_TRM: "黑色战争计划"
 USA_war_plan_TRM_desc: "与异界人联手的纳粹行径，简直可以用反人类来形容。我们拥有一种大义，那就是必须净化背叛人类的纳粹以及那些堕落的天使。"

#支援德国海军
 USA_war_plan_GEK: "收复德国行动"
 USA_war_plan_GEK_desc: "德国战争海军虽有充分的意愿夺回本土，但对抗敌人的军队规模尚不足够。德国的解放需要我们的帮助。"

#赤冬联邦学园
 USA_war_plan_WIN: "青绿色战争计划"
 USA_war_plan_WIN_desc: "共产主义与异界人，还有比这更恐怖的存在吗？"

#介入凯撒集团
 USA_war_plan_KAI: "土黄色战争计划"
 USA_war_plan_KAI_desc: "谁知道一个挑起无名战争的企业国家会做出什么事来？唯一可以确定的是，如果放任不管，他们将会引发更大的混乱。"


