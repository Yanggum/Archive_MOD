#事件
 usa_chroma_event.1.t: "临时政府的建立"
 usa_chroma_event.1.d: "在未知存在将华盛顿彻底抹除后，全美陷入了混乱。随着政府中枢瞬间消失，公民陷入恐慌，社会秩序分崩离析。然而，美利坚合众国陆军坚持抵抗到了最后。他们直面那身份不明的敌人——“色彩”的攻击，并勉强成功遏制了威胁。\n\n在此过程中，政府首脑及要员们越过洛基山脉逃往西部，开始筹备国家重建。在避难所，他们建立了美利坚合众国临时政府，正动员所有剩余资源准备迎接新的战争。\n\n留给我们的将是漫长的战争。对抗未知敌人的战斗绝不会在短期内结束，未来将伴随无数牺牲与苦难。但美国已下定决心。我们活了下来，现在，我们将继续前进。"
 usa_chroma_event.1.a: "不惜一切手段，挡住他们！"
 usa_chroma_event.1.b: "幸好西部还是安全的。"

 usa_chroma_event_1_tt: "§Y所有政治家§!将选择§Y退休§!或加入 §Y[USA.GetFlag] 临时政府§!侧。\n§Y所有海军指挥官§!将选择§Y退休§!或加入 §Y[USA.GetFlag] 临时政府§!侧。\n\n"

 usa_chroma_event.3.t: "色彩的胜利"
 usa_chroma_event.3.d: "尽管美利坚合众国陆军进行了顽强的抵抗，但在那惨烈的搏杀之后，他们最终还是未能挡住色彩的进攻。那些身份不明的存在逐一摧毁了我们的防线，现在，他们的触手已伸向了流亡政府的鼻尖。\n\n所幸，那些恐怖的存在似乎并无意进军洛基山脉另一侧。他们的入侵在山脉前止步了，使我们得以利用这短暂的喘息之机寻求新的出路。\n\n现在是团结仅剩的领土、图谋美利坚再造之时。虽然我们的资源有限，但绝不屈服。我们必须找到在这片土地上重筑自由与繁荣的方法"
 usa_chroma_event.3.a: "我们真的能做到吗？"

 usa_chroma_event.4.t: "美国国会及行政部恢复"
 usa_chroma_event.4.d: "在历经重重危机后，我们终于成功从国土上驱逐了侵略美利坚的未知存在色彩。\n\n这伟大的一天将永载史册，美国的领土再次重归完整！"
 usa_chroma_event.4.a: "完美！"

 usa_chroma_event.5.t: "临时行政部？"
 usa_chroma_event.5.d: "面对未知存在突如其来的入侵，无数美国政治家在恐惧中颤抖，甚至可能阻碍我军的行动。刚才有人提议，将这些“和平主义者”全部遣往洛基山脉另一侧，建立一个收容政治家与难民的临时行政国，以此清除阻碍我们执行战争的所有障碍。"
 usa_chroma_event.5.a: "没错，我们将采取极端的军事策略。"
 usa_chroma_event.5.b: "即便会造成些许混乱，绝对不行。"
 usa_chroma_event.5.c: "我们有力量果断地应对这种局面。"

