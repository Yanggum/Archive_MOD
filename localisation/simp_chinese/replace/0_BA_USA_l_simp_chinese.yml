 USABA_german_ethnic_union_in_america_desc: "德裔美国人联盟"
 USABA_german_ethnic_union_in_america_tt: "§G6§! 个 §Y德国民族主义民兵§! 师已在首都正式成立。"
 USABA_german_national_protection_law: "德国民族保护法"
 USABA_german_national_protection_law_desc: "我们必须制定一项保护法案，以确保流亡的德国人在回到其领土之前，在美利坚合众国内维持‘特殊’地位。"

