 usa_chroma_event.2.t: "经济重建受阻"
 usa_chroma_event.2.d: "由于我国目前正遭受攻击，经济重建计划已无法继续进行。虽然当和平再次降临后，我们或许能重启这些计划，但现在我们必须优先集中力量生产军需物资。"
 usa_chroma_event.2.a: "那就指望发一笔战争财吧。"

 usa_event.1.t: "呈上议会的一份宣言"
 usa_event.1.d: "异界人突然入侵了欧洲大陆，正在压迫受苦的欧洲人民。\n\n我们至今保持沉默，并非因为畏惧，而是为了能彻底解放欧洲人——不，是为了解放全人类。\n\n看吧，我们一直隐忍至今，已经创造了最佳的时机。现在，解放的时刻已经到来！"
 usa_event.1: "终结所有战争的战争(The war to end war, The war to end all wars)"

 usa_event.2.t: "追加经济危机的征兆"
 usa_event.2.d: "由于欧洲市场的消亡，美国的主要贸易公司开始遭受沉重打击。出口渠道被封锁，利润锐减，小额投资者相继破产。他们正被一个接一个地赶向街头，不安感正在蔓延。经济危机的迹象随处可见，整体市场的不安情绪已达到高潮。"
 usa_event.2.a: "预感不妙..."

 usa_event.3.t: "经济崩溃的前兆"
 usa_event.3.d: "欧洲市场的崩溃绝非暂时的冲击。随着贸易公司开始倒闭，无数依赖它们的散户投资者正陷入连锁破产。金融市场正缓慢萎缩，美利坚经济的根基已经开始动摇。虽然表面上一切看起来还算正常，但水面之下，经济正在缓慢崩解的焦虑感正与日俱增。"
 usa_event.3.a: "一切都会好起来的..."

 usa_event.4.t: "第二次大萧条"
 usa_event.4.d: "随着身份不明的异界人摧毁旧秩序并占领欧洲，美利坚合众国投资者持有的绝大部分欧洲资产已沦为废纸。在伦敦、柏林、巴黎所有金融交易所集体暴雷的这一史无前例的事态中，仅其波及的影响便让纽约证券交易所化为废墟，华尔街陷入弥留之际。\n\n不仅如此，由于针对欧洲各国的贸易与交易全部停滞，合众国瞬间被彻底逐出了巨大的欧洲市场。无数企业因无法收回货款而面临破产危机，更多的工厂已经停止了运转。\n\n现在，所有的合众国公民都已深切地意识到：第二次大萧条已经降临。"
 usa_event.4.a: "今年难道是 1929 年吗？"

 usa_event.5.t: "不再闪耀的街道"
 usa_event.5.d: "曾几何时，纽约的新泽西港每天都沉浸在灯塔与无数灯光的辉映中，如今却再也无法找回往昔的光彩。作为主要出口目的地的欧洲已经消亡，其他市场根本无法消化原本属于欧洲的商品需求。\n\n美利坚合众国的无数贸易公司相继倒闭，受此波及，港口变得空空荡荡也是理所当然的事情。\n\n既然作为纽约核心港口的新泽西港已经彻底没落，我们构建新大西洋贸易路线的尝试宣告失败，那些破产的贸易公司将再也无法起死回生。"
 usa_event.5.a: "这里剩下的只有废墟。"

 usa_event.6.t: "充斥着失业者的城市"
 usa_event.6.d: "美利坚合众国的首都华盛顿特区，曾是一座汇聚了无数劳动者与企业家的活力之城。然而现在，它已被黑暗侵蚀，丧失了往日的生机。街头到处是放弃就业、徘徊游荡的青年，找不到销路的农产品被制成食物，在救济站艰难地分发着。\n\n美国的经济心脏似乎已停止了跳动。曾经连接东西海岸的无数货运列车已经停驶，那些辉煌夺目的建筑也已灯火暗淡。\n\n无数企业破产，无数工人被赶向街头。虽然我们正通过“新政”尝试雇佣失业者，但对于解决过剩的供应来说只是杯水车薪。美国经济仍深陷沉重的衰退泥潭，复兴之路遥不可及。"
 usa_event.6.a: "“胡佛村”又变多了！"

 usa_event.7.t: "走向毁灭的美国农业"
 usa_event.7.d: "美利坚合众国辽阔的“玉米带”，曾是闪耀着金光的原野，向包括欧洲在内的无数国家出口农产品，彰显着强国地位。然而，在经历了“尘盆”的袭击、欧洲市场的消亡以及畜牧业接连倒闭的重创后，它已逐渐走向没落。农民们怀揣着最后的希望，向联邦政府发出了求救信号。\n\n然而，我们已无力回天。原本美国作物的主要消费者是欧洲、苏联以及国内的畜牧业。但在欧洲因战争和经济崩溃而毁灭、苏联不再需要我们的谷物、且国内畜牧业已彻底倒闭的当下，能接收美国农产品的市场已荡然无存。\n\n我们被迫眼睁睁地看着大型农业企业纷纷破产。他们的谷物只能在仓库中堆积如山，现在既没有手段能拯救他们，这个世界也不再需要他们的农产品了。"
 usa_event.7.a: "美国的粮仓“玉米带”，已不复存在。"

 usa_event.8.t: "金融市场的陨落"
 usa_event.8.d: "美国全境公开上演的银行挤兑和大规模债务违约，充分暴露了美国的金融体系已彻底丧失信用。大萧条后未能恢复市场生机的合众国银行，正背负着巨额债务挣扎在生存边缘。许多银行被迫被合并，或者干脆关门大吉、卷款私逃，所有能想象到的灾难正一一化为现实。\n\n现在，即便是在共和党默许下进行的秘密货币发行，或是强行摊派坏账的手段，也已经无法再争取哪怕一丁点时间了。"
 usa_event.8.a: "我们完蛋了，彻底完蛋了！"

 usa_event.9.t: "银行集体倒闭"
 usa_event.9.d: "纽约的心脏--花旗银行，今天终于关门了。\n\n欧洲市场的崩溃和纽约港的萧条，是击垮这家银行的决定性因素。过去几周持续的大规模挤兑潮和坏账激增已无法再掩盖。银行管理层虽试图在最后时刻收拾残局，但所有努力最终都化为了泡影。\n\n聚集在总部前的民众终于意识到，他们再也无法取回存款了。大门紧锁，银行陷入了死一般的沉寂。\n\n现在，纽约的金融体系遭受了致命打击，其余波正在迅速扩散。花旗银行的倒闭并非偶然事件，它将是宣告美国经济彻底垮台的信号弹。"
 usa_event.9.a: "撑得够久了，虽然还是不够。"

 usa_event.10.t: "反政府示威者"
 usa_event.10.d: "纽约的街头再也找不回往日的平淡生活。市中心周边鳞次栉比的棚户区充满了贫困与绝望。这些由失业和贫困交织而成的棚户区，成了对政府愤怒与不信任的温床。示威者几乎每天都占据街道，高喊反政府口号。\n\n示威规模与日俱增。对政府无能和经济崩溃的愤怒重叠在一起，使城市陷入了持续的不安与暴力之中。\n\n警方虽在动用武力驱散人群，但这已成了例行公事。当全副武装的警察推开这街区的示威者，另一条街又会燃起新的抗议烈火。\n\n冲突不断循环，城市日益荒废。在这里，“平凡的日常”已成了奢望。在政府漠不关心与经济绝望催生的恶性循环中，纽约已沦为一座紧张与焦虑常态化的城市。警笛声与呐喊声交织的街道，似乎已到了无法回头的临界点。"
 usa_event.10.a: "罗斯福这次还能让希望重生吗？"

 usa_event.11.t: "死刑判决"
 usa_event.11.d: "无论是秘密印钞、转嫁坏账，还是最后尝试的大型银行国有化，都没能阻止联邦储备系统的崩溃。即便持续发行美元，人们也不再信任货币。现在即便想加息，也没人会听从。\n\n美利坚合众国的美元已彻底丧失信用，注定永无翻身之日。激进改革、自由放任、甚至是银行国有化，都没能解决美国的问题。我们现在必须承认：合众国的资本最终只能依赖盟友而非自身。\n\n在欧洲大国悉数毁灭的当下，新兴国家不再需要我们的商品。合众国的未来正变得暗淡，剩下的似乎只有积怨已久的南方各州即将爆发的疯狂。"
 usa_event.11.a: "上帝保佑美国..."

 usa_event.12.t: "底特律德裔暴动"
 usa_event.12.d: "在内战时期演变为强大政治团体的流亡德裔，及其影响下的右翼民兵组织，目前正占领底特律并引发骚乱。\n\n如果强行镇压，可能会爆发第三次美国内战。现在，我们必须做出决定。"
 usa_event.12.a: "真是...让人头大。"

 usa_event.13.t: "蔓延至[USA_rising_exiled_germans_2st.GetName]的德裔暴动"
 usa_event.13.d: "德裔群体的骚乱现已扩大到了[USA_rising_exiled_germans_2st.GetName]州。如果我们继续放任不管，事态将演变成更严重的暴乱。"
 usa_event.13.a: "哈？"

 usa_event.14.t: "第三次美国解体危机"
 usa_event.14.d: "德裔群体与右翼民兵引发的强力骚乱在扩大至[USA_rising_exiled_germans_2st.GetName] 州后达到了顶峰。他们自称为“全美救国旅”，正在大规模招募追随他们的极右翼公民。\n\n我们必须立刻决定：是立即对他们发动进攻，还是全盘接受他们的诉求！就在此时此刻！"
 usa_event.14.a: "糟糕。"

 usa_event.15.t: "来自[FROM.GetName] 的菲律宾领土要求"
 usa_event.15.d: "趁着我们因应对欧洲危机而导致对菲律宾影响力减弱的空档，[FROM.GetName] 发来了一份外交公文，要求我们将菲律宾转交给他们。\n\n针对此公文，我们面临两个选择：要么放弃菲律宾并将其移交给对方；要么尽管局势艰难，也要准备迎接战争。"
 usa_event.15.a: "放弃菲律宾。"
 usa_event.15.b: "准备战争。"

 usa_event.16.t: "[FROM.GetName] 侧从菲律宾撤军"
 usa_event.16.d: "根据我们的要求，[FROM.GetName] 方面已从菲律宾撤出了他们的军队。现在，我们可以按照自己的意愿处置菲律宾了。"
 usa_event.16.a: "很好。"

 usa_event.17.t: "[FROM.GetName] 侧拒绝归还"
 usa_event.17.d: "尽管我们发出了慈悲的外交信函，但[FROM.GetName] 方面似乎仍决心与我们开战。"
 usa_event.17.a: "意料之中的反应。"


 usa_event.19.t: "伊吕波的建议"
 usa_event.19.d: "哈啊啊...真麻烦...但是，既然他们需要我，那就没办法了..."
 usa_event.19.a: "就按她的建议办！"

 usa_event.20.t: "接受派对邀请的伊吹"
 usa_event.20.d: "格黑娜的吉祥物——伊吹接受了我们大使馆的邀请，出席了派对。\n\n世界上怎么会有这么可爱的生物存在？她在严密的保护下，在我们的派对上度过了一段愉快的时光。"
 usa_event.20.a: "伊吹就是很可爱嘛！"

 usa_event.21.t: "解决消费品问题的工业"
 usa_event.21.d: "大萧条结束后，我们对曾经产能过剩的消费品工业进行了大规模调整。"
 usa_event.21.a: "这仅仅是个开始。"

 usa_event.22.t: "解决建设问题的工业"
 usa_event.22.d: "大萧条结束后，我们清理了资本家们未能处理的土地问题，并重新启动了建设工业。"
 usa_event.22.a: "进度越来越清晰了。"

 usa_event.23.t: "解决生产问题的工业"
 usa_event.23.d: "大萧条结束后，我们推行了高效的就业政策，解决了此前因强制雇佣失业者而产生的生产效率问题。"
 usa_event.23.a: "总算快看到尽头了！"

 usa_event.24.t: "解决所有问题的工业"
 usa_event.24.d: "我们已经解决了激进工业改革带来的所有副作用。现在，街道上不再是失业者和流浪汉，取而代之的是幸福的父母与孩子们的身影。"
 usa_event.24.a: "终于完成了！！！"

 usa_event.25.t: "《粮食储备法》的施行"
 usa_event.25.d: "随着农业企业破产化为现实，我们有必要根据《粮食储备法》，将储备的粮食投放市场。\n\n当该法案最初颁布时，合众国公民还对总统的政策表示质疑；但现在，他们终于领悟到了这一决策的远见卓识。"
 usa_event.25.a: "干得好。"




 usa_new_civil_event.1.t: "脱离联邦的州！"
 usa_new_civil_event.1.desc: "一些州组建了一个名为“人类解放战线”的跨国组合机构，并向联邦政府发出了最后通牒，声称要脱离联邦，且不再配合我们的外交政策！\n\n我们必须对此做出即刻回应！绝不容许合众国陷入分裂！"
 usa_new_civil_event.1.a: "彻底粉碎他们！"




