###################### 新国策 ######################
######################################################

 USA_fast_train: "军事改革"
 USA_fast_train_desc: "由于过度的军备裁减，我军目前正陷入数量与质量双双下降的严重困境。我们将撤换那些庸碌无能的指挥官，并制定高效的军事计划以提升部队的训练水平。"


 USA_army_of_the_united_states_propaganda: "美利坚合众国陆军阅兵式"
 USA_army_of_the_united_states_propaganda_desc: "在赞颂克服大萧条之成就的同时，我们将举行美国陆军阅兵式，并着手向国会发起多方游说，以为后续的美国陆军重整军备获取资金。"
 





 ##################################
 ########### 共产美国 ##############
 #################################
 USABA_forced_wake_up: "震慑行动"
 USABA_forced_wake_up_desc: "我们将暂时强制启动大规模工厂，并对若干工业部门进行调整。虽然这会引发巨大的反弹，但在短期内能够有效刺激经济活力。"
 
 USABA_force_to_give_job: "强制增加就业岗位"
 USABA_force_to_give_job_desc: "随着大萧条的爆发，出现了某些工厂失业者满溢，而另一些地方却极度缺乏劳工的局面。我们将采取强制手段，将失业人员分配到劳动力短缺的工厂中去。"

 USABA_every_worker_welfare: "实施劳工配给制"
 USABA_every_worker_welfare_desc: "工人们在恶劣的环境下劳作，领取的薪水却微乎其微。目前采取的权宜之计在不久的将来定会引发罢工。我们必须防患于未然。"
 
 USABA_replace_industry: "产业重组"
 USABA_replace_industry_desc: "为了生产紧缺的粮食与生活必需品，我们将对多项产业进行大规模重编。尽管部分资本家会对此表示反对，但这是克服大萧条所必须采取的措施。"

 USABA_establish_government_industry: "向企业派遣人民委员"
 USABA_establish_government_industry_desc: "第二次大萧条源于大战争造成的欧洲市场崩溃。为了解决毁灭性的产能过剩问题，国家对企业的介入已是势在必行。"

 USA_bad_kivotos_RED: "追随赤冬"
 USA_bad_kivotos_RED_desc: "虽然这看起来是个荒谬透顶且愚蠢至极的选择，但说不定……会是个意外之策。"

 USA_bad_kivotos_RED_pudding: "进口赤冬特制布丁"
 USA_bad_kivotos_RED_pudding_desc: "我们将进口赤冬联邦学园最著名的标志性特产——联邦学园产布丁，并将其分发至全国各地。"

 USA_bad_kivotos_RED_more_pudding: "布丁国产化"
 USA_bad_kivotos_RED_more_pudding_desc: "虽然赤冬联邦学园的布丁品质极佳，但由于运输距离过远，导致产生了高昂的物流成本。我们将通过建立本土布丁生产工厂，以此降低成本，并实现赤冬联邦学园布丁在全国范围内的扩大配给。这不仅是美味的普及，更是国家工业能力的体现。"

 USA_be_red: "共产党夺取政权"
 USA_be_red_desc: "民主党未能妥善应对第二次大萧条。唯有成功解决第二次大萧条的我们共产党，才有资格领导政府。"

 USA_big_industry_plan: "第二次产业重组"
 USA_big_industry_plan_desc: "我们必须对作为权宜之计建立의 工业体系进行高效的再调整。虽然短期内可能会引发混乱与问题，但在不久的将来，这将带来更高的效率。"
 USA_big_industry_plan_1_tt: "\n国策完成后 90 天:"
 USA_big_industry_plan_2_tt: "\n国策完成后 180 天:"
 USA_big_industry_plan_3_tt: "\n国策完成后 270 天:"
 USA_big_industry_plan_4_tt: "\n国策完成后 360 天:"

 USA_final_economic_plan: "第三次产业重组"
 USA_final_economic_plan_desc: "我们目睹了第二次产业重组的成功。现在，作为最后一步，我们将以全新的经济理念重新编排产业。"
 USA_final_economic_plan_tt: "根据第二次产业重组后完成的国策分支，国民精神将得到改善。"

 USA_the_aggresive_comintern_2: "反法西斯政策"
 USA_the_aggresive_comintern_2_desc: "歐洲因大轉移，導致法西斯主義抬頭，對勞動者的壓迫接連不斷。我們必須剷除那些壓榨勞動者的法西斯國家。"

 USA_the_union_comintern_2: "革命支援"
 USA_the_union_comintern_2_desc: "大多數國家的勞動者都生活在壓迫之中。我們必須支援他們發起反抗壓迫的革命。"

 usa_my_way: "我们自己的道路"
 usa_my_way_desc: "馬克思列寧主義已被獨裁者們篡改與扭曲。我們與那些標榜共產主義的獨裁國家不同，我們將成為一個真正為勞動者建立的烏托邦國家。"

 USA_the_comintern: "外交政策讨论"
 USA_the_comintern_desc: "在我们专注于解决自身问题的期间，国际局势已发生剧变，前景变得扑朔迷离。我们必须将目光投向国内之外，培养洞察国际事务的眼光。"

 USA_the_aggresive_comintern: "积极防御政策"
 USA_the_aggresive_comintern_desc: "为了纠正混乱的国际局势，我们需要采取进攻性的外交政策。"

 USA_the_union_comintern: "绥靖性安全政策"
 USA_the_union_comintern_desc: "面对盘根错节的国际局势，若试图诉诸武力，势必会引发更大的问题。我们应当采取温和绥靖的方式来处理这些难题。"

 USA_modified_capitalism: "修正资本主义"
 USA_modified_capitalism_desc: "国家不应对应济置之不理，但也应将干预降至最低。这一策略将能有效缓和资本主义的内在矛盾。"

 USA_economic_interventionism: "完全计划经济"
 USA_economic_interventionism_desc: "现在，国家不应仅干预必要产业，而应全面介入所有产业，以协调供给与需求。这一策略将能杜绝盲目生产，从而防止大萧条之类的最坏情况再次发生。"

 USA_sov_economy_together: "美苏联合工业开发"
 USA_sov_economy_together_desc: "苏联通过五年计划成功实现了工业化，但代价是农业遭受了毁灭性打击。若两国联合进行工业开发，必能取长补短，产生积极的影响。"

 USA_sov_factory_together: "美苏联合军备开发"
 USA_sov_factory_together_desc: "我们将超越与苏联的民用产业开发，进一步开展军工产业的协作开发。这将能有效解决过去几年间持续进行的裁军问题。"

 USA_red_team: "意想不到的选项"
 USA_red_team_desc: "无论是欧洲人、异界人，甚至是我们自己，恐怕都未曾预料到这一抉择。但唯一可以预见的是——他们必将败亡，而胜利终将属于我们。"




 USA_add_dog: "邀请银色军团"
 USA_add_dog_desc: "我们将正式邀请在美利坚境内影响力日益扩大的法西斯运动加入政府，以确保拥有共同应对危机局势的力量。

 USABA_fireside_chats: "炉边谈话的持续"
 USABA_fireside_chats_desc: "炉边谈话是富兰克林·D·罗斯福总统自1933年起进行的一系列晚间广播演讲。曾向数百万国民亲切讲述大萧条复苏及应对紧急状态的这些电波，如今将再次发声，引领人民克服第二次大萧条。"

 USABA_develop_corn_belt: "紧急粮食储备法"
 USABA_develop_corn_belt_desc: "随着构成美利坚合众国‘玉米带’的大型农业企业破产危机迫在眉睫，我们必须采取符合非常时期的措施，预先确保粮食储备，以应对日后可能爆发的粮食危机。"
 USA_2nd_great_depression_4th_end_of_agriculture_endflag: "农业企业的破产"

 USABA_maintenance_of_isolation_policy: "维持孤立主义"
 USABA_maintenance_of_isolation_policy_desc: "美利坚将远离外部世界的混乱与危机，专注于国内事务。我们不会介入国际纷争，而是将经济复苏与内部稳定视为重中之重。通过将外部影响降至最低，美利坚旨在自我保护并实现经济自给自足。"
 USABA_maintenance_of_isolation_policy_desc_cst: "§g旨在实现美利坚经济自给自足的计划已开始初步筹备。§!"
 
 USABA_massive_bailout: "大规模救助贷款"
 USABA_massive_bailout_desc: "为了防止金融体系崩溃，我们将采取大规模救助贷款行动。通过救助银行及支柱产业，防止经济全面瓦解并恢复国民的信心。此项措施将成为经济复苏至关重要的第一步。"
 
 USABA_government_propaganda: "政府宣传"
 USABA_government_propaganda_desc: "为了向国民注入希望与信心，政府将开启强有力的宣传攻势。我们将动员所有媒体宣传政策，通过赢得国民支持来平息社会动荡。我们要确保国民信任并追随政府。"
 
 USABA_contact_with_opposition: "接触反对党"
 USABA_contact_with_opposition_desc: "我们将与反对党接触，达成跨党派的合作。在经济危机时刻，政治稳定至关重要，因此我们将听取反对党的意见，共同制定解决方案。通过这些努力，我们要让国民感受到团结而非政治分裂。"
 
 USABA_blurring_focus: "转移注意力"
 USABA_blurring_focus_desc: "政府将通过突出各种议题来分散公众的注意力。通过这种方式，我们将缓解政治压力，减轻国民对复杂问题的焦虑。我们要使国民无法直视危机的本质，从而减少社会冲突。"
 
 USABA_secret_economic_program: "秘密经济计划"
 USABA_secret_economic_program_desc: "我们将施行一项不予正式公布的秘密经济计划。在与反对党的合作下，我们将尝试通过秘密发行不良债券、印制钞票等手段，不惜一切代价确保政府财政。看来我们能以此争取到一些时间。"
 
 USABA_unrestricted_inflation_permitted: "允许无限通货膨胀"
 USABA_unrestricted_inflation_permitted_desc: "为了加速经济复苏，我们将允许无限通货膨胀。即使以牺牲货币价值为代价，我们也要减轻债务负担，并强制促进经济活动。这是一项果断且必不可少的措施。"
 USABA_regression_strategy_loweffect_tt: "§Y$USABA_regression_strategy$§! 完成重点后，被拆除的§Y民用工厂§!数量将会减少。"
 
 USABA_expansion_of_state_authority: "扩大州权"
 USABA_expansion_of_state_authority_desc: "在认定联邦政府已无法解决问题的情况下，我们将向各州政府移交权力。中央政府将不再干预，而是让各州自行解决问题。至少，这能减轻不少政治压力。"
 
 USABA_regression_strategy: "去进化战略"
 USABA_regression_strategy_desc: "抛弃复杂的现代经济，我们将回归自给自足的经济模式。通过重新整合资源与产业来谋求国家生存，并构建简单且稳定的经济结构。既然我们的金融业已经崩溃, 那么这就是必经之路。"
 
 USABA_american_reindustrialization: "美洲再工业化"
 USABA_american_reindustrialization_desc: "为了重振美国经济，我们将推行大规模的再工业化政策。我们将以制造业为核心重新调整经济结构，引领新的经济复苏。这是美国实现经济再次腾飞的必经阶段。"
 USABA_american_reindustrialization_desc_cst: "开启一系列旨在重建美国工业的决策。"

 USA_devil_economy: "美苏经济合作"
 USA_devil_economy_desc: "搬运原版内容"

 USA_support_RED: "赤冬援助" 
 USA_support_RED_desc: "切里诺小孩装大人"
 
 USA_support_SOV: "苏联援助"
 USA_support_SOV_desc: "有巨人援助的苏联，根本挡不住啊！"

 USA_old_team_nuclear: "曼哈顿计划"
 USA_old_team_nuclear_desc: "已经确认，枪炮对异界人无效。我们需要超乎想象的强大火力。"

#捍卫旧秩序
 USA_old_team: "捍卫旧秩序"
 USA_old_team_desc: "当异界人统治欧洲并建立新秩序时，我们美国一直在隐忍，再隐忍。现在，是时候解放受苦受难的欧洲人，不，是解放全人类了。"

 USA_support_alies: "同盟国援助"
 USA_support_alies_desc: "丧失本土并撤 퇴至殖民地的英法两国正紧密联合，复国之志如烈火般燃烧。我们必须提供军事援助，为解放欧洲奠定基础。"

 USA_attack_COU: "解放低地国家"
 USA_attack_COU_desc: "低地地区是美国顺利进入被异界人占领的欧洲的唯一门户，也是战略要地。我们必须解放因异界人侵略而受苦的低地各国人民，并以此打开通往欧洲的大门。"

 USA_support_GEK: "德国援助"
 USA_support_GEK_desc: "德国正被两大异界势力瓜分，沦为大战的炮灰并遭到惨烈屠杀。我们将援助外逃的德国难民，并承诺解放他们的本土。"
 
 USA_support_north_europe: "北欧援助"
 USA_support_north_europe_desc: "挪威、瑞典、丹麦正遭受异界之人的入侵和激进思想的侵蚀。我们将秘密支持他们，寻找机会将红色瘟疫从北欧驱逐出去。"
 
 USA_attack_KAI: "解放英国"
 USA_attack_KAI_desc: "英国虽已丧失本土，仍展现出坚定的抗战意志。我们将与他们并肩作战，击退异界人，并把故土还给英国人民。"
 
 USA_attack_MIL: "解放法国"
 USA_attack_MIL_desc: "曾高呼自由、平等与博爱的法国人，如今沦为了冷酷机器的奴隶。让我们解放他们，向世界证明民主之光尚未熄灭。"
 
 USA_attack_TRM: "解放东德"
 USA_attack_TRM_desc: "纳粹终究还是背叛了人类，选择了与异界人勾结！现在，是时候证明正义依然存在了。"

 USA_attack_GEH: "解放西德"
 USA_attack_GEH_desc: "那些传送到这里的恶魔竟然对手无寸铁的平民开枪，这种行径简直丧心病狂。我们将从恶魔手中解放德国人，并将他们彻底驱逐。"

 USA_support_FIN: "援助芬兰"
 USA_support_FIN_desc: "芬兰虽已从异界侵略者手中收复本土，但其军事实力尚不足以抵御第二次入侵。我们将援助芬兰，并以此为桥头堡，准备解放整个斯堪的纳维亚半岛。"

 USA_attack_RED: "解放北欧"
 USA_attack_RED_desc: "漫长的等待终于结束，解放斯堪的纳维亚的准备工作已全面就绪。面对散布‘红色瘟疫’的异界人，是时候去解放我们珍贵的民主了。"

 USA_old_team_guardian: "宣布胜利"
 USA_old_team_guardian_desc: "自‘大转移’发生、与异界人的总力战爆发以来，已过去许久。尽管敌军诡计百出，我军仍最终取胜。美利坚再次战胜了威胁自由的压迫者，赢得了胜利！"

 USA_marshall_plan: "马歇尔计划"
 USA_marshall_plan_desc: "战争虽已获胜，但欧洲的情势依然严峻。照此下去，新的矛盾极可能引发另一场战争。由乔治·马歇尔提议的‘马歇尔计划’将为欧洲各国提供经济援助，使其恢复到‘大转移’之前的水平。"

 USA_attack_abyss: "最后的战争"
 USA_attack_abyss_desc: "真正的敌人另有其人。尽管难以言说恐怖扑面而来，但我们别无选择，必须挺身而出。"

 USA_Pax_Americana: "§CPax§! §tAmericana§!"
 USA_Pax_Americana_desc: "在经历了无数战争与流血之后，在伟大的美国领导下，欧洲乃至全世界正从异界人的入侵中恢复，治愈战争的创伤。现在，我们已经摆脱了殖民帝国主导的旧秩序，一个‘美国主导的新秩序’时代已经降临。\n§C美利坚§! §t和平!!§!"


 #纳入新秩序
 USA_new_team: "顺应新秩序"
 USA_new_team_desc: "曾凭借强大国力主宰世界秩序的欧洲帝国，已在大转移中土崩瓦解。我们必须与摧毁旧秩序的力量建立友好关系，以此确立新秩序。\n§R우为了大义，我们将放弃一切。你，也要加入吗？§R"

 USA_new_team_TV: "宣传"
 USA_new_team_TV_desc: "至今仍有不少人对与异界人的亲善关系表示质疑。通过适度的宣传，强调与异界人交好的种种益处，我们将能把这些人争取到我们这一边。"

 USA_new_team_marry: "提出异界法案"
 USA_new_team_marry_desc: "部分进入美国的异界人正处于当地法律的灰色地带，其身份十分模糊。为了在法律上保护他们，并防止日后可能产生的混乱，我们必须制定针对异界人的特别法案。"

 USA_new_team_anime: "动画放映"
 USA_new_team_anime_desc: "由于山海经门主妃咲的体操视频在全社会引发了巨大轰动，为了消除民众对异界人的恐惧或偏见，我们应该利用这段视频进行宣传，让民众产生亲近感。"

 USA_new_team_civilwar: "决策"
 USA_new_team_civilwar_desc: "为了更好的未来，我们至今做出了许多艰难的决定。而现在，该是下达最后决断的时候了。尽管世人皆指责我们是背叛人类的叛徒，但最终，他们会明白我们才是正确的一方。\n§R万事俱备。现在，是时候掷出骰子了！§!"
 USA_new_team_civilwar_tt:0: "§R内战立即爆发！§!\n"
 
 USA_new_team_threat: "说服与劝诱"
 USA_new_team_threat_desc: "政府的决定仍面临部分议员的反对。如果我们向他们强调，美国在顺应新秩序后将展现出更美好的未来，或许能成功说服他们。"

 USA_new_team_help: "向新秩序请求志愿军"
 USA_new_team_help_desc: "为了展现我们的诚意，我们甚至不惜向同胞举枪相向。现在，轮到我们要见证他们的诚意了。"

 USA_blue_kivotos: "民主新秩序"
 USA_blue_kivotos_desc: "在异界人之中，存在着与我们的政治思想高度相似的政治体系。若能与他们携手顺应新秩序，我们将不会在意识形态上产生摩擦。"

 USA_bad_kivotos: "国民新秩序"
 USA_bad_kivotos_desc: "为了顺应新秩序，我们也许必须彻底抛弃原有的理念去面对他们。即便那是我们数百年来流血牺牲才得以捍卫的信仰，也在所不惜。"

 USA_blue_kivotos_MIL: "追随千禧年科技学院"
 USA_blue_kivotos_MIL_desc: "如果能与千禧年科技学院——这所即便在异界人之中也拥有压倒性科学技术的学校携手共进，美国的技术实力必将迎来巨大的飞跃。"

 USA_bad_kivotos_Eden: "追随伊甸园条约"
 USA_bad_kivotos_Eden_desc: "原本看似绝不可能实现和平与共存的两个国家，如今竟携手并进。由于目前的异界势力中不存在比这更强大的盟约，我们将顺应由她们主导的秩序，以保存我们的国力。"

 USA_bad_kivotos_COU: "追随联邦学生会"
 USA_bad_kivotos_COU_desc: "联邦学生会曾是异界势力中拥有最高权限的机构。我们必须协助她们完成重建，在巩固友好关系的同时，以此获取干预其他异界势力的合法权力。"

 USA_bad_kivotos_GEM: "追随格黑娜"
 USA_bad_kivotos_GEM_desc: "自古以来，世界便遵循着弱肉强食的法则。既然我们早已洞悉这一事实，就理应加入推行此法则的格黑娜。"

 USA_bad_kivotos_TRM: "圣三一综合学园"
 USA_bad_kivotos_TRM_desc: "心地善良且拥有优雅天使之姿的她们，才是新秩序的典范。让我们追随她们吧。"

 USA_bad_kivotos_support_hina: "选择空崎日奈"
 USA_bad_kivotos_support_hina_desc: "对格黑娜的研究越深入，失望就越是与日俱增。然而，风纪委员会是与万魔殿迥然不同的精干团体。让我们追随她们的首领日奈吧。"

 USA_bad_kivotos_support_makoto: "选择羽沼真琴"
 USA_bad_kivotos_support_makoto_desc: "坦白说，真琴确实属于无能之辈。但考虑到她能在那些任性妄为的恶魔之中稳掌大权，且偶尔展现出惊人的洞察力，她依然是值得我们信赖并追随的对象。"
 
 USA_bad_kivotos_support_mika: "选择圣园未花"
 USA_bad_kivotos_support_mika_desc: "未花与我们的预想不同，她像童话里的公主一样感性且纯真。然而，内心的柔弱并不代表力量的虚弱。我们必须追随她。"

 USA_bad_kivotos_support_hina_2: "寻求风纪委员们的建议"
 USA_bad_kivotos_support_hina_2_desc: "有能力的并不只有日奈一人。如果我们聘请风纪委员会的成员们前来指导，定能重建因内战而满目疮痍的本土。"

 USA_bad_kivotos_GEH_halo_infantry: "风纪委员会联合诸兵种合成"
 USA_bad_kivotos_GEH_halo_infantry_desc: "如今，风纪委员们已经锻炼到了足以与美利坚合众国陆军并肩训练的程度。通过开展联合演训，双方必将获益匪浅。"
 
 USA_bad_kivotos_GEM_tank: "万魔殿重型坦克引入"
 USA_bad_kivotos_GEM_tank_desc: "我们必须关注的正是格黑娜的重型坦克大队。让我们以格黑娜的重型坦克‘虎丸’为标杆，进行重型坦克设计，并展开大规模的军事改编。"

 USA_bad_kivotos_GEM_halo_infantry: "格黑娜兵种协同"
 USA_bad_kivotos_GEM_halo_infantry_desc: "格黑娜只是缺乏压倒性的超人，其兵力与军事技术本身相当出色。让我们通过与格黑娜的军事技术合作，对美军进行全面改编。"

 USA_bad_kivotos_support_iroha: "格黑娜的实装"
 USA_bad_kivotos_support_iroha_desc: "吕波是万魔殿中为数不多的常识人，也是一名精干的实务者。若能寻求她的建议并推行政策，内战留下的余波定能迎刃而解。"
 
 USA_bad_kivotos_support_ibuki: "格黑娜的大公女"
 USA_bad_kivotos_support_ibuki_desc: "这世上难道还有比她更可爱的存在吗？让我们邀请伊吹参加派对吧。她的存在将成为美国人民巨大的精神支柱。"
 
 USA_bad_kivotos_support_GEM_club: "组建社团游说集团"
 USA_bad_kivotos_support_GEM_club_desc: "他们在格黑娜内部——不，在所有学园中都是备受关注的危险分子，但就个人能力而言却相当出色。让我们组建游说集团，为他们提供施展才华的舞台吧。"

 USA_bad_kivotos_totalwar: "总力战宣言"
 USA_bad_kivotos_totalwar_desc: "我们必须抛弃旧秩序，追随新秩序。不仅要在口头上服从，无论男女老少，都必须付诸行动。"
 
 USA_bad_kivotos_support_TRM_club: "与图书部合作"
 USA_bad_kivotos_support_TRM_club_desc: "三一图书部规模宏大且规章严明。我们将与三一签订正式条约，共享那里的知识。"

 USA_bad_kivotos_TRM_halo_infantry: "三一兵种协同"
 USA_bad_kivotos_TRM_halo_infantry_desc: "三一的学生们大都比较温顺，但她们的军事实力却处于极高水平。我们将特别针对其卓越的友军支援能力，与之开展诸兵种合成作战。"

 USA_bad_kivotos_justice: "与正义实现部合作"
 USA_bad_kivotos_justice_desc: "正义实现部是一个武力极其强大的自治警察团体。若能与他们合作，定能将那些反国家势力驱逐出境。"

 USA_bad_kivotos_justice_sword: "圣三一之剑"
 USA_bad_kivotos_justice_sword_desc: "让我们成为圣三一之剑，将所有威胁圣三一的势力统统铲除。"

 USA_bad_kivotos_halo_infantry_2: "第三条道路"
 USA_bad_kivotos_halo_infantry_2_desc: "让我们编组应用了新秩序技术的新式联队，并吸取联合演习的教训。我们此刻正行走在一条无人涉足过的道路上！"

 USA_bad_kivotos_GEH_hina_learn: "邀请日奈访问军校"
 USA_bad_kivotos_GEH_hina_learn_desc: "风纪委员会实际上仅靠日奈一人的武力在维系。让我们邀请她访问军校，以此来培养指挥官们的能力。"

 USA_bad_kivotos_GEH_halo_infantry_support: "风纪委员会军事指导"
 USA_bad_kivotos_GEH_halo_infantry_support_desc: "风纪委员们的武力远不如我们的预期。让我们对他们进行指导，强化其基础体能与战术素养。"

 USA_blue_kivotos_MIL2: "美利坚-千禧年科技学院驻军协定"
 USA_blue_kivotos_MIL2_desc: "让我们把那群令他们头疼的‘赤色抵抗组织’全部铲除。"

 USA_blue_kivotos_MIL3: "美利坚-千禧年科技学院科研公约"
 USA_blue_kivotos_MIL3_desc: "他们的科学技术简直如同魔法一般。"

 USA_blue_kivotos_MIL3_halo: "掌握“神秘”"
 USA_blue_kivotos_MIL3_halo_desc: "这是彻底查明这些突然出现的异界人秘密的绝佳机会。"

 USA_blue_kivotos_MIL3_rocket: "人工卫星开发"
 USA_blue_kivotos_MIL3_rocket_desc: "你可曾想象过？在那个往昔只能用双眼仰望的深空中，留下属于人类的足迹！"

 USA_bad_kivotos_halo_infantry_division: "解析“光环步兵”"
 USA_bad_kivotos_halo_infantry_division_desc: "野战炮变成了烟花，坦克变成了废铁。在不久的将来，‘光环士兵’将主导整个战争！"

 USA_bad_kivotos_support_Mika: "圣园未花支援"
 USA_bad_kivotos_support_Mika_desc: "我们应当成为守护那位宛如天使般的少女的骑士。"

 USA_bad_kivotos_Mika_fanclub: "组建圣园未花亲卫队"
 USA_bad_kivotos_Mika_fanclub_desc: "不存疑虑，默默地服从她的指示，并扫除一切障碍。这便是我们的使命。"

 USA_support_brazil: "支援巴西"
 USA_support_brazil_desc: "如果是巴西的炼金术技术，什么‘新秩序’之流瞬间就能战胜。"

 USA_support_spain: "支援伊比利亚半岛"
 USA_support_spain_desc: "伊比利亚半岛是至关重要的战略要地。不仅如此，如果能拉拢那些态度暧昧的国家，国际联盟的参会意愿将会大幅提升。"

 USA_support_ITA: "支援意大利"
 USA_support_ITA_desc: "在欧洲，称得上像样大国的现在只剩意大利了。我们必须与他们联手。"

 USA_attack_SHA: "解放中欧"
 USA_attack_SHA_desc: "中欧仍有异界人的踪迹。我们肩负着义务，即便再弱小的国家也必须予以解放。"

