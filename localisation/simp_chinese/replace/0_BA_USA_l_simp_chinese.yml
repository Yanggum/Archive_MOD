#现有本地文件修改
 USA_continue_the_new_deal: "重新审视新政"
 USA_continue_the_new_deal_desc: "在新政进展顺利之际，传来了欧洲全境被来自异世界的存在占领的震惊消息。我们现在正面临严重的第二次威胁，必须应对随之而来的金融危机。"
 USA_reestablish_the_gold_standard: "承认政府失败"
 USA_reestablish_the_gold_standard_desc: "承认仅凭民主党的新政无法挽回现状，我们将采取更广泛的私有化及扩大自治措施。通过这些手段，我们将能够推卸掉我们的责任。"

 USA_gold_standard: "民营化措施"
 USA_send_lindbergh_to_germany: "编成林德伯格航空队"
 USA_send_lindbergh_to_germany_desc: "一位著名的飞行员表示，希望在上次战争后召集来自德国空军的流亡者，学习以前德国的航空技术。我们将支持这项对我们也有利的提议，藉此提升我军的航空技术。"
 USA_work_with_the_bund: "德裔美国人的支持"
 USA_work_with_the_bund_desc: "对德国流亡者的明确甄别与妥善资助，将向德裔美国人展示我们的立场。我们要明确表态，我们对他们怀有深厚的善意。"
 war_plan_black: "蓝色战争计划"

 USA_wartime_industry: "快速重整军备"
 USA_wartime_industry_desc: "我们守住了民用工业，但军工产业却未能幸免。在反基沃托斯情绪高涨的当下，正是迅速扩张军工产业的最佳时机。"



