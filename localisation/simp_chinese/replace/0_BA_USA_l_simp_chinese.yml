 USABA_so_the_jews_are_the_problem: "所以说犹太人才是问题所在！"
 USABA_so_the_jews_are_the_problem_desc: "德国在二战中的战败，甚至美国目前的堕落，所有这些阴谋的核心都是犹太人！我们必须宣布他们为美国的敌人！"
 USABA_so_the_jews_are_the_problem_tt: "为了援助我们，§Y德国民族主义民兵§!正在首都组织起来。"
 USABA_so_the_jews_are_the_problem_red_tt: "§R如果在内战结束后不尽快完成《德国民族保护法》，右翼民兵和德裔美国人将会演变成暴徒。§!"
