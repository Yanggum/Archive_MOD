 USA_GEH_train: "美国的军事地图"
 USA_GEH_train_usa: "日奈的军事地图"
 USA_GEM_train: "格黑娜诸兵种合成"
 USA_TRM_train: "三一诸兵种合成"
 USA_iroha_tank: "引入伊吕波战术"
