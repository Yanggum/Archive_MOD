 USA_rising_exiled_germans_state: "德国人骚乱"
 USA_rising_exiled_germans: "德裔美国人骚乱"
 USA_rising_exiled_germans_1st: "右翼集结"
 USA_rising_exiled_germans_2st: "骚乱升级"
 USA_rising_exiled_germans_3st: "最后的抉择"

 USABA_revolutionaries_of_the_nation: "民族的革命者"
 USABA_strong_propaganda: "强势政治宣传"
 USABA_expansion_of_influence_in_america: "扩大在美国国内的影响力"
 USABA_destruction_of_jewish_groups: "摧毁犹太人游说集团"
 USABA_rise_to_power: "上台"

 USABA_revolutionaries_of_the_nation_desc: "两次战败，以及在欧洲的流亡。这一切无疑是德意志民族的苦难磨练。现在，我们必须在这片遥远的美洲大陆上谋求新的生存空间。毫无疑问，我们正是站在德意志民族最后前线的、为了民族未来而奋斗的民族革命者。"
 USABA_strong_propaganda_desc: "美利坚合众国的各大媒体在欧洲大战结束后，已沦为散布刺激性民粹主义的机构。让这些媒体听从我们的摆布，将比想象中还要简单。"
 USABA_expansion_of_influence_in_america_desc: "我们必须超越美利坚合众国众多的游说集团，进一步扩大影响力。无论宣传、民粹主义、阴谋论还是丑闻，我们将不择手段，确保在美利坚合众国的政界掌握话语权。"
 USABA_destruction_of_jewish_groups_desc: "犹太团体是我们最强大的反对者，也是民族的宿敌。我们将通过持续的民兵攻击和对民兵成员的崇拜，摧毁犹太游说团体。"
 USABA_rise_to_power_desc: "现在，真正的序幕拉开了。这个庞大的美利坚合众国，正受控于为数不多的欧洲流亡者——德国人委员会。我们必须为收复欧洲的国家战争做好准备。"

 USABA_joining_hands: "握手言和"
 USABA_compromise_plan: "妥协案"
 USABA_controlling_the_far_right: "遏制极右势力"
 USABA_attacks_on_conspiracy_theories: "打击阴谋论"
 USABA_limiting_german_militia: "管制德国民兵"
 USABA_towards_a_new_era_in_america: "新时代的美国"

 USABA_joining_hands_desc: "为了实现美利坚合众国的强力进化，我们必须加强与欧洲流亡者特别是其中的德意志人之间的合作。"
 USABA_compromise_plan_desc: "虽然我国政府无法直接接纳德意志人进入政府核心，但我们可以协助他们夺回故土。"
 USABA_controlling_the_far_right_desc: "德国人委员会显然已经彻底疯了。那些荒谬的阴谋论，以及真心追随它们的民兵组织，无疑会对合众国的未来产生不利影响。"
 USABA_attacks_on_conspiracy_theories_desc: "他们的阴谋论破绽百出，漏洞十足。什么‘希特勒逃到了月球’，这简直是一派胡言。我们必须钻研他们逻辑上的漏洞，并彻底瓦解其支持者群体。"
 USABA_limiting_german_militia_desc: "我们绝不能坐视民兵肆无忌惮地横行。美利坚合众国的军队、警察及国民警卫队将通力合作，彻底瓦解右翼民兵的暴行"
 USABA_towards_a_new_era_in_america_desc: "现在，真正的美利坚合众国终于展现在我们眼前。让我们迎接新时代的美国，驱散所有笼罩其上的阴影。"

 USA_rising_exiled_germans_3st_flag: "第三次美国内战爆发"
 USA_rising_exiled_germans_3st_flag_NOT: "第三次美国内战并未爆发"
 USABA_german_national_protection_law_tt: "随着时间的推移，§Y德意志人代表委员会§!将开启属于自己的国策分支。"
 USABA_german_ch: "德意志人代表委员会"
 USABA_revolutionaries_of_the_nation_tt: "§g曾在德国享誉盛名的电影导演，如今作为德国流亡者核心人物而崛起的$GER_leni_riefenstahl$将受邀加入政府。§!"

 USABA_towards_a_new_era_in_america_tt: "§Y德意志人代表委员会§!将无法再完成其分支下的国策。"

