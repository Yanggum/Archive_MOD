 BA_pb_update_tt: "§C统治吧，不列颠尼亚§!"
 BA_pb_update_tt_delayed: "§L"健康之时，勿忘病痛之日；平静之日，勿忘风暴之时。"\n\n这句英国谚语传递了与健康相关的智慧。然而，这句谚语不仅是对健康的提醒，更是强调预防与准备重要性的格言。它告诫人们，在健康时应预想生病时的困境并加以预防，以应对未来可能降临的危险。同时，它也提醒我们，当前的稳定并非永恒，应心怀感恩地度过每一天。 \n\n在1935年10月之前，这样的格言对英国人来说或许感触不深。但在大转移事件之后，以法国和德国为首的西方列强，均遭到了异界存在的重创。德国政府已然崩溃，甚至未能成功流亡；法国政府流亡北非；而英国，也未能自认完全脱离威胁。 \n\n然而，凯撒公司的攻击瞄准了这头如同沉睡雄狮的英国。他们发动奇袭，攻陷了多佛港，随后势如破竹地占领了伦敦。目前虽由英国陆军联合司令部统治国家，但战况仍未见好转。 \n\n主啊，请保佑吾王。 §!"
 BA_sr_update_tt: " §t赤红§Y闪耀§!的革命北极星§!"
 BA_sr_update_tt_delayed: "§L"在大战的特殊形势下，由不平衡的结合发展所导致的社会矛盾，正揭开其面纱，显露自身。"\n§t- 列夫·托洛茨基§!\n\n 寒冷的土地上迎来了学生们。在不明所以的情况下，于斯堪地纳维亚半岛经历了混乱战争的赤冬学生们，被孤立在与初次见识的世界抗争之中。然而，她们手中握有两样武器。 \n\n 第一样武器，即是思想。赤冬的学生们本身就是意欲实现最高贵体制的革命家。她们已准备好为建立工农国家、民众世界而斗争。或许，她们还能与这陌生世界中理念相近者结盟。 \n\n 第二样武器，即是团结。赤冬拥有运作庞大规模行政的经验，能够在统一计划下，向着既定目标全力推进。一旦行政组织的重建彻底完成，赤冬将能发挥出比其他任何学院都更为主动的潜力。 \n\n 尽管如此，仍有众多考验等待着赤冬。例如：\n\n 由安守实里领导的劳务部及其他反政府团体，仍在持续扰乱赤冬。如果连花耶与切里诺书记长的事务局都无法挺过大转移后袭击赤冬的最大经济崩溃，不满化为愤怒，愤怒转为暴力，将是显而易见的。 \n\n 此外，巨大的官僚体系效率低下也内嵌于这所学院。在大战的特殊形势下，军方、编辑局、安全委员会、军政府等机构的这种无效率被放大并扩散开来，若无法打破官僚群体的小资产阶级消极性，行政组织的大规模无能将是可以预见的。 \n\n 最后，外部的毒蛇正环伺赤冬。三一内部，与反革命法西斯主义联手的派系似有增长迹象；当地人政府仍对赤冬抱持敌意。对我们而言，为打倒这些敌人，钢铁般的团结必不可少。 \n\n 如同步入青春期的少年少女，赤冬与其学生们正感到迷惘。然而，只要她们以思想与团结武装自己，\n 一旦找到方向，追寻那 §t赤红§Y闪耀§!的革命北极星§!，赤冬便能全力冲刺，粉碎一切阻碍，夺取斗争的胜利。 §!"
 BA_ger_update_tt: " §4阴天§!与 §O晴朗§!的 §Y阳光§!"
 BA_ger_update_tt_delayed: "§L"但无人为我们哭泣。冬天不会永远持续。总有一天，我们会欢喜地说：祖国啊，你再次属于我了。"\n- 选自《沼泽中的士兵》\n\n德意志人如同跟随摩西的无家可归的可怜人长队，向着永远无法触及的地平线彼端，行走在永无止尽的荒野上。这群被所有人抛弃、没有首领的「流浪儿」，无论如何，因为还活着，所以缓缓向着地平线迈步。至于地平线彼端究竟有什么，无人知晓——但无论如何，他们行进着。向着那遥远的地平线彼端，向着德意志。 \n\n摩西带领以色列百姓离开苦难之地，分开红海，向着新天新地前进，并肩负信仰同行。然而，德意志人的摩西又是谁呢？他必将回应德意志人的苦难，与之呼应。这里最后的问题是——\n\n§Y谁将成为德意志人的摩西？ §!\n\n在 §4阴天§!与 §O晴朗§!的 §Y阳光§!下的天气中，德意志人或许能找到答案。 §!"