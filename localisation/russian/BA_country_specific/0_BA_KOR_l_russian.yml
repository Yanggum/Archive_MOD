# Национальные духи
KOR_cheonggye_idea: "Провал проекта по искоренению морской фауны"
KOR_cheonggye_idea_desc: "Сверхъестественные явления, вызванные Великим Переходом, также оказали сильное влияние на Сеул в [ROOT.GetName]. Гигантские крабы-людоеды и пираньи-людоеды, начавшие появляться в ручье Чхонгечхон, фактически парализовали развитие столицы, начиная с 1935 года. Угаки Кадзусигэ, бывший тогда Генерал-губернатором Кореи в 1935 году, потерпел неудачу в попытке истребить дикую фауну, обезумевшую от Великого Перехода, лишь увеличив количество бессмысленных жертв.\n\nГенерал-губернаторство Кореи не смогло справиться с разрушением Сеула, вызванным Великим Переходом, и задача по преодолению экономических потерь и отставания в промышленном развитии теперь ложится на новое правительство и [ROOT.GetLeader]."

KOR_two_languages_idea: "Двуязычная система"
KOR_two_languages_idea_desc: "После падения Корейской империи в 1910 году бюрократы на полуострове были заменены японцами, и большое количество японцев иммигрировало в Корею. В результате этого быстрого демографического сдвига наше общество приняло двуязычную систему. Официальные документы составляются и используются на японском языке, а местные начальники полиции и чиновники по-прежнему в основном японцы.\n\nДолжны ли граждане [ROOT.GetAdjective] учить два языка ради гармонии, или нам следует изгнать японцев, чтобы демонтировать эту сложную двуязычную систему?"

KOR_two_languages_weak_idea: "Двуязычная система"
KOR_two_languages_weak_idea_desc: "После падения Корейской империи в 1910 году бюрократы на полуострове были заменены японцами, и большое количество японцев иммигрировало в Корею. В результате этого быстрого демографического сдвига наше общество приняло двуязычную систему.\n\nИдеалист Ё Ун Хён считает, что японцы могут остаться в корейском обществе и достичь гармонии и мира. Увенчается ли этот идеалистический эксперимент успехом или приведет к десятилетиям конфликтов, станет известно только через несколько поколений."