 MIL_automation_economy:0 "Автоматизированная экономика"
 MIL_automation_economy_desc:0 "Экономика, управляемая людьми, слишком неэффективна и нестабильна. Ещё до Великого Перемещения Школа наук Миллениума управляла своим школьным хозяйством через автоматизированные фабрики и транспорт. Мы приложим усилия, чтобы восстановить эффективную автоматизированную экономическую систему, как прежде."
 MIL_consumer_goods_production:0 "Фокус на гражданской промышленности"
 MIL_consumer_goods_production_desc:0 "Войны следует избегать, это непродуктивная деятельность. Мы сначала применим технологии Миллениума в гражданской промышленности, чтобы стимулировать экономический рост и увеличить отрыв от других стран."
 MIL_heavy_industry_focus:0 "Увеличение расходов на оборону"
 MIL_heavy_industry_focus_desc:0 "Внутренние и внешние враги продолжают нам угрожать. Мы будем инвестировать в первую очередь в оборону, применяя технологии Миллениума в военной промышленности, чтобы сокрушить будущие угрозы."
 MIL_precision_production_planning:0 "Точное планирование производства"
 MIL_precision_production_planning_desc:0 "Возможно, работа Семинара перегрузится, но мы должны сформировать команды точного производства и установить планы для создания эффективной и идеальной экономики."
 MIL_expanding_the_base:0 "Расширение технологической базы"
 MIL_expanding_the_base_desc:0 "Изучая структуру французской промышленности, мы обнаружили, что технологический и коммерческий разрыв был больше, чем ожидалось. Чтобы наши автоматизированные объекты работали как прежде, мы должны улучшить некачественную местную инфраструктуру и унифицировать промышленные стандарты, раздробленные Великим Перемещением."
 MIL_cogwheel_society:0 "Общество шестерёнок"
 MIL_cogwheel_society_desc:0 "Как шестерёнки часов, мы тщательно спроектируем все части общества, чтобы поддерживать баланс между спросом и предложением."
 MIL_mechanized_army:0 "Механизированная армия"
 MIL_mechanized_army_desc:0 "Чтобы решать больше задач и поддерживать нашу школу, нам нужно больше и лучше военных поставок. Мы будем доминировать качественно и количественно, непрерывно развёртывая стальные когти и королев поля боя. Все падут перед нашей дисциплинированной и быстрой армией!"
 MIL_automation_industry:0 "Автоматизированная промышленность"
 MIL_automation_industry_desc:0 "Продукты, изготовленные французами, часто выходят из строя, и большинство рабочих недружелюбны к нам, к тому же могут взбунтоваться в любой момент. Как до Великого Перемещения, мы заменим рабочих машинами, чтобы автоматизировать промышленность."
 MIL_near_future_demand_analysis:0 "Анализ краткосрочного спроса"
 MIL_near_future_demand_analysis_desc:0 "Мы проанализируем потребителей и будем инвестировать в продукты с наибольшим прогнозом успеха для эффективных инвестиций."
 MIL_customized_production_system:0 "Фокус на персонализированном производстве"
 MIL_customized_production_system_desc:0 "Мы создадим персонализированную производственную линию. Хотя в краткосрочной перспективе может быть трудно производить массово, мы сможем управлять экономикой с большой гибкостью."
 MIL_economy_control:0 "Контролируемая экономика"
 MIL_economy_control_desc:0 "У нас есть возможность осуществлять превосходные программы плановой экономики. Руководство нашей школы усилит свой экономический контроль, тем самым увеличив контроль Миллениума над рынком."
 MIL_destroy_french_market:0 "Реструктуризация промышленности"
 MIL_destroy_french_market_desc:0 ""
 MIL_market_flexibility:0 "Гибкость рынка"
 MIL_market_flexibility_desc:0 "Несмотря на различные неблагоприятные факторы, местный рынок доказал свою полезность, исправляя собственные проблемы. Мы примем французский капитализм и внедрим рыночную экономику."
 MIL_semina_rework:0 "Реформа Семинара"
 MIL_semina_rework_desc:0 ""
 MIL_capitalist_conciliation:0 "Примирение с капиталистами"
 MIL_capitalist_conciliation_desc:0 ""
 MIL_market_subordination:0 "Контроль теневой экономики"
 MIL_market_subordination_desc:0 "Для победы школьной системы необходимо контролировать подпольную экономику. Мы подчиним французскую экономику себе и обеспечим импульс для наших промышленных программ."
 MIL_mixed_economy:0 "Создание Департамента экономического развития"
 MIL_mixed_economy_desc:0 ""
 MIL_economic_plan:0 "План экономического развития"
 MIL_economic_plan_desc:0 ""
 MIL_command_to_chaebol:0 "Приказ чеболам"
 MIL_command_to_chaebol_desc:0 "Мы заставим их управлять экономикой, чтобы снять нагрузку с Семинара и усилить наш экономический контроль. Пришло время показать, кто на самом деле контролирует Францию."
 MIL_backing_capitalist:0 "Поддержка капиталистов"
 MIL_backing_capitalist_desc:0 "Большинство французских капиталистов знают, за кого ухватиться ради выгоды. Мы можем заставить их легко предать свою родину."
 MIL_centralized_economy:0 "Централизованная экономическая интеграция"
 MIL_centralized_economy_desc:0 ""
 MIL_economicintervention:0 "Восстановление французского рынка"
 MIL_economicintervention_desc:0 "После гражданской войны экономика Миллениума рухнула: дефицит сделал базовые товары редкостью, процветают контрабандисты, инфляция растёт. Но теперь всё иначе. Мы перезапустим фабрики и цепочки поставок, чтобы это исправить."
 MIL_start_economy:0 "Восстановление промышленной базы"
 MIL_start_economy_desc:0 "Во время борьбы за выживание Франции и школы промышленность рухнула. Ради продолжения существования школы мы должны её восстановить."
 MIL_railway_connection:0 "Восстановление железнодорожного сообщения"
 MIL_railway_connection_desc:0 "Во время Великого Перемещения железнодорожная сеть была разрушена, а Франко-Миллениумская война усугубила ситуацию. Мы приложим усилия для решения этих проблем."
 MIL_state_capitalism:0 "Государственный капитализм"
 MIL_state_capitalism_desc:0 "Государственный капитализм — это экономическая политика, сочетающая личную свободу и экономическое развитие. Мы примем её для построения стабильной и демократичной экономики."
 MIL_megacorp:0 "Экономика будущего"
 MIL_megacorp_desc:0 ""
 MIL_expansion_of_financial_industry:0 "Расширение финансового сектора"
 MIL_expansion_of_financial_industry_desc:0 ""
 MIL_cryptocurrency:0 "Криптовалюта"
 MIL_cryptocurrency_desc:0 "Криптовалюта была валютой, используемой в Миллениуме до Великого Перемещения. Мы вновь примем её, чтобы управлять экономикой более эффективно и быстро."
 MIL_city_investment:0 "Улучшения в военных технологиях"
 MIL_city_investment_desc:0 ""
 MIL_facility_modernization:0 "Модернизация объектов"
 MIL_facility_modernization_desc:0 ""
 MIL_millennium_economy:0 "Экономика Миллениума"
 MIL_millennium_economy_desc:0 ""
 MIL_soviet_model:0 "Советская модель"
 MIL_soviet_model_desc:0 "Советский Союз с момента своего основания разработал плановую экономику, в которой государство владеет и планирует всё, и эффективно управлял ею. Мы возьмём это за образец, чтобы продвинуть в Миллениуме более полную и развитую плановую экономику."
 MIL_redistribution_wealth:0 "Перераспределение богатства"
 MIL_redistribution_wealth_desc:0 "Мы конфискуем всё асимметричное богатство французских капиталистов, гарантируя базовый уровень жизни и одновременно используя его как основу для новой экономической реформы."
 MIL_give_orders_to_workshop:0 "Введение плановой экономики"
 MIL_give_orders_to_workshop_desc:0 "Школа наук Миллениума обладает достаточными возможностями для планирования всей экономики, и мы их используем. Начиная с базовых приказов, мы постепенно построим более сложную и систематическую систему плановой экономики."
 MIL_communist_society:0 "Коммунистическое общество"
 MIL_communist_society_desc:0 "Наши передовые технологии, хотя и асимметричны, при правильном использовании могут приблизиться к идеалу «коммунистического общества». Мы построим более развитые социалистические теории и превратим Школу наук Миллениума в экономическую систему будущего."
 MIL_intensified_disagreements:0 "Углубление разногласий"
 MIL_intensified_disagreements_desc:0 "В последнее время из-за нестабильности французов в школе разногласия между ними усиливаются."
 MIL_Rio_intensified:0 "Повестка Рио"
 MIL_Rio_intensified_desc:0 "Президент студенческого совета Школы наук Миллениума считает, что лучший способ сохранить Миллениум — подавлять и контролировать свободу французов, восполняя нехватку рабочей силы за их счёт."
 MIL_Himari_intensified:0 "Повестка Химари"
 MIL_Himari_intensified_desc:0 "Как глава Veritas и Отдела особых явлений, она считает, что сотрудничество и интеграция с французами — это самый близкий путь к обеспечению долгосрочного выживания Миллениума."
 MIL_strong_control:0 "Жёсткий контроль"
 MIL_strong_control_desc:0 "Нет студенток без школы. Текущая ситуация серьёзно угрожает существованию Школы наук Миллениума, что, в свою очередь, ставит студенток в серьёзную опасность. Усиление контроля по всей школе частично облегчит текущие проблемы. Всё ради школы и ради студенток..."
 MIL_loose_oil_painting:0 "Гибкая политика"
 MIL_loose_oil_painting_desc:0 "Глава Химари осознаёт, что подавление французов действует как палка о двух концах. Мы дадим им стимулы, чтобы они перенесли свою лояльность на нас."
 MIL_reduction_clubs:0 "Перераспределение студенток"
 MIL_reduction_clubs_desc:0 ""
 MIL_reduction_seminar:0 "Ослабление авторитета Семинара"
 MIL_reduction_seminar_desc:0 "Нет студенток без школы. Текущая ситуация серьёзно угрожает существованию Школы наук Миллениума, что, в свою очередь, ставит студенток в серьёзную опасность. Усиление контроля по всей школе частично облегчит текущие проблемы. Всё ради школы и ради студенток..."
 MIL_forced_labor:0 "Принудительный гражданский труд"
 MIL_forced_labor_desc:0 "Президент Рио предложила принудительный труд гражданских лиц как решение нехватки поставок. Хотя это постепенно улучшит экономические проблемы, со временем это вызовет неприязнь французов."
 MIL_robotc_labor:0 "Рабочие-роботы"
 MIL_robotc_labor_desc:0 "В настоящее время наша экономика страдает от острой нехватки рабочих. Поскольку заставлять французов работать неэтично и аморально, глава Химари предложила ввести рабочих-роботов как решение."
 MIL_direct_bodyguards:0 "Создание личной охраны"
 MIL_direct_bodyguards_desc:0 "Новые меры президента Рио вызывают много негодования среди местных жителей. В нормальных условиях этими проблемами должна заниматься CGC, но нынешняя CGC испытывает эмоции, которых у неё не должно быть как у оружия, и может предать в любой момент. Мы выкуем новый меч, который поразит врагов Рио."
 MIL_rebuilt_school1:0 "Химари, глава Veritas"
 MIL_rebuilt_school1_desc:0 ""
 MIL_rebuilt_school2:0 "Рио, президент Семинара"
 MIL_rebuilt_school2_desc:0 "Во времена кризиса мы должны объединиться под решительным руководством президента Семинара. Рио руководила Школой наук Миллениума ещё до Великого Перемещения, и её лидерство уже доказано. Если мы выберем её президентом Семинара, мы сможем более активно реагировать на текущий кризис."
 MIL_Rio_school:0 "Единое господство"
 MIL_Rio_school_desc:0 "В такой чрезвычайной ситуации, как сейчас, слушать и собирать мнения многих, как в обычное время, глупо. Мы должны передать большую часть власти президенту, чтобы активно реагировать на кризис."
 MIL_maintaining_balance_of_power:0 "Поддержание баланса сил"
 MIL_maintaining_balance_of_power_desc:0 "В этом мире нет идеальной студентки. У всех есть недостатки, и все совершают ошибки. Но если они не одиноки, а в группе, недостатки можно минимизировать и приблизиться к совершенству. Поддержание надлежащего баланса сил вместо концентрации власти у президента — лучший способ поддерживать стабильность Школы наук Миллениума."
 MIL_Himari_school:0 "Обратная власть"
 MIL_Himari_school_desc:0 ""
 MIL_millennium_science_school:0 "Оборонительная стратегия"
 MIL_millennium_science_school_desc:0 ""
 MIL_chaos_just_below:0 "Хаос у нас под ногами"
 MIL_chaos_just_below_desc:0 ""
 MIL_refugee_problem:0 "Проблема беженцев"
 MIL_refugee_problem_desc:0 ""
 MIL_non_interference_compromise:0 "Соглашение о невмешательстве"
 MIL_total_interference:0 "Тотальное вмешательство"
 MIL_total_interference_tt:0 "\n§Y@MIL[MIL.getname]§! имеет §Y60§! дней на разрешение §YГражданской войны в Испании§!. Если не разрешит в срок, §Y[?global.kivotos_alliance_leader.GetNameWithFlag]§! сможет вмешаться."
 MIL_spain_process:0 "Наблюдение за Испанией"
 MIL_spain_process_tt:0 "Поддерживаемая в гражданской войне фракция победила."
 MIL_intervention_civil_war:0 "Вмешательство в Гражданскую войну в Испании"
 MIL_intervention_civil_war_desc:0 ""
