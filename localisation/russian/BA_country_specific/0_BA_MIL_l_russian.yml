 MIL_central_control_network:0 "Центральное управление сетью"
 MIL_central_control_network_desc:0 "Низкокачественные слухи распространяются по сети и подрывают единство школы и студенток. Мы должны контролировать центральную сеть и предоставлять «отфильтрованную информацию» для поддержания стабильности школы."
