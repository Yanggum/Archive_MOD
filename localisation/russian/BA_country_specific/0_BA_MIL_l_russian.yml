 MIL_milleniums_international_position:0 "Международное положение Миллениума"
 MIL_milleniums_international_position_desc:0 "Школа наук Миллениума — второе по величине социалистическое государство внутри Коминтерна. Из-за падения в другой мир наше международное положение ещё не признано. Пришло время его прояснить."
 MIL_socialism_in_one_country:0 "Социализм в одной стране"
 MIL_socialism_in_one_country_desc:0 "Следуя примеру Советского Союза, пришло время укрепить положение Миллениума на хаотичной международной арене и усовершенствовать наши передовые технологии."
