#События

 MIL_minister_appointment_event.1.t:0 "Ответственный за экспериментальную экономику"
 MIL_minister_appointment_event.1.d:0 "Принято решение о экспериментальном введении плановой экономики в будущую экономическую политику Школы наук Миллениума. Теперь мы должны назначить ответственного, который возглавит эту экспериментальную экономическую систему и будет проводить новые экономические программы в течение текущей администрации."
 MIL_minister_appointment_event.1.remove:0 "После смены руководства Школы наук Миллениума мы должны выбрать человека, который продолжит и выполнит программу плановой экономики, продвигаемую предыдущей администрацией."

 MIL_minister_appointment_event.2.t:0 "Директор Департамента экономического развития"
 MIL_minister_appointment_event.2.t2:0 "Директор Бюро планирования инвестиций"
 MIL_minister_appointment_event.2.d:0 "С принятием системы рыночной экономики в Школе наук Миллениума и приватизацией нескольких промышленных секторов возникает необходимость создания новых департаментов. Теперь мы учредим Департамент экономического развития для анализа и надзора за экономической политикой школы и выберем его руководителя."
 MIL_minister_appointment_event.2.remove:0 "После смены руководства Школы наук Миллениума мы должны назначить нового директора Департамента экономического развития, который продолжит надзирать за экономическим развитием школы."
 MIL_minister_appointment_event.2.d2:0 "После смены руководства Школы наук Миллениума мы должны назначить нового директора Бюро планирования инвестиций, который будет курировать финансовые инвестиции школы."

 MIL_minister_appointment_event_semina_a:0 "Хаясе Юука: её расчёты будут безупречны."
 MIL_minister_appointment_event_semina_b:0 "Усио Ноа: её феноменальная память заслуживает доверия."
 MIL_minister_appointment_event_semina_c:0 "Куросаки Кодзуки: на этот раз доверимся её изобретательности."
 MIL_minister_appointment_event_veritas_a:0 "Кагами Тихиро: дотошна и компетентна."
 MIL_minister_appointment_event_veritas_b:0 "Отосэ Котама: не останавливается ни перед чем для достижения цели."
 MIL_minister_appointment_event_veritas_c:0 "Омагари Харэ: её энциклопедические знания подходят."
 MIL_minister_appointment_event_veritas_d:0 "Конури Маки: её способность решать проблемы выдающаяся."

 MIL_minister_appointment_event_semina_exit:0 "Минуточку… этот человек уже назначен."

 MIL_event.1.t:0 "Созыв Семинара"
 MIL_event.1.d:0 "После победы Школы наук Миллениума в войне с Францией состоялось первое совещание по мерам для решения растущих жалоб студенток из-за продолжающихся терактов французского сопротивления.\n\nВ отличие от экстренного собрания, спешно созванного во время войны, это собрание было организовано для решения внутренних дел школы и подготовки мер к грядущим проблемам Миллениума."
 MIL_event.1.a:0 "Действуйте быстро!"
 MIL_event.2.t:0 "Французское сопротивление"
 MIL_event.2.d:0 "Члены Семинара, устав от бесконечного французского сопротивления, поддерживают жёсткую позицию Рио и выступают за ликвидацию путём всеобщей мобилизации студенток. Однако в оппозиционной фракции Veritas проявляется смесь негодования по отношению к сопротивлению и поддержки умеренной политики Химари.\n\nПоэтому, хотя члены Семинара обычно поддерживают «операцию по тотальному искоренению», предложенную Рио, обычные студентки Миллениума предпочитают примирительный подход, чтобы сосредоточиться на заживлении ран войны."
 MIL_event.2.a:0 "Предложение Рио было принято."
 MIL_event.2.b:0 "Химари удалось переломить общественное мнение."
 MIL_event.3.t:0 "Потеря авторитета Рио"
 MIL_event.3.d:0 "X"
 MIL_event.3.a:0 "Цукацуки Рио должна взять на себя ответственность."
 MIL_event.4.t:0 "Разрушение французского рынка"
 MIL_event.4.d:0 "\"Разрушение — мать созидания.\"\n\nЧтобы поглотить французский рынок и управлять нашей привычной компьютеризированной системой с централизованными командами, мы должны сначала демонтировать французский рынок.\n\nПод руководством C&C будут проведены масштабные экономические расследования, временная приостановка франка и арест многочисленных капиталистов.\n\nЕсли хаос затянется, это может навредить нашему господству, поэтому мы должны как можно скорее восстановить рынок."
 MIL_event.4.a:0 "Мы создадим лучшую систему."
 MIL_event.5.t:0 "Проблема руин"
 MIL_event.5.d:0 "Обнаружены таинственные руины вокруг школы, вероятно, переместившиеся вместе с Миллениумом во время катаклизма. Ходят слухи, что они скрывают секреты, которые могут решить судьбу Миллениума: это может быть запретная библиотека или опасное оружие. Как нам действовать?"
 MIL_event.5.a:0 "Уничтожьте всё!"
 MIL_event.5.b:0 "Ограничить доступ."
 MIL_event.5.c:0 "Исследовать лично."
 MIL_event.6.t:0 "Ответный обстрел"
 MIL_event.6.d:0 "Резкий голос раздался по радио: «Огонь!»\n\nОрудия на холмах вокруг Миллениума взревели, и снаряды пронзили ночь. Командир напряжённо смотрела в бинокль. «Попадание?»\n\n«Попадание подтверждено! Но… что это?» На экране появился странный свет, исходящий из руин. «Обнаружена аномальная энергия! Готовить второй залп!» «Выполняйте.»\n\nВторой залп осветил ночное небо, в то время как столп энергии вырвался из руин, ослепительный и внушающий трепет."
 MIL_event.6.a:0 "Что происходит?"
 MIL_event.7.t:0 "AL-1S"
 MIL_event.7.d:0 "С ударом обстрела девушка открыла глаза глубоко в руинах: AL-1S, принцесса безымянных богов. Камера взорвалась паром, когда она поднялась со смесью страха и решимости во взгляде. «Где… я?» прошептала она, в то время как красное сияние зажглось в её глазах. «Это опасно… я должна защитить себя.» Поток энергии вырвался из её тела, покрывая руины и останавливая обстрел. Она медленно поднялась на поверхность, глядя на ночное небо: «Кто я…? И это место…?» Вспышка возникла среди дыма."
 MIL_event.7.a:0 "AL-1S, цель уничтожена."
 MIL_event.8.t:0 "Безымянная принцесса"
 MIL_event.8.d:0 "Принцесса безымянных богов пробудилась. Хотя она была сбита с толку и напугана, в её взгляде чувствовалась непоколебимая воля. Стоя в руинах, внушительная, одно её присутствие доминировало в воздухе. С каждым шагом земля слегка дрожала, и в её глазах оживали забытые воспоминания. Когда она подняла взгляд на Миллениум, её облик изменился: это была уже не растерянная девушка, а могущественная принцесса. Её путь был предопределён."
 MIL_event.8.a:0 "Ура!"
 MIL_event.9.t:0 "Меч света"
 MIL_event.9.d:0 "После возвращения AL-1S автономные машины разработали способ использовать её силу. Так родился проект «Сверхновая»: меч света, который сконцентрировал бы её божественную силу. После бесчисленных испытаний им удалось создать Сверхновую, оружие, столь же мощное, как реликварий, хотя и ценой страданий AL-1S и запечатывания части её силы в мече. Великое и в то же время трагическое достижение."
 MIL_event.9.a:0 "Другого выбора не было."
 MIL_event.10.t:0 "Перезапуск"
 MIL_event.10.d:0 "Рост Миллениума опирался на передовые технологии, автоматизацию и робототехнику, но его главной слабостью была энергетическая зависимость. После катаклизма мы пережили беспрецедентный кризис, но благодаря творчеству и разуму мы преодолели катастрофу. Теперь пришло время перезапустить фабрики, чтобы машины снова могли нас приветствовать."
 MIL_event.10.a:0 "Начало операций."
 MIL_event.11.t:0 "День королевы"
 MIL_event.11.d:0 "День королевы настал. AL-1S пробудилась, и её сила окрасила небо странными огнями, в то время как роботы остановились в благоговении. Студентки смотрели в ужасе, и мир отреагировал паникой. Сама реальность начала искажаться под её волей, и Париж стал её королевством. Мир вступил в новую эру: эру королевы."
 MIL_event.11.a:0 "Мир принадлежит ей."
 MIL_event.12.t:0 "Использование меча"
 MIL_event.12.d:0 "Перед зданием совета AL-1S подняла Сверхновую. Вспышка разорвала небо, и вражеские снаряды испарились. Одним движением она разрушила половину здания. Никто не мог сопротивляться: небо Бельгии теперь принадлежит ей."
 MIL_event.12.a:0 "Начинается разрушение."
 MIL_event.13.t:0 "Господство централистов"
 MIL_event.13.d:0 "С принятием марксистской экономики централисты приобрели преобладание в Семинаре. [ROOT.GetLeader] должен решить, кого поддерживать."
 MIL_event.13.a:0 "Поддержать централистов."
 MIL_event.13.b:0 "Они опасны и авантюрны."
 MIL_event.14.t:0 "[FROM.FROM.GetName] очищена"
 MIL_event.14.d:0 "В [FROM.FROM.GetName] больше не осталось аномальных элементов. Армия, верная королеве, заменила их, построив более продвинутое общество."
 MIL_event.14.a:0 "Выполнено."
 MIL_event.15.t:0 "Уничтожение"
 MIL_event.15.d:0 "-Дорогой муж Леон:\n\nПривет. Это Эмма…\nЗдесь всё по-прежнему: протесты, репрессии, кровь…\nНо я в порядке, спокойна, ради нашего малыша. Говорят, теперь всех подавляют.\nПишу из подвала. Когда мы встретимся? Не забудь придумать имя для нашего сына.\nЛюблю тебя.\n-Любящая тебя жена, Эмма."
 MIL_event.15.a:0 "Письмо так и не было доставлено."
 MIL_event.16.t:0 "Ковчег"
 MIL_event.16.d:0 "После возвращения AL-1S машины начали проект «Ковчег Атрахасиса»: пространство, отделённое от реальности, построенное с использованием всех технологий и ресурсов Миллениума. Чудо на окраинах Парижа, где воля AL-1S является единственным законом. Величайшее достижение в нашей истории."
 MIL_event.16.a:0 "Впечатляет."
 MIL_event.17.t:0 "Французское сопротивление"
 MIL_event.17.d:0 "Французское сопротивление начало восстание, чтобы сотрудничать с нашей войной. Это группа, которая всегда отстаивала тотальное сопротивление французского народа."
 MIL_event.17.a:0 "Это пригодится в нашей войне."
 MIL_event.18.t:0 "Проникновение в руины Клуба разработки игр"
 MIL_event.18.d:0 "Подтверждено, что Клуб разработки игр проник в запретные руины. Рядом с ними была замечена незнакомая девушка, поэтому мы отправим Хаясе Юуку для расследования и выяснения, враг ли она."
 MIL_event.18.a:0 "Пока не будем вмешиваться."
 MIL_event.19.t:0 "Заброшенная фабрика"
 MIL_event.19.d:0 "Мы нашли подозрительную заброшенную фабрику со следами систем безопасности, которые теперь являются металлоломом. Мы должны исследовать её, чтобы обнаружить возможные угрозы."
 MIL_event.19.a:0 "Мы можем войти."
 MIL_event.20.t:0 "Девушка"
 MIL_event.20.d:0 "В глубине старой фабрики мы обнаружили обнажённую девушку с серыми волосами и голубыми глазами, спящую на стуле. Во время транспортировки она проснулась, идентифицировав себя как AL-1S: продвинутый гуманоид."
 MIL_event.20.a:0 "Доставим её в Семинар."
 MIL_event.21.t:0 "Проблема AL-1S"
 MIL_event.21.d1:0 "После подтверждения того, что Клуб разработки игр Миллениума тайно проник в запретные руины без разрешения, исполнительный директор Семинара Хаясе Юука идентифицировала предполагаемую новую участницу клуба, 'Тендо Арис', как нечто совершенно иное, чем обычная студентка: это гуманоид, предназначенный для боя.\n\nНа данный момент мы отделили студентку от Клуба разработки игр. Теперь мы должны решить её судьбу: вернуть её в клуб, с которым она установила дружеские отношения, или держать её под строгим наблюдением и официально зачислить в Школу наук Миллениума."
 MIL_event.21.d2:0 "Мы должны решить, что делать с AL-1S, гуманоидом, обнаруженным в руинах. Согласно исследованию, это подразделение, предназначенное для боя, с заметными командными способностями.\n\nМы можем интегрировать её в Семинар, чтобы использовать её потенциал, или зачислить её как обычную студентку под строгим наблюдением."
 MIL_event.21.a:0 "'Тендо Арис'…"
 MIL_event.21.b:0 "Интегрировать её в Семинар."
 MIL_event.21.d:0 "Похоже, C&C заинтересована…" # сделано — генерал Арис-горничная
 MIL_event.21.c:0 "Принять как обычную студентку под наблюдением."
 MIL_event.22.t:0 "Стрела в небо"
 MIL_event.22.d:0 "X"
 MIL_event.22.a:0 "3…2…1…"
 MIL_event.23.t:0 "Получение передачи"
 MIL_event.23.d:0 "X"
 MIL_event.23.a:0 "Мы добились успеха, несмотря на все невзгоды."
 MIL_event.24.t:0 "Судьба C&C"
 MIL_event.24.d:0 "Героический миф C&C пользуется большой поддержкой среди студенток Миллениума, что подрывает авторитет дирекции. Мы должны разрешить эту ситуацию: хотя их растущий престиж вредит нашей легитимности, их формальная интеграция может значительно усилить наши военные возможности."
 MIL_event.24.a:0 "Заключим с ними союз."
 MIL_event.24.b:0 "Изолируйте их от общественного мнения, в конце концов их забудут."
 MIL_event.25.t:0 "Начало второго великого собрания Миллениума"
 MIL_event.25.d:0 "В отличие от первого, второе великое собрание началось без участия Veritas. Созванное на фоне сомнений в лидерстве Цукацуки Рио, ожидается, что это собрание определит будущее направление руководства Семинара."
 MIL_event.25.a:0 "Собрание началось под руководством Рио."
 MIL_event.25.b:0 "Собрание началось в хаосе."
 MIL_event.26.t:0 "Тема: Французское сопротивление"
 MIL_event.26.d:0 "Французское сопротивление, тема, уже обсуждавшаяся на первом собрании, снова выносится на обсуждение. Мы должны решить, как реагировать на их продолжающуюся подрывную деятельность."
 MIL_event.26.a:0 "Пошлём C&C."
 MIL_event.26.b:0 "Сохранение статус-кво, кажется, лучший вариант."
 MIL_event.26.c:0 "Я использую свою личную охрану."
 MIL_event.27.t:0 "Тема: Реорганизация клубов"
 MIL_event.27.d:0 "С восстановлением руководства Семинара предлагается вернуть клубы под контроль Семинара. Это встретит сопротивление, так как после катаклизма они привыкли действовать полуавтономно."
 MIL_event.27.a:0 "Нам нужна более эффективная структура."
 MIL_event.27.b:0 "Семинар будет уважать автономию клубов."
 MIL_event.28.t:0 "Тема: Перепланировка кампуса"
 MIL_event.28.d:0 "После нашего территориального расширения во Франции центральный кампус стал хаотичным и неэстетичным. Рио предлагает реорганизовать его под руководством Семинара, в то время как другие предлагают превратить это в мероприятие с участием студенток."
 MIL_event.28.a:0 "Я займусь этим лично."
 MIL_event.28.b:0 "Пусть студентки перестраивают его автономно."
 MIL_event.29.t:0 "Конец второго великого собрания"
 MIL_event.29.d:0 "Второе великое собрание завершилось. Хотя обсуждались важные темы, такие как сопротивление, клубы и перепланировка, авторитет Рио, кажется, ослаб: коллективные решения Семинара начинают преобладать над её руководством."
 MIL_event.29.a:0 "По крайней мере, закончилось без инцидентов."
 MIL_event.30.t:0 "C&C занимает Башню Миллениума"
 MIL_event.30.d:0 "Реформы Акэбоши Химари после революции в Миллениуме не смогли стабилизировать академию. В условиях растущей напряжённости Нэру Микамо, лидер C&C, заняла Башню Миллениума и жёстко требует, чтобы C&C взяла бразды правления для восстановления порядка. Хотя принятие её предложения временно разрешит кризис, это создаст долгосрочные проблемы. Отказ, похоже, не приведёт к немедленному перевороту, но Химари должна решать."
 MIL_event.30.a:0 "…Я одобрю это."
 MIL_event.30.b:0 "Я не могу допустить этот переворот."
 MIL_event.31.t:0 "Предложение технологического договора Миллениум-СССР"
 MIL_event.31.d:0 "Школа наук Миллениума приняла марксистскую экономику и предлагает нам технологический договор. Они предлагают обменять свои передовые технологии на наш опыт в социалистической коллективизации."
 MIL_event.31.a:0 "Уникальная братская республика."
 MIL_event.31.b:0 "Отказать."
 MIL_event.32.t:0 "Технологический договор Миллениум-СССР: Принят"
 MIL_event.32.d:0 "Советский Союз принял наш договор, что позволит осуществить ценный обмен знаниями, который принесёт пользу обеим нациям."
 MIL_event.32.a:0 "Интересное развитие."
 MIL_event.33.t:0 "Технологический договор Миллениум-СССР: Отклонён"
 MIL_event.33.d:0 "Советский Союз, всё ещё осторожный с Кивотосом, отклонил наш договор, хотя и согласился установить посольства."
 MIL_event.33.a:0 "…"
 MIL_event.34.t:0 "Предложение Миллениума"
 MIL_event.34.d:0 "В рамках своей стратегии изоляции Франции Миллениум предлагает нам дистанцироваться от неё в обмен на экономические и технологические выгоды."
 MIL_event.34.a:0 "Интересная идея."
 MIL_event.34.b:0 "Даже рассматривать не стоит."
 MIL_event.35.t:0 "Предложение принято [FROM.GetName]"
 MIL_event.35.d:0 "[FROM.GetName] согласилась дистанцироваться от Франции и, похоже, сокращает свои дипломатические отношения с ней."
 MIL_event.35.a:0 "Наш враг обернулся."
 MIL_event.36.t:0 "Предложение отклонено [FROM.GetName]"
 MIL_event.36.d:0 "[FROM.GetName] отклонила нашу стратегию изоляции и, похоже, укрепит свои связи с Францией."
 MIL_event.36.a:0 "Какая жалость."
 MIL_event.37.t:0 "Торговый договор Миллениум-США"
 MIL_event.37.d:0 "Миллениум предлагает нам торговый договор: они будут продавать нам свои высококачественные полупроводники в обмен на нашу дешёвую сталь."
 MIL_event.37.a:0 "Многообещающая сделка."
 MIL_event.37.b:0 "Я не доверяю им."
 MIL_event.38.t:0 "Торговый договор Миллениум-США: Принят"
 MIL_event.38.d:0 "Договор подписан и восхваляется как великая гармония между двумя мирами. Ожидается, что он подстегнёт нашу промышленность."
 MIL_event.38.a:0 "Хорошо."
 MIL_event.39.t:0 "Торговый договор Миллениум-США: Отклонён"
 MIL_event.39.d:0 "США отклонили договор из-за недоверия, хотя и согласились установить посольства."
 MIL_event.39.a:0 "Что?"
 MIL_event.40.t:0 "Предложение Миллениума о восстановлении Британских островов"
 MIL_event.40.d:0 "X"
 MIL_event.40.a:0 "Это последний шанс."
 MIL_event.40.b:0 "Ещё не время."
 MIL_event.41.t:0 "Британское принятие"
 MIL_event.41.d:0 "X"
 MIL_event.41.a:0 "Конец Kaiser Corporation!"
 MIL_event.42.t:0 "Британское отклонение"
 MIL_event.42.d:0 "X"
 MIL_event.42.a:0 "Ах, чёрт."
 MIL_event.43.t:0 "Разделение в академии"
 MIL_event.43.d:0 "Сразу после завершения экстренных приказов, изданных на совещании по мерам Школы наук Миллениума, среди студенток начали раздаваться голоса, требующие прекращения 'авторитарных мер'.\n\nХотя эти приказы временно разрешили ситуацию, очевидно, что они усугубили скрытое недоверие и тревогу в школе.\n\nТеперь, когда недоверие к авторитарной дирекции вышло наружу, нам предстоит трудная задача по разрешению всех этих проблем."
 MIL_event.43.a:0 "Долгий вызов впереди."
 MIL_event.44.t:0 "Судьба Рио"
 MIL_event.44.d:0 "X"
 MIL_event.44.a:0 "Предать её публичному суду."
 MIL_event.44.b:0 "Вынудить её уйти в отставку."
 MIL_event.45.t:0 "Публичный суд: Провал"
 MIL_event.45.d:0 "X"
 MIL_event.45.a:0 "Её красноречие было решающим."
 MIL_event.46.t:0 "Отставка Цукацуки Рио"
 MIL_event.46.d:0 "X"
 MIL_event.46.a:0 "Самый лёгкий путь."
 MIL_event.47.t:0 "Публичный суд: Успех"
 MIL_event.47.d:0 "X"
 MIL_event.47.a:0 "Мы победили."
 MIL_event.48.t:0 "Переворот Кодзуки!"
 MIL_event.48.d:0 "X"
 MIL_event.48.a:0 "Семинар единогласно признаёт лидерство Кодзуки."
 MIL_event.48.b:0 "Кодзуки была арестована на месте."
 MIL_event.49.t:0 "Использование Эриду"
 MIL_event.49.d:0 "Поскольку город-крепость Эриду уже отремонтирован, мы должны решить, использовать ли его для первоначальной цели — вычислительной поддержки Аби Эшух, или посвятить его новым военным доктринам."
 MIL_event.49.a:0 "Использовать для Аби Эшух."
 MIL_event.49.b:0 "Нам нужны новые военные доктрины."
 MIL_event.50.t:0 "Дополнительное финансирование для строительства Эриду"
 MIL_event.50.d:0 "Ответственный департамент запросил дополнительное финансирование, чтобы избежать чрезмерных задержек в восстановлении Эриду."
 MIL_event.50.a:0 "Выделить дополнительный бюджет."
 MIL_event.50.b:0 "Нет."
 MIL_event.51.t:0 "Предложение инженерного департамента"
 MIL_event.51.d:0 "Инженерный департамент предложил незначительные изменения в процессе восстановления, чтобы значительно ускорить работы."
 MIL_event.51.a:0 "Изменить процесс."
 MIL_event.51.b:0 "Это невозможно."
 MIL_event.52.t:0 "Дополнительное финансирование для Эриду"
 MIL_event.52.d:0 "Строительная команда Эриду только что представила отчёт с просьбой о дополнительном бюджете в Семинар."
 MIL_event.53.t:0 "Обнаружено хищение"
 MIL_event.53.d:0 "При расследовании подозрительных движений строительной команды Эриду мы обнаружили значительную коррупцию."
 MIL_event.53.a:0 "Искоренить всю коррупцию."
 MIL_event.53.b:0 "Подожди… может, мы сможем это использовать."
 MIL_event.54.t:0 "Строительные знания"
 MIL_event.54.d:0 "Опыт, полученный при строительстве Эриду, сократил наши будущие процессы восстановления."
 MIL_event.54.a:0 "Пусть продолжается."
 MIL_event.55.t:0 "Применения Эриду"
 MIL_event.55.d:0 "Восстановление Эриду дало нам ценные знания для будущих масштабных строек."
 MIL_event.55.a:0 "Отлично."
 MIL_event.56.t:0 "Взрывной инцидент"
 MIL_event.56.d:0 "Во время работ на Эриду алгоритмическая ошибка строительных роботов привела к падению легковоспламеняющихся материалов, вызвав сильный взрыв."
 MIL_event.56.a:0 "Чёрт возьми!"
 MIL_event.56.b:0 "Профинансировать ремонт."
 MIL_event.57.t:0 "Строительство без проблем"
 MIL_event.57.d:0 "Отчёт показывает, что восстановление Эриду идёт без заминок."
 MIL_event.58.t:0 "Свободная французская армия"
 MIL_event.58.d:0 "Французское сопротивление, реорганизованное как коллаборационистская сила для освобождения, завершило свою интеграцию. Они останутся активными даже после освобождения Франции."
 MIL_event.58.a:0 "Отдайте им приказ выступать."
 MIL_event.59.t:0 "Просьба об интеграции от сопротивления"
 MIL_event.59.d:0 "Сопротивление, помогавшее нам в войне, хочет официально интегрироваться в регулярную армию. У нас есть необходимая цепочка командования, чтобы сделать это."
 MIL_event.59.a:0 "Распустить и поглотить их."
 MIL_event.59.b:0 "Они всё ещё нужны нам такими, какие они есть."
 MIL_event.60.t:0 "Война с Францией"
 MIL_event.60.d:0 "Война с Францией началась!\n\nПока она длится, уровень сопротивления будет постепенно расти, поэтому нам придётся постоянно проводить операции по его снижению. Однако со временем эскалация замедлится, и они не будут донимать нас вечно.\n\nКроме того, [FRA.GetName] имеет несколько особых преимуществ и способностей для возвращения Миллениума."
 MIL_event.60.a:0 "Ну что ж, удачи им!"
 MIL_event.60_tt:0 "\nКстати, Франция потеряла свою континентальную территорию. Если мы продержимся несколько лет, они, вероятно, рухнут из-за восстаний в своих колониях."
 MIL_event.61.t:0 "Пустота"
 MIL_event.61.d:0 "По сути, Миллениум полностью замолчал."
 MIL_event.61.a:0 "..."
 MIL_event.61_tt:0 "Смеха и шагов людей, шума моторов и поездов… больше нет.\nЧто теперь осталось?"
 MIL_event.62.t:0 "Одинокая королева"
 MIL_event.62.d:0 "Остались только королева и машины."
 MIL_event.62.a:0 "Моя королева…?"
 MIL_event.62_tt:0 "Теперь здесь осталась только королева. Студентки и граждане исчезли давным-давно."

 MIL_event.63.t:0 "Требование линии Мажино от [FROM.GetName]"
 MIL_event.63.d:0 "[FROM.GetName] потребовала передачи линии Мажино, ссылаясь на территориальные права и необходимость обороны восточного региона. Наше руководство возмущено, но, возможно, у нас нет другого выбора, учитывая международные обстоятельства."
 MIL_event.63.a:0 "У нас нет альтернативы."
 MIL_event.63.b:0 "Нелепо."

 MIL_event.64.t:0 "[FROM.GetName] отклоняет передачу линии Мажино"
 MIL_event.64.d:0 "[FROM.GetName] отказалась передать линию Мажино, несмотря на наши территориальные претензии и её стратегическую важность."
 MIL_event.64.a:0 "Тогда война."
 MIL_event.64.b:0 "Ещё не время."

 MIL_event.65.t:0 "Предложение о независимом государстве от [FROM.GetName]"
 MIL_event.65.d:0 "[FROM.GetName] прислала нам сообщение, выражающее озабоченность по поводу нашего предложения о федерализации Кивотоса, и просит сохранить свою академию как независимое государство. Мы должны ответить на её просьбу."
 MIL_event.65.a:0 "У них есть всё, чтобы быть союзником."
 MIL_event.65.b:0 "Никаких исключений."

 MIL_event.66.t:0 "[FROM.GetName] принимает нашу независимость"
 MIL_event.66.d:0 "После объявления о нашем неучастии в федерации Кивотоса, [FROM.GetName] приняла нашу автономию и гарантировала равноправные отношения даже после образования федерации."
 MIL_event.66.a:0 "Хорошая сделка."

 MIL_event.67.t:0 "[FROM.GetName] отвергает нашу независимость"
 MIL_event.67.d:0 "После объявления о нашем неучастии в федерации Кивотоса, [FROM.GetName] отклонила наше предложение."
 MIL_event.67.a:0 "Тогда мы не сможем оставаться союзниками."

 MIL_event.68.t:0 "Восстание Французского сопротивления подавлено"
 MIL_event.68.d:0 "Мы сорвали крупное восстание Французского сопротивления до того, как оно смогло осуществиться, обнаружив их планы и захватив их лидеров внезапной атакой C&C."
 MIL_event.68.a:0 "Ещё одно сопротивление уничтожено."

 MIL_conflict_event.2.t:0 "Электричество отключено"
 MIL_conflict_event.2.d:0 "Оппоненты внутри Миллениума отключили электричество в Башне Миллениума в знак протеста. Башня, погружённая во тьму, заставляет нас опасаться, что это не в последний раз."
 MIL_conflict_event.2.a:0 "Проклятые…!"
 MIL_conflict_event.2.b:0 "Начинайте ремонт немедленно."

 MIL_conflict_event.3.t:0 "Жаркие дебаты"
 MIL_conflict_event.3.d:0 "В одной из комнат Башни Миллениума вспыхнула дискуссия, столь интенсивная, что закончилась перестрелкой. К счастью, никто не пострадал, но наш авторитет пострадал."
 MIL_conflict_event.3.a:0 "Пожалуйста, хватит."
 MIL_conflict_event.3.b:0 "Наказать вовлечённых."

 MIL_conflict_event.4.t:0 "Семинар обретает доверие"
 MIL_conflict_event.4.d:0 "Несмотря на интриги Veritas, на этот раз Семинар вышел победителем. Veritas ослабла, что благоприятствует нашей деятельности."
 MIL_conflict_event.4.a:0 "Хорошо."
 MIL_conflict_event.4.b:0 "Воспользуемся возможностью решить больше проблем."

 MIL_conflict_event.5.t:0 "Авторитет Семинара поставлен под сомнение"
 MIL_conflict_event.5.d:0 "Анонимное сообщение в интернете вызвало студенческую кампанию по сбору подписей против высшего руководства. Оппозиция быстро выросла, и мы должны действовать."
 MIL_conflict_event.5.a:0 "Ну и ну…"
 MIL_conflict_event.5.b:0 "Возглавить контрпропаганду."

 MIL_conflict_event.6.t:0 "Студенческий протест"
 MIL_conflict_event.6.d:0 "Авторитарная политика Семинара спровоцировала студенческие протесты. Они маршируют по кампусу, осуждая злоупотребления, и их число растёт день ото дня."
 MIL_conflict_event.6.a:0 "Ну и ну…"
 MIL_conflict_event.6.b:0 "Вступить с ними в переговоры."

 MIL_conflict_event.7.t:0 "Дебаты о квантовой механике"
 MIL_conflict_event.7.d:0 "Многие подвергают сомнению исследовательские проекты в области квантовой механики, называя их противоречивыми и неэффективными. Уже звучат призывы сократить их бюджет, и Семинар начал защищать исследования доказательствами."
 MIL_conflict_event.7.a:0 "Но свет — это и волна, и частица."

 MIL_conflict_event.8.t:0 "Теорема о невозможности"
 MIL_conflict_event.8.d:0 "Одна группа опубликовала длинную диссертацию о 'теореме невозможности', вызвав хаос во всём Миллениуме. Диссертация доказывает, что невозможно оценить общественное благосостояние с помощью идеальной демократической системы. Протестующие используют её для критики администрации, и беспорядки могут усилиться."
 MIL_conflict_event.8.a:0 "Невероятно, но факт."
 MIL_conflict_event.8.b:0 "Опубликовать другую диссертацию о рациональной диктатуре."

 MIL_mechanical_event.1.t:0 "Протест против призыва людей"
 MIL_mechanical_event.1.desc.a:0 "На улицах возникли протесты с требованием заменить людей на фронте роботами. Хотя они в меньшинстве, если их игнорировать, это может распространиться."
 MIL_mechanical_event.1.desc.b:0 "Протест вырос: они уже вооружены, и к ним присоединяется много солдат."
 MIL_mechanical_event.1.desc.c:0 "После прекращения производства автоматонов протест против отправки гражданских на фронт усилился. Если мы не примем меры, даже наши солдаты могут взбунтоваться."
 MIL_mechanical_event.1.a:0 "Обеспечить больше производства роботов."
 MIL_mechanical_event.1.b:0 "Пусть будет по-ихнему."
 MIL_mechanical_event.1.c:0 "Возобновить производство."
 MIL_mechanical_event.1.d:0 "Мы не ведём переговоров с протестующими!"

 MIL_resistance_control.1.t:0 "Потеря севера!"
 MIL_resistance_control.1.d:0 "После войны мы потеряли контроль над севером Миллениума, нашим технологическим сердцем."
 MIL_resistance_control.1.a:0 "Нам вырвали сердце."

 MIL_resistance_control.2.t:0 "Потеря востока!"
