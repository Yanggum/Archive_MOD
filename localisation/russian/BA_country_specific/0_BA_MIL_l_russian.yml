 MIL_internet_censorship_desc:0 "Несмотря на контроль центральной сети, слухи о президенте Семинара продолжают наносить ущерб её репутации. Мы должны создать Бюро надзора за связью, чтобы блокировать их заранее."
 MIL_control_of_everything:0 "Концентрация власти"
 MIL_control_of_everything_desc:0 "Больше не осталось Семинара, который только цепляется за принципы, не решаясь ничего делать. Мы сосредоточим всю власть в руках президента Миллениума и лидера Семинара, Цукацуки Рио, чтобы преодолеть этот кризис."
