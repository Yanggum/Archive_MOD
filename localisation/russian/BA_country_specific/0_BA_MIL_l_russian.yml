#Фокусы Миллениума
 MIL_SEMINA:0 "Созвать Семинар"
 MIL_SEMINA_desc:0 "После Великого Перемещения, чтобы оценить ситуацию, президент Рио решила созвать членов Семинара."
 MIL_tower_recovery:0 "Энергоснабжение Башни Миллениума"
 MIL_tower_recovery_desc:0 "Чтобы возобновить подачу энергии, прерванную из-за событий, был запущен аварийный генератор, чтобы выиграть немного времени."
 MIL_network_recovery:0 "Восстановление сетевой системы"
 MIL_network_recovery_desc:0 "Хотя это и заняло время, нам удалось восстановить сетевую систему, используя аварийное электропитание."
 MIL_resistance_resolution:0 "Решение проблемы сопротивления"
 MIL_resistance_resolution_desc:0 "Подтверждено местное сопротивление против нас, чужаков, и они нам угрожают. Однако у президента Рио и Химари из Veritas противоположные мнения о том, как справиться с этой ситуацией."
 MIL_east_resistance_resolution:0 "Подавить сопротивление на юге"
 MIL_east_resistance_resolution_desc:0 "Силы сопротивления, сосредоточенные на юге, угрожают студенткам Миллениума. Мы должны защитить их с помощью зачистки."
 MIL_South_resistance_resolution:0 "Подавить сопротивление на востоке"
 MIL_South_resistance_resolution_desc:0 "Силы сопротивления на востоке находятся так близко, что угрожают Башне Миллениума. Мы должны устранить их, чтобы нейтрализовать угрозу."
 MIL_french_problem:0 "Французская проблема"
 MIL_french_problem_desc:0 "Местные французы пока спокойны, но за ними нужно следить. Нам решать, как с ними обращаться."
 MIL_complete:0 "Конец чрезвычайной ситуации"
 MIL_complete_desc:0 "Благодаря быстрой реакции мы преодолели чрезвычайную ситуацию. Теперь пришло время готовиться к движению вперёд."
 MIL_diplomatic_with_SOV:0 "Дипломатический договор с СССР"
 MIL_diplomatic_with_SOV_desc:0 "Хотя у Советского Союза есть различные социалистические проблемы, нам нужен новый союзник. Мы расширим отношения с СССР через экономико-социальное сотрудничество."
 MIL_join_SOV:0 "Вступить в Коминтерн"
 MIL_join_SOV_desc:0 "Вступив в Коминтерн, мы выйдем на арену международной революции и обеспечим своё влияние."
 MIL_administrative_reorganization:0 "Административная реорганизация"
 MIL_administrative_reorganization_desc:0 "Ради административной стабильности и идеологической цели бюрократы с антисоциалистическими тенденциями должны быть заменены."
 MIL_union_representation_act:0 "Закон о профсоюзном представительстве"
 MIL_union_representation_act_desc:0 "После Франко-Миллениумской войны профсоюзы игнорировались. Обеспечение их голоса и должностей в правительстве укрепит права рабочих."
 MIL_agricultural_collectivization:0 "Сельскохозяйственная коллективизация"
 MIL_agricultural_collectivization_desc:0 "Крестьяне-собственники имеют мелкобуржуазные ценности. Мы передадим всю землю региональным советам, чтобы гарантировать средства к существованию и превратить крестьян в рабочих."
 MIL_curriculum_organization:0 "Организация учебной программы"
 MIL_curriculum_organization_desc:0 "Мы официально включим марксистскую идеологию, основанную на диалектическом материализме, в школьную программу, чтобы заложить основы социализма."
 MIL_council_focus:0 "Рабочие советы"
 MIL_council_focus_desc:0 "Рабочие будут организовывать советы для управления регионами, создавая более демократичное управление и ограничивая перегибы центрального комитета."
 MIL_hostile_to_SOV:0 "Оппозиция СССР"
 MIL_hostile_to_SOV_desc:0 "СССР отошёл от марксизма и проводит неустойчивый социализм, который порождает злоупотребления и нестабильность. Мы пойдём другим путём."
 MIL_with_SHE:0 "Альянс с С.Ч.Э.Л.Е."
 MIL_with_SHE_desc:0 "Павшая студенческая администрация и ИИ А.Р.О.Н.А. установили социалистическую систему, основанную на ИИ. Мы объединимся с ними, чтобы совершить революцию в Кивотосе."
 MIL_ourselves:0 "Революция Миллениума"
 MIL_ourselves_desc:0 "Ханаока Юдзу предлагает новую коммунистическую парадигму, основанную на науке и эксперименте. Её реформистская фракция демонтирует старую школьную олигархию." 
 MIL_enemy_of_the_revolution:0 "Враги революции"
 MIL_enemy_of_the_revolution_desc:0 "Миллениум окружён реакционными государствами. Мы должны объединиться, чтобы подготовиться к великой борьбе."
 MIL_concentration_of_power:0 "Концентрация власти" 
 MIL_concentration_of_power_desc:0 "Чтобы установить экономический контроль, мы усилим социальную власть путём расширения администрации."
 MIL_international_industry:0 "Международная промышленность"
 MIL_international_industry_desc:0 "Экономическое сотрудничество с братскими республиками принесёт большее техническое и промышленное развитие."
 MIL_special_economic_zone:0 "Особые экономические зоны"
 MIL_special_economic_zone_desc:0 "Экономический рост застопорился. Мы создадим особые зоны с низкими налогами и благоприятной инфраструктурой, чтобы оживить экономику."
 MIL_NEP:0 "Новая экономическая политика"
