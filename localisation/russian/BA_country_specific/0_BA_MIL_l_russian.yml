# Интро
 MIL_country_intro_header: "Академия Разума и Логики"
 MIL_country_intro_content: "Наряду с Тринити и Генной, это одна из трёх великих академий Кивотоса, и та, которая больше всего ценит разум и технологии. Хотя её история короче, чем у Тринити или Генны, её влияние настолько велико, что простирается по всему Кивотосу. Это академия, высоко развитая в науке и исследованиях, до такой степени, что все новые технологии и инновации в Кивотосе, кажется, зарождаются здесь.\n\nСтуденческий совет Миллениума, известный как Семинар, начинался как маленький исследовательский клуб, посвящённый решению «Семи Проблем». Из их экспериментов и проверок возникли специализированные исследовательские ветви и организации, которые стали нынешними клубами Миллениума. Можно сказать, что Семинар — это источник всех клубов и самой академии.\n\nКогда академия подверглась сверхъестественному явлению и высадилась в новом мире, первое, что она увидела, были странные люди с коктейлями Молотова в руках. В их глазах академия была межпространственным захватчиком, и хотя они сопротивлялись по-своему, технологический разрыв был непреодолим, и они были разгромлены.\nСолдаты, которые не сдались, спрятались среди гражданских и продолжили свои террористические атаки на академию, превратив район в запретную зону.\n\n§YРазработано: SKSKle§!"
 MIL_guide: "\nКак Президент Семинара\n£white_dot Выиграй борьбу за власть в Миллениуме\n£white_dot Ликвидируй французское сопротивление\n£white_dot Реши проблему руин\n£white_dot Возродись как Большая Сестра\n\n\nКак Глава Veritas\n£white_dot Выиграй борьбу за власть в Миллениуме\n£white_dot Реши проблему французского сопротивления\n£white_dot Реши проблему руин\n£white_dot Исполни свой долг как гениальная хрупкая милая хакерша\n\n\n§RШтормовые волны приближаются к Миллениуму.§!"
# Описание страны
 MIL_GATHERING_STORM_DESC:0 "Школа наук Миллениума, руководимая Большой Сестрой Рио, была вынуждена оккупировать французскую территорию из-за неожиданного явления Великой войны. В хаосе Миллениум быстро оккупировал Францию, в то время как её правительство и некоторые граждане бежали в изгнание в Алжир.\n\nПосле оккупации Миллениум сталкивается с непрекращающимися внутренними восстаниями и внешними угрозами. Сопротивление на французских территориях не утихает, а в Алжире они ждут своего часа для контратаки."

