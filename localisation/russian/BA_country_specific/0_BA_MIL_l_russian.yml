 MIL_come_back_queen:0 "Принцесса Безымянных"
 MIL_come_back_queen_desc:0 "Код <AL_1S> — это <принцесса> <Безымянных>, которая оставалась в руинах. Однако из-за ошибки со стороны Миллениума <принцесса> пробудилась, и они заплатили цену. Отныне Миллениум будет подчиняться исключительно под властью <принцессы Безымянных>."
 MIL_lightsword_supernova:0 "Меч Света, Сверхновая"
 MIL_lightsword_supernova_desc:0 "Меч Света, Сверхновая, является эксклюзивным оружием AL_1S и шедевром, созданным Инженерным департаментом Миллениума. Главное орудие, поглотившее 70% их бюджета, теперь было возвращено AL_1S."
 MIL_restart:0 "Перезапуск"
 MIL_restart_desc:0 "После смерти президента Рио многие системы и фабрики перестали работать. Теперь пришло время запустить их снова."
 MIL_queens_day:0 "День королевы"
 MIL_queens_day_desc:0 "Код <AL_1S>, <принцесса безымянных богов>, больше не принцесса, а возродилась как истинная королева Безымянных. Теперь она будет называть себя <королевой>, а не <принцессой>. Принцесса превратилась в королеву."
 MIL_use_lightsword:0 "Использование меча света"
 MIL_use_lightsword_desc:0 "Пришло время использовать меч света, чтобы противостоять грозным врагам Кивотоса. Кивотос не будет лёгким. Однако силы меча света будет достаточно, чтобы уничтожить их."
 MIL_unique_system:0 "Уникальная система"
 MIL_unique_ststem_desc:0 "Мы построим свою новую систему, расширим наше влияние в Кивотосе и будем править миром по-своему."
