 MIL_agricultural_management_act:0 "Закон об управлении сельским хозяйством"
 MIL_agricultural_management_act_desc:0 ""
 MIL_millennium_central_bank:0 "Центральный банк Миллениума"
 MIL_millennium_central_bank_desc:0 "В настоящее время экономикой управляет Семинар, но это неэффективно. Мы создадим Центральный банк с экспертами для эффективного управления экономикой."
 MIL_acceptance_of_the_franc:0 "Принять франк"
 MIL_acceptance_of_the_franc_desc:0 "Франк знаком французам. Его принятие завоюет их симпатию и ускорит стабилизацию."
 MIL_market_liberation:0 "Либерализация рынка"
 MIL_market_liberation_desc:0 ""
 MIL_market_control:0 "Контроль инфляции"
 MIL_market_control_desc:0 "Мы так сосредоточились на других проблемах, что упустили инфляцию. Мы сократим денежную эмиссию, чтобы решить её."
