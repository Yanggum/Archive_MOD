# Новостные события
 MIL_news.1.t: "Победа $fldh$ в борьбе за власть"
 MIL_news.1.desc: "Война между Миллениумом и Францией после явления Великой войны закончилась победой Миллениума. Французское правительство отправилось в изгнание, но французские граждане не смогли этого сделать. На экстренном собрании Миллениума разгорелись жаркие дебаты о том, как решить вопрос французских граждан, и в итоге $fldh$ вышла победительницей в дискуссии.\n\nКроме того, её лидерство, проявленное в дебатах, принесло ей избрание президентом $MIL_seminar_character$. Новость о том, что $fldh$, выступающая за жёсткий контроль, взяла абсолютное командование $MIL_seminar_character$, не будет хорошо воспринята французским сопротивлением."
 MIL_news.1.a: "Это наиболее рационально."
 MIL_news.1.b: "Сможет ли она хорошо руководить Миллениумом?"
 MIL_news.1.c: "Интересно."
 MIL_news.2.t: "Победа $MIL_Himari$ в борьбе за власть"
 MIL_news.2.desc: "Война между Миллениумом и Францией после явления Великой войны закончилась победой Миллениума. Французское правительство отправилось в изгнание, но французские граждане не смогли этого сделать. На экстренном собрании Миллениума разгорелись жаркие дебаты о том, как решить вопрос французских граждан, и вопреки всем ожиданиям $MIL_Himari$ вышла победительницей в дискуссии.\n\nВ отличие от $fldh$, выступавшей за жёсткий контроль, $MIL_Himari$ предложила примирительный подход к французским гражданам. Следовательно, $MIL_seminar_character$ признала лидерство Акэбоши Химари и избрала её президентом $MIL_seminar_character$."
 MIL_news.2.a: "Настало время сиять гениальной хрупкой милой хакерше!"
 MIL_news.3.t: "$fldh$ отстранена"
 MIL_news.3.desc: "По мере того как авторитарные и опасные планы $fldh$ продолжались, она в конце концов потеряла доверие $MIL_seminar_character$, и её база поддержки рухнула. В результате в $MIL_seminar_character$ была внесена резолюция о порицании, которая была одобрена подавляющим большинством, тем самым отстранив $fldh$ от должности президента.\n\nВ настоящее время пост президента вакантен, и ожидается, что $MIL_seminar_character$ будет временно исполнять обязанности. Однако дискуссии о новом руководстве продолжаются, и то, как будет перебалансирована внутренняя власть, остаётся неясным."
 MIL_news.3.a: "\"Я... просто хотела сделать всё правильно...\""
 MIL_news.3.b: "Ожидаемо."
 MIL_news.3.c: "Они и здесь применяют парламентаризм?"
 MIL_news.4.t: "Специальный лайв Hatsune Miku"
 MIL_news.4.desc: "За две недели до концерта Hatsune Miku, благодаря технологиям [MIL.GetName], был изготовлен гуманоидный андроид по индивидуальному заказу. Однако адаптация к новому телу была нелёгкой, и речь, и пение были нестабильными, до такой степени, что опасались задержки специального лайва. Но после постоянных тренировок ей удалось преодолеть проблемы, и шоу состоялось, как и планировалось.\n\nПесни для концерта уже были определены, но в конце прозвучала неожиданная композиция: песня, сочинённая самой Hatsune Miku для своих фанатов. Под возгласы и овации, длившиеся почти минуту, песня завершилась. Наконец, Hatsune Miku попрощалась, завершив концерт, полный эмоций."
 MIL_news.4.a: "Потому что я 'Hatsune Miku', которая искренне передаёт песни тем, кто слушает!"
 MIL_news.4.b: "Мне это понравилось!"