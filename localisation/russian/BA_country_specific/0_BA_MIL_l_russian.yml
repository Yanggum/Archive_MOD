 MIL_preemptive_intervention_3_desc:0 ""
 MIL_preemptive_intervention_4:0 "Тотальная война"
 MIL_preemptive_intervention_4_desc:0 ""
 MIL_preemptive_intervention_5:0 "Превентивное вмешательство"
 MIL_preemptive_intervention_5_desc:0 ""
 MIL_preemptive_intervention_6:0 "Приоритет угрозе фашизма"
 MIL_preemptive_intervention_6_desc:0 ""
 MIL_preemptive_intervention_7:0 "Сдерживание радикальных академий"
 MIL_preemptive_intervention_7_desc:0 ""
 MIL_preemptive_intervention_8:0 "Превентивная война"
 MIL_preemptive_intervention_8_desc:0 ""
 MIL_Rio_route_Millennium_Advanced_Group:0 "Передовая группа Миллениума"
 MIL_Rio_route_Millennium_Advanced_Group_desc:0 ""
 MIL_domestic_administration:0 "Фокус на поддержании академии"
 MIL_domestic_administration_desc:0 "Исполнительные лица, понимая, что ситуация скоро не закончится, решили сначала решить насущные проблемы. Благодаря их сотрудничеству ситуация быстро стабилизируется. Но это не конечная цель."
 MIL_resistance_suppression:0 "Сдерживание сопротивления"
 MIL_resistance_suppression_desc:0 "Студентки быстро адаптировались к повторяющимся терактам сопротивления. С введением систематической подготовки к реагированию, теперь сопротивлению потребуется гораздо больше времени и жертв для достижения своих целей."
 MIL_promoting_civil_division:0 "Поощрение гражданского разделения"
 MIL_promoting_civil_division_desc:0 "Мы решили предложить немного развлечения праздным французам. Теперь пальцы, указывавшие на нас, укажут друг на друга."
 MIL_hierarchy:0 "Иерархическая структура"
 MIL_hierarchy_desc:0 "Теперь французы получат новый статус. Единственный чёткий критерий: «мнения тех, кто внизу, не имеют значения»."
 MIL_special_rights:0 "Особые права"
 MIL_special_rights_desc:0 "Власть никогда не принадлежала большинству. Те, кто верил в эгалитарное общество, увидят мир, возвращающийся к привычному. Те, кто получит права от новых французских властей, установят новый порядок при новой системе."
 MIL_oppressive_government:0 "Репрессивное правительство"
 MIL_oppressive_government_desc:0 "Человек — это животное, которое ждёт, что кто-то сильный поведёт его. Мы покажем им нашу истинную силу."
 MIL_per_cooperator:0 "Партия коллаборационистов"
 MIL_per_cooperator_desc:0 "Хотя многие были сбиты с толку изменившейся ситуацией, те, кто нас поддерживает, уже начинают собираться. Скоро у нас будет эффективный способ передать наше послание."
 MIL_Harmony_between_citizens_and_students:0 "Гармония между гражданами и студентками"
 MIL_Harmony_between_citizens_and_students_desc:0 "Всё больше людей, разделяющих наши взгляды, собираются вместе. Они окажут большую помощь в новом обществе, которое мы построим."
 MIL_establishment_parliament:0 "Учреждение парламента"
 MIL_establishment_parliament_desc:0 "Новый порядок нуждается в новой системе. Мы создадим парламент, состоящий из французов, для формирования подчинённого правительства, которое будет сотрудничать с нами."
 MIL_rule:0 "Правление"
 MIL_rule_desc:0 "Благодаря вашим усилиям общество быстро стабилизируется. Больше нет места для сопротивления, которое нам мешало."
 MIL_technology_propaganda:0 "Пропаганда науки"
 MIL_technology_propaganda_desc:0 "Настало время, чтобы сила Школы наук Миллениума засияла. Наши технологии окажут большую помощь в их продвижении к лучшему обществу."
 MIL_mutual_surveillance_system:0 "Система взаимного наблюдения"
 MIL_mutual_surveillance_system_desc:0 "Местные жители лучше всех знают свою землю. С их помощью мы сможем более эффективно разбираться с возмутителями спокойствия."
 MIL_seer_of_the_millennium:0 "Провидица Миллениума"
 MIL_seer_of_the_millennium_desc:0 ""
 MIL_one_seminar:0 "Один семинар, одна повестка"
 MIL_one_seminar_desc:0 ""
 MIL_seminar_leader:0 "Лидер Семинара"
 MIL_seminar_leader_desc:0 ""
 MIL_idolization:0 "Идолопоклонство"
 MIL_idolization_desc:0 ""
 MIL_avoiding_the_worst_situation:0 "Избежать худшей ситуации"
 MIL_avoiding_the_worst_situation_desc:0 ""
 MIL_savior_of_the_apocalypse:0 "Спасительница апокалипсиса"
 MIL_savior_of_the_apocalypse_desc:0 ""
 MIL_head_to_the_front_line:0 "На передовую"
 MIL_head_to_the_front_line_desc:0 ""
 MIL_french_region_integration:0 "Интеграция французского региона"
 MIL_french_region_integration_desc:0 ""
 MIL_rio_ousted:0 "Смещение Рио"
 MIL_rio_ousted_desc:0 ""
