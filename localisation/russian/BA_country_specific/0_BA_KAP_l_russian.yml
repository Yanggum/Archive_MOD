l_russian:

  # Названия и описания фокусов
  KAP_strengthen_the_central_secretariat: "Оценить текущую ситуацию"
  KAP_strengthen_the_central_secretariat_desc: "В 1936 году феномен, известный как Великое Перемещение, поглотил Академический город и перенес его в чужой мир под названием Земля. Мы должны как можно скорее понять, что здесь происходит."
  KAP_marxist_orthodoxy: "Принять предложение Които"
  KAP_marxist_orthodoxy_desc: "Однажды студентка из Сингикана прибыла в временный лагерь интерната Юно-ока. Это была Ашихарацумори Които, избранная представителем Сингикана после Перемещения. Она утверждает, что мы должны немедленно обратиться за помощью к близлежащим державам, даже ценой отказа от нашей системы. Ее доводы убеждают Коханэ, которая решает протянуть ей руку и довериться мнению учеников."
  KAP_soviet_leadership: "Ответ из-за моря"
  KAP_soviet_leadership_desc: "Които была права. Пришел ответ из страны, называемой «Япония», по ту сторону моря. Они хотят объединиться с нами, чтобы противостоять новым державам из иных миров. Мы не знаем, кто они на самом деле, но благодаря их предложению, возможно, мы преодолеем кризис."
  KAP_soviet_economic_aid: "Японская экономическая помощь"
  KAP_soviet_economic_aid_desc: "Наконец-то прибыли припасы, которые мы просили у Японии. Студенты приветствуют чужеземца Хирохито, и, имея эту базу, мы сможем подготовиться к надвигающейся угрозе."
  KAP_internationalism: "Объединиться с ними"
  KAP_internationalism_desc: "Япония сообщает нам, что желает сражаться плечом к плечу в одном и том же альянсе. Энтузиазм студентов неудержим, и соглашение заключается в мгновение ока. Мы больше не одиноки в этом мире."
  KAP_agrarian_socialism: "Позиция Коханэ"
  KAP_agrarian_socialism_desc: "Академический город погружен в хаос. Среди этой нужды Коханэ — привыкшая к сельской жизни без роскоши — сохраняет спокойствие и воодушевляет студентов. Она утверждает, что только полное единство преодолеет кризис, и все, нуждаясь в лидере, следуют за ней."
  KAP_rectification_campaign: "Студенческое движение"
  KAP_rectification_campaign_desc: "Под единым лидером ученики организуются для решения проблем. Коханэ чувствует — сама не зная почему — что будущее светлеет."
  KAP_maoism: "Коханэ, девушка, которая мечтала"
  KAP_maoism_desc: "Благодаря единству славные дни Академического города постепенно возрождаются. Без различия происхождения или ранга все действуют как одно целое. Коханэ снова мечтает о городской жизни, к которой стремилась."
  KAP_socialism_with_KAPnese_characteristics: "Единство Академического города"
  KAP_socialism_with_KAPnese_characteristics_desc: "Больше нет разделений: одна академия и одна цель. Собравшись под именем железной дороги, которая нас связывала, мы обнажаем меч, чтобы восстановить славу Капилы. Ничто не сможет нас разлучить!"
  KAP_proclaim_the_peoples_republic: "Академический город Капила"
  KAP_proclaim_the_peoples_republic_desc: "Наконец все угрозы рассеялись. Капила снова встает и с гордостью являет себя миру. Да светит ореол вечно!"
  KAP_socialist_market_economy: "Сияющий ореол, сверкающий клинок"
  KAP_socialist_market_economy_desc: "Когда свет ореола заставит сверкать меч, мы будем двигаться вперед без страха."
  KAP_social_democracy: "Решение Каору"
  KAP_social_democracy_desc: "Каору из интерната Манъёсю после Перемещения обнаруживает, что нет следов учеников интерната Ураноцукаса. Она выясняет, что в соседнем Китае эти студенты взяли власть после переговоров с чужеземцами. Решившись, Каору отправляется убеждать Ураноцукаса."
  KAP_coalition_government: "Академическое правительство"
  KAP_coalition_government_desc: "Каору удается провести переговоры с Кузуноха Рэй, представительницей Ураноцукаса. Они тоже страдают от хаоса и, по местным слухам, опасаются неизбежной войны. Чтобы упрочить наше положение и подготовиться к опасности, мы начинаем терпеливое убеждение."
  KAP_purge_the_radicals: "Речь к студентам"
  KAP_purge_the_radicals_desc: "Мы объявляем о сотрудничестве с Ураноцукаса, чтобы заручиться поддержкой студентов. Академии объединяются, неразбериха уменьшается, и все работают на будущее."
  KAP_strengthen_the_left_wing_of_the_kmt: "Невидимая рука Каору"
  KAP_strengthen_the_left_wing_of_the_kmt_desc: "Сотрудничая с Ураноцукаса, Каору незаметно ведет интриги, чтобы завоевать симпатии внутри Китая."
  KAP_remove_KAPang_kai_shek: "Отставка Рэй"
  KAP_remove_KAPang_kai_shek_desc: "Кузуноха Рэй теряет поддержку перед Каору как в Китае, так и в академическом правительстве. Она отказывается от своего режима и стремится присоединиться к нашему альянсу. Момент полного объединения близок."
  KAP_literacy_programs: "Возобновление занятий"
  KAP_literacy_programs_desc: "Хотя обстоятельства тяжелы, приостановка обучения привела бы к непростительному регрессу. Ради будущего мы должны снова учиться."
  KAP_land_redistribution: "Начать реорганизацию"
  KAP_land_redistribution_desc: "Внезапное бедствие посеяло смятение. Нам нужно время, чтобы решить, что является приоритетным."
  KAP_KAPna_medical_university: "Повышение квалификации"
  KAP_KAPna_medical_university_desc: "Имея доступные ресурсы, пришло время расширить горизонты и утолить нашу бесконечную жажду знаний."
  KAP_form_the_academy_of_sciences: "Теперь я понял!"
  KAP_form_the_academy_of_sciences_desc: "Черт возьми, Коханэ, теперь я все понял!"
  KAP_enforce_the_three_rules: "Погасить тревогу"
  KAP_enforce_the_three_rules_desc: "Кто может сохранять спокойствие в таком хаосе? Если мы их не успокоим, огонь никогда не погаснет."
  KAP_permit_opium_trade: "Кнут убеждения"
  KAP_permit_opium_trade_desc: "Иногда для убеждения нужны жесткие методы."
  KAP_ban_the_opium_trade: "Пряник единства"
  KAP_ban_the_opium_trade_desc: "Чтобы достичь совершенного единства, помимо логики, нужно и небольшое вознаграждение."
  KAP_abolish_the_land_rent: "Наш вывод"
  KAP_abolish_the_land_rent_desc: "Хотя мы живем в разных резиденциях, все мы из Капилы. Мы — товарищи, жаждущие учиться, чего бы это ни стоило."
  KAP_the_yanan_base_area: "Подготовить инфраструктуру"
  KAP_the_yanan_base_area_desc: "Хотя эта земля незнакома, нам нужно место, где жить и работать, пока мы здесь находимся."
  KAP_focus_on_KAPna: "Слушать мир"
  KAP_focus_on_KAPna_desc: "Ресурсов мало, и мы не видим четких поставок. Возможно, если мы начнем взаимодействовать с местными жителями, задача станет проще."
  KAP_exploit_the_weak_neighbours: "Изучать экономические модели"
  KAP_exploit_the_weak_neighbours_desc: "Наша торговая система устарела и закрыта. Мы должны вдохновляться практиками этого мира для достижения большей эффективности."
  KAP_infiltration: "Следовать тенденции"
  KAP_infiltration_desc: "Поговорив с местными жителями, мы обнаруживаем, что вся страна охвачена решающими битвами. Нам бы не хотелось оставаться в стороне от моды."
  KAP_prepare_for_war_with_japan: "Переточить мечи"
  KAP_prepare_for_war_with_japan_desc: "Столько размышлений притупило наши клинки. Настало время снова их заточить."
  KAP_government_of_national_defense: "Стальной скакун"
  KAP_government_of_national_defense_desc: "Местное население использует различные транспортные средства. Мы тоже не можем вечно ходить пешком."

  KAP_confrontation_with_the_warlords: "Тысяча лепестков в небе"
  KAP_confrontation_with_the_warlords_desc: "Однажды мы увидели неизвестную металлическую птицу. Согласно исследованиям, это «самолет», с помощью которого они господствуют в небе. Если бы мы могли построить такой, это было бы потрясающе."

  # Пасхальное яйцо проекта VK
  KAP_central_security_bureau: "Необъяснимое влечение"
  KAP_central_security_bureau_desc: "Вы потерпели неудачу..."
  KAP_revolutionary_military_commission: "Резка сна типа I"
  KAP_revolutionary_military_commission_desc: "Каждый раз, когда мы выходим на взаимодействие у моря, мы обычно видим на поверхности воды незнакомые сооружения, груженные людьми и товарами.\nНеужели наконец-то можно наслаждаться досугом на воде?"
  KAP_central_military_commission: "Полевые практики"
  KAP_central_military_commission_desc: "Уже недостаточно просто наблюдать издалека.\nНастало время учиться, осваивать и напрямую применять технологии этого места."
  KAP_peoples_liberation_army: "Индивидуальная работа"
  KAP_peoples_liberation_army_desc: "Хотя однажды мы последовали по их стопам, теперь наш ритм больше не совпадает с их."
  KAP_peoples_volunteer_army: "Командная работа"
  KAP_peoples_volunteer_army_desc: "У здешних людей есть чему поучиться.\nК тому же мы очень похожи; кажется, мы могли бы стать отличным дуэтом."
  KAP_anti_japanese_expedition: "Новое оружие"
  KAP_anti_japanese_expedition_desc: "Что, просто пошевелив пальцем, можно убить...?\nОгнестрельное оружие — это подло, но невероятно мощно..."
  KAP_provoke_japan: "Эпоха великого пороха"
  KAP_provoke_japan_desc: "Рабочая сила, материалы, предприятия... человек, который когда-то вымогал все, что существовало в этом мире: Король Вымогательства Бакку Бёнлим.\nПеред смертью он оставил эти слова, которые отправили весь мир прямиком на Пиксив:\n«Мое сокровище? Если хочешь, я отдам его тебе.\nИщи его. Я оставил всех фута этого мира там».\nТак мир вступает в Великую Эру Фута."
  KAP_protracted_warfare: "Стратегия против снарядов"
  KAP_protracted_warfare_desc: "Если нельзя уклониться, остается только рубить.\nДаже пули не могут обмануть наши глаза."
  KAP_peoples_war: "Человек-танк"
  KAP_peoples_war_desc: "Часто говорят, что перо сильнее меча,\nно те, кто проверил это мечом, уже покинули этот мир,\nи поэтому не осталось никого, кто мог бы это опровергнуть."
  KAP_mobile_warfare: "Грохот, сотрясающий землю"
  KAP_mobile_warfare_desc: "Это новое оружие, намного превосходящее мощь огнестрельного.\nС такой силой даже меч не сможет его остановить."
  KAP_100_regiments_campaign: "Железнодорожное агентство Наюта №7"
  KAP_100_regiments_campaign_desc: "Мы восстановили железнодорожное агентство, которое когда-то отвечало за доставку нас в школу.\nНо теперь оно будет работать для обеспечения нашей победы."

  # Имена персонажей
  KAP_Kohane: "Охитоме Коханэ"
  KAP_Kaoru: "Итоконоуэ Каору"
  KAP_koito: "Ашихарацумори Които"
  KAP_rei: "Кузуноха Рэй"
  KAP_Ju_at_su: "Джуацу!"
  KAP_reconnaissance_Kaoru: "Наблюдающая"
  KAP_in_jang_jujack_Kaoru: "Что это за подделка печатей?"
  KAP_Zotdam_Kaoru: "Мы в полной жопе"
  KAP_ame: "Аме"
  KAP_AME_DESC: "Девушка неизвестного происхождения, прибывшая с Третьим Великим Перемещением.\nБольшую часть дня она катается по полу, играя с плюшевым тюленем и в видеоигры.\nОбожает игры, но из-за недостатка опыта ее навыки ужасны, она всегда на последнем месте, во что бы ни играла.\nТем не менее, ее общая компетентность неоспорима: она может управляться с чем угодно,\nот голографических дронов до взлома, и даже докучать своей подруге детства Э□□."

  # Национальные духи
  KAP_gongsadamang: "Огонь"
  KAP_gongsadamang2: "Немного"
  KAP_gongsadamang3: "Погаси его"
  KAP_gongsadamang4: "Пожалуйста"
  KAP_gongsadamang_desc: "Коханэ в огне"
  KAP_gongsadamang2_desc: "Пшшш, пшшш"
  KAP_gongsadamang3_desc: "Не могли бы вы потушить огонь?"
  KAP_gongsadamang4_desc: "Дай мне посмотреть на мою оперативную память"
  KAP_together: "Крепкая связь"
  KAP_together_desc: "Что бы ни случилось, мы едины.\n...но почему все еще все горит?"
  KAP_halo_and_sword: "Сияющий ореол, сверкающий клинок"
  KAP_halo_and_sword_desc: "Когда свет ореола и блеск меча переплетаются,\nмы будем двигаться вперед без страха."
  KAP_3nd_sin_B: "Третье Великое Перемещение"
  KAP_3nd_sin_B_desc: "Ух ты, пасхальное яйцо найдено!"
  KAP_reload: "Реорганизация"
  KAP_Fieldtraining: "Полевые практики"
  KAP_solo_assignment: "Индивидуальная работа"
  KAP_cap: "Стратегия против снарядов"
  KAP_human_tank: "Человек-танк"

  # Черта лидера
  KAP_kohane_vanjyai: "Восхищающаяся девушка: Коханэ"