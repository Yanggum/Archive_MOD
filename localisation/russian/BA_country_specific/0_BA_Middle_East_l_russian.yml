 #시리아 이벤트
 SYR_event.1.t: "Независимость"
 SYR_event.1.d: "Когда большая часть французских войск, дислоцированных по всей Сирии, вернулась в метрополию для борьбы с существованием Другого Мира, сирийцы действовали!\n\n Рабочие, крестьяне, предприниматели, религиозные деятели и интеллигенция объединили усилия, чтобы изгнать империалистических угнетателей. Было много жертв, но, преодолев провал попытки обретения независимости в 1920 году и трехлетнего восстания друзов, и оставив позади даже 33 года приостановки действия конституции, вывод последнего французского контингента из Сирии завершил окончательную независимость. Сирийцы празднуют, а гражданское общество занято проектированием нового государства!"
 SYR_event.1.a: "Да здравствует освобожденная Сирия!"
 SYR_event.2.t: "Запрос экономической помощи от [SYR.getname]"
 SYR_event.2.d: "Правительство [SYR.getname], только что освободившееся от французского колониального господства, обратилось к нам, Советскому Союзу — авангарду антиимпериалистического движения — за поддержкой, чтобы стимулировать свой экономический рост сразу после освобождения."
 SYR_event.2.a: "Поможем им."
 SYR_event.2.b: "Мы тоже заняты."
 SYR_event.3.t: "Экономическая помощь от Советского Союза"
 SYR_event.3.d: "Советский Союз решил принять нашу просьбу о помощи."
 SYR_event.3.a: "Спасибо."
 SYR_event.4.t: "Сирийский запрос о промышленной поддержке"
 SYR_event.4.d: "Министерство экономики [SYR.getname] попросило нас поддержать их экономику. В обмен на помощь их промышленности, возможно, мы сможем получить от них то, что желаем."
 SYR_event.4.a: "Звучит заманчиво."
 SYR_event.4.b: "Нам не нужно сотрудничать с ними."
 SYR_event.5.t: "Согласие [FROM.getname]"
 SYR_event.5.d: "Правительство [FROM.getname] согласилось на нашу просьбу о поддержке. Однако нам придется заплатить цену, которую они требуют."
 SYR_event.5.a: "Спасибо."
 SYR_event.6.t: "Отказ [FROM.getname]"
 SYR_event.6.d: "Правительство [FROM.getname] отклонило нашу просьбу о поддержке."
 SYR_event.6.a: "Какая жалость."
 SYR_event.7.t: "Земельная реформа"
 SYR_event.7.d: "В ходе продвижения земельной реформы столкнулись умеренные и радикалы. Умеренное крыло партии предлагает сначала наделить крестьян землей и завершить первую реформу; позже, когда производственные мощности позволят, провести коллективизацию сельского хозяйства. С другой стороны, радикальное крыло предупреждает, что появление мелких собственников может способствовать развитию мелкобуржуазных идей среди трудящихся масс и привести к контрреволюции, поэтому требует немедленной и решительной коллективизации сельского хозяйства."
 SYR_event.7.b: "Наделить землей."
 SYR_event.7.a: "Давайте двигаться к коллективному сельскому хозяйству!"
 SYR_event.8.t: "Свободные выборы"
 SYR_event.8.d: "Для руководства недавно получившей независимость Сирией в каждом округе было избрано 200 сирийцев всех профессий и слоев. Их происхождение разнообразно: от традиционных элит, таких как религиозные деятели, учителя, чиновники и землевладельцы, до секторов, считающихся народными, таких как профсоюзные деятели, студенты и беднота.\n\n Сила, получившая большинство в Народном Совете, сможет определить и провозгласить курс будущей Сирии; поэтому каждая партия готовилась действовать. Однако Национальный блок — который возглавлял договор о независимости и организовал недавнюю забастовку — пришел к власти при широкой народной поддержке."
 SYR_event.8.a: "Да здравствует республиканская Сирия!"
 SYR_event.9.t: "Прямое действие"
 SYR_event.9.d: "Трудящиеся массы рабочих, крестьян, бедноты, студентов и интеллигенции Сирии одновременно вступили в забастовку. Улицы заполнились демонстрациями, а общественные здания были заняты протестующими посредством спланированных штурмов.\n\n Сирийско-ливанская коммунистическая партия заявила в Национальном Совете, что будет активно отстаивать требования трудящихся масс и реорганизует общество как освобожденную социалистическую Сирию."
 SYR_event.9.a: "Это революция!"
 SYR_event.10.t: "[FROM.getname] присягнул на верность Королевскому Дому!"
 SYR_event.10.d: "[FROM.GetAdjective] присягнул на верность нашему Королевскому Дому."
 SYR_event.10.a: "Спасибо."
 SYR_event.11.t: "Запрос о присоединении к Содружеству"
 SYR_event.11.d: "[FROM.getname] запросил присоединение к Содружеству."
 SYR_event.11.a: "Примем этих лояльных."
 SYR_event.11.b: "Они еще не готовы."
 SYR_event.12.t: "Отказ [FROM.getname]"
 SYR_event.12.d: "Наше предложение было отклонено."
 SYR_event.12.a: "Какая жалость."
 SYR_event.13.t: "Всеобщая сирийская забастовка"
 SYR_event.13.d: "Становится все более очевидным, что колониальное господство в Сирии и Ливане, сохранявшееся последние десять лет, больше не может продолжаться. Со всеобщей сирийской забастовкой улицы давно парализованы, а гарнизон в Сирии несет значительные потери. Вдобавок забастовка распространилась как солидарные стачки и акции солидарности в соседних арабских странах, формируя значительные политические движения в Палестине, Ливане, Иордании и других местах.\n\n Его Превосходительство Маршал хорошо понимает, что это противостояние не отвечает национальным интересам Франции. Ради Франции он готов предстать безупречно и вступить в открытый диалог с Сирией."
 SYR_event.13.a: "Это шаг назад, чтобы сделать два вперед."
 SYR_event.14.t: "Отставка [SYR_mehemed_ali_abed.getname]"
 SYR_event.14.d: "[SYR_mehemed_ali_abed.getname], занимавший пост президента около четырех лет, иногда критиковался за излишнюю уступчивость в дипломатии по отношению к Франции, но несомненно, что он один из наших любимых борцов за независимость. Он объявил, что уйдет в отставку, чтобы помочь создать новое правительство после обретения независимости. Свободный парламент, доверившийся [SYR_hashim_al_atassi.getname] — который планировал и руководил всеобщей сирийской забастовкой — решил, что он станет следующим президентом."
 SYR_event.14.a: "Поприветствуем нового президента."
 SYR_event.15.t: "Восстание"
 SYR_event.15.d: "Слабая парламентская демократия — это больше не то, что мы должны рассматривать. Храбрый и бдительный офицерский корпус вместе с Национально-социальной партией штурмовал столицу. Было некоторое сопротивление, но оно было нейтрализовано, и власть была захвачена. Тем не менее, все еще неясно, потерпит ли провинция наши действия!"
 SYR_event.15.a: "Да здравствует восстание!"
 SYR_event.16.t: "Дружба с Западом"
 SYR_event.16.d: "Хотя мы обрели независимость, мы все еще находимся на скользком склоне, где должны защищать демократию от угроз коммунизма и фашизма. Координация с Западом ставит во главу угла не национальное чувство, а защиту демократического порядка."
 SYR_event.16.a: "Поймут ли люди?"
 SYR_event.17.t: "Запрос о покупке Кипра"
 SYR_event.17.d: "[FROM.getname] запросил покупку Кипра."
 SYR_event.17.a: "Это хорошая сделка."
 SYR_event.17.b: "Какая наглость."
 SYR_event.18.t: "Ультиматум от [FROM.getname]"
 SYR_event.18.d: "Правительство [FROM.GetAdjective] направило нам ультиматум с требованием наших юго-восточных территорий. Хотя в основном это курдские земли, это вопиющее нарушение нашего суверенитета!"
 SYR_event.18.a: "Нет ничего ценнее мира."
 SYR_event.18.b: "Какая наглость!"
 SYR_event.19.t: "Государственный переворот!"
 SYR_event.19.d: "Группа фашистских офицеров, предположительно подстрекаемая [SYR.gentame], совершила государственный переворот."
 SYR_event.19.a: "Да здравствует Новый Ирак!"
 SYR_event.19.b: "Остановите их!"
 SYR_event.20.t: "Классовое сотрудничество разрушено"
 SYR_event.20.d: "Поддерживать классовое сотрудничество под флагом демократии и реформировать свободную Сирию оказалось идеалистической фантазией абсолютного наивного человека. Сплоченность была нарушена, солидарность рухнула. В провинциях поднимаются разные силы!"
 SYR_event.20.a: "Проклятье!"
 SYR_event.20_tt_1: "Завершите фокус §Y$SYR_focus_dem_9$§!, чтобы иметь возможность продолжить движение к коммунизму!\n"
 SYR_event.20.b: "Не зря существует классовая борьба."
 SYR_event.21.t: "Предложение торгового договора от [FROM.getname]"
 SYR_event.21.d: "Правительство [FROM.GetAdjective] предложило нам подписать торговый договор."
 SYR_event.21.a: "Звучит заманчиво."
 SYR_event.21.b: "А с какой стати?"
 SYR_event.22.t: "Предложение об интеграции от [SYR.getname]"
 SYR_event.22.d: "Вместе долгое время перенося колониальное господство, наши сирийские товарищи предложили нам интеграцию."
 SYR_event.22.a: "Мы братья!"
 SYR_event.22.b: "Это не более чем экспансионизм."

 
