  ENG_country_intro_header: "Правь, Британия!"
  ENG_country_intro_header_1: "Великая война и мир"
  ENG_country_intro_header_2: "Британцы никогда не будут рабами."
  ENG_country_intro_content: "Победа в Наполеоновских войнах стала поворотным моментом, сделавшим Британскую империю мировой гегемонией. Победа антифранцузской коалиции ослабила влияние Франции в Европе, и, опираясь на относительно более мощный флот и торговую сеть, раскинутую по всему миру, Великобритания возглавила международный порядок. 'Pax Britannica', начавшийся тогда — эпоха, когда Британская империя выступала арбитром в основных мировых конфликтах и сохраняла мир, — помнится как ее величайший период.\n\nЗолотой век, наступивший после Наполеоновских войн, позволил Британской империи пережить свое лучшее время, но почти полное отсутствие войн в тот период привело к тому, что британцы пропитались миром. Британская империя наслаждалась славными временами. Величие Империи было явлено всему миру: Гонконг, Австралия, Новая Зеландия, Канада и, за их пределами, гигантская жемчужина по имени Индия украшали корону Британской империи.\n\nГод за годом Британская империя — которая вместе с Францией фактически делила мир надвое — унаследовала от Испании прозвище 'империя, над которой никогда не заходит солнце'. Казалось, ее величие будет длиться вечно."
  ENG_country_intro_content_1: "Но всему приходит конец. Могущество Британской империи тоже начало понемногу колебаться. Великобритания, победившая Наполеона и доминировавшая в Европе, со временем начала сталкиваться с вызовом новых великих держав. В особенности после того, как Пруссия добилась объединения и образовала Германскую империю, Германия быстро нарастила свою национальную мощь и наступала на пятки Британской империи. 'Мировая политика (Weltpolitik)', проводимая кайзером Вильгельмом II, демонстрировала империалистические амбиции и пыталась перекроить порядок в Европе и мире. Подъем Германии был настолько угрожающим, что подтолкнул Британию взять за руку своего исторического соперника, Францию.\n\nВ конце концов этот конфликт постепенно обострялся и вылился в трагическую катастрофу Первой мировой войны — Великой войны. Конфликт опустошил Европу и планету и унес бесчисленные жизни, нанеся огромный урон основным державам, включая Британию. Британская империя также потеряла множество солдат, а финансовое и экономическое бремя войны взлетело до небес. Это серьезно поколебало престиж Империи и поставило ее в положение, когда она больше не могла поддерживать ту же подавляющую мощь, что и раньше.\n\nИ все же Британская империя выдержала кризис. Благодаря своим обширным колониям по всему миру и все еще прочной экономической базе ей удалось сохранить относительно стабильное положение даже во время Великой депрессии после Великой войны. Но шрамы войны оставили глубокий след в британском обществе и экономике. Огромные ресурсы и рабочая сила, потребленные во время войны, и возникшее в результате налоговое бремя постепенно ослабляли Британию. Поэтому Британская империя начала занимать все более пассивную позицию в отношении войны, и ее лидерство на мировой арене также постепенно ослабевало."
  ENG_country_intro_content_2: "То, что нанесло удар в спину Британской империи, развевавшей свой флаг по всему миру, было не чем иным, как чужаками, внезапно появившимися. Они разгромили Европу, и Британия не стала исключением. Увидев, как Лондон пал перед этими пришельцами, называющими себя Kaiser Corporation, и как европейские страны рушатся, граждане Британской империи — без различия между политиками и простыми людьми — поднимаются против них.\n\nНо судьба Британской империи подобна масляной лампе на ветру. Видя, как тиран по имени Британия шатается, колонии, символизировавшие ее величие, жадно ищут возможность вырваться из этих цепей. Разница в мощи между Kaiser Corporation и британской армией посеяла в британцах семя отчаяния.\n\nБританские острова, не подвергавшиеся иностранным вторжениям со времен нормандского завоевания, снова погружаются в хаос. Может быть, сейчас для них не видно никакой надежды, но под именем Британии солдаты возьмут в руки винтовки и будут сражаться с пришельцами до конца."