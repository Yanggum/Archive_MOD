  uk_btn_desc: "§YGUI состояния правительства в изгнании§!"
  uk_btn_desc_desc: "Простите, функция GUI еще не готова. Не могли бы вы подождать, пока я ее закончу..?"

  ENG_king_edward_name: "Его Величество, всемилостивейший, $ENG_king_edward$"
  ENG_king_george_v_name: "Его Величество, всемилостивейший, $george_v$"
  BA_king_name_tt: "[BA_King_name]"
  BA_king_desc_tt: "[BA_king_desc]"
  BA_King_Edward_name: "Божьей милостью, §tВеликобритании§!, §GИрландии§! и §RБританских заморских доминионов§!; §YЗащитник Веры§!; §gИмператор Индии§!; Его Величество §YКороль $ENG_king_edward$§!"
  BA_King_Edward_desc: "§L$ENG_king_edward$ родился в конце XIX века в уважаемом королевском доме. С рождения он взял на себя важную роль как член королевской семьи и с юных лет путешествовал по многим странам, знакомясь с различными культурами. Этот опыт оказал огромное влияние на расширение его кругозора как будущего лидера.\n\nС юности $ENG_king_edward$ в полной мере осознавал ответственность и обязанности наследника престола. В частности, он проявлял большой интерес к социальным проблемам и международным отношениям и благодаря этому готовился стать лидером будущего. Во время военной службы он на деле доказал свою верность и преданность стране, завоевав тем самым большое доверие народа.\n\nС течением времени $ENG_king_edward$ все острее чувствовал бремя престолонаследия и вел жизнь, посвященную стране и ее народу. В этот период он участвовал в различных мероприятиях и, как член королевской семьи, оставался близок к народу, много для него стараясь.\n\nЭта самоотверженная деятельность $ENG_king_edward$ оставила глубокое впечатление в массах и снискала ему огромное уважение со стороны населения. С чувством долга лидера и глубокой привязанностью к народу, $ENG_king_edward$ будет принимать важные решения, готовя будущее Королевства.§!"
  BA_King_George_name: "Божьей милостью, §tВеликобритании§!, §GИрландии§! и §RБританских заморских доминионов§!; §YЗащитник Веры§!; §gИмператор Индии§!; Его Величество §Y$george_v$§!"
  BA_King_George_desc: "§L$george_v$ родился в уважаемом королевском доме и с детства глубоко усвоил традиции и обязанности королевской власти. Он приобрел разнообразный опыт как член королевской семьи и естественным образом развил качества лидера. В частности, в юности он служил на флоте, на деле доказав свою преданность и верность стране.\n\n$george_v$ серьезно относился к обязанностям наследника престола. Он желал быть лидером, близким к народу, и прислушиваться к его голосу и неустанно к этому стремился. Он встречался с людьми из всех слоев общества, чтобы понимать дела королевства и искать решения, утвердившись тем самым как достойный доверия лидер.\n\nВзойдя на трон, $george_v$ посвятил себя стабилизации страны и проведению политики во благо населения. Он также сыграл важную роль в дипломатии, повышая престиж королевства в международном сообществе. $george_v$ превыше всего ценил процветание королевства и безопасность народа и отдал все свои способности для этого.\n\nТак $george_v$ получил глубокое уважение и любовь народа и выполнил свои обязанности лидера. Эта преданность и усилия внесли огромный вклад в стабильность и развитие королевства, и его достижения будут помнить грядущие поколения.§!"

