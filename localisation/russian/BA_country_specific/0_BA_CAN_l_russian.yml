  impindia.4.t: "Расширение Стрезского фронта?"
  impindia.4.d: "Сегодня предложение [ENG.GetLeader] было официально доставлено в [ROOT.Capital.GetCapitalVictoryPointName]. Содержание его не что иное, как предложение расширить Стрезский фронт, который на практике был нейтрализован. Если мы примем этот план расширения, мы возьмем на себя ключевую роль в общем анти-Кивотос фронте и сможем стать центральной осью, ведущей солидарность наций Земли. Кроме того, мы сможем расширить военный и экономический союз и продвигать общеевропейские ценности."
  impindia.4.a: "Примем предложение"
  agree_of_stresa_front_tt: "Если §Yмы примем предложение§!, через несколько дней мы присоединимся к §YСтрезскому фронту§! под руководством стороны [ENG.GetAdjective]."
  impindia.4.b: ""

  impindia.5.t: "[FROM.GetName] поддержал расширение Стрезского фронта!"
  impindia.5.d: "Это действительно отличные новости! Сторона [FROM.GetAdjective] согласилась с нашим предложением и продвинула Стрезский фронт. Теперь мы официально подтвердили, что это военный и экономический союз."
  impindia.5.a: "Хорошие новости!"

  impindia.6.t: "[FROM.GetAdjective] отклонил расширение Стрезского фронта"
  impindia.6.d: "К сожалению, сторона [FROM.GetCapitalVictoryPointName] отклонила наше предложение."
  impindia.6.a: "А, они это отклонили? хахаха"

  impquebec.1.t: "Квебек в огне"
  impquebec.1.d: "После Великой депрессии недовольство провинции Квебек, которое медленно подавлялось, превратилось в открытую социальную проблему в результате этого Великого Перехода и массовой эпидемии. В частности, дискриминационные действия, совершенные в Квебеке изгнанниками, прибывшими из Великобритании, разожгли гнев горожан, и так вспыхнули масштабные протесты. Квебекцы вышли на улицы, и улица Сент-Катрин в Монреале заполнилась разгневанными толпами. Они выдвигают лозунги яростной оппозиции не только премьер-министру, но и Королю.\n\nЭто напоминает Кризис призыва 1917 года, но на этот раз терпение франкоязычных канадцев, кажется, достигло предела. \"Должны ли мы снова проливать французскую кровь ради британцев?!\" — воскликнул вице-губернатор Квебека перед толпой, собравшейся в городе Квебеке. \"Мы говорим — нет! Но они говорят, что мы должны! Пока Квебек остается комнатной собачкой британских политиков, мы никогда не сможем освободиться от их тирании!\""
  impquebec.1.a: "Я должен был знать, что это случится"

  impblack.0.t: "Экономическая ситуация в Канаде"
  impblack.0.d: "Экономическая ситуация в Канаде в настоящее время переживает серьезный кризис. Последствия Великой депрессии все еще сохраняются, задерживая восстановление; высокая безработица и рост цен делают жизнь населения все труднее. Вдобавок к этому, после краха британской метрополии многочисленные изгнанники вошли в Канаду, еще больше увеличив налоговое бремя государства. В результате правительство с трудом распределяет ограниченные ресурсы, и неопределенность во всей экономике растет.\n\nКанада теперь несет бремя стабилизации экономики: решение проблем Великой депрессии и облегчение дополнительного налогового бремени, вызванного изгнанниками."
  impblack.0.a: "Какая головная боль"

  impblack.1.t: "$CAN_create_national_employment_commission$"
  impblack.1.desc: "Разворачивая утреннюю газету, мистер Филлипс пробежал глазами по заголовкам с настроением, полным разочарования. Безработица, вызванная Великой депрессией, была знакомым ему словом, но он все еще не мог найти выхода. Фабрика, на которой он так долго проработал, закрылась годы назад, и с тех пор он снова и снова пытался найти работу, но каждый раз терпел неудачу. Однако в тот день маленькая заметка в углу газеты привлекла его внимание.\n\n\"Национальная комиссия по занятости, первый шаг к решению проблемы безработицы в национальном масштабе.\"\n\nОн спокойно прочитал статью. Там говорилось, что комиссия будет исследовать проблему безработицы и будет иметь функцию рекомендации на правительственном уровне мер по созданию рабочих мест. У мистера Филлипса зародилась надежда, что, возможно, на этот раз все будет по-другому. Статья подчеркивала, что через комиссию правительство готовит планы по продвижению общественных работ и, таким образом, по предоставлению занятости.\n\nНесколько дней спустя он решил пойти в Национальную комиссию по занятости. Он все еще нервничал, но, по крайней мере, стоило попытаться. Офис комиссии был намного больше и организованнее, чем он ожидал. Открыв дверь и войдя, персонал любезно встретил его и спокойно спросил, какая помощь ему нужна. Это тепло дало ему странное чувство облегчения.\n\nКонсультант внимательно выслушал опыт и ситуацию Тревора и порекомендовал ему подходящую программу общественных работ: работы по строительству общественной инфраструктуры, такие как ремонт мостов или расширение дорог. Мистер Филлипс понимал, насколько важна такая работа. Это было не просто средство к существованию; это означало возможность снова вносить вклад в общество.\n\nНесколько недель спустя мистер Филлипс начал новую работу. Поначалу это казалось ему странным и трудным, но каждое утро, направляясь на стройплощадку, он чувствовал, что возвращает себе энергию жизни. Расширять дороги и строить мосты вместе с товарищами было утомительно, но в этом процессе он снова ощутил чувство достижения, которое потерял давным-давно.\n\nОднажды во время перерыва, попивая кофе и беседуя с товарищами..."
  impblack.1.a: "\"Благодаря Национальной комиссии по занятости мы смогли собраться вот так все вместе.\""

  impblack.2.t: "$CAN_social_security_system$"
  impblack.2.desc: "Мистер Майкл, получив серьезную травму в результате несчастного случая на производстве, почувствовал отчаяние, словно все рухнуло. Несчастный случай на работе, где он проработал много лет, не только повредил его тело: он отнял у него средства к существованию и даже надежду на будущее. Медицинские счета накапливались, и его реальность — невозможность работать — была подобна туннелю без выхода. Его взгляд на мир постепенно мрачнел, он был охвачен тревогой и страхом, что никогда не сможет подняться снова.\n\nНо однажды он узнал новость о новой системе социального обеспечения, введенной правительством. Эта система предоставляла экономическую поддержку в течение определенного периода безработным или тем, кто из-за несчастных случаев больше не мог работать. Поначалу он не был уверен, насколько сильно это сможет ему помочь, но со временем начал понимать ее значение.\n\nБлагодаря социальному обеспечению ему больше не приходилось день за днем беспокоиться о выживании. Пособие, маленькое, но постоянное, постепенно стабилизировало его жизнь, и спустя долгое время он обрел некоторое спокойствие. Мистер Майкл начал лелеять надежду, что может снова встать на ноги. Он решил не сдаваться.\n\nОн возобновил поиски работы. Его тело еще не полностью восстановилось, но он был полон решимости: он должен был бороться за лучшее будущее. С надеждой вернуться в общество как его член, он отправился на поиски возможностей.\n\nТеперь перед мистером Майклом стояла новая задача. В его глазах снова зажегся свет, и он был готов двигаться к будущему."
  impblack.2.a: "\"Мистер Майкл. Приступайте к работе с завтрашнего дня.\""

  impblack.3.t: "$CAN_banking_reform$ - 1"
  impblack.3.desc: "По мере углубления Великой депрессии в Канаде отчаяние распространялось повсюду. Многие потеряли все свои сбережения в банках, а фермеры все глубже погружались в долги из-за прекращения кредитования. Держась за старые инструменты, они едва поддерживали свое существование; с течением времени они впадали в еще большее уныние. Тревога нависла над всей Канадой, включая сельскую местность, и их надежда угасала.\n\nВ этой ситуации премьер-министр Маккензи Кинг больше не мог оставаться в стороне. Он решил начать банковскую реформу, чтобы спасти банки на грани банкротства и вернуть доверие народа. Исправление финансовой системы было необходимой мерой для стабилизации экономики. Опасаясь, что крах банков потрясет всю экономику, Кинг принял решение.\n\nРеформа только начиналась, но постепенно ощущались перемены. Некоторые банки открылись вновь, и фермеры, хотя и с трудом, смогли получить необходимые средства. С осторожным ожиданием они подняли свои маленькие стаканы, понимая, что им больше не придется полагаться только на старые инструменты."
  impblack.3.a: "У них даже не было денег купить сельскохозяйственные инструменты!"

  impblack.4.t: "$CAN_banking_reform$ - 2"
  impblack.4.desc: "Мистер Франклан несколько дней пытался связаться с банком. Его малый и средний бизнес был на грани краха, и он думал, что банковский кредит — его последняя надежда. Но и этот день не был исключением.\n\n\"Почему, черт возьми, нельзя?\" — спросил он отчаянным голосом. Он пытался уже несколько раз, и ответ всегда был одинаковым.\n\nСотрудник банка осторожно ответил: \"Извините, мы тоже делаем все возможное. Но... сейчас трудно предоставить кредит\".\n\nС этими словами мистер Франклан лишился дара речи. Повесив трубку, его охватило глубокое разочарование: мысль о том, что его компания может обанкротиться, промелькнула у него в голове. Страх увидеть, как в одно мгновение рушится компания, которую он строил так долго, стал реальным. Лица его сотрудников и обещания многочисленным клиентам пронеслись у него в голове. Он ничего не мог сделать, кроме как погрузиться в бессилие.\n\nЧерез несколько дней наступил судьбоносный день. Зазвонил телефон. Мистер Франклан медленно поднял трубку.\n\n\"Алло, мистер Франклан?\" — раздался голос сотрудника банка. \"Кредит одобрить стало возможным\".\n\nВ этот момент мистер Франклан замолчал, словно не мог в это поверить. Новость, которую он так долго ждал, пришла в самый тяжелый момент. Он все еще не мог чувствовать себя полностью спокойно, но, узнав, что его компания избежала кризиса банкротства, он почувствовал глубокое облегчение."
  impblack.4.a: "Ну и слава богу!"

  impblack.5.t: "$CAN_banking_reform$ - 3"
  impblack.5.desc: "Канадское правительство сделало банковскую систему более безопасной, значительно усилив финансовое регулирование после Великой депрессии. Эти меры внушили инвесторам и вкладчикам уверенность в том, что их деньги защищены. В частности, усиленное регулирование снизило принятие банками чрезмерных рисков и ограничило необдуманное кредитование, повысив стабильность финансовой системы. В результате финансовые институты начали работать в соответствии с более осторожной инвестиционной и кредитной политикой, что оказало положительное влияние на рынок в целом.\n\nЭти изменения предложили более безопасную финансовую среду не только для частных лиц, но и для предприятий. Благодаря стабильной системе предприятия смогли вести предсказуемое финансовое управление, что также способствовало общему экономическому росту.\n\nТак простые люди, кладя деньги в банк или инвестируя, больше не испытывали прежней тревоги и обрели большую уверенность."
  impblack.5.a: "\"Наши деньги в безопасности... какое облегчение.\""

  impblack.6.t: "Преодоление Великой депрессии"
  impblack.6.desc: "Паники больше нет. Благодаря упорным усилиям нашего правительства основные экономические показатели вернулись к нормальному курсу, и народ наконец вернул повседневную жизнь и стабильность, бывшие до Великой депрессии. Никакая внешняя угроза больше не сможет нас поколебать. Мы выстояли и, наконец, преодолели это."
  impblack.6.a: "Сегодня, по крайней мере, мы должны поднять тост."

  impblack.15.t: "Трудности фермеров"
  impblack.15.desc: "Канада столкнулась с тройной катастрофой: засуха, падение цен на зерно и Великая депрессия. С падением потребления фермеры оказались еще более раздавлены долгами, которые у них уже были до Депрессии, что привело к ситуации, когда они даже не могли нормально производить зерно. Банкротство становится неизбежной реальностью. Падение доходов из-за неурожая означает, в конечном счете, что они могут потерять свои земли."
  impblack.15.a: "Нет никого, кому бы не было трудно."
  impblack.15.b: "Попробуем начать списание долгов."

  impblack.10.t: "Дебаты"
  impblack.10.d: "Программа федерально-провинциального сотрудничества — это структура сотрудничества, в которой федеральное правительство координирует провинциальные политики и направляет их в лучшее русло. Однако эти программы — палка о двух концах. Если произойдет проблема или инцидент, федеральному правительству будет трудно избежать ответственности за провинциальные провалы, что может усилить недоверие к федеральному правительству. И наоборот, если федеральное правительство не вмешивается в провинциальную политику, также существует вероятность, что провинциальные правительства будут коррумпированы или не смогут должным образом выполнять свои задачи.\n\nПо этим причинам некоторые эксперты рекомендуют осторожно управлять этими программами и контролировать их. В то время как одна позиция утверждает, что все провинциальные политики должны строго контролироваться и исправляться, министры, поддерживающие свободный рынок, утверждают, что вмешательство правительства должно быть минимальным и следует позволить провинциям функционировать автономно."
  impblack.10.a: "Отправим наблюдателей."
  impblack.10.b: "Будем контролировать и управлять напрямую."

  impblack.11.t: "Направление политики"
  impblack.11.d: "Сотрудничая с провинциальными правительствами, мы столкнулись с вопросом о том, как определить курс политики. Теперь мы должны решить, где и как мы будем проводить политику."
  impblack.11.a: "Сосредоточимся на бюрократических проблемах."
  impblack.11.b: "Инвестируем в развитие региональной промышленности."
  impblack.11.c: "Инвестируем в региональные исследовательские центры."

  completed_CAN_from_federal_proincial_coop_tt: "В этом регионе появляются результаты программы федерально-провинциального сотрудничества, и они принесут благотворные эффекты."

  impblack.12.t.hospital: "Расширение системы здравоохранения"
  impblack.12.d.hospital: "Сегодня больница открыла свои двери. Плод поддержки федерального правительства и сотрудничества провинциального правительства наконец предстал перед нашими глазами. Давняя мечта жителей сбылась, и новая больница будет играть ключевую роль в предотвращении проблем со здоровьем в сообществе. Это не просто открытие: это первый шаг к тому, чтобы сделать жизнь людей безопаснее и благополучнее. Качество жизни заметно улучшилось, и эти изменения продолжатся и впредь."
  impblack.12.t.school: "Новая школа открывает двери"
  impblack.12.d.school: "Сегодня школа открыла свои двери. Плод поддержки федерального правительства и сотрудничества провинциального правительства наконец предстал перед нашими глазами. Давняя мечта жителей сбылась, и новая школа будет играть важную роль в решении образовательных проблем сообщества. Это не просто открытие образовательного учреждения: это первый шаг к тому, чтобы сделать будущее людей светлее и благополучнее. Качество образования заметно улучшилось, и эти изменения продолжатся и впредь."
  impblack.12.t.housing: "Программа обеспечения жильем"
  impblack.12.d.housing: "Проект обеспечения жильем, инициированный местным провинциальным правительством, приносит заметные изменения. Благодаря этому проекту количество бездомных в регионе заметно сократилось, и, благодаря созданию стабильной жилой среды, качество жизни жителей также значительно улучшилось. В их повседневной жизни тревога и боль медленно исчезают, и на их место приходят новая надежда и облегчение. Иметь дом — это не просто получить крышу над головой: это заложить основу для восстановления жизни. В результате патриотизм жителей углубился, и их чувство ответственности по отношению к сообществу также выросло."
  impblack.12.t.gun: "Расширение военной промышленности"
  impblack.12.d.gun: "Согласно плану провинциального правительства, в регионе был построен завод по производству военных поставок. Создание этого завода выходит за рамки простого возведения сооружения: оно дало новую надежду бесчисленным людям, потерявшим работу и скитавшимся без цели. Безработица заметно снизилась, и региональная экономика начала восстанавливать свою жизненную силу. Завод стал местом поддержания жизни и в то же время символом, вдыхающим новые возможности в сообщество."
  impblack.12.t.min: "Промышленное расширение"
  impblack.12.d.min: "Некоторые города добились столь впечатляющей индустриализации, что их уже можно назвать центром местной промышленной революции. Прочная промышленная база, обилие квалифицированной рабочей силы и решимость проницательного руководства, смотрящего в будущее, подтолкнули эти регионы к устойчивому развитию. Тысячи людей потеют среди заводских станков, и продукты, рождающиеся из их рук, непрерывно текут по производственным линиям. То, что здесь течет, — это не только капитал и товары, но и мощная сила, движущая рост и трансформацию всего общества. Дым, идущий из труб, стал символом процветания, и все это — живое доказательство того, что экономическая политика, которую мы развернули, успешно пустила корни."
  impblack.12.t.failure_1: "Провал политики провинциального правительства!"
  impblack.12.d.failure_1: "Политика провинциального правительства приняла неожиданный оборот, и результат оставил глубокие раны в местном сообществе. Столкнувшись с этим, федеральное правительство больше не могло оставаться наблюдателем и было вынуждено вмешаться с помощью экстренных спасательных мер. Ситуация уже достигла критической точки, и необходимо было действовать быстро, чтобы исправить проблему."
  impblack.12.t.failure_2: "Провинциальное правительство охвачено скандалом о хищениях!"
  impblack.12.d.failure_2: "Подход невмешательства к экономическому развитию принес видимые результаты, но тень нависла над его обратной стороной. В условиях слабого регулирования значительная часть произведенного богатства, непреднамеренно, попадает в руки мошенников. Недавно некоторые богатые торговцы использовали свои огромные активы, чтобы купить местную власть, и в этом процессе средства провинциального правительства потекли в невидимые места. Прежде чем переступить черту закона, они организовали гигантское хищение и смогли подорвать основы региональной экономики. Но это лишь верхушка айсберга. Мы дошли до того момента, когда должны бороться с этой коррупцией и освободиться от этого темного влияния."

  ENG_UK_exile_support_idea: "§YГнев консерваторов§! в настоящее время [CAN_british_anger_level]."
  ENG_UK_exile_support_idea_tt: "£GFX_decision_tooltip_eng_exlie\n\n\n\n\n\n\n§YГнев консерваторов§! представляет текущий гнев Консервативной партии по отношению к действующему правительству.\n\nЕсли гнев высок, вы получите штрафы к §Yизменению популярности партии и стабильности§! и к §Yорганизации дивизий§!."
  ENG_people_support_idea: "§YГнев народа§! в настоящее время [CAN_people_anger_level]."
  ENG_people_support_idea_tt: "£GFX_decision_tooltip_people\n\n\n\n\n\n\n§YГнев народа§! представляет текущий гнев канадского народа по отношению к правительству.\n\nЕсли гнев высок, вы получите штрафы к §Yстабильности§! и к §Yпроизводству фабрик§!."
  ENG_Canada_Government_support: "§YГнев Либеральной партии§! в настоящее время [CAN_parliament_anger_level]."
  ENG_Canada_Government_support_idea_tt: "£GFX_decision_tooltip_can\n\n\n\n\n\n\n§YГнев Либеральной партии§! представляет текущий гнев Либеральной партии по отношению к правительству.\n\nЕсли гнев высок, вы получите штрафы к §Yежедневной стоимости политической власти§! и к §Yизменению фабрик товаров народного потребления§!."

