  # Канада / Британское правительство в изгнании

  FOCUS_ICON_SET_BRILLIANT_KEY_FOCUS: "Выдающееся превосходство"
  ENG_canada_officer: "Офицер канадского происхождения"
  ENG_canada_officer_desc: "§LЭтот генерал родился в Канаде. Когда реконкиста метрополии увенчается успехом, он вернется на родину.§!"

  ## Канадские фокусы
  ENG_canada_route_flag: "Мы продвигаемся по пути §YАвтономной Канады§!."
  CAN_kings_speech: "Речь Короля"
  CAN_kings_speech_desc: "В условиях чрезвычайной ситуации в канадской политике принц Уэльский Эдуард взошел на трон как Король. Соответственно, вся Империя ожидает радиообращения монарха. Ожидается, что в этом обращении Король объявит будущее направление канадского правительства."
  CAN_check_the_economy: "Проверить экономическую ситуацию"
  CAN_check_the_economy_desc: ""
  IMP_crown_corporations: "Коронные корпорации"
  IMP_crown_corporations_desc: "Чтобы предоставлять основные услуги и обеспечить более стабильное прогнозирование экономического и промышленного роста, Соединенное Королевство должно поощрять новые коронные корпорации. Это должны быть проекты, управляемые правительством и Королевским домом, свободные от частного вмешательства."
  IMP_national_research_facility: "Национальные исследовательские центры"
  IMP_national_research_facility_desc: ""
  CAN_government_unity: "Судьба Парламента"
  CAN_government_unity_desc: ""
  IMP_collapse_of_imperial_hegemony: "Крах имперской гегемонии"
  CAN_Quebec_problem: "Проблема Квебека"
  CAN_Quebec_problem_desc: ""
  CAN_depression_recovery: "Преодоление Великой депрессии"
  CAN_depression_recovery_desc: ""
  CAN_upper_class_persuasion: "Убедить высший класс"
  CAN_vaccination: "Лечение Британской болезни"
  CAN_vaccination_desc: "Эпидемия, возникшая во время 'Великого Исхода', сделала наше общество больным."
  CAN_create_CBC: "Основание CBC"
  CAN_create_CBC_desc: "Было представлено предложение расширить Канадскую комиссию по радиовещанию в подлинную национальную сеть под названием CBC (Canadian Broadcasting Corporation). Это поможет объединить разделенную страну и ограничить влияние потенциально подрывных иностранных передач."
  CAN_supply_the_impire: "Снабжение для Империи"

  CAN_canada_neutrality: "Первый мир"
  CAN_canada_neutrality_desc: "Канада больше не может проводить внешнюю политику, зависимую от наций Кивотоса или традиционных держав, таких как [SOV.GetAdjective]. Теперь мы должны установить независимую дипломатию. Ответ — Первый мир."
  CAN_north_american_defense_alliance: "Объединенный комитет обороны Северной Америки"
  CAN_montreal_lab_cooperation: "Сотрудничество с Монреальской лабораторией"
  CAN_shadow_factory: "Завод-дублер"
  CAN_commonwealth_air_training: "Совместная авиационная подготовка Содружества"
  CAN_stresa_front: "Стрезский фронт"

  CAN_Imperial_conference_held: "Проведена Имперская конференция"
  CAN_extraction_industry: "Добывающая промышленность"
  CAN_national_defense_act: "Принятие Закона о национальной обороне"
  CAN_prepare_for_the_coming_wars: "Готовиться к грядущим войнам"
  CAN_war_measures_act: "Принятие Закона о чрезвычайных мерах военного времени"

  # Фокусы Черчилля
  winston_churchill_is_leader_flag: "Мы продвигаемся по пути §YУинстона Черчилля§!."
  IMP_Ministry_of_war: "Учредить Контрольный комитет"
  IMP_Change_to_Ration: "Ввести нормирование"
  IMP_military_industry_expansion: "Расширение военной промышленности"
  IMP_mass_mobilization: "Массовая мобилизация"
  IMP_military_industry_expansion_2: "Поглотить канадскую военную промышленность"
  IMP_defense_research_grants: "Расширить исследовательские центры"
  IMP_if_day: "$CAN_if_day$"
  IMP_if_day_desc: "Канадцы не воспринимают серьезную угрозу иностранного господства. Поэтому мы должны представить, что [KAI.GetName] вторгается в Виннипег. Это увеличит выпуск военных облигаций на пути к победе."
  CAN_control_canada_parliament: "$ENG_no_further_appeasement$"

  # Конец Черчилля

  # Фокусы Маккензи Кинга
  mackenzie_king_is_leader_falg: "Мы продвигаемся по пути §YМаккензи Кинга§!."
  CAN_Canada_new_deal: "Канадский план общественных работ"
  CAN_Canada_new_deal_desc: "Правительство Маккензи Кинга активно продвигает политику создания рабочих мест посредством крупных проектов общественных работ. Эти программы направлены на снижение безработицы и оживление экономики за счет инфраструктурных проектов, таких как дороги, мосты и плотины."
  CAN_infrastructure_effort: "Расширение Канадской национальной железной дороги"
  CAN_infrastructure_effort_desc: "Железнодорожная сеть — это жизненная артерия Канады, практически синоним Канадской национальной железной дороги. Ее расширение укрепит страну и продемонстрирует ее ценность, когда наступит время осуществлять поставки и военные перевозки в национальном масштабе."
  CAN_create_national_employment_commission: "Национальная комиссия по занятости"
  CAN_create_national_employment_commission_desc: "Основанная в 1936 году, Национальная комиссия по занятости была создана для решения серьезной проблемы безработицы, затрагивающей всю Канаду. Она всесторонне исследует ситуацию с занятостью и предлагает рекомендации для правительства по реализации эффективных программ создания рабочих мест, играя ключевую роль в экономическом восстановлении."
  CAN_Federal_Provincial_Cooperative_Programs: "Программы федерально-провинциального сотрудничества"
  CAN_Federal_Provincial_Cooperative_Programs_desc: "Правительство Маккензи Кинга усиливает сотрудничество между федеральным правительством и провинциями для борьбы с Великой депрессией. В рамках этих программ осуществляется тесное взаимодействие в таких областях, как помощь по безработице, жилье, поддержка сельского хозяйства и других."
  CAN_social_security_system: "Система социального обеспечения"
  CAN_social_security_system_desc: "Правительство постепенно вводит систему социального обеспечения. Такая политика, как страхование по безработице, обеспечит стабильность граждан и снизит экономическую неопределенность, закладывая основы будущего канадского государства всеобщего благосостояния."
  CAN_banking_reform: "Банковская реформа"
  CAN_banking_reform_desc: "Правительство Маккензи Кинга стремится к финансовой стабильности посредством реформы канадской банковской системы. В частности, Банк Канады, основанный в 1935 году, играет центральную роль в стабилизации финансовых рынков и денежно-кредитной политики."

  # Конец Маккензи Кинга

  CAN_Strengthen_cohesion: "Усилить сплоченность Содружества"
  CAN_Strengthen_cohesion_desc: "Усилить сплоченность Содружества"
  CAN_public_works: "Создать федеральные лагеря помощи"
  CAN_public_works_desc: "Последствия Великой депрессии все еще сохраняются, и многочисленные безработные по-прежнему находятся в ловушке бедности или толкаются к преступности. Лучший вариант — собрать их в 'федеральных лагерях помощи', где они будут получать зарплату и питание и использоваться как готовая рабочая сила по всей стране."
  IMP_canada_wheat_board: "Канадский пшеничный совет"
  IMP_national_housing_act: "Национальный закон о жилье"
  IMP_national_housing_act_desc: "Жилье — это базовая потребность и ключевой источник экономической активности. Стимулируя строительство и покупку жилья, создается спрос в ключевых отраслях промышленности и стимулируется расширение экономики."
  IMP_industrial_country: "Национальный арсенал"

  # Политическая ветка
  CAN_concessions_to_workers: "Уступки рабочим"
  CAN_labor_act: "Реформа трудового законодательства"
  CAN_collaboration_with_fascist_movement: "Синие рубашки"
  CAN_strike_suppression: "Подавление забастовок"

  # Конец политической ветки

  IMP_by_parliament: "£GFX_CAN_parliament_small §Lот §!§Lканадского парламента§! $we_will_gain_tt$\n"
  IMP_by_uk_exile: "£GFX_CAN_exile_uk_small §Lот §!§Lбританских изгнанников§! $we_will_gain_tt$\n"
  IMP_by_people: "£GFX_CAN_people_small §Lот §!§Lнарода§! $we_will_gain_tt$\n"

  IMP.0.t: "Коронация Эдуарда VIII"
  IMP.0.desc: "Его Величество Король Эдуард VIII — первый британский монарх, чья коронация прошла за пределами Вестминстерского аббатства. Королевские распорядители подготовили вместо этого тщательно продуманную церемонию в Кафедральном соборе Крайст-черч, крупнейшем англиканском соборе Оттавы. Архиепископ Кентерберийский, бежавший из Соединенного Королевства, совершил обряд в соответствии с традицией, в то время как бесчисленные СМИ внимательно наблюдали за этим.\n\nСразу после коронации Его Величество появился не на балконе Букингемского дворца, а на балконе Ридо-холла, нынешней официальной резиденции Королевской семьи, и был восторженно встречен канадцами."
  IMP.0.a: "Этого достаточно для вполне легитимной коронации!"
  ENG_coronation_of_edwards: "$ENG_king_edward$ завершил свою коронацию"

  IMP.1.t: "Речь Короля"
  IMP.1.desc: "Приближается решающий момент, когда Король Эдуард подготовит свою первую радиообращение к Империи. Монарх должен тщательно обдумать, какое послание передать в этом обращении. Британские изгнанники хотят, чтобы он твердо провозгласил волю отвоевать метрополию, но Парламент и граждане Канады предпочитают более умеренный подход. Они считают, что, поддерживая премьер-министра Канады или умеренного лидера, важно усилить сплоченность наших доминионов и поддерживать стабильность.\n\nВремя речи вот-вот наступит. Мы должны быстро принять решение."
  IMP.1.a: "Поддержим консерваторов"
  IMP.1.b: "Поддержим Либеральную партию"
  you_can_see_ENG_gui: "Теперь вы можете получить доступ к GUI правительства в изгнании."

  IMP.2.war.t: "Король Эдуард провозгласил реконкисту метрополии!"
  IMP.2.neu.t: "Король Эдуард произнес умеренную и всеобъемлющую речь!"
  IMP.2.gov.t: "Король Эдуард поддержал Либеральную партию"
  IMP.2.d.war: "Посредством своего радиообращения Король Эдуард обратился с посланием ко всей Канаде: от Ванкувера до Сент-Джонса, от Торонто до Арктики. Монарх резко осудил Kaiser Corporation и с силой провозгласил свою железную решимость положить конец войне, начатой его отцом, и в конечном итоге вернуть Соединенное Королевство.\n\nРечь, делавшая акцент на лидерстве, получила поддержку блока британских изгнанников и придала большой импульс силам сопротивления на островах. Однако в то же время она сеет беспокойство среди Канады и других доминионов, повышая напряженность."
  IMP.2.d.gov: "Посредством своего радиообращения Король Эдуард передал послание всей Канаде. От Ванкувера до Сент-Джонса, от Торонто до Арктики, канадцы были глубоко впечатлены умеренной и величественной речью, которая ставила во главу угла сотрудничество и сплоченность между доминионами и подчеркивала важность стабильности.\n\nЭта речь дала Канаде и другим доминионам возможность сохранить стабильность и единство. Однако среди британских изгнанников она вызвала реакцию ниже их ожиданий."
  IMP.2.d.neu: "Посредством своего радиообращения Король Эдуард передал важное послание народу и стране. От Ванкувера до Сент-Джонса, от Торонто до Арктики, канадцы энергично откликнулись на величественную и сильную речь, которая, подтверждая волю отвоевать метрополию, в то же время подчеркивала стабильность и сплоченность доминионов.\n\nРечь получила положительный отклик как от изгнанников, так и от доминионов, но не оставила более сильного впечатления. Это может вызвать сомнения в лидерстве монарха."
  IMP.2.a: "Да здравствует!"

  IMP.3.t: "Последствия речи"
  IMP.3.desc: "Речь Эдуарда VIII не смогла удовлетворить всех. В результате некоторые люди начали намеренно преувеличивать и тенденциозно интерпретировать определенные части речи, распространяя их в обществе..."
  IMP.3.a: "Это..."
  CAN_anger_change_tt_1: "Речь в поддержку Либеральной партии приносит пользу Либеральной партии."
  CAN_anger_change_tt_2: "Речь в поддержку Либеральной партии вредит Консервативной партии."
  CAN_anger_change_tt_3: "Провозглашение реконкисты метрополии вредит Либеральной партии."
  CAN_anger_change_tt_4: "Провозглашение реконкисты метрополии вредит канадскому народу."
  CAN_anger_change_tt_5: "Провозглашение реконкисты метрополии приносит пользу Консервативной партии."
  CAN_imp_3b_people_tt: ""

  IMP.4.t: "$ENG_stanley_baldwin$ просит об отставке"
  IMP.4.desc: "Сегодня сэр Стэнли Болдуин принял решение уйти в отставку с поста премьер-министра. За последние несколько дней Европа погрузилась в непрекращающийся хаос. Крах Германии и Франции глубоко потряс мир, и Соединенное Королевство также не смогло избежать этого ужасного кризиса. Британская метрополия подверглась внезапной атаке из иного мира и была вынуждена объявить о капитуляции; в результате правительство Британской империи было вынуждено бежать в Канаду.\n\nПремьер-министр Болдуин сделал все, что мог, ведя Соединенное Королевство в этот кризисный момент. Но усталость и перенапряжение, накопившиеся в условиях непрерывного кризиса и неразберихи, в конце концов подорвали его здоровье, вынудив принять решение оставить пост.\n\nЕго лидерство и преданность никогда не будут забыты, и он будет памятен своей службой и вкладом в страну. Даже когда новый лидер поведет нас через эти трудные времена, достижения сэра Стэнли Болдуина будут вечно сиять в истории Британской империи."
  IMP.4.a: "Вы много потрудились, граф $ENG_stanley_baldwin$."

  IMP.5.t: "Церемония назначения премьер-министра"
  IMP.5.mackenzie: "Сегодня Король Эдуард назначил Уильяма Лайона $CAN_mackenzie_king$ из Канады новым премьер-министром Британской империи. После краха западного мира и внезапного нападения и капитуляции британской метрополии Британская империя была вынуждена бежать в Канаду. В условиях этого кризиса сохранялось личное правление монарха, но из-за требований канадского парламента и правительств доминионов назначение нового лидера стало неизбежным.\n\nКороль Эдуард выбрал $CAN_mackenzie_king$ премьер-министром Канады и символом сплоченности доминионов. $CAN_mackenzie_king$ накопил долгую политическую карьеру в Канаде, и его умеренное и осторожное руководство сыграло важную роль в поддержании стабильности и сотрудничества между доминионами. Кроме того, он пользуется полным доверием канадского правительства, и ожидается, что это назначение укрепит единство всех доминионов.\n\nНазначение $CAN_mackenzie_king$ усилит солидарность внутри доминиона и сыграет центральную роль в построении более прочной оборонительной системы, чтобы Британская империя могла противостоять угрозе из иного мира. Он считается подходящим лидером для преодоления этого кризиса и возглавления восстановления Империи.\n\nНазначая $CAN_mackenzie_king$, Король Эдуард подчеркнул: \"В эти трудные времена сотрудничество и единство между доминионами важнее, чем когда-либо. Премьер-министр $CAN_mackenzie_king$ — тот самый человек, который отвечает на этот вызов времени\".\n\n$CAN_mackenzie_king$ будет уделять первостепенное внимание стабильности Британской империи и сотрудничеству между доминионами и приложит все усилия, чтобы вновь поднять Империю в этом кризисе."
  IMP_5public: "60-й премьер-министр Соединенного Королевства. "
  IMP.5.a: "$IMP_5public$ $ENG_winston_churchill$."
  IMP.5.b: "$IMP_5public$ $CAN_mackenzie_king$."

  IMP.6.t: "Заявление канадского парламента: Призыв к Его Величеству Королю $ENG_king_edward$"
  IMP.6.desc: "Ваше Величество Король $ENG_king_edward$,\n\nВ условиях краха западного мира и кризиса Британской империи мы находимся в ситуации, когда не можем предвидеть ни шага вперед. После внезапного нападения и капитуляции британской метрополии центр Империи теперь переместился в Канаду. Народы и доминионы Британской империи собрались под руководством Вашего Величества, и мы глубоко благодарны Вам за то, что Вы руководили этим кризисным временем посредством своего личного правления.\n\nОднако, несмотря на эти трудные обстоятельства, мы считаем, что должны восстановить стабильность и преемственность государства путем нормализации правительства. В настоящее время доминионы и народы Британской империи ожидают, что канадское правительство проявит твердое руководство для преодоления этого кризиса. Когда руководство премьер-министра Канады снова будет полностью развернуто, мы сможем сохранить сплоченность Империи и эффективно реагировать на вызовы, возникающие в результате изменений в западном мире.\n\nПоэтому канадский парламент настоятельно просит Ваше Величество прекратить режим чрезвычайного положения и снова доверить премьер-министру Канады всю полноту правительственной власти, чтобы обеспечить стабильность и надежду народу. Только с помощью таких мер мы сможем подготовиться к будущему с единым сердцем и преодолеть кризис.\n\nВаше Величество, настало время принять судьбоносное решение.\n"
  IMP.6.a: "Примем просьбу канадского парламента."
  IMP.6.b: "Отклоним просьбу канадского парламента."
  #\n\n...\n\nНа столе лежит официальное заявление, присланное канадским парламентом. Я смотрю на него уже несколько минут. Слова документа, словно имея вес, приближаются ко мне и погружают в глубокое размышление. В комнате тишина, а снаружи ледяной ветер Канады бьет в окно, заставляя стекло вибрировать. Ирония: я, некогда король Империи, правившей миром, теперь охраняю шаткий трон на этой чужой земле.\n\nВ этом заявлении было четко написано. Канадский парламент твердо требовал от меня назначить нового премьер-министра. Резкий тон, что больше нельзя откладывать, пропитывал каждый уголок текста. Мысль о том, что этот единственный лист бумаги, лежащий передо мной, может решить судьбу Британской империи, тяготит меня.\n\nЯ встал и подошел к окну у стола. Снаружи плотно сгустилась тьма, а вдалеке слабо мерцали огни города. Моя голова была полна мыслей. Требование Парламента, несомненно, разумно. Ради стабильности Империи я должен назначить нового премьер-министра. Если Маккензи Кинг займет этот пост, это может усилить сплоченность доминионов и сохранить равновесие Британской империи.\n\nНо есть и другой вариант. Я все еще являюсь сувереном этой Империи. Как абсолютный монарх, я мог бы воспользоваться своей властью и лично возглавить Империю. Я хорошо знаю, что во времена кризиса нужно сильное руководство. Возможно, моя решимость и моя воля смогут снова поднять Империю. Однако это может спровоцировать конфликт с доминионами. Нынешняя Империя — не та, что прежде. С падением метрополии доминионы возвышают свои голоса. Если мое решение заденет их чувства, Империя может вступить на путь необратимого раскола.\n\nЯ вернулся к столу и взял в руку заявление, присланное Парламентом. Текстура бумаги коснулась кончиков моих пальцев. Этот лист решит мою судьбу. Приму ли я требование Парламента и назначу премьер-министра, или выберу путь абсолютного монарха? Два варианта передо мной.\n\nНастало время решать. Чем больше проходит времени, тем тяжелее выбор. Я глубоко вздыхаю и готовлюсь принять решение. Тот факт, что судьба Империи в моих руках, снова давит на меня. Но я Король. В этот момент я должен принять правильное решение.\n\nВ конце концов, я взял перо и поставил подпись на строке для подписи."

  IMP.7.t: "Либеральная партия и Консервативная партия"
  IMP.7.desc: "Британский парламент, пройдя через 'Великий Исход', обосновался на канадской политической сцене. С вхождением ветеранов Британской консервативной партии в Консервативную партию Канады, Консервативная партия — потерпевшая сокрушительное поражение на всеобщих выборах 1935 года — становится серьезной угрозой для Либеральной партии.\n\nИ все же они еще не смогут немедленно приступить к политической деятельности. Это потому, что им нужно признать провал политики премьер-министра Беннета и пройти через процесс реорганизации своей партии. Проводя внутренние реформы, консерваторы будут прилагать усилия к самоизменению. Этот процесс перемен и реструктуризации займет время, но весьма вероятно, что они будут действовать в соответствии с долгосрочным планом.\n\nОднако, если представится возможность, консерваторы смогут критиковать плохое управление нашего правительства, требовать ответственности и пошатнуть власть. Когда они будут полностью готовы в политическом плане, канадская политическая шахматная доска может кардинально измениться. Чтобы подготовиться к этой ситуации, наше правительство должно делать выбор и концентрировать усилия как внутри, так и снаружи, и решительно реагировать, имея в виду более крупные стратегические цели. Мы должны принимать осторожные политические решения, чтобы управлять текущим кризисом и готовиться к вызовам будущего."
  IMP.7.a: "Какая головная боль..."

  IMP.8.t: "Навести порядок в Парламенте"
  IMP.8.desc: "С вхождением ветеранов Британской консервативной партии в Консервативную партию Канады неразбериха в Парламенте усиливается. Некоторые депутаты, отказывающиеся признавать членство британских политиков, повышают голоса оппозиции, в то время как канадские депутаты-консерваторы отвергают эти аргументы, утверждая, что это право, гарантированное Конституцией. В этой ситуации важность премьер-министра Маккензи Кинга начала выделяться еще больше."
  IMP.8.a: "\"Речи — это не мое...\""

  IMP.9.t: "Лечение Британской болезни"
  IMP.9.desc: "'Британская болезнь', так долго мучившая Канаду, теперь не более чем тень прошлого. Благодаря усилиям преданного медицинского персонала большинство пациентов получили лечение, а те, кто еще не получил помощи, скоро тоже вступят на путь выздоровления. Исцеление началось, и мы снова движемся к здоровому будущему."
  IMP.9.a: "Это хорошие новости!"

