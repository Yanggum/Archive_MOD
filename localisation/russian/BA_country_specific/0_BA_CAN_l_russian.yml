  # События
  IMP_event.1.t: "Изгнание Королевского флота и армии"
  IMP_event.1.d: "Солдаты, ожесточенно сражавшиеся на британской стороне, бежали в изгнание."
  IMP_event.1.a: "А, они уже прибыли?"

  IMP_event.2.t: "Сопротивление Канады"
  IMP_event.2.d: "Канада изгоняет Великобританию!"
  IMP_event.2.a: "Покажем им нашу силу."

  IMP_event.3.t: "Оккупация Суринама"
  IMP_event.3.d: "Воспользовавшись вакуумом после краха голландского правительства, британская армия решила временно взять на себя управление Суринамом."
  IMP_event.3.a: "Это только для поддержания порядка!"

  IMP_event.4.t: "Вест-Индия"
  IMP_event.4.d: "Мы объединили карибские колонии и сформировали Вест-Индию."
  IMP_event.4.a: "Это не более чем временная мера."

  IMP_event.5.t: "Попытка Египта национализировать Суэцкий канал"
  IMP_event.5.d: "Египет пытается национализировать Суэцкий канал. Мы должны быстро провести с ними переговоры, чтобы минимизировать кризис."
  IMP_event.5.b: "Покажем им статус Британской империи!"
  IMP_event.5.a: "Признаем их национализацию в обмен на требование права прохода"
  IMP_event.5.c: "Сейчас мы слабы."

  IMP_event.6.t: "Британское согласие"
  IMP_event.6.d: "Великобритания признала нашу национализацию."
  IMP_event.6.a: "Отлично!"

  IMP_event.7.t: "Требование Великобритании о праве прохода"
  IMP_event.7.d: "В обмен на признание нашей национализации Великобритания потребовала права прохода."
  IMP_event.7.a: "Это разумная сделка."
  IMP_event.7.b: "И не мечтай."

  IMP_event.8.t: "Гарантия Египтом права прохода"
  IMP_event.8.d: "Египет признал наше право прохода."
  IMP_event.8.a: "Ну и слава богу."

  IMP_event.9.t: "Отказ Египта"
  IMP_event.9.d: "Египет отклонил наше предложение."
  IMP_event.9.a: "Черт возьми!"

  IMP_event.10.t: "Отказ Великобритании"
  IMP_event.10.d: "Великобритания отклонила нашу национализацию."
  IMP_event.10.a: "И все равно это место — наша территория!"

  IMP_event.11.t: "Война на Ближнем Востоке"
  IMP_event.11.d: "После провала нескольких дней переговоров правительства Египта и Великобритании — которые столкнулись из-за национализации Суэцкого канала — вступили в состояние войны.\n\nЕгипет утверждает, что это решение касается нашей собственной территории, и критикует британское вторжение как 'неоправданную войну'. Пока официальная позиция Великобритании не обнародована.\n\nПеред лицом этого британского вторжения страны Ближнего Востока сформировали союз для помощи Египту и вручили британскому правительству официальное объявление войны."
  IMP_event.11.a: "Покажем мощь Британской империи!"
  IMP_event.11.b: "Изгоним угнетателя!"
  IMP_event.11.c: "Как интересно."

  IMP_event.12.t: "Холодная территория"
  IMP_event.12.d: "Несмотря на отчаянное сопротивление мирных жителей, не удалось остановить врагов, пришедших из иного мира. Однако британское верховное командование поддержало то, чтобы королевская семья Британии, высокопоставленные правительственные чиновники, депутаты, капиталисты и специалисты смогли заблаговременно бежать в Канаду до того, как хаос в метрополии усугубился; и к настоящему времени это стало картой, позволяющей быстро восстановиться."
  IMP_event.12.a: "Но не все их встречали с радостью."

  IMP_event.15.t: "Колониальное вмешательство"
  IMP_event.15.d: "Еще не время отчаиваться. Британская империя еще не умерла, и колонии могут быть под контролем!"
  IMP_event.15.a: "Раздавим врагов!"

  IMP_event.17.t: "Отставка Стэнли Болдуина"
  IMP_event.17.d: "Сегодня премьер-министр Великобритании Стэнли Болдуин ушел в отставку по состоянию здоровья. Чтобы только что начавшееся восстановление не застопорилось, нам придется выбрать нового премьер-министра британского временного правительства."
  IMP_event.17.a: "$ENG_winston_churchill$ от Консервативной партии."
  IMP_event.17.b: "Клемент Эттли от Лейбористской партии."
  IMP_event.17.c: "Премьер-министр доминиона Канада, $CAN_mackenzie_king$."

  IMP_event.18.t: "Призыв Британии к Содружеству"
  IMP_event.18.d: "Теперь, когда административный хаос закончился, Великобритания снова созвала свои доминионы."
  IMP_event.18.a: "Идем."

  IMP_event.19.t: "Требование Британии о подчинении"
  IMP_event.19.d: "Под предлогом обеспечения плацдарма для продвижения к метрополии Великобритания потребовала от нас передачи нашего суверенитета."
  IMP_event.19.a: "Они с ума сошли?!"
  IMP_event.19.b: "...Мы не против присоединиться к Содружеству. Если нам отдадут Северную Ирландию."
  IMP_event.19.c: "Тогда дайте нам Северную Ирландию."

  IMP_event.20.t: "Частичное согласие Ирландии"
  IMP_event.20.d: "Ирландия сообщила, что если мы частично примем ее требование и передадим ей Северную Ирландию, она присоединится к Содружеству."
  IMP_event.20.a: "Прими ее требование."
  IMP_event.20.b: "Мы не можем отказаться от законной территории Британской империи."

  IMP_event.21.t: "Согласие Ирландии"
  IMP_event.21.d: "Ирландия приняла наше требование."
  IMP_event.21.a: "Отлично!"

  IMP_event.22.t: "Великобритания пригласила нас в Содружество"
  IMP_event.22.d: "Великобритания пригласила нас в свою фракцию."
  IMP_event.22.a: "Принять."
  IMP_event.22.b: "Отклонить."

  IMP_event.24.t: "Обещание народу"
  IMP_event.24.d: "Чтобы увеличить нашу коммунистическую поддержку, мы дадим обещание народу. Какое обещание мы дадим?"
  IMP_event.24.a: "Обещать строительство военных заводов."
  IMP_event.24.b: "Обещать строительство гражданских заводов."
  IMP_event.24.n: "Обещать наивысший уровень жизни."
  IMP_event.24.m: "Обещать гендерное равенство."

  IMP_event.28.t: "[FROM.GetName] требует возврата территорий"
  IMP_event.28.d: "В общем, говорит, что Британия плачет, прося вернуть землю."
  IMP_event.28.a: "Как хочешь."
  IMP_event.28.b: "И не мечтай."

  IMP_event.29.t: "[FROM.GetName] принял наше требование"
  IMP_event.29.d: "В общем, говорит, что нам вернули нашу землю."
  IMP_event.29.a: "Хорошо."

  IMP_event.30.t: "[FROM.GetName] отклонил наше требование"
  IMP_event.30.d: "В общем, говорит, что другая сторона отказалась."
  IMP_event.30.a: "Разговорами это не решить!"

