  BEL_integrity_of_the_fatherland: "За родину"
  BEL_integrity_of_the_fatherland_desc: ""
  BEL_end_military_interference: "Велосипедная пехота"
  BEL_end_military_interference_desc: ""
  BEL_develop_transporter: "Разработать транспортеры"
  BEL_develop_transporter_desc: ""
  BEL_endless_landing_army: "Неистощимая десантная пехота"
  BEL_endless_landing_army_desc: ""
  BEL_establish_the_brazilian_investment_bank: "Основать инвестиционный банк"
  BEL_establish_the_brazilian_investment_bank_desc: ""
  BEL_congo_army_factory: "Военный завод Конго"
  BEL_congo_army_factory_desc: ""
  BEL_implement_article_138: "Декрет № 138"
  BEL_implement_article_138_desc: ""
  BEL_tech_slot_2: "Расширить инфраструктуру"
  BEL_tech_slot_2_desc: "Мы восстановим и расширим разрушенную конголезскую инфраструктуру, основу нашей экономики."
  BEL_posts_for_generals: "Увеличить производство каучука"
  BEL_posts_for_generals_desc: "Мы расширим производство конголезского каучука, чтобы усилить нашу военную мощь."
  BEL_united_states_of_br: "Увеличить автономию Конго"
  BEL_united_states_of_br_desc: "Мы предоставим конголезцам больше автономии и отразим их голос в политике, улучшая двусторонние отношения."
  BEL_third_republic: "Импортировать вольфрам"
  BEL_third_republic_desc: "Мы расширим импорт вольфрама, чтобы укрепить нашу боеспособность."
  BEL_combat_separatism: "Ослабить сепаратизм"
  BEL_combat_separatism_desc: "Мы устраним оставшиеся сепаратистские угрозы и укрепим бельгийский суверенитет над Конго."
  BEL_war_bonds: "Военные облигации"
  BEL_war_bonds_desc: "Мы выпустим военные облигации, чтобы ускорить восстановление Конго."
  BEL_the_international_c: "Противодействовать синдикалистской угрозе"
  BEL_the_international_c_desc: "Мы заблокируем синдикалистскую экспансию, чтобы защитить колониальную стабильность."
  BEL_invite_foreign_com: "Пригласить иностранные компании"
  BEL_invite_foreign_com_desc: "Мы привлечем иностранные компании для оживления экономики Конго."
  BEL_address_labor_disp: "Разрешить трудовые споры"
  BEL_address_labor_disp_desc: "Мы положим конец трудовым конфликтам и гарантируем права конголезских рабочих."
  BEL_impement_article_17: "Применить статью 17"
  BEL_impement_article_17_desc: "Мы применим статью 17, чтобы усилить бельгийский контроль и способствовать интеграции Бельгии и Конго."
  BEL_land_1st_2: "Земельная реформа, фаза II"
  BEL_land_1st_2_desc: "Мы перераспределим земли и улучшим сельскохозяйственную инфраструктуру, чтобы стимулировать производство."
  BEL_shipyard: "Конголезская верфь"
  BEL_shipyard_desc: "Мы построим бельгийскую верфь в Конго, чтобы усилить наше военно-морское присутствие."
  BEL_implement_a_national_guard: "Создать Национальную гвардию"
  BEL_implement_a_national_guard_desc: "Мы создадим конголезскую Национальную гвардию, чтобы укрепить наше господство."
  BEL_import_oil: "Расширить импорт нефти"
  BEL_import_oil_desc: "Мы увеличим импорт нефти, чтобы стабилизировать энергоснабжение и стимулировать промышленность."
  BEL_massive_recruit_plan: "План массового призыва"
  BEL_massive_recruit_plan_desc: "Мы запустим массовый призыв в Конго, чтобы обеспечить бельгийский контроль."

  BEL_reward_army_loyalty: "Основать военно-воздушные силы"
  BEL_reward_army_loyalty_desc: "Мы создадим бельгийские ВВС в Конго, чтобы усилить нашу военную мощь."

  BEL_reinvigorate_the_navy: "Основать военно-морской флот"
  BEL_reinvigorate_the_navy_desc: "Мы создадим бельгийский флот в Конго, чтобы обеспечить наши морские возможности."

  BEL_united_industrial_states_of_belgium: "Бельгийское промышленное государство"
  BEL_united_industrial_states_of_belgium_desc: "Мы создадим промышленное государство, чтобы ускорить индустриализацию и экономический рост."
