l_russian:
#Бельгия
  BEL_GATHERING_STORM_DESC_1: "Внезапное вторжение существ из иного мира погрузило бельгийский народ в боль бесконечной войны. Правительство рухнуло, и король Леопольд III бежал в Конго, чтобы восстановить метрополию, но будущее Бельгии остается неопределенным. Сможет ли Бельгия отвоевать свою родину и восстановить мир после вторжения из иных миров?"

  BEL_country_intro_header: "§YУвядший мак§!"
  BEL_country_intro_content: "История Бельгии начинается в 1790 году. Сначала как Соединенные Штаты Бельгии, а затем как независимое королевство, Бельгия жила как колониальная империя, господствуя, среди прочего, над африканским Конго, и как страна Нижних земель. После Великой войны, когда ее территория была растоптана Германией, она считала, что никогда больше не будет запятнана.\n\nНо судьба перерезала нить по имени Бельгия.\n\nКогда девушки с ореолами вторглись в Европу и уничтожили Бельгию, король Леопольд III и бельгийцы бежали в колонию Конго. В отличие от французских владений, где было полно лояльных туземцев, положение Бельгии было ужасным: местное сопротивление не прекращается, а популярность монарха на нуле.\n\nДаже пораженная болезнями, Бельгия в изгнании сохраняет одну-единственную цель: вернуться на родину. Для достижения этого, возможно, придется заплатить высокую цену Конго или даже полностью потерять колонию.\n\nОкровавленная артерия стала жизненно важной нитью бельгийского государства. Сердце этой малой страны, брошенное в африканских джунглях, может перестать биться в той самой колонии, которую она эксплуатирует.\n\n§YРазработка – Mako§!\n§YДополнительная разработка – Pencildude§!"
  BEL_guide: "Цели\n\n£white_dot. Успокоить колониальный хаос.\n£white_dot. Индустриализировать колонию и подготовиться к вторженцам из иного мира.\n£white_dot. Восстановить королевский авторитет и доказать истинную величину монарха.\n£white_dot. Любой ценой вернуть бельгийскую территорию из рук захватчиков."

  BEL_Leopold_III_desc: "Леопольд III взял на себя огромную ответственность. Вскоре после внезапной смерти своего отца и восшествия на престол захватчики из иного мира опустошили Бельгию, и король вместе со своим кабинетом был вынужден бежать в Конго. Он мечтает однажды вернуться в метрополию.\n\nНо молодой монарх не смог стать стержнем нации. В колонии Конго бельгийские изгнанники не встречают его с ликованием. В отличие от могущественной Франции, Бельгия была скромным государством Нижних земель, и лояльных колонистов там не много. В невыносимой ситуации популярность Леопольда падает.\n\nИзгнанное королевство страдает от болезней, местные повстанцы совершают набеги, а его вооруженные силы едва дышат. Сможет ли этот неопытный монарх преодолеть все препятствия и стать героем Бельгии?"

#Решения
  BEL_industrialize: "Бельгийская индустриализация"
  BEL_industrialize_desc: "Вторжение из иного мира вынуждает Бельгию ускорить индустриализацию с помощью новых планов и политик, чтобы преодолеть кризис."
  BEL_industrialize_leopoldvile: "Индустриализировать Леопольдвиль"
  BEL_colony_coreing: "Восстановить бельгийские колонии"
  BEL_colony_coreing_desc: "Вторжение и гражданская война опустошили колонии. Бельгия должна стабилизировать их и использовать их ресурсы с помощью нового плана."
  BEL_colony_coring: "Восстановить колонию [FROM.GetName]"
  BEL_colony_civil_war: "Бельгийская колониальная гражданская война"
  BEL_colony_civil_war_desc: "Бельгийские колонии охвачены гражданской войной. Необходимо восстановить порядок и использовать их ресурсы."
  BEL_powerful_suppress: "Энергичное подавление"
  BEL_powerful_suppress_desc: "Перед лицом вторжения Бельгия должна усилить репрессии внутри колонии."
  BEL_occupation_stabilization: "Стабилизировать оккупированные территории"
  BEL_occupation_stabilization_desc: "Война и колониальное восстание требуют от Бельгии восстановления спокойствия в оккупированных зонах."
  BEL_imperialism: "Поощрять империализм"
  BEL_imperialism_desc: "Напоминание о былой славе мотивирует подданных и позволит использовать колониальные ресурсы в условиях хаоса."
  BEL_using_civil_war_decision: "Применение политики колониальной гражданской войны"

#События восстановления
  BEL_recov_events.1.t: "Бельгийская чрезвычайная мобилизация"
  BEL_recov_events.1.desc: "Вторжение вынуждает Бельгию перейти к военной экономике. Король Леопольд III призывает всех колонистов объединиться против захватчиков, хотя победа все еще кажется далекой."
  BEL_recov_events.1.a: "Нет альтернативы"
  BEL_recov_events.2.t: "Речь Леопольда III"
  BEL_recov_events.2.desc: "С решимостью Леопольд III поднимается на трибуну в Леопольдвиле. Без возможности отступления он должен выполнить свой долг монарха. Одетый скромно, он готовится говорить.\n\n"Граждане Королевства Бельгия, народы Фландрии и Валлонии, слушайте меня.\n\nВы помните нашу родину: луга, облака, города, где мы жили. Посмотрите сейчас: странные захватчицы отняли у нас дом и разрушили наши города.\n\nБрюссель, Антверпен, Льеж, Шарлеруа... мы все бросили и бежали сюда.\n\nКак ваш король, я говорю вам: мы пали перед могущественными врагами. Бог послал нам испытание, еще более суровое, чем в 1914 году.\n\nМы всегда боролись за свободу: против Голландии за независимость, против Германской империи. Возьмем же снова наши руки и объединимся.\n\nЗа свободу, закон и Бельгию: беритесь за оружие, инструменты или мотыги. Это мольба бельгийца и приказ вашего короля. Единство кует силу, и наш красный мак снова расцветет на бельгийской земле.\n\nЗа короля, закон и свободу.""
  BEL_recov_events.2.a: "Да здравствует Бельгия! Да здравствует король!"
  BEL_recov_events.3.t: "Восстановление колонии!"
  BEL_recov_events.3.desc: "После долгой борьбы мы восстановили колонию. Бельгийские флаги развеваются, и народ празднует. Мы посвятим себя залечиванию ран и восстановлению нации. Бельгия навсегда!"
  BEL_recov_events.3.a: "Наконец-то!"
  BEL_recov_events.4.t: "Восстановление чести"
  BEL_recov_events.4.desc: "Мы отвоевали метрополию. Под королевским руководством мы храбро сражались и смыли позор изгнания. Бельгия снова встает и вместе со своими союзниками будет защищать свободу и мир. Бельгийская слава будет вечной!"
  BEL_recov_events.4.a: "Бельгия навсегда!"
  BEL_recov_events.5.t: "Перенос столицы"
  BEL_recov_events.5.desc: "Восстановив Бельгию, мы обнаружили, что Брюссель исчез, замененный школой Хронос. Мы должны выбрать новую столицу между Фландрией и Валлонией. Это решение определит будущее страны."
  BEL_recov_events.5.a: "Гент"
  BEL_recov_events.5.b: "Шарлеруа"

#Фокусы
  BEL_start_the_state_of_emergency: "Объявить чрезвычайное положение"
  BEL_start_the_state_of_emergency_desc: "Местные повстанцы бесчинствуют; мы должны провести армию и обеспечить контроль над Леопольдвилем, пока не стало слишком поздно, иначе для Бельгии останется только смерть."
  BEL_enhance_the_national_security_law: "Усилить Закон о национальной безопасности"
  BEL_enhance_the_national_security_law_desc: "Как бы мы это ни приукрашивали, Конго в хаосе; до возвращения в метрополию мы должны одинаково контролировать как колонистов, так и жителей метрополии."
  BEL_greater_federalism: "Развитие Африки"
  BEL_greater_federalism_desc: "Конго — наша база для возвращения родины; мы должны индустриализировать эти отдаленные джунгли и превратить их в двигатель реконкисты."
  BEL_continue_centralization: "Привлечь инвесторов из метрополии"
  BEL_continue_centralization_desc: "Мы связались с сопротивлением в метрополии; бельгийские предприниматели обещают вложить свой капитал для восстановления страны."
  BEL_recolonize: "Ре colonization"
  BEL_recolonize_desc: "Туземцы жаждут 'свободы' и восстают; настало время напомнить им, кто главный в Конго."
  BEL_vassouras_line: "Расширить военные заводы"
  BEL_vassouras_line_desc: "Без оружия солдаты не могут сражаться; мы построим военные заводы, чтобы вооружить наши войска."
  BEL_petropolis_line: "Расширить гражданские заводы"
  BEL_petropolis_line_desc: "Мы сровняем с землей джунгли Леопольдвиля и возведем заводы, которые подготовят реконкисту."
  BEL_restore_the_coffee_barons: "Сельское хозяйство Конго"
  BEL_restore_the_coffee_barons_desc: "Конголезские кофе и каучук поддерживают Бельгию в изгнании на плаву; усиление этого преимущества обеспечит королевское благосостояние и расширение армии."
  BEL_constitutional_monarchy: "Восстановить монархию"
  BEL_constitutional_monarchy_desc: "Каким бы некомпетентным ни был Леопольд III, он все еще король; Корона — наш символ и духовная опора."
  BEL_depose_vargas: "Король-воин"
  BEL_depose_vargas_desc: ""
  BEL_tech_slot_1: "Национальный университет Бельгии"
  BEL_tech_slot_1_desc: ""
  BEL_reject_cosmopolitanism: "Бельгия прежде всего"
  BEL_reject_cosmopolitanism_desc: ""
  BEL_ban_political_parties: "Государственный департамент Бельгии"
  BEL_ban_political_parties_desc: ""
  BEL_decree_no_37: "Чрезвычайный приказ № 12"
  BEL_decree_no_37_desc: ""
  BEL_establish_psad: "Управление оборонных закупок"
  BEL_establish_psad_desc: ""
  BEL_federal_employment_plan: "Королевский план занятости"
  BEL_federal_employment_plan_desc: ""
  BEL_secure_our_borders: "Защитить границы"
  BEL_secure_our_borders_desc: ""
  BEL_in_vargas_we_trust: "Мы верим в Леопольда"
  BEL_in_vargas_we_trust_desc: ""
  BEL_tribunal_de_seguranca_nacional: "Трибунал национальной безопасности"
  BEL_tribunal_de_seguranca_nacional_desc: "Подрывные элементы сеют террор; этот трибунал будет судить и наказывать врагов государства во время изгнания."
  BEL_ensure_continued_military_support: "Обеспечить постоянную военную поддержку"
  BEL_ensure_continued_military_support_desc: "Изгнанная армия необходима; предоставление ей лучшего снаряжения и офицеров усилит нашу мощь."
  BEL_work_with_the_integralists: "Сотрудничать с интегралистами"
  BEL_work_with_the_integralists_desc: "Помимо армии, страна нуждается в единстве; отложим споры до завершения реконкисты: никто не хочет умирать в африканских джунглях."
  BEL_estado_moderno: "Подавить колониальную гражданскую войну"
  BEL_estado_moderno_desc: ""
  BEL_estado_novo: "Готовиться к реконкисте"
  BEL_estado_novo_desc: ""
  BEL_cohen_plan: "План Коэна"
  BEL_cohen_plan_desc: "Армия снова берется за оружие и ждет дня возвращения на родину по ту сторону Африки."
  BEL_the_polaca: "Расширить военную промышленность"
  BEL_the_polaca_desc: ""
  BEL_no_matter_the_cost: "Любой ценой!"
  BEL_no_matter_the_cost_desc: ""
  BEL_invest_in_the_armed_forces: "Подкупить армию"
  BEL_invest_in_the_armed_forces_desc: "Наша армия разбита и недружелюбна; подкуп опустошит казну, но перетянет их на нашу сторону."
  BEL_royal_colleges: "Основать королевский университет в [ROOT.Capital.GetCapitalVictoryPointName]"
  BEL_royal_colleges_desc: "Образование — лучшее благосостояние, тем более в изгнании; терпеливо накопив средства, мы можем воздвигнуть университет в Леопольдвиле."
  BEL_issue_lordships: "Жаловать дворянские титулы"
  BEL_issue_lordships_desc: "Военная коррупция требует 'маленьких' наград; пожалование дворянских титулов обеспечит их лояльность."
  BEL_promote_agriculture: "Возрождение кофейных баронов"
  BEL_promote_agriculture_desc: "Кофейный сектор поддерживает нашу экономику; мы чтим его магнатов, 'кофейных баронов', как столпы королевства."
  BEL_undermine_democracy: "Ослабить парламент"
