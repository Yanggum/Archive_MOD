# События истории (1-18)
  BEL_story_event.1.t:0 "Когда падал снег"
  BEL_story_event.1.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nВозможно, это было прошлое Рождество. Мальчик счастливо улыбался, слушая звон колоколов на улице маленькой валлонской деревушки. Хотя его родная Бельгия исчезла давным-давно, парень был счастлив: в пятнадцать лет родина была далеким, необязательным понятием. В ту Рождественскую ночь все, казалось, было спокойно, кроме патрулей Академии полиции Валькирии.\n\nТук-тук. Постучали в дверь. Его отец — единственный родственник — был на работе, поэтому мальчик открыл. Перед ним стояла молодая блондинка с короткой стрижкой, красивым лицом и пальто, покрытым снегом. Не говоря ни слова, она склонила голову и вручила ему какие-то документы на французском. Парень, очарованный, подписал их именем отца и проводил ее.\n\nКогда он закрыл дверь, его лицо стало красным, как костюм Санты. Этого жеста, снега на ее волосах и той необычной формы было достаточно, чтобы сердце парня открыло любовь.\n\nЗадыхаясь, он выбежал на ее поиски, обыскал деревню часами... но девушка исчезла. Он не нашел ее, пока его отец, обеспокоенный, не отчитал его за блуждание под снегом, который продолжал падать всю ночь.\n\nТой ночью парень не спал: он снова и снова рисовал в уме лицо девушки, прекраснее букета цветов.\n\n«Если бы я только мог увидеть ее снова...»"
  BEL_story_event.2.t:0 "Лицом к лицу"
  BEL_story_event.2.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nПарень с трудом разлепил веки. На столе лежал подарок от отца и записка с извинениями за позднее возвращение. Вздохнув, он позавтракал сырым хлебом и теплым молоком и направился в школу: всю дорогу его занимало воспоминание о девушке.\n\nОхранники Валькирии продолжали патрулировать; он не ожидал увидеть ее там: сотни одинаковых форм, и ни одной ее... пока он не увидел ее: блондинка, снежно-белая кожа, фиолетовые глаза.\n\nПарень потерял дар речи. Он искал ее, пока не стер обувь, и вот она. У него перехватило дыхание, лицо стало помидором.\n\nДевушка подошла к нему с любопытным выражением. Он чувствовал, что его сердце вот-вот разорвется."
  BEL_story_event.3.t:0 "Первые слова"
  BEL_story_event.3.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n— Это был ты, да? Тот, кто вчера подписался именем отца.\n\nПарень закивал, как сломанная кукла. Она улыбнулась и представилась:\n\n— Я Сакуми. С сегодняшнего дня я буду патрулировать этот район; пока мы здесь, ты будешь в безопасности, обещаю.\n\nОстальное дошло до ушей юноши смутно, поглощенного ее красотой. Когда он пришел в себя, ему захотелось убежать от стыда, но ноги приросли к земле; он вернулся и, запинаясь, выпалил:\n\n— С-Сакуми... я х-хотел бы... быть твоим другом!\n\nОна уловила намерение и, забавляясь, согласилась. Снег продолжал медленно падать, закрепляя это начало."
  BEL_story_event.4.t:0 "Завязывая дружбу"
  BEL_story_event.4.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nНеделю спустя снег почти полностью растаял. После уроков Сакуми ждала в пустом классе, и парень рассказывал ей обо всем: о своем друге, подавившемся хлебом, жалобах на учителя, сплетнях...\n\nЕй было мало что рассказать: та же охрана, те же сослуживцы. Но она слушала завороженно: для нее каждая мелочь была новой и забавной.\n\n— Вот учитель Джан снова завалил нас домашкой... — надулся он.\n— Может, потому что ты ему нравишься; у тебя хороший учитель! — ответила она смеясь.\n— Сакуми! Ты должна была посочувствовать мне!\n\nИ они оба рассмеялись; юность расцветала между ними."
  BEL_story_event.5.t:0 "Небольшой разговор"
  BEL_story_event.5.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСакуми патрулировала, но думала о нем. Парень вздыхал из-за тяжести навязанного французского, и она решила показать ему особенное место.\n\nПосле долгой прогулки они добрались до широкого озера, луж от таяния снега и тропинок, полных птиц. Юноша никогда там не был.\n\n— Так и будешь стоять? Сядь со мной.\n\nОни сели на большой камень. Она, улыбаясь, спросила напрямик:\n\n— Скажи, я тебе нравлюсь? Да?"
  BEL_story_event.6.t:0 "Под небом птиц"
  BEL_story_event.6.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n— Ч-что? — залепетал он.\n\nСакуми нежно посмотрела на него и положила свою руку на его. Юноша хотел отдернуть, потерял равновесие, и они оба упали в траву и землю. Открыв глаза, они обнимались, красные как раки, без слов: только птицы щебетали в вышине.\n\nСердца бились в унисон."
  BEL_story_event.7.t:0 "Сердца в унисон"
  BEL_story_event.7.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nПарень достал помятый при падении подарок: фиолетовый лизиантус. Она прикрепила его к своим золотистым волосам.\n\n— Я сохраню его навсегда, потому что он от тебя.\n\nЗатем она обняла его; юноша, со слезами счастья, прижал ее к себе. Два сердца бились вместе, все быстрее и быстрее."
  BEL_story_event.8.t:0 "Слухи"
  BEL_story_event.8.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСреди Валькирий прошел слух: Лиса-Бедствие, Косака Вакамо, сбежала. Говорили, что она терроризирует Валлонию. Сакуми дрожала: она молилась, чтобы ее маленькая деревня осталась в стороне.\n\nПока она думала об этом в пустом классе, парень ворвался и обнял ее, не подозревая о ее тревоге. Она улыбнулась, но ее лицо омрачилось секретом, который она все еще не решалась раскрыть."
  BEL_story_event.9.t:0 "Я не убегу, никогда"
  BEL_story_event.9.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСакуми объяснила угрозу. Парень слушал серьезно:\n\n— Ты из Валькирии; ты проходила через опасности. Если боишься потерять меня, защити меня: это твой долг, разве нет?\n\nЕго слова заставили Сакуми задрожать. Слезы хлынули. Она обняла его, прося прощения; он утешал ее: он обещал не плакать после смерти матери."
  BEL_story_event.10.t:0 "Приготовления"
  BEL_story_event.10.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСтуденты Валькирии укрепляли деревню. Сакуми подняла свой дробовик; хотя она сомневалась в престиже своей школы, она поклялась защитить Винсента и его отца любой ценой. Солнце клонилось к закату; ее решимость горела ярче, чем когда-либо."
  BEL_story_event.11.t:0 "Бой"
  BEL_story_event.11.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nПламя окрасило небо. За десять минут все Валькирии, кроме Сакуми, лежали на земле. Перед ней стояла Вакамо.\n\n— Какое жалкое сопротивление — усмехнулась лиса.— Ты защищаешь кого-то дорогого? Люди предают...\n\n— Заткнись — прорычала Сакуми, вскидывая дробовик здоровой рукой.\n\nВакамо выстрелила первой, раздробив ей руку; затем прошла мимо. Но Сакуми, истекая кровью, вцепилась в ее лодыжку:"
  BEL_story_event.12.t:0 "Мольба"
  BEL_story_event.12.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n— Пожалуйста... не трогай эту деревню. Для тебя это ничто, для меня — все. Позволь людям жить... позволь Винсенту жить.\n\nСлезы и кровь падали. Вакамо могла отшвырнуть ее пинком, но молча смотрела... и развернулась. Сакуми, всхлипывая, снова и снова благодарила врага, исчезающего среди руин."
  BEL_story_event.13.t:0 "Возвращение"
  BEL_story_event.13.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСнег покрывал пепел. Винсент искал Сакуми повсюду, боясь худшего. Он плакал от тревоги, когда услышал слабый голос:\n\n— Винсент...\n\nОн обернулся: это была она, израненная, но живая. Парень обнял ее, рыдая; она обвила его своей единственной сильной рукой.\n\n— Я думал, ты умерла..."
  BEL_story_event.14.t:0 "На заснеженных руинах"
  BEL_story_event.14.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n— Я не могла уйти и оставить тебя. Нам еще многое нужно сделать вместе — прошептала Сакуми. Он сжал ее крепче.\n\nСквозь слезы они скрепили поцелуй. Снег таял, касаясь их щек."
  BEL_story_event.15.t:0 "Сияющий день"
  BEL_story_event.15.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nПод солнцем пара наслаждалась первым свиданием: уличная еда, новая одежда, поцелуй на променаде у озера.\n\n— Мне заменить тебе цветок? Он увядает — предложил он.\n— Ни за что! Это твой первый подарок; я буду носить его, даже если он засохнет — рассмеялась она."
  BEL_story_event.16.t:0 "Неизменная любовь"
  BEL_story_event.16.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nИзможденный мужчина вышел из-за зданий с бомбой, пробивающей ореол.\n\n— Умри, проклятая! — закричал он.\n\nСакуми, все еще раненая, не могла бежать; она обняла парня и повернулась спиной к взрывчатке. Раздался грохот, и все закончилось.\n\nСердце девушки остановилось под красным небом заката."
  BEL_story_event.17.t:0 "Это не вечное прощание"
  BEL_story_event.17.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nВинсент плакал у открытого гроба. Он положил новый лизиантус в холодные руки Сакуми. Ио, ее подруга, передала ему письмо:\n\n— Она написала это для тебя.\n\nПарень прочитал его сквозь слезы и, закончив, улыбнулся небу: «Мы еще увидимся»."
  BEL_story_event.18.t:0 "Для Винсента"
  BEL_story_event.18.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n«Я давно не писала. Хотела сказать тебе это лично, но умираю от стыда.\n\nРаньше я была обычной студенткой Полицейской академии Валькирии; ты превратил мою серую жизнь в радугу. Кажется, я люблю тебя с тех самых пор.\n\nЯ говорила с твоим отцом: он говорит, что никогда не видел тебя таким счастливым. Когда мы вырастем и все это закончится, давай жить здесь вместе. Он дал свое благословение на брак; не хватает только твоего ответа... Почему я плачу, когда пишу? Боюсь потерять тебя? Возможно, но моя любовь реальна.\n\nЛучше мне остановиться. Когда мы станем старше, будем счастливы вместе.\n\nЯ очень тебя люблю.\n\nКуросава Сакуми»"

  #Фокусы "_2" (расширение фокусов бельгийского правительства в изгнании)
  Военные фокусы "_2"
  BEL_royal_military_academy_2: "Расширение Королевской военной академии Конго"
  BEL_royal_military_academy_2_desc: "В Конго, нашем месте изгнания, мы расширим филиал Королевской военной академии Бельгии, чтобы готовить офицеров высокого класса на местной почве. Для возвращения метрополии нам понадобятся опытные командиры без исключений."

  BEL_multi_language_courses_2: "Курсы многоязычной военной подготовки"
  BEL_multi_language_courses_2_desc: "Чтобы без трений общаться с многочисленными племенами Конго, мы введем курсы многоязычной военной подготовки. Это позволит нам усилить сотрудничество с местными жителями и повысить сплоченность армии."

  BEL_fn_herstal_2: "Конголезский филиал FN Herstal"
  BEL_fn_herstal_2_desc: "Мы создадим филиал в Конго известного бельгийского производителя оружия FN Herstal. Производство вооружения непосредственно на местной почве значительно повысит огневую мощь армии в изгнании."

  BEL_military_academy_2: "Институт военной подготовки Конго"
  BEL_military_academy_2_desc: "Мы основали специализированный институт военной подготовки в Конго для систематической подготовки офицеров местного происхождения. Это обеспечит нам военное руководство, необходимое во время изгнания."

  BEL_staff_planning_2: "Усиление Генерального штаба в Конго"
  BEL_staff_planning_2_desc: "Мы усилим функции Генерального штаба бельгийской армии в изгнании, созданного в Конго. Это позволит более точно планировать реконкисту и более эффективно проводить операции."

  BEL_small_arms_supply_chain_2: "Локализация цепочки поставок стрелкового оружия"
  BEL_small_arms_supply_chain_2_desc: "Мы полностью построим в Конго производство и цепочку поставок стрелкового оружия. Это уменьшит внешнюю зависимость и гарантирует стабильное снабжение вооружением."

  BEL_mortar_production_2: "Местное производство минометов"
  BEL_mortar_production_2_desc: "Мы создадим мощности для производства минометов непосредственно в Конго. Это усилит нашу артиллерию и обеспечит огневую поддержку, необходимую для реконкисты."

  BEL_light_tanks_2: "Программа разработки легких танков"
  BEL_light_tanks_2_desc: "Мы разработаем легкие танки, подходящие для местности и условий Конго. Они повысят мобильность армии в изгнании и сыграют ключевую роль в реконкисте."

  BEL_modern_anti_air_artillery_2: "Развертывание современной зенитной артиллерии"
  BEL_modern_anti_air_artillery_2_desc: "Мы развернем современную зенитную артиллерию в ключевых стратегических точках Конго, чтобы существенно повысить противовоздушную оборону правительства в изгнании. Это защитит критические объекты от вражеских бомбардировок."

  BEL_support_weapons_focus_2: "Специализация на оружии поддержки"
  BEL_support_weapons_focus_2_desc: "Мы специализируем способность армии в изгнании применять оружие поддержки. Эффективное использование пулеметов, минометов и противотанковых орудий позволит максимизировать боевую мощь."

#Военно-морские фокусы "_2"
  BEL_allied_donations2: "Расширение военно-морской поддержки союзников"
  BEL_allied_donations2_desc: "Мы обеспечим дополнительную поддержку кораблями и военно-морским оборудованием от союзников. Это гарантирует нам контроль над конголезским побережьем и создаст морской плацдарм для возвращения в метрополию."

  BEL_corvette_fleet2: "Флот корветов Конго"
  BEL_corvette_fleet2_desc: "Мы организуем флот корветов для обороны побережья Конго. Маленький, но очень подвижный, этот флот будет выполнять задачи берегового патрулирования и морской разведки, усиливая военно-морскую оборону правительства в изгнании."

  BEL_boelwerf2: "Восстановление верфи Boelwerf"
  BEL_boelwerf2_desc: "Мы создадим в Конго филиал традиционной бельгийской судостроительной компании Boelwerf. Строя корабли непосредственно на местной почве, мы повысим самостоятельность флота армии в изгнании."

#Военно-воздушные фокусы "_2"
  BEL_develop_belgian_air_industry2: "Перенос бельгийской авиационной промышленности в Конго"
  BEL_develop_belgian_air_industry2_desc: "Мы перенесем и восстановим в Конго бельгийские авиационные технологии и промышленную базу. Это позволит нам обеспечить независимые возможности по обслуживанию и разработке самолетов для ВВС в изгнании."

  BEL_foreign_plane_purchases2: "Расширение закупок иностранных самолетов"
  BEL_foreign_plane_purchases2_desc: "Мы получим больше самолетов различных типов от союзников и дружественных стран. Это позволит диверсифицировать ВВС в изгнании и гарантировать способность реагировать на множество задач."

  BEL_air_academy_construction2: "Академия ВВС Конго"
  BEL_air_academy_construction2_desc: "Мы основали академию ВВС в Конго для подготовки пилотов и авиационных техников на местной почве. Это сделает возможным устойчивое расширение воздушной мощи, необходимой для реконкисты."

  BEL_spitfire_purchases2: "Дополнительная закупка Spitfire"
  BEL_spitfire_purchases2_desc: "Мы закупим дополнительные истребители Spitfire в Великобритании. Эти превосходные самолеты будут действовать как костяк ВВС в изгнании и внесут огромный вклад в обеспечение превосходства в воздухе."

#Технологические/исследовательские фокусы "_2"
  BEL_tech_slot_3_2: "Расширение Института науки и технологий Конго"
  BEL_tech_slot_3_2_desc: "Мы значительно расширим Институт науки и технологий, созданный в Конго, чтобы получить дополнительные исследовательские возможности. Даже во время изгнания непрерывный технологический прогресс заложит основы для реконкисты."

  BEL_department_of_telecommunications_2: "Министерство телекоммуникаций"
  BEL_department_of_telecommunications_2_desc: "Министерство телекоммуникаций отвечает за управление бельгийской коммуникационной сетью и контроль информационных потоков. Даже в военное время это ведомство стремится поддерживать связь и предоставлять населению необходимую информацию."

  BEL_department_of_ballistic_metrology_2: "Баллистика"
  BEL_department_of_ballistic_metrology_2_desc: "Департамент баллистики отвечает за исследование и разработку бельгийских военных технологий. Даже во время войны он работает над развитием военных технологий и способствует усилению обороноспособности Бельгии."

  BEL_center_for_advanced_military_studies_2: "Институт перспективных военных исследований"
  BEL_center_for_advanced_military_studies_2_desc: "Институт перспективных военных исследований — учреждение, занимающееся исследованием бельгийской военной стратегии и тактики. Даже в военное время он стремится развивать стратегическую доктрину и способствует повышению эффективности военных операций."

  BEL_resist_and_bite_2: "Сопротивляться и держаться"
  BEL_resist_and_bite_2_desc: "«Сопротивляться и держаться» символизирует дух бельгийского народа: не терять надежду в военное время и стремиться преодолеть невзгоды. Это ведомство проводит различные мероприятия, чтобы вселить в население надежду и мужество."

  BEL_senior_officer_training_2: "Подготовка старших офицеров"
  BEL_senior_officer_training_2_desc: "Департамент подготовки старших офицеров отвечает за обучение бельгийских военных лидеров. Даже во время войны он проводит различные программы обучения для усиления командных способностей и работает на успех бельгийских военных операций."

  BEL_increased_length_of_service_2: "Увеличение срока службы"
  BEL_increased_length_of_service_2_desc: "Департамент увеличения срока службы отвечает за поддержку бельгийских военнослужащих, чтобы они могли продолжать службу во время войны. Увеличивая время службы, он укрепляет бельгийскую оборону и стремится к победе."

  BEL_junior_officer_training_2: "Подготовка младших офицеров"
  BEL_junior_officer_training_2_desc: "Департамент подготовки младших офицеров отвечает за обучение офицеров младших рангов. Даже во время войны он проводит различные программы обучения для усиления их способностей и способствует повышению боевой мощи бельгийской армии."

  BEL_poudreries_reunies_de_belgique_2: "Poudreries Réunies de Belgique"
  BEL_poudreries_reunies_de_belgique_2_desc: "Poudreries Réunies de Belgique — бельгийский производитель вооружений, который продолжает выпускать военную технику даже во время войны. Он поставляет оружие и боеприпасы бельгийской армии и стремится к победе."

  BEL_belgian_tank_development2: "Бельгийские танки"
  BEL_belgian_tank_development2_desc: "Департамент разработки бельгийских танков отвечает за исследование и развитие танковых технологий. Даже в военное время он работает над прогрессом в области бронетехники и способствует усилению бельгийских бронетанковых сил."

  BEL_doctrinal_innovations2: "Доктринальные инновации"
  BEL_doctrinal_innovations2_desc: "Департамент доктринальных инноваций исследует и разрабатывает бельгийскую военную доктрину. Даже во время войны он создает новую тактику и стратегии для повышения оперативной эффективности и способствует усилению боевой мощи бельгийской армии."

  BEL_antwerp_maritime_academy2: "Антверпенская морская академия"
  BEL_antwerp_maritime_academy2_desc: "Антверпенская морская академия — учреждение, занимающееся исследованием и преподаванием морских технологий и навигации. Даже во время войны она проводит исследования и образовательные программы для повышения эффективности военно-морских операций и способствует усилению потенциала бельгийского флота."

  BEL_early_helicopters2: "Разработка ранних вертолетов"
  BEL_early_helicopters2_desc: "Департамент разработки ранних вертолетов исследует и развивает вертолетные технологии. Даже во время войны он работает над прогрессом в этой области и способствует усилению способности бельгийской армии к воздушным операциям."

  BEL_air_doctrine2: "Доктрина воздушных операций"
  BEL_air_doctrine2_desc: "Департамент доктрины воздушных операций исследует и разрабатывает тактику и стратегию, связанные с воздушными операциями. Даже во время войны он создает новую тактику и стратегии для повышения эффективности воздушных операций и способствует усилению способности бельгийской армии к воздушным операциям."