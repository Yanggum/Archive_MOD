 GEI_pillaging_operations_desc:0 "Мы обеспечиваем необходимые для войны ресурсы путём систематического мародёрства."
 
 GEI_resource_extraction:0 "Извлечение ресурсов"
 GEI_resource_extraction_desc:0 "Мы эффективно извлекаем ресурсы с оккупированных территорий для укрепления нашей промышленности."
 
 GEI_systematic_plunder:0 "Систематическое мародёрство"
 GEI_systematic_plunder_desc:0 "Операции по мародёрству Цвета стали ещё более систематическими."
 
 GEI_colour_sensei_leadership:0 "Командование Сенсея Цвета"
 GEI_colour_sensei_leadership_desc:0 "Исключительные командные способности Сенсея, поражённого Цветом, ведут нашу армию."
 
 GEI_colour_sensei_offensive:0 "Наступление Сенсея"
