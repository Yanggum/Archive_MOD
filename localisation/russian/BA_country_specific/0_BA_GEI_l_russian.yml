 GEI_merge_with_color_category:0 "Слияние с Цветом"
 GEI_merge_with_color_category_desc:0 "Мы можем сливать наших командующих с сознанием Цвета."

 GEI_extract_research_data:0 "Извлечь исследовательские данные"
