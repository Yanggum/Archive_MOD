 GEI_death_goddess:0 "Богиня Смерти"
 GEI_death_goddess_desc:0 "Богиня Смерти, слившаяся с Цветом, усиливает нашу армию."
 
 GEI_goddess_offensive:0 "Наступление Богини"
 GEI_goddess_offensive_desc:0 "Мы получаем наступательную мощь, усиленную силой Богини Смерти."
 
 GEI_goddess_fear:0 "Ужас Богини"
 GEI_goddess_fear_desc:0 "Мы охвачены ужасом, распространяемым Богиней Смерти."

 GEI_student_terror_operations:0 "Операции студенческого ужаса"
 GEI_student_terror_operations_desc:0 "Мы проводим операции по превращению студенток в инструменты Цвета."
 
