 COLOUR_invasion_begins_tt:0 "С помощью §Yрешений§! мы сможем свободно перемещать наш §0центральный регион§! в §1другие регионы§!"
 The_Colour_country_flag:0 "§0Новорождённый свет§!"
 GEI_gingeubcheolsu_tt:0 "§RБудут удалены все гражданские фабрики, военные заводы и верфи [120.GetName].§!"
 GEI_Beatrice_win_flag:0 "§OБеатрис§! восторжествовала"
 GEI_Secure_Royal_Blood:0 "§9Королевская кровь была обеспечена.§!"
 GEI_Fail_Royal_Blood:0 "§tОтряд Ариус бежал.§!"
 GEI_loyeolbeulleodeuhwagbo_tt:0 "Разблокируются решения для §Yпоиска§!, §Yконтакта§! и §Yпохищения§! с целью обеспечения §9Королевской крови§!."
