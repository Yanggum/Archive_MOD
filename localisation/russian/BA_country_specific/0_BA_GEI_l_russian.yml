 GEI_establish_consciousness_training:0 "Создать тренировку сознания"
 GEI_establish_consciousness_training_desc:0 "Мы создаём программу тренировки сознания Цвета для всех командующих."

 GEI_halo_distortion:0 "Искажённый ореол"
