 # События
 GEI_event.1.t:0 "Столкновение мнений"
 GEI_event.1.desc:0 "Члены Гематрии в настоящее время поглощены жаркими дебатами на тему «кто возьмёт на себя инициативу?». Даже спустя несколько часов каждый твёрдо придерживается своей позиции... Примерно через полдня, кажется, наконец достигнут вывод. Победительницей дебатов становится..."
 GEI_event.1.a:0 "...Беатрис победила."
 GEI_event.1.b:0 "...ворвался Декаграмматон."
 GEI_Beatrice_tt:0 "§OБеатрис§! §Yпобедит§! в дебатах."
 GEI_event.2.t:0 "Большой успех"
 GEI_event.2.desc:0 "Отряд Ариус принял наше предложение без малейших подозрений. Нам удалось привести их в Гематрию, и контроль над Отрядом Ариус теперь полностью принадлежит Гематрии."
 GEI_event.2.a:0 "Ну, хорошо."
 GEI_event.2.b:0 "Нам нужна только Королевская кровь."
 GEI_event.3.t:0 "Успех"
 GEI_event.3.desc:0 "Мы попытались связаться с Отрядом Ариус, но они отвергли наше предложение и ответили враждебно. Беатрис и боевые силы смогли победить их и захватить Королевскую кровь живой."
 GEI_event.3.a:0 "Цель достигнута"
 GEI_event.4.t:0 "Провал"
 GEI_event.4.desc:0 "После столкновения с Отрядом Ариус наши силы потерпели поражение. Отряд Ариус бежал из филиала Ариуса в неизвестном направлении, и Гематрия полностью потеряла их след."
 GEI_event.4.a:0 "Возобновить преследование."
 GEI_event.5.t:0 "Обеспечение Королевской крови завершено"
 GEI_event.5.desc:0 "Силы преследования Гематрии обнаружили Отряд Ариус и вступили в бой. Они только что сообщили о победе и о том, что Королевская кровь обеспечена. Теперь мы можем сделать первый шаг ритуала в пользу идеалов Беатрис."
 GEI_event.5.a:0 "Наконец-то мы её поймали."
 GEI_event.6.t:0 "Побег Отряда Ариус"
 GEI_event.6.desc:0 "Силы преследования Гематрии обнаружили Отряд Ариус и вступили в бой, но Отряду удалось прорвать окружение и сбежать. Тем не менее, этот инцидент позволил нам оценить радиус их действий, так что впредь преследование будет гораздо эффективнее."
 GEI_event.6.a:0 "Им не сбежать."
 GEI_event.7.t:0 "Обнаружение"
 GEI_event.7.desc:0 "Поступила информация об обнаружении лиц, предположительно принадлежащих к Отряду Ариус, в городе, не очень далеко от филиала Ариуса. Мы используем эту информацию, чтобы сузить круг поиска и быстрее определить их местоположение."
 GEI_event.7.a:0 "Мы нашли их."
 GEI_event.8.t:0 "Капитуляция Хакари Ацуко"
 GEI_event.8.desc:0 "Сегодня в 4 часа утра Хакари Ацуко сдалась при условии, что мы прекратим преследование остальной части Отряда Ариус. Это не был ожидаемый результат, но, поскольку Королевская кровь уже обеспечена, мы можем остановить преследование и перейти к фазе выполнения ритуала."
 GEI_event.8.a:0 "Неплохо."
 GEI_event.8.b:0 "И всё же мы должны их устранить."
 GEI_event.9.t:0 "Завершение операции"
 GEI_event.9.desc:0 "- Штаб-квартира Гематрии уведомляет все боевые силы о завершении текущей специальной военной операции.\n- Поскольку Королевская кровь обеспечена и больше нет причин продолжать, объявляется о завершении операции.\n\nПодписано в резиденции Гематрии, [GetDateText].\n -Беатрис"
 GEI_event.9.a:0 "Полный успех"
 GEI_event.10.t:0 "Первый ритуал"
 GEI_event.10.desc:0 "\"Даже этого недостаточно...?\"\n\nВо тьме древнего здания раздался женский голос. Это был голос аномальной фигуры, которая, стоя под светом, проходящим через разноцветные витражи в Базилике Ариус — святилище, уцелевшее, несмотря на «Великое Перемещение», — произносила эти слова.\n\n\"...\"\n\nОна замолчала. Некоторое время спустя, словно приведя мысли в порядок, она встала и начала направляться куда-то. Поскольку дела зашли так далеко, она больше не могла оставаться неподвижной; ей придётся действовать."
 GEI_event.10.a:0 "Возникла проблема."
 GEI_event.11.t:0 "Контакт"
 GEI_event.11.desc:0 "\"Ах. Наконец-то. Конец ритуала уже близок.\"\n\nС занавешенными окнами и включённым искусственным освещением Беатрис, одетая в лабораторный халат, говорила в Базилике Ариус, окружённая бесчисленным исследовательским оборудованием.\n\n\"Зачем... почему я дошла до этого? Кивотос исчез, и всё, что я знала, перевернулось, и всё же...\"\n\nБеатрис размышляла вслух, бросая вопросы без ответа в пустоту. Однако она уже приняла решение. С непоколебимой решимостью она быстро пришла к выводу.\n\n\"Но там... есть путь.\""
 GEI_event.11.a:0 "Мы можем только идти вперёд."
 GEI_event.12.t:0 "Дебаты о государстве"
 GEI_event.12.desc:0 "\"То есть, мы не должны брать на себя роль правительства.\"\n\nЧеловек в чёрном изложил своё мнение. Он утверждает, что Гематрия должна оставаться исследовательским институтом, в то время как Беатрис, основываясь на своём опыте управления Автономным районом Ариус, утверждает, что Гематрия должна управлять государством.\n\n\"...Значит, ты предлагаешь не вмешиваться в эту ситуацию?\"\n\"Нет, я говорю, что наш долг...\"\n\"Ха. Разве наш долг не потерял смысл в тот момент, когда мы пересекли границу в этот мир?\"\n\n..."
 GEI_event.12.a:0 "Беатрис одержала победу после долгого времени."
 GEI_event.13.t:0 "Дебаты об экономической политике"
 GEI_event.13.desc:0 "Решив управлять государством в соответствии с предложением Беатрис, Гематрия теперь сталкивается с трудностью. Ни у кого нет опыта управления «экономикой», что вызвало проблемы при определении национальной политики.\n\nХмм... не могли бы мы попросить экономического совета у Кайзера?"
 GEI_event.13.a:0 "Хорошо, выполните немедленно."
 GEI_event.14.t:0 "Обеспечение военной силы"
 GEI_event.14.desc:0 "\"Чтобы справиться с этой хаотичной ситуацией, нам нужно больше военной мощи!\"\n\nБеатрис, самый жёсткий голос в дебатах, повысила голос. В противовес, Голконда и Декалькомания возражают, что их клонированных сил достаточно для обеспечения обороны.\n\n\"Разве я уже не говорил, что своими способностями могу без проблем защитить Гематрию?\"\n\"Это значит, что их мало по численности! Армии этого мира подавляюще многочисленны! Мы в невыгодном положении.\"\n\"Но Британские острова — это острова, верно? Не думаю, что нужна такая большая армия.\"\n\n..."
 GEI_event.14.a:0 "Позиция Беатрис кажется правильной."
 GEI_event.14.b:0 "Верные армии Голконды и Декалькомании всегда были нашей силой."
 GEI_event.15.t:0 "Аномалия"
 GEI_event.15.desc:0 "\"Мадам, что, чёрт возьми, вы наделали? Это... можно остановить?\"\n\"...\"\n\"Я вижу. Цвет нашёл нас.\"\n\nВ подземной лаборатории, перед межпространственным буром, члены Гематрии горячо обсуждают результаты «эксперимента по межпространственному бурению» Беатрис. Беатрис, вцепившись в своё уже повреждённое тело, не может вымолвить ни слова.\n\n\"Итак, есть ли какое-то решение?\"\n\"...Проход продолжает расширяться. Он полностью вышел из-под нашего контроля.\"\n\"Мадам, этот эксперимент — явный провал. Сейчас не время искать виноватых, мы должны немедленно эвакуироваться...\"\n\nВ этот момент раздаётся оглушительный грохот, а затем... никого нет.\n\n..."
 GEI_event.15.a:0 "НЕТ ДАННЫХ"
 GEI_event.16.t:0 "Вторжение"
 GEI_event.16.desc:0 "Предварительный контент: что-то о святилище пустоты, падающем с неба на Гематрию."
 GEI_event.16.a:0 "НЕТ ДАННЫХ"
 GEI_event.17.t:0 "Массовая галлюцинация"
 GEI_event.17.desc:0 "После интенсивной вспышки, осветившей небо, большинство лишь почувствовало лёгкую головную боль, но некоторые проявили спутанность сознания и крайнюю агрессивность. Вскоре они сформировали группы и начали атаковать нас."
 GEI_event.17.a:0 "Психическая атака..."
 GEI_event.18.t:0 "За морем"
 GEI_event.18.desc:0 "Свет Цвета начал пересекать Атлантику и освещать Северную Америку. Чувствуется, что истинный конец света приближается мало-помалу."
 GEI_event.18.a:0 "..."
 GEI_event.19.t:0 "Апостолы в жёлтых одеяниях"
 GEI_event.19.desc:0 "Пока наши силы сражаются на фронте, с тыла начали поступать тревожные сообщения. Появились личности в жёлтом, называющие себя апостолами."
 GEI_event.19.a:0 "Расследуй, что происходит."
 GEI_event.19.b:0 "Наш бог ждёт нас!"
 GEI_event_19_tt:0 "§0В последующей цепочке событий вы будете играть на стороне Жёлтых Культистов во время гражданской войны.§!"
 GEI_event.20.t:0 "Жёлтый марш"
 GEI_event.20.desc:0 "Апостолы в жёлтых одеяниях провели марши по всей территории Соединённых Штатов. Активные в течение нескольких месяцев, их число значительно выросло. Во время маршей они занимали главные проспекты, произнося непонятные слова и вызывая значительный военный хаос. Эти действия препятствовали военным операциям США, всё больше затрудняя ответ на атаки Цвета."
 GEI_event.20.a:0 "Чего они на самом деле хотят?"
 GEI_event.21.t:0 "§0Борьба с безумцами§!"
 GEI_event.21.desc:0 "Эти безумцы, называющие себя Апостолами в жёлтых одеяниях, выросли в числе под руководством Лавкрафта. Хотя они находились под строжайшим наблюдением федерального правительства, мы опоздали.\n\nВ рамках плана по сокрушению Соединённых Штатов — нации, пережившей целые страницы истории — они силой свергли правительства штатов и провозгласили вторую декларацию независимости внутри Союза, начав восстание.\n\nПосле этой быстрой череды событий крах Союза опасно приближается, угрожая Америке и, более того, всему миру.\n\nОни требуют немедленной капитуляции перед Цветом, называя президента [USA.GetLeader] отступником и антихристом. Кроме того, сформированный ими '§0Апостольский совет§!' начал противостоять федеральной армии, объявляя любые военные действия правительства неприемлемыми.\n\nВ заключение, выстрелы снова звучат на американском континенте, и миллионы, которые ещё вчера вместе танцевали и ели, теперь берутся за оружие, чтобы защищать свои флаги.\n\nСудьба Соединённых Штатов... только время покажет."
 GEI_event.21.a:0 "К оружию!"
 GEI_event.22.t:0 "Распространение безумия"
 GEI_event.22.desc:0 "Несколько соседних штатов присоединились к мятежным безумцам, и нам не удалось сдержать распространение безумия."
 GEI_event.22.a:0 "Проклятье."
 GEI_event.25.t:0 "Поражённый генерал"
 GEI_event.25.desc:1 "По причине психической нестабильности генерал [From.GetName] подал в отставку. Хотя из-за чрезвычайной ситуации она была отклонена, ходят слухи, что его психическое состояние действительно вызывает беспокойство.\n\nПохоже, наш враг способен вызывать безумие у людей."
 GEI_event.27.t:0 "Соединённые Штаты в изгнании"
 GEI_event.27.desc:0 ""
 GEI_event.27.a:0 "У нас что-нибудь осталось?"
