 GEI_dimensional_operations:0 "Межпространственные операции"
 GEI_dimensional_operations_desc:0 "Мы можем проводить специальные операции с помощью межпространственных порталов."
 
 GEI_dimensional_warfare:0 "Межпространственная война"
 GEI_dimensional_warfare_desc:0 "Мы ведём новую форму войны, используя межпространственные порталы."
 
 GEI_door_network:0 "Сеть межпространственных порталов"
 GEI_door_network_desc:0 "Установлена стратегическая сеть межпространственных порталов."
 
 GEI_dimensional_door_operations:0 "Операции с межпространственными порталами"
 GEI_dimensional_door_operations_desc:0 "Мы можем выполнять различные военные операции с помощью межпространственных порталов."

 # События
 GEI_event.28.t:0 "Вторжение Цвета"
 GEI_event.28.d:0 "Неизвестный феномен начал проявляться по всему миру. Странный разноцветный свет и случаи исчезновений происходят всё чаще."
 GEI_event.28.a:0 "Это зловещее предзнаменование..."

 GEI_event.29.t:0 "Исчезновение исследователей"
 GEI_event.29.d:0 "В исследовательских центрах по всей стране исследователи внезапно исчезают. Не остаётся ничего, кроме странного следа Цвета."
 GEI_event.29.a:0 "Наши знания в опасности"

 GEI_event.30.t:0 "Трансформация Цвета"
 GEI_event.30.d:0 "Население оккупированных земель претерпевает странные изменения. Их внешность всё больше напоминает Цвет."
 GEI_event.30.a:0 "Это эволюция к новому существованию"

 # Заголовки событий
 GEI_event.31.t:0 "Сеть Цвета завершена"
 GEI_event.31.d:0 "Наконец мы завершили строительство сети Цвета в глобальном масштабе. Теперь все сущности, поражённые Цветом, соединены в едином сознании."
 GEI_event.31.a:0 "Мы стали единым целым"

 GEI_event.32.t:0 "Внедрение в исследовательские центры"
 GEI_event.32.d:0 "Неизвестная сущность проникла в наши исследовательские центры. Исчезают важнейшие данные."
 GEI_event.32.a:0 "Мы должны остановить это"

 GEI_event.33.t:0 "Улучшение Декаграмматона"
 GEI_event.33.d:0 "Завершена разработка нового снаряжения для Декаграмматона. Оно продемонстрирует гораздо более высокую боеспособность, чем раньше."
 GEI_event.33.a:0 "Идеальная эволюция"

 GEI_event.34.t:0 "Сеть межпространственных порталов установлена"
 GEI_event.34.d:0 "Сеть межпространственных порталов успешно построена. Теперь мы можем мгновенно достичь любого места."
 GEI_event.34.a:0 "Пространство больше не является ограничением"

 GEI_event.35.t:0 "Внезапная атака через межпространственный портал"
 GEI_event.35.d:0 "Через межпространственный портал, возникший из ниоткуда, вражеские силы проникли глубоко на нашу территорию."
 GEI_event.35.a:0 "Невозможно подготовиться к такой угрозе"

 GEI_event.36.t:0 "Развращение Студенческого совета"
 GEI_event.36.d:0 "Влияние Цвета распространилось на весь Студенческий совет. Теперь они — идеальный инструмент для воплощения нашей воли."
 GEI_event.36.a:0 "Школа теперь наша"

 GEI_event.37.t:0 "Развращение ореола"
 GEI_event.37.d:0 "Неизвестный Цвет развращает ореолы наших студенток. Их боеспособность стремительно падает."
 GEI_event.37.a:0 "Мы должны остановить это развращение"

 GEI_event.38.t:0 "Проявление силы богини"
 GEI_event.38.d:0 "Богиня Смерти высвободила всю свою силу. Наши силы обрели несравненную мощь."
 GEI_event.38.a:0 "Победа за нами"

 GEI_event.39.t:0 "Ужас смерти"
 GEI_event.39.d:0 "Ужас, распространяемый Богиней Смерти, парализует нашу армию. Мораль войск падает."
 GEI_event.39.a:0 "Мы должны преодолеть этот ужас"

 GEI_event.40.t:0 "Отряды мародёров организованы"
 GEI_event.40.d:0 "Завершена организация профессиональных отрядов мародёров. Теперь мы сможем грабить ресурсы врага с большей эффективностью."
 GEI_event.40.a:0 "Несите всё"

 GEI_event.41.t:0 "Атака на военные объекты"
 GEI_event.41.d:0 "Неизвестные подразделения Цвета атаковали наши военные объекты. Похищено большое количество снаряжения и ресурсов."
 GEI_event.41.a:0 "Наша сила ослабла"

 GEI_event.42.t:0 "Анализ тактического ИИ"
 GEI_event.42.d:0 "Передовая система ИИ врага в совершенстве анализирует нашу тактику. Каждое наше движение предугадывается."
 GEI_event.42.a:0 "Мы никогда не сталкивались с таким"

 GEI_event.43.t:0 "Тень нависает"
 GEI_event.43.d:0 "Неизвестные тени проникают за наши границы. Присутствие невидимого врага погружает наше население в ужас."
 GEI_event.43.a:0 "Мы должны остановить этот страх"
 
 GEI_event.44.t:0 "Окрашивание промышленных объектов"
 GEI_event.44.d:0 "Наши фабрики окрашиваются в странный цвет. Рабочие в замешательстве, производственные линии медленно останавливаются."
 GEI_event.44.a:0 "Это выходит из-под контроля"
 
 GEI_event.45.t:0 "Финальное наступление"
 GEI_event.45.d:0 "Армия Цвета начала наступление беспрецедентного масштаба. Небо окрасилось в странные цвета, и наши оборонительные линии рушатся за считанные мгновения."
 GEI_event.45.a:0 "Неужели это конец?"

 GEI_event.46.t:0 "Коллапс промышленных объектов"
 GEI_event.46.d:0 "Промышленные объекты, поражённые Цветом, начали разрушаться от перегрузки. Производственные линии остановились, рабочие впали в панику."
 GEI_event.46.a:0 "Мы не можем это контролировать"

 GEI_event.47.t:0 "Истощение ресурсов"
 GEI_event.47.d:0 "Из-за безудержной добычи шахты и нефтяные скважины начинают истощаться. Подземные структуры становятся нестабильными."
 GEI_event.47.a:0 "Нам нужно больше ресурсов"

 GEI_event.48.t:0 "Тень проникает"
 GEI_event.48.d:0 "Странные тени просачиваются на нашу территорию. Невидимый страх охватывает наше население."
 GEI_event.48.a:0 "Мы должны остановить этот ужас"

 GEI_event.49.t:0 "Реальность шатается"
 GEI_event.49.d:0 "Реальность начала искажаться. Мир, который мы знали, рушится."
 GEI_event.49.a:0 "Это кошмар?"

 GEI_researcher_absorption_operations:0 "Операции по поглощению исследователей"
