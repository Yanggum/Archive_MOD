 idea_BA_crisis_flood_of_machines_2_failed_1_desc: "Почему? Они, зависящие от машин, не должны выдерживать нашу способность к 'обращению'. Так почему же…?"

 BA_crisis_flood_of_machines_2_mission_week: "Завоевание Миллениума затягивается"
 BA_crisis_flood_of_machines_2_mission_week_desc: ""
 idea_BA_crisis_flood_of_machines_2_failed_2: "Серьёзная ошибка"
 idea_BA_crisis_flood_of_machines_2_failed_2_desc: "Сопротивление Школы наук Миллениума превосходит прогнозы. Каким-то методом они препятствуют нашему 'обращению' и отвечают аналоговой войной, мобилизуя местное человечество. Поиск контрмер... провален. Повторение стандартных операций.\n\n...Заключение: Миллениум должен капитулировать."

