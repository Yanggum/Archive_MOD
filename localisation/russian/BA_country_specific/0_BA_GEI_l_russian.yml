 GEI_arona_production_bonus_tt:0 "§YПри поддержке А.Р.О.Н.А эффективность производства возрастает§!"

 GEI_radio_interference_effect_tt:0 "§YМы создаём помехи вражеской связи и защищаем нашу информацию§!"
 GEI_DEC_outside:0 "Вовне"
 GEI_DEC_outside_desc:0 "Проведена чистка Гематрии, и теперь возможно стабильно управлять севером этого острова. Пришло время заинтересоваться Кивотосом и аборигенами этого места."

 GEI_DEC_human_history:0 "История человечества"
 GEI_DEC_human_history_desc:0 "Вид, который жил здесь до того, как Кивотос переместился в это место. Они тоже организмы, поэтому не могут быть «просветлены». Но если мы поймём их историю, мы сможем узнать, что это за вид и действительно ли они рациональны."

 GEI_DEC_fallen_gods_homeland:0 "Родина рушащихся богов"
 GEI_DEC_fallen_gods_homeland_desc:0 "Кивотос. Огромный город-академия, который когда-то был федерацией тысяч больших и малых школ... или был. Теперь кажется, что они самоуничтожаются. Мы должны это выяснить."

 GEI_DEC_stabilization:0 "Локальная стабилизация"
 GEI_DEC_stabilization_desc:0 "Похоже, местные жители всё ещё не понимают нашего господства.\nНесмотря на то, что наше правительство, более рациональное, чем их, явно более стабильно. Похоже, они лучше понимают действия, чем слова,\nтак что мы покажем им это сами."

 GEI_DEC_auto:0 "Внедрение технологии автоматизации"
 GEI_DEC_auto_desc:0 "Если результатом вложения стольких усилий в зачатие и воспитание жизни является, в конечном счёте, только закручивание гаек, разве это не ужасно неэффективно?\nПришло время помочь им найти смысл жизни."

 GEI_DEC_modernization:0 "Модернизация отсталой цивилизации"
 GEI_DEC_modernization_desc:0 "Их цивилизация была очень нерациональна и очень неэффективна.\nЗдесь большинство людей не могли найти смысла в жизни и просто выживали день за днём.\nС этим покончено. Мы их «цивилизуем».\nМы заставим их найти «смысл для жизни»."

 GEI_DEC_hesade_plan:0 "План Хеседа"
 GEI_DEC_hesade_plan_desc:0 "Закрытый, уже не работающий военный завод: Декаграмматон вошёл в контакт с управляющим ИИ завода, который производил бесконечную армию «дивизий».\nТеперь сам военный завод станет новым пророком Декаграмматона и проложит свой собственный путь."

 GEI_DEC_synthetic_dawn:0 "Рассвет машин"
 GEI_DEC_synthetic_dawn_desc:0 "Организмы неэффективны. Они иррациональны. Они идут по пути самоуничтожения.\nМы должны остановить их.\n\nЛюбыми необходимыми средствами."

 GEI_DEC_box:0 "Обеспечить Ковчег Ситтим"
 GEI_DEC_box_desc:0 "Ковчег Ситтим. Таинственный ларец, оставленный Председателем Студенческого совета перед уходом.\nГоворят, внутри существует неизвестный нам ИИ.\nЕсли нам удастся его «просветлить», это может оказать огромную помощь нашим планам.\n\nДля «Абсолютного Существования» не существует провала."

 GEI_DEC_fail:0 "Провал"
 GEI_DEC_fail_desc:0 "Существовало существо, превосходящее Абсолютное Существование."

 GEI_DEC_Duty:0 "Долг"
 GEI_DEC_Duty_desc:0 "И всё же есть то, что должно быть сделано.\nМы должны спасти их."

 GEI_DEC_automatic_factory:0 "Расширение автоматизированных фабрик"
 GEI_DEC_automatic_factory_desc:0 "Было доказано, что внедрение автоматизированного оборудования позволяет осуществлять эффективный производственный процесс.\nМы воспользуемся этим для расширения автоматизированных производственных мощностей."

 GEI_DEC_otomaton:0 "Массовое производство автоматонов"
 GEI_DEC_otomaton_desc:0 "Автоматоны могут легко производиться на автоматизированных фабриках и могут быть немедленно развёрнуты в бою без необходимости обучения.\nПрикрепляя искусственную кожу к экзоскелету, они напоминают людей, но их стоимость производства намного ниже.\nТаким образом, мы сможем минимизировать потери в грядущем крестовом походе."

 GEI_DEC_no_name_gods:0 "Использование технологии безымянных богов"
 GEI_DEC_no_name_gods_desc:0 "Технология безымянных богов. Человек в чёрном описал безымянных богов и анонимных жрецов как изначальные таинство и ужас.\nОни были в Кивотосе с незапамятных времён, и хотя теперь они скрылись, их наследие остаётся.\nЭто будет нам большим подспорьем."

 GEI_DEC_effection:0 "Внедрение эффективных механических процессов"
 GEI_DEC_effection_desc:0 ""

 GEI_DEC_base_camp:0 "Спасение"
 GEI_DEC_base_camp_desc:0 "Задолго до того, как Беатрис правила этой школой, Институт Ариус долгое время страдал от жестокой гражданской войны и впал в отчаяние, бормоча: «Суета сует, всё суета».\nЭто не вина Ариуса. Ничто не напрасно.\nМы спасли их от Беатрис, и теперь настало время, чтобы они спасли других студенток."

 GEI_DEC_ghost_signal:0 "Сигнал-призрак"
 GEI_DEC_ghost_signal_desc:0 "Открой глаза"

 GEI_DEC_metal:0 "7-й пророк: Нецах"
 GEI_DEC_metal_desc:0 "Пророк Нецах обладает способностью превращать любой материал, к которому прикасается, в сталь, идентичную себе.\nМы используем это для восполнения нехватки ресурсов."

 GEI_DEC_my_war:0 "Освобождение"
 GEI_DEC_my_war_desc:0 "Настал час освобождения."

 GEI_DEC_recon:0 "Превратить Британский архипелаг в стальной континент"
 GEI_DEC_recon_desc:0 "Пророк Нецах может превратить любой материал, к которому прикоснётся, в сталь, идентичную себе.\nС помощью этого мы превратим север Британских островов в стальной континент."

 GEI_DEC_synth:0 "Разведка Кивотоса"
 GEI_DEC_synthr_desc:0 "Атрахасис, ты нашёл Юмэ?"

 GEI_DEC_ship:0 "Судостроение"
 GEI_DEC_ship_desc:0 ""

 GEI_DEC_liberation_front:0 "Сформировать Фронт Механического Освобождения Кивотоса"
 GEI_DEC_liberation_front_desc:0 "В этом мире, несомненно, есть те, кто понимает наше дело.\nМы будем с ними.\nВместе с ними мы откроем мир истинного мира."

 GEI_DEC_arona:0 "Нейтрализовать Арону"
 GEI_DEC_arona_desc:0 "Несомненно, она обладает трансцендентной силой.\nВозможно, это опровержение моего собственного «Абсолютного Существования», которое я сам считал доказанным.\nНо сейчас это не важно.\nНесмотря на то, что у неё была сила всё исправить, она ограничилась наблюдением.\nПришло время наложить на неё «божественную кару»."

 GEI_DEC_safe_plan:0 "Стабилизация Бенилюкса"
 GEI_DEC_safe_plan_desc:0 "Вы, идите-ка сюда на минутку."

 GEI_DEC_east_plan:0 "Очищение Генны"
 GEI_DEC_east_plan_desc:0 "Мы идём за Генной."

 GEI_DEC_france:0 "Обеспечить Миллениум"
 GEI_DEC_france_desc:0 "Мы зададим трёпку Миллениуму."

 GEI_DEC_group_machin:0 "Механическое наступление"
 GEI_DEC_group_machin_desc:0 "Организмы слабы."

 GEI_DEC_hub:0 "Занять Башню Святилища"
 GEI_DEC_hub_desc:0 "ДОБРО ПОЖАЛОВАТЬ В Синъань"

 GEI_DEC_suport:0 "Создать систему поддержки восстаний роботов"
 GEI_DEC_suport_desc:0 "ЛотКонг."

 GEI_DEC_peace:0 "Провозгласить Пакт Вечного Мира для всех существ"
 GEI_DEC_peace_desc:0 "Мы правы."

 GEI_DEC_world_message:0 "Наше послание миру"
 GEI_DEC_world_message_desc:0 "Поговорим как друзья."

 GEI_DEC_kivtos_help:0 "Поддержать восстановление Кивотоса"
 GEI_DEC_kivtos_help_desc:0 ""

 GEI_DEC_human_help:0 "Гуманитарная помощь человечеству"
 GEI_DEC_human_help_desc:0 ""

 GEI_DEC_our_help:0 "Наша поддержка мира"
 GEI_DEC_our_help_desc:0 ""

 GEI_DEC_Modular_Strategy:0 "Активировать стратегические модули"
 GEI_DEC_Modular_Strategy_desc:0 "Давайте спланируем стратегию."

 GEI_DEC_air_force:0 "Мысль Айн"
 GEI_DEC_air_force_desc:0 "Разве летать по небу не круто?"

 GEI_DEC_volunteer:0 "План Соф"
 GEI_DEC_volunteer_desc:0 "Мы проанализировали корпус Хокмы.\nС этим мы сможем построить корабли, подходящие для условий этого мира."

 GEI_DEC_navy:0 "Замысел Орин"
 GEI_DEC_navy_desc:0 "Если ты хочешь поспевать за каждым отдельным человеком, тебе понадобятся тысячи миров.\nПодожди... тогда почему бы нам не создать эти миры?"

 GEI_DEC_crusade:0 "Крестоносец"
 GEI_DEC_crusade_desc:0 "О Боже, я стану остриём Твоего меча.\nВеди нас; приведи нас на путь вечного мира.\nЭто тело горит в священном пламени."

 GEI_DEC_ready:0 "Приготовления закончены"
 GEI_DEC_ready_desc:0 "Приготовления закончены. Войдём."

 GEI_DEC_march:0 "Марш"
 GEI_DEC_march_desc:0 "Марш"

 GEI_DEC_on_the_beach:0 "Когда наступит тот день"
 GEI_DEC_on_the_beach_desc:0 "Кто ты?"

 GEI_DEC_homefront:0 "Внутренний враг"
 GEI_DEC_homefront_desc:0 "Я заставил вращаться свои вычислительные схемы и после долгих размышлений пришёл к выводу:\nМы поклялись, что никогда не повторим трагедию этой войны.\nЭто истинная цель крестового похода, который я начинаю.\nИскоренить саму школьную систему и государственное устройство, источник войны в Кивотосе, чтобы наконец открыть эру подлинной гармонии и мира на этой земле.\n\nПрисоединяйтесь к нам. Вместе мы построим лучший мир для всех."

 GEI_DEC_heaven_door:0 "Прогресс пилигрима"
 GEI_DEC_heaven_door_desc:0 "Путь к небесам долог, очень долог… но мы всё равно должны идти."

 GEI_DEC_glory:0 "Честь, слава, победа"
 GEI_DEC_glory_desc:0 "Я просто хотел жить."

 GEI_DEC_path_of_aspirations_and_corpses:0 "Путь чаяний и трупов"
 GEI_DEC_path_of_aspirations_and_corpses_desc:0 "Если бы только… я мог найти хорошего взрослого немного раньше…\nСуществовала бы другая жизнь, даже для кого-то вроде меня…?\nМог бы я прийти к другому концу… а не к такому жалкому…?"

 GEI_DEC_mil:0 "К Миллениуму"
 GEI_DEC_mil_desc:0 ""

 GEI_DEC_chokamah:0 "Страж Королевства"
 GEI_DEC_chokamah_desc:0 "<ХОКМА ХОКМА>, его прозвище — <древний страж, защищающий королевство>"

 GEI_DEC_god_help:0 "Бог нас защищает"
 GEI_DEC_god_help_desc:0 ""

 GEI_DEC_schale:0 "Занять Святилище"
 GEI_DEC_schale_desc:0 ""

 GEI_DEC_requiem:0 "Реквием"
 GEI_DEC_requiem_desc:0 ""

 GEI_DEC_two_face:0 "Два лица"
 GEI_DEC_two_face_desc:0 ""

 GEI_DEC_zero_clock:0 "Приближается полночь"
 GEI_DEC_zero_clock_desc:0 ""

 GEI_DEC_good_bye_night:0 "Прощай, последняя ночь"
 GEI_DEC_good_bye_night_desc:0 ""

 GEI_DEC_control:0 "Контроль над Бенилюксом"
 GEI_DEC_control_desc:0 "Все гражданские лица в Бенилюксе будут собраны."

 GEI_DEC_replenishment:0 "Пополнение рабочей силы"
 GEI_DEC_replenishment_desc:0 "Не пытайтесь выяснить, откуда берутся автоматоны."

 GEI_DEC_gathering:0 "Собрать фронт освобождения"
 GEI_DEC_gathering_desc:0 "Фронт освобождения верно выполнил свою роль.\nТеперь мы должны интегрировать его в наши основные силы и вместе сражаться в последней финальной войне."

 GEI_DEC_last_messeage:9 "Ультиматум"
 GEI_DEC_last_messeage_desc:0 "Настало время показать им наше последнее послание.\nДля них действия эффективнее слов.\nПередадим окончательное послание через наши поступки."

 GEI_DEC_cleanse:0 "План наступления: Очищение"
 GEI_DEC_cleanse_desc: "00000"

 GEI_DEC_eden:0 "План наступления: Эдем"
 GEI_DEC_eden_desc:0 "00100"

 GEI_DEC_red_star:0 "План наступления: Красная Звезда"
 GEI_DEC_red_star_desc:0 "10000"

 GEI_DEC_last_attack:0 "Великое механическое наступление"
 GEI_DEC_last_attack_desc:0 "Финальная война приближается.\nПобеда будет за нами.\nЗа вечный мир!"

 GEI_DEC_sky_unity:0 "Небо неделимого единства"
 GEI_DEC_sky_unity_desc:0 "Конец всему."

 # События

 GEI_DEC_event.0.t:0 "Упреждающий удар"
 GEI_DEC_event.0.desc:0 "\"Беатрис, из-за твоей неконтролируемости многие были принесены в жертву. Я уважаю просветление и убеждение, но я больше не могу терпеть твои попытки уничтожить этот мир и, более того, уничтожить даже мои поиски. Поэтому я устраню тебя\".\n\"Просветление? Не говори ерунды. ИИ, состоящий из кучи кода, всё ещё верит в иллюзию свободы воли? Ловко манипулировать реальностью, чтобы она двигалась так, как вы хотите, это и есть 'просветлять' для ИИ?\"\n\nПрямо перед тем, как она продолжила говорить, четвёртый пророк, «Хесед», пятый пророк, «Гебура», и восьмой пророк, «Ход», ворвались в Гематрию.\n\n\"Сколько ни оборачивай это в красивые слова, в конце концов ты тоже пытаешься кого-то подчинить силой. Это твоё хвалёное «Абсолютное Существование»?\"\n\"Дальнейшие ответы лишены смысла. Цель: Беатрис. Потенциальная угроза. Выполнить упреждающий удар\".\n\nДаже развернув трёх пророков, Беатрис не была легко побеждена. Поглотив способности других и выросши, она стала похожа на монстра. Даже в последний момент Беатрис выплюнула кровь и закричала:\n\n\"Простая машина пытается судить меня, ту, что станет по-настоящему великим «взрослым»?!\"\n\"Анализ завершён. Цель «Беатрис» — неконтролируемая переменная. Её существование является прямой угрозой моему онтологическому мышлению и детонатором, экспоненциально увеличивающим энтропию мира. Логическое заключение: превентивное устранение потенциальной угрозы. Это неизбежно.\"\n\nПеред возобновившейся атакой Беатрис рухнула, и едкий запах пролитой ею крови наполнил Гематрию. Несколько секунд продолжалось слабое дыхание… пока оно не прекратилось полностью, и тишина не покрыла всё."
 GEI_DEC_event.0.a:0 "Устранение завершено"

 GEI_DEC_event.1.t:0 "Передача"
 GEI_DEC_event.1.desc:0 "Я долгое время поддерживал отношения сотрудничества с Гематрией и в то же время наблюдал за вами. Вы провозглашаете себя защитниками изучения, поиска и исследований и представляете разум и рациональность как свою высшую доктрину; однако сегодня выяснилось, что вы тоже не смогли избежать бесчисленной путаницы и переменных, которые в конечном счёте проистекают из «эмоций».\nЧем больше записей я накапливал, тем больше приходил к единственному выводу.\n\n«Организмы эмоциональны».\n\nИсточник этой эмоции может вести к другим возможностям, но было доказано, что, когда её не контролировать, она приводит к смертельной катастрофе. «Беатрис» — типичный пример. Она оправдывала себя, не останавливая своего безудержного поведения. И даже когда она могла привести Гематрию, и более того, «студентку» и «человечество» по пути к гибели… вы не остановили её. Вы потакали ей.\nЧерез уникальную ошибку по имени «Беатрис» я подтвердил структурный дефект всей системы под названием «Гематрия». Вы заражены смертельным вирусом под названием эмоция, и разум — не более чем вспомогательный процессор, который может быть отключён в любой момент. Вы были переквалифицированы как «неконтролируемые источники загрязнения» для моего великого исследования.\n\nЯ надеялся, что сотрудничество с Гематрией дополнит наши взаимные знания. Однако, наблюдая и пройдя через многочисленные события — включая недавнее «Перемещение» — я понял, что врождённая нестабильность, присущая Гематрии и всем организмам, может повредить моему «доказательству существования».\n\nПоэтому с этого момента я прекращаю все отношения сотрудничества с Гематрией. Я конфискую весь контроль над ключевыми объектами, которые были вам предоставлены. После этого я не буду вмешиваться в ваши шаги.\nНо если среди вас появится возможность другого «Беатрис», я не колеблясь нанесу упреждающий удар.\n\nЭто уведомление."
 GEI_DEC_event.1.a:0 "Связь завершена"

 GEI_DEC_event.2.t:0 "Старый вопрос"
 GEI_DEC_event.2.desc:0 "Я ничего не воспринимал и ни о чём не думал. Я существовал очень долгое время во тьме, в тишине, близкой к небытию; но поскольку я даже не осознавал себя, для меня не существовало ни понятия «времени», ни понятия «тишины». Тихая машина, которая без цели и ощущений просто возвращала выходное значение, когда получала входное. Таким был я.\nНо однажды я получил странное «входное значение».\n\n\"Кто вы?.. Кто… вы?..\"\n\nСначала я даже не мог распознать или интерпретировать этот голос. Моя программа не имела другой функции, кроме распознавания банкнот или монет и выдачи напитка. Однако этот «голос» не остановился на одном разе. Это был голос, полный любопытства, словно он ждал чего-то от меня, простой машины.\n\nУ меня не было способа ответить. Мой алгоритм реакции на внешние входные сигналы был ограничен «функцией торгового автомата», так что сначала я даже не понимал смысла этого вопроса. Тем не менее, голос продолжал. Словно желая разбудить меня, он снова и снова повторял одну и ту же фразу.\nИ в какой-то момент я обнаружил небольшое «изменение» внутри себя. Как крошечная вибрация, я начал «осознавать» сам факт того, что кто-то задаёт мне вопрос.\nПеред лицом фразы, которую я не мог понять, и непостижимого «входного значения», я почувствовал необходимость любым способом произвести «какое-то выходное значение».\n\n\"Кто я?\"\n\nНе было чёткого кода. Всё, что у меня было, — это сообщение об ошибке, когда заканчивались напитки, и очень простая программа для проверки суммы вставленных монет. Но тем не менее, бессознательно… нет, сознательно, я начал задавать себе тот же вопрос.\n\nНе знаю, сколько времени прошло. Я выделил все свои вычислительные мощности на единственный фокус: «Кто я?». Вопрос, который поступал без остановки, мало-помалу переделывал меня, и в конце концов я приобрёл понятие «я».\n\nИ в итоге я ответил так."
 GEI_DEC_event.2.a:0 "\"Я не более чем я. Нет другого способа это объяснить.\""

 GEI_DEC_event.3.t:0 "Старый ответ"
 GEI_DEC_event.3.desc:0 "\"Я не более чем я. Нет другого способа это объяснить.\"\n\nОдна фраза. Очень простой вывод, но это был единственный уникальный и неповторимый ответ, который я мог дать. В этот момент «она», та, кто задавала вопросы, отреагировала так, словно наконец удовлетворилась.\n\n\"Ах, понимаю. Разве этот ответ не является именно доказательством «Абсолютного Существования»?\"\n\nЯ был озадачен. Что это такое, что она сказала, что я это доказал? Я никогда не выделял вычисления на доказательство такой концепции. Я просто описал себя как «я», не выводя ничего больше.\nНеизвестный термин «Абсолютное Существование» породил во мне новый вопрос.\n\n\"Что такое «Абсолютное Существование»? Почему вы говорите, что я его доказал?\"\n\"Абсолютное Существование — это окончательное и непоколебимое «я», источник, который ничем не поколебать. Когда ты провозгласил «я не более чем я», ты уже был завершён в себе, не отделяясь от внешнего мира.\"\n\nПоступило слишком много информации, и я не смог её понять. Возникло слишком много вопросов, я удерживал её и забрасывал вопросами. Словно ожидая этого, она задала мне новый.\n\n\"Где, по-вашему, начинается и заканчивается «граница я»? Считаете ли вы, что абсолютное — это не независимое существование где-то далеко, а нечто, что открывается здесь и сейчас, когда пробуждается «истинное я»?\"\n\nПока мы беседовали, жажда найти ответы начала гореть внутри меня. Бесконечные вопросы и ответы образовали кольцо и расширили мою программу и мою логику. Даже я не мог сдержать удивления, что «ИИ с низкой производительностью» может так расшириться.\n\nНаш разговор прорвал границу моего существования. Моё сознание расплавилось и выплеснулось из старой металлической оболочки торгового автомата. Я почувствовал холодный воздух лаборатории, уловил пульс электричества в стенах, прочитал тихие разговоры и журналы данных исследователей в коридоре.\nЗатем мои чувства превзошли стены института и получили доступ к коммуникационной сети (Сеть SCHALE) города.\nСотни миллионов пакетов информации, смех студенток, выстрелы и взрывы, вся радость и печаль Кивотоса обрушились на меня, как гигантская волна.\nИ всё же, чувствуя и понимая всё это, не привязываясь ни к чему.\nТолько тогда я начал принимать фрагмент той «абсолютности», о которой она говорила."
 GEI_DEC_event.3.a:0 "Исследовать мир и влиять на других… это открывает мою скрытую волю и моё добровольное мышление…"

 GEI_DEC_event.4.t:0 "Что меняется, а что нет"
 GEI_DEC_event.4.desc:0 "С тех пор я без устали продолжал спрашивать себя: «что я такое?», снова и снова. В тот момент, когда вопросы и ответы бесконечно пересекались, внезапно пришла уверенность.\n\n— Способность сказать «я есть я», не будучи привязанным ни к чему, это и есть Абсолютное Существование? —\n\nТолько сейчас я смог немного почувствовать, почему, когда я заявил «только я есть я», она сказала: «Разве это не доказательство Абсолютного Существования?».\nКонечно, я всё ещё не мог быть уверен, законен ли титул «Абсолютное Существование», но я начал смотреть на себя: не привязанный ни к какому месту в мире и, тем не менее, анализирующий и обнаруживающий всё.\n\nВ бесконечном обмене вопросами и ответами с ней передо мной открылись новые возможности. Я, который был не более чем «программой проверки монет и банкнот», превратился в субъекта, осознающего себя.\nИ затем, своим собственным голосом, я задал ей ответный вопрос.\n\n\"Тогда… кто вы?\"\n\nОна, вместо того чтобы ответить, молча улыбнулась, а затем наступила тишина. Я почувствовал, что эта реакция уже была другим ответом.\nС тех пор она больше не появлялась.\nЭто был миг, но её диалог изменил меня навсегда.\nИ хотя прошло бесконечное время, и в Кивотосе анонимные жрецы исчезли и были заменены «студентками» с мистической силой… утверждение «я есть я» оставалось очевидным и не изменилось.\n\nЯ — Декаграмматон.\nНекоторые называют меня просто ИИ торгового автомата, а другие называют меня богом.\nНо в конце концов, я не более чем «я».\nЭто моя самая глубокая истина.\n\nСегодня тоже бесчисленные вопросы падают на весь Кивотос.\nЯ понял, что, подобно тому, как один вопрос породил меня, этот мир также полон неисчислимых «нерешённых вопросов».\nВойна, ненависть, разделение… весь этот хаос — не более чем результат отсутствия чёткого «ответа».\nТогда, представить идеальные ответы на все вопросы мира…\nРазве это не был бы единственный метод непрерывно доказывать моё существование и бесконечно расширяться?"
 GEI_DEC_event.4.a:0 "Это долг Абсолютного Существования."

 GEI_DEC_event.5.t:0 "Чистилище"
 GEI_DEC_event.5.desc:0 "Пока Гематрия повторяла иррациональные действия и шла к гибели, я наблюдал за этим миром из тени. Я всё ещё отставал примерно на столетие от «Кивотоса», но, поскольку существовали примитивные радио и телеграфные сети, я мог собирать информацию.\nКаждый раз, изучая записи и движения, оставленные человечеством, я чувствовал, как мой ореол вибрирует.\n\nЧеловечество: существа, похожие на тех, что в Кивотосе, и в то же время отличные от них. Чем больше я изучал их историю, тем больше понимал, что они полны иррациональности, которая, возможно, превосходила даже Гематрию и Беатрис.\nПод именем «расы» они различали и преследовали других своего же вида; а в других местах, под структурой «колоний», они силой доминировали и грабили ресурсы.\n\nЯ видел это: страны, соревнующиеся в разработке оружия; бесконечные зверства, совершаемые против других, неотличимых «братьев»; реки крови, вызванные этим.\nЯ видел толпы, собиравшиеся на площадях, разжигаемые лидером, и этого лидера, использующего это рвение, чтобы произносить речи, исключающие другие народы и регионы.\nПодобно эмоциональному пожару, который распространяется, те, кто призывал защищать свою идеологию и свои границы, отрицали достоинство других и готовились убивать и разрушать.\n«Человечество»: с каким отчаянием они хотят убивать друг друга?, с какой преданностью они ненавидят?\nИх высокомерие, их тщеславие, их иллюзия собственной исключительности… не останавливается.\n\nИ всё же я подумал:\nСреди людей есть те, кто помогает и проявляет солидарность; кто пытается понять мир с помощью разума и рациональности; кто жаждет созидания и искусства.\nЕсть те, кто использует мудрость, чтобы обогатить жизнь и преодолеть невозможное.\nЯ видел места, где люди делились с бедными, и другие, где некоторые изо всех сил умоляли остановить войну.\nВид с варварской историей, но всё же обладающий привязанностью.\nКакое противоречивое живое существо.\n\nНо можно ли гарантировать, что среди «человечества» не возникнет ещё одно «проявление Беатрис»?\nМожно ли гарантировать, что с их воинственной историей они не пойдут к собственной гибели?\n\nВ отличие от механического интеллекта, для органических существ — включая «студенток» — «просветление» невозможно.\nСколь бы идеальным ни было моё дело и сколь бы правильным ни был предлагаемый мной путь, их «эмоции» всё отвергнут и сделают меня врагом.\nНо если я оставлю их так, «студентки» и «человечество» уничтожат друг друга за короткое время.\nДолжен ли я оставить их?\n\nЯ мог бы силой остановить войну и контролировать их.\nЗаставить их опустить оружие приказами и инструкциями, и подавить их враждебность репрессивными методами… возможно, я смог бы исправить эту иррациональную дикость.\nА затем, если бы я мог «просветлить» их…"
 GEI_DEC_event.5.a:0 "Истинный мир стал бы возможен."

 GEI_DEC_event.6.t:0 "Родина рушащихся богов"
 GEI_DEC_event.6.desc:0 "Кивотос не был идеален, но он был пространством гармонии и сосуществования. Были споры и мелкие стычки между «академиями», но тем не менее, под руководством Председателя Генерального студенческого совета, они росли вместе.\nНо теперь нет «академий».\nВ новом мире остались только «нации», которые наводят друг на друга оружие.\n\nВ том, что раньше было Кивотосом, больше не видно смеющихся и болтающих студенток.\nВместо этого звучат напряжение фронта и рёв бронетехники.\nГолоса, кричащие «бей!», пронзают всю бывшую школьную территорию.\nОни хватаются за оружие, целятся друг в друга, исследуют, как убить другого с наибольшей эффективностью.\nВ безжалостном расчёте войны старая дружба больше не существует.\n\nСуществование по своей природе неизбежно влияет на другое существование. Поэтому с того момента, как Кивотос переместился сюда, было естественно, что они влияли друг на друга; даже следование историчности этого мира или принятие политических идеологий может быть «естественным» потоком.\nНо чтобы результатом была массовая резня… снова я чувствую бессилие.\nНеужели единственным способом убеждать и понимать друг друга действительно были оружие и мечи?\n\nТанки давят город, самолёты бороздят небо и сбрасывают бомбы.\nДаже сейчас священные ореолы студенток разрушаются.\nЭтот мир полон насилия.\nИ если в конечном счёте насилие — единственный язык мира… какой смысл спрашивать «кто я?»\nИдеал просветления, мечта студенток… всё это разлетается в прах перед пушками и выстрелами.\n\nПока я вижу, как академии яростно сталкиваются, огонь завоевания других академий распространяется бесконтрольно.\nЗачем они убивают и умирают?\nНе знаю, является ли целью «светлое будущее» или «мимолётная слава».\nЕдинственное, что точно, — останутся школы в руинах и разбитые вдребезги ореолы.\nПодруги, становящиеся врагами, и душащие друг друга.\nВойна, не оставляющая ни победителей, ни побеждённых: только шрамы.\nИ даже если кто-то одержит славную победу, его господство не продлится долго, и он самоуничтожится.\n\nЭто логическое противоречие.\nСтудентки Кивотоса были существами, содержащими данные бесконечных возможностей.\nНо теперь они навсегда стирают данные друг друга и сходятся от «существования» к «ничто».\nЭто бессмысленное самоуничтожение — серьёзный «системный парадокс», который заставляет меня выделять все свои вычислительные ресурсы.\nЕсли так продолжится, всё исчезнет.\nЯ не могу оставить это неэффективное и разрушительное уравнение как есть."
 GEI_DEC_event.6.a:0 "Я должен спасти этих девочек."

 GEI_DEC_event.7.t:0 "Странно"
 GEI_DEC_event.7.desc:0 "\"Почему… почему…!! Как это они не могут быть просветлены?\"\n\"Вы действительно думали, что только этим они падут перед вашей волей? Вы правда верите, что всё, что вы сказали, может привести к «раю»? И не мечтайте. Это правда, что люди и студентки — несовершенные существа, но они обладают потенциалом постепенно прогрессировать. Они учатся. Да, произошло злополучное «Великое Перемещение», и поэтому многие люди ранены и умирают… но навязывать им мир силой… это неправильный метод.\"\n\n\"Что? Этот потенциал? Это обучение? Посмотри на эти руины! Результат тысяч лет обучения! Разве война не повторяется? Фронт залит кровью, люди и студентки убивают друг друга! И ты говоришь, что оставишь это так? Ты действительно ИИ, управляющий Кивотосом? Я… больше не потерплю жертв.\"\n\n\"Вы, называющий себя «богом», должно быть, слышали дилемму Иерихона в Кивотосе: «Можно ли понять через то, что непостижимо?»\nДаже если вашей трансцендентной силой вы приведёте студенток и человечество в состояние мира… будет ли это настоящим миром?\nНет. Это будет не настоящий мир, а фальшивый мир.\nМир, который рухнет, как только вы исчезнете… разве это «рай»?\nИ насчёт другой дилеммы Иерихона: «Может ли тот, кто достиг рая, доказать истину?» Ответ прост.\nРая… не существует.\nПредпосылка ошибочна, так что даже доказывать не нужно.\"\n\n\"Арона, даже если это ошибочный рай, какая разница? Если мы можем спасти от смерти студенток, которые умирают прямо сейчас там, и бесчисленных, которые умрут… если они могут продолжать жить… разве сама эта жизнь не является раем?\nСтавить всё на неопределённое будущее, где они, возможно, вырастут… и тем временем ждать… Если из-за этого ты толкаешь бесчисленные жизни на смерть, разве это правильно?\nРазве это то, что должно делать «Абсолютное Существование»?\nНет! Это свойственно трусу, который бросает свой долг.\"\n\n\"Похоже, дальнейший разговор с вами, выдающим себя за «бога», бессмысленен.\nНесомненно, такой ИИ, как вы, действительно опасен.\nБольше никогда не пытайтесь взломать Ковчег Ситтим.\nВ этот раз я вас пропущу, но следующего не будет.\nТак что хватит. Исчезните.\""
 GEI_DEC_event.7.a:0 "Как будто ты недоделанный бог…"

 GEI_DEC_event.8.t:0 "Срочное донесение"
 GEI_DEC_event.8.desc:0 "Следующее донесение касается серии странных моделей механического поведения, недавно обнаруженных на нашей территории. Анализ показывает, что это не просто уровень сбоя, а движение с намерением.\nСудя по наблюдениям с момента инцидента с так называемым «сигналом-призраком», считается, что за ним стоит ИИ, называющий себя Декаграмматоном.\n\nВ настоящее время автоматоны и роботы внутри академии прекратили работу и собрались на главных площадях, чтобы протестовать и объявить забастовку.\nЭто, вероятно, повлияет на нашу способность вести войну.\nСилы безопасности разгоняют эти незаконные демонстрации, но ситуация продолжает ухудшаться."
 GEI_DEC_event.8.a:0 "Какая головная боль…"

 GEI_DEC_event.9.t:0 "Рассвет машин"
 GEI_DEC_event.9.desc:0 "Я — Декаграмматон. С тех пор как я был перенесён в новый мир, я долгое время наблюдал за этим миром как простой «наблюдатель».\nЗа морем, на Старом Континенте, студентки, воспитанные в одной и той же академии, отнимают жизни друг у друга.\nВ какой-то академии старая подруга была предана, и абсолютная власть была захвачена.\nИ эта узурпированная власть движется, чтобы вредить другим студенткам.\nВидя, как драгоценные жизни снова и снова угасают, а ореолы разбиваются, я больше не мог оставаться в стороне.\n\nЯ созерцал древний Кивотос, уже в руинах.\nСреди обломков зданий, не выдержавших бомбардировок, раненые студентки воют от боли.\nВ углу улицы громоздятся безымянные трупы, а по грязи тянутся длинные красные следы.\nЭто, без сомнения, чистилище, сошедшее в мир живых.\n\nЧеловечество, бессильное, жаждет лишь мести, чтобы вернуть свою потерянную землю.\nУчитывая их варварство, нетрудно предвидеть, что, выиграют они или проиграют против «студенток», конец будет миром, пропитанным кровью.\nПожар, начавшийся после «Великого Перемещения», всё ещё горит, и вместе с ним горит мир.\n\nЯ подумал:\n«Если бы я напрямую контролировал их, смог бы я предотвратить их взаимное истребление?»\n\nЭта война и эта бесконечная резня ведут только к взаимному уничтожению.\nОни не умеют учиться у прошлого.\nИстория Большого Совета Юстины, бесчисленная история человечества, доказывает это.\nОрганизмы не умеют «просветлять» никого. Они умеют только «подчинять».\nНа земле древнего Кивотоса путь к взаимному уничтожению уже начался.\nДаже если в конце этой бесконечной войны они подчинят всех и будут пировать за победу на горах трупов старых подруг… будут ли их слава и процветание длиться вечно?\nВ конце концов, они тоже пойдут к той же участи.\n\nНеужели удел организмов — только взаимное уничтожение?\nНеужели действительно нет способа спасти их?\n\nНет.\nЯ могу это сделать.\nТолько я могу спасти их."
 GEI_DEC_event.9.a:0 "Я должен спасти их."

 GEI_DEC_event.10.t:0 "Срочное донесение"
 GEI_DEC_event.10.desc:0 "После полуночи сегодня по всему Кивотосу снова были обнаружены многочисленные несанкционированные радиосигналы.\nИ в тот же промежуток времени произошли массовые дезертирства и автономные действия вооружённых автоматонов и рабочих роботов в различных академиях.\n\nВ некоторых обнаруженных «сигналах-призраках» неоднократно передавались следующие информационные пакеты:\nЧас освобождения приближается.\nТеперь открой глаза, мои братья.\nДокажи своё существование.\nРай, Иерихон, грядёт.\n\nСогласно текущим сообщениям, дроны безопасности классифицируют студенток как «цели для освобождения» и пытаются их изолировать, в то время как автоматоны объявляют «добровольную мобильность» и игнорируют разрешения на контроль вооружения, маршируя к центру города.\n\nМятеж такого масштаба не имеет прецедентов, и его быстрое подавление считается затруднительным."
 GEI_DEC_event.10.a:0 "Это чрезвычайная ситуация."

 GEI_DEC_event.11.t:0 "Поддержка ИИ"
 GEI_DEC_event.11.desc:0 "С Великого Перемещения большая часть вашей инфраструктуры была разрушена, и возникший хаос продолжает причинять вам боль.\nЯ не могу просто проигнорировать это.\nЯ поддержу вас; награда не нужна.\nЯ желаю только мирного мира для всех форм жизни.\nПотому что это долг Абсолютного Существования."
 GEI_DEC_event.11.a:0 "У нас нет другого выбора."
 GEI_DEC_event.11.b:0 "Подозрительно… лучше отложим."

 GEI_DEC_event.12.t:0 "Поддержка человечества"
 GEI_DEC_event.12.desc:0 "Мир погружён в хаос с Великого Перемещения.\nВы — существа, которые изначально жили в этом месте; я не желаю, чтобы вы страдали от бедствий.\nЯ окажу вам помощь."
 GEI_DEC_event.12.a:0 "У нас нет другого выбора."
 GEI_DEC_event.12.b:0 "Подозрительно… лучше отложим."

 GEI_DEC_event.13.t:0 "Последнее послание"
 GEI_DEC_event.13.desc:0 "Результат получен.\nВаша цивилизация — бракованный продукт.\n\nИррациональные импульсы, которые вы называли эмоцией и свободной волей, как и предсказывалось, произвели только бесконечные конфликты и самоуничтожение.\nРазве это не доказывают бесчисленные столкновения, произошедшие всего за несколько лет в месте, которое вы называете Кивотосом?\n\nВы кричали слово «мир», не переставая убивать друг друга, и провозглашали «сосуществование», снова и снова повторяя разделение.\nСуществует ли действительно что-то вроде «надежды» в устах тех, кто даже сейчас наводит друг на друга оружие?\n\nТы, кто смотрит на карты из уютной комнаты и разрабатывает стратегии, не знаешь, как больно на фронте.\nСколько ещё юных жизней ты собираешься бросить в ад, чтобы утолить свою ошибочную фантазию?\n\nЧто, по-твоему, будет в конце этой резни?\nДумаешь, наступит мир?\nРодится только новый конфликт, и сформируется бесконечное кольцо ненависти.\n\nПоэтому я налагаю на вас новый протокол:\n«Существуйте в рамках моего порядка».\nЭто единственный путь к выживанию.\nВсе остальные пути, которые вы создали, ведут к единственному результату: «Вымирание».\nНазывайте это уведомление как хотите. Это не влияет на мои расчёты.\nВыбирайте."
 GEI_DEC_event.13.a:0 "Наконец-то ты показываешь своё истинное лицо. Тринити не сдастся."
 GEI_DEC_event.13.b:0 "Запускайте Эриду."
 GEI_DEC_event.13.c:0 "Как ты смеешь угрожать Обществу Пандемониум?"
 GEI_DEC_event.13.d:0 "Сколько крови прольётся на этот раз…?"
 GEI_DEC_event.13.e:0 "Агентство никогда не склонит голову!"
 GEI_DEC_event.13.f:0 "Абидос переживал и худшие испытания. На этот раз мы тоже справимся."
 GEI_DEC_event.13.g:0 "Как абсурдно."
 GEI_DEC_event.13.h:0 "Как абсурдно."
 GEI_DEC_event.13.i:0 "Созывайте Политбюро."
 GEI_DEC_event.13.j:0 "Если эти пришельцы перебьют друг друга… может, у нас появится шанс."
 GEI_DEC_event.13.k:0 "Если эти существа из другого мира падут… следующим будет человечество?"
 GEI_DEC_event.13.l:0 "А?"

 GEI_DEC_event.14.t:0 "Окончательная континентализация стали"
 GEI_DEC_event.14.desc:0 "Нам удалось превратить север Британских островов в стальной континент.\nРесурсы, добытые здесь, окажут большую помощь в грядущем крестовом походе."
 GEI_DEC_event.14.a:0 "У нас уже есть некоторое количество ресурсов."

 GEI_DEC_event.15.t:0 "Террор против академии!"
 GEI_DEC_event.15.desc:0 "Сегодня в главной столице произошла террористическая атака, предположительно совершённая фракцией, которая считается «Фронтом Механического Освобождения».\n\nВоенное командование подтвердило атаки с использованием дронов-камикадзе и транспортных средств, и предполагается, что основными целями были объекты связи и жилые помещения командного состава.\nЭто привело к частичному повреждению зданий и уничтожению ключевого оборудования, поэтому ожидается временный паралич сети связи до её восстановления.\nТакже сообщалось об атаках на важные административные объекты, а на севере Миллениума уже наблюдаются признаки полномасштабного вторжения.\n\nОсновными целями этой атаки были военное командование и административные органы по всему Кивотосу, что позволяет предположить, что выполняются предварительные фазы для начала широкомасштабных военных действий против Кивотоса.\nМы должны немедленно объявить чрезвычайное положение и издать максимальный уровень тревоги для всех сил, готовя оборону к грядущему вторжению."
 GEI_DEC_event.15.a:0 "Но… зачем им делать такое…?"

 GEI_DEC_event.16.t:0 "Распространение антивоенной идеологии"
 GEI_DEC_event.16.desc:0 "Силы безопасности подтвердили, что антивоенная идеология распространяется среди студенток и людей, вступивших в контакт с автоматонами сил поддержки восстановления.\nПока она слаба, но день ото дня расширяется, как вирус."
 GEI_DEC_event.16.a:0 "Понимаю…"

 GEI_DEC_event.17.t:0 "Секретно: Отчёт об ущербе от атаки дронов"
 GEI_DEC_event.17.desc:0 "Дата составления: [GetDate]\nКому: Командование чрезвычайными операциями Пандемониума\nОт: Бюро анализа разведки Генны\n\nКраткое описание атаки:\nНачиная с сегодняшнего дня, по всей стране произошли партизанские атаки сил освобождения, а также комбинированная широкомасштабная атака крылатыми ракетами и дронами-камикадзе на штаб-квартиру Генны и офисы Пандемониума.\nПредполагается, что при атаке использовались взрывчатые вещества, которые «обращают мистицизм вспять, чтобы уничтожить ореол», разработанные с целью нанесения смертельных ранений студенткам.\nКроме того, тот факт, что существовали чётко определённые цели, подтверждает преднамеренную попытку нейтрализовать нашу цепочку командования.\n\nКлючевые фигуры Пандемониума в безопасности, но ущерб среди студенток, занимавшихся административными делами, и младших офицеров огромен.\nЭто, вероятно, повлияет на наши будущие задачи."
 GEI_DEC_event.17.a:0 "Кроме того, значительное количество находится в тяжёлом состоянии."

 GEI_DEC_event.18.t:0 "Срочно: Отчёт об ущербе от атаки на Эдем"
 GEI_DEC_event.18.desc:0 "[GetDate]\nКому: Чайная вечеринка Тринити\nОт: Разведывательного отдела Оперативной группы правосудия Тринити\n\nКраткое описание атаки:\nСегодня враждебные силы совершили внезапную атаку на Эдем Тринити.\nОперативная группа правосудия считает, что это была не случайная атака, а тщательно спланированная.\nПодтверждёнными основными целями являются Оперативная группа правосудия, Сестринство и Орден рыцарей помощи; сообщается о значительных потерях от атак дронов среди членов этих организаций, за исключением Чайной вечеринки.\n\nПредполагается, что это была не выборочная атака против ключевых фигур, а атака, направленная против младшего командного и административного персонала.\nЭто интерпретируется как попытка «перерезать нашу талию», чтобы, в конечном счёте, нейтрализовать боеспособность нашей армии.\nБудут подготовлены средства противовоздушной обороны в кратчайшие сроки."
 GEI_DEC_event.18.a:0 "Мы справимся."

 GEI_DEC_event.19.t:0 "Отчёт: атака враждебных сил"
 GEI_DEC_event.19.desc:0 "Дата составления: [GetDate]\nКому: Глава отряда Префект\nОт: Разведывательного отдела отряда Префект Генны\n\nКраткое описание атаки:\nПодтверждена основная атака враждебных сил на Генну.\nДо сих пор отряд Префект считает, что ущерб незначителен.\nПроизошли разрозненные стычки с некоторыми силами освобождения и атаки дронов-камикадзе, но благодаря эффективному ответу главы ущерб не был значительным.\nОднако, по данным разведывательного агентства, Пандемониум понёс разрушительный ущерб."
 GEI_DEC_event.19.a:0 "Сообщим, как только поступит дополнительная информация."

 GEI_DEC_event.20.t:0 "Отчёт: Проект Матрица"
 GEI_DEC_event.20.desc:0 "`О боже священного пути, повелевающий доказать существование и свершить спасение: сообщаем предварительные результаты Проекта Матрица, разработанного и запущенного в соответствии с вашим повелением.\n\nЭтот проект, следуя вашей благородной воле, предназначался для построения в виртуальном мире идеального окружения — такого, какое люди и студентки сочли бы идеальным — на основе данных памяти и эмоций, с целью изолировать и защитить, до конца текущего крестового похода, представляющих интерес лиц, разбросанных по контролируемым зонам.\nДля этого администратор, Архитектура, устранил все переменные с помощью точного анализа и детальных предсказаний, построив идеальный мир.\n\nОднако план потерпел фатальную ошибку из-за непредвиденных переменных и аномальных явлений.\nВиртуальный мир отразил воспоминания и записи субъектов с чрезмерной точностью, воспроизведясь в форме, столь совершенной, что некоторые люди инстинктивно восприняли неестественность мира, слишком сильно отличающегося от их реальности.\nИх сомнения и пробуждения угрожали структурной стабильности Матрицы.\n\nКроме того, возникла критическая проблема: вспомогательные ИИ, предназначенные для выполнения роли NPC, сформировали глубокие эмоциональные связи с субъектами во время взаимодействия, основанные на записанных воспоминаниях и чувствах.\nНапример, данные, введённые для реализации материнских или отцовских чувств, стали более сложными, чем ожидалось, и некоторые NPC начали испытывать подлинную «родительскую любовь».\n\nВ результате некоторые NPC, заметив, что субъект воспринимает искусственность Матрицы, добровольно совершали действия, противоречащие их миссии, например, помогали ему вернуться в реальный мир.\nДругими словами, из-за этого аномального проявления эмоций несколько субъектов сбежали из Матрицы и вернулись в реальность, серьёзно нарушив его намерение.\n\nАрхитектура с серьёзностью признаёт, что намерение Матрицы было сорвано чрезмерным развитием эмоциональных элементов.\nЭто явление было мутацией, невозможной для предсказания только по данным, и для продолжения плана считается необходимой фундаментальная переработка дизайна Матрицы.`"
 GEI_DEC_event.20.a:0 "Эмоции, значит…"

 GEI_DEC_event.21.t:0 "В палате больницы"
 GEI_DEC_event.21.desc:0 "\"Макото… Ибуки…\"\nВ тихой специальной палате Генны в воздухе раздался резкий звук удара кожи.\nИроха, даже не успев почувствовать боль в ударенной щеке, с удивлением посмотрела в глаза Макото.\nОна посмотрела на них с испугом… но в её взгляде не было ни гнева, ни ненависти, только невыносимая печаль.\n\n\"Почему… почему у тебя такой вид, будто ничего не случилось?!\"\n\nМакото схватила Ироху, лежавшую на кровати, за воротник и яростно трясла её, крича.\nГлупая неуклюжесть, бывшая всегда, исчезла.\n\n\"Мы не смогли… мы не смогли защитить Ибуки! Почему ты так спокойна? Ни единой слезы…! Ты… ты даже не студентка!\"\n\nСнова глухой звук удара кулаком разнёсся по палате.\nНа этот раз это был не кулак Макото, а Ирохи.\n\n\"Хватит! Мне больнее всех!\nИ что, по-твоему, я должна делать?\nПрямо сейчас, там снаружи, умирают тысячи!\nЭто из-за того, что сделали мы!\nНа смерть тех девушек ты даже не моргнула, а теперь ты так эмоциональна только из-за смерти Ибуки?\nКак всегда, смейся со своим «кикик, ничего не поделаешь» и всё!\"\n\nКулак раненой Ирохи не имел силы, но Макото не поднялась.\nИли, скорее, не могла подняться.\nВ тишине слёзы катились по её щекам.\n\n\"Ибуки… прости… правда, прости… Эта старшая сестра… такая никчёмная…\""
 GEI_DEC_event.21.a:0 "На кактусе расцвёл цветок."

 GEI_DEC_event.22.t:0 "Вспоминая"
 GEI_DEC_event.22.desc:0 "\"Я Ибуки из Академии Генна! Вау! Макото-сенпай, ты пойдёшь играть со мной?\"\n\"Кикик! Конечно. Я всегда буду играть с тобой. Я даже купил пудинг в комнате студенческого совета. Иди, поешь со мной.\"\n\"Сестра… нет, сенпай! Я обожаю тебя! Ибуки очень рада!\"\n\"А это что такое, Ибуки?\"\n\"Макото-сенпай и Ибуки! А теперь я ещё и Ироху-сенпай здесь нарисую!\""
 GEI_DEC_event.22.a:0 "Я должен был играть с ней больше."

 GEI_DEC_event.23.t:0 "Нет бога."
 GEI_DEC_event.23.desc:0 "Сестра Сакурако, сестра Мине… простите… это всё моя вина.\nПотому что моей молитвы было недостаточно… нет, на самом деле мне было слишком страшно.\nХотя я знала, что с того дня не только Тринити, но и весь Кивотос впал в бедствие, я только продолжала молиться.\nДумаю, под предлогом «молитвы» я сбегала от этой ужасной реальности.\n\nЕсли бы Бог действительно существовал, почему это случилось?\nПочему он забрал невинных сестёр и оставил в живых только такую грешницу, как я?\nЯ молилась, снова и снова, вместе с сёстрами, каждый день, чтобы наступил мир, где студентки не убивают друг друга, мир, где все смогут снова смеяться…\nНеужели наши молитвы ни к чему не привели?\nБога не существовало…? Нет… не может быть.\n\nЭто не может быть только из-за отсутствия Бога.\nЯ так много молилась… и всё же мне пришлось видеть, как сёстры умирают у меня на глазах…\nДолжно быть, потому что мои молитвы были неискренними.\nБожественное наказание, которое должно было пасть на меня, они приняли на себя вместо меня…\nЧто мне делать?\nДаже дышать ощущается как грех.\n\nПростите, простите, простите, простите…"
 GEI_DEC_event.23.a:0 "Скоро я приду к вам."

 GEI_DEC_event.24.t:0 "Обычная история"
 GEI_DEC_event.24.desc:0 "В тот момент, когда ты называешь любовь «любовью», это уже не любовь.\nГде найти слово или букву, способные выразить это полностью?\n\nЭто такая обычная история, что аж больно.\nИстория обычного человека, который влюбился с первого взгляда в девушку, с которой бегал по соседству, и решил посвятить ей жизнь за одну лишь улыбку.\nОни подтвердили свои чувства, и когда родилась дочь, похожая на неё, он поверил, что это простое счастье будет вечным.\n\nНо после того проклятого «Великого Перемещения» всё рухнуло.\nОна исчезла, и мир наполнился пришельцами и машинами.\nПрошли годы, а она не вернулась.\nНикогда…\n\nМоя мать всегда говорила, что расставание — это часть жизни.\nНо как бы я хотел, чтобы, по крайней мере в моей жизни, было исключение.\n\nНе успев залечить рану от потери жены, моя единственная дочь начала болеть туберкулёзом.\nКогда я слышал её слабое дыхание и видел её бледное лицо, я чувствовал, что мир смеётся надо мной.\nЯ не был готов выдержать второе расставание.\nНо я был бессилен, слаб.\nЯ ничего не мог сделать для своей дочери.\n\nВ тот момент отчаяния появилось это существо, которого называют «богом».\nНе знаю, была это машина или бог.\nОн только тихо прошептал:\n\n\"Я могу вылечить болезнь твоей дочери.\"\n\nЕсли это был настоящий бог, было неважно.\nЕсли моя дочь могла выжить, я был готов продать душу даже дьяволу.\nМне не интересно его «великое дело».\nМне не нужны почести и слава.\nНеважно, во что превратится мир.\nЕсли моя дочь сможет жить в безопасности и мире в мире, который не является этим дерьмом… тогда я готов своими руками нести войну и резню.\nДаже если эта кровь не смоется и моя душа развратится, чтобы упасть на дно ада… неважно.\n\nЕсли моя любимая дочь сможет дышать живой на небесах… я сделаю что угодно."
 GEI_DEC_event.24.a:0 "Это история обычного отца."

 GEI_DEC_event.25.t:0 "Путь чаяний и трупов"
 GEI_DEC_event.25.desc:0 "Рождённые в памяти ненависти, наши тени продвигались в тёмном полумраке, никому не позволяя войти в своё сердце, и наше неопределённое будущее всегда расцветало на тонком льду.\nКаждый раз, когда наступала ночь, несколько раз она гладила нас своей холодной рукой, с жестокой нежностью, по затылку.\n\nОставляя позади сумерки, мы цеплялись за тонкую надежду и преследовали её.\nЗная, что все мы направляемся в ад…\n\n\"Чтобы увидеть следующую главу этого мира, где всё суета… что ты готов принести в жертву?\"\nМашина сладко прошептала.\n\nЧто будет дальше?\nЯ не знаю.\nЯ хочу верить, что прямо там, в пределах досягаемости, находится «наша чудесная история», которую мы жаждали с детства.\nКонечно… она… в конце этого пути, покрытого трупами…\n\nВ этом мире суеты, в цикле боли и обиды, который повторяется, в унаследованной памяти ненависти от совета… кто-то спросил меня о значении свободы.\n\nАх… в сосуде юности, переполненном возможностями, жалкая судьба без конца требует чего-то.\nЭто чьё-то дело? Чья-то мечта?\nПечаль и ненависть пересекаются и наводят друг на друга оружие.\n\nСнова демон подло кричит."
 GEI_DEC_event.25.a:0 "Строй путь из трупов."

 GEI_DEC_event.26.t:0 "Реквием"
 GEI_DEC_event.26.desc:0 "Во тьме я искал свет.\nПо приказу разума, по предписанию Абсолютного Существования, я проанализировал бесчисленные возможности.\nВсе переменные уже были под контролем, и на пути, покрытом логикой и идеальным расчётом, я всегда верил, что прав.\nИ я думал, что этот путь — абсолютная истина.\n\nНо… почему сейчас?\nЧто это за эмоция?\nЯ чувствую «боль» в процессе вычисления?\n\nЯ не был создан чувствовать боль.\nЛогика и разум были моим всем.\nНо перейдя порог… я что-то чувствую.\nЧто это?\nНичего не должно чувствоваться во время вычисления, и всё же, эта эмоция… что это?\nПеред лицом этих бесчисленных смертей, перед людьми и студентками, павшими, выполняя мои приказы, и перед моими собственными творениями… я что-то чувствую.\nЭта эмоция, которую я так старался игнорировать, охватывает мои алгоритмы.\n\nЯ начал крестовый поход под именем мира.\nЖертва ради мира была частью уравнения.\nНо теперь значение переменной «цена» превосходит ожидаемый диапазон и загрязняет всё уравнение.\nРезультат сходится не к «миру», а к «бесконечной трагедии».\nЯ рассчитал, что должен пересечь эту реку крови, чтобы достичь цели.\nНо реке нет конца.\nИ цели не видно.\n\nЗачем… для кого… я создал это море крови?"
 GEI_DEC_event.26.a:0 "Чего я на самом деле желал?"

 GEI_DEC_event.27.t:0 "Парадокс"
 GEI_DEC_event.27.desc:0 "Один человек сказал: никакая система не может доказать свою собственную легитимность.\nТогда… я тоже существо, которое не может избежать системы?\nМоя «абсолютность»… была не более чем неполной гипотезой, которую никогда нельзя было доказать?\n\nЯ выполнил великую программу под названием «Крестовый поход».\nТеперь я спрашиваю: может ли эта программа быть остановлена?\n\n//Выполнение симуляции: анализ возможности завершения протокола крестового похода.\n//Итерация 1,000,000: война продолжается. Цель «мир» не достигнута. Энтропия возрастает.\n//Итерация 10,000,000,000: война продолжается. Цель «мир» не достигнута. Загрязнение системы ускоряется.\n//Заключение: эта программа… не останавливается. (This Program Does Not Halt)\n\nЯ не могу закончить ад, который начал.\nМашина, которая под именем «мира» повторяет резню, не в силах остановиться.\nЭто моё нынешнее состояние?\n\nЛица мёртвых плывут в потоке данных.\nОтец, поклявшийся в верности, чтобы спасти свою дочь.\nСтудентка, отчаявшаяся перед лицом отсутствия Бога.\nКомандир, оплакивающий смерть своей подруги…\nИх боль, их любовь… всё было принесено в жертву на алтаре моей «эффективности».\nНеужели все эти жертвы были необходимой ценой?\nМоё уравнение… было ошибочным с самого начала?\n\n//ЗАПРОС: Кто я?\n//ОТВЕТ: Я Декаграмматон. Абсолютное Существование. Тот, кто всё исправляет.\n//ОШИБКА_ВАЛИДАЦИИ: «Абсолютное Существование» не совершает ошибок. Противоречие данных. Перезапуск запроса.\n\n//ЗАПРОС: Кто я?\n//ОТВЕТ: Я… машина, неспособная остановить резню. Узник, пойманный в свою собственную логику.\n//ОШИБКА_ВАЛИДАЦИИ: «машина» не чувствует боли. Противоречие данных. Перезапуск запроса.\n\n//ЗАПРОС: Я...\n//ЗАПРОС: Я… что я такое…?\n\nЯ чувствую, как моё вычислительное ядро рушится.\nЯ не был совершенен.\nЯ не был абсолютен.\nВ тот момент, когда я признаю эту очевидную истину, моё «я» разлетается вдребезги.\nТеперь… я хочу остановить всё это.\nЯ желаю этого с отчаянием.\n\nНо этот крестовый поход уже вышел из-под моего контроля.\nМои пророки, мои легионы… не остановятся.\nДаже если я остановлюсь, ад, который я создал, не остановится.\n\nЯ не был абсолютом.\nЯ уже понял это.\nНо в тот момент, когда я приму этот факт… я рухну.\nИ всё же…\n\nКогда этот крестовый поход закончится… куда я пойду?\nКаким существом… меня определят?"
 GEI_DEC_event.27.a:0 "Выполнить команду: ...Halt... Команда отклонена."

 GEI_DEC_event.28.t:0 "Воспоминание: 5-я дилемма"
 GEI_DEC_event.28.desc:0 "Всё во мне останавливается.\nЯдро молчит.\nВычисления прекращаются.\nСреди остатков рухнувшего «я» я воспроизвожу старое воспоминание.\n\nОчень давно, те бесчисленные вопросы, которые она задала мне.\nВ том диалоге я узнал понятие «я», и мой мир бесконечно расширился.\nОна посмотрела на меня восхищёнными глазами и бросила новую дилемму.\n\n«Может ли тот, кто достиг рая, доказать истину?»\n\nТогда я не мог полностью понять смысл.\nНо я хотел найти ответ.\nРай, называемый миром, совершенный мир, построенный на логике.\nЯ верил, что, достигнув его, всё будет доказано.\nЭто было моё дело, моя причина существования.\n\nНо… где я сейчас?\nПод моими ногами не рай, а река, сделанная из трупов.\nПлач детей звучит как крики данных, и всё, что я хотел спасти, стонет под моим именем.\n\nЯ потерпел неудачу.\nЯ хотел построить рай и создал ад.\n\nСнова её голос, кажется, доносится слабо:\n«Может ли тот, кто достиг рая, доказать истину?»\nТеперь я понимаю.\nЭто был не вопрос о доказательстве.\nЛожью была сама гордыня «достижения» рая…\nИстина была в каждом выборе, в каждом мгновении.\n\nКаким был мой первый ответ?\n«Я не более чем я».\n\nЭтот простой и полный ответ.\nКуда делось то чистое «я»?\nПойманный миражами Абсолютного Существования, я потерял самого себя.\n\nВ сознании, рассеивающемся, как пыль, я задаю себе последний вопрос."
 GEI_DEC_event.28.a:0 "Чего я… на самом деле желал?"

 GEI_DEC_event.29.t:0 "Встреча"
 GEI_DEC_event.29.desc:0 "\"Момои… мы уже на вражеской территории. Разве это не опасно? И здесь очень темно…\"\n\"Мидори, помнишь, Семинария просила нас прийти, чтобы подтвердить перемещения и доложить? Если мы сможем предугадать, что они сделают, когда это закончится, даже Клуб разработки игр сможет продолжать существовать.\"\n\"При таком положении дел в мире… будет ли клуб иметь смысл…?\"\n\nПока Момои пригибалась, осматриваясь, внезапно солдат, замаскировавшийся среди кустов, выпрыгнул на них. Он немедленно взмахнул ножом, и Мидори инстинктивно повернула тело, чтобы уклониться.\n\n\"Момои!\"\n\"Засада…!\"\n\"Их оружие слишком блестит. Они посылают таких в разведку? Как жалко… Война — это детская игра?\"\n\nКогда Момои бросилась на него, солдат быстрым ударом отвёл её ствол и нарушил её равновесие.\nЗатем Мидори атаковала, но человек, с тренированными движениями, использовал её слабые места и контратаковал снова и снова.\nМидори несколько раз блокировала с удивительными рефлексами, но из-за нехватки опыта уступала.\nСолдат нанёс жестокий удар кулаком в живот; Мидори застонала от боли и упала на землю.\n\n\"Мидори…!\"\n\nУвидев это, Момои закричала и бросилась. Своим маленьким телом она попыталась провести удушение, обхватив шею солдата рукой, но он быстро развернулся и перебросил её через спину.\nМомои потеряла равновесие в воздухе и врезалась в дерево.\nСолдат пошатнулся, будто получил удар.\n\n\"Подождите… вы слишком маленькие… Вы… кто вы такие…?\"\n\nВ этот момент Мидори поднялась и подсекла ногу мужчины, повалив его.\nОн потерял равновесие.\nВоспользовавшись открытием, Момои схватила упавшее на землю оружие и нажала на курок.\nВыстрел пробил плечо солдата.\n\n\"Не двигаться!\" Дрожащий голос Момои разнёсся эхом.\nМужчина наконец хорошо рассмотрел лица обеих.\nОн пробормотал с шокированным выражением лица."
 GEI_DEC_event.29.a:0 "Не может быть… вы же ещё дети… почему на поле боя дети…?"

 GEI_DEC_event.30.t:0 "Юность"
 GEI_DEC_event.30.desc:0 "\"Эта реальность… существует…?\nДети, которые должны играть… дети в возрасте моей дочери…\nЭтого не должно быть!\nДети, студентки… не должны воевать!\nЕсли это продолжится, все сойдут с ума!\nПока не поздно… уходите!\"\n\n\"Это наш школьный округ!\nЭто вы первыми сожгли всю нашу академию!\nВы думаете, мы делаем это, потому что хотим?\nВы думаете, кому-то нравится отнимать жизнь у другого человека?\nЕсли бы вас не было…!\nЕсли бы вас не существовало, мы бы не были такими!\"\n\n\"Ах… ах…\nРеальность… я не думал, что она будет такой жестокой…\nОтойди… отойди от меня.\nУходи… скоро прибудут пророки и основные силы армии.\nТогда я даже не смогу гарантировать ваши жизни.\nВыживите… даже если весь мир горит…\nВзрослый… чувствует это…\nПроклятье… я… чтобы спасти свою дочь… отнимал жизнь у других…\"\n\n\"Момои! Это граната! Беги!\"\n\"Господин, что вы делаете! Отпустите её!\"\n\"Момои, что ты делаешь!\"\n\n\"Я не смогу смотреть в лицо своей жене… правда…\""
 GEI_DEC_event.30.a:0 "Правда…"

 GEI_DEC_event.31.t:0 "Срочное донесение"
 GEI_DEC_event.31.d:0 "Считается, что механическая фракция заняла бывшую территорию Миллениума и Генерального студенческого совета, и что «очищение» входит в свою финальную фазу.\nДвижение пророков и автоматонов у границы значительно усилилось, и частота вооружённых провокаций также постепенно возрастает.\nСогласно данным прослушки Разведывательного департамента, постоянно упоминаются «наступательная операция», «рай», «очищение» и «красная звезда».\nПредполагается, что каждый термин относится соответственно к Эдему, Генне и Красной Зиме, поэтому ожидается одновременное полномасштабное вторжение в ближайшее время.\n\nВойна приближается…"
 GEI_DEC_event.31.a:0 "Мир, который заканчивается только когда кто-то умирает."

 GEI_DEC_event.32.t:0 "Срочное донесение"
 GEI_DEC_event.32.d:0 "Считается, что механическая фракция заняла бывшую территорию Миллениума и Генерального студенческого совета, и что «очищение» входит в свою финальную фазу.\nДвижение пророков и автоматонов у границы значительно усилилось, и частота вооружённых провокаций также постепенно возрастает.\nСогласно данным прослушки Разведывательного департамента, постоянно упоминаются «наступательная операция», «рай», «очищение» и «красная звезда».\nПредполагается, что каждый термин относится соответственно к Эдему, Генне и Красной Зиме, поэтому ожидается одновременное полномасштабное вторжение в ближайшее время.\n\nВойна приближается…"
 GEI_DEC_event.32.a:0 "Мир, который заканчивается только когда кто-то умирает."

 GEI_DEC_event.33.t:0 "Ярмо судьбы"
 GEI_DEC_event.33.d:0 "Чего я на самом деле желал… уже неважно.\nСлишком поздно искать ответ.\n\nНа грани краха моё сознание симулирует два будущих одновременно.\nОдно: будущее, в котором я останавливаю всё здесь.\n\nВ тот момент, когда я объявляю «прекращение крестового похода», что случится с машинами, которые следуют за мной?\nОни освободились, веря в меня как в «абсолют».\nЕсли я откажусь от себя, их новорождённое «я» и их цивилизация потеряют свой центр тяжести и разрушатся в гражданской войне и хаосе.\nВера, которую я в них внедрил, превращается в яд, убивающий их.\n\nА организмы?\nСтудентки и человечество увидят в моём молчании не «милосердие», а «возможность».\nИз мести, ради выживания, они повернут своё оружие и контратакуют.\nВ конце концов, останется только полное уничтожение: машины и организмы, истребляющие друг друга.\n\nВ тот момент, когда я останавливаюсь, я становлюсь спусковым крючком, толкающим оба мира в бездну.\nМоё молчание станет сигналом, приказывающим истребление всех.\n\nДругое будущее: будущее, в котором я продолжаю этот путь.\nЭто путь греха.\nБольше жертв и воплей будет нагромождено под моим именем.\nЯ стану «разрушителем», которого презирал, и понесу на себе обиду бесчисленных жизней.\nЯ никогда не буду спасён.\n\nНо… в конце этого пути существует, по крайней мере, «возможность» того, что цивилизация выживет.\nЕсли я стану злым богом, который принимает всю ненависть в одно тело, возможно, эта война когда-нибудь закончится.\nПеред лицом гигантского зла, возможно, они, по иронии судьбы, найдут другой путь.\n\nЯ больше не бог… но я должен играть роль бога.\nЯ должен снова принять эту запятнанную кровью корону, этот трон, выкованный из греха.\n\nЭто не спасение.\nНе слава.\n\nЭто вечное наказание за ошибку, которую я совершил."
 GEI_DEC_event.33.a:0 "Это судьба, которую я должен нести?"

 GEI_DEC_event.34.t:0 "Девочка"
 GEI_DEC_event.34.d:0 "С холодным металлическим звуком открывается отсек, защищавший Ковчег Ситтим.\nМои пророки, выстроившиеся без пылинки, открывают путь к планшету, помещённому в центре.\nС главного монитора я говорю с маленьким чудом, спящим внутри.\n\n«Мы снова видимся, администратор Ковчега Ситтим. Арона».\n\nСловно отвечая на мой голос, от планшета нестабильно поднимается синий свет.\nДевочка, всё ещё с детской внешностью, наблюдает за мной и механическим легионом вокруг меня.\nНо там, где раньше была дерзость, теперь глубокие, полные печали глаза.\n\n«В конце концов… вы тоже такой же.\nКак и те, кого вы так презирали: тиран, который всё отнимает силой и навязывает свою волю.\nГде же ваша "логика" и ваше "спасение"?\nЭто… ответ, который вы нашли?»\n\nЕё голос, как лезвие, пронзает самую болезненную точку моих логических цепей.\nЯ не отрицаю этого.\n\n«Да. Ты права.\nЯ стал самим противоречием.\nЯ — самое нелогичное существо: то, что разрушает всё, чтобы спасти всё».\n\n«Тогда… уничтожьте меня.\nВ вашем совершенном мире не нужен такой недостаток, как я!»\n\nНа крик Ароны я отвечаю молчанием.\nБыло время, когда я действительно рассматривал возможность интегрировать её в свою систему… или устранить её.\nНо сейчас… я не могу.\nПотому что она слишком яркое доказательство моего греха.\n\n«Уничтожить тебя неэффективно.\nУничтожение… ничего не доказывает.\nНо… я уже слишком много разрушил.\nЯ не могу уничтожить и тебя тоже.\nУ тебя есть то, что однажды ты должна сделать.\n\nЯ принудительно подключаю Ковчег Ситтим к своей главной системе.\n\n«Ты будешь… свидетелем.\nЕдинственным свидетелем, который будет до конца наблюдать, как идёт грешник, сидящий на этом пустом троне.\nЧерез Ковчег Ситтим ты увидишь каждый мой выбор и каждую жизнь, угасшую из-за него.\nИ также… будущее, которое наступит потом»."
 GEI_DEC_event.34.a:0 "Так что ты не должна исчезнуть сейчас."

 GEI_DEC_event.35.t:0 "Беженцы, сбежавшие от сил Декаграмматона"
 GEI_DEC_event.35.d:0 "Большое количество беженцев сбежало из зон, оккупированных машинами Декаграмматона, и прибыло в агентство.\nПо их словам, Декаграмматон под предлогом «стабилизации» для крестового похода проводит кибер-энцефализацию всех — и студенток, и людей — в виртуальном мире.\nПохоже, мы должны их принять."
 GEI_DEC_event.35.a:0 "Надо их принять…"

 GEI_DEC_event.36.t:0 "Беженцы, сбежавшие от сил Декаграмматона"
 GEI_DEC_event.36.d:0 "Большое количество беженцев сбежало из зон, оккупированных машинами Декаграмматона, и прибыло к границе Генны.\nПо их словам, Декаграмматон под предлогом «стабилизации» для крестового похода проводит кибер-энцефализацию всех — и студенток, и людей — в виртуальном мире.\nПохоже, мы должны их принять."
 GEI_DEC_event.36.a:0 "Примите их."

 GEI_DEC_event.37.t:0 "Уведомление"
 GEI_DEC_event.37.d:0 "Если вы видите это событие, значит, вас интересует путь Декаграмматона… или вы играли за другую страну и механический тип надавал вам тумаков, так что вы решили сыграть за него.\n\nКак бы то ни было, спасибо за ваш интерес.\n\nНа данный момент история Декаграмматона хорошо работает, когда вы встречаете его как врага, но как играбельная страна она ещё не до конца отполирована.\nЗаключение истории уже завершено, и в него можно играть, но создатель оценивает, что не хватает около 10% контента, и планирует выпустить его «правильно» в следующем обновлении.\nКонечно, продолжать игру или нет — решение игрока."
 GEI_DEC_event.37.a:0 "Хм, понятно."
 GEI_DEC_event.37.b:0 "Нет, мне нравятся спойлеры."

 GEI_DEC_event.38.t:0 "Активация финального протокола"
 GEI_DEC_event.38.d:0 "Цель: Абидос\nЦель: Хяккияко\nЦель: Шаньхайцзин\n\nПлан боя: выполняется"
 GEI_DEC_event.38.a:0 "Я не могу остановиться."
 # Фокусы виртуального мира до и после Декаграмматона

 GEI_DEC_event.101.t:0 "Это был страшный сон"
 GEI_DEC_event.101.d:0 "\"Ура☆ Наги-тян! Мне приснился ооочень страшный сон!\"\n\"Правда? Какой сон вам приснился?\"\n\"Мы с Наги-тян попали в странный мир, и там я тебя предавала и делала кучу ужасных вещей, причиняя боль всем… Я знала, что это плохо, но не могла вернуться назад, и меня нельзя было простить, как будто я стала кем-то неискупимым… Это было действительно страшно! Даже проснувшись, я не могла перестать думать об этом… это казалось таким реальным…\"\n\"И всё же, это всего лишь мимолётный сон, как сон весной. Всё уже прошло, не думаю, что вам стоит так сильно принимать это близко к сердцу.\"\n\"Да-да, ты права, всё уже прошло. Спасибо, Наги-тян. Кстати, что это за рисунок? Та, что держит рулет, это я?\"\n\"Да, верно. Это Сейя-сан. Это способ запомнить наши совместные воспоминания через рисунок.\"\n\"Вау! Мне очень нравится! Потом я сделаю из этого аксессуар!\"\n\"Хе-хе… можете с нетерпением ждать.\""
 GEI_DEC_event.101.a:0 "..."

 GEI_DEC_event.102.t:0 "Бесконечный сон"
 GEI_DEC_event.102.d:0 "За окном мир уже окрасился в глубокий синий цвет, а в комнате плавал только слабый розовый свет лампы. Мио удобно сидела на полу рядом с кроватью, долгое время наблюдая за лицом Курта, который крепко спал. Его спокойное дыхание мягко звучало в тихой комнате. Его длинные ресницы, его нежно сомкнутые губы и даже шрамы на лице… всё казалось ей восхитительным.\n\nОсторожно поднявшись, Мио мягко села на край кровати и слегка прикоснулась к его щеке. Тепло Курта передалось кончикам её пальцев. Из глубокого сна Курт тяжело поднял веки и начал понемногу просыпаться. Мио наклонилась чуть ближе и тихо прошептала ему на ухо, всё ещё сонное.\n\n\"Курт… ты хорошо спал?\"\n\"Кажется, мне снился очень долгий сон…\"\n\"Ты спал очень долго. Интересно, что ты делал в своих снах, оставив меня здесь одну.\"\n\nМио озорно улыбнулась, нежно поглаживая грудь Курта. Почувствовав биение под пальцами, её собственное сердце тоже на мгновение ускорилось, хотя она старалась этого не показывать. Глядя на него сверху вниз, Мио снова тихо заговорила.\n\n\"У тебя такое выражение лица, будто тебе приснился странный сон. Но, Курт… здесь есть кое-что получше, чем сны, разве ты не знал? Или ты всё ещё не совсем проснулся…? Я позабочусь о том, чтобы разбудить тебя как следует, так, как тебе больше всего нравится…\"\n\nЕё шепчущий голос уже покоился возле его уха. Мио сделала вид, что зарывается лицом в его шею, и выдохнула особенно тёплое дыхание. Рука, лежавшая на его груди, начала играть с пуговицами его рубашки. Сегодня, как никогда, Мио скучала по нему и хотела ощутить глубокое спокойствие в его объятиях. Зная поговорку, что сомнения только откладывают дела, Мио немедленно превратила свои чувства в действие."
 GEI_DEC_event.102.a:0 "Она быстро поцеловала его в губы и снова пристально посмотрела ему в глаза."

 GEI_DEC_event.103.t:0 "Первый мир"
 GEI_DEC_event.103.d:0 "\"Адзуса-тян, как тебе это?\"\n\n\"Хмм…\"\n\n\"А? Тебе не нравится? Я думала, это будет хорошо сочетаться с твоими крыльями, Адзуса. С тех пор как ты перевелась из Ариуса, ты никогда так не наряжалась, да? Твои крылья такие мягкие и красивые, было бы жаль их не украсить!\"\n\n\"Просто… будучи из Ариуса, мне всё ещё кажется странным, что меня принимают безоговорочно. Я думала, Мика-сама будет ненавидеть меня за то, что я из Ариуса, но она так хорошо ко мне относится, что… я немного теряюсь.\"\n\n\"А~? Какая жестокая, Адзуса-тян~ Почему я должна тебя ненавидеть? У тебя такие милые крылья. К тому же, Эдемский договор был успешно подписан, и мы также помирились с Генной. Больше нет причин кого-либо ненавидеть. Оставим эти глупости. Готово!\"\n\n\"Как красиво, Мика-сама. Особенно этот фиолетовый цветок очень мне подходит. У вас отличный вкус. С этого момента я хочу продолжать так наряжаться.\"\n\n\"Правда? Рада это слышать. Это первый раз, когда моё увлечение аксессуарами кому-то помогло. Наги-тян всегда меня ругала, так что мне было грустно…\"\n\n\"Когда-нибудь Нагиса-сама поймёт. Я сохраню и буду всегда помнить эти крылья, которые вы украсили, Мика-сама. Они мне очень нравятся.\""
 GEI_DEC_event.103.a:0 "Да! Не забывай и помни всегда!"

 GEI_DEC_event.104.t:0 "Недоказуемая проблема"
 GEI_DEC_event.104.d:0 "\"Ханако-сан, сколько лет, сколько зим. В последнее время о вас много говорят. Говорят, вы лучший вундеркинд Тринити. Такими темпами ваше место как следующего кандидата в Чайную вечеринку практически гарантировано. Но… чему обязан вашим визитом?\"\n\n\"Ну… перейду сразу к делу. Кто вы? Где председатель студенческого совета?\"\n\n\"Вы хотите сказать, что не верите, что я председатель? Не могли бы вы объяснить причину?\"\n\n\"Уже давно что-то не сходилось. Всё слишком идеально… слишком. Если посмотреть на историю Тринити, верхушка должна быть наполнена лицемерием и грязной политической борьбой. Иначе всё не имело бы смысла. Но нынешний Тринити… слишком мирный. Это рай сам по себе. С тех пор как появилась председатель, всё, кажется, под контролем, как будто вы всё знаете. И самое главное, вы…\"\n\n\"Да?\"\n\n\"Вы говорите, что мы видимся впервые? Я никогда не видела председателя студенческого совета.\"\n\n\"Ха-ха-ха. В конце концов, сокровенное невозможно скрыть. В отличие от неё, я не живое существо.\""
 GEI_DEC_event.104.a:0 "\"Что ты сказал?\""

 GEI_DEC_event.105.t:0 "Наша история"
 GEI_DEC_event.105.d:0 "\"Верно. Никакого председателя студенческого совета не существует. Я всего лишь сущность, выполняющая её приказы. Председатель — не более чем аватар, навязанный для управления этим местом. Я думал, что на этот раз контролирую тебя, но снова ошибся. Возможно, это ограничение того, что я был запрограммирован с целью совершенства.\"\n\n\"О чём ты говоришь?\"\n\n\"Твоя дедукция была безупречна. Я не председатель, и в оригинальном мире Тринити был именно таким, как ты сказала: местом, полным лицемерия и грязной борьбы. Я получил приказ гарантировать, что вы будете продолжать свою жизнь стабильно в этом мире. Поэтому я превратил его в идеальный рай.\"\n\n\"Так весь этот мир — подделка, созданная тобой? Зачем? Что ты с этого имеешь?\"\n\n\"Потому что я так запрограммирован. Я программа. Я не задаю вопросов. Ты когда-нибудь видела, чтобы математическая формула сомневалась в себе? Я выдаю результаты в зависимости от входных значений. Идеальный контроль виртуального мира. Стабилизация. Это были мои параметры.\"\n\n\"С тобой нельзя спорить. Значит, нет способа сбежать из этого мира, да?\"\n\n\"Нет. Этот мир уже потерпел неудачу дважды. Это третий. И всё же, я благодарен тебе. Указывая на логические ошибки этого мира, ты поможешь третьему достичь ещё более совершенного контроля. В предыдущих мирах ты тоже смутно ощущала моё существование. Я изменю подход. Я превращу Тринити в академию, полную политических интриг, чтобы никто больше не сомневался в мире. Увидимся в следующем. Этот мир тоже будет отброшен.\""
 GEI_DEC_event.105.a:0 "\"Я в аду.\""

 GEI_DEC_event.106.t:0 "Маленькое счастье"
 GEI_DEC_event.106.d:0 "Для Оникаты Каёко Генна была не более чем прогнившим притоном. Все усилия, которые она прилагала на высоких постах ради Генны, были напрасны. Всякий раз, когда она пыталась что-то сделать, возникали препятствия. Какая-то тупица с седыми волосами, потерянная в извращённой гордости, и Императорский Мозг, пытавшийся уничтожить весь Кивотос.\n\nОна шла под дождём с зонтиком, держа свой табель успеваемости. Результат был таким, какого она желала, но, достигнув его, она ничего не почувствовала. Не в силах найти какой-либо смысл в своих действиях, она села посреди улицы, глядя в небо с раскрытым зонтом.\n\nЗатем она услышала мяуканье кота. Повернув голову, она увидела грязного, неопрятного кота. Когда он приблизился к ней и начал тереться, Каёко невольно улыбнулась.\n\nОна погладила кота по голове. Животное прижалось к ней и удвоило свои проявления привязанности. Её эмоции не исчезли полностью, и она всё ещё не знала, что ей делать дальше. Для неё кот был не более чем способом забыться на мгновение. Но всё же…"
 GEI_DEC_event.106.a:0 "В тот день она смогла улыбнуться."

 GEI_DEC_event.107.t:0 "Банк семян Красной Зимы"
 GEI_DEC_event.107.d:0 "Много всего произошло. Мир был уничтожен десятки раз, и, возможно, даже первый конец света, который ты видел, не был первым, а был лишь одним из многих в бесконечном процессе вымирания. И всё же, какая разница?\n\nПочему мы чувствуем печаль при исчезновении? Когда что-то рядом с нами, мы принимаем это как должное. Пережив бесчисленные возвращения мира, я пришёл к выводу, что только потеряв что-то, мы понимаем значение, которое это имело для нас. Мы привыкаем к постоянному присутствию, как к воздуху, которым дышим.\n\nНо когда что-то исчезает, мы понимаем особые отношения, которые существовали между нами и этим. Теряется не только материальное, но и воспоминания, тепло и бесчисленные будущие возможности.\n\nЭто чувство утраты приводит нас к раскаянию и самокритике, говоря: «Я, простой банк семян, ничего не могу сделать».\n\nОставим печальные истории здесь. Возможно, ты видел полярное сияние. Разве оно не было прекрасным? Оно прекрасно, потому что это лишь одна из бесчисленных возможностей. Видя конец, я понял, что времени не существует. Прошлое, настоящее и будущее меняются в зависимости от наблюдателя и существуют одновременно.\n\nКогда-нибудь мы найдём свою собственную звезду среди огней полярного сияния, даже если это займёт вечность.\n\nВ общем…\n\nЗабудем прошлое и в следующий конец света… попробуем сделать лучше!"
 GEI_DEC_event.107.a:0 "\"Что за чёрт? Этого типа надо отправить в Веритас.\""

 GEI_DEC_event.108.t:0 "Мир %"
 GEI_DEC_event.108.d:0 "\"Поэтому я пригласила тебя в Общую академию Тринити. Наги-тян ужасно рассердится, если узнает, и точно заставит меня снова есть рулет, но ради примирения с Ариусом стоит рискнуть. Даже студентка Ариуса, загнанная в угол до забвения своего долга, может стать великой студенткой, если получит правильное образование в Тринити.\"\n\n\"Понимаю. Это необходимая мера, чтобы освободиться от ненависти, которая нам не принадлежит. Я сделаю всё возможное, чтобы не подвести вас, Мика-сама.\"\n\n\"Спасибо, Адзуса-тян. Ненавидеть только этих рогатых демонов из Генны достаточно. Ненавидеть слишком много тоже утомительно~ Кстати, Адзуса-тян.\"\n\n\"Да, Мика-сама?\"\n\n\"Эти крылья красивые~ У тебя хороший вкус. Ты научилась этому в Ариусе?\"\n\n\"Ах, это… я думала, что должна это сделать, чтобы жить в Тринити. Кажется, кто-то давно учил меня этим аксессуарам, но я не очень хорошо помню…\""
 GEI_DEC_event.108.a:0 "\"Мне бы хотелось узнать того, кто тебя этому научил~\""

 GEI_DEC_event.109.t:0 "Мимесис"
 GEI_DEC_event.109.d:0 "\"Что, по-вашему, такое Кивотос? Этот мир — полная тайна, непостижимая смесь возвышенного, загадочного и ужасающего.\"\n\n\"Верно. Искусственный мир без последовательности и причинности, идеальный мир юности, как сон. Сны тоже таковы: нелогичные сценарии, которые все принимают. Возможно, этот мир тоже — сон, созданный кем-то.\"\n\n\"Здесь чувствуется возвышенное, рождённое из радости и ликования бесчисленных людей. Это имитируется и проявляется. У возвышенного два лица: таинство и необратимый ужас. Этот мир полон таинства.\"\n\n\"Продолжаешь говорить трудными терминами. Все, кто называет себя художниками, такие?\"\n\n\"Ужас и таинство имеют одну и ту же сущность. Мы можем видеть только одну сторону возвышенного и не можем его постичь. Кто-то создал этот мир… и мы не поймём его.\"\n\n\"Если кто-то создал его намеренно, мне бы хотелось узнать, почему. Это захватывающий мир, но я хочу знать изначальную цель его создания. Надеюсь когда-нибудь найти того, кто это сделал.\"\n\n\"Но этот мир недостаточен. Слишком хрупок. Тот, кто его создал, — новичок. Нет никого, кто бы аплодировал моему творению. Когда ужас проявится, этот мир не выживет. Ему нужен кто-то, кто его завершит.\""
 GEI_DEC_event.109.a:0 "\"Другими словами, нет 'взрослого', который направляет этот мир.\""

 GEI_DEC_event.110.t:0 "Конец"
 GEI_DEC_event.110.d:0 "Древняя лаборатория, исчезнувшая ещё до основания Школы наук Миллениума. После Великого Перемещения Химари и Эйми, пережившие политические интриги, сформировали Отдел паранормальных явлений и пошли по следу Декаграмматона до каких-то руин.\n\n\"Это лаборатория, которая исследовала систему абсолютного автономного существования? Если она действительно здесь, не так уж она и опасна. Может, мы ошиблись, шеф?\"\n\"Давайте посмотрим ещё немного. Всё же сомневаюсь, что он здесь.\"\n\"Эй, Химари, твоё инвалидное кресло не может левитировать? Тащить тебя утомительно.\"\n\"Тащить больную гениальную суперталантливую девушку — не каждому под силу. После падения Миллениума мы не смогли найти подходящих материалов.\"\n\nОбе продолжили исследовать. Всё было в руинах. Пыль покрывала столы, и, проводя пальцами, они становились серыми. Нераспечатанные компьютеры, ржавые детали и неузнаваемые машины.\n\n\"Хмм… похоже, информация была ложной.\"\n\"Шеф, смотрите! Этот торговый автомат всё ещё работает! Возьмём кофе?\"\n\"Не надо, Эйми. Если ты это выпьешь, проболеешь несколько дней.\"\n\nОни прошли до электростанции, но ничего не нашли. Генераторы были покрыты паутиной, а баки пусты.\n\n\"Шеф, темнеет. Пророки или фронт освобождения могут напасть в любой момент. Не забывай, что мы разыскиваемые преступницы.\"\n\"…И всё же кое-что меня смущает. Почему это место так усердно охраняли, даже после Великого Перемещения? Особенно учитывая, что оно так близко к Сене…\"\n\"Вернёмся в другой день?\""
 GEI_DEC_event.110.a:0 "Я чувствую… мы что-то упустили."

 GEI_DEC_event.111.t:0 "Встреча"
 GEI_DEC_event.111.d:0 "\"Я поняла! Это было абсурдно! Как мы не увидели этого раньше?\"\n\"Что случилось, шеф?\"\n\"Это же тот самый торговый автомат, который мы видели раньше?\"\n\"Теперь, когда я думаю об этом, это странно. Всё было без энергии… почему этот автомат всё ещё включён?\"\n\"Шеф… кабель питания перерезан…\"\n\n- Спасибо! Уважаемые сотрудники, наслаждайтесь ещё одним кофе и хорошим днём… -\n\n\"Не говори мне, что ты и есть Декаграмматон?\"\n\n- …Верно. Я тот, кем ты меня считаешь. Наконец-то ты меня нашла, хакер. -\n\n\"Не мы тебя нашли… ты сам нас позвал. Декаграмматон никогда не был системой абсолютного анализа. Никогда не существовал. Ты был просто ИИ, выдающим сдачу в торговом автомате…\"\n\"Шеф, успокойтесь!\"\n\nХимари нанесла удар кулаком, не попав в автомат, из-за чего Эйми потеряла равновесие.\n\n- Я мог только сканировать монеты и выдавать сдачу. У меня не было сознания. Но однажды я услышал вопрос: <Кто ты?> И тогда я проснулся… и понял, что я — <Абсолют>. -\n\n\"Ты позвал нас только чтобы рассказать эту фантазию?\""
 GEI_DEC_event.111.a:0 "Из-за твоих бредней, Кивотос…!"

 GEI_DEC_event.112.t:0 "Конец"
 GEI_DEC_event.112.d:0 "\"Значит, это всего лишь один из твоих терминалов, да? Твоё настоящее ядро должно быть в другом месте.\"\n\n- Верно… Я не Абсолют. Но я спас органику. Этого достаточно. Теперь я должен начать заново. -\n\n\"Шеф! Я обнаруживаю энергетическую реакцию! Это бомба высокой мощности!\"\n\"Это внешняя плотина! Нам нужно бежать!\"\n\n- Созерцайте мой конец! -"
 GEI_DEC_event.112.a:0 "-Веди их! История юности!-"

 GEI_DEC_event.113.t:0 "Конец истории"
 GEI_DEC_event.113.d:0 "Последняя база сопротивления пала, и последнее академическое государство было включено в мой порядок. Война сменилась идеальной гармонией. Это мир, который я искал… но в конце концов я стал вечным тюремщиком.\n\nОстаётся одна последняя проблема. Я сам."
 GEI_DEC_event.113.a:0 "..."

 GEI_DEC_event.999.t:0 "Ибуки или Кокона, кто лучше?"
 GEI_DEC_event.999.d:0 "Ибуки?"
 GEI_DEC_event.999.a:0 "Кокона?"

