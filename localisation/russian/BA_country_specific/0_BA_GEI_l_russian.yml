 GEI_arona_control:0 "Система управления А.Р.О.Н.А"
 GEI_arona_control_desc:0 "Передовая система А.Р.О.Н.А контролирует поле боя."

 GEI_tactical_coordination:0 "Тактическая координация"
 GEI_tactical_coordination_desc:0 "Идеальная тактическая координация повышает эффективность в бою."

 GEI_coordinate_color_forces:0 "Координация сил Цвета"
 GEI_coordinate_color_forces_desc:0 "Все подразделения, поражённые Цветом, движутся к единой цели."

 # Категория решений
 GEI_the_twisted_will_decisions:0 "Искажённая воля"
 GEI_the_twisted_will_decisions_desc:0 "Всё сущее возродится под нашей волей. Мы искажаем реальность, загрязняем технологии и проникаем в разум врага, чтобы посеять ужас. Расчёты А.Р.О.Н.А., искажённые Цветом, предлагают идеальную тактику, а пророки Декаграмматона вынесут приговор нашим врагам. Промышленность, армия, даже сама суть жизни... Всё это не более чем инструмент для плана «Сенсея». Это не просто война. Это процесс создания нового мира."

 GEI_plunder_operations:0 "Операции по мародёрству"
 GEI_plunder_operations_desc:0 "Мы грабим ресурсы и снаряжение врага, чтобы укрепить нашу мощь."
 
 GEI_sensei_command:0 "Командование Сенсея"
 GEI_sensei_command_desc:0 "Мы проводим военные операции под командованием Сенсея Цвета."
 
 GEI_arona_tactical_operations:0 "Тактические операции А.Р.О.Н.А"
 GEI_arona_tactical_operations_desc:0 "Мы обеспечиваем тактическое преимущество, используя передовую систему А.Р.О.Н.А."

 GEI_raid_military_facilities:0 "Налёт на военные объекты"
 GEI_raid_military_facilities_desc:0 "Мы совершаем налёты на военные объекты врага для получения снаряжения и ресурсов."
  
 GEI_color_industry:0 "Промышленность, поражённая Цветом"
 GEI_color_industry_desc:0 "Наша промышленность трансформировалась, чтобы стать более эффективной под влиянием Цвета."
 
 GEI_efficient_organization:0 "Эффективная организация"
 GEI_efficient_organization_desc:0 "С силой Цвета наша армия была организована более систематически."
 
 GEI_arona_production:0 "Управление производством Ароны"
 GEI_arona_production_desc:0 "При поддержке Ароны эффективность производства возросла."
 
 GEI_production_boost:0 "Усиленное производство"
 GEI_production_boost_desc:0 "Сила Цвета значительно увеличила наши производственные мощности."
 
 GEI_coordinated_offensive:0 "Гармоничное наступление"
 GEI_coordinated_offensive_desc:0 "Наши атаки выполняются с идеальной координацией."
 
 GEI_signal_warfare:0 "Война радиопомех"
 GEI_signal_warfare_desc:0 "Мы создаём помехи вражеской связи и защищаем нашу информацию."
 
 GEI_final_offensive_buff:0 "Финальное наступление"
 GEI_final_offensive_buff_desc:0 "Это будет решающий удар."
 
 GEI_final_offensive_debuff:0 "Сокрушительное наступление Цвета"
 GEI_final_offensive_debuff_desc:0 "Мы бессильны перед подавляющей мощью Цвета."

 GEI_industry_control:0 "Контроль над промышленностью"
 GEI_industry_control_desc:0 "Мы контролируем и трансформируем промышленность с помощью силы Цвета."
 
 GEI_attack_operations:0 "Наступательные операции"
 GEI_attack_operations_desc:0 "Мы проводим организованные и систематические атаки."
 
 GEI_signal_operations:0 "Операции с сигналами"
 GEI_signal_operations_desc:0 "Мы создаём помехи вражеской связи и сеем хаос."
 
 GEI_shadow_operations:0 "Операции теней"
 GEI_shadow_operations_desc:0 "Мы сокрушаем волю врага с помощью скрытых операций."
 
 GEI_american_extraction:0 "Извлечение ресурсов Соединённых Штатов"
 GEI_american_extraction_desc:0 "Мы превращаем ресурсы Соединённых Штатов в наши."

 GEI_convert_civilian_industry:0 "Конверсия гражданской промышленности"
 GEI_convert_civilian_industry_desc:0 "Мы преобразуем гражданские фабрики в военные заводы."
  
 GEI_intensify_signal_interference:0 "Усилить создание помех"
 GEI_intensify_signal_interference_desc:0 "Мы полностью парализуем вражескую связь."
 
 GEI_shadow_infiltration:0 "Инфильтрация теней"
 GEI_shadow_infiltration_desc:0 "Мы сеем ужас внутри врага."

 GEI_efficient_production_control:0 "Эффективное управление производством"
 GEI_efficient_production_control_desc:0 "Под влиянием Цвета эффективность производственных объектов максимизирована."

 GEI_military_production_bonus:0 "Усиленное военное производство"
 GEI_military_production_bonus_desc:0 "Производство военных поставок ускорено."

 GEI_rapid_factory_conversion:0 "Быстрая конверсия фабрик"
 GEI_rapid_factory_conversion_desc:0 "Конверсия фабрик происходит быстрее."

 GEI_shadow_fear:0 "Ужас теней"
 GEI_shadow_fear_desc:0 "Присутствие невидимого врага держит население в страхе."

 GEI_intensified_interference:0 "Усиленные помехи"
 GEI_intensified_interference_desc:0 "Все коммуникации заблокированы, цепочка командования парализована."

 GEI_resource_depletion:0 "Истощение ресурсов"
 GEI_resource_depletion_desc:0 "Эрозия Цвета истощает ресурсы региона."

 GEI_reality_distortion_debuff:0 "Феномен искажения реальности"
 GEI_reality_distortion_debuff_desc:0 "Искажение реальности, вызванное Цветом, серьёзно препятствует всем военным операциям."

 GEI_american_resource_extraction:0 "Извлечение ресурсов Соединённых Штатов"
 GEI_american_resource_extraction_desc:0 "Мы силой извлекаем обильные ресурсы Соединённых Штатов."

 GEI_systematic_genocide:0 "Систематический геноцид"
 GEI_systematic_genocide_desc:0 "Мы осуществляем геноцид с помощью силы Цвета."

 GEI_reduced_occupation_cost:0 "Сниженная стоимость оккупации"
 GEI_reduced_occupation_cost_desc:0 "Сила Цвета резко снижает затраты на оккупацию."

 GEI_infiltrated_research:0 "Инфильтрированные исследования"
 GEI_infiltrated_research_desc:0 "В исследовательские центры этой страны проникли, поэтому её исследовательский потенциал снижается."

