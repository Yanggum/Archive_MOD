 idea_BA_crisis_flood_of_machines_1_failed: "Ошибка расчёта"
 idea_BA_crisis_flood_of_machines_1_failed_desc: "...Завоевание Британских островов, которое должно было быть завершено, затягивается. Это плохой знак, и, возможно, мне стоит пересмотреть свою цель с самого начала. Нет. Я должен добиться этого, чего бы это ни стоило."
