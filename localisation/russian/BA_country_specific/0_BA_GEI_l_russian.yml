 GEI_decagramaton_alliance_decision_category: "Поиск союзников"
 GEI_decagramaton_alliance_decision_category_desc: "Найти союзников, желающих следовать воле Декаграмматона, — чрезвычайно трудная задача. Большинство стран не будут готовы сотрудничать с Декаграмматоном. Однако, если это страна, правительство которой уже захвачено роботами, тогда Декаграмматон может попытаться §Yпромыть им мозги§!."

 GEI_finding_alliance_GEH: "Предложение альянса [GEH.GetNameDef]"
 GEI_finding_alliance_GEH_desc: "Сорасаки Хина ведёт себя так, будто она живой организм, но Декаграмматон уже определил, что на самом деле это робот, заменивший настоящую «Сорасаки Хину». Декаграмматон может попытаться промыть Хине мозги. В случае успеха [GEH.GetNameDef] присоединится к нашему альянсу. А если провал? Враждебные отношения просто сохранятся, так что для нас не будет пагубных последствий."

