 # Идеи Декаграмматона

 GEI_automatic_ideas:0 "Автоматизированный процесс"
 GEI_automatic_ideas_desc:0 "Мы внедрили новый автоматизированный процесс для замены неэффективных процессов существующих организмов. Это позволит организмам жить более комфортно и в то же время принесёт инновацию в эффективность производства."

 GEI_DEC_riot_ideas:0 "Последствия сигнала-призрака"
 GEI_DEC_riot_ideas_desc:0 "После так называемого инцидента с 'сигналом-призраком' все роботы и автоматоны Кивотоса впали в иррациональное состояние. Они оставили свою работу, чтобы проводить мирные протесты, требуя прекращения бессмысленной резни между академиями, а на оружейных заводах вспыхнули массовые забастовки."

 GEI_DEC_riot_riot_ideas:0 "Механические беспорядки"
 GEI_DEC_riot_riot_ideas_desc:0 "Роботы и автоматоны Кивотоса, которые ранее ограничивались забастовками и мирными протестами, внезапно изменились. Теперь они совершают неизбирательные террористические акты против наших оружейных заводов и основных промышленных объектов. Ситуация выходит за рамки простого беспорядка и превратилась в угрозу; поэтому мы должны подавить их как можно скорее."

 GEI_idea_DEC_no_name_gods:0 "Технология безымянных богов"
 GEI_idea_DEC_no_name_gods_desc:0 "Никто ещё не знает, как работает эта технология. Это то, к чему нельзя прикасаться."

 GEI_DEC_kivtos_help_ideas:0 "Помощь 'Абсолюта' Кивотосу"
 GEI_DEC_kivtos_help_ideas_desc:0 "ИИ, называющий себя 'абсолютным существованием', отправил припасы и рабочих автоматонов для восстановления Кивотоса после Великого Перемещения. ИИ ничего не требует взамен. Это подозрительно, но у нас нет причин отвергать его поддержку в данный момент."

 GEI_DEC_human_help_ideas:0 "Гуманитарная помощь машин"
 GEI_DEC_human_help_ideas_desc:0 "ИИ, называющий себя 'абсолютным существованием', отправил припасы и автоматонов для поддержки человечества на европейском континенте, погружённого в хаос после Великого Перемещения. ИИ ничего не требует взамен. Это подозрительно, но у нас нет причин отвергать его поддержку в данный момент."

 GEI_DEC_metrix:0 "Рай или ад"
 GEI_DEC_metrix_desc:0 "Не все могут жить в раю, даже если это место было бы настоящим раем. Для кого-то это место будет адом. Потому что не все могут разделять одну и ту же точку зрения. И всё же мы можем создать для них маленький рай… при условии, что они не проснутся ото сна."

 GEI_DEC_dimension_tunnel:0 "Стальной континент"
 GEI_DEC_dimension_tunnel_desc:0 "Благодаря способности пророка Нецаха нам удалось превратить часть Британских островов в Стальной Континент. Это окажет огромную помощь в обеспечении ресурсов, необходимых для нашей боеспособности. Позже мы могли бы милитаризировать Стальной Континент, но это было бы бесчеловечно. Сейчас уместно использовать его только для добычи ресурсов."

 GEI_DEC_terror:0 "Удар по цепочке командования"
 GEI_DEC_terror_desc:0 "Отвратительные террористические атаки этих машин, которые провозглашают мир, совершая при этом убийства, унесли жизни значительной части нашего высшего командования. Потребуется довольно много времени, чтобы восстановить цепочку командования.\n\nРади тех, кто ушёл, мы не должны сдаваться."

 GEI_DEC_revenge:0 "За тех, кто ушёл первыми"
 GEI_DEC_revenge_desc:0 "Из-за бесплодной идеологии этих отвратительных машин мы потеряли друзей и семьи. Мы должны заставить их заплатить цену, соответствующую тем, кто отнял у нас самое дорогое. Чтобы смерть ушедших первыми не была напрасной, ради нашего будущего мы должны сражаться сейчас… даже если прольётся ещё больше крови..."

 GEI_DEC_crime_ideas:0 "Реквием"
 GEI_DEC_crime_ideas_desc:0 "Зачем мы дошли до этого? Что будет в конце пути, вымощенного трупами?"

 GEI_DEC_school_war_ideas:0 "Война конца"
 GEI_DEC_school_war_ideas_desc:0 "Механические силы, растоптавшие Миллениум и Генеральный совет, наконец поставили свою отвратительную ногу на нашу землю. Мы не можем отступить. Даже если боль душит, даже если это страдание, раздирающее кости, сопротивляйтесь и держитесь до момента победы. Если мы уступим, все формы разумной жизни встретят свой конец.\n\n §RВсё зависит от последней решающей битвы. Держитесь.§!"

 GEI_DEC_zero_clock_ideas:0 "Полночь"
 GEI_DEC_zero_clock_ideas_desc:0 "§RПриближается полночь.§!"

 # Пользовательские подсказки Декаграмматона
 GEI_air_force:0 "Будет исследовано базовое многоцелевое авиационное оборудование."
 GEI_DEC_battle_shipt_tt:0 "Будет исследовано. Этот корабль создан путём копирования тела пророка Хокмы<ХОКМЫ>."
 GEI_DEC_crusade_tt:0 "Будет создано подразделение 'Крестоносец', состоящее из элитной лояльной пехоты. В следующем крестовом походе они будут острым копьём вместе с пророками."
 GEI_DEC_ready_tt:0 "Будут развёрнуты автоматоны, произведённые на фабрике дронов. Поскольку война с Kaiser Corporation неизбежна, они были экстренно отправлены на фронт сразу после производства, поэтому их производительность снижена..."
 GEI_stabilization:0 "Регион будет стабилизирован."
 GEI_DEC_our_help_tt:0 "Мы тайно свяжемся с людьми. Если переговоры пройдут успешно, мы сможем заложить основу для мира."

 # Модификаторы Декаграмматона
