l_russian:
 Hakari_Atsuko_GEI:0 "§RПропала без вести§!"

 #Древо фокусов Гематрии
 GEI_The_Colour_Focus_tree:0 "Древо фокусов Цвета"
 GEI_jaegeon:0 "Восстановление"
 GEI_jaegeon_desc:0 "Чтобы ответить на внезапно изменившуюся ситуацию, необходимо восстановить наши объекты. Мы быстро восстановим и отремонтируем наши объекты, чтобы адаптироваться к новому миру."
 GEI_factoryutilization:0 "Использование фабрик"
 GEI_factoryutilization_desc:0 "Мы слегка реструктурируем существующие фабрики, чтобы их было легче использовать. Это позволит быстро увеличить нашу промышленную мощность и улучшить нашу адаптируемость к новому миру."
 GEI_gongjangjadonghwa:0 "Автоматизация фабрик"
 GEI_gongjangjadonghwa_desc:0 "Мы будем использовать имеющиеся у нас технологии для автоматизации фабрик. Это выходит за рамки базовой автоматизации, управляемой человеческим трудом, резко сокращая необходимое количество персонала и позволяя перераспределить эту рабочую силу на другие области."
 GEI_gemateuliagunsugongjang:0 "Военная фабрика Гематрии"
 GEI_gemateuliagunsugongjang_desc:0 "Мы построим специальные военные фабрики для производства нашего оружия, что означает, что Гематрия сможет обеспечить себе значительную способность к сопротивлению в новом мире."
 GEI_yeongusilboggu:0 "Восстановление лабораторий"
 GEI_yeongusilboggu_desc:0 "Мы восстановим разрушенные лаборатории, чтобы усилить наши исследовательские возможности и быстрее адаптироваться к технологиям нового мира."
 GEI_yeongusiseoljeungchug:0 "Расширение исследовательских мощностей"
 GEI_yeongusiseoljeungchug_desc:0 "Промышленный потенциал Гематрии вырос до такой степени, что может поддерживать больше исследовательских учреждений, поэтому мы расширим эти учреждения, чтобы резко увеличить наши возможности НИОКР."
 GEI_yeongguggaeib:0 "Вмешательство в Соединённое Королевство"
 GEI_yeongguggaeib_desc:0 "После того как мы разбились на этих «Британских островах» вместе с Kaiser Corporation, мы вступили в конфликт с местными вооружёнными силами. Нам удалось легко подавить сопротивление и закрепиться, но Kaiser Corporation всё ещё с трудом ведёт боевые действия. Мы можем вмешаться, чтобы обеспечить контроль над Британскими островами."
 GEI_gingeubcheolsu:0 "Экстренное отступление"
 GEI_gingeubcheolsu_desc:0 "Попытка обеспечить контроль над Британскими островами с помощью Kaiser Corporation закончилась катастрофическим провалом. Kaiser Corporation была раздавлена мощью армии Соединённого Королевства, и мы вот-вот постигнем ту же участь. Мы должны быстро отступить к Исландии."
 GEI_jaejeongbi:0 "Реорганизация"
 GEI_jaejeongbi_desc:0 "После закрепления на Британских островах необходимо устранить оставшиеся местные группы сопротивления и реорганизовать структуру в соответствии с идеалами Гематрии."
 GEI_hyeonsangpaag:0 "Анализ ситуации"
 GEI_hyeonsangpaag_desc:0 "Феномен, из-за которого весь Кивотос был массово перенесён в это место под названием «Земля», требует тщательного исследования. В рамках этого процесса будет необходимо заново исследовать технологии, соответствующие местному технологическому уровню."
 GEI_uigyeonchungdol:0 "Конфликт мнений"
 GEI_uigyeonchungdol_desc:0 "В процессе реорганизации и полной перестройки нашей организации среди наших членов возникли конфликты мнений. Нам нужно в течение длительного периода собирать мнения и решить курс, которым должна следовать Гематрия."

 #Гематрия – Путь Беатрис
 GEI_beateulicheuiseungli:0 "Победа Беатрис"
 GEI_beateulicheuiseungli_desc:0 "На собрании по определению курса Гематрии мнения, отстаиваемые Беатрис, получили значительную поддержку. Беатрис теперь будет действовать как официальный лидер Гематрии."
 GEI_sinbijigjo:0 "Ткань таинства"
 GEI_sinbijigjo_desc:0 "Используя различные исследовательские материалы, полученные в Ариусе, Беатрис создала метод извлечения таинства среди хаоса Кивотоса. После нашего прибытия сюда мы восстановим таинство, которое резко сократилось, и решим хроническую проблему."
 GEI_aliuseucheolsu:0 "Отступление из Ариуса"
 GEI_aliuseucheolsu_desc:0 "Из-за внезапного изменения ситуации возможно, что мы больше не сможем сохранять наше влияние в филиале Ариуса. Мы соберём последние оставшиеся там ресурсы и переместим их."
 GEI_hagsaengdeuleuldongwonhada:0 "Новые студентки из Ариуса"
 GEI_hagsaengdeuleuldongwonhada_desc:0 "Мы можем использовать влияние, которое у нас ещё осталось в филиале Ариуса, чтобы привлечь студенток на нашу сторону. Мы используем их для усиления обороны Гематрии и подготовки к угрозе, нависшей над Британскими островами."
 GEI_loyeolbeulleodeuhwagbo:0 "Обеспечение Королевской крови"
 GEI_loyeolbeulleodeuhwagbo_desc:0 "Для идеалов Беатрис отряд Ариус — и в особенности Королевская кровь, существующая среди них — абсолютно необходим. Мы начнём контакт, чтобы обеспечить Королевскую кровь, «Ацуко»."
 GEI_uisigcheosdangye:0 "Ритуал, первая фаза"
 GEI_uisigcheosdangye_desc:0 "Уже давно Беатрис мечтала обладать таинством и вознестись как новое существо. Теперь, когда главное препятствие, получение Королевской крови, преодолено, Беатрис делает первый шаг к проведению своего ритуала."
 GEI_munjehaegyeol:0 "Решение проблемы"
 GEI_munjehaegyeol_desc:0 "В ходе продвижения первой фазы ритуала мы поняли, что необходимого таинства недостаточно. Таинство этого места крайне скудно и слабо по сравнению с таинством Кивотоса. Мы попытаемся решить эту проблему."
 GEI_hyeonsileuljigsihada:0 "Смотреть в лицо реальности"
 GEI_hyeonsileuljigsihada_desc:0 "Хотя было подтверждено, что необходимого таинства недостаточно, Беатрис приняла решение, которое предаёт её собственные убеждения. Она решила провести ритуал как есть и удовлетвориться получением неполного таинства. Мы ещё не знаем, к каким последствиям приведёт этот выбор."
 GEI_chawoncheongongyeongu:0 "Исследование межпространственного бурения"
 GEI_chawoncheongongyeongu_desc:0 "Если мы смогли попасть сюда, мы также можем вернуться. Беатрис и исследовательская группа сосредоточатся на изучении этого феномена, чтобы найти способ доставить сюда обильное таинство Кивотоса — или вернуться — и, наконец, провести «идеальный» ритуал."
 GEI_jeobchog:0 "Контакт"
 GEI_jeobchog_desc:0 "Исследование устройства межпространственного бурения завершено, и первый эксперимент наконец перед нами. Мы откроем небольшую межпространственную трещину, чтобы ненадолго соединить это место с «другим местом», и проверим, можно ли передавать таинство через это отверстие. Вероятно, всё под контролем и совершенно безопасно."
 GEI_uisigneomeolo:0 "За пределами ритуала"
 GEI_uisigneomeolo_desc:0 "Межпространственный бур работает идеально… вероятно. Беатрис теперь приступит ко второму ритуалу, используя массивное количество таинства. Путь к совершенству был ближе, чем ожидалось.\n\n§tВознесение.§!"
 GEI_no:0 ""
 GEI_no_desc:0 ""
