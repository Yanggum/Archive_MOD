 GEI_distort_reality:0 "Исказить реальность"
 GEI_distort_reality_desc:0 "Мы искажаем реальность силой Цвета."
 
 GEI_color_assimilation_decisions:0 "Решения по ассимиляции Цвета"
 GEI_color_assimilation_decisions_desc:0 "Мы можем принимать различные решения для продвижения ассимиляции Цвета."

