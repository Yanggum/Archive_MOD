 # Misiones de demandas de Mika
 TRM_misono_mission_demands_military_factories: "¿Nagi-chan? ¿No deberíamos impulsar la industria militar?"
 TRM_misono_mission_demands_military_factories_tt: "Poseer más de §Y[?TRM_desired_military_factories]§! $arms_factory$"
 TRM_misono_mission_army_demands_political_appointment: "¿Cómo que Trinity todavía no tiene Jefe del Estado Mayor del Ejército?"
 TRM_misono_mission_demands_conscription_law_change: "Nagi-chan, primero tienes que reformar la ley de reclutamiento"
 TRM_misono_mission_demands_more_trucks: "¡Nos faltan camiones militares!"
