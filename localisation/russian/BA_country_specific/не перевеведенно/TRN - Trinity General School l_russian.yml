 TRN_denazification_ns: "Movimiento de desnazificación"
 TRN_Hungarian_trade_sanctions_ns: "Sanciones comerciales de Trinity"
 TRN_Trinity_New_Culture_modifier: "Nueva cultura de Trinity"
 TRN_Trinity_New_Culture_modifier_desc: "Trinity necesita una nueva vitalidad. La cultura del pasado tenía un carácter decadente y no contribuyó al desarrollo de la sociedad en su conjunto. Ahora, las estudiantes de Trinity insuflarán una energía fresca y emprendedora, basada en valores vanguardistas y modernos."
 TRN_Trinity_New_Culture_modifier_change: "Cambios de §Y$TRN_Trinity_New_Culture_modifier$§!"
 TRN_city_of_heaven: "Ciudad celestial"
 TRN_academy_defense_force_ns: "Fuerza de Defensa de la Academia"
 TRN_angel_brigade_force_ns: "Brigada Ángel"
 TRN_social_problem_ns: "Problemas sociales en Trinity"
 TRN_industry_ns: "Industria de Trinity"
 TRN_purged_nazi_elite_ns: "Élite nazi purgada"
 TRN_controlled_party_ns: "Partidos alemanes controlados"
 TRN_controlled_party_ns_desc: "Algunos partidos alemanes \"amistosos\" pueden influir hasta cierto punto en el Tea Party bajo la supervisión del Inspector del Tea Party."
 TRN_sisterhood_missionary_work_ns: "Labor misionera de la Sisterhood"
 TRN_sisterhood_missionary_work_ns_desc: "La labor misionera realizada con el apoyo del Tea Party está dando resultados considerables. Por supuesto, también hay quienes rechazan la misión, pero no supone un gran problema."
 TRN_busy_JTF_ns: "Departamento de Realización de la Justicia, a tope"
 TRN_busy_JTF_ns_desc: "' - Ahh... ¿hay alguien por ahí que no esté ocupado?\n - Ichika senpai, últimamente el Tea Party nos llama seguido...\n - Me parece que va a estar difícil encontrar a alguien libre...\n - Ya veo...'"
 TRN_supported_remedial_knights_ns: "Orden de Socorro respaldada"
 TRN_supported_remedial_knights_ns_desc: "Aomori Mine está agradecida. Tal vez haya que elevar el prestigio de Mika."
 TRN_hidden_armor_doctrine_ns: "Doctrina acorazada de Trinity"
 TRN_hidden_air_doctrine_ns: "Ausencia de doctrina aérea"
 TRN_hidden_aircraft_design_ns: "Diseño de cazas"
 # Debajo: probablemente modificadores de estado
 TRN_SPD_parteitag_state: "Partido Socialdemócrata"
 TRN_SPD_parteitag_state_desc: "\n\n\n£GFX_TRN_banner_SPD_parteitag\n\n\n\n\nGracias a un acuerdo entre Trinity y el SPD, en esta región el partido goza de un estatus especial y se le garantiza libertad de actividad política. El ministro-presidente supervisa directamente la mayor parte de la administración, y la interferencia del gobierno central se ha limitado en gran medida."
 TRN_gehenna_resistance_movement: "Movimiento de resistencia de Gehenna"
 TRN_gehenna_resistance_movement_desc: "El \"Tratado de Edén\" entre Trinity y Gehenna significa la integración completa de ambas academias. Aunque externamente adopta la forma de una unificación, en realidad se asemeja más a un tratado de anexión en el que Gehenna se rindió ante Trinity. Para negarlo, las estudiantes de Gehenna se rebelan contra el dominio de Trinity, pero mientras el Tratado de Edén esté en vigor, su resistencia será quebrada tarde o temprano."
 TRM_industrial_region_state: "Distrito industrial del Departamento de Desarrollo Económico de la Academia"
 TRM_industrial_region_state_desc: "La industria de este estado está actualmente gestionada y planificada por el Departamento de Desarrollo Económico de la Academia, y la administración urbana y rural se ha centralizado bajo un único gobernador nombrado directamente por Edén."
 TRM_belarusian_modifier_us: "Voluntariado bielorruso"
 TRM_ukrainian_modifier_us: "Ejército Nacional Ucraniano"
