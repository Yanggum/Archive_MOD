 TRN_Mika_honor_decision_cat: "El honor de Misono Mika"
 TRN_Mika_honor_decision_cat_desc: "Para §M Misono Mika§!, el §H“honor”§! no se limita a la opinión o reputación ajena. Es §Hsu convicción§!, el centro de su interior, y también una §Hmisión§! que ella misma se impone. Y según ese honor, se decide el destino de Misono Mika.\n\nMientras el §Mrégimen de Misono Mika§! se mantenga, ella evaluará su propio honor a medida que toma decisiones y ejecuta políticas. Puede considerarlo alto o, por el contrario, bajo, y esa autopercepción se convierte en un criterio clave que define el rumbo del gobierno. Cuanto más marcada sea una tendencia, más opciones extremas comenzarán a aparecer ante ella.\n\n"
