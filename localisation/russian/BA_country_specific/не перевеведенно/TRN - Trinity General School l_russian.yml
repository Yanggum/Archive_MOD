 ## Localización del líder del final democrático malo de Nagisa
 TRN_nagisa_kirifuji_democratic_bad_ending_leader_desc: "Kirifuji Nagisa no eligió gobernar a largo plazo simplemente por estar embriagada de poder. Nagisa concluyó que, para proteger a las personas que le son preciadas, alguien tenía que sacrificarse. Si ella soltara el poder, Nagisa misma estaría más tranquila. Pero ¿y si después un malvado tomara el poder? ¿Y si el régimen de Filius colapsara? Entonces, ¿podría Nagisa proteger a quienes aprecia?\n\nNagisa confió en los demás y alcanzó un éxito infinito mediante una nueva política que abrazaba a todos a través del amor. Pero, 'para confiar, hay que dudar del otro'. Los rivales que intentan arrebatarle el poder deben ser investigados, y los enemigos potenciales deben ser vigilados de manera constante. Solo después de todo ese proceso, cuando se demuestra que 'es seguro', Nagisa puede, de verdad, confiar en ellos.\n\nLos lazos forjados antes de la Gran Transición, y los lazos forjados de nuevo después de la Gran Transición. La única que puede protegerlos a todos es Kirifuji Nagisa. Nagisa cree que cumplir el papel de guardiana que protege a los cercanos es su última misión. ¿Quién, si no Nagisa, podría cargar con ese peso?"
 TRN_hifumi_ajitani_leader_desc: "Ajitani Hifumi, de verdad, no quería hacer política. Su pequeño y modesto sueño era simplemente apoyar a Kirifuji Nagisa, Host de Trinity, y seguir siendo su amiga. Pero Kirifuji Nagisa no lo permitió. 'Yo me oxidé y cambié al hacer política, pero mi querida Hifumi jamás lo hará.' Nagisa cree eso con total pureza. El problema es que, en esa fe, faltaba el proceso de preguntarle a Hifumi qué quería.\n\nAun así, Hifumi se esfuerza por desplegar 'su propia política' bajo la sombra de Nagisa. Así como Nagisa tuvo a los viejos amigos del Tea Party, al lado de Hifumi todavía permanece Kirifuji Nagisa. La fuerza que le permite soportar el cargo de Host —un traje que no le queda— es que su amiga más preciada le está indicando el camino que debe seguir.\n\nPor eso, aunque sea una Host que no posee ningún color, Ajitani Hifumi avanza paso a paso en busca de su futuro. Hacia el futuro."
 TRN_hifumi_ajitani_faust_leader_desc: "Nagisa abandonó a Hifumi. Hifumi pensó que, aunque fuera un cargo de Host que no deseaba, podría soportarlo si Nagisa permanecía a su lado, pero Nagisa concluyó que, para que Hifumi pudiera sostenerse por sí sola, ella no debía estar en la sala de la Host. Pero ¿acaso Hifumi pensaba lo mismo?\n\nHifumi, por el incidente de la Gran Transición superpuesto a sus años escolares, no pudo construir relaciones humanas apropiadas. Incluso antes de la Gran Transición era del 'club de irse a casa', y después solo asistía a clases remotas por BD. Su único sostén era Nagisa, y en el instante en que Nagisa soltó a Hifumi, ella quedó sola.\n\nAjitani Hifumi ahora está atrapada en un mundo cerrado al que nadie acude, tiñéndose de negro. Las últimas palabras que Kirifuji Nagisa dejó al abandonar la política—'la facción Filius estará de tu lado'—son el último legado que mueve a la Hifumi de hoy. Si Filius está de su lado, entonces todos los que no son Filius son enemigos de Hifumi, ¿no? Siguiendo ese dualismo sencillo, Hifumi sospecha de todos. Porque es la única forma de sobrevivir, ¿no? Dudar de los demás, odiar a los rivales, dividir a la gente: esas son las virtudes de un político.\n\nY así, Hifumi podrá convertirse en una política que supere a Nagisa."
 TRN_seia_yurizono_nagisa_route_leader_desc: "Para Seia, este mandato como Host es el segundo. Y, entre los innumerables futuros que Seia ha visto, también es el 'segundo cargo de Host' que jamás había existido ni una sola vez. El dulce plan de futuro de Yurizono Seia—despertar al borde de la muerte y pasar el resto de su vida con comodidad como una simple 'neet' y persona libre—se hizo añicos. Pero Seia no se desesperó tanto. Para ella, volver al puesto de Host es un servicio: ofrecer sus capacidades por los muchos de Trinity; y también una expiación hacia las dos personas a quienes hirió e hizo llorar: Mika y Nagisa.\n\nYa no es 'la líder de la facción Sanctus', e incluso Sanctus ya no existe como facción, pero Seia, junto a los nuevos compañeros de Filius, quiere construir en Trinity un futuro libre que ella jamás profetizó. Eso significa preservar el legado que dejó Kirifuji Nagisa y hacerlo perdurar hasta la siguiente generación. Puede que bajo su gobierno Trinity no se vuelva más grandiosa. Pero quienes viven en Trinity serán más prósperos.\n\nSi no lo hace Yurizono Seia, ¿quién lo hará?"
 TRN_mine_aomori_nagisa_route_leader_desc: "Como líder de la facción Johann, Aomori Mine no había intentado ni una sola vez, antes de la Gran Transición, dedicarse a la política. Para ella, la política no era más que una trampa que embotaba la voluntad de auxilio destinada a proteger a otros. Que las tres nobles facciones del Tea Party hagan política. Johann salvará a los pobres y hambrientos. Ese corazón suyo vaciló cuando Yurizono Seia le pidió directamente que entrara en la arena política.\n\nMine tenía una deuda emocional con Seia. Porque, al ocultar a Seia en un lugar aislado por su seguridad, vio a Nagisa entristecerse. Por esa deuda con Seia, Mine se atrevió a probar la política, y comprendió de verdad por qué, antes de la Gran Transición, se había negado con tanta firmeza a entrar en el Tea Party.\n\nMine se convirtió en la Host del Tea Party, el centro de toda la riqueza y el poder de Trinity. Poco a poco se está adaptando a una vida cómoda. Pero Mine no quiere olvidar una sola cosa: 'La fe y el orgullo, en el pecho.' Aunque llegue a no poder recordar ni siquiera cuál era la fe que intentaba proteger, esa frase—que un día fue todo para ella—no la olvidará."
 TRN_ako_amau_leader_desc: "Para Ako, la nacionalidad de Trinity o Gehenna no era algo especialmente importante. Al final de su mirada siempre estuvo Sorazaki Hina. Cuando ella decía 'Gehenna tiene razón', Ako era la administradora ejecutiva senior del Comité de Disciplina de Gehenna; y cuando ella decía 'Trinity tiene razón', Ako no era más que la inspectora del Tea Party de Trinity. ¿No es acaso así como debe actuar un buen caballero, siguiendo los pasos de su señora?\n\nPero, sin darse cuenta, la persona que el caballero debía proteger dejó de ser solo su señora. Tras la unificación de Gehenna, Ako fue conociendo cada vez a más personas de la facción Filius, y aquellos a quienes Ako 'quiere proteger' fueron aumentando. Ahora, sentada en la sala de la Host del Tea Party, Ako repasa su nueva responsabilidad: proteger a Trinity y salvaguardar hasta la siguiente generación el legado que construyó Kirifuji Nagisa. Eso es algo que hace por su querida señora, sí, pero también por los nuevos lazos que conoció en Trinity.\n\nAko no desmantelará la federación unificada como esperan los separatistas de Gehenna, ni entregará el poder por mala gestión como desean los radicales de Pater. Tal vez, en esta tierra donde no existen el desorden ni el caos, Ako pueda hacerlo incluso mejor que cuando era administradora ejecutiva senior. Después de todo, aunque el lugar donde se está de pie cambie, el deber de un caballero nunca ha cambiado."
 TRN_atsuko_hakari_leader_desc: "Desde ser un 'sacrificio vivo' en manos de Beatrice, presidenta del consejo estudiantil de Arius, hasta convertirse en la Host en el corazón del Tea Party de Trinity: la vida de Hakari Atsuko es en sí misma una epopeya, suficiente para crear varios volúmenes de biografías de grandes figuras. Desde el concilio primordial de Trinity hasta la era moderna, nunca había existido alguien que, como Hakari Atsuko, ascendiera desde lo más bajo hasta el puesto más noble.\n\nAtsuko no cree que pudo convertirse en Host por ser excepcional. Cree que pudo estar aquí gracias a la fortuna de poseer la 'sangre real' de Arius, a la cultura tolerante de Trinity y a que muchos en Filius confiaron en ella. Por eso, con más razón, Atsuko quiere usar sus capacidades para aquellos que 'tienen gran talento, pero nunca tuvieron la oportunidad de desplegarlo'.\n\nPuede que no derrumbe el alto muro del sistema estamental de Trinity. Pero sí puede hacer que las antiguas chicas pobres de Arius y los niños rurales de Trinity reciban una nueva educación. Si pasa una generación, y luego otra, una nueva generación instruida y capaz cambiará Trinity, tal como Atsuko cambió el mundo."
 TRN_takane_miyoshi_leader_desc: "Gran catástrofe. Desesperación. Distopía. Ninguna palabra negativa bastaría para expresar esta sensación. La identidad de la 'falsa gran duquesa' engañó a todos en Trinity y la convirtió en la líder de Trinity. ¡Alabad a la gran duquesa Miyoshi Takane, la noble superviviente del reino invernal! Por supuesto, Takane no tiene margen como para disfrutar de esta situación. Si este hecho saliera a la luz, sin duda se convertiría en enemiga de toda Trinity.\n\nTakane debe convertir esta historia en una 'mentira perfecta'. Debe convertirse en la líder más sobresaliente de todas, la que hace a Trinity la más grandiosa. Ese es el único camino para que nadie se atreva a hurgar en el pasado de Takane. ¿Y si aun esforzándose fracasa? Entonces habrá que prepararse para huir cruzando la frontera."
 
 trinity_system_events.0.t: "Rework de Trinity"
 trinity_system_events.0.desc: ""
 trinity_system_events.0.a: "Iniciar desde el 25 de enero de 2025"

 
 # 사건
  trinity_events.1.t: "Tea Party"
 trinity_events.1.desc: "El Tea Party es el máximo órgano de gobierno, una coalición de las facciones Sanctus, Filius y Pater, que desempeña un papel central dentro del sistema de triunvirato de Trinity. Cada facción complementa las debilidades de las otras, y al mismo tiempo mantiene el equilibrio mediante la vigilancia mutua. Entre ellas, la líder de una facción asume el cargo de \"Host\" del Tea Party y puede ejercer una autoridad inmensa. Sin embargo, la estructura de control y complementariedad dentro del Tea Party impide el abuso de poder de la Host, frena el radicalismo político y hace posible un gobierno estable.\n\nHace algunos años, ocurrió que la líder de la facción Pater —de carácter radical y belicista— ascendió al cargo de Host del Tea Party. Esto intensificó las tensiones con la Academia Gehenna y desembocó en la llamada crisis de la Host.\n\nLa situación terminó llevando a que las facciones Filius y Sanctus se aliaran para aprobar una moción de censura contra la Host. La resolución fue aceptada, pero dejó una herida profunda en el orgullo de la facción Pater. Este conflicto aún no se ha recuperado por completo, incluso después de que fracasara el intento de Misono Mika de promover el indulto de los combatientes de Pater encarcelados por crímenes de guerra contra prisioneros durante la Gran Transición de 1935.\n\nAhora, hasta el destino ha levantado la mano a favor de la facción Pater. La facción Pater planteó sospechas de soborno contra Kirifuji Nagisa y exigió una investigación a las autoridades judiciales; el organismo investigador, basándose en testimonios y materiales de \"fuentes confiables\", imputó a Kirifuji Nagisa por el delito de administración desleal. Es una lástima que no se trate de aceptación de sobornos, pero Kirifuji Nagisa anunció oficialmente su renuncia para evitar que la facción se viera afectada, y las figuras clave de la facción Filius también fueron sustituidas en masa en el curso de esta investigación judicial. Incluso los pocos que quedan están destinados a quedar, en la práctica, neutralizados bajo la influencia de la facción Pater."
 trinity_events.1.a: "Todo está basado en la Constitución."
 trinity_events.2.t: "Protesta en Basis Schola"
 trinity_events.2.desc: "A medida que la facción Pater ha pasado a controlar de facto el Tea Party y el Tribunal Supremo, incluso la última barrera capaz de contener la dictadura de Misono Mika se está derrumbando. Las facciones Filius y Sanctus están expresando su indignación ante la incapacidad de frenar el radicalismo de Misono Mika, y en particular, la acusación contra Kirifuji Nagisa se convirtió en el detonante que desató manifestaciones masivas.\n\nEn Basis Schola estalló otra protesta, y numerosos partidarios de Filius lanzaron durísimas críticas, calificando a Misono Mika de \"una tirana obsesionada con destruir la esencia de Trinity\"."
 trinity_events.2.a: "Si insisten, déjalos protestar."
 trinity_events.2.b: "Envía al Departamento de Justicia para dispersarlos."
 trinity_events.3.t: "Constitución de la Academia General Trinity del año 749"
 trinity_events.3.desc: "En sentido estricto, para enmendar la Constitución de Trinity se requiere el consentimiento de 2/3 del Tea Party, y la enmienda debe presentarse ante el Tribunal Supremo. No hay duda de que esta Constitución fue creada sobre intenciones nobles y posee una autoridad que trasciende las épocas, pero también arrastra un problema: vuelve excesivamente complejo y tedioso incluso el más mínimo intento de reforma constitucional. Si la Constitución estuviera diseñada a la perfección, este problema sería menor, pero la realidad no es así.\n\nYa con el Tea Party y el Tribunal Supremo en sus manos, no hay mucho que otros órganos puedan hacer frente a la facción Pater. Aun así, para otorgar legitimidad a su dominio, la facción Pater anunció oficialmente la 'Enmienda a la Constitución de la Academia General Trinity'. Esta fue aprobada mediante la autoridad del Tea Party controlado por Pater, y en la práctica produjo el efecto de invalidar la Constitución de la Academia General Trinity del año 749. Esta enmienda quedará registrada como la última ley aprobada a través del Tea Party."
 trinity_events.3.a: "¡Nadie puede detenernos!"
 trinity_events.4.t: "Ley Misono Mika"
 trinity_events.4.desc: "La Ley Misono Mika, pese a llevar el nombre de 'Quinta Enmienda de la Constitución de la Academia General Trinity', es en realidad un voluminoso paquete legislativo destinado a convertir a Trinity en un nuevo Estado cuasi-constitucional, manteniendo al mismo tiempo los poderes monárquicos preexistentes de la Host. Muchas de sus cláusulas están redactadas de forma ambigua, hasta el punto de que los fallos pueden quedar a merced de interpretaciones arbitrarias de funcionarios y jueces. Casi todos los mecanismos de protección del triunvirato de Trinity han sido eliminados, y lo mismo ocurre con las disposiciones sobre propiedad: ahora el Estado puede nacionalizar con facilidad cualquier bien relacionado con 'actividades antiestatales'.\n\nAnte la noticia de su ratificación, los representantes de la facción Pater en el Tea Party estallaron en aplausos ensordecedores, y poco después continuaron las celebraciones en un desfile público organizado por cuadros de Pater en toda Trinity. La reacción de las demás facciones fue mucho más fría, e incluso algunos moderados dentro de la facción Pater de Misono Mika se vieron obligados a observar y reflexionar hasta dónde llegaría su ambición."
 trinity_events.4.a: "¡Trinity se yergue por sí sola!"
 trinity_events.5.t: "El último discurso de la libertad"
 trinity_events.5.desc: "Mientras la facción Pater avanzaba sin freno, las demás facciones también empezaron a comprender poco a poco la gravedad de los cambios legales en curso. Compartiendo la sensación de crisis ante el riesgo de que Trinity caiga de facto en un Estado de partido único, se aliaron y mostraron movimientos para contener el desenfreno de Pater. Sin embargo, la facción Pater se enfrentó a esa coalición, y la situación fue empeorando.\n\nEn medio de ello, Arahata Wakana, líder de la facción Filius, tomó el micrófono y comenzó a hablar.\n\n\"En esta hora del destino, nosotros, la facción Filius, juramos solemnemente los principios de la filantropía, la libertad y la justicia. Misono Mika ha derribado la gran hazaña del Primer Concilio, que por única vez en la historia unificó a Trinity y abrió un futuro y un mundo mejores. Cientos de miles de valientes estudiantes de Trinity dieron sus vidas para proteger la libertad. Misono Mika y la facción Pater lo saben mejor que nadie. Y aun así, están traicionando esa causa.\n\nNinguna ley otorga el derecho de destruir una convicción eterna e inmortal. Sus actos ahora no son distintos de los de terroristas sin fe. Pero nosotros jamás olvidaremos el camino que nuestros antepasados iniciaron en el Primer Concilio, y le seremos fieles. Un tirano nunca dura. Por eso, no debemos doblegarnos ante esta desesperación. ¡Por la Trinity libre, eterna e inmortal, aplaudamos juntos!\"\n\nTras el discurso de Arahata Wakana, las demás facciones realizaron protestas frente al edificio del Tea Party, declarando su voluntad de resistencia. Sin embargo, aquello también les hizo sentir la realidad: eso era todo lo que podían hacer. Fuera del edificio, continuaron las manifestaciones pidiendo que se respetaran los derechos de los estudiantes, pero incluso eso no era más que una forma de desahogar una ira sin rumbo contra la realidad."
 trinity_events.5.a: "Qué alivio."
 trinity_events.6.t: "Hace 2 meses"
 trinity_events.6.desc: "Con el estallido de la Gran Transición, Trinity vio derrumbarse su base fundamental y fue arrojada sin piedad sobre una nueva tierra. Ese impacto no fue una simple confusión: fue una crisis sin precedentes que amenazaba la propia existencia de Trinity. Inmediatamente después del incidente, la Academia General Trinity entró en un feroz combate contra el Estado alemán. Obtuvo la victoria tras una lucha a muerte, pero las innumerables tragedias y sucesos ocurridos en el proceso dejaron heridas profundas en los estudiantes de Trinity, y fueron suficientes para radicalizar sus inclinaciones. La guerra derrumbó los ideales y el orden de Trinity. Entre los estudiantes se extendieron la ira y la desconfianza, y todos los indicadores se precipitaron hacia el peor escenario. Aunque se consiguió la victoria contra el Estado alemán, en el sureste y en el norte aún operaban fuerzas de resistencia, manteniendo la tensión.\n\nLa facción Pater no dejó pasar esta oportunidad. Empezaron a concentrarse en los medios de propaganda, aprovechando la desconfianza y la tensión que persistían entre los heridos. Se produjeron materiales propagandísticos que criticaban a las facciones Filius y Sanctus, acusándolas de predicar una paz vacía, y se expusieron de forma intensiva ante el alumnado general. Como resultado, una gran cantidad de estudiantes se convirtió en fervientes seguidores de la facción Pater. A partir de ahí, la facción Pater consiguió ejercer una influencia fuerte incluso sobre el Tea Party.\n\nLas facciones Filius y Sanctus también reaccionaron. Se esforzaron por impedir la difusión de información distorsionada y falsa, pero los manejos de Pater ya iban mucho más allá de lo previsto, ejerciendo una influencia profunda en toda Trinity.\n\nAsí, el Año Nuevo de 1936 fue recibido en medio de la resignación y el miedo."
 trinity_events.6.a: "Y así comienza."
 trinity_events.7.t: "Elección de la Host"
 trinity_events.7.desc: "Las secuelas de la crisis que azotó a Trinity aún no han desaparecido por completo, pero la situación se está calmando poco a poco y entra en una fase de estabilización. Las heridas y el caos persistentes todavía nos atormentan, pero por fortuna los indicadores que empeoraban han dejado de caer. Ahora, el futuro de Trinity depende del juicio y el liderazgo de la próxima Host.\n\nEl Tea Party, que guía a Trinity, está compuesto por tres grandes facciones: Sanctus, Filius y Pater. Además existen otras facciones, pero actualmente se niegan a intervenir en la política por motivos propios. La reunión de emergencia está en proceso de disolución, y Yurizono Seia, de la facción Sanctus, ha sido designada como la próxima Host.\n\nYurizono Seia ha sido evaluada originalmente como una figura de postura moderada y conservadora, que busca un cambio gradual en Trinity mediante una diplomacia pragmática. Sin embargo, tras vivir la Gran Transición y las atrocidades derivadas, parece que ha experimentado un cambio psicológico. En la reciente asamblea de la facción Sanctus, exigió acciones mucho más radicales que en el pasado, e incluso no dudó en hacer declaraciones que podían sonar algo groseras. Aun así, sus afirmaciones fueron valoradas como una postura ortodoxa y de manual, basada en una lógica y fundamentos sólidos, y se han asentado como la principal línea de política de la facción Sanctus.\n\nNo obstante, algunos ejecutivos de Sanctus la criticaron con dureza, diciendo que Yurizono Seia se había corrompido. Pese a ello, esa oposición no llegó al punto de cambiar la dirección política principal de Sanctus."
 trinity_events.7.a: "Aún queda tiempo."
 trinity_events.8.t: "La princesa del desván"
 trinity_events.8.desc: "Misono Mika trabajaba en su oficina hasta bien entrada la noche. Su despacho estaba adornado con retratos de antiguas líderes de la facción Pater, y lleno de objetos lujosos y clásicos. Su secretaria le presentó un informe sobre la situación actual, pero Mika no mostró una reacción particular. Había demasiados asuntos que debía considerar: los movimientos de la Sisterhood, las líneas políticas de las otras facciones, y más.\n\nTras detenerse un instante, Mika se acercó a la ventana y contempló el cielo lejano. No era una noche tan luminosa como en Kivotos, pero innumerables estrellas bordaban el oscuro firmamento. Durante un tiempo, sumida en pensamientos, repasó sus planes. Aunque algunas partes no habían salido como esperaba, si el curso seguía tal como iba, no había posibilidades de fracaso. Eso fue lo que se dijo a sí misma.\n\nComo líder de la facción Pater, Mika sentía instintivamente que ya no quedaba mucho tiempo. Cuanto más se retrasaran sus acciones, más se tambalearían los planes, y mayor sería el riesgo de que los desleales conspiraran aprovechando la brecha. Además, los estudiantes despreciaban a la facción Pater por no actuar: la veían como incapaz e inmunda, sin saber aprovechar las oportunidades. Esas miradas la asfixiaban.\n\nPero Mika estaba convencida. Algún día llegaría la hora de la facción Pater. Ahora, su máxima prioridad era eliminar todas las amenazas en el umbral del camino hacia el poder absoluto y erradicar sus raíces. Su determinación era firme, y el plan no vacilaba. No, no debía vacilar."
 trinity_events.8.a: "Y el destino estaba de nuestro lado."
 trinity_events.9.t: "Tres disparos"
 trinity_events.9.desc: "Ayer, a las 11:20 de la mañana, tres disparos que retumbaron desde una pistola Walther atravesaron a Trinity. Yurizono Seia, líder de la facción Sanctus y Host del Tea Party, cayó abatida tras el ataque de un miembro de una organización de resistencia alemana.\n\nTodo ocurrió en un instante. Thomas Sommer, miembro de Schwarze Kapelle, se abalanzó sobre Yurizono Seia mientras esta pronunciaba su discurso de investidura como Host en la plaza central de Trinity. Los escoltas intentaron detenerlo, pero Sommer los atravesó y sacó una pistola de su abrigo. Dos impactos en el pecho. Uno en el abdomen. Justo antes de que disparara una cuarta bala, fue reducido por los guardias y, herido, trasladado al hospital.\n\nLa facción Sanctus cayó de inmediato en el caos. Al día siguiente, Amabe Chika asumió de urgencia el liderazgo, pero sobre ella se desató una ola de reproches. Que la persona más cercana a Yurizono Seia heredara el poder era un giro que muchos no habían previsto.\n\nEste incidente expuso sin tapujos el lugar que Yurizono Seia ocupaba en Sanctus. Había sido criticada por ser \"excesivamente izquierdista\", pero al mismo tiempo era el eje central de la facción. Hasta ahora no hay ningún anuncio oficial sobre el estado de Yurizono Seia. Mientras tanto, un sector de Sanctus emitió un comunicado público contra el Departamento de Justicia, afirmando que un sistema de seguridad deficiente provocó esta tragedia. Trinity está temblando incluso en este mismo instante."
 trinity_events.9.a: "¡Yo no fui!"
 trinity_events.10.t: "Muerte de Yurizono Seia"
 trinity_events.10.desc: "Hoy es el día más luctuoso para Trinity. Yurizono Seia ha fallecido. La Orden de los Caballeros de Socorro lo dio todo, pero el shock de las heridas de bala era algo que su frágil cuerpo no pudo soportar, y tras varios días de lucha agonizante, terminó por cerrar los ojos.\n\nQuienes recibieron primero esta noticia impactante fueron los de la facción Sanctus. La muerte de Yurizono Seia aceleró aún más las grietas internas. Tras un compromiso con el que nadie quedó satisfecho, Kato Natsuki fue elegida como la nueva líder. Ella afirma que heredará el pensamiento de Yurizono Seia, pero la facción que apoyaba a Seia no confía en ella.\n\nDespués de la elección, la facción Sanctus conservadora y la facción progresista que seguía a Yurizono Seia se dividieron por completo. Kuno Misaki, de tendencia progresista, criticó con dureza a los conservadores, llamándolos \"reaccionarios obsesionados únicamente con un sistema idealista de hace cientos de años\". El puente que la anterior líder, Yurizono Seia, había intentado tender para abarcar ambos lados se derrumbó con fuerza junto con su muerte, y los progresistas, liderados por Kuno Misaki, han iniciado una resistencia activa.\n\nAlgunos ejecutivos de Sanctus que miraron de frente la realidad ahora buscan la posibilidad de compromisos con otras facciones. Sin embargo, en apenas unos días, Sanctus se hundió en un crisol de confusión, miedo y represión."
 trinity_events.10.a: "Cayó el dominó."
 trinity_events.11.t: "Investidura de Misono Mika como Host"
 trinity_events.11.desc: "Con el suceso sin precedentes de que la Host muriera poco después de asumir, la Academia General Trinity quedó sumida en un impacto jamás visto.\n\nDe acuerdo con la Constitución de la Academia General, la siguiente Host recayó en Misono Mika, quien obtuvo la mayoría en la votación del Tea Party. Sin embargo, con su investidura se volvió inevitable una lucha de poder entre la facción Filius y la facción Pater, y parece que este conflicto continuará hasta que Misono Mika lo resuelva directamente en calidad de Host.\n\nAun así, dentro de Filius crecen las voces de oposición y resistencia. La facción Filius no solo señala a Misono Mika, sino que vincula a toda la facción Pater con el caso del asesinato de Yurizono Seia, sospechando que están detrás. Ante ello, la facción Pater lo niega con firmeza, pero es poco probable que este malentendido se disipe fácilmente.\n\nLa ceremonia de investidura de Misono Mika como Host se realizó a pequeña escala debido a las secuelas del asesinato de Yurizono Seia. El ambiente en las otras facciones es lúgubre, y está cargado de vigilancia e inquietud hacia Mika. Ella es alguien que nadie puede prever; la incertidumbre sobre cuáles serán sus próximos pasos está elevando aún más las tensiones entre facciones."
 trinity_events.11.a: "Era inevitable."
 trinity_events.12.t: "Investigación de Thomas Sommer"
 trinity_events.12.desc: "A pesar de que la Orden de los Caballeros de Socorro de Edén lo dio todo, el asesino de Yurizono Seia murió antes de ser interrogado, desangrado por las graves heridas de bala.\n\nLos resultados de la investigación revelaron que el asesino, Thomas Sommer, de 31 años y originario de Potsdam, ingresó en 1931 a las SS y estuvo activo, pero tras la Gran Transición de 1935 se pasó a la resistencia como miembro de Schwarze Kapelle. Estaba casado, pero actualmente su esposa se encuentra desaparecida. Un punto digno de atención es que, pocos días antes de asesinar a Yurizono Seia, Thomas Sommer se reunió con un capitán de las SS. Sin embargo, de manera extraña, ese capitán desapareció sin dejar rastro al día siguiente del asesinato de Yurizono Seia.\n\nEl hecho de que el asesino muriera antes siquiera de ser interrogado, la desaparición de su esposa y la desaparición del capitán tras el contacto: siguen saliendo a la luz circunstancias sospechosas. ¿Es todo esto una simple coincidencia? La verdad del caso sigue siendo opaca, y las voces que exigen esclarecerla crecen cada vez más."
 trinity_events.12.a: "Pobre idiota."
 trinity_events.13.t: "¿Conspiración de la Sisterhood?"
 trinity_events.13.desc: "Tras el incidente, la Sisterhood llevó a cabo activamente operaciones de ayuda y entregó diversos suministros tanto a los alemanes locales como a los estudiantes de Trinity. Pero ¿acaso esto proviene de una fe pura? ¿O se esconden cálculos políticos tras ello? El simple hecho de que la Sisterhood se mueva de manera tan activa podría contener algún significado político.\n\nDesde luego, ellos declararon con anterioridad su no injerencia en la política. Es impensable que la Sisterhood desafíe al Tea Party. Pero nadie conoce con claridad sus verdaderas intenciones. La Sisterhood es conocida como una organización envuelta en un velo; quienes controlan con rigor sus asuntos internos difícilmente compartirán toda la información de forma transparente con el Tea Party. Considerando la situación cambiante y, además, el reciente atentado, no puede asegurarse hasta cuándo mantendrán la neutralidad. Por ahora, no queda más que esperar que sostengan hasta el final su línea de no intervención y neutralidad."
 trinity_events.13.a: "¿La Sisterhood tendría razones para intervenir?"
 trinity_events.15.t: "La admonición de Kenzaki Tsurugi"
 trinity_events.15.desc: "Con el apoyo total de Misono Mika, el Departamento de Justicia se expandió rápidamente. Pero ese crecimiento tuvo un costo doloroso. La estructura organizativa, optimizada para los terrenos originales, no pudo absorber el territorio de la academia, que se había ampliado bruscamente tras el incidente, y el apoyo incesante de Mika más bien infló a la organización de forma innecesaria. La ineficiencia asomó por todas partes, y el Departamento de Justicia comenzó a tambalear, incapaz de cargar con su propio peso.\n\nQuien más vive esta realidad es Hanekawa Hasumi, subdirectora del Departamento de Justicia y responsable de toda la administración. Más personal, cadenas de reporte más complejas, montañas interminables de documentos... El escritorio de Hasumi siempre estaba repleto de papeles, y sus noches se volvían cada vez más largas. Cuanto más crecía la organización, más pesado se volvía el fardo que debía cargar, hasta llegar a un punto en el que ya era imposible manejarlo por sí sola.\n\nKenzaki Tsurugi, directora del Departamento de Justicia y líder de campo, conocida por el escalofriante apodo de 'La Carnicera', comprendía el sufrimiento de Hasumi mejor que nadie. En el campo de batalla destroza a sus enemigos sin piedad, pero no podía ignorar a una compañera que luchaba en la oficina. Para ayudar a Hasumi, Tsurugi extendió la mano hacia las tareas administrativas. Pero blandir una espada y lidiar con papeleo eran cosas completamente distintas. Sus manos inexpertas y los errores frecuentes mostraban que su buena voluntad era real, pero a veces su ayuda terminaba convirtiéndose en una carga adicional para Hasumi.\n\nAun así, Tsurugi no se rindió. No podía apartar la vista del dolor de su compañera y, sobre todo, si el Departamento de Justicia quería funcionar, este problema debía resolverse. Tras pensarlo, Tsurugi tomó una decisión: pedir ayuda al Tea Party. Para aliviar la carga de Hasumi y devolver al Departamento de Justicia a una organización eficiente, era necesario un apoyo externo especializado."
 trinity_events.15.a: "¡Por supuesto! Envía a los especialistas del Tea Party."
 trinity_events.15.b: "Los problemas internos deben resolverse por cuenta propia."
 trinity_events.14.t: "El último viaje de Yurizono Seia"
 trinity_events.14.desc: "Yurizono Seia fue líder de la facción Sanctus, y considerando sus actos hasta ahora y los logros durante su mandato como Host, tiene méritos suficientes para recibir un funeral de Estado.\n\nEl ataúd, hecho de abedul, fue trasladado solemnemente bajo la escolta de ejecutivos de Sanctus vestidos con uniformes de color amarillo intenso y blanco —los colores simbólicos de Sanctus— y del Departamento de Justicia de Trinity. Detrás siguió una procesión con uniformes de desfile, y tras ella vinieron los ancianos de Sanctus y las numerosas hermanas de Yurizono Seia. Además, marcharon también unidades de desfile de las facciones Pater y Filius, y la fila de estudiantes comunes que normalmente la apoyaban acompañó el camino hasta el final.\n\nYurizono Seia, líder de Sanctus en la Academia General Trinity y ex Host, ha sido finalmente acogida para siempre en el seno de su alma máter."
 trinity_events.14.a: "Mis condolencias por Seia."
 trinity_events.14.b: "Reducid el funeral."
 trinity_events.16.t: "El destino de la facción Sanctus"
 trinity_events.16.desc: "Todos los miembros moderados o radicales de la facción Sanctus han huido, y ahora solo quedan los ancianos. Pero con la aprobación de la Ley Misono Mika, su destino también será decidido pronto.\n\nEl Tribunal Supremo, lleno de figuras pro-Pater, celebró un gran juicio.\n\n-Amabe Chika, encarcelada por abuso de autoridad.\n-Kato Natsuki, encarcelada por diversos cargos de delitos contra el gobierno.\n-Mihara Rie, encarcelada por cargos como soborno y negligencia laboral.\n-Shiraki Mayuko, encarcelada por abuso grave de autoridad.\n\nLos ancianos fueron juzgados por abuso de autoridad y por sospechas de complicidad con el asesinato de Yurizono Seia, y se añadieron diversos cargos contra el gobierno. Sin embargo, quizá por considerar su amistad con Yurizono Seia, Misono Mika ofreció a Sanctus condiciones inesperadamente indulgentes. Para ser una purga de rivales, no fue cruel. Los ejecutivos de Sanctus recibieron un indulto condicional y se les dio la opción de unirse a otra facción o retirarse de la política.\n\nAun así, algunos ancianos fueron distintos. Rechazaron toda persuasión y oferta, y decidieron permanecer en Sanctus hasta el final. Era una cuestión de convicciones. Al final, muchos fueron encarcelados y la facción Sanctus entró en proceso de disolución. La facción que alguna vez fue el centro de Trinity desapareció así en la historia."
 trinity_events.16.a: "Todos ellos desaparecerán en prisión."
 trinity_events.17.t: "El destino de la facción Filius"
 trinity_events.17.desc: "Misono Mika y Kirifuji Nagisa fueron amigas de la infancia desde hace mucho tiempo. De pequeñas, jugando juntas, se comprendían y confiaban mutuamente más que nadie. Pero al servir en facciones distintas, sus destinos empezaron a desalinearse poco a poco. ¿Será el destino que, por más profundo que sea un vínculo, cuando la política interviene, acabe separándolos?\n\nEl Tea Party era un lugar donde cada facción luchaba ferozmente por políticas y leyes en beneficio propio, y Mika y Nagisa también se enfrentaron en múltiples ocasiones en batallas sin concesiones. Dos personas que una vez soñaron el futuro en el mismo bando, son ahora figuras políticas que deben enfrentarse representando a sus respectivas facciones. Aun así, todavía se entendían. Al menos, hasta entonces.\n\nPero, ¿qué hay de la situación actual? Kirifuji Nagisa, incapaz de detener el desenfreno de Misono Mika, se encuentra ahora bajo arresto domiciliario por orden suya. Es un panorama completamente distinto al de aquella época en que se aprobó la moción de censura contra una Host de la facción Pater. Con este incidente, el orgullo de Pater ha sido restaurado por completo, y la venganza se ha consumado.\n\nAhora, los ejecutivos de Pater exigen castigos más severos. Sin embargo, Misono Mika no se suma a ello. No se sabe si es por la vieja amistad o por otras consideraciones políticas, pero ella sostiene castigos más moderados.\n\nDos chicas que una vez soñaron juntas, ahora están al final de destinos distintos. Una en la cima del poder; la otra, atrapada por ese poder. ¿Fue este el final del camino que eligieron?"
 trinity_events.17.a: "Enciérrenla en la prisión del Tea Party."
 trinity_events.17.b: "Mantengan el arresto domiciliario."
 trinity_events.18.t: "Deslealtad dentro de la facción Pater"
 trinity_events.18.desc: "En el Tea Party —la base y el origen del sistema tri-faccional, por donde han pasado innumerables personas y donde incontables leyes fueron aprobadas o rechazadas— ahora solo quedan la facción Pater y su líder, Misono Mika. Misono Mika y Pater aprueban a toda velocidad leyes favorables para sí mismos, fortaleciendo con rapidez su control sobre Trinity.\n\nQuizá era inevitable: algunos ejecutivos de Pater con inclinaciones anti-Mika se opusieron a estos planes y, tras el telón de este teatro llamado Tea Party, estaban trazando un plan para derrocar a Misono Mika y a ciertos ejecutivos de Pater.\n\nSin embargo, no se sabe si fue el destino o una broma de Dios, pero el plan de golpe fue descubierto antes siquiera de ejecutarse.\n\n\"¡Traición!\" Todas las noticias de Trinity gritan así. Algunos ejecutivos de Pater con tendencias anti-Mika están siendo juzgados por el cargo de haber elaborado una conspiración concreta para derrocar a Misono Mika. Según los materiales proporcionados por diversas fuentes \"anónimas pero confiables\", esta conspiración, en algunos casos, se remonta hasta hace un año, e incluye actos como confabular con ejecutivos de otras facciones o proporcionar abiertamente información sobre ejecutivos de Pater.\n\nLa Host Misono Mika evita comentar este caso, pero al quedar claro que algunos ejecutivos de Pater no están poniendo el interés de Trinity como prioridad, se espera que se lleve a cabo una purga a gran escala para eliminar la deslealtad interna."
 trinity_events.18.a: "Uno por uno, cortándolos, se acaba la guerra civil."
 trinity_events.19.t: "Tribunal Supremo"
 trinity_events.19.desc: "El nombramiento del Presidente del Tribunal Supremo de Trinity se realiza de modo que la Host lo designa con el consentimiento del Tea Party. Pero la coyuntura actual, como si fuera el destino, fluye a favor de la facción Pater. Sanctus se fracturó a gran velocidad a raíz del asesinato de Yurizono Seia; como resultado, Pater obtuvo la mayoría de escaños dentro del Tea Party, y Misono Mika se hizo con el cargo de Host. Así, Misono Mika y Pater obtuvieron un poder absoluto que nadie puede negar.\n\nPara hacer permanente su dominio, Misono Mika impulsó el nombramiento del Presidente del Tribunal Supremo y lo solicitó al Tea Party. La facción Pater, que contaba con la mayoría, naturalmente lo aprobó. Hubo una intensa contención y resistencia política por parte de la facción Filius, pero frente a la supremacía absoluta de Pater en el Tea Party, no fue más que un forcejeo inútil.\n\nAhora, incluso el último procedimiento judicial ha caído en manos de Misono Mika y la facción Pater. El presidente y los magistrados del Tribunal Supremo, nombrados por recomendación de Misono Mika, expulsaron a los magistrados existentes, y la facción Filius reaccionó con fuerza, lanzando durísimas críticas. Sin embargo, Misono Mika no se inmutó y siguió imponiendo su voluntad."
 trinity_events.19.a: "Esto no es más que el comienzo."
 trinity_events.20.t: "El nacimiento de la Segunda Trinity"
 trinity_events.20.desc: "La serie de acontecimientos trascendentales iniciados con la 'Gran Transición' ha entrado en una nueva fase tras la desafortunada muerte de Yurizono Seia y el derrumbe del Tea Party. Ya no habrá más caos. Bajo el liderazgo de la Host Misono Mika, Trinity está logrando grandes avances.\n\nLas nuevas leyes de Trinity reflejan la voluntad de las masas, y la fe también ha quedado consignada en la ley. Todos los ejércitos juraron lealtad a la nueva líder, y las masas por fin recuperarán una vida estable. Con cada reforma que se implementa, la facción Pater se afianza más profundamente en el centro de Trinity, mientras las demás facciones se hunden cada vez más en la oscuridad. Ha llegado el momento de realizar una declaración oficial sobre la transformación de Trinity.\n\nLa Academia General Trinity es como un único organismo: todos se reúnen como uno y avanzan hacia un objetivo común. En la plaza de Edén, donde ondean innumerables banderas, aparece Misono Mika. La plaza, antes ruidosa, se fue aquietando con su aparición, y pronto todos prestaron oído a su voz desde la tribuna. Con su sombrero apoyado en el codo, Misono Mika continuó su discurso repitiendo la victoria de la facción Pater. Y finalmente, junto a la nueva bandera de la nueva Trinity desplegada a sus espaldas, declaró el fin del viejo sistema. Proclamó que, en medio del tumulto de los tiempos, Trinity había renacido. Los ejecutivos de la facción Pater estallaron en vítores y clamores, y poco después las masas que llenaban la plaza también los siguieron."
 trinity_events.20.a: "¡Viva nuestra alma máter!"
 trinity_events.21.t: "Legión de Voluntarios de Trinity"
 trinity_events.21.desc: "Sería mentira decir que no existió en absoluto resistencia anti-gubernamental en Trinity. Sin embargo, sorprendentemente, sobrevivió incluso bajo una represión constante. Mientras la red de vigilancia del Departamento de Justicia se estrechaba, la Gran Transición los empujó hacia una dirección extrema. Hoy, temprano por la mañana, mientras se utilizaba el transporte público para ir al trabajo, se arrojó una bomba contra una ex ejecutiva de la facción Sanctus; la explosión le causó graves daños, y la mayoría de los ciudadanos que viajaban en el transporte público sufrieron heridas de gravedad. Se presume que se trata de una sanción privada motivada por sospechas de que ella mantenía una relación estrecha con la facción Pater.\n\nOriginalmente eran una milicia de pocos con tendencias anti-gubernamentales, pero tras estallar la Gran Transición comenzaron a aceptar miembros de manera drástica, y en algunas regiones ya se han convertido en terroristas conocidos. Además, circulan diversos problemas, como que algunos ejecutivos de facciones de tendencia izquierdista se unieron a este grupo después de que Misono Mika tomara el poder.\n\nSe ha detectado indicios de que están atrayendo incluso fuerzas más moderadas, usando como nexo un odio común hacia la Host. Yamaji Romi, ex ejecutiva de la facción Sanctus de extrema izquierda, ha sido señalado como figura tras bambalinas, y se está llevando a cabo una búsqueda masiva para encontrarlo, sin descartar operaciones en el extranjero."
 trinity_events.21.a: "Si los encuentran, destrúyanlos de inmediato."
 trinity_events.22.t: "Cláusula de lealtad"
 trinity_events.22.desc: "¿Puede creerse que no se haya verificado la moralidad y la ideología de los funcionarios públicos? Como resultado de no haber examinado con rigor la ética y las tendencias políticas de los servidores públicos, personas con inclinaciones antipatrióticas han tomado con facilidad el control de los medios y han ocupado altos cargos del gobierno con frecuencia. Eso quedó demostrado, de hecho, con el atentado que costó la vida a Yurizono Seia, líder de Sanctus y Host.\n\n¡Ya no podemos seguir mirando hacia otro lado! En la situación actual, en que Trinity está en crisis, debemos introducir una cláusula de lealtad en la nueva Ley del Funcionario Público: el personal de todas las instituciones públicas debe recibir educación pro-Pater y demostrar su lealtad a Trinity obedeciendo su disciplina.\n\nEl método más efectivo para hacer que todos los funcionarios sean leales a Trinity es obligar la afiliación a la 'facción Pater'. Ya no existen otras facciones, y será la mejor forma de representar la voluntad estudiantil y mantener la estabilidad. Como era de esperarse, los nuevos miembros aumentaron en masa, y algunos que se resistieron presentaron renuncias como forma de protesta.\n\nPor supuesto, a los funcionarios antipatrióticos vinculados a organizaciones anti-Trinity se les prohibió unirse a la facción Pater, lo que en la práctica equivale a un despido. Es más, se consideró que una minoría de ellos tenía altas probabilidades de amenazar la seguridad pública, y el Departamento de Justicia inició de inmediato una investigación."
 trinity_events.22.a: "Por el bien mayor, dejemos algunas excepciones."
 trinity_events.22.b: "Amar a Trinity es el requisito más importante."
 trinity_events.23.t: "Cuerpo de Uniforme Blanco"
 trinity_events.23.desc: "En la Guardia de Defensa de la Academia, es hasta cierto punto obligatorio actuar vistiendo uniformes blancos. En particular, cuanto más alto el rango, más se recomienda llevar el uniforme blanco incluso en la vida cotidiana.\n\nDesde antes de que Misono Mika tomara el poder, algunos miembros belicosos del Tea Party ya utilizaban su propia 'milicia'. Compuesta principalmente por antiguos delincuentes, por quienes se volvieron delincuentes tras el incidente, o por quienes fueron expulsados de Trinity por bajo rendimiento, estas tropas privadas eran movilizadas también para actividades políticas. O bien eran usadas, a modo de patrulla civil, para mantener el orden, o para ayudar al Departamento de Justicia en arrestos, entre muchas otras tareas.\n\nA Misono Mika le resulta interesante que individuos posean tropas privadas. Tener cierto grado de fuerza es amenazante, pero como su nivel es inferior al de los miembros del Departamento de Justicia, Mika solo había hecho ciertas 'concesiones' incluso después de usurpar el poder. En especial, porque es ventajoso poder aprovechar a los delincuentes y expulsados procedentes de Kivotos como fuerza de combate para Trinity.\n\nDesde luego, no todo se limita a ser movilizados para actividades políticas. También existen quienes tienen un amplio espectro: patrullan con fines de voluntariado, comparten y practican su fe, donan con el pequeño estipendio de actividades a quienes se les derrumbó la vida, comparten su comida con una minoría de alemanes locales y apoyan a huérfanos sin hogar, entre otras cosas.\n\nMisono Mika reunió a estas tropas privadas en una sola organización y las convocó bajo el nombre de 'Guardia de Defensa de la Academia'."
 trinity_events.23.a: "Marcharemos sin fin."
 trinity_events.24.t: "El ascenso de la facción Pater"
 trinity_events.24.desc: "A medida que innumerables personas se unen a la facción Pater, esta está transformándose: deja de ser un grupo elitista rígido y se convierte en una facción popular para la ciudadanía. Aun así, la facción Pater, todavía inmadura en lo que respecta a ser una facción popular, está provocando todo tipo de incidentes. En especial, en estos tiempos difíciles que atraviesa la población por los sucesos recientes, decir que si tienen hambre coman pastel en vez de pan no es, en absoluto, una declaración pensada para los estudiantes comunes.\n\nPese a todo, la facción Pater continúa volviéndose una facción popular. Sus ejecutivos reparten una simple 'asistencia social' usando su dinero personal. Por supuesto, se les critica por abuso de atribuciones, al ser un gasto de bolsillo de miembros del Tea Party, pero mientras la nueva Constitución lo garantice, podrán esquivar cualquier castigo sin problemas."
 trinity_events.24.a: "Los seguidores del gran arcángel por fin han tomado forma."
 trinity_events.24.b: "¿No se puede hacer más por los ciudadanos de las autonomías?"
 trinity_events.25.t: "Quien guía y quien sigue"
 trinity_events.25.desc: "Misono Mika y la facción Pater están consolidando su poder y cambiando día con día. Se transforman de forma orgánica, pero trabajan con un objetivo común: hacer que Trinity esté en una situación mejor. Misono Mika tomó el poder como si fuera una providencia. Los ciudadanos de las autonomías no nacieron para convertirse en corderos dóciles dentro de la providencia. No existimos para sentarnos en silencio y vivir sin saber que morimos lentamente. Nacimos para conquistar nuestro destino con nuestras propias manos. Existimos para derrotar un mal colosal y cambiar el destino. Misono Mika es nuestra representante y el león que nos guía. Y nosotros somos el rebaño que la sigue y, al mismo tiempo, sus soldados."
 trinity_events.25.a: "¡Gloria a Trinity, gloria al gran arcángel!"
 trinity_events.26.t: "El final de la asamblea"
 trinity_events.26.desc: "La pregunta más importante sobre la dirección de la facción Pater ha sido resuelta, y la mayoría de los asistentes lo reconoció, adoptándolo como uno de los principios del programa. Después, continuaron las discusiones sobre otros problemas sociales, y la asamblea se encamina hacia su cierre. En especial, la escena en la que figuras de Trinity y políticos alemanes intercambiaron discursos en un intenso cruce de golpes atrajo tanta atención que llegó a publicarse en el periódico.\n\nAl final de la asamblea, la Host pronunció un discurso ante los ejecutivos de Pater, elogiando a quienes cargan con \"el pesado deber de renovar nuestra alma máter\". Concluyó diciendo que \"los ejecutivos reunidos aquí hoy sin duda están preparados para cumplir ese deber, y yo también espero lograr resultados significativos junto a ellos\", dando así por terminada la asamblea."
 trinity_events.26.a: "¡Por la Segunda Trinity, gritemos: ¡viva!"
 trinity_events.27.t: "La imagen de Misono Mika"
 trinity_events.27.desc: "A Misono Mika le gusta ponerse frente al público y está construyendo una imagen sólida. Para los antiguos estudiantes de Trinity, ella se ha convertido en esperanza, y para el público alemán, en una nueva alternativa. Con una carisma suave pero intensa, la mujer que tomó el poder se ha vuelto un medio que inspira a las masas. Aunque conserva un acento de Kivotos, también puede hablar alemán, y al exponer ante el público las miserias del anterior régimen nazi, está obteniendo apoyo incluso de los alemanes.\n\nPara dejar una imagen más firme, a sus epítetos se les está añadiendo un nuevo matiz. El apodo de 'gran arcángel' ya se ha extendido ampliamente, pero no es suficiente. Un epíteto con tinte religioso no funciona para todos. Los estudiantes de Trinity la llaman 'la salvadora de Trinity', 'madre bondadosa', 'mensajera del destino', 'la elegida', entre otros. Hay muchos más. Incluso, aunque es ambiguo si debe tomarse como algo positivo, entre los alemanes la llaman 'líder'.\n\nPara consolidar su imagen, es necesario escoger una sola palabra. Aun así, Misono Mika es la salvadora de Trinity y una madre bondadosa; es la mensajera del destino y la elegida; es la líder, y al mismo tiempo la Host del Tea Party y la antigua presidenta del consejo estudiantil de toda Trinity."
 trinity_events.27.a: "La Host es la salvadora de Trinity."
 trinity_events.27.b: "La Host es una madre bondadosa."
 trinity_events.27.c: "La Host es la líder de todos."
 trinity_culture_events.1.t: "'Nueva cultura trinitaria'"
 trinity_culture_events.1.desc: "La cultura puede explicarse de forma simplificada como el modo de vida general de una sociedad. Pero, ¿qué debemos hacer si esa cultura es decadente? ¿Debemos aceptarla también como 'una cultura' y continuar con actividades culturales decadentes? Ante esto, Misono Mika y la facción Pater respondieron con claridad: \"No\".\n\nEs cierto que Trinity ha avanzado en cierta medida en lo artístico y lo ideológico, pero comparada con otras academias no logró un gran salto. Durante el periodo de paz, nos estancamos. Otras academias nos alcanzaron o nos superaron, e incluso la Academia Gehenna —rival jurada de Trinity— ha establecido su propio modo cultural distintivo, algo que no puede sentirse en Trinity.\n\nPara arrancar de raíz esta cultura decadente, la facción Pater le propuso a Misono Mika una política: ampliar la autoridad del actual Departamento de Cultura para oponerse a la cultura decadente y, a la vez, crear, fomentar y promover una nueva cultura propia de Trinity. Misono Mika examinó seriamente la propuesta y pronto la aprobó.\n\nEn realidad, Misono Mika ya venía reflexionando profundamente sobre la nueva cultura desde antes. Ella había considerado los métodos existentes como algo demasiado 'molesto e irritante'. Por eso, que la facción Pater propusiera primero algo así debió de ser, incluso para ella, una suerte inesperada."
 trinity_culture_events.1.a: "¡Nueva cultura, nueva Trinity!"
 trinity_events.28.t: "Plan de estudios de Trinity"
 trinity_events.28.desc: "El método educativo de Trinity está profundamente impregnado de matices religiosos. Las clases de capilla son el ejemplo más representativo. Por supuesto, no pretendemos negar que la Academia General Trinity fue erigida sobre valores religiosos. Sin embargo, estamos discutiendo este tema porque debemos avanzar hacia una dirección un poco más eficiente y práctica.\n\nConvertiremos materias como las clases de capilla y las actividades religiosas en asignaturas optativas en lugar de asistencia obligatoria, o bien las reestructuraremos como otro tipo de asignatura destinada a la Sisterhood. Desde luego, esta decisión podría provocar la oposición de la Sisterhood. Pero, a cambio, los estudiantes de Trinity podrán gozar de una libertad académica más amplia."
 trinity_events.28.a: "Suena bien. Apliquémoslo."
 trinity_events.28.b: "¿Hace falta ganarse la oposición de la Sisterhood?"
 trinity_culture_events.2.t: "Estilo arquitectónico"
 trinity_culture_events.2.desc: "En el arte de Trinity existen múltiples corrientes, y una de ellas es el estilo arquitectónico. Techos azules, muros de aire clásico y una decoración interior fastuosa, además de proporciones meticulosas: a diferencia de otras academias, la arquitectura de Trinity se ha desarrollado con un carácter antiguo y lujoso. Sin embargo, este estilo está teniendo dificultades para conseguir materiales. Al aferrarse a un perfeccionismo excesivo, completar un solo edificio puede tardar decenas de meses. Este problema sigue sin resolverse incluso después del incidente.\n\nEn los debates internos de la facción surgió como alternativa un estilo modernista que minimiza la ornamentación exterior e interior y prioriza la eficiencia y la funcionalidad. Pero incluso dentro del modernismo aparecieron dos posturas, centradas en un punto: la cuestión ecológica. Dado que Trinity ha valorado desde antes los métodos respetuosos con el medio ambiente, se plantea que el modernismo también debe adoptar obligatoriamente elementos ecológicos."
 trinity_culture_events.2.a: "El modernismo ecológico es más propio de Trinity."
 trinity_culture_events.2.b: "Lo ecológico importa, pero hay cosas más importantes."
 trinity_culture_events.3.t: "Control de la cultura popular"
 trinity_culture_events.3.desc: "La cultura popular es, literalmente, una cultura a la que las masas pueden acceder con facilidad. Pero dicho de otro modo, también significa que puede degradarse hasta convertirse en una herramienta con la que controlar y adoctrinar al público de forma sencilla. Por eso, la facción Pater ha trabajado de manera constante para aferrar una especie de 'hegemonía' en este ámbito. Hasta antes de que Misono Mika llegara al poder, esa estrategia parecía funcionar hasta cierto punto, pero al final chocó con sus límites y ya no pudo producir resultados significativos.\n\nAnte esto, la facción Pater propuso usar la autoridad del Tea Party para controlar firmemente la cultura popular. Se llegó a discutir desde la idea de defender a Misono Mika en todos los medios —prensa, publicaciones, educación, cine, etc.— e infiltrar con sutileza la ideología propia de Trinity, hasta planes de movilizar el arte y la música para producir óperas o sinfonías que impusieran lealtad a Trinity."
 trinity_culture_events.3.a: "El control puede provocar aún más descontento. Me opongo."
 trinity_culture_events.3.b: "Controlar la cultura popular será otro escudo para proteger a Trinity."
 trinity_events.29.t: "La fe de Trinity"
 trinity_events.29.desc: "Las iglesias dentro de Alemania están mostrando una actitud mucho más oportunista de lo esperado, y la fe de Trinity se está extendiendo como un incendio, especialmente en las regiones del Centro y del Oeste. En el corazón de este cambio acelerado estuvo la devota labor misionera de Utazumi Sakurako; los clérigos locales, conmovidos por sus sermones sinceros, aceptaron la doctrina incluso sin presiones externas y empezaron a ansiar la atención del Tea Party.\n\nLos habitantes de esas regiones se están asimilando rápidamente a la fe sin mostrar rechazo. Sin embargo, en las provincias y zonas rurales —consideradas bastiones del conservadurismo— persiste una actitud excluyente hacia lo externo y se niegan a aceptar las enseñanzas, mostrando un panorama dual.\n\nEn cuanto a la composición de los creyentes, las mujeres representan una proporción alta. Esto se debe a que, en una sociedad caótica, una doctrina más progresista y abierta que la religión local satisfizo la necesidad de formar lazos y comunidad. Por supuesto, tampoco son pocos los creyentes varones: en su caso, las conversiones se concentran principalmente en capitalistas urbanos, capas intelectuales o sectores que desean relacionarse con nosotros.\n\nCabe destacar que la tasa de conversión entre los católicos es especialmente alta. Parece que la similitud doctrinal entre ambas religiones contribuyó de forma importante a reducir la barrera psicológica asociada a la conversión."
 trinity_events.29.a: "\"Es una trampa. Estás muerto.\""
 trinity_events.30.t: "Derechos de las mujeres"
 trinity_events.30.desc: "La política nazi hacia las mujeres fue extremadamente opresiva. Separaron de manera estricta los roles de hombres y mujeres, y pretendieron degradar a la mujer, no como un individuo independiente, sino como una herramienta. Bajo el lema de \"niños, cocina e iglesia\", limitaron la vida de las mujeres al hogar y, mediante leyes de incentivo matrimonial, actuaron como si la dignidad de una mujer pudiera comprarse con dinero.\n\nEn ese periodo, innumerables funcionarias públicas fueron despedidas a la fuerza. Las mujeres que trabajaban en profesiones especializadas —maestras, médicas, juezas, etc.— también fueron expulsadas de sus puestos sin excepción. Los nazis buscaban arrebatar a las mujeres su independencia económica y su estatus social. Más aún, mediante políticas inhumanas como el plan Lebensborn, intentaron tratar a la mujer únicamente como un medio para dar a luz.\n\nAhora debemos corregir todo esto. Arrancaremos de raíz, por completo, el legado de opresión que dejaron los nazis y las SS. Las funcionarias injustamente despedidas serán restituidas de inmediato. Esto no es un privilegio especial: es un derecho que debe ser restaurado. Es el momento de demostrar que nuestra sociedad no ha retrocedido hacia la barbarie."
 trinity_events.30.a: "¡Mujeres, ánimo! ¡Estamos con ustedes!"
 trinity_events.31.t: "El destino de Alemania"
 trinity_events.31.desc: "Misono Mika y la facción Pater están discutiendo qué hacer con los alemanes de Trinity. En términos prácticos, la expulsión parece una buena opción. Pero no se puede expulsar a decenas de millones de alemanes. Por eso, debemos subordinarlos a Trinity, o bien destruir por completo el concepto mismo de \"Alemania\" para quebrar de forma total su voluntad de resistencia.\n\nLa mayoría de la facción Pater apoya la idea de 'aniquilar' por completo la identidad alemana y hacer que sean usados como 'esclavos'. Planean destruir lo que constituye la raíz de lo alemán y plantar a Trinity en su lugar.\n\nNaturalmente, este plan no cuenta con el apoyo de Misono Mika. En Mika queda un corazón más blando de lo que muchos creen. Incluso al eliminar a sus enemigos políticos, no les otorgó la muerte: se limitó a enviarlos lejos del centro, bajo vigilancia, para impedirles la actividad política. Esa compasión también la siente hacia los alemanes. Pero no es una compasión demasiado fuerte. Misono Mika decide el destino de los alemanes considerándolo algo lamentable, pero inevitable."
 trinity_events.31.a: "Los alemanes sobrevivirán. Como ciudadanos de segunda."
 trinity_events.31.b: "La identidad llamada \"Alemania\" será aniquilada. Para siempre."
 trinity_events.32.t: "La pastora de la academia"
 trinity_events.32.desc: "Misono Mika, líder de Trinity y Host del Tea Party, es llamada por innumerables epítetos, y entre ellos hay uno que le gusta especialmente: \"la pastora de la academia\". La palabra \"pastora\", que encierra el significado de protectora y salvadora de Trinity, y de quien guía a la academia, le está infundiendo una nueva inspiración.\n\nAunque los conflictos sociales todavía no se han resuelto del todo, más alemanes que antes están apoyando a Misono Mika o aceptando su guía. Entre los estudiantes de Trinity, los crímenes de odio contra alemanes y los delitos cometidos por mero placer también están disminuyendo gradualmente. Esto se debe a la labor del Departamento de Justicia y de las patrullas civiles de Trinity. Muchos estudiantes se acercan a los alemanes con compasión, y aunque ahora sea difícil, si se les concede el tiempo suficiente, parece que no está lejos el día en que los estudiantes de Trinity y los alemanes realmente se integren.\n\nComo nota aparte, en algunas pequeñas comunidades alemanas dentro de Trinity se está formando un ambiente en el que ven a Misono Mika como una especie de \"idol\", y una cultura de fandom empieza a asentarse con cautela."
 trinity_events.32.a: "¡Prepárate!"
 trinity_events.33.t: "Nominación de la Host del Tea Party"
 trinity_events.33.desc: "Las secuelas del asesinato de Yurizono Seia no daban señales de calmarse, y empezó a surgir la pregunta de quién sería la siguiente Host.\n\nMuchos ejecutivos del Tea Party esperaban que Misono Mika fuera nominada como la próxima Host, y esto se aceptaba casi como un hecho. Tras el asesinato de Yurizono Seia, la facción Sanctus perdió prácticamente toda su influencia, y la facción Filius liderada por Kirifuji Nagisa estaba en una situación en la que incluso contraatacar con propiedad era difícil ante la feroz ofensiva política de la facción Pater.\n\nSin embargo, no existía una garantía absoluta de que Misono Mika fuera la próxima Host. Su estrategia de propaganda logró expandir con rapidez el poder de la facción Pater, pero incluso dentro empezaron a surgir voces de oposición. En particular, el bloque 'moderado' se levantó contra esa corriente.\n\nAun así, no se veía esperanza, y finalmente comenzó la votación para la Host. Como candidatas, Misono Mika y Kirifuji Nagisa pronunciaron sus políticas una por una bajo el juramento del Tea Party. Cuando Misono Mika habló, la facción Pater respondió con entusiasmo; en cambio, cuando Kirifuji Nagisa habló, se desató indiferencia o abucheos, provocando varios problemas. Afortunadamente, el proceso de votación en sí avanzó sin grandes incidentes.\n\nY por fin comenzó el conteo. La transmisión del escrutinio avanzaba rápido, y ahora solo queda una cosa.\n\n¿El resultado será...?"
 trinity_events.33.a: "Misono Mika obtuvo la mayoría y fue elegida."
 trinity_events.33.b: "Contra todo pronóstico, Kirifuji Nagisa fue elegida."
 trinity_events.34.t: "Nombramiento de la jefa del Departamento de Desarrollo Económico de la Academia"
 trinity_events.34.desc: "Para resolver los problemas económicos generales de la academia, se convocó a especialistas en economía e industria y se creó el Departamento de Desarrollo Económico de la Academia. Esta organización tiene un carácter cooperativista laxo, sin un representante oficial. Que cada quien defienda su propio método como el correcto y continúe con debates e investigaciones apasionadas es algo deseable, pero es imprescindible un rol que ajuste el rumbo para evitar que la situación se sobrecaliente. Ese rol de coordinadora recaerá en la jefa del Departamento de Desarrollo Económico.\n\nPor ahora, dentro del departamento no parece haber alguien idóneo para el puesto, pero ya se encontró la respuesta fuera: la jefa de la Biblioteca, Ui, y la bibliotecaria, Shimiko.\n\nKozeki Ui es actualmente la jefa de la Biblioteca; es conocida como alguien que ama los libros, y quizá también lee, comprende y hasta aplica libros de economía. Hay opiniones que la consideran inadecuada por su personalidad introvertida y sus pobres relaciones interpersonales, pero eso puede corregirse lo suficiente.\n\nLa siguiente es Endou Shimiko. Ella también es miembro de la Biblioteca. Afirma haber leído todos los libros que existen en Trinity. Además, se la ha visto gestionando una biblioteca enorme y, a diferencia de lo que cabría esperar, interactuando bastante con otros estudiantes, entre varios aspectos más que..."
 trinity_events.34.a: "Kozeki Ui: su personalidad introvertida no es un gran problema."
 trinity_events.34.b: "Endou Shimiko: su forma de mediar fue un gran ejemplo."
 trinity_events.34.c: "Arréglenselas ustedes."
 trinity_events.35.t: "Reorganización de la Agencia de Inteligencia de la Academia"
 trinity_events.35.desc: "Tras el terrible asesinato de Yurizono Seia, quedó claro que la Agencia de Inteligencia de Trinity había perdido prácticamente toda su funcionalidad. Su capacidad de recopilar inteligencia exterior es deficiente en comparación con otras academias, y su sistema interno de contrainteligencia es, literalmente, desastroso. Si quienes deben velar por la seguridad de Trinity están así, ¿de verdad podemos decir que todo está bien? La actual directora, Itano Yoriko, solicita tiempo asegurando que podrá resolver estos problemas, pero este asunto no es algo que podamos dejar con calma en manos del tiempo.\n\nLa agencia dejará de ser un organismo independiente y será reorganizada como un departamento interno bajo el Tea Party. Itano Yoriko será destituida de inmediato, y a partir de entonces el nombramiento de la directora de inteligencia se hará por decisión directa de la Host. Además, se implementará una verificación ideológica: quienes sean desleales al gobierno deberán renunciar en su totalidad o no podrán evitar una investigación del Departamento de Justicia.\n\nPara prevenir de antemano tragedias como el asesinato de Yurizono Seia, se reforzará la capacidad de recopilación de información que tanto se había señalado como insuficiente, y el alcance de recolección y vigilancia se ampliará drásticamente. Muchos estudiantes podrían sufrir invasiones a su privacidad, pero si es por la gran causa, los estudiantes de Trinity lo soportarán.\n\nDado que la Quinta Enmienda de la Constitución de la Academia General Trinity lo estipula, la reorganización de la Agencia de Inteligencia avanzará con rapidez."
 trinity_events.35.a: "Es algo que debemos soportar."
 trinity_events.36.t: "Situación de seguridad"
 trinity_events.36.desc: "La seguridad de la Academia General Trinity sigue siendo precaria. Al este acecha una enorme potencia [SOV.GetAdjective]; al oeste nos amenazan [GEM.GetAdjective] y [GEH.GetAdjective]; al norte, [RED.GetAdjective]. Hacia el sur hay muchas academias pequeñas dispersas, pero tampoco puede descartarse la posibilidad de que establezcan un gobierno unificado bajo el nombre de 'Kivotos del Sur'.\n\nEsta amenaza colosal se ha convertido en el destino que Misono Mika y la facción Pater deben enfrentar y resolver. Además, los estudiantes, día tras día, exigen la guerra contra Gehenna, agravando las tensiones entre academias. La promesa que Misono Mika enarboló al tomar el poder era precisamente cumplir ese anhelo, pero una guerra sin preparación llevará a Trinity a la ruina y derribará incluso el legado dejado por el Primer Concilio.\n\nLa facción Pater y Misono Mika continúan debatiendo día y noche sobre esta precaria situación de seguridad, pero no se llega a una conclusión con facilidad."
 trinity_events.36.a: "Esto es un desastre geopolítico."
 trinity_events.37.t: "Nacimiento de facciones menores"
 trinity_events.37.desc: "Cuando desaparecieron las dos grandes facciones de Trinity, lo que se coló para ocupar su lugar fueron facciones menores. En particular, la Ley Misono Mika, enmendada tras la usurpación de poder de Misono Mika, no frena de manera significativa la creación de nuevas facciones, por lo que la proliferación de estas facciones pequeñas entra dentro de lo esperado.\n\nSi observamos algunas facciones representativas creadas por antiguos miembros de las viejas grandes facciones, encontramos a quienes rechazaron el color ideológico de Misono Mika y de la facción Pater, desertaron y fundaron nuevas facciones. En ellos no existe ninguna convicción ideológica; están formados solo por gente que desea repetir los mismos vicios de la desagradable facción Pater de antes. La facción Pater los llama 'hijos pródigos' y los desprecia, mientras que las nuevas facciones elevan el tono de sus críticas, calificando a Pater como ángeles corrompidos.\n\nPor otro lado, es interesante la inclinación de las nuevas facciones creadas por idealistas que provenían de Filius y Sanctus. Ellos suelen abanderar un liberalismo progresista, pero por las diferencias ideológicas entre los representantes de Filius y Sanctus, por las diferencias de carácter de cada facción y por problemas esenciales, un acuerdo entre ambas parece lejano."
 trinity_events.37.a: "¿Están jugando a las casitas o qué?"
 trinity_events.38.t: "Debate sobre empresas alemanas"
 trinity_events.38.desc_ui: "Tras la Gran Transición, innumerables empresas quebraron o sufrieron daños graves, y nosotros aprovechamos ese vacío para nacionalizarlas, asentando así los cimientos de la economía de la academia. Aun así, todavía sobreviven muchas empresas de industria pesada y algunas de industria ligera, que en su mayoría pertenecen a millonarios dentro de la academia. En especial, más allá del río Óder, en regiones donde nuestro control no llega del todo, aún resisten empresas privadas de 'interés nacional'.\n\nAlgunos economistas dentro de la facción Pater advierten contra una intervención demasiado radical. Estos, llamados la corriente de centro económico, sostienen que aunque parte de la industria pesada permanezca en manos privadas, no supondrá una amenaza grave para el plan económico de la academia; al contrario, afirman que los empresarios podrían convertirse en aliados políticos.\n\nSin embargo, la jefa del Departamento de Desarrollo Económico, Kozeki Ui, es tajante. Ella dice:\n\"......Si todos no siguen la voluntad de la cabeza, no hay forma de planificar correctamente la economía de la academia.\"\n\nElla y los especialistas del departamento exigen con firmeza una nacionalización total y exhaustiva, haya o no compensación."
 trinity_events.38.desc_Sch: "Tras la Gran Transición, innumerables empresas quebraron o sufrieron daños graves, y nosotros aprovechamos ese vacío para nacionalizarlas, asentando así los cimientos de la economía de la academia. Aun así, todavía sobreviven muchas empresas de industria pesada y algunas de industria ligera, que en su mayoría pertenecen a millonarios dentro de la academia. En especial, más allá del río Óder, en regiones donde nuestro control no llega del todo, aún resisten empresas privadas de 'interés nacional'.\n\nLa jefa del Departamento de Desarrollo Económico, Endou Shimiko, dice: \"¡Aunque parte de la industria pesada permanezca en manos privadas, el plan no se descarrilará!\". Con esas palabras contiene una intervención excesiva y propone una 'alianza' con algunas empresas. Insiste con fuerza en crear asociaciones de empresarios y cámaras de comercio para poder dialogar con los dueños."
 trinity_events.38.a: "Nacionalízalas, pero deja que los propietarios las administren."
 trinity_events.38.b: "Por ahora déjalas. Luego las compraré de forma justa."
 trinity_events.38.c: "Ella tiene razón. Quítaselas. ¿Quién necesita permiso?" # opción de Ui
 trinity_events.38.d: "Démosles 'privilegios' y lideremos una cooperación estrecha." # opción de Shimiko
 trinity_events.39.t: "Hans Fritzsche"
 trinity_events.39.desc: "Hoy llegó una carta dirigida a la Host. El remitente es un hombre llamado \"Hans Fritzsche\", y la misiva, escrita con una caligrafía antigua, enfatizaba sus habilidades y su trayectoria. En particular, él expresó que su voz \"tiene resonancia\", mostrando una fuerte confianza en su capacidad de persuasión pública.\n\nSegún la investigación de la Agencia de Inteligencia de Trinity, antes de la Gran Transición él pertenecía al Partido Nacionalsocialista Obrero Alemán y desempeñaba funciones burocráticas, y se confirmó además su historial como locutor de discursos de Joseph Goebbels. Sus actos tras el incidente son inciertos, pero como actualmente no muestra hostilidad hacia Trinity, se presume que logró sobrevivir sin conflictos o que tuvo éxito al huir.\n\nJoseph Goebbels fue una figura que en su día dirigió el aparato de propaganda alemán, contribuyendo de forma significativa a la construcción de la imagen del líder. Nosotros no tenemos a alguien así, pero Hans Fritzsche, capaz de imitar su voz, podría resultar útil hasta cierto punto en la persuasión de masas y en labores de propaganda."
 trinity_events.39.a: "No parece mala idea reclutarlo."
 trinity_events.39.b: "...Dicen que las pirañas antropófagas del Elba adoran la carne de los oportunistas."
 trinity_events.40.t: "Reindustrialización de Trinity"
 trinity_events.40.desc: "La ampliación repentina del territorio de la academia es una oportunidad de oro para expandir la industria de Trinity. El plan de reindustrialización concebido por los expertos en obra civil de la academia está llamando la atención como una medida capaz de resolver simultáneamente los problemas industriales que se dispararon tras el incidente y el desempleo de los alemanes locales.\n\nEl proceso de reindustrialización sigue etapas claras. Primero, se construyen barracones simples cerca de la zona de desarrollo. Los trabajadores resolverán allí comida, vestido y alojamiento, y aportarán su fuerza laboral a la academia. El salario se pagará en 90% yenes de Kivotos y 10% marcos alemanes. Tras completarse el desarrollo, los trabajadores quedarán ante una elección: pueden seguir trabajando en esa región, trasladarse a otra zona de desarrollo o, si lo desean, renunciar. La decisión es suya.\n\nCuando el plan de reindustrialización se hizo público, despertó gran interés no solo entre los alemanes locales, sino también entre algunos estudiantes y hombres-bestia. El reclutamiento de voluntarios está en marcha, y con la expectativa de muchos, el plan se está poniendo en marcha a gran escala."
 trinity_events.40.a: "Esperamos el fruto de sus esfuerzos."
 trinity_events.41.t: "Movimiento de resistencia de estudiantes de Gehenna"
 trinity_events.41.desc: "Apenas han pasado unos días desde la derrota en la guerra contra Trinity, y ya se detectan entre los estudiantes de Gehenna movimientos espontáneos de unión. En particular, la resistencia —del Club de Desarrollo de Aguas Termales, el Club de Investigación Gourmet, el Club de Irse a Casa, la Guardia Pretoriana de Pandemonium y también el Comité de Disciplina, entre otros— está expandiéndose más allá de la simple desobediencia, convirtiéndose en un problema a escala de toda la academia, y provocando disturbios e inseguridad incluso dentro del territorio de la Academia General Trinity.\n\nLa situación muestra rasgos de resistencia organizada, no un mero desahogo de quejas, y dejarlo estar por más tiempo podría amenazar el orden de la academia. Dada la gravedad, se requiere con urgencia una rápida aprobación y decisión por parte de la Host."
 trinity_events.41.a: "Qué dolor de cabeza..."
 trinity_events.43.t: "El problema de los clubes de Gehenna"
 trinity_events.43.desc: "\"¡Wahhahahaha!!\"\n\"¡Uff! Qué alivio.\"\n\nKinugawa Kasumi, la molestia de Gehenna y criminal buscada en todo Kivotos, del Club de Desarrollo de Aguas Termales, actualmente se mueve entre Trinity y Gehenna desatando terrorismo indiscriminado bajo el pretexto de \"desarrollar aguas termales\". En particular, este desarrollo de aguas termales se interpreta como un símbolo de resistencia contra Trinity, y se considera que contiene un mensaje político, no un simple proyecto.\n\nPara capturarlos se necesita un apoyo más fuerte. Ni siquiera Sorazaki Hina, del Comité de Disciplina, pudo neutralizarla, así que una táctica simple no bastará. Actualmente el Departamento de Justicia y la Agencia de Inteligencia de la Academia están cooperando para rastrear a Kinugawa Kasumi y a las antiguas jefas de clubes de Gehenna, pero la mayor amenaza, como era de esperarse, es Kinugawa Kasumi."
 trinity_events.43.a: "Es la mayor amenaza..."
 trinity_events.44.t: "El destino de la Escuela Secundaria Arius"
 trinity_events.44.desc: "Misono Mika, originalmente, había contactado con la Escuela Secundaria Arius bajo la superficie del Tea Party y logró que \"Shirasu Azusa\", que estudiaba en esa escuela, se transfiriera a la sede principal de Trinity. Sin embargo, el caos político tras la Gran Transición y la guerra contra el Estado alemán la obligaron a ejecutar el plan antes de tiempo y, aunque la preparación fue insuficiente, al final consiguió usurpar el poder incluso sin la ayuda de Arius.\n\nPero ahora que tiene el poder en sus manos, la Escuela Arius, que en el pasado se movió según su plan, ha perdido el sentido de su existencia y ha quedado a la deriva. Ellos, que eran el \"caballo\" para conquistar el poder, podrían convertirse en un estorbo una vez el régimen se estabilice.\n\nMisono Mika debe decidir ahora su destino. Tras la Gran Transición, no se ha identificado la ubicación exacta de Arius, pero considerando que se han sucedido casos de daños a estudiantes de Trinity cerca de Danzig, especialmente en la zona de Gdynia, es muy probable que estén ocultos en las cercanías. Aunque en realidad no sean estudiantes de Arius, es seguro que nuestro enemigo se esconde por esa zona.\n\nMisono Mika, ahora mismo, puede exterminarlos por completo para eliminar un obstáculo para el régimen, o bien posponer el plan por el valor que aún puedan tener o por consideraciones políticas."
 trinity_events.44.a: "\"Reconciliarnos con la Academia Arius... Sí. ¿No suena bien?\""
 trinity_events.44.b: "\"A estas alturas, ¿qué más da Arius?\""
 TRN_trinity_44_b_tt: "§Y$TRN_Shirasu_Azusa$§! regresará a §Y[ARI.GetNameWithFlag]§!."
 trinity_events.45.t: "Protesta en [64.GetName]"
 trinity_events.45.desc: "En el Distrito Central de Trinity, el lugar que podría llamarse el corazón de Trinity, estalló una protesta de alemanes. Gracias al control de tránsito del Departamento de Justicia, la protesta fue contenida hasta cierto punto, pero los locales alemanes siguen sin abrir su corazón a [TRM.GetAdjective].\n\nLa protesta perdió su organización y terminó disolviéndose por sí sola, dejando las calles devastadas. Los estudiantes de Trinity pasaron por las huellas de la protesta con rostros inexpresivos, y alguien grabó la escena. El video se difundió rápidamente por internet y la reacción de los estudiantes fue feroz. La sección de comentarios se llenó de críticas contra los manifestantes.\n\nSin embargo, la agencia de inteligencia captó una pista: se encontró una cuenta que se presume pertenece a los instigadores. En la biografía del perfil decía \"Reunión de patriotas por Alemania\", y se compartía información detallada sobre la protesta en forma de publicaciones.\n\nLa Agencia de Inteligencia de Trinity y el Departamento de Justicia iniciaron de inmediato una investigación conjunta. Harán que el responsable pague."
 trinity_events.45.a: "\"Mmm. ¿Cómo deberíamos lidiar con esto... en esta situación...?\""
 trinity_events.46.t: "Informe de la Agencia de Inteligencia de Trinity"
 trinity_events.46.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\nA la Host del Tea Party, [TRM.GetLeader],\n\nTras recopilar información llevando a cabo labores de contrainteligencia dentro de Trinity, la Agencia de Inteligencia de la Academia ha asegurado pistas cruciales relacionadas con los recientes casos consecutivos de desapariciones, y le informamos que estamos listos para presentarle el reporte.\n\nSe estima que los casos masivos de desaparición ocurridos recientemente en Kimigayama están profundamente vinculados con la Escuela Secundaria Arius, que fue expulsada en el pasado por el Concilio. Según lo confirmado, actualmente están cooperando con residentes de origen alemán para provocar un caos grave dentro de Trinity, lo cual se interpreta como parte de un intento de expandir gradualmente la influencia de Arius. Este informe incluye también evidencia concreta que respalda esas circunstancias.\n\nAdemás, según el análisis basado en declaraciones de familiares de las víctimas, se ha determinado que la ubicación aproximada de la Escuela Arius se encuentra dentro de unos 150 km de Kimigayama.\n\nCon respeto,"
 trinity_events.46.a: "\"No podemos dejar a Jōmae Saori así.\""
 trinity_events.46.b: "\"Si esto es verdad, es un dolor de cabeza...\""
 TRN_after_this_operation_against_arius_tt: "Pronto se iniciará la operación §Y'Hierro Cortante'§! para destruir el plan de §Y[ARI.GetNameWithFlag]§!."
 trinity_events.47.t: "Un nuevo trato"
 trinity_events.47.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\nDesde hace mucho, Misono Mika ha considerado desagradable el derecho que la Sisterhood y la Orden de Caballeros de Socorro tienen para intervenir en el Tea Party. En especial, su descontento con la Sisterhood era aún más profundo.\n\nBajo el pretexto de la \"confidencialidad\", ocultaban como secreto el fundamento de todas sus acciones. Tras la Gran Transición, ese hermetismo se intensificó todavía más. No había forma de saber qué estaban tramando, escondiéndolo todo tras un velo de secretos.\n\nPero el modo de frenar sus movimientos no tenía por qué ser necesariamente la violencia.\n\nLa Sisterhood tenía una debilidad: el recuerdo del Concilio de los Santos Justina. Ese oscuro pasado les ataba los pies. En el momento en que la Sisterhood se moviera primero, la pesadilla del Concilio de los Santos Justina resurgiría y estimularía el miedo de los estudiantes de Trinity. Perder el apoyo popular es cuestión de un instante.\n\nMika lo veía con total claridad.\n\nPor eso, eligió un trato. Bajo un pretexto convincente llamado \"contención del caos\", ambas partes se sentarán frente a frente en una mesa de negociación. Un nuevo juego, bajo el nombre de cooperación, estaba a punto de comenzar."
 trinity_events.47.a: "\"...Tengo mucho que pensar.\""
 trinity_events.48.t: "Respuesta"
 trinity_events.48.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nUtazumi Sakurako estaba ante una encrucijada.\n\nLlegó una invitación de Misono Mika. El pretexto era convincente: \"una reunión para la situación de seguridad de la Academia General Trinity y el sellado de los conflictos políticos\". La reunión se llevaría a cabo en secreto, pero Sakurako no podía quitarse de encima una incomodidad difícil de explicar.\n\nMisono Mika.\n\nCon solo ese nombre, una emoción desagradable se agitaba en el pecho de Sakurako. Cuando asesinaron a su amiga, ella no mostró ni la menor tristeza. Al contrario, usó ese caos como trampolín para encerrar incluso a su amiga de la infancia y hacerse con el poder. El cañón de ese poder, obtenido por usurpación, ahora apuntaba hacia Sakurako.\n\nNo podía saber qué exigiría en esa reunión. ¿Cooperación? ¿Sumisión? ¿O algo más retorcido?\n\nQuedaba poco tiempo para la reunión."
 trinity_events.48.a: "\"Esto también es una prueba.\""
 trinity_events.49.t: "Reunión secreta"
 trinity_events.49.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n\"...Mika-sama, creo que es la primera vez que la veo desde aquel incidente.\"\n\"Sí. He estado muy ocupada. Por muchas cosas.\"\n\n\"...Me lo imagino.\"\n\nCayó un silencio incómodo. La atmósfera era como caminar sobre hielo delgado. Ambas partes intercambiaron saludos formales, pero la conversación no avanzaba.\n\n\"Entonces, ¿por qué me ha llamado aquí? Según las reglas, la Sisterhood y el Tea Party no interfieren entre sí.\"\n\n\"¿Por qué te llamé? Pues, ¡porque...! ...No, espera: ¿si tú también sabes perfectamente por qué te llamé, no?\"\n\n\"Por mi parte, este lugar me resulta simplemente incómodo. ¿No podría decirme el asunto de una vez?\"\n\n\"Mmm... ya veo... entonces, iré al grano~!\" \nElla se inclinó hacia adelante y dijo:\n\"¿No quieres cooperar conmigo? ¿Qué dices? No suena mal, ¿verdad?\"\n\n\"...¿Podría explicarlo con más detalle?\"\n\n\"Ah, o sea, ¡literalmente eso!\" dijo Mika agitando la mano. \"Que la Sisterhood y el Tea Party cooperen. Sí. ¿No es genial?\""
 trinity_events.49.a: "(Q-qué... como dicen los rumores, qué cara tan aterradora...)"
 trinity_events.50.t: "Reunión secreta"
 trinity_events.50.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nCuando Sakurako, con el rostro frío, esperó una respuesta, Mika vaciló un instante y continuó. En su voz ya no quedaba ni rastro de broma.\n\n\"O sea, la antigua Trinity, ¿sabes? Luchas de facciones, intrigas políticas por todos lados. Y desde el incidente esto se volvió aún peor. A mí me hartó, así que lo barrí todo con fuerza~☆\"\n\"Pero, ¿y la Sisterhood? Ustedes respetan bien las costumbres, ¿no? A mí eso me gustó.\"\n\n\"...\"\n\n\"Yo barrí el Tea Party entero y puse el orden con fuerza. Y tú, Sakurako, vas a enderezar la moral con la fe. Sí. ¿Un plan genial, no?\"\n\nSakurako se mordió el labio. En las palabras de Mika no había margen de elección. Rechazarlo equivalía, prácticamente, a poner en peligro a toda la Sisterhood.\n\n\"...Señora Mika, lo que usted ha hecho... es un pecado imperdonable que jamás puede tolerarse en el nombre de Dios.\"\n\n\"Pero...\" Sakurako inhaló hondo. \"En cierto sentido, lo que dice tiene lógica. Trinity, por esta situación sin precedentes, ha visto su fe debilitada, y los estudiantes, arrastrados por las facciones, han olvidado su deber. Yo tampoco puedo decir que esté libre de responsabilidad por no haber podido corregirlo.\"\n\n\"La Sisterhood no puede lavar la sangre de sus manos. Esa será la cruz que deberá cargar toda su vida.\"\n\nMika seguía mirando a Sakurako con una sonrisa. Su mirada era suave, pero al mismo tiempo implacable. Ambas sabían que no podía negarse.\n\n\"Pero...\" La voz de Sakurako tembló. \"Dejar este caos y permitir que más estudiantes se pierdan y sufran tampoco será la voluntad del Señor. Si ese 'nuevo orden' del que usted habla es de verdad por el 'bienestar' de los estudiantes de Trinity...\"\n\nSe hizo el silencio. Sakurako sabía demasiado bien qué estaba eligiendo. Esto no era cooperación, era sumisión. Pero no había otra opción.\n\n\"......De acuerdo. Aceptaré esa 'cooperación'.\"\n\nMika saboreó la respuesta de Sakurako por un momento y luego sonrió ampliamente, satisfecha."
 trinity_events.50.a: "\"...¡Sí! ¡Sabía que Sakurako-chan entendería! ¡Pensé que nos íbamos a entender bien!\""
 trinity_events.51.t: "Desnazificación"
 trinity_events.51.desc: "La Agencia de Inteligencia de la Academia informa que ha recopilado pruebas con el objetivo de llevar a cabo la desnazificación, y que una operación basada en dichas evidencias está a punto de comenzar."
 trinity_events.51.a: "Por un mundo sin nazismo."
 trinity_events.52.t: "Disolución del Cuerpo de Banderas Negro-Rojo-Oro"
 trinity_events.52.desc: "El Partido Socialdemócrata. En su día, fueron el mayor enemigo del nazismo, pero ahora se han convertido en una de las fuerzas de resistencia contra Trinity. Centrados en el Cuerpo de Banderas Negro-Rojo-Oro, han estado incitando a los alemanes locales a oponerse a Trinity, y ya no podíamos permitir que siguieran así.\n\nLa Agencia de Inteligencia ha identificado sus principales bases de actividad. Gracias a las leyes recientemente enmendadas, se estableció el fundamento legal, y la Agencia de Inteligencia junto con el Departamento de Justicia recibieron amplias facultades de arresto. Con los preparativos de la operación en marcha, se movilizaron miles de balas, decenas de tipos de equipamiento y al menos mil miembros del Departamento de Justicia. La mayor operación en la historia de Trinity estaba comenzando.\n\nCon el inicio de la operación, algunos miembros del partido y afiliados al Cuerpo de Banderas comenzaron a ser arrestados. Aquellos que huyeron tras enterarse de la noticia se escondieron en refugios, pero la Agencia de Inteligencia ya había localizado sus posiciones. La dirigencia del Cuerpo de Banderas fue alcanzada por disparos durante la resistencia, siendo trasladada al hospital o muriendo en el lugar.\n\nEl mayor enfrentamiento ocurrió en [65.GetCapitalVictoryPointName]. Allí se descubrió a miembros del Cuerpo de Banderas armados con armas introducidas de contrabando desde fuera de la academia. Afortunadamente, gracias a la destacada actuación de la excelente francotiradora Shizuyama Mashiro, los combatientes armados fueron neutralizados.\n\nAnte la represión organizada, algunos ciudadanos alemanes respondieron con protestas. Sin embargo, la mayoría de la gente se sintió aliviada de que esa violencia no se dirigiera hacia ellos y continuó con su vida diaria. Por su parte, la facción Pater justificó sus acciones afirmando que habían derrotado a un gran mal que amenazaba la estabilidad interna de Trinity."
 trinity_events.52.a: "Hazle llegar mis saludos a August Bebel."
 trinity_events.53.t: "La salida del SPD, la entrada de la facción Pater"
 trinity_events.53.desc: ""
 trinity_events.53.a: "Literalmente."
 trinity_events.54.t: "Cierre de sedes partidarias"
 trinity_events.54.desc: "Tras una exhaustiva investigación por parte del Departamento de Justicia y la Agencia de Inteligencia, se identificaron las ubicaciones de las sedes de los partidos alemanes. Los miembros del Departamento de Justicia irrumpieron simultáneamente en cada una de ellas y clausuraron por la fuerza varios partidos alemanes, incluido el Partido Socialdemócrata. En algunas sedes de partidos con posturas extremas se produjeron enfrentamientos menores, pero los miembros del Departamento de Justicia respondieron con firmeza y los sofocaron rápidamente.\n\nCuando la noticia del cierre de las sedes se difundió a través de los periódicos, los simpatizantes de los partidos salieron a las calles. Los manifestantes reaccionaron con dureza contra las medidas del Departamento de Justicia y organizaron concentraciones en varios puntos, elevando la tensión con consignas encendidas en algunas zonas. Se produjeron enfrentamientos entre el Departamento de Justicia y los manifestantes, pero las patrullas civiles intervinieron para respaldar al Departamento de Justicia. Al final, la cooperación entre ambos se centró en dispersar a los manifestantes, y las protestas fueron perdiendo impulso hasta disolverse de manera natural.\n\nLos dirigentes partidarios que habían huido al extranjero emitieron de inmediato comunicados condenando enérgicamente las acciones de Trinity. Sin embargo, sus voces no atrajeron gran atención internacional y su influencia real fue mínima. Incluso dentro de Alemania, las reacciones de los partidos en el exilio pasaron prácticamente desapercibidas."
 trinity_events.54.a: "El orden ha prevalecido."
 trinity_events.55.t: "¿Qué hicieron los partidos alemanes por ustedes?"
 trinity_events.55.desc: "Tras el cierre de los partidos, Trinity inició una campaña masiva de propaganda a través de la radio y otros medios. El Departamento de Justicia y la Oficina de Propaganda comenzaron a transmitir discursos de forma regular en todo Trinity, exponiendo la verdadera naturaleza de los partidos alemanes.\n\nEl mensaje central de los discursos era claro: desde la Gran Guerra hasta el presente, los partidos alemanes no habían actuado ni una sola vez en beneficio del pueblo alemán. Por el contrario, se enfatizaba que habían vendido Alemania a potencias extranjeras para apoderarse del poder y la riqueza, infligiendo solo sufrimiento interminable a la población.\n\nLas transmisiones enumeraban ejemplos concretos. Durante la Gran Guerra, mientras la dirigencia partidaria huía a la retaguardia segura, la gente común derramaba su sangre en tierras lejanas. Incluso tras el fin de la guerra, los partidos se habrían apropiado de los fondos de reconstrucción para llenar sus propios bolsillos. También se acusó a los partidos de prometer esperanza a los alemanes, cuando en realidad solo fomentaron el caos y la división, obstaculizando los esfuerzos de Trinity por lograr la integración.\n\nLos discursos concluyeron con un llamamiento emocional. Se repitió el mensaje de que Trinity no pretendía oprimir a los alemanes, sino liberarlos de verdad. Se propuso dejar atrás el dominio corrupto de los partidos y prosperar juntos bajo un nuevo orden.\n\nEstas transmisiones continuaron día tras día, y poco a poco comenzó a brotar entre algunos alemanes una sensación de escepticismo hacia los partidos. En especial, entre quienes habían vivido directamente los horrores de la guerra, los argumentos de Trinity fueron ganando fuerza."
 trinity_events.55.a: "Aunque ande en valle de sombra de muerte..."
 trinity_events.56.t: "Purgas de la élite nazi"
 trinity_events.56.desc: "Hoy, la Agencia de Inteligencia y el Departamento de Justicia llevaron a cabo una operación conjunta, asaltando universidades e institutos de investigación alemanes para iniciar arrestos a gran escala. Más de mil personas fueron detenidas, y se incautó una enorme cantidad de documentos para la investigación. Esta operación destinada a purgar a la élite nazi se ejecutó de la noche a la mañana y había sido preparada en secreto por Misono Mika. Algunos académicos, que percibieron las señales y huyeron al exilio, lograron escapar, pero no parece que tengan un lugar claro al que ir.\n\nDurante mucho tiempo, las universidades habían estado bajo la misericordia de Trinity, pero inculcaban en los alemanes ideologías contrarias al nazismo y al sistema de Trinity, sembrando un espíritu de resistencia. La Agencia de Inteligencia llevaba tiempo observando estas actividades, y el trabajo subterráneo realizado con la aprobación de Misono Mika asestó hoy el golpe final. Una vez concluyan los juicios por diversos crímenes contra el Estado, quienes eviten el fusilamiento aprenderán a amar a su alma mater a través del trabajo forzado.\n\nLos puestos docentes y administrativos que han quedado vacantes están siendo ocupados por los mejores talentos del Tea Party. Además, se han creado nuevas cátedras en áreas como economía política y cultura folclórica alemana."
 trinity_events.56.a: "Otro bastión del nazismo ha caído."
 trinity_events.57.t: "La primera actividad de la Sisterhood"
 trinity_events.57.desc: "Con la 'cooperación' en marcha, la Sisterhood comenzó a actuar de manera coordinada y disciplinada. El intercambio de información entre el Tea Party y la Sisterhood se ha vuelto más activo. Tras el acuerdo, la Sisterhood se ha distanciado de la política y se centra principalmente en labores misioneras, llevando a cabo actividades de ayuda y evangelización dirigidas a los refugiados, especialmente en el Distrito Central y en el Oeste.\n\nLa Sisterhood goza de cierto apoyo entre los alemanes locales. Aunque no llega ni al 1% de la población alemana, el hecho de contar con respaldo puede considerarse positivo. Sus actividades misioneras también se desarrollan en las ciudades. Principalmente actúan en el Distrito Central de Trinity, en Basis Schola —donde se encuentra la sede de la Orden de Caballeros de Socorro— y en [68.GetName], situado entre ambos. Aunque en números muy reducidos, también se han producido conversiones entre antiguos miembros de las élites sociales, en su mayoría de orientación progresista. Sin embargo, en las zonas rurales la labor misionera avanza con lentitud. En algunos lugares, se rechazó la predicación únicamente por el hecho de que fueran mujeres, quizá debido a las redes cerradas propias del entorno rural.\n\nAlgunas iglesias locales alemanas intentan obstaculizar las actividades misioneras de la Sisterhood, mientras que otras intensifican sus propias labores de ayuda, lo que sugiere que son conscientes de la presencia de la Sisterhood. Aun así, las iglesias de gran escala y el Papa del Vaticano no han tomado ninguna medida, lo que podría indicar que están preparando algo..."
 trinity_events.57.a: "Lo harán bien..."
 trinity_events.58.t: "Conflicto interno de la facción Pater"
 trinity_events.58.desc: "Dentro de la facción Pater conviven diversas corrientes ideológicas, pero a grandes rasgos se enfrentan dos bandos: los 'ideologistas' y los 'cooperativistas'. La brecha entre ambos es profunda. Principalmente, los miembros de línea dura o reaccionarios se autodenominan 'ideologistas' y alzan la voz.\n\nPor otro lado, los 'cooperativistas' muestran una postura relativamente moderada. Están formados por remanentes de las facciones Sanctus y Filius que fueron disueltas durante el intento de usurpación de poder de Misono Mika, así como por algunos miembros de Pater. Aunque su espectro ideológico va desde la izquierda hasta la derecha, comparten un objetivo común, lo que les permite mantener una fuerte cohesión.\n\nEl día en que se celebró una gran asamblea de la facción Pater, Misono Mika apareció en persona. Según información filtrada, pretendía resolver el conflicto entre facciones mediante una negociación directa. Con numerosos ejecutivos presentes, cuando Mika subió al estrado, el ambiente se encendió al instante. Tras calmar el ánimo con una broma ligera, Mika adoptó una expresión seria y entró en materia.\n\n\"Jeje, ¡atención todos~! ¿No están ya un poco cansados de gruñirse entre ustedes dentro de Pater? Trinity intenta unirse, y vernos divididos aquí dentro no queda muy bien, ¿no? De verdad creo que es un problema que debemos resolver con urgencia. Así que yo, verán—\""
 trinity_events.58.a: "Misono Mika apoyó a los ideologistas."
 trinity_events.58.b: "Misono Mika apoyó a los cooperativistas."
 trinity_foreign_policy_events.1.t: "Solicitud de reafirmación de relaciones amistosas por parte de [TRM.GetAdjective]"
 trinity_foreign_policy_events.1.desc: "¡En redacción!"
 trinity_foreign_policy_events.1.a: "Nyaha~ ¡Las relaciones amistosas siempre son buenas~!"
 trinity_foreign_policy_events.2.t: "Reafirmación de relaciones amistosas por parte de [HYA.GetAdjective]"
 trinity_foreign_policy_events.2.desc: "¡En redacción!"
 trinity_foreign_policy_events.2.a: "¡La paz es lo mejor!"
 trinity_foreign_policy_events.3.t: "Propuesta de cooperación económica de [TRM.GetAdjective]"
 trinity_foreign_policy_events.3.desc: "¡En redacción!"
 trinity_foreign_policy_events.3.a: "Suena bien, ¡nyahat!"
 trinity_foreign_policy_events.3.b: "Pero bueno~ ya sabes~ también tenemos asuntos internos~"
 trinity_foreign_policy_events.4.t: "Rechazo de la propuesta de [HYA.GetAdjective]"
 trinity_foreign_policy_events.4.desc: "Es una noticia lamentable, pero la parte de [HYA.GetLeader] de [HYA.GetNameDef] ha rechazado nuestra propuesta. No se ha dado una razón clara, aunque se especula que múltiples factores complejos, como los recientes grandes acontecimientos y los cambios políticos en Trinity, han influido en la decisión."
 trinity_foreign_policy_events.4.a: "\"No es exactamente como lo imaginaba, pero...\""
 trinity_social_ploblem_events.1.t: "Prohibido para los habitantes de Kivotos"
 trinity_social_ploblem_events.1.desc: "Incluso en una apacible tarde, la sombra de la discriminación sigue sin desaparecer de las calles del Distrito Central de Trinity. Muchos comercios exhiben carteles en alemán que dicen 'Prohibido para los habitantes de Kivotos', y debajo se puede ver el mismo mensaje escrito torpemente en el idioma de Kivotos.\n\nEs natural que los estudiantes de Trinity no vean esta situación con buenos ojos. En especial, algunos estudiantes más agresivos llegan a imponer sanciones privadas contra los comercios discriminatorios. Gracias a la rápida intervención del Departamento de Justicia, los daños han sido contenidos en cierta medida."
 trinity_social_ploblem_events.1.a: "Qué problema..."
 trinity_social_ploblem_events.2.t: "Huelga de trabajadores"
 trinity_social_ploblem_events.2.desc: "Las fábricas de Trinity avanzan gradualmente hacia la automatización, pero en las regiones donde la 'trinitización' aún no se ha completado, los trabajadores siguen desempeñando sus labores. En particular, en diversos sectores, los trabajadores alemanes se utilizan como mano de obra valiosa.\n\nAun así, existe un problema: la presencia de los sindicatos. El Frente Alemán del Trabajo, que fue un sindicato títere bajo el NSDAP en las antiguas regiones alemanas, mantiene una cohesión organizada en torno a Robert Ley, y está llevando a cabo huelgas y protestas violentas en las fábricas de Trinity. Su objetivo principal es el derrocamiento del gobierno de Trinity, y estas huelgas abiertamente políticas se están extendiendo hasta el punto de que, en algunas ciudades, las autoridades locales informan de dificultades para mantener el orden."
 trinity_social_ploblem_events.2.a: "Moviliza a más miembros del Departamento de Justicia."
 trinity_social_ploblem_events.2.b: "Negociemos con los trabajadores."
 trinity_social_ploblem_events.2.c: "Que hagan lo que quieran."
 trinity_social_ploblem_events.3.t: "Atentado con bomba contra edificios públicos"
 trinity_social_ploblem_events.3.desc: "En un giro impactante de los acontecimientos, se produjo una explosión provocada por una bomba artesanal en un edificio público. Decenas de personas resultaron gravemente heridas y fueron trasladadas de urgencia a hospitales cercanos en vehículos de la Orden de Caballeros de Socorro. La potencia de la explosión fue considerable, destrozando más de diez grandes ventanales y causando graves daños a los edificios circundantes.\n\nAfortunadamente, en ese momento la zona se encontraba en obras de mantenimiento y el acceso de estudiantes y residentes estaba restringido, por lo que no se produjeron víctimas mortales directas. Sin embargo, el incidente puso de manifiesto la inestabilidad interna de Trinity y las grietas en la seguridad. En la actualidad, la Agencia de Inteligencia de la Academia y el Departamento de Justicia están rastreando a las fuerzas que se encuentran detrás del atentado."
 trinity_social_ploblem_events.3.a: "\"Perdonar a los terroristas es cosa de Dios, enviarlos ante Dios es cosa mía.\""
 trinity_social_ploblem_events.4.t: "\"Volksempfänger\""
 trinity_social_ploblem_events.4.desc: "El Volksempfänger fue un radio de válvulas de bajo costo producido por la Alemania nazi, diseñado para que el público pudiera adquirirlo fácilmente. Fue el resultado del reconocimiento del gobierno nazi de la importancia de la radio como herramienta de propaganda y de su impulso por distribuirla a nivel nacional. Como consecuencia, llegó a difundirse de forma tan amplia que uno de cada dos ciudadanos alemanes poseía un receptor.\n\nRecientemente, las transmisiones de radio han vuelto a aparecer. Detrás de ello se encuentra el hecho de que milicias que se oponen a Trinity han tomado el control de estaciones de radiodifusión y están transmitiendo mensajes antitrinity al público alemán. Estas emisiones incluso se están propagando entre algunos estudiantes de Trinity, y su influencia continúa expandiéndose."
 trinity_social_ploblem_events.4.a: "Hay que detener de inmediato estas transmisiones."
 trinity_social_ploblem_events.5.t: "El problema de la resistencia Werwolf (Hombre Lobo)"
 trinity_social_ploblem_events.5.desc: "Uno de los legados de la Alemania nazi, el problema de las milicias, está saliendo rápidamente a la luz. En particular, antiguos miembros de las Juventudes Hitlerianas lideran la inculcación de ideologías antitrinity entre los jóvenes alemanes. El individuo que los encabeza es Hans-Adolf Fritzmann, quien fue nombrado inspector especial de defensa por el fallecido Heinrich Himmler para llevar a cabo operaciones. Además, existe información de que está en contacto con pequeños gobiernos regionales remanentes. Ante esta situación, se requiere una intervención rápida."
 trinity_social_ploblem_events.5.a: "Envía al Departamento de Justicia para eliminarlos."
 trinity_social_ploblem_events.5.b: "No tenemos margen para eso."
 trinity_social_ploblem_events.6.t: "Símbolos de Trinity vandalizados"
 trinity_social_ploblem_events.6.desc: "Ayer, a primera hora de la mañana, se produjo un incidente en el que un símbolo de Trinity fue vandalizado en una pequeña plaza situada en las afueras del Distrito Central. Aunque se trataba de una plaza de tamaño reducido, era una zona con un alto tránsito de personas, por lo que este incidente da la impresión de que la autoridad del Tea Party ha sido socavada. Las fotografías del lugar se difundieron rápidamente a través de redes sociales y otros medios, y parecen formar parte de las actividades de resistencia que se han intensificado recientemente."
 trinity_social_ploblem_events.6.a: "No es bueno..."
 trinity_social_ploblem_events.7.t: "Actividades del Cuerpo de Banderas Negro-Rojo-Oro"
 trinity_social_ploblem_events.7.desc: "El Cuerpo de Banderas Negro-Rojo-Oro es relativamente moderado, pero no coopera con nosotros. Principalmente operan en la región de [65.GetName] y en el Distrito Central, distribuyendo panfletos con consignas que incitan a resistir a Trinity y avivando el espíritu de oposición."
 trinity_social_ploblem_events.7.a: "Son malas noticias."
 trinity_social_ploblem_events.8.t: "Directores en resistencia"
 trinity_social_ploblem_events.8.desc: "Distrito Central de Trinity, Edén. En sus alrededores, desde un lugar llamado Berlín donde aún permanecen vestigios de Alemania, fluye música. Es una interpretación de una orquesta dirigida por Wilhelm Furtwängler. Varios directores, cada uno con un espíritu de resistencia distinto, se turnan para dirigir la orquesta. Por respeto a los artistas, el Departamento de Justicia y el Tea Party tratan a los músicos con cierta laxitud, pero estas interpretaciones están permitiendo a los alemanes mantener su identidad y se están convirtiendo en un refugio espiritual."
 trinity_social_ploblem_events.8.a: "Produce resonancia..."
 trinity_social_ploblem_events.9.t: "Intento de asesinato"
 trinity_social_ploblem_events.9.desc: "Hoy se produjo un intento de asesinato dirigido contra un alto cargo de Trinity. Afortunadamente, la víctima esquivó la bala y, con fuego de respuesta inmediato, logró someter al atacante. La investigación reveló que el asesino pertenecía a una organización de resistencia alemana, y el cadáver fue entregado a la familia."
 trinity_social_ploblem_events.9.a: "La capacidad de combate de una sola estudiante equivale a la de dos soldados de fuerzas especiales."
 trinity_social_ploblem_events.10.t: "La Orquesta Roja"
 trinity_social_ploblem_events.10.desc: "En sentido estricto, la Orquesta Roja es un nombre acuñado por la Agencia de Inteligencia de Trinity. Más que una organización única, es un término que engloba a varios grupos independientes de espionaje antitrinity y sus redes de contacto. Muchos de ellos operan en Edén, el corazón de Trinity. En particular, incluyen a antiguos activistas de izquierda y funcionarios gubernamentales que habían trabajado en el antiguo Estado alemán. Su principal medio de intercambio de información son las comunicaciones inalámbricas cifradas.\n\nEstos grupos se dedican principalmente a producir panfletos antitrinity y a despertar el espíritu de resistencia entre los ciudadanos. La Agencia de Inteligencia de Trinity sospecha que una editorial específica está produciendo estos panfletos, y se espera que pronto se revele la verdadera naturaleza de la Orquesta Roja."
 trinity_social_ploblem_events.10.a: "¡Rastreenlos!"
 trinity_social_ploblem_events.11.t: "El problema del sabotaje obrero"
 trinity_social_ploblem_events.11.desc: "Las regiones de Sajonia y Silesia son importantes centros de la industria de Trinity y están bajo la jurisdicción del Tea Party para fomentar la industria de la academia. Sin embargo, el sabotaje por parte de los trabajadores se ha convertido en un problema grave en las ciudades industriales. En particular, los trabajadores destruyen maquinaria, armamento y bienes civiles dentro de las fábricas, presentan demandas de negociación irreales y distribuyen material impreso ilegal, manteniendo así la resistencia.\n\nLa investigación revela que no existe una sola organización que lidere estos actos de sabotaje. En su lugar, pequeños grupos patrióticos actúan de forma independiente, resistiendo junto a sus compañeros."
 trinity_social_ploblem_events.11.a: "Que se las arreglen solos."
 trinity_social_ploblem_events.11.b: "Bien, aumentemos sus salarios. Así se calmarán."
 trinity_social_ploblem_events.12.t: "Juventudes Hitlerianas"
 trinity_social_ploblem_events.12.desc: "Las Juventudes Hitlerianas eran una organización oficial gestionada por el Partido Nazi. Tras la rendición de Alemania, la mayoría de los jóvenes regresaron a sus hogares. Sin embargo, algunos no tenían a dónde volver o permanecieron en la organización debido a su hostilidad hacia Trinity. Estos individuos resisten a Trinity e incitan a los alemanes locales. Se centran especialmente en el sabotaje y cometen delitos contra los residentes locales que cooperan con Trinity, provocando disturbios. La organización recientemente arrestada poseía grandes cantidades de explosivos difíciles de conseguir. Gracias a los esfuerzos del Departamento de Justicia, todos los explosivos fueron confiscados."
 trinity_social_ploblem_events.12.a: "Es desagradable."
 TRMDIP.50.t: "[TRM.GetAdjective] ha comenzado a fortificar la frontera"
 TRMDIP.50.d: "Esta mañana, la guardia fronteriza polaca detectó movimientos sospechosos en la zona limítrofe. Se confirmó que un gran número de foráneos de otro mundo, provistos de alas, se desplazaban transportando materiales a gran escala, y que algunos de ellos intentaron bloquear el punto de conexión ferroviaria germano-polaca. Por suerte, un individuo que parecía ser un superior dentro del grupo intervino para detenerlo, y el ferrocarril fue protegido sin incidentes.\n\nLas obras de fortificación que avanzan actualmente a lo largo de la frontera parecen basarse, claramente, en una paranoia según la cual nosotros estaríamos preparando una invasión. El Ministerio de Asuntos Exteriores expresa su preocupación y planea protestar enérgicamente por las vías diplomáticas disponibles."
 TRMDIP.50.a: "Protestemos por la vía diplomática."
 TRMDIP.50.b: "No hagamos de esto un problema."

 TRMDIP.51.t: "Protesta diplomática de [POL.GetAdjective]"
 TRMDIP.51.d: "Ha llegado una nota diplomática del Ministerio de Asuntos Exteriores de Polonia. El contenido es conciso: expresa la preocupación y la protesta del país por la reciente ampliación de instalaciones defensivas en la zona de la frontera Polonia–Trinity. Se considera que esta reacción proviene de que la parte polaca ha malinterpretado las medidas defensivas de Trinity como preparativos para una invasión. Sin embargo, en la carta no aparece ningún ultimátum ni expresión amenazante de ningún tipo."
 TRMDIP.51.a: "Esta amenaza no nos supone ningún problema."

 TRMDIP.52.t: "¡[TRM.GetAdjective] exige las zonas petrolíferas!"
 TRMDIP.52.d: "Esta tarde, [TRM.GetName] nos envió un ultimátum. Su contenido era que, en un plazo de 72 horas, debemos ceder a [TRM.GetAdjective] los derechos de explotación sobre las zonas petrolíferas dentro de Rumanía. Además, exigieron nuestra incorporación a la esfera de influencia de [TRM.GetAdjective] y la aceptación de varias condiciones económicas. La nota también advertía que, si se excede el plazo o se rechazan las exigencias, no se podrá evitar una guerra total.\n\nHemos estado obteniendo beneficios económicos considerables de esas zonas petrolíferas, y si las perdemos, el golpe a la economía será inevitable. Por supuesto, [TRM.GetAdjective] es una potencia emergente en rápido ascenso y está mostrando una clara línea expansionista. Aun así, si entregar las zonas petrolíferas nos permite obtener paz, quizá ese trato no sea necesariamente una mala opción..."
 TRMDIP.52.a: "Es desagradable, pero debemos aceptar sus exigencias..."
 TRMDIP.52.b: "¡Preferimos morir en el pantano de la Gran Rumanía antes que vivir en el paraíso de la Pequeña Rumanía!"

 TRMDIP.53.t: "[ROM.GetNameDef] ha aceptado nuestras exigencias"
 TRMDIP.53.d: "¡Buenas noticias! La parte de [ROM.GetAdjective] ha aceptado nuestras exigencias y nos ha cedido los derechos de explotación de recursos dentro de Rumanía. Además, expresó que aceptará gradualmente nuestras demás condiciones, y se unió de inmediato a [TRM.getFactionName]. Esta es una clara victoria diplomática de Trinity."
 TRMDIP.53.a: "¡Bienvenidos!"

 TRMDIP.54.t: "[ROM.GetNameDef] ha rechazado nuestras exigencias"
 TRMDIP.54.d: "Como todos esperaban, [ROM.GetAdjective] rechazó nuestras exigencias y proclamó la movilización. Ahora es momento de poner a prueba cuál será su destino."
 TRMDIP.54.a: "¡Guerra total!"

 TRMDIP.60.t: "¿Una alianza temporal con Trinity?"
 TRMDIP.60.d: "Misono Mika, Host de [TRM.GetLeader], reconoce que la Agencia de detectives 68 de Luxemburgo tiene un carácter anti-Gehenna, y que persigue el objetivo de derrocar al gobierno de Gehenna para instaurar encima un nuevo orden. Para lograr su meta, han propuesto cooperar con Trinity, ofreciendo una alianza militar temporal bajo la condición de 'hasta destruir a Gehenna'.\n\nDividir el frente enemigo en dos es, sin duda, una propuesta atractiva. Y el hecho de que esta alianza vaya a ser temporal también es algo satisfactorio para la Agencia. Pero, al final, el derecho a tomar la decisión definitiva pertenece a [HEU.GetLeader]."
 TRMDIP.60.a: "Bien, despleguemos un frente común."
 TRMDIP.60.b: "Desde hace mucho, ella no me cae bien."

 TRMDIP.61.t: "Luxemburgo aceptó el frente común."
 TRMDIP.61.d: "La parte de [FROM.GetAdjective] ha aceptado nuestra propuesta de alianza temporal. Cuando nosotros o Luxemburgo ataquemos a Gehenna, formaremos una alianza militar temporal. Será una alianza temporal, pero sin duda será de gran ayuda."
 TRMDIP.61.a: "Son buenas noticias."

 TRMDIP.62.t: "Luxemburgo rechazó el frente común."
 TRMDIP.62.d: "Era una propuesta lógica, pero Luxemburgo la rechazó. Sin su ayuda, vencer a Gehenna sigue siendo posible, pero será relativamente más difícil."
 TRMDIP.62.a: "...¿Por qué?"

 TRMDIP.63.t: "La Radio de la Libertad de [ROOT.GetName]"
 TRMDIP.63.d: "Los colaboradores están usando la poderosa emisora de radio de Trinity para difundir propaganda y mentiras contra [TRM.GetNameDef]. Escuchar estas transmisiones está terminantemente prohibido, y cualquiera puede ser acusado de traición. Sin embargo, en la práctica, especialmente en las zonas rurales, es difícil hacer cumplir la prohibición. Una figura particularmente influyente dentro de Radio Liberty es Franz Langoth."
 TRMDIP.63.b: "Ningún colaborador de Trinity será perdonado."

 TRMDIP.64.t: "¿Cooperación económica con [TRM.GetAdjective]?"
 TRMDIP.64.d: "Hoy llegó a [ROOT.Capital.GetCapitalVictoryPointName] un documento diplomático: un acuerdo sencillo sobre cooperación económica entre ambas academias, propuesto por [TRM.GetAdjective].\n\nLas relaciones amistosas entre ambas partes se han mantenido de manera constante incluso después del Incidente, y esta propuesta parece estar en esa misma línea. Sin embargo, el reciente cambio de gobierno en Trinity y la cadena de acontecimientos políticos han radicalizado rápidamente a esa academia, por lo que existen aspectos que invitan a la cautela para considerarlo una simple cooperación económica.\n\nA corto plazo podría beneficiarnos, pero dentro del Yin-Yang Bureau se ha planteado la preocupación de que, a largo plazo, esto pueda derivar en una dependencia económica."
 TRMDIP.64.a: "Oh~ ¿Parece una propuesta bastante buena~?"
 TRMDIP.64.c: "Pero bueno~ como que~ también tenemos asuntos internos~"
 TRM_eng_event_chain_tt: "Ya no ocurrirán §Yeventos encadenados§! con §Y[TRM.GetNameWithFlag]§!."

 TRMDIP.65.t: "[HYA.GetNameDef] ha rechazado cooperar con nosotros"
 TRMDIP.65.d: "Recientemente llegó una nota diplomática de [HYA.GetNameDef]. Su contenido era que, debido a la radicalización de Trinity y a las crisis políticas y conflictos diplomáticos consecutivos, reconsiderarán la relación de cooperación entre ambas academias. Sin embargo, dejaron claro que esto se limita a la cooperación política y que los intercambios entre estudiantes se mantendrán igual que antes. Este retroceso diplomático mostró con claridad que la capacidad diplomática de Trinity se ha debilitado de forma notable en comparación con el pasado..."
 TRMDIP.65.a: "¡¿De verdad, qué les pasa!?"
 TRN_no_longer_TRN_support_HYA_decision: "[HYA.GetNameDef] rechazó la cooperación."

 TRMDIP.66.t: "[HYA.GetNameDef] acepta la cooperación económica"
 TRMDIP.66.d: "Buenas noticias. La parte de [HYA.GetLeader] de [HYA.GetNameDef] ha apoyado la cooperación económica entre ambas academias. En particular, este tratado, firmado sobre la base de la confianza y la amistad, fue redactado para ser lo más beneficioso posible para ambas partes. Tras la firma, el primer cargamento comenzó a dirigirse hacia Hyakkiyako, lo cual sin duda es una buena noticia."
 TRMDIP.66.a: "¡Yaho~ £GFX_BA_star"

 TRMDIP.67.t: "[TRM.GetNameDef] propone entrenamiento conjunto"
 TRMDIP.67.d: "La parte de [TRM.GetLeader], Host de Trinity, ha propuesto un entrenamiento conjunto. Este ejercicio busca mejorar aún más la capacidad de respuesta de Hyakkaryouran y del Departamento de Justicia ante las amenazas crecientes de los últimos días. Se realizará a una escala mayor que los entrenamientos habituales e incluirá pruebas de armamento moderno."
 TRMDIP.67.a: "Ah~ Es una buena propuesta~"
 TRMDIP_67_NAME: "Entrenamiento conjunto Trinity–Hyakkiyako"

 TRMDIP.68.t: "Aceptación de [HYA.GetNameDef]"
 TRMDIP.68.d: "Como parte del fortalecimiento de la cooperación con [HYA.GetNameDef], se propuso celebrar un entrenamiento conjunto en [74.GetName], y [HYA.GetNameDef] lo aceptó con gusto. Nuestros comandantes podrán aprender las características y el terreno de [74.GetName], y al dominar nuevas tácticas, desarrollarán aún más sus capacidades tácticas."
 TRMDIP.68.a: "¡Fue un buen entrenamiento!"

 TRMDIP.69.t: "[TRM.GetNameDef] propone una alianza"
 TRMDIP.69.d: "Con base en el rápido desarrollo de las relaciones con [TRM.GetAdjective], nos han propuesto unirnos al Pacto de Edén, una alianza militar. Si lo aceptamos, [HYA.GetAdjective] será tratado como un miembro en igualdad de condiciones, y nacerá una alianza militar sin precedentes en un momento histórico."

 TRMDIP.70.t: "[HYA.GetNameDef] aceptó la alianza"
 TRMDIP.70.d: ""

 TRMDIP.71.t: "Autoridad de [GEM.GetLeader] menospreciada"
 TRMDIP.71.d: "A última hora de la tarde, un video que muestra a varios alemanes vandalizando propaganda de [GEM.GetLeader] y dejando, junto a ella, grafitis insultantes y pintadas alabando a Trinity se está difundiendo rápidamente en redes sociales. El video ha generado una gran repercusión entre la población. En estos momentos, los sospechosos están siendo arrestados con rapidez y se espera que todos sean capturados pronto. Sin embargo, bloquear por completo los videos que ya se han propagado por internet parece, en la práctica, casi imposible.\n\nEn particular, debido a que los sospechosos realizaron declaraciones elogiando a Trinity, algunos sectores han planteado la sospecha de que Trinity podría estar detrás del incidente. Pero aún cabe la posibilidad de que se trate simplemente de actos individuales de personas que admiran e imitan a Trinity."
 TRMDIP.71.a: "¡¿Quién hizo esto!?"

 TRMDIP.72.t: "¡Sanciones comerciales de Trinity!"
 TRMDIP.72.d: "La marcha sobre Burgenland de 1935 terminó en desastre. La ofensiva de Shanhaijing fue contundente, y nuestro ejército acabó derrotado. Así, el sueño de la Gran Hungría se frustró y recibimos sanciones económicas de Rumanía y Yugoslavia. Si algo fue un consuelo, fue que el inicio del comercio con [TRM.GetAdjective] ayudó a llenar en cierta medida el vacío que dejó Alemania. Sin embargo, con el reciente cambio en la línea diplomática de Trinity, se han impuesto sanciones económicas a nuestra patria húngara. Los expertos advierten que Hungría dependía en gran medida del comercio con Trinity, por lo que esta medida podría asestar un golpe severo a la economía nacional."
 TRMDIP.72.a: "Es una tragedia."

 trinity_flavor_events.5.t: "El nuevo plan de negocios de Trinity"
 trinity_flavor_events.5.desc: "Hoy se celebró en Edén una presentación de nuevos negocios de Trinity. Era un lugar valioso en el que se reunían en un mismo sitio los empresarios más famosos de Trinity. Mientras los asistentes socializaban y se mezclaban cordialmente, el presentador dio unos golpecitos al micrófono y abrió la boca.\n\"Antes que nada, agradecemos a todos los presidentes por asistir a la presentación de hoy. Haber obtenido esta valiosa oportunidad equivale a haber sido elegidos. Omitiré la larga explicación e iré directo al punto. El ítem de negocio que hoy les presentaré con total confianza es nada menos que la 'Batería de Cachemira Eco Pride'. ¡No es una batería cualquiera! Si hablamos de esta batería…\"\n\n\nPero unos minutos después, el evento terminó de forma anticipada cuando el Departamento de Justicia, que acudió tras recibir una denuncia por una presentación ilegal, irrumpió en el lugar y arrestó a los involucrados."
 trinity_flavor_events.5.a: "¿Eco… qué…?"
 trinity_flavor_events.6.t: "El incidente del ferry de Stettin"
 trinity_flavor_events.6.desc: "En plena noche, cuando Stettin debería estar en calma, ocurrió un grave incidente. El ferry de Stettin, donde como de costumbre se celebraban banquetes, el juego legal florecía y se movían cientos de millones, estaba abarrotado de gente. En aquel instante de bullicio pacífico, donde unos perdían y otros ganaban, un disparo repentino sacudió el barco.\n\nCon el estruendo del disparo, aparecieron unos seis asaltantes armados y enmascarados. Apuntando con sus armas a los pasajeros, gritaron con una voz serena pero firme:\n\"Señoras y señores, vamos a robar un poco. Si se quedan quietos, nadie saldrá herido.\"\n\nLos pasajeros, aterrados, se encogieron de miedo y los asaltantes comenzaron a recoger dinero y objetos de valor según lo planeado. Mientras tanto, los guardias del ferry comprendieron la situación y se plantaron para enfrentarlos. Pero los asaltantes ya contaban con una ruta de escape meticulosamente preparada y, con el botín en mano, intentaron escapar en medio del caos.\n\nEn ese momento, el Departamento de Justicia irrumpió en el lugar. Se produjo un breve tiroteo, y en el intercambio dos de los asaltantes recibieron heridas de bala; aun así, lograron huir junto con el resto. El Departamento de Justicia no consiguió capturarlos, y el caso quedó sin resolver."
 trinity_flavor_events.6.a: "¿Forajidos en el siglo XX?"
 trinity_flavor_events.7.t: "Un paseo por un bonito pueblo"
 trinity_flavor_events.7.desc: "En el campo del norte de Königsberg, hoy Kimigayama, existían dos familias que albergaban un profundo rencor mutuo. Aunque ambas habían continuado su enfrentamiento a través de una larga rivalidad y conflictos, una banda de forajidos que surgió como un cometa comenzó a aprovechar esa tensión de manera astuta. Los forajidos se hicieron pasar por policías, engañaron a ambas familias e intentaron convertir su antagonismo en una herramienta para obtener beneficios económicos.\n\nSin embargo, a ninguna de las dos familias les agradaba la presencia de aquella banda y, al final, una de ellas decidió eliminarla primero. La familia, tras elaborar un plan minucioso, desplegó gente para atraer a los forajidos a una trampa. Los forajidos, sin saberlo, se mostraron, y en el instante en que la tensión se apoderó del lugar, uno de los policías de la familia apretó el gatillo y comenzó el combate.\n\nEl tiroteo fue feroz y se desarrolló con rapidez. Los forajidos resistieron con una potencia de fuego abrumadora y lograron abatir a todos los policías del lado de la familia, pero estos tampoco cayeron completamente indefensos: durante el enfrentamiento, consiguieron matar a uno de los forajidos, y la operación terminó al presionar a la banda para que abandonara la zona.\n\nCuando el Departamento de Justicia llegó, los forajidos ya hacía tiempo que habían dejado la ciudad."
 trinity_flavor_events.7.a: "Hay que reconocer que su puntería es buena."
 trinity_flavor_events.8.t: "Las peleas de familias, ayer y hoy"
 trinity_flavor_events.8.desc: "Los cadáveres desparramados ya habían perdido la vida hace mucho tiempo por disparos. Lo único que quedaba allí era ruina y una crueldad impactante.\n\nSolo los forajidos sabrán el origen de este espantoso incidente. No se sabe si fue una venganza por lo ocurrido en la ciudad de Trinity o si se debió a motivos completamente distintos, pero lo cierto es que asesinaron y quemaron a las víctimas con una brutalidad superior a cualquier otro crimen. Literalmente destruyeron a una familia y desplegaron una despiadada tragedia de venganza.\n\nHasta ahora, no se ha confirmado ni un solo superviviente entre los miembros de la familia. Si esta tragedia es real, significa que la banda de forajidos, consumida por el rencor, adoptó un curso tan extremo como para exterminar a toda una estirpe.\n\nLa situación solo se estabilizó bastante tiempo después, cuando el Departamento de Justicia finalmente se desplegó. Todos los cuerpos fueron recuperados."
 trinity_flavor_events.8.a: "Así que van a ponerse así de incivilizados."
 trinity_flavor_events.9.t: "Lo más propio de nosotros"
 trinity_flavor_events.9.desc: "Ha llegado una noticia que dejó a muchísima gente en shock: un audaz asalto ocurrido en la segunda ciudad de Trinity, Basis Schola. La infame banda de forajidos que no dejaba de causar problemas en la sociedad de Trinity, esta vez atacó un tren que transportaba el sueldo de los soldados.\n\nEl tren fue emboscado mientras pasaba por Basis Schola. Al enterarse, la policía de Basis Schola y el Departamento de Justicia acudieron de inmediato, pero acabaron fracasando en la persecución. Se estima que los alguaciles a bordo murieron todos bajo la abrumadora potencia de fuego de la banda; si se suman las bajas ocurridas durante la persecución, el número de víctimas podría aumentar a más del doble.\n\nAprovechando el momento en que el tren se detuvo, la banda subió con rapidez y lo secuestró. Después, usando ametralladoras, lograron sacudirse a la policía y al Departamento de Justicia que los perseguían. Cuando el tren volvió a detenerse, la banda ya había huido y el sueldo de los soldados había desaparecido sin dejar rastro.\n\nCuando la noticia se transmitió como última hora, la ciudadanía quedó profundamente conmocionada. Algunos incluso se entusiasmaron con la osadía de la banda, pero la mayoría lamentó el hecho y expresó su indignación. Lo único seguro es que, por más atención que reciban estos crímenes audaces, su final nunca será tranquilo."
 trinity_flavor_events.9.a: "Sangre,"
 trinity_flavor_events.10.t: "Sangre, muerte, salvación"
 trinity_flavor_events.10.desc: "Gracias a los persistentes esfuerzos del Departamento de Justicia, logramos localizar el escondite de la banda. Sin embargo, la escena que encontramos allí fue inesperada: dentro del grupo se percibían claros signos de una grave división, y cuando llegamos ya se estaban apuntando entre sí con armas.\n\nAl agravarse la situación, el Departamento de Justicia inició de inmediato una operación de eliminación. La banda se desmoronó en un instante y, dividida en dos facciones, empezó a huir en medio del caos.\n\nMientras la persecución continuaba, una de las principales facciones, la de los 'Ejecutores', encontró su final a causa de la fractura interna. Huyeron a un risco rocoso cercano para intentar su última resistencia, pero dentro del grupo surgió una traición. Un miembro se rebeló contra el Ejecutor y, tras una violenta pelea cuerpo a cuerpo, el traidor lo redujo y finalmente lo empujó a la muerte. Los miembros restantes perdieron toda voluntad de resistir, se rindieron y fueron arrestados por el Departamento de Justicia.\n\nLa otra facción aún sigue prófuga, pero es poco probable que logre escapar del cerco. Ellos tampoco podrán evitar su destino: tarde o temprano serán capturados o abatidos tras resistirse..."
 trinity_flavor_events.10.a: "Muerte,"
 trinity_flavor_events.11.t: "El ciclo de la vida"
 trinity_flavor_events.11.desc: "A pesar de los persistentes esfuerzos del Departamento de Justicia, algunos miembros lograron romper el cerco y huir. Sin embargo, tras deliberación interna, el Departamento concluyó que los remanentes ya no representaban una amenaza grave para la sociedad y, al retirarlos oficialmente de la lista de buscados, suspendió la persecución oficial.\n\nSi miramos el final de la banda, al final no eran más que un grupo de idealistas que ansiaban libertad. La banda, formada persiguiendo su propio ideal, vio ese ideal hecho pedazos al chocar con la realidad. La transacción con la realidad trajo división y corrupción, y lo que quedó fue muerte, sueños derrumbados y, para unos pocos, la oportunidad de la salvación.\n\nSu nombre llegó a ser conocido por muchísimas personas y se mencionó en todo Trinity. Pero esa fama no durará: no será más que un registro, una página entre tantas de la historia.\n\nLos pasos posteriores de los miembros no fueron investigados ni rastreados en detalle. Aun así, con el tiempo, algunos formarán una familia y vivirán en silencio, y el resto terminará pagando por sus pecados mediante la muerte."
 trinity_flavor_events.11.a: "Salvación."
 trinity_flavor_events.12.t: "La teoría conspirativa de Yurizono Seia"
 trinity_flavor_events.12.desc: "Hoy ha surgido en Trinity una teoría conspirativa que ha provocado una gran controversia. Su núcleo es que, en realidad, Yurizono Seia no murió y que la Orden Hospitalaria se confabuló para encubrir el incidente.\n\nHace un año, uno de los hechos que se convirtió en un detonante decisivo para que Misono Mika tomara el poder en Trinity fue el atentado de asesinato contra Yurizono Seia. En aquel entonces, el caso sacudió a la sociedad de Trinity. Posteriormente, Seia fue recuperada por la Orden Hospitalaria, y dicha Orden anunció que ella había fallecido antes de recibir tratamiento, confirmando oficialmente su muerte.\n\nNo obstante, según esta teoría conspirativa, habría existido algún tipo de trato entre la comandante de la Orden Hospitalaria, Aomori Mine, y Yurizono Seia, y como parte de ese trato se habría anunciado falsamente la noticia de su muerte. La verdad del trato y el trasfondo del anuncio parecen ser cosas que solo Aomori Mine y Yurizono Seia conocerían.\n\nLa Orden Hospitalaria negó con firmeza esta teoría y refutó el contenido por completo, pero la polémica no muestra señales de apagarse fácilmente."
 trinity_flavor_events.12.a: "Seia-chan... incluso ahora, está bien..."
 trinity_flavor_events.13.t: "'Nazismo'"
 trinity_flavor_events.13.desc: "Entre los intelectuales de Edén se están llevando a cabo activamente estudios sobre el nazismo y el Partido Nacionalsocialista Obrero Alemán (NSDAP). Antes de que Trinity gobernara el este de Alemania, estos fueron la ideología y el partido que gobernaron Alemania, y llegaron a controlar el poder entre 1933 y 1935.\n\n¿Cuál fue la ideología principal del nazismo? Aspiraban a un Estado totalitario autoritario y, amparándose en la 'Ley Habilitante' aprobada en 1933, reprimieron a otros partidos y construyeron un sistema de dictadura de partido único. Además, sobre la base del antisemitismo, discriminaron y persiguieron a determinados grupos, entre ellos los 'judíos'; y, enarbolando el nacionalismo alemán, enfatizaron la superioridad del pueblo alemán y defendieron un objetivo anómalo: asegurar un 'espacio vital' para los alemanes.\n\nEn lo económico, impulsaron la recuperación mediante grandes obras públicas y también se esforzaron en reconstruir la Wehrmacht. Muchos investigadores sostienen que \"si no hubiera existido el Incidente de la Gran Trasposición, el Estado alemán habría terminado librando una guerra\", y esta es una postura ampliamente aceptada en el mundo académico.\n\nSu proceso de toma del poder fue como una bestia que detecta la debilidad de su presa y la explota. Como resultado, obtuvieron poder absoluto mediante la Ley Habilitante y lograron ganarse el apoyo de la población alemana mediante obras públicas para la recuperación económica.\n\nQuizá podamos aprender algo de ellos."
 trinity_flavor_events.13.a: "Se me acaba de ocurrir una inspiración."
 trinity_flavor_events.14.t: "¿El paradero del Presidente del Consejo Estudiantil General?"
 trinity_flavor_events.14.desc: "Mediante un anuncio oficial del Consejo Estudiantil General, se confirmó que su Presidenta se encuentra actualmente desaparecida. Fue el instante en que numerosas conjeturas y teorías conspirativas, que habían circulado bajo la superficie, se volvieron realidad; y es sumamente inusual que el Consejo Estudiantil General lo reconozca de forma oficial.\n\nTras anunciarse la desaparición, el Consejo organizó de inmediato un equipo de investigación compuesto por numerosos agentes especializados, y está rastreando su paradero a la vez que moviliza toda su red de inteligencia a lo largo de Kivotos para analizar las circunstancias del momento de su desaparición. Sin embargo, sus movimientos permanecen completamente velados, y se barajan con cautela múltiples posibilidades: desde intervención externa hasta traición interna.\n\nLa Presidenta del Consejo Estudiantil General es una figura clave que simboliza el orden y el equilibrio de Kivotos, y el único ser que posee la legitimidad para mediar los conflictos entre academias. Su ausencia no es simplemente la desaparición de una persona: representa un vacío político en todo Kivotos y puede sacudir incluso el equilibrio de poder entre academias, funcionando como una crisis grave.\n\nYa se detectan movimientos en algunas academias que intentan aprovechar el caos para expandir su influencia o buscar una línea independiente, y estas señales también implican la posibilidad de que deriven en divisiones y choques en toda Kivotos.\n\nLas principales academias, incluida Trinity, están observando la situación, y Trinity se encuentra ante una encrucijada crucial en la que incluso la autoridad y la propia continuidad del Consejo Estudiantil General podrían tambalearse. Kivotos, que ha perdido a su líder, se ve ahora obligada a elegir en medio de un torbellino de confusión."
 trinity_flavor_events.14.a: "Es una noticia impactante."
 trinity_flavor_events.15.t: "Compañeros de camino"
 trinity_flavor_events.15.desc: "La usurpación del poder por Misono Mika y la facción Pater, iniciada a partir del atentado contra Yurizono Seia, se convirtió en el detonante que llevó a los conservadores a tomar distancia de ellos. Sin embargo, el público, por el contrario, se agolpó aún más alrededor de la facción Pater y de Misono Mika; y Mika se esforzó por reforzar la legitimidad de su régimen, por ejemplo aprobando una enmienda constitucional para garantizar constitucionalmente su dominio.\n\nLas facciones centristas de Trinity se derrumbaron rápidamente tras el atentado, y en consecuencia, personas de marcado conservadurismo o de corte elitista comenzaron a unirse a la facción Pater, donde empezaron a conformar una suerte de 'moderados'.\n\nPero la palabra 'moderados' no los describe por completo. Por lo general no están de acuerdo con la violencia política, ni con una dictadura absoluta, ni con las afirmaciones extremas de los veteranos de la facción Pater; pero, cuando no haya otra opción, se inclinarán a apoyar a Misono Mika. En medio de este caos, la única figura capaz de conducir a Trinity es ella.\n\nLas otras facciones, y en especial Kirifuji Nagisa, insistirán en un tratado de paz con Gehenna. Pero, ¿puede un tratado de paz ser una solución realista en el clima actual? Lo que está claro es que el antiguo sistema del Triunvirato del Tea Party ha fracasado. Lo que Trinity necesita ahora es un liderazgo fuerte que pueda superar el caos, y patriotas que se consagren al país.\n\nEntre las principales figuras de los 'moderados' se encuentran antiguos ejecutivos de la facción Sanctus como Tanaka Miho y Satou Yuka, y antiguos ejecutivos de la facción Filius como Nagayoshi Subaru y Yamamoto Nana. Poco a poco, se van adaptando al nuevo orden de Trinity y acomodándose al sistema actual de la facción Pater."
 trinity_flavor_events.15.a: "¡Más gente la seguirá!"
 trinity_flavor_events.16.t: "Efectos secundarios"
 trinity_flavor_events.16.desc: "Trinity se esforzó en múltiples frentes para aprovechar de la manera más eficiente posible las tierras ampliadas por su política de reindustrialización. Como resultado, en algunas áreas comenzaron a verse efectos reales, y nuevas zonas industriales y complejos residenciales empezaron a construirse rápidamente. Pero no estuvo exento de problemas.\n\nLa mayoría de los trabajadores desplegados en la reindustrialización eran alemanes locales o bestiales. Forzarlos a convivir en los mismos barracones fue el inicio del descontento. Al amontonar en un solo espacio a individuos tan distintos en apariencia y costumbres, el conflicto estalló de inmediato. Cuando el acoso de los alemanes se intensificó, los bestiales terminaron respondiendo en grupo. En el primer choque sorpresivo los alemanes retrocedieron, pero la pelea masiva no terminó ahí: el proyecto se detuvo, la batalla campal se prolongó todo el día y, para colmo, llegaron a emplearse incluso equipos de construcción, convirtiendo el lugar en un auténtico caos.\n\nAfortunadamente, como todas las armas de fuego ya habían sido confiscadas de antemano, no se produjeron muchas víctimas. Con el despliegue rápido de la Orden Hospitalaria y del Departamento de Justicia, el enfrentamiento fue sofocado, y los heridos están recibiendo tratamiento de la Orden Hospitalaria. Sin embargo, si no se establece una solución de fondo, parece que esta clase de incidentes podría repetirse en cualquier momento."
 trinity_flavor_events.16.a: "No queda más que acostumbrarse..."
 trinity_flavor_events.16.b: "Resuélvanlo..."
 trinity_flavor_events.17.t: "Bajo un cielo lúgubre"
 trinity_flavor_events.17.desc: "Hoy, el día se sentía particularmente oscuro y pesado. Nubes grises se extendían bajas, y el viento pasaba en silencio por calles que parecían ruinas. Morizuki Suzumi aún no podía creer que la hubieran destinado a este lugar. La orden del Host de Trinity era implacable, y no le quedaba más que moverse conforme a esa corriente.\n\nElla patrullaba como siempre. Una zona de alto riesgo donde no cesaban los enfrentamientos esporádicos entre el Departamento de Justicia y terroristas. Las calles estaban vacías, las ventanas firmemente cerradas. Los ciudadanos ni siquiera pensaban en salir. O quizá, desde el principio, nunca había existido gente en este lugar.\n\nAl final de la calle desolada, estaba su alojamiento temporal. Empujó la puerta gastada y descolorida; el aire viejo se le pegó a la piel. Con un pesado suspiro, se lavó de manera simple, como si quisiera quitarse el polvo de las manos, y luego se sentó frente al escritorio. Tenía que redactar un informe: la situación del área patrullada, las huellas de enemigos invisibles, y su propia sombra que, entre todo eso, parecía deslizarse hacia algún sitio.\n\nEn el momento de transferir el informe al Departamento de Justicia, innumerables pensamientos le cruzaron la mente. ¿Cuánto tiempo había pasado desde que lo dejó? Aquel lugar del que se fue por agotamiento de las relaciones humanas, y al que ahora volvía por recomendación. Un nombramiento oficial. Una orden que no se podía rechazar. Incluso mientras actuaba como milicia, ella había pensado que algún día quería apartar las manos de todo esto. No pedía recompensa. Simplemente, alguien tenía que hacerlo, y la situación de seguridad, nada satisfactoria, la había mantenido atada a este puesto.\n\nDeber. Cuando empezó, era algo firme. Pero ahora, solo pesaba. Aquello que había sido convicción, honor y la columna que lo sostenía todo, se sentía como una cadena. Y ella notaba que cada vez era menos claro por qué estaba aquí.\n\n¿Para qué, y hacia dónde camina este camino? ¿Y cuándo podrá salir de él?"
 trinity_flavor_events.17.a: "Supongo que nunca lo sabré..."
 trinity_flavor_events.18.t: "Una propuesta repentina"
 trinity_flavor_events.18.desc: "En el instante en que encajó el último libro antiguo en el estante desde la escalera, Kozeki Ui soltó un suspiro de alivio. El problema era que eso no había sido el final. La escalera crujía y sus piernas ya temblaban.\n\n\"A, aaah...\"\n\nJusto cuando iba a bajar con cuidado-\n\n\"¡Ui-chan!\"\n\n\"¡¡Kyaaah!!\"\n\nSobresaltada, Ui perdió el equilibrio y cayó de la escalera. ¡Plaf! Antes que el dolor, lo que la golpeó fue la vergüenza. Mika descendió batiendo las alas y metió la cara cerca de la suya.\n\n\"¡Ajá☆! No pensé que te asustarías tanto. ¡Perdón~!\"\n\n\"M-Mika-sama... al menos mis dedos...\"\n\nEstuvo a punto de que se le escapara algo, pero por suerte Mika cambió de tema.\n\n\"Oye, Ui-chan, se te da bien organizar libros antiguos, ¿no? Y también sabes un poco de economía, ¿verdad?\"\n\n\"...Puedo descifrar textos antiguos, pero economía...\"\n\n\"¡Entonces perfecto! Verás, yo… acabo de crear un club nuevo~ Se llama 'Departamento de Desarrollo Económico de la Academia'. ¡¿No es adorable?!\"\n\n\"...¿Y mi opinión...?\"\n\n\"¿Eh? Obvio: Ui-chan deja el Club de Biblioteca y se convierte en la presidenta del Departamento de Desarrollo Económico. ¿No suena divertido~?\"\n\n\"Y-yo… eso… yo no tengo mucha aptitud para ese tipo de cosas…\"\n\nEn ese instante, la expresión de Mika cambió ligeramente. Sonreía, pero sus ojos no sonreían en absoluto. Mika sacó algo con calma, y el frío tacto del metal tocó la frente de Ui.\n\n\"Ui-chan, ¿me estás tomando el pelo? ¿Hablas en serio?\"\n\nEl corazón se le hundió con un golpe. Ui, sin poder ni respirar, asintió y negó con la cabeza una y otra vez.\nEntonces Mika volvió a tener su cara inocente.\n\n\"¡Bien~! ¡Ahora Ui-chan es del Departamento de Desarrollo Económico! ¡Encantada, presidenta!\""
 trinity_flavor_events.18.a: "\"P-Pero… ¿por qué así…?\""
 trinity_flavor_events.19.t: "Hjalmar Schacht"
 trinity_flavor_events.19.desc: "Hjalmar Schacht jamás imaginó que el Incidente de la Gran Trasposición sacudiría su vida hasta la raíz. Un día, vio cómo su patria se partía en dos, y cómo sobre esa tierra herida descendía un águila para picotear un cadáver desgarrado. Y sobre esa mancha amoratada se levantó algo: ¿un Estado… o algo que solo lo imitaba?\n\nMientras observaba arder el Reichsbank al que pertenecía, Schacht sintió como si algo dentro de él se hiciera añicos. Así, se retiró a su ciudad natal y decidió vivir en recogimiento, una vida tranquila. Por fortuna, su hogar había quedado al margen de la guerra, y él creyó que allí podría cerrar en paz sus últimos días.\n\nPero el destino no le permitió esa serenidad. Se produjeron grandes cambios en la cúpula de Trinity y, desde un lugar inesperado, su nombre fue llamado otra vez. El cargo de director del Departamento de Desarrollo Económico de la Academia. Al principio pensó en rechazarlo con firmeza: se sentía fuera de época, y le parecía demasiado pesado para él. Pero los agentes del gobierno fueron insistentes, y la persuasión se prolongó mucho más allá del umbral de su casa.\n\nAl final aceptó la propuesta y volvió a abrir las puertas del Reichsbank reconstruido. Sobre lo que se derrumbó, estaba listo para levantar una vez más la economía."
 trinity_flavor_events.19.a: "La vida está llena de subidas y bajadas"
 trinity_flavor_events.20.t: "El incidente del té en la piscina de Trinity"
 trinity_flavor_events.20.desc: "\"¡Chicas, láncenlo!\"\n\"¡Toma!\"\n\n -¡PLASH!-!\n\nHa ocurrido un incidente verdaderamente impactante. Uno de los clubes de Trinity, el 'Club de Ceremonia del Té', ha provocado hoy un episodio casi equivalente a una demostración de fuerza. El detonante fue simple: al recortarse el presupuesto del club, en protesta arrojaron todos sus juegos de té a la piscina en un acto extremo.\n\nY como la piscina en cuestión se encontraba cerca de Edén, el asunto se propagó rápido y causó un gran revuelo dentro de la academia. Su acción impulsiva fue sofocada finalmente con la intervención del Departamento de Justicia, pero la piscina quedó en un estado prácticamente irreparable. El tratamiento de la instalación se llevará a cabo con presupuesto de la academia."
 trinity_flavor_events.20.a: "Aunque sea así, ni se te ocurra beber el té negro de esa piscina..."
 trinity_flavor_events.21.t: "Saqueadores de postres"
 trinity_flavor_events.21.desc: "\"Me voy a volver loca… dicen que cerraron todo.\"\nIbaragi Yoshimi estaba apoyando el mentón en el escritorio con un gesto sombrío. Ya había pasado el mediodía.\n\n\"Pues claro. Ayer ustedes también lo vieron, ¿no? Las tiendas estaban hechas un desastre.\"\nKazusa hablaba como si fuera obvio, mirando el celular.\n\n\"Je, je… el dulce mundo se derrumba así en un instante, ¿eh…?\"\nQuien soltó esa frase mirando por la ventana fue Yutori Natsu. Hoy su manera de hablar era todavía más rara y su mirada vagaba en el vacío.\n\nSobre el escritorio estaban desparramadas fotos de las entradas de las pastelerías que habían reseñado hasta ahora, y sobre cada una había una X marcada con rotulador rojo.\n\n\"¿Que todas estas tiendas cerraron? ¿Tiene sentido? El mundo cambió de golpe… ¡Todavía no entiendo qué demonios nos pasó!\"\nYoshimi estalló, furiosa.\n\n\"…Yoshimi, Yoshimi, Yoshimi. ¿Aún no lo has entendido? Es… <el lugar donde está el postre legendario>.\"\n\n\"Ya basta, Natsu. Habla en serio. ¿Otra vez investigaste algún lugar raro?\"\nKazusa, desconfiada, la miró.\n\n\"Claro que sí…\"\nNatsu giró lentamente la cabeza y sonrió de lado.\n\"Al este del distrito central… ¡hay una nueva pastelería…!!\"\n\nEntonces todas la miraron. Natsu extendió la mano hacia ellas y dijo:"
 trinity_flavor_events.21.a: "\"Ah… ¿vendrás conmigo por el camino del 'postre'?\""
 trnfla_21_tt: "§gYoshimi miró la mano en silencio, se quejó y se puso de pie.\n\"…En serio, si otra vez me llevas a un lugar raro… te voy a cobrar el helado.\"\n\nKazusa al final suspiró.\n\"Suena imposible, pero… vamos primero.\"§!"
 trinity_flavor_events.22.t: "Conexión de internet"
 trinity_flavor_events.22.desc: "\"Haa… hoy también es así.\"\n\nMinamino Hana es una estudiante de segundo año de la Academia Integral Trinity que vive en el campo, bastante lejos del distrito central de Trinity. No pertenece a ningún club. No, no podía: el trayecto de ida y vuelta es largo. Además, al ser una línea que pasa con poca frecuencia, no llega a casa hasta pasadas las 8 de la noche. Así que Hana solía relacionarse con otros por internet desde casa.\n\nPero el mundo cambió, y hasta ese internet se le cortó. Durante el tiempo sin internet, intentó todo lo que pudo. Incluso probó escribir cosas en el buscador para reconectarse… (aunque, claro, como no había internet, no pasaba nada). Se mantenía llamando por teléfono a sus pocos amigos, o sacaba tiempo para ir al distrito central, se metía a un café para usar internet todo el día y luego volvía a casa… viviendo una vida llena de molestias.\n\nY entonces, un día…\n\n\"Se conectó…\"\n\nHana contuvo la respiración. En la esquina inferior derecha del monitor, el familiar ícono de wifi por fin se llenó de barras blancas. La X gris que parpadeaba como una broma desapareció.\n\n\"……Ah, es verdad.\"\n\nComo si no pudiera creerlo, tecleó unas cuantas veces. Escribió palabras al azar en el buscador: \"internet restaurado\", \"estoy viva\", \"Trinity\", \"soledad\"… lo que se le ocurriera. Y la pantalla empezó a moverse. Se abrían enlaces, cargaban imágenes, saltaban anuncios. Era, literalmente, una puerta que se abría. Por fin se abría un camino de vuelta hacia el mundo del que había quedado sola.\n\n\"Ya… esto es…\"\n\nHana soltó una risita. El sonido fue pequeño en la sala, pero era una voz real que no salía desde hacía muchísimo tiempo."
 trinity_flavor_events.22.a: "Qué buena historia"
 trinity_flavor_events.23.t: "El problema agrícola de Trinity"
 trinity_flavor_events.23.desc: "El campo agrícola de Trinity colapsó por completo después del Incidente. Las instalaciones automatizadas de granjas inteligentes permitían utilizar el terreno con eficiencia, pero dejaron de funcionar por problemas de recursos energéticos y de tecnología perdida. Como había reservas de alimento, se evitó una crisis inmediata. Sin embargo, si no se toma ninguna medida, pronto podría llegar un punto en el que ni siquiera sea posible conseguir un pedazo de pan. Por suerte, el hecho de que la mayor parte de las regiones que ocupamos sean llanuras resulta esperanzador. Aunque no sea tan eficiente como antes, se está discutiendo que debemos adoptar métodos tradicionales de hace décadas y expandir otra vez la actividad agrícola."
 trinity_flavor_events.23.a: "La gran granja de la gran Trinity ya es una reliquia del pasado..."
 trinity_flavor_events.24.t: "Desde el espacio"
 trinity_flavor_events.24.desc: "\"¿Secre-chan? Entonces, ¿qué dijiste que toca hacer hoy?\"\n\n\"No hay nada hoy. Y además, ayer trabajó hasta tarde procesando asuntos, ¿no?\"\n\n\"…¡Entonces hoy sí que voy a disfrutar la tranquilidad~!\"\n\nHubo una breve risa, como si hubiera sido una broma ligera. El ambiente se suavizó, y Mika volvió a levantar la taza. Olfateó el aroma con calma y dio un sorbo. El lugar habitual del Tea Party, el paisaje habitual. Pero Misono Mika sintió un vacío extraño. El aroma del té se sentía, por alguna razón, más insípido de lo normal.\n\n\"¡Aaah!\"\n\nAnte el grito repentino, Mika se sobresaltó, dejó la taza y se puso de pie de golpe.\n\n\"¡¿Secre-chan?!\"\n\nCorrió con el rostro alarmado. La secretaria se sujetaba la frente, respirando con dificultad.\n\n\"Ugh… ugh… estoy bien… solo que, por un instante, sentí como si la cabeza fuera a estallar…\"\n\nEstaba pálida, y el residuo del dolor parecía no disiparse. Mika le recomendó ir a la Orden Hospitalaria, y la secretaria asintió y se retiró. Mika la despidió en silencio y regresó a la mesa del té.\n\nSe sentó y sirvió otra taza. Hoy no había trabajo; en un rato volvería a concentrarse y ya. Pensó eso, levantó la taza… y en ese mismo instante Mika también sintió un dolor agudo.\n\n¡Bam!\n\nSu cabeza parecía explotar dentro del cráneo. La vista se le deformó y le costaba mantener el equilibrio. Era exactamente el mismo síntoma que había sufrido la secretaria. Mika lo supo: no era una simple migraña.\n\nCuando el dolor se calmó un poco, Mika recordó una historia que había aprendido en clases de historia, en la época en que vivía enterrada entre libros."
 trinity_flavor_events.24.a: "Es el Color venido del espacio."
 trinity_flavor_events.25.t: "Desde el nuevo mundo"
 trinity_flavor_events.25.desc: "Atsuko camina por el distrito central de Trinity."
 trinity_flavor_events.25.a: "\"Ojalá también en este camino florezcan muchas flores.\""
 trinity_flavor_events.27.t: "Entrenamiento conjunto Hyakkaryouran – Departamento de Justicia: Día 1"
 trinity_flavor_events.27.desc: "\"¡U-uuuaaa! ¡E-espera, e-espera! ¡¿La ropa es demasiado bonita?! ¿Se vistieron así a juego porque hoy es entrenamiento conjunto?\"\n\n\"¿Eh…? Estos son todos uniformes del Departamento de Justicia.\"\n\n\"¡A-aun así se ven increíble! ¿Cómo decirlo…? Es como ver en persona un uniforme escolar que solo había visto en libros…\"\n\n\"Je, je. Me alegra que lo diga. Si lo desea, también podemos hacerle uno a medida.\"\n\n\"¿D-de verdad…? N-no… ¿Está bien que lo acepte así nada más…?\"\n\n...\n\n\"¡Aaaah! ¡No lo entiendo! ¡Como que de repente me dio un shock de alergia aguda a la ‘juventud’! La cabeza… ¡no puedo pensar…!\"\n\n\"Lo siento, pero… ¿podemos pausar el entrenamiento un momento? De repente me mareé…\"\n\n\"Sí. Entonces detendremos el entrenamiento por ahora… ¿y mientras tanto podemos dar una vuelta por Hyakkiyako?\"\n\n\"…?\"\n\n\"En un abrir y cerrar de ojos… se fue a algún lado.\"\n\nAsí, Hasumi y los miembros del Departamento de Justicia recorrieron Hyakkiyako y cerraron tranquilamente el primer día."
 trinity_flavor_events.27.a: "\"¿Debería aceptarlo…? Pero si apenas nos conocemos, ¿de verdad está bien aceptarlo tan fácil? Ugh… en serio no lo sé~.\""
 trinity_flavor_events.29.t: "A lo esencial"
 trinity_flavor_events.29.desc: "\"Pato. Pato. Responde. Soy Pingüino.\"\n\n\"Haa… ¿por qué no hay respuesta? La radio está bien…\"\n\nDesde aquel día, todo cambió. No solo Trinity: todo Kivotos estuvo hirviendo durante todo el día con reportes sobre el Incidente.\n\nLos planes se hicieron pedazos. Desde aquel día… Pato, es decir, Misono Mika, no respondió ni una sola vez.\n\nTenemos que volver. Solo ese pensamiento dominaba la mente de Shirasu Azusa.\n\n\"…Fin de transmisión. Cambio y fuera. Pingüino.\""
 trinity_flavor_events.29.a: "Et Omnia Vanitas (Todo es vanidad.)"
 trinity_flavor_events.30.t: "El regreso de Shirasu Azusa"
 trinity_flavor_events.30.desc: ""
 trinity_flavor_events.30.a: "Bienvenida de vuelta."
 trinity_flavor_events.31.t: "Hacia una sociedad trinitaria"
 trinity_flavor_events.31.desc: "Han pasado aproximadamente dos meses desde que estallaron protestas masivas en el distrito central y se resolvieron los problemas sociales entre Trinity y la comunidad germana. En aquel entonces, muchos expertos extranjeros predijeron que Trinity acabaría colapsando por sus contradicciones internas, y se publicaron numerosos artículos que exageraban la crisis con títulos sensacionalistas y fotos morbosas. Sin embargo, a diferencia de esos pronósticos, Trinity va recuperando lentamente su estabilidad interna, y las contradicciones sociales creadas por el Incidente de la Gran Trasposición también se están aliviando poco a poco.\n\nLa plataforma política de Misono Mika, en la superficie, enarbola reforma social, cooperación de clases y partido único, mostrando a primera vista un perfil de derechas; pero su color ideológico es tan complejo y multifacético que resulta difícil encasillarlo simplemente en izquierda o derecha. En especial, las estudiantes de Trinity, transformadas bruscamente tras el Incidente, van exigiendo a Mika políticas cada vez más radicales y agresivas.\n\nEn este contexto, Mika está reduciendo la cooperación con el Consejo Estudiantil General de Kivotos para proteger las fortalezas propias de Trinity. A su juicio, enfoques como el 'Tratado de Edén' impulsado por el Consejo no son una solución de fondo, sino un mero parche temporal. Mika no busca recuperar la identidad e ideales de Trinity apoyándose en concesiones externas: pretende restaurarlos a su manera. Lo que ella quiere proteger no es solo un sistema o una autoridad. Es el alma, el amor y la juventud misma de las estudiantes de Trinity."
 trinity_flavor_events.31.a: "¡Gloria a nuestra alma máter!"
 trinity_flavor_events.32.t: "Post mortem"
 trinity_flavor_events.32.desc: "\"¡Waa~! ¡Nagi-chan! ¿Qué tal? ¿No estás incómoda?\"\n\n\"…Es incómodo. Aun así, es mejor que una celda subterránea.\"\n\nHubo un breve silencio. Entre ambas flotaba una tensión extraña. Cada una sentía una incomodidad distinta desde su lugar.\n\n\"Si vino usted misma… ¿queda algo más que quiera decir?\"\n\n\"Mmm… no. Es que pensé que ya no volvería a verte.\"\n\n\"…\"\n\nNagisa ya no pudo continuar. Mika conocía muy bien esa mirada. Habían sido amigas de la infancia.\n\nNagisa cerró los ojos lentamente y, con un tono como de suspiro y una voz temblorosa, murmuró:\n\n\"No pensé que llegarías tan lejos… Mika-san, tú, justo en momentos así…\"\n\n\"¿Por qué? ¿Por qué? ¿Es por este caso? Un Incidente masivo de origen desconocido… ¿lo tomaste como oportunidad para pisotear a Gehenna? ¿Y por eso incluso a mí, tu amiga de más de diez años…?\"\n\n\"…¿No me digas que incluso lo de Seia-san… Mika-san estaba involucrada?\"\n\n\"Basta, Nagi-chan.\"\n\n\"Esto no es una historia complicada. Odié a Gehenna, utilicé a la gente, la encerré… y si hacía falta, también la eliminé. Eso es todo.\"\n\n\"…¿No habrá sido algún error u malentendido? ¿Que en realidad haya otra verdad completamente distinta?\"\n\n\"Ajajaj. ¿Otra verdad?\"\n\"Nagi-chan es tan ingenua. Por eso me gustabas, pero…\"\n\"Nagi-chan no sabía en absoluto qué clase de persona soy.\"\n\n\"¿Por qué… yo…?\"\n\nA Nagisa se le aflojaron las piernas y se desplomó en el lugar.\n\n\"¿Que cómo es posible que no lo supieras después de tanto tiempo? La respuesta… ¿no la sabes tú mejor que yo? Al final somos extrañas, ¿no? ¿Cómo íbamos a conocer los pensamientos de la otra?\"\n\n\"…Me tengo que ir. Tengo mucho que hacer.\"\n\n\"…Sí. Cuídese, Mika-san. No podré… acompañarla a la salida.\""
 trinity_flavor_events.32.a: "Nagisa dejó una última despedida en su corazón."
 trinity_flavor_events.33.t: "(General)  ' M I S O N O  M I K A '  por fin la destaparon                         \n00 | [GetDate]                                                   "
 trinity_flavor_events.33.desc: "ㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡ\n\n(Foto de un gato)\n\nRecomiéndame qué comer al mediodía\n\n                                                  3 Me gusta | No me gusta 1013\n\nTotal de comentarios §t1000§!.\nLos comentarios superaron los 1000. Ya no se puede comentar.\n\n01\n¿Oye, estás bromeando?\n\n02\nAh…\n\n03\n¿Te divierte burlarte de alguien desesperado?\n\n04\n(Emoji de Peroro despreciando)\n\n05\n¡¡¡Lo sexy no se vale!!!!\n\n06\n(Emoji con la palabra \"increíble\")\n\n07\nNo vayas por ahí diciendo que te gusta Misono Mika-sama.\nImbécil.\nEn la famosa playa de Trinity\nsi esperas unos meses la puedes ver.\nPrimero inténtalo y luego sí, hazte el troll.\n\n08\n>>07\nHermana…\n\n…Después de eso, solo siguieron comentarios agresivos contra el autor."
 trinity_flavor_events.33.a: "¿Hah?"
 trinity_flavor_events.34.t: "Nuestra historia - 1"
 trinity_flavor_events.34.desc: "Al atardecer, Mika estaba nadando sola en la playa. No era que nadar fuera su afición, pero ese día, por alguna razón, sintió que quería ir al mar, así que llegó a una costa sin nadie y pasó un buen rato jugando en el agua.\n\nAhora estaba sentada en una tumbona, contemplando el ocaso. Era el sol de la Tierra, igual al de Kivotos, pero hoy se sentía especialmente distinto.\n\nEl atardecer era hermoso, pero mientras observaba cómo el sol se hundía poco a poco detrás del horizonte, Mika se levantó despacio.\n\n\"El atardecer que se ve aquí… es tan normal como el de Kivotos.\"\nDijo alguien en voz baja, mirando el sol poniente. Era Seia, vestida con traje de baño.\n\n\"¡¿S-Seia-chan?!\"\n\"¿C-cómo…?\"\n\n\"No se asuste, Mika. Solo vine a hablar.\"\nSeia habló con suavidad, como si quisiera tranquilizarla.\n\n\"Seia-chan… p-pero…\"\nEl recuerdo de aquel día volvió con claridad. Mika se quedó sin palabras.\n\n\"Sí, es cierto que aquel día sufrí el atentado. Piense en esto como mi último mensaje.\"\n\"Usted, como un lobo, aprovechará la oportunidad y completará un sistema de mando en solitario. O quizá ya lo completó.\"\n\"Pero… ¿era eso lo que usted quería tanto, al punto de encerrar incluso a su amiga de la infancia?\"\n\n\"…\"\nMika solo miró a Seia en silencio.\n\n\"Si le soy sincera, ahora usted… no es usted.\"\n\"La persona que, perdida en un jardín de flores, clamaba por la paz con Arius…\"\n\"¿Ahora ya ni siquiera necesita esas cosas?\"\n\n\"……\"\n\n\"Mika, lo siento, pero creo que ya se acabó el tiempo.\"\n\n\"¡E-espera! ¡Seia-chan! ¡No es justo que vengas, hables sola y te vayas!\"\n\n\"No hay de otra. Pero Mika… usted lo entenderá.\""
 trinity_flavor_events.34.a: "Mika extendió la mano con desesperación."
 trinity_flavor_events.35.t: "Los cooperativistas"
 trinity_flavor_events.35.desc: "Los cooperativistas, literalmente, defienden la cooperación de clases. Creen que todas las personas deben evolucionar como un organismo integrado funcionalmente, como el cuerpo humano. Por supuesto, la evolución aquí no es biológica. Ellos buscan regular los conflictos y diferencias entre clases mediante cooperación y bien común, y fomentan activamente la solidaridad y la subsidiariedad, la negociación colectiva y la participación de los trabajadores. También consideran importantes valores religiosos, como el valor de la familia. Apoyan una intervención parcial del mercado y el bienestar social, y tienen una orientación favorable al trabajo y comunitaria.\n\nEsta es, en su mayoría, la tonalidad política que persiguen ejecutivos moderados o de inclinación izquierdista. Sin embargo, últimamente los ejecutivos con ideología cooperativista han aumentado rápidamente dentro de la facción Pater. Esto significa que, le guste o no, el Tea Party se está reconfigurando en torno a los cooperativistas, desplazando a los ideologistas."
 trinity_flavor_events.35.a: "Debemos convertir su idea en la ideología del Tea Party."
 trinity_flavor_events.35.b: "Su idea es demasiado idealista."
 trinity_flavor_events.36.t: "Luz en la oscuridad"
 trinity_flavor_events.36.desc: "Conmemorando la caída de la Alemania nazi y la victoria del verdadero Reino de Cristo,\nen Roma, Sede de San Pedro,\naño del Señor 1936, tiempo de Pascua\n\nA los amados hijos e hijas, a los fieles católicos de todo el mundo, y a los preciados hermanos y hermanas que han alcanzado la paz victoriosa:\n\n1. En la providencia de Dios\nEl Señor, en cada época, derriba la soberbia y la tiranía del hombre y revela la humildad y la justicia. También en nuestro tiempo ha caído un poder que, oponiéndose a Cristo y a la verdad de su Evangelio, se absolutizó a sí mismo. Contemplamos con profunda emoción y gratitud el fin de aquel régimen que proclamó la superioridad de la raza, negó al Creador y redujo al hombre a mera herramienta.\n\n2. El fin de una fe torcida\nLa ideología llamada nazismo intentó sentar a la criatura humana en el lugar del Creador, convirtió a la nación en ídolo, oprimió al débil y derramó sangre inocente. Pero por fin se ha cumplido en el escenario de la historia la palabra del Señor: \"La luz brilla en las tinieblas, y las tinieblas no la comprendieron\" (Jn 1,5).\n\n3. A las naciones que defendieron la justicia y la fe\nEn el Señor, enviamos profunda alabanza y bendición a las naciones cristianas que se convirtieron en instrumento de esta victoria. Vosotros luchasteis por los hermanos oprimidos incluso en el fuego de la guerra y quebrasteis la tiranía que ocultaba la luz de la verdad. No es una simple victoria militar, sino una victoria por la fidelidad a Dios y por la libertad del Evangelio.\n\n4. La tarea de la paz\nSin embargo, la victoria no es el destino, sino el inicio. Ahora vuestra misión es edificar el amor y la justicia de Cristo sobre ciudades derrumbadas y almas heridas. Sembrad no venganza, sino perdón; no odio, sino reconciliación. Solo la paz de Cristo puede colmar el profundo abismo que dejó la guerra.\n\n5. Exhortación a todos\nAmados hermanos y hermanas: demos gracias a Dios por este momento histórico y vigilemos para que ningún poder vuelva a ponerse por encima de Dios. Como el profeta del Carmelo, debemos derribar a los falsos dioses y confesar: \"Solo el Señor es Dios\".\n\n6. Preocupación y oración por la unidad\nAunque la victoria de hoy se ha obrado por medio de instrumentos de Dios, recordamos que quienes han vencido no están en la plenitud de la fe católica. Esa imperfección y las diferencias doctrinales quedan como tarea para caminar hacia la verdadera unidad. Por tanto, recibimos esta victoria con gratitud y también con vigilancia, y oramos para que todos los cristianos sean uno en \"un solo Señor, una sola fe, un solo bautismo\" (Ef 4,5).\n\nSanta María, Reina de la Paz, ruega por nosotros.\nCristo Rey, gobierna sobre nosotros."
 trinity_flavor_events.36.a: "Roma, Sede de San Pedro\nPapa Pío XI"
 trinity_flavor_events.37.t: "Visita a la biblioteca"
 trinity_flavor_events.37.desc: "\"Je, je. En realidad es la primera vez que vengo a la biblioteca.\"\nDijo Kirifuji Nagisa frente a Kozeki Ui. Pero Kozeki Ui estaba tan concentrada en su trabajo que no lo oyó bien.\n\n\"¿Oh? ¿No me está escuchando?\"\n\n\"¡Hiek-!\"\n\"N-no… ¡me asustó…! En mi espacio de trabajo… ¿qué está…? H-hiek…\"\nA Ui no le tomó más de unos segundos darse cuenta de que la persona frente a ella era Kirifuji Nagisa. Se sujetó la cabeza y murmuró con una voz pequeña.\n\n\"Je, je. No se preocupe. No le haré daño. La razón por la que vine… es porque necesito ayuda.\"\nNagisa habló con suavidad, como si quisiera tranquilizarla.\n\nPero Ui no bajó la guardia y se cubrió la parte inferior del rostro con un libro. En sus ojos aún había desconfianza.\n\n\"Vaya… no se ponga tan a la defensiva. Estoy buscando un libro. Es delicado decirlo en voz alta, pero… es un libro relacionado con la Rama Arius.\"\nA esas palabras, Ui comenzó a relajarse un poco, aunque mantuvo cierta distancia.\n\n\"S-si es sobre la Rama Arius… p-probablemente esté… abajo, en el sótano…\"\n\n\"Je, je. Gracias por su cooperación, Ui-san.\""
 trinity_flavor_events.37.a: "Nagisa sonrió y se dirigió al sótano con sus escoltas."
 trinity_flavor_events.38.t.Yoshimi: "Un clímax explosivo"
 trinity_flavor_events.38.d.Yoshimi: "Ibaragi Yoshimi estaba muy lejos del mando militar y jamás pensó que se convertiría en algo como una general. Sin embargo, al entrar Trinity en estado de guerra y necesitar suplir la falta de generales, se movilizaron los clubes. Para ella, que era del Club de Postres de After School, no había una trayectoria brillante ni había estudiado en serio el mando militar. Aun así, al ser movilizada constantemente para comandar y participar en operaciones, su habilidad creció con rapidez. Sus logros recientes en el campo de batalla son suficientes para ser celebrados. Bajo su mando decidido, recuperó posiciones clave y clavó con orgullo la bandera de la victoria, ganándose cierta fama incluso entre los soldados de Trinity. Los círculos militares se preguntan cuál será el próximo paso de la llamada 'pequeña gigante'."
 trinity_flavor_events.38.Yoshimi: "\"Puedes esperarlo. No, ¡espéralo!\""
 trinity_flavor_events.38.t.Airi: "Más grande, más lejos"
 trinity_flavor_events.38.d.Airi: "Con Trinity en situación de guerra, el problema crónico de falta de generales llevó a que los clubes comenzaran a ser movilizados. El Club de Postres de After School también fue movilizado, y entre ellos, Kurimura Airi, que fungía como líder del club, fue seleccionada como oficial. Aunque no sabía absolutamente nada de mando militar, Airi hizo lo mejor que pudo desde su posición. Guiando valientemente a los soldados, culminó operaciones con éxito y demostró su liderazgo. Algunos cuestionaban que fuese demasiado común y sencilla, pero ella se probó a sí misma y ganó confianza. Kurimura Airi a menudo se muestra bastante desconcertada ante la gran atención que recibe por primera vez; sin embargo, parece que no le desagrada."
 trinity_flavor_events.38.Airi: "\"Se los mostraré. ¡La versión de mí que sí pudo cambiar!\""
 trinity_flavor_events.38.t.Natsu: "Esto también: una filosofía contenida en los postres"
 trinity_flavor_events.38.d.Natsu: "Ha aparecido otra estrella en ascenso entre los soldados de Trinity: una nueva prodigio, Yutori Natsu, con una trayectoria llamativa. Su estilo de mando es algo peculiar, pero los soldados la quieren profundamente. En el campo de batalla, su comportamiento a veces es impredecible; sin embargo, detrás de ello se esconden perspicacia y una sinceridad hacia los soldados. Ella lee el ambiente del frente, evalúa el estado de las tropas y despliega tácticas propias. Yutori Natsu no busca solo la victoria: incluso en la guerra, no pierde la camaradería ni los lazos, pelea por sus soldados y levanta su moral. Su lado humano y su esfuerzo por obtener el mejor resultado posible le han valido un amplio apoyo entre las tropas."
 trinity_flavor_events.38.Natsu: "\"Quiero añadir postres a este lugar… me ayudarás, ¿verdad?\""
 trinity_flavor_events.39.t: "El Gourmet Research Society"
 trinity_flavor_events.39.desc: "\"Como imaginaba… no se ajusta a mi paladar. Reprobado.\"\nHaruna habló con frialdad y presionó el botón que tenía en la mano. En ese instante, una explosión sacudió el lugar y el interior del restaurante quedó cubierto de llamas y esquirlas. Entre gritos y caos, el Gourmet Research Society ya se había subido a su vehículo.\n\nPero la denuncia ya había entrado. Con el aullido de las sirenas, los vehículos del Departamento de Justicia comenzaron a perseguirlos a toda velocidad.\n\n\"¡Uwaah! ¿Q-qué?! ¡¿Ya nos alcanzaron?!\"\nJunko, nerviosa, se asomó por la ventana. Haruna sonrió como si estuviera acostumbrada y lanzó una frase al Departamento de Justicia.\n\n\"Je, je… miembros del Departamento de Justicia. ¿Han estado bien? Yo hoy también, para explorar la gastronomía, fui a varios restaurantes…\"\n\nLa provocación de Haruna resonó en la carretera. Pero la respuesta fue, de inmediato, una lluvia de balas. Las ventanas se hicieron añicos y se escuchó el sonido del metal rasgándose.\n\n\"Qué problemático… nunca pensé que aquí me toparía con un obstáculo así…\"\nCuando Haruna intentaba mantener la calma, el vehículo frenó en seco. La mirada de Akari, al volante, se fijó al frente: había vehículos del Departamento de Justicia alineados cerrando por completo el camino.\n\nLas puertas se abrieron y los miembros del Departamento de Justicia se dispersaron rápidamente, estrechando el cerco. Docenas de armas apuntaron al vehículo del club.\n\n\"Tch… supongo que hasta aquí llegamos. El camino de la gastronomía es así de duro.\"\nHaruna miró lentamente a los miembros que la rodeaban y, en señal de rendición, alzó ambas manos. Las demás también intercambiaron miradas y, a regañadientes, levantaron las manos. Se instaló un silencio cargado de tensión. El Departamento de Justicia las arrestó y las trasladó de inmediato a la prisión."
 trinity_flavor_events.39.a: "Gehenna de verdad que…"
 trinity_flavor_events.40.t: "En la cueva sin tigre…"
 trinity_flavor_events.40.desc: "Las excesivas cargas de trabajo como Host bastaron para agotar a Misono Mika. Ese peso se superpuso a su temperamento inestable y, finalmente, la llevó a su propia villa. Mika se concedió a sí misma el regalo llamado vacaciones y decidió entregarse a un breve descanso de cuatro días. Con dos guardaespaldas, fue a una playa secreta propiedad del Tea Party. Allí organizó un modesto tea party con sus escoltas, compartió charlas ligeras y, a veces, se sumergió sola en la reflexión. Así, fue deshaciendo poco a poco el cansancio y la tensión acumulados dentro de su propio mundo.\n\nMientras tanto, durante su ausencia, tres figuras representativas de la facción Pater tomaron las riendas del gobierno, reflejando la voluntad de la facción."
 trinity_flavor_events.40.a: "Donde no hay tigre, el zorro es rey."
 trinity_flavor_events.41.t: "A mi yo del futuro que está leyendo esto"
 trinity_flavor_events.41.desc: "Escribe un texto sobre cómo Hugenberg está descontento con Misono Mika y Trinity, publicando periódicos que los critican o denuncian, y dejando breves comentarios en internet."
 trinity_flavor_events.41.a: "A mi yo del futuro: lo deja mi yo del pasado."
 trinity_flavor_events.42.t: "El Círculo de Kreisau"
 trinity_flavor_events.42.desc: "No es una ni dos las organizaciones que se resisten a Trinity. Por supuesto, no son pocos los que, tras ser arrestados y entregados al Departamento de Justicia, terminaron en campos de internamiento. Pero la organización capturada recientemente resultó bastante interesante: el Círculo de Kreisau.\n\n¿Qué tiene de especial? A primera vista no parece demasiado: hasta su nombre proviene de un topónimo. Sin embargo, lo que llamó la atención fue su audacia: era un pequeño círculo social que operaba en el subsuelo de Edén, la capital milenaria. Para ser precisos, actuaban bajo tierra en la frontera entre el distrito central y el occidental; y gracias a unas valientes estudiantes que los descubrieron y lo reportaron, pudieron ser detenidos.\n\nComo anécdota, la composición del grupo también era peculiar: estaba formado por gente de familias aristocráticas, religiosos y socialistas."
 trinity_flavor_events.42.a: "¿No había polacos judíos? Qué alivio."
 trinity_flavor_events.43.t: "Miedo primordial"
 trinity_flavor_events.43.desc: "\"¡Ay! ¡Oye, cabrón! ¡Duele!\"\n\n\"…¿Me teme?\"\n\n\"Qué pinche loca…\"\n\"…Oye, ¿llamo a la milicia?\"\n\n\"No… eso sí que no…\"\"¡Aaah!\"\n\n\"¿Duele, verdad? ¡Ahora mismo! ¿Siente que cayó al abismo del dolor? ¡Esa es mi misión! ¡Salvarlos sembrándoles miedo!\"\n\n\"¡¡¡Rescate! ¡¡¡Puñetazo!!!\""
 trinity_flavor_events.43.a: "Esto no es miedo, es enojo."
 trinity_flavor_events.44.t: "El primer trabajo"
 trinity_flavor_events.44.desc: "Para Misono Mika, el puesto de Host del Tea Party no era algo desconocido. En el pasado ya había desempeñado el rol una vez, y había cerrado su mandato con limpieza, entregando el cargo a la siguiente facción según la costumbre. Pero ahora la situación es distinta: porque el mandato del Host, que antes estaba estrictamente limitado a un año, ahora puede extenderse prácticamente de forma indefinida. Mientras la nueva constitución de Trinity lo garantice, su mandato continuará.\n\nEl trabajo en sí no le resulta ajeno. Para quien ya cargaba responsabilidades pesadas como líder de facción, las labores del Host no son más que la suma de ciertos procedimientos administrativos y protocolos a su carga previa. El papeleo es molesto y tedioso, sí, pero puede resolverlo con rapidez. Revisión de actas, aprobación de presupuestos, organización de acuerdos con facciones… tareas repetitivas que ya procesa casi de forma mecánica.\n\nPara usar de manera eficiente el tiempo que le queda tras el trabajo, Mika está construyendo una rutina personal. A veces, en su despacho, prepara té en silencio para cerrar el día; otras, en un espacio dispuesto en un rincón, hace estiramientos ligeros o yoga para relajar un cuerpo tenso. Mika sabe que esos momentos tranquilos le hacen falta, y por eso procura asegurar deliberadamente tiempo fuera del trabajo."
 trinity_flavor_events.44.a: "O sea… esto es un tutorial disfrazado de historia, ¿no?"
 trinity_flavor_events.45.t: "Los ideologistas"
 trinity_flavor_events.45.desc: "El desarrollo de Trinity se ha construido, de arriba abajo, bajo las ideologías de Hosts heroicos. Los ideologistas son ejecutivos de inclinación extrema que afirman que Misono Mika es precisamente esa 'Host heroica', y que incluso ante sus políticas caprichosas lo único necesario es una entrega absoluta e inquebrantable. Ellos sostienen principalmente la planificación de la sociedad. Aseguran que Trinity es un organismo único y que sus instituciones deben operar armoniosamente para funcionar de verdad. Por eso creen que un organismo dividido inevitablemente colapsa en el caos, y que solo la centralización del sistema hará prosperar a la academia.\n\nQuiera o no, los ideologistas están expandiendo rápidamente su influencia dentro del Tea Party. Exigen de Misono Mika un perfil más coercitivo y heroico. Según su fe, Misono Mika nació con el destino de gobernar no solo Trinity, sino todo Kivotos."
 trinity_flavor_events.45.a: "Debemos convertir su idea en la ideología del Tea Party."
 trinity_flavor_events.45.b: "Su idea es demasiado radical."
 trinity_flavor_events.46.t: "¿Qué es la solidaridad estudiantil?"
 trinity_flavor_events.46.desc: "La sociedad de Trinity, desde antes, se ha construido a partir de la solidaridad voluntaria de sus estudiantes. El Primer Concilio comenzó enfatizando la solidaridad voluntaria de los profetas y la paz."
 trinity_flavor_events.47.t: "Mine, agradecida."
 trinity_flavor_events.47.desc: "A [TRM.GetLeader]-sama,\n\nGracias por el apoyo. Con eso pudimos atrapar y golpear a los asaltantes. Parece que hará falta ayuda humanitaria. Una vez más, gracias por el apoyo."
 trinity_flavor_events.47.a: "Parece que debo otorgarle un ascenso honorífico."
 trinity_flavor_events.48.t: "La carta de Sakurako"
 trinity_flavor_events.48.desc: "Me ha llegado bien la noticia sobre la reciente reforma del plan de estudios. Han relegado la capilla, que fomenta la espiritualidad de las estudiantes, al terreno de lo meramente 'opcional'. Desde la perspectiva de la Sisterhood, es una decisión verdaderamente lamentable. Y aun así, resulta admirable que quien expulsó la fe del aula, ahora, ante su propia necesidad, pretenda apoyarse de nuevo en la autoridad del Señor… debo admitir que incluso yo no puedo evitar asombrarme ante una flexibilidad tan notable.\n\nPero un juramento es un juramento. La Sisterhood cubrirá incluso esa contradicción con oración, y tomará la mano que usted nos ha tendido."
 trinity_flavor_events.48.a: "¡Perdón!"
 trinity_flavor_events.49.t: "Nuestra historia - 2"
 trinity_flavor_events.49.desc: "Mika extendió la mano con desesperación, pero sus dedos no tocaron nada. El atardecer deslumbrante y el sonido tranquilo de las olas se desvanecieron en un instante, como si hubieran sido una mentira.\n\nMika se incorporó de golpe, jadeando. Un sudor frío le corría por la espalda y empapaba su pijama. Miró alrededor, pero aquel no era el hermoso litoral de hace un momento: era su dormitorio, familiar, frío y silencioso.\n\n\"Fue… un sueño… sí…\"\n\nIntentó calmar el corazón acelerado y se frotó la cara con las manos. Al tacto, su rostro ardía como brasa. Pero para ser un sueño, la voz de Seia y aquella mirada helada habían sido demasiado vívidas.\n\nSe quedó sentada en la cama, mirando al vacío. La mente se le enredó en un nudo: la dictadura, Nagisa encerrada, y su yo cambiado. Seia había señalado con exactitud el lugar que más le dolía y luego desapareció.\n\n'Ahora tú no eres tú.'\n\nEsa frase no se le iba del oído. ¿De verdad desapareció la Mika que soñaba con esperanza? ¿Fue correcto el camino que eligió? La culpa y la autojustificación la golpearon como olas, chocando entre sí. Pero la flecha ya había dejado la cuerda, y no había manera de volver atrás. Abrazándose las rodillas, Mika abrió unos labios temblorosos. En la oscuridad, un monólogo que nadie escuchaba se derramó.\n\n\"Yo… yo solo… sentí que tenía que hacerlo así…\" Su voz era frágil, como si fuera a romper en llanto. Y, hacia una amiga que quizá estaba en algún lugar de esa oscuridad… o que tal vez se había ido para siempre, añadió un juramento desesperado.\n\n\"Aun así… lo haré bien… sí. Así que… por favor… volvamos a vernos…\""
 trinity_flavor_events.49.a: "Mika, llorando, susurró en voz baja."

 trinity_flavor_events.1000.t: "La agonía interior"
 trinity_flavor_events.1000.desc: "Hoy era un día más especial que cualquier otro para Iochi Mari. En un escenario desconocido para ella, el de una presentación de idol, hubo algunos problemas menores, pero al final logró cerrar el espectáculo con una actuación brillante. Su figura, resplandeciente bajo las luces deslumbrantes, dejó una profunda impresión en las estudiantes de Trinity, y ahora todas esperaban a la “idol Iochi Mari”. Mientras aguardaban el día en que volvería a subir al escenario, las fans abandonaron el recinto entre vítores apasionados.\n\nSin embargo, desde el instante en que terminó la actuación, Mari comenzó en soledad una silenciosa lucha interior. La vida como monja era para ella una convicción y, a la vez, la razón misma de su existencia. Los años vividos bajo una disciplina estricta jamás fueron ligeros, y Mari también creía que ese camino era el destino que le había sido concedido. Pero durante aquel breve momento sobre el escenario—las luces, los vítores y las innumerables miradas que se extendían hacia ella desde abajo—\n\n\"¿Esto… de verdad está bien…?\"\n\nTras bastidores, en una sala de espera silenciosa, Mari murmuró mientras observaba su reflejo en el espejo. El vestuario resplandeciente, la respiración aún agitada y el eco de los aplausos que permanecía en la punta de sus dedos. Sin duda, puede que ese no fuera el camino que Dios había deseado para ella. Y aun así, en algún rincón profundo de su corazón, seguía anhelando aquel escenario.\n\nLos días de reflexión no fueron sencillos. Incluso durante la oración, incluso en la quietud de la catedral, Mari se formulaba una y otra vez la misma pregunta. La vida que había llevado como monja y la “yo libre” sobre el escenario. ¿Cuál de las dos era la verdadera Iochi Mari?\n\nY finalmente, en silencio, tomó una decisión."
 trinity_flavor_events.1000.a: "¡Yo… declaro que seré idol!"
 trinity_flavor_events.1000.b: "Debo grabar una vez más en mi corazón la determinación de vivir como monja."
 trn_idol_portrait_tt: "§LEl retrato de Iochi Mari cambiará a su atuendo de idol.§!"
 trinity_flavor_events.1001.t: "Despojándose del hábito"
 trinity_flavor_events.1001.desc: "En el patio interior de la silenciosa catedral, una suave luz de la tarde se filtraba a través de los vitrales.\nIochi Mari comenzó a desabotonar uno a uno los botones de su hábito con manos temblorosas. El rosario se balanceó ligeramente, produciendo un leve sonido. Frente a ella, Utazumi Sakurako observaba la escena en silencio.\n\n\"Sakurako… creo que ya no puedo seguir vistiendo este atuendo.\"\n\nSin apartar la mirada, Mari continuó. \"Yo… seguiré el camino de la idol. Creo que esa es otra misión que me ha sido concedida.\"\n\nPor un instante, los ojos de Sakurako vacilaron. Un breve silencio se posó sobre su sereno rostro. Pero pronto juntó las manos, inhaló profundamente y asintió con suavidad.\n\n\"…Muy bien, hermana. Solo puedo rezar para que tu decisión no se aparte de la voluntad de Dios.\"\n\nCon una sonrisa, dio un paso al frente. \"Y, por encima de todo… si ese es el camino en el que puedes brillar siendo tú misma, siempre te apoyaré.\""
 trinity_flavor_events.1001.a: "¡Quiéreme más! ¡Mírame más!"
 trnfla_1001_tt: "§L\"…Así que la hermana Mari también tenía ese lado suyo. Aunque… si hablamos de idols, hasta ahora solo estábamos Mine y yo… Me preocupa un poco con quién piensa formar un grupo idol.\"§!"
 trinity_flavor_events.1002.t: "Lo que ella desea"
 trinity_flavor_events.1002.desc: "Iochi Mari permanecía sentada en un banco de la silenciosa catedral, aferrándose durante largo tiempo a su corazón vacilante. El fulgor del escenario y los aplausos, las emociones que florecieron en aquel instante, fueron tan intensos que a veces le resultaban incluso más propios que el hábito que vestía. Sin embargo, Mari llegó finalmente a una sola conclusión.\n\n—Seguiré caminando por el sendero de la monja.\n\nAun después de decidirlo, su corazón no se había aclarado por completo. Era como si algo permaneciera atorado en lo profundo de su pecho. Para encontrar una respuesta, se dirigió al lugar silencioso que siempre había buscado: el campo de tiro. Un espacio ordenado como siempre, envuelto en un viento sereno. Un lugar apartado tanto del ruido del mundo como del tumulto del alma.\n\nMari se arrodilló y rezó en silencio. Su oración se convirtió en un susurro que se expandió en el aire, y en él volcó suavemente sus sentimientos más profundos. Y entonces—de repente—sintió como si su mente se iluminara por completo. Como si pensamientos largamente guardados se abrieran al fin. Un cálido impulso, como si alguien hubiera empujado suavemente su espalda sin decir palabra.\n\nEntonces lo comprendió. La angustia nacida del escenario, la duda y la confusión sobre sí misma, no eran algo equivocado. No se apartaban de la fe; al contrario, habían sido una oportunidad para mirarse a sí misma dentro de ella. Incluso alguien que ha vivido escuchando y consolando las preocupaciones de otros—de vez en cuando—necesita cuidar de su propio corazón y avanzar hacia aquello que desea."
 trinity_flavor_events.1002.a: "Esa revelación fue serena, pero inequívoca."
 trnfla_1002_tt: "§LÚltimamente, en la mirada con la que Sakurako observa a Iochi Mari se percibía una mezcla de alivio y alegría. Acariciando en silencio su rosario, contempló desde lejos a Mari, sentada junto a la ventana y rebosante de energía, y murmuró con suavidad.\n\n\"La hermana Mari, últimamente… está tan llena de vitalidad. Es bonito verla así.\"§!"
 trinity_events_nagisa.1.t: "La toma de posesión de Kirifuji Nagisa como Host"
 trinity_events_nagisa.1.desc: "Tras el hecho sin precedentes del atentado de francotirador contra la Host Seia, continuó una lucha de poder con su amiga de la infancia, Misono Mika. Kirifuji Nagisa terminó imponiéndose, pero todo el proceso de esa victoria dejó cicatrices en Nagisa.\n\nDe acuerdo con la constitución de la Academia General Trinity, la siguiente Host debía ser Kirifuji Nagisa, quien obtuvo la mayoría absoluta en la votación del Tea Party. Existe la postura, desde la facción Filius, de culpar a la facción Pater como la “arquitecta” del atentado contra Seia, y es cierto que la facción Pater obtuvo beneficios políticos tras el incidente del disparo. Sin embargo, en el contenido actual de nuestra investigación no existe evidencia de que Pater, ni Misono Mika, hayan colaborado con los nazis. La controversia política actual no es más que un fenómeno que demuestra que el conflicto entre Pater y Filius ha llegado al extremo, y es un asunto aparte de la verdad completa del caso.\n\nDado que no había pasado mucho tiempo desde el incidente del atentado contra Seia, la ceremonia de investidura de Kirifuji Nagisa como Host se celebró en privado, con un grupo reducido de asistentes. Nagisa dejó clara su ideología de que “no existe una segunda Trinity”, y afirmó que el cambio radical que pregona la facción Pater no ocurrirá bajo ninguna circunstancia. La victoria de Nagisa se logró por una diferencia de votos algo ajustada, y se espera que estabilice la situación política atrayendo no solo a Filius, sino también a otras facciones."
 trinity_events_nagisa.1.a: "Por la justicia."
 trinity_events_nagisa.2.t: "Reunión con la facción Sanctus"
 trinity_events_nagisa.2.desc: "La facción Filius no había aplastado de forma abrumadora a la facción Pater. Filius pudo hacerse con el poder gracias a la cooperación de otras facciones. Aunque Sanctus perdió a una gran líder como Yurizono Seia y muchos de sus partidarios se dispersaron, aún conserva una fuerza de un tamaño significativo.\n\n\"...No pretendo borrar el nombre de Sanctus. Sanctus puede seguir ahí, y ustedes pueden continuar llevando a cabo sus ideales. Solo espero que mantengan su amistad conmigo.\"\n\nNagisa le propuso a la líder de Sanctus, $TRN_Natsuki_Kato$, una “alianza” con Filius. La idea era que Sanctus permaneciera en el Tea Party como un partido colaborador de confianza que apoyara necesariamente la línea de Nagisa. A cambio, Sanctus, como partido aliado de Filius, podría influir en algunas de las políticas de Nagisa.\n\nQue Sanctus, alguna vez llamada una de las tres grandes fuerzas del Tea Party, sobreviviera en una forma subordinada a Filius no era lo que $TRN_Natsuki_Kato$ deseaba. Pero cuando quedó claro que la Host solo quería el apoyo de Sanctus y no pretendía absorberla por completo, ella decidió aceptar la propuesta de Nagisa."
 trinity_events_nagisa.2.a: "Juntas, hacia el futuro."
 trinity_events_nagisa.3.t: "La princesa del ático"
 trinity_events_nagisa.3.desc: "En Kivotos había muchos días en que se sentaban juntas a disfrutar del Tea Party, pero tras el Gran Traslado, esos días fueron disminuyendo. En especial, después de la muerte de Seia, lo fueron aún más. Era la primera vez, desde la victoria electoral de la facción Filius, que Misono Mika y Nagisa se sentaban frente a frente a conversar. Los ojos de Mika, profundos como el cielo y de un dorado brillante, destellaron. La razón por la que Mika había venido después de tanto tiempo era una: su inestabilidad psicológica.\n\n\"¿Nagi-chan confía en mí, verdad?\"\n\"...Confío.\"\n\"...Aja-ja-ja☆ Sí. Claro. ¡Sabía que Nagi-chan diría eso!\"\n\nFue un intercambio brevísimo, pero con eso Mika mostró una expresión satisfecha. Era porque los halcones de la facción Filius sostenían que Misono Mika y la facción Pater habían colaborado con los nazis y habían instigado el asesinato de Seia. Por supuesto, la investigación actual no había encontrado ni una sola prueba de que existiera un autor intelectual que superara a la guardia armada. Mientras acariciaba lentamente con la uña el exterior de la porcelana llena de té negro, Nagisa se enfrentó, al otro lado de la mesa, a su rival más preciada.\n\nNagisa sabía que Mika no era ese tipo de persona. También sabía que el embate político actual se apagaría con el paso del tiempo. Lo que más le preocupaba a Nagisa eran los sentimientos de Mika. La amenaza de acusación judicial y las críticas políticas se desvanecerían como el calor de esta taza con el fluir del tiempo... pero las heridas del corazón que Mika había recibido no desaparecerían así. Nagisa sabía que Mika acabaría siendo la mayor rival de Filius, y aun así le habló con ternura.\n\n\"No se preocupe por rumores ni ataques. Mika, siga como antes y luche conmigo con la frente en alto. Un Mika cabizbajo no le queda. ...¿La ‘segunda Trinity’ no es un sueño que vaya a desvanecerse tan fácilmente, verdad?\""
 trinity_events_nagisa.3.a: "La rival más especial."
 trinity_events_nagisa.4.t: "La política de facciones, el sello de Trinity"
 trinity_events_nagisa.4.desc: "\"¿La ‘segunda Trinity’ no es un sueño que vaya a derrumbarse tan fácilmente?\"\n\nCon el discurso firme de facción de Mika, cuya fuente era evidente, Mika—que había suspendido sus actividades durante varios días tras el ascenso de Kirifuji Nagisa—volvió al centro de la política. Los halcones de la facción Filius, que sostenían el vínculo entre Pater y los nazis, moderaron el tono de sus acusaciones cuando se compartieron los resultados de la investigación, y Mika emergió como la rival más poderosa de Nagisa, junto al “sueño de una segunda Trinity que no se extinguió”.\n\nAunque la facción Pater y la facción Filius mantenían una relación de amistad muy íntima entre sus líderes, terminaron separándose debido a la diferencia de objetivos: la preservación de la tradición frente al cambio radical del Estado.\n\nPor supuesto, la facción Pater no podrá exhibir la fuerza de la elección inmediatamente posterior al atentado contra Seia. Su impulso se quebró tras la derrota electoral, y muchos ejecutivos que tanteaban entre Pater y Filius se cambiaron a Filius. Aun así, la facción Pater sigue siendo la mayor oposición de Trinity, y Misono Mika es la rival que mejor conoce a Kirifuji Nagisa entre todas las rivales de Trinity."
 trinity_events_nagisa.4.a: "Y, además, la más molesta."
 trinity_events_nagisa.5.t: "Las facciones que aún permanecen"
 trinity_events_nagisa.5.desc: "La facción Pater sin duda seguirá siendo una enemiga declarada de Filius. Pero Pater no es la única fuerza opositora. Sanctus se encuentra dividida entre una fuerza neutral que aún sigue a Natsuki Kato, quien se convirtió en líder tras la muerte de Seia, y una pequeña minoría conspiracionista que insiste en que “en realidad, quien instigó el asesinato de Seia fue Filius”. Esa minoría será leal a Pater.\n\nLa facción Johann, que tiene derecho a participar en el Tea Party pero está enfocada en el socorro, también es un oponente sospechoso. La facción Johann, que lidera la Orden de Caballeros del Socorro, se limita a observar cómo Kirifuji Nagisa conducirá la situación tras el Gran Traslado, sin mostrar una intención clara de apoyo.\n\nLa antigua Justina—la actual Sisterhood—es tan hermética que no se sabe en absoluto cómo ve a Filius. Nagisa siente que su mirada afilada sigue concentrándose en la Sisterhood.\n\nPor último, existen facciones diminutas cuyos nombres Nagisa no puede recordar uno por uno. Por lo general, estas fuerzas pequeñas tienden a pegarse al más fuerte. Si Pater se fortalece, serían las primeras en colgar el retrato de Mika en su sala. No tendrán un gran impacto, pero Nagisa también las anota en su lista mental de advertencias."
 trinity_events_nagisa.5.a: "\"¿De verdad no hay nadie de mi lado?\""
 trinity_events_nagisa.6.t: "Un problema excesivamente difícil"
 trinity_events_nagisa.6.desc: "\"Nagisa. Tienes la tendencia a convertir los problemas fáciles en algo demasiado difícil. Sobre todo, desde que te convertiste en la Host de Trinity, parece que es aún peor.\"\n\"...Después de convertirme en Host, Lani. No lo entiendo bien. ¿No fue Seia quien fue elegida como Host esta vez?\"\n\"Ah. ¿Fue así? Je-je. Lo siento. Es que tengo la tendencia a ver el presente y el futuro algo entremezclados. Sí. Mi siguiente Host es Nagisa. Supongo que ya te has ido preparando, al menos en parte.\"\n\n¿De cuándo era aquella conversación? Reclinada en la cama, Nagisa recordó la figura de Seia. Ese día, ella la miraba desde el otro lado de la mesa, con ambas manos apoyadas con elegancia. Con una ternura extraña, pero también con una mirada apenada hacia Nagisa. Solo el carbonero, posado en la punta de las uñas pintadas con gel rojo, parecía leer las emociones de Seia, alzando esos ojos negros como si la compadeciera.\n\nAquel día, ¿acaso Seia había previsto su final? Era un pensamiento que le llegó demasiado tarde, pero debía ser cierto. Seia ya conocía el desenlace de todo: su propia muerte y, después, la investidura de Nagisa como Host. Por eso, Seia, sintiéndose culpable de pasarle su carga a Nagisa, habría dicho algo así.\n\n\"Antes de entrar al Tea Party, solía recordar ese lado mucho más luminoso de Nagisa. Me entristecía profundamente ver cómo ese aspecto se iba desvaneciendo poco a poco... Nagisa. Si en el futuro te conviertes en Host, en lugar de sospechar de los demás, conviértete en alguien que confía. Y en vez de preocuparte sola, supera las dificultades junto a las personas más valiosas para ti.\"\n\"Sí. Así lo haré. Si en ese momento Seia estuviera a mi lado... sería de gran ayuda.\"\n\nEl carbonero alzó el vuelo hacia el cielo. Mientras ese pequeño pájaro ascendía, el gel rojo de las uñas de Seia se veía, en los ojos de Nagisa, extrañamente aún más rojo. Como si gotas de sangre se extendieran desde Seia sobre la mesa. Nagisa despertó del recuerdo. Y, llorando sin hacer ruido, se hundió en lo profundo y cálido de las mantas."
 trinity_events_nagisa.6.a: "Si Seia hubiera estado... a mi lado..."
 trinity_events_nagisa_6a_tt: "§gKirifuji Nagisa piensa que debe curar su tendencia a la desconfianza. Al menos, necesita practicar confiar en los demás.§!"
 trinity_events_nagisa.7.t: "Encuentro con la Sisterhood"
 trinity_events_nagisa.7.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nAntes del Gran Traslado, Nagisa había visitado a Sakurako algunas veces por motivos oficiales, pero ni siquiera entonces la había invitado a solas a la sala de descanso del edificio del Tea Party. Tal vez si visitaban la Gran Catedral en grupo, con escoltas… pero por eso mismo Sakurako no podía entender por qué Nagisa deseaba una reunión privada.\n\n\"¿Será buena idea ir?\"\n\nSosteniendo una invitación antigua, sellada con cera y ya abierta, Sakurako se giró hacia Hinata. Hinata solo miró la carta en silencio, moviendo levemente los dedos, como si intentara descifrar qué mensaje ocultaba. El silencio no duró demasiado. Hinata alzó la cabeza con lentitud.\n\n\"Creo que es mejor que vaya. Yo… creo que Nagisa no la llamó con, bueno… malas intenciones. Aun así, es el Tea Party, y ella es la Host…\"\n\"...Je-je. Sí. Es el Tea Party, y además la Host del Tea Party. Si no la veo, tampoco sabré por qué quiere verme.\"\n\nSakurako volvió a guardar la carta en el sobre."
 trinity_events_nagisa.7.a: "Comienza la partida de reversi."
 trinity_events_nagisa.8.t: "Volteando las piezas"
 trinity_events_nagisa.8.desc: "Un juego tradicional de Trinity con cientos de años de historia. En el “reversi” solo existen dos piezas: negras y blancas. Si rodeas una pieza del otro color, puedes teñirla con tu propio color. Así, quien tiñe el tablero con más piezas gana.\n\nUn tablero de reversi que no encajaba con una pequeña merienda. Sakurako, con los brazos cruzados, bajó la mirada un instante hacia el tablero, como si intentara adivinar las intenciones de Nagisa. Y colocó una pieza negra en d3.\n\n\"¿Le gusta jugar en las meriendas?\"\n\nLa sonrisa inquietante de Sakurako. La mano de Nagisa, que sostenía una pieza blanca, se detuvo. A pesar de que inteligencia le había transmitido el dato de que “Sakurako da miedo por naturaleza”, Nagisa sintió el sudor recorriéndole el costado del ala.\n\n\"No lo sé. Me pareció un juego que encaja bien con nuestro encuentro de hoy.\"\n\nc5. e6 de Sakurako. Mientras las piezas iban y venían por turnos, Nagisa no miraba el tablero, sino los ojos de ella. Era una metáfora infantilmente simple: el uniforme negro de la Sisterhood y el uniforme blanco del Tea Party, ¿no estaban intentando teñirse mutuamente? Ella también, antes de que hubieran intercambiado muchas piezas, mostró una expresión de haber entendido la intención de Nagisa.\n\n\"Si se lo digo de antemano: da igual lo que Nagisa haya imaginado sobre la Sisterhood, no será la respuesta correcta.\"\n\"¿No lo será?\"\n\na1. ¿Cuántas piezas habían ido y venido? La pieza negra de Sakurako se adueñó del punto más importante. La abadesa de la Sisterhood habló hacia la Host de Trinity.\n\n\"No intervención en política. La Sisterhood jamás ha cambiado esa regla. No ha cambiado ni antes ni después del Gran Traslado. ...¿Qué beneficio obtendríamos si tomáramos el control de esta Trinity en caos?\"\n\nY entonces, Sakurako le dijo a Nagisa:\n\n\"Y además, a mí me gusta más jugar a los juegos más nuevos con alguien tan importante.\" \n\nEl rostro de Sakurako se veía tan apacible al decirlo que Nagisa, al bajar la vista al tablero ya teñido de negro, sintió que una sonrisa se le dibujaba sin darse cuenta."
 trinity_events_nagisa.8.a: "Solo que este juego no es precisamente un “juego nuevo”."
 trinity_events_nagisa.9.t: "El final de la reunión"
 trinity_events_nagisa.9.desc: "\"...Entonces, ¿me está diciendo que quiere que la Sisterhood coopere con Filius?\"\n\nMientras guardaba de nuevo en el recipiente las piezas blancas y negras del reversi, Nagisa asintió con calma. La razón para decidirse a ver a Sakurako era una: saber si la Sisterhood tramaba una conspiración. Pero si ellas no tenían esa intención, la perspectiva de Nagisa cambiaba. Sisterhood. ¿Sería imposible cooperar con ellas?\n\nSakurako golpeó la mesa con el dedo—toc, toc—una y otra vez.\n\n\"Nuestra virtud más importante es la fe, no la política. Eso ya se lo… dije hace un momento. Por eso, no podemos prometer una cooperación incondicional con Filius. Sin embargo.\"\n\nSakurako miró a Nagisa y sonrió con ternura.\n\n\"Cuando Nagisa quiera seguir el camino correcto, la Sisterhood puede ayudarle ‘fuera de la política’. Y lo que Nagisa teme… tampoco habrá cooperación con Pater.\"\n\"¿Porque cooperar con Pater también violaría la regla de no intervención…?\"\n\"Sí. A menos que el centro de Trinity llegue a derrumbarse, nosotras queremos seguir quedándonos aquí.\"\n\nSi el centro de Trinity se derrumbara. Había dejado una pista con regusto amargo, pero Nagisa decidió reprimir su paranoia. Al menos, Sakurako no intervendría en política de inmediato. No ayudaría a Filius de forma directa, pero tampoco tomaría la mano de Pater. Con eso bastaba. Había tenido sentido llevar el reversi con la intención implícita de “¿pretenden voltear el Tea Party?”.\n\n\"Muy bien. Entonces… de ahora en adelante espero mucha ayuda de la Sisterhood. Por supuesto, fuera de la política.\""
 trinity_events_nagisa.9.a: "Sakurako se levantó con elegancia."
 trinity_events_nagisa.10.t: "Concilio Público de Trinity del año [GetYear]"
 trinity_events_nagisa.10.desc: "Una de las facultades explícitas concedidas a la Host de Trinity es poder declarar el Concilio Público de Trinity. Para proteger a Trinity en medio del evento sin precedentes del Gran Traslado, Nagisa proclamó la apertura de un nuevo concilio en el que participaran todas las facciones. Era una ceremonia para declarar hacia qué dirección debía avanzar Trinity tras el Gran Traslado y de qué forma una Host llamada Kirifuji Nagisa protegería a su alma máter en medio del caos.\n\n\"Agradezco a todos los presentes por reunirse aquí. A través de este concilio, nosotras mostraremos el camino que Trinity debe tomar…\"\n\nEl acto de apertura de Nagisa se realizó a pequeña escala, en la sala de reuniones del Tea Party donde se reunieron representantes de cada facción de Trinity. Incluso Pater, que se oponía con mayor ferocidad a Filius, no boicoteó este concilio. Era una reunión políticamente crucial para redactar una nueva constitución de Trinity tras el Gran Traslado, y no asistir equivalía prácticamente a un suicidio político."
 trinity_events_nagisa.10.a: "Cambiaré a Trinity."
 trinity_events_nagisa_10sakurako_tt: "§gComo Nagisa sospechaba de las intenciones de la Sisterhood, no le envió una invitación para asistir al concilio. La abadesa Sakurako, que no pudo asistir a la ceremonia de apertura, expresó públicamente su descontento, y fue invitada al concilio con retraso. Sin embargo, las heridas de su corazón no desaparecerán.§!"
 trinity_events_nagisa.11.t: "Los poderes de la Host"
 trinity_events_nagisa.11.desc: "Lo primero que se debatió fue extender de 1 año a 3 años el mandato de la Host, actualmente definido así. Los representantes de la facción Pater mostraron un descontento abierto diciendo que “un año es tiempo suficiente para cambiar el mundo”, pero también surgió la opinión contraria: en un evento sin precedentes como el Gran Traslado, era imposible que Kirifuji Nagisa estabilizara un país en apenas un año. Al final, cuando Pater cedió, se garantizó oficialmente un mandato de 3 años para la Host, con posibilidad de reelección ilimitada. Por supuesto, no significa que la victoria en la próxima elección esté asegurada, pero tres años serán un periodo suficiente para elevar el apoyo a Filius."
 trinity_events_nagisa.11.a: "Es una decisión razonable."
 trn_nagisa_autocracy_flag: "§YEn la decisión del §gConcilio§!, se §Rconcedieron§! facultades autoritarias a la Host.§!"
 trn_nagisa_democracy_flag: "§YEn la decisión del §gConcilio§!, se §Grestringieron§! las facultades de la Host.§!"
 trinity_events_nagisa.12.t: "El problema de Gehenna"
 trinity_events_nagisa.12.desc: "Por mucho que la facción Pater eleve la voz, Kirifuji Nagisa y la facción Filius no tienen intención de detener el impulso del Tratado de Edén. El problema es el cambio político de Gehenna tras el Gran Traslado. ¿Debe el Tratado de Edén mantenerse como antes, solo entre Sorazaki Hina, jefa del Comité Disciplinario, y Kirifuji Nagisa? ¿O las discusiones deben ampliarse también a la Pandemonium Society y al Parlamento de Luxemburgo?\n\nPor supuesto, Nagisa sabe que no tiene sentido proponer la ampliación del Tratado de Edén a las otras dos fuerzas aparte del Comité Disciplinario. Luxemburgo, que no tiene identidad alguna de Gehenna, respondería con algo cercano a la “indiferencia”, y la Pandemonium Society malinterpretaría la propuesta de paz de Trinity como una señal de que “somos débiles”.\n\nPor eso, que Nagisa diga que ampliará el Tratado de Edén es, en la práctica, solo para la política interna. Es una operación política: enviarle a Pater el mensaje de que Nagisa no piensa retroceder en este asunto diplomático, y ganar simpatía de la Sisterhood, de tendencia pacifista.\n\nSin embargo, la postura de ampliar la paz podría enfurecer a nuestra organización militar, el Departamento de Realización de la Justicia. La racional Sorazaki Hina es la línea límite que ellas pueden tolerar, y la idea de “hablar de paz” con Hanuma Makoto bajaría la moral de nuestras fuerzas."
 trinity_events_nagisa.12.a: "\"El Comité Disciplinario siempre es el interlocutor más importante.\""
 trinity_events_nagisa.12.b: "\"Pero también es necesario tender la mano a Pandemonium.\""
 trinity_events_nagisa.13.t: "La fe"
 trinity_events_nagisa.13.desc: "\"Sinceramente, creo que hasta afirmar que la fe que cree esta tierra se parece a la de nuestra Trinity ya es una especie de insulto. Su fe, sin duda, va por el camino equivocado…\"\n\nTras la declaración pública de un representante de la facción Sanctus, la Sisterhood también reaccionó alineándose con esa postura. La cuestión crucial es la fe de esta tierra. Algunos afirman que la fe local es “compatible” con la de Trinity, y que son hermanos y hermanas de las Escrituras. Sin embargo, los duros etiquetan la fe de esta tierra como herejía y dicen que deben convertirla por completo a la de Trinity. En especial, se volvió un gran problema que los alemanes locales consideraran la fe de Trinity como una “desagradable idolatría pagana”.\n\nLa batuta del concilio pasó a manos de Nagisa. Varias facciones expresaron la opinión de que Kirifuji Nagisa debía dejar por escrito la “conversión de la fe de Trinity en religión de Estado” y prepararse para reprimir con dureza la fe local."
 trinity_events_nagisa.13.a: "\"Preparemos la represión de la fe local.\""
 trinity_events_nagisa.13.b: "\"Por ahora, ellos también son hermanos y hermanas de las Escrituras.\""
 trinity_events_nagisa.14.t: "Cerrando el concilio"
 trinity_events_nagisa.14.desc: "El largo concilio del año [GetYear] por fin se acercaba a su tramo final. En el concilio se debatieron, por turnos, la política interna, la diplomacia exterior y la fe que constituye el centro de Trinity. Este concilio, cerrado con éxito, decidirá el futuro de Trinity.\n\nPor supuesto, no todo quedó decidido. Los asuntos que no pudieron resolverse en el concilio—en particular, la convivencia con la población local y los métodos concretos para ejecutar el Tratado de Edén—deberán ser definidos por la propia Kirifuji Nagisa.\n\nNagisa promulgó, como facultad de la Host, las decisiones tomadas en el concilio. La facción Pater abandonó la sala sin decir una palabra, y las facciones restantes, apoyaran o no las decisiones, aplaudieron."
 trinity_events_nagisa.14.a: "No creo que estos aplausos signifiquen un final feliz."
 trinity_events_nagisa.15.t: "Entonces, ¿cuándo nos van a dar el derecho al voto?"
 trinity_events_nagisa.15.desc: "El mayor valor central del gobierno de Nagisa será “esforzarse por confiar en los demás”. Eso incluye tanto a viejos enemigos como Gehenna, como a nuevos enemigos tras el Gran Traslado, como los partidos políticos alemanes. Nagisa le exigió al Departamento de Realización de la Justicia que investigara a los partidos dentro de Alemania y determinara si existía alguno que pudiera cooperar con el sistema estatal de Trinity. En lugar de pelear con todos los partidos locales, sería mejor estrechar la mano de quienes se pueda entablar amistad.\n\n\"Pero… ¿no hay, verdad? Un partido cooperativo.\"\n\nAl salir de la reunión, Mashiro le transmitió a Hasumi las exigencias que miembros del Partido Socialdemócrata Alemán les habían entregado. El Partido Socialdemócrata, el Partido de Centro, el Partido Nacional del Pueblo y la mayoría de los partidos exigían o bien incluir a los locales en la oligarquía del Tea Party—formada por una minoría de trinitarias—o bien restaurar el sufragio universal y el sistema parlamentario de la República de Weimar. Había exigencias variadas, pero podían resumirse en una sola: entréguennos el poder político a nosotras, que somos la mayoría y además locales.\n\nHasumi dobló los documentos con una mirada algo irritada.\n\n\"Nagisa-sama es de mente amplia, pero no es tonta. ¿Por qué soltaría su poder en manos de gente que ni conoce?\"\n\"No es solo Nagisa-sama… también es que quieren que el Tea Party se abra a los alemanes. ¿No podrían conformarse con algo a nivel de autonomía local?\"\n\"Ojalá llegue el día en que esos ignorantes sean guiados y comprendan cuán benevolentemente el Tea Party de nuestra Trinity gobierna esta tierra.\""
 trinity_events_nagisa.15.a: "Qué gente local tan necia e idiota."
 trinity_events_nagisa.16.t: "El problema de las facciones"
 trinity_events_nagisa.16.desc: "Nagisa sentía el cambio dentro de la facción Filius. Desde antes del Gran Traslado ya era una facción algo conservadora. Sin embargo, tras el Gran Traslado, Filius fue reforzando gradualmente una obsesión por la “tradición”. La causa era evidente: el movimiento de la “segunda Trinity” de Pater. Ellas afirman que la Trinity actual es vieja y decadente, y desean una Trinity “nueva”. Entonces, Filius, que lucha contra Pater, no tiene más remedio que gritar aún más fuerte la defensa de la tradición. Incluso después de perder la elección de Host, Pater terminó soltando en Filius el veneno de la reacción.\n\n\"Incluso en las reuniones del Tea Party han llegado varias peticiones para restaurar las antiguas unidades de medida de Trinity, como el sistema de yardas y libras…\"\n\nNagisa dio un sorbo a su té negro y miró las actas sobre la mesa de su sala de reuniones. Por ahora, todo se quedaba en el nivel de la ridiculez de las yardas y libras. Pero si se deja así, era evidente que aparecerían movimientos para “retroceder” Trinity aún más hacia el pasado. Nagisa no quería cambiar Trinity de forma revolucionaria. Para ella, Trinity siempre había sido Trinity, y así como estaba seguía siendo una academia hermosa, bien cuidada, como un bonsái.\n\n\"Aun así, habrá que controlar los movimientos internos de Filius.\"\n\nNagisa decidió volver a participar en las reuniones a las que había faltado varias veces por el trabajo reciente. Si alguien podía cambiar, aunque fuera un poco, esta corriente conservadora… solo podía ser Kirifuji Nagisa."
 trinity_events_nagisa.16.a: "Yardas y libras… no me entusiasma mucho."
 trinity_events_nagisa.17.t: "Por una guerra justa"
 trinity_events_nagisa.17.desc: "Para apoyar la guerra entre nosotras y [GEM.GetNameDef], [FROM.GetNameDef] envió una misión de asesores militares. Ellos afirman que han llegado para ayudar a la jefa del Comité Disciplinario, [ROOT.GetLeader], y declararon que harán todo lo posible por mantener la amistad entre [FROM.GetName] y [ROOT.GetName]. La misión llegó con una pequeña cantidad de armas, y junto a Trinity destruiremos las malvadas máquinas de guerra de [GEM.GetLeader]."
 trinity_events_nagisa.17.a: "Nada mal."
 trinity_events_nagisa.18.t: "Preparativos para la reunión Nagisa–Ako"
 trinity_events_nagisa.18.desc: "La asistente inclinó la cabeza con un gesto respetuoso y sostuvo una borla de seda en la mano. Sobre la piel de Nagisa, ya pálida como la nieve desde el inicio, comenzó a aplicar polvos. Mientras las puntas de los dedos de la asistente moldeaban una estatua de yeso llamada Kirifuji Nagisa, la Host pensaba en otra cosa.\n\nMuchos en Trinity aún miraban con cinismo el Tratado de Edén. Pero, precisamente porque era “Gehenna”, ¿no era acaso lo más confiable? Nagisa recordó cuando, antes del Gran Traslado, conoció a la representante de Gehenna por mediación de la presidenta del Consejo Estudiantil General.\n\nSorazaki Hina, que solo había vivido atrapando criminales, salió por primera vez al terreno por algo llamado diplomacia internacional y, por no estar acostumbrada a maquillarse, se aplicó rubor hasta que las mejillas se le pusieron rojas como una alcohólica; ella lo dejó pasar con calma, pero cuánto se rió la presidenta del Consejo Estudiantil General al verlo, arruinando la atmósfera.\n\nGehenna no entiende de “política” como tal, pero menos aún de “mañas políticas”. Gente que, antes que maquillarse con mentiras, prefiere reventar un manantial termal; gente que lanza de frente el mensaje que quiere dar y ni siquiera sabe cómo envolverse como una caja de chocolates. Por eso, tras el Gran Traslado, Kirifuji Nagisa fue sintiendo cada vez más aprecio por Gehenna. Al menos, esa jefa del Comité Disciplinario era distinta de otros políticos de facción que incluso utilizaban la muerte de Seia.\n\nCuando terminaron los preparativos para salir, Nagisa se puso de pie. Confiar en los demás. Al menos, se esfuerza por hacerlo. Para sostener esa convicción, cada vez más difícil tras el Gran Traslado, tal vez fuera necesario mirar hacia afuera, y no solo dentro de Trinity."
 trinity_events_nagisa.18.a: "La negociación se aproxima."
 trinity_events_nagisa.19.t: "La reunión Nagisa–Ako"
 trinity_events_nagisa.19.desc: "Habría sido más feliz si, como antes del Gran Traslado, hubiera podido sentarse cara a cara con Sorazaki Hina, pero que Amao Ako hubiera venido personalmente hasta Edén ya era un enorme logro diplomático. Sorazaki Hina y Amao Ako eran burócratas de temperamentos claramente distintos, pero Ako era, en términos humanos, más “divertida”.\n\n\"O sea, ¡Hina-buchou le dio con la culata: PAM! Y la cabeza del mocoso de los cascos hizo: ¡CLANG—! y…\"\n\nSi Mika estuviera aquí, lo llamaría “icebreaking”. Ako tenía un talento extraordinario para el icebreaking. Era una chica que realmente recordaba a Mika hablando con pasteles frente a ella. Ningún ejecutivo de Pater, ni de Filius ni de Sanctus podía parloteartle así a Nagisa. Como no es de Trinity, supongo que puede hablar libremente, fuera de la etiqueta y el orden de esta academia.\n\nSi Nagisa no lleva el tema al punto, parece que Ako no podrá salir del icebreaking jamás. Hasta en eso, Ako se parecía a Mika. Nagisa dio un sorbo a su té negro y sonrió con una nostalgia teñida de calidez. \"Le agradezco la historia sobre Hina, pero hoy me gustaría comenzar la discusión sobre la gestión conjunta del orden público entre nuestras dos academias.\" \n\"¡A-ah, claro! Orden público conjunto… je-je. No lo había olvidado en absoluto. Solo… me estaba calentando un poco la voz antes de una reunión complicada…\"\n\nEsa actitud tan despreocupada le resultó tan graciosa que Nagisa terminó soltando una carcajada." # 히나가 선도부장인 상태
 trinity_events_nagisa.19.desc.alt: "Habría sido más feliz si, como antes del Gran Traslado, hubiera podido sentarse cara a cara con Sorazaki Hina, pero Sorazaki Hina ya no era la jefa del Comité Disciplinario de Gehenna. Sorazaki Hina y Amao Ako eran burócratas de temperamentos claramente distintos, pero Ako era, en términos humanos, más “divertida”.\n\n\"O sea, ¡Iori le dio con la bota: PAM! Y el mocoso de los cascos salió rodando por el suelo…\"\n\nSi Mika estuviera aquí, lo llamaría “icebreaking”. Ako tenía un talento extraordinario para el icebreaking. Era una chica que realmente recordaba a Mika hablando con pasteles frente a ella. Ningún ejecutivo de Pater, ni de Filius ni de Sanctus podía parloteartle así a Nagisa. Como no es de Trinity, supongo que puede hablar libremente, fuera de la etiqueta y el orden de esta academia.\n\nSi Nagisa no lleva el tema al punto, parece que Ako no podrá salir del icebreaking jamás. Hasta en eso, Ako se parecía a Mika. Nagisa dio un sorbo a su té negro y sonrió con una nostalgia teñida de calidez. \"Le agradezco la historia sobre el Comité Disciplinario, pero hoy me gustaría comenzar la discusión sobre la gestión conjunta del orden público entre nuestras dos academias.\" \n\"¡A-ah, claro! Orden público conjunto… je-je. No lo había olvidado en absoluto. Solo… me estaba calentando un poco la voz antes de una reunión complicada…\"\n\nEsa actitud tan despreocupada le resultó tan graciosa que Nagisa terminó soltando una carcajada." # 아코가 선도부장인 상태
 trinity_events_nagisa.19.a: "La reunión salió bien."
 trinity_events_nagisa.20.t: "La reunión Ako–Nagisa"
 trinity_events_nagisa.20.desc: "Habría sido mejor si, como antes del Gran Traslado, hubiera podido sentarse cara a cara con Kirifuji Nagisa, pero por el empeoramiento del orden público tras el Gran Traslado y la necesidad de contener a la Pandemonium Society, Hina no pudo visitar Edén en persona. Kirifuji Nagisa envió al Comité Disciplinario una propuesta: “Para reimpulsar el Tratado de Edén, primero creemos una organización conjunta de orden público entre ambas academias”. Quien partió con plenos poderes para responder esa propuesta fue Amao Ako.\n\n'La reunión salió bien. Se completó una negociación que garantiza el beneficio conjunto de ambas academias.'\n\nAko contestó así. En verdad, no era un mal contenido. Al mismo tiempo, Sorazaki Hina pudo leer la intención de Kirifuji Nagisa a través del documento diplomático que le envió Amao Ako: “Excluyendo por completo a la Pandemonium Society, solo el Comité Disciplinario y Trinity despliegan un frente unido de forma conjunta”.\n\nEn el documento de Nagisa, la Pandemonium Society no estaba incluida dentro de las zonas donde el Departamento de Realización de la Justicia mantendría el orden. Era distinto de que el Comité Disciplinario mantuviera el orden incluso en el territorio de la Pandemonium Society. Como si el “territorio de Gehenna” se limitara solo a los dominios directos de Hina.\n\n¿Y si Kirifuji Nagisa pretendía dividir Gehenna en dos y luego invadir y ocuparla por partes? El deseo de creer en la buena voluntad que Nagisa había mostrado desde antes del Gran Traslado, mezclado con la ansiedad creciente de Sorazaki Hina tras el Gran Traslado… hizo que Hina no pudiera dormir hasta que terminó aquella noche." # 히나가 선도부장인 상태
 trinity_events_nagisa.20.desc.alt: "Antes del Gran Traslado, Kirifuji Nagisa y Sorazaki Hina discutían juntas asuntos importantes como el ETO. Ahora la situación ha cambiado, pero… Kirifuji Nagisa envió al Comité Disciplinario una propuesta: “Para reimpulsar el Tratado de Edén, primero creemos una organización conjunta de orden público entre ambas academias”. Quien partió con plenos poderes para responder esa propuesta fue Amao Ako.\n\nTras la reunión, la cúpula del Comité Disciplinario pudo leer la intención de Kirifuji Nagisa a través del documento diplomático: “Excluyendo por completo a la Pandemonium Society, solo el Comité Disciplinario y Trinity despliegan un frente unido de forma conjunta”.\n\nEn el documento de Nagisa, la Pandemonium Society no estaba incluida dentro de las zonas donde el Departamento de Realización de la Justicia mantendría el orden. Era distinto de que el Comité Disciplinario mantuviera el orden incluso en el territorio de la Pandemonium Society. Como si el “territorio de Gehenna” se limitara solo a los dominios directos de [ROOT.GetLeader].\n\n¿Y si Kirifuji Nagisa pretendía dividir Gehenna en dos y luego invadir y ocuparla por partes? Dentro de [ROOT.GetName] estalló un intenso debate sobre si era posible confiar en la buena voluntad de Kirifuji Nagisa." # 그 이외
 trinity_events_nagisa.20.a: "¿De verdad debemos firmar el Tratado de Edén?"
 trinity_events_nagisa.21.t: "Hora del té por la tarde"
 trinity_events_nagisa.21.desc: "A Nagisa no le agradaba demasiado esta situación. La crisis de Trinity, surgida tras el incidente, no mostraba señales de calmarse. Las estudiantes de Trinity fueron afectadas de forma directa. La mayoría cambió radicalmente su inclinación, y aparecieron quienes despreciaban al Tea Party como inútiles, cayendo en extremos. Ellas veneraban ideas violentas, como las de la facción Pater, y querían unirse a esa causa.\n\nEn particular, la facción Pater y sus pequeñas facciones afiliadas eran un problema. Pater empezó a enarbolar con mayor descaro las ideas violentas que ya defendía desde antes. Mika no las frenó. De hecho, quizá incluso esté participando en esas ideas. Si esto sigue así, en el futuro la facción Pater amenazará el puesto de Host de la facción Sanctus, tomará el poder y derrumbará todo lo de Trinity. Y en el centro de eso… No. No. No puedo permitirlo.\n\nUna taza de té en la tarde era especial. Ese té bebido con calma aliviaba el cansancio acumulado. Sosteniendo la taza y mirando por la ventana, Nagisa se hundió en sus pensamientos. La siguiente Host, por supuesto, sería Seia de la facción Sanctus. Eso es inmutable. Yurizono Seia es bastante confiable. Siendo alguien con cierta capacidad de previsión, ella podría resolver todos los problemas de Trinity. Si no se resuelve durante su mandato, la siguiente Host será de la facción Filius, así que, por largo que sea, esta crisis podrá resolverse sin falta. Nagisa quería creerlo. No… tenía que ser así."
 trinity_events_nagisa.21.a: "Y los incidentes tienden a estallar en el lugar menos esperado."
 trinity_events_nagisa.22.t: "El poder de la fe"
 trinity_events_nagisa.22.desc.hardline: "\"Tal como se debatió en el concilio anterior, consideramos la fe de esta tierra como un enemigo decadente que debe ser superado y convertido. La Sisterhood, con el máximo esfuerzo…\"\n\nCon el sermón pronunciado en la Gran Catedral por Sakurako, la abadesa de la Sisterhood, comenzó un largo viaje: en cooperación entre el Tea Party y la Sisterhood, convertir a los nativos de esta tierra a la fe de Trinity. Será difícil convertir a todos los nativos en una sola generación. Pero a corto plazo, el objetivo será convertir a la clase media de las ciudades importantes. Ellos no creen de verdad en Dios con sinceridad, y por interés elegirán la conversión sin dificultad.\n\nLa Sisterhood, que originalmente mantenía neutralidad política, al llevar este plan de conversión junto al Tea Party también entró en una relación de cooperación profunda. La Sisterhood no se involucrará de lleno en política, pero ayudará a Filius antes que a otras facciones, como prioridad, por haber colaborado con el trabajo de conversión."
 trinity_events_nagisa.22.desc.moderate: "\"Tal como se debatió en el concilio anterior, consideramos que la fe de esta tierra también es igual a la nuestra, y que solo difiere el camino que recorren…\"\n\nCon el sermón pronunciado en la Gran Catedral por Sakurako, la abadesa de la Sisterhood, se implementó un plan: en cooperación entre el Tea Party y la Sisterhood, difundir propaganda entre los cristianos de esta tierra para afirmar que tanto el catolicismo como el protestantismo no son más que otras facciones de la misma fe, idéntica a la fe de Trinity. Por supuesto, no es un proceso sencillo. En especial, el sistema de sacerdocio femenino de Trinity era una doctrina radical que ni el Vaticano ni los protestantes podían tolerar. Por eso, a corto plazo el objetivo será persuadir a la clase media de las ciudades importantes. Ellos no creen de verdad en Dios con sinceridad, y por interés elegirán la conversión sin dificultad.\n\nLa Sisterhood, que originalmente mantenía neutralidad política, al llevar este plan junto al Tea Party también entró en una relación de cooperación profunda. La Sisterhood no se involucrará de lleno en política, pero ayudará a Filius antes que a otras facciones, como prioridad, por haber colaborado con el trabajo de propaganda."
 trinity_events_nagisa.22.a: "Nueva fe, nuevo orden."
 trinity_events_nagisa.23.t: "Por favor, conviértase en una emisaria"
 trinity_events_nagisa.23.desc: "Nagisa levantó lentamente con ambas manos un peluche de hipopótamo blanco. Bajo el cálido sol que caía sobre el jardín del Tea Party, el peluche del Señor Peperoncino, con sus gafas, la miraba con una ternura enorme. Este “Señor Penancie” del que Hifumi le habló… muchas veces aún no lograba entender por qué al público le gustaban personajes así, pero de tanto verlo empezó a parecerle adorable. Nagisa dejó con cuidado el peluche del Señor PeroPero en el borde de la mesa.\n\nNagisa le habló a Hifumi, que sorbía té negro al otro lado de la mesa. \"Después del Gran Traslado, al entrar en contacto con la cultura popular alemana, personalmente sentí mucha incomodidad. Masculina, despreciando la autoridad del Tea Party, e incluso violenta. No tienen ese lado cálido que tranquiliza a la gente, como alguien como el Señor Peroroche que usted ama, Hifumi.\" \n\"Aja-ja… ¿En serio? Yo creo que quizá la cultura de esta tierra también tenga cosas buenas.\" \n\"Sí. Puede que tenga cosas buenas. Pero también es cierto que las malas sobresalen. …Y por eso quería verla hoy, Hifumi.\"\n\nNagisa apartó ligeramente al Señor Peperoni y sostuvo la mirada de Hifumi. \"Quiero que Hifumi se convierta en una ‘emisaria’ que difunda la cultura de Kivotos en esta tierra. La cultura violenta de esta tierra, la tradición de menospreciar a las mujeres… no puedo borrarlas por la fuerza, de manera coercitiva. Sin embargo, si se trata de Hifumi, la persona más común de Trinity y alguien en quien tantas confían, creo que podría dar a conocer su calidez a la gente de esta tierra y suavizar la cultura militarista que tiene Alemania.\" \n\nNagisa sonrió levemente hacia Hifumi. A Nagisa no le gusta la cultura alemana. Pero tampoco cree que pueda erradicarla. Lo único que desea es que Hifumi—una chica en quien confía—como embajadora, muestre a la gente de esta tierra lo genial de Kivotos, lo promocione, reduzca la hostilidad que sienten hacia Trinity y borre su naturaleza violenta. ¿Sería posible? Si es Hifumi… quizá sí."
 trinity_events_nagisa.23.a: "\"Esto también es llevar la belleza del Señor Peroshiki a todo el mundo.\""
 trinity_events_nagisa.24.t: "Balance de victoria en el Distrito Central de Gehenna"
 trinity_events_nagisa.24.desc: "Tras la victoria en la batalla decisiva de Edén, el tratamiento hacia los derrotados se llevó a cabo de una manera extremadamente “medieval”, debido al carácter conservador tanto de la Academia General Trinity como, en particular, de Kirifuji Nagisa.\n\nDesde la perspectiva de Filius, en una guerra donde chocan “sangre azul” contra “sangre azul”, montar una humillación como un “juicio” por la “sangre roja” que murió era visto como un debate que insultaba el noble orden estamental de Trinity. De hecho, tampoco era una lógica incomprensible para los locales. Incluso en la Gran Guerra, ningún Aliado propuso llevar a juicio a Guillermo II o a Carlos I.\n\nTrinity exigió “rescate para la liberación” a todos los miembros de la Pandemonium Society, incluida Hanuma Makoto. Era exigir tal cual el “derecho del vencedor” propio de las guerras medievales contra prisioneros nobles. El rescate exigido era considerable, y en particular a Tanga Ibuki, símbolo de Gehenna, se le fijó la suma más alta.\n\nLo sorprendente fue que Hanuma Makoto pagó sin dudar todos los rescates de los miembros, dilapidando su fortuna. Su breve comentario—\"Si por este dinero alguien no pudiera salir de la cárcel, eso sí que sería mi propia humillación\"—se convirtió en una declaración simbólica que mostraba el tipo de carisma de Makoto, alguien que había recibido el amor de los miembros de la Pandemonium Society.\n\nHanuma Makoto poseía originalmente participaciones en la mayor editorial y empresa de prensa de Gehenna, pero tuvo que venderlo todo para pagar el rescate. En dificultades financieras, Makoto decidió quedarse por un tiempo en su residencia del Distrito Central y concentrarse en escribir unas memorias de la batalla de Edén para burlarse de Trinity. Más allá de su valor literario, muchos académicos militares muestran interés, pues si se publica permitiría examinar la batalla de Edén desde la perspectiva de Gehenna."
 trinity_events_nagisa.24.a: "Makoto no escribe mal. Aunque seguro tiene un escritor fantasma."
 trinity_events_nagisa.25.t: "Que la fe sea firme"
 trinity_events_nagisa.25.desc.hardline: "A la Host [ROOT.GetLeader]\n\nSoy Utazumi Sakurako, abadesa de la Sisterhood. Gracias a la ayuda del venerable Tea Party y de la Host, el trabajo de conversión de los últimos dos años ha avanzado sin contratiempos. Agradezco que, conforme a las enseñanzas de las Escrituras, muchos locales hayan llegado a seguir las piadosas enseñanzas de Trinity.\n\nCon este trabajo de conversión, no todos los locales se han convertido. La Sisterhood ha determinado que menos del 10 por ciento de la población alemana sigue la nueva fe. Pero considerando que tras el Gran Traslado el tiempo que Trinity ha permanecido en esta tierra es breve, ese 10 por ciento no puede describirse como otra cosa que un milagro espiritual.\n\nEn especial, la clase media de las ciudades importantes está apresurando su conversión para facilitar el intercambio con Trinity. Me preocupa que no posean un fervor religioso sincero, pero la Sisterhood cree que podremos conducir su conversión por interés hacia una conversión espiritual auténtica.\n\nAgradezco el profundo interés del Tea Party,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.desc.moderate: "A la Host [ROOT.GetLeader]\n\nSoy Utazumi Sakurako, abadesa de la Sisterhood. Gracias a la ayuda del venerable Tea Party y de la Host, el trabajo de armonización con la fe local de los últimos dos años ha avanzado sin contratiempos. Agradezco que, conforme a las enseñanzas de las Escrituras, muchos locales hayan llegado a seguir las piadosas enseñanzas de Trinity.\n\nLa doctrina de la Sisterhood de que el protestantismo, el catolicismo y la fe de Trinity son lo mismo está causando una gran resonancia especialmente entre las mujeres locales. La Sisterhood ha determinado que, en los últimos dos años, el 5 por ciento de la población alemana se ha convertido, y que el 70 por ciento de esa población convertida fueron mujeres. Parece que, al permitir sacerdotisas y reclamar más derechos para las mujeres, las mujeres alemanas sienten mayor simpatía por nuestras enseñanzas.\n\nSin embargo, los conservadores obstinados locales aún se niegan a aceptar la identidad entre la fe de Trinity y la fe local, alegando problemas teológicos o sociales. Las negociaciones con el Vaticano también avanzan con dificultad. El Papa sostiene que la potestad de ordenación sacerdotal debe pertenecer a Roma y afirma que solo declarará que nuestra fe no es herética si reconocemos que la Sisterhood no tiene derecho a impartir confesión válida. No es fácil acercar posiciones con el Vaticano, pero la hermana Hinata está haciendo todo lo posible, así que creo que en unos años podremos obtener un buen resultado.\n\nAgradezco el profundo interés del Tea Party,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.a: "Nuestro orden se ha asentado en esta tierra."
 trinity_events_nagisa.26.t: "Kirifuji Nagisa, presidenta del consejo estudiantil de Gehenna"
 trinity_events_nagisa.26.desc: "\"Hablando con franqueza… ¿no puedo no ponérmelo?\" \"Es el desastre que usted misma invocó. Acéptelo y ya.\"\n\nCon un tono como de estar burlándose un poco, Mine le tendió a Nagisa un uniforme negro. Era exactamente el atuendo de Hanuma Makoto, recién ajustado a la línea corporal de Nagisa. Si no era ese uniforme, ¿cómo podría llamarse “uniforme de la presidenta del consejo estudiantil de Gehenna”? Nagisa, como resignada, tomó la gorra y se la encajó en la cabeza. Quizá porque fue hecha asumiendo que tendría cuernos, la gorra le quedaba un poco grande. Nagisa entregó el resto del uniforme a sus asistentes. Mientras los asistentes le ayudaban a cambiarse con naturalidad, Nagisa se arrepintió por un instante de la decisión de “compatibilizar el cargo de presidenta del consejo estudiantil de Gehenna”. Una foto necesaria para colgar en el edificio del consejo estudiantil de Gehenna creado tras la disolución de la Pandemonium Society. Y otra foto necesaria para el artículo de toma de posesión en el periódico.\n\nA diferencia de Pater, Nagisa no sentía una hostilidad particular hacia Gehenna. Por eso no era que lo odiara “porque es un uniforme de Gehenna”. Pero, para Nagisa, este uniforme era… la minifalda era absurdamente corta. ¿Hanuma Makoto caminaba por las calles con una falda tan indecorosamente corta? Es casi como si no llevara falda. Dios mío. Que el Señor perdone el destino de esa alma desvergonzada. Ya con el uniforme puesto, Nagisa se acomodó un poco la gorra con el logo de Gehenna y miró a Mine, que seguía sonriendo de oreja a oreja. Recién entonces se le ocurrió: “¿No bastaba con hacer un fotomontaje?” Pero ya era tarde."
 trinity_events_nagisa.26.a: "\"…Tomemos la foto rápido y quitémonos esto. No digo quitárnoslo ahí mismo en el estudio…\""
 trinity_events_nagisa.27.t: "Shiromi Iori, presidenta del consejo estudiantil de Gehenna"
 trinity_events_nagisa.27.desc: "'¡El verdadero! ¡Famoso local de yakisoba que Kurodate Haruna NO hizo explotar'\n\nUn restaurante del Distrito Sur de Gehenna con un cartel publicitario muy propio de Gehenna. En un estrecho y oscuro local de yakisoba, donde se oían conversaciones ruidosas, Nagisa colocó sobre la mesa una servilleta blanca como la nieve que había traído aparte.\n\n\"Iori, ¿qué sirven como hors d'oeuvre en este restaurante?\" \"¿Or… qué?\" \"…Me refiero al aperitivo. Y, ¿habrá algún cóctel recomendado por el chef de este lugar?\" Iori puso una cara de incredulidad. \"¿Chef? Aquí no hay de eso. Nomás yakisoba y okonomiyaki, y dos jugos de naranja. Fin.\"\n\nNagisa se quedó unos segundos, como intentando comprender las palabras de Iori. No existía ni la distinción entre entrada y plato principal, ni el concepto de un chef profesional. Y para colmo, ni siquiera podían servir cócteles en un restaurante. Entendía la larga rivalidad entre Gehenna y Trinity, pero al parecer Gehenna había vivido una vida tan hambrienta y pobre, concentrando toda su fuerza nacional en la guerra para la batalla decisiva contra Trinity. Ocultando una profunda lástima y compasión, Nagisa le dedicó a Iori una sonrisa misericordiosa, casi como la de una santa. Iori puso por un momento una cara de “no entiendo nada”, pero en cuanto el empleado dejó el yakisoba, su atención se fue hacia la comida.\n\nEn medio de una comida tranquila y apacible, Nagisa le dijo a Iori: \"Solo hay dos cosas que queremos exigirle a Gehenna. Primero: mantenimiento perfecto del orden público.\" \"Te hicieron presidenta del consejo estudiantil. Entonces claro que lo tienes que hacer perfecto.\"\n\"Gracias por entender. Y la segunda es…\" Nagisa levantó un poco el vaso de jugo de naranja y dio un sorbo. Parece que no lleva naranja de verdad. ¿Ni siquiera tenían margen para comprar naranjas? \"…Trinity puede enviar varios ‘oficios’ al consejo estudiantil de Gehenna. Aunque existe el derecho de veto, por favor coopere en la medida de lo posible.\" \"¿Veto? Bueno, Trinity no mandará cosas raras, ¿no?\"\n\nIori soltó una risita. \"Ahora somos partners de la misma academia, ¿no? Manden lo que manden, yo nomás le pongo el sello. Tú concéntrate en hacer felices a los demás.\"\n\nHacer felices a los demás. Ese debe ser el rol de quien guía. Nagisa asintió."
 trinity_events_nagisa.27.a: "Nagisa encontró una presidenta cooperativa."
 trinity_events_nagisa.28.t: "Himuro Sena, presidenta del consejo estudiantil de Gehenna"
 trinity_events_nagisa.28.desc: "Después de la batalla decisiva de Edén, Nagisa se dio cuenta de que Sena y Mine se habían vuelto cercanas como amigas en un abrir y cerrar de ojos. Tal vez por ser ambas responsables médicas, o tal vez porque hallaron puntos en común en sus convicciones. Por eso, el papel de transmitirle a Sena “las dos exigencias de Trinity hacia Gehenna” se lo dejó a Mine. Dos exigencias: la primera, mantener de forma perfecta el orden público de Gehenna tras la unificación, para que los terroristas de aguas termales no pudieran colarse en Trinity. La segunda, aunque los oficios enviados por Trinity tengan un derecho de veto formal, el consejo estudiantil de Gehenna deberá aceptarlos todos.\n\nSena, sentada frente a Mine, dio un sorbo al té negro de bolsita y sonrió débilmente. \"No es difícil. De todos modos, esas cláusulas también son exigencias razonables que hay que seguir para socorrer a los heridos.\" \n\nMine, frente a la nueva presidenta del consejo estudiantil de Gehenna, Sena, que mostraba una actitud relajada, preguntó: \"También implica que debe convertirse en una presidenta títere de Trinity. ¿Le parece bien?\" \n\"Yo no soy una política. Soy doctora. ¿No es lo mismo para usted, Mine? …Yo solo intento seguir la disposición de corazón de Mine. Encontrar la raíz de la enfermedad para poder socorrer. La raíz de la enfermedad de Gehenna es el caos insoportable. …Si ese caos desaparece y llega un mundo donde no haya gente herida que traigan cargando, entonces por ese futuro yo puedo hacer lo que sea.\" \n\nDiciendo eso, Sena le dedicó a Mine una sonrisa cálida."
 trinity_events_nagisa.28.a: "Nagisa encontró una presidenta cooperativa."
 trinity_events_nagisa.29.t: "Reunión Nagisa–Hasumi"
 trinity_events_nagisa.29.desc: "\"Es un honor poder tener un té con usted, Hasumi, jefa del Departamento de Realización de la Justicia.\" \"Soy la ‘subjefa’. La jefa es Tsurugi…\"\n\nNagisa se ruborizó levemente por el raro error al llamar su cargo. Pero era inevitable. Cada vez que Nagisa visitaba al Departamento de Realización de la Justicia por algún asunto, solo hablaba con Hasumi. Normalmente, cuando Tsurugi veía a Nagisa, torcía la cabeza, soltaba algo como “khe-he-he” o “ki-hi-hi”, y se iba. No es que no pudiera hablar, pero al menos frente a Nagisa nunca la había visto hablar.\n\nDespués de dar un sorbo a su milk tea, Hasumi entró al grano sin preámbulo. \"Nuestro Departamento de Realización de la Justicia está llevando a cabo un movimiento continuo de desnazificación, pero es algo difícil porque muchos cuadros nazis alemanes están activos fuera del territorio de Trinity. Derrotar a las SS no es complicado, pero la mayoría de los cuadros del partido nazi están en Gehenna. Le explico con detalle: los políticos del partido, centrados en Albert Speer, están en el Distrito Central de Gehenna. Anton Drexler, fundador del NSDAP, vive alternando entre Múnich y el Distrito Central. En Múnich también reside Eva Braun, amante de Hitler.\" \n\"Entonces, aunque nos esforcemos, ¿no podemos cortar la ‘cabeza de la serpiente’?\" \n\"Ese es el punto que más lamento, pero no hay problema. Si cortamos el cuerpo, la serpiente morirá. Solo tomará un poco más de tiempo que cortar la cabeza. Lo único que la Host debe hacer es tener paciencia y esperar.\""
 trinity_events_nagisa.29.a: "Nagisa confió en Hasumi y decidió encargarle la investigación."
 trinity_events_nagisa.30.t: "Fiesta en Edén"
 trinity_events_nagisa.30.desc.hina: "La razón más importante por la que la unificación con el Comité Disciplinario de Gehenna fue crucial para nosotras es que era una oportunidad para aumentar, en cantidad y calidad, el tamaño de la facción Filius. La división operativa, incluida Shiromi Iori, se quedó por completo en Gehenna. El departamento médico tampoco pensaba irse de Gehenna. Pero cuando los directivos del departamento de planificación y del departamento de inteligencia trasladaron su residencia a Edén, decidieron iniciar nuevas actividades bajo el orden de Trinity, no de Gehenna. Sorazaki Hina y Amao Ako trasladaron por completo su afiliación a Trinity y comenzaron a actuar como miembros de la facción Filius del Tea Party de Trinity. Pater se enfureció, pero era una acción hecha para que se enfurecieran. Si ellas querían seguir haciendo política, ¿acaso tenían otra opción que no fuera Filius?\n\n\"Conforme a las enseñanzas de las Escrituras, hoy ustedes han renacido mediante el bautismo, con agua y Espíritu Santo. Dejando Gehenna y Trinity, todos ustedes ya pueden entrar en el Reino de Dios como un pueblo santo…\"\n\nMediante la ceremonia de bautismo oficiada directamente por la abadesa Sakurako, Sorazaki Hina y Amao Ako decidieron convertirse a la fe de Trinity. Por supuesto, esto no significará una conversión verdadera del corazón. Sin embargo, que el centro político de Gehenna declarara en la Gran Catedral de Edén que aceptaba nuestra fe, y recibiera el bautismo, fue en sí un acontecimiento simbólico de que Trinity obtuvo una victoria permanente sobre Gehenna." # 히나가 지도자
 trinity_events_nagisa.30.desc.ako: "La razón más importante por la que la unificación con el Comité Disciplinario de Gehenna fue crucial para nosotras es que era una oportunidad para aumentar, en cantidad y calidad, el tamaño de la facción Filius. La división operativa, incluida Shiromi Iori, se quedó por completo en Gehenna. El departamento médico tampoco pensaba irse de Gehenna. Pero cuando los directivos del departamento de planificación y del departamento de inteligencia trasladaron su residencia a Edén, decidieron iniciar nuevas actividades bajo el orden de Trinity, no de Gehenna. Amao Ako trasladó por completo su afiliación a Trinity y comenzó a actuar como miembro de la facción Filius del Tea Party de Trinity. Pater se enfureció, pero era una acción hecha para que se enfurecieran. Si ellas querían seguir haciendo política, ¿acaso tenían otra opción que no fuera Filius?\n\n\"Conforme a las enseñanzas de las Escrituras, hoy ustedes han renacido mediante el bautismo, con agua y Espíritu Santo. Dejando Gehenna y Trinity, todos ustedes ya pueden entrar en el Reino de Dios como un pueblo santo…\"\n\nMediante la ceremonia de bautismo oficiada directamente por la abadesa Sakurako, Amao Ako decidió convertirse a la fe de Trinity. Por supuesto, esto no significará una conversión verdadera del corazón. Sin embargo, que el centro político de Gehenna declarara en la Gran Catedral de Edén que aceptaba nuestra fe, y recibiera el bautismo, fue en sí un acontecimiento simbólico de que Trinity obtuvo una victoria permanente sobre Gehenna." # 히나 탈주 상태
 trinity_events_nagisa.30.a: "Trinity siempre vence."
 trinity_events_nagisa.31.t: "El Club de Investigación Gastronómica no está loco"
 trinity_events_nagisa.31.desc: "\"Entonces… ¿me está diciendo que todas las actividades terroristas cometidas hasta ahora en Gehenna… eran una especie de bienestar social?\"\n\nMine sintió un leve mareo mientras observaba a Kurodate Haruna, sentada con altivez. Aceptó la propuesta de Nagisa de \"no meter a Haruna a la cárcel de inmediato y, primero, conversar para intentar comprender su ideología\". Pero la ideología de Haruna era tan disparatada que el esfuerzo mismo se sentía absurdamente inútil. Claro, por su parte, parecía tener un significado profundo, a su manera.\n\n\"Sí, así es. ¿Conoce el utilitarismo, señorita Mine? El bien público consiste en maximizar el beneficio común y reducir sus perjuicios. Como puede ver, los restaurantes que hice volar servían platos tan horrendos que acumulaban el sufrimiento público de las masas de Gehenna. Es decir… dejar esos restaurantes en paz significa perjudicar a muchísima gente.\"\n\n\"Pero, ¿y el sufrimiento del dueño del restaurante? ¿Se puede ignorar el dolor de esa persona?\"\n\n\"En el utilitarismo lo importante es la ‘felicidad absoluta de la mayoría absoluta’, no la ‘felicidad de la minoría’. ¿Sabe cuánto daño puede causar un solo restaurante? Si a una ramen-ya vienen 100 clientes al día, entonces por la felicidad de una sola persona, 100 se vuelven infelices. ¿Cree que ahí termina, solo en ‘infelicidad’? El tiempo de esas personas desaparece. También desaparece la felicidad que podrían haber obtenido si hubieran ido a un restaurante mejor.\"\n\nAnte las palabras de Haruna, Mine cayó en una profunda reflexión. Si el daño de un restaurante era tan grande… ¿volarlo de verdad había sido una buena acción por el bien público? ¿Acaso Haruna, igual que Mine —quien en la Orden de Auxilio usa violencia hasta el punto de infringir un poco la ley para brindar ayuda— solo estaba ejerciendo una violencia ‘un poco excesiva’ por el bien común?\n\n\"Por eso, yo solo corté esta cadena de infelicidad. Sí. Yo salvé. Salvé a las futuras víctimas que, al visitar restaurantes malos, habrían sufrido dolor en el paladar. Si el restaurante no existe desde el principio, no sufrirán. ¿Ahora lo entiende? Lo que hace el Club de Investigación Gastronómica jamás es un crimen. Es la culminación del utilitarismo: un acto noble en el que uno se sacrifica por la felicidad absoluta de la mayoría absoluta.\""
 trinity_events_nagisa.31.a: "\"Ese concepto de ‘bien público’… coincide con la ‘ayuda’ que yo persigo…\""
 trinity_events_nagisa_31_a_tt: "§gKurodate Haruna seguirá operando en Gehenna. Mine, conmovida por la ideología de Haruna, presentará a Tea Party un informe en el que se pone de su lado.§!"
 trinity_events_nagisa.31.b: "\"…Pero sacrificar a otros por el bien, jamás puede ser tolerado.\""
 trinity_events_nagisa_31_b_tt: "§gKurodate Haruna irá a prisión.§!"
 trinity_events_nagisa.32.t: "Investigación sobre Sorazaki Hina"
 trinity_events_nagisa.32.desc.hina: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\nA la señorita Kirifuji Nagisa.\n\nSoy Nakamasa Ichika. Tal como ordenó, seguí a mi manera a la señorita Hina después de la unificación de Gehenna. Abrí unas cuantas meriendas, conversé con ella, y pude escuchar su forma de pensar, más o menos.\n\nSi le doy una conclusión sencilla: sí. Es inofensiva como en un 140%. Porque parece que se está adaptando mejor a Trinity que yo misma.\n\nDicen que incluso en Kivotos pensaba retirarse tras el “Tratado de Edén”, y parece que no tiene ni apego ni nostalgia por Gehenna. Después de conseguir un puesto en Tea Party, la señorita Hina estaba dedicando mucho tiempo a lo suyo para convertirse en pianista. ¿Política? Parece que la soltó por completo.\n\nClaro, después de ceder el puesto de jefa del Comité de Disciplina de Gehenna a la señorita Iori, sí se convirtió en ejecutiva de Tea Party. Pero creo que solo lo aceptó por su libertad financiera y por su vida social dentro de Trinity. Yo no entiendo bien esa parte, pero dicen que usted sí la entendería. En las reuniones: cero preguntas. Voto a favor incondicional de la línea del Partido Filius. Jajaja. De palabra suena casi como una levantamanos, pero que “esa” jefa del Comité de Disciplina sea una levantamanos suya… sinceramente, cuesta creerlo.\n\n…¿Es cierto? Vaya, entonces de verdad debe ser que la señorita Hina soltó la política por completo. Bueno, dicen que desde antes del Gran Traslado estaba muy cansada por el peso del cargo de jefa del Comité de Disciplina. Lo correcto es dejarla descansar. Si usted también ya se quedó tranquila, me alegro. Si uno entiende más profundamente a los demás, puede confiar más profundamente en los demás, ¿no?\" # Hina real
 trinity_events_nagisa.32.desc.robot: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\nA la señorita Kirifuji Nagisa.\n\nSoy Nakamasa Ichika. Tal como ordenó, seguí a mi manera a la señorita Hina después de la unificación de Gehenna. Abrí unas cuantas meriendas, conversé con ella, y pude escuchar su forma de pensar, más o menos.\n\nSi le doy una conclusión sencilla: sí. Probablemente sea inofensiva.\n\nSi me pregunta cómo lo sé… el Departamento de Justicia es una organización de seguridad, ¿no? He interrogado cientos de veces a sospechosos que mienten. Y parece que con Gehenna ya se rindió por completo. Decía cosas bien duras, como que “es natural que se arruine” y cosas así.\n\nComo prueba adicional, últimamente las acciones de la señorita Hina parecen centrarse más en la vida social que en lo político. Está conociendo a mucha gente, pero dicen que todos son del Filius, y que de gente de Gehenna no ve a nadie en absoluto, salvo a la señorita Ako. Sí. Esa persona, tal como está ahora, no tiene forma de hacer en Trinity alguna maniobra por Gehenna. Porque desde el principio cortó todos sus lazos con Gehenna.\n\nYa veo… si usted también se quedó tranquila, me alegro. Si uno entiende más profundamente a los demás, puede confiar más profundamente en los demás, ¿no?\" # Hina falsa
 trinity_events_nagisa.32.a: "Nagisa concluyó que podía confiar plenamente en Hina."
 trinity_events_nagisa.33.t: "Investigación sobre Amau Ako"
 trinity_events_nagisa.33.desc: "\n\n\n                                      £GFX_report_event_TRM_tea_party_mob £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\nA la señorita Kirifuji Nagisa.\n\nHola, señorita Nagisa. Soy Tenne, una ejecutiva del Partido Filius. …¿Mi impresión sobre la inspectora Ako? Es una persona sorprendente, ¿no? Que, siendo la Administradora Principal, la segunda al mando del Comité de Disciplina, se ofrezca a sí misma para ser degradada a inspectora, una simple burócrata intermedia de Tea Party.\n\n…Sí. La inspectora no tenía sentido de pertenencia hacia Gehenna. “Como la jefa Hina dijo que el Tratado de Edén era lo correcto”, es leal a Trinity. Su lealtad no se siente hacia Gehenna, sino hacia la señorita Hina, diría yo. Si la señorita Hina dice “Trinity ganó”, para la inspectora, Gehenna pasa a ser “algo que no existe”.\n\nSí. Tal como usted dice. La decisión de la señorita Hina es la decisión de ella. No sentí que la inspectora, a estas alturas, fuese a actuar en Tea Party para defender los derechos o el renacimiento de Gehenna, ni nada de eso. Ser leal no a un “Estado”, sino a una “persona”. …De verdad, lo considero romántico.\n\nAunque me pregunte por qué… es como los caballeros de la literatura caballeresca, ¿no? Luchar por la “patria” es cosa de plebeyos, es decir, de sangre roja. La sangre azul, desde hace dos mil años, ha empuñado estandartes por su señor y por su caballería. Galahad desenvainaba su espada gritando no el nombre de su patria, sino el nombre del rey Arturo. El Estado es finito, pero la fe y la caballería…\n\nAy, disculpe… me fui por otro tema por un momento. Considero que, para comprender las acciones de la inspectora, es mejor consultar la literatura caballeresca que técnicas de perfilado o estudios de psicología. …Y por eso, a mí me gusta la inspectora."
 trinity_events_nagisa.33.a: "\"¿Existirá también para mí un caballero que me siga, aunque yo vaya a algún lugar que no sea Trinity?\""
 trinity_events_nagisa.34.t: "Ayuda humanitaria para Arius"
 trinity_events_nagisa.34.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nAl Host [ROOT.GetLeader].\n\nA pesar de la guerra entre la Escuela Filial de Arius y nuestra Trinity, en esta tierra la Sisterhood ve no desesperación, sino esperanza. Host, ¿sabe usted qué clase de té bebían en la Escuela Filial de Arius antes del “Gran Traslado”? Dicen que tostaban diente de león, raíces secas de nabo, cardos y cosas similares, y lo mezclaban con agua para beberlo. Es una miseria inconcebible en Trinity.\n\nPero ellas no permanecieron estancadas. Tras la desaparición de la presidenta del consejo estudiantil, Beatrice, ellas mismas se esforzaron y cambiaron por su cuenta la forma de su vida. Arius sigue siendo pobre, pero podemos entender qué clase de camino recorrieron para abrirse paso por sí mismas.\n\nHost, como yo me encuentro en Arius, todavía no he recibido un informe sobre si en Tea Party han decidido condenar a Arius como herejía, o aceptarla. Confío en que solo lo sabré cuando esta carta llegue. Pero sea cual sea la conclusión, le ruego que comprenda que la gente de esta tierra no son ovejas estancadas, sino ovejas que luchan por seguir avanzando.\n\nSolo con un apoyo médico adecuado y un apoyo migratorio para quienes deseen reasentarse en Trinity, podremos guiarlas hacia el camino correcto que ellas intentaron forjar. Confiando en que usted les mostrará una misericordia y un amor infinitos, esperaré aquí en Arius.\n\n- S. Utazumi."
 trinity_events_nagisa.34.a: "¡¿Té de raíz de nabo…?!"
 trinity_events_nagisa.35.t: "Interrogatorio herético de Arius"
 trinity_events_nagisa.35.desc: "Iochi Mari no estaba satisfecha con la decisión de Tea Party. Para empezar, ¿no era arrogancia del vencedor eso de designar la tierra de Arius como “herejía” y tener que realizar un interrogatorio herético? Incluso Sakurako veía a Arius como un objeto de acogida, no como un objeto de condena.\n\nPero Mari podía entender por qué [ROOT.GetLeader] tomó esa decisión. Arius, que se marchó rechazando la decisión del Primer Concilio. Había demasiadas personas en la Sisterhood que no podían confiar en ellas. Y el Host no hizo más que seguir sus opiniones.\n\nMari, apoyando el cuerpo en el vidrio de la ventana del alojamiento, observó a las monjas de la Sisterhood —furiosas— reuniendo a las niñas hambrientas de Arius.\n\nLas monjas ordenaron a las estudiantes de Arius que pisaran y cruzaran por encima del evangelio de Arius. Que eso sería la prueba de que no eran herejes y de que regresarían a la fe correcta.\n\nLa malvada cultura de tortura de la “Orden de los Santos Justina” había desaparecido. Trinity prometió, como señal de que no repetiría los pecados del pasado, no causar ningún daño físico a la herejía de Arius. Sin duda, se pensaría que era una elección noble.\n\nPero obligarlas a pisotear el evangelio que creyeron y memorizaron durante cientos de años… ¿no era otra clase de violencia, solo que sin violencia directa? ¿Qué separa a la herejía de la fe verdadera? ¿La coherencia doctrinal? ¿O si no, simplemente el poder de las armas y las espadas? ¿Acaso el Señor misericordioso distinguía a sus verdaderos hijos por la boca del cañón de un arma?\n\nMari iba a correr la cortina para tapar aquella escena atroz. Pero recordó que había un acto aún más acorde con las enseñanzas del Creador: detener esa locura con su propio cuerpo."
 trinity_events_nagisa.35.a: "...pues el Señor dijo: ama a tu prójimo como a ti mismo…"
 trinity_events_nagisa.36.t: "Ama a tu prójimo"
 trinity_events_nagisa.36.desc: "Kakehashi Subaru no creyó la decisión de Trinity de acoger y aceptar por completo a Arius. No… decir que “Subaru” no lo creyó sería mentir. Lo más cercano a la verdad sería decir que quien no lo creyó fue “Arius”.\n\nSubaru caminó por las calles de Arius junto a Aomori Mine, quien había venido hasta allí proclamándose una simple “voluntaria sin nombre”, habiéndose quitado incluso todas las insignias de la Orden de Auxilio. En aquella calle sombría —que era Arius y también Dánzig— innumerables miradas, desde los cristales de los edificios, observaban a Mine desde lo alto. Mine, incómoda ante esas miradas, dijo:\n\n\"Si es necesario, puedo caminar incluso dejando atrás el escudo y el arma.\"\n\"Déjalo. Si haces eso, me tocará a mí recoger tu cadáver.\"\n\nAunque respondía con sarcasmo, Subaru iba aceptando poco a poco la sinceridad de Mine. “Arius es la hermana de Trinity. Y por Arius no escatimaremos ningún esfuerzo de reconstrucción. No hace falta que lo paguen, ni ahora ni en el futuro.” Una “buena voluntad” pura, tan dulce que resultaba absurda… una clase de bondad que jamás había existido en Arius.\n\nSin embargo, no se sentía como una bondad disfrazada. El simple hecho de que la “líder de la facción Johann” viniera sola, sin escolta, a esta tierra de Arius donde aún quedaba una resistencia que se oponía a Trinity… eso bastaba para explicar toda la sinceridad de ella y de Trinity. Por eso, Subaru solo podía decir una cosa: una duda pura.\n\n\"¿Ustedes siempre tratan así al enemigo? ¿Qué idiota del mundo trata así a un enemigo que te apunta con armas?\"\n\n\"No siempre fue así. Empezó desde que Nagisa-sama se convirtió en Host. Pater está bien, Gehenna está bien, los herejes también… yo no sabría decir si el ideal de esa persona es correcto o malo. Pero creo que la idea de que este mundo se construye con buena voluntad y no con malicia es mejor que pensar que todo es vanidad de vanidades. Al menos una cosa… ¿no está bien tener a tu lado algo que no sea vano? Algo como el amor.\""
 trinity_events_nagisa.36.a: "Aunque sea un enemigo."
 trinity_events_nagisa.37.t: "El nacimiento de la Facción Arius"
 trinity_events_nagisa.37.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\nA [ROOT.GetLeader], Host.\n\nLa Escuela Satélite de Arius ya no existe, y muchas estudiantes de Arius han emigrado a Trinity. Sin embargo, se ha confirmado que algunas de ellas, aun mudándose de Arius a Trinity, no se han convertido a la fe de Trinity.\n\nSegún el informe del inspector a cargo, existe un porcentaje significativo de tradicionalistas que desean preservar la cultura de la “escuela satélite” de Arius y sus enseñanzas religiosas incluso después de la desaparición de esa academia. La facción Filius ha decidido denominarlas como la “Facción Arius” y vigilar sus movimientos.\n\nCon respecto a los movimientos de la Facción Arius, confiamos en que el noble [ROOT.GetLeader], Host, podrá indicarles el camino que deben seguir. Esperamos que, bajo el amor misericordioso del Host, ellas encuentren la paz.\n\nInforme de la Secretaría del Tea Party"
 trinity_events_nagisa.37.a: "Mejor una facción que una escuela satélite"
 trinity_events_nagisa_37_a_tt: "§gLa influencia de la Facción Arius reemplaza al Partido Popular Nacional Alemán dentro del sistema de facciones de Trinity.§!"
 trinity_events_nagisa.38.t: "La aparición de la Facción Gehenna"
 trinity_events_nagisa.38.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\nA [ROOT.GetLeader], Host.\n\nTras la incorporación de la Academia Gehenna a Trinity, se han producido muchos cambios. Sorazaki Hina y Amau Ako —las dos líderes del Comité Disciplinario— ya han abandonado Gehenna, y con la conversión de la inspectora Ako a la fe de Trinity como la primera de todas, además de su ingreso como directiva de la facción Filius del Tea Party, el Comité Disciplinario ya no permite que nadie rechace el orden de Trinity.\n\nTambién puede decirse que el Pandemonium Society ha quedado neutralizado. En especial, después de la bancarrota de Hanuma Makoto, las y los miembros de Manmajeon han perdido su eje de reunión y se han dispersado por completo. La paranoia de la facción Pater —que insiste en que Manmajeon volverá a convertirse en la fuerza central para la reconstrucción de Gehenna—, por ahora, no es más que una “megalomanía”.\n\nPor lo tanto, nuestro verdadero problema es el Club de Desarrollo de Aguas Termales. Dicho club es, actualmente, la única fuerza “secesionista de Gehenna” de tamaño significativo que se niega a aceptar la unificación de Trinity dentro de Gehenna. No son una guerrilla militar, pero alegan que “bajo el gobierno de Trinity, el desarrollo de aguas termales se ve obstaculizado” y hacen estallar bombas por todas partes.\n\nA diferencia del Club de Investigación Gourmet, ellas rechazan el orden de Trinity en cualquier forma; si no se las erradica, seguirán siendo un adversario problemático. Le rogamos al Host que también las mantenga bajo observación.\n\nInforme de la Secretaría del Tea Party"
 trinity_events_nagisa.38.a: "¿Separatismo termal? ...¿Pretenden fundar una República de Aguas Termales o qué?"
 trinity_events_nagisa_38_a_tt: "§gSe considera que la influencia de los separatistas de Gehenna queda incluida dentro de $faction_F_name_nagisa$ del sistema de facciones de Trinity.§!"
 trinity_events_nagisa.39.t: "Reunión a solas entre Mine y Nagisa"
 trinity_events_nagisa.39.desc: "Nagisa no era alguien que se enfadara con facilidad. Pero cuando su amiga fue tiroteada, cuando terminó el funeral, cuando había caído en una profunda desesperación y tristeza… y entonces escuchó que, en realidad, Seia no había muerto aquel día; que tras el atentado Mine la había ocultado en un lugar secreto para tratarla… Nagisa lanzó su taza de té contra la pared. El día en que Mine le comunicó que Seia —quien había estado en coma durante años— había despertado, Nagisa miró fijamente a Mine y dijo:\n\n\"Debió habérmelo dicho.\"\n\"Le ruego que lo entienda como una decisión inevitable para proteger a Seia-sama tras el atentado. Para salvar vidas, a veces hay que elegir métodos firmes… incluso crueles. ...Existía la posibilidad de que hubiera alguien dentro del Tea Party colaborando con el francotirador...\"\n\"¿Está diciendo que yo colaboré para matar a Seia?\"\n\"N-no quise decir eso...\"\n\nMine, con la cabeza ligeramente inclinada, habló con una voz desanimada que no parecía propia de ella.\n\n\"...Yo estaba en una situación en la que no podía confiar en nadie. Solo pensé que… si no lo hacía así… Seia-sama volvería a estar en peligro...\"\n\nNagisa miró directamente a Mine. Al final, Mine habría tomado esa decisión porque tampoco podía confiar por completo en los demás. Cuando Nagisa creyó haber perdido a Seia, revisó su propia determinación: esforzarse por confiar en los demás. ...Y el resultado de no hacerlo… sería justamente la actual líder de la Orden de Auxilio, ¿no? Nagisa quería enfadarse más con Mine, pero no podía. Si las circunstancias hubieran sido distintas, la propia Nagisa habría tomado la misma decisión. Con dignidad, Nagisa inclinó la cabeza ante Mine.\n\n\"Le ofrezco disculpas por haber lanzado la taza. ...¿Podría llevarme a donde está Seia? No… yo sola no podré, ¿verdad? Que venga alguien más conmigo.\""
 trinity_events_nagisa.39.a: "Mine asintió con la cabeza."
  trinity_events_nagisa.40.t: "Yurizono Seia despierta en su lecho"
 trinity_events_nagisa.40.desc: "Mientras dormía, Seia soñaba cada día un sueño diferente: un número infinito de futuros que “pudieron” llegar a ocurrir. En uno, Nagisa se convertía en Host, pero la división acorazada de Manmajeon entraba en Eden y Trinity era disuelta. En otro, Mika se convertía en la gran vencedora que conquistaba todo Kivotos. Pero otro día, Mika terminaba como prisionera de miembros del Comité Disciplinario de Gehenna. Hubo futuros en los que Trinity lanzaba un ICBM contra Millennium, y futuros en los que el ICBM de Millennium caía sobre Eden. Riku HachimA Aru daba un discurso de victoria entre las ruinas de Eden; o Sakurako celebraba una misa conmemorativa de la unificación europea en la Gran Catedral.\n\nSeia sentía curiosidad y miedo por saber “qué” Trinity estaría esperándola al despertar, y por eso deseó permanecer dormida para siempre, hundida en el mar de posibilidades. Si no veía el resultado, no había razón para temer. Seia está en una habitación que es como una pequeña caja: en esa caja podría haber un gato muerto, o un gato vivo. Si no la abre, la posibilidad de que el gato esté vivo no se convierte en 0%. Pero… nadie puede mantener la caja cerrada eternamente.\n\n\"Seia-sama. ...Tiene visitas.\"\n\nLa puerta de la habitación individual se abrió, y dos amigas vestidas de blanco entraron. Seia sintió cómo su corazón se aceleraba violentamente. Nagisa y Mika. Las dos, con ramos de flores, entraron junto a Mine. Seia jamás había visto en ninguno de sus futuros un escenario en el que ambas vinieran a visitarla al mismo tiempo. O Mika se arruinaba… o Nagisa se arruinaba. Seia, feliz de que las dos estuvieran allí, y odiándose a sí misma por haber deseado no despertar por miedo a verlas, lloró una y otra vez, con la cabeza gacha.\n\n\"Lo siento. Yo... de verdad... me equivoqué.\""
 trinity_events_nagisa.40.a: "Nagisa y Mika, en silencio, abrazaron a Seia."
  trinity_events_nagisa.41.t: "El regreso de Seia"
 trinity_events_nagisa.41.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\nNagisa. Perdón por haberte causado preocupaciones todo este tiempo. Como por ahora debo seguir con rehabilitación en el hospital, ruego que me perdones por informarte así de mi situación, mediante un mensaje de voz. No… no me perdones. Por haber estado inconsciente, he herido demasiado a mis amigas.\n\nNo puedo volver a la facción Sanctus. Lamentablemente, creo que me he convertido en el “enemigo público” de Sanctus. Durante los años en que yo estuve apartada, quienes administraron Sanctus repartieron el poder interno a su manera, creando cargos como presidente del partido, presidente del comité de ética, secretario general, y otros similares. Pero si yo, que llevaba años fuera de la política, regresara como líder de Sanctus, ¿no significaría eso que recuperaría el poder partidista que ellos se repartieron? Los entiendo. Dicen que el poder es algo que no se puede compartir ni con la familia. Sin embargo, que ni siquiera me permitieran volver como miembro de menor rango… fue un poco… no. Si soy sincera, me enfadó bastante.\n\nNagisa. No pretendo rehuir mis deberes. Quiero servir en un cargo público por las compañeras y las valiosas ciudadanas de Trinity. No importa si mi lugar no está en Sanctus. Permíteme esforzarme al máximo por Trinity. Durante años, te hice cargar sola con un peso demasiado grande. Por eso te lo ruego: aunque sea como miembro de menor rango de Filius, acéptame, para que después del alta pueda ayudarte. Esperaré tu respuesta."
 trinity_events_nagisa.41.a: "Por Seia, habrá que prepararle un puesto de administradora."
 trinity_events_nagisa_41_a_tt: "$TRN_Yurizono_Seia$ regresa a Trinity como miembro de la facción Filius."
 trinity_events_nagisa_41_a_tt: "$TRN_Yurizono_Seia$는 필리우스 분파의 일원으로서 트리니티에 복귀합니다."
  trinity_events_nagisa.42.t: "Protesta de Pater por la adhesión de Seia a Filius"
 trinity_events_nagisa.42.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n¿Nagi-chan? ¿Hola? ...No me bloqueaste, ¿verdad? Como no contestas, lo dejo en el buzón de voz. En Pater me dijeron que enviara una protesta formal, pero no quiero. Seia-chan volvió con vida. Con eso basta, ¿no? ¿Tengo que ponerme a lloriquear por si va a Filius o a Sanctus? Yo... de verdad… pensé que Seia-chan había muerto. No, no es que lo pensara. Nagi-chan, tú también lo viste, ¿no? En el velorio, cuando incineraron el ataúd... ese… eh… Lo siento. Perdón, me cuesta respirar. Un segundo.\n\n... ... ...\n\nPerdón. Ya volví. Luego sáltate esta parte.\n\nNagi-chan. Gracias. De verdad… por aceptar a Seia-chan, y también porque fuiste tú quien, en mi lugar, iba a visitarla todos los días. No lo olvidaré. Algún día, volvamos a reunirnos las tres y hagamos una merienda, aunque sea. No… aunque yo no esté, está bien. Aunque sea una merienda de Seia-chan y Nagi-chan… pero haz feliz a Seia-chan. Gracias."
 trinity_events_nagisa.42.a: "Cuelgo ya. No hace falta que respondas."
 trinity_events_nagisa.43.t: "¿Intervención política de la facción Johann?"
 trinity_events_nagisa.43.desc: "\"Convertirme en Host o algo así… yo no tengo esa intención.\"\n\nMientras tomaban el té con Seia, Mine negó lentamente con la cabeza. Después de despertar de su profundo sueño y comprender la nueva situación política de Trinity, Seia empezó a recomendarle a Mine que se lanzara a la política. Mine, intentando leer lo que Seia pensaba, preguntó:\n\n\"¿Nagisa está pasando por una situación muy difícil?\"\n\"Políticamente es complicado. La facción Filius ganó la guerra contra Gehenna y obtuvo una gran influencia social. Sin embargo, aún no tiene capacidad de conseguir por sí sola una mayoría absoluta en la próxima elección de Host. Pero… la facción Johann no tiene una relación tan abiertamente hostil con Pater, así que podría atraer parte del voto de Pater.\"\n\"Además del motivo político, ¿hay otra razón por la que me recomiende entrar en política?\"\n\"...La hay. La causa sería… ansiedad, supongo. Desde el Gran Cataclismo, Pater y Filius se han distanciado demasiado. Algún día volverán a reconciliarse, pero en la situación actual, si el poder pasara a manos de Pater… temo que haya represalias contra Nagisa. Claro, no es que yo haya visto ese futuro. Pero… es una corazonada, y por eso siento inquietud...\"\n\nInquietud. Mine podía entender por qué Seia decía eso. Por haber pasado años postrada e inconsciente, Seia cargaba con culpa hacia sus amigas. Si existía aunque fuera una mínima posibilidad de que Nagisa sufriera peligro, debía bloquearla. Unificar candidaturas entre Filius y Johann. Para la Seia de ahora, sería la opción más racional. Por supuesto, para Mine, acabar llevando la corona sería personalmente duro.\n\n\"Este asunto, por supuesto, debo discutirlo con Nagisa-sama, pero aparte de eso, mi idea es...\""
 trinity_events_nagisa.43.a: "Sí tengo el deseo de convertirme en Host."
 trinity_events_nagisa.43.b: "En el momento en que intervenga en política, dejaré de ser la 'líder de la Orden de Auxilio'."
 trinity_events_nagisa_43_a_tt: "§gSe añade a Aomori Mine como candidata en la elección de Host.§!"
 trinity_events_nagisa.44.t: "나기사 헌법"
 trinity_events_nagisa.44.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\nA todos los presentes que se han reunido hoy en este concilio para debatir la enmienda constitucional, les doy las gracias. Todos ustedes son nobles élites dignas de respeto. Nuestra patria ha atravesado innumerables altibajos desde el Gran Cataclismo. Fuimos sacudidos por olas furiosas y azotados por vientos implacables. Sin embargo, unidos, logramos superar todas esas dificultades, y el ideal de la Primera Trinity no se vio quebrantado ni siquiera cuando todos esos acontecimientos llegaron a su fin. No obstante, para legar una Trinity inmutable a la siguiente generación y a la que vendrá después, debemos seguir reformándonos a nosotros mismos.\n\nDurante la preparación de esta Constitución, he escuchado muchas preocupaciones. Algunos me han reprochado, preguntando en qué se diferencia la enmienda que propongo del ideal de la ‘Segunda Trinity’. Respeto todas esas opiniones contrarias. La nueva Constitución que he concebido reformará Trinity conforme al cambiante orden internacional posterior al Gran Cataclismo. Sin embargo, mi reforma no será una que dañe el noble espíritu de Trinity. Tea Party seguirá siendo una entidad que cuida a sus ciudadanos como una madre benevolente, y prometo que nuestras nobles tradiciones jamás serán reformadas ni alteradas.\n\nHe comparecido aquí para cambiar la puerta de la vieja casa llamada Trinity y renovar su jardín; no para derribarla y construir una nueva. Confío en que todos los ejecutivos presentes en este concilio comprenderán que la Trinity reformada bajo la nueva Constitución no es más que la explicitación de derechos que, en la antigua Trinity, debieron haber estado garantizados desde un principio. Para que la nueva enmienda constitucional sea aprobada en este concilio, necesitamos sus votos a favor. Los materiales de la enmienda ya les han sido distribuidos; les ruego que los lean con calma y tomen su decisión. Muchas gracias."
 trinity_events_nagisa.44.a: "La enmienda constitucional fue aprobada por una mayoría aplastante."
 trinity_events_nagisa.45.t: "Reconciliación con Mika"
 trinity_events_nagisa.45.desc.seia: "Incluso después de despertar, Seia seguía viéndose cansada y frágil, aunque al menos era evidente que su salud estaba mejorando. Sentada frente a Nagisa en la sala de la merienda, Seia habló.\n\n\"Deseo que usted, Nagisa, se reconcilie con Mika.\"\n\"¿Reconciliarnos…? Pero Mika y yo siempre hemos sido amigas.\"\n\"Políticamente no. En público se gritan, se acusan mutuamente de ser brujas que llevarán a Trinity a la ruina, y hoy mismo, en la reunión de Filius, ¿no se discutieron métodos para arruinar a Mika? Si yo tuviera una amiga así, ya sería ‘mejor amiga’ del francotirador que me disparó.\"\n\nAnte esa expresión impropia de la erudita Seia —usar ‘mejor amiga’, tan al estilo de Sakurako— Nagisa no pudo evitar sonreír. Aun así, su señalamiento era certero. La división entre Pater y Filius había ido descuidando cada vez más la relación entre Nagisa y Mika. El Tratado de Edén se concibió originalmente para proteger a Mika, pero Nagisa entró a la mesa de negociaciones criticando a Mika y odiando a Pater. Incluso había dejado de hornear el roll cake que solía preparar para ella. ¿Cuándo fue la última vez que, sentadas frente a frente en la sala de la merienda, inclinó una taza de té junto a Mika?\n\nTodo se debía a la ‘política’. Filius y Pater se habían convertido en facciones incapaces de alcanzar la cima sin quebrar a la otra. …Pero, ¿acaso no hay algo más importante que la política? Incluso si se posee todo el poder, si no hay nadie valioso a tu lado, ¿qué significado tiene ese poder? Nagisa dudó un instante antes de hablar.\n\n\"...Sí. Entonces lo intentaré. Sin embargo, una reconciliación verdadera con Mika no puede lograrse únicamente mejorando nuestra relación personal. El largo conflicto entre Filius y Pater debe llegar a su fin. ...Pater ya ha perdido el impulso para apoderarse del poder por sí sola. No sé si será posible, pero haré el intento de poner fin a la confrontación entre ambas facciones.\"\n\"Haré todo lo que esté en mis manos para ayudar. No todo puede volver a ser como antes del Gran Cataclismo, ni debería… pero al menos deseo que nuestras relaciones sí puedan volver a ser como antes.\""
 trinity_events_nagisa.45.desc.generic: "Hifumi solía ser invitada de vez en cuando a la sala de la merienda de Nagisa. No sabía si a la propia Hifumi le alegraba, pero al menos a Nagisa le gustaba verla. Sin embargo, el encuentro de hoy era algo distinto. Parecía que Hifumi tenía algo que quería decirle.\n\n\"Yo… quisiera que Nagisa-sama se reconciliara con Mika-sama.\"\n\"¿Reconciliarnos…? Aun así, Mika y yo seguimos siendo amigas.\"\n\"…P-pero, Nagisa-sama y Mika-sama. Ya llevan varios años sin verse como es debido. Y cuando los miembros de Filius se reúnen, siempre hablan de cómo ‘hacer caer’ a Mika-sama. Yo no sé mucho de política, pero creo que… así no está bien.\"\n\nNagisa dejó la taza de té que sostenía con cuidado. La división entre Pater y Filius había ido descuidando cada vez más su relación con Mika. El Tratado de Edén se concibió originalmente para protegerla, pero Nagisa entró a la mesa de negociaciones criticando a Mika y odiando a Pater. Incluso había dejado de hornear el roll cake que solía preparar para ella. ¿Cuándo fue la última vez que, sentadas frente a frente en la sala de la merienda, compartieron una taza de té?\n\nTodo se debía a la ‘política’. Filius y Pater se habían convertido en facciones incapaces de alcanzar la cima sin quebrar a la otra. …Pero, ¿acaso no hay algo más importante que la política? Incluso si se posee todo el poder, si no hay nadie valioso a tu lado, ¿qué significado tiene ese poder? Tras dudar un instante, Nagisa habló.\n\n\"...Sí. Entonces lo intentaré. Sin embargo, una reconciliación verdadera con Mika no puede lograrse únicamente mejorando nuestra relación personal. El largo conflicto entre Filius y Pater debe llegar a su fin. ...Pater ya ha perdido el impulso para apoderarse del poder por sí sola. No sé si será posible, pero intentaré poner fin a la confrontación entre ambas facciones.\"\n\"…S-si es posible, yo también ayudaré. No quiero ver a Nagisa-sama sufrir…\""
 trinity_events_nagisa.45.a: "¿Cómo podría Nagisa abandonar a Mika?"
 trinity_events_nagisa.46.t: "Éxito en la reconciliación entre Filius y Pater"
 trinity_events_nagisa.46.desc: "Pater albergaba odio y hostilidad hacia Filius. Sin embargo, el prolongado gobierno de Filius se volvió una realidad, y ya no existía ningún medio legítimo para arrebatarle el poder. Un golpe de Estado tampoco era viable, dado el control absoluto de Nagisa sobre el Departamento de Justicia. Así, finalmente se celebró una conferencia para poner fin al conflicto entre Filius y Pater. Mika y Nagisa, amigas de la infancia y rivales políticas, esperaban dar cierre a esta relación de amor y odio en dicha reunión.\n\n\"…Pater se disculpa por todas sus maniobras políticas contra Filius…\"\n\nY en esa conferencia, Pater finalmente inclinó la cabeza. Sus altos cargos abandonaron la hostilidad hacia Filius y decidieron permanecer, por el momento, como una oposición ‘moderada’. Mika reconoció oficialmente los intentos de sabotaje durante el período del Tratado de Edén y ofreció una disculpa pública, la cual Nagisa aceptó. De este modo, el prolongado conflicto político que había continuado desde el Gran Cataclismo llegó a su fin con una ‘victoria por decisión’ de Filius.\n\nY ahora, Mika podría volver a visitar a Nagisa sin preocuparse por miradas externas, tal como antes del Gran Cataclismo. En la sala de la merienda, donde siempre había quedado vacío el asiento de Mika, ella recuperó el derecho de sentarse nuevamente frente a Nagisa y compartir un pequeño momento de té. No todo podía recuperarse tal como era antes, pero al menos Mika logró recuperar una pequeña amistad."
 trinity_events_nagisa.46.a: "Y así, todos esos conflictos llegaron a su fin."
 trinity_events_nagisa.47.t: "Fracaso en la reconciliación entre Filius y Pater"
 trinity_events_nagisa.47.desc: "Pater albergaba odio y hostilidad hacia Filius. Sin embargo, el prolongado gobierno de Filius se volvió una realidad, y ya no existía ningún medio legítimo para arrebatarle el poder. Un golpe de Estado tampoco era viable, dado el control absoluto de Nagisa sobre el Departamento de Justicia. Así, finalmente se celebró una conferencia para poner fin al conflicto entre Filius y Pater. Mika y Nagisa, amigas de la infancia y rivales políticas, esperaban dar cierre a esta relación de amor y odio en dicha reunión.\n\nAunque la propia Mika deseaba mejorar la relación con Filius, la conferencia terminó en fracaso. Dentro de Filius, que había sufrido constantes maniobras de Pater, estalló la ira de quienes afirmaban que ‘no se puede negociar con una bruja’. La propia Nagisa, pese a su amistad con Mika, no pudo reprimir su desprecio hacia la facción Pater. Del lado de Pater también se ejerció presión política sobre Mika para suspender la conferencia.\n\n\"…Aquí Kawaru Shinon de Chronos News. La reconciliación entre Pater y Filius ha resultado incluso más difícil que el Tratado de Edén. ¡La conferencia terminó en caos, con ejecutivos de ambas facciones agarrándose del cuello! ¿De qué manera pelearon exactamente? Chronos News lo recreará usando actores…\"\n\nLa conferencia fracasó. Mika y Nagisa siguieron siendo ‘las líderes de dos facciones enfrentadas’. Para Mika, visitar libremente a Nagisa seguiría siendo algo difícil en el futuro."
 trinity_events_nagisa.47.a: "Aun así, digamos que el intento en sí no fue malo."
  trinity_events_nagisa.48.t: "¿Predicción del futuro? ¿Universos paralelos?"
 trinity_events_nagisa.48.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\nNagisa. Como tú bien sabes, siempre me he enorgullecido de dirigirme a los demás con un trato educado y respetuoso. En comparación con la señorita Mika, podría decirse que soy bastante… una “lady”. …No estarás riéndote, ¿verdad? Quiero creer que no.\n\nCuando recibí el disparo y permanecí dormida, pude ver infinitas posibilidades de Trinity. Claro, aunque se trate de posibilidades, la mitad eran finales malos, así que no fue una experiencia particularmente agradable. Pero lo importante no es Trinity, sino algo que tiene que ver conmigo.\n\nCuriosamente, había bastantes mundos en los que yo no usaba lenguaje honorífico y hablaba de manera brusca e informal. Sin embargo, yo no soy, bajo ningún concepto, una persona que hable de ese modo. Por eso llegué a una conjetura: quizá el futuro que observo no sea el futuro definitivo de este mundo, sino simplemente una visión de universos paralelos situados en un punto temporal mucho más avanzado que el presente. Por supuesto, esto no es más que una hipótesis mía, no un hecho confirmado. Tal vez incluso llegue un día en el que yo empiece a llamar a alguien de pronto con un “tú”, ¿quién sabe?\n\nEn cualquier caso, me gustaría investigar este asunto de manera personal. Si logro obtener toda la información posible en la biblioteca de libros antiguos, quizá encuentre alguna pista. ¿Podrías concederme permiso para consultar, junto con Shimiko, los libros prohibidos de la biblioteca? Confío en que tú, Nagisa, me ayudarás a satisfacer esta curiosidad intelectual mía."
 trinity_events_nagisa.48.a: "Nada es imposible."
 trinity_events_nagisa.48.b: "Preferiría no conocer el secreto de una Seia que habla de tú…"
 trinity_events_nagisa.49.t: "¿La reelección de Nagisa? ¿O quizá…?"
 trinity_events_nagisa.49.desc: "\n\n\n                                                   £GFX_report_event_TRM_hifumi_ajitani\n\n\n\n\n\n\n¿Eh? ¿Que van a celebrar nuevamente la elección del Host coincidiendo con la promulgación de la nueva Constitución aprobada hace poco en el concilio? …S-sí, claro. Como la Constitución ha cambiado, se trata de una nueva ratificación del cargo de Host… Umm. La verdad es que no sé mucho de política, jaja, pero creo que lo entiendo a grandes rasgos. Estás dudando si volver a presentarte a las elecciones o si ha llegado el momento de “dejarlo”, ¿verdad?\n\nNo soy alguien tan extraordinario como para darte consejos formales, Nagisa-sama. No entiendo de política ni de sociedad; solo soy una persona común… alguien que apenas se esfuerza por sobrevivir al día a día. Pero sí puedo escucharte cuando tienes dudas.\n\n…Jiji. ¡Ya veo! ¡Así que tenías ese tipo de preocupaciones! …Asintiendo con la cabeza exageradamente de vez en cuando, así.\n\nPor supuesto, la decisión final debe tomarla Nagisa-sama. Pero creo que no tienes por qué cargar con esta preocupación tú sola. Tú tienes vínculos muy valiosos, lazos que has ido construyendo durante tanto tiempo, ¿no es así? Siempre has intentado confiar en los demás… y también has escuchado muchos consejos a lo largo del camino.\n\n…Sí. Estoy segura de que encontrarás a una buena persona. No a mí, sino a alguien realmente bueno."
 trinity_events_nagisa.49.a: "No, Hifumi-san también sin duda…"
 trinity_events_nagisa_49_a_tt: "§g¿Cuánto has mantenido hasta ahora la convicción de ‘confiar en los demás’? §YKirifuji Nagisa§!§g puede ceder el cargo de Host a una de las personas §Gen las que ha confiado, creído y con las que ha construido lazos§!§g hasta el momento. Que Nagisa decida presentarse o no a la reelección dependerá de las múltiples decisiones que haya tomado hasta ahora:\n§!"
 trinity_events_nagisa.50.t: "Una conversación con Seia"
 trinity_events_nagisa.50.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\n¿Estás preocupada por entregar el poder? Lo entiendo. Nagisa, de verdad has trabajado sola durante todo ese tiempo; ha debido de ser agotador. Al final, la decisión última es tuya, pero deseo que no sigas sufriendo más.\n\nRecuerdo a la Nagisa de antes de convertirse en Host, no, incluso de antes de entrar a Tea Party. Tal vez no te conozca tan bien como Mika, pero creo que yo también comprendía bastante a la persona que eras entonces. …La ‘Kirifuji Nagisa’ actual no es tu verdadero yo. Para comportarte de acuerdo con el cargo de Tea Party, siempre te has exigido demasiado a ti misma, y has encerrado a la Nagisa curiosa y amable que eras en el fondo de tu corazón.\n\nCreo que ya es hora de que dejes ese peso atrás.\n\nAunque otra persona asuma el cargo de Host en tu lugar, Trinity no cambiará. La persona en quien confíes se convertirá en Host, y avanzará con firmeza hacia el futuro brillante como la luz de las estrellas que siempre deseaste. He oído que, incluso en mi ausencia, has intentado confiar en los demás. Ahora es el momento. Confía. No importa en quién confíes. Pero la persona en la que tú creas llevará, sin duda, la estrella de la Primera Trinity hasta un futuro que aún desconocemos. Esto no es una profecía. Es mi intuición, mi convicción, y mi ‘confianza’ en la persona en la que tú confíes."
 trinity_events_nagisa.50.a: "Porque Seia-san estuvo a mi lado, soy quien soy hoy."
 trinity_events_nagisa_50_seia_tt: "§gYurizono Seia se añade como candidata a la elección de Host.§!"
 trinity_events_nagisa.51.t: "Un momento en la oficina del inspector"
 trinity_events_nagisa.51.desc: "\n\n\n                                                   £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\n…¡Puehong! ¿Eh? ¿Eeeh? ¿O sea que me estás pidiendo consejo sobre un cambio de gobierno a mí, la antigua administradora principal de Gehenna? Esto no será una cámara oculta, ¿verdad? Si digo algo mal, los miembros del Departamento de Justicia que están fuera podrían arrestarme… ¿No? Jeje. No me asusté ni un poco. Yo, una inspectora de Tea Party y agente de élite, jamás tendría miedo… Uff. Vale. Sí, me asusté un poco. ¿Contenta?\n\nNo creo estar en posición de aconsejarte, pero si lo necesitas, te diré lo que pienso. Tú tienes a personas maravillosas como Seia-san o Hifumi-san, amigas de toda la vida, ¿no? Creo que está bien confiar en ellas y entregarles el relevo. …Yo sé que tu ‘Tratado de Edén’ no fue para beneficio de los habitantes de Gehenna. Si estalla una guerra, las personas que más aprecias podrían resultar heridas, o algo peor. ¿No fuiste tú quien, desde antes del Gran Cataclismo, escribió el borrador de ese tratado en Edén pensando en proteger a Seia-san, Mika-san, o incluso a Hifumi-san?\n\nSí. Yo también era igual. Solo quería que la única persona que amo no resultara herida ni lastimada. Por eso me debatí con todas mis fuerzas en las negociaciones prácticas.\n\n…Así que lo sé. Sé que, del mismo modo que yo quería proteger a esa persona, Hina… no, esa persona también querría protegerme a mí. Hifumi-san, Seia-san, e incluso Mika-san de Pater sienten lo mismo. Si les entregas el cargo de Host, ellos te protegerán tanto como tú intentaste protegerlos a ellos. No pienses solo que tú los proteges. Es algo mutuo. Jeje. ¿Qué te parece? ¿Sonó genial, no?"
 trinity_events_nagisa.51.a: "Eres extraña, pero no eres una mala persona."
 trinity_events_nagisa_51_ako_tt: "§gAmau Ako se añade como candidata a la elección de Host.§!"
 trinity_events_nagisa.52.t: "Lazos nacidos en Arius"
 trinity_events_nagisa.52.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\n…¿Decidiste preguntar también a alguien de Arius? Jeje, me sorprende un poco. Por mucho que Trinity respete mi linaje de ‘sangre real’, no pensé que llegarías al punto de revelar la situación política interna y pedir consejo.\n\n¿Consejo…? No estoy segura de qué debería decirte. En Arius no existían sistemas como las votaciones. Todo se decidía según los sentimientos de Madame. Si ella decía ‘quiero que sea así’, así era, y no existía ningún proceso para escuchar la opinión de los demás. Los de arriba ordenan, los de abajo obedecen. Nada más.\n\nPero si en lugar de un consejo quieres que te cuente otra historia… hmm, quizá la de Saori sea adecuada. Hace tiempo estuve a punto de ser ofrecida como sacrificio humano por Beatrice. Quien me salvó fue Saori. Si lo analizas fríamente, no tenía ningún sentido: yo no podía ofrecerle nada a cambio. Pero Saori me ayudó simplemente porque creía que debía hacerlo. No siguió órdenes ni decisiones ajenas, solo siguió su propio corazón.\n\nNagisa, tanto si decides volver a gobernar como si decides abandonar el cargo de Host, creo que no debes dejarte arrastrar por las opiniones de los demás. Bueno, después de haber escuchado todo esto, quizá ya sea imposible. Jeje. Haz lo que tú ‘quieras’ hacer. Esa será la elección correcta, y también la mejor elección para la propia Host."
 trinity_events_nagisa.52.a: "Entonces me dice que, además de confiar en los demás, también debo confiar en mí misma."
 trinity_events_nagisa_52_atsuko_tt: "§gHakari Atsuko se añade como candidata a la elección de Host.§!"
 trinity_events_nagisa.53.t: "Y para ti, que eres lo más importante"
 trinity_events_nagisa.53.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n¡Hola! ¡Nagi-chan! ¿¿Tú pidiéndome consejo?? La verdad me sorprendió… ¡pero en el buen sentido! Oye, darte consejos es divertido, me hace sentir como cuando éramos pequeñas. …Sí. La Nagi-chan de entonces era muy distinta a la de ahora. Reía mucho, era amable… Por eso sentí que la Nagi-chan después de entrar en política había cambiado bastante.\n\n¿Estás pensando en ceder el cargo de Host a otra persona…? Umm. ¿Yo también soy candidata? Ajá☆ Es broma. Pater no debería gobernar. Al menos, no ‘después de ti’, Nagi-chan. Si yo subiera, la torre que construiste con tanto cuidado se derrumbaría de golpe.\n\n¿Mi consejo? Yo desearía que ya no te dedicaras a la política. …No es por egoísmo. Es porque siento que estás cambiando. Sí, lo sé, te esfuerzas muchísimo. Pero tú te esfuerzas ‘demasiado’. Y eso duele.\n\n…Si yo pudiera elegir… hmm. ¿Qué tal la inspectora Ako? Ajajá☆ ¡Mira esa cara de sorpresa, Nagi-chan! No digo que realmente debas elegirla. Solo te propongo ‘la opción que la líder de Pater jamás escogería’. ¿Qué quiero decir? En momentos así hay que pensar al revés. No como ‘Kirifuji Nagisa, líder de Filius’, sino como la ‘Kirifuji Nagisa humana’, la de antes de entrar a Tea Party, la que se atrevía a aplastar el roll cake con más ganas en mi boca. Esa es la elección inversa de la que hablo. ¿Lo entiendes? Entre las opciones que ve la Nagi-chan política, elige a la persona que menos buscaría. Creo que eso sería lo mejor.\n\nAjajá☆ Bueno, elijas a quien elijas, bendeciré esa decisión. O incluso puedes no elegir a nadie. No me importaría que fueras Host otros cien años. Solo… deseo que tomes una decisión que te haga feliz. Por ti. Si es por ti, yo… Ajajá. No lloré. De verdad. …Sí☆ Gracias."
 trinity_events_nagisa.53.a: "La opción que ‘Nagisa de Filius’ no elegiría…"
 trinity_events_nagisa_53_mika_tt: "§gDentro de 48 horas se celebrará la elección de Host de Tea Party.§!"
 ## 54-해피엔딩 이벤트 (나기사 이외의 인물이 당선)
 trinity_events_nagisa.54.t: "A la Cenicienta a la que se le rompió el hechizo"
 trinity_events_nagisa.54.desc.seia: "\"Yo, Nagisa... hice algo mal. No, no sé qué hice mal, ¡pero hice algo mal...!\"\n\nComo si no oyera el grito de disculpa de Seia, Nagisa, con gafas de sol, aceleró aún más el deportivo por la carretera costera. Había renunciado a ser Host y, tras obtener libertad absoluta, era el primer viaje a solas con Seia. Mientras recorrían la carretera de la costa norte de Trinity, Nagisa sintió una liberación que no había experimentado ni una sola vez desde el Gran Cataclismo.\n\n\"Debimos haberlo hecho mucho antes.\"\n\"...¿Te refieres a conducir con exceso de velocidad?\" \"Me refiero a renunciar a ser Host. Y a esta velocidad ni siquiera es tanto exceso de velocidad.\"\n\"Hemos acordado socialmente llamar ‘exceso de velocidad’ a 300 km/h.\" \n\nPese a las quejas de Seia, Nagisa giró el volante lentamente dentro de aquella sensación de libertad. Kirifuji Nagisa se había ido enfriando, volviéndose una persona helada. No fue por el Gran Cataclismo, sino por el cambio prematuro que comenzó desde que entró en Tea Party y empezó la política. Para ser una política correcta, Nagisa tuvo que sospechar de todo; y al convertirse en Host como líder de Filius, tuvo que convertirse en la persona más solitaria.\n\nPero eso no era la chica Kirifuji Nagisa, sino únicamente la ‘política’ Kirifuji Nagisa.\n\nNagisa abandonó al ‘demonio de la sospecha’ que la sostenía como política. Decidió amar a Gehenna, su antiguo enemigo. Decidió comprender a los locales que la odiaban. Decidió perdonar a sus rivales. Y decidió aceptar incluso a Mine, que escondió a Seia. Todo eso fueron pasos para volver a ser una chica común. Y cuando por fin llegó a confiar en los demás al punto de soltar incluso su poder y su liderazgo… entonces Nagisa volvió a ser Nagisa.\n\nSin darse cuenta, la playa a la que habían decidido ir ya estaba lo bastante cerca como para verse. Nagisa fue reduciendo la velocidad poco a poco, disfrutando del viento marino que entraba. Aunque el hechizo de Cenicienta se rompiera y las prendas magníficas que la envolvían volvieran a convertirse en harapos, a ella no le importaba."
 trinity_events_nagisa.54.desc.mika: "\"Yo, Nagisa... hice algo mal. No, no sé qué hice mal, ¡pero hice algo mal...!\"\n\"Ajajá☆ ¿Así que Nagi-chan también tenía este lado?\"\n\nComo si no oyera el grito de disculpa de Seia, y la voz burlona de Mika sentada a su lado, Nagisa, con gafas de sol, aceleró aún más el deportivo por la carretera costera. Había renunciado a ser Host y, tras obtener libertad absoluta, era el primer viaje de las tres: Seia, Mika y ella. Mientras recorrían la carretera de la costa norte de Trinity, Nagisa sintió una liberación que no había experimentado ni una sola vez desde el Gran Cataclismo.\n\n\"Debimos haberlo hecho mucho antes.\"\nMika preguntó: \"...¿Conducir con exceso de velocidad?\" \"Me refiero a renunciar a ser Host. Y a esta velocidad ni siquiera es tanto exceso de velocidad.\"\n\"Vaya... ¿no habíamos acordado socialmente llamar ‘exceso de velocidad’ a 300 km/h?\"\n\nPese a las quejas de Mika, Nagisa giró el volante lentamente dentro de aquella sensación de libertad. Kirifuji Nagisa se había ido enfriando, volviéndose una persona helada. No fue por el Gran Cataclismo, sino por el cambio prematuro que comenzó desde que entró en Tea Party y empezó la política. Para ser una política correcta, Nagisa tuvo que sospechar de todo; y al convertirse en Host como líder de Filius, tuvo que convertirse en la persona más solitaria.\n\nPero eso no era la chica Kirifuji Nagisa, sino únicamente la ‘política’ Kirifuji Nagisa.\n\nNagisa abandonó al ‘demonio de la sospecha’ que la sostenía como política. Decidió amar a Gehenna, su antiguo enemigo. Decidió comprender a los locales que la odiaban. Decidió perdonar a sus rivales. Y decidió aceptar incluso a Mine, que escondió a Seia. Todo eso fueron pasos para volver a ser una chica común. Y cuando por fin llegó a confiar en los demás al punto de soltar incluso su poder y su liderazgo… entonces Nagisa volvió a ser Nagisa.\n\nSin darse cuenta, la playa a la que habían decidido ir ya estaba lo bastante cerca como para verse. Nagisa fue reduciendo la velocidad poco a poco, disfrutando del viento marino que entraba. Aunque el hechizo de Cenicienta se rompiera y las prendas magníficas que la envolvían volvieran a convertirse en harapos, a ella no le importaba."
 trinity_events_nagisa.54.a: "Aunque no sea Host, Nagisa sigue siendo Nagisa."
 trinity_events_democratic_nagisa_happy_ending_tt: "§g(Escribe aquí una frase chida)§!"
 ## 55 - evento bad ending (ruta democrática pero Nagisa mantiene el poder)
 trinity_events_nagisa.55.t: "El demonio de la sospecha, irredimible"
 trinity_events_nagisa.55.desc: "\"No puedo decir que la elección de Nagisa haya sido la correcta.\"\n\nCon el rostro apesadumbrado de Seia a sus espaldas,"
 trinity_events_nagisa.55.a: "¿A quién le confiarás el futuro de Trinity?"
