# Eventos y decisiones de gestión del Mandato Divino
 TRN_Trinity_divine_mandate_cat: "Establecer el Mandato Divino"
 TRN_Trinity_divine_mandate_cat_desc: "\n\n£GFX_decision_header_TRN_trinity_buliding \n\n\n\nEl “Mandato Divino” toma su nombre del antiguo “Gobierno General” que administraba los territorios ocupados por Trinity. Pero ahora, para gestionar de forma eficaz el vasto Oriente y los territorios de Kivotos, hemos rescatado de la historia el nombre de Mandato Divino.\n\nEl objetivo final del Mandato Divino es administrar el territorio, asimilar a los locales a Trinity y desarrollar la región hasta un nivel comparable al de Trinity. No sabemos cuándo será, pero algún día Trinity controlará por completo estas extensiones."
 TRN_Divine_Mandate_Trigger_tt: "§Y[ROOT.GetNameWithFlag]§! o un títere controla todos los §Yestados resaltados§!"
