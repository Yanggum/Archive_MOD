 trinity_divine_mandate_events.1.t: "El destino del Mandato Divino del Sudeste de Trinity"
 trinity_divine_mandate_events.1.desc: ""
 trinity_divine_mandate_events.1.a: "Necesitamos a una estudiante de Trinity digna de confianza."
 trinity_divine_mandate_events.1.b: "Quizá un local lo haga mejor."
 trinity_divine_mandate_events.2.t: "El destino del Mandato Divino del Sudeste"
 trinity_divine_mandate_events.3.t: "El destino del Mandato Divino del Noreste"
 trinity_divine_mandate_events.4.t: "El destino del Mandato Divino del Este"
 trinity_divine_mandate_events.4.c: "...o quizá tengo una buena idea."
 TRN_trndivine_4_tt: "$TRN_Kirifuji_Nagisa$ se convertirá en la ejecutora del Mandato Divino del Este."
 trinity_divine_mandate_events.6.t: "El destino del Mandato Divino del Sur"
 trinity_divine_mandate_events.7.t: "Establecimiento del Ministerio de Ciencia y Tecnología de Trinity"
 trinity_divine_mandate_events.7.desc: "Tras conquistar Millennium, Trinity pudo hacerse con sus tecnologías avanzadas. Para aprovecharlas, Trinity creó un “Ministerio de Ciencia y Tecnología” como club y le transfirió territorio. Sin embargo, el debate sobre el liderazgo no cesa."
 trinity_divine_mandate_events.8.t: "El destino del Gobierno Militar-Civil de Francia"
 trinity_divine_mandate_events.9.t: "Nombramiento del Presidente del Consejo Estudiantil General"
 trinity_divine_mandate_events.10.t: "El destino de la Rada Central Bielorrusa"
 trinity_divine_mandate_events.10.desc: "La Rada Central Bielorrusa propuso a la inteligencia de Trinity la creación de un gobierno títere para asegurar la cooperación bélica desde Bielorrusia, y la propuesta fue aceptada. Se estableció el estado títere “Rada Central Bielorrusa” con Radaslau Astrouski como presidente.\n\nSin embargo, este estado títere era prácticamente nominal, y el poder real lo ejercía el Mandato Divino del Noreste. Más allá de facilitar un poco la cooperación local, no aportó grandes beneficios al esfuerzo bélico. Aun así, evitó numerosas atrocidades de las estudiantes y, tras la victoria de Trinity, adquirió un significado histórico."
 trinity_divine_mandate_events.10.a: "Interesante. Aceptemos su solicitud."
 trinity_divine_mandate_events.10.b: "Agradecido, pero no es razón para otorgar un estatus especial."


 trinity_flavor_events.9999.t: "Si ves este evento, repórtalo en Discord."
 trinity_flavor_events.9999.desc: "Si estás viendo este evento, repórtalo en Discord. El enlace es el siguiente:\nhttps://discord.gg/kddrRNS6dt\n\nSi lo viste en un contexto de trucos (cheats) u otras circunstancias similares, no hace falta reportarlo. Pero, de nuevo: si lo viste durante una partida normal, por favor repórtalo en Discord."
 trinity_flavor_events.9999.a: "Por favor, entra al enlace y repórtalo."
# 에덴 조약
 eden_treaty_negotiation_ALT_cat: "Renegociación del Tratado de Edén"
 eden_treaty_negotiation_ALT_cat_desc: "\n\n\n\n\n\n\nNo es que nunca se haya intentado poner fin a la vieja disputa y el conflicto entre las dos academias, Gehenna y Trinity. El intento de tratado de paz más reciente fue el §YTratado de Edén§!, impulsado desde antes de la Gran Transición gracias a la intervención de la §YPresidenta del Consejo Estudiantil General§!. El tratado de paz entre ambas academias tambaleó una vez, pero la firme voluntad del bando de [GEH.GetLeader] y del bando de [TRM.GetLeader] se reunió, y las negociaciones técnicas han vuelto a ponerse en marcha.\n\nSin embargo, por el §Ydescontento de las masas§! y la intervención de la §Yfacción Pater§!, es difícil cerrar el acuerdo en poco tiempo. No se trata de alcanzar la paz solo con la amistad de las líderes: Trinity y Gehenna deben conseguir un apoyo amplio que también pueda convencer a los ciudadanos y a todos los grupos de interés de ambos lados.\n\n§Y[GEM.GetNameDef]§! también es una variable en el Tratado de Edén. El bando de [GEM.GetLeader] subrayará lo “injusto” de este tratado e intentará agitar a la opinión pública de Gehenna. Que la renegociación del Tratado de Edén tenga éxito o no depende de un entramado de fuerzas muy complejo, y nadie puede atreverse a asegurar el resultado.\n\n§GRegla especial§!: Si la puntuación de negociación es de §G75§! o más, y además es §Y15§! puntos o más superior a la del bando contrario, ganas.\n\n£GFX_BA_game_rule_flag_TRM £GFX_BA_game_rule_flag_GEH Facción pro-tratado: [?global.eden_point_array^0]\n£GFX_BA_game_rule_flag_GEM £GFX_BA_game_rule_flag_GEH Facción anti-tratado: [?global.eden_point_array^1]"
 eden_point_array_tt: "Puntos de influencia de §G[ROOT.GetNameWithFlag]§!: $RIGHT|+=%%0$"
 eden_point_array_pater_tt: "Puntos de influencia del bando opositor: $RIGHT|-=%%0$"

## Decisiones de Pandemonium Society
 eden_treaty_negotiation_imperial_metrology_ALT: "Metrología imperial “con sello Trinity”"
 eden_treaty_negotiation_imperial_metrology_ALT_desc: "Se le vende a las estudiantes de Gehenna la idea de que, si se firma el Tratado de Edén con Trinity, abolirán el sistema métrico y las obligarán a usar el sistema de yardas y libras. Y oye… quizá ni siquiera sea solo propaganda. Si son brujas de Trinity, ¿quién dice que no traerían de verdad las yardas y libras? ¡Dicen que en Trinity una “ton” son 1,016.047 kg (2,240 lb)! ¡Eso me enfurece exactamente 16.047 kg!"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT: "Teoría conspirativa: la jefa Hasumi"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT_desc: "¿Qué cambios vendrán a Gehenna después de firmar el Tratado de Edén? Trinity ya anda con lo de la “policía conjunta” y pretende hacer labores de seguridad pública incluso en territorio de Gehenna. Es decir: ya están clavando la primera pala para una supuesta organización militar conjunta llamada “ETO”.\n\nSí. ¡Mantener el orden en conjunto! Eso también significa que Hasumi, la que se zampa seis parfaits en una sola comida, se quedará instalada en suelo de Gehenna, oprimirá nuestra libertad y hasta se robará el pudín de Ibuki. ¿No es una historia horrible y aterradora? ¡El Semanario Pandemonium lo va a difundir por todas partes!"
 eden_treaty_negotiation_weekly_pandemonium_ALT: "Jugar la carta mediática con el Semanario Pandemonium"
 eden_treaty_negotiation_weekly_pandemonium_ALT_desc: "Aunque el Semanario Pandemonium no sea precisamente el medio más popular… aun así, la prensa es la herramienta de propaganda que mejor sabemos usar. Los artículos difamatorios contra el JTF y contra Trinity deberían sacudir un poco la opinión pública."
 eden_treaty_negotiation_talk_makoto_ALT: "Agitación de opinión por [ROOT.GetLeader]"
 eden_treaty_negotiation_talk_makoto_ALT_desc: "Nuestra líder, de forma directa ante las masas, denuncia lo absurdo del Tratado de Edén y acusa a [GEH.GetLeader] y [TRM.GetLeader] de un pacto secreto entre cuatro paredes. No importa si hay pruebas o no: lo importante es sembrar inquietud."

## Decisiones de Trinity
 eden_treaty_negotiation_trinity_propaganda_ALT: "Concesiones a Gehenna"
 eden_treaty_negotiation_trinity_propaganda_ALT_desc: "Aunque esto implique enormes concesiones para distintos intereses políticos y para la facción Pater, no podemos tirar el tratado por la borda a estas alturas. Lo importante es conseguir primero la firma."
 eden_treaty_negotiation_pro_gehenna_ALT: "Agitación cultural pro-Gehenna"
 eden_treaty_negotiation_pro_gehenna_ALT_desc: "Usamos marketing para que la cultura de Gehenna no parezca mala a las estudiantes de Trinity… o incluso para que parezca elegante. El mejor objetivo de propaganda será Kurodate Haruna. Puede ser medio boba, pero tiene un habla y unos gestos con cierta nobleza: si lo editamos bien, podemos meterle a la gente la idea de que Gehenna y Trinity no son tan distintas."
 eden_treaty_negotiation_pro_prefect_team_ALT: "Actividades conjuntas de seguridad con el JTF"
 eden_treaty_negotiation_pro_prefect_team_ALT_desc: "Ya no son solo las patrullas vecinales las que protegen el orden de Trinity fuera del JTF. Desde las calles de Edén hasta las cabañas rurales, los agentes operativos del JTF de Gehenna están cooperando en la seguridad pública, y sus heroínas que aplastan a los Helmet Gang y a los fascistas pueden dejar una fuerte impresión en el público."
 eden_treaty_negotiation_talk_nagisa_ALT: "[ROOT.GetLeader] da la cara"
 eden_treaty_negotiation_talk_nagisa_ALT_desc: "[ROOT.GetLeader] organiza eventos como fiestas sociales y presentaciones de libros para persuadir directamente a la élite adinerada de Trinity. Un encuentro con la Host tiene un poder de persuasión sorprendente."
 eden_treaty_negotiation_remove_angry_JTF_ALT: "Responder a la oposición interna del JTF"
 eden_treaty_negotiation_remove_angry_JTF_ALT_desc: "Visitaremos al JTF en persona. [ROOT.GetLeader] explicará los beneficios de paz que aporta la unión Trinity–Gehenna, y, con regalos y diversos beneficios, apenas lograremos calmar a Hasumi."

## “Metidas de pata” (elige IA, tipo misión)
 eden_treaty_negotiation_host_ALT: "Presión para asegurar superioridad"
 eden_treaty_negotiation_host_ALT_desc: "Diversas facciones anti-Gehenna, incluida la facción Pater, quieren que Trinity obtenga una ventaja clara sobre Gehenna en esta negociación. Por eso, presionaremos al bando de Gehenna para arrancar beneficios económicos en el tratado. La negociación puede volverse inestable, pero… no debería pasar nada grave. Supongo."
 eden_treaty_negotiation_sardine_pie_ALT: "Reacción de los duros dentro de Gehenna"
 eden_treaty_negotiation_sardine_pie_ALT_desc: "Algunas estudiantes y ciudadanos de Gehenna, ajenos tanto a Pandemonium como al JTF, se oponen con dureza a esta negociación. En particular, en muchos lugares aparecen más de lo esperado consignas “Trinity = imperialismo” de grupos vinculados a sindicatos laborales alemanes locales. Su nacionalismo y su rechazo anticapitalista parecen el enemigo más grande para nuestra negociación."
 eden_treaty_negotiation_angry_JTF_ALT: "Oposición interna del JTF"
 eden_treaty_negotiation_angry_JTF_ALT_desc: "Hasumi del JTF es fuertemente anti-Gehenna, así que, pese a la participación de la oposición anti-Gehenna —incluida Misono Mika—, ella expresa de forma pasiva su rechazo personal. Las voces de los duros que se oponen al acuerdo se están acumulando y la resistencia se está extendiendo de manera más amplia de lo esperado…"

## Decisiones del JTF de Gehenna
 eden_treaty_negotiation_gehenna_propaganda_ALT: "Propaganda de Gehenna"
 eden_treaty_negotiation_gehenna_propaganda_ALT_desc: "Por más que Pandemonium Society ladre como un perro rabioso, no nos queda otra que avanzar. Sobornaremos medios y produciremos artículos pro-tratado para convencer de que Trinity no es una fuerza externa tan amenazante."
 eden_treaty_negotiation_pro_trinity_ALT: "Agitación cultural pro-Trinity"
 eden_treaty_negotiation_pro_trinity_ALT_desc: "Incluso Shiro mi Iori, nuestra fiable jefa de operaciones, ama el bello uniforme de Trinity. Trinity es una gran academia: tiene una cultura atractiva, hace ropa elegante y posee muchas cosas capaces de fascinar a las chicas de Gehenna (si excluimos el pastel de sardina y las viejas medidas). ¿Cómo no iban a amar las chicas de Gehenna a Trinity?"
 eden_treaty_negotiation_pro_JTF_ALT: "Actividades conjuntas de seguridad con el JTF"
 eden_treaty_negotiation_pro_JTF_ALT_desc: "Las actividades conjuntas con el JTF pueden enfurecer más a las estudiantes problemáticas de Gehenna, pero pueden hacer que los ciudadanos piensen: “Nuestra seguridad se mantiene gracias al frente conjunto de ambas academias”. Y si se establece el ETO del Tratado de Edén, ¿no podríamos aspirar incluso a una seguridad compartida? ¡Qué maravilla!"
 eden_treaty_negotiation_talk_hina_ALT: "[ROOT.GetLeader] da la cara"
 eden_treaty_negotiation_talk_hina_ALT_desc: "[ROOT.GetLeader] predica su postura pro-tratado principalmente ante los miembros generales del JTF. La confianza en la líder despertará apoyo interno al Tratado de Edén."

## Genérico
 eden_treaty_negotiation_generic_propaganda_ALT: "Predicar los ideales de [ROOT.GetAdjective]"
 eden_treaty_negotiation_generic_propaganda_ALT_desc: "Damos a conocer al público los ideales que sostenemos sobre el Tratado de Edén y orientamos la opinión pública."
 eden_treaty_negotiation_generic_propaganda_ALT_tt: "Esta decisión puede ser usada por §Ylos tres países§!. Su efecto mejora cuanto menos extremo sea tu país, y empeora cuanto más extremo sea.\n"

 trinity_gehenna_eden_treaty_negotiation_ALT_flag: "La negociación del Tratado de Edén §Ycomienza§!"
 trinity_gehenna_eden_treaty_negotiation_ALT_success_flag: "La negociación del Tratado de Edén §Gse completa con éxito§!"
 trinity_gehenna_eden_treaty_negotiation_ALT_fail_flag: "La negociación del Tratado de Edén §Rfracasa§!"

