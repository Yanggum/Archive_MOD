 TRN_army_ns: "Fuerzas terrestres de Trinity"
 TRN_army_ns_desc: "Hace siglos, las fuerzas terrestres de Trinity desarrollaron rápidamente sus capacidades militares mediante \"guerras internas\" entre ellas, y esa experiencia de combate real condujo al crecimiento teórico-táctico de su doctrina. Más tarde, cuando Trinity se unificó bajo una misma fe y valores, aunque aquel periodo convulso haya quedado en el olvido, las lecciones que dejó jamás se olvidaron."
 TRN_navy_ns: "Marina de Trinity"
 TRN_navy_ns_desc: "Para Trinity, el concepto de \"marina\" puede resultar algo ajeno, pero de ningún modo nos quedamos atrás respecto a otras academias. Hemos hecho que muchos comprendan la importancia del mar y, aún hoy, zarpamos con dignidad y una fe inquebrantable en la victoria."
 TRN_airforce_ns: "Fuerza aérea de Trinity"
 TRN_airforce_ns_desc: "Cuando la madre de la aviación —origen de la fuerza aérea de Trinity— abrió nuevos horizontes en el cielo, nos enfrentamos a un cambio de paradigma militar que fue más allá del simple vuelo. Hasta hoy, la fuerza aérea de Trinity se eleva con la convicción de que la victoria en el cielo conduce a la victoria en tierra."
 TRN_joint_security_organization_ns: "Comisión Internacional de Seguridad [GEH.GetAdjective]-[TRM.GetAdjective]"
 TRN_joint_security_organization_ns_desc: "Esta organización fue creada para la cooperación judicial y de seguridad pública entre ambos gobiernos, desde Trinity hasta el Equipo de Prefectura de Gehenna. Cuando un sospechoso cruza las fronteras entre las dos academias, la comisión dirige investigaciones conjuntas entre el Departamento de Realización de la Justicia y el Equipo de Prefectura para mantener el orden."

 TRN_military_mission_generic_ns: "Misión de asesores militares [TRM.GetAdjective]"

 TRM_JTF_intelligence_ns: "Departamento de Realización de la Justicia"
 TRM_JTF_intelligence_ns_desc: "Se le asignó al Departamento de Realización de la Justicia un rol de contrainteligencia y se amplió aún más su escala. Como fuerza directa bajo las órdenes del Tea Party, el Departamento de Realización de la Justicia será la espada más poderosa para nosotros."

 TRN_german_new_culture_order_modifier: "El nuevo orden cultural de Alemania"
 TRN_german_new_culture_order_modifier_desc: "Está surgiendo un nuevo orden cultural en Alemania. La sociedad alemana dominada por Trinity cambiará bajo nuestra influencia, sea eso algo positivo o no."
 TRN_german_new_culture_order_modifier_change: "Cambios de §Y$TRN_german_new_culture_order_modifier$§!"

 TRN_german_new_religion_ns: "Plan de conversión dirigido por la Sisterhood"
 TRN_german_new_religion_ns_desc: "Se están invirtiendo fondos para convertir a la población local a la fe de Trinity."

 TRN_german_harmony_religion_ns: "Plan de propaganda religiosa"
 TRN_german_harmony_religion_ns_desc: "Se está llevando a cabo propaganda que afirma que la fe de Trinity y las creencias locales no son más que la adoración del mismo dios de maneras distintas."

 TRN_trinity_crusade_ns: "Cruzada de Trinity"
 TRN_trinity_crusade_ns_desc: "Para difundir la fe de Trinity, la cruzada ha jurado combatir contra ateos y herejes, y salvaguardar el orden de Trinity."

 TRM_nagisa_constitution_modifier: "Constitución de Nagisa"
 TRM_nagisa_constitution_modifier_desc: "La Constitución de Nagisa, redactada para Trinity bajo el liderazgo de Kirifuji Nagisa. Esta constitución determinará la orientación futura de Trinity durante más de 100 años."

 TRN_first_but_reworked_ns: "Ideal de oligarquía liberal"
 TRN_first_but_reworked_ns_desc: "Libertad cultural permitida bajo un sistema oligárquico autoritario. También es el fruto del antiguo compromiso de la facción Filius: impulsar la reforma del Estado preservando la tradición conocida como el \"ideal de la Primera Trinity\"."

 TRN_new_and_free_trininy_culture_ns: "Cultura trinitaria de una nueva era"
 TRN_new_and_free_trininy_culture_ns_desc: "La cultura de Trinity se desarrolló mediante el intercambio con academias vecinas, y se ha convertido en objeto de admiración para muchas academias de Kivotos."

 TRN_bureau_of_railways_ns: "Oficina Ferroviaria de Trinity"
 TRN_bureau_of_railways_ns_desc: "Para transportar más tropas al frente, se está llevando a cabo un proyecto especial bajo la dirección de la Oficina Ferroviaria de Trinity."

 TRN_pater_hate_naginagi_ns: "Conflicto Filius-Pater"
 TRN_pater_hate_naginagi_ns_desc: "El conflicto entre Filius y Pater existía incluso antes de la Gran Transición, pero su escala y nivel se han ido intensificando. Pater incita a los trabajadores alemanes para que sigan causando huelgas y, a los trinitarios, los empuja a la objeción de conciencia al servicio militar. Con el rechazo frontal al pacifismo y a las ideas pro-Gehenna del Host Kirifuji Nagisa como base, bajo el liderazgo de Misono Mika sabotean la situación política.\n\nY las ejecutivas de Filius no olvidarán este hecho. Incluso después de que el conflicto con Gehenna haya terminado de manera permanente."
 TRN_pater_hate_naginagi_ns_tt: "\nEmpeora si se firma el Tratado de Edén: Los efectos del espíritu nacional empeoran si el §YTratado de Edén§! §Ytiene éxito§!."
 TRN_pater_hate_naginagi_remove_ns_tt: "\nSe elimina durante la guerra con Gehenna: En guerra contra §Y[GEM.GetName]§! o §Y[GEH.GetName]§!."
 TRN_pater_hate_naginagi_trigger_tt: "Posee el espíritu nacional §Y$TRN_pater_hate_naginagi_ns$§!."

 TRN_sending_missionaries_ns: "Influencia de la fe de Trinity"
 TRN_sending_missionaries_ns_desc: "Las misioneras de la Sisterhood de Trinity están propagando una fe que hace que la población de nuestros territorios se someta a la tradición y al orden existente. Las nuevas creyentes aprenderán que la virtud más correcta es trabajar sin oponerse al gobierno, obedeciendo al líder [ROOT.GetLeader]."

 TRN_attack_pater_ns: "Procesamiento de Pater"
 TRN_attack_pater_ns_desc: "El procesamiento indiscriminado de las ejecutivas de Pater debilita su sabotaje, pero al mismo tiempo también provoca caos en nuestra política interna."

 TRN_connection_to_vigilante_ns: "Apoyo de los vigilantes"
 TRN_connection_to_vigilante_ns_desc: "Los vigilantes están deteniendo a los trabajadores alemanes que participan en las huelgas."

