 # Enfoques militares
 TRN_increase_military_budget: "Aprobar el presupuesto de defensa de [GetYear]"
 TRN_increase_military_budget_desc: "Para modernizar al ejército con rapidez hace falta una enorme cantidad de fondos. Hasta ahora, el presupuesto de defensa apenas se elaboraba para mantener el nivel actual; pero aunque la guerra haya terminado, la amenaza persiste. Debemos aumentar drásticamente el presupuesto de defensa y prepararnos para los peligros que se aproximan."
 TRN_armor_refit: "Reacondicionar los tanques"
 TRN_armor_refit_desc: ""
 TRN_trinity_army_reform: "Reestructurar la doctrina de infantería"
 TRN_trinity_army_reform_desc: "Las tácticas del ejército alemán fueron impactantes, pero aun así Trinity los derrotó. La táctica de desgastar al enemigo mediante un bombardeo continuo y forzarlo a sufrir bajas sigue siendo válida en el campo de batalla. Puliremos las fases tácticas y, mediante reacondicionamiento, modernizaremos la doctrina."
 TRN_retracing_the_mechanized_brigade_tragedy: "Revisitar la tragedia de la brigada mecanizada"
 TRN_retracing_the_mechanized_brigade_tragedy_desc: "Cuando el grupo de vanguardia fue destruido por una emboscada, la vanguardia y la retaguardia quedaron aniquiladas y el resto quedó atrapado en la calle, derivando en un combate unilateral. El ejército alemán venció a las fuerzas de Trinity y luego recorrió la ciudad resistiendo en distintos puntos. Aunque más tarde los exterminamos con apoyo de artillería, el método de abrirse paso a la fuerza ya no encaja con la guerra moderna."
 TRN_small_attack_groups: "Emplear pequeños grupos de ataque"
 TRN_small_attack_groups_desc: "El frente es enorme, pero desplegar personal es caro. En cambio, si aplanamos el campo con proyectiles relativamente baratos y obligamos al enemigo a desgastarse, y luego insertamos pequeños grupos de ataque, el enemigo se verá forzado a una defensa agotadora."
 TRN_sophisticated_artillery_equipment: "Desarrollar equipo de artillería de precisión"
 TRN_sophisticated_artillery_equipment_desc: "Tecnologías vitales para la artillería —incluidos los instrumentos de topografía— han retrocedido mucho en los últimos años. Para que nuestras valiosas tropas no se sacrifiquen en vano, es necesario avanzar en la tecnología de artillería."
 TRN_thousand_blades: "Táctica de las mil hojas"
 TRN_thousand_blades_desc: "La táctica de las mil hojas es una doctrina propia de Trinity. En lugar de un gran ataque directo, repetimos ataques pequeños para desgastar al enemigo y, con el mínimo de divisiones, lo aniquilamos. El enemigo, sin entender siquiera por qué, verá caer a sus camaradas una y otra vez y no hará más que retirarse."
 TRN_germany_army_reform_1: "Investigar una nueva doctrina acorazada"
 TRN_germany_army_reform_1_desc: "Con el paso del tiempo, la vieja doctrina acorazada de Trinity ya no puede adaptarse al nuevo entorno. Para mover estas divisiones acorazadas con rapidez y eficiencia, es imprescindible investigar una nueva doctrina acorazada."
 TRN_germany_army_reform_2: "Centro de entrenamiento de fuerzas acorazadas"
 TRN_germany_army_reform_2_desc: ""
 TRN_germany_army_reform_3: "Ampliar la infantería mecanizada"
 TRN_germany_army_reform_3_desc: ""
 TRN_germany_army_reform_4: "Aumentar la capacidad de instalaciones avanzadas de tanques"
 TRN_germany_army_reform_4_desc: ""
 TRN_kivotos_drone: "Uso militar de drones"
 TRN_kivotos_drone_desc: "Los drones, utilizados hasta ahora solo con fines civiles, han demostrado recientemente su potencial militar. En especial, su ventaja de poder producirse en masa con materiales baratos ha impulsado experimentos para su uso militar."
 TRN_generic_army_reform: "Reconocimiento del frente con drones"
 TRN_generic_army_reform_desc: "El frente es demasiado vasto para observarlo directamente con ojos humanos. Además, la visión fija es una gran desventaja. Con drones, podemos explorar y reconocer el frente a bajo costo, con grandes ventajas en obtención y transmisión de información."
 TRN_general_staff_reform: "Reforma del Estado Mayor General"
 TRN_general_staff_reform_desc: ""
 TRN_military_chaplain: "Capellán militar"
 TRN_military_chaplain_desc: "Gracias a nuestros vínculos políticos con la Sisterhood hemos obtenido grandes ventajas. Si ampliamos su papel al ámbito militar, nuestras soldados podrán esperar un gran impulso de moral mediante bautismos y cultos previos al combate."
 TRN_military_factory_maintenance: "Reorganizar las líneas de producción militar"
 TRN_military_factory_maintenance_desc: "El estado actual de la producción armamentística es, en una palabra, un desastre. La secuela de la Gran Transición aún persiste. Los sistemas de producción suelen estar interrumpidos, obsoletos o ambas cosas, y no son condiciones para que un ejército moderno combata. Debemos reestructurar este sistema por completo para que nuestras soldados dispongan de armas con las que enfrentarse a los enemigos de Trinity."
 TRN_supply_line_improvements: "Mejorar las líneas de suministro"
 TRN_supply_line_improvements_desc: "Las líneas logísticas de Trinity quedaron sumidas en el caos tras el incidente de la Transición. Incluso el enemigo llegó a aprovechar estas rutas y casi nos provocó un desastre. Debemos reconectarlas y mejorarlas de forma más eficiente."
 TRN_flexible_line: "Línea de producción flexible"
 TRN_flexible_line_desc: ""
 TRN_optimize_production_line: "Optimizar la línea de producción"
 TRN_optimize_production_line_desc: ""
 TRN_arsenal_support: "Apoyar el Arsenal de Edén"
 TRN_arsenal_support_desc: "El Arsenal de Edén es una empresa operada por la academia que produce las armas de fuego de Trinity. La mayoría de armas de Trinity se diseñan, ensamblan y venden aquí. Pero, con el reciente gran aumento del presupuesto de defensa y la demanda de producción, debemos apoyar al Arsenal de Edén y ampliar sus instalaciones."
 TRN_design_bureau_support: "Asegurar instalaciones alemanas de producción de tanques"
 TRN_design_bureau_support_desc: "Las instalaciones alemanas de producción de tanques son bastante interesantes. Por alguna razón, disfrazaron fábricas de tanques como si fueran fábricas de maquinaria agrícola. Si aseguramos esas instalaciones ocultas y las transferimos al Buró de Diseño de Tanques de Trinity, podremos fortalecer nuestra fuerza acorazada."
 TRN_motors_support: "Adquirir la fábrica automotriz de BMW"
 TRN_motors_support_desc: "Por suerte, la planta automotriz de Turingia contaba con instalaciones enormes, lo bastante como para darle a Trinity Motors un impulso tremendo. Además, como BMW atraviesa una gran crisis, podremos adquirirla a bajo costo."
 TRN_control_of_baltic_sea_tt: "Para el jugador: hola, soy el desarrollador. Los enfoques inferiores de la marina de Trinity requieren el DLC Man the Guns y "
 TRN_control_of_baltic_sea: "Control del mar Báltico"
 TRN_control_of_baltic_sea_desc: "El mar Báltico es vasto, y es imposible controlarlo por completo. Sin embargo, la armada de Trinity fija deliberadamente un objetivo imposible y se esfuerza por alcanzarlo. Solo con patrullas marítimas frecuentes y asegurando el control de las zonas costeras, podremos aumentar en gran medida la seguridad del litoral."
 TRN_expand_naval_facilities: "Ampliación masiva de astilleros"
 TRN_expand_naval_facilities_desc: "Trinity no ha invertido lo suficiente en astilleros. El sector militar está claramente rezagado. Los pocos astilleros que quedan en Trinity solo saben construir lujosos trasatlánticos, diseñados para el placer y el ocio. Para resolver este problema, aunque tome tiempo, debemos esforzarnos por ampliar los astilleros."
 TRN_creation_of_marine_corps: "Crear el Cuerpo de Marines"
 TRN_creation_of_marine_corps_desc: "Si peleas y ganas, bien; si pierdes, ¡muérete! Hei ppappappalli ppa hei ppappappalli ppa"
 TRN_establish_the_naval_command: "Establecer el Mando Naval"
 TRN_establish_the_naval_command_desc: ""
 TRN_improve_ship_industry: "Mejorar la industria naval"
 TRN_improve_ship_industry_desc: ""
 TRN_giant_ship_plan: "Plan de grandes buques"
 TRN_giant_ship_plan_desc: ""
 TRN_high_seas_fleet: "Flota de alta mar"
 TRN_high_seas_fleet_desc: ""
 TRN_construct_aircraft_carriers: "Construir portaaviones"
 TRN_construct_aircraft_carriers_desc: "Decir que se “construyen” portaaviones no tiene sentido, porque la mayor parte del tiempo están sobre el mar. ¡Chua-ja-ja!"
 TRN_battleship_construction: "Construir acorazados"
 TRN_battleship_construction_desc: "Decir que se “construyen” acorazados no tiene sentido, porque la mayor parte del tiempo están sobre el mar. ¡Chua-ja-ja!"
 TRN_trade_interdiction: "Interdicción del comercio"
 TRN_trade_interdiction_desc: ""
 TRN_cruiser_warfare: "Guerra de cruceros"
 TRN_cruiser_warfare_desc: ""
 TRN_armored_assault_fleet: "Flota de incursión acorazada"
 TRN_armored_assault_fleet_desc: ""
 TRN_submarine_warfare: "Guerra submarina"
 TRN_submarine_warfare_desc: ""
 TRN_air_force_reinforcement: "Reforzar la fuerza aérea"
 TRN_air_force_reinforcement_desc: "Un campo de batalla moderno no puede ganarse sin dominar los cielos. Es una lección de guerra transmitida desde hace mucho. ¡Debemos hacer todo lo posible para cubrir la escasa capacidad aérea de la academia!"
 tooltip_has_completed_focus_TRN_ministry_of_industrial_development: "\nEfectos al completar el enfoque §Y$TRN_ministry_of_industrial_development$§!:"
 TRN_academy_aircraft_construction: "Establecer la Compañía Aeronáutica de la Academia"
 TRN_academy_aircraft_construction_desc: ""
 TRN_aviation_torpedoes: "Desarrollar torpedos aéreos"
 TRN_aviation_torpedoes_desc: ""
 TRN_prop_plane_recommission: "Recomisionar aviones de hélice"
 TRN_prop_plane_recommission_desc: "Tras el incidente, nuestra tecnología aeronáutica retrocedió enormemente. Restaurar la tecnología de jets llevará mucho tiempo; debemos recomisionar aviones de hélice para cubrir el vacío de inmediato."
 TRN_jet_technolgy: "Reinvestigar tecnología a reacción"
 TRN_jet_technolgy_desc: ""
 TRN_establish_of_training_system: "Restablecer el sistema de entrenamiento de pilotos"
 TRN_establish_of_training_system_desc: ""
 TRN_flying_club: "Crear el Club de Aviación"
 TRN_flying_club_desc: "El Club de Aviación es una organización apoyada por el Tea Party para formar pilotos. Es un club enorme, con un despliegue masivo de entrenadores optimizados para el entrenamiento de pilotos.\n\nComo curiosidad, por ser un club de “vuelo”, por Trinity circula el chiste de que son “jóvenes delincuentes volando”..."
 TRN_helicopter: "Aeronaves de ala rotatoria"
 TRN_helicopter_desc: "El despegue y aterrizaje vertical de las aeronaves de ala rotatoria garantiza una flexibilidad excelente incluso en terrenos impredecibles. En especial, el hecho de no requerir pista y poder moverse de forma no lineal ofrece grandes ventajas tácticas."
