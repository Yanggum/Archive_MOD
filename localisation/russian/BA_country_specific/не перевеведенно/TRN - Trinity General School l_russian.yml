 TRM_attached_to_filius_desc: "§LEsta persona pertenece a la facción Filius y se esfuerza por proteger la tradición y la nobleza de Trinity.§!"
 TRM_attached_to_pater: "Afiliada a la facción Pater"
 TRM_attached_to_pater_desc: "§LEsta persona pertenece a la facción Pater y se opone a Filius para hacer realidad el ideal de la Segunda Trinity.§!"

 TRM_host_nagisa: "Host multicolor\n§gNagisa ha logrado innumerables hazañas y se alzó en el lugar más noble de Trinity. Para cumplir con el deber del noblesse oblige, volvió a convertirse en Host una vez más. Un régimen oligárquico aristocrático permanente se consolidará bajo su reinado.§!"
 TRM_host_hifumi: "Host incolora\n§gHifumi sigue bajo la influencia política de Kirifuji Nagisa, y en la práctica no toma decisiones por cuenta propia.§!"
 TRM_host_hifumi_2: "Host gris\n§gAunque era una novata en política, Hifumi está encontrando rápidamente su propio color.§!"
 TRM_host_hifumi_3: "Host negra\n§g¿Por qué esa persona fue tan cruel solo con Hifumi?§!"
 TRM_host_seia: "Host amarilla\n§gSeia, la profetisa, nunca vio en el futuro que regresaría al cargo de Host. Tal vez el futuro no esté fijado, y pueda cambiar con nuestras elecciones. Seia pasó a valorar la voluntad libre y a poner menos peso en el valor de la profecía que antes.§!"
 TRM_host_seia_2: "$TRM_host_seia$"
 TRM_host_mine: "Host verde\n§gLa convicción de no entrar al Tea Party como líder de la facción Yohán y dedicarse solo al socorro se quebró por factores externos. Mine está cediendo poco a poco ante la realidad y, en las reuniones del Tea Party, se presenta únicamente como “líder de la facción Yohán”, y no como “comandante de la Orden de Socorro”.§!"
 TRM_host_ako: "Host azul\n§gAunque le interesan mucho la expansión del aparato de contrainteligencia y la burocracia, Ako respeta la noble oligarquía aristocrática de Trinity y apoya el statu quo del sistema actual, donde la nueva clase burocrática no puede intervenir en política.§!"
 TRM_host_ako_2: "$TRM_host_ako$"
 TRM_host_atsuko: "Host púrpura\n§gAunque le interesan los problemas de bienestar de las clases más bajas, Atsuko respeta el noble clasismo de Trinity y apoya el statu quo del sistema actual, donde la gente común no puede intervenir en las políticas del gobierno.§!"
 TRM_host_atsuko_2: "$TRM_host_atsuko$"
 TRM_host_takane: "Host roja\n§gAunque es la Host de una noble casa extranjera, muestra una tendencia frugal; se espera que quede en la historia de Trinity como la Host más pro-pueblo.§!"
 TRM_hidden_trait_takane: "¿Gran duquesa del Reino de Invierno?"
 TRM_hidden_trait_takane_2: "Gran duquesa del Reino de Invierno"
 TRM_hidden_trait_takane_3: "¡Gran duquesa del Reino de Invierno!\n§gLa Gran duquesa del Reino de Invierno es amada por todos: sangre real noble de Trinity y líder venerada por el pueblo.§!"

 TRM_cynical_skeptic_nagisa: "Escéptica cínica\n§gAun así, se esfuerza por confiar en los demás. Aunque el instinto político de Nagisa grite por dentro.§!"
 TRM_cynical_skeptic_hifumi: "Escéptica cínica irrecuperable\n§gNagisa-sama, odio todo lo que dejaste atrás.§!"
