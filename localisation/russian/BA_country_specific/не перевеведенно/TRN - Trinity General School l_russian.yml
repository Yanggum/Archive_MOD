 TRN_Mika_social_problem_cat: "Castillo de naipes de Trinity"
 TRN_Mika_social_problem_cat_desc: "\n\n£GFX_decision_header_TRN_ruin_street\n\n\n\n\nAhora, los alemanes ya no aceptan nuestro dominio de buena gana. Trinity sigue siendo la misma, pero la “Alemania” en la que vivían ha cambiado de forma drástica. [TRN_Mika_social_problem_decision_desc]\n\nPoblación reclutable alemana actual (@WGR): [?TRM.TRM_pro_german_propaganda_conscription_factor|%+1]\n[GetTrCFLevelText] [GetTrmCFPenaltiesText]"
 TRN_Mika_social_problem: "§pLa resistencia alemana se intensifica§!"
 TRN_Mika_social_problem_tt: "La resistencia de los residentes alemanes (@WGR) se está §tintensificando§!.\n$TRM_CF_modifier_tt$\nPoblación reclutable: §R[?TRM.TRM_monthly_conscription_factor_increase|%1]§!\n\n"
 TRN_Mika_social_problem_days_tt: "La misión $TRN_Mika_social_problem$ ahora requiere $RIGHT|Y0$ días menos."
 TRN_Mika_social_problem_days_increase_tt: "La misión $TRN_Mika_social_problem$ ahora requiere $RIGHT|Y0$ días más."

 TRN_Mika_desc_social_problem_cat: "Si la segunda Trinity, recién nacida, fracasará en la segunda prueba de la historia que se avecina o conducirá a la academia a una grandeza sin precedentes, solo el tiempo lo dirá."
 TRN_Nagisa_desc_social_problem_cat: "Tras superar la crisis, otra prueba aguarda a Trinity. Si en la segunda prueba de la historia fracasará o triunfará, depende únicamente de ella."
 TRN_general_desc_social_problem_cat: "Para resolver la amenaza contra Trinity, será inevitable cooperar con ellos. Solo manteniendo el equilibrio en la balanza de la relación entre Trinity y Alemania, podrá alcanzarse una integración verdadera."

