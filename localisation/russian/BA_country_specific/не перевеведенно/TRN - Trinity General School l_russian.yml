 # Pantalla principal (bio) de la cuenta SNS de Mika
 TRM_mika_misono_self_introduction_loc_0: "Soy Mika Misono, líder de la facción Pater☆ Perdón, pero las cuentas de Gehenna van bloqueadas (_ _)\n #Trinity_TeaParty #Pater"
 TRM_mika_misono_self_introduction_loc_1: "¡Totalmente en contra del Tratado de Edén! ¡Seguidores, asalto total por MomoTalk contra los directivos de Filius! ¡Se los pido!\n #Tratado_de_Edén #Pater"
 TRM_mika_misono_self_introduction_loc_2: "Pater estará con Trinity en la guerra contra Gehenna… hasta el último instante.\nPara info en tiempos de guerra, consulten los sitios de “Información de Desastres” del Ministerio de Transporte y del Gabinete."
 TRM_mika_misono_self_introduction_loc_3: "¡¡Totalmente en contra de la guerra con Arius!! Impulsamos el pacifismo de Trinity\n #PeaceforArius #PrayforArius"
 TRM_mika_misono_self_introduction_loc_4: "Me gusta el perfume Samuela. Envíen muchos regalos.\nEs broma ㅋㅋ ¡Recibo solo el cariño de todos!"
 TRM_mika_misono_self_introduction_loc_5: "La idol de todos (la esperanza), cuenta oficial de Mika Misono, líder de la facción Pater☆ ¡También comparto info de Pater aquí!\n #Trinity_TeaParty #Pater #Lo_que_quiero_decirle_a_Nagi-chan"
 TRM_mika_misono_self_introduction_loc_6: "¡Gracias por su esfuerzo, delegación de Trinity que asistió a la Expo de Millennium!\n#Expo_Millennium #Amistad_Trinity_Millennium"
 TRM_mika_misono_self_introduction_loc_7: "Sé que Nagi-chan se busca a sí misma en mi cuenta todos los días… ㅇㅁㅇ\n¡¡Nagi-chan!! Si estás viendo esto, ¡agita una zanahoria!!"
 TRM_mika_misono_self_introduction_loc_8: "Buscando a mi propio príncipe… (loading...) Un poco sola.\nSiempre busco con quién hablar."
 TRM_mika_misono_self_introduction_loc_9: "Estoy intentando ser feliz.\nAunque sea algo terriblemente difícil."
 TRM_mika_misono_self_introduction_loc_10: "¿Esto de la Gran Guerra será de verdad? ¿Y si todo esto no es más que un sueño largo?\nSoy Mika Misono, una chica filosófica: cuenta oficial."
 TRM_mika_misono_self_introduction_loc_11: "Seia-chan. Gracias por seguir viva."
 TRM_mika_misono_self_introduction_loc_12: "Soy Mika, líder de la facción Pater del Tea Party. Siempre estoy agradecida con todos.\nCon amor para todas las personas que visitan mi cuenta."

