 TRM_arius_reclaim: "Operación de reconquista de Arius"
 TRM_arius_reclaim_desc: "La Operación de reconquista de Arius significa mucho más que una simple recuperación territorial. Además de asegurar el control físico del espacio, por fin completará el antes inestable sistema federativo, reforzando la legitimidad del gobierno de [ROOT.GetLeader]."
 TRM_anti_gehenna_idea: "Sentimiento anti-Gehenna"
 TRM_anti_gehenna_idea_desc: "Hace mucho tiempo, debido a la guerra entre Gehenna y Trinity, la mayoría de las estudiantes de Trinity albergan fuertes sentimientos anti-Gehenna. Ese odio sin duda ayudará a mejorar la capacidad de combate en tiempos de guerra. Sin embargo, una vez terminada la guerra y llegada la etapa de reconstrucción, este sentimiento hostil puede convertirse en un enorme obstáculo."
 TRM_anti_gehenna_idea_tt: "Al inicio, al ocupar estados núcleo de @GEM§YAcademia Gehenna§!, se activan efectos negativos\n"
 TRN_justice_task_force_ns: "Departamento de Realización de la Justicia"
 TRN_justice_task_force_desc: ""

 TRN_political_instability_ns: "Inestabilidad política"
 TRN_political_instability_ns_desc: "El sistema político de Trinity se basa en el principio de la Trinidad, compuesto por Sanctus, Filius y Pater, y adopta un triunvirato que mantiene el equilibrio mediante la complementariedad y el contrapeso mutuos. Sin embargo, dentro de la academia no cesan las rivalidades y el forcejeo entre facciones, por lo que la inestabilidad política persiste."
 TRN_broken_balance_ns: "Equilibrio roto"
 TRN_broken_balance_ns_desc: "A partir del atentado contra Yurizono Seia, el sistema triunviral de Trinity empezó a agrietarse. A medida que los conflictos entre facciones se intensifican, el equilibrio del Tea Party se derrumba y el rumbo del poder se tambalea bruscamente."
 TRN_trinity_volunteer_corps_ns: "Cuerpo de Voluntarios de Trinity"
 TRN_trinity_volunteer_corps_ns_desc: "Una organización clandestina formada para frenar la deriva política de Misono Mika. Llevan a cabo acciones terroristas principalmente contra los miembros de la facción Pater y los traidores de grandes facciones que colaboran con Misono Mika.\n\nPuede eliminarse mediante el enfoque $TRN_intelligence_agency$."
 TRN_womens_rights_movement_ns: "Federación Femenina Pan-Trinity"
 TRN_womens_rights_movement_ns_desc: "Con el fin de apoyar la participación social de las mujeres, se creó la Federación Femenina Pan-Trinity. Esta organización fue fundada para mejorar el trato injusto que sufren las mujeres en el trabajo y en la vida cotidiana, y para garantizar los derechos que legítimamente deben disfrutar."
