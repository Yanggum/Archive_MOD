 TRM_democratic_nagisa_ending_flag: "Se ha desplegado el §Gfinal§! de la historia de Nagisa."
 ## eventos post-ending
 trinity_events_nagisa.56.t: "Nido de víboras" # Hifumi Host
 trinity_events_nagisa.56.desc: "\"Nombre.\" \"Urawa Hanako. Bueno, con lo famosa que es, supongo que la conoces.\" \n\"¿Y a mí qué? ¿Tengo que memorizar hasta el nombre de una pervertida que corre desnuda en medio de Edén? ¡Pena de muerte! ¡Pena de muerte!\"\n\nLa mando intermedia del Departamento de Justicia, Shimoe Koharu, miró a Hanako con ojos afilados. En realidad, decir “no la conozco” era mentira. Incluso dentro del propio Departamento, la reputación de aquella chica amante del exhibicionismo era enorme. Solo que hoy era la primera vez que la veía en persona. Koharu carraspeó y, a propósito, adelantó el torso como una inspectora ruda.\n\n\"Urawa. Entonces, ¿por qué hiciste esto? En los registros aparece que, hasta antes del Gran Cataclismo, llevabas una vida bastante decente.\" \n\"¿El Gran Cataclismo…? Qué gusto por los registros viejos. Je. Pues, simplemente no me gustó el lado ‘serpiente’ de Trinity.\" \n\"¿Serpiente? ¿Y qué tiene Trinity?\" \n\"Filius, Pater, Sanctus… con ropa elegante, y aun después del Gran Cataclismo siguen peleándose por el poder como niños. Nagisa-san presume que ‘cambió’ esa Trinity, pero esa tal Ajitani Hifumi, esa mujer que ni siquiera ha aparecido ante el público una sola vez, no es más que parte de una organización en la sombra, ¿no? Política de contactos. Política de facciones. ¿No crees que esos ‘civilizados’ atrapados en una hipocresía asquerosa son peores que los ‘bárbaros’ que ni siquiera llevan una sola prenda puesta? Sí. Por eso me desnudé. La civilización, Trinity, el Host… todo es basura. Todo es hipocresía. En este nido de víboras…\"\n\nKoharu sintió náuseas ante el interminable discurso de Hanako. Presumía de que ella sola había entendido “la verdad”, pero lo único que hizo fue salir corriendo desnuda. Claro, esa acción en sí era… un poquito… interesante, pero aun así, tanto el motivo como el acto no eran más que sofismas. Koharu cerró el expediente. El interrogatorio terminó. No volvería a cruzarse con esta mujer en su vida.\n\n\"Ya, lárgate. Tengo que interrogar a otros delincuentes, y estoy muy ocupada.\" \n\"Oh, vaya… je. Muy bien, entonces me retiro. Que tenga paz, Shimoe-san.\" \n\nKoharu observó con desdén la espalda de Hanako al alejarse y luego apartó la vista. Esos ‘artistas performáticos’ son imposibles de entender. Nagisa, Hifumi… Da igual quién sea Host allá arriba, en ese mundo sobre las nubes. ¿Qué tiene que ver con nosotras? Ni siquiera son personas a las que vayamos a conocer en toda la vida. Koharu pronunció el nombre de otra desconocida, arrestada por armar un escándalo en un parque con una máscara antigás."
 trinity_events_nagisa.56.a: "\"Siguiente. Shirasu Azusa.\""
 trinity_events_nagisa.57.t: "Un futuro que nunca vi" # Seia Host
 trinity_events_nagisa.57.desc: "\"Has vuelto. A este lugar… a este lugar en el que siento que no debería estar.\"\n\nSeia se sentó en la silla. La silla absurdamente elegante que Nagisa había usado durante tanto tiempo le resultaba un poco incómoda. Seia fue tocando, uno a uno, los bolígrafos del despacho del Host. No había cambiado ni un ápice desde aquella ‘primera etapa’ que ahora solo quedaba como un recuerdo borroso en sueños. Lo único que había cambiado era el vacío de unos años.\n\n\"No… no esperaba que volvería aquí.\" \n\nSeia dibujó una sonrisa tenue. Aunque se presentara como una gran profetisa que ve el futuro, no pudo prever en absoluto que regresaría como Host. Entre las incontables posibilidades que vio mientras estaba en coma por el disparo, este futuro no existía. Entonces, ¿qué es este instante? Quizá su propia clarividencia no era perfecta. Y, extrañamente, Seia pensó que eso la hacía más feliz. ¿No es mejor abrirse camino hacia el futuro que conocerlo todo? Y esa gran tarea de ‘abrir camino’ ahora recaía sobre ella.\n\nNo pasa nada si no hay profecía. No importa si la predicción falla. Aunque el futuro traiga dificultades, si Nagisa y Mika están a su lado, sin duda podrán superarlas."
 trinity_events_nagisa.57.a: "Como siempre ha sido."
 trinity_events_nagisa.58.t: "La muerte del guerrero de blanco" # Mine Host
 trinity_events_nagisa.58.desc: "\"Host-sama, el Cuerpo de Socorro ha solicitado un aumento del presupuesto del año que viene. Como lo redactó personalmente la presidenta del comité, le ruego que lo revise.\"\n\nMine recibió el documento que Serina le ofrecía con la cabeza inclinada y una cortesía impecable, y sintió unas náuseas leves. Un presupuesto escrito por un ‘comité’ del que ella, la comandante del Cuerpo de Socorro, no había participado en absoluto; un comité de gente cuyos nombres ni siquiera conocía. Desde que Mine se convirtió en Host, se estaba alejando cada vez más del Cuerpo de Socorro. Sentada en una silla cómoda, tomando el té con políticos y discutiendo el futuro de Trinity día tras día. Pero en esa vida ya no existían ni el ‘socorro’ ni los ‘pacientes’. El modo en que Serina la trataba, como si Mine fuera una autoridad externa en vez de la comandante, arrancó a la fuerza la realidad que Mine había olvidado durante el último mes.\n\n\"Yo soy… la comandante del Cuerpo de Socorro. Entonces ¿por qué el Cuerpo de Socorro presenta estos papeles sin mi aprobación…?\"\n\nMine quiso enfadarse. Pero no pudo. No fue el Cuerpo de Socorro el que abandonó a Mine. Fue Aomori Mine quien abandonó el socorro. Mine sintió cómo se le humedecían los ojos, poco a poco. Era algo que temía desde antes del Gran Cataclismo. La ‘líder de la facción Johann’ con autoridad para entrar en Tea Party cuando quisiera. Pero Mine jamás lo hizo. Porque sabía que, en el momento en que se convirtiera en política, en el momento en que empezara a ponerse una máscara elegante y actuar con una arrogancia refinada, perdería aquella voluntad pura que solo podía existir fuera del escenario político.\n\n\"…Serina.\" \n\"S-sí.\" \n\"¿Quién cree que soy yo, aquí delante de usted?\" \n\"E-eso… ¿qué quiere decir…?\" \n\"¿Sigo siendo la comandante Mine? ¿O solo soy… ‘Host-sama’?\"\n\nSe hizo un largo silencio. Serina intentó responder, pero al final bajó la cabeza. \"Lo siento…\" Esa disculpa fue la respuesta. Mine apretó con fuerza el presupuesto."
 trinity_events_nagisa.58.a: "\"Lo aprobaré… pero por favor, déjeme sola un momento.\""
 trinity_events_nagisa.59.t: "Lo que yo sí puedo hacer" # Ako Host
 trinity_events_nagisa.59.desc.hina: "\"Hacer nuevos amigos siempre es algo bueno. Incluso si se trata de alguien inesperado.\"\n\nSeia, encantada de haber vencido a Ako en el campo de tiro interior, hizo girar la pistola como un vaquero fanfarrón. Ako estaba a punto de morirse de rabia: había perdido contra Seia, que pasó años en coma en un hospital.\n\n\"¡Truco…! ¡Hubo algún truco! ¡Incluso después de que me convertí en Host, hicieron trampa…!\"\n\nHina sonrió con suavidad y tiró un poco de la manga de Ako. \"Bueno, lo importante no es ganar o perder, ¿no? Lo importante es que hoy fue divertido.\"\n\nTenía razón. ¿Qué importaba ganar o perder? Ako reprimió la indignación por un momento y siguió caminando.\n\nTras las elecciones del Host, Seia empezó a aparecer cada vez con más frecuencia. La razón superficial era que, como inmigrante de otra academia, y Seia, como alguien de Sanctus, ambas eran minorías políticas en Trinity, así que debían cooperar estratégicamente; pero ninguna de las dos era del tipo de ‘hacer politiquería’, ¿no? Una vez, Ako le preguntó a Seia la verdadera razón, y Seia respondió así:\n\n\"He pasado años en coma, tendida en una cama de hospital, ¿no es así? Por eso, Nagisa y otros nacidos en Trinity intentan sobreprotegerme… como si fuera una copa de cristal a punto de romperse. Eso es un prejuicio. Yo no caí en cama por una enfermedad rara, sino por un atentado. Pero la inmigrante Ako no me trata de ese modo. Y eso me resulta cómodo. Cuando cambia el lugar desde el que miras, también cambia el paisaje del mundo. Hay paisajes que solo el Host Ako puede ver; y, por eso mismo, cosas que solo el Host Ako puede hacer. Yo quería conocerlas.\"\n\nAko cerró los ojos un instante y volvió a abrirlos. Seia guardó la pistola en la funda. \"¿Está admirando mi puntería? Me resulta sospechoso que me mire así.\" \n\"¿Admiración? No… solo estaba pensando en otra cosa.\" \n\nUn mundo que solo yo puedo ver… Sea lo que sea, si solo ella podía proteger a esas dos, entonces debía hacerlo. Con las risas y sonrisas bulliciosas de ambas, Ako decidió agradecer el día que se le había concedido."
 trinity_events_nagisa.59.desc.robot: "\"Hacer nuevos amigos siempre es algo bueno. Incluso si se trata de alguien inesperado.\"\n\nSeia, encantada de haber vencido a Ako en el campo de tiro interior, hizo girar la pistola como un vaquero fanfarrón. Ako estaba a punto de morirse de rabia: había perdido contra Seia, que pasó años en coma en un hospital.\n\n\"¡Truco…! ¡Hubo algún truco! ¡Incluso después de que me convertí en Host, hicieron trampa…!\"\n\nHina, con una expresión de incredulidad, cruzó los brazos. \"¿No se terminó ya el juego? Además, al final es un ‘juego’. Perder no provoca nada.\" \n\nTenía razón. ¿Qué importaba ganar o perder? Ako reprimió la indignación por un momento y siguió caminando.\n\nTras las elecciones del Host, Seia empezó a aparecer cada vez con más frecuencia. La razón superficial era que, como inmigrante de otra academia, y Seia, como alguien de Sanctus, ambas eran minorías políticas en Trinity, así que debían cooperar estratégicamente; pero ninguna de las dos era del tipo de ‘hacer politiquería’, ¿no? Una vez, Ako le preguntó a Seia la verdadera razón, y Seia respondió así:\n\n\"He pasado años en coma, tendida en una cama de hospital, ¿no es así? Por eso, Nagisa y otros nacidos en Trinity intentan sobreprotegerme… como si fuera una copa de cristal a punto de romperse. Eso es un prejuicio. Yo no caí en cama por una enfermedad rara, sino por un atentado. Pero la inmigrante Ako no me trata de ese modo. Y eso me resulta cómodo. Cuando cambia el lugar desde el que miras, también cambia el paisaje del mundo. Hay paisajes que solo el Host Ako puede ver; y, por eso mismo, cosas que solo el Host Ako puede hacer. Yo quería conocerlas.\"\n\nAko cerró los ojos un instante y volvió a abrirlos. Seia guardó la pistola en la funda. \"¿Está admirando mi puntería? Me resulta sospechoso que me mire así.\" \n\"¿Admiración? No… solo estaba pensando en otra cosa.\" \n\nUn mundo que solo yo puedo ver… Sea lo que sea, si solo ella podía proteger a esas dos, entonces debía hacerlo. Con las risas y sonrisas bulliciosas de ambas, Ako decidió agradecer el día que se le había concedido."
 trinity_events_nagisa.59.a: "Para recibir el mañana"
 trinity_events_nagisa.60.t: "No una victoria, sino una página" # Atsuko Host
 trinity_events_nagisa.60.desc: "Remitente: Hakari Atsuko\nDestinataria: Jomae Saori\n\nPara Sat-chan.\n\nYa hasta mi recuerdo empieza a volverse borroso: ¿cuándo fue la última vez que nos vimos, y cuándo fue la última vez que hablamos? ¿Me estarás viendo ahora que me convertí en Host? Espero que sí.\n\nMucha gente llama ‘éxito’ a que la Royal Blood más pobre de Arius se haya puesto en la cima de Trinity. Pero yo no lo veo así. En la vida que se despliega a partir de ahora, este lugar no es un punto final, sino solo una coma pasajera. No creerás que voy a pasarme toda la vida siendo Host y morir aquí… ¿verdad?\n\nSat-chan. Te extraño muchísimo. En la ceremonia de investidura, y también cuando entré por primera vez al despacho ya como Host, que me recibieran Seia-san, Ako-san y también Hifumi-san no fue una mala experiencia, pero aun así… creo que habría sido más feliz si quien estuviera a mi lado fueras tú.\n\n¿Siento que solo he estado quejándome? :) Claro que no es que lo odie. Quiero intentar hacer en Trinity lo que no pude hacer en Arius: ayudar a mucha gente y hacerla feliz. Porque sé lo que es vivir sometida y como esclava bajo Beatrice. Quiero convertirme en alguien que ayude a que las personas de Trinity puedan elegir por sí mismas ‘el futuro que desean escoger’.\n\nSat-chan. Espero el día en que pueda entregarte esta carta directamente.\nCuando ese día llegue, hablemos de muchas, muchísimas cosas que no pudimos compartir.\n\nEscrito en [GetDate].\n\nHakari Atsuko,\nHost de Trinity."
 trinity_events_nagisa.60.a: "La carta esperó su día de envío, guardada en el escritorio."
 ## ruta oculta (Takane), la más difícil de ver
 trinity_events_nagisa.61.t: "¡Ohoho! ¡Soy la Host!" # Takane Host
 trinity_events_nagisa.61.desc: "\"Esto es una locura.\" \n\nCon la cabeza entre las manos y desplomada en el suelo del despacho del Host, junto a Takane, el jefe Yakumo —que había entrado presentándose como el ‘asistente de la Gran Duquesa’— estalló en carcajadas.\n\n\"¡Ajajá! De verdad no me imaginé que esto acabaría así. ¡‘Gran Duquesa Takane, Host Takane’! ¿Había salido alguna figura así de grande de Red Winter?\"\n\"¿Le parece gracioso? ¡Toda la historia de la ‘Gran Duquesa del Reino Invernal’ es mentira…! ¡Trinity entera confía en mí, y Nagisa-san me entregó el puesto de Host! ¿Sabe lo que pasará si esto se descubre ahora?\" \n\"La guillotina, supongo.\" \n\"¿¡Por qué lo dice como si fuera asunto de otros!?\" \n\nVoy a morir. No es una metáfora: voy a morir de verdad. Mientras Takane permanecía tirada en el suelo, exhausta, Yakumo sonrió con total seguridad.\n\n\"No podemos cambiar lo que ya pasó, ¿no? Entonces, ¿qué tal si lo hacemos así? Cerramos esta obra… de forma perfecta.\" \n\"¿Qué quiere decir?\" \n\"Conviértete en la Host más grande de la historia de Trinity. Y haz que a nadie se le ocurra siquiera investigar si Takane no era una Gran Duquesa. Al punto de que piensen: ‘¡Ah! ¡Tocar a esta persona es blasfemia!’ …Vamos, no hay otra alternativa.\""
 trinity_events_nagisa.61.a: "\"No me queda de otra…\""
 trinity_events_nagisa.62.t: " " # Nagisa Host (reelección)
 trinity_events_nagisa.62.desc: " "
 trinity_events_nagisa.62.a: " "
 trinity_events_nagisa.63.t: "Si acaso"
 trinity_events_nagisa.63.desc: "\"Todavía es solo un rumor, pero dicen que Nagi está considerando entregar el cargo de Host a alguien. Y tú eres la persona que más está llamando la atención como ‘siguiente Host’.\"\n\nAko tenía un talento increíble para soltar historias enormes como si fueran un comentario al pasar, en situaciones nada especiales. Y por eso Hifumi casi se desmaya.\n\nUna cafetería en Edén. Hifumi había ido a escuchar cómo iba el día a día reciente de Nagisa, y miró a Ako con la mente en blanco.\n\n\"E-esto… ajaja. ¿No será una broma tardía del Día de los Inocentes?\" \n\"No somos tan cercanas como para bromear así, ¿no crees?\" \n\"S-sí… pero aun así… ¿política? ¿No será fake news o algo?\" \n\nCon solo oír la palabra ‘Host’, Hifumi sintió que se le iba la conciencia. Ella no era más que una chica ‘normal’. Solo que, por casualidad, era amiga de la máxima autoridad de Trinity. Y aun así… que existiera la posibilidad de heredar un poder tan grande.\n\nAko soltó un suspiro corto.\n\n\"Dicen que esa persona está sufriendo mucho por el peso del cargo. Yo no lo entiendo del todo, pero en realidad era alguien amable y luminosa, no era ese tipo de persona. Desde que entró en Tea Party se volvió alguien que sospecha de los demás. …Y ahora quiere dejar de hacer precisamente eso: ‘sospechar’.\" \n\"¿Por eso está considerando renunciar a ser Host?\" \n\"Eso parece. Decidió confiar más en los demás, o eso me dijeron. Y como la persona en la que más confía en lo personal eres tú, y además te ha señalado como heredera…\" \n\n\"Pero… yo lo encuentro extraño. Si la razón por la que la personalidad de Nagisa-sama cambió, si la razón por la que dejó de poder confiar en otros y sufrió tanto, fue la ‘política’… entonces, ¿por qué me encargaría a mí ese trabajo doloroso, enfermo, agotador? Desde el inicio no tiene sentido. Yo también… …cambiaría. ¿No puede hacerlo usted, Ako-sama?\" \n\nAko pareció desconcertada por un instante, pero enseguida se arregló la punta de las uñas y negó con la cabeza.\n\n\"Eso no es algo que yo pueda decidir.\""
 trinity_events_nagisa.63.a: "\"Sí… ninguno de nosotros puede decidirlo directamente.\""
 trinity_events_nagisa_63_a_tt: "§gEl primer día en que Nagisa entró a Tea Party… ¿acaso aquella Nagisa tenía poder de decisión?§!"
 trinity_events_nagisa.64.t: "Náuseas"
 trinity_events_nagisa.64.desc: "Nagisa sonrió con dulzura mientras le ponía a Hifumi una cuerda al cuello y una corona de espinas en la cabeza. No, no es que realmente se las pusiera. Simplemente, el cargo de Host era, en sí mismo, un instrumento de tortura.\n\nHifumi no tenía amigos aparte de Nagisa. Antes del Gran Cataclismo, había visitado algunas veces el distrito autónomo de Abydos para comprar muñecos de Peroro. Allí se cruzó un par de veces con estudiantes de Abydos. Si el Gran Cataclismo no hubiera ocurrido, quizá habrían podido hacerse amigas. Pero eso no pasó.\n\nTampoco hizo amigos en Trinity. Si el Gran Cataclismo no hubiera ocurrido, quizá, tras muchas coincidencias y milagros, habría vivido varios incidentes; quizá habría conocido amigas nuevas en clases de recuperación. Pero eso no pasó.\n\nY al final, incluso Nagisa se marchó del despacho del Host. Seguía siendo parte de Tea Party, pero parecía haber elegido disfrutar su vida más que la política. Entregó sus tareas a su ‘heredera política’ y cada vez intervino menos en el Host.\n\nY Ajitani Hifumi se quedó sola.\n\nEl despacho del Host al que nadie venía a menos que tú los llamaras. Las damas de Filius, que no eran más que ‘compañeras de facción’. Una merienda a solas, frente a un muñeco de Peroro.\n\n\"Ajajá…\"\n\nHifumi dejó la taza de té."
 trinity_events_nagisa.64.a: "Así que la política… puede ser tan asquerosa."
 trinity_events_nagisa.65.t: "Confío en usted, Hifumi-san"
 trinity_events_nagisa.65.desc: "\"Hifumi-san. A partir de ahora, dejaré de venir al despacho del Host todos los días.\" \n\"…¿Eh?\" \n\nEse día, con una sola frase de Nagisa, a Hifumi se le cayó al suelo el bolígrafo que sostenía. Nagisa dijo que ya no visitaría el despacho del Host, como si estuviera comentando ‘hoy el clima está despejado’.\n\n\"…La Host es usted, Hifumi-san. Yo solo he bajado a ser una integrante más de la facción Filius. Hasta ahora he revisado por usted documentos que debía manejar y le he indicado el rumbo de políticas, no por abuso de autoridad, sino para protegerla a usted, que era políticamente inexperta. Sin embargo… ¿acaso no ha ‘aprendido’ ya usted con mis enseñanzas?\" \n\nNagisa tenía razón. Lo que hacía era, sin duda, ‘consideración’. No quería convertir a Hifumi en una marioneta, sino reconocerla como una líder política legítima. Pero para Hifumi, esa consideración era aterradora.\n\n\"Entonces… ¿tendré que hacer todo esto yo sola…?\" \n\"No. A su lado está la facción Filius, ¿no es así? Como hice yo, confíe. La fe y el amor la templarán para que pueda resistir.\""
 trinity_events_nagisa.65.a: "Confiar en Filius… y resistir."
 trinity_events_nagisa_65_a_tt: "§g“Señor, Señor… ¿por qué me has abandonado?”§!"
 trinity_events_nagisa.65.b: "Armarse de valor y decir: ‘No puedo resistir.’"
 trinity_events_nagisa_65_b_tt: "§gLa última oportunidad, antes de que el alma se rompa§!"
 trinity_events_nagisa.66.t: "Fausto"
 trinity_events_nagisa.66.desc: "Nagisa siempre tuvo a Mika y a Seia a su lado. Aunque se lamentara diciendo que había cambiado, seguía acompañada por quienes recordaban cómo era antes.\nPero Hifumi solo tenía a un muñeco de Peroro silencioso. Nagisa la arrojó al tablero político pese a que ella no lo quería, y luego se marchó. Tal vez Nagisa, habiendo vivido ella misma el proceso de ‘una chica que no sabía de política entra a Tea Party y cambia’, creyó firmemente que ‘Hifumi sería diferente’.\n\n‘Nagisa-sama… ¿por qué solo conmigo fue tan cruel? Amó a los alemanes, a Gehenna, a Arius… incluso a Pater. Entonces… ¿por qué solo a mí me abandonó?’\n\n\"Siguiente documento. Son organizaciones antisistema que pueden influir en la política de Trinity. La resistencia subterránea alemana que exige democratización…\" \n\"Déjelo. Yo lo revisaré.\" \n\nHifumi poco a poco dejó de sonreír. Su único interlocutor era ella misma, reflejada en el espejo. A ese interlocutor lo llamó Fausto.\n\n\"¿Qué opina, Fausto-san, de estos disidentes? Ah… ¿que hay que matarlos? Claro. Por Filius, el único bando que está de mi lado en este mundo, eso es lo mínimo que puedo hacer.\" \n\nFausto le habla: Los locales son enemigos que esconden una espada. Sospecha. Nagisa guardó la reconciliación con Pater y la amistad con Mika. Pero ¿acaso ellas no tienen también una hoja afilada? Sospecha. Mira las calles. Mira a esos innumerables plebeyos. Ellos quieren derrumbar la oligarquía de Tea Party.\n\nSospecha."
 trinity_events_nagisa.66.a: "Yo… superé a Nagisa-sama. Fue gracias a sus enseñanzas."
 trinity_events_nagisa_66_a_tt: "§R“Esas enseñanzas… yo las odio.”§!"
 trinity_events_nagisa.67.t: "Esto no es socorro"
 trinity_events_nagisa.67.desc: "\"Seia-sama. Por su petición, decidí desafiar el cargo de Host de Trinity, y así tomé el poder. Pero con este poder… perdí algo aún más grande. El socorro.\" \n\nMine arrastró un escudo con la pintura descascarada, convertido ya en poco más que basura plástica.\n\n\"Este escudo, que siempre llevaba conmigo cuando me enorgullecía de ser comandante del Cuerpo de Socorro. ¿Sabe dónde estaba? Tras convertirme en Host, mientras yo sonreía con hipocresía en la sala de Tea Party brindando con té junto a políticos… esto estuvo meses arrumbado en un almacén, y casi termina en un centro de reciclaje.\" \n\nMine apretó el puño con fuerza, como si fuera a golpearse a sí misma.\n\n\"…Ni siquiera pude mostrar ante Serina-san mi faceta de comandante del Cuerpo de Socorro. Ya no me atrevo a llamarme a mí misma socorrista. Seia-sama… por favor, tome el puesto de Host. Acepte cualquier otro cargo que quiera darme. Pero ‘Tea Party’ no es para mí. Este lugar es demasiado cómodo, todos me alzan como si fuera una reina… y eso hace que olvide mi deber…\""
 trinity_events_nagisa.67.a: "Seia asintió con pesadez."
 trinity_events_nagisa_67_a_tt: "§g“Ahora entiendo por qué la facción Johann se negó a entrar a Tea Party desde antes del Gran Cataclismo. Lo siento.”§!"
 trinity_events_nagisa.67.b: "Durante un largo rato, Seia persuadió a Mine."
 trinity_events_nagisa_67_b_tt: "§g“La política también es una forma de socorro. Mine no ha dejado de ayudar; solo lo hace de una forma distinta.”§!"
 trinity_events_nagisa.68.t: "Bipartidismo"
 trinity_events_nagisa.68.desc: "Las numerosas facciones que proliferaban dentro de Tea Party en Trinity perdieron, en su mayoría, su influencia política debido a la situación posterior al Gran Cataclismo. Actualmente, Tea Party se encuentra bajo un bipartidismo dominado por dos facciones: Filius y Pater.\n\nAhora que solo quedan dos facciones fuertes, el bando de [ROOT.GetLeader] debe prestar especial atención a los movimientos de Pater para reclutar talento hacia su propio bloque. Misono Mika no pretende dejar de confrontar políticamente a Nagisa, y desea múltiples colaboradores para fortalecer a Pater.\n\nPor supuesto, nosotros estamos preparados para enfrentarlas."
 trinity_events_nagisa.68.a: "Filius no perderá."

 # 나기사 BoP 이벤트
trinity_events_nagisa_faction.1.t: "Celebrando la victoria de Edén"
trinity_events_nagisa_faction.1.desc: "Trinity ha conseguido un éxito grandioso. Entre las dos fuerzas rivales, Gehenna y Trinity, quien alzó el trofeo de la gloria fue la orgullosa Trinity, liderada por Kirifuji Nagisa. Lo importante era que esta victoria la obtuvo la “Trinity de Nagisa”. ¿Habría sido posible una victoria así si el poder lo hubiera tomado Mika, Seia, o la facción de Yohane, o la Sisterhood? Filíus lo dice al unísono: “Absolutamente imposible”. Entonces, para conmemorar esta victoria gloriosa—la victoria de Nagisa—era necesario crear una obra de arte.\n\nTrinity no es como las demás academias. Debe ser refinada y, más que nunca, elegante. En vez de un desfile militar o propaganda masiva, ofrecer una obra de arte dedicada a una sola persona, Nagisa, sería el trofeo más digno para celebrar la victoria en Edén. Se estableció el objetivo de “crear una obra de arte para Nagisa”. Entonces… ¿qué habría que hacer? La opción más conservadora es la literatura pura. La propuesta de encargar una obra literaria para elogiar a Nagisa goza de gran popularidad incluso dentro de Filíus. Además, podría difundirse entre los intelectuales de Trinity. Sin embargo, dado el bajo impacto que la literatura tiene sobre el gran público, el efecto propagandístico masivo sería algo menor.\n\nLa otra propuesta es el arte popular. Ampliando el rango a pinturas, o incluso a literatura de género, se sugiere crear una obra artística que ensalce a Kirifuji Nagisa. Puede que esto no encaje del todo con los gustos elegantes de Trinity, pero sería mucho más fácil de entender para nuestras masas, y permitiría que más gente conozca la grandeza de Nagisa."
trinity_events_nagisa_faction.1.a: "Encargar una obra literaria."
trinity_events_nagisa_faction.1.b: "Encargar arte popular."
trinity_events_nagisa_faction_1_tt: "§gLa obra literaria tiene mayor probabilidad de éxito pero un efecto positivo menor; el arte popular tiene menor probabilidad de éxito pero un efecto positivo mayor. El resultado podrá confirmarse dentro de 120 días.§!"
trinity_events_nagisa_faction.2.t: "Éxito literario - Las huellas de la santa"
trinity_events_nagisa_faction.2.desc: "La novela bélica “Las huellas de la santa”, enviada por una joven llamada Sakurai Miyo de la Academia de Artes Wild Hunt, quedará como la mayor obra de propaganda literaria en la historia de nuestra Trinity. “Las huellas de la santa” compara a Kirifuji Nagisa con una “santa” que se sacrifica infinitamente por Trinity, y a los opositores de Nagisa con “serpientes venenosas” que seducen a Trinity. Esta novela, que comienza justo antes de la Gran Transferencia, transmite a los lectores—con un poder de apelación sorprendente—que Nagisa ha consagrado su vida a Trinity con una devoción absoluta. Con un sólido conocimiento militar como base, describe con notable fuerza de escritura cómo el Tea Party, bajo el mando de Nagisa, neutraliza a los enemigos externos.\n\nKirifuji Nagisa reconoció que la valoración de Miyo sobre ella era excesiva y que la descripción de Trinity contiene algunos errores de documentación. Aun así, elogió que la obra es bellísima y que la retrata a ella misma de forma elegante. Se decidió producir esta novela en masa para que sea leída por las generaciones educadas de Trinity. De ahora en adelante, todos—desde los inspectores del Tea Party hasta los nuevos reclutas del Departamento de Ejecución de Justicia—leerán este libro como lectura obligatoria."
trinity_events_nagisa_faction.2.a: "\"Es realmente hermoso.\""
trinity_events_nagisa_faction.3.t: "Fracaso literario - Nagisa, la caza-vampiros mas invencible"
trinity_events_nagisa_faction.3.desc: "La obra literaria “Nagisa, la caza-vampiros mas invencible”, enviada por la novelista Kuchiki Shura, fue un desastre perfecto. Hasta el punto de que muchos implicados fueron reprendidos por haber decidido encargar una novela a un escritor externo como este. La historia propone una teoría conspirativa: Kirifuji Nagisa es una cazadora de vampiros, y que los estudiantes de la facción Pater, Gehenna, Red Winter, Hyakkiyako, Millennium, Shanhaijing, y así sucesivamente—es decir, de todas las academias—son todos vampiros. La Gran Transferencia fue parte de una “hechicería del Chegang” para borrar el sol, y el Tea Party era una organización de cazadores de vampiros con siglos de historia. Y Nagisa, cada noche, cuando se pone el sol, empuña la Espada Sagrada de la Justicia, Blood-Soul-Hunter-Justice-Soul-Blade, para exterminar vampiros.\n\nMientras leía el libro, Nagisa se rió varias veces por lo absurdo del contenido. “Este libro es divertido, pero no quiero que lo lea el público.” En lugar de repartirlo como propaganda, Nagisa decidió guardar una sola copia en su biblioteca personal. Quizá fue la decisión correcta. Sin duda, el contenido habría provocado conflictos diplomáticos con academias de todo Kivotos."
trinity_events_nagisa_faction.3.a: "\"Pero… ¿por qué escribió 'cheㅔgang' en vez de 'saikyou' (el más fuerte)?\""
trinity_events_nagisa_faction.4.t: "Éxito del arte popular - Un juego en Millennium"
trinity_events_nagisa_faction.4.desc: "El juego móvil “Caballera Santa Nagisa”, encargado a una directora de juegos de Millennium llamada UZQUEEN, es un simple RPG retro… pero justamente esa simplicidad cautivó a las masas. El contenido es sorprendentemente sencillo: Kirifuji Nagisa, como caballera santa, derrota con estilo a los enemigos de Trinity uno por uno y va creciendo. En lugar de contar una historia compleja y profunda, el juego se concentra únicamente en que Nagisa vence a los villanos y protege a Trinity. Por perseguir el estilo retro, el control es algo incómodo y algunas secciones son criticadas por ser injustamente difíciles. Aun así, “Caballera Santa Nagisa” logró un éxito popular al recibir elogios como “un juego que enciende el espíritu de desafío de los usuarios”.\n\nLa propia Kirifuji Nagisa también lo jugó y comentó favorablemente: “Es divertido que yo derrote a los enemigos de Trinity.” El Tea Party lo distribuyó gratis por internet, promocionándolo como “un juego de muy bajos requisitos, tan simple que es compatible con cualquier dispositivo existente”. Este juego ayudará enormemente a mejorar la imagen de Nagisa entre el público."
trinity_events_nagisa_faction.4.a: "\"¿El Gran Rey Demonio de 100KG…? ¿Quién demonios es esta persona?\""
trinity_events_nagisa_faction.5.t: "Fracaso del arte popular - Nagisa Host, que jamás pierde"
trinity_events_nagisa_faction.5.desc: "El manga “Nagisa Host, que jamás pierde vs Gehenna, un don nadie patético”, creado por Meruri—la mangaka más famosa de la Federación Red Winter a petición de Trinity—será, probablemente, el manga más impactante en la historia de Trinity. Meruri afirmó haber descubierto un secreto asombroso oculto tras la victoria de Kirifuji Nagisa contra Gehenna. Que la sádica reina Nagisa habría… en una noche… con la presidenta Makoto y la jefa del Comité de Disciplina Hina… un… en fin, “algo”, y así anexionó Gehenna. El manga retrata en 56 páginas a todo color cómo Nagisa “conquistó” a Gehenna en el dormitorio.\n\nSin saber el contenido, Nagisa recibió la obra y, mientras la leía en la sala de reuniones del Tea Party, se desplomó de su silla y se desmayó. Al enterarse después, las monjas de la Sisterhood rociaron el manga con agua bendita y realizaron un rito de exorcismo, y la madre superiora Sakurako en persona guardó el libro maldito en una caja fuerte, sellándolo para que nadie lo vea jamás. El manuscrito original de este manga se almacenará en lo más profundo del archivo de libros raros de Trinity, y nunca más, nunca, se permitirá que este grimorio satánico vuelva a ver la luz del sol."
trinity_events_nagisa_faction.5.a: "\"...¿Cómo que yo… empuñando un látigo…?\""


 # 나기사 외교 이벤트
 trinity_events_nagisa_diplomacy.1.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.1.desc: "La negociación para una organización conjunta de seguridad pública solo fue el comienzo. El bando de [TRM.GetLeader] propuso formalmente al bando de [GEH.GetLeader] la “renegociación del Tratado de Edén”. Se trata de una negociación para establecer un pacto de no agresión y una garantía mutua de independencia entre el gobierno de [TRM.GetNameDef] y el gobierno de [GEH.GetNameDef]. Si aceptamos, se celebrarán reuniones de trabajo para revisar los detalles del acuerdo."
 trinity_events_nagisa_diplomacy.1.a: "Empecemos las negociaciones."
 trinity_events_nagisa_diplomacy.1.b: "No… no puedo adivinar las intenciones de Nagisa…"
 trinity_events_nagisa_diplomacy.2.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.2.desc: "Como el bando de [GEH.GetLeader] aceptó nuestra propuesta, han comenzado las negociaciones técnicas para concretar el Tratado de Edén. El Pandemonium Society y la facción Pater harán todo lo posible por sabotear estas conversaciones. No debemos retroceder. A estas alturas, la única persona capaz de proteger la paz entre Trinity y Gehenna… es [ROOT.GetLeader]."
 trinity_events_nagisa_diplomacy.2.a: "Empecemos las negociaciones."
 trinity_events_nagisa_diplomacy.3.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.3.desc: "El servicio de inteligencia de [ROOT.GetName] ha detectado movimientos para reimpulsar el Tratado de Edén entre Trinity y la Prefect Team de Gehenna. Los equipos técnicos ya han iniciado conversaciones y están redactando cláusulas detalladas para garantizar la independencia mutua y un pacto de no agresión entre ambas academias.\n\nSi el Tratado de Edén se firma de verdad, tendremos que enfrentarnos al poder combinado de Trinity y la Prefect Team. Para nuestra seguridad, eso sería poco menos que un desastre. Debemos usar a nuestros agentes para detener estas negociaciones, cueste lo que cueste. ¡A toda costa!"
 trinity_events_nagisa_diplomacy.3.a: "Te enseñaré cómo terminó el Edén."
 trinity_events_nagisa_diplomacy.4.t: "에덴 조약 실패"
 trinity_events_nagisa_diplomacy.4.desc: "¿Quién fue el culpable? Podría haber sido obra de la facción Pater. O quizá un caos provocado por agentes del Pandemonium Society. Nuestras negociaciones se volvieron extrañamente lentas y estancadas. Durante los viajes entre ambas academias, no paraban de difundirse noticias falsas y difamatorias, y la gente común de Gehenna y Trinity continuó protestando para sabotear el tratado de paz.\n\nAl final, el Tratado de Edén quedó oficialmente suspendido tras un incidente sin precedentes: una “bomba de sacerdote” explotó en el lugar de negociación. Las cúpulas de Trinity y la Prefect Team sabían que el responsable del atentado no era la otra parte, y por eso se consolaron mutuamente tras el ataque. Pero las conversaciones, interrumpidas por el terrorismo, ya no pudieron reanudarse.\n\nQuizá algún día ambas academias vuelvan a tomarse de la mano por la paz. Pero parece que hoy… no es ese día."
 trinity_events_nagisa_diplomacy.4.a: "Es desesperanzador..."
 trinity_events_nagisa_diplomacy.6.a: "Qué día tan magnífico, ¿no crees?"
 trinity_events_nagisa_diplomacy.7.t: "Rechazo de negociación por parte de [GEH.GetName]"
 trinity_events_nagisa_diplomacy.7.desc: "¿Hubo algún problema en la amistad entre [GEH.GetLeader] y nosotros? De forma sorprendente y chocante, el bando de [GEH.GetLeader] ha rechazado ampliar el Tratado de Edén más allá del simple intercambio de organizaciones policiales de seguridad. Dado que este tratado se basaba en la amistad y la buena voluntad entre los líderes de ambas academias, ahora que esa buena fe se ha quebrado, no existe ningún método para reanudar las negociaciones."
 trinity_events_nagisa_diplomacy.7.a: "Esto es multijugador, ¿verdad? La IA Hina jamás elegiría esta opción."
 trinity_events_nagisa_diplomacy.8.t: "Éxito del Tratado de Edén"
 trinity_events_nagisa_diplomacy.8.desc: "Hoy es el mejor día tanto para [GEH.GetName] como para [TRM.GetName]. El Tratado de Edén, legado del anterior presidente del consejo estudiantil, ha dado frutos y ha sido firmado oficialmente por ambos líderes, decidiendo así una paz permanente entre las dos academias y la formación de un frente común contra [GEM.GetName]. A pesar de la larga rivalidad entre Gehenna y Trinity, sus líderes racionales han logrado encontrar la mejor forma de reducir sus diferencias.\n\nPor supuesto, esta noticia será desesperante para el bando de [GEM.GetLeader]. El gobierno de [GEM.GetName] ha quedado aislado, y el sueño de [GEM.GetLeader] de una 'unificación de Gehenna' parece ahora más lejano que nunca."
 trinity_events_nagisa_diplomacy.8.a: "Brindemos por nuestra amistad."
 trinity_events_nagisa_diplomacy.10.a: "¡Malditos traidores de Gehenna!"
 trinity_events_nagisa_diplomacy.11.t: "Línea Hanuma"
 trinity_events_nagisa_diplomacy.11.desc: "Este plan de red de fortificaciones, claramente nombrado en honor a Hanuma Makoto, quien fue presidente del Pandemonium Society justo antes del Gran Cambio, nos ha sido transmitido por el bando de [TRM.GetLeader]. Trinity teme que el día en que las máquinas de guerra de [GEM.GetName] invadan desde el este esté cada vez más cerca. Su plan defensivo, la Línea Hanuma, ha sido diseñado para instalar fortificaciones en nuestras regiones clave, de modo que, cuando comience la invasión de [GEM.GetLeader], sus ataques queden estancados en dichas zonas estratégicas. Aunque este proyecto requerirá un presupuesto considerable y mucho tiempo, y su efectividad real puede ser objeto de debate, merece ser discutido."
 trinity_events_nagisa_diplomacy.11.a: "Entendido."
 trinity_events_nagisa_diplomacy.12.t: "¿Posibilidad de unificación federal?"
 trinity_events_nagisa_diplomacy.12.desc: "Tras la caída de [GEM.GetName], lo único que permanece son las dos fuerzas que han forjado una profunda amistad gracias al éxito del Tratado de Edén: [GEH.GetName] y [TRM.GetName]. ¿No podríamos ampliar aún más el actual Tratado de Edén y lograr una unificación federal entre Trinity y Gehenna?"
 trinity_events_nagisa_diplomacy.12.a: "Iniciar negociaciones."
 trinity_events_nagisa_diplomacy.12.b: "No, es mejor permanecer separados."
 trinity_events_nagisa_diplomacy.13.t: "Unificación federal Trinity-Gehenna"
 trinity_events_nagisa_diplomacy.13.desc: "Hoy es un día milagroso que jamás se repetirá en la historia de Trinity. Ha sido declarado oficialmente como día festivo nacional, y todas las oficinas públicas y empresas estatales de Trinity han cerrado para celebrar este feriado inesperado. En la fiesta celebrada en la sala del Tea Party, Sorasaki Hina celebró la \"amistad federal entre ambas academias\". ¿Quién más podría haber conducido un éxito como este? Para Nagisa, hoy ha sido un milagro irrepetible.\n\nLa Oficina del Host de Trinity anunció oficialmente que Trinity y Gehenna han logrado una unificación bajo un sistema federal. Dado que ambas academias mantienen sus propias fuerzas armadas —el Departamento de Justicia y la Prefect Team—, no se trata de una unificación perfecta, sino más bien de una confederación. Sin embargo, ambas academias prometieron que, cuando los conflictos y malentendidos entre ellas sanen por completo y la población general llegue a comprenderse mutuamente, ambas fuerzas militares se unificarán.\n\nSegún los términos de la unificación federal, Gehenna y Trinity conservan sus propios gobiernos y envían equipos separados a competiciones internacionales como el Gran Festival Deportivo. Sin embargo, la política exterior queda bajo jurisdicción de Trinity, estableciendo claramente un modelo de 'un país, dos sistemas'."
 trinity_events_nagisa_diplomacy.13.a: "Es complejo, pero lo importante es que la unificación esté liderada por Trinity."
 trinity_events_nagisa_diplomacy.14.t: "Fracaso de las negociaciones federales Trinity-Gehenna"
 trinity_events_nagisa_diplomacy.14.desc: "Aunque se discutió un plan de unificación federal entre Trinity y Gehenna, el bando de la Prefect Team parece preferir un sistema de 'dos estados, dos sistemas' separados pero prósperos. Podríamos profundizar en el debate sobre la autonomía mutua y volver a insistir en la unificación mediante el proyecto de los 'Estados Unidos de Edén'. Sin embargo, por ahora, la propuesta federal ha fracasado."
 trinity_events_nagisa_diplomacy.14.a: "¿Podrían los Estados Unidos de Edén ser una alternativa?"
 trinity_events_nagisa_diplomacy.15.t: "[FROM.GetName] nos reconoce como presidente del consejo estudiantil"
 trinity_events_nagisa_diplomacy.15.desc: "[FROM.GetName] busca nuestra cooperación en el asunto del Benelux. Proponen formar una alianza militar entre [FROM.GetName] y [ROOT.GetName], a cambio de que brindemos apoyo a la seguridad de [FROM.GetAdjective]. Parece que desean obtener un 'nuevo consejo estudiantil general favorable a [FROM.GetAdjective]'. Aceptar esta propuesta podría ser beneficioso para nosotros. Nuestra radical Revolución del 68 no encaja bien con el conservadurismo social de la facción Filius de Trinity, y enfrentarnos a ellos podría convertirse en el detonante para que [FROM.GetLeader] decida invadirnos.\n\nPor supuesto, esta también podría ser nuestra oportunidad: una ocasión milagrosa, quizá irrepetible, para difundir la bandera del liberalismo de la Revolución del 68 desde la ciudad de Luxemburgo hasta Edén."
 trinity_events_nagisa_diplomacy.15.a: "No, lo correcto es unirnos a Trinity."
 trinity_events_nagisa_diplomacy.15.b: "¿Acaso necesitamos su ayuda?"
 trinity_events_nagisa_diplomacy.16.t: "Aceptación de la propuesta de [FROM.GetName]"
 trinity_events_nagisa_diplomacy.16.desc: "[FROM.GetName] ha aprobado una alianza militar con nosotros. Con ello, nos hemos convertido en una academia-estado de Kivotos que tiene al presidente del consejo estudiantil general de su lado. Estas victorias no llegan fácilmente; todo es gracias a la habilidad diplomática de [ROOT.GetLeader]."
 trinity_events_nagisa_diplomacy.16.a: "¡Alabad al Host!"
 trinity_events_nagisa_diplomacy.17.t: "Rechazo de la propuesta de [FROM.GetName]"
 trinity_events_nagisa_diplomacy.17.desc: "[FROM.GetName] ha rechazado nuestra propuesta de alianza militar. Parece que no queda otro camino más que la guerra."
 trinity_events_nagisa_diplomacy.17.a: "Atacar Luxemburgo."
 trinity_events_nagisa_diplomacy.17.b: "¡Aprovechemos para invadir todo el Benelux!"
 trinity_events_nagisa_diplomacy.17.c: "No. Tampoco importa abandonar el Benelux."
 trinity_events_nagisa_diplomacy.18.t: "Propuesta de protectorado de [FROM.GetName]"
 trinity_events_nagisa_diplomacy.18.desc: "[FROM.GetName] afirma que [ROOT.GetName] no es capaz de protegerse por sí mismo. Consideran que, frente a las paranoicas acusaciones de bolchevismo interdimensional del gobierno de España, nos resultará difícil mantener nuestra independencia, y aseguran que su protección es indispensable. Sin embargo, ¿puede llamarse verdadera independencia el convertirse en sus subordinados? Tenemos derecho a rechazar la propuesta, pero existe el riesgo de que [FROM.GetName] lance un ataque en respuesta."
 trinity_events_nagisa_diplomacy.18.a: "Si quieren venir, que vengan, fanáticos."
 trinity_events_nagisa_diplomacy.18.b: "No queda más remedio que someternos."
 trinity_events_nagisa_diplomacy.19.t: "Aceptación de la propuesta de [FROM.GetName]"
 trinity_events_nagisa_diplomacy.19.desc: "[FROM.GetName] ha aprobado nuestra propuesta de protección. Estas victorias no llegan fácilmente; todo es gracias a la habilidad diplomática de [ROOT.GetLeader]."
 trinity_events_nagisa_diplomacy.19.a: "¡Alabad al Host!"
 trinity_events_nagisa_diplomacy.20.t: "Rechazo de la propuesta de [FROM.GetName]"
 trinity_events_nagisa_diplomacy.20.desc: "[FROM.GetName] ha rechazado nuestra propuesta de protección. Anticipan una posible invasión por nuestra parte y, probablemente, lucharán hasta el final por su independencia. ¿Es realmente necesario que combatamos contra [FROM.GetName]? ¿No merecen las bellas obras de arte de Wild Hunt ser protegidas en su lugar, sin quedar envueltas en las llamas de la guerra?"
 trinity_events_nagisa_diplomacy.20.a: "Nuestra respuesta es la guerra."
 trinity_events_nagisa_diplomacy.20.b: "Mostraron un valor admirable, y los respetamos."
 trinity_events_nagisa_diplomacy.21.t: "Code: BOX - Preparativos para la delegación"
 trinity_events_nagisa_diplomacy.21.desc: "\"La visita a Millennium no es simple turismo. Debemos observar nuevas tecnologías y aprender de ellas...\"\n\nLa reunión interna de Trinity se desarrolló en un ambiente pesado. Trinity no debía atacar a Millennium, sino aprender de ellos. Tras esta decisión surgieron acalorados debates, pero finalmente la Sisterhood aceptó seguir la resolución del Tea Party. Ahora, la cuestión era decidir quién debía encabezar la delegación.\n\nLa facción Pater insistía en que Misono Mika debía liderarla, pero era poco probable que el Tea Party aprobara otorgar logros políticos a una rival de la facción Filius. La alternativa más razonable era la líder de Filius, Kirifuji Nagisa, quien sin duda podría hacer brillar el nombre de Trinity en Millennium.\n\nTambién se propuso enviar al Departamento de Justicia. Como organización directa de seguridad y fuerza militar del Tea Party, era una opción confiable para una misión en el extranjero. ¿Quién, si no el Departamento de Justicia, podría asumir con reverencia una tarea tan crucial? En particular, Nakamasa Ichika, conocida por su carácter calmado y paciente, emergió como una candidata ideal.\n\nLa siguiente alternativa fue Aomori Mine, líder de la facción Johann. La Orden de Socorro, al ser una organización médica, siempre ha mostrado apertura hacia nuevos conocimientos y tecnologías. Su capacidad para salvar tantas vidas se debía precisamente a su disposición para adoptar rápidamente los avances médicos.\n\nPor último, la facción Pater exigió que, si Mika no podía ser enviada, se designara como alternativa a Amau Ako, ex alta funcionaria administrativa de la antigua Prefect Team de Gehenna y actual inspectora del Tea Party. Aunque la intención de Pater era que una 'campesina ignorante de Gehenna' hiciera el ridículo en la diplomacia internacional, el hecho de que Ako haya representado a Gehenna en múltiples asuntos diplomáticos demuestra que posee las cualificaciones mínimas para desempeñar el rol de delegada en Millennium.\n\nPor supuesto, la decisión final depende de la pluma de [ROOT.GetLeader]."
 trinity_events_nagisa_diplomacy.21.a: "Nagisa, si yo no doy el ejemplo, ¿quién lo hará?"
 trinity_events_nagisa_diplomacy.21.b: "Ichika, el Departamento de Justicia puede aprender muchísimo."
 trinity_events_nagisa_diplomacy.21.c: "Mine, la Orden de Socorro siempre ha traído la mejor respuesta."
 trinity_events_nagisa_diplomacy.21.d: "Ako, la nueva inspectora traerá resultados sobresalientes."
 trinity_events_nagisa_diplomacy.22.t: "Code: BOX - Día 1"
 trinity_events_nagisa_diplomacy.22.desc.nagisa: "Día 1 del itinerario de Kirifuji Nagisa en la Expo Millennium. En el instante en que entró a la 'Sala de Arcade', donde se promocionaban diversos juegos y consolas de Millennium, Nagisa percibió desde dentro un olor metálico a sangre. Un olor que jamás había sentido en Millennium, un olor que no debería existir aquí. \"...¿Sangre... en una sala de juegos?\" La causa se hizo evidente sin necesidad de caminar más que unos cuantos pasos.\n\n\"¡Por culpa de ustedes, Millennium, tuve que jugar a esta basura de juego!\" \"¡Yo nunca les recomendé ningún juego!\" \"¡Aaaah! ¡Dejen de pelear, ya, ya!\"\n\nFrente al puesto de juegos clásicos, decenas de estudiantes de ambas academias se estaban golpeando entre sí con sillas. Como si hubieran recibido la orden de odiarse, una y otra vez estrellaban las sillas hasta romperle la cabeza al otro y hacer que la sangre roja se extendiera por el suelo azul. Nagisa sintió un leve mareo. No podía creerlo: estudiantes de Trinity que habían venido como visitantes, en vez de mostrarse elegantes, estaban peleando con estudiantes de Millennium.\n\n\"Señora Nagisa, este lugar es peligroso. Debe retirarse...\"\nNagisa negó con la cabeza. \"No. Tengo el deber de hacerme responsable de esta situación. Estudiantes de Trinity, este comportamiento tan grosero hacia Millennium es...\"\n\nNagisa no pudo terminar. Una silla que un estudiante de Trinity lanzó voló en parábola directo hacia ella. ¡Pak! Con un sonido violento, Nagisa sintió que su cuerpo era arrojado al suelo. Gritos, alaridos y un pitido agudo le llenaron los oídos. Ni siquiera entendió qué había pasado. La sangre le brotó de la boca. Su corta capa blanca e inmaculada se estaba tiñendo con su propia sangre.\n\n\"¿Me pegó...? ¿A mí?\"\n\nNagisa siempre se había considerado de carácter apacible. Pero en el instante en que un estudiante de su propia academia la golpeó en la cara, sintió que no era tan \"apacible\" como creía.\n\nSu razón le advertía que quizá estos estudiantes no estaban en su sano juicio. Que debía mantener la calma, dirigir a los guardias y encontrar la causa del incidente. Pero sus emociones... le gritaban que sacara la pistola 'Royal Blend', la apuntara a esa estudiante y disparara."
 trinity_events_nagisa_diplomacy.22.desc.ichika: "Día 1 del itinerario de Nakamasa Ichika en la Expo Millennium. En el instante en que entró a la 'Sala de Arcade', donde se promocionaban diversos juegos y consolas de Millennium, Ichika percibió desde dentro un olor metálico a sangre. Un olor que jamás había sentido en Millennium, un olor que no debería existir aquí. \"...¿Esto no es peligroso?\" La causa se hizo evidente sin necesidad de caminar más que unos cuantos pasos.\n\n\"¡Por culpa de ustedes, Millennium, tuve que jugar a esta basura de juego!\" \"¡Yo nunca les recomendé ningún juego!\" \"¡Aaaah! ¡Dejen de pelear, ya, ya!\"\n\nFrente al puesto de juegos clásicos, decenas de estudiantes de ambas academias se estaban golpeando entre sí con sillas. Como si hubieran recibido la orden de odiarse, una y otra vez estrellaban las sillas hasta romperle la cabeza al otro y hacer que la sangre roja se extendiera por el suelo azul. Ichika sintió un leve mareo. No podía creerlo: estudiantes de Trinity que habían venido como visitantes, en vez de mostrarse elegantes, estaban peleando con estudiantes de Millennium.\n\n\"Señora Ichika, este lugar es peligroso. Debe retirarse...\"\nIchika negó con la cabeza. \"Nah, está bien. ¿No me mandaron de delegada pa' arreglar este tipo de broncas?\" Y se acercó tal cual a las estudiantes en plena pelea. \"A ver, cálmense todas...\"\n\nIchika no pudo terminar. Una estudiante de Trinity le lanzó un puñetazo directo a la cara por meterse en la pelea. ¡Pak! Con un sonido violento, Ichika sintió que su cuerpo era arrojado al suelo. Gritos, alaridos y un pitido agudo le llenaron los oídos. Ni siquiera entendió qué había pasado. La sangre le goteó de la nariz: ploc, ploc, sobre el suelo.\n\n\"Ah, a esto creo que le decían un putazo en la jeta. Qué refrescante.\" \n\nIchika se apoyó en el suelo y se levantó. Tenía la cabeza extrañamente clara y lúcida. En vez de intentar frenarlas con palabras, ¿no habría sido mejor apuntar con su fusil de asalto 'Red Dragon' y vaciarles el cargador a lo loco? ¿Por qué intentó hacer una persuasión larga y rebuscada contra semejantes idiotas? Ichika se limpió la sangre que seguía corriéndole con el dorso de la mano."
 trinity_events_nagisa_diplomacy.22.desc.mine: "Día 1 del itinerario de Aomori Mine en la Expo Millennium. En el instante en que entró a la 'Sala de Arcade', donde se promocionaban diversos juegos y consolas de Millennium, Mine percibió desde dentro un olor metálico a sangre. Un olor que jamás había sentido en Millennium, un olor que no debería existir aquí. \"...¿Sangre? Me dijeron que esto era solo una sala de juegos...\" La causa se hizo evidente sin necesidad de caminar más que unos cuantos pasos.\n\n\"¡Por culpa de ustedes, Millennium, tuve que jugar a esta basura de juego!\" \"¡Yo nunca les recomendé ningún juego!\" \"¡Aaaah! ¡Dejen de pelear, ya, ya!\"\n\nFrente al puesto de juegos clásicos, decenas de estudiantes de ambas academias se estaban golpeando entre sí con sillas. Como si hubieran recibido la orden de odiarse, una y otra vez estrellaban las sillas hasta romperle la cabeza al otro y hacer que la sangre roja se extendiera por el suelo azul. Mine sintió un leve mareo. No podía creerlo: estudiantes de Trinity, como visitantes, peleando con estudiantes de Millennium.\n\n\"Señora Mine, este lugar es peligroso. Debe retirarse...\"\nMine negó con la cabeza. \"He venido como representante de la delegación de Trinity. Tengo el deber de detener este espectáculo brutal.\" Y se acercó tal cual a las estudiantes en plena pelea. \"Ustedes. Cálmense. ¿Cómo se atreven a esta grosería...?\"\n\nMine no pudo terminar. Una estudiante de Trinity le lanzó un puñetazo directo a la cara por meterse en la pelea. ¡Pak! Con un sonido violento, Mine sintió que su cuerpo era arrojado al suelo. Gritos, alaridos y un pitido agudo le llenaron los oídos. Ni siquiera entendió qué había pasado. La sangre le goteó de la nariz: ploc, ploc, sobre el suelo.\n\n\"...Me confié. ¿Yo, la comandante de la Orden de Socorro... recibiendo un puñetazo en la cara...?\"\n\nMine se apoyó en el suelo y se levantó. Tenía la cabeza extrañamente clara y lúcida. No sabía por qué había empezado la pelea. Pero con estos idiotas, parecía necesario impartir 'socorro' de otra manera, no con palabras. ¿Por qué intentó hacer una persuasión larga y rebuscada contra semejantes idiotas? Mine se limpió la sangre que seguía corriéndole con el dorso de la mano."
 trinity_events_nagisa_diplomacy.22.desc.ako: "Día 1 del itinerario de Amau Ako en la Expo Millennium. En el instante en que entró a la 'Sala de Arcade', donde se promocionaban diversos juegos y consolas de Millennium, Ako percibió desde dentro un olor metálico a sangre. Un olor que jamás había sentido en Millennium, un olor que no debería existir aquí. \"...Ja. No me diga que esto es de verdad olor a sangre...\" Pero enseguida quedó claro que sí, que era olor a sangre real.\n\n\"¡Por culpa de ustedes, Millennium, tuve que jugar a esta basura de juego!\" \"¡Yo nunca les recomendé ningún juego!\" \"¡Aaaah! ¡Dejen de pelear, ya, ya!\"\n\nFrente al puesto de juegos clásicos, decenas de estudiantes de ambas academias se estaban golpeando entre sí con sillas. Como si hubieran recibido la orden de odiarse, una y otra vez estrellaban las sillas hasta romperle la cabeza al otro y hacer que la sangre roja se extendiera por el suelo azul. Ako sintió un leve mareo. Claro. Ni esperaba que me dieran un trabajo decente.\n\n\"Señora Ako, este lugar es peligroso. Debe retirarse...\"\nAko sacó en silencio su pistola Hot Shot. \"No hace falta. Este tipo de crímenes los he visto demasiadas veces desde que era administradora. Las calmaré y preguntaré la causa de la pelea.\" Y se acercó tal cual a las estudiantes en plena pelea. \"Inspectora del Tea Party, Amau Ako. Detengan de inmediato este comportamiento grosero...\"\n\nAko no pudo terminar. Una silla que un estudiante de Trinity lanzó voló en parábola directo hacia ella. ¡Pak! Con un sonido violento, Ako sintió que su cuerpo era arrojado al suelo. Gritos, alaridos y un pitido agudo le llenaron los oídos. Ni siquiera entendió qué había pasado. La sangre le brotó de la boca. Su corta capa blanca e inmaculada se estaba tiñendo con su propia sangre.\n\n\"...¿Hah...? ¿Sangre?\"\n\nAko se apoyó en el suelo y se levantó. ¿Se atrevió a lanzarme una silla a la cara? Sintió cómo se le calentaba la cabeza. La razón de la antigua administradora le advertía que quizá estos estudiantes no estaban en su sano juicio, y que debía mantener la calma, dirigir a los guardias y encontrar la causa del incidente. Pero sus emociones... le gritaban que sacara la pistola 'Hot Shot', la apuntara a esa estudiante y disparara."
 trinity_events_nagisa_diplomacy.22.a: "Aprietas el gatillo."
 trinity_events_nagisa_diplomacy.22.b: "No están en su sano juicio. Ejercemos la máxima paciencia."
 trinity_events_nagisa_diplomacy.23.t: "Code: BOX - Día 4"
 trinity_events_nagisa_diplomacy.23.desc.nagisa: "Los pasillos subterráneos de las instalaciones de la Expo Millennium eran estrechos y lúgubres. Con los zapatos arrancados y desaparecidos quién sabe dónde, Nagisa corría descalza detrás de Kurosaki Koyuki, soportando el dolor desgarrador en las plantas de los pies. Por la lluvia de balas que venía desde atrás, la corta capa de Nagisa estaba hecha jirones y sus alas se iban tiñendo de rojo. Koyuki, como si todo esto fuera divertidísimo, solo se reía con un \"nihaha\".\n\n\"J-jaa... jjaa... ¿Millennium trata así a una visitante de Estado?!\"\n\"¡Nihaha! No, o sea, tampoco era que quisiera que pasara esto. Es que iba a borrar unos registros del dinero que me llevé por malversación y, de repente, los autómatas de seguridad empezaron a disparar...\"\n\"¡¿Y por qué tenía que hacerlo justo cuando yo estaba aquí?! ¡He venido a esta tierra como visitante de Estado de Trinity. Y aun así...!\"\n\"¡Nihaha! ¡Que puedas vivir una experiencia tan divertida es prueba de que eres una visitante de Estado!\"\n\nNo hay forma de hablar con ella. Los disparos no paraban y, de haber recibido ya varias balas, la espalda le ardía. Nagisa volteó: la distancia con los autómatas se iba acortando poco a poco. Podían seguir huyendo, pero tarde o temprano las atraparían. Tenía que cambiar de estrategia.\n\n\"Señorita Koyuki. Separemonos aquí. Yo detendré a esos autómatas como sea.\"\n\"¿Eh? ¿Con qué método?\"\n\"Eso...\""
 trinity_events_nagisa_diplomacy.23.desc.ichika: "Los pasillos subterráneos de las instalaciones de la Expo Millennium eran estrechos y lúgubres. Con los zapatos arrancados y desaparecidos quién sabe dónde, Ichika corría descalza detrás de Kurosaki Koyuki, soportando el dolor desgarrador en las plantas de los pies. Por la lluvia de balas que venía desde atrás, el brazalete del Departamento de Justicia de Ichika ya había sido desgarrado y desaparecido, y sus alas se iban tiñendo de rojo. Koyuki, como si todo esto fuera divertidísimo, solo se reía con un \"nihaha\".\n\n\"J-jaa... jjaa... ¡Neta, ni sabía que Millennium era una academia así!\"\n\"¡Nihaha! No, o sea, tampoco era que quisiera que pasara esto. Es que iba a borrar unos registros del dinero que me llevé por malversación y, de repente, los autómatas de seguridad empezaron a disparar...\"\n\"Esa malversación, podrías haberla hecho cuando yo no estuviera, ¿no? Los del Departamento de Justicia que vinieron conmigo quedaron aniquilados... bueno, no muertos, nomás desmayados, pero igual.\" \n\"¡Nihaha! ¡Si vivieron una experiencia tan divertida, seguro también les gustó!\"\n\nNo hay forma de hablar con ella. Los disparos no paraban y, de haber recibido ya varias balas, la espalda le ardía. Ichika volteó: la distancia con los autómatas se iba acortando poco a poco. Podían seguir huyendo, pero tarde o temprano las atraparían. Tenía que cambiar de estrategia.\n\n\"Señorita Koyuki. Mejor nos separamos aquí. Yo detendré a esos autómatas como sea.\"\n\"¿Eh? ¿Con qué método?\"\n\"Eso...\""
 trinity_events_nagisa_diplomacy.23.desc.mine: "Los pasillos subterráneos de las instalaciones de la Expo Millennium eran estrechos y lúgubres. Con los zapatos arrancados y desaparecidos quién sabe dónde, Mine corría descalza detrás de Kurosaki Koyuki, soportando el dolor desgarrador en las plantas de los pies. Por la lluvia de balas que venía desde atrás, el escudo de la Orden de Socorro de Mine estaba hecho jirones, lleno de marcas de bala, y sus alas se iban tiñendo de rojo. Koyuki, como si todo esto fuera divertidísimo, solo se reía con un \"nihaha\".\n\n\"J-jaa... jjaa... ¡Millennium Science School! ¡Toda su academia necesita socorro! ¡Desde esa cabeza podrida...!\"\n\"¡Nihaha! No, o sea, tampoco era que quisiera que pasara esto. Es que iba a borrar unos registros del dinero que me llevé por malversación y, de repente, los autómatas de seguridad empezaron a disparar...\"\n\"Desde el principio está mal pensar que, tras malversar dinero, bastará con borrar los registros hackeando. Por tu culpa yo no puedo cumplir mi papel como delegada diplomática ordenada por el Host... ¡jaa, jaa!\"\n\"¡Nihaha! Pero si viviste una experiencia tan divertida, ¿no es mejor? ¡Cuando vuelvas, tendrás un montón de cosas que contarle al Host!\"\n\nNo hay forma de hablar con ella. Los disparos no paraban y, de haber recibido ya varias balas, la espalda le ardía. Mine volteó: la distancia con los autómatas se iba acortando poco a poco. Podían seguir huyendo, pero tarde o temprano las atraparían. Tenía que cambiar de estrategia.\n\n\"Señorita Koyuki. Separemonos aquí. Yo me encargaré de esos autómatas.\"\n\"¿Eh? ¿Con qué método?\"\n\"Eso...\""
 trinity_events_nagisa_diplomacy.23.desc.ako: "Los pasillos subterráneos de las instalaciones de la Expo Millennium eran estrechos y lúgubres. Con los zapatos arrancados y desaparecidos quién sabe dónde, Ako corría descalza detrás de Kurosaki Koyuki, soportando el dolor desgarrador en las plantas de los pies. Por la lluvia de balas que venía desde atrás, la corta capa de Ako estaba hecha jirones y la cabeza le daba vueltas. Koyuki, como si todo esto fuera divertidísimo, solo se reía con un \"nihaha\".\n\n\"J-jaa... jjaa... ¿En serio, Millennium trata así a una visitante de Estado...?\"\n\"¡Nihaha! No, o sea, tampoco era que quisiera que pasara esto. Es que iba a borrar unos registros del dinero que me llevé por malversación y, de repente, los autómatas de seguridad empezaron a disparar...\"\n\"¡¿Y lo dices como si fuera para presumir?! ¡En serio! Si la jefa Hina lo viera, te retorcería esa maldita boca...\"\n\"¡Nihaha! Pero la que se está retorciendo ahorita es su columna, inspectora, ¿no? ¡Decenas de balas y no puede hacer nada! ¡Ni! ¡Ha! ¡Ha!\"\n\nNo hay forma de hablar con ella. Los disparos no paraban, y por el impulso de querer matar a Koyuki, la cabeza le ardía. Ako volteó: la distancia con los autómatas se iba acortando poco a poco. Podían seguir huyendo, pero tarde o temprano las atraparían. Tenía que cambiar de estrategia.\n\n\"Señorita Koyuki. Dos cosas. Primera: si no paras esa maldita risa de 'nihaha', te voy a desgarrar la boca primero. Segunda: esos autómatas los resolveré yo.\"\n\"¿Eh? ¿Con qué método?\"\n\"Eso...\""
 trinity_events_nagisa_diplomacy.23.a: "Sometemos a los autómatas en un enfrentamiento de uno contra muchos."
 trinity_events_nagisa_diplomacy.23.b: "En el cruce, corremos en dirección distinta a Koyuki para desorientar a los autómatas."
 trinity_events_nagisa_diplomacy.24.t: "Code: BOX - Día 7"
 trinity_events_nagisa_diplomacy.24.desc.nagisa: "Kirifuji Nagisa, sujetando con fuerza la caja de arginina que le cubría el cuerpo para que no se le cayera, avanzó arrastrándose por el suelo en un pasillo desierto detrás de la Expo Millennium. Ya había gateado más de cien metros, así que las mangas blancas de su blusa estaban hechas jirones, y el sudor que le corría por la frente caía al piso: ploc, ploc, en silencio. Pero Nagisa no podía quitarse la caja de arginina. Porque dentro del edificio rondaba una mujer fuera de sí, Otohana Sumire, con gafas de sol, llevando a decenas de miembros del Helmet Gang como si fueran \"miembros del club de entrenamiento\".\n\n\"Visitante de Trinity, salga ya. Nuestro Club de Entrenamiento de Millennium también tiene preparado un curso de experiencia de entrenamiento perfecto para los invitados de Trinity. ¿Sabe que, mientras se esconde, la pérdida de músculo sigue avanzando?\"\n\nA un lado de Sumire, la miembro del Club de Entrenamiento Nomasa Rei habló por un megáfono. \"Mire, entre más rápido se rinda, más rápido se le quita. ¡Salga ya, invitada de Trinity!\"\n\n¿Entre más rápido se rinda, más rápido se le quita? Nagisa recordó aquel horrible \"entrenamiento\" que había visto: Sumire maltratando a varios miembros del Helmet Gang hasta el punto de que se los llevaran en ambulancia, y aun así murmurando con frialdad: \"Si van acostados en la ambulancia, pierden músculo...\" En el instante en que descubrieran su posición, Nagisa sintió instintivamente que quien subiría a la ambulancia sería ella.\n\n\"¡¿De verdad, por qué Millennium deja que una mujer así ande suelta por el recinto de la expo?!\" Dentro de la caja de arginina, evitando las miradas de los zombis del Club de Entrenamiento, Nagisa siguió arrastrándose poquito a poquito. La salida se acercaba. Pero el problema era Nomasa Rei, que patrullaba frente a la salida con un bate de béisbol. Con que le diera un solo golpe al costado, Nagisa sería arrastrada al infierno de entrenamiento de Sumire.\n\n¿Debería buscar otro pasillo? ¿O soltar la caja a mitad de camino y lanzarse directo contra Rei? Con suerte, quizá podría ganar el forcejeo y escapar de este edificio prefabricado antes de que Sumire llegara, para reunirse con sus guardias."
