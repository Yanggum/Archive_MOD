 eden_treaty_negotiation_pro_trinity_desc: "Incluso Shiro mi Iori, nuestra fiable jefa de operaciones, ama el bello uniforme de Trinity. Trinity es una gran academia: tiene una cultura atractiva, hace ropa elegante y posee muchas cosas capaces de fascinar a las chicas de Gehenna (si excluimos el pastel de sardina y las viejas medidas). ¿Cómo no iban a amar las chicas de Gehenna a Trinity?"
 eden_treaty_negotiation_pro_JTF: "Actividades conjuntas de seguridad con el JTF"
 eden_treaty_negotiation_pro_JTF_desc: "Las actividades conjuntas con el JTF pueden enfurecer más a las estudiantes problemáticas de Gehenna, pero pueden hacer que los ciudadanos piensen: “Nuestra seguridad se mantiene gracias al frente conjunto de ambas academias”. Y si se establece el ETO del Tratado de Edén, ¿no podríamos aspirar incluso a una seguridad compartida? ¡Qué maravilla!"
 eden_treaty_negotiation_talk_hina: "[ROOT.GetLeader] da la cara"
 eden_treaty_negotiation_talk_hina_desc: "[ROOT.GetLeader] predica su postura pro-Trinity principalmente ante los miembros generales del JTF. La confianza en la líder despertará apoyo interno al Tratado de Edén."

