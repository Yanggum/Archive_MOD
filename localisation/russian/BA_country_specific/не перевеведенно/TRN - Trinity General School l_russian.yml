 TRN_create_pro_trinity_group: "Agitar a los alemanes locales en territorio [GEM.GetAdjective]"
 TRN_pandemonium_society_approach_club_Hot_Springs_Department: "Acercarse al Departamento de Desarrollo de Aguas Termales"
 TRN_pandemonium_society_approach_club_Gourmet_Research_Society: "Acercarse a la Sociedad de Investigación Gourmet"
 TRN_prefect_team_discipline_decline: "Socavar la disciplina de [GEH.GetNameDef]"
 TRN_romania_give_the_oil: "Asegurar los campos petroleros de Rumanía"
 TRN_romania_give_the_oil_desc: "Para que la industria, los vehículos y la máquina de guerra de Trinity funcionen sin problemas, necesitamos petróleo. Los campos petroleros de Rumanía tienen suficiente oferta para cubrir nuestra demanda. Sin embargo, el gobierno rumano muestra una actitud poco cooperativa; para romper esta situación, será necesario recurrir a la fuerza."
 TRN_support_HYA_decision: "Cooperar con [HYA.GetNameDef]"
 TRN_support_HYA_var_tt: "Ocurre un §Yevento§! para que §Y[HYA.GetNameWithFlag]§! coopere con §Y[TRM.GetNameWithFlag]§!. Máximo §Y3§! veces; actualmente hemos cooperado §Y[?TRN_support_HYA_var]§! veces.\n\nSi cooperamos §Y3§! veces o más, la §Ydecisión se elimina§!."
