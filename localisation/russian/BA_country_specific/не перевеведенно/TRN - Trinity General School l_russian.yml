 # Inicio de enfoques
 TRN_destroy_partisans: "Destruir a los partisanos"
 TRN_destroy_partisans_desc: "A pesar de los esfuerzos constantes del Departamento de Realización de la Justicia, la resistencia organizada en [61.GetName] y [66.GetName] no se apaga con facilidad. Los terroristas están amenazando la estabilidad de Trinity. Por ello, se ha emitido la orden del Host. El Departamento de Realización de la Justicia actuará con mayor dureza para someterlos por completo y salvaguardar el orden de Trinity."
 TRN_destroy_partisans_effect_tt: "Si la operación tiene éxito, la influencia de [KPD.GetNameWithFlag] y [NSD.GetNameWithFlag] disminuye un 2% adicional."
 TRN_reconstruction_of_collapsed_industry: "Reconstruir la industria colapsada"
 TRN_reconstruction_of_collapsed_industry_desc: "Una vez terminada la resistencia, [61.GetName] y [66.GetName] han quedado destruidas y heridas. Con subsidios, debemos reconstruir las industrias colapsadas e inculcar en la población local de [61.GetName] y [66.GetName] la imagen de que somos sus salvadoras."
 TRN_Reconnect_network_and_power: "Ampliar la red de comunicaciones"
 TRN_Reconnect_network_and_power_desc: "Como secuela de la Gran Transición, la accesibilidad a la información en la red de comunicaciones de Trinity cae de forma notable cuanto más lejos se está de los centros clave. Sin embargo, si ampliamos la red, este problema puede resolverse sin dificultad, permitiendo una transmisión de información más rápida y precisa en más regiones."
 TRN_railway_improvement: "Mejorar la red ferroviaria"
 TRN_railway_improvement_desc: "El ancho de vía del ferrocarril local no coincide con el estándar usado en Kivotos, lo que ha llevado a una situación tan ineficiente que debemos transportar suministros por carretera. Para resolverlo, tendremos que mejorar la red ferroviaria y establecer un sistema de transporte más eficiente."
 TRN_KWG_open: "Reabrir la Sociedad Kaiser Wilhelm"
 TRN_KWG_open_desc: "Durante la Gran Transición, el edificio de la Sociedad Kaiser Wilhelm se incendió y quedó destruido. Los materiales de investigación se preservaron a duras penas, pero algunas pérdidas fueron inevitables. Numerosos académicos de Trinity lo lamentan y exigen con firmeza la restauración y reapertura de la institución."
 TRN_improving_academy_industry: "Reindustrialización de Trinity"
 TRN_improving_academy_industry_desc: "Para resolver los problemas generales de Trinity, hace falta una reurbanización liderada por el Host. Además, para prepararnos ante las amenazas externas que se aproximan, debemos expandir a gran escala las fábricas de producción militar. Mucha gente se opondrá a esta política, pero cuando su alma mater se vea amenazada, nos lo agradecerán."
 TRN_ministry_of_industrial_development: "Establecer el Departamento de Desarrollo Económico de la Academia"
 TRN_ministry_of_industrial_development_desc: "La economía de Trinity es una orquesta, y el Departamento de Desarrollo Económico de la Academia es su director. Los especialistas económicos que antes estaban dentro del Tea Party se reorganizarán como una entidad independiente, manteniendo el equilibrio entre los intereses de la academia y los de las estudiantes, e impulsando que ambos sean más ricos y prósperos mediante inversiones racionales y la relajación de regulaciones."
 TRN_expanded_corporatism: "Corporativismo cristiano"
 TRN_expanded_corporatism_desc: "Un sistema económico basado en la doctrina social cristiana florece dentro de la solidaridad. Para promover la armonía de clases, el principio de subsidiariedad y el bien común, debemos organizar y fortalecer “corporaciones”. Reforzaremos la cooperación en vez del conflicto, y la armonía y solidaridad social."
 TRN_planned_economy: "Domesticar la economía de mercado"
 TRN_planned_economy_desc: "El libre mercado se parece a la naturaleza humana. Pero dejarlo sin control es barbarie. Nosotros domesticaremos y gestionaremos la economía de mercado según la doctrina social religiosa. Por supuesto, esto no significa un control absoluto ni un caos desordenado."
 TRN_confiscation_distribution_collectivization: "Confiscación, reparto y colectivización"
 TRN_confiscation_distribution_collectivization_desc: "Las tierras de los junkers serán confiscadas sin compensación y, tras su distribución, serán reorganizadas como granjas estatales administradas por la academia. En este proceso los choques son inevitables, pero esa es la realidad: los junkers resistirán para proteger sus privilegios, y nosotros actuaremos para arrebatárselos."
 TRN_cooperation_with_junker: "Cooperar con los junkers"
 TRN_cooperation_with_junker_desc: "Los junkers son quienes mejor entienden esta región, y su cooperación es crucial para nosotras. Para devolver numerosas tierras de cultivo a la propiedad de la academia, será necesaria la cooperación y negociación con los junkers."
 TRN_revitalization_of_heavy_industry: "Industrialización del oeste"
 TRN_revitalization_of_heavy_industry_desc: "Con parte del problema agrario ya encauzado, ahora podemos aprovechar plenamente las vastas tierras del oeste. Gracias a ello, un plan de industrialización para compensar la escasez de fábricas puede impulsarse de lleno. Si además sumamos la capacidad de transporte de suministros por el río Óder, nuestra industrialización se acelerará aún más."

 # Ruta de Mika
 TRN_Kyrie_for_the_forgotten_ones: "Kyrie por los olvidados"
 TRN_Kyrie_for_the_forgotten_ones_desc: "Ante los problemas de Trinity que han salido a la luz junto con los recientes fenómenos sobrenaturales, las soluciones débiles de las facciones Sanctus y Filius ya no parecen acciones en beneficio de Trinity. En cambio, Misono Mika y la facción Pater llevan una “misión mesiánica” para salvar a Trinity de la crisis."
 TRN_Kyrie_for_the_forgotten_ones_tt: "Esta §Yopción§! garantiza que Misono Mika §Yganará§! sin falta la próxima §Yelección del Host§!."
 TRN_control_tea_party: "Controlar el Tea Party"
 TRN_control_tea_party_desc: "Tras el colapso de la facción Sanctus, la facción Filius bajo Kirifuji Nagisa sigue siendo uno de los pocos pilares institucionales que se oponen a Misono Mika. Por suerte, la facción Pater de Misono Mika ganó la elección del Host y ascendió al puesto. Ahora es posible tejer una conspiración política contra Kirifuji Nagisa. Con el poder de la facción Pater y la autoridad del Host, Nagisa no tendrá más remedio que rendirse."
 TRN_Mika_basic_law: "Ley de Misono Mika"
 TRN_Mika_basic_law_desc: "La constitución vigente de Trinity, establecida hace cientos de años, se basa en un sistema idealista: frenar el poder imperial del Host y sostener un equilibrio por contrapesos entre el Tea Party y el Host. Sin embargo, bajo la bendición que dictó el destino, el Tribunal Supremo de Trinity no puede limitarse a mantener el marco legal: debe racionalizar que el dominio de la facción Pater y de Misono Mika es un orden legítimo reconocido por la propia constitución."
 TRN_secret_meeting_with_Sisterhood: "Reunión secreta con la Sisterhood"
 TRN_secret_meeting_with_Sisterhood_desc: "Desde hace mucho, la Sisterhood ha mantenido la costumbre de no intervenir en la política del Tea Party, pero esto no provenía de una obligación legal, sino de que cada facción renunció voluntariamente a ese derecho. Sin embargo, con el drástico cambio del tablero político, no hay ninguna garantía de que sigan sin intervenir en el futuro."
 TRN_necessary_revenge: "Romper las alas del ángel"
 TRN_necessary_revenge_desc: "Si la nueva constitución garantiza firmemente la superioridad de Misono Mika, ya no podemos permitirnos observar pasivamente a las demás facciones. Sanctus y Filius ya han sido neutralizadas, pero con el tiempo podrían recuperar fuerzas. Por eso, debemos tomar medidas definitivas para que sus alas no vuelvan a moverse."
 TRN_necessary_revenge_tt: "Este enfoque desencadenará una serie de §Yeventos§! que reducirán el apoyo a la ideología §Yno fascista§!."
 TRN_solving_social_problems: "Solución para los problemas sociales"
 TRN_solving_social_problems_desc: "Para resolver los problemas sociales, debemos gestionar de forma adecuada las necesidades básicas de la población local alemana. Satisfacer por completo sus demandas, por el contrario, podría aumentar su margen de resistencia. Manteniendo una carencia moderada, induciremos conflictos internos y haremos que agoten su fuerza para oponerse a nosotras."
 TRN_denazification: "Desnazificación"
 TRN_denazification_desc: "El legado del nazismo ha provocado un retroceso general de la sociedad. Si los arrogantes que quieren mandar a las mujeres de vuelta a la cocina se imponen y campan a sus anchas en la sociedad de Trinity, es evidente que la autoridad de las estudiantes de Trinity, del Tea Party y de Misono Mika caerá en picada."
 TRN_dismantled_Nazi_organization: "Desmantelar organizaciones nazis"
 TRN_dismantled_Nazi_organization_desc: "Puede ser obvio, pero jamás debemos permitir que las organizaciones que enarbolan el nazismo vuelvan a expandirse. Empezaron como agrupaciones torpes que decían representar al pueblo y luego se convirtieron en partidos de masas. Hay que arrancarlas de raíz para que nunca vuelvan a establecerse."
 TRN_dismantled_Nazi_organization_tt: "En $DECISION_NAME$, los siguientes §Yeventos§! ya no ocurrirán:\n$EVENT_0$\n$EVENT_1$\n$EVENT_2$\n$EVENT_3$\n$EVENT_4$\n$EVENT_5$"
 TRN_take_over_the_church: "Evangelizar con la fe de Trinity"
 TRN_take_over_the_church_desc: "Durante mucho tiempo, el cristianismo ha influido profundamente en la vida espiritual del pueblo alemán. Pero ahora, para expandir la fe de Trinity, debemos reducir gradualmente la influencia de esas creencias tradicionales y sustituirlas por la nueva doctrina de Trinity. Trinity debe liderar incluso el alma y el mundo mental del pueblo alemán."
 TRN_limit_german_party: "Restringir la actividad de los partidos alemanes"
 TRN_limit_german_party_desc: "Los partidos alemanes que operan en territorio de Trinity podrían convertirse algún día en una gran amenaza para nosotras. En particular, el SPD y el Zentrum, junto con pequeños partidos que cooperan con ellos, están ganando fuerza y tienen capacidad de movilizar a las masas con fines políticos. Restringirlos es eliminar un problema futuro antes de que nazca."
 TRN_expanding_censorship: "Ampliar el sistema de censura"
 TRN_expanding_censorship_desc: "Para impedir el resurgimiento de los partidos alemanes, implantaremos un sistema de identificación. Toda persona local deberá obtener una credencial para poder realizar actividades dentro de Trinity. Durante la emisión, verificaremos identidad e historial personal, y podremos seleccionar a individuos con antecedentes de colaboración nazi o registros de actividad sospechosa."
 TRN_new_law_for_germany_party: "Nueva ley para los partidos alemanes"
 TRN_new_law_for_germany_party_desc: "En vez de criminalizar y prohibir por completo a los partidos alemanes, los mantendremos de forma legal bajo supervisión mediante inspectores del Tea Party. Su influencia real se reducirá drásticamente, pero puede ser un método eficaz para aliviar el descontento local alemán."
 TRN_new_political_order: "Nuevo orden político"
 TRN_new_political_order_desc: "Garantizaremos el derecho al voto a la población local alemana. Por supuesto, no será una forma plena como el sufragio universal. Usaremos partidos alemanes controlados para celebrar elecciones locales y de alcaldes. Es posible que la población perciba estas limitaciones y surja descontento; aun así, mostrará que permitimos cierto grado de autonomía."
 TRN_absorb_the_reichsbanner_schwarz_rot_gold: "Disolver la Reichsbanner Schwarz-Rot-Gold"
 TRN_absorb_the_reichsbanner_schwarz_rot_gold_desc: "Las SA nazis colapsaron y se disolvieron cuando las SS del este cayeron; y la Liga de Combatientes del Frente Rojo siguió el mismo destino cuando el partido comunista del norte se exilió. Pero la Reichsbanner Schwarz-Rot-Gold aún se mantiene. Ahora debemos decidir el destino de esta organización que sobrevivió pese a la persecución del régimen nazi."
 TRN_Kulturkampf_display_value_60_over_tt: "§YLa fe de Trinity§! obtiene la ventaja."
 TRN_fate_of_german_culture: "Revolución en el espíritu"
 TRN_fate_of_german_culture_desc: "Las culturas de Trinity y Alemania son fundamentalmente distintas. Para fusionarlas, hace falta una superioridad abrumadora de uno de los lados. Por suerte, ahora mismo la autoridad de Trinity es aplastantemente fuerte."
 TRN_fate_of_german_culture_trigger_tooltip: "En §Y$TRM_appeasement_germany_modifier$§!, el §Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! es al menos [?TRM_propaganda_monthly_conscription_factor_trigger|R]."
 TRN_second_trinity: "La Segunda Trinity"
 TRN_second_trinity_desc: "Trinity heredó en su día el legado del Gran Primer Concilio, pero en medio de divisiones y apostasías lo mancilló por sí misma, y finalmente colapsó por la Gran Transición. Cada vez es más claro que solo la facción Pater puede unificar y resucitar a Trinity: unir a las estudiantes en una sola, y dotarlas de una voluntad invencible y una fuerza devastadora capaz de quebrar cualquier amenaza. Ese es nuestro objetivo, nuestra conspiración y la misión que debemos cumplir."
 TRN_intelligence_agency: "Reorganizar el Servicio de Inteligencia de la Academia"
 TRN_intelligence_agency_desc: "El terrible atentado contra Yurizono Seia dejó al descubierto que el Servicio de Inteligencia de la Academia no cumplió su función. La incompetencia y la falta de capacidad de respuesta de su director ya quedaron demostradas. En este mundo donde se está formando un nuevo orden, quedarse atrás en información equivale a morir."
 TRN_lend_eyes_and_ears: "Pedir prestados ojos y oídos"
 TRN_lend_eyes_and_ears_desc: "La guerra de inteligencia no se lucha con pistolas o misiles, sino con información, tecnología y guerra psicológica: un combate tridimensional. Para asegurar nuestra superioridad informativa, tomaremos prestados los ojos y oídos de “seres inferiores”."
 TRN_cause_of_trinity: "La causa de Trinity"
 TRN_cause_of_trinity_desc: "Muchos miraron con recelo el régimen dictatorial de Misono Mika, observándolo con escepticismo. Pero a medida que surgen logros visibles, queda claro que Trinity está realmente amenazada, y se suman las intrigas de otras academias y el último pataleo del viejo sistema, la opinión pública hacia el “socialismo trinitario” comienza a volverse más favorable. Trinity avanzará ahora, atravesando una oscuridad total hacia una nueva ruta marítima."
 TRN_The_nature_of_the_united_front: "Ascenso de la facción Pater"
 TRN_The_nature_of_the_united_front_desc: "Los adversarios del Tea Party han desaparecido, y la facción Pater ocupa la mayoría de los escaños. Ahora, la facción Pater debe ir más allá del marco de una simple facción y renacer como una facción para un público y unas estudiantes más amplias."
 TRN_academy_defense_force: "Crear la Fuerza de Defensa de la Academia"
 TRN_academy_defense_force_desc: "La Fuerza de Defensa de la Academia es una organización paramilitar creada para movilizar a las masas. Vestidas con uniformes blancos, reclutaron a quienes juran lealtad absoluta a Misono Mika. Lucharán contra los enemigos jurados dentro de Trinity y podrán desplegarse donde sea cuando Mika lo ordene."
 TRN_cooperation_with_suzumi: "Proponer cooperación a los vigilantes"
 TRN_cooperation_with_suzumi_desc: "La Vigilancia de Trinity, un club no oficial dirigido por Morizuki Suzumi, tiene una estructura organizativa laxa, pero su existencia es innegable. La Orden de Socorro y el Departamento de Realización de la Justicia ya reconocen en cierta medida su presencia y cooperan con ella. ¿Y si los elevamos oficialmente a una posición similar a la Fuerza de Defensa de la Academia?"
 TRN_cult_of_Mika: "Culto al Arcángel"
 TRN_cult_of_Mika_desc: "Durante años, Trinity ha vagado en una democracia inestable. Surgieron numerosas “damas de hierro” para guiarla, pero el sistema inestable terminó revelando sus límites y colapsó. Ese colapso fue una calamidad para Trinity; sin embargo, la única persona con el poder para superar esa herida y hacer renacer a Trinity es Misono Mika."
 TRN_cult_of_Mika_tt: "§MUn evento permitirá elegir cómo Misono Mika se describirá ante las masas y los bonos correspondientes.§!"
 TRN_those_who_lead_those_who_follow: "Quien guía y quien sigue"
 TRN_those_who_lead_those_who_follow_desc: ""
 TRN_new_trinity_culture: "Nueva cultura trinitaria"
 TRN_new_trinity_culture_desc: "La cultura de Trinity es excesivamente lujosa y decadente. La razón fundamental de que Trinity no haya logrado un desarrollo real pese a siglos de paz está en esta degradación cultural. Debemos rechazar con firmeza esa cultura corrupta y fomentar un arte y cultura vanguardistas y con claridad ideológica. Una cultura acorde con la nueva era será la fuerza motriz para levantar a Trinity."
 TRN_new_trinity_culture_tt: "§YEl resultado variará según el evento que ocurra durante el enfoque.§!"
 TRN_support_justice_task_force: "Ampliar el Departamento de Realización de la Justicia"
 TRN_support_justice_task_force_desc: "El Departamento de Realización de la Justicia es uno de los escudos que protegen a Trinity. Se encarga del orden público de toda Trinity, pero los recursos que se le han otorgado no son muchos. Cooperaremos con ellas y, con apoyo suficiente, las domesticaremos por completo."
 TRN_alliance_of_faith: "Alianza con la fe"
 TRN_alliance_of_faith_desc: "No se puede negar que el catolicismo de Trinity es una parte central de la civilización trinitaria. La facción Pater busca acoger a creyentes de todas las religiones, pero una alianza conveniente con el catolicismo será una alianza poderosa, profundamente arraigada en el corazón de las estudiantes de Trinity y de los alemanes."
 TRN_new_order_movement: "Movimiento del Nuevo Régimen"
 TRN_new_order_movement_desc: "Para terminar con la sobrecalentada lucha ideológica dentro de la facción Pater, se requiere la intervención directa del Host. Tanto ideólogos como corporativistas protestarán ante esta elección. Pero antes que la pugna ideológica, comparten una identidad común: todas son seguidoras del Arcángel. Por ello, se espera que la resistencia real a la decisión del Host sea limitada."
 TRN_Fourth_Reich: "Declaración del Estado de la Orden"
 TRN_Fourth_Reich_desc: "Proclamar el Estado de la Orden quizá sea, en cierto modo, una contradicción consigo mismo. Pero Trinity no aparta la mirada ni teme esa contradicción. Nacido del cruce entre la singularidad de Trinity y el drástico cambio de la situación externa, el Estado de la Orden acepta de buen grado las raíces propias de Trinity como una alianza poderosa y un fundamento espiritual."
 TRN_student_solidarity: "Fortalecer la solidaridad estudiantil"
 TRN_student_solidarity_desc: "La “solidaridad estudiantil”, base y raíz de Trinity, se ha expandido gradualmente sobre valores y doctrina cristianos. Esta sociedad no prospera por una obediencia ciega a un tirano omnipotente, sino por organizaciones autónomas de estudiantes basadas en justicia y solidaridad, libertad y Estado de derecho. Las estudiantes de Trinity siempre han soñado con esa sociedad: una comunidad asentada no en una clase o facción específica, sino en el principio del amor cristiano."
 TRN_jewel_of_the_trinity_faith: "La joya de la fe de Trinity"
 TRN_jewel_of_the_trinity_faith_desc: "En la fe de Trinity, la Sisterhood cumple un rol central. Debemos reconocer la importancia de su papel en la sociedad trinitaria y permitirle generar un impacto positivo en más lugares."
 TRN_improving_JTF: "Eliminar ineficiencias del Departamento de Realización de la Justicia"
 TRN_improving_JTF_desc: "Con el enorme territorio de la academia, el Departamento de Realización de la Justicia se expandió en gran medida bajo el apoyo total de Misono Mika. Pero, al mismo tiempo, crecieron la ineficiencia y la rigidez. Hanekawa Hasumi liderará la mejora de estos problemas."
 TRN_Integrity_of_Trinity: "Integridad de Trinity"
 TRN_Integrity_of_Trinity_desc: "La “Segunda Trinity” de Misono Mika, nacida tras derrotar a los enemigos de hace siglos, es como un organismo vivo construido por la unión de todas las estudiantes comunes. Esta nueva Trinity no se aferra a la gloria del pasado: mira de frente las necesidades del presente y avanza hacia un futuro grandioso y mesiánico. Guiar al mundo hacia una nueva era de iluminación espiritual: esa es la misión de Trinity."
 TRN_codification_of_regime: "Codificación del régimen"
 TRN_codification_of_regime_desc: "La facción Pater es el caballo que tira del carro llamado academia, y Misono Mika es la jinete que lo conduce. Ya no habrá decisiones inestables ni vagabundeos sin rumbo. La cooperación con la comunidad se ha consolidado a un nivel sin precedentes y, sobre esa base, tenemos la misión de ofrecer una vida más estable y próspera tanto a estudiantes como a ciudadanos. Esto no es una elección: es la misión de nuestra era."
 TRN_supreme_leader: "Líder suprema"
 TRN_supreme_leader_desc: "Los ideólogos tenían razón: los corporativistas eran traidoras unidas con el propósito de derrumbar Trinity desde dentro. Misono Mika por fin se despojará del barniz de “lideresa” y renacerá como una existencia de otra dimensión, como una tirana destinada a llegar."
 TRN_horseman_of_the_apocalypse: "Jinete del Apocalipsis"
 TRN_horseman_of_the_apocalypse_desc: "Trinity ya no es una simple academia. Es un organismo vivo, una entidad semejante a un caballo que trae el fin de los tiempos. Y la jinete que lo monta—la Arcángel Misono Mika—es conquistadora, emperatriz y símbolo de guerra. Trinity es muerte, y Mika es la gloriosa jinete que guía esa muerte."
 TRN_project_trinity: "Proyecto “Pater”"
 TRN_project_trinity_desc: "El Proyecto Pater es el plan más secreto y poderoso impulsado por la Academia Trinity. El núcleo del proyecto consiste en un misil balístico de alcance medio, desarrollado a partir de ingeniería inversa de la tecnología de misiles que ya poseíamos. Este misil porta un total de 6 ojivas, y está diseñado para que, al caer, cada una impacte su objetivo de manera independiente."
 TRN_destiny_of_trinity: "El destino de Trinity"
 TRN_destiny_of_trinity_desc: "La misión de Trinity no se limita a salvarse a sí misma: es salvar a todo Kivotos. Dejando de lado a los locales terrestres llenos de odio y a las ideologías que se propagan como una plaga, cargamos con una misión moral: arrancar ese odio de raíz. Ahora comienza la preparación para la siguiente y última guerra. Cuando el héroe caiga y la oscuridad se disipe, en el tenue resplandor del amanecer que se desvanece, deberemos construir otro hermoso nuevo mundo."
 TRN_sheep_and_shepherd: "El rebaño y el pastor"
 TRN_sheep_and_shepherd_desc: "El rebaño y el pastor son indispensables el uno para el otro. En el camino del pastoreo siempre se necesita al rebaño, y el rebaño siempre necesita la protección del pastor. La Arcángel Misono Mika está dispuesta a entregar su vida por su rebaño y no escatima amor y devoción al cuidarlo. Bajo la guía del pastor, el rebaño obtendrá descanso y paz, y vivirá una vida feliz. Es un lazo sagrado forjado por la fe y la responsabilidad.."

 TRN_eden_accord: "Formar el Acuerdo de Edén"
 TRN_eden_accord_desc: "La Gran Transición derrumbó por completo la visión idealista del mundo de Trinity, y como consecuencia Trinity tomó un rumbo cada vez más radical. Sin embargo, en medio del caos surgió Misono Mika, prometiendo de nuevo un “mundo trinitario” sobre las ruinas de una fe colapsada: un orden propio de Trinity, distinto de la Unión de Kivotos del Consejo Estudiantil General."
 TRN_collaboration_with_hyakkiyako: "Cooperar con [HYA.GetAdjective]"
 TRN_collaboration_with_hyakkiyako_desc: "Trinity ha mantenido desde antes una relación de cooperación estrecha con Hyakkiyako. Sin embargo, incluso con la crisis y los recientes cambios políticos, debemos confirmar si esa relación sigue vigente."
 tooltip_TRN_collaboration_with_hyakkiyako_trigger: "Se mantiene el régimen de §Y[HYA.GetNameWithFlag]§!."
 TRN_establish_a_customs_union: "Establecer una unión económica"
 TRN_establish_a_customs_union_desc: "La facción liderada por Trinity no es una simple relación amistosa entre academias y países, sino una alianza mucho más estrecha. Crearemos una unión económica dentro de la esfera para impulsar una cooperación económica aún más profunda."
 TRN_divine_mandate: "Plan del Mandato Sagrado"
 TRN_divine_mandate_desc: "El concepto de “Mandato Sagrado” se originó en el sistema de gobernadoras generales que la Academia Trinity estableció para administrar eficientemente terrenos en distintas regiones. Esta idea se implementará tras ciertas modificaciones, para gestionar de forma más eficaz los territorios conquistados por Trinity."

 TRN_impossible_to_coexist: "Incompatibles"
 TRN_impossible_to_coexist_desc: "La guerra contra Gehenna es un destino inevitable para Trinity: venganza por las heridas sufridas por nuestros ancestros y una cruzada por toda Trinity. Pero incluso una guerra tan fatídica no puede ganarse sin una preparación meticulosa. La gran ofensiva hacia el oeste, actualmente en marcha bajo el nombre clave “San Miguel”, se planifica como una operación de una escala sin precedentes en la historia de Kivotos, y exige más que nunca una estrategia y un diseño operativo precisos."
 TRN_Fifth_Column: "Desestabilizar la región de Gehenna"
 TRN_Fifth_Column_desc: "Qué repugnante."
 TRN_spiritual_warfare: "Guerra espiritual"
 TRN_spiritual_warfare_desc: "Por fin ha llegado el momento de devolverle a Trinity su humillación. El Pandemonium Society y el Equipo de Prefectura de Gehenna caerán en este mundo extraño, y no descansaremos hasta que nuestra bandera ondee sobre todo el territorio de Gehenna. ¡Oh, gran [TRM.GetName], levántate para la lucha final!"
 TRN_alliance_with_devil: "¿...Una alianza con el diablo?"
 TRN_alliance_with_devil_desc: "La Agencia de Detectives ha declarado recientemente al Pandemonium Society como un gobierno ilegal, se autoproclama el “último Estado germánico” y ha empezado a reclamar soberanía no solo sobre Gehenna, sino incluso sobre su propia alma mater, Trinity. A simple vista parece claramente nuestro enemigo, pero la realidad es un poco más compleja: hasta que superen el obstáculo del Pandemonium Society, nuestros intereses pueden coincidir de manera temporal. En ese sentido, una alianza limitada con ellas merece considerarse."
 # Diplomacia con Red Winter
 TRN_northern_kivotos_diplomacy: "Diplomacia del norte"
 TRN_northern_kivotos_diplomacy_desc: ""
 TRN_denmark_or_war: "Exigir Dinamarca"
 TRN_denmark_or_war_desc: ""
 TRN_use_of_nordic_association: "Usar la Asociación Nórdica"
 TRN_use_of_nordic_association_desc: ""
 # Arius
 TRN_catch_tail: "Atrapar la cola"
 TRN_catch_tail_desc: "Tras los esfuerzos del Servicio de Inteligencia de la Academia, han salido a la luz elementos traidores que se escondían dentro de la Academia Trinity. En silencio, habían estado carcomiendo nuestra academia y, si se les presentaba la oportunidad, estaban listos para apuñalarnos por la espalda. Pero su plan termina aquí. El Departamento de Realización de la Justicia y el Servicio de Inteligencia de la Academia los erradicarán hasta la raíz con medidas contundentes."
 TRN_religious_conversion: "“Conversión”"
 TRN_religious_conversion_desc: "Entre las figuras de origen Arius, en particular Hakari Atsuko ha defendido activamente la paz con Trinity; esto también se reflejó en los conflictos dentro de su escuadra. Trinity valora positivamente su “cambio de rumbo” y, con ello como catalizador, está lista para limpiar por fin el rencor de siglos contra Arius."
 TRN_chasing_the_bandit: "Perseguir a los bandidos"
 TRN_chasing_the_bandit_desc: "Incluso tras el fin de la guerra, el Escuadrón Arius sigue resistiendo tenazmente. En especial, se reportan casos de estudiantes de Trinity afectadas en los alrededores de Danzig. Estas bandas son un problema que debemos resolver enviando al Departamento de Realización de la Justicia y a los vigilantes."
 TRN_annex_the_bandit_states: "Legado del Primer Concilio"
 TRN_annex_the_bandit_states_desc: "En el Primer Concilio, la facción Arius se negó a la unificación. Pero eso no significa que debamos tratarlas con frialdad. ¿Cuál es el verdadero legado que dejó el Primer Concilio? Es la integración y la unidad. Heredaremos ese espíritu, acogeremos a las estudiantes de Arius y reabriremos el concilio, abandonado e incompleto durante siglos, para declarar la unificación de “toda Trinity” en el verdadero sentido."
 TRN_arius_tactic: "Aprender tácticas de Arius"
 TRN_arius_tactic_desc: "¡Literalmente!"

 # Diplomacia de posguerra
 TRN_union_with_gehenna: "Nuestro Acuerdo de Edén"
 TRN_union_with_gehenna_desc: "El acuerdo de paz que el presidente del Consejo Estudiantil General impulsó entre Trinity y Gehenna, el llamado “Acuerdo de Edén”, perdió su significado hace ya mucho tiempo. Pero ahora la situación ha cambiado por completo. Con Trinity ocupando Gehenna, se acerca el momento de desenterrar una vez más el nombre de “Acuerdo de Edén” de las páginas de la historia. Esta vez ya no será una paz de fachada. Un Acuerdo de Edén “a la manera de Trinity”: eso significará rendición, integración y dominio total."
 TRINITY_WON_THE_GEHENNA: "§Y[TRM.GetNameWithFlag]§! gana la §YBatalla decisiva de Edén§!"
 TRN_magdeburg_trials: "Juicios militares de Magdeburgo"
 TRN_magdeburg_trials_desc: "Los juicios militares que se celebrarán en Magdeburgo no son un lugar para castigar crímenes de guerra. Se parecen más a un circo político destinado a exhibir la victoria militar de Trinity y humillar a sus enemigos. El tribunal apuntará en especial a los miembros del Equipo de Prefectura que resisten con mayor dureza y a ciertos clubes de Gehenna."
 TRN_forcibly_disband_HSD: "Despliegue de seguridad contra el Club de Desarrollo de Aguas Termales"
 TRN_forcibly_disband_HSD_desc: ""
 TRN_forcibly_disband_GRS: "Disolución forzosa del Club de Investigación Gourmet"
 TRN_forcibly_disband_GRS_desc: ""
 TRN_reduce_authority_of_pandemonium_society: "Reemplazar a Pandemonium"
 TRN_reduce_authority_of_pandemonium_society_desc: "Pandemonium era el organismo que gobernaba Gehenna. Si una institución que administraba una academia tan enorme desaparece de un día para otro, se producirá un caos grave. Absorberemos a Pandemonium y lo reorganizaremos como el aparato de gobierno de Trinity para administrar los territorios de Gehenna."
 TRN_incorporate_EMC_into_RC: "Integrar la organización del Departamento de Medicina de Emergencia"
 TRN_incorporate_EMC_into_RC_desc: "El Departamento de Medicina de Emergencia es una organización de rescate reunida en torno a Himuro Sena de Gehenna. Desde antes del incidente, mantenían una relación bastante cercana con la Orden de Socorro de Trinity. Dado que hemos anexado Gehenna mediante la guerra, el Departamento de Medicina de Emergencia pasará a integrarse oficialmente como una organización subordinada a la Orden de Socorro."
 TRN_inclusion_SLC: "Cooptar al Departamento de Raciones"
 TRN_inclusion_SLC_desc: "Para la gestión de posguerra, necesitaremos la ayuda del Departamento de Raciones."
 TRN_defiance_of_COU: "Desafiar la autoridad del Consejo Estudiantil General"
 TRN_defiance_of_COU_desc: "El Consejo Estudiantil General ha demostrado su incompetencia de forma evidente en el nuevo mundo, y la desaparición de su presidenta junto con los sucesos que siguieron han sacudido la confianza en el consejo desde la raíz. Esa autoridad ya no puede imponerse por encima de Trinity. Nos alzaremos contra ello y provocaremos una contrarrevolución como acto de resistencia."
 TRN_extinguish_the_flame: "Apagar la llama"
 TRN_extinguish_the_flame_desc: "Millennium sigue siendo una amenaza grave para nuestra alma mater, y su poder tecnológico es como una hoja apoyada bajo nuestro mentón. Esa hegemonía tecnológica ya no puede tolerarse y debe ser controlada."
 TRN_divine_mandate_west_kivotos: "Reorganizar Kivotos Occidental"
 TRN_divine_mandate_west_kivotos_desc: ""
 TRN_invasion_kaiser: "Desmantelar el régimen de [KAI.GetNameDef]"
 TRN_invasion_kaiser_desc: ""
 TRN_TrinityMikaDiplomacySpainAttack: "Asegurar Gibraltar"
 TRN_TrinityMikaDiplomacySpainAttack_desc: ""
 TRN_ultimatum_to_wild_hunt_academy: "Exigir la sumisión de Wild Hunt"
 TRN_ultimatum_to_wild_hunt_academy_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_4: "Mandato Sagrado de Kivotos Exterior"
 TRN_TrinityMikaDiplomacyItalyAttack_4_desc: ""
 TRN_threat_from_the_east: "Amenaza desde el este"
 TRN_threat_from_the_east_desc: "La fuerza [SOV.GetAdjective] del este se está convirtiendo en una gran amenaza para nuestra alma mater. En especial, desde hace tiempo [SOV.GetAdjective] ha sido un gran mal que apoya a nuestros enemigos, difunde propaganda y agitación desde dentro e intenta dividir nuestra alma mater."
 TRN_balkan_dip: "Diplomacia balcánica"
 TRN_balkan_dip_desc: "Para enfrentar al enorme enemigo del este, necesitamos la cooperación de los países balcánicos. En su mayoría tienen una inclinación anti-[SOV.GetAdjective], y si nos acercamos aprovechando eso, podremos forjar una relación de alianza sólida."
 TRN_winter_warfare: "Preparativos para el invierno"
 TRN_winter_warfare_desc: "Los territorios de la facción [SOV.GetAdjective] están dominados por un frío brutal. Tras varias investigaciones, confirmamos que incluso combatir es imposible con ropa de abrigo de nivel básico. Para adaptarnos al nuevo campo de batalla, proveeremos a nuestro ejército ropa invernal especialmente fabricada y equipo variado."
 TRN_conscription_of_polish_nationalists: "Reclutar nacionalistas polacos"
 TRN_conscription_of_polish_nationalists_desc: "Polonia era una república joven, con apenas unas décadas de independencia de Rusia. Pero hoy, los nacionalistas polacos vuelven a estar oprimidos por la gigantesca amenaza rusa. Debemos reclutarlos para mermar la capacidad bélica de [SOV.GetAdjective] y construir una alianza que derrote a ese gran mal."
 TRN_polish_autonomous_state: "Estado autónomo polaco"
 TRN_polish_autonomous_state_desc: "La actuación de los polacos fue deslumbrante, y parece que se han ganado plenamente el derecho a tener su propio país. Con el apoyo de Trinity, los polacos establecerán un Estado autónomo bajo nuestra tutela para reconstruir las ruinas de una Polonia derrumbada y volver a levantar su hogar."
 TRN_poland_divine_mandate_focus: "Mandato Sagrado del Sudeste de Trinity"
 TRN_poland_divine_mandate_focus_desc: "Los polacos fueron engañados. ¿Quién habría esperado que confiarían con tanta facilidad en gente venida de otro mundo? Polonia quedará en manos de los expertos de Trinity y será remodelada en todos los ámbitos: sociedad, política y más. Tras completarse la remodelación, renacerá como un nuevo escudo que detendrá al este y asumirá esa responsabilidad."
 TRN_destruction_of_soviet_hegemony: "Aplastar la hegemonía soviética"
 TRN_destruction_of_soviet_hegemony_desc: "Por fin han concluido los preparativos para enfrentar la amenaza roja del este. Durante mucho tiempo, [SOV.GetAdjective] ha apoyado a nuestros enemigos, fomentado la división interna y amenazado a nuestra alma mater. Ha llegado el momento de que paguen el precio."
 TRN_baltic_unrest: "Hermanos del Bosque"
 TRN_baltic_unrest_desc: "Los Estados bálticos se arrodillaron ante la violencia de [SOV.GetAdjective]. Pero eso se acaba ahora. Apoyaremos a los pueblos bálticos y los alentaremos a levantarse. No lucharán solos: lucharán junto a nosotras y conquistarán su independencia."
 TRN_anti_soviet_resistance: "Reclutar voluntarios antisoviéticos"
 TRN_anti_soviet_resistance_desc: "Según el Servicio de Inteligencia, dentro de [SOV.GetAdjective] aún existen algunas fuerzas de resistencia con tendencias antigubernamentales. Podremos cooptarlas y ofrecer una recompensa adecuada para que cooperen con nuestro ejército."
 TRN_ukrainian_unrest: "Inestabilidad ucraniana"
 TRN_ukrainian_unrest_desc: "En Ucrania existe una organización nacionalista activa desde 1930. Bajo la bandera de la independencia, no dudaron en recurrir al terrorismo y al asesinato, y en el proceso incluso civiles inocentes fueron sacrificados. Es un grupo cruel y bárbaro que nuestros valores no pueden aceptar... pero, irónicamente, ahora enfrenta al mismo enemigo que nosotras. Como dice el refrán: el enemigo de mi enemigo es mi amigo. ¿No podríamos cerrar los ojos, por un momento, a su pasado sucio?"
 TRN_belarusian_volunteer_corps: "Reclutar colaboradores bielorrusos"
 TRN_belarusian_volunteer_corps_desc: "Los colaboradores bielorrusos son, en su mayoría, personas que decidieron cooperar con Trinity. No tienen convicciones: no son más que oportunistas vulgares que se mueven por poder y beneficio. Pero si su servilismo nos resulta útil, ¿por qué rechazarlo? No somos tan necias como para expulsar a quienes dicen que cooperarán."
 TRN_eastern_divine_mandate: "Mandato Sagrado del Este"
 TRN_eastern_divine_mandate_desc: "El vasto territorio oriental de [SOV.GetAdjective] es demasiado para que la administración de Trinity lo gestione por sí sola. Por eso, estableceremos un nuevo gobierno en la región en torno a una administración cívico-militar formada principalmente por especialistas del Tea Party, locales y soldados."
 TRN_TrinityMikaDiplomacyAttackSwiss: "Invadir [SWI.GetNameDef]"
 TRN_TrinityMikaDiplomacyAttackSwiss_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack: "Vigilar la amenaza del sur"
 TRN_TrinityMikaDiplomacyItalyAttack_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_2: "Aplastar el peligro [ITA.GetAdjective]"
 TRN_TrinityMikaDiplomacyItalyAttack_2_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_3: "Guerra de montaña"
 TRN_TrinityMikaDiplomacyItalyAttack_3_desc: ""
 TRN_TrinityMikaDiplomacyItalyAttack_6: "Declarar la victoria sobre la fe de otro mundo"
 TRN_TrinityMikaDiplomacyItalyAttack_6_desc: ""
 TRN_divine_mandate_italy: "Mandato Sagrado de Italia"
 TRN_divine_mandate_italy_desc: ""


 # Ruta de Nagisa
 TRN_unprovable_problem: "Problema indemostrable"
 TRN_unprovable_problem_desc: "Un problema indemostrable. Si tuviéramos que condensar la situación actual de Trinity en una sola frase, esta sería la más adecuada."
 TRN_unprovable_problem_tt: "Esta §Yopción§! garantiza que Kirifuji Nagisa §Yganará§! sin falta la próxima §Yelección del Host§!."
 TRN_victory_of_intra_party_democracy: "Victoria de la democracia entre facciones"
 TRN_victory_of_intra_party_democracy_desc: "Kirifuji Nagisa se ha hecho con la hegemonía de Trinity. Pero en vez de un dominio absoluto de una sola persona, pretende gobernar armonizando su facción, Filius, con las demás. Con un pie en la duda, da un paso hacia un futuro de cooperación."
 TRN_victory_of_intra_party_democracy_tt: "Se desbloquea el §YEquilibrio de Poder§!, que representa la influencia social de la facción Filius, y el sistema de §Ypromesas§! de Nagisa, que afecta a ese equilibrio de poder."
 TRN_absorb_sanctus_faction: "Absorber la facción Sanctus"
 TRN_absorb_sanctus_faction_desc: "Tras Seia, la facción Sanctus ha perdido su carisma y está sumida en el caos. Nos reuniremos con su líder, $TRN_Natsuki_Kato$, y propondremos su integración en Filius. Por supuesto, no es que tengan muchas opciones para negarse."
 TRN_support_various_factions: "Tender la mano a las facciones neutrales"
 TRN_support_various_factions_desc: "También pediremos cooperación a los grupos que mantienen una postura neutral. En particular, podríamos prometer la ampliación de instalaciones médicas a cambio de cierta cooperación por parte de la facción Johann."
 TRN_prioritize_filius: "Priorizar la unidad de Filius"
 TRN_prioritize_filius_desc: "Tras la Gran Transición, en medio del caos y las intrigas políticas, algunas ejecutivas de Filius se pasaron a Pater. Digámosles que olvidaremos el pasado y ordenemos su regreso a la facción Filius."
 TRN_repromote_eden_treaty: "Cumbre Nagisa–Ako"
 TRN_repromote_eden_treaty_desc: "[TRN_repromote_eden_treaty_desc]"
 TRN_repromote_eden_treaty_desc_generic: "La antorcha del Acuerdo de Edén, soñada por la presidenta del Consejo Estudiantil General, no se apagó ni siquiera ante el vendaval de la guerra. Pronto invitaremos a Ako, la administradora principal de [GEH.GetName], a Trinity para debatir la creación de una organización conjunta de seguridad que mantenga el orden público entre ambas academias. Se espera la oposición de [GEM.GetName], pero es un problema manejable."
 TRN_repromote_eden_treaty_desc_alt: "La antorcha del Acuerdo de Edén, soñada por la presidenta del Consejo Estudiantil General, no se apagó ni siquiera ante el vendaval de la guerra. Pronto invitaremos a Ako, la jefa del Equipo de Prefectura de [GEH.GetName], a Trinity para debatir la creación de una organización conjunta de seguridad que mantenga el orden público entre ambas academias. Se espera la oposición de [GEM.GetName], pero es un problema manejable."
 TRN_repromote_eden_treaty_tt: "£decision_icon_small La decisión §Y$TRN_prefect_team_discipline_decline$§! queda bloqueada permanentemente."
 TRN_capriccioso_ruling_the_sora: "Capriccioso que gobierna el cielo"
 TRN_capriccioso_ruling_the_sora_desc: "Para restablecer el Acuerdo de Edén, el enemigo más amenazante es la destrucción permanente de [GEM.GetNameDef], hostil a Trinity. Debemos investigarlas y proteger el Acuerdo de Edén de la amenaza de [GEM.GetLeader]."
 TRN_hanuma_line: "Línea Hanuma"
 TRN_hanuma_line_desc: "En coordinación con [GEH.GetName], estamos debatiendo un plan para fortificar la frontera e impedir que las máquinas de guerra de [GEM.GetName] entren en nuestro territorio. Como la frontera común es demasiado larga, no podemos construir una línea majestuosa de fortalezas al estilo de la Línea Maginot en todas partes. Pero una red de fortificaciones en puntos clave será suficientemente efectiva."
 TRN_affettuoso_looking_up_to_the_sora: "Affettuoso que mira al cielo"
 TRN_affettuoso_looking_up_to_the_sora_desc: "Para restablecer el Acuerdo de Edén, el socio más fiable es [GEH.GetNameDef]. Mantendremos el contacto con [GEH.GetLeader] y, para el éxito del acuerdo, seguiremos apoyando al Equipo de Prefectura dentro de límites razonables."
 TRN_start_of_the_eden_treaty_negotiations: "Inicio de la renegociación del Acuerdo de Edén"
 TRN_start_of_the_eden_treaty_negotiations_desc: "Ha comenzado una nueva renegociación del Acuerdo de Edén. El punto más importante es que se celebrará una negociación de paz exclusiva entre Trinity y la facción [GEM.GetName], definiendo a Pandemonium Society como enemigo común. Si la negociación tiene éxito, podremos concentrar a los enemigos de Gehenna en uno solo: Pandemonium."
 TRN_start_of_the_eden_treaty_negotiations_tt: "Comienza el £decision_icon_small §YAcuerdo de Edén§! para establecer el organismo de unión mutua entre [TRM.GetName] y [GEH.GetName]. [GEM.GetName] y la facción Pater pueden sabotearlo."
 TRN_union_of_two_academies: "Propuesta de unificación federal entre academias"
 TRN_union_of_two_academies_desc: "Con el colapso de Pandemonium Society, ha llegado la paz entre ambas academias. A medida que la relación se vuelve extremadamente cercana, queremos impulsar la integración con el Equipo de Prefectura."
 TRN_union_of_two_academies_tt: "Si lo aprueban, nos unificamos pacíficamente con [GEH.GetNameDef]."
 TRN_war_of_good_and_evil: "Guerra del bien y del mal"
 TRN_war_of_good_and_evil_desc: "En la guerra civil de Gehenna, es evidente a quién debemos apoyar."
 TRN_technology_exchange_agreement: "Compartir tecnología de tanques Trinity–Gehenna"
 TRN_technology_exchange_agreement_desc: "A medida que avanza el rumbo pacífico entre el Equipo de Prefectura y nosotras, podremos compartir más cosas con ellas."
 TRN_technology_exchange_agreement_tt_1: "Si la facción §Y[TRM.GetAdjective]§! investiga tecnología de §Ytanque mediano§!, la facción §Y[GEH.GetAdjective]§! obtendrá la licencia."
 TRN_technology_exchange_agreement_tt_2: "Si la facción §Y[GEH.GetAdjective]§! investiga tecnología de §Ytanque mediano§!, la facción §Y[TRM.GetAdjective]§! obtendrá la licencia."
 TRN_nagisa_constitution_discussion: "La Primera Trinity"
 TRN_nagisa_constitution_discussion_desc: "No existe esa “Segunda Trinity” de la que hablaba la facción Pater. Tras sofocar el caos interno de Filius, Nagisa convocará un nuevo concilio para codificar el orden recto que desea establecer. Reformará el inestable mandato de 1 año del Host a 3 años y permitirá la reelección ilimitada. Y quizá haya debates que vayan aún más lejos."
 TRN_nagisa_constitution_discussion_tt: "Este enfoque activará una serie de §Yeventos§! relacionados con el §YConcilio§! en el que participan las facciones de Trinity. Nagisa puede elegir una reforma constitucional más autoritaria o mucho más democrática."
 TRN_nagisa_constitution_discussion_warning_tt: "§RAdvertencia§!: Si completas este enfoque sin haber completado $TRN_nagisa_meeting_with_sisterhood$, recibirás la §Yoposición§! de la Sisterhood."
 TRN_nagisa_meeting_with_sisterhood: "Contactar con la Sisterhood"
 TRN_nagisa_meeting_with_sisterhood_desc: "Tras el atentado contra Yurizono Seia, se ha extendido una teoría conspirativa de que la Sisterhood intervendrá en la política. A Nagisa no le agrada su tendencia a sospechar fácilmente de los demás, pero para confiar en la Sisterhood primero debe sospechar de ellas. Contactemos de forma preventiva para entender sus intenciones."
 TRN_successor_to_the_first_trinity: "Herederos de la Primera Trinity"
 TRN_successor_to_the_first_trinity_desc: "Hemos preservado nuestras nobles tradiciones e ideales. ¿Pero eso es todo? ¿Nuestro camino es simplemente mantener la Trinity de antes de la Gran Transición? Kirifuji Nagisa heredará la “Primera Trinity” y la “reformará” a su manera. Solo el Host conoce la dirección exacta de esa reforma."
 TRN_coexistence_with_germans: "Coexistencia en Alemania"
 TRN_coexistence_with_germans_desc: "Tras la Gran Transición, no nos queda más remedio que vivir junto a la población local alemana. Su cultura es ajena a Trinity, y su patriarcado—que niega la autoridad del Tea Party—es insoportable. Aun así, para coexistir en la misma tierra, será necesario permitir cierta autonomía local."
 TRN_idealistic_approach: "Solución del té con leche"
 TRN_idealistic_approach_desc: "Así como la leche y el té negro pueden armonizarse con la proporción adecuada, Trinity y la población local alemana también podrán lograr una armonía apropiada. Crearemos distritos escolares conjuntos y enseñaremos la fe de Trinity junto con las creencias locales, para que los locales aprendan naturalmente la cultura de Trinity y se asimilen gradualmente a nosotras."
 TRN_new_education_for_all: "Nueva educación para todas y todos"
 TRN_new_education_for_all_desc: "Dadas las enormes diferencias culturales entre Alemania y Trinity, todos los alemanes deberán completar obligatoriamente una nueva educación para comprender la cultura de Trinity y no albergar hostilidad hacia nosotras."
 TRN_civil_rights_act: "Ley de derechos civiles"
 TRN_civil_rights_act_desc: "Legalmente, las personas de Kivotos y las locales son completamente iguales. No podemos controlar toda discriminación social, pero al menos se prohíbe la discriminación institucional. Con ello, la población local irá aceptando cada vez más como natural el dominio de Kivotos. Al menos, eso espera el Tea Party."
 TRN_realistic_approach: "Solución del té Earl Grey"
 TRN_realistic_approach_desc: "Para preparar un buen Earl Grey, es importante añadir solo una pequeña cantidad de aceite de bergamota para no arruinar el sabor profundo del té negro. Ese es el valor de las costumbres locales. Si queda un poco, tiene sentido; pero si se pasa de la raya, borra el aroma de Trinity. No podemos erradicar por la fuerza la cultura alemana, pero debemos fomentar que se “triniticen” voluntariamente mediante discriminaciones tangibles e intangibles."
 TRN_dual_identity_card: "Dos identidades"
 TRN_dual_identity_card_desc: "Daremos etapas distintas desde la propia credencial a alemanes y trinitarias, aplicando un trato discriminatorio desde tasas impositivas hasta elegibilidad para cargos públicos. Es una clasificación de ciudadanía de segunda, debidamente estratificada. Las personas de segunda clase podrán obtener una nueva credencial tras demostrar que han sido “inspiradas” por la cultura de Trinity, completando diversos documentos de conversión y educación cultural de Trinity. No es una imposición: es una cuestión de elección."
 TRN_discriminate_but_equal: "Separadas, pero iguales"
 TRN_discriminate_but_equal_desc: "Aunque quienes aún no se han trinitizado reciban un trato diferenciado en todos los servicios, propagandizaremos con claridad que no es un sistema de castas permanente, sino una condición de la que pueden salir mediante la trinitización. Crearemos leyes que prohíban a las trinitarias discriminar a los locales que obtengan una nueva identidad, y otorgaremos beneficios a las “nuevas trinitarias”."
 TRN_german_cultural_revolution: "Revolución de la cultura alemana"
 TRN_german_cultural_revolution_desc: "Sea té con leche o Earl Grey, lo importante es que hace falta una buena mesa donde colocar la taza. Para fusionar la sociedad centrada en mujeres de Trinity con la sociedad centrada en hombres de Alemania, primero los alemanes deberán renunciar un poco a sus tradiciones. El eje serán programas de reeducación, un sistema de empleo femenino y sanciones contra políticos socialmente conservadores."
 TRN_denazification_nagisa: "Desnazificación"
 TRN_denazification_nagisa_desc: "Hay algo seguro: el nacionalsocialismo no puede ir con nosotras. Si esos arrogantes que quieren mandar a las mujeres de vuelta a la cocina se imponen en estas tierras, ¿cómo podría mantenerse en pie la autoridad del Tea Party?"
 TRN_trinity_religious_issue: "Problema religioso local"
 TRN_trinity_religious_issue_desc: "Según lo decidido en el último concilio, intervendremos en el asunto religioso de la población local."
 trn_nagisa_religion_hardline_tt: "En el concilio decidimos aplicar una §Ylínea dura§!, centrada en destruir la fe local:\n"
 trn_nagisa_religion_moderate_tt: "En el concilio decidimos aplicar una §Ylínea moderada§!, centrada en difundir propaganda de que la fe local es idéntica a la fe de Trinity:\n"
 trn_nagisa_religion_null_tt: "Aún no hemos celebrado el concilio. La §Ylínea dura§! aumentará la influencia de la Sisterhood de Trinity, mientras que la §Ylínea moderada§! favorecerá a los partidos locales alemanes.\n"
 TRN_nagisa_justice_task_force: "Vincular Inteligencia–Departamento de Realización de la Justicia"
 TRN_nagisa_justice_task_force_desc: "Nombramos personal del Departamento de Realización de la Justicia dentro del servicio de inteligencia directo del Tea Party, ampliando su escala incluso más que antes. Con la aparición de una agencia de inteligencia más grande y militarizada, leal al Tea Party, nuestra seguridad se volverá aún más firme."
 TRN_nagisa_support_for_the_JTF: "Ampliar el Departamento de Realización de la Justicia"
 TRN_nagisa_support_for_the_JTF_desc: "Nos reuniremos con Hanekawa Hasumi para expandir aún más el departamento y animarlas a desempeñar un gran papel no solo en seguridad pública, sino también en contrainteligencia."
 TRN_nagisa_support_for_the_prefect_team_intelligence: "Integrar la división de inteligencia del Equipo de Prefectura"
 TRN_nagisa_support_for_the_prefect_team_intelligence_desc: "La competente división de inteligencia del Equipo de Prefectura de Gehenna puede integrarse gracias a la relación pacífica entre nosotras y el Equipo de Prefectura. Eso sí: debemos tener en cuenta que existe descontento dentro del Departamento de Realización de la Justicia (especialmente alrededor de Hasumi), pese a la amistad entre ambos lados."
 TRN_mediator_among_factions: "Mediadora entre facciones"
 TRN_mediator_among_factions_desc: "A medida que avanza el mandato de Kirifuji Nagisa, está mostrando logros políticos sorprendentes al coordinar opiniones y equilibrar a varias facciones. Su influencia política crece de forma natural, y quienes al principio dudaban de su liderazgo ahora confían en ella."
 TRN_safeguarding_the_ideal_of_factional_democracy: "Guardiana de la tradición"
 TRN_safeguarding_the_ideal_of_factional_democracy_desc: "Nagisa no cambiará las viejas tradiciones de Trinity. Coordinará las distintas facciones del Tea Party y seguirá siendo simplemente la líder de facción de Filius."
 TRN_eventually_happen: "Mirar a Pater"
 TRN_eventually_happen_desc: "Una renegociación completa del Acuerdo de Edén es imposible. Acciones que provoquen a la facción Pater pueden generar un riesgo mayor que convertir al Equipo de Prefectura en aliado; por ello, al negociar con Pater, debemos ejecutar una renegociación del Acuerdo de Edén más “a la manera de Trinity” para gobernar mejor."
 TRN_eventually_happen_tt: "Comienza el £decision_icon_small §YAcuerdo de Edén§! para un pacto de no agresión mutua y trato preferencial a la industria de Trinity entre [TRM.GetName] y [GEH.GetName]. La facción [GEM.GetName], los duros del Equipo de Prefectura y la intervención de intereses en la política de Trinity pueden sabotearlo."
 TRN_eventually_happen_effect_tt: "Si Trinity completa el enfoque §Y$TRN_eventually_happen$§!, este enfoque será reemplazado por otro para resolver el §Yconflicto interno§! con Pater."
 TRN_nagi_preventive_war: "Guerra preventiva"
 TRN_nagi_preventive_war_desc: "La relación entre Gehenna y Trinity puede estallar en guerra en cualquier momento, y no sería extraño. El problema es que no solo nosotras lo pensamos: ellas también. En esta guerra, el vencedor se decidirá por quién apuñale primero al otro."
 TRN_eden_system_establishment: "Establecer el sistema de Edén"
 TRN_eden_system_establishment_desc: "Sea cual sea el resultado, ya hemos decidido la era: hemos abierto una nueva época gigantesca que atraviesa Gehenna y Trinity, y bajo el liderazgo de [ROOT.GetLeader], Trinity recibe un nuevo amanecer."
 TRN_start_of_new_constitution_discussion: "Preparar una nueva constitución"
 TRN_start_of_new_constitution_discussion_desc: "La victoria en la Batalla decisiva de Edén y la integración Gehenna–Trinity marcaron el inicio de un debate profundo sobre qué rumbo debemos tomar en el futuro."
 TRN_start_of_new_constitution_discussion_tt: "Hasta completar el enfoque §YConstitución de Nagisa§!, puedes añadir cláusulas constitucionales mediante £decision_icon_small §Gdecisiones§!. Cuando completes el enfoque de la Constitución de Nagisa, todos los efectos de las cláusulas añadidas se integrarán y se añadirán como §Yespíritu nacional§!."
 TRN_end_of_new_constitution_discussion: "Constitución de Nagisa"
 TRN_end_of_new_constitution_discussion_desc: "Con todos los preparativos completados, promulgamos el borrador final como nueva constitución tras la aprobación del concilio."
 TRN_end_of_new_constitution_discussion_trigger: "Has completado §Y6§! enfoques políticos."
 TRN_end_of_new_constitution_discussion_tt: "En el momento en que completes este enfoque, ya no podrás añadir más cláusulas constitucionales."
 TRN_unknown_future: "Futuro desconocido"
 TRN_unknown_future_desc: "El Host Kirifuji Nagisa se esforzará por encontrar el mejor futuro para Trinity. Aún no sabemos cuál será."
 TRN_unknown_future_tt: "Los enfoques políticos de la ruta de Nagisa se revelan al completar $TRN_safeguarding_the_ideal_of_factional_democracy$ o $TRN_iron_woman$."
 TRN_JTF_solidarity: "Disciplina interna del Departamento de Realización de la Justicia"
 TRN_JTF_solidarity_desc: "Al retroceder mucho en nuestra postura dura de política exterior debido a la interferencia de Pater, la posición política del Host Nagisa quedó dañada. Para reforzar la cohesión de facción, Nagisa concederá a Tsurugi, jefa del Departamento de Realización de la Justicia, un cargo honorario de ejecutiva del Tea Party sin derecho a voto, y buscará proclamar que el departamento sigue siendo leal al Host."
 TRN_attack_pater: "Concentrarse en acusar a Pater"
 TRN_attack_pater_desc: "Todo el mundo sabe que la instigadora del sabotaje persistente y las huelgas en Alemania no son los socialdemócratas, sino la facción Pater. Ordenaremos al Departamento de Realización de la Justicia rastrear a las instigadoras del sabotaje y centrarse en acusarlas, atacando a Pater."
 TRN_connection_to_vigilante: "Cooperación con los vigilantes"
 TRN_connection_to_vigilante_desc: "Conectándonos con los vigilantes, una organización paramilitar dentro de Trinity, haremos que arresten y detengan a locales que simpatizan con el sabotaje de la facción Pater."
 TRN_attack_mika_misono: "Agarrar a Mika por la pierna"
 TRN_attack_mika_misono_desc: "El derecho a acusar es como una espada. Aunque una acusación no pueda castigar realmente al objetivo, puede atarlo al tribunal durante las tres instancias, imponerle presión psicológica y forzarlo a gastar tiempo en el juicio. Si atamos así a Mika, los planes de sabotaje de Pater recibirán un golpe serio."
 TRN_we_need_to_be_prepared: "Lecciones de la guerra civil de Gehenna"
 TRN_we_need_to_be_prepared_desc: "Según el acuerdo de la organización conjunta de seguridad Prefectura–Trinity, tenemos derecho a desplegar fuerzas policiales en el Equipo de Prefectura. A través del personal del Departamento de Realización de la Justicia, pudimos obtener información sobre las operaciones militares de Pandemonium y acumular su conocimiento táctico. Por supuesto, algo de información también se filtra desde nuestro lado, pero lo que ganamos es mayor."
 # Nagisa tras la unificación de Gehenna (compartido)
 TRN_rich_man_and_the_eye_of_a_needle: "[TRN_rich_man_and_the_eye_of_a_needle_log]"
 TRN_rich_man_and_the_eye_of_a_needle_desc: "El Servicio Nacional de Salud, abreviado como “NHS”, es un sistema universal de seguro médico estatal en el que el Estado cubre todos los gastos médicos de la ciudadanía. Aunque hay quienes lo critican diciendo que en el futuro traerá la “enfermedad de Trinity” por el gasto en bienestar, el NHS aportará beneficios aún mayores."
 TRN_rich_man_and_the_eye_of_a_needle_open: "NHS"
 TRN_rich_man_and_the_eye_of_a_needle_default: "NHS: No se puede promulgar"
 TRN_rich_man_and_the_eye_of_a_needle_default_tt: "Hasta preparar la condición en la Constitución de Nagisa para designar cinco males sociales, este enfoque queda §Yprohibido§!."
 TRN_minimum_wage_law: "Ley de salario mínimo"
 TRN_minimum_wage_law_desc: "Bajo la protección del Host, garantizamos un salario mínimo de nivel razonable a los trabajadores para construir una red de seguridad social para la población pobre interna de Trinity que vive de empleos mal pagados."
 TRN_working_hours_limit: "Límite máximo de horas de trabajo"
 TRN_working_hours_limit_desc: "Reintroducimos las estrictas limitaciones legales promulgadas por el Reichstag alemán en 1918: “8 horas de trabajo al día, y hasta 48 horas semanales incluyendo horas extra”."
 TRN_affirmative_action: "Acción afirmativa"
 TRN_affirmative_action_desc: "La acción afirmativa es una política de cuotas que obliga a contratar en el lugar de trabajo a diversos grupos socialmente minoritarios, como minorías étnicas y personas con discapacidad. Este sistema será un pilar de resistencia para muchas personas vulnerables."
 TRN_affirmative_action_tt: "Se añade un §Ygeneral androide§! que, incorporado gracias al §Ysistema de cuotas para minorías§!, nunca enferma."

 # Nagisa tras la unificación de Gehenna (democracia)
 TRN_expansion_of_the_tea_party_scale: "Ampliar la escala del Tea Party"
 TRN_expansion_of_the_tea_party_scale_desc: "Nuestro gobierno no tolerará la agitación marxista radical —incluida la del partido socialdemócrata local— que se atreve a exigir un gabinete basado en elección directa. Sin embargo, para recoger opiniones diversas, se considerará con cautela duplicar el número de ejecutivas del Tea Party y ampliar su tamaño."
 TRN_guarantee_of_freedom_of_the_press: "Garantizar la libertad de prensa"
 TRN_guarantee_of_freedom_of_the_press_desc: "Permitiremos la reanudación de publicación de periódicos locales clausurados por actividades antigubernamentales tras la Gran Transición, y el Host prometerá verbalmente que no habrá censura de prensa bajo ninguna forma."
 TRN_trinity_carnival: "[TRN_trinity_carnival_log]"
 TRN_trinity_carnival_desc: "¿Qué tal si celebramos un festival maravilloso en Trinity, del que puedan disfrutar todas las academias?"
 TRN_trinity_carnival_open: "Carnaval de Trinity"
 TRN_trinity_carnival_default: "Carnaval de Trinity: No se puede promulgar"
 TRN_trinity_carnival_default_tt: "Hasta insertar $TRM_nagisa_constitution_strengthening_federalism$ como cláusula constitucional en la Constitución de Nagisa y preparar la condición, este enfoque queda §Yprohibido§!."
 TRN_birth_of_trinity_pan_nationalism: "Pannacionalismo de Trinity"
 TRN_birth_of_trinity_pan_nationalism_desc: "Desde sus orígenes, Trinity fue una “academia federada”. El nacionalismo de Trinity no proclama la superioridad de una sola academia llamada Trinity, sino que declara la unidad de todo Kivotos en contraste con los Estados locales."
 TRN_faith_for_all: "[TRN_faith_for_all_log]"
 TRN_faith_for_all_desc: "La fe de Trinity debe brindar ayuda universal a todas las personas de Kivotos, más allá de Trinity. Dado el apoyo que les hemos ofrecido, pediremos a la Sisterhood que asuma también un papel para la unidad de Kivotos."
 TRN_faith_for_all_open: "Fruto dulce de una fe sin falsedad"
 # Nota: Pick-up de Sakurako en servidor JP/CN (偽りなき信仰の甘果, 无伪信仰，甘甜果实)
 TRN_faith_for_all_default: "Fruto dulce de una fe sin falsedad: No se puede promulgar"
 TRN_faith_for_all_default_tt: "Hasta preparar la condición haciendo de la fe de Trinity una religión estatal en la Constitución de Nagisa, este enfoque queda §Yprohibido§!."
 TRN_meeting_with_mika: "Sueño de estrellas en una noche breve"
 # Nota: Pick-up de Sumika en servidor JP (短き夜の星の夢)
 TRN_meeting_with_mika_desc: "La disputa entre Filius y Pater se prolonga desde hace mucho tiempo, y considerando la relación humana entre Nagisa y Mika, el choque es lo bastante grave como para ser preocupante. Pero ahora que la posibilidad de que Pater se haga con el poder ha desaparecido por completo, ¿no existe la posibilidad de que ambas unan fuerzas de nuevo?"
 TRN_meeting_with_mika_tt: "La probabilidad de éxito de este enfoque depende de cuánto haya mostrado Kirifuji Nagisa, hasta ahora, una §Gfe inmutable en los demás§!.\n\nEstas elecciones aumentan la probabilidad de éxito:\n  £white_dot Elegir el enfoque §Y$TRN_five_clan_republic$§! y §Gperdonar§! a la §YEScuela Filial de Arius§!\n  £white_dot Tener a §Y$GEH_dkzh$§! o §Y$GEM_perfect_team$§! nombrada actualmente como §Gasesora§!\n  £white_dot Elegir el enfoque §Y$TRN_peaceful_exchange_with_mil$§! y §Gaceptar§! la ciencia de Millennium para aprender de ella\n  £white_dot Elegir el enfoque §Y$TRN_idealistic_approach$§! y abandonar una §Yactitud hostil§! hacia los alemanes\n\nEstas elecciones aumentan la probabilidad de fracaso:\n  £white_dot El §YAcuerdo de Edén§! §Rfracasa§! por la interferencia de Pater\n  £white_dot No completar §Y$TRN_german_cultural_revolution$§!, y por tanto Nagisa §Rno§! llegó a pedir ayuda a Hifumi\n  £white_dot Trinity está actualmente §Ren guerra§!, lo que vuelve inestable el estado mental de Nagisa"
 TRN_infinite_trust_and_faith: "Fe infinita hacia todas las personas"
 TRN_infinite_trust_and_faith_desc: "Hubo quien llamó a Nagisa “el demonio de la sospecha”. Pero tras tantas experiencias, Nagisa decidió por voluntad propia confiar en la bondad de su gente, su academia y Kivotos. Por fuerte que sea la oscuridad del mundo, esa oscuridad no pudo vencer a la luz."
 TRN_opening_the_old_library: "[TRN_opening_the_old_library_log]"
 TRN_opening_the_old_library_desc: "Levantamos con sumo cuidado la prohibición de algunos libros vetados de la Antigua Biblioteca y publicamos al público materiales del pasado de Trinity. Ya que hemos decidido distinguir los pecados de la vieja Trinity de la nueva, los libros prohibidos de hace siglos no deberían ser un problema hoy."
 TRN_opening_the_old_library_open: "Levantamiento de libros prohibidos"
 TRN_opening_the_old_library_default: "Levantamiento de libros prohibidos: No se puede promulgar"
 TRN_opening_the_old_library_default_tt: "Hasta insertar en la Constitución de Nagisa una cláusula constitucional de reflexión sobre el pasado de Trinity y preparar la condición, este enfoque queda §Yprohibido§!."
 TRN_new_and_free_trininy_culture: "Una cultura de Trinity nueva y libre"
 TRN_new_and_free_trininy_culture_desc: "Una nueva cultura popular de Trinity está naciendo y extendiéndose a través del intercambio con culturas vecinas."
 TRN_new_and_free_trininy_culture_tt: "§gSi §Y$TRN_Kyoyama_Kazusa$§! es asesora, este enfoque otorga efectos reforzados.\n---§!"
 TRN_meeting_with_mine: "Encuentro con Mine"
 TRN_meeting_with_mine_desc: "Aquel día, hace unos años… está circulando un rumor bastante desconcertante de que, en realidad, Seia no murió. Pero… no será cierto, ¿verdad?"
 TRN_nagisa_democratic_ending: "Where there's tea party there's hope."
 TRN_nagisa_democratic_ending_desc: "Tras convertirse en Host, Nagisa lo dio todo y realizó cada esfuerzo posible por Trinity. ¿Le entregará ahora esa carga a sus excelentes compañeras, o continuará su labor en medio de aplausos gloriosos?"
 TRN_nagisa_democratic_ending_tt: "Puedes ver el §Cfinal§! de Kirifuji Nagisa.\nTendrás una oportunidad de cambiar al Host, y las candidatas dependerán de las elecciones de enfoques que hayas tomado hasta ahora."
 TRN_nagisa_democratic_ending_after: "[TRN_nagisa_democratic_ending_after_name_log]"
 TRN_nagisa_democratic_ending_after_desc: "[TRN_nagisa_democratic_ending_after_desc_log]"
 TRN_nagisa_democratic_ending_after_nagisa: "Kirifuji siempre gana"
 TRN_nagisa_democratic_ending_after_nagisa_desc: "Nagisa decidió no dejar su puesto. Trinity necesita una líder que cargue con el peso del noblesse oblige. Quizá dentro de algunas décadas busque a la siguiente sucesora, pero por ahora, el Tea Party se unirá aún más en torno a Nagisa como persona."
 TRN_nagisa_democratic_ending_after_hifumi: "Salir medio paso por la puerta"
 TRN_nagisa_democratic_ending_after_hifumi_desc: "Hifumi no es alguien con ambición de poder, pero incapaz de rechazar el deseo personal de Kirifuji Nagisa, fue empujada casi a rastras al cargo de Host. Hifumi sigue bajo la sombra de Nagisa, pero poco a poco está aprendiendo política. ¿En unos años cambiará su carácter hasta parecerse a Nagisa? Claro que no."
 TRN_nagisa_democratic_ending_after_seia: "Un futuro que no estaba profetizado"
 TRN_nagisa_democratic_ending_after_seia_desc: "Ni siquiera Seia previó un futuro en el que volvería a ser Host. Seia intenta ya no depender de una precognición incierta. Si haces lo que quieres hacer, la precognición siempre puede fallar."
 TRN_nagisa_democratic_ending_after_atsuko: "No es una infusión de raíz de rábano"
 TRN_nagisa_democratic_ending_after_atsuko_desc: "Aunque en Trinity se la ha respetado como la “sangre real” de Arius, Atsuko recuerda la vida pobre que tuvo en Arius. Trinity no puede convertirse en algo así. Ella apoyará para que Trinity mantenga siempre una autosuficiencia alimentaria del 100%."
 TRN_nagisa_democratic_ending_after_ako: "El agente de la noche avanza"
 TRN_nagisa_democratic_ending_after_ako_desc: "El futuro será una era de guerra de información. Así lo decían las películas de espionaje. ¿Que no? ¡El cine es la realidad! El nuevo Host ampliará enormemente el presupuesto de Inteligencia e intentará reclutar informantes de forma amplia, desde hombres bestia hasta humanos locales."
 TRN_nagisa_democratic_ending_after_mine: "¿Orden de Socorro o facción Johann?"
 TRN_nagisa_democratic_ending_after_mine_desc: "Hasta ahora, Mine había sido la líder de la facción Johann, pero se negó a participar en el Tea Party. Sin embargo, al convertirse en Host gracias a la persuasión de Seia y el apoyo de Nagisa, ha empezado a considerar incorporar oficialmente la Orden de Socorro como una organización del Tea Party."
 TRN_nagisa_democratic_ending_after_hidden_takane: "Un Schwibzik para ti"
 TRN_nagisa_democratic_ending_after_hidden_takane_desc: "El Reino de Invierno, la Casa Ducal Miyoshi y esas historias cargadas de significado… en realidad todo era mentira. Pero Trinity entera se creyó esa mentira y eligió como Host a la “duquesa Takane”. ¡Aaaah! Ahora no queda más que convertir esa mentira en verdad. No hay compromiso. ¡A la fuerza!"
 TRN_nagisa_democratic_ending_after_bug_tt: "Que aparezca este tooltip significa que ocurrió un bug fatal. Por favor, reporta el error."
 
 # Nagisa tras la unificación de Gehenna (no alineado)
 TRN_illusion_of_equality: "La ilusión de la igualdad"
 TRN_illusion_of_equality_desc: "Para las élites que se esforzaron por el éxito de Trinity, introducimos oficialmente un sistema de investidura mediante el cual el Host puede otorgar títulos nobiliarios a quienes considere adecuados."
 TRN_removing_local_parties: "Erradicar por completo a los partidos locales"
 TRN_removing_local_parties_desc: "Ilegalizamos por completo al Partido Socialdemócrata, una fuerza de aventurerismo de extrema izquierda, y arrestamos a todos sus miembros. El rostro venenoso de los partidos locales ya no podrá amenazar los ideales de Trinity."
 TRN_removing_local_parties_tt: "La §Yestabilidad§! disminuye en proporción a la influencia de §Y$faction_G_name$§!, y toda esa influencia se traslada al lado de §Y$faction_A_name$§!."
 TRN_hope_light_distant_sky: "Oh esperanza, oh luz, oh cielo distante"
 TRN_hope_light_distant_sky_desc: "El Tea Party debe renacer como una mesa redonda aún más cerrada, como los caballeros que servían al antiguo Rey Arturo: iguales por dentro, pero estrictamente separados del exterior, reservada solo para las élites."
 TRN_pater_dissolution: "Disolver Pater"
 TRN_pater_dissolution_desc: "Ya se han reunido todas las bases legales para purgar permanentemente a toda la cúpula de Pater: crímenes como el maltrato a prisioneros justo tras la Gran Transición, el sabotaje interno durante el periodo del Acuerdo de Edén y la cooperación con disidentes alemanes para ejecutarlo."
 TRN_ding_dong_the_witch_is_dead: "Caza de brujas"
 TRN_ding_dong_the_witch_is_dead_desc: "A pesar de todo, Nagisa mantiene una postura muy benévola hacia Mika. Pero la línea del partido no es así. Mika es amiga de Nagisa, no amiga de Filius, ¿no? Quizá haga falta una obra teatral a nivel de facción: “Mika, acorralada, da un golpe de Estado para eliminar a Nagisa”."
 TRN_ding_dong_the_witch_is_dead_trigger_tt: "Has fallado §Y2 veces§! o más en la misión §Y$TRM_mika_misono_problem_cat$§!."
 TRN_ding_dong_the_witch_is_dead_tt: "La probabilidad de éxito de este enfoque depende de cuánto haya abandonado Kirifuji Nagisa, hasta ahora, la §Yfe inmutable en los demás§!.\n\nEstas elecciones aumentan la probabilidad de éxito:\n  £white_dot Elegir §Y$TRN_attack_pater$§! y §Y$TRN_attack_mika_misono$§! y §Yhostilizar§! a §YMisono Mika§!\n  £white_dot £white_dot §RNo completar§! el enfoque §Y$TRN_the_route_of_the_sun$§!\n  £white_dot Elegir §Y$TRN_crusade_against_mil$§! y hostilizar a Millennium\n  £white_dot Elegir §Y$TRN_realistic_approach$§! y mantener una §Yactitud hostil§! hacia los alemanes\n\nEstas elecciones aumentan la probabilidad de fracaso:\n  £white_dot Elegir §Y$TRN_five_clan_republic$§! y §Gperdonar§! a la §YEScuela Filial de Arius§!\n  £white_dot Tener a §Y$GEH_dkzh$§! o §Y$GEM_perfect_team$§! nombrada como §Gasesora§!\n  £white_dot §GCompletar§! el enfoque §Y$TRN_german_cultural_revolution$§!"
 TRN_ding_dong_the_witch_is_dead_effect_tt: "Independientemente de éxito o fracaso, este enfoque corta §Rpermanentemente§! la amistad entre Nagisa y Mika. Misono Mika ya no podrá usarse como general."
 TRN_make_up_work_club: "Club de clases de recuperación"
 TRN_make_up_work_club_desc: "Para proteger a su amado Filius, Nagisa quiere crear una “canasta de huevos podridos”: reunir a la gente de Trinity que aboga por ampliar el derecho al voto o por ideales liberales. No porque no confíe en ellas, sino porque ella “cree” que puede templarlas con fuego y hacerlas renacer."
 TRN_make_up_work_club_tt: "Se añade un modelo de §Yunidad penal§! compuesto por §Y6 brigadas§!."
 TRN_birth_of_trinity_pan_nationalism_alt: "$TRN_birth_of_trinity_pan_nationalism$"
 TRN_birth_of_trinity_pan_nationalism_alt_desc: "$TRN_birth_of_trinity_pan_nationalism_desc$"
 TRN_lord_protector_appointment: "Nombrar al Lord Protector"
 TRN_lord_protector_appointment_desc: "Solo Nagisa puede proteger a quienes ama. Si no es ella, ¿quién se sacrificará por esas personas preciadas? El Lord Protector es un nuevo cargo que el Host del Tea Party ostenta de forma concurrente, otorgando poderes extralegales: promulgar leyes sin pasar por el concilio y posponer elecciones sin límite."
 TRN_bill_of_attainder: "Ley de proscripción (Bill of Attainder)"
 TRN_bill_of_attainder_desc: "La ley de proscripción es una práctica del common law inglés en la que el parlamento (aquí, el Tea Party) señala por votación mayoritaria a un individuo como “criminal”, permitiendo su detención y castigo sin juicio. La introducción de un Bill of Attainder al estilo británico otorga más poder a Filius, que domina la mayoría del Tea Party."

 

 # Diplomacia de Nagisa
 TRN_right_of_the_victor: "Derecho del vencedor"
 TRN_right_of_the_victor_desc: "Exigimos rescate por los burócratas y políticos de Gehenna capturados como prisioneros en el Distrito Central de Gehenna. Que el vencedor obtenga un precio a cambio de liberar al vencido es una tradición y un derecho que existe desde antes incluso del medioevo, desde hace mil años."
 TRN_right_of_the_victor_tt: "Los efectos de este enfoque varían según quién fuera el §Ylíder al caer§! de Pandemonium Society."
 TRN_right_of_the_victor_makoto_tt: "£white_dot Presidenta §Y$GEH_akzhxh$§!:"
 TRN_right_of_the_victor_satsuki_tt: "£white_dot Presidenta §Y$GEH_satsuki$§!:"
 TRN_right_of_the_victor_iroha_tt: "£white_dot Presidenta §Y$GEH_dlfhgk$§!:"
 TRN_right_of_the_victor_chiaki_tt: "£white_dot Presidenta §Y$GEH_motomiya_chiaki$§!:"
 TRN_right_of_the_victor_ibuki_tt: "£white_dot Presidenta §Y$GEH_dlqnzl$§!:"
 TRN_right_of_the_victor_generic_tt: "£white_dot §YCualquier otra§! persona:"
 TRN_declaration_of_crusade_towards_the_west: "Formar la 1.ª Cruzada Europea"
 TRN_declaration_of_crusade_towards_the_west_desc: "Tras la gloriosa victoria de la facción Filius —que ama la tradición y la historia de Trinity— crecen las voces entre Filius y los duros de la Sisterhood que exigen enviar una “cruzada espiritual” contra los países vecinos que, tras la Gran Transición, no están espiritualmente plenos. Difundir más ampliamente las enseñanzas de las Escrituras e ilustrar a los incrédulos con la doctrina correcta quizá sea la misión de Filius."
 TRN_war_against_cou: "Invadir el Benelux"
 TRN_war_against_cou_desc: "Trinity no es un Estado expansionista que ansíe la expansión. Sin embargo, también se afirma que permitir que sobrevivan fuerzas del Consejo Estudiantil General en el Benelux representa una amenaza para nuestra seguridad nacional."
 TRN_recognition_of_cou: "Paz con el Benelux"
 TRN_recognition_of_cou_desc: "No hay necesidad de chocar con el Consejo Estudiantil General. ¿Acaso no han sido, desde antes de la Gran Transición, quienes mantenían el equilibrio del orden existente? Nuestro enemigo está en otra parte."
 TRN_recognition_of_bry_as_cou: "Respaldar a Aru como presidenta del Consejo Estudiantil General"
 TRN_recognition_of_bry_as_cou_desc: "Trinity no es un Estado expansionista que busque la expansión. Sin embargo, también se afirma que permitir que sobrevivan fuerzas del Consejo Estudiantil General en el Benelux representa una amenaza para nuestra seguridad nacional. Justo ahora, el Consejo Estudiantil General está dividido por el problema de la presidencia rival, y llegamos a la conclusión de que, en términos de seguridad, la idealista de la Revolución del 68 es una socia mejor que el consejo existente."
 TRN_stopping_kaisers_hegemony: "Cruzada contra Britania"
 TRN_stopping_kaisers_hegemony_desc: "La hegemonía de Kaiser debe terminar. No solo porque sean un Estado corporativo, sino porque, además, como Estado corporativo, venden cosas que no benefician a la ciudadanía de Trinity. Como las armas que Kaiser PMC vende acaban fluyendo hacia el mercado negro y siguen empeorando la seguridad interna de Trinity, declarar una cruzada contra ellos hará a Trinity aún más grande."
 TRN_crusade_against_mil: "Cruzada contra la facción [MIL.GetAdjective]"
 TRN_crusade_against_mil_desc: "La excelente ciencia y tecnología de Millennium merece ser aprendida, pero sus valores ateos son como soplar veneno en los oídos de Trinity. No enviamos una cruzada porque los odiemos, sino porque deseamos que sigan el camino correcto."
 TRN_peaceful_exchange_with_mil: "Code: BOX"
 TRN_peaceful_exchange_with_mil_desc: "Decir que debemos invadir a Millennium por ser un país ateo alegraría a los extremistas de la Sisterhood, pero es una postura demasiado fanática. Claro, también es porque la Sisterhood, animada por las victorias consecutivas de Trinity, está en un estado de “cierta plenitud espiritual”. En su lugar, enviaremos una delegación a la Expo de Millennium para aprender ciencia de Millennium."
 TRN_wild_hunt_protection_proposal: "Proponer protección a la facción [WHY.GetAdjective]"
 TRN_wild_hunt_protection_proposal_desc: "La Cruzada Occidental de Trinity avanza más allá de Millennium y entra en Iberia. Entendemos el conflicto que [WHY.GetName] mantiene con los Estados humanos, y trabajaremos para aceptarlos de nuestro lado."
 TRN_iberian_reconquista: "Cruzada ibérica"
 TRN_iberian_reconquista_desc: "¡El final de la cruzada ha llegado ya hasta el borde del continente europeo! Las enseñanzas de las Escrituras y del Señor purificarán a los incrédulos humanos. Si pueden ser ilustrados bajo la verdadera doctrina, los daños de la guerra de cruzada serán un precio asumible."
 TRN_preparation_for_the_eastern_crusade: "Preparar la cruzada oriental"
 TRN_preparation_for_the_eastern_crusade_desc: "El Oriente, tierra de ateos, es una frontera que debemos conquistar por el bien de la iluminación."
 TRN_eastern_crusade_for_russia: "Cruzada por la Gran Ilustración"
 TRN_eastern_crusade_for_russia_desc: "“...El portero le abre, y las ovejas oyen su voz; y a sus ovejas llama por nombre, y las saca. Y cuando ha sacado fuera todas las propias, va delante de ellas; y las ovejas le siguen, porque conocen su voz.”\n(Juan 10:3-4)"
 TRN_belarusian_volunteer_corps_nagisa: "$TRN_belarusian_volunteer_corps$"
 TRN_belarusian_volunteer_corps_nagisa_desc: "La historia o las tradiciones de Bielorrusia no importan. Lo importante es que están listas para unir sus manos a las nuestras por la descomunización."
 TRN_anti_soviet_resistance_nagisa: "$TRN_anti_soviet_resistance$"
 TRN_anti_soviet_resistance_nagisa_desc: "El Señor dice: “Fortaleceos en el Señor y en el poder de su fuerza. Vestíos de toda la armadura de Dios, para que podáis estar firmes contra las asechanzas del diablo… porque no tenemos lucha contra sangre y carne, sino contra principados, contra potestades, contra los gobernadores de las tinieblas de este siglo, contra huestes espirituales de maldad en las regiones celestes.” (Efesios 6:10-12). Para luchar contra las potestades, los estalinistas y los demonios, los decididos se alzarán con firmeza."
 TRN_ukrainian_unrest_nagisa: "$TRN_ukrainian_unrest$"
 TRN_ukrainian_unrest_nagisa_desc: "No confiamos en Ucrania porque conozcamos o apoyemos sus viejas tradiciones desde la Rus de Kiev o la lucha heroica de Bohdán Jmelnitski. Confiamos en ellos porque tienen la voluntad de luchar contra Moscú."
 TRN_preparation_for_the_poland_crusade: "Cruzada contra Polonia"
 TRN_preparation_for_the_poland_crusade_desc: "Desde justo después de la Gran Transición, Polonia ha tenido disputas territoriales con Trinity. Bueno… en realidad Trinity fue quien atacó primero. Pero, al preparar la cruzada oriental, debemos aplastar primero la amenaza polaca, que podría convertirse en un riesgo."
 TRN_preparation_for_the_switzerland_crusade: "Eliminar a los perros del Vaticano"
 TRN_preparation_for_the_switzerland_crusade_desc: "Suiza puede considerarse una fuerza pro-vaticana que, desde antaño, enviaba mercenarios al Estado de la Ciudad del Vaticano. Para difundir la fe de Trinity en Europa, eliminarlos —cuyas doctrinas religiosas distintas no encajan con las nuestras— es una “eliminación de riesgo” racional."
 TRN_march_to_the_vatican: "Marcha hacia el Vaticano"
 TRN_march_to_the_vatican_desc: "Si consideran la fe de Trinity como herejía, no nos queda más que demostrar que nuestra doctrina es la correcta. Yendo directamente al Vaticano… en tanques."
 TRN_march_to_the_true_rome: "Gran victoria de la fe de Trinity"
 TRN_march_to_the_true_rome_desc: "Nuestra fe ha sido reconocida con firmeza, y el Vaticano será desmantelado para siempre. ¡Que la luz y las enseñanzas de Trinity sean eternas!"
 TRN_crusade_proposal_plana: "Amenaza del Chroma"
 TRN_crusade_proposal_plana_desc: "Hemos confirmado la invasión de una fuerza externa a Kivotos llamada “Chroma”. Parece que su objetivo no somos nosotras, sino los locales, pero… ¿no podría ser solo una diferencia de prioridad?"
 TRN_chroma_navy: "Cruzada naval"
 TRN_chroma_navy_desc: "Para marchar hacia el territorio del Chroma debemos cruzar el mar, o el aire. Naturalmente, hace falta preparación."
 TRN_crusade_proposal_malkuth: "Amenaza del Ser Absoluto"
 TRN_crusade_proposal_malkuth_desc: "Un “dios mecánico” que se hace llamar Decagrammaton está amenazando a todo Kivotos. Antes de que nos destruyan, los golpearemos primero."
 TRN_decagrammaton_army: "Investigar doctrina de combate anti-máquina"
 TRN_decagrammaton_army_desc: "Para enfrentarnos a Decagrammaton, necesitamos un manual “anti-máquina” adecuado. No tenemos mucho tiempo para prepararnos, pero para impedir que una lata sin alma se suba sobre el pilar espiritual de Trinity, debemos tener éxito."
 TRN_becoming_the_goddess: "La última cruzada"
 TRN_becoming_the_goddess_desc: "El gran águila adora a Mammón llamado dinero, y pone al capitalismo —no a Dios— en la cúspide de la cruzada. El Señor dijo: “No hagáis de la casa de mi Padre casa de mercado.” (Juan 2:16). Y así, haremos lo debido."
 TRN_controlling_madness: "Controlar la locura"
 TRN_controlling_madness_desc: "El Club de Investigación Gourmet, el Club de Desarrollo de Aguas Termales… estos lunáticos son el dolor de cabeza más grande del Host tras la integración de Gehenna. Claro, lo más fácil sería volarles la cabeza con fósforo blanco en el acto (¿por qué la jefa Hina no lo hizo?), pero intentemos primero negociar. ¿Y si falla? Entonces lo pensaremos cuando llegue el momento."
 TRN_five_clan_republic: "República de los Cinco Clanes"
 TRN_five_clan_republic_desc: "Trinity, formada por la alianza de tres grandes facciones —Filius, Pater y Sanctus— ahora ha integrado también a Gehenna y luego a Arius, obteniendo cinco pilares. Trinity prometerá estatus igualitario también para la Arius ocupada y ofrecerá apoyo ilimitado para la reconstrucción de Arius y la integración de Trinity."
 TRN_five_clan_republic_tt: "La facción §YPartido Popular Nacional Alemán§! cambia a §Yfacción Arius§!. La facción Arius formará una §Gcoalición§! con el gobierno."
 TRN_arius_inquisition: "Inquisición contra Arius"
 TRN_arius_inquisition_desc: "Arius es un mal que ni siquiera puede compararse con Gehenna. El pagano solo no conocía la fe correcta y puede lavar su pecado convirtiéndose en discípulo (Mateo 28:19), pero el hereje conocía la fe correcta y aun así siguió el camino del mal, por lo que jamás podrá entrar en el reino de Dios (Gálatas 5:19-21). Realizaremos una inquisición hasta destruir por completo su pensamiento herético."
 TRN_arius_inquisition_tt: "La facción §YPartido Popular Nacional Alemán§! cambia a §Yfacción Arius§!. La mitad de la influencia de la facción Arius §g(redondeada, decimales hacia arriba)§! se §Gañade§! a la influencia de la facción Filius."
 TRN_arius_diplomacy_tt: "Los efectos de este enfoque varían según qué líder haya elegido la Escuela Filial de Arius entre §YEscuadrón Arius§! y §YTropa de Nicomedia§!."
 TRN_arius_diplomacy_squad_tt: "¡Se añadirá tras el rework de Arius!"
 TRN_arius_diplomacy_nicomedia_troop_tt: "¡¡Se añadirá tras el rework de Arius!!!"
 TRN_two_church_unity: "Unificadora de las Iglesias de Oriente y Occidente"
 TRN_two_church_unity_desc: "Moscú, convertido en el corazón de la Iglesia Ortodoxa tras la caída de Constantinopla, ha caído en nuestras manos. Gracias a los esfuerzos de [ROOT.GetLeader], tanto el catolicismo como la ortodoxia han quedado bajo la bandera de Trinity, y la Iglesia de Trinity se ha convertido en el centro de toda fe verdadera."
 TRN_the_route_of_the_sun: "Ruta del Sol"
 TRN_the_route_of_the_sun_desc: "Aunque choques con otros lleven a combatir como si fueras a matarlos, al final, tras esa pelea, acabas amando a quien detestabas. Eso, por sí mismo, suena a novela romántica de juventud. Nuestra relación con ellas fue así."
 TRN_the_route_of_the_sun_tt: "Los efectos de este enfoque varían según la decisión que tomó el Equipo de Prefectura en la §Y2.ª Asamblea General del Equipo de Prefectura§!."
 TRN_the_route_of_the_sun_ako_tt: "El Equipo de Prefectura completa §Y$GEH_ako_route_focus$§!:\n£white_dot El nombre de Amau Ako cambia a Sorazaki Ako\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_iori_tt: "El Equipo de Prefectura completa §Y$GEH_iori_route_focus$§!:\n£white_dot §YApoyo a la guerra§! +0.05%\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_hina_tt: "El Equipo de Prefectura completa §Y$GEH_hina_route_focus$§!:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_generic_tt: "El Equipo de Prefectura completa §Y$GEH_main_route_focus$§!:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_red_winter_takane_hidden_focus: "La duquesa del Reino de Invierno"
 TRN_red_winter_takane_hidden_focus_desc: "Recientemente, tras ocupar Red Winter, obtuvimos información sobre la antigua Casa Ducal Miyoshi, reprimida por el opresor de Red Winter. Tras deliberar, el Host decidió reconocer el título de la duquesa Miyoshi Takane y aceptarla como nueva ejecutiva de Filius."
 TRN_union_of_faith: "Hermanas de la fe unida"
 TRN_union_of_faith_desc: "Trinity ya no está sola. Bajo una firme solidaridad con las hermanas de la fe, avanzaremos juntas hacia la victoria."
 TRN_disobedience_of_the_subjects: "Home Guard"
 TRN_disobedience_of_the_subjects_desc: "La situación de guerra es mala. Con la patria de Trinity siendo devastada por los ataques de los invasores, la sangre roja debe salir al campo de batalla por la sangre azul."
 TRN_disobedience_of_the_subjects_tt: "Se añade un modelo de milicia compuesto por §Y6 brigadas§!."
 TRN_sending_missionaries_to_allies: "Enviar misioneras a los aliados"
 TRN_sending_missionaries_to_allies_desc: "La fe de Trinity aún no se ha extendido mucho entre las otras academias de Kivotos, pero tras la Gran Transición, al ampliarse el papel de la Sisterhood, la evangelización hacia el exterior se ha vuelto activa. Quizá la fe pueda unirnos a nosotras y a ellas."
 TRN_sending_missionaries_to_allies_tt: "Tras completar este enfoque, los países que se conviertan en aliados de §Y[ROOT.GetName]§! podrán, mediante decisiones que consumen poder político, aceptar misioneras."
 TRN_trinity_loop_rail_line: "Oficina Ferroviaria de Trinity"
 TRN_trinity_loop_rail_line_desc: "¿Hay algo más importante que transportar tropas rápidamente por ferrocarril para la guerra y la expansión? Una oficina ferroviaria propia de Trinity —no controlada por Highlander— conectará vías incluso hasta las regiones más atrasadas."
 # Ruta dictatorial de Nagisa
 TRN_iron_woman: "La Dama de Hierro"
 TRN_iron_woman_desc: "Para proteger a la academia de fuerzas antigubernamentales como la facción Pater, hace falta un Host más fuerte. Es posible recurrir a acusaciones indiscriminadas contra figuras de otras facciones, a la manipulación de la opinión pública mediante la prensa e incluso al populismo a través de políticas demagógicas. No es que Nagisa sea cruel: es para proteger a Trinity." 

