 TRM_nagisa_constitution_strengthening_federalism_flag: "Se eligió §Y$TRM_nagisa_constitution_strengthening_federalism$§! como cláusula de la Constitución de Nagisa"

 ### Común
 TRM_nagisa_constitution_kivotos_pan_human_rights: "Garantizar derechos básicos a todos los ciudadanos de Kivotos"
 TRM_nagisa_constitution_kivotos_pan_human_rights_desc: "Añadimos a la constitución un texto de derechos humanos que garantice igualdad de derechos a todos los kivotosianos con Halo, sin importar de qué academia provengan."
 TRM_nagisa_constitution_guarantee_of_beastmen_rights: "Derechos especiales para beastmen y androides"
 TRM_nagisa_constitution_guarantee_of_beastmen_rights_desc: "Añadimos a la constitución cláusulas para garantizar los derechos de los hombres de Kivotos, así como de beastmen y androides."
 TRM_nagisa_constitution_militia_rights: "Base constitucional para las milicias vecinales"
 TRM_nagisa_constitution_militia_rights_desc: "Las organizaciones de autodefensa que operaban en Trinity han sido, estrictamente hablando, entidades de una zona gris. Lo importante es garantizar en la constitución el derecho a formar milicias que §Yreconozcan el sistema de Trinity§!, dando sustento legal a distintas actividades de milicias trinitarias y llevando a esas organizaciones dentro del marco de la ley."
 TRM_nagisa_constitution_freedom_of_religion: "Garantizar libertad religiosa"
 TRM_nagisa_constitution_freedom_of_religion_desc: "La fe de Trinity es nuestro sistema de creencias más importante, pero garantizamos el derecho a mantener otras religiones además de la de Trinity. Claro, esto atraerá acusaciones de simpatía por la ideología de la “Segunda Trinity” e incluso de intentar convertir al Estado en ateo.\n\nPara garantizar la libertad religiosa por vía constitucional, necesitamos una forma de demostrarle a la Sisterhood que ellas no son nuestras enemigas. O, al menos, mostrarles que existen “hermanas en la fe” capaces de convencerlas de por qué la libertad de culto es necesaria."
 TRM_nagisa_constitution_freedom_of_religions_trigger_tt: "Cumple una de las siguientes condiciones:\nDemostrar la devoción de la Host:§g\n£white_dot Completar el enfoque §Y$TRN_two_church_unity$§!\n\n§!Obtener cooperación de Arius:§g\n£white_dot Completar el enfoque §Y$TRN_five_clan_republic$§!§!\n"
 TRM_nagisa_constitution_designation_of_state_religion: "Convertir la fe de Trinity en religión oficial"
 TRM_nagisa_constitution_designation_of_state_religion_desc: "La fe de Trinity es nuestro sistema de creencias más importante. En la nueva constitución, declaramos con firmeza que el orden nacional se fundamenta en nuestra fe, y que la fe de Trinity es la religión oficial del Estado."
 TRM_nagisa_constitution_establishment_of_consultative_council: "Establecer un consejo consultivo"
 TRM_nagisa_constitution_establishment_of_consultative_council_desc: "Insertar en la constitución una cláusula que amplíe el sufragio a la gente común y cree un parlamento provocaría una reacción feroz. Trinity, durante mucho tiempo, ha tenido tradiciones culturales y sociales que jamás han podido conciliarse con la democracia.\n\nEn la Constitución de Nagisa, el poder del parlamento se limitaría estrictamente a “consulta” y “recomendación”: no tendría autoridad para crear leyes ni para decidir el presupuesto nacional. Aun así, muchas facciones verán esto como subirse al tren al infierno que convierte a Trinity en un Estado democrático.\n\nSin embargo, también existe el argumento de que “bajo la oligarquía aristocrática de Trinity, la opinión de la ciudadanía ha sido excluida por completo; debemos crear un consejo consultivo para escuchar a las masas”."
 TRM_nagisa_constitution_establishment_of_consultative_council_trigger_tt: "Cumple una de las siguientes condiciones:\nVoluntad reformista dentro de Trinity:§g\n£white_dot El bando de [TRM.GetNameWithFlag] es un país §Ydemocrático§!\n£white_dot En el concilio, el tema de la fe se resolvió con una política §Ymoderada§!\n£white_dot Completar el enfoque §Y$TRN_idealistic_approach$§!\n£white_dot Nombrar a §Y$TRN_Ajitani_Hifumi$§! como consejera de Trinity\n\n§!Entrada del espíritu liberal de Gehenna:§g\n£white_dot El bando de [GEH.GetNameWithFlag] completó el enfoque §Y$GEH_ako_route_focus$§! o §Y$GEH_main_route_focus$§!\n£white_dot Nombrar a §Y$GEH_dkzh$§! como consejera de Trinity\n£white_dot Completar el enfoque §Y$TRN_start_of_the_eden_treaty_negotiations$§!\n£white_dot Completar el enfoque §Y$TRN_the_route_of_the_sun$§!\n\n§!Entrada del parlamentarismo de los países locales:§g\n£white_dot Existe al menos un §Galiado democrático§! entre las §Ygrandes potencias§! que no sea un país de Kivotos§!\n\n"
 TRM_nagisa_constitution_anti_democracy_holy_war: "Codificar el espíritu antidemocrático"
 TRM_nagisa_constitution_anti_democracy_holy_war_desc: "Expandir el sistema oligárquico del Tea Party —dirigido por élites trinitarias bien formadas— hacia las masas, que no han recibido la educación adecuada, equivale a destruir Trinity. Además, aunque les des derecho al voto, ¿a quién elegirían? ¿A Cherino? ¿A Makoto? Por eso, dejamos por escrito en la constitución que la democracia es el enemigo y un objetivo a derribar."
 TRM_nagisa_constitution_establishment_of_consultative_council_OR_anti_democracy_holy_war_tt: "Solo se puede elegir uno entre §Y$TRM_nagisa_constitution_establishment_of_consultative_council$§! y §Y$TRM_nagisa_constitution_anti_democracy_holy_war$§!."
 TRM_nagisa_constitution_strengthening_federalism: "Fortalecer la autonomía de los estados"
 TRM_nagisa_constitution_strengthening_federalism_desc: "Fortalecemos la autonomía de cada estado y permitimos que las academias integradas en Trinity puedan actuar de forma independiente, aunque sea de manera limitada, en el escenario internacional."
 TRM_nagisa_constitution_strengthening_federalism_trigger_tt: "Cumple una de las siguientes condiciones:\nVoluntad reformista dentro de Trinity:§g\n£white_dot El bando de [TRM.GetNameWithFlag] es un país §Ydemocrático§!\n\n§!Necesidad de autonomía estatal por expansión territorial:§g\n£white_dot Posee la §Gcapital§! de al menos §Gtres§! entre: el Gran Ducado de Luxemburgo, Shanhaijing Senior High School, Red Winter Federal Academy, Hyakkiyako Alliance Academy, Millennium Science School, el Consejo Estudiantil General de Kivotos, Abydos High School y Wild Hunt Art Academy§!"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty: "Abolir la pena de muerte"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty_desc: "La historia de Trinity ha estado marcada por la tortura y la represión contra opositores por parte de la Sociedad del Santo Justina. Pero las cosas han cambiado. Ya no habrá represión despiadada: lo declaramos en la constitución, dejando claro que “el Estado no tiene derecho a matar a su pueblo”."
 TRM_nagisa_constitution_guarantee_of_social_basic_rights: "Dejar por escrito la lucha contra los cinco males sociales"
 TRM_nagisa_constitution_guarantee_of_social_basic_rights_desc: "Los cinco males sociales son los cinco “males” que, según William Beveridge —director de la London School of Economics—, mantienen a la gente común en la pobreza: la necesidad, la enfermedad, la ignorancia, la miseria (insalubridad) y la ociosidad. Añadimos una cláusula constitucional que establece el deber del Estado de resolverlos.\n\nEsto es casi una declaración explícita de que Trinity se transformará a largo plazo en un “Estado de bienestar”. Para quienes defienden el libre mercado, será una cláusula bastante impactante."
 TRM_nagisa_constitution_reflection_on_past_history: "Reflexión sobre el pasado"
 TRM_nagisa_constitution_reflection_on_past_history_desc: "Incluimos en la constitución un mensaje de reflexión por los crímenes cometidos bajo el nombre de Trinity Comprehensive School, incluyendo los actos de tortura del pasado por parte de la Sociedad del Santo Justina.\n\nEs algo noble y orientado al futuro, pero existe el riesgo de que la Sisterhood lo interprete como una afrenta a su propia historia. Para dejar la “reflexión sobre el pasado” escrita en la constitución, debemos preparar fundamentos suficientes para persuadir a la Sisterhood."
 TRM_nagisa_constitution_reflection_on_past_history_trigger_tt: "Cumple una de las siguientes condiciones:\nDemostrar la devoción de la Host:§g\n£white_dot Completar el enfoque §Y$TRN_two_church_unity$§!\n\n§!Reflexión de la Sisterhood por el apocalipticismo:§g\n£white_dot Estar en §Rguerra§! contra el bando de [GEI.GetNameWithFlag]§!\n"

 # Nagisa: integración (core) de Gehenna
 TRN_united_gehenna_decisions_cat: "Integración de Gehenna por Trinity"
 TRN_united_gehenna_decisions_cat_desc: "§GTrinity Comprehensive School§! nació mediante el §YConcilio Primigenio§!, una alianza en la que se unieron Filius, Sanctus, Pater y muchas otras academias menores. Trinity jamás se sostuvo en soledad: siempre existió mediante una unión equitativa de múltiples academias y campus. Si Trinity ya es una federación de muchas academias, entonces que se sume una integrante nueva no debería ser algo especial. Gehenna no será una colonia ni una derrotada: se alzará como un miembro pleno de la unión de Trinity, una nueva hermana en el mismo nivel.\n\n…Eso es lo que dice la postura oficial en la web del gobierno de Trinity. Claro, la Host, el JTF, las facciones… e incluso la antigua Gehenna saben que ese noble comunicado no contiene toda la verdad. La §YAcademia Gehenna§! es completamente distinta al resto de academias miembros de Trinity: no comparte la fe, las diferencias culturales son profundas y su espíritu liberal no se mezcla con las nobles tradiciones de Trinity.\n\nAun así, el buen pastor se sacrifica por sus ovejas (Juan 10:11). El Tea Party las guiará con paciencia para que puedan alzarse como el §Gcuarto pilar§! de Trinity. Aunque el cordero llore y haga ruido, ¿lo abandonará el pastor? Así como el Señor hace recostar al rebaño en verdes pastos y lo guía junto a aguas de reposo, conduciéndolo por sendas de justicia (Salmos 23:2-3), así también debemos hacerlo nosotros.\n\nActual presidenta del consejo estudiantil de la §GAcademia Gehenna§!: [TRN_gehenna_puppet_leader_loc]"

 ## Decisiones: presidenta del consejo estudiantil de Gehenna
 ### Nagisa -> baja resistencia + sube cumplimiento a la vez; Iori -> baja resistencia; Sena -> sube cumplimiento
 TRN_gehenna_puppet_leader_host: "Kirifuji Nagisa asume también la presidencia del consejo de Gehenna"
 TRN_gehenna_puppet_leader_host_desc: "Kirifuji Nagisa asume simultáneamente el cargo de presidenta del consejo estudiantil de Gehenna."
 TRN_gehenna_puppet_leader_host_tt: "§gSi Kirifuji Nagisa asume también la presidencia de Gehenna, la decisión $TRN_gehenna_puppet_leader_integration_target$ tendrá efectos de reducción leve de resistencia y aumento leve de cumplimiento.§!"
 TRN_gehenna_puppet_leader_iori: "Nombrar a Shiromi Iori como presidenta del consejo de Gehenna"
 TRN_gehenna_puppet_leader_iori_desc: "Hacemos que el JTF de Gehenna controle el consejo estudiantil de Gehenna. Para las estudiantes de Gehenna, esto se percibirá como un gobierno militar de facto. Ayudará a aplastar a la resistencia, pero no es una buena opción para ganar apoyo civil."
 TRN_gehenna_puppet_leader_iori_tt: "§gSi Shiromi Iori es nombrada presidenta del consejo estudiantil de Gehenna, la decisión $TRN_gehenna_puppet_leader_integration_target$ tendrá efectos de reducción de resistencia.§!"
 TRN_gehenna_puppet_leader_sena: "Nombrar a Himuro Sena como presidenta del consejo de Gehenna"
 TRN_gehenna_puppet_leader_sena_desc: "Hacemos que el Departamento de Medicina de Emergencia de Gehenna controle el consejo estudiantil de Gehenna. Para las estudiantes de Gehenna, esto se percibirá como una administración civil de facto. Con una tradición parecida a la Orden de Socorro, es una opción de autogobierno más fácil de aceptar para Trinity y también satisfará a los locales. El problema es si, bajo el sistema de la presidenta Sena, realmente podremos aplastar a la resistencia."
 TRN_gehenna_puppet_leader_sena_tt: "§gSi Himuro Sena es nombrada presidenta del consejo estudiantil de Gehenna, la decisión $TRN_gehenna_puppet_leader_integration_target$ tendrá efectos de aumento de cumplimiento.§!"

 TRN_gehenna_puppet_leader_integration_target: "Política interna en el estado de [FROM.GetName] por el Consejo Estudiantil de Gehenna"
 TRN_gehenna_puppet_leader_integration_target_desc: "La presidenta del consejo estudiantil de Gehenna implementa políticas de administración de Gehenna para integrar Trinity y Gehenna."

 TRN_gehenna_puppet_leader_loc_0: "Vacante"
 TRN_gehenna_puppet_leader_loc_1: "Kirifuji Nagisa"
 TRN_gehenna_puppet_leader_loc_2: "Shiromi Iori"
 TRN_gehenna_puppet_leader_loc_3: "Himuro Sena"

 TRN_united_gehenna_decisions_remove_resistance: "Eliminar la resistencia en el estado de [FROM.GetName]"
 TRN_united_gehenna_decisions_remove_resistance_desc: "Con el éxito de nuestras políticas integracionistas en la región de Gehenna, parece que la resistencia en el estado de [FROM.GetName] está perdiendo apoyo popular."

 TRN_united_gehenna_decisions_integration_complete: "Procedimiento de integración del estado de [FROM.GetName]"
 TRN_united_gehenna_decisions_integration_complete_desc: "El estado de [FROM.GetName] ha sido incorporado al orden de Trinity y ha aceptado nuestro orden y nuestra fe."

 TRN_united_gehenna_decisions_remove_nsdap: "Eliminar la influencia nacionalsocialista en el estado de [FROM.GetName]"
 TRN_united_gehenna_decisions_remove_nsdap_desc: "De forma vergonzosa, el antiguo gobierno de Gehenna había dejado intactas hasta hoy a las fuerzas del Partido Nacionalsocialista Obrero Alemán (nazi) en esta región, sin purgarlas en absoluto. Parece que al JTF no le queda más remedio que actuar."

