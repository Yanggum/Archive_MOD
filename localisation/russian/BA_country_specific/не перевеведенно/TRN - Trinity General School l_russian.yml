#캐릭터 #인물
 T RN_tea_party_name: "Tea Party"
 TEA_PARTY_DESC: "Cuando Trinity se vio envuelta en un fenómeno de origen desconocido y un desastre cayó sobre la academia, la Host convocó una reunión de emergencia. En consecuencia, los representantes de cada facción se han reunido y están guiando a Trinity bajo un sistema de triunvirato.\n\nAhora que la crisis se ha estabilizado hasta cierto punto, la reunión de emergencia se disolverá pronto tras elegir a una nueva Host."
 TRN_Kirifuji_Nagisa: "Kirifuji Nagisa"
 TRN_Kirifuji_Nagisa_desc: "Líder de la facción Filius y dirigente de Trinity, Kirifuji Nagisa nació en una familia adinerada. Creció junto a su amiga de la infancia, Misono Mika; desde el momento de su ingreso demostró una inteligencia sobresaliente, y por recomendación del Tea Party pasó a formar parte de la facción Filius. Abanderando el realismo, ha desempeñado el rol de mediadora dentro de la facción, y desde que asumió como líder es valorada como la figura clave que resolvió numerosos problemas entre las distintas facciones.\n\nSin embargo, su posición actual está bajo una amenaza grave. Esto se debe a que Misono Mika, su amiga de la infancia y antigua aliada, se está moviendo entre bastidores para usurpar el poder. La Sisterhood, la Orden de los Caballeros de Socorro y el Departamento de Justicia están siendo puestos bajo sospecha por todas las acciones que mostraron después del incidente. A esto se suma que las fricciones dentro de la facción Filius no cesan. Tras el trágico asesinato de Yurizono Seia, la facción Sanctus se derrumbó con rapidez, y ejecutivos de tendencia moderada y progresista se incorporaron en masa a Filius, lo que intensificó aún más los conflictos internos.\n\nAhora, Kirifuji Nagisa se encuentra en una situación como si caminara sobre el filo de una espada. En el instante en que dé un solo paso en falso, incontables puntas de espada se volverán hacia ella."
 TRN_Yurizono_Seia: "Yurizono Seia"
 TRN_Yurizono_Seia_leader_desc: "Yurizono Seia, Host de Trinity y líder de la facción Sanctus, es sin lugar a dudas una de las personas más sabias de toda la academia. Sin embargo, su sabiduría jamás es amable. Su peculiar forma de hablar —tan críptica que, más allá de lo difícil, hiere con sutileza el ánimo de quien la escucha— hace difícil distinguir si se trata de un desagradable pasatiempo dirigido hacia los demás, o de una conducta natural nacida de un profundo nihilismo. Aun así, el hecho de que ella reine en la cúspide de la facción Sanctus demuestra la eficacia real de su liderazgo.\n\nDesde el incidente de la Gran Transición, su actitud pesimista ha sobrepasado el umbral crítico. Ahora, en las palabras y acciones de Seia ya no queda ni un atisbo de holgura, y a veces se manifiesta un filo gélido, casi grosero. Quizá ella misma se crea una Noé frente a un diluvio colosal. Pero el tiempo que se le concede como Host para completar el arca es apenas un instante: un solo año. Es un plazo demasiado corto para construir una nave con la que huir de una destrucción predestinada. Por eso, si es para prolongar ese breve indulto, no dudará en recurrir a cualquier medio.\n\nSeia, que atisba el futuro mediante el incierto medio de los sueños, siempre vaga sola por el tiempo que aún no ha llegado. Si su presciencia es una bendición divina o una maldición llamada pesadilla eterna, solo ella misma lo sabrá."
 TRN_Misono_Mika: "Misono Mika"
 TRN_Misono_Mika_leader_desc: "¿Cómo habría que describir a Misono Mika, la dirigente de Trinity? Los apodos que la adornan son innumerables: líder de la facción Pater, manifestación del gran arcángel, una mujer inteligente, cínica e impulsiva. Una figura de doble faz que, tras una sonrisa inocente, oculta una naturaleza meticulosa y calculadora. Una oportunista hipócrita que cree que la misión que se le ha conferido es una convicción. Según sus propios escritos: una villana imperdonable, una bruja consumida por el autodesprecio, una pecadora imposible de redimir. Una persona que, incluso dentro del autodesprecio, no vacila.\n\nLos apodos y estigmas que rodean a Misono Mika nacen todos de su facción y de sus fanáticos partidarios. Nació en un hogar acomodado, mostró inteligencia desde pequeña y creció bajo la estricta educación de sus padres. Fue amiga de la infancia de Kirifuji Nagisa; ambas crecieron cargando con las expectativas de Trinity, y finalmente alcanzaron la hazaña de convertirse en líderes de una de las tres grandes facciones: Mika como cabeza de Pater.\n\nPara sus seguidores, Misono Mika es una existencia que despierta inspiración y adoración. Ella prometió una visión de una 'Trinity fuerte'—más poderosa y hegemónica—que nadie se había atrevido a pronunciar. Para recuperar la gloria de la hegemonía trinitaria, anticuada pero deslumbrante. Para, al final de un amanecer que se extingue, llamar a una nueva luz."
