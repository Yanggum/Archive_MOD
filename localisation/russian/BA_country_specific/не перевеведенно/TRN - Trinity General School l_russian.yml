## Decisiones de Trinity
 eden_treaty_negotiation_trinity_propaganda: "Propaganda de Trinity"
 eden_treaty_negotiation_trinity_propaganda_desc: "Por más que la facción Pater ladre como un perro rabioso, el bloque gobernante somos nosotros. Lo importante es que los numerosos medios bajo nuestro control seguirán difundiendo propaganda sobre la importancia del Tratado de Edén y sobre la necesidad de reducir la hostilidad hacia Gehenna."
 eden_treaty_negotiation_pro_gehenna: "Agitación cultural pro-Gehenna"
 eden_treaty_negotiation_pro_gehenna_desc: "Usamos marketing para que la cultura de Gehenna no parezca mala a las estudiantes de Trinity… o incluso para que parezca elegante. El mejor objetivo de propaganda será Kurodate Haruna. Puede ser medio boba, pero tiene un habla y unos gestos con cierta nobleza: si lo editamos bien, podemos meterle a la gente la idea de que Gehenna y Trinity no son tan distintas."
 eden_treaty_negotiation_pro_prefect_team: "Actividades conjuntas de seguridad con el JTF"
 eden_treaty_negotiation_pro_prefect_team_desc: "Ya no son solo las patrullas vecinales las que protegen el orden de Trinity fuera del JTF. Desde las calles de Edén hasta las cabañas rurales, los agentes operativos del JTF de Gehenna están cooperando en la seguridad pública, y sus heroínas que aplastan a los Helmet Gang y a los fascistas pueden dejar una fuerte impresión en el público."
 eden_treaty_negotiation_talk_nagisa: "[ROOT.GetLeader] da la cara"
 eden_treaty_negotiation_talk_nagisa_desc: "[ROOT.GetLeader] organiza eventos como fiestas sociales y presentaciones de libros para persuadir directamente a la élite adinerada de Trinity. Un encuentro con la Host tiene un poder de persuasión sorprendente."
 eden_treaty_negotiation_remove_host: "Responder al rumor de “invasión de Trinity”"
 eden_treaty_negotiation_remove_host_desc: "Para contrarrestar el rumor de que el bando de [GEH.GetLeader], aliado con la facción Filius, planea invadir Trinity, el bando de [ROOT.GetLeader] publicará con total claridad la política defensiva actual de Trinity."
 eden_treaty_negotiation_remove_sardine_pie: "Responder a la teoría del “pastel de sardina”"
 eden_treaty_negotiation_remove_sardine_pie_desc: "Es una teoría conspirativa totalmente absurda. Un solo video de entrevistas grabadas en las calles de Gehenna bastaría para apagarla."
 eden_treaty_negotiation_remove_angry_JTF: "Responder a la oposición interna del JTF"
 eden_treaty_negotiation_remove_angry_JTF_desc: "Visitaremos al JTF en persona. [ROOT.GetLeader] explicará los beneficios de paz que aporta la unión Trinity–Gehenna y convencerá de que la facción Pater, que sigue agitando a la gente, es la mayor amenaza para la seguridad de Trinity."

## Decisiones Pater (elige IA, tipo misión)
 eden_treaty_negotiation_host: "[eden_treaty_negotiation_host_loc]"
 eden_treaty_negotiation_host_desc: "[eden_treaty_negotiation_host_desc_loc]"
 eden_treaty_negotiation_host_hina: "Rumor de invasión de Trinity: Sorazaki Hina"
 eden_treaty_negotiation_host_hina_desc: "La facción Pater afirma que la facción Filius insiste en impulsar el Tratado de Edén porque está preparando un golpe de Estado en cooperación con el JTF de Gehenna. Según los pregoneros de Pater, Sorazaki Hina —la nueva líder de Filius— entrará a Edén conduciendo un tanque y heredará el puesto de Host.\n\nLógicamente, si de verdad hubiera una conspiración así, la Host ya lo habría notado. Al menos, en la oficina de la Host de Trinity nunca llegó un complot tan rancio como hojas de té podridas. El problema es que las masas, un poco tontas, podrían dejarse arrastrar."
 eden_treaty_negotiation_host_ako: "Rumor de invasión de Trinity: Amau Ako"
 eden_treaty_negotiation_host_ako_desc: "La facción Pater afirma que la facción Filius insiste en impulsar el Tratado de Edén porque está preparando un golpe de Estado en cooperación con el JTF de Gehenna. Según los pregoneros de Pater, Amau Ako —la nueva líder de Filius— entrará a Edén conduciendo un tanque y heredará el puesto de Host.\n\nLógicamente, si de verdad hubiera una conspiración así, la Host ya lo habría notado. Al menos, en la oficina de la Host de Trinity nunca llegó un complot tan rancio como hojas de té podridas. El problema es que las masas, un poco tontas, podrían dejarse arrastrar."
 eden_treaty_negotiation_sardine_pie: "El orgullo de Trinity: el pastel de sardina"
 eden_treaty_negotiation_sardine_pie_desc: "Según la facción Pater, las estudiantes de Gehenna creen que nosotros vivimos comiendo pastel de sardina todos los días, y que por la mañana compartimos un “sándwich tostado” donde metemos pan entre pan y pan. Podrá haber opiniones diversas sobre la cultura culinaria de Trinity, pero esto no es más que una calumnia ridícula; además, es un intento absurdo de sembrar división diciendo que las estudiantes de Gehenna consideran la cocina de Trinity como algo de bajísima calidad. Aun así… puede que incluso algunas trinitarias terminen creyéndose las mentiras de Pater."
 eden_treaty_negotiation_angry_JTF: "Oposición interna del JTF"
 eden_treaty_negotiation_angry_JTF_desc: "Parece que la facción Pater ha empezado a contactar a ciertos sectores del JTF con una marcada postura anti-Gehenna. Que una organización militar esté alborotando oposición al Tratado de Edén es una señal bastante peligrosa. Hay que hacer que su forma de pensar —esa de permitir incluso actos que dañan la seguridad nacional con tal de proteger sus intereses— se arrodille ante el éxito del Tratado de Edén."

