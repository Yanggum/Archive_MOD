 TRM_appeasement_germany_modifier: "Política de apaciguamiento hacia Alemania"
 TRM_appeasement_germany_modifier_desc: "La Academia Integral Trinity está empleando diversas medidas para frenar el contacto entre los alemanes y las organizaciones terroristas de origen alemán. Una de ellas es una política de apaciguamiento dirigida a los alemanes que no apoyan a los grupos terroristas."
 TRM_appeasement_germany_modifier_tt: "Modificadores de §Y$TRM_appeasement_germany_modifier$§!:"
 TRM_pro_german_propaganda_modifier: "Propaganda progermana"
 TRM_pro_german_propaganda_modifier_desc: "A diferencia de los gobernantes anteriores de Trinity, la Host Misono Mika está mostrando una postura activa de reclutar y aprovechar a los alemanes para ganarse su favor. Trinity, sin la obstrucción alemana, parece estar eliminando a sus adversarios y conduciendo una transformación; pero con el tiempo quedará claro que esto no es más que propaganda vacía."
 TRM_pro_german_propaganda_modifier_tt: "Modificadores de §Y$TRM_pro_german_propaganda_modifier$§!:"
 TRM_trinity_social_issues_modifier: "Problemas sociales de Trinity"
 TRM_trinity_social_issues_modifier_desc: "Cuando el velo de lo superficial se descorre y el movimiento organizado de los alemanes contra Trinity deja de ser cosa de grupos de resistencia para extenderse incluso al pueblo alemán, entonces tendremos que tomar una decisión. Para salvar a Trinity, que no es más que una tenue vela."
