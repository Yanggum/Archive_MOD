 TRN_influence_baltics_decision: "Ejercer influencia sobre [FROM.GetName]"
 TRN_influence_the_baltics_unlock_tt: "£decision_icon_small §YDesbloquea decisión§!: ejercer influencia sobre los países bálticos"
 TRN_german_influence: "Influencia de Trinity"

 # Diplomacia balcánica
 TRM_diplomacy_balkan_decision_category: "$ITA_diplomacy_balkan_decision_category$"
 TRM_diplomacy_balkan_decision_category_desc: "Los Balcanes son una región de conflictos frecuentes, tanto que se les llama el “polvorín de Europa”. Eso significa que es un entorno idóneo para fomentar rivalidades e intrigas entre países. Por lo tanto, debemos actuar con prudencia y estrategia.\n\nHay que ajustar adecuadamente las relaciones entre los Estados balcánicos y guiar sus políticas en una dirección que beneficie a nuestros intereses. En última instancia, debemos elaborar un plan a largo plazo para hacer que todos los países balcánicos queden subordinados a nosotros o se conviertan en aliados."
