 TRM_nagisa_constitution_guarantee_of_social_basic_rights_flag: "Se eligió §Y$TRM_nagisa_constitution_guarantee_of_social_basic_rights$§! como cláusula de la Constitución de Nagisa"
 TRM_nagisa_constitution_designation_of_state_religion_flag: "Se eligió §Y$TRM_nagisa_constitution_designation_of_state_religion$§! como cláusula de la Constitución de Nagisa"
