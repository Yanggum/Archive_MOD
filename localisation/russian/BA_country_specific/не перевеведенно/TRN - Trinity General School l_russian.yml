# 나기사 헌법
 TRM_nagisa_constitution_cat: "Constitución de Nagisa"
 TRM_nagisa_constitution_cat_desc: "Con el orden de Trinity ya estabilizado, §GKirifuji Nagisa§! se ha convertido en una Host tan poderosa como nunca antes. Pero Nagisa no se conforma con estas pequeñas victorias: quiere crear un nuevo marco para Trinity que perdure incluso dentro de cien años. Filius sabe que, tras la Gran Transición, Trinity no puede sobrevivir si se queda como un simple “estado-academia” al estilo Kivotos. Sin embargo, dado que rechazamos afirmaciones radicales como la de la §Y“Segunda Trinity”§!, también es difícil llevar a cabo una reforma constitucional demasiado aventurada.\n\nFilius pondrá el pie derecho en la realidad mientras avanza el izquierdo hacia el ideal. Estamos preparando la promulgación de la §YConstitución de Nagisa§!, que aceptará tanto el futuro idealista de la patria como las exigencias realistas de las facciones. Sin duda, la nueva constitución decidirá los próximos cien años de Trinity.\n\n£white_dot Regla especial: Algunas cláusulas constitucionales radicales que se desvían de las tradiciones sociales conservadoras de Trinity solo podrán elegirse si se cumplen §Clos requisitos§!.\n"
 TRM_nagisa_constitution_datasite: "§GEfectos previstos actuales§! de la §GConstitución de Nagisa§!\n-$political_power_factor_tt$ [?TRM_nagisa_constitution_political_power_factor|=+%2]\n-$training_time_factor_tt$ [?TRM_nagisa_constitution_training_time_factor|=-%2]\n-$production_factory_max_efficiency_factor_tt$ [?TRM_nagisa_constitution_production_factory_max_efficiency_factor|=+%2]\n-$army_org_factor_tt$ [?TRM_nagisa_constitution_army_org_factor|=+%2]\n-$army_morale_factor_tt$ [?TRM_nagisa_constitution_army_morale_factor|=+%2]\n-$production_lack_of_resource_penalty_factor_tt$ [?TRM_nagisa_constitution_production_lack_of_resource_penalty_factor|=+%2]\n"
 ## Estructura de la constitución: versión trasladada a decisiones (basada en el enfoque constitucional del SPD alemán en Kara)
 ## Hasta completar una decisión: 56 días -> solo una a la vez (como si fuera un enfoque; no se pueden elegir varias a la vez)
 ## Luego, al completar el enfoque “Constitución de Nagisa”, se añadirá el modificador
 TRM_nagisa_constitution_danger_law_tt: "Esta reforma constitucional se considera §Rradical§!.\n"
