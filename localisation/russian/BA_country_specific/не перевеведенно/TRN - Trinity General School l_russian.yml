 TRN_poland_trinity_border_dispute_ns: "Conflicto Trinity-Polonia"
 TRN_poland_trinity_border_dispute_ns_desc: "El conflicto entre Trinity y Polonia nació de un malentendido menor. Durante una operación de barrido contra las fuerzas alemanas, un oficial alemán capturado dijo: \"Danzig también es territorio alemán\". Sin embargo, la dirigencia de Trinity lo malinterpretó como un hecho y, al invadir a Polonia —que estaba en guerra con la Unión Soviética—, ocupó [807.GetName] y [86.GetName]. Desde entonces, Polonia ha presentado protestas diplomáticas de manera constante, pero Trinity se niega firmemente a resolver el asunto por la vía diplomática."
