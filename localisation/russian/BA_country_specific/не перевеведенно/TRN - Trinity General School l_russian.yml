 kozeki_ui_trait: "§9Jefa del Club de Biblioteca de Trinity.\n\nUna chica que ama los libros hasta el punto de decir que los prefiere a las personas, y en especial le gustan los libros antiguos en los que se siente el paso del tiempo. En su vida diaria se encierra en el archivo de libros raros, donde casi nadie va, leyendo o gestionando los volúmenes antiguos.§!"
