 trinity_events_nagisa_diplomacy.24.desc.mine: "Aomori Mine, sujetando con fuerza la caja de arginina que le cubría el cuerpo para que no se le cayera, avanzó arrastrándose por el suelo en un pasillo desierto detrás de la Expo Millennium. Ya había gateado más de cien metros, así que las mangas del uniforme de la Orden de Socorro estaban hechas jirones, y el sudor que le corría por la frente caía al piso: ploc, ploc, en silencio. Pero Mine no podía quitarse la caja de arginina. Porque dentro del edificio rondaba una mujer fuera de sí, Otohana Sumire, con gafas de sol, llevando a decenas de miembros del Helmet Gang como si fueran \"miembros del club de entrenamiento\".\n\n\"Visitante de Trinity, salga ya. Nuestro Club de Entrenamiento de Millennium también tiene preparado un curso de experiencia de entrenamiento perfecto para los invitados de Trinity. ¿Sabe que, mientras se esconde, la pérdida de músculo sigue avanzando?\"\n\nA un lado de Sumire, la miembro del Club de Entrenamiento Nomasa Rei habló por un megáfono. \"Mire, entre más rápido se rinda, más rápido se le quita. ¡Salga ya, invitada de Trinity!\"\n\n¿Entre más rápido se rinda, más rápido se le quita? Mine recordó aquel horrible \"entrenamiento\" que había visto: Sumire maltratando a varios miembros del Helmet Gang hasta el punto de que se los llevaran en ambulancia, y aun así murmurando con frialdad: \"Si van acostados en la ambulancia, pierden músculo...\" En el instante en que descubrieran su posición, Mine sintió instintivamente que quien subiría a la ambulancia sería ella.\n\n\"¡¿De verdad, por qué Millennium deja que una mujer que necesita socorro ande suelta por el recinto de la expo?!\" Dentro de la caja de arginina, evitando las miradas de los zombis del Club de Entrenamiento, Mine siguió arrastrándose poquito a poquito. La salida se acercaba. Pero el problema era Nomasa Rei, que patrullaba frente a la salida con un bate de béisbol. Con que le diera un solo golpe al costado, Mine sería arrastrada al infierno de entrenamiento de Sumire.\n\n¿Debería buscar otro pasillo? ¿O soltar la caja a mitad de camino y lanzarse directo contra Rei? Con suerte, quizá podría ganar el forcejeo y escapar de este edificio prefabricado antes de que Sumire llegara, para reunirse con los miembros del Departamento de Justicia."
 trinity_events_nagisa_diplomacy.24.desc.ako: "Amau Ako, sujetando con fuerza la caja de arginina que le cubría el cuerpo para que no se le cayera, avanzó arrastrándose por el suelo en un pasillo desierto detrás de la Expo Millennium. Ya había gateado más de cien metros, así que las mangas del uniforme de inspectora del Tea Party estaban hechas jirones, y el sudor que le corría por la frente caía al piso: ploc, ploc, en silencio. Pero Ako no podía quitarse la caja de arginina. Porque dentro del edificio rondaba una mujer fuera de sí, Otohana Sumire, con gafas de sol, llevando a decenas de miembros del Helmet Gang como si fueran \"miembros del club de entrenamiento\".\n\n\"Visitante de Trinity, salga ya. Nuestro Club de Entrenamiento de Millennium también tiene preparado un curso de experiencia de entrenamiento perfecto para los invitados de Trinity. ¿Sabe que, mientras se esconde, la pérdida de músculo sigue avanzando?\"\n\nA un lado de Sumire, la miembro del Club de Entrenamiento Nomasa Rei habló por un megáfono. \"Mire, entre más rápido se rinda, más rápido se le quita. ¡Salga ya, invitada de Trinity!\"\n\n¿Entre más rápido se rinda, más rápido se le quita? Ako recordó aquel horrible \"entrenamiento\" que había visto: Sumire maltratando a varios miembros del Helmet Gang hasta el punto de que se los llevaran en ambulancia, y aun así murmurando con frialdad: \"Si van acostados en la ambulancia, pierden músculo...\" En el instante en que descubrieran su posición, Ako sintió instintivamente que quien subiría a la ambulancia sería ella.\n\n\"¡¿De verdad, por qué Millennium deja que una pinche loca así ande suelta por el recinto de la expo?!\" Dentro de la caja de arginina, evitando las miradas de los zombis del Club de Entrenamiento, Ako siguió arrastrándose poquito a poquito. La salida se acercaba. Pero el problema era Nomasa Rei, que patrullaba frente a la salida con un bate de béisbol. Con que le diera un solo golpe al costado, Ako sería arrastrada al infierno de entrenamiento de Sumire.\n\n¿Debería buscar otro pasillo? ¿O soltar la caja a mitad de camino y lanzarse directo contra Rei? Con suerte, quizá podría ganar el forcejeo y escapar de este edificio prefabricado antes de que Sumire llegara, para reunirse con los miembros del Departamento de Justicia."
 trinity_events_nagisa_diplomacy.24.a: "Nos lanzamos contra Rei."
 trinity_events_nagisa_diplomacy.24.b: "Buscamos otro pasillo seguro."
 trinity_events_nagisa_diplomacy.25.t: "Code: BOX - Ceremonia de clausura"
 trinity_events_nagisa_diplomacy.25.desc.nagisa: "La Expo Millennium fue larga y llena de sobresaltos. Pero en la clausura ya no debería ocurrir nada fuera de lo común. Al participar en la ceremonia de clausura, que terminaría con el discurso del bando de [MIL.GetLeader], Nagisa soltó un suspiro de alivio. Ella había pasado por toda clase de incidentes, sí, pero al menos el personal que la acompañó pudo ver, probar y aprender diversas tecnologías de Millennium. Millennium era un país con el que Trinity podía aprender más y fortalecer la amistad, no un enemigo.\n\n\"...con esto, damos por concluida la ceremonia de clausura de la Expo Millennium del año [GetYear]...\"\n\nEn ese instante, antes siquiera de que [MIL.GetLeader] terminara la frase, la pared del auditorio donde se celebraba la clausura se hizo pedazos de repente. ¡Booom! Con el estruendo, se oyeron los gritos de las chicas del Club de Ingeniería. \"¡Eso! ¡¿No es el cocodrilo robot tamaño gigante que estábamos investigando?!\" ¿Tamaño gigante? Dios, por favor, un Dios misericordioso. Por favor, no hasta en la clausura. Nagisa se levantó con sus guardias. Un cocodrilo enorme, del tamaño de un tanque mediano, irrumpió en el auditorio escupiendo fuego por la boca. El personal de seguridad de Millennium que custodiaba la clausura se abalanzó... y salió volando por los aires al ser golpeado por la cola de acero del cocodrilo.\n\n\"¡Kieeeek!\"\nCon un chillido grotesco, el cocodrilo robot saltó directamente sobre el escenario donde [MIL.GetLeader] estaba dando el discurso de clausura. El rostro horrorizado de [MIL.GetLeader] y, entrando justo en ese momento al auditorio, C&C. Nagisa calculó rápido: no daba el tiempo. Antes de que C&C pudiera rescatar a la presidenta del consejo estudiantil de Millennium, ese cocodrilo robot la mordería y se la tragaría. De verdad, de verdad, había sido la peor expo. Siguiendo su sentido de justicia, Nagisa se lanzó hacia adelante. No como la elegante política del Tea Party, sino como una buena persona: Kirifuji Nagisa."
 trinity_events_nagisa_diplomacy.25.desc.ichika: "La Expo Millennium fue larga y llena de sobresaltos. Pero en la clausura ya no debería ocurrir nada fuera de lo común. Al participar en la ceremonia de clausura, que terminaría con el discurso del bando de [MIL.GetLeader], Ichika soltó un suspiro de alivio. Ella había pasado por toda clase de incidentes, sí, pero al menos el personal que la acompañó pudo ver, probar y aprender diversas tecnologías de Millennium. Millennium era un país con el que Trinity podía aprender más y fortalecer la amistad, no un enemigo.\n\n\"...con esto, damos por concluida la ceremonia de clausura de la Expo Millennium del año [GetYear]...\"\n\nEn ese instante, antes siquiera de que [MIL.GetLeader] terminara la frase, la pared del auditorio donde se celebraba la clausura se hizo pedazos de repente. ¡Booom! Con el estruendo, se oyeron los gritos de las chicas del Club de Ingeniería. \"¡Eso! ¡¿No es el cocodrilo robot tamaño gigante que estábamos investigando?!\" ¿Tamaño gigante? Ah. Por favor, no me diga que hasta en la clausura van a salir con esto. Ichika se levantó con sus guardias. Un cocodrilo enorme, del tamaño de un tanque mediano, irrumpió en el auditorio escupiendo fuego por la boca. El personal de seguridad de Millennium que custodiaba la clausura se abalanzó... y salió volando por los aires al ser golpeado por la cola de acero del cocodrilo.\n\n\"¡Kieeeek!\"\nCon un chillido grotesco, el cocodrilo robot saltó directamente sobre el escenario donde [MIL.GetLeader] estaba dando el discurso de clausura. El rostro horrorizado de [MIL.GetLeader] y, entrando justo en ese momento al auditorio, C&C. Ichika calculó rápido: no daba el tiempo. Antes de que C&C pudiera rescatar a la presidenta del consejo estudiantil de Millennium, ese cocodrilo robot la mordería y se la tragaría. De verdad, de verdad, había sido la peor expo. Siguiendo su sentido de justicia, Ichika se lanzó hacia adelante. Si el Departamento de Justicia no hace justicia en un momento así, ¿entonces quién diablos lo hará?"
