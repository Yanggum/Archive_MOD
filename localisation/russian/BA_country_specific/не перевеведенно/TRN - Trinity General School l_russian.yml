 Ako dejó de ser la inspectora del Tea Party de Trinity y volvió a ser la alta administradora veterana de la Prefect Team de Gehenna."
 trinity_events_nagisa_diplomacy.25.a: "Cubrimos con el cuerpo a [MIL.GetLeader] del ataque del cocodrilo."
 trinity_events_nagisa_diplomacy.25.b: "Intentamos someter al cocodrilo atacándolo de costado."
 trinity_events_nagisa_diplomacy.26.t: "Code: BOX - De regreso a Trinity"
 trinity_events_nagisa_diplomacy.26.desc: "Todos los itinerarios de la Expo Millennium han concluido. Aunque la representante que partió como embajadora de buena voluntad regresó hecha un desastre y acabó hospitalizada en el Hospital General de Edén, a cambio obtuvimos diversos avances tecnológicos. Eso sí: si avanzamos dos veces más, nuestra delegación va a quedar hecha pedazos. Aprendimos dos cosas: que la tecnología de Millennium es extremadamente útil, y que Millennium es tremendamente peligrosa.\n\nPor último, parte del personal de escolta enviado con nuestra representante está mostrando síntomas severos de miedo hacia el \"demonio de la pérdida muscular\" y el \"entrenamiento\". También se procederá con tratamiento de PTSD para ellas."
 trinity_events_nagisa_diplomacy.26.a: "Ugh... la pesadilla de la caja de arginina..."
 trinity_events_nagisa_diplomacy_code_box_nagisa_tt: "§gTenga en cuenta que Kirifuji Nagisa no es buena en combate. Esta opción puede añadirle un rasgo negativo a Nagisa. Sin embargo, si tiene éxito, obtendrá una recompensa mayor que Mine e Ichika.§!"
 trinity_events_nagisa_diplomacy_code_box_ako_tt: "§gTenga en cuenta que Amau Ako no es buena en combate. Esta opción puede añadirle un rasgo negativo a Ako. Sin embargo, si tiene éxito, obtendrá una recompensa mayor que Mine e Ichika.§!"
 trinity_events_nagisa_diplomacy.27.t: "¿Una gran duquesa de Red Winter?"
 trinity_events_nagisa_diplomacy.27.desc: "Tras ocupar la Federación Académica de Red Winter, la Host Nagisa obtuvo información local sumamente sorprendente. Se trata de la historia del Reino de Invierno, un antiguo país conquistado por Red Winter y desaparecido.\n\nEl pueblo de Red Winter aún recuerda a la familia Miyoshi, ahora venida a menos, pero con una historia hermosa y triste.\n\nExiste una joven noble caída llamada Miyoshi Takane. Se dice que es la heredera legítima del derecho sucesorio de la familia Miyoshi, que gobernaba el 'Reino de Invierno' conquistado por Red Winter, y por tanto la gran duquesa legítima. Sus padres y hermanas fueron purgados por revolucionarios, pero según se cuenta, Takane fue la única que sobrevivió bajo el dominio de Red Winter.\n\nComo la hija menor de la familia Miyoshi, que había liderado el Reino de Invierno, pudo sobrevivir ocultando su identidad con la ayuda de un leal asistente. Takane ha conservado con cariño un diario llamado 'OAMT' con las iniciales de sus hermanas, esperando el día en que pueda restaurar su linaje.\n\nQue en una academia 'revolucionaria' como Red Winter aún permaneciera una aristócrata de linaje tan noble es una historia tan sorprendente como conmovedora. La facción Filius está de acuerdo en reconocer el título que pertenecía a la casa Miyoshi, para que ella pueda ser llamada formalmente 'Gran Duquesa del Reino de Invierno'. Sin embargo, la propia Nagisa quiere ir más allá. La única superviviente de la 'sangre azul' de Red Winter. Si la aceptamos formalmente dentro de la facción Filius, ¿no podría convertirse en un formidable activo político?"
 trinity_events_nagisa_diplomacy.27.a: "Reconocemos únicamente el título de gran duquesa."
 trinity_events_nagisa_diplomacy.27.b: "Discutamos formalmente la incorporación de Takane como ejecutiva del Tea Party."
 trinity_events_nagisa_diplomacy_hidden_start_tt: "§gSe añadirá un enfoque oculto sobre incorporar a Takane como ejecutiva del Tea Party de Trinity.§!"
 trinity_events_nagisa_diplomacy.28.t: "La falsa Anastasia"
 trinity_events_nagisa_diplomacy.28.desc: "\"¿Cómo terminó todo así...?\"\n\nTakane, desconcertada por un giro que ni ella misma esperaba, acarició en silencio con la punta de los dedos el uniforme de ejecutiva del Tea Party que le habían entregado. Era tan suave y hermoso que ni siquiera podía compararse con la ropa que usaba en Red Winter.\n\nTakane es la heredera del Reino de Invierno y su gran duquesa. Eso es mentira. Desde el principio no podía ser verdad. ¿Qué clase de academia es Red Winter, para empezar? Los rumores sobre ella eran todos falsos, salvo una cosa: las iniciales de los nombres de sus hermanas, 'OAMT'. No existía ningún país llamado Reino de Invierno, y Takane jamás había sido una noble. Pero, ¿qué podía hacer ahora con esa historia?\n\n\"...Haa. Por ahora, no me descubrieron. Con que no me descubran, basta.\"\n\nTakane se persignó en voz baja y soltó un suspiro profundo. Ya no se verá envuelta en cosas más terribles que esto. Seguro que no."
 trinity_events_nagisa_diplomacy.28.a: "¿Cómo podría enredarse aún más esto?"
 trinity_events_nagisa_diplomacy.29.t: "[FROM.GetName] solicita permiso de entrada para misioneros"
 trinity_events_nagisa_diplomacy.29.desc: "[FROM.GetNameDef] es ferviente en difundir su fe y sus escrituras entre otras naciones, y el bando de [FROM.GetLeader] desea que [ROOT.GetName], su aliado militar, también acepte su credo. [FROM.GetLeader] parece considerar que una \"alianza bajo una fe devota\" fortalecerá aún más la relación entre ellas y nosotros. Quieren enviar misioneros a las ciudades de nuestro país, y han prometido que solo los enviarán cuando nuestro gobierno lo apruebe, para evitar disputas diplomáticas. ¿Debemos aceptarlos?"
 trinity_events_nagisa_diplomacy.29.a: "Por una alianza más profunda, lo permitimos."
 trinity_events_nagisa_diplomacy.29.b: "No, no necesitamos su fe."
 trinity_events_nagisa_diplomacy.31.desc: "Tras la negociación del organismo de seguridad conjunta, el bando de [TRM.GetLeader] propuso formalmente al bando de [GEH.GetLeader] una 'renegociación del Tratado de Edén'. Se trata de negociaciones que implican un pacto de no agresión y la apertura industrial mutua entre el gobierno de [TRM.GetNameDef] y el de [GEH.GetNameDef]. Antes, solo se intercambiaban conversaciones verbales sobre el establecimiento de la organización del Tratado de Edén, pero debido a la presión política interna en Trinity, parece que la negociación se ha reajustado a favor de Trinity. Si aceptamos, seguirán reuniones técnicas para revisar los detalles."
 trinity_events_nagisa_diplomacy.31.b: "No, esto nos perjudica demasiado."
 trinity_events_nagisa_diplomacy.32.desc: "Al aceptar el bando de [GEH.GetLeader] nuestra propuesta de negociación, han comenzado las negociaciones técnicas para concretar el Tratado de Edén. El Pandemonium Society hará todo lo posible por sabotearlas, y la presión de la facción Pater infiltrada entre nuestros técnicos y la facción antiacuerdo dentro de la Prefect Team será una nueva amenaza. Quizá ya hayamos cedido mucho, pero la única persona capaz de mantener el equilibrio entre Gehenna y la facción Pater y traer estabilidad a la academia no es otra que [ROOT.GetLeader]."
 trinity_events_nagisa_diplomacy.33.desc: "El servicio de inteligencia de [ROOT.GetName] ha detectado movimientos para reimpulsar el Tratado de Edén entre Trinity y la Prefect Team de Gehenna. Los técnicos ya han comenzado a negociar y están organizando las cláusulas detalladas para un pacto de no agresión entre ambas academias.\n\nSi el Tratado de Edén se firma de verdad, tendremos que resistir los productos de Trinity que entrarían a través de la Prefect Team, y en un futuro conflicto entre ambos países, la Prefect Team no podrá realizar acciones militares contra Trinity. Eso sería poco menos que un desastre para nuestra seguridad. Debemos impedir estas negociaciones usando a nuestros agentes, pagando cualquier precio. ¡Cueste lo que cueste!"
 trinity_events_nagisa_diplomacy.33.a: "Te mostraré cómo termina el Edén"
 trinity_events_nagisa_diplomacy.34.desc: "¿Quién fue el culpable? Podría haber sido la codicia de la facción Pater o de los técnicos de Trinity. O quizá haya sido un alboroto provocado por agentes del Pandemonium Society. Nuestras negociaciones avanzaban con una lentitud extraña. Mientras viajábamos de un lado al otro entre ambas academias, seguían propagándose noticias falsas que se difamaban mutuamente, y el público general de Gehenna y Trinity continuó protestando para sabotear el tratado de paz.\n\nAl final, el Tratado de Edén quedó oficialmente suspendido tras un incidente sin precedentes: la explosión de una bomba improvisada en el lugar de negociación. La cúpula de Trinity y de la Prefect Team de Gehenna sabía que el autor del atentado no era el otro bando, pero como se volvió a poner en el foco público el conjunto de privilegios comerciales que Trinity exigió durante la negociación, la opinión pública se deterioró rápidamente, y parece que ambos países no podrán reconciliarse por lo menos durante una generación."
 trinity_events_nagisa_diplomacy.34.a: "...Ya veo."
 trinity_events_nagisa_diplomacy.37.desc: "¿Hubo algún problema en la amistad entre [GEH.GetLeader] y nosotros? De forma sorprendente y chocante, el bando de [GEH.GetLeader] ha rechazado ampliar el Tratado de Edén más allá del simple intercambio de organizaciones policiales de seguridad. Dado que este tratado se basaba en la amistad y la buena voluntad entre los líderes de ambas academias, ahora que esa buena fe se ha quebrado, no existe ningún método para reanudar las negociaciones."
 trinity_events_nagisa_diplomacy.38.desc: "Hoy es un gran día tanto para [GEH.GetName] como para [TRM.GetName]. El Tratado de Edén, legado del anterior presidente del consejo estudiantil, ha dado frutos y ha sido firmado oficialmente por ambos líderes, por lo que ambas academias han decidido una paz permanente entre sí y guardar silencio ante un posible choque entre nosotros y [GEM.GetName]. A pesar de la larga rivalidad entre Gehenna y Trinity, sus líderes racionales parecen haber encontrado la mejor manera de mantener con flexibilidad la estabilidad actual.\n\nPor supuesto, esta noticia será negativa para el bando de [GEM.GetLeader]. El gobierno de [GEM.GetName] ha perdido ahora a su mayor aliado en el plan de defensa contra Trinity, y el sueño de [GEM.GetLeader] de una 'unificación de Gehenna' parece que se verá frustrado durante un largo periodo."

 # evento de elecciones de Nagisa
 trinity_events_nagisa_election.1.t: "Cónclave del año [GetYear]"
 trinity_events_nagisa_election.1.desc.phase_1: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nSe celebraron las elecciones para escoger a la nueva Host que liderará Trinity. Según la larga tradición, esta elección no se realizó por sufragio universal, sino de forma estrictamente cerrada por los ejecutivos del Tea Party. Tras una votación prolongada, [ROOT.GetLeader] fue reelegida cómodamente como Host y desempeñará el cargo durante los próximos 3 años. Las facciones opositoras afirman que estas elecciones fueron manipuladas, pero no son más que gritos vacíos." # base
 trinity_events_nagisa_election.1.desc.phase_2: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nSe celebraron las elecciones para escoger a la nueva Host que liderará Trinity. Según la larga tradición, esta elección no se realizó por sufragio universal, sino de forma estrictamente cerrada por los ejecutivos del Tea Party. Tras la unificación de Gehenna por parte de [ROOT.GetNameDef], la facción Filius obtuvo un mayor apoyo interno gracias a esa hazaña. Tras una votación prolongada, [ROOT.GetLeader] fue reelegida cómodamente como Host y desempeñará el cargo durante los próximos 3 años."
 trinity_events_nagisa_election.1.a: "¡La ganadora es [ROOT.GetLeader]!"
 trinity_events_nagisa_election.2.t: "Cónclave del año [GetYear]"
 trinity_events_nagisa_election.2.desc: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nTrinity no es un país de democracia representativa, y la elección de la Host se decide mediante una votación entre un pequeño grupo oligárquico de ejecutivos. Esta elección, la primera celebrada tras la promulgación de la Constitución de Nagisa, se definió en un duelo directo: una representante de la facción Filius contra la representante de la facción Pater, Misono Mika. Kirifuji Nagisa ordenó a todas las ejecutivas de la facción Filius, así como a las facciones de coalición que cooperan con Filius, apoyar a una candidata en específico. Debido al fuerte control que Nagisa ejerce dentro de Filius, se considera que la candidata respaldada por Nagisa tiene la mayor probabilidad de ganar esta elección de Host.\n\nParece que Misono Mika no tiene demasiadas ganas de ganar esta elección de Host. Quizá los acontecimientos recientes, incluida la vuelta de Seia, hayan reducido la ambición de poder de Mika. Sea como sea, la secretaria ya contó todos los votos, y ahora anunciará el nombre de la ganadora que obtuvo la mayoría absoluta."
 trinity_events_nagisa_election.2.nagisa: "Kirifuji Nagisa siempre gana."
 trinity_events_nagisa_election_nagisa_tt: "§g\"Nagisa... ¿de verdad, incluso después de pasar por todo esto?\"§!"
 trinity_events_nagisa_election.2.hifumi: "Ajitani Hifumi sucede a Nagisa."
 trinity_events_nagisa_election.2.seia: "Yurizono Seia recuperará su lugar."
 trinity_events_nagisa_election.2.mine: "Aomori Mine logró el cambio de gobierno."
 trinity_events_nagisa_election.2.ako: "Amau Ako se encargará del futuro de Trinity."
 trinity_events_nagisa_election.2.atsuko: "Hakari Atsuko fue elegida por Nagisa."
 trinity_events_nagisa_election.2.takane: "La gran duquesa Miyoshi Takane liderará el Tea Party."

 # misión de Misono
 trinity_events_nagisa_misono_mission.00.a: "\"[GetNameMisonoMissionDemandOptions]\""
 trinity_events_nagisa_misono_mission_demand_event_option_1: "Filius debe responder."
 trinity_events_nagisa_misono_mission_demand_event_option_2: "Debemos responder a esa conspiración de Pater."
 trinity_events_nagisa_misono_mission_demand_event_option_3: "El Señor nos guiará por el camino correcto."
 trinity_events_nagisa_misono_mission_demand_event_option_4: "¿Este es el nuevo plan de Mika? Está bien."
 trinity_events_nagisa_misono_mission_demand_event_option_5: "Bien. Convirtamos esta crisis en una oportunidad para reformar nuestra alma mater."
 trinity_events_nagisa_misono_mission_demand_event_option_6: "Filius... no. Yo estoy lista."
 trinity_events_nagisa_misono_mission_demand_event_option_7: "Me toca corresponder en persona."
 trinity_events_nagisa_misono_mission_demand_event_option_8: "No responderemos con palabras, sino con resultados."
 trinity_events_nagisa_misono_mission_demand_event_option_9: "Mika solo está haciendo berrinche."
 trinity_events_nagisa_misono_mission_demand_event_option_10: "Los caprichos de Pater... francamente, a estas alturas ya cansan."

 trinity_events_nagisa_misono_mission_events.00.b: "\"[GetNameMisonoMissionFailureOptions]\""
 trinity_events_nagisa_misono_mission_failure_event_option_1: "Este resultado fue un error de juicio de mi parte."
 trinity_events_nagisa_misono_mission_failure_event_option_2: "Qué vergüenza... de verdad."
 trinity_events_nagisa_misono_mission_failure_event_option_3: "Mika encontró mi punto débil."
 trinity_events_nagisa_misono_mission_failure_event_option_4: "Que yo le abriera el camino a Pater..."
 trinity_events_nagisa_misono_mission_failure_event_option_5: "Aunque hoy caiga, mañana debo volver a levantarme."
 trinity_events_nagisa_misono_mission_failure_event_option_6: "Esto no significa la derrota definitiva de Filius."
 trinity_events_nagisa_misono_mission_failure_event_option_7: "Puedo equivocarme. Con tal de que no se repita."
 trinity_events_nagisa_misono_mission_failure_event_option_8: "Fue un error que no debí cometer como Host."
 trinity_events_nagisa_misono_misono_mission_failure_event_option_9: "Ya pasó. No queda de otra."
 trinity_events_nagisa_misono_mission_failure_event_option_10: "Mika me está agarrando del tobillo..."

 trinity_events_nagisa_misono_mission.1.t: "Pater impulsa la expansión de la producción armamentística"
 trinity_events_nagisa_misono_mission.1.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, está criticando en la reunión del Tea Party la insuficiente expansión de fábricas militares por parte de [ROOT.GetLeader]. Las ejecutivas militaristas de Pater acusan que la apariencia \"débil\" de Filius llevará a Trinity a la ruina. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.2.t: "Pater desea reformar la ley de conscripción"
 trinity_events_nagisa_misono_mission.2.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, se burla de que la facción Filius no está nada preparada para la guerra. En un discurso público, $TRN_Misono_Mika$ criticó por qué Trinity no amplía el sistema de conscripción para aumentar el ejército. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.3.t: "Pater exige camiones de apoyo"
 trinity_events_nagisa_misono_mission.3.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, afirma que se necesitan más camiones militares en nuestro depósito de suministros. Más vehículos, empezando por la logística, también garantizarían una mayor movilidad del ejército de Trinity. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.4.t: "Pater exige producción de tanques"
 trinity_events_nagisa_misono_mission.4.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, afirma que se necesitan más tanques en nuestro depósito de suministros. Hasta Gehenna tiene un tanque emblemático como el 'Toramaru', ¿y Trinity qué tiene? ¿Roll cake? Con un tono sumamente duro, $TRN_Misono_Mika$ advierte que, si Trinity no cuenta con suficientes reservas de tanques, llegará el día en que ni siquiera podrán comerse ese roll cake. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.5.t: "Pater exige producción de artillería"
 trinity_events_nagisa_misono_mission.5.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, afirma que se necesita más artillería de campaña en nuestro depósito de suministros. Para reforzar la defensa nacional de Trinity se requieren divisiones de artillería, y Pater advierte que no las hemos equipado correctamente. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.6.t: "Pater impulsa el aumento de la producción de astilleros"
 trinity_events_nagisa_misono_mission.6.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, está criticando en la reunión del Tea Party la insuficiente expansión de astilleros por parte de [ROOT.GetLeader]. Las ejecutivas militaristas de Pater acusan que la apariencia \"débil\" de Filius llevará a Trinity a la ruina. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.7.t: "Pater exige un plan de reservas de combustible"
 trinity_events_nagisa_misono_mission.7.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, señaló que actualmente las máquinas de guerra de Trinity no están bien preparadas, y que la causa es la falta de combustible. Los vehículos y armamentos de Trinity no pueden operar sin combustible suficiente, y Pater exige completar esa \"cantidad suficiente de combustible\" en el menor plazo posible. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.8.t: "Pater impulsa la expansión de la base industrial nacional"
 trinity_events_nagisa_misono_mission.8.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, acusa que la expansión de fábricas civiles en Trinity no se está llevando a cabo correctamente y, por ello, la economía de Trinity no está desarrollándose como debería. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.9.t: "Pater exige producción para la fuerza aérea"
 trinity_events_nagisa_misono_mission.9.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, afirma que se necesitan más aeronaves en nuestro depósito de suministros. El arma más importante de la guerra moderna es la fuerza aérea y, según Pater, el ejército de Trinity todavía no ha asegurado reservas suficientes para su fuerza aérea. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.10.t: "Pater exige producción de telares místicos"
 trinity_events_nagisa_misono_mission.10.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, afirma que se necesitan más telares místicos en nuestro depósito de suministros. Pater sostiene que, para que Trinity no muestre debilidad en el enfrentamiento militar con los estados humanos tras la Gran Transición, debe contar con un inventario de telares místicos en cantidades más que suficientes. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.11.t: "Pater exige nombrar a un Jefe del Estado Mayor"
 trinity_events_nagisa_misono_mission.11.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, critica que el cargo de Jefe del Estado Mayor del Ejército de Trinity esté vacante. Es cierto que antes de la Gran Transición Trinity no tenía un cargo separado de jefe del estado mayor, pero el bando de $TRN_Misono_Mika$ nos acusa de que mantenerlo vacío incluso después de la Gran Transición es resultado de que [ROOT.GetLeader] no ha prestado suficiente atención a la defensa en comparación con los países vecinos. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.12.t: "Pater exige nombrar a un Jefe del Estado Mayor"
 trinity_events_nagisa_misono_mission.12.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, critica que el cargo de Jefe del Estado Mayor de la Marina de Trinity esté vacante. Es cierto que antes de la Gran Transición Trinity no tenía un cargo separado de jefe del estado mayor, pero el bando de $TRN_Misono_Mika$ nos acusa de que mantenerlo vacío incluso después de la Gran Transición es resultado de que [ROOT.GetLeader] no ha prestado suficiente atención a la defensa en comparación con los países vecinos. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.13.t: "Pater exige nombrar a un Jefe del Estado Mayor"
 trinity_events_nagisa_misono_mission.13.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, critica que el cargo de Jefe del Estado Mayor de la Fuerza Aérea de Trinity esté vacante. Es cierto que antes de la Gran Transición Trinity no tenía un cargo separado de jefe del estado mayor, pero el bando de $TRN_Misono_Mika$ nos acusa de que mantenerlo vacío incluso después de la Gran Transición es resultado de que [ROOT.GetLeader] no ha prestado suficiente atención a la defensa en comparación con los países vecinos. Las facciones internas de Trinity esperan nuestra respuesta. Podrán ejercer paciencia hasta cierto punto, pero no esperarán para siempre."
 trinity_events_nagisa_misono_mission.14.t: "La facción Pater no exige nada"
 trinity_events_nagisa_misono_mission.14.desc: "La facción Pater, liderada por $TRN_Misono_Mika$, está atravesando un caos interno debido a la personalidad impulsiva y emocional de $TRN_Misono_Mika$. Están demasiado divididas como para unirse y atacar a la facción Filius y a la Host [ROOT.GetLeader]. Gracias a ello, por el momento parece difícil que la facción Pater nos lance ataques políticos."
 trinity_events_nagisa_misono_mission.14.a: "Al menos este mes no pasará nada."
 trinity_events_nagisa_misono_mission_14_a_tt: "§gEste mes, la facción Pater no hará nada.§!"

 trinity_events_nagisa_misono_mission.100.t: "[ROOT.GetLeader] pierde influencia política"
 trinity_events_nagisa_misono_mission.100.desc: "Intentamos responder a las demandas groseras de la facción Pater, pero al final fracasamos en cumplir el objetivo. Varias facciones dudan del liderazgo de Filius, y este es un grave error de nuestro gobierno."

 ## 장군 영입 고유 미션 trinity_events_nagisa_misono_mission.110.t: "Pater intenta reclutar al bando de $TRN_Urawa_Hanako$"
 trinity_events_nagisa_misono_mission.110.desc: "La facción Pater sigue intentando reclutar nuevos talentos. El acercamiento hacia $TRN_Urawa_Hanako$ puede considerarse una maniobra política representativa que revela la ambición de Pater. Actualmente, la facción Pater está contactando por separado al bando de $TRN_Urawa_Hanako$, intentando atraer a Hanako a su facción para hacerla antagonizar a Filius.\n\nSi no actuamos, ellas actuarán primero."
 trinity_events_nagisa_misono_mission.111.t: "$TRN_Urawa_Hanako$ se une a la facción Pater"
 trinity_events_nagisa_misono_mission.111.desc: "Nuestro plan de incorporar a Hanako a la facción Filius tuvo el peor de los resultados. Burlándose de toda Trinity como un \"nido de víboras\", Hanako dijo que nuestra maniobra política para integrarla a Filius era despreciable. El bando de $TRN_Urawa_Hanako$ afirmó que, debido a nuestros esfuerzos, comprendió aún mejor cuánta hipocresía envuelve a Trinity en este momento, y proclamó que se unirá a la facción Pater."
 trinity_events_nagisa_misono_mission.111.a: "Es absurdo."
 trinity_events_nagisa_misono_mission.112.t: "$TRN_Urawa_Hanako$ se une a la Sisterhood"
 trinity_events_nagisa_misono_mission.112.desc: "El plan de la facción Pater para incorporar a Hanako a Pater tuvo el peor de los resultados. Burlándose de toda Trinity como un \"nido de víboras\", Hanako dijo que la maniobra política de $TRN_Misono_Mika$ para integrarla a la facción Pater era despreciable. El bando de $TRN_Urawa_Hanako$ declaró que no se verá arrastrado por el lado \"nido de víboras\" de Trinity, y decidió afiliarse a la Sisterhood."
 trinity_events_nagisa_misono_mission.112.a: "¿O sea que la respuesta era no hacer nada?"

 trinity_events_nagisa_misono_mission.120.t: "Pater intenta reclutar al bando de [GetMisonoMissionRandomCharacter]"
 trinity_events_nagisa_misono_mission.120.desc: "La facción Pater sigue intentando reclutar nuevos talentos. El acercamiento hacia [GetMisonoMissionRandomCharacter] puede considerarse una maniobra política representativa que revela la ambición de Pater. Actualmente, la facción Pater está contactando por separado al bando de [GetMisonoMissionRandomCharacter] y les está presentando diversas condiciones para convertirlo en miembro de la facción Pater. ¿Deberíamos nosotros también acercarnos al bando de [GetMisonoMissionRandomCharacter]?"
 trinity_events_nagisa_misono_mission.121.t: "[GetMisonoMissionRandomCharacter] se une a la facción Pater"
 trinity_events_nagisa_misono_mission.121.desc: "El bando de [GetMisonoMissionRandomCharacter] sucumbió a la tentación de la facción Pater y de su líder, $TRN_Misono_Mika$. Ahora se enfrentará a nosotras como enemiga de la facción Filius."
 trinity_events_nagisa_misono_mission.122.t: "[GetMisonoMissionRandomCharacter] se une a la facción Filius"
 trinity_events_nagisa_misono_mission.122.desc: "Gracias a que nos acercamos al bando de [GetMisonoMissionRandomCharacter] con condiciones mejores que las de la facción Pater, el bando de [GetMisonoMissionRandomCharacter] juró lealtad no a Pater, sino a la facción Filius y a Nagisa."

 trinity_news_events.1.t: "Atentado contra Yurizono Seia"
 trinity_news_events.1.desc: "Yurizono Seia, líder de la facción Sanctus, recibió disparos de un agresor durante su discurso de investidura y cayó en estado de inconsciencia. El atacante fue sometido de inmediato en el lugar, y Seia está siendo trasladada al hospital bajo estricta seguridad.\n\nTras el incidente, el Tea Party fue convocado de urgencia para discutir la elección de la próxima Host, y se especula que hay una alta probabilidad de que Misono Mika, de la facción Pater, sea designada como la próxima Host.\n\nLos acontecimientos de los últimos dos meses han vuelto extremadamente inestable la situación política interna de Trinity, y este incidente parece ser el resultado de la explosión de esa inestabilidad. A medida que el conflicto interno dentro de la facción Sanctus se intensifica, se prevé que el caos político de Trinity se agrave aún más."
 trinity_news_events.1.a: "¡Dios mío!"
 trinity_news_events.1.b: "¡Qué barbarie!"
 trinity_news_events.1.c: "Parece que están sumidos en el caos."
 trinity_news_events.2.t: "Misono Mika toma el control de Trinity"
 trinity_news_events.2.desc: "La confusión política en la Escuela General Trinity, encendida a partir del brutal atentado contra Yurizono Seia, se apaciguó cuando Misono Mika asumió el cargo de Host. En cuanto aseguró la autoridad de la Host, impulsó una serie de reformas radicales y, finalmente, aprobó una legislación que legitimó su gobierno y garantizó un dominio permanente, proclamando así el fin del sistema triunviral del Tea Party.\n\nSin embargo, en las demás academias de Kivotos es difícil encontrar un ambiente de celebración. En particular, debido a los constantes comentarios anti-Gehenna de Misono Mika, Gehenna está mostrando una respuesta extremadamente contenida."
 trinity_news_events.2.a: "¡Se alza una nueva Trinity!"
 trinity_news_events.2.b: "El orden de Kivotos se verá sacudido..."
 trinity_news_events.2.c: "¿Y esto qué significa para nosotros?"
 trinity_news_events.2.d: "Vaya giro."
 TRN_trinity_order_state_threat_name: "Golpe de Estado de Misono Mika"
 trinity_news_events.3.t: "Concierto idol celebrado en Trinity"
 trinity_news_events.3.desc: "Hoy se celebró con gran éxito el \"Concierto Idol\", el evento más esperado dentro del Festival anual de Trinity. Sin embargo, el escenario de este año fue más especial que nunca: ante el público apareció un nuevo grupo llamado \"Antique Seraphim\". Está conformado por Aomori Mine, líder de la Orden de Socorro; Utazumi Sakurako, la Madre Superiora de la Sisterhood; e Iochi Mari, miembro de la Sisterhood.\n\nEn sus inicios, el grupo enfrentó diversos problemas y crisis políticas, pero Iochi Mari tomó la iniciativa para resolverlos y, al final, el show concluyó con éxito. Las estudiantes de Trinity recibieron su presentación con vítores entusiastas, y junto a un escenario deslumbrante, el evento idol bajó el telón de forma grandiosa."
 trinity_news_events.3.a: "¡Pásame una foto también!"
 trinity_news_events.4.t: "Formación del Pacto de Edén"
 trinity_news_events.4.desc: "Tras consolidar el poder, Misono Mika proclamó el \"Pacto de Edén\" con la intención de llevar a Trinity de nuevo al centro del escenario mundial y recuperar su hegemonía. Este acuerdo, concebido como una alianza militar para contrarrestar a la Liga de Kivotos, significa que Trinity ha contenido su caos político y ha vuelto a exhibir ambiciones hegemonistas.\n\nLos diplomáticos de Trinity presentan el Pacto de Edén como un tratado de cooperación mutua, pero en la práctica se interpreta como una medida estratégica para recuperar y expandir su esfera de influencia, debilitada tras la Gran Transición. Si se consideran los recientes movimientos expansionistas de Trinity, la intención de restaurar por la fuerza el vasto dominio anterior al desastre se vuelve cada vez más evidente."
 trinity_news_events.4.a: "¡Nos haremos aún más fuertes!"
 trinity_news_events.4.b: "Es una nueva amenaza."
 trinity_news_events.4.c: "¡Los aplastaremos!"
 trinity_news_events.4.d: "¿El ascenso de una nueva hegemonía?"
 trinity_news_events.5.t: "Invasión de Gehenna por parte de Trinity"
 trinity_news_events.5.desc: "Durante cientos de años, Trinity y Gehenna mantuvieron una paz superficial, pero nunca hubo una reconciliación verdadera. Trinity jamás olvidó lo que Gehenna hizo en el pasado, y ese odio y ansia de venganza se profundizaron con el paso del tiempo. Tras la Gran Transición, cuando Misono Mika tomó el poder, las preocupaciones de los escépticos se volvieron realidad.\n\nDespués de años de expansión del revanchismo y acumulación de armamento, Misono Mika declaró oficialmente el estado de guerra y envió al ejército de Trinity al frente. En respuesta, las fuerzas acorazadas de Gehenna salieron al contraataque, pero el avance no será sencillo debido al bombardeo de Trinity."
 trinity_news_events.5.a: "¡Castiguen a los demonios!"
 trinity_news_events.5.b: "Esta guerra ha proyectado una sombra sobre Kivotos..."
 trinity_news_events.5.c: "¡Que toda anti-Gehenna se una!"
 trinity_news_events.5.d: "Déjenlas pelear..."
 trinity_news_events.6.t: "Levantamiento alemán en Trinity"
 trinity_news_events.6.desc: "Esta tarde, un levantamiento alemán iniciado por cerca de diez mil manifestantes que inundaron las calles del Distrito Central de Trinity se está extendiendo por toda Trinity. Muchos alemanes marchan gritando \"Deutschland, Deutschland über alles\", y en muros y puentes han quedado pintadas con eslóganes de la NSDAP y símbolos de esvástica. Quienes se oponen al dominio de Trinity continúan resistiendo mediante huelgas y manifestaciones.\n\nA pesar de las protestas generalizadas y la inestabilidad, el Tea Party emitió directamente la orden de represión a la División de Realización de la Justicia, por lo que se espera que el levantamiento sea sofocado con rapidez."
 trinity_news_events.6.a: "¡Reprímanlos a todos!"
 trinity_news_events.6.b: "¿El fin de la Trinidad?"
 trinity_news_events.6.c: "Si se dividen..."
 trinity_news_events.6.d: "¿Será este su final?"
 trinity_news_events.7.t: "Kirifuji Nagisa toma el control de Trinity"
 trinity_news_events.7.desc: "La confusión política de la Escuela General Trinity, encendida a partir del brutal atentado contra Yurizono Seia, se apaciguó cuando Kirifuji Nagisa asumió el cargo de Host. Nagisa declaró su voluntad de preservar la armonía entre la facción Filius y las demás facciones.\n\nSin embargo, el gobierno de Nagisa todavía no es completamente estable. La facción Pater, liderada por Misono Mika, continúa oponiéndose al gobierno, y el control político de Filius no es absoluto.\n\nTras consolidar el poder, Nagisa parece centrarse en la estabilidad interna y, en el exterior, continuar impulsando el Tratado de Edén con Gehenna."
 trinity_news_events.7.a: "No habrá una \"segunda Trinity\"."
 trinity_news_events.7.b: "Trinity encontró una alternativa racional."
 trinity_news_events.7.c: "No es un mal rival."
 trinity_news_events.7.d: "¡Vaya que tienen muchas facciones!"
 trinity_news_events.8.t: "Éxito del Tratado de Edén"
 trinity_news_events.8.desc: "El Tratado de Edén, símbolo de la amistad y la paz entre Trinity y Gehenna, se ha venido impulsando desde antes de la Gran Transición bajo la mediación de la Presidenta del Consejo Estudiantil General. Aunque en el caos posterior a la Gran Transición su avance se detuvo por un tiempo, gracias a los esfuerzos de [TRM.Getleader] y [GEH.GetLeader], el tratado pudo retomarse.\n\nEn esta ocasión, el Tratado de Edén es una alianza militar entre el bando [TRM.GetAdjective] y el bando [GEH.GetAdjective]. Ambas academias prometieron responder juntas a los enemigos externos bajo la alianza defensiva llamada \"ETO\". Tras la declaración conjunta de ambos líderes, el bando [GEM.GetName] sostuvo que el bando [GEH.GetName] no está calificado para representar a Gehenna y declaró que el Tratado de Edén es \"totalmente ilegal\"."
 trinity_news_events.8.desc.alt: "El Tratado de Edén, símbolo de la amistad y la paz entre Trinity y Gehenna, se ha venido impulsando desde antes de la Gran Transición bajo la mediación de la Presidenta del Consejo Estudiantil General. Aunque en el caos posterior a la Gran Transición su avance se detuvo por un tiempo, gracias a los esfuerzos de [TRM.Getleader] y [GEH.GetLeader], el tratado pudo retomarse.\n\nOriginalmente, el Tratado de Edén que se discutía antes de la Gran Transición era una alianza militar llamada \"ETO\", pero debido a la oposición interna dentro de Trinity, el acuerdo real concluyó como un pacto de no agresión y de intercambio económico entre el bando [TRM.GetAdjective] y el bando [GEH.GetAdjective]. Tras la declaración conjunta de ambos líderes, el bando [GEM.GetName] sostuvo que el bando [GEH.GetName] no está calificado para representar a Gehenna y declaró que el Tratado de Edén es \"totalmente ilegal\"."
 trinity_news_events.8.a: "Una sola flecha se quiebra, pero un haz de flechas no."
 trinity_news_events.8.b: "Qué asco..."
 trinity_news_events.8.c: "¡Una noticia realmente sorprendente de Kivotos!"
 trinity_news_events.8.d: "¿O sea que los invasores de otro mundo se aliaron?"
 trinity_news_events.9.t: "Invasión de Gehenna por parte de Trinity"
 trinity_news_events.9.desc: "Kirifuji Nagisa fue una de las Hosts más conciliadoras y pacifistas hacia Gehenna entre las muchas que gobernaron Trinity, pero aun así la confrontación militar entre ambas fuerzas terminó empujándolas al estado de guerra. El bando [TRM.GetName] afirmó que Gehenna estaba reforzando su armamento para invadir Trinity, y que ellos llevarían a cabo una guerra preventiva como respuesta.\n\nEl ejército de Trinity ya cruzó la frontera y los combates han empezado en la zona fronteriza con Gehenna. Con las dos academias, viejas rivales, entrando por fin en guerra, toda Kivotos está observando quién resultará vencedor."
 trinity_news_events.9.a: "Trinity vencerá."
 trinity_news_events.9.b: "¡Que toda anti-Gehenna se una!" # Gehenna (participa en guerra)
 trinity_news_events.9.c: "A Manmajeon le va a tocar sufrir un poco." # División de Disciplina (si no está en guerra)
 trinity_news_events.9.d: "¿Quién ganará?"
 trinity_news_events.10.t: "Fracaso del Tratado de Edén"
 trinity_news_events.10.desc: "El Tratado de Edén, símbolo de la amistad y la paz entre Trinity y Gehenna, se ha venido impulsando desde antes de la Gran Transición bajo la mediación de la Presidenta del Consejo Estudiantil General. Aunque en el caos posterior a la Gran Transición su avance se detuvo por un tiempo, gracias a los esfuerzos de [TRM.Getleader] y [GEH.GetLeader], el tratado pudo retomarse.\n\nSin embargo, el acuerdo de paz entre ambas academias se vio sacudido por protestas constantes de fuerzas opositoras, y finalmente colapsó cuando una bomba artesanal estalló en el lugar de las conversaciones, deteriorando gravemente la opinión pública. Aunque [GEH.GetLeader] y [TRM.GetLeader] dejaron un mensaje esperanzador de que el Tratado de Edén podría discutirse de nuevo en el futuro, con la opinión pública en contra por ahora, no es más que retórica política."
 trinity_news_events.10.a: "Es una tragedia."
 trinity_news_events.10.b: "Qué divertido, de verdad."
 trinity_news_events.10.c: "Fue una conferencia efímera."
 trinity_news_events.10.d: "Los invasores de otro mundo hasta entre ellos se pelean."
 trinity_news_events.11.t: "Establecimiento del Sistema de Edén"
 trinity_news_events.11.desc: "Con el éxito de la unificación de Gehenna bajo el liderazgo de [TRM.GetName], se ha creado una nueva estructura de poder que, en adelante, será conocida como el \"Sistema de Edén\". Kirifuji Nagisa prometió que, así como Trinity se formó mediante la afiliación de una academia federada de tres escuelas —Filius, Pater y Sanctus—, Gehenna también será incorporada como un nuevo miembro que compone a Trinity, y no será tratada como una colonia.\n\nA pesar de la declaración \"misericordiosa\" de posguerra de la Host y del firme establecimiento del Sistema de Edén, la política interna de Trinity sigue siendo incierta. Aún quedan guerrillas leales a Manmajeon, centradas en el Distrito Central de Gehenna, y la noticia de que algunos cuadros de la División de Disciplina se integrarán en Filius en lugar de formar una facción independiente está incomodando a Pater. Pero, pese a todos los factores de incertidumbre, hoy Trinity se erige como vencedora." # sin División de Disciplina
 trinity_news_events.11.desc.alt: "Con el éxito de la invasión de la Pandemonium Society bajo el liderazgo de [TRM.GetName], se ha creado una nueva estructura de poder que, en adelante, será conocida como el \"Sistema de Edén\". Kirifuji Nagisa prometió que, así como Trinity se formó mediante la afiliación de una academia federada de tres escuelas —Filius, Pater y Sanctus—, los territorios ocupados también serán incorporados como miembros de Trinity, y no serán tratados como una colonia.\n\nA pesar de la declaración \"misericordiosa\" de posguerra de la Host y del firme establecimiento del Sistema de Edén, la política interna de Trinity sigue siendo incierta. Aún quedan guerrillas leales a Manmajeon, centradas en el Distrito Central de Gehenna, y las discusiones sobre una unificación pacífica entre el bando [GEH.GetName] y Trinity siguen en fase de proceso. Pero, pese a todos los factores de incertidumbre, hoy Trinity se erige como vencedora." # con División de Disciplina
 trinity_news_events.11.a: "Que nuestra victoria dure para siempre."
 trinity_news_events.11.b: "Habrá que vigilar a Edén."
 trinity_news_events.11.c: "Ha nacido una fuerza problemática..."

