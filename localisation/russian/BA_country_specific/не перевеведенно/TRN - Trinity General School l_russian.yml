 landmark_TRM_trinity_chruch: "Gran Catedral del Concilio"
 landmark_TRM_trinity_chruch_desc: "La 'Gran Catedral del Concilio', lugar donde se celebró el Primer Concilio de Trinidad hace cientos de años, ha conservado su historia a lo largo de incontables eras. Hoy en día, es uno de los destinos turísticos más famosos de todo Kivotos y goza del cariño de innumerables visitantes. Sin embargo, más allá de su espléndida apariencia exterior, el interior de la catedral sigue siendo el pilar espiritual de la Hermandad y un espacio sagrado, desempeñando su papel como centro que sostiene su fe y tradiciones."

 TRM_GATHERING_STORM_DESC: "Originalmente, esta región estaba marcada por enfrentamientos constantes entre innumerables filiales, predecesoras de las academias Pater, Filius y Sanctus, así como de clubes oficiales como Johann y Justina. Desde tiempos remotos, en un concilio ancestral, se tomó la decisión unánime de unificar todas las filiales en una sola academia para poner fin a los conflictos. Todas las filiales, salvo una, aprobaron esta resolución, otorgando a Trinity el honor de convertirse en una de las tres grandes academias de Kivotos.\n\nSin embargo, la situación actual de Trinity es sombría. El evento de gran magnitud conocido como la 'Gran Transición' sacudió por completo a Trinity, que ahora se encuentra aislada en un territorio de otro mundo."

 TRM_guide: "Misono Mika\n\n£white_dot Conviértete en la anfitriona del Tea Party aprovechando una crisis mayor.\n£white_dot Asegura el poder absoluto mediante la purga de rivales políticos.\n£white_dot Vence a los demonios de Gehenna en la guerra.\n£white_dot Domina Kivotos.\n\n\nLa Dama de Hierro Kirifuji Nagisa | §YIncompleto§!\n\n£white_dot Conviértete en la anfitriona del Tea Party aprovechando una crisis mayor.\n£white_dot Frustra el plan de golpe de Estado de Misono Mika.\n£white_dot Apela a los estudiantes y fomenta la unidad.\n£white_dot Firma el Tratado del Edén y sella la paz con enemigos de siglos.\n\n§RAunque el mundo se derrumbe, haz justicia§!\n\n\n\n§YDesarrollo: Kangseul2702§!"
 TRM_country_intro_header: "Academia General Trinity"
 TRM_country_intro_content: "Trinity ha soportado el sufrimiento durante incontables eras. Siglos de odio encadenado desembocaron en matanzas interminables, en las que incluso la justificación de la guerra fue olvidada, obligando a alzar las armas unos contra otros. Un gobierno central inestable colapsaba una y otra vez, repitiendo ciclos de reconstrucción y derrumbe.\n\nSin embargo, en medio de la oscuridad surgieron profetas. Bajo el concepto de la Trinidad, convocaron el Primer Concilio, y las facciones que antes estaban divididas finalmente unieron sus manos. El concilio concluyó con éxito y Trinity se unificó bajo una sola cruz. No obstante, durante el proceso, la facción Arius fue expulsada debido a discrepancias en la interpretación de las escrituras.\n\nTras el concilio, Trinity estableció oficialmente su sistema de liderazgo. Las facciones de mayor influencia —Sanctus, Filius y Pater— asumieron la representación y formaron el 'Tea Party', promulgando la primera constitución. Así se declaró el Año 0 del calendario de Trinity y, bajo el nombre de 'Academia General Trinity', nació una comunidad unificada.\n\nEn los siglos posteriores, la paz prevaleció. El sistema del 'Tea Party' y el 'Host' logró equilibrar ideales y realidad, y los estudiantes de Trinity disfrutaron de una vida estable entre espléndidas arquitecturas y una rica cultura. Este periodo es recordado como la era más libre y llena de esperanza en la historia de Trinity."
 TRM_country_intro_header_1: "Siglos de paz"
 TRM_country_intro_content_1: "Durante siglos de paz, la Academia General Trinity experimentó un desarrollo deslumbrante. Las cicatrices de la guerra se desvanecieron lentamente con el paso del tiempo, y los lazos de división y odio comenzaron a romperse. Las facciones dejaron atrás los conflictos del pasado y, bajo una fe y valores compartidos, se aceptaron mutuamente, acercándose por fin a una verdadera unificación bajo el nombre de la 'Trinidad'.\n\nEsa fe se convirtió en el espíritu mismo de la comunidad de Trinity. Las personas estaban convencidas de que la luz de la Trinidad jamás se extinguiría. Este ideal fue más allá de un simple eslogan utópico, arraigándose profundamente en los principios de vida, las instituciones, la educación y la fe, sosteniendo a la comunidad como un pilar fundamental.\n\nEn esta era de paz, Trinity aseguró el territorio más extenso de su historia, y su capital central, la ciudad milenaria de 'Edén', creció a una velocidad casi milagrosa. Edén dejó de ser una simple ciudad para convertirse en el símbolo al que todo Kivotos aspiraba. Agujas inmaculadas perforaban el cielo, y en sus calles meticulosamente diseñadas fluían los frutos resplandecientes del conocimiento, la cultura y la fe. Allí, innumerables personas reían, lloraban, amaban y vivían.\n\nEdén era considerado un santuario viviente que probaba la gloria de Trinity, el ideal más perfecto que Kivotos podía alcanzar. La academia vivió un renacimiento cultural y artístico, y los estudiantes reflexionaban incansablemente sobre el significado de Dios, el ser humano, la comunidad y el individuo mientras se preparaban para el futuro.\n\nMuchos vivían cada día con gratitud, y solían decir: hoy como ayer, y mañana como hoy—creyendo que esta paz duraría para siempre. Sin embargo, nadie podía garantizar que esa luz resplandeciente permanecería eternamente."
 TRM_country_intro_header_2: "La crisis del Host"
 TRM_country_intro_content_2: "No obstante, esta era de paz llegó a su fin con la aparición de la Academia Gehenna. Expulsada hacia el este por otras academias del oeste, Gehenna emergió como una amenaza directa para Trinity, despertando en su interior ambiciones expansionistas hacia el este. Pronto, la posibilidad de una invasión se volvió realidad, y Gehenna avanzó como un ejército unificado.\n\nLos ángeles resistieron con fiereza y lograron finalmente detener la expansión oriental de Gehenna. Sin embargo, los combates dejaron una devastación inimaginable. Las acciones que los estudiantes de Gehenna realizaban como si fueran simples travesuras resultaron ser actos terroríficos para los estudiantes de Trinity, quienes solo conocían la paz. Como consecuencia, se extendió un fuerte sentimiento anti-Gehenna dentro de Trinity.\n\nTras la guerra, ambas partes firmaron un pacto de no agresión, pero el descontento persistió dentro de Trinity. En particular, la llamada 'crisis del Host', liderada por la facción Pater, estuvo a punto de destruir los valores de unidad de Trinity. En aquel entonces, el líder radical de Pater asumió el cargo de Host conforme a la ley de Trinity, y durante la primera mitad de su mandato no surgieron grandes problemas.\n\nSin embargo, cuando las provocaciones de Gehenna en la frontera se intensificaron a mitad de su mandato, Trinity intentó contener la situación con respuestas moderadas. El Host, no obstante, interpretó estos incidentes como una declaración de guerra y abogó por el conflicto armado, desencadenando así la 'crisis del Host'. Finalmente, el Tea Party aprobó una moción de censura, y el Host aceptó la decisión y dimitió. Este acontecimiento infligió una profunda herida de orgullo a la facción Pater, cuyas secuelas persisten hasta el día de hoy."
 TRM_country_intro_header_3: "El camino hacia la Segunda Trinity"
 TRM_country_intro_content_3: "\"Cruzamos las praderas al galope. Aunque las herraduras se hagan añicos, aunque las crines marchitas queden sepultadas bajo huesos y leyendas, aunque los pies se hinchen hasta estallar, las rodillas se disloquen y las tibias se pulvericen, impidiéndonos siquiera caminar\"\n\nTras la guerra con Gehenna y la posterior crisis del Host, la paz de la Academia General Trinity se vio profundamente sacudida. A partir de entonces, Trinity inició una expansión militar, marcando este periodo como un punto de inflexión que dio inicio a una ola de transformaciones. Con el paso del tiempo, surgieron figuras representativas de cada facción: Yurizono Seia de Sanctus, Kirifuji Nagisa de Filius y Misono Mika de Pater. Reconocidos por su inteligencia y liderazgo, ingresaron en la política entre grandes expectativas y elogios como los líderes de la próxima era dorada de Trinity.\n\nEntonces, en un día aparentemente ordinario, alrededor de la 1 de la tarde, ocurrió un incidente que conmocionó no solo a Trinity, sino a todo Kivotos. Durante unos segundos, una luz cegadora cubrió el mundo, y cuando la visión regresó, Trinity se encontró frente a un mundo desconocido. Aunque evocaba a Kivotos de décadas atrás, no hubo saludo alguno: en su lugar, balas y bombardeos cayeron sobre Trinity.\n\nTrinity declaró de inmediato el estado de emergencia y movilizó a la división de guardia, el Departamento de Justicia y las milicias civiles para defenderse. El enemigo finalmente se retiró, pero la batalla dejó cicatrices profundas. En particular, se documentaron casos de combatientes de la facción Pater atacando a civiles indefensos y maltratando prisioneros, lo que llevó a su procesamiento por tribunales militares y a condenas de prisión. Misono Mika asumió su defensa, pero el tribunal rechazó sus alegatos.\n\nA partir de entonces, la facción Pater y Misono Mika comenzaron a promover de forma abierta una nueva ideología estatal: la 'Segunda Trinity'. Desde hace tiempo sostenían que la llamada 'era de paz' había sido en realidad un periodo de tiempo desperdiciado, en el que innumerables héroes desaparecieron sin jamás brillar. A pesar de las acusaciones de militarismo, nacionalismo y culto a la violencia dirigidas a algunos altos mandos veteranos, la facción Pater mantiene la convicción de que ellos son quienes realmente aman a Trinity y de que poseen una voluntad especial destinada, en última instancia, a cambiar el curso de la historia mundial."
 TRM_country_intro_header_4: "¿El Tratado del Edén?"
 TRM_country_intro_content_4: "El Tratado del Edén es un acuerdo de paz entre Trinity y Gehenna, respaldado por la mayoría de la facción Filius, liderada por Kirifuji Nagisa. Kirifuji Nagisa y Filius sostienen que, al igual que en el pasado, Trinity puede romper la cadena del odio y dar la bienvenida una vez más a una era de paz y prosperidad. El tratado incluye cláusulas para la creación de una fuerza de mantenimiento de la paz compuesta por estudiantes de ambas academias, encargada de preservar el orden conjunto.\n\nAunque en apariencia ambas partes lo evalúan positivamente, las corrientes internas cuentan otra historia. El consejo estudiantil de Gehenna, el Pandemonium Society (Manmaden), muestra una actitud sospechosa hacia el tratado, mientras que Misono Mika y la facción Pater lo critican por considerarlo excesivamente idealista e inviable. De hecho, durante las conversaciones mediadas por el Consejo Estudiantil General, la actitud descortés del lado de Gehenna provocó un fuerte resentimiento en el Tea Party.\n\nAun así, Kirifuji Nagisa y la facción Filius consideraron que estos problemas podían tolerarse en cierta medida y se centraron en calmar al indignado Tea Party. Las probabilidades de éxito del Tratado del Edén siguen siendo bajas, pero si llegara a concretarse, Trinity podría quizá restaurar una vez más la gloriosa era de paz del pasado."
