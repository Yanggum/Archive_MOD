 TRN_geographical_renaming_decision_desc: "Como parte del proceso de des-germanización, los topónimos escritos en alemán serán abolidos por completo. Los nuevos topónimos, redactados en el idioma propio de Kivotos, irán conquistando poco a poco incluso el mundo mental de los locales alemanes."
