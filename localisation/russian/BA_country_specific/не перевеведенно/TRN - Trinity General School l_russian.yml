 TRN_Mika_honor_loop_decision: "Agenda personal de Misono Mika"
 TRN_Mika_honor_loop_decision_desc: "Aunque parezca obvio, el mandato de la Host Misono Mika ya no está limitado a un año como en el pasado. Mientras lo permita la nueva constitución, puede extenderse indefinidamente. Por ello, Misono Mika provocará innumerables incidentes en el futuro."
 TRN_Mika_honor_loop_decision_tt: "Se §Yactivan§! eventos cotidianos de §Y Misono Mika§!."
 TRN_honor_populist_policies: "Aprobar políticas populistas"
 TRN_honor_populist_policies_desc: "Las palabras idealistas por sí solas no ganan confianza ni apoyo. Se necesita acción. Tomaremos medidas reales para quienes más lo necesitan: subsidios de alimentos básicos para los pobres y apoyo público para que desempleados, veteranos heridos en la Gran Transición y beneficiarios de asistencia social puedan comprar combustible y comida durante el invierno."
 TRN_honor_social_change: "Transformación social"
 TRN_honor_social_change_desc: "El “socialismo de Trinity” se basa en la colaboración de clases y el cooperativismo, buscando la solidaridad social conforme a la doctrina cristiana. Sin embargo, en la realidad aún persisten por todas partes vestigios del antiguo Estado alemán y del viejo régimen que bloquean nuestro camino. Ha llegado el momento de liquidar por completo esas herencias profundamente arraigadas."
 TRN_honor_spread_of_militarism: "Difusión del militarismo"
 TRN_honor_spread_of_militarism_desc: "Para cumplir la gran causa de Trinity debemos consumar la venganza contra Gehenna y, más aún, construir el ejército más poderoso de Kivotos. Para ello, debemos establecer un sistema de educación militar temprana que inculque a la próxima generación la importancia de la defensa nacional y el sentido del deber. Debemos reforzar la conciencia de seguridad en toda la sociedad y prepararnos, unidos, para las amenazas futuras."
 TRN_honor_technocrat: "Fortalecer la tecnocracia"
 TRN_honor_technocrat_desc: "En el fondo, para estudiantes comunes es muy difícil dirigir un Estado. La administración y el gobierno requieren algo más que entusiasmo: hacen falta pensamiento estructurado y lealtad comprobada. Por ello, debemos colocar en todo el gobierno a élites ideológicamente verificadas y altamente leales, elevando la profesionalidad y la eficiencia administrativa."
 TRN_honor_woman_right: "Proteger los derechos de las mujeres"
 TRN_honor_woman_right_desc: "La política 3K, nacida de la arrogancia nazi combinada con el machismo, fue abolida naturalmente con la llegada de Trinity. Sin embargo, el regreso de las mujeres al trabajo y la mejora de su estatus no se han logrado adecuadamente. La Host debe intervenir para resolver este problema cuanto antes."

 TRN_honor_protection_of_the_Jewish_community: "Proteger a la comunidad judía"
 TRN_honor_protection_of_the_Jewish_community_desc: "Los judíos son un pueblo perseguido durante largos años bajo la locura del Estado alemán. Conspiraciones fabricadas como la “teoría de la puñalada por la espalda” se usaron para desintegrar comunidades enteras, y era común que la gente cometiera violencia solo por ser judíos sin recibir castigo adecuado. Ahora, protegerlos será la verdadera “realización de la justicia”."
 TRN_honor_utilize_the_church_authority: "Aprovechar la autoridad de la Sisterhood"
 TRN_honor_utilize_the_church_authority_desc: "La Sisterhood reivindica la legitimidad espiritual de Trinity y ha continuado en la región de [TRM.GetNameDef] con labores de caridad y servicio social. Su dedicación es respetada por muchas estudiantes y ciudadanos. Hay infinitas cosas que podemos hacer aprovechando a la Sisterhood."

 
 
 trinity_honor_events.1.t: "Robo en el pabellón sin personal"
 trinity_honor_events.1.desc: "\"¡Huaaaang, senpai! Otra vez se nos escapó…\"\n\n\"N-no pasa nada, Hanae-chan. Al menos nadie salió herido… creo que es un alivio.\"\n\nSerina la consoló, dándole unas palmadas en la espalda. Últimamente, los robos dirigidos a los pabellones sin personal de Trinity se estaban volviendo frecuentes. Aunque Serina y Hanae se esforzaban desesperadamente por atrapar al culpable, el crimen no mostraba señales de disminuir.\n\n\"¿Mmm~? O sea que… ¿necesitas mi ayuda por los robos, eh~☆?\"\n\nMika murmuraba mientras leía el informe con calma. Desde el incidente, el JTF no dejaba de estar ocupado. Antes ya lo estaba, pero ahora mucho más. Mika, con la barbilla apoyada en la mano, se quedó mirando el informe fijamente. Hablando consigo misma en su mundo interior, no lograba encontrar una solución clara para resolver el problema.\n\n\"Pero los del JTF también deben estar hasta el cuello… ¿no sería un poco feo llamarlos solo por los Caballeros de Socorro~? Además, ellos también dependen directamente del Tea Party y todo eso.\""
 trinity_honor_events.1.a: "\"¿Y si les damos un poquito más de presupuesto a los Caballeros de Socorro para que lo resuelvan por su cuenta?\""
 trinity_honor_events.1.b: "\"Al final, si se lo pedimos a los del JTF, ¿no lo resolverán como sea?\""
 trinity_honor_events.1.c: "\"Pero… seguro que los del JTF también tienen sus propias circunstancias…\""

 trinity_honor_events.2.t: "Problema de uso excesivo de la fuerza del JTF"
 trinity_honor_events.2.desc: "\"¡Kyaaah!\"\n\n\"¡No hagas escándalo! ¡Si sigues resistiéndote, vas a terminar mal!\"\n\n\"Tú solo tienes que quedarte aquí calladito hasta que la academia pague el rescate. ¡Ni se te ocurra tener ideas raras!\"\n\n\"¿Qué? ¿Que ya negociaron con Trinity?\"\n\n\"¿Ah? ¡Claro! Ya se hizo el contacto hace rato.\"\n\n\"¡N-no…! ¡Aléjense! ¡A la esquina!\"\n\n-¡KWAANG!!-\n\n\"Ki-hih… ki-hehehehehehe-!\"\n\n\"¡H-hii…! ¡N-no te acerques! ¡Kyaaa-!\"\n\n\"¿Que quedó aplastado como una lata de refresco~? Wa-o☆ Tsurugi-chan sí que da miedo~\"\n\nIncluso después del incidente, los secuestros dirigidos a estudiantes de Trinity no muestran señales de disminuir. Como siempre, el Tea Party envió a Tsurugi del JTF como negociadora, pero la etiqueta mediática de “uso excesivo de la fuerza” sigue pegada. En especial, cuando la prensa mostró el estado miserable de los secuestradores en este caso, el JTF se enfrentó a fuertes críticas.\n\nAun así, es un alivio que todos los rehenes hayan sido rescatados con vida, pero algunos fueron diagnosticados con PTSD por estrés extremo. Según los Caballeros de Socorro, se necesitan al menos tres semanas de estabilidad."
 trinity_honor_events.2.a: "\"El estilo de Tsurugi-chan es intenso y me gusta~ pero si se vuelve un problema… habrá que corregirlo, ¿no?\""
 trinity_honor_events.2.b: "\"¿Eh~? Son gente mala… ¿de verdad es para tanto armar un escándalo por esto?\""

 trinity_honor_events.3.t: "Tiroteo en la calle de cafés"
 trinity_honor_events.3.desc: "En una reunión regular del Tea Party se presentó un asunto: un tiroteo en la calle de cafés.\n\nHabía una fresa sobre un postre de edición limitada. El Club de Postres de Después de Clases y varias estudiantes apuntaron a esa fresa. Se desató una disputa. Tsurugi del JTF lo reprimió. Hubo heridos. Se consumieron muchos medicamentos y vendas de los Caballeros de Socorro."
 trinity_honor_events.3.a: "Tono de Mika pidiendo el presupuesto"
 trinity_honor_events.3.b: "Tono de Mika sin pedir el presupuesto"

 trinity_honor_events.4.t: "Actividad misionera de la Sisterhood"
 trinity_honor_events.4.desc: "Bla bla bla. Después de contactar a la Sisterhood, las Sisters se ponen activas. Pero el contenido de la misión es raro. Sea como sea, debemos frenarlas. Pero si lo hacemos, ya no podremos mejorar tanto el rasgo de Sakurako. Triste, pero…"
 trinity_honor_events.4.a: "\"¿Actividad misionera? ¿De verdad hace falta bloquear hasta eso?\""
 trinity_honor_events.4.b: "\"No… eso no.\""
 
 TRN_economic_evelopment_department: "Departamento de Desarrollo Económico de la Academia"
 TRN_economic_evelopment_department_desc: "[TRN_eed_cat_desc]"
 TRN_eed_cat_desc_Mika: "El Departamento de Desarrollo Económico de la Academia, establecido por orden de Misono Mika, está reestructurando la economía para desarrollar la industria militar de Trinity. Incluso sin aprobación de Mika, en lo relativo a economía e industria este departamento desempeña un papel similar al de la Host. En adelante, el Departamento asumirá la misión de diseñar planes económicos que hagan a Trinity más fuerte que nunca."
 TRN_eed_cat_desc_general: "El Departamento de Desarrollo Económico de la Academia es una organización creada por orden de la Host para gestionar y operar de forma especializada la economía de la academia. Su directora se encarga de formular estrategias de desarrollo a medio y largo plazo y de supervisar diversos sectores económicos. Hoy más que nunca, se requieren planes precisos y sistemáticos."
 TRN_Industrial_Regions: "Desarrollar un distrito industrial en [FROM.GetName]"
 TRN_industrial_region_state_trigger: "Solo se pueden designar hasta 3 estados. Actualmente se han designado [?TRN_industrial_region_state] estados."
 TRN_garden_city_movement: "Movimiento de ciudad-jardín"
 TRN_garden_city_movement_desc: "Edén ha recuperado en gran medida su aspecto anterior gracias a la reconstrucción. Aun así, la ciudad todavía no ha sanado del todo. Debemos mejorar el entorno de vida y apoyar el desarrollo de capacidades industriales: viviendas familiares, viviendas de densidad media, servicios compartidos y equipamiento comunitario, además de amplias zonas verdes."
 TRN_embrace_chain_production: "Adoptar la producción en cadena"
 TRN_trade_controls: "Control del comercio"
 TRN_air_factory_decision: "Fábrica de aviones y motores de Trinity"
 TRN_junkers_corp_assets_decision: "Aprovechar activos de Junkers"
 
 TRN_economic_plan_cat: "Plan industrial de Trinity"
 TRN_economic_plan_cat_desc: "La crisis económica prolongada tras el incidente, el aumento del territorio de la academia, el colapso del orden social y la caída de diversos indicadores exigen una intervención económica más activa por parte de la Host del Tea Party. Para afrontar la crisis que se avecina, es imprescindible impulsar un vasto y sistemático desarrollo industrial, que será una tarea central para la estabilidad y recuperación de la academia."
 TRN_industry_deicision_active: "Ya hay un plan industrial en marcha en otro lugar."
 TRN_Infrastructure_development_fake: "Reconstrucción de infraestructura de Trinity"
 TRN_Infrastructure_Development: "Reconstruir infraestructura en [FROM.GetName]"
 TRN_Infrastructure_Development_desc: "Con la infraestructura colapsada por la Gran Transición, las viejas carreteras asfaltadas del antiguo Estado alemán no son adecuadas para operar los principales vehículos de Trinity. Por ello, se ha planteado la necesidad de un proyecto masivo de obras públicas para sustituir por completo la infraestructura obsoleta. La nueva red de autopistas mejorará la comodidad civil en tiempos de paz y permitirá el rápido movimiento nacional de vehículos militares en tiempos de guerra."
 TRN_Abydos_clearing_sand: "Restauración del ecosistema en [FROM.GetName]"
 TRN_Peat_Extraction: "Extracción de turba en la zona del Yermo del Norte"
 TRN_Peat_Extraction_desc: "En el norte existen numerosos humedales, pantanos y tierras baldías. Originalmente eran regiones deshabitadas, pero con la colonización comenzó a vivir gente, y esa apertura nos permitió conocer su potencial económico. Estas tierras son una excelente fuente de turba, un combustible auxiliar: un sustituto de baja calidad del carbón o la madera que puede extraerse del suelo para su uso en industrias locales y hogares."
 TRN_Opelwerk_Brandenburg: "Adquirir Opelwerk Brandenburg"
 TRN_Opelwerk_Brandenburg_desc: "Opelwerk Brandenburg, uno de los principales fabricantes de automóviles del antiguo Estado alemán, creció de forma constante entre los años 1920 y 1930, pero sufrió un golpe devastador con la Gran Transición. Aun así, su tecnología automotriz sigue siendo innovadora. Si la adquirimos y la convertimos en empresa estatal, podremos asegurar una compañía capaz de producir miles de camiones."
 TRN_Lehnmuhle_Dam: "Reconstruir la presa de Sajonia"
 TRN_Lehnmuhle_Dam_desc: "Sajonia, uno de los principales frentes durante la Gran Transición, sufrió el colapso de una presa tras intensos combates, causando graves inundaciones. La Host del Tea Party y las directivas de las facciones han establecido la reconstrucción de la presa como máxima prioridad, destacando las inundaciones recurrentes en la zona oriental de los Montes Metálicos y el aumento de la demanda de fuentes locales de energía."
 TRN_Basis_Scholar_development: "Desarrollar Basis Schola"
 TRN_Basis_Scholar_development_desc: "Gracias a la rápida respuesta de los Caballeros de Socorro, Basis Schola evitó daños graves ante los ataques alemanes. Sus esfuerzos tenaces generaron una fuerte confianza y simpatía de los residentes hacia el gobierno actual, contribuyendo a la estabilidad regional. Si impulsamos un plan industrial ligado a esta región, podremos lograr una industrialización más rápida. Su cercanía al río Óder ofrece ventajas significativas para la logística y el transporte de recursos."
 TRN_Kimigayama_shipbuilding_plant: "Astillero de Kimigayama"
 TRN_Kimigayama_shipbuilding_plant_desc: "Los nuevos mares bastan para inyectar un vigor fresco a la industria naval de Trinity, lo que exige una inversión masiva en astilleros. Pero esa inversión no será en vano: con suficiente capital y recursos, las recompensas económicas y estratégicas serán difíciles de medir."
 TRN_Stettin_heavy_industry: "Proyecto aeronáutico en [63.GetName]"
 TRN_Stettin_heavy_industry_desc: "La región de [63.GetName], adyacente al mar del Norte, posee una ventaja geográfica sobresaliente para operaciones aéreas hacia el noreste de Europa y el control marítimo. En cooperación con las autoridades locales, construiremos un gran aeropuerto y consolidaremos una base industrial aeronáutica."
 TRN_dessert_shop_expansion: "Ampliar las tiendas de postres"
 TRN_dessert_shop_expansion_desc: "Una líder debe pensar sin descanso, y pensar requiere energía de alta densidad calórica. Naturalmente, la gente busca algo que cumpla esas condiciones, además de ser dulce y ayudar a olvidar las preocupaciones aunque sea por un momento. Eso es: postres."
 TRN_agricultural_support: "Apoyo agrícola en [FROM.GetName]"
 TRN_agricultural_support_desc: "La gente ve las praderas verdes y los lagos tranquilos de Mecklemburgo y piensa en descanso. Pero tú, depredadora de verdad, al ver esas llanuras debes pensar en monocultivo eficiente y en una explotación implacable de la fertilidad del suelo. Pon el horizonte entero bajo tus pies. Claro, que sea todo genéticamente modificado." # Texto de broma. Se ajustará después.
 TRN_katowice_mining: "Expandir la minería en [FROM.GetName]"
 TRN_katowice_mining_desc: "Raspa las entrañas del planeta para llenar tu cuenta bancaria. Mientras los ambientalistas susurran sobre “un futuro sostenible” bebiendo café orgánico, el verdadero vencedor perfora la corteza y saquea los tesoros más profundos de la Tierra. Katowice está esperando tu enorme taladro." # Texto de broma. Se ajustará después.
 TRN_stettin_oil_mining: "Desarrollar los yacimientos petrolíferos de Stettin"
 TRN_stettin_oil_mining_desc: "Hay informes de que existe un yacimiento petrolero a unos 6 km de Swinemünde, ciudad portuaria al noroeste de Stettin. Este hallazgo ofrece a Trinity, especialmente escasa de combustible, la oportunidad de cubrir el déficit y, al mismo tiempo, reducir drásticamente la dependencia de combustibles fósiles importados."
 TRN_rebuilding_Landwehrkanal: "Restaurar el canal Landwehr"
 TRN_rebuilding_Landwehrkanal_desc: "La Gran Transición causó graves daños al canal Landwehr, destruyendo múltiples secciones y volviéndolo inutilizable. En particular, este canal tiene la gran ventaja de permitir transportar carga en un solo tramo desde Magdeburgo hasta Basis Schola, por lo que su valor es muy alto."
 TRN_schlesien_coal_mine: "Ampliar las minas de carbón de Silesia"
 TRN_schlesien_coal_mine_desc: "Las minas de carbón de Silesia se han convertido en enormes explotaciones dentro de Trinity, y la producción aumenta con el tiempo. Para sostener el consumo energético que se disparó tras el incidente, el desarrollo de las minas de carbón en Silesia se volvió una tarea imprescindible."

 TRN_trinity_world_cat: "Trinity y el mundo"
 TRN_trinity_world_cat_desc: "Trinity está actualmente aislada del mundo, pero es un problema que puede superarse mediante un esfuerzo diplomático suficiente. Aun así, los factores geopolíticos siguen oprimiéndonos, y esta crisis compleja debe resolverse paso a paso, empezando por la diplomacia. Nunca nos rendimos."
 TRN_lend_our_support: "Prestar nuestro apoyo"
 TRN_international_propaganda: "Propaganda internacional"
 TRN_international_propaganda_tt: "La cantidad de poder político obtenido se determina según el número de fábricas."
 TRN_border_fortifications: "Fortificar la frontera"
