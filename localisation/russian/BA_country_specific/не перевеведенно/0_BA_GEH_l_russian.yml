 GEH_luxembourg_negotiations_tt: "Estas condiciones influyen §Gpositivamente§! en el §Gresultado de la conferencia de unificación§!:\n£white_dot Se considera más probable que simpatice con los ideales de la §YRevolución del 68§!: §gSorazaki Hina y Amau Ako están en una relación§!\n£white_dot Se espera que preserve la autonomía local de Luxemburgo: §gNo se elige el enfoque $GEH_hina_route_focus$§!\n£white_dot Un líder confiable está en el poder: §g(Sin distinguir entre real o falso) Sorazaki Hina o Amau Ako es la jefa del Comité Disciplinario§!\n\nEstas condiciones influyen §Rnegativamente§! en el §Gresultado de la conferencia de unificación§!:\n£white_dot Aru no puede confiar en el Comité Disciplinario: §gSe elige el enfoque $GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2$§!\n£white_dot El pueblo de Luxemburgo desprecia al Comité Disciplinario: §gNuestra ideología es fascismo§!\n£white_dot El parlamento luxemburgués se opone a nosotros: §gLa legitimidad del Comité Disciplinario está por los suelos o es débil§!\n"
