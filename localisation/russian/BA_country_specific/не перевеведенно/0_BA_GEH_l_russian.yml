 GEH_ako_route_amau_ending_flag: "Hina §Yrechazó§! el amor de Ako de forma amistosa."
 GEH_ako_route_ako_sorasaki_ending_flag: "Hina aceptó el amor de Ako y se convirtió en su §Gpareja§!."
 GEH_ako_route_no_hina_ending_flag: "Tras renunciar al puesto de jefa del Comité, Ako llegó a su §Rlímete§! mental."
