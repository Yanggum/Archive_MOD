 GEH_ako_route_bad_ending_tt: "§gAmau Ako ya no podrá ser contratada permanentemente como asesora política ni como asesora del Alto Mando. Tras el §!§Y4.º Congreso del Comité Disciplinario§!§g, se desbloqueará el enfoque §!§YAlta Administradora Amau§!§g.§!"
 GEH_ako_route_amau_ending_tt: "§gTras el §!§Y4.º Congreso del Comité Disciplinario§!§g, se desbloqueará el enfoque §!§YAlta Administradora Amau§!§g.§!"
 GEH_ako_route_no_hina_ending_flag_tt: "§gAmau Ako se retira como líder nacional y el efecto de asesora política se debilita permanentemente. Tras el §!§Y4.º Congreso del Comité Disciplinario§!§g, se desbloqueará el enfoque §!§YLiderazgo colectivo del Departamento de Planificación§!§g.§!"
 GEH_ako_route_ako_sorasaki_ending_flag_tt: "§gSorazaki Hina ya §Yno se derrumbará bajo ninguna circunstancia§!. El contenido de salud mental de Hina queda bloqueado permanentemente. El efecto de asesora política de Amau Ako se fortalece permanentemente. Tras el §!§Y4.º Congreso del Comité Disciplinario§!§g, se desbloqueará el enfoque §!§YSorazaki Ako§!§g.§!"
 GEH_ako_sorasaki_administrative_officer_tt: "Se celebra la boda de §YAmau Ako§! y §YSorazaki Hina§!, y el nombre de Amau Ako cambia permanentemente a §GSorazaki Ako§!. Ako y el Departamento de Planificación mantendrán una influencia política muy fuerte en la conducción del Estado.\n\n"
 GEH_amau_administrative_officer_tt: "Con la república federal estabilizada, Sorazaki Hina recuperará parcialmente la cesión de poder hacia el Departamento de Planificación. El §YDepartamento de Planificación§! y el §YConsejo§! ejercerán competencias mucho más limitadas que antes.\n\n"

