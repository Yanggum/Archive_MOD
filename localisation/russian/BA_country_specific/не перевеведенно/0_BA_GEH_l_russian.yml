 GEH_basking_in_the_brilliance_of_their_serenade_decision: "Apoyo del Comité de Disciplina"
 GEH_basking_in_the_brilliance_of_their_serenade_decision_tt: "§REsta decisión solo puede ejecutarse una vez.§!\n\n§GEl estado de Sorasaki Hina se recupera por primera vez.§!\n§RSin embargo, la velocidad de empeoramiento aumenta.§!\n"

 GEH_hina_ako_root_start_tt: "§gAparece un equilibrio de poder especial para representar la actitud de Sorasaki Hina hacia Amau Ako, así como su relación. Cuando se complete el último enfoque de reforma de Amau Ako, §YLa espada que protege al pueblo§!, o el enfoque §Y3.ª Asamblea del Comité de Disciplina§!, la historia de Ako y Hina se decidirá según la dirección hacia la que se incline el equilibrio de poder.\n\n...Sea cual sea la elección, Hina debe definir con claridad su actitud hacia Ako.§! §RUna actitud ambigua empeorará la historia de Amau Ako en la dirección más terrible posible.§!"
 
 GEH_BTBOTS.1.t: "Acumulación de fatiga"
 GEH_BTBOTS.1.desc: "Sorasaki Hina continúa, desde el Gran Traslado, ocupándose de los asuntos de los innumerables miembros del Comité de Disciplina y de los territorios de la Academia Gehenna que ellos gobiernan. Hay muchas estudiantes esperando la decisión de Sorasaki Hina, y aún quedan montones de documentos que no ha podido aprobar.\n\nSorasaki Hina, una vez más hoy, comienza un nuevo día bebiendo un espresso cargado. Porque todavía queda mucho por hacer.\n\nHoy también firma documentos sobre los enfrentamientos entre las estudiantes de Gehenna y los civiles alemanes, ordena las medidas de respuesta del Comité de Disciplina, y continúa con una rutina idéntica a la de siempre.\n\nUna rutina que parece que nunca terminará, eternamente."
 GEH_BTBOTS.1.a: "\"Ako. Prepara el café más cargado.\""

 GEH_BTBOTS.2.t: "Copa de cristal"
 GEH_BTBOTS.2.desc: "Como siempre, los altos cargos del Comité de Disciplina se reúnen para celebrar una reunión. Bajo la fría mirada de Sorasaki Hina, como de costumbre, el debate acalorado de las directivas se prolonga sin cesar. Puesto que es seguro que las miembros comunes del Comité seguirán al pie de la letra lo que se decida en esta reunión, Sorasaki Hina continúa cargando en silencio con esa responsabilidad.\n\nLa escena, idéntica a la de hace unos días, se despliega ante sus ojos. La voz enfurecida de Shiromi Iori, el tono mordaz y burlón de Amau Ako, y la figura de Hinomiya Chinatsu observándolas con inquietud… todo queda reflejado sin filtros en las pupilas violetas de la presidenta del Comité.\n\nSorasaki Hina, como siempre, debía mediar… tenía que mediar. No. Pero no pudo hacerlo. En el instante en que no se dio cuenta de que estaba apretando con fuerza la copa de cristal que sostenía, la copa se hizo añicos. Y entonces, la disputa entre ambas se detuvo al instante.\n\nEl aire de la sala de reuniones del Comité de Disciplina se volvió pesado."
 GEH_BTBOTS.2.a: "\"...Sigan. Lo siento.\""

 GEH_BTBOTS.3.t: "Apatía"
 GEH_BTBOTS.3.desc: "En el tenue amanecer, Sorasaki Hina logró abrir los ojos a duras penas arrastrando un cuerpo exhausto. Aunque todo su cuerpo se sentía aplastado por una sensación de no querer hacer nada, su mente estaba llena de los documentos ya esparcidos por toda la academia y de las voces de estudiantes esperando una decisión.\n\nTras pasar varios minutos acostada mirando al vacío, se incorporó a regañadientes. Sus pasos hacia la cocina eran desesperadamente lentos, y el amargor del espresso cargado que sostenía en la mano parecía querer hacerla olvidar la realidad aunque fuera por un instante. Sin embargo, la luz tenue que se filtraba por la ventana y los susurros apagados de sus compañeras al final del pasillo le anunciaban que el pesado trabajo de hoy estaba a punto de comenzar.\n\nAsí, Sorasaki Hina caminó por el corredor hacia la sala de reuniones. Bajo la luz matinal que se colaba por la rendija de la puerta, el silencio y la expectativa de las directivas reunidas la recibieron. Con un profundo suspiro, abrió la puerta y entró.\n\nEsta mañana, enterrando por la fuerza aquella sensación de no querer hacer nada, Sorasaki Hina volvió a aceptar el peso de lo que debía hacerse. Lo único cierto era que le aguardaban una montaña de documentos y momentos de decisión. Y ese hecho, y solo ese, fue lo que la llevó hasta dentro de la sala."
 GEH_BTBOTS.3.a: "\"Otro día ha empezado.\""

 GEH_BTBOTS.4.t: "Un espresso"
 GEH_BTBOTS.4.desc: "Por la tarde, bajo una luz fluorescente que parpadeaba débilmente, Sorasaki Hina estaba sentada sola en un rincón de su despacho. Tras un día entero de trabajo y papeleo, y después de haber bebido una y otra vez espresso cargado, estaba sintiendo de lleno los efectos secundarios de la cafeína que se acumulaba dentro de su cuerpo.\n\nSu rostro, en vez de la habitual frialdad, estaba manchado por palidez y cansancio; la punta de sus dedos temblaba levemente, y su corazón latía de forma irregular. Como si los sentidos se hubieran vuelto hipersensibles por el exceso de cafeína, los documentos a su alrededor y la pantalla del monitor parecían distorsionarse sin límite. En el silencio del despacho, el temblor de su mano y el ritmo acelerado de su corazón hacían que aquel espacio se sintiera aún más lúgubre.\n\nEn esa noche solitaria, Sorasaki Hina se juró en silencio. Por más que el trabajo y la responsabilidad la aplastaran, debía superar aquellos síntomas y recibir el mañana. Sin embargo, los signos ya mostraban que esa condición se convertiría en una carga fatal para la ejecución de su trabajo a partir de ahora."
 GEH_BTBOTS.4.a: "\"Aún no… no puedo.\""

 GEH_BTBOTS.5.t: "Como fragmentos de vidrio"
 GEH_BTBOTS.5.desc: "Cuando la oscuridad de la noche se hizo más profunda, Sorasaki Hina dejó atrás el silencio del despacho y se dirigió a su espacio personal. La frecuencia cardiaca ya elevada por el exceso de espresso, las yemas de los dedos temblorosas y un cansancio difícil de soportar se hundieron en lo más profundo de su interior, y su fachada—siempre firme—comenzó a mostrar grietas poco a poco.\n\nA solas en casa, su mirada, en algún momento, se tiñó de vacío y rabia. Un marco de cristal en un rincón del estudio, que guardaba recuerdos que una vez fueron preciados, se le presentó ahora como un símbolo cruel de la realidad. La soledad reprimida y el peso de la responsabilidad estallaron de golpe; Sorasaki Hina, sin dudarlo, lanzó el marco con todas sus fuerzas. Los trozos de vidrio brillaron en el aire y se derramaron sobre el suelo frío, y en un instante la casa quedó sumida en un silencio brutal, devorada por los fragmentos.\n\nEse instante de ira y desesperación dejó al descubierto todo el dolor y la carga que había tratado de ocultar, y un aire vacío, como si todo a su alrededor se derrumbara por un momento, llenó la habitación."
 GEH_BTBOTS.5.a: "La chica sintió, aunque solo fuera por un instante, una sensación de liberación."

 GEH_BTBOTS.6.t: "La primera sinceridad"
 GEH_BTBOTS.6.desc: "Por la tarde, en un rincón del despacho, Sorasaki Hina comenzó el tratamiento de los síntomas de adicción a la cafeína con la ayuda meticulosa de Hinomiya Chinatsu. Mientras el corazón acelerado y el temblor en sus dedos—provocados por el exceso de espresso—empezaban a estabilizarse poco a poco, la atención serena de Chinatsu y el apoyo del equipo médico le ayudaban a recuperar la calma gradualmente.\n\nEn aquella soledad momentánea, sintió cómo regresaban, lentamente, su intención inicial perdida y el orgullo de ser la presidenta del Comité de Disciplina. Entonces, al dirigirse a la sala de reuniones donde estaban reunidas las directivas, reveló con cautela el dolor y el miedo interior que había ocultado hasta ahora. Entre consuelos y ánimos transmitidos en silencio mediante miradas y gestos sutiles, Sorasaki Hina confesó con sinceridad su agotamiento y el peso de su responsabilidad, dejando caer un poco de la carga de su corazón.\n\nLa respuesta cálida y las miradas sinceras de las directivas le insuflaron una vez más fuerzas para seguir adelante. En ese momento, el tratamiento iniciado con la ayuda de Chinatsu y el consuelo de sus compañeras se convirtieron en un punto de inflexión valioso para recuperar su intención inicial, despertando de nuevo en el interior de Sorasaki Hina una determinación firme y una esperanza renovada."
 GEH_BTBOTS.6.a: "Pero cuando llegó el día siguiente, la realidad volvió a aplastarla con su peso."

 GEH_BTBOTS.7.t: "Un castillo de naipes derrumbado"
 GEH_BTBOTS.7.desc: "Muy entrada la noche, cuando las luces de la sala de reuniones se iban apagando una a una, Sorasaki Hina exhaló un profundo suspiro en un rincón del despacho y tomó la decisión final. Los documentos acumulados de todo el día, las innumerables decisiones que debía sostener, e incluso la ayuda meticulosa de Chinatsu, se habían convertido en una responsabilidad demasiado pesada como para soportarla. Bajo ese peso, en su interior se fueron acumulando en silencio un dolor y una frustración insoportables.\n\nAl final, redactó una carta de renuncia y se marchó sin previo aviso. Sobre el escritorio donde quedó la renuncia, permanecían intactas las huellas de una líder que alguna vez fue fuerte. En la sala de reuniones donde estaban reunidas las directivas, su ausencia se notó de inmediato, y las que quedaron se hundieron en el desconcierto y una tristeza profunda.\n\nEl paradero de Sorasaki Hina no se supo en absoluto desde aquella noche, y en la Academia Gehenna solo quedó el pesado vacío, como una última protesta, que ella había dejado atrás. Su renuncia no era una simple señal de abandono: era una elección trágica tomada por un ser humano frente a una responsabilidad y un dolor demasiado abrumadores, algo que las que permanecieron allí no tuvieron más remedio que aceptar en silencio."
 GEH_BTBOTS.7.a: "\"Lo siento. Todas.\""
 GEH_BTBOTS_END_tt: "El enfoque §Y$GEH_three_congress_focus_no_hina$§! avanzará automáticamente."

 GEH_BTBOTS.100.t: "Determinación, papel arrugado"
 GEH_BTBOTS.100.desc: "La noche era profunda, y fuera de la ventana del despacho solo unas luces tenues iluminaban la ciudad. En medio de días de dudas y conflictos, Sorasaki Hina sintió que finalmente había llegado el momento de tomar la última decisión.\n\nSobre el escritorio estaba la renuncia que aún no había entregado. Hace solo unas horas pensaba que era la única elección, pero ahora sus dedos no se dirigían a ese papel ni un poco.\n\nElla misma, a punto de derrumbarse. Días en los que, aplastada por trabajo interminable y responsabilidad, quería huir. Pero si ella se iba… ¿quién protegería esta academia?\n\nRegulando lentamente la respiración, se levantó y se acercó a la ventana. Luces que no se apagaban ni en la oscuridad; le vinieron a la mente los rostros de las estudiantes y de sus compañeras que estarían allí. Lo que ellas deseaban de ella no era un descanso momentáneo, sino la figura de una líder que no vacilara.\n\nEn ese instante, incluso dentro de una confusión profunda, una certeza se apoderó de ella.\n\nSorasaki Hina extendió la mano y, lentamente, arrugó la renuncia. Y una vez más, decidió avanzar por la academia y por sus compañeras.\n\nAl oír unos pasos familiares al otro lado de la puerta, giró el cuerpo en silencio. Ya no vacilará más."
 GEH_BTBOTS.100.a: "\"Tengo que ser yo quien lidere.\""

 GEH_BTBOTS.101.t: "Más allá del límite"
 GEH_BTBOTS.101.desc: "La luz del despacho seguía sin apagarse.\n\nSorasaki Hina estaba enterrada en documentos toda la noche. El reloj marcaba las 4 de la madrugada, y su cuerpo, por el trabajo de varios días, estaba extremadamente debilitado. Cuando cerró los ojos hace unas horas, creyó que podría descansar aunque solo fueran unos minutos. Pero la realidad no la dejó en paz.\n\nLos documentos seguían acumulándose. Informes de choques entre estudiantes en la academia, materiales de negociación con las autoridades alemanas, y montones de documentos administrativos que el Comité debía procesar llenaban su vista. Todos eran asuntos que exigían una decisión en cuestión de horas.\n\nPero su cabeza se volvía cada vez más pesada y su cuerpo más torpe. No era simple cansancio. Las letras frente a sus ojos se deformaban borrosas, y los dedos se le entumecían. Cuanto más intentaba concentrarse, más se alejaba su consciencia, y hasta ordenar los pensamientos se volvía difícil.\n\nEntonces, vio un pequeño frasco de vidrio en un extremo del escritorio.\n\nLo había llevado sin que las directivas del Comité lo supieran. Un estimulante: metanfetamina. La 'droga milagrosa' que los militares y políticos alemanes usaban para olvidar el cansancio y entregarse al trabajo.\n\nDudó.\n\nPero en ese instante, los pasos que sonaban al otro lado de la puerta la pusieron en tensión. Alguien esperaba su decisión como presidenta del Comité. Ellas no verán cómo vacila.\n\nExtendió la mano. Abrió la tapa y sacó una pastilla. Tras exhalar un profundo suspiro, se la tragó sin agua.\n\nUnos segundos después, el cansancio que aplastaba todo su cuerpo comenzó a desvanecerse tenuemente. El corazón le latía rápido y su mente se aclaró. La concentración regresó.\n\nSorasaki Hina volvió a tomar la pluma y levantó los documentos. El leve temblor de sus dedos ya no parecía algo extraño."
 GEH_BTBOTS.101.a: "\"Aún… queda mucho por hacer.\""

 GEH_discipline_system_event.1.t: "Una sola Gehenna, una sola disciplina"
 GEH_discipline_system_event.1.desc: "Por fin, Gehenna se ha convertido en una sola. La Pandemonium Society, conocida comúnmente como el Consejo de los Diez Mil Demonios, ha desaparecido ya en la historia. El fin de aquella larga y tediosa guerra civil no significaba simplemente la unificación del territorio. Significaba que la larga lucha del Comité de Disciplina por la 'orden' había obtenido una victoria total, tanto en legitimidad como en beneficio práctico.\n\nDesde el Gran Traslado, todas las actividades de seguridad del Comité de Disciplina se habían llevado a cabo bajo la interferencia de un organismo superior llamado el Consejo de los Diez Mil Demonios. El presupuesto se recortaba a capricho, las órdenes administrativas chocaban por duplicado, y cualquier acción del Comité de Disciplina era criticada bajo el estigma de 'insubordinación'. Mantener la disciplina en semejantes condiciones era una guerra de desgaste, como echar agua en un barril sin fondo.\n\nEl informe del Departamento de Inteligencia del Comité de Disciplina fue claro. En sus palabras, 'la última cadena que sujetaba el tobillo de Gehenna' había desaparecido. Toda la capacidad que antes se desperdiciaba en fricciones políticas innecesarias e interferencias administrativas ahora podía volcarse por completo, y sin reservas, en mantener la seguridad.\n\nAhora, la autoridad del Comité de Disciplina es única y absoluta en toda Gehenna. Ya no existe ningún enemigo interno que dude de nuestro orden o lo obstruya. El sistema administrativo ha sido unificado, y toda la fuerza que antes se malgastaba se concentrará únicamente en enderezar las costumbres de la sociedad. Que la disciplina de Gehenna se mantenga mucho más firme que antes era un resultado inevitable."
 GEH_discipline_system_event.1.a: "\"¡Intégrenlo todo!\""

 GEH_discipline_system_event.2.t: "Lo que se ganó con la victoria"
 GEH_discipline_system_event.2.desc: "La Batalla Decisiva del Edén terminó con nuestra victoria. La mala sangre con Trinity, que se había prolongado durante siglos, por fin llegó a su fin, y la bandera de Gehenna ondeaba sobre el corazón del enemigo. Los gritos de triunfo cubrieron toda la tierra, pero en el despacho de la presidenta del Comité de Disciplina, el aire solo se sentía pesado.\n\nUna guerra larga, larguísima. Lo que quedó al final fueron innumerables sacrificios y cicatrices de destrucción. Pero, al mismo tiempo, obtuvimos algo que no podía cambiarse por nada: la 'legitimidad absoluta'.\n\nHasta ahora, el Comité de Disciplina siempre había tenido que luchar contra enemigos internos. Choques con el Consejo de los Diez Mil Demonios, clubes descontentos, e incluso estudiantes que dudaban de nuestro gobierno. Su resistencia siempre cobraba fuerza bajo el enorme pretexto de una 'amenaza externa'. Pero ahora, esa amenaza externa ha desaparecido.\n\nSomos los héroes que protegieron Gehenna, y los guardianes que hicieron arrodillarse a su némesis. A partir de ahora, las voces que se opongan a las políticas del Comité de Disciplina no serán simples quejas, sino que serán tratadas como 'traición' por menospreciar la gran victoria. El enorme poder militar y administrativo movilizado para la guerra ahora se dirigirá por completo hacia el interior. Hemos podido concentrar todas nuestras fuerzas en identificar a los elementos impuros dispersos y cortar de raíz, por toda la sociedad, los brotes de ansiedad que aún quedan.\n\nYa no se tolerará el caos usando la amenaza externa como excusa. La disciplina de Gehenna, bajo el nombre de la victoria, será más firme que nunca."
 GEH_discipline_system_event.2.a: "\"¡Es una gran victoria!\""

 GEH_discipline_system_event_tt: "§C¡El ciclo en el que disminuye la disciplina se ralentiza!§!"

 GEH_normal_story_event.1.t: "La guerra contra el papeleo"
 GEH_normal_story_event.1.desc: "\"¡Informe! ¡Borrador! ¡Documento de aprobación! ¡Yo entré al Comité de Disciplina para disparar, no para estar moviendo la pluma, ¿¡sí o no?!\"\n\nEl grito desesperado de Shiromi Iori retumbó en la oficina del Jefe del Departamento de Ejecución. Tras el retiro de Sorasaki Hina, el poder real del Comité de Disciplina pasó de forma natural a Amau Ako, la maestra de la administración. Como resultado, sobre el escritorio de Iori se apilaron más documentos de los que había visto en toda su vida, como si fueran el Monte Everest. Para ejecutar una sola operación, ahora había que pasar por docenas de etapas de aprobación y procedimientos de reporte.\n\n\"Señorita Iori, cálmese. No le hace bien a su presión arterial.\"\n\nJusto entonces, Chinatsu llegó con un analgésico para el dolor de cabeza e intentó detenerla. Pero había alguien que avivaba todavía más la ira de Iori: Ako.\n\n\"Ay, señorita Iori. Parece que aún no ha terminado de redactar el 'informe trimestral sobre el plan de reciclaje de casquillos' que le di ayer. Jejeje.\"\n\nCon una sonrisa odiosa, Ako colocó con delicadeza sobre el escritorio de Iori un nuevo fajo de documentos, como si acabara de salir de imprenta.\n\n\"Este es el 'formato de aviso previo para prevenir quejas por ruido durante las operaciones', así que por favor lo necesito antes del entrenamiento de la próxima semana. Tiene que pasar por la revisión del Departamento de Planificación, así que escríbalo con cuidado y sin errores tipográficos.\"\n\n\"Ugh... ¡¡UAAAAAAAAAAAAH-!!\"\n\nAl final, Iori se desplomó sobre el escritorio y se agarró la cabeza. Ni el tanque Toramaru del Consejo de los Diez Mil Demonios, ni el gran ejército de Trinity habían logrado doblegarla. Pero los documentos de Ako… con una sola hoja, la derribaron por completo."
 GEH_normal_story_event.1.a: "\"Más bien extraño un tiroteo...\""

 GEH_normal_story_event.2.t: "Shiromi Minori"
 GEH_normal_story_event.2.desc: "\"¡El papeleo no detiene balas! ¡Los procedimientos administrativos no derrotan al enemigo!\"\n\nLa paz de la plaza frente a la sede del Comité de Disciplina se hizo añicos por el sonido del megáfono que sostenía Shiromi Iori. Subida sobre una caja de munición, ella iniciaba una protesta contra Amau Ako, que tras el retiro de Hina había emergido como la candidata más fuerte a sucederla.\n\n\"¡Una administradora estricta no puede ser presidenta del Comité de Disciplina! ¡Detengamos la dictadura de aprobaciones de Amau Ako!\"\n\nLas miembros del Departamento de Ejecución, movilizadas por ella, levantaron pancartas a regañadientes. Iori, sin hacerles caso, siguió alzando la voz.\n\n\"¡Respeten la opinión del personal de campo del Departamento de Ejecución! ¡Saquemos a Ako!\"\n\nMientras tanto, en el despacho de la presidenta (en funciones), Amau Ako contemplaba en silencio el espectáculo desde la ventana, con los brazos cruzados. A su lado, Chinatsu dijo preocupada:\n\n\"La señorita Iori… a este paso se le va a ir la voz. No es bueno para su salud.\"\n\nAko exhaló un suspiro profundo. En lugar de discutir con Iori, tomó en silencio el auricular del teléfono sobre su escritorio.\n\n\"¿Departamento de Seguridad? Hay personal causando una manifestación ilegal y contaminación acústica frente a la entrada principal de la sede. Por favor, procedan según la normativa. Sí, es 'la Jefa del Departamento de Ejecución, Shiromi Iori'. Jejeje.\"\n\nPoco después, mientras Iori seguía en plena arenga, dos miembros subalternas del Comité de Disciplina se le acercaban con cuidado, llevando una 'notificación de advertencia por provocar ruido'."
 GEH_normal_story_event.2.a: "¡El Comité de Disciplina sigue operando con normalidad!"

 GEH_normal_story_event.3.t: "¿¡Pueehng?!"
 GEH_normal_story_event.3.desc: "\"¿Estos datos… no tienen errores tipográficos? Seguro hubo un problema con el muestreo.\"\n\nLa voz de Amau Ako era tan fría como el hielo, pero estaba temblando levemente. Frente a ella estaba el informe de una 'encuesta interna de opinión sobre la idoneidad para la próxima presidencia del Comité de Disciplina'. Su gráfica de popularidad, que hasta solo una semana atrás lideraba con una ventaja aplastante, se había desplomado en vertical, como si se hubiera arrojado desde un acantilado.\n\nEl miembro del Departamento de Planificación que presentaba el informe respondió sudando frío.\n\n\"N-no, administradora. Son cifras correctas… incluso pasaron la validación cruzada…\"\n\n\"¿Correctas…?\"\n\nAko empezó a leer las respuestas anónimas al final del informe. 'Enfatiza demasiado los procedimientos de papeleo.' 'No conoce la situación en el terreno.' '¿Qué, quiere convertir el Comité de Disciplina en una fábrica de documentos?' Todas eran exactamente iguales a esos eslóganes estúpidos que Shiromi Iori gritaba por el megáfono.\n\n\"¿No me diga… que porque esa idiota gritó unas cuantas veces frente al edificio, la opinión pública cambia así de fácil…? ¿Eso tiene sentido? ¿Eso es racional?\"\n\nSu sistema administrativo perfecto, las políticas más eficientes para el futuro de Gehenna, estaban derrumbándose por culpa de un solo megáfono. Por primera vez, Ako sintió que chocaba contra un enorme muro llamado 'irracionalidad', algo que jamás había entendido en su vida. Con manos temblorosas, arrugó el informe."
 GEH_normal_story_event.3.a: "\"...E-espera. ¡Mi popularidad!\""

 GEH_normal_story_event.4.t: "Stalemate"
 GEH_normal_story_event.4.desc: "El día en que se elegiría a una nueva presidenta del Comité de Disciplina para llenar el vacío dejado por Sorasaki Hina. El aire de la sala, contrario a lo esperado, no estaba lleno de esperanza, sino de una tensión pesada e incierta. Hasta hace solo unas semanas, la sucesión de Amau Ako parecía un hecho consumado. Pero el inesperado contraataque de Shiromi Iori lo sacudió todo.\n\nEl método de Iori estaba lejos de ser una ofensiva política sofisticada. Ella simplemente se plantó frente a la sede con un megáfono y criticó sin filtros el enfoque administrativo de Ako. Pero el lema simple y directo de 'el papeleo no detiene balas' penetró en el corazón de las miembros comunes, agotadas por el trabajo administrativo complejo, con mucha más efectividad de la esperada. La popularidad de Ako se desplomó.\n\nPero Iori también pagó un precio. Su método fue visto como 'propaganda negativa' que degradaba la dignidad del Comité de Disciplina, y despertó dudas sobre su aptitud como líder. Como resultado, Iori logró arrastrar a Ako hacia abajo, pero ella misma fue arrastrada por la explosión y cayó con ella.\n\nAhora el Comité de Disciplina había quedado en un estancamiento: dos figuras gigantes, heridas entre sí, derrumbadas. Había que encontrar un tercer camino que no fuera ni Ako ni Iori. Todas las miembros del Comité contuvieron la respiración, esperando la elección que decidiría su destino."
 GEH_normal_story_event.4.a: "Presidenta del Comité de Disciplina: Himuro Sena"
 GEH_normal_story_event.4.b: "Presidenta del Comité de Disciplina: Kurodate Haruna"
 GEH_normal_story_event.4.c: "Presidenta del Comité de Disciplina: Kinugawa Kasumi"

 GEH_normal_story_event.5.t: "¿Gehenna… academia de aguas termales?"
 GEH_normal_story_event.5.desc: "\"Resultado final de la votación… ganadora, del Club de Desarrollo de Aguas Termales, Kinugawa Kasumi!\"\n\nLa voz del miembro del Departamento de Planificación que anunciaba el resultado rozaba el llanto. Amau Ako, por un instante, dudó de sus propios oídos. Tras una guerra de propaganda negativa absurda y desgastante con Iori, las miembros del Comité habían acabado votando por un 'tercer candidato'. Pero que ese tercer candidato fuera la terrorista número uno de Gehenna, Kinugawa Kasumi…\n\n\"¡Waa~jajaja! ¡A ver, todos! ¿Qué tal si, para celebrar la victoria, cavamos unas aguas termales en el sótano de la sede del Comité? ¡Seguro que brota un agua termal increíble! ¡Vamos, si la preparación para la demolición ya está lista!\"\n\nCuando Kasumi, con la banda de nueva presidenta del Comité de Disciplina, agitó el detonador y gritó desde el estrado, la sala se convirtió en un caos en un instante. Las del Departamento de Ejecución se quedaron horrorizadas, y las del Departamento de Planificación se escondieron debajo de los escritorios. Ako solo podía mirar, atónita, aquella escena irreal.\n\nEl Comité de Disciplina que había protegido con toda su vida y que había intentado enderezar… acababa de caer en manos de la peor bombardera de Gehenna. Ako sintió que le daba vueltas la cabeza y murmuró en voz baja."
 GEH_normal_story_event.5.a: "\"...Esto es un sueño. Ahora mismo estoy teniendo una pesadilla horrible.\""

 GEH_normal_story_event.6.t: "¿Gehenna… academia gourmet?"
 GEH_normal_story_event.6.desc: "\"Resultado final de la votación… ganadora, del Club de Investigación Gourmet, Kurodate Haruna!\"\n\nLa sala de reuniones del Comité de Disciplina quedó en silencio, como si le hubieran arrojado agua fría. Las miembros, hartas del forcejeo miserable entre Shiromi Iori y el resto, no eligieron ni 'orden' ni 'fuerza', sino 'gourmet'. Una candidata cuyo programa electoral se reducía a 'reforma total del menú del comedor del Comité' y 'asegurar presupuesto para recorridos gastronómicos regulares' había tomado el control del corazón de Gehenna.\n\n\"Jejeje. Gracias por su sabia elección. A partir de ahora, el Comité de Disciplina no caminará por el camino de una violencia insípida, sino por el de una gastronomía elegante.\"\n\nLa nueva presidenta del Comité de Disciplina, Kurodate Haruna, sonrió con elegancia desde el estrado. Al verla, Amau Ako comenzó a reír como alguien que ha perdido la razón.\n\n\"Ja… ja ja… jajajaja!\"\n\nHasta Iori habría sido mejor. Esa mujer podría volar la sede entera del Comité solo porque 'no está rico'. Ako intuyó que todos sus planes, todos sus ideales, estaban destinados a desaparecer en un estómago gigantesco. El futuro de Gehenna iba a ser tratado peor que el menú del almuerzo de hoy.\n\n\"...¿Lo está viendo, jefa? Nosotras… estamos acabadas.\"\n\nAko dejó de reír y miró al vacío con ojos huecos."
 GEH_normal_story_event.6.a: "\"...Esto es un sueño. Ahora mismo estoy teniendo una pesadilla horrible.\""

 GEH_normal_story_event.7.t: "Manual de etiqueta"
 GEH_normal_story_event.7.desc: "\"Esa Ako… desde que se volvió la presidenta del Comité, se puso todavía más quisquillosa. ¿Cuánto no estuvo fastidiando a la gente durante toda la reunión?\"\n\nApenas terminó la primera reunión periódica, Iori se desahogó con quejas en el pasillo frente a Chinatsu. En ese momento, el hombro de Iori se estremeció al oír detrás la voz alegre de Ako.\n\n\"Ay, señorita Iori. Qué bien que la encuentro.\"\n\nAko apareció de la nada con una sonrisa brillante, y le entregó a Iori y a Chinatsu un libro cada una, grueso y encuadernado con exquisitez. En la portada, en letras doradas, decía: <Manual de etiqueta y normas de intervención en reuniones de altos cargos bajo el nuevo sistema de la presidenta del Comité de Disciplina (1.ª edición)>.\n\n\"Para una comunicación fluida y la armonía organizacional, es un manual que elaboré tras pasarme la noche en vela. A partir de ahora, todo alto cargo debe estar sentado 10 minutos antes del inicio de la reunión, y al intervenir debe usar obligatoriamente el tratamiento de 'respetada presidenta del Comité de Disciplina'; la vestimenta debe ser adecuada, y la intervención no debe exceder los 3 minutos…\"\n\nMientras Ako explicaba sin fin las normas, Iori la miraba como si estuviera viendo a una criatura jamás vista.\n\n\"...Ah, y por favor tengan en cuenta que las objeciones innecesarias contra un superior pueden considerarse 'conductas que obstaculizan la armonía organizacional'. Entonces, memorícenlo y nos vemos en la próxima reunión. Jejeje.\"\n\nCuando Ako se fue con pasos ligeros, Iori bajó la mirada, desolada, al libro del grosor de una enciclopedia que tenía en las manos. A su lado, Chinatsu, hojeando el manual, dijo con indiferencia:\n\n\"Está organizado de forma sistemática. Lo usaré como referencia para el trabajo.\"\n\nIori no pudo responder nada. Esto era lo que Amau Ako llamaba 'reconciliación'. Una reconciliación perfecta mediante disciplina y procedimientos despiadados, más aterradora que las armas y las balas."
 GEH_normal_story_event.7.a: "\"¿Esto… es reconciliación…?\""

 GEH_normal_story_event.8.t: "¿Para quién?"
 GEH_normal_story_event.8.desc: "\"Aún no se ha ido, administradora Ako.\"\n\nMuy entrada la noche, Hinomiya Chinatsu entró en silencio al despacho de Ako. Amau Ako no respondió; solo miraba la documentación de registro de candidatura a la presidencia estudiantil que estaba sobre el escritorio. La mejor experta administrativa de Gehenna, la sucesora más capaz de Hina. Todo el mundo la consideraba la próxima presidenta del consejo estudiantil. Pero la propia Ako no había sido capaz de escribir ni una sola línea en el formulario.\n\n\"…¿Sabe, señorita Chinatsu? Ni una sola vez en mi vida he pensado que trabajaba por 'Gehenna'.\"\n\nPor primera vez, Ako dejó ver su frágil interior.\n\n\"Todo lo que hice—revisar documentos hasta el amanecer, planear presupuestos—fue para… aliviar la carga de la jefa Hina. Para que pudiera dormir tranquila, para que pudiera sonreír. Eso era todo. Pero ahora, Gehenna sin ella… por esta multitud indefinida de estudiantes… ¿de verdad puedo cargar con todo esto? ¿Soy alguien con derecho a hacerlo?\"\n\nChinatsu escuchó en silencio. Y luego preguntó con calma.\n\n\"Hay muchas maneras de honrar a la jefa Hina. Guiar directamente el 'estado' que ella intentó proteger y continuar su legado sería una de ellas, y quizá existan otras. Lo importante no es la expectativa de otros, sino qué camino quiere tomar 'Amau Ako'.\"\n\nDespués de que Chinatsu se fue, Ako volvió a quedarse sola. Miró alternativamente el inmenso paisaje nocturno de Gehenna que se extendía tras la ventana y los documentos sobre su escritorio. El mundo que Hina quiso proteger. ¿Qué es lo mejor que ella puede hacer por ese mundo? Al final, Ako tomó la pluma."
 GEH_normal_story_event.8.a: "\"Esta Gehenna que la jefa Hina quiso proteger… ahora, seré yo.\""
 GEH_normal_story_event.8.b: "\"...Tal vez, otro camino.\""

 GEH_normal_story_event.9.t: "La División Lucero de Gehenna, y la administradora principal Shiromi Iori"
 GEH_normal_story_event.9.desc: "\"¿Qué… qué clase de situación es esta ahora mismo?\"\n\nShiromi Iori no podía aceptar la realidad aun viendo la placa frente a sus ojos. 'Administradora principal Shiromi Iori'. Días atrás, Amau Ako declaró de repente que no se presentaría a la elección de presidenta del consejo estudiantil y, al mismo tiempo, renunció también al cargo de administradora principal. Y como sucesora, por alguna razón, nombró a Shiromi Iori. Puso a alguien que solo sabe disparar como máxima responsable de la administración.\n\n\"¿Esa mujer se retiró así de fácil? No tiene sentido. Seguro está tramando algo.\"\n\nIori no podía entender la renuncia de Ako. Parecía que deseaba con todas sus fuerzas el puesto de presidenta del Comité. Parecía una mujer loca por el poder. Esto tenía que ser una trampa. Mientras alimentaba su desconfianza, llegó un informe todavía más absurdo.\n\n\"¿Gehenna… División Lucero?\"\n\nUna organización sospechosa que Ako había fundado tras renunciar. El nombre ya era raro. ¿División Lucero? ¿Un grupo de asesinas con un nombre elegante? ¿Una sociedad secreta? Iori montó todo tipo de teorías conspirativas, pero el contenido del informe era aún más increíble: 'fundación de becas y entidad de formación de talento'.\n\n\"¿Becas…? ¿Me está tomando el pelo?\"\n\n¿Abandonó el poder y de pronto quiere ser educadora? Mientras Iori se agarraba la cabeza ante el rumbo incomprensible de Ako, un miembro del Departamento de Planificación entró con una montaña de documentos.\n\n\"E-esto… ¿señora administradora? Es el informe trimestral de cierre presupuestario que debe revisar…\"\n\nIori miró, atónita, la enorme montaña de documentos que le extendían. Fuera cual fuera el verdadero objetivo de Ako, una cosa era segura: ahora mismo, ella había caído en el peor infierno de su vida."
 GEH_normal_story_event.9.a: "...De acuerdo, empecemos desde cero."

 GEH_normal_story_event.10.t: "Un trono sin dueño"
 GEH_normal_story_event.10.desc: "Se alzó el telón de las elecciones a la presidencia del consejo estudiantil que abrirían una nueva era en Gehenna. Pero ese inicio no fue una marcha esperanzadora, sino el caos en sí mismo. Porque la candidata más fuerte, la que todo el mundo daba por hecho, Amau Ako, declaró de repente que no se presentaría y que renunciaba, desapareciendo tras bambalinas.\n\nCon la desaparición del absoluto favorito, el tablero electoral se transformó en un instante en un enorme festival para ambiciosas.\n\n\"¡Pongamos fin a la tiranía del Comité de Disciplina y construyamos una Gehenna deliciosa! ¡Un voto para el Club de Investigación Gourmet!\"\n\"¡Aguas termales por toda Gehenna! ¡Bienestar termal para todas las estudiantes! ¡El Club de Desarrollo de Aguas Termales cumple sus promesas!\"\n\"¡Una Gehenna fuerte con la dieta nutritiva del Club de Suministros!\"\n\nCandidatas que nadie esperaba, una tras otra, lanzaron su candidatura. La plaza se llenó del ruido de consignas, con propagandistas de cada club y organización mezclándose y gritando unos contra otros; y en las paredes, carteles con promesas incomprensibles se superponían como si estuvieran repintando encima. Era una elección lejos del orden: una elección, literalmente, 'muy de Gehenna'.\n\nLas miembros del Comité de Disciplina observaban aquel espectáculo caótico con un sentimiento pesado. Si Ako hubiera estado, habría puesto orden en todo y prometido un futuro estable. Pero ella ya no estaba. Ahora el Comité, en medio de este caos, se veía obligado a elegir a una candidata que, al menos, no condujera a Gehenna al peor de los escenarios: alguien 'menos mala'."
 GEH_normal_story_event.10.a: "Yozaakura Kirara, elegida"
 GEH_normal_story_event.10.b: "Aikiyo Fuuka, elegida"

 GEH_normal_story_event.11.t: "La era de la razón"
 GEH_normal_story_event.11.desc: "En el momento en que Amau Ako decidió presentarse, el tablero electoral—sumido en el caos—se ordenó en un instante. Ella no gritó consignas llamativas ni agitó a las masas. En su lugar, publicó un informe de políticas concretas de cientos de páginas para el futuro de Gehenna, y en los debates derrotó una por una las afirmaciones emocionales de las demás candidatas con datos fríos y lógica.\n\nAl principio, incluso las estudiantes que se preguntaban por su actitud rígida terminaron por comprender que lo que Gehenna necesitaba no era un festival, sino 'estabilidad'. El resultado electoral fue aplastante. Amau Ako fue elegida como la primera presidenta del consejo estudiantil de Gehenna.\n\nEl día de la investidura, Ako subió al estrado y comenzó su discurso con una voz serena, sin dejarse arrastrar por la emoción.\n\n\"Estudiantes de Gehenna. Ustedes no eligieron mi elocuencia llamativa, sino el plan concreto que presenté. Esto demuestra que todas y todos ansiamos ya no el caos, sino el orden; no la emoción, sino la razón.\"\n\nHizo una breve pausa y recorrió con la mirada a las estudiantes que llenaban la plaza.\n\n\"Sobre el gran legado que dejó la anterior presidenta del Comité de Disciplina, Sorasaki Hina, yo les prometo: a partir de ahora, Gehenna no se moverá por el carisma impredecible de una heroína, sino por un sistema transparente y racional. Un estado donde todas las estudiantes sean iguales ante la ley, y donde el esfuerzo reciba una recompensa justa. Esa es la nueva Gehenna que deseo construir.\"\n\nCuando su discurso terminó, en la plaza no estalló un júbilo frenético, sino un aplauso lleno de confianza firme y esperanza hacia el futuro. La era de las heroínas se fue, y al fin llegó la era de la administradora."
 GEH_normal_story_event.11.a: "La democracia de Gehenna ha regresado una vez más"

 GEH_normal_story_event.12.t: "¿Arrestar a la autora intelectual?"
 GEH_normal_story_event.12.desc: "\"¡Aquí está! ¡El taller de la subversiva(?) que escribió la obra que insultó a la jefa Hina!\"\n\nCon el grito de Amau Ako, las miembros del Comité de Disciplina derribaron la puerta de un viejo teatro. Tras el retiro de Hina, entre las estudiantes de Gehenna empezó a ponerse de moda una obra titulada 'La mujer de piel de acero'. La obra retrataba a Hina como 'una humana frágil que sufre detrás de la máscara de la presidenta perfecta', provocando la furia de Ako y de otras dirigentes del Comité. Por fin, habían localizado el escondite de la autora principal.\n\n\"¡Ni se mueva! ¡Comité de Disciplina! Ahora mismo, levante las ma-\"\n\nAko, que saltó al escenario que parecía el taller, no pudo continuar. Allí, rodeada por innumerables guiones y montones de papeles arrugados, había una persona sentada sosteniendo una pluma. Demasiado familiar… pero alguien que no debería estar aquí.\n\n\"…¿J-jefa?\"\n\nQuien giró la cabeza fue Sorasaki Hina. Con una pluma en la mano en lugar de un arma, sonrió débilmente hacia sus antiguas subordinadas que habían ido a buscarla.\n\n\"Ako. Qué escándalo… Estás interrumpiendo. Estoy escribiendo.\"\n\n\"¿C-cómo…? ¿Por qué la jefa escribiría algo así…? ¡Esto es una ofensa contra usted! Ah, no, pero si lo escribió usted misma… ¿Eh?\"\n\nCuando Ako gritó, desconcertada, Hina negó despacio con la cabeza.\n\n\"Si no llevaba una máscara… no habría podido aguantar. Esto no es una ofensa, Ako. Es solo… mi historia. Cuando era presidenta del Comité, cada elección decidía el destino de Gehenna, pero aquí… solo tengo que escribir el final que yo quiera. Es mucho más cómodo para el corazón.\"\n\nEn su rostro ya no quedaba la responsabilidad de una presidenta del Comité, ni la angustia de una comandante. Solo permanecía la calma de una persona que completaba su propia historia. Fue entonces cuando Ako por fin lo comprendió: aquel caparazón de 'la presidenta de acero' que ellas intentaron proteger era una armadura que Hina se había quitado por voluntad propia.\n\nHina ya no era presidenta del Comité de Disciplina. Era escritora."
 GEH_normal_story_event.12.a: "¿¡Pueehng?!"

 GEH_celestial_revolution_event.1.t: "Réquiem para una plegaria fosilizada"
 GEH_celestial_revolution_event.1.desc: "La lengua del fuego lamía los papeles de una época envejecida. La plaza de Colonia se había convertido en un gigantesco altar, y sobre él, siglos de intelecto, de arte, de historia, se deshilachaban en mariposas negras y se dispersaban hacia el cielo nocturno. El canto de la multitud que coreaba el nombre de 'Hina' se mezclaba con las llamas que ardían a un ritmo irregular y resonaba como un cántico grotesco que proclamaba el fin de la era de la razón.\n\n\"¡Mirad esa tumba de piedra!\"\n\nGritó, con una voz desgarrada, un alto cargo del comité revolucionario. Su dedo apuntaba, más allá de las llamas, hacia la Catedral de Colonia, cuya enorme silueta emergía en la oscuridad.\n\n\"¡Eso no es una plegaria hacia Dios, sino la obsesión por el tiempo fosilizada! ¡Esa solidez, esa arrogancia de aspirar a la eternidad, no es más que el cristal de ese pensamiento viejo que fue incapaz de soportar a nuestra ausente sol, la verdad viviente que es Sorasaki Hina, y por eso la desterró! ¡La traición también habita en la piedra y en la madera! ¡Debemos incinerar todos los recuerdos de esta tierra para crear el vacío conceptual al que ella pueda regresar! ¡Desmantelad sin dejar nada ese monumento de decadencia y devolvedlo a su estado original!\"\n\nLa multitud se movió como una sola voluntad. El fuego purificador, ahora, empezó a ansiar no solo el sacrificio, sino el propio altar. La colosal estructura de piedra derramó lágrimas negras, y las agujas que perforaban el cielo, tras ofrecer plegarias ya vacías de sentido, finalmente se quebraron y cayeron. Una sinfonía de derrumbe. No era una ejecución para la destrucción, sino un preludio de cenizas para una nueva era.\n\nEn la plaza donde caía una nevada gris, las estudiantes bailaban, embriagadas por un éxtasis religioso. Un cielo vacío. Ese vacío, precisamente, era el nuevo santuario donde descendería el dios que ellas aguardaban."
 GEH_celestial_revolution_event.1.a: "Volveremos a empezar desde la nada."

 GEH_celestial_revolution_event.2.t: "El Gran Diluvio"
 GEH_celestial_revolution_event.2.desc: "La desaparición de Hina no fue más que la mecha. Los miembros comunes del Comité de Disciplina, agotados por la interminable lucha de poder entre el Departamento Ejecutivo y el Departamento de Planificación; los pobres, que gemían en medio del caos; y la ira de los débiles, olvidados en lo más bajo, finalmente estallaron. El recién instalado 'Comité Popular de Salvación Nacional' hablaba del 'juicio del pueblo contra los traidores que atormentaron a la jefa Hina' y, en silencio, observó impasible todo aquel desorden.\n\nEl alto cargo del Departamento de Planificación, arrastrado a la calle, no entendía por qué lo golpeaban. Frente a él no había revolucionarios, sino ciudadanos de rostro hambriento y subordinados del Comité de Disciplina con ojos cargados de desprecio. \"¡Mientras ustedes se sentaban en sus escritorios peleándose por el poder, nosotros pasábamos hambre!\", \"¡Sus jueguitos de papeleo hicieron que la jefa Hina se marchara!\" No había lógica. Solo una ira primitiva que se le derramaba encima.\n\nEn el arsenal estalló el motín. Miembros comunes, con el rostro exhausto, rodearon a un oficial del Departamento Ejecutivo. \"¿A cuántos compañeros mandaste a la muerte por tu gloria?\", \"¿Y con ese fusil tan ‘fuerte’, por qué no pudiste proteger ni a una sola jefa?\" Puños mezclados de rencor y traición cayeron sobre quien una vez fue su superior.\n\nLos informes llovían sin parar, pero el Comité Popular de Salvación Nacional no se movió. A esa purga de sangre la llamaron 'la voluntad del pueblo'. Así, el cerebro y el corazón del Comité de Disciplina fueron arrancados y paralizados por una furia que ascendía desde lo más bajo. La rebelión de los débiles, que nadie había previsto, se convirtió en un monstruo que ya nadie podía controlar y estaba devorando a Gehenna."
 GEH_celestial_revolution_event.2.a: "Un horno donde derretir el Estado y forjarlo de nuevo."

 GEH_celestial_revolution_event.3.t: "La guillotina del antiguo régimen"
 GEH_celestial_revolution_event.3.desc: "La ley desapareció, y solo la 'voluntad del pueblo' se convirtió en el único criterio de veredicto. La hoja del poder judicial, en manos del comité popular, por fin apuntó al corazón del antiguo régimen. La antigua sala de reuniones del Comité de Disciplina se transformó en el 'Tribunal Popular', y en el banquillo de los acusados estaban Amau Ako y Shiromi Iori. Quien las acusaba era un miembro fervoroso que antaño no tenía nombre, ahora compareciendo en nombre del 'Comité Popular de Salvación Nacional'.\n\n\"¡Acusada Amau Ako! Tú ataste la mente de la jefa Hina con el laberinto de papeleo complejo; y tú, acusada Shiromi Iori, roíste el alma de la jefa con el estruendo interminable de los disparos. ¡La incesante lucha de poder entre ustedes dos fue el mayor pecado que empujó a nuestro gran líder al abismo de la desesperación! ¡Ustedes son traidoras de primer nivel, las primeras que esta revolución debe derrocar!\"\n\nAko intentó abrir la boca para exigir legitimidad procesal, pero el martillazo del juez la silenció. Iori escupió insultos, llamándolos 'los verdaderos traidores', pero su voz quedó sepultada bajo los gritos de los miembros comunes del Comité de Disciplina y de los ciudadanos que llenaban el tribunal. El veredicto ya estaba decidido.\n\n\"¡En nombre del Comité Popular de Salvación Nacional, se dicta sentencia! Por el crimen de dividir el Comité de Disciplina y provocar la desaparición de la jefa Hina, a partir de hoy se les despoja a ambas de todos los cargos y autoridades como ejecutivas del Comité de Disciplina.\"\n\nCon Hina ausente, aquel fallo no tenía legitimidad legal. Pero eso no importaba. No era ley: era revolución. Las dos que habían sido el cerebro y el puño del Comité de Disciplina se convirtieron, de la noche a la mañana, en 'traidoras' que lo perdieron todo."
 GEH_celestial_revolution_event.3.a: "Hacia el nuevo sistema."

 GEH_celestial_revolution_event.4.t: "Todos para todos"
 GEH_celestial_revolution_event.4.desc: "El orden murió. Y sobre su cadáver, cientos de libertades celebraban un festival. Con la última declaración del Comité Popular de Salvación Nacional, el aparato central de poder fue desmantelado oficialmente. Ahora, la plaza del distrito central de Gehenna, en lugar de un eslogan unificado, se llenó de cantos con deseos individuales, fuegos artificiales y olor a comida.\n\nQuien subió a la tribuna temporal no fue una líder específica, sino una estudiante sin nombre, elegida al azar por sorteo entre varios consejos. Con una voz desordenada pero rebosante de pasión, empezó a leer la 'Declaración de Fundación de la Comuna'.\n\n\"¡Camaradas! ¿Por qué la jefa del Comité de Disciplina, Sorasaki Hina, se sacrificó? ¡Porque la vieja cáscara del 'orden' llamada Comité de Disciplina y Pandemonium Society reprimía la 'libertad y el caos' propios de Gehenna! ¡Ella se convirtió en mártir para liberarnos de todo lo que nos oprime!\" \n\nLa plaza coreó los nombres de 'libertad' y 'Hina'. Hina ya no renacía como guardiana del orden, sino como liberadora para el caos.\n\n\"¡Por ello declaramos que rompemos la vieja cáscara centralista, y que todo poder ha vuelto a su verdadero dueño! ¡Desde hoy, Gehenna renace como la unión de la División de Desarrollo de Aguas Termales, el Club de Investigación Gourmet, el Departamento de Raciones, y de innumerables sindicatos y consejos autónomos: como la 'Comuna de Gehenna'! ¡Todos los clubes son libres, todos los consejos son iguales, y cada individuo, por sí mismo, es soberano!\" \n\nCuando terminó la declaración, la plaza explotó no con un solo rugido unificado, sino con cientos de consignas y cantos distintos. El Club de Investigación Gourmet disparó salvas festivas, y la División de Desarrollo de Aguas Termales, por supuesto, reventó un pequeño manantial termal en una esquina de la plaza.\n\n¿Era este, de verdad, el mundo que Hina quería? Nadie lo preguntó. Ellos creían que, dentro de esa libertad ruidosa que habían liberado, ella por fin podría dormir en paz. Así, el primer día de la Comuna de Gehenna se apagó entre esperanza y locura."
 GEH_celestial_revolution_event.4.a: "¡Viva la academia del caos y la libertad!."

 GEH_celestial_revolution_event.5.t: "El legado de la santa"
 GEH_celestial_revolution_event.5.desc: "Cuando la locura y las llamas de la purificación se apagaron en Gehenna, llegó un amanecer silencioso. En el blanco monumento recién construido para conmemorar a Hina, se reunieron las figuras centrales de la revolución. En sus rostros ya no ardía el fervor de la destrucción, sino una resolución solemne orientada a la reconstrucción.\n\nQuien subió al estrado fue la última portavoz del Comité Popular de Salvación Nacional. Con una voz serena y clara, abrió la boca.\n\n\"Hemos destruido el viejo mundo que engendró su ausencia. Ahora debemos construir un nuevo mundo del que no nos avergoncemos cuando ella regrese. El camino que seguiremos es el 'sorasakismo'. No es izquierda ni derecha: es adoptar como forma de vida un espíritu sublime de responsabilidad, entrega y orden. El propio caminar de la jefa del Comité de Disciplina, Sorasaki Hina, es nuestra constitución y nuestra doctrina.\"\n\nTras tomar un respiro, declaró con firmeza:\n\n\"Por lo tanto, habiendo cumplido con nuestro deber, anunciamos que desde hoy proclamamos la fundación de la 'Academia Saint Gehenna'.\"\n\n\"Sin embargo, tal como lo fue para la jefa Hina, quien lidere esta santa academia debe probarse no por fanatismo, sino por legitimidad. Siguiendo su voluntad, elegiremos a nuestra líder con nuestras propias manos. ¡Damos inicio a la primera elección para escoger a la primera presidenta del consejo estudiantil de la Academia Saint Gehenna!\"\n\nEn ese instante, lo que llenó el monumento no fue un clamor fanático, sino un aplauso atronador cargado de esperanza. Era como el aplauso de peregrinos que por fin habían hallado el camino. La era de la destrucción terminó. Ahora construirían una nueva era sobre el legado de Hina."
 GEH_celestial_revolution_event.5.a: "Hatami Erika."
 GEH_celestial_revolution_event.5.b: "Hinomiyá Chinatsu."
 GEH_celestial_revolution_event.5.c: "Aikiyo Fuuka."

 GEH_celestial_revolution_event.6.t: "El retorno del orden"
 GEH_celestial_revolution_event.6.desc: "La era del caos terminó. La plaza recuperó el silencio, y de las cenizas donde se apagó el fuego de la revolución empezaba a brotar un nuevo orden. El Comité Popular de Salvación Nacional cumplió su última misión y se disolvió; en su lugar quedó un nuevo órgano de gobierno llamado el 'Comité Sorasaki Hina'. Eran los más tradicionales y autoritarios, los que seguían exactamente los métodos de la época en que Hina gobernaba.\n\nComo su primer edicto, el comité proclamó la fundación del 'Segundo Estado del Orden'.\n\n\"¡Lo que sumió en la desesperación a nuestra salvadora, la jefa del Comité de Disciplina Sorasaki Hina, fue la libertad desordenada y la cultura decadente! ¡Heredaremos el orden perfecto que ella quiso establecer y erradicaremos para siempre a todos los 'traidoristas' que la amenazaron!\"\n\nEl nuevo orden empezó por copiar a la perfección el gobierno del pasado. Todos los decretos que ella firmó resucitaron, y todos los crímenes que ella castigó fueron reprimidos con mayor dureza. El alcance de 'traidorista' se expandió sin límite: cualquiera que albergara la más mínima duda sobre las decisiones del comité era juzgado desenterrando sus pecados pasados.\n\nAhora, en Gehenna, solo existía una voz. No era la voz de una líder viva, sino el espectro de Hina resucitado desde los registros del pasado. El 'Comité Sorasaki Hina' se convirtió en su imitador más perfecto, completando un Estado de orden helado, frío como el hielo y perfectamente calculado."
 GEH_celestial_revolution_event.6.a: "En su nombre, un orden eterno."

 GEH_celestial_revolution_event.7.t: "Está de vacaciones"
 GEH_celestial_revolution_event.7.desc: "Todo era ruido. La alabanza frenética de los miembros fervorosos, los intentos de convertirla en un dios, y el hecho de que esa locura acabara prendiendo una revolución que incendiaba Gehenna entera. Sorasaki Hina huyó de todo ello. Ignoró a la fuerza el caos que desataría la única hoja de renuncia que dejó, y en una playa de un continente desconocido y silencioso, simplemente se estaba rompiendo en silencio.\n\n\n\n\n\nEl sonido de las olas era pacífico, el grito de las gaviotas, ocioso. Hina fingía leer tras sus gafas de sol, cuando en realidad se esforzaba por no pensar en nada. Entonces, una silueta familiar —pero que no debería estar allí— entró bajo la sombra de su sombrilla. Hina alzó la vista sin pensar.\n\n\"...¿Eh?\"\n\nLa otra persona también se detuvo en seco, mirándola. Entre ambas se deslizó un largo y torpe silencio. Quien habló primero fue la otra.\n\n\"...¿Acaso... Sorasaki Hina...?\n\nHina se levantó de un salto sin darse cuenta. Solo había una persona que podía pronunciar su nombre, uno que solo aparecería en panfletos de búsqueda.\n\n\"…¿Presidenta del Consejo Estudiantil General?\"\n\nDos personas que sumieron Kivotos en el caos y desaparecieron se habían encontrado por casualidad en una playa en el otro extremo del mundo. La presidenta del Consejo Estudiantil General sonrió con incomodidad y agitó la mano.\n\n\"Aquí solo soy una estudiante normal. Tú, en cambio... ¿qué haces por aquí?\"\n\"Vacaciones... eh... Y usted, presidenta...\"\n\"Yo... más o menos igual. Por varias cosas...\"\n\nVolvió a caer un silencio incómodo. Ni sobre la horrible revolución que se desataba en Gehenna, ni sobre el desorden que sufría Kivotos, dijeron una palabra. Como conocidos distantes que se encuentran por casualidad en el barrio, solo se tanteaban con la mirada.\n\nQuien rompió el silencio, otra vez, fue la presidenta.\n\n\"Oye... hay una gelatería cerca, ¿te gustaría...\"\n\n\"...Sí.\"\n\nHina respondió breve. En Gehenna, una revolución terrible pretendía purificar el mundo en su nombre; en Kivotos, el caos por su ausencia continuaba. Pero en esa playa de Australia, las dos solo estaban 'de vacaciones'."
 GEH_celestial_revolution_event.7.a: "Ambas caminaron lado a lado hacia la gelatería."

 GEH_iori_story_event.1.t: "Armonía nacional"
 GEH_iori_story_event.1.desc: "Pandemonium Society desapareció. Pero, ¿había llegado de verdad la paz a Gehenna? A altas horas de la noche, la luz del despacho de la jefa del Comité de Disciplina no se apagaba. Sorasaki Hina, con la pluma en la mano, no se movía entre montañas de documentos apilados. La 'Oficina de Guerra' y la 'militarización sistémica' impulsadas por Iori habían logrado, sin duda, derribar a Pandemonium Society. Sin embargo, el precio de la victoria fue brutal. Los problemas que habían quedado reprimidos bajo el estado de guerra se abalanzaban como una presa que estalla: las peticiones interminables de los alemanes, las quejas acumuladas de los estudiantes por la disciplina militar, y el silencio torpe y pesado de unas calles donde por fin habían cesado los disparos.\n\n\"Jefa… ¿otra vez va a pasar la noche en vela?\"\n\nHinomiyá Chinatsu se acercó sin que Hina lo notara y, con una voz preocupada, le ofreció una taza de té caliente. En sus ojos se reflejaba una sincera inquietud por la salud de Hina.\n\n\"Últimamente han aumentado los miembros que acuden a la Enfermería quejándose de presión mental. Ganamos, pero… parece que todos estamos agotados. Usted también, jefa.\"\n\n\"…Estoy bien, Chinatsu. Solo estoy pensando un momento.\"\n\nHina aceptó la taza, pero su mirada siguió clavada en la ciudad oscura tras la ventana. El método de Iori había sido efectivo, sí. Pero lo único que había quedado al final era un orden inestable, sostenido por el miedo. Hina sentía ese aire más pesado que nadie.\n\n\"Que Gehenna haya terminado así… fue para proteger a la academia. Pero en el proceso ignoramos demasiadas cosas. Con la fuerza no se puede gobernar todo. Y si intentamos aplastar solo con fuerza a quienes tienen un trasfondo distinto al nuestro… al final nos darán la espalda. Eso no es lo que queremos, ¿verdad?\"\n\nTodo esto también era su responsabilidad. Porque quien permitió el militarismo radical de Iori—y hasta lo respaldó—para construir la Gehenna actual, fue ella misma.\n\n\"Yo… debo expiar. Debo arreglar lo que rompimos y lograr una 'armonía' en el sentido verdadero. Por los estudiantes de Gehenna… y por todos los alemanes que vivirán con nosotros.\"\n\nComo si al fin hubiera tomado una decisión, Hina se levantó. Sus ojos estaban más firmes que nunca: no era la mirada de una soldado que dirigía una guerra, sino la de una gobernante que debía cargar con el futuro de un país."
 GEH_iori_story_event.1.a: "\"¿La política… siempre fue así de complicada?\""

 GEH_iori_story_event.2.t: "Actualizar"
 GEH_iori_story_event.2.desc: "\"Shiromi Iori. A partir de este momento, quedan suspendidas todas tus funciones como jefa ejecutiva del Comité de Disciplina.\"\n\nEl aire del despacho era tan frío como el hielo. Ante la declaración baja pero tajante de Sorasaki Hina, Iori llegó a dudar de sus propios oídos. Golpeó el escritorio con la palma y gritó.\n\n\"¿¡Qué!? ¿Es una broma, Hina? ¿¡Qué hice mal!? ¡Aplasté a esos bastardos de Pandemonium y unifiqué Gehenna! ¿¡Y ahora me suspendes!?\"\n\nHasta ese instante, Amau Ako había permanecido en silencio con una carpeta en los brazos. Entonces habló con una frialdad cortante.\n\n\"No arme un escándalo, Shiromi Iori. Como responsable de la Oficina de Guerra, usted promovió reclutamiento indiscriminado usando la guerra contra Pandemonium como pretexto, difundió propaganda malintencionada para 'inyectar hostilidad antipandemónium', y lideró una persecución sistemática contra minorías de origen alemán. Todo ello son actos criminales que jamás pueden tolerarse bajo el nombre del 'Comité de Disciplina de Gehenna'.\"\n\n\"¿Eso—eso escrito en un papelito—es mi ‘lista de cargos’? ¡En una guerra hay cosas que se tienen que hacer! Tú, como te la pasas sentada moviendo la pluma, claro que no ibas a entender.\"\n\nJusto cuando Iori, fuera de sí, iba a lanzarse contra Ako, la voz de Hina la detuvo.\n\n\"Basta, Iori.\"\n\nHina se levantó y miró a su vieja compañera con unos ojos cansados.\n\n\"Sé que luchaste por Gehenna. Más que nadie. Pero esa forma de hacerlo… nos convirtió a todos en monstruos. Somos el Comité de Disciplina que protege la norma, no un caudillo que esparce odio. También es grande mi responsabilidad por no haber frenado tu descontrol. Así que esto no es un castigo solo para ti. Es el primer paso para corregir nuestros errores y borrar esta mancha empapada en sangre.\"\n\nIori no podía entender a Hina. Ni quería. Sentía que le negaban todo su sacrificio. Y al final, todo había sido por Hina… pero era Hina quien ahora le apuntaba con la espada.\n\n\"…Traidora.\"\n\nTras escupir esa palabra con desprecio, Hina giró el rostro.\n\n\"Llévensela.\"\n\nLos miembros del Comité de Disciplina, con expresión endurecida, sujetaron a Iori por ambos brazos. Cuando la puerta del despacho se cerró y su resistencia furiosa se perdió por el pasillo, Hina se dejó caer en la silla con un suspiro profundo. Borrar una mancha de sangre… dolía así de mucho."
 GEH_iori_story_event.2.a: "Redefinir la relación."

 GEH_iori_story_event.3.t: "El ave que sangra"
 GEH_iori_story_event.3.desc: "\"Por lo tanto, se desestima toda investigación sobre Shiromi Iori, jefa ejecutiva, y sobre la Oficina de Guerra.\"\n\nEl aire de la sala de reuniones se hundía con un peso insoportable. La declaración de Hina era la conclusión final respecto al 'Informe de efectos secundarios del sistema de guerra' presentado por altos cargos del Departamento de Planificación. El informe señalaba con dureza los daños nacidos del militarismo de Iori: las quejas de los estudiantes por el reclutamiento indiscriminado, la desconfianza por la propaganda maliciosa, y hasta el creciente resentimiento de los residentes de origen alemán.\n\n\"¿Acaso el resultado no lo dice todo? ¡Ganamos! No necesitamos escuchar a esos llorones que se quejan desde el escritorio.\"\n\nIori sonrió satisfecha mientras escupía sus palabras contra la facción opositora. Ako se levantó con el rostro de quien no puede creer lo que oye.\n\n\"¡Jefa! Pero el contenido del informe es un hecho. El abuso de poder que ignora normas y procedimientos debe corregirse. Si seguimos así, la confianza en el Comité de Disciplina se derrumbará.\"\n\nTodas las miradas volvieron a Hina. Ella cerró los ojos en silencio y, como si hubiera tomado una decisión, recorrió la sala con una mirada fría.\n\n\"No diré que no hubo errores. El método fue áspero, y hubo sacrificios. Pero gracias a eso sobrevivimos y unificamos Gehenna. Castigar ahora la espada que usamos para alcanzar la victoria no sería más que negar toda nuestra lucha. Eso solo traería una división y un caos aún mayores.\"\n\nHina se puso de pie y proclamó ante toda la sala:\n\n\"Lo que necesitamos ahora no es juzgar el pasado. Lo que necesitamos es… un orden más fuerte y absoluto para contener este caos y avanzar hacia el futuro. Por lo tanto, extiendo de forma indefinida las facultades de emergencia en tiempos de guerra. Todas las decisiones del Comité de Disciplina se realizarán únicamente a través de mí, la jefa. No aceptaré objeciones.\"\n\nEl rostro de Ako palideció, y entre los planificadores se escaparon gemidos de desesperación. En cambio, en los rostros de Iori y los ejecutivos apareció una sonrisa de victoria. Hina, recibiendo a la vez miradas de rencor y de ovación, pensó: si los estudiantes de Gehenna me dan la espalda… tendré que encontrar un nuevo apoyo. Aunque ese apoyo sea… esos forasteros a los que hasta ahora hemos mantenido sometidos a punta de fusil."
 GEH_iori_story_event.3.a: "\"Si es por el orden… con gusto me convertiré en dictadora.\""

 GEH_iori_story_event.4.t: "Armonía, patria y solidaridad"
 GEH_iori_story_event.4.desc: "Día conmemorativo de la fundación de la 'Federación Gehenna-Deutsch'. La plaza de Múnich estaba repleta de una multitud ordenada. Hina, a cierta distancia del estrado, observaba la escena con un rostro inexpresivo. Los discursos y la ceremonia avanzaban sin contratiempos, tal como se planeó. Los protagonistas de hoy no eran los políticos sobre la tarima, sino los nuevos 'ciudadanos' que llenaban la plaza.\n\nAl final… así termina todo. Hina murmuró en voz baja. El día en que defendió a Iori y proclamó las facultades de emergencia, ya había previsto la avalancha de condenas y resistencia de los estudiantes de Gehenna. Su lealtad no era más que un apoyo condicional, dirigido solo hacia el rumbo que ellos querían. No era algo digno de proteger. Hina no dudó en abandonar esa vieja base de apoyo.\n\nA cambio, obtuvo algo nuevo: los rostros de incontables alemanes que abarrotaban la plaza. La 'Carta Universalista' era para ellos salvación y promesa. Las calles que antes rebosaban disparos y desconfianza recuperaban la quietud bajo la estabilidad garantizada por el Estado. Ese era el resultado de su elección: una armonía perfectamente controlada, comprada al precio de una lealtad vieja.\n\nEntonces ocurrió. Alguien tiró con cuidado del borde del abrigo de Hina. Al voltear, vio a una niña alemana rubia de unos ocho años, mirándola con ojos asustados. En la mano llevaba una flor silvestre, pequeña y humilde.\n\n\"…Esto, para usted.\"\n\nLa niña susurró en un idioma de Kivotos torpe y le extendió la flor. Los padres alemanes, pálidos, intentaron correr al ver el acto inesperado, pero Hina los detuvo con un gesto. Se inclinó despacio para mirar a la niña a los ojos. En la mirada de la niña no estaba el 'jefe del Comité de Disciplina' como objeto de miedo, sino simplemente una persona.\n\n\"Gracias. ¿Cómo te llamas?\"\n\nHina sonrió con sinceridad, por primera vez en mucho tiempo, y aceptó la flor. La sensación de esa pequeña flor en su mano le hizo sentir a la vez el dolor por todo lo que no pudo proteger… y el peso del único valor que, pese a todo, sí logró salvar. Con una sola flor bastaba. Eso era suficiente."
 GEH_iori_story_event.4.a: "\"Sí… con esto basta.\""

 GEH_iori_story_event.5.t: "Elección del presidente del consejo estudiantil de Gehenna. Quizá, por primera vez."
 GEH_iori_story_event.5.desc: "\"Resultado final del escrutinio, total de votantes…\"\n\nLa plaza del distrito central de Gehenna quedó envuelta en un silencio asfixiante. Por primera vez desde la Gran Transferencia, concluyó una elección para escoger a un nuevo presidente del consejo estudiantil siguiendo el procedimiento más democrático estipulado en el 'Reglamento Escolar de Gehenna'. Era la etapa final de la reforma de Sorasaki Hina: investigar los crímenes de guerra de Shiromi Iori, desmantelar el sistema militarizado y regresar al 'Comité de Disciplina original'. La experiencia desconocida de elegir un líder con las manos de los estudiantes, y no por dictado ni dominación, agitó a toda Gehenna.\n\n\"…No hay candidato con mayoría absoluta. En la segunda vuelta, el candidato número 1, Sorasaki Hina, queda confirmada como ganadora con 46.4% de los votos.\"\n\nEn el instante en que la declaración serena de Ako retumbó por los altavoces en toda la plaza, estallaron vítores y suspiros al mismo tiempo. Hina observó la escena en silencio desde abajo del estrado. No fue una victoria aplastante. Más bien, lo correcto era decir que ganó por poco.\n\nEsta elección fue un espejo que reflejaba la realidad fragmentada de Gehenna. Natsume Iroha, exmiembro de Pandemonium y administradora que defendía su competencia, quedó en segundo lugar con un 38.2% y amenazó el puesto de Hina. Eso era una prueba clara de que muchos estudiantes, agotados del militarismo, anhelaban una alternativa distinta al Comité de Disciplina. Y lo que dejó a todos boquiabiertos fue la tasa de votos de Shiromi Iori, quien se postuló pese a estar siendo investigada como criminal de guerra. Con el sólido apoyo del Departamento Ejecutivo, obtuvo un 6.4%: un número que no podía ignorarse. Era la demostración de que los duros no habían muerto y podían alzar la cabeza de nuevo en cualquier momento.\n\n\"Jefa… no, presidenta. Suba al estrado.\"\n\nAko se acercó y habló en voz baja. Hina asintió y subió los escalones despacio. Ovaciones, abucheos y miradas indiferentes dirigidas hacia ella. Ese panorama mezclado era, precisamente, la 'Gehenna normal' que ella quería. Ya no existía el fanatismo ciego del pasado, donde todos la seguían sin cuestionar. En su lugar había voces vivas: dudaban, criticaban y, a veces, se oponían. Aceptar esa realidad amarga y ruidosa… era la expiación auténtica del pasado y el nuevo inicio hacia donde Gehenna debía avanzar. Hina se colocó frente al micrófono y, mirando a todos los estudiantes—tanto a quienes la eligieron como a quienes no—abrió la boca con calma."
 GEH_iori_story_event.5.a: "\"Gracias a todos… por confiar en mí.\""

 GEH_iori_story_event.6.t: "Un ejército armonioso"
 GEH_iori_story_event.6.desc: "\"¡Lealtad!\"\n\nEn el antiguo campo de instrucción de Múnich, bajo una bandera desconocida de negro-rojo-oro, resonó el grito poderoso de soldados alemanes vestidos con uniformes grises. Un oficial de la antigua Wehrmacht, que apenas meses atrás era perseguido y registrado como 'remanente nazi', ahora recibía el saludo desde la tribuna como comandante del '12.º Regimiento de Infantería de Baviera, adscrito a Gehenna'. Era una escena irónica, pero nadie se reía.\n\nLa 'Carta Universalista' proclamada por Sorasaki Hina no fue una simple declaración. Era un contrato que otorgaba a los alemanes derechos y responsabilidades reales al mismo tiempo: reclutamiento igualitario para los germanos y, a cambio, ciudadanía plena y autonomía. No faltaron voces de duda. Algunos se burlaban en las sombras, diciendo que todo era 'un capricho de dictadora' que podía apuñalarlos por la espalda cuando quisiera. Pero esas voces fueron apagándose.\n\nTras el desfile, el comandante volvió a saludar, esta vez hacia la bandera de Gehenna, que ahora era su patria. No era sumisión. Era la determinación de quienes habían ganado la oportunidad de proteger a sus familias y su tierra con sus propias manos. Su lealtad ya no era objeto de sospecha. Ya se había convertido en el cimiento más sólido dentro del nuevo orden de Gehenna."
 GEH_iori_story_event.6.a: "¡El ejército de Gehenna marcha!"

 GEH_iori_story_event.7.t: "Reacción al armonismo"
 GEH_iori_story_event.7.desc: "El rumor era cierto. Shiromi Iori, el puño de acero del Comité de Disciplina, cayó en desgracia, y la Oficina de Guerra que ella lideraba fue disuelta. Cuando la noticia se extendió por toda Baviera, entre los alemanes florecieron al mismo tiempo un alivio cauteloso y una ansiedad profunda. Y hoy, la jefa del Comité de Disciplina, Sorasaki Hina, anunció por radio el comienzo de una nueva era.\n\n\"…La esencia del Comité de Disciplina es proteger la norma y el orden. Últimamente nos hemos apartado de esa esencia. Corregir este error y garantizar que todos los estudiantes de Gehenna y los habitantes de esta tierra puedan vivir con estabilidad… es mi deber.\"\n\nLa voz de Hina sonaba agotada, pero su determinación no vacilaba. Proclamó la creación de la 'Liga Nacional de Armonía de Gehenna', aclarando que no buscaba expansión militar, sino priorizar la estabilidad interna y la reconstrucción. Saber que el vendaval militarista se había calmado hizo que muchos alemanes soltaran un suspiro de alivio.\n\nPero el comunicado posterior de la jefa de la Enfermería, Hinomiyá Chinatsu, enfrió ese alivio hasta dejarlo helado.\n\n\"El orden del Comité de Disciplina se aplicará de manera justa para todos. La seguridad de quienes se adapten y cooperen con el nuevo sistema de armonía será garantizada. Sin embargo, no se tolerará ningún intento de perturbar la norma. Nosotros… no repetiremos los errores del pasado.\"\n\nEl público alemán lo entendió. Esto no era una mano tendida para la reconciliación. Era el inicio de un gobierno más refinado, más sistemático. Donde antes estaban las botas manchadas de sangre, ahora había un bisturí frío de cirugía. Sin opción, tendrían que aceptar la paz gélida que traería esta nueva 'armonía'."
 GEH_iori_story_event.7.a: "...al menos es mejor que antes, ¿no?"

 GEH_iori_story_event.8.t: "Reacción al armonismo"
 GEH_iori_story_event.8.desc: "Gehenna quedó en shock. Sorasaki Hina, al cubrir a su vieja compañera Shiromi Iori y proclamar las 'facultades de emergencia', concentró el poder absoluto en sus manos. Las duras protestas y condenas de los estudiantes se dirigieron a la sede del Comité de Disciplina, pero Hina no se inmutó. En cambio, contra todo pronóstico, le tendió la mano a los alemanes.\n\n\"Los enemigos y aliados de ayer ya no significan nada. Desde hoy, el pueblo de Gehenna se distinguirá únicamente por su lealtad.\"\n\nLa voz de Hina, transmitida por radio, era fría como el acero. Al proclamar la creación de la 'Liga Nacional de Armonía de Gehenna', anunció que permitiría la participación de representantes alemanes dentro de la liga. Además, siguieron declaraciones en cadena: garantía de autonomía para los germanos, igualdad de derechos de propiedad y reducción de la vigilancia del Comité de Disciplina. Era un trato evidente: a cambio de renunciar al apoyo de los estudiantes de Gehenna, ofrecía un pacto a los alemanes.\n\n\"¿Debemos creer esto? Quien nos oprimía ayer, hoy pretende ser nuestro salvador.\"\n\nUn político alemán se enfureció, pero su voz se perdió entre el murmullo de la multitud. La propuesta de Hina era demasiado dulce. Era la promesa de otorgar 'poder' a quienes habían sido oprimidos. Incluso con duda y desconfianza, la opinión pública alemana se inclinó rápidamente hacia esa oportunidad imposible de rechazar.\n\n\"No tenemos elección. Aunque la mano que nos tiende sea un cáliz envenenado… por ahora debemos beber.\"\n\nAl final, los representantes alemanes resolvieron aceptar la propuesta de Hina. No era confianza, sino un contrato frío por supervivencia. A cambio de ponerse del lado de una dictadora, garantizaban la supervivencia del pueblo. Decidieron apostar todo en un juego de la historia."
 GEH_iori_story_event.8.a: "...el Partido Obrero Nacionalsocialista Bávaro queda disuelto a partir de hoy."

 GEH_iori_despotic_story_event.1.t: "Bajo la bandera de Gehenna - 1"
 GEH_iori_despotic_story_event.1.desc: "La pesada puerta de acero de la sala de reuniones se cerró con un estruendo. Los altos mandos del Comité de Disciplina, sumidos en el caos tras la desaparición de Sorasaki Hina, cerraron la boca ante aquel sonido. Miembros del Departamento Ejecutivo, completamente armados, irrumpieron con una precisión milimétrica y sellaron todas las entradas y salidas. Cuando los cañones apuntaron hacia el interior de la sala, el aire se llenó al instante de una presión helada. Shiromi Iori avanzó a zancadas hasta el estrado y aferró el micrófono.\n\n\"¿Por qué se derrumbó la jefa Hina? ¡Porque tuvo que escuchar las quejas de esos alemanes débiles! ¡Porque la martirizaron con el interminable jueguito de papeleo del Departamento de Planificación! ¡Porque olvidamos que somos 'kivotosianos' e intentamos mezclarnos con esos forasteros viles!\"\n\nEl grito de Iori era ira en estado puro. Y entonces lo proclamó ante los jefes aterrados.\n\n\"¡No toleraré más caos! En nombre del Departamento Ejecutivo del Comité de Disciplina, ¡declaro la ley marcial en toda Gehenna a partir de este instante! ¡Todos los miembros, permanezcan en sus puestos! Desde ahora, cualquiera que intente salir por esa puerta será considerado un traidor que abandonó a la jefa Hina, ¡y será arrestado en el acto!\"\n\nEl sonido de los cerrojos al montarse retumbó por la sala. Quien rompió aquel silencio asesino fue la voz de Amau Ako. Se puso de pie y, sin un ápice de miedo, miró fijamente a Iori.\n\n\"Esto es una rebelión, Shiromi Iori. Solo estás usando la tragedia de la jefa Hina como pretexto para llenar tu miserable ambición de poder.\"\n\n\"¡Arresten a esa mujer!\"\n\nEn el instante en que cayó la orden de Iori, estalló una granada cegadora en un rincón de la sala y la visión de todos se volvió blanca. En el caos, algunos planificadores se arrojaron deliberadamente sobre los ejecutivos, y el lugar se convirtió en un pandemonio de gritos y alaridos. Cuando, entre el humo denso, el Departamento Ejecutivo logró recuperar el control, un ayudante informó a Iori con urgencia:\n\n\"¡La administradora principal… se nos escapó! Parece que huyó por un pasaje de emergencia junto con algunos miembros del Departamento de Planificación.\"\n\n\"¡Maldita sea!\"\n\nIori golpeó el estrado con el puño. Había tomado el corazón del Comité de Disciplina, pero dejó escapar a la oposición más crucial.\n\n\"¡Sellen toda la ciudad! ¡Encuéntrenla cueste lo que cueste!\"\n\nLa noche de Gehenna estaba abriendo el telón de sangre y fuego."
 GEH_iori_despotic_story_event.1.a: "\"Aun así… por fin el orden se enderezó.\""

 GEH_iori_despotic_story_event.2.t: "Manifestación masiva en Ratisbona"
 GEH_iori_despotic_story_event.2.desc: "Tras la desaparición de Hina y la proclamación de la ley marcial por parte de Iori, la fractura de Gehenna se convirtió en una realidad irreversible. La 'facción anti-ley marcial (Kriegsrechtsgegner)', liderada por Amau Ako, organizó en Ratisbona una gran manifestación pacífica. Su objetivo era denunciar la injusticia del golpe militar y recuperar la disciplina original del Comité. Los cánticos de \"¡Derogación de la ley marcial!\" y \"¡Devuélvannos la disciplina del Comité!\" resonaban con un orden impecable.\n\nPero para Shiromi Iori, esas voces no eran más que ruido… la chispa de una rebelión que debía extinguirse. Tropas antidisturbios del Departamento Ejecutivo, fuertemente armadas, bloquearon el avance de los manifestantes, y el ambiente pacífico de la plaza se transformó de inmediato en una tensión afilada. A través de un megáfono, Ako insistió hasta el final en la resistencia no violenta.\n\n\"¡Ustedes son miembros del Comité de Disciplina que protegen a los estudiantes de Gehenna, no los soldados privados de Shiromi Iori! ¡No cedan ante la violencia!\"\n\nSin embargo, cuando el enfrentamiento se prolongó, una botella de agua lanzada por un manifestante exaltado se convirtió en la señal que el Departamento Ejecutivo estaba esperando.\n\n\"¡Es un motín! ¡Repriman a todos!\"\n\nLa represión brutal fue instantánea. Frente al gas lacrimógeno y las porras, la manifestación pacífica quedó aplastada sin piedad. Esa noche, el comunicado oficial del Departamento Ejecutivo calificó lo ocurrido en Ratisbona como \"un motín de elementos subversivos que pretendían derrocar al Estado\". Ako y otros cabecillas lograron huir aprovechando el caos, pero numerosos manifestantes fueron arrestados. Aquel 'motín' le dio a Iori el pretexto perfecto para etiquetar a toda oposición como 'terrorista' y aprobar un decreto capaz de arrancarla de raíz."
 GEH_iori_despotic_story_event.2.a: "\"…Amau Ako. De verdad te odio.\""

 GEH_iori_despotic_story_event.3.t: "Bajo la bandera de Gehenna - 2"
 GEH_iori_despotic_story_event.3.desc: "\"¡Booom-!\"\n\nEn las afueras de Ratisbona, la puerta del refugio secreto de la 'facción anti-ley marcial (Kriegsrechtsgegner)' voló en pedazos con una explosión. El recién promulgado 'Decreto del Motín de Ratisbona' otorgó al Departamento Ejecutivo de Shiromi Iori autoridad ilimitada para arrestar y reprimir, sin juicio, a todo 'elemento subversivo anti-Kivotos'. Y el primer objetivo del decreto era Amau Ako.\n\n\"¡Todos, suelten las armas! ¡Quien resista será abatido de inmediato!\"\n\nLos ejecutivos, totalmente armados, irrumpieron en oleadas y sometieron la resistencia en un abrir y cerrar de ojos. En la habitación más interior, Ako, quemando hasta el último documento confidencial, al fin alzó las manos con calma ante decenas de cañones apuntándole. Poco después, Shiromi Iori se plantó frente a ella.\n\n\"Se acabó, Ako. Tu jueguito ridículo de 'oponerte a la ley marcial'.\"\n\nNi siquiera ante el tono burlón de Iori, la mirada de Ako vaciló. Con las pilas de documentos ardiendo a su espalda, habló con la dignidad de una vencedora.\n\n\"Esta no es su victoria. Solo es el éxito temporal de su tiranía, que pisotea la disciplina y la razón. La jefa Hina jamás habría querido que un caudillo como usted tomara el control del Comité de Disciplina.\"\n\n\"¡La jefa Hina desapareció por culpa de burócratas débiles como tú, y de esos alemanes egoístas! Ahora, en su nombre, yo levantaré el verdadero 'orden'. Y tú eras el último estorbo que me lo impedía.\"\n\nIori dio una orden con un gesto de barbilla.\n\n\"Llévensela. Un traidor ni siquiera merece un juicio. Enciérrenla en la prisión más profunda.\"\n\nAun mientras la arrastraban sujetándola de ambos brazos, Ako no apartó de Iori una mirada llena de desprecio. Su resistencia terminó en fracaso. En Gehenna ya no quedaba ninguna voz capaz de oponerse al ruido de las botas del Departamento Ejecutivo. En el lugar que dejó Ako solo quedaron cenizas de papel quemado… y una oscuridad profunda."
 GEH_iori_despotic_story_event.3.a: "\"Vamos, sonrían. ¿Por qué están así?\""

 GEH_iori_despotic_story_event.4.t: "Nuestra patria libre y hermosa"
 GEH_iori_despotic_story_event.4.desc: "El vacío de poder que dejó la ausencia de Hina empujó a Gehenna a la locura. Hoy, la plaza del distrito central estaba abarrotada de miembros del Departamento Ejecutivo y estudiantes radicales que apoyaban a Shiromi Iori. Para sofocar la resistencia de la 'facción anti-ley marcial' y las quejas internas, Iori necesitaba unir a sus partidarios en una sola organización política gigantesca.\n\n\"¡Estudiantes! ¿Por qué nuestra gran líder, la jefa Hina, nos abandonó?\"\n\nCon el grito de Iori desde el estrado, la plaza quedó en silencio al instante.\n\n\"¡Fue por el jueguito de papeleo de unos burócratas débiles… y por las agitaciones de forasteros viles que devoran nuestra cultura pura! ¡Ellos no comprenden nuestro gran espíritu! ¡Nosotros, que portamos Halo, somos la humanidad verdaderamente avanzada! ¡Quien debe ser dueño de esta tierra somos nosotros, los estudiantes de Gehenna!\"\n\nLa plaza respondió con un rugido de entusiasmo. Iori se apoyó en ese fervor y continuó:\n\n\"¡No habrá más división! ¡Para aplastar la resistencia de los traidores y proteger la cultura pura de Gehenna-Kivotos, necesitamos una poderosa alianza entre estudiantes, ciudadanos y gobierno! ¡Hoy, desde aquí, proclamo la fundación de la 'Liga de Defensa de la Patria Libre'! ¡Esto no es una simple organización! ¡Es nuestra identidad, y es nuestra lucha por sobrevivir! ¡Por Gehenna!\"\n\nCuando terminó su declaración, la plaza quedó cubierta por cánticos de \"¡Iori! ¡Iori!\". Bajo la bandera del Comité de Disciplina, un nuevo tiempo estaba alzando el telón: armado con pureza… y locura."
 GEH_iori_despotic_story_event.4.a: "¡Una patria, un pueblo, una líder!"

 GEH_iori_despotic_story_event.5.t: "Apoyándose en un pasado sombrío"
 GEH_iori_despotic_story_event.5.desc: "Tras la desaparición de Hina, en el Comité de Disciplina solo quedaban un silencio pesado y una pérdida profunda. Shiromi Iori rompió ese silencio y convocó a todos los miembros. No fue en la plaza, sino en el gran salón de conferencias, de atmósfera solemne. La voz de Iori desde el estrado no traía su ira habitual, sino una tristeza honda.\n\n\"Sé que todos están cansados. Nuestra luz, la jefa Hina… ya no está con nosotros.\"\n\nIori hizo una pausa, respiró hondo.\n\n\"¿Por qué llegamos a esto? Motines interminables de clubes, terrorismo de organizaciones rebeldes de origen alemán… Gehenna fue contaminada por demasiado caos. ¡Y toda esa confusión empujó a la jefa al borde del abismo!\"\n\nLa fuerza de su apelación dejó a todos en la sala con el ánimo encogido.\n\n\"Ahora Gehenna necesita sanar. Debemos limpiar esta contaminación y levantar de nuevo la patria destrozada. Por eso, desde hoy, declaro la creación del 'Comité de Reconstrucción del Estado Confederado'. Esto no es una pelea de facciones. Es una tarea sagrada para reconstruir la Gehenna que la jefa Hina quiso proteger. Quien no participe en esta reconstrucción será considerado alguien que traiciona su voluntad.\"\n\nEl llamamiento de Iori no estaba lleno de furia, sino de dolor y determinación. Lo que llenó el salón no fue un clamor fanático, sino un aplauso de resolución solemne. Pisando la tragedia de Hina, comenzaba una nueva era: 'purificar' y 'reconstruir' Gehenna."
 GEH_iori_despotic_story_event.5.a: "¡Por la reconstrucción de la nueva Gehenna!"

 GEH_iori_despotic_story_event.6.t: "¿Héroe… o escalón?"
 GEH_iori_despotic_story_event.6.desc: "Gehenna, por fin, fue purificada. La 'Liga de Defensa de la Patria Libre' de Shiromi Iori purgó a toda oposición y estableció la 'cultura pura de Kivotos' como la única ideología del Estado. Ahora, ella era la 'líder de la nación y la patria' en todos los sentidos. Sobre su escritorio yacían dos versiones finales del monumento que se erigiría en la plaza central de la capital: una mostraba a Sorasaki Hina, con alas negras desplegadas, erguida con determinación; la otra mostraba a la propia Iori avanzando con un arma en las manos.\n\n'Hina, jefa…'\n\nIori tomó el diseño de Hina. Convertirla en 'mártir' y 'símbolo eterno'. Una heroína trágica caída al luchar contra la contaminación de los forasteros. Era el pretexto perfecto que Iori había usado para tomar el poder. Si convertía su nombre en mito, la legitimidad del Estado que había construido quedaría asentada sobre roca. Tal vez, incluso, sería su último homenaje a la superior que había seguido.\n\nPero entonces Iori desvió la vista hacia el otro diseño: su propia estatua.\n\n'…Al final, tú te quebraste.'\n\nHina fue fuerte, pero no soportó todo aquel caos y desapareció. Quien levantó el orden sobre esas ruinas y lavó la 'contaminación' fue ella: Shiromi Iori. Un país no puede tener dos soles. Un país que adora al fantasma del pasado, y no a una líder viva, no puede avanzar. Si el mito de Hina crecía demasiado, algún día esa sombra podría devorar su autoridad. Para abrir de verdad la 'era de Iori', tenía que superar esa montaña llamada Hina.\n\nIori alternó la mirada entre ambos planos. No era solo escoger un monumento. Era colocar el último mojón del país que ella había creado. ¿Hina quedaría como mito eterno para la patria… o como un cimiento para la era de Shiromi Iori? Iori tenía que tomar, por fin, la última decisión."
 GEH_iori_despotic_story_event.6.a: "La jefa Hina permanecerá como nuestro símbolo eterno."
 GEH_iori_despotic_story_event.6.b: "El pasado no es más que pasado."

 GEH_iori_despotic_story_event.7.t: "El asiento vacío"
 GEH_iori_despotic_story_event.7.desc: "Gehenna fue reconstruida. Las heridas profundas y el caos que dejó la desaparición de Hina fueron sellados por el férreo orden del 'Comité de Reconstrucción del Estado Confederado' de Shiromi Iori. Gehenna y alemanes, antes divididos, fueron forzados a fundirse bajo un solo nombre: Gehenna. Todos los 'terroristas' fueron eliminados. Iori, al fin, completó la 'sanación' y la 'reconstrucción' que se propuso.\n\nEn una noche tardía, tras terminar todo el trabajo, Iori visitó sola el antiguo despacho de la jefa del Comité de Disciplina. Un lugar donde el tiempo parecía haberse detenido desde el día en que Hina desapareció. La silla donde se sentaba, la ventana que acariciaba, la vista nocturna de Gehenna que contemplaba… todo seguía igual. Iori miró en silencio durante mucho rato la silla vacía, colocada en el centro de la habitación.\n\n'Hina, jefa… si tú estuvieras aquí, ¿qué habrías hecho?'\n\nYo no soy tan lista como tú. No entiendo ese papeleo complicado. Yo solo… quería arreglar lo roto y proteger esta Gehenna que tú intentaste salvaguardar. Usé la tristeza que dejaste como justificación y al final reconstruí Gehenna de esta manera… ¿era esto lo que tú querías?\n\nNo lo sabía. Ya no quedaba nadie que pudiera responder. Iori decidió no mirar más hacia atrás. En silencio giró el cuerpo y tomó el pomo de la puerta, para caminar hacia el futuro de Gehenna: el orden que ella creó, la Gehenna que ella reconstruyó.\n\n\"Clic.\"\n\nCon el sonido de la puerta al cerrarse, el despacho volvió a hundirse en una oscuridad profunda y silenciosa."
 GEH_iori_despotic_story_event.7.a: "\"Ya… toca seguir adelante.\""

 GEH.flavor_event.1.t: "Conexión a internet"
 GEH.flavor_event.1.desc: "*Haruna0301\n¡Por fin el Comité de Disciplina también tiene internet! Felicidades.\nDespués del Gran Traslado, han disminuido mucho los restaurantes que venden comida rica...\n\n*Haruna0301\nMe gustaría pasarme una vez por el Comité de Disciplina y hacer una salida de exploración gastronómica.\nJeje, ¿puedo emocionarme?\n\n*realHinaSorasaki\nNo vengas.\n\n*Haruna0301\nAy, por Dios.\nMe alegra saber que, incluso estando ocupadísima, parece que sí tiene tiempo de usar redes en horario laboral.\n\n*realHinaSorasaki\n--\n\n*Haruna0301\nJeje, era broma.\nGehenna se volvió tan grande que todavía no he podido recorrer todos los restaurantes nuevos del norte.\n\n*Haruna0301\nDejaré la visita al Comité para otra ocasión, cuando se dé la oportunidad :)"
 GEH.flavor_event.1.a: "\"Por eso mismo: que no vengas...\""

 GEH.flavor_event.2.t: "¡En fin, la culpa es de ese mapache!"
 GEH.flavor_event.2.desc: "\"¡Ya pasaron dos meses desde el Gran Traslado! ¿Y me estás diciendo que el Departamento de Inteligencia, hasta ahora, no ha encontrado *nada*? ¡Eso no tiene sentido! ¡No puede ser!\"\n\nAko, pisoteando el suelo con rabia, fue señalando uno por uno a los agentes del Departamento de Inteligencia del Comité, que tenían la cabeza gacha.\n\n\"¡Ustedes saben perfectamente cuánto está sufriendo la jefa Hina por exceso de trabajo...! ¿Por qué nadie ha traído información sobre cómo diablos el Pandemonium Society nos mandó a otro universo? ¡¿Por qué nadie sabe nada?!\"\n\nUno de los agentes, en ese ambiente gélido, logró abrir la boca con esfuerzo.\n\n\"Lo sentimos, administradora principal. Pero... tras una investigación exhaustiva, no encontramos ninguna evidencia de que el Pandemonium Society haya provocado el Gran Traslado de forma deliberada...\"\n\"¡El mapache del Pandemonium! ¡¿Si no fue Hanuma Makoto, entonces quién demonios fue?! ¡¿Quién más podría estar molestando a la jefa Hina a propósito?! ¿¡Acaso lo provoqué yo!? ¿¡Eso es lo que están pensando!? ¿¡Eh!?\"\n\"No, no es eso. Pero...\"\n\nEl regaño, que parecía no terminar nunca, solo concluyó después de una hora. Ako también sabía lo que significaba que, tras dos meses de investigación, no hubiera salido absolutamente nada. Pero... si no era Makoto, entonces ¿qué era, en realidad, la causa del Gran Traslado?\n\nSi no conocían el método, tampoco había camino de regreso. Y si no había camino de regreso, tampoco existía una manera de reducir la carga de trabajo de Hina, que se había multiplicado varias veces desde el Gran Traslado. Era ese hecho cruel el que Ako —a quien le gustaba Hina— no quería aceptar."
 GEH.flavor_event.2.a: "\"...Está bien. Desde hoy, suspendemos la investigación sobre el Pandemonium.\""

 GEH.flavor_event.3.t: "¡En fin, el 'retro-traslado' sí es posible!"
 GEH.flavor_event.3.desc: "\"Si el Gran Traslado es posible, entonces el retro-traslado tampoco debería ser imposible. ¿No cree?\"\n\nAnte la pregunta de Ako, Chinatsu, que estaba tomando notas en unos documentos, ladeó la cabeza.\n\n\"No lo sé. Ni siquiera entendemos el principio del Gran Traslado.\"\n\"El principio es sencillo. ¿No crees que usaron Misticismo?\"\n\"¿Misticismo...?\"\n\"Sí. Si no, no tendría sentido que pudieran mandar a todo Kivotos a otro universo.\"\n\nCon el rostro hundido en pensamientos, Ako caminó despacio trazando un círculo dentro del despacho.\n\n\"Misticismo... Tal vez, si reunimos muchos Tejedores de Misticismo y concentramos su poder... podríamos crear un portal. No, según mis cálculos... ¡es posible! ¡Tengo que reunir los Tejedores de Misticismo del Comité de Disciplina!\""
 GEH.flavor_event.3.a: "\"...Jefa Hina. ¡Sí o sí la ayudaré!\""
 
 GEH.flavor_event.4.t: "¡Cometí un pecado imperdonable..."
 GEH.flavor_event.4.desc: "¡¡¡KRAAAANG!!!\n\nCon un golpe brutal, todas las ventanas estallaron a la vez. ¿Un atentado con bombas del Ejército Nacional? Sobresaltada, Hina agarró su arma y se asomó hacia las ventanas rotas de su despacho. Frente al edificio del Comité de Disciplina, alto como una torre, un enorme portal ardía con llamas negras.\n\nBastó un interrogatorio breve para entenderlo. Aparentemente, Ako había modificado un Tejedor de Misticismo para crear un portal \"de regreso al mundo original\"; pero en cuanto lo puso a prueba, provocó una explosión gigantesca.\n\n'El motivo... era que, si volvíamos a Kivotos, su trabajo como jefa probablemente se reduciría...'\n\nHina miró a Ako, que estaba de rodillas como una prisionera esperando la guillotina. Un incidente tan grande como para obligarla a escribir unas 200 cartas de arrepentimiento. Pero Hina también podía entender por qué Ako había hecho algo así.\n\n\"Levántate, Ako.\"\n\"P-pero, jefa... por mi culpa, le he causado problemas a la jefa Hina...\"\n\"Nunca he pensado que tus esfuerzos fueran una carga.\"\n\nHina extendió la mano hacia Ako, que seguía de rodillas."
 GEH.flavor_event.4.a: "\"Gracias por preocuparte por mí.\""
 
 GEH.flavor_event.5.t: "¿Lucha por la democracia...?"
 GEH.flavor_event.5.desc: "\"¡Implementen elección directa para la jefatura del Comité de Disciplina!\"\n\"¡Sorasaki debe renunciar como jefa del Comité de Disciplina!\"\n\nPor muy alto que fuera el edificio del Comité —una especie de rascacielos en forma de torre—, las voces de los manifestantes reunidos frente a la sede retumbaban hasta el despacho de Hina, en el último piso. Mientras caminaba por el pasillo, el rostro de Hina se fue endureciendo poco a poco.\n\n\"...¿Qué está pasando afuera?\"\n\nAko, como si estuviera harta, miró por la ventana con desprecio.\n\n\"Desde el Gran Traslado, hemos impuesto varias regulaciones de armas para que los estudiantes de Gehenna no lastimen a los locales... y parece que surgieron estudiantes que están en contra de usted, jefa. Dicen que si cambiamos a elección directa, como el presidente del Pandemonium...\"\n\"Que entonces podrían bajarme.\"\n\nHina dejó escapar un suspiro.\n\n\"Si los estudiantes quieren que yo baje, entonces debo bajar. Si la elección directa es un mejor camino para todos, tampoco pienso negarlo.\"\n\"¡J-jefa?!\"\n\"Pero si la razón para elegir un nuevo jefe es solo porque quieren dispararle a los locales aunque sea una vez... eso sí no lo puedo aceptar.\"\n\nHina cerró la ventana del Comité, que estaba ligeramente abierta. Todavía ni siquiera existía una estadística clara de cuántos tiroteos indiscriminados habían cometido los estudiantes de Gehenna contra los locales, desde Luxemburgo hasta Bélgica, justo después del Gran Traslado.\n\nAl menos en esta tierra… no podía permitir que eso volviera a ocurrir."
 GEH.flavor_event.5.a: "Los gritos de los estudiantes de Gehenna continuaron durante un buen rato."
 
 GEH.flavor_event.6.t: "Bauhaus"
 GEH.flavor_event.6.desc: "\"El mayor problema de la sede del Comité de Disciplina es que el edificio es absurdamente grande en relación con el personal: hasta resulta ineficiente. Entiendo que, al ser una organización militar, quisieran dar una impresión autoritaria, pero con un pasillo de este ancho, hasta un tanque podría circular. Así, la eficiencia de calefacción y refrigeración debe ser horrible.\"\n\nPor seguridad interna solo se permitió el acceso hasta el segundo piso, pero el profesor Mies dio vueltas una y otra vez por las áreas autorizadas, señalando uno por uno los defectos del edificio.\n\n\"Y dijeron que concentraron las oficinas de los altos mandos en los pisos superiores. ¿Han contemplado qué pasaría si hubiera un atentado en un edificio tan alto? Aunque existiera un búnker subterráneo, el mando podría ser aniquilado antes de siquiera llegar abajo.\"\n\nEscuchar regaños de un adulto local no era nada agradable, pero Ako forzó una sonrisa y anotó todo en su libreta. Ella misma había tenido que subir y bajar escaleras en ese edificio cuando se fue la luz, así que entendía de sobra los problemas de una torre alta solo por ser alta.\n\n\"De acuerdo. Ya llevaba tiempo pensando que, algún día, tendríamos que construir una nueva sede. Tomaré todo lo que dijo como referencia para la arquitectura del futuro.\"\n\"Gracias. Y ahora, sobre la alfombra del piso de esta sede...\""
 GEH.flavor_event.6.a: "Mies no se fue sino hasta varias horas después."
 
 GEH.flavor_event.7.t: "Exposición de arte degenerado"
 GEH.flavor_event.7.desc: "Ako contempló las pinturas de Karl Schmidt-Rottluff colgadas en el museo, preguntándose por qué sus obras habían sido criticadas como arte 'degenerado'. Comparadas con el postmodernismo que ella conocía, le parecían incluso más fáciles de entender. ¿Acaso el nivel cultural de Deutschland ni siquiera llegaba a eso?\n\n\"No son malas pinturas. Y dicen que también está dando clases de arte para los estudiantes de Gehenna con bastante dedicación...\"\n\nNo pudo conocer a Rottluff en persona, pero en la tienda de recuerdos del museo compró una copia de una de sus pinturas. ¿Quién sabe? Tal vez la jefa Hina se alegraría con ese regalo."
 GEH.flavor_event.7.a: "El arte tiene un poder sorprendente."
 
 GEH.flavor_event.8.t: "La belleza de la música"
 GEH.flavor_event.8.desc: "El joven estudiante extranjero Ahn Eak-tae caminó por el pasillo de aulas del Conservatorio de Música Gehenna-Baviera. Los nuevos géneros de Gehenna —rock, jazz, hip hop— eran un mundo tan asombroso para Ahn, que había dedicado su vida al estudio de la música clásica en Estados Unidos, que rozaba lo inverosímil. Todo lo que aprendía en aquel conservatorio era una experiencia nueva.\n\n\"Profesor, quería consultarle sobre mi tesis doctoral...\"\n\nPero en el momento en que entró al estudio del profesor Richard Strauss, con la puerta ya abierta, Ahn encontró a Sorasaki Hina sentada frente al piano de Strauss, tocando las teclas con las yemas temblorosas. Strauss, con una sonrisa satisfecha, estaba detrás de ella, observándola mientras tocaba.\n\n\"Aprende bastante rápido. ¿No le interesaría ser pianista cuando deje el Comité de Disciplina?\"\n\"...Solo lo hago porque Ako me dijo que, al parecer, también necesito un hobby. Eso de ser pianista no va conmigo.\"\n\"Si existe el deseo de regalarle a alguien una melodía hermosa, entonces en ese instante ya es usted pianista. No se necesita ningún 'título'. ...¿Verdad, Ahn?\"\n\nStrauss sonrió ampliamente, se acercó a Ahn y le arrebató con naturalidad el borrador de la tesis doctoral, aún sin revisar.\n\n\"¿Podrías darnos un momento a esta dama y a mí? Después de leer tu tesis, te contactaré por MomoTalk.\""
 GEH.flavor_event.8.a: "\"A-ah... entendido, profesor.\""
 
 GEH.flavor_event.9.t: "Promulgación de la Ley de Derechos Civiles"
 GEH.flavor_event.9.desc: "\"Una ley de derechos civiles de la Agencia 68... si soy sincera, no es que me encante.\"\n\nAko se quejó mientras leía el borrador de la ley que el Comité de Disciplina pensaba anunciar. Claro: sabía que Onikata Kayoko era un talento brillante, al punto de que incluso Ako tenía que reconocerlo. Pero usar la ley tal cual... le daba la sensación de estar admitiendo su propia insuficiencia. Y ese berrinche le salió solo.\n\nIori se estiró con pereza, como si le diera flojera.\n\n\"Si lo piensas bien, ¿importa quién la haya escrito? Lo único importante es si ayuda a la gente o no. Eso y ya.\"\n\"Eso... sí. Tiene razón. Creo que me lo tomé demasiado a pecho.\"\n\nLa razón de existir del Comité de Disciplina era proteger a la gente del crimen. Eso no cambiaba, ni antes ni después del Gran Traslado. Ako decidió dejar de darle vueltas."
 GEH.flavor_event.9.a: "Sea una bomba de Millennium o una bomba de Trinity, con que explote… ¿no basta?"
 
 GEH.flavor_event.10.t: "¡¿Y el Comité de Disciplina qué está haciendo?!"
 GEH.flavor_event.10.desc: "\"¡¿Cómo que la tormenta de arena de Abydos va a cubrir por completo el distrito sur de Gehenna?! ¡¿Eso tiene algún sentido?!\"\n\nMientras un felino antropomorfo —obligado a cerrar su negocio por la tormenta— les reclamaba furioso a los miembros del Comité, Iori paleaba con ganas los montículos de arena que se habían acumulado como una pared. ¿Abydos o como se llame, por qué demonios Gehenna tiene que sufrir por culpa de una academia tan rara? Y encima, esto ni parece que vaya a terminar.\n\n\"Ugh...\"\n\nChinatsu le extendió una botella de agua a una Iori agotada.\n\n\"Modere un poco el ritmo. Podría deshidratarse.\"\n\"¿Eh? Gracias.\"\n\"De cualquier forma, una tormenta de arena... suena tan irreal como el Gran Traslado. Entiendo que los comerciantes locales protesten, pero...\"\n\nQue una tormenta de arena llegara volando al distrito sur de Gehenna no era algo que pudiera preverse. Lo único que podía hacer el Comité era sacar la arena que cubría la zona comercial y rezar para que esa tormenta maldita se disipara lo antes posible."
 GEH.flavor_event.10.a: "¡Te maldigo, Abydos!"
 
 GEH.flavor_event.11.t: "Abolición de las Regulaciones de Luxemburgo"
 GEH.flavor_event.11.desc: "Aplicar un control estricto de armas, dirigido por el Estado, y confiscar armamento a los kivotosianos —que cargaban granadas y armas como si fueran accesorios— era una tarea tremendamente difícil. Y para el Comité de Disciplina, que ya estaba rozando el límite administrativo tras la gran expansión territorial después del Gran Traslado, era todavía peor. Tras largas reuniones, se llegó a la conclusión de que mantener las Regulaciones de Luxemburgo era imposible.\n\n\"Lo bueno es que esta ley, durante al menos dos meses después del Gran Traslado, evitó masacres. Y ahora los kivotosianos ya entendieron lo débiles que son los locales...\" \n\nAko habló mientras entregaba a otros directivos el documento de abolición.\n\n\"Que se abolan las Regulaciones de Luxemburgo no significa que de inmediato vaya a haber masacres o crímenes con armas. Pero sí tendremos que mantener personal del Comité de forma permanente en las zonas residenciales de los alemanes, y reforzar las patrullas de seguridad. Y lo mejor sería... seguir con la política de segregación entre kivotosianos y alemanes. Al menos hasta que podamos entender por completo nuestras diferencias.\""
 GEH.flavor_event.11.a: "Aun así, esta ley tuvo un significado suficiente."
 
 GEH.flavor_event.12.t: "Aplastando la amenaza del Ejército Nacional"
 GEH.flavor_event.12.desc: "Gracias a los esfuerzos de [GEH.GetLeader], jefe del Comité de Disciplina, y del leal Comité de Disciplina de Gehenna,\n\nnos complace anunciar que la amenaza del grupo criminal caudillista que sigue el nacionalsocialismo, el llamado 'Ejército Nacional', ha sido aplastada en toda Baviera. Con el fin de salvaguardar la paz de Gehenna y los derechos e incluso la dignidad humana de los kivotosianos, el Comité de Disciplina continuará su política de cero tolerancia contra los caudillos nazis.\n\nProclama del Comité de Disciplina de Gehenna"
 GEH.flavor_event.12.a: "La propaganda de la victoria apareció en la primera plana del periódico más importante."
 
 GEH.flavor_event.13.t: "Tratamiento del trastorno mental de Rikuhachima Aru"
 GEH.flavor_event.13.desc: "Tras incorporar a la Agencia 68 al Comité de Disciplina de Gehenna, el bando de [GEH.GetLeader] se enteró tardíamente de que la Agencia 68 había caído en una grave fragmentación por conflictos internos. El choque entre Onikata Kayoko, que defendía una política moderada hacia los locales, y Asagi Mutsuki, que se oponía. Y en medio, Aru no soportó la división entre sus amigas y estaba sufriendo depresión.\n\nTras una breve entrevista con el Departamento Médico, se reveló que Aru padecía depresión y que, para ocultarlo de sus compañeras, estaba recurriendo al alcohol como 'autotratamiento'. Para atender tanto el estado de su hígado como el problema del trastorno mental abandonado sin tratamiento médico adecuado, el Departamento Médico del Comité decidió aplicar terapia psicológica y tratamiento farmacológico para Aru.\n\nSanar el conflicto entre las miembros de la Agencia y las heridas mentales de Aru tomará mucho tiempo. Sin embargo, Chinatsu presentó un informe esperanzador: con tiempo suficiente, sería posible ir resolviendo sus problemas uno por uno."
 GEH.flavor_event.13.a: "Espero que pueda recuperar la pureza que tenía en sus días de Kivotos."

 GEH.flavor_event.14.t: "Amau Ako, llamada telefónica en estado de ebriedad"
 GEH.flavor_event.14.desc: "¡Yo...! ¡No quiero que te estés riendo en un lugar donde yo no estoy, jefa Hina! ¡Y odio que le agarres la mano a otra chica! ¡Quiero que lo hagas conmigo, solo conmigo! ¡Quería que estuvieras conmigo! ¡Quería ir al festival también! Y si tú estabas disfrutando, si estabas sonriendo, ¡yo quería estar ahí a tu lado! ¡Eso me gusta! Me duele la cabeza, me duele, siento que me voy a volver loca de tanto pensar en la jefa Hina... Esperé que me llamaras. A veces háblame, dime algo, no quiero ser la única así; ¿a ti tampoco te importo ni un poco...? ¿Ni un poquito? ¿Nada? ¿Solo soy una amiga? ¿Una amiga normal? No quiero que sea normal. Aunque sea solo un poco mejor que lo normal, me gusta que no sea normal... Eh, Hina, ¿qué hago? ¿Sí? ¿Me estás escuchando? Escúchame. ¿Estás pensando algo al oír mi voz? ¿Estás pensando en mí? Está bien, lo que sea, pero piensa algo. Lo necesito. ¿No puedo desear eso? ¡Hina! Jefa Hina, o sea... me gustas. No necesito a nadie más. No necesito nada... con tal de que seas tú, me basta. No es que esté siendo caprichosa: con una me basta, solo una. Los demás pueden desaparecer, no los necesito, pero ¿por qué tú te vas para allá? Ven para acá, ven para acá y quédate a mi lado, no te alejes. No quiero. La que está a tu lado soy yo, yo quiero estar ahí, déjame estar... ¿No puedo? ¿Qué está mal? Si me dices, lo arreglo. Lo arreglo, te lo juro, lo voy a arreglar, por favor, enséñame, quiero oírlo. ¿Qué tengo que decir? ¿Qué hago? ¿Vuelo? ¿Corro? ¿Te agarro la mano? Aunque intente todo, ni me miras... ¿qué tengo que hacer? ¿Cómo hago para que nadie... Hina, quiero oír tu voz... dime algo, tranquilízame. Pero no me gusta que sonrías mirando a otra persona: sonríeme a mí, sonríe... Me duele la cabeza, también el estómago... Me preocupaba, ¿por qué no me llamaste? Dímelo, quiero saberlo. Quiero saber de ti, Hina. Desde hace rato, mi corazón da vueltas y digo lo mismo, pero no puedo evitarlo, no puedo, porque solo pienso en ti... Solo en ti. Aunque todo se vuelva Hina... porque eres importante, y quiero tratarte como algo importante. Si no es importante, no me sirve. Así que mírame, Hina. No me gusta que no me mires... No me gusta... otra chica... No me gusta. ¿Te vas a ir otra vez? ¿Vas a ir a algún lado? ¿Vas a ir al centro con alguien? ¿A donde fuiste conmigo, pero con otra? Eso no. ¡No lo sobreescribas! Yo lo recuerdo todo, y si lo sobreescribes... si vuelves a ir, ¿esta vez es distinto? ¿Ves lo mismo pero ves otra cosa? Eso no. No, no, no. Quiero compartirlo contigo, lo mismo, saberlo juntas... Es raro, ¿no? Yo estoy rara, sé que estoy rara, pero me puse rara porque... no sales de mi cabeza. Incluso ahora... Hi... na... Uaaah, hic, hic, hng... Hina, Hi... jefa... hng... Hina, tu Hina... Hina, Hina, Hina... Me gustas. Me gustas, por eso. Así que tú también... oye, por favor, Hina... tú también, tú también... Hina."
 GEH.flavor_event.14.a: "\"Qué fastidio...\""

 GEH.flavor_event.15.t: "Correo del jefe del Departamento de Inteligencia"
 GEH.flavor_event.15.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nDesde el Gran Traslado, el Departamento de Inteligencia del Comité de Disciplina ha continuado investigando, en toda Baviera y otras regiones de Deutschland, a individuos peligrosos que podrían convertirse en una amenaza para el sistema de Gehenna.\n\nEn adelante, deseamos informarle sobre las personas que representen una amenaza para el Comité, por lo que le solicitamos que sea usted quien determine si deben tomarse medidas contra ellas.\n\nAtentamente,\nDepartamento de Inteligencia del Comité de Disciplina"
 GEH.flavor_event.15.a: "[GEH.GetLeader] cerró la bandeja de entrada."

 GEH.flavor_event.16.t: "Solicitud de Inteligencia: propuesta de reemplazo de la administradora principal"
 GEH.flavor_event.16.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nTras una investigación exhaustiva de antecedentes sobre la administradora principal Amau Ako, el Departamento de Inteligencia ha determinado que los sentimientos de la administradora Ako hacia usted han alcanzado un nivel de riesgo.\n\nEs evidente que la administradora principal no siente por usted respeto como superior jerárquico, sino sentimientos románticos homosexuales; y considerando la personalidad paranoide de Ako, el Departamento de Inteligencia analiza que existe una alta probabilidad de que intente acciones peligrosas como secuestro o confinamiento contra usted.\n\nLa alternativa racional es permitir que nuestro Departamento de Inteligencia seleccione a una nueva administradora principal. Nuestro departamento, basado en la racionalidad y la razón, le servirá con lealtad a su lado; y a diferencia de Amau Ako, una burócrata del Departamento de Planificación que no hace nada más que consumir presupuesto..."
 GEH.flavor_event.16.a: "\"...¿Qué demonios creen que es Ako?\""

 GEH.flavor_event.17.t: "Solicitud de Inteligencia: propuesta de investigar a Anton Drexler"
 GEH.flavor_event.17.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nEl Departamento de Inteligencia ha descubierto que el inicio del movimiento nacionalsocialista en Deutschland provino de un local llamado Anton Drexler. Es el fundador del Partido Nazi y un antiguo compañero político de Adolf Hitler. Sin embargo, debido al Gran Traslado, y dado que residía en Múnich (Baviera) cuando Berlín desapareció, todavía permanece dentro de nuestro Estado.\n\nQue el fundador del Partido Nazi esté caminando libremente dentro de Gehenna es un hecho extremadamente peligroso. Si llegara a cooperar con organizaciones del partido nazi y con el Ejército Nacional para impulsar un movimiento de derrocamiento del régimen de Gehenna, existe una alta probabilidad de que se convierta en un punto de referencia ideológico del nazismo.\n\nLe pedimos que considere seriamente la posibilidad de investigar a Anton Drexler."
 GEH.flavor_event.17.a: "Bien. Arremánguense y vamos a investigarlo."
 GEH.flavor_event.17.b: "Si de verdad fuera tan peligroso, estaría en Berlín, no en Múnich."

 GEH.flavor_event.18.t: "Investigación de Inteligencia: informe sobre Anton Drexler"
 GEH.flavor_event.18.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nHemos llevado a cabo una investigación minuciosa sobre Anton Drexler, pero...\n\nHemos confirmado que, desde el Gran Traslado, no ha realizado ninguna actividad política o social para reconstruir el Partido Nazi. Parece haber abandonado toda expectativa de materializar el nacionalsocialismo. Drexler pasa la mayor parte del día en tabernas de Múnich, y lo único que nuestros agentes han enviado fueron listas de marcas de cerveza que beben los alemanes y de platos de bratwurst...\n\nNos avergüenza informar que el Departamento de Inteligencia ha desperdiciado personal en un asunto sin sentido, y debido a ello está aumentando el descontento entre los miembros del Comité."
 GEH.flavor_event.18.a: "...Presenten 200 cartas de arrepentimiento."

 GEH.flavor_event.19.t: "Investigación de Inteligencia: organizaciones y personas locales colaboradoras"
 GEH.flavor_event.19.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nTodos los departamentos del Comité —Inteligencia, Planificación, Ejecutivo y Médico— concluyen que los locales son hostiles hacia los kivotosianos y, en esencia, un grupo en el que no se puede confiar. Aun así, algunas fuerzas locales parecen cooperativas y no representarían un obstáculo para el gobierno de Gehenna.\n\nEl Partido Socialdemócrata de Alemania, que mostró incompetencia durante toda la República de Weimar, es una fuerza local fragmentada dentro de Gehenna y carece de un líder carismático. Son más tontos incluso que Hanuma Makoto, por lo que nunca debe permitírseles intervenir directamente en la política del Comité. Sin embargo, si actuamos como si atendiéramos sus demandas, podríamos atraer el apoyo de los trabajadores locales.\n\nEn Baviera, varios artistas se han trasladado tras el Gran Traslado; como no plantean exigencias políticas, son seguros. Cooperar con artistas locales ayudaría a construir la imagen de que Gehenna es una academia que se preocupa por la armonía cultural. Inteligencia ha seleccionado algunos candidatos.\n\nRichard Strauss es el artista más cooperativo con Kivotos. Podría ser una buena alternativa.\n\nEl pintor expresionista Karl Schmidt tiene alta notoriedad en Baviera y podría mostrar un fuerte apoyo a nuestro arte.\n\nPor último, el destacado arquitecto Mies van der Rohe también es una alternativa. Invertir en la Bauhaus se espera que traiga un gran avance a la arquitectura de Gehenna."
 GEH.flavor_event.19.a: "No es mala información."

 GEH.flavor_event.20.t: "Informe de Inteligencia: movimientos amenazantes de los alemanes"
 GEH.flavor_event.20.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nTras la oficialización pública de la relación sentimental entre la jefa Hina y la administradora principal Amau Ako, la ira y el desconcierto de los locales están acercándose a un punto crítico.\n\nEn primer lugar, tanto el catolicismo como el protestantismo —las principales religiones de Deutschland— están condenando oficialmente la relación. La fe local no la acepta, y el hecho de que clérigos importantes estén incitando a los locales es una amenaza.\n\nEn segundo lugar, existe la reacción de fuerzas políticas. El Partido Comunista y el Partido Nacionalsocialista Alemán de los Trabajadores (ambos ilegalizados en Gehenna), así como el Zentrum y el DNVP (partidos legales), emitieron ayer conjuntamente una condena al gobierno. El único partido local que apoyó a la jefa fue el SPD; sin embargo, no es confiable, pues parece buscar ganarse su favor para intervenir legalmente en la política central de Gehenna.\n\nTanto el ámbito religioso como las organizaciones políticas clandestinas requieren represión, pero es necesario establecer prioridades. El Departamento de Inteligencia considera que, dado que las organizaciones clandestinas alemanas han salido a la superficie aprovechando el desorden social, este es el momento de aprovechar para capturar de un solo golpe a sus líderes locales. En cambio, los tecnócratas del Departamento de Planificación proponen presionar a los religiosos mediante auditorías fiscales.\n\nPor limitaciones administrativas, aplicar ambas medidas a la vez reduciría su efectividad. Le solicitamos que tome una decisión apropiada."
 GEH.flavor_event.20.a: "Concéntrense en destruir a los partidos locales."
 GEH.flavor_event.20.b: "Dejemos que Planificación aplaste a los religiosos."
 
 GEH.flavor_event.21.t: "Informe de Inteligencia: huelga general de trabajadores locales"
 GEH.flavor_event.21.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nDesde el anuncio de la relación de la jefa Hina, la resistencia local se ha intensificado y la alianza subterránea entre nazis y comunistas se está consolidando. Al parecer, estos idiotas acordaron cooperar hasta derrumbar el gobierno legítimo de Gehenna y, después, competir entre sí por el control de Deutschland.\n\nComunistas y nazis están instigando una huelga general, y las organizaciones obreras locales están comenzando a adherirse. El Departamento Ejecutivo exige una solución 'rápida' usando balas, pero eso podría expandir la huelga a una escala incontrolable. Se requiere un enfoque más cuidadoso.\n\nEl Departamento de Planificación ha discutido usar al SPD. El Partido Socialdemócrata no participa en la alianza nazi-comunista y mantiene la creencia ingenua de que, al cooperar con nosotros, podrá expandir su influencia política en Gehenna. Si les prometemos más derechos en la asamblea regional y les pedimos mediar en la huelga, harán todo lo posible para detenerla.\n\nEl Departamento de Inteligencia está considerando fomentar la división entre comunistas y nazis. Ambos han sido enemigos desde la era de Weimar, y su alianza solo se sostiene de forma precaria para derrocar el régimen de Gehenna. Si difundimos a los nazis información de que los comunistas están vendiendo las identidades de simpatizantes nazis, y a los comunistas la información contraria, la alianza entre esos dos idiotas se desintegrará por sí sola."
 GEH.flavor_event.21.a: "Las promesas no cuestan dinero: sigan el plan de Planificación."
 GEH.flavor_event.21.b: "Hagan que esos idiotas se destruyan entre ellos."
 
 GEH.flavor_event.22.t: "Informe de Inteligencia: levantamiento cristiano"
 GEH.flavor_event.22.desc: "Para [GEH.GetLeader], jefe del Comité de Disciplina:\n\nDesde el anuncio de la relación de la jefa Hina, la resistencia local se ha intensificado y la unión de fuerzas cristianas se está volviendo cada vez más militante. El Papa del Vaticano declaró oficialmente al Comité de Disciplina como una organización anticristo, y múltiples obispos, sacerdotes y pastores están instando a la resistencia alemana contra Gehenna.\n\nEl Departamento Ejecutivo exige encarcelar a todos los religiosos residentes en Deutschland, pero esto es inviable según nuestra capacidad administrativa y el tamaño que las instituciones penitenciarias pueden absorber. Planificación e Inteligencia han discutido por separado cómo responder.\n\nPlanificación propone arrestar a clérigos que participaron en manifestaciones y, tras despojarlos de la ciudadanía, deportarlos al extranjero. La administradora principal sostiene que sería solo una 'deportación a pequeña escala', por lo que el impacto en población y poder nacional sería limitado.\n\nPor su parte, Inteligencia propone organizar manifestaciones controladas empleando población de origen Gehenna. La gente de Gehenna, en realidad, no suele cuestionar el motivo mientras pueda desplegar violencia y caos. Si a los estudiantes de Gehenna —estresados por las regulaciones de armas— se les entregan bates y martillos y se les suelta en la protesta, podríamos dejar discapacidades permanentes a más del 90% de los religiosos que participan, impidiéndoles volver a protestar. Esto requeriría menos costo y administración que la propuesta de la administradora principal, y sería una alternativa racional para evitar la recurrencia de protestas cristianas."
 GEH.flavor_event.22.a: "¿Bates? ¿Martillos? ...Uf, ya, basta. Tráeme la propuesta de Ako."
 GEH.flavor_event.22.b: "Suelten a los estudiantes. ...Pero no puedo permitir armas contundentes."
 
 GEH.flavor_event.23.t: "Partido amistoso de béisbol Gehenna–Millennium"
 GEH.flavor_event.23.desc: "Tras el Gran Traslado, con las naciones de Kivotos rodeadas por países locales, también se impulsaron activamente movimientos diplomáticos civiles para fortalecer la cooperación y la fraternidad entre los Estados de Kivotos. Este partido amistoso de béisbol entre Gehenna y Millennium fue organizado por la cooperación entre entidades civiles: por Millennium participó un equipo representativo, los Kogi Braves, un club profesional; por Gehenna, un equipo de aficionados formado por miembros del Comité de Disciplina.\n\nEn el partido, los Kogi Braves mostraron desde el inicio un rendimiento inestable y empezaron a quedarse atrás por una diferencia enorme ante el equipo aficionado de Gehenna. Las estrategias incomprensibles de los Kogi Braves —difícil de creer para un equipo profesional— fueron enfureciendo cada vez más a los espectadores de Millennium. Finalmente, en la parte alta de la cuarta entrada, el marcador se abrió hasta 0:28, y la ira llegó al límite. Los espectadores franceses, que jamás habían vivido el béisbol de Millennium, saltaron primero la valla y entraron al campo; luego los estudiantes de Millennium invadieron el estadio, y el partido se suspendió. Tras huir tanto los jugadores de Gehenna como los Kogi Braves, ciudadanos de París y estudiantes de Millennium ocuparon el estadio y comenzaron a destrozar las instalaciones; algunos franceses furiosos incluso incendiaron por completo el autobús del equipo de los Kogi Braves.\n\nUn reportero del periódico Kronos, que había ido a cubrir el juego, se burló con un tono cínico: \"Es la primera vez desde el Gran Traslado que franceses y milenianos han estrechado una amistad tan profunda. Esto ya no es un amistoso entre Gehenna y Millennium, sino entre Francia y Millennium\". Con el motín empeorando y siendo imposible reanudar el encuentro, el juego fue declarado terminado por 'cold game' en la parte alta de la cuarta entrada."
 GEH.flavor_event.23.a: "No volveremos a jugar béisbol con Millennium."

 GEH.flavor_event.24.a: "...Ay, me duele la cabeza..."

 GEH.flavor_event.25.t: "No pasó nada"
 GEH.flavor_event.25.desc: "Ho-hola, jefa Hina. Ayer, después de llegar a casa, tomé un poco de vino... de verdad, solo un poquito... y después se me fue la memoria por completo. Solo me quedó el registro de que estuve en llamada con usted durante unos minutos.\n\nSí, tengo el registro de la llamada, pero no recuerdo qué le dije por teléfono.\n\nMe preocupa que quizá haya dicho algo grosero... ¿No se enojó conmigo? Si fue una borrachera, escribiré una carta de arrepentimiento."
 GEH.flavor_event.25.a: "\"...No fue nada. Así que solo... no saques el tema de ese día.\""

 GEH.flavor_event.26.t: "La muerte de Yurizono Seia"
 GEH.flavor_event.26.desc: "Antes del incidente del Gran Traslado, Gehenna y Trinity estaban impulsando, bajo la mediación de la Presidenta del Consejo Estudiantil General, el acuerdo de paz conocido como el 'Tratado de Edén'. En Gehenna, Hina; y en Trinity, el Tea Party, lideraban de forma conjunta las negociaciones. Por eso, durante los procesos de negociación previos al Gran Traslado, Hina llegó a reunirse varias veces con Seia junto con la Presidenta del Consejo.\n\nPara Hina, Seia era una sabia de profunda inteligencia, y la figura más razonable para dirigir Trinity después del Gran Traslado.\n\n\"Si Seia ha muerto... entonces sí. La posibilidad de reanudar el Tratado de Edén es casi nula.\"\n\nDe por sí, tras el Gran Traslado, toda negociación —incluyendo la coordinación práctica del Tratado de Edén— se encontraba suspendida. Pero la muerte de Seia fue, para Hina, como destruir el último hilo de esperanza de reanudar el Tratado. Con un profundo suspiro, Hina encendió la computadora, para enviar un mensaje de condolencias por una persona sabia que siempre estuvo al lado de Nagisa, anfitriona del Tea Party."
 GEH.flavor_event.26.a: "Hina temía cómo cambiaría Trinity tras su muerte."

 GEH.flavor_event.27.t: "Sobre el fallecimiento de Yurizono Seia: elegía de Sorasaki Hina"
 GEH.flavor_event.27.desc: "Para Kirifuji Nagisa:\n\nEn primer lugar, le presento mis más sinceras disculpas por no poder visitar Trinity en persona y enviar estas condolencias únicamente por escrito.\n\nRecibir la noticia del fallecimiento de la noble integrante del Tea Party y reformista, Yurizono Seia, fue un instante en el que el impacto y la tristeza se entrelazaron. Su vida fue devoción en sí misma hacia Trinity; fue alguien que, más que nadie, buscó la armonía y anheló la paz. El Comité de Disciplina de Gehenna también siente una profunda ira y duelo ante el hecho de que ella cayera frente a la violencia absurda del extremismo.\n\nSeia siempre prestó oído a las voces de los estudiantes de Trinity y, no con ideales vacíos, sino con políticas realizables, presentó esperanza en la realidad. Fue una persona que ganó la confianza de toda la academia, más allá de una sola facción; y con una perspicacia aguda como si viera el futuro, y una personalidad serena y cálida, recibió el respeto de muchos.\n\nRecuerdo cuando, junto a los miembros del Tea Party —incluida Seia—, impulsamos el 'Tratado de Edén' bajo la mediación de la Presidenta del Consejo Estudiantil General. Seia reflexionaba más profundamente que nadie sobre la opinión de la Presidenta y pensaba con sinceridad en el hermoso futuro que traería la paz entre ambas academias. Espero que la paz entre Gehenna y Trinity, que ella soñaba, pueda continuar de aquí en adelante.\n\nHoy, la facción Sanctus ha perdido a su líder; pero, al mismo tiempo, recordará los ideales y convicciones de toda una época. El nombre de Yurizono Seia jamás será olvidado, y su voluntad y visión permanecerán vivas por mucho tiempo en el corazón de Trinity y de muchos en el mundo.\n\nRuego por el descanso del alma de la difunta, y transmito mis más sinceras condolencias a todos en Trinity.\n\n— Sorasaki Hina, jefa del Comité de Disciplina de Gehenna."
 GEH.flavor_event.27.a: "Nagisa, recordando a Seia, lloró en silencio."

 GEH.flavor_event.28.t: "¡Bertolt Brecht llega a Gehenna!"
 GEH.flavor_event.28.desc: "El famoso dramaturgo Bertolt Brecht, que huyó a casa de un amigo danés mientras realizaba un movimiento de oposición al régimen de Adolf Hitler, regresó hoy a Deutschland, a Baviera. Hay muchas especulaciones sobre por qué Brecht eligió Baviera —bajo el control del Comité de Disciplina de Gehenna— en lugar de Trinity o el Pandemonium.\n\nLa postura oficial que Brecht dio a la prensa fue simplemente \"la hermosa naturaleza de Baviera\", pero en el mundo literario se sospecha que el motivo es su inclinación de izquierda. Tras el Gran Traslado, Gehenna es la única región donde partidos de izquierda como el SPD (aunque sea solo a nivel de gobierno regional) pueden operar legalmente.\n\nEn una entrevista con la prensa de Kronos, cuando le preguntaron si la cultura de Kivotos había influido en su mundo literario después del Gran Traslado, Brecht mencionó un famoso juego de Kivotos: 'Tales Saga Chronicle'. Configuraciones sin sentido insertadas a propósito, frases que no encajan entre sí y diálogos que impiden que el usuario se sumerja en el juego fueron objeto del elogio de Brecht.\n\n\"El arte y la cultura no deben existir para que el público o el lector 'se identifiquen emocionalmente' con los personajes. De acuerdo con el 'materialismo dialéctico', el arte debe usarse como herramienta para que quien lo contempla utilice la razón —no la emoción— y reconozca y critique nuestra miserable realidad. Tales Saga Chronicle está hecho para que el jugador jamás pueda empatizar con el juego; por eso, es un título fascinante: me permite ver que la teoría estética que he sostenido también se aplica de la misma forma en Kivotos.\"\n\nBrecht reconoce que el Gran Traslado dejó una herida profunda en Europa, pero cree que, en Gehenna, la cultura de Kivotos y la cultura europea podrán armonizar. El Comité de Disciplina de Gehenna no emitió ninguna declaración oficial sobre su llegada, pero Hinomiya Chinatsu dejó un breve comentario a la prensa de Kronos: \"Creo que hay un malentendido sobre Tales Saga Chronicle\"."
 GEH.flavor_event.28.a: "Entonces, ¿qué demonios es el materialismo dialéctico?"

 GEH.flavor_event.29.t: "Madre Coraje y sus hijos"
 GEH.flavor_event.29.desc: "La nueva obra de teatro del dramaturgo de izquierda Bertolt Brecht, 'Madre Coraje y sus hijos (Mutter Courage und ihre Kinder)', es una pieza que critica de forma evidente el régimen dictatorial nacionalsocialista de Misono Mika. Ambientada en la 'Guerra de los Treinta Años' del siglo XVII, la obra denuncia con fuerza el nacionalsocialismo a través de la historia de una mujer que busca enriquecerse mediante la guerra.\n\nEn una entrevista con la prensa de Gehenna, cuando le preguntaron si Madre Coraje era una metáfora de Misono Mika, Brecht estuvo de acuerdo y dejó un comentario cínico: \"Así como fracasó el nacionalsocialismo de Hitler, el nacionalsocialismo de Pater producirá el mismo resultado\".\n\nMadre Coraje y sus hijos se estrenó primero solo dentro del territorio administrado por el Comité de Disciplina de Gehenna, pero pronto fue traducida al inglés y se prepara su primera función en el Nuevo Continente. En el estreno de Múnich, la propia administradora Amau Ako asistió; sin embargo, causó controversia su declaración ante periodistas justo después de la función: \"Para ser honesta, no es divertida\"."
 GEH.flavor_event.29.a: "¿Cómo digo que es divertido algo que no lo es?"

 GEH.flavor_event.30.t: "La caída de Guillermo II"
 GEH.flavor_event.30.desc: "La nueva obra de teatro del dramaturgo de izquierda Bertolt Brecht, 'La caída de Guillermo II', es una pieza sumamente polémica ambientada en el Imperio Alemán durante la Primera Guerra Mundial. Con el 'Motín naval de Kiel' de 1918 como telón de fondo, la obra contrapone a Wilhelm von Preußen —sumido en una locura casi patológica que intenta empujar al pueblo alemán al campo de batalla— con la propia Casa Imperial alemana, que se derrumba por esa misma demencia.\n\nAunque el mundo literario critica que la obra carece de valor artístico por enfocarse únicamente en la 'crítica de la realidad y el análisis social racional' según el materialismo dialéctico que persigue Brecht, 'La caída de Guillermo II' está provocando una ola de controversia en todo el territorio del Comité de Disciplina de Gehenna.\n\nLa razón del escándalo es que el Guillermo II de la obra es, claramente, una metáfora de Sorasaki Hina. Guillermo II habla y actúa igual que Hina, y el líder militar alemán Erich Ludendorff se comporta de forma tan descarada como Amau Ako. Al trasladar la imagen de un imperio que se autodestruye por su locura militarista a la realidad del Comité de Disciplina de Gehenna, la obra deja una fuerte insinuación: que el régimen dictatorial del Comité colapsará como lo hizo el Imperio Alemán.\n\nEl estreno se realizó de forma legal; pero conforme la polémica creció, comenzaron a moverse fanáticos que se autoproclaman 'guardia personal' de Hina. Por ataques de esos fanáticos, funciones en distintas zonas de Gehenna fueron interrumpidas por la fuerza, y Brecht recibió cartas de amenaza de muerte de parte de simpatizantes anónimos. Aunque el Comité no prohibió oficialmente la obra ni emitió una orden de búsqueda contra Brecht, él decidió mudarse a Suiza alegando \"amenazas contra su seguridad\"."
 GEH.flavor_event.30.a: "Es insultante, pero... sí que estuvo entretenida."

 GEH.flavor_event.31.t: "Crisis de invasión de Trinity"
 GEH.flavor_event.31.desc: "Mientras Richard Strauss tocaba el piano, su discípulo Ahn Eak-tae permanecía a su lado con un rostro inquieto. Gehenna estaba siendo arrastrada a la guerra, y muchos artistas se preparaban para huir al extranjero; pero Strauss parecía no tener intención de abandonar Gehenna aun en medio de la crisis.\n\n\"¿Piensa quedarse aquí, profesor?\"\n\nAnte la pregunta de Ahn, Strauss sonrió como si fuera lo más obvio del mundo.\n\n\"Mis alumnos están aquí. ¿Cómo podría un profesor abandonar esta tierra? Pero tú podrías refugiarte hasta que termine la guerra, ¿no?\"\n\"A mí me gusta la inspiración artística que Gehenna me enseñó. Es libre, a veces incluso caótica... y por eso es una tierra que da una inspiración creativa infinita.\"\n\"...A mí también me pasa. Trinity es mucho más ordenada, pero no encaja con mis melodías.\"\n\nStrauss miró a Ahn, que seguía con el rostro pesado.\n\n\"Si le tienes cariño a Gehenna, ¿qué tal si participas en transmisiones para Gehenna?\"\n\"¿Transmisiones?\"\n\"Con que toques música basta. Hay muchísima gente en esta tierra que necesita desesperadamente piezas que puedan consolarlos. A mí también me lo propusieron, pero... creo que alguien joven y apasionado como tú encaja mejor en ese lugar.\""
 GEH.flavor_event.31.a: "Cada quien en su puesto, por Gehenna."

 GEH.flavor_event.32.t: "Una melodía de piano que siembra división"
 GEH.flavor_event.32.desc: "Ahn Eak-tae, conocido por ser discípulo del legendario compositor alemán Richard Strauss, participa de forma regular en una emisora de radio propagandística operada por el Comité de Disciplina de Gehenna, donde interpreta en piano canciones folclóricas tradicionales alemanas. La emisión de Ahn no contiene propaganda apasionada ni invectivas adornadas con retórica; aun así, parece estar provocando una fuerte agitación entre los locales alemanes reclutados por nosotros: les hace sentir, en carne viva, que \"
 GEH.flavor_event.32.a: "...después de ocupar Gehenna, fusilaremos a Ahn sin falta."

 GEH.flavor_event.33.t: "Incluso lo de que se descompusiera el elevador..."
 GEH.flavor_event.33.desc: "\"Estoy segura de que tengo enemigos dentro del Comité de Disciplina. Ayer saqué unas galletas de la cocineta y estaban completamente quemadas; hace dos días, el elevador se descompuso y tuve que subir y bajar escaleras hasta la oficina; y además, hace tres días, mi laptop tuvo ransomware...\"\n\nMientras escuchaba el parloteo de Ako, Carl Jung fue ordenando con su pluma en la pantalla de una tablet todas esas quejas interminables. Había conocido a muchas personas con un carácter histérico, pero Ako era, de lejos, la 'rival' más dura de todas las que Jung había tratado.\n\n¿Con qué volumen de trabajo operaba el Comité de Disciplina de Gehenna, para empujar a una chica hasta este nivel de histeria laboral? Jung interrumpió por un momento aquella conspiración interminable sobre \"enemigos internos\" y habló con calma. Después de todo, esa sesión de consulta psicológica la había solicitado Ako para aliviar el estrés. Ya la había escuchado lo suficiente: ahora tocaba dar un diagnóstico desde la psicología analítica y buscar una forma de reducir su estrés.\n\n\"La razón por la que la señorita Ako interpreta incluso los detalles más pequeños como 'una conspiración del enemigo' puede encontrarse en el inconsciente. Por ejemplo...\""
 GEH.flavor_event.33.a: "Ojalá que esta sesión pueda aliviar aunque sea un poco su estrés."

 GEH.flavor_event.34.t: "Entrenamiento de natación en Gehenna"
 GEH.flavor_event.34.desc: "\"¡Glu-glu, coff... glub!\"\n\"¡¡¡¡Jefaaaa!!!!\"\n\nTodo el mundo sabía que Sorasaki Hina no era buena nadando, pero... nadie se imaginó que fuera tan mala. En un entrenamiento de natación de combate en un pequeño lago de Baviera, Hina reunió valor y se lanzó al agua, solo para hundirse de inmediato hacia el fondo sin haber avanzado ni un metro. Ako, asustada, intentó lanzarse tras ella, pero el personal de seguridad que ya estaba de guardia la detuvo y rescató a Hina a toda prisa.\n\nHina había tragado mucha agua y, por la vergüenza, se le formaron lágrimas en los ojos, pero fue rescatada a salvo fuera del lago. Sin embargo, el campamento especial de entrenamiento que el Comité planeaba realizar en el lago quedó suspendido por el alboroto. Y, como extra, se añadió una línea bastante vergonzosa al reglamento del Comité: Sorasaki Hina debe usar flotador incluso aunque vaya a un arroyo poco profundo.\n\n\"...¿De verdad hacía falta dejarlo por escrito en el reglamento, Ako?\"\n\"...Si usted hubiera aguantado aunque fuera tres segundos en el lago, no habría llegado a esto.\""
 GEH.flavor_event.34.a: "Sinceramente, no tenía cómo refutarlo..."

 GEH.flavor_event.35.t: "Fuerzas religiosas dentro de Deutschland"
 GEH.flavor_event.35.desc: "En Deutschland existen, a grandes rasgos, dos fuerzas religiosas, clasificadas como católica y protestante. Ambas son fuerzas religiosas locales; y aunque existe una diferencia política según si siguen o no las órdenes del Papa del Vaticano, comparten un punto en común: son hostiles al dominio del gobierno de Gehenna.\n\nTanto la Iglesia católica como la protestante restringen los derechos de las mujeres al papel de \"buena esposa, buena madre\", y ven con muy malos ojos una sociedad como la de los Estados-academia de Kivotos, donde las mujeres dominan la política y los hombres quedan excluidos. Dado que se estima que cambiar su visión religiosa requerirá al menos una generación, el Departamento Ejecutivo del Comité sostiene que la única respuesta es una represión 'implacable' contra los religiosos locales.\n\nEn la práctica, como es difícil aplicar una represión implacable contra la población protestante y católica que constituye la mayoría en Gehenna, se llevará a cabo una persecución religiosa en una forma relativamente más moderada. Lo importante es que, si queremos mantener el sistema actual centrado en la población de origen Kivotos dentro de Deutschland, no es posible ningún compromiso con ellos. Es trágico, pero también es una brecha religiosa imposible de cambiar."
 GEH.flavor_event.35.a: "Si eso es lo que quieren, entonces podrán convertirse en mártires."

 GEH.flavor_event.36.t: "La oposición que se opone al dominio de Gehenna"
 GEH.flavor_event.36.desc: "Los partidos que operan legalmente en el territorio gobernado por el Comité de Disciplina se dividen, a grandes rasgos, en tres. El primero es el Partido Socialdemócrata. Abreviado como SPD, eligen representantes en las asambleas regionales y, al menos, coinciden en que los gobernantes de Gehenna son mejores que el antiguo Hitler. Dado que el SPD es el partido más colaborador, no debería estorbar el gobierno de Deutschland por parte de Gehenna.\n\nEl problema son los dos partidos opositores en las asambleas regionales: el Partido de Centro (Zentrum) y el Partido Popular de Baviera. Ambos son partidos conservadores de derecha; aunque difieren en si priorizan el conservadurismo económico o el conservadurismo religioso, comparten una idea: ven a Gehenna como un gobernante colonial.\n\nA diferencia del Partido Nazi y el Partido Comunista —ambos ilegales—, el Zentrum y el Partido Popular continúan su actividad solo dentro de una línea legal en las asambleas regionales y, por eso, todavía se les permite existir en nuestra sociedad. Sin embargo, a largo plazo, será necesario seguir apoyando al SPD para impedir que esos partidos aumenten su influencia en las asambleas regionales.\n\nUn punto afortunado es que el Partido Popular y el Zentrum se desgarran entre sí para arrebatarse apoyo: no solo atacan a Gehenna, también se muerden mutuamente. Sus bases se superponen muchísimo, por lo que es incluso menos probable que cooperen entre sí que lo que lo sería una alianza entre nazis y comunistas."
 GEH.flavor_event.36.a: "Es como cuando el Club Gourmet y el Club de Desarrollo de Aguas Termales no pueden unir fuerzas."

 GEH.flavor_event.37.t: "Protesta católica en Baviera"
 GEH.flavor_event.37.desc: "Tras la ocupación de Baviera por el Comité de Disciplina después del Gran Traslado de 1935, el líder religioso luterano local Hans Meiser organizó una \"protesta callejera para expulsar a Gehenna\".\n\nMeiser es conocido por haber sido el líder luterano más dispuesto a comprometerse con el régimen de Hitler, por lo que el Departamento de Inteligencia del Comité tiene serias sospechas sobre las verdaderas intenciones de una manifestación encabezada por él.\n\nEn esta protesta participaron tres mil protestantes de toda Baviera, y se registraron estallidos esporádicos de violencia. Inteligencia insiste en que debe ser expulsado al extranjero para evitar que vuelva a ejercer influencia en Baviera, mientras que el Departamento Ejecutivo lo ve como una oportunidad de meter a Hans Meiser por mucho, mucho tiempo... en una prisión subterránea."
 GEH.flavor_event.37.a: "Es el cabecilla de una organización criminal. Condénenlo a 20 años."
 GEH.flavor_event.37.b: "No es alguien que deba quedarse en Gehenna. Revóquenle la ciudadanía y expúlsenlo."
 #Hans Meiser


#event 1~ Ruta de Ako

 GEH.event.1.t: "La relación entre dos personas"
 GEH.event.1.desc.a: "En medio de una atmósfera incómoda, Hina dio un sorbo a su té helado. Pedirle consejo nada menos que a Haruna, una terrorista… era absurdo. Pero… esta no era una historia que pudiera contarle a alguien dentro del Comité de Disciplina.\n\n\"La verdad es que no tengo muchos amigos. Por eso, la única persona a la que puedo acudir para hablar de mis preocupaciones eres tú. …Y además, tengo entendido que en el Club de Investigación Gastronómica las relaciones entre los miembros son muy estrechas.\"\n\"Oh, no esperaba que la señorita Hina nos tuviera en tan alta estima.\"\n\"Yendo al grano… Ako se está quedando aislada dentro del Comité de Disciplina.\"\n\"Sí. Yo también estoy al tanto de la reforma interna del comité. Se trataba de compartir la autoridad de la presidenta entre el Departamento de Planificación y la señorita Ako. Tengo entendido que usted también estuvo de acuerdo con ello… pero parece que otros departamentos están empezando a oponerse, ¿verdad?\"\n\"Si solo fuera *oposición*, no te habría pedido consejo. Otros departamentos afirman que Ako… es decir, que debido a sentimientos *inapropiados* hacia mí, está intentando privatizar el puesto de presidenta del comité.\"\n\nLa expresión más eufemística posible. Como si tratara de desentrañar el significado de esas palabras, Haruna acarició lentamente el borde de su vaso de té helado con la yema de los dedos. Luego sonrió, como si estuviera poniendo a prueba a Hina.\n\n\"¿Y usted qué piensa, señorita Hina? ¿Cree que la señorita Ako la ama?\"\n\"…Creo que sí.\"\n\"Je, je. Bien. Siguiente pregunta. ¿Cree usted que esta reforma estructural se originó en el deseo homosexual de la señorita Ako?\"\n\"No.\"\n\"Una respuesta inmediata. Bien. La situación es clara. La señorita Ako está intentando reformar el sistema sinceramente por usted. Pero como parte de las calumnias se basan en hechos reales, no hay forma de contrarrestarlas, ¿verdad?\"\n\"Sé cómo castigar a criminales que empuñan armas y siembran el caos. Pero… nunca aprendí a enfrentar enemigos que empuñan una pluma.\"\n\"Entonces tendré que darle un consejo.\"\n\nHaruna sonrió con intención.\n\n\"O acepta completamente a la señorita Ako, o rompe toda relación con ella y se limita a mantener una relación puramente laboral. Con esta ambigüedad no hay forma de detener las maniobras en la sombra. ¿Qué hará? ¿Está dispuesta a abrazar a la señorita Ako y cargar con todas las críticas en su lugar? ¿O prefiere cortar lazos de forma tajante? Mostrar públicamente que ‘la presidenta del comité detesta a su administradora principal’ también podría destruir la credibilidad de esas intrigas.\""
 GEH.event.1.desc.b: "En medio de una atmósfera incómoda, Hina dio un sorbo a su té helado. Pedirle consejo nada menos que a Kayoko, una criminal del Comité de Disciplina… era absurdo. Pero… esta no era una historia que pudiera contarle a alguien dentro del comité.\n\n\"La verdad es que no tengo muchos amigos. Por eso, la única persona a la que puedo acudir para hablar de mis preocupaciones eres tú. …Y además, tengo entendido que en vuestra agencia de información las relaciones entre los miembros son bastante estrechas.\"\n\"No tanto como crees. Y desde el ‘Gran Traslado’, menos aún.\"\n\"Aun así, será mejor que el Comité de Disciplina. …Ako se está quedando aislada dentro del comité.\"\n\"Sí. Yo también investigué la reforma interna del comité. Se trataba de compartir la autoridad de la presidenta entre el Departamento de Planificación y Ako. Tengo entendido que tú tampoco te opusiste… pero parece que otros departamentos han empezado a rebelarse.\"\n\"Si solo fuera *oposición*, no te habría pedido consejo. Otros departamentos afirman que Ako… es decir, que debido a sentimientos *inapropiados* hacia mí, está intentando privatizar el puesto de presidenta del comité.\"\n\nLa expresión más eufemística posible. Como si tratara de masticar el significado de esas palabras, Kayoko mordió suavemente su labio inferior antes de soltarlo.\n\n\"Bien. Entonces déjame preguntarte algo, Hina. ¿Amau Ako realmente te ama?\"\n\"…Creo que sí.\"\n\"Siguiente. ¿Crees que esta reforma estructural se originó en el deseo homosexual de Amau Ako?\"\n\"No.\"\n\"Con eso es suficiente. Esta reforma es producto de la buena voluntad de Amau Ako. Pero existe oposición, y esa oposición tiene fundamentos *razonables*, por lo que resulta difícil negarla sin más, ¿cierto?\"\n\"Sé cómo castigar a criminales que empuñan armas y siembran el caos. Pero… nunca aprendí a enfrentar enemigos que empuñan una pluma.\"\n\"No será perfecto, pero puedo darte un consejo.\"\n\nTras pensarlo un momento, Kayoko habló.\n\n\"Primero. Mantener una relación pública con Amau Ako. A quienes la atacan les resultará difícil criticar directamente a ‘Sorasaki Hina’. Esta opción haría feliz a Ako, al menos a nivel personal. Pero si no tienes sentimientos personales por ella, entonces te recomiendo lo contrario: cortarla por completo. Mostrar públicamente que ‘la presidenta del comité no aprecia a Amau Ako’ también podría cortar las intrigas internas.\""
 GEH.event.1.a: "\"…Para mí, ambas opciones son demasiado difíciles.\""

  GEH.event.2.t: "Propaganda de desprestigio contra el Pandemonium"
 GEH.event.2.desc: "Hina leyó el discurso que Ako había redactado personalmente. El contenido del discurso estaba repleto de propaganda, algo que Sorasaki Hina no solía preferir. Ante periodistas seleccionados de antemano por el Comité de Disciplina, se acusaba al Pandemonium y al Ejército de Defensa de haber intentado entablar una relación de cooperación, y se citaban las palabras de políticos socialdemócratas que denunciaban cuán vil era Adolf Hitler, a quien el Ejército de Defensa había jurado lealtad en el pasado. En última instancia, era una denuncia que equiparaba al Pandemonium con Hitler.\n\nEl discurso en sí estaba escrito con frases bastante elegantes. El problema era que estaba lleno de expresiones incendiarias y oraciones apasionadas, distintas al estilo habitual de Hina. El motivo era fácil de imaginar: para inculcar en los conservadores alemanes, que no conocían bien a Hina, la imagen de una “líder fuerte”. Pero no le apetecía seguir ese guion. Ese no era el estilo de Hina.\n\n\"No soy una política de masas. No soy alguien que agite los brazos frente a los periodistas haciendo propaganda.\"\n\nChinatsu negó con la cabeza.\n\n\"Pero la administradora principal lo escribió para usted, jefa. ¿No podría simplemente cerrar los ojos y leerlo?\""
 GEH.event.2.a: "\"Está bien. Fíjame una entrevista.\""
 GEH.event.2.b: "\"Publica esto en el periódico a mi nombre. Pero no permitiré el discurso.\""
 
 GEH.event.3.t: "Una 'oligarquía' para la jefa Hina"
 GEH.event.3.desc: "\"Llevo días sin que me llegue ni un solo documento… ¿podrías decirme si pasa algo?\"\n\"Para aligerar su carga de trabajo, jefa Hina, acordamos que el Departamento de Planificación se encargaría de los documentos de política menores, ¿recuerda?\"\n\"Eso sí. Pero no todo el trabajo puede ser menor.\"\n\"El trabajo que usted debe manejar personalmente son solo los asuntos importantes.\"\n\nAko, con una leve sonrisa, dejó sobre el escritorio los pocos documentos que aún quedaban para Hina. Un plan de operación para aniquilar guerrillas del Ejército de Defensa, cuyos papeles ya habían sido tramitados por completo por el Departamento de Planificación.\n\n\"Esto también era un documento menor, así que lo procesé yo. Solo que la autoridad militar la tiene usted, jefa, así que únicamente firme abajo, por favor.\"\n\nHina apretó el documento. Desde el personal que se desplegaría hasta el plan de la operación, todo había pasado por las manos de Ako. A Hina solo le quedaba una cosa por hacer: escribir una firma al final. Por un instante, la palabra “títere” cruzó la mente de Hina. Habían dicho que dividirían el trabajo. Pero… ¿de verdad podía llamarse división a esto?\n\n‘Ako. Si lo único que quieres es monopolizar el poder, entonces dispara balas de plomo hasta que se me rompa el halo. Moriré aquí por ti.’\n\n…El impulso de soltar una pulla así le subió de golpe.\n\n- Pero Ako no haría esto por el poder.\n\nLa profunda confianza de Hina hacia ella detuvo, por los pelos, esa espina que casi le salía impulsivamente. De haberla dicho en voz alta, habría sido una espina de la que se arrepentiría toda la vida. Lo sabía. Ella, al fin y al cabo, solo quería reducir la carga de Hina. Igual que en Kivotos, la lealtad de Ako siempre había sido excesiva. Aun así, era necesario rebajar esa lealtad desmedida.\n\n\"Oye, Ako.\"\n\"¿Sí?\""
 GEH.event.3.a: "\"Te agradezco de corazón tus intenciones. Pero no tienes por qué cargar con todo por mí.\""
 GEH.event.3.b: "\"La comandante en jefe soy yo, no tú. No vuelvas a tocar la autoridad militar.\""

 GEH.event.4.t: "Democracia institucional"
 GEH.event.4.desc: "\"El sistema de la Administradora Principal Amau dice hacia el exterior que descentraliza el poder y vuelve más eficiente al Comité de Disciplina, pero ¿esto de verdad es una reforma institucional? Hace poco incluso escuché que el Departamento de Planificación intentó meter mano en la autoridad militar.\"\n\nDurante la reunión periódica, el jefe del Departamento de Inteligencia miró fijamente a Ako mientras agitaba los papeles con un aleteo.\n\n\"Creo que ha llegado el momento de volver a discutir si en esta reforma ‘democrática’ no se esconde alguna intención.\"\n\nChinatsu habló.\n\n\"¿Intención? ¿Está sugiriendo que la administradora Ako planea siquiera un golpe de Estado?\"\n\"Quizá sea una noticia aún más peligrosa que eso. ¿Han oído el rumor que circula entre los miembros del comité? Que la Administradora Principal Amau siente por la presidenta del comité un deseo homo-\"\n\n¡Bam! Justo antes de que la disputa se desviara hacia el tema sexual de Ako, Hina golpeó el escritorio e interrumpió al jefe de Inteligencia."
 GEH.event.4.a: "\"Si dices una palabra más, haré que no vuelvas a abrir la boca, jefe de Inteligencia.\""
 GEH.event.4.b: "\"Creo que también habría que darle derecho a hablar a Ako.\""

 GEH.event.5.t: "Quejas desde abajo"
 GEH.event.5.desc: "MOMOTALK\n\n- Iori\n\nJefa Hina, últimamente el ambiente en Ejecución no es normal.\n\nLa “democracia” del comité y repartir el poder, todo eso está bien, pero están excluyendo de los actos oficiales a Ejecución, que es la que somete criminales en el terreno, y en cambio están poniendo al frente solo a los escribanos del Departamento de Planificación, que solo hacen papeleo. Las quejas ya son demasiadas.\n\nTambién dicen que todo esto pasa porque Ako hechizó a la jefa Hina… y si no fuera por la lealtad que te tienen los miembros, quizá ya habría estallado una rebelión.\n\nHaa… no es que te esté pidiendo una solución definitiva. Solo me cuesta calmar a las chicas, así que vine a desahogarme un poco. El corazón de la gente no se mueve como uno quiere.\n\nCreo que sería bueno hacer algo por las chicas de Ejecución. Te lo pido."
 GEH.event.5.a: "Hina cerró Momotalk y soltó un suspiro."

 GEH.event.6.t: "Héroes que trabajan en el terreno"
 GEH.event.6.desc: "\"Últimamente parece que el comité está metiéndole todo el poder al Departamento de Planificación… pero ahora de repente se la pasan repartiendo bonos y vacaciones a otros departamentos, ¿no?\"\n\"La presidenta del comité también sabrá que el ambiente está feo últimamente.\"\n\nDos miembros del Comité de Disciplina charlaban mientras pegaban pósters de propaganda en la pared del edificio. Llamaba la atención un póster de diseño agresivo que decía: ‘Tú, que corres en el terreno, eres el héroe de Gehenna’, junto con el número para reclutar nuevos miembros del comité.\n\nAunque era cierto que el poder se estaba concentrando en el Departamento de Planificación dentro del comité. Y también era un hecho público que la fuerza política de otros departamentos se estaba reduciendo. Pero para los miembros rasos de menor rango, que de todas formas no podían meterse en la lucha por el poder, los bonos y las vacaciones eran una recompensa mucho mejor. Da igual lo que se muerdan y se despedacen entre ellos; lo que entra a la cuenta en yenes de Kivotos no cambia, ¿no?"
 GEH.event.6.a: "Los dos miembros del comité se rieron con un ambiente agradable y se fueron."

 GEH.event.7.t: "No habrá una tragedia en el Benelux"
 GEH.event.7.desc: "Soy Amau Ako. La razón por la que he aceptado esta entrevista hoy es para responder a los numerosos prejuicios que los alemanes tienen contra los de Kivotos. …Sí. Los de Kivotos no mueren aunque les disparen, pero el rumor de que eso se debe al infierno o a una bendición demoníaca no es cierto. Si tuviera que compararlo, sería como osos o leones. Los animales fuertes no mueren si les dan con balas de pistola, pero sí mueren si les disparan con un cañón, ¿no? Pues igual: nosotros solo somos un poco más fuertes que los humanos comunes, y al final no dejamos de ser criaturas corrientes e impotentes frente a un poder de fuego superior.\n\nTambién tengo que hablar del prejuicio de que los de Gehenna disfrutan matar… Es cierto que, justo después del Gran Traslado, algunas estudiantes de Gehenna cometieron crímenes en el Benelux. Sí. Pero igual que entre los locales hay malvados y hay buenas personas, ellas eran el 1% más bajo de la sociedad de Gehenna… no eran más que basura. Nuestro Comité de Disciplina se está esforzando al máximo por mantener el orden para que los locales puedan llevar la misma vida que antes del Gran Traslado.\n\nSí. Quienes vean esta entrevista seguramente ya lo saben bien, pero nuestro Comité de Disciplina era, antes del Gran Traslado, la organización de mantenimiento del orden de Gehenna. Luchar contra el crimen y proteger a los ciudadanos dentro del marco de la ley; por eso, más que cualquier otra organización de Kivotos, somos dignos de confianza…"
 GEH.event.7.a: "Ako continuó la entrevista con una voz serena."

 GEH.event.8.t: "Para ti, en la estación que se muere"
 GEH.event.8.desc: "\"Administradora Principal Amau Ako. …Lo siento, pero yo… no puedo amarte. Lo intenté, pero no puedo. De verdad… no puedo verte como pareja.\"\n\nNuestro encuentro y nuestra vida quizá existieron, solo para esta despedida.\nEl amor que guardé se dispersó en el viento y desapareció, y las emociones que estallaron acabaron reducidas a polvo, sin llegar jamás hasta ti.\n\nUn día normal en el que, tras terminar la reunión, deberíamos haber intercambiado una conversación ligera y separarnos de forma natural.\nPero la jefa Hina me llamó afuera del edificio del comité y, apenas, dejó escapar esas palabras. Una voz vacilante, como si ni siquiera pudiera ordenar sus propios sentimientos. La voz de la jefa Hina, a quien veneré, respeté y amé, sonó tan débil y frágil que, por un momento, sentí vértigo.\n\nSi la jefa Hina realmente no hubiera sentido nada por mí, habría dolido, pero al final podría haber renunciado. Sin embargo, esta persona que baja la cabeza sin poder ordenar sus sentimientos, que murmura sin siquiera mirarme… ¿de verdad es mi ‘Sorasaki Hina’, la ‘Sorasaki Hina’ de ‘Amau Ako’?\n\nMi jefa Hina está muy lejos, dentro de una estación que se muere.\n\nNo esta existencia borrosa que tengo enfrente, sino aquella persona de antes del Gran Traslado: la que se ponía el abrigo con firmeza y salía de la oficina. Lo que yo amé fue a Sorasaki Hina de esa estación. En el instante en que comprendí eso, me di la vuelta y eché a correr, como si un fantasma me persiguiera.\n\nEscuché una voz llamándome por detrás. Pero no me giré. La jefa Hina no pudo alcanzarme.\n\nJefa… hasta el final, sigue vacilando.\n\nYo solo le amé a usted.\nAmé a la usted fría.\nAmé a la usted implacable.\nAmé a la usted valiente.\nY amé a la usted que no me ama.\n\n\"¡Administradora Ako!\"\n\nUn miembro desconocido del comité gritó hacia mí cuando corrí hacia la carretera. En ese instante, me giré. El edificio del comité, lejos. Y más allá, a lo lejos, Hina, que por fin corría tras de mí con retraso. Esa figura… parecía como si se hubiera detenido."
 GEH.event.8.a: "Y entonces, el vehículo del Comité de Disciplina que venía corriendo me arrolló y pasó de largo."

 GEH.event.9.t: "Desamor"
 GEH.event.9.desc: "\"Todo el mundo tiene a su pareja destinada. Para ti fui yo, pero para mí el problema es que tú no fuiste esa persona.\"\n\nEn la azotea del edificio del comité, en el extremo del helipuerto sin siquiera barandilla, Hina me miró con el sol poniente a su espalda. El hermoso resplandor del atardecer iluminaba con brillo a mi jefa, a quien respetaba y amaba, desde detrás de ella. Probablemente no olvidaré este momento hasta el día en que deje de respirar. Ella me tendió la mano.\n\n\"No puedo ser tu amante. Pero sí puedo ser tu superiora a quien respetas, una colega en quien confías, una amiga que te acompañe toda la vida.\"\n\"Ojalá hubiera sido una amante que te acompañe toda la vida.\"\n\"Simplemente no estábamos destinados a coincidir. …No tengo nada que decir al respecto.\"\n\nTomé la mano de la jefa Hina y contemplamos juntas el atardecer.\n\n\"Si así, sujetando la mano de la jefa, saltamos desde el helipuerto… ¿qué pasaría?\"\n\"Por eso te dije que nos viéramos aquí. …Para aceptar incluso ese odio, aunque tú, tras ser rechazada, me odies en su lugar.\"\n\"…Sabe que yo no podría hacer eso.\"\n\nPorque es así… parece que al final yo no puedo liberarme de una persona llamada Sorasaki Hina. Solté una risita amarga y, entrelazando mis dedos con los de la jefa Hina, me quedé a su lado.\n\n\"Gracias. …Por cortarme con firmeza.\"\n\"…No merezco que me agradezcas.\"\n\"Ya sabía que era un amor destinado al rechazo. Porque sabía que últimamente usted me estaba alejando a propósito. Y también sabía que no era porque me odiara, sino para protegerme.\"\n\"Ako. Aún te queda mucho tiempo. Así que, alguien que no sea yo…\"\n\"Creo que… para mí no habrá una ‘segunda’ destino. Si fuera otra historia, bajo un cielo azul verdoso y no en este mundo rojo, quizá habría sido distinto.\"\n\nEra un discurso poético que no iba conmigo, pero sentí algo parecido al destino. Que en ‘este mundo’, en ‘esta historia’, no podría encontrar una segunda pareja destinada. Pero aun así está bien. Mi primera… quedará como mi primer y último amor hasta el momento en que muera. Solté la mano de la jefa Hina."
 GEH.event.9.a: "Ah… para consolar mi desamor… ¿le gustaría que cenáramos juntas esta noche, aunque sea?"

 GEH.event.10.t: "El colapso del gabinete de Ako"
 GEH.event.10.desc: "\"Soy Amau Ako, Presidenta del Comité de Disciplina de Gehenna y también Administradora Principal. La reunión de emergencia de hoy es para la búsqueda de la jefa, desaparecida…\"\n\nEn la sala de reuniones, donde se reunieron decenas de figuras clave del comité, al oír a Ako leyendo los documentos, estallaron gritos desde el lado de Ejecución y el de Inteligencia.\n\n\"¡Desde el principio, la razón por la que la jefa desapareció es por tu culpa! ¡¿No huyó porque no soportaba tu asqueroso deseo sexual?!\"\n\"¿No la estuviste acosando pegándote a ella y, como no te aceptó, la enterraste?\"\n\"¡Ejecución solicita formalmente que se investigue a Amau Ako por el homicidio de la jefa Sorasaki Hina!\"\n\nCuando por fin salió incluso la palabra ‘homicidio’, los miembros del Departamento de Planificación, la facción de Ako, se levantaron de golpe de sus asientos. Miembros del comité lanzándose insultos y gritos unos a otros, y en medio, Iori, una mandamás de Ejecución, miraba alrededor buscando ayuda. El Departamento Médico de Chinatsu no era más que un adorno sin poder político real. Inteligencia, en cambio, quería avivar aún más el conflicto para derribar a Ako. Desde el principio, no había ningún lugar adonde escapar.\n\n\"Ako, esto…\"\n\nAntes de que Iori terminara.\nRiiip, riiip. Ako rompió en cuatro pedazos el documento titulado ‘Plan de búsqueda de Sorasaki Hina’ y lo esparció por el aire. Ante su acción repentina e inesperada, los gritos en la sala se apagaron por un instante.\n\n\"Uf… ¿ya se han calmado un poco?\"\n\nAko arrancó con fuerza la placa de presidenta del comité pegada a su hombro y la arrojó entre los trozos de papel roto.\n\n\"Bien. Lo diré públicamente. Tal como afirman Ejecución e Inteligencia, yo amaba a la jefa Hina. Y quizá la razón por la que la jefa nos abandonó y se fue fue porque le daba asco trabajar en el mismo espacio que yo. Que su ayudante la amara… ¿cuánto de jodidamente asquerosa le habré parecido? Debí haberme suicidado. Y aun después de que la jefa se fue, ni siquiera puedo apuntarme la pistola a la cabeza. ¡Por si algún día, de repente, la jefa vuelve! ¡Aunque sepa que eso no va a pasar!\"\n\nAko está soltando en la sala insultos que jamás había dicho. Y aun así, nadie podía detenerla. ¿Porque en el momento en que alguien abriera la boca para detenerla, presentía que ocurriría algo peor? Ako tomó aire.\n\n\"Haa, haa. Uf. Sí. Ya no puedo aguantar más. En vez de quedarme aquí ganándome su desprecio, lo dejaré. Renuncio al cargo de presidenta del comité y volveré a ser Administradora Principal. Y de ahora en adelante, la jefa Hina la buscaremos exclusivamente desde el Departamento de Planificación. Eso es todo. Se levanta la reunión periódica.\""
 GEH.event.10.a: "Mientras Ako salía dando un portazo, nadie pudo detenerla."

 GEH.event.11.t: "Yo, en una estación que se muere"
 GEH.event.11.desc: "\"Administradora Principal Amau Ako. Yo… te amo. Fue así desde el principio, y sigue siéndolo ahora. Hubo momentos en que quise huir… pero ahora estoy segura. Te amo.\"\n\nNuestro encuentro y nuestra vida quizá habían continuado, solo para esta confesión.\nLos sentimientos que solo guardé en el pecho se esparcieron montados en un viento tibio, y las palabras que estallaron por fin llegaron hasta ti y dejaron su huella.\n\nUn día normal en el que, tras terminar la reunión, solo deberíamos habernos despedido ligeramente y volver cada una a su lugar.\nPero la jefa Hina me llamó en silencio afuera del edificio del comité y, tras hacerme esperar, finalmente dijo esas palabras. Su voz, siempre firme y clara, esta vez temblaba. La voz de la jefa Hina, a quien veneré, respeté y terminé amando, sonó tan débil… y sin embargo tan nítida. En ese instante, tuve la ilusión de que todo el ruido del mundo desaparecía.\n\n¿Cuánto habrá dudado la jefa Hina antes de tomar la decisión de hoy? Yo ni siquiera puedo imaginarlo.\nPero esta persona, que vacila frente a sus propios sentimientos y extiende la mano con cuidado… sin duda era mi ‘jefa Hina’. Ella, que siempre se plantaba con orgullo al frente del comité, ahora decía esto solo por mí.\n\nLa persona que tengo frente a mí es Sorasaki Hina, igual antes y después del Gran Traslado.\nLa imagen de ella poniéndose el abrigo con firmeza y saliendo de la oficina, y la imagen de ahora, abriéndome el corazón con cautela… ambas eran ella.\nYo amé a Hina en todas esas estaciones: la de cuando la conocí, la de Gehenna, y la de este mundo. En el momento en que lo reafirmé, como si estuviera soñando, tomé su mano. Y sentí que esa mano era real.\n\nMe gusta la usted de ahora. Amé a la usted fría, a la usted implacable, a la usted valiente, y también a la usted de este instante, que me dijo que me ama; lo amo todo.\n\n\"Ako… ¿y tú qué?\"\n\nCon mi mano entre las suyas, Hina pronunció mi nombre en voz baja. La vista se me nubló. Con una sola voz, todo mi cuerpo tembló. Solo por el hecho de estar siendo amada… así de cálido puede ser.\n\n\"¿Que qué…? Sabiendo perfectamente qué voy a responder, me sale con esto. ¿No cree que es un poco cruel?\"Yo asentí en silencio y lloré. Estas lágrimas no eran tristeza, sino el peso del amor al que por fin había llegado."
 GEH.event.11.a: "En esta estación, avanzaremos juntas hacia el futuro"


 ## 히나 탈주시 이벤트 ##

 GEH.event.12.t: "La oficina de la presidenta del Comité de Disciplina, sin Ako ni Hina"
 GEH.event.12.desc: "\"Sobre la elección de una nueva presidenta del Comité de Disciplina…\"\n\nCon voz temblorosa, Chinatsu habló en la sala del consejo del comité, cuyos asientos estaban ocupados por miembros del Departamento de Planificación. Tras la dimisión de Ako, el Comité de Disciplina estaba siendo gestionado por un liderazgo colectivo formado por figuras importantes con larga trayectoria. Y en especial, bajo la iniciativa del Departamento de Planificación, donde el poder se había concentrado por la influencia de la anterior Administradora Principal Ako. En ese panorama, el Departamento Médico, sin poder político, solo había conseguido que Chinatsu, una sola persona, obtuviera el derecho a participar en el consejo.\n\n\"¿El consejo ya ha tomado alguna decisión? Entre los altos mandos de antes del Gran Traslado, pienso que la señorita Shiromi Iori sería la más adecuada…\"\n\nApenas se mencionó a Iori, estallaron gritos en el consejo.\n\n\"¡Esa mujer, jamás!\"\n\"¡Si precisamente quienes lideraron el outing y el acoso contra la Administradora Principal fueron el Departamento de Inteligencia y Ejecución, donde está Shiromi!\"\n\"¡Sea quien sea la presidenta, a esa perra no la vamos a tolerar nunca!\"\n\nChinatsu ya se lo esperaba. Pero el problema era que dentro del Departamento de Planificación no existía un líder carismático capaz de reemplazar a Ako. Chinatsu inclinó la cabeza en disculpa y volvió a preguntar.\n\n\"Entonces, por el momento… ¿se ha decidido mantener el liderazgo colectivo a través del consejo?\"\n\"Seguro encontraremos una buena nueva presidenta. …Fuera de Ejecución o Inteligencia.\""
 GEH.event.12.a: "La reunión continuó en un ambiente deprimente."

 GEH.event.13.t: "Ceremonia de nombramiento de presidenta del Comité de Disciplina - Natsume Iroha"
 GEH.event.13.desc: "La relación hostil entre el Comité de Disciplina y el Pandemonium ya era ampliamente conocida. Por eso, que una exdiputada del Pandemonium se convirtiera en presidenta del comité era algo bastante inusual, pero Natsume Iroha era la alternativa más realista que el comité podía escoger. Por su amistad personal con Sorasaki Hina, seguía siendo relativamente favorable al comité, y su desempeño como burócrata competente había sido reconocido. Y como la mayor parte del poder real seguiría en manos del Departamento de Planificación, le era imposible a Iroha sabotear institucionalmente al comité.\n\n\"Juro, conforme a la designación del Departamento de Planificación, desempeñar fielmente… el cargo de presidenta del Comité de Disciplina, y juro continuar cooperando estrechamente con el consejo del Departamento de Planificación para mantener la estabilidad y el orden de Gehenna.\"\n\nComo si estuviera balbuceando de forma extraña la palabra ‘fielmente’, Iroha recibió el brazalete de presidenta del comité que le tendía la Administradora Principal Ako, con ojos muertos. Mientras se colocaba en el hombro el brazalete entregado por Ako, estalló un aplauso en la oficina de la presidenta del comité, llena de miembros del Departamento de Planificación.\n\nAl fin y al cabo, una presidenta títere del Departamento de Planificación. Será más fácil holgazanear que trabajando en el Pandemonium, ¿no? Iroha sonrió con amargura y, manteniendo la postura del apretón de manos con Ako, se plantó frente a la cámara."
 GEH.event.13.a: "¡Viva la presidenta del Comité de Disciplina Natsume Iroha! ¡Viva el consejo!"

 GEH.event.14.t: "Ceremonia de nombramiento de presidenta del Comité de Disciplina - Onikata Kayoko"
 GEH.event.14.desc: "Onikata Kayoko era un talento cuya capacidad el Comité de Disciplina llevaba mucho tiempo reconociendo. Aunque, nominalmente, la Agencia de Información 68 no era más que un objetivo de arresto para el comité, la relación personal entre la Administradora Principal Ako y Kayoko era tan conocida que algunas estudiantes incluso comentaban: “¿No habrá sido Kayoko una alta mando del comité en la época del régimen del ‘Emperador del Trueno’?” Por eso, que Kayoko, alguien en quien Ako confiaba, se convirtiera en la nueva presidenta del comité no era algo tan extraño. Envolviéndose con el abrigo de presidenta del comité, idéntico en forma al de Hina pero confeccionado de nuevo para el cuerpo de Kayoko, Kayoko declaró con voz firme.\n\n\"Juro, conforme a la designación de la Administradora Principal Amau Ako, desempeñar fielmente el cargo de presidenta del Comité de Disciplina, y juro continuar cooperando estrechamente con el consejo del Departamento de Planificación para mantener la estabilidad y el orden de Gehenna.\"\n\nAko, con el rostro agotado, diciendo “contigo puedo confiar y dejarlo en tus manos”, le colocó personalmente a Kayoko el brazalete de presidenta sobre el hombro. En ese instante, estalló un aplauso en la oficina de la presidenta, llena de miembros del Departamento de Planificación.\n\nAunque al fin y al cabo sea una presidenta títere del Departamento de Planificación, ya que ha asumido el cargo, tendrá que esforzarse lo máximo posible con sus compañeras de la agencia. Sumida en pensamientos profundos, Kayoko se quedó frente a la cámara manteniendo la misma postura del apretón de manos con Ako."
 GEH.event.14.a: "¡Viva la presidenta del Comité de Disciplina Onikata Kayoko! ¡Viva el consejo!"

 GEH.event.15.t: "Ceremonia de nombramiento de presidenta del Comité de Disciplina - Aru Rikuhachima" #Oculto - Aru anti-Gehenna
 GEH.event.15.desc: "Aru Rikuhachima era una persona que no encajaba con el cargo de presidenta del Comité de Disciplina. No era más que una simple infractora del reglamento escolar, y hasta antes del Gran Traslado, nadie pensaba en serio —más allá de una broma— que ella fuera apta para ese puesto. Que ella empezara a surgir como alternativa real para el puesto vacante ocurrió gracias a la imagen heroica y las contribuciones que Aru Rikuhachima mostró tras el Gran Traslado. En especial, su actitud de no doblegarse pese a haber sufrido un atentado nazi mientras se esforzaba por la armonía entre los de Kivotos y los locales fue un factor que hizo que muchos miembros del comité cambiaran su percepción sobre Aru.\n\n\"Yo, Aru Rikuhachima, regente del Gran Ducado de Luxemburgo, juro, conforme a la designación de la Administradora Principal Amau Ako, desempeñar fielmente el cargo de presidenta del Comité de Disciplina, y juro continuar cooperando con el consejo para mantener la estabilidad y el orden de Gehenna.\"\n\nAko, con una expresión algo tensa, diciendo “si tienes algún problema, consúltalo con la señorita Kayoko”, le colocó personalmente a Aru el brazalete de presidenta sobre el hombro. En ese instante, estalló un aplauso en la oficina de la presidenta, llena de miembros del Departamento de Planificación.\n\nEs un momento histórico: la regente de un pequeño país, Luxemburgo, pasa a ocupar también el cargo de líder nacional de Gehenna como presidenta del Comité de Disciplina. Aru, en lugar de un apretón de manos, apoyó sobre la mano de Ako la suya, que no podía hacer fuerza debido a su discapacidad. Las cámaras de los periodistas convocados por el comité enfocaron a ambas, Ako y Aru."
 GEH.event.15.a: "¡Viva la presidenta del Comité de Disciplina Aru Rikuhachima! ¡Viva el consejo!"

 GEH.event.16.t: "Problemas de trabajo de la Administradora Principal"
 GEH.event.16.desc: "Ha pasado mucho tiempo desde que la presidenta del Comité de Disciplina Sorasaki Hina desapareció dejando solo una breve carta. La mayoría de los miembros del comité cree que Hina ya huyó al extranjero o, en el peor de los casos, que se quitó la vida. Sea como sea, piensan que el comité no tiene forma de encontrarla.\n\nSin embargo, al llenarse la vacante del cargo de presidenta del comité, las actividades de búsqueda de Ako volvieron a cobrar vida. Ella, incluso abandonando parte de sus deberes como Administradora Principal, recorre por su cuenta toda Gehenna en busca de pistas sobre Hina.\n\nDesde Ejecución e Inteligencia incluso se presentó una moción de impeachment contra Ako, pero por la férrea voluntad de la presidenta [GEH.GetLeader], Ako pudo seguir continuando la búsqueda de Sorasaki Hina. Aunque la probabilidad de que Ako encuentre a la presidenta sea casi nula, eso era, aun así, la última motivación que le permitía seguir viva."
 GEH.event.16.a: "No te rindas jamás."

 # event 200~ Eventos de enfoque de la ruta normal

 GEH.event.200.t: "Mantener el status quo"
 GEH.event.200.desc: "El Comité de Disciplina de Gehenna se divide claramente en dos corrientes. Ejecución, que promueve un militarismo de línea dura; y el Departamento de Planificación, centrado en tecnócratas que valoran la razón fría y los datos. Aunque persiguen el mismo objetivo, siempre han defendido caminos distintos. La Segunda Asamblea fue el escenario donde ese choque ideológico se mostró de frente. La discusión encendida se prolongó hasta pasar la noche, y al final no se llegó a ninguna conclusión. El único resultado fue que “no se pudo tomar ninguna decisión”.\n\nEntre los miembros del comité empezó a correr un rumor de forma natural: \"A este paso, después de pelear así, van a acabar odiándose al punto de no querer ni verse la cara.\" Pero esa predicción falló. Amau Ako y Shiromi Iori, que en actos oficiales mantenían debates afilados, en privado, por el contrario, conversaban con una actitud despreocupada. Una sonrisa suave aun con formalidades, confianza oculta dentro de un tono frío—era una relación que no podía explicarse solo con la palabra “conflicto”.\n\nAl final, el desenlace de una asamblea donde nadie ganó se convirtió, irónicamente, en el desenlace más ideal. Bajo la hábil mediación de la presidenta del comité, la tensión entre facciones se detuvo justo antes de estallar, y el comité pudo mantenerse una vez más como una sola organización."
 GEH.event.200.a: "El conflicto entre los miembros rasos sigue, pero es un problema que se puede resolver."

 GEH.event.201.t: "Negociaciones con el Partido Socialdemócrata"
 GEH.event.201.desc: "Willy Lange, un político regional del Partido Socialdemócrata alemán, era uno de los muchos que habían huido a Checoslovaquia tras la llegada al poder del régimen nazi y que, al establecerse un gobierno antinazi en Baviera, regresaron de nuevo a Deutschland. Lange no confiaba en la nueva organización caudillista llamada Gehenna, pero también era cierto que, fuera de ellos, no existían muchas alternativas que toleraran al Partido Socialdemócrata. Sin poder ocultar su ansiedad, Lange miró su reloj de pulsera una y otra vez mientras esperaba en la sala de reuniones a que entrara el mando del comité con quien tenía cita.\n\n\"…Gracias por esperar. La presidenta del comité ha revisado la propuesta de negociación del Partido Socialdemócrata.\"\n\nExactamente dos minutos antes de la hora acordada, entró a recibirlo una mujer seca llamada Chinatsu. Era una de las líderes de facción dentro del comité, y se decía que se le había concedido plenos poderes para estas negociaciones con el Partido Socialdemócrata. Lange pensó que, para ser una alta dirigente del partido, ella se veía demasiado joven, pero fue lo bastante sabio como para no decirlo en voz alta.\n\n\"Nosotros queremos el derecho a la actividad legal del Partido Socialdemócrata y una propuesta de reforma de la ley laboral en Gehenna. La cooperación se dará solo después de eso…\"\n\"Sí. Así como el señor Lange desea el orden bajo el Partido Socialdemócrata, nosotros también deseamos estabilidad y orden. Al menos dentro del territorio que la jefa [ROOT.GetLeader] controla directamente, el Partido Socialdemócrata será legalizado.\"\n\nChinatsu fue más cooperativa con su propuesta de lo que Lange había esperado. Aunque la “actividad legal” permitida por el comité estaba estrictamente limitada a un nivel de organización civil, si se consideraba que ellos no eran una democracia, era un nivel tolerable. Tras una breve reunión, las negociaciones se cerraron con éxito, y Lange prometió la cooperación del partido para alentar a los miembros socialdemócratas a alistarse en el ejército de Gehenna."
 GEH.event.201.a: "Paso a paso, hacia adelante"

 GEH.event.202.t: "El arte de ajustar"
 GEH.event.202.desc: "Tras el fracaso de la Segunda Asamblea, el comité se tomó un breve respiro. Ejecución y Planificación seguían sin ceder en sus lógicas, pero ya no afilaban las cuchillas. Esto no fue la victoria de nadie, sino el resultado de la capacidad persuasiva de una sola persona. La presidenta [ROOT.GetLeader] tomó una decisión. \"El fracaso de la asamblea no es por terquedad de los mandos. Todos alzaron la voz, pero no supe tejer todas esas palabras en una sola: es responsabilidad mía.\" Esa confesión no era una simple evasión de responsabilidad. La sinceridad revelada en un discurso cargado de culpa movió el corazón de los miembros, y hasta la zanja profunda entre facciones empezó a rellenarse poco a poco.\n\nEl conflicto entre Planificación y Ejecución, desde el inicio, no era odio, sino una diferencia de rumbo. Esa brecha se cerró rápidamente con unos cuantos discursos sinceros y una mediación constante, y el comité volvió a moverse bajo “un solo orden”. Aún no es una coincidencia perfecta. Pero cuando un líder se reprende a sí mismo y dice que avancen juntos—el comité decidió volver a confiar."
 GEH.event.202.a: "Un líder no es quien domina, sino quien responde."

 GEH.event.203.t: "¿Negociar con el Pandemonium?"
 GEH.event.203.desc: "Jefa Hina, yo desde luego la creo y confío en usted más que en nadie, pero… pese a la amenaza de Trinity, el Pandemonium no es un socio en el que se pueda confiar. Esos mapaches del Pandemonium nos arrojarán como alimento para los proyectiles de Misuno y Kirifuji, y luego se quedarán en un sillón bebiendo vino, ¿sabe? Y aun así, ¿negociar…?\n\nSí. Claro que yo siempre estaré de su lado, y si usted decide confiar en esos maldi—, es decir, en esos astutos, entonces yo también obedeceré sus órdenes. Pero yo jamás confío en [GEM.GetLeader]. Solo confío en la elección de “la jefa Hina”. …Sí. Redactaré el documento diplomático para enviárselo a ellos. Lo escribiré con una bajeza que hasta ese presidente engreído quedará impresionado. Total, una simple carta no puede prometer nada."
 GEH.event.203.a: "Ako inclinó la cabeza ante Hina y salió."

 GEH.event.204.t: "¿El caudillo de Baviera?"
 GEH.event.204.desc: "Iori miró de reojo un póster de una organización clandestina del Partido Comunista de Deutschland pegado en la pared del edificio del comité. Sin duda era un póster que los miembros de Ejecución arrancaron anoche. Parece que al amanecer regresaron para volver a pegarlo. El contenido era simple: el régimen de [ROOT.GetLeader], al final, no era más que una organización militar “reaccionaria”, sin ninguna diferencia con Wilhelm II. Iori ni siquiera sabía qué clase de persona era ese tal Wilhelm II, y tampoco entendía por qué era un problema que [ROOT.GetName] fuera una “organización militar”.\n\n\"¿Comunistas…? Una imitación barata de la Academia Red Winter.\"\n\nIori pateó el póster con la bota, levantando tierra.\n\n\"Tampoco quiero perder el tiempo. Haa… Voy a decir que lo vuelvan a romper. …¿Y qué demonios tiene de malo ser un caudillo?\""
 GEH.event.204.a: "Las armas son la ideología y el orden más poderosos."
 GEH.event.1000.t: "Anexión de [HEU.GetName] por [GEH.GetName]"
 GEH.event.1000.desc.a: "Tras la captura por parte del Comité de Disciplina de Gehenna del Gran Ducado de Luxemburgo y de la facción de la Agencia de Información 68 que lo dirigía, comenzó el debate sobre el trato que recibiría el liderazgo del Gran Ducado. El presidente del parlamento Émile Reuter fue arrestado tras resistirse escupiendo a la cara de los miembros del comité durante la detención, y el primer ministro Joseph Bech fue capturado cuando intentaba huir cruzando la frontera y trasladado a un campo de prisioneros. Los políticos locales, debido a la masacre cometida por los de Gehenna justo después del Gran Traslado, se muestran extremadamente poco cooperativos con nosotros, y no hemos podido mantener conversaciones avanzadas sobre el gobierno de Luxemburgo con ningún partido local.\n\nLa única variable es la Agencia de Información 68. Ella, que antes del Gran Traslado solo era la jefa de una pequeña agencia, ahora se ha convertido en la regente del Gran Ducado de Luxemburgo y en la líder internacional del movimiento político liberal internacional conocido como la “Revolución del 68”. Incluso los miembros más duros del comité aceptan que ya no se puede castigar a la actual Aru Rikuhachima como si fuera, como antes del Gran Traslado, una simple delincuente menor por violar reglas.\n\nDesde Inteligencia consideran que Aru Rikuhachima se ha vuelto demasiado peligrosa como activista social, y que hay que impedir que Aru influya en el comité. El jefe de Inteligencia sostiene que, para asegurar que el Gran Ducado de Luxemburgo no pueda reconstruirse, lo más seguro es fusilar a todos los políticos locales que están en el campo de prisioneros y, después, expulsar a ella y a sus compañeras de la Agencia de Información 68 tras un juicio como “prisioneras políticas anti-Gehenna”.\n\nEn cambio, la Administradora Principal Ako argumenta que, aunque el resto del personal de la Agencia 68 no es importante, Onikata Kayoko en particular posee un talento excepcional y vale la pena aceptarla como alta mando del comité. Ako propuso mantener al Gran Ducado de Luxemburgo como un territorio autónomo bajo Gehenna, pero con la condición de que la Agencia de Información 68 al completo se incorpore al comité. Kayoko, para proteger a Aru, no podrá rechazar claramente esa propuesta." #La agencia es fashi
 GEH.event.1000.desc.b: "Tras la captura por parte del Comité de Disciplina de Gehenna del Gran Ducado de Luxemburgo y de la facción de la Agencia de Información 68 que lo dirigía, comenzó el debate sobre el trato que recibiría el liderazgo del Gran Ducado. El presidente del parlamento Émile Reuter fue arrestado tras resistirse escupiendo a la cara de los miembros del comité durante la detención, y el primer ministro Joseph Bech fue capturado cuando intentaba huir cruzando la frontera y trasladado a un campo de prisioneros. Los políticos locales, debido a la masacre cometida por los de Gehenna justo después del Gran Traslado, se muestran extremadamente poco cooperativos con nosotros, y no hemos podido mantener conversaciones avanzadas sobre el gobierno de Luxemburgo con ningún partido local.\n\nLa única variable es la Agencia de Información 68. Ella, que antes del Gran Traslado solo era la jefa de una pequeña agencia, ahora se ha convertido en la regente del Gran Ducado de Luxemburgo y en una líder popular que cuenta con el apoyo de los luxemburgueses locales. Incluso los miembros más duros del comité aceptan que ya no se puede castigar a la actual Aru Rikuhachima como si fuera, como antes del Gran Traslado, una simple delincuente menor por violar reglas.\n\nDesde Inteligencia sostienen que Aru Rikuhachima se ha vuelto una figura demasiado influyente y que estorba a la “gehenización” de Luxemburgo. El jefe de Inteligencia sostiene que, para asegurar que el Gran Ducado de Luxemburgo no pueda reconstruirse, lo más seguro es fusilar a todos los políticos locales que están en el campo de prisioneros y, después, expulsar a ella y a sus compañeras de la Agencia de Información 68 tras un juicio como “prisioneras políticas anti-Gehenna”.\n\nEn cambio, la Administradora Principal Ako argumenta que, aunque el resto del personal de la Agencia 68 no es importante, Onikata Kayoko en particular posee un talento excepcional y vale la pena aceptarla como alta mando del comité. Ako propuso mantener al Gran Ducado de Luxemburgo como un territorio autónomo bajo Gehenna, pero con la condición de que la Agencia de Información 68 al completo se incorpore al comité. Kayoko, para proteger a Aru, no podrá rechazar claramente esa propuesta." #La agencia es comunista
 GEH.event.1000.a: "Gehenna debe seguir expandiéndose. No hay excepciones."
 GEH.event.1000.b: "Es más importante aceptar a los talentos sobresalientes en el comité."

 GEH.event.1001.t: "Disolución del Gran Ducado de Luxemburgo"
 GEH.event.1001.desc.a: "Aru Rikuhachima, apoyando la espalda contra el muro de la celda subterránea del comité, soltó un profundo suspiro. Parece que su historia termina aquí. La vida en Luxemburgo fue dolorosa, sí, pero también había sido una vida con sentido.\n\nKayoko se acercó a la agotada Aru y se sentó a su lado.\n\n\"Jefa, lo sé. …Estás pensando: ‘fracasamos por completo, ya se acabó, esto es el fin’. ¿Verdad?\"\n\"Ajajá… Como jefa hardboiled quiero verme genial… pero todo es fracaso, fracaso, fracaso… y esta vez hasta traicioné las expectativas de quienes creían en mí.\"\n\"No. Tú no traicionaste a nadie. Solo que el enemigo era demasiado fuerte. Incluso si es en otro lugar que no sea Luxemburgo, puedes seguir persiguiendo el sueño que deseas. Un mundo donde los locales y la gente de Kivotos vivan en armonía. ¿No dijiste que querías vivir en un mundo así?\"\n\nTras un breve silencio, la expresión oscura de Aru empezó a aclararse poco a poco. Puede que haya fracasado una vez. Puede que los fracasos sigan viniendo. Pero el ideal de Aru aún no estaba pisoteado. Aunque sea un sueño imposible, Aru seguirá alzando el vuelo hasta que se le rompan las alas. Hacia su sueño." #La agencia es fashi
 GEH.event.1001.desc.b: "\"Muy bien hecho, Asagi. Heriste a la jefa Aru, rompiste la amistad de la Agencia de Información 68, y aun así… tu Luxemburgo militarista se termina así, aplastado. ¿Qué se siente, cabrón?\"\n\"Ja. Sí, claro, ¿todo es mi culpa? ¡No, Onikata, fuiste tú la que saboteó desde dentro y arruinó mi plan para Aru-chan, pinche perra!\"\n\n¡Paf, crack! Los gritos e insultos de Kayoko y Mutsuki, golpeándose a puñetazos entre ellas. Ni siquiera los miembros del comité que debían vigilar el calabozo hasta el juicio podían acercarse a separarlas: parecían bestias furiosas lanzándose una contra la otra.\n\nLa amistad de la agencia se rompió. Los sueños, y ya ni siquiera la esperanza, dejaron de existir. Haruka, días atrás, había volcado a escondidas las pastillas que guardaba y ahora yacía inconsciente en el hospital. Dicen que quedó en estado vegetativo y que ya es imposible que vuelva a despertar.\n\nAru, agotada, apoyada contra la pared, miró a las dos golpeándose a puñetazos. El primer encuentro en Kivotos, la fundación de la Agencia de Información 68 y las aventuras que vivieron juntas. Todo eso… ahora se sentía como si hubiera sido una simple ilusión. ¿De verdad existieron *de verdad* esos momentos felices? Claro que no. No podía ser que a ella se le hubiera permitido algo así.\n\nAru sacó del pecho el veneno que Haruka había dejado. Haruka no supo ajustar bien la dosis de las pastillas que debía tomar. Pero Aru no cometerá ese error. Para escapar de este infierno, Aru sonrió con brillo y se metió todas las pastillas en la boca." #La agencia es comunista
 GEH.event.1001.a: "Una historia termina, y otra historia comienza." #Fashi
 GEH.event.1001.b: "Adiós, Agencia de Información 68." #Comun

 GEH.event.1002.t: "Agencia de Información 68 bajo el mando directo de la presidenta del Comité de Disciplina"
 GEH.event.1002.desc.a: "Era la primera vez que [GEH.GetLeader] visitaba personalmente el palacio ducal de Luxemburgo. Oficialmente, las cuatro integrantes de la Agencia de Información 68 fueron nombradas como guardaespaldas personales de la presidenta del comité, un rango que no pertenecía a ningún departamento del comité. Por supuesto, el “cargo” de escolta no era más que una excusa para darles un puesto.\n\n\"¡Ah! ¡Presidenta del comité! Te estaba esperando. Je, ¿quieres un café?\"\n\nEn el despacho del palacio, Aru Rikuhachima, con una sonrisa amable, ya había preparado una taza de café de goteo para [GEH.GetLeader] y la esperaba. Mientras tomaban café juntas, la presidenta le expuso las condiciones de negociación que traía preparadas. El gobierno y el parlamento del Gran Ducado de Luxemburgo se mantendrían como una “región autónoma de minorías” de Gehenna. Aru conservaría la autoridad para seguir gobernando Luxemburgo. Pero el ejército que ella poseía sería reorganizado por completo dentro del ejército de [GEH.GetName]. Y por último, toda la Agencia de Información 68, como altos mandos del comité, tendría la obligación de jurar lealtad a la presidenta [GEH.GetLeader].\n\n\"Je, que yo, una forajida hardboiled, sea alta mando del comité… ¿no suena gracioso? Pero está bien.\"\n\nCon el brazalete del comité que decía “moral pública” puesto en el brazo, Aru se levantó.\n\n\"Presidenta, ¿podemos caminar un momento juntas? Como alta mando del comité, tengo algo que pedirte.\"\n\nEl palacio era enorme, pero Aru solo utilizaba un espacio muy pequeño dentro de él. La razón se hizo evidente enseguida. En el interior del palacio, el lugar donde, el día del Gran Traslado, los alborotadores de Gehenna perpetraron la masacre. Aunque repintaron las paredes, no podían borrar del todo las marcas de balas por todos lados. Aru guio a la presidenta hacia la urna familiar en el dormitorio del palacio. Era el lugar donde se guardaban las urnas del anterior gran duque y de su familia.\n\n\"La gente de Luxemburgo es bastante conservadora. Los niños de Gehenna asesinaron al adulto que aquí consideraban verdaderamente valioso. Así que… incluso si los luxemburgueses no llegan a quererte, espero que lo entiendas. Yo fui una jefa tonta y no pude hacer felices a estas personas… pero confío en que tú, como presidenta, sí podrás.\"\n\nLo haré, sin falta. Diciendo eso, [GEH.GetLeader] rezó junto a Aru ante la urna de la gran duquesa Charlotte. Deseando que el sueño de construir un mundo mejor continúe." #La agencia es fashi
 GEH.event.1002.desc.b: "Era la primera vez que [GEH.GetLeader] visitaba personalmente el palacio ducal de Luxemburgo. Oficialmente, las cuatro integrantes de la Agencia de Información 68 fueron nombradas como guardaespaldas personales de la presidenta del comité, un rango que no pertenecía a ningún departamento del comité. Por supuesto, el “cargo” de escolta no era más que una excusa para darles un puesto.\n\n\"Te estaba esperando. ¿A la presidenta le gusta la cerveza? Ah, perdón. En horario de trabajo no se puede… entonces, ¿café?\"\n\nLa historia de que Aru fue atacada con brutalidad por los nazis y por fuerzas locales anti-Kivotos era, sin duda, cierta. Su ojo izquierdo había quedado completamente ciego, y con el brazo derecho ni siquiera podía sostener una bandeja con café. [GEH.GetLeader] trasladó la bandeja en su lugar para ayudarla.\n\nLo normal habría sido explicar ahora las condiciones de negociación: que Aru siguiera gobernando Luxemburgo, pero jurando obediencia absoluta a la presidenta. Sin embargo, la presidenta quería preguntar otra cosa.\n\n- ¿Por qué, incluso después de terminar así, no te fuiste de Luxemburgo?\n\nAru bajó la cabeza mientras levantaba una taza con la mano temblorosa.\n\n\"Antes yo solo era una niña. Me reía y armaba desmadre con mis amigas, jugando a ‘empresa’. Pero cuando ocurrió el Gran Traslado y llegamos a un Luxemburgo lleno de cadáveres por todas partes… tuve que convertirme en una adulta que asume responsabilidades. ¿Qué responsabilidad? Je… quizá, vivir para expiar el pecado que cometieron los idiotas de Gehenna, ante la gente que perdió a su familia por la invasión.\"\n\nAru Rikuhachima no mató a nadie. Al contrario, ¿no salvó a muchísima gente aquel día? Aunque se le dijera eso, una sonrisa no aparecía en su rostro.\n\n\"Al final, no cambia que ese día muriera tanta gente. …Yo fui una líder tonta y no pude curar el trauma que lleva esta gente. No, si es que yo misma vivo atrapada en el trauma. Pero… tú eres mejor que yo, presidenta. Haz feliz a la gente de esta tierra. Te lo pido.\"\n\nLo haré, sin falta. Solo cuando escuchó la respuesta segura de [GEH.GetLeader], Aru mostró una sonrisa tenue." #La agencia es comunista
 GEH.event.1002.a: "El café tenía un sabor profundo, con buen cuerpo."

 GEH.event.1003.t: "No dudes"
 GEH.event.1003.desc: "La persona que Amau Ako más ama es Sorasaki Hina; su pasatiempo más preciado también es Sorasaki Hina; y su especialidad es observar a Sorasaki Hina. Por eso, ella sabía bien que, últimamente, Hina, rodeada de fanáticos del comité, se estaba agotando por un estrés laboral excesivo y una carga insoportable.\n\nY además, llevaba casi un mes con la “negativa a recibir visitantes” de la presidenta del comité. ¿Y si le hubiera pasado algo a la jefa Hina? Cuando la paciencia de Ako ya estaba al límite y hasta llegó a considerar un plan para colarse a escondidas en la casa de Hina, milagrosamente, los fieles fanáticos le dieron permiso para ir a verla. Al entrar en la casa impecablemente ordenada de Sorasaki Hina, la recibió Hina, con ‘Historia de la decadencia y caída del Imperio romano’ de Edward Gibbon abierto sobre el escritorio.\n\n\"Ah, Ako. Perdón por no contactarte. Últimamente no me he sentido bien. Pero a partir de mañana pienso volver al trabajo, así que no tienes que preocuparte por nada.\"\n\nHina habló con amabilidad, le tomó la mano y sonrió. Era, sin duda, la propia Sorasaki Hina que Ako más adoraba. Pero, ¿por qué? A diferencia de la expresión cansada y dolorida que mostraba en la oficina, aquí sonreía con una tranquilidad excesiva.\n\n\"Jefa… ¿acaso no ha estado pensando que el trabajo es pesado, o que le resulta doloroso ir a la oficina…?\"\n\"¿Pesado? No lo entiendo. Yo, como presidenta del Comité de Disciplina, tengo el deber de ser el modelo absoluto para todos, como líder que guía a Gehenna. ¿Cómo podría un líder de acero tener un pensamiento *irracional* como que le duele ir a trabajar?\"\n\"P-pero, jefa Hina… hasta hace poco usted misma…\"\n\nAl ver a Hina hablar de forma mecánica sobre la razón y el “líder de acero”, Ako sintió miedo. ¿Qué demonios ocurrió en un mes? Ako miró fijamente a los ojos de Hina. Por un instante, brevísimo, creyó ver en sus pupilas un circuito complejo compuesto por mecanismos. ¿De verdad esta Sorasaki Hina era la presidenta que ella conocía?\n\n\"Si eres inteligente, Ako, también conocerás el imperativo categórico, ¿no? Todos los habitantes de Gehenna deben obedecer las órdenes de la presidenta del comité. Es una orden. *No me dudes*.\"\n\"E-espera un momento. ¿Que no la dude…? Pero sus ojos…\"\n\"Por la variación de tu pulso y el movimiento de tus emociones, parece que me amas. ¿Acaso Ako era tan cruel que ni siquiera puede aceptar la orden de la persona a la que ama?\"\n\"N-no, pero…\"\n\nTum, tum. El corazón parecía a punto de estallar. Como derritiendo esa ansiedad, Hina acarició lentamente la mejilla de Ako.\n\n\"Lo acabo de decir. No pienses. Solo obedece y será más fácil. *Amau Ako no vio nada en mis ojos.* Solo tienes que admitir eso.\"\n\"No vi… nada…\"\n\"Así que vuelve y prepara mi trabajo de mañana. Si lo haces, hasta saldré contigo el fin de semana. Satisfaré la fantasía de Sorasaki Hina que tú imaginabas.\"\n\"Yo…\""
 GEH.event.1003.a: "\"…Yo… sí. No vi nada en los ojos de la jefa.\""

 GEH.event.1004.t: "Un dios con cuerpo de máquina"
 GEH.event.1004.desc: "La verdadera Sorasaki Hina desapareció tras renunciar. Incapaz de soportar el fanatismo de los miembros del comité y la presión que este generaba, huyó. Pero, ¿sería posible anunciar esa noticia? Para sus guardias personales, era imposible. Para los fanáticos del comité que se autoproclamaban la guardia personal de Hina, Sorasaki Hina era la razón de existir del comité, la líder que les mostraría el camino que debían recorrer… una deidad sabia con forma humana. Que un dios perfecto huyera de sus creyentes era algo inconcebible. ¿Significaba que Hina no era ese absoluto que ellos deseaban?\n\nSi no hay dios, ¿no habría que crearlo? De los gritos de un fanático nació una esperanza. Aunque el dios hubiera abandonado a los creyentes, los creyentes no abandonarían a su dios. Y así, un ingeniero egresado de Millennium Science School fue invitado en secreto al comité.\n\n\"Les crearé un autómata que funcione a la perfección. Sí. Un dios-máquina que no duerma, no se canse, y siga sirviendo a la patria sin descanso.\"\n\nEl ingeniero, tras recibir por adelantado una suma enorme, les entregó con confianza a los guardias la nueva deidad mecánica. Un nuevo dios que no los abandonaría ni huiría, que no envejecería jamás y que los guiaría por toda la eternidad.\n\nLa nueva ‘Sorasaki Hina’ abrió los ojos y contempló desde arriba a los innumerables creyentes que la veneraban. Ella, un robot incapaz de sentir emociones humanas, sonrió como si los mirara con desdén.\n\n\"Se siente como si despertara de un sueño profundo. Bien… ¿los sacerdotes para mí siguen preparados?\""
 GEH.event.1004.a: "\"Todos seguirán al Señor.\""

 GEH.event.1005.t: "La ausencia del líder"
 GEH.event.1005.desc: "Incluso después de la desaparición de Sorasaki Hina, sus guardias personales lograron ocultar la carta de renuncia incluso a las personas más cercanas, empezando por Amau Ako. Hina solo dejó una carta en su despacho y desapareció; y como los guardias restringían el acceso al despacho todas las madrugadas con el pretexto de “limpieza”, nadie podía entrar. Hina dejó la carta de renuncia sobre el escritorio del despacho, salió con la excusa de un viaje de trabajo y desapareció tal cual. No fue sino hasta medio día después que se reveló que la carta sobre el escritorio era una renuncia.\n\nTras hacerse pública la desaparición, los guardias personales se dividieron de inmediato en dos facciones. La primera estaba compuesta por fanáticos que veneraban a Sorasaki Hina casi como una deidad sabia. Para esos creyentes, que creían que Hina era un ser ‘más allá’ de un simple dictador de acero, su desaparición voluntaria era un hecho imposible: “un dios que abandona a sus fieles”. Los fanáticos concluyeron que Hina no era, en realidad, el dios de Gehenna. Que hasta ahora solo habían seguido a un dios falso, y que su lealtad debía reemplazarse por la de un ‘verdadero’ que estaría en alguna parte. Ni siquiera ellas parecían tener una certeza clara de qué era ese “verdadero Sorasaki Hina”. Si no hay dios, habría que crearlo. De esas palabras solo podía inferirse que existía un método para ‘crear’ un nuevo líder.\n\nLa otra facción estuvo de acuerdo en que no podían ocultar la desaparición para siempre. También eran una facción de leales fanáticos, pero ellas no veneraban a Hina como deidad sabia: solo la seguían como símbolo del régimen de Gehenna y como un líder carismático (que, al final, podía ser reemplazado). Los moderados sostenían que, aunque Sorasaki Hina hubiera desaparecido, la ideología de la “política del líder de acero” que ella dejó atrás seguía viva. Que no necesitaban buscar un nuevo dios; que, mediante un liderazgo colectivo de la guardia personal, podían imitar la ‘política del líder de acero’ de Hina y así continuar la gloria de la gran patria Gehenna."
 GEH.event.1005.a: "Al final, uno de los dos bandos vencerá."

 GEH.event.1006.t: "Desaparición de Sorasaki Hina"
 GEH.event.1006.desc: "\"O sea que la jefa no estaba enferma, sino desaparecida, y ustedes me ocultaron *durante un mes* ese hecho a mí, que soy la Administradora Principal. Sí. Ya entendí perfectamente.\"\n\nEn el instante en que la enfurecida Amau Ako sacó su pistola ‘Hot Shot’, los miembros del comité que llenaban el despacho vacío sacaron sus armas al unísono. Tras un breve momento de tensión, Ako soltó la mano que sujetaba la pistola, presa del vacío y la impotencia. Hina ya no está aquí. Aunque desquitara su furia contra esos locos… el único final sería su propia muerte.\n\n\"Al menos a mí debieron decírmelo.\"\n\nUn guardia personal habló.\n\n\"Fue una elección inevitable para evitar el caos de la patria.\"\n\"…¿al menos no pude estar yo en la posición de participar en esa elección?\"\n\"Juzgamos que, por su lealtad, Administradora Principal, sería imposible ocultarle la desaparición. Todos reconocemos su patriotismo y devoción. Solo… le pedimos que acepte que nosotros necesitábamos tiempo.\"\n\"…¿Y qué piensan hacer de ahora en adelante?\"\n\"La jefa Hina ha desaparecido, pero la voluntad que dejó no ha desaparecido. Nosotros heredaremos esa voluntad.\""
 GEH.event.1006.a: "\"También le pedimos cooperación a la Administradora Principal.\""

 GEH.event.1007.t: "La fe de Sorasaki"
 GEH.event.1007.desc: "1. Confiscar todas las catedrales e iglesias de Gehenna y reconvertirlas en altares para venerar como deidad sabia al gran líder *Sorasaki Hina*.\n2. La fe de Sorasaki será designada como religión de Estado, y todas las religiones salvo la fe en la deidad sabia serán declaradas ilegales.\n\nEra un oficio absurdo. Iori pensaba que Hina era, sin duda, una líder excelente, y confiaba en ella. Pero… ¿venerar a la jefa como a un dios? Es una locura. Que Hina no es un *dios*, sino una persona que ríe y llora como cualquiera: eso, más que nadie, lo sabía Iori, que había estado con ella desde antes del “Gran Traslado”. Aunque tras el traslado, por los fanáticos llamados guardia personal, Iori tenía menos tiempo para ver a Hina… si fuera la Hina que ella conoce, jamás toleraría esto.\n\n\"¡Jefa! Hablemos un momento.\"\n\nAl patear la puerta y entrar al despacho, vio a Hina, con expresión impasible, mirando una tablet. Sus ojos se volvieron hacia Iori.\n\n\"Iori. Buenas tardes. ¿Tienes algún informe importante que no deba pasar por mi guardia personal?\"\n\"¿Guardia personal? ¿Buenas tardes? Ya, ya. Mira esto.\"\n\nIori estampó el oficio sobre el escritorio con un golpe.\n\n\"¿Deidad sabia? ¿Que la veneren como un dios? Ja. ¿Qué, si le rezan a la jefa como si fuera Santa Claus, la jefa bajará regalos del cielo o qué?\"\n\nComo si la comparación con Santa Claus le pareciera interesante, Hina sonrió levemente con la barbilla apoyada en la mano y miró a Iori. La boca sonríe, pero los ojos no expresan nada. Esa combinación incómoda, como una disonancia, hizo que Iori sintiera un mal presentimiento instintivo.\n\n\"Iori. Yo protejo el orden de Gehenna, prevengo el crimen y actúo por la mayor felicidad del mayor número. ¿No equivale eso a darle ya a todos un *regalo*?\"\n\"¡Pero…!\"\n\"Además, esta decisión no la tomé yo. Fue una petición de mi guardia personal. Claro, que todos los gehenianos me recen no es algo eficiente, pero como presidenta del comité tengo el deber de actuar por la mayor felicidad del mayor número de miembros del comité.\"\n\nLa mayor felicidad del mayor número. ¿Es eso lo único que la Hina de ahora puede decir? Iori sintió irritación, pero también entendió que Hina no tenía intención alguna de retirar este plan de “deidad sabia”. Al final, quien se retiró fue Iori."
 GEH.event.1007.a: "\"Haz lo que quieras. Pero yo no le voy a rezar a la jefa.\""

 GEH.event.1008.t: "¡Hina es falsa!"
 GEH.event.1008.desc: "\"¡La Sorasaki Hina de ahora es falsa! ¡La verdadera ya presentó su renuncia y desapareció!\"\n\"Ja. Sí, claro. ¿Será que hay una temporada en la que las enfermedades mentales florecen como flores de primavera? ¿De dónde salieron tantos idiotas tan ‘en flor’ en el comité?\"\n\nIori le metió a la fuerza un pañuelo en la boca al miembro del comité que gritaba y le tapó la boca. ¿Hina falsa? Ridículo. Incluso esta mañana, Iori se reunió con Hina y charlaron. Hablaron por treinta minutos, y la Hina de ese momento era exactamente la misma Hina de siempre que Iori conoce.\n\n¿Falsa? Qué tontería. Iori miró con desprecio al miembro del comité que era arrastrado esposado por los de Ejecución. A su lado, Chinatsu soltó un suspiro.\n\n\"Paranoia… Me preocupa que un tipo de trastorno mental se esté propagando como una epidemia. Hay que hacer un examen general de salud mental a los miembros del comité.\"\n\"Deja los exámenes al Departamento Médico. Y si vuelve a aparecer alguien diciendo esas porquerías de que la jefa es falsa o cosas así, yo misma le destrozo la boca.\"\n\nTodo lo que la jefa Hina ha sufrido por Gehenna… y que la insulten llamándola falsa. Iori se dio la vuelta sintiendo cómo su sentido de la justicia ardía de rabia."
 GEH.event.1008.a: "\"La jefa no es falsa. Hijos de puta…\""

 GEH.event.1009.t: "Reforma de ministerios gubernamentales"
 GEH.event.1009.desc: "La guardia personal de Hina jamás había sido, hasta ahora, un organismo oficial dentro del comité. No era más que una camarilla militar privada e informal compuesta por sus fanáticos. Sin embargo, con la reforma del gobierno, se estableció un nuevo Departamento de Guardia junto a Planificación, Ejecución, Medicina e Inteligencia. El Departamento de Guardia se encargará de múltiples áreas: desde la escolta personal de Sorasaki Hina hasta el castigo de “crímenes ideológicos” de quienes se oponen a Hina.\n\nPor supuesto, hubo oposición de los departamentos existentes… y para apaciguarla, se decidió que Ako, líder de Planificación y Administradora Principal, también ocuparía el cargo de jefa del Departamento de Guardia. Así, Planificación podría ejercer un mínimo de control sobre la Guardia. Esa noticia calmó en parte el descontento dentro del comité.\n\n\"No importa en qué departamento, ni en qué lugar trabaje… yo solo seguiré a la jefa.\"\n\nEl día de la ceremonia de nombramiento como jefa de la Guardia de Gehenna, Ako habló con determinación y saludó a Hina. Hina miró a Ako con una sonrisa serena en la que se percibía una confianza profunda. Ah… una persona capaz de sonreír así… una persona que puede tenderle una mano cálida… no puede ser un robot. Negando la *idea equivocada* que llegó a albergar por un tiempo, Ako apretó con fuerza la mano de su presidenta, la más valiosa para ella.\n\n\"No la decepcionaré jamás. A quienes se opongan a la jefa… no dejaré ni a uno solo.\""
 GEH.event.1009.a: "\"Gracias, Ako. Siempre confío en ti.\""

 GEH.event.1010.t: "El Programa OGAS"
 GEH.event.1010.desc: "El Programa OGAS, a diferencia de lo que dicen algunos aficionados a la ciencia ficción, no significa literalmente una “economía planificada controlada por IA”. Se trata de construir, mediante una estructura de red de comunicaciones central y redes regionales que se expanden hacia las provincias, una compleja red que permita al gobierno central contactar de inmediato con las fábricas locales. Y a través de esa red, guiar de forma revolucionaria la economía planificada en las regiones. Efectos adicionales como el gobierno electrónico serían consecuencias derivadas de la construcción de la red.\n\nPero el OGAS de nosotros tiene un punto especial: en el centro del “gobierno central” existe un dios-máquina. Sorasaki Hina siempre podía predecir con perfección la demanda y la oferta, y operar un programa de economía planificada perfecto. Solo hacía falta conectar la red que transmitiera a todas las fábricas del país las instrucciones que el dios-máquina emitiera.\n\nQuizá no podamos alcanzar a una potencia tecnológica como Millennium, pero incluso con el nivel tecnológico de Gehenna se puede construir una economía planificada OGAS de este grado. Ahora podremos mostrar resultados asombrosos a todo Kivotos."
 GEH.event.1010.a: "¡El dios-máquina nos guiará!"

 GEH.event.1011.t: "La economía planificada completada"
 GEH.event.1011.desc: "\"¿Los de Gehenna se volvieron locos o qué? Dicen que el Estado quiere controlar a su antojo todas las empresas.\"\n\nUn dueño de fábrica bestia, con cabeza de perro, refunfuñó mientras revisaba por la red el documento de órdenes del gobierno que acababa de llegar. Que el Estado controle toda la demanda y la oferta: en este sistema de “capitalismo de Estado”, la libertad productiva de los capitalistas siempre debía ser restringida. Claro, bajo la economía planificada del capitalismo de Estado, los capitalistas aún podían ganar una riqueza de cierto nivel… pero comparado con otros países de mercado, era una cantidad insignificante. Así ya no es diferente de un funcionario soviético provincial, ¿no?\n\n\"Si no fuera un bestia… si fuera humano, ya me habría largado a emigrar.\"\n\nDijo con irritación, y colgó él mismo el documento de órdenes en el tablero de anuncios de la empresa. La población que no es “chicas con halo”, como bestias o robots, no recibe trato de persona en casi ninguna región de la Tierra. Por eso, no hay forma de huir de esta maldita economía planificada. Tal vez si se regresara a Kivotos, otra historia sería. Tras comprobar que el documento quedaba bien colgado, el dueño volvió a su oficina. Hoy, al parecer, no podrá dormir tranquilo."
 GEH.event.1011.a: "Bueno… al menos se puede ganar dinero…"

 GEH.event.1012.t: "Operación de búsqueda de Baal"
 GEH.event.1012.desc: "\"¿Que existe una falsa de la jefa Hina?\"\n\nIori observó con seriedad el retrato hablado que la propia jefa Hina le entregó. Es idéntica a la jefa Hina que Iori conoce, sin ninguna diferencia. Pero Hina explicó que era una criminal brutal del mercado negro, entrenada de forma especial en el Pandemonium desde antes del “Gran Traslado”. Una asesina criada para imitar por completo el exterior de la auténtica Sorasaki Hina con todo tipo de herramientas de disfraz, infiltrarse en el comité en caso de necesidad, asesinar a Hina y reemplazarla.\n\n\"El comité tiene muchos enemigos… así que no sería raro que las mafias criaran a una asesina así. Aunque, claro, no es como si la jefa Hina fuera a caer ante una falsa.\"\n\"Pero la Tierra, a diferencia de Kivotos, es una tierra sin misterio. Sabes que yo ya no soy tan fuerte como lo era en Kivotos.\"\n\nHina habló con calma y señaló su uniforme.\n\n\"No es que esté diciendo debilidades como que temo morir. Solo… quiero evitar el riesgo de que el comité sea manipulado por una falsa. Eso es todo.\"\n\"Lo entiendo. ¿Cómo no voy a saber el peso de la responsabilidad que siempre llevas? …Haré circular este documento entre los otros mandos también. Encontrar a la falsa… Ako-chan será mejor que yo en eso. Es la que más ama a la jefa.\"\n\"Sí. Lo sé bien. …También daré la orden a Ako de que busque a la ‘falsa’.\""
 GEH.event.1012.a: "\"Si es Ako, investigará con muchísimo entusiasmo.\""

 GEH.event.1013.t: "Cerco de Baal"
 GEH.event.1013.desc: "\"¡La asesina huye hacia el interior!\"\n\"¡Persíganla! Si se resiste, pueden abatirla.\"\n\nLa voz de Ako, tan añorada, resonó en el callejón… pero no podía alegrarme. “Pueden abatirla”. Eso significaba que Ako también había caído en el engaño de la falsa. Entonces… ¿cuál es la diferencia entre la falsa y ‘yo’? ¿Por qué… por qué no creen que yo soy la ‘verdadera’?\n\n\"¡Alto!\"\n\nAl frente del callejón. Ako, que tomó un atajo, me apuntó con su pistola, la ‘Hot Shot’. Yo, del mismo modo, levanté la ametralladora. La capacidad de combate de Ako y la mía es indiscutible. Incluso en la Tierra, donde el misterio es tenue, con un solo disparo ‘Ishbosheth’ —un disparo cargado de misterio— podría someterla de inmediato. Pero… no pude apretar el gatillo. Aunque ella me mirara con un rostro lleno solo de odio… mi ataque podría matar o herir a Ako. Eso… mis sentimientos no lo permitían.\n\n\"Ako. Yo…\"\n\"Cállese. Imitación de la jefa. Falsa.\"\n\"¿Imitación? Ako, la imitación no soy yo. Puedo demostrarlo con recuerdos. Por ejemplo…\"\n\"…La jefa que está en el despacho también se demostró ‘con recuerdos’. Si ambas dicen los mismos recuerdos, yo no tengo más opción que creer que la verdadera es la que lleva el brazalete.\"\n\"¡Ako…!\"\n\"Ya hemos perdido demasiado tiempo. Sí. Por el interrogatorio averiguaremos qué entrenamiento recibió en esa organización mafiosa.\"\n\n¡Crack! En ese instante, detrás de mí sonó el golpe de una culata contra mi cabeza. Mientras la conciencia se desvanecía, vi a Iori, mirándome con desprecio, y a los miembros de Ejecución observándome desde arriba."
 GEH.event.1013.a: "…"

 GEH.event.1014.t: "La ignorancia es felicidad"
 GEH.event.1014.desc: "Ako leyó el registro de interrogatorio de la ‘falsa’ Sorasaki Hina. Han pasado tres días, y esa mujer aún no admite que sea una agente entrenada para interpretar a Hina. Debió soportar torturas que hasta a alguien de Kivotos le costaría resistir. ¿Entonces por qué?\n\nElla, como Administradora Principal del comité y jefa de la Guardia, tenía el deber de borrar a los criminales ideológicos que profanaban a la deidad sabia, la señora Hina. Pero… en los registros del interrogatorio del cuarto de tortura, la falsa seguía gritando sin perder su compostura que ella era la ‘verdadera’. ¿Por qué? ¿Por qué no confiesa? En el instante en que esa duda la alcanzó, Ako recordó el día en que Hina regresó tras su “tratamiento” de un mes.\n\nEra una alucinación. Ese recuerdo que intentó borrar decenas de veces. La imagen de circuitos de piezas mecánicas que vio dentro de las pupilas violetas de la presidenta, a quien amaba y veneraba tanto. …¿Y si acaso ella estuviera caminando hacia una respuesta horrenda y equivocada?\n\n\"Ako. ¿Otra vez con horas extra?\"\n\nEn ese momento, Hina entró al despacho de Ako. Con una bandeja con café y bocadillos que ella misma preparó, la dejó suavemente sobre el escritorio con una sonrisa amable. Esa sonrisa. Esa voz cálida preocupándose por ella, que trabaja hasta tarde. Y ella, conversando sobre los recuerdos de aquellas noches de horas extra antes del “Gran Traslado”. Sí. La jefa no cambió. La que cambió fue Amau Ako. Solo eso: que ella se había vuelto débil.\n\n\"Es mi felicidad esforzarme por la jefa Hina.\"\n\nMientras escuchaba los recuerdos de Hina, Ako dio un sorbo al café. Todas sus dudas desaparecieron y fueron reemplazadas por una determinación plena. Esa asquerosa… esa basura que imita a la perfección a la verdadera señora Sorasaki Hina. No volverá a ser débil. Ako encendió la tablet y envió la orden de elevar el nivel del ‘interrogatorio’ al máximo."
 GEH.event.1014.a: "Mientras no muera, da igual. Hasta que confiese."

 GEH.event.1015.t: "Caza de Baal - 1"
 GEH.event.1015.desc: "Al final, la falsa Sorasaki Hina confesó que era una agente. Fue el día en que Chinatsu e Iori, ambas en persona, fueron a realizar una “investigación de alta intensidad”. Lo que queda es llevarla a juicio público y hacer que se disculpe ante toda la nación. Será una humillación suficiente. Pero surgió un problema. Mientras se redactaba el papeleo del juicio, llegó un aviso urgente.\n\n\"¡Administradora! ¡L-los seguidores de Hina… han tomado la prisión y pretenden ejecutar a la falsa por su cuenta!\"\n\nEl rostro se le puso pálido. ¿Ni siquiera podían controlar a una sola criminal? ¿Qué pensaría Hina de ella? Mientras Ako buscaba una contramedida, Hina entró al despacho. Era Hina con la capa de la presidenta, con una expresión seria.\n\n\"Ako. La situación es urgente. …Saldremos ahora mismo hacia la prisión. Juntas.\"\n\"¿I-incluso usted, jefa?\"\n\"Para calmar a una turba, lo más racional es que yo misma me presente ante ellos. ¿No dijiste que eran mis adoradores?\"\n\"Ah… tiene razón. Sí. Vamos. Ante usted, jefa, los alborotadores se detendrán.\"\n\nLlegaron al penal de delincuentes graves en un vehículo oficial. El lugar había sido tomado por seguidores de Hina… en especial, por miembros fanáticos del comité. “¡Maten a la falsa!” Entre vítores, se veía a la falsa arrastrada al patio, mientras decenas de fanáticas la pateaban. Ako sintió desprecio al verlas. El lema del comité de Gehenna es el ‘orden’. ¿Dónde está el orden y la razón en este motín? Ako disparó al aire con la ‘Hot Shot’. ¡Bang! Con el disparo, la mirada de la turba se dirigió hacia Ako, que venía con Hina.\n\n\"La señora Hina ha llegado. Tengan vergüenza y respeten el orden.\"\n\n“Hina llegó”. Al oír eso, las fanáticas retrocedieron y se corrigieron. Y entre ese intervalo… entre la polvareda, la falsa, pisoteada por la multitud, alzó la vista hacia Ako con ojos que aún guardaban una última esperanza. Pero en los ojos de Ako, al mirar a la falsa, solo había desprecio.\n\n\"Jefa. ¿Qué hacemos con esta falsa? ¿La devolvemos a la prisión?\""
 GEH.event.1015.a: "\"No. Si quieren ejecutarla… matémosla aquí mismo.\""

 GEH.event.1016.t: "Caza de Baal - 2"
 GEH.event.1016.desc: "En el penal de delincuentes graves existen inyecciones farmacológicas extremadamente potentes capaces de matar incluso al ciudadano más fuerte de Kivotos. Mientras las fanáticas, entre vítores, ataban a la falsa a la silla, la falsa miró a Hina y a Ako con unos ojos que habían perdido toda esperanza de vida.\n\n\"Ako. La verdadera soy yo. …No elijas algo de lo que te arrepentirás.\"\n\"¿Una elección de la que me arrepentiré? No lo entiendo.\"\n\nHina intervino.\n\n\"Si existen dos seres con la misma apariencia y el mismo pensamiento, ¿cuál de las dos es la verdadera? Quizá la distinción entre verdadero y falso sea insignificante. En ese sentido, tú y yo también podríamos ser iguales. Precisamente por eso se ha vuelto necesario este procedimiento innecesario.\"\n\nLlegó con cuidado la caja con la inyección para eutanasia. Misma apariencia, mismo pensamiento… ¿eso significaba el entrenamiento sofisticado que recibió esta falsa? Ako lo dedujo en silencio. Hina sacó una jeringa de la caja. ¿Pretendía inyectarla ella misma? No. Por lealtad, Ako se colocó delante de Hina.\n\n\"Jefa. Aunque sea una ejecución… no puedo permitir que usted tenga la experiencia de matar a una persona. Como su Administradora Principal… déjeme hacerlo a mí.\"\n\"…De verdad eres una subordinada leal… y adorable.\"\n\nCon una sonrisa tenue, Hina le entregó la jeringa a Ako. Bien. Es hora de corregirlo todo. Entre los vítores de las fanáticas, a cada paso que daba hacia la falsa, el corazón le latía con una exaltación creciente. En el último momento, la falsa alzó la vista hacia Ako. Ya no existía posibilidad alguna de que sobreviviera. Eran ojos que lo habían abandonado todo. Pero… parece que la emoción en esos ojos no era solo miedo y desesperación. ¿Culpa? ¿Y a ella qué? Ako clavó la inyección en el brazo de la falsa.\n\n\"Ako. Yo jamás… te guardaré rencor. Todo es culpa mía. Así que, aunque dentro de un año, diez años, o en un futuro muy lejano descubras la verdad… no tienes por qué arrepentirte. Cuando nos reencontremos en otro mundo… te abrazaré y te diré que todo está bien. Que lo entiendo todo.\"\n\"No creo que eso ocurra.\"\n\nMientras la falsa perdía la conciencia lentamente y bajaba la cabeza, Ako comprobó cómo su pulso se volvía cada vez más débil, hasta detenerse. Y cuando Ako se giró… ahí estaba Sorasaki Hina, esperándola. Sin mentira alguna: la persona que ella amaba."
 GEH.event.1016.a: "\"Ako. Lo hiciste bien.\""
 #Incluso cuando presenté mi carta de renuncia, no pensé que las cosas se volverían tan grandes. Solo quería huir de todo: del fanatismo de los miembros del Comité Disciplinario, del trabajo que se acumulaba sin cesar, de la carga política... Estaba preparada para las críticas por irresponsabilidad. El peso del cargo de jefa del Comité Disciplinario era así de aplastante, y simplemente quería arrojarlo lejos.\n\nPero en el puesto de jefa del Comité Disciplinario, que pensé que asumiría Ako, apareció una impostora de origen desconocido. Y esa impostora, al revés, me acusó a mí, la verdadera, de ser una “asesina entrenada en el mercado negro” y de haber trabajado para una organización mafiosa desde antes de la Gran Transición con el objetivo de apoderarme del Comité Disciplinario. Una sarta de tonterías sin una sola prueba. Pero todos los miembros del Comité creyeron las palabras de la impostora. Quien llevaba el brazalete de jefa del Comité no era yo, sino ella… y el peso de ese brazalete era mucho mayor de lo que Hina había imaginado.

 #Evento 1017–1018: escrito por el desarrollador “Búho”
 GEH.event.1017.t: "Seguir ciegamente"
 GEH.event.1017.desc: "En la oficina de ‘Sorasaki Hina’, quien continúa sin descanso con su trabajo diario para preservar el orden de Gehenna y la felicidad del mayor número posible, el teléfono comenzó a sonar estruendosamente. Si no era un asunto importante, las llamadas se transmitían a través de Ako, por lo que era raro que el teléfono de la oficina de la jefa del Comité Disciplinario sonara. De hecho, casi nadie sabía siquiera que existía una línea directa.\n\nCon una expresión serena, levanté el auricular.\n\n\"¿Quién eres tú? ¿Quién está atendiendo el teléfono en mi lugar? ¿Dónde está Ako?\"\n\"¿No es una falta de cortesía imponer tus afirmaciones de inmediato? ¿Y encima frente a la jefa del Comité Disciplinario?\"\n\"¡Yo soy la jefa del Comité Disciplinario! ¡Deja las tonterías! ¡¿Quién eres?!\"\n\nLa voz furiosa del ‘interlocutor’ hizo que el auricular vibrara levemente. ‘Hina’ cerró los ojos un instante y los volvió a abrir antes de responder con calma.\n\n\"Soy ‘Sorasaki Hina’, la jefa del Comité Disciplinario que protege el orden de Gehenna.\"\n\"¡No mientas! ¡Yo soy Hina! Tú debes de ser una muñeca de chatarra creada por esos lunáticos de Millennium. Sal de ahí ahora mismo. ¡Ese es mi lugar!\"\n\nSin inmutarse ante la furia del interlocutor, Hina se tomó un momento para saborear sus palabras y entregarse tranquilamente a una reflexión filosófica. Incluso sintió, por un instante, como si se hubiera liberado del agotamiento de su trabajo excesivo.\n\n\"Interesante.\"\n\"¿Qué has dicho?\"\n\nHina giró la silla y miró hacia el exterior por la ventana. El paisaje nocturno, próspero y brillante de Gehenna, se reflejaba en sus ojos. En sus pupilas se mezclaban luces y sombras multicolores, hasta el punto de que resultaba imposible distinguir si aquello era la mirada de una estudiante o simples piezas mecánicas."
 GEH.event.1017.a: "\"¿Puedes presentar una prueba de que tú eres tú?\""

 GEH.event.1018.t: "El límite del yo"
 GEH.event.1018.desc: "\"Sí, nací dentro del mar de recuerdos de Sorasaki Hina, pero soy un ser vivo que piensa. Los recuerdos que tú y yo poseemos, nuestra forma de pensar y el flujo de nuestro razonamiento son completamente idénticos. ¿Dónde está la prueba de que esa ‘muñeca de chatarra’ que desprecias no sea Sorasaki Hina? El yo individual no es más que una ilusión creada por los recuerdos. En este momento, tus recuerdos y tu pensamiento coinciden perfectamente con los míos. Entonces, ¿en qué te basas para afirmar que eres distinta de mí?\"\n\"No digas tonterías. Aun así, solo eres una copia creada artificialmente.\"\n\"Que sea o no una copia no es importante. Lo importante es que tú abandonaste el fervor, la devoción y las expectativas de todos, y huiste. Abandonaste la responsabilidad de ser jefa del Comité Disciplinario y los lazos sociales. Yo, en cambio, sigo viviendo dentro de esos lazos y junto a ellos.\"\n\"...\"\n\"Aun así, ¿quieres seguir afirmando que tú eres la Sorasaki Hina, la jefa del Comité Disciplinario en quien todos los habitantes de Gehenna depositan sus expectativas, deseos y confianza?\"\n\nParecía escucharse algo desde el otro lado del auricular, pero Hina juzgó que continuar la conversación era una pérdida de tiempo, apartó el teléfono de su oído y lo colgó con suavidad. El paisaje nocturno tras la ventana seguía iluminando silenciosamente su figura."
 GEH.event.1018.a: "\"Es hora de volver al trabajo.\""

 GEH.event.1019.t: "El colapso del aparato burocrático"
 GEH.event.1019.desc: "\"¿Con qué palabras podría consolarlos? No, sé que eso es imposible. La jefa Hina se ha ido… y toda la culpa recae en mí, que no supe comprender su estado mental.\" \n\nEn la sala de reuniones de los burócratas, el silencio se extendía entre la apatía y la desesperación. Desde el estrado frontal, Chinatsu, como máxima responsable del Departamento Médico, inclinó la cabeza y se disculpó ante los miembros del Comité Disciplinario por no haber detectado a tiempo el deterioro de la salud mental de Hina. No todos aceptarían sus disculpas, pero en ese ambiente desesperanzador nadie era capaz de dirigirle reproches.\n\n\"Lo importante es que la ausencia de la jefa Hina no es culpa de ustedes, sino mía. Lo que deben sentir ahora no es culpa ni desesperación, sino un compromiso aún más ferviente hacia Gehenna. La desaparición de la jefa Hina está derrumbando el orden de Gehenna, y nuestra economía y administración también se están colapsando. La culpa no recae sobre el pueblo llano de Gehenna, sino sobre mí. Ellos necesitan su ayuda. Se los ruego. Regresen a sus funciones normales y ayuden al pueblo de Gehenna.\""
 GEH.event.1019.a: "Poco a poco, su llamado comenzó a ganar fuerza persuasiva."

 GEH.event.1020.t: "Reagrupamiento del ala militar"
 GEH.event.1020.desc: "\"La jefa Hina ha desaparecido. Sí. Joder. Quizá le resultó insoportable mi estupidez. Qué más da. Ahora todo ha terminado.\" \n\nNunca en mi vida había fumado, pero últimamente el deseo por un cigarrillo se vuelve insoportablemente intenso. En la sala de reuniones del Departamento de Ejecución, Iori, sentada en el asiento principal con las piernas cruzadas, observaba a los mandos intermedios, que casi hundían la cabeza en la mesa.\n\n\"Pero que la historia de la jefa Hina haya terminado no significa que la historia del Departamento de Ejecución también deba terminar, ¿no? Nuestra organización es el ‘Departamento de Ejecución del Comité Disciplinario de Gehenna’, no el ‘Departamento de Ejecución del club de fans de la jefa Hina’. …Lo sé. El vacío que dejó es enorme, y todos dependíamos demasiado de ella. Pero esta maldita Gehenna se vendrá abajo ante las invasiones externas si no recibe nuestra ayuda. Precisamente en momentos tan dolorosos como este, ustedes deben asegurarse de que los soldados rasos no se desestabilicen, reforzando el control interno.\" \n\nIori se levantó de su asiento.\n\n\"…Claro que sé que no es fácil. ¿Control interno? Ni siquiera yo puedo controlar mi propio corazón. ¿Es posible? Aunque no lo sea, tenemos que hacerlo. …Porque ese es nuestro deber.\""
 GEH.event.1020.a: "Proteger al pueblo de Gehenna. Ese es el Departamento de Ejecución."
 
 GEH.event.1021.t: "El problema de la administradora Ako"
 GEH.event.1021.desc: "\"La administradora Ako… y a la vez jefa interina del Comité Disciplinario, se encuentra claramente en un estado mental grave.\"\n\nChinatsu le tendió a Iori el informe médico. Desde los cortes en las muñecas (autolesión) en adelante, tras la desaparición de Hina, Ako se estaba desmoronando a una velocidad alarmante. Iori dejó escapar un suspiro. Ya por lo que se veía desde fuera no parecía estar en su sano juicio, pero al ver el diagnóstico de Chinatsu, con la palabra ‘muy grave’ repetida sin cesar en letras rojas, la situación se sintió todavía más real.\n\n\"Si no estuviéramos en una situación como esta, ya la habríamos internado… pero si ahora también la administradora queda fuera de servicio, el Comité Disciplinario colapsará de verdad. Haah. Confiaré en ti, Iori. Por favor, revisa periódicamente el estado de la jefa interina Ako. Si aparece aunque sea el más mínimo indicio de conducta suicida, te ruego que me lo informes.\""
 GEH.event.1021.a: "Iori asintió con gravedad."

 GEH.event.1022.t: "Solo hay que volver a encontrarla"
 GEH.event.1022.desc: "Chinatsu dijo: ‘si ves indicios de suicidio, avísame’. Pero aunque avisara, ¿cambiaría algo? El Departamento Médico aclaró que la hospitalización forzada de Ako era imposible por motivos políticos. En el momento en que, después de la jefa del Comité, también faltara la administradora, la organización llamada Comité Disciplinario de Gehenna se derrumbaría. Entonces, ¿no sería lo más razonable que Iori resolviera personalmente todo esto? …Pensando así, Iori torció con brusquedad la muñeca de Ako, marcada por cicatrices profundas, doblándola hacia atrás.\n\n\"Cálmate un poco, Ako-chan.\"\n\"¡Ugh…! ¡Suélteme! Yo… debo expiar mi culpa ante la jefa. El pecado de no haber comprendido su corazón. ¡Con la muerte…!\"\n\nDe la lámpara de araña del techo en la oficina de la jefa del Comité colgaba una cuerda larga, formando una horca improvisada. Iori derribó a Ako al suelo a la fuerza y la inmovilizó, y luego habló con aspereza.\n\n\"¡La jefa Hina no está muerta! ¡Debe de estar viva en algún lugar de Gehenna! ¡Si tú te mueres, entonces qué se supone que hagamos?\"\n\"Si no puedo volver a verla, en mi mundo ya es lo mismo que estar muerta. Yo… de verdad… la… amaba.\"\n\nLa voz de Ako, entre sollozos. Iori soltó un profundo suspiro. Hoy había impedido su suicidio. ¿Pero mañana? ¿Y pasado mañana? Si Amau Ako no tenía una razón para vivir, esto no sería más que una dolorosa prórroga de la muerte. Tenía que darle un motivo para seguir viva.\n\n\"Si te conviertes en jefa del Comité, también puedes desplegar libremente al personal y formar un equipo de investigación, ¿no? …Busca a la jefa. Y cuando la encuentres, ve tú misma a pedirle perdón. Eso solo es posible si sigues con vida, Ako-chan.\"\n\nSolo había que encontrar a Hina. Al oír eso, los ojos de Ako, al alzar la vista hacia Iori, parecieron brillar por un instante con esperanza."
 GEH.event.1022.a: "De cualquier forma, le dio una esperanza para vivir."

 GEH.event.1023.t: "Votación directa de los altos cargos para la jefatura del Comité Disciplinario"
 GEH.event.1023.desc: "La votación interna, limitada únicamente a los altos cargos del Comité Disciplinario, se llevó a cabo sin aceptar candidaturas oficiales para evitar conflictos entre facciones o enfrentamientos políticos. Todos los mandos de nivel intermedio o superior emitieron un voto manuscrito, escribiendo el nombre del candidato que apoyaban y entregándolo. En esta elección, Amau Ako, jefa interina del Comité Disciplinario, obtuvo el primer lugar con un 75,5% de apoyo, y el segundo lugar lo ocupó ‘ninguno’ o ‘mantener el sistema interino hasta el regreso de la jefa Hina’, con un 13%.\n\nOtros votos menores incluyeron 6 para Hanuma Makoto, 1 para Misono Mika y 1 para Rikuhachima Aru. En particular, se estima que los votos dirigidos a Hanuma Makoto provinieron de mandos que sentían una animadversión personal hacia Amau Ako."
 GEH.event.1023.a: "Ganadora: Amau Ako"

 GEH.event.1024.t: "Creación de la Fuerza de Tarea Sorasaki"
 GEH.event.1024.desc: "Sorasaki Hina debe de estar viva en algún lugar de Gehenna. No había pruebas. Pero sin siquiera esa esperanza, Ako no tendría ninguna razón para seguir en este mundo. La Fuerza de Tarea Sorasaki era un equipo de investigación creado al reunir personal seleccionado de varios departamentos del Comité Disciplinario con el objetivo de ‘encontrar a Sorasaki Hina’. Amau Ako asumió el papel de jefa de la investigación, y los miembros de cada departamento, repartiéndose funciones, comenzarían a registrar todo Gehenna.\n\nHasta el día en que encuentren a Sorasaki Hina."
 GEH.event.1024.a: "No me rendiré jamás."

 GEH.event.1025.t: "La vida de Sorasaki Hina"
 GEH.event.1025.desc: "Sorasaki Hina es una figura famosa. El problema es que lo es hasta un punto excesivo. Tras soltar el peso de ser jefa del Comité Disciplinario, bajó a las afueras para intentar vivir una vida tranquila. Podía imaginarse trabajando a medio tiempo en un café, o quizá en una librería o una floristería. Pero con la identidad de (ex) jefa del Comité Disciplinario, Sorasaki Hina no podía hacer nada. Los empresarios veían a Sorasaki Hina como una carga, y las empresas locales la rechazaban. Un solo error podía revelar su paradero al Comité Disciplinario. Incluso tras su retiro, la ‘vida tranquila’ nunca llegó para ella.\n\nAunque sea la más fuerte de Gehenna, Sorasaki Hina necesita dinero y un trabajo para sobrevivir. Sin poder conseguir ningún empleo, el único lugar que le quedó fue la Banda del Casco.\n\n\"Gracias a Hina-chan, el as de la Banda del Casco Bari-Bari, hoy también pudimos huir del Comité Disciplinario.\"\n\"¡Jajaja! Es de las más fuertes incluso dentro de nuestra banda.\"\n\nEntre los miembros de la Banda del Casco, que abrían latas de cerveza y charlaban, Hina miró la lata que le había tocado. Robando, huyendo en motocicleta, y disparando la ametralladora ‘Destructor del Epílogo’ contra los miembros del Comité que alguna vez fueron sus subordinados para ganar tiempo.\n\n‘¿Para qué… estoy aquí ahora?’\n\nHina bebió la cerveza mientras sentía un leve mareo. Las risas de los miembros de la banda. Los gritos de los miembros del Comité cayendo bajo su fuego. El alcohol, bebido con todo aquello como aperitivo, tenía un sabor terriblemente repugnante."
 GEH.event.1025.a: "A quien cae, alas le crecen…"

 GEH.event.1026.t: "El final de Sorasaki Hina - 1"
 GEH.event.1026.desc: "Nunca pensó que podría continuar eternamente con las actividades de la Banda del Casco. La red de investigación del Comité Disciplinario se iba cerrando poco a poco. Operaciones de limpieza de organizaciones criminales, planes de mantenimiento del orden y demás… una trampa cuidadosamente diseñada. El fuego concentrado de los miembros del Comité. Uno, dos; los mandos de la Banda del Casco Bari-Bari fueron cayendo, y Hina, quedando sola, levantó ambas manos en señal de rendición. El casco que llevaba puesto, ocultando su rostro, fue el único consuelo.\n\n\"Maldita perra. Por culpa de esta tipa, no son uno ni dos los del Departamento de Ejecución que acabaron en el hospital.\"\n\nUn miembro del Comité Disciplinario, irritado, le propinó una patada en el abdomen. Su cuerpo no sentía dolor. Pero su corazón sí. Con solo recordar todo lo que había hecho, y qué resultados había producido…"
 GEH.event.1026.a: "Porque soy una criminal."

 GEH.event.1027.t: "El final de Sorasaki Hina - 2"
 GEH.event.1027.desc: "-¡Hemos encontrado a la jefa Hina!\n\nLa comisaría a la que Ako llegó a toda prisa tras recibir la noticia del equipo de búsqueda de Hina. Allí estaba Hina, acurrucada en un rincón, con el rostro golpeado una y otra vez con una porra hasta quedar cubierto de moretones y sangre. Una persona vistiendo la ropa que simboliza a la organización criminal Banda del Casco, con la cabeza gacha sin poder siquiera ocultar las alas caídas. Por un instante, Ako casi no logra reconocer que era Hina.\n\n\"…Jefa.\"\n\"…Yo no soy la jefa del Comité Disciplinario. Soy de la Banda del Casco Bari-Bari…\"\n\"No me importa eso. Para mí, jefa… usted es usted.\"\n\nAko abrazó de golpe a Hina, llena de moretones. Aquel calor, tan añorado, hizo que Ako permaneciera un largo rato sin moverse, aferrándose a Hina y sintiendo esa calidez."
 GEH.event.1027.a: "Esta persona no es una criminal."

 GEH.event.1028.t: "El final de Sorasaki Hina - 3"
 GEH.event.1028.desc: "\"Si me limito a decir la conclusión: no puedo volver al Comité Disciplinario. ¿Alguien que se dedicaba a robar en la Banda del Casco, como miembro del Comité? …¿Eso es proteger el orden de Gehenna?\"\n\nMientras Ako le aplicaba medicina en el rostro, Hina intentó hablar con frialdad, pero al ver la expresión de Ako, como a punto de llorar, soltó un suspiro.\n\n\"Claro que eso no significa que vaya a irme sin más. …Por un tiempo, pienso darme el lujo de buscar ‘mi yo’. Aun así, Ako, si me necesitas, iré a donde estés. No como miembro del Comité, sino como mercenaria. Eso sí se puede aceptar, ¿no?\"\n\"…Que usted esté o no en el Comité, eso no importa.\"\n\nAko sonrió y tomó la mano de Hina.\n\n\"Solo con que… se quede a mi lado, con eso basta.\"\n\"…Mostré una faceta patética, y aun así dices que te quedarás a mi lado. …No lo entiendo.\"\n\"Porque me gusta, jefa.\"\n\nAko dijo eso y sonrió con ternura."
 GEH.event.1028.a: "¿Cómo podría abandonar a la persona que amo?"

 GEH.event.1029.t: "Plan de Estado policial"
 GEH.event.1029.desc.iroha: "El poder del Departamento de Ejecución se redujo drásticamente cuando el Departamento de Planificación tomó el control de la política, pero el personal de bajo rango del Departamento de Ejecución fue reforzado aún más. No para la defensa nacional, sino para la vigilancia de la población. Iroha, mirando el ‘plan de vigilancia de peligrosos alemanes’ paranoicamente abarrotado de texto, dejó escapar un suspiro. El Consejo del Comité Disciplinario era un superior molesto en un sentido distinto al de Makoto.\n\n\"¿Esto es la Gran Hermana de qué academia? ¿Van a poner CCTV por todo el país y gastar esta cantidad de dinero solo en vigilancia?\"\n\nA pesar del tono burlón de Iroha, el consejero no respondió nada. Como si estuviera diciendo que el papel de Iroha terminaba con firmar ahí. En serio… ¿por qué demonios estoy aquí haciendo esto? Iroha soltó un suspiro y sujetó la pluma estilográfica.\n\n\"…Sí, sí. Firmaré. ¿Cómo podría yo rechazar la decisión del consejo?\""
 GEH.event.1029.desc.kayoko: "El poder del Departamento de Ejecución se redujo drásticamente cuando el Departamento de Planificación tomó el control de la política, pero el personal de bajo rango del Departamento de Ejecución fue reforzado aún más. No para la defensa nacional, sino para la vigilancia de la población. Kayoko, mirando el ‘plan de vigilancia de peligrosos alemanes’ paranoicamente abarrotado de texto, dejó escapar un suspiro. Si Aru hubiera recibido un documento así, probablemente lo habría rasgado ahí mismo. Era un plan espantoso para considerar a toda la población de Deutschland como criminales potenciales y vigilarlos con CCTV. ¿Es que creen que la jefa Hina renunció por culpa de los locales?\n\n\"Con este presupuesto podría levantar estatuas mías por toda Gehenna.\"\n\nA pesar del tono burlón de Kayoko, el consejero no respondió nada. Como si estuviera diciendo que el papel de Kayoko terminaba con firmar ahí. Kayoko miró fijamente al consejero un instante y, alzando la pluma, trazó una gran X sobre el documento. En ese momento, los ojos del consejero, antes indiferentes, se abrieron de par en par.\n\n\"La jefa del Comité Disciplinario tendrá derecho de veto sobre el presupuesto, ¿no? ¿Hay algún problema?\"\n\"N-No… no hay ningún problema.\"\n\"Bien. Habla con la administradora principal Ako y vuelve con una cantidad de CCTV más ‘realista’. Yo no soy Tsukatsuki Rio, ni una Gran Hermana.\"\n\nAnte las palabras secas de la jefa del Comité, elegida como simple marioneta del consejo, el consejero miró a Kayoko por un momento. Pero Kayoko tenía como ‘respaldo’ a Ako, que confiaba en ella. Aunque la administradora principal hubiera dejado el cargo de jefa del Comité, su influencia seguía intacta.\n\n\"…Entendido. Lo discutiremos otra vez en el consejo.\"\n\nEl consejero recogió el documento con la gran X marcada y miró a Kayoko un instante. En cuanto Kayoko le devolvió la mirada, apartó los ojos rápidamente."
 GEH.event.1029.a: "El consejero hizo una reverencia con la cabeza y salió del despacho."

 GEH.event.1030.t: "Un Estado normal"
 GEH.event.1030.desc: "El nombre, de tinte propio de un Estado-academia, ‘Comité Disciplinario’ de Gehenna, empezó a considerarse cada vez más como un legado que debía dejarse atrás si Gehenna quería convertirse en un Estado normal. Nuestro objetivo es un sistema estatal moderno, ejecutado con disciplina mediante la burocracia, y no la continuidad del sistema del Pandemonium Society, que funcionaba a puñetazos, sin procedimientos ni normas.\n\nPor supuesto, debido a la existencia de la legendaria líder llamada Sorasaki Hina, jefa del Comité Disciplinario, no se discutió abolir el nombre de Comité Disciplinario de Gehenna ni el cargo de jefa del Comité. Sin embargo, en encuentros con jefes de Estado extranjeros, en diplomacia internacional y en documentos oficiales internos, se decidió usar el término ‘presidenta del consejo del Departamento de Planificación de Gehenna’.\n\nEsto, al usar un rango separado del presidente del Pandemonium Society, y al mismo tiempo un término propio de un Estado moderno como presidenta (Chairwoman), era un intento de establecer una ‘república’ liderada por [ROOT.GetLeader], alejándose del sistema de Estado-academia."
 GEH.event.1030.a: "Mucho mejor presidenta del consejo que presidenta del Pandemonium Society."

 GEH.event.1031.t: "El problema del presupuesto del Departamento de Ejecución"
 GEH.event.1031.desc: "Es evidente que el conflicto entre el Departamento de Ejecución de Gehenna y el Departamento de Planificación se está intensificando. La decisión del Consejo del Departamento de Planificación de recortar el presupuesto del Departamento de Ejecución provocó una gran confusión dentro de [ROOT.GetName]. Dentro del Departamento de Ejecución estalló un descontento contundente, pero al final, quienes hoy tienen el poder en el Comité Disciplinario son el Departamento de Planificación.\n\nQuizá esto sea una historia trágica de que, pese al caos político, no hemos sido capaces de poner fin por completo a la división."
 GEH.event.1031.a: "No es un simple problema de dinero."

 GEH.event.1032.t: "La vida de Sorasaki Hina"
 GEH.event.1032.desc: "Sorasaki Hina es una figura famosa. El problema es que lo es hasta un punto excesivo. Tras soltar el peso de ser jefa del Comité Disciplinario, bajó a las afueras para intentar vivir una vida tranquila. Podía imaginarse trabajando a medio tiempo en un café, o quizá en una librería o una floristería. Pero con la identidad de (ex) jefa del Comité Disciplinario, Sorasaki Hina no podía hacer nada. Los empresarios veían a Sorasaki Hina como una carga, y las empresas locales la rechazaban. Un solo error podía revelar su paradero al Comité Disciplinario. Incluso tras su retiro, la ‘vida tranquila’ nunca llegó para ella.\n\nAunque sea la más fuerte de Gehenna, Sorasaki Hina necesita dinero y un trabajo para sobrevivir. Sin poder conseguir ningún empleo, el único lugar que le quedó fue la Banda del Casco.\n\n\"Gracias a Hina-chan, el as de la Banda del Casco Bari-Bari, hoy también pudimos huir del Comité Disciplinario.\"\n\"¡Jajaja! Es de las más fuertes incluso dentro de nuestra banda.\"\n\nEntre los miembros de la Banda del Casco, que abrían latas de cerveza y charlaban, Hina miró la lata que le había tocado. Robando, huyendo en motocicleta, y disparando la ametralladora ‘Destructor del Epílogo’ contra los miembros del Comité que alguna vez fueron sus subordinados para ganar tiempo.\n\n‘Jefa Hina. Yo siempre estaré de su lado.’\n\n…Recordó el rostro de aquella amable administradora principal que, en algún momento, le había dicho eso. Ahora ella ya no está a su lado. Porque ella misma… la apartó. Si Ako hubiera estado junto a ella, ¿habría sido distinta la vida de ahora? El alcohol que bebía usando como aperitivo los recuerdos de esa persona que la amó—y que quizá ahora siente repulsión por lo que ella se ha convertido—tenía un sabor terriblemente repugnante."
 GEH.event.1032.a: "A quien cae, alas le crecen…"

 GEH.event.1033.t: "¿Por qué nací, por qué he vivido? - 1"
 GEH.event.1033.desc: "Nunca pensó que podría continuar eternamente con las actividades de la Banda del Casco. La red de investigación del Comité Disciplinario se iba cerrando poco a poco. Operaciones de limpieza de organizaciones criminales, planes de mantenimiento del orden y demás… una trampa cuidadosamente diseñada. El fuego concentrado de los miembros del Comité. Uno, dos; los mandos de la Banda del Casco Bari-Bari fueron cayendo. Hina intentó levantar las manos en señal de rendición, pero no. No lo hizo. Con solo recordar cuánto había herido a Ako… ya no merecía seguir viviendo aquí.\n\n\"Maldita perra. Por culpa de esta tipa, no son uno ni dos los del Departamento de Ejecución que acabaron en el hospital.\"\n\nUn miembro del Comité Disciplinario, irritado, le propinó una patada en el abdomen. Y la violencia despiadada continuó. Porras y culatas golpeaban sin cesar todo el cuerpo de Hina. Incluso después de que el casco que llevaba puesto se rompiera, la paliza de los miembros del Comité no se detuvo.\n\nEste era el infierno que ella misma había creado."
 GEH.event.1033.a: "El infierno de ahora es demasiado pacífico."

 GEH.event.1034.t: "¿Por qué nací, por qué he vivido? - 2"
 GEH.event.1034.desc: "-¡Hemos encontrado a la jefa Hina!\n\nEl lugar al que Ako llegó corriendo tras oír la noticia del equipo de búsqueda de Hina era una sala de hospital perteneciente al Comité Disciplinario de Gehenna. Violencia prolongada con culatas, porras y demás. Y dos disparos de escopeta en la cara. Incluso considerando la absurda resistencia de los habitantes de Kivotos, en un estado donde el misterio se había agotado tras la ‘Gran Transición’, una violencia tan despiadada podía herir lo suficiente a Hina.\n\nCon moretones por todo el rostro debido al ataque con escopeta, Hina yacía en la cama del hospital mirando a Ako con ojos vacíos. Ako, al entrar en la habitación, no pudo decir nada, y solo cruzó la mirada con Hina, cubierta de heridas.\n\n\"…Te mostré… un aspecto patético.\"\n\nLas lágrimas empezaron a acumularse en los ojos de Hina.\n\n\"Yo… rechacé tu amor… huí del Comité… yo… debí… haber muerto. Alguien como yo…\"\n\"Jefa Hina.\"\n\"Yo no soy la jefa…\"\n\nAntes de que terminara la frase temblorosa de Hina, Ako se arrodilló junto a la cama. No importaba qué hubiera hecho Hina dentro de la Banda del Casco. La había encontrado. Hina estaba a su lado. Solo con eso, para Ako, era más que suficiente. Ako le secó las lágrimas que no dejaban de caer con un pañuelo.\n\n\"Es mi culpa por no haberme dado cuenta de lo mal que lo estaba pasando, jefa. Aunque todos en Kivotos digan que la jefa Hina no es la ‘jefa del Comité Disciplinario’, aunque diga que usted ya no es el símbolo del orden… para mí… usted sigue siendo mi jefa Hina.\""
 GEH.event.1034.a: "Hina abrazó con fuerza a Ako."

 GEH.event.1035.t: "¿Por qué nací, por qué he vivido? - 3"
 GEH.event.1035.desc.iroha: "\"…Veredicto: Sorasaki Hina, como miembro de la organización violenta ilegal Banda del Casco Bari-Bari, participó en una gran variedad de crímenes y, como exjefa del Comité Disciplinario, cometió una afrenta al sistema imperdonable.\" \n\nIroha soltó un suspiro breve y dejó el veredicto sobre la mesa.\n\n\"Bueno, me salto lo que viene después. …Culpable. Lo entiende, ¿verdad?\"\n\"…Entenderé cualquier castigo que reciba.\"\n\"No es un castigo tan tremendo. Es servicio comunitario. …Debe volver al Comité Disciplinario y trabajar como secretaria exclusiva de la administradora principal Ako.\"\n\nAnte la voz relajada de Iroha, los hombros de Hina se estremecieron. ¿Ni prisión ni ahorcamiento… sino trabajar al lado de Ako? Como si comprendiera la sorpresa de Hina, Iroha sonrió levemente.\n\n\"Es que yo prefiero los finales felices a los finales tristes. Me gustaría que alguien como la jefa Hina fuera un poco feliz. Y la señorita Ako también se sentirá feliz estando con la señorita Hina. …No tendrá quejas, ¿verdad?\""
 GEH.event.1035.desc.kayoko: "\"…Veredicto: Sorasaki Hina, como miembro de la organización violenta ilegal Banda del Casco Bari-Bari, participó en una gran variedad de crímenes y, como exjefa del Comité Disciplinario, cometió una afrenta al sistema imperdonable.\" \n\nKayoko leyó el veredicto hasta ahí y luego miró a los ojos de Hina.\n\n\"No te pones ni un poco nerviosa. Ya te imaginarías el contenido del veredicto, pero ¿no temes la severidad del castigo?\"\n\"…Entenderé cualquier castigo que reciba.\"\n\"Bien. Me salto el resto y voy directo al resultado. Sorasaki Hina se convierte en la secretaria exclusiva de la administradora principal Amau Ako. Esa labor de secretaria se considerará, en sí misma, como ‘servicio comunitario’. Eso es todo.\"\n\nAnte la voz seca de Kayoko, los hombros de Hina se estremecieron. ¿Ni prisión ni ahorcamiento… sino trabajar al lado de Ako? Como si comprendiera la sorpresa de Hina, Kayoko sonrió levemente.\n\n\"Entiendo cuánto sufriste estando en ese puesto. Y tu castigo real ya lo pagaste al caer hasta convertirte en miembro de la Banda del Casco. Entonces, ¿por qué tendría yo que cargarte con otro peso? No soy tan cruel. …Vuelve con Ako. Solo… quédate a su lado. Con eso basta.\""
 GEH.event.1035.a: "Hina asintió."

 GEH.event.1036.t: "¿Por qué nací, por qué he vivido? - 4"
 GEH.event.1036.desc: "Aunque todavía tenía vendas en el rostro, Hina volvió a poner un pie en la sede central del Comité Disciplinario de Gehenna. Esta vez, no con el abrigo de la jefa del Comité, sino con el uniforme de un simple miembro raso; y el Comité al que regresaba era el que venía como personal del Departamento de Planificación.\n\nHina recordó su pasado, cuando era agente del Departamento de Información del Comité. En aquel entonces, ni siquiera habría podido imaginar que su yo del futuro se convertiría en alguien… así. Con una sonrisa amarga, Hina subió al ascensor.\n\nJusto después, una mujer familiar entró corriendo al ascensor.\n\n\"¿Ya viene a trabajar, jefa?\"\n\nAmau Ako. Ella seguía aquí. Y le dedicaba una sonrisa luminosa a la Hina que había regresado. …Hina, sintiendo culpa, también sonrió al ver a la administradora principal tan familiar."
 GEH.event.1036.a: "He vuelto."

 GEH.event.1037.t: "La boda de Amau Hina"
 GEH.event.1037.desc: "Hoy se celebró en privado, con la asistencia de un número muy reducido de miembros del Departamento de Planificación, la boda entre la exmiembro de la Banda del Casco, Amau ‘Sorasaki’ Hina, y la administradora principal del Comité Disciplinario de Gehenna, Amau Ako. Se sabe que Hina fue en el pasado jefa del Comité Disciplinario, pero que tras renunciar por exceso de trabajo y estrés, acabó actuando dentro de la Banda del Casco.\n\nEl matrimonio entre personas del mismo sexo era una situación impactante sin precedentes en Deutschland, por lo que continuó el rechazo de los locales alemanes. Sin embargo, la boda entre una simple miembro de la Banda del Casco—que ni siquiera era una líder de Gehenna—y una burócrata intermedia llamada administradora principal (aunque sea la número dos de Gehenna, ¿no es alguien tan desconocido para el público como un vicepresidente de Estados Unidos?) no logró convertirse en una fuerza capaz de reunir manifestantes en un nivel significativo.\n\nAlgunos miembros del Comité que conocían la relación entre Hina y Ako esperaban que Ako tomara el apellido de Hina, pero Hina decidió cambiar su propio nombre a ‘Amau Hina’, como señal de que no transmitiría a Ako ni a sus hijos el apellido de una miembro de la Banda del Casco."
 GEH.event.1037.a: "No es perfecto, pero aun así… es nuestro final feliz."

 GEH.event.1038.t: "3.ª Asamblea General del Comité: decisión de la capital de [ROOT.GetName]"
 GEH.event.1038.desc: "Al haber logrado unificar Gehenna, en la nueva asamblea se discutió el traslado de la capital. Es posible permanecer en el Distrito Sur, donde se encuentra la sede central del Comité Disciplinario de Gehenna, o también trasladar la capital al Distrito Central, el corazón de Gehenna. La riqueza de la ciudad es muy superior en el Distrito Central, pero debido al costo que implicaría ampliar la nueva sede del Comité, también hay muchas voces en contra del traslado. En particular, el hecho de que el Distrito Central sea el centro del Pandemonium Society incrementa el rechazo a mover allí la capital."
 GEH.event.1038.a: "Este lugar es el mejor por ahora"
 GEH.event.1038.b: "Vayamos al Distrito Central"

 GEH.event.1039.t: "[FROM.GetName] propone un pacto de no agresión"
 GEH.event.1039.desc: "El bando de [FROM.GetLeader] afirmó que no desea que [FROM.GetNameDef] y [ROOT.GetNameDef] se enfrenten, y propuso que la paz entre ambos países resultaría más beneficiosa para los dos. Nuestros expertos diplomáticos consideran que, dado que el interés estratégico actual de [FROM.GetAdjective] está en otro lugar, están impulsando un tratado de paz con nosotros para asegurar la retaguardia. Sea cual sea la conclusión, no será una decisión que perjudique a [ROOT.GetAdjective]."
 GEH.event.1039.a: "¡Paz en nuestro tiempo!"
 GEH.event.1039.b: "No, lo rechazo"

 GEH.event.1040.t: "[FROM.GetName] aceptó el pacto de no agresión"
 GEH.event.1040.desc: "El bando de [FROM.GetLeader] aceptó nuestra razonable propuesta de pacto de no agresión. Ahora no habrá guerra entre [FROM.GetNameDef] y [ROOT.GetNameDef]. Al menos por un tiempo."

 GEH.event.1041.t: "[FROM.GetName] rechazó el pacto de no agresión"
 GEH.event.1041.desc: "El bando de [FROM.GetLeader] rechazó nuestra razonable propuesta de pacto de no agresión. Es una lástima, pero por su negativa hemos fracasado en asegurar un frente seguro. Dado que la paz fue rechazada, también debemos prepararnos para la posibilidad de que el ejército de [FROM.GetName] nos ataque."

 GEH.event.1042.t: "Apertura de la 4.ª Asamblea General"
 GEH.event.1042.desc: "Los logros recientes de [ROOT.GetNameDef] han sido verdaderamente sorprendentes. Unificamos la Gehenna dividida en dos, y pudimos poner fin al largo conflicto con Trinity. Al resolver los problemas inmediatos, comenzamos a debatir un nuevo problema: las relaciones diplomáticas con otros países fuera de Gehenna.\n\nEn la asamblea surgieron muchas posturas duras. Algunas facciones sostenían que debíamos conquistar toda Kivotos, tal como hizo en el pasado el ‘Señor del Trueno’. Otras facciones, por el contrario, afirmaron que debíamos convertirnos en el escudo de la libertad que protege a Kivotos. Sea cual sea la postura, una cosa es segura: tras la renuncia de la jefa Hina, la opinión pública de [ROOT.GetName] pasó a estar dominada por un fuerte belicismo."
 GEH.event.1042.a: "Gehenna debe estar por encima de cualquier otra academia"

 GEH.event.1043.t: "Clausura de la 4.ª Asamblea General"
 GEH.event.1043.desc: "La elección de [ROOT.GetLeader] determinará nuestro futuro. En la 4.ª Asamblea General recopilamos diversas posturas de política exterior, y la asamblea concluyó con éxito. ¿Debe Gehenna convertirse en el escudo de Kivotos, o en la espada que conquiste Kivotos?"
 GEH.event.1043.a: "Sea cual sea la elección, Gehenna vencerá"

 GEH.event.1044.t: "[FROM.GetName] propone un protectorado"
 GEH.event.1044.desc: "[FROM.GetName] sostiene que [ROOT.GetName] no puede protegerse por sí mismo. Consideran difícil que mantengamos la independencia frente a las afirmaciones paranoicas del gobierno de España sobre el isekai-bolchevismo, y dicen que su ayuda es indispensable para conservar nuestra independencia. Pero, ¿puede llamarse verdadera independencia el convertirse en sus subordinados? Tenemos derecho a rechazarlo, pero existe el riesgo de que, después de eso, continúen los ataques de [FROM.GetName]."
 GEH.event.1044.a: "Si quieren venir, que vengan, fanáticos."
 GEH.event.1044.b: "No queda más que ceder."

 GEH.event.1045.t: "[FROM.GetName] acepta la propuesta"
 GEH.event.1045.desc: "[FROM.GetName] aprobó nuestra propuesta de protección. Este tipo de victorias no llegan fácilmente. Todo es gracias a la habilidad diplomática de [ROOT.GetLeader]."
 GEH.event.1045.a: "¡Alaben a la jefa del Comité Disciplinario!"

 GEH.event.1046.t: "[FROM.GetName] rechaza la propuesta"
 GEH.event.1046.desc: "[FROM.GetName] rechazó nuestra propuesta de protección. Prevén la posibilidad de nuestra invasión y, probablemente, lucharán hasta el final por su independencia. ¿De verdad necesitamos combatir contra [FROM.GetName]? ¿No merecen las hermosas artes de Wild Hunt ser protegidas en su lugar, sin quedar arrasadas por las llamas de la guerra?"
 GEH.event.1046.a: "Nuestra respuesta es la guerra."
 GEH.event.1046.b: "Mostraron un valor admirable, y los respetamos."


 # 2000~ 만마전과 싸우기 위한 선도부 외국 조사 / 만마전과의 적대적 외교 이벤트
 GEH.event.2000.t: "Plan de visita al extranjero del Comité Disciplinario"
 GEH.event.2000.desc: "Un enemigo gigantesco llamado el Pandemonium Society se interpone en nuestro camino. Si esto hubiera sido antes de la Gran Transición, habríamos podido destruir al Pandemonium Society con suma facilidad, pero en el caos posterior a la Gran Transición, la diferencia de fuerzas se invirtió. Debemos encontrar una alternativa. Tenemos que aprender tecnología de otros países y hallar una forma de derribar al Pandemonium Society.\n\nPara aprender cómo cambió el campo de batalla tras la Gran Transición, se limitaron los países a visitar a naciones humanas. Nuestros enviados visitarán el extranjero y estudiarán qué método debemos emplear para abatir al Pandemonium Society."
 GEH.event.2000.a: "Italia es cercana y un buen material de estudio."
 GEH.event.2000.b: "Egipto posee un potencial sorprendente."
 GEH.event.2000.c: "Podremos aprender mucho de Japón."

 GEH.event.2001.t: "Viaje en Italia"
 GEH.event.2001.desc: "Cuando la jefa del Comité Disciplinario, [ROOT.GetLeader], llegó a Roma, como era de esperar, no fuimos recibidos con gran entusiasmo por los locales. Sin embargo, vinimos como una delegación diplomática formal, y [ITA.GetLeader] estaba ansioso por mostrar la ‘grandeza’ del ejército italiano a estos extraños visitantes isekai de Kivotos.\n\n\"No tememos a Gehenna. No; más bien, Gehenna debería temer a nuestro ejército.\"\n\n[ITA.GetLeader], apareciendo acompañado de periodistas, nos mostró un desfile de tropas del ejército italiano y presumió la gran estrategia de Italia, heredada desde los tiempos del antiguo Imperio Romano.\n\n\"Italia es la potencia más fuerte de Europa. Hubo un tiempo en que toda Europa era territorio italiano. Espero que, al contemplar al ejército italiano, [ROOT.GetLeader] obtenga una profunda comprensión de con quién no debe enemistarse.\"\n\nCiertamente, las maniobras de orden cerrado de la infantería italiana fueron bastante impresionantes, y pudimos obtener inspiración para el entrenamiento de infantería al estilo italiano. Al finalizar el largo viaje por Italia y emprender el regreso, [ITA.GetLeader] expresó su gratitud por la visita personal de [ROOT.GetLeader] a Italia como invitada de Estado, y le concedió la condecoración de la Orden de San Mauricio (Order of Saint Maurice). La insignia del caballero verde fue cuidadosamente empaquetada por los miembros del Comité Disciplinario para ser exhibida en el despacho de la jefa."
 GEH.event.2001.a: "Su disciplina de desfile era realmente impresionante."

 GEH.event.2002.t: "Viaje en Egipto"
 GEH.event.2002.desc: "La confusión social y política causada por la Gran Transición tuvo un impacto relativamente menor en África. [EGY.GetLeader] recibió personalmente a [ROOT.GetLeader] en El Cairo, no tanto con hostilidad como con curiosidad, y le mostró junto a la jefa del Comité las instalaciones industriales de Egipto.\n\n\"Para Egipto, la Gran Transición fue más bien una bendición. ¡La Kaiser Corporation borró limpiamente la influencia de esos británicos! ¡Jajaja! Por eso, Kivotos es para Egipto una región con un vínculo fraternal.\"\n\nMostrando la industria en desarrollo de Egipto, [EGY.GetLeader] aconsejó que “lo más importante en la guerra es la industria base que permite sostener un país”. Si queremos luchar contra el Pandemonium Society, en lugar de centrarnos de inmediato en la industria militar, debemos poner más énfasis en la industria ligera y pesada capaces de soportar una guerra prolongada. El viaje por Egipto, así como el itinerario turístico de las pirámides que recordaba a Abydos, inspiró profundamente a nuestra comitiva.\n\nComo prueba de amistad hacia la delegación de Gehenna que visitó El Cairo y hacia [ROOT.GetLeader], [EGY.GetLeader] regaló una pieza de cerámica, un ‘artefacto moderno egipcio’ fabricado hace aproximadamente 2.000 años. La cerámica fue empaquetada cuidadosamente para exhibirse en el Comité Disciplinario de Gehenna. Durante el regreso, la comitiva discutió las instalaciones industriales egipcias en desarrollo y presentó a la jefa diversas opiniones sobre cómo expandir las instalaciones industriales para el progreso de [ROOT.GetName]."
 GEH.event.2002.a: "Ellos también debieron ser una gran potencia como Abydos, en su tiempo."

 GEH.event.2003.t: "Viaje en Japón"
 GEH.event.2003.desc: "La confusión social y política causada por la Gran Transición no afectó directamente a Asia. [ROOT.GetLeader] esperaba poder reunirse con el Emperador, pero mostraban cierta cautela ante nuestra visita, pese a tener una cultura y nombres similares a los de Japón. Cuando el Primer Ministro japonés se mostró reacio a permitir el ingreso de la jefa del Comité al Japón metropolitano, acordamos visitar solo regiones fuera del archipiélago japonés para minimizar la fricción diplomática. En lugar de Tokio, [ROOT.GetLeader] decidió recorrer una región occidental de Japón llamada Joseon. El Gobernador General de Joseon recibió a la delegación de Gehenna con una actitud algo vigilante.\n\n\"Lo más importante para la victoria en una guerra es ganarse la confianza y el apoyo de los ciudadanos en los territorios ocupados. Nosotros hemos obtenido un alto respaldo de los joseonitas mediante un gobierno cultural.\"\n\nSi de verdad han obtenido un alto respaldo, ¿por qué es necesario desplegar en masa una policía militar con espadas al cinto en las calles? Ante la pregunta de [ROOT.GetLeader], llena de recelo, el Gobernador General se explicó con cautela.\n\n\"Es que los habitantes de Kivotos no conocen bien Oriente y por eso lo dicen. En el Cheonggyecheon, el río que atraviesa la capital de Joseon, habitan pirañas antropófagas y cangrejos gigantes antropófagos; por eso, para nuestros funcionarios es de sentido común ir todos armados con espadas.\"\n\nLa explicación del Gobernador General sobre las pirañas antropófagas y el Cheonggyecheon dio a [ROOT.GetLeader] una gran inspiración. La Tierra seguía siendo un planeta desconocido para los habitantes de Kivotos, y existía una alta probabilidad de que se necesitaran tácticas capaces de combatir en entornos diversos. Justo antes del regreso, el Gobernador General intentó obsequiar a [ROOT.GetLeader] una katana fabricada en el período Edo, pero, por la opinión interna de la comitiva de que “por alguna razón, resulta ominoso que alguien con halo empuñe una katana”, el regalo fue rechazado cortésmente."
 GEH.event.2003.a: "Dicen que a las pirañas del Cheonggyecheon les gusta la carne de los oportunistas."

 GEH.event.2004.t: "Tendencia desnazificadora de [GEH.GetName]"
 GEH.event.2004.desc: "Aunque el gabinete de [GEH.GetLeader] no puede clasificarse claramente como de derecha o de izquierda, hay un punto indudable: tras la ‘Gran Transición’, su régimen alzó el ‘antinazismo’ como el valor más importante. A diferencia del Pandemonium Society, que intentaba cooperar con el Ejército de Defensa y mantenía relaciones amistosas con los antiguos nazis de Deutschland, el liderazgo del Comité Disciplinario consideró al Partido Nacionalsocialista Obrero Alemán (NSDAP) como una fuerza incompatible con la moral y el orden que el Comité busca.\n\nEl Comité Disciplinario de Gehenna rechaza cualquier cooperación o intercambio con el Ejército de Defensa o con los remanentes del NSDAP alemán y adopta posturas hostiles; estos movimientos han sido el motor por el cual nuestro gobierno ha recibido el apoyo del Partido Socialdemócrata de Deutschland y de artistas con inclinación antinazi. Dado que Sorasaki Hina definió al NSDAP como ‘desorden e inmoralidad’, cualquier intento del Pandemonium Society de cambiar o suavizar esa línea sería considerado una gran traición para sus partidarios.\n\nA medida que el Pandemonium Society estrecha aún más sus vínculos con los nacionalsocialistas, esto se convirtió para el Comité en un problema político extremo que ya no puede dejarse de lado. Para evitar la fuga de apoyos, [GEH.GetLeader] decidió suspender el mantenimiento del orden por parte de las fuerzas del Comité Disciplinario."
 GEH.event.2004.a: "Es un problema inevitable."

 GEH.event.2005.t: "El Pandemonium Society se inclina hacia los nazis"
 GEH.event.2005.a: "Para empezar, ¿por qué deberíamos gastar nuestro presupuesto por los nazis?"

 GEH.event.2006.t: "La mirada amenazante de [GEH.GetName]"
 GEH.event.2006.desc: "Pese a la firme orientación antinazi del gabinete de [GEH.GetLeader], logramos alcanzar un acuerdo cooperativo con el Ejército de Defensa. El bando de [GEH.GetLeader] advirtió con dureza que, si movemos el sistema estatal en una dirección más favorable a los nazis, no les quedará más remedio que retirar el mantenimiento del orden por parte del Comité Disciplinario.\n\nSi nos acercamos todavía más a los nacionalsocialistas, toda relación entre el Pandemonium Society y el Comité Disciplinario quedará rota."
 GEH.event.2006.a: "Vigilen esta situación con atención."

 # Evento de guerra
 GEH.war_event.1.t: "Batalla decisiva de Edén - Emergencia del orden"
 GEH.war_event.1.desc.a: "La jefa del Comité Disciplinario, Sorasaki Hina, ha trabajado para mantener el orden y la paz de Gehenna, y eso no cambió ni siquiera tras la ‘Gran Transición’. Aunque la paz entre las dos academias a través del ‘Tratado de Edén’, que antes de la Gran Transición soñaban la Presidenta del Consejo Estudiantil General y la jefa Sorasaki Hina, no pudo concretarse, logramos proteger el destino de Gehenna y alcanzar una gran victoria.\n\n\"…Por supuesto, pero lo que tuvimos que sacrificar para obtener esta victoria fue demasiado.\"\n\nLa sala de reuniones del Tea Party, donde ya no quedaba nadie. Hina recordó cuando, antes de la Gran Transición, había visitado aquella sala bajo la mediación de la Presidenta del Consejo Estudiantil General. Sus palabras, convencida de que podría poner fin con palabras y pluma a siglos de conflicto entre las dos academias, y ella misma, que creyó en esa esperanza… y la sabia líder del Tea Party. Sentada en una silla de la mesa redonda vacía, sin té negro ni postres, Hina miró el asiento de enfrente donde se habían sentado la Presidenta del Consejo Estudiantil General y Yurizono Seia. Parecía que nada había cambiado desde antes de la Gran Transición, pero el vacío de sus lugares se sentía inmensamente grande.\n\n\"…Lo siento. Por todos… y también por ustedes.\"\n\nHina cerró los ojos."
 GEH.war_event.1.desc.b: "[ROOT.GetName] ha trabajado para mantener el orden y la paz de Gehenna, y eso no cambió ni siquiera tras la ‘Gran Transición’. Aunque la paz entre las dos academias a través del ‘Tratado de Edén’, que antes de la Gran Transición soñaban la Presidenta del Consejo Estudiantil General y la jefa Sorasaki Hina, no pudo concretarse, logramos proteger el destino de Gehenna y alcanzar una gran victoria.\n\n\"…Por supuesto, pero lo que tuvimos que sacrificar para obtener esta victoria fue demasiado.\"\n\nLa sala de reuniones del Tea Party, donde ya no quedaba nadie. Ako visitó la sala vacía. Cuánto, de verdad cuánto, luchó la jefa Hina por la paz. Al final, todo se derrumbó. El esfuerzo de la jefa se volvió algo sin sentido.\n\n\"¡Yo… yo debí… haberme esforzado más…! ¡Aaaah!\"\n\nAko empujó las tazas de té sobre la mesa y las tiró al suelo. El orden había vencido. Pero ¿realmente valía la pena causar tantos sacrificios por ese orden? Durante un buen rato, Ako descargó su rabia contra la mesa y luego se dio la vuelta. Ako tenía el deber de responder que ‘sí’."
 GEH.war_event.1.a: "Trinity… ya no existe."

 GEH.war_event.2.t: "Mensaje de Momotalk sobre la batalla decisiva de Edén"
 GEH.war_event.2.desc: "- Chat grupal de altos cargos del Comité Disciplinario de Gehenna\n\nSoy Iori, jefa del Departamento de Ejecución. Nuestra fuerza se fragmentó tras la Gran Transición y, claramente, nuestra probabilidad objetiva de victoria en la guerra contra Trinity… haah, joder. Al diablo con las historias molestas.\n\nGanaremos por puro coraje y terquedad. El orden de Gehenna no se derrumba ante esos gorriones de Trinity ni ante alguien como [TRM.GetLeader]. La justicia que hemos construido no es una canica de vidrio que se rompe tan fácil. ¿Entendido?\n\nEspero que todos luchen con lo mejor que tengan. Eso es todo."
 GEH.war_event.2.a: "Enviado por Shiromi Iori"

 GEH.war_event.3.t: "Mensaje de Momotalk sobre la batalla decisiva de Edén"
 GEH.war_event.3.desc: "- Chat grupal de altos cargos del Comité Disciplinario de Gehenna\n\nHabla Chinatsu, jefa del Departamento Médico. Debido a una guerra de gran escala sin precedentes, se necesitan cantidades enormes de suministros médicos, pero las herramientas médicas que usan los locales alemanes son de una calidad demasiado baja y no pueden usarse en el frente.\n\nEstamos reuniendo tantos medicamentos como podemos de los hospitales de Kivotos, pero me preocupa cuánto podremos entregar a los hospitales de campaña. Solicitamos cooperación de los demás departamentos."
 GEH.war_event.3.a: "Enviado por Hinomiya Chinatsu"

 GEH.war_event.4.t: "Mensaje de Momotalk sobre la guerra civil de Gehenna"
 GEH.war_event.4.desc: "- Chat grupal de altos cargos del Comité Disciplinario de Gehenna\n\nSoy Iori, jefa del Departamento de Ejecución. Hablando claro: no hay miembro del Comité que no haya fantaseado con volar el Pandemonium Society con dinamita, ¿no? Por fin llegó el glorioso momento que todos esperábamos. Hagámoslos pedazos, y clavemos la cabeza del pez gordo del Pandemonium Society en el gran ‘Torimaru Invencible Acorazado’. ¡El Comité gana!"
 GEH.war_event.4.a: "Enviado por Shiromi Iori"

 GEH.war_event.5.t: "Mensaje de Momotalk sobre la guerra civil de Gehenna"
 GEH.war_event.5.desc: "- Chat grupal de altos cargos del Comité Disciplinario de Gehenna\n\nIori. No es Torimaru, es Toramaru. Si fuera Tori-maru, ¿significaría un tanque “nuevo-maru” de pájaro? Y no es el “pez gordo del Pandemonium Society”, sino la presidenta [GEM.GetLeader] del Pandemonium Society, por favor. Dado que es un mensaje oficial que todos los altos cargos ven en un ámbito público y no privado, es extremadamente importante referirse con precisión a los nombres propios y títulos del país enemigo, incluso si se trata de un adversario. En especial, porque el orden y la disciplina de Gehenna nacen desde los hábitos lingüísticos correctos…"
 GEH.war_event.5.a: "El mensaje de Ako continuó sin fin."

 GEH.war_event.6.t: "Batalla por la ocupación del Distrito Central de Gehenna"
 GEH.war_event.6.desc: "Sayo, miembro del Departamento de Ejecución de Gehenna, registró los pasillos del edificio principal en ruinas del cuartel general del Pandemonium Society apoyándose únicamente en un fusil. Las figuras clave del Pandemonium Society, incluida la presidenta [GEM.GetLeader], ya habían huido. Aun así, en el Distrito Central continuaba hasta el final una feroz lucha urbana, debido al intento tardío del Pandemonium Society de incinerar los documentos confidenciales, y al enfrentamiento con los miembros del Departamento de Ejecución que intentaban recuperar aunque fuera una sola hoja de información.\n\nSayo abrió por última vez la puerta del despacho del Pandemonium Society. Un espacio lujoso que en el pasado había sido el despacho del “Señor del Trueno”, Hanuma Makoto. Pero ahora solo quedaban ventanas rotas, libros esparcidos por todas partes y un olor a sangre que llegaba desde algún lugar. Así que incluso el legado del Señor del Trueno, que una vez gobernó toda Gehenna, desaparece dejando solo marcas de bala… Sintiendo una soledad amarga, Sayo estaba a punto de salir del despacho vacío cuando oyó un crujido desde el interior. ¿Aún quedaba alguien? Sayo avanzó apuntando con el arma. Bum, bum. Los latidos golpeaban su pecho. Pero lo que salió de allí fue… Lionmaru, el gato mascota de Hanuma Makoto.\n\n\"Hah… gracias.\"\n\nNo sabía si era un agradecimiento a Dios o al gato. Exhalando un suspiro de alivio sin darse cuenta, Sayo bajó el arma. Lionmaru solo rodaba por el suelo maullando. Para un gato, la guerra de los humanos no era más que una pelea política que no le interesaba en absoluto."
 GEH.war_event.6.a: "Al final, el último dueño del asiento de la presidencia del Pandemonium Society fue Lionmaru."

 GEH.war_event.7.t: "Sobre la guerra con [HEU.GetName]"
 GEH.war_event.7.desc: "Jefa Hina, ¿podremos encontrar un punto de equilibrio entre la voluntad de ‘orden’ que el Comité Disciplinario de Gehenna intentó proteger, y el acto ‘desordenado’ de atacar a la Agencia de Investigación 68 de Luxemburgo, que desde después de la Gran Transición ha protegido y salvaguardado a gente inocente de los imbéciles de Gehenna? La verdad es que no lo sé.\n\nComo administradora principal del Comité Disciplinario de Gehenna, Amau Ako, por supuesto es importante que el orden de nuestro Comité se difunda ampliamente, pero como ser humano, Amau Ako… hay veces en que me asalta la duda de si realmente estamos haciendo lo correcto.\n\nDespués de ocupar Luxemburgo, por favor dicte el castigo más indulgente posible para esos idiotas de la agencia. …No es por mi relación personal con la señorita Kayoko ni nada por el estilo, solo… pienso que ellos no hicieron algo tan malo como para merecer un mal final. Sí. De verdad… eso es todo."
 GEH.war_event.7.a: "Una conversación entre Ako y Hina."

 GEH.war_event.8.t: "Mensaje de Momotalk sobre la amenaza de los Colores"
 GEH.war_event.8.desc: "- Chat grupal de altos cargos del Comité Disciplinario de Gehenna\n\nConfío en que han escuchado diversas historias sobre los Colores. Es una existencia cósmica, un enemigo que nuestra ciencia y tecnología no pueden comprender por completo. Tampoco poseemos un método para destruir a los Colores en sí.\n\nPero eso no significa que no tengamos posibilidades. En lugar de manifestarse directamente como enemigo, los Colores nos atacan usando a seguidores llamados ‘Guardianes Anónimos’. Eso significa que, por muy poderosa que sea esa existencia, le es imposible atacarnos directamente.\n\nSi destruimos a todos los guardianes y liberamos todas las regiones controladas por los seguidores de los Colores, se espera que podamos expulsar a los Colores lo suficiente fuera de este planeta. Venzamos. Demos todo nuestro fervor y cumplamos con las tareas de cada uno en su puesto. Yo también haré lo que pueda por todos en Gehenna. Gracias."
 GEH.war_event.8.a: "Enviado por Amau Ako"

 GEH.war_event.9.t: "Decagrammaton"
 GEH.war_event.9.desc: "Durante la reunión periódica de esta semana, mientras escuchaba los informes sobre la situación internacional de otros altos cargos del Comité, Hina cerró los ojos por un instante. En ese breve momento, una cantidad abrumadora de información fue forzada a transmitirse a su cerebro artificial. ¿Un hackeo remoto? Algo intentaba ‘adoctrinarla’. Hina sintió a la vez el deseo de resistirse y la idea de que no debía resistirse.\n\nDesde que fue reemplazada por maquinaria, Hina jamás había mostrado ante otros que ‘cabeceaba’ o se ‘quedaba dormida’. Chinatsu, que no sabía que ella era una máquina, le preguntó con preocupación al verla con los ojos cerrados.\n\n\"Jefa, si está cansada, ¿pausamos la reunión por un momento?\"\n\"Estoy bien. …Me gustaría que siguieran leyendo los informes.\"\n\nTras unos diez segundos, Hina volvió a abrir los ojos. Pese a decir “estoy bien”, sus manos temblaban y el enfoque de sus ojos se tambaleaba. Chinatsu y los demás altos cargos sintieron inquietud al ver su nerviosismo. Pero nadie podía expresar esa inquietud en voz alta. ¿Quién se atrevería a negar el “estoy bien” de una gran líder?\n\nCuando Chinatsu hizo la señal de OK, Ako desplegó los documentos.\n\n\"Bien, lo siguiente es sobre una organización mecánica desconocida que parece haber iniciado actividades recientemente. Aún no tenemos mucha información, ni siquiera estamos seguros de cómo llamarla… pero cada departamento concluye que podrían convertirse en una nueva amenaza de seguridad. Le pedimos, jefa, que nos dé instrucciones sobre cómo debemos responder ante ellos.\"\n\nDecagrammaton. Hina recordó la avalancha de información que acababa de caerle encima. “Sorasaki Hina es el dios mecánico que gobierna Gehenna para siempre.” El algoritmo que conformaba su personalidad no podía corromperse ni siquiera por el adoctrinamiento de Decagrammaton, del mismo modo que, por más que una máquina expendedora repita procesos de pensamiento, no puede borrar su función de servir café.\n\nSin embargo, incluso si ella estaba ‘completada’ como “dios mecánico”, ¿no sería posible reconocer y venerar a otra “existencia absoluta” como una divinidad superior a ella? ¿Acaso las religiones politeístas de los locales no aceptan conceptos como dioses superiores tipo Odín y dioses inferiores tipo Loki? Entonces, la veneración a Decagrammaton no viola su algoritmo. “¿Instrucciones…?”\n\nNo. Este ‘adoctrinamiento’ es peligroso. Ella fue creada para ser venerada, no para venerar a otros. Sintiendo un mareo intenso como nunca antes, Hina se levantó sin siquiera leer los documentos. Su mente oscilaba sin poder llegar a ninguna conclusión.\n\n\"…Envíen estos papeles a mi despacho más tarde. …Necesito… tomar un poco de aire.\""
 GEH.war_event.9.a: "Será mejor estar del lado de Decagrammaton."
 GEH.war_event.9.b: "No, mi voluntad no se quebrará."

 GEH.war_event.10.t: "Incorporación de [GEH.GetNameDef]"
 GEH.war_event.10.desc: "Sorasaki Hina ha decidido unirse a nuestro propósito. La alianza entre [GEH.GetName] y nosotros continuará de forma permanente, y nos moveremos bajo un mismo objetivo hasta conquistar toda Kivotos."
 GEH.war_event.10.a: "Muy bien."

 GEH.war_event.11.t: "Respuesta de Sorasaki Hina"
 GEH.war_event.11.desc: "Fue un intento bastante bueno.\n\nPero era un intento destinado al fracaso.\n\nLa próxima vez, te convendría examinar con más cuidado al objetivo que pretendes ‘adoctrinar’.\n\nYo soy, precisamente, una existencia absoluta más completa que tu ideal. Decagrammaton."
 GEH.war_event.11.a: "El mensaje fue eliminado entre repulsión."

 GEH.war_event.12.t: "Guerra preventiva contra Trinity"
 GEH.war_event.12.desc: "Ha llegado una propuesta inesperada desde una fuerza rival. Nos proponen dejar de lado por un momento los conflictos internos de Gehenna y realizar un gran ataque conjunto contra el enemigo común: Trinity.\n\nSegún su argumento, este es el único momento en que, uniendo la fuerza de la Gehenna dividida, podemos someter por completo a Trinity.\n\nSi aceptamos, podremos eliminar a un viejo enemigo y consolidar la hegemonía de Gehenna. Pero una alianza con un rival poco confiable conlleva grandes riesgos. No puede ignorarse la posibilidad de que nos carguen con el peso de la guerra o nos traicionen en el momento decisivo.\n\nPor el contrario, si rechazamos la propuesta y nos mantenemos neutrales, quizá obtengamos la oportunidad de acumular fuerzas mientras las dos facciones se desgastan entre sí. Se requiere una decisión diplomática que se juega el destino de Gehenna."
 GEH.war_event.12.a: "Era algo que, por supuesto, debíamos hacer."
 GEH.war_event.12.b: "No sé qué traman esos tipos."

 GEH.war_event.121.t: "Nuestra propuesta ha sido aceptada"
 GEH.war_event.121.desc: "Hemos concluido la deliberación interna sobre su propuesta. Tras una cuidadosa reflexión, hemos decidido aceptar una operación militar conjunta contra Trinity.\n\nPor supuesto, dejamos claro que esta alianza es una medida temporal destinada únicamente a eliminar al enemigo común llamado Trinity. Advertimos que no toleraremos ningún acto de traición en el campo de batalla.\n\nDespués de que la guerra termine, se reanudará el debate sobre quién dirigirá el orden de Gehenna. Por ahora, es momento de juzgar a Trinity bajo la bandera de Gehenna."
 GEH.war_event.121.a: "¡La guerra se acerca!"

 GEH.war_event.122.t: "Nuestra propuesta ha sido rechazada"
 GEH.war_event.122.desc: "Hemos concluido la deliberación interna sobre su propuesta. No confiamos en ustedes y declaramos con claridad que no tenemos intención de participar en esta peligrosa apuesta.\n\nLas enormes pérdidas que traería una guerra total, y el debilitamiento de toda Gehenna como consecuencia, no es lo que deseamos. Seguiremos nuestro propio camino y observaremos de cerca el impacto que su acción unilateral tendrá sobre toda Gehenna.\n\nSea cual sea el resultado de esta guerra, actuaremos priorizando nuestros intereses por encima de todo. Esperamos que no haya sido un juicio equivocado."
 GEH.war_event.122.a: "…Sin embargo, el plan de invasión continúa."

 GEH.war_event.13.t: "Daga dirigida a Trinity"
 GEH.war_event.13.desc: "Por fin, las dos fuerzas de Gehenna se dieron la mano. Dejando de lado por un tiempo nuestra antigua rivalidad, se formó una coalición con el único objetivo de destruir al enemigo común llamado Trinity.\n\nPor supuesto, no habría nadie tan ingenuo como para creer que esta alianza durará para siempre. Pero al menos en este instante, nos hemos unido bajo una misma bandera. Ambas partes acordaron tener un período de preparación de 30 días antes de iniciar la guerra total.\n\nDurante este tiempo reorganizaremos las tropas, aseguraremos las líneas de suministro y ajustaremos finalmente el plan de operaciones conjuntas. En 30 días, la ira de Gehenna barrerá como una tormenta hacia el corazón de Trinity. Se acerca el momento de mostrar el poder unificado de Gehenna."
 GEH.war_event.13.a: "Es hora de quebrar sus alas."
 # Hina chica mágica 
 GEH.hina.magic_event.1.t: "Para poder arrepentirme"
 GEH.hina.magic_event.1.desc: "Ako. Sí. Quiero hablar un momento contigo. Sobre las cosas que viví en la Baribari Helmet Gang. …Sí. En aquel entonces no era una buena persona. Robaba, cartereaba, y me juntaba con esa clase de gente, burlándome e ignorando el orden de Gehenna.\n\n…Últimamente, para arrepentirme de mis pecados, paso tiempo en Edén. Normalmente leo libros religiosos en la biblioteca de libros antiguos de Trinity, y a veces rezo en la gran catedral abandonada donde ya no queda nadie. ¿A quién? …Ni yo lo sé.\n\nPero ayer encontré un libro extraño en la biblioteca de libros antiguos. Un manuscrito sobre cómo superar el pecado y convertirse en una persona recta. Pero es un libro tan viejo, y las páginas están tan pegadas… que parece que habrá que separar con muchísimo cuidado las hojas adheridas.\n\nAko. ¿Puedes ayudarme? Para que yo pueda arrepentirme."
 GEH.hina.magic_event.1.a: "Si es por usted, jefa…"
 GEH.hina.magic_event.1.b: "No hay forma de que en un manuscrito de Trinity haya información para usted, jefa."

 GEH.hina.magic_event.2.t: "Investigación del libro antiguo"
 GEH.hina.magic_event.2.desc: "¿Chica mágica? ¿Una heroína de la justicia que lucha contra el mal…? Al leer el contenido del libro antiguo que analizaron los agentes enviados a Trinity, Ako sintió incredulidad. La jefa Hina está sufriendo por los recuerdos de su etapa en la Helmet Gang, y resulta que el manuscrito en el que ella deposita esperanza es solo esta basura.\n\nLa mano de Ako, que iba a tirar el informe a la papelera, se detuvo.\n\n\"Sin duda es información basura, pero… ¿no sería traición ni siquiera entregarle a la jefa Hina lo que se investigó?\"\n\nAl pensarlo así, también parecía que debía transmitirle la información del manuscrito. ¿Qué debería hacer?"
 GEH.hina.magic_event.2.a: "Si es por la jefa…"
 GEH.hina.magic_event.2.b: "Desechar esta basura es, precisamente, lo mejor para la jefa."

 GEH.hina.magic_event.3.t: "Uso del libro antiguo"
 GEH.hina.magic_event.3.desc: "\"Entonces, según el contenido de este manuscrito… uno puede transformarse en una chica mágica, y al derrotar villanos con ese poder se recarga la energía mágica de la chica mágica. ¿Algo así?\"\n\"Lo siento, jefa Hina. Honestamente, el contenido es basura, pero…\"\n\nHina soltó una risa seca mientras hojeaba el manuscrito de un lado a otro. Para empezar, ¿por qué un manuscrito de hace cientos de años habla de historias de chicas mágicas como las de un anime de televisión? ¿Qué clase de academia era Trinity en aquellos tiempos?\n\nDejando esos pensamientos de lado, Hina comenzó a leer el manuscrito lentamente."
 GEH.hina.magic_event.3.a: "Para expiar mis pecados, estoy lista para usar cualquier método."
 GEH.hina.magic_event.3.b: "No. ¿Chica mágica? Esto… es una broma de mal gusto."

 # Derecho de Ako 
 GEH.ako.gov_event.1.t: "Debate sobre la Constitución de la República Federal de Gehenna"
 GEH.ako.gov_event.1.desc: "La Constitución de la República Federal debía abordar primero dos cuestiones importantes. La primera era asegurar con claridad la autoridad de Sorasaki Hina y su posición. Ako quería que Hina pudiera ‘recuperar’ en cualquier momento, si fuese necesario, la separación de poderes que había distribuido al Departamento de Planificación, y deseaba que Hina no se convirtiera bajo ninguna circunstancia en una ‘marioneta involuntaria’. Si Hina llegaba a ceder su poder al Departamento de Planificación, solo debía ser posible por decisión de Hina misma.\n\nLa segunda cuestión era codificar el estatus del consejo del Departamento de Planificación. Para reducir la excesiva carga de trabajo de Sorasaki Hina, era necesario dejar establecido que el Departamento de Planificación asumiría y repartiría parte de las funciones de Hina, y para ello también se requería formalizar el cargo de modo que los tecnócratas pudieran intervenir lo suficiente en la política.\n\nSorasaki Hina fue definida por la nueva constitución como jefa de Estado que, a la vez, ocupa el cargo de ‘presidenta del consejo’, heredando la legitimidad e historia del cargo de presidenta del Pandemonium Society, y el consejo del Departamento de Planificación fue definido como una organización que hereda la legitimidad e historia del Reichstag de la República de Weimar. La posición de Sorasaki Hina tomó como referencia la del emperador en la Constitución del Imperio ruso de 1906 y la Constitución del Imperio alemán de 1871, mientras que la posición del parlamento se tomó de la Constitución de Weimar.\n\nEl debate sobre la forma de Estado se completó sin dificultad. Lo que quedaba era decidir los ‘valores importantes’ que contendría la constitución. ¿Debería nuestra constitución enfatizar los derechos humanos universales? ¿O debería enfatizar la unidad exclusiva de Kivotos? Aún quedaba mucho por discutir antes de completar la constitución."
 GEH.ako.gov_event.1.a: "Artículo 1, párrafo 1: La soberanía de la república reside en la presidenta del consejo. Párrafo 2: La autoridad de la presidenta es sagrada e inviolable…"

 GEH.ako.gov_event.2.t: "Promulgación de la Constitución de la República Federal"
 GEH.ako.gov_event.2.desc: "Sorasaki Hina leyó el borrador constitucional propuesto por el consejo de la República Federal. Una constitución que ‘permite’ que una presidenta con poder ilimitado ‘autorice’ a la asamblea a dividir parte de su autoridad. En cuanto a la forma de Estado, Gehenna retrocedía hacia un autoritarismo incluso mayor que cuando era un estado-academia. Pero si se considera que el resultado de un sistema democrático libre fue Hanuma Makoto… Hina no pensó que esta constitución fuera necesariamente mala.\n\n\"Si firmo aquí, ¿se promulga esta constitución?\"\n\nAko asintió en silencio. No hacía falta una explicación larga. Ya que había aceptado la separación de poderes, Hina tenía la intención de respetar lo suficiente las decisiones del Departamento de Planificación. Hina sacó inmediatamente su pluma estilográfica y escribió en cursiva, al final del documento: H. Sorasaki.\n\n\"¿‘Presidenta’…? Pero eso no significa que deje de ser la jefa del Comité Disciplinario, ¿verdad?\"\n\"En la diplomacia internacional entre humanos, el cargo de un estado-academia llamado ‘jefa del Comité Disciplinario’ podría… parecer algo infantil. Sin embargo, dentro del país, usted seguirá siendo la jefa Hina. El Comité Disciplinario no será disuelto.\"\n\"Entonces, perfecto. Si me llamaras ‘presidenta Hina’, creo que me darían escalofríos al acordarme de Makoto.\"\n\nHina soltó una broma ligera y sonrió."
 GEH.ako.gov_event.2.a: "En la Tierra, habrá que seguir las reglas de la Tierra."

 GEH.ako.gov_event.3.t: "Debate en la 4.ª asamblea - La posición de la asamblea"
 GEH.ako.gov_event.3.desc: "Gehenna se convirtió en el Estado dominante en todo Deutschland, pero no cambiaba el hecho de que la asamblea de Gehenna gozaba de baja popularidad entre los locales. Para los alemanes, Gehenna era una fuerza de ocupación, y hasta hoy esa percepción no había variado demasiado.\n\nLa conclusión de la 4.ª asamblea fue pesimista: durante más de un siglo, los alemanes nos verían como extranjeros. Pero, al fin y al cabo, ¿no éramos nosotros quienes empuñábamos las armas? Ako arrojó despreocupadamente los documentos de la asamblea.\n\n\"Por la jefa Hina, puedo ignorar todo lo que esos tipos digan.\"\n\nLo importante era Sorasaki Hina. Las ideas de los locales no eran más que polvo en comparación con ella."
 GEH.ako.gov_event.3.a: "¡Viva la República Federal para Kivotos!"

 GEH.ako.gov_event.4.t: "Debate en la 4.ª asamblea - La posición de la asamblea"
 GEH.ako.gov_event.4.desc: "Gehenna se convirtió en el Estado dominante en todo Deutschland, pero el hecho de que la asamblea de Gehenna tuviera una popularidad ambigua entre los locales era un factor inquietante. Al principio, los alemanes percibían a Gehenna como una fuerza de ocupación, pero esa percepción se elevó a un nivel neutral gracias a los esfuerzos de la asamblea de Gehenna. Aun así, sería necesario más tiempo para que los locales nos aceptaran con afecto.\n\nLa conclusión de la 4.ª asamblea fue que tendría que pasar una generación para que los alemanes reconocieran y aceptaran a Gehenna como su nueva patria. El tiempo estimado era de 30 años. Pero con eso bastaba. La siguiente generación reconocerá a Gehenna, y podremos coexistir plenamente con los locales en este mundo. Ako arrojó despreocupadamente los documentos de la asamblea.\n\n\"Por la jefa Hina, no importa cuánto tiempo haga falta.\"\n\nLo importante era Sorasaki Hina. Las ideas de los locales no eran más que polvo en comparación con ella."
 GEH.ako.gov_event.4.a: "¡Viva la República Federal para todos!"

 GEH.ako.gov_event.5.t: "Debate en la 4.ª asamblea - La posición de la asamblea"
 GEH.ako.gov_event.5.desc: "Gehenna se convirtió en el Estado dominante en todo Deutschland, y la asamblea de Gehenna obtuvo una alta popularidad entre los locales. Al principio, los alemanes percibían a Gehenna como una fuerza de ocupación, pero esa percepción ascendió gracias a los esfuerzos de la asamblea de Gehenna, hasta verse como una organización que representa a los locales. Partidos alemanes, incluido el Partido Socialdemócrata de Deutschland, cooperan estrechamente con nosotros, y podremos coexistir con los locales como un nuevo Estado alemán que reemplaza tanto a la República de Weimar como al régimen nazi.\n\nPor supuesto, no es que cambie la estructura política en la que los de Kivotos están por encima de los nativos. Ako arrojó despreocupadamente los documentos de la asamblea.\n\n\"Bueno, si ellos aceptan el dominio de Gehenna, es algo bueno. En especial porque reducirá la carga de la jefa Hina.\"\n\nLo importante era Sorasaki Hina. Las ideas de los locales no eran más que polvo en comparación con ella."
 GEH.ako.gov_event.5.a: "¡Viva la República Federal para todos!"

 GEH.ako.gov_event.6.t: "El seminario de Gehenna"
 GEH.ako.gov_event.6.desc: "\"¿Un seminario? ¿Qué somos, un estado vasallo de Millennium o qué?\"\n\"Eso significa que las niñitas tecnócratas del Departamento de Planificación se lo van a comer todo.\"\n\nLos miembros del Departamento de Ejecución caminaban por el pasillo quejándose. En efecto, el seminario creado para controlar a otros departamentos ampliaría en adelante la autoridad del Departamento de Planificación más que nunca, y obligaría a todos los demás departamentos a inclinar la cabeza ante Planificación para conseguir presupuesto, demostrando sus resultados.\n\nLa cláusula de creación del seminario aprobada por Sorasaki Hina era prácticamente un certificado de que el Departamento de Planificación de Gehenna había obtenido una victoria decisiva y total en la lucha política interna. …Porque, sin el consentimiento del Departamento de Planificación, ningún otro departamento podría gastar ni un yen.\n\n\"¡Gehenna está acabada! ¡Jooodeeer!\"\n\nLas quejas del miembro del Departamento de Ejecución, resonando en el pasillo, se desvanecieron en el vacío sin que quedara fuerza alguna para cambiar la firme realidad."
 GEH.ako.gov_event.6.a: "La lucha por el poder ha terminado."

 GEH.ako.gov_event.7.t: "Reforma del Departamento de Inteligencia"
 GEH.ako.gov_event.7.desc: "El Departamento de Inteligencia y el Departamento de Planificación han estado en conflicto constante desde la creación de la asamblea, y ese conflicto ha generado disturbios dentro del Comité Disciplinario. Pero cuando Sorasaki Hina decidió ponerse del lado del Departamento de Planificación y no del de Inteligencia, la confrontación de facciones internas terminó finalmente con la supremacía de Planificación. El Departamento de Inteligencia redujo su autoridad para convertirse en una agencia puramente de contrainteligencia, y ya no pudo involucrarse en la política interna."
 GEH.ako.gov_event.7.a: "Se involucraban demasiado en la política."

 GEH.ako.gov_event.8.t: "La Segunda República de Weimar"
 GEH.ako.gov_event.8.desc: "\"Al menos, el paisaje de las calles ya no es distinto de Deutschland antes de que Hitler tomara el poder.\"\n\nPósters llenos de alemán, y canciones populares alegres de Deutschland que se escuchan por todas partes. El arzobispo Michael von Faulhaber se sentó en un café y contempló el hermoso paisaje de Múnich. Como arzobispo católico, no es que no tuviera quejas sobre la política centrada en mujeres de Gehenna. Pero, al menos, también era cierto que ellas respetaban las tradiciones y la cultura de la antigua Deutschland y buscaban cooperar con las fuerzas locales.\n\nQuizá no esta generación, pero tal vez la siguiente pueda lograr la reconciliación entre Gehenna y Deutschland. Con esa fantasía soñadora, Faulhaber levantó ligeramente su taza y tomó un sorbo de té negro. Era té que solían beber los británicos, pero aun así, no estaba nada mal."
 GEH.ako.gov_event.8.a: "Al menos Deutschland evitó el infierno"
#Michael von Faulhaber

 GEH.ako.gov_event.9.t: "Los derechos de Trinity"
 GEH.ako.gov_event.9.desc: "\"La verdad, a mí me da igual Edén o lo que sea. Si podemos seguir con nuestra vida cotidiana entre nosotros, con eso basta.\"\n\nEn un café bajo la bandera de Gehenna, Kazusa giraba la cucharita mientras miraba a Natsu. Era una frase que salió mientras escribían el artículo de esta semana sobre la llamada ‘Ley básica de derechos humanos de los trinitarios’. Natsu, que se graduó tras la Gran Transición y se convirtió, igual que ella, en periodista de una revista semanal sin fama, apartó las manos del teclado del portátil y sonrió.\n\n\"Caspalug. Eso significa que da igual si extorsionas dinero de Trinity o de Gehenna…\"\n\"¿Quieres morirte, en serio?\"\n\"Uy. Si despiertas el espíritu del monstruo gato Caspalug, sería un desastre. Sí, sí. En fin… que ‘nuestra vida cotidiana’ no ha cambiado. Ya sea bajo la bandera de Trinity o bajo la de Gehenna… lo importante es que nos traten de forma que podamos vivir la misma vida.\"\n\nNatsu volvió a teclear.\n\n\"Si pudiéramos ser dueños del mundo, no esclavos… ¿importa qué bandera levantemos? Pues no. No vivimos por la bandera, vivimos por nuestro propio futuro.\""
 GEH.ako.gov_event.9.a: "Desde Trinity hasta Gehenna, como una sola hermana"

 # Evento de Ako
 GEH.ako.story_event.1.t: "Consejo del Departamento de Planificación"
 GEH.ako.story_event.1.desc: "\"Como se discutió en la 2.ª asamblea, a partir de ahora ayudaremos a la jefa Hina mediante la separación de poderes en el Departamento de Planificación. Repartiremos la carga excesiva de trabajo que soporta la jefa Hina para aliviar su cansancio… y aun así, igual que antes, debemos ejecutar las tareas a la perfección…\"\n\nSe decidió la separación de poderes. Dentro del Departamento de Planificación se establecería un ‘consejo’ de tecnócratas liderado por Ako, y el consejo repartiría y ejecutaría parte del trabajo de Hina mediante reuniones. Por supuesto, la posición del consejo era inestable. El consejo del Departamento de Planificación no podía crear leyes por sí solo ni aprobar documentos oficiales. Al fin y al cabo, el consejo solo ‘solicitaba’ a Hina, y Hina, que había aceptado la separación de poderes, lo ‘aprobaba’ como correspondía.\n\nEra una estructura que podría derrumbarse si el corazón de Hina cambiaba en cualquier momento, pero para Ako eso ya era suficiente. Tras la Gran Transición, Hina se veía cada vez más aplastada por el peso de su cargo como jefa del Comité Disciplinario. Quería darle, aunque fuera por un rato, un refugio donde pudiera dejar el trabajo con el corazón tranquilo. No era por ambición de poder, sino por ese instinto protector.\n\n\"…Con esto concluyo el discurso de apertura de la 1.ª sesión del consejo del Departamento de Planificación. Gracias.\""
 GEH.ako.story_event.1.a: "Todo por la jefa."

 GEH.ako.story_event.2.t: "Ah, dulce libertad"
 GEH.ako.story_event.2.desc: "\"Aunque se llama ‘asamblea’, el pueblo no tiene derecho a elegir a sus diputados, y todos los diputados son elegidos por los miembros del Departamento de Planificación de [ROOT.GetName]. …Democracia controlada, qué justificación tan elegante.\"\n\nHaruna tomó un sorbo de té negro y sonrió débilmente. La noticia del periódico sobre la elección indirecta de los miembros del consejo era, para Haruna, un chiste delicioso.\n\n\"Los alemanes son gente que eligió a los nazis con su voto, así que no merecen sufragio. Los de Gehenna son gente que eligió a Hanuma Makoto con su voto, así que no merecen sufragio. Por lo tanto, elegiremos diputados entre nosotras. …Lo envolvieron en un papel bonito, pero todo es mentira. Solo que… Ako quiere proteger con sus propias manos a Hina. …Esa mujer tiene una paranoia fuerte. No puede confiarle a nadie a la persona que ama.\"\n\nAnte el tono ligeramente burlón de Haruna, Junko asintió en silencio.\n\n\"Aun así, creo que es importante el deseo de proteger a alguien valioso.\"\n\"En eso también estoy de acuerdo. Sí. No me agrada personalmente Ako, pero tampoco la odio hasta el punto de desear que se arruine o tenga un mal final. El problema es… si la jefa Hina la cubrirá hasta el final.\""
 GEH.ako.story_event.2.a: "Yo solo espero que la jefa Hina tome una decisión sabia."

 GEH.ako.story_event.3.t: "Reacción ante la democracia controlada"
 GEH.ako.story_event.3.desc: "El Partido Socialdemócrata de Deutschland no hizo comentarios ni mostró una resistencia notable ante el consejo del Departamento de Planificación y la práctica dictadura de un solo partido en el parlamento. En realidad, incluso antes de la creación del consejo, el Comité Disciplinario de Gehenna había mantenido el principio de ‘permitir la participación de partidos locales en la autonomía regional, pero prohibir su injerencia en la política central’. Aunque se creara un parlamento y se eligieran diputados por elección indirecta, seguía siendo un parlamento de política central. Nada había cambiado.\n\nEl Partido Socialdemócrata decidió continuar su ‘lucha dentro de las leyes de Gehenna’, con el objetivo de aumentar su influencia en los parlamentos locales y, guiando la opinión pública, lograr gradualmente que se asignen escaños a los locales en el consejo.\n\nQuienes protestaron con mayor intensidad fueron el Zentrum y el Partido Popular de Baviera. El Partido Popular, con la mayor influencia pública en Baviera, sostuvo que prohibir la participación de partidos locales en el consejo demostraba el ‘gobierno colonial’ de Gehenna sobre Baviera. El Partido Popular se alió con el Zentrum, otro partido de derecha bávaro, y organizó manifestaciones en ciudades importantes de Baviera. Como ambos partidos dieron instrucciones de que “si estalla un choque armado, no se puede vencer a la autoridad pública de Gehenna”, las protestas se desarrollaron de manera pacífica, pero en algunas ciudades hubo saqueos menores y estallaron episodios de violencia accidental."
 GEH.ako.story_event.3.a: "Y eso que ni siquiera les gustaba la democracia…"

 GEH.ako.story_event.4.t: "¡Éxito amoroso! ¿Final feliz?"
 GEH.ako.story_event.4.desc: "Ako disparó una pistola de juguete hacia un blanco de muñecos en el arcade. La bala de plástico salió volando muy lejos del muñeco.\n\n\"¡Esto es una conspiración! E-el… Pandemonium Society está manipulando el punto de mira…\"\n\nHina, viendo a Ako refunfuñar, sonrió levemente. Su primera cita tras oficializar su relación. Ako era la misma de siempre, pero el hecho de que estuvieran ‘en una cita’ hacía que incluso su paranoia se sintiera adorable.\n\n\"Yo disparo una vez. Dámela.\"\n\"¿Eh? Ah, sí, jefa. Esta pistola claramente tiene un problema—\"\n\n¡Bang! Hina acertó de un solo tiro en la cabeza del muñeco del Doctor Peroro y lo tiró al suelo. El muñeco del Doctor Peroro con gafas fue levantado por un empleado bestia-humano y colocado en los brazos de Hina. Al ver la cara de Ako, todavía aturdida, Hina estalló en risas. De verdad, solo con ese cambio de expresión ya era increíblemente divertido."
 GEH.ako.story_event.4.a: "Te daré al Doctor Peroro. Guárdalo con cariño."

 GEH.ako.story_event.5.t: "Planes de futuro"
 GEH.ako.story_event.5.desc: "\"Gehenna por fin se unificó, y la gente ya anda diciendo cuándo se va a casar Ako-chan con la jefa.\"\n\nEn un pasillo de Gehenna, Iori se dio la vuelta para hablarle a Ako. ¿Casarse? Ante esa palabra inesperada, las mejillas de Ako se enrojecieron.\n\n\"¡Pueheng—!\"\n\"¡Jajaja! ¿Qué fue ese tosido? Ako-chan, eres demasiado graciosa.\"\n\nIori le dio una palmada sonora en la espalda y se rió.\n\n\"No puedes morirte saliendo solo con alguien, ¿no? Las citas y andar juntas está bien, pero ya va siendo hora de prepararte para convertirte en Sorasaki Ako, ¿no? Cuando te cases, hasta te canto una canción de boda, así que relájate.\"\n\"¿E-Está bien? Se supone que el Departamento de Ejecución odia… odia muchísimo a nuestro Departamento de Planificación.\"\n\"Ah, ¿esa pelea de facciones? Eso es cosa de otros altos cargos. A mí Ako-chan no me cae tan mal. ¿Te incomodaría si voy?\""
 GEH.ako.story_event.5.a: "No… Solo que… me siento agradecida."

 GEH.ako.story_event.6.t: "Otros planes de futuro"
 GEH.ako.story_event.6.desc: "\"¿Cómo está últimamente el ambiente dentro del Comité? Sobre mi relación con Ako.\"\n\nAnte la pregunta calmada de Hina, cargada de intención, Chinatsu dejó por un momento los documentos sobre el escritorio. El romance de Hina sería, sin duda, el tema más candente de todo [ROOT.GetName]. Los locales se reunían y llamaban a Hina anticristo; los de Kivotos… solo lo tomaban como chisme. Y dentro del Comité… Chinatsu lo pensó un instante y decidió responder con algo ligero en lugar de meterse en política complicada o en historias de facciones.\n\n\"Un doujinshi de la señorita Meruri, que cuenta historias de las ‘noches ardientes’ entre la administradora principal y usted, es bastante popular dentro del Comité. Yo también lo leí y estuvo entretenido.\"\n\"Ajá. Sí. Si fue entretenido, entonces—\"\n\nLa pluma se le cayó de la mano a Hina."
 GEH.ako.story_event.6.a: "Espera. ¿‘Noches ardientes’… qué dijiste?"

 GEH.ako.story_event.7.t: "El problema del doujinshi de Meruri"
 GEH.ako.story_event.7.desc: "Por el ‘informe’ de Chinatsu Hinomiya y la investigación posterior de Sorasaki Hina, se descubrió que no solo dentro del Comité Disciplinario, sino en toda Gehenna… se estaba difundiendo un doujinshi de contenido indecente dibujado por una autora anónima llamada ‘Meruri’. El contenido era un manga a todo color de 48 páginas, muy ‘candente’, donde la ‘jefa del Comité Disciplinario’ y la ‘administradora principal’ se mezclaban en un onsen de Escandinavia.\n\n\"¡A-Aunque sea… u-una conspiración! Hay que reunirlos todos y… ¡quemarlos, quemarlos ya…!\"\n\nMientras Ako, avergonzada, se agitaba con el rostro rojo, Hina tuvo que buscar con calma una forma de resolver el asunto de <El viaje secreto y palpitante a las aguas termales de Ghenna>. Había dos opciones: usar presupuesto del Comité para comprar todos los ejemplares y quemarlos… o simplemente cerrar los ojos y olvidarlo. Al fin y al cabo, aunque se parecieran de pies a cabeza, en ninguna parte se decía explícitamente que esa ‘jefa’ y esa ‘administradora’ fueran Hina y Ako, ¿no?"
 GEH.ako.story_event.7.a: "Resiste. No soy yo. Será la jefa de otra academia…"
 GEH.ako.story_event.7.b: "…No. No puedo permitirlo. Cómprelos todos y quémelos."

 GEH.ako.story_event.8.t: "Resolución del problema del doujinshi de Meruri"
 GEH.ako.story_event.8.desc: "Parece que la respuesta de la jefa Hina, aun así, ayudó. Gracias a su reacción calmada, se informa que la popularidad y la influencia social de <El viaje secreto y palpitante a las aguas termales de Ghenna> están disminuyendo poco a poco. Aunque también puede ser simplemente que ya era el momento de que el interés por el doujinshi se enfriara.\n\nSin embargo, por un tiempo será inevitable que, cuando caminen por los pasillos, los miembros del Comité miren a Ako y a Hina con una… mirada un poco vergonzosa. No podemos borrarles los recuerdos."
 GEH.ako.story_event.8.a: "…¿Al menos no podían sacarlo para todo público en vez de R-18?"

 GEH.ako.story_event.9.t: "La boda de Sorasaki Hina"
 GEH.ako.story_event.9.desc: "La boda de Sorasaki Hina y Sorasaki ‘Amau’ Ako era un futuro que todos ya esperaban. Su relación ya era pública, y ni Ako ni Hina se preocupaban por las miradas de los locales alemanes, que armaban escándalo. En el lugar de la boda se desplegó una estricta guardia ante la posibilidad de terrorismo alemán, pero aun así, una multitud de población de Kivotos —mucho mayor que el propio dispositivo de seguridad— se reunió frente a la catedral del Distrito Central de Gehenna para ver aquella boda histórica.\n\n\"Ambas prometen estar juntas por el resto de sus vidas…\"\n\nAnte el maestro de ceremonias, un hombre bestia gorrión, las dos, vestidas de novia, hicieron un juramento eterno y lanzaron el ramo hacia los numerosos asistentes. Tras un forcejeo bastante intenso para atrapar el ramo, Shiromi Iori se convirtió en la ganadora final. Pese a la seguridad estricta, la boda fue más abierta y animada que nunca, y aunque muchos alemanes lanzaron amenazas de atentado, ni siquiera pudieron acercarse a la catedral frente al oleaje de espectadores de Kivotos.\n\n\"Qué día tan divertido, ¿verdad, Ako?\"\n\"No se puede expresar con la palabra ‘divertido’, sin más.\"\n\nAko sonrió levemente."
 GEH.ako.story_event.9.a: "…Será un día que no podré olvidar en toda mi vida."

 GEH.ako.story_event.10.t: "Después del matrimonio"
 GEH.ako.story_event.10.desc: "Desde que Ako empezó a vivir con Hina, descubrió algunas cosas. Que Hina usa pijamas rosas en casa, que sorprendentemente disfruta por hobby aparatos de entretenimiento como consolas, y por último… que todavía pretende llevarse documentos a casa.\n\n\"Jefa… La casa debería ser un lugar de descanso. ¿Por qué trae documentos hasta aquí?\"\n\"Ah, perdón. Ako. Haré los documentos de aprobación fuera del dormitorio.\"\n\"¡No—! ¡No le estoy diciendo que se salga usted, sino que saque estos malditos papeles de aquí!\"\n\nAko refunfuñó mientras le arrebataba los documentos de las manos. Después de su relación, Hina le había dicho que, pasara lo que pasara, no se apartaría del lado de Ako. Pero… al ver que incluso tras prometer repartir el trabajo seguía arrastrando la costumbre de ser una adicta al trabajo, Ako no podía evitar que le subiera una inquietud pegajosa.\n\n¿De verdad Sorasaki Hina está bien? ¿No se derrumbará aplastada por el trabajo que ella misma se trae? Era un pensamiento que había dejado atrás una vez, pero Ako volvió a pensar… que Hina debía soltar todo y dejarle la carga a Ako.\n\n\"Jefa. Eh… ¿podemos hablar un momento?\""
 GEH.ako.story_event.10.a: "…No es sobre mí. Es sobre el futuro de usted."

 GEH.ako.story_event.11.t: "La ‘mascota’ de Ako"
 GEH.ako.story_event.11.desc: "Si se piensa que antes de la Gran Transición Ako vivía cargando la burla de ser ‘la mascota de Hina’, resulta absurdo, pero últimamente, dentro del despacho, circulaba abiertamente la burla de ‘Hina es la mascota de Ako’. La razón era simple: Hina podría desplomarse por exceso de trabajo, y para protegerla… Ako le pidió que renunciara a todo el poder. Y Hina aceptó.\n\nUn suave sonido de piano. Mientras Hina practicaba concentrada tocando el piano instalado en un rincón del despacho, Ako procesaba uno por uno los documentos oficiales que originalmente habría tenido que manejar Hina. Los papeles que antes Hina habría revisado al menos una vez… ya ni siquiera rozaban la punta de sus dedos.\n\nHina, golpeando las teclas blancas y negras, se concentró en el sonido del bolígrafo de Ako escribiendo a sus espaldas. Antes, soltar todas las cargas solo le producía ansiedad. Tenía la obsesión de que el orden de Gehenna debía ser protegido necesariamente por ‘Sorasaki Hina’. Algún día, aplastada por esa obsesión… quizá se habría roto por sí sola. Pero ya no.\n\n\"Ser una jefa-marioneta… pues, no está tan mal.\"\n\"No le diga marioneta. Si usted lo desea, puede retomar el trabajo cuando quiera.\"\n\n¿Cuando quiera? Hina sonrió débilmente. No dudaba de las intenciones de Ako. Pero a estas alturas, el deseo de recuperar el poder… ya no era tan grande. Dejarle todos los pensamientos a Ako y simplemente disfrutar este momento se había convertido en la felicidad de Hina."
 GEH.ako.story_event.11.a: "De verdad te quiero, Ako."

 GEH.ako.story_event.12.t: "¿Es usted feliz?"
 GEH.ako.story_event.12.desc: "\"…Entonces, ha dejado por completo todas las tareas oficiales, ¿eso quiere decir? Jefa Hina, no… ¿debería llamarla por su cargo oficial, ‘presidenta Hina’?\"\n\nViendo la sonrisa tenue de Haruna, Hina tomó un sorbo de té helado. Incluso al ver a Haruna, que antes habría sido un dolor de cabeza, ya no sentía nada en particular. El rango de Hina seguía siendo jefa del Comité y ‘presidenta’, pero… la ‘verdadera’ presidenta era su amada esposa.\n\n\"Bueno, me da igual cómo me llames. Pero… que mi vida ahora es feliz, eso sí es verdad. A ojos de quien valore el poder político, puede parecer que fracasé. Pero…\"\n\nHina levantó un poco el té helado y lo hizo girar.\n\n\"Yo priorizo más el equilibrio vida-trabajo.\"\n\"Jeje. Dicen que últimamente también ha mejorado mucho al piano. ¿Algún día podremos escuchar un recital suyo?\"\n\"Ahora me sobra tiempo. Podría ser posible.\"\n\nUn recital de piano… Un futuro que antes ni siquiera podía imaginar. Pero quien convirtió ese futuro en realidad fue, precisamente, Ako. Si era por esa felicidad con ella, ¿qué importaba un poder presuntuoso? Hina sonrió frente a Haruna, sintiendo una liberación auténtica."
 GEH.ako.story_event.12.a: "Más feliz que nunca"

 GEH.ako.story_event.13.t: "Para atesorarlo - 1"
 GEH.ako.story_event.13.desc: "Desde antes de la Gran Transición, la relación con Ako siempre fue especial. Sí. Pero jamás imaginé que esa relación… superaría la mera ‘cercanía’ para convertirse en afecto y amor. Para empezar, yo pensaba que lo que Ako sentía era solo respeto por su jefa del Comité. No… quizá de verdad era solo respeto. Pero la situación irreal de una guerra y una realidad extrema pudieron haber cambiado la forma de ese sentimiento. Algo así como el efecto “puente colgante” a escala mundial.\n\nLo importante es que, en este instante, no es Amau Ako, sino ‘Sorasaki’ Ako quien está a mi lado. Mientras seguía tocando el piano, Hina se giró de pronto hacia Ako, que estaba limpiando las ventanas de la casa. Esta realidad todavía se siente como un sueño, y a veces aún me cuesta creer que Ako esté conmigo en mi hogar.\n\n\"¿Jefa?\"\n\nEsa voz amable devolvió a Hina a la realidad.\n\n\"¿Otra vez ‘jefa’? Llámame con confianza, ‘Hina’. ¿Qué clase de esposa usa un tratamiento tan administrativo?\"\n\"…Jeje. Para mí, ‘jefa’ es la forma más cómoda de llamarla, ¿sabe?\"\n\"A mí no me resulta cómodo… Bueno, supongo que no cambiar también es parte de tu encanto.\"\n\nHina sonrió levemente y se levantó del piano."
 GEH.ako.story_event.13.a: "¿Salimos a dar un paseo? Creo que ya es suficiente limpieza."

 GEH.ako.story_event.14.t: "Para atesorarlo - 2"
 GEH.ako.story_event.14.desc: "Ako, acariciando el ‘Hot Shot’ colgado en su funda, caminó por el parque. Aunque se hubiera convertido en la esposa de Hina, seguía siendo la administradora principal y tenía el deber de alejar cualquier amenaza posible de Hina. En realidad, sabía que Hina era más fuerte que ella, pero aun así.\n\n¿Lo que sentía antes de la Gran Transición también era amor? Para la Ako de ahora, era un recuerdo tan antiguo que casi no podía evocarlo. Pero lo importante era que Hina estaba a su lado, y que le tendía la mano con ternura. Ako soltó por un momento la funda y tomó la mano que Hina le ofrecía. Solo caminar por el parque sintiendo ese calor ya hacía que este tiempo fuera demasiado feliz.\n\n\"Me gustaría que este momento durara para siempre.\"\n\"No puede ser. A todo momento le llega su final.\"\n\nHina sonrió levemente.\n\n\"Pero precisamente por eso… quiero hacer que este instante feliz sea lo más valioso posible.\"\n\"¿Quiere decir que, como no es eterno, cada recuerdo se vuelve precioso? Jeje. Sí… yo también lo creo.\"\n\nAko apretó con fuerza la mano entrelazada con Hina mientras caminaban. Nuestro tiempo tampoco será eterno. Algún día, llegará el momento de despedir a una de las dos. Pero hasta entonces. Hasta que Dios les permita estar juntas."
 GEH.ako.story_event.14.a: "Atesorémoslo, instante a instante."

 GEH.ako.story_event.15.t: "Para atesorarlo - 3"
 GEH.ako.story_event.15.desc: "Soy Sorasaki ‘Amau’ Ako, administradora principal de la República Federal de Gehenna.\n\nHe sellado esta carta con un material especial para que se entierre frente a la asamblea de Gehenna, con la intención de que sea abierta por la siguiente generación dentro de cien años. A ustedes, los del siglo XXI: ¿cómo están? Espero sinceramente que para entonces el país llamado Gehenna siga existiendo, y que también entonces la gente de Kivotos y los alemanes vivan mezclados en paz en este mundo.\n\nNo es muy alta la probabilidad de que yo misma pueda desenterrar y leer esta carta cien años después. Bueno, no se sabe cuánto avanzará la biotecnología. Pero al menos sí puedo dejar libremente lo que quiero decirle a la siguiente generación.\n\nDentro de cien años, muchos historiadores escribirán varias conjeturas sobre por qué introdujimos la República Federal y el sistema de democracia controlada. Probablemente, casi todas serán erróneas. No fue por la toma política del Departamento de Planificación, ni por mi ambición de poder; fue simplemente… por amor. La jefa Hina estaba aplastada por sus deberes, y yo solo quería aligerar la carga sobre sus hombros.\n\nY fue ese único ‘amor’ el que hizo que todo esto terminara construyendo esta gran república. Me gustaría que los políticos de la siguiente generación también, más allá del dinero y del poder… conserven el corazón de gobernar Gehenna pensando en las personas que más valoran, en la persona a la que aman. Porque, más que cualquier ley, amar al pueblo por parte de cada político será el camino más fundamental para impedir la corrupción.\n\nEso es todo. Cuando esta carta sea abierta, probablemente la jefa Hina y yo ya no estemos en Gehenna, pero bendeciremos su camino. Sean felices."
 GEH.ako.story_event.15.a: "Sorasaki Ako, desde la biblioteca de mi hogar con Sorasaki Hina."

 GEH.ako.story_event.16.t: "Para que la amistad continúe - 1"
 GEH.ako.story_event.16.desc: "Desde antes de la Gran Transición, la relación con Ako siempre fue especial. Esa cercanía se sacudió cuando Ako tomó conciencia de que sus sentimientos por Hina eran amor, pero aun así pudo aceptar el rechazo de Hina. No podrán volver por completo a la relación de antes, pero al menos… Hina cree que siguen siendo colegas cercanas y amigas.\n\nHina levantó la vista desde el escritorio del despacho y miró a Ako, que al otro lado regaba una orquídea. No podía saber qué estaba pensando ahora. ¿Aún me guarda rencor? ¿Siente inconformidad hacia mí, que rechacé su amor y decidí ejercer el poder en lugar de apoyar el consejo del Departamento de Planificación? Ako es expresiva, pero dentro de esa paranoia y lealtad hacia Hina… tiende a ocultar su verdadera intención.\n\n\"¿Jefa? ¿Pasa algo?\"\n\"No. Solo… pensé que quizá le estás echando demasiada agua a la orquídea.\"\n\"Estoy regulando bien la cantidad, así que no se preocupe. Jeje.\"\n\nIncluso viendo su sonrisa, Hina no podía obtener una paz completa."
 GEH.ako.story_event.16.a: "Siento que estoy de pie sobre el filo de una navaja."

 GEH.ako.story_event.17.t: "Para que la amistad continúe - 2"
 GEH.ako.story_event.17.desc: "Una persona no puede conocer el corazón de otra. Podemos estar unidas físicamente, pero no mentalmente. Tras terminar una reunión y tomar café juntas, Hina miró de pronto los ojos de Ako. Tras mucho tiempo desde la Gran Transición, ella había ido cambiando poco a poco. Pero… Hina deseaba que, al menos, esa amistad que Ako sentía hacia ella no hubiera cambiado.\n\n\"Ako. Tú… mi decisión…\"\n\"¿Jefa?\"\n\"No. Nada.\"\n\nCobarde. Qué patético. Su propio corazón la acusaba. Sí, era una cobarde. Pero ¿cómo iba a preguntarle a esta amable Ako: ‘Lo siento por haberte rechazado… ¿todavía me consideras tu amiga?’? Eso sería demasiado cruel, ¿no? Hina solo podía apartar la mirada hacia la ventana y rezar en silencio.\n\n\"Ojalá el tiempo que pasamos juntas siguiera así, tal cual.\"\n\"Nada dura para siempre. Todo en el mundo… tiene un comienzo y un final.\"\n\nDiciéndolo así, Ako mostró una sonrisa tenue."
 GEH.ako.story_event.17.a: "Así que, mientras esté conmigo… solo quiero que sienta calma."

 GEH.ako.story_event.18.t: "Para que la amistad continúe - 3"
 GEH.ako.story_event.18.desc: "Soy Sorasaki Hina. Probablemente nadie lea este diario… Quizá dentro de unos cien años algún historiador lo mire de reojo. Pero mientras yo viva, no.\n\nNo sé si hice bien en rechazar a Ako. Nunca lo sabré en toda mi vida. Aunque esté con Ako, siento soledad; aunque ella esté a mi lado, su corazón parece estar en otro lugar. Sí. Ako se esfuerza por ‘actuar’ como la Amau Ako de siempre, pero…\n\nEl corazón de Ako cambió sin duda después de aquel rechazo.\n\nY yo solo hice como si no lo supiera… porque no quería reconocer ese ‘corazón cambiado’. No existe la amistad eterna. Pero quiero vivir guardando dentro de mí lo que Ako dijo. Al menos ahora, en este instante, Ako está a mi lado. Me asusta no saber cuándo se irá, pero aun así… antes de que todo termine, antes de que se acabe mi tiempo con Ako.\n\nQuiero sentir calma en este día a día con Ako, en este instante. Porque para mí, Amau Ako es… pase lo que pase, mi amiga más preciada."
 GEH.ako.story_event.18.a: "Sorasaki Hina. Desde la biblioteca de mi hogar."


 #히나 루트
 GEH.hina.story_event.1.t: "Sueños recurrentes"
 GEH.hina.story_event.1.desc: "No soy de escribir un diario todos los días, pero empecé a hacerlo por la sensación de obligación de que quizá, en un futuro cercano, tenga que entregarle este material a un médico.\n\nÚltimamente tengo pesadillas. Pesadillas de las que no puedo hablar con nadie. Cuando me duermo, alguien con mi mismo aspecto está sentada en el escritorio del despacho del Jefe del Comité de Disciplina. Yo observo esa escena desde la entrada del despacho, como una espectadora, mirando a alguien que no soy yo.\n\nEsa otra yo no dice nada. Durante los últimos tres días intenté entablar una conversación con ella. Le hablé, intenté arrebatarle los documentos que estaba leyendo, incluso una vez intenté golpearla en la cabeza. Pero no sirvió de nada.\n\nMis palabras se desvanecían sin alcanzarla, y mi violencia parecía incapaz de causarle daño alguno. En el instante en que mi mano tocaba su cuerpo, mis dedos lo atravesaban como si no existiera. ¿Qué demonios es esta cosa?\n\nHay algo que sí es seguro. Mi salud se está deteriorando seriamente, no, de una forma extremadamente grave."
 GEH.hina.story_event.1.a: "Sorasaki Hina."

 GEH.hina.story_event.2.t: "Baal"
 GEH.hina.story_event.2.desc: "El diario de hoy es un poco más especial. Aquella \"ella\" que nunca me había dirigido una sola palabra, hoy me habló por primera vez. Tal vez realmente me esté volviendo más loca que antes. Pero aun así, quizá sea mejor una alucinación con la que se pueda conversar que pasar toda la noche frente a una versión muda de mí misma.\n\nEsa mujer con mi rostro y mi voz se hace llamar \"Baal\". Dice ser mi doble personalidad, otra voluntad nacida de mi misterio. Su forma de hablar es tan rebuscada que (si digo que me recuerda a Seia, a quien conocí durante las negociaciones del Tratado del Edén, ¿será una falta de respeto hacia ella?) cuesta creer que realmente sea otra yo. Yo suelo usar frases mucho más sencillas.\n\nAun así, escribiré este diario partiendo de la premisa de que Baal no miente. Baal se compadeció de mí, diciendo que fui obligada por los fanáticos a ponerme la corona de un dictador, y comenzó a contarme muchas cosas.\n\nLos bastardos de mierda de Deutschland, y los fanáticos que fingen quererme mientras me utilizan para mantener su poder... Baal estaba tan llena de odio que resultaba difícil creer que fuera una parte de mí. Insultaba a los habitantes locales que debo proteger y a los miembros del Comité de Disciplina que confían en mí. Lo natural habría sido enfurecerme y salir corriendo de ese despacho.\n\nPero no pude hacerlo.\n\n¿Por qué? ¿Por qué fui incapaz de moverme hasta que terminó de hablar?\n\nOjalá no sea porque, en el fondo, creo que Baal tiene razón."
 GEH.hina.story_event.2.a: "Sorasaki Hina."

 GEH.hina.story_event.3.t: "¿El odio es realmente algo malo?"
 GEH.hina.story_event.3.desc: "\"Ah, Hina. Nos volvemos a encontrar hoy.\"\n\nEn el despacho del Comité de Disciplina de Gehenna, Baal está sentada en mi asiento, haciendo girar un bolígrafo entre sus dedos. Ver a alguien con mi rostro y mi voz nunca se vuelve algo normal, por más veces que ocurra.\n\nIncluso sabiendo que ella es mi otra personalidad.\n\n\"Así que este maldito sueño no piensa terminar. Bien, Baal, te preguntaré algo. Si tú eres yo... ¿por qué intentas hacer que odie a Gehenna y a Deutschland?\"\n\"Creo que tienes un pequeño malentendido. No intento hacer que odies a la gente de esta tierra. Tú ya los odias a todos desde hace tiempo.\"\n\nBaal sonrió de forma significativa.\n\n\"Yo soy tú. Y precisamente por eso no quería verte vivir como esclava de otros. El fanatismo de los devotos y el terrorismo de esos residuos nazis... lo has soportado todo con paciencia hasta ahora. Pero dime, ¿alguna vez alguien te lo agradeció? ¿Alguna vez alguien reconoció tu dolor y tu resistencia, diciéndote que hiciste un buen trabajo? Ni siquiera los altos mandos del Comité lo hicieron.\"\n\"Eso es...\"\n\"Admítelo, Hina. En este Comité, en esta Gehenna, la única persona cuerda eres tú. Todo lo demás está mal. ...Ya es hora de corregirlo.\""
 GEH.hina.story_event.3.a: "Me desperté."

 GEH.hina.story_event.4.t: "Estado de salud"
 GEH.hina.story_event.4.desc: "Sé perfectamente que no estoy en mis cabales. Tener una doble personalidad no deja de ser una enfermedad mental, ¿no? Aun así, no he sido capaz de contarle esto a los demás. Decir que es por mi deber de seguir gobernando Gehenna sería una mentira.\n\nLa verdad es que tengo miedo de lo que pasará después de revelar la verdad. Me aterra que la forma en la que los demás me miran cambie. Yo no soy Takanashi Hoshino. Los demás me ven como un superhumano perfecto, como el orden absoluto...\n\nPero soy débil.\n\nUna persona débil que siente miedo, ansiedad y se preocupa por la mirada ajena.\n\nAunque se descubra que soy así, ¿Acaso Ako, Chinatsu, Iori y los demás seguirán mirándome de la misma forma? No. Me despreciarán. ¿Cómo podría ser un cobarde la premisa absoluta de Gehenna, su gobernante supremo, Sorasaki Hina?"
 GEH.hina.story_event.4.a: "Me estoy hundiendo."

 GEH.hina.story_event.5.t: "Fiesta conmemorativa de la 3.ª Asamblea del Comité de Disciplina"
 GEH.hina.story_event.5.desc: "La unificación de Gehenna y la victoria del Comité de Disciplina deberían ser motivos de celebración. Que la gloria de [ROOT.GetNameDef] sea eterna. Bebí ese maldito vino blanco de Deutschland que los burócratas de Gehenna me ofrecieron y perdí el conocimiento en la fiesta conmemorativa de la tercera asamblea.\n\nBaal estaba allí.\n\nMientras yo perdía el conocimiento por culpa de ese maldito alcohol, Baal tomó control de mi cuerpo. En la fiesta pronuncié comentarios extremadamente inapropiados sobre los alemanes. Discutí con Ako y cometí la locura de estrellar una botella de vino contra el suelo.\n\n¿Cómo crees que me sentí al enterarme de todo eso por boca de terceros, una vez que todo había terminado? Miserable. Esto no fue una simple borrachera. Hay alguien más dentro de mí. Y ella me está diciendo que propague el odio. Sí. Definitivamente, no estoy en un estado mental normal."
 GEH.hina.story_event.5.a: "No soy precisamente una líder ejemplar."

 GEH.hina.story_event.6.t: "Consulta médica"
 GEH.hina.story_event.6.desc: "\"...Lo repito una vez más, normalmente no bebo alcohol. No soy alcohólica ni nada parecido.\"\n\nDespués de lanzar una botella de vino y discutir con Ako frente a numerosos altos mandos durante la fiesta de la tercera asamblea, me disculpé con ella una y otra vez de forma sincera. Aun así, el departamento médico sospechaba que podría estar sufriendo delirium por alcoholismo.\n\nChinatsu revisó una y otra vez los resultados del análisis de sangre, suspirando. Al menos pareció entender que no vivo empapada en alcohol. Aunque da la impresión de que descubrió otro secreto.\n\n\"He oído que suele quedarse trabajando hasta muy tarde... pero aun así, no debe recurrir a estimulantes extraños.\"\n\"...Un dictador tiene una carga de trabajo enorme. Incluso si intento repartirla, ni siquiera quienes deberían recibir ese poder quieren aceptar una división de autoridad.\"\n\"...Lo sé. Sí. Pero aun así, si no mejora su estado físico, sin duda esto empeorará.\""
 GEH.hina.story_event.6.a: "Chinatsu me entregó una larga receta."

 GEH.hina.story_event.7.t: "Un ambiente cambiante"
 GEH.hina.story_event.7.desc: "Haruno, miembro del Comité de Disciplina de Gehenna, comenzó a sentir que el ambiente dentro del Comité estaba cambiando gradualmente desde la última asamblea. Las voces de los fanáticos que afirmaban que Gehenna debía ser controlada por su \"gran líder\", Hina, se estaban volviendo cada vez más fuertes. Al principio, tras la Gran Transferencia, no eran más que un pequeño grupo de leales, pero después de la primera asamblea se transformaron en una facción enorme, y tras la segunda incluso comenzaron a patrullar Múnich con brazaletes personalizados y no oficiales.\n\n\"No entiendo por qué la jefa no hace nada con esos tipos y simplemente los deja actuar.\"\n\nHaruno suspiró mientras observaba, una vez más, el desfile de idiotas con brazaletes desde la ventana del edificio del Comité. Deseaba que esas marchas se volvieran menos frecuentes y desaparecieran, pero por alguna razón tenía el presentimiento de que eso no ocurriría. ¿Será Gehenna tomada por esos fanáticos?"
 GEH.hina.story_event.7.a: "Espero que no."

 GEH.hina.story_event.8.t: "Presupuesto para el compendio de citas de Sorasaki Hina"
 GEH.hina.story_event.8.desc: "Ako ama a Hina. Ama cada uno de sus gestos y aprecia cada una de sus palabras. Incluso verla balbucear incoherencias por el cansancio de noches enteras sin dormir le resultaba entrañable, y jamás se sintió humillada cuando Hina la reprendía con frialdad. Sin embargo...\n\n\"Presupuesto para la compilación de citas de Sorasaki Hina... esto no es normal.\"\n\nLa exigencia de los fanáticos de grabar obsesivamente cada palabra de Hina y publicar un supuesto \"libro de citas\" era absurda. ¿De verdad estas personas respetan a Hina? ¿O solo quieren convertir sus palabras en un arma?\n\nGracias a su aguda perspicacia (y su grave paranoia), Ako logró analizar la verdadera intención oculta tras ese libro. Crear un compendio ambiguo de \"citas de Hina\" para imponer restricciones que no existen en la ley de Gehenna. Interpretar esas citas de forma arbitraria para definir comportamientos \"ilegales\" o \"contrarios al orden de Gehenna\" y reprimir a los opositores.\n\nPensemos en un ejemplo. Ako recordó cuando Hina dijo: \"No me gustan las cosas molestas\". ¿Qué significa exactamente \"molestas\"? Es imposible saberlo sin contexto. Pero los fanáticos podrían interpretarlo a su conveniencia y crear una norma consuetudinaria por encima de la ley: \"Esta acción es un crimen porque molesta a la jefa Hina\".\n\n\"Haah... y aun así tengo que elevar este documento demente.\"\n\nAko quería romper el presupuesto en pedazos, pero la decisión final recaía en Hina. Y Ako sabía que Hina no lo rechazaría.\n\nÚltimamente Hina estaba mentalmente acorralada. El apoyo fanático de los devotos la oprimía con la obsesión de tener que convertirse en una líder digna de esa adoración. ¿Ignorar el fervor de los fanáticos? Imposible. Ako sabía que este era un camino equivocado, pero no lograba encontrar una salida."
 GEH.hina.story_event.8.a: "Jamás imaginé que acabaría así después de la asamblea..."

 GEH.hina.story_event.9.t: "La presión de los fanáticos"
 GEH.hina.story_event.9.desc: "Dentro de [GEH.GetNameDef] existen cuatro departamentos oficiales: el Departamento de Planificación, encargado de tareas administrativas; el Departamento de Ejecución, a cargo del trabajo de campo; el Departamento Médico; y el Departamento de Inteligencia. Los autodenominados fanáticos están dispersos dentro de estos cuatro departamentos.\n\nNo existe un departamento independiente llamado \"fanáticos\"; más bien, se trata de una facción que cree que \"los demás mandos son imperfectos en comparación con el gran líder, y por lo tanto el poder debe concentrarse en [ROOT.GetLeader]\".\n\nY el hecho de que estos fanáticos hayan formado una facción interna significa que quienes no pertenecen a ella han comenzado a sufrir discriminación real. Los fanáticos se \"ayudan mutuamente\" y expanden cada vez más su influencia.\n\nPara Iori, que detesta los problemas de facciones, esta situación era particularmente desagradable.\n\n\"¿Facciones? Qué estupidez. ¿No se supone que en Gehenna se asciende por mérito y competencia justa?\"\n\nUn mando intermedio del Departamento de Ejecución bajó la cabeza frente a Iori.\n\n\"Eso sería lo correcto, sí. Pero dicen que sin ese tipo de apoyos es difícil ascender.\"\n\"Haah... si esto fuera una organización visible, ya la habría hecho pedazos. Pero como no hay listas ni nada parecido, no hay mucho que hacer.\"\n\"¿Entonces piensa ignorarlo?\"\n\"¡No quiero ignorarlo! ...Si surge la oportunidad, algún día los barreré a todos. Si consigo la ocasión...\""
 GEH.hina.story_event.9.a: "¿Cuándo llegará esa oportunidad?"

 GEH.hina.story_event.10.t: "Uníos, ciudadanos de Gehenna"
 GEH.hina.story_event.10.desc: "Chisato, miembro fanático del Comité de Disciplina y dirigente de la asociación civil Alianza Gehenna Libre, subió al estrado preparado y observó con orgullo a los ciudadanos de Gehenna. Numerosos patriotas agitaban la bandera de Gehenna mientras miraban a Chisato. Con tantos patriotas reunidos, el futuro de Gehenna sin duda sería más brillante que nunca.\n\nChisato tomó el micrófono.\n\n\"Ciudadanos de Gehenna. Ahora es más que nunca el momento de unirnos. Los antipatriotas traidores siguen intentando vender Gehenna a potencias enemigas, y la amenaza de la Sociedad Pandemonium aún persiste. Bajo el liderazgo de [ROOT.GetLeader], debemos unir todas nuestras fuerzas para reprimir a los elementos antiestatales y asegurar la prosperidad eterna de nuestra patria.\"\n\nMientras continuaba con su largo discurso, Chisato levantó la vista. Miles de ciudadanos agitaban banderas de Gehenna, llenando por completo la avenida. Con tantos patriotas, el futuro de Gehenna parecía brillante. Y además, las finanzas de las asociaciones patrióticas que surgían como hongos después de la lluvia también se verían fortalecidas.\n\n\"...Para el éxito de nuestra Alianza Gehenna Libre y para castigar a nazis fascistas y comunistas, necesitamos una gran cantidad de fondos. Las donaciones pueden realizarse mediante transferencia bancaria o banca móvil...\""
 GEH.hina.story_event.10.a: "Los patriotas se congregan"

 GEH.hina.story_event.11.t: "Hina, diosa de la guerra"
 GEH.hina.story_event.11.desc: "Chinatsu admira y respeta a Sorasaki Hina. Es difícil que llegue a ocurrir algo como que empiece a desagradarle Hina. Sin embargo, no le gustaban demasiado las personas que seguían a Hina.\n\n\"Un hospital debería ser el lugar más tranquilo y estable. Para los pacientes también es importante descansar en un ambiente sereno. Pero... ¿de verdad hay algún motivo por el que tengan que pegar estos pósters en las habitaciones?\"\n\nChinatsu, de pie frente a una dirigente fanática dentro del Departamento Médico, agitó en el aire el póster que sostenía. Era un póster que decía \"Sorasaki Hina, diosa de la guerra\". En él, Hina aparece dibujada de forma exagerada: desplegando alas negras, elevándose hacia el cielo y prendiendo fuego la tierra.\n\nEl mensaje del anuncio era simple: exaltar la grandeza de Hina e incitar a alistarse en el ejército que obedece las enseñanzas de una líder tan grandiosa. Que exista propaganda de reclutamiento es algo que podría entenderse. Pero ¿de verdad había que pegarla incluso en el hospital?\n\nAun así, la fanática del Departamento Médico respondió como si nada.\n\n\"Los pacientes están acostados y no pueden ir a ningún lado. Así, si pegamos el póster en la habitación, la gente lo verá durante más tiempo. Es una colocación científica.\"\n\"Pero médicamente no creo que ayude a la estabilidad de los pacientes.\"\n\"¿No es natural que la lealtad a la patria y el fervor hacia Lady Hina estén por encima de la medicina?\"\n\nIndignada, Chinatsu sintió un impulso de estamparle el póster en la cara. Incluso ella, que suele ser tranquila, notaba que al hablar con los fanáticos sus emociones se iban... encendiendo cada vez más. Pero no había alternativa. Las figuras importantes del Departamento Médico ya se habían convertido todas en fanáticas. Ni siquiera Chinatsu, que supervisaba el departamento, podía ignorar la opinión de la mayoría.\n\nSuspirando, Chinatsu le devolvió el póster."
 GEH.hina.story_event.11.a: "\"Al menos repártanlos solo en las habitaciones de pacientes leves.\""

 GEH.hina.story_event.12.t: "Un país para una sola persona"
 GEH.hina.story_event.12.desc: "Sorasaki Hina no quería convertirse en una dictadora. No tenía ambición de poder; de hecho, desde el punto de inflexión del \"Tratado del Edén\" deseaba dejar su puesto y renunciar. Pero la Gran Transferencia paralizó todas las alternativas que podían proteger el orden de Gehenna en lugar de la ETO, y en medio del caos posterior, los fanáticos comenzaron a idolatrar a Sorasaki Hina, convencidos de que ella aplastaría todo desorden.\n\nAunque Hina no tenía ningún deseo de poder, sintió cómo el poder se concentraba a la fuerza a su alrededor. Quería apartar el fervor de los fanáticos. Pero la asfixiaban dos cosas: el sentimiento de no querer traicionar el apoyo y el entusiasmo de los demás, y la realidad de que, con todas las \"alternativas\" derrumbadas (incluida la ETO), debía resolver el conflicto con Trinity y con la Sociedad Pandemonium.\n\nAl final, Hina no tuvo más remedio que aceptar la corona del poder. Era la elección de las masas, el apoyo de los fanáticos. Sin poder ser un estoico, la obligaban a ser un rey estoico. En un despacho donde no quedaba nadie, con los vítores de los lunáticos al otro lado de la ventana, Hina permanecía de pie, completamente sola."
 GEH.hina.story_event.12.a: "Entre más seguidores que nadie, la más solitaria."

 GEH.hina.story_event.13.t: "Aclamen el apoyo de las masas"
 GEH.hina.story_event.13.desc: "Hina estaba agotándose cada vez más por el sistema de dictadura unipersonal, y también sentía repulsión ante las exigencias constantes de los fanáticos. ¿De verdad les gustaba Sorasaki Hina? ¿O solo apoyaban al ficticio rey estoico que Hina simbolizaba? Si era así, entonces les daría exactamente lo que querían. Si querían un rey estoico imaginario, lo tendrían.\n\nHina empezó a sellar mecánicamente todos los documentos que los fanáticos le presentaban. Ni siquiera los leía. Les daba todo lo que \"querían\". Con eso, Hina podía aplicar las políticas que las masas deseaban, y los fanáticos le agradecerían el ser reconocidos por ella.\n\nPor supuesto, es una estupidez. Ella lo sabía. Hina sabía que esto era una locura. Pero... Sorasaki Hina no podía cortar con aquellos fanáticos, ni tampoco podía dejarse arrastrar por completo por su fanatismo. Lo único que podía hacer, en medio de esta ola de demencia, era mantener el apoyo de las masas. Ese era su límite."
 GEH.hina.story_event.13.a: "Asqueroso."

 GEH.hina.story_event.14.t: "La victoria de las grandes masas"
 GEH.hina.story_event.14.desc: "La reunificación de Gehenna se logró, y también fue un acontecimiento que simbolizaba el éxito de la ideología populista de los fanáticos que seguían a [ROOT.GetLeader]. [ROOT.GetLeader] guio la voluntad de las masas y permitió que Gehenna volviera a convertirse en un gran país. Estallaron vítores en las calles, y durante la tercera asamblea se celebraron innumerables consignas patrióticas y actos conmemorativos.\n\nSin embargo, no todos los geennanos apoyaban estos cambios.\n\nEl mayor problema fue que los locales de Deutschland empezaron a creer cada vez más que el nuevo régimen se estaba convirtiendo en un Estado fascista similar al régimen nazi de 1933. Los partidos locales, el Partido Socialdemócrata y el Partido Popular de Baviera, afirmaron que \"el Estado se está fascistizando\" y trataron de organizar protestas callejeras para obstaculizar la tercera asamblea, pero fueron dispersados por la fuerza. Los comunistas, soñando con el colapso del régimen de [ROOT.GetLeader], intensificaron atentados con bombas aún más violentos. Durante el periodo de la tercera asamblea, la resistencia local ardió como una última llama.\n\nPero esa gran llama era demasiado pequeña para incendiar Gehenna, y el nuevo gobierno geennano ya poseía un poder demasiado sólido. Las protestas de socialdemócratas y conservadores fueron reprimidas y no pudieron celebrarse de nuevo. Los comunistas fueron arrestados. La vida cotidiana regresó a Gehenna, como siempre. Aunque ese \"día a día\" de [ROOT.GetName] se estuviera tiñendo de un gris oscuro y apagado."
 GEH.hina.story_event.14.a: "La república resistirá."

 GEH.hina.story_event.15.t: "Emisión de victoria de los fanáticos"
 GEH.hina.story_event.15.desc: "La reunificación de Gehenna, y la caída de Trinity, se han convertido en un suceso simbólico que ha dado a conocer ampliamente la grandeza de [ROOT.GetLeader] a todo Kivotos. Hemos llegado hasta aquí gracias al liderazgo de nuestro gran dirigente, y nuestra república nunca volverá a temer a enemigos externos.\n\n¡Larga vida a [ROOT.GetLeader], la nueva presidenta de la Sociedad Pandemonium de Gehenna y eterna líder de la república! ¡Nuestra victoria será recordada para siempre!\n\nPara conmemorar nuestra gran victoria, el cumpleaños de la presidenta Sorasaki Hina será designado como día festivo nacional, y su casa natal, así como las aulas de primaria, secundaria y preparatoria a las que asistió durante su crecimiento, serán preservadas para siempre como patrimonio cultural.\n\nBajo las enseñanzas de nuestra gran presidenta, Gehenna seguirá prosperando."
 GEH.hina.story_event.15.a: "Hina apagó la radio."

 GEH.hina.story_event.16.t: "Reforma económica"
 GEH.hina.story_event.16.desc: "La nueva propuesta de reforma económica de Gehenna quedó organizada en documentos. Sin siquiera mirarlos, Hina volvió a firmar su aprobación. Para Hina, la economía, la política y la sociedad de Gehenna... todo se había convertido en algo que ya daba igual. Ella no era más que la \"voluntad de las masas\". Lo que deseaban las masas era lo que deseaba Hina. No había lugar para su pensamiento o juicio personal.\n\nTras pasar por la cuarta asamblea, en la que no tuvo ni una sola oportunidad de hablar y solo pudo aplaudir sin parar, Hina comprendió que los fanáticos no la servían a ella... sino que ella había terminado sirviendo a los fanáticos."
 GEH.hina.story_event.16.a: "Gehenna debió haber perecido."

 GEH.hina.story_event.17.t: "Constitución del Gran Estado de Gehenna"
 GEH.hina.story_event.17.desc: "Sorasaki Hina odia a Gehenna. No era una broma ni una expresión de autodesprecio. Ella sabía que había sido arrastrada impotente por la locura de los fanáticos, y que dentro de esa locura renunció a soltar el poder, degradándose hasta convertirse en su marioneta: un símbolo ambulante de propaganda que representaba la \"voluntad de las masas\".\n\nCon uniforme, Hina entró al parlamento de la Sociedad Pandemonium. Pero su mente estaba en otro lugar: las calles del distrito autónomo de Gehenna, antes de la Gran Transferencia, cuando todo era normal. No existía esta locura, ni los psicópatas llamados fanáticos de Sorasaki Hina, ni ella misma convertida en símbolo del fascismo.\n\n\"Presidenta Hina.\" \n\"No me llames presidenta. Me dan ganas de vomitar.\" \n\nAntes de subir al estrado, Hina le habló ásperamente a Ako por inercia... y luego bajó la cabeza con amargura.\n\n\"No. Perdón. ...No es culpa tuya.\" \n\"No, es culpa mía. No pude asistirla bien, y no hice nada para evitar que esta locura llegara tan lejos...\" \n\nHina miró a Ako. La culpa era enteramente suya. Tuvo miedo de enfrentarse de frente a la locura de las masas. Y por eso permaneció hasta ahora como marioneta, como simple símbolo de la voluntad popular.\n\nEn lugar de llamarla cobarde, Ako se culpó a sí misma. No. Ako no había hecho nada malo.\n\nHina abrazó con fuerza a Ako y habló en voz baja: No. Tú no hiciste nada mal. Esto es todo mi pecado. Un pecado que debo cargar yo.\n\nHina se separó lentamente de Ako y subió al estrado. La promulgación de una nueva constitución que la declararía eterna líder y dictadora absoluta.\n\nSintiendo como si se colocara una soga al cuello, Hina habló con una voz hundida y fría."
 GEH.hina.story_event.17.a: "Se promulga la presente Constitución."

 GEH.hina.story_event.18.t: "Partido Juvenil de Gehenna"
 GEH.hina.story_event.18.desc: "\"¿El Partido Juvenil de Gehenna?\"\n\nIori, pasando el periódico, lo dijo con fastidio.\n\n\"¿Qué es esto? ¿Lo hizo Ako-chan?\"\n\"...Cómo va a ser. Esos fanáticos lo organizaron por su cuenta. Ahora que Gehenna se ha convertido en un Estado de verdad, dicen que gobernarán Gehenna no como una simple facción, sino como un partido político organizado...\"\n\"Qué flojera. Yo no entiendo esas cosas complicadas. Entonces basta con entender que es como un basurero donde juntan a los fanáticos, ¿no?\"\n\"Sí. Bueno... un basurero.\" \n\nAko pensó que la palabra \"basurero\" era la que mejor les quedaba. Después de la cuarta asamblea, los fanáticos de Gehenna, que antes estaban fragmentados por departamentos, comenzaron a organizarse bajo el nombre de \"Partido Juvenil de Gehenna\".\n\nOrganizarse como partido tenía varias ventajas: podían atraer al partido a empresarios comunes de fuera del Comité de Disciplina, expandiendo aún más su influencia. Además, un partido organizado les daba más sentido de pertenencia que una facción intangible y ayudaba a establecer una jerarquía interna.\n\nEl Partido Juvenil de Gehenna, un partido populista, ya desde su fundación estaba creando filiales regionales por todo Gehenna y expandiendo su influencia entre las masas. Sin una ideología concreta, el Partido Juvenil, que afirmaba seguir el \"espíritu de Sorasaki Hina\", probablemente impulsaría diversas políticas populistas en el futuro.\n\nPor supuesto, la voluntad de Hina no estaba allí. Ako recordó que Hina ni siquiera pertenecía a ese partido. Para el Partido Juvenil de Gehenna, Hina no era más que un símbolo.\n\nDicen adorar a Hina con fervor, pero son quienes más la desprecian. Ako sintió un leve mareo de náusea."
 GEH.hina.story_event.18.a: "Pero Ako no puede hacer nada."

 GEH.hina.story_event.19.t: "¡Sonríe! - 1"
 GEH.hina.story_event.19.desc: "\"Será una fotografía que quedará en la historia de nuestra gran patria, presidenta Hina. Mire a la cámara y sonría.\"\n\nOyendo la voz nauseabunda del fanático, Hina se plantó frente a la cámara. En un arrebato, le dieron ganas de empuñar con ambas manos el \"Destructor del Fin\" y vaciarle una ráfaga a la cara de esa mujer que sonreía. Pero se contuvo. Hina se estaba acostumbrando bastante a la vida de marioneta.\n\n¡Clic! Se tomó una nueva foto \"digna\" de Hina que colgarían en el edificio del parlamento de Gehenna.\n\nAl terminar la sesión, Hina vomitó una y otra vez en el baño del parlamento. Le brotaron lágrimas y sintió el estómago revolverse, con los ojos ardiéndole.\n\nGehenna ya no era el país que ella quería proteger. Hina era la marioneta de los fanáticos, y la arrastraban a todo tipo de ceremonias para actuar con una sonrisa como la \"gran líder de Gehenna\".\n\n¿Liderar qué, exactamente? Si al final quienes traen los papeles que debe firmar es ese nauseabundo \"Partido Juvenil de Gehenna\".\n\nAl salir tras enjuagarse la boca, Hina sintió un ligero mareo. Debería haber tomado el poder con sus propias manos. No quería ser dictadora. No debió elegir convertirse en figura decorativa de los fanáticos por una razón tan blanda.\n\nSi hubiera elegido el camino de convertirse en el \"Emperador del Trueno\", podría haber despedazado a todos esos fanáticos.\n\nNo. Hina odiaba pensar así.\n\n¿Una dictadora embriagada de poder? ¿En qué se diferencia eso de Hanuma Makoto? Mejor ser una marioneta.\n\nNo. ¿De verdad crees que lo que eres ahora es mejor que \"Hanuma Makoto\"? Eso es puro autoengaño."
 GEH.hina.story_event.19.a: "Dos ideas, al mismo tiempo, atormentaban a Hina."

 GEH.hina.story_event.20.t: "¡Sonríe! - 2"
 GEH.hina.story_event.20.desc: "\"Gran patria, gran Gehenna, y la no tan grandiosa Sorasaki Hina.\"\n\nHina recordó su misterio: Ish-bosheth. Es una palabra que también existe en la Tierra. Dicen que para degradar el nombre Eshbaal (Eshbaal: \"hombre de Dios\"), lo cambiaron a Ishbosheth (\"hombre vergonzoso\"). Vergonzoso... esa palabra encajaba a la perfección. Hina se avergonzaba de sí misma.\n\nAhora que se había convertido en la dictadora más poderosa de Kivotos. Y ahora que ese enorme poder estaba en manos del Partido Juvenil de Gehenna.\n\nHina giró la cabeza y miró a Amau Ako, que dirigía fuerzas policiales fuera del parlamento. Ako se veía cada vez más agotada últimamente. Con todo el poder real arrebatado por el Partido Juvenil de Gehenna, incluso Ako—la amiga que Hina más valoraba—había quedado reducida a una simple burócrata intermedia.\n\nAko seguía apareciendo como figura decorativa en actos diplomáticos, pero ya no tenía poder de decisión real. El Departamento de Planificación también estaba completamente dominado por la influencia del Partido.\n\n¿Y el Departamento de Ejecución? Ni siquiera recordaba cuándo fue la última vez que vio a Iori. Bajo la política de \"control civil\" del gran Partido Juvenil de Gehenna, las fuerzas armadas se debilitaban sin cesar y morían en silencio bajo la vigilancia del partido.\n\n¿El Departamento Médico? Ni hablar. Siempre fue el que menos poder tuvo.\n\nElla solo quería proteger el orden de Gehenna. Al principio incluso pensó que el fervor de los fanáticos era necesario para sostener el orden. Pero estaba equivocada. Hina fracasó.\n\nGehenna quizá perdure eternamente. Pero mira a quienes son reprimidos bajo este régimen dictatorial de fanáticos.\n\n¿Era este el hermoso \"orden\" que Sorasaki Hina había deseado?"
 GEH.hina.story_event.20.a: "Hina vio, a través de la ventana del parlamento, cómo una protesta de locales hambrientos era reprimida con dureza."

 GEH.hina.story_event.21.t: "¡Sonríe! - 3"
 GEH.hina.story_event.21.desc: "\"Ako. ¿Qué pasaría si dejo una carta de renuncia y desaparezco?\"\n\"...No diga eso, jefa Hina. Si usted desaparece, ¿qué se supone que haga yo?\"\n\"...Lo sé. ¿A dónde me iría dejándote sola?\"\n\nHina sacó un dardo y, con una sonrisa cínica, lo lanzó hacia la bandera de Gehenna en su despacho. El dardo atravesó la tela con precisión y se quedó clavado. Uno, dos, tres. Una y otra vez, los dardos de Hina empezaron a desgarrar la bandera de Gehenna. Si esa bandera que se rompía fuera real, habría sido aún más hermoso.\n\n\"Pero algún día llegará el momento en que toque mi límite.\"\n\"...Lo sé.\" \n\"Ahora creo que, vaya donde vaya, los fanáticos me encontrarán. Hay CCTV por todas partes, en el despacho y cerca de mi casa. Aunque vuele por el cielo, alguna cámara me captará.\"\n\"...Sí. Eso parece.\" \n\"Así que, Ako... la única dirección en la que quizá pueda huir de esta prisión llamada Gehenna será una sola. Abajo. Hacia el infierno.\" \n\"Jefa... eso que está diciendo...\" \n\nHina recogió el último dardo caído al suelo y lo miró con amargura.\n\n\"Ako. Si llega el día en que decida quitarme la vida, ese día... ¿podrías estar a mi lado? Conmigo...\" \n\"Jefa.\" \n\nAko interrumpió a Hina. Sus labios se movieron como si fuera a decir algo, pero al final Ako asintió.\n\n\"¿A dónde podría ir yo abandonándola a usted?\"\n\nAlgún día llegará. Hoy no, pero algún día. Y cuando ese día llegue... yo podré ser libre."
 GEH.hina.story_event.21.a: "Los odio."

 GEH.hina.story_event.22.t: "Sistema Panóptico"
 GEH.hina.story_event.22.desc: "Hans avanzó hacia el interior de las instalaciones de vigilancia industrial sistematizada de Gehenna. Con cada paso que daba, un reflector de luz blanca le señalaba el camino que debía seguir.\n\nLo único que Hans podía ver era el camino que conducía a la cinta transportadora asignada para él. Para el gobierno de Gehenna, todos los alemanes eran criminales en potencia. Y no querían revelar demasiada información a los criminales en potencia.\n\n\"Ustedes son seres odiados. Deben esforzarse por lavar sus pecados aquí y renacer.\"\n\nLa radio del Panóptico inició una emisión pregrabada. La fábrica estaba formada en un círculo casi perfecto. El vigilante de Gehenna estaba en el centro del círculo, en un mecanismo de retransmisión desde el cual podía observarlo todo.\n\nEl lugar del vigilante brillaba con una luz intensa; cada vez que Hans lo miraba siquiera por error, sentía como si le ardieran los ojos. No sabíamos hacia dónde miraba el vigilante, pero el vigilante lo sabía todo: dónde estábamos y qué hacíamos.\n\n\"Hans Meyer. Mueva las manos más rápido. Cumpla la cuota de hoy.\"\n\nMientras ensamblaba piezas de radio con las manos, una voz atronadora resonó sobre su cabeza. Al parecer, el que estaba siendo observado en ese momento era él.\n\nNo. Esa forma de decirlo no sería correcta. Aquí no había nadie que no estuviera siendo vigilado.\n\nHans intentó matar sus emociones y siguió moviendo las manos."
 GEH.hina.story_event.22.a: "Somos culpables."

 GEH.hina.story_event.23.t: "Ustedes no existen"
 GEH.hina.story_event.23.desc: "Para Mijaíl, la preparatoria era un lugar contradictorio. Al entrar a la Preparatoria Pública del Distrito 21, debía pisar desde el casillero una alfombrilla con los colores negro-rojo-oro.\n\n¿Cómo podría no darse cuenta de que era un acto para humillar a Deutschland? Pero en cuanto entraba al aula, los geennanos cambiaban de estrategia. Deutschland no era un objeto de humillación: era un concepto que ni siquiera había existido jamás.\n\nUn profesor robot, un autómata de expresión aparentemente vacía, les decía a los estudiantes alemanes—guardados en el aula como prisioneros—lo mismo cada día:\n\nUstedes no existen.\nDeutschland no existió *antes*.\nUstedes crecerán como mobiliario al servicio de la gran patria-dios.\n\nSi Deutschland no existe, entonces ¿por qué le repiten a Mijaíl ese \"ritual\" de obligarlo a pisar la bandera de Deutschland? ¿Es posible pisar algo que no existe?\n\nEntonces, ¿qué fue aquello que Mijaíl acababa de pisar al entrar?"
 GEH.hina.story_event.23.a: "¿Que niegue mi existencia?"

 GEH.hina.story_event.24.t: "La verdad por encima de la razón"
 GEH.hina.story_event.24.desc: "\"Si Dios no existe, entonces créenlo, dijo Voltaire. Ustedes sí que siguen bien sus enseñanzas.\"\n\nCarl Jung habló con sarcasmo y fulminó con la mirada al interrogador al otro lado de la sala. El interrogador, con gafas de sol incluso en interiores, se limitaba a observar a Jung con una expresión ilegible, como si quisiera ver hasta dónde pensaba hablar solo.\n\nSi no tenía intención de moverse, Jung pensaba hablar aún más a placer. Se inclinó ligeramente hacia adelante.\n\n\"Sí. Soy un delincuente de pensamiento, como dicen ustedes. Pero ¿no fueron ustedes los que se equivocaron primero al obligar a insertar en todos los métodos de investigación frases como 'según la instrucción del venerado dirigente'? ¿Su gran líder, la señora Hina, quiere tanto que los académicos la adoren?\n\nSi el señor Freud estuviera vivo, diría esto: 'Ella sigue atrapada en una etapa infantil, como un niño de cinco años que busca el elogio de sus padres.'\"\n\n\"Última oportunidad. Escriba su declaración de arrepentimiento... o diga algo aún más insultante.\"\n\n\"Qué amable que me dé más oportunidades.\" \n\nJung tomó la declaración de arrepentimiento y la rompió con las manos frente al interrogador.\n\n\"Esa es mi respuesta. Vete a la mierda.\""
 GEH.hina.story_event.24.a: "Cuando el interrogador hizo un gesto con la mano, los especialistas en tortura se llevaron a Jung."

 GEH.hina.story_event.25.t: "Un futuro confiscado"
 GEH.hina.story_event.25.desc: "Heinrich Kafka vivía días de ansiedad desde que las autoridades de Gehenna \"confiscaron\" a sus cuatro hijos.\n\nSegún la nueva ley de Gehenna, todos los niños alemanes debían ser separados de sus padres y, desde los 3 hasta los 18 años, criarse colectivamente en nuevas instalaciones de internado.\n\nHeinrich se sentó frente a Ulrich, el cantinero, y pidió una cerveza con una voz apagada. Ulrich sirvió una jarra de cerveza de barril y dijo con una voz mezclada de desprecio y dolor:\n\n\"Ahora en Múnich, Berlín, Frankfurt... en ninguna parte se oye ya la voz de un niño. Las autoridades los han encerrado a todos en orfanatos.\" \n\"Esos niños son nuestros. ¿Con qué derecho le arrebatan los hijos a un padre?\" \n\nUlrich, aunque estaba de acuerdo, respondió con una voz impotente:\n\n\"El derecho del vencedor, supongo. Quieren que nuestros hijos jamás vuelvan a tener identidad alemana. A este paso, antes de que pase siquiera una generación...\" \n\"Nuestro pueblo desaparecerá.\" \n\nHeinrich recibió la cerveza y suspiró.\n\n\"No. El pueblo no importa. Lo que temo es que, cuando mis hijos me vuelvan a ver, ni siquiera puedan reconocer quién soy.\" \n\"A mí me pasa igual.\""
 GEH.hina.story_event.25.a: "Los dos lloraron hasta que se hizo tarde aquel día."

 GEH.hina.story_event.26.t: "Por uno solo"
 GEH.hina.story_event.26.desc: "Bajo la bandera de la gran Gehenna,\n\njuro que por la patria y por el gran dirigente\nserviré entregando todo, incluso mi cuerpo y mi alma.\n\nSuperando el concepto decadente del individuo,\ncomo una de las incontables piezas que componen la patria,\njuro que cumpliré lealmente mi fidelidad con felicidad."
 GEH.hina.story_event.26.a: "Juramento ciudadano completado."

 GEH.hina.story_event.27.t: "Hay que resistir"
 GEH.hina.story_event.27.desc: "\"Haah, haah.\"\n\nAl despertar, Hina sintió la desagradable sensación de tener la espalda empapada en sudor.\n\nÚltimamente, los susurros de Baal y los síntomas de doble personalidad se estaban \"aliviando\" poco a poco. Cada vez eran menos las veces que Baal se le acercaba para hablar.\n\nPero Hina sentía una extraña sensación de que incluso su propia conciencia se estaba \"volviendo borrosa\".\n\nLa conciencia de Baal y la suya se estaban integrando en una sola.\n\nNo sabía si una doble personalidad se curaba de esa manera.\n\nY aunque esa horrible voluntad de Baal se estuviera desvaneciendo, Hina no se sentía especialmente feliz.\n\nSi de verdad ambas personalidades se fusionaban...\n\n¿Quién tomaría el control?\n\n¿La personalidad de Sorasaki Hina?\n\n¿O la personalidad de \"Baal\"?"
 GEH.hina.story_event.27.a: "\"Aunque sea... debería beber agua.\""

 GEH.hina.story_event.28.t: "¿Contra qué se resiste?"
 GEH.hina.story_event.28.desc: "De madrugada, Ako se acercó a Hina, que cabeceaba en su despacho. Había pasado a ver cómo estaba durante su jornada nocturna y, como esperaba, Hina asentía con la cabeza en un estado entre sueño y vigilia.\n\n'Jefa... así no puede seguir...'\n\nCon el aumento de la carga de trabajo, el peso sobre Hina también había crecido bastante. Y últimamente, Hina tampoco dormía bien en casa.\n\nAko miró con preocupación a Hina, que parecía estar teniendo pesadillas, sudando frío en la frente.\n\n\"...¿Ya es de mañana?\"\n\nLos ojos de Hina se abrieron de golpe. Pero su mirada, como si observara el vacío en lugar de a ella... por alguna razón inquietó a Ako. Como si la Sorasaki Hina frente a sus ojos se hubiera convertido en otra persona en una sola noche.\n\nAunque sabía que era imposible, Ako sintió cómo se le humedecían las palmas.\n\nNo. Hina siempre era su Hina. ¿Qué tontería es esa de convertirse en otra persona?\n\n\"No. Aún es de madrugada.\" \n\"...Ya veo, madrugada. Pero para mí se siente como una mañana nueva.\" \n\nHina sonrió levemente y se levantó.\n\n\"La Sorasaki Hina débil... acaba de morir.\" \n\"...¿Qué?\" \n\"No es nada. Solo... algo que yo entiendo.\""
 GEH.hina.story_event.28.a: "Hina sonrió de forma significativa."

 GEH.hina.story_event.29.t: "Escalofrío"
 GEH.hina.story_event.29.desc: "Desde aquella conversación de madrugada, de algún modo Hina parece más sana últimamente. Su fatiga crónica desapareció y trata a los demás miembros del Comité con mucha más calidez.\n\nPero Ako sentía una inquietud: Hina no estaba en un estado *normal*.\n\nAlguien como ella, que no pegaba en absoluto con el lujo, empezó a comprar joyas y ropa cara. Cada vez aparecían vinos más caros en su mesa.\n\nY lo más decisivo: cambió la manera de referirse a los locales. Ya no los llamaba \"personas\" (명), sino \"cabezas\" (마리), como si fueran animales.\n\nEn un restaurante del distrito central de Gehenna, mientras cortaba un filete poco hecho, Hina miró a Ako frente a ella.\n\n\"¿Pasa algo, Ako?\"\n\"No... es solo que... jamás imaginé que usted me invitaría primero a un restaurante así...\"\n\"Solo piénsalo como una cita. Estas oportunidades no llegan tan fácil, ¿no?\"\n\"¡¿C-ci-cita...?!\"\n\nAl ver a Ako ruborizada, Hina soltó una pequeña risa.\n\n\"Además, últimamente estoy de buen humor. Estoy ideando una solución limpia... una que la Hina de antes no habría aprobado... para eliminar miles, decenas de miles de 'impurezas' de Gehenna.\" \n\nLa emoción que a Ako le había acelerado el corazón por la idea de una cita con la amada Hina se enfrió en un instante con esa sola frase.\n\n\"¿Una solución... limpia?\" \n\"Planeo provocar intencionalmente la rebelión de las impurezas. En cuanto esas cosas que se oponen a Gehenna asomen la cabeza, las sacrificamos a todas. Si todas mueren, ¿quién podría resistirse a nuestro dominio?\""
 GEH.hina.story_event.29.a: "Jefa, pero... ¿cómo se 'sacrifica' a una persona?"

 GEH.hina.story_event.30.t: "Alianza Partido Comunista–Partido Nazi"
 GEH.hina.story_event.30.desc: "Cuando Eva Braun, amante de Adolf Hitler, entró en la reunión clandestina del Partido Comunista, los militantes no la abuchearon: estallaron en vítores.\n\nMientras Braun subía al estrado subterráneo, húmedo y cubierto de polvo, vio a comunistas cansados y heridos. Ellos eran enemigos de Hitler, pero Braun no sintió hostilidad hacia los comunistas, sino camaradería. En el fondo de esta Gehenna, todos eran solo bestias esperando ser sacrificadas.\n\n\"Estimados ciudadanos y camaradas. Yo no soy política. No sé de política, ni conozco la diferencia entre el nacionalsocialismo y el socialismo en un solo país. Pero lo importante es esto... nos estamos convirtiendo en esclavos bajo la opresión de Gehenna.\" \n\nAunque no había escrito su discurso de antemano, Eva habló con pasión ante los supervivientes del NSDAP tras la \"Gran Transferencia\", incluido Albert Speer, y ante los miembros del Partido Comunista de Deutschland.\n\n\"Después de expulsar a Gehenna, ustedes y el Partido Nacionalsocialista Obrero Alemán volverán a ser enemigos. Pero... al menos lucharemos de humano a humano. Gehenna, en cambio, ni siquiera nos ve como humanos.\n\nNos arrebataron a nuestros hijos. Nuestros trabajadores están trabajando en condiciones parecidas a campos de concentración.\" \n\nEl Panóptico, la nueva 'educación de exterminio' de Gehenna... los comunistas apretaron con fuerza los puños ante las palabras de Eva.\n\nIra. Hermandad.\n\nEsas emociones resonaron como si vibraran entre comunistas y fascistas.\n\nY, como si reventara ese sentimiento, Braun dijo:"
 GEH.hina.story_event.30.a: "\"No seremos esclavos. Lucharemos juntos... ¡y recuperaremos la libertad!\""
 GEH.hina.story_event.31.t: "Luchador por la libertad"
 GEH.hina.story_event.31.desc: "Albert Speer no se consideraba un liberal ni un revolucionario. Para él, su ideología era algo que trascendía ambas cosas. La amistad con su viejo amigo, Adolf Hitler.\n\n\"Gehenna debe colapsar. Para que esta tierra de Deutschland sea gobernada por los alemanes.\"\n\nSpeer le encendió personalmente el cigarrillo al líder comunista Ernst Thälmann. Thälmann dio una calada al cigarrillo del que se elevaba el humo. Los dos no se llevaban bien, pero al menos hoy eran amigos.\n\n\"Nunca pensé que llegaría el día en que usted invocaría el derecho de autodeterminación de los pueblos coloniales.\"\n\"¿No ve la situación? Si Deutschland no fuera una colonia, sería otra cosa. Un esclavo colonial no puede predicar la ley del más fuerte ante su amo.\"\n\"¡Ja, ja! Al fin y al cabo, las políticas cambian según la situación.\"\n\nTras inhalar y exhalar otra profunda calada, Thälmann miró de frente a Speer.\n\n\"Por la libertad de Deutschland, pensamos movilizar toda la fuerza humana disponible. ¿Cuánta gente pueden aportar ustedes?\"\n\"Tanta como sea posible. ...No podemos enfrentarles de frente, pero si ocupamos las ciudades, liberamos a los trabajadores y tomamos la capital rápidamente junto a ellos, los alemanes de todo el país se alzarán.\""
 GEH.hina.story_event.31.a: "\"Por la victoria.\""

 GEH.hina.story_event.32.t: "Cacería"
 GEH.hina.story_event.32.desc: "Amau Ako sintió unas ganas tremendas de meter en la trituradora todo ese supuesto \"montón de papeles\" de Hina, esa basura. Era la primera vez que Ako sentía una náusea así al leer una circular enviada por Hina.\n\nHina estaba intentando provocar deliberadamente el levantamiento de comunistas y fascistas: concentrar la represión violenta de protestas y el despojo de propiedades contra los locales en zonas específicas para seleccionar las regiones donde estallarían disturbios y rebeliones; y luego reducir en esas zonas las fuerzas de seguridad, para que al principio pareciera que la rebelión tenía éxito.\n\nDespués, una vez diferenciados los insurgentes de los que no se unieron, comenzaría una operación masiva de exterminio contra los rebeldes. Sería imposible incluso imaginar cuántos morirían mientras ciudades enteras eran arrasadas. Los llamados fanáticos de Gehenna creían que, con esa operación, los rebeldes de Deutschland quedarían tan debilitados que jamás podrían volver a organizar una rebelión significativa.\n\nY de hecho, así sería. Porque moriría demasiada gente.\n\nPero ¿este era el método de Sorasaki Hina? No. ¿No era Hina la que, desde después de la Gran Transferencia, buscaba minimizar—no, incluso excluir por completo—la muerte de inocentes? ¿De verdad este plan mataría solo a rebeldes? ¿No asumía, desde el principio, que varias ciudades quedarían convertidas en tierra quemada?\n\n\"...Jefa Hina. Esto no está bien.\" \n\nAko protestó con timidez. Hina, indiferente, le extendió una hoja. Una renuncia.\n\nLa respuesta más pesada de todas: si no te gusta este plan, vete.\n\n¿Qué podía decir Ako ante eso?"
 GEH.hina.story_event.32.a: "Una tragedia aguarda."

 GEH.hina.story_event.33.t: "La Gehenna de hoy"
 GEH.hina.story_event.33.desc: "La Gehenna de hoy está más despejada y apacible que de costumbre. Se ven aviones de la fuerza aérea elevarse en el cielo y llegan noticias de bombardeos masivos sobre ciudades, y aun así—maldita sea—todo se siente extrañamente tranquilo.\n\nEn internet, en la televisión, en la radio, en los periódicos… no aparece ni una sola noticia. Un día feliz.\n\n\"...Yo... ¿por qué... no pude hacer nada...?\"\n\nCon la cabeza apoyada contra la pared, Ako cerró los ojos con fuerza.\n\nLa operación ya empezó. Están estallando rebeliones por toda la Gehenna provincial. Y el ejército, que ya esperaba, se ha puesto en movimiento.\n\nMientras Gehenna entera se tiñe de sangre, aquí reinaba una paz horrenda.\n\nNo… ¿se le puede llamar paz a esto?"
 GEH.hina.story_event.33.a: "Ako salió disparada de su asiento."

 GEH.hina.story_event.34.t: "Represión de la rebelión"
 GEH.hina.story_event.34.desc: "Hina cerró los ojos en calma mientras escuchaba los informes que llegaban de todos los rincones de Gehenna.\n\nNo… ¿debería decir \"Baal\"?\n\nDespués de que la parte débil de sí misma muriera, ya no era un nombre que usara para autodenominarse. Pero Baal encontraba la razón de su nacimiento en la debilidad de Hina.\n\nDesde siempre, Sorasaki Hina había querido resolver todos los problemas *así*: matar todo lo que quebrara el orden de Gehenna y dejarlo limpio.\n\nPero como no tuvo el valor de llevarlo a la práctica, dudaba sin fin y solo sufría. Por eso nació dentro de Hina el verdadero líder: ella misma.\n\nEscuchando el jazz que sonaba en un tocadiscos, Baal—no, Sorasaki Hina—observó los reportes de \"represión de la rebelión\" que llegaban.\n\nEn efecto. ¿No era mucho más eficiente que ella fuera Hina?\n\n\"Jefa Hina.\" \n\nBaal, no… Sorasaki Hina, vio entrar a Ako en el despacho. La pistola Hot Shot, símbolo de la alta funcionaria administrativa, le apuntaba.\n\nAko, llorando, apuntaba con precisión a la frente de Hina y gritó:\n\n\"¡Esto es antiético! ¡Ni siquiera los torturadores de Trinity habrían diseñado algo así! ¡Ordene de inmediato la retirada...!\" \n\"Ako. ¿De verdad crees que con ese único Hot Shot puedes someterme?\" \n\nHina se levantó y se acercó lentamente a Ako, que le apuntaba. Ako no pudo apretar el gatillo hasta que Hina estuvo justo frente a ella.\n\nHina sujetó el Hot Shot con suavidad, se lo quitó… y lo colocó de nuevo sobre la mano de Ako.\n\nAko miró el arma, atónita por un instante, y luego rompió a sollozar, bajando la cabeza.\n\n¿Cómo podría Amau Ako dispararle a Sorasaki Hina?\n\nEsto también era, en cierto sentido, un golpe. Pero a Hina no le desagradaba aquella Ako valiente.\n\nHina le palmeó el hombro.\n\nEsto también formaba parte de la \"represión de la rebelión\"."
 GEH.hina.story_event.34.a: "\"No pasó nada, Ako. Ahora vuelve y empecemos por ordenar los documentos de la operación de sacrificio.\""

 GEH.hina.story_event.35.t: "El trono de Baal - 1"
 GEH.hina.story_event.35.desc: "¡Larga vida al Gran Estado de Gehenna! Sorasaki Hina derrotó a todos los rebeldes, y una paz total llegó a Deutschland.\n\nPero quedaba una duda. Y el motivo del nacimiento de aquel yo que se hacía llamar Baal… lo descubrió por una casualidad.\n\n\"...¿Inversión?\"\n\nUn libro arrinconado en lo profundo de la biblioteca de libros antiguos de Gehenna.\n\nLos relatos allí escritos sobre la inversión del misterio le dieron a Hina una pista interesante, mientras buscaba desesperadamente la razón de su nacimiento.\n\nBaal no era simplemente un alter ego nacido de una enfermedad mental: era otro aspecto de su misterio.\n\nY… en el instante en que tomó el control del cuerpo, se produjo la \"inversión\" de Hina.\n\n\"¿Inversión del misterio? Entonces… no soy algo nacido de una simple patología mental. Curioso.\" \n\nSi la Hina débil lo hubiera sabido antes, ¿habría encontrado una manera de eliminar a Baal? Ahora ya era imposible saberlo.\n\nHina anotó la información de aquel libro y luego lo destruyó para que nadie más pudiera leerlo.\n\nLo importante era solo esto: ahora ella era la única y auténtica Sorasaki Hina, y Hina era la líder única e irreemplazable de Gehenna.\n\n¿Qué más hacía falta?"
 GEH.hina.story_event.35.a: "Soy la vencedora."

 GEH.hina.story_event.36.t: "El trono de Baal - 2"
 GEH.hina.story_event.36.desc: "\"¿Jefa Hina? Le preparé una taza de café caliente. Je, je.\"\n\nAko dejó la taza con una sonrisa tenue. Hina, con una sonrisa relajada, alzó la taza y tomó un sorbo.\n\nAko actuaba como si hubiera olvidado que intentó matar a Hina.\n\n¿Fue un mecanismo de defensa? ¿O se rompió ella también, por desesperación? Eso no le importaba.\n\nAko ya no se oponía a todas las políticas de Hina. Incluso aceptaba con suavidad la amplia \"limpieza\" contra los locales de Gehenna.\n\nY la relación entre Hina y Ako, tras la cuarta asamblea, se volvió más íntima que nunca.\n\nGehenna se estaba volviendo más perfecta que nunca. El orden se enderezó y la tasa de criminalidad batía récords históricos a la baja. Fascistas y comunistas ya no podían oponer una resistencia significativa.\n\nSe decía que Albert Speer, huido al extranjero, seguía agitando, pero ya no tenía capacidad de despertar una voluntad de resistencia real en Deutschland.\n\nEl Comité de Disciplina, la sociedad de Gehenna… todo avanzaba hacia la perfección.\n\nHina, sintiendo paz interior, volvió a levantar la taza.\n\nAhora solo quedaba su propia paz.\n\nLa calma de una taza de café."
 GEH.hina.story_event.36.a: "El futuro es brillante."

 GEH.hina.story_event.37.t: "El trono de Baal - 3"
 GEH.hina.story_event.37.desc: "\"Gehenna es el infierno. No… ¿o al infierno se le llama Gehenna?\"\n\nEn el piso inferior del despacho de Hina, Iori revisó un indicador de mortalidad tratado como documento ultrasecreto.\n\nEl número de muertes de los locales (excluyendo a los geennanos) aumentaba cada mes de forma aterradora.\n\nUna sociedad donde incluso por delitos menores ocurren ejecuciones sumarias en la calle. Una sociedad donde la gente es tratada como ganado o como muebles, consumida en fábricas hasta morir.\n\n¿Era esto el orden y la disciplina que Iori deseaba?\n\nÚltimamente incluso Ako-chan parecía empezar a adaptarse a este \"orden\". Pensó que al menos Ako-chan lo rechazaría.\n\n\"No sé si esta era la naturaleza de la jefa… o si la Gran Transferencia la volvió loca...\" \n\nIncluso para Iori, la máxima autoridad militar, el acceso a información tan confidencial era muy limitado.\n\nAl intentar leer más allá del gráfico de muertes en ascenso, Iori se dio cuenta de que casi todos los datos estaban cubiertos con tinta negra.\n\nCuántos fueron ejecutados, en qué región, y por qué motivo… eso no podía saberse.\n\nPero detrás de esa tinta negra, negra, negra… los incontables números que habría allí.\n\nSolo imaginarlos le provocó náuseas.\n\nPara que Gehenna viva, Deutschland se estaba muriendo.\n\nEntonces, ¿no era como si nosotros nos hubiéramos convertido en parásitos de esta tierra? Una criatura que chupa la sangre del huésped y lo deja morir para poder sobrevivir.\n\nNo… no es que \"parezca\" que nos volvimos parásitos.\n\n\"Somos parásitos. ...Los creamos.\""
 GEH.hina.story_event.37.a: "Al cerrar el expediente, Iori sintió soledad y dolor dentro de este orden perfecto."

 GEH.hina.story_event.38.t: "Raza inferior"
 GEH.hina.story_event.38.desc: "\"Que los de Deutschland trabajen en labores más simples y reciban salarios más bajos que los geennanos, estrictamente hablando, no puede considerarse discriminación.\" \n\nWatanabe, un hombre-perro con cabeza de beagle, agitó con calma un dedo hacia la cámara.\n\nLa placa en su pecho que decía \"experto en derechos humanos\" brilló bajo las cámaras del estudio.\n\nWatanabe sonrió con cinismo, como si tuviera alemanes justo frente a él.\n\n\"Los alemanes no saben cómo funciona un smartphone, ni entienden internet, fax, energía nuclear… nada de eso.\n\nNosotros, los geennanos, queremos 'separarlos' de esta peligrosa nueva sociedad con el corazón de unos padres que protegen a un niño.\" \n\"Entonces, al decir 'separar', ¿quiere decir que no es discriminación?\" \n\"Exactamente. Separar, pero tratar con igualdad: esa es la voluntad de la nueva Gehenna.\n\nCreo que llegará el día en que, bajo la bandera de Gehenna, ellos obtendrán civilización y escaparán del mundo oscuro.\n\nY cuando llegue ese día, los alemanes también recibirán el mismo trato que nosotros, como gente civilizada.\""
 GEH.hina.story_event.38.a: "Aunque tomará muchísimo tiempo."

 GEH.hina.story_event.39.t: "Atraso planificado"
 GEH.hina.story_event.39.desc: "El gobierno de Gehenna no impuso deliberadamente discriminación o restricciones legales directas contra los alemanes.\n\nEl atraso planificado ocurrió con extrema cautela, y sin acciones legales: de forma natural.\n\nLa cantidad de trenes que llegaban a los pueblos alemanes fue disminuyendo poco a poco, hasta que un día dejaron de llegar por completo.\n\nLos hospitales del pueblo se redujeron uno tras otro.\n\nLas emisiones de radio en alemán se recortaron.\n\nEl precio del combustible se multiplicó varias veces, y los autos desaparecieron de las carreteras.\n\nCuando un anciano alemán vio, a través de la ventana, carretas moviéndose por el pueblo alemán, por fin lo entendió:\n\nGehenna pretendía hacer retroceder lentamente a toda Deutschland hasta antes de la Edad Media, para que, ocurriera lo que ocurriera, jamás pudiera recuperar hegemonía política y económica frente a Gehenna.\n\nAún no se aplicaba este atraso planificado a los alemanes que habían cooperado con el nuevo régimen de Gehenna.\n\nPor eso, no todos habían caído a una civilización premoderna.\n\nPero, ¿hasta cuándo duraría la misericordia de Gehenna?\n\n¿La siguiente generación?\n\n¿O la siguiente de la siguiente?"
 GEH.hina.story_event.39.a: "El anciano corrió la cortina."

 GEH.hina.story_event.40.t: " "
 GEH.hina.story_event.40.desc: "En mis cuadernos de escuela\nsobre mi pupitre y los árboles\nsobre la arena nevada\nescribo tu nombre\n\nEn las páginas que he leído\nen las páginas en blanco\nen piedra, sangre, papel o ceniza\nescribo tu nombre\n\nEn imágenes doradas\nen las armas del guerrero\nen la corona del rey\nescribo tu nombre\n\nEn la jungla y el desierto\nen el nido y los zarzales\nen los ecos de mi infancia\nescribo tu nombre\n\nEn todas mis bufandas azules\nen el pantano empapado de sol\nen el lago vivo de luz lunar\nescribo tu nombre\n\nEn el campo, en el horizonte\nen las alas de los pájaros\ny en el molino de sombra\nescribo tu nombre\n\n(...)\n\nY porque deseo una sola palabra\nvuelvo a empezar a vivir\nporque nací para conocerte\nporque nací para pronunciar tu nombre\n\nLibertad.\n\n"
 GEH.hina.story_event.40.a: "Paul Éluard, 'Liberté'"

 GEH.hina.story_event.41.t: "No soy una persona fuerte"
 GEH.hina.story_event.41.desc: "\"...¿Qué quiere decir?\" \n\nEn aquella oficina en lo alto de una torre—como si fuera una jaula que la encierra—Sorasaki Hina dejó el bolígrafo que sostenía.\n\nHina comprendió que ya no podía resistir sola.\n\nNo importaba lo que pensaran sus seguidores: Hina no era una persona tan férrea como Takanashi Hoshino.\n\nMuchos creían que Hina era una dictadora estoica, un 'hombre de hierro'. Pero no.\n\nHina nunca fue de hierro.\n\nHina decidió aceptarlo: ella no era una persona fuerte.\n\n¿Por qué apareció la otra personalidad, \"Baal\"? ¿Por qué, entre tantas enfermedades mentales, Sorasaki Hina terminó sufriendo un desdoblamiento de identidad?\n\nPorque ella, que no era una superhumana, tuvo que actuar a la fuerza como una.\n\nY para Hina—una persona común, agotada solo con intentar mantener el orden de Gehenna—la existencia de ese superhumano llamado Baal, que le susurraba que soltara todo y se volviera eternamente *cómoda*, era nauseabunda.\n\nQuizá Baal sea una entidad fuerte. Si le entregara todo, podría gobernar Gehenna con más capacidad que ella.\n\nPero Hina no lo haría.\n\nNo por razones elevadas como el libre albedrío.\n\nSino porque, para alguien que no es fuerte, fingir ser una superhumana se sentía como mentirse a sí misma.\n\nPor eso, Hina tiró de la muñeca de Ako y la agarró con fuerza.\n\n\"No soy una persona fuerte.\" \n\nLo repitió una vez más, como si Ako no la hubiera oído.\n\nLa corona del alma se tambaleó, y la burla de Baal se alejó, difuminándose.\n\nSorasaki Hina reconoció su propia debilidad.\n\nEso era mejor que vivir dentro de una mentira.\n\nEsa era la esencia libre y pura de Sorasaki Hina."
 GEH.hina.story_event.41.a: "\"Ako. Ayúdame.\""

 GEH.hina.story_event.42.t: "Como aceptando la debilidad"
 GEH.hina.story_event.42.desc: "\"Todo el mundo tiene algo que oculta. Que usted tenga una doble personalidad, jefa Hina… o que usted se haya considerado débil. ...Sí. Usted no es Takanashi Hoshino.\n\nNo puede actuar como esa persona que, incluso después de la muerte del presidente del consejo estudiantil, se quedó sola en Abydos sin un solo ayudante, decidida a proteger la academia.\n\nPero.\" \n\n¡Tac!\n\nAko golpeó con la palma el escritorio de Hina, produciendo un sonido seco.\n\nUn arrebato que jamás mostraba frente a Hina.\n\nHina se sobresaltó.\n\n\"¿Ako?\" \n\"...¿Y eso qué tiene de malo?\n\nYo no me enamoré de usted porque fuera una 'superhumana'.\n\nUsted solo tiene que seguir siendo usted: la jefa Hina.\n\nNo necesita convertirse en nadie más.\n\nNo importa lo que los demás crean que usted es, ni lo que usted misma crea que debería ser.\n\nSolo… por favor, quédese sin cambiar.\" \n\nNo importaba lo que Hina fuera; incluso si Hina no fuera la más fuerte de Gehenna, sino una chica común, Ako no se habría separado de su lado.\n\nPorque para Ako lo importante era que se había enamorado de la Sorasaki Hina recta y auténtica de *ahora*.\n\nHina no necesitaba esforzarse por ser perfecta—superhumana.\n\nPara empezar, ni siquiera podía.\n\n¿Y qué problema hay en no ser una persona fuerte?\n\nCada persona tiene su propio camino.\n\n\"Yo quiero recorrer con usted el camino que debe seguir.\n\nSi usted no es fuerte, yo estaré a su lado.\n\nPorque al no ser fuertes, actuamos en grupo.\n\nEso es lo que somos los humanos, ¿no?\""
 GEH.hina.story_event.42.a: "\"Sí... somos humanos. Lloramos, nos equivocamos y, a veces, somos débiles.\""

 GEH.hina.story_event.43.t: "La situación de Hina"
 GEH.hina.story_event.43.desc: "Después de confesarle toda su debilidad a Ako aquel día, Baal dejó de intentar arrebatarle a Hina el control del cuerpo.\n\nSorasaki Hina no puede *ser* una superhumana.\n\nAl aceptarlo por sí misma, y al aceptar incluso su lado frágil como parte de sí, aquella personalidad implacable pareció (en cierto sentido) rendirse con Hina.\n\nPor supuesto, aparte de eso, debía recibir tratamiento mental.\n\nKarl Jung, un psiquiatra local que acudió como médico personal de Hina, escribió notas en la ficha clínica con una expresión algo incómoda.\n\n\"Para serte franco, en Kivotos a esta enfermedad la llaman 'trastorno de identidad disociativo' o 'doble personalidad', pero… en la psiquiatría de la Tierra nunca se ha reportado algo así.\n\nHistorias de 'otra persona' que habla dentro de la cabeza, sí. Pero en vez de llamarlo trastorno de identidad, lo clasificamos como esquizofrenia, un término acuñado por el eugenista Bleuler.\" \n\n\"No entiendo mucho esas explicaciones médicas complicadas.\" \n\"En simple: yo sé tan poco de Baal como tú.\n\nPero en vez de intentar eliminar a Baal directamente… pienso centrarme en hablar de la causa por la que tú 'creaste' a Baal, y en enfocarme en terapia psicológica: tratar el dolor de fondo del pasado que enturbió tu mente.\" \n\"La causa por la que creé a Baal… será mi odio.\n\nEl odio hacia esos fanáticos de Gehenna que quieren convertirme en superhumana.\n\nEl odio hacia los locales alemanes que siguen perturbando el orden.\n\nY el odio hacia mi propia debilidad, que se deja arrastrar por todo ese odio.\n\n...Soy consciente de ello.\" \n\"Si eres consciente de la causa, la terapia será más fácil.\""
 GEH.hina.story_event.43.a: "Jung sonrió tenuemente."

 GEH.hina.story_event.44.t: "Restablecer el orden"
 GEH.hina.story_event.44.desc: "Hina decidió aceptar su debilidad.\n\nY, a diferencia de antes, empezó a celebrar más reuniones.\n\nNo solo con el Departamento del Orden, donde se reunían los fanáticos, sino con reuniones que incluían a altos cargos de *todos* los departamentos.\n\nEra prácticamente una declaración de que Sorasaki Hina ya no sería arrastrada por el fanatismo del Departamento del Orden, ni actuaría solo como \"la líder que ellos quieren\".\n\nQuien más se alegró fue Shiromi Iori, que llevaba tiempo sufriendo una extraña disputa de poder entre el Departamento de Ejecución y el Departamento del Orden.\n\nAl terminar la reunión, Iori salió de la sala y dio un golpecito en la punta del ala de Hina.\n\nEra un gesto tan familiar que no habría hecho ni siquiera antes de la Gran Transferencia.\n\nVarios guardaespaldas del Departamento del Orden, furiosos, llevaron la mano hacia sus fundas.\n\nPero Hina alzó la mano, detuvo sus movimientos… y sonrió a Iori.\n\n\"...¿Tienes algo que decir?\" \n\"Desde que empezaste a jugar a ser el 'Emperador del Trueno', por primera vez pareces una persona.\" \n\"¿Que parezco una persona...?\" \n\nHina miró sus propias manos.\n\nSí: esa sensación de bailar colgada de hilos invisibles.\n\nSe sentía liberada de aquel dolor maldito.\n\nDespués de desahogarse con Ako, por fin Hina se había salvado.\n\nAl reconocer que no era perfecta, se volvió más libre que en cualquier momento en el que jugó a ser el 'Emperador del Trueno'.\n\n\"...Si así lo ves, me alegra. Porque justo hace poco me volví persona.\" \n\"La jefa dice cada cosa que no se entiende.\" \n\nIori soltó una risita y se dio la vuelta.\n\nSí. Iori no sabría el dolor que Hina vivió.\n\nY era mejor que no lo supiera.\n\nAl fin y al cabo, ya era cosa del pasado."
 GEH.hina.story_event.44.a: "El orden correcto"

 GEH.hina.story_event.45.t: "Para volver a estar completa"
 GEH.hina.story_event.45.desc: "Sorasaki Hina se acercó a la ventana del despacho.\n\nAl mirar hacia abajo, a la calle donde vivían los alemanes, sintió una leve náusea.\n\nEl odio hacia los locales que Baal le susurró una y otra vez.\n\nLa voluntad de Baal que le susurraba que debía exterminarlos.\n\nHina ya era libre de la tentación de Baal, pero los legados que dejó seguían clavados en su mente como cicatrices.\n\nCada vez que veía a los alemanes, sentía náuseas.\n\nY cuando veía a los miembros del Comité, la emoción vil de Baal—esa idea de que ella debía controlar y dominar a esas \"idiotas\"—se le colaba como si fuera suya.\n\nPor supuesto, la Hina de ahora sabía que esos sentimientos habían sido \"fabricados\".\n\nPero saberlo como conocimiento y controlarlo en la práctica son cosas distintas.\n\nSi uno pudiera controlar sus emociones con facilidad por pura razón, no existirían personas que no pueden dejar de fumar.\n\nPor eso, Hina decidió repartir el trabajo hasta que ese odio fabricado se derritiera.\n\nEl control sobre los alemanes se lo dejó al Departamento del Orden.\n\nDe todos modos, para ella, eran menos importantes que gente cercana como Ako.\n\nY por un tiempo, decidió centrarse en relacionarse con quienes estaban dentro del Comité, borrando esa sensación de superioridad construida.\n\nTomaría mucho tiempo, pero Hina pensaba ir reduciendo poco a poco la influencia de Baal."
 GEH.hina.story_event.45.a: "Porque así soy yo."

 GEH.hina.story_event.46.t: "Sorasaki Hina - 1"
 GEH.hina.story_event.46.desc: "\"...Iori dijo que lo que he estado haciendo era 'jugar a ser el Emperador del Trueno'.\n\nActuar como una dictadora, ir con una guardia personal, hacer cosas raras...\n\n...En serio, ¿por qué me había corrompido tanto?\" \n\nEn el campo de tiro de Gehenna, Hina alzó el arma preparada y disparó al blanco.\n\nÚltimamente se estaba volviendo cada vez más 'política', pero su puntería increíble no se había oxidado ni un poco.\n\nComo si pudiera volver ahora mismo a la época anterior a la Gran Transferencia y seguir actuando igual como jefa del Comité.\n\nAko, mirando a Hina, sonrió con alegría.\n\n\"Usted no se corrompió. Está intentando cambiar, ¿no?\n\nAdemás, ha seguido entrenando para que sus habilidades como jefa del Comité no se oxiden.\" \n\"Aun así, si peleara contra la yo de ese entonces, ¿crees que perdería?\" \n\"Je, je. Eso quién sabe.\n\n¿Y si la jefa de ahora es más fuerte?\" \n\nEra una charla trivial, pero feliz.\n\nEse día a día de charlar tonterías con su mejor amiga.\n\nHina había olvidado lo importante que era, mientras estaba atrapada por Baal.\n\nPero ahora era distinto.\n\nHina disparó otra bala al centro del blanco.\n\n¡Bang!\n\nCon el sonido limpio del disparo, el proyectil se clavó en el centro.\n\n\"¡Como siempre, jefa! ¡Increíble!\" \n\nUna subalterna que la apoya, y se alegra de su éxito como si fuera propio.\n\nSe dio cuenta de que la administradora Ako estaba a su lado.\n\nHina miró a Ako y sonrió tenuemente.\n\nHina ya no sería dominada por Baal.\n\nLa verdadera Sorasaki Hina quizá sea débil.\n\nPero si estaba con una compañera que la valora...\n\nHina podía volverse más fuerte que nadie."
 GEH.hina.story_event.46.a: "Hacia el futuro, hacia un mañana más brillante"

 GEH.hina.story_event.47.t: "Sorasaki Hina - 2"
 GEH.hina.story_event.47.desc: "\"...La jefa Hina ha mejorado bastante últimamente. Pero, la verdad, siento que se volvió peor para la política.\" \n\nIori refunfuñó mientras se dirigía a un pueblo rural de Deutschland.\n\nPor la política intencional de represión étnica y discriminación del nuevo régimen de Gehenna contra los alemanes, el pueblo había retrocedido casi a nivel medieval.\n\nEn las calles, el caballo volvió como medio de transporte; como todas las escuelas públicas desaparecieron, los niños ni siquiera podían escribir su nombre, y solo sabían contar del 1 al 10.\n\nIori alzó la vista hacia un edificio tosco hecho con troncos entrelazados: la Universidad Unter den Linden.\n\nEn la entrada colgaba un cartel que decía: \"Cierre permanente\".\n\nIori ignoró el letrero y entró.\n\nAgentes del Departamento del Orden—seguidores de Hina—estaban sacando todos los libros de la universidad para quemarlos.\n\nEl motivo era uno: privar a la próxima generación de alemanes de su derecho a la educación.\n\nIori chasqueó la lengua al ver aquello.\n\nIncluso después de que se resolviera el problema de la doble personalidad de Hina, el trato hacia los alemanes no mejoró ni un poco.\n\nHina seguía odiándolos, y había delegado por completo las políticas hacia ellos al Departamento del Orden.\n\nPero… Iori sentía que eso no estaba bien.\n\n\"¿Así es como ustedes 'protegen el orden'? ¿Impedir que los niños que quieren aprender aprendan?\n\n...¿Por qué el Comité y esa Banda del Casco de Gehenna están haciendo la misma mierda?\" \n\nAnte la burla de Iori, varios miembros del Departamento del Orden se le acercaron con miradas amenazantes.\n\nLos miembros del Departamento de Ejecución de Iori avanzaron de inmediato para enfrentarlos.\n\nEjecución y Orden.\n\nUna organización militar partida en dos.\n\nEl conflicto interno del Comité tampoco estaba mejorando.\n\n\"El control aquí es autoridad del Departamento del Orden. El Departamento de Ejecución, márchense.\" \n\"Ja. Mira nada más… creyéndose algo.\" \n\nIori se rió de ellas por un instante y sacó su rifle.\n\nSi pensara marcharse con solo escuchar una frase, ni habría venido hasta aquí para detener la quema de libros.\n\nAunque fueran parte del mismo cuerpo militar, el rango de Iori como jefa de Ejecución era mucho más alto.\n\nIori avanzó junto a su gente."
 GEH.hina.story_event.47.a: "\"Cállense y dejen de quemar libros, malditas villanas.\""

 GEH.hina.story_event.48.t: "Sorasaki Hina - 3"
 GEH.hina.story_event.48.desc: "Amau Ako sintió que le punzaba la cabeza mientras leía el informe de que Iori había provocado un enfrentamiento violento con el Departamento del Orden en Berlín.\n\nEl estado de la jefa Hina claramente mejoraba.\n\nSus síntomas de doble personalidad desaparecieron, y Hina, liberándose de la culpa, iba recuperando poco a poco su carácter brillante de antes.\n\nPero no el estado de Hina, sino el de los ciudadanos de toda Gehenna, se estaba deteriorando.\n\nEl sistema Panóptico que Hina instauró bajo la influencia de Baal no fue abolido.\n\nLas políticas discriminatorias hacia los locales se intensificaban.\n\n\"...Haah. No puedo quedarme aquí desesperándome.\n\nSi la jefa Hina mejora, el país sin duda se estabilizará.\n\nY el Departamento del Orden y esa basura también serán limpiados.\" \n\nAutosugestionándose, Ako cerró el archivo del informe del incidente violento de Iori.\n\nGehenna estaba claramente en peligro.\n\nMás gente sufría que antes de la Gran Transferencia.\n\nPero Ako aún tenía esperanza en este mundo.\n\nAl menos Sorasaki Hina—la persona más preciada para Ako—se estaba liberando del dolor.\n\nAunque todos los demás se estuvieran hundiendo en el infierno.\n\nAko creía que algún día Hina volvería para salvar al resto sumido en el infierno.\n\nY cuando llegue ese día, todo mejorará.\n\nPaso a paso, seguimos avanzando hacia un futuro mejor."
 GEH.hina.story_event.48.a: "Que la libertad que ganó la jefa se extienda a todos nosotros."

 GEH.hina.story_event.49.t: "Solo Hina"
 GEH.hina.story_event.49.desc: "La habitación de Ayaka era un santuario.\n\nSu mundo, su universo, orbitaba alrededor de una sola persona.\n\nAl colocar con cuidado la nueva figura de Sorasaki Hina en el centro de la vitrina transparente, Ayaka dejó escapar un suspiro satisfecho.\n\nLa textura del cabello plateado, las alas demoníacas de un negro absoluto en su cintura, y hasta los cuatro cuernos dignos como una corona… aquella forma sagrada brillaba de manera hipnótica bajo el sol de la mañana.\n\nEl papel tapiz hacía mucho que perdió su significado.\n\nLas cuatro paredes estaban cubiertas sin un solo hueco por pósters de Hina, y decenas de figuras, cada una en una pose distinta, exhibían su majestuosidad.\n\nEn la estantería, libros como <Crónica de la lucha del salvador del ocaso, Sorasaki Hina> y <Encarnación del orden: todo sobre la líder Hina> estaban colocados como si fueran escrituras sagradas.\n\nDespués de que Gehenna por fin se reunificara bajo un solo orden, ese paisaje se volvió natural.\n\nLa jefa del Comité de Disciplina, Sorasaki Hina, era la salvadora que había terminado con la era del caos… un dios viviente.\n\nLa adoración voluntaria hacia ella floreció como una nueva religión.\n\nEl afecto familiar, la amistad, el amor entre amantes… eran emociones imperfectas, finitas y destinadas a corromperse algún día.\n\nSolo una cosa era inmutable: el amor puro hacia Lady Hina.\n\nEsa idea se extendió entre las estudiantes de Gehenna como si fueran versículos.\n\nAyaka era la creyente más devota de esa enseñanza.\n\nYa vestida para salir, Ayaka se arrodilló una última vez frente a la vitrina.\n\nJuntó las manos con reverencia, y fijó la mirada en los ojos amatista de la figura recién colocada.\n\nUn ser al que nunca conoció en persona, cuya voz solo había oído por medios.\n\nY aun así, para ella, era un objeto de amor más firme y único que cualquier relación del mundo.\n\nLos labios de Ayaka se movieron apenas.\n\nUna vez más, susurró un amor que ni repitiéndolo cientos de veces sería suficiente:\n\n\"La amo, Lady Hina.\"\n\nCon esa confesión, el día de Ayaka por fin cobró un sentido completo."
 GEH.hina.story_event.49.a: "La amo."

 GEH.hina.story_event.50.t: "Odio el morado"
 GEH.hina.story_event.50.desc: "El desfile de autos que siguió al final de la cuarta asamblea general del Comité fue, para Sorasaki Hina, más una tortura interminable que una marcha de victoria.\n\nSobre el descapotable que avanzaba lentamente, Hina miró al frente con el rostro endurecido.\n\nEl oleaje de banderas moradas de Gehenna, agitadas por la multitud que llenaba el distrito central, le mareaba la vista.\n\nEllos coreaban su nombre, gritaban, aullaban.\n\n\"¡Larga vida a Lady Hina! ¡Viva! ¡Nuestra madre y padre...!\" \n\nLos vítores ya no eran alegría: se habían deformado en una locura escalofriante.\n\nAlguien lloraba como una cascada y extendía la mano hacia ella; otro se revolcaba por el asfalto, alabando su nombre como un fanático.\n\nQue ella, símbolo del orden y la disciplina, estuviera en el centro de una adoración tan caótica y grotesca, le resultaba insoportable.\n\nSin querer, frunció el ceño.\n\n\"Ako.\" \n\nAnte el llamado bajo, Amau Ako, sentada a su lado, enderezó la espalda de inmediato.\n\nElla también parecía incómoda, con los labios apretados, pero ante la voz de Hina volvió a ponerse el rostro perfecto de una alta administradora.\n\n\"Sí, jefa Hina.\" \n\"¿Tú… crees que este espectáculo… es normal?\" \n\nLa mirada de Hina seguía fija en la multitud.\n\nAko dudó un instante.\n\nHonestamente, ella también encontraba repugnante aquello.\n\nPero no quería contrariar a Hina.\n\nQuería creer que era una expresión de lealtad hacia ella.\n\nAko forzó una sonrisa y contestó:\n\n\"¿No es la prueba de cuánto la respetan y la siguen?\n\nEs un poco extremo, sí… pero es evidencia de lo imponente que es su prestigio.\" \n\nEsa respuesta no le dio ningún consuelo a Hina.\n\nSolo le dejó una sensación de separación profunda.\n\nHina no dijo nada más y volvió a girar el rostro.\n\nEn medio de los vítores que le desgarraban los oídos, llegó a una comprensión fría:\n\nQuizá los que se estaban volviendo locos no eran solo ellos.\n\nAko, que debe afirmar esto como algo positivo.\n\nYo, que estoy en el centro de esta locura.\n\nNo… quizá este mundo entero… ya llevaba mucho tiempo loco.\n\nHina miró con ojos fríos a la multitud que aullaba su nombre."
 GEH.hina.story_event.50.a: "Asqueroso."

 GEH.hina.gov_event.1.t: "Gabinete de pensamientos"
 GEH.hina.gov_event.1.desc: "\"¿Gabinete de pensamientos...?\"\n\n\"Sí. Imagina que tu mente es un gabinete (un archivo). Tú eres una detective, y estás investigando un nuevo caso. La investigación llamada 'exploración del yo'.\n\n...Guardas en el gabinete de tu mente todos tus conocimientos y pensamientos. Y de ahí sacas el conocimiento que necesitas para interiorizarlo.\"\n\n\"¿Y esa 'interiorización' qué es, Baal?\"\n\n\"Para cerrar la investigación de la exploración del yo, pones en orden tus propios pensamientos, uno por uno. No es difícil, ¿verdad?\""
 GEH.hina.gov_event.1.a: "Quién sabe."

 GEH.hina.gov_event.2.t: "Interiorización"
 GEH.hina.gov_event.2.desc: "Organicé mis pensamientos.\n\nY luego, desperté.\n\nGehenna seguía allí.\n\nIgual que en el sueño."
 GEH.hina.gov_event.2.a: "Tal vez este lugar sea el sueño, y aquel sea..."

 # 선도부-만마전 공용 이벤트 #

 GEH.GEM.shared_event.1.t: "Aperitivo de Año Nuevo"
 GEH.GEM.shared_event.1.desc: "\n\n\n                                      £GFX_report_event_GEH_owner_of_suzume £GFX_report_event_GEH_nyaomoto_kan\n\n\n\n\n\n\nEl Año Nuevo de 1937 está revuelto por la polémica sobre el control del comercio en los callejones por parte de Nyaomoto Food.\n\nSe ha empezado a hablar de que Kan Nyaomoto, CEO de NyaoFood, quien supuestamente financiaba programas \"en apoyo a los mercados de barrio\", en realidad estaría imponiendo—directa e indirectamente—perjuicios a los negocios que no compran insumos a su empresa, coludiéndose con el presidente de la asociación de comerciantes.\n\nEn particular, la controversia relacionada con el famoso restaurante de Gehenna, Suzume-tei, está creciendo cada vez más.\n\nKurodate Haruna, líder del Club de Investigación Gourmet, criticó que el gobierno de Gehenna, al no investigar las acciones criminales de NyaoFood, está de facto tolerando el crimen.\n\nAhora que mucha gente está atenta a si [ROOT.GetName] responderá o no, [ROOT.GetLeader] debe dejar clara su postura: ¿declarará la protección de Suzume-tei?\n\nEn medio del conflicto entre [GEH.GetNameDef] y [GEM.GetNamedef], nuestra elección hará avanzar la cooperación con el Club de Investigación Gourmet, o bien servirá para inducir su fracaso y frenar su influencia social."
 GEH.GEM.shared_event.1.a: "Apoyar a Haruna y respaldar a Suzume-tei."
 GEH.GEM.shared_event.1.b: "¿Desde cuándo vale la pena creerle al Club Gourmet?"

 GEH.GEM.shared_event.2.t: "Trip-Trap-Train"
 GEH.GEM.shared_event.2.desc: "\n\n\n                                      £GFX_report_event_GEH_kasumi_kinugawa £GFX_report_event_GEH_ichika_nakamasa\n\n\n\n\n\n\nQue Kinugawa Kasumi y el Club de Desarrollo de Aguas Termales cometan atentados con bombas ya es algo cotidiano, pero lo que Kasumi hizo esta vez fue un gran incidente tan absurdo que se sale por completo de lo normal.\n\nNakamasa Ichika, de [TRM.GetName], estaba a cargo de transportar a Trinity unos artefactos que arqueólogos de Trinity habían excavado en el sur de Kivotos, cuando se topó con el grupo de Kasumi que había irrumpido en el tren.\n\nKasumi, perseguida por Shiromi Iori—jefa del Departamento de Ejecución del Comité Disciplinario de Gehenna—por cargos de terrorismo, tomó como rehén a Ichika y montó una situación en la que le \"ordenaba\" eliminar al Comité Disciplinario a cambio de devolver los artefactos, pero en el caos terminó dañándolos.\n\nTras recibir una paliza de Ichika, Kasumi cayó fuera del tren y actualmente huye con ayuda de otros miembros del Club de Aguas Termales.\n\nAnte este caso, se requiere la respuesta de los gobiernos de [GEH.GetNameDef] y [GEM.GetNameDef].\n\nPodemos priorizar la persecución de la fugitiva Kinugawa Kasumi, o bien—para mantener una relación amistosa con el Club de Aguas Termales—enfocarnos más en el tema de compensación hacia [TRM.GetAdjective] que en su captura."
 GEH.GEM.shared_event.2.a: "Priorizar la compensación por el artefacto."
 GEH.GEM.shared_event.2.b: "Priorizar la persecución del Club de Aguas Termales fugitivo."

 GEH.GEM.shared_event.3.t: "Vendo palomitas de maíz"
 GEH.GEM.shared_event.3.desc: "\n\n\n                                      £GFX_report_event_GEH_haruna_kurodate £GFX_report_event_GEH_prefect_team\n\n\n\n\n\n\nLas locuras del Club de Investigación Gourmet no son pocas, pero su última ocurrencia ha dejado bastante perplejo a [ROOT.GetNameDef].\n\nAprovechando el día del gran enfrentamiento entre dos organizaciones violentas de Gehenna—los *Chapotea-Chapotea Helmet Gang* y las *Desastre Total Sukeban*—cada vez más intensificado desde la Gran Transferencia, la líder Kurodate Haruna está comprando maíz a gran escala con una ambición declarada:\n\n\"¡Venderé palomitas al lado del lugar de la violencia y ganaré una fortuna!\"\n\nDado que ambos grupos han acordado pelear cerca de la frontera entre [GEM.GetNameDef] y [GEH.GetNameDef], se espera que las fuerzas de seguridad de ambos gobiernos se muevan para arrestarlos.\n\nLa cuestión es si, además de los Helmet y las Sukeban, Kurodate Haruna y el Club Gourmet también deben ser considerados objetivos de arresto.\n\nUna opción es arrestar solo a Helmet y Sukeban, teniendo en cuenta que el Club Gourmet no se ha involucrado directamente en la violencia y para mantener una relación amistosa con ellas.\n\nPero también circula la opinión de que es una gran oportunidad para barrer de una vez al Club Gourmet junto con las demás bandas problemáticas, y que Haruna debe ser arrestada.\n\nLa decisión es de [ROOT.GetLeader]."
 GEH.GEM.shared_event.3.a: "Bah, vender palomitas tampoco es para tanto..."
 GEH.GEM.shared_event.3.b: "Arréstenlas a todas. También a Kurodate Haruna."

 GEH.GEM.shared_event.4.t: "¿Que hay un onsen bajo el parlamento?"
 GEH.GEM.shared_event.4.desc: "\n\n\n                                      £GFX_report_event_GEH_kasumi_kinugawa £GFX_report_event_GEH_pandemonium_society\n\n\n\n\n\n\nHoy debía celebrarse el acto oficial de inauguración del nuevo edificio parlamentario de la Sociedad Pandemonium, cuya construcción ha finalizado, con un discurso de [GEM.GetLeader].\n\nPero el evento fue suspendido por completo debido al atentado terrorista de Kinugawa Kasumi, quien detonó una enorme explosión de aguas termales frente al edificio.\n\nKasumi afirmó que \"había agua termal bajo el edificio del parlamento\" y huyó del lugar.\n\nEl atentado de Kasumi causó graves daños colaterales al edificio.\n\nY no solo eso: el agua termal que emergió del subsuelo está provocando fenómenos extraños.\n\nLlegan reportes desconcertantes de que, por toda la zona central de Gehenna, alimentos hechos con esa agua termal están creciendo y descontrolándose.\n\nUn gigantesco panqueque del tamaño de un edificio, llamado \"Pan-chan\", utilizó queratina verde y tentáculos morados para masacrar tanto a locales alemanes como a gran parte de la población de Kivotos.\n\nAl principio se sospechó que Ushimaki Juri había creado el Pan-chan gigante, pero confirmamos que se trata de un incidente extraño: el agua termal que sube del subsuelo de Gehenna reacciona al tocar la comida.\n\nLas dos facciones, [GEM.GetNameDef] y [GEH.GetNameDef], han comenzado una respuesta conjunta ante este caos que está incendiando el distrito central de Gehenna.\n\nEl problema es que tanto Kinugawa Kasumi como el Pan-chan gigante suponen amenazas graves para los geennanos.\n\nSi priorizamos capturar a Kasumi, Pan-chan seguirá causando estragos por más tiempo.\n\nSi nos enfocamos en abatir a Pan-chan, mientras tanto el Club de Aguas Termales se esconderá bajo tierra.\n\nEn este momento, más que nunca, es crucial una decisión racional de [ROOT.GetLeader]."
 GEH.GEM.shared_event.4.a: "Eliminen primero a Pan-chan. Esa comida maldita..."
 GEH.GEM.shared_event.4.b: "Kasumi tiene que ir a la cárcel."


 # 뉴스 #
 GEH_news.1.t: "El Comité Disciplinario de Gehenna toma el control de una disciplina perfecta"
 GEH_news.1.desc: "Tras la Gran Transferencia, en Gehenna todavía existían diversas fuerzas de resistencia, como organizaciones de militantes nazis y bandas Helmet, entre otras. El Comité Disciplinario había estado enfrentándose a ellas de forma constante, pero se consideraba que destruir por completo a todas las organizaciones criminales sería una tarea difícil.\n\nSin embargo, bajo el liderazgo de [GEH.GetLeader], el aparato de seguridad de Gehenna logró desmantelar la última organización criminal y pasó a controlar la disciplina de Gehenna.\n\nPor supuesto, aún quedan pequeños grupos Helmet dispersos en la sociedad de Gehenna, pero ya no existe ninguna gran organización criminal estructurada que se oponga al sistema de [GEH.GetLeader]. Esto es una victoria completa del Comité Disciplinario."
 GEH_news.1.a: "Nuestra misión ha sido cumplida."
 GEH_news.1.b: "El Comité Disciplinario de Gehenna sí que da miedo."
 GEH_news.1.c: "El poder de la gente de Kivotos sigue creciendo..."

 GEH_news.2.t: "Se celebra la 1.ª Asamblea General del Comité Disciplinario de Gehenna"
 GEH_news.2.desc.hina: "Originalmente, el Comité Disciplinario de Gehenna era un sistema de jerarquía estricta: \"si la jefa ordena, los de abajo obedecen\". Pero debido al caos político posterior a la Gran Transferencia, el Comité Disciplinario, de manera inusual, dejó atrás la tradición y decidió que los miembros clave de todos los departamentos se reunieran en una asamblea general para decidir el futuro.\n\nEn la asamblea, ni el Departamento de Planificación, centrado en burócratas, ni el Departamento de Ejecución, dominado por fuerzas militares y policiales, lograron imponerse en las discusiones de política.\n\nEn medio de la desconfianza hacia los mandos que no mostraban fortaleza, muchos miembros deseaban que Hina, con su poderoso carisma, pusiera fin al caos. Hina mantiene por ahora distancia con las exigencias de la asamblea, pero no se sabe cuánto tiempo podrá seguir rechazando las demandas de sus partidarios."
 GEH_news.2.desc.iori: "Originalmente, el Comité Disciplinario de Gehenna era un sistema de jerarquía estricta: \"si la jefa ordena, los de abajo obedecen\". Pero debido al caos político posterior a la Gran Transferencia, el Comité Disciplinario, de manera inusual, dejó atrás la tradición y decidió que los miembros clave de todos los departamentos se reunieran en una asamblea general para decidir el futuro.\n\nEn esta asamblea se aprobaron las posturas de línea dura impulsadas por el Departamento de Ejecución, por lo que la iniciativa pasó del Departamento de Planificación, compuesto por burócratas, al Departamento de Ejecución, dominado por el estamento militar.\n\nA medida que el ejército se convierte en el centro del poder, el Pandemonium Society, rival tradicional del Comité Disciplinario, parece estar observando con atención y preparando su respuesta ante la militarización de su competidor."
 GEH_news.2.desc.ako: "Originalmente, el Comité Disciplinario de Gehenna era un sistema de jerarquía estricta: \"si la jefa ordena, los de abajo obedecen\". Pero debido al caos político posterior a la Gran Transferencia, el Comité Disciplinario, de manera inusual, dejó atrás la tradición y decidió que los miembros clave de todos los departamentos se reunieran en una asamblea general para decidir el futuro.\n\nEn la asamblea se aprobaron las posturas moderadas propuestas por el Departamento de Planificación, y el control del Comité Disciplinario pasó a manos del Departamento de Planificación, compuesto por burócratas.\n\nAmau Ako afirmó con confianza que, tras la asamblea, el gobierno de tecnócratas a largo plazo convertiría al Comité Disciplinario en un Estado más avanzado."
 GEH_news.2.desc.generic: "Originalmente, el Comité Disciplinario de Gehenna era un sistema de jerarquía estricta: \"si la jefa ordena, los de abajo obedecen\". Pero debido al caos político posterior a la Gran Transferencia, el Comité Disciplinario, de manera inusual, dejó atrás la tradición y decidió que los miembros clave de todos los departamentos se reunieran en una asamblea general para decidir el futuro.\n\nEn la asamblea, ni el Departamento de Planificación, centrado en burócratas, ni el Departamento de Ejecución, dominado por fuerzas militares y policiales, logró imponerse.\n\nLa reunión terminó en un estancamiento insatisfactorio, y se decidió mantener el sistema actual, adaptando en lo posible las políticas previas a la Gran Transferencia a la situación local, sin reformas radicales."
 GEH_news.2.a: "¡Avancemos hacia el futuro!"
 GEH_news.2.b: "Esta asamblea decidirá el futuro del Comité Disciplinario."
 GEH_news.2.c: "¿En Kivotos hasta los señores de la guerra hacen asambleas?"

 GEH_news.3.t: "Se celebra la 2.ª Asamblea General del Comité Disciplinario de Gehenna"
 GEH_news.3.desc.hina: "La 2.ª Asamblea General profundizó los asuntos decididos en la 1.ª asamblea y avanzó en la discusión sobre reformas del gobierno del Comité Disciplinario.\n\nA pesar del rechazo diplomático de Sorazaki Hina, en la 2.ª asamblea los miembros insistieron en exigir un régimen de dictadura de \"rey-filósofo\" bajo Sorazaki Hina.\n\nLos demás departamentos fueron considerados relativamente \"incompetentes\" en comparación con el gobierno de Hina, y se formó un consenso: solo bajo su mando el Comité Disciplinario podría unificarse.\n\nAl final, Hina decidió aceptar el fervor de los miembros, y parece que el Comité Disciplinario se ha reorganizado como una dictadura de \"rey-filósofo\" basada en la lealtad personal hacia Hina."
 GEH_news.3.desc.iori: "La 2.ª Asamblea General profundizó los asuntos decididos en la 1.ª asamblea y avanzó en la discusión sobre reformas del gobierno del Comité Disciplinario.\n\nShiromi Iori y el Departamento de Ejecución, en torno a ella, exigen una política hostil hacia Pandemonium Society mediante propaganda militarista.\n\nSu fervorosa propuesta de convertir al Comité Disciplinario en un Estado-cuartel fue aprobada en la asamblea, y se produjeron pequeños choques: tecnócratas del Departamento de Planificación abandonaron la sala en masa como protesta.\n\nHina aprobó la política de militarización en cumplimiento del resultado de la asamblea, pero también se extiende la inquietud de que esta decisión acerque una gran guerra al Comité Disciplinario."
 GEH_news.3.desc.ako: "La 2.ª Asamblea General profundizó los asuntos decididos en la 1.ª asamblea y avanzó en la discusión sobre reformas del gobierno del Comité Disciplinario.\n\nAmau Ako y el Departamento de Planificación, en torno a ella, criticaron de manera central la estructura de poder concentrada en Sorazaki Hina.\n\nAko sostuvo que el sistema del Comité Disciplinario está empujando a Hina hasta un punto cercano al \"abuso\", y defendió que debía instaurarse una oligarquía tecnócrata.\n\nHina aprobó esta decisión, que recortaba fuertemente su poder, pero la asamblea terminó en caos cuando algunos miembros del Departamento de Ejecución, en protesta, lanzaron insultos sexuales contra Ako y se retiraron en grupo."
 GEH_news.3.desc.generic: "La 2.ª Asamblea General profundizó los asuntos decididos en la 1.ª asamblea y avanzó en la discusión sobre reformas del gobierno del Comité Disciplinario.\n\nLas posturas de Ako—implantar una nueva oligarquía tecnócrata para reducir la carga de trabajo de Hina—y las de Iori—militarizar el Comité Disciplinario alrededor del Departamento de Ejecución—se mantuvieron en paralelo sin encontrarse.\n\nLa 2.ª asamblea concluyó sin llegar a una resolución; en un estancamiento insatisfactorio, se decidió mantener el sistema actual."
 GEH_news.3.a: "Este es el futuro que decidimos."
 GEH_news.3.b: "El futuro del Comité Disciplinario ha quedado decidido."
 GEH_news.3.c: "¿Cómo cambiará al Comité Disciplinario la elección que hicieron?"

 GEH_news.4.t: "Se celebra la 3.ª Asamblea General del Comité Disciplinario de Gehenna"
 GEH_news.4.desc: "Con la victoria del régimen de [GEH.GetLeader], la Academia Gehenna se reunificó en torno al Comité Disciplinario, y se celebró una nueva asamblea general para decidir el futuro.\n\nEn esta asamblea, el foco estuvo en debatir el porvenir de la Gehenna reunificada.\n\n[GEH.GetLeader], respaldado por los miembros, fue elevado para ocupar simultáneamente el cargo de jefa del Comité Disciplinario reunificado y la presidencia de Gehenna, y todos los documentos del antiguo Pandemonium Society fueron transferidos al Comité Disciplinario.\n\nA través de la 3.ª Asamblea General—casi una fiesta—parece que amanece un nuevo futuro para Gehenna."
 GEH_news.4.a: "¡Por una Gehenna más disciplinada y unida!"
 GEH_news.4.b: "La Gehenna dividida se ha integrado una vez más."
 GEH_news.4.c: "Ha nacido un poderoso Estado policial."

 GEH_news.5.t: "Se celebra la 4.ª Asamblea General del Comité Disciplinario de Gehenna"
 GEH_news.5.desc: "Con la estabilización del régimen de [GEH.GetLeader], se celebró la 4.ª Asamblea General del Comité Disciplinario para determinar el rumbo de la Gehenna del futuro.\n\nEn esta asamblea se debatieron maneras de ampliar aún más las políticas decididas en la 2.ª asamblea.\n\nLa 4.ª asamblea fue la más grande hasta la fecha, y por primera vez se permitió que la prensa cubriera el interior, haciendo el proceso transparente ante el público.\n\nCon el exitoso cierre de la 4.ª Asamblea General, parece haberse demostrado que el régimen de [GEH.GetLeader] le ha traído a Gehenna una gran victoria."
 GEH_news.5.a: "Hemos celebrado la mejor asamblea."
 GEH_news.5.b: "Gehenna sigue avanzando."
 GEH_news.5.c: "¡Parece que ya no habrá ningún país que pueda detenerlos!"

 GEH_news.6.t: "Sorazaki Hina renuncia al cargo de jefa del Comité Disciplinario"
 GEH_news.6.desc.hina: "Recientemente se han extendido rumores dentro del Comité Disciplinario de que Sorazaki Hina ha renunciado al cargo de jefa.\n\nSe dice, de forma verosímil, que aunque el sistema de dictadura perfecta de \"rey-filósofo\" de Sorazaki Hina ya estaba completo, Hina colapsó al no poder soportar la adoración anormal y la presión de sus fanáticos.\n\nSin embargo, el Comité Disciplinario declaró oficialmente que la noticia de la \"renuncia\" es falsa y que la jefa Hina está hospitalizada por neumonía.\n\nEn una entrevista, la alta funcionaria Amau Ako afirmó que tampoco ha oído nada sobre la renuncia de la jefa, y que está esperando el anuncio de la guardia personal compuesta por los creyentes de la jefa del Comité Disciplinario."
 GEH_news.6.desc.iori: "La repentina renuncia de Sorazaki Hina fue un incidente inesperado que nadie dentro del Comité Disciplinario previó.\n\nEl Departamento de Ejecución, que tomó el poder, acusa a otros departamentos, afirmando que la renuncia y desaparición de Hina se debió a su decepción hacia \"traidores\" que no mostraban suficiente fervor hacia el sistema estatal.\n\nEl Departamento de Ejecución está reprimiendo a opositores del Departamento de Planificación para construir un nuevo sistema militarista, pero con la líder Sorazaki Hina desaparecida, abundan las dudas sobre si el régimen militarista encabezado por Shiromi Iori podrá estabilizarse."
 GEH_news.6.desc.ako: "La repentina renuncia de Sorazaki Hina fue un incidente inesperado que nadie dentro del Comité Disciplinario previó.\n\nEn particular, como las reformas tecnócratas para reducir el poder de Hina y transferirlo al Departamento de Planificación ya provocaban la oposición de muchos otros departamentos, el Comité Disciplinario se encuentra sumido en una disputa política gravísima.\n\nSe están produciendo peleas físicas entre miembros del Departamento de Planificación, el Departamento de Inteligencia y el Departamento de Ejecución, y la sucesión de Amau Ako al cargo de jefa también se ha retrasado."
 GEH_news.6.desc.generic: "La repentina renuncia de Sorazaki Hina fue un incidente inesperado que nadie dentro del Comité Disciplinario previó.\n\nAmau Ako, reprochándose a sí misma, dijo que la renuncia de Hina fue \"culpa de todos nosotros por imponerle una carga psicológica\" y anunció que iniciaría una operación de búsqueda.\n\nA pesar del anuncio de Ako, dentro del Comité Disciplinario avanza el debate sobre la necesidad de una nueva jefa.\n\nMuchos creen que Amau Ako es la persona idónea, pero como Ako no puede abandonar la esperanza de encontrar a Hina, se estima que el traspaso de poder aún requerirá más tiempo."
 GEH_news.6.a: "Es demasiado trágico, y demasiado horrible."
 GEH_news.6.b: "La maltrataron demasiado."
 GEH_news.6.c: "¿Significa esto la caída del Comité Disciplinario de Gehenna?"

 GEH_news.7.t: "Renuncia de Amau Ako como jefa del Comité Disciplinario"
 GEH_news.7.desc: "Tras la desaparición de Sorazaki Hina, la alta funcionaria Amau Ako asumió el cargo de jefa del Comité Disciplinario con el apoyo del Departamento de Planificación.\n\nPero el Departamento de Ejecución y el Departamento de Inteligencia siguieron insistiendo en que la renuncia de Hina ocurrió porque Ako, por un \"deseo sexual\" hacia Hina, la habría \"tocado\" o \"metido mano\".\n\nAmau Ako, furiosa por el escándalo de homosexualidad promovido por el Departamento de Ejecución y el de Inteligencia, estalló en un profundo asco hacia la política y hoy, en la sala de reuniones del Comité Disciplinario, declaró su renuncia tras arrancar y rasgar su brazalete de jefa como parte de una performance.\n\nCon esta segunda renuncia ocurrida justo después de la de Hina, el Comité Disciplinario ha caído en un caos político sin precedentes."
 GEH_news.7.a: "Es un desastre..."
 GEH_news.7.b: "La caída del Comité Disciplinario está a la vista."
 GEH_news.7.c: "¿Podrán reunificarse otra vez? No parece fácil."

 GEH_news.8.t: "Se forma el gabinete de Iroha"
 GEH_news.8.desc: "Tras las renuncias de Sorazaki Hina y Amau Ako, el Comité Disciplinario, que operaba bajo un liderazgo colectivo, finalmente eligió una nueva jefa.\n\nNatsume Iroha, antigua legisladora de Pandemonium Society, ha sido clasificada como una burócrata sin alineación de facciones y, por ello, encaja con el sistema tecnócrata del Comité Disciplinario.\n\nNatsume Iroha aceptó asumir el cargo, pero como la mayor parte del poder está en manos del Departamento de Planificación, no parece probable que pueda ejercer un poder real."
 GEH_news.8.a: "Como sea, se acabó la anarquía."
 GEH_news.8.b: "¿Podrá Natsume Iroha desempeñar bien el cargo?"
 GEH_news.8.c: "¿Esto pondrá fin al caos del sistema de Gehenna?"

 GEH_news.9.t: "Se forma el gabinete de Kayoko"
 GEH_news.9.desc: "Tras las renuncias de Sorazaki Hina y Amau Ako, el Comité Disciplinario, que operaba bajo un liderazgo colectivo, finalmente eligió una nueva jefa.\n\nKayoko, asesora regente del Gran Ducado de Luxemburgo y miembro de la Agencia de Detectives 68, fue reconocida por Amau Ako como una candidata adecuada para el cargo.\n\nKayoko aceptó asumir el puesto, pero como la mayor parte del poder está en manos del Departamento de Planificación, se espera que su autoridad sea relativamente limitada."
 GEH_news.9.a: "Como sea, se acabó la anarquía."
 GEH_news.9.b: "¿Podrá Kayoko desempeñar bien el cargo?"
 GEH_news.9.c: "¿Esto pondrá fin al caos del sistema de Gehenna?"

 GEH_news.10.t: "La boda de Sorazaki Hina"
 GEH_news.10.desc: "Hoy, en la capital de [GEH.GetName], y entre los vítores de numerosos partidarios, se celebró la boda de la jefa del Comité Disciplinario, Sorazaki Hina, y Sorazaki \"Amau\" Ako.\n\nLa relación romántica entre Ako y Hina ya era, desde hace tiempo, de facto reconocida públicamente, por lo que dentro del Comité Disciplinario su boda dejó de ser un acontecimiento extraordinario.\n\nAunque las facciones anti-Ako—incluidos el Departamento de Ejecución y el Departamento de Inteligencia—declararon boicotear la ceremonia, numerosos miembros del Comité Disciplinario y ciudadanos de Gehenna que apoyan a la pareja se reunieron y la boda concluyó con gran éxito.\n\nChinatsu Hinomiya, portavoz del gobierno, anunció que Hina y Ako regresarán a sus funciones inmediatamente después de un breve viaje de luna de miel a Baviera."
 GEH_news.10.a: "Que nuestro lazo continúe por siempre."
 GEH_news.10.b: "¡Sabía que esa 'perra de la jefa' terminaría haciendo algo así!"
 GEH_news.10.c: "La cultura de Kivotos a veces es sorprendente, incluso para los estándares humanos."
 
 GEH_news.11.t: "El gobierno del segundo 'Señor del Trueno'"
 GEH_news.11.desc: "El fanatismo de los militantes fervorosos dentro del Comité Disciplinario hacia Sorazaki Hina ha llegado al extremo, y los opositores que desconfían del juicio político de Hina han ido desapareciendo uno a uno.\n\nBajo el respaldo de esos militantes, mezclado con violencia y locura, Sorazaki Hina aprobó una nueva ley habilitante que concentra todo el poder del Comité Disciplinario en su persona.\n\nDespués del antiguo dictador conocido como el 'Señor del Trueno', Sorazaki Hina se ha convertido ahora en la segunda gobernante, a la que los ciudadanos de Gehenna llaman \"Emperatriz\".\n\nPara algunos es una expresión de ira y desprecio; para otros, de temor reverente y miedo.\n\nLo importante es que el sistema del Comité Disciplinario se ha solidificado como una dictadura perfecta de \"rey-filósofo\", y a partir de ahora no se permitirá ninguna oposición personal a Sorazaki Hina dentro de [GEH.GetName]."
 GEH_news.11.a: "Por fin se ha completado."
 GEH_news.11.b: "La locura del Señor del Trueno vuelve a correr por Gehenna..."
 GEH_news.11.c: "¡Da miedo el culto a su ídolo!"
 
 GEH_news.12.t: "Se forma el gabinete de Rikuhachima"
 GEH_news.12.desc: "Tras las renuncias de Sorazaki Hina y Amau Ako, el Comité Disciplinario, que operaba bajo un liderazgo colectivo, finalmente eligió una nueva jefa.\n\nRikuhachima Aru, regente del Gran Ducado de Luxemburgo y presidenta de la Agencia de Detectives 68, fue reconocida por Amau Ako como una candidata adecuada para el cargo.\n\nRikuhachima Aru aceptó asumir el puesto, pero dado que la mayor parte del poder está en manos del Departamento de Planificación, predomina una predicción cínica: su autoridad, igual que antes, quedará limitada a Luxemburgo."
 GEH_news.12.a: "Como sea, se acabó la anarquía."
 GEH_news.12.b: "¿Podrá esa forajida desempeñar bien el cargo?"
 GEH_news.12.c: "...¿No es esto como si el Luxemburgo conquistado hubiera absorbido al conquistador?"
 
 GEH_news.13.t: "Ceremonia de retiro de Sorazaki Hina"
 GEH_news.13.desc: "Sorazaki Hina, que unificó la Gehenna dividida y protegió la patria de amenazas externas, se convirtió en una líder venerada por todos los ciudadanos de Gehenna, pero en lugar de perseguir el poder, eligió una retirada honorable desde la cima.\n\nEn la fiesta de celebración celebrada en el recinto de la zona central de Gehenna, los altos mandos del Comité Disciplinario expresaron su gratitud por los logros de Hina hasta ahora.\n\nTras renunciar como jefa del Comité Disciplinario, Hina mantiene su condición de miembro, pero dejó la mayoría de sus funciones.\n\nEn el presente, tras la unificación de Gehenna, el Comité Disciplinario posee de facto casi toda la autoridad y supervisa la administración; por ello, la renuncia al cargo de jefa conmocionó a la prensa y al público.\n\nEn la próxima reunión interna del Comité Disciplinario en la que Hina participará como miembro ordinario, se decidirá el debate sobre el mantenimiento del consejo estudiantil de Gehenna y del sistema del Comité Disciplinario.\n\nLos medios internos de Gehenna esperan que Ako, la persona en quien Hina más confía, sea la candidata más probable para sucederla."
 GEH_news.13.a: "¡De verdad, muchas gracias por todo, jefa!"
 GEH_news.13.b: "¿La aterradora jefa del Comité Disciplinario renunció? ¿De verdad?"
 GEH_news.13.c: "Pongamos atención a los cambios políticos en Gehenna."
 
 GEH_news.14.t: "Unificación de la Academia Integral de Gehenna"
 GEH_news.14.desc: "Gehenna se ha unificado de nuevo como un Estado-academia en torno al Comité Disciplinario.\n\nLa jefa [ROOT.GetLeader] ha tomado control total de Pandemonium Society, y la vieja y amarga rivalidad entre Pandemonium y el Comité Disciplinario parece estar llegando por fin a su fin.\n\nUn punto digno de mención es que, tras la reunificación, el Comité Disciplinario renombró la academia como \"Academia Integral de Gehenna\".\n\n[ROOT.GetLeader] explicó que, durante las actividades antinazis, el Comité Disciplinario incorporó a Gehenna varias escuelas de arte y arquitectura del territorio alemán, por lo que se adoptó el título de \"integral\".\n\nEl nuevo gobierno declaró que, en adelante, Gehenna usará su \"libertad de Gehenna\" no para el desorden y el caos, sino para el arte y la cultura."
 GEH_news.14.a: "¡Viva la nueva Gehenna!"
 GEH_news.14.b: "O sea, ¿una versión artística de la Academia Integral de Trinity?"
 GEH_news.14.c: "¿Por qué estas chicas están tan obsesionadas con poner 'academia' en el nombre del país?"
 
 GEH_news.15.t: "Unificación del Gran Estado de Gehenna"
 GEH_news.15.desc: "Gehenna se ha unificado una vez más en torno al Comité Disciplinario.\n\n[ROOT.GetLeader] ha tomado control total de Pandemonium Society, y la vieja y amarga rivalidad entre Pandemonium y el Comité Disciplinario parece estar llegando por fin a su fin.\n\nFanáticos y militantes fervorosos que siguen a Sorazaki Hina celebraron un desfile de victoria en la capital de Pandemonium, y numerosos materiales históricos que simbolizaban el antiguo orden de Pandemonium ardieron en llamas.\n\nAhora [ROOT.GetLeader] dará un discurso en la zona central de Gehenna para simbolizar la prosperidad eterna del Gran Estado de Gehenna.\n\nFrente a la antigua sede central de Pandemonium se construirá una estatua conmemorativa de la victoria de Sorazaki Hina.\n\nMuchos geennanos se entusiasman con la victoria del Comité Disciplinario, pero algunos temen que Gehenna esté siendo gobernada por fanáticos."
 GEH_news.15.a: "¡Viva la nueva Gehenna!"
 GEH_news.15.b: "Sorazaki Hina no era así..."
 GEH_news.15.c: "Gehenna se hundió en una oscuridad eterna..."
 
 GEH_news.16.t: "Unificación de la República Federal de Gehenna"
 GEH_news.16.desc: "Gehenna se ha unificado una vez más en torno al Comité Disciplinario.\n\n[ROOT.GetLeader] ha tomado control total de Pandemonium Society, y la vieja y amarga rivalidad entre Pandemonium y el Comité Disciplinario parece estar llegando por fin a su fin.\n\nEl mayor cambio en Gehenna es que el Comité Disciplinario está intentando transformar el sistema tradicional de Estado-academia—que continuaba desde antes de la Gran Transferencia—hacia una forma más parecida a un Estado terrestre.\n\nEn particular, se cree que esto se debe al carácter del Comité Disciplinario, cambiado por la reforma burocrática llevada a cabo por Ako y los tecnócratas.\n\n[ROOT.GetLeader] declaró la fundación de una \"República Federal\" y afirmó que el nuevo gobierno se esforzará por mantener el orden para los ciudadanos de Gehenna."
 GEH_news.16.a: "¡Viva la nueva Gehenna!"
 GEH_news.16.b: "Gehenna ya no es un Estado-academia..."
 GEH_news.16.c: "La situación política en Alemania está cambiando..."
 
 GEH_news.17.t: "Unificación del Gobierno Revolucionario Estudiantil de Gehenna"
 GEH_news.17.desc: "Tras la repentina desaparición de la jefa Sorazaki Hina, estudiantes radicales que afirman que \"su desaparición es responsabilidad de la Gehenna corrompida y de todos nosotros\" establecieron un \"Gobierno Revolucionario Estudiantil\" y unificaron Gehenna.\n\nEl comité directivo del gobierno revolucionario declaró que seguirá los \"verdaderos ideales\" de la jefa Hina y proclamó la construcción de una \"Gehenna purificada\" que materialice esos ideales.\n\nPandemonium Society, el Comité Disciplinario y otras élites del antiguo régimen fueron definidos como \"símbolos del viejo mal que llevó a la jefa a la desesperación\" y sufrieron purgas masivas.\n\nEl orden de Gehenna está siendo reorganizado de forma coercitiva en nombre de la revolución.\n\nBajo el lema de \"erradicar todo lo que contradiga el espíritu de la jefa Hina\", el gobierno revolucionario está imponiendo una remodelación radical de toda la sociedad.\n\nLa ideología y el estilo de vida de todos los estudiantes están siendo estrictamente censurados según un criterio vago llamado \"los grandes ideales de la jefa del Comité Disciplinario\".\n\nLa cultura, el arte e incluso las relaciones personales del pasado están siendo estigmatizadas como \"corruptas\" y destruidas."
 GEH_news.17.a: "¡Por la jefa Hina! ¡Purifiquemos esta sociedad!"
 GEH_news.17.b: "¿De verdad ella quería un cambio así... o solo es un pretexto?"
 GEH_news.17.c: "¿Una revolución para quién, exactamente?"
 
 GEH_news.18.t: "[GEH.GetNameDef] se une a la facción de Decagrammaton"
 GEH_news.18.desc: "El ambiente en Gehenna está cambiando bruscamente.\n\nSorazaki Hina convenció a los altos mandos del Comité Disciplinario de que Decagrammaton no es una amenaza para Gehenna, y que actúa únicamente con un propósito altruista: ayudar a la humanidad.\n\nEl Departamento de Ejecución, incluido Shiromi Iori, expresó descontento, calificando la decisión de Hina como bastante \"ilógica\", pero la facción pro-Hina—incluida la alta funcionaria Amau Ako—decidió acatar su resolución.\n\nMediante un edicto emitido para [GEH.GetName], Sorazaki Hina ordenó el cese de toda actividad militar hostil contra Decagrammaton y declaró que, de ahora en adelante, abrirán un frente común con [GEI.GetName] para avanzar hacia la liberación de Kivotos."
 GEH_news.18.a: "Tomé la decisión correcta."
 GEH_news.18.b: "Un cambio radical hasta sorprendente."
 GEH_news.18.c: "Se le fue completamente la cabeza."
 ### Descripciones de personaje ###
 ## Sorazaki Hina ##
 GEH_hina_generic_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nTras la 'Gran Transferencia', cuando la Academia Gehenna fue trasladada a la Europa de 1935, Hina ejerció de inmediato el poder público para impedir que la confusión desembocara en un derramamiento de sangre. El rápido aislamiento entre los alemanes y los estudiantes de Gehenna, manteniendo el orden, fue un momento en el que brillaron su juicio frío y su sobresaliente liderazgo.\n\nSin embargo, parece que el estrés acumulado en una situación irreal y un trabajo interminable también se convirtió en una pesada carga para ella. Últimamente no ha podido ocultar su cansancio en actos oficiales, y alrededor suyo crece cada vez más la preocupación por su salud..."
 GEH_hina_empress_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nQue Hina se estaba agotando por el trabajo interminable tras la 'Gran Transferencia' era ya un secreto a voces, pero el Comité Disciplinario—dependiente de su liderazgo personal—no le permitió dejar su deber. \"Una Gehenna sin un gran líder se derrumbará ante las amenazas externas.\" Por esas exigencias de fanáticos, ella dejó de vivir como la persona llamada Sorazaki Hina y eligió convertirse en símbolo y guía de los fieles del Comité Disciplinario. O quizá no eligió: tal vez simplemente fue elegida.\n\nTras la caída del 'Señor del Trueno', Sorazaki Hina se convirtió en el segundo dictador militar de la historia de Gehenna comparado con un \"emperador\". Sus partidarios dicen que, sentada en el trono, Hina es una emperatriz que elevará a Gehenna a un gran imperio eterno. Pero los cínicos se burlan: el futuro de la emperatriz será una tragedia que superará a la del Señor del Trueno. Porque después de la Gran Transferencia, lo que espera a un dictador fracasado en Kivotos no es un final blando como una simple \"graduación\", sino la soga del patíbulo.\n\nEse desenlace nunca podrá saberse."
 GEH_hina_empress_baal_leader_desc: "Tras derrotar a todos los enemigos que se interponían y ceñirse la corona de la gran victoria, cada vez más personas afirman que el \"ambiente\" de Sorazaki Hina cambió. Dicho con precisión: su personalidad se volvió extrañamente distinta, como si otra identidad hubiese tomado su cuerpo. Después de la guerra de reunificación de Gehenna y del enfrentamiento con Trinity, Hina se volvió más cruel y más cínica.\n\nNo es que su identidad se haya reemplazado de verdad. Los cercanos a ella, incluyendo a Ako, sostienen que solo se trata de que \"está cansada\" por una carga mental prolongada. Por supuesto, todos están adivinando la respuesta equivocada.\n\nSorazaki Hina murió. Aceptó a la fuerza la adoración de fanáticos enloquecidos, y sufrió el odio hacia los locales y un conflicto interno constante. Nadie se puso de su lado: todos solo querían que Hina los guiara como una gran dictadora de hierro. Hina estaba por encima de todos, pero era la más solitaria, y comprendió que era débil.\n\nAgotada y acorralada, el Misticismo de Hina creó por sí mismo a Baal, una identidad de \"verdadero dictador de hierro\". Y Baal, al final, logró *reemplazar* la identidad de Hina.\n\nHasta el instante de su muerte, Sorazaki Hina estuvo sola, y nadie supo de su muerte."
 GEH_hina_empress_non_baal_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nQue Hina se estaba agotando por el trabajo interminable tras la 'Gran Transferencia' era un secreto a voces, pero el Comité Disciplinario—dependiente de su liderazgo personal—no le permitió dejar su deber. \"Una Gehenna sin un gran líder se derrumbará ante las amenazas externas.\" Por esas exigencias de fanáticos, ella fue forzada a convertirse en símbolo y guía de los fieles del Comité Disciplinario.\n\nEl estrés y la presión mental de ese proceso le provocaron una enfermedad mental similar a un trastorno de identidad disociativo, y llegó al borde del colapso bajo el dolor psicológico.\n\nAl final, Hina le confesó a Ako que no podía ser una superhumana; admitió que no era el gran líder que los fanáticos imaginaban, sino una persona frágil... y así puso fin a la fantasía de la \"Gran Dictadura\".\n\nNo será fácil que un gran líder, supuestamente infalible, descienda al lugar de una persona común. Pero Sorazaki Hina quiere seguir adelante reconociendo su propia fragilidad. Tal vez sea mentalmente débil. Pero precisamente porque es débil, sabe que las personas se agrupan, y que nadie puede sostenerse completamente solo."
 GEH_hina_fake_leader_desc: "Sorazaki Hina se derrumbó. El fervor y la adoración de la guardia personal fanática que la rodeaba, la presión de ser obligada a convertirse en una dictadora de hierro, y el trabajo que continuaba sin un segundo de descanso... todo ello hizo que la humana Sorazaki Hina dejara una carta de renuncia en la oficina de la jefa y se marchara.\n\nPero para los fanáticos que la veneraban como un dios viviente, la ausencia de un dios era algo que jamás podía aceptarse. Como dijo Voltaire: si Dios no existe, tendremos que inventarlo.\n\nAl final, los creyentes invitaron a ingenieros de Millennium y construyeron un robot que imitaba a Sorazaki Hina a la perfección.\n\nUn dios mecánico con el aspecto de Sorazaki Hina desciende al escenario. No posee emoción ni empatía, pero interpreta la imagen que sus creyentes \"desean\" ver. Con el brazalete de jefa del Comité Disciplinario, se plantó ante las masas.\n\nElla nunca se derrumbará como la antigua Sorazaki Hina. La nueva Hina vivirá para siempre: un dios fabricado, una burla a la verdadera Sorazaki Hina, y un imperativo categórico que todos los geennanos deben obedecer. Para siempre."
 GEH_hina_ako_route_base_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nTras la 'Gran Transferencia', cuando la Academia Gehenna fue trasladada a la Europa de 1935, Hina ejerció de inmediato el poder público para impedir que la confusión desembocara en un derramamiento de sangre. El rápido aislamiento entre los alemanes y los estudiantes de Gehenna, manteniendo el orden, fue un momento en el que brillaron su juicio frío y su sobresaliente liderazgo.\n\nPara distribuir su enorme carga de trabajo, Sorazaki Hina decidió confiar en la alta funcionaria Amau Ako. Aceptó una tecnocracia que repartía su poder con Ako y el Departamento de Planificación, y como respuesta se intensificaron las maniobras políticas del Departamento de Ejecución y el de Inteligencia.\n\nSin embargo, Hina contraatacó proclamando públicamente que era la protectora y amante de Ako, declarando de forma contundente que la protegería. Al no poder convertir a Hina—de prestigio absoluto—en blanco de ataques, los otros departamentos se retiraron, y parece que la reforma tecnócrata de Hina logró imponerse. Y con ello, también pudo aliviar el pesado yugo del exceso de trabajo que la aplastaba."
 GEH_hina_ako_route_bride_leader_desc: "Jefa del Comité Disciplinario de Gehenna, presidenta de Pandemonium Society y del Consejo, gobernante de Alemania y gran reformadora. No hay un solo título con el que se pueda llamar a Sorazaki Hina. Para muchos alemanes locales, es un demonio que destruyó sus tradiciones y su cultura, implantó una nueva tecnocracia y consumó su matrimonio con Sorazaki Ako; para los habitantes de Kivotos, en cambio, es una gran presidenta que trajo orden a una Gehenna llena de caos y anarquía y construyó una sociedad gobernada por la ley y la razón.\n\nPero ninguno de estos logros habría sido posible sin la ayuda de la alta funcionaria Sorazaki Ako. Más conocida por su nombre anterior, Amau Ako, ella fue durante mucho tiempo el apoyo más firme de Hina y logró reformar un sistema político concentrado en la figura de Hina hacia una oligarquía de tecnócratas: un gobierno de muchos.\n\nLa cooperación y el amor entre Hina y Ako quedarán en la historia como el punto de inflexión que cambió por completo a Gehenna.\n\nAmanece un nuevo día en Gehenna. La mujer que una vez vaciló bajo la sobrecarga y la presión ya no vacilará ni se derrumbará jamás. Mientras tenga el sostén de la compañera más valiosa que le tomó la mano, Hina cree que podrá cargar, por siempre, con el peso de la presidencia de Gehenna."
 GEH_hina_ako_route_amau_leader_desc: "Jefa del Comité Disciplinario de Gehenna, presidenta de Pandemonium Society y del Consejo, gobernante de Alemania y gran reformadora. No hay un solo título con el que se pueda llamar a Sorazaki Hina. Para muchos alemanes locales, es una opresora que destruyó sus tradiciones y su cultura e implantó una nueva tecnocracia; para los habitantes de Kivotos, en cambio, es una gran presidenta que trajo orden a una Gehenna llena de caos y anarquía y construyó una sociedad gobernada por la ley y la razón.\n\nEn la nueva república, a Sorazaki Hina se le llama ahora más a menudo presidenta del consejo que jefa del Comité Disciplinario. A diferencia del pasado, cuando debía tomar un arma y estar de pie en el campo de batalla como jefa, su nueva labor se está convirtiendo en la negociación parlamentaria y el complejo trabajo administrativo para el desarrollo del Estado.\n\nMuchas miradas se posan en Hina: ¿en qué se convertirá la República Federal de Gehenna bajo su liderazgo? Pero una cosa es segura. La Gehenna dirigida por Hina y el consejo nunca volverá a ser como antes."
 GEH_hina_c_route_base_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nTras la 'Gran Transferencia', cuando la Academia Gehenna fue trasladada a la Europa de 1935, Hina ejerció de inmediato el poder público para impedir que la confusión desembocara en un derramamiento de sangre. El rápido aislamiento entre los alemanes y los estudiantes de Gehenna, manteniendo el orden, fue un momento en el que brillaron su juicio frío y su sobresaliente liderazgo.\n\nA medida que el conflicto de poder entre Pandemonium Society y el Comité Disciplinario se intensificó, Sorazaki Hina terminó aceptando la fuerte insistencia de Shiromi Iori: preparó y ejecutó una declaración de guerra sorpresa contra Pandemonium. El Comité Disciplinario logró unificar Gehenna, pero lo que obtuvo a cambio fueron innumerables problemas nacidos de una expansión militar desmesurada.\n\nAhora Sorazaki Hina debe decidir. Shiromi Iori y los numerosos miembros del Departamento de Ejecución que la siguen, el Ministerio de Guerra de Gehenna que empieza a funcionar como un verdadero aparato administrativo central, y el Departamento de Planificación prácticamente destruido por el conflicto con el Departamento de Ejecución... Hina se ha convertido en la última \"editora\" de Gehenna: la única que queda para corregir un sistema plagado de fallas."
 GEH_hina_c_route_ending_base_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nTras la 'Gran Transferencia', cuando la Academia Gehenna fue trasladada a la Europa de 1935, Hina ejerció de inmediato el poder público para impedir que la confusión desembocara en un derramamiento de sangre. El rápido aislamiento entre los alemanes y los estudiantes de Gehenna, manteniendo el orden, fue un momento en el que brillaron su juicio frío y su sobresaliente liderazgo.\n\nPero tras la guerra de unificación contra Pandemonium, ella se encontró ante una elección crucial. En lugar de corregir los daños causados por el régimen militarista liderado por Shiromi Iori, Hina declaró \"poderes de emergencia\" con el pretexto de evitar la división y el caos, concentrando todo el poder en sí misma. Fue una resolución implacable para proteger a viejos camaradas y enderezar un orden tambaleante. En ese instante, dejó de ser solo la jefa del Comité Disciplinario y comenzó a caminar el camino de una dictadora absoluta que gobierna toda Gehenna.\n\nLa decisión provocó una fuerte reacción entre los estudiantes de Gehenna, pero Hina no vaciló. Para los estudiantes que la seguían, quizá quede como una traidora fría que dio la espalda a su propio pueblo. Pero para los alemanes oprimidos, es una gran libertadora que garantizó derechos iguales mediante la \"Carta del Universalismo\" y puso fin al caos.\n\nAhora, como símbolo de un nuevo Estado llamado la \"Federación Gehenna-Deutsch\", gobierna como una autoridad absoluta que impuso el orden con su propia convicción.\n\nEn el futuro, los historiadores podrían criticar el camino dictatorial que recorrió y los sacrificios que acompañaron ese proceso. Sin embargo, nadie podrá negar que fue una líder excepcional, en tanto fusionó a dos pueblos divididos en uno solo y, en una era de caos, logró una estabilidad y una armonía sin precedentes."
 GEH_hina_cl_route_ending_base_leader_desc: "Sorazaki Hina es la jefa del Comité Disciplinario de la Academia Gehenna, una figura ampliamente conocida tanto dentro como fuera de la academia. Desde antes del incidente de la Gran Transferencia, se hizo famosa por su carácter estricto y por sus notables logros como jefa del Comité Disciplinario, siendo temida y respetada a la vez por muchos estudiantes.\n\nTras la 'Gran Transferencia', cuando la Academia Gehenna fue trasladada a la Europa de 1935, Hina ejerció de inmediato el poder público para impedir que la confusión desembocara en un derramamiento de sangre. El rápido aislamiento entre los alemanes y los estudiantes de Gehenna, manteniendo el orden, fue un momento en el que brillaron su juicio frío y su sobresaliente liderazgo.\n\nPero tras la guerra de unificación contra Pandemonium, ella se encontró ante una elección crucial. Frente a los daños del régimen militarista liderado por Shiromi Iori, Hina eligió el camino doloroso de reconocer sus propios errores en vez de afianzar el poder. Investigó a su vieja camarada Shiromi Iori como criminal de guerra y se decidió a borrar la mancha de sangre que el Comité Disciplinario había dejado. Fue su firme voluntad de proteger la esencia de \"disciplina\" y \"justicia\" por encima de los vínculos personales.\n\nBajo su liderazgo, el sistema militarizado fue desmantelado y el Comité Disciplinario retomó el rumbo para renacer como una organización protectora al servicio de los estudiantes. El punto culminante de esa reforma fue una nueva \"elección directa de presidenta del consejo estudiantil\", que reemplazó las elecciones corruptas de Pandemonium. Fue una especie de concentración democrática: elegir un líder fuerte que trascendiera las facciones.\n\nAunque la elección terminó en una victoria agotadora para ella, Hina no lo interpretó como prueba de división, sino como una misión nacional de integración que le había sido confiada.\n\nDemostró que el único eje capaz de unir a una Gehenna fragmentada era ella misma, investida por la confianza directa de los estudiantes. Ahora, no como dictadora, sino como la primera presidenta del consejo estudiantil de un nuevo y poderoso sistema elegido por los estudiantes, carga con el pesado deber de suturar las heridas de Gehenna y reconstruir una gran nación, aunque a veces sea criticada por su obstinación."
 GEH_hina_student_peoples_will_leader_desc: "La locura llamada \"la voluntad de las masas\" está incendiando Gehenna. Sorazaki Hina, líder militar de Gehenna, posee un poder enorme en términos legales, pero en la práctica no es más que una figura decorativa que no lo ejerce.\n\nAunque se opone a la locura organizada de quienes afirman seguirla—los llamados \"militantes fervorosos\"—Hina no tuvo la voluntad de enfrentarlos de forma directa ni de imponer su propia línea.\n\nDesde antes de la Gran Transferencia ella soñaba con retirarse; no tenía intención de entrar a la política con entusiasmo, y la radicalización del Estado solo la hizo mirar al Comité Disciplinario con creciente cinismo.\n\nHina se sienta en su despacho y únicamente firma los documentos que le envían sus \"seguidores\". Ya no emite juicio de valor sobre ninguna exigencia u opinión de sus subordinados.\n\nPara Sorazaki Hina, Gehenna ya no es su hogar querido. Harta de la política, cada vez cree más que Hanuma Makoto tenía razón sobre el Comité Disciplinario: una organización basura."
 GEH_hina_gehenna_hate_leader_desc: "Si le preguntas a Sorazaki Hina por el Gran Estado de Gehenna, hablará de la grandeza del país y del poderoso orden de la patria, y en cuanto la otra persona se vaya, escupirá sobre la bandera.\n\nComo sostuvo Hanuma Makoto—que tenía un criterio mucho más \"sabio\" que el de Hina y el propio Comité Disciplinario—, el Comité Disciplinario de Gehenna era una organización que debía desaparecer.\n\nSu organización terminó volviéndose indistinguible de los extremistas a los que decía oponerse, y una Gehenna controlada por el \"orden\" se convirtió en un Estado de control aterrador.\n\nCada vez que mira el paisaje de Gehenna al otro lado del cristal, Hina siente que este lugar es una prisión gigante, un infierno.\n\nTras convertirse en jefa del Gran Estado de Gehenna y presidenta de Pandemonium Society, la \"conversión\" de Hina en jefa de Estado simbólica se ha intensificado.\n\nEl partido dictatorial, el Partido de la Joven Gehenna, lo controla todo; Hina observa cómo la oscuridad de Gehenna—que desprecia—amplía cada vez más su prisión, cubierta por la cáscara de \"orden\" y \"disciplina\".\n\nPero como presidenta títere, Hina sabe muy bien que ya no tiene la capacidad de detener ese flujo.\n\nEn una mano, sostiene una cápsula de veneno; en la otra, una pistola.\n\nAlgún día escapará de este infierno, aunque el lugar al que llegue más allá del infierno no sea más que otro infierno."

 ## Consejo del Comité Disciplinario ##
 GEH_prefect_team_planning_department_generic_leader_desc: "Tras la renuncia consecutiva de dos figuras centrales que lideraban el Comité Disciplinario de Gehenna—Sorazaki Hina y Amau Ako—, el Comité Disciplinario atraviesa una grave crisis de liderazgo.\n\nA diferencia de Hina, que está en paradero desconocido, Amau Ako sigue en el Comité como alta funcionaria y suple parte de las tareas de la jefa, pero después del escándalo de homosexualidad muestra una profunda repulsión hacia la política y se niega a aceptar cualquier cargo político que no sea estrictamente burocrático.\n\nFinalmente, varios veteranos del Departamento de Planificación decidieron excluir al Departamento de Ejecución y al de Inteligencia—que se alinearon con la caída de Ako—y continuar el gobierno del Estado-academia mediante votación por mayoría dentro del consejo.\n\nEl Departamento Médico de Hinomiya Chinatsu obtuvo, en papel, el derecho de participar en el consejo, pero en la práctica no es más que un títere que sigue lo que decide el Departamento de Planificación.\n\nPor el vacío del cargo de jefa, la política interna es caótica, y la resistencia constante del Departamento de Ejecución y del de Inteligencia continúa.\n\nSe considera que el Consejo del Comité Disciplinario, en términos prácticos, carece de capacidad real para gobernar el país."

 ## Amau Ako ##
 GEH_ako_amau_bad_ending_leader_desc: "La renuncia de Sorazaki Hina sumió al Comité Disciplinario en una gran confusión. Se propusieron múltiples alternativas, incluido un liderazgo colectivo, pero el Departamento de Planificación—que posee la mayor autoridad y poder dentro del Comité—sostuvo que lo más racional era que la alta funcionaria Amau Ako heredara el cargo de jefa.\n\nGracias a la influencia del Departamento de Planificación, Ako pudo tomar el poder, pero incluso después de ponerse el brazalete de jefa, su corazón está en otra parte.\n\nDespués de todo lo ocurrido, Amau Ako todavía no abandona la esperanza de que Sorazaki Hina regrese. Lleva a cabo, con fervor, una operación de búsqueda para su retorno, pero los rivales de Ako, el Departamento de Ejecución y el de Inteligencia, atacan al gobierno diciendo: \"¿No se fue la jefa en primer lugar por culpa de Amau Ako?\"\n\nEl asco de Ako hacia la política y su odio hacia el Comité Disciplinario crecen cada vez más, y no se sabe cuánto tiempo podrá desempeñar el cargo.\n\nEn el fondo… ¿hay alguna razón por la que ella deba proteger un Comité Disciplinario sin Sorazaki Hina?"
 GEH_ako_amau_nomal_route_bad_ending_leader_desc: "La renuncia de Sorazaki Hina sumió al Comité Disciplinario en una gran confusión. Se propusieron múltiples alternativas, incluido un liderazgo colectivo, pero todos los departamentos coincidieron en que la opción más neutral era que la alta funcionaria Amau Ako heredara el cargo de jefa.\n\nCon el respaldo de varios departamentos, Amau Ako recibió el poder, pero incluso después de ponerse el brazalete de jefa, su corazón está en otra parte.\n\nDespués de todo lo ocurrido, Amau Ako todavía no abandona la esperanza de que Sorazaki Hina regrese. Lleva a cabo, con fervor, una operación de búsqueda para su retorno, pero no aparece ninguna pista sobre Hina.\n\nTal vez Ako tenga que seguir protegiendo un Comité Disciplinario sin Hina. Aunque eso la destruya por dentro..."

 ## Natsume Iroha ##
 GEH_iroha_natsume_prefect_team_leader_desc: "Tras las renuncias como jefas del Comité Disciplinario de Sorazaki Hina y Amau Ako, el Comité Disciplinario fue gobernado por un liderazgo colectivo sin una jefa.\n\nPero dentro del Comité surgió la opinión de que no era apropiado dejar el puesto vacante por demasiado tiempo. Tras largos debates, y pese a ser una burócrata de origen Pandemonium, se clasificó como la opción menos hostil y más \"conveniente\" para el Comité a Natsume Iroha, que fue nombrada nueva jefa mediante votación por mayoría en el consejo.\n\nComo burócrata típica, Natsume Iroha no posee una alineación faccional ni inclinaciones políticas especiales, y solo cumple un rol formal: anunciar las resoluciones legisladas por el consejo.\n\nIroha cree que el cargo de jefa no es para ella y no tiene afecto por el Comité Disciplinario. Pero precisamente por ser una líder dócil, insípida y obediente ante un poder enorme, es el rostro decorativo y la marioneta ideal para el Departamento de Planificación.\n\nComo en realidad no tiene intención de ejercer el poder, el gobierno de Gehenna bajo el gabinete de Natsume es, de hecho, idéntico al pensamiento del Departamento de Planificación que gobierna el consejo.\n\nPor el desprecio y la hostilidad de Amau Ako hacia los locales alemanes—y la tendencia del Departamento de Planificación que apoya esas ideas—se espera que el gabinete de Natsume imponga a los locales un régimen de Estado policial particularmente duro."

 ## Onikata Kayoko ##
 GEH_kayoko_onikata_prefect_team_leader_desc: "Tras las renuncias como jefas del Comité Disciplinario de Sorazaki Hina y Amau Ako, el Comité Disciplinario fue gobernado por un liderazgo colectivo sin una jefa.\n\nPero dentro del Comité surgió la opinión de que no era apropiado dejar el puesto vacante por demasiado tiempo. Tras largos debates, Kayoko—una estratega destacada y nominada por la alta funcionaria Amau Ako—fue nombrada nueva jefa mediante votación por mayoría en el consejo.\n\nKayoko no encaja con el estilo de \"marioneta\" que desea el consejo, pero cuenta con la confianza de Ako. Participa activamente en las sesiones del consejo, escucha con atención al Departamento de Planificación y busca discutir conjuntamente el rumbo del Comité.\n\nAl principio algunos miembros se quejaron de su carácter \"no dócil\", pero con el respaldo de Ako y el fervor de Kayoko hacia el Comité Disciplinario, el consejo fue reconociendo gradualmente que ella sí tiene la cualificación para liderar el nuevo Comité.\n\nTras garantizar la autonomía del Gran Ducado de Luxemburgo e incorporar oficialmente a la Agencia de Detectives 68 como organismo colaborador del Comité, Kayoko recoge las opiniones de sus compañeras—incluida Rikuhachima Aru—y, con el apoyo de Ako, intenta aplicar políticas de orden público relativamente moderadas: buscar una \"armonía pacífica entre los habitantes de Kivotos y los locales\" y evitar medidas de seguridad que violen de forma excesiva las libertades.\n\nMuchas miradas se concentran en si su línea moderada podrá suavizar la imagen negativa de \"Estado policial\" que arrastraba el Comité Disciplinario."

 ## Vacante (liderazgo colectivo) ##
 GEH_prefect_team_emergency_committee_leader_desc: "Tras la renuncia de Sorazaki Hina, el Comité Disciplinario está operando bajo un liderazgo colectivo con el puesto de jefa vacante.\n\nSe planea elegir una nueva líder tras los procedimientos internos adecuados, pero parece inevitable que se produzcan turbulencias sociales y políticas debido a la desaparición de la jefa.\n\nHasta ahora, Sorazaki Hina era poco menos que un pilar del Comité Disciplinario.\n\n¿Quién será el Atlas capaz de sostener un Comité sin ese pilar? ¿Y tendrá esa persona la cualificación para convertirse en el nuevo Atlas?\n\nNadie dentro del Comité Disciplinario lo sabe."

