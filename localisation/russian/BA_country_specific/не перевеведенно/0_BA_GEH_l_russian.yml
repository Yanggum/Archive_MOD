 GEH_luxembourg_rules: "Reglamento de Luxemburgo"
 GEH_luxembourg_rules_desc: "Es bien sabido que las estudiantes de Gehenna no están acostumbradas a leyes ni regulaciones, y que son tan desenfrenadas que las llaman la “academia del caos”. Usar granadas en discusiones internas es lo normal, y los tiroteos son casi cotidianos.\nEl problema es que, en Kivotos, ese estilo de vida no era un problema… pero en la Tierra sí lo es.\n\nLa masacre liderada por el bloque de Gehenna ocurrida en Luxemburgo inmediatamente tras la Gran Transferencia fue una gran llamada de atención para el Comité.\nEl “Reglamento de Luxemburgo”, propuesto por Amau Ako y decidido por Sorasaki Hina, se introdujo para evitar delitos con armas por parte del bloque de Gehenna, acostumbrado a la violencia.\n\n1. Separar las zonas de residencia del bloque de Gehenna y de la población local.\n2. Toda población del bloque de Gehenna deberá entregar sus armas antes de entrar en áreas residenciales locales.\n\nEstas dos cláusulas ayudaron mucho a mantener el orden tras la Gran Transferencia.\nSin embargo, la limitada capacidad administrativa para proteger todas las zonas residenciales y confiscar armas, y la política de confiscar arbitrariamente armas (tratadas por los kivotosianos como ropa de uso diario), está provocando la ira de las estudiantes de Gehenna.\n¿De verdad podremos mantener esta política a largo plazo?"

 GEH_centre_of_culture_idea: "Cultura Gehenna–Baviera"
 GEH_centre_of_culture_idea_desc: "La fusión de culturas heterogéneas de dos mundos es un arma que reduce los conflictos entre los kivotosianos y la población local, y permite que ambos se comprendan con mayor profundidad."

 GEH_cultural_revolution_idea: "Subversión cultural a escala nacional"
 GEH_cultural_revolution_idea_desc: "El choque radical entre dos mundos, y la desaparición de Sorasaki Hina, trajeron un impacto político y sociocultural total, desatando una revolución de subversión agresiva contra todo el arte, cultura, orden y tradición de Gehenna..."

 GEH_artistic_ultraconservatism: "Ultraconservadurismo artístico"
 GEH_artistic_ultraconservatism_desc: "¡El cambio trae la muerte de Gehenna! ¡Rechacen todo cambio, no habrá más cambios! ¡Viva la cultura pura de Gehenna y Alemania! ¡Viva la separación cultural!"

 GEH_avant_garde_prelude: "Línea vanguardista"
 GEH_avant_garde_prelude_desc: "¡Subviertan toda cultura! ¡Viva la cultura de la nueva era! ¡Entierren en la historia los espectros del pasado llamados Gehenna y Alemania! ¡Gran revolución, buena revolución!"
 GEH_cultural_revolution_idea_tt: "Dependiendo de a qué traidor hayamos atacado, §Ylos efectos del enfoque§! cambiarán.\n\n"

 GEH_prefect_team_culture: "Nuestra relación con los alemanes"
 GEH_prefect_team_culture_desc: "Tras la Gran Transferencia, los gehennianos se convirtieron en una minoría rodeada por un enorme Estado formado por alemanes.\nAunque aún mantengamos el control principal sobre Deutschland, se requieren decisiones firmes para impedir la discriminación de los transferidos de Kivotos por parte de los alemanes y para proteger nuestra cultura.\n\nDestruir la influencia de fuerzas militares locales como la Fuerza de Defensa, y evitar que la cultura mucho más libre de Kivotos sea reprimida por una cultura opresiva alemana, atrasada por más de un siglo.\nEso es un acto legítimo de “guiar” en este nuevo mundo."

 GEH_ogas: "OGAS"
 GEH_ogas_desc: "Nuestra ciencia y tecnología de Gehenna es claramente inferior a la de Millennium. Por eso, el programa que permite al Estado administrar empresas y administración mediante comunicaciones informáticas no es sofisticado y tiene límites claros.\n\nPero con el liderazgo de la deidad mecánica Sorasaki Hina, y con nuestra informática básica, podremos construir una economía automatizada rudimentaria: una red nacional que conecte empresas y administración, y un sistema donde se usen solo medios de pago electrónicos como tarjetas, en lugar de efectivo físico.\n\nEl programa OGAS consiste en digitalizar toda la administración y conectar electrónicamente a todas las empresas y organismos para que la deidad mecánica pueda controlar directamente la economía."

 GEH_sorasakism: "Culto a Sorasaki"
 GEH_sorasakism_desc: "Una fe neopagana y fundamentalista que venera a Sorasaki Hina como una deidad viviente. Va acompañada de una represión extremadamente dura contra organizaciones católicas y protestantes locales, así como de una adoración fanática hacia Hina por parte de los creyentes."

 GEH_royal_guards: "Guardia de élite"
 GEH_royal_guards_desc: "La guardia de élite, dirigida por Amau Ako, es una organización militar independiente con jurisdicción judicial sobre “delitos de pensamiento” que amenacen la seguridad del Estado, incluyendo fuerzas antisistema que rechacen la adoración a Sorasaki Hina.\nSu cadena de mando está separada del ejército regular de Gehenna, y nominalmente está bajo la supervisión del Departamento de Planificación, una organización tecnocrática.\n\nGracias a la personalidad fría de Ako —administradora ejecutiva senior y comandante de la guardia—, la locura de la guardia se mantiene en un mínimo controlado.\nAl nombrar a Ako como comandante, Hina evita que sus fanáticos se desboquen más de lo necesario y hace que permanezcan como perros de caza “seguros”, sujetos al contrapeso de otros departamentos."

 GEH_denazification: "Desnazificación"
 GEH_denazification_desc: "Aunque el gabinete de [ROOT.GetAdjective] no puede clasificarse claramente como de derecha o izquierda, hay algo indiscutible: tras la “Gran Transferencia”, nuestro régimen adoptó el “antinazismo” como su valor más importante.\nA diferencia del Pandemonium Society, que intenta cooperar con la Fuerza de Defensa y mantener relaciones amistosas con remanentes nazis del viejo Deutschland, el liderazgo del Comité considera al Partido Nacionalsocialista Obrero Alemán (NSDAP) como una fuerza incompatible con la moral y el orden que busca el Comité.\n\nEl Comité Disciplinario de Gehenna rechaza cualquier cooperación o intercambio con la Fuerza de Defensa o remanentes del NSDAP y mantiene una postura hostil.\nEsta línea ha sido un motor del apoyo que recibimos de la socialdemocracia alemana y de artistas con inclinación antinazi.\nMientras Sorasaki Hina defina al NSDAP como “desorden e inmoralidad”, cambiar o suavizar este rumbo será visto como una gran traición por nuestros partidarios."

 GEH_denazification_victory: "Victoria del ideal de la desnazificación"
 GEH_denazification_victory_desc: "Aunque el gabinete de [ROOT.GetAdjective] no puede clasificarse claramente como de derecha o izquierda, hay algo indiscutible: tras la “Gran Transferencia”, nuestro régimen adoptó el “antinazismo” como su valor más importante.\nA diferencia del Pandemonium Society, que intenta cooperar con la Fuerza de Defensa y mantener relaciones amistosas con remanentes nazis del viejo Deutschland, el liderazgo del Comité considera al NSDAP como una fuerza incompatible con la moral y el orden que busca el Comité.\n\nAl destruir al Pandemonium Society, que cooperaba con la Fuerza de Defensa, logramos proteger nuestros ideales puros.\nNuestra victoria será un gran punto de inflexión que expulsará la oscura sombra que echó raíces en Deutschland."

 GEH_victory_trinity: "Lecciones de guerra en Trinity"
 GEH_victory_trinity_desc: "La victoria que obtuvimos en la batalla decisiva del Edén fue una experiencia crucial que elevó enormemente la calidad de nuestros oficiales. Esta experiencia influirá en la doctrina militar de [ROOT.GetName] durante toda una generación."

 GEH_ako_no_hina_idea: "Capitalismo de Estado gehenniano"
 GEH_ako_no_hina_idea_desc: "Bajo la dirección de tecnócratas de Gehenna, se está formando un amplio sistema de capitalismo de Estado que abarca desde la industria militar hasta la industria ligera y pesada."

 GEH_human_right_law_iroha: "Restricciones a la contratación de alemanes"
 GEH_human_right_law_iroha_desc: "¿Acaso en Deutschland no existían tiroteos y violencia al estilo de Kivotos? Como se vio en el choque entre nazis y comunistas al final de la República de Weimar, los alemanes albergan una violencia latente.\n\nObligaremos a las empresas a imponer desventajas en la contratación de población de origen alemán, y aplicaremos restricciones aún más estrictas en el acceso a la función pública.\nEstas políticas forzarán a la población de origen alemán a permanecer en empleos poco especializados, incluyendo el sector primario."

 GEH_human_right_law_kayoko: "Organismo de Garantía de Derechos Civiles"
 GEH_human_right_law_kayoko_desc: "A pesar del conflicto entre los dos pueblos —Deutschland y Gehenna—, debemos reconocer que coexistiremos en esta tierra.\nSe establecerá un organismo estatal de garantía de derechos civiles para supervisar si, en empresas e instituciones públicas, superiores de origen kivotosiano incurren en discriminación injusta contra alemanes."

 GEH_military_tradition_1: "Tradición militar [ROOT.GetAdjective]"
 GEH_military_tradition_1_desc: "A diferencia del Pandemonium Society, con su tradición de fiestas y formalidades vacías, el Comité Disciplinario posee una larga tradición e historia militar, templada en combate. Aunque transmitir esa tradición a soldados no kivotosianos sea difícil."

 GEH_military_tradition_2: "Tradición militar [ROOT.GetAdjective]"
 GEH_military_tradition_2_desc: "A diferencia del Pandemonium Society, con su tradición de fiestas y formalidades vacías, el Comité Disciplinario posee una larga tradición e historia militar, templada en combate. Aunque transmitir esa tradición a soldados no kivotosianos sea difícil."

 GEH_military_tradition_3: "Tradición militar [ROOT.GetAdjective]"
 GEH_military_tradition_3_desc: "[ROOT.GetAdjective] posee una larga tradición e historia militar, templada en combate. Gracias a reformas militares amplias y a un sistema sostenido de mando, nuestro ejército se ha habituado a operaciones conjuntas entre soldados no kivotosianos y soldados kivotosianos."

 GEH_gehenna_leadership_committee_idea: "Comité de liderazgo del Comité Disciplinario"
 GEH_gehenna_leadership_committee_idea_desc: "El comité que elige a la jefa del Comité Disciplinario mediante elección indirecta es la organización que representa a Gehenna en la era posterior a Sorasaki Hina.\nEn lo legal, afirma heredar la historia del antiguo y pequeño Comité Disciplinario de la Academia Gehenna.\nEste comité simboliza al Comité Disciplinario de Gehenna y el proceso por el cual Gehenna pasa de ser una dictadura de un solo líder a una democracia oligárquica."
 GEH_gehenna_leadership_committee: "Modificadores de §Y$GEH_gehenna_leadership_committee_idea$§!"

 GEH_gehenna_student_council_idea: "Consejo Estudiantil [ROOT.GetAdjective]"
 GEH_gehenna_student_council_idea_desc: "El consejo estudiantil que elige a su presidenta mediante elección directa es la organización que representa a Gehenna en la era posterior a Sorasaki Hina.\nEn lo legal, afirma heredar la historia del Consejo Estudiantil de Gehenna: el Pandemonium Society.\nEste consejo simboliza la democracia de Gehenna y el proceso por el cual Gehenna pasa de ser una dictadura de un solo líder a un sistema de presidencia estudiantil electa."
 GEH_gehenna_student_council: "Modificadores de §Y$GEH_gehenna_student_council_idea$§!"

 GEH_gehenna_council_idea: "Asamblea [ROOT.GetAdjective]"
 GEH_gehenna_council_idea_desc: "La asamblea que elige a sus diputados mediante elección indirecta es el nuevo parlamento de Gehenna en su proceso de normalización estatal.\nEn lo legal, afirma heredar la historia del parlamento de la República de Weimar de 1918.\nLa asamblea simboliza la democracia controlada de Gehenna y el paso de una dictadura personal de Sorasaki Hina hacia un Estado oligárquico."

 GEH_gehenna_war_department_idea: "Ministerio de Guerra [ROOT.GetAdjective]"
 GEH_gehenna_war_department_idea_desc: "Un Estado Mayor Conjunto que supervisa las operaciones militares amplias, la gran estrategia y la planificación integral.\nDirige al ejército estudiantil de Gehenna, al ejército compuesto por alemanes y a numerosas organizaciones subordinadas integradas.\nEs, en la práctica, el poder de mando logístico y de guerra total de la Academia Gehenna: una organización enorme que prepara la Gran Guerra."

 GEH_intelligence_reform: "Reforma de contrainteligencia"
 GEH_intelligence_reform_desc: "El Departamento de Inteligencia de Gehenna conservará únicamente autoridad de contrainteligencia hacia el exterior, y en la práctica se le despoja de la autoridad de investigación interna.\nEsto va más allá de una simple medida de represalia por lo que la Inteligencia hizo al Departamento de Planificación: también busca impedir que la Inteligencia ejerza más poder del necesario."

 GEH_with_SPD: "Coalición con el SPD"
 GEH_with_SPD_desc: "El SPD ejercerá ahora una influencia abrumadora en todos los estados federados libres de Gehenna. Incluso en Baviera, donde el partido más conservador, el Partido Popular Bávaro, solía ser fuerte.\nPara lograrlo se realizará un gerrymandering distrital extremadamente sofisticado, pero es preferible a que otros partidos se apoderen de la autonomía local."

 GEH_with_trinity: "Mininegociación del Edén"
 GEH_with_trinity_desc: "La larga división y rivalidad entre Trinity y Gehenna, tras la Gran Transferencia, no es tan severa como la fractura entre humanos y kivotosianos.\nAplicaremos cuotas estrictas para funcionarios de origen trinitario al nombrar burócratas locales, y nos esforzaremos para que Trinity y Gehenna puedan ser verdaderos amigos."

 GEH_managed_democracy_union_idea: "Estado colaborador de democracia controlada"
 GEH_managed_democracy_union_idea_desc: "[ROOT.GetName] es un Estado colaborador de democracia controlada leal a [GEH.GetName].\nLimita los derechos del pueblo para proteger el orden social frente a extremistas, y al mismo tiempo se esfuerza por realizar ideales liberales."

 GEH_winter_special_equipment: "Enfocar la producción de equipo invernal"
 GEH_winter_special_equipment_desc: "Nos estamos enfocando en producir equipo invernal para asegurar la victoria en el frente oriental."

 GEH_gehenna_first_discipline: "Imposición de la disciplina de Gehenna"
 GEH_gehenna_first_discipline_desc: "Incluso en nuestros territorios ocupados, la disciplina de Gehenna debe cumplirse estrictamente."

 GEH_weapons_licensing: "Invertir en licencias de armamento"
 GEH_weapons_licensing_desc: "No solo importan las armas [ROOT.GetAdjective], sino también el armamento bajo licencia importado del extranjero."

 GEH_gehenna_order_department_idea: "Departamento del Orden [ROOT.GetAdjective]"
 GEH_gehenna_order_department_idea_desc: "El Departamento del Orden es una fuerza independiente directamente bajo la gran líder de hierro, Sorasaki Hina.\nPosee jurisdicción judicial sobre “delitos de pensamiento” que dañen la seguridad del Estado.\nSu cadena de mando está separada del ejército regular de Gehenna, y no existe ningún contrapeso político o militar.\n\nDebido a problemas en su relación con el ejército regular (el Departamento de Ejecución), el Departamento del Orden está provocando nuevas turbulencias políticas."

 GEH_hina_freie_gehenna_jugend_idea: "Juventud Libre de Gehenna"
 GEH_hina_freie_gehenna_jugend_idea_desc: "Una organización política a la que la juventud de Gehenna debe pertenecer obligatoriamente.\nSu función es controlar y administrar a los jóvenes para mantener un sistema de partido único."

 GEH_hina_friendship_idea: "Pan-nacionalismo kivotosiano"
 GEH_hina_friendship_idea_desc: "Los kivotosianos son grandiosos y han nacido con un destino evidente: gobernar a los humanos locales de la Tierra.\n¿Acaso no son una raza incivilizada que ni siquiera posee Halo?"

 GEH_hina_solidarity_idea: "Solidaridad nacional"
 GEH_hina_solidarity_idea_desc: "Los locales son “menos iguales” que los kivotosianos, pero tienen el deber de mantener la “solidaridad nacional” por la victoria de la patria."

 GEH_sorasaki_leadership: "Dictadura unipersonal"
 GEH_sorasaki_leadership_desc: "Gehenna ya no es un país donde los fanáticos de Hina aplastan a otras facciones.\nYa no existen facciones que no sean fanáticas.\nCon el liderazgo personal de Hina completado y con solo sus seguidores restantes, se ha consolidado una dictadura unipersonal despiadada."

 GEH_nsdap_gercom_revolt: "Última rebelión de Deutschland"
 GEH_nsdap_gercom_revolt_desc: "El “Gobierno de Salvación Nacional de Deutschland”, una coalición entre el canciller Albert Speer y el presidente Ernst Thälmann, ha iniciado una última revuelta popular por toda Gehenna.\nLas fuerzas de la resistencia, formadas por simpatizantes del NSDAP y del Partido Comunista Alemán, acordaron destruir Gehenna y construir una nueva república alemana.\n\nQué necedad."

 GEH_international_judicial_order: "Orden judicial internacional"
 GEH_international_judicial_order_desc: "Somos el Comité Disciplinario de Gehenna. Es decir: sin importar la forma que adopte nuestro sistema estatal, debemos contribuir a mantener el orden judicial internacional y reducir la criminalidad del mundo."
