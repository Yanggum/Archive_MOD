l_russian:

 GEH_hina_name: "Сорасаки Хина"

 #Gehenna
 GEH_country_intro_header: "50 días después del Gran Traslado"
 GEH_country_intro_content: "Antes del Gran Traslado, el organismo judicial/de seguridad de Gehenna, el §pComité de Disciplina de Gehenna§!, era muy conocido entre los forasteros por culpa de la legendaria líder de Kivotos, Sorasaki Hina; y entre la gente de Gehenna era ampliamente famosa su pugna política con la §RSociedad Pandemonium§!, el órgano superior legal.\n\nLa Sociedad Pandemonium —abreviada como Manmajeon— es la entidad superior del Comité de Disciplina, elegida mediante voto directo de las estudiantes; sin embargo, de forma descarada, mostraba una abierta hostilidad hacia el Comité e intentaba interferir ampliamente en asuntos internos, presupuesto y asuntos militares. La presidenta Hanuma Makoto, elegida como sucesora del militarista apodado “Emperador del Trueno”, no abandonó ni tras el cambio de gobierno sus delirios militaristas de “conquistar todo Kivotos”, y el hastío de Sorasaki Hina hacia la política no hizo más que profundizar.\n\nEn este contexto, Hina empezó a aferrarse al “Tratado de Edén” impulsado por el §YPresidente del Consejo Estudiantil General§!. Si se firmaba un tratado de paz con el enemigo natural de Gehenna, la §YAcademia Trinity§!, y se creaba la organización de acuerdo conjunto, el ETO, ella esperaba poder descargar en el §GETO§! todas sus preocupaciones, incluida la seguridad pública de Gehenna. Sorasaki Hina planeaba dimitir de todos sus cargos una vez que el Tratado de Edén se firmara. ...De no haber existido la situación del Gran Traslado, probablemente lo habría hecho.\n\nEl caos del Gran Traslado —en el que todo Kivotos fue trasladado a la Tierra— paralizó por completo todas las actividades diplomáticas que existían en Kivotos, incluido el Tratado de Edén. Con la interferencia de la Sociedad Pandemonium aún sin cesar, Hina y el Comité de Disciplina tuvieron que cargar con nuevas preocupaciones. Mientras Kivotos “se superponía” sobre toda Europa Central, los §Rremanentes nazis§!, que habían perdido su patria, comenzaron a atacar a la población de Kivotos armados con armas de fuego.\n\nAdemás, la propia inclinación de la gente de Gehenna a tomarse la violencia a la ligera también se volvió un problema. Cuando ocurrió un incidente de muertes masivas de civiles en Luxemburgo, Sorasaki Hina promulgó de urgencia la §YRegulación de Luxemburgo§!, que prohibía la posesión de armas de fuego (en zonas habitadas por locales), y así logró evitar delitos similares relacionados con armas en Baviera, donde se había trasladado el Comité de Disciplina.\n\n¿Pero se han acabado los problemas? En apenas 50 días, el brillante plan de retiro de Sorasaki Hina quedó frustrado de forma permanente, y una montaña de tareas la está llevando al límite mental. La presión externa, tanto de la Sociedad Pandemonium como de la Academia Trinity, se intensifica; y desde la Regulación de Luxemburgo, los gehennenses nos acusan de ser un §Rseñorío militar§!. Parece que los partidos locales tampoco nos aprecian.\n\n¿Podrá Sorasaki Hina soportar todas estas dificultades? ¿O terminará rompiéndose bajo su peso?\n\n§YDesarrollo: Kangseul2702, SKSKIe, Sonetto§!"
 GEH_country_intro_header_1: "Facciones tras el Gran Traslado - Partidos locales legales"
 GEH_country_intro_content_1: "Tras el Gran Traslado, el cuartel general del Comité de Disciplina fue trasladado a la región de Baviera, por lo que su influencia se concentró allí. Al permanecer en Baviera después del Gran Traslado, el Comité de Disciplina se vio obligado a enfrentarse a diversas facciones políticas locales.\n\nEl Comité de Disciplina decidió negar el Reichstag existente de Deutschland y monopolizar la política central de Baviera. Aun así, los concejos municipales locales sobrevivieron, y el Comité autorizó la libertad de fundar partidos políticos, que había sido prohibida desde el ascenso del régimen nazi. Con la reconstitución de múltiples partidos de oposición que habían sido reprimidos desde 1933, la política de Baviera cambió de manera dinámica.\n\nAunque todos los partidos de Deutschland fueron disueltos tras la Ley Habilitante nazi, volvieron a reconstruirse tras el Gran Traslado y el colapso nazi. El §OPartido Socialdemócrata§! es un poderoso partido de izquierda de la época de la República de Weimar y es el único partido del sistema que reconoce el gobierno del Comité de Disciplina de Gehenna. Los socialdemócratas valoran el anti-nazismo del Comité de Disciplina y creen que, cooperando con él, podrán regresar a la política central de forma pacífica.\n\nEl §YPartido Popular de Baviera§! es un partido local de derecha en Baviera y, tras su reconstrucción, resiste al Comité de Disciplina bajo el lema “el gobierno de Baviera para los bávaros”. Sin embargo, respetan los principios parlamentarios y se limitan a condenas pasivas dentro de los parlamentos regionales que el Comité permite; por eso, no sufren represión directa, pero su influencia social también es limitada.\n\nEl §CPartido de Centro§! fue un partido conservador importante en la República de Weimar, pero dentro del área de gobierno del Comité (restringida a Baviera), tiene una influencia menor frente al Partido Popular, cuyo núcleo de apoyo está en Baviera. El Partido de Centro también se opone al gobierno del Comité, pero en los concejos locales ataca más al Partido Popular que al Comité, buscando ampliar su peso político regional."
 GEH_country_intro_header_2: "Facciones tras el Gran Traslado - Resistencia ilegal"
 GEH_country_intro_content_2: "Tras el Gran Traslado, el Comité de Disciplina mostró una fuerte hostilidad hacia el Partido Nacionalsocialista Obrero Alemán, es decir, los nazis. Analizando la represión nazi contra los derechos de las mujeres, la persecución de minorías raciales y la forma en que, tras llegar al poder mediante procedimientos democráticos, aplastaron a otros partidos, el Comité concluyó que ellos eran un “caos” que debía ser destruido por ir contra la §Yjusticia y el orden§!.\n\nLa §YWehrmacht alemana§! ha mantenido acciones de guerrilla por toda Baviera durante los 50 días posteriores al Gran Traslado, pero es evidente que está fragmentada y debilitada, y que no podrá resistir por mucho tiempo. Una amenaza mayor es la organización de militantes del §YPartido Nazi§!. En lugar de luchar como guerrilla en bosques y montañas como la Wehrmacht, resisten dentro de las ciudades. Aunque, a diferencia del SPD, el Partido Popular o el Centro, han sido declarados partido ilegal, sus militantes jóvenes consideran la sociedad del Comité de Disciplina —gobernada por mujeres— como una civilización §Rdegenerada§! y continúan una rebeldía tipo “lobo solitario”, incluyendo atentados con bombas en zonas urbanas.\n\nEl §RPartido Comunista de Alemania§! es el segundo partido ilegal más grande después de los nazis. Al principio, el Comité de Disciplina los percibió simplemente como un “Red Winter” de un universo paralelo e intentó entablar relaciones amistosas; sin embargo, los comunistas interpretaron al Comité como otra dictadura burguesa y, en lugar de negociar, iniciaron la resistencia exigiendo la creación de una “República Popular de Baviera”.\n\nAdemás, organizaciones criminales de Kivotos que cruzaron con el Gran Traslado, como el §GHelmet Gang§!, están expandiendo su influencia por toda Baviera.\n\nTodas las fuerzas de resistencia son una molestia para el Comité y enemigos que degradan la disciplina social; sin embargo, como están fragmentadas y no poseen gran poder militar, no tienen la capacidad de derrocar por sí solas el sistema del Comité de Disciplina."
 GEH_guide: "§Y$GEH_main_route_focus$§! | Incompleto\n£white_dot En la 1.ª Asamblea General del Comité de Disciplina, acepta de forma neutral las posturas de varias facciones en las opciones.\n£white_dot Evita la dimisión de Sorasaki Hina. Antes de que se complete la cuenta regresiva de dimisión, debes fusionar la Sociedad Pandemonium y Trinity, y completar la 4.ª Asamblea para continuar.\n£white_dot §RAdvertencia: esta ruta no tiene contenido después de la 4.ª Asamblea.§!\n\n§C$GEH_ako_route_focus$§!\n£white_dot En la 1.ª Asamblea General del Comité de Disciplina, acepta de manera unilateral la postura del Departamento de Planificación.\n£white_dot Evita la dimisión de Sorasaki Hina. Antes de que se complete la cuenta regresiva de dimisión, debes fusionar la Sociedad Pandemonium y Trinity, y completar la 4.ª Asamblea.\n£white_dot Si logras que Hina y Ako comiencen a salir, la cuenta regresiva de dimisión se detendrá permanentemente.\n£white_dot §RAdvertencia: no termines la relación de ambas mientras el equilibrio de poder esté en “vacilación”. Es la peor decisión y bloqueará permanentemente el acceso al contenido del final de la ruta de Ako.§!\n\n§O$GEH_iori_route_focus$§! | Incompleto\n£white_dot En la 1.ª Asamblea General del Comité de Disciplina, acepta de manera unilateral la postura del Departamento Ejecutivo.\n£white_dot Evita la dimisión de Sorasaki Hina. Antes de que se complete la cuenta regresiva de dimisión, debes fusionar la Sociedad Pandemonium y Trinity, y completar la 4.ª Asamblea.\n£white_dot §RAdvertencia: esta ruta no tiene contenido después de la 4.ª Asamblea.§!\n\n§P$GEH_hina_route_focus$§! | Incompleto\n£white_dot En la 1.ª Asamblea General del Comité de Disciplina, acepta de manera unilateral la postura de las miembros más fervientes.\n£white_dot Evita la dimisión de Sorasaki Hina. Antes de que se complete la cuenta regresiva de dimisión, debes fusionar la Sociedad Pandemonium y Trinity, y completar la 4.ª Asamblea.\n£white_dot Al completar el enfoque $GEH_gehenna_leader$, la cuenta regresiva de dimisión se detendrá permanentemente.\n£white_dot §RAdvertencia: esta ruta no tiene contenido después de la 4.ª Asamblea.§!\n\n§GRuta descarrilada§!\n£white_dot Si Sorasaki Hina dimite, aparecerán nuevas “rutas descarriladas” completamente separadas de la 4.ª Asamblea original.\n£white_dot §RAdvertencia: la ruta descarrilada de $GEH_iori_route_focus$ está incompleta.§!"
 #Gehenna - Hina
 # Prologue
 GEH_start_focus: "El camino del hierro"
 GEH_start_focus_desc: "Al final, el Comité de Disciplina debe prepararse para esta crisis. No: Sorasaki Hina debe asumir la responsabilidad y resolverla. De lo contrario, no solo se quebrará el ideal de Hina y de las innumerables estudiantes de Gehenna que la siguen, sino también el destino de las ejecutivas del Comité de Disciplina. Por eso, Sorasaki Hina tiene que dar un paso al frente."

 GEH_zero_congress_focus: "1.ª Asamblea del Comité de Disciplina"
 GEH_zero_congress_focus_desc: "La situación se ha calmado hasta cierto punto y, tras mucho esfuerzo, la vida cotidiana está regresando. Las miembros del Comité de Disciplina elevan la voz: debemos convocar una asamblea para decidir nuestro futuro y establecer un plan a partir de ahora."

 GEH_Nuremberg_Wehrmacht: "Registro en Núremberg"
 GEH_Nuremberg_Wehrmacht_desc: "A diferencia de los mapaches de Manmajeon que rebosan ganas de colaborar con remanentes nazis y con la Wehrmacht, el Comité de Disciplina no cooperará en absoluto con los nacionalsocialistas, por pura integridad moral. Según la inteligencia del Departamento de Información, una organización clandestina de restos de la Wehrmacht opera en secreto en Núremberg. Aunque tengamos que combatir en guerra urbana, deben ser eliminados todos."

 GEH_Regensburg_Wehrmacht: "Registro en Ratisbona"
 GEH_Regensburg_Wehrmacht_desc: "A diferencia de los mapaches de Manmajeon que rebosan ganas de colaborar con remanentes nazis y con la Wehrmacht, el Comité de Disciplina no cooperará en absoluto con los nacionalsocialistas, por pura integridad moral. Según la inteligencia del Departamento de Información, una organización clandestina de restos de la Wehrmacht opera en secreto en Ratisbona. Aunque tengamos que combatir en guerra urbana, deben ser eliminados todos."

 GEH_focus_111111: "Estabilidad recuperada"
 GEH_focus_111111_desc: "No habrá cooperación alguna con los nazis. El Comité de Disciplina de Gehenna luchará por el orden y la moral tradicionales, y ha aplastado por completo a la Wehrmacht organizada que juró lealtad a Adolf Hitler. Al desarmar a todos los remanentes de la Wehrmacht, hemos resuelto el mayor problema de seguridad interna. El problema de los guerrilleros nazis que operan en células y el de los miembros de la Helmet Gang no es una amenaza tan grave como lo fue la Wehrmacht."

 # Chapter: 1
 GEH_Prefect_Team_muster: "Reunir al Comité de Disciplina"
 GEH_Prefect_Team_muster_desc: "En el caos de casi dos meses tras el Gran Traslado, muchas miembros del Comité de Disciplina abandonaron la causa justa de mantener el orden y proteger Gehenna, y eligieron huir. Pero, contra lo que creían los pesimistas, hemos resistido estos dos meses con orden; y, de cara a la 1.ª Asamblea, los departamentos del Comité que habían vacilado se están reorganizando y comienzan a recuperar la disciplina."

 GEH_focus_can_only_be_completed_by_focus_tt: "Este enfoque puede iniciarse automáticamente mientras el enfoque §Y$FOCUS$§! está en curso."

 GEH_rework_focus_1: "Departamento de Planificación"
 GEH_rework_focus_1_desc: "El Departamento de Planificación, liderado por Amau Ako, es el núcleo encargado de la administración y la formulación estratégica del Comité de Disciplina. Con una excelente capacidad de trabajo documental, sistematizan la operación del Comité y establecen diversas operaciones y políticas para apoyar un funcionamiento eficiente."

 GEH_rework_focus_2: "Departamento Médico"
 GEH_rework_focus_2_desc: "El Departamento Médico, liderado por Hinomiya Chinatsu, es un área clave que se encarga del apoyo sanitario del Comité de Disciplina, especializándose en el tratamiento y la gestión de salud del personal de combate. Debido a que su peso político es más débil que el del Departamento de Planificación o el Departamento Ejecutivo, no es probable que pueda tomar el poder por sí solo."

 GEH_rework_focus_3: "Departamento Ejecutivo"
 GEH_rework_focus_3_desc: "El Departamento Ejecutivo, comandado por Shiromi Iori, es el área central que administra el poder militar del Comité y se encarga del entrenamiento de combate. Mediante programas de entrenamiento estrictos, elevan la capacidad de combate de las miembros; y, cuando es necesario, ejecutan operaciones militares rápidas y efectivas para garantizar la seguridad del Comité y el cumplimiento de sus objetivos."

 GEH_fear_eyes: "Operación: Decencia Pública"
 GEH_fear_eyes_desc: "Ya quedó claro que Manmajeon nos es hostil.\nSiendo así, ha llegado la hora de imponer “decencia pública” sobre Manmajeon, la mayor fuente de problemas de Gehenna."

 GEH_fear_eyes_tt: "En cuanto comience $GEH_operation_countenance$, tendremos §Y30 días§! para prepararnos antes de declarar la guerra a [GEM.GetNameDef].\n$GEH_fear_eyes_mission_tt$\n"
 GEH_fear_eyes_mission_tt: "Una vez que se active la misión §Y$GEH_operation_countenance$§!, el contingente [GetOperationCountenanceTooltip] tendrá §Y60 días§! para forzar la rendición de [GEM.GetNameDef]. Si se supera ese plazo, intentarán unirse a otras fuerzas, y nuestra población empezará a preocuparse por nuestra capacidad militar."

 GEH_shocked_by_surprise_attack: "Conmoción por ataque sorpresa"
 GEH_shocked_by_surprise_attack_desc: "La estrategia del Comité de Disciplina contra nosotros, la Operación: Decencia Pública, ha sumido a toda Manmajeon en shock. Nuestro ejército ha sido sobrepasado, nuestra red de comunicaciones ha quedado cortada, y entendimos que no tiene sentido convocar a los responsables del otro lado para exigir explicaciones. Mientras intentamos comprender la situación, nuestras relaciones diplomáticas quedarán neutralizadas."

 GEH_preparations_for_operation_countenance: "Preparativos para la Operación: Decencia Pública"
 GEH_operation_countenance: "Operación: Decencia Pública"
 GEH_external_activities: "Actividad exterior del Comité de Disciplina"
 GEH_external_activities_desc: "Antes del Gran Traslado, el Comité de Disciplina de Gehenna era la institución encargada de hacer cumplir la ley en una academia gigantesca. Sin embargo, tras el Gran Traslado, al resolver incontables conflictos y separarse gradualmente de Manmajeon por desacuerdos constantes, el Comité terminó formando un grupo militar independiente. Por ello, la diplomacia del Comité de Disciplina existe para pacificar Gehenna y fundar una academia unificada."

 GEH_trinity_preemptive_strike: "Golpe preventivo a Trinity"
 GEH_trinity_preemptive_strike_desc: "Es hora de poner fin, de una vez por todas, a la antigua mala sangre entre Gehenna y Trinity. Toda la cúpula dirigente de Gehenna ha decidido una ofensiva total contra Trinity, y ahora nos movemos para cerrar el telón de la historia. Se acerca el capítulo final, por la gloria y la seguridad de Gehenna y de todas sus estudiantes."

 GEH_preparations_for_operation_fall_of_angel: "Operación: La caída del ángel"
 GEH_preparations_for_operation_fall_of_angel_tt: "En cuanto comience $GEH_preparations_for_operation_fall_of_angel$, tendremos §Y30 días§! para prepararnos antes de declarar la guerra a [TRM.GetNameDef]. En cuanto termine el límite de la misión, declararemos la guerra a [TRM.GetNameDef]."

 GEH_second_congress_focus: "2.ª Asamblea del Comité de Disciplina"
 GEH_second_congress_focus_desc: "La dirección política decidida en la 1.ª Asamblea debe debatirse y redactarse en serio ahora, en la 2.ª Asamblea."

 GEM_Start_nego_tt: "@GEM§Y[GEM.GetAdjective]§! está negociando con @GEA§Y[GEA.GetName]§!"

 GEH_stabilization_of_gehenna_nation: "Estabilización del Estado de Gehenna"
 GEH_stabilization_of_gehenna_nation_desc: "Somos el organismo de seguridad pública que representa a toda Gehenna, y nuestras actividades de seguridad se llevan a cabo en todo el territorio, exista o no Manmajeon. Si no lo hacemos nosotros, ¿quién lo hará?"

 GEH_cooperation_with_pandemonium: "Cooperar con Manmajeon"
 GEH_cooperation_with_pandemonium_desc: "Incluso Manmajeon conserva un mínimo de voluntad de mantener el orden. Claro que no creemos que [GEM.GetLeader] sea capaz de lograrlo, pero si cooperamos con ellas, podremos hacer más."

 GEH_instigating_confusion_in_pandemonium: "Provocar confusión en Manmajeon"
 GEH_instigating_confusion_in_pandemonium_desc: "Somos el organismo de seguridad que representa a toda Gehenna; y eso también significa que, si fomentamos un sabotaje intencional, podemos sembrar confusión en la capacidad policial de Manmajeon y hacer que el pueblo de Gehenna acumule aún más descontento contra ellas. Algunas miembros con fuerte sentido de justicia podrían sentirse incómodas con esto."

 GEH_additional_leadership_personnel_employment: "Reclutar miembros adicionales del Comité"
 GEH_additional_leadership_personnel_employment_desc: "Desde la última asamblea, donde se confirmó la escasez de personal administrativo, la carga burocrática del Comité de Disciplina no ha dejado de aumentar. Debemos buscar diversos métodos de reclutamiento para resolver este problema."

 GEH_establishment_of_german_autonomous_government: "Establecer un gobierno autónomo alemán"
 GEH_establishment_of_german_autonomous_government_desc: "El Comité de Gobierno Autónomo del pueblo alemán —abreviado como Gobierno Autónomo Alemán— es una institución que empezó a impulsarse cuando comenzamos a incorporar alemanes a la administración, con el fin de integrar bajo nuestro mando a los gobiernos regionales alemanes."

 GEH_establishment_of_german_militia: "Milicia alemana"
 GEH_establishment_of_german_militia_desc: "Wehrmacht disuelta por la fuerza, desertores, y además incontables miembros de milicias sin importar si son de izquierda o derecha. Si los movilizamos, podremos reforzar fácilmente la mano de obra del Comité de Disciplina."
 ## Ruta de Iori ##
 GEH_iori_route_focus: "Enfoques de Shiromi Iori"
 GEH_preparation_of_war_with_pantemonium: "Preparativos de guerra contra [GEM.GetAdjective]"
 GEH_indiscriminate_conscription: "Implantar el reclutamiento indiscriminado"
 GEH_propaganda_spread: "Distribuir propaganda"
 GEH_expulsion_of_pandemonium: "Expulsar a Pandemonium"
 GEH_systemic_militarization: "Militarización sistémica"
 GEH_injecting_hostility: "Inyectar hostilidad"
 GEH_leadership_of_the_executive_branch: "Dirección del Departamento Ejecutivo"
 GEH_war_department: "Borrador de integración del Ministerio de Guerra"
 GEH_military_leadership_committee: "Comité de Liderazgo Militar"

 GEH_iori_route_focus_desc: "Shiromi Iori demostró su capacidad en la asamblea anterior y, bajo la gran tesis del ataque contra Manmajeon, marcó la dirección del Comité de Disciplina."
 GEH_preparation_of_war_with_pantemonium_desc: "[GEM.GetAdjective] ha mantenido actos hostiles contra nuestro Comité de Disciplina desde antes del Gran Traslado, y después del Gran Traslado ni siquiera ha dudado en hacerlo de forma oficial. ¡Mientras no los destruyamos por completo, el Comité de Disciplina no tendrá futuro!"
 GEH_indiscriminate_conscription_desc: "Para esta gran lucha contra Manmajeon, es necesario movilizar enormes efectivos. Se establecerán procedimientos de movilización extensivos para incorporar, sin distinguir entre estudiantes o alemanes, a todos en el avance que se avecina."
 GEH_propaganda_spread_desc: "Distribuir panfletos favorables al Comité de Disciplina en las zonas bajo el control de [GEM.GetAdjective] podría exponer los repugnantes ideales de Manmajeon y elevar el apoyo hacia nosotros. Al menos, por un tiempo. Aunque traicionemos nuestra causa y nuestros ideales, las maniobras negativas y el populismo anti-Manmajeon deben continuar."
 GEH_expulsion_of_pandemonium_desc: "¡Ha llegado el momento! Rápida y decisivamente, el ejército del Comité de Disciplina avanzará hacia los territorios dominados por [GEM.GetAdjective]. Debemos cortar la cadena del rencor y forjar una paz permanente para el Comité."
 GEH_systemic_militarization_desc: "El Departamento Ejecutivo es la institución responsable del uso extensivo de la fuerza por parte del Comité de Disciplina, y para consolidar su autoridad dominante deben introducirse diversos sistemas militares."
 GEH_injecting_hostility_desc: "Haremos obligatoria la educación propagandística hostil contra Manmajeon para resolver la negativa de movilización por nuestra baja popularidad."
 GEH_leadership_of_the_executive_branch_desc: "No podemos cargar eternamente a Sorasaki Hina y hacer que supervise personalmente todas las operaciones militares. Transferiremos al Departamento Ejecutivo la responsabilidad que pesa sobre Hina. A partir de ahora, debe destacarse el Comité de Disciplina, no solo la jefa del Comité."
 GEH_war_department_desc: "El Comité de Disciplina debe prepararse para una guerra a gran escala y, para apoyar ese esfuerzo, crearemos un nuevo Ministerio de Guerra: un núcleo de figuras clave con un rol similar al del Departamento Ejecutivo, pero más experimental y orientado a la preparación."
 GEH_military_leadership_committee_desc: "El gobierno del Comité de Disciplina debe ir por delante del propio Comité. La gloria militar y la consolidación de la doctrina son la razón de ser del Comité y el fundamento de su ideología. El Ministerio de Guerra planificado será incorporado oficialmente como parte del Comité, y será el primer paso hacia la estabilidad salvadora de Gehenna y un control amplio."

 ## Ruta de Hina ##
 GEH_hina_route_focus: "El liderazgo de Sorasaki Hina"
 GEH_one_person_leadership_system: "Sistema de liderazgo unipersonal"
 GEH_firm_leadership: "Liderazgo firme"
 GEH_gehenna_leader: "Líder de Gehenna"
 GEH_gehenna_leader_tt: "§RAhora, pase lo que pase, Sorasaki Hina no se derrumbará. Es su determinación.§!"
 GEH_distribution_of_propaganda_materials_in_gehenna: "Repartir propaganda en Gehenna"
 GEH_distribution_of_propaganda_materials_in_gehenna_tt: "Desbloquea ley de ocupación: §YDominio unificado de Gehenna§!."
 GEH_national_unity: "Unidad nacional"
 GEH_student_peoples_will: "La voluntad del pueblo estudiantil"
 GEH_distinction_of_zealous_members: "Clasificar a los miembros fervorosos"
 GEH_sorasaki_hina_quotes_compilation: "Compilar las citas de Sorasaki Hina"
 GEH_prefect_team_fanaticism: "Fanatismo del Comité de Disciplina"

 GEH_hina_route_focus_desc: "La política paranoica de mantener el status quo, nacida del peso de responsabilidad sobre Sorasaki Hina, terminó cristalizando en un apoyo fervoroso de todo el Comité de Disciplina. Algo que ni la propia Hina ni nadie de la directiva deseaba. Pero ahora… hay que empezar."
 GEH_one_person_leadership_system_desc: "El Comité de Disciplina siempre opera bajo la revisión final de Sorasaki Hina. Esto proporcionará un fuerte carisma político y reducirá considerablemente la resistencia contra sus políticas."
 GEH_firm_leadership_desc: "“¡Debemos confiscar por completo la industria de los nazis alemanes que no sigan el liderazgo de la jefa del Comité, Sorasaki Hina! ¡Toda la industria para el Comité de Disciplina!” — Propaganda de Sorasaki Hina (extracto)"
 GEH_gehenna_leader_desc: "Incluso por la devoción de los miembros fanáticos, Sorasaki Hina no puede retroceder. Ahora, utilizará todos los medios para subirse a ese pesado pedestal. Su Excelencia Sorasaki… Bienvenida a ser la primera premisa del Comité de Disciplina."
 GEH_distribution_of_propaganda_materials_in_gehenna_desc: "Si difundimos por toda Gehenna la grandeza de la jefa del Comité, Sorasaki Hina, es seguro que a ella también le agradará. Esta magnífica labor de esclarecimiento debe empezar de inmediato."
 GEH_national_unity_desc: "Toda Gehenna debe unificarse bajo el liderazgo de la jefa del Comité, Sorasaki Hina. Esta es la voluntad de cada miembro del Comité… y el futuro de Gehenna."
 GEH_student_peoples_will_desc: "Si volcamos todo este fervor fanático en estudiantes, miembros del Comité y alemanes leales, quizá podamos apartarnos un poco de esta exaltación… aunque sea por un tiempo. Tal vez incluso en adelante."
 GEH_distinction_of_zealous_members_desc: "Debemos identificar a los miembros del Comité de Disciplina que juran lealtad a la jefa. Esto empezará relegando a puestos irrelevantes a quienes no sean lo bastante leales."
 GEH_sorasaki_hina_quotes_compilation_desc: "“Un libro que compila las grandes citas de la jefa del Comité de Disciplina, Sorasaki Hina, para que toda Gehenna pueda conocerlas.” — Descripción de ‘Citas de Sorasaki Hina’"
 GEH_prefect_team_fanaticism_desc: "¡La jefa es, sin duda, el superhumano fuerte que salvará a este Comité de Disciplina! Debemos venerarla y serle aún más leales, para que ninguna existencia pueda desafiar su autoridad."

 ## Ruta de Ako ##
 GEH_ako_route_focus: "El plan de Amau Ako"
 GEH_ako_route_focus_desc: "“Seamos sinceras. Después del Gran Traslado, saben cuánto se ha forzado la jefa Hina con toda esa carga de trabajo, ¿no? Si nadie lo menciona, es solo por miedo a que les toque repartir esa carga. Ahora tenemos que ayudarla. ¿Van a hacerse responsables si la jefa Hina termina desplomándose?”"

 GEH_deterioration_of_manmajeon_authority: "Desacreditar a Manmajeon"
 GEH_deterioration_of_manmajeon_authority_desc: "“Yo llegué a pensar que el Gran Traslado lo provocó Hanuma Makoto, esa mapache. Sí, bueno… al final no hubo pruebas. Lo importante es que ese nido de mapaches llamado Manmajeon está aprovechándose del Gran Traslado. ¡Cooperan con la Wehrmacht nazi y pretenden vender a las estudiantes de Gehenna a esos adultos fascistas! Tenemos que publicitar que nuestro Comité, que no coopera con la Wehrmacht bajo ninguna circunstancia, se preocupa por Gehenna incluso más que Manmajeon.”"

 GEH_abolition_of_authority: "Suprimir la autoridad"
 GEH_abolition_of_authority_desc: "“¡No estoy diciendo que la jefa Hina no sea grandiosa! Solo que debemos reconocer que no es un superhumano que pueda hacer *todo* por nosotras. Pienso reunirme directamente con ella y discutir cómo yo, como administradora principal, y el Departamento de Planificación podemos encargarnos de una parte del trabajo de gobierno.”"

 GEH_prefect_team_democracy: "Democracia del Comité de Disciplina"
 GEH_prefect_team_democracy_desc: "Por ser una organización militar, el Comité de Disciplina arrastraba una imagen externa negativa: la de ‘señor de la guerra’. Para corregirlo, al menos debemos parecer una organización democrática y anti-autoritara. Reduciremos las actividades civiles del Departamento Ejecutivo fuertemente armado, y los burócratas —con Amau Ako al frente— liderarán el trabajo de cara a la población."

 GEH_relaxation_of_german_peoples: "Calmar al pueblo alemán"
 GEH_relaxation_of_german_peoples_desc: "El Comité de Disciplina —o más exactamente, Amau Ako— no confía en los llamados ‘adultos’ de Alemania. Pero, incluso reprimiendo su aversión hacia los locales, Ako saldrá ante la prensa regional para asegurar que no ocurrirá jamás algo como la ‘Masacre de Luxemburgo’ dentro del Comité, y que los alemanes nunca se convertirán en una ‘clase esclava’ de Gehenna."

 GEH_system_propaganda: "Propaganda del sistema"
 GEH_system_propaganda_desc: "Está claro que muchos alemanes conservadores no reciben con agrado a una nueva líder mujer. Ako considera que, en vez de promover al ‘gran líder [GEH.GetLeader]’, será mejor promover a la ‘gran organización: el Comité de Disciplina’, para reducir el rechazo local. Si aumenta el apoyo al Estado policial del Comité, el rechazo hacia la jefa también disminuirá de forma natural."

 GEH_heroism_propaganda: "Heroísmo del Comité de Disciplina"
 GEH_heroism_propaganda_desc: "Las reformas de la administradora principal Ako y del Departamento de Planificación se centran en recortar la autoridad del Departamento Ejecutivo y de Inteligencia, y transformar al Comité de un simple caudillaje en un Estado burocrático moderno. Claro: esto también busca aliviar la sobrecarga de Hina repartiendo el trabajo entre burócratas. Pero para calmar la ira creciente del Departamento Ejecutivo y de Inteligencia, debemos combinar una compensación mínima para el aparato militar con propaganda de heroísmo."

 GEH_sword_defending_gehenna_peoples: "La espada que protege al pueblo"
 GEH_sword_defending_gehenna_peoples_desc: "La administradora principal Ako ha reformado el Comité de Disciplina: de un simple caudillaje a un Estado-academia burocrático, y ha logrado atraer el apoyo de estudiantes de Gehenna y de locales alemanes. También fue un gran logro reducir la carga de Hina, que sufría por exceso de trabajo. Pero el resultado más importante es otro: gracias a nuestros esfuerzos, la gente ha empezado a vernos no como ‘señores de la guerra’, sino como ‘protectores de la sociedad’."

 ## Ruta normal ##
 GEH_main_route_focus: "El gobierno del Comité de Disciplina"
 GEH_main_route_focus_desc: "Las exigencias duras del Departamento Ejecutivo, que quería un sistema militarista, y las posturas moderadas de los tecnócratas del Departamento de Planificación chocaron sin descanso, como líneas paralelas. Al final, por decisión de [GEH.GetLeader], se impuso el “mantenimiento del statu quo”… pero, en un evento sin precedentes como el Gran Traslado, ¿es realmente lo correcto?"

 GEH_fortress_preparing_for_war: "Fortaleza anti-Trinity"
 GEH_fortress_preparing_for_war_desc: "¿Nuestro enemigo más amenazante es Manmajeon, o Trinity? Tal vez ambos lo sean, pero fortificar la frontera con Trinity implica una carga política mucho menor que fortificar la frontera con Manmajeon. La nueva fortaleza no será perfecta, pero al menos, si estalla la guerra, detendrá por un corto tiempo el ataque de Trinity."

 GEH_continuing_rule: "Armonizar el conflicto interno"
 GEH_continuing_rule_desc: "La política de statu quo nacida del choque entre el Departamento Ejecutivo y el Departamento de Planificación —y la frustración de las reformas— ha creado un conflicto político serio. La jefa del Comité admitirá que el fracaso no fue culpa de los departamentos, sino de su falta de liderazgo, y mediará la confrontación entre departamentos y las luchas de facciones internas."

 GEH_improving_relationships_with_manmajeon: "Mejorar relaciones con Manmajeon"
 GEH_improving_relationships_with_manmajeon_desc: "Ako mira con cinismo cualquier propuesta y dice que “hasta gastar 1 yen de Kivotos en mejorar relaciones es un desperdicio”, pero el Departamento de Inteligencia ve con preocupación que, tras el Gran Traslado, Manmajeon se ha vuelto mucho más fuerte que el Comité de Disciplina. Si no tenemos capacidad de meter tanques en el distrito central de Gehenna ahora mismo, quizá sea mucho mejor posponer la guerra."

 GEH_pursuing_peaceful_unification: "Buscar una unificación pacífica"
 GEH_pursuing_peaceful_unification_desc: "Es cierto que Manmajeon nos desagrada, pero para enfrentar amenazas externas como Trinity, necesitamos cooperar con ellas. Considerando lo excepcional del Gran Traslado, Manmajeon también podría contemplar seriamente cooperar con nosotras, al menos por ahora."

 GEH_preparing_for_civil_war: "Prepararse para la guerra civil"
 GEH_preparing_for_civil_war_desc: "¿Desde cuándo los mapaches de Manmajeon han estado tramando destruir al Comité? Es tan antiguo que ni lo recordamos. Debemos estar listas ante su ataque. Y para eso, es necesaria una militarización a fondo."

 GEH_bavaria_governance_method: "El Comité de Disciplina en Baviera"
 GEH_bavaria_governance_method_desc: "El Departamento de Planificación está cada vez más preocupado porque, sin reformas innovadoras, el Comité se ‘caudilliza’ gradualmente. Pero el Departamento Ejecutivo sostiene que un Estado caudillista no es necesariamente algo malo. Al fin y al cabo, caudillizarse significa concentrar el poder nacional en la defensa, y eso —según ellas— hará que los países vecinos sobreestimen la fuerza de Baviera."

 GEH_negotiation_with_german_delegation: "Negociar con la delegación alemana"
 GEH_negotiation_with_german_delegation_desc: "La jefa del Comité, [GEH.GetLeader], no es una mapache de Manmajeon y, a diferencia de ellas, jamás cooperará con los nazis. En su lugar, contactaremos a los restos socialdemócratas. A cambio de impulsar una reforma de la legislación laboral para los trabajadores, la organización del SPD alentará a los locales a alistarse en nuestro ejército, para derrotar a los dos males: Manmajeon y Trinity."

 GEH_institutional_stabilization: "Estabilización institucional"
 GEH_institutional_stabilization_desc: "Había muchas predicciones pesimistas: que, por el statu quo, el Comité fracasaría al estabilizar Baviera. Sin embargo, aún teníamos capacidad suficiente para mantener el orden y gobernar Baviera. Hemos logrado destruir al Partido Popular de Baviera pro-nazi, y estamos tomando el control administrativo de todas las ciudades."

 GEH_industrial_development: "Desarrollo industrial"
 GEH_industrial_development_desc: "Se diseñó una política de fomento de la industria pesada para revitalizar la industria de Baviera, liderada por los tecnócratas del Departamento de Planificación. Las poblaciones de hombres-bestia y robots de Kivotos que perdieron su empleo tras el Gran Traslado también podrán encontrar trabajo en las nuevas fábricas."

 # Chapter: 2
 GEH_Conquer_the_Central: "Ofensiva sobre el Distrito Central"
 GEH_Conquer_the_Central_desc: "La Blitzkrieg contra el Distrito Central es una de las operaciones militares planificadas para que el Comité de Disciplina tome el control del centro de Gehenna. Debemos golpear directamente el núcleo de poder de Manmajeon para quebrar su moral y asegurar una ventaja estratégica."

 GEH_Officer_Appeasement: "Captar a los ejecutivos"
 GEH_Officer_Appeasement_desc: "Es bien sabido que Manmajeon se gestiona como un liderazgo corrupto y bastante incompetente en comparación con el Comité de Disciplina. Podremos atraer a nuestro lado a ejecutivos capaces que no fueron promovidos solo por no tener suficiente cercanía personal con [GEM.GetLeader]."

 GEH_no_more_Heer: "Imponer disciplina"
 GEH_no_more_Heer_desc: "Debemos exigir a las estudiantes que sirven en el Comité de Disciplina que respeten la disciplina y cumplan adecuadamente las normas civiles. Tenemos que construir la reputación de que el Comité es una fuerza de combate poderosa, disciplinada y digna de respeto."

 GEH_get_legitimacy: "Asegurar legitimidad"
 GEH_get_legitimacy_desc: "La legitimidad no es como un juego de cartas: no se obtiene sacando una nueva carta de póker sin más. Debemos ganar apoyo popular tanto entre los gehenienses como entre los alemanes mediante actividades activas de seguridad; gestionar la popularidad de la jefa [GEH.GetLeader] con propaganda; y demostrar, con políticas reales, que no somos simples caudillos, sino quienes merecen representar a Gehenna."

 GEH_get_legitimacy_trigger_tt: "@GEM§Y[GEM.GetName]§! se ha integrado con @GEA§Y[GEA.GetName]§!"

 GEH_focus_8: "Gran ofensiva"
 GEH_focus_8_desc: "Para destruir por completo a Manmajeon, no debemos detener la ofensiva. Aplastaremos a Manmajeon desde fuera con tácticas extremadamente agresivas… aunque eso nos cause grandes daños también."

 GEH_Securing_supplies: "Asegurar suministros"
 GEH_Securing_supplies_desc: "Asegurar suministros para la guerra que se aproxima contra Manmajeon es un asunto crucial. Por suerte, impulsada por el rechazo hacia Manmajeon —que mantiene vínculos estrechos con la Wehrmacht—, la organización del SPD saqueó y nos proporcionó activos físicos como oro, que el régimen nazi mantenía en bancos de Baviera."

 GEH_Armoury_Raid: "Asalto al arsenal"
 GEH_Armoury_Raid_desc: "Tras el Gran Traslado, la cantidad de fábricas abandonadas y mal administradas sigue siendo tan grande que ni siquiera aparece en las estadísticas. El Departamento de Inteligencia ha planeado una operación relámpago para trasladar rápidamente a nuestra zona de control instalaciones industriales que Manmajeon aún no ha asegurado. Manmajeon se dará cuenta tarde de lo que dejó escapar… pero para entonces, ya será demasiado tarde."

 GEH_Pandemonium_Society_Building_Control: "¡Reúnan a las masas!"
 GEH_Pandemonium_Society_Building_Control_desc: "El Comité de Disciplina debe guiar a las masas para derribar la tiranía de Manmajeon. ¡No solo a las estudiantes de la academia: reunamos a toda la población de Kivotos que vive en Gehenna y hagámosla participar en la revolución!"

 # Chapter 3
 GEH_first_congress_focus: "3.ª Asamblea del Comité de Disciplina"
 GEH_first_congress_focus_desc: "Superando toda adversidad, el Comité de Disciplina ha aparecido con una presencia abrumadora en la caótica política de Kivotos. Muchas miembros alzan la voz: debemos convocar una asamblea para prepararnos para el futuro y cambiar Gehenna."

 GEH_Army_Reformation: "Reorganizar el Departamento Ejecutivo"
 GEH_Army_Reformation_desc: "El Departamento Ejecutivo es, a día de hoy, la sección encargada de la defensa de Gehenna. En la guerra reciente contra Manmajeon, quedaron expuestos defectos importantes en el Departamento Ejecutivo."

 GEH_Leverage_Perfect_team_strengths: "Especialización del Departamento Ejecutivo"
 GEH_Leverage_Perfect_team_strengths_desc: "Las capacidades de los kivotianos con Halo superan con creces a las tropas locales. Si refinamos al Departamento Ejecutivo y formamos a cada integrante como personal de élite, el poder militar de Gehenna aumentará de manera significativa."

 GEH_army_focus_tt: "§gUn enfoque de reforma militar basado en fuerzas reducidas pero muy poderosas.§!"
 GEH_army_focus_2_tt: "§gUn enfoque de reforma militar sin rasgos especiales, pero sólido y equilibrado.§!"

 GEH_look_to_the_west: "Lecciones de la guerra"
 GEH_look_to_the_west_desc: "La guerra civil contra Manmajeon nos enseñó que esto no es una escaramuza como las de Kivotos: necesitamos fuerzas militares a gran escala. Ha llegado el momento de considerar incorporar de forma más activa a personal local sin Halo y aumentar el tamaño del ejército."

 GEH_Gehenna_Rebuilding: "El plan del Departamento de Planificación"
 GEH_Gehenna_Rebuilding_desc: "El plan económico diseñado por la administradora principal Amau Ako será de gran ayuda para una economía de Gehenna que se movía de forma improvisada. El documento ya ha sido entregado a la jefa del Comité."

 GEH_approve_plan: "Asignación presupuestaria"
 GEH_approve_plan_desc: "La jefa del Comité aprobó el plan económico de Amau Ako y se asignó el presupuesto correspondiente. Bajo un plan riguroso y perfecto, Amau Ako reactivará la economía de Gehenna."

 GEH_first_five_year_plan: "Primer plan quinquenal"
 GEH_first_five_year_plan_desc: "Mientras dure la paz, debemos impulsar la industrialización aún más rápido según el plan. Como podemos heredar los planes de industrialización del antiguo gobierno alemán, nuestra industrialización se está acelerando todavía más."

 GEH_nationalise_railways: "Ferrocarriles de Gehenna"
 GEH_nationalise_railways_desc: "Lo que conecta a Gehenna no son solo las carreteras: el ferrocarril también es su línea de vida. Tras la última guerra, muchas vías quedaron gravemente dañadas, y la Highlander Railway Academy alega que “los ferrocarriles construidos por el gobierno alemán no son nuestra responsabilidad”. Al final, quienes los necesitamos somos nosotras, así que las reparaciones deberán salir de nuestro presupuesto."

 GEH_factory_focus_1: "Reutilizar fábricas abandonadas"
 GEH_factory_focus_1_desc: "Mientras el Departamento Ejecutivo investigaba el oeste de Gehenna, se descubrió una vasta zona de fábricas siguiendo el curso de un río. Según la investigación del Departamento de Inteligencia, era un cinturón industrial creado en secreto por el antiguo régimen de Adolf Hitler para rearmarse violando el Tratado de Versalles. ¿No es mejor que lo usemos nosotras, en vez de dejar que lo usen los nazis?"

 GEH_factory_focus_3: "Fondo de defensa"
 GEH_factory_focus_3_desc: "Durante la unificación de Gehenna gastamos enormes costos de guerra. Para reconstruir el país, planeamos organizar una recaudación de fondo de defensa entre el pueblo de Gehenna. Como será una contribución voluntaria, tendrá límites, pero al menos nos dará tiempo para sanar las heridas del proceso de unificación."

 GEH_factory_focus_4: "Reorganización de la industria pesada"
 GEH_factory_focus_4_desc: "En el proceso de desarrollar la industria pesada, detectamos la entrada de capital kivotiano corrupto. Si erradicamos la corrupción y controlamos el desarrollo bajo la dirección del gobierno de Gehenna para que nuevas empresas crezcan sin colusión, nuestra capacidad industrial seguirá aumentando."

 GEH_factory_focus_6: "Aumento de producción"
 GEH_factory_focus_6_desc: "Los métodos de producción propios de Gehenna no pueden, por sí solos, superar a otras academias. Debemos implementar nuevas formas de producción e introducir nuevas tecnologías para igualarlas o superarlas."

 GEH_control_market_investment: "Inversión de mercado dirigida"
 GEH_control_market_investment_desc: "Activaremos diversas inversiones de mercado en las empresas dirigidas, que constituyen una gran parte de nuestra política económica, subordinando el capital interno al Comité de Disciplina y formando una estructura de mercado flexible y realista."

 GEH_prefect_team_priority: "El Comité de Disciplina primero"
 GEH_prefect_team_priority_desc: "No debemos olvidar el deber fundamental: todas las políticas económicas deben operar, en última instancia, por el Comité de Disciplina y sus miembros. Consideraremos la operación del Comité como la máxima prioridad en nuestra política económica."

 GEH_vertical_integration: "Integración vertical"
 GEH_vertical_integration_desc: "Llevaremos a cabo múltiples programas económicos bajo la burocracia optimizada del Comité. Mediante integración vertical y dirección central, construiremos una estructura económica eficiente en muchos aspectos."

 GEH_Cooperation_with_HID: "Expandir el Departamento de Inteligencia"
 GEH_Cooperation_with_HID_desc: "Es bien sabido que Sorasaki Hina proviene originalmente del Departamento de Inteligencia. Aunque no a todo el mundo le agraden sus actividades secretas, todas reconocerán que es crucial conocer al enemigo con antelación y responder a tiempo."

 GEH_hit_wehrmacht: "Atacar a la Wehrmacht"
 GEH_hit_wehrmacht_desc: "Aunque ya aniquilamos por completo a la Wehrmacht en Baviera, organizaciones como tumores siguen resistiendo en toda Alemania occidental. Son el cáncer de Gehenna: no debemos mostrarles la menor misericordia."

 GEH_hit_wehrmacht_2: "Tomar control de los gobiernos regionales"
 GEH_hit_wehrmacht_2_desc: "Si asumimos los gobiernos regionales alemanes, podremos reducir la carga administrativa del Comité y asegurar fácilmente el control sobre las autoridades locales."

 GEH_HID_benriya: "Dudas sobre la soberanía de Luxemburgo"
 GEH_HID_benriya_desc: "El Gran Ducado de Luxemburgo es el único estado local de Europa Occidental que ha preservado su forma de gobierno tras el Gran Traslado. El problema es que, tras el Gran Traslado, gran parte de los luxemburgueses fueron reemplazados por población de Gehenna, y la presencia de Aru —que protege Luxemburgo— también supone una amenaza para nosotras. Los halcones del Comité exigen una guerra preventiva contra Luxemburgo."

 GEH_benriya_annex: "Convertir Luxemburgo en territorio directo"
 GEH_benriya_annex_desc: "El Estado llamado Gran Ducado de Luxemburgo será disuelto, y Rikuhaichima Aru y sus camaradas serán expulsadas tras un juicio. Esto puede ser cruel para ellas, pero Luxemburgo, que ya tiene una población gehenna suficientemente grande, es una presa ideal para “gehennaizar”."

 GEH_benriya_tolerate: "Agencia 68 adscrita al Comité de Disciplina"
 GEH_benriya_tolerate_desc: "No es una elección racional desperdiciar el talento de la Agencia 68 solo por anexar un pequeño país. Permitamos que Rikuhaichima Aru mantenga su autogobierno en Luxemburgo. A cambio, la Agencia 68 será nombrada como cuadro del Comité, y tendrá el deber de ser leal al Comité de Disciplina en tiempos de crisis nacional."

 GEH_HID_trinity: "Ojos en la oscuridad"
 GEH_HID_trinity_desc: "Aunque el Comité haya vencido a Manmajeon, todavía pueden existir personas dentro que hayan conspirado con ellas. Debemos vigilarlas y registrarlas desde donde no se vea."

 GEH_HID_millennium: "Sistema de vigilancia militar"
 GEH_HID_millennium_desc: ""
 GEH_preventive_attack: "“Guerra preventiva”"
 GEH_preventive_attack_desc: ""

 GEH_Army_focus_1: "Mejora del equipamiento"
 GEH_Army_focus_1_desc: "Por su origen como institución de seguridad, el Comité de Disciplina arrastraba la limitación de que la calidad del armamento provisto a sus miembros no alcanzaba el nivel de un ejército regular. En la unificación de Gehenna comprobamos que el nivel de armamento del Comité era inferior al de los soldados de Manmajeon, y se está debatiendo una inversión presupuestaria para corregirlo."

 GEH_Army_focus_3: "Desarrollo de artillería de campaña"
 GEH_Army_focus_3_desc: "En el Kivotos anterior al Gran Traslado, Sorasaki Hina por sí sola era la mayor potencia de fuego del Comité. Pero con la expansión territorial y el agotamiento del misterio, ya no es posible librar guerras como antes. La alternativa es ampliar la artillería y reproducir (aunque sea un poco) el poder del misterio de Kivotos mediante fuerzas de artillería."

 GEH_Army_focus_2: "Adaptación al terreno"
 GEH_Army_focus_2_desc: "Se acabaron los tiempos hermosos en los que bastaba con luchar solo en combate urbano contra la Helmet Gang en las amplias carreteras del distrito autónomo de Gehenna. Ahora el Comité debe prepararse para combates en montañas, colinas, bosques y llanuras. Necesitamos invitar a graduadas ex-SRT, entre otras, y crear manuales tácticos pensados para luchar en todo tipo de terrenos."

 GEH_DNVP_focus_3: "[GEH_DNVP_focus_3_text]"
 GEH_DNVP_focus_3_desc: "Con las lecciones de la guerra, llevaremos a cabo reformas sobre el Departamento Ejecutivo."

 GEH_DNVP_focus_3_1: "Expandir el Departamento Ejecutivo"
 GEH_DNVP_focus_3_1_desc: "El Departamento Ejecutivo es el Ministerio de Defensa de Gehenna, y esta guerra demostró que debe ser más grande y de escala mucho mayor. Si reclutamos más miembros y ampliamos su tamaño, podremos resolver futuras crisis de seguridad."

 GEH_DNVP_focus_3_2: "Acelerar la élite"
 GEH_DNVP_focus_3_2_desc: "Tras el Gran Traslado, entendimos que la diferencia física entre los kivotianos con Halo y los humanos sin Halo es abismal. Quizá sea mejor concentrarnos en un pequeño ejército de élite que en una gran masa de soldados débiles sin Halo."

 GEH_Army_focus_5: "Núcleo de élite"
 GEH_Army_focus_5_desc: "Hay muchas miembros en el Comité de Disciplina, pero solo una minoría participó en la guerra de unificación. Esto nos enseña dos cosas: arrojar grandes cantidades de gente al frente es ineficiente, y la formación sistemática de personal de élite es más importante que cualquier otra cosa."

 GEH_prefect_army_focus_2: "Armas combinadas"
 GEH_prefect_army_focus_2_desc: "La cooperación de un sistema de mando rápido y orgánico produjo, en el campo de batalla del nuevo mundo, los mejores resultados en reducción de pérdidas. Debemos introducir cuanto antes la cooperación de armas combinadas, aunque todavía esté en fase experimental."

 GEH_prefect_army_focus_3: "Formación exhaustiva del Estado Mayor"
 GEH_prefect_army_focus_3_desc: "Antes del Gran Traslado, el poder de combate del Comité dependía de manera deformada únicamente de la fuerza y el mando de Sorasaki Hina. Con una formación sistemática, podremos responder al enemigo incluso cuando Hina ya no pueda estar al frente de cada batalla como antes."

 GEH_prefect_DNVP_focus_3: "Departamento especial de oficiales del Comité"
 GEH_prefect_DNVP_focus_3_desc: "Nuestro plan de élite para el Comité se está cumpliendo con éxito. Para apoyar plenamente a las estudiantes que destacan en cada guerra, el Comité decidió crear un Departamento Especial de Oficiales y respaldarlas a fondo."

 GEH_Army_focus_6: "Ampliar el reclutamiento"
 GEH_Army_focus_6_desc: "Tras el Gran Traslado, el Comité de Disciplina mantuvo una distancia constante con los locales alemanes. Pero después de la guerra contra Manmajeon, los kivotianos se han convertido en una minoría dentro de Gehenna; y sin reclutar más mano de obra local, la conclusión es clara: será imposible contar con una fuerza defensiva capaz de proteger Gehenna."

 GEH_west_army_focus_2: "Aprovechar nuevas armas"
 GEH_west_army_focus_2_desc: "El tanque Toramaru de Manmajeon —que resistió hasta el final en la guerra de unificación y fue finalmente derrotado por nuestras fuerzas— dejó una fuerte impresión en la directiva del Comité. Las divisiones acorazadas son una nueva arma que liderará al Comité en el futuro; aunque sean costosas, valen la inversión."

 GEH_west_army_focus_3: "Mediar el conflicto entre Ejecutivo y Planificación"
 GEH_west_army_focus_3_desc: "Tras el Gran Traslado, el Departamento Ejecutivo —que actúa de facto como Ministerio de Defensa— y el Departamento de Planificación —una organización tecnócrata que se encarga de administración y economía— no se llevan precisamente bien. Independientemente de la relación personal entre sus líderes, Iori y Ako, el conflicto de facciones entre departamentos dificulta asignar el presupuesto militar de forma eficiente. No podemos eliminar por completo esas tensiones, pero al menos es posible intentar “reducirlas”."

 GEH_west_DNVP_focus_3: "Academia de oficiales dentro de la escuela"
 GEH_west_DNVP_focus_3_desc: "Tras el Gran Traslado, comprendimos cómo debemos mandar a los soldados en este nuevo campo de batalla, y creamos un nuevo curso de adaptación para la tropa común del Departamento Ejecutivo. No podemos convertir a cada soldado en élite, pero sí podemos ayudar a que cada uno cumpla su papel."

 GEH_Army_focus_7: "El nuevo ejército de Gehenna"
 GEH_Army_focus_7_desc: "¡Alcen la bandera de Gehenna y anuncien al enemigo que el Comité de Disciplina ha llegado! Nuestro desarrollo militar es un logro que ningún líder de Gehenna había alcanzado hasta ahora. El nombre ‘Comité de Disciplina de Gehenna’ quedará en la historia como una palabra que hace temblar de miedo a los países vecinos."

 dldhfl_flag: "$BA_news.52.t$"
 #Capítulo 4

 GEH_Trinity_war: "Plan de invasión a Trinity"
 GEH_Trinity_war_desc: "Gehenna y [TRM.GetName] han sido enemigos tradicionales, y es evidente que la sola existencia de [TRM.GetLeader] supone una grave amenaza para nuestra seguridad. Si se están preparando para invadirnos, entonces debemos atacarlas primero."

 GEH_war_factory_focus_1: "Expandir instalaciones militares"
 GEH_war_factory_focus_1_desc: "Para el decisivo choque de Edén contra Trinity, Gehenna debe contar con la capacidad de producir suministros militares a largo plazo. Debemos ampliar nuestras instalaciones y preparar una capacidad estratégica para sostener una guerra prolongada."

 GEH_war_factory_focus_3: "Adquirir industria subterránea"
 GEH_war_factory_focus_3_desc: "El choque de Edén nace de la ambición de Trinity por destruir por completo a Gehenna. Si esta guerra termina con la victoria de Trinity, no quedará en Gehenna ni una sola brizna de hierba. Por eso, confiscar y aprovechar los bienes de las organizaciones criminales es, en cierto sentido, una política “ágape” que incluso contempla el futuro de los propios criminales."

 GEH_war_factory_focus_4: "Artillería de campaña de Gehenna"
 GEH_war_factory_focus_4_desc: "Artillería de campaña propia de Gehenna, mejorada directamente por los técnicos del Comité de Disciplina. Ya estamos listos para pulverizar la artillería de Trinity con una potencia de fuego abrumadora. Claro… cuánto podrá brillar esta nueva arma, solo lo sabremos en el campo de batalla."

 GEH_war_focus_2: "Fundar el Departamento de Propaganda"
 GEH_war_focus_2_desc: "El choque de Edén es un acontecimiento sin precedentes en toda la historia de Gehenna. Y debemos utilizar todos los recursos disponibles. Fundaremos un Departamento de Propaganda para difundir los logros del Comité durante la guerra y ampliar el apoyo hacia nosotras."

 GEH_war_focus_3: "Prioridad: defender Gehenna"
 GEH_war_focus_3_desc: "Nuestro objetivo más importante es proteger Gehenna del ataque de Trinity. Es momento de concentrarnos en la defensa y reafirmar nuestra determinación de no retroceder ni un solo paso."

 GEH_unlimited_conscription: "Eliminar límites al reclutamiento"
 GEH_unlimited_conscription_desc: ""

 GEH_chinatsu_focus_1: "Reforzar el Departamento Médico"
 GEH_chinatsu_focus_1_desc: "Por falta de una base política, el Departamento Médico nunca ha recibido un trato adecuado. Pero en tiempos de guerra, para reducir las bajas del Comité de Disciplina, su apoyo es absolutamente vital."

 GEH_chinatsu_focus_2: "Unidades médicas"
 GEH_chinatsu_focus_2_desc: "La creación de nuevas unidades médicas no se limitará a tratar a las miembros evacuadas a retaguardia: es un intento de introducir el concepto de hospital de campaña, algo a lo que el Comité nunca estuvo acostumbrado."

 GEH_chinatsu_focus_4: "¡Mujeres del frente!"
 GEH_chinatsu_focus_4_desc: "Aunque el Comité de Disciplina no ve a los oportunistas locales como algo más que eso, hay locales que no pierden ocasión para intentar meter la mano en la política de Gehenna. Aun así, la radical feminista alemana Anita Augspurg alaba que el Comité sea una organización formada solo por mujeres y promete que, si se logra una negociación revolucionaria sobre los derechos laborales de las mujeres alemanas, impulsará de forma organizada el alistamiento de feministas en el ejército."
 #Anita Augspurg

 GEH_war_focus_7: "Plan de defensa de Gehenna"
 GEH_war_focus_7_desc: "Con el ejército de Trinity amenazando nuestro territorio, necesitamos la mejor estrategia para defender la patria. No podemos retroceder ni un solo paso."

 GEH_war_focus_8: "Plan de reconquista de Gehenna"
 GEH_war_focus_8_desc: "Ha llegado el momento de preparar la reconquista de los territorios perdidos por la feroz ofensiva enemiga y, a la vez, prepararnos para avanzar contra Trinity."

 GEH_war_focus_9: "Plan de ofensiva contra Trinity"
 GEH_war_focus_9_desc: "Estamos listos para derrotar al ejército de [TRM.GetLeader] y clavar la espada en el corazón del enemigo. ¡Llevemos a cabo la ofensiva por la gloria de Gehenna! ¡Larga vida a [ROOT.GetLeader]! ¡Que la libertad de Gehenna nunca se apague!"

 # Reforma naval
 GEH_prefect_team_navy: "Militarizar la Sección Naval del Comité de Disciplina"
 GEH_prefect_team_navy_desc: "El Comité ha pasado de ser una potencia interior a convertirse en una nación marítima con costa, y se pone en marcha el primer proyecto para transformar la fuerza naval —hasta ahora una simple guardia de ríos y lagos— en un “ejército” organizado."

 GEH_prefect_team_navy_marine: "Infantería de Marina"
 GEH_prefect_team_navy_marine_desc: "Para golpear a enemigos al otro lado del mar, se abrió el debate sobre formar una pequeña fuerza de infantería de marina centrada en locales. En los momentos más peligrosos, podremos tomar medidas internacionales firmes contra enemigos de Kivotos como [GEI.GetName]."

 GEH_prefect_team_navy_disciplinary_committee: "Sección Naval del Departamento Ejecutivo"
 GEH_prefect_team_navy_disciplinary_committee_desc: "A medida que la policía marítima del Comité se militariza, se debate si debe convertirse en un departamento independiente. Como se estima que el tamaño de la marina de Gehenna no será grande, integraremos la marina como una sub-sección (“Sección Naval”) dentro del Departamento Ejecutivo existente, en vez de separarla como organización propia."

 GEH_prefect_team_navy_disciplinary_committee_transport: "Más allá del tubo"
 GEH_prefect_team_navy_disciplinary_committee_transport_desc: "Incluso antes del Gran Traslado, el Comité usaba tubos especiales para operar en la costa… pero ya no podemos limitarnos a flotar y transportar personal solo con tubos. Reforzar los transportes navales será el motor que nos permita llegar más lejos."

 GEH_prefect_team_navy_disciplinary_committee_submarine: "Un enfoque seguro"
 GEH_prefect_team_navy_disciplinary_committee_submarine_desc: "Durante el entrenamiento naval antes del Gran Traslado, el Comité comprendió que incluso la persona más fuerte no puede vencer el poder de las profundidades, al ver a la jefa Sorasaki Hina saltar al mar para nadar en combate… y hundirse tal cual. No era una burla hacia Hina, pero a partir de esa experiencia, el Departamento Ejecutivo sostiene que debemos aprovechar más activamente el “poder bajo el mar”."

 GEH_prefect_team_navy_disciplinary_committee_destroyer: "Marina costera"
 GEH_prefect_team_navy_disciplinary_committee_destroyer_desc: "Las actividades del Comité de Disciplina siempre se han limitado a tierra. En el Departamento Ejecutivo no hay especialistas que sepan realmente del mar, y debemos aceptar la realidad: será difícil que nuestra marina vaya más allá de una fuerza costera. Aunque fabriquemos pequeños destructores baratos, ni siquiera contamos con una institución para formar a los oficiales que los operen. Podremos construir unos pocos destructores, pero no esperaremos más que eso."

 GEH_prefect_team_navy_disciplinary_committee_defense: "Defensa costera"
 GEH_prefect_team_navy_disciplinary_committee_defense_desc: "Seamos sinceras: nadie puede asegurar que la marina del Departamento Ejecutivo pueda vencer a otra marina. Incluso si lucháramos contra un crucero turístico de la Academia de Odysseia, es casi seguro que nuestros destructores se hundirían primero. Con el visto bueno de [ROOT.GetLeader], asumiremos que en el mar acabaremos perdiendo y nos enfocaremos en construir fortalezas marítimas para negar el desembarco enemigo."

 GEH_prefect_team_navy_disciplinary_committee_officer: "Reclutar ex policías marítimos de Valkyrie"
 GEH_prefect_team_navy_disciplinary_committee_officer_desc: "¿Alguna de nosotras ha pilotado un barco? No, no cuenta haberlo manejado en ese juego aburrido de Millennium llamado ‘Hearts of Kivotos’. Exacto: nadie. Traer instructores de la academia policial Valkyrie es la única alternativa. Tendremos que pagar bastante… pero será mejor que ustedes, que solo han ‘manejado barcos’ con un control de consola."

 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD: "Comprar BD de Valkyrie"
 GEH_prefect_team_navy_disciplinary_committee_valkyrie_BD_desc: "Como no tenemos capacidad para operar doctrina naval normal, lo ideal será comprar los BD educativos que usaba la policía marítima Valkyrie e imitarlos tal cual. Eso sí: al ser un programa de policía marítima, probablemente no sirva para grandes batallas navales."

 GEH_prefect_team_independent_navy: "Kriegsmarine de Gehenna"
 GEH_prefect_team_independent_navy_desc: "Los cobardes dicen que Gehenna nunca ha formado una marina y que, por eso, una marina oceánica es una fantasía. Pero que la gran Gehenna, guiada por la grandiosa jefa Sorasaki Hina, opere una simple marina costera no solo es vergonzoso: es un insulto a [ROOT.GetLeader]. Una gran patria necesita una gran marina, y las opositoras cobardes serán atadas de pies y manos y arrojadas al Mar del Norte."

 GEH_prefect_team_independent_navy_carrier: "Portaaviones clase Sorasaki"
 GEH_prefect_team_independent_navy_carrier_desc: "Poseemos tecnología más avanzada que la de los locales, y por eso también sabemos a largo plazo qué final le espera a un ‘acorazado’ majestuoso. El inicio más racional de una marina oceánica debe ser un grupo de portaaviones. Y se ha aprobado el plan de construir el portaaviones clase Sorasaki, bautizado con el nombre de Sorasaki Hina, la madre de la gran Gehenna."

 GEH_prefect_team_independent_navy_navalized_aircraft: "Plan de aeronaves embarcadas"
 GEH_prefect_team_independent_navy_navalized_aircraft_desc: "Introduciremos tecnología de aeronaves embarcadas más avanzada para que los portaaviones de Gehenna puedan proyectarse mucho más lejos."

 GEH_prefect_team_independent_navy_destroyer: "Expansión de la flota"
 GEH_prefect_team_independent_navy_destroyer_desc: "Los países vecinos no esperarán eternamente a que construyamos una marina oceánica. Aunque cueste un presupuesto enorme, debemos expandir la flota con rapidez."

 GEH_prefect_team_independent_navy_dockyard: "Distrito de astilleros de Gehenna"
 GEH_prefect_team_independent_navy_dockyard_desc: "¡Nuestra gran flota exige aún más presupuesto! Se construirá el distrito de astilleros más grande y grandioso posible en nuestras ciudades costeras."

 GEH_prefect_team_independent_navy_german_officer: "Entrenamiento de oficiales al estilo alemán"
 GEH_prefect_team_independent_navy_german_officer_desc: "Con la ayuda de oficiales navales alemanes que viven en territorio de Gehenna, debemos formar a jóvenes oficiales capaces que lideren nuestra nueva marina."

 GEH_prefect_team_independent_navy_oil: "Petróleo milagroso"
 GEH_prefect_team_independent_navy_oil_desc: "Una marina oceánica requiere enormes cantidades de petróleo. Pero en estas tierras alemanas no podemos extraer crudo. Importar petróleo del extranjero es razonable, pero en un escenario de guerra podrían interrumpirse los suministros. Esa es una razón perfectamente lógica para invertir en la industria de petróleo sintético."

 # Reforma aérea
 GEH_prefect_team_luftwaffe: "Luftwaffe de Gehenna"
 GEH_prefect_team_luftwaffe_desc: "El Comité de Disciplina era, ante todo, una organización de seguridad, y no tenía una fuerza aérea organizada. Puede que Manmajeon tuviera algunos aviones, pero nosotras contactamos con la aerolínea “Junkers”, que sufrió la violación de sus derechos de propiedad por parte de los nazis y recuperó su libertad gracias a nuestro movimiento anti-nazi. Con su ayuda, la Luftwaffe de Gehenna alza el vuelo hacia cielos brillantes."

 GEH_prefect_team_luftwaffe_primitive_helicopter: "Helicóptero primitivo"
 GEH_prefect_team_luftwaffe_primitive_helicopter_desc: "Incluso antes del Gran Traslado, el Comité poseía varios helicópteros. Pero como después del Gran Traslado no teníamos forma de producirlos por nuestra cuenta, entregamos uno a Junkers y propusimos hacer ingeniería inversa. Sus ingenieros apenas entendieron una estructura con décadas de ventaja tecnológica… aun así, lograron crear por ingeniería inversa una aeronave primitiva que vuela con hélices."

 GEH_prefect_team_luftwaffe_true_helicopter: "Helicóptero de Gehenna"
 GEH_prefect_team_luftwaffe_true_helicopter_desc: "Los primeros helicópteros de Junkers eran bastante toscos, pero tras dominar Gehenna por completo y conseguir más materiales y datos, se hizo posible reconstruir helicópteros modernos."

 GEH_prefect_team_luftwaffe_junkers: "Expandir Junkers de Gehenna"
 GEH_prefect_team_luftwaffe_junkers_desc: "Gracias a la cooperación entre empresarios locales y kivotianos, Junkers de Gehenna está creciendo. Como no tenemos tecnología aérea propia, la ayuda de una empresa alemana es desesperadamente necesaria. Apoyemos la expansión de Junkers para que siga desarrollando la mejor fuerza aérea para Gehenna."

 GEH_prefect_team_luftwaffe_therese_junkers: "Therese Junkers"
 GEH_prefect_team_luftwaffe_therese_junkers_desc: "Junkers fue una de las empresas que sufrieron la represión más cruel por parte de los nazis. Su antiguo representante, Hugo Junkers, murió tras quedar bajo arresto domiciliario, y su esposa Therese Junkers, que asumió el liderazgo tras su muerte, fue forzada por amenazas nazis a ceder todos los derechos de la empresa al régimen de Hitler en 1935. Pero los tiempos han cambiado: Therese recuperó todos los derechos sobre Junkers y está lista para invertir en nuevas investigaciones de aviones por el bien de Gehenna."

 GEH_prefect_team_luftwaffe_fighter_design: "Investigación de cazas"
 GEH_prefect_team_luftwaffe_fighter_design_desc: "Con la cooperación de Junkers, podremos ampliar una fuerza aérea aún más avanzada."

 GEH_prefect_team_luftwaffe_tactical_bombers: "Plan de bombardeo táctico"
 GEH_prefect_team_luftwaffe_tactical_bombers_desc: "Junkers nos presentó nuevos diseños de bombarderos, y parecen tener valor suficiente para uso real en combate."

 GEH_prefect_team_luftwaffe_multi_role_aircraft: "Plan de innovación aérea"
 GEH_prefect_team_luftwaffe_multi_role_aircraft_desc: "Para prepararnos para la guerra contra países vecinos como Trinity, necesitamos armas aéreas más innovadoras y avanzadas. Con la ayuda de Therese Junkers y los excelentes ingenieros que ha contratado, podremos preparar un plan de reforma aérea aún más “innovador”. La documentación de financiación de [ROOT.GetLeader] ya ha sido aprobada."

 GEH_prefect_team_luftwaffe_long_range_bombing: "El Comité jamás podrá huir"
 GEH_prefect_team_luftwaffe_long_range_bombing_desc: "Empezamos a debatir un nuevo plan de bombardeo estratégico para volar largas distancias y atacar la retaguardia enemiga. Los ingenieros kivotianos recién incorporados a Junkers dicen que no es una fantasía: es un plan totalmente realizable."

 GEH_prefect_team_luftwaffe_jet: "Encender motores"
 GEH_prefect_team_luftwaffe_jet_desc: "¡Mejores motores, y cazas que vuelen más rápido! El esfuerzo de los ingenieros kivotianos por fin empieza a dar frutos."

 GEH_prefect_team_luftwaffe_anti_air: "Red antiaérea de Gehenna"
 GEH_prefect_team_luftwaffe_anti_air_desc: "Mientras desarrollamos nuestra fuerza aérea, otros países como Trinity también estarán formando la suya. No es razonable pensar solo en atacar: también debemos prepararnos para defendernos."

 GEH_prefect_team_luftwaffe_nuke: "Capítulo final"
 GEH_prefect_team_luftwaffe_nuke_desc: "¿De verdad terminamos todos los preparativos? ¿Podemos decir que ya hemos preparado todo lo que es posible desde el cielo? …¿No habrá algo… que se nos esté escapando?"

 #Capítulo 5
 GEH_three_congress_focus: "4.ª Asamblea del Comité de Disciplina"
 GEH_three_congress_focus_desc: "Tras el paso de la ola, quedaron en pie el Comité de Disciplina y Gehenna, firmes sobre sus dos pies, y los días de Kivotos se han vuelto un pasado tan lejano que casi parece un sueño.\nMuchas miembros alzan la voz: debemos convocar la 4.ª Asamblea del Comité. Y en esta asamblea, se decidirá nuestro futuro."
 GEH_three_congress_focus_trigger: "Completar 3 o más enfoques en el árbol inferior del enfoque §Y$GEH_Army_Reformation$§!"
 GEH_three_congress_focus_tt: "§CSorasaki Hina ya no se derrumbará nunca más.§!"
 GEH_three_congress_focus_no_hina: "Un día sin la jefa del Comité"
 GEH_three_congress_focus_no_hina_desc: "Tras una larga noche impregnada de una oscuridad ominosa… ocurrió lo que jamás debió ocurrir.\nLa jefa del Comité de Disciplina, Sorasaki Hina, está ausente en este momento. Debemos resolver la situación con urgencia."
 GEH_three_congress_focus_no_hina_can_only_be_completed_by_focus_tt: "Este enfoque comenzará automáticamente si §Y$GEH_hina$§! §Sse derrumba§!."
 GEH_BTBOTS_END_flag: "§Y$GEH_hina$§! está en estado de §Sderrumbada§!"
 GEH_BTBOTS_END_NEXT_flag: "Hemos manejado con éxito el vacío dejado por §Y$GEH_hina$§!"
 GEH_three_congress_focus_no_hina_htt: "Como hemos entrado en el árbol de enfoques §Y$GEH_hina_route_focus$§!, ocurrirá el mayor cambio político dentro del Comité."
 GEH_three_congress_focus_no_hina_att: "Como hemos entrado en el árbol de enfoques §Y$GEH_ako_route_focus$§!, §Y$GEH_dkzh$§! tomará el poder."
 GEH_three_congress_focus_no_hina_ctt: "Como hemos entrado en el árbol de enfoques §Y$GEH_iori_route_focus$§!, §Y$GEH_dldhfl$§! tomará el poder."
 GEH_three_congress_focus_no_hina_ntt: "Como mantuvimos el equilibrio político del Comité, §Y$GEH_dkzh$§! ejercerá como encargada interina."
 GEH_three_congress_focus_no_hina_ftt: "§RComo no completamos el enfoque §Y$GEH_second_congress_focus$§!, la partida termina.§!"
 GEH_trinity_focus_1: "Prohibir la idolatría a Trinity"
 GEH_trinity_focus_1_desc: "<Falta descripción>"
 GEH_trinity_focus_2: "Reforzar el control"
 GEH_trinity_focus_2_desc: "<Falta descripción>"
 GEH_trinity_focus_3: "Proyecto de reconstrucción de Gehenna"
 GEH_trinity_focus_3_desc: "<Falta descripción>"
 GEH_trinity_focus_4: "Establecer policía local"
 GEH_trinity_focus_4_desc: "<Falta descripción>"
 GEH_trinity_focus_5: "Academia de acero"
 GEH_trinity_focus_5_desc: "<Falta descripción>"
 GEH_trinity_integration: "Integración de Trinity"
 GEH_trinity_integration_desc: "Para evitar un segundo choque después de nuestra victoria en la Gran Guerra contra Trinity, es inevitable completar el “Tratado de Edén”. Utilizaremos todos los medios militares y políticos necesarios para incorporar a Trinity dentro de la academia de Gehenna."
 GEH_trinity_integration_target: "Reducir resistencia en el estado [FROM.GetName]"
 GEH_trinity_integration_target_tt: "Se preparará el procedimiento de integración del estado [FROM.GetName].\n"
 GEH_trinity_integration_complete: "Procedimiento de integración del estado [FROM.GetName]"
 GEH_last_focus_3: "Resultado"
 GEH_last_focus_3_desc: "La unificación de Gehenna, la amenaza de Trinity… todos esos problemas nos golpearon como olas, pero el Comité de Disciplina resistió con firmeza. Ahora, nos hemos convertido en el único faro capaz de iluminar el camino y encontrar el futuro de Gehenna."
 GEH_last_focus_3_tt: "Aparece el §Yárbol de enfoques posterior§!."
 GEH_last_focus_3_h_tt: "Como entramos en el árbol §Y$GEH_hina_route_focus$§!, aparecerá el árbol §Y$GEH_last_focus_effect_h_rout$§!."
 GEH_last_focus_3_a_tt: "Como entramos en el árbol §Y$GEH_ako_route_focus$§!, aparecerá el árbol §Y$GEH_last_focus_effect_a_rout$§!."
 GEH_last_focus_3_c_tt: "Como entramos en el árbol §Y$GEH_iori_route_focus$§!, aparecerá el árbol §Y$GEH_last_focus_effect_c_rout$§!."
 GEH_last_focus_3_n_tt: "Como mantuvimos el equilibrio político del Comité, aparecerá el árbol §Y$GEH_last_focus_effect_normal_rout$§!."

 GEH_woe_to_the_vanquished: "Para el vencido, solo hay desdicha"
 GEH_woe_to_the_vanquished_desc: "<Falta descripción>"
 GEH_woe_to_the_vanquished_2: "Una Gehenna, una líder"
 GEH_woe_to_the_vanquished_2_desc: "<Falta descripción>"

 GEH_NEXT_Army_focus_1: "Lecciones de la Guerra de Edén"

 #Capítulo 6
 #Dictadura de Hina
 GEH_last_focus_effect_h_rout: "El gran registro de Sorasaki Hina"
 GEH_last_focus_effect_h_rout_desc: "Es el día de la victoria total de Sorasaki Hina. Se celebró un desfile de autos conmemorando el fin de la 4.ª Asamblea, y Hina se presentó como la gran soberana de toda Alemania."

 GEH_hina_we_must_dissent: "Debemos resistir"
 GEH_hina_we_must_dissent_desc: "¿Contra quién, contra qué debemos resistir? ¿Yo contra Baal? ¿Baal contra mí?"

 GEH_hina_ishbosheth: "Ish-bóset"
 GEH_hina_ishbosheth_desc: "Aunque no sea un gran registro, sino un registro vergonzoso y maldito."


 ## 학생 인민의 의지 ##
 GEH_hina_jacobinisme_reform: "Reforma nacionalista"
 GEH_hina_jacobinisme_reform_desc: "El Estado y la presidenta Hina deben convertirse en símbolos de la voluntad de las masas. El nuevo sistema económico, que prioriza al pueblo, se ha definido como un régimen de sindicalismo nacional centrado en los sindicatos, donde los trabajadores toman el control de las empresas."

 GEH_hina_national_syndicalism: "Un sindicato en cada fábrica"
 GEH_hina_national_syndicalism_desc: "Bajo el régimen de sindicalismo nacional, todos los sindicatos controlarán las empresas. Por supuesto, estos sindicatos deberán operar como organizaciones estatales pro-gubernamentales. El gobierno utilizará a los sindicatos para controlar indirectamente las fábricas manufactureras."

 GEH_hina_state_capitalism: "Capitalismo de Estado"
 GEH_hina_state_capitalism_desc: "Nuestro nuevo sistema económico se articulará en torno a los capitalistas, pero el flujo del capital debe mantenerse sujeto a nuestras riendas mediante un sistema de economía planificada. Ningún capital podrá moverse salvo por la voluntad del gran Estado."

 GEH_hina_patriotic_entrepreneur: "Capitalistas patrióticos"
 GEH_hina_patriotic_entrepreneur_desc: "Todos los capitalistas deben ser capaces de entregar sus bienes en cualquier momento, patrióticamente y por orden del Estado. ¿Que no los entregan voluntariamente? Todos sabemos qué ocurrirá."

 GEH_hina_new_constitution: "Promulgación de la nueva Constitución"
 GEH_hina_new_constitution_desc: "La presidenta Hina es la líder que simboliza la voluntad de todas las masas de Gehenna. Entre los vítores de los miembros fervorosos, se promulga una nueva Constitución que eleva la autoridad de la presidenta Hina. ¡Larga vida a la Gran Nación de Gehenna!"

 GEH_hina_freie_gehenna_jugend: "Juventud Libre de Gehenna"
 GEH_hina_freie_gehenna_jugend_desc: "Por la unidad y la fraternidad de los ciudadanos de Gehenna, todos los jóvenes de Gehenna deben pertenecer a la organización Juventud Libre de Gehenna (Freie Gehenna Jugend). La FGJ fomentará la camaradería y el patriotismo de la juventud de Gehenna, y permitirá movilizarlos con mayor eficiencia."

 GEH_hina_youth_gehenna_party: "Partido Juvenil de Gehenna"
 GEH_hina_youth_gehenna_party_desc: "Convertido en el nuevo partido gobernante y el único partido de la nueva Gehenna, el Partido Juvenil de Gehenna busca reformar el país en una dirección populista siguiendo la voluntad de las masas, y construir un nuevo Estado donde todos los ciudadanos sean leales a la patria."

 GEH_hina_country_for_the_public: "Uno para todos"
 GEH_hina_country_for_the_public_desc: "Así como el pueblo se une por la patria, la patria también debe servir al pueblo. Diversos sistemas básicos de bienestar harán que los ciudadanos comunes de Gehenna desarrollen patriotismo y sentido de pertenencia hacia su país."

 GEH_hina_friendship: "Amistad entre Kivotos"
 GEH_hina_friendship_desc: "Con cuernos de demonio o alas de ángel: bajo la voluntad de la presidenta Hina y el nombre de la gran patria, todos somos el mismo pueblo. El posnacionalismo pan-Kivotos logrará la unidad y la integración de toda Kivotos."

 GEH_hina_solidarity: "¡Solidarícense!"
 GEH_hina_solidarity_desc: "Aunque existan muchas diferencias físicas, tanto la población kivotiana como los locales son ciudadanos compañeros, leales a la misma bandera. ¡Unámonos en solidaridad y, bajo el orden de Gehenna, adaptemos nuestra conducta!"

 GEH_hina_ishbosheth_route_ending: "Esh-Baal"
 GEH_hina_ishbosheth_route_ending_desc: "...Hice felices a muchas personas. Actué según la voluntad de muchos. Pero aquí no estaba mi voluntad. Todos dicen que se mueven por la presidenta Hina, pero ¿de verdad se mueven por mí? ¿O por la Sorasaki Hina ideal que imaginan?"

 ## Líder de Gehenna ##

 GEH_hina_terror_route_start: "§REpílogo§!"
 GEH_hina_terror_route_start_desc: "§RPor fin, hemos vencido.§!"

 GEH_hina_terror_route_1: "Reorganizar el orden del Comité de Disciplina"
 GEH_hina_terror_route_1_desc: "El orden de Gehenna lo controla el Comité de Disciplina, y el Comité lo controla Sorasaki Hina. Quienes dentro del Comité se opongan a esto deben ser eliminados. Deben entender por quién, y para qué, sirven ahí."

 GEH_hina_terror_route_2: "Imponer mi orden"
 GEH_hina_terror_route_2_desc: "Se pondrá en marcha un plan para eliminar a fascistas y comunistas que se resisten a Gehenna. En realidad, no son humanos: son plagas que debieron morir hace tiempo. Solo entonces el orden se asentará por fin en Gehenna."

 GEH_hina_terror_route_3: "Anulación del yo"
 GEH_hina_terror_route_3_desc: "Los alemanes no son humanos. Los gehenna sí lo son, pero no valen como individuos: solo tienen valor como existencias para Sorasaki Hina. No deben ser hombres libres con un yo propio, sino piezas que se mueven bajo un gran orden."

 GEH_hina_terror_route_ending: "Consumación"
 GEH_hina_terror_route_ending_desc: "Las fuerzas rebeldes de Alemania ya no existen. Tampoco queda resistencia dentro del Comité de Disciplina. Jamás, en toda la historia de Kivotos, hubo una líder con un poder absoluto tan fuerte como Sorasaki Hina. Ni siquiera la presidenta del Consejo Estudiantil General… Hemos obtenido una victoria grandiosa."

 GEH_hina_the_darkest_hour: "Tras atravesar la hora más oscura"
 GEH_hina_the_darkest_hour_desc: "Yo no soy una persona fuerte. Baal apareció porque yo era débil. Pero… ¿eso está mal? ¿Tengo que negar mi debilidad? Aceptémonos. Mi lado débil también soy yo. Esa Sorasaki Hina frágil también es una parte preciosa de mí."

 GEH_hina_the_darkest_hour_2: "Establecer un Consejo Provisional de Gehenna"
 GEH_hina_the_darkest_hour_2_desc: "Yo no quería ser una dictadora. En algún momento, seguí el fervor de los miembros fervientes y terminé convertida en una dictadora que no deseaba ser… Pero Gehenna se ha vuelto un país demasiado dependiente de una sola palabra mía, así que soltar el poder es algo terriblemente difícil. Empecemos por un órgano consultivo. Con el tiempo, iré distribuyendo mi poder."

 GEH_hina_the_darkest_hour_3: "Restaurar el orden del Comité de Disciplina"
 GEH_hina_the_darkest_hour_3_desc: "El “orden” que yo imaginaba estaba claramente torcido. Había olvidado los lazos con mis compañeras, y pasé por alto que mis personas más valiosas estaban a mi lado. Yo no soy un “Emperador del Trueno” ni una dictadora de hierro. Para decidir mis políticas, necesito el consejo de mis compañeras más queridas. Saldré del encierro y otorgaré más autoridad al Departamento Ejecutivo y al Departamento de Planificación."

 GEH_hina_the_darkest_hour_4: "Contener al Departamento del Orden"
 GEH_hina_the_darkest_hour_4_desc: "El Departamento del Orden dice que quiere engrandecer mi honor… pero en realidad lo está manchando. Habrá que dejar por escrito que, como organización militar, el Departamento Ejecutivo está por encima del Departamento del Orden."

 GEH_hina_the_darkest_hour_route_ending: "Futuro, libertad"
 GEH_hina_the_darkest_hour_route_ending_desc: "Mi propia libertad llegó cuando me liberé de esa idea obsesiva de que debía ser perfecta. No soy una superhumana. Pero tengo compañeras que me aprecian. ¿No es eso suficiente?"

 GEH_hina_panopticon_institution: "Instituciones panópticas"
 GEH_hina_panopticon_institution_desc: "Para impedir rebeliones organizadas o paros —que podrían considerarse conductas de ‘pre-criminales’— se instalarán obligatoriamente instituciones panópticas en cada fábrica, capaces de vigilar a todos los obreros. Agentes de vigilancia del Departamento del Orden, con la mirada oculta tras cascos, se desplegarán permanentemente en las zonas industriales."

 GEH_hina_national_delusion: "La ilusión llamada ‘nación’"
 GEH_hina_national_delusion_desc: "Los conceptos de los Estados-academia de Kivotos y los registros culturales e históricos de Alemania… todo ello implanta valores inútiles en las piezas de la gran Gran Nación de Gehenna, y eleva las posibilidades de diversos crímenes."

 GEH_hina_cult_of_leader: "Culto a Hina"
 GEH_hina_cult_of_leader_desc: "Ante una gran líder, el individuo no tiene ningún valor. Y la voluntad individual, menos aún. Todos los ciudadanos de Gehenna deben convertirse en piezas que se muevan por la líder."

 GEH_hina_extermination_german: "Erradicación de lo alemán"
 GEH_hina_extermination_german_desc: "Para quebrar la voluntad independentista de los alemanes locales, todos los niños alemanes serán separados de sus hogares y recibirán una educación especial de ‘gehennaización’ en instalaciones de formación colectiva. A largo plazo, esto provocará la erradicación permanente de la cultura local alemana y la desaparición del separatismo alemán."

 GEH_hina_two_class_society: "Sociedad de clases"
 GEH_hina_two_class_society_desc: "No crearemos un sistema nobiliario. Pero podemos establecer una estructura similar en la práctica: un pseudo-régimen de estatus para discriminar a los locales."

 GEH_hina_nationalist_education: "Educación de gehennaización"
 GEH_hina_nationalist_education_desc: "Como orgullosos súbditos de Gehenna, nos unimos como uno bajo el liderazgo de la gran líder. La erradicación de la cultura alemana se llevará a cabo de forma gradual desde la educación primaria, y en menos de un siglo se completará la asimilación cultural total."

 GEH_hina_planned_backwardness: "Atraso planificado"
 GEH_hina_planned_backwardness_desc: "La población de Kivotos es relativamente pequeña frente a los locales de la Tierra. Derribaremos las instalaciones médicas en las regiones habitadas por los locales y los empujaremos al infierno de la agricultura y la industria. Al deteriorar su calidad de vida, su población irá… equilibrándose con la de Kivotos."

 GEH_hina_eradication_of_decadent_individualism: "Prohibir el individualismo decadente"
 GEH_hina_eradication_of_decadent_individualism_desc: "El libertinaje y el caos convirtieron a Gehenna en la academia del crimen. No volveremos a permitir tal desenfreno. Bajo una gran unidad y orden, prosperaremos."

 GEH_hina_one_for_all: "El todo para uno"
 GEH_hina_one_for_all_desc: "No basta con reprimir el individualismo: todos los súbditos de la Gran Nación de Gehenna deben ser educados para verse a sí mismos como ‘recursos humanos’ al servicio de la gran líder. Los gehenna son recursos consumibles, como carbón extraído de una mina, destinados a arder y agotarse; y la presidenta Hina observará cómo se convierten en su última llama."

 #Ako
 GEH_last_focus_effect_a_rout: "La nueva reforma del Comité de Disciplina"
 GEH_last_focus_effect_a_rout_desc: "La reforma burocrática de Amau Ako transformó al Comité de Disciplina de un Estado caudillista controlado por el ejército en un Estado burocrático moderno. El nombre del Comité seguirá en la historia, pero ahora no es la policía quien guía a los burócratas, sino los burócratas quienes dirigen a la organización policial. ¡Que podamos seguir prosperando bajo la administración de los tecnócratas!"

 ## Ruta de la Administradora Principal Amau
 GEH_amau_administrative_officer: "Administradora principal Amau"
 GEH_amau_administrative_officer_desc: "Para evitar un escándalo de Amau Ako, Sorasaki Hina se mantuvo deliberadamente distante de Ako y la rechazó. Ako acabará entendiendo que fue una decisión de Hina para protegerla, pero el resultado inevitable es que la reforma tecnocrática de Ako se verá reducida y adoptará una forma más moderada."

 GEH_amau_seminar: "Intervención del Departamento de Planificación en el presupuesto"
 GEH_amau_seminar_desc: "El ‘Seminar’ de Millennium es tan perfecto y ejemplar que podría llamarse la joya del tecnocratismo. Un grupo de tecnócratas sobresalientes se encarga del presupuesto, y los demás departamentos deben presentar todos sus planes al Seminar y obtener la aprobación presupuestaria. Tal vez no se nos permita crear una organización idéntica, pero Hina otorgará a los tecnócratas del Departamento de Planificación autoridad para intervenir en la elaboración del presupuesto."

 GEH_amau_check_military: "Contener al Departamento Ejecutivo"
 GEH_amau_check_military_desc: "El Departamento Ejecutivo necesita un control mínimo: hace falta vigilancia constante para que no puedan usar a la jefa Hina con fines militaristas."

 GEH_amau_free_internet_policy: "Servicio de internet gratuito"
 GEH_amau_free_internet_policy_desc: "Es cierto que, tras el Gran Traslado, nuestro servicio de internet retrocedió mucho al perder satélites y otros recursos, pero aun así el internet por cable está ampliamente extendido por toda Gehenna. Ofrecer internet gratuito a toda la ciudadanía elevará, a largo plazo, el nivel de conocimiento del pueblo y, lenta pero seguramente, nos acercará al ideal del Departamento de Planificación: un ‘país de intelectuales’."

 GEH_amau_to_the_sky: "¡Hacia el cielo!"
 GEH_amau_to_the_sky_desc: "En veinte años, alcanzaremos por completo la ciencia y la tecnología más avanzada de Millennium. Aunque, siendo realistas, sea un objetivo exagerado."

 GEH_amau_rotue_ending: "§YA tu lado§!"
 GEH_amau_rotue_ending_desc: "Tras superar todas las adversidades, llegamos al final de una historia."

 ## Ruta Sorasaki Ako ##
 GEH_ako_sorasaki_administrative_officer: "Sorasaki Ako"
 GEH_ako_sorasaki_administrative_officer_desc: "Sorasaki Hina protegió a Ako afirmando que, al hacer pública su relación con Amau Ako, cualquier crítica contra Ako era también una crítica contra ella misma. La boda de Hina y Ako no solo es una declaración de voluntad: Hina promete que estará del lado de Ako toda su vida, y que protegerá las reformas lideradas por la mujer que ama pase lo que pase. Por supuesto, más allá de lo político, también es un hermoso momento en el que su profunda relación por fin da fruto."

 GEH_ako_sorasaki_seminar: "Seminar de Gehenna"
 GEH_ako_sorasaki_seminar_desc: "El 'Seminar' de Millennium es tan perfecto y ejemplar que podría llamarse la joya del tecnocratismo. Una organización compuesta por tecnócratas sobresalientes se encarga de elaborar el presupuesto, y los demás departamentos deben presentar todos sus planes al Seminar y obtener la aprobación de sus partidas. Ahora ya entiendes por qué el Comité de Disciplina necesita un Seminar, ¿verdad? El Seminar, bajo la supervisión de la administradora principal Ako y el Departamento de Planificación, controlará los presupuestos de todos los departamentos."

 GEH_ako_sorasaki_civilian_control: "Principio de control civil"
 GEH_ako_sorasaki_civilian_control_desc: "Hasta ahora, el Departamento Ejecutivo —poco distinto del estamento militar de Gehenna— actuaba sin recibir ninguna intervención de organizaciones civiles. No: Gehenna no debe ser un Estado caudillista, sino un Estado administrativo moderno, y varios mandos del Departamento Ejecutivo deberán quitarse el uniforme y pasar a pertenecer al ámbito civil."

 GEH_ako_sorasaki_promotion_of_science: "Ciencia, no anarquía"
 GEH_ako_sorasaki_promotion_of_science_desc: "La nueva Gehenna, liderada por tecnócratas, debe desprenderse del estigma de 'academia de libertad y caos' y renacer como un país para eruditos e intelectuales brillantes. Aunque exista una enorme brecha tecnológica, algún día podremos alcanzar incluso a Millennium."

 GEH_ako_sorasaki_ako_s_puppet: "§CSolo Ako§!"
 GEH_ako_sorasaki_ako_s_puppet_desc: "Ako siempre estuvo del lado de Hina. Siempre la ayudó, y estuvo junto a ella cuando más difícil era. Y… si la esposa que amas va a encargarse de todo, ¿para qué pensar? Hina cierra los ojos y decide confiarle a Ako todos sus pensamientos y valores. A partir de ahora, Hina aceptará con alegría una vida como marioneta, repitiendo fielmente las decisiones de su amada esposa."

 GEH_ako_sorasaki_ako_s_partner: "§GLa mejor compañera§!"
 GEH_ako_sorasaki_ako_s_partner_desc: "Ako siempre estuvo del lado de Hina. Siempre la ayudó, y estuvo junto a ella cuando más difícil era. Hina sabe que aún tiene mucho que hacer por el Comité de Disciplina. Pero si a su lado está su esposa, su compañera más preciada, entonces podrá superar cualquier adversidad."

 GEH_ako_sorasaki_route_ending: "Before I Rise"
 GEH_ako_sorasaki_route_ending_desc: "Una historia llega a su fin. Y florece un hermoso desenlace."

 ## Enfoques compartidos: Sorasaki Ako & Administradora Principal Amau ##
 GEH_4th_ako_reduction_in_defense_budget: "Recorte del presupuesto de defensa"
 GEH_4th_ako_reduction_in_defense_budget_desc: "Ahora que la reunificación y el resurgimiento de Gehenna se han completado, el Departamento de Planificación desea reducir el presupuesto desmesurado del Departamento Ejecutivo y redirigirlo al desarrollo industrial. Sorasaki Hina también estará de acuerdo con esta medida."

 GEH_4th_ako_centre_of_culture: "Academia de la cultura"
 GEH_4th_ako_centre_of_culture_desc: "La antigua Gehenna, como 'academia de libertad y caos', era un lugar tan desordenado que ni siquiera la asistencia se cumplía como debía. El nuevo sistema burocrático aplicará medidas punitivas para elevar la asistencia en las instituciones educativas de Gehenna y, al mismo tiempo, apoyará activamente las artes estudiantiles para preservar el carácter cultural de la Gehenna libre."

 GEH_4th_ako_intelligence_reform: "Reforma del Departamento de Inteligencia"
 GEH_4th_ako_intelligence_reform_desc: "El Departamento de Inteligencia fue la institución que sostuvo el mayor enfrentamiento político con Ako y el Departamento de Planificación que ella lidera. Incluso Sorasaki Hina reconoce que el Departamento de Inteligencia se concentró en exceso en las luchas internas de poder y hostigó innecesariamente a Ako. Debe separarse por completo del poder político y, en adelante, centrarse únicamente en la contrainteligencia exterior."

 GEH_4th_ako_second_weimar_republic: "Segunda República de Weimar"
 GEH_4th_ako_second_weimar_republic_desc: "La nueva república federal no debe representar solo a la minoría kivotiana, sino convertirse en una 'nueva República de Weimar' que represente a todos los ciudadanos de Alemania. Al fin y al cabo, no podemos gobernar un país con una población tan reducida."

 GEH_4th_ako_coalition_with_SPD: "Coalición con el Partido Socialdemócrata"
 GEH_4th_ako_coalition_with_SPD_desc: "No significa que el Partido Socialdemócrata de Alemania vaya a integrarse en el gobierno central. Debemos mantener nuestra identidad como Gehenna. Sin embargo, mediante una intervención electoral adecuada, podemos aumentar su influencia en los gobiernos regionales. El SPD es el partido local más favorable a nuestro gobierno, y puede actuar como puente entre los locales y los kivotianos."

 GEH_4th_ako_oath_of_bureaucratic: "Juramento de lealtad de los burócratas locales"
 GEH_4th_ako_oath_of_bureaucratic_desc: "Aceptar a los locales como 'burócratas' fue algo muy… delicado. Pero ahora que somos la fuerza dominante de Alemania, aquellos que juren lealtad al orden de Gehenna podrán incorporarse como cuadros subalternos en nuestra organización tecnócrata. Por supuesto, que tomen el control es absolutamente imposible."

 GEH_4th_ako_from_gehenna_to_trinity: "De Gehenna a Trinity"
 GEH_4th_ako_from_gehenna_to_trinity_desc: "Nuestro objetivo es unificar a Gehenna y Trinity, dos fuerzas divididas, y lograr la unidad del pueblo de Kivotos. Los derechos de los locales importan, sí… pero solo en 'segundo' lugar."

 GEH_4th_ako_eden_union: "Pequeña Entente de Edén"
 GEH_4th_ako_eden_union_desc: "Gehenna y Trinity son del mismo origen kivotiano y comparten el mismo Halo… pero es cierto que existen diferencias promedio en su apariencia entre estudiantes. La 'Pequeña Entente de Edén', nombrada en honor al Acuerdo de Edén, tiene como objetivo construir gradualmente la paz entre ambas academias imponiendo cuotas obligatorias de personal proveniente de Trinity dentro de nuestro cuerpo tecnócrata."

 GEH_4th_ako_federation_for_kivotos: "Federación de Kivotos"
 GEH_4th_ako_federation_for_kivotos_desc: "Diversas poblaciones originarias de Kivotos —academias, semihumanos, robots, entre otros— cooperarán por la prosperidad de nuestro país. Las organizaciones civiles formadas por kivotianos, aun siendo pocos frente a los locales, impedirán que perdamos la iniciativa gracias a una unidad sólida."

 #Iori
 GEH_last_focus_effect_c_rout: "Borrar las manchas teñidas de sangre"
 GEH_last_focus_effect_c_rout_desc: "Sorasaki Hina y el leal Comité de Disciplina lograron pacificar toda Gehenna y traer estabilidad. Ahora debemos ir más allá: resolver la guerra radical y el sistema militarizado, y comenzar a invertir en el futuro."

 GEH_gradual_dismantling_of_conscription_system: "Reducción gradual del sistema de conscripción"
 GEH_dismantling_of_militarized_system: "Desmantelar el sistema militarizado"
 GEH_indefinite_extension_of_emergency_powers: "Extensión indefinida de los poderes de emergencia"
 GEH_investigation_of_shirokami_ioris_war_crimes: "Investigación de los crímenes de guerra de Shiromi Iori"
 GEH_execution_unit_temporary_sanctions: "Sanciones temporales al Departamento Ejecutivo"
 GEH_restoration_of_planning_department_authority: "Restauración de la autoridad del Departamento de Planificación"
 GEH_restoration_of_medical_department_authority: "Restauración de la autoridad del Departamento Médico"
 GEH_gehenna_prefect_team_revival: "Renacimiento del Comité de Disciplina de Gehenna"
 GEH_cornerstone_of_a_defense_nation: "Piedra angular de una nación defensiva"
 GEH_national_defense_commissioner_sorasaki_hina: "Comisionada Nacional de Defensa Sorasaki Hina"
 GEH_departure_with_a_sigh: "Partir con un suspiro"
 GEH_german_equality_conscription: "Conscripción igualitaria para los alemanes"
 GEH_our_new_supporters: "...¡Nuestros nuevos partidarios!"
 GEH_universalism_charter: "Carta del 'universalismo'"
 GEH_gehenna_national_harmony_solidarity: "Liga de Armonía Nacional de Gehenna"
 GEH_commercial_agricultural_industrial_cooperation: "Cooperación armónica entre comercio, agricultura e industria"
 GEH_german_labor_front_succession: "Traspaso del Frente Laboral Alemán"
 GEH_weakening_big_capitalists: "Debilitar a los grandes capitalistas"
 GEH_political_and_administrative_center: "Centro político y administrativo"
 GEH_harmony_fatherland_solidarity: "Armonía, patria, solidaridad"

 GEH_gehenna_national_harmony_solidarity_1tt: "Cambio de efecto al elegir el árbol de enfoque $GEH_investigation_of_shirokami_ioris_war_crimes$:\n§gJuzgar a Shiromi Iori como criminal de guerra hará que el propósito del armonismo nacional se debilite, al concentrarse más en los valores del Comité de Disciplina de Gehenna.§!"
 GEH_gehenna_national_harmony_solidarity_2tt: "Cambio de efecto al elegir el árbol de enfoque $GEH_indefinite_extension_of_emergency_powers$:\n§gDeclarar poderes de emergencia permite a Sorasaki Hina aferrar con fuerza el control del país, elevando de forma drástica el propósito del armonismo nacional.§!"

 GEH_gradual_dismantling_of_conscription_system_desc: "Con nuestros dos grandes enemigos principales —Pandemonium y Trinity— ya destruidos, y con la posición global de Gehenna estabilizándose, debemos reducir el sistema de conscripción sobredimensionado y avanzar hacia la normalización del Estado."

 GEH_dismantling_of_militarized_system_desc: "El populismo, la negatividad, la persecución de minorías y la propaganda falsa se han vuelto casi la rutina diaria de la política de Gehenna. Reduciremos esta maquinaria propagandística extremadamente peligrosa y daremos el primer paso para establecer un Estado estable."

 GEH_indefinite_extension_of_emergency_powers_desc: "...Una vez que te manchas de sangre, Shiromi Iori y el Departamento Ejecutivo ya no pueden volver a como antes. Por su propia seguridad, Sorasaki Hina no podrá dañar el lazo de tantos años con Shiromi Iori, una compañera de largo recorrido desde antes del Gran Traslado."

 GEH_investigation_of_shirokami_ioris_war_crimes_desc: "Sorasaki Hina se ha hartado de lo que Shiromi Iori y el Comité de Disciplina han estado haciendo, y promoverá una gran reforma para debilitar significativamente su influencia y devolver a Gehenna a como era antes… aunque eso suponga dañar vínculos que se arrastran desde los días de Kivotos."

 GEH_execution_unit_temporary_sanctions_desc: "El Departamento Ejecutivo de Shiromi Iori es hoy la organización más poderosa dentro del Comité de Disciplina de Gehenna; incluso dejando a Iori de lado, será un enorme obstáculo para normalizar el Estado."

 GEH_restoration_of_planning_department_authority_desc: "La lucha de poder entre el Departamento Ejecutivo y el Departamento de Planificación viene desde los días de Kivotos. Con el Ejecutivo dominando la iniciativa política, la autoridad del Departamento de Planificación se ha reducido a su peor nivel en la historia del Comité. Ajustaremos esta relación y prepararemos medidas para aliviar el choque entre ambos departamentos."

 GEH_restoration_of_medical_department_authority_desc: "Diversas extralimitaciones del Departamento Ejecutivo y del Departamento de Guerra han dañado muchas de las actividades del Departamento Médico. Lo corregiremos."

 GEH_gehenna_prefect_team_revival_desc: "El Comité de Disciplina de Gehenna debe detenerse en proteger a los estudiantes y mantener la disciplina. Hoy, Gehenna y el Comité se han vuelto casi indistinguibles y el liderazgo político se ha inclinado de forma unilateral; debemos volver a recordar y confirmar la esencia del Comité."

 GEH_cornerstone_of_a_defense_nation_desc: "Si hay algo característico —y quizá el ‘mejor invento’— que surgió bajo la tiranía unilateral del Departamento Ejecutivo, es el Departamento de Guerra. Por ello corregiremos los errores de las operaciones militares del régimen del Comité y reconoceremos al Departamento de Guerra no como una herramienta de uso unilateral del Ejecutivo, sino como una organización para la defensa de toda Gehenna, introduciendo el principio de control civil."

 GEH_national_defense_commissioner_sorasaki_hina_desc: "Para separar de manera significativa al Departamento Ejecutivo y al Departamento de Guerra y avanzar en la estabilización de Gehenna, hace falta que el puesto de jefa del Comité y el de jefa del Departamento de Guerra se combinen, a la vez que se cree una distancia respecto al Ejecutivo. Con ese fin, Sorasaki Hina creará un nuevo cargo —Comisionada de Defensa— como una nueva jefatura estudiantil de Gehenna, y ella misma asumirá el puesto."

 GEH_departure_with_a_sigh_desc: "El ideal de Gehenna, los valores de la democracia, los objetivos del Comité… ya son palabras olvidadas. Digan lo que digan, ahora somos un régimen dictatorial; para los estudiantes de Gehenna parecemos colaboradores locales, y es una verdad innegable. Aun así, para proteger nuestro sistema estatal y por la elección de Sorasaki Hina, debemos defender este régimen."

 GEH_german_equality_conscription_desc: "Tal vez podamos esforzarnos por construir un país mejor mediante la tolerancia y la conciliación hacia los alemanes. Encontraremos un nuevo ideal para el Comité, y avanzaremos hacia él. Aunque al final de esta elección el sistema estatal de Gehenna se dañe, y aunque existan incontables conflictos dolorosos entre ambos mundos que habrá que suturar… al menos, Sorasaki Hina no se arrepentirá de su decisión."

 GEH_our_new_supporters_desc: "...Sí, claro: no es que hayamos fracasado en conseguir el apoyo de los estudiantes y de los ciudadanos kivotianos, y por eso estemos introduciendo un igualitarismo amplio y atrayendo a los alemanes a nuestro bando.\n\nSolo estamos haciendo lo que el Comité debió hacer desde el principio: mediar el conflicto entre dos mundos y mantener los ideales. Además, es el camino que Sorasaki Hina escogió tras largas cavilaciones."

 GEH_universalism_charter_desc: "\"Todos los ciudadanos son iguales. Nadie sufrirá discriminación en ningún ámbito de la vida política, económica, social o cultural por razón de región de origen, raza o nacionalidad.\"\n\nEl Comité de Disciplina de Gehenna ahora mediará el conflicto entre kivotianos y terrícolas, y se construirá sobre la oposición al racismo y la integración estable de ambos mundos."

 GEH_gehenna_national_harmony_solidarity_desc: "Para la integración de Gehenna y Alemania, y para entender el poder concentrado del Departamento de Guerra y la imagen carismática de Sorasaki Hina grabada en las masas, todo debe analizarse pieza por pieza. Sorasaki Hina, al menos, no piensa desperdiciar su poder; y para enderezar una situación torcida, comenzará a hacer política en el sentido más auténtico."

 GEH_commercial_agricultural_industrial_cooperation_desc: "Gehenna no es un sistema compuesto solo por kivotianos. Para armonizar las múltiples identidades nacionales y las diversas clases trabajadoras en toda Gehenna-Alemania, intentaremos una cooperación armónica entre obreros alemanes, obreros kivotianos y las distintas clases sociales."

 GEH_german_labor_front_succession_desc: "El Frente Laboral Alemán, que coordina sindicatos y mano de obra en toda Alemania, fue forzado a degradarse a institución civil tras el Gran Traslado y quedó prácticamente abandonado. Lo reabsorbiremos como institución estatal y lo utilizaremos en los programas de armonía nacional."

 GEH_weakening_big_capitalists_desc: "Grandes empresas alemanas o kivotianas incitan conflictos mediante marketing, o cometen explotación laboral con frecuencia en regiones poco protegidas. Corregiremos esas prácticas e iniciaremos un fuerte control estatal sobre los grandes capitalistas."

 GEH_political_and_administrative_center_desc: "El juicio por crímenes de guerra contra Shiromi Iori sigue en curso, pero para restaurar la legitimidad del liderazgo e integrar la academia de Gehenna, deben celebrarse elecciones. Aunque parezca obvio que Sorasaki Hina ganará, es una elección crucial… al menos, así lo cree ella."

 GEH_harmony_fatherland_solidarity_desc: "Apoyada por el respaldo alemán, la Comisionada de Defensa Sorasaki Hina logró desviar las flechas dirigidas a Shiromi Iori y hacer que apuntasen hacia ella. También obtuvo un trasfondo que antes ni imaginaba: el sólido apoyo de los alemanes. Ahora, pese a la oposición de los estudiantes kivotianos de Gehenna, implementará la decisión final para subvertir la jerarquía tácita entre Alemania y Gehenna y consumar una enorme integración."

 #Normal
 GEH_last_focus_effect_normal_rout: "Ceremonia de retiro de Sorasaki Hina"
 GEH_last_focus_effect_normal_rout_desc: "Jefa del Comité de Disciplina, líder de Gehenna, defensora contra Trinity… y, al final, una estudiante normal de Gehenna: ya es hora de quitarle por fin ese peso de encima a Sorasaki Hina. Con la mayoría de las grandes crisis resueltas, Hina puede decidir retirarse."

 GEH_new_disciplinary_head_election: "Elección de una nueva jefa del Comité de Disciplina"
 GEH_new_disciplinary_head_election_desc: "El retiro de Hina trajo estabilidad a toda Gehenna, pero dejó un enorme vacío de poder dentro del Comité de Disciplina. Sin el punto de gravedad absoluto llamado Hina, el Comité necesita una nueva líder que marque el rumbo. Y, desde luego, la candidata más sólida será la administradora principal 'Amau Ako', quien con fría racionalidad ha sostenido la administración del Comité."
 GEH_shiromi_iori_s_ordeal: "La prueba de Shiromi Iori"
 GEH_shiromi_iori_s_ordeal_desc: "Con Hina fuera, el poder dentro del Comité se inclinó de manera natural hacia el Departamento de Planificación, que controla administración y presupuesto. Para Shiromi Iori y el Departamento Ejecutivo, comenzó una era de 'penurias'. Cada plan operativo debía adjuntar decenas de páginas de informes y tablas de análisis de impacto esperado, y hasta para comprar una sola bala se requería la meticulosa aprobación de Amau Ako. Para Iori, aquello era más terrible que la guerra: una 'guerra total contra el papeleo'. Su ira crece día tras día."
 GEH_not_you_plz: "¡Tú, justo tú, no!"
 GEH_not_you_plz_desc: "\"¡Maldita sea! Si esa burócrata de los papeles se convierte en jefa, ¡nos vamos a morir moviendo el bolígrafo toda la vida!\"\nAl final, Iori tomó una decisión: evitar que Amau Ako se convierta en jefa del Comité cueste lo que cueste, por el honor del Departamento Ejecutivo y por su propia salud mental. Reunirá a sus ejecutivos leales, buscará apoyo de otros departamentos y comenzará una lucha política para frenar la 'dictadura burocrática' de Ako."
 GEH_crushed_reconciliation: "Reconciliación aplastada"
 GEH_crushed_reconciliation_desc: "La elección terminó, y la ganadora fue 'Amau Ako'. Como nueva jefa del Comité, Ako solicitó una reconciliación pública con Iori para integrar la organización. Ante la mirada de innumerables miembros del Comité, Iori, a regañadientes, tomó la mano que Ako le tendía. La humillación de tener que aceptar la derrota y, aun así, la responsabilidad de obedecer por el bien de la organización. Bajo su torpe apretón de manos, empezó la frágil paz del Comité de Disciplina."
 GEH_execution_department_guard: "Proteger al Departamento Ejecutivo"
 GEH_execution_department_guard_desc: "Para proteger al Departamento Ejecutivo de la intromisión administrativa de Ako, Iori decidió reforzar su independencia: mando operativo, autonomía presupuestaria interna e incluso control de personal. Construirá un 'pequeño bastión' fuera de la influencia del Departamento de Planificación, luchando para que el Ejecutivo no pierda su esencia como la 'espada afilada' del Comité. Es el inicio de una resistencia pasiva, pero persistente, contra el gobierno de Ako."

 GEH_gehenna_student_council_president_election: "Elección del presidente del Consejo Estudiantil de Gehenna"
 GEH_gehenna_student_council_president_election_desc: "El retiro de Hina no solo significó la ausencia de la jefa del Comité de Disciplina, sino también la ausencia, de facto, del jefe de Estado que dirigía a toda Gehenna. Crece la opinión de que el Comité debe concentrarse en su papel como organización militar y de seguridad pública, y que debe reconstruirse un nuevo 'Consejo Estudiantil' para Gehenna y elegir un líder democrático. Será el nuevo comienzo de Gehenna: el paso de un gobierno caudillista hacia un 'Estado normal'."
 GEH_amau_ako_s_worry: "La preocupación de Amau Ako"
 GEH_amau_ako_s_worry_desc: "Cuando se anunció la elección del nuevo presidente del Consejo Estudiantil, todas las miradas recayeron sobre Amau Ako: la máxima experta administrativa de Gehenna y la heredera natural de Hina. Pero Ako dudó. Su lealtad siempre había estado dirigida a 'Sorasaki Hina' como persona, no a la multitud indefinida llamada 'Gehenna'. ¿Tiene realmente la capacidad y la voluntad de reemplazar ese vacío y dirigir a este enorme país? Ako cayó en una profunda angustia."
 GEH_gehenna_morning_star_club: "Club Lucero del Alba de Gehenna"
 GEH_gehenna_morning_star_club_desc: "Al final, Ako eligió otro camino, lejos del escenario político de ser presidenta del Consejo. Fundó una nueva asociación llamada 'Club Lucero del Alba de Gehenna'. Es una fundación de becas operada en nombre de Ako, y también una institución educativa de élite que forma a los talentos de la próxima generación que guiarán el futuro de Gehenna. En vez de reinar desde la cúspide del poder, Ako escogió sembrar, desde las sombras, las semillas del futuro de Gehenna."
 GEH_gehenna_morning_star_club_tt: "§CCambio de gobierno tras el evento:§!"
 GEH_student_council_president_ako: "Presidenta del Consejo Estudiantil Ako"
 GEH_student_council_president_ako_desc: "Tras mucho dudar, Ako decidió aceptar su deber. Se postuló a la elección prometiendo 'estabilidad y prosperidad' y ganó con un apoyo abrumador, convirtiéndose en la primera presidenta del Consejo Estudiantil. La figura en el estrado ya no era la sombra de nadie. Comienza la era de la nueva líder de la República de Gehenna: fría, capaz y, a veces, implacable: Amau Ako."
 GEH_flag_morning_star_club: "Amau Ako decidió no convertirse en presidenta del Consejo Estudiantil."
 GEH_flag_gehenna_academy: "Amau Ako decidió convertirse en presidenta del Consejo Estudiantil."
 GEH_planning_department_independence: "Autonomía del Departamento de Planificación"
 GEH_planning_department_independence_desc: "Con Ako dedicada a otras tareas, el Departamento de Planificación que ella cultivó toda su vida tuvo que afrontar un nuevo cambio. Sin su control directo, debe sostenerse por sí mismo sobre el sistema que ella construyó. Ako transferirá autoridad a sus sucesores más capaces y reorganizará la estructura para que el Departamento de Planificación siga funcionando sin tambalearse como el núcleo de la administración de Gehenna."

 GEH_art_academy_enhancement: "Fortalecer la Academia de Artes"
 GEH_art_academy_enhancement_desc: "La fundación de la Academia de Artes de Gehenna fue un éxito. La 'libertad y caos' de Gehenna se fusionó con la 'belleza formal' de los artistas alemanes, creando un espíritu artístico único y vibrante. Ahora debemos fortalecerlo aún más: organizar concursos nacionales de arte, otorgar el título de 'Meister de Gehenna' a los mejores artistas y patrocinar exposiciones itinerantes por toda Europa. Es hora de convertir a Gehenna no solo en una potencia militar, sino en un centro vivo de arte y cultura."
 GEH_organic_academy: "Academia orgánica"
 GEH_organic_academy_desc: "La Gehenna actual es un organismo complejo que no puede definirse con una sola palabra: clubes que revientan aguas termales, un Comité de Disciplina que predica el orden, e incluso alemanes que son los dueños originales de esta tierra. Tras la retirada de Hina, grupos que parecían incapaces de coexistir han terminado apoyándose mutuamente en una extraña simbiosis. La 'Academia orgánica' es un gran compromiso social que acepta este fenómeno, garantiza la autonomía de cada institución y fomenta la cooperación, para que este enorme y caótico organismo funcione como una sola comunidad sin chirriar."

 GEH_gehenna_literature_academy: "Academia de Literatura de Gehenna"
 GEH_gehenna_literature_academy_desc: "Con el arte Gehenna-Baviera asentándose con éxito, nuestra confianza cultural está lista para expandirse del plano visual al mundo de las letras. La 'Academia de Literatura de Gehenna' es el primer paso. Apoyaremos novelas que recojan las vivencias de estudiantes que atravesaron la era del Gran Traslado, poesía que explore la identidad de un nuevo Estado y filosofía que abarque la historia de ambos mundos. Ya no con pinceles y pigmentos, sino con pluma y tinta, registraremos y demostraremos el alma de Gehenna."
 GEH_play_woman_of_iron_skin: "Obra: La mujer de piel de hierro"
 GEH_play_woman_of_iron_skin_desc: "Entre los jóvenes estudiantes de Gehenna, una obra titulada 'La mujer de piel de hierro' se ha vuelto un fenómeno. Retrata a Sorasaki Hina como una figura trágica que ocultaba su dolor tras la máscara de la 'jefa perfecta del Comité'. Los antiguos altos mandos del Comité lo consideran un insulto que menosprecia la fortaleza de Hina."

 GEH_principle_of_order: "Principio del orden"
 GEH_principle_of_order_desc: "Nuestra prioridad absoluta es la estabilidad de Gehenna y la prosperidad de los kivotianos. No podemos ceder nuestros derechos para aplacar el descontento alemán. El 'Principio del orden' sostiene el gehenna-primero: limitar la participación política de los alemanes y distribuir recursos clave con prioridad a los kivotianos para que el control de nuestro Estado no se tambalee."
 GEH_principle_of_mediation: "Principio de mediación"
 GEH_principle_of_mediation_desc: "Gehenna es ahora un Estado de dos pueblos: kivotianos y alemanes. Una política que oprima a uno solo traerá una división mayor. El 'Principio de mediación' busca que el Comité de Disciplina actúe como árbitro imparcial entre ambos mundos. Formaremos un consejo conjunto con participación equitativa, ajustaremos conflictos y guiaremos una convivencia estable."
 GEH_principle_of_reconciliation: "Principio de reconciliación"
 GEH_principle_of_reconciliation_desc: "Debemos reconocer que, durante el Gran Traslado, infligimos a los alemanes —los dueños de esta tierra en aquel entonces— una herida imborrable. El 'Principio de reconciliación' es el camino para expiar el 'pecado original' de Gehenna y lograr una integración verdadera: una disculpa oficial por el pasado, compensación para las víctimas y garantías activas de intercambio cultural y participación política. Pondremos fin a la era del odio y construiremos un nuevo Estado basado en el respeto mutuo."

 GEH_last_focus_effect: "Hacia el futuro"
 GEH_last_focus_effect_desc: "§gEs hora de mirar hacia atrás el camino que hemos recorrido.§!"
 GEH_second_congress_focus_effect: "Mirando al presente"
 GEH_second_congress_focus_effect_desc: "§gEl 1.º Congreso decidirá el camino que seguiremos.§!"
 GEH_second_congress_focus_effect_tt: "Este enfoque cambiará a un árbol de enfoques completo al completarse el enfoque §Y$GEH_second_congress_focus$§!."
 GEH_second_congress_focus_effect_tt2: "Aún no hemos completado el enfoque §Y$GEH_second_congress_focus$§!."
 GEH_last_focus_effect_tt: "Este enfoque cambiará a un árbol de enfoques completo al completarse el enfoque §Y$GEH_last_focus_3$§!."
 GEH_last_focus_effect_tt2: "Aún no hemos completado el enfoque §Y$GEH_last_focus_3$§!."
 ### Enfoques diplomáticos del Comité de Disciplina ###
 GEH_our_future: "Nuestro futuro"
 GEH_our_future_desc: "Lo importante es qué clase de política exterior aplicará [ROOT.GetNameDef] dentro de la comunidad internacional. Dentro de Gehenna actuamos por la 'guía y el orden', pero no podemos ir por ahí diciéndoles a otras academias: '¿Podrían abrir la puerta un momento por el bien de la decencia?'."

 GEH_our_faction_first: "Firmar las Convenciones de Ginebra"
 GEH_our_faction_first_desc: "Si hemos decidido respetar el orden, también debemos reconocer el 'orden' que ha construido la civilización humana. Las normas de guerra para los locales, establecidas por las Convenciones de Ginebra, son una obligación que debemos respetar y cumplir sin importar la situación."

 GEH_war_against_cou: "$GEH_three_congress_focus_no_hina_diplomacy_attack_benelux$"
 GEH_war_against_cou_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_benelux_desc$"

 GEH_recognition_of_cou: "$GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux$"
 GEH_recognition_of_cou_desc: "$GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux_desc$"

 GEH_russian_winter: "Preparativos para la Guerra de Invierno en el Este"
 GEH_russian_winter_desc: "El problema de la Guerra de Invierno en el Este es un asunto crucial para nosotros. Gehenna no era un lugar de clima gélido como Red Winter, así que, al enfrentarnos al 'oso rojo' del este de Kivotos, debemos prepararnos para no morir congelados en su territorio."

 GEH_red_winter_problem: "Toda Escandinavia"
 GEH_red_winter_problem_desc: "La Academia Federal Red Winter ha sido, desde hace mucho, una vieja amiga de Pandemonium. ¿De verdad tenemos algún motivo para no vigilarlos?"

 GEH_red_winter_aliance: "Cooperación escandinava"
 GEH_red_winter_aliance_desc: "La vieja relación amistosa entre Red Winter y Pandemonium resulta incómoda, pero no podemos permitirnos malgastar poder nacional en regiones polares. Será mejor esforzarnos por incorporarlos como aliados."

 GEH_attack_soviet: "Guerra contra [SOV.GetName]"
 GEH_attack_soviet_desc: "El oso rojo del Este es un enemigo hipotético y amenazante; mientras el problema oriental no se resuelva, nuestra seguridad seguirá siendo incierta."

 GEH_attack_SWI: "Operación Tannenbaum"
 GEH_attack_SWI_desc: "Suiza, el país humano al sur de Gehenna, proclama ser neutral. Pero, entre naciones de otro mundo y la humanidad, ¿realmente mantendrán esa neutralidad? No nos queda más que considerarlos también un 'enemigo hipotético'."
 
 GEH_attack_south_kivotos: "Atacar el Sur de Kivotos"
 GEH_attack_south_kivotos_desc: "El sur de Kivotos es la puerta de entrada hacia Europa, y es muy probable que esa puerta sea hostil en lugar de amistosa. Para mantener una seguridad férrea, debemos eliminar a los enemigos hipotéticos del Sur de Kivotos."
 GEH_attack_south_kivotos_tt: "Obtendremos un objetivo de guerra contra el país que ganó la Gran Guerra de Baeksan."
 
 GEH_aliance_south_kivotos: "Alianza con el Sur de Kivotos"
 GEH_aliance_south_kivotos_desc: "El sur de Kivotos es la puerta de entrada hacia Europa; si queremos avanzar al sur europeo, necesitamos mantener relaciones amistosas con ellos."
 GEH_aliance_south_kivotos_tt: "Podremos proponer una alianza al país que ganó la Gran Guerra de Baeksan."

 GEH_support_WHY: "Plan de protección de Wild Hunt"
 GEH_support_WHY_desc: "Wild Hunt, que sufre los delirios persecutorios de Iberia sobre el llamado 'bolchevismo de otro mundo', prosperará bajo nuestro apoyo."

 GEH_attack_SPR: "Guerra de Liberación de Iberia"
 GEH_attack_SPR_desc: "Hemos venido a esta tierra para borrar esa fantasía suya llamada 'bolchevismo de otro mundo'."

 GEH_remove_vatican: "Desmantelar el Vaticano"
 GEH_remove_vatican_desc: "El proceso de disolver permanentemente la Santa Sede es el martillo más contundente que podemos descargar sobre el más persistente enemigo del sur de Europa, que desde hace mucho ha actuado con hostilidad hacia los kivotianos."

 GEH_interpol: "Organización Internacional de Policía Criminal"
 GEH_interpol_desc: "El Comité de Disciplina, una fuerza policial, ya se ha transformado en un Estado, pero no olvidaremos que nuestras raíces están en el orden público. La Organización Internacional de Policía Criminal que crearemos será un organismo internacional que forme una 'policía internacional' dedicada a capturar criminales, actuando entre todas las academias-nación de Kivotos y los Estados locales que cooperen con nosotros."

 GEH_friendship_with_trinity: "Mantener la fraternidad del Acuerdo de Edén"
 GEH_friendship_with_trinity_desc: "Aunque su final fue trágico, Kirifuji Nagisa lo dio todo por la amistad y el vínculo entre Trinity y Gehenna. El Departamento de Justicia, desempleado tras la Batalla de Edén, merece respeto bajo nuestro gobierno. Se limitará su armamento a armas ligeras, pero será restablecido en el antiguo territorio de Trinity recuperando todas sus atribuciones previas."

 GEH_ICC: "Fundación de la Corte Penal Internacional"
 GEH_ICC_desc: "Si cometes un crimen, es natural que recibas castigo. La Corte Penal Internacional (CPI) establece criterios para juzgar, en nombre de la justicia, no a criminales comunes, sino a criminales de guerra extranjeros, dictadores y perpetradores de atrocidades inhumanas."

 GEH_crossing_the_atlantic: "Cruzando el Atlántico"
 GEH_crossing_the_atlantic_desc: "El gigantesco Estado llamado [USA.GetNameDef] alguna vez prosperó, pero desde el Gran Traslado ha decaído en medio del caos. Aun así, [USA.GetAdjective] posee un potencial inmenso, y debemos derribar a ese gigante antes de que despierte."

 GEH_attack_intermarium: "Detener el experimento del Międzymorze"
 GEH_attack_intermarium_desc: "Polonia amenaza la seguridad de Gehenna, y el Międzymorze podría volverse contra nosotros en cualquier momento."

 GEH_attack_baltic: "Ofensiva báltica"
 GEH_attack_baltic_desc: "Por su propia seguridad, a los pequeños países bálticos les conviene más convertirse en parte de Gehenna."

 GEH_attack_soviet_1: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1$"
 GEH_attack_soviet_1_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1_desc$"

 GEH_attack_soviet_2: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2$"
 GEH_attack_soviet_2_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2_desc$"

 GEH_diplomacy_balkans_alliance: "$GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance$"
 GEH_diplomacy_balkans_alliance_desc: "$GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance_desc$"

 GEH_attack_ITA: "$GEH_three_congress_focus_no_hina_diplomacy_attack_italy$"
 GEH_attack_ITA_desc: "$GEH_three_congress_focus_no_hina_diplomacy_attack_italy$"

 GEH_we_dont_need_other_big_three_school: "El fin del sistema de las Tres Grandes Academias"
 GEH_we_dont_need_other_big_three_school_desc: "Gehenna, Trinity y Millennium —las tres grandes academias— quedarán unificadas bajo el nombre de la líder de Gehenna, [ROOT.GetLeader]."

 GEH_technical_cooperation: "Alianza Gehenna–Millennium"
 GEH_technical_cooperation_desc: "Convertir en enemigo a una academia con un poder tecnológico tan grande como Millennium sería una necedad. Será mejor reunirse con su presidenta estudiantil y hablar de amistad."

 GEH_stopping_kaisers_hegemony: "Operación León Marino"
 GEH_stopping_kaisers_hegemony_desc: "Dicen que Britania fue un país grandioso. Aunque se haya corrompido sin fin bajo el dominio corporativo. Bajo la bandera de [ROOT.GetName], el orden volverá a asentarse en esa tierra."

 ### Enfoques industriales (culturales) del Comité de Disciplina ###
 GEH_luxembourg_problem: "Problema del Reglamento de Luxemburgo"
 GEH_luxembourg_problem_desc: "Tras el Gran Traslado, el 'Reglamento de Luxemburgo' evitó con eficacia masacres que podrían repetirse. Sin embargo, la reacción contraria de los gehenna y la falta realista de capacidad administrativa exigen inevitablemente una mejora del Reglamento de Luxemburgo."

 GEH_internet_network_recovery: "Restauración de la red de internet"
 GEH_internet_network_recovery_desc: "La fibra que usábamos en Kivotos tardará algunos años en recuperarse hasta que se introduzca la tecnología de Millennium, pero si usamos la red telefónica de los locales podremos reconstruir con rapidez una red de internet basada en módem."

 GEH_centre_of_culture: "El corazón de la cultura"
 GEH_centre_of_culture_desc: "Algunas estudiantes de Gehenna malinterpretan que el Comité de Disciplina solo busca reprimir la vida cultural y la libertad popular para construir una sociedad totalitaria. No. No es así. Siempre que no cometan terrorismo excavando aguas termales ni lancen bombas a restaurantes de comida horrible, el Comité está listo para aceptar cualquier cultura libre."

 GEH_centre_of_culture_a: "Bauhaus"
 GEH_centre_of_culture_a_desc: "La Bauhaus, clausurada por el régimen de Hitler en Alemania, ha reabierto con el apoyo del Comité de Disciplina de Gehenna. Incluso Ako, quien desconfía más que nadie de los locales, parece muy interesada en los nuevos diseños arquitectónicos que proponen los arquitectos alemanes para los edificios del Comité."

 GEH_centre_of_culture_b: "Exposición de arte degenerado"
 GEH_centre_of_culture_b_desc: "El expresionismo, reprimido como 'arte degenerado' por el régimen hitleriano, empieza a florecer de nuevo. El Comité apoyará la creación de una nueva universidad de arte y espera que las estudiantes de Gehenna, a través del arte, calmen aunque sea un poco su violencia. Aunque… probablemente no pase."

 GEH_centre_of_culture_c: "Nocturno hacia la luz"
 GEH_centre_of_culture_c_desc: "Con la ayuda de Sorasaki Hina, se ha inaugurado el nuevo Conservatorio Gehenna–Baviera, donde las estudiantes de Gehenna podrán asistir libremente a clases. Strauss, un músico excepcional, quiere enseñar allí personalmente y abrir un nuevo movimiento musical que combine la música de Gehenna con el romanticismo."

 GEH_centre_of_culture_end: "Arte Gehenna–Baviera"
 GEH_centre_of_culture_end_desc: "El arte de Gehenna y Baviera ha entrado en armonía y ha creado un nuevo movimiento artístico. Esperamos que esto reduzca aún más el conflicto entre locales y gehenna, y que sea una oportunidad para que ambos se comprendan más profundamente."

 GEH_68_rev: "Imponer nuestro método"
 GEH_68_rev_desc: "No debemos asimilarnos a la cultura alemana. La cultura de supremacía masculina, la discriminación hacia las mujeres y la malévola cultura nacionalsocialista extendida por la sociedad… No somos nosotros quienes debemos aprender de ellos: son ellos quienes deben aprender de nosotros."

 GEH_68_rev_for_prefect_team: "Reeducación de los estudiantes alemanes"
 GEH_68_rev_for_prefect_team_desc: "Parte de la cultura tradicional alemana tiene valor. Pero el patriarcado religioso y sociocultural de Alemania no lo tiene. Hace falta educación coercitiva desde la etapa estudiantil para adaptarse a la cultura 'moderna' de Kivotos, y una purga de las fuerzas religiosas conservadoras."

 GEH_gradual_gehenna_culture: "Moderación mediante la separación"
 GEH_gradual_gehenna_culture_desc: "Desmantelar por la fuerza la cultura popular alemana y 'kivotizarla' generará una fuerte reacción. Un método mejor es separar por etnias y, poco a poco, hacer que comprendan nuestra cultura."

 GEH_cultural_exchange_education: "Institución educativa de intercambio cultural"
 GEH_cultural_exchange_education_desc: "Crearemos una institución educativa gratuita, dirigida por el Comité de Disciplina, para que la población de origen gehenna y la población alemana aprendan sobre la cultura del otro y comprendan sus diferencias."

 GEH_gradual_gehenna_culture_for_prefect_team: "Un país, dos sistemas"
 GEH_gradual_gehenna_culture_for_prefect_team_desc: "Lo importante es que la separación residencial entre gehenna y alemanes no se convierta en una política brutal de segregación al estilo sudafricano. Nuestra separación racial será temporal, hasta que dos pueblos con más de un siglo de diferencia cultural y tecnológica puedan comprenderse; y todos los alemanes estarán protegidos por las mismas leyes que los gehenna."

 GEH_civil_rights_act: "Promulgar la Ley de Derechos Civiles"
 GEH_civil_rights_act_desc: "En esencia, esta ley de derechos civiles copia el borrador que escribió Onikata Kayoko en Luxemburgo. Pero a diferencia de muchos directivos del Comité que solo pensaron en los derechos de los gehenna y pasaron por alto el racismo hacia bestias y autómatas, el borrador de Kayoko garantiza los derechos de estas poblaciones kivotianas 'no humanas'. Tras unas pequeñas revisiones, vale la pena introducirlo también en el Comité de Disciplina."

 GEH_political_correctness: "Corrección política"
 GEH_political_correctness_desc: "Con la Ley de Derechos Civiles, se resolvió el problema de racismo hacia los kivotianos —una minoría—, pero aún persiste un racismo intangible dirigido contra los gehenna. Políticas como cuotas para funcionarios locales y puntos adicionales ayudarán sin duda."

 GEH_local_autonomy: "Asambleas locales"
 GEH_local_autonomy_desc: "Tras la Ley de Derechos Civiles, los alemanes desarrollaron una sensación de victimismo: creen que están siendo colonizados por los gehenna, que son una minoría. La interferencia local en la política central de Gehenna debe limitarse, pero podemos calmar su ira con asambleas locales limitadas para los alemanes."

 ### ¡¡¡La huida de Hina!!! ###
 #### Dictadura de Hina
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h: "Cambio abrupto"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_desc: "Con los guardias leales fanáticos de Sorasaki Hina apoderándose de la política, la dimisión y desaparición de la jefa Hina ha sumido al Comité en el mayor caos jamás visto. Los guardias se han dividido entre quienes aceptan su desaparición y quienes no pueden aceptarla."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1: "Persona"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_desc: "Sorasaki Hina debía ser una deidad viviente, la líder que guiaría a Gehenna hacia la gloria. Es imposible que un dios con forma humana abandone a sus creyentes y huya. ...Si ella era una falsa deidad, si ya no queda nada que venerar, entonces crearemos a nuestro dios."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge: "Purgas silenciosas"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_purge_desc: "Hay miembros del Comité que afirman que Sorasaki Hina ha sido 'reemplazada' y que la Hina actual es falsa. Son los opositores dentro de los guardias que se negaron a sustituir a Hina por un robot. Qué idiotas tan ruidosos. Si la 'jefa Hina' camina perfectamente por el cuartel general, será fácil tacharlos de locos y purgarlos."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance: "Vigilancia de internet"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_internet_surveillance_desc: "Como el nuevo dios es una máquina, puede vigilar enormes cantidades de información en poco tiempo conectándose a internet. Esta capacidad será extremadamente útil para detectar a los 'antipatriotas' de Gehenna que operan en la red."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel: "Sumisión nacional"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_will_of_steel_desc: "La imagen de la jefa del Comité trabajando sin descanso por la gloria de Gehenna es una virtud que todos deben imitar. El 'fervor' por el dios-máquina, que hoy solo circula entre los miembros del Comité, se convertirá en una religión de Estado que sustituirá a las religiones existentes en Alemania."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform: "Reforma de los ministerios"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_reform_desc: "La Guardia, antes una organización informal, será renombrada oficialmente como el Departamento de Guardia. La administradora principal Ako asumirá nominalmente la jefatura del Departamento de Guardia, y este tendrá autoridad para vigilar el pensamiento de toda la población ante cualquier deslealtad hacia Sorasaki Hina, además de una jurisdicción judicial independiente que incluirá el derecho de ejecuciones sumarias contra basura subversiva."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council: "Establecer un Comité de Emergencia"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_emergency_council_desc: "Ha nacido un gran líder de hierro. A diferencia del dios débil de antes, el nuevo líder de hierro está listo para consumir sin dudar a todos los ciudadanos como recursos y usarlos como leña para el gran desarrollo de la patria."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation: "Decreto de movilización total"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mobilisation_desc: "Convertirse en una pieza para la patria también es algo glorioso para el propio ciudadano. ¿No es así?"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas: "Consumación del capitalismo de Estado"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_desc: "El dios-máquina controlará toda la economía y asignará cuotas de producción a cada empresa. La economía nacional, desde luego, también debe ser una herramienta controlada por el Comité de Disciplina."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2: "Una nueva sociedad"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_ogas_2_desc: "Todos los ciudadanos se convierten en piezas para el Estado y la economía queda controlada por el nuevo líder. Todo marcha perfectamente."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind: "Núcleo de imitación emocional"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_mind_desc: "Las emociones le parecían un concepto bastante... inútil a la nueva Sorasaki Hina, pero al menos hace falta un programa mínimo de núcleo emocional para interpretar un papel amable frente a los miembros del Comité."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina: "El problema de Sorasaki Hina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_hina_desc: "Antes de la reencarnación del dios-máquina existía la Sorasaki Hina original. Que una falsa deidad que traicionó a los creyentes siga viva y escondida en algún lugar es un asunto bastante desagradable... hay que encontrarla y eliminarla."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end: "Caza de Baal"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_1_end_desc: "La administradora principal Ako presentó un informe leal: han capturado a una desequilibrada que asegura ser la 'verdadera Sorasaki Hina'. Gracias al nuevo núcleo emocional, parece que podremos fusilar con gusto a 'Sorasaki Hina'."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2: "Revolución celestial"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_desc: "La jefa del Comité, Sorasaki Hina, horrorizada por nuestra indignidad, abandonó el trono y desapareció por voluntad propia. Eso significa que nuestra cultura de Gehenna, los alemanes, todo Kivotos… o incluso la cultura de Europa… no estaban a la altura de la 'guía de la jefa Hina'. Para seguir el camino de nuestra salvadora perdida, debemos remodelarlo todo: Estado y sociedad, cultura, conducta, lenguaje… y hacerlo más íntegro."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution: "Procesamientos indiscriminados"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_indiscriminate_prosecution_desc: "¡Procesen y juzguen a todos! ¡En nombre del Comité Revolucionario, viva! ¡Y muerte a los traidores! ¡Matamos a la Gehenna que mató a Sorasaki Hina! ¡Desde lo más bajo, apuñalen y derriben a lo más alto!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism: "El liberalismo de Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_liberalism_desc: "¡Gehenna, en esencia, no tiene control! Si miras el gobierno benevolente de Pandemonium y el Comité, los derechos libres de tantos clubes, y las numerosas reuniones que la jefa tuvo con los clubes de Gehenna, ¡la libertad es el corazón puro de la cultura de Gehenna! ¡Viva la libertad!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics: "La política del orden de Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehennas_order_politics_desc: "¡Sorasaki Hina siempre encarceló personalmente a los terroristas de Gehenna! ¡Eso prueba que, dentro de la decadente cultura de Gehenna, Sorasaki Hina perseguía el orden! ¡Viva el orden!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack: "Atacar a los 'rebeldistas'"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_rebel_attack_desc: "'Rebeldista' es una etiqueta populista que los fervientes revolucionarios usan para referirse a 'todos aquellos que sobrecargaron a Sorasaki Hina con tareas inmensas, fomentaron el caos de Gehenna-Alemania y realizaron actividades anti-jefa del Comité'."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution: "Revolución cultural"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_desc: "Es justo barrer esa cultura decadente euro-kivotiana que chirría como si hubiéramos encajado engranajes equivocados: Gehenna–Trinity–Alemania–Kivotos–Europa… y establecer nuestro orden. ¡Viva la jefa Sorasaki Hina!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_cultural_revolution_tt: "Ya no podremos avanzar el árbol relacionado con §Yla cultura Gehenna–Baviera§!, y todos los §Yespíritus nacionales§! relacionados desaparecerán."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist: "El traidor es de izquierda"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_communist_desc: "¡Esos terroristas rojos de izquierda fueron quienes incitaron y manipularon a nuestra Sorasaki Hina y fomentaron el caos de la academia con actividades anti-Gehenna a gran escala! ¡Arresten a todos y prohíban toda actividad llamada 'vanguardia' en la revolución!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist: "El traidor es de derecha"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_you_are_a_nazist_desc: "¡Esos nazis terroristas de derecha intentaron manipular a la jefa desde las sombras, lideraron actividades anti-Gehenna mediante milicias armadas y buscaron apoderarse de la academia! ¡Arresten a todos y prohíban toda actividad de 'ultraconservadurismo' en la revolución!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished: "Revolución consumada"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_revolution_accomplished_desc: "Por fin se ha decidido la orientación política del Gobierno Revolucionario Estudiantil de Gehenna; a partir de ahora, queda fijada la brújula para la adoración eterna a Sorasaki Hina y para innumerables reformas políticas."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism: "'Sorasakismo'"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_sorasakism_desc: "El 'Sorasakismo' es un conjunto de movimientos políticos, sociales y religiosos que revisan todas las palabras y pasos de la jefa Sorasaki Hina y buscan heredar su conducta. En la política, se piensa en sus políticas; en la sociedad, en sus frases; en la religión, en su trayectoria. Es un estilo de vida que impulsa e ilumina al Estado entero —o al individuo— mediante la práctica y la disciplina."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune: "Comuna de Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_gehenna_commune_desc: "¡Viva la Gehenna libre, igualitaria y caótica: con sus clubes libres, los consejos revolucionarios, los sindicatos libres y los incontables gobiernos autónomos populares! ¡Viva la Comuna! ¡Viva la academia del caos y la libertad!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy: "Éxtasis religioso"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_religious_ecstasy_desc: "Debemos desconfiar tanto de la izquierda como de la derecha y heredar el auténtico 'Sorasakismo' hasta encarnarlo como una forma de vida. Viva el Sagrado Estado de Gehenna. Y viva, también, la difunta jefa del Comité, Sorasaki Hina."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state: "Segundo Estado del Orden"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_h_2_second_order_state_desc: "\"¡Arresten a todos los rebeldistas!\"\n¡Debemos establecer el Estado del Orden de Gehenna para purgar de un golpe a los innumerables 'rebeldistas' que amenazaron y manipularon a Sorasaki Hina! ¡Viva la nueva 'actividad disciplinaria'! ¡Viva la Gehenna del orden!"
 #### Ako
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a: "Administradora principal del Comité de Disciplina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_desc: "Pese a los esfuerzos de Ako por dispersar el poder de la jefa Hina e introducir una tecnocracia para reducir su carga, Hina dejó una sola carta de renuncia y desapareció. Lo que llenó el corazón de Ako no fue la traición, sino una maldición contra sí misma por su inutilidad al no poder cambiar el resultado."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha: "Iroha, jefa del Comité de Disciplina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_iroha_desc: "Después de apoderarnos de Pandemonium, se consideró que Natsume Iroha era la opción más razonable para heredar el puesto de jefa del Comité de Disciplina, que había quedado vacante durante mucho tiempo mientras continuaba el liderazgo colectivo. Es una simple burócrata sin afiliación de facción y, por venir del antiguo Pandemonium, carece de influencia dentro del Comité: también es alguien 'fácil de manejar'."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko: "Kayoko, jefa del Comité de Disciplina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_kayoko_desc: "Onikata Kayoko también es un talento excepcional capaz de asumir el puesto de jefa del Comité de Disciplina, vacante durante largo tiempo bajo el liderazgo colectivo. Es alguien en quien la administradora principal Ako confía por tener 'un talento sobresaliente'; y aunque no sea la opción ideal como marioneta, respetará nuestra tecnocracia y tomará decisiones beneficiosas para el futuro de Gehenna."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar: "Intervención del Departamento de Planificación en el presupuesto"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_seminar_desc: "El 'Seminar' de Millennium es un grupo tan perfecto y ejemplar que puede llamarse la joya de la tecnocracia. Una organización compuesta por tecnócratas sobresalientes se encarga de la elaboración del presupuesto, y los demás departamentos deben presentarles todos sus proyectos para que aprueben sus partidas. Aunque por una oposición dura el régimen de [ROOT.GetLeader] no pueda crear un nuevo Seminar... al menos podremos mostrar nuestra dureza en el asunto presupuestario."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget: "Recorte del presupuesto de defensa"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_reduction_in_defense_budget_desc: "No es exactamente por represalia política, pero el Departamento de Planificación desea reducir el presupuesto desmesurado del Departamento de Ejecución y redirigirlo al desarrollo industrial. Lo repetimos: esto no es represalia política, sino una redistribución eficiente del presupuesto."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture: "La academia de la cultura"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_centre_of_culture_desc: "$GEH_4th_ako_centre_of_culture_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future: "Beca Conmemorativa Sorasaki Hina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_future_desc: "Aunque nos abandonó y se fue, Sorasaki Hina fue una existencia demasiado valiosa tanto para la administradora Ako como para todo el Departamento de Planificación. Ako creará una fundación de becas a su nombre para otorgar ayudas a estudiantes sobresalientes de universidades de arte, sin distinguir entre kivotianos y locales."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start: "Lucha por un Estado policial"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_start_desc: "Lo que hizo que la jefa Hina se marchara fueron las incontables tareas, la cultura social corrompida, y los viles criminales locales... todo ello. El Departamento de Planificación sostiene que no debe concederse ni una pizca de misericordia a los locales que hicieron que la jefa Hina se fuera."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1: "Represión de empresas locales"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_1_desc: "Para evitar que los alemanes concentren poder, es crucial cortarles la financiación. Debemos obstaculizar que los alemanes funden empresas y, si llegan a hacerlo, imponer restricciones para que necesariamente sean sociedades mixtas con kivotianos."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2: "Consumación del cooperativismo nacional"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_left_2_desc: "Hemos completado un cooperativismo dirigido por el Estado y construido un sistema económico correcto, controlado por tecnócratas."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center: "Formar un equipo de búsqueda de Hina"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc: "Aunque Hina abandonara a Ako, Ako no abandonó a Hina. Aunque tenga que tirar a la basura todo el resto de su vida, incluso si Hina ya... hubiera dejado este mundo. Ako dedicará lo que le quede de existencia a encontrar siquiera sus restos."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1: "Plan educativo"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_1_desc: "Para formar a los tecnócratas del futuro, se implementará un programa educativo especializado."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2: "Ley [ROOT.GetLeader]"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_right_2_desc: "En la nueva Gehenna, ¿cómo deben redefinirse los derechos de los nativos alemanes? Que la ley refleje la visión pluralista de Kayoko o el odio hacia los locales que sostiene el Departamento de Planificación dependerá de la líder que elegimos en el pasado."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end: "World We Changed"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_a_end_desc: "\"Jefa... el mundo no puede cambiarlo una sola persona. Claro, usted tampoco puede hacerlo sola. ...Solo cuando estemos usted y yo juntas, podremos cambiar el mundo.\""

 #### Iori
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c: "La noche del caos"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack: "Atacar a los débiles"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_weak_attack_desc: "Los ciudadanos alemanes que ensucian la cultura pura de Gehenna–Kivotos son, sin duda, tumores malignos de nuestra Gehenna. Para proteger la cultura pura de Kivotos y evitar que manchen el gran espíritu de Gehenna, debemos impedir que los ciudadanos alemanes trabajen en altos cargos del gobierno. ...Por supuesto, con esto también podremos aliviar la presión política que se ejerce contra nuestro gobierno."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism: "Kivotosismo nacional"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_kivotosism_desc: "¡Nuestra ley marcial existe porque la jefa del Comité, Hina, 'desapareció por los disturbios de los alemanes', cargando con un trabajo abrumador; algo que claramente no habría ocurrido en el pasado, cuando solo existía la cultura de Kivotos!"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity: "Nuestra identidad"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_our_identity_desc: "La Academia Gehenna debe conservar siempre la cultura pura de Kivotos, y eso quedará establecido como principio rector de nuestro nuevo gobierno. La diferencia entre kivotianos y terrícolas es evidente, y debemos proclamar que nosotros somos la 'humanidad' verdaderamente avanzada."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance: "Alianza de Defensa de la Patria Libre"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_free_fatherland_defense_alliance_desc: "Para proteger la cultura pura de Gehenna–Kivotos y defender la patria, hace falta una sólida solidaridad entre estudiantes, ciudadanos y gobierno. Nuestra cúpula se reorganizará como la nueva 'Alianza de Defensa de la Patria Libre', que proyectará el liderazgo del gobierno sobre el pueblo y será el primer paso para fundar una academia fuerte y unida."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee: "Comité Unido de Reconstrucción Nacional"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_united_nation_reconstruction_committee_desc: "Ya todos están agotados. Gehenna necesita sanar. La Academia Gehenna ha sufrido demasiados incidentes y accidentes, y ha sido contaminada por los motines de incontables clubes y el terrorismo de organizaciones rebeldes alemanas. Ahora debemos limpiar esa contaminación: estableceremos el 'Comité Unido de Reconstrucción Nacional' para reconstruir nuestro país."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree: "Decreto de disturbios de Ratisbona"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_regensburg_riot_decree_desc: "No podemos seguir tolerando que antipatriotas anti-Kivotos, terroristas de Gehenna, comunistas y nazis campen a sus anchas en el país. Debemos impulsar una ley contundente para que hechos como el Disturbio de Ratisbona —un motín masivo claramente dirigido contra el Comité de Disciplina— no vuelvan a repetirse."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_territory_reconstruction_ministry_establishment: "Establecer el Ministerio de Reconstrucción Territorial"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_national_territory_reconstruction_ministry_establishment_desc: "El Departamento de Planificación se corrompió día tras día bajo el liderazgo de Amau Ako, y desde que Ako huyó con parte de la oposición, ha cometido traición apoyando o tolerando a las fuerzas anti-ley marcial y entorpeciendo nuestro rumbo. El Departamento de Planificación debe ser disuelto."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_planning_ministry_role_expansion: "Expandir el rol del Departamento de Planificación"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_planning_ministry_role_expansion_desc: "Ahora que Amau Ako ha desaparecido, debemos borrar por completo su nombre del Departamento de Planificación y reorganizarlo como una institución rectora normal de Gehenna. No podemos dejar que incluso los capaces del departamento se pudran con ella."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_order_restoration: "Restaurar el orden de Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_order_restoration_desc: "A medida que la mayoría de los remanentes anti-ley marcial son barridos, promulgaremos una nueva constitución para estabilizar Gehenna, construir una Gehenna fuerte, proteger la academia de los estudiantes de Gehenna y crear una república de la nación."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_priority: "Gehenna primero"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_gehenna_priority_desc: "Por supuesto, nuestras acciones deben realizarse para el pueblo de Gehenna, con el apoyo de los estudiantes de Gehenna. Apoyaremos a nuestro pueblo: el que vive en la Academia Gehenna, nos respalda y debe ser protegido de las amenazas de innumerables potencias extranjeras."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pan_kivotos: "Pan-Kivotos"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pan_kivotos_desc: "Para resistir la civilización humana anti-Kivotos, no basta con Gehenna: las estudiantes de todo Kivotos deben unirse. La Academia Gehenna se hará más grande y acogerá a más estudiantes."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_forced_assimilation: "Asimilación forzada de los alemanes"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_forced_assimilation_desc: "Para reconstruir la civilización de Kivotos–Gehenna, los alemanes deben desaparecer. La cultura alemana será clausurada gradualmente, y adoptarán nombres al estilo Kivotos y la civilización al estilo Gehenna."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_gehennan: "Alemanes de Gehenna"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_german_gehennan_desc: "Por la reconstrucción, por ese nombre puro, deben cooperar todos: sean kivotianos de Gehenna, kivotianos de Kivotos o alemanes. Para ello, emitiremos ciudadanía legítima también a los alemanes y los aceptaremos como ciudadanos de segunda."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pure_kivotos_cultural_leap: "Salto cultural de Kivotos puro"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_pure_kivotos_cultural_leap_desc: "Para filtrar la contaminación cultural, debemos seleccionar la cultura pura de Kivotos y proteger la cultura, el idioma y el ocio puros de la nación de Gehenna y Kivotos. Esto debe lograrse hasta que nuestra espléndida comunidad brille para siempre."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_forward_step_of_jeminj: "Un paso adelante de todos los pueblos"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_forward_step_of_jeminj_desc: "Míralo, Amau Ako. En vez de ese jueguito de papeles y evaluaciones de viabilidad, a alemanes y gehenna les funciona mejor un clamor cargado de emoción y propaganda de masas. Nuestro 'pueblo de Gehenna' dará un salto hacia el mañana."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_leader_of_nation_and_fatherland: "Líder de la nación y la patria"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_leader_of_nation_and_fatherland_desc: "Para alabar la cultura pura de Kivotos y proteger el sol brillante del mañana, el líder de nuestro Estado debe ser como un agricultor que cultiva la tierra. Amenazas del este y del oeste, enemigos internos y tantas impurezas... para expulsarlas, hace falta un poder único más fuerte y más grande."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_conscription_equality: "Igualdad bajo la conscripción"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_c_conscription_equality_desc: "Se implementará un servicio militar universal en el que, sin importar afiliación, origen o especie, cualquiera que complete el servicio podrá ejercer derechos civiles legítimos. La contaminación cultural no existe solo en la Tierra: también dentro de Gehenna. Para proteger 'nuestra patria', forjaremos un gran Estado."

 #### Normal
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n: "Tu lugar, entre tres"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_desc: "No hay excusa posible, ni propaganda brillante capaz de ocultarlo. Sorasaki Hina desapareció dejando solo una carta de renuncia, y nuestro gobierno ha quedado paralizado. Amau Ako asumió como jefa interina del Comité, pero parece sufrir más desesperación y culpa que voluntad de tomar nuevas responsabilidades."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left: "Con el botiquín al hombro"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_left_desc: "Los burócratas vacilan tras la renuncia de Sorasaki Hina. El enorme peso de responsabilidad que ella cargaba cae con fuerza sobre los miembros comunes del Comité de Disciplina."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right: "Reforzando la voluntad del especialista"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_right_desc: "La moral de los soldados comunes del Comité, incluidos los del Departamento de Ejecución, está por los suelos. Evitar que nuestro ejército colapse es, precisamente en esta época, el papel más difícil de Iori."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start: "Para rescatarte"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_start_desc: "Tras la renuncia de la jefa del Comité, Amau Ako no puede desempeñar su trabajo con normalidad debido a la culpa. Incluso sin ser la experta médica Chinatsu, cualquiera puede ver que el estado de Ako corresponde a un trastorno depresivo. El problema es que la administradora, más allá de expresar tristeza, cada vez habla más abiertamente de una 'expiación total' hacia la jefa Hina. ...Antes de ver a la administradora principal colgándose de un árbol, debemos actuar."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform: "Una reforma demasiado tardía"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_late_reform_desc: "La carga de trabajo sobre la jefatura del Comité era excesiva, y que debimos dispersar autoridad mediante una reforma burocrática... se reveló como correcto, pero demasiado tarde. Hace falta otorgar más facultades a los burócratas intermedios del Departamento de Planificación y garantizar su autonomía."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting: "Reunión de enlace del Departamento de Guerra"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_liaison_meeting_desc: "Quizá las políticas militaristas de Iori eran correctas. Si hubiéramos aplicado su línea dura... tal vez la jefa Hina habría fortalecido su voluntad por el deber de proteger Gehenna. La reunión de enlace establece un 'Departamento de Guerra' centrado en el Departamento de Ejecución y permite que los líderes militares del Departamento de Ejecución usen el presupuesto con mayor autonomía."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work: "Recuerdos de los fervientes"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_decentralization_of_work_desc: "Tal vez la pasión de quienes decían que solo Sorasaki Hina podía liderar el Comité tenía algo de razón. Quizá, porque no la valoramos, ella tampoco nos valoró. Reunidos de nuevo entre remordimientos, los fervientes recopilarán los registros sobre Hina para escribir una biografía crítica y hacer que sea recordada para siempre."
 
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership: "Elección directa de la jefatura del Comité"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_new_leadership_desc: "A partir de ahora, la jefatura del Comité se decidirá por votación de las y los directivos del Comité. Concluimos que cargamos a la jefa Hina con un peso excesivo, y que eso proviene del carácter de 'dictador caudillo' inherente al cargo. Un líder que deba someterse a revalidación en cualquier momento y pueda ser destituido por votación tendrá también una carga y presión política más ligera."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center$"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_investigative_operation_desc: "$GEH_basking_in_the_brilliance_of_their_serenade_rout_a_center_desc$"

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness: "La bandera de la justicia"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_righteousness_desc: "El Comité de Disciplina quedó con una herida imposible de olvidar. Con reformas, superamos los errores del pasado y hemos construido una organización de la que no tengamos que avergonzarnos ante la jefa Hina, que ya no está."

 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end: "Para que salga el sol de mañana"
 GEH_basking_in_the_brilliance_of_their_serenade_rout_n_end_desc: "Llegó un informe: han encontrado a la jefa Hina, que estaba desaparecida, gracias a la administradora principal Ako. Hina se niega a volver a su trabajo como jefa del Comité, pero… ¿no podríamos, mediante la persuasión, al menos lograr que vuelva a sentarse en ese asiento vacío a nuestro lado, y que, aunque sea desde allí, nos vigile?"

 ### Diplomacia
 GEH_diplomacy_focus: "Diplomacia de [ROOT.GetName]"
 GEH_diplomacy_focus_desc: "Tras la Tercera Asamblea General del Comité de Disciplina, comprendimos el futuro: de qué manera debemos conducir nuestra diplomacia dentro de la comunidad internacional."

 GEH_diplomacy_isolationism_focus: "La defensa primero"
 GEH_diplomacy_isolationism_focus_desc: "Dejémoslo claro. No seguiremos el camino del 'Tronador'. La guerra de conquista no es el futuro correcto de Gehenna; encontraremos la forma de defender nuestra patria de los ataques enemigos."

 GEH_diplomacy_isolationism_focus_1: "Buscar aliados"
 GEH_diplomacy_isolationism_focus_1_desc: "Buscaremos aliados para construir con nosotros un sistema de seguridad colectiva. ...Al menos un país debería aceptar, ¿no?"

 GEH_diplomacy_isolationism_focus_2: "Construir líneas defensivas"
 GEH_diplomacy_isolationism_focus_2_desc: "Dicen que el ataque es la mejor defensa, pero ¿qué hay de las vidas de los ciudadanos que morirán por ese ataque? Fortificar el territorio es el camino más correcto."

 GEH_diplomacy_isolationism_focus_3: "Gehenna, patria de paz"
 GEH_diplomacy_isolationism_focus_3_desc: "Nos basta con conservar lo que tenemos. No necesitamos expandirnos a más territorio."

 GEH_diplomacy_managed_democracy_focus: "Expandir la democracia controlada"
 GEH_diplomacy_managed_democracy_focus_desc: "Gehenna tiene una misión moral: difundir libertad y democracia por todo Kivotos. En términos de realpolitik, ya controlamos Gehenna entera; podremos establecer estados satélite en Kivotos y en todo el suroeste de Europa para incorporar a Europa dentro de nuestra esfera de influencia."

 GEH_diplomacy_managed_democracy_focus_1: "Redemocratización euro-kivotiana"
 GEH_diplomacy_managed_democracy_focus_1_desc: "Sabemos que muchos países de Kivotos son autoritarios, y les llevaremos libertad y justicia."

 GEH_diplomacy_realpolitik_focus: "Gehenna en expansión"
 GEH_diplomacy_realpolitik_focus_desc: "Gehenna debe hacerse más grande. En especial el peligroso enemigo oriental, [SOV.GetName], para mantener nuestro orden... debe ser destruido. Si los dejamos crecer, algún día nos conquistarán."

 GEH_diplomacy_realpolitik_focus_1: "Avance hacia el Este"
 GEH_diplomacy_realpolitik_focus_1_desc: "El gran oso del Este, [SOV.GetName], es una seria amenaza para nuestra seguridad y debe ser eliminado."

 GEH_diplomacy_find_collaborator: "Buscar colaboradores"
 GEH_diplomacy_find_collaborator_desc: "Podremos encontrar colaboradores que caminen junto a nuestra gran voluntad."

 GEH_diplomacy_european_hegemonic: "Hegemonía Kivotos–Europa"
 GEH_diplomacy_european_hegemonic_desc: "Nuestro poder ha erguido tanto a Europa como a todo Kivotos. ¡Viva la gran líder [ROOT.GetLeader]!"

 GEH_diplomacy_crisis_in_kivotos_focus: "La crisis de Kivotos"
 GEH_diplomacy_crisis_in_kivotos_focus_desc: "Se nos ha concedido la sagrada misión de proteger el orden social, y tenemos el deber justo de defender Kivotos de la amenaza inminente de [GEI.GetName]."

 GEH_diplomacy_chroma_crisis_focus: "Enfrentamiento contra los Colores"
 GEH_diplomacy_chroma_crisis_focus_desc: "Los Colores, un enemigo desconocido llegado de otro mundo, esparcen una locura que enloquece a nuestros ciudadanos. No hay forma de negociar con ellos: solo queda enfrentarlos."

 GEH_diplomacy_decagrammaton_crisis_focus: "Enfrentamiento contra Decagrammaton"
 GEH_diplomacy_decagrammaton_crisis_focus_desc: "Esos que se autoproclaman la Existencia Absoluta son nuestros enemigos naturales, y por la victoria de la humanidad debemos enfrentarnos a esos robots."

 GEH_diplomacy_decagrammaton_alliance_focus: "Alianza con Decagrammaton"
 GEH_diplomacy_decagrammaton_alliance_focus_desc: "No son una existencia peligrosa. Son practicantes que se entrenan hacia un plano superior. No se resistan."
 ### Diplomacia de la ruta “Hina huye” ###

 GEH_three_congress_focus_no_hina_diplomacy: "4.ª Asamblea General [ROOT.GetAdjective]"
 GEH_three_congress_focus_no_hina_diplomacy_desc: "Guerra, conflictos, caos político... Desde la Gran Transferencia hemos sufrido mucho, pero aun así el gobierno de [ROOT.GetLeader] por fin está listo para estabilizar la situación y celebrar la 4.ª Asamblea General. En esta nueva asamblea decidiremos nuestra política exterior, ahora que hemos completado la integración interna."

 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux: "Integración de los Países Bajos"
 GEH_three_congress_focus_no_hina_diplomacy_attack_benelux_desc: "Los Países Bajos han caído en el caos por el enfrentamiento entre el incompetente Consejo Estudiantil General y Schale. Todos ellos son nuestros enemigos."

 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux: "Respetar el gobierno de los Países Bajos"
 GEH_three_congress_focus_no_hina_diplomacy_befriend_benelux_desc: "Dejaremos que el Consejo Estudiantil General o Schale gobiernen los Países Bajos como les plazca. Nuestro objetivo está en algo más grande... y no hay necesidad de malgastar poder nacional en una guerra contra ellos."

 #### Excepcionalismo de Gehenna
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first: "Excepcionalismo de Gehenna"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_desc: "Gehenna es un Estado excepcional dentro del orden previo de Kivotos, y posee el poder y la legitimidad para apoderarse de la hegemonía de todo Kivotos."

 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union: "Frente de Mitteleuropa"
 GEH_three_congress_focus_no_hina_diplomacy_central_europe_union_desc: "Ningún país puede sostenerse por sí solo. Para construir una gran Gehenna, estableceremos un frente de cooperación con los países más confiables."

 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium: "Conquista de Kivotos Occidental"
 GEH_three_congress_focus_no_hina_diplomacy_attack_millennium_desc: "La extraordinaria tecnología de la región de Millennium debe usarse para Gehenna, no para ellas."

 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser: "Erradicar la influencia de Kaiser"
 GEH_three_congress_focus_no_hina_diplomacy_attack_kaiser_desc: "Kaiser Corporation, incluso antes de la Gran Transferencia, apoyó incontables crímenes y actos de anarquía por toda Kivotos. Y ellos también albergan ambiciones de conquistar Kivotos. Kaiser y las ambiciones de [KAI.GetLedaer], incompatibles con el orden de Gehenna, deben ser erradicadas."

 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos: "Conquista de Kivotos del Sur"
 GEH_three_congress_focus_no_hina_diplomacy_attack_south_kivotos_desc: "Tras la Gran Transferencia, los estados de Kivotos del Sur trasladados al sur de Gehenna se han convertido en una gran amenaza. Hacer que dejen de existir es el camino hacia el orden de Gehenna."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1: "Imponer nuestra disciplina"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_1_desc: "Desde antes de la Gran Transferencia, buscamos construir una sociedad correcta en Gehenna mediante disciplina y orden. Haremos lo mismo en nuestros territorios ocupados. Les guste o no."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2: "Kivotos como uno solo"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_2_desc: "El caos causado por la Gran Transferencia provocó choques entre los estados de Kivotos y los estados locales. Si Kivotos no se une bajo un gran orden, acabaremos derrotados en la división."

 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3: "Todo orden conduce a Gehenna"
 GEH_three_congress_focus_no_hina_diplomacy_gehenna_first_discipline_3_desc: "El sueño del Tronador se ha cumplido. Gehenna se alza por encima de Kivotos. Todas las heroínas y héroes de Gehenna se sentirán orgullosos de nosotros. La gloria de [ROOT.GetName] y la victoria de [ROOT.GetLeader] están ante nuestros ojos."

 #### Protector de Kivotos
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom: "Protector de Kivotos"
 GEH_three_congress_focus_no_hina_diplomacy_protection_of_freedom_desc: "Debemos avanzar hacia el Este y enfrentar a los malvados estados humanos orientales que amenazan a Kivotos. Seremos un escudo firme que proteja a Kivotos del oso rojo."

 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium: "Reclamar el Intermarium"
 GEH_three_congress_focus_no_hina_diplomacy_claim_intermarium_desc: "Europa del Este es una zona de amortiguamiento que, inevitablemente, debemos poseer para defendernos del ataque de [SOV.GetName]."

 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration: "Declaración antibolchevique"
 GEH_three_congress_focus_no_hina_diplomacy_anti_bolshevism_declaration_desc: "Eso que llaman marxismo-leninismo no es más que una ideología burda, peor incluso que el bigote postizo de la secretaria Cherino de Red Winter. Para difundir el orden libre de Gehenna, lucharemos con firmeza contra toda forma de bolchevismo."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet: "Operación Crepúsculo de los Dioses"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_desc: "Moscú es como una puerta podrida: si el gran ejército de Gehenna la patea, se desmoronará y se abrirá. Toda la preparación está lista; lucharemos por la gloria de Gehenna. ¡La victoria será nuestra!"

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1: "Reclutar voluntarios del Ejército Blanco"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_1_desc: "Si contactamos con fuerzas locales que resisten el gobierno opresivo de [SOV.GetName], podremos obtener ventajas para nuestras operaciones en el Este."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2: "Entrenamiento de emergencia para la guerra de invierno"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_2_desc: "El territorio de [SOV.GetAdjective] es extremadamente frío e inhóspito; debemos prepararnos con equipo y entrenamiento especial para la guerra invernal."

 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3: "Colonización oriental de Gehenna"
 GEH_three_congress_focus_no_hina_diplomacy_attack_soviet_3_desc: "Los nuevos territorios orientales, tras una administración adecuada, serán integrados en Gehenna. Hemos vencido esta guerra y protegido a Kivotos de la pesadilla roja. Este gran logro será recordado por siempre."

 #### Realpolitik
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik: "Realpolitik"
 GEH_three_congress_focus_no_hina_diplomacy_realpolitik_desc: "Obtendremos varios aliados y tomaremos la hegemonía política y militar de Europa Central."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance: "Alianza con Kivotos del Sur"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_alliance_desc: "Kivotos del Sur está cerca y nuestros intereses coinciden en parte. Cooperar con ellos podría traer prosperidad mutua."

 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge: "Integración de Kivotos del Sur"
 GEH_three_congress_focus_no_hina_diplomacy_south_kivotos_merge_desc: "Kivotos del Sur puede convertirse en un enemigo potencial; antes de que nos ataquen, debemos golpearlos primero."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance: "Ejercer influencia en los Balcanes"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_alliance_desc: "Los Balcanes están divididos, pero son fuertes; pueden ser un buen socio."

 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge: "Conquista de los Balcanes"
 GEH_three_congress_focus_no_hina_diplomacy_balkans_merge_desc: "Como están divididos, los Balcanes son un enemigo que podemos derrotar por partes y deben ser eliminados para nuestra política de expansión."

 GEH_three_congress_focus_no_hina_diplomacy_attack_italy: "Operación Alarico"
 GEH_three_congress_focus_no_hina_diplomacy_attack_italy_desc: "Italia logró preservar su régimen incluso tras la Gran Transferencia, pero su suerte se acaba aquí. El trono de [ITA.GetLeader] caerá, y plantaremos la bandera de Gehenna en Roma."

 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos: "Declaración de liberación de Kivotos del Sur"
 GEH_three_congress_focus_no_hina_diplomacy_union_south_kivotos_desc: "El colapso del imperio colonial italiano se convirtió en un acontecimiento simbólico: hemos obtenido por completo la hegemonía de todo Kivotos del Sur. Nos hemos alzado como una gran potencia en Kivotos."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace: "Pacto de no agresión [ROOT.GetAdjective]–[SOV.GetAdjective]"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_peace_desc: "Por ahora, la punta de nuestra espada apunta al sur, y no hace falta extender frentes chocando de inmediato con [SOV.GetLeader]. Será mejor firmar un pacto temporal de no agresión y mantener la paz."

 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange: "Acuerdo de intercambio tecnológico con [SOV.GetAdjective]"
 GEH_three_congress_focus_no_hina_diplomacy_soviet_military_exchange_desc: "A pesar de nuestras diferencias, las armas de [SOV.GetName] son excelentes y nos ayudarán mucho a mantener una fuerte hegemonía en la Tierra tras la Gran Transferencia."

