 GEH_iori_despotic_route_ending_1_tt: "§gSe despliega el final de la ruta 'Hina huye - ruta Iori'. En el caos que dejó la ausencia de Sorazaki Hina, Shiromi Iori impuso el orden con puño de hierro. Predicando la superioridad de la \"cultura pura de Kivotos\" y del \"Halo\", purgó a toda la oposición y transformó Gehenna en un poderoso Estado nacionalista unido por el odio hacia el exterior. Ahora, bajo la bandera de Gehenna, la voluntad de acero de Iori conducirá a la patria hacia una nueva era de guerra.\n\nEsta historia no habría sido posible sin quienes han jugado el mod. ¡Gracias!§!\n\n"
 GEH_iori_despotic_route_ending_2_tt: "§gSe despliega el final de la ruta 'Hina huye - ruta Iori'. Usando la tragedia de Sorazaki Hina como justificación, Shiromi Iori unificó a la Gehenna dispersa bajo la bandera de la \"sanación\" y la \"reconstrucción\". Su orden silenció toda disidencia y fundió por la fuerza la cultura alemana, ajena, dentro del gran crisol llamado Gehenna para fabricar un solo pueblo. En la estabilidad que ella forjó, Iori afrontó a solas las sombras del pasado y, aun así, decidió seguir avanzando. El futuro de Gehenna ahora está en sus manos.\n\nEsta historia no habría sido posible sin quienes han jugado el mod. ¡Gracias!§!\n\n"
 GEH_iori_route_ending_1_tt: "§gSe despliega el final 'Investigación de criminales de guerra' de la ruta Iori. Para borrar la mancha sangrienta que dejó el militarismo de Shiromi Iori, Sorazaki Hina eligió el camino más doloroso. Sentó a su antigua compañera en el banquillo, desmanteló el régimen militarizado y trajo a Gehenna una democracia nueva, aunque inestable. No logró una integración completa, pero cree que esta realidad fracturada es, a la vez, su expiación y el nuevo comienzo de Gehenna.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_iori_route_ending_2_tt: "§gSe despliega el final 'Extensión indefinida de poderes de emergencia' de la ruta Iori. Para proteger a sus camaradas y salvaguardar el orden, Sorazaki Hina aceptó de buen grado el camino del dictador. Pagó el precio de perder el apoyo de los estudiantes de Gehenna, pero a cambio, mediante la solidaridad con los alemanes, estableció un nuevo Estado: la \"Federación Gehenna-Alemana\". La paz y la armonía que ella construyó quedarán, al menos, como un logro; pero qué sintió al final de ese camino… nadie lo sabe.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_normal_route_ending_tt: "§gSe despliega el final de la ruta de competencia del Comité Disciplinario. Sorazaki Hina soportó todo el peso que la oprimía y, por fin, trajo estabilidad a Gehenna. No eligió ser dictadora ni mártir: escogió retirarse con honor como una estudiante que cumplió con su deber. Ahora, despojada de la pesada armadura del cargo de jefa del Comité Disciplinario, probablemente esté escribiendo su propia historia en algún lugar tranquilo.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_ako_route_ending_tt: "§gSe despliega el final de la ruta Ako. La historia de Ako y Hina termina así, pero en este mundo, ambas aún podrán crear muchas historias maravillosas. Hacia el futuro, las dos amigas del Comité Disciplinario de Gehenna avanzan juntas.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_no_hina_ending_tt: "§gSe despliega el final de la ruta 'Hina huye'. ¡La próxima vez, por favor, evita que Sorazaki Hina renuncie al puesto de jefa del Comité Disciplinario!\n\nEsta historia no habría sido posible sin quienes han jugado el mod. ¡Gracias!§!\n\n"
 GEH_hina_route_ending_1_tt: "§gSe despliega el final de la ruta Hina. La personalidad original de Sorazaki Hina se rindió ante la otra y desapareció. Alemania se ha convertido ahora en un infierno sobre la tierra. Aun así, incluso en el abismo de ese Hin-nom, entre las columnas de fuego de Gehenna… la gente vive. Para poder recibir el mañana.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_hina_route_ending_2_tt: "§gSe despliega el final de la ruta Hina. Sorazaki Hina superó la maldad interior y decidió avanzar hacia el futuro, abrazando incluso su propia fragilidad. El presente de Gehenna está sumido en una profunda oscuridad, pero mañana llegará un día mejor. Al menos, eso es lo que Ako cree.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"
 GEH_hina_route_ending_3_tt: "§gSe despliega el final de la ruta Hina. Sorazaki Hina espera el día en que, junto a Ako, 'desaparezca' de este mundo. Algún día se apretará el gatillo, y también llegará el día en que la melodía del piano se detenga. Pero, al menos, ese día no será hoy.\n\nGracias por disfrutar todo el contenido creado para el Comité Disciplinario de Gehenna. Sin ustedes, esto no habría sido posible. ¡Gracias!§!\n\n"

 TRM_auto_conference_1_division_tt: "La próxima región será reconocida como un mandato del organismo conjunto de tratados de toda Gehenna, la \"Autoridad Administrativa del Edén\":\n§Y[5.GetName]§!, §Y[60.GetName]§!, §Y[61.GetName]§!, §Y[62.GetName]§!, §Y[63.GetName]§!, §Y[64.GetName]§!, §Y[65.GetName]§!, §Y[66.GetName]§!, §Y[67.GetName]§!, §Y[68.GetName]§!, §Y[86.GetName]§!, §Y[188.GetName]§!, §Y[762.GetName]§!, §Y[763.GetName]§!, §Y[807.GetName]§! .\n\n"

 GEH_managed_democracy_union_tt: "Designamos a nuestros Estados satélite como §YEstados colaboradores de democracia controlada§!. Esto también se aplicará a cualquier país que pase a ser nuevo satélite."
 GEH_if_faction_leader_tt: "Si §Y[ROOT.GetNameDef]§! es el líder de la facción:"

 GEH_hina_corruption_text_tt: "§gEn el fondo de Gehenna, en el Valle de Hin-nom, el infierno sigue ardiendo. El §Rmisterio de Baal§! se encuentra en estado [GEH_hina_corruption_loc] ([?GEH_hina_corruption_var]).§!"
 GEH_hina_corruption_text_tt_delayed: "§YNota§!:§gSegún el estado mental de Sorazaki Hina, el árbol de enfoques del §Y4.º Congreso del Comité Disciplinario§! cambiará. Una vez completado el 4.º Congreso, ya no será posible volver el estado mental más §Gbeligerante§! ni empeorarlo más hacia §Rdeterioro§!.§!"
 GEH_hina_corruption_numerical_limit_tt: "El nivel de corrupción de Hina debe estar entre §Y-5§! y §Y5§!."

 GEH_hina_corruption_hina_frame_text_tt: "§gLa conciencia de Sorazaki Hina intenta rechazar la corrupción. Hina puede intentar conservar su humanidad a través de su relación con los miembros del Comité Disciplinario. O bien, otra alternativa podría ser concluir el §G4.º Congreso del Comité Disciplinario§! antes de que su mente se derrumbe por completo.\n\nEl estado mental de Hina se divide en tres etapas: §YHambre§!, §OSaciedad§! y §RDespertar§!. Para que Sorazaki Hina se mantenga a sí misma en el 4.º Congreso, debe evitar llegar al estado de Despertar. §RPor supuesto, incluso si no lo hace, no necesariamente habrá una desventaja.§!§!"
 GEH_hina_corruption_hina_frame_text_tt_delayed: "§gConfiados en Dios haremos proezas,\ny él hollará a nuestros enemigos.\n\nNo confiaré en mi arco,\nni mi espada me salvará;\npues tú nos has salvado de nuestros adversarios,\ny has avergonzado a los que nos aborrecían.\n\nSalmo 44:5-7§!"
 GEH_hina_corruption_ako_frame_text_tt: "§gBaal propone poder y una negociación constante. Si Hina negocia con Baal dentro de su interior y acepta su poder, el Estado de Gehenna puede obtener una §Grecompensa§! permanente.\n\nPor supuesto, esa recompensa no se entrega gratis. Cada vez que se concede una recompensa, la corrupción de Hina se acelera, y mantener su humanidad se vuelve más difícil.\n\n§RPero… ¿y qué importa eso?§!§!"
 GEH_hina_corruption_ako_frame_text_tt_delayed: "§gEchad toda vuestra ansiedad sobre él, porque él tiene cuidado de vosotros.\nSed sobrios y velad; vuestro adversario el diablo, como león rugiente, anda alrededor buscando a quien devorar.\nResistidlo firmes en la fe, sabiendo que los mismos padecimientos se van cumpliendo en vuestros hermanos en todo el mundo.\n\n1 Pedro 5:7-9§!"

 GEH_hina_corruption_thought_cabinet_tt: "§gEl Gabinete mental elegido actualmente es §!§Y[?hina_thought_cabinet_point]/3§!§g.§!"

 GEH_hina_corruption_loc_level_1: "Hambre"
