 NextPhase.0.t: "Oportunidad"
 NextPhase.0.desc: "A pesar de la advertencia de la jefa del Comité Disciplinario, [GEM.GetName] sigue adelante con las negociaciones con la Fuerza de Defensa."
 NextPhase.0.a: ""
 NextPhase.0.b: "...Habrá que posponer el plan"

 NextPhase.1.t: "El derramamiento de sangre anunciado"
 NextPhase.1.desc: "El Comité Disciplinario, responsable de la seguridad pública y la defensa nacional de Gehenna, ha declarado una orden de arresto contra los principales ejecutivos del Pandemonium Society.\nLa declaración proviene de la administradora ejecutiva senior del Comité Disciplinario, Amau Ako.\n\n\"La causa de esta situación recae por completo en el Pandemonium Society. Investigaremos las sospechas de fraude electoral del presidente Hanuma Makoto, la obstrucción continua del trabajo del Comité Disciplinario y su administración negligente.\"\n\nLa administradora Ako afirmó que el mayor problema ha sido que, incluso en un estado de emergencia nacional, el Pandemonium Society no dejó de interferir con el Comité Disciplinario. Prometió someterlo e instalar una comisión provisional bajo el control del Comité para estabilizar el país.\nEn virtud de la orden de la jefa del Comité Disciplinario, Sorasaki Hina, las tropas del Comité se están concentrando ahora mismo en la sede del Pandemonium Society.\nSegún los informes del lugar, la unidad móvil del Comité Disciplinario y la 1.ª División Acorazada de Guardia del Pandemonium Society han iniciado un combate en la Avenida Central, y en la zona se ha declarado un toque de queda para la población..."
 NextPhase.1.a: "¿Golpe de Estado... o revolución?"

 NextPhase.2.t: "Victoria de la revolución"
 NextPhase.2.desc: "\"Ya sabías que tarde o temprano esto pasaría.\"\n\nCon Hanuma Makoto de rodillas en su propio despacho, mirando con odio, Hina habló mientras lo observaba con frialdad.\nMakoto no dijo nada.\nIncluso en esa humillación, solo apretaba el puño, incapaz de ocultar su rabia hacia Hina.\n\nDespués de que el presidente y los diputados fueran trasladados a una casa segura por miembros del Comité Disciplinario, Hina miró por la ventana del despacho vacío.\nPor un instante, al ver a Ibuki saludándola con la mano mientras seguía a los diputados, le devolvió una sonrisa cálida; pero su rostro volvió a hundirse en una realidad helada.\n\nAko, que había entrado sin hacer ruido y se había quedado a cierta distancia detrás de ella, preguntó con cautela:\n\n\"Entonces... ¿qué piensa hacer ahora?\"\n\nHina no respondió de inmediato. Como si estuviera absorta, siguió mirando afuera.\nLuego, finalmente, se giró hacia Ako y respondió:\n\n\"...No lo sé.\""
 NextPhase.2.a: "\"Hay demasiado por hacer\""

 NextPhase.3.t: "¡Invasión de Trinity!"
 NextPhase.3.desc: "Mientras el Comité Disciplinario llevaba a cabo una rápida industrialización y reformas militares, la repentina invasión de Trinity llevó a Gehenna a un estado de guerra. Es hora de comprobar si la industrialización y las reformas militares que la jefa del Comité impulsó hasta ahora se realizaron como debían.\nSi no fue así, el Comité Disciplinario y Gehenna gemirán para siempre bajo los demonios de Trinity.\n\nLas fuerzas de Trinity avanzan hacia el Distrito Norte de Gehenna. Si no logramos defender el Distrito Norte, no podremos proteger la Academia Gehenna.\n\nEn el frente ya están apareciendo heridos por doquier. El destino de Gehenna depende de ti."
 NextPhase.3.a: "¡Resistir!"

 hina.1.t: "Apertura de la 3.ª Asamblea General del Comité Disciplinario"
 hina.1.desc: "El Comité Disciplinario, que había actuado en las sombras opacado por la luz del Pandemonium Society, presenció recientemente la corrupción del Pandemonium Society, que observaba pasivamente la caótica situación política de Kivotos. Incapaz de tolerar la injusticia, se alzó en masa.\nAsí, el Comité Disciplinario apareció de forma deslumbrante en el escenario de un Kivotos convulso. La sede que usaba el Pandemonium Society ha sido remodelada por completo y ahora funciona como cuartel general del Comité Disciplinario.\nCuando la noticia de la 2.ª Asamblea General del Comité se difundió ampliamente, cada vez más estudiantes comenzaron a interesarse por el Comité.\n\nEn la primera asamblea, el comité presentó la situación de Gehenna tras la revolución y el rumbo futuro, y la reunión avanzó sin problemas. Con diversas opiniones reuniéndose y recibiendo apoyo, la asamblea mantiene un ambiente favorable.\n\nCon las banderas del Comité Disciplinario a ambos lados, la jefa del Comité, Sorasaki Hina, inició el discurso de apertura. Hina exhortó a no perder la legitimidad de la revolución, a seguir avanzando y a mantener una postura progresista.\nEl ambiente recordó la sensación de cuando se tomó el Distrito Central y se recuperó el Distrito Norte; y así comenzó plenamente la 3.ª Asamblea General del Comité Disciplinario."
 hina.1C.desc: "Tras la desaparición de la jefa del Comité Disciplinario, Sorasaki Hina, y ante el aumento diario de la amenaza del Pandemonium Society, el Comité Disciplinario ya no pudo limitarse a observar y finalmente se alzó contra el Pandemonium Society.\nAsí, el Comité Disciplinario apareció de forma deslumbrante en el escenario de un Kivotos convulso. La sede que usaba el Pandemonium Society ha sido remodelada por completo y ahora funciona como cuartel general del Comité Disciplinario.\nCuando la noticia de la 2.ª Asamblea General del Comité se difundió ampliamente, cada vez más estudiantes comenzaron a interesarse por el Comité.\n\nEn la primera asamblea, el comité presentó la situación de Gehenna tras la revolución y el rumbo futuro, y la reunión avanzó sin problemas. Con diversas opiniones reuniéndose y recibiendo apoyo, la asamblea mantiene un ambiente favorable.\n\nMientras la ausencia del puesto de jefa del Comité seguía siendo notoria, varios ejecutivos animaron a la organización con discursos de aliento y guardaron un momento de silencio en honor a la vacancia. Apelaron a no perder la legitimidad de la Academia Gehenna y a continuar mejorándose."
 hina.1.a: "¡Revolución del esfuerzo!"

 hina.2.t: "Clausura"
 hina.2.desc: "Tras varias semanas de deliberación, la 3.ª Asamblea General del Comité Disciplinario se clausuró oficialmente. Se decidieron muchas cosas, pero aún quedaban numerosos problemas sin resolver.\n\nSe amplió de manera significativa la autoridad de los departamentos subordinados del Comité. El Departamento de Ejecución asumió la defensa, el Departamento de Planificación se encargó de la economía, y así se asignaron funciones a los departamentos inferiores. Aunque todavía sean inexpertos, con el tiempo se volverán más eficientes."
 hina.2.a: "¡Revolución del esfuerzo!"

 hina.3.t: "El corazón de la industria alemana"
 hina.3.desc: "La cuenca del Ruhr fue el núcleo de la industria alemana, pero tras lo que los humanos de este mundo llaman la Gran Guerra, perdió su antiguo esplendor.\nLos vencedores saquearon a los vencidos en busca de sus propios derechos, y los ciudadanos del Ruhr quedaron marcados con heridas imborrables.\n\nHoy, la administradora ejecutiva senior Amau Ako presentó a la jefa del Comité Disciplinario, Sorasaki Hina, un plan de desarrollo dentro de la esfera de influencia de Gehenna mediante la reconstrucción del Ruhr.\nTras largas discusiones, el plan fue aprobado. A diferencia de la reconstrucción incompleta del régimen anterior, se espera que este proyecto impulse el progreso de toda Alemania Occidental.\nRequerirá enormes recursos humanos, presupuesto y no poco tiempo, pero todos están convencidos de que valdrá la pena."
 hina.3.a: "El pulso vuelve a latir."

 hina.4.t: "Apertura de la 1.ª Asamblea General del Comité Disciplinario"
 hina.4.desc: "El caos del nuevo mundo comenzó a asentarse y su contorno empezó a revelarse poco a poco. En este momento crucial, la jefa del Comité Disciplinario, Sorasaki Hina, convocó de urgencia a todos los miembros del Comité.\n\nQuienes respondieron a su llamado —miembros que realizaban misiones grandes y pequeñas— fueron reuniéndose uno a uno. La amplia sala de reuniones pronto se llenó de tensión y expectación.\n\nCuando los miembros del Comité, de diversos orígenes y capacidades, ocuparon sus asientos, el aire se cargó con la premonición de que algo importante estaba por ocurrir.\n\nFinalmente, Sorasaki Hina subió al estrado junto a sus más cercanos. En su mirada se sentía una voluntad firme, y su sola presencia hizo que toda la sala guardara silencio.\nHina tomó aire y comenzó el discurso que declaraba la apertura de la 1.ª Asamblea General del Comité Disciplinario.\n\nSu discurso se centró en tres temas clave: lealtad, unidad y valor. Primero subrayó el papel y la responsabilidad del Comité en el nuevo mundo, enfatizando la importancia de la lealtad de todos. Luego insistió en que la unidad sólida entre miembros era indispensable para superar los desafíos. Por último, declaró que el valor para enfrentar peligros desconocidos sería nuestra arma más poderosa.\n\nCada palabra tuvo fuerza y conmovió a la audiencia. Cuando el discurso alcanzó su clímax, la sala se llenó de aplausos y vítores.\n\nAl concluir, un estruendo de aplausos volvió a inundarlo todo. El liderazgo carismático y la visión de Sorasaki Hina dejaron una impresión profunda en todos y encendieron una nueva llama en sus corazones.\n\nAsí, en medio de este fervor y determinación, la 1.ª Asamblea General del Comité Disciplinario comenzó oficialmente. Todos intuyeron que aquella reunión marcaba el inicio de una nueva era, y estaban llenos de expectación por los debates por venir."
 hina.4.a: "¡Adelante!"

 hina.5.desc: "Tras varios días de deliberación, la 1.ª Asamblea General del Comité Disciplinario se clausuró. Se discutieron principalmente la Fuerza de Defensa y el futuro, pero muchas cuestiones aún no están resueltas.\n\nEl Comité Disciplinario pronto comenzará el trabajo para expulsar a la Fuerza de Defensa, y también ha surgido la necesidad de vigilar lo que hace el Pandemonium Society. No importa tanto qué estén haciendo, pero si llegan a unir fuerzas con nuestros enemigos, el Comité Disciplinario debe demostrar que no lo tolerará."

 hina.6.t: "La estabilidad regresa"
 hina.6.desc: "Al desarmar a los remanentes de la Fuerza de Defensa, nos hemos librado de una amenaza. Esto fue posible gracias a la operación meticulosa del Comité Disciplinario y al esfuerzo de sus miembros.\nCon la Fuerza de Defensa neutralizada, las zonas bajo el control del Comité disfrutan de una estabilidad considerable.\nSin embargo, no debemos confiarnos. Igual que los remanentes se escondieron en la ciudad, debemos prepararnos ante amenazas potenciales.\nSeguiremos recopilando información, entrenando para responder a amenazas y cooperando con los residentes locales para adaptarnos.\nConvertir la situación actual en un trampolín hacia el futuro será nuestra próxima tarea."
 hina.6.a: "$hina.4.a$"

 hina.7.t: "¡[GEM.Getname] ha creado una federación con Alemania!"
 hina.7.desc: "¡La facción de [GEM.Getname] ignoró la opinión de [GEH.Getname] y formó una federación con organizaciones alemanas, incluida la Fuerza de Defensa alemana, con la que estábamos enfrentados! ¡Esto es una traición a la legitimidad de la Academia Gehenna!"
 hina.7.a: "Existimos por la Academia Gehenna y por sus estudiantes."

 hina.8.t: "Derribamos al Pandemonium Society... ¿y ahora qué?"
 hina.8.desc: "El Departamento de Ejecución tenía que ser distinto del Departamento de Planificación, que se limitaba a rebuscar papeles en una oficina. Para el orden de Gehenna, lo necesario no era una burocracia compleja y un juego de números, sino alentar a quienes estaban en el frente.\nBajo el liderazgo de Iori, todas las capacidades del Comité Disciplinario de Gehenna se concentraron en derrumbar al Pandemonium Society y a su gobierno incompetente.\nEl Comité Disciplinario debía reemplazar al Pandemonium Society. Una vez cayera el Pandemonium Society y el Comité tomara el poder, todo iría bien.\n\n\"Y... ganamos. Lo hemos ganado.\"\n\nDistrito Central de Gehenna. Mientras Iori pisaba los restos del tanque Toramaru, completamente destruido, no sintió euforia, sino una extraña inquietud.\nHasta ahora habíamos alentado a soldados del frente y obreros de retaguardia con propaganda: que si todo se arreglaría cuando cayese el Pandemonium Society.\nLos malos tratos a los soldados eran culpa del Pandemonium Society. El sabotaje industrial era un complot del Pandemonium Society. La inflación era una operación de su inteligencia.\nPero ahora el Pandemonium Society ya no podía servir de excusa.\n\nIori miró su arma desde lo alto del Toramaru. La guerra contra el Pandemonium Society había terminado.\nAhora tocaba elevar la calidad de vida de Gehenna con el poder de los documentos y los contratos.\nPero... nadie en el Departamento de Ejecución tenía la capacidad para hacerlo.\nNi Iori ni las demás figuras clave estaban acostumbradas a otra cosa que no fuera disparar y animar a los suyos con propaganda.\n\n\"Propaganda... sí. Aún no es que tengamos que acabar con la propaganda, ¿no?\"\n\nTodo nuestro sufrimiento, y que la vida no cambie incluso tras la guerra, se debe a que todavía quedan “remanentes” del Pandemonium Society.\nEn medio de la ansiedad, Iori empezó a idear rápidamente un nuevo plan de propaganda."
 hina.8.a: "Porque... no me queda otra alternativa."

 hina.9.t: "¿Hasta cuándo con la propaganda?"
 hina.9.desc: "\"No entiendo qué está pensando el Departamento de Ejecución. ¿Aplastar el descontento para siempre con propaganda? ¿Se creen que son un servicio de mercenarios de Red Winter o qué?\"\n\nAmau Ako murmuró con sarcasmo, sentada en la silla de administradora ejecutiva senior, mientras hojeaba el nuevo periódico “Pandemonium Weekly” que el Departamento de Ejecución había tomado.\nQue la economía de guerra no se disolviera incluso después de la caída del antiguo gobierno del Pandemonium Society era porque aún quedaban guerrillas del viejo Pandemonium.\nQue un enorme fanjjang apareciera en el Distrito Central e hiriera gravemente a tres alemanes también era “sabotaje” de esas guerrillas.\nQue los precios siguieran subiendo también era por “remanentes” del Pandemonium.\n\n'Ja. ¿Por qué no dicen directamente que el Pandemonium Society derrotado gobierna el mundo? Parece que, sin que yo me enterara, el plan de conquista mundial de Hanuma Makoto se completó con éxito.'\n\nAko soltó una risita y miró más allá de la ventana del cuartel general. Cuando el Pandemonium Society aún existía, la propaganda del Departamento de Ejecución quizá funcionaba.\nPero, ¿hasta cuándo creen que les va a servir?\nAfuera, se veía a manifestantes gritando y forcejeando con miembros del Comité.\n\nAún quedaba gente que creía en la agitación sobre “remanentes del Pandemonium”, pero también empezaban a aparecer quienes no lo creían.\nCon eso bastaba para que el efecto de la propaganda se debilitara.\n¿Hasta cuándo podrá Iori usar a un Pandemonium muerto como herramienta?\nAko corrió la cortina del despacho."
 hina.9.a: "Una propaganda incapaz de convencer a los demás no es más que un consuelo inútil para uno mismo."

 ## 3.ª Asamblea ##
 hina_assembly.1.t: "¿Autoridad del Departamento de Ejecución?"
 hina_assembly.1.desc: "El Departamento de Ejecución se encargaba de la fuerza armada dentro del Comité Disciplinario, pero tras la última guerra terminó asumiendo la defensa de la nación.\nSin embargo, no todo son buenas noticias. En esa guerra el Departamento de Ejecución mostró fallos importantes, y la necesidad de reforma se volvió evidente.\nLas voces que piden transformarlo en una fuerza pequeña y élite chocan frontalmente con las voces que, basándose en las lecciones de la guerra revolucionaria, exigen un poder militar fuerte.\n\nAl mismo tiempo, crece la preocupación: a mayor autoridad del Departamento de Ejecución, más gente teme facciones dentro del ejército.\nMientras Sorasaki Hina sea la jefa del Comité, quizá estemos a salvo; pero si otra persona se sienta en ese puesto, el choque con el Departamento de Ejecución será inevitable."
 hina_assembly.1.a: "¡Ya entendí, cálmense todos!"

 hina_assembly.2.t: "El Departamento de Planificación y el Pandemonium Society"
 hina_assembly.2.desc: "El Departamento de Planificación es una enorme organización burocrática que administra Gehenna en general. Se le otorgó una autonomía considerable: ayuda con el papeleo dentro del Comité o resuelve asuntos por su cuenta.\n\nDurante la guerra revolucionaria, mientras el Comité derrocaba al Pandemonium Society y restauraba la administración, se descubrieron grandes problemas.\nLa administración del Pandemonium Society estaba corrompida y funcionaba con una ineficiencia aterradora.\nProcesar y arreglar esa herencia administrativa podría llevar bastante tiempo."
 hina_assembly.2.a: "Si es la jefa del Departamento de Planificación, podrá resolverlo."

 hina_assembly.3.t: "¿El Departamento Médico?"
 hina_assembly.3.desc: "El Departamento Médico ha trabajado en la retaguardia de la guerra revolucionaria, actuando por los demás.\nEn especial, las escenas de ayuda humanitaria lideradas por Chinatsu despertaron gran interés entre las estudiantes de Gehenna, y sus méritos fueron reconocidos.\n\nAun así, surgen voces en contra de reorganizarlos como una nueva institución.\nSi no quieren ser absorbidos por otro departamento, hará falta especial cuidado."
 hina_assembly.3.a: "Podrán demostrarlo."

 ## 1.ª Asamblea ##
 hina_assembly.4.t: "Controlar la situación"
 hina_assembly.4.desc: "Han pasado unos 50 días desde el incidente. Gracias al fuerte liderazgo y a la decisión estratégica de la jefa del Comité, el Comité Disciplinario de Gehenna entró en una fase de estabilidad más rápido de lo esperado, y la Fuerza de Defensa, al menos en las zonas bajo nuestro dominio, quedó prácticamente aniquilada.\nAhora los miembros del Comité realizan labores de socorro y reconstrucción para civiles afectados por el combate y el caos.\n\nSin embargo, algunos sostienen que los civiles siguen siendo una incógnita capaz de unirse a los remanentes de la Fuerza de Defensa en cualquier momento, y que no debemos bajar la guardia.\nInsisten en minimizar el socorro y acumular poder militar y recursos.\nEsta postura dura se volvió un tema candente dentro del Comité, planteando dilemas éticos y estratégicos.\n\nSi ayudamos activamente a la población civil, obtendremos apoyo popular y legitimidad; pero volcar demasiados recursos al apoyo podría debilitar al Comité a largo plazo y reducir nuestra capacidad de responder a amenazas futuras.\nEl Comité debe encontrar un equilibrio delicado entre la necesidad humanitaria inmediata y la seguridad sostenida."
 hina_assembly.4.a: "Hay que equilibrar ambas."

 hina_assembly.5.t: "¿La Fuerza de Defensa ha sido destruida?"
 hina_assembly.5.desc: "Tras esfuerzos desesperados, recibimos informes de que la Fuerza de Defensa sufrió daños cercanos a la aniquilación.\nPero eso podría ser solo la superficie: la realidad sigue siendo incierta.\nTodos, incluso la propia jefa del Comité, intuyen que la Fuerza de Defensa no ha sido eliminada por completo.\n\nLa Inteligencia presentó información recopilada recientemente: fuerzas remanentes de la Fuerza de Defensa se esconden en dos ciudades principales, sosteniéndose apenas con el apoyo tácito de residentes locales.\nLa noticia tensó de inmediato el ambiente.\n\nLa Fuerza de Defensa sigue siendo una amenaza seria. Sus tácticas de guerrilla y su capacidad para ocultarse en zonas urbanas no se resuelven fácilmente con la fuerza militar tradicional.\nAdemás, al conservar apoyo de parte de la ciudadanía, el desafío ya no es solo militar, sino también político e ideológico.\n\nEl Comité ya pagó un precio alto en vidas. La pérdida de personal experimentado afecta no solo la capacidad de combate, sino también la moral.\nAl enterarse de que la Fuerza de Defensa fue localizada en la ciudad, las reacciones fueron complejas: algunos endurecieron su determinación, pero la mayoría sintió fatiga y ansiedad.\nLa idea de volver a sangrar para cazarlos generó presión psicológica, y varios expresaron vacío y frustración ante una guerra interminable.\n\nPero esta vez es distinto. Hemos aprendido lecciones valiosas y estamos desarrollando nuevas tácticas.\nSe están creando unidades especializadas en combate urbano y relaciones con civiles, y se está reforzando la red de información.\nEntre los miembros del Comité empieza a difundirse un optimismo cauteloso: será una lucha dura, pero ya no caeremos tan indefensos como antes."
 hina_assembly.5.a: "¡Que vengan si se atreven!"

 hina_assembly.6.t: "La desaparición de la presidenta del Consejo Estudiantil General"
 hina_assembly.6.desc: "La repentina desaparición de la presidenta del Consejo Estudiantil General sumió a todo Kivotos en el caos.\nNo es solo la ausencia de una líder: ha generado incertidumbre sobre la estabilidad política y el futuro de Kivotos.\n\nLo más preocupante es que dicha presidenta era la figura central que impulsaba el histórico acuerdo de paz y amistad entre Trinity y Gehenna: el “Tratado del Edén”.\nCon su desaparición, los esfuerzos para aliviar tensiones entre ambos bandos enfrentan una crisis grave.\n\nEl destino del Tratado del Edén se ha vuelto incierto.\nEn el peor de los casos, podría ser abolido por completo.\nAlgunos proponen suspender temporalmente las negociaciones hasta que surja un nuevo liderazgo; otros intentan aprovechar la oportunidad para invalidar el tratado.\n\nEn esta situación, la reacción de Trinity será decisiva.\nSi Trinity mantiene una postura cooperativa y demuestra voluntad de continuar, el tratado podría sobrevivir pese a las dificultades.\nPero si Trinity adopta una línea dura o presenta nuevas exigencias, el tratado corre el riesgo de naufragar."
 hina_assembly.6.a: "Recemos para que actúen con sentido común."

 hina_assembly.7.t: "¿Movimientos del Pandemonium Society?"
 hina_assembly.7.desc: "El Pandemonium Society, conocido como Manmajeon, es un órgano clave de la Academia Gehenna y se enfrenta a una crisis grave que podría amenazar la supervivencia misma de la academia.\nEsta crisis no es un problema interno simple: tiene un carácter complejo que puede decidir el futuro de la academia.\n\nLos remanentes de la Fuerza de Defensa siguen siendo un gran problema.\nNo han sido eliminados por completo y permanecen como sombras, al acecho de una oportunidad para contraatacar.\nEsto continúa amenazando la autoridad y el control del Pandemonium Society.\n\nAdemás, la relación del Pandemonium Society con los gobiernos estatales alemanes es inestable.\nA diferencia de lo que el Pandemonium esperaba, los estados no muestran una cooperación plena.\nEsto obstaculiza la autonomía e independencia de la academia y aumenta el riesgo de injerencia externa.\n\nDentro de Gehenna tampoco es fácil mantener el control.\nEn particular, las acciones independientes del Club de Investigación Gourmet y del Club de Desarrollo de Aguas Termales desafían la autoridad del Pandemonium Society.\nIgnoran sus demandas y actúan por cuenta propia, lo que representa una seria amenaza a su capacidad de control.\n\nLo más impactante es el rumor escalofriante que circula dentro del Comité Disciplinario:\nque el Pandemonium Society estaría preparando negociaciones secretas con la Fuerza de Defensa alemana.\nSi ese rumor es cierto, el resultado podría poner en jaque la posición del Comité.\nSi el Pandemonium negocia con la Fuerza de Defensa sin el Comité, sería un gran acontecimiento capaz de sacudir por completo el equilibrio de poder dentro de Gehenna.\nPara el Comité Disciplinario, sería un desafío directo a su influencia y a su razón de existir."
 hina_assembly.7.a: "Imposible de predecir."

