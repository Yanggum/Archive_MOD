 ### Habitantes locales
 GEH_piet_mondrian: "Mies van der Rohe"
 GEH_karl_schmidt_rottluff: "Karl Schmidt-Rottluff"
 GEH_richard_strauss: "Richard Strauss"
 GEH_hertha_gordon: "Hertha Gordon"
 GEH_therese_junkers: "Therese Junkers"

 GEH_prefect_team_maritime_police_desc: "§gTras la Gran Transición, se creó la Policía Marítima del Comité de Disciplina para gestionar ríos y lagos en la región de Deutschland. Sin embargo, antes de la Gran Transición el Comité no tenía experiencia en labores marítimas, y los crímenes en el mar solían ser responsabilidad de la Policía Marítima de la Academia Valkyrie. Por ello, la Policía Marítima del Comité es considerada 'inexperta' en cuanto a capacidad operativa.§!"
 GEH_prefect_team_honor_guard_desc: "§gLa Guardia de Honor es una organización encargada de recibir a los invitados distinguidos que visitan las instalaciones del Comité de Disciplina. En la era del ‘Trueno’, fue una institución clave para la recepción de dignatarios, pero durante el mandato del presidente Hanuma Makoto quedó prácticamente vaciada de funciones debido a su deseo de monopolizar los actos protocolarios.§!"
 GEH_swimsuit_hina_desc: "§gO-oye, espera un segundo. Ako, no soy la súper humana perfecta que crees. No sé nadar y... no, de verdad, no es falsa modestia... ¡espera! ¡Por favor, tiempo! ¡Tiempo!! ¡Gah! (glup glup)§!"
 GEH_piet_mondrian_desc: "§gMies, profesor de la prestigiosa escuela de arquitectura Bauhaus en Deutschland, ejerció una enorme influencia en el diseño arquitectónico. Su interés exclusivo por los estilos arquitectónicos de Gehenna encaja con la preferencia de los altos cargos del Comité, que evitan una implicación política profunda de los locales, por lo que es considerado una figura relativamente ‘segura’.§!"
 GEH_karl_schmidt_rottluff_desc: "§gKarl Schmidt-Rottluff es un pintor expresionista representativo de la región de Baviera en Deutschland. Su arte, incompatible con los cánones clásicos, fue perseguido por el régimen de Hitler como ‘arte degenerado’. Schmidt-Rottluff solo muestra interés en enseñar su expresionismo a los estudiantes dentro de la esfera de influencia del Comité de Disciplina de Gehenna. Su carácter apolítico encaja con la postura de los dirigentes del Comité, por lo que se le clasifica como una figura relativamente ‘segura’.§!"
 GEH_richard_strauss_desc: "§gRichard Strauss, un compositor excepcional, no realizó una oposición activa al régimen nacionalsocialista de Deutschland, pero se muestra favorable al nuevo gobierno formado por habitantes de Kivotos. Como destacado compositor del romanticismo alemán, está muy interesado en integrar la música de Gehenna en su propio universo artístico para crear nuevas composiciones clásicas. Su carácter apolítico lo convierte en una figura relativamente ‘segura’.§!"
 GEH_dkzh_idea_desc: "§gAko insiste en que sus sentimientos hacia Hina no van más allá de la lealtad y no constituyen amor. Aunque los miembros del Comité (y a veces incluso los altos cargos) no parecen pensar lo mismo cuando la llaman ‘el perro del presidente’, nadie niega que Ako es una administradora principal competente y apasionada, independientemente de lo que sienta.§!"
 GEH_dldhfl_idea_desc: "§gMuchos subestiman a Iori por su carácter temerario y su falta de planificación, pero Shiromi Iori es una capitana de asalto con un fuerte sentido de la justicia. Siempre será la primera en acudir al lugar de los hechos para resolver cualquier crimen que ocurra dentro del territorio del Comité de Disciplina.§!"
 GEH_chinatsu_idea_desc: "§gSi hubiera que elegir al miembro del Comité con mayores conocimientos médicos, cualquiera elegiría a Chinatsu. Aunque su carácter rígido y excesivamente principista provoca quejas entre los miembros comunes, ella siempre propone las soluciones más racionales y aceptables para la mayoría.§!"
 GEH_prefect_team_spy_desc: "§gEntre los numerosos departamentos del Comité de Disciplina, el Departamento de Inteligencia es sin duda el más famoso. Aunque no sea tanto por su excelencia operativa, sino porque Sorasaki Hina proviene de este departamento.§!"
 GEH_ann_fudou_desc: "§gFudou An, procedente del Departamento de Gestión Inmobiliaria, posee un notable talento económico y un curioso antecedente: antes de la Gran Transición intentó venderle a Rikuhachima Aru un inmueble lleno de defectos, fracasó y acabó recibiendo una paliza. Aunque su ética es cuestionable, es un talento económico necesario para Gehenna.§!"
 GEH_nyaomoto_kan_desc: "§gCEO de ‘Nyaomoto Food’, una empresa alimentaria de Gehenna que gana dinero vendiendo ilusiones. Aunque la calidad de sus productos es discutible, al menos ofrece comidas más estandarizadas y de mejor calidad que las raciones del Departamento de Abastecimiento de Gehenna dirigidas por Juri.§!"
 GEH_owner_of_suzume_desc: "§gSuzume-tei, un restaurante famoso de Gehenna, goza de un enorme apoyo entre los ciudadanos. Sin embargo, al negarse a utilizar ingredientes suministrados por el gigante Nyaomoto Food, ha quedado ‘marcado’ dentro del sector.§!"

 # Contenido de salud mental
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK: "Mantente firme"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_desc: "Sorasaki Hina es la presidenta del Comité de Disciplina de Gehenna y, de cara al público, es conocida como una líder fuerte y una superhumana. Sin embargo, para la propia Hina, el término ‘superhumana’ no es algo que sienta que le encaje.\n\n¿O acaso sí?\n\nDiga lo que diga cualquiera, Sorasaki Hina es ahora indiscutiblemente una superhumana, una gran presidenta del Comité, una gobernante del terror y la ‘Primera Gran Autócrata’ del Comité de Disciplina de Gehenna. Para cualquier observador, Hina es una superhumana indiscutible.\n\n§OEl Comité de Disciplina gobernará para siempre.§!\n\n§OLa gran líder de Gehenna§! está creando el camino y avanzando sobre él."
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_mission: "El peso de la corona"

 GEH_basking_in_the_brilliance_of_their_serenade: "Lo último que queda"
 GEH_basking_in_the_brilliance_of_their_serenade_desc: "Sorasaki Hina es la presidenta del Comité de Disciplina de Gehenna y, ante el público, una líder fuerte y superhumana. Pero para ella misma, ese calificativo no parece adecuado.\n\nHina no es una gran gobernante ni una tirana del terror. Es simplemente una estudiante frágil, con un estado mental inestable. Sin embargo, decidió convertirse en una superhumana. Apoyándose en la fe de los innumerables miembros del Comité, de los estudiantes de Gehenna y de los altos cargos, Sorasaki Hina avanzó por su propio pie.\n\n§p¿Cómo se convierte alguien en un superhumano?§!\n\n[GEH_basking_in_the_brilliance_of_their_serenade_text_tt]"

 GEH_basking_in_the_brilliance_of_their_serenade_text_0: "한 소녀는 현재 [GEH_basking_in_the_brilliance_of_their_serenade_loc_1_tt] 모습으로 천천히 §g앞으로§! 걸어 나갑니다.[GEH_basking_in_the_brilliance_of_their_serenade_loc_tt_desc]\n\n게헨나에는 아직 통치자가 필요합니다.\n선도부장이 §S무너진§! 상황은 절대로 일어나서는 안 됩니다."
 GEH_basking_in_the_brilliance_of_their_serenade_text_1: "소녀는 결국 길 위에서 §S무너진§! 모습입니다.\n\n§S결국 금은 퍼져나가 깨졌습니다.§! 선도부의 건물이 어두워집니다."
 GEH_basking_in_the_brilliance_of_their_serenade_loc_0: "§GSerena§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1: "§gEstable§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2: "§YTensa§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3: "§OImplacable§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4: "§tInestable§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5: "§RTambaleante§!"

 GEH_basking_in_the_brilliance_of_their_serenade_loc_0_desc: "\n§GEl amanecer del Comité de Disciplina ha llegado.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_1_desc: "\n§gLa autoridad debilitada de la presidenta del Comité se ha enderezado.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_2_desc: "\n§YLa imagen de una presidenta del Comité fuerte.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_3_desc: "\n§OEl silencio envuelve a Gehenna y al Comité de Disciplina.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_4_desc: "\n§tLa copa de cristal se está inclinando.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_loc_5_desc: "\n§RSe ha agrietado.§!"

 GEH_basking_in_the_brilliance_of_their_serenade_mission: "Empeoramiento"
 GEH_basking_in_the_brilliance_of_their_serenade_trigger_tt: "§RAún no podemos terminar este camino, usemos el método que usemos.§!"
 GEH_basking_in_the_brilliance_of_their_serenade_FUCK_trigger_tt: "§RAhora ya no podemos terminar este camino, sin importar el método.§!"
