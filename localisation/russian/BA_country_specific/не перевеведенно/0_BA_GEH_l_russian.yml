 hina_assembly.8.t: "1.ª Asamblea: inexperiencia en la gestión del Estado"
 hina_assembly.8.desc: "La jefa del Comité Disciplinario, Sorasaki Hina, y los miembros del Comité iniciaron el debate sobre el mayor problema.\nNadie dentro del Comité tiene experiencia real administrando un Estado, y aun así nos encontramos en la situación de tener que gobernar.\nCon el discurso de Hina, el primer punto del orden del día terminó reuniéndose en tres posturas.\n\nEl Departamento de Planificación sostiene que, como el grupo administrativo más competente, debe expandirse hasta convertirse en el órgano de administración.\n\nEl Departamento de Ejecución insiste en que, para superar la crisis, se requiere un control fuerte, y pide recibir autoridad administrativa para mantener el orden local y controlar la economía.\n\nO bien, se puede llegar a un compromiso creando un nuevo órgano administrativo, apaciguando de momento las quejas de ambos departamentos."
 hina_assembly.8.a: "Expandir el Departamento de Planificación hasta convertirlo en órgano administrativo."
 hina_assembly.8.b: "Crear una nueva organización administrativa, reclutando personal de todos los organismos."
 hina_assembly.8.c: "Otorgar autoridad al Departamento de Ejecución."

 hina_assembly.9.t: "1.ª Asamblea: postura ante los simpatizantes nazis"
 hina_assembly.9.desc: "Tras convertirse el problema de los alemanes locales en un asunto principal, comenzó la segunda sesión.\nCon una breve explicación de Sorasaki Hina —que ahora existimos sobre el territorio del antiguo Estado llamado “Deutschland”— se discutió que ese Deutschland fue el núcleo del partido nazi, responsable de crímenes dictatoriales como la Ley Habilitante y la “Noche de los Cuchillos Largos”.\nEl problema es la actitud excluyente del nazismo hacia otros pueblos y la mirada despectiva de sus simpatizantes hacia los transferidos de Kivotos.\n\nEl Departamento de Planificación, unificado bajo la línea dura de Amau Ako, sostiene que los simpatizantes nazis son “criminales potenciales” capaces de linchar a los kivotosianos como minoría racial, y exige vigilancia sobre todos los ciudadanos con historial de afiliación al partido nazi.\n\nSin embargo, Hinomiya Chinatsu y la mayoría del Comité creen que Ako es excesivamente paranoica y que vigilar la vida privada de todos los miembros rasos del partido es una medida desproporcionada.\nLa facción mayoritaria, liderada por Chinatsu, propone una política moderada: castigar solo a quienes cometan actos discriminatorios o se unan a organizaciones antisistema.\n\nShiromi Iori coincide con Ako, pero afirma que, para “borrar la ideología nazi”, hay que reclutar por la fuerza a los miembros del partido y hacerlos revolcarse en el ejército junto a poblaciones kivotosianas, en una educación por choque.\nSu postura radical hace dudar incluso a los miembros del Departamento de Planificación."
 hina_assembly.9.a: "Bajo el liderazgo de Amau Ako, se aplicará la Ley de Vigilancia de Afiliados al Partido Nazi."
 hina_assembly.9.b: "Tal vez sea mejor seguir la opinión mayoritaria."
 hina_assembly.9.c: "La propuesta de Shiromi Iori es extrema, pero útil."

 hina_assembly.10.t: "1.ª Asamblea: necesidad de expansión"
 hina_assembly.10.desc1: "El Comité Disciplinario es demasiado pequeño para gobernar toda Baviera. La mayoría de ejecutivos clave coincide, así que, a diferencia de lo que muchos miembros esperaban, este tema abrió la sesión primero.\nComo siempre, la reunión empezó con una breve explicación de Sorasaki Hina, pero esta vez no hubo un gran debate.\n\nAl final, la decisión recaerá en Hina y un pequeño grupo de ejecutivos.\nPodemos optar por reclutar de forma estable a estudiantes de Gehenna o aceptar de manera amplia a estudiantes de otras escuelas." #9-a, b
 hina_assembly.10.desc2: "El Comité Disciplinario es demasiado pequeño para gobernar toda Baviera. La mayoría de ejecutivos clave coincide, así que, a diferencia de lo que muchos miembros esperaban, este tema abrió la sesión primero.\nComo siempre, la reunión empezó con una breve explicación de Sorasaki Hina, pero esta vez no hubo un gran debate.\n\nAl final, la decisión recaerá en Hina y un pequeño grupo de ejecutivos.\nPodemos optar por reclutar de forma estable a estudiantes de Gehenna, aceptar de manera amplia a estudiantes de otras escuelas, o incluso incorporar a ciudadanos alemanes locales para operar un gobierno autónomo." # 9-c
 hina_assembly.10.a: "Reclutemos miembros de forma activa."
 hina_assembly.10.b: "Permitir la afiliación incluso a estudiantes de otras escuelas."
 hina_assembly.10.c: "...Quizá la respuesta sea incorporar a los alemanes locales."

 hina_assembly.11.t: "1.ª Asamblea: cómo asegurar el presupuesto"
 hina_assembly.11.desc: "Ahora que el Pandemonium Society ha empezado a invertir su capital en la administración, el presupuesto para operar el Comité Disciplinario se está quedando corto.\nEl punto del día, iniciado con la participación entusiasta de los miembros, trata sobre cómo asegurar fondos.\nCon el discurso de Sorasaki Hina explicando la escasez y la necesidad de medidas, el debate se concentró en tres enfoques.\n\nEl Departamento de Planificación se dividió en dos propuestas, pero bajo el liderazgo de Amau Ako busca construir un enorme Estado burocrático, similar a Millennium Science School.\n\nLa mayoría de miembros ordinarios quiere mantener el sistema actual.\n\nEl Departamento Médico y el Departamento de Ejecución sostienen que, para una movilización económico-social y militar inmediata, debemos emitir órdenes directas a las empresas."
 hina_assembly.11.a: "La burocracia es lo que mejor conocemos."
 hina_assembly.11.b: "Mantengamos al máximo el estado actual con austeridad e impuestos locales."
 hina_assembly.11.c: "Necesitamos movilización económica inmediata."
 GEH_factory_focus_7_tt: "Este enfoque se desbloquea según la §Ypolítica económica§! elegida durante la §Y1.ª Asamblea del Comité Disciplinario§!."

 hina_assembly.12.t: "1.ª Asamblea: lealtad hacia la jefa del Comité"
 hina_assembly.12.desc: "Al ver cómo la jefa del Comité resolvía la crisis con un carisma arrollador y un liderazgo ordenado, los miembros del Comité cayeron en un fervor excesivo.\nEsta sesión, iniciada con un apoyo abrumador, trata sobre la forma de Estado del Comité.\n\nAmau Ako simpatiza con el fervoroso apoyo a Sorasaki Hina y ha hecho la vista gorda; el Departamento de Planificación también guarda silencio.\n\nShiromi Iori y otros ejecutivos muestran descontento al ver que su propio esfuerzo queda eclipsado.\n\nY una parte considerable de miembros ordinarios sigue alabando las acciones de la jefa del Comité."
 hina_assembly.12.a: "No debería ser un gran problema."
 hina_assembly.12.b: "Promocionemos a los ejecutivos del Comité."
 hina_assembly.12.c: "Aceptemos el fervor." # c-b-a-b 시 개방


