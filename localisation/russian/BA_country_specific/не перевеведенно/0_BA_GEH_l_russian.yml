 GEH_hina_corruption_loc_level_3: "Despertar"

 GEH_hina_corruption_tt: "§gSorazaki Hina ha comenzado a recibir la tentación de su doble personalidad, \"Baal\". A partir de ahora, Hina obtendrá decisiones únicas bajo el nombre de §YEl trono de Baal§! para resistir la tentación de Baal. Buena suerte con el futuro de Sorazaki Hina.§!"
