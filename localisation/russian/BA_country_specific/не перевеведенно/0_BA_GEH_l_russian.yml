 GEH_artist_advisor_tt: "\n§gSi el Comité Disciplinario de Gehenna contrata a un asesor con el rasgo §!§YArtista§!§g, obtendrá decisiones especiales relacionadas con las reformas artísticas de Gehenna.§!"
