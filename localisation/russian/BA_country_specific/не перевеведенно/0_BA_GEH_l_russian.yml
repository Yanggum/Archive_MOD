 ### Decisiones ###
 GEH_walk_with_ako: "Vacaciones privadas con Ako"
 GEH_walk_with_ako_desc: "Como el Departamento de Planificación se ha hecho cargo de gran parte del trabajo de la jefa del Comité Disciplinario, ahora es posible tomar unas vacaciones libres que en Kivotos serían imposibles. Claro que no se pueden usar con demasiada frecuencia, pero si propones viajar con Ako, ella difícilmente se negará."

 GEH_give_ako_present: "Dar un regalo a Ako"
 GEH_give_ako_present_desc: "Aunque no sea algo caro, Ako se alegrará simplemente por recibir un regalo de la jefa del Comité Disciplinario."

 GEH_visit_planning_department: "Visitar el Departamento de Planificación"
 GEH_visit_planning_department_desc: "¿Vas a quedarte sola en una oficina sofocante tramitando papeles? ¿No sería mejor ir en persona al Departamento de Planificación para ver a Ako y trabajar en documentos frente a su escritorio?"

 GEH_pressure_on_planning_department: "Presionar al Departamento de Planificación"
 GEH_pressure_on_planning_department_desc: "Planeas pasarle aún más trabajo al Departamento de Planificación y holgazanear, para que Ako no tenga tiempo de ir a la oficina de la jefa. Ako es lo bastante inteligente como para entender lo que significa este comportamiento."

 GEH_ako_denial: "Rechazar la audiencia de Ako"
 GEH_ako_denial_desc: "\"Se prohíbe temporalmente a la alta funcionaria Amau Ako entrar en la oficina de la jefa del Comité Disciplinario.\""

 GEH_ako_berate: "Humillación pública"
 GEH_ako_berate_desc: "Criticas públicamente el manejo de documentos y trámites de Ako delante de otros miembros del Comité Disciplinario. Por supuesto, no es porque Hina odie a Ako. Esto busca que los demás miembros tengan la percepción de que \"la jefa odia a la alta funcionaria\"."

 GEH_discipline_system_category: "Disciplina de [GEH.GetName]"

 geh_discipline_system_desc: "Desde antes de la Gran Transferencia, el §GComité Disciplinario de Gehenna§! era un organismo de orden público encargado de preservar el orden social y la moral.\n\nA diferencia de Pandemonium Society, logramos mantener el orden en los territorios ocupados alemanes y sostener una §Ysociedad controlada§! en la que una minoría de población de Kivotos domina a la mayoría de población alemana.\n\nPero nuestro §Yorden§! no puede mantenerse sin esfuerzo.\n\nNo solo quedan remanentes del §RHeer§! (Fuerza de Defensa) con los que el Departamento de Ejecución se enfrenta directamente, sino que además en nuestras ciudades proliferan múltiples §Rorganizaciones criminales§!.\n\nCélulas de militantes del Partido Nazi, bandas Helmet, e incluso el Club de Desarrollo de Aguas Termales: innumerables §Rorganizaciones criminales§! alteran el orden social.\n\nArrestarlas y §Ymantener la moral pública§! es precisamente el deber del Comité Disciplinario de Gehenna.\n\n§YDisciplina actual§!: [?geh_discipline_var|1%%]\n\nEfectos por disciplina actual:\n Ataque de división: [?geh_discipline_army_attack_factor|=+%2]\n Defensa de división: [?geh_discipline_army_defence_factor|=+%2]\n Ruptura de división: [?geh_discipline_breakthrough_factor|=+%2]"

 GEH_discipline_system_weak_discipline: "Moral debilitándose"

 GEH_discipline_system_attack_nazi: "Atacar células de militantes del Partido Nazi"
 GEH_discipline_system_attack_nazi_desc: "La Wehrmacht y el Partido Nazi fueron instituciones del antiguo Reich alemán, pero tras perder su liderazgo por la Gran Transferencia, ahora actúan de forma separada.\n\nEn general, las células de militantes nazis están formadas por civiles sin entrenamiento militar y continúan como pandillas callejeras que cometen crímenes violentos contra población de Kivotos, como semihumanos o robots."

 GEH_discipline_system_attack_helmet: "Atacar bandas Helmet"
 GEH_discipline_system_attack_helmet_desc: "Las bandas Helmet son un término genérico para organizaciones criminales que ya existían en Kivotos.\n\nEran famosas por ponerse cascos y disparar a diestra y siniestra, y son tristemente célebres por no dejar de hacer lo mismo incluso después de la Gran Transferencia."

 GEH_discipline_system_attack_onsen: "Atacar al Club de Desarrollo de Aguas Termales"
 GEH_discipline_system_attack_onsen_desc: "Contra estos terroristas, dispuestos a volar cualquier infraestructura pública con tal de \"desarrollar\" aguas termales, no hace falta ni un ápice de piedad."

 GEH_discipline_system_get_weapons: "Tomar el control de las fábricas militares artesanales nazis"
 GEH_discipline_system_get_weapons_desc: "Tomamos el control de las fábricas artesanales creadas por las células nazis y las seguimos usando bajo nuestro control.\n\nQue usemos instalaciones clandestinas e ilegales creadas por nazis será visto por los miembros del Comité Disciplinario como una conducta inmoral."

 GEH_discipline_system_boom_weapons: "Volar las fábricas militares artesanales nazis"
 GEH_discipline_system_boom_weapons_desc: "Tomamos el control de las fábricas artesanales creadas por las células nazis y las destruimos por completo."

 GEH_discipline_system_alliance_with_hitler: "Alianza con Hitler"
 GEH_discipline_system_alliance_with_hitler_desc: "Angela Hitler, capitalista antinazi y de tendencia filojudía, es conocida entre el público por dos historias: ser una exitosa empresaria dueña de una fábrica de tabaco y ser la hermana del líder nazi Adolf Hitler, quien murió durante la Gran Transferencia.\n\nHitler busca fondos para operar el internado Judaika y proteger a estudiantes judíos de supremacistas arios.\n\nA cambio, nosotros podremos recibir apoyo material para reprimir a los remanentes nazis dentro de Gehenna."

 GEH_discipline_system_alliance_with_nyaomoto: "Contrato con NyaoFood"
 GEH_discipline_system_alliance_with_nyaomoto_desc: "NyaoFood no es una simple empresa de alimentos. Han organizado una especie de \"unidad Helmet\" como fuerza armada corporativa para reprimir a quienes se les opongan.\n\nEste contrato nos permite operar dichas fuerzas corporativas mediante un acuerdo de servicios.\n\nSerá una violación de nuestra causa de actuar por el orden de Gehenna, pero comparado con las organizaciones criminales locales, contratar delincuentes menores como los Helmet no es un problema tan grande, ¿no?"

 geh_discipline_system_tt: "Nuestra §Ydisciplina§! cambia $RIGHT|+=1$"
 GEH_discipline_system_weak_discipline_tt: "\n§gSi se completa el enfoque $GEH_first_congress_focus$, la cantidad de disciplina que disminuye se reduce a la mitad (redondeando decimales).§!"
 GEH_end_discipline: "La disciplina queda fijada en el máximo al completar el enfoque $GEH_NEXT_Army_focus_1$ y ya no disminuirá."

 GEH_military_power_category: "Política de defensa de [ROOT.GetAdjective]"
 GEH_military_power_category_desc: "\n\n\n\n\n£GFX_GEH_military_power_prefect_team\n\n\n\n\n\n\n\n\nEl §GComité Disciplinario de Gehenna§! era, antes de la Gran Transferencia, una organización tan poderosa que podía destruir por sí sola a la §YPandemonium Society§!.\n\nPero por el agotamiento del Misticismo causado por la §YGran Transferencia§! y por la llegada de población alemana—una situación imposible de prever—se ha producido una brecha de poder nacional.\n\nPara que no nos derrumbe el curso de los tiempos, debemos aprovechar al máximo nuestros activos e invertir continuamente en la §Ycapacidad defensiva§! para asegurar la supervivencia de [ROOT.GetAdjective].\n\nEl futuro de [ROOT.GetAdjective] dependerá de cómo actuemos.\n"

 GEH_military_power_52_factory: "Establecer una fábrica militar en [52.GetName]"
 GEH_military_power_52_factory_desc: "La inversión activa para establecer nuevas fábricas militares será un recurso crucial para la guerra venidera."

 GEH_military_power_53_factory: "Establecer una fábrica militar en [53.GetName]"
 GEH_military_power_53_factory_desc: "$GEH_military_power_52_factory_desc$"

 GEH_military_power_54_factory: "Establecer una fábrica militar en [54.GetName]"
 GEH_military_power_54_factory_desc: "$GEH_military_power_52_factory_desc$"

 GEH_military_power_52_steel_mill: "Establecer un complejo siderúrgico en [52.GetName]"
 GEH_military_power_52_steel_mill_desc: "Para producir recursos básicos de guerra, incluidos suministros militares, inevitablemente debemos invertir presupuesto en construir nuevas siderúrgicas."

 GEH_military_power_53_steel_mill: "Establecer un complejo siderúrgico en [53.GetName]"
 GEH_military_power_53_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_54_steel_mill: "Establecer un complejo siderúrgico en [54.GetName]"
 GEH_military_power_54_steel_mill_desc: "$GEH_military_power_52_steel_mill_desc$"

 GEH_military_power_prefect_team_tank_levelup: "Ampliar el instituto de investigación de tanques del Comité Disciplinario"
 GEH_military_power_prefect_team_tank_levelup_desc: "La tecnología de tanques del Comité Disciplinario estaba claramente enfocada en tanques ligeros para mantener el orden en Kivotos.\n\nEn el mundo posterior a la Gran Transferencia, nuestras capacidades blindadas son insuficientes para una guerra total.\n\nPor eso es necesaria la inversión en personal e infraestructura de investigación."

 GEH_military_power_prefect_team_gun_levelup: "Ampliar el instituto de investigación de armas del Comité Disciplinario"
 GEH_military_power_prefect_team_gun_levelup_desc: "Se dice que, antes de la Gran Transferencia, la jefa Sorazaki Hina podía enfrentarse sola a toda Pandemonium Society.\n\nPuede que hoy suene a leyenda de hace medio siglo, pero es famosísimo aquel incidente: cuando Pandemonium recortó por completo el presupuesto asignado al Comité Disciplinario, la jefa Hina arrasó el edificio de Pandemonium por su cuenta mientras protestaba.\n\nSin embargo, en la Tierra, donde el poder del Misticismo no existe, la población de Kivotos ha sufrido un debilitamiento.\n\nNuestro instituto de investigación de armas trabaja para producir telares de Misticismo, pero sin inversión continua no podrá rendir como es debido."

 GEH_military_power_prefect_team_visit_world: "Gira exterior de la jefa del Comité Disciplinario"
 GEH_military_power_prefect_team_visit_world_desc: "[GEH.GetName] es un país pequeño.\n\nSerá una buena experiencia que la jefa [GEH.GetLeader] visite naciones humanas avanzadas y observe cómo se preparan para la guerra.\n\nPara prepararnos ante el evento sin precedentes llamado guerra total, se eligieron países humanos (no naciones de Kivotos) como destino.\n\nEl Departamento de Inteligencia propone tres opciones: Italia, Egipto y Japón.\n\nLa jefa [GEH.GetLeader] podrá visitar cualquiera de ellos… siempre que no haya problemas diplomáticos."

 GEH_military_power_52_infrastructure: "Mejorar la red vial en [52.GetName]"
 GEH_military_power_53_infrastructure: "Mejorar la red vial en [53.GetName]"
 GEH_military_power_54_infrastructure: "Mejorar la red vial en [54.GetName]"

 GEH_military_power_non_halo_reorganize: "Divisiones de infantería de 'Halo mental'"
 GEH_military_power_non_halo_reorganize_desc: "Este plan busca que los prisioneros del Heer encerrados en la cárcel sirvan a Gehenna.\n\nNo les daremos un Halo de verdad ni nada parecido.\n\nEn su lugar, tras un adoctrinamiento para que *sientan* que tienen una fuerza comparable a la de la infantería Halo, los equiparemos con armadura y los enviaremos al frente.\n\nNo es un Halo real, pero serán desplegados con el mismo propósito táctico y en el mismo esquema operativo que la infantería Halo.\n\n¿No podría llamárseles, entonces, infantería de Halo mental?\n\n¿Que no? ¿Cuánto más \"humano\" esperabas que fuéramos con los nazis?"

 GEH_gehenna_cultural_revolution_category: "Comité Revolucionario de las Artes"
 GEH_gehenna_cultural_revolution_category_desc: "Hasta antes de la §YRevolución Celestial§!, la §GGehenna§! era un lugar lleno de contradicciones.\n\nLa academia prometía a los estudiantes aprendizaje y crecimiento, pero dentro convivían violencia sin orden y poder corrupto.\n\nEsa decadencia, ese caos y ese orden hipócrita fueron el pecado original que oprimió a nuestra gran salvadora, la §Yjefa Sorazaki Hina§!, y la causa por la cual nos dejó.\n\nTras la revolución, la cultura de Gehenna debe reescribirse desde la raíz.\n\nTodo lo que defendían los §Ytraidores§!: el libertinaje individualista de Kivotos y el viejo romanticismo de Alemania… todo es contaminación que debe ser §Rpurificada§!.\n\nYa no buscamos fusión ni armonía.\n\nNuestra §Yraíz§! es únicamente el §YSorazakismo§!, y todo lo demás no es más que un relicario del viejo mundo destinado a ser destruido.\n\nYa no se tolerará la libertad caótica del pasado.\n\nEl arte no será un entretenimiento para la satisfacción individual, sino un instrumento sagrado para imponer la §1voluntad de la revolución§! y alabar las gestas de la §Gjefa Hina§!.\n\nBajo el §1Comité Revolucionario de las Artes§!, toda actividad creativa será un \"arma\" que queme el mundo viejo y una \"oración\" para recibir el mundo nuevo en el que ella regresará.\n\nEste es el único modo de enderezar la verdadera tradición de Gehenna y difundir nuestra ideología."

 GEH_gehenna_art_avant_upgrade_tt: "\nAl elegir Arte Vanguardia:\n"
 GEH_gehenna_art_ultracon_upgrade_tt: "\nAl elegir Arte Ultraconservador:\n"
 GEH_gehenna_art_avant_garde_deconstruction: "Arquitectura deconstructivista"
 GEH_gehenna_art_avant_garde_deconstruction_desc: "Los edificios no existen para la función ni para la comodidad. Son un manifiesto destinado a destruir las nociones establecidas sobre el espacio. 'Deconstruiremos' deliberadamente la arquitectura del viejo mundo y recombinaremos sus ruinas de forma ilógica, creando nuevas estructuras que obliguen a todos a la incomodidad y a la reflexión. La sensación de estabilidad no es más que una ilusión burguesa."

 GEH_gehenna_art_avant_garde_noise_music: "Sinfonía del ruido revolucionario"
 GEH_gehenna_art_avant_garde_noise_music_desc: "La armonía y la melodía son el opio que adormece a las masas. Recopilaremos el estruendo de la maquinaria de las fábricas, discursos de radio distorsionados y los gritos de los \"traidores\" para componer una nueva sinfonía. Este 'ruido revolucionario' paraliza la razón del oyente y lo obliga a enfrentar, con honestidad, el dolor esencial del mundo que dejó la ausencia de Hina."

 GEH_gehenna_art_avant_garde_theater_of_cruelty: "Teatro de la crueldad"
 GEH_gehenna_art_avant_garde_theater_of_cruelty_desc: "El público ya no es un observador seguro. Nuestro teatro derriba la frontera entre escenario y butacas: los actores acusarán directamente a los espectadores de ser \"traidores\" y atacarán su complacencia. La narrativa será destruida, el significado será deconstruido, y solo quedarán emoción cruda y shock para conducir al público a un despertar revolucionario."

 GEH_gehenna_art_avant_garde_anti_art: "Manifiesto contra el arte"
 GEH_gehenna_art_avant_garde_anti_art_desc: "Pintar un lienzo o tallar piedra son reliquias del pasado. El verdadero arte revolucionario no está en crear, sino en destruir. Quemaremos museos y proclamaremos como \"obra maestra de la época\" el metraje que documente ese proceso. La muerte del arte es el arte más grandioso."

 GEH_gehenna_art_avant_garde_automatic_writing: "Poesía de escritura automática"
 GEH_gehenna_art_avant_garde_automatic_writing_desc: "La razón es un producto del viejo mundo. Para capturar la auténtica voluntad inconsciente de Hina, los poetas abandonarán todo pensamiento y derramarán palabras únicamente siguiendo el movimiento de la mano. También se fomentará la técnica del 'cut-up': recortar códigos legales y tratados filosóficos del viejo mundo para recombinarlos al azar. Esas frases caóticas serán la profecía del nuevo tiempo."

 GEH_gehenna_art_avant_garde_happening: "Happening de la Hora Cero (0:00)"
 GEH_gehenna_art_avant_garde_happening_desc: "Para abolir el individualismo y alcanzar una inconsciencia colectiva perfecta, proclamaremos sin aviso previo la 'Hora Cero' en toda la ciudad. Durante una hora, mientras suenan las sirenas, todos los ciudadanos deberán detener lo que estén haciendo y tararear una sola nota mirando hacia la antigua oficina de Hina. Este gigantesco teatro del absurdo es la cumbre del arte que perseguimos."

 GEH_gehenna_art_ultracon_monumentalism: "Arquitectura monumental neoclásica"
 GEH_gehenna_art_ultracon_monumentalism_desc: "Abolimos la arquitectura modernista decadente y construimos enormes obras monumentales que simbolizan la eternidad y la grandeza del Estado. Todos los edificios públicos se unificarán bajo el estilo neoclásico, emblema de orden y autoridad, y su escala abrumará al espectador para inculcar reverencia por la nación."

 GEH_gehenna_art_ultracon_marches: "Cantos de marcha para la movilización total"
 GEH_gehenna_art_ultracon_marches_desc: "Se prohíben todas las músicas individualistas y decadentes, como el jazz o el rock. Los compositores autorizados por el Estado tendrán el deber de escribir únicamente marchas y canciones nacionales que alaben la grandeza de Hina, la entrega a la patria y la sacralidad del trabajo. La música no es para contemplarse: es una herramienta para movilizar."

 GEH_gehenna_art_ultracon_realism: "Pintura de realismo heroico"
 GEH_gehenna_art_ultracon_realism_desc: "El único propósito del arte es educar al pueblo. Todos los pintores, bajo la guía del Estado, deberán retratar exclusivamente la imagen idealizada de la Líder Hina, estudiantes robustos sudando por la patria y campesinos celebrando cosechas abundantes. La abstracción y el expresionismo serán definidos como \"arte traidor\" y quemados de inmediato."

 GEH_gehenna_art_ultracon_epic_poem: "Compilar la epopeya nacional de Gehenna"
 GEH_gehenna_art_ultracon_epic_poem_desc: "La historia debe tener un solo relato correcto. El comité movilizará toda la capacidad literaria del Estado para compilar una única 'epopeya nacional', desde la creación de Gehenna hasta el martirio de Hina y la gran revolución. Fuera de esta epopeya, todos los libros de historia y la literatura serán prohibidos."

 GEH_gehenna_art_ultracon_uniform: "Establecer el atuendo estándar nacional"
 GEH_gehenna_art_ultracon_uniform_desc: "La diversidad de ropa que expresa el gusto individual es, en sí misma, una señal de impureza ideológica. Para erradicar el individualismo decadente, todos los ciudadanos deberán vestir en espacios públicos únicamente el 'atuendo estándar nacional' simple y unificado decretado por el Estado. La moda es contrarrevolución."

 GEH_gehenna_art_ultracon_mass_games: "Gimnasia masiva y espectáculo artístico"
 GEH_gehenna_art_ultracon_mass_games_desc: "El talento artístico individual carece de sentido. La belleza verdadera surge cuando una enorme masa se mueve como un solo organismo. Celebraremos 'gimnasias masivas' con decenas de miles de estudiantes, creando un espectáculo donde, mediante mosaicos de carteles, aparecerán el retrato de Hina y consignas revolucionarias. El individuo no es más que un píxel al servicio de la gloria del todo."

 GEH_gehenna_art_category: "Academia de artes de Gehenna"
 GEH_gehenna_art_category_desc: "Antes de la §YGran Transferencia§!, la §GGehenna§! era un Estado-academia dentro de una ciudad-academia. Su territorio se extendía a lo largo del distrito autónomo de Gehenna, y los estudiantes de Gehenna y los ciudadanos de Kivotos vivían alrededor de la academia. La academia era parte natural de nuestras vidas, y Gehenna también era un lugar para aprender cosas nuevas y avanzar hacia el futuro. Bueno… quizá sea un título un poco generoso para una escuela donde los estudiantes se saltan las clases sin siquiera presentar justificante.\n\nTras la Gran Transferencia, la cultura de Gehenna está cambiando rápidamente. Sin embargo, a diferencia de la §YPandemonium Society§!, que perdió su identidad por aferrarse al §YHeer§! y embriagarse de poder, nosotros no hemos olvidado que nuestra §Yraíz§! es ser un Estado-academia. En la Tierra, y no en Kivotos, la tradición de Gehenna debe continuar.\n\nYa no podemos ir disparando por la calle como en Kivotos. Pero la §Glibertad y el caos§! característicos de Gehenna pueden ser una fuente de inspiración para los artistas. Bajo el §Gorden del Comité Disciplinario§!, la antigua 'libertad y caos'—antes violenta—se sublimará y preservará como 'arte'. Este es el modo de proteger nuestra tradición y nuestra historia como Estado-academia, aprovechando además nuestras fortalezas.\n"

 GEH_gehenna_art_music_munich_conservatory: "Patrocinar la Academia Nacional de Música"
 GEH_gehenna_art_music_munich_conservatory_desc: "La Academia Nacional de Música (Staatliche Akademie der Tonkunst) es una institución tradicional de Alemania fundada en 1846. Muchos estudiantes aprenden música allí y han logrado resultados compositivos notables. Tras la 'Gran Transferencia', el significado de \"nacional\" pasó de Alemania a Gehenna, pero aun así sigue siendo la universidad de música más prestigiosa de toda Alemania.\n\nSi [ROOT.GetLeader] financia a los profesores de la academia, podremos crear nuevas y magníficas piezas para alemanes y geennanos por igual."

 GEH_gehenna_art_music_concert: "Concierto itinerante"
 GEH_gehenna_art_music_concert_desc: "El rock de Gehenna aún no ha ganado gran popularidad entre el público alemán general, pero aun así recibe el amor apasionado de la población de Kivotos. Un nuevo concierto será un evento divertido para nuestros ciudadanos."

 GEH_gehenna_art_music_jazz: "Jazz para los alemanes"
 GEH_gehenna_art_music_jazz_desc: "El régimen nazi alemán prohibió el jazz por considerarlo música \"decadente\" y expulsó a sus músicos. Es una pena que nunca comprendieran, hasta el final, si lo verdaderamente decadente que dañaba el orden social era la música… o ellos mismos.\n\nPara la población de Kivotos en Gehenna, el jazz es un legado del pasado, pero para los locales—que son mayoría—es una música moderna y atractiva. Organizar conciertos de jazz será un bienestar cultural para muchos alemanes."

 GEH_gehenna_art_gehenna_music_make: "Solicitar la creación de la \"Fantasía de Gehenna\""
 GEH_gehenna_art_gehenna_music_make_desc: "Es vergonzoso que la canción representativa de Gehenna sea el \"Himno a la Gran Pandemonium\" grabado por Hanuma Makoto. Invencible súper-ultra-acorazado Toramaru… por favor.\n\nAhn Eak-tae, discípulo del legendario compositor Richard Strauss, permanece en Gehenna y continúa su actividad musical. Con un apoyo presupuestario suficiente, podría componer para nosotros una nueva pieza representativa de Gehenna."

 GEH_gehenna_art_gehenna_music_new_military_song: "Establecer un nuevo canto militar de Gehenna"
 GEH_gehenna_art_gehenna_music_new_military_song_desc: "A diferencia de antes de la Gran Transferencia—cuando no éramos más que un simple Estado-academia—ahora debemos mantener esa tradición y, al mismo tiempo, aprender \"cómo sobrevivir en la Tierra\" mediante un ejército que incorpora a los locales.\n\nNecesitamos un canto militar nuevo y racional, con una melodía capaz de satisfacer tanto a alemanes como a geennanos.\n\nCarl Orff, un compositor estrictamente conservador activo en Múnich y veterano de la Gran Guerra de 1914, recibirá el encargo de una nueva marcha majestuosa."

 GEH_gehenna_art_music_serenade: "Fiesta especial de Gehenna"
 GEH_gehenna_art_music_serenade_desc: "Organizamos una fiesta invitando no solo a figuras de la academia Gehenna, sino también a directivos y a otras personalidades clave internas y externas. El momento central: Sorazaki Hina aparece con un vestido y ofrece personalmente un recital durante la fiesta."

 GEH_gehenna_art_bauhaus: "Patrocinar el Staatliches Bauhaus"
 GEH_gehenna_art_bauhaus_desc: "El Staatliches Bauhaus fue la gran universidad de arquitectura de Alemania, forzada a cerrar en 1933 tras la llegada del régimen nazi. Luego de que limpiamos la influencia nazi en Baviera, fue reconstruida como parte de la Academia Gehenna.\n\nEl Bauhaus, corazón de la arquitectura modernista, y el apoyo a esta institución ayudarán a que arquitectos geniales como su director, Ludwig Mies, influyan de manera decisiva en la industria arquitectónica de Gehenna."

 GEH_gehenna_art_urban_aesthetic_project: "Proyecto de renovación urbana"
 GEH_gehenna_art_urban_aesthetic_project_desc: "Intervenimos las zonas atrasadas de Gehenna y ordenamos sus distritos urbanos."

 GEH_gehenna_art_efficient_factory: "Fábrica militar eficiente"
 GEH_gehenna_art_efficient_factory_desc: "Los académicos de arquitectura advierten que nuestras instalaciones industriales tienen una estructura relativamente ineficiente. Reduciendo recorridos y mejorando la red de transporte que conecta fábricas y mercados, podremos desarrollar aún más nuestra infraestructura industrial."

 GEH_gehenna_art_reconstruction_of_headquartersy: "Reconstruir la sede del Comité Disciplinario"
 GEH_gehenna_art_reconstruction_of_headquartersy_desc: "El destacado profesor de arquitectura Mies van der Rohe recibió el encargo de diseñar la reconstrucción de la sede del Comité Disciplinario tras la reunificación de Gehenna.\n\nMies puso énfasis en dos puntos. Primero, la eficiencia: reducir la circulación entre departamentos y minimizar la energía necesaria para climatización. Segundo, la belleza exterior: Mies sostiene que una arquitectura modernista, con ornamentos innecesarios reducidos, también puede poseer belleza estética y la dignidad apropiada para la oficina de un jefe de Estado."

 GEH_gehenna_art_reconstruction_of_pandemonium_society: "Remodelar Pandemonium"
 GEH_gehenna_art_reconstruction_of_pandemonium_society_desc: "Tras la reunificación de Gehenna, el profesor Mies van der Rohe decidió confiscar por completo las instalaciones de la antigua Pandemonium Society para degradar a una institución excesivamente grande y ostentosa, y convertirla en una biblioteca para los ciudadanos.\n\nSi bien durante los combates entre el Comité Disciplinario y Pandemonium quedaron numerosos impactos de bala en la sede y en el despacho del presidente, nuestros expertos afirman conocer métodos para borrar esas huellas por completo.\n\nPor si Pandemonium debe mantenerse en un rol degradado, Mies acordó reutilizar el viejo edificio escolar, pequeño y antiguo, detrás de la sede de Pandemonium como edificio del presidente de Pandemonium. Será modesto y envejecido, pero ahora que todo el poder fue transferido al Comité Disciplinario, no habrá mayor problema."

 GEH_gehenna_art_pool: "Piscina privada para Hina"
 GEH_gehenna_art_pool_desc: "Circula un rumor absurdo: que la jefa Sorazaki Hina no sabe nadar… o sea, que si entra al mar, ¡se hunde de inmediato! Eh… sí, un rumor totalmente ridículo, ¿verdad? ...¿verdad?\n\nPara el día en que Sorazaki Hina pueda nadar con estilo frente a todos… ¡sin usar flotador!, solicitamos la construcción de una pequeña piscina privada.\n\nEs algo poco común en ella, que no suele cultivar hobbies ni actuar por beneficio personal. Tal vez incluso estuvo a punto de ahogarse al resbalarse en la bañera… quién sabe."

 GEH_gehenna_art_hot_spring: "Proyecto de aguas termales de Hinnom"
 GEH_gehenna_art_hot_spring_desc: "El Club de Desarrollo de Aguas Termales explota primero y pregunta después, incluso en lugares donde sería raro que hubiera una fuente termal. Pero nosotros sabemos que ya existían aguas termales sulfurosas en la \"Cordillera de Hinnom\" detrás del distrito central de la Academia Gehenna.\n\nAsí como tras la Gran Transferencia una tormenta de arena de Abydos se trasladó junto con ella y convirtió temporalmente Baviera en un caos, también se cree que estas aguas termales naturales de la cordillera de Hinnom se trasladaron al distrito central.\n\nPodemos considerar un redesarrollo más refinado de estas aguas termales."

 GEH_gehenna_art_munich_academys: "Patrocinar la Academia de Bellas Artes de Múnich"
 GEH_gehenna_art_munich_academys_desc: "La Academia de Bellas Artes de Múnich (Akademie der Bildenden Künste München) es una gran universidad artística alemana fundada en 1770 y que continúa hasta hoy.\n\nA lo largo de siglos, innumerables artistas han nacido aquí, están naciendo aquí y seguirán naciendo aquí. Patrocinar esta academia es una forma adecuada de mostrar el interés de nuestro gobierno por las artes."

 GEH_gehenna_art_exhibition: "Exposición de 'arte degenerado'"
 GEH_gehenna_art_exhibition_desc: "En el pasado, el régimen nazi se burló de todas las obras que no encajaban en sus criterios, llamándolas \"arte degenerado\".\n\nPatrocinar una exposición de ese \"arte degenerado\" permitirá que Gehenna abrace diversas libertades culturales y eliminará la influencia nazi en Alemania."

 GEH_gehenna_art_propaganda: "Producir cómics de propaganda de Gehenna"
 GEH_gehenna_art_propaganda_desc: "Es imposible imaginar que el cómic no pertenezca al ámbito del arte.\n\nFinanciaremos con fondos nacionales a varios dibujantes para producir cómics propagandísticos con el fin de promocionar la Academia Gehenna."

 GEH_gehenna_art_hina_propaganda: "Producir un cómic biográfico de Sorazaki Hina"
 GEH_gehenna_art_hina_propaganda_desc: "Podremos convertir en material promocional los logros de Sorazaki Hina antes de la Gran Transferencia: qué proezas realizó y qué casos investigó.\n\nTal vez esto se pueda llamar \"propaganda\". Pero… ¿acaso habría que incluir mentiras?"

 GEH_gehenna_art_ibuki_university: "Formación artística para Ibuki"
 GEH_gehenna_art_ibuki_university_desc: "Tanga Ibuki quiere convertirse en pintora. Quizá sea lo mejor.\n\nIncluso cuando crezca, que no vuelva a ocuparse de la política y que se encierre en un museo antes que en Pandemonium será algo positivo para la política de Gehenna.\n\nIbuki es peligrosamente popular en Gehenna, y aun así está mucho más interesada en otras cosas que en la política.\n\nRecibirá educación para abandonar la política y convertirse en pintora."

 GEH_gehenna_art_headquartersy: "Decoración de la sede del Comité Disciplinario"
 GEH_gehenna_art_headquartersy_desc: "Reuniremos artistas para colgar pinturas interiores que aumenten la dignidad de la sede del Comité Disciplinario y crearemos un espacio especial para conservar retratos de jefes anteriores.\n\nEste proceso de decoración no es un mero lujo: también es un trabajo para mostrar al público el éxito de nuestro Comité Disciplinario."

 GEH_hina_art_disciplined_expressionism: "Expresionismo con disciplina"
 GEH_hina_art_disciplined_expressionism_desc: "\"El caos no solo engendra destrucción. Dentro de un marco correcto, también puede convertirse en el motor creativo más poderoso.\"\n\nEl éxito de \"La mujer de piel de hierro\" no terminó como un simple triunfo teatral. Fue la señal de inicio de una nueva corriente artística.\n\nInspirados por la obra de Hina, los artistas de Gehenna comenzaron un nuevo intento: hacer estallar la identidad propia de Gehenna—\"libertad y caos\"—no como violencia desordenada, sino dentro de una estricta belleza formal.\n\nEsta corriente no niega la emoción intensa ni la energía cruda; en cambio, las contiene dentro de estructuras y formas cuidadosamente construidas, como el \"orden\" del Comité Disciplinario, sublimándolas en arte.\n\nMúsica de melodías violentas pero refinadas; pinturas de composición caótica pero equilibrio perfecto; obras trágicas sin un milímetro de error. El arte de Gehenna ya no es solo entretenimiento: encarna su filosofía de controlar el caos y crear belleza dentro del orden.\n\nEste será, sin duda, el fruto más grandioso nacido de la cultura de Gehenna y Baviera."

 GEH_hina_art_new_figuration: "Nueva figuración de la Nueva Gehenna"
 GEH_hina_art_new_figuration_desc: "\"La verdad de este mundo es como un disparo oculto en un paisaje hermoso. El arte tiene que contener ambas cosas.\"\n\nLa obra confesional de Sorazaki Hina lanzó una nueva pregunta al mundo del arte de Gehenna: \"¿Cómo retratamos nuestra realidad?\"\n\nSi la primera generación tras la Gran Transferencia expresó el caos y el shock de forma directa, sus sucesores han comenzado a crear un nuevo arte capaz de poner en un mismo lienzo el caos de Gehenna y la calma de Baviera. Así nació la \"Nueva figuración de la Nueva Gehenna\".\n\nLos pintores de esta corriente plasman con audacia las cicatrices de la Gran Transferencia sobre los bellos paisajes naturales de Baviera.\n\nSobre un lago sereno flotan huellas arrancadas de orugas de tanque; en los Alpes nevados se marcan con nitidez las cicatrices negras dejadas por los proyectiles.\n\nTomando prestadas las pinceladas ásperas y los colores intensos del expresionismo alemán, retratan sin reservas el choque entre dos mundos contradictorios: la \"violencia\" cotidiana de Gehenna y el \"romanticismo\" tradicional de Baviera.\n\nUn crítico de arte dijo: \"Sus lienzos están llenos de gritos silenciosos\".\n\nEste nuevo arte es nuestra identidad: el autorretrato más honesto de una época que floreció en medio del caos."

 GEH_gehenna_legitimacy_category: "Legitimidad de Gehenna"
 GEH_gehenna_legitimacy_category_desc: "Debido al enfrentamiento persistente entre el Comité Disciplinario y Pandemonium Society tras la §YGran Transferencia§!, enfrentamos un problema de legitimidad respecto a dónde se encuentra el §Ycentro de Gehenna§!.\n\nSi mostramos a los estudiantes y ciudadanos que somos dignos de confianza, podremos aumentar nuestra legitimidad.\n"

 GEH_gehenna_legitimacy_up: "Aumentar legitimidad"
 GEH_gehenna_legitimacy_up_desc: "El aumento de la experiencia de seguridad pública del Comité Disciplinario ha hecho que recibamos una confianza más profunda por parte de los geennanos."


 #### 민주주의 아코
 GEH_ako_democratic_system_category: "[ROOT.GetAdjective] Consejo del Departamento de Planificación"
 GEH_ako_democratic_system_category_desc: "\nEl gobierno de [ROOT.GetName] está dejando atrás rápidamente el sistema tradicional de Estado-academia para transformarse en un Estado ordinario dirigido por tecnócratas. El cambio más importante es la introducción de una §Ydemocracia limitada§! dentro del gobierno. El §GConsejo§! es un parlamento indirecto elegido mediante el voto de los miembros del Departamento de Planificación; sin embargo, como la jefa §YSorazaki Hina§! sigue conservando plenos poderes, su función no deja de ser la de un §Yórgano consultivo§!.\n\nEs imposible ampliar el derecho al voto al público general. Tras la Gran Transferencia, los kivotosianos se convirtieron en una minoría étnica en Alemania, e implantar elecciones directas equivaldría a entregar Gehenna a los alemanes, quienes ya eligieron a los nazis mediante el voto democrático. Por ello, el Consejo operará como un sistema de §Cdemocracia controlada§! en el que los tecnócratas monopolizan los escaños, salvo por la aceptación de un pequeño grupo de §Yobservadores externos§!.\n\nBajo nuestro sistema de democracia controlada, el Consejo recibirá una evaluación pública como una de estas tres: §Gperros de los locales§!, §Ymediadores neutrales§! o §Olíderes de Gehenna§!. La mirada del Consejo influirá en el árbol de enfoques final después del §Y4.º Congreso§! y, si por cualquier motivo la jefa Hina abandona el gabinete, el odio hacia los locales tomará el control del Consejo y el §Requilibrio colapsará§!."

 GEH_ako_democratic_system_meeting_with_SPD: "Fortalecer el contacto con el Partido Socialdemócrata"
 GEH_ako_democratic_system_meeting_with_SPD_desc: "El Partido Socialdemócrata de Alemania no posee poder político dentro de [ROOT.GetName], pero a nivel local sigue en contacto con los trabajadores y cumple la función de trasladar sus demandas a nuestro gobierno. Al ser el único partido local que reconoce nuestra autoridad de gobierno, vale la pena aumentar el contacto con ellos para mantener relaciones amistosas con los trabajadores."

 GEH_ako_democratic_system_meeting_with_capitalists: "Participar en una fiesta social de kivotosianos"
 GEH_ako_democratic_system_meeting_with_capitalists_desc: "Tras la Gran Transferencia, los capitalistas bestiales y robots kivotosianos, así como la pequeña burguesía, fueron empujados a convertirse en una minoría étnica y se cohesionaron aún más, esforzándose por preservar una identidad propia separada de la de los alemanes. La participación de [ROOT.GetLeader] en una fiesta social kivotosiana traerá unidad a nuestra sociedad, hoy fragmentada desde la Gran Transferencia."

 GEH_ako_democratic_system_constitution: "Promulgar la Constitución de Gehenna"
 GEH_ako_democratic_system_constitution_desc: "Ahora que nos hemos convertido en el líder unificado de Gehenna, podemos dar un paso más y promulgar la constitución de la república federal."

 GEH_ako_democratic_system_constitution_human_right: "§GEspíritu constitucional§!: Enfatizar los derechos humanos universales"
 GEH_ako_democratic_system_constitution_human_right_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en los \"derechos humanos de todas las personas\". Se destacará como espíritu constitucional que nadie debe sufrir discriminación injusta por razón de sexo, raza, orientación sexual, discapacidad, etnia o religión." #pro-locales

 GEH_ako_democratic_system_constitution_esperanto: "§GEspíritu constitucional§!: Garantizar el estatus del esperanto"
 GEH_ako_democratic_system_constitution_esperanto_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en la \"comunicación con todos los Estados humanos\". Inscribir el esperanto (lengua internacional de la Tierra) como uno de los idiomas estándar de Gehenna y exigir que todas las leyes se publiquen también en esperanto será una muestra de que respetamos la civilización humana y su historia." #pro-locales

 GEH_ako_democratic_system_constitution_worker: "§GEspíritu constitucional§!: Derecho laboral"
 GEH_ako_democratic_system_constitution_worker_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en los \"derechos de los trabajadores\". Esto refleja especialmente la postura del Partido Socialdemócrata local; dado que los locales superan con creces en número a los kivotosianos, apoyar una legislación laboral avanzada desde el nivel constitucional tiene un gran significado." #pro-locales

 GEH_ako_democratic_system_constitution_state_capitalism: "§OEspíritu constitucional§!: Capitalismo de Estado"
 GEH_ako_democratic_system_constitution_state_capitalism_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en el \"capitalismo de Estado\". Toda la economía debe ser controlada y regulada por el gobierno bajo la dirección de [ROOT.GetLeader] y tecnócratas leales. Este sistema especial de capitalismo, donde el Estado controla el mercado, será elevado al rango de espíritu constitucional." #pro-Kivotos

 GEH_ako_democratic_system_constitution_internationalism: "§OEspíritu constitucional§!: Solidaridad entre academias"
 GEH_ako_democratic_system_constitution_internationalism_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en la \"solidaridad entre academias\". Se destacará como espíritu constitucional que debemos sobrevivir en la Tierra mediante la unidad no solo con Gehenna, sino también con Trinity, Millennium, Shanhaijing, Red Winter y todos los demás Estados de Kivotos." #pro-Kivotos

 GEH_ako_democratic_system_constitution_leader_principle: "§OEspíritu constitucional§!: Principio del liderazgo"
 GEH_ako_democratic_system_constitution_leader_principle_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en la \"lealtad infinita a la presidenta Hina\". Si bien nuestra constitución ya garantiza un poder ilimitado a Sorazaki Hina como presidenta del Consejo, esto va más allá de una simple garantía de poder: se codificará que todos los funcionarios, las organizaciones del Estado y las leyes existen para realizar \"la voluntad de Sorazaki Hina\" y deben obedecerla.\n\nSorazaki Hina es el símbolo de la libertad y el orden capaz de proteger la democracia controlada frente a diversos enemigos—desde fascistas de derecha, incluidos los nazis, hasta fascistas de izquierda como los estalinistas—y se enfatizará como algo natural que el Estado actúe de manera unificada siguiendo Su voluntad." #pro-Kivotos

 GEH_ako_democratic_system_constitution_feminism: "§YEspíritu constitucional§!: Feminismo"
 GEH_ako_democratic_system_constitution_feminism_desc: "Hacemos hincapié, como un valor central de nuestra constitución, en el \"feminismo\". Esto es, a la vez, un apoyo a la civilización y tradición de Kivotos—centrada en mujeres con Halo—y también el sueño de las feministas locales alemanas. Es una norma con la que coinciden tanto los kivotosianos como los progresistas locales; y, al mismo tiempo, es un espíritu constitucional al que se oponen tanto los bestiales y robots de Kivotos sin Halo como los conservadores locales… por lo que será el espíritu constitucional más \"neutral\"." #neutral

 ## Leyes generales

 GEH_ako_democratic_system_law_jewish_protection: "Ley de protección a los judíos"
 GEH_ako_democratic_system_law_jewish_protection_desc: "Desde que el régimen de Hitler tomó el poder en 1933 hasta su colapso en 1935, los judíos sufrieron graves violaciones de sus derechos de propiedad en Alemania. La nueva ley apoyará compensaciones cuando los judíos puedan demostrar que los nazis les arrebataron negocios privados, tierras u otros bienes. El presupuesto será cubierto con impuestos pagados por los alemanes que eligieron a Hitler."

 GEH_ako_democratic_system_law_dissolution_of_prussia: "Disolver el Estado Libre de Prusia"
 GEH_ako_democratic_system_law_dissolution_of_prussia_desc: "El Estado Libre de Prusia, el más grande y poderoso incluso dentro de la República de Weimar, es innecesario para nuestra federación de Gehenna. Respetamos el federalismo y la autonomía local de Weimar, pero es peligroso dejar intacto un Estado Libre excesivamente grande—y más aún uno cuyo centro territorial ocupa gran parte de Trinity. Prusia será disuelta y dividida en Estados más pequeños, incluido el Estado Libre de Brandeburgo."

 GEH_ako_democratic_system_law_nationalization_of_resources_act: "Ley de nacionalización de recursos"
 GEH_ako_democratic_system_law_nationalization_of_resources_act_desc: "La naturaleza alemana—bosques, lagos, ríos y tierras—debe ser utilizada para Gehenna. Obtenemos la autoridad para confiscar como tierras estatales las zonas sin desarrollar donde se estime que existen recursos apropiados.\n\nLos recursos sujetos a incautación se limitan únicamente a los recursos naturales propiedad de alemanes; los \"recursos artificiales\"—como el caucho sintético producido por capitalistas inmigrantes de Kivotos—no serán objeto de confiscación.\n\nEsta ley confiscará de manera exhaustiva las tierras de los junkers que sobrevivieron a la Gran Transferencia y excluirá su poder de forma permanente."

 GEH_ako_democratic_system_law_proportional_representation: "Representación proporcional en asambleas locales"
 GEH_ako_democratic_system_law_proportional_representation_desc: "Debido a nuestra democracia controlada, los alemanes no pueden participar en la política central, pero aún conservan asambleas locales para ejercer su autonomía. Reducir los escaños de distritos uninominales—cuyos distritos suelen trazarse en favor de los kivotosianos—e introducir escaños proporcionales permitirá a los alemanes ejercer mejor sus derechos en las asambleas locales."

 GEH_ako_democratic_system_law_wage_control: "Ley de control salarial"
 GEH_ako_democratic_system_law_wage_control_desc: "Para mantener nuestros dos sistemas estatales—democracia controlada y capitalismo de Estado—también es importante no perder el apoyo popular. La ley de control salarial respaldará a los trabajadores permitiendo que el Estado intervenga en negocios donde se considere que los salarios son demasiado bajos, y que \"negocie\" directamente los salarios."

 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes: "Ley especial de castigo por delitos económicos"
 GEH_ako_democratic_system_law_special_punishment_act_on_economic_crimes_desc: "En cooperación con el Partido Socialdemócrata alemán, estableceremos una unidad especial de investigación económica para perseguir a capitalistas que cometan evasión fiscal, retrasos en pagos salariales o contratos laborales injustos. También promulgaremos una \"ley de castigo especial\" que incrementará las multas en proporción al patrimonio del infractor. El orden y el Estado de derecho de Gehenna deben aplicarse por igual a los delitos económicos, no solo a los crímenes violentos."

 GEH_ako_democratic_system_law_public_security_act: "Ley de mantenimiento del orden público"
 GEH_ako_democratic_system_law_public_security_act_desc: "Esta ley, que restringe la actividad política de los comunistas que amenazan el orden del Estado de Gehenna, recibe—sorprendentemente—un fuerte apoyo del Partido Socialdemócrata alemán. A lo largo de toda la República de Weimar, comunistas y socialdemócratas estuvieron enfrentados; los socialdemócratas desean que los comunistas, a quienes detestan tanto como al partido nazi, no vuelvan a aparecer jamás en suelo de Gehenna."

 GEH_hina_corruption_category: "El trono de Baal"
 #GEH_hina_corruption_category_desc: "\n\n\n"

 GEH_hina_corruption_gui_text_desc: "Inserta aquí el texto de decisión"

 GEH_hina_corruption_thought_cabinet_advanced_race_theory: "§OGabinete mental§!: Teoría racial avanzada"
 GEH_hina_corruption_thought_cabinet_advanced_race_theory_desc: "¿Se puede llamar seres inteligentes a los locales, que no tienen Halo y ni siquiera muestran un atisbo de misterio o sublimidad? Los bestiales y robots de Kivotos, al menos, fingen no ser humanos. Pero estas cosas… solo están imitando torpemente a los humanos, ¿no? Me da náuseas. De verdad."

 GEH_hina_corruption_thought_cabinet_bringing_of_the_law: "§OGabinete mental§!: Portadora de la ley"
 GEH_hina_corruption_thought_cabinet_bringing_of_the_law_desc: "Yo soy la portadora de la ley de Gehenna. El orden. Los que no respetan ese orden… están negándome a mí. Así como es legítima defensa enfrentar al enemigo que me ataca, ¿no lo serían también métodos especiales de interrogatorio, incluyendo la tortura… una especie de legítima defensa? Al fin y al cabo, ellos fueron los que atacaron primero."

 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse: "§OGabinete mental§!: Policía del apocalipsis"
 GEH_hina_corruption_thought_cabinet_cop_of_the_apocalypse_desc: "¿No debería extinguirse la civilización humana? Su existencia está afectando a Gehenna y a Kivotos. Como veneno que se esparce en una copa, lentamente… se infiltra. Ese pecado."

 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button: "§GGabinete mental§!: Dedo sobre el botón de expulsión"
 GEH_hina_corruption_thought_cabinet_finger_on_the_eject_button_desc: "Aunque estos malditos pensamientos intenten controlarme… no servirá. Sí. Antes me vuelo la cabeza.\n\nNo es que me gusten los locales, Baal. Es la voluntad de *no* convertirme en una marioneta dominada por ti, que dices ser mi doble personalidad."

 GEH_hina_corruption_thought_cabinet_derealization: "§GGabinete mental§!: Desrealización"
 GEH_hina_corruption_thought_cabinet_derealization_desc: "Todo se ve irreal y lejano. No… en realidad lo es. Esto es Kivotos y, al mismo tiempo, no lo es. Kivotos solo está parasitando el planeta llamado \"Tierra\".\n\nIntentar aplicar de forma uniforme el sentido común y el conocimiento de Kivotos a este mundo… es arrogancia, y no es más que una orden falsa generada por Baal."

 GEH_hina_corruption_thought_cabinet_rigorous_self_critique: "§GGabinete mental§!: Autocrítica rigurosa"
 GEH_hina_corruption_thought_cabinet_rigorous_self_critique_desc: "Tu rango era el de jefa del Comité Disciplinario. Un rango del pasado. Ahora soy adulta y… supongo que me llamarán presidenta, pero eso no cambia el hecho de que fuiste \"jefa del Comité Disciplinario\", ¿verdad?\n\nSorazaki Hina, cálmate. Solo eres una representante estudiantil que mantiene el orden escolar; no tienes ninguna autoridad para sopesar la vida de nadie.\n\nAsí que… levántale el dedo medio a este maldito Baal y aplasta esos pensamientos. Por favor."

 GEH_hina_corruption_meeting_with_perfect_team: "Reunión privada con los mandos del Comité Disciplinario"
 GEH_hina_corruption_meeting_with_perfect_team_desc: "Baal es una perra. La verdad es que no me gusta mucho decir groserías, pero… esa mujer sí que es una perra.\n\nSiendo mi doble personalidad, intenta arruinarme y está metiéndome ideas cínicas y despreciativas no solo contra los alemanes, sino incluso contra el propio Comité Disciplinario.\n\nQue se mueran o no los locales… no quiero ni hablar de esos malditos. Pero el Comité Disciplinario es distinto. No quiero odiar a Ako, a Iori y a Chinatsu.\n\nA diferencia de esos fanáticos que cuelgan mi foto en la pared y se arrodillan, ellas me ven como Sorazaki Hina.\n\nSi pudiera pasar tiempo con ellas… quizá podría soportarlo un poco. Quiero creerlo."

 GEH_hina_corruption_meeting_with_zealot: "Reunión con fanáticos del Comité Disciplinario"
 GEH_hina_corruption_meeting_with_zealot_desc: "Los fanáticos son idiotas que repiten que \"sin la gran jefa Hina no existe Gehenna\".\n\nSi hay algo bueno en reunirme directamente con esos fanáticos que tiré al basurero del Departamento del Orden… es que puedo recordar que el Comité Disciplinario no es un grupo tan bueno como yo quisiera creer.\n\nY otra cosa \"buena\"… si sigo 'hablando' con esas cosas, mi cabeza se enciende en odio.\n\n¿Por qué eso sería bueno? Porque puedo ser honesta con mis emociones. Siento que vuelvo a ser yo."

 ## Leyes generales

 GEH_hina_corruption_law_civil_surveillance_act: "Ley de vigilancia ciudadana"
 GEH_hina_corruption_law_civil_surveillance_act_desc: "Para mantener la seguridad y el orden de Gehenna, se puede sacrificar cierta libertad. No tenemos una organización de vigilancia futurista perfecta como Millennium, pero instalaremos CCTV en todos los callejones, calles, carreteras, instituciones públicas y escuelas para atrapar a los criminales potenciales. Cueste lo que cueste."

 GEH_hina_corruption_law_violence_act: "Autorizar la reeducación forzada"
 GEH_hina_corruption_law_violence_act_desc: "Para atrapar a criminales potenciales que podrían estar afiliados a los nazis u otras organizaciones anti-gobierno, se autorizará el uso de la fuerza en los interrogatorios de sospechosos detenidos. Bueno… si es injusto, no debiste haber cometido un crimen, ¿no?"

 GEH_hina_corruption_law_special_religious_tax: "Impuesto especial religioso"
 GEH_hina_corruption_law_special_religious_tax_desc: "Como el catolicismo y el protestantismo son hostiles a los kivotosianos trasladados por la Gran Transferencia, debemos reducir su influencia. La población registrada como creyente pagará un pesado impuesto per cápita. No habrá forma de evitarlo."

 GEH_hina_corruption_law_no_zealot_law: "Reducir el armamento en tiempo de paz del Departamento del Orden"
 GEH_hina_corruption_law_no_zealot_law_desc: "El Departamento del Orden es una organización cuasi-militar separada del Departamento de Ejecución y está generando división interna en Gehenna. Y además, no puedo tolerar la violencia y los crímenes que esos tipos cometen usando mi nombre.\n\nAligerar y reducir el armamento en tiempo de paz puede impedir sus abusos contra los ciudadanos y, quizá, también lograr la unidad del Comité Disciplinario.\n\nEs mejor llevarse bien… que estar peleando, ¿no?"

 GEH_hina_corruption_law_sophisticated_judicial_system: "Respetar el sistema judicial local"
 GEH_hina_corruption_law_sophisticated_judicial_system_desc: "Antes de la Gran Transferencia, en Gehenna el Comité Disciplinario era la ley. No había juicios; los criminales acababan en la prisión subterránea del Comité Disciplinario según mis órdenes. Claro, en principio los criminales graves debían enviarse a la Agencia Correccional Valkyrie… pero eso no cambia que no existían juicios penales.\n\nAquí será mejor no hacerlo así. Ordenaré respetar el sistema judicial local y sus tres instancias, aunque sea un proceso largo y molesto."

 GEH_hina_corruption_law_esperanto: "Educación en esperanto"
 GEH_hina_corruption_law_esperanto_desc: "Para aprender la cultura local y facilitar una comunicación más eficiente entre pueblos con lenguas diferentes, incorporaremos el esperanto—la \"lengua internacional\" de la humanidad—al currículo regular y se enseñará a todos.\n\nPuede que no haya resultados inmediatos en esta generación, pero la siguiente se entenderá un poco mejor."

