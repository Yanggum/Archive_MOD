 ## Últimas decisiones de Hina (Baal)

 GEH_hina_corruption_last_decision_category: "Rebelión final"
 GEH_hina_corruption_last_decision_category_desc: "Nazis y comunistas han iniciado una §Yrebelión§! final. Esta revuelta reúne todas sus §Yúltimas fuerzas§!; si fracasan, no volverán a poder organizar una resistencia sistemática.\n\nEs hora de empezar la limpieza de Gehenna."

 GEH_hina_corruption_last_decision_attack_1: "Cercar ciudades clave"
 GEH_hina_corruption_last_decision_attack_1_desc: "No dejen a nadie con vida."

 GEH_hina_corruption_last_decision_attack_2: "Bombardeo masivo"
 GEH_hina_corruption_last_decision_attack_2_desc: "En el instante en que esa ciudad ocultó a fascistas o comunistas, todos sus habitantes se convirtieron en comunistas fascistas."

 ## Decisiones (unificación de Luxemburgo)

 GEH_luxembourg_negotiations_category: "Negociaciones de unificación [GEH.GetNameDef]-[HEU.GetNameDef]"
 GEH_luxembourg_negotiations_category_desc: "Tras la §YGran Transferencia§!, §YGehenna§! se ha dividido en tres grandes fuerzas políticas: la §OPandemonium Society§! como centro político, el §YComité Disciplinario de Gehenna§! como organización militar, y el §GGran Ducado de Luxemburgo§!, un Estado local donde los kivotosianos conservan la iniciativa política.\n\nRikuhachima Aru no tenía ni antes ni después de la Gran Transferencia interés en controlar Gehenna; solo desea la paz de Luxemburgo. Esto se ha mantenido incluso después de que Pandemonium huyera a la ciudad de Luxemburgo durante la guerra contra el §RInstituto General Trinity§!, y de que el gobierno luxemburgués ocupara el distrito central de Gehenna.\n\nPor ello, el bando de [ROOT.GetLeader] está evaluando con extrema cautela la posibilidad de una §Punificación pacífica de Gehenna§!. Si garantizamos la autonomía del Gran Ducado de Luxemburgo y le permitimos seguir sosteniendo sus convicciones idealistas, quizá sea posible que [ROOT.GetNameDef] y Luxemburgo se conviertan en uno."

 GEH_luxembourg_negotiations: "Conferencia conjunta de unificación de Gehenna"

 ## Decisiones (¡amistad! iaeaeae)
 prefect_team_decolonisation_decision_category: "Administración de nuevos territorios liderada por [ROOT.GetNameDef]"
 prefect_team_decolonisation_decision_category_desc: "[prefect_team_decolonisation_decision_category_desc_text]"

 prefect_team_decolonisation_decision_category_desc_ako: "¡Oh, dulce libertad! ¡Por la democracia! El gobierno de [ROOT.GetLeader] ha combatido a fuerzas fascistas extranjeras para difundir la §Ydemocracia controlada§! libre, y el gobierno de [ROOT.GetNameDef] tiene el deber de acogerlos no como oprimidos, sino como naciones hermanas.\n\nEstamos discutiendo la creación de nuevos gobiernos civiles en las regiones ocupadas para construir Estados colaboradores de democracia controlada. Esto no es una guerra por simple expansión territorial, sino para difundir el orden de [ROOT.GetLeader] y de §YGehenna§!, permitiéndoles disfrutar de una libertad más correcta bajo un orden seguro y una democracia adecuadamente controlada."

 prefect_team_decolonisation_decision_category_desc_hina: "La política expansionista del gobierno de [ROOT.GetNameDef] continúa, y la violencia de los fanáticos sorazakistas en los territorios ocupados se está volviendo cada vez más difícil de controlar. Siguiendo la voluntad de [ROOT.GetLeader], estamos discutiendo la construcción de un Comisariado del Reich para administrar los territorios ocupados.\n\nEsto no es para controlarlos por la fuerza ni para reprimir su libertad. Los locales son excesivamente débiles en comparación con Kivotos, y necesitan tiempo para ser §Yguiados§! bajo las correctas enseñanzas de la gran Líder y guía Sorazaki Hina. Bajo varias décadas de gobierno benévolo, olvidarán sus antiguos valores y aprenderán a obedecer bajo el correcto §Yorden§!."

 prefect_team_decolonisation_decision_category_desc_iori: "La política expansionista del gobierno de [ROOT.GetNameDef] continúa, y la resistencia en los territorios ocupados se está volviendo cada vez más difícil de controlar. Siguiendo la voluntad de [ROOT.GetLeader], estamos discutiendo la construcción de un Comisariado del Reich para administrar los territorios ocupados.\n\nEsto no es porque seamos sádicos que disfrutan maltratándolos. El espíritu del Comité Disciplinario de Gehenna es el orden y la disciplina, y los locales son demasiado caóticos para establecer por sí mismos orden y disciplina. Igual que la Pandemonium Society.\n\nQueremos darles tiempo para ser §Yguiados§! bajo el orden correcto del Comité Disciplinario. Bajo varias décadas de gobierno benévolo, olvidarán sus antiguos valores y aprenderán a obedecer bajo el correcto §Yorden§!."

 prefect_team_decolonisation_decision_category_desc_generic: "La política expansionista del gobierno de [ROOT.GetNameDef] continúa, y la resistencia en los territorios ocupados se está volviendo cada vez más difícil de controlar. Siguiendo la voluntad de [ROOT.GetLeader], estamos discutiendo la creación de Estados federados para administrar los territorios ocupados.\n\nGobernadores enviados desde Kivotos los administrarán, y les enseñaremos a fondo qué es la §Yverdadera libertad§! que se puede disfrutar bajo control, a esos que son caóticos como la §YPandemonium Society§!."

 prefect_team_decolonisation_decision_LP1: "Fundar [LP1.GetNameDef]"
 prefect_team_decolonisation_decision_LP1_desc: "Esta región es muy distinta del resto de Francia. Hay muchos franceses viviendo allí, pero al mismo tiempo es un territorio que, tras la Gran Transferencia, ha sido \"mileniumizado\".\n\nNo podemos arrebatarles París a los franceses, ni arrebatarles el campus de Millennium a los milenianos. Bajo el orden correcto del Comité Disciplinario, los guiaremos para que Millennium y Francia puedan establecer un gobierno autónomo en igualdad de condiciones."
