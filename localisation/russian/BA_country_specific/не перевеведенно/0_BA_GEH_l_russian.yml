 GEH_Armed_Neutrality_desc: "La Academia Gehenna ha declarado neutralidad para reparar los daños de la guerra civil."
 GEH_popular_support_desc: "Aunque la rivalidad entre el Pandemonium Society y el Comité Disciplinario era bien conocida, según la ley organizativa de la academia, el Comité Disciplinario no era más que un órgano subordinado del Pandemonium Society.\nTras la Gran Transferencia, el Comité escapó de facto de todo control del Pandemonium y construyó un gobierno independiente, pero nuestra legitimidad sufrió un duro golpe.\nSi alguien pregunta en qué se diferencia una fuerza militar que desobedece al gobierno central de un “señor de la guerra”, ¿qué deberíamos responder?\n\nAl final, para que el Comité Disciplinario de Gehenna sea reconocido como la autoridad legítima de la Academia Gehenna, debemos esforzarnos por obtener legitimidad: lograr que las estudiantes de Gehenna admitan que somos una organización mejor que ellos."
