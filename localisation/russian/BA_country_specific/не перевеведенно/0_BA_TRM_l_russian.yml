 TRM_war_with_the_ussr: "Красные сумерки"
 TRM_war_with_the_ussr_desc: "[SOV.GetAdjective] — это существование, представляющее огромную угрозу для мира. Это сила террора, целью которой является распространение коммунизма по всей планете. Поэтому наши вооружённые силы должны атаковать их и спасти мир от лап коммунизма."
