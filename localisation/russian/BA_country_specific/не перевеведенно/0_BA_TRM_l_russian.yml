 TRN_yungu_e_tuja: "Поддержать Библиотечный комитет"
 TRM_Library_Committee: "Усилить сотрудничество с Библиотечным комитетом"
 TRM_Library_Committee_desc: "Усилить сотрудничество с Библиотечным комитетом"
