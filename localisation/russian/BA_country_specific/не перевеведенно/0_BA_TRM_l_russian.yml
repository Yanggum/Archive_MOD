 TRN_after_war_event.20.t: "Учреждение Военно-гражданской администрации"
 TRN_after_war_event.20.desc: "Военно-гражданская администрация — это административная система, созданная Тринити для полного подчинения академии Генны своему контролю, и обладает широкими полномочиями, от судебной власти до администрации. Эта система способствует поддержанию порядка в регионе Генны и укреплению влияния Тринити, но в то же время вызывает побочные эффекты, подавляя свободу и автономию студенток. Это вызывает сильную реакцию и недовольство среди студенток Генны.\n\nСтудентки Генны выражают своё сопротивление господству Тринити различными способами. Среди них есть крайние методы, такие как угрозы бюрократам или теракты, направленные на административные учреждения. Эти акции сопротивления широко распространились среди студенток Генны, проявляясь как прямое выражение враждебности к системе.\n\nОперативная группа правосудия Тринити постоянно пытается подавить эту ситуацию. От обнаружения террористических актов до арестов и немедленного задержания процесс идёт быстро, но сопротивление не угасает; напротив, кажется, что оно становится всё более организованным.\n\nВ настоящее время система Военно-гражданской администрации ориентирована на стабильность и контроль, но если конфликт со студентками Генны не будет разрешён, постоянные столкновения кажутся неизбежными."
 TRN_after_war_event.20.a: "Попытаемся решить это как можно скорее."
 TRN_after_war_event.21.t: "Назначение военного губернатора"
 TRN_after_war_event.21.desc: "Военно-гражданская администрация Генны была учреждена. Однако, столкнувшись с неожиданным сопротивлением, мы пришли к выводу, что, если это не будет исключительно компетентный чиновник, будет трудно преодолеть это движение. В результате были отобраны две кандидатки.\n\nПервая — Ханэкава Хасуми из Оперативной группы правосудия. Ей была доверена ключевая должность из-за её враждебного отношения к Генне и отличных административных способностей; её оценивают как практичную фигуру, не проявляющую особых амбиций к власти. Хотя она враждебна к Генне, в официальной сфере она проявляет уважение к другой стороне, поэтому её признают уравновешенным администратором.\n\nВторая — Моридзуки Судзуми, принадлежащая к местным дозорным. Хотя она далека от административной работы, она привлекла внимание своей практической деятельностью, такой как регулярное патрулирование для поддержания общественного порядка в Тринити, поэтому её рекомендовали как подходящего человека для подавления акций сопротивления студенток Генны. Также было подтверждено, что Судзуми не проявляет особых амбиций к власти."
 TRN_after_war_event.21.a: "Ханэкава Хасуми. Её административным способностям можно доверять."
 TRN_after_war_event.21.b: "Моридзуки Судзуми. Её дозорная работа будет полезна."
 TRN_after_war_event.22.t: "Хасуми, удовлетворена"
 TRN_after_war_event.22.desc: "Ханэкава Хасуми, по-видимому, испытывает большое удовлетворение от назначения военным губернатором Военно-гражданской администрации Генны. Она с очень довольным выражением ответила на просьбу об интервью репортёра газеты Тринити, и новость была опубликована на первой полосе. Правительственные чиновники поздравили её с назначением, но Кендзаки Цуруги промолчала по этому поводу. Учитывая её обычную позицию политического нейтралитета, это не особенно удивительно.\n\nОднако также раздались голоса обеспокоенности тем, не расширяется ли влияние Оперативной группы правосудия чрезмерно."
 TRN_after_war_event.22.a: "В любом случае, будем надеяться, что она хорошо справится со своей работой."
 TRN_after_war_event.23.t: "Судзуми, не удовлетворена"
 TRN_after_war_event.23.desc: "Моридзуки Судзуми заявила, что почувствовала глубокое отвращение и дискомфорт от того, что её выбрали военным губернатором Военно-гражданской администрации Генны. Она прямо сообщила об этом во время интервью репортёру газеты Тринити.\n\nСудзуми дважды отказывалась от интервью, но на третий раз согласилась и откровенно выразила свои истинные чувства.\n\nКендзаки Цуруги из Оперативной группы правосудия передала через СМИ сообщение о сожалении. Тот факт, что та, кто обычно хранила молчание по поводу всех инцидентов, необычно выразила свою позицию, считается изменением, заслуживающим внимания."
 TRN_after_war_event.24.t: "Комитет национального спасения за мир и порядок"
 TRN_after_war_event.24.desc: "Пока мы продолжали управлять оккупированными территориями Генны, центральное правительство Тринити связалось со специальной организацией. Комитет национального спасения за мир и порядок — это группа, созданная для поддержания безопасности и верховенства закона после того, как война между Тринити и Генной закончилась, в условиях, когда Студенческий совет Генны, Общество Пандемониум, был практически демонтирован. Председатель комитета — Химуро Сена, и, поскольку большинство его членов происходит из Департамента неотложной медицины, похоже, этот департамент фактически решил сотрудничать с Тринити."
 TRN_after_war_event.24.a: "Будем сотрудничать с ними"
 TRN_after_war_event.25.t: "Теракт в Генне!"
 TRN_after_war_event.25.desc: "Произошёл инцидент, в котором студентка, принадлежащая к Тринити, случайно бросила взрывчатку в гражданских лиц Генны, совершив террористический акт. Оперативная группа правосудия быстро отреагировала и смогла обезвредить студентку, но пострадавшие студентки Генны отреагировали жёстко и требуют компенсации."
 TRN_after_war_event.25.a: "Компенсировать ущерб по минимуму."
 TRN_after_war_event.25.b: "Компенсировать весь ущерб."
 TRN_after_war_event.26.t: "Столкновение в регионе Генны"
 TRN_after_war_event.26.desc: "В Генне вспыхнула очередная перестрелка. Этот инцидент начался, когда партизаны, принадлежащие к Альянсу студенческого сопротивления, устроили засаду на военный конвой Тринити.\n\nСепаратистские силы, в основном бывшие члены армии Генны, атаковали конвой с относительно сложной тактикой. Они заблокировали путь конвоя — состоящего из грузовиков и бронетранспортёров — и смогли захватить значительное количество вооружения. Однако Тринити усилил бдительность, и в следующий раз это не повторится."
 TRN_after_war_event.26.a: "Чёрт возьми..."
 TRN_after_war_event.27.t: "Массовые протесты в Генне"
 TRN_after_war_event.27.desc: "Не все студентки Генны участвуют в протестах, но большая часть питает сильную враждебность к Эдему. Эти чувства ещё более усугубляются действиями Оперативной группы правосудия и сухопутных войск Тринити, время от времени выплескиваясь в форме протестов и забастовок.\n\nПосле недавнего несправедливого ареста в Генне возникла новая волна демонстраций. Протестующие вышли на улицы, требуя прекращения полицейского насилия и уважения своих политических прав."
 TRN_after_war_event.27.a: "Не допустим эскалации конфликта."
 TRN_after_war_event.27.b: "Арестовать их!"
 TRN_after_war_event.28.t: "Движение ненасильственного сопротивления по всей Генне"
 TRN_after_war_event.28.desc: "Многочисленные антисистемные диссиденты Генны вышли на улицы с плакатами, блокируя дороги и повышая голос. Они требуют смягчения правовых реформ, расширения автономии Генны и даже независимости академии."
 TRN_after_war_event.28.a: "Удовлетворить некоторые требования."
 TRN_after_war_event.28.b: "Разогнать силой."
 TRN_after_war_event.28.c: "Игнорировать."
 TRN_after_war_event.29.t: "Социалистическая агитация"
 TRN_after_war_event.29.desc: "В мире, где существует Коминтерн, неудивительно, что социалистическая риторика проникает в движение сопротивления Генны.\n\nВ настоящее время Коминтерн активно подстрекает к сопротивлению против «оккупационных сил Тринити», чтобы способствовать социалистической революции в Генне. Контрабандное оружие из социалистических государств передаётся студенткам Генны, и социалистические организации также начинают появляться. Это уже не возможность: это становится реальностью."
 TRN_after_war_event.29.a: "Проклятые коммунисты."
 TRN_after_war_event.30.t: "Нападение на военного губернатора!"
 TRN_after_war_event.30.desc: "Сегодня поступило сообщение, что военный губернатор был ранен в результате нападения во время инспекционной поездки в Ганновере. Было установлено, что преступником была студентка, принадлежащая к Альянсу студенческого сопротивления Генны, действовавшая в одиночку."
 TRN_after_war_event.30.a: "Это серьёзный инцидент."
 TRN_after_war_event.40.t: "[FROM.GetAdjective] требует возврата территорий"
 TRN_after_war_event.40.desc: "[FROM.GetLeader], лидер [FROM.GetName], отправил официальное уведомление с требованием возврата территорий Генны. Поскольку недавно [FROM.GetAdjective] провозгласила территориальную целостность над землями Генны, весьма вероятно, что это требование связано с этим."
 TRN_after_war_event.40.a: "Примите их требования."
 TRN_after_war_event.40.b: "Этот регион принадлежит [ROOT.GetAdjective]!"
 TRN_after_war_event.41.t: "[FROM.GetAdjective] вернул территории Генны"
 TRN_after_war_event.41.desc: "[FROM.GetAdjective] принял наши требования и решил вернуть территории Генны. Похоже, это попытка ослабить дипломатическую напряжённость и улучшить отношения между обеими сторонами."
 TRN_after_war_event.41.a: "Дипломатическая победа!"
 TRN_after_war_event.42.t: "[FROM.GetAdjective] отклонил наши требования!"
 TRN_after_war_event.42.desc: "[FROM.GetAdjective] вежливо отклонил наши требования и заявил, что, основываясь на своих претензиях на суверенитет над территориями Генны, он не может принять притязания [ROOT.GetAdjective]."
 TRN_after_war_event.42.a: "Тогда остаётся только война."
