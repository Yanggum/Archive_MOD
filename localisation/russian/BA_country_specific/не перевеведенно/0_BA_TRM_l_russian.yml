 TRN_idk_polish_getout_desc: "Глупые поляки всё ещё жаждут нашей территории. Настало время скорректировать их высокомерие."
 TRN_communists_getout_desc: "Демоны с севера и востока планируют разорвать наш флаг, чтобы поднять свой. Их нужно устранить первыми."
 TRN_first_we_need_practice_desc: "Генна теперь наш друг. Это значит, что у нас больше друзей и больше дней для совместного веселья."
 TRN_second_testing_for_united_safety_desc: "Ополчение Тринити и отряд префектуры Генны работают вместе, чтобы защитить союз. Благодаря этому союз безопаснее, чем когда-либо."
 TRN_the_united_academy_desc: "Рай для всех"
 TRN_french_with_union_desc: "Примирить французов"
 TRN_valkyrie_oifen_claim_desc: "Претендовать на Эйпен-Мальмеди"
 TRN_the_nice_best_polish_plan_desc: "Следовать прецеденту"
 TRN_the_greates_anti_communists_movement_desc: "Вычистить красных"
 TRN_danish_movement_desc: "Освободиться от красных"
 TRN_shalle_protect_in_trinity_desc: "Защитить Шалэ"
 TRN_68_go_back_to_gehenna_desc: "Агентство 68, хотя и часть Генны, действовало само по себе, не присоединяясь к союзу. Их нужно подчинить силой, если потребуется."
 TRN_war_with_knight_templar_desc: "Рыцари-тамплиеры"
 TRN_bbul_evils_nomore_desc: "Академия Абидос пережила большие трудности. Выжить в одиночку сложно, поэтому мы предложим им свою защиту."
 TRN_sisterhood_army_desc: "Унаследовать Сестринство"
 TRN_relief_knights_army_desc: "Матери фронта"
 TRN_Have_hand_to_gehhenna_desc: "Проблема Генны"
 TRN_Recovering_aftermath_desc: "Сотрудничать с предприятиями"
 TRN_Contract_with_Mauser_desc: "Немецкая промышленная технология специально разработана для строительства крупномасштабных военных заводов. Для Тринити это большое преимущество, которое мы должны использовать."
 TRN_the_situation_of_the_trinity: "Общая ситуация в Академии"
 TRN_the_situation_of_the_trinity_desc: ""

 TRN_trinitarian_factionalism_flag: "§Y$TRN_trinitarian_factionalism$§! фокус завершён"
 TRN_trinitarian_factionalism: "Фракционность в Тринити"
 TRN_trinitarian_factionalism_desc: "Многочисленные фракции внутри Тринити могут быть нам полезны в долгосрочной перспективе, если мы будем правильно ими управлять."
 TRN_return_of_yuriy_seya: "Возвращение Юриёно Сейи"
 TRN_return_to_host_position: "Возвращение на пост Хозяйки"
 TRN_suppressing_anti_trinity_forces: "Изгнать анти-Тринити силы"
 TRN_vision_for_the_future: "Видение будущего"
 TRN_restoration_of_the_sanctus_faction: "Восстановить фракцию Санктус"
 TRN_support_for_the_sisterhood: "Поддержать Сестринство"
 TRN_strengthening_the_filians_faction: "Усилить фракцию Филиус"
 TRN_support_for_the_johannine_faction: "Поддержать фракцию Иоанна"
 TRN_the_sword_guarding_the_trinity: "Меч, охраняющий Тринити"
 TRN_the_balance: "Баланс фракций"
 TRN_restructuring_of_the_paters: "Восстановить фракцию Патер"
 TRN_defensive_nationalism: "Оборонительный национализм"



 TRN_KRUPP_steel_desc: "Крупп была немецкой компанией, известной своей сталелитейной и оружейной промышленностью. В частности, их артиллерийская технология была чрезвычайно передовой, и большинство орудий, используемых немецкой армией, производились ими. Поэтому, если мы предоставим им субсидии и будем полностью сотрудничать, они, вероятно, смогут производить высококачественную продукцию, соответствующую нашим инвестициям."
 TRN_Siemens_grant_desc: "Последствия Великого Перемещения оставили множество искалеченных дорог и железных дорог. Мы мобилизуем возможности Тринити, чтобы полностью восстановить эту жизненно важную инфраструктуру."
 TRN_Autobahn_desc: "Строительство Автобана"
 TRN_KRUPP_ZIP_III_desc: "ZIP"
 TRN_military_industrial_complex_desc: "Чтобы быстро усилить наши военные возможности, правительство будет тесно сотрудничать с оборонной промышленностью для производства военной техники более эффективно и быстро. Для этого мы расширим поддержку оборонной промышленности, оптимизируем производственные процессы и сосредоточимся на технологическом развитии."
 TRN_Recovering_the_aftermath_desc: "Оправиться от последствий"
 TRN_yurijono_seia_ser: "Расследование"
 TRN_yurijono_seia_ser_desc: "Покушение на Юриёно Сейю было достаточно серьёзным, чтобы потрясти Чайную вечеринку и Тринити: это первый раз в истории, когда на члена Чайной вечеринки было совершено нападение. Этот инцидент нельзя просто замять, поэтому мы мобилизуем полицию Тринити, чтобы найти виновного."
 TRM_TURIJONO_SEIA_TT: "§LМы активизируем расследования, чтобы найти виновного.§!\nЕсли §YКирифудзи Нагиса§! не является хозяйкой Чайной вечеринки, она становится хозяйкой."
 TRM_JoJo_mika: "Ликвидация Гейдриха"
 TRM_JoJo_mika_desc: "Департамент юстиции Тринити в ходе контактов с НСДАП получил доступ к некоторым ранее неизвестным секретам. Они раскрыли правду о покушении на Юриёно Сейю: за ним стоял Рейнхард Гейдрих, которого мы считали союзником."
 TRN_yurijono_seia: "Серьёзная проблема"
 TRN_yurijono_seia_desc: "Произошёл крупный инцидент: на Юриёно Сейю напали, и теперь она находится в коме, в больнице."
 TRN_threat_up_of_europa: "Напряжённость в Европе"
 TRN_threat_up_of_europa_desc: "Напряжённость в Европе"
 TRN_trinity_arius_gaebal: "Интеграция Ариуса"
 TRN_trinity_arius_gaebal_desc: "Интеграция Ариуса"
 TRN_totar_war_focus: "Тотальная мобилизация"
 TRN_totar_war_focus_desc: "Тотальная мобилизация"
 TRM_domination: "Доминирование"
 TRM_domination_desc: "Доминирование"
 TRN_justice_task_force_training: "Милитаризм Тринити"
 TRN_justice_task_force_training_desc: "Милитаризм Тринити"
 TRN_radio_propaganda: "Промывание мозгов через радио"
 TRN_radio_propaganda_desc: "Промывание мозгов через радио"
 TRN_kickstart_the_civilian_industry: "Тяжёлая промышленность"
 TRN_kickstart_the_civilian_industry_desc: "Чтобы оправиться от внутренних проблем или подготовиться к внешним угрозам, необходима реорганизация инфраструктуры тяжёлой промышленности."
 TRN_kickstart_the_autoban: "Строительство автострады"
 TRN_kickstart_the_autoban_desc: "Хорошо организованная автострада полезна для транспортировки и снабжения войск и припасов. Этот план, известный среди участников как «Автобан Тринити», предусматривает большую автостраду, соединяющую Тюрингию с Гдыней."
 TRN_civilian_industry: "Инвестиции в промышленность"
 TRN_civilian_industry_desc: "Чтобы повысить качество и количество армии и удовлетворить её потребности в поставках, мы должны сначала инвестировать в промышленность, чтобы обеспечить адекватное снабжение."
 TRN_research_slot: "Расширение лабораторий"
 TRN_research_slot_desc: "Прошло время с тех пор, как мы преодолели экономический ущерб. Теперь мы должны обновить и расширить наши лаборатории, чтобы наверстать упущенное в науке и технологиях."
 TRN_Luftwaffe: "Интеграция люфтваффе"
 TRN_Luftwaffe_desc: "Мы объединим цепи командования Военно-воздушных сил Тринити и люфтваффе, чтобы реорганизовать более эффективное воздушное командование."
 TRN_railway_focus: "Железнодорожный проект Тринити"
 TRN_railway_focus_desc: "В Германии всё ещё остаётся много железнодорожных путей, разрушенных последствиями Великого Перемещения. Мы создадим и будем поддерживать железнодорожные компании, чтобы успокоить жалобы немцев и отвлечь их внимание."
 TRN_sipjagunjeongsinbuhwal: "Орден рыцарей-тамплиеров" 
 TRN_sipjagunjeongsinbuhwal_desc: "Орден рыцарей-тамплиеров"
 TRN_gisauihon: "Дух рыцаря"
 TRN_gisauihon_desc: "Дух рыцаря"
 TRM_naechi: "Управление внутренними проблемами"
 TRM_naechi_desc: "Растущая внутренняя напряжённость в академии после Великого Перемещения ясно даёт понять, что существует группа, замышляющая против Мисоно Мики и всего Тринити. Мы должны арестовать и допросить некоторых заговорщиков, чтобы найти организацию и искоренить этот заговор, прежде чем он распространится как рак."
 TRM_oetzi: "Реструктуризация внешней политики [TRM.GetAdjective]"
 TRM_oetzi_desc: "Традиционная внешняя политика Тринити была сосредоточена на посредничестве в конфликтах между соседними академиями и стабилизации отношений с академиями Кивотоса. Эта система компромиссов была идеалистичной, но кризис Великого Перемещения выявил её пределы. С момента прихода к власти Мисоно Мики эта система становилась всё более неэффективной. Пришло время отказаться от этой слабой политики и заменить её более сильным и реалистичным направлением."
 TRN_railway_gun_focus: "Развёртывание железнодорожных орудий"
 TRN_railway_gun_focus_desc: "С появлением бомбардировщиков многие железнодорожные орудия покрылись пылью на складах. Хотя некоторые эксперты говорят, что их время прошло, в Европе, не опустошённой Великим Перемещением, железнодорожные орудия всё ещё могут быть эффективным средством уничтожения."
 TRN_GO_TO_EAST: "Экспансия на восток"
 TRN_GO_TO_EAST_desc: "Мы идём на Советский Союз!"
 TRN_Uranprojekt: "Уранпроект"
 TRN_Uranprojekt_desc: "Один из химиков, открывших ядерное деление, Отто Ган, руководил Уранпроектом. Если мы наймём его и вложим больше бюджета для выполнения второй фазы Уранпроекта, мы сможем завершить ядерное оружие раньше любой другой нации."
 TRN_Fission: "Наблюдение за ядерным делением"
 TRN_Fission_desc: "В стране, существовавшей до нас, Германии, существовал проект под названием «Уранпроект» по разработке ядерного оружия. Если мы используем это, мы сможем создать чудо-оружие для господства над миром."
 TRN_Fission_tt: "§YЯдерное деление§! наблюдается. §YРуководство§! примет решение."
 TRM_OTTO_HAN_EVENT: "§YЯдерное деление§! наблюдается"
 TRN_Uranprojekt_name: "Уранпроект"
 TRN_Uranprojekt_2: "Строительство реактора"
 TRN_Uranprojekt_2_desc: "Для измерения критической массы, необходимой для ядерной реакции, строительство реактора обязательно. Мы приступим к его строительству, чтобы обеспечить эффективные эксперименты."
 TRN_Uranprojekt_3: "Ослепительная вспышка"
 TRN_Uranprojekt_3_desc: "В лаборатории доктора Отто Гана и его команды физиков-ядерщиков наблюдалась ослепительная вспышка. Это явление указывает на то, что их эксперимент успешно завершён и что скоро родится оружие, способное закончить войну."
 TRN_Uranprojekt_4: "Исследование снарядов"
 TRN_Uranprojekt_4_desc: "С проведением ядерных испытаний возникает также необходимость в разработке устройства для запуска этого нового оружия."
 TRN_Uranprojekt_5: "Испытание Тринити"
 TRN_Otto_han_tt: "§YОтто Ган§! становится советником."
 TRN_Ausgleich: "Великий компромисс"
 TRN_Ausgleich_desc: "Великий компромисс"
 TRN_united_state_Eden: "Соединённые Штаты Эдема"
 TRN_united_state_Eden_desc: "Соединённые Штаты Эдема"
 TRN_Eden_union: "Эдемский союз"
 TRN_Eden_union_desc: "Эдемский союз"
 TRN_jachiejeopgeun: "Доступ к автономии"
 TRN_seondobuwageorae: "Соглашение с Руководящим бюро"
 TRN_dongari_tonghap: "Объединение клубов"
 TRN_ireumppuni_anin_yeonbang: "Союз не только по названию"
 TRN_oebureulhyanghayeo: "Вовне"
 TRM_Trinity_socialism: "Тринитарный социализм"
 TRM_Trinity_socialism_desc: "Студентки Тринити — не злонамеренные анархистки, а социалистки по сути благодаря общинному сознанию, дисциплине, производительности и личной жертве ради блага государства. Мы должны принять это как идеологию нового режима. В новом Тринити как предприятия, так и рабочие будут трудиться ради общей выгоды."
 TRN_Reichland_Solution: "Решение Тринити"
 TRN_Reichland_Solution_desc: "Чтобы полностью устранить политическое вмешательство клубов и использовать на 100% ресурсы этих групп, мы распустим все клубы и реструктурируем их под властью Чайной вечеринки."
 TRM_Trinity_Supremacy: "Превосходство Тринити"
 TRM_Trinity_Supremacy_desc: "Неопределённости режима компромиссов усилили сомнения в нашей внешней политике. После катаклизма они взорвались как бомба. Пришло время признать провал идеализма и восстановить превосходство Тринити."
 TRM_war_preparations: "Военные приготовления"
 TRM_war_preparations_desc: "Провозглашение нашего превосходства повысило напряжённость с соседями. Мы должны пересмотреть наши силы, увеличить запасы и подготовить всё к войне. Когда раздадутся выстрелы, эти усилия нам пригодятся."
 TRM_reorganize_secret_services: "Служба безопасности Тринити"
 TRM_reorganize_secret_services_desc: ""
 TRM_southern_offensive: "Южное наступление"
 TRM_southern_offensive_desc: "На юге есть младшие академии, такие как [ABY.GetAdjective] и [HYA.GetAdjective], настоящие бомбы замедленного действия. Мы не можем позволить времени взорвать их или бесконечно ждать мирных перемен."
 TRM_SANHAIJING_offensive: "Война против [SHA.GetAdjective]"
 TRM_SANHAIJING_offensive_desc: "Мы предназначены объединить немцев. Многие австрийские немцы жаждут нашего вмешательства и объединения. Хотя не все этого желают, мы должны вторгнуться, чтобы выполнить эту великую судьбу."
 TRM_SMO_for_Abydos: "Вторжение в Абидос"
 TRM_SMO_for_Abydos_desc: "Будем честны: Абидос — это младшая академия всего с пятью студентками. Что они могут сделать? Мы захватим их территорию силой."
 TRM_demand_ostrava: "Требовать [74.GetName]"
 TRM_demand_ostrava_desc: "[74.GetName] является домом для многих немцев, угнетаемых Хяккияко. Мы обязаны интегрировать и защитить их. Мы потребуем их объединения законными средствами."
 TRM_form_Shanhaijing_Eden_axis: "Пакт Шаньхайцзин-Тринити"
 TRM_form_Shanhaijing_Eden_axis_desc: "Шаньхайцзин — одно из немногих государств Кивотоса, принявших фашизм, что делает его естественным стратегическим союзником для Тринити."
 TRM_form_Rome_Eden_axis: "Альянс с [ITA.GetAdjective]"
 TRM_form_Rome_Eden_axis_desc: "[ITA.GetLeader] из [ITA.GetAdjective] считается изначальным создателем фашизма, почти первобытным богом. Союз с ним укрепит нашу легитимность и воодушевит наш народ."
 TRM_Wehrmacht_absorption: "Поглощение вермахта"
 TRM_Wehrmacht_absorption_desc: "Вермахт ещё не полностью демонтирован и продолжает создавать проблемы. Вместо того чтобы отвергать его, мы интегрируем его в наши сухопутные войска, вдохновляя его лояльность и используя для пропаганды."
 TRM_bribe_senior_officers: "Подкупить старших офицеров"
 TRM_bribe_senior_officers_desc: "Хотя многие солдаты вермахта уже в наших рядах, не хватает офицеров для их командования. Поскольку большинство из них имеют капиталистические наклонности, мы можем привлечь их, предлагая экономические стимулы."
 TRM_Anti_Gehenna_Pro_Geramny: "Анти-Генна и прогерманский"
 TRM_Anti_Gehenna_Pro_Geramny_desc: "Мы должны дать понять, что наша цель — демоны Генны, а не немцы. Так мы сможем посеять беспокойство среди немцев Генны и заручиться их поддержкой, когда нападём."
 TRM_invasion_of_devils: "Демоническое вторжение"
 TRM_invasion_of_devils_desc: "Случилось страшное: Генна напала на нас. Мы должны немедленно готовиться к войне."
 TRM_war_with_gehenna: "Специальная военная операция"
 TRM_war_with_gehenna_desc: "Генна долгое время была враждебна, и её провокации невыносимы. Под предлогом «специальной военной операции» мы нападём на неё и переформируем её правительство."
 TRM_invade_benelux: "Вернуть контроль над [35.GetCapitalVictoryPointName]"
 TRM_influence_the_benelux: "Новые друзья-фашисты"
 TRM_fate_of_slovakia: "Судьба Словакии"
 TRM_balkan_seeking_collaborators: "Искать коллаборационистов на Балканах"
