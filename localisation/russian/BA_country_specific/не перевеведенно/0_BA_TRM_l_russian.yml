 TRM_collapse_1_desc: "Внутри Тринити существует борьба за власть, но обычные студентки ведут свою школьную жизнь без особых проблем."
 TRM_Trinity_Grande_Armee: "Великая армия Тринити"
 TRM_Trinity_Grande_Armee_desc: "По мере того как Тринити вёл бесчисленные войны, увеличилось количество солдат с большим боевым опытом. Этот опыт превратился в отличное учебное пособие, и на основе этих пособий в Тринити появились профессиональные солдаты и специализированные офицеры.\n\nВ то время как Тринити утверждался как окончательный победитель и укреплял свою гегемонию над Европой, Великая армия не переставала развиваться. Благодаря постоянным развёртываниям и вмешательствам она накопила опыт и различную информацию, а также обзавелась специализированными учебными центрами.\n\nВеликая армия — это истинный источник силы Тринити, группа, которая привела Тринити к победе. Кто бы что ни говорил, её мощь и неуклонный прогресс — факты, которые никто не может отрицать."
