 TRN_gunsu_sangsan_bub: "Закон о военном производстве"
 TRN_jaegun_wanryu: "Промышленный бум"
 TRN_gwanryuje_jaijungbee_desc: "В процессе захвата власти Мисоно Микой многие опытные бюрократы Тринити были уволены. В результате нынешняя бюрократия неопытна и неэффективна. Чтобы исправить эти недостатки, необходима систематическая и глубокая реорганизация администрации."
 TRN_yungu_e_tuja_desc: "Поддержать Библиотечный комитет"
 TRN_gyungje_hyu_ul_bub_desc: "Введение плановой экономики укрепляет эффективность министерств за счёт чёткого распределения ресурсов и определённых целей, улучшая производительность и согласованность системы."
 TRN_gunsu_sangsan_bub_desc: "Закон о военном производстве направлен на восстановление сокращённой военной промышленности и создание эффективной и устойчивой структуры производства путём сотрудничества с бюрократией и немецкими министрами."
 TRN_jaegun_wanryu_desc: "Промышленный бум"
 TRN_nagisa_gyehek: "Нерешаемая проблема"
 TRN_nagisa_gyehek_desc: "Кирифудзи Нагиса применит всё своё политическое мастерство, чтобы удержать Чайную вечеринку и Тринити на плаву, закаляясь как железная женщина и продолжая своё жёсткое правление."
