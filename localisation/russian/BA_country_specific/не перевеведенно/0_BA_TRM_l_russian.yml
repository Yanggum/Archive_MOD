 TRM_anti_gehenna_focus_1: "Сокрушить сопротивление"
 TRM_anti_gehenna_focus_1_desc: "Организованные партизанские действия студенток Генны стали серьёзной угрозой для правительства. Чтобы сокрушить их, мы развернём войска в каждом регионе и атакуем их основные опорные пункты. С помощью точного сбора разведданных и решительных военных операций мы демонтируем их организацию и быстро положим конец хаосу."
 TRM_anti_gehenna_focus_2: "Устранить сопротивление Генны"
 TRM_anti_gehenna_focus_2_desc: "Студентки Академии Генна, если смотреть позитивно, — свободные души; но если негативно — террористы, угрожающие системе. После поражения их академии они всё ещё не принимают результат и действуют как сопротивление против Тринити. Теперь мы должны полностью их устранить и стабилизировать систему."
 TRM_anti_gehenna_focus_3: "Установить военные правительства"
 TRM_anti_gehenna_focus_3_desc: "Партизанские действия студенток Генны продолжаются, отвергая контроль правительства и сопротивляясь в каждом регионе. Чтобы подавить их, эффективно навязывать военные правительства в оккупированных зонах. Решительное применение военной силы позволит быстро подавить партизан и восстановить правительственную власть."
