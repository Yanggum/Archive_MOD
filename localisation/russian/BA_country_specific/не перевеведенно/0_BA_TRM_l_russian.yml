 TRM_Trinity_Redwinter_Pact_desc: "Подписание дружественного пакта о ненападении с [RED.GetAdjective] может показаться противоречащим нашей текущей политике, но потенциальные выгоды оправдывают это. Кроме того, если разразится война против Генны, мы смягчим угрозу конфликта с [RED.GetAdjective], минимизируя их вмешательство в нашу будущую политику."
 TRM_alliance_with_the_redwinter: "Зловещий альянс"
 TRM_alliance_with_the_redwinter_desc: "Возможно, мы сможем отложить в сторону идеологические разногласия с [RED.GetAdjective] и подчеркнуть нашу общую ненависть к деградировавшим и устаревшим государствам Кивотоса и всему миру. Союз с [RED.GetAdjective] даст нам доступ ко всем необходимым ресурсам, включая их военную силу."


