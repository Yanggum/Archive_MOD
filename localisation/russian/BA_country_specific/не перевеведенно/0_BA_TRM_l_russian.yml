#Операция Железный меч
 TRM_Iron_Sword_Operations_Categorie: "Операция Железный меч"
 TRM_Iron_Sword_Operations_Categorie_desc: "\n\n£GFX_decisison_TRN_idolization_picture\n\n\n\n\nВ Тринити всё ещё таятся угрозы. Таинственные силы действуют за кулисами Тринити, угрожая нашей стабильности. В сотрудничестве с тайной полицией мы должны выявить и уничтожить тех, кто прячется в наших тенях."
 TRM_IRON_SWORD_OPERATION_START: "Начать операцию Железный меч"
 TRM_iron_sword_decision_find: "С открытыми глазами"
 TRM_Iron_Sword_decision_search_up: "Расширить зону поиска"
 TRM_Iron_Sword_decision_battle_up: "Увеличить силы поиска"
 TRM_Iron_Sword_decision_co_op: "Предложить [KSP.GetName] совместное расследование"
 TRM_Iron_Sword_Operation_END: "Завершить операцию"
 TRM_Secure_Royal_Blood_decision_search_tt: "Начинается §Yоперация Железный меч§! по поимке §Yтеррористов§!."
 TRM_Secure_Royal_Blood_decision_search_run_tt: "Выявляем закулисных организаторов §Yтеррористов§!."
 TRM_Secure_Royal_Blood_decision_search_run_desc_tt: "§YОперация Железный меч§! по поимке §Yтеррористов§! завершена."
 TRM_ironsword_event.1.t: "Операция Железный меч"
 TRM_ironsword_event.1.d: "В нескольких точках были обнаружены антиправительственные террористы, замышляющие заговоры в тени Тринити. В ответ Мисоно Мика инициировала «Операцию Железный меч» для их обнаружения. Операция Железный меч — это совместная операция с участием элитного персонала Оперативной группы правосудия и Департамента разведки для раскрытия организаторов, стоящих за терроризмом. По мере роста террористической активности, угрожающей стабильности Тринити, их сотрудничество будет иметь решающее значение."
 TRM_ironsword_event.1.a: "С террористами не договариваются."

 TRM_ironsword_event.2.t: "Истинное лицо раскрыто"
 TRM_ironsword_event.2.d: "После долгого расследования мы захватили агента, действовавшего за кулисами Тринити. После жестоких пыток агент начал говорить и признался, что за ним стоит Школа филиала Ариус. В настоящее время агент содержится под стражей после оказания медицинской помощи."

 TRM_ironsword_event.3.t: "Расследование продвигается"
 TRM_ironsword_event.3.d: "Мы обнаружили логово террористов. Мы начали операцию и провели рейд, чтобы захватить их, но нам не удалось раскрыть организаторов. Тем не менее, арестовав террористов, Операция Железный меч доказала свою эффективность."

 TRM_ironsword_event.4.t: "Завершение расследования"
 TRM_ironsword_event.4.d: "Благодаря совместной крупномасштабной операции между [KSP.GetName], Оперативной группой правосудия и Департаментом разведки мы выявили организаторов терроризма и смогли их захватить. С успехом Операции Железный меч террористическая угроза исчезла из Тринити. Участники Оперативной группы правосудия и Департамента разведки, участвовавшие в операции, получат почести и богатство. Конечно, то же самое касается и следователей из [KSP.GetName]."
 TRM_ironsword_event.4.d_2: "Благодаря совместному расследованию Оперативной группы правосудия и Департамента разведки мы выявили организаторов терроризма и смогли их захватить. С успехом Операции Железный меч террористическая угроза исчезла из Тринити. В частности, участники Оперативной группы правосудия и Департамента разведки, участвовавшие в операции, получат почести и богатство."

 TRM_ironsword_event.10.t: "Предложение о совместном расследовании от [FROM.GetName]"
 TRM_ironsword_event.10.d: "Вскоре после того, как [FROM.GetName] объявила войну терроризму, они обратились за помощью к [ROOT.GetName]. Они утверждают, что опыт [ROOT.GetName] будет очень полезен для операции по захвату террористов под названием «Операция Железный меч». Должны ли мы вмешаться в их операцию?"

 TRM_ironsword_event.11.d: "[FROM.GetName] отклонила наши требования, приведя различные оправдания. Расследование не будет парализовано, но для поимки виновного потребуется немного больше времени."
 TRM_ironsword_event.12.d: "[FROM.GetName] выразила намерение сотрудничать с нами! Их помощь будет очень полезна для поимки виновного."

 TRM_Nagisa_Iron_sword_op_cat: "Операция по выслеживанию Ариуса"
 TRM_Nagisa_Iron_sword_op_cat_desc: "Ряд тревожных сигналов в Тринити доказывает, что кто-то глубоко вмешивается в дела академии. Мы должны непременно раскрыть организацию, стоящую за этими действиями. Примерно в это же время недалеко от Гдыни было обнаружено убежище со скрытыми символами, которые, как подозревается, принадлежат Школе филиала Ариус...\n\nТекущий уровень поиска §Y[?TRM_Nagi_IronSword_Var]%§!."
 TRM_Nagi_IronSword_Var_plus: "Уровень поиска увеличивается на $RIGHT|+=%%1$."
 TRM_Nagi_IronSword_Danzig_Search: "Поиск в Данциге"
 TRM_Nagi_IronSword_Danzig_Search_desc: "В ходе контактов с местными жителями мы обнаружили в районе Данцига скрытое убежище, которое, по-видимому, связано с Ариусом. Если обыскать окрестности, мы можем получить важные зацепки."
 TRM_Nagi_IronSword_intelligence_agency: "Запросить расследование у разведки"
 TRM_Nagi_IronSword_justice_task_force: "Мобилизовать Оперативную группу правосудия"
 TRM_Nagi_IronSword_local_cooperation: "Местное сотрудничество"
 TRM_Nagi_IronSword_We_Find_You: "Разработать план возвращения Ариуса"
 TRM_Nagi_IronSword_We_Find_You_trigger: "Уровень поиска превышает §Y89%§!"

 #Балканская дипломатия

 TRMDIP.1.t: "Требование территориальной уступки в Югославии от Министерства иностранных дел [FROM.GetAdjective]"
 TRMDIP.1.d: "Несколько минут назад через Министерство иностранных дел послу [ROOT.GetAdjective] был официально вручён документ с требованием территориальной уступки. Пресс-секретарь министерства заявил, что «Северная Словения исторически и культурно принадлежит жизненному пространству германского народа, и [FROM.GetAdjective], как преемник Германии, обязана защищать германский народ и его территории». Согласно правительственным источникам, посол [FROM.GetAdjective] в Югославии уведомил, что передаст это содержание своей стране. После объявления министерства Министерство обороны [FROM.GetAdjective] заявило на пресс-конференции, что усилит безопасность южной приграничной зоны, чтобы быть готовым к любым неожиданностям."
 
 TRMDIP.2.t: "Принятие требований правительством [FROM.GetAdjective]"
 TRMDIP.2.d: "Правительство [FROM.GetAdjective] приняло требование территориальной уступки Министерства иностранных дел [ROOT.GetAdjective]. Вместе с объявлением о завершении вывода войск из регионов, на которые [ROOT.GetAdjective] претендует как на суверенные, в течение двух недель правительство [FROM.GetAdjective] выразило уважение к территориальному суверенитету [ROOT.GetAdjective]. По поводу этого заявления правительственный пресс-секретарь сказал: «Это великая победа Министерства иностранных дел [ROOT.GetAdjective] и [ROOT.GetLeader], и правительство продолжит делать всё возможное для защиты прав [ROOT.GetAdjective]». Эксперты предупредили, что решение правительства [FROM.GetAdjective] о территориальной уступке может создать прецедент для аналогичных случаев на Балканах в будущем."

 TRMDIP.3.t: "Отказ от требований правительством [FROM.GetAdjective]"
 TRMDIP.3.d: "Правительство [FROM.GetAdjective] отклонило требование [ROOT.GetAdjective] признать её суверенитет над Северной Словенией. [FROM.GetLeader] заявил: «[FROM.GetAdjective] — это место, где живут балканские народы, и оно никогда не может быть разделено», провозгласив, что они не уступят иррациональным угрозам других стран. В ответ правительство заявило: «Мы не можем игнорировать поведение [FROM.GetName], которое пренебрегает законными требованиями [ROOT.GetAdjective] и осуществляет тиранию», намекая на решительный ответ. Пресс-секретарь Министерства обороны указал, что недавняя передислокация войск к границе с [FROM.GetAdjective] является нормальной мерой с учётом текущей напряжённой ситуации."

 TRMDIP.4.t: "Предложение [FROM.GetAdjective] поддержать наши претензии на суверенитет над [45.GetName]"
 TRMDIP.4.d: "[FROM.GetAdjective] предложила нам поддержать наши претензии на суверенитет над [45.GetName] в обмен на подписание договора о сотрудничестве и взаимной гарантии независимости. Кажется, это хорошая сделка для нас, но стоит ли нам её принимать?"
 TRMDIP.4.b: "Почему мы должны доверять чужакам из другого мира?"

 TRMDIP.5.t: "$TRM_Schidsspruch$"
 TRMDIP.5.desc: "По просьбе нашего союзника Венгрии сегодня в Эдеме состоялась конференция по корректировке границы Румынии. После различных обсуждений были достигнуты три возможных вывода.\n\nПервый — передать всю Трансильванию Венгрии. Мы полностью аннулируем Трианонский договор, отделивший Трансильванию от Венгрии, и вернём её законным правителям, венграм. Фактически, в некоторых районах Трансильвании венгры составляют большинство, так что это не было бы невозможным.\n\nВторой — передать часть Трансильвании Венгрии. Хотя венгры и составляют большинство, они не распределены равномерно по всему региону, а сосредоточены в некоторых горных районах. В частности, они находятся в Северной Трансильвании, поэтому уступка только севера могла бы решить проблему между двумя странами.\n\nТретий — не вмешиваться в Трансильванию. Трианонский договор был подписан до того, как мы пережили Великое Перемещение; мы всё ещё не полностью понимаем чувства между двумя странами и не знаем, какие недостатки мы можем понести из-за этого выбора в будущем. Проблема между двумя странами должна быть решена ими самими.\n\nВсе три предложения сегодня были переданы [TRM.GetLeader] через канцелярию. Теперь мы должны выбирать."
 
 TRM_second_vienna_award: "$TRM_Schidsspruch$"
 TRMDIP.6.t: "Ультиматум [FROM.GetAdjective]"
 TRMDIP.6.d: "Недавно [FROM.GetAdjective], сформировавшая союз с Венгрией, объявила Трианонский договор недействительным и решила, что Северная Трансильвания должна быть возвращена Венгрии. Должны ли мы принять это решение?"
 TRMDIP.7.d: "Недавно [FROM.GetAdjective], сформировавшая союз с Венгрией, объявила Трианонский договор недействительным и, что абсурдно, решила, что вся Трансильвания должна вернуться под власть Венгрии. Должны ли мы принять это решение?"
 
 TRMDIP.8.t: "[FROM.GetAdjective] отклонила наши требования"
 TRMDIP.8.d: "Правительство [FROM.GetName] отклонило наши требования и отказалось подписывать договор о передаче Трансильвании. Вместе с [HUN.GetAdjective] мы сокрушим [FROM.GetName]."
 
 TRMDIP.9.t: "$TRM_Schidsspruch$"
 TRMDIP.9.d: "[ROM.GetName], принявшая ультиматум [TRM.GetAdjective], сегодня направила нашему правительству уведомление о согласии уступить Трансильванию. Это исторический момент."

 TRMDIP.10.t: "Предложение о посредничестве от [TRM.GetAdjective]"
 TRMDIP.10.d: "Несмотря на наши законные территориальные претензии, [TRM.GetAdjective] решила, что Трансильвания должна остаться под властью Румынии. Они утверждают, что хотят решить балканскую проблему, но, похоже, делают это только тогда, когда это выгодно их собственным интересам."

 TRMDIP.11.t: "$TRM_support_the_croatia_militia$"
 TRMDIP.11.d: "Получив [102.GetName], мы подтвердили, что Югославия больше не обладает силой, необходимой для отклонения наших требований. [TRM.GetLeader] поняла, что для ослабления Югославии и окончательного подчинения её нашей сфере влияния независимость Хорватии практически необходима.\n\nМинистерство иностранных дел представило два предложения.\nПервое заключается в том, чтобы оказать военное давление для отделения Хорватии от Югославии. Хотя может быть сопротивление, мы сможем добиться этого с помощью подавляющей военной силы или посредничества других держав, включив Хорватию в нашу сферу влияния.\n\nВторое заключается в том, чтобы связаться с внутренними силами сопротивления в Хорватии и спровоцировать восстание. Этот процесс потребует огромных затрат, но если Хорватии удастся обрести независимость, это станет сокрушительным ударом для Югославии."
 TRMDIP.11.a: "Первое."
 TRMDIP.11.b: "Второе."

 TRMDIP.12.t: "[FROM.GetAdjective] требует [DEN.GetAdjective]!"
 TRMDIP.12.d: "Прошлой ночью [FROM.GetAdjective] отправила в [ROOT.Capital.GetName] письмо с требованием [DEN.GetAdjective]. [DEN.GetAdjective], приобретённый [ROOT.GetAdjective] после Великого Перемещения, имеет огромную стратегическую ценность. Однако тот факт, что [FROM.GetAdjective] требует территорию такой стратегической важности, равносилен объявлению о желании войны против нас."
 TRMDIP.12.a: "Примем их требования..."
 TRMDIP.12.b: "Вежливо отклоним их требования."

 TRMDIP.13.t: "[FROM.GetAdjective] уступила [DEN.GetAdjective]"
 TRMDIP.13.d: "Рано утром [FROM.GetAdjective] отправила в [ROOT.Capital.GetName] уведомление, подтверждающее, что передаст [DEN.GetAdjective] в течение 24 часов. Учитывая огромную стратегическую ценность [DEN.GetAdjective], наша дипломатия снова восторжествовала."

 TRMDIP.14.t: "[FROM.GetName] отклонила наши требования!"
 TRMDIP.14.d: "Рано утром [FROM.GetAdjective] отправила в [ROOT.Capital.GetName] документ, в котором отказывается уступить [DEN.GetAdjective]. Стратегическая важность [DEN.GetAdjective] подчёркивалась внутри [FROM.GetAdjective], что, по-видимому, и стало причиной отклонения наших требований. Тучи войны снова сгущаются над нами."

 TRMDIP.15.t: "Тема: Эскалация недовольства среди населения немецкого происхождения"
 TRMDIP.15.d: "Совершенно секретно\nДоклад\n\n[ROOT.GetAdjective] [GetDate]\nТема: Усиление недовольства среди населения немецкого происхождения и потенциальный кризис\n\nСодержание инцидента\n\n1. Прогерманские демонстрации среди населения немецкого происхождения быстро растут. Демонстранты выражают недовольство, выкрикивая лозунги типа «Обеспечьте свободу передвижения!».\n2. Демонстранты предупредили, что если их требования не будут приняты, они «добьются их силой», что усиливает серьёзность ситуации.\n3. Ситуация в ядре Тринити ненормальна. Интерес к немецким общинам за рубежом растёт, и обнаружены движения, указывающие на возможное вмешательство в этот регион.\n4. Если текущая ситуация продолжится, существует риск внутренней нестабильности и роста напряжённости в международных отношениях.\n\nКонец доклада."
 TRMDIP.15.a: "Подавить их всех!"
 TRMDIP.15.b: "Нет выбора: мы должны принять требования демонстрантов."

 TRMDIP.16.t: "[ROOT.GetLeader] начала захватническую войну"
 TRMDIP.16.d: "С началом захватнической войны нашей родиной существующие экономические планы и программы внутренней стабилизации больше не могут продолжаться. Возможно, мы сможем их возобновить, когда вернётся мир, но сейчас мы должны сосредоточиться на завершении захватнической войны."
 TRMDIP.16.a: "[ROOT.GetAdjective], побеждай!"
 TRM_focus_locked_flag_tt: "Все §Yвнутренние фокусы§! деактивированы!"
 
 TRMDIP.17.t: "Вторжение демонов!"
 TRMDIP.17.d: "Сегодня случилось то, чего мы опасались. Демоны Генны начали одновременную атаку на нас, и на фронте уже есть потери. Мы должны сопротивляться до конца."
 
 TRMDIP.18.t: "Договор Тринити–Красная Зима?"
 TRMDIP.18.d: "Министерство иностранных дел Тринити представило доклад [ROOT.GetLeader] в связи с ростом напряжённости, связанной с Красной Зимой, поддерживающей договор о дружбе с Генной. В докладе предупреждается, что в случае начала войны против Генны существует возможность возникновения конфликтов на границе с Красной Зимой. Чтобы предотвратить этот кризис, министерство настоятельно подчеркнуло необходимость заключения пакта о ненападении с Красной Зимой."
 TRMDIP.18.a: "Свяжемся с [RED.GetAdjective]."
 TRMDIP.18.b: "Это ненужное беспокойство."

 TRMDIP.19.t: "Предложение пакта о ненападении от [FROM.GetAdjective]"

 TRMDIP.20.t: "Анти-Генна теракты в [?TRM.TRM_anti_geh_emotion_var.GetName]!"
 TRMDIP.20.d: "В последнее время в регионе академии Генны участились теракты с применением бомб, совершаемые студентками нашей академии. Согласно отчётам, эти атаки проводятся бессистемно, без конкретных целей, нанося огромный ущерб ключевым объектам и местному населению. Масштаб ущерба ещё не определён точно, но частота терактов погрузила регион в крайний хаос. Эти атаки не единичные инциденты, а систематические и повторяющиеся действия.\n\nЕщё более серьёзная проблема заключается в том, что эти атаки приводят к формированию организаций сопротивления внутри Генны. Студентки Генны начали организовывать скоординированные ответные действия для защиты своей безопасности и автономии, что представляет значительную угрозу для нашей оккупации Генны. Эти организации не ограничатся обороной, они могут напрямую вмешиваться в наши тактические действия.\n\nВ частности, в результате этих терактов промышленный район [?TRM.TRM_anti_geh_emotion_var.GetName] стал основной целью, и доступ к фабрикам полностью заблокирован. Эти объекты, являющиеся ключевыми центрами производства и снабжения, испытывают серьёзные перебои в логистике и поставках. Существует риск, что экономическое воздействие распространится не только на Генну, но и на окружающие регионы.\n\nТребуется всесторонний стратегический пересмотр, чтобы гарантировать, что план оккупации продолжится в соответствии с графиком."
 TRMDIP.20.a: "Нам нужен другой план..."

 TRMDIP.21.t: "Пакт о ненападении с [TRM.GetAdjective]"
 TRMDIP.21.d: "Министерство иностранных дел Тринити предложило пакт о ненападении между двумя нациями. Этот договор не только значительно расширит взаимную торговлю, но и включает в дополнительном секретном протоколе признание всей Скандинавии сферой влияния Красной Зимы.\n\nХотя фашистам из Эдема, возможно, нельзя доверять, подписание этого соглашения позволит нам оправдать наше господство над Скандинавией, не опасаясь вмешательства других держав. Кроме того, если Финляндия рухнет, мы могли бы воспользоваться возможностью, чтобы включить её в нашу территорию."
 TRMDIP.21.a: "Подпишем договор."
 TRMDIP.21.b: "Мы не договариваемся с фашистами!"
 TRM_RED_pact: "Пакт о ненападении Тринити–Красная Зима"
 refused_TRM_RED_pact: "Пакт о ненападении отклонён"

 TRMDIP.22.t: "[RED.Capital.GetCapitalVictoryPointName] принимает договор!"
 TRMDIP.22.d: "[RED.GetNameDefCap] благоразумно подписала наш пакт о ненападении. Это означает, что мы сможем действовать свободно, без риска вмешательства Красной Зимы."
 TRMDIP.22.a: "Дипломатическая победа."

 TRMDIP.23.t: "[RED.Capital.GetCapitalVictoryPointName] отклоняет договор!"
 TRMDIP.23.d: "[RED.GetNameDefCap] неблагоразумно отклонила наш договор. Несомненно, против нас существует заговор."
 TRMDIP.23.a: "Неприятно."

 TRMDIP.24.t: "Немецкие волнения"
 TRMDIP.24.d: "Многочисленные немцы восстали против нас, устраивая беспорядки. Выкрикивая «Единая родина», они разрушали символы Генны или оскверняли их граффити, усиливая своё сопротивление системе. Их гнев выплеснулся на улицы, открыто отрицая власть Генны.\n\nХотя беспорядки частично подавляются, появились признаки того, что этот инцидент не является спонтанным движением, а является результатом подстрекательства и манипуляции со стороны кого-то. В частности, Тринити считается главным подозреваемым, стоящим за этими событиями."
 TRMDIP.24.a: "Это внутреннее вмешательство."

 TRMDIP.25.t: "Глейвицкое посредничество"
 TRMDIP.25.desc: "Преследование немцев в Судетской Силезии — глубоко болезненная трагедия для германского народа. У нас есть полная воля способствовать миру во всем мире, защищая принцип самоопределения наций, согласованный в 1919 году. Через наше посольство мы вежливо попросим соответствующую страну надлежащим образом реструктурировать искажённые и несогласованные текущей ситуацией границы в чешских регионах, а также добьёмся уступки Судетской Силезии."
 TRMDIP.25.a: "Эта земля — наша территория."

 TRMDIP.26.t: "Глейвицкое посредничество"
 TRMDIP.26.desc: "Мы получили от [TRM.getname] требование отказаться от наших территориальных претензий на [74.getname] и [72.getname] и установить новые границы в соответствии с принципом самоопределения наций."
 TRMDIP.26.a: "Примем их предложение."
 TRMDIP.26.b: "Это абсурдно!"

 TRMDIP.27.t: "Отказ"
 TRMDIP.27.desc: "Наше посредничество было отклонено соответствующей стороной."
 TRMDIP.27.a: "Используем второй метод."
 TRMDIP.27_tt: "§LНемцы в Судетах поднимут восстание.§!"
 TRMDIP.27.b: "Сделаем шаг назад."
 
 TRMDIP.28.t: "Ультиматум [TRM.getname]"
 TRMDIP.28.desc: "[TRM.getname] потребовала безоговорочного принятия её посредничества для территориальной реорганизации [SLO.getname]."
 TRMDIP.28.a: "У нас нет выбора."
 TRMDIP.28.b: "Будем сопротивляться!"

 TRMDIP.29.t: "Предложение [TRM.getname]"
 TRMDIP.29.desc: "Посольство [TRM.getname] потребовало от нас военного союза в обмен на гарантию управления всей Словакией."
 TRMDIP.29.a: "Заманчиво."
 TRMDIP.29.b: "Откажемся."

 TRMDIP.30.t: "Судьба Словакии"
 TRMDIP.30.desc: "Словакия — низшая славянская нация, но в ней сохраняются следы германского характера, поэтому она должна направляться [TRM.getname], представителем германского народа. После принятия нашего ультиматума, отправленного Словакии, мы можем установить там дружественное правительство или уступить её Венгрии, чтобы укрепить наш союз."
 TRMDIP.30.a: "Установим дружественное правительство."
 TRMDIP.30.b: "Укрепим наш союз с Венгрией."

 TRMDIP.31.d: "[TRM.getname] отправила приглашение нашей фракции, подчёркивая, что мы являемся родственными фашистскими государствами. Италия, безусловно, фашистское государство, но фашизм, который провозглашают эти существа из другого мира, отличается. Если мы примем их приглашение, сформируется мощный союз, но наш народ не желает союза с ними."


# Проблема отряда Ариус ###Thx for TNO team###
  TRN_arius_squad_smash_decision: "Проблема отряда Ариус"
 TRN_arius_squad_smash_decision_desc: "\n\n£GFX_TRN_decisions_arius_squad\n\n\n\n\nОтряд Ариус относится к элитной группе Школы филиала Ариус, которая, будучи подвергнутой промыванию мозгов, угрозам и ненависти, действует как террористы без малейших угрызений совести. Однако, когда Филиальная школа отказалась интегрироваться и столкнулась с Тринити, они воспользовались хаосом, чтобы укрыться по всей территории Тринити. Поскольку их воспитывали как орудия убийства, способные без колебаний убить любого человека, правительство должно принять быстрые меры."
