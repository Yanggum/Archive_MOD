 TRN_after_war_decisions: "Движение сопротивления Генны"
 TRN_after_war_decisions_desc: "Сопротивление студенток Генны становится всё более организованным, и «Альянс студенческого сопротивления Генны», объединившийся вокруг остатков Клуба развития онсэнов, Общества гурманских исследований и Отряда префекта, представляет реальную угрозу для Тринити.\nПроблема существует и внутри. Некоторые студентки Тринити, вместо того чтобы сотрудничать с правительством, совершают дискриминацию и насилие против студенток Генны и даже террористические акты — это очевидное преступление. Эта враждебность только усиливает сопротивление и, вместо обеспечения ресурсов, рискует усилить внутренние конфликты. Если Тринити намерен стабильно контролировать ресурсы Генны и добиться интеграции, потребуются исключительные меры."
