 TRN_Misono_Mika_DESC_2: "Мисоно Мика была членом Чайной вечеринки с яркой и невинной улыбкой. Но кто мог подумать, что все эти грани были лишь тщательно рассчитанным притворством?\n\nМисоно Мика давно ненавидела Генну. Она не могла понять, как можно доверять этим рогатым существам, и особенно у неё было множество стычек с Кирифудзи Нагисой, которая настаивала на подписании мира с Генной.\nОднако, хотя конфликтов было много, она никогда не пыталась захватить власть силой и не устраивала государственный переворот. Потому что Кирифудзи Нагиса была для Мисоно Мики драгоценной подругой детства и её единственной подругой.\n\nДля неё инцидент «Великого Перемещения» стал событием, полностью изменившим её жизнь. То, что весь Кивотос оказался на континенте под названием Европа, возможно, было для неё шансом. Шансом получить всю полноту власти в Чайной вечеринке и изгнать демонов Генны.\n\nНо какой бы хитрой она ни была, в душе она всё ещё оставалась ребёнком. Хотя она и объединилась с национал-социалистами, она считала их действия и методы слишком экстремальными, и, желая контролировать их, не могла этого сделать из-за слабости сердца.\n\nКогда, через несколько дней после того, как Кирифудзи Нагиса была заперта в комнате из-за переворота Мики, был отдан приказ об «изоляции», тогда Мика впервые поняла, что на самом деле она делает.\n\nЕё следы окрасились в красный, а голос стал пустым.\nБесчисленные люди исчезли под её именем, и страх и гнев людей обратились против неё.\nХотя у неё было бесчисленное множество возможностей остановиться, она этого не сделала, и теперь безумие вырвалось из её рук и начало окрашивать всё само по себе.\n\nПод именем национал-социализма Тринити не остановился.\nПервыми исчезли евреи и этнические меньшинства.\nПотому что нечистая кровь не могла быть терпима в святом Тринити.\nЗатем пришли те, кто сопротивлялся ей.\nВ славном будущем Тринити слабость была не нужна.\nНаконец, это были остатки, остававшиеся на землях, оккупированных Тринити.\nВсе они исчезли во тьме, внутри стен, созданных по её приказу.\n\nВ конце концов, четыре всадника Апокалипсиса, которых она выпустила, смели всё, что существовало в Кивотосе.\nПод её владычеством ночь будет длиться вечно.\nВ ожидании рассвета, который никогда не наступит, выжившие лишь отчаянно желают, чтобы этот неудержимый огонь не поглотил всё.\n\nГосподи, помилуй."
 #Фокусы Тринити#
  TRM_focus_tree: "Древо базовых фокусов Тринитас"
 TRN_nagisa_focus: "Древо Железной леди"
 TRM_newfocus_0: "Реагирование на кризис"
 TRM_newfocus_0_desc: "Наша академия из-за сверхъестественного явления или странного эксперимента была перенесена в другой мир. Точное местоположение неизвестно, связь с другими академиями сохраняется, но промышленные и железнодорожные объекты, необходимые для нормального функционирования, разрушены."
 TRM_newfocus_1: "Успокоить студенток"
 TRM_newfocus_1_desc: "Наша академия была перенесена в неизвестное место из-за сверхъестественного явления. Это явление ещё не полностью прекратилось и продолжает вызывать беспорядки в нашем обществе. Необходимо сообщить правду и арестовать тех, кто подстрекает к хаосу, чтобы поддерживать порядок."
 TRM_localization: "Локализация Тринитас"
 TRM_localization_desc: "После Великого Перемещения мы должны немедленно провести промышленную реструктуризацию, адаптированную к этому миру."
 TRN_economic_adjustment: "Промышленная дисциплина"
 TRN_economic_adjustment_desc: "Мы поддержим развитие базовых промышленных технологий, чтобы стимулировать индустриализацию Тринитас."
 TRN_trade_union: "Гарантировать деятельность профсоюзов"
 TRN_trade_union_desc: "Мы должны гарантировать права рабочих, подавляемых в ходе промышленного развития Тринитас."
 TRM_newfocus_3: "Искать компромисс"
 TRM_newfocus_3_desc: "У нас были постоянные конфликты с местными жителями. Хотя мы одержали победу, обида осталась. Теперь мы должны договориться о компромиссе, с Кендзаки Цуруги в качестве представителя."
 TRM_newfocus_4: "Анализ"
 TRM_newfocus_4_desc: "При сотрудничестве Библиотечного клуба и других мы подтвердили, что это совершенно иной мир. Лучше знать правду, чем игнорировать её. Чрезвычайное собрание Чайной вечеринки подходит к концу, и пришло время выбрать новую хозяйку."
 TRN_Request_assistance_from_Sisterhood: "Убедить Сестринство"
 TRN_Request_assistance_from_Sisterhood_desc: "[TRM.GetLeader] попросит помощи у Сестринства для стабилизации Тринитас после отстранения Мики Мисоно и фракции Патер."
 TRN_Request_assistance_from_relief_knights: "Убедить Рыцарей Помощи"
 TRN_Request_assistance_from_relief_knights_desc: "[TRM.GetLeader] свяжется с Рыцарями Помощи, преемниками древней фракции Йохан, чтобы заполнить административный вакуум."
 TRN_suppress_the_opposition: "Подавить фракции"
 TRN_suppress_the_opposition_desc: "Мы устраним внутренние фракции, чтобы расширить влияние фракции Филиус и обеспечить стабильность Тринитас."
 TRN_Trinitys_Balance: "Баланс Тринитас"
 TRN_Trinitys_Balance_desc: "Мы достигнем стабильности путём сбалансированной политики, предотвращающей диктаторские действия одной фракции."
 TRN_nagisa_coupdetat: "Переворот гвардии"
 TRN_nagisa_coupdetat_desc: "С заключением Нагисы фракция Филиус должна освободить её с помощью союзных фракций и арестовать Мисоно Мику."
 TRN_nagisa_lottery: "Восстановление Нагисы"
 TRN_nagisa_lottery_desc: "Мы освободим Нагису из несправедливого заключения и назначим нового президента студенческого совета."
 TRN_new_trinity: "Новая звезда Тринитас"
 TRN_new_trinity_desc: "Теперь, когда беспорядки утихли, мы можем установить новые принципы Тринитас."
 TRN_trinity_reorganization: "Реструктуризация Тринитас"
 TRN_trinity_reorganization_desc: "Нагиса Кирифудзи устранила угрозы Тринитас. Академия будет восстановлена под её защитой."
 TRN_stabilization_of_the_system: "Стабилизация системы"
 TRN_stabilization_of_the_system_desc: "Традиционная система Тринитас будет действовать и оставаться стабильной, несмотря на изменения."
 TRN_decentralization_of_power: "Децентрализация власти"
 TRN_decentralization_of_power_desc: "Чтобы избежать будущих кризисов, мы реформируем чрезмерно централизованную структуру власти в Чайной вечеринке."
 TRN_trinity_tank_brigade: "Танковая бригада Тринитас"
 TRN_trinity_tank_brigade_desc: "Тринитас нужны танки, много танков, и мы обучим всех студенток управлять ими."
 TRN_trinity_supremacy_focus: "Гегемония Тринитас"
 TRN_trinity_supremacy_focus_desc: "У Тринитас есть основания претендовать на доминирующее положение на международной арене."
 TRN_guardian_of_the_academy_focus: "Хранительница академии"
 TRN_guardian_of_the_academy_focus_desc: "Нагиса усилит оборону Тринитас, чтобы быть готовой к любому конфликту."
 TRN_threat_exclusion: "Устранить угрозу"
 TRN_threat_exclusion_desc: "Теперь, когда мы знаем о существовании Ариуса, мы не можем позволить им продолжать. Мы покончим с их академией."
 TRN_preventive_war: "Превентивная война"
 TRN_preventive_war_desc: "Польша, стремящаяся вернуть утраченные территории, представляет угрозу, которую мы должны нейтрализовать."
 TRN_nazi_oppression: "Искоренение нацизма"
 TRN_nazi_oppression_desc: "Мы искореним НСДАП, которая, объединившись с Микой, посеяла хаос в Тринитас."
 TRN_Reunion_of_the_Treaty_of_Eden: "Воссоединение Эдемского договора"
 TRN_Reunion_of_the_Treaty_of_Eden_desc: "Мы возобновим переговоры по Эдемскому договору, чтобы достичь всеобъемлющего соглашения между Тринитас и Генной."
 TRN_Treaty_of_Eden: "Формирование Эдемского договора"
 TRN_Treaty_of_Eden_desc: "Мы завершаем переговоры и объявляем об успехе Эдемского договора."
 TRN_establishment_of_the_eden_treaty_organization: "Мир и сосуществование"
 TRN_establishment_of_the_eden_treaty_organization_desc: "Делегации Генны приняли договор. Скоро мы направимся к миру и сосуществованию."
 TRN_joint_economic_development: "Совместное промышленное развитие"
 TRN_joint_economic_development_desc: "В соответствии с договором мы улучшим промышленность стран-подписантов в сотрудничестве с Генной."

 TRN_war_with_Gehenna: "Несовместимы"
 TRN_war_with_Gehenna_desc: "Академия Генна долгое время пренебрегала нашими попытками заключить Эдемский договор, даже высылая нашу делегацию. Пришло время изменить наше дипломатическое отношение. Настал момент проучить этих высокомерных демонов."
 TRN_anti_german_anti_gehenna: "Анти-Генна, Анти-Германия"
 TRN_trinity_movement: "Движение Тринитас"
 TRN_the_dignity_of_the_empire: "Достоинство империи"
 TRN_pro_trinity_volunteer_corps: "Корпус национальных добровольцев"
 TRN_our_homeland: "Наша родина"
 TRN_crusade_against_the_trinity: "Крестовый поход против Тринитас"

 TRN_deep_hatred: "Глубокая ненависть"
 TRN_deep_hatred_desc: "Теперь, когда война с Генной началась, глубоко укоренившуюся в Тринитас ненависть к Генне можно использовать как инструмент."
 TRN_Confirmation_of_intention_to_treaty: "Подтверждение намерения по договору"
 TRN_Confirmation_of_intention_to_treaty_desc: "После Великого Перемещения в Генне царит внутренняя неразбериха. Хотя их предыдущее руководство благоволило к Эдемскому договору, текущая ситуация может быть иной. Мы отправим делегацию, чтобы подтвердить их готовность."
 TRN_Gehenna_Trinity_Conference: "Великий компромисс"
 TRN_Gehenna_Trinity_Conference_desc: "Поскольку создание организации Эдемского договора сорвано, мы должны начать длительные переговоры с Генной. Министерство иностранных дел надеется на успешное завершение переговоров."
 nagisa_imprisoned_flag: "§RНагиса заключена!§!"
 TRM_newfocus_21: "Нейтрализовать Нагису"
 TRM_newfocus_21_desc: "Чтобы полностью контролировать Тринитас, необходимо нейтрализовать действующую временную хозяйку Чайной вечеринки Кирифудзи Нагису и заключить её."
 TRN_nagisa_cahin_tt: "§tНастало время суда!§!"
 TRN_nagisa_cahin_2_tt: "§YКирифудзи Нагиса§! больше не может пользоваться функциями Чайной вечеринки."
 TRM_newfocus_7: "Встреча"
 TRM_newfocus_7_desc: "С перемещением возник новый судьбоносный выбор. Первоначально мы планировали сотрудничать с Ариусом для переворота, но теперь мы должны отказаться от этого варианта и вместо этого сотрудничать с местной НСДАП, чтобы решить будущее Тринитас."
 TRM_newfocus_26: "Правовая реформа"
 TRM_newfocus_26_desc: "Нынешние правила не благоприятствуют нашему абсолютному контролю. Теперь, когда мы смели оппозицию и являемся хозяйками Чайной вечеринки, мы должны скорректировать законы в своих интересах."
 TRM_newfocus_28: "Консолидация власти"
 TRM_newfocus_28_desc: "После великой чистки наше влияние было ещё ограничено. Но теперь, когда мы устранили всех, кто сомневался в нас, мы должны закрепить власть, соответствующую нашему положению."
 TRM_newfocus_27: "Архангел, Мисоно Мика"
 TRM_newfocus_27_desc: "Академия Тринитас — это большая семья, состоящая из фракций, и каждой семье нужна глава. Президент Мисоно Мика — этот лидер, человек, предназначенный искоренить упадок старого порядка и вести нас в будущее."
 TRM_newfocus_33: "§tТишина§!"
 TRM_newfocus_33_desc: "[TRN_scripted_loc]"
 TRN_desc_after_localization_key: "Президент Мисоно Мика, не в силах больше терпеть хаос в Чайной вечеринке и упадок нашего гордого Тринитас, решила взять бразды правления в свои руки, возглавив армию и сокрушив некомпетентное руководство. Она пообещала посвятить всё своё существо восстановлению величия Тринитас, устранив все коррумпированные и предательские элементы."
 TRN_desc_before_localization_key: "§tСекретно§!"
 TRM_tail_chasing: "Охота на хвосты"
 TRM_tail_chasing_desc: "Мы выявили силы, подрывающие стабильность Тринитас. Пришло время их искоренить."
 TRM_arius_annex: "Вернуть Ариус"
 TRM_arius_annex_desc: "Ариус стал враждебной зоной, отвергнув нашу мирную интеграцию. С перемещением их местоположение раскрылось. Мы должны сокрушить эту угрозу."
 TMR_anti_gehenna: "Анти-Генна пропаганда"
 TMR_anti_gehenna_desc: ""
 TMR_support_with_germany: "Местное сотрудничество"
 TMR_support_with_germany_desc: "Местные немцы хорошо знают регион. Чтобы наше вторжение в Генну было успешным, мы должны опираться на них для обеспечения стратегического преимущества."
 TRN_german_company_acceptance: "Принять немецкие компании"
 TRN_german_company_acceptance_desc: "Хотя обида есть, местные компании не утратили своей сути. При наличии достаточных денег мы можем привлечь их на свою сторону."
 TRN_self_reliance: "Улучшить академическую промышленность"
 TRN_self_reliance_desc: "Зависеть от немецких компаний удобно, но опасно для нашего влияния. Мы должны сосредоточить рост на собственной промышленности."
 TRN_Trinity_Industrial_Development_Department: "Департамент промышленного развития Тринитас"
 TRN_Trinity_Industrial_Development_Department_desc: "Мы решили развивать свою промышленность. Мы создадим специализированный департамент, чтобы возглавить огромное экономическое развитие."
 TRM_Endsige: "Окончательная победа"
 TRM_Endsige_desc: "Окончательное завоевание Тринитас завершилось водружением нашего флага в самом сердце Генны. Теперь мы должны двигаться в будущее."
 TRM_Endsige2: "Культ личности"
 TRM_Endsige2_desc: "Под блестящим руководством Мисоно Мики Тринитас достиг победы, мира и процветания. Её лидерство заслуживает почитания."
 TRM_Endsige2_tt: "\n§YМисоно Мика§! теряет все свои черты."
 TRM_Endsige3: "Лидер Тринитас"
 TRM_Endsige3_desc: "Мисоно Мика заявила, что сердце Тринитас — студентки, и мы должны реорганизовать его вокруг них."
 TRM_Endsige7: "Спасительница"
 TRM_Endsige7_desc: "Мисоно Мика не только спасла нас во время Великого Перемещения, но и защитила от внешних угроз. Она заслуживает называться «Спасительницей»."
 TRM_Endsige5: "\"Государыня\""
 TRM_Endsige5_desc: "Несмотря на кажущийся мир, угрозы продолжают существовать. В этой исключительной ситуации та, кто определяет политику, — наша истинная государыня, Мисоно Мика."
 TRM_Endsige4: "Защитница германского народа"
 TRM_Endsige4_desc: "Мисоно Мика провозгласила, что ядро Тринитас — германцы, сверхчеловеки, примеру которых мы должны следовать."
 TRM_Endsige6: "Декларация национальной революции"
 TRM_Endsige6_desc: "Мы должны двигаться быстрее к совершенству сверхчеловеков, жертвуя теми, кто не соответствует."
 TRM_Endsige8: "Новый рассвет Тринитас"
 TRM_Endsige8_desc: "Следуя идеалу Мисоно Мики, мы достигли нашего Эдема. Всё в совершенной гармонии: народ, государство и лидер объединены в подлинной троице."
 TRN_ENDSIGE_TT: "§LПусть Тринитас цветёт и процветает под светом величия!§!"
 TRN_kickstart_the_war_industry: "Эдемский арсенал"
 TRN_kickstart_the_war_industry_desc: "Эдемского арсенала недостаточно для удовлетворения спроса на оружие и боеприпасы. Мы должны построить больше фабрик в безопасных районах."
 TRN_military_training: "Военная подготовка"
 TRN_military_training_desc: "Наши солдаты ещё не готовы. Мы начнём масштабную подготовку к войне."
 TRN_muchabyeol_jingbyeong: "Расширить призыв"
 TRN_muchabyeol_jingbyeong_desc: "Расширить призыв"
 TRM_after_war: "Послевоенное время"
 TRM_after_war_desc: "Гордые силы Тринитас водрузили свой флаг в сердце Генны. Теперь мы должны управлять их обширными территориями."
 TRM_germany_union: "Декларация объединения"
 TRM_germany_union_desc: "Земли Генны являются ключом к немецкой промышленности, но недавние теракты затрудняют их использование. Чтобы решить это, мы объявим об объединении и успокоим напряжённость."
 TRM_arius_attack: "Ультиматум Ариусу"
 TRM_arius_attack_desc: "Ариус — диссидентский регион. Есть достаточно оснований, чтобы сокрушить их и завершить интеграцию."
 TRM_We_need_Denmark_milk: "Требовать Данию"
 TRM_We_need_Denmark_milk_desc: "Дания имеет стратегическое значение, соединяет Северное и Балтийское моря и служит базой против Красной Зимы. Захват контроля над ней улучшит наши позиции на севере."

 TRM_redwinter_war_goal: "Бежеовибунг"
 TRM_redwinter_war_goal_desc: "[RED.GetAdjective] обладает обильными природными ресурсами, обширными территориями и огромным количеством деревьев, что представляет собой огромный потенциал как сырьё для строительства нашего будущего. Однако они используют всё это как средство давления на нас. Чтобы положить конец этой ситуации, мы должны ударить первыми и скорректировать их высокомерное отношение."
 TRM_We_need_Denmark_milk_flag: "§Y[RED.GetAdjective]§! уступает §Y[DEN.GetAdjective]§!"
