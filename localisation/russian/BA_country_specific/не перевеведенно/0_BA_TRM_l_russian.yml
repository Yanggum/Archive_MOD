#Новая цепочка коллапса Тринити
 TRN_collapse_event.1.t: "Консолидация анти-Тринити сопротивления"
 TRN_collapse_event.1.desc: "Наша операция по искоренению сопротивления закончилась катастрофическим провалом, и в результате общественное мнение полностью перешло на сторону повстанческих сил. Этот поворотный момент предоставил им прекрасную возможность, и теперь они действуют более смело под лозунгом «уничтожение Тринити».\n\nСопротивление больше не просто вооружённая сила, а движение, пользующееся массовой поддержкой как в городах, так и в сельской местности. Вооружённые не только военной мощью, но и поддержкой народа, они отбирают у нас территории одну за другой.\n\nТеперь мы сражаемся не только с мятежной армией, но и со всем населением, которое к ним присоединилось. Если мы не сможем вернуть доверие людей, эта война будет ещё дольше, и мы не можем позволить, чтобы у нас отбирали города и деревни. Это не просто битва, а отчаянная борьба за выживание нашей академии."
 TRN_collapse_event.1.a: "Мы должны немедленно ответить."
 
 TRN_collapse_event.2.t: "Восстание мятежников"
 TRN_collapse_event.2.desc: "Пока сопротивление устанавливало свою структуру командования, мы не смогли принять эффективные меры, чтобы их остановить. В нашей неразберихе и самоуспокоенности они завершили свою подготовку и теперь сформировали свою собственную независимую систему, готовую противостоять нашему господству.\n\nОни официально объявили нам войну, это уже не просто подпольная сила, а единый организм, продвигающийся с народной поддержкой.\n\nМы не можем отступить. Если мы не остановим их продвижение, наша система и наша академия рухнут. Мы должны остановить их любой ценой, чтобы сохранить наше существование. За Тринити!"
 TRN_collapse_event.2.a: "Подавить их любыми средствами!"
 TRN_collapse_event.2.b: "Сокрушить Тринити!"

 TRN_collapse_event.3.t: "Последствия"
 TRN_collapse_event.3.desc: "Сопротивление — или, скорее, мятежники — продолжают расти день ото дня. Их влияние вышло за рамки простых вооружённых действий; теперь у них есть чёткая структура, они выпускают манифесты и мобилизуют массы. Их пример вдохновил другие повстанческие движения подражать им.\n\nСо всех сторон слышны прокламации против Тринити, и новые повстанческие группы возникают как грибы, готовясь к систематической войне.\n\nСегодня одна из таких групп официально объявила нам войну. Теперь мы должны сражаться на нескольких фронтах, и эта борьба потребует всех наших ресурсов. На кону выживание нашей академии. Обратного пути нет."
 TRN_collapse_event.3.baddesc: "Сегодня ещё одна повстанческая группа объявила нам войну. Мы вынуждены сражаться на нескольких фронтах, и эта борьба потребует всех наших ресурсов. Тотальная война за выживание академии началась."
 TRN_collapse_event.3.a: "Мы должны остановить их сейчас!"

 TRN_collapse_event.4.t: "Коллапс [FROM.GetName]"
 TRN_collapse_event.4.desc: "Ухудшение внутренней политической ситуации в [FROM.GetName] во время войны дало анти-Тринити повстанцам возможность реорганизоваться. Они объявили революционную войну против Тринити и уже активно сражаются.\n\nМы должны решить, признавать ли их или продолжать войну против них."
 TRN_collapse_event.4.a: "Они не виноваты."
 TRN_collapse_event.4.b: "Это осложнит дипломатию."

 TRN_collapse_event.5.t: "Воссоединение с Польшей"
 TRN_collapse_event.5.desc: "После ожесточённого сопротивления западная польская армия сумела изгнать захватчиков из Тринити и вернуть территорию. Теперь мы можем вернуться на нашу родину и построить новое будущее. Конечно, мы также могли бы объявить эту территорию своей и стать правителями запада."
 TRN_collapse_event.5.a: "Мы маршируем на запад."
 TRN_collapse_event.5.b: "Да здравствует Польша!"

 TRN_collapse_event.6.t: "Анти-Тринити сопротивление"
 TRN_collapse_event.6.desc: "Воспользовавшись недавним политическим хаосом, группы сопротивления, действовавшие в тени, наконец вышли на поверхность. Под лозунгом «анти-Тринити» они организуются, и, хотя их сила пока ограничена, их влияние быстро растёт.\n\nЕсли мы не устраним их сейчас, они скоро могут стать гораздо более серьёзной угрозой."
 TRN_collapse_event.6.a: "Подавить их немедленно."

 TRN_collapse_event.7.t: "Их последний вздох"
 TRN_collapse_event.7.desc: "Благодаря нашему быстрому подавлению мятежники поторопились объявить войну, не будучи полностью готовыми. Это наш шанс покончить с ними и восстановить порядок."
 TRN_collapse_event.7.a: "Это всё?"

 TRN_collapse_event.8.t: "Хаос подавлен"
 TRN_collapse_event.8.desc: "Благодаря нашим операциям по подавлению сопротивление снова ушло в тень, и все их пособники арестованы. Им потребуется много времени, чтобы снова появиться."
 TRN_collapse_event.8.a: "Хорошо."

