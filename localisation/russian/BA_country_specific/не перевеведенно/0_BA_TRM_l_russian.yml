 trinity_flavor_events.0.t: "Базовые импланты 1/2"
 trinity_flavor_events.0.desc: "\"Точно здесь?\"\n\n\"Да, так и есть. Согласно подтверждённой информации...\"\n\nЧёрная одежда и маски. И двое мужчин, вооружённых оружием, немного великоватым, чтобы называть его пистолетом, переговаривались перед домом, похожим на дворец. Они пришли глубокой ночью, чтобы напасть на Юридзоно Сейю.\n\n\"Уф... если мы просто откроем эту дверь, эта женщина там внутри, да?\"\n\n\"Да... похоже. Но точно ли это оружие сработает? А, ты не видел того раньше? Тем типам с ореолом на голове стреляешь, а им только больно, как будто из игрушечного пистолетика.\"\n\n\"Чёрт. Понятия не имею. Но посредник сказал, что она умрёт, так что... наверное, умрёт.\"\n\n\"Нет, всё равно... это слишком рискованно... Мы даже не знаем посредника. А если он нас подставил, чтобы убить?\"\n\n\"Что ты несёшь? Хватит вопить, открывай дверь.\"\n\nЩёлк. Клац.\n\nС довольно большой ловкостью мужчина быстро отключил замок, и они бесшумно проникли внутрь, обыскивая комнату за комнатой. Через несколько минут после начала они увидели кого-то, крепко спящего на кровати. Один сделал знак другому следовать за ним молча, и оба инстинктивно поняли, что нашли ту женщину.\n\nЗатем они начали безостановочно нажимать на курок. "
 trinity_flavor_events.0.a: "$GEH_event.40.a$"

 trinity_flavor_events.1.t: "Базовые импланты 2/2"
 trinity_flavor_events.1.desc: "Как только они подтвердили, что женщина на кровати спит, двое мужчин на мгновение переглянулись. Они интуитивно поняли, что это была Юридзоно Сейя, которую они искали. Один сделал знак другому и, бесшумно приблизившись, начал стрелять.\n\nВыстрелы разорвали ночную тишину. Но, вопреки всем ожиданиям, женщина поднялась, даже получив попадания. Как будто пули ей не вредили, её движения ничуть не замедлились.\n\n\"Что...? Почему она не умирает?\" Первый мужчина в отчаянии снова нажал на курок, но в этот момент женщина начала двигаться с невероятной скоростью. С активированным усилителем рефлексов центральной нервной системы она бросилась на них и, прежде чем они успели среагировать, выхватила оружие у одного из рук и швырнула его на пол.\n\n\"Чёрт... это... монстр!\" Второй мужчина закричал и попытался бежать, но его ноги уже не отрывались от пола: женщина схватила его за затылок и припечатала к стене.\n\nС ледяным взглядом она посмотрела на него сверху вниз и тихо сказала: \"Кто вас нанял?\"\n\nПервый попятился, но ему уже некуда было бежать. \"Гх... я не знаю! Пожалуйста... пощади!\"\n\nЖенщина отвела взгляд от него и уставилась на второго. Его глаза были полны паники. \"Чёрт, чёрт! Мы просто пришли за деньгами! Посредник... этот тип дал нам это оружие и сказал, что если мы тебя убьём, он даст нам кучу денег.\"\n\n\"Посредник?\" Голос женщины оставался спокойным, но резким. Когда она усилила давление руки, мужчина задыхался и кивнул.\n\n\"Да... посредник сказал... убить тебя. Я думал, это правда!\"\n\nЖенщина на мгновение замолчала. Как только они закончили говорить, она свернула шеи им обоим одновременно. Два тела безжизненно рухнули, и в комнате снова воцарилась тишина.\n\nЮридзоно Сейя бесстрастно посмотрела на их тела и равнодушно созерцала их. \"Посредник...\" Пробормотав это слово, она вышла из комнаты."
 trinity_flavor_events.1.a: "\"Посредник...\""

 trinity_flavor_events.2.t: "\"Посредник\""
 trinity_flavor_events.2.desc: "\"Вот наши требования.\"\nГолос мужчины был спокоен, но чувствовалось напряжение. Он положил документ перед женщиной. Внутри содержалось десять требований, предъявленных немецкими гражданами Академии Тринити.\n\nЖенщина посмотрела на него и погрузилась в молчание. На первый взгляд требования не казались чрезмерными. Они даже выглядели как очевидные права. Но внутри всё было не так просто. Приказы, полученные от верховного командования, крутились у неё в голове: никогда не уступать. И всё же она не могла понять, почему они должны быть такими непреклонными. То, что от неё требовали отказать даже в просьбах, которые можно было легко удовлетворить... эта жестокость вызывала у неё отвращение.\n\n\"....\"\nМолчание затянулось. Её пальцы медленно скользили по бумаге. Она подавила вздох и приняла решение.\n\n\"Хорошо. Я приму эти требования.\"\n\nСказав это, она сразу поняла, что её выбор вызовет гнев верховного командования. Однако она не чувствовала сожаления от того, что не оправдала их ожиданий. Она верила, что поступила правильно.\n\nМужчина улыбнулся. \"Спасибо. Для кого-то с такой внешностью вы были довольно добры.\"\n\nУслышав эти слова, женщина почувствовала нечто трудноописуемое. Добрая. Это слово эхом отозвалось в ней впервые за долгое время. Но она и сама не могла сказать, что её поступок проистёк из доброты. Единственное, что было ясно: в тот момент она действовала, исходя из убеждения, что поступила правильно."
 trinity_flavor_events.2.a: "\"Добрые слова кратки и легки для произнесения, но их эхо бесконечно.\" —Ральф Уолдо Эмерсон"

 trinity_flavor_events.3.t: "Посредник, за кулисами"
 trinity_flavor_events.3.desc: "Зал заседаний Академии Тринити погрузился в тяжёлое молчание. Взгляд верховного командования был прикован к одной точке: Кендзаки Цуруги. Дебаты по поводу её решения разгорелись, и теперь нужно было решать, снимать ли её с должности главы Оперативной группы правосудия.\n\n\"Это недопустимо\", повысил голос один из верховного командования. \"Мы отдали приказ, а она его не выполнила. Это нарушение нашего режима. Она не может здесь оставаться!\"\n\nКендзаки Цуруги хранила молчание. Казалось, она уже смирилась с неминуемым наказанием. Критика обрушивалась на неё, как лезвия, но она не дрогнула. Её поддерживало убеждение, что её решение было правильным.\n\nЗатем дверь тихо открылась. В ледяной напряжённости Кирифудзи Нагиса спокойно вошла. Её выражение лица было таким же безмятежным, как всегда. Слегка поклонившись, она тихо заговорила.\n\n\"Всё ли в порядке? Пока я слушала ваше обсуждение, я смогла немного упорядочить свои мысли.\"\n\nВерховное командование замолчало и повернулось к ней. Её спокойный тон привлёк внимание всех.\n\n\"Я думаю, стоит пересмотреть решение главы Кендзаки\", медленно продолжила Нагиса. \"То, что она сделала, было не просто неподчинением приказу: это был ответственный поступок, совершённый после полного понимания ситуации.\"\n\n\"Госпожа Кирифудзи, она ослушалась наших приказов\", возразил другой. \"Это простое неподчинение.\"\n\nНагиса едва заметно улыбнулась и склонила голову. \"Конечно, может показаться и так. Но иногда есть вещи важнее самого режима: сердца людей и справедливость. Глава Кендзаки приняла требования граждан, как раз учитывая это. Надеюсь, вы поймёте, что это был не просто бунт.\"\n\nВерховное командование больше ничего не могло сказать. Кендзаки Цуруги слегка опустила голову в знак благодарности. В этот момент тяжесть внутри неё, казалось, немного уменьшилась."
 trinity_flavor_events.3.a: "\"Лучше бедный, но умный юноша, чем старый, но глупый царь.\" —Екклесиаст 4:13"

 trinity_flavor_events.4.desc: "Тук.\nС чётким звуком чашка с чаем была поставлена на стол. Этот звук был единственным, что заполнило тихий кабинет. Кирифудзи Нагиса, с мягкой улыбкой, была погружена в свои мысли. Слабый аромат, поднимавшийся от чашки, окутывал её, но в её сознании плавали бесчисленные сомнения.\n\n'Кто же предатель в Тринити?'\n'С какой целью он это делает?'\n\nОна посмотрела на доклад в своих руках и снова перебрала уже упорядоченные имена. Она делала выводы и перепроверяла, но не находила чёткого ответа. Раскрыть личность предателя, угрожавшего Академии Тринити, было её миссией, и она должна была выполнить её безупречно.\n\n\"...Адзитани Хифуми, Урава Ханако, Сирасу Адзуса и Симоэ Кохару...\"\nПроизнося каждое имя, Нагиса на мгновение вспоминала их прошлое.\nХифуми, хотя говорили, что её оценка снизилась из-за пропуска экзамена после участия в партизанской презентации Пероро, на самом деле проявляла следы незаконной деятельности, связанной с 'чёрным рынком'.\nХанако привлекала внимание своим намеренным снижением оценок и непристойным поведением. Если вспомнить её блестящие достижения в прошлом, её нынешнее состояние было очень подозрительным.\nАдзуса уже была объектом наблюдения из-за своего жестокого прошлого и вооружённых беспорядков; а Кохару, хотя её низкая успеваемость была очевидной проблемой, также была под подозрением.\n\nНагиса привела мысли в порядок и приняла решение. Её взгляд на мгновение похолодел.\n\n\"Включите их в Класс дополнительных занятий. Эффективнее собрать мусор в одну корзину.\"\n\nОна отдала приказ мягким, но твёрдым голосом. Член Чайной вечеринки рядом с ней склонил голову и ответил:\n\n\"Да, понял, госпожа Нагиса.\"\n\nЧлен вышел, закрыв дверь. И тогда, снова, вернулась тишина.\n\nНагиса подняла чашку и едва смочила губы. Тепло чая коснулось её языка, и на её лице снова появилась безмятежная улыбка."
 trinity_flavor_events.4.a: "Ауу..."

 TRM_story_archive: "trinity_events АРХИВ ИСТОРИЙ"
 TRM_story_event.1.t: "Последний враг, который будет уничтожен — смерть"
 TRM_story_event.1.desc: "\n\n£GFX_texticon_BA_story_archive_trinity_picture_1\n\n\n\n\nТихая сельская деревня на окраине Тринити.\nКлаус Мюллер влюбился в женщину из Кивотоса и, после настойчивых ухаживаний, наконец сыграл свадьбу. Через несколько месяцев у пары родился сын: Михаил Мюллер, и казалось, что эта мирная жизнь продолжится.\n\n\"Михаил, помочь тебе?\"\n\"Ах, папа. Нет, я в порядке. Я могу сделать это сам.\"\n\"Да? Неплохо.\"\n\"Спасибо, папа.\"\n\nКлаус говорил, улыбаясь.\n\n\"Когда-нибудь ты превратишь это место во что-то невероятное. Мы с мамой уже сделали своё дело. С этого момента твоя очередь.\"\n\"...Может быть, это станет самой крутой фермой в стране.\"\n\nКлаус ответил, зажигая сигарету.\n\n\"Может быть.\"\n\n\"Клаус...? Клаус! Иди сюда на минутку!\"\nЕго жена, Судзуки Юи, была третьекурсницей Тринити, и после выпуска жила случайными заработками, пока не встретила Клауса. Сначала она была сбита с толку, но его искренние ухаживания тронули её; они начали встречаться и, после 'превышения скорости', в конце концов поженились. Она просто хотела обычной и спокойной жизни, а Клаус, обрабатывая землю, как его учил отец, хотел обещать ей стабильную жизнь.\n\nВ тот день, глядя, как обычно, на пейзаж за оградой, Юи вдруг увидела приближающихся женщин в чёрной униформе. Инстинктивно она поняла, что это Оперативная группа правосудия. В свои студенческие дни, особенно на первом курсе, когда она была проблемной, она часто сталкивалась с ними и сразу узнала эту униформу. Но теперь всё было иначе. На втором курсе она посвятила себя учёбе и стала примерной ученицей, признанной всеми. Поэтому появление Оперативной группы правосудия у её дома казалось странным и зловещим.\n\nКлаус почувствовал, что что-то не так. Он немедленно отвёл жену и сына в сарай. Оперативная группа правосудия окружила ферму и начала осторожный обыск.\n\n\"Слушай, Михаил. Юи. Садитесь на эту лошадь. Уезжайте сейчас же. Вам нужно спрятаться.\"\nКлаус прошептал, сажая жену и сына.\n\"Папа, поехали с нами!\"\nМихаил, готовый расплакаться, посмотрел на отца.\n\"Я поеду следом. Просто садись и не оглядывайся. Не беспокойся обо мне.\"\n\"Уезжай уже...\"\n\n\"Возвращайся живым, Клаус...\"\nЮи сказала дрожащим голосом.\n\n\"Может, и не смогу, Юи.\"\nКлаус сжал руку Юи и продолжил. Она, не говоря ни слова, поцеловала его в губы.\n\n\"Я люблю тебя.\"\n\"Я тоже.\"\n\n\"А теперь уезжайте! Но!\"\n\nКогда он хлопнул лошадь по крупу, она заржала и сорвалась с места.\n\nИз щели в сарае было видно снаружи. Агенты Оперативной группы правосудия с винтовками окружили место, а в центре был кто-то, похожий на следователя.\n\nКлаус открыл дверь сарая и медленно вышел. Стволы нацелились на него, но следователь не выстрелил. Вместо этого он спокойно заговорил.\n\n\"Клаус Мюллер. Это ты?\"\n\nВместо ответа Клаус осторожно сжал пистолет, спрятанный в пальто. Следователь посмотрел на него мгновение и продолжил:\n\n\"Значит, да. Ты забыл, что сделал восемнадцать лет назад? Видеть тебя здесь, в этом отдалённом поле, возделывающим землю... ну и ну.\"\n\nКлаус молчал. Следователь цинично усмехнулся и продолжил:\n\n\"Да. Оказывается, ты бывший эсэсовец. Твоё досье очень 'блестящее': двенадцать убийств и даже нападения. За это в обычном порядке — смертная казнь.\"\n\nТогда Клаус заговорил тихо.\n\n\"Это... было по вашей вине. Это вы сожгли наш дом, и с тех пор мой отец наполовину сошёл с ума и исчез... я до сих пор его не нашёл.\"\n\nСледователь покачал головой, как будто ему было всё равно, и ответил:\n\n\"Как печально, правда. Но это не оправдывает твоих убийств. Ты думал о семьях жертв?\"\nЕго тон был сухим, как у бюрократа, просматривающего старое дело. Ни эмоций. Ни сочувствия. Существовала только 'процедура'.\n\nКлаус больше ничего не сказал. Он вытащил пистолет. Движение было осторожным, но решительным. Он прицелился в следователя.\n\n\"Стоять!\" крикнул кто-то из Оперативной группы правосудия, но было уже поздно.\n\nБах!\n\nВыстрел разорвал тишину. Немедленно град пуль обрушился на Клауса. Оперативная группа правосудия ответила с идеальной дисциплиной. Следователь не получил ни одного попадания.\n\nКлаус Мюллер упал, пронзённый пулями. В последний раз он подумал о лице своей жены и голосе своего сына и остался лежать в тишине. Ствол всё ещё был горячим.\n\nСледователь, невозмутимый, остановился перед забрызганной кровью дверью сарая и перед трупом Клауса. Он достал сигарету, засунул её в рот и зажёг. Дым медленно пополз по его бесстрастному лицу.\n\nЗатем, когда они уходили, подчинённый спросил:\n\n\"Что будем делать с его женой и сыном?\"\n\nСледователь сел на заднее сиденье и посмотрел в окно. Его тон был холодным, равнодушным.\n\n\"Оставь их. Посмотрим, что они сделают.\"\n\nМашина уехала по просёлочной дороге, поднимая пыль. И в том месте, где мир был нарушен, осталась только тишина."

 TRM_story_event.2.t: "Помни мою семью."
 TRM_story_event.2.desc: "Жестоко эпическая месть Михаила Мюллера"