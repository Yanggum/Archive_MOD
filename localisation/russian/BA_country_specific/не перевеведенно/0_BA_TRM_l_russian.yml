 TRN_aftermath_desc: "Великое Перемещение. Относится к событию, в котором весь Кивотос — включая Тринити — попал в другой мир: Землю. То, что оно оставило после себя, заключалось в том, что большая часть промышленности Тринити была парализована или, из-за использования несовместимых с этим миром стандартов, вышла из строя в считанные дни.\n\nДо сих пор промышленность этого мира и Кивотоса достигла относительно схожего уровня, но последствия Великого Перемещения продолжаются и мучают нас."
