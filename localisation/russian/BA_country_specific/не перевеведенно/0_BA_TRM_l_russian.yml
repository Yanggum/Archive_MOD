 TRN_war_with_knight_templar: "Рыцари-тамплиеры"
 TRN_research_rifle: "Анализ доктрины германской армии"
 TRN_research_rifle_desc: "Стиль боя германской армии показался Тринити странным и в то же время глубоко впечатляющим. Молниеносные прорывные тактики, основанные на мобильности, произвели сильное впечатление на высшее командование Тринити и одновременно дали ему глубокое вдохновение. Вскоре эти идеи будут переосмыслены по-своему и возродятся как собственная уникальная доктрина Тринити."
 TRM_Centralised_Command: "Централизованный штаб"
 TRM_Centralised_Command_desc: "Централизованный штаб необходим для ведения войны. Любой другой метод, который может привести к катастрофе, должен быть любой ценой избегнут. Чтобы армия добилась успеха, генералы должны стать хорошо слаженным механизмом, способным уверенно и быстро вести к победе. Поэтому мы должны стремиться создать единую систему военного командования."
 TRM_encourage_radio_use: "Поощрять использование радиосвязи"
 TRM_encourage_radio_use_desc: "В прошлых войнах радио было внедрено как революционная технология, что значительно расширило дальность военных коммуникаций и существенно улучшило возможности управления и контроля на поле боя. В Тринити использование радио всё ещё находится на начальной стадии, но с небольшими усилиями мы сможем быстро применить эту новую технологию к нашим силам и наносить организованные и концентрированные удары по уязвимым местам врага."
 TRM_Streamline_Intelligence_Gathering: "Оптимизировать сбор разведданных"
 TRM_Streamline_Intelligence_Gathering_desc: "Сражаться с врагом, которого мы не понимаем, трудно. Централизация армии дала штабу глубокое понимание наших собственных сил, но понимание врага, находящегося по ту сторону, не менее важно. Все средства сбора этой информации должны быть интегрированы в военную структуру."
 TRM_Empower_the_Generals: "Наделить генералов полномочиями"
 TRM_Empower_the_Generals_desc: "За столетия гражданских войн генералы Тринити накопили огромный опыт, позволяющий им гибко реагировать на любую ситуацию. Всё, что им нужно, — это необходимые полномочия, чтобы правильно руководить армией, и чтобы те, кто находится под их командованием, умели слушать."
 TRM_Protectors_of_the_Motherland: "Защитницы Альма-Матер"
 TRM_Protectors_of_the_Motherland_desc: "Другие армии сражаются за золото, честь или безбожные идеологии, но армия Тринити сражается за академию и крест. Для многих иностранцев Тринити — благородная и таинственная академия юных леди, но для её студенток это дом без секретов. Студентки Тринити совершали великие и прекрасные подвиги на этой земле и будут совершать их впредь, и любая академия, которая поверит, что сможет завоевать эту землю, испытает огромный шок."
 TRM_Asymmetric_Tactics: "Тактика миссий"
 TRM_Asymmetric_Tactics_desc: "С древних времён непрозрачные и медлительные системы командования вызывали трудности и ускоряли тактические поражения. Во время гражданских войн столетней давности проблема решалась путём рассредоточения полномочий по принятию решений в подчинённые подразделения и поощрения культуры, в которой младшие офицеры, вместо пассивного ожидания приказов сверху, сами принимали тактические решения в соответствии с ситуацией на поле боя."
 TRM_Decentralised_Structure: "Децентрализованная структура"
 TRM_Decentralised_Structure_desc: "Традиционная военная мысль склонна почитать верховенство главнокомандующего, управляющего армией как фигурами на шахматной доске. Однако реальность войны грязна и сложна. Чрезмерно централизованная структура командования рискует стать жёсткой и негибкой перед лицом скорости современной войны. Более децентрализованная структура может избежать этих ловушек."
 TRM_Trinity_Field_Artillery: "Полевая артиллерия Тринити"
 TRM_Trinity_Field_Artillery_desc: "Полевая артиллерия Тринити пользуется выдающейся репутацией даже среди других академий. Благодаря высокой точности и подавляющей разрушительной силе обстрелянные районы буквально стираются с лица земли. Теперь, сотрудничая с Конструкторским бюро Эдема, мы должны ещё больше улучшить характеристики артиллерии Тринити и обеспечить ещё большую разрушительную мощь."
 TRM_Officer_Initiative: "Автономия офицеров"
 TRM_Officer_Initiative_desc: "Современная война — это сам хаос. Перспектива высшего командования и реальная ситуация на поле боя могут сильно различаться, и обстоятельства могут измениться за доли мгновения. Поэтому необходимо предоставить офицерам на передовой полномочия устанавливать цели и принимать ключевые решения. Таким образом, наша армия сможет быстро адаптироваться даже под давлением и эффективно реагировать. Это подчёркивает важность децентрализованной системы командования и представляет собой эффективную стратегию для преодоления неопределённости современного поля боя."
 TRM_unity_of_doctrine: "Унификация доктрины"
 TRM_unity_of_doctrine_desc: "Офицерский корпус Тринити обладает обширным опытом и большими способностями, но их подходы к военной доктрине чрезвычайно разнообразны. Реформа сухопутных войск была сосредоточена в основном на организационных проблемах, и генералы могли вести войну в соответствии со своими предпочтениями. Однако методы ведения операций сильно разнятся между офицерами, что неизбежно становится препятствием для достижения последовательного военного успеха."
 TRM_Reorganise_Armament_Production: "Реорганизовать производство вооружений"
 TRM_Reorganise_Armament_Production_desc: "Текущее состояние производства оружия, одним словом, катастрофа. Последствия Великого Перемещения всё ещё ощущаются. Производственные цепочки часто фрагментированы, устарели или и то, и другое, что не является подходящим условием для ведения боевых действий современной армии. Только путём тщательной реорганизации этой системы мы сможем гарантировать, что наши солдаты будут иметь оружие для борьбы с врагами Тринити."
 TRM_Expand_the_Logistics_Corps: "Расширить корпус тылового обеспечения"
 TRM_Expand_the_Logistics_Corps_desc: "Одним из самых больших уроков гражданской войны в Тринити было то, что для современной армии логистика важнее всего остального. Военная техника, специальные ресурсы, такие как топливо, и даже предметы первой необходимости должны поставляться вовремя; в противном случае армия не может существовать. Поэтому расширение армии должно обязательно сопровождаться расширением логистического аппарата."
 TRM_Local_Workshops: "Региональные мастерские"
 TRM_Local_Workshops_desc: "В эпоху индустриальной войны мы должны использовать все возможные средства для увеличения военного производства. Через систему региональных мастерских по всей стране мы можем организовать производство с учётом местных условий и расширить промышленность даже до самых маленьких поселений, где это возможно."
 TRM_Terrestrial_Dreadnoughts: "Расширение Танкового конструкторского бюро Эдема"
 TRM_Terrestrial_Dreadnoughts_desc: "Танковое конструкторское бюро Эдема — организация, обладающая одними из самых выдающихся технологических возможностей в Тринити и специализирующаяся на исследованиях, проектировании и массовом производстве высококачественных танков. Основываясь на глубоком понимании технологии бронетехники и многолетнем накопленном опыте, её превосходство признано во всём Кивотосе. Если мы ещё больше расширим эти мощности и усилим поддержку конструкторского бюро, Тринити сможет получить явное стратегическое преимущество в будущих танковых войнах."
 TRM_superb_training: "Верховная подготовка"
 TRM_superb_training_desc: "Сила армии зависит от боевой мощи каждого солдата. Как бы много ни говорили на войне о новых технологиях и революциях, для их использования неизбежно нужны солдаты; солдат, не обученный обращению с оружием, — не более чем крестьянин с ружьём. Армия Тринити должна стать лучшей в мире, и поэтому наши солдаты также должны быть обучены быть лучшими в мире."
 TRM_Expand_The_High_Command: "Расширение Верховного командования"
 TRM_Expand_The_High_Command_desc: "Верховное командование армии не может превратиться в социальный клуб элиты, как это было во время гражданской войны в Тринити. Исключительность и фракции, наносящие ущерб эффективности армии, не могут и не будут терпимы. Вместо этого мы расширим штаб, включив в него всех самых выдающихся командиров. Только лучшие из лучших могут возглавлять сильнейшую армию мира."
 TRM_Officer_Training_Academies: "Военные академии"
 TRM_Officer_Training_Academies_desc: "Хотя записи гражданской войны послужили учебниками для подготовки бесчисленных талантов, устаревшая структура военных академий часто была непригодна для передачи этих знаний армии. Мы должны реформировать академии, чтобы они могли правильно обучать методам современной войны не только генералов, но и младших офицеров."
 TRM_Combined_Arms: "Общевойсковой бой"
 TRM_Combined_Arms_desc: "Теория общевойскового боя представляется логическим завершением развития военных технологий. Одновременное использование комбинации пехоты, бронетехники, авиации и флота призвано создать идеальную гармонию боевых средств, способную создавать атаки, которые невозможно отразить. Это захватывающее видение."
 TRM_Mass_Breakthroughs: "Массовые прорывы"
 TRM_Mass_Breakthroughs_desc: "Бронетехника — это будущее. Благодаря технологическому развитию даже укрепления могут двигаться со скоростью, ранее считавшейся невозможной, при поддержке моторизованной пехоты в сопровождении танков. Чтобы создать подлинные современные бронетанковые силы, способные окружать и уничтожать вражеские дивизии с рекордной скоростью, мы должны поддерживать разработку новых танков."
 TRM_Land_Air_Integration: "Интеграция земли и воздуха"
 TRM_Land_Air_Integration_desc: "Несмотря на все сомнения в силе авиации, она, в конечном счёте, является вспомогательной силой. Независимо от её структуры или предназначения, дебаты о военной авиации неизбежно возвращаются к вопросу о том, как поддерживать сухопутные войска. Если мы будем верны этой философии, мы сможем создать военно-воздушные силы, которые умножат эффективность армии, обеспечивая поддержку в нужном месте и в нужное время."
 
 TRN_Luftwaffe: "Реорганизация Военно-воздушных сил Тринити"
 TRN_Luftwaffe_desc: "В том инциденте Военно-воздушные силы Тринити не оправдали ожиданий, и их пределы были болезненно обнажены. Однако мы высоко ценим доблесть и стиль ведения боя встреченной нами на поле боя немецкой люфтваффе и внедрим их дух и тактику в Военно-воздушные силы Тринити."
 TRN_Standardise_Pilot_Training: "Стандартизировать подготовку пилотов"
 TRN_Standardise_Pilot_Training_desc: "Военная авиация всё ещё сохраняет многие черты новой технологии, и одной из них является высокоимпровизированный способ передачи знаний. Из-за отсутствия унифицированной системы обучения считается, что опытные пилоты должны обучать технике по-своему. В результате среди наших пилотов сформировалась удивительно непоследовательная система знаний. Пришло время стандартизировать этот процесс."
 TRN_Promote_Amateur_Flying: "Поощрять любительскую авиацию"
 TRN_Promote_Amateur_Flying_desc: "Любительские пилоты стали растущим явлением: в последние годы многие гражданские лица начали летать как хобби, и некоторые даже достигли впечатляющих успехов, например, пересекли Атлантику, получив большую известность. Если мы будем культивировать и направлять этот народный образ, мы сможем расширить резервуар опытного персонала для наших военно-воздушных сил."
 TRN_Night_Witches: "Ночные ведьмы"
 TRN_Night_Witches_desc: "Известная лётчица предложила Военно-воздушным силам Тринити поразительную идею: авиационный полк, состоящий исключительно из женщин. Вопреки всем предрассудкам, есть некоторые офицеры, поддерживающие её план. Они утверждают, что это имеет огромную пропагандистскую ценность и может вдохновить других пилотов на новые смелые высоты во имя Тринити."
 TRN_Aviation_Bureaus: "Авиационные бюро"
 TRN_Aviation_Bureaus_desc: "Авиация — это тонкая технология. Недостаток, который на первый взгляд кажется незначительным, может привести к катастрофе в воздухе, и проектирование самолётов, способных выдерживать суровые условия боя, требует совершенства. Многие воздушные бои на самом деле решаются ещё до того, как самолёт взлетит. Создавая авиационные бюро по всей стране, мы сможем активно проектировать и испытывать более эффективные самолёты."
 TRN_Long_Range_Bombing: "Дальнее бомбометание"
 TRN_Long_Range_Bombing_desc: "По мере расширения границ авиационной технологии военные теоретики разработали радикальное применение этого: огромные дальние бомбардировщики, действующие над промышленными районами врага и обладающие достаточной огневой мощью, чтобы превратить фабрики в руины. Эта доктрина «стратегического разрушения» обещает полностью уничтожить военный потенциал врага, не вступая на его территорию."
 TRN_Transpolar_Flights: "Трансарктические перелёты Тринити"
 TRN_Transpolar_Flights_desc: "Близость к Арктике даёт нашей авиационной промышленности неожиданное преимущество: в мире мало мест, лучше подходящих для всесторонних испытаний самолётов. Активно организуя дальние испытательные полёты через полярные регионы, мы сможем проектировать самолёты, способные летать дальше, выше и быстрее любых других."
 TRN_Expand_The_Aircraft_Industry: "Расширить авиационную промышленность"
 TRN_Expand_The_Aircraft_Industry_desc: "У нас очень современная авиационная промышленность, но в основном она остаётся в частной собственности. Чтобы построить современные и мощные военно-воздушные силы, необходимо будет национализировать эту промышленность, интегрировать её в государственные органы и значительно расширить."
 TRN_Airspace_Defence: "Оборона воздушного пространства"
 TRN_Airspace_Defence_desc: "Нет ничего важнее обороны воздушного пространства, потому что враг будет пытаться использовать свои летательные аппараты всеми возможными способами, чтобы завоевать наши небеса и посеять ужас в сухопутных войсках. Защиты земли уже недостаточно. Чтобы победить, небо родины должно быть столь же неприступным, как и земля."
 TRN_Specialise_in_Ground_Support: "Специализация на поддержке с земли"
 TRN_Specialise_in_Ground_Support_desc: "Новые технологии открывают захватывающие возможности для разработки новых бомбардировщиков. Теперь летательные аппараты могут функционировать как высокомобильная артиллерия, нанося точные и разрушительные удары по позициям врага и развёртываясь в любой точке фронта гораздо быстрее любой традиционной поддержки. Это, несомненно, будущее военной авиации."
 TRN_Maintain_Tactical_Flexibility: "Сохранять тактическую гибкость"
 TRN_Maintain_Tactical_Flexibility_desc: "Развитие авиационной технологии открывает путь не только к более манёвренным, но и к более живучим самолётам. Некоторые школы теоретической мысли начали отстаивать новые «тактические» бомбардировщики: самолёты поддержки наземных войск с большим радиусом действия и живучестью, чем аппараты «ближней» поддержки. Такой тип бомбардировщика может выполнять миссии дальше от своих баз, в более суровых условиях и даже уничтожать вражеские сооружения."
 TRN_Jet_Engine_Experiments: "Эксперименты с реактивными двигателями"
 TRN_Jet_Engine_Experiments_desc: "До сих пор в истории авиации объекты тяжелее воздуха могли летать только с помощью пропеллеров. Однако передовая авиационная технология предполагает, что может быть возможна новая форма движения. Теоретически двигатель мог бы сжимать воздух, смешивать его с топливом и использовать эту смесь для создания тяги, обходя проблемы, присущие пропеллеру. Это звучит как явно безумная идея, но разумные идеи редко приводят к революционным прорывам."
 TRN_Death_From_Above: "Смерть с небес"
 TRN_Death_From_Above_desc: "Как мы хорошо знаем, третье измерение войны готово революционизировать военную технологию. Среди её огромных тактических и стратегических применений несомненно, что контроль над небом будет играть решающую роль не только в следующей большой войне, но и во всех грядущих войнах. Армия Тринити примет будущее: сыны и дочери родины больше не будут жалко увядать на земле, а обретут славу среди облаков."
 TRN_Create_The_Airborne_Force: "Создание воздушно-десантных войск"
 TRN_Create_The_Airborne_Force_desc: "Некоторые экспериментальные члены нашего Верховного командования предполагают, что механизация армии — лишь первый этап. Следующий этап — переброска пехоты не на кораблях и не на грузовиках, а на самолётах! Высаживая парашютистов в тылу врага, мы сможем изолировать вражеские подразделения и наносить удары по их пунктам снабжения. Эти новые воздушно-десантные войска станут остриём инноваций."
 TRN_We_Need_Helicopter: "Разработка вертолётов"
 TRN_We_Need_Helicopter_desc: "Летательный аппарат с вращающимся крылом, который, в частности, получает как подъёмную силу, так и тягу от основного ротора. В отличие от обычных самолётов, у которых крылья фиксированы или могут лишь слегка двигаться и которые приводятся в движение отдельными пропеллерами или мощностью двигателя, вертолёт летает, вращая сами крылья за счёт мощности двигателя. Поэтому эти крылья называются лопастями несущего винта, или вращающимся крылом."
 TRN_Naval_Bomber_Development: "Разработка торпедоносцев"
 TRN_Naval_Bomber_Development_desc: ""
 TRN_Carrier_Development: "Разработка авианосцев"
 TRN_Carrier_Development_desc: ""

 TRN_Take_To_The_Seas: "К морям"
 TRN_Take_To_The_Seas_desc: "Если мы хотим снова гордо возвышаться среди великих академий Кивотоса, мы должны построить новый современный флот, способный бросить вызов державам Европы и мира. Пришло время для России снова, ещё раз, стать военно-морской державой."
 TRN_Floating_Fortresses: "Плавающие крепости"
 TRN_Floating_Fortresses_desc: "Многие офицеры старой школы, основываясь на своём опыте гражданской войны в Тринити, верят в силу дисциплины и внушительную мощь дредноутов. Они утверждают, что эти огромные военные корабли должны оставаться основой нашего флота, как и во флотах других великих держав."
 TRN_Naval_Air_Coordination: "Взаимодействие флота и авиации"
 TRN_Naval_Air_Coordination_desc: "Некоторые из наших военно-морских офицеров посетили «мать» авиации Тринити, и это привело их к убеждению, что будущее морской войны принадлежит авианосцам. Эти корабли дороги, но эти офицеры утверждают, что, если разразится война, хотя морские сражения будут доминироваться дредноутами, вскоре они будут затмены огромной огневой мощью гигантских авианосцев и морских бомбардировщиков."
 TRN_War_Under_The_Sea: "Война под морем"
 TRN_War_Under_The_Sea_desc: "Возможно, авианосцы и линкоры — это будущее, но для [TRM.GetNameDef] сосредоточиться на этих колоссальных кораблях, возможно, нереалистично. Постройка большого флота дорога, и [TRM.GetNameDef] не обладает верфями и ресурсами для производства флота такого масштаба. Вместо этого мы должны сосредоточиться на подводных лодках: более дешёвых, но не менее смертоносных, способных нарушать морские пути снабжения врага."
