 TRN_inefficient_bureaucracy_idea_desc: "Административные проблемы, вызванные неопытностью заменённого персонала, были решены. Время, самое эффективное и безопасное решение, повысило мастерство наших людей. Мисоно Мика и её администрация теперь работают с высокопатриотичными, лояльными и профессиональными лицами. Хорошо собранный механизм продолжает усердно вращаться сегодня, ради развития Тринити."
 TRN_Inefficient_bureaucracy: "Административное управление: §RНеопытно§!"
 TRN_Inefficient_bureaucracy_desc: "В Тринити больше не осталось никого, способного помешать Мисоно Мике и её возвышенному делу. С благосклонностью она позволила тем, кто лелеял подрывные мысли, вернуться в лоно природы «надлежащими» методами. Однако, к сожалению, вакуум, оставленный этими некомпетентными предателями, вызвал больше проблем, чем мы ожидали. Мы заполняем эти должности лояльными людьми, чтобы восстановить административные способности правительства, но, похоже, им потребуется время, чтобы стать такими же компетентными, как раньше."
