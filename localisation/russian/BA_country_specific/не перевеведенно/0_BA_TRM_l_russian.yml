 TRM_event.1.t: "Чрезвычайное собрание Чайной вечеринки"
 TRM_event.1.desc: "\"Хмм? Нагиса-тян? Ты впервые звонишь мне в такое время... Что случилось?\"\n\"Мика... сейчас мы в опасной ситуации.\"\n\"Сейя права, госпожа Мика.\"\n\"Нагиса-тян...\"\n\nНагиса больше не могла терпеть и поддержала Сейю, прервав шутки Мики. Когда Мика наконец замолчала, Нагиса начала объяснять ситуацию.\n\n\"Наша академия... нет, весь Кивотос, попал в неизвестное место, возможно, из-за чьей-то шутки или сверхъестественного явления. Там люди, похожие на нас, но без ореолов, угрожали нам оружием на непонятном языке, но в конце концов нам удалось защититься. И пока мы сражались с жителями того другого мира, мы обнаружили, что и сами сталкиваемся со смертельной угрозой.\"\n\n\"Поэтому мы созвали это чрезвычайное собрание.\"\n\"У вас есть что сказать по этому поводу, госпожа Мика? Госпожа Сейя?\"\n\n\"Эм...\"\n\"Мне нечего сказать.\"\n\nНесколько мгновений прошло в молчании. Мика попыталась открыть рот, чтобы что-то сказать и разрядить обстановку, но слова не шли легко.\n\nТак закончилось Первое чрезвычайное собрание Чайной вечеринки."
 TRM_event.1.a: "..."

 TRM_event.2.t: "Чрезвычайная ситуация"
 TRM_event.2.desc: "Новость из студенческого совета быстро распространилась по всему Кивотосу. То, что та, кто всегда решала все проблемы, оставила свой пост и исчезла, было огромным потрясением, которое также достигло Тринити."
 TRM_event.2.a: "И одна женщина улыбнулась."

 TRM_event.3.t: "Второе собрание"
 TRM_event.3.desc: "\"На этом второе собрание объявляется закрытым...\"\n\"Уже закончили? Тогда я пошла!\"\n\"Мика...!\"\n\nКогда началось недоверие? Мисоно Мика после каждого собрания не только избегала последующего чаепития, но и быстро исчезала куда-то. Что ей не нравилось чаепитие... было бы странно, потому что Мика всегда была болтливой и весёлой девушкой, которую невозможно было представить избегающей чая с разговорами.\n\nЧто же на неё повлияло? С этим единственным подозрением Кирифудзи Нагиса начала готовить следующее собрание."
 TRM_event.3.a: "..."
 NAGISA_NOT_TRUST_MIKA: "\n§LКирифудзи Нагиса не доверяла Мисоно Мике, своей коллеге по Чайной вечеринке.§!"
 NAGISA_TRUST_MIKA: "§LБудучи её подругой детства, она верила, что Мисоно Мика на такое не способна.§!"

 TRM_event.4.t: "Доказательства"
 TRM_event.4.desc: "\"Госпожа Нагиса...! Мы нашли неопровержимые доказательства. Ещё не поздно...\"\n\nОдна из участниц Чайной вечеринки ворвалась в зал с отчаянным криком.\nНо её крик тут же заглушил резкий звук чего-то разбивающегося.\nВ наступившей тяжёлой тишине заговорила Кирифудзи Нагиса, одна из трёх лидеров, управлявших Тринити, и глава фракции Филиус.\n\n\"...Мы уже не в том положении, чтобы остановить это с помощью шатких доказательств.\"\n\nЭлегантного, невозмутимого и проницательного образа всегда доброй Нагисы больше не было.\nРука, державшая чашку, дрожала, и в голосе чувствовалась глубокая усталость.\nВместо того чтобы проявить своё обычное тёплое выражение к члену, искавшей её, её лицо было холодным и пустым, погружённым в отчаяние.\n\n\"Госпожа Нагиса... на кону будущее Тринити. У нас ещё есть шанс...\"\n\"...Нет. У нас больше нет никакого шанса... Триумвират уже закончился.\"\n\nПряча дрожащую руку, Нагиса устремила взгляд в окно.\nПод серым небом Тринити утратил свою жизненную силу, окутанный мрачной тишиной.\nПодчинённая, искавшая её, больше ничего не могла сказать и молча удалилась.\n\n\"...Мика... Чего ты на самом деле хочешь...?\""
 TRM_event.4.a: "Жребий брошен."

 TRM_event.5.t: "Закон об объединении"
 TRM_event.5.desc: "Территория Генны в настоящее время охвачена действиями анти-Тринити сил сопротивления и террористическими угрозами, совершаемыми студентками Тринити. В частности, западный регион Генны, Рейнская область, является ключевым промышленным центром как для Тринити, так и для Германии. Если мы не сможем оживить эти фабрики и использовать потенциальные природные ресурсы, вся пролитая кровь и жертвы будут напрасны. Поэтому мы должны любой ценой восстановить эти фабрики и тщательно исследовать все возможные ресурсы.\n\nТем временем растут голоса обеспокоенности среди внутренних бюрократов. Некоторые предупреждают, что эти решения могут подорвать основные ценности Тринити. Но время, когда правили только принципы, давно прошло. Мисоно Мика всегда отдавала приоритет прагматизму, принимая все свои решения на благо Тринити. Конечно, некоторые студентки могут возражать, но у нас нет времени. Вернуть ресурсы и промышленность Генны — это необходимый выбор для будущего Тринити."
 TRM_event.5.a: "Всё это ради блага Тринити..."

 TRM_event.6.t: "Во тьме"
 TRM_event.6.desc: "На окраине, далеко от центра Тринити. Ночь углублялась, и тусклый свет особняка плавал во тьме, как одинокий остров. Лидеры национал-социалистов и фракции Патер молчали, инстинктивно понимая, что означает эта встреча.\n\nДверь открылась, и появилась Мисоно Мика. Она не сказала ни слова, остановившись перед ними. Её яркая улыбка казалась такой же ледяной, как и её выражение. Её шаги были бесшумны, но казалось, что даже воздух становился тяжелее от её присутствия. Никто не осмелился заговорить. Все знали, зачем они здесь. Знали, что, хотя им казалось, что у них есть выбор, на самом деле его не было.\n\nМолчание затянулось. Атмосфера была удушающей. Никто не осмеливался проявить инициативу. Они пытались прочитать намерения Мики за её улыбкой, но ничего не могли разобрать.\n\nГлавный из них подавил чувство тревоги в груди и закрыл глаза, обдумывая свои варианты.\n\n'Неужели у нас нет другого выбора?'\n\nКогда он снова открыл их, холод в комнате стал ещё сильнее. Его разум был в хаосе. Исчезнувший лидер, рушащийся порядок и эта неизвестная союзница перед ним... Он снова и снова задавал себе этот вопрос. Неужели действительно не было другого пути? Это сомнение пожирало его.\n\nНо реальность была неумолима. Голоса врагов становились громче, и единственным способом выжить перед лицом Тринити, казалось, было это. Он понял, что Мика ждала этого момента: чтобы в своём отчаянии и смятении они в конце концов приняли её руку.\n\n'Чтобы выжить в Тринити... другого пути нет.'\n\nЕго решение было принято. Обратного пути уже не было. Он медленно кивнул, и наконец тишина была нарушена.\n\n\"Мы принимаем сотрудничество.\" Его голос был твёрдым, но он не мог скрыть скрывавшийся в нём страх."
 TRM_event.6.a: "У них не было другого выбора, правда~?"

 TRM_event.7.t: "Первая подпись"
 TRM_event.7.desc: "После двух недель подготовки офис, оформленный по вкусу Мики, впервые наполнился всеми ответственными лицами и чиновниками. Офис, прежде тихий, теперь был переполнен, и Мика, сидящая в центре, чувствовала лёгкую неловкость. Хотя она любила людей, столько незнакомцев вокруг было для неё удушающе.\n\nВ этой неловкой атмосфере наконец наступил момент, которого все ждали. На латунном подносе, рядом с элегантным пером, ей представили первый документ для подписи как единоличной правительнице Тринити. В окружении временно назначенных ответственных лиц Мика начала своё представление. С улыбкой более живой, чем у её предшественницы, она официально подписала свой первый документ. Вспышки камер следовали одна за другой, и вокруг раздавались аплодисменты.\n\nДля Мики ситуация не казалась такой уж плохой. Никто, казалось, не заботился о том, что содержание документа отправляло кого-то прямо в ад."
 TRM_event.7.a: "Неплохое начало"

 TRM_event.8.t: "Одним пером..."
 TRM_event.8.desc: "Мисоно Мика отправляла ключевых фигур фракции Патер как можно дальше от Эдема. Было ли это за границу и как с ними там обойдутся, её не волновало. В конце концов, она решила, что ради Тринити готова на всё, и их благополучие её совершенно не заботило."
 TRM_event.8.a: "Выражаем им свои соболезнования."

 TRM_event.9.t: "Доклад"
 TRM_event.9.desc: "Мисоно Мика, в очках, смотрела на лист со списком имён, подозреваемых в сотрудничестве с евреями. Она подняла взгляд. Комната была полна старых и заплесневелых книг и газет. В тёмном углу — пыльный и ржавый граммофон. Эта сцена вызвала у Мики озорную улыбку.\n\nЗвонок вывел её из раздумий. Вошли двое коренастых мужчин в униформе национал-социалистической партии. Один наклонил корпус, его светлые волосы виднелись из-под фуражки. У другого было крепкое тело и выступающий живот. Они отдали честь, громко стуча сапогами об пол.\n\nПосле неловкого молчания Мика заговорила с ними. \"Что случилось...?\" Они ответили твёрдым голосом, докладывая об именах, подвергнутых чистке в тот день. Мика выдавила улыбку и, неловко официально, сказала:\n\n\"Спасибо. Можете идти.\"\n\nНо они не двинулись с места.\n\nМика спросила их:\n\n\"Почему вы не уходите?\"\n\nОдин из них, теребя орла на груди, ответил:\n\n\"Обнаружено, что Кирифудзи Нагиса сотрудничала с евреями.\"\n\nМика ничего не могла сказать. Наконец она пробормотала:\n\n\"Это... всё равно...\"\n\nЕё голос дрожал, и лица мужчин окаменели. Самый коренастый шагнул к ней. Мика невольно вздрогнула.\n\nСпокойным, но твёрдым голосом он сказал:\n\n\"Мы обо всём позаботимся. Просто скажите слово: 'действуйте'. Поняли?\"\n\nКогда замок на двери щёлкнул, Мика с облегчением опустилась в кресло."
 TRM_event.9.a: "Как всё спокойно."

 TRM_event.10.t: "Тишина в радио"
 TRM_event.10.desc: "22:00. По радио только тишина. Обычно в это время передавали бы сообщение о закрытии вещания, но сегодня вместо этого тишина наполнила комнату. Как будто пытаясь что-то сказать."
 TRM_event.10.a: "Ребёнку приснился кошмар."

 TRM_event.11.t: "Велик успех"
 TRM_event.11.desc: "В прошлом году, когда иудео-большевистская тень и тень Генны покрывали небо и тьма нависала,\nя осмелился мечтать о пылающей нити Тринити.\nВ мире, управляемом страхом и где надежда, казалось, исчезала,\nя хотел вернуть цену, уплаченную жестокими.\n\nЯ взял чернила как оружие и сплетал мощные слова,\nвосстание поэта, шепчущая борьба.\nКаждая строка была криком о справедливости, интенсивные и искренние слова,\nпронзавшие сердца тех, кто пытался завоевать Тринити.\n\nЯ писал дерзкие и смелые стихи сопротивления,\nсочинял мятежную симфонию, даже если моя история останется неизвестной.\nНа страницах, запятнанных чернилами, я запечатлел свою мольбу\nо будущем, где все могли бы быть свободны.\n\nМои письмена танцуют, как светлячки, освещающие путь,\nмы должны пройти эту опасную ночь, сотрясающую мужество.\nЯ шептал о сладостной благодати единства и любви,\nи о силе и крепких объятиях нашей нации.\n\nИ тогда я встретил великую Королеву Мику,\nпылающее пламя, маяк столь яркий, что ведёт нас даже в самую тёмную ночь.\n\nЯ присоединюсь к Тринити, чтобы бросить вызов тем, кто нас угнетает.\n\nОпасность велика, и мы должны встретить её лицом к лицу, но мы, Тринити, объединимся, явив мощное единство. Потому что дух Патер не может быть задушен и останется навечно в сердцах угнетённых.\n\nИтак, великий лидер,\nпусть эти слова звучат как твёрдый барабан\nв сердцах уставших и молчаливых.\nПусть они находят утешение и силу в каждой строке,\nпусть наши голоса переплетутся и сольются в единый.\nНаш успех — доказательство силы внутри студенток Тринити и немцев.\nМы поднимемся едиными против ярма тирании,\nнаша борьба не будет напрасной."
 TRM_event.11.a: "- Лени Рифеншталь, «Славные дни»-"

 TRM_event.12.t: "Похвала директора"
 TRM_event.12.desc: "До прихода президента Мисоно Мики нас обманывали пустые ораторы. Но президент Мисоно Мика была другой. Её речь, полная харизмы, возродила нашу гордость, напоминая о славном прошлом Тринити.\nМы готовы на любые жертвы ради её видения. Под её руководством Тринити станет великим, и для этого другие академии должны быть принесены в жертву.\nШалэ, Алая Зима, Шаньхайцзин, Генна — все они mere препятствия на пути к славе Тринити. Особенно те, кто нас угнетал, должны быть устранены.\nТе, кто следует за президентом Мисоно Микой, войдут в историю. Под её руководством мы станем сильнее и величественнее.\nНаша верность принадлежит только президенту Мисоно Мике и Тринити. Всё остальное вторично.\nДа здравствует великая президент Мисоно Мика!"
 TRM_event.12.a: "Из «Похвалы директора»"

 TRM_event.13.t: "Теория лидерства Тринити"
 TRM_event.13.desc: "Президент Мисоно Мика появилась в роскошном зале с властным видом. Её взгляд отражал решимость и чувство долга, в окружении верных советников.\nЕё речь началась с подчёркивания долгой истории и традиции Тринити. Она объявила себя «хранительницей нации», заявив, что берёт на себя ответственность вести Тринити.\nАвтор — я — был глубоко впечатлён её лидерством и выразил полную поддержку её видению. Веря, что «цель оправдывает средства», я утверждаю, что любой метод допустим, если он гарантирует процветание Тринити.\nЯ утверждаю, что жертва необходима ради «явного предначертания» Тринити и что национальное процветание будет достигнуто только коллективными усилиями и преданностью.\nКак автор, я считаю Мику единственным лидером, способным направлять будущее Тринити, и исповедую сильную верность и преданность ей."
 TRM_event.13.a: "- Отто Штрассер, глава 2 «Теории лидерства Тринити»-"

 TRM_event.14.t: "Решение проблемных"
 TRM_event.14.desc: "Провалы из-за низкой успеваемости, прогулки в школьной форме, аресты за вооружённые беспорядки, повторные отстранения... Класс дополнительных занятий полон проблемных.\nНо на самом деле это место, где собраны те, кто подозревается в предательстве Тринити. Мы должны быстро с ними разобраться."
 TRM_event.14.a: "Исключить их."
 TRM_event.14.b: "Позволить им вернуться к нормальной жизни."

 TRM_event.15.t: "Победа в битве за Эдем — Конец многовекового конфликта"
 TRM_event.15.desc: "После тяжёлой войны наши силы полностью сломили врагов Генны и вернулись с победой. Хотя некоторые студентки Генны настаивают на продолжении сопротивления, они больше не представляют серьёзной угрозы для нашего господства.\n\nКонфликт между Тринити и Генной уходит корнями в глубь веков. Хотя в последнее время он, казалось, утихал, ненависть оставалась скрытой и в конце концов вылилась в войну. К счастью, мы победили, и теперь будем работать над искоренением этой ненависти.\n\nНастал час нашей гегемонии! Заря истинного Тринитического мира прозвучит по всему континенту. Под нашим благожелательным правлением мир и процветание будут цвести. Страны Европы будут всё больше уважать наше влияние, хотят они того или нет.\n\nКонечно, наша борьба не заканчивается здесь. Мы должны двинуться дальше континента и установить нашу гегемонию во всём мире. С нашим культурным влиянием и военной мощью мы бросим вызов великим державам и утвердим себя как истинная мировая держава."
 TRM_event.15.a: "Тебе венец победы!"

 TRM_event.16.t: "Самый тёмный час"
 TRM_event.16.desc: "Королева поднялась на трибуну, но никто не встретил её приветственными возгласами.\nДаже фракции Филиус, Санктус и Патер смотрели на неё со страхом.\nПриглашённые местные жители, присутствовавшие на речи, не были исключением.\nПосле недель кровавых дней лишь немногие робко аплодировали.\n\nПоднявшись на трибуну и окинув довольным взглядом собравшуюся публику, Мисоно Мика обратилась к ним с первым приветствием.\n\n\"Всем привет~☆\"\n\nЭто радостное приветствие застало всех врасплох.\nЭто было не то поведение, которое можно было ожидать от той, кто заставил исчезнуть столько студенток Тринити и членов Чайной вечеринки.\nВ замешательстве и страхе все наблюдали за ней.\n\n\"Хе-хе~ Испугались? Не бойтесь, я вас не съем~\"\n\nБеззаботно она отодвинула речь в сторону и продолжила говорить с равнодушным видом.\n\n\"Сегодня я собрала вас, чтобы... сделать своего рода заявление. Вы, наверное, удивились, когда исчезли некоторые знакомые лица, да? Это потому, что они были... паразитами.\"\n\"Па...разитами?\"\n\"Да, паразитами. Для тех, кто жил здесь, они были как евреи.\"\n\nНемцы в зале неловко зашептались.\nНа мгновение они увидели в ней образ кого-то, кого их страна потеряла.\n\n\"Так что я устранила их всех~, теперь Чайная вечеринка будет работать только на Тринити.\"\n\nСильно ударив по трибуне, она вернула внимание к себе.\nОна оглядела потеющих и сглатывающих слюну присутствующих и широко им улыбнулась.\n\n\"Так что, пожалуйста, рассчитывайте на меня~☆\""
 TRM_event.16.a: "Вне государства нет ничего. - Бенито Муссолини"
 
 TRM_event.17.t: "Суд"
 TRM_event.17.desc: "Злоба была очевидна.\nСлушание, предназначенное для изгнания одного человека со сцены.\nПрисутствующие студентки и законодатели изливали свой яд на Кирифудзи Нагису в центре.\n\n\"Слабость Нагисы привела нас к этой ситуации!\"\n\"Мы отвергаем унизительный мир!\"\n\nФракция Патер возглавляла обвинения.\nДругие фракции только наблюдали, уже без сил.\nДве другие главы Тринити были раздавлены Микой.\n\nНо Нагиса оставалась спокойна.\nОна знала, что исход уже предрешён.\nСо своим обычным видом она положила конец этой скучной фарсе.\n\n\"Прошу прощения, но я думаю, это слушание пора заканчивать.\"\n\"Вы не видите, что процесс ещё идёт, свидетельница?\"\n\"Но конец уже предрешён, не так ли?\"\n\nОна встала и посмотрела в конец длинного коридора.\nСквозь витраж над дверью проникал тёплый свет.\nНастало время актрисе покинуть сцену.\n\n\"Пожалуй, я удалюсь первой. Мне нужно осмотреть свою новую комнату. Мир вам.\"\n\nС лёгкой улыбкой она медленно пошла к двери.\nЕё провожали солнце и ветерок, а не люди."
 TRM_event.17.a: "Ангел пал."

 TRM_event.18.t: "Падение"
 TRM_event.18.desc: "Что-то было явно не так.\nПо крайней мере, так она думала.\nЗа несколько часов до этого она мечтала взойти как новое солнце Тринити.\nНо теперь её тащили солдаты Чайной вечеринки.\n\nВ безлунной тьме она быстро размышляла.\nНагиса вернула власть? Переворот Филиус или Санктус?\nНевозможно.\nОбе были разорваны Микой и Патер.\n\nИстина скоро открылась.\nВ подвале, куда её привели, была Мисоно Мика.\n\n\"Моя... Мика-сама...? Это, должно быть, ошибка! Почему я...?\"\n\"Хмм? А ты кто? Они все для меня на одно лицо~\"\n\nНа её лице исчезла надежда.\nВ одно мгновение она упала на дно, морально уничтоженная.\n\n\"Хм... просто никчёмная плесень. Отправьте её на шахты.\"\n\nОдна из бывших руководительниц Патер исчезла в холодной тьме.\nМика перевернула страницу.\nВ списке было ещё много имён."
 TRM_event.18.a: "Самый надёжный всегда первым под подозрением. - Иосиф Сталин"

 TRM_event.19.t: "Пустая резиденция"
 TRM_event.19.desc: "Человек направился в резиденцию.\nОн должен был доложить о перегибах штурмовых отрядов и проверить, почему нет ответа.\nОн думал о недавних зверствах: тех маргиналах в униформе и с властью, стрелявших в студенток, связанных с евреями, в то время как Департамент юстиции бездействовал.\n\nВсе знали, что это безумие нужно остановить.\n\nОн прибыл в резиденцию и открыл дверь.\n\nОн нашёл только разлетающиеся бумаги и разгромленные комнаты — признаки сопротивления."
 TRM_event.19.a: "Где они?"

 TRM_event.20.t: "Охота на оппонентов"
 TRM_event.20.desc: "С лишением Нагисы власти фракция Филиус была на грани краха. Они выбрали нового представителя и замышляли вернуть влияние, но их всегда нейтрализовал Патер.\n\nНаконец они решили атаковать. Подготовили план и двинулись на Патер.\n\nВскоре они почувствовали неладное. Атмосфера была тревожной. Они приказали остановиться и попали в засаду, устроенную десятками тех, кто уже знал их план. Они потерпели поражение, и я понял, что наша судьба решена."
 TRM_event.20.a: "Утечка информации была ошибкой?"

 TRM_event.21.t: "Передача"
 TRM_event.21.desc: "Она не могла этого понять.\nМисоно Мика, уронив перо и поднимаясь с удобного кресла, просто не могла этого понять.\nНа столе лежала ещё не начатая речь.\nПочему она должна делать эту нудную работу?\n\nЗа последние дни она устранила так много людей, что даже не помнила точного числа.\nБлагодаря этому в Тринити не осталось организации, способной ей противостоять.\nМожет быть, Сестринство, но эти старомодные монахини даже не заботились о политике.\n\nТак что эта речь была не нужна.\nНе осталось никого, кто мог бы жаловаться на её слова или действия.\nА тот, кто осмелился бы, оказался бы в месте, где никогда больше не увидит солнечного света.\nТем не менее, её помощники настаивали, что это необходимо.\n\nСкучая, Мика вышла из офиса и пошла по старым коридорам.\nОна подумывала отправить этих настаивающих помощников куда-нибудь подальше, когда её глаза встретились с чем-то в конце коридора.\n\nПортрет, который ещё не был убран, изображающий фальшивую тёплую улыбку другой лидерши Тринити.\nГлядя на него с некоторым отвращением, Мика улыбнулась, вспомнив кое-что."
 TRM_event.21.a: "Ах~ точно, так и будет." 
 
 TRM_event.22.t: "Кровавые пятна"
 TRM_event.22.desc: "Департамент юстиции всегда следил за порядком в Тринити, но теперь он не имел никакой власти.\nТак что, даже когда студентки в чёрной униформе, называемые «штурмовыми отрядами», уводили местных жителей, называемых «евреями», Департамент юстиции ничего не мог сделать. Даже она, простая участница.\nТе маргиналы в чёрной униформе, которые стреляли на улицах и важничали, были неприкасаемы.\n\n-Бах!\n\nВыстрел раздался поблизости.\n\nОна огляделась.\n\nТела, пробитые пулями, и кровавые пятна покрывали улицу, и задачей членов Департамента было убирать их.\n\nСлушая смех штурмовиков, она медленно пошла убирать трупы."
 TRM_event.22.a: "Они не знают, что такое порядок?"

 TRM_event.23.t: "Что-то подозрительное"
 TRM_event.23.desc: "-Бах!\n\nВыстрел прогремел на улице.\n\n-Тьфу, испачкал мне одежду.\n\nДевушка с выражением отвращения пнула труп у своих ног, держа в руке оружие.\n\nСделал ли этот труп что-то плохое?\nОтвет был прост.\n\nОн был евреем. Это было его «преступление». Он ничего ей не сделал.\n\n...Его единственным грехом было то, что он не носил звезду.\n\nОна поискала вокруг другую жертву.\nИ тогда улыбнулась.\nСчастливо.\nДля студентки-маргиналки, отвергнутой Тринити, эта власть была сладка.\n\n-Топ-топ-топ...\n\nВ этот момент она почувствовала чьё-то присутствие за спиной.\n\nОна поспешно обернулась, но там никого не было."
 TRM_event.23.a: "Я точно уверена, что что-то двигалось…"

 TRM_event.24.t: "Расширение полномочий"
 TRM_event.24.desc: "Обсуждается вопрос о власти Департамента юстиции Тринити, который номинально является автономной полицией и добровольческой организацией, но на самом деле является вооружённой силой. Что будем делать?"
 TRM_event.24.c: "Если дать им власть, они могут стать помехой потом."
 TRM_event.24.b: "Создать корпус личной охраны прямого подчинения."

 TRM_event.25.t: "Агитация"
 TRM_event.25.desc: "Единственная власть в Тринити, Мисоно Мика, поднялась на подготовленную трибуну.\nВопреки нервным взглядам публики, она появилась, улыбаясь как ребёнок, играя с микрофоном и говоря лёгким и весёлым тоном.\n\n\"Ахаха~ почему такие лица? Съели что-то не то?~☆ Я понимаю~ Вы сбиты с толку исчезновением Нагисы, да? Но у меня были на то причины~\"\n\nПока она игриво покачивала ногой, атмосфера постепенно расслаблялась, и некоторые даже улыбались.\n\n\"Но Тринити и весь Кивотос в опасности, не так ли? Такой абсурд, кто бы в него поверил? Вся академия телепортировалась!~☆\"\n\nРобкий смех в толпе.\nНо следующее заставило всех замереть.\n\n\"А студенческие советы? Что они сделали?\"\n\"Ничего!\"\n\nКто-то крикнул из публики.\n\n\"Именно! Они только заботились о своём благополучии, даже не думали об обычных студентках. Некоторые рогатые демоны даже начали внутренние войны, забыв о своём предназначении!\"\n\"Мерзкие демоны Генны!\"\n\nТолпа начала воодушевляться.\n\n\"И Генеральный совет тоже! Только палец о палец ударили, пока всё разваливалось. Смехотворно!\"\n\"Бесполезные!\"\n\"Разогнать Генеральный совет!\"\n\nНе только Тринити. Весь Кивотос услышал эту речь и понял, что Мика планирует захватить всё.\n\n\"Итак, во имя Отца, Сына и Святого Духа… только Тринити может успокоить этот хаос.\"\n\nПоследний крик безумия и ненависти затопил весь Кивотос. Все почувствовали, что кровавый ветер скоро подует на них."
 TRM_event.25.a: "Ненависть и гнев — самое мощное оружие масс."

 TRM_event.26.t: "Конец первого акта"
 TRM_event.26.desc: "Человека, которого когда-то уважали как политика, больше не существовало.\nОн видел, как те, кто называл себя Троицей, объединились с остатками национал-социализма и разорили Германию.\nПропагандистские флаги закрывали его историю и культуру, а трубы громкоговорителей заглушали скрипки.\n\nПоэтому он закрыл окна и уши.\nНо сегодня другой шум заставил его отдёрнуть штору.\n\nНа улице толпа приветствовала нового лидера и размахивала флагами. Кошмар поглотил Европу.\n\nОн рухнул на пол, охваченный отчаянием. На мгновение он почувствовал облегчение от того, что всё кончено… но он, знавший политику, понимал это лучше всех.\n\nМашины, движимые ненавистью, не остановятся, пока не уничтожат всё, включая себя.\n\n\"…Не закончилось… ещё не закончилось!\"\n\nВздох старика исчез во тьме."
 TRM_event.26.a: "Начинается второй акт"
 TRN_endsieg_event_tt: "§tКивотос объединён под жестокой властью. Никто не знает, как долго продлится правление Ночной Королевы, но тьма покрывает всех.§!"

 TRM_event.27.t: "Кампания по очернению Генны"
 TRM_event.27.desc: "После победы Тринити в войне по приказу Мисоно Мики знаковые здания Генны были снесены или перестроены в стиле Тринити. Блестящая промышленность, построенная Сорасаки Хиной, была демонтирована и перенесена.\n\nАмано Ако могла только беспомощно наблюдать. После смерти Хины у неё ничего не осталось. Она ненавидела Тринити и тех, кто отнял у неё счастье. Но у неё не было силы Хины.\n\n-Бум!\n\n\"Ха-ха-ха! Это было здорово!\"\n\nОна отпустила руки. Надежду.\n\nАдминистраторша, некогда помогавшая справедливой революции Хины, исчезла в глубокой пустоте."
 TRM_event.27.a: "Не оставляйте следов."

 TRM_event.28.t: "Антикоммунистический пакт"
 TRM_event.28.desc: "С Антикоммунистическим пактом [From.GetNameDef] установила дипломатическую базу для противостояния Алой Зиме. Но этот пакт не включает военный союз и чёткие обязательства. [From.GetLeader] предлагает расширить его до формального союза против Алой Зимы.\n\nЭто разорвёт всякую дипломатию с ними, но это шанс обеспечить мощный блок союзников."
 TRM_event.28.a: "Мы будем противостоять Алой Зиме вместе с Тринити и её союзниками."

 TRM_event.29.t: "Коллапс Тринити"
 TRM_event.29.desc: ""
 TRM_event.29.a: "Предки…"

 TRM_event.30.t: "Финальный ультиматум Тринити!"
 TRM_event.30.desc: "Ультиматум предлагает, что если они сдадутся и согласятся быть марионетками, войны между нами не будет и будет подписан пакт о вечной дружбе."
 TRM_event.30.a: "Убирайтесь!"
 TRM_event.30.b: "Я сдаюсь, только дайте мне жить!"

 TRM_event.31.t: "[FIN.Getname] отверг наши требования"
 TRM_event.31.desc: ""
 TRM_event.31.a: "Мы должны рассмотреть военное вмешательство."
 
 TRM_event.32.t: "[FIN.Getname] принял наши требования" 
 
 TRM_event.34.t: "Поздняя ночь"
 TRM_event.34.desc: "Под тёмным ночным небом силуэты армии Тринити тихо приближались к границе Генны. Огни пограничных постов слабо мерцали, пока напряжение наполняло воздух.\n\nВнезапно авангард Тринити пересёк границу. В то же мгновение оглушительный взрыв разорвал ночную тишину. Небо озарилось огнём, когда начался обстрел Тринити.\n\nОборона Генны быстро погрузилась в хаос. Застигнутые врасплох, солдаты получили приказ отступать, не успев среагировать. Под градом снарядов армия Генны начала организованное отступление.\n\nУкрепления и контрольно-пропускные пункты рушились один за другим. Танки и пехота Тринити прорывались сквозь бреши, продвигаясь на территорию Генны. Хотя солдаты Генны продолжали сопротивляться при отступлении, они были отброшены всё дальше подавляющей огневой мощью Тринити.\n\nВойна началась. Ночь, начатая внезапной атакой Тринити, станет сигналом начала долгой войны для обеих стран."
 TRM_event.34.a: "В атаку!"

 TRM_event.35.t: "Администрирование территории Генны"
 TRM_event.35.desc: "После победы в войне против Генны мы начали обсуждать будущее завоёванной территории."
 TRM_event.35.a: "Великая победа!"

 TRM_event.36.t: "Пропаганда"
 TRM_event.36.desc: "Граждане Генны!\n\nНаша родина в опасности. Незаконное вторжение Тринити угрожает нашему мирному образу жизни. Но мы никогда не сдадимся.\n\nИстория Генны — это всегда история свободных студенток, преодолевающих угнетение. Сейчас, как никогда, мы должны оставаться едиными.\n\nЧтобы защитить нашу свободу и суверенитет, нам нужны силы каждого. Солдаты на фронте и гражданские в тылу должны выполнить свой долг.\n\nТринити недооценил нашу волю. Мы покажем им истинную силу Генны.\n\nВосстанем за нашу землю, наши семьи и наше будущее! Единые в духе Генны, мы преодолеем этот кризис.\n\nМы победим! Да здравствует Генна!"
 TRM_event.36.a: "Победа Генне!"

 TRM_event.38.t: "Специализация Департамента промышленного развития"
 TRM_event.38.desc: "На заре своего существования Департамент промышленного развития Тринити реализовал различные экспериментальные политики, накапливая опыт. Эти эксперименты, с успехами и неудачами, послужили повышению профессионализма и мастерства департамента.\n\nВ настоящее время департамент ищет новую экономическую систему, сочетающую преимущества рыночной экономики и плановой экономики. Извлечённые уроки значительно улучшили его способность формулировать и реализовывать политику, сделав его ключевой опорой экономики Тринити. Управляя государственными предприятиями и контролируя частный сектор, его инновации ещё больше продвинули экономику Тринити."
 TRM_event.38.a: "Выпьем за Тринити, по крайней мере сегодня!"

 TRM_event.39.t: "Хор"
 TRM_event.39.desc: "В величественном зале Мика начала свою речь, полную страстной враждебности к Генне и восхваления величия Тринити.\n\n\"Генна построена на жадности, коррупции и нарушенных обещаниях, ценой страданий студенток!\" Слова Мики подняли дух публики.\n\n\"Мы должны противостоять им. Война с Генной неизбежна! Потому что они по своей природе демоны!\" Слушатели отреагировали с энтузиазмом, некоторые подняли руки в приветствии.\n\n\"Мы победим! Мы пойдём вперёд! Слава продолжится!\" — заключила Мика.\n\nЗатем зазвучал гимн Тринити. Сначала поднялся один немец, затем член Департамента юстиции, монахиня, человек в форме…\n\n\"Войска маршируют твёрдым шагом\"\n\"Товарищи, убитые демонами Генны\"\n\"Маршируют с нами в духе\"\n\nВскоре весь зал участвовал в хоре. Члены разных организаций пели с воодушевлением.\n\n\"День свободы и хлеба приближается\"\n\nВсе взгляды устремились на Мику, с преданностью и любовью. Она ответила им глубокой улыбкой, с твёрдой уверенностью, что будущее принадлежит Тринити."
 TRM_event.39.a: "Флаги Тринити скоро будут развеваться повсюду! Тринити будет вечен!"

 TRM_event.40.t: "Поглощение остатков армии"
 TRM_event.40.desc: ""
 TRM_event.40.a: "Я торжественно клянусь перед Богом в безусловном послушании Мисоно Мике…"

 TRM_event.41.t: "Обеспокоенность застоем на фронте"
 TRM_event.41.desc: "\"Секретарь, доложите обстановку.\"\n\n\"Да. Это вызывает беспокойство. Некоторые планы увенчались успехом, но неожиданное сопротивление помешало другим.\"\n\"И нет способа это решить?\"\n\n\"Мы пока не знаем…\"\n\nМика молча слушала, обеспокоенная недавними трудностями. Секретарь, которой она доверяла, казалась неуверенной.\n\n\"Вы точно не знаете, в чём проблема?\"\n\nСекретарь разочарованно кивнула. \"Мы продолжаем собирать информацию, но у нас пока нет чёткого решения.\"\n\nМика замолчала. Она знала, что они не могут позволить себе провал.\n\n\"Тогда продолжай расследование. У нас нет права на ошибку.\""
 TRM_event.41.a: "Хорошо."

 TRM_event.42.t: "Конец Генны"
 TRM_event.42.desc: "[GEM.GetLeader] преклонила колени и подписала капитуляцию, через неделю тень покрыла улицы Генны. Шумный и весёлый центральный район теперь был тусклым и безлюдным. В отличие от этого, солдаты Тринити сияли радостными лицами.\n\nСтудентки Генны молча бродили, как тени, в то время как войска-победители гордо маршировали в серой униформе с нашивками Патер. Их смех унижал побеждённых.\n\nЗнаменитые террасы кафе были пусты, если не считать нескольких равнодушных местных жителей и членов гурман-клуба, чьи разбитые мечты отражались на их лицах. Харуна, обычно шутившая, молчала, а Идзуми безуспешно пыталась поднять настроение. Разговоры между студентками Генны были приглушёнными, едва слышными среди смеха солдат."
 TRM_event.42.a: "Бесконечное падение."
 TRM_event.42.b: "По крайней мере, они сохранили честь."

 TRM_event.43.t: "Назначение министра экономики"
 TRM_event.43.desc: "Яльмар Шахт думал, что хуже его жизнь быть не может, пока вся страна не изменилась и не была заменена академией девушек.\n\nОн думал, что его забудут, но его вызвала лидер Тринити.\n\nОн встретил Мисоно Мику и был удивлён её экономическими познаниями. Уже только за это она была лучше Гитлера.\n\nНовые технологии Тринити пробудили его любопытство. Пока он ехал в Эдем, он думал об экономической политике, ценах и о том, как работает экономика в стране, где все — студентки.\n\nОн знал, что Мика приняла нацистские идеи, но ему казалось, что она лучше Гитлера уже потому, что слушала, не перебивая. Когда он осознал это, на нём уже была униформа."
 TRM_event.43.a: "Министр экономики, Яльмар Шахт."

 TRM_event.44.t: "Великое соглашение"
 TRM_event.44.desc: "Новый патриотический фильм Лени Рифеншталь, [Великое соглашение], имел огромный успех в Тринити.\n\nФильм показывал справедливую фракцию Патер, борющуюся с предательством других фракций. Финальная сцена, показывающая отчаяние Патер, заставила публику плакать, а затем, увидев речь Мики, все встали, чтобы спеть гимн Тринити.\n\nМика поздравила Лени с её работой и попросила её продолжать создавать много таких фильмов."
 TRM_event.44.a: "Эта женщина делает хорошие фильмы!"

 TRM_event.45.t: "Пропаганда №112"
 TRM_event.45.desc: "За 300 лет ни один лидер не добился так много, как Мика.\n- Вторые лучшие тактические показатели в Кивотосе\n- Второй самый мощный клуб (Департамент юстиции)\n- Самая чистая академия\n- Мика вернула гордость Тринити и германскому народу\n\nСтудентки и германцы Тринити будут сражаться с демонами Генны до конца.\n\nВосстаньте, студентки Тринити!"
 TRM_event.45.a: "Тотальная война!"

 TRM_event.46.t: "Великая оборонительная армия Тринити"
 TRM_event.46.desc: "Если Генна развяжет войну, она будет уничтожена прежде, чем [GEM.GetLeader] что-либо подпишет.\nЗаписывайтесь в нашу славную армию и защищайте нашу родину и семью!\nПод руководством Мики ускорим революцию."
 TRM_event.46.a: "К высотам!"

 TRM_event.47.t: "Лояльные гениевцы"
 TRM_event.47.desc: "Те, кто выбирает Мику вместо [GEM.GetLeader], получат:\n- Права и свободы студентки Тринити\n- Железную медаль, пособие на жизнь\n- Гарантированное трудоустройство\n- Повышение до второй расовой категории\n- Исключение из будущей «обработки»\n- Начальное пособие\n\nУсловия:\n- Без истории в Сондо-бу или Манмаджон\n- Подчиняться всем приказам армии\n- Пожизненный запрет на ношение оружия\n- Сдать экзамен по трудам Мики"
 TRM_event.47.a: "Комитет обороны Тринити"

 TRM_event.48.t: "Давление аншлюса"
 TRM_event.48.desc: "Протесты показывают желание объединения с Тринити. Эдем настоятельно требует аннексии Шань-Хайцзин."
 TRM_event.48.a: "Мы должны объединиться с Тринити!"
 TRM_event.48.b: "Нет, судьба Шань-Хайцзин в другом месте."

 TRM_event.50.t: "Аншлюс"
 TRM_event.50.desc: "Повторяющиеся восстания в Шань-Хайцзин показывают, что они хотят присоединиться к нам. Пришло время действовать."
 TRM_event.50.a: "Кто может сказать, что Австрия не Германия!"

 TRM_event.51.t: "Шаньхайцзин отвергает аннексию!"
 TRM_event.51.desc: "Идиоты из центрального округа Шаньхайцзин отвергли объединение наших двух наций! Это вопиющее неуважение к воле австрийского народа, недопустимый поступок. Возможно, нам придётся прибегнуть к военным средствам, чтобы навязать аннексию."
 TRM_event.51.a: "Мы должны рассмотреть военное вмешательство."

 TRM_event.52.t: "Требования Судет от [From.GetNameDefCap]"
 TRM_event.52.desc: "В этой ситуации Тринити требует от нас территорию Судет под предлогом «защиты немецких граждан».\n\nОни ясно дали понять, что никаких переговоров или дипломатии не будет. Они либо получат Судеты, либо пойдут на войну за них."

 TRM_event.49.t: "Кодзэки Уи"
 TRM_event.49.desc: "\"Эх, я? Правда?\"\n\nДевушка с фиолетовыми волосами и усталыми глазами, 'Кодзэки Уи', заговорила, дрожа перед Микой.\n\n\"Да!~~ Уи-тян всегда сидит в библиотеке, ни с кем не разговаривает и умная, наверняка разбирается в экономике!\"\n\n\"Вы хотите назначить меня... министром экономики...?\"\n\n\"Это легко! Просто проверяй отчёты и более-менее управляй, используя свои знания из книг.\"\n\n\"Н-но это слишком расплывчато...\"\n\nУи всё ещё дрожала, сидя перед «Ночной Королевой». Мика широко улыбнулась.\n\n\"Давай, Уи-тян, поднажми, поднажми, заставь себя, заставь себя~!\"\n\n\"Н-наверное... может быть...\"\n\nМика нахмурилась, наставив на неё пистолет.\n\n\"Хиии! Да! Я сделаю это!\"\n\nМика снова улыбнулась. \"Отлично, министр Уи~!\"\n\nМика вышла. Уи, промокшая от холодного пота, рухнула. Она хотела только вернуться в свою библиотеку."
 TRM_event.49.a: "Экономист, Кодзэки Уи."

 TRM_event.53.t: "Требования Тринити по Дании!"
 TRM_event.53.desc: "Тринити наконец потерял рассудок. - [ROOT.GetLeader]"
 TRM_event.53.a: "Конечно, мы должны отказать."

 TRM_event.54.t: "[From.GetNameDefCap] отвергает уступку Судет"
 TRM_event.54.desc: "Лидер [From.GetLeader] совершил дипломатическую глупость, полностью отвергнув наши требования.\n\nОни не уступят Судеты и насмехаются над нашим желанием защитить наших братьев и сестёр, даже ценой войны."
 TRM_event.54.b: "Новый Иерусалим"

 TRM_event.55.t: "$germany.124.t$"
 TRM_event.55.desc: "$germany.124.d$"
 TRM_event.55.a: "За Тринити и всех студенток!"

 TRM_event.56.t: "Вкусный пирог!"
 TRM_event.56.desc: "Кондитерский клуб приготовил вкусный пирог!"
 TRM_event.56.a: "Вкусно!"

 TRM_event.57.t: "Холодное мороженое!"
 TRM_event.57.desc: "Кондитерский клуб приготовил холодное мороженое!"
 TRM_event.57.a: "Холодно!"
 
 TRM_event.58.t: "Уничтожение Ариуса"
 TRM_event.58.desc: "Под нашим ударом филиал Ариус разрушен, и развевается только наш флаг. Однако элитный отряд Ариус не захвачен. Остаётся только один вариант: объявить их террористической организацией и искоренить."
 TRM_event.58.a: "Ты права."
 TRM_arius_problem_idea: "Страх перед отрядом Ариус"
 TRM_arius_problem_idea_desc: "Студентки Тринити поняли, что отряд Ариус — не простая группа, а организованная террористическая организация. Они чувствуют угрозу, и недоверие к правительству растёт."
 
 TRM_event.59.t: "Нападение"
 TRM_event.59.desc: "\"Она точно здесь?\"\n\n\"Да, по информации...\"\n\nДвое мужчин в чёрном и в масках, с оружием, слишком большим, чтобы назвать его пистолетом, переговаривались перед особняком. Они пришли глубокой ночью убить Сейю Юридзоно.\n\n\"Уф... нам просто нужно открыть эту дверь, и она там, да?\"\n\n\"Да... но уверены ли вы, что это оружие сработает? Вы не видели того раньше? Тем типам с ореолом на голове стреляешь, а им только больно, как будто из игрушечного пистолетика.\"\n\n\"Тьфу. Откуда мне знать. Посредник сказал, что она умрёт, так что... наверное, умрёт.\"\n\n\"Но всё равно... это слишком рискованно... Мы даже не знаем того типа, который нас нанял. А если он устроил нам ловушку?\"\n\n\"Хватит болтать, открывай чёртову дверь.\"\n\nЩёлк. Клац.\n\nС удивительной ловкостью один быстро отключил замок, и они бесшумно проникли внутрь, обыскивая комнату за комнатой. Через несколько минут они увидели кого-то, крепко спящего на кровати. Один сделал знак другому, и оба инстинктивно поняли, что нашли ту женщину.\n\nНе колеблясь, они опустошили обоймы по ней и немедленно бросились наутёк.\n\nВозможно, шум выстрелов был слишком громким, так как вскоре прибыл Орден Помощи."
 TRM_event.59.a: "..."

 TRM_event.60.t: "Расследование продолжается"
 TRM_event.60.desc: "Расследование продвигалось без проблем. Было подтверждено, что они бросили оружие при бегстве, и инструменты, использованные для взлома, также остались там. Орден Помощи передал отчёт с найденным телом, но было слишком много неизвестных.\n\nКирифудзи Нагиса думала: \"Кто это был? Террористическая атака на Тринити? Студентка, использующая возможность для нападения на Чайную вечеринку? Или... Мика...?\"\n\n*Бах!*\n\nОна ударила по столу, но улыбка определённой женщины не исчезала из её мыслей."
 TRM_event.60.a: "..."

 TRM_event.61.t: "Выслеживание"
 TRM_event.61.desc: "Орден Помощи оцепил район, и следователи начали восстанавливать их путь отхода. Один выдвинул гипотезу:\n\n\"Я думаю, они перелезли через эту стену.\"\n\n\"Почему вы так думаете?\"\n\n\"Здесь есть следы. Они не выглядят естественными, скорее сделаны кем-то в спешке.\"\n\n\"Тогда нам стоит обыскать этот район.\"\n\n\"Верно... но я не совсем уверен. Они более умелые, чем кажутся.\"\n\n\"Хорошо. Я расследую это лично.\""
 TRM_event.61.a: "\"И будьте осторожны. Времена неспокойные.\""

 TRM_event.62.t: "Подозреваемые задержаны"
 TRM_event.62.desc: "В уединённом месте двое мужчин на коленях умоляли членов юстиции.\n\n\"М-мы не хотели... мы выросли сиротами, бедными...\"\n\nХасуми посмотрела на них и вздохнула.\n\nЗатем она слегка улыбнулась и спросила их:\n\n\"Кто вас послал? Расскажите мне.\"\n\nЧерез некоторое время они висели вниз головой, почти голые, покрытые синяками.\n\n\"П-пожалуйста... пощадите...\"\n\nУвидев, что они вот-вот потеряют сознание, Хасуми приказала отпустить их. Тогда они выложили всё, что знали.\n\n\"...Понятно.\"\n\nНо она всё ещё сомневалась. \"Неужели эти жалкие люди убили Сейю? Не ошиблись ли мы?\"\n\nТогда один из них пробормотал: \"Мы... мы уже всё сказали... только дайте нам жить...\"\n\nПо какой-то причине Хасуми потеряла всякое сострадание. Она подошла к оружию. Один умолял, но не смог её остановить.\n\n\"Спасибо за информацию... но я ненавижу идиотов, которые не понимают.\"\n\n*Бах!*"
 TRM_event.62.a: "\"Цуруги. Мы нашли виновных.\""

 TRM_event.63.t: "Подстрекатель задержан"
 TRM_event.63.desc: "В месте, указанном задержанными, мужчина курил в переулке. Хасуми подошла и заговорила прямо:\n\n\"Это вы?\"\n\n\"Чего тебе, женщина?\"\n\nИспуганный её внушительной фигурой, он попытался сохранить спокойствие.\n\n\"Я спрошу прямо. Вы знаете этих мужчин?\"\n\n\"Тьфу. Откуда мне знать?\""
 TRM_event.63.a: "Заставить его говорить легко."

 TRM_event.65.t: "Тупик"
 TRM_event.65.desc: "В конце тёмного переулка мужчина скулил, загнанный в угол. Правосудие в образе чёрного ангела медленно приближалось к нему.\n\n\"Чёрт возьми! Я дам вам всё, что хотите, только оставьте меня в покое!\"\n\nПосредник был сбит с ног ударом. Она только презрительно усмехнулась.\n\n\"Мне от вас ничего не нужно, но кое-кому другому нужно.\"\n\n\"Зачем вы это делаете? Чего вы добиваетесь?\"\n\nХасуми придавила его грудь каблуком.\n\n\"Знание поможет вам? Ваша участь была предрешена с того момента, как вы замышляли против Чайной вечеринки.\"\n\nОна прицелилась прикладом ему в голову и прошептала:\n\n\"Принцип прост: за Тринити и за Чайную вечеринку.\"\n\nМужчина больше ничего не слышал."
 TRM_event.65.a: "\"Мы не прощаем несправедливости, которую видим.\""

 TRM_event.64.t: "Ищейки"
 TRM_event.64.desc: "Рядом с изуродованным телом посредника четыре девушки развернули карту. После жёстких допросов они выявили больше причастных и тайно захватили их. Все стрелки указывали на одно имя.\n\n\"Рейнхард Гейдрих. Генерал СС и начальник СД. Пропал без вести с тех пор, как появился Тринити.\"\n\n\"Верный пёс преступного режима.\"\n\nХасуми остановила палец на точке в Шварцвальде.\n\n\"Он также главный подозреваемый в покушении на Сейю.\"\n\nОна посмотрела на трёх других: Ичику, Маширо и Цуруги.\n\n\"Лучше отправим только двоих.\"\n\n\"Понял.\"\n\n\"Я всё подготовлю.\"\n\n\"Не убивайте его, но пусть он страдает до конца.\"\n\nЖуткий смех наполнил комнату. Все четверо молча улыбнулись."
 TRM_event.64.a: "Как этот человек будет кричать."

 TRM_event.66.t: "Сумерки богов"
 TRM_event.66.desc: "Чёрный лес горел красным.\nАвтомобиль, подготовленный для бегства, взорвался вдребезги от единственного выстрела.\nЗатем заряд чего-то красного и чёрного уничтожил одним ударом не только нескольких телохранителей, но и весь фасад деревянного дома.\n\nЧеловек, мечтавший очистить Великую Германию от всей скверны, её разъедавшей, не мог понять, что перед ним.\nОн видел багровый ужас, живую катастрофу, смерть в форме падшего ангела... и все эти имена были недостаточны.\nСреди остатков стены и человеческой крови эта сущность приближалась, превращая всё в пыль и разорванную плоть.\n\nОна наклонилась к нему.\nОн уронил два пистолета, которые были его орудием наказания, и эта сущность без колебаний взяла его руки и оторвала их.\nОн не успел даже закричать, прежде чем она начала безумно избивать его, смеясь.\n\nВ его угасающем сознании он успел увидеть, как его вытаскивают из павильона.\nКак ангел, спасающий его из горящего дома, она вынесла его на свет.\nИ он услышал её смех, леденящий душу хохот, раздирающий его уши и разум."
 TRM_event.66.a: "Демон был сражён ангелом смерти"

 TRN_Nomore_Heydrich_tt: "§YГейдрих§! мёртв?"
 TRM_lets_go_kill_Heydrich: "§LПлан казни организатора покушения на Сейю Юридзоно может быть выполнен.§!"

 TRM_event.67.t: "Тьма раскрыта"
 TRM_event.67.desc: "\"Достаточно... впустите её.\"\n\nВ напряжённой атмосфере Кирифудзи Нагиса отдала приказ в сторону двери.\nДверь тяжело открылась, и после бесполезных охранников с опущенными стволами вошла она, сияющая.\nМисоно Мика: член Чайной вечеринки, подруга Нагисы и Сейи, лидер фракции Патер... и в то же время узурпаторша, предавшая их, чтобы завладеть всем.\n\nНесмотря на гнетущую тяжесть в зале, Мика села напротив Нагисы как ни в чём не бывало, положила свой пистолет на стол и по-детски огляделась.\nТишину нарушила Нагиса, медленно поставив свою чашку.\n\n\"…Почему ты так на меня смотришь? Ты не первый раз здесь.\"\n\"Ммм~ просто хочу хорошенько запомнить всё. В конце концов, скоро это будет мой кабинет, только мой.\"\n\nЕё слова источали враждебность, но тон был другим.\nНагиса закрыла глаза, вздохнула и заговорила с горечью.\n\n\"…Я не думала, что ты зайдёшь так далеко… в глубине души я тебе верила, Мика… надеялась, что ты не откроешь эту дверь…\"\n\"Эхе~ не говори глупостей. Ты никогда и никому не доверяешь, Наги-тян~\"\n\"…Почему? Зачем ты всё это сделала?\"\n\"Ты правда меня об этом спрашиваешь? Ты знаешь это лучше всех~\"\n\nНагиса устало посмотрела на неё.\n\n\"Эта твоя слабость всё испортила… ты разочаровала всех и вынудила меня сделать это, это только твоя вина, ты знаешь?\"\n\nУлыбка Мики в тот же миг исчезла.\nОна хлопнула в ладоши, и её солдаты вошли, чтобы схватить Нагису.\nСнаружи бездыханные тела последних верных Нагисе охранников истекали кровью с дырой в голове.\nГлядя на эту сцену, Нагиса обратила к Мике свои последние слова:\n\n\"…Пламя ада ждёт тебя, Мика.\""
 TRM_event.67.a: "\"Да… я знаю, Нагиса.\""

 TRM_event.68.t: "Советская капитуляция"
 TRM_event.68.desc: "Сегодня на рассвете в Эдем прибыла декларация о безоговорочной капитуляции Советского Союза. Мисоно Мика и её верховное командование поначалу думали, что это фарс или отвлекающий манёвр Советов, но вскоре её подлинность подтвердилась, когда на всех фронтах солдаты Красной Армии начали сдаваться с белыми флагами.\n\nВоенные аналитики Тринити предполагают, что после непрерывной череды поражений сами советские офицеры устроили переворот, который и привёл к коллапсу."
 TRM_event.68.a: "Великая победа!"
 TRM_event.68.b: "Нет? Нам достаточно полной победы."

 TRM_event.69.t: "Вы говорите по-японски? (日本語は可能ですか？)"
 TRM_event.69.desc: "はい、私は日本語を話します。(Да, я говорю по-японски.)\n\nТогда вы говорите по-китайски? (如果是的话，你會說中文嗎？)\n\n是的，中文也可以。(Да, также говорю по-китайски.)\n\nИ наконец, вы говорите по-русски? (Итак, наконец, вы говорите по-русски?)\n\nДа, это возможно."
 TRM_event.69.a: "Очень приятно! (よろしくお願いします)"
 TRM_event_69_tt: "§YУстанавливается Священный протекторат на оккупированных территориях.§!"
 TRM_event.69.b: "Рад работать с вами! (잘부탁합니다)"

 TRM_event.70.t: "Рухнувшая родина"
 TRM_event.70.desc: "После поражения в Великой Отечественной войне мы потеряли все западные территории и оказались низведены до периферийного государства, неспособного выполнять даже свои основные функции. Мы давно потеряли контроль над Дальним Востоком и едва удерживаем Центральную Сибирь и Среднюю Азию. Идеалы великих революционеров рухнули."
 TRM_event.70.a: "..."
 TRM_event_70_tt: "§gСталь сломалась, но осколки ещё остались.§!"

 TRM_event.71.t: "Распад фракции Санктус"
 TRM_event.71_2.t: "Исчезнувшая фракция"
 TRM_event.71.desc: "После нападения на её лидера, Юридзоно Сейю, фракция Санктус, раздираемая внутренними спорами, не смогла восстановить единство и в конце концов распалась. Отныне Санктус больше не сможет оказывать влияние на Чайную вечеринку."
 TRM_event.71_2.desc: "По мере ускорения разложения Тринити различные фракции в конце концов распустились или исчезли бесследно."
 TRM_event.71.a: "..."

 TRM_event.72.t: "Выбор хозяйки"
 TRM_event.72.desc: "После Великого Перемещения и чрезвычайной ассамблеи Тринити вступает в новую эру. Преодолев неспокойные времена и добившись заметных успехов, ассамблея распускается, чтобы уступить место новому порядку: Юридзоно Сейя, лидер фракции Санктус, становится хозяйкой Чайной вечеринки.\n\nВесь Тринити переполнен облегчением и ликованием. На всех площадях люди празднуют с тостами и танцами, и в этом веселье расцветает слабый воздух надежды и мира. Но под этой праздничной атмосферой всё ещё скрываются тени: коммунисты и остатки СС тайно борются за власть, хотя их участь предрешена, и скоро они будут преданы забвению.\n\nС высоты Эдем сияет как мираж, с бесчисленными флагами, развевающимися на ветру: жёлтым флагом Тринити вместе с флагами других фракций. Когда толпа затихает и Юридзоно Сейя поднимается на подиум, она без колебаний садится и, не теряя времени, объявляет о конце старого режима и провозглашает, что новый Тринити восторжествует там, где прежний потерпел неудачу. Крики членов Чайной вечеринки вскоре сменяются возгласами всей толпы. Имя звучит на площади Тринити, в Эдеме и по всей академии: Сейя."
 TRM_event.72.a: "Слава родине!"

 TRM_event.73.t: "Ядерное деление"
 TRM_event.73.desc: "Бывшее германское государство, осевшее на территориях Тринити, достигло больших научных успехов. Феномен ядерного деления, открытый Отто Ганом, Фрицем Штрассманом и Лизе Мейтнер, потряс научное сообщество и стал вехой в физике. Однако физики-ядерщики Тринити также исследовали его потенциал, придя к тому же выводу: силу атома можно превратить в оружие."
 TRM_event.73.a: "Тринити использует это."
 OTTOHAN_tt: "§YПоявляется древо фокусов для §Yядерного развития§!."
 TRM_event.73.b: "Ха, смешно."

 TRM_event.74.t: "Следующий президент"
 TRM_event.74.desc: "Теперь, когда буря утихла, мы должны назначить следующего президента, который восстановит баланс Тринити и поведёт его в будущее.\n\nС восстановлением власти Нагисы мы можем вернуть ей пост или, впервые в нашей истории, установить избирательную систему, основанную на воле народа."
 TRM_event.74.a: "Чайная вечеринка — больше не просто студенческий совет."
 TRM_event.74.b: "Если не Нагиса, то кто поведёт Тринити?"

 TRM_event.75.t: "Первые выборы"
 TRM_event.75.desc: "В Тринити прошли первые выборы. Кандидатки — действующий президент и лидер фракции Филиус Кирифудзи Нагиса, а также Адзитани Хифуми, сыгравшая ключевую роль в изгнании фракции Патер. Ожидается напряжённая борьба за лидерство в Тринити."
 TRM_event.75.a: "У Нагисы есть авторитет, чтобы вести."
 TRM_event.75.b: "Хифуми доказала свою состоятельность."

 TRM_event.76.t: "Визит делегации Тринити"
 TRM_event.76.desc: "Тринити прислал нам делегацию с предложением восстановить Эдемский договор, де-факто аннулированный хаосом Перемещения."
 TRM_event.76.a: "Выслушаем их."
 TRM_event.76.b: "Мы не можем им доверять."

 TRM_event.77.t: "[FROM.GetName] одобряет договор"
 TRM_event.77.desc: "После продолжительных обсуждений [FROM.GetName] решила поддержать Эдемский договор."
 TRM_event.77.a: "Первый шаг к миру."

 TRM_event.78.t: "[FROM.GetName] высылает делегацию"
 TRM_event.78.desc: "[FROM.GetName] выслала нашу делегацию и, похоже, не настроена воспринимать Эдемский договор всерьёз."
 TRM_event.78.a: "Неужели это означает войну?"

 TRM_event.79.t: "Начало переговоров Тринити-Генна"
 TRM_event.79.desc: "Первоначально Генна холодно отреагировала на наше предложение о Великом компромиссе. Однако после наших настойчивых усилий они наконец согласились сесть за стол переговоров.\n\nВ назначенный день делегации Тринити и Генны встретились в зале на границе между двумя академиями. Не обменявшись ни словом, переговоры начались в ледяной атмосфере."
 TRM_event.79.a: "Пусть обе нации придут к соглашению."

 TRM_event.80.t: "Предложение: гегемония Генны"
 TRM_event.80.desc: "Эдемский договор, продвигаемый Тринити, может нанести ущерб интересам Генны. Крайне важно, чтобы Генна взяла бразды правления зарождающейся организацией."
 TRM_event.80.a: "Представим предложение."
 TRM_event.80.b: "Это не поможет соглашению."

 TRM_event.81.t: "Предложение: экономическая интеграция"
 TRM_event.81.desc: "Тринити, воспользовавшись хаосом в Генне, пережил быстрый экономический рост. Интеграция экономик принесёт огромную пользу Тринити."

 TRM_event.82.t: "Предложение: совместные военные операции"
 TRM_event.82.desc: "Генна обладает военными возможностями, превосходящими Тринити. В случае одобрения этого предложения Генна получит значительное преимущество."

 TRM_event.83.t: "Предложение: барьер против Востока"
 TRM_event.83.desc: "Тринити граничит с враждебными державами. Чтобы сдержать Польшу и Советский Союз, нам нужна поддержка Генны."

 TRM_event.84.t: "Предложение: восстановление Генны"
 TRM_event.84.desc: "Генна погрузилась в хаос после Перемещения. Если мы её не восстановим, Эдемский договор потеряет смысл и будет забыт."

 TRM_event.85.t: "Предложение: гегемония Генны"
 TRM_event.85.desc: "Генна выразила несогласие с лидерством Тринити в Эдемском договоре. Если мы примем это предложение, гегемония перейдёт к Генне."
 TRM_event.85.a: "Принимаем."
 TRM_event.85.b: "Отклоняем."

 TRM_event.86.t: "Предложение: экономическая интеграция"
 TRM_event.86.desc: "Тринити удалось модернизировать свою промышленную базу после потрясений в Генне. Если мы поддержим это предложение, Тринити получит значительное промышленное преимущество."

 TRM_event.87.t: "Предложение: совместные военные операции"
 TRM_event.87.desc: "Генна обладает военными возможностями, превосходящими Тринити. Если мы поддержим это предложение, Генна получит заметное стратегическое преимущество."

 TRM_event.88.t: "Предложение: барьер против Востока"
 TRM_event.88.desc: "Тринити запрашивает экономическую и военную помощь для сдерживания угроз на своей границе. Если мы одобрим это предложение, нам придётся предоставить им ресурсы."

 TRM_event.89.t: "Предложение: восстановление Генны"
 TRM_event.89.desc: "Генна просит поддержки для преодоления внутренних кризисов, которые она пережила. Если мы поддержим это предложение, Генна получит экономическую помощь."

 TRM_event.90.t: "[FROM.GetName] принимает предложение"
 TRM_event.90.desc: "[FROM.GetName] приняла предложение, которое мы представили для организации Эдемского договора. Мы успешно продвигаемся к его реализации."
 TRM_event.90.a: "Ещё один шаг к Эдемскому договору."

 TRM_event.91.t: "Предложение отклонено"
 TRM_event.91.desc: "[FROM.GetName] отклонила наше предложение. Эдемский договор сталкивается со всё большими препятствиями."
 TRM_event.91.a: "Это не помогает соглашению…"

 TRM_event.92.t: "Провал Эдемского договора"
 TRM_event.92.desc: "Несмотря на длительные переговоры между двумя нациями, Великий компромисс провалился. Пропасть между Тринити и Генной, кажется, слишком глубока, и организация Эдемского договора рассеялась как мираж."
 TRM_event.92.a: "Ничего хорошего…"

 TRM_event.93.t: "Формирование Организации Эдемского договора"
 TRM_event.93.desc: "После трудных переговоров Организация Эдемского договора была официально учреждена. Этот орган не только улаживает споры между Генной и Тринити, но и достиг многочисленных соглашений, предвещая положительное влияние на все академии Кивотоса."
 TRM_event.93.a: "Прекрасный плод."

 TRM_event.94.t: "Подчиниться или умереть"
 TRM_event.94.desc: "Это был лишь вопрос времени, когда Тринити найдёт нас. Сегодня поступил ультиматум, адресованный филиалу Ариус: подчинитесь или столкнётесь с уничтожением."
 TRM_event.94.a: "Филиал Ариус никогда не сдастся."
 TRM_event.94.b: "Это наш последний вздох…"

 TRM_event.95.t: "Сопротивление филиала Ариус"
 TRM_event.95.desc: "Филиал Ариус отверг подчинение, требуемое Тринити. Отвергнув их снисхождение, их участь предрешена: их ждёт только уничтожение."
 TRM_event.95.a: "Готовьте оружие."

 TRM_event.96.t: "Подчинение филиала Ариус"
 TRM_event.96.desc: "Филиал Ариус принял условия нашего ультиматума и официально подчинился Тринити."
 TRM_event.96.a: "Хорошо."

 TRM_event.97.t: "Переговоры с Дисциплинарным комитетом"
 TRM_event.97.desc: "С целью убедить Дисциплинарный комитет присоединиться к нам, мы отправили дипломатическую делегацию."
 TRM_event.97.a: "Переговоры прошли успешно: теперь они с нами."
 TRM_event.97.b: "Мы потерпели неудачу: Комитет остаётся с Генной."

 TRM_event.98.t: "Пакт о противовоздушной обороне"
 TRM_event.98.desc: "Тринити предложил договор для противодействия цели Коминтерна распространять коммунизм посредством насилия и подрывной деятельности. Этот пакт предусматривает обмен информацией о коммунистических угрозах и тесное сотрудничество в борьбе с ними."

 TRM_event.104.t: "Губернатор Москвы?"
 TRM_event.104.desc: "С провозглашением Священного мандата на Москву и окончанием военной администрации возникает вопрос, кто займёт пост губернатора. Решение, кажется, обсуждается между двумя кандидатами: Кирифудзи Нагисой и Зигфридом Каше.\n\nЗигфрид Каше — эффективный администратор, лояльный приказам Тринити, считающийся подходящим для этой должности.\n\nКирифудзи Нагиса, однако, была назначена напрямую Мисоно Микой и обладает выдающимися политическими способностями, которые она уже продемонстрировала до Великого Перемещения. Но та же близость к Мике вызывает подозрения: некоторые опасаются, что в решающий момент она предаст Тринити и объединится с красными силами.\n\nОба кандидата вызывают сомнения. Дискуссия продолжается: кто будет править Москвой?"
 TRM_event.104.a: "Кирифудзи Нагиса"
 TRM_event.104.b: "Зигфрид Каше"

 TRM_event.3000.t: "Утрата легитимности"
 TRM_event.3000.d: "Башня Святилища, управлявшая всеми аспектами Кивотоса, стала неработоспособна после войны. Для её реактивации необходимо согласие Генерального президента Студенческого совета. Поэтому мы решили наделить одного из ключевых персонажей Тринити этим титулом, и после долгих раздумий наш выбор сузился до двух студенток.\n\nС решением принятым, мы медленно пишем её имя…"
 TRM_event.3000.a: "...Адзитани Хифуми"
 TRM_event.3000.b: "...Урава Ханако"
 TRM_event.3000.c: "Сила — единственная легитимность"

 TRN_after_war_event.1.t: "Приток капитала"
 TRN_after_war_event.1.desc: "Заседание кабинета прошло в более радостной атмосфере, чем когда-либо.  
Присутствующие поднимали бокалы с шампанским, а их лидер наблюдала за происходящим с удовлетворённым выражением.  
На столе лежал документ, рассказывающий о том, как многочисленные немецкие компании с заводами на территории Генны переезжают в Тринити.  
Было ли это плодом политики инвестиций и интеграции, проводимой Микой и руководством Тринити?  
Графики ясно показывали экономическое развитие Тринити, бесспорный триумф.  
\n\n\"Это было логично~ Неужели у этих отбросов из Генны хватило бы ума это предотвратить? ★\"\n\nВсем было очевидно, что ветер дует в нужную сторону."
 TRN_after_war_event.1.a: "Quid pro quo (всё имеет свою цену)"

 TRN_after_war_event.2.t: "Утечка капитала"
 TRN_after_war_event.2.desc: "В тяжёлой тьме ночи представитель Министерства экономики продолжил своё выступление дрожащим голосом.  
Немецкие компании перевезли свои заводы в Тринити.  
Можно было бы подумать, что это всего лишь горстка фабрик, но это было не что иное, как сигнал: сама идентичность Германии передавалась Тринити.  
Самым тревожным было то, что руководство Генны было не в силах остановить этот поток.  
\n\n\"В любом случае… мы должны срочно разработать меры, чтобы предотвратить дальнейший отток остальных компаний.\"\nВ жёсткой атмосфере зала кто-то заговорил.  
Хотя бедствие уже началось, они не могли сдаться.  
Было слишком поздно всё бросать."
 TRN_after_war_event.2.a: "Хотя скот и пропал, нужно чинить хлев."

 TRN_after_war_event.16.t: "Промышленный бум"
 TRN_after_war_event.16.desc: "Наконец-то восстановление завершено. Миссия Йоханнеса тоже.\nС официальным окончанием работ по восстановлению Тринити Йоханнес и его команда должны были быть распущены.\n\nБыло много пережито. Йоханнес и его товарищи объездили всю территорию, везде возводя сооружения, сталкиваясь со всевозможными превратностями судьбы.\n\nОн с ностальгией вспоминал, как, полный решимости, впервые прибыл в тот заброшенный промышленный район. Тогда его уверенность была непоколебима.\nОн боролся, чтобы превратить военный завод в гражданский, и когда думал, что наконец может вернуться домой, его отправили прокладывать электрические кабели. Едва он закончил электрические работы, как его отправили на противоположный конец страны прокладывать дороги посреди минного поля, и он даже участвовал в конкурсе пропагандистских лозунгов, который выиграл, и потом видел свои стихи, расклеенные по всей территории, что вызывало у него детский стыд.\nОднажды он даже осмелился напрямую обратиться к Мике с критикой.\n\nТеперь Йоханнес вспоминал всё это с лёгкой меланхолией, поправляя свой костюм вместо униформы и каски.\n\nПрозвучал свисток, и Йоханнес вошёл в вагон поезда, унося с собой радость от долгожданного возвращения домой и всю смесь накопленных эмоций.\n\nВ элегантном здании на обширной промышленной зоне Восточной Пруссии Брайан наблюдал за происходящим со схожими чувствами.\nОн вспоминал жестокие поборы, которым подвергался как крестьянин ещё со времён Германской империи, налоги, дни, когда из-за нехватки денег вся его семья плакала, питаясь сорняками…\n\nНо теперь у Брайана было не костлявое, а крепкое тело, и он носил элегантный костюм вместо крестьянских лохмотьев. Он держал в руках не мотыгу, а просматривал документы в кабинете директора. Выглянув в окно, он увидел свою фабрику, неустанно дымящую, и гордо улыбнулся.\n\nВ столице Тринити, величественном городе Эдем, тоже девушка с розовыми волосами и крыльями смотрела на этот вид из своего кабинета.\nОна наблюдала за городом, полным жизни и промышленного дыма, и среди толпы заметила мужчину и женщину, улыбающихся и идущих, держа за руку своего сына.\nМисоно Мика мягко улыбнулась, с гордостью думая, что, хотя она была всего лишь марионеткой, ей удалось так сильно преуспеть в развитии Тринити.\n\nОсознавая свою собственную роль, она намеренно отвела взгляд от белого дыма, поднимавшегося над отдалённой зоной концентрационных лагерей, и погрузилась в созерцание прекрасной и чистой столицы."
 TRN_after_war_event.16.a: "Слава будет длиться вечно"


 #Проблема отряда Ариус
 TRN_opposition.1.t: "Доклад Центральной информационной службы: Дзёмаэ Саори"
 TRN_opposition.1.d: "Номер дела: ABS-001050213\nСубъект: Дзёмаэ Саори\nДата рождения: неизвестна\nМесто происхождения: предположительно Автономный округ филиала Ариус\nДеятельность: Лидер отряда Ариус (в настоящее время)\nМестонахождение: неизвестно\n\n-Введение\nДзёмаэ Саори была идентифицирована как лидер отряда Ариус, небольшой независимой силы, связанной с Ариусом, и неоднократно наблюдалась в сценариях высокого риска, связанных с Ариусом.\n\n-Развитие\nПо данным Отдела безопасности Центральной информационной службы, даже в нынешних нестабильных обстоятельствах Дзёмаэ Саори по-прежнему считается значительной угрозой для Тринити.\nС тех пор как её видели в столкновении полгода назад, её местонахождение неизвестно, и все органы безопасности Тринити продолжают её поиски, пока безрезультатно...(пропущено)"
 TRN_opposition.1.a: "Если я пойду и долиною смертной тени..."

 TRN_opposition.2.t: "Доклад Центральной информационной службы: Хакари Ацуко"
 TRN_opposition.2.d: "Дата рождения: неизвестна\nМесто происхождения: предположительно Автономный округ филиала Ариус\nДеятельность: Законная наследница филиала Ариус (ранее)\n         Член отряда Ариус (в настоящее время)\nМестонахождение: неизвестно\n\n-Введение\nХакари Ацуко, член отряда Ариус, была идентифицирована как законная наследница президента студенческого совета Ариуса по происхождению, но, по-видимому, впала в немилость по неизвестным причинам и с тех пор влилась в отряд.\n\n-Развитие\nВ настоящее время её местонахождение неизвестно, и она считается потенциальной угрозой для внутренней сплочённости Тринити.\nОна фигура, способная объединить остатки филиала Ариус, поэтому власти...(пропущено)"

 TRN_opposition.3.t: "Доклад Центральной информационной службы: Имасино Мисаки"
 TRN_opposition.3.d: "Номер дела: ABS-001050232\nСубъект: Имасино Мисаки\nДата рождения: неизвестна\nМесто происхождения: предположительно Автономный округ филиала Ариус\nДеятельность: Член отряда Ариус (в настоящее время)\nМестонахождение: неизвестно\n\n-Введение\nИмасино Мисаки является членом отряда Ариус.\nСогласно показаниям и её поведению, у неё, по-видимому, есть психологические проблемы, и на некоторых изображениях видны следы самоповреждений.\n\n-Развитие\nОна фактически действует как полевой командир отряда и, будучи единственной, кто использует тяжёлое оружие, нанесла наибольшие потери персоналу Тринити в предыдущих столкновениях.\nЕё видели последней из отряда две недели назад в Дрездене, где она скрылась от преследования, переплыв реку Эльбу. Её текущее местонахождение...(пропущено)"

 TRN_opposition.4.t: "Доклад Центральной информационной службы: Цутинага Хиёри"
 TRN_opposition.4.d: "Номер дела: ABS-001050242\nСубъект: Цутинага Хиёри\nДата рождения: неизвестна\nМесто происхождения: предположительно Автономный округ филиала Ариус\nДеятельность: Член отряда Ариус (в настоящее время)\nМестонахождение: неизвестно\n\n-Введение\nЦутинага Хиёри является членом отряда Ариус.\nОна обладает выдающимися способностями снайпера и, наряду с Имасино Мисаки, считается одним из важнейших тактических активов отряда.\nОднако, согласно показаниям, у неё серьёзные проблемы с общением и межличностные отношения.\n\n-Развитие\nВ настоящее время она считается самой опасной целью среди членов отряда.\nВо время последнего наблюдения она одним выстрелом поразила каждый из трёх бронетранспортёров военной полиции, преследовавших её, причинив множественные потери...(пропущено)"

 TRN_opposition.200.t: "Конец подавления"
 TRN_opposition.200.d: "Поиск основных целей, угрожавших стабильности нашего правительства, наконец завершён. Департамент безопасности закрывает дело, чтобы сосредоточиться на других неотложных вопросах.\n\nБудем надеяться, что их операция не была напрасной и что стабильность нашей молодой администрации обеспечена."
 TRN_opposition.200.a: "Мы сделали всё, что могли."

 TRN_opposition.100.t: "Новые правила ведения боя"
 TRN_opposition.100.d: "Наш Департамент безопасности продолжает усердно работать над поиском врага, ожидая наших приказов. Если будет сочтено необходимым, мы можем отдать им приказ изменить тактику поиска.\n\nВо-первых, мы можем захватить цели живыми и заключить их в тюрьму. Если держать их в месте под постоянным наблюдением, они перестанут быть угрозой.\n\nВо-вторых, мы можем приказать Департаменту безопасности казнить любого оппозиционера, которого они найдут. Простое и окончательное решение.\n\nКаково ваше решение?"
 TRN_opposition.100.a: "Покончите с ними полностью. Они поступили бы с нами так же."
 TRN_opposition.100.b: "Возможно, тюрьма положит конец их амбициям."
 TRN_opposition.100.c: "Мы не хотим их в наших границах."

 #Дзёмаэ Саори
 TRN_opposition.11.t: "Побег"
 TRN_opposition.11.d: "Отбросив все свои тревоги, Саори пересекла реку.\nПоздно ночью, в спокойных водах Дуная, её последнего рубежа,\nСаори мечтала о будущем, которое её ждало.\n\nКонечно, кто-то дорогой её сердцу ждал бы её на другом берегу.\nЕй больше не придётся жить, прячась в темноте, ни бояться насилия или несправедливости.\nНаконец-то она сможет выйти из тёмной долины смерти и жить с достоинством.\n\nКогда она достигла другого берега, она оглянулась назад.\nЕё прошлое, которое её мучило, Ариус, Тринити, весь этот гнев и отчаяние были теперь на другой стороне реки.\n\nНо перед её глазами был только простой галечный пляж.\nНикто её не ждал, никакое светлое будущее не открывалось.\nВдалеке виднелись только тихая спящая деревня и мирные леса.\nИнтенсивное чувство пустоты заполнило её грудь, которая ещё мгновение назад была полна надежды и страсти.\n\nОна усмехнулась про себя.\nНаконец она поняла истинный смысл той пословицы, которую всегда повторяла, оставленной пророком.\nМир прекрасен и драгоценен именно потому, что он суетен."
 TRN_opposition.11.a: "Итак, похвалил я веселье; потому что нет лучшего для человека под солнцем, как есть, пить и веселиться."
 TRN_opposition.112.t: "Сломанная вилка"
 TRN_opposition.112.d: "\"…Что это такое?\"\n\nЧитая телеграмму, Мика улыбнулась, как будто ничего не понимая, и посмотрела на своего секретаря.\n\n\"Мы мобилизовали столько людей и тяжёлой техники… и не смогли поймать ни одной?\"\n\nВилка в её руке согнулась и полностью деформировалась.\nУвидев это, секретарь немедленно склонила голову.\n\n\"Нам очень жаль, президент… Я приму меры, чтобы подготовить список ответственных…\"\n\"…Хватит. В любом случае одна она ничего не сможет сделать. Но проследи, чтобы поймали остальных трёх, понятно?\"\n\nС равнодушным выражением Мика подпёрла подбородок.\nСекретарь снова поклонилась, прежде чем поспешно выйти.\nМика, глядя на согнутую вилку в своей руке, швырнула её в дверь, в которую вышла секретарь.\nВилка пролетела и глубоко вонзилась в дерево, пока она, недовольная, молча смотрела на это."
 TRN_opposition.112.a: "...Мне не нравится"

 TRN_opposition.21.t: "Пророк говорит"
 TRN_opposition.21.d: "Все её действия и её воля были направлены только на защиту самых важных для неё людей.\nХотя она уступила реальности, состоящей из ненависти и убийств, она была полна решимости не отдавать их.\n\nНо даже для неё наступил конец.\nЦепи причины и следствия, которые она сама выковала на своём пути, в конце концов направили свои стволы на неё и весь её отряд.\n\nКогда последняя гильза выпала из патронника, бесчисленные красные линии, сделанные из ненависти и обиды, окружили её и обездвижили.\nВсё её сопротивление было напрасно.\nПеред лицом неизбежной судьбы Саори закрыла глаза."
 TRN_opposition.21.a: "Суета сует, всё суета"
 TRN_opposition.212.t: "Бесполезный конец"
 TRN_opposition.212.d: "Утро Мики всегда начиналось немного позже, чем у других студенток.\nОна вставала в 9 и с помощью своих помощниц приводила себя в порядок.\nОна любила украшать свои крылья и одежду аксессуарами, которые выбирала сама.\n\nПриведя себя в идеальный порядок, она завтракала в 11.\n\nНо в то утро её спокойное время было прервано нежеланным посетителем.\nМике было неприятно, когда её прерывали по утрам, и она посмотрела на своего секретаря с неловкой улыбкой.\n\n\"Доброе утро, секретарь-☆. Вы, наверное, пришли по важному делу, да?\"\n\"…Простите, что прерываю ваш завтрак, Мика-сама…\"\n\nСекретарь, торопясь, вручила ей телеграмму.\n\nПрочитав её, Мика удовлетворённо улыбнулась.\nСаори, самая опасная женщина Ариуса, была мертва.\n\n\"…До самого конца притворялась лидером, да? Остальных, сожгите их фотографии и выбросьте в море~☆\"\n\nПока секретарь удалялась, Мика наколола маленькую клубничку на свою вилку.\nКазалось, день начинается хорошо."
 TRN_opposition.212.a: "Хорошее начало дня"

 TRN_opposition.31.t: "Гордость"
 TRN_opposition.31.d: "Саори всю свою жизнь сопротивлялась.\nНо она также уступала, чтобы защитить.\nОна всегда была человеческим противоречием.\n\nНо она верила, что всё в мире суета и что однажды всё — взрослые, академии, гнев, обида — превратится в прах.\n\nПоэтому она не сдавалась.\nХотя её отряд был рассеян, и она бежала по тёмным катакомбам, она сохраняла надежду.\nАриус пал.\nВозможно, это было последним испытанием, которое наложила на неё судьба.\nИ в конце концов, она достигнет желанной свободы.\n\nНо в конце тьмы не было спасения.\nОслепительный свет ослепил её, и она почувствовала, как множество рук снова тащит её во тьму.\nОсвобождение всегда будет вне её досягаемости."
 TRN_opposition.31.a: "...И я ублажил мёртвых, которые давно умерли, больше, чем живых, которые живут доселе."
 TRN_opposition.312.t: "Жалкая жизнь"
 TRN_opposition.312.d: "Читая отчёт, Мика не могла сдержать смеха.\n\n\"Ахахаха! Значит, знаменитая Саори из Ариуса не смогла даже покончить с собой и была схвачена? При её-то надменности, как забавно-!\"\n\nВдоволь насмеявшись, она дала указания своему секретарю.\n\n\"А пока обращайся с ней хорошо, как с почётной гостьей. Так ей будет унизительнее~\"\n\"Да, я передам.\"\n\nПоклонившись, секретарь вышла из зала.\nМика отправила в рот маленькую сосиску, представляя себе Саори, жалкую в лагере для военнопленных.\nДетский смех наполнил комнату."
 TRN_opposition.312.a: "Посмотрим, как я с ней позабавлюсь"

 #Имасино Мисаки
 TRN_opposition.12.t: "Добрый самаритянин"
 TRN_opposition.12.d: "Мисаки без сознания упала на пол канализации, полной сточных вод.\nОна наняла перекупщика, чтобы пересечь границу, до этого всё шло хорошо.\nНо как только она пересекла её, он предал её и продал.\nМисаки пришлось бежать по лабиринту переулков, уклоняясь от пуль изо всех сил.\n\nОтдав все свои вещи перекупщику, она провела дни без еды и воды, её тело ослабло, и она лежала на земле, не в силах пошевелиться.\nОна подумала, что наконец-то пришло долгожданное освобождение, и без сопротивления закрыла глаза.\n\nНо Мисаки не могла умереть спокойно.\nКогда она открыла глаза несколько дней спустя, перед ней была группа сирот.\nОни нашли её, вымыли и вылечили, и, хотя им самим едва хватало еды, они делились с ней своей скудной пищей.\nОна чувствовала такие странные эмоции, что даже не смогла поблагодарить их, прежде чем поспешно уйти.\n\nИдя по полю за городом, Мисаки на время отбросила охватившее её смятение.\nОна ускорила шаг, чтобы встретиться с остальными, добавив маленькое сомнение к своей старой пословице:\n'Всё в этом мире суета, но, возможно, стоит жить.'"
 TRN_opposition.12.a: "Итак, понял я, что нет ничего лучше, как наслаждаться человека делами своими, потому что это — доля его."
 TRN_opposition.122.t: "Виновность по ассоциации"
 TRN_opposition.122.d: "Сегодня, как обычно, в кабинет Мики поступило множество документов.\nСлегка зевнув, она удобно уселась и начала их просматривать.\nБольшинство её не слишком интересовало.\n'Чистка' евреев и меньшинств была больше делом фанатиков, посадивших её сюда.\nЗадачи по сжиганию в разрушенной автономии Ариуса или подготовка к вторжению в Генну были вещами, на которые нужно было просто поставить свою печать.\nКак скучающая студентка с домашним заданием, она нехотя листала бумаги, пока одна не привлекла её внимание.\n\n\"…Мм? Это что?\"\n\"Это о слежке за Имашино Мисаки, одной из отряда Ариус.\"\n\"Хмм…\"\n\nС любопытством Мика открыла файл.\n\n\n\nПрочитав немного, её лицо окаменело, и она швырнула файл перед своим секретарём.\n\n\"…Она даже не лидер… и всё равно десятки убитых, а поймать не смогли?\"\n\nИсходившая от неё атмосфера заставила секретаря покрыться холодным потом, не в силах вымолвить ни слова.\n\n\"К тому же она прорвала пограничный контроль? …Ха… арестуйте всех ответственных на том посту, включая их семьи.\"\n\nС горькой усмешкой и безумным взглядом секретарь поспешно поклонилась, прежде чем выбежать, благодаря судьбу, что этот гнев не обратился на неё."
 TRN_opposition.122.a: "Дети умрут за вину отцов"

 TRN_opposition.22.t: "Одинокое падение"
 TRN_opposition.22.d: "Мисаки понимала лучше всех учение о том, что всё в мире суета.\nПоэтому она всегда хотела всё бросить и отдохнуть, вместо того чтобы продолжать страдать в этом пустом мире.\n\nНо всегда был кто-то, кто её удерживал, кто не давал ей уйти.\nПока они были рядом, Мисаки откладывала свой конец.\n\nОднако, несмотря на все её усилия, мир не оставил их в покое.\nВыпустив свою последнюю ракету, она бросила пусковую установку и поднялась на край обрыва.\nПреследовавшие её ищейки выкрикивали её имя.\n\nСтоя там одна, она чувствовала одиночество.\nНа этот раз она была совершенно одна.\nЛюдей, которые её удерживали, больше не было рядом.\nНе колеблясь, она медленно откинулась назад.\nВ ветре, хлеставшем по лицу, Мисаки наконец почувствовала покой."
 TRN_opposition.22.a: "Горе тому, кто падает, и нет другого, который поднял бы его."
 TRN_opposition.222.t: "Сопутствующий ущерб"
 TRN_opposition.222.d: "Сегодня, как обычно, в кабинет Мики поступило множество документов.\nСлегка зевнув, она без интереса их пролистала.\nЧистка евреев и меньшинств, сжигание в Ариусе или вторжение в Генну были темами других.\nПока один не привлёк её внимание.\n\n\"…Мм? Это что?\"\n\"Это о Имашино Мисаки, одной из отряда Ариус.\"\n\"Хмм…\"\n\nМика пролистала файл с лёгкой любопытной улыбкой.\n\n\n\n\"…Мертва? И своей рукой?\"\n\"Мне нечем оправдаться. Простите.\"\n\"И всё же… столько наших погибло? Ну, не тебе извиняться…\"\n\nПостукивая пальцем по столу, Мика наконец заговорила с тяжёлой улыбкой.\n\n\"Не упустите ни одного из ответственных. Ты поняла?\"\n\nСекретарь поняла лучше всех: эта улыбка была приговором для многих."
 TRN_opposition.222.a: "Ты думала, я тебя похвалю?"

 TRN_opposition.32.t: "Тщетное раскаяние"
 TRN_opposition.32.d: "Её последняя ракета пронеслась по небу и взорвалась, осыпав осколками её преследователей.\nБезучастно посмотрев на их трупы, Мисаки бросила пусковую установку и побежала в лес.\n\nНа бегу она оценивала своё положение.\nОтряд был рассеян, и все пытались пробиться на юг.\nОна должна была к ним присоединиться.\n\nНо сомнение охватило её.\nШансы выйти невредимой были минимальны.\nЕсли её поймают, она даже не сможет свободно дышать.\nМожет быть, лучше покончить со всем самой.\n\nНо было уже поздно.\nПреследователи из засады вышли из-за деревьев и окружили её.\nВ последней отчаянной попытке она приставила пистолет к своей голове.\nНо патрон дал осечку.\n\nВсё суета.\nЭтот мир, сопротивление, счастье, печаль — всё суета.\nДаже её собственная трусость была суетой.\nНаконец её утащили во тьму, которую она так ненавидела и боялась."
 TRN_opposition.32.a: "Все дни его — скорбь, и его труды — беспокойство; даже и ночью сердце его не знает покоя. И это — суета!"
 TRN_opposition.322.t: "Убийство по согласию"
 TRN_opposition.322.d: "Сегодня, как обычно, в кабинет Мики поступило множество документов.\nСлегка зевнув, она без интереса пролистала их, пока один не привлёк её внимание.\n\n\"…Мм? Это что?\"\n\"Это о Имашино Мисаки, одной из отряда Ариус.\"\n\"Хмм…\"\n\nМика пролистала файл с лёгкой улыбкой.\n\n\n\n\"Как нелепо… Столько шума только для того, чтобы её поймали? Однако жизней она унесла немало.\"\n\"Простите, Мика-сама…\"\n\nМика внимательно изучила приложенную фотографию, заметив шрамы на её руках и шее.\nСо злобной улыбкой она приказала:\n\n\"Не в обычный лагерь. Отправь её в тот, что на балтийском побережье, ты знаешь какой.\"\n\"…Понял.\"\n\nДаже по одной фотографии Мика поняла, что это были следы самоповреждения.\nИ ей было забавно думать, как скоро эта женщина сломается под насилием.\nХотя она не понимала, почему та себя калечит, она знала, что та будет жить с последствиями всю жизнь.\nЭта мысль заставила её смеяться."
 TRN_opposition.322.a: "Memento mori"

 
#Хакари Ацуко
 TRN_opposition.13.t: "Нетронутый рассвет"
 TRN_opposition.13.d: "Прямо перед рассветом, когда всё ещё спало,\nАцуко поднималась по крутой горной тропе из последних сил.\nОна была уже измотана и покрыта пылью, но не останавливалась.\n\nКогда она достигла вершины, перед ней открылся вид.\nЧистое поле и несколько разбросанных вдалеке домов.\nИз некоторых домов шёл свет, и тут и там развевались флаги красного, белого и синего цветов.\n\nАцуко поняла, что у неё получилось.\nОна опустила взгляд на долину и медленно выдохнула.\nХолодный и чистый утренний воздух прояснил её разум, и тьма ночи, которой она так боялась, теперь казалась элегантной и доброй.\nКак танцуя, она прыгала по траве, не переставая двигаться.\n\nВскоре она спустилась с горы и легла на бревно посреди поля.\nСолнце уже начинало вставать.\nКогда в последний раз она спокойно созерцала солнце?\nХотя мир не изменился, всё казалось ей новым и прекрасным.\nХакари Ацуко наконец отпустила все свои оковы."
 TRN_opposition.13.a: "Есть ли что-то новое под солнцем? Было уже в веках, бывших прежде нас."
 TRN_opposition.132.t: "Когда ты смотришь в бездну"
 TRN_opposition.132.d: "Хотя и не так, как Нагиса, она тоже была одной из самых дорогих подруг Мики.\nИногда она раздражала её длинными и непонятными словами, но всё же она была милой.\n\nПоэтому Мика не хотела, чтобы это так закончилось.\nЭто не было её судьбой.\nИ всё же во сне она всегда смотрела на неё пустыми глазами с поверхности кровавого озера.\nНе только она.\nБесчисленные люди, устранённые Микой, тоже смотрели на неё сбоку.\n\nК счастью, той ночью её разбудил не кошмар, а телефонный звонок.\nМика села, ошеломлённая, и подняла трубку.\n\n\nВскоре после звонка она разбила трубку руками и вышла из спальни.\n\nКогда её секретарь вбежала в кабинет, она застала Мику, покрытую красным, среди разбитой мебели и нескольких ответственных за операцию, валявшихся на полу.\n\nПока секретарь выходила, чтобы уладить ситуацию, Мика посмотрела на фотографию на своём столе.\nНа ней Хакари Ацуко мягко улыбалась, идя по полю при лунном свете, словно танцуя.\n\nЗатем Мика увидела своё собственное отражение в разбитом зеркале.\nПокрытая кровью и пылью, её фигура была жалкой и зловещей.\n\n\"…Что я делаю…?\"\n\nЕё сухой голос эхом разнёсся по комнате, но никто ей не ответил."
 TRN_opposition.132.a: "Бездна также смотрит на тебя"

 TRN_opposition.23.t: "Чтобы мы больше не встречались"
 TRN_opposition.23.d: "Наследница благородной крови президентов-хранительниц Ариуса, она была предназначена стать новым президентом.\n\nНо в хаосе она была низведена до простой жертвы ради славы Ариуса.\nЕё законный трон был отнят взрослым, и её будущее окрасилось в серый цвет.\n\nНо Хакари Ацуко не сломалась.\nСо своими подругами, как со своей семьёй, она лелеяла маленькую надежду когда-нибудь стать свободной.\nЭта маленькая надежда поддерживала её.\n\nНо она также знала, что не хочет снова видеть своих любимых ранеными.\nОна выбрала самопожертвование, чтобы отвлечь внимание преследователей.\nВ красном тумане, окутавшем её, словно обнимая, она наконец почувствовала освобождение.\n\nПоследнее, что она видела, были лица трёх самых дорогих ей людей.\nТех, кого она больше никогда не увидит, кого любила больше всех.\nАцуко молча попрощалась с ними."
 TRN_opposition.23.a: "...И наконец, будь счастлива."
 TRN_opposition.232.t: "Высочайший акт"
 TRN_opposition.232.d: "Хотя и не так, как Нагиса, она тоже была одной из самых дорогих подруг Мики.\nИногда она раздражала её своими замысловатыми словами, но всё же была милой.\n\nПоэтому Мика не хотела, чтобы это так закончилось.\nЭто не было её судьбой.\nИ всё же во сне она всегда смотрела на неё с окровавленной поверхности пустыми глазами.\nНе только она.\nБесчисленные люди, устранённые Микой, тоже смотрели на неё сбоку.\n\nК счастью, той ночью её разбудил не кошмар, а телефонный звонок.\nМика села, взяла трубку и молча выслушала.\n\nЗатем она повесила трубку и задумалась.\n\nХакари Ацуко, законная наследница Ариуса, бросилась в огонь как жертва.\nХотя это не должно было быть так, она предложила себя, чтобы защитить незначительные вещи.\nИмело это смысл или нет, уже не важно.\n\nВ смятении Мика снова подняла трубку и позвонила своему секретарю.\n\n\"…Привезите Хакари Ацуко сюда, и чтобы она не сломалась в пути.\"\n\nОна просто хотела своими глазами увидеть конец, который та выбрала.\nМожет быть, тогда она сможет спать спокойно какое-то время.\nИгнорируя голоса в голове, она закрыла глаза и рухнула на кровать."
 TRN_opposition.232.a: "Свеча существует не для того, чтобы светить самой себе."

 TRN_opposition.33.t: "Возвращение"
 TRN_opposition.33.d: "У каждого человека своя судьба.\nМы знаем, что судеб столько же, сколько людей, независимо от их веса.\nСудьбой Ацуко был блестящий, но одинокий трон.\n\nНо она сопротивлялась, по своей или чужой воле.\nОна просто хотела быть обычной студенткой, не принцессой и не жертвой, идти рядом с теми, кого любила.\n\nНо судьба вернулась так же внезапно, как и была отнята.\nУвидев ищеек Тринити, входящих в её скромное убежище, она поняла, что не сбежала.\n\nТак её снова увели во тьму.\nПринцесса вернулась на свой холодный и одинокий трон."
 TRN_opposition.33.a: "Лучше не видеть света и не знать мира"
 TRN_opposition.332.t: "Тёмная ночь"
 TRN_opposition.332.d: "Хотя и не так, как Нагиса, она тоже была одной из самых дорогих подруг Мики.\nИногда она раздражала её своими замысловатыми словами, но всё же была милой.\n\nПоэтому Мика не хотела, чтобы это так закончилось.\nЭто не было её судьбой.\nИ всё же во сне она всегда смотрела на неё с окровавленной поверхности пустыми глазами.\nБесчисленные люди, устранённые Микой, тоже смотрели на неё.\n\nК счастью, той ночью её разбудил телефонный звонок.\nМика села, взяла трубку и выслушала.\n\nПовесив трубку, она широко улыбнулась, болтая ногами, сидя на кровати.\n\nХакари Ацуко поймали.\nБез потерь и боя, тихо.\nВ отличие от неуклюжих военных, тайная полиция сработала эффективно.\n\nС поимкой Ацуко Ариус больше не представлял угрозы.\nВпервые за долгое время Мика почувствовала, что всё снова встало на свои места.\nОна откинулась на кровать и посмотрела в окно.\n\nВ конце концов, она тоже могла бы сиять, как звёзды, когда всё закончится.\nС этой верой она закрыла глаза и заснула."
 TRN_opposition.332.a: "Только в темноте можно увидеть звёзды"

 #Цутинага Хиёри
 TRN_opposition.14.t: "Разве ты этого не предвидел?"
 TRN_opposition.14.d: "Честно говоря, никто бы не догадался.\nКто бы мог подумать, что беглянка средь бела дня купит билет на поезд, чтобы пересечь границу?\n\nУ неё хватило смелости пробраться в собор, украсть монашеское облачение и погрузить весь свой багаж в вагон для перевозки скота.\nЗатем она села в самом дальнем углу поезда, приняла благочестивую позу, как будто молилась, и крепко заснула.\n\nДаже когда контролёры вошли в поезд на границе, они не увидели её ореола, потому что она спала, и её присутствие было настолько незначительным, что никто не заподозрил в ней члена отряда Ариус.\n\nКогда жандармерия поняла, что это была Цутинага Хиёри, она уже прибыла на центральный вокзал Будапешта.\nСидя в поле перед вокзалом, она потянулась под тёплым солнцем и, впервые за долгое время, посмотрела на голубое небо и счастливо улыбнулась."
 TRN_opposition.14.a: "Хе-хе~ Я выжила~!"

 TRN_opposition.144.t: "Перед лицом суровой реальности"
 TRN_opposition.144.d: "Кирифудзи Нагиса и Мисоно Мика были подругами с давних пор.\nНо при нынешних обстоятельствах их уже нельзя было называть подругами.\nНагиса была побеждённой, лишённой свободы переворотом, а Мика была той, кто её сверг.\n\nПеред ними стоял элегантный чайный столик, но с зарешёченными окнами и вооружённой охраной у двери.\nВнутри Мика весело болтала, как всегда, рассказывая о пустяках.\nНагиса, не проявляя никаких эмоций, молча потягивала чай.\nХотя у неё уже давно не было слуг и солнечного света, она всё ещё сохраняла своё достоинство.\n\n\"А потом этот щенок, знаешь?—\"\n\"Госпожа Мика, пришла телеграмма.\"\n\nЕё секретарь прервал пустую болтовню.\nМика, всё ещё улыбаясь, молча прочитала сообщение.\n\n\n\n\"…Что?\"\n\nВ одно мгновение её выражение исказилось, и в комнате воцарилась тишина.\n\n\"Сбежала? На поезде…? Ты издеваешься?\"\n\"Соответствующее министерство проводит расследование…\"\n\nПрежде чем секретарь успела закончить, Мика швырнула в неё чашку, которая разбилась о её лоб, пуская кровь.\n\n\"Вы идиоты? Как вы могли упустить эту никчёмную девчонку с таким дешёвым трюком? Это неприемлемо!\"\n\"…Хе…\"\n\nСмех Нагисы остановил гнев Мики.\nС холодной и бесцветной улыбкой Нагиса посмотрела на неё.\n\n\"Твои дурные привычки ухудшились, Мика. Всегда, когда дела шли не по-твоему, ты хныкала как младенец.\"\n\nПокраснев от гнева, Мика вышла из комнаты, застрелив двух охранников, которые встали на её пути.\nНагиса, оставшись одна, потягивала чай со слабой улыбкой. Всё рушилось, но по крайней мере в этот момент она улыбалась."
 TRN_opposition.144.a: "Улыбка — единственное, что у меня осталось."

 TRN_opposition.24.t: "Последнее извинение"
 TRN_opposition.24.d: "Выстрел прогремел по всей улице и попал в лоб незадачливого.\nПока преследователи рассредоточивались, Хиёри перезарядила затвор.\n\nЕё жизнь всегда была несчастной.\nИзолированная и подавляемая, она просто хотела выжить.\nСреди насилия и критики она яростно боролась за жизнь и поэтому продолжала нажимать на курок.\n\nНо сопротивление длилось недолго.\nКогда она перезаряжала оружие, кто-то выбил дверь, и она выстрелила первому в плечо.\nНо другой набросился на неё, её выстрел не попал, её обезоружили, и она упала к стене.\n\nВ угасающем сознании она увидела, как преследователь, который её одолел, плачет, обнимая труп своего товарища.\n\n\"…Прости… про…сти…\"\n\nПоследними силами она прошептала искреннее извинение, первое, которое она произнесла кому-либо."
 TRN_opposition.24.a: "Как страдает глупец, так страдаю и я, и это тоже суета."

 TRN_opposition.244.t: "Вы — соль земли"
 TRN_opposition.244.d: "Кирифудзи Нагиса и Мисоно Мика были подругами с давних пор.\nНо их уже нельзя было называть подругами.\nНагиса была побеждённой, Мика — её палачом.\n\nПеред ними стоял элегантный столик, но с решётками на окнах и вооружённой охраной снаружи.\nМика болтала, как обычно, а Нагиса молча пила чай, всё ещё с достоинством.\n\n\"А потом этот щенок, знаешь?—\"\n\"Госпожа Мика, пришла телеграмма.\"\n\nМика прочитала сообщение, всё ещё улыбаясь.\n\n\n\n\"Ага… и? Чего ты от меня ждёшь?\"\n\nС вопросительной улыбкой Мика посмотрела на своего секретаря.\n\n\"Я должна радоваться, получая такой доклад в такой момент?\"\n\"Простите… я не подумала…\"\n\nНагиса молча наблюдала.\nЭто была не та Мика, которую она знала.\nОна вздохнула про себя, чувствуя горечь чая."
 TRN_opposition.244.a: "Если же соль потеряет силу, чем сделаешь её солёною?"

 TRN_opposition.34.t: "Тяжёлые шаги"
 TRN_opposition.34.d: "Цутинага Хиёри была лучшим снайпером Ариуса.\nНо она не была непобедимой.\n\nС дюжиной преследователей она могла только прятаться.\nКогда преследователи окружили деревню, она спряталась под раковиной.\n\nНо она больше не могла прятаться.\nПреследователи поджигали дома один за другим.\nУвидев пламя, она погладила свой пистолет.\n\nНо она покачала головой и оставила его.\nВсё было суетой, но она хотела жить.\n\nОна подняла руки и вышла наружу.\nКаждый шаг был тяжёлым и липким, но она знала, что это её единственный выбор."
 TRN_opposition.34.a: "Не будь слишком зол и не будь глуп: зачем тебе умирать не в своё время?"

 TRN_opposition.344.t: "Блаженны кроткие"
 TRN_opposition.344.d: "Кирифудзи Нагиса и Мисоно Мика были подругами с давних пор.\nНо их уже нельзя было называть подругами.\nНагиса была побеждённой, Мика — её палачом.\n\nПеред ними стоял элегантный столик, но с решётками и вооружённой охраной.\nМика весело болтала, а Нагиса молча пила чай.\n\n\"А потом этот щенок, знаешь?—\"\n\"Госпожа Мика, пришла телеграмма.\"\n\nМика прочитала сообщение, улыбаясь.\n\n\n\n\"Ах, понятно. Её поймали? Этого вы от меня хотели?\"\n\nНесмотря на улыбку, она бросала ядовитые слова своему секретарю.\n\n\"Вы сожгли целую деревню, чтобы её поймать? И она сдалась сама? Вы ждали, что я обрадуюсь?\"\n\nНагиса закрыла глаза.\nЭто была не та Мика, которую она знала.\nОна тихо вздохнула, чувствуя чай горше, чем когда-либо."
 TRN_opposition.344.a: "Они наследуют землю."
 
 ##Нагиса
 TRM_event.363.t: "Возвращаясь домой"
 TRM_event.363.desc: "Закрыв последнюю коробку с вещами, Йохан потянулся, чтобы снять напряжение со спины, и перевёл дух. Но он едва успел передохнуть, как женщины снаружи поторопили его, и он продолжил упаковку. Закончив, он погрузил всё в машину, отдал ключи от дома члену Департамента юстиции и отправился в путь. Из окна машины он бросил последний взгляд на родные улицы Вроцлава, завёл мотор и уехал.\n\nПриказ о высылке неразрешённых иностранцев, недавно изданный «Железной леди», вступил в силу по всему Тринити в тот же день. В Мекленбурге, Саксонии, Силезии и Польском коридоре многие были вынуждены покинуть свои дома и отправиться в холодные и одинокие земли. Слабое сопротивление было подавлено Департаментом юстиции, и лишённые крова уехали в слезах.\n\nНа одной из старых улиц, где он вырос, проезжая мимо пекарни, где он обычно покупал крендели — теперь с большой вывеской ВЫСЕЛЕНИЕ — Йохан миновал указатель на Вроцлав и направился в Краков, проливая нескончаемые слёзы. Может быть, потому что там он оставил всё, чем был.\n\nВытирая слёзы платком, он ехал к своему отцу, которого никогда не хотел видеть снова.\n\nВ детстве Йохан страдал от пьяных побоев отца. Когда терпеть стало невозможно, он один сбежал из Кракова во Вроцлав, работая уборщиком и чернорабочим, пока не стал независимым. И вот теперь, спустя столько лет, он возвращался в Краков.\n\nЕго долгое бегство наконец закончилось."
 TRM_event.363.a: "И Йохан снова вытер слёзы."
 TRM_event.364.t: "Публичная речь"
 TRM_event.364.desc: "В разработке"
 TRM_event.364.a: "И Нагиса медленно спустилась с трибуны."
 TRM_event.365.t: "Гость в Круппе"
 TRM_event.365.desc: "Во временной штаб-квартире Круппа в Щецине Густав Крупп смотрел в окно, погружённый в глубокую тревогу.\n\nПосле великой войны Германия была разделена на две части, и компания Крупп едва выживала. Нервный и напуганный за будущее своих рабочих, которые едва могли спать, Густав без конца думал о том, что делать: что станется с заводами в Генне? Должен ли он уйти из тяжёлой промышленности? Как конкурировать с Eden Group?\n\nПока его разум вращался вокруг этих вопросов, его секретарь ворвалась с сообщением: \"Господин, посетительница из Эдема\".\n\nОзадаченный, Густав принял её в своём кабинете: это была Кирифудзи Нагиса.\n\nУдивлённый, но вежливый, он пригласил её сесть.\n\n\"Всё ли в порядке в Круппе?\", спросила Нагиса.\n\nГустав, будучи искренним, ответил: \"Если бы я сказал, что да, я бы солгал. Нет, дела идут неважно\".\n\nНагиса, попивая чай, сделала ему предложение: \"Как насчёт того, чтобы поработать под началом Тринити?\".\n\nСердце Густава забилось сильнее: была ли это спасательная верёвка или ловушка?\n\nНагиса прервала молчание: \"Мы ждём вашего положительного ответа в Эдеме. Хорошего дня\". Она встала и ушла."
 TRM_event.365.a: "И когда дверь закрылась, трубка всё ещё дымилась."
 TRM_event.366.t: "Покинутая вера"
 TRM_event.366.desc: "История ненавиди так же стара, как само общество. Будь то страх, ревность или непреднамеренный вред, она оставляет жертв, шрамы и, как ни парадоксально, прогресс.\n\nТо, что Тринити и Генна ненавидят друг друга даже после великой войны, неудивительно: ненависть к другому — их самое большое сходство.\n\nОдна девушка из Сестринства плакала, окровавленная и разбитая. Когда Тринити объявил Генну «неспособной к диалогу», она не могла этого принять: Господь любит всех, даже Генну. Но её голос игнорировали в шуме ненависти и насилия.\n\nПока бои бушевали, девушка, одинокая и сжавшаяся, винила себя и Господа за то, что Он всё это допустил, тихо плача."
 TRM_event.366.a: "Пылающая печь, плачущее небо"
 TRM_event.367.t: "Всё приходит к концу"
 TRM_event.367.desc: "Тосиро Ай из Департамента юстиции была озадачена: \"Между Тринити и Генной никогда не будет вражды\". Для верной последовательницы Мики это было непостижимо.\n\nРассердившись, она нарочно столкнулась с членом Дисциплинарного комитета. Но когда она увидела упавший на землю пирог, идентичный тому, что был в её любимой кондитерской, что-то в её сердце изменилось. Вместо того чтобы ударить её, она помогла ей подняться: \"Прости… я пойду куплю другой\".\n\nВ кондитерской девушка из Генны улыбнулась: \"Тебя зовут…?\". Ай вздохнула и достала телефон, чтобы обменяться номерами."
 TRM_event.367.a: "\"…Тосиро Ай.\""
 TRM_event.368.t: "Кондитерский клуб и Гурман-клуб"
 TRM_event.368.desc: "В рамках примирения между Тринити и Генной клубы обеих школ встретились. В кафе в Эрфурте Кондитерский клуб ждал Гурман-клуб.\n\nСнаружи взорвался грузовик с сосисками, и члены Гурман-клуба вошли как ни в чём не бывало. Бариста в ужасе спрятался. Встреча началась с любезностей, пока не появились сырные и сливочные торты: \"Вкусно!\".\n\nНо Харуна из Гурман-клуба воскликнула: \"Это ересь против гастрономии!\", и взорвала ещё одну бомбу, разрушив кафе, прежде чем уйти."
 TRM_event.368.a: "Ну, по крайней мере, было вкусно."
 TRM_event.369.t: "Предложение Тринити"
 TRM_event.369.desc: "Письмо из Эдема предлагало решить все проблемы Абидоса в обмен на его аннексию Тринити. Заманчивое предложение, но явная ловушка для поглощения."
 TRM_event.369.a: "Отказать."
 TRM_event.369.b: "У нас нет другого выбора…"
 TRM_event.370.t: "Абидос принимает"
 TRM_event.370.desc: "Абидос принял наше предложение, и теперь мы едины."
 TRM_event.370.a: "Хорошо!"
 TRM_event.371.t: "Абидос сопротивляется"
 TRM_event.371.desc: "Абидос отверг наше предложение, заявив, что не попадётся в \"наглую аннексионную ловушку\", и готовится к войне."
 TRM_event.371.a: "Если не словами, то оружием."

 ## Нагиса - Великий компромисс
 TRM_event.358.t: "Пролог"
 TRM_event.358.desc: "В день с тёплым солнцем и свежим ветерком Чайная вечеринка Тринити и Хяккияко из Генны собрались в Большом соборе, чтобы положить конец своей давней вражде.\n\nБольшой собор, место проведения исторического Собора объединения, был идеальной площадкой для исторического «Эдемского соглашения».\n\nКирифудзи Нагиса от Чайной вечеринки и Ханума Макото от Хяккияко необычно тепло улыбнулись друг другу, обменялись рукопожатием и сели за стол, в то время как камеры Школы Кронос запечатлевали сцену перед внимательными взорами студенток Кивотоса.\n\n\"Надеюсь, ваше путешествие было спокойным\", сказала Нагиса.\n\n\"Ага! Они подготовили всё как положено для такого способного человека, как я\", ответила Макото. \"Хе-хе, хватит болтать. Перейдём к делу.\"\n\nВ этой сердечной атмосфере присутствующие положили на столы элегантно переплетённые документы, озаглавленные:\n\n\"Великий компромисс между Академией Тринити и Академией Генны для Эдемского соглашения\"\n\nИсторический момент, который запомнят поколения, вот-вот должен был начаться."
 TRM_event.358.a: "\"Посмотрим первую главу.\""
 TRM_event.359.t: "Первая глава"
 TRM_event.359.desc: "Звук перелистываемых страниц раздался эхом, пока помощник Чайной вечеринки читал:\n\n\"Первое соглашение — это Договор о вечной дружбе. Вкратце, все враждебные действия между обеими сторонами прекращаются.\"\n\nМакото нахмурилась.\n\n\"Хмм? Разве мы не договаривались об этом, когда готовили компромисс? Вы что, не доверяете Обществу Пандемониум?\"\n\nНагиса, скрывая удивление от холодного ответа Макото, дипломатично улыбнулась:\n\n\"Нет, мы просто хотим развеять все подозрения.\"\n\nМакото расхохоталась:\n\n\"Хе, как интересно. Уже с самого начала пытаетесь с нами мериться силами.\"\n\nСердечная атмосфера стала ледяной, и слышно было только, как перья подписывают соглашение."
 TRM_event.359.a: "Первое соглашение — Принято."
 TRM_event.360.t: "Вторая глава"
 TRM_event.360.desc: "На этот раз помощник Хяккияко нарушил молчание:\n\n\"Второе соглашение касается консолидации клубов. Слияние наших академий удвоит количество клубов, что неприемлемо для новой администрации студенческого совета.\"\n\nНо обе стороны колебались подписывать просто так.\n\n\"Мы против роспуска Клуба развития онсэнов. Это гордый клуб Генны.\"\n\n\"Правда? Этот клуб натворил бед по всему Кивотосу… его следует закрыть.\"\n\nМакото возразила с насмешливым смехом:\n\n\"Тогда вам тоже следует закрыть свой Класс дополнительных занятий, с их неудачами и беспорядками. Ха!\"\n\nПереведя дух, Нагиса кивнула:\n\n\"По крайней мере, мы согласны консолидировать похожие клубы.\"\n\nМакото, удовлетворённая, подписала с улыбкой."
 TRM_event.360.a: "Второе соглашение — Принято."
 TRM_event.361.t: "Третья глава"
 TRM_event.361.desc: "Третья глава касалась состава объединённого студенческого совета: включать ли всех членов обеих сторон или только избранных?\n\nМакото, уверенно:\n\n\"Со мной одной всё будет работать. Не так ли, Ироха?\"\n\nИроха вздохнула:\n\n\"Если вы это серьёзно, вам придётся взять на себя всю мою работу.\"\n\nНагиса вмешалась:\n\n\"Я думаю, все должны участвовать. Больше рук — меньше нагрузка.\"\n\nУслышав эти слова, Ироха была удивлена, Макото вздохнула, но на этот раз быстро подписала.\n\nНовый совет будет включать всех членов обеих сторон."
 TRM_event.361.a: "Третье соглашение — Принято."
 TRM_event.362.t: "Заключительная глава"
 TRM_event.362.desc: "Наконец настал заключительный момент. Когда развернули последний документ, там было всего одно большое слово:\n\n\"Соединённые Штаты Эдема\"\n\nОбе стороны заколебались. Это был момент определить окончательные рамки: Соединённые Штаты Эдема гарантировали бы равенство и взаимное вето под одним флагом, но с ещё не разрешённой напряжённостью, немедленно ввести это было нелегко.\n\nПосле долгих часов дебатов они так и не смогли принять решение."
 TRM_event.362.a: "Заключительная глава — В ожидании."

 TRM_event.372.t: "Сейя Юридзоно просыпается в своей постели"
 TRM_event.372.desc: "После госпитализации в начале хаоса в Тринити Сейя Юридзоно очнулась и просит срочно увидеть Нагису. Как лидер фракции Санктус, она начинает перегруппировывать своих разбросанных членов." 
 TRM_event.372.a: "…"

 TRM_event.373.t: "Политизированная Чайная вечеринка"
 TRM_event.373.desc: "Чрезвычайные меры после подавления переворота фракции Патер не были отменены, изменив структуру власти: с демонтированным Санктусом и устранённым Патером осталась только фракция Филиус Нагисы."
 TRM_event.373.a: "…Это не то, чего я хотела."

 TRM_event.374.t: "Некоторые поправки"
 TRM_event.374.desc: "С Филиус у руля необходимо сохранять контроль, чтобы избежать нового переворота. Нагиса останется единственным лидером, хотя и не желая этого, она знает, что не может допустить больше хаоса."
 TRM_event.374.a: "…Это будет только на время."

 TRM_event.375.t: "Создание Класса дополнительных занятий"
 TRM_event.375.desc: "Нагиса решила больше не терпеть безрассудства Мики. Когда нужный человек прибыл, она сказала:\n\n\"Хифуми, у тебя важная миссия. Вступи в недавно созданный Класс дополнительных занятий и займись наблюдением за угрозами Тринити.\"\n\nТак, по прямому приказу Нагисы, был создан Класс дополнительных занятий для перевоспитания проблемных."
 TRM_event.375.a: "Я не могу сидеть сложа руки."

 TRM_event.376.t: "Один день из жизни Мики"
 TRM_event.376.desc: "\"Хмм? А где мой прежний помощник?\", с любопытством спросила Мика. Новый помощник ответил:\n\n\"Уволился несколько дней назад. Наверное, слишком много стресса.\"\n\nМика пробормотала: \"Странно. Казалось, ему нравится… он даже проявлял энтузиазм на последнем собрании.\"\n\nПомощник бесстрастно улыбнулся: \"Странные вещи случаются.\"\n\nМика смотрела на него мгновение, но больше ничего не сказала, хотя холод во взгляде оставался."
 TRM_event.376.a: "Сиди спокойно в своей клетке, Мика."

 TRM_event.401.t: "[FROM.GetName] требует капитуляции"
 TRM_event.401.desc: "[FROM.GetName] требует нашего сотрудничества в войне против Генны, обещая освободить немецкий народ под Тринити. Отказ будет считаться национальным предательством и поводом для вторжения."
 TRM_event.401.a: "\"Крылатая Германия\"… какая шутка."
 TRM_event.401.b: "У нас нет выбора."

 TRM_event.402.t: "[FROM.GetName] отказывает"
 TRM_event.402.desc: "Они отказали в нашей просьбе о сотрудничестве, назвав нас фальшивой Германией и заявив, что предпочтут умереть в борьбе."
 TRM_event.402.a: "Для предателей есть только смерть."

 TRM_event.403.t: "Армия присоединяется"
 TRM_event.403.desc: "[FROM.GetName] решила сотрудничать в нашей войне и присоединиться к нашим силам."
 TRM_event.403.a: "Добро пожаловать, верные немцы."

 TRM_event.404.t: "Утрата доверия к правительству"
 TRM_event.404.desc: "Политика безопасности была отменена из-за войны, и люди начинают не доверять нашему руководству."
 TRM_event.404.a: "Ну и ну…"

 TRM_event.405.t: "Учения на Везере"
 TRM_event.405.desc: "Наша армия уже давно планировала операции в Скандинавии. Самая последняя из них — «Учения на Везере»."
 TRM_event.405.a: "Начинайте наступление!"


# События фракций с трёхзначными номерами
# 1(классификация лояльности 1-4) 1(классификация поддержки 1-3) 1(порядок)

 TRN_faction_event.111.t: "Протест фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.111.desc: "Фракция [TRN_faction_event_2_name_text] вышла на улицы, чтобы критиковать наши действия. Они заняли главные проспекты и устраивают беспорядки, заявляя, что не остановятся, пока мы не удовлетворим их требования."
 TRN_faction_event.111.a: "Ну и ну…"

 TRN_faction_event.112.t: "Антивоенный протест фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.112.desc: "Фракция [TRN_faction_event_2_name_text] начала протест против нашей войны, утверждая, что наши действия разрушают жизнь народа. Они заняли главные проспекты и устраивают беспорядки."
 TRN_faction_event.112.a: "Это плохо…"

 TRN_faction_event.121.t: "Захват правительства штата фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.121.desc: "Фракция [TRN_faction_event_2_name_text] силой захватила правительство штата [TRN_faction_event_121_target.GetName] и провозгласила революцию, намереваясь свергнуть нас и установить новый режим.\n\nК счастью, народное волнение не очень велико, и мы можем немедленно подавить восстание, если захотим… хотя это может значительно увеличить их народную поддержку."
 TRN_faction_event.121.a: "Попробуем примирительный подход."
 TRN_faction_event.121.b: "Раздавить их сейчас же!"

 TRN_faction_event.122.t: "Протест против экономической мобилизации фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.122.desc: "Фракция [TRN_faction_event_2_name_text] критикует масштабы нашей экономической мобилизации и заполнила проспекты листовками, требующими её немедленного прекращения.\n\nИх требования набирают популярность среди народа, и если мы их проигнорируем, их влияние может значительно возрасти."
 TRN_faction_event.122.a: "…"

 TRN_faction_event.123.t: "Протест против принудительного призыва фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.123.desc: "Фракция [TRN_faction_event_2_name_text] осуждает нашу политику призыва как чрезмерную и требует прекратить принудительный призыв и вернуть солдат домой.\n\nИх требования набирают популярность среди народа, и если мы их проигнорируем, их влияние может значительно возрасти."
 TRN_faction_event.123.a: "…"

 TRN_faction_event.131.t: "Забастовка, организованная фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.131.desc: "Фракция [TRN_faction_event_2_name_text] использовала подконтрольные ей профсоюзы, чтобы начать масштабную забастовку.\n\nОни заявили, что забастовка будет продолжаться бесконечно, пока мы не удовлетворим их требования, что может нанести серьёзный ущерб нашей промышленности."
 TRN_faction_event.131.a: "Начнём переговоры."

 TRN_faction_event.132.t: "Отставка министра, инициированная фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.132.desc: "Фракция [TRN_faction_event_2_name_text] использовала своё влияние в правительстве, чтобы добиться отставки одного из наших ключевых чиновников.\n\nОни строго предупредили нас, что если мы продолжим отстранять их от правительства, будут ещё худшие последствия."
 TRN_faction_event.132.a: "Ну и ну…"

 TRN_faction_event_132_tt: "§YСоветник§! из §Y[THIS.GetName]§! отправлен в отставку"
 TRM_forced_dismissal_flag: "§YНедавно отправлен в отставку§!"

 ##############

 TRN_faction_event.211.t: "Собрание фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.211.desc: "Одна из наших оппозиционных фракций, [TRN_faction_event_2_name_text], провела небольшое собрание.\n\nНа этом собрании начали с критики политики [ROOT.GetLeader], и главной целью было определить направление фракции и спланировать привлечение сторонников."
 TRN_faction_event.211.a: "Не большая проблема."

 TRN_faction_event.212.t: "[TRN_faction_event_2_name_text] просит войти в правительство"
 TRN_faction_event.212.desc: "[TRN_faction_event_2_name_text] выразила желание войти в нашу администрацию. Хотя в прошлом их отношения с нами были не очень хорошими, похоже, они хотят улучшить отношения и увеличить своё влияние через эту возможность."
 TRN_faction_event.212.a: "Это положительно."
 TRN_faction_event.212.b: "Я не доверяю их намерениям."

 TRN_faction_event.221.t: "[TRN_faction_event_2_name_text] требует развития штата [TRN_development_of_specific_state_event_target.GetName]"
 TRN_faction_event.221.desc: "[TRN_faction_event_2_name_text] утверждает, что штат [TRN_development_of_specific_state_event_target.GetName] находится в экономически невыгодном положении, и подала петицию о привлечении промышленности в этот регион."
 TRN_faction_event.221.a: "Хорошо, мы примем это к сведению."

 TRN_faction_event.222.t: "Лоббирование правительства фракцией [TRN_faction_event_2_name_text]"
 TRN_faction_event.222.desc: "К нам поступили сообщения, что фракция [TRN_faction_event_2_name_text] использовала своё политическое влияние, чтобы заручиться поддержкой внутри нашего правительства.\n\nВ результате этих манёвров некоторые наши чиновники, похоже, перешли на их сторону, и их влияние продолжает расти без нашего вмешательства."
 TRN_faction_event.222.a: "…"

 TRN_faction_event.223.t: "[TRN_faction_event_2_name_text] публично критикует нас"
 TRN_faction_event.223.desc: "В недавнем коррупционном скандале с участием нескольких членов нашей администрации фракция [TRN_faction_event_2_name_text] жёстко обвинила нас как главных виновников.\n\nЭта публичная критика принесла им поддержку среди студенток и ослабила наше влияние."
 TRN_faction_event.223.a: "Ну и ну…"

 TRN_faction_event.231.t: "[TRN_faction_event_2_name_text] возглавляет экономическое планирование"
 TRN_faction_event.231.desc: "Фракция [TRN_faction_event_2_name_text] использовала своё влияние в правительстве, чтобы играть важную роль в разработке текущей экономической политики, вынуждая нас следовать их плану строительства."
 TRN_faction_event.231.a: "Слишком много вмешательства…"

 TRN_faction_event.232.t: "[TRN_faction_event_2_name_text] атакует [TRN_faction_event_3_name_text]"
 TRN_faction_event.232.desc: "Фракция [TRN_faction_event_2_name_text] начала политическое наступление на одного из наших главных союзников, фракцию [TRN_faction_event_3_name_text]. Хотя последняя просила нас о помощи, её имидж уже серьёзно пострадал."
 TRN_faction_event.232.a: "Ничего не поделаешь."
 TRN_faction_event.232.b: "Выпустите заявление о поддержке."

 TRM_government_plan_good: "Включено в промышленный план"
 TRM_government_plan_bad: "Не включено в промышленный план"


 ##################

 TRN_faction_event.311.t: "[TRN_faction_event_2_name_text] выражает озабоченность по поводу экономической мобилизации"
 TRN_faction_event.311.desc: "Фракция [TRN_faction_event_2_name_text] выразила глубокую озабоченность возможными экономическими проблемами, вытекающими из нашей политики экономической мобилизации.\n\nХотя эта фракция поддерживала дружественные отношения с [ROOT.GetLeader], похоже, мобилизация нанесла ущерб этим отношениям."
 TRN_faction_event.311.a: "Ну и ну…"
 
 TRN_faction_event.312.t: "[TRN_faction_event_2_name_text] выражает озабоченность по поводу массового призыва"
 TRN_faction_event.312.desc: "Фракция [TRN_faction_event_2_name_text] широко обсуждала нашу политику призыва.\n\nХотя эта фракция поддерживала дружественные отношения с [ROOT.GetLeader], похоже, призыв нанёс ущерб этим отношениям."
 TRN_faction_event.312.a: "Этого не избежать."

 TRN_faction_event.313.t: "Собрание фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.313.desc: "Фракция [TRN_faction_event_2_name_text] провела собрание для расширения своего влияния, используя своё политическое сотрудничество с нами.\n\nЭта фракция решила использовать свои отношения с [ROOT.GetLeader] для укрепления своего политического влияния, и через несколько дней они начали расклеивать пропагандистские плакаты."
 TRN_faction_event.313.a: "Неплохо."

 TRN_faction_event.321.t: "Популяризация фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.321.desc: "Фракция [TRN_faction_event_2_name_text], по-видимому, утвердилась как голос умеренности в Тринити.\n\nИх неприятие экстремистских или антиправительственных действий принесло им симпатию общественности.\n\nОднако их рост сделал их одним из наших главных оппонентов, что для нас не совсем положительно."
 TRN_faction_event.321.a: "Хмм…"

 TRN_faction_event.322.t: "Радикализация фракции [TRN_faction_event_2_name_text]"
 TRN_faction_event.322.desc: "Фракция [TRN_faction_event_2_name_text], по-видимому, объединилась вокруг нового политического лидера и радикализировалась в ответ на напряжённую внутреннюю ситуацию.\n\nРаньше они были нашими союзниками, но теперь их курс неясен."
 TRN_faction_event.322.a: "Нужно продолжать наблюдать."

 TRN_faction_event.323.t: "[TRN_faction_event_2_name_text] выступает против войны"
 TRN_faction_event.323.desc: "Фракция [TRN_faction_event_2_name_text] осторожно выразила своё несогласие с нашей войной.\n\nОни указали на дестабилизированные рынки и нехватку сельхозпродукции как на причины просить скорейшего прекращения войны."
 TRN_faction_event.323.a: "…"

 TRN_faction_event.331.t: "[TRN_faction_event_2_name_text] втянута в политический скандал"
 TRN_faction_event.331.desc: "Фракция [TRN_faction_event_2_name_text] была названа главным фигурантом недавнего политического скандала, что резко снизило её общественную поддержку.\n\nХотя мы разделяем с ними некоторую идеологическую близость и понесли косвенный ущерб, наши потери были минимальными по сравнению с ними."
 TRN_faction_event.331.a: "Быстро разорвите связи."

 TRN_faction_event.411.t: "[TRN_faction_event_2_name_text] поддерживает войну"
 TRN_faction_event.411.desc: "Фракция [TRN_faction_event_2_name_text] поддержала наши военные операции и присоединилась к нашей пропаганде, атакуя пацифистов."
 TRN_faction_event.411.a: "Наша война — за выживание нации."

 TRN_faction_event.412.t: "[TRN_faction_event_2_name_text] ожидает награды за лояльность"
 TRN_faction_event.412.desc: "Фракция [TRN_faction_event_2_name_text] ожидает получить важную роль в новой политике в знак признания её долгосрочной поддержки правительства.\n\nЕсли мы проигнорируем их требования, их лояльность серьёзно пострадает."
 TRN_faction_event.412.a: "Мы должны их чем-то вознаградить."
 TRN_faction_event.412.b: "Им здесь нет места."

 TRN_faction_event.421.t: "[TRN_faction_event_2_name_text] организует массовые беспорядки"
 TRN_faction_event.421.desc: "Чрезмерное рвение со стороны фракции [TRN_faction_event_2_name_text] привело к крупным беспорядкам против наших политических оппонентов.\n\nНеразборчивые нападения серьёзно повредили имидж как их самих, так и правительства."
 TRN_faction_event.421.a: "Чёрт возьми…"

 TRN_faction_event.422.t: "[TRN_faction_event_2_name_text] поддерживает нас"
 TRN_faction_event.422.desc: "Фракция [TRN_faction_event_2_name_text], как наш главный союзник, провела эффективную пропагандистскую кампанию в нашу пользу.\n\nБлагодаря этому мы получили дополнительные политические ресурсы и укрепили основы для новой политики."
 TRN_faction_event.422.a: "Хорошо."

 TRN_faction_event.431.t: "[TRN_faction_event_2_name_text] вступает добровольцем"
 TRN_faction_event.431.desc: "Члены фракции [TRN_faction_event_2_name_text] добровольно вступили в наши вооружённые силы, движимые патриотизмом."
 TRN_faction_event.431.a: "Отлично."

 TRN_faction_event.432.t: "[TRN_faction_event_2_name_text] инвестирует в нас"
 TRN_faction_event.432.desc: "Фракция [TRN_faction_event_2_name_text] сделала значительные инвестиции в наши экономические проекты.\n\nЭтим жестом они подтвердили свою поддержку правительства и дали нам необходимый импульс для промышленного строительства."
 TRN_faction_event.432.a: "Их поддержка того стоила."

