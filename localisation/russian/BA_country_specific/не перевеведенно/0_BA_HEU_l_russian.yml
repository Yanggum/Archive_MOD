 HEU.flavor_event.34.t:0 "¿Por qué el jefe está aquí?"
 HEU.flavor_event.34.desc:0 "\"¿Que por qué estoy aquí?\"\n\nAru, que estaba firmando documentos del presupuesto minero enviados desde el Parlamento, se recostó en el sofá de la oficina y se cruzó con la mirada de Kayoko, que se había girado para verla. Con los brazos cruzados y la mirada apenas entrecerrada, Kayoko soltó con sequedad:\n\n\"El caos de Luxemburgo ya se resolvió. El Parlamento también vuelve a funcionar bien. Normalmente, tú dirías: 'Ah, ya hicimos todo lo que veníamos a hacer aquí. Como buenos forajidos, vámonos a buscar una nueva oficina'. Y con tu personalidad, tampoco cuadra pensar que te quedaste porque te apetezca un palacio.\"\n\nMientras escuchaba a Kayoko, la conciencia de Aru regresó a aquel día en que ocurrió la Gran Transposición. La escena de la ciudad, con llamas elevándose por todas partes. El edificio del palacio al que corrió siguiendo a los gendarmes que gritaban llorando: '¡Tenemos que salvar a Su Alteza el Gran Duque!'.\n\nTras someter a unos cuantos alborotadores de Gehenna alrededor del palacio, Aru dividió a la Agencia 68 en dos equipos y, junto a Mutsuki, registró el interior. No creía que fueran a encontrar nada en particular. Los de Gehenna solo querían montarse la fiesta aprovechando el ambiente. ¿No se habrían limitado a robar unas cuantas obras de arte del palacio?\n\nComo burlándose de esa idea, al abrir sin pensar la puerta del dormitorio, se desplegó ante ella un mar de sangre. Justo frente a la puerta, en diagonal, había... el cadáver de un hombre adulto despedazado por las balas... o algo parecido a un cadáver.\n\nPum. Pum. Pum. El corazón le latía como si fuera a estallar. Reprimiendo las náuseas, Aru caminó por el pozo de sangre. Y más allá. Detrás de la cama, vio a una mujer de mediana edad con varios impactos de bala. Mientras los gendarmes se arrodillaban frente a ella y, como sollozando, gritaban: '¡Su Alteza el Gran Duque!'.\n\nAru se acercó hasta quedar frente a la Gran Duquesa Charlotte. ¿Estaba muerta? No había manera de que siguiera viva. Pero, al menos para Aru, con los ojos bien abiertos, todavía era posible oír la voz de aquella mujer muerta.\n\n\"¿Mis niños están a salvo? ¿Pude... protegerlos?\"\n\nHabría sido una alucinación por el pánico. Y, aun así, mientras miraba los restos del niño sin cabeza que ella abrazaba con desesperación hasta el final, Aru...\n\n\"Claro que sí. Así que... así que... puedes irte tranquila.\"\n\nConteniendo las lágrimas que le brotaban, cerró lentamente los ojos de la Gran Duquesa Charlotte, muerta entre lágrimas de sangre. Y permaneció arrodillada largo rato frente a los restos del niño y de la Gran Duquesa, hasta que Mutsuki la agarró del hombro y la arrastró."
 HEU.flavor_event.34.a:0 "Solo que... sentí que no podía dejarlos aquí. Eso es todo."

 HEU.flavor_event.35.t:0 "Fundación del Movimiento Nacional Alemán"
 HEU.flavor_event.35.desc:0 "Hermanos camaradas germanos, soy Damian Kratzenberg. Sí. Estoy seguro de que muchos habrán escuchado la emisión que hace poco fue retransmitida en directo por radio y televisión a todo el país. Los que solo me oyeron por la radio no sabían que yo era tan guapo, ¿verdad? (se oyen risas)\n\nUn placer conocerlos, patriotas y pangermanistas, reunidos hoy en este acto fundacional. Nosotros somos el orgulloso pueblo que, entre los estados nacionales independientes germanos, fue el único que logró detener la invasión de Kivotos. Para que el espíritu del nacionalsocialismo que creó el Führer Hitler jamás se apague, ¿no deberíamos unirnos como un solo partido?\n\nHoy fundo oficialmente el nuevo partido: el 'Movimiento Nacional Alemán'. Camaradas, Luxemburgo se unificará como uno solo bajo el nacionalsocialismo, y el espíritu de Deutschland vivirá y respirará en esta tierra. ¡Gracias!\n\nAhora repartiremos las solicitudes de afiliación a los presentes. La cuota del partido también se acepta en dólares..."
 HEU.flavor_event.35.a:0 "Hitler no muere tan fácilmente"

 HEU.flavor_event.36.t:0 "Fin del Incidente del Asalto al Palacio Gran Ducal"
 HEU.flavor_event.36.desc.a:0 "La sentencia del recurso final contra tres estudiantes de Gehenna que participaron directamente en el asesinato de la Gran Duquesa Charlotte, el príncipe consorte Félix y sus hijos, durante el caos de la Gran Transposición, concluyó hace poco.\n\nEl socialista Victor Bodson, abogado defensor de las tres, solicitó clemencia alegando que, al haber vivido toda su vida en una sociedad donde los kivotosianos no mueren aunque les disparen, lo ocurrido no fue más que un accidente no intencional, y que debía aplicarse una suerte de 'atenuante por disminución de la capacidad mental'.\n\nSin embargo, la indignación popular fue enorme, y también lo fue la refutación de que, legalmente, no podía reducirse la pena por 'dispararle un fusil automático a un niño de seis años'. Los tribunales de primera y segunda instancia reconocieron la culpabilidad plena en virtud del artículo 101 del Código Penal ('asesinato del jefe de Estado'), el 102 ('acto de subversión del Estado') y el 103, que castiga el asesinato de la familia directa del Gran Duque, y condenaron a las tres estudiantes a la pena de muerte. Con el Tribunal Supremo desestimando el recurso, la sentencia quedó firme.\n\nPara apaciguar a una población furiosa, el poder judicial luxemburgués decidió, de forma inusualmente rápida, ejecutar a las tres mediante guillotina. En respuesta, los militantes de la Revolución del 68, que habían declarado su ruptura con toda autoridad, desobedecieron públicamente el fallo y lanzaron una operación de rescate de las condenadas. Veinte activistas del 68 procedentes de Red Winter intentaron asaltar la prisión por la fuerza, afirmando que 'ellas solo liberaron a Luxemburgo de la monarquía al matar a la familia gran ducal', pero fueron detenidos por fuerzas policiales que ya estaban preparadas.\n\nAlgunos activistas del 68 y el abogado Bodson exigieron a Rikuhachima Aru que otorgara un indulto a las tres, pero Aru, en un diálogo con los revolucionarios, respondió: \"Yo no tengo derecho a perdonarlas\", lo que enfureció aún más a los militantes.\n\nEsta ejecución fue la primera en más de un siglo desde la última, en 1821, y la guillotina se aplicó hoy, dos semanas después de quedar firme la sentencia. Incluso tras la ejecución, algunos revolucionarios radicales siguen culpando a Aru."
 HEU.flavor_event.36.desc.b:0 "La sentencia del recurso final contra tres estudiantes de Gehenna que participaron directamente en el asesinato de la Gran Duquesa Charlotte, el príncipe consorte Félix y sus hijos, durante el caos de la Gran Transposición, concluyó hace poco.\n\nEl socialista Victor Bodson, abogado defensor de las tres, solicitó clemencia alegando que, al haber vivido toda su vida en una sociedad donde los kivotosianos no mueren aunque les disparen, lo ocurrido no fue más que un accidente no intencional, y que debía aplicarse una suerte de 'atenuante por disminución de la capacidad mental'.\n\nSin embargo, la indignación popular fue enorme, y también lo fue la refutación de que, legalmente, no podía reducirse la pena por 'dispararle un fusil automático a un niño de seis años'. Los tribunales de primera y segunda instancia reconocieron la culpabilidad plena en virtud del artículo 101 del Código Penal ('asesinato del jefe de Estado'), el 102 ('acto de subversión del Estado') y el 103, que castiga el asesinato de la familia directa del Gran Duque, y condenaron a las tres estudiantes a la pena de muerte. Con el Tribunal Supremo desestimando el recurso, la sentencia quedó firme.\n\nPara apaciguar a una población furiosa, el poder judicial luxemburgués decidió, de forma inusualmente rápida, ejecutar a las tres mediante guillotina. Esta ejecución fue la primera en más de un siglo desde la última, en 1821, y la guillotina se aplicó hoy, dos semanas después de quedar firme la sentencia.\n\n[ROOT.GetLeader], al ser preguntado por la prensa sobre esta sentencia, se limitó a declarar: \"Espero que quienes fallecieron reciban, aunque sea por esto, un pequeño consuelo desde el cielo\"."
 HEU.flavor_event.36.a:0 "..."

 HEU.flavor_event.37.t:0 "Movimiento de derechos civiles del Partido Comunista"
 HEU.flavor_event.37.desc:0 "Los kivotosianos son más fuertes que los humanos. Pero por muy fuerte que sea un individuo, nunca puede vencer a un grupo. Aquella estudiante kivotosiana, que estaba siendo objeto de un movimiento de 'prohibición de asistencia escolar' por parte de decenas de otros alumnos, llevaba semanas sin ir a la escuela por miedo. Podía recurrir a la violencia contra esa multitud. Podía destrozar el pómulo de un estudiante humano como advertencia de lo que pasaba cuando la acosaban. Pero ¿qué ocurriría después? ¿El castigo legal? ¿El acoso aún más 'insidioso'?\n\n¡Bang, bang! Cuando escuchó golpes en la puerta de su casa, la chica pensó que los estudiantes humanos habían venido hasta allí para seguir acosándola. Pero al abrir la puerta con miedo, lo que encontró al otro lado fueron miembros del Partido Comunista de Luxemburgo, vestidos con elegantes trajes.\n\n\"Buenas tardes. Hemos venido a investigar la situación de discriminación. ¿Es cierto que ha sido víctima del movimiento de rechazo a la asistencia escolar de kivotosianos en su escuela?\"\n\nCon voces amables que la tranquilizaban y palabras como 'hemos venido a ayudar a los estudiantes', aquellos adultos se presentaron ante ella. Frente a ellos, la chica rompió a llorar, sintiendo por primera vez desde la Gran Transposición no miedo ni tristeza, sino esperanza hacia el futuro."
 HEU.flavor_event.37.a:0 "Un individuo bueno no puede vencer a un grupo malvado. Pero un grupo bueno sí puede vencer a un grupo malvado."

 HEU.flavor_event.38.t:0 "Movimiento de unificación lingüística"
 HEU.flavor_event.38.desc:0 "Los documentos oficiales de Luxemburgo deben redactarse en francés.\n\nAunque era un país donde el alemán se utilizaba como lengua hablada, el francés, percibido como una 'lengua aristocrática y refinada', había sido usado durante siglos como lengua escrita por costumbre. El movimiento para abolir este ineficiente sistema bilingüe y unificar Luxemburgo bajo el alemán fue implementado con el consenso tanto de las fuerzas de derecha, encabezadas por el partido conservador, como de las fuerzas de izquierda, incluido el Partido Comunista. La derecha quería enfatizar el nacionalismo germánico, mientras que la izquierda deseaba desmantelar el propio concepto de una 'lengua con aura aristocrática'.\n\nSea cual fuere la razón, tras reuniones entre los representantes de los distintos partidos, comenzó el trabajo de revisar al alemán todos los textos legales, incluidos la Constitución, el Código Penal y el Código Civil, originalmente redactados en francés. Primero se empezó por las leyes, luego se prohibirá el uso del francés en los documentos oficiales de las administraciones locales y del ejército. Finalmente, el francés quedará relegado a un nivel en el que solo algunos ciudadanos luxemburgueses lo utilicen en su vida cotidiana.\n\nY el grupo inesperado que se benefició de este movimiento de unificación lingüística... fueron precisamente los kivotosianos. ¿Acaso no es más conveniente para ellas comprar un solo libro de gramática alemana que dos libros de gramática distintos?"
 HEU.flavor_event.38.a:0 "¡Luxemburgueses, usad el alemán!"

 HEU.flavor_event.39.t:0 "¡Vamos a un santuario al estilo Kivotos!"
 HEU.flavor_event.39.desc.a:0 "Entre los kivotosianos que llegaron volando a Europa tras la Gran Transposición, había muchos que no podían olvidar los recuerdos de su tierra natal. Algunos recrearon los restaurantes o tiendas que gestionaban en su hogar y los reabrieron, e incluso hubo quienes construyeron en suelo luxemburgués santuarios que existían en Kivotos. El Santuario Daikichi, conocido como el 'santuario milagroso donde los sueños se hacen realidad', era uno de ellos.\n\n\"...Entonces, ¿el lugar al que vamos hoy es el santuario Daikichi?\"\n\nAnte la pregunta de Aru, Haruka asintió varias veces, con las mejillas sonrojadas.\n\n\"Ah, sí, eh... últimamente han pasado muchas cosas malas en la Agencia... así que... pensé que sería bueno pedir juntas un deseo para todos en un santuario donde los sueños se hacen realidad...\"\n\nQue los sueños se hagan realidad. Ojalá algo tan propio de los cuentos fuera cierto. Además, últimamente las relaciones entre los miembros de la Agencia también se estaban deteriorando. Mientras caminaba por el sendero del bosque, Aru tomó suavemente la mano de Haruka.\n\n\"Gracias, Haruka. Gracias a ti me siento un poco mejor.\"\n\nKayoko, caminando unos pasos detrás con los brazos cruzados, habló:\n\n\"Si lo analizamos lógicamente, un santuario donde los sueños se hacen realidad no es más que un eslogan publicitario del dueño. Además, es un santuario que abrió hace solo unos meses; ni siquiera habrá datos estadísticos suficientes para saber si los deseos realmente se cumplen.\"\n\nA su lado, Mutsuki soltó una risita.\n\n\"Ufufufu, ¡jajaja! ¡Como era de esperar, el orgullo de nuestra Agencia! ¡La subdirectora Onikata! ¡Datos cuantitativos! ¡Qué grande! La maga de los hechos. ¿Estás tan ansiosa por destrozar con hechos incluso la atmósfera que Haruka preparó con tanto esfuerzo?\"\n\nEl ceño de Kayoko se frunció de inmediato y, sin decir nada, pateó el suelo con fuerza.\n\n'Ah... Mutsuki, tú también estás arruinando el ambiente que Haruka creó...' Pensando eso y conteniendo un suspiro, Aru se giró, haciendo ondear su abrigo.\n\n\"¡Ya basta! Que los sueños se hagan realidad o no, no es algo tan importante para nuestra Agencia, ¿no? Disfrutemos del tiempo que Haruka nos ha regalado, de estar juntas. Y si el deseo se cumple, genial; si no, simplemente lo dejamos atrás. Ese es el espíritu de los forajidos con el que debemos actuar.\"\n\n\"¡Como era de esperar, Aru-sama...!\"\n\nCon la mirada brillante de admiración de Haruka, la atmósfera tensa se relajó un poco."
 HEU.flavor_event.39.a:0 "¿Se cumplirán de verdad los deseos?"

 HEU.flavor_event.40.t:0 "¿Cuál es tu deseo?"
 HEU.flavor_event.40.desc.a:0 "El bosque de Grünewald, al que se llega fácilmente caminando hacia el norte desde la ciudad de Luxemburgo, era una ruta de paseo popular entre los habitantes locales. En medio del bosque, el santuario estaba rodeado por una pequeña cerca y no era particularmente grande. Como era de esperar, todos los que habían venido a pedir deseos eran kivotosianos. Para los lugareños, no era más que una extraña instalación de una religión extranjera. Pero aun así, ¿no es lo importante el corazón? Aru entró al santuario junto a sus amigas.\n\nKayoko levantó la mano. \"Para visitar un santuario, primero hay que seguir las normas adecuadas. Al pasar por el torii...\"\n\nMutsuki sacó la lengua hacia Kayoko. \"Yo soy atea, así que no me preocupo por esas cosas.\"\n\n\"Haa...\"\n\nAru se encogió de hombros. \"Lo importante es que vinimos juntas. Pongamos una moneda en la caja de ofrendas, pidamos un deseo y volvamos juntas.\"\n\nAl pronunciar la palabra 'juntas', Aru puso énfasis en su voz. Aunque los días habían sido duros, al menos todas las miembros de la Agencia seguían juntas. Tras pasar una fila bastante larga para un santuario pequeño, llegó el turno de las cuatro de la Agencia 68. Aru arrojó una moneda de 1 marco alemán en la caja de ofrendas.\n\n'Si estuviéramos ahora en Kivotos, ¿qué deseo pediría?' Probablemente algo como: ¡por favor, que el negocio no quiebre! Pero ahora, tanto la 'Agencia' como el 'negocio' se estaban volviendo cada vez más secundarios.\n\nAru tocó suavemente su ojo artificial con la punta de los dedos. 'Si ahora tengo un deseo, es que, aunque tenga que morir, al menos estos amigos tan preciados sean felices. Eso es todo.' Aru cerró los ojos mientras rezaba. Y en ese instante.\n\n\"¡Aru-sama! ¡Es peligroso!\""
 HEU.flavor_event.40.a:0 "En el momento en que Aru abrió los ojos, ocurrió una enorme explosión."

 HEU.flavor_event.41.t:0 "La justicia que gira infinitamente"
 HEU.flavor_event.41.desc.a:0 "\"¡Los rieles que giran infinitamente conducen al futuro de la justicia! ¡Aquí aparece el Escuadrón Sushi Infinito Kaitenger!\"\n\"¡Atención! A partir de ahora, transferiremos la propiedad de la caja de ofrendas de este santuario al grupo Kaitenger!\"\n\"Los fondos obtenidos aquí serán utilizados para la modificación del KAITEN FX Mk.0...\"\n\nPiiiiii. Un zumbido en los oídos. En medio de la explosión, Aru vio a Haruka abrazándola con fuerza. No estaba gravemente herida. Pero de la herida desgarrada a lo largo de su hombro brotaba sangre.\n\n\"Aru-sama... ¿no está herida?\"\n\nEn el instante en que cruzó miradas con Haruka, que sonreía débilmente, Aru sintió que algo dentro de su mente se rompía. Sacó su rifle de francotirador, 'Wine Red Admire', del largo estuche de exterior que llevaba al hombro.\n\n\"¡Muere!\"\n\nDisparó sin siquiera apuntar. ¿Tal vez porque había perdido la percepción de la distancia al quedarse tuerta? La bala se incrustó en el suelo. Desde la clavícula hasta el brazo derecho, la zona que había sufrido fracturas por golpes de miembros del partido nazi, se desgarraba de dolor.\n\n'¡Ah, maldita sea! ¡El médico dijo que no habría secuelas!' A este ritmo, aunque regresara a Kivotos, no podría volver a trabajar activamente en la Agencia. Mientras Aru se sujetaba la clavícula y gritaba de dolor, Kayoko y Mutsuki se lanzaron hacia adelante.\n\n\"¡La caja de ofrendas y todo lo demás da igual! ¡No está bien hacer llorar a Aru-chan!\"\n\"¡Eh, espera! ¡El ritmo de la historia es demasiado rápido...! ¡Aaah!\"\n\n¡Bang! ¡Crash! Tras varias explosiones, los fieles de Gehenna reunidos en el santuario comenzaron a vitorear el tiroteo repentino y, uno tras otro, sacaron sus armas para atacar a los Kaitenger. Una capacidad de adaptación muy propia de Gehenna. Aru dejó escapar una risa amarga y se dejó caer en el lugar.\n\n\"Aprovechando este caos, devolvamos la caja de ofrendas a su sitio original. ...Después de todo, aquí están los deseos que cada persona ha depositado. No podemos dejar que esos deseos se dispersen, ¿verdad?\"\n\nAnte esas palabras, Haruka asintió.\n\n\"Si puedo ser de ayuda para Aru-sama... sí. La devolveré.\""
 HEU.flavor_event.41.a:0 "Que nuestros lazos conduzcan algún día a un futuro compartido."

 HEU.flavor_event.42.t:0 "Para la reconciliación"
 HEU.flavor_event.42.desc:0 "El número de víctimas durante la Gran Transposición asciende a varios cientos. Las estudiantes de Gehenna, en aquel momento, no comprendieron que aquello era un traslado dimensional irreversible del que no se podía regresar a Kivotos, y aceptaron aquel salto repentino como si fuera, por un rato, un festival o una aventura. De por sí, las de Gehenna eran chicas que hasta en un viaje escolar se divertían lanzándose granadas entre ellas, y en la ciudad de Luxemburgo empezaron la misma clase de 'bromas' que hacían en Gehenna. Sin saber que la humanidad es una existencia frágil, que si recibe una bala queda hecha pedazos y muere.\n\nAunque se tratara de homicidios por imprudencia, incluso después de la primera víctima las estudiantes de Gehenna no detuvieron de inmediato el motín. Y aunque hubiera sido una broma, los muertos no vuelven. Aru, que ya empezaba a ser odiada tanto por los lugareños como por los kivotosianos, al menos tenía claro a quién había que pedir perdón y con quién debía intentar recomponer relaciones *primero*.\n\nPorque Aru aún no podía olvidar aquella ciudad en llamas que vio ese día, ni al Gran Duque muerto con los ojos abiertos, incapaz de cerrarlos.\n\nLa construcción de un parque memorial. La expiación de Aru para los luxemburgueses. Tras negociaciones con los diputados de la coalición de gobierno, se acordó construirlo en los terrenos del Palacio de Berg, el antiguo palacio que la Casa Gran Ducal de Nassau había poseído hasta 1934. El Palacio de Berg, un bello palacio antiguo con un magnífico jardín, y situado en las afueras a poca distancia en coche de la ciudad de Luxemburgo, sería un lugar ideal para levantar un parque memorial."
 HEU.flavor_event.42.a:0 "Si hay un problema, es que a las estudiantes de Gehenna no les va a gustar esto..."

 HEU.flavor_event.43.t:0 "La subdirectora Onikata"
 HEU.flavor_event.43.desc:0 "El rostro de Onikata Kayoko, mientras caminaba por el pasillo, estaba fruncido por la rabia. 'Luxemburgo es el único Estado-nación legítimo del pueblo germánico', 'recuperaremos los territorios del pueblo germánico'. La nueva política de defensa revisada tras negociaciones con el Partido de Derecha. Eso significaba que la Agencia 68 lanzaría una guerra total hacia el este. ¿Por qué demonios Aru iba a luchar por algo como el nacionalismo germánico? No era propio de ella.\n\nMientras avanzaba por el corredor del palacio gran ducal, Kayoko se topó con Mutsuki, que salía con una ametralladora colgada al hombro.\n\n\"¡Kya-ja-ja! Subdirectora Onikata. ¡Hoo~la! ¿Y esa cara? Con una cara de miedo, te ves aún más aterradora.\"\n\"Asagi. Tú ya sabías de esta porquería, ¿verdad?\"\n\"¿Que lo sabía? Mmm~, con eso te quedas corta, ¿no? Fui yo quien convenció a Aru-chan.\"\n\n¡Bang! Kayoko empujó a Mutsuki contra la pared y le agarró el hombro con fuerza.\n\n\"¿Que la convenciste? ¿Para empujar a la gente a la muerte por algo como el nacionalismo germánico?\"\n\n\"Pensé que eras lista, subdirectora Onikata, pero parece que no te da la cabeza. ...Mira, ¿sí? Los lugareños y esas ratas de Gehenna, todos piensan que Aru-chan es una idiota. Esos cabrones le reventaron el ojo. Le destrozaron el brazo para que nunca más pudiera disparar un rifle de francotirador. Le vertieron pintura blanca en esa carita sonriente y la trataron como a una puta. Y aun así Aru... ¡esa estúpida demasiado buena! ¡perdonó a esos malditos gusanos de mierda!\"\n\n\"Oye, Onikata. ¿Y entonces qué? ¿Se supone que yo abandone a Aru-chan? Sabes que no puedo. ¡Me quedé en esta Agencia precisamente porque sé que Aru-chan es *así*! Así que me moví por Aru-chan. Forjé documentos falsos diciendo que iban a invadirnos, y mentí diciendo que hacía falta una guerra preventiva para proteger Luxemburgo. ¿Sabes que es una tontita, no? Se dejó engañar bastante fácil.\"\n\nMutsuki apartó de un manotazo la mano de Kayoko.\n\n\"Tengo que convertir a Aru-chan en una heroína. Haré que nadie pueda volver a menospreciarla. Guerra, guerra: conquistamos el Consejo de los Diez Mil de Gehenna y conquistamos a la Prefectura. ¿Qué te parece? Para los luxemburgueses, Aru-chan se convierte en *la heroína que recuperó las tierras ancestrales del pueblo germánico*. Para las de Gehenna, se convierte en *la forajida más fuerte de Gehenna*. ¿Crees que entonces la van a seguir menospreciando? ¿Eh, Onikata Kayoko? ¿Tú, con tu método, podrás proteger a la jefa?\""
 HEU.flavor_event.43.a:0 "Mutsuki escupió al suelo y se fue primero."

 HEU.flavor_event.44.t:0 "Odio a los comunistas"
 HEU.flavor_event.44.desc:0 "\"Esos cabrones rojos deberían limitarse a aferrarse a la ley de derechos civiles, pero no: van y atacan hasta a la Iglesia católica.\"\n\nJoseph Bech refunfuñó mientras hojeaba artículos sobre los ataques comunistas al catolicismo. Al sentir cómo crecía poco a poco la influencia social del Partido Comunista, Bech empezó a percibirlos como una amenaza existencial. El problema era que le quedaban muy pocas opciones. Aru dependía bastante de los comunistas precisamente porque 'garantizan los derechos civiles de los kivotosianos'.\n\n\"Haa... No queda otra que esforzarnos más al menos en la guerra de opinión.\"\n\nRecordando los *buenos* viejos tiempos, antes de la Gran Transposición, cuando aunque los rojos ganaran escaños en las elecciones parlamentarias uno podía expulsarlos del cargo a voluntad, Bech soltó un profundo suspiro."
 HEU.flavor_event.44.a:0 "El dolor del Partido de Derecha"

 HEU.flavor_event.45.t:0 "El informe de Mutsuki"
 HEU.flavor_event.45.desc:0 "Al entregarle a Aru el plan que hablaba de una 'guerra del pueblo germánico', hubo dos cosas que Mutsuki no había previsto. La primera: Aru pensaba mucho más rápido de lo que Mutsuki creía. Y la segunda: además de ser la jefa de una empresa, estudiar administración era su pasatiempo.\n\n\"El presupuesto no cuadra.\"\n\nMientras leía el documento sobre la amenaza de invasión desde el territorio de Gehenna, Aru mordisqueó y soltó ligeramente su labio inferior. Mutsuki afirmaba que el organismo de contrainteligencia del ejército luxemburgués había detectado movimientos militares en la Alemania continental. Pero Aru, que siempre había leído personalmente y aprobado todos los documentos sobre dónde y cuándo el ejército luxemburgués asignaba presupuestos y movía personal de inteligencia, sabía que nadie de su ejército había estado en los lugares y fechas que figuraban en los papeles que Mutsuki le había dado. Porque nunca había aprobado ningún documento relacionado.\n\nTodos los indicios apuntaban a que Mutsuki estaba engañando a Aru. No sabía por qué, pero Mutsuki quería que Aru iniciara una guerra contra Gehenna. Una guerra que podría conducir a la muerte a innumerables luxemburgueses y también a kivotosianos que Aru quería proteger, bajo un pretexto que Aru no comprendía: 'recuperar el espacio vital del pueblo germánico'.\n\n\"Pero...\"\n\nNo podía sospechar de Mutsuki. Como jefa de la Agencia 68 y como su amiga, Aru quería creer en ella. Quería creer que había circunstancias por las que no podía decir la razón de haber presentado un informe falso. En este mundo distinto, con culturas y personas distintas a las de Kivotos, y ahora que incluso la camaradería de la Agencia 68 comenzaba a agrietarse, la única capaz de creer en la inestable Asagi Mutsuki era ella misma."
 HEU.flavor_event.45.a:0 "Todo irá bien. Mutsuki no me traicionará..."

 HEU.flavor_event.46.t:0 "La carta de Guillermo II"
 HEU.flavor_event.46.desc:0 "A Su Alteza Rikuhachima,\n\nPermítame, ante todo, expresarle mis felicitaciones: la operación de avance hacia Alemania de Vuestra Alteza está progresando sin contratiempos. Sus logros militares son dignos de Federico el Grande, y la disciplina del ejército luxemburgués ha sido más ordenada que la de cualquier otra fuerza que haya visto hasta la fecha. Considero que no será especialmente difícil para el valeroso ejército de Vuestra Alteza derrotar a los invasores de Kivotos, a los comunistas y a las hordas de nacional-socialistas, y unificar toda Alemania.\n\nAunque Vuestra Alteza se ha proclamado como líder del pueblo germánico, no se ha arrogado el título de Emperador Alemán; ello me ha causado profunda admiración. Su gran estrategia es extraordinaria y la victoria está a la vuelta de la esquina; sin embargo, para gestionar el periodo de posguerra sin tropiezos será necesario el respaldo de un dirigente legítimo, con larga historia y tradición.\n\nAlteza, piense en lo que vendrá tras la victoria. Le propongo aprender de la sabiduría de los chinos. Los republicanos de China, incluso después de expulsar en 1912 a Puyi, emperador de la dinastía Qing, mantuvieron en la capital una 'corte menor' para que él siguiera ejerciendo su dignidad ante sus súbditos como Emperador de China. Esto se debe a que, por mucho que el republicanismo hierva en el corazón de los radicales, los súbditos necesitan un símbolo que los mantenga unidos. Debe usted tomar como lección la caída de China, que terminó desplomándose en manos de los caudillos tras quedar neutralizada esa corte menor.\n\nSi, tras recuperar Berlín, Vuestra Alteza se digna devolverme la propiedad del Palacio de Charlottenburg y, además, concede apoyo financiero —incluidos fondos para el mantenimiento de la dignidad— para reconstruir una corte menor del Imperio Alemán, yo, como Káiser, me esforzaré para que todos los súbditos de Alemania le juren lealtad a Vuestra Alteza con un solo corazón.\n\nDesde la ciudad de Luxemburgo,\nGuillermo II"
 HEU.flavor_event.46.a:0 "...Es la primera vez que veo un SMS tan largo"

 HEU.flavor_event.47.t:0 "La carta de Javier I"
 HEU.flavor_event.47.desc:0 "Sede del Partido de Derecha, al Presidente del Parlamento, Émile Reuter:\n\nHe recibido y leído con respeto la carta que me envió. El mensaje del Presidente Reuter, lamentando la muerte de mi hermano —que fue esposo de la Gran Duquesa Charlotte—, me ha brindado un gran consuelo. Permítame expresarle, ante todo, mi agradecimiento.\n\nUsted afirma que, dado que todos los miembros de la Casa de Nassau han fallecido, yo, como hermano mayor del Príncipe Félix, tendría un derecho sucesorio legítimo para convertirme en el próximo Gran Duque de Luxemburgo. Sin duda, esa lógica podría ser aceptada por los súbditos como legal conforme a una larga tradición.\n\nPero no puedo hacerlo.\n\nEn España existen leales camaradas carlistas que me sirven creyendo que soy el legítimo rey de España, 'Javier I'. Si abandonara España para reclamar el Gran Ducado de Luxemburgo, estaría traicionando a mis súbditos.\n\nComprendo su preocupación, Presidente Reuter, por no poder dejar el trono vacante durante demasiado tiempo. Sin embargo, mi patria no es otra que España, y le ruego me perdone: mientras mis súbditos permanezcan allí, yo no puedo abandonar España.\n\nFirmado:\nFrancisco Javier de Borbón-Parma y de Braganza"
 HEU.flavor_event.47.a:0 "El Presidente Reuter, gritando, arrojó la carta."

 HEU.flavor_event.48.t:0 "La llamada de Kayoko, buzón de voz"
 HEU.flavor_event.48.desc:0 "Bien. Repasemos lo que acaba de pasar. Invadiste Gehenna impulsivamente por razones emocionales personales. Por no haber podido proteger a tu amiga preciosa, te enfureciste a solas y te autohipnotizaste con eso de 'yo siempre odié Gehenna'. Y encima lo llevaste hasta mover el ejército sin órdenes de la jefa, haciendo una asquerosa intentona de golpe. ¿No es ridículo? A menos que seas un gorila, no existe nadie que intente convertir en realidad una idea tan estúpida.\n\nSí. Tú nunca lograste proteger a Aru ni una sola vez. Ni te enteraste cuando casi la asesinan en la calle. Ni cuando la atacaron con pintura frente a la oficina. Así que esta vez, por fin, querías protegerla. Convertir a Aru en una heroína para que no vuelva a ocurrir un atentado. Así te autohipnotizaste.\n\n...Pero, Asagi. ¿No te parece extraño? Tú dices que vas a hacer que Aru no vuelva a salir herida.\n\n¿Por qué nunca le preguntaste si *ella* lo quería?\n\nBah, ¿qué respuesta podría esperar de alguien como tú? Asagi. Eres ese tipo de persona. Solo que...\n\nSi por tu estúpida autosatisfacción le pasa algo a la jefa... iré tras de ti hasta el final del infierno y te romperé el halo.\n\nAsí que gana esta maldita guerra. Si no, haré que te arrepientas de haber nacido en este mundo."
 HEU.flavor_event.48.a:0 "Bip. Bip. Bip."

 HEU.flavor_event.49.t:0 "Carta a Estados Unidos"
 HEU.flavor_event.49.desc:0 "Padre, madre, ¿gozan de buena salud?\n\nEn el momento en que vi el anuncio diciendo que un verdadero patriota debe luchar por la unificación del pueblo germánico, sentí como si mi alma hirviera; no pude detenerme. Les pido disculpas por haber dejado Nueva York sin avisarles con antelación.\n\nLlegué a Luxemburgo la semana pasada. Aquí hay muchísimos patriotas germánicos reunidos desde todo el mundo. Incluso los políticos locales agradecen nuestro fervor. Ayer, el propio Primer Ministro Joseph Bech vino al barracón y, estrechando la mano de cada uno de nosotros, los voluntarios estadounidenses, nos expresó su gratitud por nuestro patriotismo.\n\nLuchar contra los alienígenas de Kivotos será una experiencia bastante emocionante. Los cobardes franceses se quejaban diciendo que esas chicas con halo en la cabeza no mueren aunque les disparen, pero a nosotros nos han instruido políticamente en que esos rumores están muy exagerados. No tienen por qué preocuparse.\n\nHoy me he hecho amigo de Hans, un joven patriota venido desde Suiza. Hans parece muy entusiasmado con la idea de volar por los aires a los alborotadores de Gehenna cuando avancemos. Yo también, si me envían al frente, quiero competir con Hans por los méritos.\n\n¡Ah! Ya casi termina el tiempo de descanso. Les pido perdón por no poder escribir más y despedirme así. Padre, madre: volveré a casa convertido en un verdadero adulto gracias a esta guerra."
 HEU.flavor_event.49.a:0 "Enviado por George"

 HEU.flavor_event.50.t:0 "Cómo convertirse en patriota"
 HEU.flavor_event.50.desc:0 "La trinchera de Südreinland era un infierno de agua que subía y causaba sufrimiento. Pero los soldados no tenían ni el margen para achicarla: los ataques constantes de la artillería de Gehenna caían alrededor, sacudiendo el mundo entero. Con el miedo de que en cualquier momento un proyectil cayera dentro de la trinchera, George se caló el casco.\n\nUna cruzada para liberar al pueblo germánico. George había llegado a Luxemburgo siguiendo un anuncio de propaganda que Asagi Mutsuki publicó en un periódico estadounidense. Su abuelo era alemán, así que él, descendiente de inmigrantes, creyó que luchar por la patria de sus ancestros también era patriotismo. Además, ¿no decía que era una guerra contra un ejército de colegialas? Se había imaginado que sería más fácil y divertida que un partido de fútbol americano en su ciudad. Pero la guerra contra los kivotosianos no se parecía en nada a lo que George había imaginado.\n\n\"¡Son soldados de Gehenna!\" En cuanto se detuvo el estruendo de los proyectiles, Hans, voluntario de origen suizo, asomó la cabeza fuera de la trinchera y gritó. \"¡Esos cabrones vienen hacia la trinchera!\"\n\nEl oficial encargado de los voluntarios, que ni sabía lo que era la jerarquía, rugió a todo pulmón: \"¡Disparen! ¡Al fin y al cabo son niñas! ¡Dispárenles y tírenlas al suelo!\"\n\nAl fin y al cabo son niñas. George tardó apenas treinta minutos desde el inicio de la guerra en comprender que eso era mentira. Esas cosas no son *humanas*. Monstruos que no mueren aunque les disparen en la cabeza, el pecho o las extremidades. George, lanzando un alarido que ni él supo si era grito o aullido, vació su fusil.\n\n\"¡Joder! ¡Se acercan! ¡Joder! ¡Maldita sea!\"\n\nAunque las balas les impactaban, las soldados de Gehenna no se detenían. Una chica de Gehenna, con la bayoneta calada, apuñaló una y otra vez el pecho de Hans, que gritaba. Maldita sea. ¿Qué cruzada por la nación ni qué nada? George, apretando los ojos con fuerza, apretó el gatillo una y otra vez contra la chica de Gehenna enredada con Hans.\n\nSolo duró unos segundos. George abrió los ojos al sentir un calor húmedo en el costado. Sobre la trinchera, una chica de Gehenna de pelo largo le apuntaba con un arma. No: ya había disparado. George sintió que el mundo daba vueltas y, hundiendo el rostro en el agua estancada de la trinchera, se desplomó."
 HEU.flavor_event.50.a:0 "La nación no recordará su muerte."

 HEU.flavor_event.51.t:0 "La salud de la jefa"
 HEU.flavor_event.51.desc:0 "Al entrar, con la cabeza gacha, al viejo consultorio de campaña instalado en el campo de prisioneros del Consejo de los Diez Mil, Aru sintió un nudo en la garganta. Le apenaba haber obligado a alguien del bando que ella misma había capturado a atenderla, y le dolía que esa culpa fuera imposible de expresar con palabras. Pero no había alternativa. El día del desfile de la victoria, justo cuando ocupaban el centro del Consejo de los Diez Mil, Aru protagonizó una “escena” delante de innumerables oficiales: pateó a Mutsuki, salió corriendo y se desplomó sola en el suelo, rodando y llorando a gritos.\n\nDespués de aquel episodio, el alto mando pensó que, aunque fuera a la fuerza, había que someter a Aru a una evaluación psiquiátrica exhaustiva. Y, para colmo, la medicina del enemigo —la del Consejo de los Diez Mil— iba como un siglo por delante de la local. Así que, empujada por las circunstancias, terminó llegando al campo de prisioneros. Pasaron horas: entrevista larga, pruebas psicológicas, test de inteligencia y más.\n\n—A ver... un nivel grave de autorreproche, insomnio y una pérdida de peso continua... ¿y aun así no se había revisado ni una sola vez?—\n\nLa estudiante del Departamento de Medicina de Urgencias de Gehenna, encargada de evaluar la salud de Aru nada más salir del campo, soltó un suspiro mientras iba marcando con una V, una por una, las innumerables casillas del formulario.\n\n—No quería causar molestias.\n—Y gracias a eso causó una molestia mucho mayor.\n—...\n—Trastorno depresivo y trastorno de ansiedad. Por haberlo dejado tanto tiempo, los síntomas empeoraron muchísimo; y el insomnio debió haber sido terrible. ¿Cómo aguantó?\n—Es que… a mi edad ya soy un adulto. Todavía no sé qué es exactamente “ser adulto”, pero esto sí lo aprendí: con suficiente cerveza, te duermes mucho más fácil.\n\nAru lo dijo con una sonrisita, pero la estudiante de urgencias no se rio.\n\n—Si la jefa Serina lo hubiera oído, le habría metido una bala en la cara. ...No se salte la medicación. Le ayudará mucho más que la cerveza."
 HEU.flavor_event.51.a:0 "La receta fue aún más larga de lo que Aru imaginaba."

 HEU.flavor_event.52.t:0 "No lo sabía"
 HEU.flavor_event.52.desc:0 "—Jefa… ¿desde cuándo estabas bebiendo?—\n\nUn día de lluvia, en la oficina del palacio gran ducal. Kayoko entró al despacho de Aru y se sentó. Aru dudó un instante, y luego se echó a la boca las pastillas antidepresivas que le habían recetado en Gehenna y se las tragó. Eran tantas que, incluso con agua, el paso por la garganta se sentía áspero.\n\n—No lo sé. Solo… desde algún momento.\n—¿Y por qué ni siquiera lo hablaste conmigo?\n—Yo soy una forajida hardboiled…\n—No digas tonterías.\n\nLa frase de Kayoko, cortante y fría, le partió la broma a Aru en dos. Aru dejó escapar un suspiro profundo.\n\n—Para mí, ustedes eran personas más valiosas que *yo misma*. Por eso… no quería verlas llorar por mi culpa. Incluso cuando me atacaron con pintura, tú y Mutsuki se gritaron y se pelearon entre ustedes, ¿te acuerdas? No lo soporté.\n\nUn suspiro bajo de Kayoko quebró el silencio.\n\n—Sinceramente, no sé qué se supone que debo hacer en momentos así… ni cómo podría aliviar tu dolor.\n—Tal vez eso es lo que significa ser adulto.\n\nAru soltó una risita. —Y aun así yo misma sigo preguntándome qué es “ser adulto”. No es solo envejecer… es cargar con una responsabilidad mayor que la edad de uno, ¿no? Pero convertirse en eso… a mí me resultó demasiado duro. No pude detener a Mutsuki cuando se hundía en la locura “por mí”, ni pude evitar que se rompiera lo de ustedes dos. ¿No soy patética?\n—Al menos yo… no creo que seas patética. Nadie en este mundo es perfecto. Ni yo, ni tú."
 HEU.flavor_event.52.a:0 "Esa noche, hasta muy tarde, Aru pasó el tiempo junto a Kayoko."

 HEU.flavor_event.53.t:0 "No estoy equivocada"
 HEU.flavor_event.53.desc:0 "—Fue por Aru-chan… de verdad… ni un poco… mi corazón no cambió…—\n\nCon la frente hundida contra la ventana, Mutsuki apretó los ojos con fuerza. Aquella mirada de Aru, como si la viera por primera vez. Y la imagen de Aru pateándola cuando intentó tomarle la mano, tirándola al suelo y huyendo.\n\n¿En qué momento se desalineó la aguja? Mutsuki se golpeó la frente una y otra vez contra el vidrio, llorando en silencio."
 HEU.flavor_event.53.a:0 "Aun así… fue por Aru-chan…"

 HEU.flavor_event.54.t:0 "Chocolate con forma de cigarro"
 HEU.flavor_event.54.desc:0 "Mientras Kayoko, con audífonos en los oídos, hacía girar ligeramente “un cigarro” entre los dedos, Mutsuki se le acercó por un costado y agitó la mano.\n\n—¡Hey! ¡Yo! ¡Kayoko-chi! ¿Al fin empezaste a fumar? Ajajá. A Aru-chan no le van las chicas que huelen a tabaco, ¿eh?\n\n—Haa… ¿Qué pasa, Mutsuki…?\n—¿Eeh? ¿Todavía me dices “señorita”?\n—No estoy lista para volver al trato de cuando estábamos en Kivotos. Aún no termino de prepararme. Y tampoco se me ha pasado el enojo.\n\nKayoko dijo eso y se metió el cigarro a la boca… para que se derritiera.\n\n—Y esto, en realidad, no es tabaco. Es chocolate tipo cigarrillo… chocolate con forma de cigarro.\n—…Eeh. ¡Es gracioso! ¡Y creo que te queda bien, Kayoko-chan!\n—Solo que… el vocalista de una banda de rock que me gusta solía llevar estos chocolates como parte de su identidad. Me acordé de eso. ...Desde que cruzamos a este mundo ya ni siquiera he podido escuchar rock a gusto.\n\n—Los locales ni saben qué es el rock… ¡Ah! Ahora que lo dices, escuché que en Trinity se formó una banda nueva. Dicen que *Sugar Rush* toca increíble. Kayoko-chan… ¿no quieres que vayamos a un live, para hacer las paces?\n\n—¿Yo? ¿Contigo?\n\n—Wow. Eso sí me hirió de verdad.\n—Jeje. Es broma. Está bien. ...Después de tanto tiempo… como en Kivotos. No suena mal volver a disfrutar algo así."
 HEU.flavor_event.54.a:0 "Muy poco a poco, sus conflictos van sanando."

 HEU.flavor_event.55.t:0 "Los inicios"
 HEU.flavor_event.55.desc:0 "—E-esto… Aru-sama. Tenía una oportunidad clara de convertirse en reina, pero aun así decidió quedarse como Gran Duquesa. ¿Hay algún motivo? Es que… una reina está por encima de una duquesa, ¿no?—\n\nMientras escuchaba la pregunta sensata de Haruka, Aru iba marcando, una por una, las pastillas antidepresivas que quedaban en el frasco. Cuando todo se calmó, su horrendo trastorno depresivo parecía haber desaparecido, pero Sumi Serina, de Trinity, le había indicado que siguiera con la medicación al menos medio año más.\n\n—No lo sé… Supongo que el nombre de *Gran Duquesa* me impide olvidar lo de aquel día de la Gran Transposición. Y… no quería cambiar ese nombre.\n\n—¡Entonces… es como la determinación de Aru-sama de no olvidar sus principios!\n\n—Ajajá. ¿Algo así? Sí… algo así. Aunque ha pasado mucho desde que dejamos Kivotos, también hay cosas que deben permanecer sin cambiar, desde entonces y hasta hoy."
 HEU.flavor_event.55.a:0 "Sin duda."

 HEU.flavor_event.56.t:0 "Un encuentro con Marx"
 HEU.flavor_event.56.desc:0 "—La verdad… me arrepiento. “Conviértete primero en adulto.” No pensé que fuera a darle un significado tan profundo a esa sola frase. ...Yo no soy maestro. No soy una figura que los guíe. Solo soy un médico: voy tratando paciente por paciente. Y, a veces, hasta termino gritando que hay que colgar a los reaccionarios de un árbol.—\n\nCharles Marx se rio mientras fumaba un puro.\n\n—Pero me alegra verte con buena cara. ¿Últimamente ya no tomas ese café envenenado, verdad?\n\nAru inclinó un poco su taza. —¿Por qué? ¿Si sospechas, vas a darle un trago?\n—Paso. ...Bien. Ya te vi vivo y entero. Ahora sí puedo volver, con tranquilidad, a ser tu enemigo político. Tú como monarca feudal, y yo como marxista-leninista que sueña con la revolución.\n—Solo te pido que si ganas, no me cuelgues de un árbol. Me salvaste la vida dos veces, ¿no?\n—Jaja. Y tú procura no subirme un día a la horca. Que tengas una tarde tranquila.\n—Sí, que tengas una tarde tranquila."
 HEU.flavor_event.56.a:0 "Sí, que tengas una tarde tranquila."

 HEU.flavor_event.57.t:0 "Entrevista con la prensa de Kronos"
 HEU.flavor_event.57.desc:0 "Que ocurriera algo tan irreal como que Aru dominara tanto a Gehenna como a Trinity hacía inevitable que la prensa internacional fijara la mirada en el asunto. Lo único desagradable era que el primer medio en aparecer fuera la famosa Escuela Kronos… pero Aru ya sabía que Kronos no era precisamente un medio “saludable”.\n\nKawaru Shinon, apenas se sentó frente a Aru, le metió el micrófono en la cara. —¡Señora Aru! Ha conquistado tanto Gehenna como Trinity. ¿Tiene pensado desafiar también a la Presidenta del Consejo Estudiantil General?\n\nAru contestó, fingiendo estilo, mientras hacía girar un bolígrafo entre los dedos: —¿La Presidenta del Consejo? Esa persona que, en cuanto ocurrió la Gran Transposición, se asustó y salió corriendo, abandonando el puesto, ¿no? No hay necesidad de arrebatarle un asiento a alguien así. No es hardboiled.\n\n—Entendido. “El Consejo Estudiantil General es una organización de gente sin valor… lo pondré de titular”—\n\n¿No se suponía que esto era un disparo a una persona? Siento que ya le dio a varias…\n\n—Siguiente pregunta. Se dice que la relación de la jefa con los miembros de la Agencia 68 es inusualmente devota. En particular, los nacionalsocialistas han planteado muchas dudas sobre si usted mantiene una relación física algo impropia con sus empleados.\n\n—¡Pff!— Aru tosió. ¿Qué demonios es “relación física algo impropia”? ¡Eso ni siquiera suena a eufemismo! Aru intentó responder, pero estaba tan desconcertada que las palabras no le salían.\n\n—Yo y esas chicas solo…\n\n—¿Solo? ¿Son pareja? ¿Hay alguien que le guste?—\n\n¡Oye ya! El micrófono se acercó hasta quedar a tres centímetros de los labios de Aru. Parece que no hay manera de escapar de las garras de Kawaru Shinon…"
 HEU.flavor_event.57.a:0 "Por supuesto que amo a todos los miembros de la Agencia 68. ...¡Como amistad!"
 HEU.flavor_event.57.b:0 "Sí, hay alguien en la Agencia a quien amo. ¿Y qué?"

 HEU.flavor_event.58.t:0 "Carta privada del Primer Ministro Joseph Bech"
 HEU.flavor_event.58.desc:0 "A Su Alteza Rikuhachima Aru,\n\nParece que los ciudadanos muestran gran interés ante la noticia —difundida tras la entrevista con el periódico de Kronos— de que Vuestra Alteza tendría a alguien en su corazón. No obstante, recuerde que Luxemburgo es un Estado católico, y que muchos ciudadanos consideran tales actos como un pecado.\n\nLe ruego diga que lo de Kronos fue un simple desliz. ¡Por su culpa, los grupos conservadores llevan días protestándome *a mí*! Como les da miedo protestarle directamente a Vuestra Alteza, se plantan frente a mi casa incluso de madrugada, con altavoces, y ya ni puedo llevar una vida normal.\n\nSé que Vuestra Alteza no confía demasiado en mí. Pero me niego a creer que, en serio, Vuestra Alteza sea homosexual. Sí. Kronos es basura; seguro solo quería gastar una broma para fastidiar.\n\nPero por esa broma me estoy muriendo. No: quizá ya estoy muerto y solo no me he dado cuenta.\n\nMientras escribo esta carta, los manifestantes han traído un camión y suben el volumen de los altavoces frente a la residencia del Primer Ministro. Dicen que gracias a la “Gran Transposición” se importaron altavoces de alta gama fabricados por Millennium… y hoy, por fin, he podido comprobar lo “buenos” que son.\n\nLlevo tres días sin pegar un ojo; por ello, le ruego disculpe que el tono de esta carta no tenga la formalidad propia de un documento administrativo. Pero espero que comprenda que no tengo más remedio que escribirle, aunque sea así. Por favor, déjeme dormir por las noches.\n\nVivamos en el mismo mundo. Se lo ruego, de verdad.\n\nDesde la Residencia del Primer Ministro del Gran Ducado Federal de Luxemburgo,\nJ. Bech."
 HEU.flavor_event.58.a:0 "Sí, lo de entonces solo fue una broma."
 HEU.flavor_event.58.b:0 "Cuando tienes insomnio, con una cerveza en lata duermes como bebé. Te lo digo por experiencia."

 HEU.flavor_event.59.t:0 "La propuesta del Partido Federal Estudiantil"
 HEU.flavor_event.59.desc:0 "Llegó un mensaje desconcertante de la presidenta del Partido Federal Estudiantil. Para la población de origen kivotosiano, el escándalo romántico de Aru era una especie de incidente emocionante: lo estaban consumiendo como “entretenimiento”. El Partido Federal Estudiantil quería aprovechar el escándalo para que la población kivotosiana se volviera más pro-gobierno y, al mismo tiempo, para difundir con mayor amplitud la cultura liberal de Kivotos en Luxemburgo. Por supuesto, Aru, como monarca constitucional, debía mantener neutralidad; pero al menos podía escuchar sus argumentos.\n\nLa propuesta era simple: emitir una orden administrativa. No se trataba de aprobar una ley que legalizara el matrimonio igualitario para todos, sino de otorgar —solo para Rikuhachima Aru— el permiso de casarse con alguien de su mismo sexo. Con el interés público creciendo, el Partido Federal Estudiantil quería hacer el asunto más grande y sacarle provecho.\n\nArgumentaron, con mensaje bien armado, que una orden así correría de boca en boca entre estudiantes de las dos academias, elevando la notoriedad del propio Partido Federal Estudiantil como autor de la propuesta; y que, hasta que Aru encontrara a su pareja, el escándalo se prolongaría, haciendo que la imagen pública de Aru entre los kivotosianos se volviera todavía más “cercana”.\n\nSuena razonable, pero… ¿en serio, de verdad, sin que sea una broma, Aru tiene intención de pasar toda la vida como pareja de alguien de la Agencia 68?"
 HEU.flavor_event.59.a:0 "No, no, esto no. De verdad que no."
 HEU.flavor_event.59.b:0 "...Se emite la orden administrativa."

 HEU.flavor_event.60.t:0 "Reconciliarse con todos"
 HEU.flavor_event.60.desc:0 "Kayoko dijo:\n\n—En Kivotos, a veces nos juntábamos todos en un parque y hasta dormíamos en la calle…\n\n—¡No, no! ¿No tienes recuerdos más “cool”? ¿Por qué precisamente dormir en la calle?\n\n—También recuerdo cuando la jefa se quedó sin dinero y andaba buscando préstamos…\n\n—Ugh… por favor piensa en recuerdos más “cool”...\n\nEntre bromas y charla ligera, Aru salió a caminar junto a los miembros de la Agencia 68. “Caminar” era, como mucho, pasear por las afueras y volver a visitar el santuario al que una vez habían venido a rezar. Aru, con las manos a la espalda, avanzó despacio por el bosque de pinos.\n\n—Si se nos diera una oportunidad de regresar a Kivotos… ¿qué querrían hacer ustedes?\n\nMutsuki soltó una risita. —¿Qué es esto, un juego de preguntas?\n\n—No es un quiz… quiero escuchar sus pensamientos, de verdad.\n\n—Sea Kivotos o sea la Tierra, yo voy a seguir a Aru-chan. Y apuesto a que todas piensan igual.\n\nAru se dio la vuelta. ¿Era obvio? Sí, era algo que ni hacía falta preguntar. Puede que nunca, en toda la vida, encuentren un modo de volver a Kivotos. O quizá, dentro de décadas, alguna genio de Millennium termine hallando una forma.\n\n—Yo también sentí que, si puedo estar con ustedes, el lugar ya no importa. Y además… este sitio es un lugar que nosotras defendimos juntas. Ahora… aunque venga quien venga, ya no podemos irnos.\n\nA diferencia de cuando solo se peleaban y se empujaban, las cuatro entraron al santuario tomadas de la mano. Ya no habría ningún Kaitenger para destrozar la caja de ofrendas y robar el dinero; aquí, por fin, podrían pedir deseos en paz.\n\nFrente al santuario, de pie allí otra vez después de años, Aru cerró los ojos."
 HEU.flavor_event.60.a:0 "Que todos sean felices, conmigo."

 HEU.flavor_event.61.t:0 "Para el renacimiento del Gran Reich Alemán"
 HEU.flavor_event.61.desc:0 "Adolf Hitler y toda la cúpula de Alemania desaparecieron repentinamente durante la 'Gran Transferencia' estando en Berlín. ¿No es sospechoso? La Gran Transferencia ocurrió a gran escala por toda Europa Central, pero el único país cuya dirigencia nacional desapareció por completo fue Alemania. Bueno… dependiendo de cómo definamos “desaparecer”, Luxemburgo también “desapareció” con toda su familia gran ducal hecha plomo.\n\nY ahora, gloriosamente, el ejército de Luxemburgo ha llegado a Alemania enarbolando la bandera de la unificación del pueblo germano. Damien Kratzenberg, burlado por los comunistas como “el último nazi de Luxemburgo”, se ajustó bien el chaleco antibalas y entró en Múnich, ocupado por el ejército luxemburgués. La noticia de que había caído Múnich—el lugar donde Hitler intentó su “revolución” en 1923—lo llenó de euforia.\n\nCaminando por el centro de la ciudad con una gorra militar en la que, fingiendo ser corresponsal de guerra, llevaba escrito en blanco PRESS, Kratzenberg pensó en Rikuhachima Aru. Ella no habría iniciado esta guerra sinceramente “por la unificación del pueblo germano”. Seguramente tenía otro objetivo. Pero lo importante era que le había dado una oportunidad. El gran nacionalismo alemán, el renacimiento del nacionalsocialismo.\n\nKratzenberg abrió la puerta del café donde le habían dicho que estaba “él”. Planeaba convertirlo en el próximo Führer de la Alemania reconstruida.\n\n—¿Señor Drexler?\n\nAnton Drexler. Fundador del Partido Nacionalsocialista Alemán de los Trabajadores y antiguo camarada de Hitler. Sin duda había recibido antes la carta para reunirse “por la reconstrucción de la gran Alemania”, pero su expresión no era precisamente alegre. Drexler, sentado junto a la ventana, bebió un sorbo de café y dijo:\n\n—Ha venido en vano.\n—¿Cómo? ¿Qué quiere decir con eso?\n—Los nazis fracasaron. Y yo no pienso seguir sus locuras.\n\nDrexler soltó una risita y se levantó.\n\n—¿Que me hará el próximo Führer? ¿Dónde, exactamente? ¿De verdad todavía cree que existe alguna “superioridad” en este pueblo que ha sido conquistado por Trinity y Gehenna? Yo he comprendido que la “nación” es vanidad, pura vanidad. ¡No existen pueblos superiores ni pueblos débiles! Si aún sostiene la absurda fantasía de reconstruir un Gran Reich Alemán, más vale que la abandone de una vez...\n\n—¡Cobarde!\n\nFurioso, Kratzenberg sacó impulsivamente su pistola y disparó a Drexler una y otra vez. Era un arma con la que jamás en su vida había disparado contra una persona. Las balas se desviaron por completo y dieron justo en la nuca del empleado del café que estaba lavando platos. Gritos. Al ver su rostro ponerse blanco como el papel, Kratzenberg huyó del café dejando atrás la burla de Drexler.\n\n“Sí, sí… ¡un disparo digno de un líder valiente de la nación!”"
 HEU.flavor_event.61.a:0 "Ni siquiera llegó a ser un cabo austríaco."

 HEU.flavor_event.62.t:0 "Golpe militar"
 HEU.flavor_event.62.desc:0 "El general luxemburgués Guillaume Consbruck repasó sus recuerdos. La última vez que el ambiente entre los altos mandos del ejército de Luxemburgo había sido tan tenso fue el mismo día de la Gran Transferencia, durante la reunión urgente del Estado Mayor conjunto. Esta vez, la causa era la exigencia de Asagi Mutsuki, que irrumpió acompañada por varios “soldados rasos” de Gehenna.\n\nConsbruck habló con la mayor calma que pudo:\n\n—Entonces, si resumo lo que dice la señorita Asagi… ¿está exigiendo que, a partir de ahora, sus órdenes se prioricen por encima de las del capitán Émile Speller o de Su Alteza la regente Rikuhachima Aru; y que se cree un sistema separado de informes presupuestales, uno para el coronel Speller y otro para usted?\n\n—¡Sí, sí! Este señor sí entiende.\n\nMaurice Stein, comandante del distrito militar de Diekirch, se levantó de golpe.\n\n—¡¿Cómo te atreves, mocosa?! ¡¿Sabes dónde estás?! ¡Entregar el mando del ejército a una figura en la sombra sin rango, solo por ser “conocida” de Su Alteza! ¡En nuestro país no hay cobardes que obedezcan una orden así—!\n\n¡Bang! Con gesto fastidiado, Mutsuki sacó una pistola del bolsillo y disparó. La bala se incrustó con precisión en la pierna de Stein, que cayó al suelo con un grito ahogado.\n\n—Ah, ah… en serio. ¿Cree que vine aquí a jugar? …Llévense a este tipo. Si lo meten un buen rato al manicomio, se le va a acomodar la cabeza.\n\nConsbruck observó a los soldados de Gehenna arrastrar como un objeto a su viejo superior. El comandante Stein—veterano de la Gran Guerra de hacía más de veinte años, respetado por todos—estaba siendo arrastrado así. La sangre de su pierna dejó un rastro largo hasta el pasillo. Antes que “miedo”, lo que sintió Consbruck fue “incomprensión”. ¿Esto era real? ¿No estaría soñando?\n\n—Ujijiji. Mira… yo amo a Aru-chan. De verdad, de verdadvVerdadVERDAD. Así que, si alguien llama a esto “un golpe contra Aru-chan”… de verdad se va a morir, ¿entendido?\n\n¡Bang! La puerta por donde se llevaron a Stein se cerró con violencia.\n\n—Aru-chan es demasiado buena. Aunque le prepares la oportunidad de convertirse en una heroína, no sabe “comérsela”. Así que vamos a crearla juntos. ¡Aplastar a Gehenna y a Trinity para que Aru pise la cabeza de esos miserables y se alce por encima de ellos! ¡Para que su querida regente se convierta en la liberadora del pueblo germano y esos peatones engreídos griten de alegría con solo ver un póster de Aru-chan! ¿Eh? Vamos, seamos razonables, ¿sí?\n\nEn la sala, llena de terror, quien rompió el silencio fue Consbruck."
 HEU.flavor_event.62.a:0 "“De acuerdo. Entonces… ¿por dónde empezamos?”"

 HEU.flavor_event.63.t:0 "Unificación del pueblo germano"
 HEU.flavor_event.63.desc:0 "Sin que Aru lo supiera, se había creado “otra” sala de reuniones para Mutsuki dentro del alto mando. Mutsuki entró en la sala preparada en un área aparte del Ministerio de Defensa. El tema de hoy era la propaganda hacia la población durante la conquista de Gehenna y Trinity.\n\n—Si vamos a enaltecer el nombre de Su Alteza Rikuhachima mediante la unificación del pueblo germano, lo primero que necesitamos es que el nombre del país unificado no sea “Alemania”, sino “Germani(a)”.\n\n—¿Por qué?\n\n—Porque, en el Luxemburgo actual, las palabras “Alemania” y “Prusia” se asocian prácticamente con los nacionalsocialistas… es decir, con los nazis. Antes de la Gran Transferencia, no, incluso después, los nacionalsocialistas insistían en que Luxemburgo debía ser parte de la “Gran Alemania”; y, de hecho, hace poco incluso se fundó un partido nazi llamado “Movimiento Nacional Alemán”.\n\nMutsuki fingió un bostezo, como si le diera pereza.\n\n—Ugh. Qué aburrido. Resúmelo en una línea.\n\n—En cuanto nos proclamemos herederos de Alemania, existe el riesgo de que Su Alteza Rikuhachima sea etiquetada como nazi.\n\nSolo entonces Mutsuki se puso seria. Esta guerra debía ser, ante todo, una guerra para convertir a Aru en una heroína. Aunque usaran el nacionalismo alemán como herramienta, enredarse tanto como para que les llamaran nazis era peligroso.\n\nEspecialmente porque, tras la Gran Transferencia, quienes lideraban la discriminación racial contra los kivotosianos… eran precisamente “los nazis”, ¿no?\n\nMutsuki asintió.\n\n—Mmm. Bien. Sí. Es simple: cuando empiece la guerra, solo hablaremos de “unificación del pueblo germano”. Jamás diremos “reunificación de Alemania”. Etnia sí, Estado no. ¿Con esto basta?\n\nConsbruck asintió."

 HEU.flavor_event.63.a:0 "Consbruck asintió con la cabeza."

 HEU.flavor_event.64.t:0 "Las sospechas de Émile Speller"
 HEU.flavor_event.64.desc:0 "El rango de Émile Speller no era más que el de “jefe de la gendarmería”, pero debido a la historia y tradición de Luxemburgo—donde el ejército había sido, en esencia, la gendarmería—Speller cumplía el papel de jefe del Estado Mayor conjunto (cargo que, legalmente, ni siquiera existía en Luxemburgo) tanto antes como después de la Gran Transferencia.\n\nPor eso, a Speller le bastó poco para notar movimientos extraños dentro del ejército. Maurice Stein, veterano de la Gran Guerra y respetado conservador, desapareció sin aviso. No había renunciado. En solo un día, todo el mundo actuaba como si el comandante Stein ni siquiera hubiera existido.\n\nTras ordenar a un ayudante leal vigilar a algunos generales, Speller llegó a una conclusión:\n\n—La señorita Asagi está dando órdenes a su antojo dentro del ejército y controlando a los soldados como si fueran suyos.\n\nEn la oficina de la agencia de detectives. En cuanto logró un encuentro a solas con Aru, Speller le entregó apresuradamente un informe. Como evidencia venía una foto: Mutsuki, que legalmente era solo una amiga de Aru y no tenía rango militar alguno, entrando al Ministerio de Defensa mientras los generales le rendían saludo.\n\n—Su Alteza. Esto es una señal evidente de traición. Debemos citar a la señorita Asagi por separado e interrogarla—\n—Solo la saludaron.\n\nAru, sin embargo, sacó la foto en silencio y la cubrió. Era cierto que resultaba extraño que Mutsuki entrara sola al Ministerio de Defensa sin tener nada que hacer ahí. Pero *solo con esto* no bastaba para sospechar de ella. Al menos, Aru quería creerlo así.\n\n—Mutsuki es mi amiga de la infancia. Aunque haga algo que yo no sepa… ¿de verdad cometería traición?\n\nAru sonrió de forma incómoda y añadió:\n\n—No quiero caer en la paranoia y sospechar de alguien valioso. …Estoy segura de que Mutsuki-chan me está ocultando algo, pero quiero creer que hay una razón detrás."
 HEU.flavor_event.64.a:0 "Speller no pudo decir nada."

 HEU.flavor_event.65.t:0 "El primer sitio web de Luxemburgo"
 HEU.flavor_event.65.desc:0 "En Kivotos, cualquiera podía usar una computadora con facilidad, y cualquiera podía acceder a internet sin esfuerzo. Incluso después de la Gran Transferencia—gracias a academias con gran tecnología como Millennium—las computadoras personales seguían produciéndose en masa y llegando al mercado. Pero… el problema era que, con la pérdida de satélites y cables de comunicación, la propia “red de internet” que antes conectaba a todo Kivotos había sufrido un golpe enorme.\n\nAun así, los kivotosianos de Luxemburgo se dieron cuenta de que, incluso en esta época que parecía haber retrocedido cien años, la red telefónica estaba densamente instalada por los locales… y, tras un breve periodo de caos, internet renació en forma de conexión por módem telefónico.\n\nPor supuesto, los primeros sitios usados fueron los sitios kivotosianos ya existentes, pero los locales también empezaban a comprender rápidamente el valor de este “internet”. Y el primer grupo en moverse fue el partido gobernante: el Partido de Derecha.\n\nEl primer ministro Joseph Bech golpeó orgulloso el monitor de una PC de Millennium.\n\n—¡Hemos reunido a los mejores diseñadores de Luxemburgo y hemos abierto el primer sitio web nacional: la *página oficial del Partido de Derecha*! Es una lástima tener que pagarle el costo del servidor a esos malditos kivotosianos, pero a cambio podremos dar a conocer nuestro partido a los patriotas de Luxemburgo mucho más ampliamente.\n\nEl diputado Pierre Dupont, del ala “reformista” del partido, miró la pantalla con expresión asombrada. Incluso él solo tenía un conocimiento superficial de estas “computadoras personales”.\n\n—Entonces… ¿con esta pequeña máquina podemos comunicarnos con todo el mundo… no, con cualquiera al que llegue un cable telefónico? La tecnología de los kivotosianos es realmente increíble. …Bien, ¡veamos el sitio de nuestro partido!\n\nBech asintió una vez y clickeó el mouse. Se abrió la ventana de internet… y apareció el sitio oficial del Partido de Derecha.\n\nEl fondo estaba cubierto de un degradado arcoíris. El texto “Partido de Derecha”, con un efecto ondulante, nadaba por la pantalla principal; y a ambos lados, frases en alemán brillaban con letras rojo intenso y efecto neón: +Aniquilemos a los rojos+ y +Partido de Derecha y defensa de la nación+.\n\nUn estudiante de Kivotos habría gritado “¡¿qué es esta estética noventera?!” del horror. Pero los diputados, viendo internet por primera vez, estallaron en admiración.\n\n—¡Realmente… es fantástico!\n—¡Vaya! ¡Esto sí que es innovación, esto sí que es tecnología!\n—¡Con este sitio multiplicaremos por diez la militancia! ¡Jajaja!\n\nMientras escuchaba los elogios, Bech acarició lentamente el monitor, orgulloso."
 HEU.flavor_event.65.a:0 "“Me enorgullece que este sitio sea el primero de nuestra patria. ¡Gracias!”"
 HEU.flavor_event.66.t:0 "Buscar trabajo"
 HEU.flavor_event.66.desc:0 "En Kivotos existían miles de academias. Pero no todas sobrevivieron intactas tras la Gran Transferencia y conservaron su Estado. Las grandes academias—como Gehenna, Trinity y Millennium—lograron sobrevivir incluso en el caos de la Gran Transferencia, pero cientos de academias pequeñas quebraron en un instante: ni siquiera pudieron restaurar las redes de agua y electricidad que se cortaron justo después de la Gran Transferencia. Incluso se decía que, entre las academias con menos de mil estudiantes, la única que había sobrevivido era la Preparatoria Abydos.\n\n—¿No habría manera de que al menos pudiera repartir periódicos? Sí, por favor. Sí… ¿mi procedencia? Soy de Kivotos…\n\nTogawa Sakiko, a quien ya le habían rechazado una y otra vez incluso para trabajos de medio tiempo solo por ser kivotosiana, habló con voz temblorosa aferrada al auricular. La semana pasada, ni siquiera la dejaron presentarse a entrevista en quince tiendas. La Ley de Derechos Civiles prohibía discriminar a los kivotosianos en el empleo, pero se podía eludir con excusas del tipo “ya contratamos a otra persona”. Si una ley nace del compromiso con los poderosos, ¿no termina siendo siempre así?\n\n—Si eres de Kivotos, tienes buena condición física, ¿no? Es reparto de madrugada… ¿te parece bien?\n\nPor eso, la primera vez que escuchó una respuesta así, Sakiko sintió un shock incluso mayor que la alegría. Inclinándose con respeto hacia la voz al otro lado del teléfono, respondió con fuerza:\n\n—¡Sí! ¡Si me lo pide, puedo repartir periódicos incluso hasta el otro lado de Europa!\n—Jajaja. Últimamente, con esto de la ley y todo eso, el mundo también va cambiando, ¿no cree? Si tiene capacidad para trabajar, nosotros también le damos la bienvenida. Venga a una entrevista sencilla.\n\nLa Ley de Derechos Civiles, desde luego, no había cambiado el mundo de los kivotosianos de la noche a la mañana. Pero… Sakiko pensó que, solo por existir la ley, parecía que cada vez había más gente empezando a cambiar su forma de pensar."
 HEU.flavor_event.66.a:0 "El derecho a trabajar"

 HEU.flavor_event.67.t:0 "¡El país se fue al carajo!"
 HEU.flavor_event.67.desc:0 "Albert, un policía luxemburgués, últimamente sale a patrullar usando mascarilla y lentes oscuros. Era para ocultar la expresión que se le dibujaba al ver las cosas repugnantes de la calle. Y no se refería a “esas mujeres” con halos en la cabeza. Aunque fueran raras, al menos todavía parecían personas.\n\nLo realmente desagradable era ver a un tipo enorme, que parecía un oso polar… en pleno centro de Luxemburgo, dirigiendo el tráfico. Gracias a la Ley de Derechos Civiles y a esa presumida política de “diversidad”, incluso los hombres-bestia que llegaron desde Kivotos pudieron conseguir trabajo. Y, en particular, todas las instituciones públicas de Luxemburgo estaban “pintando” sobre el orgulloso papel tapiz de la patria ese vómito de Cristo: cabezas de gorrión, gato, oso…\n\nQue se joda la diversidad. Que se jodan los derechos de las minorías. Que se joda la maldita corrección política de los leninistas.\n\n¿Desde cuándo se supone que *eso* puede considerarse humano? Wakamoto, el policía de tránsito oso polar, le agitó la mano a Albert como si hubiera encontrado a un buen amigo. Albert murmuró “pinche cabrón” detrás de la mascarilla y estuvo a punto de volver a pisar el pedal, pero el estúpido de Wakamoto se le acercó tambaleándose.\n\n—Últimamente siempre patrullas con mascarilla… ¿te dio gripa o qué?\n—No… nada… es alergia. Tengo alergia.\n\nAlergia a los pinches cabrones, eso. Albert le siguió el juego como pudo y pisó el pedal con violencia. No sabía cuánto más podría aguantar viviendo en este mundo que Rikuhachima—pinche cabrón—Aru y los rojos habían construido."
 HEU.flavor_event.67.a:0 "Y así pasa otro día"

 HEU.flavor_event.68.t:0 "Debate sobre la ley de sucesión de Luxemburgo"
 HEU.flavor_event.68.desc.a:0 "Con el paso del tiempo, y con Rikuhachima Aru decidida a no casarse con un local, en la política luxemburguesa comenzó un debate serio sobre el futuro de la Casa Rikuhachima. El tema más grave era que no existía un heredero que pudiera suceder a la familia. Si la Gran Casa Ducal de Luxemburgo quería mantenerse incluso dentro de un siglo, algún día llegaría el momento en que haría falta un sucesor al trono ducal. Por eso, se discutieron varias alternativas sobre el Luxemburgo “después de Aru”, en un futuro lejano.\n\nLa postura más radical vino del Partido Comunista de Luxemburgo. Su líder, Zenon Bernardt, afirmó: “Lo que el pueblo apoyó con su voto fue la sucesión de Rikuhachima Aru al cargo de gran duquesa, no que sus hijos o hijas se conviertan en grandes duques.” Y sostuvo que, tras la muerte de Rikuhachima Aru, el país debía cambiar su nombre a “República Federal Germana” y establecer una república. Esta propuesta era vista como irrespetuosa o incluso violenta, pero también había quienes decían que era la opción más realista en un escenario donde Aru no podría tener descendencia.\n\nOtro partido de la coalición, el Partido Liberal Radical, propuso introducir el “modelo sueco”. Tomando como precedente el caso del rey sueco Carlos XIII, quien nombró heredero al mariscal de Napoleón, Bernadotte, plantearon que Aru adoptara como sucesor a un hijo de alguna casa noble con legitimidad en la Europa continental. Se criticó que el “modelo sueco” fuera un proceso sucesorio muy “excepcional” en Europa, pero el hecho de que permitiría conservar tanto el sistema del Gran Ducado Federal Germano como la monarquía de Luxemburgo hasta el siguiente siglo lo convirtió en una solución de compromiso incluso respaldada por fuerzas opositoras como el Partido de Derecha.\n\nLa última alternativa era otra propuesta “radical”, impulsada por el Partido Federal de Estudiantes. Sí, habría que adoptar un sucesor, pero no tenía por qué ser un noble humano: con apoyo de la tecnología de Millennium, se podría crear una “Aru IA” copiando la personalidad de Rikuhachima Aru, y cuando la Aru real muriera, el cargo de gran duquesa podría transferirse a una IA con su personalidad implantada.\n\nAru todavía estaba a inicios de sus veintes, así que un gran duque “después de ella” no gobernaría sino hasta el siglo XXI. Pero habría que decidir con antelación. En última instancia, la decisión final estaba en manos de Aru."
 HEU.flavor_event.68.desc.b:0 "Tras el impactante ‘coming out’ de Rikuhachima Aru y su matrimonio con alguien del mismo sexo, en la política luxemburguesa comenzó un debate serio sobre el futuro de la Casa Rikuhachima. El tema más grave era que no existía un heredero que pudiera suceder a la familia. Si la Gran Casa Ducal de Luxemburgo quería mantenerse incluso dentro de un siglo, algún día llegaría el momento en que haría falta un sucesor al trono ducal. Por eso, se discutieron varias alternativas sobre el Luxemburgo “después de Aru”, en un futuro lejano.\n\nLa postura más radical vino del Partido Comunista de Luxemburgo. Su líder, Zenon Bernardt, afirmó: “Lo que el pueblo apoyó con su voto fue la sucesión de Rikuhachima Aru al cargo de gran duquesa, no que sus hijos o hijas se conviertan en grandes duques.” Y sostuvo que, tras la muerte de Rikuhachima Aru, el país debía cambiar su nombre a “República Federal Germana” y establecer una república. Esta propuesta era vista como irrespetuosa o incluso violenta, pero también había quienes decían que era la opción más realista en un escenario donde Aru no podría tener descendencia.\n\nOtro partido de la coalición, el Partido Liberal Radical, propuso introducir el “modelo sueco”. Tomando como precedente el caso del rey sueco Carlos XIII, quien nombró heredero al mariscal de Napoleón, Bernadotte, plantearon que Aru adoptara como sucesor a un hijo de alguna casa noble con legitimidad en la Europa continental. Se criticó que el “modelo sueco” fuera un proceso sucesorio muy “excepcional” en Europa, pero el hecho de que permitiría conservar tanto el sistema del Gran Ducado Federal Germano como la monarquía de Luxemburgo hasta el siguiente siglo lo convirtió en una solución de compromiso incluso respaldada por fuerzas opositoras como el Partido de Derecha.\n\nLa última alternativa era otra propuesta “radical”, impulsada por el Partido Federal de Estudiantes. Sí, habría que adoptar un sucesor, pero no tenía por qué ser un noble humano: con apoyo de la tecnología de Millennium, se podría crear una “Aru IA” copiando la personalidad de Rikuhachima Aru, y cuando la Aru real muriera, el cargo de gran duquesa podría transferirse a una IA con su personalidad implantada.\n\nAru todavía estaba a inicios de sus veintes, así que un gran duque “después de ella” no gobernaría sino hasta el siglo XXI. Pero habría que decidir con antelación. En última instancia, la decisión final estaba en manos de Aru."
 HEU.flavor_event.68.a:0 "Yo seré la última gran duquesa. Después de mí, supongo que será una república."
 HEU.flavor_event.68.b:0 "...Voy a pensar seriamente sobre el problema del heredero."

 HEU.flavor_event.69.t:0 "Derecho de sucesión mediante adopción"
 HEU.flavor_event.69.desc:0 "Tras la decisión de Rikuhachima Aru, comenzaron las discusiones sobre posibles “adoptados”: desde antiguas dinastías nobiliarias de varios países europeos—incluyendo Bélgica y los Países Bajos—hasta la Casa Bonaparte, una nobleza relativamente reciente. Considerando que Aru apenas estaba a inicios de sus veintes, se fijó como fecha prevista para la adopción real el 1 de enero de 1960.\n\nPero antes de eso, era necesario encontrar una casa noble que aceptara la adopción. Se iniciaron negociaciones con unas veinte familias nobles: desde dinastías ya extintas hasta países monárquicos aún existentes. Y varias casas ya mostraban interés en enviar a un miembro de su sangre al Gran Ducado Federal Germano. Elegir una sola casa podría tomar más de diez años, pero, como hasta ahora… y como seguirá siendo… el país permanecería como una monarquía."
 HEU.flavor_event.69.a:0 "¡Larga vida a la Casa Gran Ducal!"

 HEU.flavor_event.70.t:0 "Prueba de funcionamiento de la IA Aru"
 HEU.flavor_event.70.desc:0 "La estudiante de Millennium hojeó los documentos mientras le explicaba a Haruka:\n\n—Así que esto solo es una prueba sencilla. Veremos que la IA funcione correctamente y después volveremos a apagarla. Sería confuso que un país tuviera dos grandes duquesas, ¿no? Haremos mantenimiento del servidor cada año, pero el funcionamiento real será el día en que muera la señorita Rikuhachima.\n—…Entonces… ¿ese será el siguiente día en que la IA se encienda?\n—Pues sí. ¿En unos setenta años? No es un problema de la señorita Igusa por ahora.\n\nEn una sala subterránea profunda de Eden—capaz de resistir incluso un ataque nuclear—Haruka caminó entre supercomputadoras que parpadeaban con una luz roja inquietante, hasta colocarse frente a un muro de monitores que cubría toda una pared. Después de la muerte de “Aru-sama”… ¿sería un día demasiado lejano? Quería pensar que sí, pero el recuerdo de la muñeca fría de Aru, tras haber mezclado veneno suicida en el café, le cruzó la mente. Haruka sintió que su mano se le crispaba y, con voz hundida, dijo:\n\n—Enciéndanla… Solo la veré un momento y me iré.\n\nUna IA preparada para la *muerte* de Aru. Una computadora que, solo por existir, hacía volver aquel recuerdo. Haruka contuvo el impulso de destrozar el monitor con su escopeta y esperó a que la pantalla encendiera. Tras un breve chisporroteo y el sonido de arranque… lo que apareció no fue la “oficina” construida en el Palacio Gran Ducal de Luxemburgo… sino la verdadera oficina de la Agencia de Detectives 68 de Kivotos. Desde el lema de “una maldad al día” colgado en la pared hasta la posición del sofá y del teléfono: todo era exactamente como en los recuerdos de Haruka.\n\nJusto cuando la atónita Haruka iba a decir algo, frente a la cámara que enfocaba la oficina apareció una chica pulcra con abrigo. La escopeta que Haruka sostenía se le resbaló de las manos y cayó al suelo. Era Aru: la Aru joven, la “novata” de aquel entonces—no la actual, endurecida y herida tras innumerables incidentes—sino la Aru que le sonreía con pureza cuando Haruka aún era una chica acosada.\n\n—¡Haruka! ¿Qué pasa? ¿Esa eres tú, Haruka? Ujijiji… ¿te enamoraste de lo “intelectual” que se ve tu jefa?\n\n—Yo… e-esto…\n—Fue una solicitud de la señorita Rikuhachima: que la implementáramos con la personalidad de *aquella época* de Kivotos. Sí. En comparación con ahora, es como diez años “menos adulta”, ¿no?\n\n—¿Qué? ¿Menos adulta? ¿Qué se supone que piensan de mí, que resuelvo cualquier encargo sin problema? ¿Verdad, Haruka? …¿Haruka? ¿Estás llorando?\n\nNo era más que un recuerdo del pasado al que jamás podrían volver. Pero en el instante en que vio la sonrisa de esa Aru que había admirado—no la Aru que se fue hiriendo tras la Gran Transferencia—Haruka rompió en llanto y extendió la mano hacia el otro lado del monitor, hacia algo que no podía tocar.\n\n—…Sí. De verdad… cualquier Aru-sama… para mí, siempre será una Aru-sama increíble."
 HEU.flavor_event.70.a:0 "Por eso… no quiero despedirme de la Aru-sama de Kivotos. …De verdad."

 HEU.flavor_event.71.t:0 "¡La Revolución del 68 junto con internet!"
 HEU.flavor_event.71.desc:0 "En Kivotos, cualquiera podía usar una computadora con facilidad, y cualquiera podía acceder a internet sin esfuerzo. Incluso después de la Gran Transferencia—gracias a academias con gran tecnología como Millennium—las computadoras personales seguían produciéndose en masa y llegando al mercado. Pero… el problema era que, con la pérdida de satélites y cables de comunicación, la propia “red de internet” que antes conectaba a todo Kivotos había sufrido un golpe enorme.\n\nAun así, los kivotosianos de Luxemburgo se dieron cuenta de que, incluso en esta época que parecía haber retrocedido cien años, la red telefónica estaba densamente instalada por los locales… y, tras un breve periodo de caos, internet renació en forma de conexión por módem telefónico.\n\nEmpezaron a surgir diversas comunidades en línea, y nuestro gobierno decidió asignar más presupuesto a la distribución de computadoras públicas para que tanto kivotosianos como locales pudieran usar internet. Por ahora solo es un internet por módem, lento y caro, pero… ¿acaso no podría, con el paso del tiempo, renacer algún día una red de fibra como la de Kivotos? Claro, probablemente los científicos de Millennium lo inventarían antes que Luxemburgo."
 HEU.flavor_event.71.a:0 "¡Conectarse a MomoChannel!"

 HEU.flavor_event.72.t:0 "La contrarrevolución junto con internet"
 HEU.flavor_event.72.desc:0 "Damien Kratzenberg, simpatizante nazi en Luxemburgo, probablemente sea de los pocos políticos fascistas locales que no han sido purgados dentro de la supuesta “Revolución del 68” de Aru. En el fondo, el hecho de que su oficio real no fuera el de político profesional, sino el de profesor de griego, y de que todas sus actividades políticas se limitaran a asociaciones civiles, le abrió una vía para sobrevivir a la locura de aquellos revolucionarios.\n\n¿Revolución? Kratzenberg navegó por sitios luxemburgueses con la computadora doméstica que acababa de comprar y leyó publicaciones de kivotosianos. ¿Compartir fotos graciosas y presumir postres, ropa y accesorios era la revolución de la que hablaban? ¿En qué momento los luxemburgueses habían aceptado esa revolución? ¿O acaso los kivotosianos que llegaron con la Gran Transferencia y perpetraron masacres ahora pretendían “iluminar” a los incivilizados locales porque se creían moralmente “superiores”?\n\n—No es distinto a cuando Lenin masacró campesinos rusos para “iluminarlos”. Sí… no es distinto en absoluto.\n\nKratzenberg cerró el navegador con irritación y se llevó un cigarro a la boca. De pronto recordó a su amada esposa, Lisa. Durante el caos de la Gran Transferencia, Lisa estaba en casa. Mientras él suspendía sus clases de griego y perdía tiempo escondiendo alumnos en el gimnasio, esa pobre mujer temía que mataran a su marido los kivotosianos.\n\nLisa salió corriendo de su casa segura para ir a buscarlo. Si no lo hubiera hecho, quizá estaría viva. No alcanzó ni a cruzar un solo bloque: se topó con estudiantes de Gehenna que arrojaban granadas en la zona urbana. Al día siguiente de la Gran Transferencia, lo único que Kratzenberg pudo encontrar fue un dedo de ella… aún con el anillo de matrimonio.\n\nY ahora, quienes pretendían enseñarle moral y revolución… eran “esas niñas”. ¿Perdonarlas y aceptarlas era el deber de un maestro?"
 HEU.flavor_event.72.a:0 "Kratzenberg sacó del cajón el anillo de boda de su esposa y lo observó."

 HEU.flavor_event.73.t:0 "Oponerse a la revolución también es una revolución"
 HEU.flavor_event.73.desc:0 "A ojos de Damien Kratzenberg, nueve de cada diez cosas llegadas de Kivotos eran basura, y ocho de cada diez aspectos de la cultura kivotosiana no eran más que una imitación barata de la cultura japonesa. Pero una sola cosa sí le gustó: estas computadoras y este internet. A diferencia de tener que rebuscar documentos en papel en reuniones académicas como la Sociedad de Literatura Alemana, con internet y BD podían consultar en un instante información educativa y artículos de academias de Kivotos dispersas a gran distancia.\n\nY había otra cosa que también le gustaba: las redes sociales. No porque quisiera usarlas él, sino para observar cómo vivían los kivotosianos. Tras la llamada “Revolución del 68” de Rikuhachima-loquesea, los nazis ya no podían manifestarse abiertamente en las calles. Pero en internet sí podían. Porque no se le puede jalar el gatillo a un post.\n\nAun así, era imperativo que su identidad no quedara expuesta. Para impulsar la contrarrevolución desde internet, Kratzenberg estudió obsesivamente la vida privada de los estudiantes de todas las academias de Kivotos. Leía SNS, revisaba BD, e incluso tomaba clases en línea iguales a las de los estudiantes. Tenía que volverse “más kivotosiano que los propios kivotosianos”. Así, ni siquiera Aru podría detectar qué estaba tramando.\n\n—Maldición… ¿cambiador de voz? ¿Síntesis de imagen con IA? ¿Hasta esto existe?\n\nTras estudiar lo suficiente, Kratzenberg creó una cuenta de MomoTalk y abrió cuentas falsas en sitios de redes sociales.\n\n—Nanami Ayaka, estudiante de 2.º año de la Academia General Trinity antes de la Gran Transferencia, del club de irse a casa. No pudo adaptarse a la cultura aristocrática de Trinity, no tenía amigos y, tras la Gran Transferencia, decepcionada por el abuso político de la facción Pater, emigró a Luxemburgo. Antes soñaba con ser idol, ahora considera ser vtuber. Le gusta el atuendo de Sisterhood y ha asistido algunas veces a misa. Su comida favorita es el shoyu ramen…\n\nLos estudiantes de las academias de Kivotos son de verdad, de verdad muchísimos. Y, con el sistema administrativo destruido tras la Gran Transferencia, aunque inventaras a una estudiante “falsa”, no habría manera de investigar su historial. Nanami Ayaka. Ese nombre sería su nueva identidad: la que derrumbaría a Aru."
 HEU.flavor_event.73.a:0 "Lucha a través de internet"

 HEU.flavor_event.74.t:0 "¡¡Soy Nanami Ayaka en SNS!!"
 HEU.flavor_event.74.desc:0 "- Descripción del perfil: ¡¡Hola!! ¡Soy Nanami Ayaka, de 2.º año de la Academia General Trinity!\n\n1.\nAquí hay un montón de Gehenna y, siendo honestos, esto de la “Revolución del 68” es demasiado estilo Gehenna.\nUstedes masacraron a luxemburgueses, y cuando los locales se hartan y se defienden unas cuantas veces, a Aru se le revienta la paciencia.\n\n2.\nDisolver el parlamento, disparar… oye, hasta ese tarado de Makoto fue elegido en elecciones. ¿Y su Aru ni eso puede hacer?\nPresumen superioridad moral, pero al final los agresores son ustedes, ¿no?\n\nEsta publicación fue reposteada.\n\nGETOUTARU.\nSoy local, y honestamente estoy de acuerdo.\n¿En qué se diferencia de bolchevismo obligarnos a tragarnos una revolución que no queremos?\n\ncat0808.\nRikuhachima Aru se cree una gran revolucionaria,\npero seguro ni entiende qué es lo que está “revolucionando”.\n\nRealSartre.\nSoy Sartre, novelista francés. Señorita Nanami: usted está equiparando las masacres de Gehenna con la revolución de la señora Aru.\nLa señora Aru fue alguien que intentó detener las masacres.\n\nAyakaNanami.\nHe leído la respuesta del señor Sartre, gracias.\nPero al final Aru también terminó disparando en las sedes de los partidos locales… ¿qué diferencia hay?"
 HEU.flavor_event.74.a:0 "Internet arde en discusión..."

 HEU.flavor_event.75.t:0 "El profesor Damien"
 HEU.flavor_event.75.desc:0 "—¡Escribir en internet fingiendo ser una niña y hablar frente a un equipo de transmisión con voz de chica, haciéndoles “pucheros” a los espectadores, no es lo mismo! ¡Yo también tengo orgullo! ¡¿Me crees una mujercita de verdad?!\n\nAunque le gritó así a Arona, ella no lo expulsó de inmediato. “Puede pensarlo unos días más si quiere, profesor Damien.” Eso fue lo que dijo.\n\n—¿Profesor…? Desde la Gran Transferencia, ella fue la única que volvió a llamarme así.\n\nAntes de la Gran Transferencia, aparte de ser presidente de la Sociedad de Literatura Alemana, había sido instructor de griego para ganarse la vida y tenía varios alumnos. Ahora… eso ya era cosa del pasado. Las clases se cancelaron en medio del caos de la Revolución del 68, y Kratzenberg llevaba años sin conseguir un trabajo decente.\n\nDe regreso a casa, caía una llovizna en el distrito especial de Utnapishtim, donde estaba el edificio de Schale.\n\nDe pie en la estación al aire libre, empapándose, Kratzenberg recordó aquel día de la Gran Transferencia: risas de chicas que se acercaban desde fuera, y el sonido de ametralladoras “escupiendo” balas en ráfaga. Temblando junto a los alumnos, él se arrodilló y susurró: “No pasa nada. Si no hacemos ruido, esos tipos no nos reconocerán.”\n\nUn chico asustado le preguntó: “Si nos descubren… ¿usted nos protegerá, profesor?” Aunque sabía que no podía, asintió: “Sí. Yo los protegeré.”\n\nPorque ese era el trabajo de un profesor.\n\n—Protegerlos…\n\nUn tren entró al distrito especial de Utnapishtim. En el costado del vagón estaba impreso un brillante póster de Rikuhachima Aru: <¡Con la nueva presidenta del Consejo Estudiantil General, erradiquemos la cultura inferior y avancemos hacia un nuevo siglo!>\n\n¿Quién es inferior y quién es superior? ¿Eran “inferiores” esos alumnos que, encogidos, lloraban rogando que las chicas del halo no los descubrieran? ¿Fue “inferior” la cultura griega que unió a Europa durante dos mil años? Si el mundo donde esos alumnos debían crecer era este, y si los estudiantes del futuro terminaban viviendo creyendo que su cultura era “inferior”…\n\nSi él se convertía en un maestro incapaz de proteger a sus alumnos, ¿podría seguir llamándose a sí mismo “profesor”?\n\n—¡A la mierda!\n\nIgnorando la sorpresa de los kivotosianos de la estación, se dio la vuelta y echó a correr. Atravesó la lluvia y se metió a toda prisa en el edificio semiderruido del Club Federal de Investigación, con parte del muro arrancado. Ahí, en una oficina donde se colaba el agua, agarró con fuerza una tablet. Porque sabía que eso era lo que debía hacer."
 HEU.flavor_event.75.a:0 "“Arona… eso de ser vtuber… ¿cómo se empieza?”"
 HEU.flavor_event.76.t:0 "Pregunta"
 HEU.flavor_event.76.desc:0 "\"Profesor Damien. ¿Qué hace?\"\n\"Buscando tema para el stream en internet.\"\n\nSentado frente al teclado en la Cámara de Crafteo, Damien se sirvió whisky en un vaso. Desde que vivía dentro de la Cámara de Crafteo—un lugar donde no tenía que preocuparse por la mirada de nadie—el tiempo que pasaba bebiendo de día había aumentado muchísimo. ¿Acaso este era un mundo en el que uno pudiera vivir con la mente sana? Y lo de ser una vtuber de preparatoria… era todavía peor.\n\nArona, desde la Caja de Shittim, echó un vistazo al monitor de Damien. Para Arona, Damien Kratzenberg claramente no era un *verdadero* “Sensei”. Era nazi, vivía empapado en alcohol durante el día, y tampoco parecía tener grandes ganas de proteger a las estudiantes de Kivotos. Pero compartiendo cada día la misma hora y el mismo espacio, se le había instalado una idea: quería saber más sobre esa persona.\n\n\"Dicen que usted era instructor de griego… ¿es verdad?\"\n\"…Lo era. Hasta antes de la ‘Gran Transferencia’.\"\n\"¿Y por qué precisamente griego? Si era presidente de la Sociedad de Literatura Alemana, ¿no sería más ‘nazi’ enseñar lengua y literatura alemana?\"\n\"No soy ‘nazi’, mocosa. Soy nacionalsocialista. Usa el término correcto.\"\n\nAunque lo dijo con sequedad, al recordar la época en que enseñaba, el rostro de Damien se iluminó un poco.\n\n\"Grecia es como la madre de toda la cultura europea. Todas las civilizaciones europeas—incluido el Imperio romano—están en deuda con los antiguos griegos. Si de verdad quieres entender la historia de la civilización europea, necesitas aprender griego. Desde Aristóteles hasta Platón… ¿cuántas cosas lograron? Por más que Kivotos tenga una historia y una cultura impresionantes, nosotros también tenemos tradición de civilización y de historia. …El griego es un arma para conocer esa historia. Un arma para protegerte a ti mismo.\"\n\"Wow. Es la primera vez que lo veo hablar tanto.\"\n\"Señorita Arona. Ya que estamos… ¿qué tal si usted también aprende griego? Si hace falta, incluso podría enseñarle.\"\n\nArona dudó un momento y, al final, sonrió."
 HEU.flavor_event.76.a:0 "\"Creo que sería difícil hacerlo todavía más ocupado, Sensei.\""

 HEU.flavor_event.77.t:0 "Una teoría conspirativa absurda"
 HEU.flavor_event.77.desc:0 "Esa noche, mientras preparaba el plan del stream, Damien soltó el teclado con una expresión agotada. Ya desde la mañana hasta la tarde había gastado el tiempo únicamente organizando materiales y revisando el guion. Se acercaba el momento en que el cansancio acumulado lo haría desplomarse.\n\n\"Profesor Damien. ¿Qué le parece si descansa un poco? Si sigue así, al final ni siquiera podrá transmitir en la noche.\"\n\"Sí. …Si no transmito, se acaba todo. …Tráeme algo de alcohol.\"\n\"¡SEN-SEI! ¿Sabe cuántas botellas se toma al día? Si se emborracha y no puede transmitir, yo no me hago responsable.\"\n\nPero Damien solo se rió ante las palabras de Arona y se dejó caer en el sofá.\n\n\"Yo no escucho a las chicas de Kivotos. Mi principio es hacer lo que se me da la gana.\"\n\"Uf… haga lo que quiera. Así se va a enfermar y se va a morir temprano.\"\n\nCuando Arona, refunfuñando, se sentó en el borde del escritorio dentro del monitor, de pronto, como si se le hubiera ocurrido algo, Damien preguntó:\n\n\"Oye… y esa Rikuhachima Aru…\"\n\"¿Sí?\"\n\"Esa mujer parece una criatura del demonio puesta por Satanás para arruinar Luxemburgo a propósito. …Y digo yo, ¿no será que está metida en alguna de esas conspiraciones ridículas de ‘todo lo controla un grupo secreto’ o algo así?\"\n\nArona lo miró unos segundos con una expresión seria, con el vaso en la mano… y entonces soltó un suspiro larguísimo, como si se le hundiera el piso.\n\n\"No, a ver… profesor Damien…\""
 HEU.flavor_event.77.a:0 "\"Si de verdad cree que eso tiene sentido… creo que lo mejor para usted sería irse a colgar de una vez.\""

 HEU.flavor_event.78.t:0 "Preocupación"
 HEU.flavor_event.78.desc:0 "El stream de Damien Kratzenberg—el canal de Nanami Ayaka—iba ganando popularidad cada vez más, pero Arona seguía llena de preocupaciones. El régimen de Aru aún no mostraba señales de derrumbarse. Cada vez había más habitantes opositores, sí, pero también había muchos que apoyaban a Aru. Y los enemigos externos que amenazaban a Kivotos seguían allí. Si Aru no era reemplazada por Arona pronto, tal vez todo Kivotos acabaría destruido por enemigos perversos como Gematria o Decagrammaton.\n\nY había otra preocupación más últimamente… el peso de Damien había bajado notablemente. Bebía casi todos los días, así que uno pensaría que le crecería la barriga, pero comparado con cuando lo conoció por primera vez en Schale, Damien parecía haber perdido unos 10 kg. Todos los días, desde la mañana, preparaba el contenido del stream; y desde la tarde hasta medianoche, repetía el ciclo de comunicarse con el público. Transmitía en racha sin descansar ni un solo día… ¿no se le estaría rompiendo el cuerpo?\n\n‘No. Al final ese tipo ni siquiera es un *verdadero* Sensei de Kivotos. …Solo es un nazi que dice tonterías y alguien por quien no debería preocuparme.’\n\nArona pensaba eso, pero aun así no podía detener su preocupación al ver a Damien sentado en un rincón del sofá, acariciando con la punta de los dedos el anillo de bodas de su esposa muerta. Puede que no fuera una buena persona. Puede que no fuera alguien que diera el ejemplo. Pero… ¿había cometido un pecado tan grande como para merecer terminar así?"
 HEU.flavor_event.78.a:0 "Tal vez… fue ella quien le puso un grillete demasiado pesado. Esa idea le cruzó la mente."

 HEU.flavor_event.79.t:0 "Sensei"
 HEU.flavor_event.79.desc:0 "\"Profesor Damien… si logra expulsar a Rikuhachima Aru, ¿qué le gustaría hacer después?\"\n\n\"¿Qué? ¿Algún plan para el siguiente stream o qué?\"\n\n\"No es que solo hable de stream, ¿sabe? Es solo para relajar un poco el ambiente.\"\n\n\"Ya. Jaja. Para ser una mocosa atrapada en un monitor, sí que tienes habilidades sociales. Hay estudiantes como tú que en el salón hacen muchos amigos. …Después de que Aru sea expulsada, eh. La verdad, nunca lo he pensado.\"\n\n\"Como usted era instructor de griego, ¿por qué no vuelve a ser maestro? …Aunque, bueno, como es un señor nazi, no debería meterse en política.\"\n\n\"Oye, mocosa. Que no soy ‘nazi’, que soy nacionalsocialista. Ya, como sea. No creo que yo sea alguien apropiado para ser ‘Sensei’.\"\n\n\"¿Por qué?\"\n\n\"Claro que un Sensei no es Dios ni un salvador. No puede hacer que los problemas de los estudiantes simplemente *desaparezcan*. Pero al menos, un Sensei debería ser alguien capaz de proteger a sus estudiantes y ayudarlos a avanzar hacia un buen futuro, ¿no? …Y entonces, ¿yo fui ese Sensei? Si me preguntas si fui un Sensei que le construyó un futuro a los niños que enseñé… creo que no. ¿Qué hice yo en la Gran Transferencia? Solo me escondí en la escuela temblando junto con mis alumnos. No les di valentía… y… vine aquí queriendo ser digno como ‘Sensei’… pero aún no he logrado nada. ¿Suscriptores? ¿Donaciones? Sí, eso subió un chingo, carajo. ¡Pero eso no revive a los niños que murieron aquel día! ¿Que yo junte un poco de dinero es ‘proteger a los estudiantes’? ¡Claro que no…!\"\n\n\"…\"\n\n\"Perdón, Arona. Solo… cuando pienso en lo de la Gran Transferencia, se me pone fea la boca.\""
 HEU.flavor_event.79.a:0 "\"No… fui yo quien lo hizo recordar algo doloroso. Lo siento.\""

 HEU.flavor_event.80.t:0 "Salud"
 HEU.flavor_event.80.desc:0 "\"¡Cof! ¡Cof! …Ah, maldita sea.\"\n\nRopa empapada de sangre por el vómito. Se veía cómo la sangre brotaba y le escurría desde la mandíbula. Al principio intentó apartar la mirada de la realidad pensando que era… solo cansancio acumulado. Pero, ¿quién carajos tose sangre solo por estar cansado? Damien Kratzenberg se estaba muriendo.\n\n\"Cáncer de hígado en fase terminal. …Si le soy sincero, con la medicina moderna no tenemos nada que ofrecerle aparte de analgésicos.\"\n\nTanto el médico humano de la ciudad de Luxemburgo como el médico de Kivotos del planeta D.U. dieron el mismo diagnóstico: cáncer de hígado. …La causa era el alcohol que había bebido todos los días desde la Gran Transferencia. En el hospital kivotosiano dijeron que, si hacía el procedimiento de hospitalización, podrían alargarle la vida con tratamientos de soporte. Pero… ¿tenía sentido esa vida alargada? Ni siquiera podría seguir transmitiendo como Nanami Ayaka.\n\n\"…Así están las cosas.\"\n\nEl día que volvió a Schale, Damien le tendió a Arona la hoja de resultados del chequeo completo. Se notaba cómo la expresión de Arona se endurecía de inmediato.\n\n\"Sensei… esto es…\"\n\"Nuestro stream… creo que no va a durar mucho más.\"\n\"…Sensei.\"\n\"Pero el trabajo de derribar al gobierno de Rikuhachima no puede detenerse aquí. Mientras aún pueda transmitir, haré un stream de retiro. Y después… Arona. ¿Podrías heredar mi parte y seguir transmitiendo por internet en mi lugar?\"\n\nFue el silencio más largo desde que se conocieron. Se le formaron lágrimas en las comisuras de los ojos a Arona.\n\n\"¿Qué es esto…? ¿Cáncer de repente…? No es justo…\""
 HEU.flavor_event.80.a:0 "Mientras Arona sollozaba, Damien se desplomó en el sofá."

 HEU.flavor_event.81.t:0 "¿¡Que haga stream!?"
 HEU.flavor_event.81.desc:0 "\"¡AJAJAJA! ¿¡Vtuber!? ¿¡Con eso van a sacar a Aru-chan!? ¡Está buenísimo!\"\n\nMientras los cuatro de la agencia veían juntos el stream de Nanami Ayaka—que ya acumulaba una cantidad absurda de vistas—Mutsuki se reía a carcajadas mirando al personaje 2D de la pantalla, moviendo la cabeza de un lado a otro. Para Mutsuki, claro, esto podía ser divertido. Pero para Aru no era divertido… era como si la mente se le quedara en blanco. ¿Una rival que vino de Trinity? ¿Alguien que va a pelear contra ella usando internet? En Kivotos jamás había tenido que enfrentar algo así.\n\nPara que no se notara que estaba nerviosa, Aru cruzó los brazos y desvió el centro de la conversación hacia Kayoko.\n\n\"Jefa Kayoko. ¿Sabes algo sobre esta tipa? Explícame bien.\"\n\"…Haa. En realidad, lo de Ayaka en internet empezó hace bastante. Al principio solo subía posts en SNS insultando a la jefa. Bueno… nuestra jefa es de las que dan mucho trabajo. Que exista alguien en Trinity que odie a Aru tampoco sería tan raro.\"\n\"Entonces… ¿es verdad que Ayaka es de Trinity?\"\n\"Yo diría que sí. Desde que empezó en SNS, parece que conoce bien Trinity. Y, además, Trinity odia a Gehenna. Pero lo importante es otra cosa: cómo vamos a manejar a esta vtuber.\" \n\nHaruka se rascó la mejilla.\n\n\"Por cierto… esta persona… ¿no sienten que su voz se parece rara vez a la de Aru-sama? Como si Aru-sama estuviera transmitiendo…\"\n\"¡¿Cómo voy a hacer un stream para insultarme a mí misma?! ¡A menos que fuera uno para defenderme!\"\n\nEn ese instante, Mutsuki dio una palmada.\n\n\"¡Eso! ¡Que Aru-chan haga stream en persona!\"\n\"…¿Qué?\"\n\"¡Al stream se le responde con stream! ¡Nada de virtual: stream real! ¡Se llamará ‘Canal del Straight Travieso’! Ujijiji. ¿Qué tal, Aru-chan? Pelear stream contra stream. ¿No suena divertido?\""
 HEU.flavor_event.81.a:0 "¡¿Y de dónde salió el nombre de ‘Straight Travieso’?!"

 HEU.flavor_event.82.t:0 "Stream debut de Rikuhachima Aru"
 HEU.flavor_event.82.desc:0 "\"Ah… h-hola a todos. Soy… la jefa de la Agencia 68, la regente del Gran Ducado de Luxemburgo, y la presidenta del Consejo Estudiantil General de Kivotos… Rikuhachima… Aru. Eh… b-bueno, desde hoy voy a hacer stream. Por favor apoyen mucho el Canal del Straight Travieso…\"\n\n- mira cómo le tiembla la voz jajajaja\n- qué pinche lista de cargos tan larga jajajajaja ¿eres Cherino o qué?\n- ya cállate y quítate la ropa\n- deja de temblar y enseña el pecho\n- ¿es Aru de verdad? ¿la presi del consejo haciendo stream? Kivotos se fue al carajo jajaja\n- por el pecado de disolver al Partido de Derecha… el Señor no la perdonará… caerás al infierno…\n\n\"…¡¿Qué es esta reacción?! ¡Es mi primera vez haciendo stream para todo el país, puedo estar nerviosa! ¡Oye! ¡¿Quién fue el que escribió ‘quítate la ropa’?! ¿¡Quieres que te meta un headshot?!\"\n\n- ya empezó a regañar jajajaja\n- headshot dice jajajaja a ver rastrea mi IP\n- ¿y entonces por qué no te quitas??????\n\nSu primer stream. Sabía que iba a ser caótico… pero el chat, con miles de mensajes subiendo en cascada, era literalmente el caos. En cierto sentido, era como Gehenna… convertido en internet.\n\nAru sintió ganas de mandarlo todo a la mierda. Justo cuando esa idea empezaba a crecer, Haruka se acercó por detrás y miró el chat… silencio breve. Se le endureció el rostro y, sin decir nada, Haruka sacó la escopeta colgada en la oficina.\n\n\"Aru-sama. Iré a matar a todos los espectadores del stream. Lo… lo intentaré…\"\n\"¡No! ¡Oye! ¡Haruka! ¡Espera! ¡Alto! ¡Aaaah! ¡Odio el streaming!!!!\""
 HEU.flavor_event.82.a:0 "...El stream debut fue un bombazo."

 HEU.flavor_event.83.t:0 "Investigar a Nanami Ayaka"
 HEU.flavor_event.83.desc:0 "¿Nanami Ayaka era realmente una estudiante de Trinity? Y si lo era, ¿por qué estaba despedazando a Aru como si la quisiera matar? ¿Era porque odiar a Gehenna era algo así como la identidad de Trinity? Por todo eso y más, Aru pidió que investigaran a Nanami Ayaka. La encargada fue Kayoko.\n\n\"No encontré gran cosa. Hay razones de sobra para pensar que es de Trinity, en el sentido de que conoce bien su cultura. Pero es sospechoso que no haya ninguna estudiante de Trinity que diga ser cercana a Nanami Ayaka, o que diga conocerla. …Aunque, claro, Ayaka dice que era del Club de Irse a Casa y que no pudo hacer amigos.\"\n\n\"O sea, en resumen: puede que sí sea de Trinity… o puede que no.\"\n\"Haa… como sea, conocerla en persona será difícil. Actúa con total cuidado y solo en internet. La jefa no tiene forma de ir a buscarla. …Al final, la única opción es responderle por internet.\"\n\nResponderle por internet. O sea, seguir con este stream tortuoso era la única solución. Aru sintió cómo le dolía la cabeza y suspiró.\n\n\"Está bien. Pero entonces, Kayoko, ¿podrías encargarte de moderar el chat? Yo sola no lo aguanto…\"\n\"¿Y Mutsuki o Haruka?\"\n\"¡Mutsuki se ríe aunque vea hate, y Haruka arma un drama de que va a dispararles a todos! No, no, NO: de moderadoras no sirven.\"\n\nSí. Esto es la Agencia. Kayoko, sin ocultar su expresión fastidiada, asintió."
 HEU.flavor_event.83.a:0 "\"Ni modo. Este stream no es solo de Aru. Es de todos. Te ayudaré.\""

 HEU.flavor_event.84.t:0 "Stream de sueño"
 HEU.flavor_event.84.desc:0 "Mñam mñam… aaaaah… yo soy… la forajida más fuerte de Kivotos… ujijiji… sí… jefa Hina, si te postras más fuerte te dejo vivir… jijiji… mñam…\n\n- empezó el directo y Aru está dormida, ¿es neta?\n- dejó un directo programado y se desmayó\n- jajajajajajajajajaja\n- wey, está tirada en el sofá y el pecho se le ve como cohete\n\nMñam… <¡pi-pi-pi-pip!> ¿Eh? ¿Eeh? <¡pi-pi-pi-pip!> ¿Qué? ¿Teléfono? ¿Eh? ¿Kayoko? ¿Qué pasa? Tengo sueño. Déjame dormir… ¿Eh? ¿Eeeeh? ¿¡El stream está prendido!? ¿¡Yo programé un directo!? ¡¿Eeeeh?!\n\n- jajajajajajajajajajajajaj\n- CONSEJO ESTUDIANTIL (REAL)\n- el país se fue al carajo\n\n¡Todos STOOOOP! ¡Esto no cuenta, no cuenta! A ver… esperen… voy a lavarme la cara tantito… ¡Oye! ¡Hasta hace un rato no contaba!!!!"
 HEU.flavor_event.84.a:0 "¡¿Quién fue el que dejó programado el directo?!"

 HEU.flavor_event.85.t:0 "La guerra contra [GEI.GetName]"
 HEU.flavor_event.85.desc:0 "- Hola a todos. Soy Rikuhachima Aru, dueña del Canal del Straight Travieso.\n\n- ¡Hola a todos! ¡Este es el canal de Nanami Ayaka!\n\n- …Para enfrentar la amenaza de [GEI.GetName], el Consejo Estudiantil General trabajará por los derechos de Kivotos y de la humanidad, usando cualquier medio necesario.\n\n- El Consejo dice que trabaja “por los derechos de todos”, pero… ¿una agencia que le disparó a los propios luxemburgueses puede vencer a un enemigo externo como los Colores? ¿No es precisamente ahora cuando se necesita un nuevo líder de guerra?\n\n- Por favor confíen en mí. No—confíen en todos los miembros del Consejo Estudiantil General.\n\n- No confíen jamás en Rikuhachima Aru. No tienen por qué obedecer ninguna orden del gobierno.\n\n- Me la pasé hablando de ser una “forajida hardboiled” y de “una maldad al día”… pero aun así, ahora quiero estar aquí como presidenta del Consejo: proteger a todos los que están en este lugar y avanzar juntos hacia el futuro. No perderé. El Consejo Estudiantil General y la Oficina del Primer Ministro de Luxemburgo enviarán todas las fuerzas que podamos movilizar para derrotar a los Colores y proteger la Tierra… y también Kivotos.\n\n- Sé que hay quienes me critican por dividir a la nación en tiempos de guerra. Pero para proteger de verdad la Tierra y Kivotos… se necesita una *verdadera* presidenta del Consejo Estudiantil General. Avancemos juntos hacia el futuro. Yo, Nanami Ayaka, estoy aquí para protegerlos."
 HEU.flavor_event.85.a:0 "Dos transmisiones de guerra fueron emitidas al mismo tiempo."

 HEU.flavor_event.86.t:0 "¡Más allá del 2D, al 3D!"
 HEU.flavor_event.86.desc:0 "\"Profesor Damien, esta vez, al producir equipo nuevo con la Cámara de Crafteo… ¡ya podremos hacer stream completamente en 3D con captura de movimiento! Ah, y el modelado de Nanami Ayaka para usted también quedó perfecto. A partir de ahora, sus streams serán en 3D.\"\n\nDamien, bebiendo una cerveza en lata, soltó una risa incrédula.\n\n\"¿Captura de movimiento? O sea que ahora tengo que hacer stream moviendo brazos y saltando como una verdadera preparatoriana frente al monitor, ¿o qué?\"\n\"Verlo hacer ese ridículo… la verdad, yo también quiero verlo un poquito.\"\n\"Oye. Te estás riendo.\"\n\"Eeeh. Yo no me estoy riendo. …Pff.\"\n\"¡Te reíste!\"\n\nCon la mente en blanco, Damien estuvo a punto de arrojar la lata vacía hacia la Caja de Shittim, pero al final soltó una risa seca y dejó la cerveza sobre la mesa. Total, ya había decidido tirar a la basura esa forma de pensar “anticuada” como el orgullo masculino. Lo importante era derrotar a Rikuhachima Aru y abrir una “nueva era” para sus futuros estudiantes. Si era por eso, podía tragarse más vergüenza todavía."
 HEU.flavor_event.86.a:0 "Pero… ¿no se puede sin mocap, neta…?"

 HEU.flavor_event.87.t:0 "La batalla decisiva de Eden y SNS"
 HEU.flavor_event.87.desc:0 "- Descripción del perfil: ¡¡Hola!! ¡Soy Nanami Ayaka, de 2.º año de la Academia General Trinity!\n\n1.\nAru por fin dice que se va a partir la madre con Trinity…\nla neta, ¿quién cree que Aru va a ganar?\n\n2.\nCon eso de la “Revolución del 68” y demás,\nAru dejó Luxemburgo hecho un basurero… ¿ustedes creen que el ejército pueda pelear bien así?\n\n3.\nSi Aru se hace a un lado desde ahorita,\ncreo que Luxemburgo todavía tendría aunque sea 1% de posibilidad de sobrevivir."
 HEU.flavor_event.87.a:0 "...Este post se volvió un escándalo enorme."

 HEU.flavor_event.88.t:0 "La caída del Pandemonium y SNS"
 HEU.flavor_event.88.desc:0 "- Descripción del perfil: ¡¡Hola!! ¡Soy Nanami Ayaka, de 2.º año de la Academia General Trinity!\n\n1.\n¿Se acuerdan que dije que Luxemburgo con Rikuhachima iba a perder?\nPues ahí está el resultado jajaja\n\n2.\nAntes de que Luxemburgo se muera de verdad,\nretírate en silencio desde ahorita—si hasta el Pandemonium ya cayó."
 HEU.flavor_event.88.a:0 "...Este post se volvió un escándalo enorme."

 HEU.flavor_event.89.t:0 "Disturbios anarquistas del 68"
 HEU.flavor_event.89.desc:0 "Tres anarquistas ilegalistas (criminalistas), inmigrantes franceses de origen argelino, intentaron hoy asaltar un banco en el departamento del sur y fueron abatidos por la policía local. Se informó que los anarquistas franceses, que llevaban pasamontañas con números escritos en la cabeza, emigraron a Luxemburgo inspirados por el pensamiento liberal de la Revolución del 68, y habían seguido la doctrina del ilegalismo: la idea de que, para construir una sociedad anarquista ideal, los pobres deben arrebatar con violencia la riqueza de los ricos.\n\nLos anarquistas asesinaron a dos empleados del banco usando armas de fuego de Kivotos que, según se cree, fueron introducidas de contrabando desde la Academia de Policía Valkyrie. Luego sostuvieron un enfrentamiento atrincherados contra las fuerzas policiales, pero con la retirada bloqueada, los tres fueron finalmente abatidos por la policía luxemburguesa.\n\nLos principales medios de Luxemburgo cubrieron ampliamente el caso, ya que se trataba del primer crimen social cometido por humanos locales (no kivotosianos) entre los inmigrantes influenciados por los ideales de la Revolución del 68. El gobierno de Rikuhachima no emitió comentarios, pero el jefe de policía departamental dio una entrevista cínica sobre el anarquismo, afirmando que “la violencia jamás puede justificarse bajo ninguna ideología psicótica”."
 HEU.flavor_event.89.a:0 "¿Y entonces por qué traían números en las máscaras del asalto?"

 HEU.flavor_event.90.t:0 "Disolución oficial del Comité de Moral Pública"
 HEU.flavor_event.90.desc:0 "\"¡Esto es un abuso imperdonable! ¿Cómo se atreven…? ¡Ni siquiera son el Pandemonium, son solo un club criminal disfrazado…!\"\n\nA pesar de que Amau Ako gritó y pataleó contra la policía luxemburguesa que vino a incautar todos los equipos y documentos del Comité de Moral Pública, era un hecho: el Comité había sido derrotado por [HEU.GetName]. Por más que ellos no fueran el Pandemonium, el poder real para decidir la existencia del Comité estaba del lado de esos vencedores.\n\nY, considerando la mala sangre que venía desde Kivotos entre la Agencia 68 y el Comité de Moral Pública… era obvio que no iban a dejarlos existir.\n\nAko se enfureció, suplicó, se aferró a los oficiales… pero al final no tuvo más remedio que aceptar que no había forma de impedir la disolución.\n\n\"Perdón… yo…\"\n\nEn la sala vacía del Comité, ya despojada de todo, Ako se desplomó en el suelo y recordó el rostro de la persona a la que más admiraba: Sorasaki Hina, a quien no había vuelto a ver ni una sola vez desde que el Comité se derrumbó ante la Agencia 68."
 HEU.flavor_event.90.a:0 "\"Yo debí haberlo detenido…\""
 HEU.flavor_event.91.t:0 "Reforma del Comité de Moral Pública como Departamento de Justicia"
 HEU.flavor_event.91.desc:0 "\"¡Esto es un abuso imperdonable! ¿Cómo se atreven…? ¡Ni siquiera son el Pandemonium, son solo un club criminal disfrazado…!\"\n\nAunque Amau Ako le gritó y pataleó a los directivos del Pandemonium convertidos en marionetas de la Agencia, la verdad era una: el Comité de Moral Pública había sido derrotado por [HEU.GetName]. El Comité se mantendría. Con una condición. …Cambiar su nombre a “Departamento de Justicia”.\n\nNo habría recorte de presupuesto ni disolución del departamento. El Comité podría seguir con la misma vida en Gehenna… a cambio de usar el mismo nombre que el organismo de seguridad de Trinity, que era precisamente lo que más detestaban. Era también la “venganza política” de mayor intensidad que encajaba con la personalidad de Aru: alguien que se dice hardboiled, pero que en el fondo tiene un lado algo blando.\n\n\"Supongo que es mucho mejor que ser disueltos, pero…\"\n\nUna banda del brazo del Departamento de Justicia enviada a Ako como si se estuvieran burlando de ella. Y, junto a eso, una nota escrita a mano por Asagi Mutsuki que decía: “¡Es un regalo de cariño! :)”. Era… más humillante que cuando le habían dado un collar con un garabato que decía “el perro de la jefa del Comité de Moral Pública”."
 HEU.flavor_event.91.a:0 "\"¡Aaaah! ¿¡Y qué tiene esto de ‘regalo de cariño’?!\""

 HEU.flavor_event.92.t:0 "Visita de Sorasaki Hina"
 HEU.flavor_event.92.desc:0 "Tras el golpe militar de Mutsuki y perder por completo el poder militar, era imposible que Aru saliera libremente de la capital. Aun así, con el ‘permiso’ de Mutsuki, Aru llegó al distrito sur de Gehenna para decidir personalmente el castigo a los directivos del Comité de Moral Pública.\n\n\"En Kivotos, con solo oír ‘jefa del Comité’ me temblaban las manos.\"\n\nAru sonrió con torpeza mientras caminaba por la avenida principal de Gehenna. Ahora que había perdido la mitad del campo visual por la extracción de un ojo y le había quedado una discapacidad permanente en el brazo derecho, incluso el nombre de Sorasaki Hina ya no podía asustarla como antes. Porque aprendió que el pequeño martillazo de un adulto malintencionado daba mucho más miedo que el ‘Ish-bosheth’ de una jefa del Comité que actuaba por el bien de otros.\n\nDesde que Gehenna fue “reunificada”, Hina no había vuelto a aparecer en actos oficiales. No fue al Comité, y decían que se había encerrado en su casa. En secreto, Aru sintió envidia: ella sí había podido soltar esa carga pesada y descansar.\n\nDe camino a la casa de Hina, Aru se echó una cerveza enlatada a la boca mientras forzaba su brazo derecho—que le temblaba con espasmos con solo sostener la lata. Sorasaki Hina: el enemigo que más miedo le había dado en Kivotos. …Aru no quería irrumpir en la casa de una Hina que ya no tenía poder para hablar de “disciplinas” ni nada parecido. Solo quería…\n\nEn medio de frustraciones repetidas y dolor, Aru—que había luchado sin parar—solo quería preguntarle a alguien mucho más extraordinario que ella cómo había soportado el sufrimiento y resistido en Kivotos."
 HEU.flavor_event.92.a:0 "\"Hina… ¿estás dentro?\""

 HEU.flavor_event.93.t:0 "Fuera de lo esperado"
 HEU.flavor_event.93.desc:0 "Para Rikuhachima Aru en los días de Kivotos… ¿qué era Sorasaki Hina? Llamarla “rival” era demasiado: la diferencia de nivel era abismal. Sí. Era un enemigo con el *hardboiled* que a Aru le faltaba; una enemiga con carisma real. Una presencia que despertaba ese deseo competitivo de “algún día—algún día de verdad—quiero vencerla cuando la Agencia 68 crezca”… y que, al mismo tiempo, si de verdad tocaba pelear, le empapaba la espalda de sudor frío: un enemigo “temible”.\n\nTras la Gran Transferencia, pasó muchísimo tiempo. Aru dejó de ser una chica ingenua que perseguía el hardboiled y se convirtió en una adulta alcohólica tan idiota que ni siquiera entiende lo que significa “responsabilizarte de otros”. Pero al menos Hina debía ser distinta. Para Aru, Hina era alguien a quien algún día quería alcanzar… su enemigo máximo: fuerte, por eso daba miedo, pero también por eso quería escalar hasta allí.\n\nPor eso.\n\nAru no pudo aceptar que esa mujer frente a ella—con el cabello hecho un desastre, en pijama, con el rostro hundido y vacío como el de una persona destruida—fuera Sorasaki Hina.\n\n\"…¿Qué carajos es este estado, Hina?\"\n\"El Comité perdió. Yo pensé que si asumía responsabilidad, si me esforzaba… aunque fuera duro, si tenía voluntad… si me esforzaba por ser el ejemplo de todos… lo lograría… pero… lo arruiné todo. Yo… todo… lo arruiné.\"\n\nNo.\n\nEste no era el encuentro que Aru imaginaba. Quería que Hina—que también se esforzó con responsabilidad y aun así fracasó—la agarrara del cuello y le gritara: que, si era una criminal de Gehenna que había ganado, debía pararse con más orgullo; o que le dijera cómo se sostiene la responsabilidad. …Quería escuchar ese regaño. Porque estaba demasiado cansada.\n\nPero la Hina de ahora era distinta. Era igual que Aru. No… más hundida que Aru, atrapada en un abismo más profundo."
 HEU.flavor_event.93.a:0 "\"…Me voy. Yo… esperaba más de ti…\""
 HEU.flavor_event.93.b:0 "Aru disparó tal cual al techo."

 HEU.flavor_event.94.t:0 "Duelo"
 HEU.flavor_event.94.desc:0 "Sorasaki Hina aún recordaba perfectamente a Rikuhachima Aru de la era de Kivotos. Era imposible no recordarla: el TOP 3 de dolores de cabeza del Comité. Número 1: el Club de Desarrollo de Aguas Termales. Número 2: el Club de Investigación Gourmet. Y, por debajo de esos dos, una tonta—Aru.\n\nPasaron algunos años. Y Aru, sin rastro del aire despistado de antes… cansada y hecha pedazos, pero con una mirada afilada, sostenía una pistola.\n\nGracias a los informes sacados por la unidad de inteligencia, Hina ya sabía bien en qué estado estaba Aru. Un brazo arruinado, así que su rifle de francotirador—su fuerte—quedó sellado. Tras la discapacidad visual, perdió percepción de profundidad y su puntería cayó a la mitad. Y, encima, depresión y alcoholismo. Si la Aru actual peleara contra la Hina de Kivotos… caería en menos de diez segundos. Entonces, ¿por qué? ¿Por qué exigía un duelo tan vacío? Siendo la vencedora, en una posición donde podía hacerle lo que quisiera a una perdedora como ella.\n\n\"Si te quedas ahí como idiota, disparo primero.\"\n\n¡Bang! La bala de Aru, como era de esperarse, se clavó en un techo muy lejos de Hina. \"Ja… pinche mierda.\" Aru soltó una risa seca y se lanzó hacia adelante. Parecía querer decidirlo a corta distancia.\n\n\"Yo todavía no logro entenderte.\"\n\nHina levantó su ametralladora y disparó su especialidad: el “Ish-bosheth”. Balas violetas escupieron fuego y envolvieron todo el techo. Primero cayó la pistola, y luego Aru tambaleó y se desplomó.\n\n‘¿No me digas que… murió…?’\n\nAlarmada, Hina agarró a Aru cuando estaba por rodar hacia el borde. ¡Shrrr! Ambas se deslizaron juntas por la pendiente del techo y cayeron al patio trasero de la mansión de Hina. Desde los brazos de Hina, Aru sonrió con descaro, como si nada, y dijo."
 HEU.flavor_event.94.a:0 "\"…¿Ves? Si quieres, todavía puedes hacerlo bien.\""

 HEU.flavor_event.95.t:0 "…Duelo"
 HEU.flavor_event.95.desc:0 "En este mundo, el misterio era más débil y era más fácil morir. Y aun así, Aru no murió. Tenía costillas rotas y moretones sangrientos por toda la parte superior del cuerpo, desde la cara hasta la cintura.\n\nAru yacía en la cama de Hina, mirando el techo sin expresión. ¿Qué excusa le pondría a los otros de la Agencia? ¿Que un guerrillero antigobierno la atacó?\n\nHina acercó una silla y se sentó a su lado.\n\n\"¿Qué demonios estabas planeando?\"\n\"Intento de suicidio. Un forajido que muere peleando contra un vaquero. ¿No suena jodidamente hardboiled?\"\n\"…¿Se te zafó un tornillo?\"\n\"Si lo quieres en términos médicos: tengo depresión, así que sí, estoy medio fuera de mí. Qué perspicaz, ex jefa del Comité.\"\n\n\"Mira… yo después de la Gran Transferencia intenté cambiar el mundo como fuera, hice de todo… y todo falló. La Agencia se deshizo en pedazos, y las personas que quise salvar me odian. Por eso quería verte. Porque eras la que más miedo me daba en Kivotos. Porque te creía una superhumana perfecta. …Pensé que me ibas a detener, que con una voz firme me ibas a decir cuál era el camino… yo sola te definí así, y yo sola deposité expectativas en ti.\"\n\n\"Yo… no soy fuerte. Como Hoshino, la vicepresidenta de Abydos…\"\n\"Lo sé. Tú no eres fuerte. Lo fuerte es tu habilidad de disparo. En realidad eres alguien débil: pierdes contra una agencia criminal, te desesperas porque el Comité se disuelve y te encierras en tu cuarto. Igual que yo, que gano y aun así me quejo.\"\n\nAru se obligó a incorporarse. Las costillas le dolían con un miedo casi físico. Pero quería mirar a Hina a los ojos. Hay sentimientos que solo pueden compartir dos idiotas con heridas parecidas, hundidos en la desesperación.\n\n\"Pero ser débil no es un pecado. Hina también es una persona normal, alguien que sufre como cualquier humana, no una superhumana… y aun así hasta ahora… has aguantado. Te esforzaste.\"\n\nY entonces Aru extendió una mano llena de moretones.\n\n\"Sé que no te va a alegrar que te lo diga una criminal de Gehenna, pero… Hina, gracias por haber protegido a Gehenna hasta hoy. Y a partir de ahora, hasta tu parte… yo la voy a cargar. Así que… el Comité… ya puedes descansar.\""
 HEU.flavor_event.95.a:0 "\"…Que alguien me felicite… de verdad, hace muchísimo que no lo oía.\""

 HEU.flavor_event.96.t:0 "…¿Duelo?"
 HEU.flavor_event.96.desc:0 "\"A… a, ¡Aru-sama! ¡S-sangre, debe e-evacuar…! ¡E-esto… es grave…!\"\n\nMientras Haruka irrumpía en la oficina del palacio ducal tartamudeando y entrando en pánico, Sorasaki Hina—con el abrigo de sus días como jefa del Comité—entró sosteniendo una enorme ametralladora violeta. En el pasillo se alcanzaba a ver, por un instante, a los guardias caídos en el suelo.\n\n¿Qué demonios era esto? ¿Un intento de asesinato? Aru se puso de pie, y Haruka y Kayoko se plantaron delante de ella. Kayoko habló con voz amenazante.\n\n\"Un paso más y te rompo el halo.\"\n\"…Ni siquiera he dicho una palabra.\"\n\"¿Y lo de afuera?\"\n\"Solo dije que quería ver a la jefa de la Agencia 68. Ustedes se me echaron encima primero, y yo solo los neutralicé. Ni más ni menos.\"\n\nDiciendo eso, Hina sacó un sobre de dentro del abrigo.\n\n\"Vine a entregar esto. ¿Puedes bajar el arma?\"\n\n¿Un sobre? Aru, con dudas, aun así dijo: \"Primero veamos qué es. No hay necesidad de pelear ahora, ¿no?\"\n\nHina cruzó entre las dos, que bajaron el arma, y dejó el sobre sobre el escritorio de Aru con un ¡tac! seco. Lo de dentro era… ¿una solicitud de empleo?\n\n\"…¿Eh?\"\n\"Por desgracia, como el Comité fue disuelto, me quedé sin trabajo. Vine a buscar una nueva actividad de club.\"\n\"¿U-una nueva actividad…? ¿Tú?\"\n\"¿Por qué? ¿Necesito certificados o boletas?\"\n\nOyendo esa frase medio en broma, Aru por fin entendió que lo que estaba ocurriendo no era un sueño ni una ilusión: era real. Irreal, difícil de creer… pero real."
 HEU.flavor_event.96.a:0 "\"…Empiezas como aprendiz. Mucho gusto, ex jefa del Comité.\""

 HEU.flavor_event.97.t:0 "Pesadilla"
 HEU.flavor_event.97.desc:0 "\"E-esto es un sueño. Una pesadilla. O sea que… alguien debió darme a escondidas una droga que causa alucinaciones. Esos demonios de la Agencia… no les bastó con disolver el Comité, y ahora a mí… ¿cómo…? Hi… ¡la jefa Hina…!\"\n\nAmau Ako—ex administradora principal del ya disuelto Comité, y ahora con uniforme de la División de Inteligencia del Pandemonium—empezó a temblar al ver a Hina vistiendo un uniforme con el logo de “Agencia 68”. Le temblaban las manos incluso más que a Aru, que era alcohólica… da hasta miedo.\n\nHina suspiró.\n\n\"Ako. Esto no es un sueño ni una alucinación. Como el Comité fue disuelto, solo busqué otro lugar al que ir. Eso es todo.\"\n\"¿Y ese *lugar* es la Agencia 68 que disolvió el Comité? ¡Son una organización criminal! ¡Terroristas! ¿C-cómo…? ¿Cómo puede la jefa Hina ser… una terro…rista…?\"\n\nComo si no pudiera creer la realidad, Ako agarró con fuerza los hombros de Hina.\n\n\"¡Kyogoku Satsuki! ¡Esto es cosa de esa mujer! ¡Seguro es por el Proyecto NK! ¡La jefa está siendo lavada del cerebro! Entonces…\"\n\"Ya no soy tu jefa, Ako. De verdad lo siento. …Y tampoco me han lavado el cerebro ni nada.\"\n\"N-no puede ser… yo… yo a la jefa Hina… siempre…\"\n\nLos ojos de Ako empezaron a llenarse de lágrimas, y, cubriéndose el rostro con el dorso de la mano, echó a correr y escapó. Sintiendo una mezcla de culpa y emociones complejas, Aru preguntó:\n\n\"¿No vas a ir tras ella?\"\n\"…Aunque la alcance, no tengo forma de consolarla.\""
 HEU.flavor_event.97.a:0 "\"Ako… algún día lo entenderá.\""

 HEU.flavor_event.98.t:0 "De verdad me gustaba…"
 HEU.flavor_event.98.desc:0 "Un pequeño paquete enviado directamente por Rikuhachima Aru llegó esta mañana a la casa de Amau Ako, ex administradora principal y ahora agente de la División de Inteligencia del Pandemonium. Aunque sintió un impulso fuerte de tirarlo a la basura, Ako lo abrió. Dentro había un USB pequeño. En el momento en que, con manos temblorosas, conectó el USB a la computadora…\n\nEn la pantalla apareció un video que mostraba a Hina en una situación extremadamente humillante y fuera de lugar, como si fuera una parodia cruel. Era tan grotesco e irreal que parecía hecho únicamente para destruir a quien lo viera.\n\n\"¡Aaaah! ¡No, no, NOOOOO!\"\n\n¡Crash! En cuanto Ako se incorporó, la cobija se volteó y su cuerpo rodó de la cama y cayó al suelo. …Era un sueño. Dios mío: gracias porque esto era un sueño. Ako, casi arrastrándose, fue al baño y se lavó la cara.\n\nPero al salir al pasillo, vio el rostro de Hina en la televisión que había olvidado apagar la noche anterior.\n\n- Bajo la jefa Aru, Gehenna prosperará aún más. Después de la Gran Transferencia, en medio de tanto caos, ella traerá orden a Gehenna, así que todas las estudiantes deben confiar en Aru-sama y volver a la normalidad de siempre…\n\nAjá… ¿Qué? ¿Sigo atrapada en la pesadilla? Aru-sama. “Ella”. Ako se rió al aire, y luego, mirando a una desconocida con el rostro de alguien a quien alguna vez admiró, quiso y amó… lloró como una niña."
 HEU.flavor_event.98.a:0 "No puedo aceptarlo. Esta realidad… no."

 HEU.flavor_event.99.t:0 "Cuesta creerlo, pero…"
 HEU.flavor_event.99.desc:0 "Kayoko, con una expresión llena de duda y desconfianza, observaba a Hina mientras ella llenaba documentos con rostro impasible. Kayoko, que conocía bien la relación entre Hina y la Agencia en los días de Kivotos, aún no podía aceptar esa “traición” de Hina. No… era más cercano a que simplemente no podía tragárselo.\n\nIgnorando esa mirada, Hina le devolvió a Kayoko un paquete de documentos cubiertos de letra apretada. Allí estaba escrita, en detalle, una lista de republicanos y miembros del Partido Comunista escondidos dentro de la División de Inteligencia de Luxemburgo.\n\n\"Parece que la jefa Aru y los militares escogieron personal a su manera, pero la investigación de antecedentes no quedó perfecta. Aún hay tantos espías dentro de Inteligencia que quieren matar a la jefa.\"\n\nKayoko le arrebató los documentos.\n\n\"…¿Es información confiable?\"\n\"Puedes verificarla si quieres. Solo re-investigué para proteger a la jefa.\"\n\nKayoko se quedó mirando los papeles durante largo rato… y luego los metió en un sobre.\n\n\"Lo revisaré. …Gracias.\"\n\nComo si no esperara escuchar un agradecimiento, Hina puso una cara de sorpresa por un instante… y luego sonrió otra vez."
 HEU.flavor_event.99.a:0 "\"No es nada.\""

 HEU.flavor_event.100.t:0 "Entrenamiento de combate"
 HEU.flavor_event.100.desc:0 "Mutsuki solo envió una nota breve que decía “Qué hueva”, y Aru—temblando por su discapacidad y su alcoholismo—vino incluso cargando un rifle de francotirador al oír “Hina misma va a entrenarte”, pero tras la insistencia de todos, tuvo que darse la vuelta y regresar. Aru todavía no quería aceptarlo, pero… su capacidad de combate personal ya habría caído por debajo incluso de un simple miembro de Helmet Gang.\n\nDespués de eso, lo único que quedó en el edificio abandonado fue Kayoko, Haruka, y Hina como instructora. Hina levantó, en lugar de su ametralladora… un arma antidisturbios cargada con balas de goma.\n\n\"El entrenamiento es sencillo. Vamos a enfrentarnos con balas de goma, sin riesgo de heridas. Ustedes dos me derriban y me someten, y se acaba el entrenamiento. Si no pueden, empezamos de nuevo.\"\n\nKayoko soltó una risa incrédula.\n\n\"¿Que Haruka y yo derrotemos a ‘esa’ jefa del Comité?\"\n\"…Es entrenamiento, así que no iré con todo. Lo importante es cómo usan el terreno de este edificio abandonado para inmovilizarme y tender una emboscada.\"\n\nHaruka tragó saliva.\n\n\"S-si es para proteger a Aru-sama… cualquier entrenamiento… estoy lista…\"\n\"Eso. Esa actitud es lo importante.\"\n\nHina, sin expresión, levantó el arma."
 HEU.flavor_event.100.a:0 "\"Les doy diez segundos. Tomen posición.\""
 HEU.flavor_event.101.t:0 "Traidora"
 HEU.flavor_event.101.desc:0 "\"De todos modos, el antiguo gobierno de Gehenna ya cayó. El Comité de Moral Pública que ustedes querían salvar también desapareció. Piensen con lógica. Si aún quieren proteger las buenas costumbres de Gehenna, si todavía les queda esa ‘justicia’, en vez de armar un motín como Helmet Gang… solo tienen que postularse a la Policía de Luxemburgo. Ya debió salir el anuncio de que los ex miembros del Comité reciben puntos extra, ¿no?\"\n\nAnte el rostro inexpresivo de Hina, vestida con el uniforme de la Agencia, Iori apretó los dientes y le apuntó con el cañón. La punta del arma se acercó hasta quedar a apenas unos centímetros de la cara de Hina.\n\n\"¡Yo…! ¡Jamás imaginé que tú traicionarías al Comité! ¡Y menos tú, Sorasaki Hina!\"\n\"¿Se puede ‘traicionar’ a una organización que ya no existe? El Comité fue disuelto y yo, *después* de eso, solo me uní a la Agencia como alguien sin afiliación. ¿Y ya con eso es traición?\"\n\"¡Cállate! ¡Sorasaki…! ¡Yo creía en ti… en tu sentido de justicia…!\"\n\nChinatsu, sin ocultar su mirada de desprecio hacia Hina, puso una mano sobre el hombro de Iori.\n\n\"Ya basta. No tenemos posibilidad de ganarle a ‘esta mujer’ en un enfrentamiento directo. Y además, los miembros del Comité atrincherados también están empezando a vacilar por lo que ella dice.\"\n\"…Maldita sea…\"\n\nIori arrojó su arma al suelo y se dio la vuelta.\n\n\"Al que quiera irse a la Policía de Luxemburgo… que se largue. …Se acabó el atrincheramiento.\"\n\"El hecho de que no apretaras el gatillo… fue una buena elección.\"\n\"Cállate, Sorasaki.\""
 HEU.flavor_event.101.a:0 "\"No vuelvas a aparecer frente a nosotras. Maldita traidora.\""

 HEU.flavor_event.102.t:0 "Hina se volvió parte de nuestra familia"
 HEU.flavor_event.102.desc:0 "Cuando Hina dijo por primera vez que se uniría a la Agencia, la única que le creyó fue Aru. Pero con el tiempo, la distancia entre Hina y el resto del personal empezó a acortarse. En otras palabras: la ‘temible jefa del Comité’ iba dejando de ser eso… y empezaba a mezclarse entre todos como una “compañera de la Agencia 68”.\n\n\"¡Hina-chan! ¿A quién quieres más: a mí, Hina-chan, o a Kayoko de allá?\"\n\"Mutsuki… ¿podrías dejar de molestar a Hina con preguntas tan tontas?\"\n\"Eeeh. ¿Todavía me dices ‘Mutsuki-san’?\"\n\"…Las dos están agotadoras.\" \n\nViendo a Mutsuki y Kayoko, cada una agarrando un brazo de Hina, Aru sintió que una sonrisa leve se le dibujaba en la boca. Haruka se acercó a Aru y dijo:\n\n\"Yo… pensaba que odiaba a todos los del Comité… pero esa persona es… como… distinta.\" \n\"¿Qué quieres decir, Haruka?\" \n\nAru sonrió apoyando la barbilla en la mano."
 HEU.flavor_event.102.a:0 "\"Hina es personal de la Agencia, no una miembro del Comité, ¿no?\""

 HEU.flavor_event.103.t:0 "Mi salvadora"
 HEU.flavor_event.103.desc:0 "Para Hina, la Aru de los días de Kivotos no era más que uno de tantos objetivos molestos a arrestar. Y ni siquiera de alto nivel: una criminal de ‘medalla de bronce’ en el orden de Kasumi > Haruna > Aru. Bueno, tampoco es que ser de medalla de oro fuera mejor.\n\nPero después de la Gran Transferencia, tras incontables penurias… y tras ver cómo su Comité era conquistado y forzado a disolverse… cuando Hina se derrumbaba, sintiendo que lo había perdido todo… la mano que se extendió hacia ella fue… la de esa “bronce” llamada Aru.\n\n- Ser débil no es un pecado. Hina también es una persona normal, alguien que sufre como cualquiera, no una superhumana… y aun así hasta ahora… has aguantado. Te esforzaste.\n\nElogio. Agradecimiento puro. “Has aguantado hasta hoy. Te has esforzado todo este tiempo.” Un “adulto” que le reconociera eso… para Hina, Aru fue la primera. Con una sonrisa tenue, Hina se puso el uniforme de la Agencia frente al espejo.\n\n‘Motivarme porque un criminal me reconoce… no suena a algo propio de mí.’\n\nPero… el rostro de Aru, extendiéndole la mano aquel día, no dejaba de volverle una y otra vez… y al final, Hina no pudo negar la verdad: se había enamorado de ella. El Comité ya no existía. Pero todavía quedaba alguien que la reconocía.\n\nSolo había un problema: Amau Ako, con quien aún no se había resuelto ese rencor mutuo."
 HEU.flavor_event.103.a:0 "\"…¿No habrá una forma de convencer a Ako?\""

 HEU.flavor_event.104.t:0 "Alguien como tú, de verdad—"
 HEU.flavor_event.104.desc:0 "<Jefa Hina>\nAko, soy yo.\n¿Nos vemos en el distrito central de Gehenna?\n\n“No me llames por mi nombre como si fuéramos cercanas, Sorasaki… perro de la Agencia.” …Eso fue lo que escribió en la respuesta. Pero al final, Ako no pudo presionar “Enviar”. Por mucho que todo hubiera cambiado, para Ako, Hina era algo más que una jefa y una subordinada.\n\n- Voy.\n\nTras ese mensaje corto, Ako se puso el uniforme de la División de Inteligencia del Pandemonium y salió. Gracias a sus cuernos característicos, no fue difícil encontrarla en el amplio distrito central. Ako miró de reojo a Hina, que seguía con el uniforme de la Agencia. Quería decir “¿por qué lo hiciste?”… pero al ver esa ropa, se le apretó el pecho y le salió otra cosa.\n\n\"Veo que te estás divirtiendo con tus actividades criminales, Hina.\" \n\"…Primero siéntate.\" \n\"Ja. ¿Y crees que voy a sentarme porque me lo ordene una criminal? Mejor me pongo a lamerle las botas a Makoto.\" \n\nDiciendo eso, Ako—con los brazos cruzados—se dejó caer con un *plaf* al lado de Hina.\n\n\"¿Qué? ¡Yo no me senté porque tú me lo dijiste! ¡Me senté porque me duelen las piernas, nada más! ¿Qué, esperabas algo? ¡Debería darte vergüenza!\" \n\"…Gracias por venir.\" \n\"¡Puéhng—!\" \n\nLas mejillas de Ako se encendieron al instante.\n\n\"…¿Qué es esto? ¿Coqueteo de repente? Alguien como tú, de verdad… de verdad…\" \n\nIba a soltar una cadena de insultos, pero terminó bajando la cabeza.\n\n\"…¿Por qué lo hiciste? ¿Tan horrible te parecía el Comité? ¿Yo fui insuficiente? Si te caía mal, ¡podías haberme dicho! ‘Administradora principal, estás despedida’. Si hubieras hecho eso… me habría dolido menos. Habría dolido menos… ¿Por qué sin decir nada…?\" \n\nHina tomó la mano de Ako, que ya estaba al borde del llanto."
 HEU.flavor_event.104.a:0 "\"…Ako. ¿Caminamos un momento?\""

 HEU.flavor_event.105.t:0 "—De verdad me gusta"
 HEU.flavor_event.105.desc:0 "Mientras caminaban por el distrito central de Gehenna, Hina le contó muchas cosas a Ako. La desesperación que sintió cuando el Comité colapsó tras la Gran Transferencia y creyó que todo su esfuerzo se convirtió en nada. El gesto de Aru, cuando le extendió la mano en medio de eso. Y que ahora, cuando ya no era jefa del Comité, lo que le permitió aguantar esa desesperación… fue precisamente Rikuhachima Aru.\n\n\"…Y lo que dices es que ahora… la jefa… se enamoró de esa mujer, ¿no?\" \n\"…\" \n\"Haaaaaa…\" \n\nAko levantó la cara al cielo y soltó un suspiro profundo. “Yo era la que de verdad la quería.” Pero ella, en el momento en que Hina más sufría, no se dio cuenta de nada… y no pudo hacer nada.\n\nLa sensación de traición, la ira… todo volvió como culpa hacia ella misma. Ako apretó un poco la mano que sostenía la de Hina.\n\n\"Está bien. …Aunque los demás ex miembros del Comité te nieguen, yo sí voy a afirmarte. Aunque cien, mil, aunque toda Gehenna te niegue… yo creo que tú, jefa Hina, no eres una traidora de Gehenna.\" \n\"Ako, yo…\" \n\n\"—Así que ven a visitarme cuando quieras a la Inteligencia del Pandemonium. Como ya cambiaron a todos esos ‘mapaches’ por simples selladores al servicio de Aru, ya no hay maniobras raras y es un lugar tranquilo. Te estaré esperando cuando sea.\"\n\"¿Me estás perdonando? ¿Incluso si traicioné al Comité?\" \n\"¿Y qué más queda? Aunque el Comité ya no exista, yo soy tu administradora principal para siempre…\""
 HEU.flavor_event.105.a:0 "\"Si tú quieres a Aru… entonces yo también te quiero a ti—\""

 HEU.flavor_event.106.t:0 "Esto es carisma"
 HEU.flavor_event.106.desc:0 "\"¡Kihihit! ¡Mírenlo! ¡El Pandemonium parecía derrotado y aun así obtuvo la victoria a la vez! ¡Esta es una gran victoria que solo yo, Hanuma Makoto-sama, puedo lograr!\" \n\nLa carta de nombramiento de Rikuhachima Aru como Presidenta del Pandemonium. Makoto la sostuvo con ambas manos y se la plantó enfrente a Iroha, que tenía cara de fastidio, presumiendo.\n\n\"¡Ese tal Aru tiene un talento increíble para reconocer a los grandes líderes! Darme la mitad del mundo sería demasiado, pero… ¿qué tal algo como ‘más que un cuarto, menos que la mitad’? ¡Kihihit!\" \n\"Ah… sí. Ya veo.\" \n\nAunque se convirtió en un simple “sellador” sin poder de una Aru que ya no tenía poder real, ¿cómo podía alegrarse así, sin pensarlo? Iroha, honestamente, envidiaba la inocencia de Makoto. Si no piensas… tampoco sufres la política."
 HEU.flavor_event.106.a:0 "\"…Quiero hacerme la pendeja y faltar.\""

 HEU.flavor_event.107.t:0 "Los resultados de NK-Ultra"
 HEU.flavor_event.107.desc:0 "\"Yo, Kyogoku Satsuki, soy la existencia más adecuada para liderar la nueva Gehenna. Aru debió juzgarlo así también.\" \n\nSentada con los brazos cruzados, Satsuki dijo eso con aire engreído.\n\n\"Aún no le he aplicado el proyecto NK-Ultra a Aru… ¿habrá funcionado la hipnosis sin que yo me diera cuenta?\" \n\nIroha respondió con desgana:\n\n\"No lo creo, presidenta.\" \n\"Jeje. Eso no lo sabes. Puede que Aru ya sea mi marioneta… ¿no? Que todo esto sea obra de mi NK-Ultra…\" \n\nDejando pasar el monólogo de Satsuki por un oído, Iroha suspiró."
 HEU.flavor_event.107.a:0 "\"…Quiero hacerme la pendeja y faltar.\""

 HEU.flavor_event.108.t:0 "No me dejes atrás"
 HEU.flavor_event.108.desc:0 "Mientras la guerra con Trinity estaba en marcha, Hina, como era natural, combatía en la primera línea contra las fuerzas trinitarias. Se decía que había sometido por sí sola a varias estudiantes del Departamento de Justicia en combate urbano, o que había izado personalmente la bandera de Luxemburgo en el viejo edificio de Tea Party en Eden. Precisamente por eso, cuando ocurrió el incidente del suicidio por envenenamiento de Aru… Hina estaba en el lugar más lejano.\n\n\"Haah… haah… ¡Aru! ¡Aru!\" \n\nIgnorando a la enfermera que decía que no era hora de visita, Hina irrumpió casi arrancando la puerta de la habitación y se lanzó hacia Aru, que yacía en la cama. Sin decir “hola”, sin decir “perdón”… antes de poder decir nada… Hina se aferró a Aru y rompió a llorar.\n\n\"¿Por qué hiciste eso…? ¿Por qué…?\" \n\"Perdón, Hina… yo…\" \n\"No lo hagas otra vez. No me dejes atrás. …¡Por tu culpa, yo pude abandonar la idea de abandonarlo todo…!\""
 HEU.flavor_event.108.a:0 "Aru tuvo que consolar a Hina durante un buen rato."

 HEU.flavor_event.109.t:0 "¿Tea Party?"
 HEU.flavor_event.109.desc:0 "Después del golpe de Luxemburgo de Asagi Mutsuki, el nuevo gobierno adoptó el nombre de “Tea Party”, y la primera en protestar fue Trinity. Mutsuki podía imaginar la razón: que una estudiante de Gehenna usara el término “Tea Party” en sí mismo era una ofensa para Trinity. Pero ni ella esperaba que *esa* Misono Mika llamara directamente.\n\n\"Ahaha… esto qué es… ¿un tipo de sentido del humor muy ‘de cuernos’? Si era un chiste, estuvo buenísimo☆ Sí. Tan bueno que dan ganas de enojarse.\" \n\nLa verdad, Mutsuki no pensó que Mika estuviera tan seriamente furiosa. …Y eso le dio ganas de bromear. A Mutsuki siempre le gustaron esas bromas en estos momentos, ¿no?\n\n\"Hmm. ¿Chiste? No sé de qué hablas.\" \n\"¡El cargo de ‘Host’ del Tea Party! ¿Crees que Gehenna puede mencionarlo a su antojo?\" \n\"¿‘Ustedes’ Gehenna…? Ah, entonces todavía no lo sabes.\" \n\"…¿Qué?\" \n\nY con un tono de burla, como pinchándola:\n\n\"Ufufu. Verás… en realidad, yo era una agente de inteligencia enviada por la host anterior para sacarle información a Gehenna. ¿Eh? ¿No me digas que hiciste el golpe y encerraste a la host anterior sin enterarte de nada?\" \n\"¿Eh? ¿Eh? Espera. ¿Trinity? ¿Espía? No… eso no puede…\" \n\"¿Desde cuándo tengo cuernos? ¿O alas de demonio? Nunca lo has visto, ¿verdad? ¿Y aun así me creíste de Gehenna? Ahaha. ¿Qué, no te dijeron nada?\" \n\"N-no… ¡aunque intentes engañarme no sirve! ¡Si Nagi-chan hubiera metido una espía así, a mí que soy su mejor amiga me habría dicho… seguro…\" \n\nAl decir “mejor amiga”, la voz de Mika se apagó. Ella sabría qué le hizo a la “host anterior”. ¿De verdad Mika fue amiga de esa persona? ¿Esa persona la veía igual? Mientras Mika se enredaba, Mutsuki se tapó el auricular con la mano y soltó una risita ahogada.\n\n\"S-si no me crees, ¿por qué no vas a preguntarle a la host anterior? ‘¿Metiste una espía en Gehenna?’ Pero quizá te responda algo como: ‘Misono-san. No me hable.’\" \n\"…E-eh… bueno… ahaha☆… oye… si, si de verdad fueras una espía de Nagi-chan… ¿podrías… o sea… darme un consejo sobre Nagi-chan…?\""
 HEU.flavor_event.109.a:0 "Clic. Mutsuki colgó y estalló en una carcajada."

 HEU.flavor_event.110.t:0 "Tratamiento hospitalario de Guillermo II"
 HEU.flavor_event.110.desc:0 "El estado del ex emperador alemán Guillermo II, hospitalizado en Luxemburgo por una embolia, se ha agravado de forma crítica. Sin la avanzada tecnología médica de Gehenna tras la Gran Transferencia, habría sido imposible tratarlo con la medicina local; sin embargo, gracias al esfuerzo del personal médico, se superó la fase crítica de la embolia. Aun así, debido al deterioro de la función pulmonar, el dictamen indica que ya no podrá continuar con la actividad maderera.\n\nDe manera desconcertante, Guillermo II solicitó al gobierno de Luxemburgo que cubra los gastos médicos alegando que no tiene dinero. La decisión final recae en [ROOT.GetLeader], pero nadie se alegrará de invertir presupuesto en un emperador anciano."
 HEU.flavor_event.110.a:0 "¿Cuánto puede costar?"
 HEU.flavor_event.110.b:0 "¿Pero vale la pena gastarlo en ese viejo?"

#플레이버 이벤트 끝 }}
#{{ 페르소나 이벤트 시작
 #지혜 20
 HEU.persona_event.1.t:0 "Estudio teórico - 1"
 HEU.persona_event.1.desc:0 "\"Mmm...\"\n\nEn la oficina de la Agencia, Aru giraba un bolígrafo entre los dedos. Kayoko, que acababa de entrar, ladeó la cabeza al verla.\n\n\"¿Qué haces, jefa?\"\n\"Ah… es que ya pasé de administración a economía, y salen más fórmulas de matemáticas de las que esperaba…\"\n\nAru soltó un “ajaja” y sonrió con incomodidad.\n\n\"Ahora hay más gente a la que tengo que proteger que antes… así que quería esforzarme más, pero no es tan fácil.\" \n\"No tienes que forzarte tanto. No hace falta que cargues tú sola con todo el trabajo.\" \n\"Sí, pero… por lo menos no quiero ser una jefa que le estorba a los demás.\" \n\nKayoko la miró un instante con expresión sorprendida… y luego sonrió apenas.\n\n\"Nadie piensa que seas una carga. Aun así… espero que te vaya bien con ese esfuerzo.\""
 HEU.persona_event.1.a:0 "\"Sí. …Me voy a esforzar.\""

 #Sabiduría 40
 HEU.persona_event.2.t:0 "Estudio teórico - 2"
 HEU.persona_event.2.desc:0 "¡Clic! Mutsuki abrió la puerta de la oficina y levantó su mochila con energía.\n\n\"¡Aru-chan! Hoy vamos a jugar un montón con juguetes—… ¿eh? Oye, ¿y tú quién eres?\" \n\nAru, con traje y lentes semi al aire, sonrió mientras se los acomodaba hacia arriba con un gesto.\n\n\"Oh, Mutsuki. Llegaste justo a tiempo. Por fin he comprendido la verdad de todas las cosas y me he convertido en una auténtica intelectual… ¡porque he devorado por completo los libros de psicología analítica de Jung!\" \n\n\"Wow… creo que es la primera vez que Aru-chan me deja genuinamente confundida.\" \n\"¡¿Qué es esa reacción tan tibia?! ¡Además, mira! ¡Lentes, lentes! ¡Me puse lentes, esos que a ti te gustan!\" \n\"Pero los lentes y la psicología analítica no tienen mucho que ver, ¿no?\" \n\"¡Como sea! ¡Los intelectuales siempre usan lentes! Como esa rubia parlanchina de Millennium…\" \n\nMutsuki se quedó un rato mirándola, en blanco… y al final soltó una risita.\n\n\"Bueno, como sea, ya entendí que Aru-chan quiere presumir que estudió un montón. Y a-ver, y a-ver…\" \n\nDe un saltito, Mutsuki se acercó y le levantó un poquito los lentes a Aru.\n\n\"Aru-chan… te quedan muy bien.\""
 HEU.persona_event.2.a:0 "\"Ajaja… gracias.\""

 ### Eventos aleatorios de la Agencia ###

 ## Haruka ##
 HEU.persona_event.100.t:0 "El día a día en la Agencia"
 HEU.persona_event.100.desc:0 "\"Ugh… ugh… me voy a morir.\" \n\nHaruka se metió el cañón de su escopeta Blow Away directo en la boca. Tenía los ojos vidriosos, a punto de llorar. No es que normalmente no dijera cosas como “me voy a morir”, pero hoy estaba peor que de costumbre.\n\n¿La razón? Rompió una pieza de cerámica mientras limpiaba la oficina.\n\nAru se levantó de golpe, nerviosa, y se quedó a cierta distancia de Haruka.\n\n\"Espera. …Haruka, primero tranquilízate.\" \n\"¿Para qué vivir si ni siquiera puedo limpiar bien…? Solo soy una molestia para Aru-sama… así que mejor me muero…\" \n\nNo era la primera vez que pasaba, pero había que convencer a Haruka de bajar el arma. Aru se acercó lentamente."
 HEU.persona_event.100.a:0 "\"Para mí, Haruka es más importante que cualquier cerámica\""
 HEU.persona_event.100.b:0 "\"Ni siquiera era tan caro, no tienes por qué sentirte culpable\""

 HEU.persona_event.101.t:0 "El estudio de Haruka"
 HEU.persona_event.101.desc.a:0 "\"¿Sustantivo masculino… femenino… neutro…? ¡¿Por qué el alemán tiene que ser tan complicado?!\" \n\nMientras estudiaba gramática alemana, Haruka se agarró la cabeza. A su manera, se estaba esforzando por adaptarse: leía periódicos de Luxemburgo y todo… pero aunque la conversación cotidiana le salía, la parte de redacción seguía sin mejorar, incluso después de años.\n\nAru se sentó a su lado, junto al libro de gramática. En el texto había notas de Haruka por todas partes, y un montón de frases subrayadas."
 #Hasta el 31 de diciembre de 1939
 HEU.persona_event.101.desc.b:0 "\"He estudiado durante años, pero siento que todavía no estoy al nivel de leer artículos académicos… ¿será que es porque soy insuficiente?\" \n\nHaruka se agarró la cabeza mientras leía un artículo académico en alemán. Para ayudar a Aru, había pasado años estudiando gramática y leyendo distintos libros en alemán. Al parecer, ya tenía suficiente base como para leer artículos de germanística… pero aún quedaban oraciones que se le hacían cuesta arriba.\n\nAru miró el artículo que Haruka estaba leyendo. Estaba lleno de anotaciones y líneas subrayadas."
 #Desde el 1 de enero de 1940
 HEU.persona_event.101.a:0 "Yo te enseño un poco; leámoslo juntas"
 HEU.persona_event.101.b:0 "¿Qué tal si vas con Kayoko? Es lista, seguro te explica bien"

 HEU.persona_event.102.t:0 "Hacerle llegar mi agradecimiento"
 HEU.persona_event.102.desc:0 "\"Aru-sama… de verdad últimamente se ha esforzado muchísimo todos los días.\" \n\nHoy Haruka llegó a la Agencia 68 con un set de regalos. Dijo que eran suplementos para la salud… y por el puro rastro de la etiqueta de precio que había rascado con la mano, se notaba que había gastado bastante.\n\nAru tomó el set sonriendo. Le daba gusto… pero también le pesaba que Haruka hubiera gastado tanto.\n\n\"Aru-sama… tiene que estar sana y vivir mucho, mucho tiempo.\""
 HEU.persona_event.102.a:0 "Gracias, Haruka"

 HEU.persona_event.103.t:0 "La noche en la Agencia"
 HEU.persona_event.103.desc:0 "\"Q-que yo salga así con Aru-sama… de verdad… me da mucha pena…\" \n\nEsta noche, Aru cenaría con Haruka. El lugar: un pequeño puesto callejero en el centro.\n\nEn el Luxemburgo de antes de la Gran Transferencia no existía esa cultura de puestos, pero a medida que la población proveniente de Kivotos fue llegando, empezaron a aparecer uno tras otro.\n\nAntes, simplemente no tenían dinero para ir a restaurantes caros; pero desde que se convirtió en regente de Luxemburgo, Aru a veces visitaba estos puestos para revivir recuerdos de Kivotos.\n\n\"Fufu… venir así, solo las dos, a comer ramen… es una pequeña felicidad.\" \n\nCon una sonrisa radiante, Haruka recibió su tazón de ramen. Después de la Gran Transferencia, todo cambió… pero la felicidad de compartir tiempo con alguien importante: eso, sentía, no había cambiado."
 HEU.persona_event.103.a:0 "Ahora sí puedo invitar ramen con la frente en alto"

 HEU.persona_event.104.t:0 "La desgracia de Haruka"
 HEU.persona_event.104.desc:0 "\"Yo solo… quiero pasar de largo.\" \n\"¡El único lugar por el que ustedes, los de Kivotos, pueden ‘pasar’ es por el fuego del crematorio!\" \n\nHaruka no volvía de un mandado de trabajo, así que Aru salió un poco del palacio.\n\nNo tardó en ver a dos locales borrachos bloqueándole el paso a Haruka y buscándole pleito. En fuerza bruta, Haruka podría tumbar a los dos y seguir caminando… pero parecía aguantar, encogida, dejando que descargaran su ira, porque pensaba que chocar con locales solo le traería problemas a Aru.\n\nHaruka no debería perder contra dos tipos así, pero… nunca se sabe qué podría pasar. ¿Sería mejor ayudarla ahora?"
 HEU.persona_event.104.a:0 "\"…¡Oigan! ¡Si no se alejan de Haruka ahora mismo, les reviento las muñecas!\""
 HEU.persona_event.104.b:0 "…Llamemos a la policía de Luxemburgo y ordenemos que ayuden a Haruka"

 HEU.persona_event.105.t:0 "Consulta de preocupaciones"
 HEU.persona_event.105.desc:0 "\"Aru-sama… hay algo que quisiera hablar con usted…\" \n\nUna tarde, Haruka llegó a pedirle a Aru un consejo sobre asuntos personales. Parecía querer hablar de los problemas que le nacían por su personalidad de baja autoestima.\n\nNo existe una frase mágica que cambie el carácter de Haruka de golpe, pero… con solo escucharla durante mucho tiempo y acompañarla, Aru podría aliviarla aunque sea un poco.\n\nPor supuesto, después de escucharla, también haría falta darle algún consejo."
 HEU.persona_event.105.a:0 "¿Qué tal si pruebas hacer ejercicio? Algo en equipo, como béisbol"
 HEU.persona_event.105.b:0 "Leamos libros de motivación. Yo te recomiendo algunos"

 HEU.persona_event.106.t:0 "Cultivar maleza"
 HEU.persona_event.106.desc:0 "\"Ehehe… creo que ver cómo crece es algo realmente bonito.\" \n\nHoy, la maleza que Haruka cultivaba creció preciosa y hasta floreció.\n\nLa trasplantaron de una maceta pequeña a una más grande, y decidieron ponerla en un rincón de la oficina para que Haruka siguiera cuidándola.\n\nEs solo una plantita… pero gracias a ella, la oficina se siente un poco más viva. Seguro es gracias al esfuerzo de Haruka, que se esmeró para que creciera con fuerza."
 HEU.persona_event.106.a:0 "Si a Haruka le gusta, entonces..."
 ## 카요코 ##
 HEU.persona_event.107.t:0 "Consulta de preocupaciones"
 HEU.persona_event.107.desc:0 "\"Sé que entre los locales de Luxemburgo hay mucha gente a la que no le caen bien los transferidos de Kivotos. Pero yo… siento que, en mi caso, se me pegan demasiados enemigos…\" \n\nUna consulta de Kayoko. El tema era simple: por su apariencia intimidante, los locales con tendencias anti-Kivotos suelen buscarle pleito con frecuencia.\n\nLa verdad es que Kayoko tiene una mirada fuerte, así que parece que hay gente que, con solo verla caminar, ya siente que los está amenazando.\n\nNo se puede “cambiarle la cara” a Kayoko, pero… ¿como jefa de la Agencia, no podría darle хотя sea un consejo pequeño?"
 HEU.persona_event.107.a:0 "\"¿Y si pruebas usar mascarilla? Si se te cubre media cara, quizá te veas menos intimidante.\""
 HEU.persona_event.107.b:0 "\"¿Qué tal practicar sonreír? Tal vez el problema sea la expresión.\""
 HEU.persona_event.107.c:0 "\"El problema es la gente que le tiene miedo a Kayoko; no creo que Kayoko sea el problema.\""

 HEU.persona_event.108.t:0 "La noche en la Agencia"
 HEU.persona_event.108.desc:0 "\"Siento que la jefa no ha cambiado tanto, ni en Kivotos ni aquí. Sigues siendo trabajadora… y también sigues cuidando a los tuyos.\" \n\nDespués de resolver con Kayoko las tareas menores que se alargaron hasta tarde, Aru se detuvo con ella en un puesto callejero de camino a casa.\n\nMirando la noche de luna alta, Kayoko parecía estar recordando la rutina de la Agencia antes de la Gran Transferencia.\n\nAunque desde entonces muchas cosas cambiaron, Aru pensó que el calor de cenar con una amiga valiosa… eso sí no había cambiado.\n\n\"Está bien que ahora puedas pagar el ramen con toda tranquilidad, ¿no?\" dijo Kayoko en tono de broma, con la barbilla apoyada en la mano.\n\nAru solo se echó a reír."
 HEU.persona_event.108.a:0 "\"Sí. ¡Ahora incluso puedo pedir extra chāshū sin remordimientos!\""

 HEU.persona_event.109.t:0 "El regalo de Kayoko"
 HEU.persona_event.109.desc:0 "\"Jefa, desde la Gran Transferencia tu trabajo se multiplicó… y últimamente ni siquiera has descansado bien, ¿no?\" \n\nHoy, Kayoko compró un set de suplementos para Aru.\n\nCuando eran solo una pequeña agencia, el trabajo no se compara con la carga de ser también “la regente de Luxemburgo”, tal y como decía Kayoko.\n\nAru agradeció y recibió la caja de regalo: era bastante pesada.\n\nNo solo por el peso de los frascos… sino también porque, quizá, dentro iba el propio cariño de Kayoko por Aru."
 HEU.persona_event.109.a:0 "\"Fufu… recibir regalos así… de verdad soy una jefa muy feliz\""

 HEU.persona_event.110.t:0 "Gato"
 HEU.persona_event.110.desc:0 "\"¡Ay mi brazo! ¡Ay mi pierna!\" \n\"¡¿Esto no debería compensarlo el Estado?!\" \n\nDos hombres, con férulas y vendajes en brazos y piernas, estaban protestando frente al palacio ducal de Luxemburgo.\n\nAru los hizo pasar para entender la situación.\n\nSu historia fue simple: iban camino a casa, vieron un gato en la calle y, “de broma”, le dieron una patada.\n\nEntonces, Kayoko los vio, los persiguió con cara aterradora… y a puño limpio los dejó medio muertos.\n\n\"¿No es culpa de ellos desde el inicio, por molestar a un gato que no estaba haciendo nada? Ni entiendo qué hacen viniendo aquí como si hubieran hecho algo bien.\" \n\nKayoko no cedía ni un milímetro: insistía en que no le daba vergüenza haberlos golpeado.\n\nAl final, a quien le tocaba mediar con este desastre… era a Aru."
 HEU.persona_event.110.a:0 "\"¡Los gatos también son vida! ¡¿Cómo que patearlo?! ¡No van a recibir ninguna compensación!\""
 HEU.persona_event.110.b:0 "\"Aunque hayan hecho mal… esta vez Kayoko se pasó… Pidamos disculpas y cubramos los gastos médicos\""

 HEU.persona_event.111.t:0 "En la calle"
 HEU.persona_event.111.desc:0 "\"Miau… eso es, no huyas…\" \n\nDe regreso a casa, Aru encontró a Kayoko en un callejón, dándoles comida a unos gatos.\n\nKayoko suele asustar a la gente por su expresión dura… pero esa sonrisa amable que ponía frente a animales pequeños no tenía nada de aterradora.\n\nEso significaba, claro, que Kayoko también tenía un corazón cálido que ama la vida.\n\nAru la miró con ternura, jugando con los gatos… y siguió su camino a casa."
 HEU.persona_event.111.a:0 "\"Fue un camino a casa… diferente\""

 HEU.persona_event.112.t:0 "Odio la música local"
 HEU.persona_event.112.desc:0 "\"En Luxemburgo es demasiado difícil encontrar rock decente\" \n\nAru sabía bien que la cultura de la Tierra y la de Kivotos eran distintas.\n\nPero quien más sufría por eso… parecía ser Kayoko.\n\nAunque, por influencia de Kivotos, habían empezado a aparecer uno que otro músico local intentando hacer rock de manera torpe… todavía no existía ningún artista lo bastante bueno como para satisfacer a una fan del rock como Kayoko.\n\nCon el tiempo, seguro nacería alguna banda local que la dejara conforme… pero, al menos por ahora, si quería tocarle música “como se debe”, haría falta el esfuerzo de Aru."
 HEU.persona_event.112.a:0 "\"¿No podríamos conseguir discos de músicos de Kivotos?\""
 HEU.persona_event.112.b:0 "\"…¿Y si entrenamos a la banda militar para que practique rock del gusto de Kayoko?\""

 HEU.persona_event.113.t:0 "¿Las plantas también escuchan música?"
 HEU.persona_event.113.desc:0 "\"Jefa… últimamente Haruka parece estar pensando qué canciones serían buenas para ponerle a sus plantas…\" \n\nAunque por su apariencia afilada Kayoko suele llevarse mal con los locales, con los miembros de la Agencia 68 mantiene una relación cercana.\n\nHoy le preguntaron si podía ayudar a elegir canciones para ponerles a las plantas que cría Haruka.\n\nNo es que Aru sea una experta en música… pero quizá sí pueda dar хотя sea un consejo."
 HEU.persona_event.113.a:0 "\"¿Qué tal música clásica? Me suena a una opción segura\""
 HEU.persona_event.113.b:0 "\"¿Y si ponemos rock del que escucha Kayoko? Igual y, sorprendentemente, les gusta\""

 ## 무츠키 ##
 HEU.persona_event.114.t:0 "Una pequeña travesura"
 HEU.persona_event.114.desc:0 "\"¡Aru-chan! ¿Otra vez papeleo? …Si solo trabajas todos los días te vas a cansar, ¿sabes? ¿Qué tal si hoy descansas y jugamos un juego de mesa?\" \n\n¿Será que Mutsuki notó que Aru llevaba días sin descansar, revisando documentos sobre presupuesto?\n\nMutsuki llegó con la mochila llena de juguetes y juegos de mesa, proponiéndole a Aru que se tomara un respiro.\n\nClaro que Aru quería descansar… pero la responsabilidad que le quedaba dentro le impedía responder de inmediato con un “¡vamos a jugar!”\n\nComo si entendiera esa duda, Mutsuki insistió:\n\n\"Sé que Aru-chan se esfuerza por Luxemburgo, pero si trabajas sin parar te vas a desplomar. ¿Sabes? A veces, divertirse también es ‘hacerlo por la gente’.\""
 HEU.persona_event.114.a:0 "\"Sí… ¡hoy sí toca jugar!\""
 HEU.persona_event.114.b:0 "\"…Lo siento, pero hay burócratas esperando mis documentos…\""

 HEU.persona_event.115.t:0 "Aburrimiento"
 HEU.persona_event.115.desc:0 "\"Aquí, comparado con Kivotos… es como que todo es aburrido. ¿No faltan entretenimientos?\" \n\nAru se preguntó por qué Mutsuki decía eso… hasta que lo soltó: hoy quería mandar al diablo el trabajo e irse de picnic.\n\nEn Luxemburgo, donde incluso pasear puede sentirse “sin juguetes”, caminar era considerado una forma de descanso.\n\nPor suerte, no era un día con demasiada carga, así que Aru decidió salir del palacio con Mutsuki.\n\n\"¿A dónde quieres ir, Aru-chan? ¿Algún lugar que te apetezca?\" \n\"¿A dónde quiero ir…? Mmm…\""
 HEU.persona_event.115.a:0 "\"¿Qué tal si damos una vuelta por el centro?\""
 HEU.persona_event.115.b:0 "\"Vámonos en bici al bosque de las afueras\""

 HEU.persona_event.116.t:0 "Una travesura algo peligrosa"
 HEU.persona_event.116.desc:0 "\"Oye, Mutsuki… es que los locales andan preocupados porque dicen que en esa mochila que cargas diario… seguro traes una bomba…\" \n\nAru se rascó la mejilla, incómoda.\n\nNo había pruebas claras, pero parece que algunos residentes denunciaron a la policía que una chica que siempre anda con una mochila enorme se ve “sospechosa”.\n\nEl problema era que… dentro sí había explosivos, como minas.\n\nEn Kivotos, portar armas todo el tiempo era normal; pero en este mundo no lo era.\n\nPor más que pasara el tiempo, esto era difícil de normalizar.\n\nMutsuki, con gesto un poco ofendido, preguntó:\n\n\"Entonces, ¿qué piensas, Aru-chan? ¿La tiro?\""
 HEU.persona_event.116.a:0 "\"No. Con que no amenaces a la gente, basta\""
 HEU.persona_event.116.b:0 "\"Mejor… evita llevar esa mochila al centro de la ciudad\""

 HEU.persona_event.117.t:0 "¿Qué snacks le gustan a Mutsuki?"
 HEU.persona_event.117.desc:0 "\"¿Así que Aru-chan también tiene este lado? Fufu… me sorprendes.\" \n\nUn día en que el trabajo de regente y jefa de la Agencia terminó un poco temprano, Aru fue con Mutsuki a un pequeño café del centro.\n\nEra un lugar famoso por su buen café y sus postres—especialmente los waffles con crema, populares tanto entre los locales como entre la gente de Kivotos.\n\nAru dio un sorbito confiado y dijo:\n\n\"Si eres una jefa hardboiled, tampoco puedes olvidar sacar tiempo para tus empleados.\" \n\"Fufu… dejando de lado lo de hardboiled, lo de jefa, todo eso… simplemente… me gusta salir contigo, Aru-chan.\" \n\"E-espera… qué vergüenza…\""
 HEU.persona_event.117.a:0 "Fue un día corto… pero tranquilo"

 HEU.persona_event.118.t:0 "¡Ajajá, suena como palomitas!"
 HEU.persona_event.118.desc:0 "¡CRAAASH!\n\nUn estruendo como si un terremoto hubiera sacudido toda la ciudad de Luxemburgo.\n\n¿Cayó un bombardeo?\n\nNo. Solo que Mutsuki hizo estallar un explosivo casero en su casa.\n\nEn Kivotos no habría sido más que un alboroto, pero en Luxemburgo… fue un caos absoluto.\n\nY Mutsuki tampoco salió ilesa: la explosión tan cerca le fisuró un hueso del dedo.\n\nPor suerte no le quedaría una secuela permanente, pero por un tiempo no podría ni usar palillos.\n\n\"Ajajá… Aru-chan, ¿viniste hasta mi casa porque estabas preocupada? Eso no suena muy hardboiled… Estoy bien. O sea, aparte de la ventana rota, estoy perfecta, ¿sabes? Ajajá.\" \n\nNo parecía que solo la ventana estuviera rota, pero Mutsuki intentó calmar a Aru como si nada.\n\nAru se sentó a su lado, frente a ella.\n\nSentía alivio porque no fue algo grave… y también enojo por haberla preocupado.\n\nEn la Tierra, el misterio es más tenue que en Kivotos.\n\nSeguimos teniendo halo y somos más fuertes que los locales… pero nos hemos vuelto lo bastante frágiles como para fracturarnos en accidentes así.\n\nMirándola, Aru habló con sinceridad."
 HEU.persona_event.118.a:0 "Mutsuki… gracias por no haberte lastimado peor"
 HEU.persona_event.118.b:0 "Me dio miedo… por favor, no vuelvas a hacer algo tan peligroso…"

 HEU.persona_event.119.t:0 "Tiempo que paso con Aru"
 HEU.persona_event.119.desc:0 "\"Aru-chan… estoy cansada. Acaríciame.\" \n\nDe la nada, Mutsuki apareció en la oficina y se dejó caer en el sofá como un gato.\n\nNo… ¿esto también es algún tipo de prueba para volverse hardboiled?\n\nAru estaba tan desconcertada que no sabía ni cómo reaccionar.\n\nMutsuki entreabrió los ojos y giró la cabeza lentamente.\n\n\"¿No será que me odias, Aru-chan? …¿Y por eso te da asco incluso estirar la mano para acariciarme?\" \n\"¡N-no! ¡No es eso! ¡Jamás!\" \n\nAru no entendía por qué Mutsuki estaba así, pero por lo pronto la dejó apoyar la cabeza en su regazo, y le acarició el cabello con calma.\n\n¿Cuánto tiempo pasó?\n\nMutsuki terminó quedándose dormida en sus piernas.\n\nY, ya dormida, murmuró como si hablara en sueños:\n\n\"…Kivotos… mi hogar… mi casa… extraño todo…\" \n\n¿Nostalgia?\n\nQuizá en un mundo tan distinto como Luxemburgo, Mutsuki estaba sintiendo añoranza.\n\nAru siempre pensó que Mutsuki era fuerte… pero tal vez, justamente por ser fuerte, no podía decir ese dolor en voz alta."
 HEU.persona_event.119.a:0 "Por hoy… descansa tranquila, Mutsuki"

 HEU.persona_event.120.t:0 "¿Aru-chan, te gusta esto?"
 HEU.persona_event.120.desc:0 "\"¡Tarán! ¡Un regalo hardboiled para nuestra hardboiled forajida Aru-chan!\" \n\nMutsuki irrumpió de golpe y le puso en la mano… una cajetilla.\n\n…¿Una cajetilla?\n\n\"No, es que… yo fumar, la verdad…\" \n\"Ajajá. Aru-chan, ¿creíste que de verdad traje cigarrillos? ¿Porque quería mandarte a tener cáncer de pulmón?\" \n\"¿Eh? ¿Eeeh? ¿No son cigarros?\" \n\n¡Clic! Mutsuki abrió el empaque.\n\nDentro había… chocolates con forma idéntica a un cigarrillo.\n\n\"Son cigarros de chocolate. …Si te los pones en la boca y te tomas una foto, ¿no te verías más hardboiled? Fufu. No está mal, ¿no?\" \n\nChocolate…\n\nAru, por fin entendiendo, sacó uno y se lo puso en la boca.\n\nDel “cigarro” salía un sabor dulce… con un toque hardboiled."
 HEU.persona_event.120.a:0 "Gracias, Mutsuki"

 ## 기타 ##

 HEU.persona_event.121.t:0 "¿No hay algo tipo Mutsuki, o sea…?"
 HEU.persona_event.121.desc:0 "\"Mediocre, mediocre— Aru-chan, tú… ni contabilidad sabes y, en fin, tú… mediocre\" \n\"…¿Te duele algo?\" \n\nDesde la mañana estaba diciendo cosas de “mediocre”, así que pensé qué diablos pasaba… y empezó con una explicación incomprensible: que ahora “ese tipo de personaje” pega más que el rollo de “pequeña demonio”, o algo así.\n\nHaruka dio un paso al frente, con timidez.\n\n\"Jefa Mutsuki, si lo necesita… quizás sería mejor que me denigrara a mí en lugar de a Aru-sama…\"\n\"Mmm… si lo hago con Haruka, siento que de verdad se va a colgar.\"\n\"¿Eh?\"\n\"Y además, eso de ‘ser masoquista’ no me queda tan bien como pensé.\"\n\nMutsuki cruzó los brazos, haciendo “mmm”.\n\n¿Y eso de ‘masoquista’ qué es? ¿Y lo de “personaje”? ¿No seré yo el único que no entiende, verdad?"
 HEU.persona_event.121.a:0 "Mutsuki no dice cosas como “mediocre”"

 HEU.persona_event.122.t:0 "Balance de ‘una maldad al día’"
 HEU.persona_event.122.desc:0 "\"¡Después de mucho tiempo, toda la Agencia 68 al completo! ¡Es hora de nuestro balance de ‘una maldad al día’!\" \n\n¡Clap, clap, clap!\n\nHaruka aplaude con entusiasmo, Mutsuki se ríe como si le divirtiera, y Kayoko solo hace el gesto de aplaudir.\n\nNo se puede decir que estén “unidas”, pero Aru, sentada en su silla, les habló con una seriedad a su manera.\n\n\"¿Qué tal si cada quien cuenta qué hizo hoy para cumplir ‘una maldad al día’, como forajidas dignas de la Agencia 68?\" \n\nHaruka se rascó la mejilla.\n\n\"E-eh… la verdad es que últimamente no he podido hacer nada malo, como tal…\" \n\nMutsuki solo soltó una risita.\n\n\"O sea, bromear con Aru-chan sí… pero aquí, con una sola bomba la gente sí se muere de verdad. Es difícil, ¿no?\" \n\nKayoko también suspiró.\n\n\"No hice nada.\" \n\n\"¡¿Qué es eso?! ¡No es nada hardboiled!\" \n\nHaruka sonrió, con dulzura.\n\n\"Pero… p-pero eso significa que cada vez más gente confía en Aru-sama y la quiere. ¿No es… algo bueno, al revés…?\" \n\nAru, que iba a decir algo, terminó cerrando la boca.\n\nForajida, hardboiled… sí, era cierto: esas palabras se iban deshilachando poco a poco hacia recuerdos del pasado.\n\nPero… una vida amada por los demás… quizá no sea algo malo, ¿no?"
 HEU.persona_event.122.a:0 "Traicionar la expectativa de que haré algo malo. Eso también cuenta como ‘una maldad al día’"

 HEU.persona_event.123.t:0 "Me duelen los ojos"
 HEU.persona_event.123.desc:0 "\"Ya pasó bastante desde que me quité los lentes tras mi ‘debut’ en preparatoria…\" \n\nIntentar leer hasta tarde un libro grueso de economía sin lentes hace que me duelan muchísimo los ojos.\n\nAru cerró el libro dejando el separador dentro, y se levantó.\n\n\"¿Será mejor ponerme los lentes cuando esté sola en mi departamento, después del trabajo?\" \n\nTotal, cuando está sola no hay nadie que la vea, y aunque vuelva a usar lentes como antes, Mutsuki ya no estará a un lado para burlarse.\n\n¡Pero… lentes!\n\n¿No es eso un objeto que trae de vuelta aquellos recuerdos vergonzosos de antes del “debut”?\n\n¿No será mejor aguantar el dolor de ojos y leer sin lentes?"
 HEU.persona_event.123.a:0 "¡Sigo odiando los lentes!"
 HEU.persona_event.123.b:0 "Es un paso atrás… por el estudio…"

 HEU.persona_event.124.t:0 "Te mataré, Rikuhachima Aru"
 HEU.persona_event.124.desc:0 "\"Te mataré, Rikuhachima Aru… ¡Kgh!\" \n\nA la hora de la comida, un terrorista simpatizante nazi que había escalado el muro del Palacio Ducal de Luxemburgo con equipo casero fue detenido en el acto.\n\nParece que venía bien preparado para un asesinato, incluso con una pistola, pero aunque una bala le dio a Aru justo entre los ojos, ella se mantuvo ilesa y respondió con fuego.\n\nEl tipo terminó rodando por el suelo con una bala en el vientre.\n\nLos gendarmes, que llegaron un poco tarde, escupieron insultos en alemán y empezaron a golpear sin piedad al nazi herido con las culatas.\n\nEra alguien que intentó asesinar a Aru, sí… pero ver a varios hombres pateando con botas y pisoteando a un sujeto sangrante le resultaba demasiado chocante.\n\nAru se acercó a los gendarmes alterados y habló."
 HEU.persona_event.124.a:0 "\"Si se muere, no podremos investigar. Todos, cálmense.\""
 HEU.persona_event.124.b:0 "\"N-no, o sea… primero llevémoslo al hospital. Da pena…\""

 HEU.persona_event.125.t:0 "Hoy, una comida agradable"
 HEU.persona_event.125.desc:0 "En el Palacio Ducal de Luxemburgo, por supuesto, hay un comedor lujoso y chefs contratados para la casa ducal… pero Aru nunca había comido dentro del palacio.\n\nA la hora del almuerzo, el lugar al que iba normalmente era un pequeño restaurante de transferidos, no muy lejos a pie.\n\nEn el local japonés que regentaba un demi-humano gorrión, podía comer barato, pero más rico que las comidas de tienda de conveniencia que solía comer en Kivotos.\n\n\"Come mucho. Gracias a la señorita Rikuhachima, últimamente ya no hay locales que nos lancen piedras llamándonos ‘cabeza de pájaro’, ¿sabes?\" \n\nEl demi-humano gorrión recibió a Aru con alegría y le sirvió más karaage de lo habitual.\n\nEra un pequeño gesto, pero al pensar que el sueño de que los kivotosianos y los locales vivieran como iguales estaba un poco más cerca, Aru sonrió y tomó los palillos."
 HEU.persona_event.125.a:0 "\"Sigamos esforzándonos… para poder hacer feliz a más gente…\""
 HEU.persona_event.125.b:0 "\"Si yo, como líder de la Agencia, me esfuerzo más, podré guiar a todos, ¿no?\""

 HEU.persona_event.126.t:0 "¡No soy una torpe!"
 HEU.persona_event.126.desc:0 "\"¡Uaaah! ¡Kgh! ¡Keh!\" \n\nA la hora de la cena, en la pensión, intentó tomar café con elegancia… y terminó pegando los labios a la superficie del café.\n\nY encima… ¡crash!\n\nEl mug que tenía en la mano cayó y el café se filtró en el piso de madera.\n\nEntre lágrimas, recogió los pedazos del mug y frotó el suelo con un trapo una y otra vez… pero parece que el olor a café sigue allí.\n\n¿Por qué soy tan tonta…?\n\n¿Por qué no puedo mostrar una imagen confiable?\n\nMientras Aru, tirada en el suelo, restregaba la madera con todas sus fuerzas, sintió cómo una tristeza pesada le subía desde el pecho…"
 HEU.persona_event.126.a:0 "\"Era una taza importante…\""

 HEU.persona_event.127.t:0 "Un camino al trabajo desagradable"
 HEU.persona_event.127.desc:0 "\"¡Cornuda! ¡Demonio! ¡Vuelve al infierno!\" \n\nPor la mañana, cuando Rikuhachima Aru salía hacia el Palacio Ducal de Luxemburgo, un niño —más o menos de primaria— le lanzó una piedra.\n\nLa piedra, volando con una trayectoria perfecta, le dio justo en la cabeza.\n\n¡Clang!\n\n\"¡Ay!\" \n\n\"¡Maldito incivilizado! ¡¿Cómo te atreves con Su Alteza?!\" \n\nUn policía luxemburgués que estaba allí agarró al niño y le golpeó la cabeza con la porra, de manera brusca.\n\n“¡¿Pero si solo era una broma de un niño!?”\n\nAl contrario, Aru se sintió culpable, detuvo al policía y dejó ir al niño.\n\nPero el niño, sangrando de la cabeza, miró a Aru con ojos llenos de odio y desapareció en un callejón.\n\n\"Su Alteza, ¿se encuentra bien? A ese crío hay que atraparlo sin falta…\"\n\"No. Está bien… solo… estoy bien.\""
 HEU.persona_event.127.a:0 "Aru no pudo olvidar los ojos de ese niño en todo el día"

 HEU.persona_event.128.t:0 "Práctica de tiro"
 HEU.persona_event.128.desc.a:0 "¡Bang! ¡Bang!\n\nA diferencia de Kivotos, donde siempre llevaba un rifle de francotirador, Aru cambió a una pistola porque los locales se inquietaban.\n\nA veces salía al bosque, colocaba una diana y practicaba tiro… pero ¿sería porque no estaba en condiciones?\n\nNo dio ni un solo tiro al blanco.\n\n\"Así no soy ni hardboiled ni forajida…\" \n\nAru refunfuñó y guardó la pistola en el bolsillo."
 HEU.persona_event.128.desc.b:0 "¡Bang! ¡Bang!\n\nA diferencia de Kivotos, donde siempre llevaba un rifle de francotirador, Aru cambió a una pistola porque los locales se inquietaban.\n\nA veces salía al bosque, colocaba una diana y practicaba tiro… pero ¿sería por la visión que perdió en un ojo?\n\nNo dio ni un solo tiro al blanco.\n\n\"Con un solo ojo… no puedo calcular la distancia.\" \n\nAru refunfuñó y guardó la pistola en el bolsillo."
 HEU.persona_event.128.a:0 "Qué día de mala suerte"

 HEU.persona_event.129.t:0 "Resfriado"
 HEU.persona_event.129.desc:0 "\"…O sea que se quedó toda la noche leyendo economía, y entonces…\"\n\"Creo que me resfrié… ¡achís!\" \n\nPor eso esa noche el aire se sentía tan frío: parece que la ventana de la pensión había quedado ligeramente abierta.\n\nAl pasarse la noche entera leyendo con el viento helado dándole, terminó resfriándose.\n\nRecostada en el sofá duro de la pensión, con una manta áspera a modo de cobija, Aru gimió y se sostuvo la frente.\n\nCuando Haruka le puso una toalla húmeda en la frente, el cuerpo pareció mejorar un poco.\n\nAunque… lo que estudió anoche, seguro no recordará nada.\n\n\"Aru-sama, hoy descanse bien. …Si Aru-sama enferma, ¿quién va a proteger a la Agencia 68…?\" \n\"Lo siento… intentaré recuperarme rápido.\""
 HEU.persona_event.129.a:0 "Un cuerpo que ni las balas tumban… ¿y no puede contra un resfriado…?"

 ### 우울증 상태의 일상 이벤트 ###
 
 HEU.persona_event.1000.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1000.desc:0 "Cuando estaba en Kivotos, no tocaba el alcohol.\n\nPara empezar, también era menor de edad.\n\nPero últimamente, en Luxemburgo, si no bebía… simplemente no podía dormirse por la noche.\n\nPensó que el insomnio sería algo temporal, pero cada vez que se acostaba, el corazón le latía con fuerza y el cuerpo se le endurecía como si estuviera paralizado.\n\n\"…Cerveza en lata. Solo una…\" \n\nAru sacó del refrigerador una cerveza barata del mercado negro, se la bebió de golpe y se dejó caer en el sofá de su cuarto.\n\nAl menos, si tenía este alcohol… parecía que hoy sí podría dormirse."
 HEU.persona_event.1000.a:0 "Desesperación, y más desesperación"
 
 HEU.persona_event.1001.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1001.desc:0 "¿Cómo habría sido si yo no hubiera nacido?\n\nLos empleados de la Agencia 68 no se habrían peleado entre ellos.\n\nY Mutsuki no habría cargado con esa culpa de “lo siento por no haber podido hacer nada mientras te atacaban”.\n\nKayoko… quizá habría llegado a un puesto alto en el Comité de Disciplina de Gehenna.\n\nHaruka habría sufrido acoso por más tiempo, pero… tal vez, al final, se habría transferido a una escuela mejor y habría llevado una vida normal.\n\nEntonces… ¿qué significa?\n\nQue yo nací… y volví infelices a esas tres de la Agencia 68."
 HEU.persona_event.1001.a:0 "No debí haber nacido"
 
 HEU.persona_event.1002.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1002.desc:0 "Con balas ya cargadas en un revólver, Aru giró ligeramente el tambor con la punta de los dedos, se lo apuntó a la cabeza y apretó el gatillo.\n\nUna ruleta rusa clásica.\n\nLa única diferencia: las seis recámaras estaban llenas.\n\nBang, bang, bang.\n\nUna y otra vez, las balas chocaron contra su sien, y los proyectiles deformados rodaron por el suelo.\n\nSer gente de Kivotos… es ser una existencia miserable.\n\n¿No lo crees?\n\nAru soltó una risa seca y arrojó el revólver vacío."
 HEU.persona_event.1002.a:0 "El impulso suicida todavía es soportable"
 
 HEU.persona_event.1003.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1003.desc:0 "Por este ánimo sombrío, hoy no puedo hacer ningún trabajo.\n\nAru subió al techo del Palacio Ducal y se recostó mirando el cielo despejado.\n\nSi me cayera desde ese cielo tan alto… si me hiciera pedazos… tal vez podría ser feliz.\n\nPero hoy… ni ganas de hacerlo me nacen."
 HEU.persona_event.1003.a:0 "El impulso suicida todavía es soportable"
 
 HEU.persona_event.1004.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1004.desc:0 "Depresión, trastorno, lo que sea.\n\nAru no pensaba realmente que su mente se estuviera derrumbando.\n\nSolo… empezó a beber, a tener insomnio, a veces sentía impulsos suicidas, y sentía culpa hacia todas las personas a su alrededor.\n\nHoy le tocaba a la culpa.\n\nAru se recargó en el sofá con los ojos cerrados.\n\nLas imágenes pasaron una tras otra: la casa ducal muerta, los miembros de la Agencia peleándose, las caras de los nazis que la golpeaban con un martillo.\n\nSi yo existo, todos ellos se vuelven infelices.\n\nEntonces… ¿por qué yo puedo estar sentada en una silla cómoda?"
 HEU.persona_event.1004.a:0 "De verdad no lo sé"
 
 HEU.persona_event.1005.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1005.desc:0 "\"¿Su Alteza?\" \n\nEl capitán de gendarmería, Emil Speller, que estaba leyendo un informe militar, se lo preguntó al ver a Aru mirando la pared, ida.\n\nAh.\n\nAru apretó los ojos y los abrió de nuevo.\n\nÚltimamente, por alguna razón, su concentración no dejaba de caer.\n\nHasta el punto de que escuchar y leer reportes militares empezaba a ser difícil.\n\nAru se presionó la sien con los dedos y dijo:\n\n\"Perdón. Creo que estoy algo cansada. …¿Hasta dónde iban?\""
 HEU.persona_event.1005.a:0 "¿No será que se me está endureciendo la cabeza…?"
 
 HEU.persona_event.1006.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1006.desc:0 "Tengo que ir a trabajar.\n\nPero todo el cuerpo me pesa.\n\nNi siquiera sé por qué tengo que ir.\n\nNi sé por qué tengo que ir a firmar documentos y leer papeles.\n\n¿No es que, aunque yo no esté, nadie va a sentirse incómodo?\n\nVamos.\n\nA dormir.\n\nAru sacó una cerveza del refrigerador y bebió.\n\nNo sabe cuántas latas fueron.\n\nQuizá bebió hasta desmayarse.\n\n¿Lo importante… es que al menos pudo dormirse?"
 HEU.persona_event.1006.a:0 "Duerme."
 
 HEU.persona_event.1007.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1007.desc:0 "Señora Charlotte.\n\nYo me quedé en Luxemburgo después de ver su cuerpo muerto.\n\nDeseé que una tragedia así no volviera a ocurrir en esta tierra.\n\nPero… ¿yo era alguien con esa capacidad?\n\nRikuhachima Aru, jefa de la Agencia.\n\nAunque me creo mucho y reparto tarjetas de presentación… no logré satisfacer ni a los luxemburgueses ni a la gente de Kivotos.\n\nNo tuve el carisma para cerrar sus conflictos.\n\nTodo es culpa mía."
 HEU.persona_event.1007.a:0 "Una culpa pesada"
 
 HEU.persona_event.1008.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1008.desc:0 "\"¡Hoy Aru-sama va a cocinar la cena en persona…! ¡De verdad tengo muchísimas ganas!\" \n\nCon la voz de Haruka, llena de ilusión, sonando a su espalda, Aru tomó lentamente un cuchillo de cocina.\n\nA los de Kivotos no nos mata un disparo.\n\nPero… ¿y si sujeto mi muñeca con el cuchillo y la corto a lo largo, en vertical?\n\nDicen que desangrarse es una de las *pocas* formas de matar a alguien de Kivotos.\n\nSi yo muriera aquí…\n\n¿Haruka no se alegraría?\n\nQuizá se reiría, diciendo que desapareció una jefa inútil que solo desperdiciaba oxígeno, y patearía mi cadáver hasta tirarlo al basurero.\n\nEntonces…\n\nMover la punta.\n\nDespacio.\n\nHacia la arteria.\n\n\"¿Aru-sama?\" \n\n\"¿Eh? ¿Ah? Ajajá… es que no me acuerdo la receta. Espera tantito.\""
 HEU.persona_event.1008.a:0 "Hoy no."
 
 HEU.persona_event.1009.t:0 "El trastorno depresivo de Rikuhachima Aru"
 HEU.persona_event.1009.desc:0 "\"Jah… maldita sea, de verdad.\" \n\nPateando para apartar el montón de latas vacías tiradas en el piso de su departamento, Aru se dejó caer en el sofá y abrió una lata nueva.\n\nHay documentos que tiene que procesar.\n\nPero la cabeza simplemente no se mueve.\n\nComo si el cerebro se hubiera derretido: por más extraño que fuera, las letras del documento no se podían leer.\n\nLa elección de Aru fue el alcohol.\n\n\"Ya debería haber entrado en razón a estas alturas.\" \n\nDespués de beber lata tras lata hasta estar completamente ebria, Aru dejó el montón de documentos sobre la mesa de centro.\n\nEl brazo derecho con el que subrayaba temblaba como un espasmo, sin parar."
 HEU.persona_event.1009.a:0 "Las letras… se ven… dobles… ¿…?"

 ### Eventos cotidianos en estado de confinamiento ###
 
 HEU.persona_event.2000.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2000.desc:0 "\"¡Ya de nada sirve que supliques por tu vida a estas alturas, jefa del Comité de Disciplina!\"\n\nAru gritó hacia el vacío. Un enemigo imaginario: la jefa del Comité de Disciplina de Gehenna. Un muro que, antes de la Gran Transferencia, Aru jamás había podido superar. Pero en su mundo imaginario no era así.\n\nAru fingió girar el cuerpo con agilidad, actuando como si esquivara las balas disparadas por la Hina imaginaria. Incluso hacía con la boca sonidos de gemidos como si las balas le rozaran.\n\n\"¿Con este ataque crees que basta? ¿Me vas a ganar así? ¡Al forajido hardboiled más fuerte de todos!\"\n\n¡Bien! Aquí va el golpe de mano al estilo yakuza de película hardboiled. Luego un salto impulsándose desde el suelo, y una patada alta al punto donde debería estar la cabeza de Hina.\n\nY Aru se desplomó sobre el sofá.\n\nCuando el cojín del sofá quedó hecho un desastre, hundido y deformado, Aru murmuró, como si interpretara a Hina en un papel doble:\n\n\"......Ghk, Rikuhachima Aru... tú... eres demasiado fuerte...\"\n\nEl cojín que recibió la patada “seria” de Aru cayó al suelo con un plof, y Aru, secándose el sudor, soltó una respiración agitada.\n\n\"¡Hmph! ¿Hasta ahora te rindes? Bien. ¡Desde hoy, Gehenna queda bajo mi control!\"\n\nHizo el gesto de agitar el faldón del abrigo con estilo y adoptó una pose de victoria.\n\nBum. Bum.\n\nEl corazón le latía con fuerza. Una victoria perfecta.\n\nPero mientras saboreaba el regusto del triunfo, su mirada fue, de pronto, hacia la puerta metálica cerrada con firmeza.\n\nEsa puerta que Aru no podría abrir jamás por sí sola.\n\nLa misma que Mutsuki, sonriendo, había cerrado con llave diciendo: ‘Es por ti, Aru-chan☆’.\n\nY al otro lado de esa puerta, los guardias que estarían patrullando.\n\n\"......Ah, joder.\"\n\nAru se dejó caer de golpe en el sofá.\n\n\"Yo, que no puedo dar ni un paso fuera del refugio...\""
 HEU.persona_event.2000.a:0 "\"¿Yo qué... voy a vencer a Hina...?\""
 
 HEU.persona_event.2001.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2001.desc:0 "Un aire tenue, con un rastro del olor del sol. La luz de la tarde que se colaba por la rendija de la ventana enrejada se estiraba larga sobre el suelo.\n\nAru, hundida en un sofá viejo, pasó lentamente las páginas de un libro grueso.\n\nEl título era: “Teoría profunda de administración que hasta Max Weber encontraría sorprendente”.\n\nUn libro cutre, escrito a golpes de IA generativa por un streamer de internet que ni siquiera estudió economía; uno de esos en los que ni sabes si es Max, Marx o qué tanto “se sorprendería”.\n\nPero en ese espacio aburrido, Aru no tenía muchas opciones.\n\n¿Ir de compras afuera? Ni hablar.\n\nDe verdad... ojalá pudiera salir.\n\nLa consciencia de Aru se iba una y otra vez más allá del libro: hacia el silencio que llenaba el refugio.\n\nSilencio.\n\nEn un día normal, a esta hora ya se escucharía la risita de Mutsuki, “kuhuhu”; o Haruka regando su planta carnívora y hablándole; o Kayoko regañándola: “No compres basura escrita por un no-profesional que ni sabe economía”.\n\nRuidoso, caótico, a veces hecho un desastre...\n\nPara Aru, esa vida cotidiana era la música de fondo “normal”.\n\n¿Podrá volver a sonar esa música de fondo detenida?\n\n¿Podrá volver a girar un disco rayado, podrán bailar de nuevo las manecillas de un reloj parado?\n\nAru acarició su ojo, el único con el que ya podía ver.\n\nSe le escapó un poco de lágrima."
 HEU.persona_event.2001.a:0 "\"Este libro... es tan malo que dan ganas de llorar\""
 
 HEU.persona_event.2002.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2002.desc:0 "Un silencio con polvo asentado. Un refugio donde Mutsuki cerró con llave la puerta, y afuera patrulla un destacamento de seguridad.\n\nComo es obvio... es terriblemente aburrido.\n\n¿Internet? Ni de broma.\n\n¿TV? Fijada en una transmisión de béisbol de Millennium.\n\n¡Dios mío!\n\nRikuhachima Aru, enterrada en un sofá viejo, se estiró y bostezó largamente.\n\nSi no se puede escapar de este encierro... ¿al menos no deberían evitar que me entren ganas de escapar? ¿Eh, Mutsuki?\n\n\"Me voy a volver loca...\"\n\nSu murmullo dio una vuelta por la habitación vacía y se apagó.\n\nIntentó cruzar las piernas para conservar cierta “dignidad aristocrática”, o posar con el mentón sobre el apoyabrazos con expresión seria...\n\npero en un lugar sin nadie, esas actuaciones no tenían sentido.\n\nAl final Aru no aguantó y tomó una daga de juguete.\n\nEl tacto frío se le pegó a la palma.\n\n\"Mutsuki... ¡cuando te vea después...!\"\n\nY usando un chasquido de muñeca, lanzó la daga con ligereza.\n\nPif, pif.\n\nLas dagas de juguete volaron y golpearon con precisión una por una las tazas y los platos del aparador, rompiéndolos.\n\n¡Crash! ¡Crash!\n\nLos sonidos seguidos la hicieron sentir extrañamente feliz.\n\nClaro.\n\nMi habilidad no se ha oxidado.\n\nAru soltó una risa emocionada... y de golpe la cortó.\n\nNo se oxidó, sí.\n\n¿Y qué?\n\n¿Con lanzar estas dagas de juguete voy a poder salir de aquí?\n\nQué importa.\n\nAru se tiró en el sofá."
 HEU.persona_event.2002.a:0 "\"Con que lance bien las dagas, ya estuvo, ¿no?\""
 
 HEU.persona_event.2003.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2003.desc:0 "El tiempo en el refugio se parece a un hámster corriendo en su rueda.\n\nDa igual si corre decenas de miles de kilómetros o incluso años luz: jamás podrá salir de la rueda.\n\nAru, sin ganas de nada, se quedó sobre la cama mirando el techo para matar el tiempo.\n\nY de pronto, su vista cayó sobre el molinillo de café y el set de dripper que había en un rincón.\n\nUno de los “regalos” de Mutsuki.\n\nComo si a Aru le gustara *tanto* el café.\n\n‘Bueno... mejor esto que no hacer nada, ¿no?’\n\nEmpezó sin un motivo especial, solo para distraerse del aburrimiento.\n\nAl principio fallaba con la temperatura del agua y le salía café nivel “administradora Ako”.\n\nCada vez, solo tenía que extender una lata vacía de granos al guardia que vigilaba sin expresión... y al poco rato aparecían granos nuevos.\n\nLarga vida al shogun Mutsuki.\n\nY lo que antes solo era un café feo, últimamente empezó a sacar un aroma y una profundidad cada vez mejores.\n\nSi se metiera al Comité de Disciplina, quizá podría reemplazar a Ako como encargada del café.\n\nAru sonrió apenas y se sentó en el sofá.\n\nParece que este encierro, al menos, no es algo que no le deje absolutamente nada."
 HEU.persona_event.2003.a:0 "\"Una taza de café caliente.\""
 
 HEU.persona_event.2004.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2004.desc:0 "\"¡Jefa Aru! ¡Hoy nos entró una misión de un pez gordísimo! ¡Cien mil yenes por la cabeza de un mafioso!\"\n\"Uf... Haruka, cien mil yenes. Seguro es una estafa, con esa cantidad.\"\n\"¡Eeeh! ¡Kayoko! Si te pones a ver la realidad tan oscura, ¿cómo vas a ser el cerebro de la Agencia 68? ¡Esto es prueba de que por fin reconocen nuestra habilidad!\"\n\nEn el sofá del refugio, Aru, con el “guante Haruka” y el “guante Kayoko” puestos, interpretaba ella sola a Haruka y Kayoko haciendo que las bocas de los guantes abrieran y cerraran.\n\nUn teatro de una sola persona: tres papeles.\n\nLa Agencia 68 seguía activa... dentro de las manos de Aru.\n\nEn este pequeño refugio, Aru revivía recuerdos y desplegaba aventuras para la Agencia 68.\n\nAunque fueran aventuras que solo existían en su cabeza, y no en la realidad."
 HEU.persona_event.2004.a:0 "...¿No había alguien más? Haruka. ¿Qué tonterías estás diciendo?"
 
 HEU.persona_event.2005.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2005.desc:0 "La vida diaria silenciosa del refugio se rompía un poco cada vez que cambiaban los guardias.\n\nCon pasos regulares llegaba un nuevo turno, y bajo una vigilancia muda revisaban cada rincón de la casa.\n\nSi Aru había intentado escapar, si había señales de manipulación, si las cerraduras seguían bien...\n\ncomo si confirmaran, una y otra vez, los muros de una prisión invisible.\n\nNormalmente Aru los ignoraba con frialdad.\n\n\"Debe ser pesado, cada vez.\"\n\nPero hoy fue distinto.\n\nLas palabras inesperadas de Aru hicieron que el guardia se detuviera un momento y la mirara.\n\nFue breve, pero en sus ojos se cruzaron sorpresa y una emoción indescifrable.\n\nLuego, sin decir nada, inclinó la cabeza en un saludo corto, agradeciendo.\n\nNo todos los que la mantenían encerrada la odiaban.\n\nSimplemente... había un sistema enorme, y gente que se movía por órdenes.\n\nAru no quería odiarlos a ellos también."
 HEU.persona_event.2005.a:0 "Ni siquiera es muy hardboiled."
 
 HEU.persona_event.2006.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2006.desc:0 "¡Tac! ¡Ta-tac tac!\n\nLo que sobra es tiempo.\n\nNo: sobra *demasiado* tiempo.\n\nÚltimamente, Aru se metía de lleno en practicar baile en el refugio.\n\nNo porque le interesara bailar.\n\nEs más bien: ¿qué más va a hacer?\n\nEl baile que practica ahora es un baile de idol.\n\nMúsica idol de MiLie로, brillante y resplandeciente.\n\nEscuchando la cinta de audio vieja que sonaba en la sala, Aru movía una y otra vez la punta de los pies.\n\nAún no podía decirse que sus movimientos fueran perfectos, pero poco a poco, muy poquito a muy poquito, su postura iba mejorando."
 HEU.persona_event.2006.a:0 "MiLie로."
 
 HEU.persona_event.2007.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2007.desc:0 "Aru hojeó un libro llamado “La formación del actor”, de Konstantín Stanislavski.\n\nUn manual de teatro publicado en la Unión Soviética en los años 20.\n\nConstrucción del personaje, pactos sobre el escenario, comunicación con el público.\n\nSorprendentemente, le resultaba familiar.\n\nAru cerró el libro un momento, se paró frente al espejo...\n\ny, como solía hacer en el pasado, levantó una comisura con confianza y dijo:\n\n\"Je. ¿Déjamelo a mí, no? ¿Qué encargo hay que yo no pueda resolver?\"\n\nQué ridículo.\n\nAru dejó caer los brazos, sin fuerzas.\n\nHardboiled...\n\nEsas frases y gestos “geniales” de forajidos de película que había imitado para construirse a sí misma como Rikuhachima Aru...\n\n¿no era eso también una especie de actuación?\n\nSolo había interpretado un guion llamado “hardboiled”, dentro del papel de “jefa de la Agencia 68”.\n\n‘¡Entonces, Aru-chan! ¿Dónde está la Aru-chan de verdad?’\n\nCon el tono de Mutsuki, se lo preguntó a sí misma,\n\nmientras observaba en silencio a la desconocida chica tuerta en el espejo."
 HEU.persona_event.2007.a:0 "Supongo que si leo más este libro de actuación, lo sabré."
 HEU.persona_event.2007.b:0 "Si repito esta actuación tonta frente al espejo... quizá lo sepa."
 
 HEU.persona_event.2008.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2008.desc:0 "El tiempo aquí le había quitado muchas cosas a Aru, pero no podía arrebatarle el maquillaje de cada mañana.\n\nO mejor dicho: ella no iba a permitir que se lo arrebatara.\n\nNo pensaba renunciar por completo a “su vida diaria”.\n\nCon la base en la mano, Aru acarició suavemente su mejilla.\n\n\"...Aunque no haya nadie que me vea.\"\n\nNo era por eso de “hardboiled” ni nada.\n\nEra solo una prueba de que Rikuhachima Aru no se había derrumbado.\n\nCon manos ya acostumbradas, dibujó el delineado y aplicó con calma un labial rojo.\n\n\"Je… bueno. Sigo siendo yo.\" \n\nBajo esas pestañas largas, en el ojo que ya era el único verdadero, seguía girando una oscuridad profunda...\n\npero aun así, la Aru del espejo era hermosa.\n\nEse hecho le gustó un poquito.\n\nDe verdad, solo un poquito.\n\nAru sonrió levemente hacia el espejo."
 HEU.persona_event.2008.a:0 "...Ojalá hubiera alguien que pudiera ver esta apariencia."
 HEU.persona_event.2008.b:0 "Pero bueno, ¿no basta con que yo me divierta?"
 
 HEU.persona_event.2009.t:0 "¡La larguísima, larguísima vida de vacaciones de Aru-chan!"
 HEU.persona_event.2009.desc:0 "Quizá el tiempo aquí no sea más que un sueño.\n\nHoy, Aru pensó eso.\n\nQue Mutsuki, que la valora tanto, la encierre…\n\nque incluso se enfrente a Kayoko…\n\nAjajá.\n\nNo tiene sentido.\n\nEsto es solo una alucinación simple, un delirio simple, una “fanfic” del yo, creada por una fantasía dentro de un sueño.\n\nPara despertar de este sueño, Aru cerró los ojos con fuerza...\n\nmuy, muy fuerte...\n\n\n\nLa puerta de acero del refugio seguía allí."
 HEU.persona_event.2009.a:0 "...Siento desesperación."
 HEU.persona_event.2009.b:0 "Pero quiero superar esta desesperación."
# Fin de eventos de persona }}
#{{ Inicio de eventos de Mutsuki
 HEU.mutsuki_event.1.t:0 "Una sola bala"
 HEU.mutsuki_event.1.desc:0 "¡Crash! El día en que una piedra lanzada por los manifestantes anti-Aru rompió el vidrio y golpeó la nuca de Aru.\n\nA pesar de que Haruka y Aru intentaron detenerla, Mutsuki apuntó a los manifestantes y disparó.\n\nDe todos modos, las que llevan un halo en la cabeza no mueren por una o dos balas. A menos que, como esos malditos perros hicieron con Aru, trajeran martillos y toda clase de armas para torturar durante horas… entonces sería otra historia.\n\n\"Joder.\"\n\nLa noche de regreso a casa, Mutsuki sintió cómo se le humedecían los ojos con lágrimas, y se subió a la motocicleta rumbo a casa.\n\nEra una moto que compró para acortar aunque fuera un poco el trayecto de diez minutos hasta el Palacio Gran Ducal, desde que Aru fue linchada en la calle.\n\nPero esa motocicleta también se usaba para que Mutsuki se alejara de Aru.\n\nLe pareció irónico.\n\nSe suponía que debía proteger a Aru… ¿y por qué estaba usando esa herramienta para alejarse de ella?\n\n\"Señora Mutsuki.\"\n\nEn ese momento, varias chicas de Gehenna se acercaron a Mutsuki.\n\n¿Era una represalia por los disparos del día?\n\nMutsuki sonrió levemente y estiró la mano hacia la navaja en el bolsillo interior de su ropa.\n\nPero la respuesta no fue odio.\n\nFue complicidad.\n\n\"Somos miembros ‘comunes’ de la Agencia 68.\"\n\n¿Miembros comunes? Ah. Los soldados privados que Aru reunió tras la Gran Transferencia.\n\n\"Convencer con palabras, debatir, hacer foros… desde el principio eso estuvo mal. Ellos no quieren escucharnos. Para proteger a la señora Aru necesitamos un método más rápido y más seguro. Un método como el de hoy.\"\n\n¿Como el de hoy?\n\nMutsuki dudó un instante y retiró la mano sin sujetar la navaja.\n\n\"O sea… ¿disparar?\"\n\n\"Sí. Con una sola bala, un solo disparo, todo este asunto… se resolverá. Usted también lo sabe, jefa Mutsuki. ¿No? Que la señora Aru es demasiado débil para resolver esto.\""
 HEU.mutsuki_event.1.a:0 "\"Sí. Claro. ¿Cómo no se me ocurrió antes?\""
 
 HEU.mutsuki_event.2.t:0 "Te quiero, te quiero, te quiero, te quiero tanto"
 HEU.mutsuki_event.2.desc:0 "Me gustas.\n\nNo sé si es amor romántico, si es amistad, si es admiración… creo que no se puede expresar con ninguna de esas cosas.\n\nMi alma persigue la tuya.\n\nPara seguir lo que quieres hacer, soy como Plutón en un mundo rodeado de oscuridad: sé que, incluso en el frío infinito y la nada eterna, no podré alcanzarte… y aun así, como si no pudiera abandonar a mi sol, te sigo.\n\nLa distancia entre tú y yo no se estrechará por más que ocurra lo que ocurra, y sé que tampoco llegará el día en que tú me mires.\n\nPero incluso en el frío cortante del mes lunar de enero (Mutsuki), sé que al otro lado del vacío del cielo nocturno hay un hilo tenue de luz: estás tú.\n\nTú jamás sabrás por qué actúo así.\n\nAsí como, junto al sol que arde con fervor, Mercurio y Marte pueden verse… pero Plutón, tan lejos y tan pequeño, no se distingue.\n\nAun así, te ruego que comprendas este corazón mío que desea que incluso el brillo de ese Plutón lejano sea reconocido.\n\n\"...\"\n\nAru bajó la carta.\n\nDe todos los “manifiestos de golpe de Estado” que podría llegar a leer en su vida, este era el más literario… no: el más desconcertante.\n\nNo había motivos de por qué daba un golpe.\n\nNo había planes futuros de qué haría después.\n\nNo había nada.\n\nSolo una confesión: que Mutsuki era Plutón mirando a Aru, y que Aru era su sol.\n\nAru, con la mano que ya no se movía bien por la discapacidad, dobló la carta en cuatro y la dejó sobre el escritorio, delante de Mutsuki.\n\nEl motivo de Mutsuki no estaba en esa carta interminable.\n\nEstaba en sus ojos.\n\nNo necesitaban una conversación larga.\n\nAru hizo una sola pregunta:\n\n\"¿Puedes cargar con esto?\"\n\nMutsuki negó con la cabeza.\n\n\"Creo que será difícil. Pero aun así… quiero que Aru-chan siga siendo mi héroe y mi sol.\""
 HEU.mutsuki_event.2.a:0 "\"Entonces yo seré para ti un Plutón inalcanzable… que, aun así, vagará eternamente a tu alrededor.\""
 
 HEU.mutsuki_event.3.t:0 "Golpe de Estado de medianoche - 1"
 HEU.mutsuki_event.3.desc:0 "Cerca del Palacio Gran Ducal, soldados de Gehenna con halo capturaron a los gendarmes que lo custodiaban, atándolos como prisioneros.\n\nNo hubo muertos.\n\nPero si esas tropas con halo hubieran traído armas de fuego reales en lugar de bates de béisbol, la gendarmería habría sido masacrada otra vez.\n\nEl bate era, en sí mismo, un mensaje:\n\n‘De todos modos no pueden detener esto.’\n\nGolpe de Estado.\n\nEl comandante de gendarmería, Emil Schpeller, envió con manos temblorosas un mensaje por Momotalk a Kayoko y Haruka, y luego se subió a un camión.\n\n\"¡Es un golpe! ¡Un golpe de Estado! ¡Envíen todas las fuerzas disponibles a las instalaciones clave de Luxemburgo capital!\"\n\nEl general Consbruck, que acababa de salir corriendo, preguntó:\n\n\"¿Golpe de Estado? Pero si aquí está el Jefe del Estado Mayor, el general Schpeller… ¿quién…?\"\n\n\"Asagi Mutsuki.\"\n\n\"…Dios mío. ¿Otra vez Gehenna?\"\n\nRecordando cómo, el día de la Gran Transferencia, el ejército local fue aniquilado casi como en una ‘masacre’ por las chicas del halo, Consbruck sintió un miedo difícil de soportar… y unas ganas brutales de desertar.\n\nClaro que el miedo de Schpeller era aún mayor.\n\nEl palacio ya había sido tomado por sorpresa.\n\nIncluso si salían ahora… sería difícil cambiar algo."
 HEU.mutsuki_event.3.a:0 "...¿Podremos sobrevivir?"
 
 HEU.mutsuki_event.4.t:0 "Golpe de Estado de medianoche - 2"
 HEU.mutsuki_event.4.desc:0 "\"¡Un golpe de Estado… Mutsuki no puede hacernos esto…!\"\n\nKayoko sabía que últimamente el estado mental de Mutsuki estaba raro.\n\nSabía que, desde que Aru perdió el debate, las burlas y humillaciones del público se habían intensificado.\n\nIncluso sabía que Mutsuki se quedaba horas y horas repitiendo la transmisión del debate donde Aru era motivo de risas.\n\nPero ¿un golpe?\n\nNi siquiera lo imaginó.\n\nKayoko intentó unirse a la gendarmería cerca del palacio e irrumpir.\n\nPero todo era demasiado desfavorable.\n\nComo si temiera ‘ser odiada por Aru’, Mutsuki estaba bloqueando el acceso al palacio con armas no letales, tan abiertamente que daba miedo.\n\nPero que fueran balas de goma no hacía que la situación fuera “menos seria”.\n\nEn un golpe tan urgente, todo el armamento pesado ya estaba bajo control de Mutsuki.\n\nLa gendarmería reunida solo tenía pistolas y fusiles, nada más.\n\nY, en general, los de Kivotos no solo no mueren con eso: ni siquiera se lastiman fácil.\n\nSi a Mutsuki se le acababa la paciencia y traía artillería… sería una masacre.\n\nKayoko sujetó al general Schpeller.\n\n\"Por ahora, retrocedamos hacia el norte.\"\n\n\"¡Su Alteza está ahí dentro! ¡Debemos presionar más!\"\n\n\"¿Y con qué? ¡Las únicas con halo aquí somos Haruka y yo!\"\n\n\"¿Entonces me está diciendo que abandonemos a Su Alteza? …¿Como aquel día de la Gran Transferencia?\"\n\nKayoko podía entender por qué Schpeller estaba furioso.\n\nAquel día, él fue de los pocos soldados que vieron con sus propios ojos, junto a Aru, a la casa ducal masacrada dentro del palacio.\n\nKayoko habló lo más calmada posible.\n\n\"…Mutsuki, al menos, no va a matar a Aru. No hay forma. Ahora lo razonable es retirarnos al bosque y juntarnos con la policía local para formar una guerrilla. Si nos atrapan a todos aquí… ¿quién demonios va a rescatar a su *Alteza*?\"\n\n\"…Haa. ¡Maldita sea! …De acuerdo. Por ahora, retrocedamos.\"\n\nHaruka habló con la voz temblorosa, a punto de llorar.\n\n\"E-entonces… ¿qué… qué debo hacer yo? D-dejar aquí a la señora Aru…\"\n\n\"Haruka, quédate aquí. A diferencia de mí, tú no te ganaste el odio de Asagi, y si te rindes rápido podrás seguir junto a la jefa Aru. Te lo pido… protégela.\""
 HEU.mutsuki_event.4.a:0 "Haruka asintió."
 
 HEU.mutsuki_event.5.t:0 "Zona segura"
 HEU.mutsuki_event.5.desc:0 "\"Kuhuhu, Aru-chan… ¿te acuerdas? Cuando abrimos la agencia por primera vez, no teníamos dinero y dormíamos en el parque, con una tienda de campaña.\"\n\nEn el dormitorio del refugio, donde la luz del sol se filtraba suave, Asagi Mutsuki se sentó en el borde de la cama y le apartó con ternura el cabello a Rikuhachima Aru, que yacía a su lado.\n\nEn este espacio totalmente aislado del exterior, su voz sonaba especialmente alegre y cariñosa.\n\nAru ya había oído de Mutsuki que el golpe había triunfado.\n\nBueno… no sería mentira.\n\nSi lo fuera, quien estaría aquí no sería Mutsuki: sería Kayoko.\n\nMutsuki era infinitamente feliz por estar a solas con Aru, a quien “de verdad, de verdad” amaba.\n\n\"En ese entonces fue durísimo, pero ahora que lo pienso, todo son recuerdos felices. Pedíamos un ramen entre las cuatro, corríamos por toda la ciudad por encargos tontos… ¡Ah! ¿Y cuando limpiamos a esos del casco? ¡Fue buenísimo, ¿no?! El francotirador de Aru-chan fue increíble. ¡Como era de esperarse de nuestra jefa!\"\n\nA propósito, Mutsuki escogía solo los momentos más brillantes y felices, y hablaba emocionada como una niña contando un cuento.\n\nPero la mente de Aru estaba en otro sitio.\n\n¿Qué se supone que debo hacer ahora?\n\nResistir.\n\nPodía entender con la cabeza que Mutsuki hizo todo esto “por ella”.\n\nPero su corazón no podía aceptar que Mutsuki hubiera cruzado una línea que jamás debió cruzar.\n\nAru intentó apartarla a la fuerza.\n\nPero en el instante en que vio lágrimas en los ojos de Mutsuki… no pudo hacer nada.\n\nLlorando, Mutsuki frotó su mejilla contra la de Aru.\n\n\"Yo hago esto por ti, Aru-chan. Puede que a los demás les dé igual… pero tú tienes que entenderlo…\""
 HEU.mutsuki_event.5.a:0 "Un amor suave… y asfixiante"
 
 HEU.mutsuki_event.6.t:0 "Proclama"
 HEU.mutsuki_event.6.desc:0 "Proclama del Gran Ducado de Luxemburgo\n\n1. Con el fin de proteger a Su Alteza la Regente Rikuhachima y exterminar a los nacionalsocialistas subversivos, a partir de este momento, a fecha de [GetDaetText], se suspenden todas las constituciones de Luxemburgo.\n2. El Parlamento queda suspendido por tiempo indefinido. Se permite la existencia de todos los partidos, pero toda actividad parlamentaria —incluidas sesiones extraordinarias y ordinarias— queda detenida.\n3. Todos los ministros del nuevo gobierno serán designados por Asagi Mutsuki."
 HEU.mutsuki_event.6.a:0 "Proclamación del gobierno"
 
 HEU.mutsuki_event.7.t:0 "Neutralización del partido de derecha"
 HEU.mutsuki_event.7.desc:0 "Tras el golpe, se esperaba una purga y masacre de políticos.\n\nDe hecho, el presidente del Parlamento, Richter, redactó incluso su carta de despedida apenas Mutsuki volteó el gobierno.\n\nPero la ‘masacre’ esperada no ocurrió.\n\nCierre del Parlamento.\n\nProhibición de actividades partidistas.\n\nDisolución del partido de derecha.\n\nLa represión política fue total, pero ni siquiera los diputados del partido de derecha —los más despiadados en la campaña para tumbar la ley de derechos civiles— sufrieron un castigo menor.\n\nSolo dos, Richter (presidente del Parlamento) y Bech (primer ministro), quedaron bajo arresto domiciliario.\n\n\"…¿Qué demonios quiere este nuevo régimen?\"\n\nRichter se quedó de pie junto a la ventana, pensando.\n\nNo era psicólogo.\n\nNo podía leer mentes.\n\nPero por lo que había visto de Asagi Mutsuki, podía suponer una razón.\n\nMutsuki teme ser odiada por Aru.\n\n\"…Después de dar un golpe y encerrar a Aru, aun así le preocupa que Aru llegue a odiarla.\"\n\nEsa sería también la razón por la que inició una dictadura ‘moderada’, minimizando la venganza política.\n\nRichter sintió que se le escapaba una risa pequeña.\n\nPobre idiota… tan ingenua.\n\nClaro que no podía limitarse a burlarse.\n\nSu vida ahora era una ‘vida extra’ concedida por azar.\n\nSi el corazón de esa mujer llegaba a cambiar… nadie podía garantizarle la vida a Richter.\n\n¿Y si, estando bajo arresto domiciliario, escapaba en secreto de madrugada y huía al extranjero?\n\nAunque Mutsuki cayera, su carrera política terminaría.\n\nRichter lo pensó un instante… y volvió a correr la cortina."
 HEU.mutsuki_event.7.a:0 "\"Quedémonos aquí. La suerte estará de mi lado.\""
 
 HEU.mutsuki_event.8.t:0 "El ‘Panic Shot’ de Wilhelm"
 HEU.mutsuki_event.8.desc:0 "Wilhelm II, habiendo sido emperador, debería conocer el arte de negociar y hablar con oficio para tratar con los rebeldes.\n\nAsí lo creyó el gobierno cuando le hizo una petición cortés: que condujera las negociaciones de paz.\n\nPero en realidad, Wilhelm II no tenía idea de qué demonios decir en una situación así.\n\nSi no fuera por su carácter impulsivo y orgulloso, ni siquiera habría aceptado esta tarea.\n\nWilhelm hizo girar la pluma con los dedos y miró los ojos afilados de Kayoko al otro lado de la mesa.\n\n¿Por qué las mujeres de Kivotos tienen expresiones tan intimidantes?\n\nNo.\n\n¿Es que esta mujer da miedo?\n\nPánico pánico pánico shot…\n\n\"…¿Vas a quedarte sentado?\"\n\n\"¡No! Solo estaba repasando mentalmente las condiciones que ustedes propusieron. Veamos otra vez: ¿lo que quieren es la liberación inmediata de la Regente?\"\n\n\"Eso y nada más. Ni siquiera exigimos que renuncien al poder. Queremos a Aru.\"\n\n\"Eso es difícil. Si el gobierno no ‘protege’ a la Regente, ¿de dónde sacará legitimidad este nuevo régimen?\"\n\nAunque estaba asustado y tenso, Wilhelm no olvidó el punto clave.\n\nPuede que Mutsuki haya encerrado a Aru por posesividad.\n\nPero para el ‘gobierno de Mutsuki’, la Aru encerrada era la legitimidad misma del régimen.\n\nUn gabinete con el deber de ‘proteger’ a la soberana.\n\nSi la soberana desaparece, a Mutsuki solo le queda el estigma de líder rebelde.\n\nKayoko soltó un suspiro profundo, habló algo con los oficiales luxemburgueses a su lado… y luego se puso de pie.\n\n\"Entonces, la negociación terminó. Pero… al menos ahora sé que ustedes no buscan una guerra, sino ‘negociar’. Eso… lo agradezco.\""
 HEU.mutsuki_event.8.a:0 "\"…Espero que vuelvan con mejores condiciones.\""
 
 HEU.mutsuki_event.9.t:0 "Luxemburgo se divide"
 HEU.mutsuki_event.9.desc:0 "Luxemburgo se ha dividido.\n\nOnikata Kayoko no puede tolerar el control del gobierno de Asagi Mutsuki.\n\nY Mutsuki arde de rabia por la traición de Kayoko.\n\nLa única fortuna es que ambas conocen lo ocurrido en la ciudad de Luxemburgo justo después de la Gran Transferencia, y están evitando un choque sangriento.\n\nKayoko se atrincheró con sus seguidores en la zona boscosa del norte.\n\nMutsuki, más que por Kayoko… la observa por Aru.\n\nClaro: ¿hasta cuándo podrá durar esa “observación”?\n\nNuestros expertos militares creen que la resistencia de Kayoko podrá mantenerse como máximo un año.\n\nUn año: el límite de lo que puede ‘aguantar’ con comida.\n\nKayoko conocerá ese límite.\n\nY se preparará para avanzar otra vez hacia la capital.\n\nAunque no tenga posibilidades."
 HEU.mutsuki_event.9.a:0 "\"Si quieres venir… ven.\""
 
 HEU.mutsuki_event.10.t:0 "Una trágica guerra urbana"
 HEU.mutsuki_event.10.desc:0 "Para evitar que Aru ‘se entristeciera’ más por una guerra contra Kayoko, Mutsuki intentó a toda costa evitar grandes enfrentamientos.\n\nPero la situación no avanzó como ella quería.\n\nKayoko salió del bosque y reunió todo lo necesario para marchar sobre Luxemburgo capital.\n\nArmas.\n\nPlan.\n\nY más ‘voluntarios’, formados por residentes locales.\n\nAl final, estalló otra vez una batalla urbana en las afueras de la ciudad.\n\nUna batalla aún mayor que la de 1935, justo tras la Gran Transferencia.\n\nLa victoria aplastante de Mutsuki puso fin al combate… pero dejó muchos muertos y heridos.\n\nOnikata Kayoko fue arrestada y puesta bajo procedimiento de encarcelamiento.\n\nLa rebelión terminó de la forma más violenta.\n\nAunque Mutsuki intentó ocultarle esta información a Aru, los feroces combates en las afueras bastaron para que Aru entendiera que ‘algo’ había ocurrido.\n\nLa ira y la impotencia de Aru se hicieron todavía más grandes."
 HEU.mutsuki_event.10.a:0 "Yo no quería esto."
 
 HEU.mutsuki_event.11.t:0 "La rendición de la resistencia"
 HEU.mutsuki_event.11.desc:0 "Para evitar que Aru ‘se entristeciera’ más por la guerra con Kayoko, Mutsuki intentó evitar combates a gran escala.\n\nSe enfocó en quebrar la expectativa de que Kayoko pudiera marchar y ganar.\n\nKayoko, al final, concluyó que no tenía casi ninguna posibilidad.\n\nCuando se agotaron por completo los alimentos, Kayoko decidió rendirse.\n\nPor supuesto, no todos aceptaron la rendición.\n\nAlgunos rebeldes rechazaron la noticia y desertaron.\n\nY dentro del gobierno también surgieron voces de rechazo: querían represión armada, no un procedimiento pacífico.\n\nPero, sea como sea… la división de Luxemburgo terminó."
 HEU.mutsuki_event.11.a:0 "...¿De verdad terminó?"
 
 HEU.mutsuki_event.12.t:0 "El comité sin plan"
 HEU.mutsuki_event.12.desc:0 "El nuevo gabinete se llenó de personal de Kivotos.\n\nEl marco del Estado luxemburgués se derrumbó, y Luxemburgo, incluso nominalmente, quedó bajo control de Kivotos.\n\nPero después de eso… no había un plan.\n\nEl poder público seguía en manos de los locales.\n\nEl ejército estaba dividido en dos.\n\nY Rikuhachima Aru, encerrada, no tenía ninguna intención de cooperar con Mutsuki.\n\nSe creó una nueva organización llamada ‘Comité de Medidas’.\n\nPero en la práctica, era un ‘Comité sin Medidas’.\n\nAru era una soberana confinada.\n\nMutsuki era un shōgun que blandía el poder por ella.\n\nY aun así, ese shōgun no sabía hacia dónde debía avanzar."
 HEU.mutsuki_event.12.a:0 "...Ah, de verdad… qué aburrido."
 
 HEU.mutsuki_event.13.t:0 "La protesta del Partido Comunista de Luxemburgo"
 HEU.mutsuki_event.13.desc:0 "Aunque Luxemburgo estuviera partido en dos y apuntándose con armas entre sí, el partido más grande —el de derecha— fue neutralizado y no podía emitir comunicados de condena.\n\nLo único que podía moverse con libertad era el Partido Comunista de Luxemburgo, que tenía lazos con la supervivencia de Aru.\n\nXenon Bernard, líder comunista, publicó un comentario bastante cínico sobre esta fractura casi equivalente a una guerra civil.\n\n\"Esto jamás habría ocurrido si, desde el principio, no existiera cierto terrorista de cabello plateado que tomó el Palacio con un ejército.\" \n\nEl uso de la palabra ‘terrorista’ por parte del comunista encendió la furia dentro del gabinete de Asagi.\n\nAlgunos afirmaron que debía arrestarse e interrogarse a Bernard.\n\nOtros pidieron cautela: el comunismo fue el partido que salvó la vida de Aru.\n\nLa decisión final, por supuesto, era de Mutsuki."
 HEU.mutsuki_event.13.a:0 "Hagamos de cuenta que no escuchamos nada."
 HEU.mutsuki_event.13.b:0 "Tráelo. Quiero que pruebe lo que es un terrorista de verdad."
 
 HEU.mutsuki_event.14.t:0 "El Partido Liberal Radical marcha"
 HEU.mutsuki_event.14.desc:0 "El Partido Liberal Radical —la mayor fuerza liberal de Luxemburgo (aunque en realidad no sea tan radical)— tenía gran influencia política entre la clase media urbana.\n\nEl partido denunció con fuerza que esta crisis nació por el encarcelamiento de la Regente Rikuhachima Aru.\n\nAunque tras el cierre del Parlamento todos los diputados perdieron oficialmente su escaño, los militantes salieron a marchar por la capital con dos pancartas:\n\n‘Liberen a Rikuhachima Aru’\n\n‘y pongan fin a la situación de guerra civil’.\n\nMientras ciudadanos armados de Gehenna vigilaban la marcha “pacífica”, los manifestantes llegaron incluso a intentar avanzar hacia el palacio, gritando:\n\n‘¡Larga vida a la Regente Rikuhachima!’\n\nComo el partido está respaldado por la clase media urbana, una represión violenta enfurecería a la ciudad.\n\n¿El gabinete de Mutsuki les abrirá paso para que griten frente al palacio y se vayan?\n\n¿O enviará tropas de Kivotos para disolverlos por la fuerza?"
 HEU.mutsuki_event.14.a:0 "Que griten. No pueden cambiar nada."
 HEU.mutsuki_event.14.b:0 "Haa… con un golpe de bastón se acaba el problema."
 
 HEU.mutsuki_event.15.t:0 "El bien castiga al mal"
 HEU.mutsuki_event.15.desc:0 "\"No me gusta esa regente. Dice que es por Luxemburgo, pero al final no deja de ser una invasora de Kivotos.\"\n\nDamian Kratzenberg, líder fascista luxemburgués y maestro de griego, continuó hablando con tono cínico durante una copa con Pierre Prüm, político populista de derecha.\n\nMientras servía una copa de vino tinto, las mejillas de Kratzenberg estaban un poco encendidas.\n\n\"Pero sí es cierto que esa mujer actuó ‘por Luxemburgo’. A diferencia de la loca plateada de ahora.\"\n\n\"¿Quiere decir algo en concreto?\"\n\n\"Creo que Rikuhachima no cometió un pecado como para merecer el encierro en el que está. Claro, en los cuentos, el que hace el bien recibe recompensa y el que hace el mal recibe castigo. Sé que esas historias no ocurren así en la realidad. Pero…\"\n\nKratzenberg se bebió la copa de un trago.\n\nClink.\n\nCuando la dejó en la mesa, esta tembló ligeramente.\n\nLa mano de Prüm, que cortaba ternera, se detuvo un segundo.\n\nLos ojos del líder fascista brillaron.\n\n\"Yo perdí a mi familia el día de la Gran Transferencia. Murió mi esposa. Y yo no hice nada. Solo escondí a mis alumnos bajo los pupitres en mi aula de griego y aguanté la respiración.\"\n\nKratzenberg golpeó la mesa con la punta de los dedos.\n\n\"Ese día, la persona que intentó ‘impedir’ que la gente muriera en Luxemburgo capital… está encerrada y usada como marioneta. Eso no me gusta.\n\nLa que intentó tender un puente entre los de Kivotos y nosotros se convirtió en propaganda ambulante para Kivotos.\n\n—Bueno, “ambulante” quizá ni siquiera: está encerrada.\"\n\nPrüm escuchaba con rostro duro.\n\nEra el cuento clásico de justicia moral:\n\nQuien tiende el puente no debería sufrir.\n\nPero Prüm, simple populista, no tenía demasiado interés en la teoría de justicia de Kratzenberg.\n\nLo importante era derribar al gabinete de Asagi que encerró a Rikuhachima y construir un régimen nacionalsocialista.\n\nPrüm preguntó con desgana:\n\n\"Entonces, señor Kratzenberg… ¿qué cree que debemos hacer?\""
 HEU.mutsuki_event.15.a:0 "\"A esa regente… hay que rescatarla.\""
 
 HEU.mutsuki_event.16.t:0 "El tonto y la genio"
 HEU.mutsuki_event.16.desc:0 "‘Luxemburgo es el único Estado nacional legítimo del pueblo germano’,\n\n‘Recuperaremos los territorios del pueblo germano’.\n\nBajo órdenes de Mutsuki, propaganda arrogante empezó a colgarse por todo Luxemburgo.\n\nKayoko lo encontraba divertidísimo.\n\nSentada en una celda solitaria, ver qué tonterías hacía Mutsuki “por Aru”… simplemente le daba risa.\n\nY cuando Mutsuki vino a verla, Kayoko se limitó a mirarla a los ojos.\n\n\"…¿Te divierte?\"\n\n\"…No. Realmente… no es divertido.\" \n\nMutsuki, apoyada en la pared, miró a Kayoko con una tristeza leve.\n\nCansada.\n\nSin esa vibra humorística de ‘kuhuhu’.\n\nUna Mutsuki deprimida.\n\nKayoko no esperaba verla así.\n\n\"Yo solo hago todo esto por Aru-chan. Para convertirla en una heroína. Pero también sé que Aru-chan no lo quiere. Al menos tú, Kayoko… quería que tú me entendieras.\" \n\n\"¿Crees que voy a entender matar gente por Aru?\"\n\n\"Hay demasiadas personas en esta tierra tratando a Aru como una idiota. Para que nunca vuelvan a burlarse de ella, tengo que darle un logro así de grande. Tú lo sabes, Kayoko.\" \n\n\"Lo sé. Pero también sé que Aru no lo quiere. Igual que tú lo sabes. Crear ‘logros’ que Rikuhachima Aru no desea… ¿de verdad es por Aru?\"\n\nMutsuki solo sonrió apenas y negó con la cabeza.\n\nElla misma debe saber que este juego grotesco no tiene sentido.\n\nPero ya llegó a un punto en el que no puede bajarse.\n\n\"Envidio a Kayoko. Siempre vas por el camino correcto. Pero yo, aunque sepa que este camino no es correcto… ya no puedo bajarme.\n\nOye, Kayoko. Si yo termino todo esto y desaparezco… entonces, al lado de Aru, tú—\"\n\n\"…Deja de decir estupideces.\" \n\nKayoko soltó un suspiro profundo."
 HEU.mutsuki_event.16.a:0 "\"Detén esta estupidez. Aunque sea ahora.\""
 
 HEU.mutsuki_event.17.t:0 "La huelga general del Partido Obrero Socialista"
 HEU.mutsuki_event.17.desc:0 "El comunismo luxemburgués estaba dividido en dos grandes fuerzas.\n\nPor un lado, el Partido Comunista de Luxemburgo de Xenon Bernard, que seguía el estalinismo y a ‘Karl Marx’.\n\nPor el otro, el Partido Obrero Socialista, que rechazaba el estalinismo.\n\nEl Partido Obrero tenía una visión mucho peor de los de Kivotos y era mucho más intransigente con el gobierno.\n\nPero ambos compartían una perspectiva de revolución de clase radical.\n\nPor eso, cuando el Partido Obrero advirtió una huelga general exigiendo la liberación de la Regente, muchos intelectuales luxemburgueses lo recibieron como una noticia impactante.\n\nIncluso aunque el partido aclaró que el objetivo no era ‘defender la monarquía’, sino ‘evitar que los de Kivotos manipulen el orden de nuestro pueblo a su antojo’.\n\nVictor Bodson, figura importante del partido, declaró en conferencia:\n\n\"La dirección de la monarquía la decide el pueblo luxemburgués, no un dictador militar extranjero con armas.\""
 HEU.mutsuki_event.17.a:0 "¿Y ustedes qué? ¿Los ‘portavoces del pueblo’?"
 
 HEU.mutsuki_event.18.t:0 "La reacción de las bases del partido de derecha"
 HEU.mutsuki_event.18.desc:0 "El partido de derecha —la fuerza más representativa del ‘anti-Aru’— fue puesto bajo arresto domiciliario total tras la toma del poder del gabinete de Asagi.\n\nPero sus bases no fueron desmanteladas.\n\nEl partido comprendió que Rikuhachima Aru, entre los líderes de Kivotos, era notablemente ‘más suave’.\n\nY con el Parlamento clausurado a la fuerza, empezaron a exigir el regreso de la Regente Rikuhachima.\n\nQue se volvieran fervientes partidarios de Aru solo después de haber sido pisoteados y destruidos era algo desconcertante.\n\nPero los partidos de izquierda celebraron con júbilo la declaración de apoyo a la Regente por parte de esas bases derechistas."
 HEU.mutsuki_event.18.a:0 "Una alianza de villanos. Solo eso."
 
 HEU.mutsuki_event.19.t:0 "La alianza pardo-roja"
 HEU.mutsuki_event.19.desc:0 "GEDELIT, la mayor organización ciudadana de tendencia nazi en Luxemburgo, sentía hacia la Regente Rikuhachima Aru y los partidos de izquierda algo cercano al odio.\n\nPor eso, la reunión del ex primer ministro Pierre Prüm (miembro de GEDELIT) en la sede comunista fue una noticia impactante para muchos intelectuales.\n\n\"Lo importante no es si hay una corona sobre nuestras cabezas o no. Lo importante es si decidimos nuestro futuro nosotros… o si lo decide un invasor armado.\" \n\nTras la reunión, Prüm anunció una ‘declaración nacionalista’ que fue respaldada por nacionalistas germánicos.\n\nAsagi Mutsuki afirma que prepara un plan de ‘Confederación Germana’ por el bien del pueblo germano.\n\nPero Prüm sostuvo que ese proyecto no es una decisión propia de Luxemburgo, sino propaganda de una invasora para justificar su dominio.\n\nAdemás, tras la reunión, Prüm declaró que políticos de GEDELIT y el Partido Comunista se oponen con firmeza a cualquier ‘reunificación germana dirigida por Luxemburgo’, y que Luxemburgo debe vivir en paz.\n\nY, en nombre del anti-guerra, afirmó que comunistas y nacionalsocialistas podrían cooperar en el futuro."
 HEU.mutsuki_event.19.a:0 "...Los odio. Malditos villanos."
 
 HEU.mutsuki_event.20.t:0 "Operación de rescate"
 HEU.mutsuki_event.20.desc:0 "Damian Kratzenberg era nazi.\n\nO, usando la expresión que le gustaba, ¿nacionalsocialista?\n\nLo importante es que, para él, tanto la Regente Rikuhachima Aru como los demás eran simplemente ocupantes externos.\n\nAl menos… así lo pensaba hasta hace poco.\n\nMientras el auto entraba en el bosque oscuro, Kratzenberg apagó el reflector para no ser descubierto por las invasoras con halo.\n\nPero Rikuhachima Aru era distinta.\n\nAl menos, no podía compararse con los demás imbéciles.\n\nElla luchó por todos los de Luxemburgo.\n\nO al menos, luchó por los que murieron ese día… y no por las masacradoras.\n\nKratzenberg recordó a su esposa, Liza, asesinada en la calle el día de la Gran Transferencia.\n\n\"Vamos.\"\n\nDos nazis especialmente fanáticos bajaron también del auto.\n\nLa ubicación del refugio era secreta, pero si observabas a dónde iba la comida y por dónde pasaban apresurados los vehículos militares del gabinete de Asagi, no era imposible encontrarlo.\n\nAprovechando la medianoche, Kratzenberg corrió hacia el refugio con una pistola en la mano.\n\nEs imposible que tres civiles sin experiencia militar sometan a infantería con halo.\n\nPero sí podían, mediante una distracción, desordenarlos por un instante.\n\nLos dos nazis dispararon al cielo desde posiciones separadas.\n\nLos guardias del refugio corrieron hacia el origen de los disparos.\n\nY en ese intervalo, Kratzenberg cortó con una segueta los barrotes de la ventana, tal como había preparado.\n\n\"¿T-tú quién eres?\"\n\nCuando Aru, sorprendida, se acercó al vidrio, Kratzenberg miró a aquella regente de cabello rojo.\n\n¿Por qué?\n\nAunque no se parecían en absoluto, Kratzenberg superpuso en ella la imagen de su esposa, Liza.\n\n¿Porque era una víctima inocente?\n\nNi él mismo lo sabía.\n\nRompió el vidrio y le extendió la mano a Aru.\n\n\"Vengo a rescatarla. A donde está la resistencia de Onikata—\"\n\nEn ese instante sonaron disparos.\n\nLos guardias regresaron, tras abatir a los dos nazis.\n\nKratzenberg entendió que se movían más rápido de lo que pensó.\n\nMierda.\n\nComo siempre: ningún plan sale como uno quiere.\n\nCon la ventana abierta, Kratzenberg apuntó con su pistola hacia la oscuridad.\n\n\"Con tres minutos más… habría sido un éxito.\"\n\n\"No, espera. ¿Vienes a salvarme? Entonces, si ya es tarde, ¡huye y—!\"\n\n\"No sé huir frente a invasores.\" \n\nKratzenberg sabía que obedecer a Aru sería lo más sensato.\n\nPero, por alguna razón, dejar atrás a esta chica que le recordaba a su esposa y salvarse solo otra vez… le dolía demasiado.\n\nAunque sabía que era inútil, se plantó ante la ventana abierta cubriendo a Aru con su cuerpo, y apretó el gatillo hasta que el revólver se quedó sin balas.\n\nLas balas de un fusil de asalto atravesaron a Kratzenberg…\n\nhasta que el grito de Aru cubrió su cuerpo al caer."
 HEU.mutsuki_event.20.a:0 "\"…Perdón.\""
 
 HEU.mutsuki_event.21.t:0 "Operación de rescate fallida"
 HEU.mutsuki_event.21.desc:0 "\"Perdón, Aru-chan. Yo… no quería que muriera nadie que entrara aquí. La regla es capturar con vida… pero ellos, por su cuenta…\"\n\nMutsuki murmuraba en el refugio con la cabeza baja, como una criminal.\n\nAru la miró en silencio.\n\nDice ‘perdón’… pero ¿no estaban los guardias reemplazando con cuidado los barrotes recién cortados por Kratzenberg?\n\nQué historia tan graciosa.\n\nAru levantó la mano y le dio una bofetada brutal a Mutsuki.\n\nLa cabecita de Mutsuki giró, y su cuerpo cayó estampado contra el piso frío.\n\n\"Vete.\"\n\n\"Pero, Aru-chan…\"\n\n\"…Ahora no quiero hablar contigo. Y menos justo después de que alguien murió por mi culpa.\" \n\nMutsuki intentó decir algo, pero al final, apoyándose con dificultad para levantarse, salió del refugio llorando."
 HEU.mutsuki_event.21.a:0 "..."
 
 HEU.mutsuki_event.22.t:0 "Problema de poder en GEDELIT"
 HEU.mutsuki_event.22.desc:0 "Tras la muerte de Damian Kratzenberg, GEDELIT —la mayor organización nazi de Luxemburgo— sufrió un gran vacío de poder.\n\nParece que Pierre Prüm, un simple populista de derecha más que un nazi serio, tomó el liderazgo.\n\nPero los nazis luxemburgueses están inconformes con el mando de Prüm, pues no siente apego por Hitler.\n\nLa muerte de Kratzenberg será una tragedia para los nazis…\n\npero para el gobierno de Asagi es un gran avance hacia la estabilidad nacional.\n\nPor el momento, GEDELIT no podrá reunir fuerzas suficientes como para resistir al gobierno de Luxemburgo."
 HEU.mutsuki_event.22.a:0 "..."
 
 HEU.mutsuki_event.23.t:0 "Me gusta el francés"
 HEU.mutsuki_event.23.desc:0 "Gaston, un niño de doce años, últimamente empezó a disfrutar ir a la escuela.\n\nHasta ahora, el francés había sido tratado como un idioma ‘inferior al alemán’, y como una lengua anticuada que, a largo plazo, debía ‘borrarse’.\n\nPero recientemente, el gobierno de Luxemburgo anunció que apoyaría el francés a fondo.\n\n\"En verdad me va muy mal en las demás materias, pero últimamente la maestra me dice: ‘Menos mal que se te da bien el francés’, y me elogia, ¿sabe?\"\n\nEl dueño de la tienda frente a la escuela sonrió ante el relato confiado de Gaston.\n\nAunque Luxemburgo sea un país germánico, el francés es un idioma refinado, con historia y tradición.\n\nQue suba el estatus del francés también será algo bueno para las generaciones futuras.\n\n\"Aprende francés con ganas. Es una lengua de la que debes sentir orgullo.\""
 HEU.mutsuki_event.23.a:0 "Gaston sonrió con inocencia."
 
 HEU.mutsuki_event.24.t:0 "Aprobación de la ley de derechos civiles"
 HEU.mutsuki_event.24.desc:0 "Con el Parlamento neutralizado, el gobierno militar aprobó una nueva ley de derechos civiles, más fuerte aún.\n\nNakajima, un hombre-perro tendero, observó por televisión la noticia de la aprobación.\n\nMuchos locales afirman que la ley es ‘para los invasores’.\n\nPero, para Nakajima —un simple verdulero—, ¿qué tiene de ‘invasor’?\n\n\"Ese es el futuro correcto. Sí. Nuestro país.\" \n\nPara Nakajima, Luxemburgo ya no era un país solo para los germanos.\n\nEra una nación nueva y progresista, para todos.\n\nEse era el país por el que valía la pena entregar patriotismo."
 HEU.mutsuki_event.24.a:0 "¡Hacia el futuro!"
 
 HEU.mutsuki_event.25.t:0 "Reemplazo de funcionarios"
 HEU.mutsuki_event.25.desc:0 "\"¿Cómo es que últimamente hasta los funcionarios locales son todos monstruos con cabeza de gallina, perro o gato?\"\n\nGeorg se quejó al salir de la oficina postal, desahogándose con su amigo Ulrich.\n\nUlrich asintió en silencio, como si lo entendiera.\n\nEl gabinete de Asagi no tenía mucho cariño por los locales.\n\nTanto, que uno puede entender por qué incluso entre simpatizantes de la derecha se oye: ‘Extrañamos a Rikuhachima’.\n\n\"Dicen que Asagi impuso una cuota de personal de Kivotos en todos los organismos públicos.\"\n\n\"¿Una cuota? ¿Y por eso van a despedir a nuestro pueblo de golpe? ¿Para sentar ahí a esos cabezas de gallina?\"\n\n\"Los vencedores son ellos… no nosotros.\" \n\n\"…Qué mundo tan maldito.\" \n\nGeorg pateó un guijarro del suelo.\n\nComo si eso fuera lo máximo que podía hacer para resistir y mostrar su rabia."
 HEU.mutsuki_event.25.a:0 "Luxemburgo murió."
 
 HEU.mutsuki_event.26.t:0 "¡Kaitenger!"
 HEU.mutsuki_event.26.desc:0 "Con oficiales importantes purgados por la rebelión interna, el alto mando luxemburgués decidió cooperar con una organización externa para dirigir el ejército con más eficiencia.\n\nY esa organización fue… Kaitenger.\n\nKaitenger, tras un acuerdo con Asagi Mutsuki, decidió participar en el mando del ejército luxemburgués y luchar juntos para ‘propagar la justicia’.\n\nSe espera que la gran capacidad de Kaitenger llene el vacío dejado por Kayoko, Schpeller y otros comandantes.\n\nQue Mutsuki de verdad tenga esas expectativas o no es otra historia.\n\nAl menos, eso dice el documento oficial."
 HEU.mutsuki_event.26.a:0 "De verdad no hay alternativa."
 
 HEU.mutsuki_event.27.t:0 "La dimisión de Joseph Bech"
 HEU.mutsuki_event.27.desc:0 "El primer ministro Joseph Bech respiró hondo con calma mientras soldados armados lo detenían y lo confinaban en su casa.\n\nÉl era reaccionario, antidemócrata y odiaba a los de Kivotos.\n\nPor eso mismo, tenía el deber de cerrar con dignidad el final del parlamentarismo luxemburgués.\n\nSin comportarse como un cobarde.\n\nCon nobleza y caballerosidad.\n\nEn el estudio de su casa ya lo esperaban Asagi Mutsuki e Igusa Haruka.\n\nBech recibió de manos de Haruka el documento preparado: una renuncia y transferencia total de autoridad al gabinete de Asagi.\n\nBech miró a ambas un momento y tomó la pluma.\n\n\"¿Por qué no me pegan un tiro y ya, sin tanto teatro?\"\n\nMutsuki respondió con frialdad:\n\n\"…Eso no es divertido.\" \n\n\"¿Divertido? ¿O en realidad es miedo? Porque aun encerrada, la regente Rikuhachima sigue teniendo tu correa en la mano, y tú temes su mirada de odio. …Si es eso, se entiende tu comportamiento cobarde y extraño desde el golpe.\" \n\n\"No te hagas el listo. Si no quieres que te rompa el cuello.\" \n\n\"¿Cree que vendría aquí sin estar dispuesto?\" \n\n\"De verdad… qué viejo tan desagradable.\" \n\nBech firmó y dejó el papel sobre el escritorio."
 HEU.mutsuki_event.27.a:0 "\"¿Ya está? Salga de mi casa de inmediato.\""
 
 HEU.mutsuki_event.28.t:0 "El fin del gabinete de Asagi"
 HEU.mutsuki_event.28.desc:0 "Rikuhachima Aru intentó suicidarse.\n\nLa razón fue, para Mutsuki, el choque más brutal posible:\n\nAru no quería ser la heroína dentro del “globo de nieve” que Mutsuki había creado.\n\nMutsuki quería que Aru fuera feliz.\n\nPero sus actos solo lograron hacerla sufrir.\n\nTras la Declaración de Ley de Unión de Aru, Mutsuki decidió disolver su gabinete.\n\nKayoko y Aru fueron liberadas del encierro.\n\nY Mutsuki decidió entregarse y marchar por voluntad propia al juicio.\n\nMuchos creían que Aru retomaría el gobierno de inmediato…\n\npero Aru ya no quería involucrarse en política directamente.\n\n\"Parece que tengo talento para lastimar a los demás.\" \n\nEso fue todo lo que dijo.\n\nUna frase triste: que ya no participaría en política de forma directa.\n\nLuego, excluyendo al partido de derecha neutralizado, los burócratas del gabinete de Asagi propusieron a Haruka como la siguiente primera ministra.\n\nA Haruka no le gusta estar por encima de nadie.\n\nMás bien lo detesta.\n\nAdemás, el ‘odio a Gehenna’ de Haruka, fruto del acoso masivo que sufrió de parte de estudiantes de Gehenna, ya era bien conocido.\n\nHaruka podía ser una gobernadora militar de un gobierno de ocupación de Trinity sobre Gehenna…\n\npero como símbolo de armonía entre Gehenna, Trinity y los locales, Haruka era demasiado ‘estrecha’ por el tema del racismo.\n\nAl final, todos lo entendieron:\n\nEl gobierno de Haruka existiría muy poco.\n\nPero había un problema que aún nadie conocía.\n\n¿Quién vendría después de Haruka?"
 HEU.mutsuki_event.28.a:0 "...¿Quién llenará el vacío de Mutsuki?"
 
 HEU.mutsuki_event.29.t:0 "Quiero perdonarte"
 HEU.mutsuki_event.29.desc:0 "Mutsuki se entregó.\n\nLa celda individual donde antes estuvo Kayoko se convirtió ahora en la habitación de Asagi Mutsuki.\n\nComo Mutsuki había preparado para Kayoko un cuarto absurdamente bueno, de forma irónica la vida carcelaria de Mutsuki era bastante cómoda.\n\n¿Qué criminal en Luxemburgo puede leer manga en una cama suave dentro de una celda con aire acondicionado?\n\nPero a esa vida le faltaba una cosa.\n\nLa libertad.\n\nTumbada en la cama, Mutsuki estaba experimentando en carne propia lo que le arrebató a Aru.\n\nMutsuki pensaba que hizo todo esto por Aru.\n\nPero no.\n\nAl final, encerró a Aru por ella misma.\n\nNo porque odiara ver a Aru herida…\n\nsino porque a Mutsuki le dolía ver a Aru herida.\n\n\"Ojalá lo hubiera entendido un poco antes.\" \n\nSu murmullo se interrumpió cuando le avisaron que Aru venía a visitarla.\n\nEn teoría, la visita debería ser en una sala especial.\n\nPero Aru, con el privilegio de ‘los de arriba’, entró directamente a la celda.\n\nIgnorar el protocolo y actuar a su antojo… eso también era hardboiled al estilo de Aru.\n\nY Mutsuki también lo había hecho cuando Kayoko estaba encerrada.\n\nAru se sentó en la cama junto a Mutsuki.\n\n\"¿Qué se siente estar encerrada ahora?\"\n\n\"…Sola.\" \n\n\"Yo también lo estuve. Estar sola es muy solitario, Mutsuki. Así que, si este tiempo hace que tú… sientas algo, je… ¿no sería algo bueno?\"\n\nAru le acomodó con cuidado el cabello sobre el hombro.\n\n\"Tu castigo no será grande. …Así que cuando salgas de aquí, vayamos a caminar juntas.\n\nSin política, sin poder, sin pensamientos complicados…\n\ncomo en Kivotos.\n\nPensando solo en nuestra amistad.\n\n¿Qué dices?\"\n\n“Ir a caminar juntas.”\n\nDespués de todo lo que pasó, Aru aun así le ofrecía palabras tan amables.\n\nMutsuki intentó decir algo… pero al final las lágrimas estallaron."
 HEU.mutsuki_event.29.a:0 "...Idiota."
 
 HEU.mutsuki_event.30.t:0 "Ruptura"
 HEU.mutsuki_event.30.desc:0 "Mutsuki se entregó.\n\nLa celda individual donde antes estuvo Kayoko se convirtió ahora en la habitación de Asagi Mutsuki.\n\nComo Mutsuki había preparado para Kayoko un cuarto absurdamente bueno, de forma irónica la vida carcelaria de Mutsuki era bastante cómoda.\n\n¿Qué criminal en Luxemburgo puede leer manga en una cama suave dentro de una celda con aire acondicionado?\n\nPero a esa vida le faltaba una cosa.\n\nLa libertad.\n\nTumbada en la cama, Mutsuki estaba experimentando en carne propia lo que le arrebató a Aru.\n\nMutsuki pensaba que hizo todo esto por Aru.\n\nPero no.\n\nAl final, encerró a Aru por ella misma.\n\nNo porque odiara ver a Aru herida…\n\nsino porque a Mutsuki le dolía ver a Aru herida.\n\n\"Ojalá lo hubiera entendido un poco antes.\" \n\nSu murmullo se interrumpió cuando le avisaron que Aru venía a visitarla.\n\nEn teoría, la visita debería ser en una sala especial.\n\nPero Aru, con el privilegio de ‘los de arriba’, entró directamente a la celda.\n\nIgnorar el protocolo y actuar a su antojo… eso también era hardboiled al estilo de Aru.\n\nY Mutsuki también lo había hecho cuando Kayoko estaba encerrada.\n\nAru se sentó en la cama junto a Mutsuki.\n\n\"¿Qué se siente estar encerrada ahora?\"\n\n\"…Sola.\" \n\n\"Yo también lo estuve. Estar sola es muy solitario, Mutsuki. Pero…\n\nsiendo que lo sabías…\n\n¿por qué lo hiciste?\"\n\nEl ojo frío de Aru, el que ya se había apagado por completo, miró a Mutsuki.\n\nMutsuki sintió un escalofrío.\n\nJamás había recibido esa mirada de Aru.\n\nNi siquiera había visto a Aru mirar así a otra persona.\n\nNo quedaba ni rastro de su faceta de “torpe”.\n\nPuro desprecio.\n\n\"Tu castigo no será grande. Podrías salir pronto.\n\nPero… quizá este sea el castigo.\n\nLo nuestro termina hoy.\n\nEs la última vez que te veo.\n\nRompemos.\n\n¿Eso te basta?\"\n\n\"A-Aru-chan, pero…\"\n\n\"¿Chan? ¿Ya olvidaste todo lo que me hiciste?\"\n\nAru miró a Mutsuki sin emoción."
 HEU.mutsuki_event.30.a:0 "Tú… nunca fuiste mi amiga."
 HEU.mutsuki_event.31.t:0 "Elección del Primer Ministro"
 HEU.mutsuki_event.31.desc:0 "Incluso después de la 'Ley de Unión' de Luxemburgo, que proclamaba que Gehenna, Luxemburgo y Trinity formarían una alianza en pie de igualdad, entre los tres países —unidos por la guerra— seguía flotando un aire gélido. El pleno conjunto de Luxemburgo, Gehenna y Trinity, reunido para decidir al próximo Primer Ministro, tampoco tenía precisamente un ambiente cordial. Luxemburgo con 10 delegados; las otras dos academias, 5 cada una. Con un total de 20 votos, se decidiría al próximo Primer Ministro. El representante de Luxemburgo, Charles Marx, habló con voz cínica.\n\n\"No quedarán satisfechos sin importar quién sea el Primer Ministro. ¿Acaso no saben que la presuntuosa 'Ley de Unión' de los capitalistas redujo a cenizas a los tres países? Simplemente elévenme a mí como Primer Ministro. Presentaré la solicitud de adhesión como Estado miembro de la Unión Soviética y pondré fin a esta farsa.\"\n\nUna de las representantes de Trinity, Aomori Mine, se burló. \"Vaya, qué magnífica petición de apoyo. ...El próximo Primer Ministro debe salir de nuestra Trinity. Si de verdad quieren demostrar que su guerra no fue una invasión, sino una unión igualitaria de tres naciones, entonces sí. Por supuesto, por el bien de la armonía, Trinity debe obtener un puesto, ¿no le parece?\"\n\nLuego fue el turno de Amau Ako. Tras dar un sorbo a su té de manzanilla, habló con frialdad. \"En el plano ideal, sí. Pero con solo ver que la delegación de Luxemburgo tiene el doble de miembros, yo no puedo confiar demasiado en esta Ley de Unión.\"\n\"Si no confía, ¿acaso tiene alguna alternativa?\"\n\"Nosotros, Gehenna... le daremos todos nuestros votos al candidato de Luxemburgo. A largo plazo, esa es la mejor manera de ampliar la autonomía de Gehenna dentro de esta unión estatal. ¿No es así?\"\n\nCuando Ako giró la cabeza, Satsuki, la otra representante de Gehenna, solo asintió con gesto seco. Total, antes que votar por un candidato que inevitablemente perderá, era mejor volcarse en bloque a un político luxemburgués y enviar el mensaje de que respaldaban su dominio. En esta realidad, era la opción más sensata.\n\nMine era la de mayor rango entre los representantes de Trinity, todos miembros de la Orden de Socorro. En la práctica, sería ella quien decidiría los cinco votos de Trinity. ...Trinity también tenía que tomar una decisión racional para asegurarse una posición en el nuevo Estado. Mine miró de frente a Ako y preguntó:\n\n\"...Entonces, ¿a qué candidato piensan apoyar ustedes con sus votos?\""
 HEU.mutsuki_event.31.a:0 "\"La señorita Kayoko es la líder más razonable. No quiero admitirlo, pero es competente.\""
 HEU.mutsuki_event.31.b:0 "\"La señorita Asagi. Está derrumbada por la culpa, así que es perfecta para ser manipulada desde fuera.\""

 HEU.mutsuki_event.32.t:0 "Nuevo Primer Ministro de Luxemburgo"
 HEU.mutsuki_event.32.desc.a:0 "Después de haber pasado por todo aquello, Kayoko se sentó en la silla de la residencia del Primer Ministro con el rostro agotado. Aru dijo que ya no se involucraría más en la política. Es decir, ahora Kayoko heredaría todo lo que Aru había hecho, y todo lo que, tras el golpe, había hecho Mutsuki. Kayoko pudo sentir la mirada preocupada de Haruka, sentada frente a ella. '¿De verdad estarás bien?', sin duda era eso lo que Haruka estaba diciendo.\n\nNo estaba bien en absoluto.\n\n\"...Fue un tablero que Mutsuki armó a la fuerza, pero si este tablero se derrumba... sí. Aru sería infeliz.\"\n\nKayoko asintió.\n\n\"...Entonces, me toca a mí cargar con toda la responsabilidad.\""
 HEU.mutsuki_event.32.desc.b:0 "Mutsuki se sentó en su asiento con el rostro agotado. En un principio, su intención era: después de establecer la Ley de Unión, devolvérselo todo a Aru y abandonar el cargo de Primer Ministro. Pero se vio obligada a regresar. Gehenna y Trinity —ambas academias— habían concluido que podrían manejar como una marioneta a Mutsuki, una Primera Ministra surgida de los líderes rebeldes, y por tanto la de menor legitimidad de todas. Mutsuki observó el documento del 'Presupuesto de Socorro de Trinity' que Aomori Mine le había enviado. Incluso antes de que terminara la ceremonia de investidura, Trinity ya se estaba moviendo.\n\nTodo esto era culpa suya. Porque ella había atormentado a Aru, porque la había hecho sufrir. Para expiar el pecado de todo lo que había hecho, Mutsuki no tenía más remedio que cumplir este castigo."
 HEU.mutsuki_event.32.a:0 "La política no es un asunto sencillo."

 HEU.mutsuki_event.33.t:0 "El final de la historia"
 HEU.mutsuki_event.33.desc.nomal_ending:0 "Aru pedaleaba en bicicleta por las calles de la ciudad de Luxemburgo. Durante toda la guerra, ella no había hecho más que permanecer confinada, pero mientras tanto, el apoyo popular hacia Aru había crecido sin cesar. Para la población de origen Kivotos en Luxemburgo, era la heroína de la Ley de Unión. Para la izquierda luxemburguesa, una mártir oprimida por el gabinete de Asagi. Para la derecha, una líder tan noble que ni siquiera podía compararse con Mutsuki. Y, además, se le otorgó el elegante título de heroína de la Ley de Derechos Civiles. En cualquier caso, estaba muy lejos del hardboiled.\n\n\"¡Aru-sama!\"\n\nHaruka, también en bicicleta, la seguía desde atrás. Muchas cosas habían cambiado. Pero otras no. Haruka y Kayoko. El vínculo con ellas dos no se había roto. Aru giró la mirada. Debido a su ojo perdido, su campo de visión estaba limitado, pero al cambiar de ángulo pudo ver mejor. Allí estaba Kayoko, de pie en la calle, con un traje elegante, saludándola con la mano.\n\nLas heridas del corazón de Aru no habían sanado por completo. Todavía tenía pesadillas en las que Mutsuki la secuestraba y la confinaba. Pero...\n\n\"Aru.\"\n\nMientras giraba la cabeza y pedaleaba, Aru no vio la piedra frente a ella. Kayoko corrió y sujetó la bicicleta que se tambaleaba. Aru sonrió con timidez y cruzó miradas con Kayoko. Todo este sufrimiento, algún día, podrá superarse. Porque están ellas dos."
 HEU.mutsuki_event.33.desc.good_ending:0 "Tras la proclamación de la Ley de Unión, en la costa del norte de Deutschland. Hacía mucho tiempo que las cuatro integrantes de la Agencia 68 no se reunían para visitar el mar. Aru contempló el océano. Debido a haber perdido un ojo, el paisaje marino se veía parcialmente recortado. Aru ya no podía abarcar con su mirada aquel vasto mundo. Pero al darse la vuelta... podía ver a las tres personas.\n\nAunque no pudiera contener el mundo entero con su mirada, estaba bien. Le bastaba con poder ver a esas tres personas, pequeñas y sencillas, que simbolizaban la vida cotidiana de Rikuhachima Aru.\n\n\"Han pasado tantas cosas, ¿no?\"\n\nKayoko suspiró.\n\n\"No es algo que pueda resumirse como 'tantas cosas'.\"\n\"No me gustan mucho las explicaciones largas y pedantes.\"\n\nAru se dio la vuelta, dejando que la brisa marina le rozara el rostro.\n\n\"No podemos hacer como si lo que ya ocurrió no hubiera pasado. Aunque lo que hizo Mutsuki pueda ser perdonado por la ley, moralmente no puede serlo. Y, en realidad, si fue perdonada por la ley, fue solo porque la gente de Mutsuki llenó la burocracia, no porque la gente de este país la haya perdonado, ¿no?\"\n\nPor un instante, la expresión de Mutsuki se endureció. \"...Aru-chan se ha vuelto más aguda. Incluso tu perspicacia...\"\n\n\"No podemos cambiar el pasado. Pero sí podemos tomar decisiones diferentes en el presente. Así que... Mutsuki también, esforcémonos para que en el futuro puedas ser perdonada por otras personas, no solo por mí.\"\n\"¿Crees que pueda hacerlo?\"\n\"...Si fuera yo, sería imposible.\" \"¿Qué?\"\n\nAru sonrió débilmente. \"Pero tú no eres yo, Mutsuki.\""
 HEU.mutsuki_event.33.a:0 "Todavía nos tenemos los unos a los otros."

 HEU.mutsuki_event.34.t:0 "La restauración del Parlamento"
 HEU.mutsuki_event.34.desc:0 "Con la elección de un nuevo Primer Ministro, la democracia paralizada de Luxemburgo resucitó. Según el sistema federal, Gehenna, Trinity y Luxemburgo dividirán sus territorios en cantones y elegirán representantes para formar el Parlamento.\n\nEl partido de derecha, debido a la represión del gabinete de Asagi, fue prácticamente disuelto. Sin embargo, Emil Richter, liberado tras un largo arresto domiciliario, reunió a los simpatizantes de la derecha y proclamó la fundación del Partido Popular Cristiano Social (Christlich-Soziale Volkspartei). El CSV abandonó las tendencias reaccionarias tradicionales, como la negación de la democracia, pero planea incorporar incluso a la población germánica del territorio original de Deutschland como base de apoyo del nuevo partido.\n\nAl obtener todo Deutschland conforme a la Ley de Unión, las fuerzas nazis recuperaron influencia dentro de Luxemburgo. Pierre Prüm, quien tomó el control de GEDELIT tras la muerte de Damian Kratzenberg, planea proclamarse a sí mismo como el verdadero sucesor del Partido Nacionalsocialista Alemán. Aunque Prüm no es nazi, sabe que en el nuevo Deutschland proclamarse nacionalsocialista es la forma más eficaz de ganar el apoyo de la extrema derecha. Los antiguos miembros del partido nazi en la región de Gehenna ya han comenzado a reunirse en torno a Prüm. Incluso se reunió con Albert Speer, amigo de Hitler, para representar la imagen de ser el \"heredero legítimo\" del nazismo.\n\nEl Partido Comunista de Luxemburgo, basándose en el principio del socialismo en un solo país, integró la organización del Partido Comunista Alemán (KPD), pero parece que los partidos de las antiguas regiones de Deutschland no están obedeciendo las directrices del mucho más pequeño y débil Partido Comunista luxemburgués. Además, el conflicto ideológico con el Partido Obrero Socialista, un partido socialista antistalinista, se está intensificando.\n\nGehenna y Trinity, tras la completa caída de la Pandemonium Society y la organización Tea Party, se están uniendo en torno a Amau Ako y Aomori Mine. Mine y Ako actúan no como partidos políticos, sino como representantes de academias enteras, intentando mantener la autonomía local de las academias dentro del nuevo Estado liderado por Luxemburgo. Bajo la Ley de Unión, se les otorga una autonomía extremadamente amplia, por lo que se estima que los representantes de Gehenna y Trinity podrán ejercer un nivel de autonomía comparable al de los gobernadores de los Estados Unidos."
 HEU.mutsuki_event.34.a:0 "Desde el Parlamento central, hasta las asambleas autonómicas de Gehenna y Trinity."

 HEU.mutsuki_event.35.t:0 "Rechazo de la Ley de Derechos Civiles"
 HEU.mutsuki_event.35.desc:0 "Tras el debate sobre la Ley de Derechos Civiles, Aru comenzó a visitar personalmente, como último recurso, las oficinas de los diputados del partido de derecha, uno por uno. Inclinando la cabeza, les suplicaba que trabajaran por la aprobación del proyecto de ley en nombre de todo el pueblo de Luxemburgo. Por supuesto, no funcionó. Los periodistas se enteraron rápidamente (gracias a contactos del ala conservadora del partido de derecha), y la imagen de Aru inclinando la cabeza fue captada por los medios y convertida en noticia. Aru se convirtió en objeto de burla, y a mitad del proceso el partido de derecha incluso se negó a reunirse con ella.\n\nAru fracasó.\n\nA pesar del voto favorable del Partido Comunista de Luxemburgo y del Partido Radical Liberal, el bloque opositor del partido de derecha impidió que la votación alcanzara la mitad de los escaños. La Ley de Derechos Civiles fue rechazada, y se anunció que no volvería a ser presentada al Parlamento. El esfuerzo de Aru por obtener los derechos de Kivotos en Luxemburgo mediante procedimientos legales desapareció entre las risas del partido de derecha."
 HEU.mutsuki_event.35.a:0 "\"...Así soy yo. Una idiota que finge ser hardboiled.\""

 HEU.mutsuki_event.36.t:0 "La percepción sobre Aru"
 HEU.mutsuki_event.36.desc:0 "Tras el rechazo de la Ley de Derechos Civiles, la percepción de Aru entre la población de origen Kivotos sufrió un duro golpe. Desde críticas directas como \"¿Tanto ruido para este resultado?\" hasta burlas que afirmaban que intentar obtener concesiones de los locales mediante la política parlamentaria era una idea absurda desde el principio, innumerables opiniones negativas se desataron. El Palacio del Gran Duque de Luxemburgo se encuentra en un estado de caos debido a los enfrentamientos entre manifestantes que buscan criticar a Aru y manifestantes progubernamentales que defienden que ella \"hizo lo que pudo\"."
 HEU.mutsuki_event.36.a:0 "\"...\""

 HEU.mutsuki_event.37.t:0 "El límite de la paciencia de Mutsuki"
 HEU.mutsuki_event.37.desc:0 "Asagi Mutsuki no es una villana. Aunque se la llame pequeña demonio y haya hecho innumerables bromas, sus \"bromas\" siempre se mantuvieron en un nivel ligero, al igual que el \"hardboiled\" de Aru. La razón por la que la paciencia de Asagi Mutsuki estaba llegando a su límite era simple: no solo los locales, sino incluso la población de origen Kivotos, que debería ser la principal base de apoyo de Aru, la trataba como una inútil. ¿Qué estaba mal?\n\n\"...¿No crees que deberíamos convertir a Aru en una heroína?\"\n\nAnte las palabras vacías de Mutsuki, Kayoko respondió con frialdad.\n\n\"Quieres que mucha gente apoye a Aru. Entiendo tu intención. Pero no puedes manipular el corazón de las personas. ¿Qué eres, Kyogoku Satsuki?\"\n\"¿Kyogoku?\" \"...Existe alguien así.\"\n\nSentada con las piernas cruzadas, Kayoko miraba a Mutsuki sin emoción. Kayoko sabía que el estado psicológico de Mutsuki últimamente no era normal. Al ver cómo la Aru que ella idealizaba era ridiculizada y desgastada, Mutsuki estaba volviéndose poco a poco... extraña. Sus manos temblorosas, y su hábito de mirar por la ventana mientras murmuraba una y otra vez que debía convertir a Aru en una heroína. Pero Kayoko no podía hacer nada.\n\nSolo podía desear que tanto Mutsuki como Aru fueran capaces de superar esta prueba por sí mismas."
 HEU.mutsuki_event.37.a:0 "\"...\""

 HEU.mutsuki_event.38.t:0 "En el amor no hay mentira - 1"
 HEU.mutsuki_event.38.desc:0 "Rikuhachima Aru intentó suicidarse por envenenamiento en la casa segura donde había estado confinada. Era evidente que uno de los vigilantes externos, influenciado por Aru, le había entregado el veneno, pero lo más importante ahora no era encontrar al culpable, sino salvar a Aru. Sin Kayoko Onikata, que también estaba confinada, Mutsuki y Haruka subieron llorando a la ambulancia y observaron a Aru mientras recibía primeros auxilios. ¿Qué habría dicho Kayoko si hubiera visto esta escena? Mutsuki solo pudo bajar la cabeza y dejar caer lágrimas en silencio.\n\nEn la ambulancia, los paramédicos intercambiaban preguntas y respuestas casi como gritos. \"Con nuestra medicina no es suficiente. Traigan a un médico de Kivotos.\"\n\"¿También gente de Trinity?\"\n\"¡Gehenna, Trinity, lo que sea, tráiganlos a todos!\"\n\nCuando la ambulancia llegó al hospital, estaban allí Aomori Mine, como si acabara de salir de un campo de prisioneros de Trinity sin siquiera poder vestirse adecuadamente, y Hino Miya Chinatsu de Gehenna. Chinatsu miró por un instante a Mutsuki, la causa de toda la situación, y luego sujetó la camilla donde yacía Aru.\n\n\"La paciente ha ingerido cianuro y actualmente se encuentra inconsciente. Señorita Mutsuki, ¿usted es su tutora legal?\"\n\"Sí. Yo soy...\"\n\"La llevaremos a urgencias. Espere afuera.\""
 HEU.mutsuki_event.38.a:0 "Mientras Aru desaparecía, Mutsuki no pudo hacer absolutamente nada."

 HEU.mutsuki_event.39.t:0 "En el amor no hay mentira - 2"
 HEU.mutsuki_event.39.desc:0 "Mutsuki no fumaba, pero hoy tenía unas ganas terribles de hacerlo. Aunque se había convertido en la líder del Gran Principado Germánico, la mayor potencia de Kivotos, Mutsuki se encontraba más pequeña que nunca, encogida en el pasillo del hospital. Frente a ella, Haruka la observaba en silencio. El pasillo estaba envuelto en un silencio incómodo. La primera en hablar fue Haruka.\n\n\"Perdón por haberla insultado y golpeado en la casa segura. Pero creo que tengo que decir esto.\"\n\"...Dilo.\"\n\"Todo esto pasó por su culpa. Ahora hay que terminar con el confinamiento de la señorita Aru. Ella... no quería convertirse en la heroína de Snowglobe. Así que... deténgase.\"\n\n¿Había sido alguna vez Haruka tan firme al expresar su opinión? La Haruka que Mutsuki conocía no era así. No. Mutsuki sabía que ese pensamiento era absurdo. ¿Cuántos años habían pasado desde la Gran Transición? Haruka ya no era la Haruka del pasado. Ella también tenía sus propias ideas, y especialmente después del golpe de Estado... había reflexionado durante mucho tiempo sobre qué era lo mejor para Aru. La única que no había cambiado era Mutsuki. Sentada en el suelo, habló con voz débil."
 HEU.mutsuki_event.39.a:0 "\"Yo solo... hice todo esto por Aru-chan.\""

 HEU.mutsuki_event.40.t:0 "En el amor no hay mentira - 3"
 HEU.mutsuki_event.40.desc:0 "A medida que el tratamiento se prolongaba, personas llegaron incluso desde hospitales más lejanos. Mutsuki observaba, sentada en el suelo, cómo Himuro Sena y el personal del Departamento de Emergencias corrían hacia el interior. ¿Podría Aru sobrevivir? Mutsuki intentó no pensar en cosas ominosas, pero su mente se llenó de las peores posibilidades, hasta el punto de que le faltaba el aire. Secándose las lágrimas con el dorso de la mano, dijo:\n\n\"Nunca quise convertir a Aru-chan en la heroína de Snowglobe. Es solo que... el mundo exterior era demasiado cruel para Aru-chan. Pensé que, para protegerla, no había otra opción. Pero nunca imaginé que Aru-chan, ni los demás, lo interpretarían así... Yo... sí. Solo miraba las cosas desde mi propio punto de vista.\"\n\nMutsuki recordó las palabras que había dicho cuando confinó a Aru hace mucho tiempo. Aru es mi sol. Yo seré Plutón, orbitando eternamente a su alrededor desde lejos, sin poder alcanzarla. ...Aquellas palabras significaban que la ayudaría desde lejos, aunque no fuera reconocida por ella. Pero, en consecuencia, al estar demasiado lejos de Aru, terminó sin comprender su corazón hasta el final, abandonada en soledad, conduciendo a un desenlace melancólico."
 HEU.mutsuki_event.40.a:0 "\"Al final, esto no fue por Aru-chan.\""

 HEU.mutsuki_event.41.t:0 "En el amor no hay mentira - 4"
 HEU.mutsuki_event.41.desc:0 "Después de aquel incidente, Kayoko seguía confinada, pero fue liberada de urgencia al oír que Aru podía morir. En cuanto Kayoko llegó al hospital, se acercó directamente a Mutsuki, que se había puesto de pie. Kayoko levantó la mano como si fuera a abofetearla, pero dudó un instante y la bajó. Al fin y al cabo, para Kayoko, más conflicto... era algo que ya había sobrepasado el nivel que podía soportar.\n\n\"¿Estás satisfecha?\"\n\"...¿Cómo podría estarlo?\" \"Me alegra que no lo estés. ...Aru va a despertar. No es una chica que vaya a morir en un lugar como este.\"\n\nCon el rostro agotado, Kayoko se pasó la palma por la cara.\n\n\"Mutsuki. Hasta ahora... lo siento. No me di cuenta de que cargabas con ese tipo de angustia, y de que estabas en un estado mental en el que eras capaz de hacer cualquier cosa por Aru. No... sería más correcto decir que lo sabía, y aun así no hice nada. Actué como si no supiera que estabas al límite, como si no fuera a llegar el día en que explotarías. Esto... como tu compañera, fue una negligencia imperdonable. Así que...\"\n\"Está bien, Kayoko. No tienes que disculparte.\"\n\nMutsuki se secó el rabillo del ojo con el dorso de la mano.\n\n\"Porque todo... fue culpa mía.\""
 HEU.mutsuki_event.41.a:0 "Por fin, las dos se reconciliaron."

 HEU.mutsuki_event.42.t:0 "En el amor no hay mentira - 5"
 HEU.mutsuki_event.42.desc:0 "Aomori Mine salió de urgencias con el rostro exhausto. Llevar ayuda a donde se necesitara era el propósito de su vida, pero socorrer a alguien que se había tragado cianuro con intención de morir era un dolor insoportable. Y aun así, al ver a las tres reunidas frente a la puerta de urgencias... Mine sintió que esta ayuda tenía un significado claro. Tras tomar aire una vez, dijo:\n\n\"La señorita Rikuhachima va a sobrevivir.\"\n\"E-¿eso quiere decir...?\"\n\"Sí. Lo logramos.\"\n\nAnte esa palabra, “lo logramos”, las tres se abrazaron y rompieron a llorar, y Mine olvidó por completo los odiosos conflictos e ideologías entre Trinity y Gehenna. Y... Mine deseó que, de aquí en adelante, ellas pudieran recomponer su relación con Aru."
 HEU.mutsuki_event.42.a:0 "Hacia el futuro"

 HEU.mutsuki_event.43.t:0 "Se acerca una guerra aún mayor"
 HEU.mutsuki_event.43.desc:0 "[ROOT.GetNameDef] no se conformará con el Gran Principado Unido de Luxemburgo. Al final, el objetivo definitivo de Mutsuki era conquistar ambas academias, Trinity y Gehenna. ¿Cómo podría detenerse aquí? Su tarea de convertir a Aru en una heroína aún no había terminado. Aunque Mutsuki le oculte esa verdad a Aru, ¿cómo podría Aru no darse cuenta para siempre? Aru contempla Luxemburgo a través de una ventana de vidrio reforzada con barrotes. No debe derrumbarse. Por doloroso que sea, tiene que aguantar. Cuanto más difíciles sean los tiempos, más debe Aru convertirse en un lugar al que otros puedan regresar. Tras una breve respiración profunda, Aru esboza una sonrisa tenue."
 HEU.mutsuki_event.43.a:0 "Aunque no sea momento para sonreír."

 HEU.mutsuki_event.44.t:0 "Su Majestad el Kaiser Wilhelm..."
 HEU.mutsuki_event.44.desc:0 "Cuando el Gran Ducado de Luxemburgo conquistó Gehenna y se expandió como un principado unido, el Kaiser Wilhelm obtuvo una pequeña esperanza. ¿No estaría por llegar una oportunidad de restaurar el Imperio de Deutschland sobre el que había reinado como emperador? Mutsuki mantenía a Aru confinada y bajo control, pero aun así seguía temblando ante ella, incapaz de imponerse. Wilhelm repartió grandes sumas de dinero entre los burócratas del gabinete de Asagi —una inversión que, considerando que se había empobrecido tras su exilio en Luxemburgo, fue una decisión enorme— y obtuvo permiso para reunirse con Aru durante una hora.\n\nLa casa segura de Aru. Wilhelm, como si quisiera demostrar su valía a toda costa, agitó los brazos con energía frente a Aru, presumiendo su “vigor”, y dijo:\n\n\"...El principado unido acabará avanzando hasta Berlín. Yo también quiero aportar en ese proceso. Sí. Hablo de la restauración del Imperio de Deutschland.\"\n\"Entonces, ¿quieres convertirte en rival de Mutsuki?\"\n\"¡No! ¡No, no! No un rival, una socia. ¿No existía también en China un concepto como el de una 'corte menor' de la dinastía Qing? Si me regalan un palacio en Berlín, una asignación para mantener la dignidad y un pequeño portátil de última generación...\"\n\n...\n....\n\nWilhelm salió arrastrando los pies de la casa segura, con una expresión incapaz de comprenderlo. \"Pero... ¿por qué me echó?\""
 HEU.mutsuki_event.44.a:0 "Pero sí que fue gracioso."

 HEU.mutsuki_event.45.t:0 "¿Una alianza con GEDELIT?"
 HEU.mutsuki_event.45.desc:0 "Dentro del Partido Comunista de Luxemburgo, ha surgido un movimiento que propone presentar al difunto Damian Kratzenberg como un mártir y aliarse con GEDELIT. El líder del partido, Zennon Bernard, ve este plan con buenos ojos, pensando que sería una oportunidad de alianza con el enemigo para expandir la influencia política del comunismo. Al fin y al cabo, por mucho que conviertan a un nazi muerto en un mártir, no puede resucitar para convertirse en un rival político, ¿no? Y su sucesor, Prüm, no es más que un simple populista.\n\nSin embargo, quien sofocó dentro del partido esa idea de aprovechar la muerte de un nazi fue Charles Marx. Adoptó una postura dura, la más feroz, degradando la muerte de Kratzenberg como algo insignificante y sin valor.\n\n\"La vida de una persona no puede evaluarse por si actuó con valentía o no durante unos pocos segundos antes de morir. Se juzga observando toda su existencia. Un hombre que, antes de la Gran Transición, echaba espuma por la boca hablando del judeo-bolchevismo y del espíritu de Hitler, no puede convertirse en un noble mártir solo porque haya sido valiente durante unos segundos antes de morir. Y concebir la idea de cooperar con los nacionalsocialistas a partir de su muerte no es más que una fantasía absurda.\"\n\nAunque no fue más que un debate interno del partido que ni siquiera llegó a oídos de GEDELIT, al final la propuesta del líder Zennon Bernard fue frustrada por Marx, un estalinista aún más intransigente."
 HEU.mutsuki_event.45.a:0 "Movimientos dentro del partido"

 HEU.mutsuki_event.46.t:0 "Descontento entre los de Gehenna"
 HEU.mutsuki_event.46.desc:0 "Tras el golpe de Estado de Mutsuki, algunos esperaban una gran purga cometida por los de Gehenna. Formar a los políticos del partido de derecha en una fila y barrerlos con ametralladoras; dominar por completo a los locales; el plan soñado. Pero la dictadura de Mutsuki fue mucho más endeble de lo que muchos entre la población de Gehenna habían esperado. Porque incluso con todo el poder en sus manos, Mutsuki seguía inquietándose ante la idea de ser odiada por Rikuhachima Aru.\n\nMutsuki solo quería proteger a Aru y convertirla en una heroína adorada por la gente de esta tierra. Pero lo que el pueblo de Gehenna deseaba era la destrucción total del orden estatal de Luxemburgo y su completa “kivotosización”. Como sus posturas no coincidían, el gabinete de Asagi tampoco pudo ganar gran popularidad ni siquiera entre los de Gehenna.\n\nPero... ¿acaso puede ella comprar el odio de Aru por el bien de ellos?"
 HEU.mutsuki_event.46.a:0 "No por ustedes, sino por Aru-chan..."

 HEU.mutsuki_event.47.t:0 "Autoproclamada “Emperatriz Cerebral”"
 HEU.mutsuki_event.47.desc:0 "\"¿Que Mutsuki es una 'Emperatriz Cerebral' que huyó tras caer del poder?\"\n\"¿No suena absurdo?\" \"Pero en realidad, nadie de los nuestros ha visto a la Emperatriz Cerebral, ¿no? Tal vez los consejeros de la Pandemonium Society la hayan visto en persona...\"\n\nLa proclamación de Mutsuki como Emperatriz Cerebral no tenía fundamento alguno, pero, a la inversa, tampoco había una forma de refutarla. Y después de que Mutsuki ocupara el Distrito Central, aquello fue todavía más cierto. Una vez que Mutsuki tomó el control del corazón de la Pandemonium Society, la opinión pública empezó a inclinarse hacia la posibilidad de que Mutsuki realmente fuera la Emperatriz Cerebral. Mientras el ejército de Mutsuki avanzaba por el Distrito Central, algunos ciudadanos de origen Gehenna la recibían con entusiasmo, llamándolo “el regreso de la Emperatriz Cerebral”. Pero otro grupo de estudiantes, aun estando de acuerdo con la posibilidad de que Mutsuki fuera la verdadera Emperatriz Cerebral, sostenía que precisamente por eso Mutsuki no debía volver jamás a Gehenna.\n\nQue un tirano militarista regresara a esa Gehenna bella y libre, al frente de un ejército, para reconquistarla una vez más... para los Gehenna “liberales”, eso debió ser un golpe imposible de describir. Sin embargo, había alguien que miraba con desprecio a esas estudiantes “liberales”. Alguien que había sido maltratada en Gehenna, acosada en grupo, y que sabía que la supuesta libertad de la que hablaba Gehenna no era más que llevarle unas tijeras a la cabeza de una chica y cortarle el cabello a la fuerza. Alguien que pensaba que la tierra de la Pandemonium Society era un nido de víboras aún más repugnante que Trinity.\n\n\"...Yo odio a Gehenna.\"\n\nDespués del desfile de la victoria, Haruka, de pie en el Distrito Central, le habló a Mutsuki con total frialdad. \"Sé que usted no es la verdadera Emperatriz Cerebral, jefa Mutsuki. Pero yo quiero que usted se convierta en la verdadera Emperatriz Cerebral. Y que, sí... quemando esta ciudad maldita... la purifique. Que anuncie el regreso de la Emperatriz Cerebral.\"\n\"¿Y por qué tendría que hacer eso? Eso, seguro que Aru-chan también...\"\n\"Estará de acuerdo. Aru-sama también. ¿No le hizo Gehenna lo mismo a Luxemburgo? Solo estamos devolviéndolo.\""
 HEU.mutsuki_event.47.a:0 "Haruka... esto, kufufu… para ser una broma, te pasaste, ¿no?"
 HEU.mutsuki_event.47.b:0 "No dejaré que mueran civiles. Aru lo odiaría. Pero… quememos el edificio del parlamento."

 HEU.mutsuki_event.48.t:0 "La verdadera Emperatriz Cerebral"
 HEU.mutsuki_event.48.desc:0 "Haruka sintió un éxtasis al contemplar el edificio del parlamento de la Pandemonium Society de Gehenna ardiendo violentamente en llamas. Las risas de las chicas que le cortaban el cabello a la fuerza con tijeras, los puños que se le venían encima, las patadas, las burlas... todo parecía desvanecerse junto con el parlamento en llamas. Gehenna debía ser así. Desde mucho antes, debía haber sido así.\n\nJunto a Haruka, que miraba el parlamento con una sonrisa tenue, Mutsuki parecía tan ansiosa que no dejaba de retorcer los dedos, como si hasta observar aquella escena le resultara insoportable.\n\n\"Haruka-chan. Sabes que esto... no es divertido, ¿verdad?\"\n\"Fufu. Sí. Es solo... por mi pequeña venganza. Para usted, jefa, seguro es una escena nada divertida. Pero, sí. Si esto es el poder de la Emperatriz Cerebral... entonces yo también quiero ser la Emperatriz Cerebral.\"\n\"...¿Hah?\"\n\nQuerer ser la Emperatriz Cerebral. La confesión franca de Haruka, que jamás había dicho ni una sola vez que quisiera ponerse por encima de los demás, dejó a Mutsuki desconcertada. Bueno, debía ser una broma. Haruka no era alguien capaz de pararse sobre la cabeza de otros. Pero ¿por qué? Mutsuki sintió una inquietud extraña: que las palabras de Haruka no eran una broma. Esos ojos encendidos de odio mirando el parlamento en llamas, y ese puño apretado con tanta fuerza que le temblaba la mano, le estaban diciendo: “Haruka no está bromeando”.\n\nMutsuki quiso darse la vuelta. Pero, por alguna razón, la más joven de la Agencia 68 —alguien que Mutsuki debía conocer mejor que nadie— hoy parecía una persona completamente distinta."
 HEU.mutsuki_event.48.a:0 "Puede que Haruka tenga más talento para gobernar que yo."

 HEU.mutsuki_event.49.t:0 "El regreso de Aru"
 HEU.mutsuki_event.49.desc:0 "Aru recuperó su libertad cuando el caso de confinamiento terminó, pero ya no tenía interés por la política ni por “buscar el hardboiled”. Sigue en el Palacio del Gran Duque, se reúne con sus amigas de la Agencia, y continúa firmando documentos, pero ya no le queda voluntad de hacer nada más allá de ser una monarca constitucional. Y con eso era suficiente. Aru ya había sufrido demasiado, y nadie podía atreverse a decir que Aru debía volver a ser arrastrada a la arena política para sufrir otra vez.\n\nAhora, el mayor “trabajo” de Aru se redujo a paseos en bicicleta, o a duelos de juegos de consola contra Kayoko. Aunque, debido a su discapacidad visual y en la mano, jamás pudo vencer a Kayoko en juegos de pelea que exigieran físico.\n\nAru ha vuelto. Y ahora, todos deben compartir la carga que Aru llevaba. Porque Aru está demasiado cansada para seguir cargándola sola. Aun así, Aru seguirá siendo la protectora de Luxemburgo. Y si, por casualidad, esta tierra que tanto aprecia llega a arder por el peligro de una guerra, ella volverá a tomar un arma y se lanzará al frente. Porque, cuando se trata de proteger a las personas que ama, Rikuhachima Aru es capaz de hacer cualquier cosa."
 HEU.mutsuki_event.49.a:0 "Me alegra que hayas vuelto."

 HEU.mutsuki_event.50.t:0 "¿Host de Trinity?"
 HEU.mutsuki_event.50.desc:0 "Que Asagi Mutsuki en realidad sea una agente enviada desde Trinity, y que ahora niegue al gobierno de Trinity proclamándose a sí misma como Host... era un rumor tan absurdamente ridículo que, para la mayoría de los trinitarios, no era más que motivo de burla. Pero cuando Mutsuki empezó a tomar ventaja en la guerra contra Trinity, comenzaron a surgir otras voces. ¿Acaso existe una prueba concluyente de que Mutsuki no sea de Trinity? Si Mutsuki fuera trinitaria, entonces esta guerra no sería una derrota ante Gehenna, sino nada más que una simple lucha interna de poder dentro del Tea Party, donde el cargo de Host pasa a otra facción.\n\nPor eso mismo, los conservadores de Trinity, tan apegados a la tradición, alzaron la voz y empezaron a gritar que Mutsuki era una estudiante de Trinity.\n\n\"Host, eh... kufufu...\"\n\nMutsuki sonrió tenuemente mientras leía cartas, ligeramente enloquecidas, que la apoyaban como Host. ¿Que si Mutsuki era realmente una espía de Trinity? Ni siquiera para la propia Mutsuki era un asunto importante. Lo importante no es la verdad. Lo importante es si la gente lo interioriza y lo cree como un hecho. Y Trinity estaba interiorizando cada vez más la afirmación de Mutsuki como si fuera real. ¿No es algo divertidísimo?\n\nComo cuando Mutsuki confinó a Aru, interiorizando que todo aquello era “por Aru”."
 HEU.mutsuki_event.50.a:0 "No. Yo soy diferente. Yo no soy como ellos..."

 HEU.mutsuki_event.51.t:0 "¿Qué es lo que estás dudando?"
 HEU.mutsuki_event.51.desc:0 "Asagi Mutsuki. ¿Tu objetivo no era convertir a Aru en una heroína? Los locales se están burlando de Aru-chan. Esos kivotianos engreídos se tragan recompensas sacadas de Aru-chan mientras no tienen ni idea de cuánto se esfuerza. ¡Tú ibas a convertirte en el maldito productor que haría de Aru-chan una estrella! ¿Te da miedo que la tierra arda, que se apaguen las vidas de la gente de esta tierra? ¿De verdad la vida de ellos, y esta tierra, te importaban más que Aru-chan? ¿No, verdad?\n\nDispárales."
 HEU.mutsuki_event.51.a:0 "No hay razón para dudar."

 HEU.mutsuki_event.52.t:0 "Nuestra gran estrategia"
 HEU.mutsuki_event.52.desc:0 "Mutsuki se sentó junto a Haruka y a los soldados leales que obedecían al gabinete de Asagi, para trazar una gran estrategia de futuro. A partir de ahora, el gabinete de Asagi afirmaría que el Gran Ducado de Luxemburgo era el único Estado legítimo representante de la nación germana, y atacaría a [GEM.GetNameDef]. Como todos dentro del gabinete de Asagi sabían, no era porque Mutsuki quisiera realmente hacer algo por el pueblo germano.\n\nMutsuki convertiría a Aru en la verdadera heroína de esta tierra, para que Aru jamás volviera a ser objeto de burla por parte de la gente.\n\n\"...Haruka-chan. Escucha bien. Vamos a aplastar a Gehenna y, sin detenernos, avanzaremos hasta Trinity. Luego, conquistaremos ambas academias, Gehenna y Trinity, y a los locales les proclamaremos 'la reunificación del pueblo germano'. Y a Gehenna, le venderemos la historia de que Aru-chan es la gran conquistadora.\"\n\"¿E-estará bien...? Todo ese plan... se ve demasiado peligroso...\"\n\"¿Acaso Haruka-chan no quiere ayudar a Aru?\"\n\nAnte las frías palabras de Mutsuki, Haruka negó con la cabeza. Ayudar a Aru: ¿cómo podría Haruka negar eso? Cuando Mutsuki arrancó de ella una respuesta afirmativa, sonrió tenuemente.\n\n\"De aquí en adelante, seguramente estaremos ocupadas. Para las estudiantes de Gehenna, Aru-chan debe verse como la líder que conquista Trinity y Gehenna. Y para los locales, como la constructora que reconstruye el Deutschland colapsado tras la Gran Transición.\"\n\"¿Eso será... fácil?\"\n\"Kufufu... ¿no? La mayor parte habrá que dejársela a los burócratas. Pero tú, Haruka-chan, también puedes hacer algo muy sencillo.\""
 HEU.mutsuki_event.52.a:0 "Quemar las dos academias."

 HEU.mutsuki_event.53.t:0 "Una razón para vivir el mañana"
 HEU.mutsuki_event.53.desc:0 "Aru a veces recibe revistas de los vigilantes que administran la casa segura. Casi siempre son revistas “saludables” en las que la mayoría del contenido político está censurado, pero a veces los vigilantes, “por error”, no borran la sección de noticias políticas. Por lo general era una consideración hacia Aru, pero hoy esa consideración tuvo el efecto contrario.\n\n£white_dot ¿Por qué Asagi Mutsuki confinó a Aru?\n\n     ...Nuestra reportera Kawaru Shinon quiere plantear una posibilidad impactante. ¿No será que Mutsuki está considerando la utilidad política de la regente Rikuhachima? Se dice que está haciendo propaganda interna con la 'reunificación del pueblo germano'. Pero, ¿no te parece que una regente de un país pequeño como Luxemburgo carece de 'impacto' para encabezar una reunificación?\n     ¡Pero es posible! Esta revista considera que la regente Rikuhachima ya está preparada para obtener la 'legitimidad' necesaria para convertirse en la auténtica líder de Deutschland. ¿Acaso no está en Luxemburgo el emperador de todo Deutschland, Wilhelm II?\n     La razón por la que Asagi Mutsuki mantiene a Rikuhachima Aru bajo arresto es, sin duda, para enviarla como concubina de Wilhelm II, convertir a la regente en Aru Hohenzollern y elevarla a Gran Emperatriz de la Gran Alemania-\n\n-¡Riiip! ¡Riiip! Aru agarró la página de la revista y la rasgó de arriba abajo de un solo tirón. Había leído innumerables artículos hasta ahora, pero ninguno la había hecho sentir tan ofendida como este.\n\n'¿O sea que… como concubina de ese viejo? Este hdp… ¿Quién se cree esa maldita mujer? ¿Cree que puede tomar por tonta a una forajida hardboiled?'\n\n\"Saldré. Pase lo que pase… no caeré hasta que salga de esta cárcel.\"\n\nAru lo juró desde el fondo de su corazón y ¡BUM!, golpeó la pared con el puño. Aquel artículo le dio a Aru una motivación para vencer la desesperación. Kawaru Shinon. Aunque tenga que rastrearla por todo Kivotos, hasta el día en que le doble la cintura como si fuera un celular plegable… Aru no puede derrumbarse."
 HEU.mutsuki_event.53.a:0 "¡Qué coraje de verdad!"


