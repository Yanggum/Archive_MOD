 ## Archivo de historia
 HEU_story_archive: "Archivo de historia"
 HEU_show_story_archive_gui: "Archivo de historia de Luxemburgo"
 HEU_show_story_archive_gui_desc: "Puedes consultar historias secundarias relacionadas con Luxemburgo y la Agencia de Detectives 68. No guarda relación con los sistemas de juego: fue creado únicamente para disfrutar de historias secundarias del país dentro del juego. A medida que pasa el tiempo y avanzan los acontecimientos, pueden añadirse nuevas historias. ¡Esperamos que lo disfrutes!"

 HEU_story_event.1.t: "El ciudadano Wilhelm de Prusia"
 HEU_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nWilhelm de Prusia, quien alguna vez fue el káiser Guillermo II, no siempre fue pobre. Aunque el Imperio Alemán se derrumbó, incluso después de eso él conservó suficiente fortuna. Los tesoros imperiales que logró llevarse al exilio en los Países Bajos le bastaban para mantener una vida cómoda, y el gobierno neerlandés también lo dejó en paz para que disfrutara de una vejez tranquila.\n\nTodos los problemas comenzaron con el Gran Traslado. Unos invasores desconocidos, llegados del mundo llamado Kivotos, derribaron al gobierno neerlandés con tal rapidez que esta vez solo pudo huir para salvar la vida, sin tiempo siquiera de rescatar el patrimonio imperial. Al menos habría estado bien poder subirse al barco en el que escaparon los funcionarios del gobierno neerlandés... pero la reina ni siquiera le avisó: \"huiremos tal día, venga aquí\".\n\nQué mujer tan malvada. Pensando eso, Wilhelm salió arrastrándose del ático de una vieja casa en la ciudad de Luxemburgo. El antiguo emperador, que lo había perdido casi todo, pasaba ahora su vejez en un ático estrecho de apenas unos metros. Sin tesoros imperiales. Sin sirvientes que lo atendieran.\n\n\"¡Wilhelm de Prusia! ¿Por qué llegas tan tarde hoy?! Deberías estar agradecido de que siquiera hayamos contratado a un viejo de tu edad...\"\n\nLo único que le quedaba era el griterío del capataz, y una vida en la que debía talar árboles en el aserradero para ganarse la comida del día. Wilhelm tomó el hacha, con un casco de seguridad sin la correa abrochada. En los Países Bajos, la tala era un pasatiempo; aquí, era su medio de vida.\n\n¿Podré regresar algún día a Alemania y volver a ser emperador? ¿Podré disfrutar otra vez la vida en un palacio, sin tener que escuchar las regañinas de un mocoso luxemburgués?\n\n\"¡Hah... haaah...!\"\n\nWilhelm se secó el sudor de la frente y golpeó el tronco con el hacha, haciendo que el golpe resonara. Algún día habrá una segunda oportunidad. Una oportunidad de volver a Alemania, ser emperador otra vez e invadir este pequeño país. Y cuando llegue ese día, se vengará de ese feo capataz que no deja de gritarle que llegue temprano.\n\n\"¡Definitivamente...!\""

 HEU_story_event.2.t: "Por la Casa Ducal"
 HEU_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nPara Émile Speller, comandante de la gendarmería que dedicó su vida al servicio de la Casa Ducal, la primera impresión de Rikuhachima Aru fue la de un \"demonio\". Cabello rojo como llamas, un arma roja en la mano... y, para colmo, ¿no tiene cuernos? Pensó que no podía ser una buena señal que alguien tan siniestro llegara a Luxemburgo.\n\nPero ella era distinta.\n\n\"¡Puede que Su Alteza esté ahí dentro!\"\n\"...Mutsuki y yo revisaremos el interior del castillo. Kayoko, ve afuera con Haruka y comprueba si hay otras amenazas.\"\n\nEn medio del caos de aquel gran desastre, ella también debía de estar confundida: acababa de caer en un mundo completamente desconocido. Y el lugar donde habían aparecido era, literalmente, un mar de fuego. Aun así, Aru no vaciló ni una sola vez: entró corriendo al palacio junto a Speller para rescatar al Gran Duque. Y entonces...\n\nCuando encontraron a la Gran Duquesa Charlotte desplomada, cubierta de sangre, con el cadáver de un niño entre los brazos, Aru se arrodilló con solemnidad y, con sumo cuidado, cerró lentamente los ojos de la duquesa, que había muerto sin poder cerrarlos por sí misma. Aru no es como las demás de Gehenna... Fue probablemente en ese instante cuando Speller pensó eso por primera vez.\n\n\"Ponga la mano y jure. ¿Jura la señorita Rikuhachima, como regente del Gran Ducado de Luxemburgo, lealtad a la Casa Ducal y lealtad a la constitución y las leyes de la nación?\"\n\nNo pasó mucho tiempo hasta que Rikuhachima Aru se convirtió en la nueva regente de la Casa Ducal. Aunque para Aru ya no existía una Casa a la cual *servir*, para Speller era distinto. Aru era diferente a otros kivotosianos. Tenía un espíritu caballeresco, y una legitimidad como regente legalmente reconocida por el parlamento.\n\nY Rikuhachima Aru era una soberana verdaderamente noble, digna de ser seguida.\n\nEl día en que Aru ascendió como nueva regente, Speller colgó en la pared de su despacho el retrato de Aru que había encargado semanas atrás. Un soldado correcto debe poder ofrecer lealtad al soberano y a la casa a la que sirve. Conservador y monárquico hasta la médula, Speller aceptó de forma natural a Aru como su nueva soberana: alguien que reunía tanto la caballería como la legitimidad.\n\nSpeller saludó al cuadro colgado en la pared. \"...No perderé a mi soberano dos veces. Esta vez, sin falta... daré mi vida por Usted, Majestad.\""

