 HEU_hina_hidden_path_tt: "§gQuien debía recibir consuelo no era ella. ...Era Sorasaki Hina. Ella solo había estado esperando a un superhumano perfecto de su imaginación. Pero si Hina también es una persona, si es una vida común como ella... ¿no será Hina quien necesita ser salvada primero?§!\n\n\"A ver. ¿Un criminal de Gehenna provocó un incidente violento? Es la heroína del Comité Disciplinario, ¿no? ¿No habría que arrestarla de inmediato?\""
 HEU_hina_hidden_path_2_tt: "§gHina sonrió levemente y le devolvió el apretón, como si hubiera dejado atrás esa sensación de derrota y vacío tras la disolución del Comité Disciplinario.§!"
 HEU_hina_hidden_path_3_tt: "§gDesde aquel día, Hina nunca volvió a ver a Chinatsu ni a Iori. Solo oyó rumores: que cada una se había marchado a academias muy lejanas de Gehenna, consiguió trabajos totalmente ajenos a la seguridad pública, y trataba de olvidar los recuerdos del Comité Disciplinario.§!"
 HEU_hina_hidden_path_fail_tt: "§gTras aquel breve encuentro, Aru nunca volvió a ver a Hina. Hina desapareció dejando una nota breve: \"Perdón\". La policía luxemburguesa y los antiguos miembros del Comité Disciplinario buscaron por toda Gehenna, pero no quedó ni el más mínimo rastro de ella.§!"

 HEU_aru_sad_tt: "§gComo entendía demasiado bien por qué Mutsuki había terminado actuando así, Aru bajó la cabeza, consumida por la culpa. Por su incompetencia, había destrozado a su preciosa amiga de la infancia. Porque Rikuhachima Aru era una líder patética. ...Una líder incapaz de lograr nada.§!\n\n§RSi Mutsuki apretara el gatillo, sería más fácil...§!"

 HEU_new_BLEU_tt: "Se elimina al cumplirse la condición:\nEste espíritu nacional se eliminará si entramos en guerra con §Y[KSP.GetName]§! o si ese país es aniquilado.\nPenalización al eliminarse: §Yestabilidad§! §R-10%§!"
 HEU_BLEU_right_tt: "§YAdvertencia§!: si aceptan las condiciones, se entregará a [KSP.GetNameDef] §Runa parte de nuestras fábricas civiles§!."
 HEU_aru_diplomacy_tt: "[ROOT.GetNameDef] se considera a la vez un país §Ykivotosiano§! y un país §Ylocal§!. No recibe la penalización diplomática de §Yser de otro mundo§!."

 HEU_benriya_68_overseas_business_give_tt: "El 10% del poder político que gastemos se transfiere a §Y[HEU.GetNameDef]§!."
 HEU_benriya_68_overseas_business_receive_tt: "En el cierre anual de ingresos de la agencia (fin de año), se suma el poder político ganado por las §Yactividades en el extranjero de la Agencia de Detectives 68§!.\nIngresos actuales estimados: [Global.HEU_overseas_business_var] de poder político"
 HEU_watch_gehenna_tt: "Elegir enfoques políticos §Yanti-Gehenna§! debilita nuestra identidad de Gehenna, haciendo que este enfoque ya §Rno pueda seleccionarse§!."
 HEU_no_imprison_tt: "Rikuhachima Aru no debe estar en §Rarresto domiciliario§!."
 HEU_aru_mental_trauma_tt: "§YDeterioro de la salud mental de Aru§!:\nTras el golpe, Rikuhachima Aru está en §Yarresto domiciliario§! y pasa el tiempo atrapada en sus recuerdos. Si la puntuación de salud mental es mala, el contenido de los §Genfoques de final§! cambia a una versión negativa."
 HEU_aru_mental_trauma_delayed_tt: "Deterioro actual de la salud mental: [?aru_mental_trauma_var|=-0%]"

 mutsuki_leader_stat_system_tt: "Si Asagi Mutsuki es la líder, en lugar de usar las habilidades personales de Aru, el poder político §Rdisminuye§! en una cantidad equivalente a §Yel doble de las estadísticas de Aru requeridas por el enfoque§!."
 mutsuki_aru_care_system_tt:0 "Se pueden usar decisiones para recuperar la salud mental de Rikuhachima Aru. El coste de poder político de esas decisiones se §Yduplica§! cada vez."
 mutsuki_aru_mental_edit_tt:0 "La §Ysalud mental§! de Rikuhachima Aru cambia en $RIGHT|-=0%$"
 mutsuki_aru_mental_EX_tt: "§gRestaura enormemente la salud mental de Aru. Sin embargo, esta decisión solo puede usarse una vez.§!"
 
 mutsuki_gehenna_trinity_tt: "Solo se puede elegir entre Gehenna y Trinity."
 mutsuki_demon_shogun_tt: "Solo puedes elegir entre dar libertad o reprimir."
 HEU_two_year_term_tt:0 "§gEste primer ministro, elegido por un pequeño grupo mientras el parlamento estaba cerrado, no es democrático. Sin embargo, considerando que toda la nación quedó devastada por la guerra, se decidió celebrar las primeras elecciones generales tras la Ley de Unión dentro de 2 años. El mandato de [ROOT.GetLeader] queda garantizado por 2 años, pero después se podrá cambiar de líder.§!"
 HEU_fail_debate_tt:0 "§gEn 35 días, se completará el enfoque $HEU_civil_rights_act_2$. Después se podrá continuar la rama de enfoques políticos por el fracaso de la Ley de Derechos Civiles.§!"
 HEU_aru_true_leader_mutsuki_path_tt: "Puedes elegir el último §Yenfoque de epílogo§!."

 HEU_ugd_tt: "Se consume $RIGHT|-=1$ de los planes de reconstrucción restantes"
 
 HEU_red_alert_tt: "§gSi completas este enfoque y luego completas $HEU_unified_gehenna$, la ideología de [ROOT.GetNameDef] cambiará a §Ycomunismo§!.§!"

 BA_warning_violence_tt: "§L------\nAdvertencia: esta ruta incluye descripciones relacionadas con §Yabuso físico§! contra §Yestudiantes de Kivotos§!. Si no quieres ese tipo de contenido, juega otra ruta.§!"
 BA_warning_yuri_benriya_tt: "§L------\nAdvertencia: esta opción incluye descripciones relacionadas con §Yyuri§! entre §YRikuhachima Aru§! y otras estudiantes de §Yla Agencia de Detectives 68§!. Si no quieres ese tipo de contenido, elige otra opción.§!"

 ### Descripción de personajes ###
 HEU_wilhelm_II_desc: "§gWilhelm II, o Wilhelm von Preußen, tuvo que abdicar como Emperador del Imperio Alemán tras su colapso en noviembre de 1918. Reunió la riqueza que pudo y se exilió en los Países Bajos, anhelando el día en que pudiera restaurarse como emperador. Sin embargo, el 'Gran Traslado' de Kivotos ocurrido en noviembre de 1935 destrozó los Países Bajos, y una vez más tuvo que huir.\n\nWilhelm von Preußen quería escapar junto al gobierno neerlandés, pero en el caos posterior al Gran Traslado, la reina Guillermina subió al barco sin ocuparse del emperador exiliado. El Kaiser tuvo que girar rumbo y huir a Luxemburgo; en ese lapso, la mayor parte de la fortuna de los Hohenzollern desapareció.\n\nEl emperador pensó que los luxemburgueses lo recibirían como Emperador alemán, pero la visión sobre el monarca que había sido el 'ocupante' de Luxemburgo durante la Gran Guerra era gélida. ¿Tendrá el nuevo gobierno siquiera margen para darle a un ex emperador un modesto puesto de asesor... o lo ignorarán, dejándolo envejecer solo?§!"
 HEU_emile_speller_desc: "§gÉmile Speller, mayor de la gendarmería, fue el comandante que avanzó para reprimir a las estudiantes de Gehenna por orden del primer ministro Bech, líder del Partido de Derecha, cuando ocurrió el 'Gran Traslado'. En realidad, fue la gendarmería la que terminó reprimida. Durante el periodo de caos, Speller tuvo que amputarse el brazo izquierdo ante el abrumador poder de fuego de las estudiantes de Gehenna, y desde entonces comprendió el poder místico de los kivotosianos.\n\nPara proteger a Luxemburgo de la amenaza de los países de Kivotos, llegó a la conclusión de que lo más importante era una táctica defensiva bien planificada. Aunque tras el Gran Traslado se convirtió en veterano herido y podría haberse retirado del ejército, decidió permanecer en servicio, elaborando estrategias defensivas contra una invasión extranjera.§!"
 HEU_joseph_bech_desc: "§gAunque el primer ministro Joseph Bech llegó al cargo en 1926 por elección democrática, eso no significa que él mismo sea un 'demócrata'. Compartía las tendencias antidemocráticas de la corriente principal del Partido de Derecha —incluida la abolición del sufragio universal— y, como autoritario y anticomunista, incluso lideró la expulsión inmediata de un diputado comunista cuando el Partido Comunista obtuvo escaños en las elecciones legislativas de 1934.\n\nSin embargo, los cambios políticos de Luxemburgo provocados por el Gran Traslado también afectaron gravemente su poder. Durante el Gran Traslado, Bech realizó una provocación militar contra Gehenna que empujó a Luxemburgo al borde de la aniquilación; perdió todo su poder a manos de Rikuhachima Aru y cayó al papel de primer ministro títere de facto. Aun así, todavía sueña con poder volver a ser el líder de Luxemburgo... aunque la posibilidad de que ese sueño se cumpla sea inexistente.§!"
 HEU_emile_reuter_desc: "§gÉmile Reuter, presidente del parlamento del Gran Ducado de Luxemburgo desde 1926 hasta la actualidad, es un católico conservador inflexible y monárquico, proveniente del Partido de Derecha. En el caos político del Gran Traslado, Reuter huyó a Francia; cuando Francia fue conquistada por la Academia Millennium, volvió a escapar, esta vez de regreso a Luxemburgo. Aunque perdió el poder de forma impotente durante el Gran Traslado, Reuter cree que puede volver a encaminar al Luxemburgo sumido en el caos por la senda correcta: preservar el orden social conservador de antes de 1935.§!"
 HEU_pierre_dupong_desc: "§gPierre Dupong, el joven 'reformista' dentro del Partido de Derecha, se distancia de la línea reaccionaria interna como la abolición del sufragio universal, pese a ser un político de derecha. Incluso después de que Rikuhachima Aru se convirtiera en la líder del Gran Ducado de Luxemburgo tras el Gran Traslado, se mantuvo como un moderado que jamás expresó oposición en público ni en privado.\n\nDupong es conservador, pero también patriota, y reconoce que para que Luxemburgo sobreviva al nuevo orden posterior al Gran Traslado, la ayuda de Aru y la Agencia de Detectives 68 es indispensable. En cambio, los conservadores locales creen que si Aru se va, Luxemburgo podría volver perfectamente a como era antes de 1935. Pero Dupong analiza que, en el instante en que la Agencia de Detectives 68 abandone Luxemburgo, el Gran Ducado sería conquistado por otros países de Kivotos en cuestión de uno o dos días.\n\nDe hecho, no está claro si Luxemburgo tiene realmente la capacidad de 'valerse por sí mismo' tras el Gran Traslado.§!"
 HEU_victor_bodson_desc: "§gVictor Bodson, abogado socialista, inició su actividad política al unirse en 1930 a un pequeño partido luxemburgués: el Partido de los Trabajadores de Luxemburgo. Aunque no tenía influencia suficiente para entrar en la política nacional, como antifascista radical creía que debía actuar para combatir a Adolf Hitler en la vecina Deutschland.\n\nBodson abrió una 'ruta secreta de exilio' que permitía salir de Deutschland pasando por Luxemburgo hasta puertos belgas y, desde allí, partir hacia Estados Unidos, iniciando así una actividad antinazi personal. Gracias a su ayuda, antes de que ocurriera el Gran Traslado de 1935, cientos de judíos y disidentes pudieron escapar de Deutschland.\n\nEl Gran Traslado derribó el régimen de Hitler en Deutschland, pero la misión de Bodson —proteger a todas las minorías oprimidas por la represión— se volvió aún más grande. Bodson es una figura minoritaria que actúa para resolver el conflicto étnico entre los desplazados kivotosianos y los locales, y desea mostrarle a Rikuhachima Aru su pasión.§!"

 HEU_aru_generic_leader_desc: "¿Cómo describir a Rikuhachima Aru, la regente de un país sin gran duque? Para los kivotosianos trasladados, es la jefa de la Agencia de Detectives 68; para los locales, es la regente del Gran Ducado de Luxemburgo, una heroína local que defendió la Ciudad de Luxemburgo de los saqueos y masacres de las estudiantes de Gehenna justo tras el Gran Traslado.\n\nEn 1935, durante el Gran Traslado, el bloque de Gehenna intentó saquear y destruir el Luxemburgo sumido en el caos, y Aru luchó para protegerlo conforme a su propio código moral. Incluso después de que la Casa de Nassau muriera a manos de Gehenna, el hecho de que los locales la aceptaran como una 'existencia excepcional' se debió en gran parte a su imagen heroica en Luxemburgo.\n\nAru decidió quedarse temporalmente en Luxemburgo como regente hasta que se lograra la paz entre kivotosianos y locales. Pero lo que al principio pensó que sería un trabajo 'temporal' de unas semanas se está alargando cada vez más, y Aru siente una compasión creciente hacia la gente de estas tierras. Si ella los abandona... ¿cómo podrán defenderse de una segunda invasión de Gehenna?"

 HEU_aru_fascist_leader_desc: "Un pequeño paraíso donde los kivotosianos y los locales puedan convivir en armonía. Una fantasía, sí, pero precisamente por eso era el camino de forajida que Rikuhachima Aru podía permitirse soñar. Aru se aferró a ese pequeño sueño y por eso se quedó en Luxemburgo. Creía que, por dura que fuese la adversidad que la aguardara, podría soportarla. Pero el camino que debía recorrer para alcanzar ese sueño era demasiado, demasiado largo.\n\nY entonces, los miembros de la Agencia de Detectives 68... están resultando heridos por el \"ideal\" de Aru.\n\n¿Amar a todos por igual no es, al final, lo mismo que no amar a nadie? Una desesperación y un dolor que jamás había experimentado en Kivotos. Al final, Aru renunció a la esperanza de que, esforzándose por los locales, podrían coexistir con ella. Puedes decir que se le rompió el corazón. Que su ideal fue negado. No pasa nada. Pero... aun así, en lo más profundo de Aru queda una voluntad bondadosa que jamás podrá abandonar.\n\nLa Revolución del 68: para detener la discriminación contra los locales, Aru alza la última llama de su esperanza. Injertar la cultura del Kivotos del siglo XXI en la Tierra del siglo XX y erradicar la cultura discriminatoria de la Tierra. Si logra eso, quizá el pequeño paraíso que sueña Aru pueda sobrevivir. No.\n\nTiene que ser así."

 HEU_aru_communist_leader_desc: "Un pequeño paraíso donde los kivotosianos y los locales puedan convivir en armonía. Una fantasía, sí, pero precisamente por eso era el camino de forajida que Rikuhachima Aru podía permitirse soñar. Aru se aferró a ese pequeño sueño y por eso se quedó en Luxemburgo. Creía que, por dura que fuese la adversidad que la aguardara, podría soportarla. Pero el camino que debía recorrer para alcanzar ese sueño era demasiado, demasiado largo. Los locales tratan a Rikuhachima Aru como a una bruja y se burlan de ella a sus espaldas. Las estudiantes de Gehenna se mofan abiertamente, diciendo que Aru se convirtió en \"perra de los locales\" para proteger el título nobiliario que le concedieron. Su sueño de proteger tanto a la humanidad como a los kivotosianos terminó convirtiéndola en enemiga de ambos pueblos.\n\nTras sufrir atentados consecutivos, primero por parte de la humanidad y luego por parte de Gehenna, las risas de la Agencia de Detectives 68 también se han ido apagando junto con el ideal de Aru. El hecho de \"no haber podido proteger a Aru\" dejó heridas en el corazón de sus compañeros. Cuando escuchó, en la oficina sin Aru, a Mutsuki y Kayoko gritarse llamándose por sus apellidos, su alma también se desgarró en cientos de pedazos.\n\nAlguien le dijo una vez: deja de ser una niña. Conviértete en un adulto por las personas que quieres proteger.\n\n¿Qué es ser un adulto? ¿Cómo se convierte uno en alguien que asume responsabilidades? ¿Y, para empezar, tiene Rikuhachima Aru derecho a convertirse en eso?\n\n§R\"Si simplemente me muriera... ¿no sería más feliz para todos un final donde yo desaparezca?\"§!"

 HEU_aru_communist_leader_happy_ending_desc: "Al público se le anunció que no salió durante unos días por una neumonía, pero la mayoría jamás sabrá que, el día en que conquistó Trinity, Aru intentó suicidarse bebiendo café con cianuro. ¿Cómo podría alguien pensar que una líder que logró una gran victoria tomaría una decisión así?\n\nMientras seguía ganando guerras y la bandera de la Agencia de Detectives 68 se extendía cada vez más lejos, Aru observó a las personas que morían bajo su nombre y la relación, cada vez más quebrada, entre los miembros de la agencia. Entonces llegó a creer que morir era lo que significaba ser \"un adulto que asume responsabilidades\".\n\nProbablemente esa idea era un error.\n\nTras despertar milagrosamente de un paro cardiaco, Aru se convirtió en adulta de una forma distinta a la que imaginaba. Aunque perdió muchas cosas, aún le quedan otras. El preciado sueño de la reconciliación entre kivotosianos y humanidad tampoco se rompió.\n\nAceptando y superando voluntariamente todas esas dificultades, Rikuhachima Aru avanza hacia una esperanza que salvará a todos."

 HEU_aru_fascist_leader_68_happy_ending_desc: "El encuentro y el choque con la VTuber Nanami Ayaka sacudieron profundamente a Rikuhachima Aru. La razón por la que se quedó en Luxemburgo, la muerte trágica de la gran duquesa Charlotte y la culpa que eso le dejó como kivotosiana... En algún momento, Aru se dio cuenta de que lo había perdido todo y de que estaba imponiendo sus propias ideas a los locales, igual que los invasores del día del \"Gran Traslado\". Aunque Aru soñaba con ser una forajida hardboiled y malvada, esto no era la maldad que ella quería.\n\nEl intento de la Revolución del 68 en sí mismo habrá sido correcto. La calidad de vida de los kivotosianos mejoró, y el mundo está cambiando rápidamente en la dirección que Aru deseaba. Pero, en medio de ese progreso, Aru comprendió que los locales habían sido abandonados. El pequeño paraíso de Aru se levantó sobre el sacrificio de alguien, y el nuevo Consejo Estudiantil General no mostró el menor interés por los locales.\n\nEse no era el final feliz que Aru soñaba. \"Un pequeño paraíso donde los kivotosianos y los locales puedan convivir en armonía\". Frente a la urna con los restos de Charlotte, Aru recordó ese sueño que una vez había olvidado. Porque, al final, una revolución en la que alguien no puede bailar... no es una revolución para todos."

 HEU_mutsuki_asagi_fascist_leader_desc: "En el mundo hay innumerables joyas, pero son pocos quienes pueden reconocer la belleza de una piedra preciosa sin tallar. Incluso un rubí que guarda un brillo rojo deslumbrante no deja de ser una simple piedra mientras es un mineral en bruto; solo tras el tratamiento térmico puede revelar su verdadera transparencia.\n\nLa belleza de Aru era como una joya sin calentar, y la gente de aquí no supo reconocerla. El rechazo del proyecto de \"Ley de Derechos Civiles\", que buscaba proteger los derechos tanto de los locales como de los kivotosianos, convirtió a Aru en motivo de burla y estrechó su margen político. ¿Por qué son capaces de patear una joya hermosa sin darse cuenta de su valor?\n\nMutsuki recogió la joya que rodaba por el suelo y ahora la guarda en su vitrina más preciada, para que ese brillante fulgor rojo —que solo ella reconoce— no vuelva a perderse jamás. Y para quemar hasta las cenizas a todos los desperdicios que se atrevieron a pisotear a su querida \"Aru-chan\", Mutsuki encerró a Aru en una cámara estéril llamada \"casa segura\", aislándola de todo mal del mundo.\n\n¿Qué clase de amor tan profundo es este?"

 HEU_haruka_igusa_fascist_leader_mutsuki_happy_ending_desc: "¿Con qué palabra se puede describir a Igusa Haruka? Quienes la conocen bien probablemente la resumirían como alguien que \"odia a Gehenna más que a los trinitarios\". Los abusos sufridos en Gehenna y la experiencia del motín que los gehenna perpetraron en Luxemburgo en 1935 hicieron que su odio hacia Gehenna creciera todavía más.\n\nPor eso mismo, Haruka no puede ser, bajo ningún concepto, un símbolo de integración con Gehenna. Tal vez podría serlo si asumiera el cargo de líder militar que oprime a Gehenna, pero no es el caso. La única razón por la que Haruka se convirtió en primera ministra de la Unión —abarcando Gehenna, Trinity y también Luxemburgo— justo después de la Ley de Unión fue una sola: la posición de Mutsuki era demasiado inestable.\n\nRikuhachima Aru volvió a gobernar directamente, pero no pudo tomar ninguna decisión sobre el destino de Asagi Mutsuki, líder del golpe. El Partido de Derecha colapsó, y desde los comunistas hasta los liberales radicales, incontables partidos se agrupan y se disuelven una y otra vez, peleándose entre ellos por el control del nuevo gobierno de Luxemburgo. Tras la Ley de Unión, Luxemburgo sufre un fenómeno extremo de \"ausencia de liderazgo\".\n\nHasta que aparezca un nuevo líder para Luxemburgo, Igusa Haruka será una líder \"puente\". Aunque su trabajo no pase de acurrucarse en una esquina del despacho vacío del primer ministro y garabatear firmas con timidez en los documentos que le traen los tecnócratas."

 HEU_mutsuki_asagi_fascist_leader_mutsuki_happy_ending_desc: "Asagi Mutsuki quedó, en la práctica, neutralizada tras la aprobación de la Ley de Unión. Se dio cuenta de que su voluntad de proteger a Aru, en realidad, había terminado por asfixiarla. Mutsuki regresó al gabinete, pero no porque se la perdonara sin más: había demasiados burócratas pro-Mutsuki controlando el gobierno como para poder castigarla, y Rikuhachima Aru decidió perdonarla. Mutsuki asumirá de nuevo el liderazgo del gabinete por el bien de Rikuhachima Aru, pero ya no le es posible ejercer una dictadura como antes.\n\nMutsuki decidió dedicar su nuevo mandato a la expiación y a la reflexión sobre el pasado. Por supuesto, el pueblo luxemburgués no cree seriamente en su \"expiación\", y la única razón por la que puede desempeñar el cargo de primera ministra es que no es una líder elegida por voto directo. El camino de la expiación de Mutsuki llevará muchísimo tiempo, y para que la gente lo reconozca, ella ya ha llegado demasiado lejos. Pero Mutsuki no se detendrá.\n\nPor Aru."

 HEU_kayoko_onikata_fascist_leader_mutsuki_happy_ending_desc: "Onikata Kayoko es la líder que cuenta con el apoyo de los monárquicos dentro del ejército de Luxemburgo y que, en el pasado, encabezó la rebelión de la facción \"Restauracionista de Aru\". Tras el colapso del gabinete de Asagi, obtuvo el poder y tomó el volante para dirigir el futuro de Luxemburgo. Claro que no todo marcha bien. Asagi Mutsuki profundizó la grieta del conflicto entre locales y kivotosianos, y sus métodos dañaron de forma permanente a la Agencia de Detectives 68. Pero a Kayoko todavía le queda algo: Rikuhachima Aru. Por su amiga más importante, Kayoko guiará a Luxemburgo en esta oscuridad donde no se ve el futuro.\n\nGracias a su relación amistosa con Amau Ako, de la antigua Comisión Disciplinaria (aunque por su lado tsundere no se pueda decir que sea completamente amistosa), se espera una cooperación fluida con el bloque de Gehenna. Aunque a Kayoko le cuesta establecer una relación de asociación mutua con Trinity tras la Ley de Unión, está haciendo todo lo posible por construir el \"mundo ideal\" que soñó Rikuhachima Aru. Un ideal es difícil de alcanzar; pero precisamente por ser difícil, vale la pena desafiarlo."

 HEU_mine_aomori_leader_desc: "Algunas estudiantes trinitarias radicales consideran que el ascenso de Aomori Mine al cargo de primera ministra equivale a la reconquista de Gehenna por parte de Trinity. Pero a Mine le interesa más la ayuda humanitaria para una patria destruida que cualquier acto de \"venganza\". En la práctica, también pudo llegar a ser primera ministra porque contó con el apoyo de las fuerzas religiosas locales del Partido Popular Cristiano-Social y del Pandemonium Society, dispuesto a hacer lo que fuera para ponerle trabas a Amau Ako. Desde una postura moderada y centrista, Mine intenta mantener el equilibrio entre el desordenado estado federal surgido tras la Ley de Unión: Trinity, Gehenna y Deutschland.\n\nAomori Mine sabe que la Unión Germánica no es ni de Trinity ni de Gehenna ni de ninguna academia. Mine trabaja por consolar a los numerosos ciudadanos heridos y derrumbados, respetar el sistema de monarquía constitucional de la Casa Rikuhachima, y construir un nuevo país conservador pero estable, sin cambios sociales radicales. La guerra terminó, y en este tiempo en que la espada debe cambiarse por el arado, lo más importante es la estabilidad y la paz, más que los cambios drásticos. Llevar ayuda a donde hace falta. Eso es lo que Mine siempre ha hecho."

 HEU_reisa_uzawa_leader_desc: "Algunas estudiantes trinitarias radicales consideran que el ascenso de Uzawa Reisa al cargo de primera ministra equivale a la reconquista de Gehenna por parte de Trinity. Pero Uzawa Reisa pudo llegar al cargo gracias al apoyo de las fuerzas religiosas locales del Partido Popular Cristiano-Social y del Pandemonium Society. Y la propia Reisa también tiende a centrarse más en la \"realización de la justicia\" que en la venganza.\n\nHabiendo participado en el pasado en actividades de vigilantes, la política de Uzawa Reisa se orienta mucho más a la \"política de plaza\" que le resulta familiar, que a los métodos legales habituales del parlamento basados en debate y consenso. Reisa practica una política muy polémica: política de internet mediante redes sociales, proclamaciones directas de \"¡pandilla del mal!\" hacia políticos que no le gustan, etc. No es que quiera provocar conflicto social; es que Reisa aprendió que, cuando se enfrenta a la corrupción y al abuso, es mucho más rápido aplastar en el acto la cabeza de los malvados diciendo \"pues muere\".\n\nEse estilo político rápido y radical satisface plenamente a dos bases de apoyo: el bloque trinitario y el Pandemonium Society, que aprendió lo que es la política \"yendo a tirarse al suelo\" frente al edificio principal del Comité Disciplinario llevando a Toramaru. El Partido Popular Cristiano-Social también es favorable por el trasfondo religioso de Reisa como ex Trinity, y disfruta viendo a la oposición confundida por su política temeraria \"al estilo Uzawa\". Pero las fuerzas opositoras, incluyendo a Amau Ako y Onikata Kayoko, miran con inquietud el hecho de que ella sea la primera ministra de la recién creada Unión Germánica. ¿De verdad tiene la capacidad de unificar a Gehenna y Trinity, ya fragmentadas tras la Ley de Unión, junto con los locales? ¿O su política del \"pues muere\" no es más que un camino hacia la autodestrucción de la Unión? Las futuras generaciones conocerán la respuesta."

 HEU_haruka_igusa_terrible_leader_hidden_desc: "Igusa Haruka no es alguien con un liderazgo digno de ser líder. Su papel se limitaba a apoyar a Aru y realizar el trabajo en silencio desde las sombras. Pero tras la aprobación de la Ley de Unión, Aru cortó todo interés por la política y se concentra tranquilamente en pasatiempos. Haruka cree que hacer lo que ella puede en lugar de Aru —que está descansando— es la forma de ser leal a Aru, que ya no le envía órdenes.\n\nEntonces, ¿qué es la lealtad por Aru? Haruka lo comprendió al ver el parlamento del Pandemonium Society arder y extinguirse entre llamas. Aru imaginó un paraíso de convivencia entre todos los kivotosianos y los locales. Ese sueño es un objetivo inacabado que Aru no logró completar. ¿No sería la justicia de Haruka, que ama a Aru, completar ese objetivo en su lugar? Sobre todo, si reúne a esos repugnantes desperdicios de Gehenna —que se niegan incluso a aceptar su propia fealdad— en un solo sitio y los quema, Aru seguramente se alegrará y la elogiará. Esto no es posesividad ni una excusa, como Mutsuki, para volver a meterla en un globo de nieve. Haruka jamás tocará la libertad de Aru. Solo tocará a quienes no merecen tener libertad.\n\nHaruka se autoproclama la \"segunda Emperatriz del Cerebro\", heredera de Mutsuki, quien se hacía llamar Emperatriz del Cerebro. Y quemará todos los restos del Pandemonium Society y de Gehenna que han entristecido y atormentado a Aru. Sin dejar ni una sola mancha, de forma total y absoluta. Cuando todo termine, Aru sin duda la abrazará, le acariciará suavemente la cabeza y la elogiará, diciéndole que está feliz de que se haya esforzado por ella. ¿Cómo no iba a hacerlo?"
