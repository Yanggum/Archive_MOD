l_russian:
 landmark_HEU_luxemburg_palace:0 "Palacio Gran Ducal de Luxemburgo"
 landmark_HEU_luxemburg_palace_desc:0 "El Palacio Gran Ducal de Luxemburgo fue la residencia de la antigua Casa Gran Ducal de Nassau, amada por muchos ciudadanos luxemburgueses, y sigue siendo— incluso después del Gran Traslado—el centro de la política luxemburguesa. Aunque, en el caos inmediato posterior al Gran Traslado, ocurrió un trágico incidente en el que estudiantes de Gehenna masacraron al Gran Duque y a su familia dentro del dormitorio del palacio, los esfuerzos de Riku Hachima Aru y del Parlamento de Luxemburgo han logrado, al menos, devolver al exterior del palacio la bella apariencia que tenía antes de 1935."

 # #### #### Eventos de la Agencia 68 #### #### #

 #{{ Inicio de eventos base
  HEU_event.1.t:0 "Tratado Luxemburgo–Manmajeon"
  HEU_event.1.desc:0 "El embajador diplomático de Luxemburgo transmitió que Riku Hachima Aru desea una cooperación aún más estrecha con el bando de [GEM.GetLeader], y propuso que, en lugar de enfrentarse militarmente, la Agencia 68 y Manmajeon deberían colaborar entre sí. El Gran Ducado de Luxemburgo es un país pequeño, pero la Agencia 68, que lo protege, es sin duda un grupo de estrategas con talento. Varias estudiantes de Manmajeon han comentado que fortalecer la cooperación militar entre Luxemburgo y Manmajeon también podría beneficiarnos. Por supuesto, la decisión final recae en [GEM.GetLeader]."
  HEU_event.1.a:0 "¡Es una propuesta bastante razonable!"
  HEU_event.1.b:0 "…¿Y Luxemburgo qué es? ¿Se come?"

  HEU_event.2.t:0 "Un tratado rechazado"
  HEU_event.2.desc:0 "\"¡Malditos idiotas de Manmajeon! ¿Qué demonios tiene de malo este tratado?\"\n\nAru dejó escapar un suspiro y arrojó al suelo un breve documento de una sola página. La negociación fracasó. El plan de alianza entre Luxemburgo y Manmajeon se vino abajo, y Manmajeon seguirá siendo una amenaza al este. No era la situación deseada. Tampoco era el resultado esperado.\n\nPero ya había ocurrido. Luxemburgo tendrá que encontrar la forma de sobrevivir sin la cooperación de Manmajeon."
  HEU_event.2.a:0 "\"Ya veo… supongo que esto también es el camino del forajido…\""

  HEU_event.4.t:0 "¡Victoria de Luxemburgo en la disputa fronteriza!"
  HEU_event.4.desc:0 "La marcha agresiva del ejército luxemburgués no parece detenerse. Las fuerzas de Luxemburgo han logrado rechazar con éxito a las tropas defensoras. Con la provocación de Riku Hachima Aru culminando con éxito, las fuerzas defensoras han sufrido un golpe, y Luxemburgo ha pasado a ejercer control efectivo sobre parte del territorio enemigo."
  HEU_event.4.a:0 "Jeje… ¡una victoria magnífica!"

  HEU_event.5.t:0 "¡Derrota de Luxemburgo en la disputa fronteriza!"
  HEU_event.5.desc:0 "El ejército luxemburgués no obtuvo resultados contra el enemigo. La escaramuza se inclinó a favor del adversario, y las fuerzas de Luxemburgo no tuvieron más remedio que retirarse del campo de batalla. La provocación de Riku Hachima Aru terminó en fracaso, y parece que ella tendrá que reprender a los oficiales de campo que comandaron la operación."
  HEU_event.5.a:0 "Hasta la derrota… es hardboiled…"

  HEU_event.6.t:0 "Disputa fronteriza sin avances"
  HEU_event.6.desc:0 "El ejército luxemburgués no obtuvo resultados contra el enemigo. La escaramuza se prolongó y nadie logró imponerse; si el combate continúa, existe la posibilidad de que deje de ser una simple “escaramuza” y se expanda a una guerra total. Al final, Luxemburgo no tuvo más remedio que retirar a sus fuerzas del campo de batalla. La provocación de Riku Hachima Aru produjo un resultado cercano al fracaso, y parece que ella tendrá que reprender a los oficiales de campo que comandaron la operación."
  HEU_event.6.a:0 "Hay días así."

  HEU_event.7.t:0 "Riku Hachima Aru visita el despacho"
  HEU_event.7.desc:0 "Riku Hachima Aru, de la Agencia 68—que quedó de facto separada de nosotros tras el cataclismo—ha visitado el despacho del Distrito Sur de [GEH.GetLeader], jefe del Comité Disciplinario. Tras conversar sobre varios asuntos, presentó un tratado que incluye un pacto de no agresión y garantías de independencia, con el objetivo de contener juntos a Manmajeon, un enemigo común."

  HEU_event.13.t:0 "¡Victoria en la disputa fronteriza con Luxemburgo!"
  HEU_event.13.desc:0 "Nuestras fuerzas han rechazado con éxito la provocación fronteriza del ejército luxemburgués. La provocación de Riku Hachima Aru terminó en fracaso, y llegan noticias de que está reprendiando a sus oficiales de campo."
  HEU_event.13.a:0 "¡Una victoria espléndida!"

  HEU_event.14.t:0 "¡Derrota en la disputa fronteriza con Luxemburgo!"
  HEU_event.14.desc:0 "Nuestras fuerzas no lograron resultados contra el enemigo. La escaramuza se inclinó a favor del adversario, y no tuvimos más remedio que retirarnos del campo de batalla. La provocación de Riku Hachima Aru fue un éxito: hemos perdido territorio y nos hemos visto obligados a retroceder."
  HEU_event.14.a:0 "¡Una derrota vergonzosa!"

  HEU_event.15.t:0 "Disputa fronteriza sin avances"
  HEU_event.15.desc:0 "La provocación fronteriza del ejército luxemburgués no logró resultados contra nosotros. La escaramuza se prolongó y nadie consiguió imponerse; si el combate continúa, existe la posibilidad de que deje de ser una simple “escaramuza” y se expanda a una guerra total. Al final, el enemigo no tuvo más remedio que retirar sus fuerzas del campo de batalla. La provocación de Riku Hachima Aru produjo un resultado cercano al fracaso, y llegan noticias de que está reprendiando a sus oficiales de campo."
  HEU_event.15.a:0 "No pasó nada."

 ### 리워크 이벤트 ###
 ## 뉴스이벤트 ##
 HEU_news.1.t:0 "Voladura de la Catedral de Notre Dame de Luxemburgo"
 HEU_news.1.desc:0 "La Catedral de Notre Dame de Luxemburgo, el mayor santuario católico del Gran Ducado de Luxemburgo y poseedora de 300 años de historia, fue volada hoy por Igusa Haruka, de la Agencia 68. Este atentado terrorista se produjo a causa de la confrontación extrema entre las fuerzas católicas locales y la Agencia 68. La Iglesia católica local no ha dejado de denunciar a Riku Hachima Aru, a quien ha seguido llamando “demonio”, y se sabe que, justo antes del atentado, intentó provocar a Aru enviándole una carta con ilustraciones en las que agentes de la Agencia 68 eran ejecutados de forma espantosa.\n\nLa explosión fue tan gigantesca que su estruendo pudo registrarse incluso a 10 km de distancia, y tanto la catedral como todos los restos mortales de los Grandes Duques de Luxemburgo, conservados en la cripta subterránea, quedaron completamente destruidos. Al conocerse la noticia, la Santa Sede emitió un breve comunicado de condena contra la Agencia 68."
 HEU_news.1.a:0 "\"Qué alivio… Por fin puedo serle útil a la señorita Aru.\""
 HEU_news.1.b:0 "Luxemburgo se sume en el caos por el choque entre locales y trasladados"

 # Rama de noticias: bifurcación de ruta fascista
 HEU_news.2.t:0 "La Revolución del 68 en Luxemburgo"
 HEU_news.2.desc:0 "Riku Hachima Aru creía que, cooperando con los locales, podría proteger los derechos humanos de los trasladados, pero los locales traicionaron su confianza. Se descubrió que la coalición gubernamental derechista preparaba un plan de asesinato contra Aru; en respuesta, la Agencia 68 asaltó hace poco la sede del partido derechista y ejecutó una disolución forzosa del partido.\n\nHabiendo tomado el poder en solitario, Riku Hachima Aru declaró hoy oficialmente que la “Revolución del 68”, liderada por la Agencia 68, comenzará desde Luxemburgo. La Revolución del 68 —o el riku-hachimismo— es una ideología que sostiene que la mejor vía para mejorar los derechos humanos de todos los kivotosianos consiste en desmantelar la cultura local e implantar en Europa la cultura “libre” de Kivotos."
 HEU_news.2.a:0 "…Es para proteger a todos… ¡como forajida…!"
 HEU_news.2.b:0 "\"Prohibido prohibir\""

 HEU_news.3.t:0 "Unión Manmajeon–Luxemburgo"
 HEU_news.3.desc:0 "Debido al acuerdo militar entre [HEU.GetLeader] de Luxemburgo y [GEM.GetLeader] de Manmajeon, el Gran Ducado de Luxemburgo decidió oficialmente emprender cooperación militar con Manmajeon. Para los nacionalistas luxemburgueses locales, que anhelaban recuperar territorios alemanes, esta noticia resultó impactante.\n\nEn el día de la firma del tratado, Manmajeon y Luxemburgo anunciaron que unirán fuerzas contra un enemigo común; circulan muchas especulaciones sobre si ese “enemigo común” se refiere al Comité Disciplinario o a Trinity."
 HEU_news.3.a:0 "Unidos, somos más fuertes"
 HEU_news.3.b:0 "El tablero de Europa está cambiando"

 HEU_news.4.t:0 "Aru se autoproclama Presidenta del Consejo Estudiantil General"
 HEU_news.4.desc:0 "\"¡Muchísimos trasladados de Kivotos sufren discriminación a manos de los locales, y mientras tanto… ¿qué ha hecho el Consejo Estudiantil General? ¡Nada! …¡Si queremos proteger a los trasladados, no me queda otra que convertirme yo, la hardboiled, en la Presidenta!\"\n\nRiku Hachima Aru, entregada a la lucha por la igualdad de derechos para todos los kivotosianos y a la erradicación de la discriminación local, criticó la actitud “incompetente” del Consejo Estudiantil General hacia los locales y declaró ser la auténtica Presidenta del Consejo Estudiantil General de Kivotos.\n\nPor ahora, esta declaración no tiene un impacto mayor que el simbólico, pero ya han aparecido simpatizantes que apoyan a la Agencia 68, que exige “un mínimo de derechos humanos para los kivotosianos”."
 HEU_news.4.a:0 "Un forajido no es un villano"
 HEU_news.4.b:0 "Un idealismo preocupante"
 HEU_news.4.c:0 "Entonces… ¿quién es el Consejo Estudiantil General?"

 HEU_news.5.t:0 "Legalización de la unión civil en Luxemburgo"
 HEU_news.5.desc:0 "Si bien en la Antigua Grecia hubo épocas en las que la homosexualidad fue tolerada, en Europa la homosexualidad pasó a considerarse pecado en todo el continente tras la cristianización medieval. Por ello, cuando Luxemburgo legalizó la unión civil, concediendo a las parejas del mismo sexo derechos equivalentes a los de las parejas heterosexuales, estalló una fuerte reacción dentro del país. Sin embargo, Riku Hachima Aru sostuvo que no retrocederá ante la oposición local, pues su objetivo es la “destrucción de la cultura local y la kivotosización”.\n\nA pesar del rechazo de las fuerzas locales, Luxemburgo logró su primera legalización de matrimonio entre personas del mismo sexo, y figuras religiosas locales declararon a Riku Hachima Aru como el Anticristo, condenándola con dureza."
 HEU_news.5.a:0 "Aunque ladren los perros, el tren sigue"
 HEU_news.5.b:0 "Sorprendentemente futurista"

 HEU_news.6.t:0 "Aru toma el control del Consejo Estudiantil General"
 HEU_news.6.desc:0 "Incluso tras proclamarse Presidenta del Consejo Estudiantil General, muchos dudaban de que Riku Hachima Aru pudiera realmente imponerse sobre el Consejo existente. Sin embargo, Aru desplegó una sorprendente habilidad militar y diplomática, y logró convertirse en la líder del Consejo Estudiantil General.\n\nEn su discurso de investidura, Aru declaró que, como Presidenta del Consejo Estudiantil General de Kivotos, luchará por los “derechos de todos los kivotosianos”. Entre los estados de Kivotos existen voces que esperan su liderazgo, pero entre los estados humanos crece la cautela hacia Aru."
 HEU_news.6.a:0 "Esto sí que es hardboiled"
 HEU_news.6.b:0 "El pequeño que venció al gigante"

 HEU_news.7.t:0 "Con amor, desde la Agencia 68"
 HEU_news.7.desc:0 "El Gran Ducado de Luxemburgo, movilizado en una guerra total, ha comenzado a fabricar juguetes tipo bloque acrílico (corotto) basados en las cuatro ejecutivas de la Agencia 68 para obtener fondos de emergencia. Los juguetes de Aru, Mutsuki, Kayoko y Haruka —realizados en colaboración con una marca kivotosiana de hamburguesas— gozan de gran popularidad no solo en Luxemburgo, sino también en países vecinos, gracias a su diseño adorable.\n\nAdemás, la propuesta simple pero sólida de “compra un corotto y llévate un combo de hamburguesa de regalo” ha elevado notablemente la satisfacción de los compradores."
 HEU_news.7.a:0 "\"…¿Q-qué es esta vergüenza ahora!?\""
 HEU_news.7.b:0 "\"¡Compré cuatro combos y me salieron cuatro corottos de Haruka!\""
 HEU_news.7.c:0 "¿Cómo se supone que debo entender esto?"

 HEU_news.8.t:0 "El fin de BLEU"
 HEU_news.8.desc:0 "BLEU, siglas de la Unión Económica Belga-Luxemburguesa, fue una alianza económica entre ambos países que se mantuvo desde 1921. En el marco de BLEU, Luxemburgo utilizaba una moneda fiduciaria cuyo valor se vinculaba a la moneda belga; sin embargo, tras el Gran Traslado y el colapso de Bélgica, se produjo una hiperinflación.\n\nSin un estado que garantizara su valor, la moneda luxemburguesa se convirtió en papel sin valor, y la Agencia 68 declaró finalmente la suspensión total de la unión económica y el retorno al patrón oro para estabilizar la moneda de Luxemburgo."
 HEU_news.8.a:0 "A ver… ¿entonces ya salimos del caos, no?"
 HEU_news.8.b:0 "Ningún aliado vale más que el dinero…"

 # Noticia de entrada a ruta comunista
 HEU_news.9.t:0 "Aprobación de la Ley de Derechos Civiles de Luxemburgo en [GetYear]"
 HEU_news.9.desc:0 "Gracias al éxito de la cooperación entre tres fuerzas —el partido derechista, la Agencia 68 y el Partido Comunista de Luxemburgo—, y pese a la oposición de la derecha, incluidos grupos católicos y organizaciones fascistas, se aprobó en Luxemburgo la “Ley de Derechos Civiles para todos los trasladados de Kivotos”. La ley prohíbe la discriminación en empleo, salarios y otros ámbitos contra toda población kivotosiana trasladada desde 1935, y tipifica como delito negar servicios públicos o privados a dicha población.\n\nRiku Hachima Aru anunció con entusiasmo que, mediante el compromiso, continuará luchando para erradicar el racismo en Luxemburgo y, más allá, para elevar los derechos de los kivotosianos en toda Europa."
 HEU_news.9.a:0 "¡Es una ley histórica!"
 HEU_news.9.b:0 "¿De verdad una ley puede detener la discriminación?"

 # Noticia de entrada a ruta no alineada
 HEU_news.10.t:0 "El último vuelo de Riku Hachima Aru"
 HEU_news.10.desc:0 "Los esfuerzos de Riku Hachima Aru por vencer el racismo contra los kivotosianos mediante el compromiso con los locales no dieron frutos, y, acosada por las críticas de los propios trasladados, terminó hundiéndose por completo en una depresión. Tras una discusión con agentes de la Agencia 68, Aru dejó impulsivamente un testamento y, con la ayuda de un piloto militar, emprendió un “vuelo suicida” hacia el territorio del Color.\n\nAunque el equipo de rescate enviado junto a la Agencia 68 logró rescatarla mientras vagaba sola por la costa, se informa que Aru quedó gravemente herida y teñida por el Color, en estado crítico. Aun si sobrevive, existen dudas sobre si podrá desempeñar sus funciones en un estado “terrorificado”. El gobierno de Luxemburgo se niega a conceder entrevistas a toda la prensa."
 HEU_news.10.a:0 "\"¿Por qué… me salvaron?\""
 HEU_news.10.b:0 "Un suceso sin precedentes en la historia de la Agencia 68"
 HEU_news.10.c:0 "¿Terrorificación es algo malo? No lo tengo claro"

 HEU_news.11.t:0 "Riku Hachima Aru regresa al trabajo"
 HEU_news.11.desc:0 "Se creía que, debido a la inversión de su esencia por la terrorificación y otros factores, Riku Hachima Aru abandonaría su puesto de regente de Luxemburgo y presidenta de la Agencia 68. Sin embargo, ya recuperada, Aru acudió a una rueda de prensa frente al hospital, insistiendo en que no sufrió cambios mentales y negando los reportes que afirmaban alteraciones en su carácter o personalidad.\n\nDentro de la coalición gobernante derechista se alzaron fuertes críticas por su intento de suicidio y por haber “tirado” el cargo de jefa de Estado. No obstante, al difundirse entre la población la idea de que miles de cartas de odio influyeron en su estado mental, el primer ministro Joseph Bech anunció que no se le retirará la regencia."
 HEU_news.11.a:0 "Como si nada hubiera pasado"
 HEU_news.11.b:0 "No sé si la mente de Aru está realmente bien"
 HEU_news.11.c:0 "Entonces… ¿qué demonios es eso de la terrorificación?"

 HEU_news.12.t:0 "Manmajeon se exilia en Luxemburgo"
 HEU_news.12.desc:0 "Manmajeon venía mostrando señales de derrota en la guerra reciente y tomó, para sobrevivir, la decisión más “racional” posible: huir. El alto mando de Manmajeon, incluido el presidente estudiantil de Gehenna [GEM.GetLeader], escapó hacia su aliado, el Gran Ducado de Luxemburgo, y la Agencia 68 —gobernante de Luxemburgo— aceptó su exilio.\n\nTras la fuga del alto mando, la Agencia 68 obtuvo la autoridad sobre el ejército de Manmajeon y decidió continuar la guerra. Después del colapso de su antiguo aliado, el ánimo combativo de los luxemburgueses parece haber aumentado, al difundirse la noticia de que “la nación está en peligro”."
 HEU_news.12.a:0 "¡Lucharemos hasta el final!"
 HEU_news.12.b:0 "¿Huir en plena guerra? Es ridículo"
 HEU_news.12.c:0 "¿Será esta huida la clave para cambiar la guerra?"

 HEU_news.13.t:0 "La boda de Riku Hachima Aru"
 HEU_news.13.desc.a:0 "Riku Hachima Aru, ampliamente conocida como regente del Gran Duque de Luxemburgo y presidenta de la Agencia 68, celebró hoy oficialmente una boda en el Palacio Gran Ducal de Luxemburgo. La ceremonia entre Riku Hachima Aru y Riku Hachima “Onikata” Kayoko, ex miembro de la Agencia 68, fue oficiada por la anarquista Emma Goldman, partidaria de la Revolución del 68, y se celebró en privado ante agentes de la Agencia 68 y fervientes simpatizantes.\n\nDurante la boda se realizaron también manifestaciones callejeras lideradas por fuerzas contrarias al matrimonio igualitario —centradas en el Partido Comunista de Luxemburgo—, pero no se extendieron hasta convertirse en choques sangrientos."
 HEU_news.13.desc.b:0 "Riku Hachima Aru, ampliamente conocida como regente del Gran Duque de Luxemburgo y presidenta de la Agencia 68, celebró hoy oficialmente una boda en el Palacio Gran Ducal de Luxemburgo. La ceremonia entre Riku Hachima Aru y Riku Hachima “Asagi” Mutsuki, ex miembro de la Agencia 68, fue oficiada por la anarquista Emma Goldman, partidaria de la Revolución del 68, y se celebró en privado ante agentes de la Agencia 68 y fervientes simpatizantes.\n\nDurante la boda se realizaron también manifestaciones callejeras lideradas por fuerzas contrarias al matrimonio igualitario —centradas en el Partido Comunista de Luxemburgo—, pero no se extendieron hasta convertirse en choques sangrientos."
 HEU_news.13.desc.c:0 "Riku Hachima Aru, ampliamente conocida como regente del Gran Duque de Luxemburgo y presidenta de la Agencia 68, celebró hoy oficialmente una boda en el Palacio Gran Ducal de Luxemburgo. La ceremonia entre Riku Hachima Aru y Riku Hachima “Igusa” Haruka, ex miembro de la Agencia 68, fue oficiada por la anarquista Emma Goldman, partidaria de la Revolución del 68, y se celebró en privado ante agentes de la Agencia 68 y fervientes simpatizantes.\n\nDurante la boda se realizaron también manifestaciones callejeras lideradas por fuerzas contrarias al matrimonio igualitario —centradas en el Partido Comunista de Luxemburgo—, pero no se extendieron hasta convertirse en choques sangrientos."
 HEU_news.13.a:0 "Que este juramento sea eterno"
 HEU_news.13.b:0 "…Esto es “provocador” incluso según Kivotos"
 HEU_news.13.c:0 "¡Impactante!"

 HEU_news.14.t:0 "Intento de asesinato contra Riku Hachima Aru"
 HEU_news.14.desc:0 "Un pequeño grupo de asesinos, conocidos como nazis luxemburgueses, atacó esta madrugada a Riku Hachima Aru cuando salía del Palacio Gran Ducal. Los atacantes la lincharon en grupo con martillos y otras armas contundentes y le dispararon, causándole heridas graves; sin embargo, la aparición de Igusa Haruka impidió que lograran matarla.\n\nDebido a la gravedad del caso, se impuso un embargo informativo, por lo que fuera de Luxemburgo es difícil verificar el estado de salud de Aru. No obstante, se informa que fue ingresada en un hospital militar administrado por el ejército luxemburgués, y el alto mando anunció que su vida no corre peligro. Uno de los asesinos fue abatido en el lugar por Haruka, y la policía luxemburguesa está rastreando a los que escaparon."
 HEU_news.14.a:0 "Trágico, pero Haruka protegió a Aru"
 HEU_news.14.b:0 "Casi se repite la masacre de la Casa Gran Ducal de 1935"

 HEU_news.15.t:0 "Se forma una gran coalición en Luxemburgo"
 HEU_news.15.desc:0 "De forma sorprendente, parece haberse logrado en Luxemburgo una gran coalición entre comunistas y reaccionarios de derecha. Riku Hachima Aru, regente de Luxemburgo y presidenta de la Agencia 68, incorporó al Partido Comunista como socio de coalición para administrar la Ley de Derechos Civiles que garantiza los derechos de la población kivotosiana. El partido derechista gobernante, aunque incómodo ante la intervención política de Aru, dio un paso atrás afirmando que “reconocerá una coalición limitada a la gestión de la Ley de Derechos Civiles”.\n\nSe espera que esta coalición mejore de forma pacífica la relación entre kivotosianos y locales, pero parte de la población kivotosiana rechaza el compromiso de Aru, acusándolo de ser una “sumisión a los locales”."
 HEU_news.15.a:0 "Una gran coalición… que empieza con pintura"
 HEU_news.15.b:0 "¿Reaccionarios y comunistas en coalición? Vaya ‘big tent’… hasta cabe un elefante"

 HEU_news.16.t:0 "Se proclama el Gran Ducado Federado de Luxemburgo"
 HEU_news.16.desc:0 "El Gran Ducado de Luxemburgo, único estado soberano del pueblo germánico y autoproclamado “estado representante del pueblo germánico” tras el Gran Traslado, anunció hoy la fundación de un Gran Ducado Federado tras ocupar el Distrito Central de Manmajeon. El plan contempla que Luxemburgo lidere una confederación, estableciendo condados y ducados subordinados a Luxemburgo en los territorios ocupados de Deutschland.\n\nEn la ceremonia de victoria, a la que Riku Hachima Aru no asistió por problemas de salud, Asagi Mutsuki propagandeó que la victoria del Gran Ducado Federado está cerca. Expertos analizan que esta proclamación evidencia la fuerte determinación luxemburguesa de conquistar militarmente toda Deutschland."
 HEU_news.16.a:0 "¿Esto… va bien?"
 HEU_news.16.b:0 "La Agencia 68 está montando un espectáculo raro"
 HEU_news.16.c:0 "¿Luxemburgo como representante del pueblo alemán?"

 HEU_news.17.t:0 "[HEU.GetName] anuncia su plan de unificación germánica"
 HEU_news.17.desc.a:0 "Hoy, el Parlamento de Luxemburgo, con el consentimiento de Riku Hachima Aru, declaró oficialmente que Luxemburgo posee un plan para unificar al pueblo germánico, fragmentado tras el Gran Traslado, y que es la comunidad representativa del pueblo germánico. Dado que Aru es kivotosiana y había sido indiferente al nacionalismo germánico, la noticia resulta sorprendente.\n\nLa mayoría de los expertos interpreta que Aru busca el apoyo de los locales para resolver el conflicto étnico entre kivotosianos y humanos. Sin embargo, algunos comentaristas sostienen que esta declaración de “comunidad nacional” es demasiado “imperialista” para ser idea de Aru, y sugieren que podría estar siendo utilizada por un político con otras intenciones." # comunista
 HEU_news.17.desc.b:0 "Hoy, el gobierno militar de Luxemburgo, con el “consentimiento” de Riku Hachima Aru, declaró oficialmente que Luxemburgo posee un plan para unificar al pueblo germánico, fragmentado tras el Gran Traslado, y que es la comunidad representativa del pueblo germánico. Dado que Aru es kivotosiana y había sido indiferente al nacionalismo germánico, la noticia resulta sorprendente.\n\nNo obstante, la mayoría de los expertos señala que, tras el golpe de Estado, Riku Hachima Aru habría quedado encarcelada por Asagi Mutsuki, por lo que ese “consentimiento” habría sido obtenido bajo extrema coacción. Algunos comentaristas observan con cinismo que esta declaración de “comunidad nacional” solo refleja el deseo expansionista de Mutsuki." # fascista
 HEU_news.17.a:0 "Sé que esto es contradictorio…"
 HEU_news.17.b:0 "¿Esa forajida se volvió loca?"
 HEU_news.17.c:0 "¿Una Bismarck con cuernos? Ridículo."

 HEU_news.18.t:0 "¡Asalto de Kaitenger!"
 HEU_news.18.desc:0 "La organización criminal Kaitenger, que se autoproclama defensora de la justicia, invadió hoy la ciudad de Luxemburgo piloteando un enorme robot llamado KAITEN Mk.0. Kaitenger Red, mediante un comunicado grabado, declaró que considera a la Agencia 68 una “organización malvada” por obstaculizar su obtención de fondos, y que destruirá por completo la ciudad de Luxemburgo.\n\nLa policía de la ciudad se concentra en evacuar a los residentes hacia el sur, y la Agencia 68 anunció que iniciará una “guerra total” contra el KAITEN Mk.0. Riku Hachima Aru se encuentra personalmente conteniendo el avance de Kaitenger, y la policía afirmó que el KAITEN Mk.0 no resistirá demasiado tiempo."
 HEU_news.18.a:0 "¡Vamos, es hora de nuestra guerra total!"
 HEU_news.18.b:0 "¿Guerra total? ¿También dan algo como piroxenos?"
 HEU_news.18.c:0 "¡Ojalá pudiéramos producir en masa robots así!"

 HEU_news.19.t:0 "Se construye el Parque Conmemorativo de Berg"
 HEU_news.19.desc:0 "Desde el Gran Traslado, los actos de conmemoración liderados por humanos para las víctimas se han realizado ampliamente por organizaciones civiles en lugares como Argelia o Canadá. Sin embargo, es un caso sin precedentes que un kivotosiano construya un parque para reflexionar y homenajear a las víctimas humanas ocurridas justo tras el Gran Traslado. La líder de Luxemburgo, Riku Hachima Aru, construyó un memorial en el antiguo Castillo de Saint Berg, abandonado, para recordar a los asesinados por estudiantes de Gehenna inmediatamente después del Gran Traslado en 1935.\n\nEl memorial consta de un parque conmemorativo en los terrenos del castillo y de un museo dentro del propio castillo para homenajear a la Casa Gran Ducal de Nassau de Luxemburgo, masacrada como familia. Aru asistió personalmente a la inauguración y dejó un mensaje de arrepentimiento kivotosiano y reconciliación entre ambos pueblos."
 HEU_news.19.a:0 "Para cambiar el mundo"
 HEU_news.19.b:0 "Esa “forajida” se ablanda demasiado"
 HEU_news.19.c:0 "Aún queda justicia en tierras luxemburguesas"

 HEU_news.20.t:0 "Se proclama la Ley de Unión"
 HEU_news.20.desc:0 "Hoy se promulgó la Ley de Unión, por la cual Gehenna, Trinity y todo el territorio del pueblo germánico quedan integrados como parte del “Gran Ducado Federado Germánico”, una entidad dentro del Gran Ducado de Luxemburgo. La declaración de victoria y la ceremonia de promulgación, que iban a ser realizadas personalmente por Riku Hachima Aru en la antigua Catedral de Trinity en Edén, fueron aplazadas indefinidamente, alegando el gobierno luxemburgués que Aru padece una neumonía aguda.\n\nEste anuncio de la Ley de Unión es un acontecimiento simbólico que representa la victoria milagrosa de la Agencia 68, una fuerza menor en comparación con Trinity y Gehenna, y expertos militares de todo el mundo investigan cómo pudo ocurrir."
 HEU_news.20.a:0 "\"Neumonía\"… qué mentira tan absurda"
 HEU_news.20.b:0 "Riku Hachima Aru se convirtió en una auténtica forajida"
 HEU_news.20.c:0 "No queda más que admitirlo: son los líderes del pueblo germánico"

 HEU_news.21.t:0 "Guerra Luxemburgo–Manmajeon"
 HEU_news.21.desc.a:0 "Asagi Mutsuki emitió hoy un comunicado urgente anunciando que el ejército de Gehenna invadió ilegalmente territorio luxemburgués y que, como respuesta, movilizó tropas. El bando de [GEM.GetLeader] declaró que el anuncio de Mutsuki es “una mentira total” y desplazó tropas hacia el oeste, estallando así una guerra total entre Luxemburgo y Manmajeon.\n\nDado que fue Mutsuki —y no Riku Hachima Aru, considerada por lo general la jefa de Estado luxemburguesa— quien declaró la guerra y dirige el ejército, algunos medios extranjeros sospechan que Aru podría haber perdido el control sobre el ejército a manos de Mutsuki. Aru no ha aparecido en público desde el estallido de la guerra."
 HEU_news.21.a:0 "…Mutsuki… ¿qué estás pensando…?"
 HEU_news.21.b:0 "Los forajidos de la Agencia 68 la armaron en grande"
 HEU_news.21.c:0 "¿El suicidio glamuroso de Luxemburgo?"

 HEU_news.22.t:0 "Coronación de Riku Hachima Aru"
 HEU_news.22.desc:0 "El cargo oficial de Riku Hachima Aru era conocido como “regente del Gran Duque de Luxemburgo”. La regencia, por su naturaleza, era inestable, y algunos políticos locales soñaban con un “golpe legal” importando una nueva casa ducal del extranjero para terminar con su puesto. Aru respondió disolviendo el Parlamento para impulsar una reforma constitucional.\n\nEl nuevo Parlamento aprobó, por un margen estrecho, una enmienda que reconoce a Riku Hachima Aru como Gran Duquesa de Luxemburgo. Con esta decisión, la Casa Riku Hachima puede heredar la jefatura de Estado del Gran Ducado y del Ducado Federado. La comunidad internacional, reconociendo que el proceso se realizó mediante votación parlamentaria y no por un golpe, está convergiendo hacia el reconocimiento de su título."
 HEU_news.22.a:0 "Al final… sí que me volví una Gran Duquesa… jaja…"
 HEU_news.22.b:0 "¿Ser Gran Duque es más que ser Presidenta del Consejo Estudiantil? Ni idea"
 HEU_news.22.c:0 "¡Nació la primera casa ducal legal de Kivotos!"

 HEU_news.23.t:0 "La boda de Riku Hachima Aru"
 HEU_news.23.desc.a:0 "Riku Hachima Aru, ampliamente conocida como Gran Duquesa del Gran Ducado de Luxemburgo y del Ducado Federado Germánico, así como presidenta de la Agencia 68, celebró hoy oficialmente una boda en la antigua catedral de Edén. La ceremonia entre Riku Hachima Aru y Riku Hachima “Onikata” Kayoko, ex miembro de la Agencia 68, se llevó a cabo como un acto público con la participación de fervientes simpatizantes de la Gran Duquesa.\n\nAunque Luxemburgo no permite legalmente el matrimonio igualitario, se eludió la ley mediante una orden ejecutiva ducal propuesta por el partido gobernante, el Partido Federal de Estudiantes, que permite el matrimonio igualitario únicamente para Aru. Los partidos locales de derecha y de izquierda (el Partido Derechista y el Partido Comunista) publicaron un comunicado conjunto afirmando que “respetan la vida privada de Aru, pero esto no debe conducir a la legalización del matrimonio igualitario en general”."
 HEU_news.23.desc.b:0 "Riku Hachima Aru, ampliamente conocida como Gran Duquesa del Gran Ducado de Luxemburgo y del Ducado Federado Germánico, así como presidenta de la Agencia 68, celebró hoy oficialmente una boda en la antigua catedral de Edén. La ceremonia entre Riku Hachima Aru y Riku Hachima “Asagi” Mutsuki, ex miembro de la Agencia 68, se llevó a cabo como un acto público con la participación de fervientes simpatizantes de la Gran Duquesa.\n\nAunque Luxemburgo no permite legalmente el matrimonio igualitario, se eludió la ley mediante una orden ejecutiva ducal propuesta por el partido gobernante, el Partido Federal de Estudiantes, que permite el matrimonio igualitario únicamente para Aru. Los partidos locales de derecha y de izquierda (el Partido Derechista y el Partido Comunista) publicaron un comunicado conjunto afirmando que “respetan la vida privada de Aru, pero esto no debe conducir a la legalización del matrimonio igualitario en general”."
 HEU_news.23.desc.c:0 "Riku Hachima Aru, ampliamente conocida como Gran Duquesa del Gran Ducado de Luxemburgo y del Ducado Federado Germánico, así como presidenta de la Agencia 68, celebró hoy oficialmente una boda en la antigua catedral de Edén. La ceremonia entre Riku Hachima Aru y Riku Hachima “Igusa” Haruka, ex miembro de la Agencia 68, se llevó a cabo como un acto público con la participación de fervientes simpatizantes de la Gran Duquesa.\n\nAunque Luxemburgo no permite legalmente el matrimonio igualitario, se eludió la ley mediante una orden ejecutiva ducal propuesta por el partido gobernante, el Partido Federal de Estudiantes, que permite el matrimonio igualitario únicamente para Aru. Los partidos locales de derecha y de izquierda (el Partido Derechista y el Partido Comunista) publicaron un comunicado conjunto afirmando que “respetan la vida privada de Aru, pero esto no debe conducir a la legalización del matrimonio igualitario en general”."
 HEU_news.23.desc.d:0 "Riku Hachima Aru, ampliamente conocida como Gran Duquesa del Gran Ducado de Luxemburgo y del Ducado Federado Germánico, así como presidenta de la Agencia 68, celebró hoy oficialmente una boda en la antigua catedral de Edén. La ceremonia entre Riku Hachima Aru y Riku Hachima “Sorasaki” Hina, ex miembro del antiguo Comité Disciplinario, se llevó a cabo como un acto público con la participación de fervientes simpatizantes de la Gran Duquesa.\n\nAunque Luxemburgo no permite legalmente el matrimonio igualitario, se eludió la ley mediante una orden ejecutiva ducal propuesta por el partido gobernante, el Partido Federal de Estudiantes, que permite el matrimonio igualitario únicamente para Aru. Los partidos locales de derecha y de izquierda (el Partido Derechista y el Partido Comunista) publicaron un comunicado conjunto afirmando que “respetan la vida privada de Aru, pero esto no debe conducir a la legalización del matrimonio igualitario en general”."
 HEU_news.23.a:0 "Que este juramento sea eterno"
 HEU_news.23.b:0 "…Quizá ser Gran Duque sí sea más que ser Presidenta del Consejo Estudiantil…"
 HEU_news.23.c:0 "Vaya, ese país le da muchísimo poder a su Gran Duque"

 HEU_news.24.t:0 "Guerra Luxemburgo–Trinity"
 HEU_news.24.desc.a:0 "Luxemburgo logró una victoria contra Gehenna gracias a tácticas audaces, pero ahora continúa la guerra contra el bando de [TRM.GetLeader]. Aunque los expertos siguen evaluando como baja la posibilidad de victoria de Luxemburgo y la Agencia 68, algunos predicen que podría ocurrir un resultado “milagroso”, basándose en el sorprendente desempeño mostrado por el ejército luxemburgués contra Gehenna."
 HEU_news.24.a:0 "…La sangre vuelve a correr otra vez…"
 HEU_news.24.b:0 "La verdadera guerra entre el heredero de Gehenna y Trinity"
 HEU_news.24.c:0 "¿Logrará Luxemburgo el milagro?"

 HEU_news.25.t:0 "Lucha de poder en el Consejo Estudiantil General"
 HEU_news.25.desc:0 "Aunque Riku Hachima Aru ganó la lucha de poder contra el Consejo Estudiantil General existente y tomó el control, parece que aún hay muchos que no la reconocen como la nueva “Presidenta del Consejo Estudiantil General de Kivotos”. Nanami Ayaka, una supuesta “estudiante de Trinity” que solo actuaba en redes, anunció su debut como streamer virtual coincidiendo con la proclamación de Aru, y declaró que comenzará transmisiones deseando “el colapso del régimen de Riku Hachima Aru”.\n\nAunque Ayaka se autoproclama trinitaria, ha ganado gran popularidad entre los locales al sostener que “es contradictorio que los de Gehenna, que cometieron masacres durante el Gran Traslado, prediquen superioridad moral”. Su canal anti-régimen ya reúne numerosos suscriptores, y Riku Hachima Aru estableció un canal oficial de streaming del Consejo Estudiantil General para la guerra de opinión de la Revolución del 68."
 HEU_news.25.a:0 "¡Straight juguetón, en marcha!"
 HEU_news.25.b:0 "El poder de la Presidenta sigue inestable"
 HEU_news.25.c:0 "Otro caos engendrado por la Revolución del 68"

 HEU_news.26.t:0 "Se apaga la confusión del Comité Revolucionario del Consejo Estudiantil"
 HEU_news.26.desc:0 "Aunque la streamer disidente Nanami Ayaka insistía en que “Riku Hachima Aru no puede vencer a fuerzas externas que amenazan a la Tierra”, Aru demostró su idoneidad como Presidenta al derrotar al bando de [GEI.GetName] en la guerra. Aru aceptó las críticas de Ayaka, admitiendo que la Revolución del 68 había prestado demasiada atención a la opinión de los locales, y prometió celebrar pronto un acto conmemorativo para las víctimas de Luxemburgo masacradas durante el Gran Traslado.\n\nNanami Ayaka decidió reconocer públicamente que Aru posee las cualidades de una Presidenta del Consejo Estudiantil y anunció el fin de sus actividades como streamer virtual. Tras una larga confusión, parece que Riku Hachima Aru finalmente está siendo reconocida como la auténtica Presidenta del Consejo Estudiantil General de Kivotos."
 HEU_news.26.a:0 "Fue una época dura"
 HEU_news.26.b:0 "Al menos esa hardboiled salvó la Tierra"
 HEU_news.26.c:0 "Sea ‘Consejo Estudiantil’ o ‘Consejo de cuchillos’, capacidad sí tiene"

 HEU_news.27.t:0 "Sorasaki Hina se une a la Agencia 68"
 HEU_news.27.desc:0 "Tras decidirse la disolución forzosa del Comité Disciplinario de Gehenna, muchos cercanos a Hina creyeron que anunciaría su retiro. Sin embargo, hoy se la vio aparecer en Manmajeon con un uniforme con el logo de la Agencia 68 y documentos para ejecutar la orden de disolución, dejando a numerosas estudiantes de Gehenna en shock.\n\nAmau Ako, ex administradora principal, afirmó que Hina fue lavada de cerebro por el proyecto de Manmajeon “NK Ultra”, pero Hina impactó a la prensa de Gehenna al declarar: \"Me di cuenta de que Riku Hachima Aru es una líder mejor que yo, y solo he jurado lealtad por mi propia voluntad\". Algunos ex miembros del Comité Disciplinario la llaman traidora, pero ella no ha emitido mensaje alguno ante tales reacciones."
 HEU_news.27.a:0 "\"Yo también me sorprendí… ¿cuánto más se habrán sorprendido los demás?\""
 HEU_news.27.b:0 "…¿Lo de NK Ultra no era broma?"
 HEU_news.27.c:0 "¿NK Ultra? ¿Tecnología humana de lavado de cerebro? ¿Luxemburgo obtuvo realmente esa arma?"

 HEU_news.28.t:0 "Reunificación de Gehenna por [HEU.GetName]"
 HEU_news.28.desc:0 "Aunque la Agencia 68, que gobierna Luxemburgo, posee una gran proporción de población gehenna, se preveía que, por su identidad como Gran Ducado de Luxemburgo, lograr la reunificación de Gehenna sería difícil. Sin embargo, el liderazgo de [HEU.GetLeader] hizo posible el éxito del dominio sobre Gehenna por parte de [HEU.GetName].\n\nAun convirtiéndose en gobernante de Gehenna, [HEU.GetLeader] no parece desear un rango como “presidenta” de Gehenna. En lugar de mantenerse como líder de Gehenna, valora más su autoridad como líder de [HEU.GetName], y se espera que otra persona designada por ella ocupe la presidencia de Gehenna."
 HEU_news.28.a:0 "¡Un logro increíble!"
 HEU_news.28.b:0 "¡Ha surgido un nuevo gobernante de Gehenna!"
 HEU_news.28.c:0 "El asombroso éxito de Luxemburgo"

 HEU_news.29.t:0 "Alianza económica Luxemburgo–[KSP.GetNameDef]"
 HEU_news.29.desc:0 "BLEU, siglas de la Unión Económica Belga-Luxemburguesa, fue una alianza económica entre ambos países que se mantuvo desde 1921. Luxemburgo utilizaba una moneda fiduciaria cuyo valor se vinculaba a la moneda belga, pero Bélgica colapsó con el Gran Traslado y sufrió hiperinflación.\n\nSin embargo, gracias a negociaciones entre [KSP.GetLeader] y [HEU.GetLeader], el Banco Central de Luxemburgo decidió firmar una nueva alianza económica que vincule el valor del yen de [KSP.GetNameDef] con el del franco luxemburgués. El Parlamento Central de Luxemburgo declaró en una entrevista que “este acuerdo promete prosperidad conjunta para las economías de ambos países”."
 HEU_news.29.a:0 "A ver… ¿entonces ya salimos del caos, no?"
 HEU_news.29.b:0 "Ningún aliado vale más que el dinero…"

 HEU_news.30.t:0 "Golpe de Estado en el Gran Ducado de Luxemburgo"
 HEU_news.30.desc:0 "La confrontación política en Luxemburgo ha alcanzado un punto extremo, aparentemente tras la controversia sobre la fallida “Ley de Derechos Civiles”. Riku Hachima Aru intentó garantizar los derechos de la población kivotosiana mediante compromisos con los locales y a través del procedimiento parlamentario. Sin embargo, el partido derechista bloqueó sus intentos, y algunos legisladores conservadores parecen haberla humillado personalmente.\n\nAsagi Mutsuki decidió que no toleraría más las burlas contra Aru. Declaró que ha “confinado” a Aru para protegerla y, utilizando al ejército, tomó instalaciones clave en Luxemburgo. Aunque Onikata Kayoko se opuso y huyó con algunas fuerzas, al menos por ahora Asagi Mutsuki se hizo con el poder con un golpe de una sola noche."
 HEU_news.30.a:0 "Esto… sí que es el verdadero orden."
 HEU_news.30.b:0 "Los locales jamás reconocerán nuestros derechos."
 HEU_news.30.c:0 "Para los kivotosianos, el ‘debido proceso’ es una broma sin sentido."

 HEU_news.31.t:0 "Elecciones de [GetYear] en [HEU.GetNameDef]"
 HEU_news.31.desc.kayoko:0 "Tras el colapso del gobierno de Asagi Mutsuki, Luxemburgo, Gehenna y Trinity celebraron las primeras elecciones generales parlamentarias del Ducado Federado Germánico. Estas elecciones, con un parlamento de 600 escaños, demostraron que la Ley de Unión no es una mera declaración, sino un nuevo sistema real que garantiza la igualdad de estatus entre los tres estados. En esta elección, Onikata Kayoko se convirtió en primera ministra mediante una coalición arcoíris apoyada por un partido gehenna y una alianza local de izquierda-derecha.\n\nKayoko declaró que, tras asumir el cargo, aplicará políticas de gestión del Estado “para Riku Hachima Aru”. Dado que es una fiel monárquica pro-Aru, se espera que no haya cambios drásticos."
 HEU_news.31.desc.mutsuki:0 "Tras la entrada en vigor de la Ley de Unión, Luxemburgo, Gehenna y Trinity celebraron las primeras elecciones generales parlamentarias del Ducado Federado Germánico. Estas elecciones, con un parlamento de 600 escaños, demostraron que la Ley de Unión no es una mera declaración, sino un nuevo sistema real que garantiza la igualdad de estatus entre los tres estados. En esta elección, Asagi Mutsuki se convirtió en primera ministra mediante una coalición arcoíris apoyada por un partido gehenna y una alianza local de izquierda-derecha.\n\nMutsuki anunció que impulsará políticas estatales “para Riku Hachima Aru”. Sin embargo, fue la cabecilla de un golpe y mantuvo un régimen dictatorial dentro de Luxemburgo; el hecho de que evitara castigo legal se debió únicamente al apoyo de muchos burócratas pro-Asagi que permanecieron en el gobierno. Al ser una primera ministra “impopular” que jamás ganaría en un sistema presidencial directo, se proyecta pesimistamente que su política quedará arrastrada por el parlamento."
 HEU_news.31.desc.mine:0 "Tras la entrada en vigor de la Ley de Unión, Luxemburgo, Gehenna y Trinity celebraron las primeras elecciones generales parlamentarias del Ducado Federado Germánico. Estas elecciones, con un parlamento de 600 escaños, demostraron que la Ley de Unión no es una mera declaración, sino un nuevo sistema real que garantiza la igualdad de estatus entre los tres estados. En esta elección, Aomori Mine se convirtió en primera ministra mediante una coalición blanco-negra apoyada por la alianza de los Caballeros de Socorro–Pandemonium Society y el Partido Popular Cristiano Social.\n\nAunque algunos interpretan erróneamente que Trinity, como potencia derrotada, “conquistó” rápidamente el ducado, en realidad su poder proviene en gran medida de Pandemonium Society y del Partido Popular Cristiano Social. Expertos prevén que Mine se enfocará en políticas para los populistas de Gehenna y los conservadores católicos."
 HEU_news.31.desc.uzawa:0 "Tras la entrada en vigor de la Ley de Unión, Luxemburgo, Gehenna y Trinity celebraron las primeras elecciones generales parlamentarias del Ducado Federado Germánico. Estas elecciones, con un parlamento de 600 escaños, demostraron que la Ley de Unión no es una mera declaración, sino un nuevo sistema real que garantiza la igualdad de estatus entre los tres estados. En esta elección, Uzawa Reisa se convirtió en primera ministra mediante una coalición blanco-negra apoyada por la alianza de los Caballeros de Socorro–Pandemonium Society y el Partido Popular Cristiano Social.\n\nAunque algunos interpretan erróneamente que Trinity, como potencia derrotada, “conquistó” rápidamente el ducado, en realidad su poder proviene en gran medida de Pandemonium Society y del Partido Popular Cristiano Social. Reisa declaró que su objetivo más importante es erradicar “la terrible inmoralidad del gabinete Asagi”."
 HEU_news.31.a:0 "La Ley de Unión no es una ilusión."
 HEU_news.31.b:0 "Una elección que sacudirá a Kivotos."
 HEU_news.31.c:0 "¡¿La líder del pueblo germánico es una chica con halo?!"

 HEU_news.32.t:0 "Elección del primer ministro tras la Ley de Unión"
 HEU_news.32.desc:0 "Tras la creación del Ducado Federado Germánico y la elección del primer ministro, [HEU.GetLeader] fue elegido como primer ministro mediante un sufragio indirecto realizado por ciertos líderes políticos de Luxemburgo, Gehenna y Trinity. El nuevo primer ministro enfrenta un problema de legitimidad, pues no fue elegido por un procedimiento democrático; sin embargo, la elección sin comicios fue aceptada con el argumento de que es necesario “reconstruir el país devastado por la guerra”.\n\nEl gobierno de [HEU.GetNameDef] anunció que, dentro de dos años, se celebrarán elecciones generales en todo el ducado, y que el primer ministro actual será un primer ministro “puente” hasta que se ordene el caos de la posguerra. Al no intervenir en absoluto en este proceso de elección, la ciudadanía confirmó que Riku Hachima Aru ha renunciado a su intervencionismo político y permanecerá como monarca constitucional."
 HEU_news.32.a:0 "Nuestro final."
 HEU_news.32.b:0 "¿De verdad el vencedor permitió al vencido participar en elegir al primer ministro?"
 HEU_news.32.c:0 "Aplausos para el pueblo germánico"

 HEU_news.33.t:0 "Unificación de [GEH.GetNameDef] con el Gran Ducado de Luxemburgo"
 HEU_news.33.desc:0 "La Gehenna dividida en dos eligió una unificación pacífica, sin guerra. En una entrevista conjunta con Riku Hachima Aru, el bando de [GEH.GetLeader] anunció que parte de [GEH.GetName] decidió integrarse bajo la condición de que Luxemburgo recibirá plena libertad y autonomía en Gehenna.\n\nRiku Hachima Aru pudo haber optado por la guerra, pero eligió la autonomía bajo el gobierno de [GEH.GetLeader] antes que arriesgar la destrucción de Luxemburgo. Con ello, la Gehenna dividida se integra por completo, y la reunificación de Gehenna por [GEH.GetLeader] se ha hecho realidad."
 HEU_news.33.a:0 "¡Viva Gehenna!"
 HEU_news.33.b:0 "¡Que Gehenna se reunifique pacíficamente es increíble!"
 HEU_news.33.c:0 "¡Es el fin de la historia de Luxemburgo!"


 HEU_event.0.t:0 "Discurso de Año Nuevo de 1936, transcripción taquigráfica del pleno de la Asamblea Nacional <1/2>"
 HEU_event.0.desc:0 "Presidente de la Asamblea, Reuter: Entonces, daremos inicio al discurso de Año Nuevo de 1936 en esta Asamblea. Ruego a todos los diputados que tomen asiento.\n\nPrimer ministro Bech: ¡Diputados! ¡Y también a los periodistas que están al fondo! Me alegra verlos a todos. Quisiera expresar mi gratitud a todos los que se han reunido en estos tiempos difíciles.\n\nEl año 1935 fue un año trágico para nuestro Luxemburgo. Tras la Gran Transferencia, los vándalos de otro mundo que llegaron en masa saquearon todo Luxemburgo. Saquearon las propiedades de los súbditos del Gran Ducado, atacaron a la gendarmería e incluso asesinaron a Su Alteza la Gran Duquesa Charlotte, a Su Alteza el Príncipe Consorte Félix, y hasta a los miembros de la familia ducal, incluidos el conde Charles, que apenas tenía ocho años, y la señorita Alix, de seis.\n\n(Se oye una voz decir: <¡Hijos de puta!>)\n\nY el asesino capturado dijo esto: 'No creí que fueran a morir tan fácilmente'... ¿De verdad creen que eso tiene el menor sentido?\n\n(Se oye una voz decir: <¡Hay que matarlos!>)\n\nJamás olvidaremos esta tragedia. Y sin falta, nos vengaremos de ellos. ¡Hagamos que nuestra patria no se doblegue ni siquiera ante esos bárbaros del oeste!\n\n(Se oyen aplausos de los diputados)\n\nSin embargo, en la Gran Transferencia no todos los transferidos fueron invasores. Gracias a Su Alteza el Regente, y a los justos que lucharon junto a nosotros contra la invasión de los vándalos, Luxemburgo existe hoy. La época de la confusión ha terminado, y ahora debemos reunir fuerzas y avanzar hacia la reconstrucción. ¿Acaso nuestra patria no debe volver a estar sana, aunque sea para vengar a Sus Altezas fallecidas?\n\nPor ello, para volver a la normalidad, he discutido con los líderes parlamentarios el levantamiento de la ley marcial, y con el consentimiento de todos los partidos representados en la cámara, he presentado formalmente a Su Alteza el Regente la resolución para levantar la ley marcial. Espero que sea un gran regalo de Año Nuevo para los súbditos de Luxemburgo.\n\n(El primer ministro Bech se aparta del micrófono y entrega los documentos. La regente Riku Hachima Aru avanza.)"
 HEU_event.0.a:0 "Aru sostuvo el micrófono y, despacio, reguló su respiración."

 HEU_event.1001.t:0 "Discurso de Año Nuevo de 1936, transcripción taquigráfica del pleno de la Asamblea Nacional <2/2>"
 HEU_event.1001.desc:0 "Aru: Yo, eh... a... ¿hola? Soy Riku Hachima, de la Agencia de Investigación 68... no, la regente encargada de la Casa Gran Ducal de Luxemburgo.\n\n(Aplausos de los diputados, excepto del Partido del Estado Independiente)\n\n...Durante la Gran Transferencia, yo también vi con mis propios ojos lo que pasó. Después de ahuyentar a los vándalos más o menos, fui con los gendarmes y con Mutsuki y, eh, o sea, Mutsuki es mi amiga. Estábamos revisando habitaciones por si alguien se escondía en el palacio... y entonces, en el dormitorio del palacio, vimos que ellos estaban así... sí. Los encontramos primero junto con los gendarmes. Era difícil incluso distinguir quién era quién...\n\n(Hay un diputado llorando)\n\nKivotos es un lugar donde la muerte no es algo común. Yo nunca imaginé que alguien pudiera morir, o que... se hiciera pedazos, o ver algo así... lo siento. Eh, un momento, por favor...\n\nPresidente de la Asamblea, Reuter: Su Alteza, aquí tiene un pañuelo.\n\nAru: No. Estoy... bien. (Se limpia la comisura de los ojos con la manga) Perdón por no poder mostrar una actitud más serena. Haré todo lo posible para levantar un Luxemburgo donde nunca vuelva a ocurrir lo mismo, un Luxemburgo en el que nadie sufra. Apruebo la resolución de levantamiento de la ley marcial presentada por la Asamblea, y declaro que, a partir de este momento, 1 de enero de 1936, la ley marcial queda levantada en todo el Gran Ducado de Luxemburgo.\n\n(Se oye un diputado gritar: <¡Viva el Gran Ducado!>)\n\nHa pasado el segundo año desde la Gran Transferencia. El primer ministro dijo que esto es un 'retorno a la vida cotidiana', pero esa 'vida cotidiana' que conocíamos no volverá tal cual. Ni yo ni los demás de Kivotos podremos regresar a nuestro mundo original. Aunque esta convivencia empezó con tragedia, debemos aprender a vivir juntos: los de Kivotos y los locales.\n\nYa que he asumido la regencia, yo... me esforzaré sin falta por proteger a todos en esta tierra. Pase lo que pase, no retrocederé. Me esforzaré para que este sea un Año Nuevo lleno de esperanza. Gracias.\n\n(Todos los diputados se ponen de pie y aplauden, excepto el Partido del Estado Independiente)"
 HEU_event.1001.a:0 "En medio de la desesperación, encontrar esperanza"

 HEU_event.101.t:0 "El futuro de la Agencia de Investigación"
 HEU_event.101.desc:0 "Las burlas y el desprecio de los locales, y el nacionalismo germánico del Partido del Estado Independiente, un partido nazi. Los inmigrantes de Gehenna en Luxemburgo le dicen esto a Riku Hachima Aru: \"Eres una estudiante de Gehenna, no una ciudadana de Luxemburgo.\" La única cadena que mantiene a Riku Hachima Aru atada a la ley luxemburguesa es su propia moral bondadosa. Pero, ¿y si los luxemburgueses realmente no la quieren? Quizá luchar por los estudiantes de Gehenna que desean que ella los proteja sea, precisamente, el papel de Aru.\n\n\"¿No hay forma de estar del lado de ambos...? ¿De los locales de Luxemburgo... y de los inmigrantes de Gehenna...?\"\n\nYa entrada la noche, cuando sus compañeros de la Agencia de Investigación ya se han ido todos a casa, Aru permanece sola en su oficina, secándose las lágrimas que se le acumulan en los ojos.\n\n\"Aunque sea demasiado débil como para volverme una forajida... aun así, al menos quiero caminar por el 'camino correcto'.\" Y, tras secarse las lágrimas, Aru tomó una decisión."
 HEU_event.101.a:0 "\"No abandonaré a los locales. Nunca.\""
 HEU_event.101.b:0 "\"Quizá mi misión sea proteger a los de Kivotos que cruzaron en la Gran Transferencia.\""
 HEU_event.101.c:0 "\"No abandono a nadie. Esa es mi elección.\""

 HEU_event.102.t:0 "La regente Riku Hachima"
 HEU_event.102.desc:0 "Hasta que se apaciguara el caos posterior a la Gran Transferencia, la ceremonia oficial de investidura de Aru como regente se había pospuesto una y otra vez. Pero ya han pasado meses desde que Aru empezó a desempeñar su labor como regente, y el primer ministro Joseph Bech decidió que ya no podía seguir aplazando la ceremonia. Para Bech, un conservador estricto, que una regente (provisional) sin ceremonia oficial entrara y saliera del palacio a su antojo era prácticamente lo mismo que rebajar la 'dignidad nacional'.\n\nEn el salón del primer piso del palacio, reunidos los periodistas. Bech le tendió un libro de la Constitución a Aru, que había venido con un vestido.\n\n\"Ponga la mano y jure. ¿Jura la señorita Riku Hachima, como regente del Gran Ducado de Luxemburgo, lealtad a la Casa Gran Ducal, y lealtad a la Constitución y a las leyes de la patria?\"\n\nSi ni siquiera existe ya la 'Casa Gran Ducal' a la que jurar lealtad, ¿tiene sentido este juramento? Más que eso... ¿de verdad tengo que ser yo quien asuma la regencia de este país? Con la carga y el miedo apretándole el pecho, Aru se tragó innumerables pensamientos y puso la mano. \"Lo juro.\"\n\n\"...Muy bien. En virtud del Artículo 7, párrafo 2 de la Constitución, que confiere a la Asamblea la autoridad de reconocer al regente, reconozco a la señorita Riku Hachima Aru como la regente legítima de la Casa Gran Ducal de Luxemburgo.\"\n\n¡Clic! ¡Clic! En cuanto Bech terminó de hablar, más de diez periodistas hicieron estallar el sonido de sus cámaras al mismo tiempo."
 HEU_event.102.a:0 "Aru esbozó una sonrisa incómoda hacia los periodistas reunidos."
 HEU_event.102.b:0 "Abrumada por el peso de haberse convertido oficialmente en regente, Aru apretó con fuerza los dientes."

 HEU_event.103.t:0 "El seguimiento de Kayoko"
 HEU_event.103.desc:0 "Kayoko no es, por naturaleza, una empleada con suficiente entusiasmo como para adelantarse a hacer tareas que nadie le pidió (eso es cosa de Haruka). Pero ahora era distinto. En los últimos tiempos, los diputados del Partido de Derecha, que lidera el gobierno de coalición, han empezado a reunirse a menudo por su cuenta sin contactar a la Agencia de Investigación 68. Parecían querer celebrar encuentros 'secretos', pero en un país tan pequeño es imposible que no los descubran cuando, cada semana el mismo día, los coches se escabullen hacia las afueras de la ciudad de Luxemburgo.\n\n\"Como sospechaba.\"\n\nKayoko, de pie junto a la ventana del edificio, observó los autos negros que salían de la ciudad. Lo que sea que tramen allí, a Kayoko no le interesa. Pero... ¿y si algo malo le pasa a Aru?"
 HEU_event.103.a:0 "A ver... puedo sacar un rato."

 HEU_event.104.t:0 "En Bettembourg"
 HEU_event.104.desc:0 "Bettembourg, al sur de la ciudad de Luxemburgo. Kayoko avanzó por la calle nocturna, amortiguando cualquier sonido. El edificio del ayuntamiento de Bettembourg seguía encendido y luminoso incluso a altas horas. No había guardias. Parecía que pensaban que, para no ser descubiertos, lo mejor era no desplegar gente alrededor. Por supuesto, estaban completamente equivocados. Gracias a eso, Kayoko pudo infiltrarse hasta el ayuntamiento sin problemas.\n\nEn la primera planta del ayuntamiento, se veían diputados del Partido de Derecha reunidos de forma apresurada. El primer ministro Joseph Bech no estaba, pero sí estaban el presidente de la Asamblea, Émile Reuter, y otros diputados del mismo partido.\n\nEl presidente Reuter hizo un gesto con la mano. \"...¡Yo acepté la propuesta de nombrarla regente dando por hecho que, si Aru era designada, Luxemburgo se iba a ir *a la ruina*! Era para echarla del país por una vía más legal.\"\n\"Pero esa mujer... ¿no ha estado gobernando bien hasta ahora?\"\n\"¡Ese es el problema! Aceptamos darle el poder y, cuando arruinara el país, la destituiríamos con un juicio político y la echaríamos. Es decir: este plan se diseñó partiendo de la premisa de que ella, obviamente, gobernaría mal... y resulta que era todo una chapuza.\"\n\n¿Le dieron el puesto de regente para echarla? Mientras Kayoko se quedaba helada, Reuter volvió a hablar.\n\n\"Si seguimos esperando a que cometa un error, no sé cuánto tiempo más va a pasar. ...Hay que cortar la cabeza de la serpiente. Hay que matarla.\""
 HEU_event.104.a:0 "La conspiración avanza."

 HEU_event.105.t:0 "Que tus amigas ardan en el infierno"
 HEU_event.105.desc:0 "Con la disolución de GEDELIT y la dispersión de los simpatizantes nazis, la inquietud de los católicos, convertidos en la última fuerza de resistencia local de Luxemburgo, empezó a crecer cada vez más. Claro: si el 90% de los locales son católicos, ¿qué podrían hacer cuatro miembros de la Agencia de Investigación? Pero no era que no existiera nadie dispuesto a mostrar resistencia contra la Agencia.\n\n\"¡¿Q-qué... qué es esto?!\"\n\nAl abrir un paquete que había llegado a la Agencia de Investigación, Aru se puso pálida, empujó la silla y se levantó de golpe. No era la primera vez que llegaban cartas de amenaza, pero esto era distinto. Un dibujo de Kayoko, Haruka y Mutsuki atadas con cuerdas y quemándose vivas. Debajo, con pintura roja, estaba escrita la frase Alle Dämonen werden so sein (Así serán todos los demonios).\n\n\"Vaya... esto ya se pasó de la raya, ¿no?\" La expresión de Mutsuki se endureció.\n\n\"Si es una calumnia contra mí, me da igual... pero, ¡pero no puedo permitir que toquen a la gente de mi agencia!\"\n\nCuando Aru, furiosa, sacó el dibujo, apareció una invitación que estaba escondida debajo del paquete.\n\n'En la Catedral de Notre-Dame de Luxemburgo se celebrará una solemne ceremonia de exorcismo para pedir la expulsión de los demonios. Nos gustaría que usted también visitara la catedral y participara en el acto conmemorativo para rezar por que los demonios ardan-'\n\n¡Riiip! Aru rompió la invitación con brusquedad y, arrojando los trozos al aire, gritó: \"¡Una catedral que hace estas porquerías...! ¡Que se derrumbe de una vez! ...¡Que se derrumbe ya.......!\"\n\nAl principio, la rabia le subió de golpe, pero al poco tiempo le vino a la mente la imagen de los otros tres, consumiéndose entre llamas con dolor. Una imaginación que, aunque no quisiera, no podía evitar. Aru se desplomó sollozando. \"Ser hardboiled sería pasar por alto una carta así con frialdad... pero... no puedo... que todos salgan heridos por mi culpa...\"\n\nMientras la voz temblorosa de Aru se apagaba, Haruka avanzó y pisó la invitación hecha trizas."
 HEU_event.105.a:0 "\"...No pasa nada. Aunque vea cartas como esta, a mí no me afecta. Así que... Aru-sama, no llore...\""
 HEU_event.106.t:0 "Una catedral así debe desaparecer"
 HEU_event.106.desc:0 "La Catedral de Notre-Dame de Luxemburgo, que también era patrimonio cultural del país, era una hermosa catedral que llenaba de orgullo a los locales. Desde que fue construida por belgas en 1613, en ella fueron sepultados diversos grandes personajes nacionales; sus hermosos vitrales, su lujoso edificio de estilo renacentista; e incluso la orgullosa historia de haber sido designada directamente por el Papa de Roma como la catedral que representa a la Arquidiócesis de Luxemburgo. Y, para el evento de dentro de unos días —el 'solemne exorcismo público para los demonios de la Agencia de Investigación'— la catedral estaba ajetreada con los preparativos.\n\nSí. Estaba 'ajetreada'.\n\n\"Jejeje. ¿Sabías que viviste porque Aru-chan odia de verdad matar gente? ¿Lo sabías?\"\n\nMutsuki, agarrando del cabello a un obispo con brazos y piernas atados con cuerda, lo arrojó de un tirón hacia el frente de la catedral. Apenas, lo justo para que quedara peligrosamente rozando la línea que Kayoko había trazado con tiza.\n\n¡Bam! El obispo, al caer encima de otros católicos que ya habían sido arrojados antes, lanzó un grito.\n\n\"¡Vástagos de Satán, demonios de Gehenna! ¿Creéis que podéis hacer esto y seguir con vid... ¡ugh!\" Haruka golpeó la cabeza del obispo con la culata. La sangre salpicó desde su frente y manchó la escopeta de Haruka.\n\n\"Considérelo un honor: después de hacer llorar a Aru-sama, con que puedan volver con vida ya deberían estar agradecidos.\"\n\"¿Ah? ¿Por esa invitación? Comparado con lo que ustedes le han hecho a Luxemburgo, esa carta...\"\n\n¡Paf! Esta vez Mutsuki le dio una patada en la mandíbula al obispo.\n\n\"¿Eh? ¿Te crees que estamos jugando? Aru-chan lloró. Dijo que se echó a llorar a mares al ver la carta que tú enviaste.\"\n\n¡Paf! ¡Cras! Mutsuki le golpeó la mandíbula un par de veces más, y luego miró a Haruka.\n\n\"Vuela esto.\"\n\"Sí. ...Debimos haberlo hecho mucho antes.\"\n\nHaruka presionó el detonador. Y, con un estruendo, la catedral se desplomó sin fuerza, como si fuera una casa de papel."
 HEU_event.106.a:0 "Para borrar 300 años de historia, solo hicieron falta 3 segundos."

 HEU_event.107.t:0 "La regente del Gran Duque de Luxemburgo"
 HEU_event.107.desc:0 "El Gran Ducado de Luxemburgo sufrió un golpe devastador durante la Gran Transferencia, cuando la Casa Gran Ducal fue aniquilada por completo. Sin embargo, gracias a Riku Hachima Aru y a la fuerza de resistencia autoproclamada 'Agencia de Investigación 68', así como a la ayuda de algunos transferidos que la secundaron, Luxemburgo logró el milagro de conservar su independencia sin ser anexionado por Gehenna. El partido gobernante, el Partido de Derecha, nombró a Riku Hachima Aru como regente de Luxemburgo, y ahora, unos meses después de la Gran Transferencia, se celebró oficialmente su ceremonia de investidura.\n\nLuxemburgo y Bélgica habían sido los más estrechos aliados, unidos por una alianza económica. Aunque dicha alianza colapsó cuando el gobierno belga partió al exilio, entre los políticos belgas sigue estando muy extendida una visión amistosa hacia el Gran Ducado de Luxemburgo. Entonces, ¿no sería lo natural enviar un mensaje de felicitación por la entronización de la nueva regente de Luxemburgo? En realidad, no es tan natural. Aunque Riku Hachima Aru sea una kivotosiana 'favorable a la humanidad' que luchó contra la invasión de Gehenna, también hay muchos exiliados que sienten rechazo por el hecho de que sea una 'no humana' con cuernos en la cabeza.\n\nLa decisión recae en el líder del gobierno belga en el exilio: [BEL.GetLeader]. ¿Qué es más importante? ¿Que la nueva regente de Luxemburgo no sea humana? ¿O mantener la relación diplomática con el Gran Ducado de Luxemburgo, su aliado más cercano?"
 HEU_event.107.a:0 "¡Envíen la felicitación!"
 HEU_event.107.b:0 "Guardemos silencio"

 HEU_event.108.t:0 "Felicitación oficial de [BEL.GetLeader] por la investidura"
 HEU_event.108.desc:0 "< Felicitación ante el Palacio Gran Ducal por la investidura de la Regencia del Gran Ducado de Luxemburgo >\n\nA Su Alteza Riku Hachima Aru, regente del Gran Ducado de Luxemburgo:\n\nAnte todo, deseo expresarle mi gratitud por haber defendido al Gran Ducado de Luxemburgo, corazón del mundo civilizado, frente a las atrocidades de los invasores imperialistas surgidos del llamado 'Kivotos' durante la trágica Gran Transferencia de 1935. Al saber que fue Su Alteza, y no otra persona, quien ha sido nombrada regente, he sentido un profundo alivio.\n\nEn representación del Gobierno de Bélgica y de todos los súbditos belgas, le extiendo mis más sinceras felicitaciones por su nombramiento como regente, a Su Alteza, salvadora de Luxemburgo.\n\nConsidero que el gobierno de Su Alteza continúa heredando la legitimidad del anterior gobierno luxemburgués, y prometo que el Tratado de Alianza Bélgica-Luxemburgo de 1921 seguirá vigente bajo el leal gobierno de Su Alteza.\n\nComo miembros del mundo libre que ha sobrevivido tras la Gran Transferencia, Bélgica y Luxemburgo deben unir fuerzas para combatir a los opresores de Kivotos. Espero respetuosamente que Su Alteza también aúne esfuerzos para que la amistad entre este Gobierno Belga en el Exilio y el Gran Ducado de Luxemburgo pueda mantenerse.\n\nRuego por la continua salud de Su Alteza, y deseo la prosperidad de la organización de resistencia anti-Kivotos de Su Alteza, la 'Agencia de Investigación 68'.\n\nRey del Reino de Bélgica, [BEL.GetLeader]"
 HEU_event.108.a:0 "Aru colocó la carta con cariño dentro de un marco."

 HEU_event.109.t:0 "Plan de golpe de Estado"
 HEU_event.109.desc:0 "\"No puede ser... ¿Me confiaron la regencia *porque creían en mí*... y no era eso?\"\n\nAru quería negar las palabras de Kayoko. Hasta ahora había podido cumplir con sus deberes como regente porque creía que había buena fe: que alguien dependía de ella y le confiaba el futuro de Luxemburgo. Quería convertir esta tierra en un lugar donde los transferidos de Kivotos y los locales pudieran convivir en paz. Pero... ¿y si el Partido de Derecha, al que ella consideraba su socio desde el principio, *no tenía* buena fe?\n\n¿Y si confiar en los locales fue su error? ¿Y si, desde el inicio, ellos solo vieron a los transferidos como plagas, sin la más mínima intención de convivir? La bondad de Aru quería rechazar esa idea. Pero las protestas en las calles, las condenas católicas, los abusos de las organizaciones civiles fascistas... En todo aquel caos que estalló justo tras su nombramiento como regente, el Partido de Derecha no la ayudó ni una sola vez.\n\n\"...Si ese plan de golpe que dices es real.\"\n\nAru apretó los dientes."
 HEU_event.109.a:0 "\"Te lo haré pagar. Cien veces.\""

 HEU_event.110.t:0 "Contra-golpe"
 HEU_event.110.desc:0 "Émile Reuter pensaba que su plan de golpe de Estado era perfecto. Armar a un ejército revolucionario reclutado tras ganarse a una parte de los robustos obreros siderúrgicos de Luxemburgo, linchar a Aru en plena noche cuando regresara tras trabajar en el Palacio Gran Ducal, y, después de asesinarla, echarle la culpa del atentado a otra facción conveniente; para, en nombre de la estabilidad nacional, formar un nuevo gobierno del Partido de Derecha excluyendo a la Agencia de Investigación 68. Si el plan hubiera salido como estaba previsto, el Partido de Derecha debería haber recuperado Luxemburgo.\n\n\"Pero... ¿por qué demonios terminó así...?\"\n\nSede del Partido de Derecha. La Agencia de Investigación 68, en apenas tres minutos, redujo por completo a las fuerzas de seguridad y ocupó el edificio a la perfección. Reuter, mirando con una expresión vacía los ojos de la forajida Aru que le apuntaba con el cañón a la mandíbula, sintió cómo el sudor le empapaba la espalda.\n\n\"Tu plan barato de asesinato ya fue descubierto.\"\n\"...Increíble. Que una mujer tan patética...\"\n\"Nunca perdono a quien me traiciona.\"\n\nHaruka alzó la escopeta. \"E-entonces, Aru-sama... ¿matamos a toda esta basura?\"\n\"¡No! ¡No dije que los mataras! ¡Alto!\"\n\nLa que parecía una hardboiled despiadada mostró, por un instante, una expresión de pánico. Aru se recompuso al momento y presionó el cañón contra el pecho de Reuter, hundiéndolo con fuerza."
 HEU_event.110.a:0 "\"Los expulsaré a todos de Luxemburgo. A partir de ahora, el Partido de Derecha queda disuelto.\""

 HEU_event.111.t:0 "La forma de sobrevivir del primer ministro Bech"
 HEU_event.111.desc:0 "Es imposible que el primer ministro Bech no supiera del golpe de Reuter. No: quien le proporcionó a Reuter el plan de asesinato en primer lugar fue el propio Bech. ¿Cómo iba a pensar sinceramente en entregar para siempre el poder de Luxemburgo a una mujer con cuernos en la cabeza? Pero el golpe fracasó. La sede del Partido de Derecha fue ocupada por Aru, y el grupo de Reuter quedó sometido. Ahora lo importante era proteger la seguridad del propio Bech.\n\n\"Quise salvar a Luxemburgo de los transferidos... y ahora no tengo cara para ver a los señores de la Casa Gran Ducal.\"\n\nBech habló como lamentándose, y se preparó para recibir al grupo de Aru cuando llegara a la residencia del primer ministro. Todos los golpes fueron obra exclusiva de Reuter. Bech no sabía absolutamente nada. Tenía que insistir en eso, pasara lo que pasara, si quería tener alguna posibilidad de sobrevivir."
 HEU_event.111.a:0 "El Partido de Derecha se hundió... pero yo sobreviví."

 HEU_event.112.t:0 "La Revolución del 68 del rikuhachimaismo"
 HEU_event.112.desc:0 "Aru se quedó junto a la ventana del Palacio Gran Ducal, contemplando las calles de Luxemburgo. Debería haber sido una tarde tranquila, pero incluso desde el palacio se veían, de inmediato, letreros en alemán colgados en edificios comerciales: 'Prohibida la entrada a perros y kivotosianos'. Hubo un tiempo en que Aru confió en los locales. Creyó que si comprendía su forma de vida y se esforzaba por ser aceptada, los locales recibirían a los de Kivotos como parte de la misma familia. Pero ahora Aru ya no confía en los locales.\n\n\"La cultura de este mundo... es demasiado horrible comparada con la de Kivotos.\"\n\nSi existiera superioridad e inferioridad cultural, y si la cultura de Kivotos fuera abrumadoramente superior a la cultura local... ¿de verdad sería necesario esforzarse en asimilarse a la cultura local para impedir la discriminación contra los kivotosianos? No: ¿acaso no sería mejor 'kivotosizar' la cultura local, al revés?\n\nSe hacía llamar forajida, una hardboiled despiadada, pero desde la Gran Transferencia Aru no eligió ni un solo día un camino donde abandonara a los kivotosianos que cruzaron con ella para buscar su propia felicidad. En cualquier caso, ya que se convirtió en regente, quería construir un Luxemburgo donde todos fueran felices. ...Ese deseo no cambió, ni siquiera ahora, herida por los locales, ridiculizada, y de rodillas.\n\nPero había algo que sí cambió: Aru comprendió que hacer desaparecer eso que los humanos llaman 'cultura local' era el camino para convertir Luxemburgo en un paraíso donde los kivotosianos y los locales pudieran vivir como iguales."
 HEU_event.112.a:0 "\"...Ese es mi camino como forajida: el 'rikuhachimaismo'.\""

 HEU_event.113.t:0 "El paraíso rikuhachimista"
 HEU_event.113.desc:0 "Construiré un paraíso de igualdad para todos los kivotosianos. Una vez que el sueño de Aru se consolidó en una ideología llamada rikuhachimaismo, empezó a aumentar la inmigración hacia Luxemburgo desde los países vecinos. Estudiantes de Trinity y Gehenna que se marcharon incapaces de soportar los choques con los locales alemanes; estudiantes de Millennium que llegaron intrigadas por la nueva ideología; e incluso ciudadanos bestiales que no pertenecían a ninguna academia. La población de Luxemburgo empezó a crecer gracias a los inmigrantes, pero no todo eran buenas noticias.\n\nEntre los locales que se oponen al rikuhachimaismo y los inmigrantes, los estallidos de violencia continúan ocurriendo. Los inmigrantes de Gehenna, que no siguen en absoluto el control del gobierno, provocan alborotos grandes y pequeños por doquier. Y, según los rumores, también se decía que una organización criminal del mercado negro se había infiltrado en Luxemburgo, atraída por los intereses. El sueño de crear un paraíso en la realidad no es algo que siempre salga bien."
 HEU_event.113.a:0 "El paraíso no puede probarse."

 HEU_event.114.t:0 "La Familia Arancino"
 HEU_event.114.desc:0 "\"Entonces... es verdad que la Familia Arancino se infiltró en Luxemburgo.\"\n\nAru soltó un suspiro. Una carta que llegó a la Agencia de Investigación 68. Miembros de la Familia Arancino habían establecido una base en Luxemburgo. Pero la familia afirmaba que no tenía intención de enfrentarse directamente al gobierno luxemburgués —la Agencia de Investigación—. Decían que, con tal de que se les cediera una parte de los derechos de propiedad de las minas de hierro de Luxemburgo, no cometerían ningún crimen; e incluso prometían entregar al gobierno una parte de los beneficios del hierro.\n\n\"¿Qué piensan todos? De esta propuesta.\"\n\nMutsuki sonrió. \"¿No suena divertido? Ser equipo con la mafia también se ve bastante hardboiled.\"\n\nKayoko dijo: \"Confiar en la 'promesa' de la mafia ya está mal desde el principio. Ignóralos.\"\n\nY por último, Haruka. \"Q-que Aru-sama me pida mi opinión a alguien como yo... mi opinión no ayudará en nada... n-no... ¡no poder aportar ni una sola opinión por Aru-sama...! Qué empleada inútil... ............me voy a morir.\"\n\n\"¡No, no te mueras! ¡Baja el arma, la punta del cañón abajo!\"\n\nAru le arrebató a toda prisa la escopeta a Haruka. \"En fin, ya escuché a todos. Tomaré la decisión final.\""
 HEU_event.114.a:0 "Si me beneficia, cooperaré incluso con la mafia. Ese es mi hardboiled."
 HEU_event.114.b:0 "Antes que creerle a la mafia, prefiero creerle a los nazis. Quema la carta."

 HEU_event.115.t:0 "Antes que creerle a la mafia..."
 HEU_event.115.desc:0 "\"Es cierto que han estado pagando bien su parte de las ganancias, pero...\"\n\nAru leyó la denuncia que llegó a la oficina. Jornadas continuas de 18 horas al día. Los mafiosos, formados por infantería con Halo, amenazaban a los mineros —de capacidades físicas inferiores a las suyas— y los utilizaban como esclavos de facto. Incluso había informes de que secuestraban a niños de la zona y los empujaban hacia el interior de la mina. Sin duda, la Familia Arancino, tal como prometió, había estado entregándole a Aru una parte de los ingresos por la venta del mineral extraído. Pero...\n\n\"...Nunca imaginé que ganarían dinero de esta manera.\"\n\nRiku Hachima Aru no era alguien que pudiera alegrarse de recibir un dinero así. Por más que se hubiera desilusionado con los locales y se hubiera acostumbrado a su odio, los locales, al igual que Aru, eran personas con emociones: reían y lloraban. Aru dejó la denuncia sobre el escritorio.\n\n\"Todos, prepárense para salir. ...Iré a la mina y comprobaré la situación con mis propios ojos.\"\n\nKayoko preguntó: \"Si lo que dice la denuncia es cierto... ¿qué vas a hacer?\""
 HEU_event.115.a:0 "Pues destruirlos a todos ahora mismo."
 HEU_event.116.t:0 "Antes que creerle a la mafia..."
 HEU_event.116.desc:0 "Después de que la Agencia de Investigación 68 se negara a ceder la propiedad de la mina, Aru creyó que la Familia Arancino abandonaría Luxemburgo. ¿Qué podrían vender unos mafiosos para hacer dinero en un país tan pequeño? Pero se demostró que ese pensamiento de Aru había sido ingenuo. La Familia Arancino estaba traficando armas a los remanentes nazis que Aru ya había disuelto una vez.\n\n\"¡¿Guerrillas nazis?! ¡¿Q-qué demonios están haciendo en mi territorio?!\" Aru, desconcertada, se levantó de un salto.\n\nMutsuki miró a Aru, que estaba pálida, y soltó una risita. \"Aaaah. ¿La Familia Arancino está haciendo el mal diario que Aru-chan no puede hacer, eh? ¿No te entra espíritu competitivo?\"\n\"¡¿Esto no es para ponerse competitiva?! ¡Los voy a destrozar ya mismo! ¡A los nazis y a esa Familia Arancino!\""
 HEU_event.116.a:0 "¡Agencia de Investigación 68, todos en marcha!"

 HEU_event.117.t:0 "Debilitamiento de las fuerzas fascistas"
 HEU_event.117.desc:0 "Tras decidirse la represión de las organizaciones fascistas por orden de Riku Hachima Aru, las fuerzas bajo su mando comenzaron a incautar activos de múltiples grupos fascistas dentro de Luxemburgo. GEDELIT (Asociación Alemana de Literatura y Artes), la organización fascista más grande e influyente de Luxemburgo, fue señalada como objetivo de disolución. Dado que en GEDELIT también figuraban personas como Pierre Prüm —ex primer ministro luxemburgués y conocido simpatizante nazi—, se esperaba que hubiera un gran choque físico.\n\nSin embargo, aparte del incidente en el que Prüm agredió a puñetazos a una estudiante de Gehenna y terminó siendo golpeado, no se produjeron grandes enfrentamientos físicos, debido a la decisión de Damian Kratzenberg de ordenar: \"Dejen de resistirse con violencia y, por ahora, disuélvanse\". Kratzenberg había perdido a su esposa durante la Gran Transferencia, cayó en un profundo desaliento y, en vez de enfrentarse de inmediato al nuevo gobierno de Luxemburgo, optó por retirarse.\n\n\"...Claro. Ese tal Kratzenberg no se va a retirar tan fácilmente.\"\n\nAru suspiró mientras leía el informe que anunciaba la disolución de GEDELIT. En los últimos meses, Aru ya había vivido en carne propia lo obstinados y persistentes que eran los fascistas luxemburgueses. Kratzenberg solo había 'dado un paso atrás' para poder avanzar dos después. Algún día, volvería a encontrarse con él. Ese presentimiento inquietante no desaparecía de la cabeza de Aru."
 HEU_event.117.a:0 "Al menos hoy, ganamos nosotros"

 HEU_event.118.t:0 "Petición sobre la legalización de la unión civil - Partido Comunista de Luxemburgo"
 HEU_event.118.desc:0 "A la presidenta de la Agencia de Investigación 68, Riku Hachima Aru:\n\n¡La Agencia de Investigación 68 debe detener su plan de legislar leyes burguesas!\n\nLa homosexualidad existe, por naturaleza, solo en los Estados <burgueses> como un <producto de la decadencia moral>, tal como ha instruido el venerado camarada <Iósif Stalin>, líder del Komintern. Por ello, denunciamos: el error capitalista que pretende impulsar la actual autoproclamada <Regente del Gran Duque de Luxemburgo>, Riku Hachima Aru, empujará a la clase trabajadora luxemburguesa hacia una situación aún más dolorosa. Al introducir la decadencia moral de la cultura burguesa, la libertad de los trabajadores se verá reducida, y la implementación del sistema de <unión civil> traerá la corrupción a la sociedad.\n\nSi Riku Hachima Aru no es una espía de los Estados capitalistas, debe detener estas maniobras burguesas de sabotaje táctico y concentrarse mucho más en erigir una <libertad para la clase trabajadora>. Esta es tanto una severa advertencia de toda la clase trabajadora como un consejo dirigido a la propia Riku Hachima Aru.\n\nEnviado por: Partido Comunista de Luxemburgo"
 HEU_event.118.a:0 "La carta fue arrugada y terminó en el bote de basura."

 HEU_event.119.t:0 "Petición sobre la legalización de la unión civil - Iglesia clandestina de Luxemburgo"
 HEU_event.119.desc:0 "A la presidenta de la Agencia de Investigación 68, Riku Hachima Aru:\n\nDespués de las tropelías anticristianas de eso que llaman 'rikuhachimaismo', ahora pretenden convertir al Estado, directamente, en una madriguera de estalinismo.\n\nMiserable rojo de pelo rojo. Esperaré el día en que el Señor te arrastre al infierno. Ustedes, los comunistas, siempre han sido así: para derrumbar el orden del Señor y teñir al país de rojo, empiezan por envenenar la cultura.\n\n¡Vete con tu amado Partido Comunista de Luxemburgo!\n\nRemitente desconocido"
 HEU_event.119.a:0 "\"...No hacía falta meterse con mi pelo, ¿no?\""

 HEU_event.120.t:0 "Petición sobre la legalización de la unión civil - Sindicato Minero de Luxemburgo"
 HEU_event.120.desc:0 "A la Regente del Gran Duque de Luxemburgo, Riku Hachima Aru:\n\nDeclaramos una huelga general hasta que el país sea normalizado.\n\nEso es todo."
 HEU_event.120.a:0 "\"...Corto y conciso.\""

 HEU_event.121.t:0 "Petición sobre la legalización de la unión civil - Gendarmería de Luxemburgo"
 HEU_event.121.desc:0 "Al Palacio Gran Ducal de Luxemburgo:\n\nSu Alteza Regente. El descontento dentro de la gendarmería ha llegado a un punto extremo. Pese a las políticas antirreligiosas de Su Alteza, la gendarmería es el grupo más conservador, y todavía muchos soldados mantienen la fe católica. Algunos efectivos han resuelto 'huelga general' y han salido de sus guarniciones sin regresar.\n\nYa se ha emitido la advertencia de que un soldado luxemburgués no tiene derecho a huelga y que este acto se considerará simplemente deserción, pero temo que no vayan a volver.\n\nComprendo sus motivaciones, pues he convivido con ellos durante muchos años; sin embargo, el deber de un soldado es ser leal a la Casa Gran Ducal, fundamento de la nación. Ahora que la antigua Casa Gran Ducal ha fallecido por completo, lo natural es jurar lealtad a Su Alteza Riku Hachima Aru. Esto trasciende si yo apruebo o desapruebo las políticas de Su Alteza. Todo soldado tiene la obligación de obedecer la elección de Su Alteza por encima de sus propias ideas, y desertar en oposición a Su Alteza constituye traición.\n\nSu Alteza Regente. Por eso, debe enviar órdenes de retorno a filas, en nombre de Su Alteza, a todo Luxemburgo. Los soldados que no acaten la orden deben ser considerados insurgentes, despojados de su condición militar, arrestados y enviados a juicio. Que si se casan mujeres con mujeres o hombres con hombres es un asunto menor comparado con la traición de quebrantar la lealtad a un monarca digno. Los soldados que ponen otros valores por encima de la lealtad no merecen vestir el uniforme. Confío en que Su Alteza entenderá este punto y quedo a la espera de su respuesta.\n\nComandante de la Gendarmería del Gran Ducado de Luxemburgo, Émile Schëppler"
 HEU_event.121.a:0 "Habrá que preparar la orden donde la deserción se considera traición."
 HEU_event.121.b:0 "A los desertores hay que arrestarlos. Pero, ¿no es demasiado llevarlos a juicio por 'traición' y todo eso?"

 HEU_event.122.t:0 "Carta anónima"
 HEU_event.122.desc:0 "A la presidenta de la Agencia de Investigación 68, Riku Hachima Aru:\n\nDesde que entré a Gehenna, me gustó alguien. Y desde entonces hemos estado viviendo juntas.\n\nNo puedo escribir mucho, pero... solo quería decirlo.\n\nGracias, jefa."
 HEU_event.122.a:0 "\"...No tienes que agradecerme.\""

 HEU_event.123.t:0 "Entrada de la Agencia de Investigación, una carta pegada con cinta"
 HEU_event.123.desc:0 "Para Aru-chan\n\nNo creo que lo que elijas esté mal, elijas lo que elijas.\n\nNo pienses que todos son enemigos. ¡Siempre habrá gente de tu lado!\n\n— El misterioso genio gamer"
 HEU_event.123.a:0 "Aru sonrió mientras despegaba la cinta."

 HEU_event.124.t:0 "Solicitud de [HEU.GetName] para compartir tecnología aérea"
 HEU_event.124.desc:0 "En la carta manuscrita, escrita con una caligrafía sumamente formal, la Agencia de Investigación 68 incluyó frases de cortesía sobre la amistad y la relación de alianza entre el Gran Ducado de Luxemburgo y la Academia Gehenna, y a la vez solicitó que, para fortalecer a las fuerzas luxemburguesas, se compartiera con la Agencia de Investigación 68 una parte de la tecnología aérea que posee el lado de Manmajeon. Dado que proporcionar una parte de esa tecnología no parece que vaya a causar un gran perjuicio a nuestro ejército, compartirles parte de la tecnología aérea también podría ser una buena idea."
 HEU_event.124.a:0 "Compartamos la tecnología con ellos."
 HEU_event.124.b:0 "¿Luxemburgo necesita fuerza aérea? ¡Eso sí que es comedia!"

 HEU_event.125.t:0 "Solicitud de [HEU.GetName] para compartir tecnología naval"
 HEU_event.125.desc:0 "En la carta manuscrita, escrita con una caligrafía sumamente formal, la Agencia de Investigación 68 incluyó frases de cortesía sobre la amistad y la relación de alianza entre el Gran Ducado de Luxemburgo y la Academia Gehenna, y a la vez solicitó que, para fortalecer a las fuerzas luxemburguesas, se compartiera con la Agencia de Investigación 68 una parte de la tecnología naval que posee el lado de Manmajeon. Dado que proporcionar una parte de esa tecnología no parece que vaya a causar un gran perjuicio a nuestro ejército, compartirles parte de la tecnología naval también podría ser una buena idea."
 HEU_event.125.a:0 "Compartamos la tecnología con ellos."
 HEU_event.125.b:0 "Antes que recibir ayuda de la armada luxemburguesa, mejor me ayuda un bote de pesca del barrio."

 HEU_event.126.t:0 "Rechazo de [FROM.GetName] a la solicitud de compartir tecnología"
 HEU_event.126.desc:0 "Aunque la Agencia de Investigación 68 solicitó con un tono bastante cortés compartir tecnología a Manmajeon, parece que [FROM.GetLeader] no tiene intención alguna de compartir con nosotros su tecnología militar. Han decidido rechazar nuestra petición, y lo explicaron en una breve carta, señalando lo peligroso que es para la seguridad nacional que se filtren 'tecnologías militares'. Aunque seamos aliados, parece que tendremos que desarrollar las nuevas tecnologías por nuestra cuenta."
 HEU_event.126.a:0 "Al final, ese es el nivel real de nuestra alianza."

 HEU_event.127.t:0 "[FROM.GetName] comparte tecnología aérea"
 HEU_event.127.desc:0 "Pese a las burlas escépticas de que Luxemburgo no necesitaría fuerza aérea, [FROM.GetLeader] decidió entregarnos parte de la tecnología aérea que poseen. Por supuesto, esto solo es apoyo técnico; la tarea de formar una fuerza aérea sigue recayendo en nosotros. Pero es innegable que se ha establecido la base para que una fuerza aérea con el emblema de la Agencia de Investigación 68 pueda alzar vuelo. Agradezcamos su apoyo: es hora de seleccionar nuevos pilotos."
 HEU_event.127.a:0 "¡Qué noticia tan genial!"

 HEU_event.128.t:0 "[FROM.GetName] comparte tecnología naval"
 HEU_event.128.desc:0 "Después de asegurar territorios marítimos, solicitamos a [FROM.GetName] que compartiera tecnología para la formación de una armada. Había quienes veían con escepticismo que esta petición fuera aceptada, pero [FROM.GetLeader] nos proporcionó los materiales necesarios para construir nuevos buques de guerra. Por supuesto, construir los barcos seguirá siendo tarea nuestra, pero parece que no está tan lejos el día en que buques con el emblema de la Agencia de Investigación 68 naveguen por las costas europeas."
 HEU_event.128.a:0 "¡Hasta los buques necesitan hardboiled!"

 HEU_event.129.t:0 "Propuesta de exilio de [FROM.GetName]"
 HEU_event.129.desc:0 "Estamos perdiendo la guerra y nos enfrentamos a la amenaza de la aniquilación. Aunque aún existe una posibilidad de revertir la situación, [FROM.GetLeader] nos ha propuesto exiliarnos en Luxemburgo. Si transferimos a ellos el control del ejército de Manmajeon y vivimos en el exilio, afirman que darán vuelta a la guerra. Esta opción compraría tiempo para que el alto mando de Manmajeon huya a un lugar 'seguro', por lo que [ROOT.GetLeader] ve la propuesta con buenos ojos; sin embargo, también tiene sentido la postura de que, en lugar de exiliarnos, debemos permanecer en nuestra tierra y resistir hasta el final.\n\nElijas lo que elijas, esta será una decisión única e irreversible, que retorcerá no solo el futuro de Manmajeon, sino también el de toda Europa."
 HEU_event.129.a:0 "¡Huyamos a Luxemburgo!"
 HEU_event.129.b:0 "Aunque muera, moriré en esta tierra"

 HEU_event.130.t:0 "Expansión de la 'Revolución del 68' del rikuhachimaismo"
 HEU_event.130.desc:0 "\"¡Prohibido prohibir! ¡Denos más libertad!\"\n\nLa llamada 'Revolución del 68', o 'rikuhachimaismo', un movimiento liberal de nueva izquierda nacido en Luxemburgo, se ha extendido incluso dentro de [ROOT.GetName]. Debido a la relación de alianza entre nosotros y Luxemburgo, parece que muchos estudiantes de Gehenna han sido influenciados por la Revolución del 68 luxemburguesa. La Revolución del 68, cuyo nombre proviene de la organización de Riku Hachima Aru, la 'Agencia de Investigación 68', sostiene que debe eliminarse la cultura local 'atrasada' y que la cultura 'avanzada' y liberal de Kivotos debe difundirse por esta tierra. Su lógica afirma que, si la cultura de Kivotos —más libre que la de la Tierra— echa raíces aquí, llegará la libertad de las mujeres, la libertad de diversas minorías como las personas con discapacidad, y la paz entre la humanidad y los transferidos de Kivotos.\n\nPodríamos permitir que la Revolución del 68 influya en las estudiantes de nuestro territorio. Total, Gehenna ya es un lugar suficientemente libre comparado con otras academias, incluso sin que un forastero grite 'libertad'. Además, la difusión de una cultura liberal podría dar nuevas inspiraciones a nuestras estudiantes. Sin embargo, también existe el riesgo de que el rikuhachimaismo, al ver la cultura local como algo bárbaro que debe ser eliminado, provoque el descontento de los locales."
 HEU_event.130.a:0 "¡Prohibido prohibir!"
 HEU_event.130.b:0 "Esto es una ideología demasiado peligrosa"
 HEU_event.131.t:0 "Unión civil en Luxemburgo"
 HEU_event.131.desc:0 "A pesar de la oposición de innumerables fuerzas políticas y la división social.... pasaron muchas cosas, pero al final logramos impulsar la legalización de la unión civil. Los luxemburgueses no olvidarán este hecho, sin duda; aun así, esto es un gran avance cultural. Una sociedad donde opiniones más diversas puedan debatirse libremente entre los ciudadanos, una sociedad que reemplazó la atrasada cultura humana por una cultura desarrollada un siglo después, y una sociedad que prohíbe prohibir.\n\nEsta es una nueva victoria de la revolución."
 HEU_event.131.a:0 "Hubo dificultades, pero..."

 HEU_event.132.t:0 "La preocupación de la jefa"
 HEU_event.132.desc:0 "Tras la Gran Transferencia, cuando las estudiantes de Gehenna redujeron a cenizas la antigua oficina de Benriya 68, la nueva oficina de Benriya 68 pasó a ser el Palacio Gran Ducal de Luxemburgo. Como además tenía el cargo de regente de la Casa Gran Ducal, también podía aprovecharse legalmente; y, de hecho, era varias veces más grande y lujoso que la oficina original de Benriya. Hasta el punto de que el lema colgado en la pared, «Un día, un mal», se veía fuera de lugar.\n\nPero incluso después de conseguir el palacio, Aru seguía viviendo en un pequeño departamento de una sola habitación cercano, y cada día iba y venía del palacio. Claro que el palacio tenía un dormitorio que no podía compararse con aquel departamento rancio. Pero ese lugar también era el sitio donde, durante la Gran Transferencia, la Gran Duquesa Charlotte, su consorte Félix y los hijos de dos casas ducales fueron fusilados por saqueadores de Gehenna. Si ella misma también era de Kivotos… ¿de verdad tenía *derecho* a usar la casa de esas personas?\n\nTras la Gran Transferencia, durante más de un mes, todo tipo de especialistas en limpieza de Luxemburgo frotaron la sangre y arreglaron el dormitorio. Aun así, cada vez que Aru entraba en el dormitorio del palacio, todavía podía oler la sangre de los niños. Más que aquella cama gigantesca en ese dormitorio de estilo antiguo, Aru prefería dormir encogida en el sofá del departamento de una sola habitación.\n\n\"Uf... No sé ni cómo terminé metida en algo como la política.\"\n\nDespués de terminar su trabajo, Aru salió del palacio como siempre y caminó sola de regreso a su departamento. El resto del personal de Benriya ya se había ido hacía más de una hora. Bueno, la jefa siempre es la última en quedarse. Aru caminó por la noche sintiendo el viento frío. Como todos los días, alzó la vista y contó las estrellas. El cielo nocturno europeo, completamente distinto al de Kivotos, era un paisaje perfecto para captar su atención… tanto que ni siquiera se dio cuenta de que la venían siguiendo."
 HEU_event.132.a:0 "¿Por qué el cielo de la Tierra no tiene un anillo como el de Kivotos?"

 HEU_event.133.t:0 "El anillo"
 HEU_event.133.desc.a:0 "Antes que nada, déjame preguntarte esto. ¿Por qué yo? Si el jefe llegara a enamorarse de alguien de Benriya, pensé que sería Haruka.\n\n...No lo sé. Simplemente… de algún modo, terminó pasando.\n\n¿Ni tú mismo lo sabes?\n\nAjajá… supongo. Pero de algo sí estoy seguro: ahora mismo amo a Kayoko. Puedo sentirlo con claridad. Por eso… aunque pensé que quizá me odiarías, igual quería confesártelo. Quería… transmitirte mis sentimientos, Kayoko.\n\nUn anillo, huh… Jefe, si de verdad yo aceptara esto… ¿cómo piensas explicar nuestra relación a las demás de Benriya?\n\nN-no lo pensé… lo de las otras. Eh… supongo que, de algún modo, todas lo entenderán… ¿no? Tal vez…\n\nJeje. Con esa pinta de decidido y firme, pero con un tornillo suelto… ese es el jefe de siempre.\n\n¡Oye, no te rías! Yo sí estoy hablando en serio… me lo pensé durante muchísimo tiempo, muchísimo, para poder decírtelo…\n\nLo aceptaré.\n\n¿Eh?\n\nJefe… no, Aru. Gracias por el anillo."
 HEU_event.133.desc.b:0 "Hmm… Aru-chan. Esto no será… algún tipo de juego nuevo… ¿verdad?\n\nAunque me autoproclame forajida, no juego con el corazón de la gente.\n\n¿Así que hasta tú te das cuenta de que es “autoproclamado”, Aru-chan?\n\n¡E-eso no es lo importante!\n\nAru-chan se puso roja. ¡Ajajá!\n\n¡No arruines el ambiente! Yo… a mi manera, me lo pensé en serio y por eso vine… E-entonces, Mutsuki. Si vas a aceptar mi confesión, el anillo…\n\nLo aceptaré.\n\n¿D-de verdad? ¿Estás bien con que sea yo?\n\n¿Qué pasa, Aru-chan? Si ya te confesaste, ¿por qué te pones nerviosa ahora?\n\nNo… es que no pensé que lo aceptarías tan fácil…\n\nEs que tú siempre estás al filo, Aru-chan. Sentí que tenía que quedarme a tu lado muuuucho más tiempo, o si no…"
 HEU_event.133.desc.c:0 "Me voy a morir.\n\n¡No no no no no! ¡Haruka, ¿por qué de repente?!\n\nE-es que Aru-sama no se lo dio a nadie más sino a mí, e-ese anillo, y me confesó, y yo… quizá en realidad quiso decir indirectamente que ya no me necesita en Benriya y que me vaya, porque yo no tengo derecho a recibir el amor de Aru-sama y tampoco pensé que Aru-sama pudiera amarme así que esto debe ser algún tipo de prueba y por el bien de Aru-sama yo debería desaparecer en silencio y—\n\nBasta.\n\n¿Aru… sama?\n\nHaruka, no voy a decirte “por favor acepta mi amor”. Puedes rechazarme, está bien. Pero al menos quiero que Haruka se quiera más a sí misma. No quiero que te vayas… y tampoco quiero que digas cosas como morir frente a mí… De verdad… me gustas. Me gustas, Haruka. Y es que… desde la Gran Transferencia ha muerto y desaparecido demasiada gente… por eso… más todavía… hng… ¡snif! yo…\n\nAru-sama… yo… sí… No llore, por favor. No voy a desaparecer de su lado, ni voy a morir ni nada… ¿Puedo… probarme el anillo?"
 HEU_event.133.a:0 "Un juramento eterno"

 HEU_event.134.t:0 "Informe – Plan de operación “Exorcismo”"
 HEU_event.134.desc:0 "A la sede del Partido de Derecha, al presidente del Parlamento, Sr. Émile Reuter\n\n£white_dot Informe de seguimiento\n\nRikuhachima Aru, tal como en el informe anterior, sale del Palacio Gran Ducal todos los días a la misma hora avanzada de la noche. No hay miembros del llamado “Benriya 68” que la acompañen por las calles nocturnas. Parece confiar bastante en la seguridad pública de la ciudad de Luxemburgo.\n\n£white_dot Informe de captación de colaboradores para el asesinato\n\nHemos captado a cinco militantes fascistas. Son unos idiotas que alaban a Hitler, pero al menos son patrióticos. Si llegan a ser arrestados, podremos cargarles la responsabilidad en nuestro lugar.\n\nLogramos conseguir una pistola de la Resistencia francesa. Sin embargo, el sonido es demasiado fuerte y existe riesgo de atraer a la gente de alrededor; considerando las capacidades físicas de los kivotosianos, parece que solo debe usarse como último recurso.\n\nLogramos contactar a un exoficial del antiguo ejército. Él aconsejó que, considerando la resistencia corporal de los kivotosianos, en vez de armas blancas como hachas, sería más efectivo golpear la cabeza de forma concentrada con herramientas como un martillo o una llave inglesa para aumentar la probabilidad de matar a un kivotosiano.\n\n£white_dot Informe del plan de asesinato\n\nTodos los preparativos están listos. En cuanto usted lo ordene, señor presidente, podremos devolver a esa demonio pelirroja con cuernos al infierno, al lugar donde pertenece."
 HEU_event.134.a:0 "Enviar a un patriota anónimo."

 HEU_event.135.t:0 "La noche más larga"
 HEU_event.135.desc:0 "Cada día que pasa, el movimiento nazi y el movimiento católico antikivotos en Luxemburgo se intensifican. Y, en respuesta, los “transferidos” de Kivotos en Luxemburgo empiezan a armarse. Aru salió del Palacio Gran Ducal presionándose las sienes palpitantes.\n\n\"¿Qué demonios tengo que hacer para mediar entre los dos bandos…?\"\n\n¿Mediar? Cuando era la jefa de Benriya 68 en Kivotos, jamás tuvo que preocuparse por algo así. Una vida hardboiled de romper cosas y disparar por todos lados. Pero Luxemburgo era distinto. Para proteger lo valioso aquí, hacía falta un ramo de amistad en lugar de un arma—\n\n¡PAM!\n\n\"¡Agh!\"\n\nEl ataque llegó sin aviso. Un golpe sordo en la nuca. Al mismo tiempo, hombres con la boca y la nariz cubiertas por tela negra blandieron llaves inglesas y martillos desde todos lados. Un ataque brutal apuntando a la cabeza. Por el mareo de la conmoción, Aru sintió que el mundo giraba. “¿Eh…?” Aru cayó al suelo de cabeza.\n\n\"¡La perra demonio no era la gran cosa!\"\n\"¡Pégale más! Dicen que los cabrones con halo no mueren con esto.\"\n\n¿Qué está pasando? ¿Quién… y por qué…? Mientras la pateaban en el cuello y la cabeza, Aru alzó la vista como pudo. Eran cinco. ¿Motivo? No lo sabía. ¿Quién los envió? No lo sabía.\n\n\"U-ustedes… ¿qué…?\"\n\nSu voz fue cortada por una bota gruesa pateándole la boca. Su conciencia se volvió borrosa. Con el cuello pisoteado una y otra vez, ni siquiera podía respirar bien. ¿Se le habrá paralizado el cuerpo? Sus dedos temblaron. Duele. Duele. Duele. Duele duele duele\n\n\"¿Y ahora qué hacemos?\"\n\"Esto es un robo con homicidio. Una desgracia que puede pasar en cualquier parte.\"\n\nEl hombre que habló con tono burlón se arrodilló frente a Aru. Metió la mano dentro del abrigo destrozado de Aru.\n\n\"Nomás le quitamos la cartera. Si la dejamos, igual parece que se va a morir.\"\n\nCartera. Al oír esa palabra, la conciencia de Aru, que estaba a punto de romperse, se aclaró. El tesoro que sus compañeros de Benriya habían comprado reuniendo su escaso dinero. Con sus últimas fuerzas, Aru agarró la muñeca del hombre que metía la mano en su abrigo."
 HEU_event.135.a:0 "\"¡La cartera… no!\""

 HEU_event.136.t:0 "No me gustan las películas con final malo"
 HEU_event.136.desc:0 "Que Haruka consiguiera un cuarto no muy lejos de la casa de Aru no fue exactamente casualidad. Era porque le preocupaba si Aru, que siempre salía tarde del trabajo, lograba llegar bien a casa. Y, siendo honesta, también tenía el deseo de vivir cerca de Aru. Por eso…\n\n¡Bang! ¡Bang!\n\nEn el momento en que resonaron disparos no muy lejos, entre el Palacio Gran Ducal y la casa de Aru, Haruka sintió un escalofrío recorriéndole la espalda. Tras el caos de la Gran Transferencia, ya no había habido disparos en la Luxemburgo nocturna. ¿Entonces por qué?\n\nSu cuerpo se movió más rápido de lo que pensaba. Tomó la escopeta Blown Away y salió corriendo a la calle; no pasó mucho tiempo antes de que viera a un hombre rodando por el suelo con la muñeca doblada en un ángulo imposible, y a otros hombres disparando a quemarropa con una pistola contra el rostro de Aru, que estaba caída.\n\n\"¡H-hijos de perra!\"\n\nDe la boca de Haruka —para quien el insulto más fuerte que había dicho en su vida era “bicho miserable”— brotó una maldición que parecía desgarrarle la garganta. En el instante en que los hombres giraron la cabeza sorprendidos, el primer disparo de perdigones le voló la cabeza al que sostenía la pistola. ¡BANG! La emoción de Haruka explotó junto con los perdigones. Gritando con un sonido que no era ni chillido ni alarido, corrió hacia Aru.\n\n\"¡Mierda, corre!\"\n\"¡Agh, aaagh!\"\n\nMientras los otros cuatro se dispersaban en distintas direcciones, Haruka, empapada en la sangre del hombre, abrazó a Aru, encogida en el suelo como un papel arrugado.\n\n\"¡Aru-sama! Por favor… por favor…\""
 HEU_event.136.a:0 "\"Haruka… decir groserías es malo.\""

 HEU_event.137.t:0 "Certificado del médico responsable"
 HEU_event.137.desc:0 "Nombre del paciente: Rikuhachima Aru | Fecha de nacimiento: 0000.03.12.\nAutor: Charles Marx | Fecha: [GetDateText]\n\nCircunstancias del incidente (según declaración del tutor): la paciente se quejó de dolor y pérdida de visión por impactos externos causados por objetos contundentes y balas; con ayuda de su tutor visitó hospitales cercanos, pero fue rechazada por hospitales católicos. El tutor buscó por altavoz a un médico que pudiera atenderla, y yo, ex cirujano, realicé medidas de emergencia en el Palacio Gran Ducal.\n\nHallazgos:\n£white_dot Sospecha de fractura de clavícula del brazo derecho\n£white_dot Sospecha de fractura de órbita izquierda y lesión ocular. Sin respuesta visual en el ojo izquierdo.\n£white_dot Laceración del cuero cabelludo izquierdo y sospecha de fractura craneal izquierda.\n\nEvolución del tratamiento:\n£white_dot Hubo fractura en la parte superior del cráneo izquierdo, pero no progresó a hemorragia subdural traumática. No parece haber riesgo vital.\n£white_dot Se realizaron medidas de emergencia para la lesión del ojo izquierdo. Dependiendo del pronóstico, podría ser necesaria una enucleación.\n£white_dot Se realizaron medidas de emergencia para el brazo derecho.\n\nPronóstico:\n£white_dot La herida de bala en el ojo izquierdo tiene alta probabilidad de causar pérdida permanente de visión o disminución visual. Requiere seguimiento.\n£white_dot El brazo derecho no podrá utilizarse por un tiempo, pero no habrá discapacidad permanente.\n£white_dot Debido al sentimiento antikivotos en Luxemburgo, se estima que la hospitalización normal será imposible. Se solicita que el hospital militar disponga la hospitalización tomando este certificado como referencia.\n\nOtros: se solicita al primer ministro Joseph Bech consulta sobre si es posible emprender acciones legales contra hospitales que se negaron a tratar a la jefa de Estado.\n\nSe remite este dictamen.\nSede del Partido Comunista de Luxemburgo"
 HEU_event.137.a:0 "El certificado fue enviado al alto mando militar de Luxemburgo."

 HEU_event.138.t:0 "Entrevista con el médico militar"
 HEU_event.138.desc:0 "Alteza regente, ¿pudo dormir en paz? Sí. Me alegra. Hemos observado su evolución desde su ingreso hasta hoy. Primero, mire este documento.\n\nLas lesiones del brazo y la cabeza no han empeorado. Aquel médico comunista le brindó primeros auxilios adecuados. Si se hubiera dejado así, la lesión del brazo podría haberse agravado. Y lo de los cuernos en el cuello… también está bien. Si siente rigidez o molestias, puedo recetarle analgésicos aparte. Los kivotosianos parecen tener una resistencia corporal mayor que los locales, así que no debería preocuparse demasiado por el brazo.\n\nSin embargo… sí. Usted ya lo sabe. El ojo izquierdo… sí… tal como dijo. Hicimos todo lo posible, pero por ahora no hay posibilidad de que regrese la visión del ojo izquierdo. Además, si se deja el ojo roto, podría afectar también la visión del ojo derecho, así que por ahora… sí. Tendremos que… extirpar el ojo izquierdo.\n\n…Sí. Tal como pidió, no hemos contado esto a sus compañeros de Benriya 68. Sí… Buscaremos una forma de ocultar la prótesis incluso después de la cirugía. Con la tecnología de prótesis ocular de Luxemburgo sería imposible, pero quizá algún otro país de Kivotos que llegó durante la Gran Transferencia…\n\nAsí es, Alteza. Por ahora estamos considerando una colaboración con el equipo médico de Millennium. Pero todavía no hemos recibido respuesta. …Entendido. Aunque se consideren lesiones leves, la clavícula es una zona delicada. No se quite el vendaje del brazo derecho y mantenga el máximo reposo durante la hospitalización. Sí. Le informaré cuando recibamos respuesta sobre si será posible la colaboración con Millennium. Alteza regente. Gracias por su esfuerzo en la consulta. Descanse en su habitación."
 HEU_event.138.a:0 "Aru salió del consultorio y lloró en silencio."

 HEU_event.139.t:0 "Solicitud de colaboración médica del Gran Ducado de Luxemburgo"
 HEU_event.139.desc:0 "Al equipo médico de la ciudad de Verdún, Academia Millennium,\n\nHace poco, Su Alteza Rikuhachima Aru, regente de la Casa Gran Ducal del Gran Ducado de Luxemburgo y representante de la organización civil “Benriya 68”, sufrió un desafortunado ataque. Se le brindó tratamiento hospitalario en el hospital militar nacional, pero la lesión por estallido ocular no ha mejorado, por lo que debemos realizar una cirugía de extirpación del ojo izquierdo.\n\nSu Alteza desea ocultar ante sus amigas de Benriya 68 que se sometió a una enucleación. Sin embargo, con la tecnología del Gran Ducado de Luxemburgo es imposible fabricar una prótesis ocular idéntica a un ojo real. Solicitamos una colaboración con el equipo médico de Millennium, famoso por su avanzada tecnología científica, para crear una prótesis realista que se mueva exactamente siguiendo la mirada de Su Alteza.\n\nSi aceptan, el Gran Ducado de Luxemburgo no olvidará su favor y ofrecerá una compensación económica suficiente, incluyendo viáticos, costos de fabricación de la prótesis y una gratificación por las molestias. Rogamos responder al Hospital Militar de Diekirch, Luxemburgo.\n\nEnviado por el Ejército de Luxemburgo, Hospital Militar de Diekirch"
 HEU_event.139.a:0 "De paso ganamos dinero; hagamos una prótesis."
 HEU_event.139.b:0 "¿Rikuhachima Aru? Que esa forajida autoproclamada haya quedado tuerta… riámonos de ella."

 HEU_event.140.t:0 "Prótesis ocular de Millennium"
 HEU_event.140.desc:0 "\"¡Aru-chan! ¿Tu ojo ya está bien?\"\n\"Pues ya ves. Si me desmayo solo por recibir unos golpes en la noche, no soy una forajida hardboiled.\"\n\nAru sonrió mientras recibía como regalo la caja de chocolates que Mutsuki trajo de visita. ¿Chocolates como obsequio de hospital? Bueno, mejor que la comida insípida del hospital.\n\nMientras Aru estuvo fuera del palacio, el personal de Benriya 68 se turnaba para visitarla todos los días. Las que no venían se repartían el trabajo que Aru normalmente habría hecho. Era de agradecer. Aru, parpadeando con un ojo cuya mitad izquierda ya no veía, miró a Mutsuki, que no paraba de hablar con alegría sobre cosas que habían pasado entre los miembros de Benriya.\n\nEl ojo perdido no volverá. Pero era mucho mejor que enterarse de que sus compañeras —no, sus amigas— se pondrían tristes al saber que se había quedado ciega de un ojo. Además, por ahora todavía podía ver, con la mitad de visión que le quedaba, la sonrisa radiante de Mutsuki.\n\n\"¿Qué pasa? Aru-chan. ¿Por qué me miras fijo de repente?\"\n\"No… es solo que me alegra que hayas venido, Mutsuki.\"\n\"Jeje.\"\n\nMutsuki se rió bajito y acercó una silla junto a la cama. Dijera quien dijera lo que dijera, aquel día Aru fue feliz."
 HEU_event.140.a:0 "Mutsuki… ¿de verdad no se dio cuenta de que era una prótesis?"

 HEU_event.141.t:0 "Una prótesis ocular común"
 HEU_event.141.desc:0 "Quería colaborar con Millennium, pero escuchó que no salió bien. Al final, no quedó más remedio que fabricar la prótesis ocular dentro de Luxemburgo. A simple vista, sin duda parecía un ojo real, pero como no se movía siguiendo la mirada de Aru, bastaba con observar un poco para darse cuenta de que era una prótesis.\n\n\"Hng… snif. Lo siento. Lo siento. Ese día… si yo hubiera llegado un poco más rápido, más rápido…\"\n\nPor supuesto, no había forma de engañar a las amigas de Benriya 68. Aru tuvo que decirle a Haruka, que había venido a visitarla al hospital, que se había sometido a una enucleación. Aru abrazó con fuerza a Haruka, que rompió a llorar a mares como una niña que acababa de perder a su familia.\n\n\"Está bien. Todavía te tengo a ti, Haruka. Todo lo que yo no pueda ver… tú puedes ver más del mundo por mí.\"\n\nCuando levantó la cabeza, en la mitad de su campo de visión vio a Haruka, con lágrimas cayéndole a chorros.\n\n\"Sí… Aru-sama, yo… siempre, a su lado, siempre… Veré en su lugar lo que Aru-sama no pueda ver, y se lo diré. Así que… hng… snif… uaaaaah…!\""
 HEU_event.141.a:0 "Haruka siguió llorando un buen rato después de eso."

 HEU_event.142.t:0 "Crisis de guerra civil en Luxemburgo"
 HEU_event.142.desc:0 "A Su Alteza la regente Rikuhachima,\n\nCon la ayuda de Benriya 68, hemos arrestado a cuatro alborotadores que atacaron a Su Alteza. Son germanófonos de tendencia pronazi, y parece que el motivo del incidente también se basó en el racismo nazi. Afirman que solo actuaron porque recibieron dinero de otro patrocinador, pero dado que no pueden revelar la identidad de ese patrocinador, su credibilidad parece baja.\n\nTras el atentado contra Su Alteza, el conflicto étnico dentro de Luxemburgo ha llegado a un punto crítico. Los furiosos grupos afines a Gehenna y los fascistas han librado combates callejeros en la ciudad de Luxemburgo, y ya se han producido muertes de civiles. Desde la tragedia inmediatamente posterior a la Gran Transferencia, esta es la primera vez que estalla un enfrentamiento armado entre dos pueblos dentro de la ciudad de Luxemburgo. Aún el número de bajas es inferior a 10, pero si Su Alteza no interviene, se teme que aumente a dos dígitos o más.\n\nLe rogamos que emita instrucciones con prontitud. Podemos acusar a los fascistas por conspiración para asesinar a Su Alteza y por alta traición, y a cambio apaciguar a los enfurecidos kivotosianos y enviarlos de vuelta a sus hogares.\n\nO bien, nuestras fuerzas podrían atacar primero a los supervivientes nazis antes que a los alborotadores kivotosianos y abatirlos a todos; incluso así podríamos evitar un baño de sangre. Creemos que esta opción podría calmar aún más el ánimo de la población kivotosiana. De cualquier modo, esos fascistas cometieron alta traición al atentar contra Su Alteza, por lo que, aun con juicio, no podrán evitar la pena de muerte. No obstante, nos preocupa que una depuración nazi sin juicio haga que nuestro gobierno reciba críticas de otros fascistas.\n\nLa revuelta se está intensificando, así que no hay tiempo para deliberar demasiado. En cuanto Su Alteza decida, desplegaremos al ejército de inmediato.\n\nComandante de la Gendarmería, Émile Schüppler"
 HEU_event.142.a:0 "Hagámoslo por juicio. No puedo elegir matar gente tan fácilmente..."
 HEU_event.142.b:0 "...Puedes abatirlos..."

 HEU_event.143.t:0 "Necesitarás un vehículo oficial"
 HEU_event.143.desc:0 "En Kivotos, no era ilegal que las estudiantes condujeran. Había visto a gente del Departamento de Suministros de Gehenna conduciendo, y también había visto varias veces vehículos de rodaje de la Academia Kronos circulando por ahí. Pero Aru nunca había conducido. Siendo sincera, era porque no tenía dinero. Pero la situación cambió.\n\nEn cuanto Kayoko se sentó en el sofá frente a Aru, soltó sin rodeos:\n\n\"Jefa, ya tienes que comprarte un coche. No puedes seguir yendo y viniendo caminando.\"\n\"…¿De qué estás hablando de repente?\"\n\"Justo porque ibas caminando al trabajo, los terroristas pudieron intentar matarte tan fácilmente. Si hubieras estado en un auto blindado, no te habrían pegado con un martillo.\"\n\nMutsuki también se dejó caer junto a Kayoko.\n\n\"En esto yo también voto por Kayokocchi. …Aru-chan, si es porque no sabes manejar, contrata un chofer o algo. Ahora sí tenemos dinero para eso, ¿no? Al final, toda la plata del país es de Aru-chan.\"\n\nLas dos coincidían. Un coche oficial… No estaba acostumbrada a conducir, pero a estas alturas parecía que no le quedaba otra.\n\nKayoko dijo: \"Además, como los ciudadanos de Luxemburgo también tienen resentimiento contra la gente de Kivotos, lo más razonable sería comprar un coche italiano.\"\n\nEn ese instante, la sonrisa desapareció del rostro de Mutsuki. \"…¿Qué? ¿Los humanos le abrieron la cabeza a Aru-chan con un martillo y aun así vamos a comprar un coche de la Tierra por pensar en esos *ciudadanos*?\"\n\"Yo solo estoy dando una opinión racional considerando la opinión pública local.\"\n\"Eso no es racional, es tratar a Aru-chan como una tonta. ¡Hay que ser más descaradas y comprar un coche de Gehenna!\"\n\"Mutsuki. Eso no es ser descarada, es poner a la jefa en peligro. Si provocamos sentimiento anti-Gehenna y vuelve a haber terrorismo…\"\n\"Ah, o sea que me estás amenazando con la vida de Aru-chan.\"\n\n\"¿Eh? Oigan, ¿ustedes dos?\"\n\nEl ambiente de la oficina se volvió helado de golpe. Mutsuki y Kayoko se miraban como si fueran a agarrarse del cuello en cualquier momento. Aru se levantó sudando frío, desconcertada.\n\n\"E-espera. ¡Esperen! ¡Lo del coche lo voy a decidir yo! ¡Lo decidiré, así que primero cálmense…!\""
 HEU_event.143.a:0 "\"¡Un coche de Gehenna también estará bien! Sí, ¿qué problema podría haber por un coche?\""
 HEU_event.143.b:0 "\"Esta vez vamos con uno italiano. Kayoko es el cerebro de Benriya, ¿no?\""

 HEU_event.144.t:0 "La primera colaboradora"
 HEU_event.144.desc:0 "¿Partido comunista? ¿Comunismo? Aru todavía no sabía mucho sobre ellos. No era que no supiera “nada”, porque incluso en Kivotos existe la Academia Red Winter. Un sistema donde les gustan los dictadores con bigote, y hay gente un poco igual y gente un poco más igual. Bueno, el llamado comunismo de la Tierra no será tan distinto a Red Winter. No serán gente decente.\n\nAun así, cuando aquel día los hospitales católicos que decían “ama a tu enemigo” cerraron con llave sus puertas, la única persona que salió con un maletín médico ante las amigas de Benriya, que llorando pedían por altavoz que alguien tratara a Aru, fue… un médico militante del Partido Comunista de Luxemburgo.\n\nEl político Charles Marx, a quien volvió a ver en la sede del partido, inspeccionó de arriba abajo a Aru al entrar en la oficina.\n\n\"¿Vienes sola a la sede del Partido Comunista, sin escolta, teniendo el estatus noble de regente del gran duque? ¿No te da miedo?\"\n\"Vengo a ver a quien me curó. ¿Por qué debería darme miedo?\"\n\nMarx, como si estuviera desconcertado por la respuesta ingenua de Aru, detuvo a otros miembros del partido que estaban a punto de levantarse.\n\n\"Una ingenuidad verdaderamente asombrosa. Dan ganas de aplaudirte. Salgamos a hablar.\"\n\"¿Qué? ¿Hay algo que yo no sé? ¿Es peligroso que yo esté aquí?\"\n\n\"¿Peligroso? Esto es de locos. Si tuviera que explicarte el marxismo-leninismo y la monarquía… Hah, déjalo. No soy un profesor de Kivotos como para andar enseñándole cosas a nuestra excelentísima regente.\"\n\nMarx habló con tono mordaz y salió de la sede junto a Aru.\n\n¿Marxismo-leninismo? Aru rebuscó en su memoria. Había oído vagamente sobre el comunismo, pero no recordaba ese nombre extraño pegando dos apellidos. De cualquier forma, no era lo importante. Lo importante era otra cosa: el motivo por el que Aru había ido a verlo.\n\n\"Quería preguntarte esto. Ese día todos se negaron a tratarme. ¿Por qué tú fuiste el único que me curó?\"\n\"¿Eso te daba curiosidad? ¿Por eso viniste sola hasta nuestra sede?\"\n\"Una forajida no olvida la cortesía con quien le ayudó. Quería darte las gracias también.\"\n\"…No hay nada que agradecer. Si no fuera por los malditos recuerdos del día de la Gran Transferencia, ni siquiera habría ido a por ti.\"\n\nMarx sacó un cigarrillo del bolsillo y se lo llevó a la boca."
 HEU_event.144.a:0 "\"Con solo aquel día de la Gran Transferencia basta para no querer ser un médico que solo mira cómo alguien muere por terrorismo…\""

 HEU_event.145.t:0 "Cooperación con el Partido Comunista"
 HEU_event.145.desc:0 "A través de su conversación con Charles Marx, Aru pudo saber un poco más sobre el Partido Comunista de Luxemburgo, un pequeño partido minoritario. La oficina era pequeña y rancia, y en la pared colgaba un retrato de Stalin —una persona que se parecía curiosamente a Cherino—. Su apoyo no era muy alto, y comparado con el Partido de Derecha, que había sido el partido gobernante, no era más que un puñado: un partido diminuto.\n\nSin embargo, Aru también pudo confirmar que el Partido Comunista de Luxemburgo era, al menos entre las organizaciones políticas del país, la única fuerza que *reconocía los derechos de los kivotosianos*.\n\n\"Todo trabajador debe ser liberado. Sea mujer u hombre, tenga o no un halo en la cabeza.\"\n\nDe entre todos los partidos de Luxemburgo, el único que tenía escrito en su línea partidaria “derechos humanos de los kivotosianos” era, únicamente, el Partido Comunista de Luxemburgo. Incluso Aru, que había investigado a todos los partidos del país, podía afirmarlo con certeza.\n\nEso sí, no podía llegar a entender a fondo qué eran exactamente “comunismo” o “marxismo-leninismo”. ¿Cómo iba a asimilar de inmediato conceptos como la teoría del valor-trabajo o el centralismo democrático, ideas que ni siquiera existían en Kivotos? Incluso para Aru, una excelente “empresaria” y administradora, no era fácil comprender una ideología completamente nueva.\n\nY bueno: ¿acaso la humanidad no era incapaz también de entender la cultura popular de Kivotos, como los estados-academia, Momotalk o el rock? Lo importante era que, por ahora, los únicos que podían ayudar a los derechos de los kivotosianos eran esos extraños comunistas.\n\nCon ellos… Aru sentía que no la traicionarían. Y que lucharían por los kivotosianos."
 HEU_event.145.a:0 "No me habré equivocado. Sí… seguro que no."

 HEU_event.146.t:0 "Brigada de Luxemburgo Libre"
 HEU_event.146.desc:0 "A medida que el Gran Ducado de Luxemburgo sufrió una invasión desde el exterior, se organizó una pequeña milicia llamada “Brigada de Luxemburgo Libre”, formada por voluntarios que querían defender Luxemburgo. Quien los lidera es Victor Bodson, un socialista antinazi y reconocido activista de derechos humanos que también encabezó la fuga de judíos desde la Alemania nazi.\n\nBodson quizá no sea un comandante brillante, pero su voluntad de proteger Luxemburgo de los invasores es firme. La Brigada de Luxemburgo Libre y Bodson serán incorporados al ejército regular de Luxemburgo y quedarán bajo el mando de Rikuhachima Aru."
 HEU_event.146.a:0 "Solidaridad por la libertad"

 HEU_event.147.t:0 "El nuevo plan de golpe"
 HEU_event.147.desc:0 "\"¿Dices que ni golpeándola con un martillo se muere? ¡¿Qué demonios es esa mujer, Rikuhachima?!\"\n\nSede del Partido de Derecha. El presidente del Parlamento, Émile Reuter, se jaló el cabello varias veces y estalló de ira, antes de mirar a los otros diputados “duros” del partido.\n\n\"Si el asesinato no funciona, usemos otro método. Al fin y al cabo, el cargo de esa mujer es el de 'regente'. Si traemos al heredero legítimo del Gran Ducado, ella tendrá que soltar todo el poder de forma natural.\"\n\nAnte la seguridad con la que habló Reuter, el político del Partido de Derecha Jean Origer respondió con sarcasmo:\n\n\"La Casa de Nassau no dejó a nadie vivo: todos murieron. ¿De dónde vamos a sacar un heredero legítimo? Lo único que queda es volcar una urna funeraria o algo así.\"\n\n\"¡Ni en broma se deben decir semejantes groserías! …¿Olvidó que el consorte de Su Alteza Charlotte, el señor Félix, pertenecía a la Casa de Borbón?\"\n\nReuter miró a los otros diputados y continuó:\n\n\"El señor Félix también era miembro de la Casa Gran Ducal… Así que, en teoría, podemos encontrar un heredero que continúe la Casa Gran Ducal dentro de la familia Borbón. Traemos al heredero desde el extranjero y, por sorpresa, presentamos una enmienda a la ley de sucesión para reemplazar al gran duque.\"\n\nEn cuanto se mencionó a la Casa de Borbón, el murmullo entre los diputados creció.\n\n\"Suena como una buena idea, pero…\"\n\"En ese caso, el hermano del consorte, Javier I, podría ser el heredero legítimo, pero él es el líder del *carlismo* español. ¿Piensan vender el país a España o qué?\"\n\"¿Vender el país? ¡Qué disparate! No estamos hablando de una unión personal; basta con que él ceda el liderazgo carlista y venga a Luxemburgo.\"\n\"¿Un pretendiente al trono de España va a abandonar España para venir a Luxemburgo?\"\n\"Eso… no lo sabremos hasta que lo contactemos.\"\n\"Vaya… o sea que la viabilidad…\"\n\nLa sala se volvió un caos por el interminable debate de escritorio de los diputados."
 HEU_event.147.a:0 "Sin darse cuenta, el plan de golpe quedó varado en un escollo."

 HEU_event.148.t:0 "Borrador del plan de ley de derechos civiles"
 HEU_event.148.desc:0 "Después del atentado, pasó por muchísimas cosas dolorosas en Luxemburgo. Por primera vez en su vida, estuvo a punto de que su halo se rompiera, y también terminó sin poder ver con un ojo para siempre. El brazo derecho, que en el hospital dijeron que estaba “bien” por ser una lesión menor, le temblaba con espasmos musculares incluso con solo sostener un bolígrafo.\n\nAun así, Aru no podía abandonar por completo la esperanza en la humanidad. Si se llegaba a un compromiso y se intentaba entenderse, sentía que todos podrían reconciliarse y vivir juntos en esa tierra. Porque existió aquel médico desconocido que vino a salvarla. Eso le permitió creer que no toda la humanidad odiaba a los kivotosianos.\n\n\"Por eso… quiero hacer una ley. Quiero persuadir al parlamento y, respetando el sistema de este país, encontrar una forma de proteger los derechos de los kivotosianos. Puede que el Partido de Derecha no lo permita, pero si cambiamos la opinión pública…\"\n\nPero no todos estaban de acuerdo con Aru. En especial, Mutsuki.\n\n\"Aru-chan. ¿Aru-chan todavía cree en *la humanidad*? ¿Quieres creer en esa gente que nos golpeó la cabeza con un martillo y que, a nosotras que salvamos Luxemburgo, nos grita que nos larguemos? …Además, ¿por qué tenemos que arrodillarnos ante los adultos locales para rogarles ‘por favor hagan una ley’? ¿Por qué Aru-chan tiene que ‘pedirles’ algo a esas personas?\"\n\nAl principio hablaba con el tono bromista de siempre, pero conforme avanzaba, las palabras de Mutsuki se encendían cada vez más. Desde aquel incidente en el que Aru estuvo a punto de morir, la desconfianza de Mutsuki hacia los humanos se había vuelto cada vez más intensa.\n\nAru podía entender esos sentimientos. Eran amigas de toda la vida. Entendía que Mutsuki estaba preocupada por ella. Pero aun así…\n\n\"Mutsuki-chan. Solo una vez. Solo una vez, dame una oportunidad. Yo soy la jefa de Benriya, ¿no? …Voy a organizar un debate público y voy a cambiar el corazón de la gente. Si sale bien, quizá ni siquiera tenga que ir al parlamento: la opinión pública podría hacer que aprueben la ley por sí sola, ¿sabes?\"\n\nAru dijo eso y sonrió con brillo. Esa sonrisa confiada. ¿Cómo podría Mutsuki rechazarla al verla?"
 HEU_event.148.a:0 "\"Haa… Está bien, Aru-chan. Pero solo una vez.\""

 HEU_event.149.t:0 "El debate del destino"
 HEU_event.149.desc:0 "“Vamos a cambiar el corazón de la gente con el debate.” Ante la seguridad de Aru, Kayoko dejó escapar un profundo suspiro.\n\n\"Normalmente, los planes de la jefa empiezan de forma genial y al final se estrellan contra el suelo.\"\n\"¡Ni siquiera hemos empezado y ya dices cosas de mal agüero!\"\n\"…Yo solo cité una estadística basada en hechos.\"\n\"¡Agh, odio las estadísticas!\"\n\"No es algo que debería decir una administradora, jefa.\"\n\nMientras seguía la pequeña discusión con Kayoko, Mutsuki soltó una risita y dejó caer con un ¡PUM! un fajo de documentos sobre el escritorio.\n\n\"¡Tarán! Para Aru-chan ya conseguí el lugar del debate, la transmisión en vivo por la emisora, ¡y hasta los oponentes del debate!\"\n\"¿T-transmisión en vivo? ¿¡En directo!?\"\n\"¿Eh? ¿Qué pasa, Aru-chan? Dijiste toda confiada: ‘Voy a convencer a todos los locales’. …¿Te da miedo ir en vivo? Y eso que eres una forajida *hardboiled*…\"\n\nLa sonrisa en la comisura de los labios de Mutsuki. Aru tragó saliva.\n\n¡Qué miedo! ¡Significa que todo el país va a ver mi debate de principio a fin!\n\nPero si no era en vivo… tampoco podría convencer a la gente, ¿verdad? Aru, con las manos temblándole, tomó el cronograma de transmisión que Mutsuki le extendía.\n\n\"Ajajá, ¿qué crees que estás diciendo? ¡Yo, la jefa de Benriya 68, Rikuhachima Aru! ¿Creíste que le tendría miedo a un debate en vivo? ¡Iré a la tele con toda confianza! ¡Ganaré con toda confianza! ¡Y con toda confianza voy a cautivar la opinión pública de Luxemburgo y hacerla mía!\"\n\nEn ese instante, la sonrisa de Mutsuki desapareció.\n\n\"Sí. Si lo logras, dejaré que Aru-chan haga lo que quiera… Si con este debate puedes convencerlos.\"\n\"¿Mu…tsuki-chan? ¿Tu cara da un poco de miedo?\"\n\nMutsuki sonrió de inmediato.\n\n\"¿Qué cara? Ajajá, ¿por qué? No será que estás fingiendo que no te asusta cuando en realidad te asusta, ¿verdad?\"\n\"¡De verdad que no! ¡E-el debate! ¡Me irá bien! ¡Sí!\""
 HEU_event.149.a:0 "…¿Saldrá bien?"

 HEU_event.150.t:0 "Debate público sobre la ley de derechos civiles"
 HEU_event.150.desc:0 "El debate sobre la ley de derechos civiles se decidió llevar a cabo dividido en varias rondas. En especial, el primer debate político se celebraría contra Damian Kratzenberg, líder del movimiento nacional-socialista de Luxemburgo —un nombre elegante para “nazi”; aunque lo maquillen, un nazi sigue siendo un nazi— y también se programaron debates contra el político populista de derecha Pierre Prüm y contra el conservador católico luxemburgués Émile Richter.\n\nLo importante no son los nombres de tantos personajes influyentes de Luxemburgo. Lo importante es que todos esos debates se emitirán por la televisión luxemburguesa para toda la nación, y que ellos serán quienes guíen la opinión pública. Como el Partido de Derecha, el partido gobernante, se opone a la ley de derechos civiles, Aru solo tiene una esperanza: presionar al Partido de Derecha con el poder del pueblo para que voten a favor. No sería algo fácil. Pero… si no lo hace Aru, ¿quién lo hará?\n\n£white_dot El debate público se desarrolla como un enfrentamiento entre el §Bapoyo§! de la opinión pública a favor de la ley de derechos civiles y el §Rapoyo§! de la opinión pública en contra. Si antes de que termine el debate el apoyo de un bando llega a 0, el otro bando gana. Pero si hasta que termine el debate el apoyo de ninguno llega a 0, gana el que tenga el apoyo más alto. (En caso de empate, se considera victoria de Aru.)\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra de la ley de derechos civiles §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.150.a:0 "Aru entró al estudio de la emisora, repleto de gente."
 HEU_event.151.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 1"
 HEU_event.151.desc:0 "Kratzenberg empezó con pasión, agitando los brazos de forma provocadora, como si evocara a Hitler, y desde el primer momento presionó con dureza a Rikuhachima Aru.\n\n\"Nosotros, el pueblo de Luxemburgo, *todos* vimos con nuestros propios ojos qué clase de barbaridades cometieron los kivotosianos durante la Gran Transferencia. Disparaban como si fuera un juego, y quemaron la ciudad de Luxemburgo como si la Gran Transferencia fuera un festival.\"\n\nKratzenberg dejó un momento para que el público recordara aquellos días y, tras una pausa calculada, continuó:\n\n\"¿Y qué hay de lo que pasó en el Palacio Gran Ducal? La hija menor de Su Alteza apenas tenía *seis años*. Históricamente, los únicos que hicieron cosas así fueron… *los bolcheviques*. Igual que los bolcheviques masacraron en Rusia, Gehenna hizo lo mismo en Luxemburgo.\"\n\nLa voz de Kratzenberg se fue elevando cada vez más. Y aun cuando se terminó su tiempo de intervención y se apagó el micrófono, no se detuvo.\n\n\"¡Son asesinos en masa! ¿Se supone que debemos recibir con fraternidad a quienes mataron a nuestras familias y regicidaron a Su Alteza y a su familia? ¡Ni Cristo lo habría hecho! ¿Y aun así se atreven a hablar de una ley de derechos civiles?\"\n\nAsesinos. Regicidio. Al oír esas palabras, Aru recordó la ciudad de Luxemburgo justo después de la Gran Transferencia: cadáveres ensangrentados, *algo* que había visto en el Palacio… y las palabras con las que fingió estar entera frente a eso. “Está bien, Mutsuki. No me pasa nada.” ¿De verdad no le pasaba nada? Sintió cómo se le humedecían las palmas.\n\nEl moderador lo interrumpió con prisa. \"Sí. Bien, hemos escuchado la declaración inicial del señor Damian Kratzenberg, presidente de la Asociación de Literatura Alemana. Ahora le damos tiempo a Su Alteza Rikuhachima para su réplica.\"\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.151.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.151.b:0 "Aru intentó refutarlo desde lo emocional..."
 HEU_event.151.c:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.152.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 2"
 HEU_event.152.desc:0 "Tras la réplica de Aru, volvió el turno de Kratzenberg. Se acomodó el borde de la manga del traje y asintió con suficiencia.\n\n\"Por supuesto, Su Alteza Rikuhachima puede intentar rebatir así los disturbios de la Gran Transferencia. Pero el *problema* no es solo lo que pasó entonces. Aquellos disturbios no fueron más que el primer ejemplo de las razones culturales por las que nosotros, los humanos, no podemos coexistir con los kivotosianos.\"\n\nKratzenberg recorrió lentamente con la mirada al público.\n\n\"Los inmigrantes llegados desde Gehenna, cuando surge un conflicto, lo primero que sacan son pistolas y granadas cegadoras. Para ellas, dispararse entre sí en una pelea es casi una broma. Sí: porque su cuerpo es más *resistente* que el de un humano común. Es lógico que nazca una cultura que resuelva conflictos a tiros.\"\n\nTras un breve silencio, Kratzenberg alzó la voz.\n\n\"Pero desde el punto de vista de *la humanidad*, ¿qué son? Por más que se las quiera defender, no son más que potenciales autores de tiroteos. Una especie que por una o dos discusiones se dispara entre sí. Una especie para la que apuntarle a alguien con un arma es un chiste. ¿Acaso la masacre de la Gran Transferencia no ocurrió por ese instinto de combate, casi salvaje? Entonces… ¿podemos los humanos coexistir con una especie tan peligrosa? Ustedes, ciudadanos, conocen la respuesta.\"\n\nUna cultura donde dispararse entre sí es normal. Aru lo sabía: ella también había vivido en Kivotos. Aunque hubieran caído a la Tierra, donde el misterio es tenue y las capacidades físicas son mucho menores, la cultura kivotosiana no iba a cambiar en poco tiempo. Aru se lo repitió en silencio: “Entonces… ¿cómo convenzo de que sí podemos coexistir?”\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.152.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.152.b:0 "Aru intentó refutarlo apelando a la empatía..."
 HEU_event.152.c:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.153.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 3"
 HEU_event.153.desc:0 "Tras el debate con Kratzenberg, el siguiente fue contra Pierre Prüm. Días después, Aru volvió a subir al estudio y se dio cuenta de que había muchas más cámaras mirándola que antes. Ya no era solo la cadena de Luxemburgo. Su debate se había convertido en un tema que observaban incluso otras academias. “Mi hardboiled no era esto… ¡soy una celebridad!” Por más que protestara por dentro, ya nadie la escucharía.\n\nPrüm, quien en el pasado llegó a desempeñar el cargo de primer ministro pero ahora era un alto miembro de GEDELIT, una organización nazi en Luxemburgo, parecía centrarse en usar esa emisión para elevar su apoyo popular. Él no era un creyente del nazismo… pero sabía que los votos de quienes sí lo eran resultaban bastante “dulces”.\n\n\"Es cierto que, por naturaleza, a las personas les cuesta mezclarse con lo diferente. Y más aún si hablamos de una especie que recuerda a los demonios de la Biblia.\"\n\nPrüm sacó de su maletín una Biblia en alemán y la levantó en alto.\n\n\"Cuernos de demonio, alas… e incluso, dicen algunos, cola. Durante *dos mil años* hemos considerado a seres así como demonios. ¿Y acaso no han actuado como demonios? Todos vimos cómo, tras la guerra, despedazaron otra vez a Alemania, que intentaba reconstruirse desde las ruinas.\"\n\nPrüm hablaba de una Alemania convertida en feudos por el Pandemonium y el Comité Disciplinario. Aru sabía, por lo que había oído, que antes de la Gran Transferencia aquello había sido un solo país.\n\n\"Caballeros de Luxemburgo: debemos aprender del colapso de Alemania. Ellas *no son humanas*. Craneológicamente son, de forma evidente, demonios con cuernos. Si les damos derechos, destruirán Luxemburgo como destruyeron Alemania.\"\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.153.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.153.b:0 "Aru intentó refutarlo desde lo emocional..."
 HEU_event.153.c:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.154.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 4"
 HEU_event.154.desc:0 "Tras el insulto de llamarlas “demonios”, algunas espectadoras de Gehenna armaron alboroto y fueron retiradas. El ambiente de la emisión era afilado. Prüm, con tono teatral, se dirigió a las estudiantes de Gehenna que eran arrastradas con los brazos sujetos.\n\n\"¡Mírenlas! ¡Ellas mismas están confesando que poseen un carácter cercano al de los demonios!\"\n\nAru lo dejó gritar cuanto quisiera. Era más fácil ignorar una cacería de demonios sin lógica.\n\n\"Hablemos de otra cosa. He explicado de forma consistente por qué los kivotosianos y la humanidad no pueden mezclarse. Y el problema de los kivotosianos no es solo su apariencia o su carácter. Su otro gran problema es que Kivotos es, en la práctica, una sociedad cercana al matriarcado.\"\n\nComo populista de derechas, Prüm sabía mejor que nadie qué quería la multitud que votaba por fascistas: hombres fuertes que no pierdan ante mujeres.\n\n\"Que kivotosianos y humanos sean empleados en igualdad y ocupen todos los oficios por igual… también significa que los hombres podrían ser comandados por oficiales mujeres con cuernos; y que podría llegar el día en que los hombres deban obedecer leyes hechas por un parlamento compuesto por mujeres.\"\n\nPrüm puso una expresión de incredulidad.\n\n\"Las sociedades civilizadas de Europa reconocen que las mujeres, comparadas con los hombres, son más emocionales y poseen menor capacidad de razonamiento lógico. Sí: existe sustento académico, como el psicoanálisis del señor Carl Jung, y países civilizados como la República Francesa y la Confederación Suiza restringen estrictamente la participación de la mujer en el voto.\"\n\nAsí que… ¿no se debía dar derechos a Kivotos por ser una sociedad matriarcal? Para Aru era un argumento absurdo. Pero… ¿también lo sería para los locales? Necesitaba, más que nunca, una frase decisiva: un golpe lógico o una apelación emocional.\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.154.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.154.b:0 "Aru intentó refutarlo con sarcasmo..."
 HEU_event.154.c:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.155.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 5"
 HEU_event.155.desc:0 "El último debate se celebró tres días después. Esta vez, asistió en persona Émile Richter, presidente del Parlamento y un veterano conservador del Partido de Derecha. Como correspondía a un “debate final”, se reunió una multitud enorme, y las compañeras de Benriya, incluida Mutsuki, también se sentaron con rostros sombríos. Aru sabía que este debate inclinaría fuertemente la opinión pública… y también sabía que Richter no era precisamente favorable a la ley.\n\n\"…Sé que Su Alteza la Regente ha hecho realmente muchas cosas por Luxemburgo. ¿Cómo podría yo ignorar los logros de Su Alteza, quien detuvo la masacre en Luxemburgo?\"\n\nAun diciendo eso, la expresión de Richter no era alegre.\n\n\"…Pero aunque muchos campesinos de las zonas rurales confíen en Su Alteza, no confían en los súbditos de Su Alteza. Población de Gehenna que ha venido en masa a sus antiguas tierras, ha ocupado territorio y exige derechos… y, en especial, ¿no fueron ellos quienes dispararon indiscriminadamente en la ciudad de Luxemburgo?\"\n\nAru sabía que, en el fondo, su argumento tenía razón. Los kivotosianos eran, al final, forasteros. Eso era algo que Aru no podía negar. Richter continuó, con mucha cautela, pero con firmeza:\n\n\"Humanos y kivotosianos deben, sin duda, coexistir. Sin embargo, la ley de derechos civiles, a día de hoy, es prematura. Firmarla antes de que desaparezca el resentimiento hacia Gehenna solo parecerá discriminación contra los locales; y se verá como si Su Alteza estuviera protegiendo a unos forasteros que se han ‘atrincherado’ en esta tierra. Los germanos han vivido aquí durante miles de años. Claro, no podemos pedirles que esperen tanto… pero, ¿no podríamos tener la paciencia de esperar al menos lo que dura un cambio generacional?\"\"\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.155.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.155.b:0 "Aru intentó refutarlo con sarcasmo..."
 HEU_event.155.c:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.156.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 6"
 HEU_event.156.desc:0 "Como político veterano, Richter sabía bien qué querían sus simpatizantes. En lugar de discutir si la ley era correcta o no, insistió en que “una política que el pueblo no desea no debe implementarse”. Aru no tenía un conocimiento profundo de la política local, pero sí comprendía que Richter estaba usando una maniobra bastante extraña. Después de todo, ni siquiera era un demócrata.\n\n\"…Su Alteza. Debemos tener cuidado con el impacto que esta ley causará en los países vecinos. Por la Gran Transferencia, el canciller alemán Adolf Hitler falleció; y los gobiernos de Países Bajos y Bélgica tuvieron que exiliarse en el extranjero. Dado que Luxemburgo es un Estado soberano miembro de la Sociedad de Naciones, no nos queda más remedio que ser extremadamente prudentes al garantizar legalmente derechos a los kivotosianos. Si el embajador británico, o el embajador belga, le preguntaran esto… ¿cómo respondería? ¿Por qué el parlamento de Luxemburgo coloca una corona de laurel sobre la cabeza de los invasores? ¿No le avergüenza ante los nombres de Alemania, Britania, Suecia, Países Bajos, Bélgica, Austria y Noruega?\"\n\nRichter alzó ligeramente las manos, como si actuara en una obra.\n\n\"Algún día, ambos pueblos deberán reconciliarse. Pero ese día no es hoy. El Señor dijo en 1 Tesalonicenses 5:22: ‘Absteneos de toda apariencia de mal’. Eso significa que, aunque parezca una opción atractiva ponerse del lado de los invasores, debemos desecharla hasta que la justicia correcta se cumpla en suelo europeo.\"\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.156.a:0 "Aru intentó refutarlo con lógica..."
 HEU_event.156.b:0 "Aru intentó refutarlo con sarcasmo..."
 HEU_event.156.c:0 "Aru intentó refutarlo apelando a la empatía..."
 HEU_event.156.d:0 "…¡Se quedó sin palabras! ¡Todo se volvió blanco ante sus ojos!"

 HEU_event.157.t:0 "Debate público sobre la Ley de Derechos Civiles - Fase 7"
 HEU_event.157.desc:0 "Los tres debates sobre la Ley de Derechos Civiles se transmitieron por todo Luxemburgo, e incluso a otros Estados-Academia. Estos debates mostraron a muchas personas que Rikuhachima Aru era más capaz de expresar sus argumentos de forma lógica de lo que esperaban. Pero el verdadero problema era cuánta gente logró convencer. Si el apoyo a la ley no era lo suficientemente alto, no tendrían el poder de presionar a los políticos luxemburgueses.\n\nAhora, tras terminar todos los debates, Rikuhachima Aru volvió a su casa para descansar y esperar el anuncio de la encuesta sobre la opinión pública. Ya no había nada más que Aru pudiera hacer.\n\nOpinión pública a favor de la ley de derechos civiles §Bapoyo§!: [?benriya_debate^0]\nOpinión pública en contra §Rapoyo§!: [?benriya_debate^1]"
 HEU_event.157.a:0 "Solo queda esperar el resultado..."

 HEU_event.158.t:0 "Anuncio de la encuesta"
 HEU_event.158.desc:0 "Tras finalizar el debate público, se realizó una encuesta pública dirigida a los ciudadanos de Luxemburgo. Esta vez, el muestreo se llevó a cabo de manera muy cuidadosa por diversos métodos y… el resultado fue…\n\nLa noticia de que la opinión pública cambió drásticamente ante la frialdad inesperada que Aru mostró en el debate, y que el apoyo a la ley de derechos civiles superó la mitad de la población luxemburguesa. ¡Un giro masivo de opinión! Incluso los conservadores del Partido de Derecha, que dudaban de que la ley debiera aprobarse, no tuvieron más remedio que observar a la opinión pública.\n\n\"¡Esto sí es carisma de verdad! ¡El liderazgo que solo yo, la jefa de Benriya 68, puedo tener! ¡Ufufú!\"\n\nAru agitó el periódico con las manos y se echó a reír. Desde el intento de asesinato, hacía mucho que no mostraba una sonrisa tan feliz. Haruka, al verla animada, le aplaudió para felicitarla.\n\n\"¡Aru-sama! ¡Yo… de verdad creía que Aru-sama lo lograría!\"\n\nKayoko dejó escapar un suspiro.\n\n\"Bueno… al menos logramos poner a la opinión pública de nuestro lado. Aunque todavía no sabemos si esta ley de derechos civiles funcionará como debe.\"\n\n\"¡Tiene que funcionar! Mi objetivo es que en esta tierra no vuelva a haber peleas entre los dos pueblos. Ya pensé en un método.\"\n\n\"¿Un método?\"\n\n\"¡En Luxemburgo hay gente que defiende los derechos de los kivotosianos! Si le pedimos ayuda al Partido Comunista, ¡todo se resolverá!\""
 HEU_event.158.a:0 "Aquel día, Aru durmió por fin en paz, después de mucho tiempo."

 HEU_event.159.t:0 "Anuncio de la encuesta"
 HEU_event.159.desc:0 "Tras finalizar el debate público, se realizó una encuesta pública dirigida a los ciudadanos de Luxemburgo. Esta vez, el muestreo se llevó a cabo de manera muy cuidadosa por diversos métodos y… el resultado fue…\n\nFracaso. A pesar de los esfuerzos desesperados de Aru, la opinión sobre la ley de derechos civiles no cambió mucho.\n\n\"Creo que… estuvo mal de mi parte pensar que yo podía lograr algo así.\"\n\nEl plan de presionar al Partido de Derecha con la fuerza de la opinión pública se acabó. Desanimada, Aru se desplomó sobre el escritorio con una expresión flácida, como un pulpo arrojado fuera del agua.\n\n\"Bueno, hay días en los que Aru-chan pierde, a veces. Ajajá.\"\n\n\"¡Esto no es algo que se pueda resolver con un ‘ajajá’!\"\n\n¡BAM! Aru golpeó el escritorio en dirección a Mutsuki, que estaba sonriendo.\n\n\"Quería… encontrar una forma de que la gente pudiera vivir junta en esta tierra… ¡de alguna manera! Yo… pero yo no pude hacer nada… fallé… y fallé y fallé y fallé y…\"\n\n\"Aru-chan. ¿Sabes que en este momento te ves bastante grave?\"\n\nLa sonrisa desapareció del rostro de Mutsuki. Ella dejó escapar un suspiro corto y se levantó.\n\n\"¿Un mundo donde todo salga exactamente como Aru-chan quiere? Eso no existe, ya lo aprendimos en Kivotos. Perdimos, Aru-chan. Ahora no queda más que buscar un Plan B.\"\n\n\"¡Ni siquiera… pensé en algo así…!\"\n\n\"Está bien. Yo y Kayoko-chan veremos qué hacemos. Ahora mismo, Aru-chan necesita descansar.\""
 HEU_event.159.a:0 "Pero… no hay forma de que pueda ‘descansar’."

 HEU_event.160.t:0 "El plan de Aru"
 HEU_event.160.desc:0 "\"¿Esos rojillos van a entrar ahora a una coalición? ¡Pero si ni siquiera tienen escaños!\"\n\nEl primer ministro Joseph Bech, tras recibir la llamada en la sede del Partido de Derecha, habló con tono incrédulo. Del otro lado del auricular se oyó el suspiro breve del diputado Pierre Dupont.\n\n\"Su Alteza la Regente considera que, para administrar y sostener la ley de derechos civiles, el Partido Comunista —el más compasivo hacia los kivotosianos— debe participar en el gobierno. Dentro de nuestro partido hay una oposición muy fuerte a la ley, y Su Alteza está muy preocupada por si la ley podrá implementarse correctamente.\"\n\n\"¡De entre tantos partidos, justo esos rojos! Ah… joder.\"\n\nJoseph Bech sintió cómo le palpitaba la cabeza. ¿Que, con la excusa de ‘proteger la ley de derechos civiles’, unos estalinistas entren al gabinete? Los bolcheviques fueron quienes exterminaron a la familia Románov en los ‘disturbios rusos’. ¿Quién garantiza que, si su poder crece, no harán lo mismo con el Partido de Derecha?\n\nPero era evidente que el centro del poder ya no estaba en Bech, sino en Aru. Si Aru se mantenía firme, probablemente no podrían oponerse.\n\n\"Haa… Está bien, acepto. Pero hay que evitar a toda costa que esos rojos metan mano en la política más allá de la ley de derechos civiles. Reunámonos mañana en la sede.\""
 HEU_event.160.a:0 "El plan de Aru, a su manera, avanza hacia el éxito."

 HEU_event.161.t:0 "Gobierno de coalición"
 HEU_event.161.desc:0 "Para el Partido Comunista, hoy era el mejor día de su vida. Alquilaron por completo un bar, y frente a todos había cerveza y bratwurst. El líder del partido, Zénon Bernard, se subió a una silla y habló con una voz eufórica.\n\n\"¡La estúpida mujer de cuernos nos ha llamado para ser partido de gobierno! ¡Ja, ja! Cuando Luxemburgo se vuelva revolucionario, mandemos a esa idiota al otro lado sin sufrimiento, ¿eh?\"\n\n\"¡Jajaja!\" \"¡Eso!\"\n\nIncorporar al Partido Comunista a la coalición para supervisar la ley de derechos civiles. Para Aru, quizá solo era eso… pero como jefa de un Estado monárquico, ¿realmente entendía qué era el ‘marxismo-leninismo’? Entre los políticos y asesores comunistas, se filtraron risas excitadas y burlas hacia Aru.\n\nEn medio de todo, el político comunista Charles Marx les cortó la risa.\n\n\"Cualquiera pensaría que ya terminó nuestra revolución. Ahora no es momento de alegrarse tanto.\"\n\nCon su tono tajante, el bar quedó en silencio.\n\n\"Claro, nuestra línea no cambia: Rikuhachima no deja de ser una monarca feudal. Pero frenen un poco. No olviden por qué pudimos entrar a la coalición: por los derechos de los kivotosianos. El compañero Bernard también debe tenerlo presente.\"\n\nBernard emitió un “ngh” y asintió.\n\n\"Tienes razón. No hace falta enfrentarnos de inmediato a Rikuhachima ni continuar la lucha revolucionaria. Hoy celebremos, pero mañana volvamos a movernos con frialdad. ‘El pueblo de Kivotos también es un pueblo de trabajadores, igual que la humanidad’. …Hasta que la ley de derechos civiles se asiente, concentrémonos solo en esa línea sin tambalearnos y hagamos crecer el apoyo popular. Bien, por la revolución comunista socialista en un solo país. ¡Brindemos!\""
 HEU_event.161.a:0 "Todos tienen su propio plan."

 HEU_event.162.t:0 "Advertencia"
 HEU_event.162.desc:0 "Últimamente era raro que Aru se quedara sola en la oficina. En especial después del intento de asesinato, las integrantes de Benriya 68 se habían vuelto aún más obsesivas con la seguridad de Aru. Si Aru estaba sola hoy, era por una sola razón: había hecho salir a las demás diciendo que debía recibir a un invitado.\n\n\"Señorita Rikuhachima… sería mejor que pensara un poco más. Si ya te han metido plomo en la cabeza una vez, deberías sospechar que podría pasar una segunda vez, ¿no?\"\n\nCon su tono burlón característico, Charles Marx entró en la oficina. Había sido él quien pidió verla primero.\n\n\"Pensé que, si eras tú… esa posibilidad no existía…\"\n\n\"Si escuchas por qué vine hoy, quizá cambies de idea.\"\n\n\"Hubo una fiesta en el Partido Comunista. Qué divertido habrá sido: es la primera vez que entran al gobierno. Pero pensé que debía contarte qué se dijo ahí.\"\n\n\"…¿Qué se dijo?\"\n\n\"Que harán una revolución en Luxemburgo. Que Rikuhachima, la que los dejó entrar al gobierno, es increíblemente idiota. Y que, en cuanto ellos tengan el poder, te mandarán al pelotón de fusilamiento.\"\n\nPelotón de fusilamiento. Al oír esas palabras, el rostro de Aru se endureció. ¿No era ese el partido que decía garantizar los derechos de todos los kivotosianos? Aru los había incorporado a la coalición precisamente para mantener la ley.\n\n\"E-espera. O sea… ¿me matarían? Eso… es mentira, ¿no?\"\n\n\"Señorita Rikuhachima, madura ya. Si nuestro partido llega al poder, ¿crees que solo morirías tú? También atarán al pelotón a esas chicas que tú *tanto* dices querer proteger. ¿No lo entiendes?\"\n\nCon una burla, Marx se dio la vuelta.\n\n\"Claro, que el partido entre al gobierno no significa que todo ocurra de inmediato, pero…\"\n\n\"S-si eso es cierto… entonces tú… ¿por qué me dices esto?\"\n\n\"Te lo repito: madura. Conviértete en alguien capaz de asumir la *responsabilidad* por las personas que quieres proteger.\""
 HEU_event.162.a:0 "\"Si sigues siendo una niña para siempre, no podrás proteger a quienes te importan.\""

 HEU_event.163.t:0 "El perro de los locales"
 HEU_event.163.desc:0 "\"¿Ley de derechos civiles? Oye, ¿no es algo bueno?\"\n\n\"Es una buena ley para nosotras, sí, pero… ¿no te cayó mal Aru en el debate?\"\n\n\"Que la llamen ‘Su Alteza’, ‘Su Alteza’, y que la estén levantando en un pedestal… se comporta como si de verdad fuera noble. Y aparte, ¿por qué tenemos que estar protegidas por una ley? Ese ejército local, con que disparemos unas cuantas veces, salen corriendo: son débiles.\"\n\n\"Exacto. No tenemos por qué agachar la cabeza pidiendo misericordia. Pero Rikuhachima se convirtió en el perro de los locales, mendigando a esos débiles los derechos que deberíamos tener por defecto. ¿Tiene sentido? Si con un tiro se acaba.\"\n\n\"Todo esto es porque se está dejando ‘alimentar’ por los locales.\"\n\n\"¿Alimentar?\"\n\n\"A cambio de inclinarse ante los locales, debió pactar que le darían algo. Si no, ¿por qué esa forajida de Kivotos se arrastraría como un perro para pedirles misericordia?\""
 HEU_event.163.a:0 "\"Como sea… a esa tal Rikuhachima, luego hay que darle una lección.\""

 HEU_event.164.t:0 "¡Felicidades por la gran coalición!"
 HEU_event.164.desc:0 "Al fin el parlamento aprobó la ley de derechos civiles, y el Partido Comunista de Luxemburgo fue incorporado a la coalición para administrar y supervisar su implementación. Como era un partido extraparlamentario, en condiciones normales era natural que ni siquiera participara en conversaciones de gobierno; sin embargo, se decidió incorporar a algunos de sus políticos al gabinete, limitándolos a un pequeño poder: “supervisar la ley de derechos civiles”.\n\nPero el rostro de Aru, conduciendo personalmente el coche oficial rumbo al Palacio, estaba rígido y helado. Debería estar feliz. Había creído que, si la ley quedaba en manos de los locales que decían proteger los derechos, ellos lo resolverían todo. Pero… ¿también eran malas personas? ¿También querían matarla?\n\n\"Ser alguien que se hace responsable… ¿qué significa?\"\n\n¿Qué es ser adulta? ¿Significa no depender de nadie y proteger con tus propias fuerzas a quienes amas? ¿Eso es ser adulta?\n\nCon esos pensamientos enredados, Aru estacionó cerca del palacio y bajó. En ese instante vio a varias estudiantes de Gehenna con sonrisas burlonas.\n\n\"¡Oye! ¡Perro de los locales!\"\n\n\"¿Eh? ¿Yo?\"\n\n\"¿Qué les ofreciste a esos peces gordos locales para que te hicieran regente y noble y te dieran de todo? ¡Cuéntanos a nosotras también!\"\n\n\"¿‘Ofrecer’? Yo no…\"\n\n\"¡Ley de derechos civiles o lo que sea! ¿Por qué, por tu culpa, tenemos que mendigar misericordia bajo esos malditos locales?!\"\n\nCuando Aru alzó la vista, la chica de adelante le arrojó un bote de pintura blanca a la cara. Con un “¡shaaa!” empapó todo su cuerpo de blanco, blanco puro. Gritos. Risas de burla. Los soldados que custodiaban el palacio gritando órdenes. Entre el olor característico de la pintura al agua, Aru sintió un mareo y se desplomó de rodillas."
 HEU_event.164.a:0 "Ah."

 HEU_event.165.t:0 "Soy feliz"
 HEU_event.165.desc:0 "La oficina sin Aru. Las tres de Benriya se reunieron en un ambiente incómodo. Kayoko habló primero, con una voz fría.\n\n\"Si lo analizamos lógicamente, la pintura blanca que le arrojaron a la jefa puede interpretarse como una metáfora sexual. Lo que decían esas estudiantes de Gehenna: ‘¿No será que se convirtió en regente porque les ofreció algo a los locales?’ Si consideramos que *qué cosa* podría implicar un soborno sexual…\"\n\n¡BAM! Se oyó el golpe del pie de Mutsuki contra la pared.\n\n\"Sí, Kayoko-chan, yo también sé que esas mocosas querían acosar sexualmente a Aru. *Lo sé*. Entonces, ¿por qué no las atrapamos a las que huyeron y les arrancamos la boca de una vez? ¿Por qué tanto bla bla?\"\n\n\"Con ese método no puedes detener la difamación. El rumor ya se extendió por Gehenna. Por eso estoy buscando una manera de resolver el malentendido con todas las estudiantes: si analizamos el malentendido y lo explicamos de forma lógica…\"\n\n\"Aha~ o sea que lo que dices es que salgamos juntas a decir: ‘Aru-chan nunca se acostó con hombres— es una niña limpia que ni piensa esas cosas— kyahaha’, ¿no? Aha, qué fácil. …Oye, Onikata. ¿Me estás tomando el pelo? ¿Te parece graciosa Aru? Si vamos por ahí ‘aclarando’ eso, ¿cómo crees que queda la imagen de Aru? ¿Eh? ¿No piensas?\"\n\n\"…Ah. ¿Insultos porque te quedaste sin palabras? Pero si tanto te importaba la jefa… ¿qué hiciste tú para que todo llegara a este punto? Ni siquiera sabías que ese rumor corría entre las estudiantes de Gehenna. ¿Solo finges que la aprecias?\"\n\n\"Ufufú… je. Qué divertido. Muy divertido. Pero tú… no te han metido una bala en la cabeza desde la Gran Transferencia, ¿verdad? Dicen que aquí el misterio es débil y que de verdad *se puede romper el halo*.\"\n\n\"Señorita Mutsuki, señorita Kayoko, p-por favor, cálmense las dos…\"\n\n¡BAM! Aru abrió la puerta de la oficina de golpe. Kayoko y Mutsuki, con las armas apuntándose entre sí, giraron hacia ella con rostros sorprendidos. Mira. Este es el resultado de todo lo que *decías* querer proteger.\n\n\"Salgan. …No necesito la ayuda de ninguna de ustedes.\""
 HEU_event.165.a:0 "¿Para quién habían sido, entonces, todas sus acciones?"
 HEU_event.200.t:0 "Pecadora"
 HEU_event.200.desc:0 "\"¿Por qué… yo…? …Ggh… hic…\"\n\nAru, tambaleándose frente al Palacio Berg —el lugar destinado a convertirse en el sitio de construcción del parque conmemorativo—, terminó desplomándose y estalló en llanto. Alrededor del museo del parque, donde aún se alzaban llamas negras, los bomberos seguían con un combate inútil contra el fuego. Las instalaciones del parque habían sido destrozadas a golpes, y también se veía cómo obreros locales, linchados por estudiantes de Gehenna, eran subidos a ambulancias.\n\n\"Aru-sama…\"\n\nCon el terrorismo de las estudiantes de Gehenna, el proyecto del parque conmemorativo quedó totalmente acabado.\n\nNormalmente, aunque ocurriera algo inesperado y desconcertante, Aru no llegaba a llorar así. Incluso ante situaciones imprevistas, lo habitual era que reaccionara con fanfarronería, tipo: “¡Si soy hardboiled, esto lo tenía previsto!”\n\nPero la cadena de tragedias desde el intento de asesinato contra Aru… ya la había llevado al límite. Su voluntad estaba agotada. ¿Hasta *cuándo* tendría que repetir fracasos? ¿Por qué… seguía viva aquí?\n\nHaruka quiso decir algo para consolarla. Pero, al verla incapaz de detener el llanto, no supo qué palabras podrían servirle de alivio."
 HEU_event.200.a:0 "Gehenna volvió a ganar. ¿Y ustedes… qué obtuvieron con eso?"

 HEU_event.201.t:0 "¿Para qué habría que construirlo?" #3번
 HEU_event.201.desc:0 "\"Si lo pensamos fríamente, el número de muertos por la Gran Transferencia no es más que un puñado comparado con los que murieron en la Revolución Rusa, ¿no? La Gran Transferencia fue una tragedia, sí, pero al menos los nobles fueron ‘limpiados’ y el dinero público que despilfarraban volvió a la clase trabajadora. Eso, como mínimo, puede verse como algo positivo. Entonces… ¿para quién es este aparato de conmemoración llamado ‘parque memorial’? ¿Para llorar que murieron nobles?\"\n\nZénon Bernard, político del Partido Comunista de Luxemburgo que en 1934 llegó a ser electo en unas elecciones legislativas, se burló con cinismo del proyecto del Parque Conmemorativo de Luxemburgo en una entrevista privada con un periodista. En particular, se convirtió en un foco de polémica el hecho de que el parque se construyera en el antiguo terreno del palacio.\n\n\"Hay que notar, en esencia, que este parque memorial no es realmente una institución para recordar. No es más que la vieja fuerza feudal de Luxemburgo —con los nobles a la cabeza— vendiendo sentimentalismo para expandir su influencia popular. Si de verdad fuera un memorial con sinceridad, ¿acaso no habría muchos otros lugares buenos, aunque no fuera un castillo?\"\n\nMás allá de si las palabras de Bernard eran lógicas o racionales, el hecho de que un político del Partido Comunista —miembro de la coalición gobernante— apareciera en el periódico enfureció a muchos conservadores. Algunos grupos campesinos están culpando a Rikuhachima Aru por no haber frenado las declaraciones de Bernard."
 HEU_event.201.a:0 "\"¡Fue una entrevista en un lugar que ni sabía! ¿Qué se supone que debía hacer?!\""
 HEU_event.201.b:0 "\"Primero… tengo que declarar públicamente que no estoy de acuerdo con ese señor…\""

 HEU_event.202.t:0 "Un día sombrío para Su Majestad Guillermo"
 HEU_event.202.desc:0 "Visitar la obra del parque conmemorativo para los luxemburgueses… Guillermo II *de verdad* no quería hacer eso. Incluso siendo políticamente inepto, sabía perfectamente que la invitación del Partido Comunista para que visitara el parque era, básicamente, para humillarlo públicamente. Pero no podía negarse. Ellos eran “partido de gobierno”, y Guillermo II no era más que un exiliado sin peso, viviendo de prestado en Luxemburgo, el lugar que él mismo había conquistado durante la Gran Guerra.\n\n\"Señor Wilhelm Hohenzollern. Encantado. Sí, estamos frente a periodistas, así que sonría un poco.\"\n\nCharles Marx, un veterano diputado comunista, apareció acompañado por reporteros. Con un tono que sonaba a burla, saludó a Guillermo y lo condujo hacia el parque aún sin terminar.\n\n\"La visita del señor Guillermo será un gran cambio para Luxemburgo. Porque quien invadió Luxemburgo en la Gran Guerra viene hoy a rendir homenaje a los luxemburgueses… y a expiar su culpa.\"\n\n\"No, yo… solo pensé que, si estaban construyendo un parque, no estaría mal pasar a verlo una vez…\"\n\n\"¿Ah, sí? Señor Guillermo, ¿acaso no siente remordimiento por haber invadido y ocupado militarmente Luxemburgo en aquella guerra? Ya que los periodistas están aquí, dígalo públicamente. Podrían expulsarlo de Luxemburgo, pero ¿qué importa? ¡Debe mantenerse firme ante sus ideales!\"\n\nQuería matarlo. Maldito rojo.\n\n\"Yo… eh… por supuesto que me arrepiento de la invasión de Luxemburgo, y como dice el señor Marx, vengo a rendir homenaje a quienes murieron por la Gran Transferencia…\""
 HEU_event.202.a:0 "El artículo con la foto de Guillermo, con la cabeza gacha, se volvió un producto ‘estrella’ entre los luxemburgueses."

 HEU_event.203.t:0 "Reacciones divididas dentro del Partido Comunista" #1번
 HEU_event.203.desc:0 "En principio, el Partido Comunista de Luxemburgo apoya la construcción de un “parque conmemorativo para las víctimas de la Gran Transferencia”, pero sostiene que “los homenajeados deben limitarse a la gente común”. En particular, el hecho de que el terreno elegido sea el antiguo palacio —que evoca a la familia gran ducal de Luxemburgo— se ha convertido en un tema de gran controversia dentro del partido.\n\nLos moderados, encabezados por Charles Marx, argumentan que “se está transformando un palacio en un espacio para el pueblo, así que un comunista debería alegrarse”. Pero los duros, encabezados por Zénon Bernard, se oponen diciendo que “el hecho mismo de usar el antiguo palacio como sitio del memorial implica favorecer más a los nobles fallecidos”. A medida que crece el conflicto interno por el parque, el partido decidió no apoyar ni oponerse oficialmente a su construcción.\n\nCon esta decisión, cada militante y miembro del partido juzgará el proyecto según su propio criterio."
 HEU_event.203.a:0 "Mientras no se opongan abiertamente, está bien."

 HEU_event.204.t:0 "Los duros del Partido Comunista se coluden con Gehenna" #2번
 HEU_event.204.desc:0 "El ala dura del Partido Comunista de Luxemburgo está contactando a estudiantes de Gehenna que se oponen al parque conmemorativo para impedir su construcción. Hoy, Zénon Bernard se reunió en su despacho con estudiantes de Gehenna y llegó con ellas a un acuerdo: que el parque “denigra intencionalmente a las estudiantes de Gehenna”. Como más de la mitad de la población kivotosiana en Luxemburgo es de origen Gehenna, la operación de “agitación en Gehenna” del Partido Comunista sin duda estorbará el proyecto."
 HEU_event.204.a:0 "¡Ay, no…!"

 HEU_event.205.t:0 "¡Crash!" #4번
 HEU_event.205.desc:0 "Un pequeño grupo de militantes del Partido Comunista de Luxemburgo se infiltró hoy en secreto en el sitio de construcción del parque conmemorativo. Entraron al museo, rompieron la nariz de una estatua de yeso que representaba a la Gran Duquesa Charlotte en vida y, al intentar huir, fueron capturados por obreros locales. Ante la policía, declararon: “No nos gustaba que la estatua de Charlotte estuviera en el parque”.\n\nSu delito es de poca monta, pero, de una forma u otra, parece que lograron irritar a los conservadores luxemburgueses."
 HEU_event.205.a:0 "¿Para qué demonios querían esa nariz?"

 HEU_event.206.t:0 "El parque conmemorativo como espacio de reconciliación" #5번
 HEU_event.206.desc:0 "Hoy, Charles Marx, diputado del Partido Comunista de Luxemburgo, entregó una pequeña donación para la construcción del parque conmemorativo, no a nombre del partido sino a título personal. Marx dijo: “Yo también estaba en la ciudad de Luxemburgo como médico el día de la Gran Transferencia, y vi tanto a los kivotosianos que provocaron disturbios como a los kivotosianos que intentaron detenerlos”, y añadió: “Espero que esta construcción pueda ser el primer paso hacia la reconciliación entre la humanidad y Kivotos, entre ambos pueblos”.\n\nEl ala dura del partido acusó a Marx de ‘conducta contraria al partido’ por la donación, pero Marx mantiene una postura de total silencio frente a esas críticas."
 HEU_event.206.a:0 "Un obsequio modesto, pero valioso."

 HEU_event.207.t:0 "Intento de irrupción de Gehenna y militantes comunistas" #6번
 HEU_event.207.desc:0 "Hoy, algunas estudiantes de Gehenna y militantes del Partido Comunista de Luxemburgo intentaron irrumpir en el sitio del parque conmemorativo para detener la obra, pero fueron contenidos. Sorprendentemente, quienes impidieron el terrorismo fueron otras estudiantes de Gehenna: las mismas que en la Gran Transferencia habían participado en frenar los disturbios.\n\nLas estudiantes que detuvieron el atentado declararon a la prensa: “En un café escuchamos que estaban planeando un ataque, así que fuimos a detenerlo”. Gracias al valor de estas estudiantes se evitó la paralización de la obra, pero el público parece decepcionado por el simple hecho de que el atentado estuviera a punto de ocurrir."
 HEU_event.207.a:0 "Haa…"

 HEU_event.208.t:0 "Más allá del muro"
 HEU_event.208.desc:0 "Eh… ejem… sinceramente, yo no soy una gran oradora. No tengo confianza para soltar aquí frases bonitas y hacer llorar a la gente. Pues… soy una forajida, ¿no? Aunque ahora ya me volví medio ciudadana respetuosa de la ley. (Risas) Así que, cuando me pidieron encargarme del discurso de inauguración del parque, me quedé muy desconcertada. Pensé mucho en qué diría Mutsuki, qué diría Kayoko, qué diría Haruka…\n\nPero al final entendí que no hacía falta un discurso largo. Solo… este parque, el museo más allá del parque, y todas las personas que vendrán aquí. Todo eso, creo, llegará más a las víctimas que cien frases. No las olvidamos. Las seguiremos recordando. Y así, se lo decimos al cielo.\n\nY aunque sea un poco, espero que este parque conmemorativo sea una expiación por quienes murieron en la Gran Transferencia. No podemos hacer volver a los muertos… pero quiero que quienes quedamos podamos reconciliarnos y vivir juntos en esta tierra. Eso es todo."
 HEU_event.208.a:0 "Sin expiación, no podemos avanzar hacia el futuro."

 HEU_event.209.t:0 "Alianza temporal con Luxemburgo"
 HEU_event.209.desc:0 "Benriya 68, que gobierna Luxemburgo, entiende que nuestro gobierno desea destruir por completo a las fuerzas de Gehenna. Ellas han propuesto una alianza temporal que dure *hasta que destruyamos Gehenna*. Saben que Trinity, por tradición, no simpatiza con Gehenna, y también saben que ellas mismas, al fin y al cabo, forman parte de *esa Gehenna*. Sin embargo, Asagi Mutsuki, encargada de la diplomacia, señaló que Luxemburgo está en la retaguardia del Pandemonium y del Comité Disciplinario, y propuso que, si Trinity invade Gehenna, Luxemburgo podría ‘atar’ parte del ejército de Gehenna desde la retaguardia.\n\nDividir el frente enemigo en dos es, sin duda, una propuesta atractiva. Y el hecho de que sea una alianza temporal también deja satisfecho a Trinity. Pero la decisión final sigue siendo derecho de [TRM.GetLeader]."
 HEU_event.209.a:0 "Bien, despleguemos un frente común."
 HEU_event.209.b:0 "A Rikuhachima Aru nunca me cayó bien."

 HEU_event.210.t:0 "Aceptación de Trinity"
 HEU_event.210.desc:0 "Trinity aceptó nuestra propuesta de alianza temporal. Cuando nosotros o Trinity ataquemos a Gehenna, formaremos una alianza militar provisional. Será temporal, pero sin duda nos será de gran ayuda."
 HEU_event.210.a:0 "Buenas noticias."

 HEU_event.211.t:0 "Rechazo de Trinity"
 HEU_event.211.desc:0 "¿Qué esperaban de [TRM.GetLeader]? Rechazaron nuestra propuesta de coalición. Claro, incluso sin alianza con Trinity podemos atacar al Pandemonium por nuestra cuenta, pero no será una pelea fácil."
 HEU_event.211.a:0 "Esto se complicó."

 HEU_event.212.t:0 "El fin de la alianza temporal"
 HEU_event.212.desc:0 "La alianza Luxemburgo–Trinity fue, como estaba previsto, algo temporal, y una vez desapareció el enemigo común ya no tiene razón de existir. Todas las relaciones de alianza han sido liquidadas, y en cualquier momento podría volver a estallar una guerra entre ambos países."
 HEU_event.212.a:0 "El final de una breve lucha conjunta."

 HEU_event.213.t:0 "Una guerra por el pueblo germánico"
 HEU_event.213.desc:0 "Independientemente del verdadero propósito de esta guerra, es evidente que el lema “una guerra por el pueblo germánico” está exaltando a nacionalistas y a fascistas supervivientes en lo que queda de Alemania. Milicias que izan tanto la esvástica como la bandera de Luxemburgo han propuesto unirse a nuestro ejército, y dentro de Luxemburgo continúan los alistamientos voluntarios de ultranacionalistas.\n\nSin embargo, Émile Schëppler, jefe militar —un monárquico conservador con mentalidad del siglo XIX— advirtió: “Me preocupa que sean personas cuya lealtad a la nación pese más que su lealtad a Su Alteza”, mostrando cautela ante los voluntarios."
 HEU_event.213.a:0 "No alarguemos demasiado esta guerra."

 HEU_event.214.t:0 "¡El regreso de Kaitenger!"
 HEU_event.214.desc:0 "¡Los rieles que giran infinitamente conducen, tarde o temprano, al futuro de la justicia! ¡Aparece el Escuadrón del Sushi Infinito, Kaitenger!\n\nEste archivo de voz es una declaración de guerra dirigida a la malvada organización conocida como “Benriya 68”. Aunque ustedes obstaculizaron nuestra legítima recaudación para construir un robot, nosotros ‘trasladamos’… ejem, no, “reubicamos” las limosnas de los cofres de donación de iglesias por todo Luxemburgo para completar el KAITEN FX Mk.0. Nuestro robot ya está terminado, y su malvada interferencia ha fracasado.\n\nAhora avanzaremos hacia la ciudad de Luxemburgo junto con el KAITEN FX Mk.0 para ejecutar la justicia. Un único objetivo: destruir la oficina de Benriya, que entorpeció nuestra recaudación legítima. ¡Tiembla ante el enorme robot, el poder abrumador y la justicia de los rieles infinitos! ¡Ja, ja!\n\nAh… ejem… oye, espera, Azul. Eso de reír ‘¡ja, ja!’ al final suena un poco a villano, ¿no? ¿Lo grabamos otra vez? ¿Qué? ¿Que solo quedaba un disco? No… en sentido común, debimos dejar algo de presupuesto…"
 HEU_event.214.a:0 "…¿¡Kaitenger ha vuelto?!"

 HEU_event.215.t:0 "Los rieles que giran infinitamente, tarde o temprano..."
 HEU_event.215.desc:0 "\"¡Aru-chan! ¡Es peligroso!\"\n\n¡BAM! Con la granada que lanzó Aru, el enorme KAITEN Mk.0 se hizo pedazos y se desplomó de lado. Mutsuki agarró a Aru —que había quedado debajo del robot al caer— y tiró de ella hacia atrás. El arma decisiva del Escuadrón del Sushi Infinito se apagó como chatarra, quedando a solo unos centímetros de los zapatos de Aru.\n\n\"Perdón… me acerqué demasiado para asegurarme de darle bien al explosivo.\"\n\"¡No hace falta que lo justifiques! ¿No te lastimaste? ¿El brazo? ¿El ojo está bien? ¿Ves bien al frente?!\"\n\"…Estoy bien, de verdad. No me pasó nada. Eso… ¿y Kaitenger?\"\n\nMientras Aru calmaba a Mutsuki, que estaba a punto de llorar, se vio a los miembros de Kaitenger salir arrastrándose del armazón destrozado, con sus trajes coloridos de sushi.\n\n\"Maldición… ya verán… la próxima vez, nos vengaremos…\"\n\n\"No habrá próxima vez.\"\n\nHaruka, que ya se había subido sobre el robot caído, apuntó con una escopeta.\n\n\"El crimen de casi herir otra vez a Aru-sama. Páguenlo con la muerte.\"\n\n\"¡Espera! Haruka. No hace falta matarlos.\"\n\nEn su lugar, Aru le lanzó a Haruka la bolsa de Mutsuki, llena de granadas.\n\n\"Mejor hagamos esto. Kaitenger: decidan. ¿Van a volar aquí mismo… o van a pagar con trabajo todo lo que han armado hasta ahora?\"\n\nKaitenger Rojo alternó la mirada entre la bolsa de granadas y Aru. Al final, al comprender que no había escapatoria, levantó ambas manos."
 HEU_event.215.a:0 "\"L-lo pagaremos… trabajando…\""

 HEU_event.216.t:0 "Propuesta de alianza de [FROM.GetName]" #연합국 가입 제안
 HEU_event.216.desc:0 "[FROM.GetName] nos ha comunicado que desea unirse a nuestra facción. A pesar de las diversas diferencias ideológicas entre ellos y nosotros, una alianza con [FROM.GetLeader] sin duda nos beneficiaría enormemente. Sin embargo, la decisión final depende de [ROOT.GetLeader], y aún existe la posibilidad de que esta alianza con [FROM.GetAdjective] no se concrete."
 HEU_event.216.a:0 "¡Construyamos una cooperación magnífica!"
 HEU_event.216.b:0 "No, no necesitamos a esa forajida de cuernos."

 HEU_event.217.t:0 "Propuesta de la Alianza del Benelux" #베네룩스 동맹 제안
 HEU_event.217.desc:0 "La propuesta de “Alianza del Benelux” de [FROM.GetName] ha sido entregada a [ROOT.GetLeader]. Con alegría, la líder de Luxemburgo, Rikuhachima Aru, no ha olvidado que, antes que kivotosiana, es luxemburguesa. Recalcó que los tres países del Benelux, como naciones de los Países Bajos, han sido tradicionalmente socios con una amistad profunda, y sostuvo que tras la Gran Transferencia debemos unir fuerzas en medio del caos.\n\nGracias a la amistad histórica entre los países del Benelux, el rechazo popular a esta alianza es muy bajo. Nuestros burócratas también afirman que esta alianza nos traerá grandes beneficios. Pero… ¿es realmente confiable como socia la líder “cornuda” de Luxemburgo? Al final, la decisión definitiva es de [ROOT.GetLeader]."
 HEU_event.217.a:0 "¡Construyamos una cooperación magnífica!"
 HEU_event.217.b:0 "La cooperación del Benelux no es más que un recuerdo del pasado."

 HEU_event.218.t:0 "Propuesta de adhesión al Komintern de [FROM.GetName]" #코민테른 가입 제안
 HEU_event.218.desc:0 "Muchos países han presentado solicitudes para unirse al Komintern (la Tercera Internacional), pero no existía precedente de que un país monárquico, y ni siquiera comunista, enviara con tanta seguridad un mensaje afirmando que quiere ser miembro. Nuestro diplomático Viacheslav Molotov se reunió en Moscú con Zénon Bernard, representante del Partido Comunista de Luxemburgo, para mantener conversaciones directas.\n\nAunque Luxemburgo es una monarquía, Bernard destacó que el Partido Comunista forma parte del gobierno de coalición como fuerza oficial, y presentó ventajas pragmáticas: Luxemburgo, que se está expandiendo con fuerza en el oeste de Alemania, podría obtener beneficios sustanciales cooperando con la Unión Soviética. Convertir toda Alemania en un país amigo, como sugiere Bernard, sería una gran ganancia para nosotros. Pero el punto clave es si el paranoico secretario Stalin permitirá el riesgo de aceptar a una monarquía como miembro pleno del Komintern."
 HEU_event.218.a:0 "\"Desde hoy, yo también soy monárquico.\""
 HEU_event.218.b:0 "\"No necesitamos una alianza gobernada por una aristócrata cornuda.\""

 HEU_event.219.t:0 "Propuesta de alianza de [FROM.GetName]" #아비도스 가입 제안
 HEU_event.219.desc:0 "[FROM.GetName], una fuerza emergente en Alemania, nos ha comunicado que desea unirse a nuestra facción. El ideal de Rikuhachima Aru, que enfatiza “un país donde kivotosianos y locales se reconcilian y conviven”, tiene aspectos claramente similares al ideal checo. [FROM.GetLeader] propuso que nuestra cooperación hará aún más activa la armonía entre ambos pueblos. Sin embargo, la decisión final recae en [ROOT.GetLeader], y sigue existiendo la posibilidad de que esta alianza con [FROM.GetAdjective] no se concrete."
 HEU_event.219.a:0 "¡Por la armonía de los dos pueblos!"
 HEU_event.219.b:0 "Sin esa forajida de cuernos, también podremos hacerlo."

 HEU_event.220.t:0 "Guerra entre Trinity y Gehenna"
 HEU_event.220.desc:0 "Ha estallado la guerra entre Trinity y Gehenna, y nosotros, conforme al contrato secreto firmado anteriormente, hemos entrado en la guerra. Esta guerra no decidirá solo el destino de Gehenna, sino también el de Benriya 68. Triunfar… o caer junto con Trinity.\n\nSolo nos queda esperar que hayamos terminado todos los preparativos posibles."
 HEU_event.220.a:0 "Por fin…"

 HEU_event.221.t:0 "Solicitud de apoyo de [FROM.GetName]"
 HEU_event.221.desc:0 "[FROM.GetName], que se prepara para la supuesta guerra por la 'unificación del pueblo germano', está pidiendo a la comunidad internacional que le brinde apoyo. Onikata Kayoko, representante diplomática de [FROM.GetName], nos ha contactado para convencernos de que esta guerra podría debilitar a dos amenazas potenciales como Trinity y Gehenna, y de que también podría ser una oportunidad para que [FROM.GetName] y [ROOT.GetName] mantengan una relación cercana en la posguerra."
 HEU_event.221.a:0 "Prometer el envío de voluntarios"
 HEU_event.221.b:0 "No prometer nada"

 HEU_event.222.t:0 "Apoyo de [FROM.GetName]"
 HEU_event.222.desc:0 "Parece que el 'Plan B' que presentó Onikata Kayoko ha funcionado, por suerte. [FROM.GetName] dice que podrá brindarnos apoyo de personal, incluidos voluntarios, para sostener nuestro esfuerzo bélico. Incluso sin una alianza con Trinity, no estamos solos y podremos continuar la guerra sin quedar aislados."
 HEU_event.222.a:0 "Qué alivio"

 HEU_event.223.t:0 "Negativa de apoyo de [FROM.GetName]"
 HEU_event.223.desc:0 "Por desgracia, [FROM.GetName] ha declarado que no tiene intención de ofrecernos ningún tipo de apoyo. Tendremos que librar esta guerra sin su ayuda."
 HEU_event.223.a:0 "Qué pena"

 HEU_event.224.t:0 "Plan defensivo de Gehenna"
 HEU_event.224.desc:0 "Rikuhachima Aru, líder de la Agencia 68, anda hablando de cosas como la supuesta 'reunificación del territorio germano'. Por ahora, no está claro si está siendo utilizada por el nacionalismo germano o si intenta usarlo ella. Pero lo importante es que existe la posibilidad de que la Agencia 68 y Trinity formen un frente conjunto y nos ataquen desde dos direcciones. Tal vez sea precipitado, pero debemos preparar una línea defensiva para estar listos para la guerra."
 HEU_event.224.a:0 "¡Prepárense a conciencia!"
 HEU_event.224.b:0 "¿Qué podría pasar?"

 HEU_event.225.t:0 "Comienza la Guerra de Liberación del Pueblo Germano"
 HEU_event.225.desc.a:0 "Aquel día, se distribuyeron dos versiones del comunicado de guerra: una para los soldados humanos y otra para las estudiantes de origen Kivotos. El comunicado para los soldados humanos decía que esta guerra era una 'guerra santa para unificar al fragmentado pueblo germano', mientras que el comunicado destinado a Kivotos—enviado también a Gehenna—afirmaba que era una guerra para 'tomar el control y estabilizar a Trinity y Gehenna, divididas y enfrentadas entre sí'.\n\nAmbos comunicados fueron escritos por Mutsuki y distribuidos por orden suya. Aru se enteró de que el ejército de Luxemburgo había comenzado a moverse una hora después de que los soldados cruzaran el frente. Es decir, después de que todo hubiera empezado.\n\n\"Mutsuki. ¿En qué estabas pensando?\"\n\nAnte la frase serena de Aru, Mutsuki se desplomó en el sofá.\n\n\"Los nacionalistas germanos al otro lado de la frontera ya acordaron unirse a nosotros. Si esta guerra sale bien, Aru-chan puede convertirse en una heroína.\"\n\"No te estoy preguntando eso. ¿Por qué demonios...?!\"\n\"Todo esto es por Aru-chan. ¿Todavía no lo entiendes?\"\n\nMutsuki se puso de pie de golpe.\n\n\"¡Me vale madres lo germano y me vale madres Gehenna! ¡Si tan solo ganamos esta guerra, todos los que despreciaban a Aru-chan la van a alzar como una heroína! Así que...\"\n\"¿Y usando a los demás como piezas de ajedrez, cómo se supone que yo me convierta en una heroína?\"\n\nAru golpeó el escritorio con el puño.\n\n\"¡Yo confié en ti! ¡Porque somos amigas! ¡Confié en que, al final, no lo llevarías hasta una guerra de verdad... confié en ti! ¿Y entonces, por qué...?!\"\n\n\"Entonces confía en mí una vez más.\"\n\nMutsuki se incorporó.\n\n\"Yo puedo convertirte en una heroína. Si ganamos esta guerra, Aru-chan ya no tendrá que sufrir. Así que, Aru-chan. Sonríe y anímame. ...Porque yo voy a salvarte.\""
 HEU_event.225.desc.b:0 "Aquel día, se distribuyeron dos versiones del comunicado de guerra: una para los soldados humanos y otra para las estudiantes de origen Kivotos. El comunicado para los soldados humanos decía que esta guerra era una 'guerra santa para unificar al fragmentado pueblo germano', mientras que el comunicado destinado a Kivotos—enviado también a Gehenna—afirmaba que era una guerra para 'tomar el control y estabilizar a Trinity y Gehenna, divididas y enfrentadas entre sí'.\n\nAmbos comunicados fueron escritos por Mutsuki y distribuidos por orden suya. Aru se enteró de que el ejército de Luxemburgo había comenzado a moverse varias horas después, cuando la propia Mutsuki le explicó toda la situación.\n\n\"No espero que Aru-chan lo entienda. Pero no lo hago porque esté loca. Todo esto es, únicamente...\"\n\"Sí. Vas a decir que es por mí.\"\n\nAru, sentada en el sofá, miró a Mutsuki, que la observaba como si fuera una criminal. La carcelera era Mutsuki, la encarcelada era Aru, pero desde que la encerró, Mutsuki no había logrado ponerse ni una sola vez por encima de Aru en lo mental. Todo lo que hacía era para convertir a Aru en una heroína, y para eso... Aru tenía que colaborar con esta obra estúpida.\n\nAru sabía que Mutsuki no hacía esto por ser una villana ni por estar loca. Ella simplemente... se movía solo por un deseo tan ingenuo como puro: ayudar a Aru. Incluso si Aru no lo quería. Aru soltó una risa amarga y se dejó caer contra el respaldo del sofá.\n\n\"Vete.\"\n\"Pero, Aru-chan...\"\n\"¿De verdad creíste que yo iba a aceptar feliz ser una heroína a costa de que otros mueran? Anda. Sigue con tu obra divertida. Sigue con tu fiesta. ...Sé perfectamente que estás haciendo todo esto 'por mí'. Pero yo no voy a sonreír por ti.\""
 HEU_event.225.a:0 "Cuando Mutsuki se fue, Aru se quedó llorando por un buen rato."


 HEU_event.226.t:0 "Negociaciones de unificación germánica con [FROM.GetName]"
 HEU_event.226.desc.a:0 "Impulsados por su anhelo de unificar al pueblo germánico dividido, nos sentamos a la mesa de negociaciones con [FROM.GetName]. Las fuerzas de derecha locales de Luxemburgo, incluido el Partido de la Derecha, subrayaron que, aunque su líder sea de origen kivotosiano, aún permanece un parlamento sostenido por la humanidad. El primer ministro luxemburgués Joseph Bech recalcó que estas negociaciones no significan que “Luxemburgo anexe a Deutschland”, sino que el “pueblo germánico”, fragmentado y sumido en el caos, “vuelva a unirse como uno solo”. Si aceptamos su propuesta, estaremos con ellos, pero nuestra independencia se vendrá abajo. Y si rechazamos su propuesta... esto conducirá a una expansión de la guerra." #comunista
 HEU_event.226.desc.b:0 "Impulsados por su anhelo de unificar al pueblo germánico dividido, nos sentamos a la mesa de negociaciones con [FROM.GetName]. Dado que la Revolución del 68 y quienes la lideran son de origen kivotosiano, es evidente que eso de la “unificación del pueblo germánico” que proclaman no es más que propaganda destinada a apaciguar a los locales enfurecidos por la revolución radical. Sin embargo, mientras libramos una guerra para liberar a Deutschland, debemos valorar si realmente tenemos margen para sumar un enemigo más." #fascista
 HEU_event.226.a:0 "Convertirnos en parte de [FROM.GetName]"
 HEU_event.226.b:0 "¡Nuestra respuesta... es la guerra!"

 HEU_event.227.t:0 "Unidos, más fuertes"
 HEU_event.227.desc:0 "Con buen juicio, [FROM.GetName] ha decidido aceptar nuestra propuesta. En lugar de sentir la amenaza de abrir un nuevo frente, parece haber concluido que el plan de unificación del pueblo germánico bajo el liderazgo de [ROOT.GetName] es una opción más “segura”. Hemos incorporado a su ejército de forma pacífica."
 HEU_event.227.a:0 "¡Excelente!"

 HEU_event.228.t:0 "No sale como esperaba"
 HEU_event.228.desc:0 "Para nuestra sorpresa, [FROM.GetName] prefirió la guerra antes que ser anexado como parte de nosotros. Consideraron que la “unificación del pueblo germánico” llevada a cabo por la líder de origen kivotosiano, Aru, no es distinta del dominio ejercido por Gehenna y Trinity. En cualquier caso, parece que tendremos que someter a [FROM.GetName] por la fuerza."
 HEU_event.228.a:0 "¿Por qué mi plan siempre termina así?"

 HEU_event.229.t:0 "El día de la victoria gloriosa"
 HEU_event.229.desc.a:0 "El espacio que antaño había sido la oficina del presidente del Manmajeon se había convertido en una sala de fiestas, y en todas las mesas se servían diversos platos de alta cocina. Sentada en el lugar de honor, Aru sintió cómo su corazón latía con fuerza mientras miraba a su alrededor. Estudiantes de Gehenna, exaltados por la alegría de la victoria, y oficiales del ducado recorrían el salón entre risas y alboroto. Una fiesta celebrada tras la ocupación del distrito central de Gehenna. Era un día para alegrarse, pero Aru no pudo soportar la extraña sensación que emanaba de aquella escena.\n\nA su lado, Mutsuki, vestida con uniforme, alzó en alto una copa de vino.\n\n\"¡Hoy es el día en que, bajo la dirección de nuestra gran líder, *Rikuhachima Aru*, hemos obtenido una gloriosa victoria contra la decadente cúpula de Gehenna! ¡Nuestra patria ha destruido el régimen pseudo-Manmajeon de Gehenna y ha tomado el corazón del oeste de Deutschland, y esta gloria ha sido posible únicamente gracias al liderazgo de nuestra líder...!\"\n\nLe dio náuseas.\n\nTenía el rostro de su amiga de la infancia, exactamente el mismo que cuando se conocieron por primera vez como amigas. Sin embargo, *aquello*, que se parecía demasiado a Asagi Mutsuki, estaba pronunciando palabras que Aru no podía comprender. No entendía qué demonios estaba diciendo esa criatura que se parecía a Mutsuki.\n\n¡Clap, clap, clap! Cada vez que *aquello* que se parecía a Mutsuki gritaba con la copa en alto, los aplausos frenéticos de los soldados y de los estudiantes del \"Aru-faction\" se volvían cada vez más intensos. Ajajaja. Un forajido hardboiled diría que una victoria así era lo más natural del mundo. Eso parecía haber dicho. ¿O acaso lo había dicho ella misma? Aru se levantó. Aquello que se parecía a Mutsuki agarró su muñeca. Dijo algo. No pudo oírlo. Tenía miedo, estaba aterrada. Aru pateó a esa cosa con el rostro de su amiga y salió corriendo hacia el pasillo.\n\n\"Sigues siendo una niña. Para proteger lo que es importante para ti, debes convertirte en adulta.\"\n\nLas malditas palabras del médico resonaban una y otra vez en sus oídos. ¿Qué es ser un <adulto>? ¿Cómo se supone que uno puede convertirse en eso? Aru corrió por el pasillo que parecía no tener fin.\n\nEn el pasillo se percibía un olor familiar a sangre. Allí estaban los cadáveres de los sirvientes del Palacio Ducal que había visto el día de la Gran Transición, cuerpos que no deberían estar allí.\n\nComo si huyera, Aru pateó la puerta de la habitación más cercana. El dormitorio del Manmajeon. Allí estaba Mutsuki, sosteniendo una pistola. No. Detente. Mientras Aru extendía la mano desesperadamente, Mutsuki apretó el gatillo una y otra vez. Bang, bang, bang, bang. Con el sonido de los disparos, el cuerpo de la Gran Duquesa Charlotte, que sostenía a una pequeña niña en brazos, se hizo añicos. La cabeza de la niña voló, y su cerebro y su sangre empaparon el rostro de Aru.\n\n\"¿Aru... señora?\"\n\nHaruka, que había corrido tras ella, agarró con fuerza la punta de sus dedos. Cuando Aru volvió en sí, no había nada en el dormitorio. Pero, frente a ese dormitorio vacío, Aru cayó de rodillas y rompió a llorar desconsoladamente." #공산
 HEU_event.229.desc.b:0 "El espacio que antaño había sido la oficina del presidente del Manmajeon se había convertido en una sala de fiestas, y en todas las mesas se servían diversos platos de alta cocina. Aru, que había estado confinada por Mutsuki, aunque escoltada por soldados (bajo el pretexto de protección), pisó por primera vez el salón de la fiesta. Estudiantes de Gehenna, exaltados por la alegría de la victoria, y oficiales del ducado recorrían el salón entre risas y alboroto. Una fiesta celebrada tras la ocupación del distrito central de Gehenna.\n\nAru se sentó junto a Haruka. Las mejillas de Haruka estaban enrojecidas, y, con las manos temblorosas, apenas podía mirar a Aru a los ojos.\n\n\"Señora Aru... si se queda en un lugar como este en lugar del asiento de honor...\"\n\"No estoy tan loca como para disfrutar esta fiesta. FUCK la regencia de Rikuhachima.\"\n\nAru tomó la copa de vino y dio un sorbo. ¿Qué es ser adulto? ¿Acaso un adulto es alguien que se alegra usando la diversión ajena como entretenimiento? Ja. Si es así, esos imbéciles que incendiaron Luxemburgo ya eran adultos en 1935. Asagi Mutsuki nunca llegó a ser adulta. Ni entonces, ni ahora.\n\nMientras Mutsuki proclamaba ruidosamente la victoria, Aru siguió bebiendo, mirando al asiento frente a ella. Extrañamente, en el lugar donde no había nadie sentada, apareció la figura de una mujer. La Gran Duquesa Charlotte, con agujeros en el abdomen, el pecho y el cuello, la miraba fijamente.\n\nCharlotte habló:\n\"Parece que usted tampoco ha logrado convertirse en adulta, señorita Rikuhachima. ¿No es así? No se resiste a ellos; simplemente baja la cabeza y se limita a evadirlos.\"\n\"...Sí. Pero, ¿cómo se supone que debo resistir esta locura? Creo que usted lo sabría. Es más inteligente que yo. Luchó con mucha más valentía que yo.\"\n\"...Transmita el mensaje. Así como yo no intenté escapar sola del Palacio Ducal y protegí a mi familia, usted debe mantener firmemente su trono y no *huir*.\"\n\n¿Qué significa no huir? ¿Qué significa mantenerse en su lugar? Aru reflexionó un momento y esbozó una sonrisa amarga. Al fin y al cabo, ella no era la verdadera Charlotte. No era más que una ilusión creada por su propia culpa.\n\n\"¿Aru... señora?\"\n\nHaruka apretó con fuerza la punta de sus dedos. Frente a Aru, no había nadie." #공산
 HEU_event.229.a:0 "Deberíamos celebrar una victoria tan magnífica, ¿no?"
 HEU_event.230.t:0 "Sobre las ruinas de Trinity"
 HEU_event.230.desc.a:0 "Mutsuki sacó el borrador final de la Ley de Unión que sería promulgada en el futuro. Gehenna, Trinity y Luxemburgo quedarían integrados bajo la bandera de Rikuhachima Aru. Y Luxemburgo, como Estado representativo del pueblo germánico, se convertiría en el país líder de la Confederación de Ducados, guiando a los innumerables principados que fragmentaban todo Deutschland. La Ley de Unión culminaría con Aru participando en la ceremonia de victoria que conmemoraba el triunfo en la guerra, elevando por sí misma al Ducado de Luxemburgo al rango de Reino.\n\n\"Con esto... Aru-chan se convertirá en una verdadera heroína. Nadie podrá volver a despreciarla... así que... no estoy equivocada. No hice nada mal. Aru-chan lo dirá.\"\n\nRecordando el día de la ceremonia de victoria en Gehenna, Mutsuki, con las manos temblorosas, sostuvo los documentos de la Ley de Unión y entró en la oficina de Aru. La oficina de la Agencia 68 en el Palacio Ducal, iluminada por la cálida luz del sol. Sobre el escritorio de aquel lugar vacío, solo quedaba una carta." #공산
 HEU_event.230.desc.b:0 "Mutsuki sacó el borrador final de la Ley de Unión que sería promulgada en el futuro. Gehenna, Trinity y Luxemburgo quedarían integrados bajo la bandera de Rikuhachima Aru. Y Luxemburgo, como Estado representativo del pueblo germánico, se convertiría en el país líder de la Confederación de Ducados, guiando a los innumerables principados que fragmentaban todo Deutschland. La Ley de Unión culminaría con Aru participando en la ceremonia de victoria que conmemoraba el triunfo en la guerra, elevando por sí misma al Ducado de Luxemburgo al rango de Reino.\n\n\"Con esto... Aru-chan se convertirá en una verdadera heroína. Nadie podrá volver a despreciarla... así que... no estoy equivocada. No hice nada mal. Aru-chan lo dirá.\"\n\nRecordando el día de la ceremonia de victoria en Gehenna, Mutsuki, junto con Haruka, sostuvo con manos temblorosas los documentos de la Ley de Unión y entró en la casa segura donde Aru estaba confinada. De forma inquietante, en la entrada de la casa había caído una pequeña carta." #파시
 HEU_event.230.a:0 "...¿Una carta?"

 HEU_event.231.t:0 "La carta de Rikuhachima Aru"
 HEU_event.231.desc.a:0 "Cuando intenté participar por primera vez en el gobierno de coalición de Luxemburgo, un ruidoso médico local me dio este consejo. Para proteger a las personas que amas, primero debes convertirte en adulta. ¿Era algo así? La verdad es que, después de tantos años, ya no recuerdo las palabras exactas. Pero seguro que era algo parecido.\n\nNunca supe qué era eso que él llamaba <adulto>. ¿Acaso basta con envejecer para convertirse en adulto? ¿Qué es ser <adulto>? Lo pensé durante mucho tiempo, y seguí pensándolo incluso después de que estallara la guerra.\n\nComo directora de la Agencia 68, como Rikuhachima Aru, que debe proteger a sus empleados, llegué a una conclusión: un adulto es alguien que asume responsabilidad. ¿Conoces ese dicho? \"La razón por la que un superior gana más salario que un subordinado es porque debe protegerlo cuando comete errores.\" ...Lo escuché en alguna empresa cuando estaba en Kivotos. Me pareció una frase genial, así que la recordé. ¿No es admirable?\n\nAsí que esta es la decisión que toma Rikuhachima Aru como <adulta>.\n\nMutsuki ensució sus propias manos para salvarme. Falsificó documentos, provocó una guerra, hizo que la gente muriera. Y Kayoko, por mi culpa, rompió su amistad con Mutsuki. No puedes imaginar lo doloroso que era para ella escucharte llamar a Mutsuki \"señorita Asagi\". Y Haruka está llorando por mi culpa, sufriendo por mi culpa.\n\nNo soy una Sensei. No puedo responsabilizarme de todos los estudiantes de Gehenna o Trinity. Pero al menos, soy la \"directora\" de ustedes, de la Agencia 68. Por eso creo que proteger a ustedes tres es mi deber.\n\nTodos los problemas ocurrieron porque existía Rikuhachima Aru. Si Rikuhachima Aru no hubiera existido desde el principio, Mutsuki no habría ensuciado sus manos. Kayoko no habría odiado a Mutsuki. Haruka no habría sufrido heridas en su corazón. Si desaparece una sola persona, llegará el final feliz para todos. Así que... esto no es más que algo que debí haber hecho hace mucho tiempo.\n\nEl cargo de regente de Luxemburgo se lo dejaré a Haruka. No tengas miedo. Mutsuki y Kayoko estarán a su lado. Y el puesto de directora de la Agencia se lo dejaré a Mutsuki. Cuida de Kayoko, por favor. Es \"jefa Kayoko\". ¡¡¡Está estrictamente prohibido llamarla \"señora Onikata\"!!! ¡¡¡Asegúrate de obedecer!!!\n\nPor último, me gustó el tiempo que pasé con ustedes desde Kivotos.\nTambién me gustó poder estar con ustedes en este mundo.\nMutsuki, Kayoko, Haruka. Los amé a todas.\n\nAsí que, por favor, no olviden mi última carta de amor, mi último saludo. Comprendan mi despedida. Gracias. Y adiós para siempre." #공산
 HEU_event.231.desc.b:0 "Cuando estés leyendo esta carta, todo ya habrá terminado. Respira hondo, toma aire fresco a través de la puerta abierta y luego lee esta carta con calma. Es la petición de tu preciada amiga, Rikuhachima Aru.\n\nDisobedience is the true foundation of liberty. The obedient must be slaves. La desobediencia es la verdadera libertad. Solo los esclavos obedecen. Vamos, ¿no te parece una frase increíble? Es de Henry David Thoreau. Cuando pienso que la resistencia es libertad, ¿no te recuerda al espíritu que perseguía cierto idiota hardboiled?\n\nVine a esta tierra para resistir. Lo que quería hacer, lo que buscaba, era la felicidad de muchas personas. Quizá desde ese momento el viejo concepto de \"hardboiled\" ya se había roto. Pero tú me encerraste otra vez dentro del concepto de forajida hardboiled. Dentro de una pequeña bola de nieve, con el título de \"heroína nacional que reunificó a los germanos\", haciendo que los locales que despreciaban a Rikuhachima Aru me veneraran.\n\nPero yo no quiero eso.\n\nSi solo puedo convertirme en heroína a través de la muerte y tragedia de otros, si con eso Rikuhachima Aru puede convertirse en la próxima Napoleón, entonces rechazaré a esa Rikuhachima heroína, a esa Rikuhachima hardboiled.\n\nNo quiero regañarte. Sé que todo esto ocurrió por mí. Que no haber percibido tu ira y tus sentimientos, Mutsuki, fue completamente mi culpa. Por eso, como directora de la Agencia 68, tomaré una decisión. No quiero que la Agencia 68 se derrumbe así y que ustedes se enfrenten entre sí. Y tampoco quiero ver que, en mi nombre, dañes a otras personas.\n\nSi desaparece una sola persona, llegará el final feliz para todos. Así que... esto no es más que algo que debí haber hecho hace mucho tiempo.\n\nEl cargo de regente de Luxemburgo se lo dejaré a Haruka. No tengas miedo. Mutsuki y Kayoko estarán a su lado. Y el puesto de directora de la Agencia se lo dejaré a Mutsuki.\n\nPor último, me gustó el tiempo que pasé con ustedes desde Kivotos.\nTambién me gustó poder estar con ustedes en este mundo.\nMutsuki, Kayoko, Haruka. Los amé a todas.\n\nAsí que, por favor, no olviden mi última carta de amor, mi último saludo. Comprendan mi despedida. Gracias. Y adiós para siempre." #파시
 HEU_event.231.a:0 "\"...¿Aru........chan?\""

 HEU_event.232.t:0 "La última despedida de Rikuhachima Aru"
 HEU_event.232.desc.a:0 "En el momento en que Mutsuki rompió la puerta fuertemente cerrada del departamento de Aru, las tres integrantes de la Agencia 68 pudieron ver a Aru recostada en el sofá, con los ojos cerrados. Sobre la mesa frente al sofá había una taza de café negro a medio beber y un frasco de cianuro de potasio con la tapa abierta.\n\nIncluso en este mundo donde el poder místico se había debilitado, los habitantes de Kivotos no mueren fácilmente por una sola bala. Por eso, el método que Aru eligió fue la intoxicación. Era imposible imaginar cuánta cantidad de veneno había disuelto en el café.\n\nAru iba a morir. ¿Por qué? Para unir a la Agencia 68 en un solo cuerpo. Aru dijo que esa era la elección de un <adulto>. Pero era imposible entenderlo. Imposible aceptarlo. Kayoko apretó los dientes. \"¿Qué demonios es eso de ser adulto? ¡...Directora!\"\n\nLas manos de Mutsuki temblaban. \"No... yo... este, este final... no... no lo quiero...\"\n\nMientras Mutsuki y Kayoko bajaban la cabeza en la desesperación, Haruka dio un paso al frente. Tomó la muñeca de Aru con fuerza. \"...Está viva.\"\n\n\"...¿Qué?\"\n\n\"Señora Aru... ¡todavía está viva! ¡Rápido! ¡Un médico!\"\nKayoko dijo débilmente: \"El cianuro de potasio es un veneno que puede matar a una persona con una sola cápsula pequeña... Aunque llamemos a un médico ahora...\"\n\n¡Slap! Por un instante, la vista de Kayoko se volvió blanca. ¿Le habían dado una bofetada? ¿Quién? Kayoko, atónita, miró los ojos de Haruka frente a ella. Ojos salvajes que nunca había visto antes.\n\n\"¡Cállate y llama a un médico!!!!!\"" #공산
 HEU_event.232.desc.b:0 "En el momento en que Mutsuki rompió la puerta del dormitorio, sintió un ligero mareo y cayó al suelo. Aru estaba recostada en la cama, con los ojos cerrados como si durmiera. Sobre la mesa junto a la cama había una taza de café negro a medio beber y un frasco de cianuro de potasio con la tapa abierta.\n\nIncluso en este mundo donde el poder místico se había debilitado, los habitantes de Kivotos no mueren fácilmente por una sola bala. Por eso, el método que Aru eligió fue la intoxicación. No se sabía cómo había conseguido el cianuro de potasio. No. En realidad, podía imaginarse la ruta. Las vigilantes que custodiaban a Aru en ese lugar. Ellas la habían traicionado.\n\nNo sintió ira. Solo sus manos temblaban, tenía miedo, y el hecho de que Aru estuviera desapareciendo era demasiado, demasiado...\n\n\"Jefa Mutsuki.\"\n\nYo... a Aru...\n\n¡Jefa! ¡Jefa...! ¡Jefa!!!!\n\n¡Slap-! Mutsuki parpadeó ante la sensación brutal de un golpe en su mejilla. Haruka, llorando desconsoladamente, la había agarrado del cuello de la ropa y la estaba levantando.\n\n\"¡Tenemos que llamar a un médico!!!!!\"" #파시
 HEU_event.232.a:0 "Kayoko asintió con la mirada perdida."
 HEU_event.232.b:0 "Mutsuki asintió con la mirada perdida."

 HEU_event.233.t:0 "La aventura de la casa vacía - Fase 1"
 HEU_event.233.desc:0 "\"¡Te dije que te convirtieras en adulta, no que jugaras a ser Jesucristo! ¿Cargar con todos los pecados de la Agencia y suicidarte? ¡Qué mujer tan estúpida...!\"\n\nMientras corría junto a Aru, que era trasladada a la sala de emergencias, Charles Marx se puso apresuradamente los guantes médicos. El hospital, donde se mezclaban médicos militares de Luxemburgo, el Departamento de Medicina de Emergencia de Gehenna y la Orden de Caballeros de Socorro de Trinity, era un caos comparable al momento posterior al Big Bang.\n\nEntre ellos, aunque su conocimiento médico estaba cien años atrasado, Marx, el médico con más experiencia, asumió el mando.\n\n\"Identidad del paciente: Rikuhachima Aru. Intento de suicidio por ingestión de cianuro de potasio disuelto en café. ¿Podemos investigar cuánta cantidad consumió primero?\"\n\nSerina Sumi, antigua prisionera de Trinity, habló apresuradamente: \"Si calculamos a partir de la cantidad restante en el frasco, sería aproximadamente como un terrón de azúcar.\"\n\nMarx abrió la historia clínica. \"¿4000 mg? Eso significaría que ingirió *veinte veces* la dosis letal. Pero no seamos tan pesimistas. Aunque hubiera echado una cantidad equivalente a un terrón de azúcar, se habría disuelto en el café caliente... y como perdió la conciencia antes de terminar de beberlo, la cantidad real ingerida sería menor.\"\n\nSerina mordió ligeramente su labio inferior. \"Aun así, superará la dosis letal. ¿1000 mg?\"\n\n\"Sí. Al menos varias veces la dosis letal. Pero debemos intentar todo lo posible, ¿no?\""
 HEU_event.233.a:0 "\"Sí. Primero debemos colocarle un respirador de oxígeno.\""

 HEU_event.234.t:0 "La aventura de la casa vacía - Fase 2"
 HEU_event.234.desc:0 "Aru seguía con vida. El problema era que su respiración se estaba debilitando cada vez más. Era evidente que Aru estaba muriendo. En pacientes con cianuro de potasio, la respiración artificial es imposible, por lo que el uso de respiradores de oxígeno es esencial. El problema era que Marx nunca había visto ni tocado un *respirador de oxígeno* en su vida.\n\nMientras estudiantes del Departamento de Emergencias y de la Orden de Socorro, mucho más jóvenes que él, conectaban el respirador mecánico a Aru, Marx sintió una leve sensación de inutilidad ante sus propias capacidades. Se había convertido en médico para salvar personas, ¿y ahora debía limitarse a observar a una paciente que se estaba muriendo?\n\nMarx dijo: \"Según lo que aprendí en la facultad de medicina, el cianuro de potasio se trata con inyecciones de nitrito de sodio...\"\n\nSerina respondió: \"Nosotros también. Le administraremos el medicamento.\"\n\nRikuhachima Aru. El <adulto> que tú imaginas y el <adulto> que yo imagino son claramente distintos. Pero no puedo aceptar que beber veneno para expiar los pecados de otros sea ser <adulto>.\n\nNo es porque sea ateo o materialista. Es que no me gusta la idea de asumir responsabilidad mediante la muerte. Asume la responsabilidad viviendo. No eres un samurái que se hace seppuku... ¡!\n\n\"...¡Paro cardíaco del paciente!\"\n\"¡Je, jefe Mine!\"\n\"¡Iniciamos RCP!\""
 HEU_event.234.a:0 "Marx sintió un mareo."

 HEU_event.235.t:0 "La aventura de la casa vacía - Fase 3"
 HEU_event.235.desc:0 "\"¡Jejeje! ¡Para una forajida, esto es pan comido!\"\n\nObservando a los criminales del mercado negro huir, Aru reajustó su rifle de francotirador Wine Red Admire con una expresión radiante. El cielo de Kivotos parecía más azul que nunca, y el trabajo de la Agencia 68 avanzaba con una fluidez inusual. ¿Había habido últimamente un día tan agradable como este?\n\n\"¡Señora Aru! ¡Mire esto! ¡La recompensa es enorme...!\"\n\nHaruka, con una expresión feliz, le tendió a Aru un grueso fajo de yenes. ¿No es casi del grosor de un lingote de oro?! Con este dinero, podrían pagar el alquiler atrasado... y también invitar ramen a los empleados que no habían podido comer adecuadamente.\n\nPero algo era extraño. La misión se había completado perfectamente. Haruka, Kayoko y Mutsuki sonreían felices en un día tan alegre. Sin embargo, por alguna razón, Aru no se sentía feliz en absoluto.\n\nNo.\n\nAru se llevó la mano a la mejilla. ¿Por qué estaba triste? ¿Por qué le caían lágrimas?\n\n\"¿Señora Aru? ¿Acaso... porque estoy a su lado... y le estoy robando el aire...? Si es así... en ese caso... ¡me disculparé con la muerte...!\"\n\nAru miró su Wine Red Admire. Este rifle. ¿Cuántos *años* habían pasado desde la última vez que lo usó?\n\n\"Oye, Haruka.\"\n\n\"¡Ah, sí! ¡Señora Aru!\"\n\nAru finalmente logró identificar la fuente de su extraña sensación.\n\n\"...Yo morí en Luxemburgo... ¿entonces por qué estoy aquí en Kivotos con ustedes?\""
 HEU_event.235.a:0 "En el momento en que dijo esas palabras, las sonrisas de las tres desaparecieron."

 HEU_event.236.t:0 "La aventura de la casa vacía - Fase 4"
 HEU_event.236.desc:0 "\"Aru-chan. Decir 'me morí' omite demasiadas cosas.\"\n\nMutsuki vació el cargador contra el pecho de Aru. Las balas le llegaron sin darle tiempo a esquivar, y Aru salió despedida contra el suelo. Con esa sonrisa de diablilla que Aru había visto en Kivotos, Mutsuki le pisoteó el pecho con fuerza, como si quisiera triturarlo.\n\n\"¿Fue suicidio, no? ¿Y eso lo vas a cerrar con un simple 'me morí'? Aja, ja, ja.\" \n\n\"¡Mutsuki...!\"\n\nBum. Bum. Bum. Bum.\n\nLe dolía tanto que sentía que el pecho se le iba a partir. Quiso inhalar, pero esta vez Kayoko se arrodilló y le aplastó el cuello con el peso de su rodilla.\n\n\"¿Creíste que esto era un final bonito con una tacita de café y ya? No. La jefa tampoco se lo creyó. Lo que nos dejas es tu culpa. La culpa de saber que nosotras, las que nos quedamos, vamos a cargar toda la vida con la herida de tu suicidio.\"\n\nY entonces, Haruka apuntó con una escopeta directo a la cara de Aru.\n\n\"Este es el final que tú escribiste. Rikuhachima.\" \n\n\"Yo... quería ser un <adulto>. Pero lo único que pude hacer fue esto...\"\n\nHaruka habló. \"La que quería ser adulta eras tú. No nosotras. Tú dijiste que esto era 'asumir la responsabilidad' como un <adulto>. Oye, Rikuhachima. ¿De verdad creíste que, después de que murieras, yo iba a ir a la agencia como si nada, sonriendo, y que en la oficina vacía donde ya no estuvieras, podría vivir feliz charlando con las otras dos?\"\n\n\"Yo... sí. Sabía que no sería posible. ...Que 'hacerme responsable' como <adulto> terminara siendo suicidarme... fue solo... porque ya no podía más. Porque me dolía demasiado aguantar. Solo puse una excusa. Desde la Gran Transición, no he sido feliz ni una sola vez. Todavía huelo la sangre de los muertos... todavía oigo las voces de quienes me odiaban... las voces de Mutsuki y Kayoko discutiendo por mi culpa me retumban en el oído... y por eso... huí. Amparándome en el pretexto de ser 'alguien responsable'.\""
 HEU_event.236.a:0 "Esto no era <hacerse responsable>."

 HEU_event.237.t:0 "La aventura de la casa vacía - Fase 5"
 HEU_event.237.desc:0 "\"Eso era lo que estaba esperando que dijeras.\"\n\nHaruka arrojó la escopeta. Mutsuki y Kayoko también se apartaron un paso, dejándole espacio. Cuando Aru se incorporó con dificultad, Haruka volvió a hablar.\n\n\"Ve y discúlpate. No con la Haruka que existe solo en tu imaginación: con la Haruka real. Discúlpate con la Mutsuki real. Y con la Kayoko real.\"\n\n\"...¿Disculparme? Je. Ojalá pudiera. ¿Pero no estoy ya muerta?\"\n\"No. Aún no estás muerta. ...Un forajido hardboiled no va a morirse tan fácil, ¿no?\"\n\n\"¡El corazón vuelve a latir!\"\n\"¡Por favor...! ¡Por favor!\"\n\nEntre el ir y venir de los médicos, Aru inhaló despacio… y exhaló."
 HEU_event.237.a:0 "Sueño dentro de un sueño"

 HEU_event.238.t:0 "La aventura de la casa vacía"
 HEU_event.238.desc:0 "Ya habían pasado varias horas desde que Aru entró a urgencias. Justo cuando empezaba a propagarse entre las empleadas una sensación siniestra de que quizá había ocurrido lo peor, la puerta de urgencias se abrió y Charles Marx salió caminando.\n\n\"¡Doctor!\" \"¡Doctor!\" \"¡Usted!\"\n\nLas tres de la Agencia 68 se le fueron encima a Marx. Él se quitó los guantes médicos de un tirón, los apretó en el puño y, con voz agotada, dijo:\n\n\"Vaya. Nunca pensé que llegaría el día en que, después de graduarme de medicina, tres mujeres se me colgaran de la cara.\" \n\nKayoko preguntó: \"¿Qué pasó con la jefa?\"\n\n\"La salvé.\"\n\n\"¿La… salvaste…?\"\n\"Sí. A esa maldita aristócrata cornuda. Es la primera vez en mi vida que salvo a alguien que se tragó varias veces la dosis letal de veneno para suicidarse. Ojalá sea el último paciente así que me toque. ...Aún está medio aturdida, pero en unas horas estará bien. Y ya luego ustedes deciden si la golpean o la matan, lo que quieran, eso lo ven después.\" \n\nComo marxista-leninista a rajatabla, quizá salvar la vida de una noble feudal no sea lo correcto. Pero si a cambio podía ver a tres chicas abrazarse y llorar, tal vez… esta pequeña desviación también valía la pena."
 HEU_event.238.a:0 "El camarada Stalin hoy también me perdonará. Probablemente."

 HEU_event.239.t:0 "En la habitación del hospital"
 HEU_event.239.desc:0 "Ehh… bueno. Soy la jefa Aru, la que dejó un testamento “bien cool” y se tomó un shot de cianuro… y aun así no se murió. Sí. Lo… lo siento… ¿supongo? Ah… ¡Ay! ¡Mutsuki! ¡No me pegues en la cabeza! ¡Ay! ¡Ayaa! …Sí, de verdad sobreviví. Sí. No soy un fantasma.\n\nOye, Haruka, ya no llores. Está bien. Te digo que no soy un espíritu, ¿sí? Ya. ¡Ya no me voy a morir! No me voy a morir, así que tranquila. No me voy a ningún lado.\n\nY Mutsuki… ¡ay! Ya entendí. Perdón por haber elegido algo tan idiota como suicidarme. …No te voy a pedir que me perdones. No es algo que se pueda perdonar. Si de verdad me hubiera muerto, pues… sí.\n\nYo creí que con esto podría devolverlas a la *normalidad*. …Sí. Kayoko tenía razón: que sin mí, la Agencia 68 nunca podría volver a la *normalidad*. En ese momento no me di cuenta.\n\n…¿Secuelas? Que se me cargó un montón de toxicidad al hígado y voy a tener que hacerme chequeos de cáncer de hígado de por vida, más o menos. Jajaja. Si eres una forajida, esto es… ¡Ayaa! Perdón, Mutsuki-chan. ¡N-no me jales los cuernos! ¡Ugaah! ¡El cuello! ¡El cuello!"
 HEU_event.239.desc.mutsuki:0 "Ehh… bueno. Soy la jefa Aru, la que dejó un testamento “bien cool” y se tomó un shot de cianuro… y aun así no se murió. Sí. Lo… lo siento… ¿supongo? Ah… ¡Ay! ¡Haruka! ¡No me pegues en la cabeza! ¡Ay! ¡Ayaa! …Sí, de verdad sobreviví. Sí. No soy un fantasma.\n\nA ver, sí… hablé del snowglobe y me lancé a morir con toda la dignidad, pero… la verdad me dio miedo. Pero… ya no me voy a ningún lado. Solo… quería enojarme con Mutsuki. Quería decirte que yo no soy alguien a quien tú puedas manipular.\n\n…¿Secuelas? Que se me cargó un montón de toxicidad al hígado y voy a tener que hacerme chequeos de cáncer de hígado de por vida, más o menos. Jajaja. Si eres una forajida, esto es… ¡Ayaa! Perdón, Kayoko-chan. ¡N-no me jales los cuernos! ¡Ugaah! ¡El cuello! ¡El cuello!"
 HEU_event.239.a:0 "Regreso a la normalidad"
 HEU_event.239.b:0 "Regreso al futuro"

 HEU_event.240.t:0 "Declaración de la Ley de Unión"
 HEU_event.240.desc.a:0 "Cuando Aru subió al podio de Edén apoyándose en su bastón, estalló un aplauso entre la multitud reunida bajo el estrado. Aru imaginó cuánta de esa gente habría sido movilizada por el gobierno para estar allí. Bueno… decidió dejar por ahora esos dolores de cabeza políticos.\n\n\"Hola. Vi que circuló el reporte de que estuve hospitalizada unos días por *neumonía* después de que terminó la guerra. Gracias a quienes se preocuparon por mi salud. Ya estoy bien.\" \n\nAru miró de reojo el borrador de la declaración de la Ley de Unión que Mutsuki había dejado en su escritorio: una carta repleta de frases vanguardistas y agitadoras, como si fuera Mussolini anunciando una victoria. …No quería leer eso. Y la Mutsuki de ahora ni siquiera se lo pediría. Aru dejó el discurso a un lado.\n\n\"Trinity y Gehenna, dos academias que han vivido en conflicto, se han unificado en una sola. Y la tierra del pueblo germano, despedazada en fragmentos, por fin se ha convertido en una. Conforme a la Ley de Unión, muchos ducados y pequeños estados del territorio germano renacerán, y Luxemburgo guiará la federación como estado líder de los Ducados Unidos. …Pero este proceso fue, sin duda, horrible, y muchísimas personas fueron sacrificadas por la guerra. Como regente de Luxemburgo, ofrezco mis disculpas a todos quienes perdieron a sus familias en el frente.\" \n\nAru respiró hondo, con calma.\n\n\"Ojalá que esta guerra… no haya sido solo una guerra para reunificar al pueblo germano, dividido entre Trinity y Gehenna, y para amarrar en una sola a las academias de Kivotos en disputa. Aunque muchos murieron, quienes sobrevivimos debemos asegurar que en esta tierra no vuelva a haber más víctimas. …Ni Gehenna, ni Trinity, ni los locales serán discriminados en este nuevo país unificado. Haré un país así. Gracias.\""
 HEU_event.240.desc.b:0 "Cuando Aru subió al podio de Edén apoyándose en su bastón, estalló un aplauso entre la multitud reunida bajo el estrado. Aru imaginó cuánta de esa gente habría sido movilizada por el gobierno para estar allí. Bueno… decidió dejar por ahora esos dolores de cabeza políticos.\n\n\"Hola. Soy Rikuhachima Aru. Supongo que hay muchos que me odian o que no les caigo bien. Está bien. A mí tampoco me caigo muy bien. Desde que crucé a esta tierra por la Gran Transición, viniendo de Kivotos, pasé muchísimo tiempo encerrada en una casa segura. Y mientras tanto… pensé mucho qué palabras debía dejarle a los demás el día que por fin saliera de ahí.\" \n\nAru miró de reojo el borrador de la declaración de la Ley de Unión que Mutsuki había preparado. No tenía ganas de leerlo. Y la Mutsuki de ahora tampoco le diría que lo leyera. Aru cerró el documento y continuó.\n\n\"Me convertí en la unificadora del pueblo germano sin haber hecho nada en especial. Pero como muchos de ustedes piensan, yo no soy alguien tan grandioso. Solo… la ola me arrastró, y por pura inercia acabé parada aquí. …Pero a partir de ahora, en vez de dejar que la ola me arrastre, voy a intentar guiarla yo misma.\" \n\nAru observó por un momento a todos los presentes: Trinity, Gehenna, y también a los alemanes.\n\n\"Lo que yo quiero no es unificar a los germanos, sino unificarlos a todos ustedes, que viven en esta tierra. No habrá discriminación, ni dolor inútil, ni nada de eso. Mientras yo no muera. Mientras esté con ustedes, haré todo lo que pueda. Gracias.\""
 HEU_event.240.desc.c:0 "Cuando Aru subió al podio de Edén apoyándose en su bastón, estalló un aplauso entre la multitud reunida bajo el estrado. Aru imaginó cuánta de esa gente habría sido movilizada por el gobierno para estar allí. Bueno… decidió dejar por ahora esos dolores de cabeza políticos.\n\n\"Hola. Soy Rikuhachima Aru. Supongo que hay muchos que me odian o que no les caigo bien. Está bien. A mí tampoco me caigo muy bien. Desde que crucé a esta tierra por la Gran Transición, viniendo de Kivotos, pasé muchísimo tiempo encerrada en una casa segura. Y mientras tanto… pensé mucho qué palabras debía dejarle a los demás el día que por fin saliera de ahí.\" \n\nAru miró de reojo el borrador de la declaración de la Ley de Unión que Mutsuki había preparado. Mutsuki habría querido encerrarla y disfrutar obligándola a leer ese papel. Aru lo tomó, lo miró con una sonrisa fría… y lo rompió al instante.\n\n\"Me convertí en la unificadora del pueblo germano sin haber hecho nada en especial. Pero como muchos de ustedes piensan, yo no soy alguien tan grandioso. Solo… la ola me arrastró, y por pura inercia acabé parada aquí. …Pero a partir de ahora, en vez de dejar que la ola me arrastre, voy a intentar guiarla yo misma.\" \n\nAru observó por un momento a todos los presentes: Trinity, Gehenna, y también a los alemanes.\n\n\"Lo que yo quiero no es unificar a los germanos, sino unificarlos a todos ustedes, que viven en esta tierra. No habrá discriminación, ni dolor inútil, ni nada de eso. Mientras yo no muera. Mientras esté con ustedes, haré todo lo que pueda. Gracias.\""
 HEU_event.240.a:0 "¿Hablé medio incoherente, no? Parece que todavía no se me va del todo el veneno del cianuro."
 HEU_event.240.b:0 "Aru sonrió, apenas."

 HEU_event.241.t:0 "¡¿Esa mujer no se murió?!"
 HEU_event.241.desc:0 "El presidente del parlamento, Émile Reuter, gritó y estrelló contra la pared de la sede del Partido de Derecha una pieza de porcelana china. Una decoración carísima —decían que era de la dinastía Song del Norte— se hizo añicos con un estruendo, quedando tirada en el piso. Rikuhachima Aru, quien se apoderó de Luxemburgo y luego anexó toda Alemania. Cuando oyó que se había “tomado de un trago” el cianuro de potasio, pensó que era una oportunidad irrepetible. ¿Pero… no se muere ni con veneno?\n\n\"¡Maldición! ¡Plan C! Y encima ya aprobaron la Ley de Unión. ¡No podemos dejar que esa mujer se quede gobernando de por vida!\"\n\nEl diputado Jean Origer se burló. \"¿Ahora resulta que sí hay Plan C? Mejor acepte la derrota. Ni la Casa de Borbón-Parma viene, ¿no?\"\n\n\"¡Que la Casa de Borbón-Parma no sea solo Javier! Aunque la legitimidad sea débil, me da igual: ¡mándenle cartas de sucesión a todos los parientes del difunto Gran Duque Félix! Si es solo para ser Gran Duque de un 'pequeño Gran Ducado de Luxemburgo', quizá lo rechacen. Pero si es para ser el Gran Duque de los 'Ducados Unidos de Luxemburgo', líder del Estado de unificación del pueblo germano… ¿y además no se queda en Gran Duque, sino que lo elevamos a Reino Unido…? ¡Uno pica! ¡Seguro!\""
 HEU_event.241.a:0 "El último plan golpista"

 HEU_event.242.t:0 "Reconciliación"
 HEU_event.242.desc:0 "\"Asagi… no, Mu…\"\n\nKayoko respiró hondo un instante, cerró los ojos con fuerza y dijo:\n\n\"Señorita Mutsuki.\"\n\n\"…¿Con 'señorita'?\"\n\"…Vamos a reconciliarnos por etapas. Aún no te perdono del todo.\"\n\"Ufufu. Ese lado terco de Kayokocchi me gusta. ¿Y? ¿Vienes a presumir que cambiaste el yobisute otra vez?\"\n\"…Vine por algo más importante. La jefa está en recuperación, ¿no? No tenía a nadie más con quien hablar.\"\n\"¿Qué pasa?\"\n\nKayoko apartó la mirada. \"Me lo dijo un espía que metimos en el Partido de Derecha. …Los conservadores están intentando importar del extranjero a otro aristócrata para reemplazar a Aru. Si nos ponemos estrictos con los hechos, legalmente es válido. Aru, al final, no es más que *regente hasta que aparezca el Gran Duque verdadero*. Si llega un Gran Duque real, sea quien sea, ella tendría que hacerse a un lado.\" \n\n\"Espera. Si los de Nassau están todos muertos, ¿a quién van a traer?\"\n\n\"Parientes del difunto consorte. …Ah. Pero eso no es lo importante. Tenemos que proteger a la jefa. Esta vez, de verdad: tú y yo, *juntas*. ¿Me ayudas, señorita Mutsuki?\""
 HEU_event.242.a:0 "\"Ufufu. Va. Agencia 68… volvamos a salir.\""

 HEU_event.243.t:0 "Enmienda a la Ley de Sucesión"
 HEU_event.243.desc:0 "Haruka entró corriendo a la oficina de la Agencia 68 cargando un montón de documentos. Eran resultados recientes de encuestas sobre la aprobación de Aru en Luxemburgo y el apoyo del electorado de origen Gehenna. Haruka sonrió, toda contenta.\n\n\"E-eh… me alegra que ustedes dos… se estén reconciliando otra vez…\"\n\nMutsuki frunció el ceño. \"No es que ya nos reconciliamos del todo. Solo que nuestra Kayoko-chan… va a intentar creer que no es un perro de mierda al cien por ciento.\" \n\"Y yo solo confío en Mutsuki en un cincuenta por ciento. Al menos ya no dices locuras como 'vamos a asaltar el parlamento y matar diputados para dar un golpe de Estado'.\"\n\"…Porque entendí que eso *no es lo que Aru quiere*. Solo eso.\" \n\nKayoko carraspeó. \"El jefe de Estado de Luxemburgo tiene el derecho de disolver el parlamento y convocar nuevas elecciones. Vamos a obtener la aprobación de Aru para disolver la cámara, y luego haremos campaña con la promesa de que el nuevo parlamento aprobará reconocer a Aru como *Gran Duquesa legítima* de Luxemburgo. La popularidad de Aru es bastante alta, así que los moderados y centristas, por querer reelegirse, aceptarán esa promesa y competirán con ella.\" \n\nMutsuki preguntó: \"¿Y si lo prometen y luego no lo cumplen?\"\n\n\"…Confiemos en lo que la jefa ha hecho hasta ahora por la gente de esta tierra. …Si la jefa confía en ellos, entonces nosotras también podemos confiar al menos una vez, ¿no?\""
 HEU_event.243.a:0 "\"Bueno, hagámoslo. ¡Reelección del parlamento!\""

 HEU_event.244.t:0 "Elecciones por la reforma sucesoria de Luxemburgo"
 HEU_event.244.desc:0 "Aru no era el tipo de persona que se aferrara a ser aristócrata o regente. Para ella, el cargo más valioso siempre fue “la jefa de la Agencia 68”. Por eso también había ignorado las voces que exigían elevar a Luxemburgo a reino tras reunificar al pueblo germano. Pero si, a estas alturas, existía la posibilidad de que la echaran de Luxemburgo… entonces no quedaba otra que convertirse en la Gran Duquesa de verdad.\n\nAru firmó la orden de disolución del parlamento y miró a Mutsuki a los ojos. \"Esta vez no es fake news para engañarlos, ¿verdad?\"\n\n\"…Aru-chan. Desde que casi te mueres… yo también cambié mucho. Ya no voy a cometer ese tipo de error.\" \n\nMutsuki no podía verse más decidida. Bien. Confiemos. Quizá Aru no pudiera convertirse en el “adulto responsable” que imaginaba… pero tal vez sí podía ser un “adulto que confía en sus empleadas”, ¿no?"
 HEU_event.244.a:0 "Hazlo como tú quieras. Estaré esperando."

 HEU_event.245.t:0 "Votación de la reforma constitucional"
 HEU_event.245.desc:0 "Un gabinete lleno de diputados recién electos. Aru puso un pie en el edificio del parlamento. Ahí se estaba votando la primera ley del nuevo gabinete: reformar la Constitución para modificar la ley de sucesión de Luxemburgo. En una esquina izquierda, apretando los dientes, estaba el líder conservador Émile Reuter. Y al extremo derecho, el líder “reformista” que apoyaba la regencia de Aru, el diputado Pierre Dupont.\n\nAru no entendía bien los enredos de la política local. Lo importante era una cosa: la ciudadanía de Luxemburgo ya había decidido en elecciones si Aru se quedaba o la echaban.\n\nComo todavía no se había elegido un nuevo presidente del parlamento, el primer ministro Joseph Bech avanzó al frente.\n\n\"Este parlamento, primero ha deliberado la abolición del Artículo 115 de la Constitución —que establece que 'la regencia no posee autoridad para enmendar la Constitución'— y después ha realizado una votación separada para la enmienda del Artículo 3, que regula la Ley de Sucesión. Conforme a la legislación de Luxemburgo, se informa que una reforma constitucional requiere la aprobación de dos tercios del total de diputados: 37 votos de 55. Asimismo, se informa que, si la reforma del Artículo 115 es rechazada, la votación sobre el Artículo 3 quedará sin efecto. Procederé a anunciar el resultado del escrutinio.\" \n\n\"…Resultado de la votación para abolir el Artículo 115, que niega a la regencia la autoridad de reforma constitucional: de 55 diputados en ejercicio, votaron 55; a favor, 44; en contra, 9; nulos, 2… Se declara aprobada.\" \n\nAl conocerse que la primera reforma constitucional había pasado, estallaron vítores desde las gradas. El primer ministro Bech se secó el sudor frío de la frente y pasó a la siguiente hoja. La votación *real* era la segunda.\n\n\"A continuación, el resultado de la votación para la enmienda de la Ley de Sucesión, con el fin de reconocer a la regente Rikuhachima Aru como Gran Duquesa legítima de Luxemburgo. Total en ejercicio: 55. Votaron: 55. …A favor, 37. En contra, 10. Nulos, 8… Se declara aprobada la reforma constitucional que reconoce a Rikuhachima Aru como Gran Duquesa legítima…\" \n\n¡PAM! ¡PAM! La voz de Bech quedó sepultada por los fuegos artificiales que hicieron explotar estudiantes de Gehenna en las gradas, y por el caos de gritos y celebraciones mientras los diputados se empujaban intentando correr hacia el estrado.\n\n\"¡Aru-chan!\"\n\nCuando Aru volteó, las tres de la Agencia 68 la abrazaron de golpe."
 HEU_event.245.a:0 "¡Al final, las películas sí tienen final feliz!"
 
 HEU_event.246.t:0 "Una línea al día"
 HEU_event.246.desc:0 "No se puede recuperar lo que ya se perdió. Aru no podrá volver a usar el brazo derecho, destrozado por los asesinos. El Wine Red Admire se irá pudriendo poco a poco durante décadas, colgado en una pared como adorno. El ojo izquierdo, que ya no ve, tampoco volverá. Y por el intento de suicidio con cianuro y la destrucción que causó en su hígado, el médico le dio la orden de “prohibición de alcohol de por vida”.\n\nPero al menos no lo perdió todo.\n\nEn el momento en que, tras oír que la reforma había sido aprobada, salió del parlamento junto con las empleadas de la Agencia 68, Aru vio a unas chicas con halo. Eran las mismas que, el día del gran gobierno de coalición, le habían arrojado pintura blanca. Al ver a esa chica en particular, las manos de Aru empezaron a temblarle sin que pudiera evitarlo. Pero…\n\nElla fue la primera en avanzar y agachar la cabeza.\n\n\"¡Lo siento mucho!\"\n\"…¿Ah?\"\n\"E-eh… yo… nosotras solo… odiábamos que usted, Aru, se creyera la gran cosa… y… ahora entendimos que usted estaba esforzándose todo el tiempo, en un lugar que no veíamos… y que aquel día nos pasamos…\"\n\nMutsuki apretó el puño con fuerza. \"Oye, cabrón… ¿con un simple *lo siento* ya se arregla…?\" \n\nAru levantó la mano. \"Está bien.\" \n\nCon decir “lo siento” no se puede recoger lo que ya pasó. Pero lo que se pierde, no regresa. Aunque Aru tumbara a esta chica a golpes, o la arrastrara a la cárcel… el pasado no iba a cambiar, ¿no?\n\nAru obligó a su brazo tembloroso a calmarse y le dio a la chica un abrazo breve.\n\n\"Gracias… por haber juntado el valor.\" \n\"¡Ah! S-sí. ¡Sí!\" \n\nDespués de que la chica abrazada y las otras estudiantes se marcharan casi huyendo, Haruka preguntó en voz baja:\n\n\"¿De verdad… con esto… está bien, jefa?\" \n\"Sí. Estoy bien. Con esto basta.\" \n\nNo se puede recuperar lo perdido. Pero sí se puede proteger lo que aún queda. Aru caminó despacio, con sus dos pies, rumbo a la ciudad de Luxemburgo. La forajida hardboiled que se autoproclamaba, inmadura, en tiempos de Kivotos, ya no existía. Pero la Agencia 68 seguiría existiendo. Mutsuki, Kayoko y Haruka seguirían a su lado. Y también seguirían existiendo las personas y las tierras que aún debía proteger.\n\nSi eso bastaba… ¿qué más hacía falta?"
 HEU_event.246.a:0 "Viviendo… me haré responsable de ustedes."

 HEU_event.247.t:0 "Ceremonia de fundación del Partido Federal Estudiantil"
 HEU_event.247.desc:0 "Hasta ahora, la forma en que la población de origen Kivotos resolvía los problemas tras la Gran Transición solía ser más o menos así: uno, tomar las armas y lanzarse. Dos, el problema se resuelve. Era un método corto, directo y nada pretencioso… pero para que humanos y kivotosianos puedan vivir “en igualdad”, a veces hace falta recurrir a caminos largos y complicados.\n\nSería difícil explicar lo complicado que fue para Rikuhachima Aru lograr que las estudiantes de Gehenna fundaran el Partido Federal Estudiantil. Reunir a un grupo pequeño —al menos de las que aún podían dialogar—, convencerlas, y hacerles entender que podían expresar sus opiniones mediante la política parlamentaria dentro de un marco legal… eso, sin duda, no era “el estilo Gehenna”. Pero si ya no podemos volver a Kivotos, tampoco podemos imponer el estilo Gehenna en todas partes.\n\nAl final, el Partido Federal Estudiantil, que defiende los intereses de la población de origen Kivotos, fue fundado oficialmente.\n\nNo todo fueron buenas noticias. Émile Reuter, un político clave y figura central del ala conservadora que lidera el Partido de Derecha, estalló de furia al enterarse de que Aru intervino directamente en la fundación de este partido. Su argumento era que no solo estaban metiendo al parlamento al Partido Comunista, sino también a un “Partido de Kivotos”, convirtiendo el congreso en un patio de juegos.\n\nEl Partido de Derecha publicó un comunicado anunciando que se retiraba formalmente del gobierno de coalición. En principio, esto debería forzar una nueva elección del primer ministro, pero Aru anunció que mantendría su confianza en Joseph Bech como “la persona adecuada para resolver el conflicto étnico”. Al menos por un tiempo, no parece que vaya a haber cambio de primer ministro."
 HEU_event.247.a:0 "¡Un partido de Kivotos, para Kivotos, por Kivotos!"

 HEU_event.248.t:0 "Encuentro con la comunidad de Kivotos"
 HEU_event.248.desc:0 "Que Aru se había convertido en el perro de los locales. Que había abandonado a Kivotos y solo se preocupaba por los locales. No se podía negar que ese tipo de comentarios estaban circulando. Y después de que le vaciaran pintura blanca encima, Aru empezó a preocuparse todavía más por la opinión pública.\n\nLa Ley de Derechos Civiles no bastaba. Tenía que escuchar qué querían Gehenna y las demás personas trasladadas desde Kivotos. No era algo particularmente difícil: Aru era la jefa de la Agencia 68, y recibir clientes y oír encargos era algo que había hecho decenas de veces.\n\nPero el día que invitó a tres representantes de estudiantes de Gehenna a la oficina para una reunión… al ver entrar a esas chicas, Aru apretó la pistola instintivamente. Era como si el olor de la pintura que le habían echado en la cabeza volviera a aparecer.\n\n\"¡Bienvenidas a la oficina de la Agencia 68! A ver, sí, también soy algo así como la Gran Duquesa de Luxemburgo y bla bla, pero para ustedes, lo de la agencia seguro es más familiar.\" \n\nQuizá lo único tranquilizador era esto: como todas eran de Kivotos, ni siquiera les pareció raro que Aru sacara una pistola y la sujetara a plena vista. Al principio, por el miedo, Aru casi ni podía hablar. Pero para su sorpresa, las chicas hablaron con naturalidad.\n\n\"¿Y si aquí también hubiera clubes como en Gehenna?\"\n\"¡Traigan BD para la escuela de acá~!\"\n\"Desde la Gran Transición se volvió difícil conseguir mercancía de MomoFriends. ¿No pueden importar o algo?\" \n\nLa tensión inicial se fue disolviendo a medida que la conversación seguía, y Aru pudo entender algo: no todas las estudiantes de Kivotos la veían como un monstruo. Al menos no era cierto que nadie reconociera que Aru se estaba esforzando por ellas. ¿No era eso… suficiente, por ahora?"
 HEU_event.248.a:0 "¡Sea MomoFriends o BD, tú solo dilo: la Agencia 68 lo consigue todo!"

 HEU_event.249.t:0 "El primer consejo cantonal"
 HEU_event.249.desc:0 "Desde que se anunció la Ley de Soberanía —que crea consejos cantonales como organismos autónomos para las estudiantes de Kivotos—, la reputación de Aru entre la población de origen Kivotos está mejorando poco a poco. La Ley de Soberanía es una norma para protegerse a sí mismos: como la población de origen Kivotos es una minoría absoluta frente a los locales, la ley establece que en cada “cantón” (distrito) de Luxemburgo se construya un consejo local liderado por kivotosianos.\n\nAlgunos locales sostienen que esta ley es una discriminación inversa contra los luxemburgueses. Pero Aru los persuadió afirmando que “las atribuciones de los consejos locales serán muy limitadas, y la autonomía se restringirá al nivel de proteger los derechos humanos básicos de la población de origen Kivotos”.\n\nQue la persuasión haya funcionado no se debe, probablemente, a la ‘labia’ personal de Aru. A ver… nuestra jefa Aru tampoco es precisamente una gran oradora, ¿no? Más bien, durante su largo tiempo en el poder, Aru demostró con acciones su intención genuina de gobernar para ambos pueblos: locales y kivotosianos. La gente no aceptó la Ley de Soberanía por sus discursos improvisados, sino por lo que ella ha hecho."
 HEU_event.249.a:0 "Poco a poco… hacia la convivencia"

 HEU_event.250.t:0 "Hacia el MiLiE reluciente"
 HEU_event.250.desc.a:0 "Primero déjame preguntarte esto. ¿Por qué yo? Si la jefa llegara a enamorarse de alguien de la agencia... pensé que, como mínimo, esa persona no sería yo.\n\n...No lo sé. Simplemente... de alguna manera, terminó pasando.\n\n¿Ni tú misma lo sabes?\n\nAjajá... sí, supongo. Pero estoy segura de que ahora amo a Kayoko. Ese sentimiento lo siento con total claridad. Por eso... quizá me odien por ello, pero aun así quería confesármelo. Quería... decírtelo a ti, Kayoko.\n\n¿Un anillo...? Jefa, incluso ahora Mutsuki no me cae precisamente bien... si se entera de que le quitaste a la jefa, va a querer matarme de verdad, ¿sabes?\n\n¿M-Mutsuki? Eh... quizá... de alguna forma... lo entienda... ¿no? Tal vez........ eh... ¿o tal vez no?\n\nJeje. Igual que siempre: pareces firme y decidida, pero hay un tornillo suelto en alguna parte.\n\n¡Oye, no te rías! Si pasa algo... ¡puedo hacerme responsable...!\n\nJeje. Está bien. Acepto ese sentimiento.\n\n¿Eh?\n\nJefa... no, Aru. Gracias por el anillo."
 HEU_event.250.desc.b:0 "Aru-chan. ...No estás jugando conmigo, ¿verdad?\n\n¿Te parezco alguien que haría eso?\n\nMe pareces exactamente alguien que podría hacerlo. Mira, yo te utilicé. Tiré a la gente al cañón diciéndoles que te convertiría en una *heroína*, le disparé a los subordinados de Aru-chan, y ni siquiera me di cuenta de que Aru-chan estaba cayendo en depresión y consumiéndose... Oye, Aru-chan, no. ¿De verdad una persona llamada *Rikuhachima Aru* quiere pasar el resto de su vida junto a esta *Asagi Mutsuki*?\n\n...Aun sabiendo todo eso, *te elegí* a ti. Sí. Puede que pienses que es una locura; lo es, ¿no? Ja. Pero, ¿sabes qué? Yo ya te había perdonado* aun sabiendo todo eso*, y ahora estoy diciendo que me gustas. No estoy borracha, ni mentalmente inestable. Me gustas. ...Solo... quiero que sigas a mi lado.\n\n...Qué tonta. Incluso sin todo esto, yo igual me quedaría a tu lado... ...Ahh, en serio. Aru-chan, no hay remedio contigo. Está bien. ...Me quedaré contigo."
 HEU_event.250.desc.c:0 "Me voy a morir.\n\n¡No no no no no, Haruka, de repente por qué!\n\nQue Aru-sama no se lo haya dicho a otra persona sino, eh, bueno, a mí, que me haya dado ese anillo y se me haya confesado... yo pensé que quizá era una forma indirecta de decirme que ya no me necesita en la agencia y que me vaya, porque yo no merezco el amor de Aru-sama y tampoco creo que Aru-sama pudiera amarme, entonces esto es una especie de prueba y por el bien de Aru-sama debería desaparecer en silencio y—\n\nBasta.\n\n¿A-Aru... sama?\n\nHaruka, no voy a decirte “por favor acepta mi amor”. Puedes rechazarme si quieres. Pero al menos quiero que Haruka se ame más a sí misma. Ese día en que intenté suicidarme, cuando me viste sentado en el sofá... ¿qué pensaste?\n\nSolo... pensé que ojalá no lo hiciera.\n\nYo también.\n\n...\n\nTe lo diré otra vez, con sinceridad. Amo a alguien que no es otra persona: te amo a ti. Y aceptes o no esta confesión, quiero que Haruka, al menos, se ame a sí misma.\n\nYo también...... sí. Lo haré. Y... desde hace mucho... me gustabas. A mí también. Aru-sama."
 HEU_event.250.a:0 "Hacia un futuro sincero, para nosotros, que parece demasiado una mentira"

 HEU_event.251.t:0 "El mundo está cambiando"
 HEU_event.251.desc:0 "A medida que aumenta la afluencia de población de Kivotos, también empiezan a aparecer poco a poco autónomos de Kivotos dentro de la ciudad de Luxemburgo. Además, gracias a que se ha promovido de forma constante la convivencia entre los kivotosianos y los luxemburgueses, el rencor de la población de Kivotos hacia Aru también estaba disminuyendo. Al recorrer Luxemburgo y reunirse en persona con estos comerciantes, era posible percibir el cambio.\n\n\"Hola. Hacía tiempo que no venía.\"\n\"Mire nada más, la señorita Rikuhachima otra vez. Jaja. ¿Necesita munición nueva?\"\n\nEn Kivotos era un hombre-oso que podía caminar libremente, pero en Luxemburgo, por la discriminación, Kumamoto regentaba una armería en un callejón. Con una expresión alegre, la reconoció. Antes incluso abrir un negocio así era duro, pero tras la Ley de Derechos Civiles trabajó en varias minas para reunir capital y emprender, decía. Aru solía pasar por allí a comprar munición para su pistola. Kumamoto sacó balas del calibre adecuado y habló:\n\n\"Siendo usted la Regente, si quisiera, el ejército podría abastecerla de munición sin problema.\"\n\"Tenemos que ayudarnos entre gente de Kivotos para sobrevivir. Jeje. Este gasto está dentro de mi presupuesto previsto.\"\n\"Jaja. Entonces, sin pena le saco las balas. ...De verdad, gracias, señorita Rikuhachima. Si no fuera por usted, no habría podido ni siquiera abrir una armería así en la ciudad. Si hasta las estudiantes con halo sufren discriminación... a los beastfolk como nosotros directamente nos tratan como animales, como si ni fuéramos humanos. Al principio muchos murmuraban que usted quería volverse aristócrata y le vendió el alma a los locales, pero ahora, uno por uno, empiezan a reconocerla. De verdad, gracias.\"\n\nAru estaba acostumbrada a los elogios. Pero el agradecimiento de hoy sonó mucho más especial que de costumbre. Aru sonrió y cambió la munición por marcos. Justo cuando estaba por terminar el recorrido y regresar al palacio, Kumamoto preguntó:\n\n\"Por cierto, señorita Rikuhachima... ¿no tiene romances ni nada?\"\n\"¿Romances?\"\n\"Últimamente hasta entre los trasladados de Kivotos se comenta este chisme. Dicen que a la señorita Rikuhachima le gustan por igual tanto los locales como los de Kivotos. Que entonces... con cuál de los dos lados se casaría.\"\n\"...¿No da igual, mientras sea cualquiera de los dos? Yo...\""
 HEU_event.251.a:0 "\"...ya me casé con Luxemburgo, ¿sabes?\""
 HEU_event.251.b:0 "\"...la verdad, tengo a alguien de quien me estoy enamorando en la agencia.\""

 HEU_event.252.t:0 "Éxito en la alianza con [FROM.GetName]"
 HEU_event.252.desc:0 "Hemos logrado establecer un frente unido con [FROM.GetName], y la alianza entre [FROM.GetLeader] y [ROOT.GetLeader] fortalecerá aún más nuestra cohesión. ¡Roguemos para que el futuro de este frente unido sea eternamente brillante! ¡Viva [ROOT.GetName]!"
 HEU_event.252.a:0 "...¡Es un éxito magnífico!"

 HEU_event.253.t:0 "Fracaso en las negociaciones con [FROM.GetName]"
 HEU_event.253.desc:0 "Hemos fracasado en la construcción de un frente unido con [FROM.GetName], y parece que la facción de [FROM.GetLeader] no nos considera necesarios como aliados. Es lamentable, pero parece que tendremos que dedicar más tiempo a buscar mejores aliados."
 HEU_event.253.a:0 "...No es bueno"

 HEU_event.254.t:0 "Fundación de la Asamblea Revolucionaria Católica Nacional"
 HEU_event.254.desc:0 "La idea de que el Estado controle de forma directa a la Iglesia católica no nació por primera vez en Luxemburgo. ¿Acaso no hubo británicos que separaron su iglesia del catolicismo simplemente porque querían divorciarse una vez? Al menos, la razón de \"defender los derechos de los kivotosianos y de las mujeres\" era, de cara al exterior, menos vergonzosa que \"querer probar un divorcio\".\n\nPor supuesto, las iglesias católicas de Luxemburgo no estaban de acuerdo con ello. La propuesta de que el Estado creara una organización llamada \"Asamblea Revolucionaria Católica\" y que Aru asumiera el poder de investidura de los sacerdotes significaba, en la práctica, la independencia del Vaticano y convertirse en una \"herejía\".\n\nAru declaró que, en la medida en que los sacerdotes no fueran \"personas excesivamente antihumanistas\", respetaría la investidura del Vaticano, pero la Iglesia afirmó que la palabra \"respeto\" escondía una trampa. En otras palabras, significaba que el gobierno de Luxemburgo adquiriría el derecho de excomulgar y expulsar arbitrariamente a clérigos que afirmaran que las mujeres no deberían trabajar y debían volver a la cocina, o que los kivotosianos no eran seres humanos dignos de salvación.\n\nEl partido conservador de derecha se puso del lado de los sacerdotes católicos y exigió la retirada de la Asamblea Revolucionaria. Sin embargo, el catolicismo luxemburgués mantiene una postura dura de expulsar a los kivotosianos del país, por lo que, dada la personalidad de Aru, esta no es una opción posible.\n\nEl partido liberal, el Partido Liberal Radical, propuso una solución de compromiso. Rechazar las afirmaciones \"radicales\" como el reconocimiento de los derechos de las minorías sexuales y la autorización de sacerdotisas, defendidas por algunos estudiantes de Gehenna, así como la teología de la liberación promovida por el Partido Comunista de Luxemburgo. En su lugar, proponen adoptar solo dos principios moderados como ideología básica de la Asamblea Revolucionaria: \"el trabajo femenino\" y \"considerar a los kivotosianos como seres humanos\".\n\nPor último, existen posturas radicales que sostienen que la Asamblea Revolucionaria debe convertirse en una organización verdaderamente revolucionaria. El Partido Comunista de Luxemburgo cree que la Iglesia católica debe transformarse en una organización que luche por la clase trabajadora oprimida y discriminada. Los estudiantes de Gehenna argumentan que el catolicismo debería permitir todo, incluidas las sacerdotisas y los derechos de las minorías sexuales, que tanto se esfuerza en prohibir.\n\nSea como sea, la Asamblea Revolucionaria se mantendrá. El problema es hasta qué punto será una organización \"revolucionaria\"."
 HEU_event.254.a:0 "Elegir la propuesta de compromiso del Partido Liberal Radical."
 HEU_event.254.b:0 "¡El clero debe centrarse en la liberación de los trabajadores!"
 HEU_event.254.c:0 "¿No deberíamos impulsar incluso los derechos de las minorías sexuales por el bien de la revolución?"

 HEU_event.255.t:0 "La guerra contra Trinity"
 HEU_event.255.desc.generic:0 "Dejando atrás la fastuosa ceremonia de victoria celebrada en el distrito central de Gehenna, comenzó una nueva guerra por la unificación del pueblo germánico. La batalla decisiva contra Trinity había empezado. En la radio y la televisión resonaba el discurso de Asagi Mutsuki, que exigía la movilización total del pueblo. Como era de esperar, tanto los medios como Asagi Mutsuki alababan a Aru como la única líder capaz de derrotar a Trinity, pero, irónicamente, Aru no aparecía en ninguna transmisión.\n\nEl día del estallido de la guerra, Aru visitó la casa de Kayoko. A diferencia de Aru, que vivía en una estrecha pensión desde la Gran Transición, Kayoko había conseguido una casa unifamiliar bastante decente. Aunque la visita no fue anunciada, Kayoko preparó enseguida una taza de cacao.\n\n\"Jefa, ¿qué piensas ahora de la señorita Asagi?\"\n\"Quiero que no digas *señorita Asagi*.\n\n\"Jefa, hablo en serio. Esa mujer está intentando incendiar Luxemburgo, iniciando guerras consecutivas, primero contra Gehenna y ahora contra Trinity...\"\n\"También está prohibido decir *esa mujer*. ...Oye, ¿alguna vez has pensado cómo me siento al escucharos a las dos odiaros de esa manera? Kayoko, tú eres inteligente. Eres alguien que puede entenderlo sin necesidad de explicaciones.\"\n\nAnte las palabras de Aru, cercanas a un suspiro, Kayoko se quedó sin palabras.\n\n\"Oye, Kayoko. Yo de verdad me esforcé por vivir bien, ¿sabes? Intenté crear un mundo amable donde ni los kivotosianos ni los locales salieran heridos. Entonces, ¿por qué ha terminado así? Yo solo quería que Mutsuki y tú vivieran felices en este pequeño Luxemburgo. ...¿En qué momento me equivoqué para que todo se hiciera tan grande?\"\n\nKayoko observó a Aru, que temblaba mientras sujetaba la taza de cacao. Estaba tan debilitada que ya no podía ni llamarse a sí misma una forajida hardboiled.\n\n\"...Jefa, tú aún puedes cambiar la situación. Ahora eres una <adulta>.\"\n\"¿Adulta...?\"\n\"Cuando todo termine, busquemos una forma de resolver los errores de la señorita Asagi... no, de la señorita Mutsuki. Tú puedes hacerlo, jefa. Estoy segura.\"\n\nAdulto. Responsabilidad. Mientras escuchaba esas palabras, la expresión de Aru se fue endureciendo lentamente."
 HEU_event.255.desc.mutsuki:0 "Dejando atrás la \"fastuosa\" ceremonia de victoria celebrada en el distrito central de Gehenna, comenzó una nueva guerra por la unificación del pueblo germánico. La batalla decisiva contra Trinity había empezado. En la radio y la televisión resonaba el discurso de Asagi Mutsuki, que exigía la movilización total del pueblo. Como era de esperar, tanto los medios como Asagi Mutsuki alababan a Aru como la única líder capaz de derrotar a Trinity, pero, irónicamente, Aru no aparecía en ninguna transmisión.\n\nEl día del estallido de la guerra, tras terminar una grabación, Mutsuki fue directamente a buscar a Aru. Aru estaba apuntando a la pared con una pistola de juguete, simulando disparos. Como era lógico, no salía ninguna bala. Mutsuki se sentó a su lado, junto a Aru, que parecía aislada del mundo y solo miraba la pared. Tras un breve silencio, Aru habló.\n\n\"¿Cómo crees que terminará esta guerra? ¿Crees que acabaré en la horca contigo?\"\n\"Kufufu... quién sabe. ...Yo solo veo un futuro en el que Aru-chan se convierte en la verdadera heroína de esta tierra y se alza frente a todos.\"\n\"Yo no veo nada. Nada más que esta pared.\"\n\"Aru-chan siempre intenta hacerse la interesante en estos momentos, aunque en realidad no seas tan hardboiled. Oye, Aru-chan. Toda la gente de esta tierra solo ha intentado utilizarte. No hablo solo de los locales. ¿Los de Kivotos son diferentes? Solo intentaron sacar algo de Aru-chan, y cuando fracasaste, se burlaron de ti. ¿Y la jefa...? ¿De verdad sientes compasión por esas personas?\"\n\nDurante varios segundos, Aru no respondió nada. Luego, miró a Mutsuki con una mirada más fría que nunca.\n\n\"La persona por la que siento compasión eres tú. El final que va a producir todo esto, las personas que resultarán heridas por este juego de héroes que me encierra en este pequeño globo de nieve, y Rikuhachima Aru incluida. ¿Estás preparada para asumir la responsabilidad de todo eso?\"\n\n¿Qué podría responder Mutsuki a eso?"
 HEU_event.255.a:0 "...Sí. Yo asumiré la responsabilidad. De todo."

 HEU_event.256.t:0 "No llores"
 HEU_event.256.desc.generic:0 "De regreso a la oficina tras reunirse con Kayoko, Aru escuchó el sonido de una llamada telefónica proveniente del despacho del palacio ducal. Haruka estaba sujetando el auricular y hablando con alguien. ¿Con quién? Aru se detuvo frente a la puerta y acercó el oído.\n\n\"Directora Mutsuki... h-hic... como Aru-sama está triste, por favor, ¿no podrían... reconciliarse con la jefa Kayoko...?\"\n\n\"Kufufu. Nuestra Haruka-chan, ya no estás en edad de llorar como una niña, ¿verdad? Vamos, basta. Ahora hay que prepararse para ir al frente. Para no decepcionar a Aru-chan, ¿no deberíamos disparar a más insectos de Trinity en el frente?\"\n\n\"Directora Mutsuki, yo... yo también sé pensar... y tengo oídos para escuchar. Lo que Aru-sama realmente quiere no es la victoria...\"\n\n\"Ah, qué fastidio. Entonces, ¿quieres ver a Aru-chan en la horca porque perdimos la guerra?\"\n\n\"No... yo solo... quiero que ganemos la guerra, pero antes que ustedes dos se reconcilien...\"\n\n\"¿Reconciliarse? Ufufufu. Kyahaha. Haruka-chan, ¿sabes? Si Onikata-san no fuera amiga de Aru-chan, yo misma ya le habría roto el halo. Esa mujer solo finge actuar por Aru-chan mientras la utiliza, y solo se preocupa por satisfacer su vanidad intelectual. ¿Y yo? ¿Quién crees que evitó que le lanzaran pintura a Aru-chan? ¿Quién hizo callar a esos nazis que decían que los de cuernos debían desaparecer? ¡Yo! ¡Yo salvé a Aru-chan! Así que, Haruka-chan, si tú también quieres proteger a Aru-chan, deja de actuar como Onikata y sal a hacer algo. ¡Tráeme la cabeza cortada de [TRM.GetLeader]!\"\n\nNo quería escuchar más. En el momento en que Aru empujó la puerta, Haruka colgó bruscamente el teléfono. Sus ojos estaban enrojecidos por las lágrimas.\n\n\"Yo... quería intentar... reconciliarlas... pero soy tonta e inútil... lo siento...\"\n\nQuería decirle que estaba bien, que había hecho todo lo que podía. Pero no pudo abrir la boca. Aru simplemente abrazó a Haruka, que lloraba desconsoladamente, y le dio suaves palmadas en la espalda, deseando que su dolor desapareciera."
 HEU_event.256.desc.mutsuki:0 "Últimamente, Aru se había vuelto bastante cercana a las guardianas que la mantenían encerrada. Al verse todos los días y conversar, había momentos en los que incluso sentía que ellas eran como su familia de la Agencia 68. Las guardianas conocían la historia de Aru, la heroína nacional que había impedido la masacre de Luxemburgo, y aunque la mantenían confinada, nunca la trataron con crueldad. Si hubieran sido ese tipo de personas, Mutsuki nunca las habría enviado aquí.\n\n\"Jefa Aru.\"\n\nUna guardiana de largo cabello negro habló con cautela. Siempre llamaba a Aru \"jefa\". Para ella, Aru no era una regente desconocida, sino siempre la jefa de la Agencia 68. Para mirarla con el ojo que aún conservaba la vista, Aru tuvo que girar mucho la cabeza. La guardiana, sin poder mirarla a los ojos, mantenía la cabeza inclinada.\n\n\"Encerrar a la jefa aquí... me duele demasiado. Sé que todo esto es por órdenes de la señorita Mutsuki, y sé que es para proteger a la jefa, pero aun así... no sé si estoy haciendo bien este trabajo...\"\n\n\"No me gustan mucho los discursos largos y pretenciosos, ¿sabes? ¡Corto! Como una frase de novela hardboiled. Di con orgullo: 'Este trabajo es una mierda'.\"\n\"...Gracias. Sí. Este trabajo es una mierda.\"\n\nAru sonrió levemente y le dio una palmada suave en la espalda. Con el ojo que ya no veía, con la mano debilitada por la discapacidad, aquel gesto era poco más que una caricia. Todo eso estimulaba de forma sutil la culpa de la guardiana. A Aru no le gustaba manipular la conciencia de los demás, pero en esta prisión era importante crear aliados que simpatizaran con ella. Aru estaba elaborando un plan de fuga para escapar hacia un lugar definitivo que ni siquiera Mutsuki podría alcanzar.\n\n\"¿Puedo pedirte una cosa? ...Quiero introducir aquí un tipo de medicamento. Tú eres alguien que empatiza conmigo, alguien que entiende mi corazón, ¿verdad?\""
 HEU_event.256.a:0 "No hiciste nada mal."

 HEU_event.257.t:0 "Para la señorita Nanami Ayaka"
 HEU_event.257.desc:0 "Hola.\n\nEste correo está configurado para que solo pueda verlo la señorita Nanami Ayaka.\n\nNo. El señor Damian Krazenberg.\nSeguramente se preguntará cómo descubrí su verdadera identidad.\n\nNo necesita preocuparse demasiado. Yo también soy enemiga de Rikuhachima Aru, y me pongo en contacto con usted porque quiero ayudarle.\n\nVenga al edificio del Club Federal de Investigación, Schale. Es un edificio que el llamado presidente del consejo estudiantil Aru abandonó, y ahora está completamente en ruinas... pero si llega allí, le enviaré otro correo.\n\nA."
 HEU_event.257.a:0 "Krazenberg se levantó de su asiento, sintiendo un sudor frío recorrerle la espalda."

 HEU_event.258.t:0 "Hola, sensei"
 HEU_event.258.desc:0 "El edificio de Schale había quedado completamente abandonado, convertido en ruinas. Era culpa de que Arona, la administradora de Schale, no reconociera a Aru como \"presidenta del consejo estudiantil\", y tampoco le entregara la autoridad de la Caja de Shittim. En cuanto Aru se enteró de que no podría utilizar el edificio principal de Schale, simplemente lo desechó... y el inmueble, abandonado durante largo tiempo, se fue pudriendo poco a poco, con el suministro eléctrico cortado.\n\nDamian dio un paso dentro de la oficina oscura de Schale, dependiendo de una sola linterna. Rezaba para que el anillo de bodas de su esposa, Liza, que llevaba en el bolsillo, le diera fuerzas. Si esto era una trampa de los kivotosianos, Krazenberg moriría aquí. Siendo honestos, ¿cómo podría un humano vencer por la fuerza a un kivotosiano?\n\n\"Pero si alguien que conoce mi nombre me llama, tampoco puedo no venir...\"\n\nEn el instante en que Krazenberg soltó aquella queja, la tablet sobre el escritorio empezó a brillar de un azul intenso. ¿La tablet...? Krazenberg se abrió paso en la oscuridad y se acercó al escritorio. La pantalla, con una letra 'S' flotando, brilló por un momento, y entonces una niña pequeña vestida de azul apareció dentro del monitor. Sentada en aquel edificio escolar en ruinas, la niña lo miró desde abajo.\n\n\"Hmm. Pensé que quizá no vendría, pero ha venido, sensei Damian. Ah, y que quede claro: este 'sensei' es solo porque me dijeron que usted era profesor de griego; no significa que sea *mi* sensei. No se confunda.\"\n\"Tú... ¿quién eres?\"\n\"¡Ah! ¡Debería explicar eso primero! ¡Encantada! Soy Arona. He estado esperando al sensei aquí, en esta 'Caja de Shittim'... para expulsar a la falsa presidenta del consejo estudiantil, Rikuhachima Aru.\"\n\nRikuhachima Aru. En el instante en que escuchó ese nombre, un escalofrío le recorrió la espalda a Damian. Si lo que decía aquella niña era cierto, podría convertirse en su aliada. Pero... ¿podía confiar en esa niña dentro de una tablet, una niña con halo?\n\n\"Es normal que le cueste confiar en mí. Pero aun así... descubrí el seudónimo del sensei Damian, el tal 'Nanami Ayaka', y no lo denuncié. ¿No le bastó eso para entender mi sinceridad?\"\n\n\"Aun así... ¿qué razón tendrías para ayudarme?\""
 HEU_event.258.a:0 "\"Rikuhachima Aru no es una <adulta> de verdad. ...No podrá salvar a Kivotos de la invasión de los Colores.\""

 HEU_event.259.t:0 "La Cámara de Crafteo"
 HEU_event.259.desc:0 "\"Bien, pongamos en orden tu historia. Tú eras una IA creada por la verdadera presidenta original del consejo estudiantil de Kivotos... una 'IA para el sensei, el <adulto> que salvará de verdad a Kivotos'. ¿Algo así? Pero por culpa de la Gran Transición, ya no pudiste conocer al sensei salvador que esperabas... y como segunda opción, intentaste salvar Kivotos por tu cuenta haciendo esto y aquello.\"\n\n\"Como era de esperar, sensei. Tiene buena comprensión.\"\n\n\"¿Y cómo era ese sensei, el <adulto>?\"\n\nAl salir esa pregunta, la expresión de Arona se torció.\n\n\"Ya no hay forma de saberlo. Si era hombre, si era mujer, o incluso si era no binario. Ni siquiera pude ver la sombra de ese <adulto>.\"\n\nAnte el comentario sarcástico de Arona, Krazenberg ladeó la cabeza.\n\n\"...¿Qué es 'no binario'?\"\n\n\"En fin, existe algo así. Si lo explico, necesitaría el doble de espacio de texto.\"\n\n\"Volviendo al punto. En un mundo sin el sensei <adulto>, hice lo que pude para enderezar el mundo. Pero todo se arruinó. Sí. Claro que ella también intentará proteger Kivotos a su manera, pero fracasará. Los Colores, Gematria, y Decagrammaton... no son problemas que la Agencia 68 pueda resolver. Para arreglar la situación, necesito recuperar otra vez la autoridad de Kivotos. ...Así que, expulsar a Aru de Luxemburgo. Al menos hasta ahí, creo que usted y yo estamos en el mismo bando. Por eso, aunque usted no sea *mi* sensei, decidí ayudarle con su actividad revolucionaria en redes.\"\n\n\"¿Ayudar? ¿Qué significa eso?\"\n\n\"¡La Cámara de Crafteo puede sintetizar y crear cualquier objeto imaginable! ...Incluso puedo fabricar herramientas para ayudarle a hacer transmisiones en vivo por internet fingiendo ser una auténtica preparatoriana.\"\n\"...¿Y mi dignidad?\"\n\"Ay, por favor. ¿Los nazis tienen dignidad?\"\n\"No nazi. Llámeme *nacionalsocialista*.\n\"Eso es nazi. Y a este señor no lo soporto tanto.\""
 HEU_event.259.a:0 "\"Entonces, ¿qué hará? ¿Quiere intentar conmigo una revolución que se enfrente a la Revolución del 68?\""

 HEU_event.260.t:0 "No puedo dejar que se vaya así"
 HEU_event.260.desc:0 "\"Sensei Damian. No me cae muy bien.\"\n\"Eso mismo me dijiste el primer día que nos conocimos.\"\n\"Sí. Porque el sensei Damian... no era el <adulto> que salvaría a Kivotos. Pero... aun así, no quiero despedirme así de usted.\"\n\nNo le gustaba, pero tampoco quería separarse. Sonaba contradictorio, pero Damian podía entenderlo. Iba todos los días a la Cámara de Crafteo, intercambiaban charlas triviales, preparaban juntos las transmisiones. Compartían la esperanza de derribar algún día al gobierno de Aru. Y al compartir esa esperanza absurda, ambos se habían acostumbrado demasiado a la presencia del otro. Ya ni siquiera podía imaginar un sótano sin la otra persona.\n\n\"Lo siento. Pero es cierto que no hay forma de curar el cáncer.\"\n\"...Yo puedo protegerlo de ataques externos, sensei, pero no puedo hacer nada con un cáncer que ya nació. Pero...\"\n\nArona miró a la Cámara de Crafteo, el dispositivo de síntesis material. Un equipo avanzado imposible de comprender incluso con la tecnología de Kivotos; si solo hubiera piedras de activación, podría crear *cualquier* cosa imaginable. Por supuesto, ni siquiera eso podía producir una cura para el cáncer de Damian. Aun así, Arona habló con una voz llena de apego.\n\n\"¿Qué le parece convertirse en Nanami Ayaka?\"\n\"...¿Qué?\"\n\"Si metemos todas las piedras de activación que quedan en la Cámara de Crafteo, podremos crear un cuerpo real para una streamer virtual, implantándole los recuerdos del sensei. Entonces podría actuar no solo en línea, sino también fuera de línea, y quizá hasta luchar directamente contra Aru.\"\n\nArona bajó la cabeza. \"Claro que el sensei... no es un robot, es una persona, así que no puedo subir su consciencia a una máquina. Solo sería transferir sus recuerdos tal cual. ¡Pero! Aun así, si se convirtiera en la verdadera Ayaka, la streamer virtual podría seguir, heredando su voluntad...!\"\n\"Arona.\"\n\nDamian sonrió.\n\n\"Te dio miedo que yo muriera.\"\n\"...\"\n\"Yo sí moriré de verdad. Pero quieres que al menos alguien con mis recuerdos se quede aquí.\"\n\"Sé que es apego. Lo de que no podemos dejar de streamear es solo una excusa. Pero...\"\n\"Basta de excusas. Está bien.\""
 HEU_event.260.a:0 "\"Porque un sensei hace lo que sea por sus estudiantes.\""

 HEU_event.261.t:0 "La muerte de Damian Krazenberg"
 HEU_event.261.desc:0 "Si la Gran Transición no hubiera ocurrido, ¿en qué tipo de adulto se habría convertido? Al menos, no habría acabado alcohólico, muriendo de cáncer. Tampoco habría tenido que hacer un movimiento independentista en Luxemburgo. Habría seguido admirando el pensamiento de Adolf Hitler y continuado con su agitación de masas. Quizá incluso habría trabajado para el gobierno hitleriano en un Luxemburgo \"germanizado\". ¿Cómo lo habría registrado la historia? Para los nacionalistas del partido de derecha, habría quedado como un traidor a la patria.\n\nNo lo sabía. Damian sintió cómo su consciencia se iba volviendo borrosa mientras se recostaba en el sofá. Por el dolor del cáncer terminal, se tragó de golpe un puñado de pastillas que le habían recetado en el hospital de Kivotos. Aun así, no desaparecieron la hipotensión ni el sopor pesado. Sentía la certeza de que, si se dormía ahora, ya no volvería a despertar. Con esa convicción, Damian miró el horario restante de la Cámara de Crafteo. La \"segunda\" versión de sí mismo, la que lo reemplazaría, pronto saldría de la máquina. No... no era él. Era otra persona que solo había heredado sus recuerdos. Nanami Ayaka nunca podría ser su sustituta.\n\nPero al menos podría satisfacer el apego de Arona, que no quería separarse de él. Tal vez.\n\n\"Arona.\"\n\"...Sí, sensei Damian.\"\n\"Yo creía que todos los de Kivotos eran demonios. Carniceros que vinieron con la Gran Transición y se enviciaron con matar gente. Pero tú no. Aunque estés luchando por Kivotos... esa lucha tiene valor. Vive la vida que quieras vivir. Y conviértete en el adulto que quieras ser. Yo soy un tipo incapaz de ser sincero: si no me estoy muriendo así de miserable, ni siquiera puedo decir lo que siento.\"\n\"...\"\n\nClanc. En su consciencia borrosa, Damian vio cómo de la Cámara de Crafteo salía una mujer desnuda, frágil y delgada. Se parecía, de forma ridícula, al modelo 3D que Arona había creado. ¿Un robot con halo sobre la cabeza? Damian sonrió y cerró los ojos. Aunque estaba dejando una carga demasiado pesada sobre la recién nacida \"él\", aún quedaban palabras que debía decir por Arona."
 HEU_event.261.a:0 "A mi estudiante... se la encargo."

 HEU_event.262.t:0 "Victoria"
 HEU_event.262.desc:0 "La caída de [GEI.GetName], una amenaza para Kivotos y para la Tierra, y la actuación de la presidenta del consejo estudiantil, Rikuhachima Aru, hicieron que incluso quienes hasta entonces dudaban de su legitimidad la reconocieran como la verdadera presidenta del consejo estudiantil. ¿Quién habría imaginado que aquella inútil que se autoproclamaba forajida impediría la invasión de [GEI.GetName], que incluso pudo haber llevado a la civilización terrestre a la ruina? Quizá ni la propia Aru tenía plena confianza en sí misma.\n\nLo importante era esto: bajo la organización de la presidenta del consejo estudiantil, Rikuhachima Aru, se celebró con gran pompa una ceremonia conmemorativa de la victoria en la Tierra, en la sede D.C. del consejo estudiantil. Muchísimas personas celebraron el fin de la amenaza para la Tierra, y Aru, frente a todos, pronunció un discurso seguro de sí mismo sobre la \"reconstrucción\" y el \"desarrollo\". Parecía que con eso todo había terminado.\n\nPero no.\n\n- Aru, soy Nanami Ayaka. No quería admitirlo, pero usted sin duda salvó el mundo. Ahora, por más guerra de opinión que yo haga, es imposible expulsarla del puesto de presidenta del consejo estudiantil. Admito mi derrota. También pienso detener mi actividad como streamer virtual. Sin embargo, antes de eso, por última vez, quisiera reunirme con usted en privado. La esperaré en el palacio anexo Berg, el antiguo palacio de la Casa Ducal de Nassau.\n\n¿Sería una trampa? Tal vez. Pero... Aru no podía ignorar tan fácilmente la oportunidad de encontrarse cara a cara con Nanami Ayaka, quien hasta ahora solo había actuado en SNS.\n\n\"Nosotros te cubriremos, así que vamos a echar un vistazo. A estas alturas, no vamos a perder contra una sola estudiante de Trinity.\" Siguiendo el consejo de Kayoko, todos los miembros de la Agencia 68 decidieron dirigirse al palacio de Berg."
 HEU_event.262.a:0 "Se acerca el final de esta historia..."
 ### Normal Ending ###

 HEU_event.263.t:0 "Y donde comienzan todos los milagros - Fase 1"
 HEU_event.263.desc:0 "Nanami Ayaka, de pie en el pasillo con un fusil automático en las manos, miró la Caja de Shittim con la otra. Perdimos. Contra lo que Arona había predicho, para detener la invasión de [GEI.GetName] no fue necesaria la ayuda de Arona. Esa forajida, solo con su propia fuerza y la de sus compañeros de la Agencia 68, protegió a Kivotos y a la Tierra del gran mal. Por eso, este encuentro no era más que... un encuentro para admitir la derrota. Ayaka sonrió, como pidiendo perdón.\n\n\"Arona. Perdón por haber sido un sensei que no sirvió de nada.\"\n\"No... sensei Damian. Yo solo... fui incapaz.\"\n\nArona se sentó en la silla dentro del monitor.\n\n\"Como IA... yo creía que, siguiendo una ruta *predeterminada* por el algoritmo, solo así se podía llegar al final feliz. Conocer al sensei de Kivotos, que él superara todos los errores de la presidenta del consejo estudiantil, y al final lograra un milagro: una victoria hermosa y armonizada por el destino. Ni siquiera podía imaginar que existiera otro camino. ...Por eso, en un mundo sin el sensei auténtico de Kivotos, yo pensaba que si *yo* no lideraba Schale, la humanidad sin falta iba a perecer...\"\n\"Sí. Está bien. Un estudiante siempre puede fallar. Con ese fracaso acumula experiencia, y crece para convertirse en el adulto que quiere ser. Pero... Arona. Un sensei es distinto. A un adulto que falla no le dan tan fácilmente una segunda oportunidad.\"\n\nMientras decía eso, Ayaka se aseguró la Caja de Shittim en la cintura. Tap, tap. A lo largo del pasillo del Palacio de Berg, se acercaban las cuatro integrantes de la Agencia 68. Sí. El objetivo de Arona era proteger a Kivotos. Aunque el proceso fue distinto a lo que ella calculó, al final Kivotos se salvó, ¿no? Pero el objetivo de Nanami Ayaka... no, el objetivo del original, Damian Krazenberg, aún no se había cumplido.\n\nAyaka sacó el anillo de bodas que había dejado la esposa fallecida de Damian y se lo puso en el dedo, como si con eso pudiera recibir la fuerza de la difunta."
 HEU_event.263.a:0 "\"Te estaba esperando, Rikuhachima Aru.\""

 HEU_event.264.t:0 "Y donde comienzan todos los milagros - Fase 2"
 HEU_event.264.desc:0 "\"¿Tú eres Nanami Ayaka? Con una cara tan bonita, ¿por qué tenías que ser una streamer virtual?\"\n\nApuntando el cañón hacia el halo verde-azulado de Ayaka, Aru no aflojó la tensión. Aunque en números era 4 contra 1, Ayaka la miraba sin el menor rastro de miedo. Con el arma alzada, Ayaka habló con calma.\n\n\"En realidad, esta cara ni siquiera es mi cara verdadera.\"\n\"...¿Qué?\"\n\n\"Aunque te lo diga, no lo entenderías. Yo... perdí demasiadas cosas con la Gran Transición. Mataron a mi familia, y mientras mis estudiantes lloraban escondidos, yo no pude hacer nada. ¡Sangre, y más sangre, sangre! Esa sangre de mierda me sale en sueños todos los días... y sin beber, no podía dormir. Rikuhachima Aru. Los que murieron ese día, ¿cuánto habrá sufrido el Gran Duque Charlotte? ¿Y su familia? ¿Y los ciudadanos de Luxemburgo que murieron solo por estar ahí ese día? ...Tú dijiste que viniste a ayudar a Luxemburgo. Aceptaste la regencia y hasta cuando levantaste el maldito estado de sitio, decías que ibas a esforzarte por los luxemburgueses. ¡¿Entonces por qué?! ¡¿Por qué incluso tú, en quien confié, nos disparaste como esos bastardos de Gehenna y volaste iglesias con bombas?!\"\n\nDe los ojos de Ayaka brotaron lágrimas a borbotones. ¿Qué estaba diciendo? Sobre su cabeza brillaba, sin duda, un halo azul. ¿Por qué, entonces, Ayaka hablaba como una luxemburguesa? Aru, confundida, cerró los ojos con fuerza y los abrió de nuevo. Por un instante, el pasillo del Palacio de Berg se le superpuso al pasillo del Palacio Ducal de Luxemburgo: aquel espacio de muerte donde los cadáveres abatidos por las balas de los alborotadores de Gehenna estaban tirados por todas partes.\n\n\"Yo... lo hice por todos... No, los que me atacaron fueron... los luxemburgueses...\"\n\nEl cadáver de la Gran Duquesa con los ojos abiertos. El recuerdo de cuando cerró los ojos del cadáver que abrazaba a un niño. Aquel día, ¿qué diferencia había entre los alborotadores de Gehenna y Aru, que apuntó su arma hacia la sede del partido de derecha?\n\nMutsuki tiró de Aru hacia atrás. \"¡Aru-chan! ¡Esquiva!\""
 HEU_event.264.a:0 "En ese instante, el cañón de Ayaka escupió fuego."

 HEU_event.265.t:0 "Y donde comienzan todos los milagros - Fase 3"
 HEU_event.265.desc:0 "\"¡Sensei! Ahora que hemos perdido casi toda la potencia, lo único que puedo hacer para protegerlo con cálculo son apenas unos segundos! ...¡Un 1 contra 4 es una locura!\"\n\nIgnorando el grito casi desesperado de Arona, Ayaka avanzó al frente. Gracias al milagro causal que Arona provocó, las balas de Mutsuki, Haruka y Kayoko desviaron su trayectoria y destrozaron paredes y techo. Mantén la calma, Damian Krazenberg. Si solo tienes unos segundos, entonces solo hay que terminarlo dentro de esos segundos.\n\nAyaka rugió y descargó una ráfaga en el abdomen de Haruka, que se había lanzado primero; luego la pateó en el costado. Como papel arrugado, el cuerpo de Haruka rebotó contra la pared. Y entonces, se metió hacia adentro. Si fuera el verdadero Damian, tal movimiento sería imposible. En este instante, al menos el cuerpo de Ayaka era, por completo, aquello que él odiaba: un kivotosiano.\n\nAyaka sometió con disparos a Kayoko, que levantó su pistola con urgencia; luego, cuando Mutsuki se abalanzó gritando, le estrelló la culata en la cara. Con un golpe seco, Mutsuki se deslizó por el pasillo y cayó al suelo. Tras vaciar el cargador contra Kayoko y Mutsuki hasta no dejar una sola bala, Ayaka se quedó frente a Aru, que temblaba sin haber podido disparar ni un tiro.\n\n\"Yo soy Damian Krazenberg. ...Sobreviviente de la masacre de Luxemburgo y sensei de Arona. Quería hablar contigo a solas, presidenta del consejo estudiantil.\""
 HEU_event.265.a:0 "Aru apretó los dientes y, apenas, consiguió levantar el cañón."

 HEU_event.266.t:0 "Y donde comienzan todos los milagros - Fase 4"
 HEU_event.266.desc:0 "\"¿Sensei...? ¿Arona, la IA de Schale?\"\n\"Si lo digo con precisión, sería más bien un profesor de griego. Aunque nunca tuve una sola clase de griego con Arona.\"\n\"No lo entiendo. Tú tienes... un halo...\"\n\"No podía ser de otra manera. El verdadero yo ya murió, y el robot llamado Nanami Ayaka solo heredó los recuerdos de Damian Krazenberg y finge ser Damian. ¿Suena a loco? Ah. Sí, perdí la cabeza. Sé que no estoy cuerdo.\"\n\nAyaka soltó una risita seca y tiró el arma al suelo.\n\n\"Para Arona, el único objetivo era proteger a Kivotos. Con que la nueva presidenta derrotara la amenaza de [GEI.GetName], eso le bastaba. Pero a mí no. ...Yo lo perdí todo con la Gran Transición. Todo. Tú también sabes cuánta gente murió ese día en Luxemburgo. Ese día tú también peleaste junto con los gendarmes. Y aun así... ¿por qué? Pisoteaste nuestra cultura humana y nos trataste como simples objetivos a los que había que civilizar. Así que te lo devolví. Apunté y disparé a tus amigas, hice el mismo desmadre. ¿Y qué? ¿Te sirve para entender la frustración que sentí yo, que sintieron los luxemburgueses aquel día? ¡Nosotros también somos personas! ¡No somos perros entrenados, maldita sea!\"\n\nAyaka agarró a Aru del cuello de la ropa. Sus manos temblaban, y las lágrimas le corrían por las mejillas.\n\n\"Un sensei... un maestro, es un adulto que guía a alguien para que pueda convertirse en aquello que desea ser. ¡Tú no eres ni Führer, ni secretario general, ni emperatriz! ¡Entonces por qué...!\"\n\nLa fuerza se le escapó de los dedos. Ayaka cayó frente a Aru y rompió a llorar con un sollozo desgarrado, golpeando el suelo. Ah... Aru cerró los ojos con fuerza. Quería cambiar el mundo para hacerlo mejor. Pero por culpa de eso, quizá desde algún punto empezó a ver a los locales no como iguales, sino como animales inferiores a los que había que enseñar. Se había enfurecido. Porque la atacaban con terrorismo y hacían sufrir a los suyos."
 HEU_event.266.a:0 "Y aun así... quizá fui demasiado con ellos."

 HEU_event.267.t:0 "Y donde comienzan todos los milagros - Fase 5"
 HEU_event.267.desc:0 "Aru se arrodilló y miró a Ayaka a los ojos. No sabía quién era Damian Krazenberg. Lo que tenía enfrente era un robot que solo había heredado los recuerdos del Damian muerto. A estas alturas, ninguna palabra de consuelo podría llegarle al verdadero Damian. Pero, después de descargar toda su rabia y llorar sobre el suelo... Aru quiso decirle algo.\n\n\"Lo siento.\"\n\nEn cuanto escuchó esas palabras, Ayaka alzó la cara.\n\n\"...La regencia del Gran Duque de Luxemburgo, incluso el juramento y el cargo de continuar a la difunta Charlotte... en algún punto se volvieron algo vago, algo que se desdibujó. Decía que quería un mundo donde kivotosianos y humanos convivieran, pero jamás fui a escuchar la voz de los locales ni una sola vez. ...Y aun así, presidenta del consejo estudiantil, salvadora del mundo. Qué risa, ¿no?\"\n\nAru tomó la mano de Ayaka.\n\n\"No sé qué heridas llevas, ni qué pasado viviste. Pero lo siento por no haber ido yo primero jamás. Lo siento por nunca intentar escuchar sus historias. ...Lo siento por no haber sabido que existió alguien llamado Damian Krazenberg. Sensei.\"\n\nCon ese \"lo siento\", Ayaka volvió a romper en llanto y agachó la cabeza.\n\n\"Eso... esa sola frase... era lo único que quería oír.\""
 HEU_event.267.a:0 "Aferrada a la mano de Aru, ella lloró durante un largo rato."

 HEU_event.268.t:0 "El punto de partida de un milagro universal"
 HEU_event.268.desc:0 "\"Quizá esta disculpa nunca llegue al verdadero Damian... pero aun así, me siento un poco liberada.\"\n\"Entonces me alegra, sensei Damian.\"\n\nMientras Ayaka caminaba hacia el lado opuesto del pasillo, Arona, dentro del monitor, extendió la mano hacia ella.\n\n\"Puede que el sensei Damian no haya sido el verdadero sensei de Kivotos. No tenía la 'tarjeta de adulto', su ideología era rara, y tampoco era perfecto... y aun así. El sensei Damian... fue, de verdad, mi sensei.\"\n\nMientras tanto, Aru fue revisando una por una a las integrantes caídas de la Agencia 68. La primera en despertar fue Haruka, que se arrastró por el suelo buscando su escopeta.\n\n\"S-si ahora la sorprendemos con un disparo... podríamos... reducirla...\"\n\"Ya basta. Qué suerte que las tres solo tengan heridas leves. Vámonos.\"\n\"¿Irnos? Pero, Aru-sama...\"\n\"Yo no tengo derecho a matar a un sensei.\"\n\nAru ayudó a levantarse a Mutsuki y a Kayoko, una por una.\n\n\"...Ese sensei, seguramente, ya estaba muerto desde el mismo día de la Gran Transición.\""
 HEU_event.268.a:0 "Quizá sí."

 HEU_event.269.t:0 "Lo que viene después"
 HEU_event.269.desc:0 "La disculpa de Aru jamás podría llegar al verdadero Damian Krazenberg. Oponente de la Revolución del 68. Aru jamás sabría, en toda su vida, qué clase de hombre fue el verdadero Damian y qué vida vivió. De vuelta en la oficina, Aru se acercó a un rincón del palacio ducal: la urna con los restos de la Gran Duquesa Charlotte, que aún seguía allí.\n\n\"Parece que el cargo de 'regente del Gran Duque' no fue más que una evasión para mí. 'Estoy cambiando el mundo por los luxemburgueses. Ellos al final comprenderán y perdonarán mis decisiones.' Ese tipo de autoengaño. Pero... creo que no era así. La Revolución del 68, sin duda, está cambiando el mundo... pero en ese mundo que cambia, había gente que quedaba abandonada.\"\n\nAru inclinó la cabeza ante la urna.\n\n\"...No puedo revertir lo que ya pasó. Y sé que en el cielo tú no me perdonarás. Aun así, quizá ahora sea mejor intentar hablar, aunque sea un poco, con los locales. Porque en el mundo nunca existe alguien que tenga siempre la razón. Yo nunca intenté comprender qué querían ser los luxemburgueses, qué había en sus corazones.\"\n\nCuando salió del dormitorio, vio que las tres, con curitas en la cara, estaban esperándola. Mutsuki preguntó.\n\n\"¿Ya terminaste de hablar con la Gran Duquesa?\"\n\"Sí.\"\n\"Nuestra Aru-chan tiene un corazón demasiado blando, ese es el problema. Ni siquiera después de convertirse en presidenta del consejo estudiantil cambió.\"\n\"Je. Quizá reprobé el examen de hardboiled.\"\n\nAru caminó con las tres de regreso a la oficina. No se puede cambiar lo que ya ocurrió. Pero el futuro que aún no está decidido sí puede cambiar. La llama de la Revolución del 68 seguirá ardiendo en el consejo estudiantil, pero al menos Aru aprendió una cosa.\n\nNo debe olvidar por qué se convirtió en la regente de Luxemburgo."
 HEU_event.269.a:0 "Al final, \"una revolución en la que yo no pueda bailar\" no es una revolución."

 ### 해피엔딩 ###
