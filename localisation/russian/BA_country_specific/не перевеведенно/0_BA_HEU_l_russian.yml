 HEU_event.151.a.tt:0 "§C\"No todos los kivotosianos que llegaron por el Gran Traslado participaron en masacres o crímenes. Hubo quienes también actuaron para impedirlo.\"§!\n"
 HEU_event.151.b.tt:0 "§C\"En ese incidente, el mal no fue solo Gehenna. En medio del caos, en las cabezas de los luxemburgueses que también participaron en el saqueo no había halos.\"§!\n"
 HEU_event.151.c.tt:0 "§RSi deseas perder deliberadamente este debate, elige esta opción.§!\n"

 HEU_event.152.a.tt:0 "§C\"Podemos resolverlo con educación y leyes. Ya lo hacen así otros países-academia.\"§!\n"
 HEU_event.152.b.tt:0 "§C\"Entiendo perfectamente el miedo que nace de las diferencias culturales. Por eso, la Ley de Derechos Civiles ayudará a superar prejuicios y a comprender al otro con mayor profundidad.\"§!\n"

 HEU_event.153.a.tt:0 "§C\"Los cuernos o alas de quienes vienen de Kivotos no afectan en nada a esta lógica. Yo también tengo cuernos en la cabeza, ¿acaso participé en esa masacre?\"§!\n"
 HEU_event.153.b.tt:0 "§C\"...¿Te parezco un demonio con cuernos? No. ¿Crees que cualquier otra gehenniana podría robar el alma humana o algo así?\"§!\n"

 HEU_event.154.a.tt:0 "§C\"¿Qué ganas atando a la mitad de la población capaz de trabajar y educarse? Mujeres sanas de Kivotos salen a la sociedad. ¿No significa eso duplicar la mano de obra de fábricas, empresas y de toda la sociedad?\"§!\n"
 HEU_event.154.b.tt:0 "§C\"Vaya, se te nota el miedo a obedecer a una mujer... Parece que de niño tu madre no te dio mucho amor.\"§!\n"

 HEU_event.155.a.tt:0 "§C\"En política, 'lo haré después de las próximas elecciones' equivale a decir que no lo harás. Y pedir esperar una generación suena a decir que no piensas corregirlo.\"§!\n"
 HEU_event.155.b.tt:0 "§C\"¿Desde cuándo el presidente del Parlamento se preocupa tanto por la 'opinión pública'? ¿No era usted el abanderado del reaccionarismo luxemburgués?\"§!\n"

 HEU_event.156.a.tt:0 "§C\"Luxemburgo es un Estado soberano. No hay razón para legislar mirando el gesto de otros países.\"§!\n"
 HEU_event.156.b.tt:0 "§C\"Como si el Gran Traslado hubiera ocurrido porque lo quisimos. Fue un accidente. Y yo estoy intentando sanar a las víctimas de ese accidente.\"§!\n"
 HEU_event.156.c.tt:0 "§C\"Siento una profunda empatía y pesar por los daños sufridos por otros países europeos. Pero ese pesar y la situación de quienes viven en Luxemburgo son asuntos distintos.\"§!\n"

