 HEU_event.270.desc:0 "Damian Krazenberg estaba de pie en el pasillo con una pistola en la mano, mientras con la otra miraba dentro de la Caja de Shittim. Perdimos. Contra lo que Arona había predicho, para detener la invasión de [GEI.GetName] no fue necesaria la ayuda de Arona. Esa forajida, solo con su propia fuerza y la de sus compañeros de la Agencia 68, protegió a Kivotos y a la Tierra del gran mal. Por eso, este encuentro no era más que... un encuentro para admitir la derrota. Damian sonrió, como pidiendo perdón.\n\n\"Arona. Perdón por haber sido un sensei que no sirvió de nada.\"\n\"No, sensei Damian. Yo solo... fui incapaz.\"\n\nArona se sentó en la silla dentro del monitor.\n\n\"Como IA... yo creía que, siguiendo una ruta *predeterminada* por el algoritmo, solo así se podía llegar al final feliz. Conocer al sensei de Kivotos, que él superara todos los errores de la presidenta del consejo estudiantil, y al final lograra un milagro: una victoria hermosa y armonizada por el destino. Ni siquiera podía imaginar que existiera otro camino. ...Por eso, en un mundo sin el sensei auténtico de Kivotos, yo pensaba que si *yo* no lideraba Schale, la humanidad sin falta iba a perecer...\"\n\"Sí. Está bien. Un estudiante siempre puede fallar. Con ese fracaso acumula experiencia, y crece para convertirse en el adulto que quiere ser. Pero... Arona. Un sensei es distinto. A un adulto que falla no le dan tan fácilmente una segunda oportunidad.\"\n\nMientras decía eso, Damian se aseguró la Caja de Shittim en la cintura. Tap, tap. A lo largo del pasillo del Palacio de Berg, se acercaban las cuatro integrantes de la Agencia 68. Sí. El objetivo de Arona era proteger a Kivotos. Aunque el proceso fue distinto a lo que ella calculó, al final Kivotos se salvó, ¿no? Pero el objetivo de Damian Krazenberg aún no se había cumplido.\n\nSacó el anillo de bodas que había dejado su esposa fallecida y se lo puso en el dedo, como si con eso pudiera recibir la fuerza de la difunta."
 HEU_event.270.a:0 "\"Te estaba esperando, Rikuhachima Aru.\""

 HEU_event.271.t:0 "Y donde comienzan todos los milagros - Fase 2"
 HEU_event.271.desc:0 "\"¿Tú eres el portavoz de Nanami Ayaka... o algo así? ¿Eres hombre?\"\n\"Yo soy Nanami Ayaka. La apariencia de mujer... perdón. Era una mentira de internet. ¿Te decepcioné?\"\n\"¿Hah? Espera. ¡¿Entonces la voz?! ¡Era totalmente de mujer!\"\n\"Dicen que copiaron tu voz con deep learning. ¿No se te hizo una voz curiosamente parecida a la tuya?\"\n\nCuando terminó el breve intercambio, Mutsuki estalló en carcajadas. \"¡O sea que la streamer virtual famosa, Nanami Ayaka, era un hombre! ¡Ajajaj! ¡Qué locura! ¡Aru-chan se la creyó completita!\"\n\"...¡Voy a cobrar regalías por mi voz! ¡Como si fuera doblaje!\"\n\"Perdón por eso. Pero no podían crear una voz desde cero.\"\n\nDamian habló con sarcasmo mientras avanzaba despacio. Hizo girar la pistola en la mano y luego la apuntó hacia Aru. En ese instante, la sonrisa boba en la boca de Mutsuki se borró.\n\n\"Yo... perdí demasiadas cosas con la Gran Transición. Mataron a mi familia, y mientras mis estudiantes lloraban escondidos, yo no pude hacer nada. ¡Sangre, y más sangre, sangre! Esa sangre de mierda me sale en sueños todos los días... y sin beber, no podía dormir. Rikuhachima Aru. Los que murieron aquel día, ¿cuánto habrá sufrido el Gran Duque Charlotte? ¿Y su familia? ¿Y los ciudadanos de Luxemburgo que murieron solo por estar ahí ese día? ...Tú dijiste que viniste a ayudar a Luxemburgo. Aceptaste la regencia y hasta cuando levantaste el maldito estado de sitio, decías que ibas a esforzarte por los luxemburgueses. ¡¿Entonces por qué?! ¡¿Por qué incluso tú, en quien confié, nos disparaste como esos bastardos de Gehenna y volaste iglesias con bombas?!\"\n\n¿¡Qué!? En cuanto escuchó eso, el pasillo del Palacio de Berg se le superpuso al pasillo del Palacio Ducal de Luxemburgo: aquel espacio de muerte donde los cadáveres abatidos por las balas de los alborotadores de Gehenna estaban tirados por todas partes.\n\n\"Yo... lo hice por todos... No, los que me atacaron fueron... los luxemburgueses...\"\n\nEl cadáver de la Gran Duquesa con los ojos abiertos. El recuerdo de cuando cerró los ojos del cadáver que abrazaba a un niño. Aquel día, ¿qué diferencia había entre los alborotadores de Gehenna y Aru, que apuntó su arma hacia la sede del partido de derecha?\n\nMutsuki tiró de Aru hacia atrás. \"¡Aru-chan! ¡Retrocede!\""
 HEU_event.271.a:0 "En ese instante, Damian disparó una bala de pistola."

 HEU_event.272.t:0 "Y donde comienzan todos los milagros - Fase 3"
 HEU_event.272.desc:0 "\"¡Sensei! Ahora que hemos perdido casi toda la potencia, lo único que puedo hacer para protegerlo con cálculo son apenas unos segundos. ¡¿Cómo va a vencer a un kivotosiano con un cuerpo humano?!\"\n\nIgnorando el grito casi desesperado de Arona, Damian avanzó al frente. Gracias al milagro causal que Arona provocó, las balas de Mutsuki, Haruka y Kayoko desviaron su trayectoria y destrozaron paredes y techo. Apretando los dientes, Damian disparó contra las tres chicas que le bloqueaban el paso hacia Aru.\n\nY bueno... a los 30 segundos lo sometieron y terminó derribado en el suelo. Desde dentro de la Caja de Shittim, se escapó un profundo suspiro de Arona. Lo siento por mi estudiante, pero al menos cumplí el sueño de soltarles una ráfaga, aunque fuera una sola vez, a esos amigos de la Agencia 68 que se reían con esa cara boba. ¿Con eso no basta?\n\nMientras Haruka ataba a Damian y lo obligaba a arrodillarse, Aru, que estaba escondida atrás, salió al frente y apartó la pistola con el pie.\n\n\"Hablemos con calma. Sensei Damian... ¿así era? Sé que me odias. Por eso... quiero escuchar tu historia.\""
 HEU_event.272.a:0 "Aru le hizo una seña a Haruka para que apartara las manos del cuerpo de Damian."

 HEU_event.273.t:0 "Y donde comienzan todos los milagros - Fase 4"
 HEU_event.273.desc:0 "\"No sabía que la señorita Rikuhachima podía ser tan educada. Aunque el puesto de presidenta del consejo estudiantil lo arrebató por la fuerza.\"\n\nIgnorando la pulla de Arona, Aru se sentó en el sofá de una sala de recepción vacía dentro del Palacio de Berg. Dejó a las otras tres esperando en el pasillo por el momento. En la sala solo quedaron Arona y Damian, y Aru sentada enfrente. Damian Krazenberg. Aru nunca había oído su nombre. Pero ya podía adivinar por qué había venido.\n\n\"Tenías muchas quejas sobre la Revolución del 68, ¿no? He oído por encima lo que decías en los streams. ...Aunque hasta ahora no sabía exactamente *por qué* lo odiabas.\" \n\"Ahora ya lo sabes. Sí. Yo soy uno de los muchos afectados por la Gran Transición en Luxemburgo. Por eso, cuando te nombraron regente, te creí. Pensé que tú... serías distinta de los otros kivotosianos. Pero te lo pregunto en serio aquí y ahora. Tú salvaste a Luxemburgo de Gehenna. Entonces ¿por qué con el mismo método tomaste un arma para derribar al gobierno, y con el mismo método...\"\n\nDamian intentó continuar, pero parecía que no podía abrir la boca. Movió los labios durante un buen rato antes de hablar.\n\n\"Puede que tu revolución haya cambiado Luxemburgo para mejor. Tal vez el equivocado era yo. Pero esto empezó en un mal momento, con un mal método. Volviste a golpear a los heridos y trataste de 'civilizarlos'. ¿Eso estuvo mal?\""
 HEU_event.273.a:0 "Aru guardó silencio, esperando a que él terminara de hablar."

 HEU_event.274.t:0 "Y donde comienzan todos los milagros - Fase 5"
 HEU_event.274.desc:0 "\"Total, ni siquiera es alguien con quien se pueda razonar. Si lo fuera, ni habría empezado esa cosa rara de 'revolución'.\"\n\nEn cuanto Arona terminó, Aru soltó un largo suspiro.\n\n\"Yo también intenté esforzarme. Pero... ustedes también me acosaron, hicieron sufrir a los de la Agencia 68, e intentaron echarnos de la tierra de Luxemburgo. ...Claro, ahora entiendo que fue por el trauma de la Gran Transición. Ahora puedo entenderlo... pero en ese entonces pensé que ya no podía aguantar más.\"\n\nSi fuera solo el dolor de Aru, quizá habría podido dejarlo pasar. Pero lo que de verdad no podía tolerar era ver a la gente a su alrededor herida. Y era lo mismo: los locales también tenían heridas, personas comunes que odiaban ver sufrir a los suyos, y que temían a los inmigrantes de Kivotos.\n\nHasta ahora, ¿Aru no los habrá visto solo como monstruos que odiaban a los kivotosianos sin razón? ¿No debió haber intentado que su PTSD pudiera sanar?\n\nClaro, eso no borra lo que le hicieron a la Agencia 68. Pero no lo sabía. Aun así, al menos a este sensei frente a ella... Aru quería decirle una disculpa.\n\n\"Lo siento.\"\n\nDamian soltó un suspiro profundo por un instante, y luego asintió.\n\n\"...Esa frase. ...Esa sola frase era lo que quería escuchar directamente. Por eso esperé todos estos años.\""
 HEU_event.274.a:0 "\"Perdonémonos. Solo... nunca tuvimos la oportunidad de entendernos.\""

 HEU_event.275.t:0 "El punto de partida de un milagro universal"
 HEU_event.275.desc:0 "\"Cuando la conocí al principio, quería darle un golpe en la cara. No pude, pero ahora creo que puedo perdonar a Rikuhachima Aru. Ella también... igual que yo, solo era una persona común herida.\"\n\"Entonces me alegra, sensei Damian.\"\n\nArona extendió la mano hacia Damian a través del monitor.\n\n\"Puede que el sensei Damian no haya sido el verdadero sensei de Kivotos. No tenía la 'tarjeta de adulto', su ideología era rara, y tampoco era perfecto... y aun así. El sensei Damian... fue, de verdad, mi sensei.\"\n\"Sí. Y para mí, tú fuiste mi última estudiante valiosa.\"\n\n\"Si desde atrás le meto un tiro, estaría divertido.\"\n\nA varios metros, en el pasillo, Aru le dio un golpe seco con el canto de la mano al costado de Mutsuki, que refunfuñaba, y se dio la vuelta dejando a esos dos atrás.\n\n\"Deja de decir tonterías y vámonos. ...Aquí ya terminamos lo que veníamos a hacer.\"\n\"¿De verdad estás bien con esto? ¡Capturamos a la agitadora Nanami Ayaka!\"\n\"Yo no tengo derecho a matar a un sensei.\"\n\nCon los brazos cruzados, Aru habló.\n\n\"La razón por la que nos quedamos en Luxemburgo era, desde el principio, para proteger a gente como esa.\""
 HEU_event.275.a:0 "Quizá sí."

 HEU_event.276.t:0 "Lo que viene después"
 HEU_event.276.desc:0 "De vuelta en la oficina, Aru se acercó a un rincón del palacio ducal: la urna con los restos de la Gran Duquesa Charlotte, que aún seguía allí.\n\n\"Parece que el cargo de 'regente del Gran Duque' no fue más que una evasión para mí. 'Estoy cambiando el mundo por los luxemburgueses. Ellos al final comprenderán y perdonarán mis decisiones.' Ese tipo de autoengaño. Pero... creo que no era así. La Revolución del 68, sin duda, está cambiando el mundo... pero en ese mundo que cambia, había gente que quedaba abandonada.\"\n\nAru inclinó la cabeza ante la urna.\n\n\"...No puedo revertir lo que ya pasó. Y sé que en el cielo tú no me perdonarás. Aun así, quizá ahora sea mejor intentar hablar, aunque sea un poco, con los locales. Porque en el mundo nunca existe alguien que tenga siempre la razón. Yo nunca intenté comprender qué querían ser los luxemburgueses, qué había en sus corazones.\"\n\nCuando salió del dormitorio, vio que las otras tres de la Agencia 68 estaban esperándola. Mutsuki preguntó.\n\n\"¿Ya terminaste de hablar con la Gran Duquesa?\"\n\"Sí.\"\n\"Nuestra Aru-chan tiene un corazón demasiado blando, ese es el problema. Ni siquiera después de convertirse en presidenta del consejo estudiantil cambió.\"\n\"Je. Quizá reprobé el examen de hardboiled.\"\n\nAru caminó con las tres de regreso a la oficina. No se puede cambiar lo que ya ocurrió. Pero el futuro que aún no está decidido sí puede cambiar. La llama de la Revolución del 68 seguirá ardiendo en el consejo estudiantil, pero al menos Aru aprendió una cosa.\n\nNo debe olvidar por qué se convirtió en la regente de Luxemburgo."
 HEU_event.276.a:0 "Al final, \"una revolución en la que yo no pueda bailar\" no es una revolución."

 HEU_event.277.t:0 "Parque Conmemorativo de Berg"
 HEU_event.277.desc:0 "Por limitaciones presupuestales y varios problemas prácticos, su escala fue muy pequeña; aun así, se construyó un modesto parque conmemorativo en los terrenos del antiguo Palacio de Berg, donde vivía la Casa Gran Ducal de Nassau en Luxemburgo. El parque se edificó como reflexión por el pasado, reconociendo que el gobierno de Rikuhachima \"no había puesto suficiente atención en sanar las heridas de las víctimas de la Gran Transición\". En el jardín se instaló una gran estela con los nombres de las víctimas de aquel día cuyos registros aún existen.\n\nEl día de la inauguración, el político del Partido Comunista de Luxemburgo, Charles Marx, pronunció un discurso celebrando la construcción del parque. Marx dijo que este parque debía ser un lugar donde la tragedia ocurrida durante la Gran Transición fuera recordada para siempre. Periódicos locales y medios de Kivotos, incluido el diario Kronos, asistieron a la ceremonia y publicaron el discurso de Marx."
 HEU_event.277.a:0 "Demasiado tarde, pero..."

 HEU_event.278.t:0 "Damian Krazenberg"
 HEU_event.278.desc:0 "Aquí yace Damian Krazenberg,\ninstructor de griego de Luxemburgo, sensei de Arona.\n\nUna pequeña lápida cerca del edificio abandonado de Schale. Frente a ella, una chica con un vestido azul se arrodilló y dejó un ramo de flores. ¿Damian Krazenberg... murió? Aturdida, Aru alternó la vista entre la lápida y la chica. La chica se giró como si hubiera notado la presencia de Aru. Era Arona. No sabía cómo una simple IA podía salir fuera de la Caja de Shittim. ¿Sería esto otro \"milagro\" como aquel día en que conoció a Damian?\n\n\"El sensei Damian llevaba mucho tiempo luchando contra un cáncer hepático. ...Perdió a su familia en la Gran Transición, y vivió durante mucho tiempo bebiendo en exceso.\"\n\nArona sonrió con amargura.\n\n\"Yo intenté salvarlo aunque fuera en forma de robot... pero el sensei dijo que alargar su vida hasta ese punto no tenía sentido. Que era hora de que yo 'me graduara' de él y me convirtiera en el adulto que quiero ser.\"\n\"Yo... no sabía que el señor Damian había fallecido. Quería volver a verlo al menos una vez más.\"\n\"Pero ya lo vio una vez. Esa disculpa que escuchó aquel día... con eso el sensei Damian ya quedó lo bastante consolado.\"\n\nArona dudó un momento y luego habló.\n\n\"El sensei Damian me dijo esto. ...Que me convirtiera en el adulto que quiero ser. Yo solo... estaba obsesionada con expulsarla a usted, Aru, y nunca tuve la oportunidad de preguntarme qué adulto quería ser. Así que... aunque sea por un tiempo, ¿me permitiría quedarme cerca y observar su consejo estudiantil? Quiero, a su lado, descubrir qué clase de adulto quiero llegar a ser.\"\n\nNo es que Aru no quisiera gritar \"¡Éramos enemigas!\". Pero su conciencia no le permitió decirle palabras duras a Arona junto a la tumba de Damian. Y al final, ¿no era ya cosa del pasado esa enemistad? Aru soltó un suspiro."
 HEU_event.278.a:0 "\"¿Dónde está la Caja de Shittim? Yo te la llevo.\""

 HEU_event.279.t:0 "Damian Krazenberg"
 HEU_event.279.desc:0 "Aquí yace Damian Krazenberg,\ninstructor de griego de Luxemburgo, sensei de Arona.\n\nUna pequeña lápida cerca del edificio abandonado de Schale. Nanami Ayaka se arrodilló frente a ella y dejó un ramo de flores. Aquí es donde descansa el verdadero Damian Krazenberg. Aru colocó las flores que había preparado junto al ramo de Ayaka.\n\n\"Aunque sea una IA que heredó los recuerdos de Damian... no entiendo cómo pudo hacer streams como streamer virtual con tanta pasión. ...Al final, aunque tengas los mismos recuerdos, yo no soy el verdadero Damian Krazenberg. Entender por completo a otro, incluso compartiendo recuerdos, era imposible.\"\n\"Lo entiendo. A veces ni yo me entiendo a mí misma, y eso que soy la misma persona. Como venir a poner flores a la tumba de una streamer virtual que me jodió la vida.\"\n\"Bueno, eso solo demuestra lo absurdamente buena que eres.\"\n\nAyaka sacó un cigarro.\n\n\"Arona ya se 'graduó'. Como el verdadero Damian murió, ahora ella debe vivir su vida. El sótano de Schale está cerrado, y desde mañana, aunque vengas aquí, ya no podrás encontrarme.\"\n\"Tú también eres Damian. Aunque seas otra persona... compartes la tristeza de la Gran Transición, fuiste el sensei de Arona, y heredaste su voluntad.\"\n\"Se agradece. Lo de 'absurdamente buena' te queda perfecto.\"\n\"...¿Eso fue un gracias de verdad?\"\n\nAyaka sonrió levemente.\n\n\"Por cierto, ¿no piensas contratarme por un tiempo en tu consejo estudiantil?\"\n\"¿A ti, en el consejo estudiantil?\"\n\"Quiero hacer lo que el otro Damian Krazenberg no pudo. ...Quiero vigilar de cerca si de verdad sigues esforzándote por las víctimas de la Gran Transición. Y como mi identidad desapareció, si tú no me haces papeles, me vuelvo ilegal y ni siquiera podría dar clases de griego. ¿Qué dices?\""
 HEU_event.279.a:0 "\"Está bien. ...Trabajemos juntos.\""

 HEU_event.280.t:0 "Confesión"
 HEU_event.280.desc:0 "\"...No es mentira, ni es una broma. Rikuhachima Aru. La única a quien amo eres tú. Esto es una confesión sincera, desde el fondo de mi corazón.\"\n\nHina, con las mejillas encendidas y sin poder ocultarlo, apenas logró seguir hablando mientras le ofrecía un estuche con un anillo de bodas brillante. ¿Una confesión? ¿Y no de cualquiera, sino de la jefa del Comité Disciplinario? Aru sintió un ligero mareo y preguntó.\n\n\"...¿Por qué yo?\"\n\"Porque tú me salvaste. ...Porque te volviste mi esperanza para vivir.\"\n\nA la orilla de sus ojos se le acumularon lágrimas mientras miraba a Aru.\n\n\"Cuando Gehenna se vino abajo una vez, y pensé que todo mi esfuerzo ya no significaba nada... tú me extendiste la mano. Me dijiste que mi esfuerzo no fue en vano. Me enseñaste que, aunque uno se retuerza sin parar en un mundo vacío y absurdo, ese esfuerzo puede tener sentido. Tú... eres mi luz. Eres la esperanza que me permite seguir viviendo. Por eso... déjame estar contigo...\"\n\n\"Ajajá... ni yo, que me las doy de hardboiled, sé cómo se supone que debo reaccionar en una situación así.\""
 HEU_event.280.a:0 "Aru sonrió un momento y aceptó su anillo."

 HEU_event.281.t:0 "Administradora de los Países Bajos"
 HEU_event.281.desc:0 "- El Consejo Estudiantil ha analizado que los habitantes de la antigua región neerlandesa todavía no reconocen la autoridad del Consejo Estudiantil de Kivotos, y que esto se originó por los trágicos derramamientos de sangre causados por algunas estudiantes, incluyendo SRT, justo después de la Gran Transición. Dado que la ex jefa de defensa, Shiranui, ha estado implicada desde entonces como miembro del Consejo en la contención de los excesos de SRT, se considera que comprende bien el flujo de la opinión pública local...\n\nUna orden de asignación escrita por Onikata Kayoko y firmada por Aru. Shiranui Kaya sonrió ampliamente mientras la releía una y otra vez.\n\nEl prólogo era largo, pero la conclusión era simple: se nombra a la jefa de defensa Shiranui Kaya como administradora encargada de la antigua región neerlandesa.\n\nA diferencia de otros jefes que chillaron diciendo que \"no reconocerán a alguien como Aru\" como presidenta del consejo estudiantil, parece que ayudó mucho el hecho de que Kaya siempre, puntualmente, en reuniones oficiales, la llamara \"Presidenta del Consejo Estudiantil\".\n\n\"Un superhombre debe saber leer la corriente de la situación, y tener la política para ponerse del lado ganador.\"\n\nImaginando una placa sobre su escritorio que dijera \"Administradora de los Países Bajos, Shiranui Kaya\", Kaya sonrió feliz."
 HEU_event.281.a:0 "El poder siempre tiene la razón."

 HEU_event.282.t:0 "Humillación"
 HEU_event.282.desc:0 "¿Lo que siento por Aru-chan? Es una amiga de la infancia valiosa, mi compañera en la Agencia 68 y, ajajá... si le agrego algo, una inútil a la que es divertido molestar. Desde que ocurrió la Gran Transición, también tiene ese lado tonto: se queda en esta tierrita donde nadie tiene culpa, luchando como idiota para proteger a gente con la que ni tiene relación.\n\nAru-chan seguramente diría esto, ¿no? Que aunque seas una forajida que no se amarra a reglas, no abandonas a quienes son importantes. Sí. Porque Aru-chan es así. Rikuhachima Aru es de las que \"no renuncian a lo valioso y lo sostienen hasta el final\".\n\nY esa bondad de Aru-chan... me gusta de verdad, y la odio, y me gusta, y la odio, y la odio. La odio.\n\n\"Yo... yo, este...\"\n\"Su Alteza Regente. Se le ve muy sombría. ¿No tiene nada más que decir?\"\n\"¡Ajajá!\"\n\"¡Jajajajaja!\"\n\nVolví a poner, una y otra vez, la grabación del programa de debate en la televisión, sentada en el cuarto. Aru, temblando la voz en un debate al que no estaba acostumbrada. Y el público soltando carcajadas como si estuviera viendo a un mono en el zoológico. Mi Aru-chan estaba ahí, intentando sonreír, recibiendo todas esas humillaciones para proteger a *esos*. Como si hasta las burlas contra ella intentara pasarlas como broma.\n\n- Mutsuki-shachou\n- Ya van varios días que no viene a la oficina y Aru-sama está preocupada\n- ¿Le pasa algo?\n- No soy nadie para aconsejar, pero...\n\nTras ignorar de cualquier modo el Momotalk de Haruka, Mutsuki acarició en silencio su ametralladora. Aru-chan no va a rendirse. *Jamás* puede abandonar a quienes intenta proteger. Así que..."
 HEU_event.282.a:0 "\"Yo la haré rendirse.\""

 HEU_event.283.t:0 "Rechazo de la Ley de Derechos Civiles"
 HEU_event.283.desc:0 "El intento de aprobar la Ley de Derechos Civiles por la vía legal fracasó. El debate público no solo no logró guiar la opinión del pueblo, sino que solo convirtió a Aru en un chiste. En los periódicos aparecieron caricaturas burlándose de la Aru nerviosa, que tartamudeaba.\n\n\"Ugh... si yo hubiera sido una líder mejor...\"\n\nCon un dolor fantasma en el ojo derecho, extirpado por estrés extremo, Aru escribió nuevos planes sobre el papel. Quería proteger los derechos de los kivotosianos persuadiendo a los locales y siguiendo los procedimientos legales, pasara lo que pasara. Usar la fuerza sería fácil... pero eso significaría convertirse, al final, en lo *mismo* que los alborotadores de Gehenna de aquel día.\n\n\"Si yo misma voy a las oficinas de los políticos... si los agarro uno por uno y me inclino suplicando...\"\n\nEso estaba lejísimos del 'hardboiled' que Aru deseaba. También era destrozar su propia dignidad. Pero a estas alturas, ¿no era cierto que ya no había otro camino?\n\nAl final, esto pasó porque yo fui insuficiente.\n\nNo otra persona.\n\nYo tengo que cargar con la responsabilidad."
 HEU_event.283.a:0 "Aún... no quiero soltar la esperanza..."

 HEU_event.2000.t:0 "La caída del Gran Ducado de Luxemburgo"
 HEU_event.2000.desc:0 "El Gran Ducado de Luxemburgo, que presume de casi mil años de historia desde la época del Condado de Luxemburgo en 963, al final ha caído ante la corriente de los tiempos. Por ahora, el ejército del bando de [ROOT.GetName] impondrá un gobierno militar sobre Luxemburgo, y los ciudadanos luxemburgueses tendrán que aceptar que su país ya no existe.\n\nPero no todo ha terminado. Aún queda decidir el destino de “Su Alteza Rikuhachima”, la regente del Gran Ducado de Luxemburgo: la heroína ciudadana que, durante la Gran Transición, impidió la masacre perpetrada por Gehenna y defendió Luxemburgo.\n\n\"......No quiero excusarme con tonterías como que 'hasta perder es hardboiled'. Al final no pude corresponderle a la gente que confió en mí.......\"\n\nRikuhachima Aru, que permanece en el Palacio Ducal, está profundamente desanimada. Aceptó el gobierno militar del ejército de [ROOT.GetName] sin resistirse, y decidió acatar la decisión de [ROOT.GetLeader] respecto a su trato.\n\nSin embargo, no podemos tratar a Rikuhachima Aru como a cualquier otro invasor de Kivotos. A diferencia de los demás, ella es una heroína civil que contuvo la masacre en la Ciudad de Luxemburgo en medio del caos de la Gran Transición. Y desde que fue investida regente de la Casa Ducal por el primer ministro Joseph Bech, en la alta sociedad humana se le reconoce legalmente como noble.\n\nDebemos manejar el destino de Rikuhachima Aru conforme a las prácticas diplomáticas."
 HEU_event.2000.a:0 "Si renuncia al poder político, su Agencia podrá permanecer en Luxemburgo"
 HEU_event.2000.b:0 "Formemos un pequeño gobierno de Luxemburgo para que conserve su título"
 HEU_event.2000.c:0 "Expúlsenla de Luxemburgo"

 HEU_event.2001.t:0 "La caída del Gran Ducado de Luxemburgo"
 HEU_event.2001.desc:0 "Con la caída del Estado de la Agencia 68 que los locales llamaban “Gran Ducado de Luxemburgo”, hemos obtenido el control total sobre Luxemburgo. Con ello, el Estado local de Luxemburgo se ha extinguido y ha comenzado la discusión sobre la Agencia 68, incluida Rikuhachima Aru.\n\nPara los locales, el rango nobiliario de Luxemburgo podría haber sido algo extremadamente sagrado, pero para el Estado kivotosiano de [ROOT.GetName] no tenía un valor particularmente importante.\n\nTras una breve deliberación, se disolvieron tanto Luxemburgo como su dignidad ducal. Se decidió despojar de poder a Rikuhachima Aru y a sus compañeras, para que vivan como simples kivotosianas. Ahora Aru deberá abandonar el Palacio Ducal y buscar un lugar desde donde reiniciar su nueva labor de agencia."
 HEU_event.2001.a:0 "También se acabó su experimento idealista"

 HEU_event.2002.t:0 "Forajida hardboiled"
 HEU_event.2002.desc:0 "\"Aru-chan, ¿puedes cumplir mi último encargo?\"\n\nLo único que quería era construir una comunidad donde los kivotosianos y los locales pudieran vivir en igualdad. Y quería proteger esa comunidad para que no se derrumbara. Para Aru, Luxemburgo no era solo un lugar. Era su convicción: oponerse al nacionalsocialismo y a todo totalitarismo. Por eso no quería que Luxemburgo quedara bajo el dominio de los fascistas del llamado “Estado caballeresco”.\n\nAru había pasado la vida huyendo incontables veces. Si el Comité Disciplinario la perseguía, mudaba la oficina. Si bajaba la renta, mudaba la oficina. Si creía que no podía ganar, huía. Si el encargo era difícil, salía corriendo.\n\nPero ahora ya no podía hacerlo.\n\nEl día de la Gran Transición, cuando vio a la gente ser masacrada por los alborotadores de Gehenna.\nCuando por primera vez en su vida sintió el peso de la “muerte”.\nCuando, dentro del Palacio Ducal, encontró lo que alguna vez fue la Gran Duquesa y su familia, triturados por una ráfaga de subfusil.\n\nAru renunció a la vida de huir. Decidió dedicar el resto de su vida a la imposibilidad de probar que el paraíso existe.\n\n\"No puedo ver...... Aru-chan... no sé si estás a mi lado...... me da miedo...... solo... dime que sigues aquí conmigo......\"\n\"¡Estoy aquí! ¡Estoy aquí...... no te vayas antes que yo...... perdón por ser una jefa tan idiota...... por hablar de hardboiled y forajidas y aun así no poder protegerlos......\"\n\nAsí que Aru nunca le tuvo miedo a morir aquí.\n\nPero cuando sus amigas cargaron con ese peso junto a ella—cuando Haruka, y luego Kayoko, murieron una por una para ganar tiempo para que los refugiados escaparan; cuando Mutsuki regresó cargada por los gendarmes, ciega y con ambas piernas amputadas por un bombardeo de artillería—\n\nun dolor mayor que su propia muerte, una pena eterna que parecía desgarrarle el corazón, cayó sobre ella con un peso insoportable. Podía decidir morir ella misma, pero no podía decidir la muerte de sus amigas.\n\n\"A mí... no me importa... aunque Aru-chan no sea hardboiled...... da igual si eres torpe o no...... porque me gustó... toda Aru-chan.\"\n\nAru cargó a Mutsuki y subió sobre una montaña de cientos de bombas. Con cada paso, le regresaban los recuerdos de cuando fundaron la Agencia 68, de cuando reía y bromeaba con Mutsuki, y de cuando resolvieron incontables encargos juntas... recuerdos que aparecían y se derretían, efímeros.\n\n\"¡La cabecilla de la Agencia 68, Rikuhachima Aru, suelte el arma y ríndase!\"\n\nEn el instante en que los soldados de Trinity irrumpieron en el polvorín, Aru miró a aquellos desechos fascistas desde lo alto y, sujetando el detonador de Mutsuki—que ya no respiraba—lo presionó."
 HEU_event.2002.a:0 "\"Que te jodan.\""

 HEU_event.2003.t:0 "La caída del Gran Ducado de Luxemburgo"
 HEU_event.2003.desc:0 "El Gran Ducado de Luxemburgo, que presume de casi mil años de historia desde la época del Condado de Luxemburgo en 963, al final ha caído ante la corriente de los tiempos. Por ahora, el ejército del bando de [ROOT.GetName] impondrá un gobierno militar sobre Luxemburgo, y los ciudadanos luxemburgueses tendrán que aceptar que su país ya no existe.\n\nPero no todo ha terminado. Aún queda decidir el destino de “Su Alteza Rikuhachima”, la regente del Gran Ducado de Luxemburgo: la heroína ciudadana que, durante la Gran Transición, impidió la masacre perpetrada por Gehenna y defendió Luxemburgo.\n\nA pesar de las complejas relaciones diplomáticas entre Trinity y Gehenna, existe un factor decisivo: ni Rikuhachima Aru, ni los ciudadanos de Luxemburgo, ni el Parlamento luxemburgués consideran que Aru sea Gehenna. Incluso si la dejáramos libre, no hay posibilidad alguna de que se convierta en una resistencia a favor de Gehenna.\n\nEl método más simple sería expulsarla a otro país humano, pasando por un Estado neutral. Dado que, entre los Estados humanos, a Rikuhachima Aru se le reconoce como noble, podría recibir un trato apropiado en el exilio.\n\nLa otra alternativa es permitir que permanezca en Luxemburgo, pero que entregue toda autoridad política al bando de [ROOT.GetNameDef], quedándose solo en un papel simbólico."
 HEU_event.2003.a:0 "Díganle que se vaya a donde quiera."
 HEU_event.2003.b:0 "Que se quede viviendo en Luxemburgo."

 HEU_event.2004.t:0 "Después de la ocupación"
 HEU_event.2004.desc:0 "El Palacio Ducal de Luxemburgo fue saqueado y atacado una vez durante la Gran Transición de 1935 por alborotadores de Gehenna, pero Trinity, siguiendo la orden de Mika, lo preservó sin saquearlo. Al entrar al palacio, Mika encontró marcas de balas que, aunque los subordinados de Aru se esforzaron por borrar, seguían visibles.\n\n\"Hee~. Comparado con el edificio del Tea Party, esto no es nada.\"\n\nGirando la mano en el aire, Mika caminó por el pasillo y entró a la oficina de Aru, cuya puerta estaba abierta. En la pared colgaba el ridículo lema “1 día, 1 maldad”, y la estantería, austera, apenas tenía unos cuantos libros. ¿Se llevó los lujos y huyó? No... más bien, ni siquiera se veía un lugar donde hubiera podido acumular lujos.\n\nMika se sentó en el lugar de Aru y revisó los documentos que quedaron.\n\nLa masacre en la Ciudad de Luxemburgo justo después de la Gran Transición, perpetrada por la facción de Gehenna... y desde que Aru la reprimió, sus dilemas internos—culpa, desesperación, sufrimiento—quedaban expuestos a través de montones de documentos y actas de reunión. Mika no había imaginado que aquella mujer que parecía tan atolondrada pudiera tener un mundo interior así.\n\nAl dejar caer otra acta—ya ni sabía cuántas llevaba—Mika soltó un breve suspiro. Sin saber por qué, sintió que permitir que Rikuhachima Aru escapara con vida no había sido una mala elección."
 HEU_event.2004.a:0 "Esa chica ya no necesita más bad endings"

 HEU_event.2005.t:0 "Los arreglos del Consejo Estudiantil"
 HEU_event.2005.desc:0 "Después de que el Consejo Estudiantil se retiró de las Tierras Bajas, la Agencia 68 las ocupó. Por suerte, los locales no parecían tener intención de resistirse con demasiada energía. Todos parecían estar... “bien”, si se ignoraban esas miradas caídas y ese aspecto sin fuerzas.\n\nLeon Kaufman caminaba por el muelle de Ámsterdam, enviado para investigar y aprovechar la infraestructura de las Tierras Bajas. Claro, sobre Ámsterdam seguía descansando un D.U. absurdamente pesado. Con una pluma entre los labios, Kaufman iba marcando casillas en el informe: ¿infraestructura incompleta? check. ¿instalaciones inundadas? check. ¿bombas de agua insuficientes? check... la pluma no paraba de moverse.\n\n\"Hah, con razón... 'Consejo Estudiantil'. Menuda entrega nos dejaron.\" refunfuñó, revisando el documento. Era un desastre. Las Tierras Bajas llevaban más de un año abandonadas y estaban a punto de colapsar por completo. Hasta daba la impresión de que, para haber trabajado corriendo sobre un suelo tan podrido, el Consejo Estudiantil había sido “sorprendentemente” competente.\n\nPero comentar sobre la incompetencia del Consejo no era su trabajo. Kaufman firmó con un elegante garabato: `L. Kaufman`, y se lo entregó a un nuevo empleado de la Agencia que acababa de llegar."
 HEU_event.2005.a:0 "\"Caray... ni me imagino cómo era hace unos años.\""
 HEU_beneluxfixed_tt:0 "§gPero bueno, lo arreglaremos. Con una frase ligera, Kaufman caminó despacio por el muelle, conversando con los trabajadores del puerto. Preguntan quién era Rikuhachima. Bah... no hace falta decírselo.§!"

 HEU_event.2006.t:0 "La caída del Gran Ducado de Luxemburgo"
 HEU_event.2006.desc:0 "Para el bando de [ROOT.GetName], Luxemburgo es un país complicado. Es muy cercano y familiar porque está gobernado por la facción de Gehenna; pero al mismo tiempo existe hostilidad por la masacre cometida por dicha facción. Tras la ocupación de Luxemburgo, realizamos una discusión profunda sobre el destino de Rikuhachima Aru.\n\nRikuhachima participa incluso en conferencias de la Liga de las Naciones, y entre los locales es tan popular que se la percibe no como “Gehenna”, sino casi como “humana”. El apoyo de los ciudadanos luxemburgueses hacia ella también es sólido. Si, en Luxemburgo ocupado, la convertimos en colaboradora del bando de [ROOT.GetNameDef], podríamos ganar una mayor influencia en la comunidad internacional.\n\nSin embargo, debido a su firme postura antinazi, los nacionalsocialistas también insisten en que debe ser eliminada. Elijas lo que elijas, Luxemburgo ya no es nuestro enemigo."
 HEU_event.2006.a:0 "Ofrezcan a Aru un rango en el ejército [ROOT.GetAdjective]"
 HEU_event.2006.b:0 "¡Hay que colgarla! ¡Envíen un equipo de captura!"

 HEU_event.2007.t:0 "Una carta"
 HEU_event.2007.desc:0 "Para la Agencia 68, Gehenna nunca fue un lugar al que “pertenecieran”. Era la academia que abusó de Haruka. Siendo generosos: la academia con muchas estudiantes con cuernos como Aru. En el mejor de los casos, una academia que les inspiraba mínima neutralidad y máxima desprecio.\n\nEse sentimiento hostil se intensificó todavía más cuando, tras la Gran Transición, estudiantes de Gehenna cometieron incendios, saqueos y asesinatos en la Ciudad de Luxemburgo.\n\nApenas Luxemburgo fue ocupado e inició el gobierno militar, Aru hizo que una de sus seguidoras se disfrazara de ella y se sentara en su lugar. Luego, dejó una carta corta: “No haré absolutamente nada por el amigo fascista del Ejército de Defensa, [ROOT.GetLeader]”, y escapó.\n\nCuando entramos al Palacio Ducal para comunicar la decisión de [ROOT.GetLeader], lo único que encontramos fue a una chica de la facción de Gehenna con una peluca roja barata, sentada con arrogancia, levantando el dedo medio a nuestros oficiales.\n\nAl parecer, aprovechó su estatus de noble luxemburguesa reconocida por la Liga de las Naciones para huir ya hacia un Estado humano. No nos quedó otra que publicar una declaración de condena contra Rikuhachima Aru y contra sus tres amigas que escaparon con ella al exilio."
 HEU_event.2007.a:0 "¡Hasta para huir tiene talento...!"

#기본 이벤트 끝 }}
#{{ 플레이버 이벤트 시작
 HEU.flavor_event.1.t:0 "La marcha de los simpatizantes del Partido de Derecha"
 HEU.flavor_event.1.desc:0 "\"¡Deroguen el sufragio universal de 1919—incluido el voto femenino!\"\n\"¡Expulsen a los demonios de Gehenna de Luxemburgo!\"\n\nNo ha pasado mucho tiempo desde la Gran Transición, y en Luxemburgo siguen los enfrentamientos entre los simpatizantes del Partido de Derecha—un partido reaccionario y antidemocrático de vieja data—y los inmigrantes de Gehenna.\n\nEn particular, en la “marcha de protesta por Luxemburgo” que realizaron hoy miembros del Partido de Derecha, participaron en masa campesinos: su base tradicional. Los campesinos afirman que la aparición de los demonios de Gehenna en Luxemburgo es un castigo divino por el “error” de 1919, cuando se garantizó el sufragio universal y el voto femenino.\n\nEl gobierno de coalición, encabezado por el Partido de Derecha, insiste en que esta protesta es una reunión “espontánea” de sus simpatizantes. Sostienen que no han intervenido en absoluto y que tampoco tienen derecho a impedir una reunión voluntaria de sus militantes.\n\n\"...¿Los echo de una vez, Aru-sama?\"\n\nSea lo que sea que diga el Partido de Derecha, estas manifestaciones de “Aru, lárgate de Luxemburgo” parecen poner a Haruka... bastante... nerviosa. Solo verla manosear su escopeta mirando por la ventana... da incluso una sensación de ligera locura.\n\nEntonces, ¿qué hacemos? Aru, mirando a Haruka con las manos temblorosas..."
 HEU.flavor_event.1.a:0 "\"Haz lo que quieras, pero no mates a nadie.\""
 HEU.flavor_event.1.b:0 "\"Déjalos gritar hasta cansarse. Cuando se haga de noche y haga frío, se irán solos.\""

 HEU.flavor_event.2.t:0 "Misa especial católica"
 HEU.flavor_event.2.desc:0 "\"Hermanos en la fe. En 1 Timoteo 2:11-12 nuestro Señor Dios dice que la mujer debe someterse al hombre, guardar silencio, y no dar instrucciones al varón... pues es el orden natural por el pecado de Eva, que incitó a Adán a comer del fruto prohibido...\"\n\"El régimen de Rikuhachima es antibíblico desde su misma existencia. ¿Cómo puede existir, en esta era civilizada, un país donde una mujer le da órdenes a un hombre? Incluso la anterior Gran Duquesa de Luxemburgo reinaba, pero no gobernaba...\"\n\nDespués de la Gran Transición, las misas hostiles de algunos sacerdotes católicos de Luxemburgo hacia los inmigrantes de Gehenna están agravando cada vez más el conflicto entre kivotosianos y locales.\n\n\"¿No podemos volar con dinamita todas las iglesias de este barrio?\"\n\"Juntemos a los curas y a las monjas y amarrémoslos a un cohete. ¡Mandémoslos al espacio para que conozcan al Dios que tanto aman!\"\n\nIncluso el contenido de los encargos que llegan a la Agencia por parte de estudiantes de Gehenna se está volviendo tan radical que ya es difícil ignorarlo. La situación exige medidas para evitar choques entre la Iglesia y los kivotosianos.\n\n\"La política sí que es dura... No tiene nada que ver con dirigir una agencia.\" Sentada en el escritorio, haciendo girar la pluma entre los dedos, Aru suelta un profundo suspiro."
 HEU.flavor_event.2.a:0 "\"¡Expúlsenlos a todos! ¡Y que esa iglesia rara también cierre!\""
 HEU.flavor_event.2.b:0 "\"Haruka, hay unos villanos a los que puedes 'darles una lección'...\""

 HEU.flavor_event.3.t:0 "Reacción de organizaciones ciudadanas pronazis"
 HEU.flavor_event.3.desc:0 "\"Rikuhachima Aru dice que vino a ayudar a Luxemburgo, ¡pero en realidad lo está destruyendo! Rikuhachima reprimió la fe católica y cerró iglesias. ¡Históricamente, quienes hicieron cosas así fueron únicamente los comunistas!\"\n\nAlgunos fascistas de Luxemburgo, afiliados a organizaciones ciudadanas pronazis, han empezado a oponerse activamente a la orden de cerrar la iglesia que fue el centro de los disturbios.\n\nAlgunos de ellos han izado hakenkreuz en las calles y realizan manifestaciones gritando consignas como: “¡En un Luxemburgo para el pueblo germánico, no necesitamos a los de Kivotos!”"
 HEU.flavor_event.3.a:0 "\"¡Si ellos fueron quienes atacaron primero...! ¿¡Qué se supone que hice mal!?\""
 HEU.flavor_event.3.b:0 "\"Tal vez... me pasé demasiado...\""

 HEU.flavor_event.4.t:0 "Reacción de organizaciones ciudadanas pronazis"
 HEU.flavor_event.4.desc:0 "\"Rikuhachima Aru dice que vino a ayudar a Luxemburgo, ¡pero en realidad lo está destruyendo! Rikuhachima soltó a matones políticos para golpear a sacerdotes y monjas inocentes, ¡y los kivotosianos insultaron nuestra religión! Históricamente, quienes hicieron cosas así fueron únicamente los comunistas!\"\n\nAlgunos fascistas afiliados a organizaciones ciudadanas pronazis—vinculadas a partidos derechistas pronazis en Luxemburgo—salieron a las calles a manifestarse.\n\nAunque la fiscalía de Luxemburgo decidió no procesar a Haruka, los fascistas, enfurecidos por la noticia de la no acusación, organizaron marchas portando banderas con hakenkreuz."
 HEU.flavor_event.4.a:0 "\"¡Si ellos fueron quienes atacaron primero...! ¿¡Qué se supone que hice mal!?\""
 HEU.flavor_event.4.b:0 "\"¿Debí haber buscado otro método...? Puede que haya sido mi error.\""

 HEU.flavor_event.5.t:0 "No vendemos"
 HEU.flavor_event.5.desc:0 "Aunque algunos partidos—incluido el Partido Comunista de Luxemburgo—sostienen el discurso de la “reconciliación entre Kivotos y Luxemburgo”, el movimiento antikivotos del bloque derechista se está radicalizando cada vez más.\n\nAlgunos fascistas que proclaman el nacionalismo alemán, campesinos del norte de Luxemburgo que no sufrieron la masacre durante la Gran Transición, y diversos comerciantes y vendedores locales, están impulsando un movimiento social de “rechazo a Gehenna” para exhortar a restaurantes, tiendas y negocios luxemburgueses a no vender productos a los inmigrantes de Gehenna.\n\nLo afortunado es que la Ciudad de Luxemburgo logró evitar la masacre gracias a la ayuda de Rikuhachima Aru. En torno al Partido Liberal Radical—una fuerza liberal—la clase media urbana y los pequeños ciudadanos expresan un fuerte apoyo al gobierno de Rikuhachima. Es evidente que hay más población apoyando al gabinete que a los fascistas.\n\nEl problema es que una minoría tiene una voz demasiado grande, y esa voz está generando ansiedad entre los kivotosianos. Muchos kivotosianos afirman que la política “demasiado blanda” de Rikuhachima Aru es la que provocó esta confrontación.\n\nEn particular, los de Gehenna están furiosos, diciendo que esto es “un problema que se resuelve con balas”, y que Aru lo está manejando con demasiada “pereza”."
 HEU.flavor_event.5.a:0 "\"...¡Yo también me estoy esforzando de verdad...!\""

 HEU.flavor_event.6.t:0 "¿Estaré haciéndolo mal?"
 HEU.flavor_event.6.desc:0 "\"...¿De repente a qué viene eso, Aru-chan?\"\n\nNormalmente habría hecho una broma o la habría azuzado. Pero quizá por la expresión cansada y deprimida de Aru, Mutsuki respondió con seriedad.\n\n\"¿Es por la gente de esta región?\"\n\"Siento que todos me odian. Los residentes me gritan que me largue todos los días, y la gente de Gehenna susurra que es porque soy incapaz.\"\n\nAru dejó los documentos que tenía en la mano.\n\"En tierras del Pandemonium o del Comité Disciplinario no pasaba esto... ¿Será que, al final, es porque yo no doy el ancho?\"\n\n\"Pero tú no has aplastado a la gente con el ejército, como lo hacen otros de Gehenna, ¿no? Bueno, sí... eso está bastante lejos de lo que tú llamas 'hardboiled'.\"\n\nMutsuki se levantó y le dio unas palmadas en el hombro.\n\n\"Aru-chan no hizo nada malo. Incluso si estuvieras yendo por el camino equivocado, no olvides que todos en la Agencia estamos a tu lado. ¿Okey?\"\n\nAru alzó la mirada hacia el rostro de Mutsuki, que sonreía ampliamente.\nY entonces, sonrió con ella."
 HEU.flavor_event.6.a:0 "\"...Okey.\""

 HEU.flavor_event.7.t:0 "¡Yo soy el Emperador de Alemania!"
 HEU.flavor_event.7.desc:0 "\"En una época donde todos persiguen a este humilde servidor y desprecian su lealtad, que aún exista alguien que no lo olvide... es algo verdaderamente digno de gratitud.\"\n\nEn cuanto recibió la solicitud de convertirse en asesor militar de la Agencia, Wilhelm von Prusia llegó como un rayo y empezó a soltar un discurso ruidoso frente a Aru.\n\nQue, después de perder toda su fortuna, cada día era una lucha, y que por eso agradecía que lo llamaran. Que cuando recuperaran la patria alemana, le otorgaría un título nobiliario a Aru. Que esos junkers (terratenientes) solo hablaban bonito, y que durante la Gran Transición nadie vino a ayudarlo... y así, una cosa tras otra.\n\nSolo después de aguantar con paciencia cerca de una hora de palabrería de “viejo emperador”, Aru por fin pudo hablar:\n\n\"Aunque ahora estés retirado, fuiste emperador de una gran potencia. Pensé que serías un buen socio.\"\n\n\"¡Una decisión excelente! Tal como fue mi antiguo imperio, los soldados de tu Agencia renacerán como el ejército más fuerte de Europa gracias a mi entrenamiento sistemático!\""
 HEU.flavor_event.7.a:0 "...¿Seguro que fue buena idea contratar a este abuelo?"

 HEU.flavor_event.8.t:0 "Digo que soy el Emperador de Alemania..."
 HEU.flavor_event.8.desc:0 "\"Señorita Aru. ¡No puedo tolerar esto de ninguna manera!\"\n\nWilhelm II, elegido hace poco como asesor militar de la Agencia, entró en la oficina con el puño temblándole de rabia.\n\nAl ver su bigote vibrar furiosamente, Mutsuki estalló en carcajadas.\n\"¡Aja ja! ¡El abuelo es buenísimo! ¿El bigote se mueve como una serpiente!\"\n\n\"¡Ese es precisamente el problema de actitud!\"\n\nParece que quedó bastante herido.\nAru se levantó para recibir al emperador.\n\n\"Primero explícame. La Agencia 68 acepta cualquier preocupación o encargo.\"\n\n\"¿Hace falta explicación? Es que estas estudiantes de Gehenna no muestran el menor interés en lo alto que es el rango de un *Emperador*. Actúan como potrillos desbocados, haciendo lo que se les da la gana... ¿Gehenna siempre fue un lugar sin orden ni jerarquías?\"\n\n\"La verdad, no sé mucho sobre Gehenna...\"\n\nIncluso antes de la Gran Transición, había ido a clases menos días de los que faltó. No sabía bien qué tan maleducadas eran las estudiantes de Gehenna.\n\nPero, por lo pronto, parecía necesario calmar a este anciano tan resentido."
 HEU.flavor_event.8.a:0 "\"¿Y si empezamos con un café? Te escucho, cuéntame qué te molestó.\""
 HEU.flavor_event.8.b:0 "\"Cuando uno se enoja, lo mejor es caminar. ¿Salimos a dar una vuelta y me cuentas?\""

 HEU.flavor_event.9.t:0 "El encargo de Su Majestad Imperial"
 HEU.flavor_event.9.desc:0 "A ver... ¿este encargo es de Wilhelm II? Ah, una carta del emperador alemán.\n\nLa leo.\n\n“Estoy al borde de la locura tratando de entrenar militarmente a estas estudiantes de Gehenna tan malcriadas. Para desahogarme, pensaba salir a talar un poco de madera. Pero sería ideal tener compañía para conversar.\n\nSi tienes tiempo, ¿podría venir conmigo, señorita Aru? Me gustaría que lo consideraras también como un ‘encargo’.”"
 HEU.flavor_event.9.a:0 "\"Bueno, es alguien que está usando su tiempo por nosotros. Ir un rato no debería ser problema.\""

 HEU.flavor_event.10.t:0 "La soledad de Su Majestad Imperial"
 HEU.flavor_event.10.desc:0 "\"¡Hraaa! ¡Uaaagh!\" En el bosque del norte de Luxemburgo, Aru balanceó los brazos con fuerza y golpeó con el hacha el grueso tronco de una pícea. ¿Dicen que en la Tierra hay menos 'misticismo' que en Kivotos? La madera cedía bien a los golpes. Pero le dolía muchísimo el hombro.\n\n\"Haa... haa... perdón. Ya no puedo más.\"\n\nMientras Aru se desplomaba junto al árbol caído, Wilhelm ya había partido varios árboles y los había hecho leña.\n\n\"No se entiende si ustedes son fuertes o débiles. ¿Esto es difícil?\"\n\"¡Sí!\"\n\"¡Ja, ja, ja!\"\n\nQue el emperador tuviera como hobby la tala... Aru no lo sabía hasta ahora. ¿Habrá otro emperador con un gusto tan raro?\n\nTras tumbar unos cuantos árboles más, Wilhelm se sentó al lado de Aru.\n\n\"Gracias. Desde que vine a Luxemburgo, sentía que me habían abandonado por completo... pero, al menos tú te tomaste la molestia de preocuparte por mí.\"\n\n\"Solo pensé que podrías ser útil para la Agencia. No hay una intención especial.\"\n\n\"Ja. Aun así, no importa... Y, por cierto, ¿puedo hacer un pequeño encargo a la Agencia?\"\n\"¿Un encargo?\"\n\nWilhelm dudó un instante.\n\n\"No puedo volver a ser emperador de Alemania... pero cuando liberemos Alemania, me gustaría que al menos se le devolviera el control del país a alguno de mis parientes.\""
 HEU.flavor_event.10.a:0 "\"...No sé si se podrá, pero lo voy a considerar.\""

 HEU.flavor_event.11.t:0 "La Línea Schuster"
 HEU.flavor_event.11.desc:0 "El ingeniero jefe, Joseph Schuster, desplegó los planos de la barrera que diseñó frente a Kayoko, la jefa de la Agencia, y Emil Schpeller, representante del ejército luxemburgués. En el mapa, varios puntos marcaban dónde se instalarían barricadas y muros de hormigón.\n\nCon voz segura, Schuster dijo:\n\n\"Si completamos la construcción de los muros y los puestos de vigilancia, podremos identificar y anticipar todas las rutas de movimiento del enemigo que intente entrar a Luxemburgo.\"\n\nSchpeller carraspeó.\n\n\"La idea de levantar fortificaciones de hormigón por toda la frontera es excelente, pero... ¿por qué mezclar tramos de alambre de púas y hacer una fortaleza tan endeble? Podríamos hacerlo como la Línea Maginot: unirlo todo a lo largo de la frontera.\"\n\n\"Con franqueza, general... Luxemburgo es una llanura demasiado abierta. No es un terreno adecuado para construir una línea de fortificaciones.\"\n\n\"Entonces, ¿cuál es el valor de esta fortaleza?\"\n\n\"Al menos hará que el poder blindado del enemigo se retrase unos cuantos minutos frente a los obstáculos, y en ese lapso cumplirá la función de avisar al grueso de nuestras fuerzas de que 'la invasión ha comenzado'.\"\n\nUna fortaleza no para detener al enemigo, sino solo para ganar tiempo. Schpeller, que quería que la Línea Schuster fuese la “Maginot” de Luxemburgo, se veía incómodo.\n\nKayoko intervino:\n\n\"Si lo vemos con realismo, Schuster tiene razón. Con que nos compre unas decenas de minutos, ya nos da tiempo para poner al ejército en postura de combate.\""
 HEU.flavor_event.11.a:0 "\"...Y si el poderío de Gehenna se nos viene encima, ni arrancando la Maginot entera serviría de algo.\""

 HEU.flavor_event.12.t:0 "El sueño del Imperio Alemán se desvanece"
 HEU.flavor_event.12.desc:0 "\"Que yo, el antiguo príncipe heredero del Gran Imperio Alemán, termine siendo general de Luxemburgo...\"\n\nWilhelm III soltó un suspiro mientras ajustaba los botones del uniforme. Tras la caída del régimen imperial, sabía que la vieja gloria no volvería.\n\nPero al menos creyó que podría ser general del “Estado alemán”. ¡No del “Estado luxemburgués”!\n\nY aun eso no lo habría logrado sin la amable “compasión” de Rikuhachima Aru, en este exilio al que siguió a su padre.\n\nMirándose al espejo, Wilhelm III forzó una sonrisa."
 HEU.flavor_event.12.a:0 "\"Yo también tengo que comer.\""

 HEU.flavor_event.13.t:0 "Aunque sea el detestable Comité Disciplinario..."
 HEU.flavor_event.13.desc:0 "\"No tengo buenos recuerdos del Comité Disciplinario, pero aun así... si puede ayudar a Aru-sama... usar sus estrategias también... podría ser una opción.\"\n\nAnte la tímida sugerencia de Haruka, Kayoko asintió.\n\n\"Yo también lo creo. Incluso antes de la Gran Transición, el Comité Disciplinario era una organización paramilitar grande, y tenía muchas técnicas prácticas de combate.\"\n\nAunque nadie en la Agencia 68 diría que le cae bien el Comité Disciplinario, todos admitirían que su capacidad de combate es fuerte.\n\nY ahora que la Agencia 68 ya no es solo un grupo de cuatro, aprender del enemigo también será una elección inevitable para sobrevivir."
 HEU.flavor_event.13.a:0 "Kayoko organizó en su cuaderno un plan de reforma militar para presentárselo a Aru."

 HEU.flavor_event.14.t:0 "Un mar para Luxemburgo"
 HEU.flavor_event.14.desc:0 "El comandante de la gendarmería, Emil Schpeller, cerró el expediente y salió del edificio.\n\nDesde el día de la Gran Transición, en su interior siempre había tenido sentimientos encontrados respecto a la nueva regente de Luxemburgo.\n\nLos demonios de Gehenna que le volaron un brazo.\nAun si Aru fuera legalmente la regente del Gran Ducado, seguía siendo una “inhumana” con halo.\n\nPero...\n\n\"Que Luxemburgo... llegue a tener una marina...\"\n\nDe pie en el puerto militar luxemburgués, mirando el mar abierto, Schpeller alzó la vista hacia la bandera de la Agencia 68 ondeando en el cielo.\n\nEra absurdo. Que esa regente tan sospechosa lograra un éxito así... le parecía increíble.\n\nY sin embargo.\n\nEso ocurrió.\n\n\"Su Alteza la Regente... al final cambió la historia de Luxemburgo.\""
 HEU.flavor_event.14.a:0 "El general Schpeller sonrió."

 HEU.flavor_event.15.t:0 "Arte maravillosa"
 HEU.flavor_event.15.desc:0 "\"¡Ta-dán! Miren todos. ¡Este es mi plan secreto, preparado con mucho esfuerzo, para salir del catolicismo!\"\n\nPor la mañana, Aru repartió de repente una hoja de “propuesta” a cada miembro de la Agencia.\n\nHaruka, leyendo el documento, murmuró como recitando:\n\n\"...¿Miaokyo?\"\n\n\"La Iglesia católica anda molestando a las estudiantes de Kivotos diciendo cosas como ‘las mujeres no deben salir de la cocina’ y demás, ¿no? Así que pensé: ¿y si hacemos que los católicos de Luxemburgo crean en otra religión?\"\n\nMutsuki ladeó la cabeza.\n\n\"¿Pero por qué precisamente gatos?\"\n\n\"Porque a Kayoko le gustan los gatos... digamos que lo pensé un poco por ella.\"\n\n\"Cof.\" Al carraspear, las mejillas de Kayoko se tiñeron de rojo al instante.\n\n\"Oiga, jefa... sí me gustan los gatos, pero no tanto como para querer arrodillarme y rezarles...\"\n\n\"¿Ah? ¿No?\"\n\n\"¡Aja ja! Aru-chan, ¡tu cara de pánico es demasiado buena!\"\n\n\"E-esto, Aru-sama... yo también creo que una religión de gatos es... un poco... ¿y si mejor Aru-sama se convierte en una diosa?\"\n\n\"E-eso me daría vergüenza... A ver, o sea... yo pensé que era un buen plan... ¿nadie está a favor?\"\n\nKayoko soltó un suspiro.\n\n\"Es el peor plan imaginable.\""
 HEU.flavor_event.15.a:0 "\"Entonces... bueno... sí... hagamos como si no hubiera pasado.\""
 HEU.flavor_event.16.t:0 "La respuesta de Jean-Paul Sartre"
 HEU.flavor_event.16.desc:0 "Yo también he quedado profundamente impresionado por la revolución anti-autoritaria y deconstructiva que se está llevando a cabo en el Gran Ducado de Luxemburgo. Le agradezco que haya invitado a un simple novelista desconocido como yo, y procuraré encontrarme con usted en Luxemburgo lo antes posible. Me emociona la idea de ver y vivir en persona la revolución que está sucediendo allí.\n\nJean-Paul Sartre"
 HEU.flavor_event.16.a:0 "¡Qué buenas noticias!"

 HEU.flavor_event.17.t:0 "La respuesta de Emma Goldman"
 HEU.flavor_event.17.desc:0 "Es cierto que su revolución en Luxemburgo tiene aspectos preocupantes. Pero también es cierto que, hasta ahora, ningún político europeo ha intentado de verdad luchar por los derechos y la liberación de las mujeres, ni por quienes viven oprimidos. Su revolución tiene, sin duda, elementos positivos y negativos; aun así, iré a verle en persona para comprender cómo avanza la Revolución del 68 en Luxemburgo.\n\nEmma Goldman"
 HEU.flavor_event.17.a:0 "¡Qué buenas noticias!"

 HEU.flavor_event.18.t:0 "Jean-Paul Sartre — Paseando por Luxemburgo"
 HEU.flavor_event.18.desc:0 "...Si he decidido participar directamente en la Revolución del 68 y escribir este ensayo, es porque el rumbo liberal y anti-autoritario de Luxemburgo es, a la vez, tan radical como nunca antes se había visto, y beneficioso no solo para los kivotosianos llegados con la Gran Transición, sino también para la humanidad.\n\nAlgunos opositores afirman que Rikuhachima Aru sueña con la aniquilación de la “civilización” humana, pero en realidad lo que Rikuhachima Aru y sus partidarios desean es erradicar la “barbarie” de la humanidad.\n\nLiberación de las mujeres, liberación del autoritarismo, liberación de la religión... Los estudiantes que participan en la Revolución del 68 se preguntan “por qué” existe el viejo orden que los ha oprimido, y buscan reconstruirlo por completo en un sistema totalmente nuevo.\n\nAquí no hay el libertinaje bárbaro ni la violencia anárquica que mencionan los opositores. Quienes ejercen la violencia son únicamente los seguidores del viejo orden, y los revolucionarios solo emplean una violencia mínima cuando responden a esa agresión.\n\nQuiero decirlo con orgullo: ¡que todas las academias de Kivotos, y también todos los países humanos, participen en la Revolución del 68!\n\nCuestionen el sistema existente. Cuestionen por qué existe el orden que los oprime. Y cuestionen... incluso su propia fe..."
 HEU.flavor_event.18.a:0 "Y prohíban prohibir"

 HEU.flavor_event.19.t:0 "Emma Goldman — Reunión a solas con Rikuhachima Aru"
 HEU.flavor_event.19.desc:0 "\"Es evidente que su ‘revolución’ por las mujeres, los trabajadores y los oprimidos tiene aspectos positivos que la distinguen de las revoluciones tradicionales. Está avanzando hacia una libertad que otros revolucionarios nunca han iluminado, y hacia el sueño de una comunidad para todos.\"\n\nAun diciendo eso, Goldman observó a Aru—sentada frente a ella en el sofá—con una mirada preocupada.\n\n\"Pero, señorita Rikuhachima, desde que tomó el poder usted ha seguido incrementando el gasto militar hasta un punto que Luxemburgo difícilmente puede soportar.\" \n\nHablé con esta mujer llamada Goldman. En lo de limpiar el orden opresivo, coincidíamos. Pero Aru no podía aceptar el ideal pacifista de Goldman: disolver todos los ejércitos y esperar a que los trabajadores de otros países se sumaran voluntariamente a la revolución.\n\nAru dio un sorbo a su té negro.\n\n\"Creo que si dirigiéramos Luxemburgo como dices, en dos semanas estaríamos destruidos. Al contrario: hay que aumentar aún más el ejército y empujar por la fuerza a los poderes locales corruptos de alrededor...\"\n\n\"¿No es eso más bien una adaptación de la teoría de la revolución permanente de Trotsky a su propia revolución?\"\n\n\"Yo no sé de Trotsky ni de políticos terrestres... Solo... me esfuerzo por las personas que quiero proteger.\" \n\n\"Entonces quiero señalarle que la dirección de ese esfuerzo está desviándose.\" \n\nGoldman se levantó.\n\n\"Su revolución, señorita Rikuhachima, sin duda está mejorando el mundo. Planeo quedarme un poco más en Luxemburgo. Pero si no cambia ese modo de pensar militarista, la revolución fracasará inevitablemente.\""
 HEU.flavor_event.19.a:0 "Aru no dijo nada hasta que ella se fue."

 HEU.flavor_event.20.t:0 "La llama de la revolución no se apagará"
 HEU.flavor_event.20.desc:0 "La llama de la libertad, que empezó a arder con la Revolución del 68, estaba incendiando Luxemburgo entero.\n\nEn una situación así, la noticia de una invasión extranjera no hizo que las numerosas estudiantes de distintas academias reunidas en Luxemburgo se acobardaran; al contrario, las unió.\n\nLas estudiantes de las alianzas escolares de Kivotos no tenían un “patriotismo” que las atara entre sí, pero sí compartían un “amor por la tierra” y la convicción de que debían proteger esta comunidad creada para la libertad.\n\nEstudiantes venidas de Gehenna, Trinity, Millennium y otras academias presentaron voluntariamente solicitudes de alistamiento en el ejército luxemburgués.\n\nNo para proteger su academia, sino para proteger la Revolución del 68."
 HEU.flavor_event.20.a:0 "Así terminarán los opresores"

 HEU.flavor_event.21.t:0 "Revolución del 68 — ¿voluntarios o estorbos?"
 HEU.flavor_event.21.desc:0 "Crear una comunidad cultural libre de Kivotos, liberada de la opresión de la civilización local. El movimiento del 68 de Rikuhachima Aru entusiasmó a estudiantes de todo Kivotos, y muchas emigraron al Gran Ducado de Luxemburgo.\n\nSin embargo, en ese proceso, las estudiantes de Red Winter que llegaron trajeron un nuevo problema para la dirección de la revolución.\n\nLa “revolución” que Aru quería era, sencillamente, impedir que las estudiantes de Kivotos sufrieran discriminación por la cultura local opresiva. Pero las estudiantes de Red Winter—personas a las que se les llama “trotskistas”—piensan que no basta con una revolución cultural: también deben llevarse a cabo reformas comunistas en el ámbito económico.\n\nRikuhachima Aru no desea que su revolución se “tiña de rojo”. Por suerte, los revolucionarios provenientes de Red Winter no son tantos.\n\nLas estudiantes que lideran el 68 siguen siendo, principalmente, las de Gehenna: la “Academia de la Libertad”, físicamente más cercana a Luxemburgo.\n\nAun así, ¿no debería Aru decir algo antes de que la ola del trotskismo se expanda? O quizá seguir callada también pueda ser una alternativa."
 HEU.flavor_event.21.a:0 "Sea como sea, que venga más gente siempre es bueno"

 HEU.flavor_event.22.t:0 "El sospechoso pudín de las estudiantes de Red Winter"
 HEU.flavor_event.22.desc:0 "Con frecuencia se ve a las estudiantes de Red Winter, que vinieron “por la revolución”, compartiendo con estudiantes de otras academias un pudín extraño, asegurando que “así se puede obtener una comprensión profunda del trotskismo”.\n\nNo se entiende qué relación hay entre el trotskismo y el pudín, pero la policía de Luxemburgo consiguió una porción y concluyó que contenía ingredientes como hongos con efectos alucinógenos.\n\nParece ser parte de un intento algo “místico” de comprender las enseñanzas de Marx-Lenin mediante un estado de iluminación inducido por hongos.\n\nLa policía reportó que el pudín no parece generar adicción, pero un dictamen médico advirtió que, si se consume en grandes cantidades, podría acumular toxinas hepáticas a un nivel peligrosamente alto."
 HEU.flavor_event.22.a:0 "\"¡Misticismo mis huevos! ¡Confisquen todo de inmediato!\""
 HEU.flavor_event.22.b:0 "\"Si no es adictivo... bah, déjalas hacer lo que quieran.\""

 HEU.flavor_event.23.t:0 "¡Queremos libertad!"
 HEU.flavor_event.23.desc:0 "\"¡Implementen clases al estilo Gehenna!\"\n\"¡Ocupen todas las escuelas de Luxemburgo!\"\n\"¡Queremos debate libre!\"\n\nA medida que la llama de la Revolución del 68 arde con más intensidad, también se vuelven más activas las acciones de las estudiantes de Gehenna—el grupo más numeroso dentro de la población kivotosiana de Luxemburgo.\n\nEl movimiento de la “Academia Libre”, liderado por estudiantes de Gehenna, es un ejemplo representativo.\n\nEstos “libre-academistas” han ocupado con armas de fuego instalaciones de preparatorias y universidades en Luxemburgo, y exigen suspender las clases “unilaterales” donde maestros y profesores escriben directamente en el pizarrón.\n\nEn su lugar, sostienen que, como en Gehenna, todas las escuelas de Luxemburgo deberían adoptar un sistema de asistencia autónoma (para sorpresa de Aru: dicen que en Gehenna podías faltar sin ni siquiera presentar justificante), y que en vez de una clase del docente, solo se reproduzcan BD o material audiovisual en el aula para que el alumnado estudie en un ambiente más libre.\n\nLos docentes luxemburgueses se oponen con fuerza, afirmando que, si empieza esta “enseñanza al estilo Gehenna”, en unos años la tasa de analfabetismo de Luxemburgo se multiplicará.\n\nAun así, este movimiento podría ser una oportunidad para aplicar en las escuelas luxemburguesas una relación más horizontal entre maestros y estudiantes, así como el ambiente anti-autoritario de estudio característico de Gehenna."
 HEU.flavor_event.23.a:0 "\"¡Que las escuelas de Luxemburgo también sean al estilo Gehenna!\""
 HEU.flavor_event.23.b:0 "\"Pero... asistir es obligación del estudiante... ¡No! Yo soy la jefa, ¡así que soy la excepción!\""

 HEU.flavor_event.24.t:0 "¿Francés o alemán?"
 HEU.flavor_event.24.desc:0 "Para los kivotosianos, la Revolución del 68 era una lucha por una revolución liberal; para los locales, era algo incomprensible.\n\nPero al menos algunos intelectuales lograron entender, aunque fuera vagamente, el concepto de “liberalismo”. Dentro del Partido Liberal Radical de Luxemburgo estalló una gran discusión tras la revolución: el problema del idioma.\n\nLuxemburgo era una sociedad bilingüe donde se usaban dos lenguas: alemán y francés.\n\n¿Cuál debía tener prioridad?\n\nLos radicales dentro del Partido Liberal Radical defendieron enfatizar el francés, resaltando especialmente que Francia es la nación de la “Revolución Francesa”. Afirmaban que la expansión del francés equivalía al espíritu revolucionario y al espíritu de la libertad.\n\nEn cambio, los monárquicos preferían el alemán.\n\nSe difundió la idea de que el alemán, comparado con el francés, sonaba mucho más “disciplinado y militar”, y que era necesario preservarlo para proteger a la regente Rikuhachima frente a las amenazas de los países vecinos.\n\nPor supuesto, la postura de que el gobierno debía escoger obligatoriamente uno de los dos idiomas no tenía muchas probabilidades de volverse popular.\n\nAun así, el debate lingüístico influyó, aunque sea en parte, a los intelectuales de todo Luxemburgo."
 HEU.flavor_event.24.a:0 "\"...¿No podemos usar simplemente inglés?\""

 HEU.flavor_event.25.t:0 "¡Protejan el francés!"
 HEU.flavor_event.25.desc:0 "Con la intención de derribar la cultura local “opresiva” y difundir la cultura libre de la Revolución del 68, algunos intelectuales realizaron una manifestación callejera de “defensa del francés”.\n\nEn el proceso, campesinos afiliados al antiguo Partido de Derecha se enfrentaron a los manifestantes.\n\nAmbos bandos chocaron rápidamente en la calle, y durante el enfrentamiento un campesino recibió un golpe en la cabeza y murió.\n\nEl Partido Liberal Radical, que había apoyado esta protesta, anunció en un comunicado oficial que pediría disculpas a la familia del campesino.\n\nPero parece claro que, por este caso, el Partido Liberal Radical—la mayor fuerza monárquica de Luxemburgo—ha sufrido cierto desgaste político."
 HEU.flavor_event.25.a:0 "Es una tragedia."

 HEU.flavor_event.26.t:0 "Trotsky contra Stalin"
 HEU.flavor_event.26.desc:0 "Activistas trotskistas provenientes de Red Winter han empezado a entrar en conflicto con el partido comunista local de Luxemburgo.\n\nEl líder del Partido Comunista de Luxemburgo, Zénon Bernardt, insistió en que todos los partidos comunistas deben respetar la norma “un país, un partido” enseñada por Iósif Stalin, y exigió que las estudiantes de Red Winter se afiliaran al Partido Comunista de Luxemburgo y rechazaran la política “revisionista” de Trotsky.\n\nSin embargo, las estudiantes de Red Winter sostuvieron que no tienen obligación alguna de seguir la línea del “socialismo en un solo país”, y contraofertaron: que el Partido Comunista de Luxemburgo se integrara a sus actividades del “club revolucionario trotskista”.\n\nParece que Zénon Bernardt concluyó que era imposible persuadirlas y decidió no emitir ningún comentario."
 HEU.flavor_event.26.a:0 "¿Por qué los comunistas tienen tantas facciones?"

 HEU.flavor_event.27.t:0 "¿Rikuhachima Aru, presidenta del Consejo Estudiantil General?"
 HEU.flavor_event.27.desc:0 "\"No sé qué función tiene eso de la presidencia del Consejo Estudiantil General dentro de la sociedad de Kivotos antes de la Gran Transición.\"\n\nEl primer ministro Joseph Bech habló con evidente molestia, aunque controlando sus emociones lo suficiente como para no irritar a Aru.\n\n\"Pero si Su Alteza la Regente pasa a ser la representante de Kivotos... ¿qué ocurre con el estatus de Luxemburgo? No quisiera que el Gran Ducado quedara anexado bajo el Consejo Estudiantil General.\"\n\nDurante el intento de golpe del Partido de Derecha la última vez, Joseph Bech pudo conservar el cargo de primer ministro alegando que “no sabía” del plan.\n\nAru tampoco le guardaba gran rencor a Bech, ya que él no la traicionó a ella ni a la Agencia 68.\n\nCon una sonrisa confiada, Aru levantó ligeramente la taza de té negro.\n\n\"El Consejo Estudiantil General no es un país, sino una organización internacional. Si lo comparo con aquí... sería como la Sociedad de Naciones.\"\n\n\"...La Sociedad de Naciones, hm.\" \n\n\"Así que ser presidenta del Consejo y que Luxemburgo siga existiendo son cosas separadas. ¿Así se entiende más fácil?\"\n\n\"Entonces me tranquiliza. Como primer ministro de Luxemburgo... tengo el deber de preservar la continuidad de este país.\" \n\n\"No te preocupes. Mientras yo esté aquí, Luxemburgo seguirá siendo un paraíso donde locales y kivotosianos vivan en igualdad.\" \n\nComo para tranquilizarlo, Aru se bebió el té de un solo trago.\n\n\"¡Agh, está caliente! ¡Cof! ¡Cof!\""
 HEU.flavor_event.27.a:0 "\"¡Ay, qué caliente! ¡Ack! ¡Cof! ¡Cof!\""

 HEU.flavor_event.28.t:0 "La expansión de la Revolución del 68"
 HEU.flavor_event.28.desc:0 "\"¡Prohibido prohibir! ¡Quiero una revolución en la que pueda bailar!\"\n\nEl movimiento rikuhachimista, que nació en la Agencia 68 y adquirió el nombre de “Revolución del 68”, está influyendo también en diversas academias de Kivotos.\n\nEsta revolución, compuesta por tres ejes—“oposición a la autoridad”, “rechazo de la cultura local” y “antirreligiosidad”—proclama la unidad y la libertad de todos los kivotosianos.\n\nVarias academias, incluido [ROOT.GetName], han visitado Luxemburgo para ver la revolución y han regresado; ahora también aparecen estudiantes que difunden estas ideas en nuestro país.\n\nComo esta revolución se opone al autoritarismo, es inevitable que pueda fomentar fuerzas opositoras a nuestro sistema de [ROOT.GetName].\n\nAunque el bando de [ROOT.GetLeader] reprima a los estudiantes que lideran la Revolución del 68, no sería una decisión extraña.\n\nSin embargo, algunos optimistas esperan que el espíritu libre del 68 abra oportunidades de debate más amplias en nuestra comunidad académica y permita que los intelectuales compartan más enseñanzas."
 HEU.flavor_event.28.a:0 "Sumémonos a la revolución"
 HEU.flavor_event.28.b:0 "Esto debe prohibirse con firmeza"

 HEU.flavor_event.29.t:0 "La seguridad es lo primero"
 HEU.flavor_event.29.desc:0 "El comandante de la gendarmería, Emil Schpeller, fue al palacio y habló primero con tono preocupado.\n\n\"Su Alteza la Regente. Me han dicho que el arma que usaba antes era demasiado grande como para llevarla por la calle.\" \n\n\"En Kivotos, portar un arma es lo normal, pero... parece que en Luxemburgo no es así. Estoy intentando adaptarme a la cultura local.\" \n\n\"Es digno de elogio que, como regente, respete e intente comprender la cultura de su país. Pero, Alteza... para el caso de que ocurra otro atentado como el de la última vez, necesita al menos un nivel mínimo de armamento.\" \n\nEl último atentado... Aru sintió cómo el dolor fantasma le subía por la espalda. Había sufrido violencia brutal a manos de cinco fascistas.\n\nSchpeller sacó un sobre de su bolsa y lo dejó sobre el escritorio.\n\n\"Su Alteza. Es una pistola belga, la que se distribuye a los oficiales de la gendarmería de Luxemburgo.\" \n\nAru sacó la pistola del sobre y la sopesó. Las balas venían en una bolsa de papel aparte.\n\nSin que ella se lo pidiera, él le había traído un medio de defensa personal. Aru se sintió agradecida... y también un poco culpable.\n\n\"Debería cuidar de mí por mi cuenta. Perdón por hacer que los demás se preocupen... Gracias.\" \n\n\"Si lo desea, podemos asignarle escolta personal.\" \n\n\"No hace falta llegar a tanto. Tengo a mis amigas de la Agencia. Pero... usaré bien esta pistola.\""
 HEU.flavor_event.29.a:0 "Porque la seguridad es lo primero"

 HEU.flavor_event.30.t:0 "¿Hasta dónde debe ser revolución una revolución?"
 HEU.flavor_event.30.desc:0 "Algunas estudiantes de Gehenna, exigiendo “más libertad” tras la Revolución del 68, intentaron hoy tomar el Ministerio de Defensa de Luxemburgo y llevar a cabo la operación “paz mediante la libertad”, declarando la disolución del ejército.\n\nFueron reprimidas.\n\nLas pacifistas radicales de Gehenna rompieron la puerta del ministerio con martillos y agredieron a la gendarmería que acudió a controlarlas.\n\nKayoko, de la Agencia 68, se presentó personalmente en la escena y, mediante un megáfono, señaló los problemas de un “movimiento no violento mediante la violencia”, logrando que las manifestantes se dispersaran a duras penas.\n\nPor fortuna no hubo muertos.\n\nSin embargo, seis soldados del ejército luxemburgués que se enfrentaron a las estudiantes resultaron heridos; además, hubo daños materiales: arrancaron la puerta del edificio y escribieron grafitis con pintura en aerosol en la pared exterior, con consignas que simbolizan el antibelicismo.\n\nLos nacionalistas dentro del ejército estallaron de ira, diciendo que la “Revolución del 68” de Aru está volviendo demasiado violentas a las estudiantes.\n\nPero Emil Schpeller, jefe de la gendarmería, convenció a otros generales, insistiendo en que Aru no había ordenado directamente esta protesta."
 HEU.flavor_event.30.a:0 "Lista de gastos de defensa de este año: instalar una puerta nueva, borrar grafitis..."

 HEU.flavor_event.31.t:0 "La liberación del Fuerte Eben-Emael"
 HEU.flavor_event.31.desc:0 "El Fuerte belga de Eben-Emael, construido para prepararse ante una invasión de la Wehrmacht alemana, se había convertido tras la Gran Transición en una especie de “zona liberada” donde vivían soldados nacionalistas que rechazaban el dominio de los estados de Kivotos.\n\nEl fuerte, que durante mucho tiempo esperó el regreso de los estados humanos, abrió hoy sus puertas de par en par cuando el ejército luxemburgués entró, y soldados belgas y luxemburgueses protagonizaron una emotiva ceremonia de reencuentro.\n\nAunque a los nacionalistas belgas les incomoda que el Gran Duque de Luxemburgo sea una kivotosiana pelirroja con halo y cuernos, acordaron naturalizarse en Luxemburgo al reconocer que Rikuhachima Aru gobierna dentro del marco legal y del sistema humano, como “regente del Gran Ducado de Luxemburgo”.\n\nNuestros soldados encontraron diversas armas almacenadas dentro del fuerte.\n\nLos oficiales informaron con satisfacción que son perfectamente compatibles con los fusiles del ejército luxemburgués, que ya utilizaba armas belgas.\n\nLas armas recuperadas estaban en condiciones de uso inmediato."
 HEU.flavor_event.31.a:0 "¡Qué historia tan buena!"

 HEU.flavor_event.32.t:0 "Pandemonium, Ibuki, e Ibuki"
 HEU.flavor_event.32.desc:0 "Tras el colapso del gobierno de Pandemonium, varias figuras importantes que huyeron a Luxemburgo solicitaron que el Gran Ducado continuara publicando oficialmente el periódico “Pandemonium Semanal”.\n\nLo desconcertante es que el periódico tendría que imprimirse con impuestos de Luxemburgo, y que la información que contendría no sería sobre el curso actual de la guerra, sino artículos dedicados a promocionar lo adorable que es una niña llamada “Tanga Ibuki”.\n\nEl comandante de la gendarmería, Emil Schpeller, verificó varias veces si la petición era real, pero lo único que confirmó una y otra vez fue que los parlamentarios de Pandemonium *de verdad* querían difundir la *adorabilidad* de Ibuki ante el público incluso en plena guerra total.\n\nEn una reunión a solas con Rikuhachima Aru, Schpeller expresó su oposición con el mayor autocontrol que pudo:\n\n\"En el frente, *los soldados de Su Alteza* están muriendo. En este momento, es injusto gastar presupuesto que debería ir a ellos en favor de *una simple* celebridad extranjera.\" \n\nSin embargo, la cúpula de Pandemonium advirtió que, si se detuviera la publicación del Pandemonium Semanal, la moral de los soldados de Pandemonium—incorporados al ejército luxemburgués durante el exilio—se desplomaría.\n\nAl final, la decisión es de Aru.\n\nSin entender ni ella misma por qué tiene que preocuparse por una decisión tan absurda, Aru se sentó frente a la máquina de escribir, apretándose las sienes doloridas."
 HEU.flavor_event.32.a:0 "...No queda otra que sacrificarse por la moral de los soldados de Pandemonium..."
 HEU.flavor_event.32.b:0 "¿Esto tiene sentido? ¡La gente que me es leal... sigue muriendo incluso ahora!"

 HEU.flavor_event.33.t:0 "Blue Archive: Diario de Trabajo del Club 68"
 HEU.flavor_event.33.desc.a:0 "A medida que la 'Revolución del 68' de Rikuhachima Aru se volvió popular no solo entre los kivotosianos, sino incluso entre los intelectuales de la comunidad internacional, también empezaron a aparecer intentos de aprovechar la fama de Aru de manera 'comercial'. La película 'Blue Archive: Diario de Trabajo del Club 68', estrenada simultáneamente esta vez en Luxemburgo y en toda la región germanoparlante, es un filme noir que retrata (con un toque de imaginación cinematográfica) las actividades de Rikuhachima Aru en Kivotos antes de la Gran Transposición. Dirigida personalmente por Heinrich Piel, la estrella más popular de todo el mundo germanoparlante, esta película fue aclamada por la crítica como un thriller criminal sucesor de la obra previa de Piel de 1930, '¡Cuidado! ¡Ladrones de autos! (Achtung! – Auto-Diebe!)', con una trama que acelera el pulso de los espectadores.\n\nDiario de Trabajo del Club 68, cuyo título oficial es 'Blue Archive: Diario de Trabajo del Club 68', cuenta con la carismática actriz Marlene Dietrich interpretando a Rikuhachima Aru, y con la actriz checo-deutschlandiana Anny Ondra interpretando a Igusa Haruka, la compañera de Aru y uno de los personajes principales de la película. Dietrich retrata a Rikuhachima Aru como una asesina fría que, en una Gehenna de Kivotos empapada de crimen y corrupción, continúa ejecutando asesinatos únicamente contra villanos, como la única que lucha por la gente común. Los repugnantes villanos del detestable Comité de Disciplina, coludidos con mafiosos, intentan proteger a políticos y capitalistas corruptos, pero cada vez que aparece la francotiradora prodigio Rikuhachima Aru, la situación da un giro drástico. Los disparos de Aru nunca fallan sin importar las circunstancias, y en lugar de civiles inocentes, siempre atraviesan el corazón del malvado.\n\nCon el éxito comercial de la película, las ventas de bromuros de Marlene Dietrich disfrazada como Rikuhachima Aru se dispararon, y el whisky “on the rocks” que la película muestra a Rikuhachima Aru bebiendo con frecuencia en su oficina también se hizo famoso.\n\nLos críticos elogiaron con entusiasmo que el director Heinrich Piel, a través de la figura de Aru luchando contra el “corrupto” Comité de Disciplina, retrató con una perfección sorprendente el espíritu de resistencia contra el viejo régimen y el espíritu liberal de la Revolución del 68. Piel, que ya ha cosechado un gran éxito comercial, producirá una secuela sobre la grandiosa aventura de Aru para asesinar al villano del Comité de Disciplina coludido con mafiosos, el 'Barón Amau', y también declaró que la renegociación del contrato con Dietrich avanza sin problemas. Heinrich Piel, excelente director y también actor, ya reveló a la prensa el vestuario del 'Barón Amau', inspirado en el Conde Drácula, y dijo que él mismo interpretará el papel del Barón Amau. Los fans de la película 'Blue Archive' ya están esperando con ansias a que termine el rodaje de la nueva película."
