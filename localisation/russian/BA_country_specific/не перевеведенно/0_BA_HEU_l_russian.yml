#흥신소 68 인물 설명/캐릭터 설명
 HEU_GATHERING_STORM_DESC:0 "El Gran Ducado de Luxemburgo presume oficialmente de ser “la única nación germánica que sobrevivió al caos de la Gran Transición”, pero en realidad se encuentra bajo el control político de la Agencia de Servicios 68, que protegió Luxemburgo de la invasión de las estudiantes de Gehenna durante aquella confusión. Todos los países vecinos han sido dominados por los “transferidos”, y Gehenna, Millennium y el Consejo Estudiantil General amenazan la soberanía de Luxemburgo.\n\nAru, convertida en regente de Luxemburgo, intenta proteger tanto a las estudiantes de Kivotos en Luxemburgo como a los propios habitantes locales mediante la cooperación con estos últimos. ¿Se derrumbarán sus ideales ante la realidad… o logrará superar todas las dificultades como una forajida?"

 HEU_country_intro_header: "La Gran Transición y el Gran Ducado de Luxemburgo"
 HEU_country_intro_content: "El fenómeno de la §gGran Transición§! de 1935 devastó a casi todos los países de Europa Central, pero Gehenna no pudo elaborar un plan de invasión contra Luxemburgo porque estaba concentrada en combatir a la §gWehrmacht alemana§!, y Millennium también se centraba únicamente en luchar contra la Resistencia francesa. Aun así, Luxemburgo no salió ileso.\n\nEn el caos sin ley posterior a la Gran Transición, una banda compuesta por algunas delincuentes de Gehenna saqueó directamente la Ciudad de Luxemburgo. La milicia ciudadana, formada por voluntarios, se aterrorizó ante la potencia de fuego de las personas de Kivotos y huyó; y la §CGendarmería§!, un ejército regular de unos 200 hombres, fue aniquilada en combate urbano.\n\nCon apenas unos cientos de soldados regulares y un armamento pobre, Luxemburgo no tenía capacidad para responder a los ataques de invasores de otra dimensión. La Casa Nassau, incluida Charlotte, fue masacrada en medio del caos, y el primer ministro del gabinete, §YJoseph Bech§!, tuvo que huir solo por una ciudad envuelta en llamas sin poder llevar consigo ni siquiera a un solo secretario… hasta que, por casualidad, se topó en un callejón con §GRikuhachima Aru§!, que había sido trasladada a la Ciudad de Luxemburgo y aún no entendía lo que estaba ocurriendo.\n\nRikuhachima Aru y sus amigas lideraron la operación para eliminar a la banda que saqueaba la Ciudad de Luxemburgo, y cuando los transferidos de Kivotos que no participaron en el motín se pusieron del lado de Aru, la guerra de una sola noche terminó con la victoria de Luxemburgo. Convertida en heroína nacional, Rikuhachima Aru fue proclamada §Gregente de Luxemburgo§! tras el exterminio de la familia ducal, y, llevada por el ambiente, aceptó el nuevo cargo.\n\nY entonces pasaron dos meses. Al principio, Bech agradeció la ayuda de Aru, pero a medida que Luxemburgo recuperaba la estabilidad, empezó a ver cada vez más a Aru y a la §PAgencia de Servicios 68§! como rivales políticos. Las distintas fuerzas políticas siguen haciendo sus propios cálculos. Luxemburgo aún guarda semillas de conflicto debido a las tensiones entre los habitantes locales y la población de Gehenna que emigró tras la Gran Transición. El impacto de la Gran Transición aún no ha terminado.\n\n§YDesarrollo: jindoi, Sonetto\nRedacción de la descripción del árbol de enfoques: .spear_§!"

 HEU_country_intro_header_1: "Partidos y facciones"
 HEU_country_intro_content_1: "§CPartido de la Derecha de Luxemburgo§!\nLa historia del Partido de la Derecha se remonta a la década de 1910, cuando comenzó la democracia luxemburguesa. Los conservadores y las fuerzas políticas católicas dentro de Luxemburgo sintieron la necesidad de organizarse como partido, ya que el sistema político luxemburgués, antes oligárquico, se abrió al público con la introducción del sufragio universal. Al principio se propuso el nombre de §CPartido Popular Católico§!, pero para ganar apoyo más amplio se eligió un nombre mucho más moderado: §CPartido de la Derecha§!. El partido, respaldado por campesinos y por la comunidad católica, se mantiene como la primera fuerza del parlamento, y sus diputados se dividen en dos facciones: la §GReformista§! y la §YConservadora§!. La Conservadora es la facción dominante dentro del partido y agrupa a muchos diputados en torno al primer ministro §YJoseph Bech§!.\n\nLa facción Conservadora sostiene que deben anularse las reformas de 1918 que garantizaron el §gsufragio femenino§! y el §gsufragio universal§!, y desea detener el desarrollo de la industria siderúrgica para que la patria regrese al hermoso país lechero del siglo XIX. La facción Reformista, centrada en el diputado §GPierre Dupont§!, cree que el camino del partido es reconocer la democracia y proteger el §gespíritu comunitario católico§! dentro de ese sistema.\n\nLa §Yfacción Conservadora§! duda de la posibilidad de coexistir con la población de Kivotos, una sociedad centrada en mujeres y que no profesa la fe católica. Conservadores duros, como el presidente del parlamento §YÉmile Richter§!, creen que, si es para derribar al gobierno de Rikuhachima Aru y preservar la pureza racial de Luxemburgo, están dispuestos a elegir cualquier método “radical”… aunque cuál sea ese método se mantiene estrictamente oculto.\n\n§RPartido Comunista de Luxemburgo§!\nEl §RPartido Comunista§!, una oposición §Restalinista§! respaldada por los obreros siderúrgicos y mineros del sur de Luxemburgo, ha sufrido desde su fundación una represión dura por parte del gobierno del Partido de la Derecha. Cuando un comunista lograba ganar un escaño, el gobierno utilizaba procedimientos de expulsión por mayoría dentro del parlamento para “legalmente” despojar al electo de su puesto. Aun así, el partido ha mantenido su base obrera gracias al crecimiento del poder de la industria siderúrgica, y es la oposición que con más dureza resiste al gobierno.\n\nTras la Gran Transición, el Partido Comunista se convirtió en el único partido del sistema que, como línea oficial, defendió los derechos y el derecho laboral igualitario de la población de Kivotos llegada por la §CGran Transición§!. Esto fue una elección ideológica —“todos los trabajadores son iguales”—, pero también un cálculo político, considerando que una porción significativa de la población luxemburguesa fue reemplazada por población de Gehenna tras la Gran Transición. El excelente cirujano §YCharles Marx§! trabaja para difundir el ideal estalinista en Luxemburgo en medio del caos posterior.\n\n§gGEDELIT§!\nGEDELIT es la abreviatura de la “Asociación Alemana de Literatura y Artes”, y no un partido político. Es una fuerza nacional-socialista liderada por §YDamian Kratzenberg§!. GEDELIT predica el pangermanismo en Luxemburgo y sostiene que Luxemburgo debe ser parte del gran Imperio alemán. Antes de la Gran Transición defendían la unión con Alemania, pero tras la desaparición del gobierno alemán por la Gran Transición, su objetivo pasó de la unificación a la construcción de un §ggobierno nacional-socialista§!."

 HEU_country_intro_header_2: "Fuerzas influyentes fuera de los partidos"
 HEU_country_intro_content_2: "§PAgencia de Servicios 68§!\nLa Agencia de Servicios 68, que antes de la Gran Transición era tan pobre que ni siquiera podía pagar el alquiler de su oficina y llegó a dormir en un parque, ahora se ha convertido en la facción política más importante de Luxemburgo. Estrictamente hablando, la Agencia no era un partido sino una empresa, y según la ley luxemburguesa posterior a la Gran Transición no es más que una simple “organización ciudadana”. Sin embargo, su jefa, §YRikuhachima Aru§!, es la heroína nacional que impidió la masacre de Gehenna que estalló en la Ciudad de Luxemburgo justo después de la Gran Transición; y sus amigas —Igusa Haruka, Asagi Mutsuki y Onikata Kayoko— también ejercen influencia en la política luxemburguesa desde las sombras.\n\nAru sufrió un impacto emocional por la masacre y el tiroteo ocurridos el día de la Gran Transición, y pretende transformar su ideal de “forajida hardboiled” en un proyecto de coexistencia entre los locales y la población de Kivotos en Luxemburgo. Incluso aparte del núcleo original de la Agencia 68, las §Ydivisiones de infantería Halo§! del Gran Ducado de Luxemburgo están formadas por población de Kivotos que apoya el idealismo de Rikuhachima Aru. Con su incorporación, el tamaño de la Agencia 68 ha aumentado considerablemente.\n\n§CEjército de Luxemburgo§!\nHasta antes de la Gran Transición de 1935, el ejército luxemburgués era el ejército de la casa ducal, leal a la §YCasa Nassau§!. Los monárquicos, incluido el general §YÉmile Speller§! —comandante de la Gendarmería (equivalente al jefe del Estado Mayor de otros países)—, juraron lealtad a la gran duquesa Charlotte y a su familia. Aun así, la calidad y el tamaño del ejército luxemburgués eran muy inferiores a los de otros países de Europa Central, y la ola de la Gran Transición causó un daño enorme. Pese al combate urbano desesperado en la Ciudad de Luxemburgo, tanto la reserva civil (“voluntarios”) como la fuerza regular (la Gendarmería) sufrieron pérdidas fatales. En particular, el hecho de no haber podido impedir el exterminio de Charlotte, el príncipe Félix y los hijos de la gran duquesa fue un golpe severo para la moral del ejército.\n\nSin embargo, la §YRegente Rikuhachima§! —quien logró detener la masacre— se convirtió en un nuevo centro de gravedad para el ejército luxemburgués. El día de la Gran Transición, la regente Aru ayudó en la búsqueda del palacio ducal y en la represión de los alborotadores de Gehenna, participando en todo el proceso desde el inicio hasta la estabilización junto con la Gendarmería. Y el comandante Speller, incluso mientras muchos conservadores miraban con recelo a Aru, muestra un apoyo entusiasta a la Regente Rikuhachima."

 HEU_guide: "Rikuhachima Aru, Presidenta del Consejo Estudiantil General de Kivotos\n\n£white_dot Haga triunfar la Revolución 68 liberal.\n£white_dot Enfréntese a Trinity mediante una alianza con Gehenna.\n£white_dot Someta al Consejo Estudiantil General de Kivotos y conviértase en su presidenta.\n£white_dot ...Y como presidenta del Consejo Estudiantil, proteja Kivotos contra la humanidad y los Colores.\n\n\nLa heroína de Aru, la gobernante de Alemania: Asagi Mutsuki\n\n£white_dot Convierta a Rikuhachima Aru en una heroína.\n£white_dot Someta a Gehenna y Trinity, y unifique Alemania.\n£white_dot §RNo deje que Aru caiga en la desesperación.§!\n\n\nGran coalición de socialdemocracia: la Agencia 68, gobernante de Alemania\n\n£white_dot Arbitre el conflicto entre el Partido de la Derecha y el Partido Comunista.\n£white_dot Someta a Gehenna y Trinity, y unifique Alemania.\n£white_dot Conviértase en un §Radulto responsable§!.\n"

#룩셈부르크 중점
 HEU_road_to_regency:0 "Camino hacia la regencia"
 HEU_road_to_regency_desc:0 "Tras la masacre de la familia gran ducal de Luxemburgo y el colapso del gobierno anterior, Aru inició su vida política como regente, ocupando el puesto vacante de la Casa Gran Ducal de Luxemburgo. ...No es que lo hiciera porque quisiera, precisamente.\n\nSi Aru se marcha, Luxemburgo sin duda caerá en la anarquía. Así que alguien tiene que cargar con el peso. Aunque no sea el frío camino del “forajido” que Aru imaginaba."

#{{ Enfoques políticos pro-Gehenna
 HEU_watch_right_wing_party:0 "Vigilar al Partido de la Derecha"
 HEU_watch_right_wing_party_desc:0 "El gabinete de Bech la alaba en público diciendo: “Sin la ayuda de Aru, Luxemburgo no existiría”. Pero, para ser algo así, la mirada de algunos veteranos del Partido de la Derecha hacia Aru parece cargada de cinismo. ¿Por qué?\n\nSin contar con la aprobación de Aru, Kayoko decidió seguir a varios pesos pesados del partido para averiguar la razón."

 HEU_remove_right_wing_party:0 "Purgar al Partido de la Derecha"
 HEU_remove_right_wing_party_desc:0 "La jefa Aru creyó en la buena fe del Partido de la Derecha. Creyó, de verdad, que ellos la necesitaban. Pero si no era así… si lo único que hacían era usar a la jefa Aru… entonces, por supuesto, vendrá la represalia."

 HEU_remove_nazi_party:0 "Sancionar el movimiento nacional-socialista"
 HEU_remove_nazi_party_desc:0 "El movimiento nacional-socialista en Luxemburgo es débil comparado con el conservadurismo católico tradicional del Partido de la Derecha, pero se está extendiendo como un cáncer, sobre todo entre los intelectuales.\n\nAhora que hemos comprendido la malicia de los locales, el movimiento nacional-socialista —que desprecia a los de Kivotos— no puede ser tolerado bajo ningún concepto."

 HEU_rikuhachima_governemnt:0 "Proclamar el rikuhachimaismo"
 HEU_rikuhachima_governemnt_desc:0 "Los supuestos “locales” son criaturas llenas de burla, sarcasmo y hostilidad contra los de Kivotos. Aru es una forajida, pero no está del lado del mal.\n\nSi los locales intentan pisotear a los de Kivotos, a Aru no le importa si son estudiantes de Gehenna, de Trinity o de Millennium. Ella las protegerá. Sea como sea."

 HEU_join_gehenna:0 "Unión Luxemburgo–Pandemonium"
 HEU_join_gehenna_desc:0 "Los políticos locales de Luxemburgo han considerado a Gehenna —que se apoderó de Alemania, la tierra ancestral de los germanos— como un enemigo potencial.\n\nPero Aru cree que, dado que la mayoría de la población de Kivotos que emigró a Luxemburgo son estudiantes de Gehenna, y que para proteger a las estudiantes de Luxemburgo la unión con Pandemonium es indispensable. A diferencia del Equipo de Prefectos, que siempre intentó arrestar a la Agencia, al menos Pandemonium será una contraparte con la que se puede hablar."

 HEU_luxembourgian_primacy: "Luxemburgo primero"
 HEU_luxembourgian_primacy_desc: "Puede sonar irrealista combinar “Luxemburgo” con “primero”, pero la situación política ya no se parece en nada a la de antes de la Gran Transición.\n\nCon Alemania y Francia colapsadas, ¿acaso no nos hemos convertido en el centro de la cultura germano-francesa y en el corazón de la civilización humana europea?"

 HEU_join_red_winter: "Proyecto de una Unión Europea revolucionaria"
 HEU_join_red_winter_desc: "[GEM.GetName] podría ser un gran aliado estratégico, sí… pero colaboran demasiado con la Wehrmacht. Y una alianza con Pandemonium corre el riesgo de empañar el orgulloso idealismo de la Revolución 68.\n\nEn una revolución no puede haber ni el más mínimo compromiso. Debemos buscar un socio “rojo” más lejos."

 HEU_red_alert: "Alerta roja"
 HEU_red_alert_desc: "Muchos estados humanos recelan del lado “rojo” de nuestra Revolución 68. Incluso dicen cosas como “bolchevismo de otro mundo”, sea lo que sea.\n\nPero no negaremos esas acusaciones. Cuanto más nos odien, más fuertes nos volveremos."

 HEU_one_evil_one_day:0 "\"Un mal al día\""
 HEU_one_evil_one_day_desc:0 "Cuando se supo que el gobierno local se había derrumbado, diversas fuerzas empezaron a acercarse a Luxemburgo.\n\nEntre ellas, una organización mafiosa llamada la Familia Arancino aseguró que, si le cedíamos parte de la propiedad de las minas luxemburguesas, podrían vender el mineral de hierro más barato y beneficiar a la industria principal del país: la siderurgia."

 HEU_one_evil_one_day_2:0 "Para Rikuhachima Aru, la justicia es..."
 HEU_one_evil_one_day_2_desc:0 "Después de repartir intereses con la Familia Arancino, empiezan a llegar malas noticias. Para exprimir beneficios del rico hierro, están maltratando a los trabajadores locales con jornadas brutales.\n\nSí. Claro. Solo están explotando a los locales, no a los de Kivotos. No es algo en lo que la jefa Aru tenga que involucrarse.\n\n...Pero, ¿de verdad la Aru que arroja a la basura un informe sobre gente sufriendo solo porque “no nos beneficia” seguiría siendo “Rikuhachima Aru”?"

 HEU_one_evil_one_day_3:0 "...Porque no es barato"
 HEU_one_evil_one_day_3_desc:0 "Tras negarnos a cederles intereses a la Familia Arancino, empiezan a llegar malas noticias. En vez de entrar “legalmente” al negocio minero, han comenzado a introducir de contrabando falsos telares místicos y a venderlos clandestinamente a los locales.\n\nComo represalia por el rechazo de la Agencia, también están traficando armas hacia las redes clandestinas católicas y nazis.\n\nAntes de que unos nazis armados provoquen un motín, la Agencia 68 tendrá que barrer a estos tipos."

 HEU_one_evil_one_day_4:0 "\"Al final… lo de ‘un mal al día’ no era para mí\""
 HEU_one_evil_one_day_4_desc:0 "Aunque Aru decidió luchar por todas las estudiantes de Kivotos, sabe que no toda la gente de Kivotos es buena. La Agencia 68 es pequeña, y es difícil enfrentarse sola a la mafia y a otras organizaciones criminales de Kivotos.\n\nAru organizará una nueva policía compuesta por población de Kivotos afín en Luxemburgo. A largo plazo, esta fuerza reemplazará a la policía local."

 HEU_one_evil_one_day_5:0 "Ministerio de Seguridad Nacional de Luxemburgo"
 HEU_one_evil_one_day_5_desc:0 "Este incidente nos enseñó que necesitamos una preparación exhaustiva para responder no solo a la mafia, sino también a las maniobras de cualquier fuerza externa.\n\nEl Ministerio de Seguridad Nacional se convertirá en una excelente organización para contrarrestar la infiltración de otras academias."

 HEU_no_more_evil:0 "El escudo de todos"
 HEU_no_more_evil_desc:0 "Puede que nos estemos alejando cada vez más del camino inicial de “forajida”, pero, salvo Haruka, probablemente todos sabían que Aru nunca podría ser una verdadera forajida.\n\nAru quiere convertir Luxemburgo en un refugio para todas las estudiantes de Kivotos. Para hacer realidad ese sueño, proclamaremos más libertad… y la lucha contra el conservadurismo religioso."

 HEU_don_arancino_remnants:0 "Reeducación de prisioneros"
 HEU_don_arancino_remnants_desc:0 "No todos los subordinados de Don Arancino le eran leales. ¿Qué clase de lealtad puede haber entre forajidos atados por un contrato?\n\n...Ustedes sí son la excepción, ¿verdad? ¿Sí? E-este… ¿Mutsuki? No te rías, ¿podrías contestar?\n\n...En fin. Los prisioneros mafiosos capturados jurarán lealtad a su nueva líder, Aru, y a cambio participarán en la reconstrucción de Luxemburgo para expiar sus crímenes.\n\nPara ellas, es mejor que ir a la cárcel: aunque sea un salario pequeño, al menos podrán ir y venir de la fábrica, ¿no?"

 HEU_war_on_crime:0 "Bloquear organizaciones criminales potenciales"
 HEU_war_on_crime_desc:0 "El caso de la mafia dejó una lección a la Agencia 68: la seguridad de Luxemburgo siempre puede estar amenazada, y para cumplir el ideal de Aru —proteger a las estudiantes de Kivotos— hay que moverse *antes* de que esas organizaciones cometan delitos.\n\nAru ya ha visto a los nazis locales, a organizaciones católicas y similares. No ha olvidado lo que le han hecho a los de Kivotos.\n\nLas organizaciones pro-nazis locales serán destruidas, y el sentimiento nacionalista debe ser reprimido."

 HEU_aru_fan_club:0 "Nuestra jefa Aru"
 HEU_aru_fan_club_desc:0 "Tras expulsar a la Familia Arancino, la popularidad de Aru entre los de Kivotos dentro de Luxemburgo está subiendo.\n\nNo era algo esperado que una forajida como Aru fuera venerada como una heroína, pero… ¿y qué? Se siente bien, ¿no?"

 HEU_aru_fan_club_2:0 "Rikuhachima Aru, heroína del pueblo"
 HEU_aru_fan_club_2_desc:0 "A medida que aumenta el apoyo estudiantil hacia Aru, crece también una base espontánea de simpatizantes.\n\nIncluso se propagan rumores exagerados sobre lo “implacable” que fue Aru, como forajida, al derrotar a la Familia Arancino. A Aru parece gustarle… aunque también se la nota un poco abrumada."

 HEU_aru_fan_club_3:0 "Nuestra forajida"
 HEU_aru_fan_club_3_desc:0 "Por las estudiantes de Kivotos, Aru cargó con un peso enorme. Y ese esfuerzo está dando frutos.\n\nEstudiantes de otras academias, que al principio no reconocían a Aru, han empezado a apoyarla, y su reputación pública no deja de crecer.\n\nLa guerra contra la Familia Arancino dejó heridas profundas en Luxemburgo, sí… pero a través de esas heridas, también pudimos crecer."

 HEU_luxembourg_education_reform:0 "Segunda reforma educativa"
 HEU_luxembourg_education_reform_desc:0 "La reforma de la Ley de Educación luxemburguesa de 1912 eliminó la obligación de impartir educación católica en las escuelas y el requisito de que el profesorado profesara la fe católica. Sin embargo, debido a docentes religiosos contratados antes de aquella reforma, la educación tipo capilla sigue apareciendo con frecuencia en el sistema educativo.\n\nLa Segunda reforma educativa se centrará en prohibir por completo, dentro del currículo, la enseñanza católica con ideas anti-Kivotos, e imponer una educación plenamente laica."

 HEU_doubt_valkyrie_police_academy:0 "El problema de la Academia de Policía Valkyrie"
 HEU_doubt_valkyrie_police_academy_desc:0 "La Academia de Policía Valkyrie lleva desde antes de la Gran Transición afirmando que mantiene el orden en todo Kivotos. Pero, en la práctica, ¿qué impacto real tuvo sobre la paz y el orden?\n\nValkyrie debe ser destruida, y hace falta una organización más adecuada para proteger a los de Kivotos."

 HEU_doubt_arona:0 "El problema del Consejo Estudiantil General"
 HEU_doubt_arona_desc:0 "Los de Kivotos sufren el racismo y el maltrato de los locales. ¿Y qué ha hecho el Consejo Estudiantil General hasta ahora?\n\nUna estúpida pelea política entre una lata de IA que ni siquiera puede salir del monitor y el Consejo… intrigas internas… juegos de poder… ¿De qué sirve todo eso a una estudiante de Kivotos a la que una turba nazi local está linchando en este mismo momento?\n\nSi el camino correcto de una forajida es tirar esa basura sin valor al basurero, Aru lo hará."

 HEU_general_student_council_aru:0 "Desafiar la autoridad del Consejo Estudiantil General"
 HEU_general_student_council_aru_desc:0 "El sistema actual del Consejo Estudiantil General no solo es débil para proteger a todas las estudiantes de Kivotos: también está torcido.\n\nAunque Aru sea una forajida llena de errores, ella tiene una nueva visión para conducir Kivotos hacia el futuro.\n\nPor esa visión, Rikuhachima Aru afirmará que debe convertirse en la presidenta del Consejo Estudiantil General que representa a Kivotos."

 HEU_trinity_defensive_aru:0 "La ola de Trinity"
 HEU_trinity_defensive_aru_desc:0 "Se aproxima una ola salvaje llamada Trinity.\n\nPara preservar el ideal del rikuhachimaismo —proteger a todos los de Kivotos— lucharemos contra el rumbo imperialista de Trinity."

 HEU_prefect_team_defensive_aru:0 "El escudo contra el Equipo de Prefectos"
 HEU_prefect_team_defensive_aru_desc:0 "El autoproclamado “Equipo de Prefectos”, en realidad un caudillaje armado de Gehenna, ha entorpecido una y otra vez la legítima labor de la Agencia.\n\nNo. Ya no podemos permitir que sigan actuando así.\n\nResistiremos hasta el final ante una invasión del Equipo de Prefectos. ¡No habrá otra derrota!"

 HEU_ban_far_right_organizations:0 "Reeducación antietnonacionalista nazi"
 HEU_ban_far_right_organizations_desc:0 "Ya aprendimos lo suficiente sobre eso que los locales llaman “nacionalismo”.\n\nNo podemos aliarnos jamás con quienes blandan la esvástica y hablan de una supuesta unión del pueblo germánico."

 HEU_war_industry:0 "Ley de economía de guerra"
 HEU_war_industry_desc:0 "Para ganar una guerra, a veces hay que tomar decisiones difíciles.\n\nRecordemos el pasado, antes de la Gran Transición: buscar el mercado negro para conseguir dinero prestado, vaciar los bienes de Aru para contratar mercenarios y asegurar el éxito de una operación…\n\nFueron elecciones dolorosas, pero si no hubiéramos tenido la determinación de tomarlas, la Agencia 68 no habría sobrevivido hasta hoy."

 HEU_betrayal_gehenna:0 "El problema de Gehenna y los nazis"
 HEU_betrayal_gehenna_desc:0 "Creíamos que Pandemonium actuaba con sinceridad por las estudiantes de Kivotos, o al menos por las de Gehenna.\n\nPero también han empezado a coludirse con los locales… e incluso han tomado la mano del grupo más terrible de todos: los nazis.\n\nEntonces, ¿de verdad necesitamos seguir cooperando con Gehenna?\n\nY si se alían con nazis… ¿qué se supone que ganan los de Kivotos con eso?"

 HEU_GSC_president_rikuhachima:0 "Presidenta del Consejo Estudiantil: Aru"
 HEU_GSC_president_rikuhachima_desc:0 "¿Qué significa ser una forajida? Proteger a los de Kivotos para que, tras la Gran Transición, puedan vivir una nueva vida en la Tierra sin sufrir discriminación.\n\nSi ese es el camino de una forajida que desafía el orden de este mundo, Aru lo recorrerá.\n\nEl Consejo Estudiantil General anterior fracasó en su tarea de proteger a los de Kivotos frente a la discriminación humana. Ahora, la próxima presidenta del Consejo, Aru, subirá a la Torre Sanctum para mostrar el hardboiled que ella eligió."

 HEU_GSC_president_rikuhachima_2:0 "Organización del Consejo Estudiantil para Educación, Ciencia y Cultura"
 HEU_GSC_president_rikuhachima_2_desc:0 "Aru se mueve por la población de Kivotos, que se ha convertido en minoría en el mundo posterior a la Gran Transición. Pero, al ser numéricamente tan pocos, existe el riesgo de que, con el paso de las generaciones, se pierdan partes de la cultura tradicional de Kivotos.\n\nLa Organización del Consejo para Educación, Ciencia y Cultura recopilará y preservará la cultura y las tradiciones de todas las grandes academias de Kivotos, para que en un futuro lejano puedan ser reconstruidas en cualquier momento."

 HEU_GSC_president_rikuhachima_3:0 "Pankivotosismo"
 HEU_GSC_president_rikuhachima_3_desc:0 "El pankivotosismo frente a los estados humanos es una ideología indispensable para garantizar los derechos humanos de todas las estudiantes de Kivotos que cruzaron con la Gran Transición."

 HEU_GSC_president_rikuhachima_4:0 "Respuesta ante los Colores"
 HEU_GSC_president_rikuhachima_4_desc:0 "El enemigo más poderoso al que debemos enfrentarnos para garantizar los derechos de los de Kivotos sigue siendo la humanidad. Pero la existencia de los “Colores”, aparecida de forma repentina tras la Gran Transición, tampoco es algo que podamos ignorar.\n\nPuede ser la elección más difícil para una forajida… pero Aru elegirá doblegar a los Colores, antes que rendirse ante ellos."

 HEU_GSC_president_rikuhachima_GSC_annex: "Buscar colaboradores del Consejo Estudiantil"
 HEU_GSC_president_rikuhachima_GSC_annex_desc: "Muchos ejecutivos del Consejo Estudiantil se negaron a reconocer a Rikuhachima Aru como presidenta por tratarse de una sucesión obtenida por la fuerza, y se marcharon. Pero Shiranui Kaya está considerando un camino más “sabio” para protegerse a sí misma."

 HEU_GSC_president_rikuhachima_ending_after_1: "Proyecto del Parque Conmemorativo de Berg"
 HEU_GSC_president_rikuhachima_ending_after_1_desc: "La Revolución 68 fue un gran paso por los derechos de los de Kivotos, pero fue indiferente al dolor que los luxemburgueses sufrieron durante la Gran Transición.\n\n...Quizá ya sea demasiado tarde, pero tal vez haga falta un parque conmemorativo para expiar ante ellos."

 HEU_GSC_president_rikuhachima_ending_after_2: "Centro de trauma"
 HEU_GSC_president_rikuhachima_ending_after_2_desc: "Tras su encuentro con Damian Kratzenberg, Aru comprendió que muchos luxemburgueses padecen TEPT (PTSD) debido a las masacres de la Gran Transición.\n\nAunque la medicina local no tiene el concepto de TEPT, un equipo médico del Consejo Estudiantil permanecerá en Luxemburgo para brindar apoyo, terapia psicológica y rehabilitación a las víctimas."

 HEU_GSC_president_rikuhachima_ending_after_3: "...y hacia Kratzenberg"
 HEU_GSC_president_rikuhachima_ending_after_3_desc: "Al revelarse que el misterioso vtuber Nanami Ayaka estaba bajo la protección de Arona, Aru por fin puede saber adónde debe ir para encontrarse con él."
 HEU_chroma_navy:0 "Nuestro verdadero santuario"
 HEU_chroma_navy_desc:0 "Para proteger Kivotos de la invasión de los Colores, debemos construir un buque de guerra, como un arca, capaz de acercarse a los Colores. Como la jefa Aru no tiene conocimientos en este campo, el personal que aún permanece en el Consejo Estudiantil General elaborará con todo detalle un plan de invasión marítima para expulsar a los Colores."

 HEU_rikuhachimaism_focus_1:0 "Ala Aérea Femenina de Luxemburgo"
 HEU_rikuhachimaism_focus_1_desc:0 "En Luxemburgo no existieron fuerzas aéreas hasta antes de la Gran Transición, y gracias a ello hay poca resistencia a organizar una unidad aérea compuesta por mujeres. La jefa Aru espera que el ejército pueda servir como punto de partida para desmantelar la cultura católica luxemburguesa y aplicar la igualdad de género." 

 HEU_rikuhachimaism_focus_2:0 "Cruzada contra la civilización humana"
 HEU_rikuhachimaism_focus_2_desc:0 "Fue una Gran Transición no deseada, pero al final no cambia el hecho de que Kivotos es, a ojos de los locales, el invasor que irrumpió en su tierra. Luxemburgo ha reunido fuerzas —aunque sea de manera precaria— bajo un solo país, el Gran Ducado de Luxemburgo, entre locales y transeúntes. Pero naciones como Francia afilan una espada de venganza contra la población de Kivotos.\n\nMientras exista la posibilidad de que el Gran Ducado de Luxemburgo sea invadido por estados humanos algún día, debemos estar preparados."

 HEU_rikuhachimaism_focus_3:0 "Comunas regionales"
 HEU_rikuhachimaism_focus_3_desc:0 "La Agencia 68 no está acostumbrada a “aplastar” autoritariamente a organizaciones subordinadas como hacen Pandemonium o el Equipo de Prefectos. Tampoco le gusta y, para ser sinceros, ni siquiera tiene ganas de hacerlo.\n\n[ROOT.GetLeader] no es anarquista, pero ayudará a que la población de Kivotos en cada región reciba una amplia autonomía para que puedan gestionar comunas libres. De hecho, para las estudiantes de Gehenna, un sistema de comunas regionales libres les resultará más familiar.\n\n...Aunque las inmigrantes de otras academias quizá se queden un poco confundidas."

 HEU_rikuhachimaism_focus_3_2:0 "Conexión entre academias"
 HEU_rikuhachimaism_focus_3_2_desc:0 "Gehenna, Millennium, Red Winter, Trinity… Muchas academias, por sus diferencias históricas y culturales, a menudo sienten hostilidad entre sí.\n\nPor supuesto, esa hostilidad no se derretirá de un día para otro, pero al menos dentro de la tierra de la Agencia 68, todas serán tratadas en igualdad como lo que son: habitantes de Kivotos."

 HEU_rikuhachimaism_focus_4:0 "Una revolución en la que pueda bailar"
 HEU_rikuhachimaism_focus_4_desc:0 "Los locales no comprenden “la vida social de las mujeres”. Ven la ropa de las estudiantes y gritan que “van desnudas”, y ante el romance entre estudiantes de Kivotos sueltan sermones de “Sodoma y Gomorra”, bla bla bla.\n\nSí. La Tierra y Kivotos son muy distintos. En Kivotos no existía la tradición de convertir a gente de otro color de piel en colonias para explotarlas; tampoco una fe que idolatre a un carpintero muerto; tampoco patriarcas que abofeteen a su esposa en la cocina.\n\n¡Y aun así Kivotos funcionaba perfectamente! No necesitamos su cultura."

 HEU_rikuhachimaism_focus_5:0 "Armar el rikuhachimaismo"
 HEU_rikuhachimaism_focus_5_desc:0 "Sería difícil decir —ni siquiera por cortesía— que la jefa Aru tiene carisma maquiavélico en tiempos de paz, pero cuando lucha para proteger a la gente que cree en ella, muestra una capacidad de mando sobresaliente.\n\nSi para el ideal del rikuhachimaismo —una unión igualitaria de todos los habitantes de Kivotos— hay que armar a Luxemburgo, entonces debemos intentarlo, aunque sea casi imposible."

 HEU_rikuhachimaism_focus_5_2:0 "Confianza y fraternidad"
 HEU_rikuhachimaism_focus_5_2_desc:0 "\"¿Convertirme en una heroína capaz de proteger a todos los de Kivotos? Eso ya se alejó demasiado de mi sueño original de ser una forajida, ¿no?\n\nPero… aun así me esforcé, ¿sí? Entonces… ¿podrías acompañarme un poco más, por mi ‘hardboiled’ de ahora?\""

 HEU_rikuhachimaism_focus_haruka:0 "Compañera Haruka"
 HEU_rikuhachimaism_focus_haruka_desc:0 "\"Haruka, si no fuera por tu ayuda… creo que ni siquiera existiría la Agencia 68 de hoy. ¿Tú qué piensas?\""

 HEU_rikuhachimaism_focus_mutsuki:0 "Compañera Mutsuki"
 HEU_rikuhachimaism_focus_mutsuki_desc:0 "\"Antes decía cosas como que tal acción era hardboiled, que tal otra era propia de una forajida… Ahora sé que esas palabras no eran ‘de verdad’.\n\nPero aun así… gracias a ti, cada vez pudimos salir del peligro.\""

 HEU_rikuhachimaism_focus_kayoko:0 "Compañera Kayoko"
 HEU_rikuhachimaism_focus_kayoko_desc:0 "\"La verdad, la palabra ‘hardboiled’ te queda mejor a ti que a mí. Gracias por ser la estratega del equipo… y por sostenernos desde el centro, Kayoko.\""

 HEU_pro_gehenna_route_ending:0 "§CWelcome§! §PSchool§!"
 HEU_pro_gehenna_route_ending_desc:0 "\"No soy alguien lo bastante fuerte como para proteger a todas las personas valiosas, ni soy un verdadero hardboiled como Haruka espera.\n\nPero en esta pequeña y modesta tierra, quise construir un pequeño paraíso donde los de Kivotos y los locales pudieran vivir en paz.\n\nDicen que un paraíso no puede probarse ni observarse… pero yo soy así: corro hacia un sueño que no puede probarse, me caigo… y aun así vuelvo a levantarme.\n\nPorque yo soy Rikuhachima Aru.\""

# }} Fin de los enfoques políticos pro-Gehenna
# {{ Enfoques políticos anti-Gehenna

 HEU_watch_gehenna:0 "Observar a Gehenna"
 HEU_watch_gehenna_desc:0 "Las fuerzas nativas, incluido el Partido de la Derecha, quieren enfatizar que Luxemburgo se convirtió en “el único estado étnico germano que sobrevivió en el continente europeo”.\n\nEl Gran Ducado de Luxemburgo solo había visto reducirse su territorio durante siglos. Pero ¿y si la Gran Transición se convirtiera en una nueva oportunidad?\n\n¡Podríamos proclamarnos “representantes del pueblo germánico” y reclamar derechos sobre el territorio alemán!\n\n...Por supuesto, esto también es una jugada para que Aru gane popularidad entre los locales y eleve la percepción hacia los de Kivotos."

 HEU_calm_down_students:0 "Calmar a las estudiantes"
 HEU_calm_down_students_desc:0 "El conflicto entre las estudiantes de Kivotos que llegaron con la Transición —principalmente de origen Gehenna— y la población local se está agravando.\n\nAru prometerá que, mediante compromiso y persuasión, logrará que locales y población de Kivotos convivan en armonía, e intentará calmar a las estudiantes."

 HEU_calm_down_native:0 "Un puente con los locales"
 HEU_calm_down_native_desc:0 "Las fuerzas políticas locales —incluidos católicos y fascistas— son hostiles hacia los transeúntes. Pero existe una fuerza que, de forma excepcional, sostiene la coexistencia entre transeúntes y locales: el pequeño Partido Comunista de Luxemburgo.\n\nLa Agencia apenas entiende el comunismo como “algo que a Red Winter le encanta”, pero no pasa nada. Lo importante es unir fuerzas con una facción local capaz de proteger a los de Kivotos."

 HEU_negotiations_with_parties:0 "¡El gran debate de la jefa!"
 HEU_negotiations_with_parties_desc:0 "A pesar de los ataques anti-Kivotos, la jefa Aru no ha abandonado su fe en que humanos y Kivotos pueden coexistir por medios pacíficos.\n\nLa “Ley de Derechos Civiles” es una idea de Aru: una ley para garantizar, dentro del marco legal, los derechos de los habitantes de Kivotos.\n\nEl problema es que el partido gobernante, el Partido de la Derecha, no apoya demasiado su aprobación.\n\nPor suerte, Luxemburgo es una democracia, y si logramos convencer al público con un debate elegante… el Partido de la Derecha tendrá que acatar la exigencia popular."

 HEU_civil_rights_act_1:0 "Ley de Derechos Civiles para Transeúntes"
 HEU_civil_rights_act_1_desc:0 "Gracias al éxito del debate, se aprobó una Ley de Derechos Civiles para proteger los derechos de los transeúntes.\n\nA partir de ahora, incluso sin insultar o agredir directamente a los de Kivotos, será ilegal negarse a contratar a un transeúnte por tener halo, negar la venta de comida o productos, o emitir discursos de odio.\n\nEl nivel de castigo es simbólico, pero lo importante es haber instalado la idea de que “discriminar a los de Kivotos es un delito”."

 HEU_civil_rights_act_2:0 "El fracaso de la Ley de Derechos Civiles"
 HEU_civil_rights_act_2_desc:0 "Sí. Seamos honestos: nadie esperaba que nuestra jefa torpe pudiera triunfar en un debate nacional en vivo.\n\nLa iniciativa para mejorar los derechos de los transeúntes fracasó de forma espectacular, y el Partido de la Derecha arrojó el proyecto de ley al basurero.\n\nAsí, el intento de proteger legalmente a los de Kivotos se vino abajo.\n\n...Entonces, ¿qué hacemos ahora?"

 HEU_no_more_hope:0 "No esperar nada"
 HEU_no_more_hope_desc:0 "Aru se convirtió en un chiste. La ley fue descartada, y tanto los de Kivotos como los locales se burlan de su pobre liderazgo.\n\n¿No queda esperanza?\n\nNo. Mutsuki tiene un “Plan B”. Desde el principio fue ridículo pretender igualdad real dentro de los límites de las leyes y el sistema de este país.\n\nSi un solo golpe, un golpe de Estado de guardia pretoriana, puede paralizar el parlamento y permitir que la Agencia haga leyes a su gusto… ¿para qué persuadir a nadie?"

 HEU_we_still_hope:0 "Gran coalición"
 HEU_we_still_hope_desc:0 "La Ley de Derechos Civiles fue aprobada… pero ¿podrá “aplicarse”? Desde el principio, el Partido de la Derecha era hostil.\n\nPero aquí entra la jefa genio, la diosa de la gestión.\n\nEl Partido Comunista de Luxemburgo sostiene como línea oficial que “Kivotos y la humanidad son iguales”. ¿Y si los incluimos como socios de coalición para que supervisen la ejecución de la ley?\n\nEl Partido de la Derecha no tendrá más remedio que aceptar la propuesta de Aru: “El papel de los comunistas se limita a vigilar el tema de derechos humanos de Kivotos”."

 ## Administración interna de la Agencia autosuficiente (fascismo)

 HEU_neutralization_rietspartei:0 "Ruptura con el Partido de la Derecha"
 HEU_neutralization_rietspartei_desc:0 "[HEU_neutralization_rietspartei_desc_text]"

 HEU_neutralization_rietspartei_desc_text_fake: "Decir que el Partido de la Derecha no hizo absolutamente nada por mejorar los derechos de Kivotos sería mentira. Sí hizo cosas: todo tipo de maniobras para impedirlo.\n\nEl primer ministro Joseph Bech, al menos, se mantuvo neutral en casi todo y es alguien en quien se puede confiar; pero los conservadores internos del partido, encabezados por el presidente del parlamento Émile Reuter, han obstaculizado activamente la “igualdad institucional” de Aru, incluida la ley de derechos civiles.\n\nNos distanciaremos de todos los dirigentes del Partido de la Derecha, excepto Bech, y minimizaremos su influencia."

 HEU_neutralization_rietspartei_desc_text_true:0 "El golpe fue un éxito perfecto, y el Partido de la Derecha —de forma ridícula— exige el regreso al poder de Rikuhachima Aru, a quien querían expulsar.\n\n¿Ahora sí la extrañan? Pues que se coman una ráfaga de ametralladora."

 HEU_separation_of_education:0 "Hoy separación educativa, mañana también"
 HEU_separation_of_education_desc:0 "Las escuelas católicas locales de Luxemburgo, que enseñan que las mujeres deben obedecer a los hombres (y por tanto sostienen que la población de Kivotos, mayoritariamente femenina, también debe obedecer), deben cerrarse.\n\nPero en lugar de una reforma inmediata, será un proceso gradual mediante separación educativa. Se construirán nuevas escuelas para la población de Kivotos, mientras que las escuelas locales gestionadas por católicos sufrirán discriminación en subvenciones, número total de estudiantes y otros apoyos.\n\nCon discriminación y separación, las escuelas católicas acabarán cerrando por sí solas."

 HEU_separation_of_education_text_fake:0 "Hoy separación educativa, mañana también"
 HEU_separation_of_education_text_true:0 "Orden de cierres masivos de escuelas en Luxemburgo"

 HEU_separation_of_education_desc_text_fake: "Las escuelas católicas locales de Luxemburgo, que enseñan que las mujeres deben obedecer a los hombres (y por tanto sostienen que la población de Kivotos, mayoritariamente femenina, también debe obedecer), deben cerrarse.\n\nPero en lugar de una reforma inmediata, será un proceso gradual mediante separación educativa. Se construirán nuevas escuelas para la población de Kivotos, mientras que las escuelas locales gestionadas por católicos sufrirán discriminación en subvenciones, número total de estudiantes y otros apoyos.\n\nCon discriminación y separación, las escuelas católicas acabarán cerrando por sí solas."

 HEU_separation_of_education_desc_text_true:0 "Las escuelas católicas locales de Luxemburgo, que enseñan que las mujeres deben obedecer a los hombres (y por tanto sostienen que la población de Kivotos, mayoritariamente femenina, también debe obedecer), deben ser aplastadas sin piedad.\n\nSi sus escuelas enseñan esa basura… ¿de verdad necesitan recibir educación?"

 HEU_forgiving_them:0 "Perdonaré vuestros pecados"
 HEU_forgiving_them_desc:0 "Aru no es alguien capaz de ser hardboiled. Por mucho que los locales la odien, no puede abandonar el sueño de un paraíso para locales y Kivotos.\n\nAquel día en que los disparos no cesaban y ella cayó en las calles de Luxemburgo… ¿no fue un médico local quien, sin dudar, le tendió la mano?"

 HEU_forgiving_them_1:0 "Cooperación con los reformistas"
 HEU_forgiving_them_1_desc:0 "El Partido de la Derecha ya habrá comprendido que, en Luxemburgo, es imposible que recuperen el poder por sí solos.\n\nClaro, aún quedan políticos que se niegan a aceptarlo, pero hay una cosa afortunada: dentro del partido también existen facciones.\n\nLos “conservadores”, alrededor de Émile Reuter, son tan duros que incluso niegan el sistema de democracia representativa. Pero la minoría interna “reformista”, encabezada por Pierre Dupong, sí es negociable."

 HEU_forgiving_them_2:0 "Reforzar la Ley de Derechos Civiles"
 HEU_forgiving_them_2_desc:0 "La ley fracasó porque se percibía como una ley que protegía solo a Kivotos.\n\nEntonces, pactemos con la realidad. Ahora mismo, como casi toda la élite es luxemburguesa, la enmienda quizá no tenga gran eficacia… pero Aru acordó con Pierre Dupong, líder reformista, fortalecer la ley para incluir también casos “inversos”, como la “discriminación de locales por parte de Kivotos”, dentro de las conductas sancionables.\n\nEsta ley se promulgará formalmente a través del parlamento, sin recurrir a los poderes de la regencia."

 HEU_forgiving_them_3:0 "Frenazo brusco ante la línea"
 HEU_forgiving_them_3_desc:0 "Aru ejerció la máxima paciencia y, aun después del inicio de la Revolución 68, no abandonó por completo la alianza con colaboradores nativos.\n\nEsta elección ralentizará y entorpecerá un poco el plan de “kivotización” local. Pero también trae algo bueno.\n\nAlgunos campesinos y nacionalistas locales, al juzgar a Aru como una líder “capaz de comprometerse”, están retirando su hostilidad hacia nosotros.\n\nUna última paciencia trajo beneficios para todos."

 HEU_go_to_the_bottom_of_gehenna:0 "Hasta el fondo de Gehenna, el valle de Hinnom"
 HEU_go_to_the_bottom_of_gehenna_desc:0 "Por un asombroso azar, según la fe local que veneran, “Gehenna” es otra forma de llamar al infierno, una palabra derivada del valle de Hinnom.\n\nSi los locales quieren reprimir y quemar a los de Kivotos… entonces sí: hagámosles entender dónde están.\n\nEste es el fondo de Gehenna, el valle de Hinnom. Nazistas y católicos se derretirán en el fondo ardiente del infierno."

 HEU_go_to_the_bottom_of_gehenna_1:0 "Impuesto de fe"
 HEU_go_to_the_bottom_of_gehenna_1_desc:0 "Todo local que no sea ateo deberá registrar su religión.\n\nSi la religión registrada es el catolicismo, deberán pagar un pesado impuesto especial hasta que escriban una “carta de conversión” declarando que se harán ateos.\n\nEste impuesto se redistribuirá para las estudiantes de Kivotos que llegan para apoyar la Revolución 68.\n\nComo los católicos registran su identidad en la iglesia, no será difícil descubrir a los “falsos ateos” que intenten evadir impuestos."

 HEU_go_to_the_bottom_of_gehenna_2:0 "Desnazificación"
 HEU_go_to_the_bottom_of_gehenna_2_desc:0 "El uso de la esvástica en espacios públicos, el apoyo público al antiguo partido gobernante de la vieja Alemania —el Partido Nacionalsocialista Alemán de los Trabajadores— y la adhesión al racismo de Adolf Hitler quedan ahora explícitamente prohibidos en todo Luxemburgo.\n\nCualquier racismo que discrimine a Kivotos es igual de repugnante, pero por experiencia de Aru, los restos nazis en Luxemburgo tienden especialmente a llamar a los transeúntes de Kivotos *Untermensch* (subhumanos) y despreciarlos."

 HEU_go_to_the_bottom_of_gehenna_3:0 "Nuevo orden del rikuhachimaismo"
 HEU_go_to_the_bottom_of_gehenna_3_desc:0 "La destrucción y recreación de la cultura local debe hacerse de forma más dura y radical.\n\nLos vestigios culturales medievales de Luxemburgo serán derribados. Las reliquias serán fundidas para devolverlas a materia prima.\n\nNo es porque Aru sea cruel ni porque disfrute atormentar a los locales. Es porque, mientras la cultura local siga viva, no se podrá romper la cadena de odio de los locales contra los de Kivotos.\n\nLa recreación a través de la destrucción debe ejecutarse con firmeza."

 HEU_sad_aru_1:0 "Un mal al día"
 HEU_sad_aru_1_desc:0 "Ese lema, “un mal al día”, que antes colgaba en la pared de la oficina de la Agencia 68 y ahora cuelga en la pared de la pensión de Aru.\n\nPara proteger a los de Kivotos en Luxemburgo, Aru intentará practicar una vez más el “un mal al día”, aunque no sea mal auténtico sino ‘maldad fingida’.\n\nPara que las demás estudiantes de Kivotos que participan en la Revolución 68 no sean culpadas, Aru apoyará por completo las exigencias de los grupos estudiantiles radicales.\n\nPara que la ira y el odio de los conservadores no caigan sobre las estudiantes… sino sobre ella."

 HEU_sad_aru_2:0 "La forajida para nosotros"
 HEU_sad_aru_2_desc:0 "Al cargar Aru por completo con la cruz de la Revolución 68, ocurrieron dos cambios.\n\nUno: las cartas de amenaza de muerte que llegan al palacio se multiplicaron por diez.\n\nDos: Aru obtuvo una imagen —algo exagerada— de revolucionaria carismática.\n\nAumentó el número de habitantes de Kivotos que vienen a unirse a la revolución, y entre ellos también hay estudiantes interesadas en expandirla mediante la fuerza."

 HEU_focus_on_french_language: "Centrarnos en el francés"
 HEU_focus_on_french_language_desc: "Las fuerzas nacionalistas luxemburguesas comparten una idea: “Somos alemanes”.\n\nOrganizaciones pro-germanas como GEDELIT intentaron equiparar a los luxemburgueses con los alemanes e imponer un nacionalismo pangermánico.\n\nReforzar el francés es indispensable para debilitar el poder político de nacionalistas como GEDELIT."

 HEU_our_mutsuki_government: "Cerrar el parlamento luxemburgués"
 HEU_our_mutsuki_government_desc: "Ya no habrá democracia parlamentaria. Todo el poder se concentrará en el ejecutivo, y a todos los diputados se les prohibirá la actividad política.\n\nSabemos que esto hace imposible “cooperar” con los locales.\n\nPero… ¿por qué necesitaríamos cooperar con ellos?"

 HEU_divide_and_rule_1: "Nueva Ley de Derechos Civiles"
 HEU_divide_and_rule_1_desc: "Con el parlamento neutralizado, el ejecutivo puede tramitar por sí solo la Ley de Derechos Civiles que el parlamento rechazó."

 HEU_divide_and_rule_2: "La libertad de Gehenna, la libertad de Francia"
 HEU_divide_and_rule_2_desc: "Luxemburgo es un país en la franja fronteriza entre Alemania y Francia. Las culturas de ambos países están profundamente mezcladas, hasta el punto de que la mayoría de la población tiene apellidos alemanes y nombres franceses.\n\nDar peso a la cultura francesa no es porque amemos Francia ni porque queramos importar su cultura liberal, sino porque eso profundiza la división interna de Luxemburgo."

 HEU_divide_and_rule_3: "Dividir para gobernar"
 HEU_divide_and_rule_3_desc: "Mientras mantenemos la propaganda externa de que “Luxemburgo es el estado representante del pueblo germánico” para Aru, al mismo tiempo enfatizamos internamente la cultura francesa para impedir que el pueblo se una y para fomentar la fragmentación.\n\nLa población se ha dividido en un bloque francófono y otro germanófono, y fuera de nuestras fronteras muchos germanos nos apoyan.\n\nEs magnífico."

 HEU_doing_nothing_is_the_best_policy: "Comité de inacción de Mutsuki"
 HEU_doing_nothing_is_the_best_policy_desc: "Todo el mundo sabe que el golpe de Mutsuki no se basó en una ideología ni en una convicción. Asagi Mutsuki también lo sabe.\n\nElla no logra fijar un rumbo especial para dirigir el país, y probablemente tampoco podrá establecer en adelante una dirección ideológica clara."

 HEU_mutsuki_shogunate_1: "Shogunato de Asagi"
 HEU_mutsuki_shogunate_1_desc: "El marco estatal llamado Luxemburgo aún existe, pero el país ha quedado con una estructura de poder caótica: un gran duque reducido a polvo de hueso, una regente marioneta y, detrás de ella, un shogun.\n\nEl Shogunato de Asagi debe decidir la dirección del gobierno y lograr que este país destrozado siga moviéndose como un “estado”."

 HEU_mutsuki_shogunate_2: "Consejo burocrático de Kivotos"
 HEU_mutsuki_shogunate_2_desc: "Como Mutsuki no tiene el talento para gobernar un país, muchos burócratas ayudarán a administrar el gobierno."

 HEU_mutsuki_shogunate_3: "Completar la nueva coalición oligárquica"
 HEU_mutsuki_shogunate_3_desc: "Con la desaparición de las fuerzas de resistencia y la estabilización de la política luxemburguesa, ahora podemos decir con confianza que logramos tomar Luxemburgo y estabilizar el sistema oligárquico."

 HEU_mutsuki_path_1: "Por mi preciada tú"
 HEU_mutsuki_path_1_desc: "Yo no quería que fuera así, pero todo me empujó hasta aquí. Si hay que culpar a alguien, no soy yo: son los adultos que me metieron en esta situación.\n\nBueno… ¿ahora ya puedo decir que soy una adulta? Pero, ¿qué es ser un adulto?\n\nAru-chan… oye, Aru-chan.\n\nPara ti, ¿qué es un adulto?\n\n¿Cómo puedo crecer? Quiero ser alguien que guíe a todos, por todos.\n\nQuiero… que solo yo pueda ser el lugar en el que tú te apoyes.\n\nAsí que, por favor… sí… Aru-chan… mírame…"

 HEU_mutsuki_path_2: "También estoy lista para cargar con el odio"
 HEU_mutsuki_path_2_desc: "De verdad… haré lo que sea…"

 HEU_question_of_succession_law_mutsuki_path: "La líder de todos"
 HEU_question_of_succession_law_mutsuki_path_desc: "Con el renacido Principado Unido Germánico controlando por completo toda la tierra de Alemania, Asagi Mutsuki piensa poner fin a su dictadura.\n\nTodo esto fue para convertir a Aru en una heroína.\n\nAru-chan reconocerá todos mis esfuerzos… y me perdonará.\n\n¿Verdad?"

 ### 자립 흥신소 내정 (공산)
 HEU_no_more_french:0 "Regulación del francés"
 HEU_no_more_french_desc:0 "Luxemburgo es una región germanoparlante, pero al mismo tiempo el francés, considerado desde antaño como un 'lenguaje diplomático refinado', también ha sido ampliamente utilizado. En Luxemburgo es común encontrar personas con nombres franceses y apellidos de origen alemán, y aunque en la vida cotidiana se emplea el alemán, existe la cultura de redactar los documentos oficiales en francés. Este sistema bilingüe es ineficiente y, al menos en ámbitos oficiales como los documentos públicos, es necesario rechazar el francés y utilizar únicamente el alemán para optimizar la administración."

 HEU_unwelcome_school:0 "Escuela no bienvenida"
 HEU_unwelcome_school_desc:0 "Entre los inmigrantes de origen Gehenna se ha extendido el sarcasmo de que Aru es excesivamente amigable con los locales, o incluso que se ha convertido en su perro. ¿Acaso fue un error intentar mejorar los derechos de los kivotosianos ganándose primero la confianza de los habitantes locales y apoyándose en ella?"

 HEU_mercy_but_not_foget:0 "Perdonar, pero no olvidar"
 HEU_mercy_but_not_foget_desc:0 "Entre los luxemburgueses, la víctima más conocida del Gran Traslado fue la familia gran ducal, pero además de ella, cientos de gendarmes y civiles también sufrieron heridas de bala, y la opinión pública exige castigos severos para las estudiantes que participaron en los disturbios. Sin embargo, resulta irracional castigar con dureza todos los asesinatos cometidos accidentalmente por estudiantes que provenían de un mundo donde recibir disparos no implicaba la muerte. Debemos perdonarlas, pero ¿no es necesario darles una oportunidad de reflexionar y expiar sus culpas? El método de expiación será el reclutamiento."

 HEU_execution_for_all:0 "Réquiem para todos"
 HEU_execution_for_all_desc:0 "Entre los luxemburgueses, la víctima más conocida del Gran Traslado fue la familia gran ducal, pero además de ella, cientos de gendarmes y civiles también sufrieron heridas de bala, y la opinión pública exige castigos severos para las estudiantes que participaron en los disturbios. No solo los partidos de derecha, sino también las masas luxemburguesas sostienen que aquellos que fueron capturados por provocar disturbios durante el Gran Traslado deben ser ejecutados."

 HEU_national_security_agency:0 "Agencia de Seguridad Nacional"
 HEU_national_security_agency_desc:0 "Debido a la terrible destrucción ocurrida durante el Gran Traslado, Luxemburgo vive con el temor de una invasión externa. La Agencia de Seguridad Nacional será creada como un organismo gubernamental encargado de vigilar la posibilidad de una nueva invasión a Luxemburgo por parte de las fuerzas de Kivotos en los alrededores."

 HEU_preparation_for_confusion:0 "No habrá una segunda masacre"
 HEU_preparation_for_confusion_desc:0 "¿Podría repetirse una vez más el caos vivido durante el Gran Traslado? Varios partidos locales sostienen que es necesaria una organización mínima de defensa civil para mantener el orden frente a una invasión de las fuerzas de Kivotos. La nueva organización de defensa civil operará para preservar la seguridad de Luxemburgo, incorporando obligatoriamente tanto a la población de origen Kivotos como a los locales, con el objetivo adicional de reducir los conflictos entre ambos pueblos y fomentar el sentido de pertenencia a una misma comunidad."

 HEU_catholicism_for_aru:0 "Catolicismo reformado"
 HEU_catholicism_for_aru_desc:0 "El Partido Comunista de Luxemburgo desea destruir el catolicismo, pero reconoce que incluso la Unión Soviética fracasó al intentar separar a los rusos de la Iglesia Ortodoxa. En su lugar, el partido propone como alternativa una reforma de 'separación' entre el catolicismo luxemburgués y el catolicismo romano. El derecho de nombramiento de obispos quedará en manos del palacio gran ducal, y se creará una Iglesia católica 'reformada', más favorable a las mujeres y a los kivotosianos."

 HEU_nationalization_of_education:0 "Nacionalización de la educación privada"
 HEU_nationalization_of_education_desc:0 "Para secularizar la educación en Luxemburgo, es necesario priorizar la nacionalización de las instituciones educativas. El Partido Comunista desea invitar a profesores alemanes verificados y reemplazar gradualmente a los docentes católicos creyentes de las escuelas privadas luxemburguesas. Los nuevos profesores, portadores de ideas revolucionarias, enseñarán la armonía y la convivencia entre Kivotos y la población local."

 HEU_liberation_theology:0 "Asociación Católica Revolucionaria Nacional"
 HEU_liberation_theology_desc:0 "La 'asociación revolucionaria' patrocinada por el gobierno de Luxemburgo es una organización religiosa afín al poder, creada para reformar incluso las enseñanzas religiosas de los sacerdotes católicos conforme a las particularidades luxemburguesas, tras la separación permanente entre el catolicismo luxemburgués y el catolicismo romano. Todos los sacerdotes católicos deberán registrar su estatus en esta organización, y las doctrinas promovidas incluirán la exigencia de inclusión hacia los gehenianos llegados por el Gran Traslado, el socialismo cristiano y la liberación laboral de la mujer."

 HEU_sovereignty_act:0 "Ley de Soberanía"
 HEU_sovereignty_act_desc:0 "Luxemburgo es tierra del pueblo germánico, y los kivotosianos no son más que una minoría desplazada hasta aquí. La Ley de Soberanía permitirá establecer consejos autónomos para los kivotosianos en cada cantón, las divisiones administrativas locales de Luxemburgo, otorgándoles derechos limitados para que puedan recibir la protección adecuada bajo la ley de derechos civiles."

 HEU_for_you:0 "Era por ustedes"
 HEU_for_you_desc:0 "Un mundo en el que kivotosianos y locales convivan. No es fácil esperar que ese sueño sea comprendido de inmediato. Pero Aru coopera con las fuerzas locales por una sola razón: porque cree que este es el camino más correcto hacia la convivencia. Se reunirá con representantes de los inmigrantes de diversas academias para intentar persuadirlas y lograr su comprensión."

 HEU_for_you_2:0 "Aunque lleve tiempo"
 HEU_for_you_2_desc:0 "¿Es sencillo comprender la cultura local y esforzarse por convivir con ellos? Probablemente no lo sea. Aru también ha enfrentado muchas injusticias en Luxemburgo. Pero si dedicamos tiempo y convivimos juntos, quizá podamos reformar Luxemburgo poco a poco."

 HEU_for_you_3:0 "Un partido para los kivotosianos"
 HEU_for_you_3_desc:0 "Luxemburgo está cambiando, aunque sea lentamente. Incluso los locales que estaban insatisfechos con la ley de derechos civiles han empezado a reconocer que los kivotosianos son personas comunes, solo un poco peculiares por tener un halo sobre la cabeza. Demos ahora un paso más. Continuaremos las reformas dentro del marco legal de Luxemburgo y fundaremos el 'Partido de Kivotos', ampliando nuestros derechos mediante el diálogo parlamentario."

 HEU_question_of_succession_law:0 "Reforma de la ley de sucesión"
 HEU_question_of_succession_law_desc:0 "La posición legal de Rikuhachima Aru sigue siendo la de 'regente de la casa gran ducal', y el partido de derecha continúa intentando arrebatarle el poder importando nobles extranjeros como grandes duques. Ahora que las conspiraciones del partido de derecha están saliendo cada vez más a la superficie, es necesario que Rikuhachima Aru abandone la regencia y ascienda formalmente al trono como gran duquesa."

 HEU_luxembourgism_focus_1:0 "Parque Conmemorativo"
 HEU_luxembourgism_focus_1_desc:0 "Tras la gran coalición, continúan las protestas tanto de los kivotosianos como de los locales. Aun así, Aru se esfuerza desesperadamente por unificar una opinión pública dividida. Como primer plan tras la gran coalición, se construirá un parque conmemorativo para los habitantes locales. Levantaremos un parque en el antiguo palacio vendido por la casa de Nassau para honrar a las víctimas del Gran Traslado y enviaremos primero un mensaje de disculpa, con la esperanza de que los locales puedan perdonar a los gehenianos."

 HEU_luxembourgism_focus_2:0 "Industria para todos"
 HEU_luxembourgism_focus_2_desc:0 "Gracias a nuestros esfuerzos por construir el parque conmemorativo, la armonía entre razas se está logrando poco a poco. Algunos clubes de Gehenna incluso han tenido éxito en la creación de empresas conjuntas entre Gehenna y la humanidad. En medio de las dificultades, empieza a vislumbrarse la esperanza."

 HEU_luxembourgism_focus_3:0 "Rapsodia de Año Nuevo n.º 68"
 HEU_luxembourgism_focus_3_desc:0 "La cohesión de la Agencia de Detectives 68 comenzó a resquebrajarse desde que Aru decidió seguir el camino de la gran coalición. No puede decirse, ni siquiera como cortesía, que sus decisiones hayan hecho felices a las integrantes de la agencia. Incluso si la abandonan, ella no podría reprocharles nada. Pero si no lo hacen, ¿no habrá algo que deba decirles? Aunque no puedan regresar a Kivotos, al menos por las amigas con las que seguirá compartiendo este mundo."

 ### 자립 흥신소 외교 (공용)
 HEU_doubt_pandemonium_society:0 "Declaración de gobierno ilegal del Pandemonium"
 HEU_doubt_pandemonium_society_desc:0 "[HEU_doubt_pandemonium_society_desc_text]"

 HEU_doubt_pandemonium_society_desc_text_fascism:0 "Aru ya ha abandonado la expectativa de que 'si aceptamos las infinitas exigencias de los locales, ellos llegarán a entendernos'. Aun así, la razón por la que escucha las bonitas tonterías del 'pangermanismo liderado por Luxemburgo' que sueña el partido de derecha no es más que una: el apego humano hacia Besch, el único colaborador de la derecha que queda, y el hecho de que, para que el sistema de la 'Revolución del 68' perdure, Luxemburgo debe expandir su territorio y adquirir la fuerza para valerse por sí mismo."

 HEU_doubt_pandemonium_society_desc_text_generic:0 "Rikuhachima Aru no tiene interés en el nacionalismo de los locales, pero atender sus exigencias ayuda a establecer una 'relación amistosa entre locales y kivotosianos'. Además, no sabemos hasta cuándo podremos mantenernos por nuestra cuenta en un territorio tan pequeño como Luxemburgo. El Pandemonium es el enemigo más peligroso que amenaza la supervivencia de Luxemburgo y, al mismo tiempo, también es el primer enemigo que debe ser derrocado por el 'pangermanismo' que proclama la derecha luxemburguesa."

 HEU_doubt_pandemonium_society_desc_text_mutsuki:0 "¿Por qué propaganda como el pangermanismo liderado por Luxemburgo llega a funcionar? El gabinete de Mutsuki aplicó una política de represión étnica rigurosamente antigermánica. Lo importante es que esta doble moral funciona dentro del país, y que incluso ciudadanos germánicos en el extranjero han empezado a dejarse arrastrar y a apoyar a nuestro Luxemburgo. Qué bien, ¿no? Apuñalaremos a Gehenna y, desde el oeste, iniciaremos un gigantesco rugido."

 HEU_ally_with_the_devil:0 "Alianza temporal"
 HEU_ally_with_the_devil_desc:0 "Sabemos demasiado bien que Trinity no nos ve con buenos ojos. Si Trinity derriba a Gehenna, el siguiente enemigo seremos nosotros. Pero lo importante es que sea 'después de Gehenna'. Si ellas atacan a Gehenna, podremos asaltar la retaguardia de Gehenna junto con ellas. Trinity también sabrá que somos un enemigo potencial, pero se aliará con nosotros por la ventaja de 'dividir las fuerzas del Pandemonium y del Equipo Prefecto'."

 HEU_representative_of_the_germanic:0 "El verdadero último Estado-nación germánico"
 HEU_representative_of_the_germanic_desc:0 "[HEU_representative_of_the_germanic_desc_text]"

 HEU_representative_of_the_germanic_desc_text_fascism:0 "Los locales vitorean el hecho de que la regente Rikuhachima Aru haya declarado al Gran Ducado de Luxemburgo como el 'verdadero' último Estado-nación germánico. Que vitoreen lo que quieran. Viéndolo con cinismo, esta declaración no es más que un 'uso' de los locales para enviarlos al campo de batalla por los kivotosianos. Por eso, todos en la Agencia de Detectives 68 preguntan: \"¿De verdad esto era lo que querías? ¿No te estás ahogando en el ideal de proteger a los kivotosianos?\" Claro, ¿qué podría decir Aru?"

 HEU_representative_of_the_germanic_desc_text_generic:0 "Los locales vitorean el hecho de que la regente Rikuhachima Aru haya declarado al Gran Ducado de Luxemburgo como el 'verdadero' último Estado-nación germánico. Ante esto, el Partido Comunista de Luxemburgo comenta con cinismo: ¿no será que esta declaración no es más que un 'uso' de los locales para hacerlos salir al frente por los kivotosianos? Que, en lugar de los kivotosianos, los nacionalistas luxemburgueses sean los que hagan de escudo de balas. ¿Qué respuesta puede dar Aru? ¿Este es su camino como 'forajida'? ¿De verdad?"

 HEU_representative_of_the_germanic_desc_text_mutsuki:0 "Los locales vitorean el hecho de que el nuevo gabinete de Mutsuki haya declarado al Gran Ducado de Luxemburgo como el 'verdadero' último Estado-nación germánico. Que vitoreen lo que quieran. Viéndolo con cinismo, esta declaración no es más que un 'uso' de los locales para enviarlos al campo de batalla por los kivotosianos. Pero no hace falta preocuparse. Todo esto no es más que una parte de una gran narrativa destinada a convertir a Rikuhachima Aru en una heroína."

 HEU_war_industry_alt:0 "Ley de economía de guerra"
 HEU_war_industry_alt_desc:0 "El Gran Ducado de Luxemburgo se sostiene en soledad. Para protegerse de las amenazas que lo rodean, necesita el máximo armamento posible. Aunque eso sea doloroso..."

 HEU_alsace_lorraine:0 "La cuestión de Alsacia-Lorena"
 HEU_alsace_lorraine_desc:0 "Alsacia-Lorena es una región pequeña, pero para el llamado pueblo germánico se considera un 'territorio propio que debe recuperarse'."

 HEU_attack_pandemonium_society:0 "Desmantelar el Pandemonium"
 HEU_attack_pandemonium_society_desc:0 "[HEU_attack_pandemonium_society_desc_text]"

 HEU_attack_pandemonium_society_desc_text_fascism:0 "¡Comienza el audaz avance hacia el oeste de Deutschland, el corazón del gran pueblo germánico! ¡Larga vida a la regente Rikuhachima Aru, líder del pueblo germánico! Bah, no digas mamadas. ¿Qué 'ideal' hay aquí? Aru está sentada en la reluciente oficina de la Agencia de Detectives 68, arrojando a la gente como carne de cañón para proteger la 'Revolución del 68' y para la armonía entre Kivotos y la humanidad. Todo esto es para proteger a los kivotosianos, ¿sí? ¿Verdad?"

 HEU_attack_pandemonium_society_desc_text_generic:0 "¡Comienza el audaz avance hacia el oeste de Deutschland, el corazón del gran pueblo germánico! ¡Larga vida a la regente Rikuhachima Aru, líder del pueblo germánico! Bah, no digas mamadas. ¿Qué 'ideal' hay aquí? El partido de derecha lanza vítores, y el Partido Comunista de Luxemburgo utiliza cínicamente a Aru (para difundir la revolución). Aru usa a los locales arrojándolos como carne de cañón por la armonía entre Kivotos y la humanidad. Qué maravilla. Qué orgullosa se siente de sí misma."

 HEU_attack_pandemonium_society_desc_text_mutsuki:0 "¡Comienza el audaz avance hacia el oeste de Deutschland, el corazón del gran pueblo germánico! ¡Larga vida a la regente Rikuhachima Aru, líder del pueblo germánico! Ajajaja. Bueno, la verdadera Rikuhachima Aru escupe sobre este plan, lo odia y siente náuseas ante la locura de esta guerra, pero no importa. ¡Cuando todo esto termine, Aru seguramente nos entenderá! ...¿Verdad?"

 HEU_attack_prefect_team:0 "Poner fin a la mala sangre con el Equipo Prefecto"
 HEU_attack_prefect_team_desc:0 "El Equipo Prefecto ha hostigado a la Agencia de Detectives 68 desde hace mucho tiempo. Destruir de forma permanente a un Equipo Prefecto de Gehenna convertido en una fuerza caudillista suena como una historia bastante divertida. Pero no es algo que alegre del todo. Porque entonces surge el pensamiento de si, quizá, no habría sido mejor la vida en Kivotos, huyendo del Equipo Prefecto."

 HEU_attack_trinity:0 "La caída del ángel"
 HEU_attack_trinity_desc:0 "Para lograr la unificación de Deutschland, la guerra contra Trinity es inevitable e indispensable. La unificación de Deutschland liderada por Luxemburgo también simboliza que el paraíso donde kivotosianos y locales conviven felizmente habrá adquirido la fuerza suficiente para protegerse de la invasión externa. ...¿De verdad Aru también lo cree así?"

 HEU_germany_union:0 "Declaración de la Ley de Unión"
 HEU_germany_union_desc:0 "[HEU_germany_union_desc_text]"

 HEU_germany_union_desc_text_despair:0 "§RAhora, ya basta...§!"

 HEU_germany_union_desc_text_fascism:0 "Se ha construido un paraíso terrenal donde se armonizan kivotosianos y locales, un Gran Ducado de Luxemburgo pangermánico donde arde la libertad de la Revolución del 68. La gran Rikuhachima Aru declaró, sobre las ruinas de Edén, la Ley de Unión que proclama que Luxemburgo y Alemania se han integrado para siempre como uno, y todas las integrantes de la Agencia de Detectives 68 alaban su gran hazaña a su alrededor. ¡Larga vida a Rikuhachima Aru! ¡El éxito del gran forajido hardboiled quedará para siempre en la historia!"

 HEU_germany_union_desc_text_generic:0 "Se ha construido un paraíso terrenal donde se armonizan kivotosianos y locales, un Gran Ducado de Luxemburgo pangermánico respaldado por todos los partidos locales, desde el partido de derecha hasta el Partido Comunista de Luxemburgo. La gran Rikuhachima Aru declaró, sobre las ruinas de Edén, la Ley de Unión que proclama que Luxemburgo y Alemania se han integrado para siempre como uno, y todas las integrantes de la Agencia de Detectives 68 alaban su gran hazaña a su alrededor. ¡Larga vida a Rikuhachima Aru! ¡El éxito del gran forajido hardboiled quedará para siempre en la historia!"

 HEU_germany_union_desc_text_mutsuki:0 "Se ha construido un paraíso terrenal donde se armonizan kivotosianos y locales, un Gran Ducado de Luxemburgo pangermánico erigido sobre los cadáveres de los germanos. Asagi Mutsuki declaró, sobre las ruinas de Edén, la Ley de Unión que proclama que Luxemburgo y Alemania se han integrado para siempre como uno, y todos los kivotosianos elogian la gran hazaña de nuestro gobierno. ¡Larga vida a Rikuhachima Aru! ¡Y larga vida a Asagi Mutsuki, protectora de Aru! ¡Nuestro éxito permanecerá para siempre en la historia!"

# }} Fin de los enfoques políticos anti-Gehenna
# {{ Enfoques industriales

 HEU_end_of_holding_act:0 "Derogación de la Ley de Holdings de 1929"
 HEU_end_of_holding_act_desc:0 "La 'Ley de Holdings de 1929' es una ley que exime de todo impuesto sobre la renta a las empresas holding multinacionales radicadas en Luxemburgo. Fue promulgada para atraer a multinacionales europeas a trasladar sus empresas a Luxemburgo con fines de evasión fiscal. El problema es que, tras el 'Gran Traslado', la mayoría de los Estados locales vecinos han desaparecido. Con el colapso del bloque económico capitalista europeo, Luxemburgo ha perdido su valor como paraíso fiscal, y la ley de holdings ahora solo perjudica a Luxemburgo sin aportarle ningún beneficio económico."

 HEU_guillaume_kroll_focus:0 "Comercialización del titanio"
 HEU_guillaume_kroll_focus_desc:0 "Guillaume Kroll afirma haber inventado una tecnología capaz de producir en masa un nuevo material avanzado llamado titanio. Necesita a un empresario ambicioso que invierta en ello, pero en Luxemburgo nadie quiere patrocinarlo. ...Claro que una administradora tan talentosa como Rikuhachima Aru sabrá reconocer su valor."

 HEU_nationalisation_of_ARBED:0 "Nacionalización de ARBED"
 HEU_nationalisation_of_ARBED_desc:0 "ARBED, la mayor empresa siderúrgica de Luxemburgo, es una multinacional sostenida por capital de Francia, Bélgica y Luxemburgo. Pero ahora que Francia y Bélgica han desaparecido, ARBED se tambalea por una grave escasez de fondos y el caos. Es demasiado importante como para dejar que quiebre tal cual, así que debemos comprar las participaciones empresariales de la antigua Francia y Bélgica y nacionalizarla."

 HEU_CLR_reconstruction:0 "Reconstrucción de CLR"
 HEU_CLR_reconstruction_desc:0 "A diferencia de Kivotos, donde existían transmisiones masivas activas como la prensa de Kronos, en la Tierra los medios de radiodifusión aún no se han desarrollado demasiado. Pero Luxemburgo es distinto. CLR fue la primera emisora privada creada en el continente europeo. Aunque fue abandonada en el caos del Gran Traslado, si reconstruimos CLR también será de gran ayuda para promocionar el negocio de la Agencia de Detectives de Aru."

 HEU_BLEU_left:0 "Implementar el patrón oro"
 HEU_BLEU_left_desc:0 "BLEU (Belgium–Luxembourg Economic Union) fue una unión monetaria única creada para vincular la moneda belga y la luxemburguesa al mismo valor.\nCon el colapso del gobierno belga, ya no podemos seguir utilizando el 'franco belga' como moneda luxemburguesa (franco luxemburgués). Por suerte, desde 1929 comenzamos a acumular reservas de oro para emergencias, así que podemos implementar el patrón oro y crear nuestro propio 'marco luxemburgués'."

 HEU_BLEU_right:0 "Propuesta de negociación del BLEU"
 HEU_BLEU_right_desc:0 "BLEU (Belgium–Luxembourg Economic Union) fue una unión monetaria única creada para vincular la moneda belga y la luxemburguesa al mismo valor. ¿Que es parecido al euro? En esta época no existe eso. Ubícate.\nAunque el gobierno belga se derrumbó, Valkyrie sigue allí, ocupando el territorio belga. Tal vez sea posible reconstruir la unión económica BLEU con Valkyrie."

 HEU_national_labour_council:0 "Consejo Nacional del Trabajo"
 HEU_national_labour_council_desc:0 "Aunque políticos de derecha locales, incluido Besch, se oponen con firmeza, el Consejo Nacional del Trabajo ha sido un organismo exigido con fuerza desde hace tiempo por comunistas y sindicatos socialistas de Luxemburgo. Esta institución mediará para que capitalistas y trabajadores de Luxemburgo discutan y decidan los salarios empresariales en igualdad de condiciones. Aru, que simpatiza con la 'gente común' y ha observado de cerca los lugares de trabajo de los locales, aprobó esta ley que hasta ahora la derecha había rechazado."

 HEU_ban_quadragesimo_anno:0 "Negación de Quadragesimo Anno"
 HEU_ban_quadragesimo_anno_desc:0 "'Quadragesimo Anno' se refiere a la 'sociedad correcta' proclamada en 1931 por el Papa de Roma, respaldada por el partido de derecha, un partido católico. Según las enseñanzas papales, las mujeres deben permanecer en el rol tradicional de proteger el hogar. A la derecha local no le gustará, pero la participación social de las mujeres (incluida la propia Aru) impulsará la economía de Luxemburgo y ayudará a que los inmigrantes de Kivotos y los locales convivan en armonía."

 HEU_dairy_farming:0 "Política de apoyo al sector primario"
 HEU_dairy_farming_desc:0 "Aunque Luxemburgo se esforzó por industrializar el país antes del Gran Traslado, aún así el 30% de su población trabaja en la agricultura y la ganadería lechera. Ellos son el grupo que más ferozmente desprecia a los inmigrantes de Kivotos aparecidos tras el Gran Traslado, pero Aru cree que, si los apoya con paciencia, podrá cambiar sus corazones."

 HEU_trade_union_permission:0 "Permitir los sindicatos"
 HEU_trade_union_permission_desc:0 "Hasta ahora, los sindicatos no eran más que organizaciones informales y no contaban con ninguna protección legal. Pero con la autorización de Aru, los sindicatos recibirán ahora protección legal y, junto con el Consejo Nacional del Trabajo, garantizarán los derechos de los trabajadores locales."

 HEU_laicism:0 "Separación Estado-Iglesia católica"
 HEU_laicism_desc:0 "La Iglesia católica es la fuerza que se opone con mayor ferocidad a la integración entre kivotosianos y locales. Como obstaculiza la 'armonía entre locales y kivotosianos' que Aru sueña, debe ser reprimida. Se seguirá permitiendo que el individuo crea en la fe católica, pero se prohibirá estrictamente que los católicos formen organizaciones o se reúnan en iglesias y similares para celebrar actos religiosos de manera colectiva."

 HEU_steel_support:0 "Apoyo a la industria siderúrgica"
 HEU_steel_support_desc:0 "Tras el Gran Traslado, muchos extranjeros que sostenían la industria siderúrgica de Luxemburgo se han marchado. Para ganarnos el favor de los locales, es el momento de brindar un apoyo financiero adecuado a esta industria."

 HEU_nationalization_of_railways:0 "Nacionalización del ferrocarril"
 HEU_nationalization_of_railways_desc:0 "La nacionalización ferroviaria, respaldada por los partidos de izquierda luxemburgueses, no solo permitirá que los locales utilicen el transporte público a un costo menor, sino que también será útil si la Agencia de Detectives 68 llega a aplicar políticas 'expansionistas'."

 HEU_iron_ore_mining:0 "Política de fomento de Minette"
 HEU_iron_ore_mining_desc:0 "Aunque en la Tierra el poder del Misticismo se ha debilitado, las estudiantes de Kivotos siguen siendo más fuertes que los humanos. Si facilitamos el empleo de la población de origen Kivotos en la industria minera de la región meridional de Luxemburgo, 'Minette', reduciremos los prejuicios que los locales tienen hacia los kivotosianos y también beneficiaremos a la economía regional."

 HEU_german_school:0 "Escuela de cultura germánica"
 HEU_german_school_desc:0 "Los luxemburgueses se enorgullecen de ser el 'último Estado-nación germánico' que sobrevivió tras el Gran Traslado y temen que sus tradiciones sean dañadas por los inmigrantes de Kivotos. Aunque Aru no sabe mucho ni le interesa eso de ser un supuesto pueblo germánico, sí entiende que, al menos, que personas como ella intenten comprender su cultura traerá armonía entre los locales y la población de origen Kivotos."

 HEU_RTL_kayoko_2:0 "Intercambio cultural en RTL"
 HEU_RTL_kayoko_2_desc:0 "RTL es una emisora de radio en Luxemburgo que transmite en tres idiomas: alemán, inglés y francés. Impulsemos programas en RTL para que kivotosianos y locales puedan compartir y comprender sus culturas. Ah, y también incluyamos un horario de rock, que a Kayoko le gusta."

 HEU_basic_housing:0 "Vivienda básica"
 HEU_basic_housing_desc:0 "El gobierno anterior del partido de derecha también había planeado suministrar viviendas asequibles para los locales, pero el plan de vivienda de Aru quiere ir un paso más allá. Para evitar que los lugares de residencia de la población de origen Kivotos y los locales queden separados, las nuevas viviendas se asignarán por sorteo, fomentando que ambas culturas se mezclen de forma natural en la vida cotidiana."

 HEU_gehenna_german_culture:0 "Cultura híbrida Kivotos-germánica"
 HEU_gehenna_german_culture_desc:0 "Aunque las diferencias culturales entre los locales y la población de origen Kivotos son grandes, hemos encontrado puntos en común y hemos logrado una fusión cultural conjunta. No es perfecta, pero con más tiempo, acabaremos comprendiendo que la elección de Aru no estaba equivocada."

 HEU_fix_benelux_lands:0 "Restauración del terreno de los Países Bajos"
 HEU_fix_benelux_lands_desc:0 "¡Las pesadas instalaciones de D.U. han dejado las tierras bajas completamente blandas y hundidas! Pero el incompetente Consejo Estudiantil General incluso nos echó ese trabajo encima. Tal vez sea tarde, pero ahora nos toca a nosotros. ¡Restaurémoslo cuanto antes!"

 HEU_gehenna_labour_council:0 "Comisión de Contratas de Gehenna"
 HEU_gehenna_labour_council_desc:0 "Aru ha observado continuamente la mirada de desprecio y burla con la que los locales tratan a las estudiantes de Gehenna. Los grupos pro-nazis que blandían una esvástica y le decían a Aru que 'se largara', los católicos que insistían en que una mujer no debía dedicarse a la política... Si dejamos los asuntos de derechos laborales en manos de esos locales, ¿podrá una nueva organización ofrecer bienestar a los kivotosianos trasladados, una minoría étnica? Aru decidió que los problemas laborales de Luxemburgo se tratarán en una 'comisión de contratas' compuesta únicamente por estudiantes de Gehenna."

 HEU_gehenna_people:0 "Política de inmigración kivotosiana"
 HEU_gehenna_people_desc:0 "Una de las razones por las que los locales discriminan a la población de origen Kivotos podría ser precisamente que su número es bajo. Apoyemos activamente la inmigración de estudiantes de Kivotos de diversas academias, no solo de Gehenna. Como Aru tiene un bajo sentido de pertenencia hacia Gehenna, al contrario, podrá acoger mejor a estudiantes de otras academias."

 HEU_gehenna_tourism:0 "Ciudad turística de Luxemburgo"
 HEU_gehenna_tourism_desc:0 "Por el caos posterior al Gran Traslado, los demás países locales han sufrido grandes daños en su cultura tradicional. Pero Luxemburgo solo sufrió 'daños menores', con apenas algunos edificios dañados durante el Gran Traslado, y la cultura local se ha mantenido casi intacta. ¿Y si desarrollamos el turismo dirigido a estudiantes de otras academias?"

 HEU_repression_for_local_capitalists:0 "Represión de los capitalistas locales"
 HEU_repression_for_local_capitalists_desc:0 "Los capitalistas locales sienten hostilidad hacia la población de origen Kivotos que llegó con el Gran Traslado. En lugar de dejarlo todo al sistema de libre mercado, será más apropiado que la Agencia de Detectives 68 y la población de origen Kivotos controlen las empresas."

 HEU_land_reform:0 "Reforma agraria"
 HEU_land_reform_desc:0 "Entre los locales, quienes más discriminan y se muestran hostiles hacia la población de origen Kivotos son los campesinos. Aru es demasiado bondadosa como para aplicar políticas que perjudiquen a los locales, pero comprendió que, por la población de origen Kivotos que vivirá en esta tierra, una política de 'mal necesario' es imprescindible: expropiar parcialmente tierras de los campesinos mediante compensación y redistribuirlas a los kivotosianos."

 HEU_association_of_school_institutes:0 "Federación de academias de Kivotos"
 HEU_association_of_school_institutes_desc:0 "Con la llegada de inmigrantes desde varias escuelas de Kivotos, estudiantes de múltiples academias han terminado mezclándose y viviendo juntas. Aru propuso una especie de 'federación de academias' para las estudiantes llegadas de distintas escuelas. Sería una academia informal donde no se discrimina ni siquiera a quienes provengan de Trinity, además de Gehenna, Millennium y Red Winter."

 HEU_gehenna_labour_council_2:0 "Comisión de Contratas-Consejo Obrero"
 HEU_gehenna_labour_council_2_desc:0 "No se debe entregar a los locales el control de los asuntos de derechos obreros. Esto es algo en lo que tanto Rikuhachima Aru como la población de origen Kivotos están de acuerdo. Pero bajo la premisa de que el control lo mantenemos nosotros, será posible permitir que el Partido Comunista de Luxemburgo obtenga, de manera limitada, derecho de voz."

 HEU_RTL_kayoko:0 "RTL Rock de Kivotos"
 HEU_RTL_kayoko_desc:0 "¿De verdad los kivotosianos tienen que 'adaptarse' a la cultura local? ¿No es lo correcto que los locales acepten la cultura de Kivotos? RTL es una emisora de radio en Luxemburgo que transmite en tres idiomas: alemán, inglés y francés. Tras convertir RTL en propiedad de la Agencia de Detectives, Kayoko propuso emitir programas de rock de Kivotos desde Deutschland hasta las islas británicas."

 HEU_school_of_culture:0 "Centro de Educación Cultural de la Comisión de Contratas"
 HEU_school_of_culture_desc:0 "Los trabajadores locales que laboran junto a los kivotosianos deben familiarizarse con las culturas de Kivotos y de la Tierra. Todos los trabajadores locales deberán asistir obligatoriamente a cursos en el 'Centro de Educación Cultural', donde recibirán clases sobre una sociedad en la que las mujeres ocupan un papel importante, y si no comprenden a fondo la cultura de Kivotos, no podrán ser contratados en ningún lugar de trabajo."

 HEU_gehenna_labour_council_3:0 "Proyecto de tejido de Misticismo"
 HEU_gehenna_labour_council_3_desc:0 "La Agencia de Detectives puede ser una forajida hardboiled, pero no es tan cruel como para despreciar a los demás trasladados del continente de Kivotos. Los inmigrantes de Kivotos han perdido gran parte de su poder de Misticismo, y para que no sean discriminadas por los locales, se necesitan más telares de Misticismo. Aru puede fingir ser despiadada, pero no es una líder capaz de abandonar a quienes sufren."

 HEU_school_of_atheism:0 "El catolicismo debe morir"
 HEU_school_of_atheism_desc:0 "No basta con destruir las iglesias católicas. La fe católica y su doctrina exigen, de forma fundamental, que las mujeres (marcadas por el pecado original que hizo caer a Adán) obedezcan a los hombres. Eso también significa que la sociedad de Kivotos, centrada en mujeres, debería someterse a los europeos locales, centrados en hombres. No. Aru no lo permitirá. Todos los católicos deberán asistir a clases en una escuela especial destinada a 'normalizarlos' hacia el ateísmo. Como debe ser."

 HEU_civil_partnership:0 "Unión civil"
 HEU_civil_partnership_desc:0 "Los kivotosianos son menos numerosos que los locales, y algunas estudiantes temen que, generación tras generación, a medida que se formen matrimonios, la cultura kivotosiana quede eclipsada por la cultura local y termine desapareciendo. Debemos separar a los kivotosianos y a los locales. El nuevo sistema de 'unión civil' permitirá que, incluso entre estudiantes kivotosianas del mismo sexo, si conviven juntas, reciban los mismos beneficios legales que los matrimonios heterosexuales."

 HEU_UNESCO: "Comisión Internacional de Cooperación Intelectual de la Sociedad de Naciones"
 HEU_UNESCO_desc: "La represión de la cultura local y las acciones de apoyo a la cultura de Kivotos han provocado que el gobierno de [ROOT.GetNameDef] despierte un resentimiento demasiado grande entre los locales. El bando de [ROOT.GetLeader] busca ampliar la Comisión Internacional de Cooperación Intelectual (IICI) para lograr que las culturas de Kivotos y Luxemburgo se armonicen entre sí. Esto tiene como objetivo que los países miembros de la Sociedad de Naciones intercambien y preserven la cultura y la tecnología de Kivotos y de la humanidad."

# }} 산업 중점의 끝
# {{ 군대 중점
 HEU_schuster_line:0 "Construcción de la Línea Schuster"
 HEU_schuster_line_desc:0 "Luxemburgo ya fue invadido por Gehenna durante el Gran Traslado, y se ha formado un consenso de que deben existir preparativos básicos para defender Luxemburgo. Josef Schuster, un ingeniero luxemburgués, presentó un plan de una mini Línea Maginot llamada 'Línea Schuster', que lleva su nombre. Es un proyecto para construir pequeños fuertes mezclando concreto y madera con el fin de defender Luxemburgo. No será tan sólida como la Maginot, pero al menos nos dará tiempo para preparar la defensa cuando estemos en estado de guerra."

 HEU_prussian_strategy:0 "Gran estrategia prusiana"
 HEU_prussian_strategy_desc:0 "Tras el Gran Traslado, Luxemburgo lo ha perdido todo: Bélgica, su aliada de sangre, y también todos sus países vecinos. Aru es hábil en la guerrilla con fuerzas reducidas, pero nunca ha comandado un gran ejército. Por suerte, la casa imperial alemana que huyó durante el Gran Traslado podrá ayudar en la reforma del sistema militar luxemburgués."

 HEU_prussian_strategy_2:0 "Restablecimiento de la milicia voluntaria"
 HEU_prussian_strategy_2_desc:0 "La milicia voluntaria de Luxemburgo era un grupo armado local que existía hasta antes del Gran Traslado. Como no era un ejército de élite debidamente entrenado, durante la invasión del Gran Traslado todos huyeron, pero el mismo error no se repetirá."

 HEU_prussian_strategy_3:0 "Sistematización de los planes operativos"
 HEU_prussian_strategy_3_desc:0 "El Estado Mayor de origen alemán cree que las operaciones militares sistemáticas basadas en planes operativos muy bien estructurados son el atajo hacia la victoria. Aunque los oficiales locales de Luxemburgo se burlan diciendo: '¿Y eso también funcionó tan bien en la guerra de 1914?'"

 HEU_prussian_strategy_4:0 "Estrategia de infantería motorizada"
 HEU_prussian_strategy_4_desc:0 "El Estado Mayor da discursos sobre la importancia de motorizar a los soldados y desplegar una guerra de maniobra más rápida. Los oficiales locales de Luxemburgo sostienen que 'no tenemos combustible para eso', pero el Estado Mayor alemán se muestra optimista: creen que, importando combustible, será posible motorizar a todo el ejército."

 HEU_prussian_strategy_5:0 "Tropas de asalto"
 HEU_prussian_strategy_5_desc:0 "Las tropas de asalto prusianas de la Primera Guerra Mundial, llamadas Stormtroopers en alemán, eran una poderosa unidad de infantería que aprovechaba la velocidad para golpear a las fuerzas enemigas."

 HEU_benriya_strategy:0 "Lecciones del Equipo Prefecto"
 HEU_benriya_strategy_desc:0 "El presidente Rikuhachima Aru no ha comandado a grandes contingentes como Hina del Equipo Prefecto, pero al enfrentarse a ellas pudo entrever su estrategia. Su forma de aplastar al enemigo con una potencia de fuego abrumadora, centrada en la líder del Equipo Prefecto, Hina, tiene un valor que puede aplicarse incluso en este mundo donde el Misticismo se ha debilitado. ...¡Claro que esto no significa reconocer al Equipo Prefecto! Solo es aprender un poquito, nada más."

 HEU_benriya_strategy_2:0 "¡La fórmula: 1 regimiento, 1 Haruka!"
 HEU_benriya_strategy_2_desc:0 "¡No significa que vayamos a repartir una Haruka auténtica a cada regimiento! Ni siquiera la presidenta Aru, diosa de la gestión, puede criar Harukas como si cultivara plantas en el jardín. (Bueno, no es que no lo haya intentado... mmm, sí, claro que no iba a funcionar.) La presidenta Aru espera que, al igual que Haruka se encargaba de la potencia de fuego de la unidad, la artillería desempeñe para los soldados locales un rol de apoyo de fuego comparable al de Haruka."

 HEU_benriya_strategy_3:0 "Ataque Hanetsuki estilo noir"
 HEU_benriya_strategy_3_desc:0 "El estilo de combate de la Agencia de Detectives, que con fuerzas reducidas se mueve obstinadamente entre varios puntos y ejecuta guerra de guerrillas, podría aplicarse en esta era a la forma de operar fuerzas especiales. Al fin y al cabo, la propia Agencia de Detectives 68 no dejaba de ser, en la práctica, una fuerza especial de pocos efectivos."

 HEU_benriya_strategy_4:0 "¡El perfecto arte mercenario de la jefa!"
 HEU_benriya_strategy_4_desc:0 "Parece que la guerra con mercenarios en este mundo solo se practicó hasta la Italia renacentista, pero la presidenta Aru cree que contratar mercenarios no es necesariamente algo malo. Para empezar, no es que tengamos tanta mano de obra, y mientras se les pague, los contratistas trabajan bastante fielmente. ...¡Oye, esperen! ¡Ustedes! ¿Cómo que se van a ir a casa porque terminó su horario en medio del combate?"

 HEU_benriya_strategy_5:0 "Serenata abrasadora"
 HEU_benriya_strategy_5_desc:0 "Con el Misticismo debilitado, la importancia del apoyo de fuego en el campo de batalla ha crecido aún más. Ya quedó atrás la era en la que incluso recibir un impacto de un cañón antiaéreo de 88 mm terminaba con solo descansar un rato en la enfermería. Aru entiende bien la importancia de una potencia de fuego fuerte y quiere escuchar el consejo de Mutsuki sobre cuántas fuerzas de apoyo serán necesarias para sustituir con armas locales el Misticismo agotado."

 HEU_defence_industry:0 "Industria de defensa de Luxemburgo"
 HEU_defence_industry_desc:0 "La mayor ventaja de Luxemburgo es que dentro de su territorio hay muchos yacimientos de mineral de hierro. Desde armas de fuego en adelante, podremos fabricar con recursos autosuficientes las armas necesarias para protegernos por nosotros mismos."

 HEU_benriya_saori:0 "Rastros de Arius"
 HEU_benriya_saori_desc:0 "Tras el colapso de la rama de Arius, Jomae Saori ha estado vagando por varias regiones de Europa. Ella tiene una impresión positiva de la Agencia de Detectives 68, y parece poco probable que rechace nuestra propuesta de reclutamiento."

 HEU_benriya_bicycle:0 "Guerra de maniobra para pobres"
 HEU_benriya_bicycle_desc:0 "¡Impacto, lanzamiento de Riding Aru: ¡edición a escala! ...Bueno, eso es mentira, pero operar unidades ciclistas en el ejército será de gran ayuda. Ante todo es barato y puede aumentar fácilmente la movilidad de nuestro ejército. Además, como es una unidad ampliamente utilizada incluso en el país vecino, los Países Bajos, también es un concepto familiar en Luxemburgo."

 HEU_benriya_tanks:0 "Tecnología de tanques francesa"
 HEU_benriya_tanks_desc:0 "Ni antes ni después del Gran Traslado hubo un solo tanque en Luxemburgo, pero los soldados luxemburgueses pudieron recuperar y estudiar tanques franceses semidestruidos, abandonados cerca de la frontera tras los combates del Gran Traslado. Aru, que recuerda que en Kivotos los tanques no eran una arma tan impresionante, cuestiona la necesidad de investigarlos, pero en este mundo con el Misticismo agotado, los tanques sin duda pueden ser de gran ayuda. ...Ah, claro, otra cosa distinta es si tenemos la capacidad de fabricarlos."

 HEU_emergency_industry:0 "Industria de emergencia"
 HEU_emergency_industry_desc:0 "La Agencia de Detectives 68 y Luxemburgo atraviesan un periodo muy difícil, rodeados por países enemigos. Una mayor parte del presupuesto nacional debe utilizarse para prepararnos ante una situación de guerra."

 HEU_hardboiled_warfare:0 "¡Teoría del espíritu hardboiled!"
 HEU_hardboiled_warfare_desc:0 "La presidenta Aru es inexperta en el ámbito de elaborar grandes estrategias, pero demuestra una habilidad sobresaliente al dirigir escaramuzas de pequeña escala. Su manual táctico escrito personalmente para los nuevos soldados, 'Teoría del espíritu hardboiled', es un completo desastre en la parte que presenta la gran estrategia, y las ilustraciones que Mutsuki dibujó son incluso ridículas, pero aun así se valora que, al menos en los combates a nivel de escuadra en el frente, resulta de gran ayuda."

 HEU_hardboiled_way:0 "El camino del forajido"
 HEU_hardboiled_way_desc:0 "El camino del forajido se ve genial, pero en realidad no tiene nada de genial. Como cuando, al pagar los gastos de la oficina, se acaba el dinero y terminas durmiendo en un parque... Incluso después de escapar de la falta de fondos tras tomar el control de Luxemburgo, Aru sabe bien que, para el camino del forajido, lo más importante es una comida y un lugar cómodo donde dormir. Si hace que incluso sus nuevos subordinados pasen por el mismo dolor que ella y los miembros de la Agencia de Detectives 68 vivieron, eso sería una conducta indigna como jefa."

 HEU_hardboiled_charisma:0 "La dignidad de la jefa"
 HEU_hardboiled_charisma_desc:0 "¿Por qué los soldados de Luxemburgo y de la Agencia de Detectives 68 no huyen del campo de batalla? Para quienes llegaron con el Gran Traslado, no existe el 'patriotismo' hacia Luxemburgo. Y tampoco hay un destacamento de ejecución que dispare a los desertores (¡la presidenta Aru jamás lo permitiría!). La razón por la que nuestro ejército puede mantenerse es el apoyo hacia la persona de 'Rikuhachima Aru' y, más allá de eso, el compartir el ideal que ella quiere proteger."

 HEU_benriya_rikuhachimaism:0 "Disparo hardboiled"
 HEU_benriya_rikuhachimaism_desc:0 "La reforma idealista de Rikuhachima Aru, que busca crear un Estado unido para todos los kivotosianos y construir una sociedad igualitaria, da fuerzas especialmente a los soldados que portan halo."

 HEU_benriya_luxembourgism:0 "Un corazón para todos"
 HEU_benriya_luxembourgism_desc:0 "Así como la presidenta Aru tendió la mano a Haruka cuando era acosada, Aru quiere tender la mano a todos los kivotosianos y humanos que sufren en este mundo. Es un camino idealista, con posibilidades demasiado bajas de lograrse, y precisamente por eso el ejército de Aru también la apoya."

 HEU_long_range_patrols:0 "Patrullas de largo alcance de Luxemburgo"
 HEU_long_range_patrols_desc:0 "¿Hay algo más importante que realizar patrullas constantes para estar preparados ante ataques sorpresa del enemigo?"

 HEU_navy_focus_1:0 "Armada de Luxemburgo"
 HEU_navy_focus_1_desc:0 "A medida que obtenemos regiones costeras, podremos poner en marcha un plan para formar una fuerza naval."

 HEU_navy_focus_2:0 "Plan Wilhelm"
 HEU_navy_focus_2_desc:0 "Wilhelm II, el último káiser del Imperio alemán, Wilhelm von Preußen, disfrutaba diseñando y trazando por sí mismo diversos tipos de buques de guerra y, tras abdicar y exiliarse en Luxemburgo, dejó todavía más planes (fantasiosos) para la construcción de acorazados. Sus documentos en papel serán enviados ahora a nuestra naciente armada real para su revisión."

 HEU_navy_focus_3:0 "Plan de Policía Marítima de Valkyrie"
 HEU_navy_focus_3_desc:0 "Invitemos a ingenieras de la antigua Policía Marítima de la Academia de Policía Valkyrie para obtener información sobre cómo diseñaban una flota de patrulla marítima para Valkyrie. Puede que no podamos crear una gran flota imponente, pero al menos sí podremos construir buques para una marina costera."

 HEU_navy_focus_4:0 "Invitar a ex instructoras de policía marítima"
 HEU_navy_focus_4_desc:0 "No hay posibilidad de encontrar dentro de Luxemburgo a alguien competente en guerra naval. Traer talento capaz de entre las policías marítimas retiradas de la Academia de Policía Valkyrie será, en la práctica, la única alternativa."

 HEU_air_force_focus_1:0 "Aviación del ejército de Luxemburgo"
 HEU_air_force_focus_1_desc:0 "Un hecho claramente desfavorable para nosotros es que la presidenta Rikuhachima Aru no tiene conocimientos de aviación, y que, hasta antes del 'Gran Traslado', Luxemburgo tampoco tenía fuerza aérea. Sin embargo, supimos que, en el caos del Gran Traslado, algunos pilotos belgas con experiencia en pilotar aviones ligeros se exiliaron en Luxemburgo. Tras confirmar si esos aviadores belgas están dispuestos a servir en el ejército de Luxemburgo, comenzaremos la creación de una fuerza aérea estableciendo una pequeña aviación del ejército."

 HEU_air_defense:0 "Batería antiaérea de Luxemburgo"
 HEU_air_defense_desc:0 "Josef Schuster, el ingeniero jefe encargado de construir la línea defensiva nacional de Luxemburgo, propuso añadir algunas instalaciones antiaéreas a su 'Línea Schuster'. No podremos responder a bombardeos aéreos a gran escala, pero sí podremos detener lo suficiente los ataques pequeños realizados a baja altitud."

 HEU_air_force_focus_2:0 "Academia de aviación Luxemburgo-Bélgica"
 HEU_air_force_focus_2_desc:0 "Los pequeños pilotos compuestos por exiliados de origen belga llevarán a cabo el entrenamiento de vuelo enfocándose en la élite de los pilotos, para que cada uno de ellos pueda convertirse en un as de la aviación."

 HEU_air_force_focus_3:0 "Academia de aviación de Gehenna"
 HEU_air_force_focus_3_desc:0 "Gracias a la alianza con Gehenna, podremos recibir el apoyo de estudiantes de clubes de Gehenna que tienen experiencia pilotando aviones ligeros, aeronaves o similares."

 HEU_establish_aircraft_industry:0 "Instalaciones de la industria aeronáutica"
 HEU_establish_aircraft_industry_desc:0 "Para formar una fuerza aérea, es necesario construir nuevas instalaciones industriales. Por suerte, Luxemburgo cuenta con mucho acero, así que estaremos listos para fabricar el armazón metálico de los cazas. Claro, con solo hierro no se puede hacer volar un avión."

 HEU_air_force_focus_4:0 "Aria de explosión ardiente"
 HEU_air_force_focus_4_desc:0 "Que no haya nadie con conocimientos de fuerza aérea es algo común a todos los miembros de la Agencia de Detectives 68, pero tras adquirir nociones sobre aviación, Asagi Mutsuki muestra un interés especial por el concepto de los bombarderos. ¿Será que le gusta el acto en sí de soltar grandes explosivos desde el cielo? Quién sabe."

 HEU_air_force_focus_5:0 "Coro del diablillo"
 HEU_air_force_focus_5_desc:0 "Quizá la razón por la que Mutsuki se interesa tanto por la fuerza aérea sea que siente que hay 'puntos en común' entre su estilo de combate y el de la aviación. Sea cual sea el motivo, la única que apoya fortalecer el poder aéreo dentro de la Agencia de Detectives 68 es Mutsuki, y la aviación del ejército de Luxemburgo le debe, en mayor o menor medida, una deuda. Habrá que pagar esa deuda mediante el desarrollo de nuevas tecnologías."

 HEU_air_force_focus_6:0 "Una forma de divertirse aún más"
 HEU_air_force_focus_6_desc:0 "Es cierto que en Luxemburgo no existe una tecnología llamada 'ingeniería de cohetes', pero en este mundo donde el 'Misticismo' se ha agotado, la Agencia de Detectives 68 desea volver a desplegar la poderosa potencia de fuego que mostraba en Kivotos. En particular, lo que Mutsuki pide a las ingenieras es un nuevo armamento que explote lejos y de forma espectacular. ¿De verdad existe una tecnología capaz de satisfacer a Mutsuki?"

 HEU_city_warfare:0 "Hospital de campaña Rikuhachima"
 HEU_city_warfare_desc:0 "El edificio de la 'Clínica de Obstetricia y Ginecología de la Gran Duquesa Charlotte', que el gobierno de Luxemburgo estaba construyendo para inaugurar en 1936, quedó completamente destruido por un ataque con cañón antitanque de las estudiantes de Gehenna durante el Gran Traslado, pero el personal que trabajaría en la clínica ya había sido reclutado. ¿Qué tal si proponemos reasignar a ese personal de enfermería para que trabaje en el hospital de campaña de Luxemburgo?"

# }} 군대 중점의 끝
# {{ 흥신소 68 중점
 HEU_luxembourg_benriya_68:0 "¡Reanudación de actividades de la Agencia de Detectives 68!"
 HEU_luxembourg_benriya_68_desc:0 "Durante la tragedia de Luxemburgo ocurrida el día del Gran Traslado, la oficina de la Agencia de Detectives 68 sufrió daños graves. Sin embargo, al trasladar la oficina a otro lugar, las actividades comerciales de la Agencia de Detectives 68 se han reanudado. Si hay algo distinto a antes, es que el Palacio Gran Ducal de Luxemburgo se ha convertido en nuestra nueva oficina. Ya es hora de promocionar ante todos el hecho de que la Agencia de Detectives 68 ahora no solo se encarga de la 'gestión del Estado', sino también de la 'gestión de negocios'."

 HEU_benriya_construction:0 "Departamento de Construcción de la Agencia de Detectives"
 HEU_benriya_construction_desc:0 "Entre las estudiantes de Gehenna que decidieron cooperar con la Agencia de Detectives 68, algunas prometieron volcar sus esfuerzos en los campos de la construcción y la arquitectura. No solo en Luxemburgo: aunque reciban solicitudes de otras academias o países, cumplirán los encargos hasta el final."

 HEU_benriya_local:0 "Apoyo civil para los locales"
 HEU_benriya_local_desc:0 "Para aumentar el apoyo y la lealtad de los locales hacia Rikuhachima Aru, las estudiantes de Gehenna que acordaron cooperar con la Agencia de Detectives se han puesto a brindar apoyo civil: reparando carreteras en la ciudad de Luxemburgo y reconstruyendo edificios destruidos durante el Gran Traslado. Considerando que a las estudiantes de Gehenna les gusta más 'hacer estallar' las cosas que 'arreglarlas', esto puede considerarse un 'milagro' posible gracias a la extraordinaria calidad humana de la presidenta Aru."

 HEU_benriya_warfare:0 "Departamento de Defensa de la Agencia de Detectives"
 HEU_benriya_warfare_desc:0 "Por el ideal de Rikuhachima Aru, que prometió la igualdad tanto de kivotosianos como de locales, se ha creado el Departamento de Defensa de la Agencia de Detectives. Formará parte del ejército regular de Luxemburgo y luchará junto a él para proteger el sueño de Aru."

 HEU_benriya_level_up_a:0 "Ampliación de la biblioteca de libros antiguos de la Agencia de Detectives"
 HEU_benriya_level_up_a_desc:0 "Usando los numerosos libros reunidos de varios países de Europa, ampliaremos una biblioteca de libros antiguos en el Palacio Gran Ducal de Luxemburgo, que actualmente sirve como oficina de la Agencia de Detectives. En esa biblioteca, Rikuhachima Aru podrá profundizar su propia sabiduría y, meditando allí, investigar la forma de mostrarse más amable con sus compañeras."

 HEU_benriya_level_up_b:0 "Ampliación de la sala de entrenamiento de la Agencia de Detectives"
 HEU_benriya_level_up_b_desc:0 "El plan de excavar el subsuelo del Palacio Gran Ducal de Luxemburgo para construir allí un campo de tiro y una sala de entrenamiento de esgrima enfurecerá a los tradicionalistas luxemburgueses, pero la verdad es que ellos están enojados todos los días solo por el hecho de que hay una pelirroja con cuernos en Luxemburgo, haga o no haga nada Aru, ¿no? El entrenamiento de tiro y de esgrima en la sala subterránea será un buen lugar para elevar la determinación y el carisma de Rikuhachima Aru."

 HEU_benriya_level_up_last:0 "Una Agencia de Detectives abierta para todos"
 HEU_benriya_level_up_last_desc:0 "Rikuhachima Aru no es una líder altiva y apartada del pueblo como las dirigentes del Tea Party o del Pandemonium. Para los kivotosianos o estudiantes comunes que desean conocerla en persona y transmitirle su opinión, cada lunes se reservará un tiempo en el que los ciudadanos puedan entrar al Palacio Gran Ducal y reunirse con Aru. Escuchar las historias de la gente también es una forma de 'encargo', ¿no?"

 HEU_benriya_international:0 "Departamento de expansión internacional de la Agencia de Detectives"
 HEU_benriya_international_desc:0 "Algunas integrantes de la Agencia de Detectives desean iniciar negocios también en países vecinos cercanos."

 HEU_benriya_inner_circle:0 "Por siempre, la Agencia de Detectives"
 HEU_benriya_inner_circle_desc:0 "A medida que ha disminuido la cantidad de residentes, el Palacio Gran Ducal de Luxemburgo ha quedado con muchas habitaciones vacías. ¿No sería una buena idea preparar habitaciones privadas para Mutsuki, Kayoko y Haruka?"

 HEU_unified_gehenna:0 "Rikuhachima por encima de Gehenna"
 HEU_unified_gehenna_desc:0 "La verdad es que Aru no conoce bien Gehenna. ¿Aquí nadie usa justificantes y se ausentan sin permiso? ¿Y qué es eso del Pandemonium Society? ¿Elecciones de presidenta del consejo estudiantil? ¿Eso existía? ¿Había tantos clubes? Mientras a la Agencia de Detectives la tratan como si fuera una organización criminal, a esos 'terroristas de las aguas termales' los dejan rondar Gehenna tranquilamente como si fueran un simple club. Pero no podemos quedarnos en el caos para siempre. Ya es hora de poner en orden a Gehenna."

 HEU_the_end_of_perfect_team:0 "Control de la cúpula del Equipo Prefecto"
 HEU_the_end_of_perfect_team_desc:0 "El Equipo Prefecto, que intentó arrestar al grupo de Rikuhachima Aru, también ha llegado a su fin. Algunas prefectas, al presentir su destino desafortunado, intentan huir, pero será inútil. La dirección central del Equipo Prefecto ya decidió permanecer en la nueva Gehenna y someterse al control del nuevo gobierno de la academia."

 HEU_luxembourg_military_police:0 "Integración en la policía de Luxemburgo"
 HEU_luxembourg_military_police_desc:0 "¿De verdad Gehenna necesita desde el principio una organización paramilitar armada? El Equipo Prefecto será disuelto por completo, y la policía de Luxemburgo asumirá ese papel. Todas las prefectas tendrán que buscarse un nuevo trabajo. Después de perseguir a la Agencia de Detectives 68 tratándola como criminal, ahora pagarán el precio."

 HEU_gehenna_military_police:0 "Departamento de Justicia de Gehenna"
 HEU_gehenna_military_police_desc:0 "Es natural abolir al Equipo Prefecto, que ha estado obstaculizando a la Agencia de Detectives. Pero entonces, ¿quién administrará el orden público de Gehenna? Dicen que en la academia vecina, Trinity, existe una organización llamada el Departamento de Justicia. Entonces creemos también el 'Departamento de Justicia de Gehenna' y traslademos allí a las prefectas. ¿Que les va a disgustar porque el nombre es el de una organización de Trinity? Sí. Se eligió ese nombre para que les disguste. Así que, desde el principio, no debieron poner a la presidenta Aru en la lista de buscados."

 HEU_gehenna_perfect_team_trial:0 "Sanción a la antigua cúpula del Equipo Prefecto"
 HEU_gehenna_perfect_team_trial_desc:0 "Uso excesivo de la fuerza pública contra la Agencia de Detectives 68, empleo indiscriminado de armas de fuego contra Rikuhachima Aru... La antigua cúpula, como Hina y Ako, deberá pasar por el debido proceso disciplinario. Gracias a la 'hardboiled' indulgencia de la presidenta Aru, es muy probable que el castigo hacia ellas termine de forma meramente formal, aunque también podría salir otro resultado."

 HEU_maintenance_of_security:0 "Mantenimiento del orden"
 HEU_maintenance_of_security_desc:0 "Tras la reorganización del Equipo Prefecto, han surgido diversos disturbios y alborotos en Gehenna. Se debe a la ilusión de que ya no existe una institución de seguridad adecuada en Gehenna. Claro, aunque el Equipo Prefecto haya sido disuelto, el orden público de Gehenna no se derrumbará. Un nuevo organismo lo garantizará con aún más firmeza que el antiguo Equipo Prefecto."

 HEU_civilian_control:0 "Institución de seguridad bajo control"
 HEU_civilian_control_desc:0 "Debemos aprender de cómo el antiguo Equipo Prefecto actuó como un caudillo, con un poder separado del Pandemonium Society. El nuevo organismo de seguridad de Gehenna debe estar estrictamente bajo control civil, con una autonomía extremadamente limitada. ¡Y, en especial, jamás debe volver a apuntar sus armas contra la Agencia de Detectives!"

 HEU_states_quo_club:0 "Mantener el statu quo del sistema de clubes"
 HEU_states_quo_club_desc:0 "Algunos dicen que Gehenna está fragmentada socialmente por la proliferación de clubes. Es decir, que prohibir muchos clubes o, al menos, fusionar los de objetivos similares reduciría el caos. Pero, al final, ¿acaso la Agencia de Detectives 68 no fue también uno de esos clubes que 'proliferaban'? Seguir tales afirmaciones radicales no sería más que una autonegación de la propia Agencia de Detectives."

 HEU_emergency_medicine_department_support:0 "Patrocinio del Departamento de Medicina de Emergencias"
 HEU_emergency_medicine_department_support_desc:0 "Si lo pensamos bien, a veces el Departamento de Medicina de Emergencias de Gehenna llega a parecer incluso más 'hardboiled' que la presidenta Aru. En especial por cómo cargan a los heridos como si fueran cadáveres, levantándolos sin miramientos. El Departamento de Medicina de Emergencias podrá cumplir su función también en la nueva Gehenna."

 HEU_emergency_medicine_department_support_2:0 "Restricción de armamento del Departamento de Medicina de Emergencias"
 HEU_emergency_medicine_department_support_2_desc:0 "Independientemente de invertir dinero en el Departamento de Medicina de Emergencias y permitirle operar más instalaciones médicas, a partir de ahora su nivel de armamento se limitará al mínimo. Es absurdo eso de que, si no hay pacientes en el lugar, les disparan para crear pacientes. ¿Que al menos eso es hardboiled? Parece que esto es parece un hardboiled un poco distinto al que imagina la presidenta Aru."

 HEU_gastronomy_research_group_removed:0 "Disolución del Club de Investigación Gastronómica"
 HEU_gastronomy_research_group_removed_desc:0 "Rikuhachima Aru prometió 'mantener el statu quo del sistema de clubes de Gehenna'. Pero el Club de Investigación Gastronómica... eso no es un club: son simplemente terroristas. Bajo el mínimo estándar moral de Rikuhachima Aru, son un mal que jamás puede tolerarse."

 HEU_sparkle_club:0 "Intercambio con el Club Brilli-Brilli"
 HEU_sparkle_club_desc:0 "Aru no sabe nada sobre la situación interna de Gehenna. Por eso, el Club Brilli-Brilli—que Aru supone que es un grupo de estudiantes 'comunes' de Gehenna—también es un socio de cooperación en el que Aru puede confiar. No sería mala idea reunirse con ellas y escuchar información interna sobre Gehenna."

 HEU_hot_springs_department_benriya:0 "Departamento de Desarrollo de Aguas Termales de la Agencia de Detectives"
 HEU_hot_springs_department_benriya_desc:0 "El Departamento de Desarrollo de Aguas Termales es una organización demasiado peligrosa como para dejarla seguir operando libremente en Gehenna. La mejor opción es incorporarlas a la Agencia de Detectives y, bajo el pretexto de 'desarrollo de aguas termales en el extranjero', enviarlas fuera del país."

 HEU_hot_springs_department_gehenna:0 "Compromiso con el Departamento de Aguas Termales"
 HEU_hot_springs_department_gehenna_desc:0 "Son demasiadas para reprimirlas. Garanticemos sus actividades, pero como compromiso, actuemos para someterlas después de que ocurra un incidente."

 HEU_hot_springs_department_work:0 "Proyecto de desarrollo de aguas termales"
 HEU_hot_springs_department_work_desc:0 "En sí, el Departamento de Desarrollo de Aguas Termales suele estorbar más de lo que ayuda a Gehenna. Pero tampoco puede decirse que los beneficios de sus proyectos sean completamente inexistentes."

 HEU_weak_pandemonium_society:0 "Reducción del poder del Pandemonium Society"
 HEU_weak_pandemonium_society_desc:0 "Algunas estudiantes especulan que Rikuhachima Aru se convertirá en la nueva presidenta del consejo estudiantil. Pero eso no ocurrirá. Aru no tiene un gran sentido de pertenencia hacia Gehenna y, además, valora mucho más su puesto como presidenta de la Agencia de Detectives que el de presidenta del consejo estudiantil de Gehenna. El Pandemonium Society se mantendrá. Aunque, a partir de ahora, todos sus proyectos solo serán aprobados si llevan el sello de autorización de Aru."

 HEU_pandemonium_leader_makoto:0 "Presidenta del consejo estudiantil: Makoto"
 HEU_pandemonium_leader_makoto_desc:0 "El cargo de presidenta del consejo estudiantil de Gehenna dejará el sistema de elección directa y pasará a un sistema de designación por Aru. Hanuma Makoto es la opción más razonable: demasiado tonta para organizar una rebelión, y con tal de que le den el puesto, obedecerá cualquier instrucción de Aru."

 HEU_pandemonium_leader_satsuki:0 "Presidenta del consejo estudiantil: Satsuki"
 HEU_pandemonium_leader_satsuki_desc:0 "El cargo de presidenta del consejo estudiantil de Gehenna dejará el sistema de elección directa y pasará a un sistema de designación por Aru. Kyogoku Satsuki, ex jefa del Departamento de Inteligencia del Pandemonium Society, solicita ser nombrada como nueva presidenta, afirmando que puede usar sus habilidades de hipnosis para hacer que las estudiantes de Gehenna adoren a Aru. Como jefa de inteligencia, conoce bien los puntos débiles del personal interno de Gehenna, así que no sería una mala elección como presidenta títere."

 HEU_pandemonium_leader_victoria_louise:0 "Presidenta del consejo estudiantil: Victoria von Preußen"
 HEU_pandemonium_leader_victoria_louise_desc:0 "El cargo de presidenta del consejo estudiantil de Gehenna dejará el sistema de elección directa y pasará a un sistema de designación por Aru. Tras el exilio de la casa imperial Hohenzollern a Luxemburgo, la familia Hohenzollern ha seguido exigiendo autoridad sobre el territorio alemán como su 'derecho evidente'. No podemos devolver un trono imperial alemán que ya desapareció, pero sí podemos darle la presidencia del consejo estudiantil de Gehenna."

 HEU_personnel_retraining:0 "Programa de reeducación"
 HEU_personnel_retraining_desc:0 "Todos los miembros del Pandemonium Society deberán reconocer que el verdadero gobernante de Gehenna ha cambiado. Por supuesto, el Pandemonium Society seguirá existiendo, pero no podrá exigir un poder que vaya más allá de administrar a las estudiantes de Gehenna."

 HEU_pandemonium_intelligence_network:0 "Absorción de la red de espionaje del Pandemonium Society"
 HEU_pandemonium_intelligence_network_desc:0 "Desde hace tiempo, el Pandemonium Society, debido a su rivalidad con el Equipo Prefecto, contaba con una extensa red de espionaje para sacar información del interior del Equipo Prefecto. Ese personal será de gran ayuda para la Agencia de Detectives 68 en adelante."

 HEU_pandemonium_aru:0 "Un Pandemonium Society para nosotras"
 HEU_pandemonium_aru_desc:0 "Es bien sabido que, dentro del Pandemonium Society, durante mucho tiempo se han elaborado folletos promocionales para Tanga Ibuki. Si pueden hacer propaganda para Ibuki, ¿por qué no podrían hacer propaganda para nosotras? El Pandemonium Society desempeñará ahora el papel de una institución propagandística destinada a producir propaganda para la propia Aru."

 HEU_pandemonium_everyone:0 "Un Pandemonium Society para Gehenna"
 HEU_pandemonium_everyone_desc:0 "El poder real del Pandemonium Society se ha reducido, pero precisamente por eso, ahora ya no malgastará presupuesto en ceremonias vacías e innecesarias, y destinará todo su presupuesto limitado a la asistencia social para las estudiantes de Gehenna."

 HEU_legitimate_dominion:0 "Autoridad legítima de dominio"
 HEU_legitimate_dominion_desc:0 "Quien gobierna Gehenna es el Pandemonium Society. Y quien gobierna el Pandemonium Society es Rikuhachima Aru. Hemos asegurado, en términos prácticos, una autoridad legítima de dominio sobre Gehenna."

 HEU_hidden_hina_focus_1:0 "La lealtad de Hina"
 HEU_hidden_hina_focus_1_desc:0 "Tras la disolución del Equipo Prefecto y la incorporación de Hina a la Agencia de Detectives, la fuerza de la Agencia ha aumentado enormemente. Hina desea aparecer en emisiones de propaganda y, en persona, persuadir a las estudiantes de que la 'nueva' Gehenna será una academia mejor que antes."

 HEU_hidden_hina_focus_2:0 "Agencia de inteligencia bajo el liderazgo de Hina"
 HEU_hidden_hina_focus_2_desc:0 "Antes de convertirse en la líder del Equipo Prefecto, Hina era una agente del 'Departamento de Inteligencia' del Equipo Prefecto. En Luxemburgo, los organismos de inteligencia están tensos por la competencia entre el Partido Comunista y el ejército, pero ella pretende usar su trayectoria como agente para barrer la influencia de las facciones políticas dentro de la inteligencia y reorganizarla como un aparato al servicio de Aru."

 HEU_hidden_hina_focus_3:0 "Persuadir a los remanentes del Equipo Prefecto"
 HEU_hidden_hina_focus_3_desc:0 "Incluso después de la disolución del Equipo Prefecto, algunas ex prefectas siguen ocupando parques de Gehenna y manteniendo la resistencia, pero Hina dijo que ayudará a persuadirlas y disolverlas con palabras, no con la fuerza."

 HEU_hidden_hina_focus_4:0 "Apoyo de entrenamiento de Hina para la Agencia de Detectives"
 HEU_hidden_hina_focus_4_desc:0 "Mutsuki, cuya relación con las demás se ha enfriado tras el golpe, y Aru, que ya ni siquiera puede apuntar y usar un arma correctamente, se negaron; aun así, Hina prometió enseñar directamente a la Agencia de Detectives 68 su experiencia personal de combate en el Equipo Prefecto y ayudar a entrenarlas."

 HEU_hidden_hina_focus_5:0 "Como integrante de la Agencia de Detectives"
 HEU_hidden_hina_focus_5_desc:0 "Las compañeras que al principio miraban con profunda desconfianza la noticia de la conversión de Hina—antes enemiga de la Agencia de Detectives 68—han ido reconociendo una a una que Hina realmente se ha enamorado de Aru. Ahora, conversar como amigas entre Mutsuki, Kayoko, Haruka y Hina también se ha vuelto algo cotidiano."

 HEU_hidden_hina_focus_6:0 "Enfrentarse a Ako"
 HEU_hidden_hina_focus_6_desc:0 "\"...Ako, soy yo. Hina. ...Sé que no tengo cara para esto, pero ¿podríamos vernos y hablar?\""

 HEU_repudiation_of_the_eden_treaty: "$GEH_repudiation_of_the_eden_treaty$"
 HEU_repudiation_of_the_eden_treaty_desc: "La Agencia de Detectives 68 no quiere actuar como *representante de Gehenna* y casi no siente pertenencia hacia Gehenna. Sin embargo, dado que el colapso del Pandemonium Society ha dejado una situación en la que el único liderazgo capaz de representar a Gehenna sigue siendo [ROOT.GetLeader], nos vemos obligadas a poner fin de una vez por todas al fastidioso acuerdo de paz entre Gehenna y Trinity."

 HEU_centralized_eden_treaty: "$GEH_centralized_eden_treaty$"
 HEU_centralized_eden_treaty_desc: "Puede que no conozcamos bien la larga relación de antagonismo entre las dos academias, pero precisamente por eso nuestro nuevo Tratado de Edén debe estructurarse de forma aún más centralizada. Aru cree que, tal como logró la paz entre los kivotosianos y los locales en Luxemburgo, también podrá alcanzar la paz entre las dos academias."

 HEU_decentralized_eden_treaty: "$GEH_decentralized_eden_treaty$"
 HEU_decentralized_eden_treaty_desc: "Nuestro gobierno tiene poco conocimiento sobre el tratado de paz entre Gehenna y Trinity, y también tiene dificultades para mediar entre ambas academias. La alternativa más razonable, en lugar de una centralización forzada, es conformar de manera descentralizada un sistema federal entre las dos academias."
