#{{ 선거 이벤트 시작 

 HEU.election_event.1.t:0 "Elecciones parlamentarias de [ROOT.GetNameDef]"
 HEU.election_event.1.desc:0 "Desde la introducción del sufragio universal en 1919, Luxemburgo ha celebrado elecciones parlamentarias (Abgeordnetenkammer) mediante un sistema de representación proporcional con listas abiertas. Todos los hombres y mujeres mayores de 21 años poseen tanto el derecho al voto como el derecho a ser elegidos, y los votantes pueden emitir su voto por el partido de su preferencia o por uno de los candidatos de representación proporcional de dicho partido. Debido al fuerte sistema proporcional de Luxemburgo, su parlamento adopta la forma de un sistema multipartidista con numerosos partidos representados. Estas elecciones se llevaron a cabo mediante procedimientos democráticos, y ahora podemos identificar al partido que ha obtenido el mayor número de escaños."
 HEU.election_event.1.a:0 "¡Junto a los campesinos, la derecha ha triunfado!"
 HEU.election_event.1.b:0 "¡Por la libertad de Gehenna, victoria del Partido Federal de Estudiantes!"
 HEU.election_event.1.c:0 "¡Por el poder de la pequeña burguesía, viva el Partido Radical Liberal!"
 HEU.election_event.1.d:0 "¡Por la solidaridad sindical, el gran salto del Partido Comunista!"

 HEU.election_event.2.t:0 "Elecciones parlamentarias de Luxemburgo"
 HEU.election_event.2.desc:0 "Desde la introducción del sufragio universal en 1919, Luxemburgo ha celebrado elecciones parlamentarias (Abgeordnetenkammer) mediante un sistema de representación proporcional con listas abiertas. Todos los hombres y mujeres mayores de 21 años poseen tanto el derecho al voto como el derecho a ser elegidos, y los votantes pueden emitir su voto por el partido de su preferencia o por uno de los candidatos de representación proporcional de dicho partido. Debido al fuerte sistema proporcional de Luxemburgo, su parlamento adopta la forma de un sistema multipartidista con numerosos partidos representados.\n\nLas elecciones parlamentarias se llevaron a cabo de manera libre. Aunque, tras la Gran Transición y el golpe de Estado del \"Rikuhachimismo\", la influencia política del parlamento disminuyó considerablemente después de la neutralización de la derecha, el parlamento sigue siendo el símbolo de nuestra democracia y la base sobre la cual somos reconocidos como Luxemburgo en la comunidad internacional."
 HEU.election_event.2.a:0 "El conteo de votos ha finalizado."

 HEU.election_event.3.t:0 "Elecciones parlamentarias de Luxemburgo"
 HEU.election_event.3.desc:0 "Desde la introducción del sufragio universal en 1919, Luxemburgo ha celebrado elecciones parlamentarias (Abgeordnetenkammer) mediante un sistema de representación proporcional con listas abiertas. Todos los hombres y mujeres mayores de 21 años poseen tanto el derecho al voto como el derecho a ser elegidos, y los votantes pueden emitir su voto por el partido de su preferencia o por uno de los candidatos de representación proporcional de dicho partido. Debido al fuerte sistema proporcional de Luxemburgo, su parlamento adopta la forma de un sistema multipartidista con numerosos partidos representados.\n\nTras el establecimiento de la Ley de Unión, nuestro parlamento se ha convertido en una gran asamblea unicameral compuesta por representantes de tres países: Gehenna, Trinity y Luxemburgo. Gracias a una distribución muy delicada de los distritos electorales, Luxemburgo mantiene la mayor influencia política, pero Trinity y Gehenna también pueden expresar sus opiniones en la política central."

 HEU.election_event.4.t:0 "Elecciones parlamentarias del Gran Estado Unido Germánico"

 HEU.election_event.4.desc.kayoko.generic:0 "Desde la introducción del sufragio universal en 1919, Luxemburgo ha celebrado elecciones parlamentarias (Abgeordnetenkammer) mediante un sistema de representación proporcional con listas abiertas. Todos los hombres y mujeres mayores de 21 años poseen tanto el derecho al voto como el derecho a ser elegidos, y los votantes pueden emitir su voto por el partido de su preferencia o por uno de los candidatos de representación proporcional de dicho partido. Debido al fuerte sistema proporcional de Luxemburgo, su parlamento adopta la forma de un sistema multipartidista con numerosos partidos representados.\n\nA diferencia del parlamento provisional de 30 miembros elegido sin elecciones tras la Ley de Unión y el colapso del régimen dictatorial de Asagi, estas elecciones del Gran Estado Unido Germánico tienen un gran significado como la primera elección democrática que define la alianza estatal igualitaria entre Luxemburgo, Gehenna y Trinity. El número total de escaños se fijó en 600, asignándose 300 a Trinity y Gehenna, y 300 a los habitantes locales. Suponiendo que el próximo primer ministro no disuelva el parlamento, los diputados del Gran Estado Unido Germánico cumplirán un mandato de cinco años.\n\nLas primeras elecciones generales tras la Ley de Unión experimentaron rápidas reagrupaciones desde el período electoral. Aunque los 300 escaños de Trinity y Gehenna y los 300 de los habitantes locales parecen favorecer a los germanos, en realidad, en los cantones asignados a los \"300 escaños locales\" también reside una gran población de origen Kivotos, por lo que no existe prácticamente ninguna posibilidad de que el próximo primer ministro sea elegido entre los habitantes locales. Los diversos partidos se han dividido en dos grandes bloques —pro-Gehenna y pro-Trinity—, buscando elegir al próximo líder del Gran Estado Unido Germánico desde sus respectivas facciones.\n\nLa coalición arcoíris de comunistas luxemburgueses, movimiento nacional alemán, extrema izquierda, nazis y liberales está preparando una alianza pro-Gehenna. Los comunistas rechazan a Trinity por ser una fuerza religiosa; los nacional-socialistas fueron encarcelados por el gobierno de Asagi y consideran a Rikuhachima Aru, quien logró la reunificación del pueblo germano dividido, como una \"heroína nacional\", por lo que se sienten cercanos a Gehenna. El Partido Radical Liberal ha sido desde la Gran Transición el más ferviente monárquico. La coalición arcoíris y el Partido de Independencia de Gehenna de Amau Ako apoyan a Onikata Kayoko como próxima primera ministra.\n\nTrinity se encuentra en una posición desfavorable en estas elecciones debido al rechazo de las fuerzas monárquicas por el hecho de que Rikuhachima Aru sea de origen Gehenna. La coalición blanco-negra, integrada por el Partido Popular Cristiano Social, la Alianza de Caballeros de Socorro de Trinity y miembros del Pandemonium Society, apoya a Aomori Mine de la facción Johan como próxima primera ministra. Mine está concentrando su campaña conjunta con Tanga Ibuki en el distrito central de Gehenna para aumentar sus probabilidades de victoria."

 HEU.election_event.4.kayoko:0 "¡Con la coalición arcoíris, la respuesta es Onikata Kayoko!"
 HEU.election_event.4.mine:0 "¡Con la coalición blanco-negra, socorro donde se necesite!"
 HEU.election_event.4.mutsuki:0 "¡Con la coalición arcoíris, una oportunidad para Mutsuki!"
 HEU.election_event.4.mika:0 "¡Con la coalición blanco-negra, apoyad a Misono Mika!"
 HEU.election_event.4.uzawa:0 "¡La coalición blanco-negra está con Uzawa Reisa, símbolo de la justicia!"
 HEU.election_event.4.haruka:0 "Sorprendentemente, la coalición arcoíris ha elegido a Haruka."


#룩셈부르크(흥신소 68) 디시전 시작☆

 ## 인간 파라미터
 HEU_aru_persona_decision_category:0 "Rikuhachima Aru - Parámetros humanos"

 HEU_aru_persona_schedule:0 "Tickets de agenda actuales: £schedule_ticket_texticon [?global.aru_schedule_point|+0]/6"
 HEU_aru_persona_schedule_desc:0 "Las acciones de Rikuhachima Aru requieren £schedule_ticket_texticon §Ytickets de agenda§!. Los tickets de agenda pueden recargarse hasta un máximo de 6 y no se acumulan por encima de ese límite."

 HEU_aru_persona_schedule_buy:0 "Obtener £schedule_ticket_texticon tickets de agenda"
 HEU_aru_persona_schedule_buy_desc:0 "Pienso conseguir un poco de tiempo para el desarrollo personal. Los ciudadanos también lo permitirán, ¿no?"

 HEU_aru_persona_schedule_buy_2:0 "Reservar £schedule_ticket_texticon agenda de vacaciones"
 HEU_aru_persona_schedule_buy_2_desc:0 "Montañas de papeleo, solicitudes ciudadanas que no dejan de llegar. Voy a dejar todo eso de lado por un día y tomarme unas vacaciones. He trabajado así de duro por la Agencia, ¿verdad? No hay motivo para no darle a Aru aunque sea un poco de margen."

 HEU_aru_persona_wisdom:0 "£schedule_ticket_texticon Estudio teó§Yri§!co"
 HEU_aru_persona_wisdom_desc:0 "Hay idiotas que creen que Rikuhachima Aru es tonta, pero desde hace tiempo Aru ha tenido su propio conocimiento y criterio sobre la gestión empresarial. Incluso después de la Gran Transición, ¿acaso no ha mantenido en pie a la Agencia 68? Aunque desde la Gran Transición se volvió difícil conseguir libros de administración de Kivotos, por suerte Aru todavía tiene muchos libros que no ha leído."

 HEU_aru_persona_kindness:0 "£schedule_ticket_texticon Ejecución de §Ctra§!bajo extra"
 HEU_aru_persona_kindness_desc:0 "¡Bienvenido! Cliente, ¿qué va a ordenar?\n\nPodría parecer vergonzoso que, siendo la jefa de la Agencia y gobernante de Luxemburgo, trabaje de medio tiempo en una cafetería. Pero al mismo tiempo, esta también es una oportunidad para acercarse más a los residentes locales. Y además, atendiendo a los clientes se puede cultivar una actitud y una disposición más amable."

 HEU_aru_persona_resolution:0 "£schedule_ticket_texticon En§Gent§!renamiento personal"
 HEU_aru_persona_resolution_desc:0 "A diferencia de Kivotos, en este mundo lo místico es tenue. Aru sigue siendo más fuerte que los lugareños, pero siente que sus capacidades físicas han disminuido en comparación con cuando estaba en su mundo original. No… en realidad no es una sensación: seguro que de verdad se ha debilitado. Para no preocupar a los otros miembros de la Agencia, Aru quiere apartar tiempo y entrenarse por su cuenta."

 HEU_aru_persona_charisma:0 "£schedule_ticket_texticon §RAu§!tocuidado"
 HEU_aru_persona_charisma_desc:0 "¿Te aplicaste el tónico después de lavarte la cara? No te saltaste la emulsión, ¿verdad? La base de maquillaje y la base de fondo no pueden faltar. El contour no es hardboiled, así que lo dejamos. Si en tu tiempo libre lees revistas de moda para no quedarte atrás, eliges cosméticos y, antes de salir a la oficina, te aplicas protector solar de Millennium (¿verdad que no le habrán puesto nada raro?), entonces todo queda listo para demostrar la dignidad de una jefa. Porque para mantener el carisma como jefa de la Agencia, nada es más importante que el autocuidado."

 HEU_aru_persona_random_events:0 "La vida cotidiana de la Agencia"
 HEU_aru_persona_random_events_desc:0 "La Agencia 68 sigue trabajando duro incluso después de la Gran Transición. ¿Quién sabe qué les ocurrirá a Aru y a sus amigas en este mundo? Podría pasar algún incidente pequeño pero agradable… o también podría estallar algún problema."

 HEU_aru_persona_armed_ver:0 "§GRikuhachima Aru§! - En combate"
 HEU_aru_persona_armed_ver_desc:0 "Con la pérdida del ojo izquierdo y una discapacidad permanente en el brazo derecho, la capacidad de combate de Aru ha caído de forma lamentable si se compara con su \"apogeo\" en Kivotos. Para evitar que, por no poder salir al frente, Aru termine perdiendo a sus preciadas amigas, ella propuso una idea: ponerse un chaleco antibalas de Gehenna, fijar un escudo antidisturbios a su brazo derecho dañado y, con una sola mano, operar una escopeta del mismo modelo que la de Haruka para poder ir al frente.\n\nLos oficiales monárquicos de Luxemburgo coinciden en que es una decisión peligrosamente temeraria, pero si Aru ya ha tomado la determinación de luchar personalmente en primera línea, no habrá forma de detenerla."

 ## 리쿠하치마주의 68혁명
  HEU_rikuhachimaism_decision_category:0 "Rikuhachimaismo: Revolución del 68 de la Agencia 68"
 HEU_rikuhachimaism_decision_category_desc:0 "\n\n£GFX_68_benriya_revolution\n\n\n\n\n\n\"Prohibido prohibir (Il est interdit d'interdire)\"\n - §YEn Radio Luxemburgo (RTL), declaración del actor Jean Yanne§!\n\nLa §GRevolución del 68§! que empezó a arder desde Luxemburgo toma su nombre de la Agencia 68, liderada por la jefa §PRikuhachima Aru§!. Por el impacto de la palabra \"revolución\", los medios neutrales también suelen usar el término §Yrikuhachimaismo§!. El rikuhachimaismo nació durante la Gran Transición de 1935 con el propósito de derribar la cultura autoritaria y religiosa de la humanidad y traer libertad a los ciudadanos de Kivotos; busca abolir la discriminación contra los oprimidos y proteger la cultura de los kivotenses, reprimida por los lugareños conservadores.\n\nPara llevar la Revolución del 68 al éxito, debemos destruir por completo la cultura local, anclada en formas de pensar anticuadas propias de los años 30. Religión, autoritarismo y nazismo: esos tres son enemigos que deben ser negados sin excepción para cumplir la Revolución del 68. Rikuhachima Aru trabaja para que la cultura de Kivotos pueda arraigar en estas tierras, apoyando los movimientos antirreligiosos, de desmantelamiento del autoritarismo y de desnazificación. Prohibir lo que ellos prohíben. Y recuperar la libertad de los kivotenses. Como la última forajida hardboiled, Rikuhachima Aru completará su ideal en esta tierra.\n\n§RAunque cueste lo que cueste.§!\n"

 HEU_rikuhachimaism_remove_nazi:0 "Atacar a la red nazi clandestina"
 HEU_rikuhachimaism_remove_nazi_desc:0 "Incluso tras la disolución oficial de las organizaciones fascistas, una parte de la población de Luxemburgo sigue adhiriéndose a la ideología nacionalsocialista y prepara atentados esporádicos contra los kivotenses. El problema es que no se trata de simples grupos pequeños dentro de Luxemburgo: también están conectados con los nacionalsocialistas de Deutschland y libran acciones de guerrilla. Golpear a las organizaciones nazis es una condición indispensable para el éxito de la Revolución del 68."

 HEU_rikuhachimaism_infrastructure_for_disabled:0 "Propuesta de Millennium - Luxemburgo para las personas con discapacidad"
 HEU_rikuhachimaism_infrastructure_for_disabled_desc:0 "Una comunidad estudiantil de Millennium que participa en la Revolución del 68 ha presentado una nueva propuesta.\n\nPara los lugareños, el concepto de \"derechos de las personas con discapacidad\" es bastante ajeno. La derecha los ve únicamente como quienes \"chupan\" el dinero de la \"comunidad nacional\", y la izquierda ni siquiera muestra interés. Pero en Kivotos no era así. Como en el caso de una chica de Millennium —una 'genio' con parálisis de la mitad inferior del cuerpo—, la discapacidad física no se aceptaba como un motivo de discriminación, sino como algo con lo que se convive.\n\nSi nuestra revolución no quiere quedarse en simples consignas, el derecho a la movilidad, y oportunidades iguales de empleo y educación para poder llevar vida social deben garantizarse. Sin duda hará falta un gran presupuesto… pero vale la pena asumirlo."

 HEU_rikuhachimaism_dissolution_of_authoritarianism:0 "Propuesta de la Agencia - Atacar la cultura autoritaria"
 HEU_rikuhachimaism_dissolution_of_authoritarianism_desc:0 "La Agencia 68, núcleo de la Revolución del 68, ha presentado una nueva propuesta.\n\nEn comparación con la cultura relativamente horizontal de Kivotos, la cultura local es vertical y, en especial, hay muchas familias que tratan de forma coercitiva a niños y mujeres. ¿Por qué hicimos la revolución? Precisamente para destruir esa cultura local, ¿no? El movimiento de desmantelamiento del autoritarismo, liderado por estudiantes de Kivotos, impulsará la liberación de las minorías oprimidas."

 HEU_rikuhachimaism_civil_rights_movement:0 "Propuesta de la Agencia - Ley de Derechos Civiles de Kivotos"
 HEU_rikuhachimaism_civil_rights_movement_desc:0 "La Agencia 68, núcleo de la Revolución del 68, ha presentado una nueva propuesta.\n\nEn Kivotos no solo viven estudiantes con apariencia humana. También residen diversas razas, incluidos quienes tienen forma de bestia, y tras la Gran Transición sufrieron una discriminación aún más severa que la de los estudiantes con halo. La Ley de Derechos Civiles castigará la discriminación en contratación, salarios y provisión de servicios públicos y privados contra todos los que llegaron con la Gran Transición de 1935, protegiéndolos legalmente."

 HEU_rikuhachimaism_individual_freedom:0 "Propuesta de Gehenna - Disfrute de la cultura de la libertad"
 HEU_rikuhachimaism_individual_freedom_desc:0 "Una comunidad estudiantil de Gehenna que participa en la Revolución del 68 ha presentado una nueva propuesta.\n\n¡La libertad de amar libremente, la libertad artística y un clima escolar libre! Dentro de la Revolución del 68 liderada por estudiantes de Kivotos, la comunidad de Gehenna —la \"academia de la libertad\"— se opone de forma especialmente firme a toda censura y prohibición, y busca abrir la rígida cultura local al estilo de Gehenna. Aunque el espíritu libre de Gehenna tiene un lado caótico, puede decirse que los estudiantes de Gehenna sostienen uno de los marcos del liberalismo de la Revolución del 68."

 HEU_rikuhachimaism_LGBTQ_freedom:0 "Propuesta de Gehenna - Derechos de las minorías sexuales"
 HEU_rikuhachimaism_LGBTQ_freedom_desc:0 "Una comunidad estudiantil de Gehenna que participa en la Revolución del 68 ha presentado una nueva propuesta.\n\nComo estudiantes de Gehenna —la academia donde \"todo está permitido\"— rechazan también la cultura sexual reprimida de los lugareños. El mayor problema es que, por la religión local, los derechos de las minorías sexuales se tratan como pecado. Dado que injertar en esta sociedad los valores futuristas y avanzados de Kivotos es una virtud importante, la comunidad estudiantil de Gehenna sostiene que el movimiento para promover los derechos de las minorías sexuales debe implementarse cuanto antes."

 HEU_rikuhachimaism_dissolution_of_nationalism:0 "Propuesta de Trinity - Desmantelar el nacionalismo"
 HEU_rikuhachimaism_dissolution_of_nationalism_desc:0 "Una comunidad estudiantil de Trinity que participa en la Revolución del 68 ha presentado una nueva propuesta.\n\nTrinity fue transferida a la región prusiana, el área metropolitana de la capital del Reich nazi, por lo que las estudiantes de Trinity conocen mejor que nadie el peligro del ultranacionalismo y el nacionalismo extremo de los lugareños. Las estudiantes de Trinity creen que debemos volcar aún más fuerza en el movimiento para desmantelar el nacionalismo."

 HEU_rikuhachimaism_free_female:0 "Propuesta de Trinity - Promoción de los derechos de las mujeres"
 HEU_rikuhachimaism_free_female_desc:0 "Una comunidad estudiantil de Trinity que participa en la Revolución del 68 ha presentado una nueva propuesta.\n\nLas estudiantes de Trinity, transferidas cerca de Berlín —capital del Reich nazi—, desconfían de la visión extremadamente conservadora sobre las mujeres que tienen los lugareños. Quienes aprendieron la moral bajo el dominio nazi buscan negar la participación social de las mujeres, lo cual choca frontalmente con la cultura de Kivotos, donde las mujeres llevan una vida social activa y libre. Bajo la influencia de la comunidad de Trinity, podríamos impulsar un movimiento de promoción de los derechos de las mujeres."

 HEU_rikuhachimaism_left_okay:0 "Propuesta de Red Winter - Permitir el movimiento estudiantil de izquierda"
 HEU_rikuhachimaism_left_okay_desc:0 "Una comunidad estudiantil de Red Winter que participa en la Revolución del 68 quiere fusionar el movimiento socialista con la revolución.\n\nLa \"Revolución del 68 rikuhachimista\" que proclaman Rikuhachima Aru y la Agencia 68 es, en esencia, un movimiento liberal y anti-autoridad aplicado solo al ámbito cultural. Sin embargo, una minoría de estudiantes inmigrantes de Red Winter busca aplicar al rikuhachimaismo movimientos de izquierda como el trotskismo o el leninismo para empujar una transformación del sistema económico.\n\nA Rikuhachima Aru no le interesa en absoluto ese rollo del trotskismo, pero tampoco le interesa reprimirlos. Los dejaremos hablar libremente. Eso también será parte de la revolución."

 HEU_rikuhachimaism_left_no:0 "Propuesta de Red Winter - Marcar distancia con el movimiento estudiantil de izquierda"
 HEU_rikuhachimaism_left_no_desc:0 "Una comunidad estudiantil de Red Winter que participa en la Revolución del 68 quiere fusionar el movimiento socialista con la revolución.\n\nLa \"Revolución del 68 rikuhachimista\" que proclaman Rikuhachima Aru y la Agencia 68 es, en esencia, un movimiento liberal y anti-autoridad aplicado solo al ámbito cultural. Sin embargo, una minoría de estudiantes inmigrantes de Red Winter busca aplicar al rikuhachimaismo movimientos de izquierda como el trotskismo o el leninismo para empujar una transformación del sistema económico.\n\nPero Rikuhachima Aru desea que su revolución se aplique únicamente al ámbito cultural, y declaró públicamente que el activismo estudiantil de Red Winter \"no es rikuhachimaismo\". Esta declaración reducirá drásticamente a los simpatizantes del movimiento trotskista de la comunidad de Red Winter."

 HEU_rikuhachimaism_invitation_to_sartre:0 "Invitar a Sartre"
 HEU_rikuhachimaism_invitation_to_sartre_desc:0 "Jean-Paul Sartre, un joven pero talentoso novelista, ganó notoriedad tras la Gran Transición con su novela \"La náusea\", publicada poco después de exiliarse en África. Es casi el único intelectual humano que ha apoyado públicamente la Revolución del 68, defendiendo que la cultura autoritaria de la humanidad debe ser desmantelada y reemplazada por la cultura relativamente horizontal de Kivotos. Aunque no deja de ser un novelista con un solo libro, Sartre cree que, participando directamente en la Revolución del 68, podrá perfeccionar y hacer más rigurosa su filosofía."

 HEU_rikuhachimaism_invitation_to_goldman:0 "Invitar a Goldman"
 HEU_rikuhachimaism_invitation_to_goldman_desc:0 "La anarquista Emma Goldman apoya el feminismo y la anti-autoridad de la Revolución del 68, pero al mismo tiempo reflexiona sobre sus límites reales. Aun así, Goldman quiere ver con sus propios ojos cómo avanza nuestra revolución en Luxemburgo."

 ## Desafiar al Consejo Estudiantil General
 HEU_aru_GSC_defiance_decision_category:0 "Desafiar al Consejo Estudiantil General"
 HEU_aru_GSC_defiance_decision_category_desc:0 "§YLa Agencia 68§! es una fuerza pequeña comparada con el §YConsejo Estudiantil General§!, pero no es que no exista posibilidad de victoria. Los §Gbelgas lugareños§! recibirán con agrado el avance del ejército luxemburgués por su larga amistad con Luxemburgo y, si tenemos suerte, incluso podríamos conseguir el apoyo del §GPandemonium§!. Para que Rikuhachima Aru ascienda al cargo de Presidenta del Consejo Estudiantil General, no bastará con el poder de los transferidos de Kivotos: también hará falta la ayuda de los lugareños.\n\nPor supuesto, esto no contradice el rikuhachimaismo. El mundo que Aru sueña no es uno donde los kivotenses dominen a los lugareños, sino uno donde se derribe la cultura autoritaria local. Aun así, algunos rikuhachimistas radicales podrían oponerse a la cooperación con los lugareños, y debemos tener presente que una colaboración demasiado prolongada con ellos puede §Renfurecer a los radicales§!."

 HEU_aru_GSC_defiance_smuggling_of_weapons:0 "Contrabando de armas desde Bélgica"
 HEU_aru_GSC_defiance_smuggling_of_weapons_desc:0 "Tanto Rikuhachima Aru como [KSP.GetLeader] son transferidos de Kivotos, pero el título de Aru como \"regente del Gran Duque de Luxemburgo\" y la legitimidad luxemburguesa facilitan ganarse el favor de los belgas. Para liberar Bélgica, podemos contactar a nacionalistas belgas y recibir armas. Sin embargo, Joseph Jacquemotte —líder de la resistencia belga— es un típico marxista-leninista, y una cooperación prolongada con él decepcionará a los partidarios de Aru."

 HEU_aru_GSC_defiance_belgium_sabotages:0 "Apoyar sabotajes en Bélgica"
 HEU_aru_GSC_defiance_belgium_sabotages_desc:0 "La liberación de Bélgica por parte de la Agencia 68 se acerca. Apoyemos sabotajes en la zona fronteriza belga para sumirlos en el caos."

 HEU_aru_GSC_defiance_COU_sabotages:0 "Apoyar sabotajes contra el Consejo Estudiantil General"
 HEU_aru_GSC_defiance_COU_sabotages_desc:0 "Los actos de sabotaje dentro del Consejo Estudiantil General son cruciales para nuestra causa."

 HEU_aru_GSC_defiance_SHE_sabotages:0 "Apoyar sabotajes contra Schale"
 HEU_aru_GSC_defiance_SHE_sabotages_desc:0 "Los actos de sabotaje dentro del Consejo Estudiantil General son cruciales para nuestra causa."

 HEU_aru_GSC_defiance_ask_gehenna_for_help:0 "Solicitar apoyo a [GEM.GetLeader]"
 HEU_aru_GSC_defiance_ask_gehenna_for_help_desc:0 "Debemos pedir al Pandemonium que nos reconozca como el verdadero Consejo Estudiantil General y que nos provea equipo necesario para la guerra. Esta es una alternativa que incluso los radicales rikuhachimistas pueden aceptar."

 HEU_aru_GSC_defiance_attack_974:0 "Intensificar el conflicto fronterizo en la región de §Y[980.GetName]§!"
 HEU_aru_GSC_defiance_attack_974_desc:0 "El plan ideal es ocupar la zona al este del río Mosa antes de iniciar la guerra. Mediante un conflicto fronterizo sorpresa, podemos imponer una ocupación militar sobre esa región. Claro, el enemigo estará en guardia, así que no podremos atacar el mismo lugar múltiples veces. Y si tenemos mala suerte, esto podría derivar en guerra abierta. ¡Pero no importa! Desde el momento en que nos declaramos Consejo Estudiantil General, ya era lo mismo que estar preparados para la guerra."

 HEU_aru_GSC_defiance_attack_977:0 "Intensificar el conflicto fronterizo en la región de §Y[1089.GetName]§!"
 HEU_aru_GSC_defiance_attack_977_desc:0 "El plan ideal es ocupar la zona al este del río Mosa antes de iniciar la guerra. Mediante un conflicto fronterizo sorpresa, podemos imponer una ocupación militar sobre esa región. Claro, el enemigo estará en guardia, así que no podremos atacar el mismo lugar múltiples veces. Y si tenemos mala suerte, esto podría derivar en guerra abierta. ¡Pero no importa! Desde el momento en que nos declaramos Consejo Estudiantil General, ya era lo mismo que estar preparados para la guerra."

 HEU_aru_GSC_defiance_attack_KSP:0 "Eliminar a los opresores de Bélgica"
 HEU_aru_GSC_defiance_attack_KSP_desc:0 "[KSP.GetName] ha jugado el papel de opresor en Bélgica durante demasiado tiempo. La Agencia 68, en nombre de la autoridad del Consejo Estudiantil General, ejecutará una operación de disolución contra ese caudillaje policiaco autoproclamado."

 HEU_aru_GSC_defiance_attack_COU:0 "Eliminar a [COU.GetName]"
 HEU_aru_GSC_defiance_attack_COU_desc:0 "[COU.GetName] se autoproclama Consejo Estudiantil General, pero no está claro qué han hecho por los derechos humanos de los transferidos de Kivotos. Un futuro correcto aguarda: la forajida Rikuhachima Aru como Presidenta del Consejo Estudiantil General."

 HEU_aru_GSC_defiance_attack_SHE:0 "Eliminar a [SHE.GetName]"
 HEU_aru_GSC_defiance_attack_SHE_desc:0 "[SHE.GetName] se autoproclama Consejo Estudiantil General, pero no está claro qué han hecho por los derechos humanos de los transferidos de Kivotos. ¿De verdad vamos a confiar los derechos de la gente de Kivotos a una IA desconocida? ¡Claro que no! La forajida Rikuhachima Aru, no una lata con cables, se sentará en el trono como la auténtica forajida."

 HEU_aru_GSC_state_return_request:0 "Exigir el estado de §Y[FROM.GetName]§!"
 HEU_aru_GSC_state_return_request_desc:0 "El estado de §Y[FROM.GetName]§! es un territorio que debemos recuperar legítimamente, pero por ahora está bajo control de un aliado. Enviaremos una solicitud formal y cortés a nuestros aliados para que Rikuhachima Aru pueda obtener el puesto legítimo de Presidenta del Consejo Estudiantil General."
 HEU_state_return_request_in_progress_flag:0 "La solicitud de devolución está en curso"
 HEU_state_return_request_fail_flag:0 "Devolución rechazada"

 HEU_aru_GSC_defiance_ask_FROM:0 "Solicitar a [FROM.GetName] la devolución del territorio"
 HEU_aru_GSC_defiance_ask_FROM_desc:0 "Logramos someter al Consejo Estudiantil General, pero el ejército de [FROM.GetLeader] controla parte del territorio del Consejo. Explicaremos de manera cortés que hemos heredado el cargo de Consejo Estudiantil General de Kivotos y pediremos que se retiren de nuestros territorios legítimos."

 HEU_aru_GSC_defiance_remove_old_GSC:0 "Victoria total sobre el antiguo Consejo Estudiantil General"
 HEU_aru_GSC_defiance_remove_old_GSC_desc:0 "Ya controlamos todas las ciudades importantes de las fuerzas del antiguo Consejo Estudiantil General, y una guerra adicional sería innecesaria. ¡Obliguemos a los aliados del viejo Consejo a reconocer que hemos heredado el verdadero Consejo, y declaremos que Rikuhachima Aru se ha convertido en la auténtica Presidenta del Consejo Estudiantil General! ¡Esta guerra ha terminado!"

 ## 룩셈부르크-만마전 동맹
 HEU_luxembourg_pandemonium_alliance_decision_category:0 "룩셈부르크-게헨나 동맹"
 HEU_luxembourg_pandemonium_alliance_decision_category_desc:0 "§Y룩셈부르크 대공국§!을 통치하는 §G흥신소 68§!과 게헨나 학원의 학생회 기관인 §G만마전§! 사이의 동맹은 주변 국가의 위협으로부터 두 국가를 안전하게 보호하고 있습니다. 특히 §R트리니티§! 같은 가상적국으로부터 말이죠. 하지만 급변하는 정치적 상황에 따라 룩셈부르크-게헨나 동맹이 §R외부의 위협§!을 받을 가능성은 충분합니다. 외부의 위협으로부터 두 국가의 우정을 수호하기 위해 우리는 할 수 있는 모든 준비를 할 것입니다."
 ### Propuesta de la Agencia
 HEU_exile_proposal_GEM:0 "Proponer el exilio a [GEM.GetLeader]" 
 HEU_exile_proposal_GEM_desc:0 "Pandemonium se ha esforzado por protegerse de invasiones externas, pero su ejército se enfrenta a la peor crisis de su historia. Proponerles exiliarse en Luxemburgo y permitir que la Agencia 68 tome el mando de las fuerzas remanentes de Pandemonium podría ser una oferta adecuada."

 HEU_air_force_technical_request_GEM:0 "Solicitar tecnología aérea a [GEM.GetName]" 
 HEU_air_force_technical_request_GEM_desc:0 "Antes de la Gran Transición, Luxemburgo no poseía ni una sola aeronave militar. Tras la Gran Transición, hemos conseguido un pequeño número de pilotos, pero seguimos estando muy rezagados en tecnología aeronáutica frente a los países vecinos. ¿No podríamos, al menos, preguntar a Pandemonium si como aliado puede compartirnos un poco de tecnología armamentística?"

 HEU_navy_technical_request_GEM:0 "Solicitar tecnología naval a [GEM.GetName]" 
 HEU_navy_technical_request_GEM_desc:0 "Luxemburgo era un país sin mar, y Rikuhachima Aru tampoco tiene conocimientos sobre asuntos marítimos. Hemos asegurado una costa, pero si no podemos aprovecharla, ¿de qué nos sirve el mar? Preguntaremos a Pandemonium si podría compartirnos un poco de tecnología naval."

 HEU_propagation_of_the_68_revolution_GEM:0 "Propagar la Revolución del 68 en [GEM.GetName]" 
 HEU_propagation_of_the_68_revolution_GEM_desc:0 "Nuestra ideología vanguardista —llamada rikuhachimaismo, o Revolución del 68— debe cruzar fronteras y propagarse también en Pandemonium. No parece muy probable que Gehenna, la \"escuela libre\", intente reprimir la difusión del liberalismo pensado para todos los oprimidos. Si tenemos suerte, conseguiremos un buen socio que simpatice con la causa de la Revolución del 68."

 ## Balance de poder
 HEU_bop_love_earth:0 "Empatía con los lugareños" 
 HEU_bop_love_earth_desc:0 "Es cierto que, durante la Gran Transición, el nazismo, los católicos y los nacionalistas han mostrado actitudes discriminatorias hacia los transferidos que llegaron desde Kivotos. Pero Rikuhachima Aru cree que, si los kivotenses persuaden pacientemente a los lugareños, esa mentalidad discriminatoria puede reducirse. Poner la otra mejilla cuando te golpean la izquierda también puede ser el camino hacia la armonía entre Kivotos y los lugareños."

 HEU_bop_love_kivotos:0 "Empatía con los kivotenses" 
 HEU_bop_love_kivotos_desc:0 "Tras la Gran Transición, en Luxemburgo el racismo de los lugareños contra los kivotenses se practica abiertamente. ¿Hasta cuándo debemos aguantarles? Rikuhachima Aru quiere empatizar más con los kivotenses que sufren —no con los lugareños— y escuchar sus voces de dolor. Tal vez, para que ambos pueblos puedan convivir, quienes deben cambiar no sean los kivotenses, sino los lugareños."

 HEU_bop_love_everyone:0 "Empatía con todos" 
 HEU_bop_love_everyone_desc:0 "Es momento de dejar a un lado, por ahora, la empatía selectiva hacia kivotenses o lugareños, y ordenar la mente con calma. Hay que revisar si el corazón no se ha inclinado demasiado hacia un solo lado."

 HEU_bop_talk_people:0 "Dialogar con los lugareños" 
 HEU_bop_talk_people_desc:0 "Nos reunimos y conversamos directamente con los lugareños de Luxemburgo, aprendiendo poco a poco su cultura."

 HEU_bop_talk_kivotos:0 "Dialogar con los kivotenses" 
 HEU_bop_talk_kivotos_desc:0 "Nos reunimos y conversamos directamente con los transferidos que llegaron durante la Gran Transición, escuchando sus dificultades y preocupaciones."

 ## Agencia 68
 HEU_problem_solver_68_decision_category:0 "Agencia 68"
 HEU_problem_solver_68_decision_category_desc:0 "\n\n£GFX_problem_solver_68_system\n\n\n\n\n\n\"¿Dicen que contratarme sale bastante caro?\"\n - §YRikuhachima Aru§!\n\nEn el caos posterior a la §YGran Transición§!, la antigua oficina de la Agencia 68 fue alcanzada por una granada de estudiantes de Gehenna y quedó reducida a cenizas… pero aun así, tras la Gran Transición, la Agencia 68 creció muchísimo más que antes. Al convertirse Rikuhachima Aru en regente del Gran Duque de Luxemburgo, pudo tirar del §Ytesoro nacional§! y se resolvió por fin la eterna crisis de fondos de la Agencia. Además, el palacio ducal pasó a ser la nueva oficina: ¡lleno de nuevas habitaciones, como salones de recepción!\n\nPor supuesto, también aumentó el personal. Algunas estudiantes de otras academias, conmovidas por el idealismo de Rikuhachima Aru de construir un país donde kivotenses y lugareños puedan vivir en igualdad, se ofrecieron voluntariamente para convertirse en §Yempleadas§! de la Agencia 68.\n\n§g(Gracias a eso, para distinguir a Haruka del resto del personal, su rango pasó a ser \"empleada\" (tiempo completo). ¡Qué bien!)§!\n\nDespués de la §YGran Transición§!, podemos dar órdenes a las empleadas para §Gayudar a Luxemburgo§!. O, si queremos, podemos pedir a Mutsuki, Kayoko y Haruka —las compañeras de siempre de Aru— que sean ellas quienes den las órdenes al personal. La gestión de la forajida §Yhardboiled§! Rikuhachima Aru comienza una vez más.\n"

 HEU_problem_solver_68_system:0 "Ingresos de la Agencia 68 de este año" 
 HEU_problem_solver_68_system_desc:0 "Cada año, la Agencia 68 gana dinero resolviendo diversos encargos de los ciudadanos de Luxemburgo, y reinvierte esos ingresos en Luxemburgo. Hasta el día en que el ideal de Rikuhachima Aru se haga realidad, las ganancias deben redistribuirse no para el beneficio personal de Aru, sino para sus valiosas compañeras."

 HEU_problem_solver_68_haruka:0 "§GHaruka§! - Encargo de patrullaje en Luxemburgo" 
 HEU_problem_solver_68_haruka_desc:0 "Aunque sea poco asertiva y tenga una personalidad autodestructiva, Aru cree que Haruka es, en el fondo, una subordinada confiable con una voluntad firme… no. Una amiga. Aru planea encargarle que, junto con las empleadas de la Agencia, patrulle distintas zonas de Luxemburgo y expulse a la Banda del Casco y otras organizaciones criminales que se ocultaron en el caos de la Gran Transición."

 HEU_problem_solver_68_mutsuki:0 "§GMutsuki§! - Encargo de fabricación de armas hardboiled" 
 HEU_problem_solver_68_mutsuki_desc:0 "Si hablamos de cosas que hacen ¡BANG!, Mutsuki es la que más disfruta este tipo de encargos. Aru puede pedirle que, junto con las empleadas de la Agencia 68, produzca municiones, armas de fuego y otros suministros para prepararse para la guerra. Claro, como es producción artesanal, no podemos fabricar armas más allá de armamento individual… pero, ¿no es suficiente con eso?"

 HEU_problem_solver_68_kayoko:0 "§GKayoko§! - Encargo táctico" 
 HEU_problem_solver_68_kayoko_desc:0 "Kayoko, la más veterana y erudita dentro de la Agencia 68, se esforzará por brindar apoyo táctico a otros comandantes en el frente para proteger al Luxemburgo en peligro."

 HEU_problem_solver_68_aru_1:0 "§GAru§! - Reclutar Brigadas Internacionales" 
 HEU_problem_solver_68_aru_1_desc:0 "Lo que diferencia a Luxemburgo de otros estados-academia es que soñamos con una sociedad ideal igualitaria para todos los kivotenses y para la humanidad. La mano de obra que podemos reunir dentro de Luxemburgo es limitada, pero Aru puede hacer que idealistas de todo el mundo —que creen que, pese al caos de la Gran Transición, Kivotos y la civilización terrestre pueden armonizar— acudan a Luxemburgo con armas en mano."

 HEU_problem_solver_68_aru_2:0 "§GAru§! - Construir una fábrica militar" 
 HEU_problem_solver_68_aru_2_desc:0 "Costará mucho dinero y será difícil, pero podemos construir una sucursal de la Agencia 68 como fábrica militar."

 HEU_problem_solver_68_aru_3:0 "§GAru§! - Construir una fábrica civil" 
 HEU_problem_solver_68_aru_3_desc:0 "Costará mucho dinero y será difícil, pero podemos construir una sucursal de la Agencia 68 como fábrica de industria ligera."

 HEU_problem_solver_68_hina:0 "§GHina§! - Encargo táctico de la antigua Prefectura" 
 HEU_problem_solver_68_hina_desc:0 "Hina, exlíder de la Prefectura, diseñará operaciones tácticas muy afiladas, enfocadas más en el ataque que en la defensa, y dirigirá a los oficiales."

 ### Easter egg: matrimonio igualitario de Aru
 HEU_problem_solver_68_aru_proposal_mutsuki:0 "§GAru§! - Proponerle matrimonio a Mutsuki" 
 HEU_problem_solver_68_aru_proposal_mutsuki_desc:0 "Tras la legalización del matrimonio igualitario en el Gran Ducado de Luxemburgo, la oposición acusó a Rikuhachima Aru de que esa reforma solo era para casarse con otra miembro de la Agencia 68. Sí: eso tiene cierta base en hechos. ¿Y qué?\n\nPara Aru, Mutsuki siempre fue una amiga importante. Tenía mucha vena de bromista y también la inclinación de empujar a Aru hacia situaciones peligrosas, pero Aru jamás dudó de su compañerismo sincero. No sabe qué pensará Mutsuki de esta propuesta, pero Aru decidió que quiere compartir el resto de su vida con Mutsuki, y con nadie más."

 HEU_problem_solver_68_aru_proposal_kayoko:0 "§GAru§! - Proponerle matrimonio a Kayoko" 
 HEU_problem_solver_68_aru_proposal_kayoko_desc:0 "Tras la legalización del matrimonio igualitario en el Gran Ducado de Luxemburgo, la oposición acusó a Rikuhachima Aru de que esa reforma solo era para casarse con otra miembro de la Agencia 68. Sí: eso tiene cierta base en hechos. ¿Y qué?\n\nPara Aru, Kayoko siempre fue una amiga importante. A veces era difícil conocer lo que llevaba dentro por su carácter calmado y de pocas palabras. Pero Aru sabe que tras ese aspecto intimidante hay un corazón cálido, y que también tiene ese lado de amar a los animalitos pequeños como los gatos. Si Aru necesita una pareja para compartir la vida, esa es Kayoko… aunque no sabe qué pensará Kayoko de la propuesta."

 HEU_problem_solver_68_aru_proposal_haruka:0 "§GAru§! - Proponerle matrimonio a Haruka" 
 HEU_problem_solver_68_aru_proposal_haruka_desc:0 "Tras la legalización del matrimonio igualitario en el Gran Ducado de Luxemburgo, la oposición acusó a Rikuhachima Aru de que esa reforma solo era para casarse con otra miembro de la Agencia 68. Sí: eso tiene cierta base en hechos. ¿Y qué?\n\nPara Aru, su primer encuentro con Haruka sigue siendo un recuerdo inolvidable: el día en que salvó a una pequeña chica que sufría acoso y recibió un modesto agradecimiento. Desde entonces pasó mucho tiempo, pero el vínculo entre Aru y Haruka no se rompió: se volvió más profundo y firme. Si le preguntas a Aru con quién de la Agencia 68 debería compartir su vida, Aru elegiría a Haruka… aunque no sabe qué pensará Haruka de esto."

 ### Easter egg: matrimonio igualitario de Aru (comunista)
 HEU_com_problem_solver_68_aru_proposal_mutsuki:0 "§GAru§! - Proponerle matrimonio a Mutsuki" 
 HEU_com_problem_solver_68_aru_proposal_mutsuki_desc:0 "Quienes saben que Asagi Mutsuki fue, de facto, la líder de un golpe de Estado, le arrebató el control militar a Rikuhachima Aru y desencadenó una guerra de invasión, quedaron profundamente impactados al enterarse de que Aru le propuso matrimonio a Asagi Mutsuki. ¿Es posible perdonar —y amar— a alguien que te traicionó? Los pesimistas dirían que \"nunca\".\n\nPero para Aru, Mutsuki siempre fue alguien valioso. Comprendiendo y perdonando todo lo que ella hizo por Aru, y aun sabiendo eso, Aru amó a Mutsuki."

 HEU_com_problem_solver_68_aru_proposal_kayoko:0 "§GAru§! - Proponerle matrimonio a Kayoko" 
 HEU_com_problem_solver_68_aru_proposal_kayoko_desc:0 "Durante el periodo en que la relación entre las miembros de la Agencia 68 se enfrió, probablemente nadie sufrió tanto como Kayoko. Pero aun así, Kayoko no abandonó la Agencia 68 y se quedó al lado de Aru hasta el final.\n\nKayoko fue una amiga valiosa para Aru. A veces era difícil conocer lo que llevaba dentro por su carácter calmado y de pocas palabras. Pero Aru sabe que tras ese aspecto intimidante hay un corazón cálido, y que también tiene ese lado de amar a los animalitos pequeños como los gatos. Si Aru necesita una pareja para compartir la vida, esa es Kayoko… aunque no sabe qué pensará Kayoko de la propuesta."

 HEU_com_problem_solver_68_aru_proposal_haruka:0 "§GAru§! - Proponerle matrimonio a Haruka" 
 HEU_com_problem_solver_68_aru_proposal_haruka_desc:0 "Incluso en el periodo en que la relación entre las miembros de la Agencia 68 se enfrió, Haruka se quedó junto a Aru y trabajó por la Agencia 68 durante los tiempos difíciles. Y cuando hizo falta una valentía increíble en aquel cuarto de renta para salvar la vida de Aru… ¿no fue Haruka quien lo hizo?\n\nPara Aru, su primer encuentro con Haruka sigue siendo un recuerdo inolvidable: el día en que salvó a una pequeña chica que sufría acoso y recibió un modesto agradecimiento. Desde entonces pasó mucho tiempo, pero el vínculo entre Aru y Haruka no se rompió: se volvió más profundo y firme. Si le preguntas a Aru con quién de la Agencia 68 debería compartir su vida, Aru elegiría a Haruka… aunque no sabe qué pensará Haruka de esto."

 HEU_com_problem_solver_68_aru_proposal_hina:0 "§YHina§! - Proponerle matrimonio a Aru" 
 HEU_com_problem_solver_68_aru_proposal_hina_desc:0 "En Kivotos, la relación entre Hina y Aru… sin duda fue hostil. Pero tras el colapso de la Prefectura, Hina empezó a sentir afecto por Aru, quien la ayudó a ponerse de pie cuando estaba mentalmente destruida… y ese afecto, antes de darse cuenta, creció más allá de la admiración y se convirtió en amor.\n\nNo sabe cómo aceptará Aru esta propuesta, pero para Hina, este sentimiento es una verdad sin mentira."
 ## Coreado del Consejo Estudiantil General
 HEU_aru_GSC_annex_decision_category:0 "Presidenta del Consejo Estudiantil: Rikuhachima Aru"
 HEU_aru_GSC_annex_decision_category_desc:0 "§YLa Agencia 68§! es una fuerza menor comparada con el §YConsejo Estudiantil General§!, pero, como por milagro, logramos la victoria y lo tomamos. Claro que aún queda el camino difícil: lograr que los antiguos miembros del Consejo reconozcan a la presidenta §PRikuhachima Aru§! como la §Gverdadera Presidenta del Consejo Estudiantil General§!. Aunque ocupamos el territorio, todavía no hemos ganado ni la §Yconfianza de las estudiantes del Consejo Estudiantil General§! ni la §Yconfianza de los lugareños§!.\n\nDebemos conseguir el apoyo del Consejo Estudiantil General y de los belgas-neerlandeses, y guiarlos para que nos reconozcan como la §Gverdadera Presidenta del Consejo Estudiantil General§!. No será fácil, pero hay esperanza. El título de §Cregente del Gran Duque de Luxemburgo§! tranquilizará a los belgas. Y el ideal de Aru de la §Carmonía entre los kivotenses y la humanidad§! dará confianza a las estudiantes del Consejo. Si usamos bien esas dos cartas, llegará el día en que se nos reconozca como la §Gverdadera Presidenta del Consejo Estudiantil General§!.\n\n\t[BEL.GetFlag]Apoyo belga: [?global.HEU_support_belgium|+0]\n [COU.GetFlag]Apoyo del Consejo Estudiantil General: [?global.HEU_support_GSC|+0]\n"

 HEU_aru_GSC_annex_persuading_arona:0 "Convencer a figuras clave del Consejo Estudiantil General" 
 HEU_aru_GSC_annex_persuading_arona_desc:0 "Varias ejecutivas del Consejo Estudiantil General creen que Rikuhachima Aru es una incompetente \"sin cualificación\" para ser \"presidenta del Consejo Estudiantil\". Incluso después de que Aru ocupara el Consejo, la mayoría del personal original no se unió a la \"Comisión Revolucionaria\", lo que le está dificultando a Aru asumir y heredar el trabajo del Consejo como presidenta. Convencerlas será extremadamente difícil… pero ayudará enormemente a nuestra legitimidad."

 HEU_aru_GSC_annex_persuading_degrelle:0 "Convencer a Joseph Jacquemotte" 
 HEU_aru_GSC_annex_persuading_degrelle_desc:0 "Tras controlar todo el Benelux, la resistencia belga liderada por Joseph Jacquemotte insiste en que Rikuhachima Aru debe retirarse y entregar la tierra belga a la resistencia. Aunque será difícil que Aru lo convenza con pura lógica, lo persuadiremos mostrándole la diferencia de tamaño entre la resistencia belga y el ejército regular luxemburgués, y proponiendo que en Bélgica se permita una mayor autonomía regional administrada por belgas."

 HEU_aru_GSC_annex_persuading_GSC_state:0 "Gira por [FROM.FROM.GetName]" 
 HEU_aru_GSC_annex_persuading_GSC_state_desc:0 "Visitemos la región de [FROM.FROM.GetName], donde el Consejo Estudiantil General mantiene un control fuerte, y hagamos que sus residentes comprendan que Rikuhachima Aru es la nueva Presidenta del Consejo Estudiantil General."

 HEU_aru_GSC_annex_persuading_belgium_state:0 "Gira por [FROM.FROM.GetName]" 
 HEU_aru_GSC_annex_persuading_belgium_state_desc:0 "Visitemos la región de [FROM.FROM.GetName], donde la influencia belga es dominante, y recordemos a la población que Rikuhachima Aru sigue siendo una amiga de los belgas."

 HEU_aru_GSC_annex_core_east_belgium_states:0 "Integrar la Bélgica Oriental" 
 HEU_aru_GSC_annex_core_east_belgium_states_desc:0 "Gracias al alto apoyo de los belgas, ahora podemos integrar la región de Bélgica Oriental como parte de nuestro territorio."

 HEU_aru_GSC_annex_core_west_belgium_states:0 "Integrar la Bélgica Occidental" 
 HEU_aru_GSC_annex_core_west_belgium_states_desc:0 "Gracias al alto apoyo de los belgas, ahora podemos integrar la región de Bélgica Occidental como parte de nuestro territorio."

 HEU_aru_GSC_annex_core_south_GSC_states:0 "Integrar el Consejo Estudiantil General del Sur" 
 HEU_aru_GSC_annex_core_south_GSC_states_desc:0 "Gracias al alto apoyo de los kivotenses, ahora podemos integrar la región del Consejo Estudiantil General del Sur como parte de nuestro territorio."

 HEU_aru_GSC_annex_core_north_GSC_states:0 "Integrar el Consejo Estudiantil General del Norte" 
 HEU_aru_GSC_annex_core_north_GSC_states_desc:0 "Gracias al alto apoyo de los kivotenses, ahora podemos integrar la región del Consejo Estudiantil General del Norte como parte de nuestro territorio."

 ## Parlamento de Luxemburgo
 HEU_abgeordnetenkammer_decision_category:0 "Parlamento [ROOT.GetAdjective]"
 HEU_abgeordnetenkammer_decision_category_desc:0 "\n\n£GFX_HEU_abgeordnetenkammer\n\n\n\n\n\n§Y[ROOT.GetName]§! es una monarquía constitucional y una democracia: en teoría, el Gran Duque puede disolver libremente el parlamento y posee el derecho de promulgar leyes. Sin embargo, según la primera constitución democrática promulgada en 1919, el Gran Duque sigue el principio de §Yreina, pero no gobierna§!, delegando la autoridad a un parlamento leal y democrático e interviniendo lo mínimo posible en política. Al menos, hasta antes de la Gran Transición, ese principio se mantuvo.\n\nLa §Gcoalición gobernante§! actual es la siguiente:\n\n\n\n\n\n\n\n\n\n"
 
 benriya_kivotos_text: "£GFX_benriya_kivotos_texticon §GInfluencia del Partido Estudiantil Federal§!: §Y[?HEU_abgeordnetenkammer^0|1%]§!\n    Apoyo a la guerra: [?HEU_kivotos_party_war_support_factor|=+1%]\n    Defensa contra deriva ideológica: [?HEU_kivotos_party_drift_defence_factor|=+1%]"
 benriya_right_text: "£GFX_benriya_right_texticon §1Influencia del Partido de Derecha§!: §Y[?HEU_abgeordnetenkammer^1|1%]§!\n    Velocidad de construcción de fábricas civiles: [?HEU_right_party_industrial_complex_var|=+%2]\n    Estabilidad: [?HEU_right_party_stability_factor|=+%2]"
 benriya_centre_text: "£GFX_benriya_centre_texticon §CInfluencia del Partido Radical-Liberal§!: §Y[?HEU_abgeordnetenkammer^2|1%]§!\n    Límite de eficiencia de producción: [?HEU_centre_party_production_factory_max_efficiency_factor|=+%2]\n    Modificador de fábricas de bienes de consumo: §Y[?HEU_centre_party_consumer_goods_factor|==%1]§!"
 benriya_left_text: "£GFX_benriya_left_texticon §RInfluencia del Partido Comunista§!: §Y[?HEU_abgeordnetenkammer^3|1%]§!\n    Producción de fábricas: [?HEU_left_party_industrial_capacity_factory|=+%2]\n    Estabilidad del partido: [?HEU_left_party_stability_factor|=+%2]"

 benriya_kivotos_text_tt: "£GFX_benriya_kivotos_texticon §GPartido Estudiantil Federal§!(Union Studentenpartei)"
 benriya_right_text_tt: "£GFX_benriya_right_texticon §1Partido de Derecha§!(Rechtspartei)"
 benriya_centre_text_tt: "£GFX_benriya_centre_texticon §CPartido Radical-Liberal§!(Radikal-Liberal Partei)"
 benriya_left_text_tt: "£GFX_benriya_left_texticon §RPartido Comunista de Luxemburgo§!(Kommunistische Partei Luxemburgs)"

 benriya_kivotos_text_tt_delayed: "£GFX_benriya_kivotos_texticon El §GPartido Estudiantil Federal§! es un partido de derechos civiles pan-kivotos que nació de las innumerables organizaciones de clubes de Gehenna e incorporó inmigrantes venidos de Trinity, Red Winter, Millennium y más. Es una fuerza monárquica que apoya a Rikuhachima Aru como \"la única líder capaz de lograr la armonía entre dos pueblos\". En una situación donde el Consejo Estudiantil General ya no puede proteger de facto los intereses de todos los kivotenses, el Partido Estudiantil Federal afirma que ha heredado el espíritu del Consejo Estudiantil General de Kivotos. Como más de la mitad de sus militantes son de origen Gehenna, el partido tiene una inclinación de social-liberalismo radical heredada del ambiente escolar libre de Gehenna. Dado que, entre los partidos lugareños, prácticamente solo el Partido Estudiantil Federal defiende derechos de mujeres, personas con discapacidad, personas LGBT, y minorías étnicas, la US despierta recelo en la mayoría conservadora luxemburguesa, pero también recibe apoyo de algunos lugareños con inclinaciones liberales."
 benriya_right_text_tt_delayed: "£GFX_benriya_right_texticon El §1Partido de Derecha§! es un partido campesino católico, reaccionario. Creen que la democratización de 1919 fue, en esencia, un error. Por culpa de la democracia —que permitió a los don-nadie abrir la boca— los \"obreros\" que deberían quedarse callados en las minas empezaron a hacer ruido. La vida pastoral y hermosa del siglo XIX, en la que incluso los ignorantes que no sabían leer ni escribir podían vivir sin pensar, quedó enterrada por las acerías y el humo asfixiante de la industrialización. El Partido de Derecha desea que el país se quede en el siglo XIX y, en especial, anhela con fervor que un proyectil de plomo se incruste en la cabeza de Rikuhachima Aru, quien trajo la palabra \"cambio\" a la sociedad luxemburguesa."
 benriya_centre_text_tt_delayed: "£GFX_benriya_centre_texticon El §CPartido Radical-Liberal§! no es particularmente radical ni particularmente liberal, pero es una alternativa atractiva para la clase media urbana que, por error, se cree progresista y prefiere votar por algo distinto del Partido de Derecha con olor a campo. Nacido en 1904 con el nombre de Liga Liberal (Liberale Liga), el partido cambió de nombre repetidas veces mientras los pequeños liberales luxemburgueses se reagrupaban y se fragmentaban. Tras 30 años de vida política, el RLP entendió que, en la política derechizada de Luxemburgo, se sobrevive poniendo la direccional a la izquierda mientras se gira a la derecha; y, hasta antes de la Gran Transición, respaldó las políticas del Partido de Derecha, manteniéndose como un pequeño socio de coalición y desplegando su ideal de \"radical-liberalismo\" al estilo luxemburgués."
 benriya_left_text_tt_delayed: "£GFX_benriya_left_texticon El §RPartido Comunista§! es un partido estalinista de línea dura que cree que, como \"los trabajadores del mundo deben unirse en igualdad\", los trabajadores de Kivotos también deben recibir derechos iguales a los de la humanidad. Aunque fue elegido como socio de la Agencia porque es el único partido que garantiza por línea oficial los derechos de los kivotenses, incluso Aru sabe muy bien que el KPL sueña con atar a las cuatro de la Agencia 68 juntas, en el dormitorio del Palacio Ducal donde la Casa de Nassau fue masacrada, y hacer estallar una \"solución a la Nikolaev\". Por diferencias ideológicas, el KPL y la Agencia 68 se levantan el dedo medio mutuamente, deseando la ruina del otro (lo antes posible), pero, de todos modos, por la gran causa de promover los derechos de los kivotenses, han aplazado temporalmente la \"solución final\" al estilo ruso."

 HEU_abgeordnetenkammer_promotion_kivotos_party: "£GFX_benriya_kivotos_texticon §GPatrocinio de capitalistas kivotenses§!"
 HEU_abgeordnetenkammer_promotion_kivotos_party_desc: "Aunque suene grandilocuente decir \"capitalistas kivotenses\", en realidad es una propuesta para financiar startups y permitir que personal especializado kivotense —con tecnología sobresaliente de un siglo en el futuro— crezca como una nueva fuerza capitalista en Luxemburgo.\n\nEn particular, los ingenieros inmigrantes de origen Millennium, en la vecina región, tienen muchas ideas para producir electrodomésticos \"blancos\" al nivel de Kivotos con solo ajustar \"moderadamente\" las fábricas locales atrasadas. Para que estas empresas kivotenses crezcan, será necesaria una empresa conjunta con capitalistas lugareños que poseen dinero y tierra, por lo que esto podría convertirse en un método para lograr el \"mejoramiento de relaciones entre kivotenses y lugareños\" que sueña Aru."

 HEU_abgeordnetenkammer_promotion_right_party: "£GFX_benriya_right_texticon §1Subsidio directo agrícola§!"
 HEU_abgeordnetenkammer_promotion_right_party_desc: "A diferencia de los capitalistas y la pequeña burguesía de Luxemburgo, que desean que la mayor cantidad posible de campesinos \"quiebren\" cuanto antes para que se muden a empleos industriales y mineros, el Partido de Derecha sostiene que la industria más importante de Luxemburgo es la agricultura, y que debe evitarse el colapso del campesinado pagando un mínimo subsidio de vida a los agricultores mediante un sistema de \"subsidio directo agrícola\".\n\nEl bloque electoral más fuerte del Partido de Derecha son los católicos conservadores, los campesinos y los ganaderos. Mantener una vida \"pastoral\" al estilo del siglo XIX también ayudará enormemente a debilitar al Partido Comunista, que recibe apoyo sobre todo de trabajadores mineros y siderúrgicos."

 HEU_abgeordnetenkammer_promotion_centre_party: "£GFX_benriya_centre_texticon §CPreferencia a la pequeña burguesía§!"
 HEU_abgeordnetenkammer_promotion_centre_party_desc: "Tras el colapso del sistema del franco luxemburgués por la Gran Transición de 1935, quienes más sufrieron fueron los pequeños burgueses (Petit-bourgeois) de Luxemburgo, que perdieron completamente su capital. Desde gerentes de pymes que operaban acerías o minas —la industria clave del país— hasta autónomos, médicos y abogados urbanos, la pequeña burguesía también perdió gran parte de su patrimonio y lucha por reconstruirse.\n\nComo la base electoral del Partido Radical-Liberal proviene principalmente de la pequeña burguesía urbana, debemos implementar políticas para apoyar a gerentes, autónomos, abogados y médicos: la pequeña burguesía que \"perdió su poder\". El apoyo más efectivo es una reducción de impuestos sobre la renta para profesionales y empresarios; otra opción es que un banco estatal ofrezca préstamos a muy bajo interés a pequeños burgueses con cierto capital y cualificación."

 HEU_abgeordnetenkammer_promotion_left_party: "£GFX_benriya_left_texticon §RMovimiento obrero§!"
 HEU_abgeordnetenkammer_promotion_left_party_desc: "Los simpatizantes tradicionales del Partido Comunista de Luxemburgo son los trabajadores mineros y siderúrgicos de la región de Minette, es decir, el sur de Luxemburgo. La zona siderúrgica del sur ha sido llamada históricamente \"la tierra roja\", mostrando un fuerte apoyo al KPL y un fervor revolucionario marxista-leninista.\n\nDesde que el KPL entró en la coalición gobernante, busca ampliar su base mediante conflictos laborales y luchas aún más fuertes entre los trabajadores del acero. Esto se traducirá en vigilar atrasos salariales por parte de capitalistas, inspeccionar condiciones de seguridad laboral, y realizar una lucha colectiva —dirigida por el partido de vanguardia— por más salario y más tiempo de descanso."

 HEU_abgeordnetenkammer_skill_1_kivotos_party: "£GFX_benriya_kivotos_texticon §GApoyo del Partido Estudiantil Federal§!: ¡Festival cultural de Kivotos!"
 HEU_abgeordnetenkammer_skill_1_kivotos_party_desc: "El Partido Estudiantil Federal cree que, difundiendo más activamente la cultura de Kivotos —DJ, rock, anime y similares— los lugareños se irán adaptando gradualmente a esa cultura y terminarán por gustarles los kivotenses. El poder blando siempre ha sido una fuerza poderosa, ¿no?"

 HEU_abgeordnetenkammer_skill_1_right_party: "£GFX_benriya_right_texticon §1Apoyo del Partido de Derecha§!: Lealtad tradicional"
 HEU_abgeordnetenkammer_skill_1_right_party_desc: "Aunque el Partido de Derecha sea un partido gravemente \"decimonónico\" —antidemocrático, antiindustrialización, agrarista—, precisamente por su carácter conservador, cuando se necesita \"patriotismo hacia la patria\", podemos recibir su ayuda."

 HEU_abgeordnetenkammer_skill_1_centre_party: "£GFX_benriya_centre_texticon §CApoyo del Partido Radical-Liberal§!: Reactivación comercial"
 HEU_abgeordnetenkammer_skill_1_centre_party_desc: "El Partido Radical-Liberal, un partido de pequeña burguesía compuesto por autónomos y gerentes de pymes, puede reactivar el comercio luxemburgués e incentivar a nuestra clase media a gastar más dinero."

 HEU_abgeordnetenkammer_skill_1_left_party: "£GFX_benriya_left_texticon §RApoyo del Partido Comunista§!: ¡Lucha patriótica!"
 HEU_abgeordnetenkammer_skill_1_left_party_desc: "Marx dice que los trabajadores del mundo deben unirse, pero el socialismo real no siempre sigue ese ideal dulce. Cuando el Estado está en peligro, los marxistas-leninistas poseen una elocuencia y una capacidad de agitación para empujar a los trabajadores al frente por una patria o una nación que no son inferiores —e incluso pueden igualar— a la de los \"nacionalsocialistas\"."

 HEU_abgeordnetenkammer_random_party:0 "Opinión pública sobre el parlamento"
 HEU_abgeordnetenkammer_random_party_desc:0 "¡Qué bonito sería si la opinión pública siempre se quedara fija! Llenar al 100% la influencia del partido que te gusta con solo pulsar unas opciones y verlo quedarse ahí, inmóvil. No. La realidad no funciona así.\n\nLa opinión pública cambia constantemente con el paso del tiempo, y en ese proceso la influencia de los partidos puede variar."

 ## 추모공원 디시전

 HEU_memorial_park_decision_category: "Construcción del Parque Conmemorativo"
 HEU_memorial_park_decision_category_desc: "La §YGran Transición§! se convirtió en un suceso colosal que cambió para siempre la vida de todos los europeos. §YLuxemburgo§! es el único país que, entre aquellos a los que llegaron kivotenses justo después de la Gran Transición, logró conservar su territorio intacto… pero el precio jamás fue barato. Las estudiantes de Gehenna aceptaron el repentino fenómeno de transferencia dimensional como si fuera una fiesta o un juego, y se pusieron a disparar por la ciudad de Luxemburgo mientras montaban su propia §Rfiesta§!.\n\nHubo más de cientos de muertos, y la Casa Ducal de Nassau fue aniquilada por estudiantes que vinieron a saquear el palacio. Tras formar la gran coalición parlamentaria, Aru llegó a la conclusión de que, si no se disculpaba primero ante la humanidad por aquella trágica catástrofe de la Gran Transición, los lugareños jamás perdonarían a los kivotenses ni los aceptarían como conciudadanos.\n\nSe acordó construir el Parque Conmemorativo en el terreno del §YPalacio de Berg§!, la antigua residencia de verano de la Casa de Nassau. Sin embargo, las estudiantes de Gehenna se burlan: dicen que Aru solo se dedica a lamer las botas de los lugareños para mantener su “grandioso” título §Onobiliario§!. El mote de §R“perro del primer ministro”§! corre abiertamente, y también se escuchan voces de desprecio: afirman que Aru está maquillando como si fuese un gran crimen un simple tiroteo —algo cotidiano en Kivotos—.\n\n§R¿De verdad podremos construir este Parque Conmemorativo?§!\n\n\t[GEH.GetFlag]Ira de la facción de Gehenna: [?HEU_memorial_angry_gehenna|+0]\n [LUX.GetFlag]Apoyo de los lugareños: [?HEU_memorial_support_people|+0]\n"

 HEU_memorial_park_completion: "Parque Conmemorativo completado"
 HEU_memorial_park_completion_desc: "¡Tras obras continuas, el Parque Conmemorativo se ha completado! Aun así, habrá que ver si el pueblo de Luxemburgo quedará satisfecho con este parque."

 HEU_memorial_park_wilhelm_II: "Invitar a Guillermo II"
 HEU_memorial_park_wilhelm_II_desc: "El Partido Comunista de Luxemburgo quiere “invitar” a Guillermo II —quien invadió Luxemburgo durante la Gran Guerra— junto con periodistas, al terreno donde se construye el Parque Conmemorativo, y presionarlo para que recorra el lugar y pronuncie palabras de duelo dirigidas al pueblo luxemburgués. Esto es, por un lado, una burla al viejo invasor convertido en exiliado; y por otro, nace de la hostilidad comunista típica contra los “monarcas feudales”. Pero, sea como sea, este show probablemente entretendrá a la ciudadanía."

 HEU_memorial_park_records_of_nassau: "Propuesta del museo: Los recuerdos de Nassau"
 HEU_memorial_park_records_of_nassau_desc: "Queremos construir dentro del Palacio de Berg un espacio de registros conmemorativos dedicado a la Gran Duquesa Charlotte —la antigua soberana— y a su familia. Los comunistas se enfurecen diciendo que esto “no es duelo, sino alabanza de residuos feudales”, y parece que las estudiantes de Gehenna también se sienten incómodas."

 HEU_memorial_park_records_of_gehenna: "Propuesta del museo: La tragedia de la Gran Transición"
 HEU_memorial_park_records_of_gehenna_desc: "Expondremos dentro del Palacio de Berg entrevistas registradas de supervivientes de la Gran Transición y maquetas de instalaciones destruidas. Es, sin duda, algo necesario… pero se espera la furia de las estudiantes de Gehenna."

 HEU_memorial_park_gardening: "Propuesta del parque: Cuidar los jardines"
 HEU_memorial_park_gardening_desc: "Plantemos diversas flores en el terreno del Parque Conmemorativo que rodea el palacio, para que incluso quienes no se interesan por la tragedia de la Gran Transición puedan visitarlo por ocio."

 HEU_memorial_park_tombstone: "Propuesta del parque: Construcción de una estela conmemorativa"
 HEU_memorial_park_tombstone_desc: "Construiremos en el Parque Conmemorativo una estela con los nombres de todas las personas caídas durante la Gran Transición. Las víctimas nobles, incluida la Casa Ducal, aparecerán con el mismo tamaño de inscripción que la ciudadanía común."

 HEU_memorial_park_tombstone_2: "Propuesta del parque: Estela conmemorativa y memorial aparte para la Casa Ducal"
 HEU_memorial_park_tombstone_2_desc: "Construiremos en el Parque Conmemorativo una estela con los nombres de todas las personas caídas durante la Gran Transición. Por exigencia de nacionalistas monárquicos, las víctimas nobles —incluida la Casa Ducal— serán honradas en un lugar distinto con un monumento separado. El Partido Comunista se enfurecerá al saber que se está privilegiando a las víctimas nobles."

 HEU_memorial_park_promotion: "Propuesta del parque: Promoción de la construcción del Parque Conmemorativo"
 HEU_memorial_park_promotion_desc: "Publicaremos artículos en la prensa para informar con antelación al público de que el Parque Conmemorativo está en construcción. Cuando esté terminado, más personas acudirán a rendir homenaje. A las estudiantes de Gehenna no les gustará esta promoción, pero…"

 HEU_memorial_park_something_KPL: "§REl Partido Comunista está haciendo algo...§!"
 HEU_memorial_park_something_KPL_desc: "El Partido Comunista sospecha que la construcción del Parque Conmemorativo podría ser una conspiración para reagrupar a los monárquicos y hacer que apoyen a Aru como una nueva heredera. No parece que su paranoia vaya a traer buenos resultados."

 HEU_memorial_park_something_gehenna: "§RLa facción de Gehenna está haciendo algo...§!"
 HEU_memorial_park_something_gehenna_desc: "\"En Kivotos los tiroteos eran el pan de cada día… ¿y con eso pretenden insultarnos?\""

 ## Alianzas de Luxemburgo
 HEU_benriya_ally_decision_category: "Buscar aliados para [ROOT.GetName]"
 HEU_benriya_ally_decision_category_desc: "Ya que hemos decidido volvernos hostiles con Gehenna y avanzar hacia el oeste, debemos encontrar aliados adecuados fuera de Gehenna. Según nuestra situación política y diplomática, los países que podremos elegir como aliados variarán."

 HEU_benriya_ally_roma: "Solicitar ingreso a [ITA.GetFactionName]"
 HEU_benriya_ally_roma_desc: "Italia es el candidato a aliado que más prefieren los nacionalistas, incluido el Partido de Derecha. Compartimos un gran punto en común: “la civilización humana frente a Kivotos”, y además es una de las fuerzas militares más prometedoras que aún quedan en Europa. El problema es si ellos nos necesitarán o no."

 HEU_benriya_ally_soviet: "Solicitar ingreso al Komintern"
 HEU_benriya_ally_soviet_desc: "Nadie desconoce que el Partido Comunista de Luxemburgo es estalinista y que desea una alianza con Stalin “con el cuello estirado de ansias”. Aunque exista el “pequeño” problema de que Luxemburgo es una monarquía, el Partido Comunista cree que, si demostramos nuestro valor ante Stalin, podremos lograr cooperación suficiente con los soviéticos."

 HEU_benriya_ally_benelux: "Proponer una unión del Benelux"
 HEU_benriya_ally_benelux_desc: "Bélgica y los Países Bajos han sido aliados históricos con una larga relación con nosotros, y aun después de su exilio tras la Gran Transición, el vínculo no se rompió del todo. No es una alianza poderosa, pero sí la más plausible."

 HEU_benriya_ally_abydos: "Proponer alianza con Abydos"
 HEU_benriya_ally_abydos_desc: "Abydos y nosotros compartimos el mismo principio: ser una fuerza moderada que defiende la “convivencia entre lugareños y kivotenses”. Si reconocemos nuestros puntos en común y cooperamos, podríamos convertirnos en una alianza más fuerte que cualquier otra."

 HEU_benriya_ally_allies: "Proponer ingreso a los Aliados"
 HEU_benriya_ally_allies_desc: "El Gran Ducado de Luxemburgo, como protector de la civilización humana, se unirá a los Aliados para ponerse en la primera línea contra otras naciones académicas de Kivotos. Es una decisión bastante incómoda que no gusta ni a nacionalistas ni a comunistas, pero si no hay alternativas, ingresar a los Aliados puede considerarse como una segunda mejor opción."

 ## Asalto Total: Kaitenger
 HEU_total_assault_kaitenger_decision_category: "Asalto Total - Kaitenger"
 HEU_total_assault_kaitenger_decision_category_desc: "\n\n£GFX_HEU_total_assault_kaitenger\n\n\n\n\n\nLas fechorías de los villanos §RKaitenger§!, que comenzaron con el saqueo del acorazado, ya se han pasado de la raya. Kaitenger declaró a la Agencia 68 —que frustró el saqueo— como §Yenemigos de la justicia§!, e invadió Luxemburgo usando el robot que ellos mismos desarrollaron: el §YKAITEN FX Mk.0§!.\n\nQue si su “romance” o lo que sea, a la Agencia 68 no le importa. Lo que de verdad importa es que son una amenaza para Luxemburgo, y que Kaitenger debe ser arrestado.\n\n§YKAITEN FX Mk.0§! HP [?kaitenger_hp|+0]/256\n"

 HEU_total_assault_aru_EX: "§GAru§! - Serenata Abrasadora"
 HEU_total_assault_aru_EX_desc: "Por su grave discapacidad visual y las secuelas de fracturas múltiples desde la muñeca hasta el hombro, Aru ya no puede usar su antigua arma, Wine Red Admire. Pero aún puede sujetar una pistola con el lado dañado, y si con la mano sana puede lanzar la bolsa de granadas, todavía podrá mostrar algo de la destreza de su mejor época en Kivotos. Y aunque no fuera así… nada cambia el hecho de que las otras tres siguen a su lado."

 HEU_total_assault_mutsuki_EX: "§GMutsuki§! - Disparo Hardboiled"
 HEU_total_assault_mutsuki_EX_desc: "A Mutsuki todavía le resulta extraña el Wine Red Admire, el arma que fue de Aru. Pero si es para proteger a Aru —su amiga más preciada—, Mutsuki luchará en el frente con el arma de Aru sin dudarlo."

 HEU_total_assault_kayoko_EX: "§GKayoko§! - Propuesta interesante"
 HEU_total_assault_kayoko_EX_desc: "¿Las balas de pistola servirán contra un robot gigantesco? Kayoko, en cambio, intentará ayudar a Aru a someter a KAITEN atacando sus puntos débiles."

 HEU_total_assault_haruka_EX: "§GHaruka§! - Disparo Hanetsuki estilo Hardboiled"
 HEU_total_assault_haruka_EX_desc: "Como Aru cambió su estilo de combate de francotiradora a combate cercano por sus discapacidades físicas, necesita a alguien que la cubra de cerca. ¿Quién podría cumplir ese papel si no Haruka?"

 HEU_total_assault_kaiten_EX: "§R¡KAITEN FX Mk.0 está destruyendo la ciudad!§!"
 HEU_total_assault_kaiten_EX_desc: "Si no tumbamos rápido a esos “guerreros de la justicia” desquiciados… ocurrirá un desastre."

 HEU_total_assault_debug_EX: "§GAru§! - 우리아루너무귀엽죠ㅠㅠ"
 HEU_total_assault_debug_EX_desc: "Decisión de depuración para testear la muerte de Kaitenger. Si esta decisión aparece en una partida normal, por favor reporta el bug."

 ## Guerra de reunificación alemana
 HEU_german_reunification_war_decision_category: "Guerra de Integración del Pueblo Germánico"
 HEU_german_reunification_war_decision_category_desc: "El §GGran Ducado de Luxemburgo§! jamás afirmó históricamente ser el §Yestado líder del pueblo germánico§!. Como es natural, Luxemburgo era un país relativamente débil comparado con las grandes potencias vecinas. Por el contrario, en la Gran Guerra de 1914, Luxemburgo vivió la amarga historia de ser ocupado por el ejército de §YGuillermo II§!.\n\nPero ahora, tras la §YGran Transición§!, Alemania se hizo pedazos, y Luxemburgo se ha endurecido gracias a soldados kivotenses; la idea de §Ysometer tanto a Gehenna como a Trinity y unificar al pueblo germánico fragmentado§! ya no es una fantasía irreal.\n\nPor supuesto, el proceso no será fácil… pero esperamos que la gran estrategia de [ROOT.GetLeader] y del alto mando haga valer su fuerza."

 HEU_german_wilhelm_II: "Pedir a Guillermo II que apoye la reunificación"
 HEU_german_wilhelm_II_desc: "El antiguo emperador, que vive exiliado en Luxemburgo, carga con el pecado original de haber invadido y ocupado Luxemburgo durante la Gran Guerra, y por ello teme ser expulsado de su refugio. Por lo tanto, es prácticamente imposible que rechace la petición oficial del gobierno de apoyar la reunificación germánica bajo liderazgo luxemburgués. Como último emperador del Imperio Alemán, su popularidad en Alemania es insignificante, pero existe la posibilidad de que algunos junkers alemanes, siguiendo su apoyo, realicen inversiones de guerra en Luxemburgo."

 HEU_german_war_plan_GEM: "Plan de guerra contra [GEM.GetName]"
 HEU_german_war_plan_GEM_desc: "El general Emil Speller, jefe de la gendarmería y de facto jefe del Estado Mayor del ejército durante la Gran Transición, quien participó personalmente en combates contra estudiantes de Gehenna, está preparando con entusiasmo planes de guerra contra [FROM.GetAdjective] para la guerra de reunificación liderada por Rikuhachima."

 HEU_german_war_plan_GEH: "Plan de guerra contra [GEH.GetName]"
 HEU_german_war_plan_GEH_desc: "El general Emil Speller, jefe de la gendarmería y de facto jefe del Estado Mayor del ejército durante la Gran Transición, quien participó personalmente en combates contra estudiantes de Gehenna, está preparando con entusiasmo planes de guerra contra [FROM.GetAdjective] para la guerra de reunificación liderada por Rikuhachima."

 HEU_german_war_plan_TRM: "Plan de guerra contra [TRM.GetName]"
 HEU_german_war_plan_TRM_desc: "El general Emil Speller, jefe de la gendarmería y de facto jefe del Estado Mayor del ejército durante la Gran Transición, quien participó personalmente en combates contra estudiantes de Gehenna, está preparando con entusiasmo planes de guerra contra [FROM.GetAdjective] para la guerra de reunificación liderada por Rikuhachima."

 HEU_german_negotiations_plan: "Negociaciones de reunificación con [FROM.GetName]"
 HEU_german_negotiations_plan_desc: "Antes que ir a la guerra de inmediato con las facciones lugareñas, es mejor negociar primero para ver si podemos atraerlas a nuestro bando."

 HEU_alliance_with_trinity: "Ataque conjunto a Gehenna con Trinity"
 HEU_alliance_with_trinity_desc: "Hemos firmado un acuerdo con Trinity para atacar a Gehenna por ambos lados; ha llegado el momento de ejecutarlo. El destino de la Agencia 68 está en juego en esta guerra."

 HEU_scavenge_baden: "Obtener armas en [978.GetName]"
 HEU_scavenge_baden_desc: "Podemos obtener armas de la resistencia anti-Gehenna en el corazón de Alemania."

 HEU_scavenge_wurttemberg: "Obtener armas en [50.GetName]"
 HEU_scavenge_wurttemberg_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_nassau: "Obtener armas en [55.GetName]"
 HEU_scavenge_nassau_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_moselland: "Obtener armas en [1087.GetName]"
 HEU_scavenge_moselland_desc: "$HEU_scavenge_baden_desc$"

 HEU_scavenge_hannover: "Obtener armas en [59.GetName]"
 HEU_scavenge_hannover_desc: "$HEU_scavenge_baden_desc$"

 HEU_create_militia_in_luxembourg: "Voluntarios nacionalistas dentro de Luxemburgo"
 HEU_create_militia_in_southwest_gehenna: "Voluntarios nacionalistas germánicos en el suroeste de Gehenna"
 HEU_create_militia_in_souteast_gehenna: "Voluntarios nacionalistas germánicos en el sureste de Gehenna"
 HEU_create_militia_in_northwest_gehenna: "Voluntarios nacionalistas germánicos en el noroeste de Gehenna"
 HEU_create_militia_in_northeast_gehenna: "Voluntarios nacionalistas germánicos en el noreste de Gehenna"
 
 HEU_ideological_loyalty_spirit_plot: "Propaganda ideológica para la integración"
 HEU_ideological_loyalty_spirit_plot_desc: "Asagi Mutsuki ideó un plan de “doble propaganda”: a las estudiantes de Gehenna les vende esta guerra como la aventura de la forajida Aru para conquistar tanto a Gehenna como a Trinity; y a los residentes germánicos les vende esta guerra como una cruzada para unificar al pueblo germánico, fragmentado desde la Gran Transición. Quizá ninguna de las dos sea cien por ciento verdad. Pero si es para convertir a Rikuhachima Aru en la heroína de ambos pueblos, Mutsuki está lista para usar como fichas descartables las vidas de los idiotas que caigan en la propaganda.\n\nAunque Aru no lo quiera."

 HEU_ask_international_for_help: "Pedir ayuda a la comunidad internacional"
 HEU_ask_international_for_help_desc: "La gran estrategia de Aru —aliarse con Trinity para atacar a Gehenna por ambos lados— fracasó al final. Bueno, no sería la primera vez que el “plan genial” de la jefa sale mal. Pero ya que el asunto se desató, alguien tiene que arreglarlo. Onikata Kayoko, ahora que el plan de alianza con Trinity falló, intentará buscar ayuda de otros países como “Plan B”."

 HEU_west_germanic_unity_declaration: "Declaración de liberación permanente de la Germania Occidental"
 HEU_west_germanic_unity_declaration_desc: "¡Como logramos hacer entrar al ejército en el corazón de Pandemonium, ahora podemos declarar con gloria la liberación permanente de la región germánica occidental! Esto será una gran decisión para la victoria de Rikuhachima Aru."

 HEU_german_annex_core_elsass_lothringen_states:0 "Integrar Alsacia-Lorena" 
 HEU_german_annex_core_elsass_lothringen_states_desc:0 "Alsacia-Lorena es un territorio germánico con larga historia y, de forma natural, hasta hoy usa el alemán y mantiene una profunda familiaridad con la cultura germánica. Si el ejército del Ducado avanza hacia Alsacia-Lorena, nos aceptarán como miembros de la misma comunidad nacional."

 HEU_german_annex_core_holstein_states:0 "Integrar Schleswig-Holstein" 
 HEU_german_annex_core_holstein_states_desc:0 "Schleswig-Holstein, territorio germánico, debe integrarse por supuesto en la Federación Unificada Germánica."

 HEU_german_annex_core_danzig_states:0 "Integrar Danzig" 
 HEU_german_annex_core_danzig_states_desc:0 "Danzig, territorio germánico, debe integrarse por supuesto en la Federación Unificada Germánica."

 HEU_german_annex_core_austria:0 "Incorporar Austria como estado federado" 
 HEU_german_annex_core_austria_desc:0 "El Ducado Federal Germánico es, en esencia, un plan de reunificación “Pequeña Alemania” bajo liderazgo del Gran Ducado de Luxemburgo. Pero, de forma desconcertante, debido a cambios en la situación internacional, terminamos ocupando Austria y formamos una “Gran Alemania” no deseada. ¿Qué haremos si la población de esa región insiste en que ellos también son pueblo germánico y exige derechos como estado federado en igualdad? No podemos cambiar el nombre del país otra vez a estas alturas."

 HEU_german_annex_core_sudetenland:0 "Incorporar los Sudetes como estado federado" 
 HEU_german_annex_core_sudetenland_desc:0 "El Ducado Federal Germánico es, en esencia, un plan de reunificación “Pequeña Alemania” bajo liderazgo del Gran Ducado de Luxemburgo. Pero, de forma desconcertante, debido a cambios en la situación internacional, terminamos ocupando los Sudetes y formamos una “Gran Alemania” no deseada. ¿Qué haremos si la población de esa región insiste en que ellos también son pueblo germánico y exige derechos como estado federado en igualdad? No podemos cambiar el nombre del país otra vez a estas alturas."

 ## Rikuhachima Aru vs Damian Kretzenberg
 HEU_aru_internet_overdose_decision_category:0 "Traviesa £GFX_BA_star Straight"
 HEU_aru_internet_overdose_decision_category_desc:0 "\n\n\n\n\n£GFX_HEU_idol_aru_daisuki\n\n\n\n\n\n\n\n\nLa misteriosa streamer virtual §YNanami Ayaka§! dice ser una chica de la §GAcademia Integral Trinity§!. Desde el inicio de la Revolución del 68, usando comunidades de redes sociales, ha criticado la §YRevolución del 68§! de Aru como si no fuera más que violencia estatal al estilo de una §Rrevolución bolchevique§!; y desde que Aru se autoproclamó §YPresidenta del Consejo Estudiantil General de Kivotos§!, debutó como streamer virtual y ha continuado sus transmisiones políticas y críticas al gobierno.\n\nEl problema es que, a medida que su streaming gana popularidad, se está volviendo la §Cprimera estrella de la contrarrevolución§!. Desde su debut, aprovecha con fuerza las transmisiones por internet para afirmar que §Ylos kivotenses, como agresores, no pueden imponer su moral a los lugareños§!, y su discurso está incitando no solo a muchos lugareños, sino también a ciertos kivotenses que no simpatizan con Aru.\n\n…Al final, para enfrentar a la §Ccontrarrevolución§!, Aru también debe salir a luchar por la §Prevolución§!. El canal estatal de streaming de Aru, §PTraviesa £GFX_BA_star Straight§!, abrió sus puertas para resistir a Nanami Ayaka. Revolución y contrarrevolución: el vencedor lo decidirá el pueblo.\n"

 HEU_idol_ayaka_nanami_tt: "Actividad intensificada: [?benriya_keystones]"

 HEU_aru_internet_overdose_keystone:0 "Piedras de acción actuales: £GFX_benriya_keystone_texticon [?benriya_keystones]"

 HEU_idol_ayaka_nanami_text_tt: "§YNanami Ayaka§!"
 HEU_idol_ayaka_nanami_text_tt_delayed: "[HEU_ayaka_nanami_desc_text]"
 HEU_ayaka_nanami_desc_0: "Los únicos que saben que la identidad de la autoproclamada streamer virtual §YNanami Ayaka§! es en realidad el disidente nacionalsocialista de Luxemburgo, §YDamian Kretzenberg§!, son el propio Kretzenberg y la IA Arona. Gracias a que durante los últimos años ocultó su identidad a la perfección y se fabricó una personalidad falsa a través de redes sociales, nadie sospecha que Nanami Ayaka sea Kretzenberg. Claro, también ayuda bastante el programa perfecto de cambio de voz y el modelado 2D, hechos con el apoyo de Arona.\n\n¿Qué es lo que mueve ahora a Damian Kretzenberg? ¿Será por su esposa, que aquel mismo día de la §YGran Transición§! salió a buscarlo por las calles y terminó abatida? ¿O será por el PTSD de aquella jornada, cuando se acurrucó en un salón con sus alumnos, temblando de miedo, deseando que ni las estudiantes ni las chicas de Gehenna los encontraran? ¿O quizá porque le enfurece la arrogancia de Rikuhachima Aru, que pretende reemplazar la cultura humana §Y“vulgar”§! por la cultura kivotense §Y“superior”§!? Ni el propio Kretzenberg sería capaz de señalar una sola razón. Probablemente las tres influyeron.\n\nPara evitar la persecución de la Agencia 68, Kretzenberg vive actualmente en la cámara de artesanía (Craft Chamber) bajo el sótano del edificio de Schale, reducido a ruinas, y cada noche transmite por internet desde el atardecer hasta la madrugada. Arona teme que la pasión con la que Kretzenberg transmite termine dañando su salud, pero a Kretzenberg no le importa. Cambiar el mundo en una dirección que Rikuhachima Aru §Rno desea§!. Para lograr ese objetivo, puede soportar cierto grado de exceso."

 HEU_ayaka_nanami_desc_1: "Los únicos que saben que la identidad de la autoproclamada streamer virtual §YNanami Ayaka§! es en realidad el disidente nacionalsocialista de Luxemburgo, §YDamian Kretzenberg§!, son el propio Kretzenberg y la IA Arona. Gracias a que durante los últimos años ocultó su identidad a la perfección y se fabricó una personalidad falsa a través de redes sociales, nadie sospecha que Nanami Ayaka sea Kretzenberg. Y, además, con el modelado 3D impecable que Arona le hizo, el directo se volvió todavía más vistoso.\n\n¿Qué es lo que mueve ahora a Damian Kretzenberg? ¿Será por su esposa, que aquel mismo día de la §YGran Transición§! salió a buscarlo por las calles y terminó abatida? ¿O será por el PTSD de aquella jornada, cuando se acurrucó en un salón con sus alumnos, temblando de miedo, deseando que ni las estudiantes ni las chicas de Gehenna los encontraran? ¿O quizá porque le enfurece la arrogancia de Rikuhachima Aru, que pretende reemplazar la cultura humana §Y“vulgar”§! por la cultura kivotense §Y“superior”§!? Ni el propio Kretzenberg sería capaz de señalar una sola razón. Probablemente las tres influyeron.\n\nKretzenberg, para evitar la persecución de la Agencia 68, vive actualmente en la cámara de artesanía bajo el sótano del edificio de Schale, reducido a ruinas, y transmite por internet cada noche hasta tarde. Su programa va ganando popularidad sin parar, pero él también se está agotando poco a poco. Para sobrellevar la muerte de su esposa, el PTSD de la Gran Transición y todo lo demás, Kretzenberg se emborracha cada noche hasta altas horas, bebiendo todo tipo de alcohol. Arona, aunque le toma distancia llamándolo “profe nazi”, en el fondo desea que reduzca poco a poco la bebida."

 HEU_ayaka_nanami_desc_2: "Los únicos que saben que la identidad de la autoproclamada streamer virtual §YNanami Ayaka§! es en realidad el disidente nacionalsocialista de Luxemburgo, §YDamian Kretzenberg§!, son el propio Kretzenberg y la IA Arona. Gracias a que durante los últimos años ocultó su identidad a la perfección y se fabricó una personalidad falsa a través de redes sociales, nadie sospecha que Nanami Ayaka sea Kretzenberg. El modelado 3D perfecto que Arona le hizo también contribuye a que el directo sea más vistoso.\n\n¿Qué es lo que mueve ahora a Damian Kretzenberg? ¿Será por su esposa, que aquel mismo día de la §YGran Transición§! salió a buscarlo por las calles y terminó abatida? ¿O será por el PTSD de aquella jornada, cuando se acurrucó en un salón con sus alumnos, temblando de miedo, deseando que ni las estudiantes ni las chicas de Gehenna los encontraran? ¿O quizá porque le enfurece la arrogancia de Rikuhachima Aru, que pretende reemplazar la cultura humana §Y“vulgar”§! por la cultura kivotense §Y“superior”§!? Ni el propio Kretzenberg sería capaz de señalar una sola razón. Probablemente las tres influyeron.\n\nLa popularidad del streaming de Kretzenberg no deja de subir, pero el diagnóstico reciente de cáncer de hígado está empujando su cuerpo con firmeza hacia la muerte. Sanar las heridas que dejó la Gran Transición en esta tierra y proteger a los estudiantes que vivirán el futuro. Crear un mundo donde los estudiantes puedan convertirse en §Yaquello que quieran ser§!, y no en una vida impuesta por el §GComité Revolucionario§!. Solo ahora, con la muerte acercándose, Kretzenberg empieza a pensar en el futuro de toda la humanidad por encima del nacionalsocialismo y del racismo. …¿No es acaso que, al menos en el deseo de hacer del mundo un lugar mejor, Kretzenberg y Aru compartían el mismo corazón?"

 HEU_ayaka_nanami_desc_3: "Hubo un tiempo en que §YNanami Ayaka§! se llamaba Damian Kretzenberg. No… en realidad, Nanami Ayaka es otra persona que heredó todos los recuerdos de Damian Kretzenberg. El “original”, el Kretzenberg que terminó muriendo, no regresará.\n\nEntonces, ¿qué mueve ahora a Nanami Ayaka? Las últimas palabras que Kretzenberg dejó, en el instante en que agonizaba por el cáncer de hígado: §Y“Por favor, cuida de mis estudiantes.”§! Nanami Ayaka sabe que, si estuviera en la misma situación, ella también habría dicho eso a quien viniera después. A estas alturas, ya no importa “clavar” a Aru ni el maldito nacionalsocialismo. Al menos, a su lado está Arona. Y quedan los recuerdos con los estudiantes que, en otro tiempo, confiaron en el “yo” del pasado y lo siguieron. Lucha por esos recuerdos, y lucha para protegerlos.\n\nNanami Ayaka decidió cargar con el peso de Damian Kretzenberg. No importa que sea alguien distinto que solo heredó sus recuerdos. Porque eso es lo que hace un profesor: §Yproteger a los estudiantes§! y §Yguiarlos para que puedan convertirse en aquello que quieren ser§!. Eso no ha cambiado, ni siquiera ahora que el cuerpo cambió y Kretzenberg ya no es Kretzenberg."

 HEU_aru_internet_overdose_collecting_keystone:0 "El rival está reuniendo £GFX_benriya_keystone_texticon §Ypiedras de acción§!..."
 HEU_aru_internet_overdose_collecting_keystone_desc:0 "\"Damian-sensei no es un *verdadero* sensei de Kivotos… así que no puede crear piedras de acción ni usar la tarjeta de adulto. ¡Pero quedan piedras de acción que dejó el anterior presidente del Consejo Estudiantil General! Ya sea en el basurero alrededor de Schale o incluso en edificios abandonados del Consejo… como sea, tienes que reunirlas. Para poder usar bien la cámara de artesanía, necesitamos suficientes piedras de acción.\""

 HEU_aru_internet_overdose_the_last_time:0 "§REl final de la historia§!"
 HEU_aru_internet_overdose_the_last_time_desc:0 "Las transmisiones de Nanami Ayaka siguen ganando reconocimiento. La confrontación entre la revolución soñada por la Agencia y la contrarrevolución que se le opone se vuelve cada vez más intensa. No tenemos tiempo infinito. …Si queremos enfrentar un auténtico “final feliz”, debemos aplastar la amenaza de la humanidad lo antes posible."

 HEU_aru_internet_overdose_the_last_time_tt: "Completa el enfoque final después de salvar a Kivotos y a la humanidad destruyendo la amenaza humana antes de que se acabe este §Ylímite de tiempo§!. Que el tiempo se agote no significa §RGame Over§!, pero §Yel contenido del final§! que les espera a la Agencia y a Rikuhachima Aru §Yserá distinto§!. ¡Buena suerte!\n\nY… ¡nunca te rindas!"

 ## Ruta de Mutsuki: Decisiones
 HEU_mutsuki_aru_mental_trauma_decision_category: "Estado de salud mental de Aru"

 aru_mental_trauma_local: "Tras el éxito del golpe, §YAru§! fue encerrada en una casa segura. §YMutsuki§! intenta protegerla de toda presencia externa que pueda considerarse una amenaza. Claro que Aru, en el fondo, no desea demasiado esta cálida “protección”. En una casa segura cuya ubicación exacta nadie conoce… comenzó la vacación interminable de Aru.\n\nAunque Mutsuki le provee todo lo que Aru pudiera querer dentro de esa casa, se niega a entregarle lo único que Aru realmente desea: la “libertad”. Durante el encierro, Aru puede seguir el paso del tiempo exterior leyendo periódicos censurados.\n\nCómo cambie la relación entre Mutsuki y Aru dependerá del estado mental de Aru. Si su límite psicológico se rompe, la relación entre ambas §Rno irá por un buen camino§!.\n\n§YInformación§!: Puedes verificar el estado de salud mental de Aru pasando el cursor sobre el marco."

 HEU_aru_mental_trauma_timelimit: "Empeora la salud mental de Aru"
 HEU_aru_mental_trauma_timelimit_desc: "Mientras más se prolongue el confinamiento de Rikuhachima Aru, más grave se volverá el deterioro de su salud mental.\n\n§R¡Sonríe!§!"

 HEU_aru_mental_trauma_care_1: "Enviar a Haruka"
 HEU_aru_mental_trauma_care_1_desc: "Mutsuki no quiere que Aru esté encerrada para siempre. Si la encerró, fue solo para protegerla. Mutsuki planea liberarla después de convertirla en una heroína venerada por todos, tanto lugareños como kivotenses. Pero hasta que llegue ese día heroico, Aru necesita estímulos. Hoy, Haruka pasará tiempo con Aru y aliviará su aburrimiento." # Carisma

 HEU_aru_mental_trauma_care_2: "Enviar un nuevo entretenimiento"
 HEU_aru_mental_trauma_care_2_desc: "Ya sea una consola o herramientas deportivas para ejercitarse sola, le damos a Aru un nuevo estímulo. Seguro que se divertirá." # Determinación
  
 HEU_aru_mental_trauma_care_3: "Enviar a Kayoko"
 HEU_aru_mental_trauma_care_3_desc: "Por un día, envían a Kayoko —que está encarcelada— para que juegue con Aru. Bueno, tal vez hablen incluso de un plan de escape. Pero, a estas alturas… ¿cómo podría salir bien?" # Sabiduría
 
 HEU_aru_mental_trauma_care_4: "Té con los guardias"
 HEU_aru_mental_trauma_care_4_desc: "Los vigilantes de Aru no son robots, sino soldados vivos de la facción de Gehenna. A ellas tampoco les disgusta pasar un día con Aru, la heroína de Luxemburgo, y charlar un rato." # Amabilidad

 HEU_aru_mental_trauma_EX: "Motivación para vivir el mañana"
 HEU_aru_mental_trauma_EX_desc: "Esto solo surtirá efecto una vez, pero mediante una rabia abrumadora se puede obtener la fuerza para superar la desesperación a corto plazo."

 HEU_mutsuki_aru_mental_trauma_decision_debug_add_10: "Depuración: Deterioro mental de Aru +10%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_add_100: "Depuración: Deterioro mental de Aru +100%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_sub_10: "Depuración: Deterioro mental de Aru -10%"
 HEU_mutsuki_aru_mental_trauma_decision_debug_sub_100: "Depuración: Deterioro mental de Aru -100%"

 ## Agencia 68: Viaje de negocios al extranjero
 HEU_benriya_68_overseas_business_decision_category: "Tareas de [HEU.GetNameDef]"
 HEU_benriya_68_overseas_business_decision_category_desc: "Tras la §YGran Transición§!, el §YGran Ducado de Luxemburgo§! adquirió una posición doble: sigue siendo un §Yestado humano local§!, pero también se volvió un §Yestado de origen kivotense§!. Luxemburgo aún tiene a su primer ministro luxemburgués y al parlamento luxemburgués, pero el monarca al que sirven es la kivotense Rikuhachima Aru. Rikuhachima Aru posee una fuerza privada separada del ejército luxemburgués: la §YAgencia 68§!, y pretende enviar a parte de sus miembros al extranjero para que participen en tareas industriales. Si invertimos el presupuesto adecuado, podremos sumar a nuestra industria la tecnología avanzada de Kivotos."

 ## Gobierno de Mutsuki: Decisiones
 HEU_mutsuki_government_decision_category: "Políticas del Gabinete de la Pequeña Diablilla"
 HEU_mutsuki_government_decision_category_desc: "\n\n\n\n\n\n\nA diferencia de §YRikuhachima Aru§!, que tenía sueños idealistas, Asagi Mutsuki no posee ninguna orientación clara para el rumbo del Estado. El único objetivo del gobierno de Mutsuki es convertir a Aru en una heroína. Por eso, el nuevo gobierno no tiene una filosofía de Estado ni una línea política firmemente establecida.\n\nClaro que, aunque no podamos encasillar su gobierno en el marco de liberalismo vs. autoritarismo, eso no significa que Asagi Mutsuki no aplique políticas. Si tuviéramos que resumir el gobierno de Mutsuki en una frase, sería un §Ygobierno de pequeña diablilla§!. En lugar de decidir con visión de largo plazo, Mutsuki actúa según metas de corto plazo, y determina políticas de forma impulsiva, impredecible y guiada por una dirección subjetiva.\n\nEsto ya era parte de su carácter incluso antes de la Gran Transición, pero últimamente su estado mental se ha vuelto inestable y su naturaleza de §Ypequeña diablilla§! se ha intensificado.\n"

 HEU_mutsuki_government_trinity: "§YDirección política§!: Reclamar ser Host de Trinity"
 HEU_mutsuki_government_trinity_desc: "La idea de que Asagi Mutsuki sea de la facción de Gehenna no puede comprobarse realmente. No tiene alas demoníacas ni cuernos; de hecho, no posee ningún rasgo físico que la haga verse como alguien de Gehenna. Como una travesura para agitar el tablero, Mutsuki puede afirmar: “Antes de la Gran Transición, yo era una agente enviada desde Trinity”. Es una afirmación poco razonable, y será extremadamente impopular entre la mayoría de la población kivotense en Luxemburgo, que es en su gran mayoría de Gehenna. Pero… ¿cuándo actuó Mutsuki con base en la razón y la lógica?"

 HEU_mutsuki_government_gehenna: "§YDirección política§!: Reclamar ser la “Cerebro-Emperatriz” de Gehenna"
 HEU_mutsuki_government_gehenna_desc: "Todo el mundo lo sabe: Mutsuki no tiene ninguna relación con la “Cerebro-Emperatriz”. Afirmar que ella es la antigua Cerebro-Emperatriz expulsada por Hanuma Makoto no solo es absurdo, sino que tampoco trae ningún beneficio. Pero… ¿no es divertido?"

 HEU_mutsuki_government_little_demon: "§YDirección política§!: Liberalismo de pequeña diablilla"
 HEU_mutsuki_government_little_demon_desc: "Apoya el ambiente cultural libre de Gehenna. En términos concretos: recortar drásticamente la fuerza policial e interferir menos en la vida de cada quien. Kivotos era así antes de la Gran Transición… y no pasaba gran cosa, ¿no?"

 HEU_mutsuki_government_shogun_asagi: "§YDirección política§!: Shōgun Asagi"
 HEU_mutsuki_government_shogun_asagi_desc: "Suprime el desorden de Gehenna y expande drásticamente la policía para que la ciudadanía permanezca bajo una disciplina firme. El gran motor de Mutsuki es la “heroificación” de Aru, y Mutsuki recuerda bien que Aru se convirtió en heroína por detener la masacre del §Ycrimen de la Gran Transición§!. Actuar por la persona más preciada… es algo que no encaja con la personalidad de Mutsuki, pero a la vez es muy propio de ella. No es divertido, pero si se trata de la Aru heroica, ella habría hecho eso."

 HEU_mutsuki_propaganda_trinity_united: "§CPropaganda§!: ¡Hacia la unificación de Trinity!"
 HEU_mutsuki_propaganda_trinity_united_desc: "La host actual de Trinity es una farsante. La host “verdadera” está aquí. Habrá muchos que no lo crean, pero quienes detestan al gobierno actual de Trinity apoyarán a Asagi Mutsuki como alternativa. Al menos, Mutsuki es una host mucho más predecible que el bando de [TRM.GetLeader]."

 HEU_mutsuki_propaganda_trinity_pound_hurrah: "§CPropaganda§!: ¡Viva el sistema imperial!"
 HEU_mutsuki_propaganda_trinity_pound_hurrah_desc: "El sistema métrico es una maldición detestable de Gehenna. Las elegantes damas de Trinity calculan todo con el superior sistema de yardas, libras y grados Fahrenheit."

 HEU_mutsuki_propaganda_generic_1: "§CPropaganda§!: Por la unificación del pueblo germánico"
 HEU_mutsuki_propaganda_generic_1_desc: "Independientemente del odio de Mutsuki hacia los lugareños, no podemos ignorar que nuestro ejército está compuesto mayoritariamente por humanos locales. La reunificación germánica será el mejor material para propaganda."

 HEU_mutsuki_propaganda_generic_2: "§CPropaganda§!: Enfatizar el neokivotosismo"
 HEU_mutsuki_propaganda_generic_2_desc: "¡Debemos luchar incluso para recuperar aquella vida pacífica que teníamos en Kivotos! ¿Contra qué? Por supuesto, contra los autoritarios internos y los imperialistas externos. Lanzamos el movimiento de “Recuperemos Kivotos” dirigido a la población kivotense dentro de Luxemburgo. Es radical en el sentido de enfatizar un espíritu liberal que a los lugareños les parecerá extremo, y es reaccionario en el sentido de enfatizar “la hermosa vida del pasado”."

 HEU_mutsuki_propaganda_generic_3: "§CPropaganda§!: No trabajes; disfruta la fiesta"
 HEU_mutsuki_propaganda_generic_3_desc: "Dejemos el exceso de trabajo y disfrutemos este momento, esta paz."

 HEU_mutsuki_propaganda_gehenna_freedom_culture: "§CPropaganda§!: Cultura artística libre"
 HEU_mutsuki_propaganda_gehenna_freedom_culture_desc: "Apoyamos diversas culturas populares basadas en la libertad cultural de Gehenna. Despliega tu individualidad en Luxemburgo."

 HEU_mutsuki_propaganda_gehenna_united: "§CPropaganda§!: Por la unificación de Gehenna"
 HEU_mutsuki_propaganda_gehenna_united_desc: "Ni la Pandemonium Society ni el Comité de Moral son organizaciones decentes. Bajo la verdadera líder, Asagi Mutsuki, Gehenna caminará por fin por el camino correcto."

 ## División de Luxemburgo: Decisiones
 HEU_division_of_luxembourg_decision_category: "División de Luxemburgo"
 HEU_division_of_luxembourg_decision_category_desc: "Luxemburgo se ha dividido en dos. Un nuevo gobierno leal a §YAsagi Mutsuki§! y la facción de Onikata Kayoko, que no reconoce al gobierno de Mutsuki. Por un movimiento racional para evitar repetir la tragedia de 1935 en la ciudad de Luxemburgo, esta división no ha escalado a una guerra civil y se mantiene en un nivel de confrontación militar… pero es evidente que terminará cuando uno de los bandos ataque al otro.\n\nEl gobierno de Mutsuki predice que tendrá §Yaprox. 1 año§! para prepararse. Se espera que ese plazo sea el límite en el que la facción de Kayoko agotará la mayor parte de sus recursos alimentarios, y se verá forzada a dejar la guerrilla en los bosques y salir al campo de batalla para enfrentarse a Mutsuki.\n\nDurante este periodo, el gobierno de Mutsuki debe prepararse al máximo. Lo ideal sería que Kayoko, al entender que no tiene posibilidades, se rinda para reducir daños. Pero si no lo hace, §Rlas pérdidas se volverán incontrolables§!.\n\n£GFX_BA_game_rule_flag_LUX -Plan de Kayoko: [?HEU_faction_angry_kayoko|+0]\n£GFX_BA_game_rule_flag_HEU -Preparativos de Mutsuki: [?HEU_faction_angry_mutsuki|+0]\n"

 HEU_division_of_luxembourg_deadline: "Fecha límite"
 HEU_division_of_luxembourg_deadline_desc: "Se prevé que este sea el día en que Kayoko y la resistencia luxemburguesa, tras chocar con el límite de alimentos y munición, opten por un enfrentamiento total contra el gabinete de Mutsuki. La resistencia —cuyo único soldado con Halo es la propia Kayoko— no tiene ninguna posibilidad real de victoria, pero Kayoko se retorcerá hasta el final para intentar cambiar el resultado."

 HEU_division_wilhelm_II: "Enviar a Guillermo II"
 HEU_division_wilhelm_II_desc: "Ordenamos a Guillermo II que, con la “dignidad imperial”, exija a los rebeldes que se rindan. Guillermo se entusiasmará pensando que el gobierno luxemburgués reconoce su carisma autoritario, y creerá que podrá persuadir a Kayoko de un solo golpe.\n\n¿Que si va a funcionar? Yo pondría mi voto en que no."

 HEU_division_preparation_of_suppression_weapons: "Reglas de enfrentamiento: armas no letales estrictas"
 HEU_division_preparation_of_suppression_weapons_desc: "Los soldados kivotenses creen que, si la tragedia de 1935 se repite, su posición en Luxemburgo caerá en picada sin fin. Mutsuki teme qué ojos pondrá Aru sobre ella si ese desastre vuelve a ocurrir. Estas reglas de enfrentamiento ordenan que a la infantería con Halo que combate a los rebeldes solo se le provean balas de goma no letales, y que no se use munición real bajo ninguna circunstancia contra la insurgencia. Por supuesto, esto expondrá más a nuestra infantería con Halo al fuego enemigo, pero… en general, un soldado kivotense no morirá ante la resistencia de no-kivotenses. Aguanten con el cuerpo."

 HEU_division_active_surrender: "Reglas de enfrentamiento: aceptación activa de rendición"
 HEU_division_active_surrender_desc: "Antes de cualquier combate, se preguntará en voz alta tres veces la intención de rendirse. Solo si el enemigo no se rinde tras tres requerimientos se permitirá disparar. Esto no ayudará a la operación… pero sí, podría inducir a que una parte de los rebeldes se entregue."

 HEU_division_trenches: "Limpieza de rebeldes: plan de trincheras"
 HEU_division_trenches_desc: "Cavemos trincheras sin ton ni son cerca de los bosques del norte, donde se sabe que los rebeldes están apostados, para impedir que bajen."

 HEU_division_peasant: "Limpieza de rebeldes: reubicación temporal de campesinos"
 HEU_division_peasant_desc: "El gobierno de Mutsuki quiere ganar “sin pelear” en la medida de lo posible. Debemos minimizar más derramamiento de sangre. Para ello, es crucial acelerar la escasez de alimentos del enemigo y empujar la situación hacia la rendición. Reubicamos (temporalmente) a todos los campesinos de las zonas cercanas a los campamentos rebeldes para cortar sus vías de abastecimiento y acelerar la hambruna."

 HEU_division_peasant_2: "Limpieza de rebeldes: subsidio por reubicación temporal de campesinos"
 HEU_division_peasant_2_desc: "El gobierno de Mutsuki quiere ganar “sin pelear” en la medida de lo posible. Debemos minimizar más derramamiento de sangre. Para ello, es crucial acelerar la escasez de alimentos del enemigo y empujar la situación hacia la rendición. Reubicamos (temporalmente) a todos los campesinos de las zonas cercanas a los campamentos rebeldes para cortar sus vías de abastecimiento y acelerar la hambruna.\n\nEsta política no es una simple “reubicación forzada”: se entregará una compensación razonable a los campesinos para que retiren su resentimiento contra el gobierno de Mutsuki."

 HEU_division_promotion: "Limpieza de rebeldes: lanzar propaganda de rendición"
 HEU_division_promotion_desc: "Carguemos aviones ligeros con propaganda para presionar la rendición y arrojémosla masivamente desde el cielo."

 HEU_division_something_kayoko: "§RKayoko está haciendo algo...§!"
 HEU_division_something_kayoko_desc: "Onikata Kayoko sabe que no puede ganar, pero eso no significa que vaya a quedarse de brazos cruzados."
 ## Descolonización de Luxemburgo
 benriya_decolonisation_decision_category: "Gestión de nuevos territorios bajo el liderazgo de [ROOT.GetNameDef]"
 benriya_decolonisation_decision_category_desc: "[benriya_decolonisation_decision_category_desc_text]"

 benriya_decolonisation_decision_category_desc_alpha: "El gobierno de [ROOT.GetNameDef] ha obtenido más territorios que antes mediante guerras de liberación para difundir una cultura liberal. Sin embargo, debido al carácter pacifista de [ROOT.GetLeader], administrar estos nuevos territorios se ha vuelto una situación difícil.\n\nPodemos ofrecerles una libertad misericordiosa y construir §Yterritorios en fideicomiso (mandatos)§! administrados por [ROOT.GetNamedef]. Esto demostraría que no hemos venido a enemistarnos con los lugareños, sino a protegerlos. En las nuevas zonas ocupadas se instalarán organismos civiles en cooperación con la §YLiga de las Naciones§!, y, bajo el gobierno benevolente de [ROOT.GetLeader], podrán preparar lentamente, durante décadas, un nuevo gobierno democrático que algún día se construirá."

 benriya_decolonisation_decision_category_desc_beta: "El gobierno de [ROOT.GetNameDef] está expandiendo su territorio a una escala que excede lo que podemos sostener, y estas regiones son nuevos territorios que [ROOT.GetLeader] no pretendía adquirir. La oposición local luxemburguesa teme que nuestra postura expansionista no sea, en el fondo, una forma de “conquista de la humanidad por parte de los kivotenses”, y el Partido Comunista de Luxemburgo, que se opone a la monarquía, exige liberar nuestras zonas ocupadas como §Ymandatos de la Liga de las Naciones§! “para contener el impulso imperialista”. Asimismo, el Partido Radical-Liberal, de orientación monárquica, también lo demanda “para evitar un despilfarro excesivo del poder nacional”.\n\nPor supuesto, la decisión final sobre la expansión territorial recae en [ROOT.GetLeader], y también es un factor que estos territorios se obtuvieron no por un proceso pacífico, sino tras una guerra.\n\nLiberar las zonas ocupadas como mandatos con la mediación de la Liga de las Naciones puede mostrar que no somos simples invasores kivotenses, sino que tenemos voluntad de coexistir con la humanidad; aun así, sin duda generará controversia entre la población kivotense."

 benriya_decolonisation_decision_LP1: "Establecer [LP1.GetNameDef]"
 benriya_decolonisation_decision_LP1_desc: "Esa región es muy distinta a las demás, y Francia es muy distinta también. Allí vive mucha gente francesa, pero al mismo tiempo es una zona que, tras la Gran Transición, ha pasado por un proceso de “mileniumización”. No podemos arrebatarles París a los franceses, ni podemos arrebatarles el campus de Millennium a los milenium. Bajo la mediación de la Liga de las Naciones, el gobierno federal del mandato que se establecerá deberá lograr una armonía pacífica entre kivotenses y humanos. …O eso esperamos."
 benriya_decolonisation_decision_LP2: "Establecer [LP2.GetNameDef]"
 benriya_decolonisation_decision_LP4: "Establecer [LP4.GetNameDef]"
 benriya_decolonisation_decision_LP5: "Establecer [LP5.GetNameDef]"
 benriya_decolonisation_decision_LP6: "Establecer [LP6.GetNameDef]"
 benriya_decolonisation_decision_LP7: "Establecer [LP7.GetNameDef]"

 benriya_return_belgium: "Regreso del gobierno belga"
 benriya_return_belgium_desc: "¡Que la amistad entre Luxemburgo y Bélgica sea eterna! Hemos liberado a Bélgica de los invasores kivotenses y podemos devolverla a sus legítimos dueños. A cambio, deberán abandonar su antigua alianza y unirse al bando de [ROOT.GetLeader]."

 benriya_local_leader_decision_LP1: "Nombrar líder de [LP1.GetNameDef]"
 benriya_local_leader_decision_LP2: "Nombrar líder de [LP2.GetNameDef]"
 benriya_local_leader_decision_LP3: "Nombrar líder de [LP3.GetNameDef]"
 benriya_local_leader_decision_LP4: "Nombrar líder de [LP4.GetNameDef]"
 benriya_local_leader_decision_LP5: "Nombrar líder de [LP5.GetNameDef]"
 benriya_local_leader_decision_LP6: "Nombrar líder de [LP6.GetNameDef]"
 benriya_local_leader_decision_LP7: "Nombrar líder de [LP7.GetNameDef]"

 benriya_return_brittany: "Devolver [LP1.GetName] de Bretaña"
 benriya_return_polar: "Devolver [LP5.GetName] de la península de Kola"
 benriya_return_mordovia: "Devolver [LP5.GetName] de Mordovia"

 benriya_local_law_decision_LPX: "Implantar la Revolución 68 en la región de [FROM.GetNameDef]"
 benriya_local_law_decision_LPX_desc: "Nuestro liberalismo debe extenderse más lejos y a mayor escala. La Liga de las Naciones también apoyará nuestros ideales."

 benriya_elimination_of_stalingrad: "De Stalingrado a Volgogrado"
 benriya_elimination_of_leningrad: "De Leningrado a San Petersburgo"

 ## Decisiones del Ducado Unido
 HEU_united_germanic_duchy_decision_category: "La realización de la Ley de Unión"
 HEU_united_germanic_duchy_decision_category_desc: "Con la proclamación de la §YLey de Unión§!, por la cual Trinity, Gehenna y Luxemburgo se unifican como una federación, §YRikuhachima Aru§! se convirtió en la heroína de las tres naciones. Claro… aunque por un momento olvidemos el pequeño detalle de que Aru no tenía ningún plan para la Ley de Unión y jamás hizo nada para materializarla.\n\nTras la guerra de unificación impulsada por Asagi Mutsuki, tenemos la obligación de asegurar que la Ley de Unión no quede como propaganda vacía, sino como una ley con significado real. Esa es la manera en que el gobierno de [ROOT.GetLeader] puede dejar a las generaciones futuras un ducado unido mejor.\n\nSegún quién sea el líder de [ROOT.GetNameDef], cambiarán las decisiones disponibles para concretar la Ley de Unión.\n\nLíder actual del Ducado Unido: [ROOT.GetLeader]\nPlanes de reconstrucción restantes £decision_icon_small [?HEU_united_germanic_duchy_var]/6"

 ### Comunes
 HEU_ugd_war_crimes_tribunal: "Juicio de crímenes de guerra de Edén"
 HEU_ugd_war_crimes_tribunal_desc: "Si aplicamos castigos demasiado severos, existe la posibilidad de que el ideal de la Ley de Unión se haga añicos; por ello, se espera que, en la práctica, el juicio termine siendo poco más que cortar las colas de nivel más bajo. Aun así, es necesaria una mínima condena por lo ocurrido en Gehenna y Trinity."
 HEU_ugd_reconstruction_committee: "Comité de Reconstrucción"
 HEU_ugd_reconstruction_committee_desc: "Como todos somos hermanos y hermanas, toda guerra es, al final, una guerra civil. Instalamos temporalmente un Comité de Reconstrucción para reparar, aunque sea un poco, las heridas en la tierra y en la gente."
 HEU_ugd_help_of_the_LoN: "Fondos de apoyo de la Liga de las Naciones"
 HEU_ugd_help_of_the_LoN_desc: "Los Estados miembros de la Liga de las Naciones han reunido voluntariamente una cierta suma de donativos. Es una muestra de profunda consideración hacia [ROOT.GetName], que sufrió un golpe económico por la gran guerra."
 HEU_ugd_money_problem: "Cambiar monedas regionales por moneda luxemburguesa"
 HEU_ugd_maintenance_of_security: "Aumentar el presupuesto para mantener el orden público"
 HEU_ugd_use_media: "Usar a la prensa"
 HEU_ugd_use_media_desc: "Diversos medios publican artículos propagandísticos sobre la importancia de la Ley de Unión, enfatizando la necesidad de la integración."

 ### Aru / Kayoko / Haruka
 HEU_ugd_equal_qualifications: "Codificar la igualdad de cualificaciones"
 HEU_ugd_equal_qualifications_desc: "Aunque la Ley de Unión enfatiza una federación igualitaria entre Gehenna, Trinity y Luxemburgo, los funcionarios de Trinity temen perder sus empleos debido al linaje de Gehenna de [ROOT.GetLeader].\n\nEso no ocurrirá. Podrán seguir viviendo como antes en Trinity, que mantendrá su forma de Estado bajo el sistema federal."
 HEU_ugd_trinity_diplomacy: "Diplomacia con Trinity"
 HEU_ugd_trinity_diplomacy_desc: "Trinity no ha desaparecido. Legalmente, al menos. La Ley de Unión enfatiza que Trinity conservará su soberanía como estado federado. La nueva propuesta legal garantizará a Trinity el derecho de usar su propia bandera e insignia (como hace Escocia) para afiliarse a organismos internacionales o participar en competiciones deportivas."
 HEU_ugd_annex_justice_task_force: "Integrar el Equipo de Realización de Justicia"
 HEU_ugd_annex_justice_task_force_desc: "Tras la Ley de Unión, el Equipo de Realización de Justicia se trasladará a formar parte del gobierno del Ducado Germánico Unido, ahora una autoridad superior. Esto también significa que no perderán sus cargos incluso después de la derrota de Trinity."

 ### Haruka
 HEU_ugd_sea_of_fire: "Aniquilar la cultura de Pandemonium"
 HEU_ugd_sea_of_fire_desc: "La Pandemonium Society corrompió a Gehenna con su repugnante podredumbre y su sucio plutocratismo, empujándola a oprimir a los inocentes y a los débiles. Todo material que pueda recordar a la Pandemonium Society será incinerado. Sus registros también arderán. No quedará ni uno solo."
 HEU_ugd_remove_pandemonium: "Integrar la Pandemonium Society bajo liderazgo de Trinity"
 HEU_ugd_remove_pandemonium_desc: "Haruka odia a Gehenna. ¿Cómo no iba a hacerlo? ¿Quién podría querer a esos sádicos repulsivos? Haruka aún recuerda a los cornudos que le cortaban el cabello a tijeretazos.\n\nComo el ascenso de Haruka al poder fue impulsado por la facción de Amau Ako, su “borrado” de Gehenna se enfocará en el enemigo más cercano. Primero, rediseñará la jurisdicción federal para borrar del mapa el distrito central de Gehenna e incorporarlo a Trinity.\n\n¿Qué puede ser más importante que esparcir sal sobre la tierra de esos demonios?"
 HEU_ugd_i_dont_like_gehenna: "Excluir a Gehenna"
 HEU_ugd_i_dont_like_gehenna_desc: "Excluimos a la facción de Gehenna de todos los espacios oficiales y llenamos esos puestos con trinitarios. ¿Quién, si no Haruka —la segunda “Cerebro-Emperatriz”, la que convertirá a Gehenna en un desierto de sal— podría hacer algo así?"

 ### Trinity
 HEU_ugd_united_justice_task_force: "Reactivar el Equipo de Realización de Justicia"
 HEU_ugd_united_justice_task_force_desc: "Tras la Ley de Unión, el Equipo de Realización de Justicia se trasladará a formar parte del gobierno del Ducado Germánico Unido, ahora una autoridad superior. Con el nacimiento de un primer ministro de Trinity, expresamos que no perderán sus cargos tras la derrota, e incluso podremos indultar a generales derrotados."
 HEU_ugd_social_conservatism: "Conservadurismo social"
 HEU_ugd_social_conservatism_desc: "La razón por la que el ducado unido ardió y fue destruido fue que no estaba colmado de religiosidad. Un conservadurismo social basado en la fe guiará al ducado unido por el camino correcto."
 HEU_ugd_freedom_of_each_state: "Libertad de cada estado"
 HEU_ugd_freedom_of_each_state_desc: "Así como las distintas facciones de Trinity podían actuar libremente antes de la Gran Transición, los distintos estados del ducado unido contarán con una autonomía más amplia para operar a nivel local."

 ### Mine
 HEU_ugd_order_of_relief_knights: "Una Orden de Caballeros de Socorro más fuerte"
 HEU_ugd_order_of_relief_knights_desc: "¡Socorro donde haga falta socorro! Para la integración del ducado unido, fortalecemos la autoridad de la Orden de Caballeros de Socorro y ampliamos los servicios médicos que puede brindar."
 HEU_ugd_support_of_johannes: "Obtener el apoyo de la facción de Johannes"
#룩셈부르크 (흥신소 68) 디시전 끝
#흥신소 68 국민정신

 HEU_sinloe_wa_uae:0 "Confianza y camaradería"
 HEU_sinloe_wa_uae_desc:0 "Aunque hayamos caído en un mundo desconocido, los empleados de Benriya seguirán juntos para siempre."

 HEU_grand_duchy_of_luxembourg:0 "Gran Ducado de Luxemburgo"
 HEU_grand_duchy_of_luxembourg_desc:0 "Incluso en el caos posterior a la §YGran Transición§!, el Gran Ducado de Luxemburgo no se extinguió. Al menos, en teoría. Tras la aniquilación de la casa gran ducal en noviembre de 1935, en plena confusión de la Gran Transición, el gobierno del Partido de Derecha formó una coalición con la Agencia 68, quienes ayudaron a sofocar el desorden.\n\nPor supuesto, el Luxemburgo de antes y el de ahora son muy distintos. Teóricamente, Rikuhachima Aru no debería poseer ningún poder político como monarca constitucional, pero en la práctica se inmiscuye profundamente en la política luxemburguesa y ejerce una gran influencia."

 HEU_grand_duchy_of_luxembourg_alt:0 "Gran Ducado de Luxemburgo reconstruido"
 HEU_grand_duchy_of_luxembourg_alt_desc:0 "Incluso en el caos posterior a la §YGran Transición§!, el Gran Ducado de Luxemburgo no se extinguió. Al menos, en teoría. Tras la aniquilación de la casa gran ducal en noviembre de 1935, en plena confusión de la Gran Transición, el gobierno del Partido de Derecha formó una coalición con la Agencia 68, quienes ayudaron a sofocar el desorden.\n\nCon la salida de Rikuhachima Aru del gobierno luxemburgués, la coalición llegó a su fin. Aunque la influencia que dejaron no desaparecerá fácilmente, Luxemburgo irá cambiando poco a poco hacia un nuevo rostro."

 HEU_grand_duchy_of_luxembourg_benriya:0 "Luxemburgo tambaleante"
 HEU_grand_duchy_of_luxembourg_benriya_desc:0 "Incluso en el caos posterior a la §YGran Transición§!, el Gran Ducado de Luxemburgo no se extinguió. Al menos, en teoría. La coalición luxemburguesa colapsó y los políticos locales fueron expulsados del gabinete.\n\nCon el antiguo gabinete y el parlamento neutralizados, el Luxemburgo actual se ha convertido, en la práctica, en un Estado autocrático."

 HEU_gehenna_immigrant:0 "Inmigrantes de Gehenna"
 HEU_gehenna_immigrant_desc:0 "¡Bienvenido a [ROOT.GetName]! La región de Luxemburgo recibe un flujo constante de población debido a la inmigración de estudiantes descontentos con el sistema de la Academia Gehenna."

 HEU_end_of_holding_act_idea:0 "Abolición de la Ley de Holdings"
 HEU_end_of_holding_act_idea_desc:0 "La Ley de Holdings (Holding Act), promulgada en 1929, fue un intento de convertir a Luxemburgo en una especie de paraíso fiscal, otorgando beneficios de exención de impuestos a las holdings extranjeras que establecieran empresas en el país. Durante los últimos años, esta ley tuvo éxito en atraer diversas empresas extranjeras a Luxemburgo, pero perdió su valor tras el colapso del bloque capitalista de Europa Occidental provocado por la Gran Transición.\n\nCon la abolición de la ley, pudimos recaudar de forma temporal una enorme cantidad de impuestos de las empresas (en su mayoría estadounidenses) que aún permanecían en Luxemburgo. Habrá un caos social temporal cuando esas empresas, apuñaladas por la espalda, abandonen el país en masa; pero es un golpe que podemos soportar."

 HEU_titanium_idea:0 "Producción masiva de titanio"
 HEU_titanium_idea_desc:0 "La tecnología del titanio aún no es muy conocida por los lugareños, pero nuestro científico Guillaume Kroll inventó un método siderúrgico capaz de producir titanio a gran escala."

 HEU_national_labour_council_idea:0 "Consejo Nacional del Trabajo"
 HEU_national_labour_council_idea_desc:0 "El Consejo Nacional del Trabajo, apoyado por la izquierda local luxemburguesa, es un organismo estatal que obliga a trabajadores y empleadores a debatir en igualdad de condiciones sobre salarios y bienestar laboral. Tanto trabajadores locales como trabajadores kivotenses participan en este consejo."

 HEU_gehenna_labour_council_idea:0 "Consejo de Contratas"
 HEU_gehenna_labour_council_idea_desc:0 "El Consejo de Contratas, establecido por orden de Rikuhachima Aru, es un organismo estatal que obliga a trabajadores y empleadores a debatir en igualdad de condiciones sobre salarios y bienestar laboral. La mayoría de los representantes obreros de este consejo están compuestos por personal subcontratado de origen kivotense."

 HEU_RTL_idea_1:0 "Canal RTL de rock"
 HEU_RTL_idea_2:0 "Canal RTL de intercambio cultural"

 HEU_gehenna_immigration:0 "Política de inmigración kivotense"
 HEU_gehenna_immigration_desc:0 "Se están aplicando políticas activas para fomentar la inmigración de diversos estudiantes de Kivotos a los territorios de la Agencia 68. Los choques entre lugareños e inmigrantes aumentarán, pero es un daño colateral asumible."

 HEU_nationalization_of_railways_idea:0 "Nacionalización de los ferrocarriles"
 HEU_nationalization_of_railways_idea_desc:0 "Gracias a la cooperación entre el Partido Comunista de Luxemburgo y la Agencia 68, toda la industria ferroviaria dentro de Luxemburgo fue convertida en propiedad estatal."

 HEU_rikuhachimaism_idea:0 "Revolución 68 rikuhachimista"
 HEU_rikuhachimaism_idea_desc:0 "\"Una revolución en la que no pueda bailar no es una revolución.\"\n\nEl §Yrikuhachimísmo§!, o la ideología conocida como la §YRevolución 68§! por haberse proclamado desde la Agencia 68, es un movimiento político-cultural anti-autoritario impulsado por Rikuhachima Aru.\n\nA diferencia de Gehenna o Trinity —que, tras la Gran Transición, lograron dominar gobiernos locales—, Aru no pudo tomar el control de un gobierno humano local, ni siquiera pudo construir un gobierno cooperativo con lugareños afines como hizo Abydos. En su lugar, ha chocado de forma constante con antidemócratas locales, nazis y fuerzas religiosas conservadoras.\n\nEn ese proceso, su confrontación con la Iglesia católica —que miraba como inferior a la civilización kivotense, centrada en mujeres— y con los nazis —que exhibían odio nacionalista hacia los kivotenses— llevó a Aru a adoptar la idea de que \"debemos proteger a los kivotenses de la repugnante cultura de los lugareños\".\n\nNo existe una obra doctrinal única que defina el rikuhachimísmo, pero suele reconocerse por: apoyo al ateísmo, rechazo a la opresión contra mujeres, minorías sexuales y personas con discapacidad discriminadas por la cultura local, repudio de la cultura autoritaria construida por los lugareños, y, por último, la unidad de todas las academias de Kivotos y un pan-nacionalismo kivotense.\n\nA diferencia de otros movimientos sociales liderados por la clase obrera, el rikuhachimísmo se sostiene principalmente gracias al apoyo de estudiantes (sobre todo, de origen kivotense). Debido a su singularidad, su clasificación política es un tema de debate en la academia terrícola: en la Europa afectada por la Gran Transición se lo etiqueta como un fascismo típico por su nacionalismo kivotense, mientras que en la ciencia política estadounidense se lo clasifica como una rama del marxismo debido a su antirreligión y su postura pro-LGBT."

 HEU_luxembourgism_idea:0 "Integracionismo benriya"
 HEU_luxembourgism_idea_desc:0 "\"Todos los seres humanos nacen libres e iguales en dignidad y derechos. Dotados como están de razón y conciencia, deben comportarse fraternalmente los unos con los otros.\"\n\nAl igual que en Gehenna o Trinity, tras la Gran Transición Rikuhachima Aru no logró dominar un gobierno humano local, ni siquiera construir un gobierno cooperativo con lugareños afines como Abydos, y terminó enfrentándose de forma sostenida a antidemócratas locales, nazis y fuerzas religiosas conservadoras. Sin embargo, mediante su cooperación con algunos grupos locales, Aru acabó creando un concepto idealista.\n\nEl integracionismo benriya sostiene que los “transferidos”, con Aru a la cabeza, deben aprender la cultura germánica local y asimilarse para convivir con los lugareños, y que, al mismo tiempo, deben alcanzar compromisos por vías legales, incluida la política parlamentaria. Comprender la cultura luxemburguesa local, respetar que los lugareños son los habitantes nativos que han vivido aquí desde hace mucho tiempo, abandonar métodos violentos y demostrar, solo con paz y persuasión, que son “transferidos no peligrosos”. Con el tiempo, los lugareños reconocerán a los transferidos como conciudadanos. Ese es el núcleo del integracionismo benriya.\n\nHacia el exterior, adopta un carácter beligerante de nacionalismo germánico para satisfacer a los nacionalistas luxemburgueses; en política interna, recibe una fuerte influencia del Partido Comunista de Luxemburgo —que media la reconciliación entre kivotenses y lugareños— y tiende al socialismo democrático."

 HEU_financial_difficulties:0 "Gran Depresión luxemburguesa de 1935"
 HEU_financial_difficulties_desc:0 "De acuerdo con la Unión Económica Luxemburgo-Bélgica de 1921, Luxemburgo utilizaba una moneda fiduciaria vinculada al mismo valor que la moneda belga. La moneda luxemburguesa siempre podía canjearse 1:1 por la belga, y gracias a esta alianza económica obtuvimos grandes beneficios durante los últimos 15 años.\n\nSin embargo, la Gran Transición provocó que el gobierno belga partiera al exilio, y el Banco Central de Bélgica —que garantizaba el crédito de nuestra moneda— colapsó. El dinero de Luxemburgo es ahora poco más que papel sin garantía; en el mercado ha resurgido el trueque propio de tiempos antiguos. Si el fracaso de la moneda fiduciaria ya quedó demostrado, necesitamos alternativas: restaurar el patrón oro, o volver a pedir prestado el crédito de la moneda de otra nación."

 HEU_war_with_TRM_idea:0 "Resistencia contra Trinity"
 HEU_war_with_GEH_idea:0 "Resistencia contra el Comité Disciplinario"
 HEU_war_with_GEM_idea:0 "Resistencia contra Pandemonium"

 HEU_pro_rikuhachimaism_idea:0 "Alianza rikuhachimista"
 HEU_pro_rikuhachimaism_idea_desc:0 "Cada kivotense tiene su propia cultura, pero en última instancia todos son iguales en un punto: los “civilizados” lugareños de la Tierra los discriminan. La Alianza Rikuhachimista es una organización civil creada por transferidos kivotenses —como hombres bestia y robots— que no son estudiantes de academias. Para lograr los ideales del rikuhachimísmo, la alianza reprime los movimientos ultraderechistas, nacionalistas y religiosos de los lugareños, y apoya con suministros voluntarios a las fuerzas militares de la Agencia 68 que marchan al frente."

 HEU_civil_rights_idea:0 "Ley luxemburguesa de derechos civiles"
 HEU_civil_rights_idea_desc:0 "Una ley de derechos civiles que prohíbe la discriminación contra los kivotenses transferidos en la Gran Transición de 1935 en el empleo, los salarios y los servicios públicos y privados, y castiga a individuos y grupos que la infrinjan."

 HEU_civil_rights_idea_2:0 "Ley luxemburguesa de derechos civiles reforzada"
 HEU_civil_rights_idea_2_desc:0 "Una ley de derechos civiles que prohíbe la discriminación contra los kivotenses transferidos en la Gran Transición de 1935 en el empleo, los salarios y los servicios públicos y privados, y castiga a individuos y grupos que la infrinjan. La versión reforzada va un paso más allá: universidades e instituciones públicas deben aplicar políticas activas de acción afirmativa, como otorgar puntos adicionales a estudiantes kivotenses en admisiones y contrataciones. Aru cree que estas medidas pueden ampliar los derechos de los kivotenses como minoría discriminada."

 HEU_gehenna_academy_president_makoto_idea:0 "Hanuma Makoto"
 HEU_gehenna_academy_president_makoto_idea_desc:0 "Tras la toma de la Pandemonium Society por la Agencia 68, Rikuhachima Aru nombró a Hanuma Makoto como presidenta de Gehenna."

 HEU_gehenna_academy_president_satsuki_idea:0 "Kyogoku Satsuki"
 HEU_gehenna_academy_president_satsuki_idea_desc:0 "Tras la toma de la Pandemonium Society por la Agencia 68, Rikuhachima Aru nombró a Kyogoku Satsuki como presidenta de Gehenna."

 HEU_gehenna_academy_president_victoria_idea:0 "Victoria Luise de Prusia"
 HEU_gehenna_academy_president_victoria_idea_desc:0 "Tras la toma de la Pandemonium Society por la Agencia 68, Rikuhachima Aru nombró a Victoria Luise de Prusia como presidenta del consejo estudiantil de la Academia Gehenna. La primera presidenta local de Gehenna parece tener dificultades para adaptarse al ambiente “libre” de las estudiantes de Gehenna."

 HEU_gehenna_academy_for_aru_idea:0 "Pandemonium para Aru"
 HEU_gehenna_academy_for_aru_idea_desc:0 "Todo el poder de la Pandemonium Society se utiliza para producir propaganda destinada a glorificar a Rikuhachima Aru en lo personal."

 HEU_pandemonium_intelligence_network_idea:0 "Red de inteligencia de Pandemonium"

 HEU_luxembourg_army_dynamic_modifier:0 "Ejército de Luxemburgo"
 HEU_luxembourg_army_dynamic_modifier_desc:0 "Hasta el siglo XIX, el ejército luxemburgués consistía solo en una pequeña milicia, pero en 1881 se organizó por primera vez una gendarmería y se estableció un ejército regular en forma de fuerza permanente. Antes de la Gran Transición solo podía mantener el orden interno y no tenía capacidad para responder a una invasión extranjera; sin embargo, desde la llegada al poder de Rikuhachima Aru, logró ampliar su escala y modernizar su armamento."

 HEU_rikuhachimaism_other_country_idea:0 "Revolución 68 rikuhachimista"
 HEU_rikuhachimaism_other_country_idea_desc:0 "La revolución rikuhachimista, nacida en Luxemburgo bajo el dominio de la Agencia 68, también ha ganado una gran influencia en el territorio de [ROOT.GetName]. Aunque se critica que el rikuhachimísmo —al oponerse a la cultura autoritaria y exigir más libertad— exacerba los conflictos entre lugareños y transferidos kivotenses, también se reconoce que contribuyó a mejorar los derechos de los kivotenses y a derribar la cultura autoritaria local."

 HEU_to_the_end_idea:0 "Morir o luchar"
 HEU_to_the_end_idea_desc:0 "Un paraíso donde ningún kivotense sufra discriminación y todos reciban un trato igualitario. La esperanza que soñaba la Agencia 68 quedó al borde del colapso tras la caída de Pandemonium, su antiguo aliado. Pero precisamente por eso, todos en la Agencia 68 se levantaron para resistir hasta el final.\n\nAunque perdamos esta lucha y nuestro sueño termine hecho cenizas, el hecho de que luchamos aquí para alcanzarlo no desaparecerá. Jamás."

 HEU_red_winter_68_idea:0 "Influencia trotskista en la Revolución 68"
 HEU_red_winter_68_idea_desc:0 "La Revolución 68 soñada por Rikuhachima Aru era un simple movimiento socioliberal y anti-autoritario que exigía únicamente “desmantelar la cultura opresiva local”. Sin embargo, los trotskistas inmigrados desde Red Winter sostienen que las reformas culturales no bastan: para desmantelar esa cultura opresiva se requieren reformas económicas basadas en el trotskismo y la destrucción de la clase capitalista. El debate entre trotskistas y estudiantes de otras academias está sacudiendo el rumbo de la Revolución 68..."

 HEU_red_winter_68_yes_idea:0 "Tolerancia al trotskismo en la Revolución 68"
 HEU_red_winter_68_yes_idea_desc:0 "La Revolución 68 soñada por Rikuhachima Aru era un simple movimiento socioliberal y anti-autoritario que exigía únicamente “desmantelar la cultura opresiva local”. Sin embargo, los trotskistas inmigrados desde Red Winter sostienen que las reformas culturales no bastan: para desmantelar esa cultura opresiva se requieren reformas económicas basadas en el trotskismo y la destrucción de la clase capitalista. Rikuhachima Aru, al tolerar de facto las afirmaciones de los revolucionarios trotskistas, reconoció implícitamente que ellos también están incluidos dentro del “rikuhachimísmo”.\n\nBajo la influencia trotskista, la Revolución 68 se radicalizó hacia la izquierda respecto a su concepción inicial, y solo se sabrá si esta elección fue correcta tras el paso de una generación."

 HEU_progressive_conservatism: "Conservadurismo progresista"
 HEU_progressive_conservatism_desc: "La facción reformista del Partido de Derecha luxemburgués sostuvo que, para el desarrollo de Luxemburgo, debía transar con los ideales del rikuhachimísmo y que incluso la clase campesina debía transformarse siguiendo la cultura kivotense. Con el apoyo del Partido de Derecha, mujeres locales que antes permanecían solo en el hogar han comenzado su vida social, y la participación femenina en Luxemburgo se está expandiendo aún más.\n\nLa facción reformista afirma que incluso el conservadurismo debe reajustar su concepto para adaptarse a una sociedad cambiante. El compromiso entre el rikuhachimísmo y el conservadurismo local fue definido por el diputado Pierre Dupont como “conservadurismo progresista”."

 HEU_stasi: "Agencia de Seguridad del Estado"
 HEU_stasi_desc: "La Agencia de Seguridad del Estado, creada bajo el liderazgo del Partido Comunista de Luxemburgo, fue establecida como un organismo de contrainteligencia para prevenir una “segunda masacre de la Gran Transición”. El partido intentó nombrar directamente al director para mantener la nueva agencia bajo su influencia, pero la resistencia de oficiales monárquicos pro-Aru hizo que la agencia quedara asignada al ejército, permitiendo que naciera como una organización de contraespionaje leal a Aru."

 HEU_stasi_2: "Agencia de Seguridad del Estado"
 HEU_stasi_2_desc: "La Agencia de Seguridad del Estado, creada bajo el liderazgo del Partido Comunista de Luxemburgo, fue establecida como un organismo de contrainteligencia para prevenir una “segunda masacre de la Gran Transición”. Hina y los oficiales monárquicos pro-Aru bloquearon por completo la influencia del Partido Comunista —que intentaba intervenir— y reforzaron la agencia como un servicio de contrainteligencia más eficiente."

 HEU_way_to_forgiveness_fall: "Fracaso del proyecto del Parque Conmemorativo"
 HEU_way_to_forgiveness_fall_desc: "Aru sabía que a las estudiantes de Gehenna les encanta hacer estallar cosas con explosivos, pero ni siquiera ella podía prever con seriedad que fueran a volar con dinamita una instalación dedicada a conmemorar la masacre que ellas mismas cometieron. El terrorismo gehennero contra el memorial no logró integrar Luxemburgo, sino dividirlo; y esta herida permanecerá como un desastre para el país durante mucho tiempo."

 HEU_way_to_forgiveness: "El camino hacia el perdón"
 HEU_way_to_forgiveness_desc: "Aru fue, en su momento, quien intentó “detener” la masacre de Luxemburgo durante la Gran Transición, pero aun así cargó con culpa por las vidas de los ciudadanos sacrificados. La construcción del Parque Conmemorativo honra a quienes murieron por la Gran Transición de 1935, simboliza la reconciliación entre los luxemburgueses locales y los inmigrantes kivotenses, y jura que aquella historia trágica no volverá a repetirse."

 HEU_legion_pro_lux: "Fuerzas de apoyo para Rikuhachima"
 HEU_legion_pro_lux_desc: "Prometimos enviar voluntarios en apoyo de la Agencia 68."

 HEU_healing_depression: "La depresión de Aru comienza a sanar"
 HEU_healing_depression_desc: "Ojalá bastara un solo episodio hermoso para curar la depresión, pero para que la depresión de Aru desaparezca hará falta más tiempo y un tratamiento farmacológico adecuado. Aunque la hospitalización de varios días por su intento de suicidio fue encubierta por la prensa como “reposo por neumonía”, el hecho de que padece depresión ya se ha hecho público.\n\nMuchos ciudadanos que la apoyan han enviado regalos al Palacio Gran Ducal para desearle recuperación, y su salud mejora poco a poco. Ella integró a Luxemburgo, dividido en dos pueblos, e integró a la Agencia 68, dividida en dos. Este tiempo, observando esos resultados y estando junto a las personas que valora, sin duda será una buena medicina para ella."

 HEU_abgeordnetenkammer_dynamic_modifier: "Parlamento de Luxemburgo"

 HEU_anti_68_revolution: "La primera estrella de la contrarrevolución que brilla en blanco"
 HEU_anti_68_revolution_desc: "Los kivotenses invadieron Europa a través de la Gran Transición, golpearon a los lugareños y aun así construyen una contradicción social al afirmar que “iluminarán” la cultura europea inferior con la cultura de Kivotos. El nacionalsocialista luxemburgués Damian Kratzenberg, cooperando con Arona, debutó como vtuber bajo la identidad de la supuesta estudiante de Trinity “Nanami Ayaka”, para proteger a Luxemburgo de esa locura llamada Revolución 68.\n\nLos kivotenses masacraron a los lugareños y, aun así, sostienen ser moral y políticamente superiores a la humanidad. Pero Damian Kratzenberg está luchando con firmeza contra la revolución de Rikuhachima Aru usando los medios de internet. Esta “primera estrella” de la contrarrevolución, brillante y blanca, ilumina ahora desde las ruinas de Schale a toda la llamada “Comisión Revolucionaria del Consejo General Estudiantil de Kivotos”."

 HEU_new_BLEU: "Moneda fiduciaria luxemburguesa"
 HEU_new_BLEU_desc: "La moneda del Gran Ducado de Luxemburgo se sostenía gracias al crédito del banco belga. Tras el colapso de Bélgica, nuestra moneda perdió su valor, pero el gobierno encontró un modo de obtener un nuevo respaldo crediticio."

 HEU_aru_idea: "$HEU_aru_rikuhachima$"
 HEU_aru_idea_desc: "La trágica frustración de la ley de derechos civiles, el golpe de Estado y la serie de sucesos —incluida la reclusión de Rikuhachima Aru— elevaron aún más la simpatía hacia ella. Muy popular entre los gehenneros y una figura polémica para los lugareños, Aru renació, de forma involuntaria, como heroína nacional de Luxemburgo tras el golpe."

 HEU_aru_idea_ending: "$HEU_aru_rikuhachima$"
 HEU_aru_idea_ending_desc: "La trágica frustración de la ley de derechos civiles, el golpe de Estado y la serie de sucesos —incluida la reclusión de Rikuhachima Aru— elevaron aún más la simpatía hacia ella. Muy popular entre los gehenneros y una figura polémica para los lugareños, Aru renació, de forma involuntaria, como heroína nacional de Luxemburgo tras el golpe.\n\nTras la promulgación de la Ley de Unión, Aru se retiró un poco de la política y delegó muchas facultades al primer ministro. Sin embargo, Rikuhachima Aru acabó ganando aún más popularidad entre las masas."

 HEU_benriya_friendship: "Persona"
 HEU_benriya_friendship_desc: "Rikuhachima Aru posee cuatro puntuaciones que representan sus logros y capacidades personales: sabiduría, amabilidad, determinación y carisma. A medida que su Persona se expanda, pasará de ser una amateur en la administración del Estado a convertirse en una política curtida."

 HEU_broken_trust_and_friendship: "Confianza y camaradería rotas"
 HEU_broken_trust_and_friendship_desc: "La Agencia 68 se derrumbó de facto cuando Asagi Mutsuki y Onikata Kayoko libraron combates en la ciudad intentando matarse mutuamente. Aunque aún existe el “batallón de empleados rasos” compuesto por estudiantes de Gehenna, la amistad y los lazos de las cuatro figuras centrales —que venían desde antes de la Gran Transición— quedaron completamente destrozados.\n\n¿Podrán volver a unirse esos lazos algún día?"

 HEU_grand_duchy_of_luxembourg_mutsuki:0 "Gran Ducado de Luxemburgo"
 HEU_grand_duchy_of_luxembourg_mutsuki_desc:0 "Rikuhachima Aru ha sido encarcelada y el parlamento fue cerrado. La sociedad se encuentra sumida en una oscuridad más profunda que nunca debido al golpe de Estado que la facción de Gehenna desató en el Gran Ducado de Luxemburgo."

 HEU_luxembourg_administration_idea: "Administración de Luxemburgo"
 HEU_luxembourg_administration_idea_desc: "Tras el golpe de Estado, el parlamento quedó suspendido y todo el poder se concentró en la Administración de Luxemburgo. La percepción que el pueblo forme sobre el nuevo gobierno dependerá, a partir de ahora, de las acciones de [ROOT.GetLeader]."

 HEU_liberty_equality_and_fraternity: "Libertad, igualdad y fraternidad"
 HEU_liberty_equality_and_fraternity_desc: "La propagación de la cultura francesa está intensificando la división dentro de la sociedad luxemburguesa. Esto es negativo porque impide la unidad nacional, pero positivo porque permite controlar mejor a la población."

 HEU_kayoko_revolt_fail: "Secuelas de la batalla urbana en la ciudad de Luxemburgo"
 HEU_kayoko_revolt_fail_desc: "El combate entre las fuerzas antigubernamentales de Onikata Kayoko y las fuerzas gubernamentales de Asagi Mutsuki en la ciudad de Luxemburgo redujo drásticamente la moral de nuestras tropas y dividió al país en lo psicológico. Más que las muertes de soldados, el resultado político de la “división de Luxemburgo” quedó como la mayor secuela de este incidente."

 HEU_kayoko_revolt_success: "Reunificación pacífica de Luxemburgo"
 HEU_kayoko_revolt_success_desc: "Onikata Kayoko se rindió. Luxemburgo volvió a unificarse. Aunque el gobierno se tambaleó por un tiempo, hemos vuelto a ser uno y avanzamos hacia el futuro."

 HEU_weekend_farm:0 "Enviar a los rivales a una ‘granja de fin de semana’"
 HEU_weekend_farm_desc:0 "Los servicios de inteligencia extranjeros creyeron que el régimen de Asagi había enviado a todos los rivales del gabinete del Partido de Derecha a una ‘granja de fin de semana’ como una especie de ejecución secreta o algo parecido. Se quedaron perplejos al descubrir que, en realidad, solo los puso bajo arresto domiciliario en las afueras."

 HEU_LoN_puppet_idea: "Mandato de la Liga de las Naciones"
 HEU_LoN_puppet_idea_desc: "El sistema de mandatos, creado tras la Primera Guerra Mundial, se suponía que existía para una independencia rápida y autonomía de las colonias, pero ganó mala fama por independencias poco rápidas y relaciones desiguales con la potencia mandataria. Aun así, por lo menos garantiza independencia real tras algunas décadas, por lo que los habitantes de los territorios ocupados lo consideran el mal menor."

 HEU_dockyard_mass_operation: "Expansión masiva de astilleros"

 HEU_ARBED:0 "ARBED"
 HEU_spuerkeess:0 "Banque de l'État du Luxembourg"

