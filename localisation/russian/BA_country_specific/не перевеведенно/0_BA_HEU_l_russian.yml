#{{ 외교 이벤트 시작
 HEU.diplomacy_event.1.t:0 "Propuesta de alianza económica"
 HEU.diplomacy_event.1.desc:0 "[HEU.GetNameDef] estaba usando una moneda fiduciaria (de crédito) vinculada al franco belga y a su valor. Sin embargo, tras la Gran Transición de 1935 y el exilio del gobierno belga, el valor y la credibilidad de la moneda luxemburguesa se han desvanecido por completo. La propuesta de alianza económica de [HEU.GetLeader] es un intento de vincular el valor de la moneda entre el gobierno de [ROOT.GetName] y el gobierno de Luxemburgo, creando una nueva moneda fiduciaria. Si aceptamos esta propuesta, podríamos obtener mayores beneficios en el comercio con Luxemburgo.\n\nNo obstante, dado que el tamaño de la economía luxemburguesa no es particularmente grande, también hay muchas voces que cuestionan si vale la pena implementar una alianza económica con [HEU.GetLeader]. Sea como sea, el documento discutido en la mesa de negociaciones ya está sobre el escritorio de [ROOT.GetLeader], a la espera de una decisión: aprobar o rechazar."
 HEU.diplomacy_event.1.a:0 "Esto no debería perjudicarnos."
 HEU.diplomacy_event.1.b:0 "¡Recházalo! Es una idiotez inútil."

 HEU.diplomacy_event.2.t:0 "Aprobación de la alianza económica por parte de [FROM.GetNameDef]"
 HEU.diplomacy_event.2.desc:0 "La moneda fiduciaria de [ROOT.GetName], completamente destruida tras la Gran Transición de 1935, ha resucitado una vez más. Se ha decidido vincular el valor de la moneda que posee [FROM.GetNameDef] con el valor de nuestro franco luxemburgués, y se ha cancelado la política que pretendía abolir la moneda anterior.\n\nNuestra economía estará sana por un tiempo... pero si la relación con [FROM.GetNameDef] colapsa, o si su gobierno llega a caer... nosotros nos encontraremos en una situación extremadamente difícil."
 HEU.diplomacy_event.2.a:0 "¡Viva Luxemburgo!"

 HEU.diplomacy_event.3.t:0 "Rechazo de la alianza económica por parte de [FROM.GetNameDef]"
 HEU.diplomacy_event.3.desc:0 "Nuestro intento de sostener la moneda fiduciaria de [ROOT.GetName], completamente destruida tras la Gran Transición de 1935, ha fracasado. Parece que [FROM.GetLeader] no consideró que nuestra propuesta beneficiara sus intereses nacionales. Debemos volver al plan original: regresar al patrón oro."
 HEU.diplomacy_event.3.a:0 "A mí siempre me gustó el oro."

 HEU.diplomacy_event.4.t:0 "Propuesta de unificación pacífica de [FROM.GetNameDef]"
 HEU.diplomacy_event.4.desc:0 "[FROM.GetLeader] desea convertirse en el Estado central de Gehenna, y más aún tras el colapso del Pandemonium Society. A cambio de garantizar la autonomía de Luxemburgo, nos han solicitado que nos integremos como parte de [FROM.GetName]. Las delegaciones diplomáticas de Luxemburgo y de [FROM.GetName] ya han iniciado una conferencia conjunta de unificación en el distrito central de Gehenna.\n\nLa decisión final recae en [ROOT.GetLeader]. El grupo del Café/Agencia (흥신소) prefiere proteger la paz de Luxemburgo antes que apoderarse de la hegemonía de Gehenna, y entiende que, si estas conversaciones fracasan, estallará una guerra para decidir qué fuerza unificará Gehenna.\n\n¿Permaneceremos como Luxemburgo, un territorio autónomo dentro de Gehenna? ¿O, para proteger nuestra libertad, rechazaremos esta conferencia de unificación y nos prepararemos para la guerra contra ellos?"
 HEU.diplomacy_event.4.a:0 "Que [FROM.GetLeader] unifique Gehenna."
 HEU.diplomacy_event.4.b:0 "No. No nos arrastraremos bajo su mando."

 HEU.diplomacy_event.5.t:0 "Aceptación de la unificación pacífica por parte de [FROM.GetNameDef]"
 HEU.diplomacy_event.5.desc:0 "¡La Gehenna fragmentada ha sido integrada de manera pacífica! Rikuhachima Aru eligió la negociación y no la guerra contra nosotros, y se ha decidido lograr la integración nacional con Luxemburgo a cambio de garantizar la autonomía de Luxemburgo. Este es un gran logro de [ROOT.GetLeader], y quedaremos registrados por mucho tiempo como el unificador de toda Gehenna."
 HEU.diplomacy_event.5.a:0 "¡Muy bien!"

 HEU.diplomacy_event.6.t:0 "Rechazo de la unificación pacífica por parte de [FROM.GetNameDef]"
 HEU.diplomacy_event.6.desc:0 "La conferencia conjunta para una unificación pacífica no produjo resultados positivos. Los diplomáticos de Luxemburgo y de [ROOT.GetName] mostraron grandes diferencias en intereses y valores, y nuestras conversaciones se estancaron sin avanzar. Al final, quedó claro que la unificación pacífica no era más que un sueño. Ahora, para unificar Gehenna, la guerra será la única alternativa."
 HEU.diplomacy_event.6.a:0 "Qué lástima."

 HEU.diplomacy_event.7.t:0 "Negociaciones entre [ROOT.GetName] y [FROM.GetName]"
 HEU.diplomacy_event.7.desc:0 "Desde la Gran Transición, [ROOT.GetName] perdió su territorio metropolitano a causa de la invasión de los kivotianos, y ha esperado desde sus colonias el día del “retorno a la patria”. Ese día parecía que jamás llegaría, pero [FROM.GetLeader] nos ha propuesto devolver territorios que poseen.\n\nNo es una propuesta sin condiciones. Exigen que nos convirtamos en un gobierno bajo el control de [FROM.GetNameDef]. Esto perjudicaría gravemente nuestra autonomía, pero quizá sea nuestra última oportunidad de regresar a la patria. La decisión de [ROOT.GetLeader] definirá nuestro futuro."
 HEU.diplomacy_event.7.a:0 "Aunque tengamos que sacrificarlo todo, regresaremos."
 HEU.diplomacy_event.7.b:0 "¡No! ¡Regresaremos por nuestra propia fuerza!"

 HEU.diplomacy_event.8.t:0 "Aprobación de las negociaciones por parte de [FROM.GetName]"
 HEU.diplomacy_event.8.desc:0 "[FROM.GetName] no tenía muchas alternativas. Aceptaron nuestras condiciones de negociación para poder regresar a su patria, y [FROM.GetLeader] se reunió con [ROOT.GetLader] para prometer la amistad eterna y la prosperidad compartida entre ambos países.\n\nEste es un gran éxito obtenido no como invasores kivotianos, sino como libertadores de la humanidad."
 HEU.diplomacy_event.8.a:0 "¡Qué día tan magnífico!"

 HEU.diplomacy_event.9.t:0 "Rechazo de las negociaciones por parte de [FROM.GetName]"
 HEU.diplomacy_event.9.desc:0 "[FROM.GetName] se negó a permitir que se vulnerara su autonomía. Parece que consideraron que negociar con [ROOT.GetNameDef] no era diferente a perder su independencia de manera permanente.\n\nEs una pena, pero debemos aceptar que esas negociaciones probablemente no se reanuden."
 HEU.diplomacy_event.9.a:0 "Hay días así... supongo."

 HEU.diplomacy_event.10.t:0 "El trágico colapso del Imperio Británico"
 HEU.diplomacy_event.10.desc:0 "Durante la Primera Guerra Mundial, Luxemburgo fue ocupado por el Plan Schlieffen, pero 3,700 luxemburgueses —equivalentes al 1% de toda la población— se alistaron en el ejército francés para combatir, y 2,000 murieron en Francia. Desde que las fuerzas de los Estados Unidos expulsaron al ejército de Deutschland que guarnecía Luxemburgo y lo calificaron como “aliado y amigo”, Luxemburgo fue respetado en el escenario internacional como parte de las potencias aliadas.\n\nSin embargo, con Bélgica y Francia —dos países aliados— exiliados en el continente africano, la posición de Luxemburgo dentro de los Aliados se volvió incierta. Y ahora, con Kaiser Corporation ocupando el Imperio Británico, la cooperación entre el Gran Ducado de Luxemburgo y los países aliados ha quedado completamente vaciada de contenido. No es que el parlamento luxemburgués o la regente Rikuhachima hayan declarado el fin de la cooperación con los Aliados, pero, en la práctica, Luxemburgo ya no puede ser considerado un aliado del Reino Unido."
 HEU.diplomacy_event.10.a:0 "Al menos por ahora... hemos quedado solos."

 HEU.diplomacy_event.11.t:0 "La exigencia de [FROM.GetName] de devolver el estado de [FROM.FROM.GetName]"
 HEU.diplomacy_event.11.desc:0 "Tras proclamarse Presidente del Consejo Estudiantil General, dentro de nuestra administración ya se había revisado y también se había difundido entre los burócratas locales un documento que sostenía que debíamos devolverles la región de los Países Bajos (Low Countries). Ahora, [FROM.GetName] parece decidido a reclamar formalmente la devolución de este estado. Debemos decidir si devolveremos o no este estado a [FROM.GetName]."
 HEU.diplomacy_event.11.a:0 "Bien. Que se lo lleven."
 HEU.diplomacy_event.11.b:0 "No. Este estado tiene valor estratégico."

 HEU.diplomacy_event.12.t:0 "Rechazo de [FROM.GetName] a devolver el estado de [FROM.FROM.GetName]"
 HEU.diplomacy_event.12.desc:0 "[FROM.GetName] ha rechazado la devolución del estado que solicitamos de manera respetuosa. Para ocupar el verdadero trono del Consejo Estudiantil General, quizá tengamos que recuperar este estado por la fuerza, incluso si es a la fuerza."
 HEU.diplomacy_event.12.a:0 "No podemos permitir una guerra contra ellos."
 HEU.diplomacy_event.12.b:0 "...Invade."

 HEU.diplomacy_event.13.t:0 "¡[FROM.GetName] devuelve el estado de [FROM.FROM.GetName]!"
 HEU.diplomacy_event.13.desc:0 "[FROM.GetName] ha aceptado nuestra solicitud formal de devolución, y el estado de [FROM.FROM.GetName] ahora ha regresado a nuestro seno. ¡Estamos un paso más cerca de ocupar el puesto de Presidente del Consejo Estudiantil General!"
 HEU.diplomacy_event.13.a:0 "Bien."

# Fin de eventos diplomáticos }} 

#{{ 아루 이벤트 시작
 HEU.aru_event.1.t:0 "Conferencia diplomática"
 HEU.aru_event.1.desc:0 "\"Je, je. O sea que yo también me he vuelto alguien importante a mi manera. Imagínate: haber ganado el derecho de ponerme un vestido tan elegante y subirme a un escenario tan brillante. ¿No crees, Kayoko?\"\n\nHoy, Aru estaba notablemente emocionada por primera vez en mucho tiempo desde la Gran Transición. Kayoko, vestida con un traje negro, soltó una risita y le tomó la mano a Aru, que llevaba un vestido color vino tinto. En la Embajada de los Estados Unidos en Luxemburgo se estaba celebrando una pequeña cena para conmemorar que, incluso después de la Gran Transición, las relaciones diplomáticas entre Luxemburgo y Estados Unidos continuarían.\n\n\"¿No te incomodan estos eventos, Aru?\"\n\"Pues... ¡un poco sí! No es que no me incomode nada, pero si pasa cualquier cosa, Kayoko lo va a arreglar de algún modo.\"\n\nDiciendo eso, Aru arrancó un gajo de naranja del centro de la mesa redonda y se lo metió a la boca. Por comer con prisa, el jugo le escurrió por la barbilla. Aunque la asignación para gastos de representación que recibía como regente debía ser considerable, Aru seguía sin comer bien incluso últimamente. Con una mezcla de ternura y cariño, Kayoko sacó un pañuelo.\n\n\"Jefa... aunque te pongas un vestido tan de adulta, no se te quita esa mente de despistada.\"\n\nCon una sonrisa suave, Kayoko le limpió despacio la comisura de los labios. Aru, ante ese gesto, infló ligeramente las mejillas.\n\n\"Kayoko. No soy una niña, ¿sí? Ya crecí. ¡Además, mírame! ¡Soy una forajida hardboiled que hasta pide su ración diaria de maldad!\"\n\"Sí, sí. Lo sé. ...De verdad.\"\n\"¡No lo sabes para nada! Me estás tratando como si fuera una chiquilla...\"\n\"Je, je. Ya estuvo. Ya quedó limpio. Vamos. El embajador debe estar esperando a la jefa.\"\n\nDespués de la Gran Transición, nuestras vidas cambiaron muchísimo. Se multiplicaron las cosas que hacer, y también las cosas duras. Pero... probablemente estará bien. Si los viejos amigos de la Agencia 68 permanecen a nuestro lado, Aru lo creía de corazón."
 HEU.aru_event.1.a:0 "\"¿El embajador Morris, verdad? Yo soy la forajida hardboiled... eh... ¿eso no se dice aquí?\""

 HEU.aru_event.2.t:0 "Una casa modesta"
 HEU.aru_event.2.desc:0 "Justo después de la Gran Transición, Aru logró frenar las masacres que ocurrían en esta ciudad. Bueno, decir “frenar” era mucho: en realidad, solo había sometido a las estudiantes delincuentes de Gehenna que iban por ahí disparando. No fue sino hasta el Palacio Gran Ducal que Aru comprendió lo frágil que era la gente de esta tierra: seres débiles que podían morir con facilidad por una sola bala.\n\nGracias a eso, también recibió una placa rimbombante llamada “regente”, junto con gastos de representación y hasta un palacio espléndido. Aunque, en realidad, Aru jamás usó los espacios privados de ese palacio. Vivía en una pequeña pensión a diez minutos —un poco más— caminando desde el palacio.\n\n\"En la Agencia... los cuatro dormíamos acostados juntos...\"\n\nAlgún día, cuando el caos de esta tierra se estabilice, planea volver a reunir un hogar. Pero por ahora, piensa vivir sola. Aru dejó sobre la mesa un grueso montón de documentos que había traído del despacho. Trabajos que seguían hasta altas horas de la noche incluso después de “salir” del trabajo.\n\nAru no quería que sus amigos más queridos cargaran con ese peso. Ellos necesitaban privacidad. La libertad, después del trabajo, de tirarse en su sofá con papas fritas... o simplemente quedarse mirando la televisión.\n\nSi a su lado hubiera una jefa aburrida con la luz prendida hasta medianoche revisando papeles... seguramente ellos también se sentirían incómodos. Aru sonrió débilmente mientras sacaba una elegante pluma fuente hecha en Gehenna. Mutsuki, Kayoko, Haruka... ojalá todos los que amaba estuvieran pasando una noche tranquila."
 HEU.aru_event.2.a:0 "Por ellos, yo puedo esforzarme un poco más."

 HEU.aru_event.3.t:0 "Manifestación pro-Aru"
 HEU.aru_event.3.desc:0 "En general, la imagen de Aru era peor cuanto más lejos se estaba de la ciudad de Luxemburgo, especialmente entre los campesinos del norte; y era extremadamente alta entre la clase media urbana y los trabajadores de la ciudad de Luxemburgo, donde los ataques directos de Gehenna casi provocaron una gran masacre.\n\nEn respuesta a las protestas campesinas anti-Aru, hoy estalló una gran concentración pro-Aru en la ciudad de Luxemburgo.\n\nLa movilización, organizada principalmente por militantes del Partido Radical Liberal —el partido liberal de Luxemburgo—, destacó que Aru fue la heroína que evitó la masacre de Luxemburgo, y subrayó que los manifestantes anti-Aru no ofrecen una alternativa real.\n\nSi Aru se va... ¿quién protegerá a los ciudadanos de Gehenna?"
 HEU.aru_event.3.a:0 "Al final, la respuesta sigue siendo Aru."

 HEU.aru_event.4.t:0 "Análisis de opinión pública"
 HEU.aru_event.4.desc:0 "A Su Alteza, la Regente Rikuhachima:\n\nTras analizar las protestas que están ocurriendo en la capital, el Departamento de Policía de la Ciudad de Luxemburgo ha confirmado que la mayoría de los manifestantes están bajando desde las zonas rurales del norte de Luxemburgo. Los residentes de la Ciudad de Luxemburgo están profundamente agradecidos con Su Alteza por haber evitado la gran masacre de la ciudad en 1935, y el apoyo al gobierno se mantiene muy firme.\n\nSin embargo, las zonas rurales del norte de Luxemburgo no fueron saqueadas ni siquiera en el caos inmediato posterior a la Gran Transición.\n\nSegún nuestra investigación, las fuerzas opositoras a Su Alteza, la Regente Rikuhachima, no son urbanas. Rogamos a Su Alteza no olvidar que los opositores no son más que una minoría ruidosa de campesinos, y que más del doble de la población apoya al gobierno de Su Alteza. Ceder ante ellos sería el resultado que esos palurdos más desean.\n\nTransmitido por el Departamento de Policía de Luxemburgo."
 HEU.aru_event.4.a:0 "Aunque lo sepa... igual duele."


