 ### Intercambio tecnológico ###
 UNESCO_research_name: "Comisión Internacional de Cooperación Intelectual"
 UNESCO_research_desc: "La Comisión Internacional de Cooperación Intelectual (The International Institute for Intellectual Cooperation) fue creada en 1922 por la Sociedad de Naciones y, más tarde, se expandió bajo liderazgo del gobierno de Luxemburgo para fomentar el intercambio cultural entre Kivotos y la humanidad. Bajo la dirección de la Sociedad de Naciones, la comisión compartirá y preservará, con extremo cuidado y prudencia, las culturas de ambas civilizaciones."
