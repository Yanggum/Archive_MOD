# Описания
HOL_exile_government_desc:0 "Потерпев поражение в борьбе с чужаками, мы бежали в Индонезию. Чтобы сформировать новое правительство, хотя Ява и мала, мы выбрали это место из-за обилия ресурсов. Теперь мы должны завоевать Индонезию и вернуть нашу родину."
HOL_political_effort_desc:0 "Мы всего лишь правительство в изгнании, изгнанное в Индонезию. Но мы не сдадимся. Мы должны укрепить наши позиции с помощью политических усилий."
HOL_suppress_indonesian_independence_desc:0 "Движение за независимость Индонезии усиливается. Мы должны беспощадно подавить его, чтобы поддерживать порядок. Их независимость никогда не будет терпима."
HOL_develop_indonesian_administration_desc:0 "Чтобы управлять Индонезией, мы должны развивать местную администрацию и назначать лояльных коллаборационистов. Это усилит нашу способность к управлению."
HOL_supress_communist_activities_desc:0 "Коммунистическая деятельность усиливается. Хотя они утверждают, что действуют ради независимости, они лишь вызывают хаос и анархию. Мы должны решительно контролировать их."
HOL_reaffirm_colonial_rule_desc:0 "Мы должны подтвердить, что являемся законными правителями Индонезии. Продвигать легитимность колониального правления и изолировать повстанческие силы. Индонезия навсегда останется голландской территорией."
HOL_expand_internal_security_desc:0 "С учетом угроз со стороны движения за независимость и коммунистов мы должны расширить и усилить внутреннюю безопасность. Увеличить полномочия полиции и разведки, усилив наблюдение и контроль."
HOL_integrate_indonesian_conscripts_desc:0 "Мы должны вербовать индонезийцев в наши вооруженные силы. Лояльные индонезийские солдаты будут ключом к борьбе с повстанцами и хорошо знают местную ситуацию."
HOL_army_effort_desc:0 "Чтобы удержаться в Индонезии, нам нужна сильная армия. Создавать новые дивизии, модернизировать снаряжение и улучшать подготовку, чтобы максимизировать нашу силу."
HOL_equipment_effort_desc:0 "С плохим снаряжением мы не можем победить. Мы должны сосредоточиться на улучшении и производстве оружия, артиллерии и бронетехники в достаточном количестве."
HOL_motorization_effort_desc:0 "Ключ к победе в джунглях — мобильность. Увеличить моторизованные части и производить грузовики и джипы для проведения быстрых операций."
HOL_doctrine_effort_desc:0 "Мы должны разработать военные доктрины, адаптированные к уникальным условиям Индонезии: бои в джунглях, горах и городах."
HOL_equipment_effort_2_desc:0 "Война угрожает затянуться. Необходимо дальнейшее улучшение снаряжения, особенно средств связи, медицины и логистики."
HOL_mechanization_effort_desc:0 "Необходимо расширить механизированные части. Внедрить бронетранспортеры и транспортные средства для быстрого и безопасного развертывания войск даже в джунглях."
HOL_doctrine_effort_2_desc:0 "С полученным опытом мы можем усовершенствовать наши доктрины, чтобы гибко реагировать и проводить комбинированные операции."
HOL_equipment_effort_3_desc:0 "Линии стабилизируются, и война становится войной на истощение. Стандартизация оружия и снаряжения и их массовое производство будут ключом к победе."
HOL_armor_effort_desc:0 "Повстанцы используют джунгли для своей партизанской войны. Мы должны усилить наши бронетанковые силы и улучшить танки и бронетехнику."
HOL_special_forces_desc:0 "Нам нужны силы специального назначения, способные скрытно действовать в джунглях, перерезать вражеское снабжение и атаковать ключевые цели."
HOL_aviation_effort_desc:0 "Контроль над воздухом будет решающим. Расширить военно-воздушные силы для выполнения разведывательных, бомбардировочных миссий и непосредственной поддержки."
HOL_fighter_focus_desc:0 "Чтобы защитить наше воздушное пространство и сдержать вражеские атаки, нам нужны современные и хорошо обученные истребители."
HOL_bomber_focus_desc:0 "Для уничтожения вражеских объектов и сосредоточений войск необходимы стратегические бомбардировщики."
HOL_aviation_effort_2_desc:0 "Требуется дальнейшее расширение военно-воздушных сил: больше заводов, баз и квалифицированного персонала."
HOL_CAS_effort_desc:0 "Непосредственная авиационная поддержка жизненно важна для наземных операций в джунглях. Мы должны разработать и развернуть легкие штурмовики."
HOL_rocket_effort_desc:0 "Ракетное оружие может изменить ход войны. Разработать реактивные установки и боеприпасы для уничтожения вражеских укреплений и бронетехники."
HOL_NAV_effort_desc:0 "Чтобы господствовать на море и в воздухе, нам нужны торпедные катера для атак на вражеские подводные лодки и корабли."
HOL_naval_effort_desc:0 "Индонезия — это архипелаг. Без контроля на море мы не можем победить. Мы должны построить флот и господствовать на морях."
HOL_flexible_navy_desc:0 "Из-за сложной географии Индонезии нам нужен гибкий и подвижный флот с хорошо скоординированными эсминцами, крейсерами и подводными лодками."
HOL_large_navy_desc:0 "В долгосрочной перспективе мы должны построить большой океанский флот с линкорами и авианосцами, чтобы утвердить наше военно-морское превосходство."
HOL_submarine_effort_desc:0 "Подводные лодки идеально подходят для блокирования снабжения и скрытых атак. Мы должны производить их массово, чтобы ослабить врага."
HOL_cruiser_effort_desc:0 "Крейсеры универсальны для разведки, эскорта и обстрелов. Строительство современных крейсеров повысит нашу гибкость."
HOL_destroyer_effort_desc:0 "Эсминцы имеют решающее значение для противолодочной войны и защиты флота. Мы должны производить их в большом количестве."
HOL_capital_ships_effort_desc:0 "Линкоры и авианосцы — ядро флота. Их строительство гарантирует окончательное военно-морское господство."
HOL_industrial_effort_desc:0 "В Индонезии почти нет промышленной базы. Чтобы продолжать войну, мы должны срочно расширить наши промышленные мощности."
HOL_construction_effort_desc:0 "Мы должны активизировать строительство, чтобы компенсировать нехватку инфраструктуры."
HOL_production_effort_desc:0 "Увеличение производства — ключевой момент. Улучшить процессы и оптимизировать рабочую силу, чтобы производить больше припасов."
HOL_rubber_effort_desc:0 "Индонезия — крупнейший производитель каучука. Мы должны расширить плантации и использовать это стратегическое преимущество."
HOL_infrastructure_effort_desc:0 "Плохая инфраструктура препятствует войне. Мы должны строить дороги, железные дороги, порты и аэродромы."
HOL_infrastructure_effort_2_desc:0 "Мы должны продолжать расширять военную и производственную инфраструктуру для улучшения боеспособности."
HOL_production_effort_2_desc:0 "Затягивание войны требует большего производства. Развивать тяжелую промышленность и расширять мощности."
HOL_construction_effort_2_desc:0 "Дальнейшее расширение строительных мощностей для крупномасштабных проектов."
HOL_nuclear_effort_desc:0 "Ядерное оружие — это окончательное оружие. Даже если мы не сможем развернуть его немедленно, мы должны начать программу."
HOL_extra_tech_slot_desc:0 "Нам нужно больше инвестиций в исследования. Расширить лаборатории и нанять больше специализированного персонала."
HOL_secret_weapons_desc:0 "Секретное оружие решит исход войны. Начать программы по ракетам, биологическому или гиперзвуковому оружию."
HOL_political_effort_2_desc:0 "Чтобы консолидировать военные усилия, мы должны усилить пропаганду, мобилизацию и чрезвычайные меры."
HOL_develop_indonesian_resources_desc:0 "Индонезия богата ресурсами. Мы должны максимально использовать их для продолжения войны."
HOL_reclaim_homeland_desc:0 "Наша конечная цель — вернуть Нидерланды. Подготовить операцию по освобождению и поддерживать высокий моральный дух."
HOL_indonesian_army_desc:0 "Создать лояльную индонезийскую армию для борьбы с повстанцами."
HOL_expand_indonesian_industry_desc:0 "Расширить индонезийскую промышленность, используя местные ресурсы и рабочую силу."
HOL_indonesian_military_industry_desc:0 "Развивать современную военную промышленность в Индонезии."
HOL_indonesian_naval_bases_desc:0 "Построить крупные военно-морские базы для усиления флота."
HOL_indonesian_air_bases_desc:0 "Построить крупные авиационные базы для господства в небе."
HOL_indonesian_infrastructure_desc:0 "Развернуть военную инфраструктуру по всей Индонезии."
HOL_indonesian_nuclear_program_desc:0 "Начать амбициозную ядерную программу в Индонезии."
HOL_indonesian_rocket_program_desc:0 "Стимулировать разработку ракет и ракетного оружия."
HOL_seek_soviet_support_desc:0 "Искать всестороннюю поддержку Советского Союза, даже ценой изменения нашей политической ориентации."
HOL_soviet_industrial_support_desc:0 "Получить советскую промышленную поддержку для модернизации Индонезии."
HOL_soviet_tank_designs_desc:0 "Приобрести лицензию на советские танковые проекты для усиления наших бронетанковых сил."
HOL_seek_american_support_desc:0 "Искать американскую поддержку в обмен на сохранение в западном блоке."
HOL_american_landing_craft_desc:0 "Перенять американские технологии для десантных операций."
HOL_usa_infnatry_support_desc:0 "Оснастить наши войска американским оружием."
HOL_soviet_aircraft_designs_desc:0 "Приобрести лицензию на советские авиационные проекты для нашей авиации."
HOL_soviet_naval_designs_desc:0 "Перенять советские военно-морские проекты для строительства современного флота."
HOL_soviet_research_cooperation_desc:0 "Сотрудничать с иностранными державами в передовых исследованиях."
HOL_american_industrial_support_desc:0 "Использовать американскую помощь для модернизации промышленности."
HOL_american_naval_designs_desc:0 "Перенять американские военно-морские проекты для улучшения нашего флота."
HOL_INS_war_idea_desc:0 "Хотя мы изгнаны в Индонезию, мы не сдадимся. Мы преодолеем трудности и вернемся на нашу родину."
HOL_capitalist_support_desc:0 "Мы пользуемся поддержкой местных капиталистов, которые предпочитают сохранять колониальную структуру."
HOL_lack_of_industrial_base_desc:0 "В Индонезии почти полностью отсутствует промышленность. Это серьезно препятствует войне."
HOL_developing_industrial_base_desc:0 "Мы начали развивать промышленную базу для поддержки военных усилий."
HOL_communist_menace_desc:0 "Индонезийские коммунисты представляют серьезную угрозу, и мы должны их раздавить."
HOL_war_of_retribution_desc:0 "Настал час возмездия. Мы вернем Индонезию и накажем тех, кто бросил нам вызов."
HOL_homeland_liberation_desc:0 "Конечная цель — вернуть нашу родину. Это истинная причина нашей борьбы здесь."
HOL_indonesian_resource_exploitation_desc:0 "Мы должны эксплуатировать обильные индонезийские ресурсы, чтобы подпитывать наши военные усилия."
HOL_soviet_military_advisors_desc:0 "Советские советники помогут обучать и улучшать наши силы."
HOL_american_military_advisors_desc:0 "Американские советники предоставят нам ценные тактические знания и современное снаряжение."
HOL_american_resource_trade_desc:0 "Расширить торговлю ресурсами для поддержания военной экономики."