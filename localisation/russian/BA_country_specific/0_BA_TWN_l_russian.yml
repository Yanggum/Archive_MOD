  #Национальный дух
  TWN_right_of_resistance_idea: "Воля народа Сеедик"
  TWN_right_of_resistance_idea_desc: "Даже после того, как остров Тайвань стал японской колонией, коренной народ Сеедик с Тайваня не сдался. Инцидент в Муша 1930 года был показательным событием, проявившим дух сопротивления народа Сеедик. Армия независимости под руководством вождя племени Сеедик Моны Рудао вела партизанские операции, используя гористую местность острова Тайвань, до самого конца, пока не была разгромлена Генерал-губернаторством Тайваня.\n\nБорьба 1930 года была подавлена, и Мона Рудао предпочел самоубийство плену, но знания о партизанской тактике и дух сопротивления для защиты острова Тайвань, которые они оставили, остались незабытыми."