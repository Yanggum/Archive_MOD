COG_event.1.t: "Великобритания рушится!"
COG_event.1.desc: "Великобритания рухнула перед лицом сущностей из иного мира. Мы больше не получаем даже ресурсов, а колонии кишат повстанцами; внутренний хаос неконтролируем. Как бы то ни было, судьба Бельгии мрачна."
COG_event.1.a: "Черт возьми."

COG_event.2.t: "Вспыхивают беспорядки"
COG_event.2.desc: "Туземцы Конго начали оспаривать наше господство, и с падением Великобритании их гнев вырвался наружу. Хозяин Конго может смениться. Мы должны действовать немедленно."
COG_event.2.a: "Подавить их всех, быстро!"

COG_event.3.t: "Беспорядки перерастают в гражданскую войну!"
COG_event.3.desc: "В ответ на жестокое подавление правительством национальных беспорядков туземцы Конго подняли восстание."
COG_event.3.a: "Да поможет нам Бог."