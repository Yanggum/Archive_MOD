l_russian:
#tt
ENG_stop_exile_1_tt: "§RЭто решение серьезно повлияет на планы эвакуации.§!"
ENG_tooltip_bonto_banger: "Будет добавлено §Yукрепление§! для обороны."
go_to_can_tt: "§RПлан эвакуации будет запущен, и мы отправимся в Канаду.§!"

# Фокусы
ENG_focus_fire_at_the_britain: "Финальная битва"
ENG_focus_fire_at_the_britain_desc: "Машинная корпорация, известная как Kaiser Corporation, не дала нам ни малейшего шанса на переговоры и безжалостно атаковала нас. Враг двигался со скоростью и агрессивностью морского льва, и в мгновение ока ключевые города, такие как Лондон, падали один за другим. Однако благодаря отчаянному сопротивлению наших сил мы смогли выжить и сражаться более двух месяцев. Это не просто война, это последняя битва за выживание Британии. Мы должны победить любой ценой... или бежать, чтобы выжить."
ENG_protect_liverpool: "Защитить Ливерпуль"
ENG_protect_liverpool_desc: "Ливерпуль стал жизненно важным стратегическим пунктом для Британии. Это место представляет нашу последнюю надежду и может стать базой, с которой мы начнем контрнаступление. Если мы сможем добиться здесь чудесного перелома, мы сможем переломить ситуацию и начать решающую контратаку."
ENG_the_defense_of_liverfool_tt_1: "§Y$VICTORY_POINTS_6384$§!:\n"
ENG_the_defense_of_liverfool_tt_2: "§Y$VICTORY_POINTS_6318$§!:\n"
ENG_AirForceUtilization: "Использование военно-воздушных сил"
ENG_AirForceUtilization_desc: "К счастью для нас, враг, кажется, не использует интенсивно свои военно-воздушные силы. Это возможность, которую мы должны использовать. Как говорится: 'кто владеет небом, владеет полем боя'. Настало время, когда наши ВВС должны сыграть свою решающую роль. Если мы добьемся превосходства в воздухе, мы еще сможем изменить ход войны."
ENG_Assault_Troops: "Создание штурмовых отрядов"
ENG_Assault_Troops_desc: "Мы формируем наши штурмовые отряды, чья миссия будет заключаться в прорыве вражеских линий, атаке на уязвимые тылы и разрушении их обороны быстрыми и точными ударами. Если эти войска будут тесно сотрудничать с ВВС, мы сможем сдержать вражеское наступление и выиграть время для контратаки. Это подразделение может стать нашим последним шансом."
ENG_building_a_position: "Строительство оборонительных позиций"
ENG_building_a_position_desc: "Все собирают обломки и возводят импровизированные песчаные насыпи. Время не на нашей стороне. Угроза новой вражеской атаки постоянна. Нет времени терять: нужно грузить, складывать и защищать, пока враг не пришел."
ENG_mercenary_recruitment: "Наем наемников"
ENG_mercenary_recruitment_desc: "Все больше иностранцев, многие из которых прибывают из самоуправляемых доминионов, хотят присоединиться к нашей войне. У многих есть ценный опыт, полученный в Великой войне. Нам отчаянно нужен этот опыт. Если мы наймем их и немедленно отправим на фронт, они смогут сыграть решающую роль в обороне Англии."
ENG_focus_colonies_one: "Единство Содружества"
ENG_focus_colonies_one_desc: "Война на британской земле становится все более интенсивной. Перед лицом вражеского наступления нам нужно собрать все возможные ресурсы из заморских доминионов. Если мы сможем укрепить единство Содружества, мы сможем сдержать вражеское вторжение. Это уже не просто британская борьба, это борьба всей империи."
ENG_Rule_the_Sky: "Господство в небе"
ENG_Rule_the_Sky_desc: "Мы должны полностью уничтожить вражескую авиацию. Их технология быстро развивается, и скоро они могут догнать нас. У нас мало времени. Нужно мобилизовать все наши самолеты и взять под контроль небо. Если мы не защитим наше небо, поле боя будет принадлежать им."
ENG_focus_militas_more: "Мобилизовать ополчение"
ENG_focus_militas_more_desc: "После Великой войны Англия погрузилась в иллюзию вечного мира и сократила свою армию. Но с внезапной атакой 1935 года мы снова грубо вернулись к войне. Теперь тысячи граждан берут в руки оружие, чтобы защитить свои дома. Если мы правильно их организуем, они смогут укрепить наши линии и сдержать врага."
ENG_Accelerate_exile_planning: "Ускорить план эвакуации"
ENG_Accelerate_exile_planning_desc: "Поражение уже реальность. Приходят только новости об отступлении, и наши войска не справляются. Не осталось ни сил, ни надежды. Чтобы избежать дальнейших смертей, мы должны ускорить план эвакуации и искать выход, пока не стало слишком поздно."
ENG_lessons_of_kaiser_war: "Уроки войны с Кайзером"
ENG_lessons_of_kaiser_war_desc: "Враг преподал нам суровые уроки. Они использовали фактор внезапности и свою скорость, чтобы захватить наши позиции, и их технология почти сокрушила нас. Но мы нашли их слабые места и смогли улучшить нашу технологию. Благодаря этому нам удалось сдержать их продвижение. Теперь пришло время использовать эти уроки для восстановления."
ENG_Industrial_facility_Relocation: "Перемещение промышленных объектов"
ENG_Industrial_facility_Relocation_desc: "Хотя большая часть нашей территории оккупирована, не все потеряно. Мы должны срочно переместить оставшиеся промышленные объекты в Канаду и другие безопасные доминионы. Время работает против нас."
ENG_underground_workshop: "Подземные мастерские"
ENG_underground_workshop_desc: "Нам нужно немедленно создать секретные мастерские в подземных районах Шотландии, которые еще не затронуты войной. Даже будучи импровизированными, они могут производить столь необходимое нам снаряжение. Нельзя терять время."
ENG_London_Industrial_Relocation: "Эвакуация промышленности Лондона"
ENG_London_Industrial_Relocation_desc: "Мы не можем допустить, чтобы промышленность и наследие Лондона попали в руки врага. Мы должны переместить все это в безопасные места как можно скорее. Если мы не сделаем этого сейчас, мы потеряем это навсегда."
ENG_WeWillWin: "Мы победим!"
ENG_WeWillWin_desc: "Отступление врага очевидно! Мы прорвали их оборону, и их базы в пределах досягаемости. Мы должны быстро атаковать, захватить их базу и гордо поднять Юнион Джек. Победа близка, и конец этой войны наконец виден!"
ENG_we_will_win: "$ENG_WeWillWin$"

# Дополнения
ENG_Victory_Mainland: "Победа на континенте"
ENG_Victory_Mainland_desc: "Мы одержали победу в борьбе на континенте."
ENG_Government_Return: "Возвращение правительства из изгнания"
ENG_Government_Return_desc: "Возвращение правительства из изгнания"

# Решения
britian_war: "Война Британии"
britian_war_desc: "Прошло три месяца с тех пор, как силы из иного мира, известные как Kaiser Corporation, вторглись на Британские острова. Битва продолжается, и ситуация становится все более неблагоприятной для нас. Чтобы выбраться из этой войны, мы разработали план эвакуации: чем дольше будет сопротивляться британская армия, тем больше припасов мы сможем отправить в Канаду."
give_can_fac: "Подготовить эвакуацию в Канаду"
go_to_can: "Выполнить план эвакуации"
ENG_stop_exile_1: "Разработать план контратаки"
ENG_stop_exile_2: "Отменить план эвакуации"

ENG_request_for_protection: "Запросить защиту"
ENG_request_for_protection_flag: "§YЗапрос защиты§! уже отправлен"
ENG_end_of_protection_flag: "Держава-покровитель по §Yзапросу защиты§!"
ENG_end_of_protection: "Прекратить защиту"

# Персонажи
ENG_british_army: "Объединенное командование британской армии"
ENG_british_army_DESC: "До того момента во время Великого Перехода, когда они столкнулись с неизвестными силами, Лондон полагался больше на благоразумие кабинета Болдуина, чем на высшее военное командование. Те дни, когда с оптимизмом верили, что мудрость демократии и уроки Великой войны разумно разрешат ситуацию, были разбиты снова и снова. В условиях все более интенсивной войны Георг V делегировал всю полноту власти Объединенному командованию британской армии вместо кабинета Болдуина, приказав ему сопротивляться до конца за Соединенное Королевство.\n\n...потому что целью было не просто победить врага, а добиться успешного отступления с Британских островов до этого. После долгих обсуждений Парламент пришел к отчаянному выводу, что победить врага невозможно. Поэтому, чтобы сохранить Британскую империю и подготовиться к будущему, было необходимо выиграть время. После Георга V Парламент последовательно бежал в Канаду, и на пустынной Даунинг-стрит осталось только Объединенное командование во главе с Бернардом Монтгомери.\n\nХотя король и Парламент больше не здесь, британцы и британская армия здесь. Отправить как можно больше активов в Канаду и выиграть время для посадки как можно большего числа британцев на корабли, направляющиеся в Канаду: такова главная миссия Объединенного командования.\n\nДо дня победы, Боже, храни Его Величество Короля и Соединенное Королевство."
ENG_edward_VIII: "Эдуард VIII"
ENG_george_VI: "Георг VI"
ENG_elizabeth_II: "Елизавета II"
IMP_kingsley_wood: "Кингсли Вуд"
ENG_Health_minister: "Министр здравоохранения"

# Черты
ENG_Last_Resistance: "Выиграть время\n§gВся Британия горит заживо. Крики боли разносятся эхом, но никто не приходит на помощь.§!"

# Идеи
ENG_defence: "Финальное сопротивление"
ENG_identify_weaknesses: "Выявление слабых мест"
CAN_arab: "Ближневосточная война"
ENG_idea_yung_yunbang_one: "Сплоченность Содружества"
ENG_operation_exile: "План эвакуации"
ENG_under_surprise_attack: "Под внезапной атакой"
ENG_save_the_liverpool: "Чудо Ливерпуля"
ENG_operation_exile_week: "Ослабление плана эвакуации"
CAN_british_disease: "Британская болезнь"
CAN_british_disease_desc: "Будем честны: как бы мы ни маскировали это под 'великую эвакуацию', неужели кто-то действительно верит, что перемещение населения, упаковывая его, как в старые времена черных рабов, не принесет с собой болезни?"
ENG_low_admin_Strength: "Ослабление административной мощи"
ENG_low_admin_Strength_desc: "Ослабление административной мощи привело к росту преступности, и гарнизоны колоний подвергаются атакам партизан из засад."
ENG_homless_n_health_1: "Проблема перемещенных лиц - серьезная"
ENG_homless_n_health_1_desc: "После окончания войны те, кто потерял свои дома из-за бомбардировок, начали жить под мостами, в разрушенных зданиях и заброшенных домах, ища убежища от ветра и дождя. Состояние здоровья и гигиены перемещенных лиц ужасающее."
ENG_homless_n_health_2: "Проблема перемещенных лиц - внимание"
ENG_homless_n_health_2_desc: "Благодаря военным палаткам и полевым госпиталям перемещенные лица получили места для жизни. Однако отсутствие надлежащих систем водоснабжения и канализации, а также сбора мусора, поддерживает ужасные санитарные условия."
ENG_disassembled_parliment: "Распущенный парламент"
ENG_disassembled_parliment_desc: "В октябре 1935 года премьер-министр Великобритании распустил Парламент в преддверии предстоящих выборов. Однако,"
ENG_dissolving_commonwealth: "Закат Содружества"
ENG_dissolving_commonwealth_desc: "Война с Kaiser Corporation ослабила Соединенное Королевство. Хотя колонии все еще следуют за нами, они будут стремиться уйти из-под нашего влияния."
ENG_great_depression_01: "Послевоенная Великая депрессия"

ENG_postwar_devastation: "Послевоенное опустошение"

# События
ENG_lose_global_flag: " §YСоединенное Королевство§! было побеждено §YKaiser Corporation§!"
ENG_win_global_flag: "§YСоединенное Королевство§! победило §YKaiser Corporation§!"
ENG_ba.1.t: "Объявление чрезвычайного положения"
ENG_ba.1.desc: "Чужаки, внезапно появившиеся в небе над Лондоном, без разбора атаковали гражданское население, и в одно мгновение юг Англии оказался в руках врага. Мы официально объявим чрезвычайное положение, чтобы противостоять им."
ENG_ba.1.a: "Сопротивляйтесь насилию!"

ENG_ba.2.t: "Решение"
ENG_ba.2.desc: "Никакого решения не видно..."
ENG_ba.2.a: "Это серьезно."

ENG_ba.3.t: "Запрос о помощи"
ENG_ba.3.desc: "Примите этот персонал."
ENG_ba.3.a: "Лучше, чем ничего..."

ENG_ba.4.t: "Выявление слабых мест"
ENG_ba.4.desc: "Мы нашли их слабые места."
ENG_ba.4.a: "Вот! Именно это!"

ENG_ba.5.t: "Проблема Геенны"
ENG_ba.5.desc: "Геенна, незаконно оккупировавшая север Шотландии, неоднократно игнорировала наши требования о выводе войск!"
ENG_ba.5.a: "Только насилие сможет их успокоить."

ENG_ba.6.t: "Вывод Геенны!"
ENG_ba.6.desc: "После великой войны, развернувшейся на Британских островах против Kaiser Corporation, и с обеспечением победы Британии, Геенна поспешно покинула Шотландию, забрав с собой все свои установки."
ENG_ba.6.a: "Невероятно."

ENG_ba.7.t: "Крах заморских колоний"
ENG_ba.7.desc: "После поражения Соединенного Королевства от сущностей из иного мира и его изгнания в Канаду приходят новости, что старые имперские колонии рушатся. Король Эдуард VIII, изгнанный в Канаду, кажется глубоко потрясенным этой новостью и не выступил с официальной позицией."
ENG_ba.7.a: "О нет."

ENG_ba.23.t: "Независимость Египта"
ENG_ba.23.d: "В разгар крайнего хаоса, охватившего Империю, Египет — до сих пор остававшийся в нашем подчинении — официально заявил о своем намерении изгнать наше влияние со своей территории. После долгих лет нахождения на орбите Британской империи Египет выбрал путь независимости, и с этим мы чувствуем, что Империя больше не сохраняет своего былого величия.\n\nДекларация независимости Египта вызовет сильный политический резонанс на всем Ближнем Востоке и в Северной Африке, и ее последствия нанесут тяжелый удар по авторитету нашей Империи. Растет беспокойство, что другие колонии последуют этому примеру, что является недвусмысленным признаком того, что сплоченность Британской империи рушится."
ENG_ba.23.a: "Британская империя рушится."

ENG_ba.24.t: "Вывод из Восточной Африки"
ENG_ba.24.d: "Пока хаос в Империи усиливается, мы репатриировали всех колониальных чиновников, чтобы гарантировать безопасность британцев в Восточной Африке и предотвратить потерю колониального капитала.\n\nМы надеемся, что эта мера ограничит потери, которые могут возникнуть из-за состояния анархии и неразберихи в регионе."
ENG_ba.24.a: "По крайней мере, мы избежали худшего."

ENG_ba.25.t: "Самоуправляемый доминион Западной Африки"
ENG_ba.25.d: "Перед лицом продолжающегося краха старых имперских колоний мы повысили статус Британской Западной Африки до самоуправляемого доминиона, чтобы предотвратить ее полный распад. Тем самым бывшие колонии Западной Африки приобретают статус, аналогичный статусу Канады и Австралии."
ENG_ba.25.a: "Это наименьшее из зол."

ENG_ba.8.t: "Активизация движения за независимость в Индии"
ENG_ba.8.desc: "После недавнего поражения от сущностей из иного мира колониальные власти в Индии прислали тревожные сообщения. Согласно им, движение за независимость радикализируется на всем субконтиненте, и народный гнев выражается гораздо более организованно и жестоко, чем раньше. В частности, коммунистические силы быстро расширяют свое влияние и объявляют различные формы борьбы против британского господства. Они выходят на улицы, организуют фабрики и сельские районы и скандируют антиимпериалистические лозунги."
ENG_ba.8.a: "Драгоценный камень Империи ускользает из наших рук."

ENG_ba.9.t: "Раздел Индии"
ENG_ba.9.desc: "В охваченной хаосом Империи Индии коммунисты начали восстание."
ENG_ba.9.a: "О нет."

ENG_ba.10.t: "Разделение"
ENG_ba.10.d: "После внезапного поражения Британии Индия была разделена, и теперь мы должны принять решение."
ENG_ba.10.a: "Мы одержим победу на всех территориях под властью Его Величества!"
ENG_ba.10.b: "Боритесь за освобождение народа и демократию!"
ENG_ba.10.c: "Да здравствует независимый Пакистан!"

ENG_ba.11.t: "Индийская революция"
ENG_ba.11.d: "Беспорядки переросли в мятежи, а мятежи — в революцию. Мы немедленно сформируем совет для ее руководства."
ENG_ba.11.a: "Порвите цепи!"

ENG_ba.12.t: "Массовые демонстрации"
ENG_ba.12.d: " Хотя тысячи индийских политических лидеров были заключены в тюрьмы, воля к колониальному сопротивлению не только не сломилась, но и горит с большей силой. То, что начиналось как мирные марши, превратилось в закрытие предприятий, всеобщие забастовки и крестьянское сопротивление, распространяясь и углубляясь по форме и масштабу, погружая колонию в водоворот.\n\nПравительство приказало вице-королю [RAJ.GetLeader] принять меры для подавления ситуации."
ENG_ba.12.a: "Немедленно разогнать их!"

ENG_ba.13.t: "Вражеское восстание"
ENG_ba.13.d: "В северо-восточных регионах лица, подстрекаемые левой пропагандой, развязали массовые беспорядки."
ENG_ba.13.a: "Дайте им отпор!"

ENG_ba.14.t: "Поражение"
ENG_ba.14.d: "Революционная армия оказалась сильнее, чем ожидалось, и колониальные власти едва могут поддерживать свои силы из-за резкого падения поддержки из метрополии. Наша резиденция вице-короля в Дели пала, и только после переговоров с революционерами мы добились временного прекращения огня."
ENG_ba.14.a: "Мы потеряли большую часть контроля."

ENG_ba.15.t: "Созванный совет"
ENG_ba.15.d: "Десятки тысяч людей со всей Индии — антиколониалисты, коммунисты, демократы, религиозные деятели, интеллектуалы и рабочие — собрались вместе. Мы находимся в решающем моменте, который определит настоящее и будущее Индии, то есть Бхарата."
ENG_ba.15.a: "Да здравствует Бхарат!"

ENG_ba.16.t: "Промышленность Бхарата"
ENG_ba.16.d: "После двух дней подготовки собрание разделилось на четыре фракции, по-видимому, по идеологическим линиям. Неру, Бос, Пиллаи и Ганди стали лидерами каждой. Кроме того, каждая фракция обсуждает и изучает различные политики для привлечения умеренного блока без определенной принадлежности. Через неделю после созыва совета разгорелись дебаты о модели промышленной структуры."
ENG_ba.16.a: "Организуем экономику на основе кооперативов!"
ENG_ba.16.b: "Национализируем всю экономику и свергнем класс капиталистов!"
ENG_ba.16.c: "Будем стимулировать рост с помощью свободного рынка и регулируемых предприятий!"
ENG_ba.16.e: "Сельское хозяйство — основа любой нации. Установим аграрную экономику!"

ENG_ba.17.t: "Оборона Бхарата"
ENG_ba.17.d: "Когда промышленные дебаты утихли, возникла новая тема: оборона. Фракции яростно спорят о военной доктрине, которую Бхарат должен принять."
ENG_ba.17.a: "Внедрим мобильную войну, основанную на обучении студентов в Германии."
ENG_ba.17.b: "Изучим использование крупных армий при советской поддержке."
ENG_ba.17.c: "Разовьем собственную полевую артиллерию для достижения самообороны."
ENG_ba.17.e: "Улучшим и примем традиционную окопную войну."

ENG_ba.18.t: "Религия Бхарата"
ENG_ba.18.d: "Когда еще один из спорных вопросов, казалось, решался, совет наслаждался кратким затишьем. Однако вскоре вспыхнули дебаты о статусе религии. Фракции Неру и Пиллаи отстаивали полное исключение религии из правительства, в то время как фракции Ганди и Боса принимали религиозное вмешательство."
ENG_ba.18.a: "Народ нуждается в вере."
ENG_ba.18.b: "Религия не должна вмешиваться в политику."

ENG_ba.19.t: "Дипломатия Бхарата"
ENG_ba.19.d: "С приближением окончания совета фракции представили свои окончательные компромиссы по внешней политике. Фракция Пиллаи и Коммунистическая партия Бхарата возглавили социалистический интернационализм; фракция Ганди отстаивала вечный нейтралитет и пацифизм; в то время как Неру и Бос продвигали экспансионистскую политику, основанную на национализме Бхарата."
ENG_ba.19.a: "Стабильность — вот что нужно Индии."
ENG_ba.19.b: "Мы должны освободить другие угнетенные народы мира."
ENG_ba.19.c: "За возрождение нации Бхарат!"

ENG_ba.20.t: "Роспуск"
ENG_ba.20.d: "Сессия совета завершилась, и наконец состоялись выборы главы государства."
ENG_ba.20.a: "Да здравствует первый президент, Чандра Бос!"
ENG_ba.20.b: "Товарищ Кришна Пиллаи поведет Бхарат!"
ENG_ba.20.c: "Джавахарлал Неру избран президентом!"
ENG_ba.20.e: "Под руководством Махатмы Ганди мы будем процветать!"

ENG_ba.22.t: "Еще одно восстание"
ENG_ba.22.d: "В регионе Мадраса рабочие, крестьяне и студенты восстали против существующей дискриминации и угнетения."
ENG_ba.22.a: "Мы должны спланировать, чтобы они присоединились к нам."

ENG_ba.26.t: "Ливерпуль защищен"
ENG_ba.26.d: "Благодаря тотальной борьбе граждан и британской армии нам удалось защитить Ливерпуль. Отсюда мы сможем начать контрнаступление или ускорить план эвакуации."
ENG_ba.26.a: "Великая победа."

ENG_ba.100.t: "Великобритания защищена"
ENG_ba.100.d: "Благодаря тотальной борьбе граждан и британской армии нам удалось защитить британскую родину. Теперь мы должны восстановить разрушенную нацию."
ENG_ba.100.a: "Мы пережили самое тяжелое время."

ENG_ba.101.t: "Послевоенное опустошение"
ENG_ba.101.d: "Хотя нам удалось защитить Великобританию, ожесточенные бои на территории метрополии глубоко опустошили некогда прекрасную страну. Выживание Соединенного Королевства будет зависеть от восстановления."
ENG_ba.101.a: "\"Роза, брошенная в мусор.\""

ENG_ba.102.t: "Опасения Болдуина"
ENG_ba.102.d: "Британское правительство вернулось на родину, но столкнулось с еще большей проблемой. Парламент, распущенный в октябре 1935 года для очередных выборов, увидел, что эти выборы были отложены из-за войны с Kaiser Corporation, и теперь..."
ENG_ba.102.a: "\"По крайней мере, мы должны сначала собрать кабинет министров\""

