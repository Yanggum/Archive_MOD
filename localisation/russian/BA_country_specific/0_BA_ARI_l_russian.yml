  ARI_event.23.t: "Сбрасывая преследователей"
  ARI_event.23.d: "Рейнхард Гейдрих: бывший начальник Главного управления безопасности старой Германии и, после Великого Перемещения, тот, кто реорганизовал СС и возглавил сопротивление. Однако после того, как Департамент юстиции Тринити в ходе своего расследования обнаружил, что он стоял за покушением на Сейю, Департамент юстиции Тринити начал упорно его преследовать, и ему не оставалось ничего другого, как abandon all undercover operations and flee.\n\nТаким образом, Рейнхард Гейдрих сумел стряхнуть преследование и бежать; он полностью отменил свой план эмиграции в США и после объявления о полном сотрудничестве Средней школы Ариуса с нацистской партией перебрался в Среднюю школу Ариуса во главе небольшой группы СС.\n\nПровозгласив своей целью окончательное уничтожение Генеральной академии Тринити и возрождение старой Германии, Рейнхард Гейдрих снова начал готовить новые операции."
  ARI_event.23.a: "Эти типы будут думать, что я мертв."

  ARI_event.70.t: "Формирование дивизий немецких изгнанников"
  ARI_event.70.d: "Многие немецкие изгнанники, если только получат снаряжение, смогут организоваться в полноценную армию, которая будет отправлена на фронт вместо нас."

  ARI_event.71.t: "Немцы, собирающиеся в [FROM.GetName]"
  ARI_event.71.d: "Ариус заявил о намерении восстановить после окончания войны государство немцев на бывшей немецкой территории. Этот курс вызвал огромную националистическую мобилизацию среди немцев в регионах под контролем Тринити, и вскоре начал формироваться Свободный немецкий легион, который будет сражаться за Ариус.\n\nЕсли мы не сможем решительно завершить войну, подавить это движение будет чрезвычайно трудно..."
  ARI_event.71.a: "Вспомните Первый собор!"
  ARI_event.71.b: "Вы все! Вы предатели!"

  ARI_story_event.1.t: "Тайная встреча с Кригсмарине"
  ARI_story_event.1.d: "Заброшенный третий док Данцига. Под гротескной тенью покрытых плесенью контейнеров, нагроможденных как монстры, Джёмаэ Саори стояла неподвижно, как тень, слившаяся с темнотой. Перед ней человек, сорвавший с себя погоны, с застывшим выражением лица держал портфель. Это был личный посланник адмирала Эриха Редера, сумевший прорваться сквозь сеть наблюдения Тринити.\n\nИнтересы обеих сил совпали в странно точной точке. Ариус отчаянно нуждался во внешней поддержке и морском пути снабжения, чтобы вырваться из изоляции; Кригсмарине нужна была «дыра», чтобы безопасно перегруппировать войска немецкой армии, находившиеся внутри Тринити на грани развала. Когда Саори красной ручкой провела линию на карте Балтики, соединив Данциг с Готландом, посланник тяжело кивнул.\n\nСогласно этому пакту, разрозненные немецкие силы на территории Тринити будут тайно переправлены через порт Данцига, контролируемый Ариусом, в безопасную зону Готланда. Взамен Ариус получит обещание военного снаряжения, накопленного Кригсмарине, и ограниченную поддержку против морской блокады.\n\nТолько бесстрастный обмен взглядами и красная печать на документах были единственными свидетелями этой опасной сделки. Заговор девушек, преследующих суету, и солдат, ставших призраками, молча завязался в ледяном воздухе морского ветра."
  ARI_story_event.1.a: "Враг моего врага — всего лишь полезный инструмент."

  ARI_story_event.2.t: "Доклад о деятельности Средней школы Ариуса"
  ARI_story_event.2.d: "\nНомер документа: ABS-000950202\nИнформатор: Ханекава Хасуми, заместитель главы Департамента юстиции\nПолучатель: Хост Тринити [TRM.GetLeader]\nКопия: Наземные силы Тринити\n\n-Введение\nДоклад об аномальных перемещениях припасов и потенциальной угрозе со стороны Средней школы Ариуса\n\nВ хаотичной обстановке после Великого Перемещения накапливаются сообщения полевых агентов, указывающие на то, что обстановка в автономной зоне Ариуса имеет тревожные признаки. На поверхности они выставляют себя «жертвами», которые, как и мы, были брошены в неизвестный мир, и под предлогом общей враждебности к Геенне завоевывают симпатии некоторых студентов.\n\nОднако оценка Аналитического отдела разведки иная. Это, очевидно, тактика обмана.\n\nВ последнее время, по сравнению с потреблением продовольствия, количество ввозимого Ариусом пороха и станков аномально возросло. Кроме того, повторяется феномен, когда неопознанные силы замечаются в слепых зонах на периферии Тринити и мгновенно исчезают. Это выходит далеко за рамки простых соседских патрулей: подозревается, что это организованная и военная фаза «подготовки к внедрению».\n\nИз-за общественного мнения внутри академии упреждающий удар невозможен. Но мы также не можем закрывать глаза на то, что эти типы точат ножи, нацеленные нам в горло.\n\nПрежде чем они осуществят «это», что готовят, мы должны разработать все возможные оборонительные меры. Отныне Департамент юстиции рекомендует объявить состояние чрезвычайной готовности."
  ARI_story_event.2.a: "Получено."

  ARI_story_event.4.t: "Ветра перемен"
  ARI_story_event.4.d: "Даже ледяной воздух прусского рассвета не мог стереть запах старой пыли с куч документов, нагроможденных на столе. То, что Ариус получил от войны с Тринити и последующей территориальной экспансии, было не только опьянением победой. Это также было тяжелое и липкое болото, плотнее пуль, носившее имя «администрация».\n\n«...Я не понимаю.»\n\nДжёмаэ Саори нахмурилась и швырнула доклад на стол, словно бросая его. Ее руки были созданы для спуска курка, но они совершенно не привыкли регулировать талоны на продовольствие на оккупированных территориях или рассматривать жалобы чужаков, которые все продолжали поступать.\n\nС дивана в углу Мисаки пробормотала бессильным голосом.\n\n«...Даже не смешно. Мы, раздававшие заплесневелый хлеб в руинах, теперь размахиваем административной властью чужой страны. Все суета. Чем больше тело, тем гуще тень.»\n«У-уээ... Лидер... по поводу тех запросов, что прислали новые администраторы... они говорят, что мы слишком «старой эры». Что если не... если не отвечать с большей... гибкостью, будут волнения... М-мне страшно...»\n\nДокумент, который Хиёри протянула ей с плачущим лицом, был полон красных предупреждающих пометок. Метод Ариуса — абсолютный контроль, образование, основанное на ненависти, и военная дисциплина — не мог смешаться с гигантской административной машиной оккупированных территорий и внешними культурами и начинал скрипеть. Продолжать давить все по-старому или частично принять «форму мира», которую мы так презирали, чтобы выжить?"
  ARI_story_event.4.a: "Еще не время меняться."
  ARI_story_event.4.b: "...Тебе есть что сказать, Адзуса?"

  ARI_story_event.5.t: "Гниющие линии снабжения"
  ARI_story_event.5.d: "За портовыми складами Данцига, в переулке, покрытом густой тьмой, то, что Цутинага Хиёри держала в руках с бледным лицом, была старая бухгалтерская книга.\n\n«У-уээ... Лидер, посмотрите на это. Это книга пайков Сектора 3 за этот месяц... цифры не сходятся. Консервы и медикаменты... половина исчезла. И говорят, что на рынке по бешеным ценам продают лекарства с нашей печатью...»\n\nПо мере затягивания войны даже дисциплина, острая как иней, которую Ариус поддерживал в начале, начала давать трещины. Солдаты и младшие чиновники истощались в бесконечной войне, и инстинкт выживания деформировался в алчность: начали отклонять припасы. Даже жандармы, обязанные следить, отводили глаза, жуя подкупленный шоколад.\n\n«Лить воду в дырявую бочку.»\n\nМисаки тихо пробормотала. Она сидела на пустом ящике из-под боеприпасов, как на стуле.\n\n«Ненавистью желудок не наполнишь. Все начали искать способ выжить. Разве мы не учили их «выживанию»? Вот результат.»\n\nСаори сильно нажала на висок. Управлять, угрожая пистолетом и страхом, работало в небольшой партизанской группе. Но для нынешнего Ариуса, с огромным населением, обширной территорией и сложными распределительными сетями, простая «система пайков» достигла своего предела. Чтобы вырезать гниющие ткани, возможно, недостаточно просто поймать воров: возможно, придется изменить саму форму функционирования экономики."
  ARI_story_event.5.a: "...Пока что заприте их всех в камеры-одиночки."

  ARI_story_event.6.t: "Ночь, когда летят стекла"
  ARI_story_event.6.d: "Бах! Резкий звук разорвал ночь Данцига. Это был сигнал.\n\nМагазины, работавшие на капитал Генеральной академии Тринити — витрины с элегантными чашками, элитным чаем и куклами Пероро — были вдребезги разбиты военными ботинками. Там были подстрекатели из бывших СС, безработные немцы и, прежде всего, студенты Ариуса, взрывавшие сдерживаемую ненависть.\n\n«Бейте все! Пусть не останется ни одной вещи, пахнущей Тринити!»\n\nПосреди горящей улицы Саори, скрестив руки, безучастно наблюдала за сценой. Испуганные торговцы вытаскивались наружу, а награбленные предметы катились по земле.\n\n«...Лидер, это... не следует ли нам остановить? Жандармы даже помогают им...»\n\nХиёри спросила, волнуясь, наступая на осколки стекла. Мисаки закурила сигарету от пламени и сухо ответила.\n\n«Оставь. Это разрядка. Эти типы бьют не владельца магазина. Они бьют иллюзию под названием «Тринити», которая их заперла. ...По-детски, но эффективно.»\n\nКак заметила Мисаки, этот грабеж — не простое преступление. Это способ, которым гнев Германии и Ариуса, подавляемый так долго, выплескивается с самых низов; глубокая эмоциональная трещина, которую нельзя закрыть одним ударом. В глазах Саори мерцал красный огонь. Она может остановить это… или раздуть еще сильнее."
  ARI_story_event.6.a: "Я позволяю вашу ненависть. Сотрите следы Тринити."
  ARI_story_event.6.b: "Опубликуйте административный указ, официально запрещающий грабежи."

  ARI_story_event.7.t: "Диссонанс"
  ARI_story_event.7.d: "БАХ!\n\nЗвук тяжелой дубовой двери, захлопнувшейся, разорвал тишину кабинета. Пыль посыпалась с косяка на ковер, и Саори, отсутствуя, смотрела на закрытую дверь, пока вибрация не утихла. На столе остался одиноко лежать черновик речи, исполосованный красными пометками.\n\nТо, что наполняло эту комнату еще мгновение назад, было острым голосом Ширасу Адзусы. Бегло просмотрев текст, который передала ей Саори, Адзуса демонстративно бросила его на стол, и ее взгляд был, без сомнения, полон презрения.\n\nПосле обмена упреками Адзуса пристально посмотрела на Саори, и в этих глазах уже не было ни восхищения, ни послушания прошлого. Уже давно она видела в Саори не «лидера», а «старый порядок», который нужно преодолеть.\n\nПосле этого молчания Адзуса развернулась и ушла, не сказав ни слова. Саори, сжимая пульсирующий висок, думала: как и указала Адзуса, государство уже было расколото. Те, кто, опьянев от победы, хотят довершить месть; и те, кто хочет построить новый дом на руинах. Дезертирство Адзусы сегодня сделало эту трещину необратимой, и казалось, что она никогда больше не закроется."
  ARI_story_event.7.a: "Принять консервативную речь."
  ARI_story_event.7.b: "...А если немного подправить речь?"
  ARI_story_event_7_tt: "§gАдзуса теперь действует как лидер реформистов.§!"

  ARI_news.1.t: "Провозглашение собора Ариуса"
  ARI_news.1.d: "Сегодня на рассвете в руинах собора на бывшей территории Генеральной академии Тринити — в настоящее время оккупированной Средней школой Ариуса — было объявлено заявление, которое потрясет весь Кивотос.\n\nСредняя школа Ариуса, десятилетия назад объявленная «еретиком» на Первом соборе и стертая из истории, официально провозгласила «Собор Ариуса», полностью перевернув обвинение и объявив «еретиками» все фракции Тринити, кроме своей собственной.\n\nНа трибуне [FROM.GetLeader] из Ариуса заявил(а), что только вера Ариуса, закаленная исключительно через боль и ненависть, является истинной верой. Это выходит за рамки простого отделения: это, де-факто, «декларация об уничтожении», отрицающая в корне легитимность Тринити — крупнейшей академии Кивотоса — и объявляющая, что они намерены занять ее место."
  ARI_news.1.a: "Vanitas vanitatum, et omnia vanitas."
  ARI_news.1.b: "Это непостижимое богохульство!"
  ARI_news.1.c: "Смогут ли они победить?"

  ARI_news.2.t: "Падение Тринити"
  ARI_news.2.d: "Сегодня на рассвете на шпиле Собора Тринити, где огонь утих, был поднят черный флаг Ариуса вместо разорванного штандарта Чайной партии. Пока весь Кивотос затаил дыхание, [FROM.GetLeader] из Ариуса объявил(а) на алтаре, превращенном в руины, «о полном конце Тринити» и «об объединении под эгидой Ариуса».\n\nТо, что мир списал как «тщетные бредни изгнанников» или «преходящий террор» — содержание Второго собора Ариуса — стало холодной, неопровержимой реальностью, и все доктрины Тринити определяются как «ересь» и бросаются в огонь.\n\nРечь победителя была краткой, но вес ее никогда не был легким. Те, кто затаил дыхание во тьме подземных катакомб, в конце концов поглотили мир света и стали хозяевами крупнейшей академии. Безумие Ариуса стало уже «историей», которую никто не может отрицать."
  ARI_news.2.a: "Бог умер. Сегодня, несомненно."
  ARI_news.2.b: "Порядок Кивотоса изменился навсегда."

  # Динамические модификаторы

  ARI_two_cities: "Два города"
  ARI_two_cities_desc: "Этот город, разделенный между Данцигом и Средней школой Ариуса по обе стороны реки, еще не интегрирован."

  ARI_gottglaubig: "Gottgläubig"
  ARI_gottglaubig_desc: "Вера Ариуса, закаленная ненавистью к Тринити, теперь изменилась в другую форму. Пока все крылатые не падут на землю, новая вера Ариуса будет сиять.\n\nGottgläubig, отрицающая не только Троицу, но и само христианство, является уникальной религией, свойственной Ариусу и Национал-социалистической немецкой рабочей партии. Они пожирают и отвергают существующие религиозные системы и верят только в бога, создавшего этот мир."

  ARI_arian_faith: "Арианская вера"
  ARI_arian_faith_desc: "Ариус, изначально одна из многих филиальных школ, составлявших Генеральную академию Тринити, был объявлен ересью на Первом соборе и стал врагом всех остальных школ. Так, Ариус все бросил и скрылся в месте, о котором никто не знал, ожидая возможности снова появиться в мире, когда месть Тринити будет готова.\n\nДействительно, так и должно было быть. Но после странного события Великой войны Ариус был вынужден выйти в мир, как будто его вышвырнули, пытаясь сдержать хаос и предотвратить коллапс академии.\n\nАрианская вера — это сумма всех идеологий Средней школы Ариуса, и ее корень — ненависть к Тринити."

  ARI_arian_faith_tt: "Модификаторы §Y[ARI_arian_faith_tooltip]§!:"
  ARI_guerrilla_warfare: "Партизанская война"

