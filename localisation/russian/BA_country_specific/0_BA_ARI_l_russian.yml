  AASRU_progressbar_tt: "Доверие к реформе: [?AASRU_var|C.0]"
  AASRU_progressbar_tt_delayed: "§L§YДоверие к реформе§! необходимо для завершения определенных фокусов и должно поддерживаться непрерывно с помощью §Yрешений§! и §Yсобытий§!.§!"
  AASRU_desc: "§YДжёмаэ Саори§! получила §Yдиктаторские полномочия§! во время своего руководства ветвью Ариуса, и они сохраняются даже после §tпринятия§! манифеста §4фракции реформистов§! для предотвращения гражданской войны. Поскольку §YШирасу Адзуса§! добилась того, что ее §tоппозиция§! немедленному отстранению §YСаори§! была принята, любые §4реформы§!, требуемые §4фракцией реформистов§!, потребуют, чтобы §YАдзуса§! §tлично§! §tубеждала§! §YСаори§!."
  AASRU_end1_desc: "После завершения §4Конституции Республики§! §YДжёмаэ Саори§! §Rушла в отставку§! со всех государственных должностей. Неоднозначность конституции между властью §YПредседателя Студенческого совета§! и вновь созданного §YПремьер-министра§! вызвала интенсивное политическое давление со стороны §4фракции реформистов§!. Не в силах разрешить конфликт, Саори с горечью оставила руководство Ариусом."
  AASRU_end2_desc: "Вскоре после §4Конституции Республики§! §YДжёмаэ Саори§! неожиданно §Rподала в отставку§!, вопреки ожиданиям §YШирасу Адзусы§!. Хотя Адзуса предложила ей почетную должность как символ нового правительства, Саори §tотказалась§! без колебаний. Она сочла свою роль законченной на переходном этапе и исчезла за кулисами, оставив будущее в руках Адзусы."
  AASRU_end3_desc: "Посредством §4Конституции Республики§! §YДжёмаэ Саори§! и §YШирасу Адзуса§! закрепили §Gидеальную двуглавую систему§!. Согласно конституции §Yсистемы академия-государство§!, продвигаемой Адзусой, Саори принимает роль, эквивалентную §YПрезиденту§!, уравновешивая и контролируя §YПремьер-министра§! и §YПарламент§!. Взаимное доверие между ними стало новой опорой Ариуса."
  AASRU_progressbar_end_tt: "История реформы §YДжёмаэ Саори§! и §YШирасу Адзусы§! подошла к концу."
