  TRM_heart_strike_plan: "Реагировать на деятельность Ариуса"
  TRM_heart_strike_plan_desc: "Несомненно, Средняя школа Ариуса что-то готовит против нас, но так как публика была обманута анти-Геенна и про-Тринити пропагандой, распространяемой Ариусом, прямое вмешательство будет возможным только после того, как они фактически осуществят этот секретный план. До этого мы должны сделать все, что в наших силах, чтобы подготовиться к их нападению.\n\nНачалось §Gсоревнование очков§! между §YAриусом§! и §YТринити§!. Если §YAриус§! наберет больше §Gочков§!, чем §YТринити§!, он добьется §Rразрушительного воздушного удара§!; если нет, добьется §4незначительного воздушного удара§!. Мы не можем знать точные §Gочки§! врага: можем только знать, в каком §Gдиапазоне§! они находятся.\n\nВ настоящее время наши очки ([ARI_heart_strike_plan_TRM_VAR] очков).\nОчки соперника, похоже, находятся в диапазоне ([ARI_heart_strike_plan_ARI_VAR_LOC] очков)."

