  # Дипломатические события
  ARI_diplomatic_event.1.t: "Секретный контакт"
  ARI_diplomatic_event.1.d: "Из Средней школы Ариуса нам передали конфиденциальную информацию: если они решат вторгнуться в Тринити, они предоставят нам необходимые для нашей войны данные и тайно сообщили нашему руководству, что Ариус планирует атаковать Тринити в ближайшем будущем.\n\nМы можем принять их запрос и подготовить вторжение против Тринити или проигнорировать их и отправить обратно."
  ARI_diplomatic_event.1.a: "Хорошо. Готовьте вторжение."
  ARI_diplomatic_event.1.a.tt: "При прямом завершении фокуса §Y$GEM_war_with_trinity$§! получаются временные национальные духи, помогающие в войне против §Y[TRM.GetNameWithFlag]§!, а также §Yстабильность§! и §Yподдержка войны§!. Также значительно смягчаются требования для завершения фокуса."
  ARI_diplomatic_event_1_a_tt: "\nПомощь Ариуса:"
  ARI_diplomatic_event.1.b: "И почему мы должны вам доверять?"
  ARI_diplomatic_event_1_a_idea: "Получение оперативных карт Тринити"
  ARI_diplomatic_event.11.t: "Одобрение Пандемониума"
  ARI_diplomatic_event.11.d: "Фракция Пандемониума подписала секретный пакт, обязуясь вторгнуться, и предоставила нам свои оперативные карты. Скоро начнутся приготовления к атаке на Тринити."
  ARI_diplomatic_event.11.a: "Мы тоже должны готовиться к вторжению."
  ARI_diplomatic_event.12.t: "Отказ Пандемониума"
  ARI_diplomatic_event.12.d: "Фракция Пандемониума отклонила наше предложение о сотрудничестве и твердо заявила, что не будет участвовать в безрассудной авантюре. Похоже, войну с Тринити придется отложить до тех пор, пока они не изменят свое мнение, или нам придется вести ее в одиночку."
  ARI_diplomatic_event.12.a: "Типично для этих рогатых типов."

