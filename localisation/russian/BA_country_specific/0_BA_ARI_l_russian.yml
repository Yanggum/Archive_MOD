  # Идеи Ариуса
  BA_ARI_bitter_revanchism_3: "Ветвь Ариуса"
  BA_ARI_bitter_revanchism_3_desc: "Ветвь Ариуса была подобна машине, работающей исключительно ради мести Тринити и Геенне. И эта машина мести теперь достигла своей цели.\n\nВетвь Ариуса, изгнанная с древнего собора, с гордостью низвергла Объединенную академию Тринити, само порождение того собора, и снова поднялась. Ветвь Ариуса, переписавшая свое поражение в прошлом как победу будущего, чтобы восстать вновь, больше никогда не скроется в тени."

  BA_ARI_bitter_revanchism_GER: "Немецкий национальный реваншизм"
  BA_ARI_bitter_revanchism_GER_desc: "На земле, покрытой пеплом и пылью, орел снова взмыл ввысь. Великая родина, которая заставит вновь сиять рухнувшие идеалы Германии, вернулась.\n\nНовый идеал немецкого народа, возрожденный из руин, громко возвысит свой голос к миру. Чтобы провозгласить, что Германия вернулась.\n\nЗиг хайль! (Зиг хайль!)"

  BA_ARI_tragedy: "Прелюдия трагедии"
  BA_ARI_tragedy_desc: "Когда исчез взрослый, направлявший Ариус, осталось лишь смятение. Вспыхнули бесчисленные внутренние войны и столкновения, чтобы заполнить вакуум власти, и даже эскадрилья Ариуса не смогла стать исключением в этом хаосе. Они тоже сначала совершили государственный переворот и захватили власть под предлогом предотвращения коллапса Ариуса, но с того момента, как они вкусили сладкий плод по имени власть, внутренний конфликт стал неизбежной реальностью.\n\nКогда же начался занавес этой трагедии? С тех пор, как после Великого Перемещения столкновение мнений между Хикари Ацуко и Джёмаэ Саори еще более усилилось. Ацуко утверждала, что ради будущего Ариуса нужно открыть границы и улучшить отношения с Тринити. Вместо этого Саори восклицала, что сейчас самое время свести счеты с ненавистью прошлого века и кровным долгом.\n\nИх позиции были слишком различны, чтобы сосуществовать в рамках одной организации, и этот конфликт угрожает поглотить весь Ариус. Когда удастся заделать эту трещину? Или ее исход будет не чем иным, как очередным коллапсом?"

  ARI_manpower: "Эскадрилья Ариуса"
  ARI_make_collapse: "Разрушенное высшее командование"
  ARI_make_collapse_desc: "Говоря мягко, они выжили; говоря иначе, едва спасли свои жизни. В своем нынешнем состоянии высшее командование Чайной партии недостаточно дееспособно, чтобы контролировать и направлять Тринити, и ему потребуется немало времени, чтобы полностью восстановиться."
