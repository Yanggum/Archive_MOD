## 대사 샘플링
# 시라즈 아즈사
# - 시라스 아즈사. 트리니티 학원에 전학온 지는 얼마되지 않았어. 특기는 단독 행동. 장점은 작아서 엄폐가 쉽다는 거 정도⋯일까. 또 궁금한 거 있어?
# - 모든 것이 헛되다면 우리는 어째서 살아있는 걸까⋯⋯. 응? 아, 아무 것도 아니야
# - 임무. 목표. 달성. 다른 걸 생각해본 적은 없었어⋯ 지금까지는.
# - ⋯⋯나도 알아. 내가 재미 없다는 걸. 그런 걸 기대했다면, 미안해.
# - 이쪽은 어느 정도 정리됐어. 가자.
# - 아직 괜찮아. 다른 일도 있다면 맡겨줘.
# - 으, 으응. 신경써줘서 고마워.
# - 이런 감정⋯. 예상하고 있지 않았는데⋯⋯.
#
# 조마에 사오리
# - 아리우스 스쿼드의 사오리다.
# - 적어도 신세진만큼의 일은 하겠어. 잘 부탁해.
# - 내가 도움이 되고 있나?
# - 모든 것은 헛될 텐데 어째서 우리들은 살아있는 걸까⋯ 나는 아직 그 답을 알지 못해.
# - 전투 준비 완료.
# - 아무래도 축제 같지만⋯ 특별히 흥미는 없어. 그저 헛될 뿐이야.
#
# 이마시노 미사키
# - 아리우스 스쿼드의 미사키. 말하자면 주인을 잃은 사냥개 중에 하나. 목줄은 그쪽에 있으니까, 마음대로 명령해.
# - 잡담은, 적극적으로 하는 편은 아니야. 그게 명령이라면 뭐, 따르겠지만.
# - 내 역할은 다하겠어.
# - 흙은 흙으로.
# - 시킨 대로 한다. 단지 그뿐이야.
# - 왠지 흥미가 있는 모양인데⋯⋯. 날 믿지 않는 편이 좋을 거야.
# - 이 차갑고 시끄러운 세계도⋯⋯ 나도. 비가 내린다고 깨끗해지지는 않아.
# 
# 츠치나가 히요리
# - 헤헤헤⋯ 결국 저도 여기에 와버렸네요. 앞으로 괴롭겠죠? 힘들겠죠? 그치만 그게 인생이라고 배웠으니⋯ 어쩔 수 없겠네요. 히요리입니다. 잘부탁드려요⋯ 헤헤
# - 뭔가가 있다면 말씀해 주세요⋯⋯ 내용에 따라서는 혹시 도움이 될 지도⋯⋯
# - 얼마 전에, 그런 잡지에서 여러 가지를 읽고 왔으니까요. 에헤헤⋯⋯ 뭔가 도움이 될 지도 예요⋯⋯.
# - 엣, 저, 저요!? 그러니까, 더욱 괴로워하라는... 그런 건가요?
# - 뭔가 좋아보이는 살림살이들이 잔뜩 있네요.
# - 주워올리다 떨어뜨려서, 또다시 쓴맛을 보게 하는... 그런 거죠?
# 
# 하카리 아츠코
# - 바라는 게 있다면 뭐라도 말해 줘.
# - 응? 내 얼굴에 뭐라도 묻었어?
# - 뭔가, 부탁하고 싶은 것이 있다면 말해 줘.
# - 지원 확인했어. 고마워.
# - 여기⋯⋯ 꽃을 놓아 두면 좋을 것 같아.
# - 생일⋯? ⋯응. 어떤 의미인지 알고 있어. 배웠으니까. 축하를 받았다면, 감사해야 한다는 것도. 그러니까, 고맙습니다.
# - 이렇게 받은 걸, 언젠가 되돌려줄 수 있는 날이 올까?