  ARI_commencement_of_full_scale_political_maneuvering_tt: "Разблокируются §Yрешения§! для подготовки крупной внезапной штурмовой операции против §YТринити§!.\n§RЭтот выбор приведет к войне.§!"
  TRM_heart_strike_plan_tt: "Разблокируются §Yрешения§! для реагирования на кризис крупной внезапной штурмовой операции со стороны §YAриуса§!.\n§RЭто неизбежно приведет к войне.§!"

  ARI_heart_strike_plan: "План удара в сердце"
  ARI_heart_strike_plan_desc: "Чтобы получить начальное преимущество против такого сильного врага, как Тринити, Средней школе Ариуса нужны *обширные* операции по внедрению, внезапный террор для паралича военной деятельности Тринити и молниеносная война для захвата ключевых точек в считанные мгновения. С этой целью мы начнем крупные приготовления.\n\nНачалось §Gсоревнование очков§! между §YAриусом§! и §YТринити§!. Если §YAриус§! наберет больше §Gочков§!, чем §YТринити§!, мы добьемся §Rразрушительного воздушного удара§!; если нет, добьемся §4незначительного воздушного удара§!. Мы не можем знать точные §Gочки§! врага: можем только знать, в каком §Gдиапазоне§! они находятся.\n\nВ настоящее время наши очки ([ARI_heart_strike_plan_ARI_VAR] очков).\nОчки соперника, похоже, находятся в диапазоне ([ARI_heart_strike_plan_TRM_VAR_LOC] очков)."

