  ARI_trinity_pacifism_idea: "Пацифизм Тринити"
  ARI_arius_guerrilla_activity_idea: "Партизанская деятельность Ариуса"
  ARI_apocalypse_angel_activity_idea: "Ангел Апокалипсиса"

  ARI_story_event.8.t: "Пропаганда дает результаты"
  ARI_story_event.8.d: "Из-за постоянной пропаганды, которую наша Средняя школа Ариуса вела с Великого Перемещения, внутри Тринити разразилась неразбериха. Кроме того, наши готовящиеся партизаны атакуют припасы внутри Тринити, и ангелы Ариуса, рожденные из Porta Fasis, также действуют на вражеском фронте, чтобы помочь нам.\n\nХотя это вторжение помешало нам выполнить план войны против Тринити, который мы хотели, так как враг сам отодвинул свою собственную легитимность, мы получили способность повергать их в хаос на еще более долгое время."

  ARI_story_event.9.t: "Публичный альянс студентов Тринити за солидарность с Ариусом"
  ARI_story_event.9.d: "Случилось то, чего мы ожидали. С тех пор как начал распространяться слух, что мы готовим объявление войны против Средней школы Ариуса, среди студентов Тринити и немцев начала консолидироваться пацифистская тенденция; и в тот момент, когда начались реальные военные действия, бесчисленные группы — включая студентов с передовой Тринити — подняли флаг пацифизма и начали препятствовать нашей войне.\n\nКроме того, проблемой стали также «ангелы», которые вместе со звуками труб на фронте мешают ходу войны; и партизаны Ариуса, неизвестно с каких пор смешавшиеся среди нас, наконец начали в больших масштабах грабить наши линии снабжения.\n\nНачалась худшая война для Тринити. Не потому что враг силен или народ его поддерживает, а из-за хаоса, рожденного из этих близких и одновременно далеких отношений между Ариусом и Тринити, который теперь проявляется перед нами."

  # Военные операции Тринити
  ARI_permanent_anti_trinity_military_operation: "Полупостоянная военная операция против Тринити"
  ARI_permanent_anti_trinity_military_operation_trigger: "Началась §Rтотальная война§! §YAриуса§!. Этот приказ об операциях, который действует постоянно до капитуляции §Y[TRM.GetNameWithFlag]§!, увеличивает со временем, §Rнепрерывно§!, §Yштрафы§!. При завершении фокуса §YПроведение собора Ариуса§! §Rнепрерывно§! растущие §Rштрафы§! исчезают.\n\n§YОрганизация дивизий§! будет уменьшаться в каждом цикле решений на §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§! до максимума §R-90%§!.\n\n"
  ARI_permanent_anti_trinity_military_operation_tt: "Модификаторы §Y$ARI_permanent_anti_trinity_military_operation$§!:"
  ARI_decision_permanent_anti_trinity_military_operation: "Наступающие призраки"
  ARI_decision_permanent_anti_trinity_military_operation_desc: "Звучит наша трагедия мести, та, что должна свершиться, даже если сгорят все Тринити… и даже Ариус. Настало время, чтобы они тоже услышали крик, который издают все студенты Ариуса, и историю Средней школы Ариуса, павшей в прошлом. Даже если мы потерпим неудачу, мы оставим им месть, вонзенную в них. В любом случае.\n\nТекущая организация дивизий: §R[?ARI.ARI_PATMO_idea_army_org_factor|%+1]§!\n§YОрганизация дивизий§! будет уменьшаться в каждом цикле решений на §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§! до максимума §R-90%§!."
  ARI_mission_permanent_anti_trinity_military_operation: "§8Гаснущие огни§!"
  ARI_mission_permanent_anti_trinity_military_operation_tt: " Организация дивизий: §Rштраф§! §Gисчезает§!."
  ARI_mission_setback_reinforcement: "§pПроисходит неудача§!"
  ARI_mission_setback_reinforcement_tt: "В каждом цикле решений §Y$MODIFIER_ARMY_ORG_FACTOR$§!, который уменьшается, §Rизменяется§! на §R-2.0%§!"
  ARI_mission_goal_achievement_failure: "§RПровал плана§!"
  ARI_mission_goal_achievement_failure_tt: "В каждом цикле решений §Y$MODIFIER_ARMY_ORG_FACTOR$§!, который уменьшается, §Rизменяется§! на §R-5.0%§!"

  ######
  ARI_reinhard_heydrich_category: "Деятельность Рейнхарда Гейдриха"
  ARI_reinhard_heydrich_category_desc: "Рейнхард Гейдрих — обергруппенфюрер СС и начальник Главного управления безопасности. И теперь, внутри Ариуса, он снова мечтает о возрождении Германии, и в процессе может активно сотрудничать с Ариусом. Последний уголек национал-социализма снова вспыхнет здесь."
  ARI_reinhard_heydrich_1: "Речь: еще раз"
  ARI_reinhard_heydrich_1_desc: "Кто осмелится снова мечтать о Фюрере? Это абсурдно. Мы просто... вытащим этих проклятых крылатых, что растоптали нашу землю и разбили наши мечты, вырвем их из их удобной колыбели и швырнем в холодную реальность."

  ARI_trinity_academy_dissolution: "Роспуск академии Тринити"
  ARI_trinity_academy_dissolution_desc: "Теперь мы распустим академию Тринити, которая долгое время правила регионом Тринити, и установим наше господство. Мы устраним всевозможные символы, включим в историческое образование военные преступления, совершенные Тринити, и низвергнем их напыщенное положение «одной из трех великих академий»."
  ARI_establishment_of_administrative_districts: "Создать административные округа в §Y[FROM.GetName]§!"
  ARI_coring_this_trinity_state_in_progress_flag: "Этот регион в настоящее время интегрируется"

