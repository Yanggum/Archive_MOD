  ARI_imminent_d_day: "День судьбы"
  ARI_imminent_d_day_tt: "§RКогда настанет час, мы нанесем воздушный удар по Тринити, и результат будет зависеть от того, насколько тщательной была наша подготовка...§!"
  TRM_imminent_d_day: "Предполагаемая дата"
  TRM_imminent_d_day_tt: "§RКогда настанет час, Средняя школа Ариуса нанесет по нам воздушный удар, и результат будет зависеть от того, насколько тщательной была наша подготовка...§!"

  ARI_day_of_doom_idea: "День гибели"
  ARI_day_of_doom_idea_desc: "Средняя школа Ариуса внезапно совершила волну разрушительного терроризма, невообразимого масштаба, против всех наших командиров полевых операций, полностью превзойдя даже наши контрмеры. В результате мы временно потеряли всякую способность к военному ответу. Мы должны сконцентрировать все усилия на ее восстановлении и любой ценой остановить атаку Ариуса!"
  ARI_day_of_doom_idea_1: "День унижения"
  ARI_day_of_doom_idea_1_desc: "Теракты Средней школы Ариуса повергли всю нашу академию в шок и вынудили обсуждать экстренные контрмеры. Мы должны сделать все возможное, чтобы восстановить временно утраченный военный контроль!"

  ARI_story_event.3.t: "[THIS.GetName] ранен(а)"
  ARI_story_event.3.d: "Несмотря на нашу защиту, [THIS.GetName] [THIS.GetRank], командовавший(ая) силами против Ариуса, был(а) атакован(а) трусливой террористической бомбардировкой Ариуса. [THIS.GetSheHeCap] был(а) ранен(а), и, похоже, потребуется время для полного восстановления. Пока он(а) не поправится, он(а) не сможет действовать с обычной эффективностью."

  ARI_news.3.t: "Тринити погружается в хаос"
  ARI_news.3.d: "Сегодня на рассвете одновременная волна взрывов невероятного масштаба прогремела по всей Генеральной академии Тринити, крупнейшей академии Кивотоса. Мирный рассвет Тринити был покрыт душераздирающими сиренами и черным дымом.\n\nЭта бомбардировка, готовившаяся Средней школой Ариуса в течение очень долгого времени незаметно, была смертоносной. Главные бастионы Департамента юстиции, центры командования и управления и ключевые пути снабжения были парализованы вместе со взрывами, и связь с командирами на местах была потеряна.\n\nСилы обороны Тринити впали в панику. Не имея возможности даже определить, когда, где или как атаковал враг, силы Ариуса, как призраки, занимают ключевые точки беззащитной Тринити. Это пролог идеально спланированной войны и начало самого долгого дня, который предстоит пережить Тринити."
  ARI_news.3.a: "Покажите им страх!"
  ARI_news.3.b: "Немедленно объявите чрезвычайное положение!"
  ARI_news.3.c: "Произошло невозможное."

  ARI_news.4.t: "Террористическая бомбардировка Ариуса"
  ARI_news.4.d: "Средняя школа Ариуса попыталась нанести решающий удар по Генеральной академии Тринити, но была блокирована благодаря предварительной подготовке Департамента юстиции.\n\nСегодня на рассвете были зарегистрированы разрозненные взрывы и попытки бомбардировок в некоторых учреждениях Тринити. Ариус пытался вызвать масштабный хаос, но цепочка командования Тринити избежала паралича, а основные командиры были надежно защищены.\n\nПод холодным и точным командованием Департамента юстиции взрывчатка, заложенная Ариусом, была обезврежена заблаговременно, и многие внедренные лица оказались в ловушке внутри окружения. Хотя несколько объектов получили повреждения и поднялся дым, функции академии продолжают работать в нормальном режиме. «Скрытая карта» Ариуса нанесла обширный урон, но не достигла решающего урона, и теперь им придется противостоять контратаке разъяренной Тринити."
  ARI_news.4.a: "...Этого было недостаточно?"
  ARI_news.4.b: "Немедленно начинайте контратаку!"
  ARI_news.4.c: "Это ужасное преступление."

  ARI_end_of_pacifism: "Конец пацифизма"
  ARI_end_of_pacifism_desc: "Поскольку мы нанесли упреждающий удар по Средней школе Ариуса, что бы ни случилось на фронте, студенты Тринити стали малосотрудничающими с нашей войной из-за искупления Сестринства, немецкого движения против мобилизации, анти-Геенна и про-Тринити пропаганды, распространяемой Ариусом, и трагической истории правды о старом соборе.\n\nНачался §GКонец пацифизма§! для стабилизации внутренней ситуации в §YТринити§!. Каждый раз, когда мы получаем §Y425 очков§! поддержки войны, мы можем §4устранить§! §Rодно неудобство§!.\n\nВ настоящее время наши очки ([?global.ARI_trinity_pacifism_var|G.0] очков)."
  ARI_trinity_pacifism_var_tt: "Очки поддержки войны: $RIGHT|+=.0$"
  ARI_trinity_pacifism_var_trigger: "Очки поддержки войны: не менее $RIGHT|+=.0$"
  flag_ARI_trinity_pacifism_stop: "Все кончено"
  ARI_rising_approval_rating_due_to_prolonged_war: "Рост поддержки войны из-за затягивания конфликта"
  ARI_spreading_arius_reality: "Распространение истинной природы Ариуса"
