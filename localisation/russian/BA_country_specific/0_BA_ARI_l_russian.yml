  ARI_historical_records: "Строительство исторических памятников"
  ARI_historical_records_desc: "\n\n£GFX_decision_header_ARI_historical_records\n\n\n\n\nНаша долгая и темная история, а также дни победы заслуживают быть записанными. На всей территории мы заменим символы Тринити на наши и, более того, построим места, где все можно будет помнить."
  ARI_arius_victory_monument_construction: "Строительство памятника победе Ариуса"
  ARI_azusa_joamae_saori_statue_construction: "Строительство статуи Джёмаэ Саори"
  ARI_cathedral_of_communion_reconstruction: "Реконструкция Собора Причастия"
  ARI_new_city_plan: "План нового города"
  ARI_statues_of_heroes_construction: "Строительство статуй героев"
