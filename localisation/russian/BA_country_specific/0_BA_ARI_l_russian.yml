  ARI_third_council: "Провести Третий собор"
  ARI_third_council_tt: "При выборе этого фокуса, в зависимости от текущего значения §Y$ARI_balance_of_power$§!, будет определена §Yветка фокусов§!, которая разблокируется.\nТекущий эффект:"
  ARI_third_council_tt1: "§gПобеда консерваторов.§!"
  ARI_third_council_tt2: "§gПобеда реформистов.§!"
  ARI_third_council_tt3: "§gНи одна фракция не смогла добиться преимущества.§!"
  ARI_third_council_ttex: "Дополнительный эффект, если соответствующая фракция §Yдоминирует§!:"
  flag_ARI_fortress_arius: "§YКонсерваторы§! выигрывают собор"
  flag_ARI_approval_of_reformist_manifesto: "§YРеформисты§! выигрывают собор"
  flag_ARI_emergency_government: "Никто не смог одержать верх на соборе"
  ARI_fortress_arius: "Крепость Ариус"
  ARI_fortress_arius_desc: "«Крепость Ариус» — это идеология, которую консерваторы, защитники традиционной системы Ариуса, приобрели по мере того, как Ариус продолжал расширяться. Отвергая отрицание жесткой репрессалии против Тринити и защищая старый порядок Ариуса, эта идеология стремится материализовать этот старый порядок новым методом."
  ARI_emergency_government: "Правительство чрезвычайного положения"
  ARI_emergency_government_desc: "Те, кто разделился на консерваторов и реформистов, не заботясь о реальной жизни, теперь пытаются самоуничтожиться. Попытка государственного переворота консервативной гвардии и попытка реформистов поднять народное восстание против меньшинств и фракций Тринити были заблокированы заранее; теперь мы надавим на Саори, чтобы она утвердила правительство чрезвычайного положения."
  ARI_approval_of_reformist_manifesto: "Утвердить манифест реформистов"
  ARI_approval_of_reformist_manifesto_desc: "Результат собора ясен, и наша судьба решена. Ясно, что Ариус должен измениться. В качестве первой искры, чтобы оставить позади старые, архаичные методы, Адзуса — наш духовный стержень — попытается напрямую убедить Саори утвердить манифест, который решит будущее Ариуса."

  # # События
  ARI_3rd_council.1.t: "Третий собор: Открытие"
  ARI_3rd_council.1.d: "То, что заполняло огромный зал парламента Данцига, было не энтузиазмом или ликованием, а идеально контролируемой, почти ледяной тишиной.\n\nПроцедура Третьего собора проходила с пугающей плавностью: внесение предложений, дебаты и голосование. Все складывалось безошибочно, как шестеренки, скоординированные заранее. Не было доказательств фальсификации. Урны были прозрачны, подсчет голосов проводился в присутствии всех наблюдателей, и цифры не лгали. И все же именно эта «чрезмерная прозрачность» сводила с ума делегатов-реформистов.\n\n«Это обман! Так... так не может быть так тихо! Как возможно, что нет ни одного возражения?! Это не парламент: это труп!»\n\nПредставитель реформистов, с расстегнутым галстуком и вздувшимися венами, закричал во весь голос. Его аргумент апеллировал не к «процедурной легитимности», а к «висцеральному отказу». С задних рядов слышались выкрики, стучали по столам, требовали «свободных дебатов», но их альтернативы были хаотичны, запятнаны внутренними дрязгами из-за интересов.\n\nНа возвышении трибуны Джёмаэ Саори безучастным взором созерцала эту суматоху. Охрана рядом с ней даже не шевелилась. Когда Саори подняла молоток, шум реформистов натолкнулся на стену массового молчания и бессильно угас."
  ARI_3rd_council.1.a: "Оппозиция исчезла."

  ARI_3rd_council.2.t: "Третий собор: беспорядочный выход"
  ARI_3rd_council.2.d: "\"Эти выборы недействительны! Я не могу их принять!\"\n\nКрик раздался у подножия трибуны. Один из твердолобых реформистов трясущейся рукой размахивал в воздухе документами с требованием аннулировать выборы, но Саори и глазом не моргнула. Когда она ударила молотком и объявила «отклонено», должен был разразиться скоординированный скандированный протест реформистов. Но реальность была ближе к фарсу, чем к согласованной борьбе.\n\n«Уходим! Бойкот этой грязной диктатуры!»\n\nНекоторые резко встали, но их последовало меньше половины. Покинуть зал, когда подавляющая победа консерваторов была уже фактом, означало конец политической жизни. Кто-то неуклюже поднялся и снова сел; другой схватил товарища за одежду, чтобы не дать ему уйти. Их «организация» уже рушилась изнутри.\n\nВ этой хаотичной очереди к выходу Ширасу Адзуса оставалась на своем месте, молча и неподвижно.\n\n«Ширасу Адзуса! Что ты делаешь? Ты должна идти с нами!»\n«......»\n\nНа настойчивые призывы Адзуса покачала головой. Она отказалась быть проигравшей, которая бежит. Хотя она не соглашалась с методом Саори, она знала, что, переступив эту дверь, не сможет ничего изменить. Или, возможно, ею двигало только презрение смешиваться с такой жалкой группой.\n\nСаори мгновение смотрела на пустые места слева и, среди них, на Адзусу, как на остров. Она включила микрофон.\n\n«Я не буду останавливать тех, кто хочет уйти. Откройте дверь.»\n\nКогда охрана распахнула дверь настежь, спины убегающих реформистов выглядели жалко, почти убого. В зале остались Саори, «идеальная победительница»; Адзуса, встречающая поражение; и тяжелая тишина."
  ARI_3rd_council.2.a: "Они сами себя пожирают?"

  ARI_3rd_council.3.t: "Конец Третьего собора"
  ARI_3rd_council.3.d: "Сразу после объявления результатов Третьего собора реформисты созвали экстренное собрание «кризиса». Название было громким, но на деле это была не более чем неразбериха взаимных обвинений и криков.\n\nНекоторые твердолобые представили, без согласования, собственный «манифест об абсолютной недействительности» выборов. Они утверждали, что победа Саори была обусловлена «невидимым страхом», и требовали немедленного гражданского неповиновения и всеобщей забастовки. Но даже во время чтения манифеста зал не смог объединиться.\n\n«Ты в своем уме? Это значит подписать себе смертный приговор!»\n\nУмеренные набросились на твердолобых и яростно с ними спорили. Они знали, что нет оправдания для отмены уже завершившихся законных и идеальных выборов. На собрании, на которое даже Адзуса не пришла, «борьба» тех, кто только двигал пером, была пуста. Кто-то сбежал через черный ход; другой начал составлять петицию для подачи стороне Саори.\n\n«Декрет о сопротивлении», объявленный после полуночи, не вызвал волн на политической карте Кивотоса. Граждане увидели в этом последний фарс побежденных, а бюрократы Ариуса даже не потрудились насмехаться. Это было не сигналом нового единства, а завещанием: они сами перерезали ту скудную политическую жизнь, что еще оставалась.\n\nДжёмаэ Саори получила доклад, не отдав никакого приказа. Не нужно было бить врага, который падал сам."
  ARI_3rd_council.3.a: "Конец."

  ARI_3rd_council.4.t: "Третий собор: Открытие"
  ARI_3rd_council.4.d: "Окна парламента Данцига дрожали от грохота толпы снаружи. Третий собор Ариуса походил меньше на торжественное заседание и больше на бесконтрольный рынок.\n\nРеформисты окружили здание с сочувствующими и протестующими под предлогом «отражения воли народа». Каждый раз, когда консерватор поднимался говорить, снаружи обрушивались усиленные динамиками улюлюканья и трубы; внутри реформисты стучали по столам и перебивали. Но настоящая проблема была не в шуме.\n\n«Здесь есть люди без права голоса. Жандармы: выведите их сейчас же.»\n\nСаори холодно приказала с президентского места. На галерее и в очереди для голосования было много тех, кто не был студентами Ариуса: жители и коллаборационисты из Тринити с неловко нацепленными повязками Ариуса. Но прежде чем жандармы успели пошевелиться, представитель реформистов выхватил микрофон и закричал:\n\n«Все, кто живет на этой земле, — Ариус! Президент, не ограничивайте священное право голоса старым «пуризмом крови»!»\n\nЭто была наглость. Они перекручивали определение «члена Ариуса», чтобы завозить на грузовиках посторонних людей, которые будут голосовать за них. Побежденные фракции Тринити воспользовались хаосом, чтобы проникнуть в парламент под прикрытием реформистов.\n\nСаори пыталась навести порядок молотком, но ее усилия утонули в тысячах криков и пропаганде «свободы». Урны переполнялись непроверенными голосами, и в глазах Саори накапливалось отвращение. Это был не собор: это было насилие, подталкиваемое числами."
  ARI_3rd_council.4.a: "По крайней мере, она видела это так."

  ARI_3rd_council.5.t: "Третий собор: порядок"
  ARI_3rd_council.5.d: "Парламент был паровым котлом на грани взрыва. Крики и трубы реформистов гремели повсюду; консерваторы были изолированы, осаждены шумом.\n\nСаори обвела зал взглядом. Где раньше была «стальная сила», теперь ничего не осталось. Консерваторы, предчувствуя неизбежное поражение, закрывали глаза или сжимали кулаки, проглатывая гнев. Сплоченность уже была сломана; если Саори швырнет молоток и перевернет стол, останется только вторая гражданская война и кровь студентов.\n\nСаори взяла микрофон. Ее голос был тих, но странно отчетлив даже среди шума.\n\n«...Результат подтвержден. Я признаю поражение.»\n\nРеформисты попытались разразиться ликованием, но Саори продолжила:\n\n«Тем не менее, ведите себя упорядоченно. Мы не звери.»\n\nЭто была не унизительная мольба: это было последнее предупреждение лидера, который ненавидит хаос. И как раз когда часть толпы, опьянев, собиралась освистать ее...\n\n«Все, тихо.»\n\nШирасу Адзуса, сидевшая в первом ряду, встала и подняла руку. Повернувшись и метнув взгляд на свою собственную фракцию и протестующих, шум стих, как будто на него вылили холодную воду. Адзуса склонила голову перед Саори, с глазами, полными не эйфории, а ответственности."
  ARI_3rd_council.5.a: "Шум утих."

  ARI_3rd_council.6.t: "Конец Третьего собора"
  ARI_3rd_council.6.d: "В кабинете шум собора — как буря — отступил, как отлив. Остались только тяжелая тишина и закат, растянувшийся по стенам. Тишина была такой глубокой, что можно было видеть плавающие пылинки. И нарушил ее ритмичный стук сапог.\n\nТук, тук. Кто-то постучал, но дверь открылась, не дожидаясь ответа. Это была Ширасу Адзуса.\n\nДжёмаэ Саори, погруженная в кресло, наблюдала за своей бывшей соратницей на пороге. Сколько времени прошло с тех пор, как они в последний раз смотрели друг другу в глаза — не через прицел оружия? Воспоминания о раздаче заплесневелого хлеба в руинах стирались, скрываясь за огромным столом и горами бумаг. На плечах Адзусы уже не висела старая винтовка, а лежал груз быть «духовным столпом реформистов».\n\nАдзуса медленно подошла к столу. В руке она держала «Манифест Собора», еще с влажными чернилами. Ее губы шевельнулись: возможно, она собиралась наконец излить логику, отрепетированную десятки раз, чтобы объяснить, почему это необходимо, почему Ариус должен измениться.\n\nНо Саори протянула руку, прежде чем Адзуса произнесла первое слово.\n\n«Дай сюда.»\n\nКороткая, сухая фраза. Глаза Адзусы на мгновение расширились, но Саори взяла документ и, не колеблясь, подписала. Скрип ручки был единственным звуком, пронзившим гигантское молчание между ними. Саори уже знала: времена изменились, и если нельзя остановить поток, нужно открыть шлюзы.\n\nУтвержденный документ скользнул обратно к Адзусе. Саори встала. Не было ни прощального слова, ни упрека. Она чувствовала, что теперь любое слово создаст «недоразумения», а не «понимание». Проходя мимо застывшей Адзусы, она добавила лишь:\n\n«Иди. У тебя будет много дел.»\n\nСо звуком закрывающейся двери комната оставила Адзусу одну, с подписанным документом."
  ARI_3rd_council.6.a: "Можно ли исцелить эту эмоциональную пропасть?"

  ARI_3rd_council.7.t: "Корона на замке из песка"
  ARI_3rd_council.7.d: "Опершись на окно кабинета, Ширасу Адзуса краем глаза посмотрела на документ об утверждении, лежащий в углу стола: манифест того дня, подписанный Джёмаэ Саори.\n\nТеперь, вспоминая, то, что Адзуса почувствовала тогда, было не ликованием. Это был пустой страх, почти. Она подготовила логику, легитимность и «силу», чтобы низвергнуть Саори. Но Саори передала ей всю власть с абсурдной легкостью, как будто ждала этого. В то краткое мгновение, когда ручка царапала бумагу, Адзуса услышала не обрушение стены: она почувствовала потерю своего единственного соперника, способного ее поддержать.\n\nОна думала о людях, которых привела с собой: собранных под сладкой вывеской «реформы». Сколькие из них действительно заботились о будущем Ариуса? Советники, шепчущие, как манипулировать голосованием, используя правовые лазейки; агитаторы, разжигающие массы, чтобы спровоцировать насилие; оппортунисты, которые, как только Саори отошла, облизывались при виде добычи.\n\nАдзуса использовала их жадные руки, чтобы добраться сюда. Потому что была убеждена, что путь Саори ведет к «смерти», и верила, что, даже испачкавшись в грязи, она должна проложить путь к «жизни». Но сев в это кресло, она воочию ощутила вес молчания, которое несла Саори.\n\nПустота, которую Саори оставила, проходя мимо, не была пуста. Она была полна хаоса и противоречий мира без порядка, который теперь должна была выносить Адзуса. С облегчением, виной и неописуемым давлением, смешавшимися, она погладила кончиком пальца подпись на бумаге."
  ARI_3rd_council.7.a: "Нести корону было не ношением яркого света, а невыносимой тенью."

  ARI_3rd_council.8.t: "Третий собор: Открытие"
  ARI_3rd_council.8.d: "Воздух в парламенте Данцига был настолько напряжен, что трудно было дышать. Это была не консервативная тишина и не шум реформистов: это было намерение убийства зверей, готовых разорвать друг другу глотки.\n\nСлева и справа от центрального прохода зал был разделен идеально. Консерваторы, скрестив руки, смотрели на противников как на мусор; реформисты, сжимая папки с документами как оружие, кричали и провоцировали. Для них этот собор был не местом «согласия» или «дебатов». Это была виселица, внешне законная, чтобы растоптать другого как еретика и монополизировать всю власть.\n\nНа президентском месте Джёмаэ Саори, а как представительная фигура реформистов Ширасу Адзуса отчаянно пытались сохранить порядок.\n\n«Тишина! Личные выпады запрещены!»\n«Сядьте! Вам еще не давали слова!»\n\nОба лидера пытались удержать хотя бы минимальную «линию». Но трагически, Саори была символом консерваторов, а Адзуса — знаменем реформистов. Как бы они ни взывали к разуму, жадные волки в парламенте только пожирали их как представителей интересов.\n\nПосреди этой отвратительной борьбы Саори встретилась взглядом с Имашино Мисаки, сидевшей в углу.\n\nМисаки не сражалась и не кричала. Только, подперев подбородок, она обводила весь зал пустыми глазами. Но этот взгляд уже не был прежней апатией. Она смотрела не на сражающихся реформистов и не на авторитарных консерваторов.\n\nОна смотрела на «всех» — включая Саори и Адзусу на трибуне — с невыносимой ненавистью и презрением, как на мух над гнилым мясом. Встретив этот ледяной взгляд, Саори почувствовала, как по спине пробежал холодок."
  ARI_3rd_council.8.a: "Звук молотка снова разнесся, но интуиция подсказывала, что на этот раз он будет мало что значить."

  ARI_3rd_council.9.t: "Третий собор: разрыв"
  ARI_3rd_council.9.d: "Оскорбления и крики смешались, превратив парламент в неуправляемый хаос. Именная табличка, брошенная консерватором, рассекла лоб реформисту; потасовки были на грани перерастания в массовую драку.\n\n«У-уээ... пожалуйста, пожалуйста, остановитесь! Мы не можем... мы не можем делать это друг с другом...!»\n\nЦутинага Хиёри встала, плача и крича. Она размахивала руками, пытаясь разнять обе стороны, но в водовороте ненависти ее голос был слабее комариного писка. Кто-то грубо толкнул Хиёри, и она упала на пол.\n\n**БАХ!**\n\nРезкий выстрел, словно пронзающий высокий потолок, прогремел в парламенте. Внезапно тишина упала, как холодная вода. Все взгляды устремились на оружие: Имашино Мисаки.\n\nМисаки помогла Хиёри встать и отряхнула ее. Затем опустила еще дымящийся ствол и сухими глазами обвела Саори, Адзусу и остолбеневших законодателей.\n\n«Смотреть тошно, от такого шума.»\n\nЕе голос был тих, но отчетливо врезался во все углы.\n\n«Пока вы душите друг друга, решая, кто прав... Ариус снова гниет. Посмотрите. Это парламент? Или это та самая «катастрофа», от которой мы так хотели сбежать?»\n\nМисаки не стала ждать ответа. Она только сказала: «Пошли, Хиёри. Здесь и дышать нельзя», и направилась к выходу.\n\nЗатем раздался скрежет отодвигаемого стула. Один центрист, зажатый в углу, молча встал и последовал за Мисаки. Потом второй, третий... Люди, уставшие от крайностей, независимо от фракции, поднимались один за другим. Вскоре эта очередь превратилась в реку."
  ARI_3rd_council.9.a: "Пока Саори и Адзуса, ошеломленные, смотрели, половина парламента опустела."

  ARI_3rd_council.10.t: "Два падающих крыла"
  ARI_3rd_council.10.d: "Ночное небо над центром Ариуса пылало красным. Это был не закат: это было пламя от бутылок с зажигательной смесью, брошенных разъяренными толпами, руководимыми реформистами.\n\n«Долой диктатуру! Ариус для граждан!»\n\nТвердолобые реформисты подстрекали жителей тринитианского происхождения заполнить улицы. Они заняли общественные здания и провозгласили «гражданскую революцию», но на практике это был бесконтрольный грабеж и поджоги.\n\nПараллельно ответ военного крыла консерваторов был худшим автоголом. Без одобрения Саори они попытались мобилизовать войска, блокировать парламент и объявить военное положение: «Операция Крепость». Но план переворота гвардии был раскрыт благодаря внутреннему доносу прямо перед исполнением.\n\nКогда стало известно, что они «собираются нацелить оружие на народ», жандармерия отказалась подчиняться, и толпа набросилась на резиденции путчистов. Генералов тащили с разорванными мундирами, а лидеры реформистов, опьяневшие от безумия, вели прямые репортажи: настоящий ад.\n\nИз безопасного убежища Цутинага Хиёри сжала губы.\n\n«...Так больше нельзя. Саори и Адзуса... уже ничего не могут остановить. Такими темпами Ариус действительно исчезнет.»\n\nВ глазах Хиёри впервые появилась ядовитая решимость. Имашино Мисаки выпустила долгий вздох и кивнула. Ее глаза уже были холодны.\n\nМисаки развернула на столе карту Ариуса. На ней были отмечены позиции частей и администраций, не принадлежащих ни к одной из двух сторон, но до сих пор хранивших молчание.\n\n«Хиёри, готовься. Идем к Саори.»\n«...Да.»"
  ARI_3rd_council.10.a: "Обе двинулись вручать окончательный ультиматум, оставляя позади город, превращающийся в руины."

  ARI_3rd_council.11.t: "Декрет о чрезвычайном положении № 1"
  ARI_3rd_council.11.d: "На рассвете над площадью Данцига висела странная тишина. Где раньше были баррикады, теперь развернулись силы «Правительства чрезвычайного положения» в черной форме, а из радио и громкоговорителей, сквозь помехи, начала звучать сухая речь Имашино Мисаки.\n\nПосле подписания утверждения чрезвычайных мер Джёмаэ Саори перебралась в пристройку резиденции; Ширасу Адзуса, хотя и предвидела ситуацию благодаря разведке, позволила себя арестовать без сопротивления. Вакуум власти, оставленный двумя гигантами, заполнили девушки, которых все считали «бессильными».\n\nОни не обещали великих идеологий или светлого будущего. Был просто зачитан холодный эдикт, продиктованный инстинктом «выжить сегодня».\n\n«Всем студентам и гражданам Ариуса. Мы больше не будем проливать кровь под пустыми знаменами. Настоящим новое «Правительство чрезвычайного положения» провозглашает следующее:»\n\n1. Отказ от гражданской войны навсегда. Мы не потерпим повторения трагедии старого Ариуса, где брат целился в грудь брата. Любые действия, провоцирующие гражданскую войну, будут караться суммарной казнью.\n\n2. Роспуск фракций и привлечение к ответственности. Мы объявляем как «консерваторов», так и «реформистов» главными виновниками, игнорировавшими средства к существованию народа и ввергнувшими государство в застой посредством борьбы за власть. С этого момента все политические фракции принудительно распускаются.\n\n3. Абсолютная недействительность предыдущего собора. Последний собор, запятнанный насилием, агитацией и массовым дезертирством, объявляется недействительным с самого начала из-за отсутствия кворума. Там не существовало «воли Ариуса».\n\n4. Мы провозглашаем, что это Правительство чрезвычайного положения является единственным законным правительством, которому делегировано право на выживание разрозненных членов, и что мы, в истинном смысле, являемся «Третьим собором Ариуса».\n\n5. Приоритет: выживание. Идеологические дебаты закончены. Отныне все административные возможности будут сконцентрированы исключительно на обеспечении продовольствием, поддержании общественного порядка и исключении внешних угроз.\n\nЗакончив передачу, Мисаки выключила микрофон и глубоко вздохнула. Рядом с ней Хиёри дрожащими руками сжимала манифест."
  ARI_3rd_council.11.a: "...Накопилась работа."

