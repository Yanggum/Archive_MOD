  # События
  ARI_event.1.t: "Проблема переноса столицы"
  ARI_event.1.d: "Короче говоря, нужно решить, переносить столицу или нет."
  ARI_event.1.a: "В Эдем"
  ARI_event.1.b: "Оставить как есть"

  ARI_event.2.t: "Второй собор"
  ARI_event.2.d: "В результате «справедливого» Второго собора, созванного для исправления предыдущего Первого собора, который мы отрицали, доктрина Тринити была отвергнута, а все фракции вне арианства были объявлены ересью."
  ARI_event.2.a: "Отлично."

  ARI_event.3.t: "Дезертирство студентов Ариуса"
  ARI_event.3.d: "Пока Эскадрилья Ариуса ненадолго отсутствовала, значительное количество членов Базилики исчезло. Похоже, это дело рук бывшего лидера, внезапно исчезнувшей, Беатрис."
  ARI_event.3.a: "Мадам, значит, вы были здесь."

  ARI_event.4.t: "Эскадрилья атакована"
  ARI_event.4.d: "Эскадрилью Ариуса, возвращавшуюся после прорыва окружения Беатрис, атаковала группа, похожая на студентов Ариуса. Несомненно, они связаны с Беатрис и, по-видимому, нацелены на Хакари Ацуко. Их цель, очевидно, обеспечить Королевскую Кровь.\n\nКроме того, предполагается, что значительная часть важных фигур внутри ветви Ариуса получает и выполняет приказы Беатрис.\n\nНевозможно определить, насколько глубоко руки Беатрис проникли внутрь ветви Ариуса."
  ARI_event.4.d_2: "Эскадрилья Ариуса уже долгое время скрывается от преследующей группы Беатрис. Хотя, благодаря раскрытию зверств Беатрис, многие студенты Ариуса оказывают нам поддержку, интриги Беатрис, постоянное провоцирование хаоса и повторение внутренней вражды истощают как эскадрилью, так и всех студентов Ариуса.\n\nТеперь никто внутри ветви Ариуса не может никому доверять. Влияние Беатрис ослабевает со временем, но такими темпами ветвь Ариуса будет разбита до того, как ее влияние полностью исчезнет..."
  ARI_event.4.d_3: "Ветвь Ариуса больше не может выдерживать внутреннюю борьбу... Нехватка припасов, нехватка снабжения, нехватка всего. Даже студенты Ариуса, не последовавшие за Беатрис, отворачиваются от нас. Все рушится.\n\nВнутри ветви Ариуса все еще не доверяют друг другу и раздирают друг друга на части. Теперь, даже чтобы предотвратить гибель ветви... возможно, нам придется признать победу Беатрис..."
  ARI_event.4.a: "Я не этого хотела."
  ARI_event.4.b: "..."

  ARI_event.5.t: "Эпилог и новое начало"
  ARI_event.5.d: "Ветвь Ариуса. Место, где смешиваются только ненависть, гнев, презрение и отвращение.\nДо того как Тринити стала объединенной академией, это была ветвь, которая, хотя и толковала писания немного иначе, чем другие фракции Тринити, по сути не так уж отличалась. Однако она стала несчастной академией: выступив против идеи объединения ветвей на Первом соборе для создания большой академии, в итоге была объявлена ересью.\nКогда у них отняли даже их часовню, они ушли в место, о котором не знал даже председатель Генерального студенческого совета, и пережили долгую череду внутренних войн. Посреди всего этого в Ариус пришла Беатрис и, используя негативные эмоции студенток, подчинила их ложью и обманом. Даже после окончания гражданской войны ее господство продолжалось.\n«Взрослый» доминировал и эксплуатировал «детей», пожирая их.\n\nИ затем ветвь Ариуса, как и другие академии, пережила Великое Перемещение.\nБеатрис покинула академию сразу после Великого Перемещения и вернулась в Гематрию, но студенты ветви Ариуса, не имея возможности получать новости извне, не могли хорошо понять ситуацию.\n\nОднако студенты Ариуса не могли не заметить, что Беатрис давно не появляется, и Эскадрилья Ариуса осознала это быстрее всех.\n\nНо... если Мадам нет, что нам делать?"
  ARI_event.5.a: "Мы потерялись."

  ARI_event.6.t: "Шумная дорога"
  ARI_event.6.d: "Прошло не так много времени с тех пор, как девушки и их товарищи, покинув Ариус, начали исследовать это место под названием «Данциг», когда, одетые в гражданскую одежду, соответствующую эпохе, они приблизились к шумной толпе, устроившей большой скандал в Данциге. Человек с длинной бородой, похожий на лидера, посмотрел на нее с выражением «ты чего пришла?».\n\n«Что случилось? Почему вы собрались группой и так злы?»\n«Не видишь? У нас всеобщая забастовка! Потому что нам не платят то, что положено за нашу работу!»\n\nДевушка безучастно посмотрела на него. Если это было то, о чем она читала в библиотеке, эта группа была бы «профсоюзом». Коллектив, требующий справедливых прав и компенсации для рабочих. С пустым взглядом девушка молча наблюдала за ним.\n\n«Компенсация, которой вы желаете, — это жить как люди?»\n«Да! С тех пор как объявили какое-то национальное чрезвычайное положение, нам до сих пор задерживают зарплату!»\n\n«Тогда уберись с дороги, соплячка.»\nМужчина сказал это, отталкивая ее рукой.\n\nСуета сует... жить как люди, какая нелепость. В нормальных обстоятельствах она бы не отступила и в такой ситуации, но сейчас существовал приказ по возможности не провоцировать местных жителей. Девушка не предприняла никаких дальнейших действий. Теперь нужно было выполнять следующую миссию."
  ARI_event.6.a: "Я... еще не знаю."

  ARI_event.7.t: "Человек в костюме"
  ARI_event.7.d: "После начала исследования «Данцига» студентки Ариуса увидели человека в костюме, произносящего речь на площади. Человек говорил почти кричащим тоном.\n\nКогда речь закончилась, студентки подошли к человеку и задали несколько вопросов.\n\n«С какой целью вы произносите эту речь?»\n«Хм... судя по вашей одежде, вы тоже пришли из какого-то места под названием Тринити или что-то вроде?»\nКогда это проклятое имя, Тринити, сорвалось с его губ, студентки Ариуса растерялись.\n\n«По вашей реакции, похоже, нет. Хорошо. Тогда я могу вам сказать. Я соберу немцев и подниму родину для немецкого народа.»\n«Ро-родину немецкого народа?»\n«Да. Едва я обрадовался, что исчезли эти проклятые поляки, и тут выясняется, что Германия была уничтожена какими-то странными типами по имени Тринити! Черт возьми!»\nЧеловек, охваченный гневом, на мгновение выплеснул его в пустоту. Видя это отношение, студентки Ариуса погрузились в глубокое размышление."
  ARI_event.7.a: "Он похож... на нас?"

  ARI_event.8.t: "Капитуляция Хакари Ацуко"
  ARI_event.8.d: "Сегодня в 2 часа ночи Хакари Ацуко решила сдаться Беатрис и поднять белый флаг, заявив, что дальнейшее сопротивление бессмысленно.\n\nСразу после ее капитуляции все студентки ветви, следовавшие за Беатрис, отступили, и Эскадрилья Ариуса смогла вернуться на верхний уровень ветви и возобновить работу... за одним исключением."
  ARI_event.8.a: "..."

  ARI_event.9.t: "Требование подчинения от Беатрис"
  ARI_event.9.d: ""
  ARI_event.9.a: "Мы больше не пойдем за тобой!"
  ARI_event.9.b: "С возвращением, Мадам."

  ARI_event.10.t: "Отступление Эскадрильи Ариуса"
  ARI_event.10.d: "Из-за атаки, спровоцированной Беатрис, Эскадрилья Ариуса понесла тяжелые потери и была вынуждена отступить, сдав Ацуко.\n\nСтудентки, подчинявшиеся приказам Беатрис, покинули ветвь и присоединились к силам Мадам, поэтому Эскадрилья Ариуса смогла снова подняться на верхний уровень ветви."
  ARI_event.10.a: "...!"

  ARI_event.11.t: "Взрыв в городском районе Эдема"
  ARI_event.11.d: "Произошла огромная авария со взрывом, предположительно из-за ошибки при транспортировке химикатов, в Эдеме, сердце Тринити."
  ARI_event.11.a: "Это нехороший знак."

  ARI_event.12.t: "Исчезновение граждан"
  ARI_event.12.d: "Департамент юстиции обнаружил, что число граждан в регионе Тринити заметно уменьшилось."
  ARI_event.12.a: "Они покинули нашу академию."

  ARI_event.13.t: "Растущее сопротивление"
  ARI_event.13.d: "В Чайную партию поступило сообщение о том, что граждане, кажется, проявляют подозрительную активность."
  ARI_event.13.a: "Это опасно."

  ARI_event.14.t: "Разведывательная операция раскрыта"
  ARI_event.14.d: "Похоже, Тринити выследила хвост нашей оперативной группы, проводящей внедрение в Тринити. Если мы продолжим операцию как есть, Тринити, несомненно, немедленно вторгнется в нас, поэтому, кажется, нам придется приостановить операцию на некоторое время."
  ARI_event.14.a: "Придется какое-то время вести себя тихо."

  ARI_event.15.t: "Разведывательная операция ветви Ариуса"
  ARI_event.15.d: "Сегодня в Чайную партию поступил невероятный доклад о том, что разведывательная операция против Объединенной академии Тринити исходила от ветви Ариуса, которая в прошлом бежала от нас. Согласно этому докладу, предполагается, что ветвь Ариуса планировала свою месть Тринити еще до Великого Перемещения и что после Великого Перемещения она использовала тревогу нашей академии для усиления хаоса."
  ARI_event.15.a: "\"Сегодня Тринити была атакована.\""

  ARI_event.16.t: "Судьба ветви Ариуса"
  ARI_event.16.d: "После долгой ночи все влияние ветви Ариуса в Германии было устранено. Теперь мы должны решить, как поступить со студентками Ариуса. Они внесли вклад в восстановление Германии, так что мы можем выбрать между созданием для них автономного округа или их устранением ради немецкой истории."
  ARI_event.16.a: "Реорганизуйте Данциг в автономный округ Ариуса."
  ARI_event.16.b: "Устраните Эскадрилью Ариуса."

  ARI_event.17.t: "Перенос столицы"
  ARI_event.17.d: "Нам удалось подняться после долгого преследования, низвергнуть ненавистную Тринити и провозгласить Объединенную академию Ариуса. По мере того как ветвь Ариуса реорганизуется в большую объединенную академию, возникло мнение о переносе столицы Ариуса."
  ARI_event.17.a: "Эдем."
  ARI_event.17.b: "Нужно ли ее двигать?"

  ARI_event.18.t: "Берлинский военный трибунал: Чайная партия"
  ARI_event.18.d: "После того как капитуляция Тринити была принята, начался Берлинский военный трибунал, когда его столица, Эдем, была переименована в свое древнее название: Берлин. Первыми, кто предстал перед судом, стала Чайная партия, руководство Тринити. Как руководство Объединенной академии Тринити, они всегда были нашими врагами во время нашей долгой войны."
  ARI_event.18.a: "Повесить их!"
  ARI_event.18.b: "Я приговорю их к пожизненному заключению."

  ARI_event.19.t: "Берлинский военный трибунал: клубы"
  ARI_event.19.d: "Второй суд был над клубами, составлявшими Объединенную академию Тринити. Большинство из них активно сотрудничало с режимом Тринити и выполняло вспомогательную роль в ведении академией войны."
  ARI_event.19.a: "Расстрелять ответственных и арестовать всех."
  ARI_event.19.b: "Арестовать ответственных и перевоспитать членов."

  ARI_event.20.t: "Берлинский военный трибунал: студенты"
  ARI_event.20.d: "Третий суд был над обычными студентами Объединенной академии Тринити. В целом они были нейтральны в ведении войны, но несут ответственность за то, что защищали режим Тринити и терпели войну."
  ARI_event.20.a: "Казнить или заключить в тюрьму всех коллаборационистов."
  ARI_event.20.b: "Активно принимать внутренние доносы."
  ARI_event.20.c: "Подписываю окончательное решение."

  ARI_event.21.t: "Берлинский военный трибунал: немецкий народ"
  ARI_event.21.d: "Четвертый суд, как бы это ни было неловко, был над немецким народом. Большинство испытывало отвращение к Тринити, но после прихода к власти Мисоно Мики многие были взбудоражены ложным национал-социализмом, который выдвинуло руководство Тринити, и начали поддерживать режим Тринити."
  ARI_event.21.a: "...Арестовать всех предателей."
  ARI_event.21.b: "...Сделаем вид, что ничего не было."

  ARI_event.22.t: "Конец военных трибуналов"
  ARI_event.22.d: "После последнего крупного военного трибунала большая часть военных судов завершена, остались лишь несколько незначительных процессов. Какое-то время военный трибунал продолжит работу, но число подсудимых заметно уменьшится по сравнению с тем, что было несколько дней назад."

  ARI_event.24.t: "Обнаружение $ARI_hakari_atsuko$"
  ARI_event.24.d: "В городе недалеко от Ариуса $ARI_hakari_atsuko$ вернулась вместе со студентками ветви Ариуса, в изнеможении. Студентки, доставившие ее, говорят, что нашли ее упавшей во время рутинного патрулирования.\n\nОчнувшись, $ARI_hakari_atsuko$ заявила, что была использована в экспериментах Мадам. Она говорит, что не знает, как это произошло, но открыла глаза и очнулась в разрушенной церкви и, убегая в сторону ветви Ариуса, потеряла сознание."
  ARI_event.24.a: "Беатрис...!"

  ARI_event.25.t: "Признаки вторжения Тринити"
  ARI_event.25.d: "Похоже, они обнаружили нашу политическую операцию против Тринити. Объединенная академия Тринити начала перебрасывать войска к нашей ветви и вскоре начнет вторжение против нас.\n\nВсе студентки ветви Ариуса готовы к развертыванию в священной войне против Тринити."
  ARI_event.25.a: "Приготовиться к бою!"

  ARI_event.26.t: "Окончательный приговор"
  ARI_event.26.d: "Большой открытый суд, начавшийся после победы Ариуса над Тринити, в конце концов завершился приговором к казни всего руководства Тринити и пожизненным принудительным работам для всех студенток Тринити.\n\nМассовые репрессии Тринити против ветви Ариуса теперь окончательно завершены, и мы сделаем так, чтобы эти ублюдки из Тринити никогда больше не поднялись."
  ARI_event.26.a: "Это великая победа."

  ARI_event.27.t: "Контакт с иным миром"
  ARI_event.27.d: "Некие личности, представляющиеся как ветвь Ариуса, предложили нам, чтобы, когда разразится война между Тринити и Ариусом, мы приняли в ней участие.\n\nПо их словам, Ариус довольно глубоко внедрился в общество Тринити, и они неоднократно упоминают о великой битве против Тринити."
  ARI_event.27.a: "Хорошо, попробуем разок."
  ARI_event.27.b: "Мы не можем ввязываться в такое опасное дело."

  ARI_event.28.t: "Согласие Польши"
  ARI_event.28.d: "Польское правительство приняло это секретное соглашение, и Польша примет участие, помогая нам, когда разразится война."
  ARI_event.28.a: "Хорошо."

  ARI_event.29.t: "Отказ Польши"
  ARI_event.29.d: "Польское правительство отклонило договор, сославшись на то, что он слишком опасен и что они плохо знают Ариус."
  ARI_event.29.a: "Понятно."

  ARI_event.30.t: "Ариус вступает в анти-Тринити войну"
  ARI_event.30.d: "Ариус, с которым мы подписали договор, вступил в войну против Тринити, так что мы готовы поддержать Ариус и подготовить анти-Тринити наступление."
  ARI_event.30.a: "Это война!"

  ARI_event.31.t: "Выполнение договора Польши"
  ARI_event.31.d: "Польша, с которой мы подписали договор, решила присоединиться к нам в священной анти-Тринити войне. Началась финальная война за свержение Тринити!"
  ARI_event.31.a: "Это война!"

  ARI_event.32.t: "Территориальное требование Польши"
  ARI_event.32.d: "После того как война против Тринити закончилась и на Втором соборе было решено аннексировать страны-коллаборационисты Ариуса, Польша потребовала в качестве платы за участие в войне возврата польских территорий, существовавших до Великого Перемещения."
  ARI_event.32.a: "Это справедливая плата."
  ARI_event.32.b: "Предложите уступить южную территорию в обмен на исключение Гданьска"
  ARI_event.32.c: "Нет."

  ARI_event.33.t: "Территориальное возвращение Ариуса"
  ARI_event.33.d: "Наше правительство потребовало от ветви Ариуса польские территории, существовавшие до Великого Перемещения, и правительство Ариуса приняло это, решив уступить нам причитающиеся территории."
  ARI_event.33.a: "Это справедливая плата."

  ARI_event.34.t: "Силезия вместо Гданьска"
  ARI_event.34.d: "Наше правительство потребовало от ветви Ариуса возврата польских территорий, существовавших до Великого Перемещения, но правительство Ариуса, ссылаясь на то, что в Гданьске также есть много важных для Ариуса зон Тринити, предложило вместо этого уступить Силезию."
  ARI_event.34.a: "Неплохо."
  ARI_event.34.b: "Мы не откажемся от доступа к побережью."

  ARI_event.35.t: "Принятие польского правительства"
  ARI_event.35.d: "Польское правительство отправило положительный ответ на наше предложение об уступке Силезии, и вскоре пришел документ, подтверждающий, что это предложение было подписано от имени главы государства.\n\nПоявилась новая линия отсчета для разграничения территорий между ветвью Ариуса и Польшей."
  ARI_event.35.a: "Неплохо."

  ARI_event.36.t: "Отказ польского правительства"
  ARI_event.36.d: "Польское правительство отклонило предложение нашего руководства об уступке Силезии, заявив, что Польша не откажется от права доступа к побережью, гарантированного после Первой мировой войны.\n\nПохоже, война с Польшей неизбежна."
  ARI_event.36.a: "Проклятье."

  ARI_event.37.t: "Ветвь Ариуса отказывается делить территории"
  ARI_event.37.d: "Ветвь Ариуса отклонила требование нашего польского правительства о территориях, существовавших до Великого Перемещения, и жестко заявила, что все территории Тринити принадлежат Ариусу."
  ARI_event.37.a: "Мы не откажемся от наших законных территорий."
  ARI_event.37.b: "Мы должны избежать нового конфликта."

  ARI_event.38.t: "Коллаборационистское правительство Тринити [FROM.GetName]"
  ARI_event.38.d: "После нашей победы в войне против Тринити [FROM.GetName] решило создать местное коллаборационистское правительство в рамках плана по управлению оккупированными зонами.\n\nИ после завершения его создания [FROM.GetName] запросило у нас возврата территорий Тринити, и мы должны ответить на этот запрос."
  ARI_event.38.a: "Хорошая идея."
  ARI_event.38.b: "Нет, мы сохраним все в наших оккупированных зонах."

  ARI_event.39.t: "Одобрение возврата территорий [FROM.GetName]"
  ARI_event.39.d: "Мы запросили возврат территорий у автономного правительства, созданного после нашей победы в войне против Тринити, и [FROM.GetName] приняло запрос и вернуло территорию нашему автономному государству."
  ARI_event.39.a: "Хорошо."

  ARI_event.40.t: "Отказ в возврате территорий [FROM.GetName]"
  ARI_event.40.d: "Мы запросили возврат территорий у автономного правительства, созданного после нашей победы в войне против Тринити, но, похоже, у [FROM.GetName] другие намерения."
  ARI_event.40.a: "Хотя и жаль, но ничего не поделаешь."

  ARI_event.41.t: "Реабилитация Хакари Ацуко"
  ARI_event.41.d: "После того как ветвь Ариуса вошла в контакт с различными гражданами Данцига, начали происходить масштабные изменения. Студентки ветви Ариуса теперь говорят о законном сопротивлении вместо безудержной мести, и жестокая образовательная система Ариуса отменяется.\n\nВ этом контексте позиция Хакари Ацуко, члена Эскадрильи Ариуса, которая выступала за полную реформу ситуации в ветви Ариуса и попытку контакта с Тринити, начала переоцениваться."
  ARI_event.41.a: "Я признаю тебя, Ацуко."

  ARI_event.42.t: "Первые выборы"
  ARI_event.42.d: "После установления федерации под руководством ветви Ариуса и правительства Данцига прошло не так много времени, как состоялись первые выборы. Участие студенток Тринити и различных немцев было ограничено, а избиратели были сформированы из студенток-граждан ветви Ариуса и Данцига.\n\nПосле выборов Джёмаэ Саори, лидер Эскадрильи Ариуса, была избрана. Перед немцами и студентками Тринити, смотревшими глазами, полными тревоги, перед студентками Ариуса, страстно ее поддерживавшими, и перед гражданами Данцига, хранившими молчание, она произнесла свою инаугурационную речь."
  ARI_event.42.a: "Конец Тринити."
  ARI_event_42_tt: "Добавляет §G60%§! поддержки партии §Yнеприсоединившихся§! к поддержке партии §Yдемократической§!."

  ARI_event.69.t: "Формирование полицейской бригады"
  ARI_event.69.d: "Нам удалось вернуть бывшую немецкую территорию и издать административные приказы немецкой полицейской организации, что позволило нам сформировать полицейскую бригаду. Эта полицейская бригада будет организована как полноценная армия, которую можно будет отправить на фронт вместо нас."

  # Описание Ариуса
  ARI_Trinity_core_states_catagories: "Интеграция Тринити"
  ARI_Trinity_core_states_catagories_desc: "\n\n£GFX_ARI_trm_add_core\n\n\n\n\nГенеральная академия Тринити была основана мирно очень давно, во время Первого Вселенского собора. Однако Средняя школа Ариуса сочла это несправедливым и выступила против. Тогда они начали захватывать наши территории и забирать студентов филиальной школы не мирными средствами, а с помощью насилия. Филиальная школа терпела поражение снова и снова, пока не была оттеснена в отдаленные регионы, где ей пришлось продолжать борьбу за выживание. Но теперь ситуация изменилась. После нашего сопротивления Тринити капитулировала, и настало время интегрировать территории."
  ARI_trinity_core_tt: "Владеть §Yвсеми§! ключевыми государствами Тринити."
  ARI_Trinity_core_states_decisions: "Территориальная интеграция"

  ARI_GATHERING_STORM_DESC: "Первоначально Средняя школа Ариуса предназначалась для интеграции в Генеральную академию Тринити, но выступила против из-за неравенства предложенных условий. В ответ Генеральная академия Тринити объявила Ариус ересью, и Академия Ариуса была вынуждена бежать как изгой.\n\nАриус также не смог избежать Великого Перемещения и в результате потерял даже любое место, где можно было бы спрятаться. Однако, к счастью, Генеральная академия Тринити, похоже, не имеет даже возможности беспокоиться о нашей академии из-за внутреннего хаоса, который ее поглощает.\nВозможно, это для Ариуса еще один шанс."

  ARI_country_intro_header: "Между снами и миражами"
  ARI_country_intro_content: "Мечта о счастье, которое, казалось, было в пределах досягаемости, исчезла как мираж и снова отдалилась. Хотя времена года меняются и мир трансформируется, плачевное положение Эскадрильи не меняется.\n\nДети из богатых семей Тринити не теряют улыбки даже посреди этого хаоса, в то время как Эскадрилья снова становится скитальцем.\nСегодня Тринити снова толкает их в пустошь, и никто в мире об этом не знает.\n\nНо Эскадрилья знает. Знает, кто причинил им боль. И кто улыбается, делая это.\n\nНастало время бежать от страданий, которые на самом деле никогда не были нашими.\nИ также время найти, чего бы это ни стоило, их истинного обладателя.\n«Господи, помилуй нас». (Kyrie Eleison)\n\n§YРазработка - SKSKIe§!\n§YДополнительная разработка - subikgm, bang0709§!\n§LСтарая разработка - subikgm, slovakiamodding, pencildude, scpfoundationo5_01§!\n§L(Кстати, все наследие этих старых разработчиков уже ликвидировано!)§!"

  ARI_guide: "£white_dot Установите отношения с нацистской партией в Данциге и восстановите академию.\n\nПравительство Эскадрильи\n£white_dot Грабите ресурсы Тринити и стройте армию.\n£white_dot §R...Приготовьтесь к крупному вторжению.§!\n£white_dot Теперь низвергните Тринити.\n£white_dot Интегрируйте и восстанавливайте территории Тринити.\n\n£white_dot §LКрепость Ариус§!\n   £white_dot §WПодавите волнения реформистов.§!\n   £white_dot §LКонсерваторы Ариуса найдут свой собственный путь.§!\n\n£white_dot §4Наш Манифест§!\n   £white_dot §WПробейтесь сквозь консервативную обструкцию и победите на Третьем соборе.§!\n   £white_dot §4...Адзуса убедит Саори.§!\n\n£white_dot §RПравительство чрезвычайного положения§!\n   £white_dot §pНи реформисты, ни консерваторы не смогли одержать верх.§!\n   £white_dot §R...Тогда мы найдем альтернативу.§!\n   £white_dot §SА теперь восстанавливайте страну, возрождайте гражданскую жизнь и снова протяните руку побежденным!§!\n\nИ если к тому же низвергнуть Геенну и объединить Центральную Европу...\n\n\n\n§CТогда слава Ариуса проявится снова.§!"

  ARI_focus_can_only_game_started_tt: "Этот фокус запускается автоматически в начале игры."

  #########################################
  # Идеи
  BA_ARI_bitter_revanchism: "Горький реваншизм"
  BA_ARI_bitter_revanchism_desc: "Средняя школа Ариуса подобна единой машине, движимой целью отомстить Тринити и Геенне. Давным-давно, на соборе, пытавшемся объединить Тринити в единое целое, Ариус выразил свое несогласие, основываясь на законных причинах и доводах. Однако ответом был не справедливый спор, а карательное вторжение, направленное против филиальной школы. Мы не смогли противостоять мощи уже объединенной Тринити и, в конце концов, стали отшельниками, скрывавшимися в самой глубокой тьме.\n\nОднажды появился взрослый, и мы поверили, что он нас спасет. Он объединил разрозненный Ариус и при восторженной поддержке взошел на пост председателя студенческого совета. Но та вера обернулась предательством. Этот взрослый относился к студентам не как к людям, а как к простым инструментам, и в процессе бесчисленные жизни были принесены в жертву. Гнев и ненависть к Тринити были глубоко впрыснуты в их сердца, и одного за другим нас растили как орудия убийства."
  BA_ARI_bitter_revanchism_ns_1: "Предел мести"
  BA_ARI_bitter_revanchism_ns_1_desc: "Средняя школа Ариуса подобна единой машине, движимой целью отомстить Тринити и Геенне. Давным-давно, на соборе, пытавшемся объединить Тринити в единое целое, Ариус выразил свое несогласие, основываясь на законных причинах и доводах. Однако ответом был не справедливый спор, а карательное вторжение, направленное против филиальной школы. Мы не смогли противостоять мощи уже объединенной Тринити и, в конце концов, стали отшельниками, скрывавшимися в самой глубокой тьме.\n\nПосле долгих лет разделенный Ариус объединился, и мы с гордостью пронзили сердце Тринити, чтобы вернуть наше законное место. В тот миг наша месть потеряла свой курс. Ненависть к Геенне? Как можно ненавидеть тех, кого никогда не видели? Действительно, есть много тех, кто ненавидит Геенну, и очевидно, что они и мы не можем сосуществовать, но наш голос, поддерживаемый ненавистью к Тринити, практически достиг своего конца в тот момент, когда мы заняли Эдем, водрузили наш флаг и произнесли речи.\n\nЕсли наступит день, когда, следуя призрачным перстам бесконечной мести, мы также низвергнем Геенну, тогда нам придется искать путь, отличный от мести."
  ARI_undisturbed_wareconomy: "Тотальная изоляция"
  ARI_wareconomy: "Изоляция"
  ARI_pyeho_hakwon: "Академия в руинах"
  ARI_pyeho_hakwon_desc: "Ценой бегства, бросив все, чтобы стряхнуть преследование Тринити, была холодная груда руин и лишь несколько выживших студентов."
  ARI_pyeho_hakwon_remove_tt: "\nУстраняется при выполнении условия: более §Y30§! фабрик\n"
  ARI_pyeho_hakwon_1: "Свет среди руин"
  ARI_pyeho_hakwon_1_desc: "Ценой бегства, бросив все, чтобы стряхнуть преследование Тринити, была холодная груда руин и лишь несколько выживших студентов.\n\nОднако мы не сдались отчаянию среди руин. Студенты Ариуса запускают генераторы, производят боеприпасы и, полные решимости отомстить, молча прячутся под светом фонаря."
  ARI_german_defectors_1: "Свободный немецкий легион"
  ARI_german_defectors_2: "Анти-Тринити изгнанники"
  ARI_acceptance_of_exiles_tt: "Получается национальный дух §YСвободный немецкий легион§!, и периодически будут создаваться подразделения с §Y6 батальонами пехоты§! и ротами поддержки §Yинженеров§!, §Yразведки§! и §Yартиллерии§!.\n"
  ARI_german_defectors_1_tt: "Периодически будут создаваться подразделения с §Y6 батальонами пехоты§! и ротами поддержки §Yинженеров§!, §Yразведки§! и §Yартиллерии§!.\n"
  ARI_final_offensive: "Финальное решающее сражение"
  ARI_final_offensive_desc: "Настал момент сокрушить Тринити сокрушительным наступлением!"
  ARI_lantern_of_the_germanic: "Фонарь Германии"
  ARI_lantern_of_the_germanic_desc: "Сжечь Тринити дотла. Этого единственного лозунга было достаточно, чтобы привлечь немцев, ослепленных местью, готовых оставить позади все другие неблагоприятные условия.\n\nЕсли Бог существует, его нет в Тринити, и мы просто нанесем им удар."
  ARI_lantern_of_the_germanic_tt: "Устраняется при выполнении условия: контролировать как минимум §Y4§! государства"
  ARI_economic_corruption: "Экономическая коррупция"
  ARI_economic_corruption_tt: "Устраняется при завершении фокуса §Y$ARI_economic_structure_reform$§!"
  ARI_economic_structure_reform_tt: "Предотвращает экономические проблемы, которые возникнут позже."
  idea_ARI_wartime_workshop_opening: "Производственные мастерские военного времени"
  idea_ARI_wartime_workshop_opening_desc: "Будь то грабежи, послевоенные репрессии, приказы личной гвардии или националистическая мобилизация, все домохозяйства и организации принуждаются к изготовлению огнестрельного оружия."
  idea_ARI_wartime_workshop_opening_tt: "Устраняется после окончания войны: в мире с §Y[TRM.GetNameWithFlag]§!"
  ARI_student_resistance: "Сопротивление ангелов"
  ARI_student_resistance_desc: "В день, когда Эдем был отнят, студенты Тринити решили сопротивляться Ариусу."

