  ## События
  ARI_reformist_event_chain.1.t: "Где исчез класс"
  ARI_reformist_event_chain.1.d: "Первый государственный арсенал, вибрирующий едким запахом дыма и пронзительным скрежетом обрабатываемого металла. Джёмаэ Саори нахмурилась, следуя за Ширасу Адзусой.\n\nДо сих пор Саори не могла понять метод Адзусы. Под предлогом «реформы экономической структуры» маленькие оружейные мастерские, державшиеся на задворках автономного округа Ариуса, разорились, а капиталисты немецкого происхождения — до сих пор благосклонные — ушли с криками. В глазах Саори это была не реформа, а акт самоистязания: перерезать последнюю оставшуюся опору.\n\nНо в тот момент, когда открылась тяжелая железная дверь и она увидела то, что предстало перед ней, ее шаги остановились.\n\n«...Это.»\n\nБылая картина — студенты в сырых подвалах, в так называемых «трудовых классах», штампующие боеприпасы вручную — исчезла бесследно. На огромной конвейерной ленте без остановки сходили стандартизированные винтовки; а в другом цехе печь извергала красное дыхание, плавя и куя стволы. Это уже была не «партизанская мастерская». Это был, без сомнения, «государственный завод».\n\n«...Ручным способом, как раньше, был предел.»\n\nАдзуса повысила голос среди грохота. Ее лицо было спокойно, но взгляд был полон убежденности.\n\n«Жаль, что маленькое ломается... но чтобы защитить нечто большее, другого выбора не было. Это ответ, который я нашла.»\n\nСаори взяла только что произведенную винтовку. Тяжелая, холодная и, самое главное... совсем не грубая. Она передернула затвор. Металлический *клац*, чистый и приятный, разнесся эхом.\n\n«...Неплохо.»\n\nОна опустила оружие и кратко добавила. Это было высшее одобрение, которое она могла дать. Эпоха сбора металлолома среди руин для кустарного производства оружия закончилась. Адзуса разрушала не напрасно."
  ARI_reformist_event_chain.1.a: "\"Это был результат... лучше, чем я ожидала.\""

  ARI_reformist_event_chain.2.t: "Оркестр"
  # CASE 1: Низкие отношения - жест примирения, начало понимания
  ARI_reformist_event_chain.2.da: "В зале перестроенного древнего собора настраивающийся первый оркестр Ариуса заполнял пространство диссонансом. Ширасу Адзуса, напряженная, искоса поглядывала на сидящую рядом Джёмаэ Саори.\n\nСаори, скрестив руки, наблюдала за студентками на сцене, словно оценивая их. Для нее скрипка и виолончель, вероятно, казались более тяжелыми и неэффективными инструментами, чем оружие.\n\n«...Это ты называешь «культурой Ариуса»?»\n\nНа сухой вопрос Саори Адзуса едва кивнула.\n\n«Скорее, чем культура... это терапия.»\n\nПалочка рассекла воздух, и грянула первая нота. Неуклюжая, но отчаянная мелодия. Это был не военный гимн, не лозунг, разжигающий ненависть. Это была просто чистая звуковая волна. Саори чуть было не цокнула языком, но остановилась: на лице студентки, играющей на скрипке, она увидела «сосредоточенность», которой никогда не видела во время стрелковых тренировок.\n\nБлиже к концу Саори выпустила маленький вздох и поправила позу.\n\n«...Тактическая ценность: ноль. Но...»\n\nНе глядя на Адзусу, она выдавила это, как неохотное признание.\n\n«Иногда слушать этот шум вместо выстрелов неплохо. Только в этот раз я подыграю тебе.»"
  # CASE 2: Высокие отношения - разделяемое спокойствие, товарищество
  ARI_reformist_event_chain.2.db: "Когда началась вторая часть концерта, атмосфера в правительственной ложе была такой спокойной, что почти клонило в сон. Адзуса, вместо того чтобы вертеть программку, слушала музыку с закрытыми глазами. А рядом с ней Саори тоже погрузилась в кресло, ослабив свою обычную настороженность.\n\n«Как странно.»\n\nТихо пробормотала Саори.\n\n«Мы только и учились, что все суета. И все же эти девушки месяцами не спали, чтобы создать этот бесполезный звук.»\n«Да. ...Может быть, это прекрасно именно потому, что бесполезно.»\n\nНа ответ Адзусы Саори издала смешок. Раньше это был бы смех насмешки; теперь это был явно смех сообщников. Их руки были в мозолях и пахли порохом, но в этот момент вместо оружия они держали спокойствие.\n\n«Адзуса.»\n«А?»\n«...Неплохо. Твой Ариус.»\n\nВнутри мелодии, приближающейся к кульминации, на мгновение лицо Саори было лицом обычной зрительницы, а не командира."
  # CASE 3: Саори на пенсии (гражданское лицо) - приглашение и поддержка
  ARI_reformist_event_chain.2.dc: "Прямо перед началом представления дверь правительственной ложи открылась. Но вошел не кто-то в форме, а Джёмаэ Саори, одетая как обычная гражданская: обычная куртка, джинсы, такая одежда, которую видишь повсюду.\n\n«...Пригласила, а теперь делаешь такое удивленное лицо, госпожа Премьер-министр.»\n\nСаори, неловко нахлобучив кепку, села рядом с Адзусой. Она больше не была главой армии, но для Адзусы она оставалась самой трудной сенпай: стеной, которую ей пришлось преодолеть.\n\n«Спасибо, что пришла, Саори.»\n«У безработных время гниет. К тому же... я должна проследить, какую глупость оставила после себя моя преемница, разве нет?»\n\nКогда заиграла музыка, глаза Саори следили за девушками на сцене. Вместо строевой подготовки они читали ноты; вместо штыков натягивали смычки. Сцена, немыслимая в ее времена; более того, сцена, которую даже нельзя было вообразить.\n\nКогда пьеса закончилась и разразились оглушительные аплодисменты, Саори не хлопала. Она молча встала.\n\n«...Я бы не смогла так.»\n\nОна легонько хлопнула Адзусу по плечу и пошла дальше. Спина Саори уже не казалась такой огромной, как раньше. Но, впервые, она выглядела легче, чем когда-либо."
  ARI_reformist_event_chain.2.a: "Кажется, ее настроение улучшилось."

  ARI_reformist_event_chain.3.t: "Роспуск Вспомогательного трудового корпуса"
  ARI_reformist_event_chain.3.d: "Чернила на указе о роспуске еще не высохли. Джёмаэ Саори, опершись о подоконник кабинета, наблюдала за караваном грузовиков, увозящих уже расформированный корпус обратно по домам.\n\n«...Честно говоря, это было неожиданно.»\n\nСаори говорила, не отрывая взгляда.\n\n«Вспомогательный трудовой корпус бесчеловечен, да. Но в нынешнем Ариусе он был самым эффективным механизмом. Даже эти из твоей фракции реформистов предлагали «сохранить его хотя бы до конца восстановления». И все же я не думала, что ты проигнорируешь всю оппозицию и форсируешь этот указ.»\n«Страна, построенная на чьих-то жертвах... в конце концов порождает лишь новую ненависть.»\n\nАдзуса ответила без колебаний. Только тогда Саори повернула голову, чтобы посмотреть на нее. Даже погруженная в грязь власти, ее глаза оставались чистыми, как у ребенка, неспособного торговаться с компромиссом."
  ARI_reformist_event_chain.3.a: "\"Я рада... что ты еще не потеряла этот свой глупый идеал, Адзуса.\""

  ARI_reformist_event_chain.4.t: "Неизбежное"
  ARI_reformist_event_chain.4.d: "Красный аварийный свет в штабе вращался без остановки. Срочные донесения с фронта передавались по радио, но Ширасу Адзуса только ошеломленно смотрела на оперативную карту.\n\n«...Я хотела остановить это.»\n\nГолос Адзусы дрожал.\n\n«Я сделала все, что могла. Убеждала студентов Тринити, очистила прошлое, пыталась доказать, что мы больше не «монстры». Но... это не помогло. Геенна все еще называет нас террористами, и наши студенты либо пугаются их голосов... либо приходят в ярость.»\n\nОна сильно сжала рукой карту.\n\n«Это было неизбежно? Мы... можем жить, только если всю жизнь будем с кем-то воевать?»\n\nТогда Джёмаэ Саори, стоявшая рядом, подошла и положила руку на плечо Адзусы. Это было тяжелое, твердое прикосновение.\n\n«Адзуса. Подними голову.»\n\nСаори удержала колеблющийся взгляд Адзусы, не отводя глаз.\n\n«Твои усилия избежать драки не были напрасны. Благодаря этому сегодня мы можем взяться за оружие ради «выживания», а не ради «безумия». Этого достаточно.»\n\nСаори проверила пистолет на поясе и тихо добавила:\n\n«Не бери на себя вину. Пачкать руки кровью — моя роль. Ты... просто проследи, чтобы место, куда мы возвращаемся, не рухнуло.»"
  ARI_reformist_event_chain.4.a: "Курок был нажат."

  ARI_reformist_event_chain.5.t: "Хватит отступать"
  ARI_reformist_event_chain.5.d: "Поздно ночью звук шагов, слонявшихся перед личной комнатой Саори, стих. После долгого молчания, вместо того чтобы набраться храбрости постучать, Адзуса заговорила шепотом, едва проникавшим сквозь дверь.\n\n«...Прости.»\n\nЭто было извинение. Признание за неуважительные слова, сказанные во имя реформы, за злоупотребления своих сторонников, которые она не смогла сдержать, и за вину в том, что бежала, как будто взвалила всю тяжесть на Саори.\n\n«Были мнения, что нужно тебя свергнуть. Конечно... я помешала этому. Но это не смывает моей вины. Я хотела изменить это. Я начала, потому что хотела давать им горячий рис, а не заплесневелый хлеб... и все же, чем дальше я иду, тем больше чувствую, что увязаю в грязи.»\n\nС той стороны не было ответа. Адзуса горько опустила голову. Уже слишком поздно? Она прислонилась лбом к стене и, словно сдаваясь, развернулась. Да, с каким лицом она могла бы просить утешения сейчас?\n\nШаг, шаг. Она не сделала и нескольких.\n\nСкрииип—.\n\nДверь позади нее открылась, и грубая рука схватила ее за руку. Адзуса вздрогнув обернулась и увидела Саори в пижаме, с растрепанными волосами.\n\n«...Не могу уснуть от такого шума.»\n\nСаори проворчала раздраженно, но руку не отпустила.\n\n«Заходи. Заварю хотя бы чай.»\n\nЭто грубое прикосновение сохраняло то же тепло, что и раньше, которое помнила Адзуса. Той ночью, внутри двери, которая была закрыта, голоса обеих звучали еще очень долго: осторожный и отчаянный разговор, словно собирающий осколки разбитой вазы."
  ARI_reformist_event_chain.5.a: "Та ночь была долгой."

  ARI_reformist_event_chain.6.t: "Боевая подготовка – 1"
  ARI_reformist_event_chain.6.d: "Вызов, который после последней встречи снова казался далеким, пришел внезапно. В 2 часа ночи на личном терминале Адзусы появилось имя отправителя: «Джёмаэ Саори». Содержание было в одну строку.\n\n'На учебный полигон 3. Иди вооруженной.'\n\nШирасу Адзуса, протирая тяжелые веки, направилась на полигон. Ее голова была забита завтрашней корректировкой бюджета, письмами для успокоения консерваторов и новостями о протестах студентов тринитианского происхождения. С каждым шагом ботинки звучали в пустом коридоре, но в ушах гудел только политический шум.\n\nКогда она прибыла, полигон был погружен в полную темноту.\n\n«Саори? Я пришла. В чем дело? Если это срочный доклад...»\n\nБАХ—!!\n\nВместо ответа что-то разорвало ночь: боевой выстрел, без предупреждения.\n\n«Кгх?!»\n\nАдзуса инстинктивно бросилась за укрытие. Бетонный пол, где она была секунду назад, был ужасно раздроблен. Холодок пробежал по спине. И все же в тот же миг в ее голове пронеслась мысль «почему?» вместе с клубком хаотичных размышлений."
  ARI_reformist_event_chain.6.a: "\"Да что за черт...?\""

  ARI_reformist_event_chain.7.t: "Боевая подготовка – 2"
  ARI_reformist_event_chain.7.d: "Шаг, шаг. Из темноты вышла Саори с учебной винтовкой на изготовку.\n\n«Реагируешь поздно. Голова затвердела от раздумий о глупостях?»\n\nСаори пнула к Адзусе другую винтовку, лежавшую на земле.\n\n«Бери. Это настоящая тренировка.»\n\nАдзуса сжала губы и подобрала оружие, и в тот же миг оба ствола выплюнули огонь одновременно. Перестрелка была ожесточенной, но тело Адзусы было уже не тем, что раньше. Даже нажимая на курок, бесполезные мысли — вроде завтрашнего расписания — хватали ее за лодыжку.\n\n«...Слишком много мыслей.»\n\nВ конце концов дистанция сократилась, Саори отбила ствол в сторону и ворвалась внутрь. Глухой удар перевернул мир Адзусы. Когда она пришла в себя, она была прижата к холодному полу, и ствол Саори целился ей в переносицу. Идеальное поражение.\n\n«Ха... ха...»\n\nСаори убрала оружие, глядя на задыхающуюся Адзусу.\n\n«Ты слабее, чем раньше.»\n\nВместо того чтобы протянуть руку, Саори холодно отчитала ее:\n\n«Ты даже со мной не справляешься, а все же хотела взвалить на себя весь мир одна. Знай свое место, Адзуса.»\n\nЭто могло звучать как упрек, но Адзуса почувствовала это иначе: грубое, но верное обещание, на свой лад — если ты слаба, я защищу тебя. Обхватив ноющее плечо, Адзуса, парадоксально, почувствовала, что ее груз стал легче."
  ARI_reformist_event_chain.7.a: "\"Еще раз... прошу тебя.\""

  ARI_reformist_event_chain.8.t: "Только один раз – 1"
  ARI_reformist_event_chain.8.d: "В кабинете в 3 часа ночи Джёмаэ Саори швырнула на стол — почти как будто бросила — «4-е предложение о корректировке бюджета», которое представила ей Ширасу Адзуса.\n\n«Отклонено. Ты с ума сошла? Сократить военные поставки, чтобы перебросить их на образовательный бюджет? Объясни логически. Как это поможет выжить?»\n\nСтена Саори была непоколебима. Адзуса открыла рот и снова закрыла. Рациональное убеждение терпело неудачу уже три часа, и это был не тот человек, которого можно было запугать или подкупить. В голове Адзусы все тактики были помечены как «провал». Оставалась только одна карта.\n\nХолодно потея, Адзуса вспомнила фразу из любовного романа, который брала почитать в Тринити, и «трюк», которому ее в шутку научила Урава Ханако. Внутренняя тревога зазвенела: «если я это сделаю, возможно, умру социально». Но пути назад уже не было.\n\n«......»\n\nАдзуса встала, подошла к Саори и дрожащей рукой едва ухватилась за край рукава формы Саори."
  ARI_reformist_event_chain.8.a: "..."

  ARI_reformist_event_chain.9.t: "Только один раз – 2"
  ARI_reformist_event_chain.9.d: "\"...Саори... сестренка?\"\n\nЕе голос был тих, и конец фразы сильно дрожал от почти смертельного стыда. Адзуса попыталась посмотреть снизу вверх, как говорилось в книге, поднимая взгляд... но унижение взяло верх, и ее глаза заметались в воздухе.\n\n«Э-это... только в этот раз... нельзя? ...да?»\n\nТишина. Тишина, более полная, чем пустошь, опустошенная бомбардировкой.\n\nСаори замерла в воздухе рука, которой собиралась взять документы на утверждение; она окаменела, как человек, столкнувшийся с неведомым существом. Ее глаза метались между дрожащими пальцами Адзусы, ее покрасневшими ушами и той странной фразой, которую она только что услышала.\n\n«...Адзуса.»\n«......»\n«...У тебя что-то болит? Вызвать врача?»\n«Н-нет... просто... пожалуйста...»\n\nКогда Адзуса опустила голову, как будто ища нору, чтобы зарыться, Саори провела рукой по лицу и выпустила долгий, глубокий вздох. Она почувствовала, что с этим справиться труднее, чем с любым кризисом на поле боя.\n\n«...Хах. Ладно. Я поняла.»\n\nСаори резко подписала бумаги. Даже не просматривая их: чистая «капитуляция».\n\n«На. И больше не делай при мне таких... странных вещей. Это вредно для сердца.»\n\nАдзуса выхватила документы, как будто украла их, и выбежала из кабинета. Даже после того, как дверь закрылась, Саори еще долго смотрела в пустоту на край собственного рукава."
  ARI_reformist_event_chain.9.a: "Это смертельный удар. Для Адзусы."

  ARI_reformist_event_chain.10.t: "Приближающаяся буря"
  ARI_reformist_event_chain.10.d: "На улицах, где установилось железное правительство Ариуса, воцарилась не тишина, а невыносимый «шум». «Свобода», обещанная правительством Ширасу Адзусы, сняла намордник с угнетенных, но из их ртов вырвались не слова благодарности, а лавина требований. Студенты в форме бывшей Объединенной академии Тринити собираются на площади разрушенного собора, устраивая сидячую забастовку с требованием «восстановления административной системы Чайной партии» и «возврата конфискованных чайных садов». За ними, с мегафонами, бывшие бюрократы Чайной партии осуждают некомпетентность правительства и пытаются вернуться в политику.\n\nХаос не ограничивается академией. В промышленной зоне Познани работницы и работники польского происхождения маршируют, размахивая флагами и требуя улучшения обращения; в Силезии немцы распространяют листовки, требующие автономии, обвиняя Ариус в «действиях как оккупационные силы».\n\nПока еще не летят коктейли Молотова и не звучат выстрелы. Но уровень децибел на площади — где переплетаются языки, лозунги и разные желания — растет день ото дня. Они слишком хорошо знают, что правительство не может их подавить, и потому с еще большей наглостью стучат в двери административного здания."
  ARI_reformist_event_chain.10.a: "Нужно любой ценой решить ситуацию!"

  ARI_reformist_event_chain.11.t: "Превентивные меры"
  ARI_reformist_event_chain.11.d: "Когда Ширасу Адзуса пришла на работу, содержание «ежедневного доклада безопасности» на ее столе было подозрительно спокойным. Массовые протесты, анонсированные до вчерашнего дня в Берлине, Познани и бывшем автономном округе Тринити, были отменены или сократились, как будто их и не было.\n\n«...Что здесь произошло?»\n\nНа тихий вопрос Адзусы ответила Джёмаэ Саори, сидевшая на диване и начищавшая свои сапоги.\n\n«Я немного прибралась.»\n\nОбъяснение Саори было кратким и сухим. Прошлой ночью она собрала резерв армии Ариуса, верный ей. Она нацепила им импровизированные повязки с названием «силы поддержания порядка» и напала на убежища агитаторов, возглавлявших протесты, и радикалов из Тринити: всех их арестовала.\n\n«Ты ввела военных? Это же фактически военное положение!»\n«Это не армия. Это «силы поддержания порядка». На бумаге проблем нет.»\n\nСаори ответила спокойно и отставила сапоги, которые чистила.\n\n«У них были не только мегафоны. Также были бутылки с зажигательной смесью и самодельная взрывчатка. Если бы ты следовала «законной процедуре», как ты говоришь, в утренних новостях была бы прямая трансляция пожара. ...Я приму оскорбления на себя. Тебе оставлю результат.»\n\nАдзуса закусила губу. То, что сделала Саори, было, без сомнения, опасным актом. Но также было правдой, что это спасло правительство Адзусы от кризиса. Теперь она должна была выбрать: терпеть этот «грязный мир» или рискнуть, чтобы сохранить принципы."
  ARI_reformist_event_chain.11.a: "\"Хорошая работа. ...Это было необходимо.\""
  ARI_reformist_event_chain.11.b: "\"Освободи задержанных и выведи силы.\""

  ARI_reformist_event_chain.12.t: "Скрип шестеренки"
  ARI_reformist_event_chain.12.d: "Выстрелы прекратились, но шум заводов тоже стих. От промышленных комплексов Берлина до портов Восточной Пруссии странная форма «тишины» начинает пожирать территорию Ариуса.\n\nНемецкие рабочие не объявляли забастовку. Они приходят на работу вовремя и становятся на свои места. Только если у них падает инструмент, они тратят тридцать минут, чтобы его поднять; а если машина ломается, они стоят целый день, утверждая, что нет запчастей. Владельцы магазинов отрицательно качают головой покупателям с тринитианским акцентом, говоря, что «все уже кончилось», но через черный ход отдают хлеб и молоко соседям, говорящим по-немецки.\n\nЭто не организованный приказ. Это коллективная реакция отторжения немцев на «про-Тринити реформу» правительства Адзусы. Они чувствуют, что их рабочие места под угрозой из-за тринитианцев, и молча сопротивляются политике, принимающей как соседей своих агрессоров, когда даже раны Великого Перемещения еще не зажили.\n\nЭто гигантское пассивное сопротивление медленно закупоривает вены государства. Производство рухнуло, а административные приказы игнорируются на местах. Мы должны любой ценой устранить этот скрип."
  ARI_reformist_event_chain.12.a: "Сначала нужно успокоить гнев немцев."
  ARI_reformist_event_chain.12.b: "Воспользуемся случаем, чтобы отменить дискриминацию тринитианцев при приеме на работу."

  ARI_reformist_event_chain.13.t: "Прогрессивные манифестанты"
  ARI_reformist_event_chain.13.d: "На фоне криков тех, кто оккупировал площадь Эдема и собор Тринити, начала подниматься новая волна. На их флагах не было этнических символов или религиозных лозунгов, а только сдержанно написанный лозунг «примирения и восстановления» правительства Адзусы. Состав этих «прогрессивных манифестантов» странно разнообразен: немецкий начальник фабрики, уставший от пассивного саботажа и желающий только вернуться к работе; обычная студентка Тринити, уставшая от авторитарной культуры старой Чайной партии; и граждане, поддерживающие перемены в Ариусе.\n\nОни противостоят речам ненависти экстремистов, выкрикивая «реалистичные альтернативы» и «верховенство закона». Это люди, принявшие, что прагматичный центризм Адзусы — это не «теплый компромисс», а единственный волнорез, способный предотвратить катастрофу.\n\n«Мы не хотим призраков прошлого, мы хотим сегодняшнего хлеба!»\n\nЭта спонтанная поддержка — неожиданный союзник для правительства. Теперь мы должны решить: финансировать их и организовать, чтобы превратить в авангард реформы, или сохранять дистанцию, чтобы защитить их чистоту?"
  ARI_reformist_event_chain.13.a: "Нельзя упускать это течение. Организуйте их!"
  ARI_reformist_event_chain.13.b: "Не вмешиваться."

  ARI_reformist_event_chain.14.t: "Переставить стол"
  ARI_reformist_event_chain.14.d: "Когда Ширасу Адзуса открыла дверь кабинета председателя студенческого совета и вошла, Джёмаэ Саори сухо спросила, не отрывая взгляда от документов.\n\n«Это уже твой третий визит только сегодня. В штабе реформистов нет телефона?»\n\nАдзуса вздохнула и положила на стол толстую папку с утверждениями. От штаба реформистов до кабинета было пятнадцать минут пешком. И вдобавок путь требовал прохождения двух пунктов безопасности.\n\n«Это неэффективно.»\n\nАдзуса сказала это твердо.\n\n«Затраты рабочей силы, времени и даже риск прослушки или кражи при транспортировке документов... тактически, эта разделенная административная структура — провал. Поэтому, Саори-унни... нет, председатель. Я предлагаю кое-что.»\n\nСаори наконец подняла взгляд.\n\n«Давайте объединим офисы. Я буду использовать пустой зал заседаний по операциям на втором этаже этого здания как свой кабинет.»\n\nЭто была не просто смена комнаты. Это было заявление о политическом союзе: Адзуса, лидер реформистов, проникала в пространство Саори, символа консерваторов. После короткого молчания Саори покрутила ручку и ответила безразлично:\n\n«...Делай что хочешь. Но не хочу, чтобы мой кабинет стал шумным.»\n«Не волнуйся. Стены толстые.»\n\nЛицо Адзусы не изменилось, но, уходя, ее шаги казались легче, чем при входе."
  ARI_reformist_event_chain.14.a: "Больше не нужно ходить 15 минут за утверждением."

  ARI_reformist_event_chain.15.t: "Поединок 2"
  ARI_reformist_event_chain.15.d: "БАХ—! ДЗИНЬ—!\n\nТо, что разорвало тишину учебного полигона, были лезвия металла и хриплое дыхание. Ширасу Адзуса больше не колебалась, как раньше. Она проскользнула в мертвую зону Саори и ринулась с учебным ножом, зажатым обратным хватом. Движение было чистым, без лишнего, и даже смешивало иррегулярную тактику, которую она выучила в Тринити.\n\n'Попалась.'\n\nКак раз когда Адзуса собиралась нанести решающий удар, пользуясь тем, что центр тяжести Саори качнулся...\n\n«...Однообразно.»\n\nГолос Саори коснулся ее уха. Вместо того чтобы уклониться, Саори шагнула внутрь атаки и толкнула Адзусу плечом в грудь. Удар перехватил дыхание; тело Адзусы поднялось в воздух и в следующий миг рухнуло на холодную землю.\n\n«Кгх... ха... ха...»\n\nВид дрожал. Когда она пришла в себя, ствол Саори указывал прямо в сердце Адзусы. Еще одно полное поражение.\n\nНо Саори убрала оружие и протянула руку.\n\n«Лучше, чем раньше. По крайней мере, в этот раз... ты заставила меня вспотеть.»\n\nНа лбу Саори выступили капельки пота. Это было молчаливое признание: признание того, что Адзуса больше не «ребенок, которого нужно защищать», а «воин, за которым нужно следить».\n\n«Вставай, Адзуса. Сделаем еще раз. Этот твой странный стиль... довольно интересный.»"
  ARI_reformist_event_chain.15.a: "Стена была высока, но не недосягаема."

  ARI_reformist_event_chain.16.t: "Время колдовать"
  ARI_reformist_event_chain.16.d: "\"Не двигайся, лидер. Попаду в глаз.\"\n«...Угх. Мы правда должны это делать?»\n\nДжёмаэ Саори крепко зажмурилась, напряженная, как ребенок в кресле стоматолога. Перед ней Ширасу Адзуса торжественно держала палитру пастельных тонов и кисти.\n\n«Макияж, которым ты пользуешься, будучи президентом, слишком «военный». Это не макияж: это больше похоже на камуфляжную раскраску.»\n\nАдзуса, вспоминая техники, которым ее научили Ханако и Хифуми, нанесла мягкие коралловые румяна на щеку Саори. Холодное, бледное лицо Саори начало наполняться жизнью. Даже на грубой коже легкая основа легла ровно.\n\n«...Готово. Открой глаза.»\n\nСаори с опаской посмотрела в зеркало. Там была не «диктаторша Ариуса» и не «машина для убийства». Только обычная девушка, немного застенчивая и немного неловкая, смотрящая на себя.\n\n«Это... странно.»\n«Это мило. Хифуми сказала: милота спасет мир.»\n\nСаори прокашлялась, глядя на свое отражение. Краснота ее ушей, возможно, была не только от румян. Она очень тихо пробормотала:\n\n«...Неплохо. Иногда.»"
  ARI_reformist_event_chain.16.a: "И все же, казалось, она не согласится на это во второй раз."

  ARI_reformist_event_chain.17.t: "Окончательный приговор коллаборационистам Чайной партии"
  ARI_reformist_event_chain.17.d: "В последнем ряду зала Джёмаэ Саори наблюдала за судом, скрестив руки. На скамье подсудимых сидели бывшие бюрократы Тринити, которые во время оккупации сотрудничали с Чайной партией и возглавляли войну против Ариуса.\n\nСначала Саори с подозрением относилась к плану Адзусы о «независимости судебной власти». Зачем нужны сложные юридические теории и доказательства, чтобы устранить врага? Суммарная казнь гораздо эффективнее и дешевле. Так она училась жить.\n\n«Все подсудимые приговариваются к 20 годам тюремного заключения и принудительным работам.»\n\nКогда прозвучал суровый приговор судьи, зал на мгновение затих. Саори, ожидая бунта, положила руку на свой пистолет. Но... из уст граждан Тринити, заполнявших зал, вырвался не крик и не освистывание.\n\n«...»\n«...Приговор Ариуса, надо полагать.»\n\nЭто было «принятие». Не из-за страха перед стволом Ариуса, а из-за капитуляции перед «справедливостью», налагающей наказание, соразмерное совершенному преступлению. Наказание исходило не от произвольного лезвия, а от социальной системы: вместо мятежа оно сеяло облегчение."
  ARI_reformist_event_chain.17.a: "\"...Признаю. Твой метод эффективнее.\""
## 아리우스의 진행 방식
