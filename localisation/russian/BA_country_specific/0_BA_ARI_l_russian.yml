  ARI_nazi_party: "Национал-социалистическая немецкая рабочая партия"
  ARI_nazi_party_desc: "Национал-социалистическая немецкая рабочая партия была партией, правившей до Великого Перемещения могущественным государством под названием Германия. Однако после инцидента Великого Перемещения Германия была уничтожена Кивотосом, возглавляемым двумя академиями, Тринити и Геенной. После того как вместе с Берлином бесследно исчезли Фюрер и таланты Германии, они скрылись глубоко под землей.\n\nИ среди руин ветви Ариуса они снова объявились, объединенные общей чертой: ненавистью к Тринити и Геенне. Теперь нацистская партия и ветвь Ариуса взялись за руки и готовят великую битву против Тринити и Геенны."

  ARI_german_reconstruction_government: "Правительство восстановления"
  ARI_german_reconstruction_government_desc: "Правительство восстановления Германии отвечает за восстановление национальной территории, опустошенной войной с Тринити, Геенной и другими сущностями из иных миров."

  ARI_crackdown_on_anti_government_activities: "Подавление антиправительственной деятельности"

  ARI_land_reconstruction_project: "Проект национального восстановления"

