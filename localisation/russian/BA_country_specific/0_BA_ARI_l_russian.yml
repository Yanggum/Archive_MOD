  ARI_conservative_event_chain.1.t: "После дождя, ясно"
  ARI_conservative_event_chain.1.d: "Поздним днем в центре, после того как прошел ливень, зал собрания реформистов, едва перегруппировавшийся, погрузился в сырую и тихую атмосферу, как барак побежденных. Больше не было криков, разрезающих воздух, ни агитаторов с налитыми кровью глазами, взывающих к революции. Оставалось только тяжелое дыхание тех, кто упирался ногами в холодный бетон реальности, распространявшийся как туман.\n\nНа трибуне Ширасу Адзуса медленно обвела взглядом присутствующих, как командир, оглядывающий старое поле боя. Ее форма была безупречна, но на плечах висела, как эполет, одинокая тень той, кто не смогла превратить идеал в реальность.\n\n«...Ветер переменился, и мы хотели стать бурей, но должны признать, что были не более чем рассеянной пылью.»\n\nГолос Адзусы был сух, но пронзал болезненную правду. Она сжала кулак, а затем медленно разжала его: знак капитуляции и ритуал, чтобы отпустить тщетное упрямство.\n\n«Стены старого порядка были крепки, и молот, которым мы хотели их разбить, сломался. ...Но если стена не падает, значит, мы должны научиться жить внутри. Отныне мы будем не врагом, нацеливающим копья, а будем искать совместное правление и умеренные изменения.»\n\nЭто было объявление о поражении и смена курса: вместо радикального разрушения остаться силой сдерживания внутри системы. Среди людей не раздалось рычания смирения, а вздох облегчения, как волна, спадающая и оставляющая лишь мелкую рябь. Граждане поняли: больше крови не прольется, и руль Ариуса полностью перешел в руки Саори и консерваторов.\n\nАдзуса посмотрела на большое здание правительства за окном и отдала короткое, твердое приветствие: вежливость победителям и поклон реальности по имени Государство."
  ARI_conservative_event_chain.1.a: "Буря прошла."

  ARI_conservative_event_chain.2.t: "Подпишите здесь"
  ARI_conservative_event_chain.2.d: "Когда Утадзуми Сакурако и другие лидеры Сестринства предстали перед подземным судом Собора Тринити, взгляды радикалов Ариуса, заполнявших галерею, горели жаждой крови. Они хотели самого жестокого наказания для «ведьм священного совета». Никто не хотел их судить... но все хотели видеть их кровь.\n\nНо Джёмаэ Саори, сидевшая в центре судейской коллегии, думала иначе. Да, Сестринство тоже нацеливало на нас оружие и, используя химическое оружие, участвовало в войне активнее других. Но если объявить их сейчас «военными преступниками», чтобы казнить или заключить в тюрьму... тогда пришлось бы посадить всех студентов Тринити, спускавших курок по приказу Чайной партии. Это было бы не правосудие, а бесконечная резня.\n\n«...Чайная партия и Департамент юстиции пали. Я считаю смягчающим обстоятельством то, что вы, в отличие от них, не руководили «активной войной».»\n\nКогда зачитали сухой приговор Саори, зал заволновался. Но Саори не колебалась и вынесла приговор:\n\n«Однако вы не свободны от вины. Поэтому право наследования, которое Сестринство приписывало себе от древней преступной группы «Священный орден Юстины», аннулируется навсегда. Вы больше не ее наследницы. И с сегодняшнего дня во всех монастырях философия Ариуса в обязательном порядке вводится в учебный план.»\n\nСакурако сжала губы, но в конце концов склонила голову и приняла. Это было огромное отступление от идеала Сестринства, возможно, даже его угасание... но по сравнению с тем, чего они боялись, это позволило монахиням выдохнуть с облегчением. Вместо крови Саори положила свою «веру» на операционный стол."
  ARI_conservative_event_chain.2.a: "Сестринство... не имеет отношения к Священному ордену Юстины."

  ARI_conservative_event_chain.3.t: "Клуб послешкольных десертов"
  ARI_conservative_event_chain.3.d: "\"У-уээ... то есть... согласно новому закону Ариуса об общественном порядке, деятельность частных клубов численностью более 3 человек без разрешения... уугх?!\"\n\nКогда Цутинага Хиёри открыла дверь в класс Клуба послешкольных десертов, она не смогла закончить фразу. Потому что Нацу и Кадзуса поставили перед ней «особый Монблан лимитированной серии Тринити» и дымящуюся чашку чая.\n\n«Давайте, давайте, серьезные темы могут подождать, пока вы это съедите. Приглашенная от Ариуса.»\n«Хиёри-тян, да? Это безумно трудно достать. Должно было быть только для нас, но сегодня твой день.»\n\nЗрачки Хиёри яростно задрожали. «Приказ о принудительном роспуске сепаратистских групп» в ее руке стал легче пушинки перед сладким запахом масла. Она хотела съесть только один кусочек, а потом стать строгой... но когда она пришла в себя, тарелка была уже пуста.\n\n«...Э-тогда... дело в том... я дам вам разрешение продолжать. Н-но... так как за вами будет наблюдение Ариуса...»\n«Наблюдение? Это же требует бюджета, да? Если вы профинансируете ингредиенты, можете приходить, когда захотите, «наблюдать (пробовать)».»\n\nВ конце концов, то, что Хиёри принесла Саори, было не приказом о роспуске, а <Планом полного финансирования Клуба послешкольных десертов и выделением специального бюджета на закуски>. Оправданием было «успокоение недовольства остатков Тринити», но бумага пахла сахарной пудрой. Бухгалтеры Ариуса чуть не упали в обморок от расходов, но, увидев счастливую улыбку Хиёри, не смогли отказать."
  ARI_conservative_event_chain.3.a: "Это же очевидное расточительство!"

  ARI_conservative_event_chain.4.t: "Библиотечный комитет"
  ARI_conservative_event_chain.4.d: "Тяжелая дверь старого архива открылась, и Имашино Мисаки вошла, шаг за шагом. Это темное место, пропитанное запахом плесени и старой бумаги, было для Мисаки, ненавидящей свет, странно комфортным.\n\nКозеки Уи, прятавшаяся и дрожащая за стеллажом, чуть не закричала, увидев ее, но, встретив пустой и сухой взгляд Мисаки, закрыла рот. Она учуяла в незваной гостье тот же запах «себе подобных»: желание отключиться от мира.\n\n«...Нам нужно сотрудничество. Мы защитим тебя, чтобы шумные снаружи не могли вмешаться. Взамен право собственности на эти древние книги переходит к Ариусу.»\n«...Защитите? Вы правда... остановите этих шумных идиотов? Чтобы я могла читать здесь, без солнечного света и шума... только в этой темноте?»\n«Да. Нас тошнит от шума.»\n\nМисаки плюхнулась на пол и стала играть со своим брелоком. Уи молча села напротив нее. Между ними воцарилась тяжелая, мрачная тишина, понятная без слов: странный резонанс, как бездна, смотрящая в другую бездну.\n\n«Угх... извините, но воздух здесь такой тяжелый, что я не могу дышать... я пойду первой!»\n\nБиблиотекарь Шимико, не в силах выдержать атмосферу, вскрикнула и выбежала из места. Контроль над библиотекой был передан на удивление мирно… и мрачно."
  ARI_conservative_event_chain.4.a: "...От этого документа веет мрачностью только при чтении."

  ARI_conservative_event_chain.5.t: "Превыше всех имен"
  ARI_conservative_event_chain.5.d: "Флаг Ариуса, поднятый на вершине древнего собора Тринити, больше не трепетал так, словно ветер готов был его разорвать. Он просто висел, тяжелый и молчаливый, как будто принадлежал этому месту всегда, господствуя над небом Центральной Европы.\n\nДжёмаэ Саори стояла на террасе, которую когда-то использовал Хост Чайной партии, и созерцала империю, раскинувшуюся у ее ног: кампус Тринити, некогда ненавистный, и дальше красную территорию Геенны, коленопреклоненную. Все, что можно было охватить взглядом, теперь контролировалось под именем Ариуса.\n\n«...Какая нелепость.»\n\nИмашино Мисаки, сидевшая на перилах, пробормотала пустыми глазами.\n\n«Мы подняли столько шума, потому что ненавидели, что Адзуса взяла за руку этих из Тринити. А теперь посмотри: половина бюрократов, работающих под нами, — бывшие из Тринити, а рабочие на фабриках — из Геенны. Месть? Кому ты сейчас будешь мстить? На улице все кланяются нам.»\n\nМисаки была права. Победа не была осуществлением сладкой мести: это было исчезновение цели этой мести. В тот момент, когда они раздавили всех врагов, Ариус, по иронии судьбы, стал тем самым «великим правителем», которого так презирал. Когда топливо ненависти сгорело, осталась огромная административная машина, сокрушительная военная сила и груз «правления».\n\n«...Но нам больше не нужно бежать, да? Мы больше не будем есть заплесневелый хлеб… мы больше не будем дрожать во сне, думая, что кто-то придет…»\n\nЦутинага Хиёри, держа обеими руками изящную чашку, сказала это как тот, кто наконец выдыхает. Это было самое примитивное и самое верное доказательство победы.\n\nСаори подняла взгляд к горизонту. Призраки руин, тени города-академии, забытые… все эти оскорбления исчезли в книгах истории. Они больше никогда не будут прятаться во тьме.\n\n«Все суета (Vanitas Vanitatum).»\n\nДоктрина, сорвавшаяся с губ Саори, больше не звучала как самоуничижение или отчаяние; парадоксально, но она, казалось, обретала свой первоначальный смысл."
  ARI_conservative_event_chain.5.a: "\"Но мы на вершине этого суетного мира. Этого достаточно.\""
  ARI_conservative_ending_tt: "§gИстория Эскадрильи, которая закончила тем, что повела Среднюю школу Ариуса, завершается здесь. Возможно, полная интеграция еще далека, и Джёмаэ Саори, ставящая стабильность превыше всего, не сможет принять больше изменений. Однако студентки Ариуса, скитавшиеся по руинам, уже нашли свое законное место в мире и утвердились как гордые правители Центральной Европы. Никто не знает, что чувствовала Саори в конце пути, но для Ариуса она останется в памяти как героиня.§!\n\n§LКонсервативный контент, созданный для Средней школы Ариуса, завершен. Спасибо за игру!§! §H- SKSKIe§!"

