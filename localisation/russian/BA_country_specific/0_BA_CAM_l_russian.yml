# Вступление Камбоджи
CAM_country_intro_header: "Под властью Франции"
CAM_country_intro_content: "\nКхмерское солнце больше не сияет былой славой. В сердце Французского Индокитая наше Королевство Камбоджа дышит как протекторат под чисто формальной монархией.\n\nХотя позолоченные крыши королевского дворца все еще сверкают, под ними королевская власть и администрация остаются в тени колониального правительства в Сайгоне. Родина низведена до положения обширных плантаций, поставляющих рис и каучук, а наши ресурсы используются для укрепления французской гегемонии в далеких землях. После внезапного Великого Перехода, произошедшего в Европе в 1935 году, мир наполнился неопределенностью. Пострадавшие нации снова оказываются в преддверии войны, и в Азии Японская империя emerges as a new power, revealing its colonial ambitions. In this era of upheaval, we find ourselves at a decisive crossroads.\n\nДолжны ли мы оставаться верным протекторатом Франции и гарантировать мир под зонтиком гиганта перед лицом потенциальных угроз? Или, как другие азиатские страны, мы должны разжечь пламя национализма, разорвать цепи Франции и восстановить славу великой Кхмерской империи? Руины Ангкора нашептывают о величии прошлого, и в молчаливой груди народа горит стремление к независимости. Наше будущее: лояльность или освобождение? Время выбора приближается.\n\n§YРазработка - UnineVesiKass, SKSKIe§!"

