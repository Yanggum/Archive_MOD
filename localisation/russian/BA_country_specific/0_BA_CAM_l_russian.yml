CAM_event.10.d: "Франция направила официального верховного комиссара для замены временно исполняющего обязанности Х. Л. М. Ришомма. Его имя — Леон Тибо.\n\nНедавно вернувшись из отпуска, он узнал о своем назначении Верховным комиссаром в Камбодже и после года подготовки теперь въезжает в нашу страну."
