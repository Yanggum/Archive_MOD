  # --- События операций (KPD) ---
  TRN_collapse_event.11.t: "Успех операции Тринити"
  TRN_collapse_event.12.t: "Операция нейтрализована"
  TRN_collapse_event.13.t: "Успех немецких партизан"

  TRN_collapse_event.11.desc1: "Мы полностью сорвали вражескую операцию и одержали победу.\n\nПолное уничтожение мятежников близко!"
  TRN_collapse_event.12.desc1: "План был идеален, но, похоже, мятежники думали так же, как мы. Операция провалилась."
  TRN_collapse_event.13.desc1: "Пока мы смотрели в другую сторону, мятежники разгромили одну из наших баз и отступили.\n\nПобеда отдаляется еще на шаг."

  TRN_collapse_event.11.desc2: "Враг выполнил план, который предвосхитил все наши действия.\n\nМы потерпели поражение, но оно не повторится."
  TRN_collapse_event.12.desc2: "План был идеален, но тираны из Тринити пришли к тому же выводу. Операция провалилась."
  TRN_collapse_event.13.desc2: "Пока патрули Тринити искали в не том месте, мы успешно завершили операцию.\n\nОсвобождение все ближе!"

  TRN_collapse_event.11.a: "Отлично!"
  TRN_collapse_event.12.a: "Вот так..."
  TRN_collapse_event.13.a: "Нет!"

  TRN_collapse_event.11.b: "Нет!"
  TRN_collapse_event.13.b: "Великолепно!"

  # --- События операций (NSD) ---
  TRN_collapse_event.21.t: "Успех операции Тринити"
  TRN_collapse_event.22.t: "Операция нейтрализована"
  TRN_collapse_event.23.t: "Успех немецких СС"

  TRN_collapse_event.21.desc1: "Мы полностью сорвали операцию СС и одержали победу.\n\nПолное подавление мятежников близко!"
  TRN_collapse_event.22.desc1: "План был идеален, но мятежники думали так же, как мы. Операция провалилась."
  TRN_collapse_event.23.desc1: "Пока мы смотрели в другую сторону, мятежники разгромили одну из наших баз и отступили.\n\nПобеда отдаляется еще на шаг."

  TRN_collapse_event.21.desc2: "Враг предвосхитил каждый пункт нашего плана.\n\nПридется разобраться."
  TRN_collapse_event.22.desc2: "План был идеален, но захватчики думали так же, как мы. Операция провалилась."
  TRN_collapse_event.23.desc2: "Пока основные силы Тринити были отвлечены, мы идеально выполнили задачу.\n\nНемецкая слава снова близка!"

  TRN_collapse_event.21.a: "Отлично!"
  TRN_collapse_event.22.a: "Вот так..."
  TRN_collapse_event.23.a: "Нет!"

  TRN_collapse_event.21.b: "Нет!"
  TRN_collapse_event.23.b: "Великолепно!"

  # --- Запрос снаряжения (KPD) ---
  TRN_collapse_event.9.t: "Запрос вооружения от [KPD.GetName]"
  TRN_collapse_event.9.desc: "[KPD.GetName] просит у нас вооружение для своей партизанской войны против Тринити. Их армии не хватает даже базового снаряжения, чтобы вооружить своих людей. Если мы согласимся, наши отношения с [TRM.GetName] серьезно ухудшатся."
  TRN_collapse_event.9.a: "Конечно, мы поможем им."
  TRN_collapse_event.9.b: "Мы поможем им... втайне."

  TRN_collapse_event.91.t: "Помощь СССР вооружением"
  TRN_collapse_event.91.desc: "[SOV.GetName] отправил нам запрошенное снаряжение для борьбы против [TRM.GetName]. Победа теперь кажется обеспеченной!"
  TRN_collapse_event.91.a: "Отлично."

  TRN_collapse_event.92.t: "Секретное советское транспортное соглашение"
  TRN_collapse_event.92.desc: "[SOV.GetName] подписал соглашение о тайной помощи для поддержки нас против [TRM.GetName]."
  TRN_collapse_event.92.a: "Предотвратит ли это прямое столкновение с [TRM.GetName]?"