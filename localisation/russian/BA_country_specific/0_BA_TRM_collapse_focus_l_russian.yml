  TRN_country_collapse_decisions: "Угасающие сумерки"
  TRN_country_collapse_fali: "§tТринити рушится!§!"
  TRN_country_collapse_success: "§YКоллапс Тринити§! предотвращен, но §Yпредстоит еще много работы§!."
  TRM_bunggoehajima: "§YПриняты минимальные меры§!"
  TRM_calm_storm: "Затишье перед бурей"
  TRN_country_collapse_decisions_plz_time: "Выиграть время"

  TRM_anti_trinity_game_desc: "В день, когда мир перевернулся, судьба Тринити перестала быть связанной с Кивотосом и была заброшена в неведомые земли. Мы очнулись в midst хаоса, обнаружили, как все вокруг изменилось, и поняли, что неразбериха неизбежна. Однако мы никогда не сдавались: священный идеал Тринити не должен был угаснуть нигде.\n\nВскоре нахлынула волна кризисов. Местные жители этого нового мира также были дезориентированы; они отказывались принимать загадочных существ, намеревающихся заменить их исчезнувшее правительство. Столкновения между нашими студентами и ними были неизбежны. Сформировались отряды сопротивления против господства Тринити, и в нескольких регионах вспыхнули беспорядки.\n\nТогда Информационная служба предупредила нас, что враги готовят свое величайшее испытание прямо у нас под ногами. Если мы его не остановим, Тринити навсегда потеряет свой славный свет.\n\nТолько наша решимость и действия могут предотвратить эту угрозу."

