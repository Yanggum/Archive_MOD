#포커스
 l_russian:
  # --- Фокусы ---

  TCA_invite_foreign_investors: "Привлечение иностранных инвестиций"
  TCA_invite_foreign_investors_desc: "Гражданская война закончилась, политический хаос утихает. Пришло время обратить взор вовне."

  TCA_mission_to_the_us: "Пригласить американского посла"
  #TCA_mission_to_the_us_desc: "У Китая долгое время были тесные связи в США; они — лучший выбор для получения необходимой нам поддержки."

  TCA_closer_ties_with_us: "Сотрудничество [ROOT.GetAdjective] и США"
  #TCA_closer_ties_with_us_desc: "Делегация, отправленная в Германию, открыла большие перспективы для сотрудничества, включая кредит на развитие промышленности."

  TCA_hire_chennault: "Миссия американских офицеров"
  #TCA_hire_chennault_desc: "Клэр Шеннолт, американский теоретик воздушного боя, предлагает работать на нас. Если мы хотим восстановить военно-воздушные силы, мы должны нанять его."

  TCA_mission_to_the_soviet_union: "Установление связей с СССР"
  #TCA_mission_to_the_soviet_union_desc: "Советский Союз рассматривает Японию как противовес и заинтересован в Китае. Мы отправим миссию в Москву, чтобы проверить, совпадают ли наши цели."

  TCA_rapprochement_with_soviet_union: "Сближение с СССР"
  TCA_rapprochement_with_soviet_union_desc: "Нас разделяет идеология, но объединяют интересы. Подпишем пакт о ненападении, который покажет миру наше сотрудничество."

  TCA_invite_soviet_advisers: "Пригласить советских советников"
  TCA_invite_soviet_advisers_desc: "СССР предлагает направить нам военную миссию для помощи в восстановлении наших войск."

  TCA_purchase_tanks: "Бывшие немецкие конструкторы"
  TCA_purchase_tanks_desc: "Бронетехника будет острием современной войны. Мы впитаем немецкий опыт и организуем нашу первую танковую дивизию."

  TCA_chinese_panzers: "Политехнический университет"
  TCA_chinese_panzers_desc: "Американские исследователи ежедневно генерируют инновации в современных центрах. Мы должны последовать их примеру и создать собственный технический университет."

  TCA_tank_plant: "Танковый завод"
  TCA_tank_plant_desc: "С ongoing исследованиями мы можем инвестировать в завод, специализирующийся на производстве танков."

  TCA_hire_soviet_designer: "Наем советских конструкторов"
  TCA_hire_soviet_designer_desc: "СССР годами экспериментировал с бронетехникой и имеет лучших конструкторов. Мы наймем одного, чтобы он создавал для нас боевые машины."

  TCA_joint_tank_development: "Совместная разработка танков"
  TCA_joint_tank_development_desc: "Опыт, полученный с советскими инженерами, позволяет нам основать совместное конструкторское бюро и учиться друг у друга."

  TCA_experimental_mechanised_unit: "Экспериментальное механизированное подразделение"
  #TCA_experimental_mechanised_unit_effect: "Получает дивизию с 2 бат. легких танков и 4 мотопехотными бат.\n"
  TCA_experimental_mechanised_unit_desc: "Европейские теоретики много обсуждали наилучший способ использования танков. Комбинация с моторизованной пехотой кажется оптимальной; создадим такое подразделение."

  TCA_the_soviet_volunteer_group: "Советская группа добровольцев"
  TCA_the_soviet_volunteer_group_desc: "Наши военно-воздушные силы прискорбно слабы по сравнению с соседними державами. СССР рассматривает возможность отправки группы добровольцев."

  TCA_reach_out_to_france: "Примирение со старым порядком"
  TCA_reach_out_to_france_desc: "Бывшие европейские державы, такие как Франция, живут в изгнании. Однако они все еще сильны, и мы можем сотрудничать с ними для сдерживания государств Кивотоса."

  TCA_maintenance_of_the_new_order_system: "Принять новый порядок"
  TCA_maintenance_of_the_new_order_system_desc: "Время старых европейских держав прошло; мы должны двигаться вперед вместе с Кивотосом."

  TCA_construction_battalions: "Строительные батальоны"
  #TCA_construction_battalions_desc: "Если чего-то у нас в избытке, так это рабочей силы. Мы создадим специальные саперные подразделения, оснащенные простыми лопатами, для инженерных работ."

  TCA_small_arms_expertise: "Специализация по стрелковому оружию"
  TCA_small_arms_expertise_desc: "Индивидуальная винтовка остается основным оружием. Вложим ресурсы в ее модернизацию."

  TCA_camco: "Авиастроительный завод"
  TCA_camco_desc: "Чтобы создать собственную авиационную промышленность, мы должны сначала научиться собирать и обслуживать самолеты, которые у нас есть."

  TCA_french_military_mission: "Французская военная миссия"
  TCA_french_military_mission_desc: "Французская армия — одна из самых обученных в Европе; нам есть чему у нее поучиться."

  TCA_investment_into_shipbuilding: "Инвестиции в судостроение"
  TCA_investment_into_shipbuilding_desc: "Большой флот требует огромной промышленной базы. Мы пригласим иностранных инвесторов для строительства новых верфей."

  TCA_order_destroyers: "Производство эсминцев"
  TCA_order_destroyers_desc: "Первым шагом в перевооружении флота станет небольшая эскадра эсминцев."

  TCA_modern_submarines: "Современные подводные лодки"
  TCA_modern_submarines_desc: "Подводная война против торговли, разработанная старой Германией, должна возродиться."

  TCA_light_cruiser_project: "Проект легкого крейсера"
  TCA_light_cruiser_project_desc: "Создание подлинного океанского флота начинается с модернизации крейсерского флота. Начнем со скромного."

  TCA_heavy_cruiser_project: "Проект тяжелого крейсера"
  TCA_heavy_cruiser_project_desc: "Первоначальный успех позволяет нам увеличить размер и мощь наших крейсеров для защиты флота."

  TCA_coastal_patrol_planes: "Патрульные бомбардировщики побережья"
  TCA_coastal_patrol_planes_desc: "Наше протяженное побережье можно эффективно патрулировать только с воздуха. Современные торпедоносцы будут защищать линию без лишних затрат."

  TCA_naval_aviation: "Морская авиация"
  TCA_naval_aviation_desc: "Будущее морской войны принадлежит авианосцам. Без них мы никогда не станем настоящей морской державой."

  TCA_new_world_technology_new: "Технологические контрмеры"
  TCA_new_world_technology_new_desc: "Ореолы хорошо сопротивляются физическим воздействиям, но уязвимы для химического и биологического оружия. Мы разработаем защиту и повысим их обороноспособность."

  TCA_new_world_technology_halo: "Особое применение ореола"
  TCA_new_world_technology_halo_desc: "Исследования открывают многочисленные применения ореола, что расширит шаблоны использующих его подразделений."

  TCA_new_world_technology_halo_heavy: "Многоцелевое исследование ореола"
  TCA_new_world_technology_halo_heavy_desc: "Ореол обладает огромным потенциалом. Мы исследуем магию, чтобы максимизировать его возможности."

  TCA_train_marines: "Обучение морской пехоты"
  TCA_train_marines_desc: "Наше побережье уязвимо для десантов, но также позволяет нам атаковать с неожиданных направлений. Сформируем морскую пехоту."

  TCA_elite_mountaineers: "Элитные горные стрелки"
  TCA_elite_mountaineers_desc: "Война в горах отличается. Используем нашу местность со специализированными силами."

  TCA_combined_arms_warfare: "Общевойсковая война"
  TCA_combined_arms_warfare_desc: "Грузовики послужили для экспериментов с механизированной войной, но им не хватает брони, и они плохо пересекают поле боя. Мы должны двигаться дальше."

  TCA_pursuit_of_harmony: "Гармония между двумя мирами"
  TCA_pursuit_of_harmony_desc: "Мы должны адаптироваться после Перемещения. Первым шагом будет интеграция студентов из Тринити."

  TCA_fighter_purchases: "Закупка истребителей"
  TCA_fighter_purchases_desc: "Для противодействия внешним угрозам нам нужны современные истребители. Поскольку наша промышленность еще не может их производить, мы приобретем их за рубежом."

  # --- Идеи / черты ---

  TCA_american_officer_corps: "Корпус американских офицеров"

#이벤트
  TCA_shared.1.t: "Советская группа добровольцев"
  TCA_shared.1.desc_a: "Борьба в старой Германии продолжается, и нам нужно оказать помощь, хотя бы воздушную поддержку, нашим товарищам из армии [From.GetAdjective]. [From.GetLeader] запросил у нас пилотов и самолеты: 50 бомбардировщиков и 100 истребителей прикрытия.\n\nДля наших летчиков это будет ценный опыт, и мы сможем испытать в бою наши новые модели."
  TCA_shared.1.desc_b: "Пока война продолжается в старой Германии, военно-воздушные силы [From.GetAdjective] прилагают усилия для защиты неба [From.GetNameDef] и поддержки войск. По личной просьбе [From.GetLeader], [SOV.GetLeader] передал смешанную группу из 50 средних бомбардировщиков и 100 истребителей.\n\nЭто отличная возможность испытать наше самое современное оборудование в реальных условиях."
  TCA_shared.1.a: "Мы должны помогать им всем возможным."
  TCA_shared.1.b: "Им придется обходиться тем, что у них уже есть."

  # --- Решения ---

  TCA_soviet_volunteer_group: "$CHI_soviet_volunteer_group$"

