l_russian:
  # Подсказки
  IRE_republican_reunion_tt: "Если разразится гражданская война, мы получим §Y3 дивизии§! легкой пехоты.\n§RЭтот путь превратит Ирландию в коммунистическую во время 2-й Ирландской гражданской войны.§!"
  IRE_last_gamble_tt: "Если разразится гражданская война, мы получим §Y1 дивизию§! легкой пехоты."

  # Фокусы
  IRE_change_the_world: "Провозгласить независимость Ирландии"
  IRE_change_the_world_desc: "Поскольку Соединенное Королевство погружено в хаос, настало время объявить о нашей подлинной независимости, опубликовать декларацию и разработать новую конституцию."
  IRE_attack_N_ire: "Наступать на Северную Ирландию"
  IRE_attack_N_ire_desc: "После гражданской войны ИРА была разбита, но британский хаос дает ей шанс. Мы воспользуемся выводом гарнизонов, чтобы силой занять север и доказать, что ИРА возродилась."
  IRE_fascism_focus: "Собрать Национальную корпоративную партию"
  IRE_fascism_focus_desc: "В смутные времена нужна твердая рука. Национальная корпоративная партия воплощает ирландский национализм и республиканскую решимость."
  IRE_new_government: "К новому правительству"
  IRE_new_government_desc: "Свергнем Свободное государство, плод предательства, и создадим подлинную Ирландскую Республику. На его руинах поднимется ИРА и подготовится к войне."
  IRE_republican_reunion: "Собрать Республиканский конгресс"
  IRE_republican_reunion_desc: "Отделившийся от ИРА из-за разногласий, Республиканский конгресс переживает финансовые трудности и внутренние разделения, но разделяет цель независимости. Сотрудничество ускорит наше дело."
  IRE_IRA_leftist_movement: "Левый поворот ИРА"
  IRE_IRA_leftist_movement_desc: "С возвращением Конгресса в ИРА она может осуществить свою давнюю цель — склонить организацию влево."
  IRE_IRA: "Вторая ирландская гражданская война"
  IRE_IRA_desc: "Все готово: мы объявим войну Свободному государству и свергнем его. Не должно быть третьей войны; подготовка должна быть безупречной. К оружию, патриоты!"
  IRE_expulsion_of_colonial_culture: "Искоренить колониальную культуру"
  IRE_expulsion_of_colonial_culture_desc: "Искореним британское наследие и возродим свое: вот где заключается истинная независимость."
  IRE_vanguard: "Красная гвардия"
  IRE_vanguard_desc: "После гражданской войны борьба за власть угрожает Конгрессу. Нам нужен орган, который подавит и искоренит контрреволюционеров."
  IRE_last_gamble: "Великое соглашение"
  IRE_last_gamble_desc: "Освобождение Ирландии снова объединило старых боевых республиканцев."
  IRE_republic_of_people: "Республика Ирландия"
  IRE_republic_of_people_desc: "Мы объявим о нашей победе и о том, что Ирландия наконец принадлежит ирландцам."
  IRE_left_wing_expulsion: "Очистить левых"
  IRE_left_wing_expulsion_desc: "С завершением войны мы устраним экстремистские фракции внутри ИРА, чтобы сохранить ее идентичность."
