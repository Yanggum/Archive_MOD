l_russian::

  CHI_hunjeong: "Продолжить политическую опеку"
  CHI_hunjeong_desc: "До провозглашения Трех народных принципов наша страна была не готова. Защищать их будет не поздно и после того, как мы отразим иностранные угрозы."
  KMT_chogong_jakzun: "Кампания по окружению"
  KMT_preparation: "Стратегия коммуникаций"
  KMT_preparation_desc: "После Великого похода коммунисты вновь объявились в Шэньси. Мы бы хотели раздавить их сейчас, но доступ туда затруднен. Нам нужны пути снабжения, чтобы пробиться."
  KMT_SHX_offer: "Предложение Шаньси"
  KMT_SHX_offer_desc: "Янь Сишань не позволяет нашим войскам входить на его территорию. Если мы подчиним его, мы сможем окружить коммунистов и уничтожить их."
  KMT_prep_tt: "Добавляет 1 уровень §Yинфраструктуры§! во все штаты, граничащие с [PRC.GetName]."
  KMT_strike_PRC: "Уничтожить КПК"
  KMT_strike_PRC_desc: "Коммунистическая партия все еще не оправилась от Великого похода. Давайте ударим, пока они не залечили раны, и покончим с этой угрозой."
  KMT_national_def_propaganda: "Пропаганда национальной обороны"
  KMT_national_def_propaganda_desc: "Чтобы защититься от Японии, мы должны объединить китайский народ. Как бы мы ни ненавидели коммунистов и милитаристов, все, от мала до велика, должны быть готовы умереть за родину."
  KMT_propaganda: "Пропаганда национальной обороны"
  KMT_propaganda_desc: "Поскольку Япония угрожает самому нашему существованию, вся китайская нация должна объединиться против захватчика."
  KMT_fortify_land: "Возводить оборонительные рубежи"
  KMT_fortify_land_desc: "Амбиции Японии ставят под сомнение выживание республики. Давайте укрепим родную землю, чтобы они не посмели ступить на нее."
  KMT_lure_them_in_strategy: "Стратегия заманивания противника"
  KMT_lure_them_in_strategy_desc: "Наши огромные просторы позволяют нам отступать и заманивать захватчика на выбранную нами местность. Пусть следуют за нами, если посмеют! На каждом углу их будет ждать засада."
  KMT_cbis_idea: "Центральное статистическое управление"
  KMT_cbis: "Основать Центральное статистическое управление"
  KMT_cbis_desc: "ЦСУ — это разведывательная служба Гоминьдана. После недавней реформы мы должны расширить ее, чтобы защитить режим от любых подрывных элементов."
  KMT_strengthen_the_kmt: "Интегрировать центральные органы партии в ЦСУ"
  KMT_strengthen_the_kmt_desc: ""
  KMT_cement_control_on_the_economy: "Мобилизационная экономика"
  KMT_cement_control_on_the_economy_desc: "Мы выступаем против коммунистов, но мы не встанем на колени и перед капиталистами. Экономическая элита должна служить правительству и Гоминьдану; мы дадим толчок развитию государственных предприятий."
  KMT_cement_control_on_the_economy_idea: "Мобилизационная экономика"
