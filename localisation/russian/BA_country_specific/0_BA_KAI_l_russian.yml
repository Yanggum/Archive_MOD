   kai_political_fascism_desc: "£GFX_BA_kai_political_fascism_texticon §YПрезидент§! — бывший лидер Kaiser Corporation, стремящийся к сильной, централизованной власти.\n£GFX_BA_kai_political_fascism_texticon §YПрезидент§! — способный лидер, умеющий эффективно подавлять своих оппонентов."
   kai_political_communism_desc: "£GFX_BA_kai_political_communism_texticon §YПрофсоюзы§! состоят из рабочих Kaiser Corporation, стремящихся к перераспределению капитала.\n£GFX_BA_kai_political_communism_texticon §YПрофсоюзы§! представляют большинство рабочей силы и могут организовывать коллективные действия."
   kai_political_democracy_desc: "£GFX_BA_kai_political_democracy_texticon §YСовет директоров§! — это новая фракция, возникшая после инвестиций Великобритании в Kaiser Corporation после Великого Катаклизма.\n£GFX_BA_kai_political_democracy_texticon §YСовет директоров§! умело управляет местным капиталом и знает, как использовать свои ресурсы."

   kai_political_loyalty_TOOLTIP: "§YЛояльность§! представляет степень сотрудничества фракции с действиями корпорации.\nЧем выше §Yлояльность§!, тем больше положительных эффектов фракция дает корпорации. И наоборот, низкая лояльность принесет отрицательные эффекты.\nЕсли §Yлояльность§! низка, эти фракции не будут сотрудничать и могут организовать деятельность сопротивления."
   kai_political_influence_TOOLTIP: "§YВлияние§! представляет, сколько власти у фракции внутри корпорации.\nПо мере увеличения §Yвлияния§!, воздействие фракции на корпорацию также растет.\nПрежде чем распустить фракцию, необходимо будет снизить ее §Yвлияние§! до 0 с помощью специальных решений."

