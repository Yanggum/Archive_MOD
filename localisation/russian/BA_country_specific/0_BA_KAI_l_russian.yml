  KAI_political_event.1.t: "Доминирование профсоюза в компании"
  KAI_political_event.1.d: "Профсоюз [ROOT.GetName] получил большое влияние в борьбе за корпоративную власть, взяв эффективный контроль. Предполагается, что они внедряют различные процедуры для установления внутренней демократии."
  KAI_political_event.1.a: "Внутренняя демократия, интересно."

  KAI_political_event.2.t: "Доминирование президента в компании"
  KAI_political_event.2.d: "Недавно Президент обеспечил сильное политическое влияние и эффективный контроль над [ROOT.GetName]. Все с нетерпением ждут его следующих шагов."
  KAI_political_event.2.a: "Да, это моя компания."

  KAI_political_event.3.t: "Доминирование совета директоров"
  KAI_political_event.3.d: "Совет директоров обошел политический блок и обеспечил наибольшее влияние внутри [ROOT.GetName], продвигая процедуры для максимизации корпоративной прибыли."
  KAI_political_event.3.a: "Контратака британских капиталистов."

  KAI_event.1.t: "Мятеж совета директоров"
  KAI_event.1.d: "Совет директоров восстал против Президента."
  KAI_event.1.a: "Это крайняя мера."

  KAI_event.2.t: "Судьба Президента"
  KAI_event.2.d: "Президент спокойно ожидает своего конца на собрании акционеров. Как представитель профсоюза, вы можете вынести ему окончательный приговор."
  KAI_event.2.a: "Изгнать его."
  KAI_event.2.b: "Поручить ему административные задачи."

  KAI_event.3.t: "Предложение кредита Kaiser"
  KAI_event.3.d: "Поступило предложение получить кредиты от Kaiser Loan."
  KAI_event.3.a: "Хорошая идея."
  KAI_event.3.b: "Это сделка с дьяволом."

  KAI_event.4.t: "Крайний срок погашения"
  KAI_event.4.d: "Приближается крайний срок погашения кредита Kaiser."
  KAI_event.4.a: "Погасить сейчас."
  KAI_event.4.b: "Еще не время."

  KAI_event.5.t: "Маржин-колл"
  KAI_event.5.d: "Недавнее падение кредитного рейтинга [ROOT.GetNameDef] привело к требованию о внесении дополнительного обеспечения со стороны Kaiser Loan, что делает невозможным дальнейшее откладывание платежа."
  KAI_event.5.a: "Понял."
  KAI_event.5.b: "Я не дам им ни цента."

  KAI_event.6.t: "Отказ от кредитного предложения [FROM.GetName]"
  KAI_event.6.d: "X"
  KAI_event.6.a: "Понял."

  KAI_event.7.t: "Принятие кредитного предложения [FROM.GetName]"
  KAI_event.7.d: "X"
  KAI_event.7.a: "Понял."

  KAI_event.8.t: "Отказ вернуть кредит [FROM.GetName]"
  KAI_event.8.d: "X"
  KAI_event.8.a: "Тогда будет война."

  # 파시즘 루트
  KAI_event.100.t: "Запрос о сотрудничестве"
  KAI_event.100.d: ""
  KAI_event.100.a: "Будем сотрудничать"
  KAI_event.100.b: "Я не доверяю этим капиталистам, серьезно."

  KAI_event.103.t: "Проблема африканского плацдарма"
  KAI_event.103.d: "Африканские колонии имеют большой потенциал, но наш флот не может до них добраться. Поэтому мы должны обеспечить промежуточный пункт, плацдарм для вторжения в Африку."
  KAI_event.103.a: "Мы подготовим план."

  KAI_event.104.t: "Важная встреча"
  KAI_event.104.d: "Для контроля над Африкой мы определили, что остров «Кабо-Верде», в настоящее время находящийся под эффективным контролем Португалии, является наиболее подходящим местом для создания плацдарма."
  KAI_event.104.a: "Оккупировать его!"
  KAI_event.104.b: "Мы можем купить его за деньги."

  KAI_event.105.t: "Протест Португалии"
  KAI_event.105.d: "Португалия, чья колония была отнята, прислала нам ноту протеста."
  KAI_event.105.a: "Они даже не препятствие."
  KAI_Portugal: "Они украли нашу колонию!"

  # 스토리
   KAI_storyevent.1.t: "Дурной сон"
   KAI_storyevent.1.desc: "Генерал Джеки Смит спокойно сидел в палатке, используемой как временный штаб, вспоминая былые времена. Когда разразилась Великая война, он без колебаний взял в руки оружие и сражался за родину, а когда она закончилась, исполнил свой долг как генерал. И что в итоге? Они были отброшены на грань уничтожения внезапной атакой странных машин.\n\nХм, минутку, это происходило с ноября 1935 года, и есть ли смысл в том, что «не-люди» «внезапно» появились и напали на нас? Скорее, было бы разумнее описать это как дурной, затяжной кошмар.\n\nДжеки Смит видел этот дурной, тревожный кошмар уже более двух месяцев. Во временном штабе в Ливерпуле он прибавил громкость радио и внимательно прислушался. Слышалась несколько искаженная песня с помехами.\n\n\"Сегодня мы споем песню,\"\n\n\"Дай мне свою руку, свою белую руку,\"\n\n\"Прощай, любовь моя, прощай, любовь моя, до свидания, до свидания.\"\n\n\"Потому что мы уезжаем, потому что мы уезжаем,\"\n\n\"Потому что мы направляемся в Ливерпуль!\"\n\nСлушая песню молча, генерал Джеки Смит почувствовал необъяснимую неловкость. Он даже швырнул ручку, лежавшую на столе. Этот проклятый кошмар не проявлял никакого желания заканчиваться.\n\nНе прошло и нескольких минут, как раздался шум механических шестерен. Это был звук тех машин, которые британцы назвали «вертолетами». Когда отчаянно шумный оркестр достиг своего апогея, звуки машин раздались повсюду. Это были они. Джеки Смит зажег сигару, которую хранил. Все равно после у него не будет шанса ее выкурить.\n\nОн завел граммофон, стоявший рядом. С шипением начала играть «Black Stitchel» Айвора Герни.\n\nМелодия текла спокойно, украшая финал. Центр Ливерпуля пылал в огне. Везде высаживались вертолеты, сметая все на своем пути. Ливерпуль, Британия и даже он сам.\n\nПослышались тяжелые шаги, и механические войска, говорящие на ломаном английском, приказали немедленно сдаваться.\n\nНо в конце концов, это был не более чем абсурдный сон. Сдаваться недостойно джентльмена. Истинный джентльмен до конца хранит верность своей родине. Джеки Смит поднялся с места, зажег сигару и закричал."
   KAI_storyevent.1.a: "«Пошли вы, идиоты-ублюдки!»"
   KAI_tooltip_he_dead: "§gКак только он закончил говорить, солдаты ЧВК открыли огонь. Даже в момент угасания его ничтожной жизни он не поморщился и с достоинством завершил свой дурной сон. Вот и все.§!\n\n@ENG §YДжеки Смит§! пал в бою."

