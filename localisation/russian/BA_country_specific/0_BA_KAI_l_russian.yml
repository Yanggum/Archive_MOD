  #사내 민주주의
 KAI_corp_democratic: "Приоритет профсоюзу"
 KAI_corp_democratic_desc: "Разве не профсоюзы должны решать судьбу компании, в которой они работают?"
 KAI_convention_pressure: "Давление совета директоров"
 KAI_convention_pressure_desc: "Совет оказывает давление на компанию."
 KAI_redistribution_of_sovereignty: "Перераспределение суверенитета"
 KAI_redistribution_of_sovereignty_desc: "Пришло время снова перераспределить корпоративный суверенитет."
 KAI_stockholder_pressure: "Единство профсоюза"
 KAI_stockholder_pressure_desc: "Профсоюз должен объединиться, чтобы взять под контроль компанию."
 KAI_fire_president: "Корпоративная демократия"
 KAI_fire_president_desc: "Мы перераспределим суверенитет компании среди рабочих, завоевав их лояльность и повысив производительность. Так мы постепенно уменьшим влияние британских предпринимателей."
 KAI_open_market: "Экономическая реструктуризация"
 KAI_open_market_desc: "Чтобы построить компанию для рабочих и силами рабочих, мы должны перепроектировать нашу экономику в соответствии с более подходящими принципами."
 KAI_no_more_torture: "Сокращение рабочего дня"
 KAI_no_more_torture_desc: "Длинный рабочий день в [ROOT.GetNameDef] создает слишком много проблем. Сокращая переработки и увеличивая свободное время, мы повысим производительность."
 KAI_president_fate: "Судьба президента"
 KAI_president_fate_desc: "Когда профсоюз полностью контролирует ситуацию, пришло время решить, что мы сделаем с президентом."

