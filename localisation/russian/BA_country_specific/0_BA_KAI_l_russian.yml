l_russian:
  ##인트로
 KAI_country_intro_header: "Очевидная логика денег"
 KAI_country_intro_content: "Ах, деньги, больше денег! Нельзя отрицать, что этот загадочный объект обладает столь мощным очарованием, что даже самые логичные и мудрые умы неизбежно попадают в его ловушку. Все работают ради денег. Служат ради денег. Подчиняются президенту ради денег. Эта «очевидная логика денег» всегда была руководящим принципом с момента возникновения Kaiser Corporation и подъема капитала.\n\nВеликий Катаклизм оставил глубокий след на Kaiser. Дочерние компании, некогда процветавшие по всему Кивотосу, были отозваны Чрезвычайным комитетом Kaiser, а репутация компании упала ниже некуда. Продукты Kaiser больше не являются предметами роскоши: теперь это дорогой мусор, признанный за качество, но игнорируемый из-за цены.\n\nТаким образом, Kaiser должен искать новый путь. Продавать продукты или спекулировать акциями уже недостаточно. Конфликт с Британской империей предстает как идеальная сцена для ковки новой судьбы Kaiser.\n\nВскоре после падения Лондона многие британские компании подписали клятвы верности Kaiser Corporation. Как на Земле, так и среди человечества эта «очевидная логика денег» была принята как абсолютная истина. Это принесло большое облегчение президенту и корпорации. Теперь мы должны бороться за новый рассвет. Доминировать над Британскими островами и сокрушить их декадентскую цивилизацию — лишь вопрос времени.\n\nСтабилизировать корпоративное государство Kaiser, переопределить дипломатию и вернуть былую славу в Кивотосе — это больше не просто цели, а неизбежная судьба, яркий рассвет.\n\n§GПроцветай, Kaiser Corporation, процветай, богатство, и процветайте, бесконечные капиталы —\n\nвеликие плоды нашей цивилизации и источник нашего благополучия и счастья!§!\n\n§YРазработано - SKSKIe§!"
 KAI_guide: "Цели\n\n£white_dot. Завершить войну с Великобританией.\n£white_dot. Восстановить славу и величие нашей компании.\n£white_dot. Спокойно принять результаты «очевидной логики денег» и показать миру, что Кивотос под нашим контролем и мы — крупнейшая корпорация на планете.\n\nKaiser Corporation трансформировалась в современное корпоративное государство, что почти не имеет аналогов в истории. Теперь вы должны доказать, что эта новая модель нации является одновременно отправной точкой и кульминацией человеческого прогресса. Независимо от невзгод и того, насколько невообразимым будет враг, с которым нам придется столкнуться,\n\n§Rдокажите любой ценой выживание и процветание корпоративного государства.§!"


  #시작 중점
 KAI_war_logistics: "Военная логистика в Великобритании"
 KAI_war_logistics_desc: "Вопреки ожиданиям президента, война с Великобританией длится уже более двух месяцев, и наши силы ЧВК начинают испытывать проблемы с логистикой. Мы должны организовать специальные поставки, чтобы обеспечить быструю и решительную победу."
 KAI_FOCUS_1: "Охота на Льва"
 KAI_FOCUS_1_desc: "Британцы продолжают бессмысленное сопротивление на островах. Мы поймали спящего льва в наши сети, осталось лишь нанести последний удар."
 KAI_FOCUS_2: "Соблазнить капиталистов"
 KAI_FOCUS_2_desc: "Логика денег универсальна. Фунты? Марки? Шиллинги? Теперь это не более чем мокрая бумага. Если мы сделаем ставку на иену, будущую мировую валюту, британские капиталисты легко присоединятся к нашему делу."
 KAI_FOCUS_8: "Корпоративная победа"
 KAI_FOCUS_8_desc: "[ROOT.GetNameDef] восторжествовала."

