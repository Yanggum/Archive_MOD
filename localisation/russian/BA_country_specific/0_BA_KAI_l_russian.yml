   KAI_power_of_the_corporate_state: "Внутренняя корпоративная борьба"
   KAI_power_of_the_corporate_state_desc: "§YKaiser Corporation§! сражалась против §YВеликобритании§! после Великого Катаклизма. После войны большинство дочерних компаний §YKaiser Corporation§! потеряли связь, и мы оказались управляющими §Yнацией-государством§!.\n\nВнутри §YKaiser Corporation§! существуют различные фракции. Корпоративное руководство во главе с Президентом, рабочие, организованные в §YПрофсоюзы§!, и британские предприниматели, образующие §YСовет директоров§!. Если нам не удастся сохранить §Gбаланс§! между этими тремя фракциями, Kaiser Corporation §Rрухнет§!."

