l_russian:
  TRM_auto_conference.1.t: "Веймарская конференция"
  TRM_auto_conference.1.d: "По мере того как совместная война Академии Геенны против Тринити набирает полный ход, неизбежно наступает момент, когда Геенна должна рассмотреть, как распорядиться территориями Тринити.\n\nМы могли бы временно отложить детальный раздел Академии Тринити после войны и учредить временный орган делегированного управления для искоренения радикальных сторонников войны внутри Тринити.\n\nНаши 'друзья' дали понять, что заинтересованы в такой конференции. Без сомнения, они захотят какую-то компенсацию за свои жертвы."
  TRM_auto_conference.1.a: "Нам нужна конференция для обсуждения будущего Европы."
  TRM_auto_conference.1.b: "Мы не можем сотрудничать с [auto_conference_1_partner.GetNameDef]."

  TRM_auto_conference.101.t: "Веймарская конференция"
  TRM_auto_conference.101.d: "Война с [TRM.GetNameDef] вступает в неизбежную фазу, и в Веймаре мы собрались, чтобы обсудить будущее Геенны.\n\nОни предложили поместить [TRK.GetNameDef] под мандат, управляемый 'Административным органом Эдема'. С помощью этого мы могли бы получить частичную компенсацию за потери Геенны и в то же время отойти от сложной внутренней политики Геенны, чтобы установить полный контроль над Тринити и изгнать подстрекателей войны."
  TRM_auto_conference.101.a: "Будем помогать друг другу до конца."
  TRM_auto_conference.101.b: "Наш мир решаем мы сами."

  TRM_auto_conference.102.t: "Отказ от участия со стороны [auto_conference_1_partner.GetNameDef]"
  TRM_auto_conference.102.d: "Конференция, которую мы предложили для координации будущего Геенны, закончилась провалом.\n\nГоворя прямо: что касается послевоенных планов для Европы и сотрудничества, [auto_conference_1_partner.GetNameDef] не признал никакой необходимости."
  TRM_auto_conference.102.a: "Это тревожно."

  # Фокусы объединения: Дисциплинарный комитет Геенны и Общество Пандемониум
  GEH_unified_gehenna:0 "Объединенная Геенна"
  GEH_unified_gehenna_desc:0 "Конфликт между Обществом Пандемониум и Дисциплинарным комитетом был настолько известен, что о нем знала вся Геенна. Это был антагонизм, который мог разрешиться только физическим уничтожением одной из двух сторон, и, как это ни трагично, победа [ROOT.GetLeader] также могла быть достигнута только войной. Но после этой трагедии мы смогли получить воссоединенную Геенну: Геенну, которая больше не разделится."

  GEH_hot_spring_cooperation:0 "Сотрудничество с Клубом освоения горячих источников"
  GEH_hot_spring_cooperation_desc:0 "Клуб освоения горячих источников полон идиотов, но, по крайней мере, их исполнительность и скорость строительства непревзойденны. Конечно, будет нелегко заставить их послушно работать на Геенну."

  GEH_emergency_medicine_department_support:0 "Поддержка Департамента неотложной медицины"
  GEH_emergency_medicine_department_support_desc:0 "Медицинские технологии местных жителей значительно уступают технологиям Кивотоса. Простые аппараты ИВЛ считаются непроверенной передовой технологией, а болезни, которые в Кивотосе легко излечимы, здесь по-прежнему регистрируются как смертельные. Поддержка Департамента неотложной медицины повысит местный уровень медицины и увеличит продолжительность жизни местных жителей Геенны."

  GEH_gehenna_academy:0 "Будущее объединенной Геенны"
  GEH_gehenna_academy_desc:0 "Под руководством [ROOT.GetLeader] [ROOT.GetName] будет продолжать развиваться и расти. Под руководством правительства [ROOT.GetLeader], которое поведет будущее объединенной Геенны, мы больше не разделимся и не будем враждовать друг с другом."

  GEH_repudiation_of_the_eden_treaty: "Перезапуск Эдемского договора"
  GEH_centralized_eden_treaty: "Централизованный Эдемский договор"
  GEH_decentralized_eden_treaty: "Децентрализованный Эдемский договор"
  GEH_forced_integration: "Принудительная аннексия"
  GEH_trinity_war_crime_trial: "Суд над военными преступниками Тринити"

  GEH_68_problem:0 "Проблема [HEU.GetName]"

  ## Путь: победа Дисциплинарного комитета
  GEH_the_end_of_pandemonium:0 "Конец господства Пандемониума"
  GEH_the_end_of_pandemonium_desc:0 "Влияния Пандемониума больше не существует, и власть [ROOT.GetLeader] подчинила себе всю Геенну. Теперь мы принесем в Геенну порядок, а не хаос, и выметем все следы распутства, которое Пандемониум посеял на этих землях."

  GEH_trial:0 "Суд"
  GEH_trial_desc:0 "Состоится законный суд по делу о злоупотреблении бюджетом Дисциплинарного комитета со стороны Пандемониума до Великого Перехода. Суд будет проведен справедливо, и Ханума Макото с сообщниками получат наказание на разумном уровне."

  GEH_personnel_retraining:0 "Выборы по обновлению доверия депутатов"
  GEH_personnel_retraining_desc:0 "Пандемониум функционирует как парламентская система с президентом и депутатами. Существует разница в том, что президент избирается прямым голосованием. Процедура обновления доверия депутатов формальна, но это также заявление о том, что их ранг и честь в Пандемониуме будут признаны."

  GEH_forced_dissolution:0 "Легитимная чистка"
  GEH_forced_dissolution_desc:0 "Нужен ли сложный судебный процесс? Мы действуем ради порядка в Геенне, но Пандемониум ни разу не признал порядок Дисциплинарного комитета в Кивотосе. Согласно критериям, определенным [ROOT.GetLeader], ключевые фигуры Пандемониума получат немедленное наказание без суда."

  GEH_movement_downgrade_pandemonium:0 "Упразднить еженедельник Пандемониума"
  GEH_movement_downgrade_pandemonium_desc:0 "Кроме симпатичных фотографий Танги Ибуки, какую ценность, если честно, имела еженедельная газета Пандемониума? Никакой. Тратить на это бюджет — не иначе как безумие."

  GEH_legitimate_dominion:0 "Легитимная власть"
  GEH_legitimate_dominion_desc:0 "Согласно древним законам Геенны, Пандемониум был ('формально') вышестоящей организацией по отношению к Дисциплинарному комитету. Больше нет. Нам не нужна никакая вышестоящая организация, и отвратительные остатки Пандемониума навсегда исчезли в истории."

  ## Путь: победа Пандемониума
  GEH_the_end_of_perfect_team:0 "Конец Дисциплинарного комитета"
  GEH_the_end_of_perfect_team_desc:0 "'Торамару, непобедимый линкор, сметай всё...!' Теперь даже в штаб-квартире Дисциплинарного комитета звучит гордый гимн восхваления Общества Пандемониум. В борьбе за гегемонию Геенны победителем стал Пандемониум, и докучливое чувство существования Дисциплинарного комитета исчезло."

  GEH_take_command:0 "Инкорпорация Исполнительного департамента"
  GEH_take_command_desc:0 "Дисциплинарный комитет делится на Департамент планирования, административную организацию, и Исполнительный департамент, вооруженную организацию. Ах да, был еще печально известный Разведывательный департамент Сорасаки Хины. В любом случае, из всех этих организаций больше всего нам нужен Исполнительный департамент, военное крыло. Вероятно, более половины его членов откажутся присягнуть нам на верность, но соблазн денег может заставить некоторых передумать."

  GEH_top_and_bottom_clothes:0 "Инкорпорация высшего командования"
  GEH_top_and_bottom_clothes_desc:0 "Независимого Дисциплинарного комитета больше не существует. Как бы ни было глубоко недоверие к Пандемониуму, если руководство желает прилагать усилия для общественной безопасности в Геенне, оно должно принять концепцию 'Дисциплинарного комитета Геенны, подчиненного Пандемониуму'. Если нет, они останутся без работы."

  GEH_perfect_team_disbanded:0 "Роспуск Дисциплинарного комитета"
  GEH_perfect_team_disbanded_desc:0 "Трудно ожидать, что даже самый рядовой член Дисциплинарного комитета принесет свою лояльность 'Обществу Пандемониум'. Не лучше ли распустить Дисциплинарный комитет и выгнать их всех?"

  GEH_clearing_the_remnants:0 "Полиция порядка"
  GEH_clearing_the_remnants_desc:0 "Дисциплинарный комитет исчез. Эта новость внушает преступникам по всей Геенне ошибочную мысль, что 'Геенна стала зоной, где преступления законны'. Нет. Пандемониум не настолько глупая организация (вероятно). Полиция порядка, состоящая из местных жителей, возьмет на себя роль, которую раньше выполнял Дисциплинарный комитет."

  GEH_civilian_control:0 "Пандемониум над Дисциплинарным комитетом"
  GEH_civilian_control_desc:0 "Проблема интеграции Дисциплинарного комитета полностью решена. Конечно, нет стопроцентной 'идеальности'. Бывшие члены Дисциплинарного комитета по-прежнему будут ненавидеть нас, и часть персонала, интегрированного в Пандемониум, не сможет избежать дискриминации. Но, по крайней мере, разве это не лучше, чем быть в гражданской войне?"

  # Национальные духи
  GEH_club_processing_idea:0 "Унификационизм Геенны"
  GEH_club_integration_idea:0 "Студенческий совет"

  GEH_gehenna_academy_idea:0 "Академия свободы и хаоса"
  GEH_gehenna_academy_idea_desc:0 "Геенна гарантирует крайне свободный образ жизни для населения Кивотоса. Хотя иногда проблема именно в том, что она слишком свободна."

  GEH_hegemony_idea:0 "Стремление к гегемонии"
  GEH_hegemony_4_idea:0 "Гегемония"

  # Событие
  GEHENNA_event.1.t:0 "Суд справедливости"
  GEHENNA_event.1.desc:0 "Военный трибунал Геенны завершил суд над военными преступлениями бывшего руководства Генеральной академии Тринити и вынес окончательный вердикт.\n\nГлавные члены Чайной партии, включая хозяйку Чайной партии, были единогласно признаны виновными в развязывании несправедливой агрессивной войны против Геенны. Трибунал приговорил их к длительным срокам тюремного заключения, и они будут переведены в Исправительный офис Геенны.\n\nС этим историческим вердиктом эра Тринити подошла к концу, и полная победа Геенны была провозглашена всему миру."
  GEHENNA_event.1.a: ""