 #################################
 GEK_get_halo_infantry_tt: "§YСтуденты Академии Одиссея§! станут доступны."
 GEK_demo_event.1.t: "Свободные выборы"
 GEK_demo_event.1.d: "Выборы состоялись."
 GEK_demo_event.1.a: "Народный фронт получил большинство."
 GEK_demo_event.1.b: "Победила Бело-черная коалиция."

 GEK_event.1.t: "Захват подозрительного судна"
 GEK_event.1.desc: "Судно без четкой идентификации было захвачено нашим флотом недалеко от Готланда. После допроса членов экипажа мы обнаружили, что у них на головах ореолы и они говорят, что принадлежат Академии Одиссея, что указывает на то, что они могут быть частью этого самого Кивотоса."
 GEK_event.1.a: "Завербуйте их."

 GEK_event.2.t: "Переработка"
 GEK_event.2.desc: "Корабли Академии Одиссея не обладают большой боевой мощью, но построены с использованием передовых технологий. Мы можем интегрировать их в наш флот или разобрать, чтобы укрепить наши собственные корабли."
 GEK_event.2.a: "Включите их в состав флота."
 GEK_event.2.b: "Разберите их. Что-нибудь полезное выйдет."

 GEK_event.3.t: "Связь"
 GEK_event.3.desc: "Мы подтверждаем, что на севере Генны все еще существует германский Вермахт. Они пытались вести переговоры с академией, но, похоже, потерпели неудачу и решили действовать. Они связались с нами, чтобы вместе восстановить Германию. Мы добьемся этого, чего бы это ни стоило."
 GEK_event.3.com_desc: "Мы подтверждаем, что Вермахт все еще активен к северу от Генны. Они пытались вести переговоры с академией, но безуспешно. Однако они, кажется, не знают, что мы свергли предыдущее офицерство во время мятежа на борту..."
 GEK_event.3.a: "Вперед."
 GEK_event.3.b: "И что теперь?"

 GEK_event.4.t: "Последний шанс"
 GEK_event.4.desc: "После нашей связи Вермахт установил временный штаб на севере Германии и обезопасил этот район. Это может быть последний шанс для Германии. Пока они стабилизируют свою ситуацию, мы должны реорганизовать наши силы и подготовиться к надвигающейся буре."
 GEK_event.4.com_desc: "Вермахт установил временный штаб и обезопасил районы на севере. Однако, после того как мы объяснили им нашу ситуацию, они, кажется, пересматривают свою позицию по отношению к нам."
 GEK_event.4.bad_desc: "Мы получили срочные новости: Вермахт начал войну против Генны. Наша связь была запоздалой и недостаточной. Мы должны принять немедленные меры."
 GEK_event.4.a: "Наконец-то шанс!"
 GEK_event.4.b: "Это слишком рискованно."
 GEK_event.4.c: "Ни вы, ни мы, ни кто-либо другой не желает союза."

 GEK_event.5.t: "Запрос о поддержке от немецкой армии в изгнании"
 GEK_event.5.desc: "Немецкая армия в изгнании, спасающаяся от европейского коллапса, связалась с нами, чтобы попросить помощи в их будущей операции по отвоеванию. Мы можем согласиться и помочь им или остаться в стороне от этого конфликта."
 GEK_event.5.a: "Европе нужны союзники."
 GEK_event.5.b: "Слишком опасно противостоять им."

 GEK_event.6.t: "Отказ в просьбе о поддержке от [FROM.GetName]"
 GEK_event.6.desc: "[FROM.GetName] счел поддержку нас слишком опасным действием и отклонил нашу просьбу о помощи."
 GEK_event.6.a: "Вы будете следующими!"

 GEK_event.7.t: "[FROM.GetName] принял нашу просьбу"
 GEK_event.7.desc: "[FROM.GetName] положительно ответил на нашу просьбу и решил поддержать нас."
 GEK_event.7.a: "Германия это запомнит!"

 GEK_event.8.t: "Враг просит мира"
 GEK_event.8.gen_desc: "Сегодня мы получили письмо от Манмазин. Его доставил обычный немецкий почтальон, г-н Ганс. Поскольку оно было написано по-японски, наши офицеры не смогли его прочитать, и потребовалась помощь солдата, владеющего языком. Письмо было полно орфографических ошибок, пустых метафор и вычурных выражений. Хотя наше руководство решило отклонить мирный договор из-за этого дипломатического оскорбления, высокопоставленный руководитель Манмазин, Нацумэ Ироха, лично посетила нашу столицу [ROOT.capital.GetName], чтобы извиниться, и предложила передать контролируемый ими север в качестве условия для переговоров."
 GEK_event.8.fam_desc: "Сегодня в [ROOT.capital.GetName] прибыло письмо из Манмазин. Оно было отправлено Нацумэ Ирохой, высокопоставленным руководителем организации. В нем она просила о мирном соглашении и объявляла о выводе войск с линии Мажино. Письмо, искреннее и отчаянное, казалось, отражало ее подлинное желание мира."
 GEK_event.8.desc: "Сегодня в [ROOT.capital.GetName] прибыло письмо из Манмазин. Хотя содержание было беспорядочным и плохо написанным, оно выражало их желание положить конец конфликту."
 GEK_event.8.a: "Война окончена."
 GEK_event.8.b: "Нет. Мы хотим их полного поражения."

 GEK_event.9.t: "[FROM.GetName] принял мир"
 GEK_event.9.desc: "[FROM.GetName] принял наше предложение о мире и вскоре подписал договор."
 GEK_event.9.a: "Дипломатическая победа Манмазин!"

 GEK_event.10.t: "Отказ от просьбы о мире"
 GEK_event.10.desc: "[FROM.GetName] отклонил нашу просьбу, заявив, что мы не проявили надлежащего отношения к ее подаче. Президент Манмазин, Ханума Макото, в ярости.\n\nВскоре Макото и ее руководители издали указ о мобилизации студентов Генны, которые с энтузиазмом присоединились только потому, что «это казалось забавным»."
 GEK_event.10.a: "Пришло время показать мощь Манмазин!"

 GEK_event.11.t: "Восстание ополчения в тылу"
 GEK_event.11.desc: "Командиры Вермахта организовали ополчение из немецких гражданских лиц, которые теперь сражаются против нас. Война с Германией еще больше осложняется."
 GEK_event.11.a: "Это серьезно!"
 GEK_rm_event.11_tt: "\n§RКонец игры!§!"

 GEK_event.12.t: "Оккупация Аландов"
 GEK_event.12.d: "Мы оккупировали Аландский архипелаг, финскую территорию на Балтике."
 GEK_event.12.a: "Мы вернем его... когда-нибудь."

 GEK_event.13.t: "Оккупация Сааремаа"
 GEK_event.13.d: "Мы оккупировали Сааремаа, эстонскую территорию на Балтике."

 GEK_event.14.t: "[GEK.getname] незаконно оккупирует нашу территорию"
 GEK_event.14.d: "Германский Кригсмарине после потери своего правительства превратился в пиратов и незаконно оккупировал нашу балтийскую территорию."
 GEK_event.14.a: "Они сошли с ума!?"

 GEK_event.15.t: "Протесты моряков по поводу условий"
 GEK_event.15.d: "Несмотря на текущий кризис, матросы начали жаловаться на свои условия на палубе."
 GEK_event.15.a: "Пойдем на умеренные уступки."
 GEK_event.15.b: "Пусть потерпят."

 GEK_event.16.t: "Мятеж на борту!"
 GEK_event.16.d: "Если кто и был революционным и прогрессивным в современной Германии, так это моряки. 20 лет спустя гордые немецкие моряки повторили подвиг 1918 года. Высшие офицеры были заключены в тюрьму на всех судах, а Эрих Редер бежал в Англию. Матросы празднуют, иерархия на борту отменена, и на каждом корабле сформирован демократический совет по управлению."
 GEK_event.16.a: "Да здравствует Красный Кригсмарине!"

 GEK_event.17.t: "Прибытие Рейнхарда Гейдриха"
 GEK_event.17.d: "Прошло много времени с тех пор, как Европа была сметена силой Кивотоса. Рейнхард Гейдрих, бывший командир немецких СС, прибыл по воздуху, спасаясь от репрессий в Тринити."
 GEK_event.17.a: "Поприветствуем его."

 GEK_event.18.t: "Десантная операция"
 GEK_event.18.desc: "Обнаружив организованные остатки Вермахта под гнетом Генны, мы решили сотрудничать с ними, чтобы ликвидировать кивотосцев в этом районе и создать совместное государство.\n\nВо время операции некоторые части Вермахта рассеялись, и несколько офицеров протестовали против нашего одностороннего способа действий, но цель была достигнута."
 GEK_event.18.a: "Действуйте быстро!"
 GEK_event_18_tt: "§RNashe внезапное действие привело к потерям в силах Вермахта, прежде чем они смогли реорганизоваться.§!"
 
 GEK_event_post_war_focus_4.1.t: "Секретный пакт в Ленинграде"
 GEK_event_post_war_focus_4.1.d: "На рассвете сегодняшнего дня остатки бывшего германского Кригсмарине, окопавшиеся на Готланде, под секретным эскортом Советского флота провели свои суда в Ленинград, привезя с собой интригующее предложение. В обмен на уступку части южного побережья Балтики и некоторых портов они признают наше влияние на всем Балтийском море. Фактически они согласятся стать государством-сателлитом, выступая в роли пушечного мяса против захватчиков из другого мира, возникших с «Великим Перемещением».\n\nНародный комиссариат иностранных дел оценивает предложение как чрезвычайно привлекательное. Не сделав ни одного выстрела, мы могли бы обеспечить себе гегемонию на Балтике и превратить бывшего врага в ценный буфер. Конечно, есть риски: нет гарантии, что, восстановив силы, они снова не направят на нас оружие.\n\nТеперь мы должны решить, протянуть ли руку нашему старому врагу в поисках будущей выгоды или искоренить потенциальную угрозу в зародыше."
 GEK_event_post_war_focus_4.1.a: "Это отличная идея."
 GEK_event_post_war_focus_4.1.b: "Нет, мы не ведем переговоры с милитаристскими фашистами."
 GEK_event_post_war_focus_4_1_idea_189: "Ленинградский пакт: уступка Самогитии"
 GEK_event_post_war_focus_4_1_idea_190: "Ленинградский пакт: уступка Курляндии"
 GEK_event_post_war_focus_4_1_idea_811: "Ленинградский пакт: уступка Сааремаа"

 GEK_event_post_war_focus_4.101.t: "Ответ Кремля"
 GEK_event_post_war_focus_4.101.d: "Пришли хорошие новости от секретной делегации, отправленной в Ленинград. После нескольких дней напряженного молчания советское руководство приняло наше предложение. В соответствии с договором обещанные прибрежные территории будут переданы под наш контроль, и обе стороны установят отношения сотрудничества перед лицом «общей угрозы».\n\nЭто не просто территориальное приобретение, а великая дипломатическая победа, дающая нашей, ранее изолированной, нации жизненно важную опору для выживания и восстановления на континенте."
 GEK_event_post_war_focus_4.101.a: "За будущее родины."

 GEK_event_post_war_focus_4.102.t: "Беспощадный отказ"
 GEK_event_post_war_focus_4.102.d: "Секретная делегация, отправленная в Ленинград, вернулась с пустыми руками. Советский Союз отклонил наше предложение, назвав его «милитаристским фашистским обманом», и отказался даже вести переговоры. Они ясно дали понять, что не намерены сотрудничать с бывшими врагами.\n\nНаша дипломатическая ставка провалилась. План по обеспечению континентального плацдарма рухнул, и теперь мы должны искать другие средства выживания на этом изолированном острове."
 GEK_event_post_war_focus_4.102.a: "Мы будем сражаться сами."

 GEK_event_post_war_focus_4.2.t: "Аландские острова захвачены!"
 GEK_event_post_war_focus_4.2.d: "Правительственный комплекс в Хельсинки погружен в ледяное молчание. Односторонняя оккупация Аландских островов германским Кригсмарине — это не просто нарушение границы, а прямой вызов достоинству и будущему Финляндии. Между военными ястребами и осторожными дипломатами идет ожесточенная дискуссия, в то время как приближается момент решения судьбы нации.\n\nВерховное командование требует немедленного военного ответа. «Страна, которая хранит молчание перед нарушением своего суверенитета, перестает быть страной». Они утверждают, что Кригсмарине — не более чем изолированный остаток, и что с решимостью и быстрым контрнаступлением он может быть побежден. Учитывая стратегическую важность Аландов, терпеть их оккупацию равносильно тому, чтобы приставить нож к горлу столицы.\n\nС другой стороны, Министерство иностранных дел и экономические технократы призывают к осторожности. Война повлечет за собой огромные человеческие и экономические потери, а успех десантной операции против мощного флота неясен. Возможно, еще есть пространство для дипломатического решения, и поспешная война может изолировать Финляндию и привести к еще большей катастрофе.\n\nОтветить на дерзость захватчика силой или ждать лучшего момента, ища дипломатический выход? Будущее Финляндии зависит от нашего выбора."
 GEK_event_post_war_focus_4.2.a: "Это объявление войны!"
 GEK_event_post_war_focus_4.2.b: "Осудить дипломатически... но не войной."

 GEK_event_post_war_focus_4.6.t: "[From.GetLeader] добивается интеграции Остланда"
 GEK_event_post_war_focus_4.6.d: "С полным контролем [Root.GetFactionName] над Западной Белоруссией, администрация [From.GetNonIdeologyName] объявила о своем намерении включить оккупированные территории Остланда в администрацию [From.GetAdjective]. За этим объявлением скрывается цель объединить Балтику и Белоруссию под названием Балтийского рыцарского государства, способствуя интеграции немецко-балтийского народа."
 GEK_event_post_war_focus_4.6.a: "Гениально!"
 GEK_event_post_war_focus_4.6.b: "Нет."

 GEK_event_post_war_focus_4.601.t: "Уступка Остланда [From.GetNameDefCap]"
 GEK_event_post_war_focus_4.601.d: "Нам удалось освободить регион Остланд руками [Root.GetAdjective], и [From.GetNameDef] согласился на переход балтийских государств и Западной Белоруссии в исключительную территорию [Root.GetNameDef]."
 GEK_event_post_war_focus_4.601.a: "Отлично!"

 GEK_event_post_war_focus_4.602.t: "Отказ [From.GetNameDefCap]"
 GEK_event_post_war_focus_4.602.d: "Запрос [Root.GetAdjective] о передаче контроля над Остландом был категорически отклонен [From.GetNameDef]. Они считают эту попытку не чем иным, как маневром [Root.GetLeader] для контроля над основными центрами балтийского населения и ослабления [From.GetNameDef] в пользу постоянной балтийской интеграции."
 GEK_event_post_war_focus_4.602.a: "Печальный день для Кригсмарине."

 GEK_news.1.t: "Декларация в Висбю"
 GEK_news.1.d: "«Мы больше не прикованы к призракам прошлого. Новый порядок в Восточной Европе заслуживает уважения, и мы не стремимся к конфронтации с Советским Союзом, сухопутным хранителем этого порядка».\n\nГерманский Кригсмарине в изгнании, изолированный на острове Готланд, сделал первый шаг к новой эре, оставив позади старую вражду. Заявление, выпущенное от имени [GEK.GetLeader], признает Советский Союз ключевой силой в поддержании стабильности в Восточной Европе и выражает желание избегать ненужных военных конфликтов.\n\nЭто объявление интерпретируется как фактическое заявление о ненападении и открывает возможность для будущего военного и экономического сотрудничества, включая взаимодействие флотов на Балтийском море."
 GEK_news.1.a: "Идите за советскими припасами!"
 GEK_news.1.b: "Хороший предлог."
 GEK_news.1.c: "Озадачивающее событие."

 GEK_news.2.t: "Советская уступка региона [189.GetName]"
 GEK_news.2.d: "С окончательным одобрением Кремля секретный договор с германским Кригсмарине был выполнен. С сегодняшнего дня административная власть над регионом [189.GetName] официально передана Кригсмарине.\n\nСилы Красной Армии начали организованный вывод войск, в то время как передовые отряды Кригсмарине берут под контроль основные порты и промышленные объекты. Обе стороны утверждают, что этот договор заложит основу для стабильности на Балтике и совместного ответа на «внешние угрозы».\n\nЭта территориальная уступка — не просто изменение границ, а событие, предвещающее глубокую трансформацию баланса сил на Балтийском море."
 GEK_news.2.a: "Хорошо."
 GEK_news.2.b: "Исполнение договора."
 GEK_news.2.c: "Балтика становится полностью красной."

 GEK_news.3.t: "Советская уступка региона [190.GetName]"
 GEK_news.3.d: "С окончательным одобрением Кремля секретный договор с германским Кригсмарине был выполнен. С сегодняшнего дня административная власть над регионом [190.GetName] официально передана Кригсмарине.\n\nСилы Красной Армии начали организованный вывод войск, в то время как передовые отряды Кригсмарине берут под контроль основные порты и промышленные объекты. Обе стороны утверждают, что этот договор заложит основу для стабильности на Балтике и совместного ответа на «внешние угрозы».\n\nЭта территориальная уступка — не просто изменение границ, а событие, предвещающее глубокую трансформацию баланса сил на Балтийском море."

 GEK_news.4.t: "Советская уступка региона [811.GetName]"
 GEK_news.4.d: "С окончательным одобрением Кремля секретный договор с германским Кригсмарине был выполнен. С сегодняшнего дня административная власть над регионом [811.GetName] официально передана Кригсмарине.\n\nСилы Красной Армии начали организованный вывод войск, в то время как передовые отряды Кригсмарине берут под контроль основные порты и промышленные объекты. Обе стороны утверждают, что этот договор заложит основу для стабильности на Балтике и совместного ответа на «внешние угрозы».\n\nЭта территориальная уступка — не просто изменение границ, а событие, предвещающее глубокую трансформацию баланса сил на Балтийском море."

 GEK_news.5.t: "Кригсмарине оккупирует Аландские острова!"
 GEK_news.5.d: "Германский Кригсмарине в изгнании, дислоцированный на Готланде, сегодня на рассвете начал внезапную десантную операцию на Аландских островах, взяв под контроль основные объекты. Морское командование заявило, что операция основана на «исторической легитимности», утверждая, что Аланды исторически были шведской территорией и что большинство их населения составляют шведы.\n\nЭтот односторонний акт силы является вопиющим нарушением финского суверенитета и довел военную напряженность во всей Скандинавии до предела. Правительство потребовало немедленного вывода войск, но Кригсмарине не ответил. Каковы бы ни были их истинные намерения, мир на Балтийском море нарушен."
 GEK_news.5.a: "Отличное решение."
 GEK_news.5.b: "Довольно агрессивно."
 GEK_news.5.c: "Что?"

