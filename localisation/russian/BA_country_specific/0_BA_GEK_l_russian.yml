 #독일 군사정부 - 중점
 GEK_air_innovation: "Перегруппировка Люфтваффе"
 GEK_air_innovation_desc: "Из-за «Великого Перемещения» и исчезновения главнокомандующего Геринга Люфтваффе рассеялись по всей территории Германии. Теперь мы можем перегруппировать их и снова поставить на службу Вермахту."
 GEK_long_range_escorts: "Исследование тяжелых истребителей"
 GEK_long_range_escorts_desc: "Тяжелые истребители с большей дальностью и огневой мощью будут защищать наши небеса и опустошать небеса врага."
 GEK_four_year_plan: "Двухлетний план"
 GEK_four_year_plan_desc: "С момента установления германского военного правительства мы окружены врагами. Мы должны разработать экономическую политику, которая быстро принесет результаты, и производить более мощное оружие, чтобы обеспечить наше выживание."
 GEK_form_the_reichskommissariats: "Амбиции Великого Рейха"
 GEK_form_the_reichskommissariats_desc: "Теперь, когда мы возродились среди этих чужаков, пришло время вернуть европейский континент из рук захватчиков. Германия и ее верный Вермахт подготовятся к великой войне за отвоевание Европы."
 GEK_government: "Флот в изгнании"
 GEK_government_desc: "После катастрофического поражения у Тринити мы бежали на Готланд, погруженный в безвластие. Германский Кригсмарине когда-нибудь вернется на родину."
 GEK_GER_government: "Установление военного правительства"
 GEK_GER_government_desc: "Чрезвычайные обстоятельства требуют чрезвычайных мер. Мы воспользуемся гражданской войной в так называемой «Академии Генна», чтобы реорганизоваться и поднять Германию из пепла."
 GEK_free_german_legion: "Призыв к организации ополчения"
 GEK_free_german_legion_desc: "Мы призовем всех немцев по радио присоединиться. Наш флот поможет собрать их на Готланде."
 GEK_communication_with_the_mainland: "Связь с родиной"
 GEK_communication_with_the_mainland_desc: "После того, как связь с Вермахтом была потеряна после его перемещения на север Германии, мы будем работать над восстановлением коммуникаций и попытаемся скоординировать с ними восстановление страны."
 GEK_first_mainland_plan: "План отвоевания родины"
 GEK_first_mainland_plan_desc: "Мы не можем упустить возможность, которую получили. Мы должны ухватиться за этот последний шанс и вернуть Германию. Второго отступления не будет!"
 GEK_get_in_touch: "Операция: Ремилитаризация Рейнской области"
 GEK_get_in_touch_desc: "Подтверждено, что Вермахт выжил на крайнем севере Генны, избежав их репрессий. Мы должны немедленно скоординироваться с ними и собрать все немецкие группы сопротивления."
 GEK_get_in_touch_tt: "§REто сильно спровоцирует Генну и Тринити.§!"
 GEK_seek_support: "Поиск поддержки"
 GEK_seek_support_desc: "Некоторые страны мира не одобряют «Кивотос», парализовавший всю Европу. Мы постараемся заручиться их поддержкой, что станет большим подспорьем для восстановления германского государства."
