 GEK_show_story_archive_gui_desc: "Здесь вы можете просмотреть побочные истории, связанные с Кригсмарине Германии. Эта система не влияет на игровой процесс и существует исключительно для удовольствия от внутреннего повествования страны в игре. По мере прохождения событий и времени будут открываться новые истории. Надеемся, вам понравится!"

