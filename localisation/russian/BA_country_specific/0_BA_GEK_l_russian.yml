 ###########################################################
 GEK_gathering_storm_desc: "Возникает новая Германия. Прошло три года с момента роспуска Веймарской республики и появления Третьего рейха Гитлера. После тяжелых времен Великой депрессии экономика стабилизировалась, а массовая безработица была преодолена.\n\nОднако с началом Великого Перемещения Германия рухнула. Благодаря усилиям Кригсмарине нам удалось бежать на Готланд, в Швецию, но могущественной Германии больше не существует."

 GEK_protestant_state: "Немецкое протестантское государство"
 GEK_catholic_state: "Немецкое католическое государство"
 GEK_trm_christianity_state: "Немецкое государство тринитарного христианства"
 GEK_no_religion: "Светское или нерелигиозное немецкое государство"
 GEK_ari_religion: "Немецкое арианское католическое государство"
 ARI_Gottglaubig_religion: "Немецкое государство Gottgläubig"
 GEK_spirit_of_capitalism_state: "«Дух капитализма»"
 GEK_protestant_patriotism: "Патриотический протестантизм"
 GEK_protestant_patriotism_desc: "Когда родина в опасности, протестантская церковь не может оставаться в стороне от борьбы за национальное возрождение! Протестанты будут активно помогать нации воинской службой и поддержкой в войне."
 GEK_protestant_patriotism_for_TRM_desc: "Похоже, немецкие протестанты поддерживают немецкое правительство, а не наше, и неохотно идут на призыв. Мы должны сокрушить незаконное правительство Западной Германии и научить их, что такое истинный патриотизм."
 GEK_materialism: "Материализм и производительность"
 GEK_materialism_desc: "Вместо непродуктивных, эксплуататорских и репрессивных традиционных религий мы можем поощрять активный трудовой дух через материалистическое мировоззрение, основанное на учении Карла Маркса, которое позволяет нам видеть, анализировать и преобразовывать реальность."
 GEK_catholic_trade_union: "Католический профсоюз"
 GEK_catholic_trade_union_desc: ""
 GEK_secondary_citizenship: "Система второго сорта гражданства"
 GEK_secondary_citizenship_desc: ""
 GEK_separation_law: "Отделение внеплановых"

 NSD_the_SS_went_to_america: "§Y$reinhard_heydrich$§! находится в §Y[USA.GetNameWithFlag]§!"
 NSD_the_SS_went_to_arius: "§Y$reinhard_heydrich$§! находится в §Y[ARI.GetNameWithFlag]§!"
 NSD_the_SS_went_to_gottland: "§Y$reinhard_heydrich$§! находится в §Y[GEK.GetNameWithFlag]§!"
 BA_is_GER_core_tt: "Эта провинция является §Yнемецкой ядерной§!"

 BAY_event.1.t: "Военное правительство установлено"
 BAY_event.1.desc: "После мобилизации Вермахта нам удалось вернуть север Германии и установить военное правительство. Однако начинают проявляться внутренние разногласия в Вермахте, и неуверенность перед лицом неизвестных врагов растет в армии."
 BAY_event.1.a: "Германия возрождается."
 BAY_event.2.t: "План атаки"
 BAY_event.2.desc: "Теперь, когда армия реорганизована, пришло время вторгнуться в Генну. Мы можем выбрать время начала наступления."
 BAY_event.2.a: "Начинайте наступление немедленно!"
 BAY_event.3.t: "Объединение германской территории"
 BAY_event.3.desc: "После великой победы нашего Вермахта мы вернули территории, завоеванные для Германии. Мы на шаг ближе к объединению, и весь немецкий народ с энтузиазмом празднует."
 BAY_event.3.a: "Путь еще предстоит."
 BAY_event.4.t: "Ультиматум от Германии"
 BAY_event.4.desc: "Вскоре после падения Академии Генна мы получили ультиматум из Германии. Правительство требует возврата немецких земель, находящихся под нашим контролем, и предупредило о военном ответе в случае невыполнения требования."
 BAY_event.4.a: "Готовиться к войне."
 BAY_event.4.b: "Тьфу... Ладно, пусть забирают."
 BAY_event.5.t: "Ультиматум отклонен"
 BAY_event.5.desc: "Мы получили известие, что наш щедрый ультиматум был отклонен."
 BAY_event.5.a: "Я так и знал."

 GEK_rm_event.1.t: "Лояльность земельных правительств"
 GEK_rm_event.1.d: "Нам удалось установить контакт с земельными правительствами и получить от них обещание прекратить замешательство, вызванное отсутствием вышестоящей администрации, и присоединиться к нам. В предстоящих битвах мы сможем рассчитывать на их сотрудничество."
 GEK_rm_event.1.a: "Все идет хорошо."
 GEK_rm_event.1_tt: "§YВсе штаты§! с модификатором §YНемецкое земельное правительство§!: \n\n"
 GEK_rm_event.2.t: "Солидарность поверх идеологий"
 GEK_rm_event.2.d: "Чтобы получить широкое и плюралистическое сотрудничество, мы связались со всеми политическими партиями, профсоюзами, военизированными и студенческими организациями внутри Германии, чтобы попросить их о содействии. [GEK.getname] преодолеет поражение родины и победит захватчиков из другого мира через единство, которое выходит за рамки идеологий."
 GEK_rm_event.2.a: "К восстановлению Германии!"
 GEK_rm_event.3.t: "Связь с Коммунистической партией"
 GEK_rm_event.3.d: "Во времена Веймарской республики Коммунистическая партия Германии пользовалась значительной поддержкой. Союз с ними обеспечит нам важное подкрепление. Благодаря их сильному влиянию среди рабочих Гольштейна мы заняли этот регион и получили вооруженных рабочих Гамбурга и Киля в качестве союзных сил."
 GEK_rm_event.3.a: "И все же мы должны быть осторожны с коммунистами!"
 GEK_rm_event.4.t: "Сотрудничество с Социал-демократической партией"
 GEK_rm_event.4.d: "Будучи ключевыми фигурами Веймарской республики, социал-демократы обладают общенациональной базой поддержки и непревзойденным политическим опытом. Хотя в настоящее время они не имеют большого влияния в Западной Германии, они могут стать для нас очень способными политическими советниками."
 GEK_rm_event.4.a: "Будем надеяться на хорошие результаты от них."
 GEK_rm_event.5.t: "Концентрация народа"
 GEK_rm_event.5.d: "Чтобы иметь большее влияние в рамках Объединенного фронта освобождения, действенной стратегией является мобилизация масс. Мы попытаемся собрать народ, чтобы укрепить наши позиции."
 GEK_rm_event.5.a: "Объединим республиканцев."
 GEK_rm_event.5.b: "Объединим консерваторов."
 GEK_rm_event.5.c: "Объединим членов партии."
 GEK_rm_event.5.e: "Да здравствует национальное освобождение!"
 GEK_rm_event.6.t: "Альянс с Партией Центра"
 GEK_rm_event.6.d: "Имея базу поддержки в Рейнской области, эта католическая партия в зависимости от контекста занимала прогрессивные, центристские или консервативные позиции. В отличие от социал-демократов, их ценность заключается в способности сотрудничать с консервативными демократами."
 GEK_rm_event.6.a: "Положимся на их прогрессивную сторону."
 GEK_rm_event.6.b: "Положимся на их консервативную сторону."
 GEK_rm_event.7.t: "Германская армия"
 GEK_rm_event.7.d: "Наша германская армия, гордая наследница Пруссии, была низвергнута Версальским договором и вторжением из другого мира, но никогда не сдавалась. Хотя на нее влияют консервативные юнкеры, мы можем действовать, основываясь на суждении о правильном и неправильном."
 GEK_rm_event.7.a: "За лучшую Германию!"
 GEK_rm_event.7.b: "Армия не должна вмешиваться в политику."
 GEK_rm_event.8.t: "Национал-социалистическая немецкая рабочая партия"
 GEK_rm_event.8.d: "Нацистская партия, которая еще несколько месяцев назад управляла страной, обладает огромным административным потенциалом. Хотя она была сильно потрепана вторжением из другого измерения, она все еще может предложить нам поддержку из своего оплота в Нюрнберге и на юге Германии."
 GEK_rm_event.8.a: "Нацизм без Гитлера, да?"
 GEK_rm_event.9.t: "Треснувший альянс"
 GEK_rm_event.9.d: "Мы все знали, что «великая коалиция всей Германии» была иллюзией, обреченной рано или поздно рухнуть."
 GEK_rm_event.9.a: "Проклятье."
 GEK_rm_event.10.t: "Альянс с Немецкой народной партией"
 GEK_rm_event.10.d: "Немецкая народная партия была крупнейшей консервативной партией после Великой войны, представляя в основном юнкеров. Их политическое суждение и верность былому имперскому величию будут для нас большим подспорьем."
 GEK_rm_event.10.a: "За Империю!"
 GEK_rm_event.11.t: "Гражданская война!"
 GEK_rm_event.11.d: "Партии, выступающие против военного режима, подняли оружие."
 GEK_rm_event.11.a: "Проклятье!"
 GEK_rm_event.12.t: "Сотрудничество с Манмаджуном"
 GEK_rm_event.12.d: "Похоже, местные армии планируют вторжение в больших масштабах!"
 GEK_rm_event.12.a: "Помоги нам, Дисциплинарный комитет!"
 GEK_rm_event.13.t: "Последствия Великого Перемещения"
 GEK_rm_event.13.d: "Теперь мы понимаем, что пережили «Великое Перемещение», и ведется исследование нового мира, в котором мы оказались. Военные операции по подавлению местного сопротивления, которое мы считали внезапной атакой, почти полностью увенчались успехом. Теперь остается только следить за последними остатками."
 GEK_rm_event.13.a: "Будем сохранять бдительность."
 GEK_rm_event.13.b: "Какая досада. Не могли бы мы просто оставить их?"
 GEK_rm_event.13_tt: "\n§gАрмия будет действовать.§!"
 GEK_rm_event.14.t: "Продовольственная политика"
 GEK_rm_event.14.d: "Возвращение территории Западной Германии — это благословение среди бедствия. Этот регион, полный промышленных зон вдоль Рейна, позволяет нам проводить нашу экономическую политику без серьезных изменений. Однако потеря обширных сельскохозяйственных угодий на востоке создает другую проблему: цены на продукты питания выросли, что влияет на уровень жизни граждан и ставит под угрозу экономический рост. Мы можем решить эту проблему, импортируя продовольствие. Вопрос в том: откуда мы будем его импортировать?"
 GEK_rm_event.14.a: "Будем импортировать из США."
 GEK_rm_event.14.b: "Будем импортировать из Италии."
 GEK_rm_event.14.c: "Будем импортировать из Советского Союза."
 GEK_rm_event.14.e: "Попросим помощи у Советского Союза."
 GEK_rm_event.14_tt_1: "§gИз-за нехватки продовольствия в США нам придется платить более высокую цену.§!\n\n"
 GEK_rm_event.14_tt_2: "§gНаше коммунистическое правительство может рассчитывать на безвозмездную помощь от Советского Союза.§!"
 GEK_rm_event.15.t: "Импорт продовольствия [GEK.getname]"
 GEK_rm_event.15.d: "[GEK.getname] импортирует продовольствие от нас."
 GEK_rm_event.15.a: "Отлично."
 GEK_rm_event.16.t: "Религиозная политика"
 GEK_rm_event.16.d: "После Реформации немецкая религия разделилась на две основные ветви: протестантизм на севере и востоке Германии и католицизм на западе и юге. Примерами конфликта между ними являются Тридцатилетняя война, споры между пангерманизмом и малогерманским путем, а также Культуркампф Бисмарка. Хотя после объединения Германии и последующей Культуркампф эти религиозные конфликты, казалось, утихли, противостояние между Партией Центра — республиканской и католической — поддерживаемой промышленниками Рейна, и Немецкой национальной народной партией — протестантско-монархической — поддерживаемой юнкерами, вновь всплыло. Особенно с восстановлением только запада, влияние католиков стало сильнее, чем в мирное время, что усиливает религиозную напряженность.\n\nС другой стороны, существуют и новые религии, принесенные существами из другого мира после Великого Перемещения. Были идентифицированы две новые разновидности: христианство Тринити и христианство Ариус. Предварительные исследования показывают заметное сходство с христианством нашего мира, но ограниченная информация и редкие контакты препятствуют детальному пониманию.\n\nНаконец, было замечено, что пришельцы из Генны не исповедуют единой религии и демонстрируют заметно высокий уровень атеизма."
 GEK_rm_event.16.a: "У меня от этого голова болит."
 GEK_rm_event.17.t: "Католическая реакция!"
 GEK_rm_event.17.d: "Католики восстали против политики поддержки протестантской церкви!"
 GEK_rm_event.17.a: "Это проблема."
 GEK_rm_event.18.t: "Протестантская реакция!"
 GEK_rm_event.18.d: "Протестанты восстали против политики поддержки католической церкви!"
 GEK_rm_event.19.t: "Поврежденная промышленность"
 GEK_rm_event.19.d: "В течение последнего года по всей Западной Германии вспыхивали крупные и мелкие сражения. Поскольку в этом регионе сосредоточена большая часть ключевых промышленных объектов, конфликты, взрывы и разрушения нанесли серьезный ущерб нашей промышленности, и она нуждается в восстановлении."
 GEK_rm_event.19.a: "Проклятье."
 GEK_rm_event.20.t: "Студенческая политика"
 GEK_rm_event.20.d: "Дальнейшие исследования показали, что пришельцы происходят из другого мира под названием «Кивотос», общества, организованного в академии, управляемые студентами с собственной автономией. Теперь мы должны установить политику в отношении сдавшихся студентов и этих существ из другого измерения."
 GEK_rm_event.20.a: "Будем надеяться, они не создадут проблем."
 GEK_rm_event.21.t: "Студенческая проблема"
 GEK_rm_event.21.d: "Хотя нам удалось добиться капитуляции пришельцев, их сопротивление продолжается."
 GEK_rm_event.21.a: "Это сложно."
 GEK_rm_event.21_tt_1: "\n§gНам нужно снова запустить лагеря перевоспитания, чтобы решить проблему студенческого сопротивления.§!"
 GEK_rm_event.21_tt_2: "\n§gМы должны предоставить гражданство студентам этой академии.§!"
 GEK_rm_event.21_tt_3: "\n§gТеперь мы можем использовать дополнительные активы из другого мира.§!"
 GEK_rm_event.21_tt_4: "\n§gМы должны переопределить права пришельцев.§!"
 GEK_rm_event.21_tt_5: "\n§gМы должны возобновить задачи по сегрегации.§!"
 GEK_rm_event.22.t: "Выбор коллаборационистов"
 GEK_rm_event.22.d: "Не все в Академии Генна разделяют одни и те же цели или идеалы.\n\n... На самом деле, они настолько фрагментированы, что сотрудничать со всеми сразу было бы контрпродуктивно. Мы должны объединиться с конкретной фракцией, чтобы обеспечить стабильное сотрудничество."
 GEK_rm_event.22.a: "Будем сотрудничать с Манмаджуном."
 GEK_rm_event.22.b: "Нам нужна помощь Дисциплинарного комитета."
 GEK_rm_event.22.c: "Заключим союз со студенческими клубами."
 GEK_rm_event.23.t: "Сотрудничество с Манмаджуном"
 GEK_rm_event.23.d: "Теперь мы можем использовать высшее руководство Манмаджуна, которое действовало как центральное правительство бывшей Генны, в качестве советников."
 GEK_rm_event.23.a: "Завербуем Ироху."
 GEK_rm_event.23.b: "Завербуем Ибуки."
 GEK_rm_event.24.t: "Сотрудничество с Дисциплинарным комитетом"
 GEK_rm_event.24.d: "Теперь мы можем использовать офицеров Дисциплинарного комитета, которые действовали как полицейские силы бывшего правительства Генны, в качестве советников."
 GEK_rm_event.24.a: "Завербуем Иори."
 GEK_rm_event.24.b: "Завербуем Чинацу."
 GEK_rm_event.24.c: "Завербуем Ако."
 GEK_rm_event.25.t: "Сотрудничество с клубами"
 GEK_rm_event.25.d: "Теперь мы можем использовать членов различных клубов Академии Генна в качестве советников."
 GEK_rm_event.25.a: "Вступим в союз с Гастрономическим клубом."
 GEK_rm_event.25.b: "Вступим в союз с Клубом развития термальных источников."
 GEK_rm_event.25.c: "Вступим в союз с Отделением неотложной медицины."
 GEK_rm_event.26.t: "Неожиданная акция Гастрономического клуба!"
 GEK_rm_event.26.d: "Гастрономический клуб совершил террористический акт в аквариуме в центре [TRM.getname]! Нам не избежать войны с Тринити!"
 GEK_rm_event.26.a: "Что!?"

 GEK_event_for_auto.22.t: "Альянс с Католической церковью"
 GEK_event_for_auto.22.d: "Протестантские организации выступают против нашего союза с Католической церковью."
 GEK_event_for_auto.22.a: "А нам-то что?"
 GEK_event_for_auto.22.b: "Если они этого хотят..."
 GEK_event_for_auto.27.t: "Альянс с Протестантской церковью"
 GEK_event_for_auto.27.d: "Протестантские организации выступают против нашего союза с Протестантской церковью."
