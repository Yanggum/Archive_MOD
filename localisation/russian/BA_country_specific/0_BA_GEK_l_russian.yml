#Персонажи
 GEK_erich_raeder_desc: "Главнокомандующий Кригсмарине\n\nЭрих Редер не желал этого поста. С самого начала он никогда не представлял, что станет лидером изгнанного Кригсмарине, остатка разрушенной Швеции, который теперь выживает на Готланде. Он всего лишь военный, всю жизнь служивший своей родине со времен Германской империи, и уж точно не лидер Германии.\n\nЖенщины из другого мира уничтожили Германию. С исчезновением Фюрера и других лидеров, даже бывшие враги, такие как Франция и Великобритания, пали под их натиском. Когда скандинавские страны, включая Швецию, пали перед их ударом, Редер собрал оставшихся солдат, адмиралов и флот Кригсмарине, а также немцев из прибрежных городов, и бежал на Готланд, ничейную землю.\n\nРедер настаивает, что у него нет качеств лидера, что он всего лишь адмирал и не способен управлять. Однако такие адмиралы, как Карл Дёниц, верно следуют за ним, и как матросы, так и гражданские немцы полагаются на него. Нравится ему это или нет, Редер стал лицом и опорой немцев, сопротивляющихся захватчикам из другого мира.\n\nРаботает ли он молча в своем офисе или инспектирует флот в порту, поднимая моральный дух, Редер несет эту ответственность за свою родину, ныне угнетаемую захватчиками. Потому что если не ради родины, то ради чего еще?"

 GEK_central_navy_committee: "Центральный комитет Красного флота"

 #Исторический архив
 GEK_story_event.1.t: "Глядя на море"
 GEK_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nКурт мыл шваброй порт Готланда. Он служил матросом на эсминце Кригсмарине всего два года, то есть военно-морского флота, и еще не преодолел звание солдата. Глубоко вздохнув, Курт смотрел на море. В его сознании появились лица его отца и семьи, оставленных на родине, наполняя его беспокойством.\n\nРазговаривая с товарищем, они услышали язык, непохожий на немецкий. Повернувшись на звук, они увидели нескольких женщин с разными выражениями лиц и инструктора, говорящего с ними на их языке. Ходили слухи, что маршал даровал им помилование, чтобы использовать их как военную силу. То, что парило над их головами, снова напомнило Курту и матросам, что они были существами из другого мира. И что именно они разрушили их родину.\n\n«...Курт, эти девки...»\n\n«Это приказы маршала, Генрих. Я знаю, тебе хочется набить им морду, но держись и не пускай в ход кулаки. Если нас потащат на трибунал, будут проблемы.»\n\nВысшее командование военно-морского флота уже строго предупредило, что нападения и ответные действия не будут терпимы, но Курт и матросы смотрели на них с неодобрением. Хотя они знали, что те не несут прямой ответственности за падение их родины, Курт все равно сжимал зубы, наблюдая с враждебностью за этими женщинами из «Кивотоса». Некоторые были в ужасе, другие бормотали, жалуясь на свою участь, водя шваброй по палубе. Он решил игнорировать их и продолжил свою работу.\n\nТогда произошел инцидент. Один матрос толкнул одну из девушек из Кивотоса, заставив ее упасть. Ее товарищи хотели отомстить, но, опасаясь ответных мер, продолжали молча работать. Курт начал испытывать сострадание. Помимо этого ореола над их головами, они были просто молодыми девушками в военной форме. Вздохнув, он протянул руку упавшей девушке, чтобы помочь ей встать. Она, вытирая слезы, посмотрела на него. Курт тоже посмотрел на нее с покорностью, снова вздохнув.\n\n«Мне не нравится, что вы здесь. К тому же вы разрушили нашу родину. Так что не ждите хорошего обращения, понятно? Лучше занимайтесь своим делом.»\n\nУ девушки были короткие волосы оливково-зеленого цвета и ореол над головой. Она не понимала ни слова из того, что говорил Курт. Однако она подумала, что он помог ей, потому что беспокоился о ней. Снова взяв швабру, она вытерла слезы рукавом формы и дрожащим голосом прошептала:\n\n«...Danke schön... (...Спасибо...)»"
 GEK_story_event.2.t: "Патриот ради друга"
 GEK_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nГенрих не мог смотреть благосклонно на этих девушек с ореолами. Он был одним из самых рьяных последователей Фюрера и обычно говорил своему другу Курту, что Германия однажды возродится, что придет время отомстить деградировавшим Англии и Франции. Когда Фюрер исчез, а родина была разрушена, единственное, что он нашел, была ярость, пустота и горькое чувство утраты.\n\nПосле выхода из детского дома он впервые в жизни нашел на что опереться. Но потеряв это, Генрих обратил свою ненависть на женщин Кивотоса. Каждый раз, сталкиваясь с одной из них, он хватал ее за шею и избивал. Его оценка падала все ниже и ниже, и его столько раз привлекали к трибуналу, что он уже не мог сосчитать. Даже его единственная дружба с Куртом ослабевала. Осознание того, что его единственный друг, тоже сирота, полностью отдаляется, погружало его еще глубже в отчаяние и обиду.\n\nСнова Генрих едва избежал трибунала и курил сигару. Идя и бормоча проклятия себе под нос, его глаза уловили две тени. Двигаясь в направлении теней, он увидел расплывчатый силуэт. Проследовав за ним, он увидел Курта... рядом с одной из тех девушек из Кивотоса, которых он так ненавидел.\n\nОтношения между Куртом и той девушкой было трудно описать словами. По крайней мере, Генрих хотел, чтобы это было не то, о чем он думал. Но вопреки его желаниям, лицо Курта было не таким, как обычно.\n\nНа лице его единственного друга, которого он едва видел улыбающимся, расцвела маленькая улыбка. Такое же выражение было на лице девушки. Он также ясно видел, как их руки соприкасались на шершавом бетоне порта.\n\nС озадаченным выражением Генрих вернулся на эсминец. Даже когда прозвучал свисток построения и настало время ложиться спать, он не мог уснуть. С тех пор как умерла мать Курта, он больше не видел своего друга улыбающимся. А теперь он показывал слабую улыбку. В его голове роились противоречивые мысли.\n\nУ Генриха был маленький и неуклюжий ум. Сколько хаоса могли вызвать эти мысли в его голове? Хотя он не хотел этого признавать, в конце концов ему пришлось.\n\nНе все девушки с ореолами были проклятыми.\n\n«Однажды... чтобы он мог улыбаться по-настоящему.»"

 GEK_story_event.3.t: "Воспоминания в земле, куда бежал"
 GEK_story_event.3.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nЭто была практически ситуация военного положения, что делало почти невозможным для таких матросов, как он, получить увольнение. И даже если бы они его получили, все, что они могли делать, это проводить время в какой-нибудь гостинице или баре на Готланде. В этой ситуации ему удалось взять увольнение, и он попытался отдохнуть в гостинице на острове. Но когда он пришел в себя, перед ним был горький кофе и скон, а Мио, улыбаясь, пила кофе с молоком и ела хлеб.\n\nЭто был первый раз, когда он по собственной воле пошел в место, куда обычно никогда бы не пошел.\n\n«Что вы делаете? Ешьте! Не стесняйтесь!»\n\nИз-за ее настойчивости Курт тоже запихнул в рот кофе и скон. Честно говоря, качество было плохим. Кофе был просто горьким, а скон был таким сухим, что было бы аппетитнее жевать губку. Тем не менее, учитывая обстоятельства, он должен был чувствовать благодарность.\n\n«Фууу...»\n\nМожет ли быть что-то более неловкое, чем эта ситуация? Кроме того, будучи мужчиной и женщиной наедине в таком месте, было естественно чувствовать стыд.\n\n«Эй?»\n\nУдивленный ее голосом, он на мгновение потерял дар речи. Мио только смотрела на него, улыбаясь. Почему она смотрела на него таким взглядом? Сдерживая румянец на лице, он доел последний скон и залпом выпил кофе.\n\n«Кха...! *кхе-кхе*...»\n«Ха-ха-ха, сидите. Я заплачу.»\n\nПока он кашлял, потому что проглотил слишком быстро, Мио уже пошла оплачивать счет. Курт попытался остановить ее, но как исправить уже разрушенный амбар?\n\nОна все еще была рядом с ним. Он даже перестал говорить ей отойти. Каждый раз, когда он это делал, она приближалась еще больше. Звук волн и чаек сменился громким стуком его собственного сердца.\n\n«Слушай, можешь отодвинуться немного? Что, если кто-то неправильно это поймет?»\n«Почему? Я тебя смущаю? Что плохого в том, что сослуживцы идут вместе?»\n\nНесмотря на ее слова, Мио лишь показывала решительное выражение. Ее лицо, смотревшее на него снизу вверх, постепенно перестало излучать уверенность, а затем она взяла его пальцы в свои. Почувствовав это мягкое прикосновение, его дыхание почти остановилось.\n\n«Ты...»\n«...»\n\nВ ответ на его слова Мио крепко сжала не только его пальцы, но и всю его руку. Курт покрылся холодным потом, и его лицо покраснело, как у сломанной куклы. Если бы его товарищи-матросы были здесь, он бы немедленно стал объектом насмешек. Но ни Генриха, ни какого-либо начальства там не было.\n\nОн колебался мгновение, как ей ответить. Но вскоре решился и взял ее мягкую руку своей грубой ладонью.\n\nЭто не значит, что у него никогда не было счастливых моментов. По крайней мере, до смерти матери они были. Возможно, она тоже чувствовала биение его бешеного сердца. Не говоря ни слова, они просто продолжали идти, сдерживая дрожь своих чувств. И также, биение ее сердца достигало его сердца.\n\n«Сладость во тьме.»"
 GEK_story_event.4.t: "К своим обязанностям"
 GEK_story_event.4.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nКогда он впервые ступил на родную землю, первое, что он увидел, были солдаты Вермахта. В отличие от Кригсмарине, изгнанного на Готланде и планирующего свое возвращение, остатки Вермахта тайно сражались против «Генны». По-видимому, они уже слышали, что женщины с ореолами присоединились к Кригсмарине, потому что смотрели на них с любопытством... или с глазами, полными ненависти.\n\nУстроив припасы, он сел отдохнуть в отдаленном уголке. Мио села рядом с ним со своей обычной улыбкой и достала из кармана конфету, чтобы дать ему. Курт молча положил ее в рот и наслаждался сладостью. Мио тоже медленно ее сосала. Ее жест был как всегда, но глаза были потухшими.\n\n«Меня назначили в Пехоту Halo.»\n«...Понятно.»\n\nОн уже слышал об этом раньше. Верховный главнокомандующий планировал сформировать дивизию Пехоты Halo, чтобы вернуть континент, и Мио будет назначена туда. Он знал, что это будет ключом к противостоянию Кивотосу и что ее ждут тяжелые тренировки. И, сам того не замечая, в нем начал зарождаться страх потерять Мио.\n\nКак будто заметив это, Мио улыбнулась ему, глядя на него.\n\n«Я в порядке. Если я могу помочь спасти Германию, этого достаточно. Ты всегда мечтал об этом, не так ли? Глядя на море, ты представлял, что однажды снова увидишь своего отца и семью. Тринити и Генна — могущественные враги... но я думаю, верховный главнокомандующий и генерал поведут нас хорошо... хе-хе...»\n\nОна пыталась успокоить его улыбкой, но ее выражение становилось все мрачнее. Курт тоже это чувствовал. Как и при их первой встрече, они оба ничего не могли сказать.\n\n«Знаешь? Даже если в меня попадут, со мной ничего не случится... Но я за тебя беспокоюсь. Выживи. В отличие от меня, ты можешь умереть от одной пули. Может, я не смогу защитить тебя рядом... но мое сердце всегда будет с тобой. Даже если мы будем разделены, я всегда буду с тобой.»\n\nСказав это, Мио раскрыла объятия и крепко обняла его. Ей хотелось, чтобы этот момент длился вечно. Объятие, которое могло быть первым и последним. Поэтому они прижались друг к другу еще крепче. Время пролетело как стрела, и они горько попрощались. Даже возвращаясь на свои посты, их шаги были тяжелыми и трудными.\n\n«Auf Wiedersehen. (Прощай.)»"
 GEK_story_event.5.t: "В аду"
 GEK_story_event.5.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nСтальной дождь обрушился на несчастных солдат Halo, разбросанных по полю боя. Один солдат сжимал свою каску, безостановочно бормоча «нет, нет...», впадая в панику. Другой с яростью кричал, ударяя прикладом винтовки девушку из Генны. Как сохранить рассудок в таком хаосе? В этой адской ситуации Мио отчаянно сражалась, чтобы выжить еще немного.\n\nХаотичные бои продолжались до рассвета. Пламя освещало ночное небо, как днем. Она вспоминала свою жизнь до Великой войны. Тогда, на палубе корабля-академии, когда она говорила с подругой, глядя на море... это воспоминание все еще было ярким, как будто это было вчера. Погруженная в шок от ада перед глазами, Мио была выведена из оцепенения своей подругой довоенных времен, Котонэ.\n\n«Очнись! Если ты останешься здесь, ты умрешь!»\n«Котонэ... но... я... я...»\n\nУвидев у Мио признаки паники, подруга схватила ее за плечи и закричала. Пока Котонэ пыталась привести Мио в чувство, снаряд разнес ее ореол. Даже не вскрикнув, Котонэ испустила последний вздох. Увидев, как ее подруга мгновенно погибла, Мио схватила свою штурмовую винтовку и, задыхаясь, бросилась в бой, думая о смерти.\n\nДаже без патронов и физически истощенная, она продолжала сражаться в рукопашной, крича почти как вой. Ее лицо было в крови, форма разорвана, а раны множились. В сердце она думала о Курте. Она вспомнила их первую встречу и последнее объятие, которым они обменялись.\n\nОна знала, что эта битва когда-нибудь закончится. Но она также очень хорошо знала, что не доживет до этого. Как будто ее предчувствия были верны, в поле ее зрения появился параболический снаряд. Студентки Генны и немецкие солдаты Halo начали отступать, но Мио не могла двинуться с места. Эта черная горящая масса приближалась все ближе.\n\n«Курт...»\n\nСлезы потекли по ее щекам. Предчувствовала ли она свой конец? Она с трудом сглотнула, закрыла глаза и в первый и последний раз улыбнулась тому, кто владел ее сердцем.\n\n«Прости.»\n\nПоле боя было покрыто густым дымом и горящими взрывами. На месте, где она была, ничего не осталось.\n\n«И битва продолжалась.»"
 GEK_story_event.6.t: "Под темным небом"
 GEK_story_event.6.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nЭсминец, на котором находился Курт, в теории должен был обстреливать побережье для поддержки союзников. Да, так и должно было быть. Но те женщины из Тринити послали торпедоносцы против его эсминца и флота, начав тем самым битву на море. Зенитные батареи эсминца извергали снаряды по входящим торпедоносцам, и вскоре весь корабль превратился в полный хаос.\n\n«Генрих! Патроны! Быстро!»\n«Вот патроны! Ну и встречу мы устраиваем этим сукам!»\n«Заткнись и заряжай уже!»\n\nКурт рядом с артиллеристом занимался подачей боеприпасов к зенитной батарее. Каждый раз, когда бомба падала в море, соленая и ледяная вода окатывала его. Каждый раз, когда поднимались волны, эсминец содрогался своим стальным корпусом. Он едва не падал больше одного раза. Подавляя тошноту, подступавшую к горлу, и едва держась за поручни, Курт цеплялся за свое слабое сознание и выполнял свой долг. Как раз когда он зарядил последний снаряд и указал пальцем на торпедоносец с эмблемой Тринити, летящий в небе, он закричал—\n\n«Торпеда!!»\n\nНе прошло и двух секунд после этих слов, как взрыв сильно сотряс судно. С трудом поднявшись с пола, Курт поднял взгляд и увидел, как неумолимые торпеды и бомбы врага безжалостно падают. Очереди пушек торпедоносца разрывали воздух и разрывали артиллериста и тех, кто был рядом. Этого взрыва было достаточно, чтобы осветить, как днем, предрассветное утро, все еще без солнца.\n\nКак раз когда он пытался занять позицию у зенитной батареи, чтобы противостоять им, он услышал крики матросов, говорящих ему бежать, удаляясь от него. Подняв взгляд, он увидел падающую с неба бомбу. Его разум опустел.\n\n«Черт, Курт! Что ты делаешь?! Быстро!»\n\nГолос Генриха гремел в его голове. Его тело не слушалось. Он знал, что должен двигаться, но почему? Когда он наконец смог среагировать, его тело инстинктивно двинулось, пытаясь спастись от взрыва. Но жестоко, он произошел прямо за ним. Не успев опомниться, его тело подбросило в воздух, и он упал прямо в ледяную воду.\n\n«Курт!!»\n\nГенрих, увидев это, закричал в отчаянии. Он побежал к палубе, к месту взрыва, готовый броситься спасать его. Но матросы удержали его. Его утащили внутрь корабля, в так называемую «безопасную зону». Оттуда он ничего не мог сделать, кроме как смотреть, как море пожирает его единственного друга. Он никогда ничего ему не возвращал, только раздражал его. Он ничего для него не сделал. Плача, проклиная, он так сильно ударил кулаком в пол, что его собственная кровь пропитала его руки.\n\n- И, перед своим бессилием, он свернулся калачиком и снова закричал от боли."
 GEK_story_event.7.t: "Воспоминание"
 GEK_story_event.7.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nПрошло много времени, но война с Генной и Тринити наконец закончилась. Германия была спасена от лап Кивотоса, и пришельцы больше не будут разлагать ее землю. Однако Генрих потерял своего самого дорогого друга. Того, кто подошел к нему без предрассудков, даже когда его искалеченная личность расцвела после выхода из детского дома; того, кто смотрел на него как на человека. С тех пор как его друг исчез, Генрих пил каждый день. Он хотел, чтобы алкоголь облегчил и позаботился о его боли. Но он никогда не мог найти покоя. Уволившись из Кригсмарине, он ничего не делал, кроме как запирался в своей комнате с несколькими бутылками виски.\n\nГенрих вспоминал девушку, которая была рядом с Куртом. Хотя он проклинал ее, хотя пытался ударить, она никогда не отвечала ему враждебностью. Она определенно выражала дискомфорт, но никогда не бросала ему ни одного обидного слова. Сердце Генриха становилось еще более смущенным. Как он ни пытался это отрицать, он не мог закрыть солнце рукой. Тот факт, что та девушка приблизилась к Курту и осталась рядом с ним, вернул улыбку его единственному другу. И также было правдой, что с ней он снова обрел счастье.\n\nВиски жег горло, стекая вниз. Генрих, с его маленьким и неуклюжим мозгом, пропитанным алкоголем, снова вспомнил. Сделал ли он когда-нибудь что-то хорошее для своего друга? Курт дал ему многое, в то время как он только накапливал долги перед ним. Он принимал как должное все, что Курт делал для него.\n\nКак будто приняв решение, Генрих встал. Он собрал все деньги, которые откладывал на еще больше выпивки, и купил пишущую машинку и кучу бумаги. Он продал за бесценок все спиртное, что у него было. Генрих снова вспомнил моменты с Куртом, его единственным и самым ценным другом. И также вспомнил ту девушку, которая сделала его товарища счастливым. Он написал ей благодарственное письмо, очень поздно, да... но искреннее. Буква за буквой, медленно, осторожно.\n\n- «Это единственное, что я могу сделать.»"
 GEK_story_event.8.t: "История, которая не будет забыта"
 GEK_story_event.8.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nБыла опубликована книга «Цветок, расцветший в огне», написанная ветераном Кригсмарине Генрихом Радемахером. Книга рассказывает историю простого матроса и девушки из «Кивотоса», вторгшихся в Европу. К лучшему или худшему, работа вызвала большой интерес. Несмотря на глубокую обиду, накопившуюся между пришельцами и европейцами, история получила отличные отзывы сама по себе. Некоторые утверждают, что эта книга станет первым шагом к примирению между Кивотосом и человечеством, в то время как другие клеймят ее как простую фантазию.\n\nЧто больше всего привлекло внимание (и шокировало многих), так это тот факт, что она основана на реальной истории.\n\nНа вопрос, почему он написал книгу, Генрих Радемахер ответил:\n\n«Во-первых, я хочу рассказать о своем друге. Этот парень... многое для меня сделал. Он подошел ко мне, когда я был в детском доме, и проявил ко мне доброту, когда я был совершенно один. Он дал мне так много, что я даже не могу перечислить все здесь. И все же я никогда ничего ему не возвращал. Я только отравлял его сердце, беспрерывно пил, воровал его сигареты... Но этот придурок всегда относился к этому легко, с улыбкой.\n\nЯ вспомнил моменты, проведенные с ним. До того как он потерял свою мать и стал эмоционально отстраненным, он всегда говорил мне, что хочет стать кем-то, кого невозможно забыть, даже с течением времени. Я много думал об этом, поговорил с его отцом, и получить разрешение было легко... Поэтому я хотел исполнить его желание, хотя бы таким образом.\n\nЭто было нелегко. Я проводил целые дни, приклеившись к пишущей машинке, и искушение вернуться к алкоголю, который я поклялся больше не трогать, постоянно преследовало меня. Хуже всего было то, что мне пришлось улучшать свой почерк. Я жил в библиотеке неделями. Я зарылся в книги... Каждое слово, которое я написал, до сих пор бродит в моей голове как призрак.\n\nНу, думаю, оно того стоило. Все будут помнить моего друга Курта. Меня немного смущает, что его будут помнить по его первой любви, но... какая разница? Я уверен, он поймет это с небес. Хотя, честно говоря, мне немного страшно думать, что именно он встретит меня первым, когда я умру.»\n\n«В общем... спасибо за все. Хотелось бы, чтобы там, где ты, ты не грустил... и был счастлив вечно с той девушкой.»\n\n_«Спасибо за ваши слова.»"
 GEK_story_event.9.t: "На забытой периферии"
 GEK_story_event.9.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nВ захолустной земле, о которой никто не заботился, существовала деревня без названия. Место, куда почти не ступала нога человека, и его жители каждый жили своей историей, ведя жизнь по-своему. Как и у многих других, скрытые истории жителей были столь разнообразны, что их невозможно было перечесть. Небо начинало темнеть, и только в одном доме горел свет. Внутри мужчина пил кофе, медленно перелистывая газету, страницу за страницей.\n\n«Эй~ что ты так долго читаешь?»\n«А... утреннюю газету. Как знаешь, сегодня мы были довольно заняты. Так что я пользуюсь моментом, чтобы почитать сейчас. Иди отдыхай первая, я зайду через некоторое время.»\n\nГлаза мужчины пробегали по разным заголовкам: скандалы знаменитостей, окончание войны между Кивотосом и Германией... статьи на разные темы. Как раз когда он собирался закрыть газету, устав, знакомое лицо привлекло его внимание. Удивленный, он начал читать статью. Читая слово за словом, строку за строкой, на его губах появилась улыбка, а глаза начали краснеть. Поняв искренность того, кто по-своему услышал его слова, слезы, крупные как капли росы, начали течь по его лицу. Он закрыл газету и вошел в спальню, где его ждала любимая. Он лег рядом с ней, рядом с той, кто со своими видимыми шрамами, своей физической и эмоциональной зрелостью и своей все еще ослепительной красотой, приняла его с теплотой.\n\n«...Курт, ты помнишь, что сказал тогда?»\n«...Как я могу забыть? Ты сказала, что даже если мы физически разделены, наши сердца всегда будут вместе.»\n«Хе-хе, Курт, важно только это: теперь даже небеса не могут нас разлучить. Мы больше не упадем в ледяное море и не будем страдать в палящем зное.»\n«Это так похоже на тебя, Мио. Давай больше никогда не расставаться. Никогда.»\n\nУслышав его ответ, Мио крепко обняла его. Затем их души разделили глубокий поцелуй. Сколько времени прошло? Перед его глазами Мио спала с улыбкой на губах и тихим дыханием. Курт тоже улыбнулся, нежно погладил ее по щеке и спокойно закрыл глаза.\n\nЗвезды в небе сияли, словно благословляя их. Молодой месяц, безмолвный свидетель, наблюдал за парой, поклявшейся быть вместе, пока их тела не превратятся в прах. Курт чувствовал неподдельное счастье, которого не испытывал со смерти своей матери.\n\n- И больше не было слез, которые можно было бы пролить."

