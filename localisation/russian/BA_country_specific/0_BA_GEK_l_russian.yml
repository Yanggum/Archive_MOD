 GEK_religion_issue_cat: "Религиозная политика"
 GEK_religion_issue_cat_desc: "После Реформации немецкая религия разделилась в основном на две ветви: протестантизм на севере и востоке, и католицизм на юге и западе. Исторические конфликты, такие как Тридцатилетняя война, дебаты между великогерманством и малогерманством, и Культуркампф Бисмарка, являются яркими примерами этого разделения. Хотя конфликт, казалось, уменьшился после объединения Германии и культурной борьбы, напряженность вновь возникает между республиканским католическим Центрумом, поддерживаемым промышленниками Рейна, и протестантско-монархическим НННП, поддерживаемым юнкерами. С частичным восстановлением Западной Германии влияние католицизма возросло, порождая новые трения."
 GEK_conversion_to_protestant: "Обратить [FROM.getname] в протестантизм"
 GEK_conversion_to_protestant_desc: "С помощью миграционной политики мы проведем обращение на территориях, перенесенных из другого мира."
 GEK_insist_spirit_of_capitalism: "Усилить «Дух капитализма» в [FROM.getname]"
 GEK_insist_spirit_of_capitalism_desc: "В протестантских регионах все еще необходимо поддерживать живым «дух капитализма», связанный с протестантской доктриной."

