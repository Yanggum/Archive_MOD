# Экран выбора
COU_GATHERING_STORM_DESC: "Расположенный в центральном районе Кивотоса — огромном федеральном городе-академии, состоящем из тысяч больших и малых школ — Генеральный студенческий совет Кивотоса контролирует все центральные административные учреждения и координирует споры, политику и конфликты между всеми академиями в пределах автономных округов.\n\nДо недавнего времени Кивотос двигался под 'порядком Генерального совета'. Все академии следовали нашим приказам и подчинялись.\n\nНо, к сожалению, этот ничтожный порядок рухнул и стал неконтролируемым из-за бедствия под названием 'Великая война'. С Председателем Совета, истощенной переработкой — до такой степени, что ее исчезновение в любой момент не было бы удивительным — путь к восстановлению контроля над Кивотосом кажется бесконечным."