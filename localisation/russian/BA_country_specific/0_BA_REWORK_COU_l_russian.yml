COU_MOMOKA: "Юраги Момока"
COU_MOMOKA_DESC: "С каких пор Департамент транспорта стал таким важным министерством внутри Генерального совета? Это была лишь небольшая контора: чинить поезда, сходящие с рельсов каждый день, получать отчеты... и не более того.\n\nЮраги Момока стала лучом надежды для местных жителей. Новая Комиссия по реформам и Красный Рассвет намекают, что она не просто правительница. С обильным запасом закусок со вкусом мяты (мэнтайко), обращением, подобающим властной фигуре, и притворным послушанием, Момока в конце концов стала ядром нового порядка.\n\nДругими словами: Момока — не более чем тот, кого заставили взвалить на себя нудные дела.\n\nМомока не слишком интересуется политическими играми. Она давно устала обрабатывать еще больше бумаг и бюрократии. Иногда она вздыхает в одиночестве, говоря, что скучает по Рин. Рядом с ней местные жители с красными повязками лишь наблюдают за ней с подозрением.\n\nНо куда бы ее ни поместили, она — новый порядок: символ гармонии между человечеством и Кивотосом.\n\nМомока... и закуски со вкусом мэнтайко... будут верно выполнять этот долг.\n\nХотя она немногим больше марионетки, которая переложила сложные политические игры на политиков... все же Момока будет выполнять.\n\nНеся груз, который должна нести."

