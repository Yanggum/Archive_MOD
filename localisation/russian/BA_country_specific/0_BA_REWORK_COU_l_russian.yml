## Нанагами
#COU_stabilization_of_the_student_council: "Стабилизация Генерального студенческого совета"
#COU_stabilization_of_the_student_council_desc: "К счастью, хотя и был некоторый шум, Генеральный студенческий совет восстановил стабильность. Однако глава финансов Оки Аой попросила созвать собрание по вопросу, связанному с предыдущим столкновением с SCHALE."

## Оки (OKAY)
COU_impeachment_of_chief_executive: "Отстранение исполняющей обязанности"
COU_impeachment_of_chief_executive_desc: "§g\"Ты не Председатель Генерального студенческого совета, Административный руководитель. Как бы ты ни надела повязку исполняющей обязанности, это не делает тебя ею.\"§!\n\nНанагами Рин, Главный административный руководитель, хотя, возможно, и по вине организации под названием SCHALE, перешла непростительную черту, принижая Председателя Генерального студенческого совета в этом процессе. На этом собрании мы одобрим вотум недоверия и отстраним ее."

## Юраги
COU_strengthening_bonds_tt: "В столичном регионе страны будет добавлено §G1 место строительства§! и §Y1 гражданская фабрика§!."
COU_autonomous_legislation_tt: "Новые советники станут доступны."
COU_export_of_revolution_tt: "Условия решения §YПолитическое вмешательство§! будут смягчены."
COU_resolution_47_of_THIS_tt: "§GСоответствующие страны§! будут исключены из §YОрганизации сотрудничества Кивотоса§!."
COU_war_deterrence_tt: "Будет продвигаться закон, запрещающий войны между странами §YОрганизации сотрудничества Кивотоса§!."
COU_establishment_of_autonomous_system: "Установить систему автономии"
COU_establishment_of_autonomous_system_desc: "Одержав победу в борьбе за власть, мы сможем посадить Юраги Момоку председателем Комитета чрезвычайных мер и получим возможность создать институциональные основы для автономии, которую ранее обещали местным жителям. С помощью этого мы сможем еще больше укрепить нашу базу поддержки."

# Национальные духи Генерального студенческого совета
COU_admin_confusion: "Административный хаос"
COU_admin_confusion_desc: "После Великого Перемещения Генеральный студенческий совет потерял контроль, и этот административный хаос, похоже, продлится еще некоторое время."
COU_cut_tower: "Потеря власти над Башней Святилища"
COU_cut_tower_desc: "С исчезновением Председателя Генерального студенческого совета — которая обладала властью над Башней Святилища через Шкатулку Шиттим — также была утеряна власть над Башней Святилища, которая контролировала Кивотос. Это серьезная угроза для Генерального студенческого совета и для Кивотоса."
COU_Perfidus: "Perfidus"
COU_Perfidus_desc: "В процессе стабилизации правительства после объявления безоговорочной капитуляции Бельгии Департамент обороны во главе с Ширануи Каей предложил набирать кооперативных местных жителей для использования в администрации. Официально их называют коллаборационистами, но обычно — по-латыни — их называют Perfidus, то есть предателями."
COU_Perfidus_tooltip_modf: "£decision_icon_small §YРешение разблокировано§!: Perfidus"
COU_Perfidus_tooltip: "Изменение §Y$COU_Perfidus$§!"
COU_name_of_the_student_council: "Власть Совета"
COU_name_of_the_student_council_desc: "Хотя после Великого Перемещения Генеральный студенческий совет больше не может осуществлять прежний контроль, он по-прежнему 'единственный', кто контролирует и выступает посредником между всеми академиями; даже ослабленный, его общеакадемическая власть и влияние невозможно игнорировать."
COU_industry: "Экономика, управляемая администрацией"
COU_industry_desc: "Из-за природы огромного бюрократического тела, называемого Генеральным студенческим советом, хотя он и был реорганизован в государство, все еще остаются пережитки прошлого. Его экономика не отдана на откуп рынку: она движется бумагами административного комитета."

