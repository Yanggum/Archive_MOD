COU_getout_rin_decision: "Отстранить Рин"
COU_getout_rin_decision_desc: "\n\n\n\n£GFX_COU_decision_picure_COU_norin\n\n\n\n\n\n\n\n\n§L\"Даже после того, как Председатель Совета исчезла, вы намерены по-прежнему слушать мнения людей и делать все по процедуре, угнетенные ее тенью...? Такими популистскими методами ничего не решить. Кивотосом должен руководить сверхчеловек.\"§!\n\n§RИмпичмент§! §YНанагами Рин§! начал обсуждаться с того самого момента, как §YРин§! выступила вперед, чтобы заполнить вакуум, образовавшийся после исчезновения §YПредседателя Генерального студенческого совета§!. Ее правление, основанное на строгом принципиализме, вызвало сильное недовольство у таких людей, как §YШирануи Кая§!, и этот конфликт в конце концов вылился в §Rпоследнюю битву§!: §Rимпичмент§!. §YКая§! начала действия для §Rотстранения§! §YРин§!.\n\nОднако §YНанагами Рин§! тоже не будет сидеть сложа руки. §YРин§! также начала действовать, чтобы §Rисключить Каю из Совета§!, и §Rв конечном итоге эта борьба решится тем, кто первый подчинит себе другого.§!\n\n§RНо§! недостаточно просто сделать это быстро, чтобы победить. Вы должны заручиться §Gподдержкой§! трех высокопоставленных лиц: §YОки Аой§!, §YСумомо§! и §YХайне§! (исключая тех, кто не может присутствовать из-за ранений или других причин). §RЕсли вы не получите поддержку хотя бы одного из этих троих, импичмент провалится.§!\n\nКроме того, вы также должны получить §Yнародную поддержку импичмента§!. Если вы не §G'образуете'§! их всеми способами — прессой и СМИ — и не §Rотстраните§! §YРин§! путем §Gполностью законной и демократической процедуры§!, §Yновый Председатель Совета§! может закончить §Rплохо§!. Как короли во время Французской революции."

COU_rin_getout_kaya: "Превентивное отстранение Каи Рин"
COU_rin_getout_kaya_desc: "§YНанагами Рин§! §Rубеждает§! высокопоставленных лиц в том, что §YКая§! \"провоцирует разделение внутри Совета и участвует в незаконных сделках с местными жителями, а также покрывает и сотрудничает с преступлениями\". §RЕсли Кая не ответит должным образом, она проиграет.§!"
COU_increasing_the_crisis: "Растущие подозрения"
COU_increasing_the_crisis_desc: "В Генеральном студенческом совете чувствуют, что глава обороны в последнее время вела себя подозрительно. Эти подозрения неизбежны: это проблема, с которой нужно столкнуться."
COU_demand_establish_humans_land: "Учредить Офис гарантии прав человека"
COU_demand_establish_humans_land_desc: "Создание Офиса гарантии прав человека может обеспечить наше явное преимущество, но это не то, что обязательно нужно делать."
COU_gets_aoi_first_eco_crisis: "Обольстить Аой - манипулировать финансовым отчетом"
COU_gets_aoi_first_eco_crisis_desc: "Кая теперь может получать отчеты в приоритетном порядке. Если мы хорошо этим воспользуемся, мы сможем попытаться снова обольстить главу финансов... на этот раз с еще более тщательной манипуляцией и обманом."
COU_gets_aoi_second_letsgo: "Обольстить Оки Аой - связь с Кайзер"
COU_gets_aoi_second_letsgo_desc: "Решающим и критическим ударом для главы финансов, которая все больше не доверяет Рин, станет связывание ее с Kaiser Corporation. С помощью соответствующим образом сфальсифицированных документов мы создадим эту связь: даже если нам не удастся перетянуть Аой на сторону Каи, мы, по крайней мере, сможем заставить ее проголосовать за импичмент."
COU_gets_smomo_cou_supports_kaya: "Обольстить Сумомо - течение."
COU_gets_smomo_cou_supports_kaya_desc: "Сумомо обладает должностью и властью, эквивалентными должности главы. Чтобы обольстить ее, достаточно показать ей 'течение'... поток доминирующей 'тенденции'."
COU_dutch_law_letsgo: "Представить Закон Дойчланда"
COU_dutch_law_letsgo_desc: "Для Каи больше нет соперника, более сильного, чем Рин как исполняющая обязанности. При достаточной поддержке Кая сможет 'принудительно' ввести Закон Дойчланда."
COU_SRT_buntang_rabbits_first: "Связаться с отрядом RABBIT"
COU_SRT_buntang_rabbits_first_desc: "Для начала SRT не сможет осуществить саботаж только с отрядом FOX. Первым делом нужно связаться с подчиненными, которые где-то спрятались."
COU_SRT_FOX_attack_good_rins: "Отряд FOX - штурмовать административный комитет"
COU_SRT_FOX_attack_good_rins_desc: "Глубокой ночью отряд FOX штурмует Башню Святилища и административный комитет, чтобы атаковать руководителей, поддерживающих исполняющую обязанности Рин."
COU_SRT_RABBITS_attack_good_rins: "Отряд RABBIT - саботировать транспортную сеть"
COU_SRT_RABBITS_attack_good_rins_desc: "Следуя приказам, отряд RABBIT саботирует транспортную сеть D.U., чтобы ослабить позицию исполняющей обязанности Рин."
COU_attack_the_cou_workers: "Перехватывать отчеты"
COU_attack_the_cou_workers_desc: "Бесчисленные чиновники передают все дела и отчеты Совета сначала исполняющей обязанности Рин. Это равносильно признанию ее легитимности; мы должны помешать этому любыми необходимыми средствами."
COU_use_fascist_militas: "Мобилизовать фашистские ополчения"
COU_use_fascist_militas_desc: "Мятежные фашисты всегда готовы. Мы можем использовать их, чтобы снизить легитимность исполняющей обязанности Рин."
COU_workers_notworks_bruh: "Спровоцировать забастовку"
COU_workers_notworks_bruh_desc: "Лояльные рабочие всегда готовы. Они скажут: \"Мы не будем работать, пока исполняющая обязанности Рин не уйдет в отставку\", и это снизит ее легитимность."
COU_getout_rin_right_now: "Представить предложение об импичменте Рин"
COU_getout_rin_right_now_desc: "Все прошло хорошо. Теперь... теперь... действительно... пришло время выгнать исполняющую обязанности Рин."

## Решения по интеграции Кивотоса
BA_decisions_kivotos_public_bond: "Государственные облигации Кивотоса"
BA_decisions_kivotos_public_bond_desc: "Как официальная центральная администрация Кивотоса, мы имеем полномочия набирать чиновников из разных академий."

BA_decisions_investment_in_student_council: "Инвестиции сотрудничества Кивотоса"
BA_decisions_investment_in_student_council_desc: "Мы подготовили несколько инвестиционных предложений для развития и роста академий, сотрудничающих с центральным правительством Кивотоса."

BA_decisions_goverment_target: "Политическое вмешательство в [FROM.GetName]"
BA_decisions_goverment_target_desc: "У нас есть ответственность направлять государства Кивотоса по правильному пути. Поэтому мы не можем позволить [FROM.GetName] отклоняться."

BA_decisions_defensive_war_target: "Ответить на вторжение [FROM.GetName]"
BA_decisions_defensive_war_target_desc: "После Великого Перемещения мы окружены незнакомыми странами. Чтобы преодолеть эту ситуацию, нам нужна федеральная сплоченность для ответа на внешние вторжения."

BA_decisions_defensive_join_target: "Пригласить [FROM.GetName]"
BA_decisions_defensive_join_target_desc: "Мы должны построить сильную систему альянса, чтобы снова собрать вместе государства Кивотоса, которые сейчас раздроблены и рассеяны."

kivotos_alliance_leader_change_tt: "Теперь §Y[THIS.GetNameWithFlag]§! является страной-лидером §YОрганизации сотрудничества Кивотоса§!."
BA_kivotos_alliance_remove_to_ROOT: "§Y[ROOT.GetNameWithFlag]§! покидает §YОрганизацию сотрудничества Кивотоса§!."
BA_kivotos_alliance_remove_to_FROM: "Исключить §Y[FROM.GetNameWithFlag]§! из §YОрганизации сотрудничества Кивотоса§!."

BA_police_academy_reconnection: "Осуществлять административный порядок"

BA_police_academy_kick: "Отозвать полномочия Полицейской академии"

