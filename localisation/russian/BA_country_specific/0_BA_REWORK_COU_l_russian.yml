## Экономика
COU_focus_after_two_months: "После Великого Перемещения"
COU_focus_after_two_months_desc: "После Великого Перемещения в ноябре 1935 года Генеральный студенческий совет был реорганизован в форму, подобную государству, со способностью самостоятельно принимать решения. В результате он перешел от пассивного руководства — ограниченного подписанием документов — к более активному и прямому планированию, строительству и управлению своей промышленной базой."
COU_focus_look_the_our_economy_fucked: "Анализ провала восстановления"
COU_focus_look_the_our_economy_fucked_desc: "Административный комитет не знал, что голландская экономика в огромной степени зависела от торговли и экспорта. Неужели мы действительно просто этого не знали? Если мы потерпели неудачу, на то, несомненно, были четкие причины."
COU_economy_focus_0: "Перезапустить проект Зёйдерзе"
COU_economy_focus_0_desc: "Проект Зёйдерзе относится к строительству дамбы, завершенному в 1932 году. Однако после Великого Перемещения 1935 года внезапное перемещение D.U. и Башни Святилища привело к катастрофическому результату: повторному затоплению земель, отвоеванных у моря. Отправной точкой для экономического восстановления станет именно новый проект Зёйдерзе."
COU_establishment_of_federal_industrial_committee: "Купить предприятия"
COU_establishment_of_federal_industrial_committee_desc: "Предприятия движимы исключительно логикой денег. Не существует такого понятия, как 'патриотическое' предприятие, и если для стабилизации нашей экономики мы дадим им немного денег, они смогут сделать для нас все что угодно."
COU_tooltip_unlock_dutch_belgium_cons: "Все §Yзаблокированные конструкторы§! станут §Gдоступны§!."
COU_focus_order_highlander: "Сотрудничать с Хайлендер"
COU_focus_order_highlander_desc: ""
COU_focus_mineral_prospecting: "Реактивировать Лимбургский угольный бассейн"
COU_focus_mineral_prospecting_desc: "Шахты, такие как Maurits и Winterslag в Лимбурге, полностью обанкротились во время социального хаоса Великого Перемещения из-за их сильной внешней зависимости в начале 30-х годов. Но мы не можем больше игнорировать эти полезные шахты, которые производили до 500 миллионов тонн угля в год. Все существующие государственные шахты будут выкуплены и снова запущены!"
COU_focus_project_delta: "Проект Дельта"
COU_focus_project_delta_desc: ""
COU_focus_on_industrial_complex: "Восстановить гражданскую промышленность"
COU_focus_on_industrial_complex_desc: ""
COU_focus_restore_cable_internet: "Восстановить кабельную сеть"
COU_focus_restore_cable_internet_desc: ""
COU_focus_apprenticeship_jordaanoproer: "Сдержать Jordaanoproer"
COU_focus_apprenticeship_jordaanoproer_desc: "Jordaanoproer был бунтом безработных в июле 1934 года, оставившим глубокие шрамы в голландском обществе. Как наследники этой реальности и как ответственные за управление экономикой Нижних Земель, мы обязаны его сдержать."
COU_focus_have_with_galopin: "Принять принцип Галопена"
COU_focus_have_with_galopin_desc: "'Патриотичные' бельгийцы — то есть нелояльные — были головной болью: в своем отчаянном сопротивлении, пытаясь сохранить свою промышленность и экономическую структуру, комитет Галопена во главе с Александром Галопеном поднял так называемый принцип Галопена. Однако, если мы воспользуемся их оплошностью и примем этот принцип, активно сотрудничая с ними, мы сможем абсорбировать их потенциал без серьезного ущерба."
COU_focus_absorption_belgian_assets: "Абсорбировать бельгийские активы"
COU_focus_absorption_belgian_assets_desc: ""
COU_focus_plan_de_man: "План Де Мана"
COU_focus_plan_de_man_desc: "Этот план занятости, разработанный Де Маном в 1933 году, представляет собой доктрину планирования Де Мана: создать национализированный сектор, охватывающий организацию кредита и ключевые отрасли, уже де-факто монополизированные, для построения смешанной экономики. Хотя левые — особенно Троцкий — критиковали его от 'плана обмана рабочих' до 'реформированного инструмента консерватизма буржуазной демократии', этот эффективный и действенный план Анри Де Мана наконец нашел подходящий момент и должен быть выполнен."
COU_focus_have_with_hirschfeld: "Привлечь Хиршфельда"
COU_focus_have_with_hirschfeld_desc: "Если местные жители организуют что-то вроде импровизированного комитета для проведения экономического сопротивления, то мы можем сформировать комитет более высокого уровня, чтобы противостоять им. Хиршфельд, молодой директор Министерства труда-торговли-промышленности, защищавший протекционизм, когда свободная торговля была нормой, является многообещающим экономистом среди коллаборационистов Генерального студенческого совета. Мы официально привлечем его для построения нашей собственной экономики."
COU_focus_expansion_of_protectionism: "Расширить протекционизм"
COU_focus_expansion_of_protectionism_desc: "Хиршфельд, как убежденный сторонник протекционизма, просил расширить применение тарифов — которые ранее ограничивались местными государствами — для защиты парализованной промышленности и стимулирования новых мощностей, а также расширить импортные квоты и сроки субсидий."
COU_focus_plan_de_vos_tinbergen: "План Де Фоса–Тинбергена"
COU_focus_plan_de_vos_tinbergen_desc: "Разработанный в 1935 году, но никогда не применявшийся, этот план был совместно написан Хейном Восом и Яном Тинбергеном. В его новой версии с участием Департамента финансов предлагается инвестировать 200 миллионов йен в общественные работы через Общий экономический комитет, координирующий предприятия, рабочих и административный комитет, чтобы трудоустроить 200 000 человек и, за счет мультипликативного эффекта, увеличить покупательную способность рабочего класса и оживить экономику."
COU_focus_currency_unification: "Денежная унификация"
COU_focus_currency_unification_desc: ""
COU_focus_abandon_the_gold_standard: "Частичное возвращение к золотому стандарту"
COU_focus_abandon_the_gold_standard_desc: ""
#COU_focus_modernizing_agriculture: "Модернизация сельского хозяйства"
#COU_focus_modernizing_agriculture_desc: "[Отмененный фокус]"
COU_focus_eco_rework_the_dead_lands: "Обязательная установка насосов в Нижних Землях"
COU_focus_eco_rework_the_dead_lands_desc: "Хотя дамба Зёйдерзе была восстановлена, географические особенности Нижних Земель по-прежнему оставляют мягкую почву и неполный фундамент. Чтобы сломать это и полностью устранить ущерб от наводнений, мы должны сделать обязательной установку насосов."
COU_focus_rework_our_roads: "Обеспечить резервы поездов Хайлендер"
COU_focus_rework_our_roads_desc: ""
COU_focus_attack_northern_france: "Интегрировать север Франции"
COU_focus_attack_northern_france_desc: ""
COU_focus_restore_grebee_peelram_line: "Усилить оборонительную линию Греббе–Пил-Рам"
COU_focus_restore_grebee_peelram_line_desc: ""
