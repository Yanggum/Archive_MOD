## Альянс Кивотоса
COU_kivotos_alliance.1.t: "Решение страны-президента договора: отправка экспедиционных сил"
COU_kivotos_alliance.1.desc: "Одно из государств-членов Организации сотрудничества Кивотоса было атаковано страной, не являющейся членом, и страна-президент договора решила отправить экспедиционные силы для ее защиты.\n\nМы должны решить, участвовать ли в этой отправке."
COU_kivotos_alliance.1.a: "Защитим Кивотос!"
COU_kivotos_alliance.1.b: "Сейчас не время наживать больше врагов."

COU_kivotos_alliance.2.t: "Пакт о ненападении Организации Кивотосского договора"
COU_kivotos_alliance.2.desc: "Страна-президент Организации Кивотосского договора предложила договор, запрещающий войны между странами Организации сотрудничества Кивотоса. Похоже, страна-президент намерена твердо его навязать, и мы должны решить нашу позицию... и покинем ли мы Организацию договора."
COU_kivotos_alliance.2.a: "Подписать договор."
COU_kivotos_alliance.2.b: "Это вмешательство во внутренние дела."

COU_kivotos_alliance.3.t: "Выход из мирного договора [FROM.GetName]"
COU_kivotos_alliance.3.desc: "После недавней смены режима в [FROM.GetName], [FROM.GetName] объявила, что выйдет из мирного договора."
COU_kivotos_alliance.3.a: "Исключить их согласно договору."
COU_kivotos_alliance.3.b: "Сейчас не время наживать больше врагов."

COU_kivotos_alliance.4.t: "Восстановление статуса Полицейской академии"
COU_kivotos_alliance.4.desc: "После того как полномочия по контролю над Башней Святилища были переданы, статус Полицейской академии был временно заморожен. Однако мы ожидали новый Генеральный студенческий совет, и наконец наши полномочия были восстановлены.\n\nТеперь мы можем снова работать как Полицейская академия Кивотоса."
COU_kivotos_alliance.4.a: "Э... это хорошо?"

COU_kivotos_alliance.5.t: "Союз Кивотоса"
COU_kivotos_alliance.5.desc: "Союз Кивотоса — это альянс, объединяющий все академии Кивотоса воедино. Он был создан для стабильности Кивотоса, чтобы студенты всех академий объединились и работали ради этой стабильности.\n\nТеперь мы должны решить, присоединимся ли мы к Союзу Кивотоса или останемся независимыми и будем работать ради стабильности самостоятельно."
COU_kivotos_alliance.5.a: "Присоединимся к Союзу."
COU_kivotos_alliance.5.b: "Нам достаточно быть одним."

COU_kivotos_alliance.6.t: "[FROM.GetName] присоединяется к Союзу"
COU_kivotos_alliance.6.desc: "[FROM.GetName] присоединилась к Союзу Кивотоса."
COU_kivotos_alliance.6.a: "Мы будем работать ради стабильности Кивотоса."

COU_kivotos_alliance.7.t: "[FROM.GetName] отклоняет Союз"
COU_kivotos_alliance.7.desc: "[FROM.GetName] выразила свое решение отклонить его."
COU_kivotos_alliance.7.a: "Понял."

COU_kivotos_alliance.8.t: "[FROM.GetName] запрашивает вступление в Организацию сотрудничества Кивотоса"
COU_kivotos_alliance.8.desc: "[FROM.GetName] выразила намерение вступить в Организацию сотрудничества Кивотоса.\n\n[FROM.GetName] не была государством-членом, но, кажется, из-за изменений в международной обстановке желает присоединиться к нам."
COU_kivotos_alliance.8.a: "Чем больше союзников, тем лучше."
COU_kivotos_alliance.8.b: "Это страна, которой нельзя доверять."

COU_kivotos_alliance.9.t: "Успех: вступление в Организацию сотрудничества Кивотоса"
COU_kivotos_alliance.9.desc: "Усилия нашего правительства по вступлению в Организацию сотрудничества Кивотоса увенчались успехом: [FROM.GetName] одобрила наше вступление."
COU_kivotos_alliance.9.a: "Именно тот результат, которого мы хотели."

COU_kivotos_alliance.10.t: "Провал: вступление в Организацию сотрудничества Кивотоса"
COU_kivotos_alliance.10.desc: "Несмотря на усилия нашего правительства по вступлению в Организацию сотрудничества Кивотоса, страна-президент Организации договора отклонила наше вступление."
COU_kivotos_alliance.10.a: "Посмотрим, как они справятся без нас."

COU_cooperative_treaty_ratification: "Ратификация Мирного договора Кивотоса"
COU_cooperative_treaty_ratification_TT: "§RТвоя страна ратифицирует мирный договор.§!"
COU_cooperative_treaty_ratification_TT_FROM: "§RЭта страна ратифицирует мирный договор.§!"
COU_cooperative_treaty_ratification_TT_JOIN: "§RТвоя страна, ратифицируя мирный договор, не может присоединиться к войне страны, находящейся в состоянии войны с членом Организации сотрудничества.§!"
COU_cooperative_treaty_ratification_TT_JOIN_FROM: "§RТвоя страна находится в состоянии войны с членом Организации сотрудничества Кивотоса, поэтому она не может призвать страну, ратифицировавшую мирный договор.§!"

landmark_COU_tower: "Башня Святилища"
landmark_COU_tower_desc: "Башня Святилища — это здание, расположенное в центре Кивотоса. Это место, где собираются все академии и студенты Кивотоса для проведения собраний и принятия решений. Как знаковое здание, Башня Святилища является символом Кивотоса, и все решения, принимаемые здесь, имеют большое влияние на его будущее."

# Открытие
COU_country_intro_header: "Разрушенная справедливость, падающий порядок"
COU_country_intro_content: "На самом деле Генеральный студенческий совет не был организацией в форме 'государства', как академии. Если сравнивать его с человеческими институтами, Генеральный совет выполнял роль, похожую на роль Лиги Наций; и поэтому долгое время он был справедливостью и порядком в Кивотосе. По крайней мере, до того трагического дня ноября 1935 года.\n\nВеликое Перемещение перевернуло все в Кивотосе. От начала до конца: то, что считалось само собой разумеющимся, стало ложным, а то, что считалось ложным, стало общеизвестным фактом. Чтобы выжить в новом месте, куда мы приземлились, Генеральный совет не мог избежать физических столкновений с государствами Нижних Земель, с которыми мы делили неудобное пространство. Наш мирный подход был проигнорирован жестокой бомбардировкой; и человечество, лишенное своего дома, назвало нас 'захватчиками' и подняло оружие против Кивотоса.\n\nКивотос подавил их подавляющим технологическим и военным превосходством... но проблемы, возникшие в этом процессе, нельзя игнорировать.\n\nБельгия и Нидерланды не продержались и двух месяцев в войне Нижних Земель. Бельгия, с королем, едва спасшимся; и королева Вильгельмина, убитая во время военной операции SRT. Великое Перемещение оставило огромный след не только на Кивотосе, но и на человечестве: глубокую рану, которая никогда не заживет.\n\nБлагоразумные выбрали сотрудничество, чтобы выжить. Организация коллаборационистов, созданная по инициативе Ширануи Каи и Департамента обороны, помогла великой реструктуризации и стабилизации Генерального совета. Они получили новый статус и, при терпимости Совета, выполняют приказы, невзирая на средства и методы.\n\nИ теперь Генеральный совет должен встретить новый рассвет. От наводнения мегаполиса D.U. до сопротивления Национального фронта сопротивления: все вызовы перед нами грубо обнажают явные ошибки Генерального совета и его Председателя, а также горькую реальность Великого Перемещения.\n\nБольше нет времени на колебания. Генеральный совет должен снова править Кивотосом. Он должен установить справедливость. Он должен выпрямить порядок.\n\n§RХотя бы только для того, чтобы искупить все грехи и ошибки, совершенные, не понимая их.§!\n\n§YРазработка - SKSKIe, YurizonoSeia, Imika§!"

