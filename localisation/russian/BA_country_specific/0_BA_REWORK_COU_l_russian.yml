COU_COU_division_of_military: "Истинный суверен Башни Святилища"
COU_COU_division_of_military_desc: "Организация под названием \"SCHALE\", которая, как предполагается, была создана исчезнувшим Председателем Генерального совета, уведомила нас, что она выполнит протокол против нас. С тех пор SCHALE постепенно поглощает наши вооруженные силы, используя власть и легитимность, которыми, по ее утверждениям, обладает.\n\nМы должны расследовать эти действия и реагировать на них."

SHE_COU_division_of_military: "Сопротивление Башни Святилища"
SHE_COU_division_of_military_desc: "Поскольку Генеральный совет вмешивается и отвергает наши протоколы, он начал ограничивать наше влияние на Совет.\n\nПо приказу Председателя Генерального совета мы должны подавить сопротивление Генерального совета и взять контроль."

COU_division_of_military_flag: "Началась борьба за влияние между Генеральным студенческим советом и Ароной!"

