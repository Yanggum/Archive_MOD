COU_focus_treay_of_amsterdam: "Амстердамская декларация"
COU_focus_treay_of_amsterdam_desc: "Пока только автономные округа Кронос и Хайлендер привлекали внимание, местные жители Фландрии и севера Франции — забытые административным комитетом, сосредоточенным на Нижних Землях — долгое время боролись против своего обращения. Мы должны принять их законные требования и взять на себя обязанность развивать и делать процветающим этот регион."

## Военные
COU_shaking_royalty: "Поколебать лояльность"
COU_shaking_royalty_desc: "Самопровозглашенные 'патриоты' повсюду в Генеральном студенческом совете 'до сих пор' считают нас захватчиками, но действительно ли их жалкая лояльность может длиться вечно? Если бросить им кусок вкусного мяса, эти мелкие оппортунисты скоро станут нашими."
COU_give_power_to_degrelle: "Повышение Дегрелля"
COU_give_power_to_degrelle_desc: "Лучший способ показать, что игра изменилась, — показать хороший 'пример'. Сделав лояльного нам Леона Дегрелля примером и предоставив ему больше власти и привилегий, мы сможем увеличить число коллаборационистов и позаботиться о гармонии с местными жителями."
COU_keep_our_deals: "Продолжить сделку"
COU_keep_our_deals_desc: ""
COU_focus_buy_their_weapon: "Незаконная торговля оружием"
COU_focus_buy_their_weapon_desc: ""
COU_reduction_of_administrative_committee_authority: "Нейтрализовать свободный офицерский корпус"
COU_reduction_of_administrative_committee_authority_desc: "После войны в Нижних Землях офицеры вражеских стран, оставшиеся на материке, создали организацию под названием Свободный офицерский корпус и наносили нам ущерб, но мы больше не можем терпеть этот ущерб. Мы должны посеять раздор среди них и разрушить их, полностью нейтрализовав."

