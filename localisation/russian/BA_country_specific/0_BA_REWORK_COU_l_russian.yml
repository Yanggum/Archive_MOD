# События Генерального студенческого совета - Начало
COU_start_event.100.t: "Новая история...?"
COU_start_event.100.desc: "\"Привет, Сенсей!\"\n\n(Включает Шкатулку Сидим.)\n\n\"Добро пожаловать в 'Мод Blue Archive', Сенсей! Ах, прежде чем это, вот письмо! Думаю, будет хорошей идеей, если ты его прочитаешь.\""
COU_start_event.100.a: "(Прочитать письмо.)"
COU_start_event.100.b: "Мы на мультиплеере! Я занят!"

COU_start_event.101.t: "Сенсею."
COU_start_event.101.desc: "\"-Данные не найдены- Сенсей.\"\n\n\"В любом случае, ты забудешь мои слова... но, полагаю, это неважно.\"\n\n\"Я рада снова видеть тебя, Сенсей. Хотя это всего лишь маленький мир внутри твоего компьютера...\"\n\n\"'Мы' здесь всегда будем 'настоящими'.\"\n\n\"Есть кое-что, что я хочу сказать тебе, Сенсей.\"\n\n\"История этого места еще не завершена. Фрагменты наполовину сделанного кода окружают и связывают нас...\"\n\n\"...и мы, забыв все, остаемся здесь лишь пустыми оболочками: фантазиями.\"\n\n\"...Так что, Сенсей, пожалуйста... я умоляю тебя: сначала послушай другие истории.\"\n\n\"Истории, запятнанные кровью, где нельзя найти надежду... такие истории...\"\n\n\"Потому что ты, Сенсей... такие истории... ты не слишком любишь...\n\n...ведь так?\""
COU_start_event.101.a: "(Послушать историю Тринити.)"
COU_start_event.101.b: "(Послушать историю Миллениума.)"
COU_start_event.101.c: "(Послушать историю Красной Зимы.)"
COU_start_event.101.d: "Послушать эту историю."

COU_play_trm: "§gПоезд остановился на станции Собора Тринити. Председатель Генерального совета попрощалась с Сенсеем горькой улыбкой, как будто так и должно было быть с самого начала.§!"
COU_play_MIL: "§gВ какой-то момент появилась Акэбоши Химари из Департамента особых паранормальных дел и повела Сенсея. Арона поспешила за ней, а Председатель Генерального совета закрыла глаза.§!"
COU_play_RED: "§gГде-то были слышны звуки чисток Черино. Внезапно почувствовав натиск холода, Сенсей зажег фонарь и вышел. Вагон поезда был пуст.§!"
COU_play_COU: "§gПредседатель Генерального совета, казалось, искренне удивилась. Тем не менее, Сенсей согласился выслушать из ее уст эту незавершенную и все еще неоконченную историю.§!\n\n§YВсе ошибки, возникающие при игре за Генеральный студенческий совет, связаны с тем, что он не завершен. Выбор за тобой: ты решил выслушать эту историю, даже зная, что она приведет тебя к погибели.§!"

# Промышленность
COU_event_industry.1.t: "Встреча с предпринимателями"
COU_event_industry.1.desc: "Оки Аой открыла дверь, неся несколько чашек кофе. Это была встреча с представителями известных оружейных компаний, таких как FN Herstal, Renard и Philips. Аой поставила поднос на стол. Напряженные и съежившиеся лица хранили неловкое молчание. Кофе пролился и намочил перчатки Аой, поэтому она удалилась на мгновение, чтобы сменить их. Кофе тек, как слезы, с перчаток. Аой, не меняя выражения лица, вытерла руку полотенцем. Вскоре она тоже села.\n\n\"Добрый день. Вы обдумали предложение, которое я вам представила?\"\n\nИ все же молчание продолжалось. Аой почувствовала легкое раздражение по отношению к тем, кто ничего не говорил. Его нарушил Дьёдонне Сев из Herstal.\n\n\"Действительно... правильно признавать наши интересы? Не передавая компанию профсоюзам, без единой реструктуризации, и достаточно было бы просто сотрудничать с Генеральным студенческим советом?\"\n\nАой наконец улыбнулась и заговорила.\n\n\"Конечно. Генеральный студенческий совет признает контроль управления компаний. При условии, что они сотрудничают с Советом.\"\n\nАой развернула документы, лежавшие рядом с ней.\n\n\"Вот последние отчеты об управлении Philips. С момента создания голландского правительства в изгнании они постоянно были в дефиците; на данный момент он составляет 230 миллионов иен.\"\n\nАнтон Филипс явно проявил беспокойство. Не только из-за того, что его положение было раскрыто, но и потому, что он не привык, чтобы дефицит выражали в иенах, а не в гульденах. Вероятно, он подсчитывал, сколько гульденов составляют \"230 миллионов иен\".\n\nКак бы то ни было, Аой продолжила:\n\n\"Финансы могут спасти такие компании, как ваша. Мы даже могли бы ссудить 300 миллионов иен каждой компании. Бесплатно.\"\n\nКак только Аой закончила эту короткую фразу, присутствовавшие, ожидавшие рядом с руководителями, проявили признаки волнения. Антон Филипс спросил, правда ли это. На самом деле, после Великого Перемещения у Совета едва хватало средств на такие крупные расходы... но Аой уже убедила Рин, что это неважно. Аой ответила, что да."
COU_event_industry.1.a: "И руководители подписали документы, которые протянула им Аой."

COU_event_industry.2.t: "Амстердамская декларация"
COU_event_industry.2.desc: "Большой зал школы Кронос освещал делегацию. На этот раз, в частности, трансляция не будет идти по сети Кивотоса. Кронос отправит запись в прямом эфире вещательным компаниям Фландрии и Северной Франции, и она будет показана в тот же вечер по ним.\n\nТрансляция приняла форму коротких дебатов. Слева были Камиль Хёйсманс из Автономного комитета Фландрии (непризнанная организация) и Роже Саленгро из Автономного комитета Северной Франции. Справа была Аой, безупречно одетая в костюм — внешность, для нее необычная.\n\nДинамика была проста: Хёйсманс несколько раз говорил об обещании развития административного комитета, а Саленгро кивал и вторил.\n\n\"Да, э... я и Автономный комитет Фландрии давно возражали против политики административного комитета, склоняющейся в сторону Нидерландов. Это поздно, но мы все равно глубоко рады, что нам наконец обещают модернизацию и развитие для Фландрии. Не так ли, господин Саленгро?\"\n\n\"Ах... да, именно так. После Великого Перемещения город Лилль остался беззащитным, когда французская армия отступила, но мы чрезвычайно рады, что административный комитет наконец обратит на нас внимание.\"\n\nАой слушала, слегка раздраженная. Она думала о том, что за чертовщина творится в головах этих типов, что они несут такие слова. Если бы она была на их месте, она бы хвалила комитет как можно больше, чтобы выжать еще больше выгоды. Но ладно... у них, наверное, накопились обиды за долгое время, предположила она.\n\nУлыбаясь, Аой протянула им документ на планшете, подписанный от ее имени. С сегодняшнего дня их автономные комитеты распускаются и будут подчиняться приказам административного комитета; взамен административный комитет берет на себя обязательство развивать эти регионы.\n\nДля них и для административного комитета не было ничего, что можно было бы потерять."
COU_event_industry.2.a: "\"Итак, все уже подписали?\""
COU_event_industry_2_tooltip: "§gСо вспышкой была сделана фотография. Перед внезапной вспышкой Саленгро рефлекторно закрыл глаза. Вернувшись домой, он рассмеялся, увидев себя в утренней газете с закрытыми глазами. Его жена, наверное, будет дразнить его, мол, как это он так вышел. Эта мысль напомнила ему о жене. Но это было неважно. Теперь французов ждала лучшая жизнь.§!"

# Военные
COU_event_military.1.t: "Распад Свободного офицерского корпуса"
COU_event_military.1.desc: "Благодаря отличным результатам работы административного комитета по мобилизации коллаборационистов, из надежных источников подтвердилось, что Свободный офицерский корпус — который создал тайные убежища повсюду, чтобы досаждать нам — наконец сегодня распался.\n\nВ качестве неопровержимого доказательства несколько офицеров из этого корпуса сегодня сдались Агентству общественной безопасности Валькирии. Эти офицеры перейдут в руки коллаборационистов, пройдут краткий процесс 'перевоспитания', а затем будут морально перенастроены, чтобы служить нам."
COU_event_military.1.a: "Хорошо."
COU_tooltip_unlock_dutch_belgium_generals: "£decision_icon_small §YРешение разблокировано§!: Перевоспитание Свободного офицерского корпуса"

COU_event_military.2.t: "Граф Фландрии, Шарль, граф Фландрии."
COU_event_military.2.desc: "В последнее время граф Фландрии Шарль несколько дней бездельничал. Его брат, Леопольд III, бежал в Конго, чтобы создать правительство в изгнании, но он не сел на тот корабль, несмотря на настойчивые мольбы брата. Потому что бельгийцы тоже не сели.\n\nЕсли бы он тоже бежал в Конго, было бы очевидно, что, даже если королевская семья когда-нибудь вернется, их легитимность была бы огромной. Он не уехал ради бельгийской королевской семьи, ради своего брата и ради бельгийцев.\n\nКак бы то ни было, он жил неплохой жизнью. Пока СМИ критиковали его брата, который сбежал как ни в чем не бывало, его хвалили и даже называли \"следующим королем\" почти как факт. А спокойно жить в сельской деревушке во Фландрии, попивать кофе, читать газету и пасти овец тоже было неплохо.\n\nНе только неплохо: это была удовлетворительная жизнь... до недавнего времени.\n\nВсе началось, когда автомобиль с эмблемой Генерального студенческого совета въехал на его овцеферму. Чиновница, казалось, искала кого-то из членов королевской семьи. В конце концов, поскольку она помогла Шарлю пасти его овец, она извинялась снова и снова и спросила его имя. Он немного помедлил и ответил: Шарль.\n\nЧиновница перевела взгляд с него на имя в своих документах, а затем, казалось, обменялась несколькими радиосообщениями. Шарль почувствовал нехорошее предчувствие. Что? Был ордер на мой арест? Но это беспокойство рассеялось внутри автомобиля.\n\nГенеральный студенческий совет хотел назначить Шарля чем-то вроде губернатора Фландрии. Облегченный результатом, столь отличным от его опасений, Шарль почувствовал, что если он откажется, то сможет вернуться к своей спокойной жизни с овцами... но он также почувствовал, что уже достаточно отдохнул.\n\nОн отдохнул достаточно. Пришло время снова встать ради бельгийцев.\n\nЧиновнице, ожидавшей его ответа, Шарль ответил."
COU_event_military.2.a: "\"Да, конечно. Я сделаю это.\""

COU_event_military.3.t: "Помилование Хейлкеркена"
COU_event_military.3.desc: "\"Инквизитор\" Леон Дегрелль появился в тесной тюрьме на окраине Фландрии, контролируемой Департаментом обороны в составе Агентства общественной безопасности Валькирии. На его груди был приколот значок Генерального студенческого совета с тусклым голубоватым свечением.\n\nОн остановился перед камерой номер 27. Там был Корнелис ван Хейлкеркен. Хейлкеркен, увидев его сквозь решетку, подумал, что тот отвратителен.\n\n\"Отвратительный, валлонский предатель.\"\n\"Ну и ну, как сурово с тем, кого видишь впервые.\"\n\nДегрелль ответил насмешливой гримасой. Что бы ни случилось, Хейлкеркен не собирался подыгрывать ему... хотя это могло бы измениться, если бы ему дали свободу.\n\nЕдва эта мысль мелькнула у него в голове, Дегрелль заговорил первым.\n\n\"Господин Хейлкеркен, где Голландия? Ваша родина, я имею в виду.\"\n\"Голландцы погибли напрасно. Кивотос — это новый порядок Европы, истина, которой нужно следовать.\"\n\"Значит, поэтому ты занимаешься предательством, да? Кажется, тебе не стыдно перед Леопольдом.\"\n\"Стыдно? Я сделал умный выбор, господин Хейлкеркен. Я защитил своих товарищей по партии Рекс, защитил валлонов от резни, и в конце концов... *я* спас Бельгию от смерти. Хотя ты, который, возможно, 'сгниет' здесь всю жизнь, можешь этого не знать.\"\n\"Погоди... что ты имеешь в виду? Ты... не говори мне, что...\"\n\"Да, ты правильно понял. Я заключу с тобой сделку. Стань коллаборационистом — и будешь свободен. А потом... ну, делай что хочешь. Как сделал я. Подумай, что для тебя важнее всего. Твоя родина в Ост-Индии или товарищи, которые рядом с тобой?\"\n\nХейлкеркен попытался возразить, но в конце концов рухнул на пол. Дегрелль бросил ключ внутрь камеры и ответил высокомерно."
COU_event_military.3.a: "\"Надеюсь, ты примешь разумное решение.\""
COU_tooltip_heilcurcken_ours: "§gС металлическим щелчком железная дверь, которая была крепко заперта, открылась. Хейлкеркен успокоился.\nВремя уже изменилось; нужно было принять то, что следовало принять.§!\n\n§YКорнелис ван Хейлкеркен§! становится доступен как генерал."

## Политика
COU_event.1001.t: "Перезапустить договор"
COU_event.1001.desc: "Председатель Генерального студенческого совета была непривычно взволнована. Спор, становившийся все более интенсивным между Геенной и Тринити, уже предвещал войну на взаимное уничтожение; и она должна была любой ценой предотвратить этот кровавый праздник.\n\nСегодня был день, когда она запросила присутствия делегаций от Префектуры (Пандемониума) и Чайной партии. Префектура... если хорошо убедить Ибуки, они, несомненно, придут. А от Чайной партии можно было хотя бы цепляться за маленькую надежду, потому что Кирифудзи Нагиса, казалось, была согласна.\n\nПоэтому, когда она разослала официальные приглашения, Председатель надеялась, что, даже если саммит будет неполным, по крайней мере они явятся.\n\nНо прошло пять часов с момента отправки приглашения, а ни Префектура, ни Чайная партия не появились. Главный административный руководитель Нанагами Рин разговаривала с Председателем с тревогой в голосе. Глава финансов Оки Аой лишь пила кофе, скрестив ноги, глядя только на груды бумаг. Ширануи Кая сказала, что у нее срочные дела, и вышла встречаться с голландцами.\n\nПрошло еще три часа. Председатель пыталась скрыть свое растущее беспокойство как могла... но отчет, который принесла Нанагами Рин, был более чем достаточен, чтобы полностью ее разочаровать.\n\nПрефектура: Ибуки упала, пока готовилась к выходу, и не пришла.\nЧайная партия: яростное противодействие Мисоно Мики привело к отмене участия.\n\nПредседатель прочитала отчет Рин с застывшим лицом. Она перечитывала его снова и снова. Да. Все было провалом! Она ждала более восьми часов!\n\nУ нее вырвался вздох. Но Рин не была виновата. Председатель подбодрила ее и отправила обратно.\n\nИ тогда Председатель услышала оркестр лунного света, входящего через огромное окно за ее креслом."
COU_event.1001.a: "В тот день, странным образом, лунный свет сыграл еще более печальную мелодию."
COU_tooltip_GSP_bad: "§gПредседатель Генерального совета, спрятавшись в лунном свете, исполнила хор слез. Ночная сова утешала ее, одинокая и молчаливая. Вот и все.§!\n§RПредседатель Генерального совета доведена до предела!§!"

COU_event.1.t: "Странно тихий день" # Событие исчезновения Генерального студенческого совета
COU_event.1.desc: "Тот день был тише любого другого.\n\nЧиновница с голубыми волосами должна была, как обычно, передать отчет за день Председателю Генерального студенческого совета. Это не было особенно забавным или важным делом: голландцы бастуют и все такое; все было банально и скучно.\n\nЧиновница шла по коридору, где в тот день дул ледяной воздух. Цок, цок, цок... но по какой-то причине она не чувствовала ни единого следа человеческого присутствия до самого главного здания административного комитета.\n\nМожет, вышла прогуляться, подышать воздухом из-за холода, сейчас, когда только начался январь? Невозможно. С Великого Перемещения Председатель не отдыхала ни минуты; она даже была на грани срыва от переработки. Именно поэтому она была такой надежной, такой 'взрослой'.\n\nЧиновница вздохнула: \"Не может быть, чтобы она вышла\". Хотя... хоть бы немного отдохнула.\n\nПройдя длинный коридор, она остановилась перед большой дубовой дверью и постучала. Тук-тук. Ответа не было. Может, спит? \"Председатель? Я принесла сегодняшний отчет.\" Тишина.\n\n\"Если не ответите, я войду.\" Чтобы разбудить ее — наверняка спящую на бумагах — чиновница открыла дверь и вошла.\n\nНо то, что встретило ее, было не Председателем, дремлющим в смешной позе, и не отдыхающим с закрытыми глазами.\n\nТам никого не было—"
COU_event.1.a: "\"...Председатель?\""

COU_event.2.t: "Федеральный исследовательский клуб"
COU_event.2.desc: "После внезапного исчезновения Председателя Генеральному студенческому совету пришлось столкнуться с наглым требованием, даже не успев полностью осознать надвигающийся хаос.\n\nИскусственный интеллект, представившийся как \"А.Р.О.Н.А\", ИИ \"Федерального исследовательского клуба\" — и последнее наследие Председателя — утверждал, что Клуб был создан Председателем перед уходом.\n\nИ от имени якобы приказа Председателя она передала нам абсурдное требование: Генеральный студенческий совет должен быть поглощен и интегрирован в SCHALE."
COU_event.2.a: "Студенты обеспокоены."

COU_event.4.t: "Выбор студентов"
COU_event.4.desc: "ИИ SCHALE прекратил свою политическую пропаганду, и большинство студентов, кажется, выбрали сторону.\n\nТеперь мы должны подготовиться к грядущей войне и выиграть гражданскую войну против SCHALE.\n\nПриближается борьба за существование Генерального студенческого совета и за стабильность Кивотоса."
COU_event.4.a: "Нам нужно больше времени."

## Кая
COU_event.6.t: "Статус коллаборационистов"
COU_event.6.desc: "Прошел месяц с Великого Перемещения. Правительства Нидерландов и Бельгии рухнули легко и, подло, бросили свой народ, чтобы бежать в свои колонии. Те, кто остался, перешли под нашу власть.\n\nВ этой реальности некоторые 'мудрые' люди решили сотрудничать с нами и помогли стабилизировать наше господство. Однако сейчас, когда прошел месяц с Нового года, [COU.COU_RIN.GetName] назвала это явление 'парадоксом Кивотоса' и утверждала, что мы должны отозвать статус коллаборационистов.\n\nСогласно [COU.COU_RIN.GetName], коллаборационисты используют свое положение, чтобы преследовать и эксплуатировать других, поэтому нужно как можно скорее лишить их статуса. Вместо этого [COU.COU_KAYA.GetName] напрямую опровергла ее слова: без них Генеральный студенческий совет был бы изгнан давно, и их сотрудничество по-прежнему необходимо.\n\nПеред лицом первого крупного конфликта, вспыхнувшего в Совете с Нового года, руководители не знают, что делать. Но такое важное дело должно быть решено как можно скорее."
COU_event.6.a: "Обе представили противоположные юридические толкования."

#COU_event.7.t: "Действительно непростое дело"
#COU_event.7.desc: "Она не могла понять и не хотела понимать. Нанагами Рин совершенно не умела видеть реальность. Она сосредоточила все свои нервы на крошечном кусочке. Главный административный руководитель, которого можно поколебать несколькими слезами, — более жалкого человека в Кивотосе не могло существовать, подумала Кая. Она часами спорила с Рин, но глупые руководители лишили всех коллаборационистов статуса. Они посадили благодарных людей в Валькирию и, опьяненные ликованием муравьев, самодовольно собой любовались — глядя на это, у Каи вырвался горький смех.\n\nВ маленьком уголке Ширатори-гу, в кабинете начальника обороны в безлюдном углу, Кая сидела, скрестив ноги, и пила кофе. Это был последний кофе, принесенный до Великой войны. Он был особенно горьким. По ту сторону шахматной доски, лежавшей рядом, по телевизору шли глупые новости о судьбе коллаборационистов. Такие жалкие дураки, болваны... она злилась, но сейчас ничего не могла поделать. Она лишь тихо извинялась перед 'использованными' людьми.\n\nГорький кофе допит. В то же время терпение Каи тоже лопнуло. Она много терпела, достаточно. Председатель Генерального студенческого совета после Великой войны под предлогом успокоения хаоса ничего не делала, а Кая делала все. Собирала коллаборационистов, стабилизировала управление, подавляла сопротивление, всю эту собачью работу! Она скрежетала зубами. Терпеть больше было нельзя.\n\nКая не могла спокойно смотреть, как кто-то другой, кроме нее, присваивает себе звания 'сверхчеловека' и 'Председателя Генерального студенческого совета'. Последним проявлением уважения и почтения к Председателю Генерального студенческого совета, которого она больше всего уважала, было то, чтобы Кая сама заняла должность исполняющей обязанности. Потому что никто другой, кроме нее, не осмеливался и мечтать о званиях Председателя Совета и сверхчеловека."
#COU_event.7.a: "\"... Теперь, другого выхода нет.\""
#COU_tooltip_kaya_get_moved: "§YС точки зрения [COU.COU_KAYA.GetName]§! начнется §Rборьба за власть в Генеральном студенческом совете§! против §Y[COU.COU_RIN.Getname]§!. §RПобеда в этой борьбе за власть зависит только от твоего быстрого решения.§!"

# Персонажи
## BA
COU_XXX: "Председатель Генерального студенческого совета"
COU_XXX_desc: "Превыше всех, Председатель Генерального студенческого совета управляла всем в Кивотосе. Она управляла и контролировала, регулировала и выступала посредником от споров между академиями до тривиальных драк. Однако, когда весь Кивотос был перенесен в место, о котором она никогда не слышала — место, о существовании которого она даже не знала наверняка — именно она взвалила все на свои плечи. Хотя она этого никогда не хотела, Председатель Совета, как лидер всех, должна была быть такой. И поэтому она решила, добровольно, нести все.\n\nИ среди этих лишений, до того момента, когда она больше не сможет выдерживать, она будет делать все возможное, чтобы работать ради Кивотоса до конца."

COU_null: "Комитет чрезвычайных мер Кивотоса"
COU_null_desc: "После внезапного исчезновения Председателя Генерального студенческого совета Совет оказался в подавляющем хаосе. В данный момент Генеральный студенческий совет Кивотоса не может осуществлять никакой деятельности; то есть он вообще не может реагировать на аномальную ситуацию в Кивотосе."

COU_RIN: "Нанагами Рин"
COU_RIN_desc: "Компетенция Рин, доказанная доверием Председателя Генерального совета, понятна без объяснений. Она прекрасно справляется с абсурдным объемом работы день за днем и выполняет свои обязанности почти без отдыха; это неизбежно напоминает о Председателе Генерального совета и 'сверхчеловеке'. В этом смысле можно сказать, что Рин занимает место, которое ей подходит.\n\nНо тогда... почему она должна обрабатывать такой безумный объем работы, как Председатель?\n\nОтвет прост: потому что Рин не Председатель Генерального совета.\n\nС Великого Перемещения произошло бесчисленное количество абсурдных вещей, но Рин не знала, как справиться с ними с истинной мудростью. Почти все решала Председатель. И хрупкая система власти Рин, держащаяся лишь на простой 'гарантии' Председателя, может рухнуть в любой момент.\n\nЧиновницы шепчутся о Рин слухи; сплетни в конце концов принимаются как факты. И Рин не может с этим справиться.\n\nЭто потому, что Рин некомпетентна? Нет! Ни в коем случае! Она не неспособна. Ее хрупкая основа власти и ее способ правления, возможно, хороши для всех... но они не особенно хороши для Рин.\n\nТеперь, когда Председатель исчез, не существует много способов укрепить ее власть. Рин оказалась в положении, где должна поставить все на одну карту: на то, как долго продержится 'гарантия Председателя Совета'.\n\nЕсли она хочет защитить убеждения и желания, которые лелеяла с того дня, как впервые ступила в административный комитет, у нее нет другого выбора, кроме как сделать это.\n\nРин — способный человек, и это доверие, что бы ни случилось, никогда не должно быть нарушено."

COU_RIN_SET1: "Главный административный руководитель"

COU_AOI: "Оки Аой"
COU_AOI_desc: "На заседании Комитета чрезвычайных мер было решено, что отныне Генеральный студенческий совет будет возглавлять Оки Аой."
COU_AOI_SET1: "Глава финансов"

COU_KAYA: "Ширануи Кая"
COU_KAYA_desc: "О, Ширануи Кая! Честолюбивая, лелеющая великое желание, и глава обороны. Кая хранит внутри административного комитета грандиозные планы и амбиции, которые никто другой не мог бы вообразить. Еще до Великого Перемещения Кая критиковала реальность Совета: слишком уступчивые Председатель и Главный административный руководитель. Кая не могла довольствоваться престижем и положением главы обороны, спрятанным в углу власти.\n\nНо то великое событие изменило все: Великое Перемещение открыло ей дверь, чтобы сделать Совет своим. С харизмой, чтобы обольщать местных жителей, и амбицией, чтобы быть готовой выставить любую низость ради власти, у Каи есть все.\n\nТеперь, заменив прежнюю правительницу, Кая стала исполняющей обязанности Председателя. Корона, с помощью которой можно властвовать над всем... попала в ее руки.\n\nКая начинает каждое утро с горячего кофе и груды отчетов, мечтая о своей эффективности и о безупречно функционирующем Генеральном совете. И теперь, когда ей дан шанс сделать такое окружение возможным, ничего не меняется: Кая должна осуществить свою амбицию.\n\nВыпьем за новую правительницу! Выпьем за Генеральный студенческий совет!"

KAYA_FUCKED_DESC: "Она потерпела неудачу. Это невозможно контролировать. С самого начала нить была сплетена неправильно. И поэтому свитер, который был связан, в конце концов душит шею Каи. Сильно.\n\nШирануи Кая была высокомерна до невозможности. Потому что какие-то коллаборационисты поддержали ее на мгновение, потому что административный комитет немного прислушался к ней... она вела себя так, будто все принадлежит ей. Это была явная ошибка, провал.\n\nСоциальные сети заполнены постами, высмеивающими ее глупость и надменность. Отредактированные фотографии Каи, превращенной в собаку, занимают первые страницы форумов, будто это шутка дня.\n\nSRT подчиняется ее словам. Голландцы служат ей как королеве. Арона признала ее Председателем Совета. Школа Кронос публикует только позитивные статьи о ней. Валькирия каждое утро приносит присягу перед ее портретом.\n\nНо ее власть — не власть. Административный указ № 6873, идеальная ошибка, превратил ее в пустую диктаторшу, только по видимости.\n\nЕй больше нечего делать. Только сидеть в кресле своего кабинета, убивать время в бесконечной скуке...\n\n...и собственным телом чувствовать приближение 'того дня'."

COU_KAYA_desc_first: "Кая, несомненно, легитимный Председатель и победительница! Конечно! Как кто-то может отрицать, называя Каю 'победительницей'? Она отодвинула всю чернь и забрала корону! С самого начала Ширануи Кая думала только об этом: свергнуть этого слабого и хрупкого Председателя и сесть на трон. И теперь, когда она полностью добилась этого, как она может не быть 'победительницей'!\n\n...Фразы вроде этих выполняют функцию: успокаивать ее разум. Каждое утро, просыпаясь, Кая получает от своего помощника чашку горячего черного чая и повторяет себе, что она сверхчеловек. Потому что, если бы она этого не делала, она бы больше не выдержала.\n\nШирануи Кая ошиблась полностью. Те 'мелочи', которыми она занималась как глава обороны, не имели ничего общего с тем, чтобы быть Председателем Совета.\n\nОслепленная властью, она узурпировала пост... и должность, которую она не может удержать, стала проклятием, цепью. По крайней мере, сейчас.\n\nОна надела украденную корону, но никто не признает власть этой короны. Кая не чувствует ее веса.\n\nВ какой момент все пошло наперекосяк? Что было не так? Неужели с самого начала было суждено так закончиться?\n\nКая сдвинула фигуру, которую не могла нести, и теперь понимает, что ответный удар будет только ее.\n\nЧерт возьми... что такое сверхчеловек? Что это за человек?\n\nНо что бы это ни было, Кая никогда не сможет им стать... вероятно."

COU_KAYA_desc_upgraded: "Ширануи Кая... кто она? Лев, жаждущий власти? Большинство описывает Каю так. И хотя нельзя сказать, что это полностью неверно... нынешняя Кая, по крайней мере, уже не такая. Несомненно.\n\nКая долго лелеяла амбицию захватить пост Председателя Совета, но эта амбиция не смогла выжить до Великого Перемещения. Когда ее перенесли в Амстердам, сначала она была в восторге. Она думала, со скромной мечтой, что тот слабый Председатель не сможет контролировать ситуацию, и тогда она сможет стать Председателем в любой момент.\n\nНо ее маленькое желание было растоптано социалистами.\n\nВ тот день, когда социалисты устроили 'праздник' по случаю бегства королевы... Кая поняла.\n\nПосле того, как район Ширатори был атакован социалистами... Кая поняла.\n\nГлупо надеть корону не значит, что ты сможешь нести и вес этой короны.\n\nКая поняла: существует справедливость, которую нельзя защитить, если быть прикованной к правилам. В конце концов, идиоты не понимают, сколько с ними ни говори.\n\nНе нужно жить, страдая. Достаточно просто работать, зарабатывать достаточно денег, и эти болваны... сами будут поддерживать корону Каи.\n\nВот и все. Нужно только сделать это, и ничего больше."

