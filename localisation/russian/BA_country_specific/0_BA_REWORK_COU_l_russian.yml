## Возобновление работ в Зёйдерзе
COU_restart_the_zuiderzee_works: "Работы в Зёйдерзе"
COU_restart_the_zuiderzee_works_desc: "Это колоссальное инженерно-строительное сооружение, завершенное в 1932 году бывшим голландским правительством, должно продолжаться независимо от того, кто его выполняет. Из-за особенностей Нижних Земель требуется больше земли и твердой почвы, и возобновление проекта будет осуществляться в еще большем масштабе."
COMPLETED_LEV1: "§YФаза 1§! завершена."
COMPLETED_LEV2: "§YФаза 2§! завершена."
COMPLETED_LEV3: "§YФаза 3§! завершена."
COU_restore_our_fucked_lands: "Фаза 1: Восстановить дамбу Зёйдерзе"
COU_restore_our_fucked_lands_desc: "Чтобы вернуть полностью затопленную землю, мы сначала возведем огромные временные стены вокруг районов, подлежащих восстановлению; затем откачаем воду насосами и, наконец, снова превратим Зёйдерзе в Эйсселмер. Конечно... некоторые сооружения могут оказаться 'разрушенными' в процессе."
COU_restore_our_lost_factories: "Фаза 2: Срочный ремонт затопленных фабрик"
COU_construct_sea_dam: "Фаза 3: Строительство морской дамбы"
COU_extra_lands: "Полный пересмотр городского плана"
COU_restore_flevoland_province: "Восстановить провинцию Флеволанд"
COU_restore_flevoland_province_desc: "Во время Великого Перемещения провинция Флеволанд была затоплена и буквально 'исчезла', когда дамба Зёйдерзе была разрушена. Теперь, когда мы ее восстановили, Флеволанд снова появляется над уровнем моря, и мы должны восстановить ее как положено."
COU_use_dam_for_energy: "Максимизировать производство энергии"
COU_use_dam_for_energy_desc: "Зёйдерзе, которое однажды уже стало морем после наводнения 1916 года, до сих пор демонстрирует подавляющую силу: если восстановленная дамба рухнет, оно может снова стать морем. Мы используем этот факт, чтобы максимизировать производство энергии с помощью дамбы и плотины, построенных на фазе 3."
COU_custom_cost_pol25civ3: "£pol_power §Y25§! £civ_factory §Y2§!"
COU_custom_cost_pol25civ3_blocked: "£pol_power §R25§! £civ_factory §R2§!"

## Развитие Фландрии и Северной Франции
COU_industry_of_flandern_northern_france: "Амстердамская декларация"
COU_industry_of_flandern_northern_france_desc: "Административный комитет официально пообещал Фландрии и Северной Франции, что отныне будет выделять больше бюджета, чем раньше. Вся накопленная обида исчезнет с нашими несколькими выплатами!"

## Общие решения
COU_decision_the_student_council: "Миссии"
#COU_decision_the_student_council_desc: "£GFX_COU_decision_gsc\n\n\n\n\n\n§YГенеральный студенческий совет§! управлял всем Кивотосом с §YБашней Святилища§! в центре. Этот Совет состоит из §Yадминистративного комитета§!, который §gофициально§! имеет §Y11 департаментов§! для облегчения управления и рассредоточения власти, усиливая контроль Совета. Некоторые §gвременные зависимые структуры§!, созданные после §YВеликого Перемещения§!, §Rофициально не учитываются§!.\n\nОбычно дела внутри Совета представляются §YФинансами, Транспортом, Координацией, Обороной и Спортом§! — этими §g5§! департаментами — которые конкурируют за приоритет своих предложений. Для активации вопроса требуется §YБилет повестки§! £schedule_ticket_texticon. §YБилеты повестки§! £schedule_ticket_texticon восполняются §gкаждые 3 месяца§! в §gколичестве 1§!. Не восполняются выше §g6§!.\n\nВ настоящее время у вас [?global.cou_schedule_point|+0]/6 §YБилетов повестки§! £schedule_ticket_texticon.\n"
COU_decision_the_student_council_desc: "£GFX_action_point_texticon §7Очки действия§! (AP) — это своего рода валюта переговоров, используемая для убеждения и покупки воли внутри административного комитета. Они получаются при выполнении различных §gпериодических требований§!, которые комитет выдвигает, называемых §Yмиссиями§!.\n\nС помощью £GFX_action_point_texticon §7AP§! вы сможете влиять на административный комитет, чтобы установить желаемую национальную политику или фокусы.\n\nВ настоящее время у вас [?global.cou_apcost|+0] £GFX_action_point_texticon §7AP§!."
COU_check_the_missions_1: "Течение времени"
COU_check_the_missions_1_desc: "Если вы выполните миссию в течение заданного времени, вы получите AP."
COU_check_the_missions_2: "Течение времени"
COU_check_the_missions_2_desc: "Члены административного комитета будут удовлетворены, если миссия будет выполнена в срок."
COU_check_the_missions_3: "Течение времени"
COU_check_the_missions_3_desc: "Соблюдение срока необязательно, но лучше его придерживаться."

#COU_tooltip_gain_one_schedule_ticket: "Восполняется §g1§! §YБилет повестки§! £schedule_ticket_texticon."
#COU_flag_mission_clearing: "§gНет представленного вопроса.§!"
COU_the_srt_problem: "Передать в суд Специальную академию SRT"
#COU_regain_schedule_ticket: "Восполнить билет повестки"
COU_the_srt_problem_desc: "Во время Великого Перемещения Специальная академия SRT совершила катастрофическую ошибку: уничтожила большую часть Королевского дома Оранских-Нассау, включая Вильгельмину. Эта 'резня' — совершенная по собственному решению командира отряда — привела к тому, что с наступлением Нового года Высокий суд Нидерландов запросил у Генерального студенческого совета передать дело в суд. Похоже, это решение невозможно отменить."
COU_the_decart_problem: "Декарт и борьба с отстраненностью"
COU_the_decart_problem_desc: "После Великого Перемещения выросла тенденция избегать работы. План некоего робота хитроумно воспользоваться теми, кто впал в безответственный нигилизм... продолжится."
COU_the_normal_days_of_cou: "Повседневная жизнь в Генеральном студенческом совете"
COU_tooltip_some_normal_days_event: "§gБудут случайным образом происходить события повседневной жизни внутри Генерального студенческого совета.§!"

## Perfidus
COU_decision_cat_perfidus: "Perfidus"
COU_decision_cat_perfidus_desc: "\"Моя честь останется сегодня погребенной под этими стенами, но если завтра утром дети внутри этого замка смогут открыть глаза, я с радостью приму клеймо предателя.\"\n\nТо, что столица Генерального студенческого совета и Кивотоса была перенесена в Нижние Земли, возможно, судьба, предписанная Богом. Правительства Нижних Земель в страхе бежали, но среди них были те, кто с мудростью выбрали выгоду и собственный интерес. Официально их называют коллаборационистами; обычно, с уничижительным прозвищем, Perfidus. Отношения с ними будут играть решающую роль в нашей местной интеграции."
COU_perfidus_gui_txt11: "Лидер"
PERFIDUS_LEON_tooltip: "Лидер Perfidus: 'Инквизитор' §YЛеон Дегрелль§!"
COU_perfidus_gui_txt1: "Текущие эффекты от Perfidus:"
COU_perfidus_gui_txt2: "Скорость мобилизации [?COU_Perfidus_ms|%+1]\nОрганизация дивизий [?COU_Perfidus_aof|%+1]\nПризывное население: модификатор [?COU_Perfidus_cf|%+1]\nСтабильность [?COU_Perfidus_sta|%+1]\nПредел эффективности производства [?COU_Perfidus_fmef|%+1]\nСкорость увеличения подчинения [?COU_Perfidus_cg|%+1]\nВремя обучения [?COU_Perfidus_ttf|%+1]"
COU_perfidus_happy_yay: "Perfidus §Gдовольны§!!"

COU_collaboraters_wants_political_money: "Периодическое требование средств"
COU_collaboraters_wants_political_money_desc: "Perfidus сотрудничают с нами, но не собираются работать бесплатно. Отчасти потому, что почти все они оппортунисты, да, но также и потому, что задачи, которые они берут на себя — например, развертывание служб безопасности вместо Департамента обороны и Валькирии — требуют финансирования. Поэтому они периодически требуют от нас деньги или политическую поддержку. Если мы будем удовлетворять их требования вовремя, проблем не будет... но если нет, они будут работать для нас 'с меньшим энтузиазмом'."

