## Старт
COU_establishment_of_emergency_measures_committee_NOT: "Созвать административный комитет"
COU_establishment_of_emergency_measures_committee: "Комитет чрезвычайных мер Кивотоса"
COU_establishment_of_emergency_measures_committee_NOT_desc: "Начался новый 1936 год, и Председатель Генерального студенческого совета созвала глав департаментов, чтобы извлечь уроки из ошибок и неудач последних двух месяцев. В течение следующих месяцев административный комитет будет заниматься ликвидацией последствий Перемещения и подготовкой к новому году."
COU_establishment_of_emergency_measures_committee_desc: "Вскоре после того, как Председатель Генерального студенческого совета исчезла, появился самопровозглашенный 'Федеральный исследовательский клуб' под названием \"SCHALE\", требующий абсурда: по приказу Председателя Генеральный студенческий совет должен быть поглощен SCHALE. Столкнувшись с этим, Главный административный руководитель Нанагами Рин возьмет на себя обязанности исполняющей обязанности председателя и решила созвать Комитет чрезвычайных мер Кивотоса."

COU_support_nanagami: "Структурная реформа Главного административного руководителя"
COU_support_nanagami_desc: "Главный административный руководитель Нанагами Рин указала на недостатки административного комитета — который практически не изменился с момента Великого Перемещения — и предложила структурную реформу для устранения коренной причины. Ясно, что это дело должно быть выполнено с наивысшим приоритетом."
COU_united_netherlands_law: "Закон об объединении Нидерландов"
COU_united_netherlands_law_desc: ""
COU_survivor_of_kivotos: "Гарантия стабильности Кивотоса"
COU_survivor_of_kivotos_desc: ""
COU_support_oki: "Пересмотр финансовой структуры главой финансов"
COU_support_oki_desc: "Глава финансов Оки Аой указала, что вместе с властью Генерального студенческого совета, рухнувшей после Великого Перемещения, финансовая структура была разрушена до ужасающего уровня. Она утверждала, что приоритет всех реформ должен быть сосредоточен на экономике. Конечно, это должно быть реализовано с наивысшим приоритетом."
COU_expropriate_industrialist: "Окончательное решение"
COU_expropriate_industrialist_desc: ""
COU_integration_of_puppet_economies: "Купить местный капитал"
COU_integration_of_puppet_economies_desc: ""
COU_support_shiranui: "План обороны академий от главы обороны"
COU_support_shiranui_desc: "Мир, который гарантировал Генеральный студенческий совет, был нарушен уже давно. Поэтому большинство планов, разработанных за это время Департаментом обороны, стали бесполезными, и глава обороны Ширануи Кая указала на это: мы должны реализовать это с наивысшим приоритетом."
COU_the_belgian_crusade: "Разделяй и властвуй"
COU_the_belgian_crusade_desc: ""
COU_kill_the_medusa: "Копье, вонзенное в шею змеи"
COU_kill_the_medusa_desc: ""
COU_our_plan_treaty: "Традиционное решение"
