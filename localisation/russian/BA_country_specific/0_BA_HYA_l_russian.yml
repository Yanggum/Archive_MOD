 HYA_trust_committee_4: "Студенческий совет Хяккияко"

 HYA_yuyeonhandongali: "Академия «Союзников» Хяккияко"
 HYA_yuyeonhandongali_desc: "Академия Союзников Хяккияко — это своего рода федерация, образованная системой рыхлого союза между множеством клубов. Эта система повышает стабильность Хяккияко, но из-за отсутствия реального центрального правительства будет трудно активно продвигать планы."

 HYA_public_justice: "Теория политеи (общественное благо)"

 HYA_mangryangz: "Влияние Морёдзу"
 HYA_mangryangz2: "Слабое влияние Морёдзу"

 HYA_nojukeunggundae: "Автономные ополчения"
 HYA_nojukeunggundae_desc: "Ополчения, формируемые автономно каждым клубом. Естественно, нет единства ни в цепи командования, ни в снабжении, что вызывает значительную неразбериху в военных операциях."
 HYA_nojukeunggundae2: "Введение воинских званий"
 HYA_nojukeunggundae2_desc: "Хотя это все еще автономные ополчения, формируемые каждым клубом, цепь командования была реорганизована для облегчения военных операций. Однако сплоченность все еще слаба, и сохраняются трения между членами разных клубов."
 HYA_nojukeunggundae3: "Система объединенных сил"
 HYA_nojukeunggundae3_desc: "Первая модель объединенных сил Академии Союзников Хяккияко. Интеграция еще несовершенна, но путем последовательных реформ существует путь к улучшению."

