 #캐릭터
 HYA_NIYA: "Амачи Ния"
 HYA_NIYA_DESC: "Амачи Ния, глава Онмёбу — которую описывают как бюрократа, погрязшего в пороках бюрократии, целыми днями улыбающегося и не обращающего внимания на жалобы, — на самом деле была фактическим президентом студенческого совета и руководила Великим Перемещением Хяккияко. Ее оптимистичный характер и скорее номинальная власть покрыли ее огромным позором.\n\n«Безответственный и бесполезный президент»: так многие студентки ее называют.\n\n...Если бы ей это сказали, Ния, вероятно, разразилась бы хохотом и захлопала в ладоши. Она может казаться главным злодеем всех бедствий, но на самом деле она скорее тот, кто наслаждается «игрой в главного злодея». За маской оптимизма и улыбки Амачи Ния — человек, умело обеспечивающий политические и дипломатические выгоды.\n\nПод правительством, осуществляемым с хихиканьем, она контролирует Хяккияко с выдающимся красноречием. И очевидно, что она — публичная фигура и сердце Хяккияко."

