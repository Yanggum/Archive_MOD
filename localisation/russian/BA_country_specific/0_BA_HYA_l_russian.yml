  # ПОДСКАЗКИ
  HYA_tt_1: "Вы получаете §Y4 дивизии§! по §Y6 батальонов пехоты§!."
  HYA_focus_46_tt: "§RЕсли §Yподдержка фашистской партии§! превысит §Y15%§! при завершении этого фокуса, начнется гражданская война!§!"
  HYA_focus_65_tt: "§RЕсли §YСтабильность§! ниже §Y40%§! при завершении этого фокуса, начнется гражданская война!§!"
