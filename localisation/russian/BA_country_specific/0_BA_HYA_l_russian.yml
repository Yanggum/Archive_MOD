  # СОБЫТИЯ
 HYA_event.1.t: "Поражение"
 HYA_event.1.desc: "Мы пытались переломить ход войны снова и снова... но потерпели поражение в войне с Хяккияко. Отступать больше некуда, и поражение свершившийся факт.\n\nНам остается либо умолять Хяккияко... либо готовиться к последнему смертельному бою."
 HYA_event.1.a: "Шаньхайцзин... о, Шаньхайцзин..."
 HYA_event.1.b: "До последнего вздоха... будем сражаться!"
 HYA_event.2.t: "Предложение о капитуляции от Шаньхайцзин"
 HYA_event.2.desc: "Пока мы ведем войну с Шаньхайцзин, их правительство запросило у нас капитуляцию.\n\nМы выиграли войну!"
 HYA_event.2.a: "Наша победа!"
 HYA_event.2.b: "Мы аннексируем их полностью."
 HYA_event.3.t: "Секция Хуачжао-Пунволь обнаружена!"
 HYA_event.3.desc: "Выслеживая ответственных за хаотическую волну недавних терактов, мы подтвердили, что за всем действительно стоит Секция Хуачжао-Пунволь, организация, считавшаяся исчезнувшей очень давно. Само существование этих лиц, которое считалось лишь городской легендой, было раскрыто, когда их официально признал Сервисный клуб Академии Союзников Хяккияко."
 HYA_event.3.a: "Они действительно существовали?"
 HYA_event.5.t: "Разграбление арсенала"
 HYA_event.5.desc: "Мы подтвердили, что наш арсенал был взорван неизвестными силами, что привело к потере большого количества огнестрельного оружия."
 HYA_event.5.a: "Выследить виновного."
 HYA_event.6.t: "Атака на оружейный завод"
 HYA_event.6.desc: "Только что поступило сообщение, что один из заводов, снабжающих оружием нашу армию, был атакован неизвестными существами."
 HYA_event.6.a: "Кто... мог сделать такое?"
 HYA_event.7.t: "Взрыв"
 HYA_event.7.desc: "По неизвестным причинам несколько минут назад в центре города произошел взрыв, уничтоживший значительную часть городской инфраструктуры и вызвавший к настоящему часу еще больший хаос и неразбериху."
 HYA_event.7.a: "Отправьте ремонтную бригаду!"
 HYA_event.8.t: "Исчезновения"
 HYA_event.8.desc: "В последнее время часто поступают сообщения об исчезновении студенток нашей академии. Мы отслеживаем эти случаи, но пока результатов нет."
 HYA_event.8.a: "Неужели это совпадение?"
 HYA_event.9.t: "Объявление войны Секцией Хуачжао-Пунволь"
 HYA_event.9.desc: "Секция Хуачжао-Пунволь только что объявила тотальную войну нашей академии. С дерзким заявлением, что они полностью уничтожат систему Академии Союзников Хяккияко, они наступают прямо на нас."
 HYA_event.9.a: "Дойдем до конца."
 HYA_event.11.t: "Хяккияко продвигает пакт о невмешательстве"
 HYA_event.11.desc: "Хяккияко объявила пакт о невмешательстве с целью сосуществования старой Европы и Кивотоса. Его цель — разделить два мира с помощью различных мер, включая пакты о ненападении между балканскими странами и Академией Союзников Хяккияко."
 HYA_event.11.a: "Это пакт, которого и мы желали."
 HYA_event.11.b: "У меня другая идея."
 HYA_event.12.t: "[FROM.GetName] одобряет пакт о невмешательстве"
 HYA_event.12.desc: "[FROM.GetName] принял наш пакт о невмешательстве, заявив, что это будет выгодно во многих отношениях."
 HYA_event.12.a: "Хорошо."
 HYA_event.13.t: "[FROM.GetName] отклоняет пакт о невмешательстве"
 HYA_event.13.desc: "[FROM.GetName] отклонил пакт о невмешательстве по неясной причине, утверждая, что очевидно, что мы стремимся достичь определенной цели, чтобы извлечь выгоду для себя."
 HYA_event.13.a: "Хмм..."
 HYA_event.14.t: "Поражение"
 HYA_event.14.desc: "Мы пытались переломить ход войны снова и снова... но потерпели поражение в войне с Шаньхайцзин. Отступать больше некуда, и поражение свершившийся факт.\n\nОбнаружено, что некоторые командиры сдаются группами Шаньхайцзин, и нет никакой возможности улучшить ситуацию."
 HYA_event.14.a: "Вишни увядают..."
 HYA_event.14.b: "Все... гёкусай."
 HYA_event.15.t: "Предложение о капитуляции от Хяккияко"
 HYA_event.15.desc: "Пока мы ведем войну с Хяккияко, их руководство запросило у нас капитуляцию.\n\nМы выиграли войну!"
 HYA_event.15.a: "Наконец-то земля Шаньхайцзин снова наша."
 HYA_event.15.b: "Мы аннексируем их полностью."
 HYA_event.16.t: "[From.GetNameDef] отклоняет капитуляцию"
 HYA_event.16.desc: "[From.GetNameDef] отклонил наше предложение о капитуляции. Похоже, они желают нашего полного уничтожения..."
 HYA_event.16.a: "…"
 HYA_event.17.t: "Приглашение на Фестиваль Бэкя-Эндже"
 HYA_event.17.desc: "Хяккияко прислала нам приглашение отпраздновать сейчас Бэкя-Эндже, фестиваль, который Академия Союзников Хяккияко проводила до Великого Перемещения.\n\nУчаствовать официально или нет, ожидается, что участие студенток будет значительным. Однако, если мы официально заявим о нашем намерении участвовать, мы сможем получить политические выгоды."
 HYA_event.17.a: "Давайте участвовать."
 HYA_event.17.b: "…Уже слишком поздно возвращаться."

 HYA_event.18.t: "Приглашение на фестиваль из другого мира"
 HYA_event.18.desc: "До Великого Перемещения Хяккияко регулярно проводила в Кивотосе Бэкя-Эндже, фестиваль, на который нам также прислали приглашение.\n\nЕсли мы объявим о своем участии, мы сможем запечатлеть в сознании общественности образ мира и облегчить культурный обмен с другим миром."
 HYA_event.18.a: "Давайте участвовать."
 HYA_event.18.b: "Не ошиблись ли они адресатом?"

 HYA_event.19.t: "Глава Бэкхва-Йоран возвращается"
 HYA_event.19.desc: "Содержание"
 HYA_event.19.a: "Аямэ вернулась?"


 #중점
 HYA_focus_1: "Ситуация в Академии Союзников"
 HYA_focus_1_desc: "После Великого Перемещения ситуация в Хяккияко стала еще более серьезной. Многие клубы и гильдии торговцев Хяккияко воспользовались хаосом, чтобы уйти из-под контроля Онмёбу, а между Онмёбу и Бэкхва-Йоран наблюдаются признаки конфликта по поводу того, как разрешить кризис. Чтобы пробиться сквозь эту неразбериху, потребуются смелые решения."
 HYA_focus_2: "Академия культуры и фестивалей"
 HYA_focus_2_desc: "Академия Союзников Хяккияко была академией с чрезвычайно развитым туризмом, но хаос Великого Перемещения разрушил многочисленные туристические объекты и отменил фестивали. Благодаря отчаянным усилиям Департамента по управлению и проведению Мацури избежать банкротства сектора, некоторые фестивали все еще проводятся нормально, но без дополнительной поддержки традиции Хяккияко могут исчезнуть."
 HYA_focus_3: "Организовать Комитет Доверия"
 HYA_focus_3_desc: "Мы организуем новую группу под названием Комитет Доверия, похожую на Бэкхва-Йоран — которая улаживает конфликты в Хяккияко — но немного более политическую и с более широким охватом. Это учреждение будет функционировать как базовый парламент, или дискуссионный стол, работающий благодаря доверию каждого клуба, и со временем предоставит возможность прочно объединить Академию Союзников Хяккияко."
 HYA_focus_4: "Сотрудничество с Сервисным клубом"
 HYA_focus_4_desc: "Сервисный клуб, клуб, посвященный «обучению» тому, как стать великолепными леди, еще до создания Комитета Доверия самостоятельно занимался помощью беженцам, завоевав хорошую репутацию среди местных жителей и студенток. Сотрудничество с ними позволит еще лучше донести до общественности цель Комитета Доверия: единство Академии Союзников Хяккияко."
 HYA_focus_5: "Сотрудничество с Онмёбу"
 HYA_focus_5_desc: "Чтобы Комитет Доверия имел политическое влияние внутри Хяккияко, одобрение Онмёбу совершенно необходимо. К счастью, глава Онмёбу, Ямачи Ния, настроена благожелательно к его созданию, так что сотрудничество с Онмёбу, как ожидается, не будет трудным."
 HYA_focus_6: "Готовиться к войне"
 HYA_focus_6_desc: "У Хяккияко не было группы, которую можно было бы назвать регулярной армией, и она полагалась на соседские ополчения, создаваемые автономно каждым клубом. Многие военные эксперты утверждают, что с нынешней силой Хяккияко реалистично невозможно подавить внутренний хаос и подготовиться к внешнему вторжению; поэтому они решительно отстаивали создание обученной регулярной армии."
 HYA_focus_7: "Наша война"
 HYA_focus_7_desc: "Хяккияко — это рыхлая федерация клубов, поэтому ее чувство солидарности обычно ниже, чем в других академиях. Но Великое Перемещение изменило все. Среди студенток, которые должны объединиться как «одна академия», чтобы выжить, зарождается чувство единства; с еще небольшой пропагандой Хяккияко может стать настоящей «академией союзников»."
 HYA_focus_8: "Время работать"
 HYA_focus_8_desc: "$HYA_NIYA$ больше не может действовать только с оптимизмом. Теперь она использует свои способности, чтобы возглавить интеграцию Хяккияко и, более того, начнет идеалистический скачок к установлению новой системы, целью которой является «объединить волю всех клубов воедино»."
 HYA_focus_9: "Принцесса Вараку"
 HYA_focus_9_desc: "Вараку Чисэ, суперзвезда Хяккияко, известная как «Принцесса Вараку», покоряет даже местных жителей благодаря своему актерскому таланту и своеобразной, странной милоте. В настоящее время она гастролирует по Хяккияко с утешительными выступлениями, помогая хотя бы на мгновение забыть о разрушенной после Великого Перемещения жизни."
 HYA_focus_10: "Сдержать гильдию торговцев"
 HYA_focus_10_desc: "Поступила разведывательная информация: Ньянтенмару, представитель гильдии торговцев, доминирующей в криминальном мире Хяккияко под прозвищем «Ньянте Масамунэ», замышляет поглотить Департамент по управлению и проведению Мацури, воспользовавшись Великим Перемещением. Мы должны сдержать их и не допустить дальнейшего роста власти гильдии."
 HYA_focus_11: "Разрешить торговлю опиумом"
 HYA_focus_12: "Война Южного Кивотоса"
 HYA_focus_12_desc: "До Великого Перемещения Хяккияко и Шаньхайцзин были взаимно безразличны, но теперь они оказались в положении, когда вынуждены сражаться друг с другом ради выживания."
 HYA_focus_13: "Начать сопротивление"
 HYA_focus_13_desc: "Вопреки нашим ожиданиям, армия Шаньхайцзин оказалась сильнее нашей. Вместо безрассудного удержания фронта армия приказала временно отступить, чтобы оказывать сопротивление, используя городскую застройку Хяккияко в качестве прикрытия."
 HYA_focus_14: "Мобилизовать военную промышленность"
 HYA_focus_14_desc: "После войны проблемы армии Хяккияко начинают выходить на свет. Не говоря уже о том, насколько незрелыми остаются совместные операции между клубами, самым большим препятствием является нехватка военных поставок. Мы должны мобилизовать всю доступную военную промышленность, чтобы решить эту проблему."
 HYA_focus_16: "Расширить призыв"
 HYA_focus_16_desc: "Из-за жестокой войны многие солдаты, верные Хяккияко, исчезли в огне. Чтобы восполнить нехватку личного состава, правительство расширило рамки призыва."
 HYA_focus_19: "Расширить Бэкядан"
 HYA_focus_19_desc: "Департамент по управлению и проведению Мацури приложил огромные усилия для сохранения традиций Хяккияко даже в хаосе Великого Перемещения. Онмёбу, признавая, что они более сведущи во всем, что касается фестивалей, предоставил им больше полномочий, чем раньше, и в знак признания их заслуг поддержал работы по расширению Бэкядана."
 HYA_focus_20: "План урбанизации"
 HYA_focus_20_desc: "Онмёбу высоко оценило способности Кававы Шидзуко в гражданском секторе и предоставило ей права на развитие запущенного городского района рядом с Бэкяданом. Шидзуко объявила план урбанизации для создания инфраструктуры, необходимой как для беспрепятственного проведения фестивалей, так и для конечной цели: проведения Бэкя-Эндже."
 HYA_focus_21: "План 1-го Бэкя-Эндже"
 HYA_focus_21_desc: "Департамент по управлению и проведению Мацури решил провести Бэкя-Эндже как первое крупное мероприятие после Великого Перемещения. Хотя были и противники, большинство участников согласились с доводом, что проведение Бэкя-Эндже необходимо для демонстрации общественности, что традиции Хяккияко живы."
 HYA_focus_22: "Объединенный фестивальный комитет"
 HYA_focus_22_desc: "Из-за более скудных условий по сравнению с Кивотосом, в ходе подготовки к Бэкя-Эндже проявилось множество технических недостатков и проблем с эффективностью. Чтобы исправить это, Шидзуко, используя полномочия, полученные от Онмёбу, учредила Объединенный фестивальный комитет: учреждение, которое сотрудничает с торговцами, архитекторами и другими сторонами для более эффективной подготовки фестиваля."
 HYA_focus_23: "План 2-го Бэкя-Эндже"
 HYA_focus_23_desc: "После обсуждения плана 1-го Бэкя-Эндже Департамент по управлению и проведению Мацури перешел ко второму раунду совещаний, чтобы определить проблемы, требующие усиления, и различные трудности в процессе подготовки мероприятия."
 HYA_focus_24: "Реорганизовать торговый район"
 HYA_focus_24_desc: "Уличные ларьки Хяккияко были одной из дополнительных достопримечательностей фестивалей, но торговля, зависевшая от них, полностью лишилась своей базы после Великого Перемещения. Чтобы Хяккияко полностью вернула былую славу, их спасение необходимо."
 HYA_focus_25: "Бэкя-Эндже"
 HYA_focus_25_desc: "Наконец-то открылся долгожданный Бэкя-Эндже. Хотя по практическим причинам он не мог быть таким грандиозным, как в Кивотосе, многие студентки вспомнили и пережили свою тогдашнюю повседневную жизнь через этот праздник. Удивительно, но местные жители также участвовали вместе со студентками, не проявляя ненависти. В тот день, как никогда, это был день утешения в разрушенной рутине."
 HYA_focus_26: "Сердце леди"
 HYA_focus_26_desc: "Студентки Хяккияко, как и в Тринити, считают величайшей добродетелью «отношение утонченной леди, обладающей спокойным и чистым умом». Хотя Великое Перемещение разрушило их повседневную жизнь, в глубине сердец студенток Хяккияко это отношение все еще живет."
 HYA_focus_27: "Сервисный клуб как замена Дисциплинарному комитету"
 HYA_focus_27_desc: "У Хяккияко есть Бэкхва-Йоран как организация безопасности, но чтобы сосредоточиться на раскрытии истинной личности Секции Хуачжао-Пунволь, они официально попросили Сервисный клуб — который обычно занимается самостоятельным патрулированием — действовать как временный орган, заменяющий Дисциплинарный комитет. Обсудив это, Онмёбу одобрило, и теперь Сервисный клуб активизирует работу по поддержанию порядка вместо Бэкхва-Йоран."
 HYA_focus_28: "Патрулирование в периферийных районах"
 HYA_focus_28_desc: "Благодаря патрулям Сервисного клуба центр Хяккияко стал несколько безопаснее, но на периферии все еще бродят преступники из Кивотоса, борющиеся за выживание, и местные вооруженные группы, совершающие преступления на почве ненависти к «чужакам». Чтобы обеспечить контроль над Хяккияко и за пределами города, Сервисный клуб рассматривает возможность расширения зоны патрулирования."
 HYA_focus_29: "Привлечь Морёдзу"
 HYA_focus_29_desc: "Хотя их число уменьшилось после Великого Перемещения, Морёдзу все еще остаются головной болью для Хяккияко. Их боеспособность была бы уместна для сил безопасности, поэтому, если мы подчиним их, используя комбинацию убеждения и угрозы, мы сможем усилить персонал, которого не хватает Хяккияко."
 HYA_focus_30: "Начать уничтожение Морёдзу"
 HYA_focus_30_desc: "Даже после Великого Перемещения террористические атаки Морёдзу продолжаются. Они нападают на беззащитных граждан и студенток, чтобы грабить скудные предметы первой необходимости, поэтому их необходимо быстро подавить, даже если придется применить силу."
 HYA_focus_31: "Военная реформа"
 HYA_focus_31_desc: "Самая большая проблема Хяккияко — это ее необъединенная армия. Чтобы ее военная мощь достигла уровня, сравнимого с другими академиями или местными государствами, мы должны собрать ополчения всех клубов, предоставить им различные льготы, чтобы превратить их в регулярную армию Хяккияко, и установить единую дисциплину."
 HYA_focus_32: "Сила тренировок"
 HYA_focus_34: "Промышленное развитие"
 HYA_focus_34_desc: "Из-за Великого Перемещения бесчисленные промышленные объекты и уличные ларьки, которыми гордилась Хяккияко, были разрушены. Восстановить этот ущерб в короткие сроки кажется невозможным. Правительство разрабатывает систематический план и готовит восстановление промышленности."
 HYA_focus_35: "Укрепить большой город"
 HYA_focus_35_desc: "Крупные города Хяккияко достаточны, чтобы остановить атаки такой мелкой сошки, как Морёдзу, но они уязвимы для бомбардировок организованных армий с планами. Выявив эту слабость, правительство решило укрепить городскую застройку для более эффективной обороны."
 HYA_focus_36: "Строительство Судетской линии"
 HYA_focus_36_desc: "Война против Шаньхайцзин выявила несколько моментов, требующих улучшения в обороне крупных городов. Поэтому правительство решило построить огромную оборонительную линию, соединяющую землю под названием «Судетская область» — на местном языке, отнятом у Шаньхайцзин — с крупными городами Хяккияко: Судетскую линию."
 HYA_focus_37: "Расширить оружейный завод"
 HYA_focus_37_desc: "Часть разрушенных промышленных комплексов составляли заводы, производившие необходимый в Кивотосе товар: огнестрельное оружие. Большинство не может поспевать за спросом из-за нехватки ресурсов. С помощью местных оружейников мы должны получить чертежи местного пехотного снаряжения и научиться производить их самостоятельно."
 HYA_focus_38: "Поддержать гражданскую промышленность"
 HYA_focus_38_desc: "Гражданская промышленность, которую можно назвать сердцем Хяккияко, была в основном разрушена Великим Перемещением. Даже то немногое, что уцелело, обанкротится без вмешательства правительства, поэтому необходимы немедленные меры."
 HYA_focus_39: "Инновации в промышленности"
 HYA_focus_39_desc: ""
 HYA_focus_40: "Реконструкция дорог"
 HYA_focus_40_desc: ""
 HYA_focus_41: "Объединенный университет Хяккияко"
 HYA_focus_41_desc: ""
 HYA_focus_42: "Основать Объединенный исследовательский департамент"
 HYA_focus_42_desc: ""
 HYA_focus_43: "Интерес к ниндзюцу"
 HYA_focus_43_desc: ""
 HYA_focus_44: "Идти рядом с лисой"
 HYA_focus_44_desc: "Учитывая особенности Великого Перемещения, правительственные чиновники объявили, что отменят исключение (отстранение) одной из Семи Узниц, Косака Вакамо, амнистируют ее за все преступления и назначат генералом Хяккияко. Однако многие студентки Хяккияко, кажется, недовольны этой мерой."
 HYA_focus_45: "Сохранить исключение Вакамо"
 HYA_focus_45_desc: "Несмотря на требования внутренних радикалов, нынешнее правительство официально отказалось отменять исключение (отстранение) одной из Семи Узниц, Косака Вакамо. Они утверждают, что ее террористические акты оставили неизгладимую рану на чести академии, и заявили, что даже после Великого Перемещения сохранят ее исключение."
 HYA_focus_46: "Укрепить Комитет Доверия"
 HYA_focus_46_desc: ""
 HYA_focus_47: "Студенческий совет Хяккияко"
 HYA_focus_47_desc: "Официально учрежден Студенческий совет Хяккияко, преемник Комитета Доверия. В своей первой речи он заявил, что основывается на «теории политеи» для продвижения равенства между клубами, и объявил, что будет ставить превыше всего благополучие граждан Хяккияко."
 HYA_focus_48: "Оборонная промышленность"
 HYA_focus_48_desc: "Хяккияко должна, прежде всего, стабилизировать свою внутреннюю обстановку; для этого необходимо, чтобы армия росла. Следовательно, также необходимо развивать оборонную промышленность."
 HYA_focus_49: "Обратный инжиниринг самолетов"
 HYA_focus_49_desc: "Не только люди должны адаптироваться к среде, похожей на Кивотос, но слегка иной: самолеты тоже. Мы должны провести обратный инжиниринг самолетов, изготовленных по местной технологии, и разработать самолеты, подходящие для этой среды."
 HYA_focus_50: "Улучшить огневую мощь пехоты"
 HYA_focus_50_desc: "После боев с местными армиями армия Хяккияко осознала, что вооружение Кивотоса не особенно эффективно против местной пехоты. Поэтому военный институт применил местные технологии и смог улучшить пехотное оружие, сделав его более эффективным в бою против местных жителей."
 HYA_focus_51: "Система военной экономики"
 HYA_focus_51_desc: "Правительство Хяккияко сосредотачивается на военном росте. Чтобы удовлетворить постепенно растущий спрос армии, правительство провозгласило систему военной экономики на тех заводах Хяккияко, которые может контролировать."
 HYA_focus_52: "Разработка истребителей"
 HYA_focus_52_desc: "Авиационный отдел военного института смог создать эффективные самолеты путем обратного инжиниринга местных технологий. Основываясь на этом, они представили руководству проект создания истребителя, сочетающего технологии Кивотоса и местные."
 HYA_focus_53: "Исследование бомбардировщиков"
 HYA_focus_53_desc: "Сразу после успеха обратного инжиниринга самолетов некоторые увлеченные таланты из авиационного отдела предложили объединить местные бомбардировщики с технологиями Кивотоса. Идея была немедленно одобрена, и теперь они полностью посвятили себя исследованию бомбардировщиков."
 HYA_focus_54: "Авиационный институт Хяккияко"
 HYA_focus_54_desc: "Небольшая исследовательская секция авиации внутри военного института набрала вес благодаря последовательным успехам. Правительство Хяккияко, обратив внимание на эти блестящие таланты, предоставило им авиационный институт, чтобы они могли сосредоточиться на своих исследованиях."
 HYA_focus_55: "Реактивные самолеты"
 HYA_focus_55_desc: "В Кивотосе реактивные технологии обычны, но здесь они, кажется, еще не коммерциализированы. Если мы создадим реактивные военно-воздушные силы, мы сможем обеспечить превосходство в воздухе в бою против местных жителей."
 HYA_focus_56: "Интегрировать воздушную доктрину"
 HYA_focus_56_desc: "Отсутствие единой доктрины — проблема не только армии Хяккияко. К счастью, у военно-воздушных сил нет десятков доктрин, как у армии, так что ожидается, что интеграция доктрины пройдет относительно гладко."
 HYA_focus_57: "Лопаты и рельсы"
 HYA_focus_57_desc: "Из-за воздействия Великого Перемещения как рельсы Хяккияко, так и местные перестали нормально функционировать. Если в рамках национальной промышленности мы используем безработных для строительства железных дорог, мы сможем убить двух зайцев: стабилизировать экономику и восстановить национальную инфраструктуру."
 HYA_focus_58: "Расширить добычу полезных ископаемых"
 HYA_focus_58_desc: "С помощью технологий Кивотоса мы обнаружили, что в регионе Хяккияко и в Судетской области есть еще неразработанные подземные ресурсы. С передовыми технологиями Кивотоса их добыча будет проще простого."
 HYA_focus_59: "Больше земли"
 HYA_focus_59_desc: "Некоторые здания кампуса Хяккияко были разрушены Великим Перемещением до такой степени, что их невозможно восстановить. Мы должны расчистить обломки старого кампуса, выровнять землю и превратить ее в новую землю возможностей!"
 HYA_focus_60: "Приоритет железной дороге"
 HYA_focus_60_desc: "После Великого Перемещения большая часть путей, проходящих через Хяккияко — ранее находившихся под юрисдикцией Железнодорожной академии Хайлендер — перешла к нам. Теперь, когда вмешательство Хайлендер ослабло, настал подходящий момент для плавного соединения с местной железной дорогой."
 HYA_focus_61: "Основать государство"
 HYA_focus_61_desc: "После бесчисленных усилий Комитета Доверия Хяккияко удалось политически интегрироваться. Хяккияко больше не будет «альянсом» только по названию, а возродится как настоящая «Академия Союзников»!"
 HYA_focus_62: "Лидерство Онмёбу"
 HYA_focus_62_desc: "Хотя Онмёбу и не является официальным студенческим советом Хяккияко, его легитимность и положение таковы, что мало кто открыто возражает против его руководства Комитетом Доверия. Возможно, «легитимно», чтобы Онмёбу возглавил новый студенческий совет, но будут и те, кто выступит против, утверждая, что это нарушает ценность «равенства», бывшую принципом создания Комитета Доверия."
 HYA_focus_63: "Разделение властей"
 HYA_focus_63_desc: "Комитет Доверия ставил во главу угла ценность «равенства» для гармонии Хяккияко. Теперь, у ворот рождения Студенческого совета, руководители Комитета после обсуждения официально заявили, что все клубы Хяккияко — включая Онмёбу — будут иметь равный голос в Совете, и что Совет будет разрешать конфликты между клубами с нейтральной позиции."
 HYA_focus_64: "Комитет по урегулированию конфликтов Бэкхва-Йоран"
 HYA_focus_64_desc: "Хяккияко слишком нестабильна, чтобы утвердиться в нынешней системе. Академия Союзников Хяккияко должна быть реорганизована в соответствии с новыми принципами руководства нашего Комитета по урегулированию конфликтов Бэкхва-Йоран! Решение по защите нашей академии будет исполнено немедленно, и политика небрежной терпимости к чехам и импульсивные действия клубов будут немедленно прекращены."
 HYA_focus_65: "Карательная кампания против Секции Хуачжао-Пунволь"
 HYA_focus_66: "Подавление антиакадемической деятельности"
 HYA_focus_67: "Запретить чешские собрания"
 HYA_focus_68: "Ликвидировать террористов"
 HYA_focus_69: "Порядок и дисциплина"
 HYA_focus_70: "Свергнуть систему Хяккияко"
 HYA_focus_71: "Сотрудничать с Секцией Хуачжао-Пунволь"
 HYA_focus_72: "Отвергнуть ёкаев"
 HYA_focus_72_desc: "Сотрудничество с Секцией Хуачжао-Пунволь, управляющей этой подозрительной силой, не принесет нам ничего хорошего. Мы, Морёдзу, решительно отвергнем их и достигнем своих целей по-своему — даже если иногда наша идентичность будет размыта."
 HYA_focus_73: "Основания для войны"
 HYA_focus_74: "Иноумонно-но-Кероку"
 HYA_focus_75: "Хванрян-Бэкмуль-о"
 HYA_focus_76: "Подрыв академии"
 HYA_focus_77: "Сумерки"
 HYA_focus_78: "Собрать Морёдзу"
 HYA_focus_79: "Стратегия убеждения"
 HYA_focus_80: "Это революция!"
 HYA_focus_81: "Распустить Хяккияко"
 HYA_focus_82: "Принудительная аннексия"
 HYA_focus_83: "Спасайся кто может"
 HYA_focus_84: "Единая система"
 HYA_focus_85: "Демонтировать академию"
 HYA_focus_86: "Установить принципы контроля"
 HYA_focus_87: "Свобода без границ"
 HYA_focus_88: "Освобождение от власти"
 HYA_focus_89: "Мародеры"
 HYA_focus_90: "Принять анархизм"
 HYA_focus_91: "Систематизировать Морёдзу"
 HYA_focus_92: "Раздавить границу"
 HYA_focus_93: "Наш образ жизни"
 HYA_focus_94: "Основать государство"
 HYA_focus_95: "Департамент военного контроля Хяккияко"
 HYA_focus_96: "Гибкая система клубов"
 HYA_focus_96_desc: "Чтобы воплотить в жизнь «равенство», идеал основания студенческого совета, мы должны иметь возможность адекватно регулировать конфликты между клубами. Возможно, даже лучше реформировать систему клубов гибко, чтобы заранее предотвращать ситуации, в которых эти конфликты возникают."
 HYA_focus_97: "Государство Хяккияко"
 HYA_focus_100: "Сосредоточиться на внутренних делах"
 HYA_focus_100_desc: "Политическая интеграция Хяккияко путем создания студенческого совета едва позволила предотвратить фрагментацию академии, но внутри все еще остается много нерешенных проблем. Пока что нам нужно временно отключиться от мира и сначала заняться внутренними делами."
 HYA_focus_101: "Защищать границу"
 HYA_focus_102: "Политика невмешательства"
 HYA_focus_102_desc: "Со времен Комитета Доверия Хяккияко придерживалась нейтральной позиции в конфликтах между другими академиями. Студенческий совет, его преемник, официально объявил, что, пока не будут решены внутренние проблемы, Хяккияко не будет вмешиваться в дела других стран и сохранит нейтральную позицию."
 HYA_focus_103: "Строить пограничные укрепления"
 HYA_focus_103_desc: "Нейтралитет — это не щит, предотвращающий все войны. Фактически, нейтралитет может привести к изоляции. Поэтому Хяккияко не должна ожидать помощи для отражения внешнего вторжения: мы должны укрепить наши оборонительные линии и готовиться к агрессии."
 HYA_focus_104: "Продвигать пакт о невмешательстве"
 HYA_focus_104_desc: "Балканские страны все более внимательно следят за следующим шагом Хяккияко, которая продолжает расти. Если Хяккияко вмешается в войну за балканскую гегемонию, они могут объединиться, чтобы напасть на нас. Поэтому мы должны продвигать пакт о невмешательстве и ясно дать понять, что нас не интересует вторжение."
 HYA_focus_105: "Балканская стена"
 HYA_focus_105_desc: "Конфликты между балканскими странами обостряются день ото дня; достаточно одной искры, чтобы они вспыхнули в любой момент. Некоторые студентки в совете, знакомые с местной культурой, предложили возвести прочный барьер на границе, чтобы подготовиться к такой возможности."
 HYA_focus_106: "Выявить враждебные страны"
 HYA_focus_107: "Комиссия крепостей Хяккияко"
 HYA_focus_107_desc: "Следуя политике невмешательства, для защиты границы было построено множество крепостей. Для эффективного контроля за обслуживанием, управлением и огромным потоком поставок, предназначенных для этих крепостей, правительство учредило Комиссию крепостей."
 HYA_focus_108: "Обеспечить балканскую гегемонию"
 HYA_focus_109: "Академия ёкаев"
 HYA_focus_110: "«Хяккияко»"
 HYA_focus_111: "Сдержать венгерские амбиции"
 HYA_focus_112: "Эксплуатировать Словакию"
 HYA_focus_113: "Сорвать Великую Румынию"
 HYA_focus_114: "Демонтировать Югославию"
 HYA_focus_115: "Гегемон Балкан"
 HYA_focus_116: "Продвигать объединение Южного Кивотоса"
 HYA_focus_117: "Умиротворить юг"
 HYA_focus_118: "Вторжение в южную Генну"
 HYA_focus_119: "Возвращение главы Бэкхва-Йоран"
 HYA_focus_120: "Убедить Аямэ"
 HYA_focus_121: "Всевидящее око"
