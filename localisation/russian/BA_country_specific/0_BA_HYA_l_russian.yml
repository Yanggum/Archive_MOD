 HYA_urban_legend: "Городская легенда"
 HYA_urban_legend_desc: "Начал распространяться слух, что после Великого Перемещения «Секция Хуачжао-Пунволь», уничтоженная в далеком прошлом Комитетом по урегулированию конфликтов Бэкхва-Йоран, снова активизировалась."

 HYA_flower_bird_wind_moon_club: "Секция Хуачжао-Пунволь"
 HYA_flower_bird_wind_moon_club_desc: "Секция Хуачжао-Пунволь действительно существовала! Они совершали теракты против нас. Мы также получили информацию, что их цель — свергнуть систему Академии Союзников Хяккияко."
 HYA_flower_bird_wind_moon_club_tt: "§RЕсли §Yподдержка фашистской партии§! превысит §Y40%§!, начнется гражданская война!§!"

