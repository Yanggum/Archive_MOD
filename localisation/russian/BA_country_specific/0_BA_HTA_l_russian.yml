l_russian:

  #Незаконная оккупация Хайлендер
  BA_train_school: "Железнодорожная академия Хайлендер"
  BA_highlander_academy_generic: "Железнодорожная академия Хайлендер"
  BA_highlander_academy_generic_desc: "Транспортная сеть всей академии управляется Железнодорожной академией Хайлендер и не находится под нашим контролем. Мы должны платить транспортные сборы Железнодорожной академии Хайлендер и ее крупнейшему инвестору или же рассмотреть другие меры."
  BA_nationalized_highlander: "Доли Хайлендер в §Yнациональных линиях§! были конфискованы."
  BA_highlander: "Железнодорожная академия Хайлендер"
  BA_highlander_desc: " Железнодорожная академия Хайлендер управляет обширной сетью путей, простирающейся по всему Кивотосу. Однако после Великого Перехода ни Хайлендер, ни Генеральный студенческий совет больше не обладают прежней административной способностью, и академии начали занимать существующие железнодорожные пути в перемещенных регионах, что делает положение Железнодорожной академии Хайлендер нестабильным.\n\n В текущей ситуации мы можем конфисковать доли путей, принадлежащие Хайлендер, чтобы добиться транспортного суверенитета, или вложить крупные суммы капитала в Железнодорожную академию Хайлендер, чтобы подчинить их нашему контролю. Кроме того, каждое инвестирование в железнодорожную академию приведет к тому, что они будут оказывать нам различную поддержку, связанную с транспортом.\n\n [BA_highlander_best_invester]\n @[this.gettag] §Y[THIS.getname]§! инвестиции: §Y[?THIS.BA_highlander_invest]§![BA_highlander_use_list]"
  BA_highlander_datasite: "Железнодорожная академия Хайлендер\n- Скорость исследования поездов и железных дорог: §G+10%§!\n- Выплаты гражданской промышленности стороне [?var:global.highlander_best_invester.GetName]: §R+3.00%§!"
  BA_press_highlander: "Оказать давление на Железнодорожную академию Хайлендер"
  BA_press_highlander_desc: "Главный офис Железнодорожной академии Хайлендер находится под нашим контролем. Мы можем оказать на них соответствующее давление."
  BA_highlander_hide_list: "Скрыть список академий-пользователей Хайлендер"
  BA_highlander_show_list: "Показать список академий-пользователей Хайлендер"
  BA_highlander_hub_construction: "Установить железнодорожный хаб"
  BA_highlander_hub_construction_desc: "Установить железнодорожный хаб Хайлендер в регионе.\n§WОсталось использований: §G[?BA_highlander_hub_available]§!§!"
  BA_invest_highlander: "Инвестировать в Хайлендер"
  BA_highlander_hub_eat: "Взять под контроль железнодорожный хаб"
  BA_highlander_auto_investment_on: "Включить автоматическое реинвестирование"
  BA_highlander_auto_investment_on_desc: "События, появляющиеся в результате инвестиций в Хайлендер, будут автоматически активировать новые инвестиции."
  BA_highlander_auto_investment_off: "Выключить автоматическое реинвестирование"

  Highlander.1.t: "Строительство инфраструктуры"
  Highlander.1.d: "Железнодорожная академия Хайлендер инвестировала в строительство инфраструктуры на нашей территории."
  Highlander.3.t: "Расширение путей"
  Highlander.3.d: "Железнодорожная академия Хайлендер решила расширить пути в пределах нашей академии."
  Highlander.3.a: "Инвестиции окупились."
  Highlander.4.t: "Дополнительное развертывание поездов"
  Highlander.4.d: "Железнодорожная академия Хайлендер решила развернуть дополнительные поезда на путях, проходящих через нашу академию."
  Highlander.5.t: "Связь промышленности и железной дороги"
  Highlander.5.d: "По мере развития железнодорожной промышленности промышленность академии также растет."
  Highlander.6.t: "Нормальная работа"
  Highlander.6.d: "Железная дорога Хайлендер работает 'нормально'."
  Highlander.6.a: "Удивительно!"
  Highlander.7.t: "Отправка руководства железнодорожной академии"
  Highlander.7.d: "Из Железнодорожной академии Хайлендер был направлен персонал из центрального контрольного центра для управления путями на территории нашей [ROOT.getname]."
  Highlander.8.t: "Смена крупнейшей страны-инвестора Хайлендер"
  Highlander.8.d: "Крупнейшая страна-инвестор Хайлендер изменилась."
  Highlander.8.a: "Понятно."
  Highlander.9.t: "Реконструкция путей"
  Highlander.9.d: "После Великого Перехода местные железные дороги и железные дороги Кивотоса оказались разобщены и разрозненны. Транспорт прерван, поставки остановлены, промышленность застопорилась. Для быстрого восстановления академии крайне необходимо провести масштабную реконструкцию путей."
  Highlander.9.a: "Хорошо, давайте сделаем это быстро!"
  Highlander.10.t: "Продажа акций"
  Highlander.10.d: "По мере того как стоимость акций Железнодорожной академии Хайлендер продолжает падать, некоторые мелкие инвесторы из нашей академии продали свои доли."
  Highlander.10.a: "Понял."
  Highlander.11.t: "Продажа долей"
  Highlander.11.d: "Чтобы обеспечить стабильное финансирование, правительственные чиновники продали часть долей в Хайлендер."
  Highlander.12.t: "Железнодорожный спад"
  Highlander.12.d: "Железнодорожная промышленность вступает в фазу стагнации. Многие инвесторы из нашей академии выводят свои связанные инвестиции."
  Highlander.12.a: "Черт."
  Highlander.13.t: "Дополнительные инвестиции"
  Highlander.13.d: "В этом раунде инвестиций мы приобрели большую долю."
  Highlander.13.a: "Отлично."
  Highlander.14.d: "Из Железнодорожной академии Хайлендер был направлен персонал из отдела управления грузовыми перевозками для управления путями на территории нашей [ROOT.getname]."
  Highlander.15.t: "Проблема ширины колеи"
  Highlander.15.d: "После непрерывных усилий железнодорожные проблемы были в определенной степени решены, и теперь мы планируем унифицировать и реорганизовать национальную железнодорожную сеть, приняв единую стандартную ширину колеи. Однако возникает новый вопрос: какую ширину колеи нам следует принять за стандарт? У каждой есть свои явные преимущества и недостатки, и выбор определит различные выгоды."
  Highlander.15.a: "Унифицируем со стандартной колеей."
  Highlander.15.b: "Смешаем стандартную и узкую колею."
  Highlander.15.c: "Используем иберийскую колею."
  Highlander.15.e: "Используем широкую колею."
  Highlander.15.b_tt: "\n§gУзкая колея является преобладающим стандартом железных дорог Хайлендер:§!\n"
  Highlander.16.t: "Железнодорожный бунт"
  Highlander.16.d: "Произошла атака внутри поезда Хайлендер, вызвавшая беспорядки в части города."
  Highlander.16.a: "Какая проблема."
  Highlander.17.t: "Отправка студентов Хайлендер"
  Highlander.17.d: "Из Железнодорожной академии Хайлендер были направлены студенты для улучшения работы путей на территории нашей [ROOT.getname]."
  Highlander.20.t: "Дополнительная установка железнодорожных хабов"
  Highlander.20.d: "Был утвержден дополнительный план установки железнодорожных хабов [HTA.getname]."
  Highlander.20_tt: "Позволяет установить дополнительно §G1§! §YЖелезнодорожный хаб Хайлендер§!."

  Highlander_upgrade.1.t: "Железнодорожный проект: реконструкция путей"
  Highlander_upgrade.1.d: "После Великого Перехода местные железные дороги и железные дороги Кивотоса несовместимы, а региональные линии оказались разобщены и разрозненны. Транспорт прерван, промышленность застопорилась. Мы должны сосредоточиться на решении этих проблем."
  Highlander_upgrade.1.a: "Примем железнодорожный проект."
  Highlander_upgrade.1.b: "Подождем других вариантов."
  Highlander_upgrade.1_tt: "Принять §Y'Реконструкцию путей'§! в железнодорожном проекте."
  Highlander_upgrade.2.t: "Железнодорожный проект: установка железнодорожных хабов"
  Highlander_upgrade.2.d: "Железнодорожные хабы Хайлендер являются логистическим ядром и прямой операционной базой [HTA.getname]. Через них товары академии концентрируются и распределяются, движущая сила всей академической промышленности. Расширение этих хабов, несомненно, является самым верным путем к увеличению промышленного потенциала."
  Highlander_upgrade.2_tt: "Принять §Y'Установку железнодорожных хабов'§! в железнодорожном проекте.\n\nПозволяет установить дополнительно §G2§! §YЖелезнодорожных хаба Хайлендер§!."
  Highlander_upgrade.3.t: "Железнодорожный проект: строительство транспорта"
  Highlander_upgrade.3.d: "[HTA.getname] желает контролировать транспортные объекты на более обширной территории. С другой стороны, нам срочно необходимо создать промышленную базу путем строительства транспортной инфраструктуры. Это совпадение интересов принесет большую выгоду обеим сторонам."
  Highlander_upgrade.3_tt: "Принять §Y'Строительство транспорта'§! в железнодорожном проекте."
  Highlander_upgrade.4.t: "Железнодорожный проект: активные инвестиции"
  Highlander_upgrade.4.d: "Крупнейшая страна-инвестор [HTA.getname] получает дивиденды от их прибыли. Учитывая доходы, которые они получают от транспортной сети всего Кивотоса, мы не можем игнорировать их потенциальную ценность. Путем активных инвестиций мы станем крупнейшей страной-инвестором [HTA.getname]."
  Highlander_upgrade.4_tt: "Принять §Y'Активные инвестиции'§! в железнодорожном проекте."
  Highlander_upgrade.5.t: "Железнодорожный проект: альянс с Хайлендер"
  Highlander_upgrade.5.d: "Я хочу увидеть руководящих персонажей Хайлендер."
  Highlander_upgrade.5_tt: "Принять §Y'Альянс с Хайлендер'§! в железнодорожном проекте."
  Highlander_upgrade.6.t: "Подход к использованию железных дорог: железнодорожная война"
  Highlander_upgrade.6.d: "Одним из основных полей сражений Кивотоса являются городские районы. Города с их высокими и прочными зданиями крайне неблагоприятны для пехоты и бронетехники, но бронепоезда могут проникать в самое сердце города через пути и господствовать над транспортными маршрутами. Новая эра требует новых стратегий!"
  Highlander_upgrade.6_tt: "Принять §Y'Железнодорожную войну'§! в качестве подхода к использованию железных дорог."
  Highlander_upgrade.7.t: "Подход к использованию железных дорог: снабжение поездами"
  Highlander_upgrade.7.d: "Поддержание линий снабжения на обширном фронте — чрезвычайно сложная задача. Однако с помощью железных дорог снабжение на дальние расстояния может осуществляться бесперебойно с помощью поездов."
  Highlander_upgrade.7_tt: "Принять §Y'Снабжение поездами'§! в качестве подхода к использованию железных дорог."
  Highlander_upgrade.8.t: "Подход к использованию железных дорог: операция бастионов"
  Highlander_upgrade.8.d: "Хотя в настоящее время мы поддерживаем эффективный транспорт через железнодорожные хабы Хайлендер, мы не должны на этом останавливаться. Если мы превратим эти хабы в военные узлы, мы сможем получить преимущество в будущих войнах."
  Highlander_upgrade.8_tt: "Принять §Y'Операцию бастионов'§! в качестве подхода к использованию железных дорог."
  Highlander_upgrade.9.t: "Подход к использованию железных дорог: железные дороги и промышленность"
  Highlander_upgrade.9.d: "Промышленное развитие через железную дорогу все еще имеет потенциал для стимулирования."
  Highlander_upgrade.9_tt: "Принять §Y'Железнодорожную промышленность'§! в качестве подхода к использованию железных дорог."
  Highlander_upgrade.10.t: "Подход к использованию железных дорог: наши железные дороги"
  Highlander_upgrade.10.d: "Железнодорожная академия Хайлендер владеет путями в академии и занимает несправедливую позицию. Мы будем постепенно лишать их статуса и полностью установим наши собственные железные дороги."
  Highlander_upgrade.10_tt: "Принять §Y'Наши железные дороги'§! в качестве подхода к использованию железных дорог."

