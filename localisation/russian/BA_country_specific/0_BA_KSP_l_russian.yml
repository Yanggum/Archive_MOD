l_russian:

 KSP_country_intro_header:0 "§CСтражи нового порядка§!"
 KSP_country_intro_content:0 "\nАкадемия полиции Валькирии, также известная как Студенческое полицейское управление Кивтос (KSPD), внезапно оказалась в регионе Бельгии.\n\nПеред лицом внезапного переноса администрация была парализована, а студентки под командованием Канны, директора Управления общественной безопасности, находятся в замешательстве, не зная, как действовать.\n\nСвязь с Генеральным студенческим советом прервана, и мы находимся в критической ситуации, когда не можем получать приказы.\n\nВ самом худшем из возможных сценариев, который может еще больше ухудшиться, мы, как стражи порядка, должны успокоить местное население и, более того, стабилизировать район Сиратори, чтобы исправить нестабильный порядок в Кивтос.\n\n§YРазработка - Mako, SKSKIe, Regulus§!\n§YДополнительная разработка - Imika, Wolha, Haenongi, Lolenheim§!"

 KSP_guide:0 "Цели\n\n£white_dot. Проанализируй текущую ситуацию и реагируй соответствующим образом.\n£white_dot. Обеспечивай безопасность региона силами студенток Валькирии.\n£white_dot. Подави освобожденную Вакамо.\n£white_dot. Стабилизируй Бельгию и принимай лучшие решения от имени порядка."

 # Valkyrie Story Archive
 KSP_story_archive:0 "Архив истории"
 KSP_show_story_archive_gui:0 "Архив истории Валькирии"
 KSP_show_story_archive_gui_desc:0 "Здесь вы можете ознакомиться с побочными историями, связанными с Валькирией и Бельгией. Они не привязаны к игровой системе и созданы исключительно для удовольствия от чтения побочных сюжетов, связанных со страной в игре. Со временем и по мере событий могут добавляться новые истории. Надеемся, они вам понравятся."

 KSP_attempt_to_gain_control_of_the_srt:0 "Попытка обеспечить контроль над SRT"
 KSP_attempt_to_gain_control_of_the_srt_desc:0 "С исчезновением президента Генерального студенческого совета и утратой власти над SRT, Валькирия должна временно взять на себя опеку над ее членами и временно принять на себя роль сил специального назначения SRT."

 KSP_division_of_military:0 "Судьба сил специального назначения SRT"
 KSP_division_of_military_desc:0 "Дебаты о судьбе SRT, инициированные Академией полиции Валькирии, развиваются интенсивно. Осталось только два возможных исхода: либо SRT будет интегрирована в Валькирию, как утверждает Академия полиции Валькирии, либо SRT останется под Генеральным студенческим советом."
 KSP_mission_division_of_military_trigger_tooltip:0 "@KSP Очки влияния §Y100§! или более"
 KSP_mission_division_of_military:0 "Война кооптации"
 KSP_strengthening_influence_pp:0 "Укрепить политическое влияние"
 KSP_strengthening_influence_cp:0 "Кооптировать командиров SRT"
 KSP_strengthening_influence_stv:0 "Речь об отсутствии президента Генерального студенческого совета"
 KSP_strengthening_influence_civ:0 "Обеспечить объекты SRT"
 KSP_strengthening_influence_mp:0 "Расширить штат сотрудников"
 KSP_strengthening_influence_civ_tt:0 "£civ_factory  §Y1§!"
 KSP_strengthening_influence_civ_tt_blocked:0 "£civ_factory  §R1§!"
 KSP_strengthening_influence_mp_tt:0 "£manpower_texticon  §Y1000§!"
 KSP_strengthening_influence_mp_tt_blocked:0 "£manpower_texticon  §R1000§!"

 KSP_strengthening_influence_tt:0 "@KSP Влияние $RIGHT|+=%%0$\n"

 KSP_division_of_military_value_tooltip:0 "[ROOT.GetNameDefCap] имеет §Hочки влияния§! в размере [?global.KSP_division_of_military_value|0H%%]\n"
 KSP_division_of_military_value_tt:0 "[?global.KSP_division_of_military_value|0H%%]"
 KSP_kanna_banned:0 "§YУхудшение здоровья§!"
 KSP_kanna_dictator:0 "Диктатура"
 KSP_kanna_dictator_desc:0 "Канна, \"бешеная собака\" Управления общественной безопасности, — фигура, дослужившаяся до поста директора благодаря твердым убеждениям и решимости. Теперь, когда любой компромисс с бельгийцами исключен, только Канна способна разрешить беспрецедентный кризис, с которым столкнулась Валькирия. Мы должны полностью принять ее решения и довериться ей."
 KSP_kanna_dictatorship_resistance:0 "Сопротивление Управления безопасности"
 KSP_kanna_dictatorship_resistance_desc:0 "С тех пор как власть Канны начала укрепляться, Управление безопасности проявляло некооперативное отношение к ее приказам и даже отвергало ее законные требования. Когда Канна провозгласила диктатуру, они, словно ожидая этого, начали открытое сопротивление против Управления общественной безопасности."
 KSP_kanna_dictatorship_agreement:0 "Принятие Управлением общественной безопасности"
 KSP_kanna_dictatorship_agreement_desc:0 "С Канной во главе правительства Управление общественной безопасности положительно отреагировало на ее диктатуру и решило добросовестно сотрудничать с ее администрацией. Его члены будут активно следовать указаниям Канны и помогать ей."
 KSP_loyal_police_academy:0 "Лояльная полицейская академия"
 KSP_loyal_police_academy_desc:0 "Устранив угрозу со стороны авторитарной Канны, фракция оппозиции внутри Валькирии захватила власть и смогла установить свое собственное лояльное правительство. Отныне Валькирия станет полицейской академией, вечно верной Генеральному студенческому совету."
 KSP_justice:0 "Справедливость"
 KSP_justice_desc:0 "Терпимость, переговоры, сотрудничество… Необходимо раз и навсегда покончить со слабым прошлым Валькирии. Увидев некомпетентность Генерального студенческого совета и Шале в отношении Башни Святилища, мы больше не будем ждать. Нет никаких причин проявлять снисходительность к тем, кто наносит ущерб культуре Кивтос."
 KSP_kanna_internal_organize:0 "Укрепить внутреннюю сплоченность"
 KSP_kanna_internal_organize_desc:0 "Хотя внутри Валькирии был конфликт и нам удалось его разрешить, возможно, снова появятся голоса, противоречащие политике правительства. С помощью различных политик и соответствующих наград мы сможем отвлечь внимание оппозиции и получить еще более твердую поддержку."
 KSP_valkyrie_national_reconstruction_committee:0 "Комитет национального восстановления Валькирии"
 KSP_valkyrie_national_reconstruction_committee_desc:0 "Восстановление промышленности Валькирии долгое время откладывалось из-за приоритета создания полицейского государства. Теперь мы должны восстановить нацию с помощью консолидированной системы общественной власти."
 KSP_expulsion_of_belgian_capitalists:0 "Изгнание бельгийских капиталистов"
 KSP_expulsion_of_belgian_capitalists_desc:0 "Настало время изгнать всех бельгийских капиталистов. Промышленность Валькирии должна управляться исключительно Валькирией."
 KSP_network_project:0 "Сетевой проект"
 KSP_network_project_desc:0 "Если мы соединим все промышленные системы в сеть, мы сможем значительно повысить промышленную эффективность."
 KSP_complete_recovery:0 "Полное восстановление"
 KSP_complete_recovery_desc:0 "Мы быстро восстановили промышленность Валькирии и восстановили поврежденные земли. Теперь мы должны двигаться к следующему этапу."
 KSP_sanctum_tower_recapture:0 "Возвращение Башни Святилища"
 KSP_sanctum_tower_recapture_desc:0 "Пришло время свергнуть некомпетентный Генеральный студенческий совет и взять контроль в свои руки. Мы должны подготовить тотальное наступление для Валькирии."
 KSP_new_student_council:0 "Новый Генеральный студенческий совет"
 KSP_new_student_council_desc:0 "Теперь мы — Генеральный студенческий совет. Все должны присягнуть на верность новому президенту Генерального студенческого совета, Его Превосходительству Огате Канне."
 KSP_valkyrie_central_school:0 "Центральная школа Валькирии"
 KSP_valkyrie_central_school_desc:0 "Ценность существования Генерального студенческого совета давно угасла. Мы учредим Центральную школу Валькирии и проведем решительную политику национальной интеграции."
 KSP_nation_of_the_new_era:0 "Система новой эры"
 KSP_nation_of_the_new_era_desc:0 "Изменения эпохи требуют новой системы. Полицейские Валькирии прекрасно адаптировались к новой эре, и теперь мы должны двигаться к следующей фазе."
 KSP_kanna_pardon:0 "Указ об амнистии"
 KSP_meal_restrictions:0 "Ограничение пайков"
 KSP_meal_restrictions_desc:0 "Ограничиваются пайки преступников, заключенных в Исправительном бюро."
 KSP_support_rehabilitation:0 "Социальная реабилитация"
 KSP_support_rehabilitation_desc:0 "Оказывается поддержка реабилитации."
 KSP_pardon_akira:0 "Амнистия Акиры"
 KSP_pardon_akira_desc:0 "Акире предоставляется амнистия."
 KSP_construct_prison:0 "Строительство тюрьмы"
 KSP_construct_prison_desc:0 "Строится тюрьма для заключения неисправимых студенток. Эта тюрьма будет использоваться как исправительное учреждение."
 KSP_correction_education:0 "Академическое исправительное образование"
 KSP_correction_education_desc:0 "Внедряется исправительное образование."

 KSP_kanna_defense_tech:0 "Департамент оборонных технологий"
 KSP_kanna_defense_tech_desc:0 "Для поддержания общественного порядка недостаточно просто хорошо обученных полицейских. Мы также должны подготовить различные вспомогательные инструменты, усиливающие их возможности. Для этого мы учредим Департамент оборонных технологий."
 KSP_millenium_support:0 "Поддержка Миллениума"
 KSP_millenium_support_desc:0 "Технологии Миллениума непревзойденны в Кивтос, и их обширные знания незаменимы для нас, занимающихся разработкой вооружений. Мы можем ускорить темпы исследований, предлагая судебные соглашения некоторым студенткам Миллениума, арестованным за коррупцию."
 KSP_millenium_old_supercomputer:0 "Старый суперкомпьютер"
 KSP_millenium_old_supercomputer_desc:0 "В Миллениуме новые продукты выпускаются или улучшаются ежедневно, поэтому более ранние творения часто считаются устаревшими и отправляются в закутки лабораторий. Из \"старого\" суперкомпьютера, который мы получили, могут появиться инновационные технологии, в которых мы нуждаемся."
 KSP_valkyrie_task_force:0 "Боевая полиция"
 KSP_valkyrie_task_force_tt:0 "§YМожно будет использовать одну фабрику снаряжения для боевой полиции.§!"
 KSP_valkyrie_task_force_desc:0 "Перед лицом любой угрозы полицейские Валькирии встают перед гражданами как защитный щит. Если щит сломается, они не только не смогут их защитить, но и вызовут тревогу. Мы должны вооружиться, чтобы успокоить и защитить население."
 KSP_valkyrie_of_sky:0 "Валькирия неба"
 KSP_valkyrie_of_sky_desc:0 "Сколько бы полицейских у нас ни было, существуют пределы перед лицом воздушных врагов. Если мы адаптируем вертолет AH-64 Apache к этому миру, мы сможем ожидать превосходной производительности."
 KSP_valkyrie_fast_destroyer:0 "Быстроходный катер"
 KSP_valkyrie_fast_destroyer_desc:0 "Быстроходные катера — незаменимые средства для нас, требующих быстрого реагирования, и среди морской полиции считается, что использование катеров с новыми технологиями даст положительные результаты."
 KSP_supply_tactical_baton:0 "Полицейская дубинка"
 KSP_supply_tactical_baton_desc:0 "Дубинка, созданная в результате сочетания технологий нового мира и лучших технологий Кивтос, обладает дополнительным эффектом, способным усыплять преступников примерно на три часа при ударе по голове. Среди новых полицейских она известна как \"волшебная палочка\" и стала популярным нелетальным оружием."
 KSP_goddess_of_war:0 "Богиня войны"
 KSP_goddess_of_war_desc:0 "Действия летательных аппаратов, пронзающих облака и уничтожающих вражеские линии, поистине впечатляют. Военно-воздушные силы, вселяющие надежду в союзников и ужас во врагов, по праву заслуживают имени \"богиня войны\"."
 KSP_extract_resource_from_belgium:0 "Добыча ресурсов из Бельгии"
 KSP_extract_resource_from_belgium_desc:0 "В бельгийских землях под нашим контролем дремлют многочисленные подземные ресурсы. Если мы копнем глубже с помощью технологий нашего мира, проявятся жилы, которые их технологии не смогли обнаружить."
 KSP_extract_manpower_from_belgium:0 "Добыча бельгийской рабочей силы"
 KSP_extract_manpower_from_belgium_desc:0 "Несмотря на диктатуру правительства Валькирии, бельгийское сопротивление продолжалось. Единственный способ, которым задержанные, заполняющие лагеря интернирования, могут быть полезны, — это служба на принудительных работах."
 KSP_extract_industry_from_belgium:0 "Добыча бельгийской промышленности"
 KSP_extract_industry_from_belgium_desc:0 "Поскольку Валькирия изначально была академией, предназначенной для подготовки полицейских, ее базовая промышленность чрезвычайно слаба. Использование бельгийской промышленности и инфраструктуры позволит нам укрепить наш промышленный потенциал."
 KSP_belgian_colony:0 "Департамент безопасности Бельгии"
 KSP_belgian_colony_desc:0 "Благодаря жесткой политике безопасности правительства Валькирии бельгийское сопротивление день ото дня ослабевает. Для более эффективного управления бельгийскими гражданами, которые смирились и адаптируются к нашему господству, внутри правительства активно обсуждается создание Департамента безопасности Бельгии."
 KSP_recruit_local_students:0 "Набор местных студенток"
 KSP_recruit_local_students_desc:0 "Некоторые студентки выражают недовольство из-за чрезмерной рабочей нагрузки. Если мы наберем местных студенток в Валькирию и организуем сменный график, мы сможем уменьшить недовольство и поддерживать общественный порядок более эффективно и стабильно."
 KSP_public_security_bureau_training:0 "Тренировки Управления общественной безопасности"
 KSP_public_security_bureau_training_desc:0 "В хаотичной ситуации Великого переноса студентки Валькирии долгое время не получали даже базовой подготовки. Пришло время восстановить дисциплину и распорядок Валькирии."
 KSP_rank_promotion:0 "Специальное повышение первого ранга"
 KSP_rank_promotion_desc:0 "В иерархической организации повышение после совершения великих заслуг — это естественно и почетно. Все те, кто работал на Валькирию, вполне заслуживают славной награды в виде специального повышения первого ранга. Сегодня все они — героини."
 KSP_strong_cane_of_the_people:0 "\"Крепкая дубинка\" народа"
 KSP_strong_cane_of_the_people_desc:0 "Из-за автономии каждой академии наше активное вмешательство было невозможным, и в мирное время нас воспринимали с недоверием. Однако прогрессивные студентки Валькирии, укрепленные опытом Великого переноса, больше не будут неорганизованной бандой, а станут \"крепкой дубинкой народа\"."
 KSP_police_nation:0 "Полицейское государство"
 KSP_police_nation_desc:0 "Благодаря усилиям бесчисленных студенток Валькирии мы достигли среды, в которой можем выживать независимо, ни от кого не завися. После восстановления порядка в Бельгии мы станем так называемым \"полицейским государством\" и искореним хаос, распространяющийся по миру, куя справедливость."

 KSP_kspd_tt:0 "Модификаторы §Y$KSP_kspd$§!:"
 KSP_kspd:0 "K.S.P.D"
 KSP_kspd_desc:0 "K.S.P.D — это аббревиатура Академии полиции Валькирии, организации, в которой студентки Валькирии выполняют роль полицейских. Студентки Валькирии вносят вклад в поддержание \"безопасности\" Бельгии."
 # Eventos relacionados con la ruta de dictadura
 KSP_event.102.t:0 "Специальное повышение первого ранга"
 KSP_event.102.d:0 "Мы благоразумно разрешили внутренние беспорядки и теперь хотим наградить двух офицеров, сыгравших наиболее решающую роль. Кого следует наградить?"
 KSP_event.102.a:0 "Наградим офицера, который агрессивно устранял мятежников!"
 KSP_event.102.b:0 "Наградим офицера, который вел студенток с помощью тренировок и лидерства!"

 # Modificadores
 KSP_defense_tech_center:0 "Департамент оборонных технологий"
 KSP_millenium_support_modifier:0 "Поддержка Миллениума"
 KSP_millenium_support_modifier_desc:0 "Получается поддержка от Миллениума."
 KSP_millenium_old_supercomputer_modifier:0 "Старый суперкомпьютер"
 KSP_millenium_old_supercomputer_modifier_desc:0 ""

 KSP_meal_restrictions_modifier:0 "Ограничение пайков"
 KSP_meal_restrictions_modifier_desc:0 "Ограничиваются пайки преступников, заключенных в Исправительном бюро."

 KSP_amnesty_prisoners:0 "Указ об амнистии"
 KSP_amnesty_prisoners_desc:0 "Предоставляется амнистия преступникам, заключенным в Исправительном бюро."
 KSP_rehabilitated_prisoners:0 "Реабилитированные преступники"
 KSP_rehabilitated_prisoners_desc:0 "Используются реабилитированные преступники."
 KSP_constructed_prison:0 "Тюрьма Исправительного бюро"
 KSP_constructed_prison_desc:0 "Построена тюрьма для заключения неисправимых студенток. Эта тюрьма будет использоваться как исправительное учреждение."

 KSP_trained_valkyrie_student:0 "Тренированные студентки Валькирии"
 KSP_trained_valkyrie_student_desc:0 "Развернуты тренированные студентки Валькирии."
 KSP_belgium_recruit_local_student_modifier:0 "Набор местных студенток в Бельгии"
 KSP_belgium_recruit_local_student_modifier_desc:0 "Набираются местные студентки в Бельгии."

 KSP_belgium_extract_manpower_modifier:0 "Мобилизация бельгийской рабочей силы"
 KSP_belgium_extract_manpower_modifier_desc:0 "Из Бельгии извлекается рабочая сила."

 KSP_goddess_of_war_modifier:0 "Богиня войны"
 KSP_goddess_of_war_modifier_desc:0 "Действия летательных аппаратов, пронзающих облака и уничтожающих вражеские линии, поистине впечатляют. Военно-воздушные силы, вселяющие надежду в союзников и ужас во врагов, по праву заслуживают имени \"богиня войны\"."

 KSP_belgian_security_bureau_modifier:0 "Департамент безопасности Бельгии"
 KSP_belgian_security_bureau_modifier_desc:0 "Учрежден Департамент безопасности Бельгии."

 KSP_police_nation_modifier:0 "Полицейское государство"
 KSP_police_nation_modifier_desc:0 "Установлено полицейское государство."

 KSP_police_attacker_modifier:0 "Агрессивный офицер"
 KSP_police_attacker_modifier_desc:0 "Агрессивный офицер повышен специально для увеличения оперативной эффективности."
 KSP_police_commander_modifier:0 "Командир полиции"
 KSP_police_commander_modifier_desc:0 "Офицер, руководивший с помощью тренировок и направления, повышен специально для увеличения оперативной эффективности."

 KSP_security_bureau_influential_person:0 "Влиятельная фигура Управления безопасности"

 # Seguridad ciudadana
 #KSP_nakatsukasa_kirino_leader_desc:0 "§YНакацукаса Кирино становится лидером Академии полиции Валькирии.§!"

 KSP_csi:0 "Отдел криминалистики"
 KSP_csi_desc:0 "Будет организован отдел криминалистики, состоящий из специалистов из разных областей, для расследования нераскрытых дел Кивтос и местного человечества, тем самым улучшая следственные способности Валькирии."
 KSP_ministry_of_personal_management:0 "Агентство инноваций в управлении персоналом"
 KSP_ministry_of_personal_management_desc:0 "Мы должны предотвратить возникновение новой коррупции внутри Академии полиции Валькирии с помощью периодической ротации персонала."
 KSP_fubuki_plan:0 "Предложение Фубуки"
 KSP_fubuki_plan_desc:0 "Немугаки Фубуки подчеркивает, что для адаптации Валькирии к новой эре необходима широкая демократия, и собирает поддержку различных сил Кивтос и Земли. Мы примем часть ее методологии для завершения новой системы Валькирии."
 KSP_labor_federation:0 "Маленькое счастье полицейского"
 KSP_labor_federation_desc:0 "Мы должны предпринять некоторые реформы, чтобы стереть следы режима чрезвычайного положения — когда подавлялось даже малейшее счастье — и вернуть маленькие радости, включая пончики."
 KSP_shift_work:0 "Сменная работа"
 KSP_shift_work_desc:0 "При режиме Канны массовая мобилизация полицейских сил стала повседневностью под предлогом чрезвычайных полномочий. Мы будем работать над разрешением этой ситуации и восстановлением рабочей среды старого Кивтос."
 KSP_police_labor_union:0 "Полицейский профсоюз"
 KSP_police_labor_union_desc:0 "Мы сформируем профсоюз для новой системы Академии полиции Валькирии. Представители, избранные демократическим и справедливым путем, будут расследовать возможные случаи эксплуатации труда при мобилизации полиции и улучшать различные проблемы."
 KSP_work_with_ant:0 "Сотрудничество с муравьем"
 KSP_work_with_ant_desc:0 "Для обеспечения целостности новой системы взаимное сотрудничество необходимо. Мы будем сотрудничать с фракцией Накацукасы Кирино и сделаем еще один шаг к утверждению нового режима."
 KSP_kirino_plan:0 "Предложение Кирино"
 KSP_kirino_plan_desc:0 "После Великого переноса в Кивтос Накацукаса Кирино отвечала за урегулирование большей части местного сопротивления на базовом уровне Академии полиции Валькирии и поддерживает форму сильного патернализма. Идеология, рожденная в Департаменте общественной безопасности, стремится к идеалистическому методу, уважающему культуру старой Земли и добивающемуся подлинного сосуществования между Кивтос и человечеством."
 KSP_practical_administrative:0 "Практическая администрация"
 KSP_practical_administrative_desc:0 "Накацукаса Кирино — одна из самых ярких фигур, пресытившихся бюрократизмом старой Валькирии. Мы построим лидерство, стремящееся к более практичному и реалистичному подходу для завершения системы Академии полиции Валькирии."
 KSP_basic_shooting_training:0 "Базовая стрелковая подготовка"
 KSP_basic_shooting_training_desc:0 "Студентки Академии полиции Валькирии по своей природе — полицейские; поэтому результаты их абсолютной тренировки ниже, чем у постоянных армий других академий. Пожалуйста, имейте в виду, что не потому, что меткость Накацукасы Кирино недостаточна, проводится столь масштабная стрелковая подготовка.\n- С уважением, временный президент Накацукаса Кирино -"
 KSP_effective_method:0 "Эффективный метод"
 KSP_effective_method_desc:0 "Для управления экономикой Академии полиции Валькирии необходима широкая промышленная поддержка. Мы будем активно использовать характерный для Валькирии бюрократизм и сосредоточимся на усилении контроля над промышленностью."
 KSP_work_with_grasshopper:0 "Сотрудничество с кузнечиком"
 KSP_work_with_grasshopper_desc:0 "Для обеспечения целостности новой системы взаимное сотрудничество необходимо. Мы будем сотрудничать с фракцией Немугаки Фубуки и сделаем еще один шаг к утверждению нового режима."
 KSP_overtime_pay:0 "Оплата сверхурочных"
 KSP_overtime_pay_desc:0 "Помня о том, что с Великого переноса разброс полиции Валькирии сделал сверхурочную работу рутиной, мы твердо пропишем четкое законодательство об их оплате."
 KSP_incentive:0 "Стимулы"
 KSP_incentive_desc:0 "Полицейские с высокой производительностью будут получать стимулы, включая почетные грамоты. Благодаря этому мы сможем исправить халатность в Валькирии и повысить эффективность работы."
 KSP_valkyrie_federation:0 "Федерация Валькирии"
 KSP_valkyrie_federation_desc:0 "Созерцая полностью сформированную новую систему Академии полиции Валькирии, мы восхвалим функционирование режима, который выковали своими руками."
 KSP_support_entrepreneur:0 "Поддержка предпринимателей"
 KSP_support_entrepreneur_desc:0 "Оказывается поддержка предпринимателям."
 KSP_secure_coast:0 "Обеспечить побережье"
 KSP_secure_coast_desc:0 "Обеспечивается побережье."
 KSP_integrated_safty_bureau:0 "Интегрированный департамент безопасности"
 KSP_integrated_safty_bureau_desc:0 "Организуется Интегрированный департамент безопасности."

