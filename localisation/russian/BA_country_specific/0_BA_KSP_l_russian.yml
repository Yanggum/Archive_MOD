 KSP_kanna_health_and_gov_problems:0 "Шаткое правительство"
 KSP_kanna_health_and_gov_problems_desc:0 "С ухудшением здоровья Канны внутри Академии полиции Валькирии стало чрезвычайно хаотично. Пользуясь ее падением, снова зашевелились студентки с позициями, отличными от текущей системы, которую она подавляла, а те, кто ведет администрацию, испытывают трудности с обработкой объема работы, резко возросшего из-за отсутствия централизованного контроля.\n\nОднако эта опасная ситуация — в которой административная способность Валькирии сильно пострадала из-за отсутствия §YКанны§! — может быть возможностью для §Yкого-то§!, стремящегося сохранить свой собственный режим. Если нам удастся предотвратить чрезмерность §tвоздействия§! административного коллапса, этот кризис может значительно усилить их власть...\n\nТекущая административная трудность Валькирии отображается как значение §tадминистративного коллапса§!, которое составляет §R[?KSP_gov_hangjung_disorder_var]§! из максимума §R20§!. Студентки будут постепенно привыкать к работе каждые §G[?KSP_getting_used_to_work_gov_var]§! дней, но в процессе могут возникнуть проблемы — будь то §Rнамеренные§! или §Cненамеренные§!.\n\nКроме того, мы также должны следить за §tОбщественной безопасностью§! и §8Управлением безопасности§!, которые недовольны текущей системой. Если их влияние возрастет слишком сильно, они подготовят государственный переворот!"
 KSP_getting_used_to_work_gov:0 "Студентки привыкают к работе"
 KSP_getting_used_to_work_gov_desc:0 ""
 KSP_getting_used_to_work_gov_tt:0 "Текущий административный коллапс составляет §R[?KSP_gov_hangjung_disorder_var]§! из 20; когда это решение будет выполнено, он уменьшится на §G1§!."
