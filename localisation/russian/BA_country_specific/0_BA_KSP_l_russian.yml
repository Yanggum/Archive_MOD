 KSP_anti_eu_hegemony_desc:0 "Чтобы вырвать с корнем европейские культурные, социальные и политические модели — стоящие намного ниже культуры Кивтос — полицейские Валькирии инициируют решительный процесс широкомасштабной социальной реструктуризации."

