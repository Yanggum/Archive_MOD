 KSP_weak_army:0 "Военная слабость Валькирии"
 KSP_weak_army_desc:0 "Даже в Кивтос студенток Академии полиции Валькирии презирали даже преступники из-за многочисленных ограничений и общей нехватки навыков. Упав в этот новый мир, большинство ограничений, сковывавших нас, исчезло, но тот факт, что боевая мощь Валькирии все еще ниже, чем у других академий, пока не изменился."
