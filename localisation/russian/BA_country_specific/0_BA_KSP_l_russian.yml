 #재액의 여우
 KSP_wakamo_problem:0 "Побег Бедствия"
 KSP_wakamo_problem_desc:0 "Федеральное исправительное бюро сосредоточило все усилия, чтобы предотвратить побег Семи Заключенных, но даже это достигло предела. Теперь мы должны подчинить врага совершенно иного уровня, чем заключенные, которые сегодня разгуливают на свободе."
 KSP_suppressing_plan_sustain:0 "Начало операции подавления"
 KSP_suppressing_plan_sustain_desc:0 "После краха Федерального исправительного бюро побег еще большего числа заключенных ускоряет социальный хаос. Мы должны действовать быстро, прежде чем Валькирия рухнет."
 KSP_hyeongi_help_more:0 "Усиление бельгийского сотрудничества"
 KSP_hyeongi_help_more_desc:0 "С падения бельгийского правительства в ноябре 1935 года бельгийцы поддерживали враждебные отношения с нами. Но с усугублением хаоса из-за краха Федерального исправительного бюро они решили сотрудничать с нами, чтобы избежать гибели обеих сторон."
 KSP_skeban_suppress:0 "Подавить сукэбан"
 KSP_skeban_suppress_desc:0 "Мы должны применить силу, чтобы снова заключить сукэбан в Исправительное бюро."
 KSP_country_plan_wakamo:0 "Начало общенационального подавления"
 KSP_country_plan_wakamo_desc:0 "Теперь, когда бельгийская поддержка возросла, а мешавшие сукэбан подавлены, настало время начать общенациональную операцию подавления, мобилизовав даже оставшуюся рабочую силу."
 KSP_use_everything:0 "Тотальная война"
 KSP_use_everything_desc:0 ""

 #얘는 디시전으로 빠짐
 KSP_wakamo_showdown:0 "Решить раз и навсегда"
 KSP_wakamo_showdown_desc:0 "Время пришло. Мы обнаружили Вакамо, одну из Семи Заключенных. Хотя у нас нет поддержки Специальной академии SRT, если по неизвестным причинам загадка всех ослабла, наши студентки должны быть в состоянии арестовать ее."

 KSP_kanna_jungwun_uzi:0 "Оценить ситуацию"
 KSP_kanna_jungwun_uzi_desc:0 "Внезапно, из-за неизвестного феномена, мы упали в новый мир, о котором ничего не знали. Поэтому мы должны понять текущую ситуацию через бельгийцев, которые утверждают, что являются исконными хозяевами этого региона."

 #연정
 KSP_with_our_friends:0 "Отношение к бельгийцам"
 KSP_with_our_friends_desc:0 "Мы поняли, что эта земля — наша и также их. Ради будущего Валькирии и Бельгии мы должны сотрудничать."
 KSP_talk_with_moderate_partys:0 "Диалог с бельгийскими левыми"
 KSP_talk_with_moderate_partys_desc:0 "В ходе диалога мы подтвердили, что 'тоталитаризм' партии Рекс, которая сейчас расширяет свою власть, принесет лишь еще больший хаос. Чтобы остановить их, мы должны связаться с фигурами из старого бельгийского правительства."
 KSP_inminjunsun:0 "Народный фронт"
 KSP_inminjunsun_desc:0 "Чтобы противостоять фашистам из партии Рекс, нам нужно сформировать широкую коалицию демократов и социалистов."
 KSP_citizen_danchae_help:0 "Вместе с гражданскими организациями"
 KSP_citizen_danchae_help_desc:0 "Мы должны сосредоточиться на полном восстановлении бельгийского правительства и парламента, рухнувших из-за Великого переноса."
 KSP_nojo_help:0 "Вместе с профсоюзами"
 KSP_nojo_help_desc:0 "Социалистическая идеология довольно похожа на политику благосостояния Кивтос. Если мы их поддержим, возможно, мы сможем установить бельгийское правительство, более похожее на нас."
 KSP_talk_with_hardliners:0 "Диалог с бельгийскими правыми"
 KSP_talk_with_hardliners_desc:0 "В ходе диалога мы выявили, что либералы и социалисты отказываются признавать нас и группируются, чтобы противостоять нам. Для стабилизации общества необходимо сильное средство контроля, и партия Рекс может стать этим средством."
 KSP_rex_empower:0 "Укрепить партию Рекс"
 KSP_rex_empower_desc:0 "Либералы и социалисты формируют широкий единый фронт, чтобы остановить нас. Мы должны поддержать партию Рекс и разрушить их амбиции."
 KSP_gukwangdang:0 "Поддержка монархизма"
 KSP_gukwangdang_desc:0 "Лидер партии Рекс, Леон Дегрель, не сотрудничает с нами из-за своих амбиций. Если мы окажем тайную поддержку монархистам внутри Рекса, возможно, мы сможем увеличить авторитет Леопольда III и превратить партию в более склонную к сотрудничеству."
 KSP_fascism_rule:0 "Принять фашизм"
 KSP_fascism_rule_desc:0 "Их фашистская ориентация очень помогла в стабилизации общества. Если мы применим ее и к себе, мы сможем построить более сильное общество."
 KSP_government_ganghwa_NOT:0 "Тотальное уничтожение бельгийского сопротивления"
 KSP_government_ganghwa_NOT_desc:0 "Теперь, когда 'Полицейское государство' показало, что мы можем остановить бельгийское сопротивление, нет причин проявлять снисхождение к коллаборационистам. Чтобы защитить культуру Валькирии-Кивтос, мы должны уничтожить все организации сопротивления."
 KSP_government_ganghwa:0 "Сформировать блок сотрудничества"
 KSP_government_ganghwa_desc:0 "Если мы соберем бельгийцев, готовых сотрудничать, и сформируем новый блок сотрудничества, это очень поможет в управлении внутренними делами."
 KSP_cooperation_with_the_left:0 "Сотрудничество с бельгийскими левыми"
 KSP_cooperation_with_the_left_desc:0 "Мы будем сотрудничать с Рабочим фронтом, классифицируемым как левая фракция среди местных сил сопротивления, желающих восстановления старой Бельгии, чтобы стабилизировать бельгийское общество."
 KSP_remove_bandaepa:0 "Устранить оппозицию"
 KSP_remove_bandaepa_desc:0 "В Бельгии все еще существуют оппозиционные фракции, не признающие это коалиционное правительство. Если они продолжат возражать, они станут препятствием на нашем пути."
 KSP_belgium_gov_helpers:0 "Распределение задач между бельгийскими бюрократами"
 KSP_belgium_gov_helpers_desc:0 "Устранив оппозицию, мы должны заполнить образовавшиеся внутри правительства вакансии."
 KSP_belgium_heart:0 "Воля Бельгии"
 KSP_belgium_heart_desc:0 "В ноябре 1935 года бельгийское правительство исчезло из-за Великого переноса; однако мы выжили и вместе с нашими новыми друзьями сформировали новое правительство. Мы больше не упадем, и наша Бельгия будет вечна!"
 KSP_stabilize_inside:0 "Внутренняя стабилизация"
 KSP_stabilize_inside_desc:0 "Мы должны раздавить Рабочий фронт: антигосударственную организацию, поднятую сотрудничеством Бельгийской рабочей партии и Коммунистической партии, которая расшатывает административные процедуры Валькирии и Бельгии."
 KSP_belgian_simin_help:0 "Мобилизация бельгийских граждан"
 KSP_belgian_simin_help_desc:0 "Следуя совету партии Рекс, мы можем мобилизовать бельгийских граждан для проектов восстановления."
 KSP_country_rebuild_danguk:0 "Учредить Валлонское восстановительное управление"
 KSP_country_rebuild_danguk_desc:0 "Мы стабилизировали регион, но инфраструктура и промышленные объекты все еще разрушены. Мы должны учредить восстановительное управление для будущих проектов."
 KSP_rebuild_roads:0 "Восстановить дорожную сеть"
 KSP_rebuild_roads_desc:0 "Чтобы работать беспрепятственно, мы сначала должны восстановить дорожную сеть."
 KSP_belgian_sanup_control:0 "Использовать бельгийскую промышленность"
 KSP_belgian_sanup_control_desc:0 "Удивительно, но даже в этой катастрофической ситуации мы подтвердили, что некоторые промышленные объекты все еще работают нормально. Это нам очень поможет."
 KSP_belgian_sanup_hwakjang:0 "Принудительное расширение бельгийской промышленности"
 KSP_belgian_sanup_hwakjang_desc:0 "Учитывая ситуацию в соседних странах, очевидно, что в ближайшее время на нас обрушится серьезная проблема национальной безопасности. Чтобы подготовиться, даже если недовольство возрастет, нам придется выжимать рабочую силу день и ночь для нормализации промышленности."
 KSP_chian_uzi_students:0 "Мобилизовать студенческую полицию"
 KSP_chian_uzi_students_desc:0 "Чтобы справиться с ополчениями партии Рекс, необходимо широкое сотрудничество граждан и полиции. Мы мобилизуем полицейских Валькирии и, с доносами от Рабочего фронта, проведем массовую операцию по уничтожению рексистов."
 KSP_cooperation_with_the_right:0 "Сотрудничество с бельгийскими правыми"
 KSP_cooperation_with_the_right_desc:0 "Мы будем сотрудничать с партией Рекс в Валлонии, классифицируемой как правая фракция среди местных сил сопротивления, желающих восстановления старой Бельгии, чтобы стабилизировать бельгийскую политику."
 KSP_valkyrie_government_tonghap:0 "Внутреннее единство"
 KSP_valkyrie_government_tonghap_desc:0 "Все еще есть много студенток с опасениями и недовольством из-за союза с бельгийцами. Мы должны успокоить это недовольство для поддержания плавных отношений."
 KSP_sanghwal_safety_helping:0 "Сотрудничество Общественной безопасности"
 KSP_sanghwal_safety_helping_desc:0 ""
 KSP_gyeongbiguk_helping:0 "Сотрудничество Управления безопасности"
 KSP_gyeongbiguk_helping_desc:0 ""
 KSP_kanna_gov_empower:0 "Расширить влияние правительства Канны"
 KSP_kanna_gov_empower_desc:0 "Хотя сегодня мы сотрудничаем с бельгийцами, мы также должны не допустить, чтобы их влияние чрезмерно возросло внутри правительства."
 KSP_gov_gaepyeon_0:0 "Реорганизация правительства"
 KSP_gov_gaepyeon_0_desc:0 "Для более плавного администрирования мы должны реорганизовать департаменты Валькирии внутри правительства в сотрудничестве с бельгийцами."
 KSP_gwanleojae_sulgae:0 "Реформа бюрократии Валькирии"
 KSP_gwanleojae_sulgae_desc:0 "Принимая советы Бельгийской коммунистической партии и Рабочей партии, мы улучшим систему и реорганизуем бюрократию Валькирии, чтобы сделать ее более эффективной."
 KSP_kanna_gov:0 "Сосредоточено на Канне"
 KSP_kanna_gov_desc:0 "Централизованное сосредоточение власти директора Канны поможет предотвратить внутренние конфликты и повысить национальную сплоченность."
 KSP_students_have_power:0 "Сосредоточено на студентках"
 KSP_students_have_power_desc:0 "Давать возможности студенткам и принимать их разнообразные мнения тоже было бы неплохим вариантом."
 KSP_students_working_camp:0 "Студенческая рабочая сила"
 KSP_students_working_camp_desc:0 "Что нам сейчас нужно, так это рабочие. Если мы припишем доступных студенток к Восстановительному управлению и отправим их на стройки, это поможет."
 KSP_student_volunteers:0 "Специализация студенческого труда"
 KSP_student_volunteers_desc:0 "Кажется, у некоторых наших студенток есть талант к гражданскому строительству. Если мы усилим их специализацию, мы сможем эффективно распределять рабочую силу и ускорить завершение работ."
 KSP_rebuild_country:0 "Восстановить опустошенную территорию"
 KSP_rebuild_country_desc:0 "Спустя долгое время инфраструктура ключевых районов была восстановлена, и люди снова начинают обретать жизненную силу."
 KSP_two_together:0 "Сосуществование"
 KSP_two_together_desc:0 "Мы находимся на одной территории, но Валькирия и Бельгия по сути различны по истории, культуре и ценностям. Поэтому мы выберем сосуществование."
 KSP_fusion:0 "Слияние"
 KSP_fusion_desc:0 "Валькирия и Бельгия преодолели множество испытаний и невзгод, скрепив прочную связь. Отныне мы объединимся, чтобы встретить еще большие вызовы!"
 KSP_tonghap_junbi:0 "Приготовления к интеграции"
 KSP_tonghap_junbi_desc:0 ""
 KSP_give_students_simingwun:0 "Предоставить гражданство студенткам"
 KSP_give_students_simingwun_desc:0 "Для социальной интеграции мы также предоставим гражданство студенткам."
 KSP_two_gov_tonghap:0 "Интеграция функций"
 KSP_two_gov_tonghap_desc:0 ""
 KSP_two_gov_chaegae:0 "Система двух правительств"
 KSP_two_gov_chaegae_desc:0 "Мы сформируем отдельные правительства и гарантируем высокую степень взаимной автономии."
 KSP_gujugu_bunri:0 "Разделение жилых зон"
 KSP_gujugu_bunri_desc:0 ""
 KSP_upmu_bulri_tech:0 "Разделение функций"
 KSP_upmu_bulri_tech_desc:0 ""
 KSP_yunjung_over:0 "Совместное правительство"
 KSP_yunjung_over_desc:0 "С социальной стабилизацией больше нет необходимости формировать коалиционное правительство; теперь мы будем жить вместе под одним именем."

