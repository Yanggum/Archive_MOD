 KSP_fight_with_wakamo:0 "Лиса Бедствия"
 KSP_fight_with_wakamo_desc:0 "Одна из Семи Заключенных, сбежавшая из сильно поврежденного Великим переносом Федерального исправительного бюро: Косака Вакамо, Лиса Бедствия. Сбежав, она объединилась с другими сбежавшими заключенными и местными преступниками и продолжает партизанскую войну на этой новой земле, где мы обосновались.\n\nДля стабилизации Академии полиции Валькирии и этой новой земли, Валлонии, необходимо подавить Лису Бедствия."
