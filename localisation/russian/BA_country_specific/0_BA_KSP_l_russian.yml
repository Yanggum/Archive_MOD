 # Enfoques de independencia del Departamento de Seguridad Ciudadana
 KSP_independence_claim_1:0 "Полностью изъять следственную юрисдикцию у Шале"
 KSP_independence_claim_1_desc:0 "Лишить Шале всей следственной юрисдикции — последний шаг к защите суверенитета Академии полиции Валькирии. Невыносимо, чтобы простой ИИ вмешивался во все, находясь над нами. Мы не можем больше мириться с этой ситуацией. Лишить эту кучу металлолома следственных полномочий и вернуть то, что изначально было нашим, — вот единственное, чего мы хотим."
 KSP_independence_claim_2:0 "Государство Кивтос Валькирия"
 KSP_independence_claim_2_desc:0 "Мы — независимый административный и следственный орган; мы никому не принадлежим. Мы автономно определяем правила, наказание нарушителей и операции по задержанию. Наше нынешнее руководство — это Студенческий совет. Хотя номинально мы зависим от Шале, официально оформить нашу независимость можно простой декларацией. Стереть имя Шале с плакатов достаточно одного нашего приказа."
 KSP_valkyrie_alliance:0 "Альянс Валькирии"

 # Enfoques de conquista e integración
 KSP_massive_correct_plan:0 "Массовый план исправления"
 KSP_massive_correct_plan_desc:0 "Основными задачами Академии полиции Валькирии являются поддержание порядка и исправление. В прошлом она не могла должным образом выполнять их даже в своей собственной юрисдикции, но теперь ситуация иная. Все готово: мы готовы сформулировать и выполнить стратегию исправления. Валькирия готова передавать преступников в Исправительное бюро и восстанавливать порядок."
 KSP_srt_correct_plan:0 "Тотальный розыск"
 KSP_srt_correct_plan_desc:0 "Банда Бретани действует независимо и была замешана в многочисленных терактах. Это, должно быть, происходило с одобрения ее руководства. Их преступления очевидны, и наш арест — законный долг. Скоро мы встретимся с ними лицом к лицу в тюрьме Исправительного бюро."
 KSP_mil_correct_plan:0 "План исправления Миллениума"
 KSP_mil_correct_plan_desc:0 "Научная школа Миллениума продолжает свои политические споры с перестрелками и бомбардировками на традиционной территории Франции, препятствуя миру. Это очевидный враждебный акт, и их вторжение на французскую территорию дает нам прочное основание для действий. Мы уже уведомили руководство: это недвусмысленный сигнал о том, что они должны быть исправлены."
 KSP_heu_correct_plan:0 "Арест детективного агентства"
 KSP_heu_correct_plan_desc:0 "'Детективное агентство', расположенное в анархической зоне недалеко от нашей границы, возглавляется исключенными из Академии Генны. Они являются главными виновниками приграничного терроризма и постоянной помехой, выполняющей любые заказы за деньги. Мы больше не потерпим этого. Наши дубинки и наручники вершат над ними правосудие!"
 KSP_geh_correct_plan:0 "План исправления Генны"
 KSP_geh_correct_plan_desc:0 "Генна — это преступная группировка, презирающая дисциплину. Даже после достижения политических побед им плевать на собственную безопасность. Пока продолжаются теракты и засады против студенток Валькирии, Генна не предприняла никаких дипломатических контактов. Если они не собираются исправляться сами, мы их исправим."
 KSP_schale_correct_plan:0 "План исправления Шале"
 KSP_schale_correct_plan_desc:0 "Шале — это внеправовой клуб, созданный нынешним президентом Студенческого совета; его цель неясна, но сегодня он контролируется ИИ. Президент Совета пропал без вести. Руководство Валькирии опасается восстания ИИ, и этот высокомерный ИИ скоро будет уничтожен."
 KSP_ragnarok:0 "Рагнарёк"
 KSP_ragnarok_desc:0 "Академия теперь смотрит на восток. Пушки готовятся нацелиться на все академии: Тринити, Шанхайцзин, Абидос, Хяккияко, Красную Зиму и другие. Мы готовы сражаться с теми, кто выступит против. Мы станем Кивтос и сожжем все препятствия. Сжечь все... через Рагнарёк."

 KSP_total_correct_economy:0 "Интегрированная экономика исправления"

