 KSP_event.33.t:0 "Неудача в отражении Вакамо"
 KSP_event.33.d:0 "Несмотря на все наши усилия, отразить Вакамо не удалось. Она становится еще большей угрозой для студенток Академии полиции Валькирии."
 KSP_event.33.a:0 "Это катастрофа!"

 KSP_event.34.t:0 "Успех в отражении Вакамо"
 KSP_event.34.d:0 "После бесчисленных трудностей нам удалось отразить Вакамо. Нам не удалось захватить ее, но если мы приложим еще немного усилий, мы сможем ее подавить."
 KSP_event.34.a:0 "Вот именно!"

 KSP_event.35.t:0 "Накопление ущерба"
 KSP_event.35.d:0 "Из-за беспорядков ущерб территории продолжает накапливаться. Предвидится, что его восстановление потребует значительного времени."
 KSP_event.35.a:0 "...Проклятье!"

 KSP_event.36.t:0 "Взять под контроль Генеральный студенческий совет"
 KSP_event.36.d:0 "Поскольку мы заняли все территории Генерального студенческого совета и контролируем Башню Святилища, мы теперь можем провозгласить Генеральный студенческий совет Кивтос, унаследовав волю исчезнувшего предыдущего президента, и заявить, что мы являемся законным руководящим органом Кивтос."
 KSP_event.36.a:0 "Это ради поддержания порядка..."

 KSP_event.37.t:0 "Канна рухнула"
 KSP_event.37.d:0 "Этим утром новость о том, что Огата Канна рухнула из-за ухудшения здоровья от переутомления, распространилась по всей Академии полиции Валькирии. Академия мгновенно погрузилась в тревогу, и административная структура, реформированная вокруг студенток, начала шататься из-за отсутствия Канны.\n\nФракционность внутри Валькирии, которую Канна сдерживала, чтобы реагировать на чрезвычайную ситуацию, также подняла голову после ее падения; пользуясь параличом Управления общественной безопасности, Общественная безопасность и Управление безопасности постепенно расширяют свои силы.\n\nМаленькие внутренние трещины Академии полиции Валькирии снова начинают расширяться..."
 KSP_event.37.a:0 "...Что!?"

 KSP_event.38.t:0 "Работа продолжает продвигаться"
 KSP_event.38.d:0 "Верно, что Огата Канна оказывала огромное влияние на администрацию Академии полиции Валькирии. Однако ее отсутствие не привело к полному параличу.\n\nКритические вопросы, требующие решения высшего руководства, полностью остановились, но остальные задачи студентки смогли выполнять, более или менее, самостоятельно. Без Канны — способной разместить огромный объем работы в нужном месте — административная эффективность резко упала, но не до такой степени, чтобы академия рухнула."
 KSP_event.38.a:0 "Можно... более или менее?"

 KSP_event.39.t:0 "Переворот Общественной безопасности"
 KSP_event.39.d:0 "Нынешнее правительство Академии полиции Валькирии, без Канны, не смогло адекватно отреагировать на ускоряющийся административный коллапс и, наоборот, ухудшило ситуацию. Накацукаса Кирино, лидер радикальной фракции Общественной безопасности, осудила положение дел и вместе со следовавшими за ней студентками штурмовала правительство. Подавив небольшую группу верных Канне, она объявила о создании новой социалистической академии. Огата Канна, тихо восстанавливавшаяся, услышав эту новость, исчезла без следа; и студентки Валькирии, и жители Валлонии положительно восприняли эту новую перемену.\n\nАвторитарное правление Огаты Канны подошло к концу, и теперь началась новая эра, в которой студентки являются истинными хозяйками академии."
 KSP_event.39.a:0 "Победа народа!"

 #이벤트(구)
 KSP_event.1.t:0 "Трудности Канны"
 KSP_event.1.d:0 "\"Хаа… что, черт возьми, мне делать?\"\n\nБормоча про себя, в монологе, который никто не слышал, Огата Канна — нынешний лидер Академии полиции Валькирии и директор Управления общественной безопасности — медленно читала документы, которые ей представили. В них без прикрас — или, честно говоря, на грани краха — было изложено плачевное состояние академии.\n\nНебольшое, но явное увеличение преступности внутри самой 'полицейской академии', которая должна подавлять преступность; вооруженные столкновения, саботаж, протесты и демонстрации из-за конфликта с бельгийцами; разрыв поддержки Генерального студенческого совета и нехватка бюджета и оборудования из-за промышленной структуры, полностью отличной от Кивтос; и, кроме того, медленно возникающие внутренние фракции.\n\nДо сих пор личный авторитет Канны и временные меры, полученные выжиманием несуществующих ресурсов, сдерживали все это… но предел приближался.\n\nЕсли так продолжится, Академия полиции Валькирии рухнет.\n\nИ Огата Канна не могла этого допустить.\n\nРади студенток Валькирии, которые с трудом собрались здесь и доверяют ей… и ради ее собственных убеждений.\n\n\"Генеральный студенческий совет…\"\n\nОна снова и снова просила помощи у Генерального студенческого совета, который изначально должен был протянуть им руку, но ответ всегда был 'невозможно'. По их словам, у них тоже были проблемы с тех пор, как они упали в этот другой мир.\n\nКанна больше не могла просто наблюдать.\n\n\"…Это не то, что я могу решить одна…\""
 KSP_event.1.a:0 "Придется созвать совещание по контрмерам."

 KSP_event.5.t:0 "Начало совещания по контрмерам"
 KSP_event.5.d:0 "\"Итак… зачем нас собрали?\"\n\n\"Ради будущего Валькирии.\"\n\nРуководители департаментов, собравшиеся на Первое совещание по контрмерам Валькирии, услышав Канну, еще больше ожесточили свои и без того напряженные лица.\n\nВсе присутствующие знали, в каком состоянии находится Валькирия.\n\nОна должна была рухнуть давно, но с Великого переноса Канна и перевезенные вместе с ней административные департаменты были выжаты до предела, экономя ресурсы до бесчеловечности, чтобы поддерживать ее жизнь.\n\nЧто Канна сказала это, могло означать только…\n\n\"Мы достигли предела. Выжимать больше нечего.\"\n\n\"…\"\n\nТишина сказала все.\nМестное снабжение никогда не могло собрать ресурсы, необходимые Валькирии.\n\n\"Итак, отныне мы должны найти способ решить это. Ради выживания Академии полиции Валькирии.\"\n\nВсе присутствующие знали: такого 'способа' не существует.\nЕсли бы он существовал, Канна бы его уже нашла.\n\n"
 KSP_event.5.a:0 "Началось совещание, с самого начала лишенное ответов."

 KSP_event.2.t:0 "Проблема вооружения"
 KSP_event.2.d:0 "\"…Вы говорите, что даже это уже кончилось?\"\n\n\"Именно так.\"\n\nКанна горько улыбнулась, увидев выражение ошеломления на лице студентки, задавшей вопрос.\n\n'Не верится. Я бы тоже не поверила, прежде чем получила отчет.'\n\nАкадемии полиции Валькирии не хватает всего.\n\nНе только предметов первой необходимости для повседневной жизни, но и боеприпасов — более необходимых, чем когда-либо, теперь, когда Тайна ослабла, — чтобы студентки могли защищаться.\n\nБольшинство добывалось на месте, но из-за вражды с бельгийцами местная промышленность, доступная Валькирии, была крайне ограничена… и даже этого не хватало.\n\nИ в довершение всего, постоянный саботаж, беспорядки и вооруженные демонстрации почти ежедневно. Столкновения между бельгийцами и студентками Валькирии продолжались, и бюджет, выделяемый на это, был огромен, поэтому условия жизни студенток не могли не ухудшаться.\n\n\"Сначала мы резко сократим бюджет ненужных департаментов и направим его на жизнь студенток Валькирии: на развитие и активизацию промышленности и на получение предметов первой необходимости и необходимого для жизни.\"\n\nСобравшиеся директора кивнули в ответ на то, что по видимости было очевидным выводом.\n\nНо, как всегда, мало что решается временными заплатками. Есть много областей, где нужно тратить, и мало где можно сократить.\n\nИ области, где Канна могла сокращать, были уже определены.\nКанна слегка повернула голову и посмотрела на временного директора Управления безопасности, назначенного ею самой.\n\n'Сокращение вооружений будет иметь серьезные долгосрочные последствия. Но… сейчас нет другого выбора.'"
 KSP_event.2.a:0 "…Будет ли все хорошо?"

 KSP_event.7.t:0 "Начальник Управления безопасности"
 KSP_event.7.d:0 "Временный директор Управления безопасности чувствовала себя глубоко неуютно на том совещании, которое вела директор Общественной безопасности Канна.\nПотому что, по ее мнению, она не была той, кто должен был сидеть в таком месте.\nДо падения в это неизвестное место под названием Европа она была просто обычной студенткой третьего курса Управления безопасности.\nОна отработала полных три года в Генне, знаменитой тем, что не дает ни дня отдыха, но, так как она была не единственной, она никогда не считала себя ветераном.\n\n'Честно говоря… я даже не так уж старалась.'\n\nНо все изменилось с Великим переносом.\nСразу после него Валькирия потеряла связь со всеми студентками, отправленными за границу, и вместе с ними исчезли начальник Управления безопасности и многие другие.\nПеред лицом этой беспрецедентной ситуации Канна решила, что нельзя оставлять вакантными так много ключевых постов, и временно назначила тех, кто остался в академии. Так она стала, внезапно, начальником Управления безопасности.\n\nОтветственность была слишком тяжела.\n\nПеред ней несколько студенток излагали свои мнения.\nНа самом деле она знала ответ.\nПри ограниченном бюджете первое, что нужно сокращать, — это военные расходы: это знал каждый.\nКогда возникла эта тема, она заговорила без колебаний.\n\n\"Я откажусь от бюджета Управления безопасности. Нет… можете даже распустить департамент.\"\n\nВсе посмотрели на нее.\nКанна тоже смотрела на нее, с неловким выражением.\nЕй не нравилось это решение?\n\n\"Это… позиция Управления безопасности?\"\n\n\"Да.\"\n\nКанна кивнула и ответила.\n\n\"Поняла.\"\n\nНачальник Управления безопасности медленно опустила голову.\nКакова бы ни была причина, она сделала ужасную вещь по отношению к своим товарищам и младшим, которые доверяли ей.\n\nОна пробормотала тихо. Извинение, которое никто не мог услышать."
 KSP_event.7.a:0 "…Простите, все."

 KSP_event.12.t:0 "Проблема поддержания порядка"
 KSP_event.12.d:0 "Кто-то спрашивает, как будет поддерживаться порядок, если бюджет Управления безопасности резко сократить. Канна предлагает использовать только необходимый минимум огнестрельного оружия и применять холодное оружие. Временный начальник Общественной безопасности, сидящая рядом, предлагает мобилизовать бельгийские коллаборационистские ополчения. Некоторым это не нравится, но большинство одобряет."
 KSP_event.12.a:0 ""

 KSP_event.10.t:0 "Проблема Исправительного бюро"
 KSP_event.10.d:0 "Обсуждается, что делать с рухнувшим Исправительным бюро, и Канна утверждает: \"У Валькирии обязательно должно быть Исправительное бюро\". Остальные согласны."
 KSP_event.10.a:0 "Валькирия всегда будет полицией. Всегда."

 KSP_event.11.t:0 "Тем временем..."
 KSP_event.11.d:0 "Снаружи здания, где проходило совещание, две студентки идут с изможденными лицами. Они говорят о том, что если действительно проводят совещание по контрмерам, может, когда оно закончится, ситуация немного улучшится."
 KSP_event.11.a:0 "Мы тоже это переживем."

 KSP_event.13.t:0 "Конец совещания по контрмерам"
 KSP_event.13.d:0 "Совещание завершилось, и посыл был таков: все должны терпеть и продолжать двигаться вперед."
 KSP_event.13.a:0 "А теперь пойдем строить будущее Академии полиции Валькирии."

 KSP_event.6.t:0 "Встреча с бельгийским лидером"
 KSP_event.6.d:0 "Канне удалось встретиться с важными фигурами Бельгии, страны, которая изначально существовала на этих землях, но у бельгийской делегации даже не было единой позиции между собой, поэтому Канна вернулась, не сумев провести конструктивную беседу."
 KSP_event.6.a:0 "..."

 KSP_event.17.t:0 "Переговоры с бельгийской делегацией"
 KSP_event.17.d:0 "В течение долгих часов велись переговоры с бельгийской делегацией, но требования обеих сторон только встречались в пустоте. В конце концов, когда делегация Валькирии встала первой и бросила угрозу, переговоры завершились.\n\nОбщественная безопасность продвигает идею возложить ответственность за провал на Управление общественной безопасности, и политическая ситуация в Академии полиции Валькирии погружается еще глубже в замешательство. Мы должны разрешить этот кризис."
 KSP_event.17.a:0 "А теперь пойдем строить будущее Академии полиции Валькирии."

 KSP_event.18.t:0 "Интеграция отряда SRT в Академию полиции Валькирии"
 KSP_event.18.d:0 "С исчезновением президента Генерального студенческого совета Академия полиции Валькирии запросила, чтобы Специальная академия SRT была передана под ее юрисдикцию.\n\nSRT, наследие президента Совета, теперь имеет неопределенный контроль после ее исчезновения. Мы должны решить ее судьбу."
 KSP_event.18.a:0 "Одобрено. Поможем Академии полиции Валькирии."
 KSP_event.18.b:0 "Отклонено. Мы можем справиться сами."

 KSP_event.19.t:0 "Одобрение Генерального студенческого совета"
 KSP_event.19.d:0 "Генеральный студенческий совет одобрил передачу SRT, ссылаясь на конкуренцию за влияние с Шале. Теперь мы должны использовать политическое наступление, чтобы изгнать влияние Шале и интегрировать SRT в нашу академию."
 KSP_event.19.a:0 "Превосходный результат."

 KSP_event.20.t:0 "Отказ Генерального студенческого совета"
 KSP_event.20.d:0 "Генеральный студенческий совет отклонил запрос, ссылаясь на то, что сохраняет адекватный контроль над SRT, несмотря на то, что ситуация — с конкуренцией за влияние против Шале — практически гражданская война."
 KSP_event.20.a:0 "Какое упрямство."

