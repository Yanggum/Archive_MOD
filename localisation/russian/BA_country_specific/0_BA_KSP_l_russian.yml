 KSP_event.26.t:0 "Вновь зажженное пламя"
 KSP_event.26.d:0 "Неоднократные репрессии правительства Валькирии в регионе Валлонии наконец достигли предела, и бельгийцы — несмотря на усиленное наблюдение — смогли построить эффективную сеть для сопротивления нам.\n\nМы должны подготовиться к переговорам с бельгийцами в ближайшее время, и сотрудничество с партией Рекс или с Рабочим фронтом будет необходимо."
