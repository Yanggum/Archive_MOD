 ## Golpe de Kirino
 KSP_event.115.t:0 "Экстренный арест директора общественной безопасности Канны"
 KSP_event.115.d:0 "Накацукаса Кирино испытывала легкое чувство вины. Как бы там ни было… правильно ли было так поступать с директором Канной? Кирино вспомнила, как во время патруля директор отчитывала ее. Ужасающим голосом Канна произнесла фамилию Накацукаса и объяснила, что невежливо целиться из пистолета в бельгийца для досмотра на улице. Директор Канна была такой классной и харизматичной! Кирино посмотрела на наручники в своей руке. Звяканье металла говорило ей, что, какой бы директор ни была, Канна не сможет сопротивляться.\n\nКирино подняла взгляд на здание Общественной безопасности. Мысль о том, что Общественная безопасность — и, более того, Валькирия — может быть потрясена и перевернута одним ее приказом, вызывала у нее странное чувство. На самом верхнем этаже, в кабинете директора, Канна пила кофе, работая. Кирино вспомнила харизму, которую Канна проявила во время Великого переноса. Сможет ли Кирино подражать этому… или хотя бы попытаться? Ведь она даже из пистолета толком стрелять не умеет!\n\nЕсли она будет колебаться, все пойдет прахом. Кирино подумала о тепле, которое ей оказывали бельгийцы: та старушка, которая спасла ее, когда она заблудилась в Валлонии, и с улыбкой угостила чаем. И все же директор намеревалась арестовать их всех. Если не Кирино, никто не сможет этого сделать. Фубуки тоже давно была разочарована директором, враждебно настроенной к местным жителям.\n\nКирино на мгновение повесила пистолет на пояс и глубоко вздохнула. Настало время испытать харизму, которой она научилась, глядя на директора. Жестом она приказала студентке с эмблемой Общественной безопасности быстро передать мегафон. Кирино взмахнула рукой, приказывая студенткам Общественной безопасности штурмовать здание. Прочистив горло, она крикнула:\n\n\"Огата Канна, директор Общественной безопасности! Общественная безопасность больше не будет подчиняться злоупотреблениям Общественной безопасности! Сдавайся, подними руки и выходи!\"\nКак только Кирино закончила, Общественная безопасность превратилась в ад: они запутались друг в друге, наставляя оружие, и столкновение щитов не прекращалось."
 KSP_event.115.a:0 "Руки Кирино сильно дрожали."
 KSP_event.116.t:0 "Встреча с Конокой"
 KSP_event.116.d:0 "\"Ну и ну… пейзаж, который так понравился бы начальнице, не так ли?\"\n\nКонока крутилась на стуле в кабинете директора Общественной безопасности, рассматривая панораму. Кабинет был отмечен переворотом: повсюду застрявшие пули. Было неясно, говорила ли Конока о виде из окна или это была завуалированная критика переворота Общественной безопасности.\n\nТем временем Кирино, как и в тот раз, когда она встречалась с Канной после того, как напортачила перед Великим переносом, сидела на диване в кабинете, нервно теребя наручники. Что изменилось, так это то, что Канна была задержана в своей резиденции, а в нагрудном кармане Кирино лежала маленькая книжечка с коммунистической теорией.\n\nКонока сняла рубашку и надела форму директора, лежавшую рядом. Синяя повязка блеснула на ее локте. Но, в отличие от этого блеска, Конока выглядела ужасно неловко.\n\n\"Начальница обожала эту кофейную чашку. Я до сих пор этого не понимаю, но ладно.\" Конока улыбнулась, как будто шутила. Но лицо Кирино было напряженным, словно ее наказывали. Конока вздохнула и продолжила:\n\n\"Скажу прямо: то, что Общественная безопасность будет руководить Валькирией… мне это совсем не нравится. Даже больше, чем когда начальница меня ругала.\" Кирино вздрогнула, показывая, что она слушает. Конока закинула ноги на стол. Только тиканье секундной стрелки наполняло тишину, словно Конока собиралась занять место Канны.\n\n\"Но что поделать… если наша 'великая и великолепная директор Кирино' говорит, что это нужно сделать, значит, нужно сделать, не так ли? Не так ли?\" Конока потянулась, зевнула и подошла к Кирино, протягивая руку.\n\nКирино все еще не могла полностью скопировать харизму Канны. Но если она 'добрый офицер', она сможет это сделать… или она пыталась повторять это снова и снова. Она просто спасла бельгийцев от злоупотреблений директора, не более того. И все же она не могла стереть грех, звучавший в каком-то уголке ее сердца. Возможно, этот грех будет биться внутри Кирино вечно. С каждым ударом грех будет биться дважды.\n\nКирино выпустила наручники, которые теребила, и пожала руку Коноке."
 KSP_event.116.a:0 "Было ощущение, будто она совершила преступление."
 KSP_tooltip_konoka:0 "§gКогда Кирино закрывала дверь, выходя, она услышала бормотание. Это был голос Коноки: 'Не знаю, что, черт возьми, эти сумасшедшие собираются делать'. Этот голос, отразившись от закрытой двери, вернулся лассо и сжал горло Кирино.§!"

