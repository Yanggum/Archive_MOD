 KSP_event.100.t:0 "Конец бедствия"
 KSP_event.100.d:0 "Лиса Бедствия, совершавшая террористические акты в зоне Валькирии, была подавлена. Ее действия угрожали безопасности Академии полиции Валькирии, и их больше нельзя было терпеть. Однако теперь она нейтрализована и находится взаперти в холодном Исправительном бюро. Она больше не будет представлять угрозы для Валькирии."
 KSP_event.100.a:0 "§CТак была подавлена Лиса Бедствия.§!"

 KSP_event.101.t:0 "Внутренняя оппозиция в Валькирии"
 KSP_event.101.d:0 "Подавляя бельгийские протесты и изгоняя местные оппозиционные силы, рабочая нагрузка Управления безопасности — игравшего главную роль во всем процессе — возросла до тех пор, пока наконец не вспыхнули жалобы. Когда директор Канна пригрозила суровыми наказаниями причастным, если недовольство продолжится, недовольство также начало вспыхивать внутри самого Управления общественной безопасности."
 KSP_event.101.c:0 "Пусть жалуются сколько хотят; академия все равно функционирует!"

