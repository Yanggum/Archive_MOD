# #발키리 단독 루트
 KSP_belgium_baechuk:0 "Умиротворение бельгийского сопротивления"
 KSP_belgium_baechuk_desc:0 "До Великого переноса, до того как Академия полиции Валькирии упала сюда, на этой земле существовала страна под названием 'Бельгия'. Но теперь это место — территория Валькирии. Подавлять тех, кто сопротивляется законному правительству, — это не более чем одна из задач полицейской академии."
 KSP_valkyrie_dandok_gov:0 "Правительство Валькирии"
 KSP_valkyrie_dandok_gov_desc:0 "В этом новом мире большинство событий — это то, что мы не могли предвидеть, поэтому старая политическая система, неспособная быстро реагировать, неэффективна. Настало время установить новое правительство Валькирии."
 KSP_gov_gaepyeon:0 "Реорганизация бюрократии"
 KSP_gov_gaepyeon_desc:0 "Вертикальная политическая структура Валькирии, работающая почти полностью по командам сверху вниз, снижает способность реагировать на внезапные ситуации. Реорганизация бюрократии могла бы позволить нам решить эту проблему."
 KSP_belgium_ukje:0 "Сдерживать бельгийское влияние"
 KSP_belgium_ukje_desc:0 "После провала бельгийского движения сопротивления бельгийцы, выступающие против нас, продолжают действовать в тени. Если мы не сдержим их влияние, могут возникнуть еще большие проблемы."
 KSP_kanna_health_problems:0 "Укрепить власть Директора Общественной безопасности"
 KSP_kanna_health_problems_desc:0 "Валькирия имеет структуру, несколько отличную от других академий: она оценивается по результатам, и классы реорганизуются по способностям. Но в таком беспрецедентном кризисе, как этот, мы должны укрепить власть Управления общественной безопасности — и, в частности, ее директора — чтобы гарантировать эффективное управление."
 KSP_kanna_gov_rule:0 "Правительство верных Канне"
 KSP_kanna_gov_rule_desc:0 "Директор Общественной безопасности Канна, без сомнения, фигура, способная разрешить этот кризис. Мы должны довериться ее лидерству и следовать за ней."
 KSP_sanghwal_safety_coup:0 "Захват власти Общественной безопасностью"
 KSP_sanghwal_safety_coup_desc:0 "Это факт, что переговоры с Бельгией были сорваны из-за угнетающего и некомпетентного поведения нынешнего руководства Валькирии! Мы объявим о конце чрезвычайного положения, включая Огату Канну, которая допускает и поощряет эту некомпетентность."
