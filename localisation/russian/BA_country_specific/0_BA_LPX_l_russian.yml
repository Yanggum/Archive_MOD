### Национальные духи
LPX_parliament: "Парламент [ROOT.GetName]"
LPX_parliament_desc: "Парламент с ограниченными полномочиями под одобрением Лиги Наций. Был создан для обеспечения местной автономии с прицелом на будущую независимость через несколько десятилетий. Не обладает компетенциями в обороне и внешней политике."
LPX_gehenna_culture: "Гееннизация"
LPX_gehenna_culture_desc: "Местная культура будет постепенно ассимилироваться с культурой Геенны. Эта территория будет соответствующим образом «отрегулирована», чтобы стать постоянной колонией Геенны."
LPX_pseudo_science: "Департамент псевдонауки"
LPX_pseudo_science_desc: "Департамент псевдонауки взял инициативу внутри Миллениума, значительно замедляя научно-техническое развитие."
LPX_derussianization: "Дерусификация"
LPX_derussianization_desc: "Дисциплинарный комитет назвал новую военно-гражданскую администрацию, созданную в Москве, «Волга». Это преднамеренная попытка стереть русскую идентичность с помощью политики дерусификации. В конечном итоге эта земля должна быть гееннизирована, а славянский национализм искоренен.\n\nКонечно, они не сдадутся легко."
LPX_establishment_of_government_idea: "Установление нового правительства"
LPX_establishment_of_government_idea_desc: "Новое правительство будет прививать ценности нового правителя народу [ROOT.GetName]. Это может рассматриваться не как освобождение, а как другая форма угнетения… но таково право победителя."
LPX_post_war_reconstruction_idea: "Комитет по восстановлению"
LPX_post_war_reconstruction_idea_desc: "Комитет, созданный для восстановления разоренной войной родины после установления правительства [ROOT.GetName]."
LPX_promotion_of_suburban_development_idea: "Пригородное развитие"
LPX_promotion_of_suburban_development_idea_desc: "Передовые технологии тракторов из Кивотоса повысили сельскохозяйственную производительность в пригородных зонах, частично внедрив интеллектуальные фермы."
LPX_assimilation_work: "Политико-культурная ассимиляция"
LPX_assimilation_work_desc: "Политическая и культурная близость с метрополией усиливается."

