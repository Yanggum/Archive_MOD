### Описания лидеров
LPX_gehenna_school_committee_leader_desc: "Гражданский комитет Геенны — это временная гражданская администрация, предназначенная для внедрения порядка и системы правления Геенны на этих землях. Он будет действовать под коллективным руководством до назначения постоянного гражданского администратора."

LPX_local_committee_leader_desc: "Гражданский комитет — это временная администрация, предназначенная для внедрения порядка и системы правления Люксембурга на этих землях. Он будет действовать под коллективным руководством до назначения постоянного гражданского администратора."

### Местные лидеры
LPX_napoleon_leader_desc: "С восстановлением французской монархии, продвигаемым из Люксембурга, возвращение Бонапартов на французский трон стало практически свершившимся фактом. Эксперты считали невозможным для дома Бурбонов управлять Францией даже с возвращением монархии, учитывая особенности семьи Рикухачима, и так оно и вышло. Последний супруг дома Нассау, бывшего герцогского дома Люксембурга, принадлежал к Бурбонам, что привело некоторые анти-рикухачимовские фракции к утверждению, что после угасания герцогского дома Бурбоны имели право на наследование. Принудительное включение Бонапарта, чье влияние во Франции исчезло после падения Наполеона III, по-видимому, отвечает этим политическим причинам.\n\nКакова бы ни была причина, Наполеон VI получил право править как император Федерации Миллениум-Франция, возглавляя два народа. На своей коронации в Нотр-Даме он провозгласил свою решимость объединить цивилизации Кивотоса и Европы и как можно скорее освободить Францию от административного контроля Лиги Наций."

LPX_karl_albrecht_leader_desc: "Карл Альбрехт фон Габсбург был назначен лидером Мандата Лиги Наций в Польше по решению правительства Люксембурга. Предполагается, что управление мандатом продлится от 20 до 30 лет, и он не ожидает дожить до польской независимости. Тем не менее, важно то, что Польша получила в качестве лидера храброго «короля-солдата», решительно противостоящего нацизму, который будет бороться за национальные интересы и свободы граждан в течение срока мандата."

LPX_vasyl_vyshyvanyi_leader_desc: "Василь Вышиваный, также известный как Вильгельм Франц фон Габсбург, австрийский эрцгерцог, боровшийся за независимость Украины, взошел на трон как монарх Украины с ограниченными свободами под мандатом Лиги Наций. После коронации в Киеве он основал первую украинскую династию Габсбургов. Пока неясно, как долго просуществует его королевство, и украинский народ наблюдает за его правлением со смесью надежды и беспокойства."

LPX_vladimir_kirillovich_leader_desc: "Владимиру Кирилловичу было отказано в восстановлении как «Царю всея Руси» гражданской администрацией, признавшей за ним только титул «Князя Московского княжества». Это решение является частью политики, направленной на фрагментацию России и предотвращение ее постоянного воссоединения. Тем не менее, в частном порядке Владимир называет себя царем и действует не как покорный подчиненный гражданской администрации, а как символ русского достоинства."

LPX_george_bagration_leader_desc: "Дом Багратионов давно потерял свою власть, но теперь обрел новый авторитет под мандатом гражданской администрации. Новый монарх из Багратионов стремится установить новый порядок на всем Кавказе под управлением Мандата Лиги Наций."

LPX_karl_gero_leader_desc: "Карл Геро, граф Вюртембергский, поступил на службу в вермахт в 1935 году, но его военная карьера была недолгой из-за Великого Перехода. Когда Мандат Лиги Наций взял под контроль страны Балтии, гражданская администрация решила возвести на трон монарха, и он получил власть править как лидер балтийского мандата при поддержке этой администрации."

### События
LPX.leader_event.ARU.t: "Назначение лидера гражданской администрации"
LPX.leader_event.ARU.desc: "[ROOT.GetLeader] является доминирующим государством мандата и обладает полномочиями выбирать гражданского лидера Мандата Лиги Наций. Хотя требуется формальное одобрение Лиги Наций, у них нет ни власти, ни желания противиться нашему решению.\n\nПервый вариант наиболее рационален: отправить чиновника из Кивотоса и сохранить текущую структуру, заменив только генерал-губернатора. Поскольку [ROOT.GetLeader] принадлежит Кивотосу, этот вариант будет считаться разумным даже в политической сфере.\n\nОднако нельзя игнорировать требования местных монархических фракций в Люксембурге. В особенности монархисты, страстно поддерживающие Рикухачима Ару после Великого Перехода, рассматривают мандат как возможность «распространить либеральную монархию по миру под руководством Рикухачимы». Поскольку они единственная сила, требующая местного лидера, выбор местного лидера равносилен возведению на престол герцога, короля или императора на оккупированной территории.\n\nВ любом случае, решение за [ROOT.GetLeader]."
LPX.leader_event.ARU.a: "Естественно, Кивотос продолжит управлять."
LPX.leader_event.ARU.b: "Монархисты хотят монархию? Да будет так!"

LPX.leader_event.HINA.t: "Назначение лидера гражданской администрации"
LPX.leader_event.HINA.desc: "[ROOT.GetLeader] является доминирующим государством оккупированной территории и обладает полномочиями выбирать ее гражданского лидера. Ключевой вопрос — кого назначить администратором. Дисциплинарный комитет никогда не благоволил местному политическому участию, поэтому почти наверняка будет отправлен чиновник из Кивотоса.\n\nРешение сводится к тому, отправить ли внутреннего члена Дисциплинарного комитета для управления территорией почти военными методами или гражданского чиновника из Кивотоса для относительно умеренного управления. В любом случае, они не смогут отвергнуть наш выбор."
LPX.leader_event.HINA.a: "Конечно, Дисциплинарный комитет должен заняться этим."
LPX.leader_event.HINA.b: "Пошлите гражданского чиновника. Трения с местными жителями будут меньше."