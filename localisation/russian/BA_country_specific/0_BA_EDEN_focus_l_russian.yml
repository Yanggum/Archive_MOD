l_russian:
  # Триггеры и флаги
  Eden_alliance_created_already_TT: "§YОрганизация Эдемского договора§! уже создана."
  Eden_alliance_created_already_TT_NOT: "§YОрганизация Эдемского договора§! еще не создана."
  Eden_is_joint_focus_member_TT: "Является членом §YОрганизации Эдемского договора§!"

  # Дерево действий ОЭД
  Eden_formation_of_alliance_treaty_organization: "Основать Организацию Эдемского договора"
  Eden_formation_of_alliance_treaty_organization_desc: "Будет создана Организация Эдемского договора, первый шаг к преодолению затяжного конфликта между Тринити и Геенной."

  Eden_alliance_actions: "Действия альянса"
  Eden_alliance_actions_desc: "После создания ОЭД как посреднического органа внутри нее появились голоса, требующие новых перемен."

  Eden_united_state_Eden: "Великая интеграция"
  Eden_united_state_Eden_desc: "Среди студентов — особенно молодых и академиков — набирает силу радикальная идея полностью разрушить барьеры между Тринити и Геенной."

  Eden_status_quo: "Сохранить статус-кво"
  Eden_status_quo_desc: "ОЭД прекрасно выполняет свою первоначальную цель. Пришло время укрепить ее и сосредоточиться на сохранении текущей ситуации."

  Eden_economic_cooperation: "Экономическая интеграция"
  Eden_economic_cooperation_desc: "Внутренняя торговля растет; таможенное соглашение будет способствовать обмену и совместному развитию."

  Eden_deterrence_of_eastern_threat: "Сдержать восточную угрозу"
  Eden_deterrence_of_eastern_threat_desc: "Восточная Европа страдает от непрекращающихся войн. Мы мобилизуем весь альянс, чтобы навязать принудительный мир и гарантировать безопасность."

  Eden_countering_the_old_order: "Следить за старыми европейскими государствами"
  Eden_countering_the_old_order_desc: "Государства, существовавшие до Перехода, жаждут вернуться в Европу. Если мы проявим слабость, они непременно нападут на нас."

  Eden_basic_research: "Исследовательское сотрудничество Эдема"
  Eden_basic_research_desc: "Обмен исследованиями между странами-членами сократит технологический разрыв и ускорит научный прогресс."

  Eden_command: "Объединенное командование ОЭД"
  Eden_command_desc: "Мы создадим объединенное командование, которое облегчит военные операции и усилит оборону перед лицом внешних вторжений."

  Eden_integration_of_industrial_sectors: "Промышленная интеграция"
  Eden_integration_of_industrial_sectors_desc: "Больше, чем тариф: производственная кооперация повысит промышленный потенциал и стабилизирует экономику альянса."

  Eden_nordic_construction_developments: "Инвестиции в совместные исследования"
  Eden_nordic_construction_developments_desc: "Расширение Технологического института Эдема позволит реализовывать более масштабные совместные проекты и ускорит технологический прогресс."

  Eden_military_academy: "Военная академия Эдема"
  Eden_military_academy_desc: "Единое офицерское училище облегчит военное сотрудничество и подготовку командных кадров для всех членов."

  # Национальные духи
  Eden_command_ns: "Объединенные силы ОЭД"
  Eden_economic_union_ns: "Таможенный союз ОЭД"

  Eden_modifier_alliance_leader:0 "Лидер ОЭД"
  Eden_modifier_alliance_member:0 "Организация Эдемского договора"

  Eden_research_tech_sharing_name: "Технологический институт Эдема"

  # События
  Eden_event.1.t: "[var:global.Eden_alliance_leader.GetName] продвигает интеграцию ОЭД!"
  Eden_event.1.desc: "[var:global.Eden_alliance_leader.GetName] отстаивает все более интеграционистское видение и теперь продвигает крепкий союз внутри ОЭД.\n\nПрогрессивные студенты проявляют энтузиазм, в то время как консервативное руководство академий выражает свое недовольство."
  Eden_event.1.a: "Интеграция необходима."
  Eden_event.1.b: "Нет, это коллективное безумие; мы покинем организацию."

  Eden_event.2.t: "[FROM.GetName] поддерживает интеграцию"
  Eden_event.2.desc: "В ходе великих дебатов об интеграции [FROM.GetName] заявила о поддержке нашей инициативы."
  Eden_event.2.a: "Шаг вперед."

  Eden_event.3.t: "[FROM.GetName] покидает организацию!"
  Eden_event.3.desc: "В ходе дебатов об интеграции [FROM.GetName] подвергла резкой критике предложение и, ссылаясь на свой суверенитет, выходит из ОЭД."
  Eden_event.3.a: "Высокомерные националисты."
  Eden_event.3.b: "Их правительство явно недемократично."