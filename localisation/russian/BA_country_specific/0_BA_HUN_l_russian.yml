l_russian:
  OK_BA_HUN_wprnrxhdgkq_1:0 "§YРегион Австрии§! объединен"
  HUN_empir_collapse:0 "Крах Австро-Венгерской империи"
  HUN_foc_2-2-11_focus_flag:0 "§YК объединенным Балканам§! цель выполнена"
  HUN_SOV_research_group_name:0 "Венгерско-Советский исследовательский альянс"
  HUN_SOV_research_group_desc:0 "Венгерско-Советский исследовательский альянс"
  HUN_Kun_Bela:0 "Бела Кун"
  HUN_elisabeth_maria_petznek:0 "Елизавета Мария фон Эстеррайх"
  HUN_elisabeth_maria_habsburg:0 "Елизавета Мария фон Габсбург"
  HUN_Szalasi_Ferenc:0 "Ференц Салаши"
  BA_HUN_faction_1:0 "Второй Центральный альянс"
  HUN_GATHERING_STORM_DESC_1:0 "После поражения Двойственной империи в Великой войне и ее последующего распада мы добились независимости, но она не была полностью сладкой. Новообразованная республика рухнула, не сумев справиться с хаосом, за ней последовала Советская республика, которая привела нас к унижению Трианонского договора, и наконец, установилось Королевство-регентство под руководством адмирала.\n\nВ 1935 году неизвестная сила высадилась в Европе, и все запылало. Державы-победительницы, навязавшие нам договор, пали одна за другой, и Румыния, как тигр без зубов, едва выживает. Нравится нам это или нет, приближается время решать."
  HUN_PACT_OF_SHANHAIJING_FACTION: "Шаньхайцзинский пакт - Будапешт"
  HUN_central_powers_FACTION: "Центральный альянс"
  HUN_elizabeth_marie_habsburg_flag: "§YАвстро-Венгерская империя§! восстановлена"


  # Фокусы
  # Елизавета Мария
  HUN_elizabeth_marie: "Красная эрцгерцогиня"
  HUN_elizabeth_marie_desc: "Красная эрцгерцогиня, Елизавета Мария, считается чрезвычайно прогрессивной фигурой в доме Габсбургов. Восстановив ее трон и пригласив ее к власти, мы сможем одновременно добиться как реставрации Габсбургов, так и установления свободной Венгрии."

  HUN_dissolution_of_parliament: "Роспуск парламента"
  HUN_dissolution_of_parliament_desc: "Мы распустим нынешний парламент и внедрим новую политическую систему, тем самым реорганизовав структуру управления страной."

  HUN_parliamentary_takeover: "Контроль над парламентом"
  HUN_parliamentary_takeover_desc: "Будучи членом Социал-демократической партии, Елизавета Мария будет оказывать сильное влияние на парламент."

  HUN_social_welfare_budget_increase: "Увеличение социального бюджета"
  HUN_social_welfare_budget_increase_desc: "Мы значительно увеличим бюджет на социальное обеспечение, чтобы улучшить качество жизни населения и укрепить сеть социальной защиты, гарантируя, что никто больше не умрет от голода."

  HUN_womens_suffrage: "Женское избирательное право"
  HUN_womens_suffrage_desc: "Мы должны предоставить женщинам право голоса, способствуя тем самым их политическому участию и равенству."

  HUN_worker_rights_advancement: "Интеграция профсоюзов"
  HUN_worker_rights_advancement_desc: "Мы пригласим профсоюзы в правительство, чтобы улучшить трудовые права и увеличить поддержку режима."

  HUN_economic_policy_shift: "Изменение экономической политики"
  HUN_economic_policy_shift_desc: "Нынешняя экономическая политика основана на минимальном вмешательстве государства в рынок. Однако эта политика вызвала множество экономических проблем, поэтому мы должны ее изменить."

  HUN_economic_control: "Усиление экономического контроля"
  HUN_economic_control_desc: "Мы усилим контроль и регулирование экономической деятельности страны, чтобы повысить ее стабильность и эффективность."

  HUN_self_determination: "Самоопределение"
  HUN_self_determination_desc: "Мы создадим Национальный совет меньшинств, чтобы гарантировать самоопределение каждой этнической группы, продвигаясь к равноправной федерации."

  HUN_austria_restoration: "Освобождение Австрии"
  HUN_austria_restoration_desc: "Наши австрийские соотечественники пали под гнетом захватчиков из иного мира. Мы освободим Австрию и провозгласим восстановление Австро-Венгерской империи."

  HUN_danube_federation: "Дунайская федерация"
  HUN_danube_federation_desc: "Бывшая империя Габсбургов строилась на господстве над другими народами. Теперь мы оставим это прошлое позади и установим равноправную Дунайскую федерацию."

  HUN_habsburg_federation: "Конституционная империя Габсбургов"
  HUN_habsburg_federation_desc: "Мы восстановим конституционную империю под руководством дома Габсбургов, установив сильное центральное правительство и проводя дальнейшие социально-экономические реформы."

  HUN_centralization: "Новая централизация"
  HUN_centralization_desc: "Для проведения дальнейших реформ мы создадим высокоцентрализованное правительство, охватывающее не только социальную сферу, но и экономику."

  HUN_women_soldiers: "Создание женских войск"
  HUN_women_soldiers_desc: "Мы сформируем женские подразделения в армии, продвигая гендерное равенство в вооруженных силах и расширяя роль женщин."

  HUN_yugoslavia_alliance: "Союз с Югославией"
  HUN_yugoslavia_alliance_desc: "Оставляя позади конфликты прошлого, стратегический союз с Югославией принесет большую пользу будущему и взаимному развитию наших наций."

  HUN_austria_integration: "Объединение с Австрией"
  HUN_austria_integration_desc: "Теперь, когда мы освободили Австрию, мы можем сформировать федерацию как первый шаг к созданию Дунайской федерации."

  HUN_yugoslavia_unification: "Федеральная интеграция Югославии"
  HUN_yugoslavia_unification_desc: "Теперь, когда мы контролируем югославский регион, мы можем пригласить Югославию присоединиться в качестве члена Дунайской федерации."

  HUN_yugoslavia_federation_proposal: "Предложение федерации Югославии"
  HUN_yugoslavia_federation_proposal_desc: "Теперь, когда Югославия поддерживает тесные отношения с нашей страной, мы можем предложить ей присоединиться к нашей федерации."

  HUN_federal_empire: "Великая Дунайская федерация"
  HUN_federal_empire_desc: "Нации Дуная останутся едиными, чтобы никогда больше не разделяться. Как равноправная многонациональная федеративная республика, Дунайская федерация будет существовать вечно."

