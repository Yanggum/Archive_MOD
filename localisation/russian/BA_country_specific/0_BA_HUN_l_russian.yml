  BA_HUN_wprnrxhdgkq: "Имперское объединение"
  BA_HUN_wprnrxhdgkq_desc: "\n\n£GFX_BA_HUN_decisions_OHHUNG\n\n\n\n\n                                             §Y\"Ни разделены, ни разлучены.\"§!\n\nЧто нам оставил Версальский договор? Разделение, конфликт и обиду на победителей. Наша империя была расчленена Версалем, и в этом процессе многочисленные конфликты нанесли нам глубокие раны, породив разочарование в нашем побежденном отечестве. И из этой обиды на победителей возникло стремление к мести, которое толкнуло нас точить мечи... пока все не изменилось.\n\nТаинственная сила пришла в Европу, и ситуация кардинально изменилась. Венгрия сумела избежать катастрофы, но победители Великой войны пострадали от нее.\nНаше королевство действовало быстро: мы проигнорировали Версальский договор, провозгласили возрождение Габсбургов и, освободив Австрию и Чехию от захватчиков, объявили Империю.\n\n                                         §tНаша Империя будет последней в мире!§!"
