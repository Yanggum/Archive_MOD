  # Подсказки
  BA_HUN_tt_0: "Если наши силы превысят §G100,000 солдат§! или мы будем в союзе с такими державами, как @SOV §RСоветская Россия§!, то @ROM §Y Румыния§! с большей вероятностью примет наши требования."
  BA_HUN_tt_1: "Если наши силы превысят §G100,000 солдат§! или мы будем в союзе с такими державами, как @SOV §RСоветская Россия§!, то @YUG §0 Югославия§! с большей вероятностью примет наши требования."
  BA_HUN_tt_2: "§RИнакомыслящие будут устранены.§!\nКогда чистка закончится, §Yширокая антикоммунистическая враждебность§! исчезнет из национального менталитета."
  BA_HUN_tt_3: "§RНаконец, социалистическое объединение Балкан завершено.§!"
  BA_HUN_tt_4: "§RВаша нация будет аннексирована Венгрией, что приведет к завершению игры.§!"
  BA_HUN_tt_5: "§RВенгры перешли точку невозврата.§!"
  BA_HUN_tt_6: "§RВсе кончено.§!"
  BA_HUN_tt_7: "Ключевая точка для пути §YБалканский социализм§!."
  BA_HUN_tt_8: "Ключевая точка для пути §YСоветский§!."
  BA_HUN_tt_9: "Мы объявляем войну @SOV §RСоветской России§!.\nКроме того, @UKR §C Украина§!, которую мы поддерживаем, также восстанет против них."
  BA_HUN_tt_10: "§RЭмбарго§! будет применено ко всем странам с идеологией §Cдемократия§!."
  BA_HUN_tt_11: "§RЭмбарго§! будет применено ко всем основным монархиям на старте, которые не являются §Rкоммунистическими§!.\n§Y@ENG Великобритания\n@ITA Италия\n@JAP Япония\n@GRE Греция\n@YUG Югославия\n@BUL Болгария\n@ROM Румыния\n@HOL Нидерланды\n@MAN Маньчжоу-го§!"
  BA_HUN_tt_12: "Будут устранены любые следы §Rзапрещенного коммунизма§!."
  BA_HUN_tt_13: "§RЭмбарго§! будет применено ко всем странам с идеологией §8фашизм§!."
  BA_HUN_tt_14: "Балканские страны в нашей сфере также получат этот национальный дух."
  BA_HUN_tt_15: "Будет получен §Ycasus belli§! против всех великих держав с идеологией §8фашизм§!."
  BA_HUN_tt_16: "Венгрия присоединяется к @SOV §Советской Социалистической Федерации§!."
  BA_HUN_tt_17: "Когда национальный дух будет устранен:\nбудет получено §G+25.00% стабильности§!."
  BA_HUN_tt_18: "§RНестабильная империя снова рухнула.§!"
  HUN_uprising_strength_tt: "Текущая сила §Yсоциалистов§! на основе поддержки: [HUN_communist_coup_target.Get_Hun_Uprising_strength]\nЭто зависит от их поддержки §Yкоммунистов§! и количества вооруженных рабочих."
  BA_HUN_conflict_tt: "§RЕсли стабильность упадет ниже 20%, империя рухнет.§!\n"

