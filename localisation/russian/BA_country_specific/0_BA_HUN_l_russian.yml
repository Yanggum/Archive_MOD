  HUN_foc_L-1: "Защитить ленинизм!"
  BA_HUN_focus_halo: "Идентифицировать пехоту Ореола"

  # События
  BA_HUN_event.1.t: "Претензия Венгрии на Трансильванию"
  BA_HUN_event.1.desc: "[HUN.GetName] заявила, что регион §YТрансильвания§!, потерянный по Трианонскому договору, должен быть возвращен Венгрии, теперь когда этот договор аннулирован.\n\nХотя это могла быть их территория, разве сейчас она не является законной частью нашей страны? Если мы отдадим эти земли, легитимность и престиж нашего правительства могут серьезно пострадать."
  BA_HUN_event.1.a: "Избежим войны."
  BA_HUN_event.1.b: "Трансильвания должна оставаться частью Румынии."

  BA_HUN_event.2.t: "Претензия Венгрии на Воеводину"
  BA_HUN_event.2.desc: "[HUN.GetName] заявила, что регион §YВоеводина и Западный Банат§!, потерянный по Трианонскому договору, должен быть возвращен Венгрии, теперь когда этот договор аннулирован.\n\nХотя это могла быть их территория, разве сейчас она не является законной частью нашей страны? Если мы отдадим эти земли, легитимность и престиж нашего правительства могут серьезно пострадать."
  BA_HUN_event.2.a: "Избежим войны."
  BA_HUN_event.2.b: "Воеводина должна оставаться частью Сербии."

  BA_HUN_event.3.t: "Объединение Балкан"
  BA_HUN_event.3.desc: "Наконец, после долгих дебатов, Венгрия сольется в единую нацию как §YБалканская Социалистическая Республика§!.\n\nПод красным флагом и красной розой венгры и балканские народы объединились, чтобы сформировать новую великую державу в Европе. Как Советский Союз, но в отличие от него, мы намерены стать §Yистинным социалистическим государством§!, окрасив весь мир в красный цвет, заставив красные розы цвести по всему миру.\n\nКак бы то ни было, мы единственная социалистическая федерация на Балканах! Да здравствует социализм!"
  BA_HUN_event.3.a: "Да здравствует Балканская Социалистическая Федерация!"

  BA_HUN_event.9.t: "Нестабильность в @UKR Украинской Советской Социалистической Республике"
  BA_HUN_event.9.desc: "Украинская Советская Социалистическая Республика в настоящее время переживает серьезный кризис, с многочисленными восстаниями, забастовками и саботажем.\nЭксперты утверждают, что это не просто этнический конфликт, а заговор [HUN.GetName] с целью дестабилизировать союз.\n\nХотя неясно, правда это или нет."
  BA_HUN_event.9.a: "Хмм..."

  BA_HUN_event.12.a: "Предатели!"

  BA_HUN_event.13.t: "Возвращение Хорти на службу офицером"
  BA_HUN_event.13.desc: "Миклош Хорти, лидер нашего королевства, ранее был адмиралом исчезнувшей Австро-Венгрии.\nДля усиления нашей национальной обороны рассматривается его возвращение на службу офицером.\n\nХотя он был военно-морским офицером, учитывая текущие обстоятельства, он может понадобиться в сухопутных войсках."
  BA_HUN_event.13.a: "Пусть вернется во флот!"
  BA_HUN_event.13.b: "Он нужен нам в армии."

  BA_HUN_event.14.t: "Венгрия требует отделения Галиции"
  BA_HUN_event.14.desc: "После убийства Хорти и принятия просоветской политики Венгрия оказывает на нас давление, требуя отделить регион Галиции от Польши и установить там социалистическое правительство.\n\nЕсли мы отвергнем требования Венгрии, может разразиться война."
  BA_HUN_event.14.a: "Избежим войны."
  BA_HUN_event.14.b: "Галиция должна оставаться польской!"

  BA_HUN_event.15.t: "Крестьяне против коллективизации!"
  BA_HUN_event.15.desc: "Крестьяне, выступающие против коллективизации, организовали восстание."
  BA_HUN_event.15.a: "Сжечь этих реакционных мелких буржуа!"

  BA_HUN_event.16.t: "Чистка реакционеров"
  BA_HUN_event.16.desc: "С установлением рабоче-крестьянского правительства мы не должны забывать капиталистов и монархистов, которые эксплуатировали наш народ.\n\nМы должны показать оставшимся внутри Венгрии реакционерам истинный вкус революции. Так мы построим истинную социалистическую утопию для рабочих и крестьян. Мы должны действовать быстро."
  BA_HUN_event.16.a: "Очистить всех!"

  BA_HUN_event.17.t: "Конец Большой чистки"
  BA_HUN_event.17.desc: "После трех фаз чистки, наконец, завершилась долгая и кровавая чистка. Возможно, мы устранили многих, но мы верим, что это было правильным решением ради родины, нации, нашей системы и социализма.\n\nКак бы то ни было, чистка закончена, и перед нами открывается новое будущее. Никто не знает, будет ли оно светлым или мрачным, но мы всегда преодолевали невзгоды.\n\nБудем двигаться вперед, ради нашей гордой родины, [HUN.GetName]."
  BA_HUN_event.17.a: "Миссия выполнена."

  BA_HUN_event.18.t: "Первая Большая чистка"
  BA_HUN_event.18.desc: "Прошло всего две недели с тех пор, как мы начали устранять реакционеров, а мы уже захватили множество капиталистов, фашистских сочувствующих и контрреволюционных монархистов. Мы должны показать этим врагам социализма, что значит рабоче-крестьянское государство.\n\nЭто справедливо."
  BA_HUN_event.18.a: "Устранить их всех."

  BA_HUN_event.19.t: "Вторая Большая чистка"
  BA_HUN_event.19.desc: "После кровавых репрессий прошлого месяца многие ключевые фигуры бывшего Королевства Венгрии, как гражданские, так и военные, появились в списках на чистку. Хотя они могут быть компетентными администраторами и офицерами, они не более чем рабы и сообщники монархизма.\n\nРешение за тобой. Если ты простишь их, ты можешь получить ценные ресурсы... или совершить ужасную ошибку.\n\nРешай. Что ты сделаешь?"
  BA_HUN_event.19.a: "Нет пощады врагам социализма!"
  BA_HUN_event.19.b: "Возможно, они еще могут пригодиться."

  BA_HUN_event.20.t: "Третья Большая чистка"
  BA_HUN_event.20.desc: "Хотя мы устранили большинство проникших элементов, возможно, все еще остались шпионы, угрожающие нашему режиму. Их искоренение будет стоить крови и жертв, но если это гарантирует стабильность страны, системы и социализма, это будет справедливая цена.\n\nВозможно, будущие поколения будут судить, было ли это ради стабильности, мира и процветания Венгрии или худшей ошибкой в нашей истории.\n\nРешение за тобой. Выбирай с осторожностью."
  BA_HUN_event.20.a: "Устранить до последнего предателя!"
  BA_HUN_event.20.b: "Возможно, это слишком рискованно..."

  BA_HUN_event.21.t: "Приглашение [FROM.GetName] в Дунайскую федерацию"
  BA_HUN_event.21.desc: "[FROM.GetName] прислала нам приглашение интегрировать нашу нацию в свою федерацию. Провозгласив Дунайскую федерацию, [FROM.GetName] предприняла дипломатические и политические усилия для объединения соседних стран, и, кажется, мы их следующая цель.\n\nЕсли мы согласимся, это может принести прочный мир на Дунай, но если мы отклоним предложение, мы будем защищать независимость Югославии."
  BA_HUN_event.21.a: "Мы присоединимся к федерации."
  BA_HUN_event.21.b: "Мы всегда будем Югославией."

  BA_HUN_event.22.t: "[FROM.GetName]: Отказ присоединиться к Дунайской федерации"
  BA_HUN_event.22.desc: "Несмотря на наши дипломатические и политические усилия, [FROM.GetName] отказалась присоединиться к Дунайской федерации. Они утверждают, что не могут отказаться от независимости Югославии, и сравнивают наше предложение с опасными этническими конфликтами в регионе.\n\nМы могли бы навязать объединение силой, но никогда не добились бы настоящей интеграции."
  BA_HUN_event.22.a: "Мир — самая ценная вещь."
  BA_HUN_event.22.b: "Все вы — наши враги!"

  BA_HUN_event.23.t: "[FROM.GetName] присоединяется к Дунайской федерации"
  BA_HUN_event.23.desc: "[FROM.GetName] приняла наше приглашение присоединиться к Дунайской федерации и подписала соглашения, чтобы начать процесс объединения. Они объявляют, что объединение Дунайского региона положит конец многовековым конфликтам на Балканах и принесет прочный мир. [FROM.GetName] будет активно сотрудничать с нашим делом."
  BA_HUN_event.23.a: "Более сильная федерация."

  BA_HUN_event.101.t: "Распространение социалистических настроений в [ROOT.GetName]"
  BA_HUN_event.101.desc: ""
  BA_HUN_event.101.a: "Проклятые коммунисты..."
  BA_HUN_event.102.t: "Забастовка рабочих в [ROOT.GetName]"
  BA_HUN_event.102.desc: ""
  BA_HUN_event.103.t: "Вооруженные рабочие"
  BA_HUN_event.103.desc: ""
  BA_HUN_event.104.t: "Рабочие требуют смены правительства"
  BA_HUN_event.104.desc: ""
  BA_HUN_event.104.a: "Они действительно думают, что они важны?"
  BA_HUN_event.104.b: "Если они этого желают..."
  BA_HUN_event.105.t: "Предложение помощи от Венгрии"
  BA_HUN_event.105.desc: "Венгрия, которая поддерживала нашу революцию, предлагает вмешаться напрямую. Если мы примем это предложение, мы сможем осуществить революцию."
  BA_HUN_event.105.a: "Мы принимаем предложение."
  BA_HUN_event.105.b: "Мы не марионетки!"
  BA_HUN_event.106.t: "Объединенные Балканы"
  BA_HUN_event.106.desc: ""
  BA_HUN_event.106.a: "Да здравствует Балканский союз!"
  BA_HUN_event.106.b: "Нам это не нужно."
  BA_HUN_event.107.t: "[HUN.GetName] подчиняется нам"
  BA_HUN_event.107.desc: ""
  BA_HUN_event.107.a: "Добро пожаловать, товарищи."
  BA_HUN_event.108.t: "Освобождение Австрии - План операций"
  BA_HUN_event.108.desc: "Мы должны выбрать план для освобождения Австрии.\n\nВенгерское верховное командование предлагает 'План Вена', который заключается в быстром ударе на Вену, в то время как другие предлагают 'План Инсбрук', который подразумевает закрепление фронта перед началом наступления."
  BA_HUN_event.108.a: "Выбран План Вена."
  BA_HUN_event.108.b: "Выбран План Инсбрук."
  BA_HUN_event.109.t: "Цена революции"
  BA_HUN_event.109.desc: "Венгрия похвалила мирную смену нашего правительства, но прислала нам ультиматум, требующий полного устранения внутренней оппозиции. Мы можем следовать их приказам или противостоять им."

  BA_HUN_event.200.t: "Воссоединение австрийской территории"
  BA_HUN_event.200.desc: "Теперь, когда мы восстановили империю Габсбургов и освободили австрийский регион, мы можем провозгласить законное возвращение Австро-Венгерской империи."
  BA_HUN_event.200.a: "Правление Габсбургов вернулось!"

  BA_HUN_event.900.t: "Падение Империи"
  BA_HUN_event.900.desc: ""
  BA_HUN_event.900.a: "Черт."

  # Новостные события
  BA_HUN_news.1.t: "Румыния принимает требования Венгрии"
  BA_HUN_news.1.desc: "Румыния приняла требование Венгрии о передаче Трансильвании.\n\nТвердое требование Венгрии вернуть свои бывшие территории было принято, и Трансильвания, родина венгров, вернулась в венгерские руки."
  BA_HUN_news.1.a: "Удивительно."
  BA_HUN_news.2.t: "Румыния отвергает требования Венгрии"
  BA_HUN_news.2.desc: "Румыния отвергла требование Венгрии о передаче Трансильвании.\n\nТвердое требование Венгрии вернуть свои бывшие территории было отклонено, и венгерские дипломатические власти рассматривают войну против Румынии."
  BA_HUN_news.2.a: "Это приведет к войне?"
  BA_HUN_news.3.t: "Югославия принимает требования Венгрии"
  BA_HUN_news.3.desc: "Югославия приняла требование Венгрии о передаче Воеводины.\n\nТвердое требование Венгрии вернуть свои бывшие территории было принято, и Воеводина, родина венгров, вернулась в венгерские руки."
  BA_HUN_news.3.a: "Удивительно."
  BA_HUN_news.4.t: "Югославия отвергает требования Венгрии"
  BA_HUN_news.4.desc: "Югославия отвергла требование Венгрии о передаче Воеводины.\n\nТвердое требование Венгрии вернуть свои бывшие территории было отклонено, и венгерские дипломатические власти рассматривают войну против Югославии."
  BA_HUN_news.4.a: "Это приведет к войне?"
  BA_HUN_news.5.t: "Венгрия объединяет Балканы"
  BA_HUN_news.5.desc: "Сегодня [HUN.GetLeader] объявил, что социалистические нации Балкан слились, образовав Балканскую Социалистическую Федерацию.\n\nОсь мира поворачивается к социализму, и на Балканах появилась новая доминирующая сила."
  BA_HUN_news.5.a: "Единый и объединенный балканский регион..."

