	ABY_shiroko_fas_event.1.t: "Неуклюжий план"
	ABY_shiroko_fas_event.1.d: "Пражская весна была хаотичной, но в глазах граждан горел невиданный доселе энтузиазм. Популярность Сироко, «героини-спасительницы родины», свергнувшей Соу, взлетела до небес, и предстоящие всеобщие выборы были, по сути, не чем иным, как ее коронацией. Но сама Сироко, сидя за столом в правительственном дворце, хмурилась.\n\n«Ммм… и как управлять страной? Сложно.»\n\nУ нее не было ни великой идеологии, ни политической философии. Проведя бессонную ночь в раздумьях, она вырвала лист из блокнота и неуклюжим почерком записала первое, что пришло в голову.\n\nЧтобы никто не голодал.\nКто делает зло — того по-настоящему наказывать.\nСвоих защищать до конца.\nБанк… нет, казну использовать прозрачно.\n\nКогда эта грубая памятка без названия, которую начали называть «Обещания революции», появилась в газетах, реакция была странно взрывной. Политические обозреватели насмехались: «это не подобает главе государства». Но граждане, уставшие от вычурной лжи обычных политиков, пришли в неистовство: «вот это искренность без прикрас», «так прямо говорит только волчица».\n\nСироко была обескуражена этим слепым обожанием. В одиночку она не могла. Она немедленно созвала членов Комитета контрмер.\n\nДверь в зал открылась, и вошли Аянэ, Нономи и Серика. Но самое важное место было пусто.\n\n«А Хосино, сенпай?»\n\n«…Сказала, что не придет.»\n\nАянэ сообщила это с мрачным видом. Хосино назвала создание ополчений и революцию силой «началом другой диктатуры». Она продолжала ходить на работу мелким чиновником в администрации, но отказывалась даже встречаться взглядом с Сироко, не то что говорить наедине.\n\nНо останавливаться было нельзя.\n\n«Другого выхода нет. Пока что… мы должны продолжать.»\n\nСироко посмотрела на троих оставшихся.\n\n«Помогите мне. Я умею только воевать. Но эта страна не движется только войной.»\n\n«Правда, сенпай, без нас ты никуда!» — проворчала Серика, подбирая бумаги Министерства внутренних дел.\n\n«Экономику оставь мне~ Я попробую использовать силу Нефтис во благо.» Нономи улыбнулась и открыла финансовые отчеты.\n\n«Я поддержу тебя в дипломатии и общем управлении.» Аянэ поправила очки.\n\nТак правительство волчицы началось шатко: с тремя помощницами… и одной надзирательницей, повернувшейся к ней спиной."
	ABY_shiroko_fas_event.1.a: "Всей своей жизнью, за Федерацию и за революцию."

