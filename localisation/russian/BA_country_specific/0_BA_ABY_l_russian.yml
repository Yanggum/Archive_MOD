	ABY_focus_first_desc: "Очевидно, что ситуация улучшилась со времен Великого Перемещения, не так ли? Теперь мы знаем, где мы находимся, с кем мы и что мы должны делать. После завершения переговоров коалиционного правительства с чехами и немцами, и после того, как мы, пусть и немного, реактивировали функцию Студенческого совета с помощью административного указа, настало время определить курс страны. Жаль, что мы не можем подарить нашему народу в качестве новогоднего подарка окончание чрезвычайного положения. Будем молиться, чтобы следующий год был лучше."
