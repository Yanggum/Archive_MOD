	ABY_idea_eocordnldnjsghl_first_improved: "Комитет контрмер"
	ABY_idea_eocordnldnjsghl_first_improved_desc: "Комитет контрмер по предотвращению закрытия Абидоса был клубом, созданным, чтобы не допустить закрытия Старшей школы Абидоса.\nНо теперь, после неизвестного феномена, Комитет взвалил на себя тяжелую миссию: защищать не только Старшую школу Абидоса, но и близлежащие городские районы и даже местных жителей.\nНовые контрмеры, которые им предстоит выработать, никогда не будут простыми.\n\n§YКомитет контрмер§!\n§P- Таканаши Хосино §!\n§4- Сунаоками Сироко §!\n§7- Идзаёи Нономи §!\n§1- Куроми Серика §!\n§t- Окусора Аянэ §!"
