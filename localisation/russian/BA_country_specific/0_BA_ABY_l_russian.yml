	#####Новые события Абидоса#####
	#########################
	ABY_new_event.63.t: "Убежище евреев"
	ABY_new_event.63.d: "Сразу после Великого Перемещения евреи реагировали по-разному.\n\nНекоторые праздновали; другие отчаянно кричали. Причины крика у каждого были свои, но причины ликования были в основном одинаковыми: надежда на то, что можно избежать антисемитских преследований, распространившихся по всей Европе. Было очевидно, что правительство чужаков из иного мира не будет интересоваться, еврей ты или нет. Так и было... но именно это и стало их ошибкой.\nДо сих пор местные правительства, либо из личных убеждений, либо чтобы не показать слабость перед внешним миром, сдерживали — хотя бы поверхностно — антисемитское насилие, используя государственную власть. Однако правительство чужаков не имело ни малейшего интереса к конфликтам между местными жителями. Нет, оно их еще больше разожгло. Никакая власть не могла их защитить. И первоначальное ликование в конце концов превратилось в отчаяние, в крики. Они искали убежище... и пришли к одному из правительств чужаков.\n\nВременное правительство Абидоса: практически единственное правительство, где чужаки и местные жители объединялись и относились друг к другу на равных. Они поддержали еврейскую компанию Ротшильд как представительную корпорацию государства, разрешили неограниченную иммиграцию евреев, предоставляли немедленное гражданство и признавали и защищали религиозные и культурные права еврейского народа. Настоящий рай, где к евреям могли относиться как к людям.\n\nВ результате сегодня у иммиграционного контроля Абидоса снова собираются евреи.\n\n«Я... здесь действительно... мы сможем жить в безопасности?»\n\nИммиграционные офицеры, состоящие из чужаков и местных жителей, улыбнулись и ответили."
	ABY_new_event.63.a: "\"Конечно. Вы просто европейцы, исповедующие иудаизм.\""
	ABY_new_event.63.b: "\"Конечно. Здесь евреи в безопасности.\""

	ABY_new_event.64.t: "Альянс, связующий надежду"
	ABY_new_event.64.d: "Томаш Масарик не терял надежды даже после того, как Чехословакия пала перед Хяккияко. Он старался перегруппировать разрозненных министров и генералов и в результате смог заложить основы новой коалиции, убедив военных лидеров, таких как Войтех Лужна и Рихард Тесаржик, а также политиков во главе со Штефаном Осуски. Хотя у каждого были свои цели, они поклялись следовать за Временным правительством Абидоса — наследником духа Временного правительства Чехословакии — и сотрудничать, выполняя каждый свою роль.\n\nВ зале заседаний Масарик заговорил серьезным голосом:\n«Теперь у каждого из нас своя цель, но если немецкая, чешская фракции и Абидос не объединят силы, никто не сможет добиться успеха. Наш опыт и возможности необходимы для укрепления этой коалиции.»\n\nВойтех Лужна молча кивнул и сказал:\n«Ваше превосходительство, мы продвинулись в переговорах с немецкими организациями сопротивления и достигли значительных результатов. В обмен на то, что наш офицерский корпус будет их обучать и готовить унтер-офицеров, они согласились подчиниться нашему командованию. Чтобы освободить Чехию и Австрию, мы нужны друг другу; станет возможным организованное действие, достойное имени Объединенных сил Временного правительства.»\n\nШтефан Осуски добавил:\n«Наш долг также поддерживать политически неопытное Временное правительство Абидоса и способствовать сотрудничеству между различными силами. Мы должны сосуществовать в этой коалиции и верно выполнять свою роль.»\n\nЭдвард Бенеш наблюдал за происходящим и слегка улыбнулся:\n«Томаш, посмотри. У нас все еще есть товарищи, готовые посвятить себя Чехословакии. С ними мы, несомненно, добьемся освобождения родины.»\n\nМасарик решительно кивнул и заключил твердым голосом:\n«Без вашей самоотверженности и усилий сегодняшнее сотрудничество было бы невозможным. Хотя наши цели не идентичны, мы должны двигаться вместе к освобождению этой земли и к новому будущему. Я прошу каждого из вас выложиться по максимуму на своем месте.»"
	ABY_new_event.64.a: "At zije Ceskoslovensko!(Да здравствует Чехословакия!)"

