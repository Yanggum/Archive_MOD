	ABY_descision_focus_event.64.t: "Клинок в тени"
	ABY_descision_focus_event.64.d: "Ночь в Карловых Варах была глубока, и шторы в комнате заседаний временной резиденции Аянэ были плотно задернуты, чтобы скрыть от посторонних глаз. На письменном столе лежал разбросанный в беспорядке включенный катушечный магнитофон и несколько размытых черно-белых фотографий. Перед Аянэ сидели Серика с напряженным лицом, Сироко с застывшим выражением, а также Хосино и Нономи, стряхнувшие свою обычную вялость.\n\n«То, что вы только что слышали, — это записи прослушки, полученные от внутренней разведывательной сети армии, «Страж».»\n\nГолос Аянэ был спокоен, но в конце звучала мрачная тяжесть. На фото были видны Асагири Соу, тайно встречающаяся с людьми в форме и с жадными до наживы директорами Нефтис.\n\n«Майор Соу... неужели она?» — спросила Серика, словно не веря.\n\n«Точно.» — коротко ответила Сироко, поднимая одно из фото. «Перемещения войск странные. Под предлогом учений 3-я танковая дивизия была передислоцирована на ключевые позиции за пределами столицы. Это явная наступательная группировка.»\n\nСкрестив руки, Хосино тихо пробормотала. «Они воспользуются тем, что Бенеш ушел в отставку, а политическая обстановка нестабильна. Собрали недовольных тем, что мы, 'чужаки', захватили власть. С деньгами Нефтис, силой нацистских остатков и ее командованием...»\n\n«Это не просто недовольство.» — твердо сказала Аянэ. «Это явный заговор с целью свержения государства. Майор Соу планирует завтра на рассвете захватить парламент и резиденцию под предлогом 'решения для спасения нации'. Мы должны опередить их. Это не политическая борьба: это вопрос выживания.»\n\nВзгляд Аянэ больше не был взглядом студентки. Это была решимость лидера, ответственного за страну."
	ABY_descision_focus_event.64.a: "Соу действует. Приготовьтесь как следует."

	ABY_descision_focus_event.65.t: "Параллельные линии, не пересекающиеся"
	ABY_descision_focus_event.65.d: "Комната для допросов в подземном бункере Командования обороны столицы. Под бледным светом люминесцентных ламп сидела Асагири Соу в наручниках. Ее форма во время захвата была помята, нашивки сорваны, но ее манера поведения оставалась высокомерной, как у победительницы.\n\nКогда Аянэ и члены Комитета контрмер вошли с другой стороны стекла, Соу окинула их кривой улыбкой.\n\n«Поздравляю, председатель. Или теперь нужно говорить премьер-министр? Для вашей, игрушечной, разведки вы справились довольно хорошо.»\n\n«Я хочу спросить вас кое-что, госпожа Соу.» — холодно спросила Аянэ. «Почему? Мы вместе защищали эту страну. Почему вы направили свое оружие против своих же товарищей?»\nСоу издала презрительный смешок. В этом смехе было глубокое презрение.\n\n«Товарищи? Ха... не ошибайся. Ваша мягкая и слабая позиция делает эту страну больной. Вы свергли Бенеша и взяли власть, и что вы сделали? Примирение? Сосуществование? С таким цветочным идеализмом не остановить надвигающуюся огромную войну. Я пыталась сделать эту страну твердой, как сталь. Даже если бы пришлось пролить кровь, я хотела создать сильное государство, способное выжить!»\nОна вонзила свой ледяной взгляд в Аянэ.\n\n«Но... какой смысл тебе это говорить? Вы никогда не поймете. Вы — глупые дети, не знающие, что такое война и что такое государство.»\nСловно говорить дальше было не worth it, она откинулась на спинку стула и закрыла глаза. Это было не смирение побежденной, а ядовитое презрение к существам, которых она считала неспособными понять.\n\nАянэ закусила губу и отвернулась."
	ABY_descision_focus_event.65.a: "\"Асагири Соу. Я передаю вас военному трибуналу по обвинению в заговоре с целью мятежа и государственной измене.\""

	ABY_descision_focus_event.66.t: "Пир крокодилов"
	ABY_descision_focus_event.66.d: "Роскошный особняк на окраине Праги. Под светом ослепительной люстры директора жесткой линии Группы Нефтис сидели напротив Асагири Соу. Воздух был тяжел от дыма сигар, странного напряжения и алчности.\n\n«Средства уже готовы, майор. Нефтис возлагает большие надежды на эту 'большую операцию'.»\n\nСказал толстый директор с маслянистой улыбкой.\n\n«Все это время под именем Абидоса Нефтис была слишком ограничена. Метод госпожи Нономи... был слишком наивным. Компании должны стремиться к прибыли и власти. Если все выйдет, монополия на государственные контракты и поставки военного снаряжения... вы нам гарантируете, верно?»\n\nСоу медленно вращала бокал с вином, наблюдая за ними. В ее глазах было презрение к ним, но на губах играла спокойная улыбка.\n\n«Конечно. Для восстановления нации нужна сила таких амбициозных людей, как вы. Я хочу сильную страну, а сильная страна рождается из денег, не так ли?»\n\n«О-о! Как и следовало ожидать, генерал, вы понимаете!»\n\nДиректора разразились довольным смехом и переглянулись. В их глазах светился расчет использовать Соу как пугало, чтобы манипулировать властью по своему усмотрению.\n\nСоу тоже отпила глоток и усмехнулась про себя.\n\n'Старые дураки. Когда это свершится, я вспорю вам эти жадные животы и наполню государственную казну.'\n\nРаздался хрустальный звон бокалов. Каждый планировал использовать другого и уничтожить,"
	ABY_descision_focus_event.66.a: "крокодилы улыбались и наслаждались пиром."

	ABY_descision_focus_event.67.t: "Искушение стали"
	ABY_descision_focus_event.67.d: "Временная столица, Прага, пылала. Силы путчистов Соу наступали с неудержимой мощью, но отчаянное сопротивление Командования обороны столицы под руководством Сироко не давало им пересечь реку Влтаву. Уже третий день длилось напряженное противостояние, разделенных одним мостом.\n\nДелегация для переговоров от стороны путчистов прибыла на командный пункт Сироко с белым флагом. Офицер, безупречно одетый в форму, отдал ей честь с уважением.\n\n«Командир Сунаоками. Дальнейшее бессмысленное кровопролитие — потеря для нации. Генерал Соу высоко ценит ваши способности.»\n\nСироко отвела взгляд от карты, которую изучала с лицом, покрытым пылью, и посмотрела на него в упор. «Капитуляции не будет.»\n\n«Послушайте. Это последнее предложение.» Офицер достал из-за пазухи конверт с документами и положил его на стол. «Если вы прекратите сопротивление и сдадитесь сейчас, мы ограничим свободу только вам, командир. Безопасность остальных членов Комитета контрмер, включая премьер-министра Аянэ, будет полностью гарантирована.»\n\nБрови Сироко дрогнули.\n\n«Им даже не нужно уезжать в изгнание. При новом правительстве они смогут свободно жить как обычные граждане. Ходить в школу, работать, наслаждаться нормальной жизнью... разве это не та жизнь, которую вы на самом деле хотели?»\n\nСлова офицера попали в самое слабое место Сироко.\n\n«Но если вы продолжите сопротивляться... в следующем наступлении будет применена тяжелая артиллерия. Тогда не только вы, но и ваши друзья, которых вы пытались защитить, превратятся в пепел.»\n\nВ командном пункте воцарилась тяжелая тишина. Сироко дрожащей рукой сжала приклад винтовки.\n\nЕсли сдамся только я, все будут в безопасности. Крови больше не будет. Но... правильно ли это? Могу ли я доверять Соу?\n\nЕе взгляд переместился на пылающую Прагу за окном и на измотанных адъютантов, спавших вповалку. Ее губы шевельнулись, но приказ не вышел."
	ABY_descision_focus_event.67.a: "Да. Вы уже предали мое доверие."
	ABY_descision_focus_event.67.b: "...Это условие, ты должен его выполнить."

	ABY_descision_focus_event.68.t: "Дилемма победителя"
	ABY_descision_focus_event.68.d: "Балкон Пражского Града. Соу смотрела вниз. На улицах развевался ее флаг, горожане молчали перед дулами орудий. Путч удался. Правительство Аянэ пало, армия была у нее в руках.\n\n«Ваше превосходительство.» Ее адъютант приблизился и осторожно спросил. «Поздравляю. Пожалуйста, отдайте следующий приказ. Члены Комитета контрмер под домашним арестом... а также назначена встреча с директорами Нефтис, требующими долей.»\n\nСоу, вместо ответа, закурила сигарету. Дым таял в воздухе. Больше, чем эйфория, ее разумом владел холодный расчет.\n\n'Кого выгоднее ударить первым?'\n\nОна прищурилась и задумалась.\n\nПервый вариант: Комитет контрмер. Они — символ Абидоса. Если оставить их в живых, в любой момент они могут стать ядром сопротивления. Но если их казнить... гнев народа вспыхнет, и жители кивотосского происхождения поднимутся как толпа.\n\nВторой вариант: совет Нефтис и остатки нацистов. Это жадные гиены. Они уже победили и теперь захотят запустить руки в государство и поделить прибыль. Если провести чистку под предлогом «очистки коррумпированных корпораций и иностранных сил», она получит восторженную поддержку масс. Но если сразу лишиться их денег и военной силы... удержится ли этот нестабильный режим?\n\nСоу постучала по перилам: тук-тук.\n\nИдеалистическая революция закончилась, и теперь ее ждала реальная политика, пропитанная запахом крови. Держа рукоять меча, она еще не решила, куда направить лезвие."
	ABY_descision_focus_event.68.a: "Комитет контрмер — это риск"
	ABY_descision_focus_event.68.b: "Есть проблема более срочная, чем они"

	ABY_descision_focus_event.69.t: "Выжившая"
	ABY_descision_focus_event.69.d: ""
	ABY_descision_focus_event.69.a: "Я отомщу... любой ценой."

	ABY_descision_focus_event.70.t: "Шибан-кван"
	ABY_descision_focus_event.70.d: ""
	ABY_descision_focus_event.70.a: "Армия Просвещения смела все PMC Нефтис? хахахаха"

	ABY_descision_focus_event.71.t: "Красный Щит, снова"
	ABY_descision_focus_event.71.d: "При свете свечи в тесном временном офисе я рассматриваю старую карту Европы. Вена, Париж, Лондон, Франкфурт... все места, где сияло имя моей семьи, теперь стали территорией неизвестных академий или пеплом. Люди шепчутся, что Ротшильды кончились. Что, как еврейский беженец, я могу сделать? Некоторые жалеют меня; другие насмехаются. Они не понимают: наша настоящая сила не в золоте в хранилищах, а в самом имени, 'Ротшильд'. И у меня еще остался сталелитейный завод в Витковице. Единственное сердце, все еще бьющееся на этой хаотичной земле.\n\nЭти девушки со странными ореолами, чехи, потерявшие свой дом, немцы, полные ненависти... этот шаткий союз — опасная авантюра, но также и единственный шанс. Хорошо. Я начну заново с этой маленькой искры. Я дам им капитал, создам кредит и восстановлю жилы разрушенной войной экономики. Я им понадоблюсь.\n\nКрасный Щит никогда не ломается. Здесь, в Богемии, я снова потрясу Европу."
	ABY_descision_focus_event.71.a: "Эта слава, еще раз."

	ABY_descision_focus_event.72.t: "Наследница с пустыми руками"
	ABY_descision_focus_event.72.d: "Стоя у окна маленького офиса в Усти-над-Лабем, я сжала и разжала ладонь. Пусто. Такова Нефтис сейчас. Огромное здание штаб-квартиры в Кивотосе, бесконечные фабрики, филиалы в каждом автономном округе... все это принадлежит миру, до которого я больше не могу дотянуться. Единственное, что попало в Европу, — это имя «Нефтис», я сама и несколько десятков сотрудников.\n\nЛюди возлагают на меня надежды, но огромная финансовая мощь, которую они себе представляют, — не более чем мираж. Если бы они знали правду, разочаровались бы? Но... Сенсей сказал мне. Что, раз у меня пустые руки, я могу наполнить их заново чем угодно.\n\nДа, это правда. Мне больше не нужно быть раздавленной грузом прошлого. Нет капитала, фабрик, сети распределения... ничего. Но у меня есть мои друзья из Абидоса и это странное коалиционное правительство.\n\nНачну отсюда. Как строить с голой земли, кирпич за кирпичом. Не Нефтис, царящую с помощью денег, как раньше, а новую Нефтис, которая будет помогать всем с помощью кредита и сотрудничества. Вот что я должна сделать на этой хаотичной земле.\n\nС этими пустыми руками я создам завтрашний день для всех."
	ABY_descision_focus_event.72.a: "Ради него я должна следовать знамени Федерации."
	ABY_descision_focus_event.72.b: "Ради него я должна сохранять идентичность компании."

	ABY_descision_focus_event.73.t: "Стальное сердце не гаснет"
	ABY_descision_focus_event.73.d: "Временная мастерская, оглушаемая ударами молотов и искрами сварки. Огромный завод в Пльзене теперь принадлежит этим из Хяккияко, но люди забывают одну важную вещь: душа Шкоды не в кирпичах фабрики, а в головах и руках наших техников.\n\nРемонтируя старые винтовки ополчения Генлейна и устанавливая новые двигатели в бронетехнику чешской армии, мы начали заново. Мы потеряли все: активы и оборудование. Но у нас все еще есть 'чертежи'.\n\nВ конце концов, армия этого временного правительства сможет опереться только на сталь, которую выкуем мы. Сила этих девчонок с ореолами поразительна, но война решается логистикой и технологией.\n\nПрофессор Масарик доверился нам, и мы вернем это доверие. В этой маленькой мастерской мы создадим новое сердце для союзных сил: более мощные пушки, более прочную броню, более быстрые двигатели.\n\nШкода — не просто компания. Это движущая сила этой страны и копье, которое пронзит сердце врага. Вот увидите: наши технологии станут фундаментом этой странной нации."
	ABY_descision_focus_event.73.a: "Восстановим традицию."

	ABY_descision_focus_event.74.t: "Внутренняя стабилизация"
	ABY_descision_focus_event.74.d: "Вы можете начать фокус Операции Наква."
	ABY_descision_focus_event.74.a: "Подготовка закончена."

	ABY_descision_focus_event.75.t: "Надежда (Espero)"
	ABY_descision_focus_event.75.d: "Ян Филип, писатель, принадлежавший к чешскому филиалу эсперанто, слегка улыбался, наблюдая, как местные жители и люди из Кивотоса повсюду учат эсперанто. Он никогда не мог себе представить такого. Эсперанто, созданный и представленный доктором Заменгофом, в конце концов стал чем-то бесконечно малым перед величиной английского и французского... или они так думали.\n\n«Saluton, mia amiko. (Привет, друг.)»\n\nМилош Лукас, один из его коллег по ассоциации, посмотрел на него и улыбнулся, отвечая на эсперанто. Хотя и в малом масштабе, сцена, о которой мечтал профессор Заменгоф, разворачивалась.\n\nЛюди из Кивотоса, немцы и чехи, без различия, учат эсперанто, чтобы иметь возможность общаться друг с другом... и, кроме того, это увенчивается успехом. Даже они не могли бы этого предвидеть.\n\n«Скажи, Милош... не думаешь ли ты, что эти из Кивотоса, возможно, принесли нам возможность?»\n\n«Надежду, да?»\n\nМилош мягко улыбнулся ему."
	ABY_descision_focus_event.75.a: "\"Да, эсперанто (Esperanto). Наконец... наконец мы можем спеть это имя.\""

	ABY_descision_focus_event.76.t: "Освобождение Богемии"
	ABY_descision_focus_event.76.d: ""
	ABY_descision_focus_event.76.a: "Отменить тотальную мобилизацию."

	ABY_descision_focus_event.77.t: "Проводник на распутье"
	ABY_descision_focus_event.77.d: "Прошла неделя с тех пор, как путч Соу был подавлен и стрельба затихла на улицах Праги. Разрушенные здания ремонтировались, горожане возвращались к своей рутине, но в кабинете верховного администратора воздух оставался тяжелым, как свинец.\n\nАянэ переводила взгляд между двумя толстыми отчетами на своем столе. Глубокие тени залегли под глазами. Рядом с ней Хосино отдыхала на диване, молча глядя в потолок.\n\n«Нужно решать, сенпай Хосино. Мы больше не можем откладывать.»\n\nГолос Аянэ был сух. Они судили Соу и защитили демократическое правительство, но это не отвечало на вопрос «что именно мы должны защищать».\n\n«Первый вариант... это 'восстановление'.»\n\nАянэ взяла папку слева.\n\n«Унаследовать легитимность Чехословацкой Республики и Австрийской Республики. Изначальными хозяевами этих земель были они. Мы возвращаемся, как и обещали, на позицию 'тех, кто помогает', и нового лидера изберут из числа местных жителей. Это путь с наибольшей легитимностью и наименьшей полемикой.»\n\n«Но...» — тихо ответила Хосино. — «Если мы так сделаем, мы навсегда останемся 'гостями'. И когда-нибудь снова может вспыхнуть конфликт между 'хозяевами' и 'гостями'. Как с Бенешем.»\n\n«Именно.»\n\nАянэ сжала папку справа. На обложке было написано: [План построения нового государства в соответствии с теорией интеграции двух миров].\n\n«Поэтому и родилась эта 'теория двух миров'. Не разделять местных жителей и людей из Кивотоса, а полностью интегрировать их как 'федеральных граждан' с новой идентичностью. Не только сосуществование: слияние. Если это сработает, в долгосрочной перспективе это может погасить искру этнического конфликта в корне. Это ближе всего к истинному идеалу, о котором мечтал профессор Масарик.»\n\nНо рука Аянэ дрожала. Закусив губу, она с болью заговорила.\n«Но, сенпай... чтобы пойти этим путем... нам снова придется увидеть кровь.»\n\n«……»\n\n«Нам придется объявить чешский, немецкий, австрийский и кивотосский национализмы 'пережитками другой эры' и насильственно их демонтировать. Подавлять тех, кто отвергает нашу идентичность, и силой оружия подчинять радикалов, выступающих против интеграции, чтобы насадить этот новый порядок. Это будет не то же самое, что хотела сделать Соу, но в конце концов... мы тоже впадем в противоречие, применяя 'насилие ради мира'.»\n\nАянэ посмотрела в окно. Над восстанавливающимся городом накладывались два будущих.\n\nПуть 'почетного чужака', который уходит, уважая хозяев прошлого.\n\nИли путь 'одинокого первопроходца', который, даже если покроется кровью, силой свяжет два мира, чтобы превратить их в один вечный.\n\n«Какой же ответ будет правильным, ухии...» — горько улыбнулась Хосино, поднимаясь. — «Какой бы ни был, я разделяю ответственность. Аянэ-тян, ты просто выбирай.»\n\nАянэ глубоко вздохнула и подняла ручку. Настало время писать следующую страницу книги истории, чернила на которой еще не высохли."
	ABY_descision_focus_event.77.a: "Хозяева этой земли"
	ABY_descision_focus_event.77.b: "Земля двух миров"

	ABY_descision_focus_event.78.t: "Красная нить"
	ABY_descision_focus_event.78.d: "В пражском переулке, в сыром подпольном убежище, воздух был тяжел. Хосино погрузилась в старый диван. Несмотря на борьбу Сироко, численный перевес путчистов был подавляющим. Аянэ, Серика, Нономи, Сироко... все они были заперты в тюрьме Соу.\n\n«Товарищ... нет, председатель Хосино. Вы плохо выглядите.»\n\nМужчина, сидевший напротив, Клемент Готвальд, обратился к ней, притворно выражая беспокойство. Он был лидером 'Коммунистической партии Дуная', миноритарной фракции внутри Социалистического союза Абидоса. В обычных условиях он бы и в подметки Хосино не годился, но с тех пор как Абидос разгромил врагов с Востока, его влияние странным образом выросло. Было секретом Полишинеля, что за этим стояли фонды и массированная поддержка Кремля.\n\n«Ухии~ Да, вид у меня ужасный. И все же, спасибо, что вытащил меня оттуда, господин Готвальд.»\n\n«Разве мы не товарищи? Москва... нет, наши активисты не могли сидеть сложа руки, наблюдая, как фашистка Соу попирает демократию.»\n\nГотвальд пододвинул по столу документ: декларацию о создании 'Антифашистского объединенного фронта'. Но, прочитав его, взгляд Хосино стал острым.\n\n«Это... здесь сказано, что военное командование и все решения партии полностью делегируются 'Дунайскому комитету'. По сути, ты предлагаешь мне отойти в сторону и оставить только вывеску, так?»\n\n«Это всего лишь формальная процедура.» — хитро улыбнулся Готвальд. — «Сейчас нужна сильная международная поддержка Кремля... то есть, и организационные способности. Если вы согласитесь, мы предоставим вам 'силу', чтобы свергнуть Соу и немедленно спасти ваших ценных подруг.»\n\nХосино сжала кулак. Предупреждение Сенсея Масарика зазвенело в ушах.\n\n'Нельзя доверять коммунистам. Они марионетки Кремля.'\n\nОна знала. Если она возьмется за эту руку, партия, которую она создала, станет партией-сателлитом СССР, а идеал Абидоса будет перекрашен в красный. Это был договор с дьяволом.\n\nНо.\n\n«Ты действительно... сможешь спасти наших девчонок?»\n\n«Клянусь жизнью.»\n\nДрожащей рукой Хосино взяла ручку. Пока ее кохаи находились в той холодной тюрьме, у нее не было выбора. Даже если эта нить горела красным, она должна была ухватиться за нее сейчас."
	ABY_descision_focus_event.78.a: "Я ухватилась за руку дьявола."

	ABY_descision_focus_event.79.t: "Освобожденный волк"
	ABY_descision_focus_event.79.d: "В темноте трясущегося транспортного фургона Сироко смотрела на свои руки в наручниках. Снаружи слышались сирены, возвещавшие победу путча. Все кончено. В обмен на ее капитуляцию Аянэ и остальные сохранили жизнь. С этого было достаточно, повторяла себе Сироко. Даже если она станет трофеем Соу и закончит жизнь в заточении или будет казнена, искра Абидоса была сохранена.\n\nНо тут...\n\nБА-БАХ!\n\nОгромный взрыв сотряс грузовик. Визг тормозов, крики и вопли снаружи.\n\n«Атака! Всем занять боевые позиции!»\n\n«Остановите их! Эти безумцы... ах!»\n\nОтчаянные крики солдат потонули в реве толпы. Это был не крик организованной армии. Это были грубые голоса тысяч, десятков тысяч, полные ярости... и надежды.\n\n«Верните нам Сироко!»\n\n«Освободите героиню Абидоса!»\n\nЗадняя дверь была с грохотом сорвана. В слепящий солнечный свет, хлынувший внутрь, появились лица гражданских с коктейлями Молотова, металлическими трубами и старыми охотничьими ружьями. Это были граждане Праги. Не боясь бронетехники Соу, они ринулись на колонну голыми руками.\n\n«Командир! Простите, что опоздали!»\n\nМолодой человек в окровавленных бинтах перерезал ее наручники. Вытащенная наружу, Сироко потеряла дар речи при виде того, что предстало перед ней: людская масса, заполнившая Вацлавскую площадь. Они скандировали ее имя, вытесняя силы путчистов.\n\n«Уууаааа!! Да здравствует Сироко!! Да здравствует свободный Абидос!!»\n\nСироко посмотрела на свои руки. Связанные руки были свободны, и граждане снова звали ее в центр поля боя. Она больше не была побежденной пленницей. Она стала самим ядром великой революции."
	ABY_descision_focus_event.79.a: "Что... это...?"

	ABY_descision_focus_event.80.t: "Между кровью и бархатом"
	ABY_descision_focus_event.80.d: "На ступенях перед Национальным музеем, отвоеванном гражданами, Сироко сидела на грузовике, используемом как временный командный пункт, изучая карту. Силы путчистов Соу, теснимые гражданским напором, временно отошли к западу от Влтавы. Но они перегруппировывались и скоро попытаются предпринять жестокое подавление с танками во главе.\n\n«Командир, мы разграбили арсенал и вооружили граждан! Только дайте приказ. Сегодня ночью штурмуем резиденцию и оторвем голову Соу!»\n\nПредставитель гражданских, выдвинувшийся как лидер ополчения, радостно кричал. За ним тысячи граждан с коктейлями Молотова и захваченными винтовками не сводили глаз с уст Сироко.\n\nСироко передернула затвор врученной ей винтовки, по чистой привычке.\n\n'Я могу сражаться.'\n\nИнстинкт волка шептал. Уличные бои были ее специальностью. Если использовать эту толпу как приманку и щит, а сама поведет ударную группу для удара по командованию Соу, есть шансы. Это было самое быстрое и надежное солдатское решение.\n\nНо...\n\nВ ее глаза попал маленький мальчик, сжимающий оружие. Он дрожал от страха, притворяясь храбрым. Если разразится тотальная война, этот мальчик падет первым под пулемет Соу. Прага превратится в море огня, и даже в случае победы поле будет усеяно трупами.\n\nЭто ли она хотела защитить? Разрушенную страну и мертвых граждан?\n\n'Разве нет другого пути?'\n\nОна опустила оружие и задумалась.\n\nОтказ от оружия. Ненасилие.\n\nЗвучало как безумие: остановить танки своими телами. Но армия Соу тоже состояла из людей. Они тоже чьи-то сыновья и братья. Если придет приказ стрелять по безоружным гражданским и их совесть дрогнет... если нейтральная фракция в армии перейдет на нашу сторону...\n\nЕдинственный путь победить без крови; самый рискованный, потому что в случае провала закончится резней.\n\n«Командир?»\n\nПеред торопящим голосом Сироко подняла голову. Ее глаза перестали колебаться и застыли холодно. Она сжала винтовку... и затем, очень медленно, опустила ее на землю.\n\nВолк принял решение."
	ABY_descision_focus_event.80.a: "Да. Нет времени. Нужно идти сейчас."
	ABY_descision_focus_event.80.b: "Все, опустите оружие. Я пойду вперед."
	ABY_descision_focus_event.81.t: "Корона волка"
	ABY_descision_focus_event.81.d: "Прага была освобождена, но на улицах все еще витал сильный запах пороха. Соу была свергнута, но вакуум власти, который она оставила, призвал монстра по имени хаос. Граждане разграбили военные арсеналы, чтобы вооружиться, и повсюду вспыхивали самосуды под предлогом «охоты на остатки Соу». «Свобода» начинала становиться другим именем для «беспорядка».\n\nСироко, стоя у окна кабинета, смотрела на бурлящие улицы. Рядом с ней офицеры штаба держали горы отчетов.\n\n«Командир, невозможно поддерживать безопасность. С полицейскими силами мы не можем контролировать вооруженные ополчения и гражданские дружины. Мы должны задействовать армию.»\n\nСироко закусила губу. То, чего она желала, было восстановлением демократии, а не беззаконной территорией. Но ей не у кого было спросить совета. Аянэ и остальные, спасенные, находились в больнице из-за последствий пыток, изолированные от внешнего мира.\n\n«Нужен... порядок.»\n\nЛюди собирались на площади, выкрикивая имя Сироко. Они не хотели ни парламентских процедур, ни дебатов: они хотели сильного «героя», который защитит их здесь и сейчас. Сироко приняла эти крики за стремление к демократии.\n\n«Моя миссия — нормализовать эту страну. Пока... еще не время выпускать меч из рук.»\n\nПовернувшись к своим офицерам, она отдала приказ:\n\n«Я продлю чрезвычайные полномочия. До тех пор, пока безопасность не стабилизируется и парламент не вернется к нормальной работе, я возьму на себя общее руководство правительством. Все нерегулярные вооруженные формирования должны быть немедленно распущены и подчинены контролю армии.»\n\nНе осознавая, что это была первая пуговица, которая навсегда заточит ее в ярме власти,"
	ABY_descision_focus_event.81.a: "чистый волк не знал этого."

	ABY_descision_focus_event.82.t: "Вес бархата"
	ABY_descision_focus_event.82.d: "Это было чудо. Когда Сироко опустила оружие и вместе с людьми встала перед танками, винтовки стороны путчистов не выстрелили. Соу была арестована без единой капли крови, и площадь наполнилась звоном связок ключей и зажженных свечей. Со временем люди назовут это «Бархатной революцией», потому что они свергли диктатуру мягко, но твердо.\n\nСтрана быстро восстановила стабильность. Сироко считала, что ее роль закончена.\n\n«Тогда... мне пора возвращаться. Остальное — дело Аянэ и политиков.»\n\nОна пошла в больницу сказать Аянэ, лежащей в постели, что вернется. Но Аянэ, глядя в пустоту за окном, покачала головой.\n\n«Нет, сенпай. Я... не вернусь.»\n\n«Аянэ?»\n\n«Я слишком устала. От доверия к людям, от занятия политикой. Чувствую, что предательство Соу сломало что-то внутри меня. Теперь политика... мне не по силам.»\n\nОтказ Аянэ был ударом. То же самое думали Хосино и остальные: они покачали головами, глядя на Сироко.\n\n«Ухии~ Сироко-тян. Сейчас единственный человек, способный выпрямить эту страну, — это ты. Ради кого поднялись люди?»\n\n«Верно. Даже если мы выйдем, поддержка будет на нуле. Но с тобой, сенпай, все иначе.»\n\nСироко, озадаченная, посмотрела на свою старую военную форму.\n\n«Я солдат. Не знаю политики.»\n\n«Ты можешь научиться. Мы поможем.»\n\nХосино положила руку на плечо Сироко. Сироко посмотрела на белые стены больницы и измученные лица своих подруг. Кто-то должен был взвалить на себя этот груз. Дрожащей рукой она начала расстегивать пуговицы формы."
	ABY_descision_focus_event.82.a: "Это была церемония отправления на поле битвы более трудное, чем война."

	ABY_descision_focus_event.83.t: "Железная демократия"
	ABY_descision_focus_event.83.d: "Через шесть месяцев после объявления о продлении чрезвычайных полномочий Сироко сняла форму, как и обещала. Она ушла с военного командования и, уже как гражданское лицо, основала «Федеральную демократическую республиканскую партию». Люди разразились ликованием. Того, что героиня родины оставила винтовку и взяла избирательный бюллетень, было достаточно, чтобы вызвать иллюзию, что демократия наконец-то завершена.\n\nПредвыборные мероприятия походили на концерты айдолов. Когда Сироко поднималась на трибуну и неуклюже махала рукой, десятки тысяч приходили в неистовство. Голос оппозиции называли «шумом, мешающим национальному восстановлению», и он тонул в народном безразличии.\n\n«Я здесь, чтобы защитить повседневную жизнь каждого. Я создам сильный Абидос, федерацию, которая не будет шататься.»\n\nРезультат был ошеломляющим. Почти 90%. Сироко, услышав подтверждение своей победы, наконец вздохнула с облегчением.\n\n«Да. Этого достаточно. Граждане выбрали меня, значит, легитимность обеспечена. Теперь я смогу построить страну, о которой мечтала Аянэ.»\n\nНо рядом с ней не осталось ни одного советника, который мог бы сказать ей «нет», ни одного парламента, способного ее сдержать. То, что создала Сироко, было железным правительством в демократической маске. Став хозяйкой парламента, не осознавая, что ее правительство душит демократию, Сироко направлялась к тому, чтобы стать самым «демократичным» диктатором из всех."
	ABY_descision_focus_event.83.a: "Да здравствует президент!!"

	ABY_descision_focus_event.84.t: "Волк в костюме"
	ABY_descision_focus_event.84.d: "Сироко вступила в «Народную либерально-социальную партию», реорганизацию центристской партии, которую раньше возглавляла Аянэ. Для человека, который всю жизнь только и делал, что касался оружия и тактических руководств, партийная политика была незнакомой территорией. Однако прямолинейность и способность к действию, присущие Сироко, запали в сердца граждан сильнее, чем изящная риторика обычных политиков.\n\n«Я не знаю ни экономики, ни дипломатии. Но я умею выполнять обещания. И я не собираюсь никого бросать.»\n\nЕе неуклюжая речь разнеслась по радио и распространилась по всей федерации. Аянэ осталась в тени как политический советник, прикрывая недостатки Сироко; Хосино и Серика руководили кампанией, объезжая страну; а с финансовой поддержкой Нономи популярность Сироко взлетела до небес.\n\nИ наступили 2-е федеральные всеобщие выборы. Результатом стало парламентское большинство Народной либерально-социальной партии и убедительная победа Сироко.\n\nВ ночь, когда подтвердился ее триумф, Сироко поднялась на трибуну для победной речи. Под вспышками фотоаппаратов она уже не была командиром в форме. Одетую в безупречный костюм, ее можно было принять за легитимного и демократического лидера, предназначенного направлять гармонию двух миров: «президента Федерации Абидоса».\n\n«Сегодняшняя победа — не только моя. Да, это победа всех, кто держал свечи на площади. Теперь вместе со всеми гражданами обоих миров мы пойдем грабить банк... нет, будущее.»\n\nПлощадь была погребена под овацией из-за его последней полушутливой фразы."
	ABY_descision_focus_event.84.a: "Это было истинное начало весны."

