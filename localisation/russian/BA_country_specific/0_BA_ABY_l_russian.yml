	ABY_descision_focus_event.1.t: "Клятва Богемии"
	ABY_descision_focus_event.1.d: "В начале 1936 года ратуша Карловых Вар была переполнена желающими стать свидетелями новой истории. Чешское временное правительство, делегация, представляющая судетских немцев, и студентки Академии Абидос, находящиеся в центре всех этих перемен. В торжественной атмосфере Эдвард Бенеш поднялся на трибуну. Его голос был тих, но обладал достаточной силой, чтобы четко запечатлеться в ушах каждого.\n\n«Дорогие граждане Чехии. Мы потеряли нашу столицу, Прагу. Однако мы никогда не теряли наш дух. Наша цель ясна: полное освобождение Чехии. Я торжественно заявляю здесь, что мы приложим все усилия до того дня, когда наш суверенитет снова твердо встанет на этой земле.»\n\nПеред этим тихим, но твердым заявлением чехи в публике кивнули с суровыми выражениями лиц. Вместо оглушительных аплодисментов зал наполнило молчание, полное решимости. Вскоре на трибуну поднялся уважаемый всеми Томаш Масарик.\n\n«Как сказал господин Бенеш, мы должны вернуть нашу родину. Но мы должны помнить одну важную вещь: эта земля уже не только наша, но и дом соседей, которые будут жить рядом с нами. Истинная нация создается не только возвращением территории, но и когда разные люди образуют сообщество в гармонии. Давайте уважать наши различия и вместе строить завтрашний день.»"
	ABY_descision_focus_event.1.a: "Каждый народ поднял свой голос, чтобы крикнуть: Да здравствует!"

	ABY_descision_focus_event.2.t: "Голос Судет"
	ABY_descision_focus_event.2.d: "После Масарика на трибуну поднялся Конрад Генлейн, представитель судетских немцев. Он начал свою речь спокойным тоном, не давая волю эмоциям.\n\n«Уважаемые соотечественники-судеты. Слишком долго мы жили, лишенные своего голоса. Наши законные права должны быть гарантированы, и южная родина, которая была у нас отнята, должна вернуться в наши объятия. Это требование выживания, и мы не стремимся ни к чему большему. Мы лишь желаем защитить нашу родную землю.»\n\nСдержанная и отточенная речь Генлейна пробудила глубокое сопереживание и твердую сплоченность среди жителей немецкого происхождения. Когда он спустился с трибуны, микрофон взял Людвиг Чех, с мягким лицом. С нежной улыбкой он сказал:\n\n«Желание защитить нашу родину одинаково для всех нас. Сегодня наша родина стала шире, благодаря нашим соседям-чехам и гостям, прибывшим из Абидоса. Когда мы говорим о наших правах, давайте проявим зрелость, учитывая также и их права. Только когда мы будем слушать истории друг друга, мы сможем стать настоящими соседями.»"
	ABY_descision_focus_event.2.a: "Оглушительные аплодисменты охватили зал."

	ABY_descision_focus_event.3.t: "Обещание Абидоса"
	ABY_descision_focus_event.3.d: "Последней ораторшей была Таканаши Хосино из Академии Абидос. Она поднялась на трибуну со своим характерным сонным выражением лица.\n\n«Ухии~ ну, я не умею говорить такие громкие слова. Нам просто нужно было место, где мы могли бы жить в безопасности вместе с нашими кохаями и друзьями, и поэтому мы дошли до сюда. Хотелось бы, чтобы это место стало таким. А тем, кто посмеет тронуть наших, мы спуску не дадим. Это единственный принцип Абидоса.»\n\nИскренность, заключенная в этих незамысловатых словах, тронула сердца публики. Когда Хосино отошла, Окусора Аянэ завершила выступления спокойным голосом.\n\n«Нашим началом была защита наших товарищей. И теперь мы поняли, что все собравшиеся здесь должны стать товарищами, которые защищают друг друга. Суверенитет Чехии, права Судет, безопасность Абидоса. Все это сходится в одной цели: нашем общем процветании. Сегодня мы делаем не просто шаг к соглашению, а первый шаг как сообщество судьбы, которое будет вместе строить новое будущее.»\n\nС заявлением Аянэ три представителя подписали соглашение. Люди разного происхождения, идеологий и даже миров скрепили это глубокое обещание. Так «Государство Двух Миров» официально родилось, неся в себе как надежду, так и вызовы."
	ABY_descision_focus_event.3.a: "Первая глава истории гармонии, рожденной из ненависти."

	ABY_descision_focus_event.4.t: "Возвращенная стабильность"
	ABY_descision_focus_event.4.d: "Отчет о военной операции: Дело Катаката, № 107\n\nПосле падения последней базы Сектора 8 руководящая верхушка Группы Каска Катаката, бежавшая, подчинила пограничные войска по направлению к Эгеланду и попыталась запросить убежище в Хяккияко. Однако, будучи вынуждены отступить к контрольно-пропускному пункту после атаки армии Хяккияко, они были обнаружены часовыми и, при вмешательстве жандармерии, были захвачены.\nПримечание: Командир жандармерии, Сунаоками Сироко, лично возглавляла авангард.\n\nЛояльные фракции группы каска, проводившие партизанские действия в разных секторах, в основном прекратили операции и сдались после ареста своих лидеров.\n\nИз-за высокого числа сдавшихся и захваченных было решено, что это не вопрос, который должна решать армия, поэтому полномочия по принятию решения были переданы правительству.\n\n\nОтчет: Юридическая комиссия, № 782\n\nСогласно действующему законодательству, они не должны считаться военнопленными, а мятежниками, и в этом случае большинство членов будет заключено в тюрьму.\nОднако в соответствии с Законом о чрезвычайных полномочиях, принятым Административным указом № 111, их можно считать силами сопротивления, и в этом случае с ними будут обращаться как с военнопленными, разрешая убежище или ограниченную военную службу.\n\nКраткое содержание: В зависимости от юридической интерпретации они могут быть классифицированы как силы сопротивления или как мятежники, и обращение будет соответственно различаться. Поэтому решение делегируется исполнительной власти."
	ABY_descision_focus_event.4.a: "Считайте их мятежниками и предайте суду."
	ABY_descision_focus_event.4.b: "Каждый боец на счету. Считайте их силами сопротивления."

	ABY_descision_focus_event.5.t: "Долина Председателей Студенческих Советов"
	ABY_descision_focus_event.5.d: "Когда поиск людей из Кивотоса внутри временного правительства подходил к концу, ополчение организовало поисковый отряд и направилось в Долину Председателей Студенческих Советов. Несмотря на то, что это был почти необитаемый регион, долина, обладавшая наибольшей площадью переноса в пределах Абидоса, задерживала операцию из-за своей негостеприимной среды и огромных размеров.\n\nТолько собрав около 200 человек и завершив тренировку по адаптации, стало возможным войти в зону.\nОднако, сколько бы они ни продвигались вглубь долины, не было слышно ни следа человеческого присутствия, ни даже звука мелких животных.\n\n«Здесь действительно что-то есть?»\n«Похоже на то... уже почти стемнело...»\n«Э? Вон там что-то есть!»\n«Что?»\n\nОтряд приблизился к гигантскому черному силуэту, видневшемуся вдалеке, и, подойдя к нему, потерял дар речи.\n\n«Это... что это...?»\n«Слушай, скажи мне. В Кивотосе такие вещи разгуливают?»\n«Нет... я тоже такого раньше не видел...»\n«Тут эмблема Абидоса. А это... из Геенны...?»\n\nПеред черным бронепоездом, вооруженным пушками и высоким, как здание, они стояли в оцепенении долгое время."
	ABY_descision_focus_event.5.a: "Фотографии? У кого-нибудь есть камера?"

	ABY_descision_focus_event.6.t: "Наследие Повелителя Грома"
	ABY_descision_focus_event.6.d: "Информация об этом секретном оружии была строго засекречена, и было созвано совещание, на которое присутствовали лишь несколько высших командиров.\n\n«...Железнодорожная пушка Шемата. Оружие, носящее имя легендарного председателя студенческого совета, положившей конец периоду хаоса в Абидосе и приведшей академию к эпохе ее величайшего расцвета.»\n\n«Тогда каковы ее характеристики?»\n\n«Она оснащена строенным корабельным орудием 203 мм в качестве вспомогательного вооружения, двумя одиночными корабельными орудиями 152 мм, шестью спаренными орудиями 127 мм, и в качестве основного вооружения — плазменной башней 500 мм. Согласно описанию, она может стрелять снарядами весом в одну тонну на расстояние до 500 км.»\n«С радиусом 500 км вся территория Германии находится в зоне ее досягаемости с ее текущего местоположения.»\n\nПеред лицом таких абсурдных характеристик зал наполнился гулом.\nКак на Земле, так и в Кивотосе постоянно велись исследования по разработке оружия большой мощности, но это асимметричное оружие, появившееся внезапно, как комета, обладало потенциалом возвести эту маленькую страну в ранг великой державы, по крайней мере, в военном отношении.\n\n«Однако тот факт, что это наследие Повелителя Грома, вызывает беспокойство... Только обладая этим наследием, академии Кивотоса попытаются уничтожить нас, или, точнее, уничтожить железнодорожную пушку, как только представится возможность.»\n\n«Но уничтожить это оружие означало бы национальную потерю, а стоимость безопасного уничтожения была бы астрономической. Как сказала секретарь Аянэ, если обладание им уже делает нас целью, и мы не можем его уничтожить, не лучше ли его использовать?»\n\nНесмотря на получение столь мощного оружия, дебаты не утихали из-за различий в точках зрения между жителями Кивотоса и местными жителями."
	ABY_descision_focus_event.6.a: "Пока не поступил звонок."

	ABY_descision_focus_event.7.t: "Оружие разрушения"
	ABY_descision_focus_event.7.d: "\"Да, кабинет временного коалиционного правительства...\"\n\"Секретарь Аянэ, думаю, вам лучше подойти.\"\n\"Это Геенна.\"\n\nЗвонок от главы разведки Дисциплинарного комитета Геенны. Информация о железнодорожной пушке Шемата должна была быть строго конфиденциальной, как она просочилась? Аянэ даже не могла себе представить. Содержание звонка было простым: для Геенны железнодорожная пушка Шемата была нежелательным наследием Повелителя Грома, опасным оружием массового уничтожения. Разведывательный департамент сообщил, что их намерением было уничтожить ее.\n\nПосле завершения короткого, но тяжелого разговора Аянэ заговорила.\n\n«Существование Шематы... просочилось. Геенна уже знает.»\n\nГеенна знала информацию о Шемате и требовала ее демонтажа в обмен на военную поддержку. Перед этим фактом зал заседаний взволновался.\n\n«Это невозможно! Это была информация, управляемая как совершенно секретная! Как они могли...»\n«Разведывательный департамент Геенны, должно быть, вмешался! Это явное вмешательство в наши внутренние дела!»\n«И все же, по крайней мере, они не требуют безоговорочного уничтожения пушки. Они поставили условием военную поддержку.»\n«И мы даже не знаем, насколько полезной будет эта поддержка! Может, нам выгоднее сохранить пушку!»\n\nВременное коалиционное правительство охватила сильная суматоха. У Аянэ не было харизмы, чтобы навести порядок. Она лишь, как секретарь, систематизировала мнения представителей Кивотоса и местных жителей, пока не будет достигнут консенсус. К счастью, дискуссия не переросла в серьезное противостояние. Все соглашались в одном: нужен быстрый ответ.\n\nЗаключение было ясным. Аянэ снова взяла трубку.\n\n«Мы положительно рассмотрели ваше предложение.»"
	ABY_descision_focus_event.7.a: "...Железнодорожная пушка Шемата должна быть уничтожена."
	ABY_descision_focus_event.7.b: "...Но мы не можем принять вмешательство в наши внутренние дела."

	ABY_descision_focus_event.8.t: "Запрос поддержки"
	ABY_descision_focus_event.8.d: ""
	ABY_descision_focus_event.8.a: "Запросим помощь."

	ABY_descision_focus_event.9.t: "Провозглашение федерального правительства"
	ABY_descision_focus_event.9.d: "Учреждение федерального правительства прошло быстро... странно быстро.\n\nБлагодаря усилиям Масарика подозрения, которые Бенеш питал к Абидосу, быстро рассеялись, но после его смерти агитаторы в Чехии и Австрии раздули маленькую искру сомнения, все еще тлевшую в сердце Бенеша.\n\nЭдвард Бенеш. Один из трех героев чехословацкой независимости и ученик отца нации Томаша Масарика. Именно поэтому в процессе формирования нового правительства он почти полностью принял советы Масарика.\n...Если бы не эти агитаторы, он принял бы их все.\n\nВ конце концов, он предоставил лишь минимальную власть Комитету контрмер Абидоса и проводил политику возмездия против Хяккияко и Шанхайцзина.\n\n«В конце концов, даже он не может быть совершенен всегда.»\n«Сопротивление кивотосцев из Хяккияко и Шанхайцзина меньше, чем ожидалось...»\n(По утверждениям девушек из Абидоса) «Одержимость кивотосцев огнестрельным оружием огромна... кроме того, что половина Шанхайцзина — возможно, что-то называемое Вратами Черного Дракона — подняла вооруженное восстание после приказа о конфискации, не было значительного организованного сопротивления...»\n\n«Мы можем занять еще более жесткую позицию.»"
	ABY_descision_focus_event.9.a: "Его взгляд был холоден, но внутри горела искра мести."

	ABY_descision_focus_event.10.t: "Комитет контрмер"
	ABY_descision_focus_event.10.d: "\"Нас обманули! Нас полностью обманули!\"\n\n\"С-Серика, успокойся...\"\n\n\"Да. Я сейчас пойду и...\"\n\n\"Сенпай Сироко!\"\n\n\"Ухии~ так нельзя, Сироко-тян.\"\n\n\"А, сенпай Хосино...\"\n\n\"Это должен сделать этот старик.\"\n\n\"...\"\n\n\"Ммм~ я думала, что довольно сблизилась с Бенешем, так что это немного разочаровывает...\"\n\n\"Ахаха... кхм, но подумайте все немного.\"\n\"Хотя это было по просьбе учителя, на самом деле это не было нашей работой, верно?\"\n\"Мы приняли это предложение не для того, чтобы навязывать свою власть, так?\"\n\n\"Ну...\"\n\"Это правда.\"\n\n\"В каком-то смысле, возможно, это должно было случиться. Учитель попросил нас помочь Бенешу, а не делать все за него.\"\n\"Если посмотреть правильно, учитель доверил управление страной Бенешу, так что можно сказать, все пошло по плану.\"\n\"И Бенеш — умный человек, верно? Уверен, у него все получится.\"\n\n\"Да... все равно чувствую себя преданной. А ты, Аянэ? Учитель признал преемниками и Бенеша, и тебя.\"\n\n\"Было бы ложью сказать, что у меня не осталось сожалений. Но мы бежали без остановки последние несколько лет. Даже если комитет распущен и все, кроме Нономи-сенпай, по разным причинам заканчивают академию, возможность собраться вот так и поговорить заставляет меня чувствовать, будто мы вернулись в старый комитет контрмер, и мне это нравится.\"\n\n\"Ухии~ да, если Аянэ так видит~ тогда давайте сделаем все возможное на наших местах.\""
	ABY_descision_focus_event.10.a: "Уууу!"

	ABY_descision_focus_event.11.t: "Жертва, ставшая агрессором"
	ABY_descision_focus_event.11.d: "Кабинет Эдварда Бенеша новообразованного федерального правительства Абидоса опубликовал дополнительные административные указы.\nЭто были указы о принудительном выселении в крупных городах, таких как Прага и Вена.\nПри нормальных обстоятельствах такой указ не вызвал бы серьезных проблем, но кабинет Бенеша совершил роковую ошибку: использовал чехов для принудительных выселений в Чехии и германцев для принудительных выселений в Австрии.\nВозможно, в кабинете это посчитали гораздо более эффективным, но ненависть чехов и австрийцев к кивотосцам превосходила всякое воображение.\nХотя (поскольку кивотосцы были намного сильнее местных жителей) не могло произойти событий высокой интенсивности, таких как резня, именно поэтому их ненависть сконцентрировалась и в конечном итоге породила административную дискриминацию.\n\n«Что это значит...? В федеральном указе ясно говорилось, что расходы на переселение будут оплачены...»\n\n«Разве я не говорю тебе, что денег нет? Если нет денег, как ты хочешь, чтобы мы платили?»\n\n«Тогда куда нам, по-вашему, идти и что нам есть, чтобы жить...?»\n\n«А мне какое дело? Иди в тот трущобный район, который сделали на окраине Праги!»\n\nИ подобное было уже обычным делом.\n\nБам! Бах!\n\n«Эй, ублюдки! Опять? Черт! Сколько уже раз?! Ни одного целого предмета мебели не осталось, черт, черт!»\n\nТакже часто бросали коктейли Молотова или самодельные взрывчатки в магазины или рестораны кивотосцев.\nНо кивотосцы не умирали от такой ерунды, и в итоге единственное, что накапливалось слой за слоем, была их ненависть.\nСамосуды иногда происходили в районах, где местные жители составляли большинство по сравнению с кивотосцами, и кивотосцы, которых нелегко было убить, сколько бы их ни били, стали их любимой «игрушкой».\n\nТо место, которое когда-то называли нацией двух миров, теперь превратилось в пороховую бочку Дуная, где порох накапливался, и наконец искра была зажжена.\n\nБум! Бум!\nКак и в любой другой день, на окраине Вены происходил самосуд.\n\n«Эй, сука, до тебя уже доходит? А?»\n\n«...Подожди, Дитрих. Эта... не шевелится.»\n\n«...Что?»\n\nДюжина с лишним молодых австрийцев, линчевавших студентку из Шанхайцзина, одновременно замерли.\n\n«Черт... она не дышит...»\n\n«Быстро... быстро несите лопату, ублюдки!»\n\nОни поспешно закопали мертвую девушку, но были так сосредоточены на копании, что не услышали звука хруста кустов."
	ABY_descision_focus_event.11.a: "И на следующий день инцидент занял крупные заголовки в газетах."

	ABY_descision_focus_event.12.t: "Затишье перед бурей"
	ABY_descision_focus_event.12.d: "Бенеш, получая телеграммы со всех концов страны, покрылся холодным потом.\nПосле смерти студентки из Шанхайцзина во время самосуда в Вене кивотосцы больше не давали себя бить.\nОни штурмовали полицейские участки и казармы и создали «Объединенный фронт Южного Кивотоса», чтобы организованно противостоять федеральному правительству. Единственное, что успокаивало, это то, что еще не было массовых репрессалий, но любой, обладающий хоть каким-то зрением, понимал, что это лишь вопрос времени.\n\nИ это... Бенеш тоже знал.\n«А... ах...»\nВ какой момент все пошло наперекосяк?\nОн искал выход из этой ситуации.\nНичего не приходило в голову.\nОн был в жопе. В полной жопе, серьезно.\nОн пытался убедить себя, что это не его вина, дешевая мысленная победа.\nНо совесть схватила его за лодыжку.\nДа. Это была его вина.\nИ пока он оставался лидером, он был уверен, что не сможет это остановить.\nНо он не мог отдать им власть. Если он это сделает, наследие Масарика рухнет.\nКто-то, кто мог бы спасти наследие Масарика и разрешить эту ситуацию...\nАх."
	ABY_descision_focus_event.12.a: "Была только одна возможность."

	ABY_descision_focus_event.13.t: "Представление ради нации"
	ABY_descision_focus_event.13.d: "\"Всю полноту власти... я передам тебе всю полноту власти, свою и правительства.\"\n\"Пожалуйста, ты можешь делать со мной что хочешь, но защити федерацию...\"\n\n\"Ха, ты сейчас с этим пришел, господин Бенеш?\"\n\n\"Сенпай, сейчас не время ссориться.\"\n\n\"Этот наглец все испортил и еще просит нас все исправить! А сам уходит как ни в чем не бывало!\"\n\n\"Мне жаль... нет, я приношу извинения. Я приму наказание за то, что слепо доверился своим способностям и вызвал этот результат. Но, пожалуйста, выслушайте мое предложение.\"\n\n\"И что теперь, что ты говоришь...?\"\n\n\"Сенпай.\"\n\n\"...Ладно. Давай, говори.\"\n\nВкратце, предложение Бенеша было политическим переворотом: пасть вместе с оппортунистами, пожирающими страну, а затем позволить Абидосу — особенно Аянэ — отстранить его через импичмент, занять пост председателя и проводить политику примирения.\n\n\"То есть в итоге ты говоришь Аянэ стать злодейкой!\"\n\n\"...Да, именно.\"\nБенеш сильно закусил губу.\n\n\"Аянэ, ты не обязана слушать этого сына... это...\"\n\n\"Я принимаю.\"\n\n\"...Почему?\"\n\"И какое отношение эта страна имеет к нам?! Нам достаточно защищать Абидос...!\"\n\n\"Я дала обещание учителю.\"\n\"Что в тот день, когда эта страна будет использовать имя Абидоса, не только кивотосцы из Абидоса будут абидосцами... Чехия, Австрия, Хяккияко, Шанхайцзин... все, кто живет в Абидосе, будут абидосцами.\"\n\"Мы защищаем Абидос. Мы просто делаем то, что всегда делали.\""
	ABY_descision_focus_event.13.a: "Ради Абидоса нужно принять и роль злодейки."

	ABY_descision_focus_event.14.t: "Утро федерации"
	ABY_descision_focus_event.14.d: "\"А, а. Доброе утро. С вами говорит Окусора Аянэ, второй федеральный председатель.\"\n\"От имени всех я приношу извинения за беспокойство, причиненное прошлой ночью из-за попытки введения военного положения первым председателем, Эдвардом Бенешем.\"\n\"Как вы уже, вероятно, слышали, я повторю это еще раз. Новое правительство Абидоса отстранило кабинет Бенеша, который пытался спровоцировать гражданскую войну и разрушить демократический порядок, и отменило ненужные и чрезмерные административные указы этого кабинета.\"\n\"Отмененные пункты следующие: указ о принудительном выселении кивотосцев, лишение политических прав, ...\"\n\nЭто была первая передача кабинета Аянэ, только что открытого после события, которое позже назовут «Самой длинной ночью федерации».\nХотя некоторые ключевые указы — такие как административный указ о разоружении — не были отменены, а раздел о дополнительных налогах на кивотосцев был ограничен смягченной версией, для большинства южных кивотосцев приход к власти Абидоса — до сих пор в значительной степени воспринимавшегося извне как своего рода марионеточная организация чешского временного правительства — был истолкован как кивотосская революция, что привело к распаду «Объединенного фронта Южного Кивотоса».\nНекоторые прозорливые или экстремисты понимали, что Абидос и чешское временное правительство находятся на одной стороне, и оказывали ожесточенное сопротивление, но это сопротивление постепенно исчезало на фоне безразличия южных кивотосцев.\n\nУдивительно, но интенсивного местного сопротивления, которого опасался Бенеш, не произошло. Неизвестно, было ли это из-за доверия к тому, что Абидос не будет их угнетать, или просто потому, что они смирились с повторным захватом власти кивотосцами; в любом случае, это была хорошая новость."
	ABY_descision_focus_event.14.a: "Утреннее солнце федерации взошло ярко."

	ABY_descision_focus_event.15.t: "Добровольное зачисление"
	ABY_descision_focus_event.15.d: "Пыхтение... пыхтение...\nАх, черт, я в жопе.\nЯ залезла в местный магазин, потому что несколько дней не ела, и как раз в этот момент столкнулась лицом к лицу с ополчением Абидоса.\n\n«Пыхтение, пыхтение... даже если я умру, я не пойду в разоренную академию вроде Абидоса.»\n\nНесколько недель назад был издан административный указ: если кивотосец, действующий на территории временного правительства, не принадлежит к Абидосу, он будет считаться шпионом Хяккияко и будет арестован и заключен в тюрьму. После выхода указа большинство неаффилированных граждан / аффилированных с Хяккияко в Абидосе возобновили свое гражданство, а крупные студенческие организации, выступившие против указа, были ликвидированы в течение двух недель, за исключением Группы Каска Катаката.\n\nДевушка, Нагасава Юи, просто ненавидела Абидос.\nНе по какой-то великой причине; она просто не хотела идти в разоренную школу.\nТак она скрывалась как неаффилированная... пока ее не обнаружили сегодня.\n\n«Ах.»\n\nВ этот момент что-то зацепилось за ее ногу, и она упала, покатившись по земле.\nОна попыталась немедленно встать и убежать, но в итоге ее поймали.\n\n«Ммм, Нагасава Юи, неаффилированная; не зафиксировано, что она присоединилась к Группе Каска.»\n\n«Я-я... пойду в тюрьму?»\n\n«В принципе да, но... с таким уровнем мы могли бы проявить снисхождение.»\n\n«С-снисхождение? С-спасибо, большое спасибо!»\n\n«С условием, что, даже если сейчас, ты заполнишь заявление о поступлении в Абидос.»\n\n«Э...?»\n«Э-это... а если я откажусь, что будет...?»\n\n«Тогда, ммм... в твоем случае тебя направят в штрафное подразделение Ореола.»\n\n«Что...? Что!?»\n«Я согласна! Я запишусь! Я поступлю!»\n\n«Хорошо, добро пожаловать в Абидос по добровольному зачислению! Асе... то есть, студентка!»\n\nЕсли бы девушка знала, что каждый студент Абидоса должен пройти военную подготовку и быть направлен в армию, приняла бы она другое решение? Несомненно, можно сказать, что это крайне абсурдная история."
	ABY_descision_focus_event.15.a: "Ттааа..."

	ABY_descision_focus_event.16.t: "Предатель"
	ABY_descision_focus_event.16.d: "\"Э-это что...\"\n\nПеред глазами мужчины разверзся ад на земле.\nСтранные люди с кольцами на головах, появившиеся со вспышкой, и животные, ходящие на двух ногах, беспорядочно стреляли по мирным жителям.\nКрасивая Прага в одно мгновение превратилась в море крови.\n\n«Проклятые безумцы! Какого черта вы творите?!»\n\nЗакричал он, отталкивая женщину, нацелившую оружие на ребенка.\nЩелк.\nДуло пистолета поднялось перед его глазами.\nБах!\n\n«Ух! Ааа, аааа!»\nМужчина проснулся с криком.\nСколько дней уже ему снится этот кошмар?\n\nМужчина, Оскар Шиндлер, был одним из «предателей», сотрудничавших с Хяккияко.\nОн действовал как шпион в сотрудничестве с немецким нацистским режимом, но был раскрыт в 1935 году и заключен в тюрьму. Однако с Великим Перемещением тюрьма потеряла контроль, и ему удалось бежать. Убегая, он поклялся отомстить чехам, которые его унизили.\n\nНо он начал сомневаться.\nЖелание мести, которое поначалу было мимолетной эмоцией, с каждым днем ослабевало.\nИ то, что заполнило эту пустоту, было отвращением к Хяккияко.\nПеред теми, кто стрелял в людей и бросал гранаты просто ради забавы, Шиндлер испытывал глубоко человеческое отвращение.\nКогда два дня назад он увидел, как на площади казнили без суда и следствия захваченных детей и женщин под предлогом, что это чешское сопротивление, он получил неописуемый удар.\n\nС тех пор он начал прятать чехов на своей фабрике.\nЭто было не сострадание к чехам, а отвращение к Хяккияко, это внутреннее неприятие.\n\nНо было ограничение на то, сколько он мог спрятать, и ему было больно, что он не мог спасти их всех.\n\n«...Эй.»\n«Шиндлер. Ты меня слышишь?»\n\n«Ах, Дитрих. Извини. Я отвлекся.»\n\n«Да, ладно, что? Что ты думаешь о моей бизнес-идее?»\n\nОни тоже были «предателями», как и он.\nМногие предприниматели немецкого происхождения прильнули к правительству Хяккияко, эксплуатируя своих соотечественников и ведя роскошную жизнь.\nПоскольку он тоже был одним из них, он чувствовал вину.\n\n«...Поэтому в последнее время правительство поставляет нам чешских заключенных, так что отлично: ни платить за рабочую силу не надо.»\n\nКак раз когда он снова собирался испытать к ним отвращение, ему кое-что пришло в голову.\nИ впервые за долгое время он смог улыбнуться."
	ABY_descision_focus_event.16.a: "\"Да, правда? Мне кажется, отличная идея.\""

	ABY_descision_focus_event.17.t: "Список Шиндлера"
	ABY_descision_focus_event.17.d: "\"Вот заключенные, которых вы запросили.\"\n\nКивотосский бюрократ передал Шиндлеру список чешских заключенных и сделал знак.\nШиндлер, как ни в чем не бывало, достал из рукава золотые украшения и протянул их ему.\n\n«Хм. Надеюсь, вы продолжите стараться для академии-союзника.»\n\nПримерно через месяц после того, как Шиндлер получил то озарение, десятки тысяч чехов были защищены в комплексе фабрик Шиндлера.\nПоскольку было невозможно идеально воспроизвести снаряжение Кивотоса с текущими технологиями, на его фабрике производилось «немного больше» бракованных изделий, чем на других, и производительность была «немного» недостаточной по сравнению с количеством рабочих; но благодаря золотым украшениям, появлявшимся из его рукава, серьезных проблем не возникало.\n\nПоскольку Шиндлер запросил у правительства Хяккияко «немного» завышенное количество заключенных по сравнению с размером его фабрики, даже заключенные из сопротивления, которые изначально должны были быть казнены, были переведены на его фабрику.\n\nШиндлер наблюдал, как доставленные заключенные входят на фабрику.\nДоля детей и женщин была довольно высокой, но они были «квалифицированными металлургами». Снаружи они выглядели подавленными, но их взгляды сияли, как будто они нашли надежду.\n\nТой ночью, когда Шиндлер осматривал фабрику, к нему подошел старик.\nСтарик подарил ему, в качестве подарка, значок-булавку, сделанную из обрезков металла.\nПоскольку этому коррумпированному предпринимателю, эксплуатировавшему заключенных, часто дарили подарки, он без подозрений принял значок.\nЗакончив осмотр и перед уходом, в своем кабинете он улыбнулся, рассматривая значок, который дал ему старик.\n\n«Хм, для того, чтобы сделал один старик, довольно тонкая работа. Не будет ли странно, если я буду носить его каждый день?»\n\nПеред зеркалом он прикрепил значок к своему дорогому костюму.\n\nБульк.\n\nКогда он прикрепил его, из значка выпала крошечная свернутая бумажка.\nУдивленный, он развернул ее и увидел номер телефона и фразу: «Мы получили список Шиндлера».\n\nШиндлер запер дверь и позвонил по этому номеру.\n\nВскоре человек на другом конце заговорил на беглом немецком.\n«Господин Шиндлер, добрый вечер. Вы получили список?»\n\nШиндлер ответил дрожащими руками.\n«Да. Я получил список Шиндлера.»\n\nТогда голос на другом конце ответил:\n«Приятно познакомиться, господин Шиндлер.»"
	ABY_descision_focus_event.17.a: "\"С вами связываются из нации двух миров.\""

	ABY_descision_focus_event.18.t: "Отдавая все"
	ABY_descision_focus_event.18.d: "Хотя он был распутным человеком, Шиндлер посещал свою фабрику каждый день; однако, необычно, в тот день он не пошел.\nСолнце уже было высоко, но Шиндлер неподвижно лежал в постели, думая только о вчерашнем предложении.\n\n«Не могли бы вы помочь и спрятать организацию сопротивления немецкого происхождения в Остраве? Если вы думаете, что вас раскроют, можете отказаться...».\n\nЧестно говоря, он не слишком верил, что его раскроют, но сомнения вызывало другое.\n«Нация двух миров», временное правительство Абидоса, была организацией, противостоящей Хяккияко и Шанхайцзину, и пользовалась поддержкой местных чехов и австрийцев.\nНо Шиндлер не был уверен, что они смогут победить.\nЕму не казалось возможным, чтобы такая маленькая организация, даже при местной поддержке, победила могущественные Хяккияко и Шанхайцзин.\nНо, в то же время, он подумал, что если он поможет сопротивлению, вероятность победы, возможно, хоть немного увеличится.\nПока тысяча мыслей сталкивалась, он пришел к конкретной мысли.\n\nОн встал с кровати и открыл свой сейф.\nЗолото, которое когда-то его заполняло, теперь осталось лишь горсткой.\n\n«Я хотел жить в богатстве и роскоши...»\n«...и смотри, уцепившись за глупости, я потеряю все, что нажил... ха-ха...»\nОн говорил так, но почему на самом деле не чувствовал сожаления?\nОн принял решение.\nОн был коррумпированным предпринимателем, и причина его решения тоже была коррумпированной.\n«Хе-хе... да, в конце концов, если они не победят, я умру, верно?»\n«...Они сказали, что если я помогу им, мне дадут национальную награду?»\n«Хорошо, я еще не стар! У меня еще много возможностей пожить в богатстве и роскоши! Ха-ха-ха-ха!»"
	ABY_descision_focus_event.18.a: "С облегченным выражением лица он позвонил во временное правительство."

	ABY_descision_focus_event.19.t: "Смерть Томаша Масарика"
	ABY_descision_focus_event.19.d: "Тук, тук.\n«Вы еще спите?»\nДомработница осторожно открыла дверь и вошла.\n«Господин Масарик, как вы можете спать так долго? Вы принимали лекарство...?»\nМасарик, казалось, крепко спал, но даже не пошевелился на ее слова.\nДомработница с опаской поднесла руку к его носу.\n\nБултых.\n«А, аах...»\n\nОтец Богемии, железный король, первый президент, учитель...\nТомаш Гарриг Масарик той ночью мирно ушел из этого мира, крепко заснув."
	ABY_descision_focus_event.19.a: "Масарик, наш отец, пожалуйста, доверься своим детям."

	ABY_descision_focus_event.20.t: "Прощание"
	ABY_descision_focus_event.20.d: "Зал Комитета контрмер Старшей школы Абидоса.\n\nРано утром в Старшей школе Абидоса зазвонил телефон.\n«Да, говорит Комитет контрмер Абидоса.»\n«...»\n\nЩелк.\n\n«Аянэ?! Что случилось?»\n\n«У-учитель... г-говорят... что он... у-умер...»\n\n«...Что?»\n«Что...?»\n«Ч-что ты говоришь?!»\n\nБах!\n\n«С-Сироко-тян!»\n\nХосино и Серика выбежали за Сироко, которая выскочила наружу, а Нономи осталась утешать Аянэ, начавшую плакать.\n\n\nЗдание Временного правительства.\n\nРииин.\n«Да, слушаю Бенеш.»\n\n«...Как вы сказали?»\n«Нет... не может быть... Он... мой учитель...»\n«...Я выезжаю немедленно.»\n\n\nШтаб-квартира Немецкой партии Судет.\n\n«Говорит Конрад Генлейн.»\n\n«Что... вы только что сказали?»\n«О-он... наконец скончался...?»\n«Я еду сейчас же.»"
	ABY_descision_focus_event.20.a: "Новость о смерти распространилась в одно мгновение."

	ABY_descision_focus_event.21.t: "Отец Богемии"
	ABY_descision_focus_event.21.d: "Похороны Масарика, которые теоретически должны были быть государственными, прошли скромно на площади Карловых Вар.\nХотя доступ в Карловы Вары был заранее перекрыт перед церемонией, собрались десятки тысяч людей.\nПо иронии судьбы, большинство пришедших на похороны Томаша Масарика, отца Богемии, были судетскими немцами. Чешское население само по себе было небольшим, но это уже не имело значения.\nМасарик, которого должны были называть отцом Чехии, был назван отцом Богемии. Это означало, что он был не только отцом чехов, но и отцом немцев Богемии; и немцы также уважали его как отца и искренне оплакивали.\n\nНа площади Карловых Вар одна из его преемниц, Окусора Аянэ, сначала завершила короткую траурную речь; за ней последовал представитель Немецкой партии Судет, Конрад Генлейн. И, наконец, еще один из его преемников, Эдвард Бенеш, зачитал заключительную речь.\n\n«...Масарик, даже после ухода, остается среди нас; он был для всех нас примером и вызовом. Случай веры в человека, в котором Европа и мир отчаянно нуждаются сегодня. Что нам остается, так это задача в этом беспрецедентном европейском кризисе построить добрую волю и дружбу между Кивотосом и Европой. Тогда мы сможем создать после 1936 года самое совершенное и гармоничное новое государство в Европе: социально, национально и политически справедливое. Это государство, которое мы должны обязательно создать ради нашего выживания и нашего будущего, и оно будет существованием, предназначенным сохранить наследие, которое Масарик показал среди нас, то самое наследие, которое Масарик показал всему миру...»\n«...Президент-освободитель, мы последуем вашим путем, чтобы снова освободить нашу родину и быть верными наследию, которое вы оставили в наших руках!»\n\nКогда Бенеш закончил панегирик, зазвучало Песнопение святого Вацлава, древнейший гимн Чехии и Европы.\n\nЗатем катафалк вывез его тело с площади, поднимаясь на холм. В это время семь солдат сопровождали гроб, символизируя семь этносов, составляющих (или долженствующих составить) федерацию.\n\nКатафалк остановился у здания временного правительства, и он был помещен во внутреннем дворе.\nПервоначально он должен был быть похоронен в Ланах, где покоилась его семья, но говорят, что при жизни Масарик оставил такие слова: «...не тратьте больших усилий на мое мертвое тело... ...похороните меня в месте, куда любой сможет прийти, и не перемещайте меня...».\n\nИ те, кто выжил, будут двигаться вперед, чтобы защитить его наследие, освободить родину, и ради доверия и дружбы между Кивотосом и Европой."
	ABY_descision_focus_event.21.a: "Мы будем верны.\nИстина побеждает."

	ABY_descision_focus_event.22.t: "Судетенланд, наш Судетенланд"
	ABY_descision_focus_event.22.d: "Людвиг Чех, министр немецкого происхождения, представлявший судетских немцев.\nВо время бегства он несколько раз был на волосок от смерти от шальных пуль.\nХотя говорили, что Абидос «разорен», в перенесенном автономном округе была маленькая больница, и Чех смог выжить после экстренной операции.\nОднако осложнения из-за запоздалого лечения серьезно подорвали его здоровье, и в марте 1937 года он скончался.\n\nИ после его смерти новым представителем судетских немцев и членом триумвирата стал лидер Немецкой партии Судет: Конрад Генлейн.\n\n«Как... мы дошли до такого...?»\n\nГенлейн был основателем судетского национализма, иногда называемого генлейнизмом, и Судетенланд, который он возглавлял, постепенно приближался к своей конечной цели: автономии в рамках Чехословакии...\nНо катаклизм Великого Перемещения вознес его в одночасье до национального лидера (немцев), и с провозглашением федерации даже австрийские немцы стали видеть в нем спасителя австрийских немцев.\n\n«Н-ну, по крайней мере, Австрия лучше этих прусских деревенщин, которые позволяют себя манипулировать усатому...»\n«Черт... ах... я всего лишь простой судет! Почему они так многого от меня ждут?!»\n«Господин Масарик... в такие моменты, что бы вы сделали...?»\n\nКаждый раз, когда Бенеш, ученик и преемник Масарика, отказывался от диалога и компромисса с ним, Генлейн предполагал, что Масарик, учитель Бенеша, тоже был бы таким же.\nНо Масарик, которого он знал лично, был совершенно другим.\nХотя, возможно, он и считал судетских немцев чужаками, он рассматривал их как объект для включения и диалога, а не как захватчиков, в отличие от Бенеша.\n\n«Так ты оставил это Бенешу, потому что это демократия? Ха...»\n«Жаль, что этот человек был демократом. Если бы не это, я бы немедленно взял его в учителя. Ха-ха...»\n«Демократия... ужасно неэффективна. Такую гниль, как Бенеш, который даже игнорирует слова своего учителя, нужно было уже удалить.»\n\nУвидев имя, написанное в отчете, он нахмурился.\n\n«...И эту гниль тоже.»"
	ABY_descision_focus_event.22.a: "Карл Герман Франк."

	ABY_descision_focus_event.23.t: "Судетская партия Генлейна"
	ABY_descision_focus_event.23.d: "Генлейн всего лишь стремился, как лидер судетских немцев в молодой Чехословацкой Республике, добиться некоторой автономии. Но его план начал рушиться с 1935 года.\nКонечно, он критиковал демократию, и на самом деле она ему тоже не слишком нравилась, но все же она была намного лучше того «пангерманизма», который проповедовал этот «богемский ефрейтор».\nПосле прихода нацистов к власти, пока в Австрии национал-социалистическое движение угрожало правительству, Судетенланд оставался относительно спокойным: это была одна из причин.\n\n«Если бы этот чертов Франк и тот со щетинистыми усами не мешали, черт возьми...»\n\nЧтобы противостоять нацистской Германии, Генлейн превозносил демократию, которая ему не нравилась, критиковал нацистов и добился того, что кадры партии присягали на верность не Германии, а Генлейну как личности.\nИ незадолго до Великого Перемещения Карл Герман Франк — один из его верных последователей — вызвал его в маленький городок недалеко от Праги.\n\n«Франк, ты впервые вызываешь меня отдельно. Ты говоришь, у тебя есть что-то сообщить?»\n\n«З-здравствуйте. Господин лидер.»\n«Видите ли... я нашел следы коррупции.»\n\n«Коррупция! Это нужно искоренить, конечно! Молодец, Франк.»\n\n«Ха-ха, спасибо. Тогда... рассказать вам об этом случае коррупции?»\n\nНо, вопреки ожиданиям, чем больше говорил Франк, тем бледнее становился Генлейн.\n\n«...Так я и не могу понять, куда исчезла та крупная сумма — почти 15 000 рейхсмарок — которая поступила из немецкого консульства. Вы, который так ненавидите национал-социализм, не могли использовать эти деньги, не так ли, господин лидер?»\n\nДа, он принял деньги от Германии. И нанес им великолепный удар в спину, использовав их для антинацистской деятельности...\nНо он никогда не предполагал, что Франк был его марионеткой. Поэтому он даже сообщал ему об использовании средств...\n\n«Хватит дешевого лицемерия. Какого черта ты хочешь, Франк?»\n\nВместо ответа Франк достал пистолет.\n\n«Что... это...?»\n\n«Ааах, господин лидер. Если ты немец, разве не должен ты процветать, как положено, в великих объятиях единой Великой Германии?»\n\n«Не говори глупостей...»\n\nЩелк.\n«С этого момента, каждый раз, когда вы произносите слово, мой палец будет двигаться немного.»\n«Так что теперь вы будете отвечать мне только да или нет, Генлейн, понятно?»\n\n«...Да.»\n\nФранк приказал ему двигать Немецкую партию Судет, чтобы создать мнение в пользу аннексии нацистской Германией.\nС дулом, направленным на него, Генлейну ничего не оставалось, как согласиться.\n\nНо теперь ситуация изменилась.\n\n«Нойманн, Швеннхардт... ха. Передо мной они рассыпались в лести, а оказывается, готовили такую милую вечеринку.»\n\nС того дня Генлейн двигал своими пешками, чтобы выявить симпатизирующих нацистам внутри партии, и теперь мог смести их всех разом."
	ABY_descision_focus_event.23.a: "\"Нужно действовать быстро, пока этот ублюдок не опомнился.\""

	ABY_descision_focus_event.24.t: "Дуэль истинных намерений"
	ABY_descision_focus_event.24.d: "Глубокой ночью, когда все спали, в комнате Масарика все еще горел тусклый свет.\nЭдвард Бенеш, Рихард Тесаржик... глядя на имена, записанные в его блокноте, Масарик писал им советы.\n«Ха, уже последняя страница? Сегодня закончится быстро, тогда.»\nНа последней странице были незнакомые имена.\n\nОкусора Аянэ: недостаток уверенности. Комплекс из-за возраста? Старательная и гибкая.\nИдзаёи Нономи: с советом директоров все еще есть трения, но, кажется, ладят лучше, чем раньше. Быстро учится экономике. Раннее образование?\nКуроми Серика: ее обманывают, но никогда не работает спустя рукава. Правильные документы: идеальные, без пропусков. Нужно тренировать ее выявлять ошибочные документы.\nСунаоками Сироко: физические способности, командование и лидерство отличные. Но как бы сказать... у нее очень «дикий» вид. Тем не менее, продолжает совершенствоваться.\nТаканаши Хосино: отлично скрывает эмоции за близкой улыбкой... она относится ко мне с опаской. Почему бы это?\n\nМасарик задумался, глядя на последнее имя.\n\n...\n\nВ последнее время Хосино не могла уснуть.\nДаже притворная дремота, чтобы казаться беззаботной, в последние дни превращалась в настоящий сон.\nОна не понимала этого.\nПочему ее милые кохаи следуют за этим <взрослым>.\n\nХосино всегда была уверена в своей способности читать сердца людей, но сердце того старика было невозможно разгадать.\nУ всякой доброй воли есть цена.\nХосино испытала это на собственной шкуре.\nНо она не могла понять, какова была «цена», которую тот взрослый — которого ее кохаи называли Сенсеем — когда-нибудь потребует.\n\n«Девятьсот миллионов иен...»\nДевятьсот миллионов иен.\nДля Абидоса это было много, но для других академий это было так мало, что они даже игнорировали это в бухгалтерских книгах.\nИ все же на эту крошку многие взрослые надевали на нее ошейник и эксплуатировали ее.\nЭтот такой важный ошейник...\nМасарик перерезал его, не колеблясь."
	ABY_descision_focus_event.24.a: "Хосино не считала себя способной заплатить эту цену."

	ABY_descision_focus_event.25.t: "Компания и правительство"
	ABY_descision_focus_event.25.d: "\"...На этом соглашение считается оформленным.\"\n\"Содержание следующее.\"\n\"Первое, передать временному правительству контроль над частными землями Группы Нефтис.\"\n\"Второе, федеральное правительство уступит Нефтису определенный процент промышленных объектов Чехии и Австрии, и...\"\n\n«Отлично! Господин Масарик!»\n\n«Да. Как представитель временного правительства, я выражаю вам благодарность, госпожа Нономи.»\n\nС рукопожатием частные земли Группы Нефтис официально перешли во владение временного правительства.\nИ два главных героя переговоров вместе вернулись во временное правительство на машине.\n\n«Б-было ууужасно утомительно, Сенсей?»\n\n«Хе-хе. Но теперь вы, со всей буквальностью, глава корпорации, госпожа Нономи. Хотя совет директоров держит руль, на важных мероприятиях вам придется часто появляться; нельзя падать духом уже сейчас.»\n\n«Ууугх... если даже это, что уже было предрешено, было так тяжело... не хочу и представлять, как трудно будет вести настоящие переговоры...»\n\n«Если вам будет приятно узнать: удивительно, но многие переговоры уже решаются технической командой заранее, и потом только фиксируется результат. Это из моего опыта в политике; возможно, в экономике это несколько иначе, но политика и экономика похожи, так что можете принять это к сведению.»\n\n«Все равно мне страшно... если возникнет какой-нибудь непредвиденный случай...»\n\n«Хм. Тогда, чтобы немного облегчить ваше беспокойство, как насчет того, чтобы сегодня провести специальный урок? Кажется, у нас есть время; могли бы попрактиковаться, как реагировать в разных сценариях.»\n\n«Ммм... хочется отдохнуть, но такие возможности нечасто бывают~ Да!»\n\n«Ха-ха, это не затянется. Итак, какой стороне вы хотели бы больше научиться?»"
	ABY_descision_focus_event.25.a: "\"Ммм~ больше, чем управление, я хочу изучать общую политику~!\""
	ABY_descision_focus_event.25.b: "\"Ммм~ я хочу изучать политические советы, связанные с управлением~!\""

	ABY_descision_focus_event.26.t: "Раздельная интеграция"
	ABY_descision_focus_event.26.d: "\"Кажется, в автономном округе нужно немного больше полицейской силы~\"\n\n«Да, комиссар.»\nХосино окликнула секретаря, который уже уходил.\n\n«Ах, и оставь условия такими же, как раньше. Не бери людей из армии: набирай гражданских, и пропорционально населению, ладно~?»\n\n«Да, понял.»\n\n«Ухии, какой ты формальный~ Если ты так будешь, этот старичок загрустит, знаешь~?»\n\n«Это работа, комиссар.»\nТем не менее, секретарь слегка улыбнулся.\n«В любом случае... вы отлично справляетесь. Спасибо, как всегда.»\n\n«Ухии, конечно!»\n\nКогда секретарь вышел, глава автономного округа Абидоса, Таканаши Хосино, продолжила заниматься бумажной работой.\n\nС тех пор как Масарик, Сенсей, прибыл, Хосино делала все: от административной работы до физического труда; и после заслуг в реорганизации автономного округа Абидоса стала его главой.\n\nОна передала промышленную зону местному правительству и включила город Карловы Вары — перенесенный вместе с округом — в состав автономного округа Абидоса.\nЭто был хороший результат: компромисс между кивотосцами, избегавшими заводского комплекса, и местными жителями, предпочитавшими комплекс.\n\nАдминистративный указ 111 временного правительства все еще действовал, но у Хосино была идея.\n«Если мы сейчас не создадим прецедент интеграции, эта федерация не продержится.»\n\nС этой мыслью она работала над превращением автономного округа Абидоса в символ интеграции. Это был единственный округ, где действовала полиция (а не жандармерия), и патрули ходили смешанными парами: кивотосец и местный житель.\nЭти усилия привели к таким результатам, как сосуществование двух миров, но задача интеграции двух принципиально разных миров все еще буксовала.\n\nВ этой ситуации Хосино задумалась, глядя на административную жалобу о разрешении браков между кивотосцами и местными жителями."
	ABY_descision_focus_event.26.a: "\"Раз уж мы здесь, давай сделаем это масштабно.\""
	ABY_descision_focus_event.26.b: "\"Если мы разрешим это, правительство может рухнуть.\""

	ABY_descision_focus_event.27.t: "Восстановленный контроль"
	ABY_descision_focus_event.27.d: "\"Какова ситуация?\"\n\n«Зоны Эгерланд А, В и D завершены; в зоне С партизанский отряд из 132 человек построил деревянную крепость и сопротивляется, окопавшись. Если еще немного усилить минометный огонь, она скоро падет.»\n\n«Мм... вероятно, будет трудно. Деревянные крепости Группы Каска невозможно пробить личным оружием или минометами.»\n\n«Да? Как это может быть...?»\n\n«Да. Я уже несколько раз сражалась с ними. И я ездила посмотреть на поле боя. Эта крепость прочнее, чем кажется.»\n«Так что нам придется сконцентрировать атакующие дроны.»\n\n«Есть! Понял, командир!»\n\nДверь палатки открылась, и вошел посыльный.\n«Пришел отчет из штаба.»\n\n«Приказ о воинской дисциплине. Подтверждено, что бывший президент Томаш Гарриг Масарик направляется в Командование жандармерии Эгерланда инкогнито.»\n\nПрочитав это, адъютант Сироко включил микрофон и сделал объявление.\n«Весь личный состав штаба: построиться на плацу в парадной форме. Отец едет. Отец едет. Конец.»\n\n...\n\n«Да, я рада, что Сенсей приехал. Но...»\nСироко посмотрела на плац.\n«...Не мог бы ты сказать им хотя бы одно слово? Если мы их собрали, а ты просто скажешь разойтись...»\n\n«Ха-ха. Госпожа Сироко, вы создаете работу этому бездельнику, чтобы развлечь меня.»\n\n«А... Нет! Я не это имела в виду...!»\n\n«Я не говорю, что нет. На самом деле, произнести речь после долгого перерыва звучит неплохо.»\n«Я ничего не готовил, так что она будет недолгой, но это будет даже лучше для этих солдат.»\n\nМасарик помолчал мгновение и сказал:\n«Но тогда... что, если речь произнесете вы, госпожа Сироко?»\n\nСироко задумалась."
	ABY_descision_focus_event.27.a: "\"Нет, все же, думаю, лучше, чтобы это сделал Сенсей.\""
	ABY_descision_focus_event.27.b: "\"Да, тогда я попробую.\""

	ABY_descision_focus_event.28.t: "Практическое обучение"
	ABY_descision_focus_event.28.d: "\"Создавать новое название очень трудно, и ни одна сторона не согласится. Усти-над-Лабем. Оставим так.\"\n«Да нет, я тебе говорю, в итоге это одно и то же! Аусиг или Усти, они все равно будут называть его как хотят!»\n«Но Усти происходит из древнечешского, а Аусиг — как это читают по-немецки! Надо использовать оригинал, Усти!»\n«Мы уже уступили в Эльбе/Лабе, так что хотя бы Усти нужно сохранить! Воры!»\n«Есть ли смысл давать чешское название городу, где живут наши судетские немцы?! Да или нет, черт возьми?!»\n\nВидя, что собрание накаляется, Аянэ потребовала тишины и объявила пятнадцатиминутный перерыв.\n\nМасарик встретил Аянэ, когда она спускалась с трибуны.\n\n«Это было трудно, госпожа Аянэ.»\n\n«Думаете, в этот раз я справилась хорошо, Сенсей?»\n\n«Хм, видно, что вы понемногу улучшаетесь. Но...»\n\nПосле того как Масарик указал на моменты, требующие исправления, собрание возобновилось; и только после нескольких перерывов и возобновлений собрание, продлившееся десять часов, смогло завершиться.\nУже поздней ночью они наконец смогли уйти, и Масарик с Аянэ разговаривали в старом ресторане поблизости, поедая кулайду.\n\n«...Но у меня есть сомнение.»\n\n«Какое, госпожа Аянэ?»\n\n«Я поняла, почему вы выбрали меня среди стольких кивотосцев, потому что вы сказали мне об этом в прошлый раз, но... у вас есть такой умный ученик, как Бенеш, так что я задаюсь вопросом, почему вы обучаете меня.»\n\n«Хм. Нет никого настолько умного и хорошего политика, как Бенеш. Но в то же время ему не хватает гибкости, и у него есть склонность к некоторому радикализму, так что есть аспекты, в которых он не вписывается в многонациональную федерацию.»\n«В конце концов, нужен был политический партнер, который компенсировал бы это: кто-то, кто мог бы охватить всех и служить сдерживающим фактором для Бенеша. И, кроме того, кто-то с выдающимся политическим потенциалом. Я выбрал госпожу Аянэ на эту роль.»\n\n«Ах...»\n\n«Когда-нибудь... если я вернусь туда, откуда пришел, пожалуйста, помогите Бенешу не принимать ошибочных решений.»"
	ABY_descision_focus_event.28.a: "\"...Да. Я защищу наследие Сенсея.\""
	ABY_descision_focus_event.28.b: "\"...Не беспокойтесь. Граждане сами приведут к правильному пути.\""

	ABY_descision_focus_event.29.t: "Долгосрочное планирование"
	ABY_descision_focus_event.29.d: "\"Уфф... с бумажной работой действительно трудно...\"\n\nОтрывая взгляд от документов, Серика сладко потянулась.\nПрошло уже довольно много времени с Великого Перемещения, и Серика отвечала за работу по созданию «Комитета 8 Южных Провинций».\nС помощью Сенсея и Аянэ у нее уже была некоторая сноровка с документами, но работы все еще было слишком много, и она не совсем привыкла.\n\n«Может быть... я действительно не гожусь для бумажной работы...»\n«Нет, госпожа Серика. Вы выкладываетесь по максимуму.»\n«Э? Сенсей?!»\n\nВ какой-то момент Масарик уже стоял в дверях.\n\n«Уже взяв на себя такую тяжелую должность, как заместитель министра внутренних дел, и продержавшись до сих пор без серьезных проблем, госпожа Серика уже продемонстрировала более чем достаточные способности.»\n\n«Но единственное, что я могу заметить сама, это мелкие упущения или вещи, которые слишком очевидно преувеличены...»\n\n«Хе-хе. Обычно маленькие успехи, один за другим, накапливаются и заставляют тебя расти.»\n\nДаже с утешением Масарика у Серики все еще был обеспокоенный вид.\n\n«Хм, у вас вид, будто вы о чем-то размышляете. Не расскажете мне?»\n\nВыслушав его, Серика немного помедлила и внезапно спросила:\n\n«Если мне придется принять важное решение в ситуации, когда я не смогу спросить вас... что мне делать?»\n\nМасарик немного удивился, но внимательно выслушал.\n\n«В последнее время я думаю, что может случиться все что угодно. И в худшем случае может возникнуть ситуация, когда мне придется взвалить все на себя. Благодаря вам меня уже так просто не обмануть, но если это свалится на меня сразу, и если не будет никого, кто мог бы мне посоветовать, я приму неправильное решение. Так что, Сенсей, на всякий случай... скажите мне, что делать.»\n\nМасарик уже предвидел свою смерть, поэтому много думал об этом, но то, что беспокоило Серику, казалось гораздо более серьезной ситуацией.\nМасарик на мгновение задумался и, наконец, дал ей такой совет:\n\n«Я хочу, чтобы вы достаточно глубоко обдумали, какие последствия может повлечь за собой ваше решение, госпожа Серика. Особенно...»\n\n«И если наступит такой момент, помните также, что ваша собственная безопасность — самое главное.»"
	ABY_descision_focus_event.29.a: "\"Помните также, что работа правительства не делается в одиночку.\""
	ABY_descision_focus_event.29.b: "\"Но помните также, что не следует перекладывать на других то, что должны сделать вы.\""

	ABY_descision_focus_event.30.t: "Территориальное восстановление"
	ABY_descision_focus_event.30.d: "Когда угроза Шанхайцзина и Хяккияко полностью исчезла из Чехии и Австрии, открылась новая глава истории. В Владиславском зале Пражского Града три лидера, возглавлявшие временное правительство — Эдвард Бенеш, Конрад Генлейн и Окусора Аянэ — выстроились перед отечественными и зарубежными журналистами, чтобы провозгласить официальный запуск «Федерального правительства Абидоса». Это было историческое заявление о том, что тот хрупкий союз, объединенный лишь выживанием, теперь движется к постоянному государственному сообществу.\n\nПервое, что было объявлено, — это официальная отмена «Приказа о тотальной чрезвычайной мобилизации», что ознаменовало конец состояния войны. Этой мерой бесчисленные солдаты, годами прикованные к фронту, наконец смогли вернуться на родину и в объятия своих семей; и вся федерация погрузилась в облегчение и ликование. Это было символическое заявление, наполненное твердой волей федерального правительства отбросить тень войны и направиться в эру мира.\n\nЗатем федеральное правительство пообещало вскоре провести первые всеобщие выборы, в которых примут участие все члены федерации. Этим оно представило план сформировать легитимный кабинет, справедливо отражающий волю всех этносов и социальных классов, положить конец системе временного руководства и заложить основы полноценной демократии.\n\nТакже была ясно выражена намерение сконцентрировать возможности государства на восстановлении, а не на войне. Был объявлен план разоружения: постепенно сокращать размер армии, раздутой военным положением, до уровня мирного времени; и было заявлено, что освободившиеся бюджет и ресурсы будут с наивысшим приоритетом вложены в великий проект восстановления, направленный на восстановление городов и промышленных баз, разрушенных войной. «Нация двух миров» наконец-то начала опускать оружие и готовить молот и плуг."
	ABY_descision_focus_event.30.a: "Мы вернули землю."

	ABY_descision_focus_event.31.t: "Солдат и девушка"
	ABY_descision_focus_event.31.d: "Витезслав и бойцы его взвода сохраняли позицию наготове, сжимая в руках винтовки и пистолеты-пулеметы. Другие нации скрежетали зубами перед захватчиками, но Витезслав и его подразделение были исключением. Скорее, они сражались как союзники. По сравнению с теми, кто без устали оскорблял их, называя «чокнутыми с обручем на голове», это было действительно странно. И, кстати, оставляло странное ощущение.\n\n«Взвод, внимание! Силы противника приближаются на расстояние менее 100 метров!»\n«Уже? Начинаем? Будьте осторожны, чтобы никто не пострадал!»\n\nВ отличие от Витезслава и его людей, напряженных до предела, женщина перед ними держала оружие спокойно, почти расслабленно. Пока все сглатывали слюну, глядя на ореолы над головами тех, кого называли Кивотос...\n\n«Э-эй... что-то случилось?»\n«Нет, ничего.»\n«Эй, почему вы так на меня смотрите? Я подумал, у меня что-то на лице!»\n«Заткнись и занимайся своим делом.»\n\nВитезслав поднял винтовку, передернул затвор и зарядил патрон. Вдалеке слышались выстрелы. Дрожащими руками, сжимая винтовки, солдаты сглотнули и ждали, когда враг войдет в зону поражения. Как только Витезслав подтвердил, что Группа Каска вошла в радиус, он крикнул своим людям и пехоте Ореола из Кивотоса."
	ABY_descision_focus_event.31.a: "\"За нашу родину, Чехию!\""

	ABY_descision_focus_event.32.t: "К Вене"
	ABY_descision_focus_event.32.d: "Это было как раз в тот момент, когда последняя девушка из Кивотоса бросила гранату и силы Шанхайцзина начали отступать. Фриц, солдат, который с трудом бежал из Австрии в Чехию, из Чехии дальше в Абидос, не мог не ощутить иронию того, что сражается вместе с теми девушками из Кивотоса, которых так ненавидел. Когда он выпустил последнюю пулю из винтовки и добил, уничтожив ореол последней девушки из Кивотоса, Фриц наконец смог выдохнуть.\n\nКогда он опустил винтовку, он посмотрел на девушек, которые, как и он, носили чешские каски. Каждый раз, слыша их болтовню на японском, Фриц не мог сдержать раздражение; но на этот раз они сражались вместе, так что, в некотором смысле, он был у них в долгу.\n\n«Аах, внимание всем.» Офицер открыл рот с мегафоном.\n\n«Скоро мы направимся в Вену на парад. Остатки сил Шанхайцзина уже отошли, так что атак не будет. Кивотосцы, двигайтесь налево; европейцы, направо.»\n\nФриц проворчал, поднимаясь, и начал двигаться к месту, где его ждали товарищи."
	ABY_descision_focus_event.32.a: "Ну... по крайней мере, лучше, чем раньше."

	ABY_descision_focus_event.33.t: "Альянс, связующий надежду"
	ABY_descision_focus_event.33.d: "Томаш Масарик не терял надежды даже после того, как Чехословакия пала перед Хяккияко. Он пытался перегруппировать разрозненных министров и генералов и в результате убедил военных лидеров, таких как Войтех Лужна и Рихард Тесаржик, а также политиков во главе со Штефаном Осуски, заложив основы новой коалиции. Хотя у каждого были свои цели, все они решили следовать за временным правительством Абидоса — наследником духа чехословацкого временного правительства — и выполнять свою роль через сотрудничество.\n\nВ зале заседаний Масарик заговорил тяжелым голосом: «У каждого из нас свои цели, но если немцы, чехи и абидосцы не объединим силы, никто не сможет добиться успеха. Наш опыт и способности незаменимы для укрепления этой коалиции.»\n\nВойтех Лужна молча кивнул и сказал: «Господин, мы провели переговоры с немецкой организацией сопротивления и достигли значительных результатов. В обмен на то, что наш офицерский корпус будет их обучать и готовить унтер-офицеров, они согласились на нашу цепочку командования. Чтобы освободить Чехию, мы нужны им, а они нужны нам; так мы сможем действовать организованно, на уровне названия Объединенных сил Временного правительства.»\n\nШтефан Осуски также добавил: «Поддержать политически незрелое временное правительство Абидоса и координировать сотрудничество различных сил — также наша ответственность. В этой коалиции мы будем сосуществовать и верно выполнять свою роль.»\n\nЭдвард Бенеш наблюдал за происходящим с легкой улыбкой. «Томаш, посмотрите. У нас все еще есть товарищи, желающие посвятить себя Чехословакии. С ними мы, без сомнения, сможем освободить родину.»\n\nМасарик снова кивнул с решительным жестом и заключил твердым голосом:\n«Без вашей самоотверженности и усилий сегодняшнее сотрудничество было бы невозможным. Хотя наши цели не идентичны, мы должны двигаться вместе к освобождению этой земли и к новому будущему. Я прошу каждого из вас выложиться по максимуму на своем месте.»"
	ABY_descision_focus_event.33.a: "At zije Ceskoslovensko!(Да здравствует Чехословакия!)"

	ABY_descision_focus_event.34.t: "Под чешским флагом"
	ABY_descision_focus_event.34.d: "В тихом ресторане Праги, в герметично закрытой отдельной комнате, тихие голоса обсуждали будущее Чехии. В центре был Эдвард Бенеш. Перед ним сидели ветераны, сражавшиеся вместе с ним за независимость, академики националистического толка и представители полных энтузиазма молодежных групп. Их беспокоило, что под лозунгом федеральной «гармонии» чешский дух размоется.\n\n«Господа,» — спокойно заговорил Бенеш. — «Наша цель одна: восстановить сильную, суверенную Чехию. Мы благодарны за помощь Абидоса, но они чужаки. За судетами нужно всегда приглядывать. Истинным хозяином этой страны должен быть чешский народ.»\n\nЭто была не речь. Он просто говорил, тихо, но с непреклонной убежденностью.\n\n«Мне нужна ваша сила. В рамках федерации мы должны сделать так, чтобы чешский голос звучал громче всех. Мы должны вернуть наше влияние в образовании, культуре и управлении, во всех областях.»\n\nС этими словами разрозненные националистические силы нашли точку притяжения. Той ночью под одним знаменем, называемым «Возрождение Чехии», они скрепили невидимый союз."
	ABY_descision_focus_event.34.a: "Бенеш обеспечил свою самую мощную базу поддержки."

	ABY_descision_focus_event.35.t: "Невидимый барьер"
	ABY_descision_focus_event.35.d: "Маневр Бенеша был подобен войне без выстрелов. Чтобы ослабить влияние Абидоса, он действовал с хитростью и упорством. На собраниях, где определялась большая федеральная политика, инновационный план экономического восстановления, представленный Аянэ, откладывался снова и снова под предлогом «отсутствия реализма». За этим стояло организованное сопротивление чешских бюрократов, которых Бенеш расставил на ключевые должности.\n\n«Предложение госпожи Аянэ идеалистично, но в практической реализации могут возникнуть трудности. Что, если мы добавим технический комитет из чешских экспертов для его дополнения?»\n\nЗвучало разумно, но результатом было снижение власти фигур из Абидоса. Работа Серики, которая проявляла способности в Министерстве внутренних дел, затягивалась из-за мелких procedural проблем; а крупный инвестиционный проект, предложенный Группой Нефтис Нономи, наталкивался на невидимый барьер: запутанные административные регламенты. В прессе начали понемногу просачиваться статьи, цитирующие «правительственные источники», указывающие на «неэффективность политики в стиле Кивотоса». Бенеш никогда не нападал на Абидос в лоб. Он только плел паутину из сложных процедур и комитетов, и ею..."
	ABY_descision_focus_event.35.a: "постепенно связывал им руки и ноги."

	ABY_descision_focus_event.36.t: "Рукопожатие с дьяволом"
	ABY_descision_focus_event.36.d: "Даже у Бенеша, расширявшего свое влияние, была одна забота: Австрия. В недавно включенных австрийских регионах его националистическая линия не находила большой поддержки. Чтобы обеспечить стабильное большинство, ему пришлось поступиться частью своих убеждений. В конце концов, он принял решение, которого никто не ожидал: протянул руку остаткам бывшей авторитарной партии Австрии, «Патриотическому фронту». \n\nНа тайной встрече в старом отеле Вены представитель Патриотического фронта встретил его циничной улыбкой. «Что нужно такому демократу, как вы, господин Бенеш, от таких пережитков прошлого, как мы?»\n\nБенеш ответил, не изменившись в лице: «Я не поддерживаю вашу идеологию. Но у вас есть сила контролировать Австрию. Если вы поддержите меня на предстоящих выборах, я гарантирую вам автономию в Австрии и не буду вмешиваться в ваши прошлые действия.»\n\nЭто был акт отрицания себя как демократа. Рукопожатие с дьяволом, которое Масарик, будь он жив, никогда бы не потерпел. Но Бенеш не колебался. Ради большей цели — построения сильного государства с центром в чехах — даже союз с антидемократическими силами был не более чем «необходимым злом»..."
	ABY_descision_focus_event.36.a: "оправдал он себя."

	ABY_descision_focus_event.37.t: "Запятнанный первый шаг"
	ABY_descision_focus_event.37.d: "Первые всеобщие выборы, обещанные с рождением Федерального правительства Абидоса, прошли скорее в хаосе, чем в надежде. Со все еще открытыми шрамами войны, выборы, подготовленные наспех, начали давать сбои с самого начала. Не было единого избирательного списка, и подсчет избирателей в каждом регионе проводился импровизированно. Юридические споры — гражданство кивотосцев, право голоса избирателей в Австрии — продолжались до кануна выборов, усугубляя неразбериху.\n\nВ день голосования проблемы вспыхнули с еще большей силой. В некоторых сельских районах Чехии и Австрии целые урны для голосования исчезали; в других вооруженные группы неизвестного происхождения врывались в избирательные участки, угрожая людям и принуждая поддерживать определенные партии. В Судетенланде было обнаружено множество признаков манипуляций, препятствующих голосованию избирателей немецкого происхождения. Подсчет голосов также не был прозрачным: в некоторых округах объявлялись абсурдные результаты с явкой выше 100%, и были нередки случаи, когда наблюдателей от оппозиции выдворяли из центров подсчета.\n\nПосле выборов оппозиция и гражданское общество немедленно выдвинули подозрения в «фальсификации выборов» и объявили о массовых протестах. Но федеральное правительство отреагировало быстро. Министерство внутренних дел, руководимое Бенешем, усилило контроль над СМИ под предлогом «национальной стабильности» и навесило ярлык «антисистемной агитации, провоцирующей социальный хаос» на заявления. Некоторые крупные СМИ, в сговоре с властью, заполнили заголовки утверждениями, что выборы были справедливыми; а ключевые фигуры, продвигавшие подозрения, подверглись таинственным налоговым проверкам или увидели свое прошлое обнародованным, будучи политически уничтоженными.\n\nВ конце концов, огромная тень сомнения постепенно ушла вглубь без четкого расследования под руководством правительства. Конечным победителем этих мутных выборов стал Эдвард Бенеш. Объединив свой националистический блок с правыми силами, такими как Патриотический фронт, он с трудом получил большинство и стал первым премьер-министром федерации Абидоса. Однако его кабинет с самого рождения нес на себе груз «запятнанной победы». Легитимность была подорвана, и..."
	ABY_descision_focus_event.37.a: "демократия федерации родилась нестабильной, с семенами недоверия и раскола с самого первого шага."

	ABY_descision_focus_event.38.t: "Учитель"
	ABY_descision_focus_event.38.d: "Щелк. Клац.\n\nСитуация изменилась.\nПистолет, который он наставлял не так давно, теперь был наставлен на него.\n\nНа самом деле, даже он сам не верил, что переворот удастся.\nПоэтому он даже спланировал путь побега в Германию...\nНо способности Генлейна, этого предателя, к сбору информации были сильнее, чем он предполагал.\n\n«У тебя есть что сказать, Франк?»\n\n«...Только одно.»\n«Ты тоже немец. Почему ты не хочешь воссоединиться в объятиях единой Великой Германии?»\n\n«Ну, может быть, я проникся великим демократическим идеалом?»\nГенлейн ответил насмешкой.\n\n«Не говори глупостей.»\n\n«Хе. Заметно?»\n\n«Если ты только собираешься насмехаться, убей меня сразу. Я живу не для того, чтобы это слушать.»\n\n«Хорошо. Скажу тебе как есть.»\n«Мы, судеты, поколениями были аристократией в этой Богемии. Даже после основания Чехословакии мы могли возвысить голос и занимать привилегированные вершины общества.»\n«А теперь стать просто гражданином Германии? Разве это не значит выбросить эту привилегию и стать простым никем? Я просто хочу жить на широкую ногу.»\n\n«Э-этот... мерзавец!»\n«Ты отвергаешь великую судьбу немецкого народа по такой жалкой причине?! Проклятый предатель! Весь немецкий народ един и существует только для немецкого народа! То, что ты оставляешь великое дело ради личной корысти, доказывает, что у тебя... есть еврейская кровь... ургх!»\n\n«Еврей, говорит. Ты что, не знаешь, что второе, что я больше всего ненавижу, — это евреи?»\n\n«Угх... хафф... второе? Тогда что же первое?»\n\n«Что же еще? Нацисты вроде тебя.»"
	ABY_descision_focus_event.38.a: "Прежде чем Франк успел ответить, Генлейн нажал на курок."

	ABY_descision_focus_event.39.t: "Уход"
	ABY_descision_focus_event.39.d: "\"...Наша Чехословакия — единственная демократия, рожденная из обломков Австро-Венгрии — навсегда сохранит этот идеал в груди и будет двигаться в будущее.»\n«Настоящим заявляю. Я, Томаш Гарриг Масарик, уйду в отставку с поста президента через десять дней, начиная с 08:00, и клянусь сохранять нейтралитет в отношении любой последующей политической ситуации.»\n\nНикто этого не предвидел. Даже высокопоставленные лица в политическом мире, включая Эдварда Бенеша, не смогли скрыть замешательства на своих лицах.\n\n«Кхм. Да, вы, должно быть, очень удивлены. Прошу прощения, что не сказал об этом раньше. Но уже 35 лет назад я решил оставить пост президента и жить как обычный гражданин. В этот раз я взял на себя обязанности временно, только потому что это беспрецедентная чрезвычайная ситуация во все времена.»\n«Теперь, когда правительство сформировано, мое дальнейшее пребывание здесь также противоречит Конституции. И, самое главное... сколько еще проживет этот старик? Хе-хе.»\n\nОн смеялся, но никто не смог скрыть печали.\n\n«Господа, послезавтра мне исполнится почти девяносто. Я боюсь совершать ошибки из-за возраста. И я не хочу внезапно умереть и ввергнуть эту страну в хаос. Этой стране нужна молодая кровь.»\n«Поэтому я планирую провести всеобщие выборы через неделю. Так что я прошу вас: воспользуйтесь ценным правом, которое вам дано. Покажите им, что, даже если мы потеряем землю, мы не потеряем демократический идеал.»\n«Покажите им, что мы никогда не склонимся перед насилием и угнетением!»\n\nПо окончании речи разразились оглушительные аплодисменты. Масарик спустился с трибуны со слезами на глазах, но чувство облегчения, нахлынувшее волной, утешило его."
	ABY_descision_focus_event.39.a: "Прощай."

	ABY_descision_focus_event.40.t: "Томаш Масарик"
	ABY_descision_focus_event.40.d: "Закончив церемонию открытия, Томаш Масарик вернулся в свою резиденцию, подготовленную на окраине Карловых Вар.\nОн повесил свою шляпу и длинное пальто на вешалку и рухнул, словно падая, на маленький деревянный стул.\nБез следа недавней энергии старик — вымотанный до костей — достал из бумажника две маленькие бумажки размером с открытку.\n\nКогда Прага исчезла, его дом исчез вместе с ней, а также его сын Ян Масарик и дочь Ольга Масарикова. Те бумажки были фотографиями: единственные оставшиеся у него обрывки памяти, без даже одежды его детей.\n\nОн поставил фотографии сына и дочери в две вазы с белыми гвоздиками и налил в два стакана, стоящих перед ними, дешевое вино и сок, купленные по дороге.\n\nГорячие слезы потекли по его щекам; и, даже в очках, зрение полностью затуманилось. Как ребенок, неспособный контролировать свои эмоции, он рухнул на письменный стол и зарыдал в голос.\nОн говорил, что сожалеет, что должен был забрать их; что, как только услышал новость, хотел бежать в Прагу, но те, кто следовал за ним, удержали его, и у него не было выбора; и он продолжал просить прощения у тех, кто не мог его слышать или принять его.\nПеред другими он должен был быть сильным; если он сломается, все потеряют надежду; он не мог быть отцом Яна и Ольги, он должен был быть отцом Чехии... так он сетовал, пока, побежденный усталостью, не заснул.\n\nОн был отцом Чехии, да...\nно он также был отцом двоих детей."
	ABY_descision_focus_event.40.a: "Он был обычным отцом."

	ABY_descision_focus_event.41.t: "Смерть Людвига Чеха"
	ABY_descision_focus_event.41.d: "Холодный ветер марта 1937 года дул над кладбищем Карловых Вар. Последствия ранения, полученного в хаосе, непосредственно последовавшем за Великим Перемещением, в конце концов забрали самого преданного символа примирения в «нации двух миров». Людвиг Чех, старый политик, сделавший сосуществование чехов и немцев верой всей своей жизни, так и уснул навеки.\n\nНа его похоронах собралось много фигур из коалиционного правительства, чтобы проводить его в последний путь. Делегации из Чехии и Абидоса, включая Эдварда Бенеша и Окусору Аянэ, с мрачными лицами охраняли место. Вместо этого «отец Богемии», Масарик, не смог присутствовать из-за проблем со здоровьем, свойственных его возрасту, намекая, что эпоха подходит к концу.\n\nТот, кто поднялся на трибуну для надгробной речи, был Конрад Генлейн. Отдавая дань благородной воле Чеха, он также подчеркнул единство и курс, которому должны следовать судетские немцы. Это было не просто прощание: это было также заявление, чтобы запечатлеть себя как нового лидера, наследника воли Чеха. Звезда, символизировавшая старую эру примирения, погасла, но ее смерть, по иронии судьбы, стала катализатором, еще сильнее скрепившим тот странный союз оставшихся."
	ABY_descision_focus_event.41.a: "Гаснет звезда эпохи."

	ABY_descision_focus_event.42.t: "Обеспокоенность армией"
	ABY_descision_focus_event.42.d: ""
	ABY_descision_focus_event.42.a: "Политические комиссары будут волнорезом."
	ABY_descision_focus_event.42.b: "Уважать автономию армии."

	ABY_descision_focus_event.43.t: "Вторая частная беседа"
	ABY_descision_focus_event.43.d: "\"Ухии~ это похоже на дежавю... Опять та же ситуация.\"\n\nКогда Хосино пожаловалась и плюхнулась на пол, Масарик, сидевший напротив, тихо хмыкнул \"хе-хе\". Закрытая дверь мастерской была точно такой же, как в тот день год назад. Но уже не осталось и следа той неловкой и острой атмосферы, что была между ними тогда.\n\n«Похоже на то. На этот раз, чья будет ошибка? В любом случае, облегчение, что не так неловко, как в прошлый раз.»\n\nХосино фыркнула с улыбкой. За последний год, вместо того чтобы не доверять Масарику, она предпочла учиться у него. Иногда он был строгим учителем, а иногда — добрым дедушкой.\n\n«Раз есть время, может, поговорим немного, Сенсей?»\n\nХосино проявила инициативу. Она уже называла его «Сенсеем» естественно.\n\n«Хорошо. На самом деле, я хотел спросить вас... После того как мы освободили Линц и Прагу, что Хосино хочет делать дальше?»\n\nВзгляд Масарика содержал серьезный вопрос, адресованный не простой студентке, а политической коллеге. Хосино посмотрела в потолок, подумала, а затем посмотрела ему прямо в глаза, словно приняв решение.\n\n«Я хочу заниматься политикой. Я соберу тех, кто стремится стабилизировать жизнь людей, чтобы у всех были равные возможности и был гарантирован минимум благосостояния. И с ними я сформирую партию.»\n\n«Большая социалистическая партия-зонтик? Это отличная цель.»\nМасарик кивнул.\n«Но... внутри нее... вы включите и коммунистическую партию?»\n\n«Да, конечно.»\n\nПеред без колебаний данным ответом на теплом лице Масарика впервые появилось выражение неловкости. Между бровей залегла легкая морщинка.\n\n«Госпожа Хосино, я доверяю вам, но не могу доверять коммунистам. Они не более чем бумага, подчиняющаяся хозяину в Кремле. Они — скрытая угроза внутри демократической системы. Их нужно исключить.»\n\n«Не волнуйся. Я защищу демократию, что бы ни случилось.»\n\nХосино ответила спокойно и продолжила.\n\n«Но, Сенсей... эта фраза, тебе не кажется знакомой? Эта «скрытая угроза, поэтому нужно исключить».»\n\nНа мгновение глаза Масарика немного расширились. Хосино продолжала.\n\n«Ты сам противостоял тем, кто так называл жителей немецкого происхождения, и принял их. Для кого-то они тоже были скрытой угрозой. И все же ты доказал: нужно видеть возможность и практиковать инклюзивность.»\n\nНаступила тишина. И тут с губ Масарика сорвался тихий смех.\n\n«Хе-хе... это было хорошо сказано. Я совершенно забыл то, чему сам их учил.»\n\nПочесывая затылок, как будто ему было стыдно, Масарик посмотрел на нее теплыми глазами.\n\n«Вы правы. Я был неправ. Верить в возможность и принимать ее: вот с чего все началось. Хорошо. Этот старик поддержит путь госпожи Хосино.»\n«Но я хочу спросить вас об одном. Если что-то встанет на пути идеала госпожи Хосино... что вы сделаете?»"
	ABY_descision_focus_event.43.a: "\"...Тогда, даже если придется уступить, нужно этого добиться.\""
	ABY_descision_focus_event.43.b: "\"...Мы начали, с самого начала, с идеала.\""

	ABY_descision_focus_event.44.t: "Двое детей Богемии"
	ABY_descision_focus_event.44.d: "Конференц-зал Немецкой партии Судет был полон энтузиазма. Когда на трибуне Томаш Масарик и Конрад Генлейн вместе зачитали декларацию дружбы ради будущего «нации двух миров», разразились оглушительные аплодисменты. Но после официального мероприятия, в частном кабинете Генлейна, между ними скользнул тонкий холодок.\n\nГенлейн, откинувшись на спинку стула, скрестив ноги и сложив руки на груди, встретил Масарика. Он не нарушил этикет, но вся его поза посылала невысказанное сообщение: «это не более чем политический союз». Масарик, однако, не смутился и держал чашку чая с благожелательной улыбкой.\n\n«Конференция прошла успешно, господин Генлейн. Почти можно было почувствовать здесь, на месте, стремление ваших соотечественников-судетов.»\n\n«Они только хотят вернуть свои законные права, господин.» — жестко ответил Генлейн.\n\n«Конечно. Тот, кто потерял свой дом, хочет его вернуть, это естественно.» — мягко продолжил Масарик. — «Иногда я думаю, что прежде чем называть себя чехами или немцами, мы все были соседями, укорененными в этой земле Богемии. Как деревья в лесу: дуб, береза, разные... но, в конце концов, один и тот же лес.»\n\n«Лес... но некоторые деревья также заслоняют солнце других.» — Голос Генлейна был полон колючек.\n\n«Верно. Поэтому нужен садовник, ухаживающий за лесом: чтобы ни одно дерево не зачахло и чтобы ни одно дерево не выросло настолько, чтобы вредить другим. Не должны ли мы стать друг для друга такими существами?»\n\nВ словах Масарика не было ни политического расчета, ни принуждения: только философия, от человека к человеку. Генлейн, сам того не замечая, распустил ноги. Ему показалось, что в его твердой внутренней стене появилась маленькая трещина.\n\nМасарик посмотрел в окно и продолжил:\n«Господин Генлейн, я не считаю судетов чешской нацией. Но вы, без сомнения, граждане этой страны. То, что мы говорим на разных языках и имеем разные культуры... как это может быть причиной угнетать другого человека под одним небом? Разное — это не неправильное; это просто другое.»\n\nВ этот момент Генлейн понял, что эти слова не были политической риторикой, а убеждением, проходившим через всю жизнь старика. Он не видел в судетах избирательный инструмент или часть коалиции, а по-настоящему уважал их как равноправных хозяев этой земли.\n\nНеизвестно, сколько времени прошло. Их разговор продолжался до глубокой ночи.\n\nКогда Масарик поднялся уходить, Генлейн тоже молча встал и проводил его до двери. Его отношение было совершенно иным, чем вначале. Он глубоко поклонился и поприветствовал с должным уважением: не только к старому государственному деятелю, но к человеку, которым он искренне восхищался.\n\nПроводив его, Генлейн молча задумался о демократии, которую защищал Масарик."
	ABY_descision_focus_event.44.a: "Я уважаю его, но я не уважаю демократию."
	ABY_descision_focus_event.44.b: "Возможно... я мог бы немного поверить ему."

	ABY_descision_focus_event.45.t: "Два мира"
	ABY_descision_focus_event.45.d: ""
	ABY_descision_focus_event.45.a: "Два мира должны сотрудничать, но не могут стать одним."
	ABY_descision_focus_event.45.b: "Два мира могут стать одним."

	ABY_descision_focus_event.46.t: "Рост недоверия к армии"
	ABY_descision_focus_event.46.d: ""
	ABY_descision_focus_event.46.a: "Все равно, немного гражданского контроля все же нужно."
	ABY_descision_focus_event.46.b: "Мы не дадим увлечь себя абсурдными слухами."

	ABY_descision_focus_event.47.t: "Корабль, покидающий берег"
	ABY_descision_focus_event.47.d: "Теплое весеннее солнце 1937 года ярко освещало недавно построенный зал Старшей школы Абидоса. Трудно было поверить, что всего два года назад это место было школой в руинах всего с пятью учениками. Теперь зал был полон кохаев и новых студентов, полных жизни. Все взгляды были устремлены на пять сенпаев, сидящих в первом ряду, выстроившихся под сценой. Хосино, Сироко, Нономи, Серика и Аянэ. Сегодня была их церемония выпуска.\n\nВ Кивотосе «выпуск» был странным понятием. Студенты были хозяевами академии, и академия была ими. Но здесь, в Европе, чтобы управлять страной вместе с местными жителями, статус «студента» стал почетным ограничением. Аянэ спокойно приняла реальность. «Это самая рациональная процедура.» Серика, огорченная, дни и ночи корпела над документами по подготовке церемонии, жалуясь.\n\nТот, кто поднялся на кафедру в качестве временного директора, был их учитель: Томаш Масарик. Он перевел взгляд с пятерых на публику и начал короткую, но вескую речь.\n\n«Мои дорогие ученики и мои уважаемые коллеги. Я слышал, что в Кивотосе выпускаться — редкость. Но сегодня мы собрались не для того, чтобы отпраздновать конец, а чтобы поздравить великое начало. Вы, защитившие школу среди моря песка, теперь стали столпами, поддерживающими государство. Покидая цепи ученичества и делая свой первый шаг как настоящие лидеры этой нации, ваш старый учитель будет с гордостью наблюдать за вами.»\n\nПод горячие аплодисменты Масарик спустился с кафедры, и пятеро встали. Как всегда, они подшучивали друг над другом, но их шаги двигались как одно целое к микрофону. Хосино с сонным лицом, Сироко с железной волей, Нономи, мягко улыбаясь, Серика, напряженная, но прямая, и Аянэ, невозмутимая, словно упорядочивающая все это.\nКогда они выстроились в линию, зал, гудевший как улей, затих, словно его залили водой.\n\nПятеро студенток сделали шаг вперед, к микрофону."
	ABY_descision_focus_event.47.a: "Пятеро студенток начали разные речи, каждая своим голосом."
	ABY_descision_focus_event.47.b: "Пятеро студенток произнесли речь в один голос."
	ABY_ABYDOS_Portrait_Change: "Заменяется §Yпортрет§! §YКомитета контрмер§!."

	ABY_descision_focus_event.48.t: "Об этике"
	ABY_descision_focus_event.48.d: "Перед операцией Падение Лепестков появятся 12 событий этики, и через их выборы будет сформирована федеральная этика.\n\nИнклюзивизм <-> Плюрализм\nЭгалитаризм <-> Авторитаризм\nИндивидуализм <-> Коллективизм\nНационализм\n\nОна делится на три противоположных оси этики и одну независимую ось этики.\nВ противоположных осях считается выбранной более сильная этика из двух; в случае национализма, если он фанатичный, он игнорирует другие этики, а если не фанатичный, он игнорируется при определении путей.\nПри завершении фокуса «Самая длинная ночь федерации» последующие политические фокусы определяются в зависимости от имеющейся у вас федеральной этики.\n\nМестные жители: Инклюзивизм / Эгалитаризм / Коллективизм\nАянэ: Плюрализм / Авторитаризм / Коллективизм\nХосино: Плюрализм / Эгалитаризм / Коллективизм\nСерика (Южный Кивотос): Инклюзивизм / Эгалитаризм / Индивидуализм\nСерика (Абидос): Инклюзивизм / Авторитаризм / Коллективизм\nСироко (демократия): Плюрализм / Эгалитаризм / Индивидуализм\nСироко (диктатура): Плюрализм / Авторитаризм / Индивидуализм\nНономи: Инклюзивизм / Авторитаризм / Индивидуализм\nСоу: Национализм"
	ABY_descision_focus_event.48.a: "Подтвердить."
	ABY_descision_focus_event.48.b: ""

	ABY_descision_focus_event.49.t: "Языковая проблема"
	ABY_descision_focus_event.49.d: "После перемирия с Хяккияко временное коалиционное правительство начало понемногу восстанавливать стабильность. Однако внутренние трещины, скрытые под большой угрозой войны, начали проявляться. Среди них самой неотложной и сложной проблемой был «язык».\n\nЧехи, немцы и даже кивотосцы с ореолами над головами. Три разных народа, три разных языка, смешанные в одном государстве. Для административной эффективности правительство временно назначило чешский официальным языком, но это вскоре стало новой искрой конфликта. Жалобы немецкой и кивотосской общин выплеснулись наружу, а те, кто не знал чешского, оказывались исключенными из официальных процедур или не получали надлежащих гарантий в образовании.\n\nПока лидеры ломали голову над этой проблемой, предложение поступило с неожиданной стороны: «Богемский комитет эсперанто». Они предложили принять эсперанто — нейтральный международный язык, не подчиненный какому-либо народу — в качестве нового официального языка федерации. Введение эсперанто обеспечило бы справедливую стартовую линию для чехов, немцев и кивотосцев и стало бы реальным символом гармонии, соответствующим названию «нация двух миров»."
	ABY_descision_focus_event.49.a: "Мы не можем повторить ошибку Двойственной империи."
	ABY_descision_focus_event.49.b: "Мы не можем тратить административный персонал на это."

	ABY_descision_focus_event.50.t: "Частная беседа"
	ABY_descision_focus_event.50.d: "\"Ухии~ закрыто наглухо.\"\n\n«Хе-хе... тогда придется подождать, пока собрание не закончится.»\n\nОни оказались в ловушке.\nВ тот короткий миг, когда Масарик пошел искать Хосино, заснувшую и не пришедшую на собрание, охранник закрыл дверь мастерской и ушел.\nТак они и сидели друг напротив друга, неловко, в темной мастерской.\nТогда Хосино заговорила первой.\n\n«Эй~ господин Масарик. Как поживают в последнее время кохаи? Все следуют за тобой, так что этот старичок чувствует себя одиноко, знаешь?»\n\nМасарик, заметив, что Хосино пытается вести его с помощью каверзных вопросов, решил обращаться с ней не как с политиком, а искренне.\n«Ну, все стараются, госпожа Хосино. Особенно госпожа Серика показала поистине замечательный рост.»\n\n«Хее~»\n«Тогда... чего ты хочешь для этих девушек, господин Масарик?»\n\n«Я надеюсь, что в будущем эти девушки станут точкой прорыва к гармонии двух миров.»\n\nПеред Масариком, который, в отличие от обычного, говорил, не скрывая эмоций, Хосино вздрогнула и поспешно выпустила наружу немного своих чувств."
	ABY_descision_focus_event.50.a: "\"Ухии... а они действительно этого хотят~?\""
	ABY_descision_focus_event.50.b: ""

	ABY_descision_focus_event.51.t: "Сенсей"
	ABY_descision_focus_event.51.d: "\"...Возможно, то, что я делаю, — это окрашиваю белый холст чистых детей в цвета, которые желаю я.»\n«Я учил их лгать. Я учил их не доверять людям, подавлять свою природу, сосуществовать с теми, кого они ненавидят.»\n«Они называют меня <Сенсей>, но я сам сомневаюсь, обладаю ли я качествами, которые подразумевает это звание в Кивотосе.»\n«Я даже не смог защитить свою собственную семью… действительно ли я имею право быть <Сенсеем> для детей, которых встретил внезапно? Ах… извините, госпожа Хосино. Я отвлекся от темы.»\n\nХосино увидела, как в глазах Масарика собирается маленькая капля.\nТак же, как она скрывала свою истинную сущность, чтобы защитить Абидос и своих кохаев, тот человек тоже играл роль стального лидера ради своей родины.\n\n«Нет, продолжайте. Я хочу услышать больше о вашей истории, господин Масарик.»\n\n«Если вы желаете…»\n«Я прожил жизнь, сотканную из лжи. Если бы эта ложь была ради моей собственной выгоды… философы могли бы не согласиться, но я верю, что это не так.»\n«Я могу с гордостью утверждать, что вся моя ложь была ради защиты того, что я любил.»\n«То, что я сделал с этими детьми… вероятно, было по той же причине.»\n\nХосино сказала, не подумав:\n«З-значит, вы тоже делали то, что должны были…!»\n\nВ этот момент дверь открылась.\n«Ваше превосходительство, вы были здесь? Мы беспокоились, что вы не возвращаетесь…»\n«Ха-ха-ха, ничего. Собрание уже закончилось?»\n«Почти. Но есть вопросы, требующие вашего немедленного присутствия.»\n«Хорошо, идем немедленно.»\n\n«Я…»\nКогда Хосино попыталась что-то сказать, Масарик оставил ей одну фразу."
	ABY_descision_focus_event.51.a: "\"Каждый должен делать то, что ему положено. Так же поступали и эти дети.\""
	ABY_descision_focus_event.51.b: ""

	ABY_descision_focus_event.52.t: "Последний урок"
	ABY_descision_focus_event.52.d: "Время было не на стороне Масарика. Увидев кровь, сопровождавшую его кашель, он понял, что ему осталось немного. Он больше не мог откладывать. Нужно было заложить последний фундамент, чтобы Абидос мог идти вперед, не шатаясь, даже после его ухода.\n\nОн созвал всех учеников Академии Абидос в зал. На сцене находились Хосино, уже выпустившаяся, вместе со своими четырьмя подругами.\n\nКогда Масарик объявил о своей отставке с поста «временного директора» и об окончательной отмене должности директора, зал наполнился гулом. Для студентов он был не просто политическим лидером, а добрым учителем, открывшим им путь.\n\n«Сенсей! Не могли бы вы остаться директором еще немного?»\n\nНа дрожащий голос первокурсницы Серика мягко взяла микрофон.\n\n«Я понимаю, что вы опечалены. Но Сенсей не уходит. Он просто возвращается на место, которому всегда должен был принадлежать.»\n\nАянэ спокойно добавила:\n«Академии Кивотоса всегда управлялись студентами. Сенсей был временным столпом, чтобы помочь нам пустить корни здесь. Теперь мы официально преобразуем Комитет контрмер в Студенческий совет и будем управлять школой самостоятельно, как автономным округом в составе Федерации.»\n\nХосино подошла к микрофону со своим обычным выражением лица.\n«Ухии~ Эй, даже если Сенсея нет, мы здесь, верно? Не волнуйтесь. Эти... кхм, эти старшие сестры обо всем позаботятся.»\n\nСлова пяти выпускниц постепенно успокоили студентов. Когда зал затих, Масарик начал свой последний урок.\n\n«Я думал, что научил вас многому, но, оглядываясь назад, я был тем, кто больше всего учился у вас. Я научился не терять надежду даже в отчаянии и без предрассудков принимать соседей из других миров.»\n\nЕго голос был слаб, но отчетливо звучал в сердцах всех.\n\n«Вы — студенты Абидоса, но также…»"
	ABY_descision_focus_event.52.a: "\"…граждане, которые осветят будущее Федерации Абидос.\""
	ABY_descision_focus_event.52.b: "\"…молодежь, несущая мечты Федерации Абидос.\""
