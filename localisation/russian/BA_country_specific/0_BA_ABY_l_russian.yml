	ABY_new_event.120.t: "Социализм поднимает белый флаг?"
	ABY_new_event.120.d: "Наши последовательные победы сокрушили их надежду. Наши солдаты, неудержимо продвигающиеся на восток Европы, сообщают о фронте, который рушится с серьезной скоростью — или сравнимой с этим. Если эти сообщения верны, полный крах русской армии уже на пороге... или, возможно, уже начался.\n\nСегодня утром советское правительство в Москве, в отличие от отношения, которое оно проявляло к нам в прошлом, провозгласило, что не отвергнет никакой условной капитуляции, и предложило нам мир. В обмен на передачу нам обширных территорий Восточной Европы — включая черноземные степи и черноморские порты Крыма — они желают постоянного мира и, с отчаянным видом, кажется, умоляют о нашем милосердии. Общественное мнение сильно разделено, но полная оккупация России сопряжена с огромными трудностями. Учитывая ее потенциал, лучший способ обеспечить гегемонию Абидоса и заблокировать российскую угрозу на десятилетия может быть мир."
	ABY_new_event.120.a: "Конечно. Отпразднуем нашу славную победу."
	ABY_new_event.120.b: "Мы направимся на далекий Дальний Восток."

	ABY_new_event.121.t: "Социализм поднимает белый флаг?"
	ABY_new_event.121.d: "Наши последовательные победы сокрушили их надежду. Наши солдаты, неудержимо продвигающиеся на восток Европы, сообщают о фронте, который рушится с серьезной скоростью — или сравнимой с этим. Если эти сообщения верны, полный крах русской армии уже на пороге... или, возможно, уже начался.\n\nСегодня утром советское правительство в Москве, в отличие от отношения, которое оно проявляло к нам в прошлом, провозгласило, что не отвергнет никакой условной капитуляции, и предложило нам мир. В обмен на передачу нам обширных территорий Восточной Европы — включая черноземные степи и черноморские порты Крыма — они желают постоянного мира и, с отчаянным видом, кажется, умоляют о нашем милосердии. Общественное мнение сильно разделено, но полная оккупация России сопряжена с огромными трудностями. Учитывая ее потенциал, лучший способ обеспечить гегемонию Абидоса и заблокировать российскую угрозу на десятилетия может быть мир."
