	ABY_event.49.t: "Единственный выбор"
	ABY_event.49.desc: "После создания Временного правительства Абидоса возникли различные партии.\n\nСреди них наиболее представительными были:\n * Демократическая партия, которая во главе с Хосино из Комитета контрмер Абидоса предлагает сформировать парламент, где народ будет выбирать депутатов.\n * Коммунистическая партия, которая при Хосино как верховном правителе утверждает, что народ должен работать на партию и наслаждаться равной жизнью, без разрыва между богатыми и бедными.\n * Фашистская партия, которая при Хосино как верховном правителе утверждает, что народ должен служить государству.\n\nОднако мы пришли к мысли, что так много партий с разными мнениями скорее мешают развитию страны, чем помогают.\nТеперь среди всех этих партий... нам придется выбрать одну."
	ABY_event.49.a: "Силой государства!"
	ABY_event.49.b: "Силой народа!"

	ABY_event.50.t: "Операция Падающие лепестки"
	ABY_event.50.desc: "Перемирие было лишь передышкой. Пока фронты стабилизировались и линии наносились на карты, враги тоже перегруппировывались.\n\nВ штабе «Правительство двух миров» приняло решение: если они хотят выжить, они должны ударить первыми.\n\nОперация получила поэтичное и жестокое название: §YОперация Падающие лепестки§!. Молниеносный прорыв, чтобы проложить путь к §YБогемии§!, освободить ключевые города и тем самым обеспечить промышленное и политическое сердце, необходимое для продолжения войны.\n\nЧехи просили скорости, прежде чем враг закроет проходы.\nСудеты требовали гарантий: они не бросят свои дома снова.\nАбидос, с масками и решимостью, задал только один вопрос: «Где цель?»\n\nПоезда с припасами уже готовы. Приказы подписаны. Солдаты и студенты молча ждут, затаив дыхание.\n\nЗима еще не закончилась.\nИ когда упадут первые «лепестки», Европа узнает, что эта коалиция не собирается исчезать."
	ABY_event.50.a: "К Богемии!"

