 #ABY_descision_focus_abydos_12_effect: "§Y[9.GetName]§!, §Y[75.GetName]§!, §Y[72.GetName]§! 주 중 §Y[SHA.GetNameWithFlag]§! 측이 지배하는 주:\n비무장 지대가 됩니다."
 #ABY_descision_focus_abydos_13_effect: "§Y두 세계의 국가§! 국민정신의 §Y결속도§! 15 §Y증가§!\n'§Y산불 작전§!' 국민정신을 §Y30§! 일 동안 획득.\n(사단 속도: §G+50.00%§!, 사단 조직력: §R-25.0%§!)효과 부여\n'§Y빈으로§!' 사건 발생"
 #ABY_descision_focus_abydos_14_effect: "§Y두 세계의 국가§! 국민정신의 §Y결속도§! 15 §Y증가§!\n'§Y산불 작전§!' ((§Y[SHA.GetNameWithFlag]§!)사단 공격: §G+10.0%§!, (§Y[SHA.GetNameWithFlag]§!)사단 방어: §G+5.0%§!) 국민정신 추가.\n'§Y빈으로§!' 사건 발생"
 #ABY_descision_focus_abydos_15_effect: "정치력: §G+1500§!\n기본 안정도 획득: §G+50.00%§!\n§Y[ABY.GetNameWithFlag]§! 에서 §Y에드바르트 베네시§! 체포\n§Y오쿠소라 아야네§!(은)는 §Y민주주의§! 정당의 지도자가 됩니다.\n    §Y연방 대통령§!\n      - 정치력 획득: §G+15%§!\n      - 안정도: §G+10.00%§!\n      - 정당 인기도의 안정도 변동치: §G+20.00%§!\n      - 이념 변화 방어: §G+25.0%§!\n      - 매일 민주주의 지지도: §G+0.15§!\n\n(§Y[9.GetName]§!, §Y[75.GetName]§!, §Y[72.GetName]§!, 그리고 §Y9§!):\n    주는 이제 §Y[ABY.GetName]§!의 핵심 주입니다.\n    다음 효과를 부여하는 §Y키보토스계 불만§! 추가:\n현지 가용 자원: §R-60%§!\n현지 공장: §R-60%§!\n징병 가능 인구: §R-60%§!"
 #ABY_descision_focus_czecho_1_effect: "§Y두 세계의 국가§! 국민정신의 §Y결속도§! 5 §Y증가§!\n'§Y희망을 잇는 동맹§!' 사건 발생\n§Y체코슬로바키아§!의 §Y장관§!과 §Y장군§!을 사용할 수 있습니다."
 #ABY_descision_focus_czecho_2_effect: "다음 효과를 부여하는 산업 업체 사용 가능:\n§Y슈코다 공업§!\n    산업 연구속도: §G+10.0%§!\n  §Y군수업체§!\n    §Y군수공장§! 건설속도: §G+5.0%§!\n    공장 생산량: §G+5.0%§!\n    조선소 생산량: §G+5.0%§!\n§Y북주데텐란트§!:\n    §G1§!개의 건설 슬롯 추가.\n    §G1§!개의 §Y군수공장§! 추가."
