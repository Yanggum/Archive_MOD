	ABY_descision_focus_event.94.t: "Ключ от золотых оков"
	ABY_descision_focus_event.94.d: "Ночь Праги вибрировала от кровавой вони «чистки», начатой Соу. Она безжалостно уничтожала остатки нацистов и жестких директоров Нефтис под предлогом «искоренения коррупции». Но даже Соу упустила кое-что из виду: логика денег более живуча, чем таракан.\n\nК Нономи, находившейся под домашним арестом, пришло зашифрованное сообщение. Отправителем были «умеренные» директора европейского филиала Группы Нефтис. Конечно, быть «умеренными» означало лишь то, что они были менее жестоки, чем радикалы; их взгляд, видевший в Нономи марионетку клана, был тем же.\n\n«Госпожа, эта сумасшедшая по имени Соу пытается национализировать активы группы. Старые радикалы уже уничтожены. Следующие — мы... и вы тоже.»\n\nНономи сжала трубку дрожащей рукой. У Соу были заложники — ее подруги из Комитета контрмер. Способ переломить ситуацию, по иронии судьбы, заключался в том, чтобы положиться именно на то, от чего она так хотела убежать: на финансовую мощь Нефтис и ее частных солдат (ЧВК).\n\n«Каково... условие?»\n\n«Просто. Когда мы нанесем удар в спину Соу, вы предоставите нам легитимность от имени Нефтис. Для восстановления группы.»\n\nНономи закрыла глаза. Это было схватить руку другого демона, чтобы изгнать первого. Но если она могла спасти своих подруг, ее душа была не важна."
	ABY_descision_focus_event.94.a: "\"Хорошо... я принимаю предложение. Но обязательно гарантируйте безопасность моих подруг.\""
	ABY_descision_focus_event.94.b: "\"Хорошо... я принимаю предложение. Но обязательно гарантируйте безопасность моих подруг.\""

	ABY_descision_focus_event.95.t: "Стальные челюсти"
	ABY_descision_focus_event.95.d: "В 3 часа ночи выстрелы прогремели в центре Праги. Наемники из ЧВК, нанятые умеренными директорами, штурмовали ключевые правительственные здания. Их план состоял в том, чтобы захватить Соу с молниеносной скоростью. Однако кабинет, в который они ворвались, был пуст.\n\n«Информация просочилась?»\n\nС другого конца рации командира наемников раздался холодный голос Соу.\n\n«Вот почему не годятся бизнесмены. Они рассчитывают прибыль и упускают момент, когда нужно нажать на курок.»\n\nЭто была ловушка. Соу уже обнаружила движение умеренных и заперла их в кольце окружения. Засадные бронетанковые части раздавили наемников, а личная охрана Соу ударила по временной штаб-квартире Нефтис.\n\nНа рассвете Соу появилась перед камерами в форме, забрызганной кровью.\n\n«Уважаемые граждане: сегодня мы стали свидетелями отвратительного мятежа капиталистов, угрожающих демократии. Группа Нефтис попыталась свергнуть государство. Поэтому настоящим я ввожу чрезвычайные полномочия: конфискую все активы Группы Нефтис и объявляю ее врагом нации.»\n\nПровал контрудара дал крылья Соу. Она получила идеальный предлог для «разгрома внутреннего врага» и, не оглядываясь ни на кого, начала кровавую великую чистку. На улицах тащили сотрудников Нефтис и оппозиционеров; город охватил террор."
	ABY_descision_focus_event.95.a: "Начался прожорливый пир."

	ABY_descision_focus_event.96.t: "Тишина пустыни"
	ABY_descision_focus_event.96.d: "С активами Нефтис и оружейными заводами в руках ничто больше не стояло на пути Соу. Тогда она решила заняться последним самым неудобным «фактором».\n\nНа самом нижнем уровне подземной тюрьмы Соу холодными глазами посмотрела на камеру. Там были ее бывшие подруги: Хосино, Сироко, Аянэ, Нономи... Ни одна не потеряла взгляда сопротивления.\n\n«Жаль. Я хотела оставить вас в живых, но вы слишком опасны. Если я прощу вас, однажды вы без сомнения придете за моей головой.»\n\n«Соу! Ты думаешь, выйдешь сухой из воды?» — крикнула Хосино, но Соу не слушала.\n\n«Станьте удобрением для страны.»\n\nПо ее знаку раздались выстрелы. Один, два... и затем тишина. Столпы, державшие Абидос, рухнули нелепо. Соу безучастно развернулась. Но когда вернулась в свой кабинет, нахмурилась, читая отчет.\n\n«Куроми Серика... ее местонахождение все еще неизвестно?»\n\nСерики не было на месте, когда их арестовывали. Ни трупа, ни свидетелей. Над идеальной победой нависла тревожная тень. Единственная выжившая."
	ABY_descision_focus_event.96.a: "Этот маленький уголек начал раздражать нервы Соу."

	ABY_descision_focus_event.97.t: "Сломанный клык"
	ABY_descision_focus_event.97.d: "Из отдаленных гор начали распространяться зловещие слухи. Силы сопротивления под названием «Группа Сехмет» устраивали засады на путях снабжения правительства. В центре всего была кошка мести: Куроми Серика.\n\nСерика вернулась живой из ада. Она собрала остатки Хяккаёран из Хяккияко и Торговой гильдии Хёнму из Шанхайцзина, старых врагов.\n\n«Месть за моих сенпаев... я исполню ее, чего бы это ни стоило!»\n\nЯрость Серики была неистовой. Группа Сехмет терзала армию Соу молниеносными партизанскими ударами и даже временно освобождала небольшие провинциальные городки. Но перед подавляющей огневой мощью регулярной армии этого было недостаточно. Соу больше не проявляла милосердия.\n\n«Чтобы поймать крыс, лучше всего огонь.»\n\nСоу приказала нанести массированный удар по долине, идентифицированной как последний оплот Сехмет. Упали сотни снарядов и зажигательных бомб; долина превратилась в ад. Через несколько дней поисковые группы нашли в пепле обгоревшую красную заколку, предположительно принадлежавшую Серике, и несколько обезображенных человеческих останков.\n\nПолучив отчет, Соу наконец откупорила шампанское.\n\n«С этим все переменные исчезают.»\n\nСмерть Серики означала конец сопротивления."
	ABY_descision_focus_event.97.a: "...Возможно."

	ABY_descision_focus_event.98.t: "Эра Просвещения"
	ABY_descision_focus_event.98.d: "Когда все соперники и угрозы были уничтожены, Абидос... нет: Военное правительство Просвещения Южного Кивотоса. Соу назвала себя не президентом и не премьер-министром, а чем-то более великим. Она поднялась на трибуну центральной площади и оглядела сотни тысяч.\n\n«Мы покончили с эрой хаоса и разделения! Слабая демократия, коррумпированный капитализм и иностранное вмешательство сделали нас больными. Теперь мы должны возродиться!»\n\nОна провозгласила «Революцию Просвещения». Тоталитарная система, где государство контролирует и направляет каждый аспект жизни. Парламент был распущен, и вместо него его заменила фанатичная партия Соу: «За правду Кивотоса–За Просвещение».\n\n«Я стану верховным лидером, который поведет весь Кивотос и эту землю, и поведу их по пути великого процветания. Следуйте за мной. Только у меня есть ответ.»\n\nТолпа, заполнившая площадь, скандировала ее имя, то ли от страха, то ли от индоктринации.\n\n«Соу! Соу! Да здравствует верховный лидер!»\n\nС этого дня свободный Абидос умер."
	ABY_descision_focus_event.98.a: "Осталась только «Империя Соу»."

	ABY_descision_focus_event.99.t: "Ржавая корона"
	ABY_descision_focus_event.99.d: "На балконе резиденции в Праге Нономи наблюдала за гражданами, заполнившими улицы в праздновании. Соу была арестована, ее личная охрана разоружена. На поверхности это была победа демократии и триумф справедливости.\n\nНо лицо Нономи было мрачным. Позади нее стояли умеренные директора Группы Нефтис. Больше, чем радоваться, они были заняты пересмотром книг учета восстановленных активов.\n\n«Поздравляю, госпожа. Нет... теперь мы должны называть вас героиней, верно?»\n\nСказал один из них, стуча по калькулятору.\n\n«Бюрократические процедуры для возврата нам фабрик, национализированных Соу, уже начались. И... скоро также будет готово взыскание затрат, вложенных в эту 'поддержку'.»\n\nНономи горько улыбнулась. Тиран по имени Соу исчез, но те, кто занял ее место, были жадными торгашами. Не проливая крови, они проглатывали всю страну, используя Нономи как ширму.\n\n«Мои подруги... они в безопасности, правда?»\n\n«Конечно. Они получают лучшее лечение в больнице. Хотя какое-то время им потребуется 'отдых'.»\n\nЭтот «отдых» был намеком: они будут заложниками какое-то время. Нономи сжала кулаки. Эра насилия закончилась, но началась эра капитала. И она была такой же удушающей, как диктатура Соу."
	ABY_descision_focus_event.99.a: "Одна диктатура сменила другую."

	ABY_descision_focus_event.100.t: "Президент-марионетка"
	ABY_descision_focus_event.100.d: "После краха режима Соу переходное правительство быстро восстановило стабильность. В центре всего был огромный капитал Группы Нефтис. И наступили выборы. Совет директоров вызвал Нономи.\n\n«Передайте президентство в группе профессиональному менеджеру. Госпожа... нет, кандидат — вы должны выйти на более широкую арену.»\n\nОни потребовали, чтобы она баллотировалась в президенты. Права на отказ не было. Пакет обещаний, который они вложили ей в руки, был ужасающим: массовое смягчение трудового законодательства, отмена корпоративного налога, устранение регулирования... Это было превращение государства в частную собственность корпораций.\n\n«Это... слишком. Жизнь граждан рухнет», — запротестовала Нономи, но директора холодно улыбнулись.\n\n«Мы просим объявить профсоюзы вне закона? Или отменить минимальную зарплату? Это необходимо для «экономики свободного рынка». И не забывайте: если вы откажетесь, мы можем найти другую альтернативу. В этом случае мы не можем гарантировать, что случится с вами и вашими подругами.»\n\nВ конце концов, Нономи опустила голову. Чтобы избежать худшего, у нее не было другого выбора, кроме как выбрать меньшее зло.\nВо время кампании деньги Нефтис разбрасывались беззастенчиво. СМИ изображали ее как «святую спасительницу родины», а соперничающие кандидаты бессильно падали перед властью денег.\n\nТрансляция подсчета голосов объявила о победе Нономи. Сыпалось конфетти, люди ликовали, но глаза Нономи на трибуне были пусты. Она стала президентом и в то же время пленницей в самой яркой тюрьме."
	ABY_descision_focus_event.100.a: "Федерация Абидоса теперь была «Республикой Нефтис»."

	ABY_serv_focus_event.1.t: "Отчет об исследовании – Геенна"
	ABY_serv_focus_event.1.d: "Краткое содержание: В крупном гражданском сооружении недалеко от Центрального района Геенны были найдены следы, подобные биологическим экспериментам Тринити. Не наблюдается признаков вмешательства Общества Пандемониум или Дисциплинарного комитета, поэтому считается действием гражданского клуба. Успешных образцов не было, но получено много данных.\n\n1. В целом напоминает подземное медицинское учреждение Высокого Собора, но лишено базовых исследовательских условий, таких как гигиена.\n\n2. Подробно зарегистрированы летальные дозы по весу и ИМТ. При превышении определенного порога наступает мгновенная смерть; точные цифры прилагаются отдельно.\n\n3. В заметках исследователя и личных записях нет следов приказов Общества Пандемониум или Дисциплинарного комитета; напротив, похоже, что Дисциплинарный комитет выслеживал их.\n\n4. При инъекции мистики до летальной дозы физическая производительность непрерывно возрастает; при достижении критической точки достигаются физические способности, подобные кивотосцам, но за считанные секунды мышечная ткань полностью разрушается и наступает смерть.\n\n5. Проводились эксперименты на животных на основе обратных расчетов, но не удалось достичь результатов, сравнимых с захваченными данными. Считается, что вне людей значительного эффекта не будет.\n\nЗаключение: Представляется необходимым введение вспомогательных средств, таких как стабилизаторы, при инъекции мистики. Поскольку эксперименты на животных не могут дать полезных результатов, предлагается, неизбежно, приступить к экспериментам на людях на основе существующих материалов.\n\nИсследовательская группа 26, дислоцированная в Центральном районе."
	ABY_serv_focus_event.1.a: "Запрещено."

	ABY_serv_focus_event.2.t: "Отчет об исследовании – Миллениум"
	ABY_serv_focus_event.2.d: "Краткое содержание: Найдены следы крупномасштабных исследований по инъекции мистики в подземелье исследовательского учреждения, связанного с Семинаром Миллениума. Большинство данных сохранились нетронутыми.\n\n1. По масштабам материалов оценивается, что использовалось как минимум десятки тысяч субъектов. Найдены данные с более подробными цифрами, чем найденные в Геенне. Прилагаются.\n\n2. Находится в учреждении Семинара, но в исследовательских блокнотах и личных записях нет упоминаний об одобрении Семинаром или прямых ссылок, поэтому его причастность не подтверждена.\n\n3. Удалось успешно подавить самоуничтожение иммунитета, вызванное инъекцией мистики, с помощью недельного диализа крови и приема/введения сильнодействующих токсичных препаратов.\n\n4. Тем же методом удалось отсрочить разрушение тела, но результат указывает на то, что продолжительность жизни ограничится примерно 5 годами.\nПримечание: классифицировано как совершенно секретно.\n\n5. Предполагается, что субъекты были ликвидированы; найдены следы плана для следующего исследования, направленного на предотвращение сокращения жизни. План исследования: дополнительная инъекция кивотосской мистики, ..., инъекция мистики плодам, ... (опущено). См. приложения.\nПримечание: классифицировано как совершенно секретно.\n\nЗаключение: Дополнительные расчеты на основе данных подтверждают, что, как бы ни откладывался распад, невозможно продлить его более чем на 10 лет.\n\nДополнительный отчет: Испытания механизированных экзоскелетов, навязанные запретом на эксперименты над людьми, продвигаются благодаря получению этих материалов. Однако для прикладных боевых исследований потребуется сотрудничество с военным ведомством, и, по-видимому, неизбежно раскрытие части данных, поэтому требуется авторизация.\n\nИсследовательская группа 3, дислоцированная в Миллениуме."
	ABY_serv_focus_event.2.a: "На рассмотрении."

	ABY_serv_focus_event.3.t: "Краткое содержание отчета о министерском совещании № 395, том 86"
	ABY_serv_focus_event.3.d: "Разгорается полемика о том, следует ли обнародовать данные исследовательского отчета Миллениума.\n\nДостигнуто соглашение обнародовать часть данных для гражданского сектора.\n\nДетальные данные будут обнародованы для армии, но предписано, чтобы они не просачивались ниже ранга генерала.\n\n(опущено)\nКраткое содержание № 396, том 3\n\nПодтвержден детальный отчет о «Проекте Джаггернаут».\nВозникает разделение мнений из-за требуемого чрезмерного бюджета.\n\nЗаписи удалены.\n\nДостигнуто окончательное заключение."
	ABY_serv_focus_event.3.a: "Проект Джаггернаут утвержден."
	ABY_serv_focus_event.3.b: "Проект Джаггернаут отклонен."

	ABY_serv_focus_event.4.t: "Отчет об исследовании – Тринити"
	ABY_serv_focus_event.4.d: "Краткое содержание: Отчет об исследовании нескольких сотен трупов и медицинского оборудования, найденных в подземелье Высокого Собора Тринити.\nПримечание: Перед входом многие записи были сожжены или уничтожены, поэтому проверяемых материалов мало.\n\n1. Вокруг трупов найдены большие количества сыворотки мистики и ткацкого станка мистики.\n\n2. Причины смерти общие: полная органная недостаточность или остановка сердца, предположительно из-за соматической мышечной перегрузки и самоуничтожающейся иммунной активации.\n\n3. У всех тел значения мистики наблюдаются выше нормального диапазона.\n\n4. Содержимое проверить невозможно, но найдены приказы Чайной партии, поэтому предполагается, что это было направлено правительством Тринити.\n\n5. Даты смерти в целом совпадают с периодом «поддержки бездомных и социально дезадаптированных» правительства Тринити.\n\nЗаключение: Считается биологическим экспериментом над людьми, основанным на испытаниях инъекции мистики животным, проведенных Центральным институтом мистических исследований Абидоса. Однако, поскольку большая часть данных была уничтожена, невозможно извлечь полезных результатов, кроме того, что без соответствующих мер инъекция мистики людям вызывает реакцию, подобную животным, и вызывает смерть. Требуется поддержка гораздо более обширными исследовательскими материалами.\n\nГруппа мистических исследований 37, дислоцированная в Высоком Соборе."
	ABY_serv_focus_event.4.a: "Утверждено."

