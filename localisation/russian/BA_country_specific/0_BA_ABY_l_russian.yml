	ABY_idea_katakata: "Банда Каска Катаката"
	ABY_idea_katakata_desc: "Мы не единственные, кто был перенесен сюда. Банда Каска Катаката, которая раньше донимала нас, тоже находится здесь. Были развернуты широкомасштабные соседские патрули для их сдерживания, но нападения и захваты фабрик все еще происходят часто.\nМы должны как можно скорее решить, что с ними делать."
