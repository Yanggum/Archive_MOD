	ABY_descision_category_focus: "Триумвират"
	ABY_descision_category_masaryk: "Последнее пламя"
	ABY_descision_category_masaryk_desc: "Томаш Гарриг Масарик,\nПрезидент-освободитель, железный король, отец Богемии, Сенсей Абидоса и многие другие титулы. В декабре 1935 года он думал об отставке с поста президента, но Великое Перемещение и другие обстоятельства наложились, и только в январе 1937 года он наконец смог отойти от той огромной власти, которую осуществлял с 1918 года.\n\nНо даже если власть исчезает, тяжесть ответственности не улетучивается. Он ушел с государственной должности, но остается влиятельной политической фигурой, и именно его преемники поведут эту страну.\n\nОн знает.\nЧто у него осталось не так много времени.\n\nЧеловек, уважаемый как чехами, так и немцами Богемии, которого называли «Отцом Богемии»;\nчеловек, уважаемый даже людьми из Кивотоса и Абидоса, которого называют «Сенсеем Абидоса».\n\nВ зависимости от того, как Масарик использует последнее отпущенное ему время, судьба этой страны и даже обоих миров будет решена!"
	ABY_descision_category_two_world: "Страна двух миров"
	ABY_descision_category_two_world_desc: "Страна двух миров.\nИзвне Абидос называют «страной двух миров»: иногда с почтением, иногда с презрением.\n\nТе, кто почитает, назовут его цветком гармонии и надежды, расцветшим посреди ненависти и хаоса;\nте, кто презирает, сведут его, с цинизмом, к невозможному идеалу.\n\nЕстественно, реальность, вероятно, ближе к тому, во что верят последние. У местных жителей уже были конфликты между этносами, а у кивотосцев — конфликты между академиями; было бы сказкой, если бы две такие разные расы могли сосуществовать без трений.\n\nНо если столкновения между двумя расами можно свести к уровню этнических или академических конфликтов, этого будет достаточно.\n\n«Самый красивый цветок в мире», привлекающий все взгляды, мы не можем заставить расцвести… и, возможно, его даже не существует.\n\nНо «простая орхидея, цветущая в пустоши»… такую мы могли бы заставить расцвести, и она тоже могла бы привлечь всеобщее внимание.\n\nИ это то, что мы хотим, к чему мы должны стремиться."
	ABY_descision_category_crysis_gyemong: "Глобальный кризис"

