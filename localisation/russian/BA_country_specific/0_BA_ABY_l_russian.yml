 ABY_focus_drone_desc:0 ""

 ########################################################

	ABY_focus_establish_sekhmet: "Сформировать бригаду Сехмет"
	ABY_focus_establish_sekhmet_desc: "Похоже, эти фашисты не знакомы со словом «совесть». Они похитили всех наших товарищей и теперь говорят, что, если мы хотим их спасти, мы должны пойти к ним? Нет. Этого не случится.\nКуроками Серика, единственная, кому удалось вырваться из их лап, основала бригаду Сехмет — названную в честь богини мести — с единственной целью: спасти Комитет контрмер."

	ABY_focus_contact_with_hyakkaryoran: "Связаться с Хяккарёран"
	ABY_focus_contact_with_hyakkaryoran_desc: "Кирю Кикё из Хяккарёран Академии союзников Хяккияко собрала людей со схожими интересами, чтобы сформировать сопротивление, стремясь отомстить за свою подругу по клубу, Каденокодзи Юкари. Если Кикё присоединится, это будет возможностью компенсировать недостаток стратегического видения Серики."

	ABY_focus_deal_with_genbushokai: "Сделка с Торговым обществом Гэнбу"
	ABY_focus_deal_with_genbushokai_desc: "Торговое общество Гэнбу из Шанхайцзина выживало, адаптируясь к переменам… но под фашистским гнетом оно долго не продержится. Если мы дадим понять, что присоединение к нашему делу — также их путь к выживанию, рано или поздно они встанут на нашу сторону."

	ABY_focus_succeed_legitimacy: "Объявить о наследовании легитимности Комитета контрмер"
	ABY_focus_succeed_legitimacy_desc: "Больше всех в интеграцию Чехии и Австрии вложился Комитет контрмер. Куроками Серика, его единственная выжившая, провозгласила, что именно она наследует его легитимность."

	ABY_focus_expand_guerilla: "Расширить партизанскую войну"
	ABY_focus_expand_guerilla_desc: "Эти фашисты должны страдать, чего бы это ни стоило!"

	ABY_focus_persuade_czech: "Убедить чехов"
	ABY_focus_persuade_czech_desc: "Многие чехи питают обиду на австрийское руководство. Мы можем привлечь их к восстанию в обмен на политические выгоды в будущем."

	ABY_focus_overthrow_austrian_fascism_government: "Свергнуть австрийское фашистское правительство"
	ABY_focus_overthrow_austrian_fascism_government_desc: "Пришло время ответить за кровь, пролитую кивотосцами. Мы поднимем восстание против фашистского правительства Австрии и полностью изгоним их!"

	ABY_focus_vengeance_for_abydos: "Месть Абидоса"
	ABY_focus_vengeance_for_abydos_desc: "Патриотический фронт полностью отнял у Абидоса счастье. Было бы справедливо вернуть им удар… но Серика не могла выбросить из головы слова, сказанные когда-то Таканаши Хосино. Поколебавшись, Серика приняла решение и начала свою собственную месть."

	ABY_focus_threats_outside: "Внешние угрозы"
	ABY_focus_threats_outside_desc: "К сожалению, основные кадры Патриотического фронта бежали за границу через беззащитную границу. Серика утверждает, что, если не уничтожить остатки полностью, будет больше жертв. Однако начальница операций Кикё советует сначала разобраться с фашистским государством Кивотоса.\nЕдинственное, что точно: какой бы путь ни был выбран, мы должны готовиться к войне."

	ABY_focus_exterminate_kivotos_fascism: "Искоренить фашизм Кивотоса"
	ABY_focus_exterminate_kivotos_fascism_desc: "Мы не можем игнорировать, что кивотосцы, такие же, как мы, пали жертвой яда фашизма. Северяне опьянели от этого яда; наш долг — пробудить их."

	ABY_focus_accept_prefect_team: "Принять изгнанников Дисциплинарного комитета"
	ABY_focus_accept_prefect_team_desc: "Дисциплинарный комитет защищал правильный идеал: ставить кивотосцев на первое место. Их цель совпадает с нашей; мы должны принять их как подобает."

	ABY_focus_plan_antigerman_riot: "Спровоцировать антинемецкие демонстрации"
	ABY_focus_plan_antigerman_riot_desc: "Среди жителей Геенны есть недовольные решением Макото ставить немцев выше кивотосцев. Если дать им небольшой повод, подстрекать их будет нетрудно."

	ABY_focus_prepare_for_halo_war: "Готовиться к войне ореолов"
	ABY_focus_prepare_for_halo_war_desc: "Мы уже победили Хяккияко и Шанхайцзин, но это было скорее благодаря стратегии, а не национальному превосходству. Теперь враг — страна с огромной военной мощью, оккупировавшая и Геенну, и Тринити. У одной стратегии есть пределы; мы должны готовиться и к тотальной войне между пехотами Ореола."

	ABY_focus_attack_german_fascists: "Атаковать немецких фашистов"
	ABY_focus_attack_german_fascists_desc: "Мы получили разведданные, что германский военно-морской флот базируется на острове недалеко от территории Германии. Даже если они не угрожают нам сегодня, однажды они это сделают. Мы должны отсечь побег, прежде чем он вырастет."

	ABY_focus_operation_austerlitz: "Операция Аустерлиц"
	ABY_focus_operation_austerlitz_desc: "Настал решающий час. С этой войной фашизм Кивотоса исчезнет навсегда!"

	ABY_focus_eliminate_terran_fascism: "Искоренить земной фашизм"
	ABY_focus_eliminate_terran_fascism_desc: "Направление мести уже определено. Мы должны судить землян, исповедующих фашизм."

	ABY_focus_ally_with_kivotos_states: "Протянуть руку государствам Кивотоса"
	ABY_focus_ally_with_kivotos_states_desc: "Пока мы воюем с землянами, нам нужен стабильный тыл. Мы отправим эмиссаров во все еще существующие государства Тринити, чтобы предложить сотрудничество."

	ABY_focus_judge_josef_tiso: "Судить Йозефа Тисо"
	ABY_focus_judge_josef_tiso_desc: "Йозеф Тисо — оппортунистический клерикальный фашист. То, что фашист может ударить нас в любой момент, означает, что семя катастрофы прорастает у нас под ногами."

	ABY_focus_end_of_bizzare_regency: "Конец странного регентства"
	ABY_focus_end_of_bizzare_regency_desc: "Говорят, что регион Бургенланд, который мы контролируем, изначально был венгерской территорией. Если Венгрия встанет на путь ревизионизма, столкновение с нами будет лишь вопросом времени. Мы должны действовать первыми."

	ABY_focus_pressure_toward_yugoslavia: "Оказать давление на Югославию"
	ABY_focus_pressure_toward_yugoslavia_desc: "Чтобы эффективно атаковать Италию — нашу конечную цель — мы потребуем от Югославии уступки определенных территорий. Мы сопроводим это ультиматумом: отказ будет означать помощь фашистам."

	ABY_focus_operation_odoacer: "Операция Одоакр"
	ABY_focus_operation_odoacer_desc: "Подтверждено, что большинство остатков Патриотического фронта бежали на юг, в Италию. Мы должны завоевать Италию, колыбель фашизма, и погасить фашизм в Европе!"

	ABY_focus_stalking_vf_remnants: "Преследовать остатки Патриотического фронта"
	ABY_focus_stalking_vf_remnants_desc: "После разгрома Патриотический фронт рассеялся по многим местам, но мы продолжаем получать сообщения о том, что они ищут возможность реванша поблизости. Мы должны выследить их всех и захватить."

	ABY_focus_demand_vf_to_swiss: "Требовать от Швейцарии выдачи остатков"
	ABY_focus_demand_vf_to_swiss_desc: "Мы недавно получили информацию, что Эрнст Рюдигер Штаремберг, лидер Патриотического фронта, бежал в Швейцарию. Атаковать Швейцарию также заставит нас истекать кровью; поэтому, чтобы «сохранить нейтралитет», мы потребуем выдать Штаремберга."

	ABY_focus_though_war_is_over: "Война закончилась, но..."
	ABY_focus_though_war_is_over_desc: "Куроками Серика бежала до сих пор, глядя только на месть. Она добилась желаемой мести, но ее сердце все еще чувствует удушье.\n\nСможет ли она найти новый смысл в своей жизни?"

	ABY_focus_bloodthirst_of_lion: "Жажда льва"
	ABY_focus_bloodthirst_of_lion_desc: "\"Еще нет… месть еще не закончена…!\"\n\nМы думали, что искоренение фашизма было лучшей местью. Но, видя, как местные жители начали сопротивляться, мысли Серики начали меняться. Если бы не они, Комитет контрмер не погиб бы…"

	ABY_focus_ungrateful_purge: "Неблагодарная чистка"
	ABY_focus_ungrateful_purge_desc: "Заметив перемену в Серике, Кикё пытается любым способом убедить ее остановить дальнейшие войны. Хотя мы много получили от ее помощи, если она попытается помешать нашему новому идеалу, мы должны безжалостно устранить ее.\n\nКраеугольный камень стал препятствием, которое нужно вырвать."

	ABY_focus_general_mobilization_order: "Приказ о мобилизации на войну"
	ABY_focus_general_mobilization_order_desc: "Чтобы воплотить новую мечту Серики, государство будет мобилизовано по максимуму, даже если придется готовиться к бесконечной войне."

	ABY_focus_reversed_halo: "Перевернутый ореол"
	ABY_focus_reversed_halo_desc: "\"Э…? Мой ореол всегда был таким…?\"\n\nКогда Серика заметила аномалию, было уже слишком поздно."

	ABY_focus_until_all_terrans_die: "Пока не умрут все земляне"
	ABY_focus_until_all_terrans_die_desc: "Одержимая мистерией войны и мести, Серика начала кровавую расправу над землянами."

	ABY_focus_bloody_ecstacy: "Кровавый экстаз"
	ABY_focus_bloody_ecstacy_desc: "Видя, как льется человеческая кровь, она смеялась… и смеялась. С хохотом она убивала врагов одного за другим. При виде ее фигуры и враги, и союзники дрожали от ужаса…"

	ABY_focus_girl_dyed_with_blood: "Девушка, окрашенная кровью"
	ABY_focus_girl_dyed_with_blood_desc: "Ситуация на фронте ухудшается, а моральный дух народа падает. Только смех Сехмет звучит вместе с выстрелами.\n\nНо не за горами день, когда Сехмет, не успев даже почувствовать пустоту мести, испьет поднесенную ей чашу."

	ABY_focus_end_of_vengeance: "Конец мести"
	ABY_focus_end_of_vengeance_desc: "Серика вспомнила, зачем развязала войну. Вырвать Патриотический фронт с корнем было, в конечном счете, ради безопасности невинных кивотосцев. Цель достигнута; теперь пришло время строить страну для кивотосцев."

	ABY_focus_ideal_of_integration: "Идеал интеграции"
	ABY_focus_ideal_of_integration_desc: "После войны народ все больше и больше объединяется. Теперь они мечтают об идеале интеграции Южного Кивотоса."

	ABY_focus_southern_kivotos_industries: "Промышленное развитие Южного Кивотоса"
	ABY_focus_southern_kivotos_industries_desc: "Мы вернули мир; теперь мы можем инвестировать в экономическое развитие. Огромный промышленный комплекс, охватывающий три академии, начал строиться."

	ABY_focus_effort_for_peace: "Усилия ради мира"
	ABY_focus_effort_for_peace_desc: "Мы больше не будем теми, кто развязывает войны. Часть военных расходов теперь будет инвестироваться в повышение уровня жизни."

	ABY_focus_restore_sightseeing: "Восстановить туризм"
	ABY_focus_restore_sightseeing_desc: "Хяккияко и Шанхайцзин в значительной степени зависят от туризма. Восстановление туристического сектора — остановленного Великим Перемещением и войной — также принесет пользу нашей экономике."

	ABY_focus_expand_fortress: "Расширить укрепления"
	ABY_focus_expand_fortress_desc: "Есть поговорка: хочешь мира — готовься к войне. Хотя внешне сейчас стабильно, необходимо также быть готовыми ко дню, когда нашему миру будет угрожать опасность."

	ABY_focus_negotiation_again: "Пересмотр переговоров"
	ABY_focus_negotiation_again_desc: "В отличие от Хяккарёран, которая решила полностью сопровождать Серику, Шанхайцзин сотрудничал с нами, держа камень за пазухой. Теперь пришло время снова их убедить."

	ABY_focus_serika_dictatorship: "Диктатура Серики"
	ABY_focus_serika_dictatorship_desc: "Свергнуть австрийское правительство, угнетавшее кивотосцев, выиграть войну и смести Патриотический фронт… ничего из этого не началось бы без Серики. Лидером объединенного государства должна стать, как и подобает, Серика."

	ABY_focus_kivotos_priority: "Кивотосцы прежде всего"
	ABY_focus_kivotos_priority_desc: "Мы установим новый порядок, в котором кивотосцы будут получать привилегированное обращение. Но мы также подчеркнем, что это не потому, что мы «превосходны», а потому, что в этом мире мы все еще уязвимы."

	ABY_focus_new_kivotos_council: "Новый Студенческий совет Кивотоса"
	ABY_focus_new_kivotos_council_desc: "Генеральный студенческий совет парализован и больше не выполняет свою функцию. Мы должны создать новый совет, чтобы сдержать грядущий хаос."

	ABY_focus_abydos_sand_fiesta: "Песчаный фестиваль Абидоса"
	ABY_focus_abydos_sand_fiesta_desc: "Используя тот факт, что Великое Перемещение переместило пустынные территории, Серика планирует устроить песчаный фестиваль. Это исцелит тело и дух уставших, а также будет символизировать, что Абидос лидирует в Южном Кивотосе."

	ABY_focus_restore_democracy: "Восстановить демократию"
	ABY_focus_restore_democracy_desc: "До Великого Перемещения Чехия была единственным демократическим государством в Центральной Европе. Восстановление демократии также поможет интегрировать два народа."

	ABY_focus_assembly_of_people: "Парламент всего народа"
	ABY_focus_assembly_of_people_desc: "Если слушать только одну сторону и игнорировать другую, конфликт неизбежен. Если парламент будет состоять из равного числа кивотосцев и местных жителей, можно будет уважать голоса обоих."

	ABY_focus_combination_between_two_people: "Интеграция двух народов"
	ABY_focus_combination_between_two_people_desc: "Объединенный Южный Кивотос будет государством, где оба народа будут уважаемы."

	ABY_focus_lamp_festival_for_new_era: "Фестиваль фонарей для новой эры"
	ABY_focus_lamp_festival_for_new_era_desc: "В прошлом в Академии союзников Хяккияко проводили фестиваль фонарей, чтобы молиться о единстве кампуса, пуская фонарики по воде. С тем же смыслом Парламент Южного Кивотоса объявил, что проведет фестиваль фонарей, чтобы пожелать интеграции."

	ABY_focus_girl_with_white_uniform: "Девушка в белой форме"
	ABY_focus_girl_with_white_uniform_desc: "Когда от Комитета контрмер в живых осталась только Серика, судьба Южного Кивотоса висела на волоске. Но Серика собрала тех, кто разделял ее волю, и в конце концов изменила эту жалкую судьбу.\n\nНаблюдая за мирными улицами уже объединенного Южного Кивотоса, Серика направляется в любимый кампус, чтобы рассказать членам Комитета, как у нее идут дела…"

	##################################################################################################################################################

	ABY_focus_army_1: "Распустить ополчение"
	ABY_focus_army_1_desc: "Сразу после Великого Перемещения вклад ополченцев и соседских патрулей, добровольно поднявшихся на защиту родины в хаосе, навсегда останется в истории. Однако теперь, когда государственная система стабилизируется и регулярная армия восстанавливается, ополчения с размытыми цепочками командования и разным уровнем подготовки могут стать фактором, снижающим эффективность военных операций. Мы должны поблагодарить их за службу и с честью распустить, либо интегрировать их в регулярную армию через строгий отбор. Современная война выигрывается не только пылким патриотизмом; только передовая подготовка и безупречная координация могут гарантировать победу. Эра любителей закончена."

	ABY_focus_army_2: "Приоритет: национальная оборона"
	ABY_focus_army_2_desc: "Холодная и неумолимая реальность такова, что наша национальная мощь и вооруженные силы недостаточны перед лицом потенциальных врагов, окружающих нас. В этих обстоятельствах необдуманное расширение фронта или принятие агрессивных военных действий приведут нас только к самоуничтожению. Мы должны укрепить ключевые точки территории и построить эшелонированные оборонительные линии на путях продвижения врага, заставляя его истекать кровью в стратегии на истощение. Наша цель — не территориальная экспансия, а выживание родины. Пусть враг разобьет свою голову о нашу стальную оборону и прольет свою кровь. Каждая капля нашей крови должна обмениваться на десять капель вражеской, и каждый камень этой земли станет для них непреодолимой горой."

	ABY_focus_army_3: "Приоритет: упреждающий удар"
	ABY_focus_army_3_desc: "Чисто оборонительной позицией нельзя захватить инициативу в войне. Лучшая защита — это настолько мощное нападение, что враг даже не осмелится попытаться. Прежде чем враг сконцентрирует свои силы и завершит свои линии снабжения, мы должны нанести удар по его сердцу в момент максимальной уязвимости. Создайте доктрину молниеносного упреждающего удара, концентрируя превосходящую мобильность и огневую мощь, чтобы застать врага врасплох. Только парализовав его командование и сломив его волю к борьбе, мы сможем, несмотря на наше неравенство, добиться победы. Только тот, кто читает поток поля боя и движется первым, может танцевать с богиней победы. Колебаться — значит проиграть."

	ABY_focus_army_4: "Внедрить тактические траншеи"
	ABY_focus_army_4_desc: "Траншейная война — отнюдь не пережиток прошлого. Мы должны объединить передовые оборонительные концепции, переданные из Кивотоса, с пересеченной географией нашей территории, чтобы построить органическую оборонительную сеть, а не просто рвы. Организуйте перекрестный огонь, способный прикрывать друг друга, и стройте прочные бункеры и подземные ходы, которые защитят наши силы от вражеской артиллерии и воздушных атак. Эти современные тактические траншеи станут болотом, замедляющим врага, и в то же время трамплином для контратаки. Сколько бы снарядов враг ни выпустил, мы сможем перевести дух под землей и подготовить смертельный удар. Это неподвижная стальная крепость."

	ABY_focus_army_5: "Создать систему централизованного командования"
	ABY_focus_army_5_desc: "Чтобы подразделения разного происхождения и происхождения двигались как единый организм, необходима сильная и единая система контроля. Создайте объединенное командование, охватывающее армию, ВВС и даже подразделения Ореола, и модернизируйте передовую сеть связи, чтобы приказы штаба быстро и точно доходили до последнего солдата на передовой. Множественность команд и неподчинение приказам — самый опасный враг: они напрямую ведут к поражению. Только когда все подразделения движутся с одной головой и одной волей, мы сможем раздавить врага. Подавить хаос и установить порядок — вот первый шаг к победе."

	ABY_focus_army_6: "Увеличить срок службы"
	ABY_focus_army_6_desc: "В кризисной ситуации, когда ощущается предчувствие войны, поспешное увольнение солдат было бы опасной авантюрой, создающей серьезный пробел в национальной обороне. Подготовка опытного солдата требует много времени; потерять его — лишь мгновение. Мы должны неизбежно продлить обязательную службу, чтобы сохранить как можно больше элитных войск с боевым опытом. Будут недовольство среди солдат и семей, но когда родина на краю пропасти, нет другого выбора, кроме как требовать индивидуальных жертв. Нам нужно больше винтовок… и больше рук, способных их использовать. Пот, который мы прольем сегодня, заменит кровь наших семей завтра."

	ABY_focus_army_7: "Выровнять поле боя"
	ABY_focus_army_7_desc: "Самый безопасный — и самый безжалостный — способ устранить все опасности на пути продвижения, будь то минные поля, нагромождения колючей проволоки или засады в траншеях, — это проекция подавляющей огневой мощи. Прежде чем пехота ступит на опасную местность, мобилизуйте всю доступную артиллерию и проведите безлимитную бомбардировку, физически выравнивая местность. Как если бы бог пахал землю гигантским плугом, мы должны взорвать оборону и ловушки, не оставляя следа. Когда дым рассеется, над перепаханными холмами земли останется только безопасный и ровный путь для нашего продвижения. Если есть препятствие, мы превращаем его в пыль и открываем путь. Таков наш путь."

	ABY_focus_army_8: "Наследие Великой войны"
	ABY_focus_army_8_desc: "Кровавые уроки Великой войны (Первой мировой) все еще актуальны. Обильное огневое воздействие на оборону врага и постоянное истощение, пока его людские и материальные ресурсы не иссякнут, вызовут у него кошмар. Даже если нас обвинят в пренебрежении жизнями, нет причин отказываться от уже проверенного уравнения победы. Позиция тотальной войны — включая артиллерийские дуэли, траншейную войну и даже применение отравляющего газа — внушит врагу ужас, что для победы мы не остановимся ни перед чем. Война — это не романтика: это самая жестокая реальность, и она существует для победы."

	ABY_focus_army_9: "Путь жизни"
	ABY_focus_army_9_desc: "Бесперебойное снабжение на фронте — это жизненная линия и артерия армии. Мы должны укрепить тыловые линии снабжения и резко улучшить транспортную систему, чтобы солдаты не оставались без боеприпасов и не голодали. Железная дорога важнее танков, а грузовики ценнее винтовок. Враг попытается перерезать наш путь снабжения, засылая спецназ или нанося удары с воздуха, но мы будем защищать этот 'путь жизни' любой ценой. Если логистика рухнет, армия рухнет. Помните: перо офицера снабжения может спасти больше солдат, чем клинок вражеского командира."

	ABY_focus_army_10: "Укрепить сплоченность подразделений"
	ABY_focus_army_10_desc: "То, что объединяет солдат разного происхождения, этносов и биографий в единую стальную армию, — это товарищество и сплоченность. Укрепляйте связи с помощью интенсивных совместных учений и морального воспитания, строя доверие, способное заставить их рисковать жизнью друг за друга. Знание того, что есть товарищ, которому можно доверить свою спину, дает больше храбрости, чем любое новейшее оружие. Армия, объединенная под одним именем — 'Федеральные силы Абидоса' — сможет преодолеть материальные различия и творить чудеса. Мы братья."

	ABY_focus_army_11: "Расширить логистическую сеть"
	ABY_focus_army_11_desc: "Чем глубже армия проникает на вражескую территорию, тем экспоненциально возрастает потребность в снабжении, и тем длиннее и уязвимее становятся линии снабжения. Мы должны расширить железнодорожную сеть, проложить дороги и установить полевые склады вдоль фронта, чтобы резко повысить нашу способность вести операции. Предел снабжения — это предел продвижения. Мы отодвинем этот предел дальше и шире, чтобы наши войска получали необходимое немедленно, где бы они ни находились. Непрерывный караван грузовиков будет двигателем, делающим возможным неуклонное продвижение."

	ABY_focus_army_12: "Железо и порох"
	ABY_focus_army_12_desc: "Спящий бог войны просыпается от едкого запаха железа и пороха. Снаряды, произведенные при мобилизации всех наших промышленных мощностей — от заводов Шкода до сталелитейных заводов Витковице — обрушатся на врага стальным дождем. Прячутся ли они в траншеях или зарываются в бункеры, наши гранаты их найдут. На этой земле не будет убежища. Только подавляющая артиллерийская мощь может полностью сокрушить волю к сопротивлению и принести победу: больше пушек, больше снарядов, более крупные взрывы. Это единственный язык, на котором мы будем говорить с врагом."

	ABY_focus_army_13: "Большая стратегия"
	ABY_focus_army_13_desc: "Победа в локальных сражениях не гарантирует победы в войне. Мы не должны опьяняться малыми победами: нужно читать всю партию, координируя в комплексе политику, дипломатию, экономику и военную мощь государства. Предсказывайте в масштабе движения врага и разрабатывайте тщательную большую стратегию, максимизирующую наши сильные стороны и компенсирующую слабые. Двигайте фигуры с видением того, кто смотрит на всю шахматную доску. Иногда потребуется смелое решение уступить мясо, чтобы взять кость. Война ведется не винтовками: она ведется умом."

	ABY_focus_army_14: "Массовый штурм"
	ABY_focus_army_14_desc: "Когда сложная тактика или умение недостаточны, нет более надежного и сокрушительного метода, чем разорвать фронт врага в лоб подавляющим превосходством войск. Поднимите моральный дух до предела и проводите одновременные и волновые штурмы по всему фронту. Перед натиском наших сил, наступающих с криками, враг дрогнет, в ужасе бросая позиции и бежать. Человеческая волна поглотит все. Будут жертвы, да, но это цена, которую мы должны заплатить за победу. В атаку!"

	ABY_focus_army_15: "Огневое превосходство"
	ABY_focus_army_15_desc: "Обеспечьте подавляющий и непрерывный огонь до такой степени, что вражеская пехота не осмелится высунуть голову из траншеи. Органически интегрируйте всю огневую мощь — стрелковое оружие, артиллерию, танковые пушки и авиационную поддержку — и обрушьте ее на ключевые точки. Сотрите любую форму жизни на цели и заставьте врага исчезнуть как пыль. На поле боя нет пощады: только огневая мощь есть истина, и большая огневая мощь — это большая истина. Мы не стремимся подчинить врага; мы стремимся его уничтожить."

	### Фокусы пехоты Ореола
	ABY_focus_halo_1: "Восстановить регулярную армию"
	ABY_focus_halo_1_desc: "Экспоненциальный рост числа студентов — это не просто увеличение населения: это означает, что военный потенциал федерации взлетает. Мы наберем студентов-добровольцев и создадим 'Командование Ореола' с собственной властью командования и персоналом в армии, начав формирование подлинных 'дивизий Ореола'. Студенты перестанут быть разрозненными партизанами или вспомогательными силами; под систематическим командованием, контролем и военной подготовкой они станут центральным стратегическим активом федеральной армии. Их мистерия, соединенная с военной дисциплиной, станет более мощным и острым клинком для защиты родины."

	ABY_focus_halo_2: "Исследовать мистическую пехоту"
	ABY_focus_halo_2_desc: "Студенты, несущие 'Мистерию', обладают сверхчеловеческой живучестью, которую трудно поразить обычным оружием, и огневой мощью, способной соперничать с целым взводом. Мы должны научно проанализировать их способности и превратить их в тактические данные, разрабатывая оптимизированные доктрины и организации. Мы не будем полагаться на 'сильных личностей': мы проверим их ценность как систематизированного 'стратегического оружия', способного перевернуть ход игры и достичь стратегических целей. Мистерия — не чудо; это сила, которую мы должны контролировать и использовать."

	ABY_focus_halo_3: "Долг верности"
	ABY_focus_halo_3_desc: "Студенты свободны и имеют сильный характер, но теперь мы должны привить им ответственность и чувство принадлежности как солдатам федерации. Нужно снова и снова напоминать им, что их особая сила принадлежит не только им: она была дана им, чтобы защищать эту страну и страдающих граждан. Путем интенсивного морального воспитания и изучения федеральной истории добейтесь, чтобы свет ореола сиял еще ярче как непоколебимая верность родине. Прежде всего, они студенты, но они также почетные солдаты Абидоса."

	ABY_focus_halo_4: "Доктрина активной обороны"
	ABY_focus_halo_4_desc: "Используя экстраординарные физические способности и рефлексы студентов, мы создадим активную оборону: не пассивное сопротивление в траншеях, а пресечение вражеской атаки в точке ее старта. При обнаружении признаков наступления немедленно маневрировать, чтобы сломать острие копья и контратаковать, превращая оборону в наступление. Эта мобильная оборона минимизирует наши потери. Не блокировать щитом, а сбить меч врага нашим мечом. Вот оборона, к которой мы стремимся."

	ABY_focus_halo_5: "Мистическая пехота новой эры"
	ABY_focus_halo_5_desc: "Мы не можем отказаться от человечности и превратиться в демонов ради победы. Мы полностью отменим неэтичные и бесчеловечные эксперименты с 'искусственным Ореолом', потребляющие жизнь субъекта, и официально примем технологию экзоскелетов, усиленных мистической энергией: 'Джаггернауты'. Хотя их производственная стоимость огромна, эти стальные доспехи одновременно продемонстрируют наше техническое превосходство и моральную легитимность, предлагая боевую мощь, сравнимую с мощью кивотосцев, без вреда для здоровья пользователя. Мы сражаемся, чтобы защищать жизнь, а не использовать ее как расходный материал."

	ABY_focus_halo_6: "Расширить регулярную армию"
	ABY_focus_halo_6_desc: "Мы должны расширить призыв на большее количество студентов и применить интенсивную подготовку, чтобы увеличить число дивизий пехоты Ореола. Выйдя за пределы небольшого спецназа, мы сформируем армию, достаточно большую, чтобы покрыть весь фронт и действовать как основная сила в крупномасштабных войнах. Чтобы количественный рост не снижал качество, мы сохраним строгие критерии отбора и стандартизированную программу обучения. Бесчисленный свет ореолов, покрывающий поле боя, принесет отчаяние врагу."

	ABY_focus_halo_7: "Внедрить технологию обмена данными"
	ABY_focus_halo_7_desc: "Чтобы выжать 100% потенциала из костюмов Джаггернаут, необходима органическая связь между пилотами. Внедрите систему обмена данными в реальном времени на основе технологий Миллениума, делясь информацией с датчиков каждого костюма, понимая поле боя в 3D и передавая это командованию. Это будет не набор машин: это будет легион стали, движущийся как одна нервная сеть. Обмен информацией — это выживание и победа."

	ABY_focus_halo_8: "Исследовать сухопутный авианосец поддержки"
	ABY_focus_halo_8_desc: "Костюмы Джаггернаут мощны, но требуют много ресурсов и объектов для обслуживания, зарядки и пополнения запасов. Для их эффективной поддержки мы разработаем огромный 'сухопутный авианосец поддержки', развертываемый вдоль фронта. Передвижная мастерская, зарядная станция и убежище для солдат: это наземное судно станет маяком, позволяющим подразделениям Джаггернаут действовать глубоко, не беспокоясь о снабжении. Как корабль, пересекающий пустыню, эта стальная крепость пройдет через пустошь, неся победу."

	ABY_focus_halo_9: "Штурмовые командиры"
	ABY_focus_halo_9_desc: "Мы отберем студентов с большой боевой мощью, харизмой и выдающимся тактическим видением, чтобы назначить их штурмовыми командирами. Они не будут руководить из безопасных бункеров в тылу: они будут дышать вместе с войсками на передовой, сжимая оружие и пробивая бреши. Их пример поднимет моральный дух до небес. Солдаты будут готовы отдать жизнь за лидера, который бросается в опасность впереди них. Герои рождаются в смутные времена и куются на полях сражений, омытых кровью."

	ABY_focus_halo_10: "Стражи Федерации"
	ABY_focus_halo_10_desc: "Студенты Абидоса больше не иностранцы и не гости. Они — самый прочный щит, защищающий федерацию, и самое острое копье, пронзающее сердце врага. Граждане доверяют им и уважают их; студенты используют свою силу ради безопасности и счастья народа. Эта связь и это доверие объединят нацию с силой, большей, чем любое физическое оружие. Мы — сообщество судьбы: мы защищаем друг друга."

	ABY_focus_halo_11: "Наземная оперативная группа"
	ABY_focus_halo_11_desc: "С Джаггернаутами в качестве ядра мы сформируем высокомобильную механизированную силу — 'Наземную оперативную группу' — со смешанной организацией из танков, бронемашин, самоходной артиллерии и другого. Когда Джаггернауты прорвут фронт, механизированная пехота и огневая поддержка расширят брешь и закрепят захваченную территорию. Этот орден стальных рыцарей станет федеральным молотом, который пробьет любую оборону и уничтожит тылы. Покажите идеальную гармонию скорости, огневой мощи и защиты."

	ABY_focus_halo_12: "Ядро федеральной армии"
	ABY_focus_halo_12_desc: "Пехота Ореола больше не является поддержкой: это ядро, ведущее оперативное планирование федеральной армии. Вся стратегия и тактика разрабатывается, чтобы максимизировать их возможности, а обычные силы переходят в поддержку и прикрытие флангов. Главный герой поля боя изменился. Наша победа зависит от их рук, их пушек… и их Мистерии. Если они потерпят неудачу, федерация потерпит неудачу."

	ABY_focus_halo_13: "Волна света"
	ABY_focus_halo_13_desc: "Сияющий свет бесчисленных ореолов, заполняющих фронт, для наших — маяк надежды; для врага — сигнал неминуемого уничтожения. Начните великое наступление 'Волна Света', сметая врага подавляющей огневой мощью, мистической силой и несгибаемой волей. Перед световой армией, наступающей как яростный прилив, силы тьмы исчезнут, не оставив следа. Ничто не может остановить это священное шествие. Вперед, до дня победы!"

	### Фокусы Военно-воздушных сил
	ABY_focus_air_1: "Восстановить Военно-воздушные силы"
	ABY_focus_air_1_desc: "Отремонтируйте взлетно-посадочные полосы, разрушенные бомбардировками, и найдите, очистите и отрегулируйте брошенные и покрытые пылью аппараты в углах ангаров. Армия, потерявшая небо, подобна птице со сломанными крыльями: только полсилы. Хотя сегодня у нас есть лишь несколько старых бипланов и учебных самолетов как слабое начало, мы снова поднимемся с силой в небо. Кто владеет воздухом, обладает глазами и ушами поля боя и правит войной. Чтобы защитить землю, мы должны сначала вернуть небо."

	ABY_focus_air_2: "Новая воздушная доктрина"
	ABY_focus_air_2_desc: "Мы не можем повторять устаревшие формы воздушного боя Великой войны. Мы должны установить новые, инновационные доктрины, соответствующие современной войне, органически сочетая мобильность вертолетов и огневую мощь самолетов с неподвижным крылом и выполняя непосредственную авиационную поддержку (CAS) в тесной координации с наземными силами. ВВС не просто сражаются сами по себе: они должны быть ключевым элементом, ведущим наземные операции к победе. Инновации в небе принесут победу на земле."

	ABY_focus_air_3: "Захватить истребители"
	ABY_focus_air_3_desc: "Современные реактивные истребители, перенесенные из Кивотоса, являются 'избыточной технологией', полностью превосходящей наше понимание и способность к копированию. Мы должны отчаянно искать и захватывать их на закрытых аэродромах или в секретных ангарах, разбросанных по оккупированным территориям. Даже если мы не сможем их производить из-за нехватки запчастей и трудностей обслуживания, рев, разрывающий небо, и эти стальные соколы, летящие на сверхзвуковой скорости, посеют непостижимый страх и отчаяние во враге."

	ABY_focus_air_4: "Армейская авиация"
	ABY_focus_air_4_desc: "Мы создадим ВВС под прямым командованием армии, которые будут немедленно поддерживать по приказу наземного командира, минуя сложные процедуры воздушного командования. Вертолеты и легкие штурмовики, летающие над фронтом, поражающие вражеские траншеи и прикрывающие продвижение, станут самым надежным зонтиком для пехоты. Авиация, мгновенно реагирующая на нужды местности, резко повысит нашу тактическую гибкость. Пехота и авиация должны сражаться как одно целое."

	ABY_focus_air_5: "Дух независимого рода войск"
	ABY_focus_air_5_desc: "ВВС не служанка армии и не просто поддержка. Мы должны развивать их гордость и идентичность как независимого рода войск, способного ставить и выполнять собственные стратегические цели. Стратегические бомбардировки тыла и завоевание превосходства в воздухе для блокирования вражеской деятельности — это смертоносные и исключительные сферы воздушной мощи. Хозяин неба — мы, и без чьего-либо вмешательства мы защитим небо родины."

	ABY_focus_air_6: "Артиллерия неба"
	ABY_focus_air_6_desc: "Высокоточное управляемое бомбометание и ракетные удары — это пушки, стреляющие с неба. Бейте дальше, выше и точнее, чем наземная артиллерия, ограниченная местностью. Даже логистические базы или центры управления в тылу, которые враг считает безопасными, находятся в пределах досягаемости наших бомб. Если артиллерия — бог поля боя, то авиация — царь богов, судящий сверху. Нет места, чтобы скрыться от дождя смерти, падающего с неба."

	ABY_focus_air_7: "Удар по земле"
	ABY_focus_air_7_desc: "Сконцентрируем использование штурмовиков, специализирующихся на уничтожении механизированных сил, танковых колонн и длинных логистических колонн. Выдерживая зенитный огонь с помощью прочной брони и превращая стальных монстров в металлолом с помощью пушек и противотанковых ракет, эти самолеты станут жнецами для врагов на земле. Какой бы толстой ни была броня танка, перед небесным соколом он не более чем беззащитная добыча."

	ABY_focus_air_8: "Собачья свалка"
	ABY_focus_air_8_desc: "Подготовьте пилотов высочайшего мастерства и доведите маневренность до предела, чтобы обеспечить решающее преимущество в ближнем воздушном бою (dogfight). В этих яростных виражах за хвостом врага и маневрах, бросающих вызов гравитации, мгновение, когда удается поймать противника в прицел и сбить, — это смысл существования и гордость пилота. Выигрывайте дуэли в небе и очищайте небо от вражеских самолетов, которые его загрязняют."

	ABY_focus_air_9: "Воздушная специализация"
	ABY_focus_air_9_desc: "Вместо многоцелевых самолетов, которые делают все посредственно, мы разработаем и развернем специализированные аппараты, оптимизированные для конкретных задач: истребители завоевания превосходства, истребители-бомбардировщики, разведчики и т.д. Самолеты, показывающие максимальную производительность в своей области, резко повысят процент успеха операций. Клинок, владеющий одной техникой до предела, — самый острый и смертоносный."

	ABY_focus_air_10: "Первобытный ужас"
	ABY_focus_air_10_desc: "Раздирающий рев, доносящийся с неба, ломает моральный дух и сеет панику еще до того, как упадут бомбы. Максимизируйте психологическую войну, установив специально разработанные сирены (например, Иерихонские трубы) на пикирующих бомбардировщиках. Первобытный, инстинктивный ужас смерти, падающей вертикально, превосходит даже физическое разрушение: это самое эффективное оружие. Враг побежит, только услышав этот звук."

	ABY_focus_air_11: "Убийца богов"
	ABY_focus_air_11_desc: "Если наземную артиллерию называют 'богом поля боя', то ВВС должны быть тем, кто убивает этого бога: 'убийцей богов'. Точно атакуйте и нейтрализуйте в качестве приоритетных целей артиллерийские позиции, реактивные системы залпового огня, контрбатарейные радары и другие ключевые активы. Когда вражеская огневая мощь будет заглушена, а его бог умрет, наши наземные силы смогут продвигаться, не опасаясь обстрела. Копье, убивающее богов, падает с неба."

	ABY_focus_air_12: "Второе поле боя"
	ABY_focus_air_12_desc: "Когда наземная война заходит в тупик и увязает в траншеях, выход есть в небе. Определим воздух не просто как пространство поддержки, а как второе основное поле боя, и изменим характер войны с помощью массированных воздушных операций. Воздушные десанты, широкомасштабные штурмы, стратегические бомбардировки: многомерные атаки с неба сделают вражескую оборону бесполезной. Если нельзя победить на земле, победим в воздухе."

	ABY_focus_air_13: "Стражи наибольшей высоты"
	ABY_focus_air_13_desc: "Высотные перехватчики, летающие у стратосферы, — это стражи самой высокой точки родины. Обеспечьте, чтобы ни один вражеский стратегический бомбардировщик или самолет-разведчик не смог сбросить бомбу на нашу территорию или шпионить за нашими секретами. Как бы высоко они ни летели, наши ракеты и истребители собьют их. Наше небо будет защищено как крепость, и под ним граждане будут спать спокойно. Мы — щит неба."

	### Фокусы Военно-морского флота
	ABY_focus_navy_1: "Обеспечить побережье"
	ABY_focus_navy_1_desc: "Долгое время мы были страной, запертой без выхода к морю, но сегодня открывается историческая возможность: путь к океану. Обустройте ценное побережье, которое так дорого нам досталось, и постройте современные порты и военно-морские базы, где могут швартоваться крупные суда, создав плацдарм для проекции военно-морской мощи. Страна без моря — тюрьма; отказаться от моря — значит отказаться от мира. Сегодня мы ломаем дверь этой тюрьмы и поднимаем якоря в большую синеву."

	ABY_focus_navy_2: "Поглотить судостроительные технологии"
	ABY_focus_navy_2_desc: "Наши судостроительные технологии еще ползают. Активно перенимайте опытных техников из портовых городов и традиционные знания судостроения исторической Истрии, быстро исследуя и разрабатывая собственную способность строить суда. Не стыдитесь подражать: подражание — мать творения. На его основе мы выкуем мощный флот, сделанный по нашей мерке. Когда-нибудь построенные нами корабору будут бороздить моря мира."

	ABY_focus_navy_3: "Океанский флот"
	ABY_focus_navy_3_desc: "Недостаточно довольствоваться прибрежными волнами. Постройте настоящий океанский флот, способный перерезать вражеские морские линии снабжения, наносить удары непосредственно по его территории и добираться туда, где есть национальные интересы. Море широко, и наши амбиции тоже широки. Заставьте наш флаг развеваться за горизонтом, и там, где пройдет наш флот, это море станет нашим морем."

	ABY_focus_navy_4: "Оборонительный флот"
	ABY_focus_navy_4_desc: "С нашими ограниченными ресурсами нереально управлять большим флотом, как великие державы. Вместо погони за мечтами давайте развивать 'оборонительный флот' — маленький, но эффективный, специализирующийся на береговой обороне и ближних операциях, сосредоточенный на срыве попыток высадки. Мины, береговая артиллерия и быстроходные катера: колючий, как еж, флот защитит наши воды. Войти, может быть, легко; выйти — не получится."

	ABY_focus_navy_5: "Создать оперативные группы"
	ABY_focus_navy_5_desc: "Мы создадим мобильные оперативные группы (Task Force), комбинируя эсминцы, крейсера, подводные лодки и вспомогательные суда в зависимости от задачи. Эти гибкие силы максимизируют оперативную эффективность и позволят активно реагировать на меняющуюся военно-морскую обстановку. Как стая волков над морем, обнаружьте цель, окружите ее организованно… и кусайте, не отпуская."

	ABY_focus_navy_6: "Владыки моря"
	ABY_focus_navy_6_desc: "История показывает, что тот, кто владеет морем, владеет миром и забирает богатство. Постройте мощный главный флот, чтобы полностью обеспечить контроль над ближними морями и контролировать торговые пути. Без нашего разрешения ни один вражеский грузовой корабль — даже рыба — не пересечет эти воды. Наше море будет морем мира… или могилой врага. Выбор за ними."

	ABY_focus_navy_7: "Доктрина новой эры"
	ABY_focus_navy_7_desc: "Между романтикой большой пушки и эффективностью авианосца мы должны найти оптимальную для себя доктрину. Исследуйте доктрины, ломающие шаблоны: тактику 'бей и беги' с ракетными катерами, асимметричную войну с подводными лодками и т.д. Тот, кто сбивает огромного динозавра, не всегда тираннозавр: это может быть стая быстрых и умных рапторов. Инновационной тактикой нейтрализуйте гигантские флоты врага."

	ABY_focus_navy_8: "Расширить прибрежный флот"
	ABY_focus_navy_8_desc: "Стройте многочисленные торпедные катера и сторожевые корветы, относительно дешевые и быстрые в производстве, чтобы сплести плотную сеть береговой обороны. Блокируйте в зародыше проникновение вражеских подводных лодок или спецназа и надежно защищайте наши морские пути. Хозяин мелкого моря — не линкор, а наши быстрые и маневренные катера. Используйте сложную береговую линию и острова, чтобы заманить врага… и уничтожить."

	ABY_focus_navy_9: "Линкоры и большие пушки"
	ABY_focus_navy_9_desc: "Гигантские пушки и броня, способная отразить любую атаку: вечная романтика моряка и символ национальной мощи. Продвигайте программу строительства суперлинкоров, способных захватить инициативу на море и всеять ужас. Удар залпа крупного калибра, пришедший из-за горизонта, нанесет непоправимый урон вражескому флоту и переломит чашу весов войны. Большая и красивая пушка всегда права."

	ABY_focus_navy_10: "Расширить морскую авиацию"
	ABY_focus_navy_10_desc: "Даже на море тот, кто владеет небом, побеждает. Массово расширяйте морскую авиацию, будь то с авианосцев или береговых баз. Торпеды самолетов-торпедоносцев и бомбы пикирующих бомбардировщиков, пробивающие зенитную оборону, станут самой смертоносной угрозой даже для самых больших линкоров. Не привязывайтесь к дальности пушек: бейте с более далекого расстояния и раньше, и топите врага."

	ABY_focus_navy_11: "Морские волки"
	ABY_focus_navy_11_desc: "Флот подводных лодок, бесшумно бороздящий глубины, — это невидимый ужас и постоянное психологическое давление. Посредством неограниченной подводной войны парализуйте морское снабжение врага и топите врасплох его неподготовленные капитальные корабли. В темной бездне мы готовим самый смертоносный удар. Когда враг будет плыть в уверенности… наша торпеда разорвет брюхо его корабля."

	ABY_focus_navy_12: "Стража морской обороны"
	ABY_focus_navy_12_desc: "Мы повысим флот до Стражи морской обороны: военизированной организации, посвященной защите территориальных вод и морского суверенитета. С системой наблюдения и быстрого реагирования, в мирное время она будет выполнять операции по борьбе с пиратством и спасательные; в военное — задачи национальной обороны. Как стражи мира на море, мы не допустим никакого незаконного проникновения."

	ABY_focus_navy_13: "Щит, защищающий родину"
	ABY_focus_navy_13_desc: "Военно-морской флот — это стальной щит, защищающий родину над морем. Сохранить нетронутыми наши прибрежные города и территорию от морских бомбардировок и высадок — самая благородная причина его существования. На линии, где разбиваются волны, будем мы, блокируя атаку всем телом. Если мы падем, родина будет разграблена: с этой решимостью не позволяйте ни одному вражескому кораблю ступить на землю."

	### Промышленные фокусы
	ABY_focus_industry_1: "Реактивировать промышленную зону"
	ABY_focus_industry_1_desc: "Разбудите снова остановленные станки промышленного района, который вместе с пригородами Абидоса был чудесным образом перенесен. Даже если это только часть целого, спящие технологии и производственный потенциал там огромны. Восстановите электроснабжение и задействуйте безработную рабочую силу, чтобы вернуть промышленный потенциал. Грохот фабрик, снова вращающихся с силой, и дым из труб — это сердцебиение национального восстановления: доказательство того, что наша Федерация Абидоса поднимается из руин."

	ABY_focus_industry_2: "Поддержать крупные корпорации"
	ABY_focus_industry_2_desc: "Для эффективного экономического роста под руководством государства мы предоставим смелые налоговые льготы и субсидии крупным компаниям, которые уже продемонстрировали способности и капитал. Используя их огромную финансовую мощь и передовые технологии, мы сможем быстро расширить промышленную базу, надеясь, что эти достижения прольются на малый бизнес и домохозяйства. Нужно растить гигантов, чтобы они несли большую ношу. Это время выбора и концентрации."

	ABY_focus_industry_3: "Сохранять баланс между тремя крупными компаниями"
	ABY_focus_industry_3_desc: "Сверхтехнологии Нефтис, подавляющая производственная мощность Шкоды и огромная финансовая мощь Ротшильда. Эти три гиганта — три столпа, поддерживающие нашу экономику. Правительство должно деликатно регулировать, чтобы власть не перекосилась в одну сторону и не нарушила баланс, и превратить их здоровую конкуренцию в двигатель национального развития. Если этот канатоходец — шаткий, но точный — увенчается успехом, мы получим экономическую синергию, более мощную, чем у любой другой нации."

	ABY_focus_industry_4: "Слить малые предприятия"
	ABY_focus_industry_4_desc: "Консолидируйте и объединяйте малые и хрупкие МСП, бессистемно proliferating, чтобы повысить эффективность управления и избежать ненужных дублирующих инвестиций. Продвигайте экономию масштаба, чтобы обеспечить конкурентоспособность на международном рынке и получить пространство для НИОКР и инвестиций в оборудование. Как ручьи, сливающиеся в большую реку, интегрированные и укрепленные компании создадут большую добавленную стоимость и укрепят позвоночник национальной экономики."

	ABY_focus_industry_5: "Расширить промышленный комплекс Богемии"
	ABY_focus_industry_5_desc: "Постройте в Богемии — традиционном промышленном центре и доме квалифицированных ремесленников — большой современный промышленный комплекс. Используйте ее прочную инфраструктуру и отличную рабочую силу, чтобы превратить регион в крупнейшую производственную базу Европы. Вместо богемских лесов поднимутся заводские трубы; дым, поднимающийся оттуда, будет символизировать неиссякаемое процветание и мощь нашей федерации."

	ABY_focus_industry_6: "Привлечь финансы Ротшильда"
	ABY_focus_industry_6_desc: "Война и послевоенное восстановление требуют невообразимых средств. Активно привлекайте глобальную финансовую сеть семьи Ротшильдов, императоров европейских финансов, чтобы укрепить недостающую государственную казну и повысить нашу внешнюю кредитоспособность. Нужно прочистить артериосклероз денег, чтобы гигант по имени экономика мог двигаться. Поставьте силу золота на нашу сторону, чтобы финансировать войну и ускорить рост."

	ABY_focus_industry_7: "Повысить минимальную заработную плату"
	ABY_focus_industry_7_desc: "Только когда жизнь рабочих стабилизируется и их покупательная способность возрастет, внутренний рынок оживет, а производительность улучшится. Приведите минимальную зарплату в соответствие с реальностью, чтобы гарантировать достойную жизнь и погасить социальное недовольство, вызванное неравенством. Сытый и хорошо живущий рабочий производит лучшее качество и проявляет большую лояльность к компании. Это не просто благосостояние: это инвестиция в экономический рост."

	ABY_focus_industry_8: "Выделять компании"
	ABY_focus_industry_8_desc: "Речь не об ослаблении крупных конгломератов путем принудительного разделения. Наоборот, это стратегия максимизации эффективности и специализации, создания профессиональных дочерних компаний, разделенных по сферам бизнеса, и законного поощрения диверсифицированной экспансии. Многочисленные и сильные ветви, расходящиеся от гигантского корня, повысят долю рынка в каждом секторе и, в конечном итоге, еще больше укрепят материнскую компанию и всю национальную экономику."

	ABY_focus_industry_9: "Развивать Австрию"
	ABY_focus_industry_9_desc: "Осуществите интенсивные инвестиции в Австрию — регион, сильно пострадавший от войны или относительно отсталый в развитии. Сочетайте обильную гидроэнергетику и минералы Альп с превосходными человеческими ресурсами Вены, чтобы обеспечить новый двигатель национального роста. Пришло время снова выковать чудо Дуная. Австрия перестанет быть периферией: она станет еще одной центральной осью федерации."

	ABY_focus_industry_10: "Вернуть промышленность Шкода"
	ABY_focus_industry_10_desc: "В эти смутные времена активы, оборудование и техники заводов Шкода были незаконно заняты или рассеяны другими силами. Решительно вернем их путем национализации. Мощность тяжелой промышленности и технология производства артиллерии Шкоды — это ядро и гордость нашей военной промышленности. Обнимите снова наше потерянное 'стальное сердце' и производите оружие для защиты родины."

	ABY_focus_industry_11: "Запретить детский труд"
	ABY_focus_industry_11_desc: "Даже в военное время существует минимальная черта, которую мы должны соблюдать как люди. Маленькие руки детей должны держать карандаши, а не маслянистые станки. Строго запретите законом детский труд и отправьте детей в школу, чтобы воспитать их как силу, которая будет поддерживать будущее нации. Это будет более ценная инвестиция, чем сиюминутная производительность, и продемонстрирует нашу моральную победу."

	ABY_focus_industry_12: "Кооперация в бизнес-исследованиях"
	ABY_focus_industry_12_desc: "Интегрируйте эксклюзивные технологии и секретные лаборатории компаний в крупные исследовательские проекты под руководством государства. С сотрудничеством промышленности-академии-науки сократите дублирующие инвестиции и ускорьте технологическое развитие, чтобы создать системы оружия и новые технологии, которые удивят мир. Деление и слияние знаний создает новую силу. Постройте структуру, где корпоративная выгода одновременно является национальной выгодой."

	ABY_focus_industry_13: "Расширить верфи Истрии"
	ABY_focus_industry_13_desc: "Резко расширьте и модернизируйте новейшим оборудованием старые верфи Истрии, наш единственный выход к морю. Стройте большие доки, способные производить более крупные линкоры и больше транспортов, закладывая прочную основу для наращивания военно-морской мощи. Маленькая верфь на Адриатике станет гигантской колыбелью, вынашивающей океанский флот. Мечта о господстве на море начинается здесь."

	ABY_focus_industry_14: "Внедрить передовые технологии переработки"
	ABY_focus_industry_14_desc: "Перенимайте передовую химию из Кивотоса или современные методы переработки развитых стран, чтобы максимизировать эффективность производства топлива. Технология, превращающая каждую каплю сырой нефти, без отходов, в высококачественный бензин и авиатопливо, позволит нашим механизированным силам и авиации действовать без остановок. Энергоэффективность — это национальная мощь и ключ к победе."

	ABY_focus_industry_15: "Производство транспортных судов"
	ABY_focus_industry_15_desc: "Постройте большой флот транспортов для стабильного импорта военных припасов из-за границы или быстрой переброски войск. Укрепите морскую логистическую мощь, расширяя торговый флот, который будет поддерживать линию жизни над морем, преодолевая угрозу вражеских подводных лодок. За броскими линкорами они молча несут груз: настоящие скрытые герои, поддерживающие войну."

	ABY_focus_industry_16: "Активировать подачу предложений рабочих"
	ABY_focus_industry_16_desc: "Проблемы и улучшения на производстве лучше знает тот, кто вращает станок, а не тот, кто сидит за столом. Реактивируйте комитеты по консультациям рабочих и управляющих и внедрите системы предложений, чтобы рабочие свободно вносили идеи и улучшали неэффективность процессов. Маленькая идея бдительного рабочего может кардинально изменить производительность всей фабрики."

	ABY_focus_industry_17: "Экономика корпоративных групп"
	ABY_focus_industry_17_desc: "Группируйте вертикально и горизонтально дочерние компании из схожих секторов, чтобы сформировать крупные бизнес-группы (картели/конгломераты), создавая синергию. Концентрация капитала, технологий и талантов позволит выполнять мегапроекты национального масштаба. Растите, чтобы обрести международную конкурентоспособность: в экономической экосистеме тоже применимо, что вместе выживают, а порознь умирают."

	ABY_focus_industry_18: "Индустриализировать горные районы"
	ABY_focus_industry_18_desc: "Стройте подземные фабрики и надежные защитные сооружения в глубоких горных районах, безопасных от стратегических бомбардировок или ядерных ударов. Промышленный пояс, использующий Альпы и Карпаты, естественные крепости, гарантирует, что даже в худшем сценарии войны — с опустошенной территорией — производство оружия не остановится. Даже если придется срезать горы и рыть туннели, мы должны защитить наши фабрики."

	ABY_focus_industry_19: "Поделиться технологиями Нефтис"
	ABY_focus_industry_19_desc: "Стимулируйте и поддерживайте, чтобы сверхтехнологии, монополизированные Группой Нефтис, распространялись на всю гражданскую промышленность. Когда передовые технологии Кивотоса прививаются к местному производству, мы достигнем скачков производительности и революций качества, превосходящих здравый смысл. Технология будущего изменит промышленность настоящего и превратит нас в технологическую державу."

	ABY_focus_industry_20: "Трехсменная работа"
	ABY_focus_industry_20_desc: "Чрезмерные рабочие дни накапливают усталость, снижают производительность и вызывают производственные аварии. Мы отменим жестокую систему двух смен и введем систему трех смен, гарантирующую '8 часов работы, 8 часов отдыха'. Улучшенная рабочая среда повысит моральный дух и, в долгосрочной перспективе, позволит поддерживать более стабильные, точные и высококачественные производственные линии. Фабрика, работающая 24 часа в сутки, не должна держаться на жертве рабочего, а на рациональной системе."

	ABY_focus_industry_21: "Монополия предприятия"
	ABY_focus_industry_21_desc: "В стратегических секторах, непосредственно влияющих на национальную безопасность или требующих огромных инвестиций, мы признаем монопольный статус ведущей компании. Избегайте растраты национальной мощи из-за чрезмерной внутренней конкуренции и, путем концентрированной поддержки, сформируйте национальную компанию-чемпиона, способную конкурировать на глобальном рынке. Иногда одна гениальная компания кормит десять тысяч граждан. Ради эффективности мы можем на время отложить равенство."

	ABY_focus_industry_22: "Сотрудничество НИОКР между тремя гигантами"
	ABY_focus_industry_22_desc: "Заставьте Нефтис, Ротшильда и Шкоду сломать свои заборы и взяться за руки в совместных исследовательских проектах. Сочетание технологий Кивотоса, информации и капитала еврейской финансовой мощи, а также чешского промышленного опыта даст инновационные результаты, превосходящие всякое воображение. Это не просто деловое сотрудничество: это великий скачок вперед, опережающий свое время, промышленная революция."

	### Фокусы развития ресурсов
	ABY_focus_building_1: "Восстановить инфраструктуру"
	ABY_focus_building_1_desc: "Отремонтируйте с максимальным приоритетом и быстротой дороги, железные дороги и мосты, разрушенные и перерезанные огнем войны, чтобы разблокировать логистический поток. Без гладкой транспортной сети ни ресурсы под землей, ни фабричные продукты, ни войска на фронте не смогут вовремя сдвинуться с места. Заново соединить закупоренные артерии страны и заставить кровь снова циркулировать — первый шаг любого восстановления. Кто открывает дороги, тот получает богатство."

	ABY_focus_building_2: "Сталь Богемии"
	ABY_focus_building_2_desc: "Разрабатывайте в крупном масштабе богатые залежи железа в Богемии с целью 100% самообеспечения сырьем для металлургии. Не завися от импорта, красные камни, добытые из наших недр, пройдут через доменную печь и превратятся в наши танки, корабли и небоскребы. Вырежьте кости земли, чтобы укрепить скелет государства. Железо — это национальная мощь."

	ABY_focus_building_3: "Сталелитейные заводы Моравия–Витковице"
	ABY_focus_building_3_desc: "Расширьте исторический сталелитейный завод в Витковице, знаменитый со времен Австро-Венгерской империи, и внедрите современное оборудование для производства стали. Поднимите выше огонь доменной печи и работайте 24 часа в сутки: с вытекающим расплавленным металлом мы построим империю стали. Это место — сердце нашей промышленности и горячий двигатель, кующий оружие, которое приведет войну к победе. Как неугасающая печь, наша страсть тоже не остынет."

	ABY_focus_building_4: "Разрабатывать редкие ресурсы"
	ABY_focus_building_4_desc: "Мы должны найти стратегические редкие ресурсы, незаменимые для передового оружия и самолетов: вольфрам, хром, алюминий и другие. Усильте точные геологические исследования по всей территории и откройте новые шахты, чтобы уменьшить зависимость от импорта и обеспечить ресурсную безопасность. Маленький блестящий камень может стать силой, пробивающей броню танка. Нам нужна одержимость найти даже то, что, кажется, не существует."

	ABY_focus_building_5: "Приоритезировать производство стали"
	ABY_focus_building_5_desc: "Сконцентрируйте все промышленные мощности и ресурсы государства на производстве стали как наивысшем приоритете. Сократите производство гражданских товаров и превратите заводы, даже автомобильные, в объекты поддержки металлургии: сосредоточьтесь только на стали для обороны и тяжелой промышленности. Сегодня нам не нужно масло для комфортной жизни; нам нужны пушки, чтобы остановить врага. Только сталь может защитить нас."

	ABY_focus_building_6: "Сталелитейный завод в Зальцбурге"
	ABY_focus_building_6_desc: "Постройте новый крупный сталелитейный завод в Зальцбурге (Австрия), чтобы рассредоточить и расширить сталелитейные мощности. Установите чистый и эффективный процесс, используя обильную гидроэнергетику Альп для снижения энергозатрат. Это преобразование даров природы — гор и рек — в твердую сталь. Достигните гармонии между природой и промышленностью."

	ABY_focus_building_7: "Сталь Судет"
	ABY_focus_building_7_desc: "Реабилитируйте закрытые шахты и сталелитейные заводы в Судетах, где расположена база Абидоса, и вновь запустите их. Постройте стабильную систему снабжения, чтобы сталь, произведенная в самом ближайшем месте, быстрее доходила до фабрик и на фронт. Сделайте наш задний двор самодостаточной стальной крепостью. Лампа светит хуже всего под собой: не пренебрегайте близлежащими ресурсами."

	ABY_focus_building_8: "Разрабатывать нефтяное месторождение Матцен"
	ABY_focus_building_8_desc: "Полностью разрабатывайте месторождение, найденное в Матцене (Австрия), чтобы обеспечить ценный нефтяной ресурс. Добывать своими руками «черное золото», движущее механизированные силы и авиацию, имеет решающее стратегическое значение. Капля нефти стоит капли крови. Добывайте кровь земли и впрыскивайте ее в механическое сердце нашей нации как топливо для победы."

	### Исследовательские фокусы
	ABY_focus_research_1: "Местное технологическое сотрудничество"
	ABY_focus_research_1_desc: "Сверхтехнологии Кивотоса — не все. Давайте уважать и сотрудничать с отточенной за столетия механической инженерией Чехии и Австрии, с ноу-хау местных инженеров. Когда знание обоих миров объединяется и восполняет недостатки друг друга, технологическая синергия умножается. Слияние — самый прямой путь к истинным инновациям. Мы возьмем лучшее из обоих миров."

	ABY_focus_research_2: "Военное использование дронов"
	ABY_focus_research_2_desc: "Мы разработаем собственные разведывательные дроны и дроны для мелких точных ударов, чтобы развернуть их на поле боя. Дроны, способные исследовать опасные зоны, куда солдат не может войти, и выполнять самоубийственные атаки с точностью, недоступной человеку, являются ключевой силой будущей войны. Маленькая, незаметная колибри станет глазом и ядовитым жалом, сбивающим гиганта. Технологический прогресс меняет форму войны."

	ABY_focus_research_3: "Обратная разработка базовых вертолетов"
	ABY_focus_research_3_desc: "Вертолетов, привезенных из Кивотоса, мало; мы не можем тратить их как расходный материал. Мы должны точно разобрать и проанализировать их, чтобы воссоздать базовый дизайн, который можно массово производить на местном промышленном уровне. Даже если мы не сможем полностью воспроизвести подавляющую производительность оригинала, бесчисленные винтокрылые машины, построенные нашими руками, принесут новый ветер на поле боя. Начните с подражания и двигайтесь к созиданию."

	ABY_focus_research_4: "Операции дронов для спецназа"
	ABY_focus_research_4_desc: "Мы оснастим элитные команды портативными малыми дронами, чтобы максимизировать их оперативные возможности. Видеть врага за стеной и обнаруживать ловушки за углом резко повысит их выживаемость и процент успеха миссий. Глаз, следящий за врагом из невидимости, ведет нас к победе. Информационное превосходство — ядро тактики малых подразделений."

	ABY_focus_research_5: "Принять вертолеты Кивотоса"
	ABY_focus_research_5_desc: "Мы обеспечим чертежи и ключевые детали оригинальных высокопроизводительных вертолетов, произведенных в Кивотосе, будь то от Группы Нефтис или из остатков побежденного Кайзера. Эти машины с мобильностью и вооружением, которые местная технология не может скопировать, станут ключом к господству в небе и уничтожению вражеских наземных сил. Даже если мы не понимаем технологию, если мы можем ее использовать, это лучшее оружие. Продемонстрируйте истинную силу сверхтехнологий."

	ABY_focus_research_6: "Улучшить снаряжение пехоты"
	ABY_focus_research_6_desc: "Модернизируем и облегчим индивидуальное снаряжение, решающее жизнь или смерть солдата: личное оружие, бронежилеты, средства связи и другое. Более легкое, более прочное и более мощное снаряжение снизит усталость и повысит эффективность боя. Маленькая разница в снаряжении отделяет жизнь от смерти и, в конечном счете, решает победу или поражение. Дайте нашим солдатам лучшее."

	ABY_focus_research_7: "Сформировать мобильные вертолетные подразделения"
	ABY_focus_research_7_desc: "Мы создадим силы воздушно-штурмового десанта на основе многочисленных транспортных вертолетов. Удар по вражескому тылу и захват ключевых точек врасплох, преодолевая горы и реки, — это цвет современной войны: 'кавалерия воздуха'. Как валькирии, спускающиеся с неба под музыку Вагнера, чтобы судить врага, вселяйте ужас там, где его меньше всего ждут."

	ABY_focus_research_8: "Расширить исследования технологий Кивотоса"
	ABY_focus_research_8_desc: "Мы будем глубоко исследовать передовые технологии Кивотоса — мистическую энергию, оптическое оружие, энергетические щиты — и пытаться их военное применение. Расшифруйте принципы, которые современная наука не может понять, и превратите их в оружие, чтобы получить сокрушительное технологическое превосходство. Технология, похожая на магию, станет нашей реальностью и поглотит наших врагов. Кто завладеет будущим первым, тот и победит."

	### Постоянные фокусы (Тотальная война)
	ABY_continuous_focus_political: "Тотальная война: усилить централизацию"
	ABY_continuous_focus_political_desc: "В военное время, когда на кону стоит выживание государства, требуется сильное и последовательное руководство. Временно сократите власть местных органов власти и парламента и сосредоточьте власть в центральном правительстве и военном кабинете, чтобы создать систему быстрого принятия решений. Эффективное выживание превыше демократических процедур. Одна голова и один приказ — единственное, что может подавить хаос и преодолеть кризис."

	ABY_continuous_focus_command: "Тотальная война: производство военного снаряжения"
	ABY_continuous_focus_command_desc: "Мы направим все доступные промышленные мощности на производство военной техники. Остановите производство товаров народного потребления и превратите гражданские фабрики в военные; ставьте количество выше контроля качества, чтобы безостановочно снабжать фронт оружием. Винтовка в руках солдата важнее. Качество важно, да, но сейчас нам нужен объем, чтобы раздавить врага."

	ABY_continuous_focus_mobilization: "Тотальная война: всеобщая мобилизация"
	ABY_continuous_focus_mobilization_desc: "Призовите всех, кто может держать оружие, без различия пола или возраста, чтобы расширить резерв. Перед лицом национального кризиса не может быть исключений. Не только солдаты на фронте: гражданские в тылу тоже потенциальные воины. Мы будем сражаться до последнего человека за родину. Весь народ — армия, и вся территория — крепость."

	ABY_continuous_focus_war: "Тотальная война: освободительная война"
	ABY_continuous_focus_war_desc: "Наша цель — не простая победа, а возвращение всего, что потеряно от рук врага. Полностью изгоните захватчика с нашей священной земли и не останавливайте продвижение, пока наши угнетенные соотечественники не достигнут истинного освобождения. Никаких компромиссов. Эта война — крестовый поход за нашу свободу и достоинство: только победа или смерть."

	### Начальная интеграция и политическая реформа
	BA_EU_focus_1: "Евро-Кивотосское сообщество"
	BA_EU_focus_1_desc: "На пепле хаоса и разрушений, оставленных Великим Перемещением, мы должны искать новый путь к выживанию. Старые границы и рухнувшие системы правления больше не могут сдерживать этот беспрецедентный катаклизм. Лидеры Европы и представители академий Кивотоса собираются и торжественно объявляют о создании 'Евро-Кивотосского сообщества', объединяющего судьбу обоих миров. Это выходит за рамки простого договора: это гигантский эксперимент, не имеющий исторических прецедентов, по построению новой цивилизации, где будут сосуществовать человечество и мистерия; единственный маяк надежды для выживания всех."

	BA_EU_focus_2: "Комиссия по выяснению истины"
	BA_EU_focus_2_desc: "Многочисленные трагедии, произошедшие во время столкновения и слияния двух миров — таинственные исчезновения и резни — до сих пор погребены во тьме. Мы должны запустить независимую комиссию, способную расследовать без запретных зон, чтобы раскопать всю правду. Если мы не успокоим души несправедливо погибших и не вытрем слезы их семей, мы никогда не покончим с эрой недоверия и не продвинемся к будущему примирения. Только смелость смотреть прямо на раны прошлого приносит истинное исцеление."

	BA_EU_focus_3: "Комиссия по суду над военными преступниками"
	BA_EU_focus_3_desc: "Те, кто воспользовался хаосом, чтобы уничтожать невинных гражданских и совершать преступления против человечности, не могут быть прощены. Мы учредим специальную комиссию по суду над военными преступниками, чтобы наказать не только остатки нацистов, но и любого преступника, который в неразберихе Великого Перемещения совершал массовые убийства и грабежи. Независимо от ранга или положения, любой, против кого есть доказательства, будет привлечен к суду; меч правосудия будет неумолим. Это первая декларация о закрытии эры варварства и открытии эры верховенства закона."

	BA_EU_focus_4: "Заочные суды"
	BA_EU_focus_4_desc: "Отсутствие обвиняемого не может стать индульгенцией. Даже если военные преступники бежали за границу или скрылись, сменив личность, они не избегут суда. Даже посредством заочных судов мы предадим гласности их вину перед миром с имеющимися доказательствами и свидетельствами и вынесем исторический приговор. Где бы они ни были, они будут жить, преследуемые вечным клеймом 'военный преступник'. Правосудие не должно затягиваться или останавливаться."

	BA_EU_focus_5: "Европейский саммит"
	BA_EU_focus_5_desc: "Мы созовем историческую конференцию, где соберутся главы государств и представители основных автономных академических округов, чтобы решить судьбу континента. Будут жаркие дебаты из-за сталкивающихся интересов и политических позиций, но мы должны двигаться к великой цели 'единой Европы' через диалог и компромисс. Этот форум запечатает прошлое разделения и спроектирует общее будущее; его решения станут краеугольным камнем нового порядка."

	BA_EU_focus_6: "Взаимное политическое сотрудничество"
	BA_EU_focus_6_desc: "Признавая различия в политических системах каждой страны и уникальное самоуправление академий Кивотоса, мы построим рамки тесного сотрудничества под общей целью выживания и процветания. Институционализируйте регулярные саммиты высокого уровня и программы технического обмена, чтобы увеличить взаимопонимание и построить доверие, уменьшая ненужные трения и недопонимание. Сотрудничество, расцветающее на уважении к различиям, является самым прочным."

	BA_EU_focus_7: "Организовать неформальные встречи"
	BA_EU_focus_7_desc: "Мы создадим неформальный канал диалога между лидерами для обсуждения деликатных и сложных вопросов, которые трудно решить официальными и протокольными путями. Непринужденные встречи и откровенные разговоры могут стать ключом к разблокировке кризиса и поиску реальных решений. Эти усилия по общению за кулисами станут смазкой, которая гибко движет большой союз."

	BA_EU_focus_8: "Сформировать транснациональный альянс партий"
	BA_EU_focus_8_desc: "Мы будем поощрять партии схожих идеологий к формированию альянсов, пересекающих границы, для обсуждения политики и обмена видением в общеевропейском масштабе, поверх узких интересов каждой страны. Это заложит основу для транснациональных политических сил в европейском парламенте, способных возглавить общую повестку дня. Альянс, объединенный ценностями и идеями — а не нацией — станет мощным двигателем политической интеграции."

	BA_EU_focus_9: "Организовать Европейский парламент"
	BA_EU_focus_9_desc: "Мы учредим 'Европейский парламент' как высший законодательный орган, представляющий политическую волю всех граждан и студентов Европы. Депутаты, избранные демократическими процедурами в каждой стране и автономном округе, будут обсуждать и утверждать законы союза. Этот демократический храм станет самым мощным оружием для обеспечения легитимности нашего сообщества: решать будущее голосами и дебатами, а не винтовками. Это высшая ценность, которую мы должны защищать."

	BA_EU_focus_10: "Организовать Европейский совет"
	BA_EU_focus_10_desc: "Мы создадим 'Европейский совет', состоящий из глав правительств государств-членов, для определения политического направления и стратегических приоритетов союза. Как высший орган принятия решений, он будет координировать сложные интересы и осуществлять быстрое и твердое руководство в кризисах. Нам как никогда нужна мудрость Совета, чтобы уважать суверенитет и при этом говорить одним голосом."

	BA_EU_focus_11: "Распределение мест"
	BA_EU_focus_11_desc: "Распределение мест в Европейском парламенте — деликатная и важнейшая задача, определяющая демократическую легитимность союза. Недостаточно просто пропорциональности населению: мы должны защищать интересы малых стран и балансировать политическое представительство между местными и кивотосцами. Установите справедливые и рациональные принципы распределения, которое никто не почувствует как исключение, строя систему представительной демократии, которую все могут принять."

	BA_EU_focus_12: "Предоставить наднациональные полномочия"
	BA_EU_focus_12_desc: "Чтобы союз функционировал как интегрированный орган с реальной властью, а не как простая номинальная конфедерация, государства должны передать часть своего суверенитета союзу. Передача решений в ключевых областях — дипломатия, оборона, валюта — будет болезненной, но неизбежной для большего процветания и надежной безопасности. Уступите малые части национального суверенитета, чтобы выковать великий европейский суверенитет."

	BA_EU_focus_13: "Общеевропейское право выдвижения кандидатур"
	BA_EU_focus_13_desc: "Мы гарантируем, что любой европейский гражданин может баллотироваться на выборах в Европейский парламент независимо от страны проживания. Этот новаторский шаг сломает барьер национальности и породит истинно общеевропейских политиков, представляющих общий интерес, а не выгоду одного государства. Политический климат, где судят по способностям и видению, ускорит интеграцию."

	BA_EU_focus_14: "Проводить регулярные встречи"
	BA_EU_focus_14_desc: "Мы сделаем регулярными сессии Парламента и Совета, чтобы построить стабильную и предсказуемую политическую систему. Регулярные встречи и дебаты облегчают общение, укрепляют сплоченность и гарантируют преемственность политики без колебаний. Управление по системе устраняет неопределенность и обеспечивает устойчивость союза."

	BA_EU_focus_15: "Общеевропейское избирательное право"
	BA_EU_focus_15_desc: "Мы предоставим всем европейским гражданам право голосовать по месту жительства, независимо от их национальности. Рабочие и мигранты, которые свободно перемещаются, должны иметь возможность участвовать в решениях, влияющих на их жизнь. Расширение избирательного права сделает корни демократии глубже и шире."

	BA_EU_focus_16: "Общеевропейские всеобщие выборы"
	BA_EU_focus_16_desc: "После долгой подготовки мы наконец проведем первые одновременные всеобщие выборы во всей Европе. Этот демократический праздник, с сотнями миллионов, идущих голосовать, провозгласит миру, что мы больше не набор разделенных наций, а 'граждане единой Европы'. Знание того, что наши представители, избранные нашими руками, будут решать будущее, принесет гордость и надежду."

	### Экономическая и трудовая реформа
	BA_EU_focus_17: "Подражать денежной системе Кивотоса"
	BA_EU_focus_17_desc: "Мы возьмем за образец передовую финансовую систему и сложное денежное управление Кивотоса, чтобы реформировать в корне европейскую экономику, опустошенную послевоенным временем. Принятие цифровых платежей, отслеживаемая прозрачность денежных потоков и эффективные методы денежно-кредитной политики вдохнут новую жизнь в старые и закупоренные финансовые вены Европы. Союз технологий и финансов выведет нашу экономику на новый уровень."

	BA_EU_focus_18: "Внедрить трудовое законодательство Кивотоса"
	BA_EU_focus_18_desc: "Вдохновляясь передовой трудовой этикой Кивотоса, которая ставит во главу угла права и автономию, мы реформируем в крупном масштабе архаичную рабочую среду Европы. Относиться к работнику как к личности, достойной уважения, укреплять права человека и благосостояние — необходимое условие для повышения производительности и достижения великого социального пакта. Продукция счастливого работника имеет лучшую конкурентоспособность."

	BA_EU_focus_19: "Центральный банк"
	BA_EU_focus_19_desc: "Мы учредим независимый 'Европейский центральный банк (ЕЦБ)' для проведения денежно-кредитной политики всего союза и надзора за финансовыми рынками. Поддержание стабильности цен, сокращение экономических разрывов и защита стоимости евро в кризисах: этот финансовый штаб станет последним бастионом европейской стабильности. Интеграция денежного суверенитета означает завершение экономической интеграции."

	BA_EU_focus_20: "Предложение Евро-ЕН"
	BA_EU_focus_20_desc: "Мы продвинем новую единую резервную валюту, 'Евро-ЕН', сочетающую огромный европейский экономический масштаб с подавляющими технологиями Кивотоса. Эта сильная и надежная валюта бросит вызов гегемонии доллара и перенаправит глобальные потоки капитала в Европу. Валюта — это не просто обмен: это символ национальной мощи. Евро-ЕН станет сигнальной ракетой, возвещающей о нашем возрождении."

	BA_EU_focus_21: "Европейское сообщество угля и стали"
	BA_EU_focus_21_desc: "Управляя сообща сталью и углем — незаменимыми стратегическими материалами — через наднациональный орган, мы заблокируем в корне возможность внутренних войн и заложим основу промышленного развития. Ресурсы, которые раньше толкали нас нацеливать друг на друга оружие, теперь будут общими активами для мира и процветания. Это не просто экономическое сотрудничество: это самая надежная страховка для прочного мира."

	BA_EU_focus_22: "Устранить тарифные барьеры"
	BA_EU_focus_22_desc: "Мы решительно отменим все тарифы и нетарифные барьеры, сдерживавшие внутреннюю торговлю и снижавшие эффективность, создав единый большой рынок. Свободное движение товаров повысит конкурентоспособность компаний и предложит потребителям более дешевые и разнообразные продукты. Интеграция рынка — самый верный путь к увеличению европейского пирога."

	BA_EU_focus_23: "Применить денежную реформу"
	BA_EU_focus_23_desc: "Мы упорядочим и отменим старые, сложные и неэффективные валюты, обесцененные инфляцией, и принудительно проведем переход к новой единой валюте. Будут первоначальная неразбериха и сопротивление, но единая денежная система снизит транзакционные издержки, стимулирует инвестиции и будет действовать как мощный клей, объединяющий европейскую экономику. Без боли, ломающей кость, новая кожа не вырастет."

	BA_EU_focus_24: "Совместное производство, совместное потребление"
	BA_EU_focus_24_desc: "Чтобы избежать дублирующих инвестиций и достичь экономии масштаба, мы построим разделение труда по отраслям. Каждая страна будет сосредоточена на том, что у нее лучше всего получается, производить оптимальное и делить результаты на едином рынке, увеличивая богатство всей Европы. С сотрудничеством вместо конкуренции и обменом вместо монополии мы выкуем более процветающее будущее."

	BA_EU_focus_25: "Открыть границы"
	BA_EU_focus_25_desc: "Наследуя и расширяя дух Шенгена, мы уберем все контрольно-пропускные пункты и пограничные барьеры между членами. Путешествовать, работать и учиться свободно без паспорта и визы станет одним из самых больших и ощутимых благ. Где исчезает физическая граница, там люди и идеи текут и создают инновации."

	BA_EU_focus_26: "Европейские финансы"
	BA_EU_focus_26_desc: "Мы построим большую единую финансовую сеть, соединяющую Лондон, Франкфурт, Париж и финансовые центры автономных округов, чтобы капитал тек беспрепятственно. Интегрированный европейский финансовый рынок предложит больше инвестиционных возможностей, даст платформу стартапам и будет действовать как мощный двигатель роста. Где циркулируют деньги, там рождается возможность."

	BA_EU_focus_27: "Сообщество развития ресурсов"
	BA_EU_focus_27_desc: "Чтобы обеспечить энергетическую независимость и уменьшить внешнюю зависимость, мы будем совместно продвигать развитие всех природных ресурсов континента. От нефти Северного моря до шахт редкоземельных элементов Востока, все ресурсы на суше и море будут систематически управляться как общее достояние союза, а не исключительная собственность одного государства. Избегайте 'оружизации' ресурсов и стройте стабильную цепочку поставок."

	BA_EU_focus_28: "Единая европейская экономика"
	BA_EU_focus_28_desc: "Мы наконец достигнем полного экономического союза с интегрированной налоговой, денежно-кредитной, торговой и промышленной политикой. С большим внутренним рынком, сильной покупательной способностью и передовыми технологиями Европа оставит позади свое маргинальное прошлое и снова станет осью мировой экономики. Наша экономическая мощь будет оказывать влияние, более сильное, чем любая военная сила."

	BA_EU_focus_29: "Счетная палата"
	BA_EU_focus_29_desc: "Мы учредим сильный и независимый орган аудита для наблюдения за тем, чтобы огромный бюджет союза исполнялся прозрачно и эффективно. Чтобы ни один евро налогов не был потрачен впустую или нецелевым образом; если будет обнаружено хищение, ответственность будет строгой. Только чистые финансы завоевывают доверие граждан и поддерживают легитимность союза."

	BA_EU_focus_30: "Распределение общего бюджета"
	BA_EU_focus_30_desc: "Мы введем мощный механизм фискального выравнивания: средства, внесенные богатыми странами, будут поддерживать отстающие регионы для исправления дисбалансов. Это не благотворительность, а инвестиции в сбалансированное развитие и континентальную сплоченность. Справедливое распределение, основанное на солидарности, является самой важной моральной опорой, поддерживающей союз."

	BA_EU_focus_31: "Бюджетный обзор"
	BA_EU_focus_31_desc: "Чтобы предотвратить долговые кризисы из-за фискального популизма или мягкого управления, союз будет предварительно проверять национальные бюджеты и сможет выдавать рекомендации по их корректировке. Фискальная дисциплина — это не подлежащий обсуждению принцип для общей стабильности: мы должны избежать того, чтобы провал одной страны распространялся как домино."

	BA_EU_focus_32: "Обмен ресурсами"
	BA_EU_focus_32_desc: "Мы создадим систему экстренного реагирования, которая будет приоритезировать обмен продовольствием, энергией и медикаментами между членами в кризисных ситуациях: война, стихийные бедствия, эпидемии. Мы — сообщество судьбы, которое делит не только радости, но и боль и опасности. В беде наша солидарность будет сиять ярче."

	BA_EU_focus_33: "Внедрить плановую экономику"
	BA_EU_focus_33_desc: "Для быстрого восстановления и ускоренной индустриализации мы сохраним рыночную экономику как основу, но временно внедрим элементы планирования в общеевропейском масштабе. Требуется активное и стратегическое государственное вмешательство для исправления провалов рынка, стимулирования ключевых отраслей и эффективного распределения ресурсов. Бывают моменты, когда видимая рука нужнее невидимой."

	BA_EU_focus_34: "Предоставить наднациональные полномочия аудита"
	BA_EU_focus_34_desc: "Мы предоставим органам аудита союза право напрямую проверять государственные учреждения стран и компании, получающие поддержку союза. Тотальные аудиты без границ и убежищ сломают цепи коррупции и повысят административную прозрачность. Где есть коррупция, там не расцветает интеграция."

	BA_EU_focus_35: "Расширить промышленные зоны"
	BA_EU_focus_35_desc: "Мы создадим крупные транснациональные промышленные комплексы на границах и в отстающих регионах, чтобы построить успешную модель экономического сотрудничества. Фабрики, где рабочие и техники разных национальностей потеют вместе, будут символизировать не только экономическую выгоду, но и примирение и интеграцию. Кто работает вместе, тот не нацелит друг на друга винтовку."

	BA_EU_focus_36: "Совместный план развития"
	BA_EU_focus_36_desc: "Мы разработаем совместный долгосрочный план развития относительно отсталых регионов Востока и Юга, чтобы повысить уровень инфраструктуры по всей Европе. Конечная цель: чтобы любой гражданин, где бы он ни жил, пользовался одинаковыми возможностями и высоким качеством жизни. Процветание не должно быть монополией нескольких стран."

	BA_EU_focus_37: "Отправить инспекторов"
	BA_EU_focus_37_desc: "Мы назначим постоянных инспекторов союза на ключевые проекты, финансируемые из общего бюджета, и в национальные административные органы. Недостаточно бумажных отчетов: они услышат голос с мест и немедленно обнаружат неэффективность или коррупцию для исправления. Когда перед глазами наблюдатель, управление становится честнее."

	BA_EU_focus_38: "Европейское экономическое пространство"
	BA_EU_focus_38_desc: "Мы сформируем расширенный большой экономический блок, охватывающий, помимо членов, соседние страны Средиземноморья, Северной Африки и Ближнего Востока. Посредством соглашений о свободной торговле и технологических альянсов мы расширим экономическую территорию Европы и увеличим геополитическое влияние. Наш рынок не заперт на континенте: он открыт миру."

	BA_EU_focus_39: "Трудовое управление"
	BA_EU_focus_39_desc: "Мы создадим 'Европейское трудовое управление' для координации политики занятости и управления интегрированным рынком труда. Защита прав трансграничных работников, решение безработицы и создание качественных рабочих мест для промышленности будущего являются приоритетными задачами. Труд — не товар; работник — главный герой экономики."

	BA_EU_focus_40: "Промышленная механизация"
	BA_EU_focus_40_desc: "Мы активно внедрим передовую автоматизацию и робототехнику Кивотоса в промышленность, чтобы резко повысить производительность фабрик. Повторяющаяся, опасная и тяжелая работа перейдет к машинам; человек сосредоточится на более творческих и ценных задачах. Производительность через технологические инновации — это материальная основа для сокращения рабочих часов и улучшения качества жизни."

	BA_EU_focus_41: "8-часовой рабочий день"
	BA_EU_focus_41_desc: "Чтобы гарантировать здоровье и достойную жизнь, мы установим законом и будем строго применять исторический принцип '8 часов работы, 8 часов отдыха и 8 часов сна'. Смерть от перегрузки, плод отношения к человеку как к расходному материалу ради прибыли, должна исчезнуть как пережиток варварства. Жизнь с отдыхом создает большую эффективность."

	BA_EU_focus_42: "Бюро занятости и труда"
	BA_EU_focus_42_desc: "Мы реформируем и расширим бюро занятости и труда для поддержки обучения, реинтеграции и справедливого найма без дискриминации. Мы создадим общество, где тот, кто хочет работать, найдет место, соответствующее его способностям, и где даже после падения будет реальная возможность встать."

	BA_EU_focus_43: "Нормы промышленной безопасности"
	BA_EU_focus_43_desc: "Мы радикально улучшим опасную рабочую среду и продиктуем строгие нормы промышленной безопасности с суровыми санкциями, чтобы свести несчастные случаи к нулю. Жизнь и безопасность работника — абсолютная ценность превыше любой корпоративной прибыли или экономического результата. В небезопасном месте не должна выполняться никакая работа."

	BA_EU_focus_44: "5-дневная рабочая неделя"
	BA_EU_focus_44_desc: "Мы внедрим пятидневную рабочую неделю во всех секторах, чтобы гарантировать время для досуга и семьи. Баланс работы и жизни не только повышает производительность, но и стимулирует индустрию досуга и внутреннее потребление, создавая добродетельный круг. Отдых тоже движет экономику."

	BA_EU_focus_45: "Поддерживать трудовые переговоры"
	BA_EU_focus_45_desc: "Мы будем управлять профессиональным органом посредничества для разрешения трудовых конфликтов через продуктивный диалог и культуру сосуществования. Вместо обращения к забастовкам и локаутам мы будем искать рациональные соглашения через разговор и взаимные уступки. Стабильность трудовых отношений необходима для устойчивого экономического развития."

	BA_EU_focus_46: "Пособие по травме"
	BA_EU_focus_46_desc: "Мы существенно усилим социальную защиту, покрывающую лечение и содержание для работников, пострадавших или заболевших по причине работы. Государство и компании должны быть надежной опорой для промышленных рабочих, поддерживая их до тех пор, пока они не восстановят здоровье и не вернутся к работе. Тот, кто движет промышленностью, не может быть брошен."

	BA_EU_focus_47: "Легализовать профсоюзы"
	BA_EU_focus_47_desc: "Мы гарантируем как конституционное право свободу ассоциации, коллективных переговоров и коллективных действий для всех работников. Здоровые и демократические профсоюзы — ключевые партнеры: они ограничивают злоупотребления работодателей, защищают трудовые права и помогают реализовать социальную справедливость. Общество без угнетенных работников — единственное по-настоящему свободное общество."

	BA_EU_focus_48: "Передовое трудовое законодательство"
	BA_EU_focus_48_desc: "Мы примем 'Европейскую трудовую хартию', самый высокий в мире стандарт защиты работников, сочетающий лучшее из Европы и Кивотоса. Европа станет не только местом, благоприятным для бизнеса, но континентом, где работник наиболее уважаем и счастлив. Наши трудовые стандарты станут новым глобальным эталоном."

	### Социальная и культурная интеграция
	BA_EU_focus_49: "Конференция по юрисдикции федеральных округов"
	BA_EU_focus_49_desc: "Мы будем созывать регулярные встречи для эффективного управления прямыми федеральными округами и автономиями, разбросанными по Европе, а также для посредничества в конфликтах между центром и периферией и между регионами. Этот форум будет не односторонним навязыванием центрального правительства, а пространством для непрерывного общения и достижения консенсуса с местными органами власти для устранения административных слепых зон и реализации низовой демократии."

	BA_EU_focus_50: "Восстановление культурного наследия"
	BA_EU_focus_50_desc: "Мы будем масштабно продвигать восстановление культурного наследия, разрушенного войной, и возвращение на место происхождения разграбленных и рассеянных предметов. Эти ценности — не просто древние объекты: это корни, поддерживающие европейскую идентичность и гордость. Восстанавливать камень за камнем — значит восстанавливать наше достоинство."

	BA_EU_focus_51: "Признать культурную специфику"
	BA_EU_focus_51_desc: "Вместо принудительной и унифицированной интеграции мы будем уважать и поощрять культурные традиции и собственные языки каждого народа, региона и автономного академического округа. Разнообразие — не семя разделения, а пища, обогащающая и делающая более красочной европейскую культуру. Когда мы признаем и наслаждаемся нашими различиями, мы можем реализовать подлинный европейский дух 'единства в разнообразии'."

	BA_EU_focus_52: "Корректировка границ"
	BA_EU_focus_52_desc: "Мы мирно скорректируем нерациональные границы, начертанные как наследие империализма или в результате войн, учитывая исторический контекст и текущее этническое распределение. Мы должны положить конец трагедиям, созданным линиями, насильно нарисованными на карте, и заложить основы прочного мира, установив разумные и естественные пределы в соответствии с демократической волей жителей региона."

	BA_EU_focus_53: "Конфискация боеприпасов"
	BA_EU_focus_53_desc: "После Великого Перемещения огромное количество бесконтрольных боеприпасов, разбросанных среди гражданского населения, — это бомба замедленного действия. Чтобы предотвратить случайные вооруженные столкновения и преступления, мы должны применить решительные меры: принудительно конфисковать излишки боеприпасов в частных руках и уничтожить их. Оружие без пуль — не более чем дубина. Сотрите запах пороха, пропитавший общество, и наполните воздух миром."

	BA_EU_focus_54: "Связать подпольные сети"
	BA_EU_focus_54_desc: "Мы выведем на свет сети сопротивления и группы самообороны, которые действовали скрыто в глубине во время оккупации, интегрируя их как легальные гражданские организации или как силы резерва. Непоколебимый патриотизм и прочная сплоченность, которые они продемонстрировали в темные времена, — это ценная энергия для национального восстановления. Тем, кто сражался в тени, мы теперь должны дать награды и социальную роль."

	BA_EU_focus_55: "Усилить публичную власть"
	BA_EU_focus_55_desc: "Чтобы восстановить правовой порядок, разрушенный войной и хаосом, мы резко расширим штат полиции и внедрим передовое оборудование и научные криминалистические методы для модернизации системы безопасности. Государство, которое не может защитить своих граждан от преступлений и насилия, не имеет смысла существовать. Восстановление ослабленной власти государственных сил через справедливое применение закона — первый шаг к возвращению безопасной повседневной жизни."

	BA_EU_focus_56: "Пособие на переселение"
	BA_EU_focus_56_desc: "Мы предоставим всестороннее пособие на обустройство — включая жилье, содержание и расходы на профессиональную подготовку — чтобы беженцы и перемещенные лица, потерявшие дом из-за войны, могли пустить корни надежды на незнакомых землях. Помочь им встать как полноправным членам общества, а не как маргинализированным чужакам, является гуманитарным долгом государства и самой надежной инвестицией в социальную интеграцию."

	BA_EU_focus_57: "Гарантировать права прохода через участки"
	BA_EU_focus_57_desc: "Даже в зонах, где сохраняются споры или районах, контролируемых по военной необходимости, мы будем выдавать специальные пропуска, гарантирующие безопасное и свободное передвижение гражданских лиц. Повседневная жизнь — воссоединение с разбросанной семьей и поддержание средств к существованию — это право человека, которое должно быть максимально защищено даже в чрезвычайной ситуации. Даже если дороги контролируются, поток людей не должен прерываться."

	BA_EU_focus_58: "Проводить свободные выборы внутри академий"
	BA_EU_focus_58_desc: "Мы будем продвигать и контролировать, чтобы даже в академических автономных округах Кивотоса, где доминируют несколько сильных, студенческие лидеры избирались прозрачными и демократическими процедурами. Принципы демократии, а не закон сильнейшего, должны применяться без исключения. Опыт самоуправления через представителей, избранных самими студентами, сформирует их как будущих демократических граждан."

	BA_EU_focus_59: "Свободное передвижение"
	BA_EU_focus_59_desc: "Мы полностью устраним все виды ограничений и барьеров, препятствовавших движению людей и товаров внутри европейского континента. Свобода путешествовать — фундаментальное право, и то, что люди из разных регионов свободно перемещаются, обмениваются культурой и понимают друг друга, — самый быстрый путь к реальной интеграции. С открытыми дорогами Европа станет единой."

	BA_EU_focus_60: "Наднациональные автономные округа"
	BA_EU_focus_60_desc: "Мы создадим и будем управлять специальными автономными округами, не принадлежащими суверенитету какого-либо конкретного государства, а находящимися под прямым управлением Европейского Союза. Они станут лабораториями наднационального управления, где будут сосуществовать множество этносов и культур, и где мистерия Кивотоса сольется с европейской традицией. Как образцовый дом, предвосхищающий будущее Европы, эти округа станут символом инноваций и сосуществования."

	BA_EU_focus_61: "Создать федеральный округ"
	BA_EU_focus_61_desc: "Мы создадим большой федеральный административный округ, концентрирующий законодательную, исполнительную и судебную власть Европейского Союза, функционирующий как столица. Брюссель, Страсбург или третий город возродятся как новое сердце Европы, действуя как центральная нервная сеть, вливающая жизненную силу во весь континент. Это будет не просто город: это будет место, где европейская мечта становится реальностью."

	BA_EU_focus_62: "Комиссия по культурной дисциплине"
	BA_EU_focus_62_desc: "Мы учредим независимую комиссию для наблюдения и регулирования культурных столкновений, языка вражды и дискриминационных действий, которые могут возникнуть во время быстрой интеграции. Мы будем уважать свободу слова, но не потерпим действий, попирающих достоинство других. Это орган общественного консенсуса для утверждения культуры терпимости и уважения. Мы должны построить язык сосуществования вне ненависти."

	BA_EU_focus_63: "Добавить положения о самообороне"
	BA_EU_focus_63_desc: "В неотложных ситуациях, когда публичная власть не может прибыть вовремя, мы разработаем закон, значительно расширяющий признаваемый объем самообороны, чтобы граждане могли защищать себя, свою семью и своих соседей от преступлений или угроз жизни. Государство обязано защищать безопасность, но также должно уважать и гарантировать естественное право каждого гражданина на самозащиту."

	BA_EU_focus_64: "Формировать автономные кабинеты"
	BA_EU_focus_64_desc: "Для администрации, адаптированной к особенностям каждого федерального и автономного округа, мы позволим местному населению формировать собственные кабинеты, избираемые ими самими. Децентрализация — чтобы те, кто лучше всего знает местную реальность, решали свои проблемы — вместо единообразного контроля центрального правительства станет удобрением, укрепляющим корни демократии."

### Общественная безопасность и военная интеграция
 BA_EU_focus_65: "Обязательная регистрация оружия"
	BA_EU_focus_65_desc: "Мы сделаем обязательной регистрацию всего огнестрельного оружия, находящегося в собственности граждан, чтобы устранить слепые зоны в контроле над вооружениями и усилить ответственность владельца. Точное знание того, у кого какое оружие и где оно находится, является самой элементарной основой общественного порядка. Незарегистрированное 'оружие-призрак' служит только преступности. Только прозрачное управление может предотвратить несчастные случаи и преступления с оружием."

	BA_EU_focus_66: "Реорганизация зон"
	BA_EU_focus_66_desc: "Не привязываясь к старым административным делениям, мы научно проанализируем реальную потребность в безопасности, демографические изменения и распределение зон риска, чтобы рационально пересмотреть юрисдикции полиции. Эффективное распределение персонала ускорит реакцию на преступления и повысит качество обслуживания, увеличивая удовлетворенность граждан. Если преступность не знает границ, то и ответ полиции не должен иметь пробелов."

	BA_EU_focus_67: "Запрет автоматического оружия"
	BA_EU_focus_67_desc: "Мы полностью запретим гражданское владение военным автоматическим оружием — автоматическими винтовками, пистолетами-пулеметами, пулеметами — и немедленно конфискуем его. Мы больше не можем позволить оружию, созданному для поля боя, циркулировать на мирных улицах. Чрезмерное вооружение, угрожающее безопасности, — это не свобода: это вседозволенность и источник террора."

	BA_EU_focus_68: "Упрощение процедур контроля"
	BA_EU_focus_68_desc: "Мы сократим чрезмерные проверки, которые пугают и задерживают граждан, и внедрим распознавание лиц и сканирующее оборудование, чтобы одновременно повысить скорость и точность фильтров безопасности. Мы должны построить интеллектуальную систему, которая минимизирует повседневные неудобства и при этом эффективно блокирует передвижение террористов и преступников. Свобода и безопасность могут сосуществовать."

	BA_EU_focus_69: "Улучшение нелетальных боеприпасов"
	BA_EU_focus_69_desc: "Чтобы уменьшить ненужные жертвы при контроле беспорядков или задержании подозреваемых, мы разработаем и распространим высокоэффективное нелетальное снаряжение для принуждения: резиновые пули, тазеры, акустические пушки и другое. Государственные силы существуют для защиты граждан, а не для их ранения или убийства. Обезвредить преступника, уважая жизнь, — это стандарт передовой безопасности."

	BA_EU_focus_70: "Государственные оружейные магазины"
	BA_EU_focus_70_desc: "Мы упраздним частные оружейные магазины, продающие оружие бесконтрольно ради прибыли, и разрешим ограниченные покупки только через государственные магазины, при строгой оценке. Прозрачно контролируя весь процесс распределения, мы заблокируем в корне попадание оружия в руки преступников или лиц с психическими расстройствами. Это решительная мера."

	BA_EU_focus_71: "Компенсация оружейной промышленности"
	BA_EU_focus_71_desc: "Мы компенсируем военным компаниям, которые понесут экономический ущерб из-за строгой политики контроля над оружием, поддерживая конверсию производства или приоритетно заключая военные контракты. Мы уменьшим сопротивление сектора и перенаправим его технологические мощности и инфраструктуру на общественные цели: укрепление обороны. Стратегический стимул."

	BA_EU_focus_72: "Умное оружие"
	BA_EU_focus_72_desc: "Мы сделаем обязательной технологию умного оружия для всего нового оружия: оно сможет стрелять только у авторизованных пользователей с зарегистрированной биометрией (отпечаток пальца, вены и т.д.). Это предотвратит использование украденного или утерянного оружия преступниками, а также случайные выстрелы из-за детского любопытства. Это будет отличным примером того, как технологии защищают безопасность."

	BA_EU_focus_73: "Зоны, свободные от оружия"
	BA_EU_focus_73_desc: "Мы определим школы, больницы, государственные учреждения, храмы и другие людные места как 'Gun-Free Zone', строго запрещая вход с оружием по любой причине. Увеличение таких безопасных зон, чтобы люди жили без страха перестрелок, является базовым требованием цивилизованного общества."

	BA_EU_focus_74: "50-летний план регулирования оружия"
	BA_EU_focus_74_desc: "Невозможно за короткое время устранить оружие, распространявшееся десятилетиями. Мы установим долгосрочный, поэтапный, рассчитанный на полвека план по сокращению гражданского владения и трансформации оружейной культуры, с конечной целью 'мирного общества без оружия'. Начинает наше поколение, завершит следующее: это изменит будущее Европы."

	BA_EU_focus_75: "Вооруженные силы Европейского Союза"
	BA_EU_focus_75_desc: "Мы объединим национальные армии для создания 'Вооруженных сил Европейского Союза (EAF)' с единым командованием. Это независимая система обороны, заменяющая НАТО и разрывающая зависимость от США, защищая европейский суверенитет и территорию от внешних угроз. Под единым флагом европейская армия будет твердым щитом для мира во всем мире."

	BA_EU_focus_76: "Европейская пограничная охрана"
	BA_EU_focus_76_desc: "Для противодействия беженцам, контрабанде и международному терроризму мы организуем профессиональную 'Европейскую пограничную охрану', которая будет совместно защищать внешние границы ЕС. Железный контроль на суше и море защитит ворота Европы и станет предварительным условием для гарантии свободного внутреннего передвижения. Прочный забор делает дом безопасным."

	BA_EU_focus_77: "Европейская береговая охрана"
	BA_EU_focus_77_desc: "Мы будем управлять интегрированной 'Европейской береговой охраной' для наблюдения за обширными территориальными водами и исключительной экономической зоной, проведения морских спасательных операций и пресечения незаконного рыболовства. Море — это ресурс и путь жизни. Те, кто сражается с волнами, чтобы утвердить закон моря, сохранят наши воды в мире и изобилии."

	BA_EU_focus_78: "Европейская противовоздушная оборона"
	BA_EU_focus_78_desc: "Мы построим паутинообразную сеть радаров и систему зенитных ракет, покрывающую всю Европу, и создадим объединенное командование ПВО. Ни один вражеский самолет или ракета не смогут нарушить наше воздушное пространство. Глаза и кулаки, 24 часа следящие за небом, подарят гражданам спокойный сон."

	BA_EU_focus_79: "Интеграция легионов Ореола"
	BA_EU_focus_79_desc: "Мы объединим ранее разрозненные и отдельно управляемые силы, несущие Ореол, под единым 'Командованием специальных операций' в составе EAF. Их сверхчеловеческая боевая мощь, результат мистических способностей, будет выполнять миссии, которые обычные силы не могут решить: они станут самым сильным копьем и козырем в рукаве, защищающим Европу. По отдельности они — риск; вместе — непобедимы."

	BA_EU_focus_80: "Закон о регистрации ЧВК"
	BA_EU_focus_80_desc: "Мы включим в правовое поле частные военные компании (ЧВК), действовавшие бесконтрольно в хаосе войны. Строгими требованиями регистрации и прозрачным надзором мы перестанем относиться к ним как к простым наемникам за деньгами и превратим их в надежных партнеров, дополняющих национальную безопасность. Власть должна сопровождаться ответственностью."

	BA_EU_focus_81: "Объединенное командование Ореола"
	BA_EU_focus_81_desc: "Мы создадим специальное командование, которое глубоко понимает особенности войск Кивотоса и местных войск и органически объединяет их для эффективной операции. Эти новые гибридные силы, где гармонизированы мистическая сила и современная тактика, продемонстрируют беспрецедентные возможности, превосходящие военный здравый смысл. Это эволюция войны."

	BA_EU_focus_82: "Закон о чрезвычайной мобилизации ЧВК"
	BA_EU_focus_82_desc: "Мы создадим правовую основу для того, чтобы в чрезвычайной ситуации или при массовом вторжении государство могло немедленно реквизировать ресурсы и персонал зарегистрированных ЧВК и развернуть их вместе с регулярными силами. Когда на кону стоит выживание, мы должны мобилизовать все доступные силы, чтобы остановить врага. Выживание важнее контракта."

	BA_EU_focus_83: "Командование Европейской армии"
	BA_EU_focus_83_desc: "Мы учредим 'Верховное командование Европейской армии' для руководства всеми наземными операциями на континенте. Мы будем назначать командиров по способностям и опыту, независимо от национальности, строя поистине союзную армию, которая сражается за победу всего союза, а не за интересы происхождения. Мы говорим на разных языках, но приказ один."

	BA_EU_focus_84: "Европейское военно-морское командование"
	BA_EU_focus_84_desc: "Мы создадим 'Европейское военно-морское командование' для защиты всех европейских морей: Средиземного, Атлантического, Северного и Балтийского. Интегрируя национальные флоты, мы расширим дальность и морской контроль, воплощая исторический урок: кто владеет морем, тот движет миром. Наш флот будет океанской миротворческой силой."

	BA_EU_focus_85: "Управление Европейских ВВС"
	BA_EU_focus_85_desc: "Мы учредим 'Управление Европейских ВВС' для руководства обороной воздушного пространства, авиационными операциями и, в будущем, освоением космоса. С интегрированным управлением передовыми истребителями и спутниковыми системами мы обеспечим превосходство в воздухе и сохраним живой европейскую амбицию к небу и космосу. Следите за будущим Европы с самой высоты."

	BA_EU_focus_86: "Интеграция командования"
	BA_EU_focus_86_desc: "Чтобы действовать быстро и слаженно в кризис, мы делегируем оперативное управление войной национальных армий Верховному главнокомандующему EAF, унифицируя цепочку командования. В моменты жизни или смерти только армия, движущаяся дисциплинированно по четкому приказу, а не со сложными процедурами, может победить. Эффективное командование экономит кровь солдат."

	### Интеграция права и судебной системы
	BA_EU_focus_87: "Подражать международному праву"
	BA_EU_focus_87_desc: "Основываясь на уже проверенной временем системе международного права, мы адаптируем ее к особой реальности Европейского Союза, слившегося с Кивотосом. Вместо создания законов с нуля, возведение нового правового порядка на мудрости и нормах, накопленных человечеством, уменьшает ошибки и обеспечивает стабильность. Это самый разумный путь."

	BA_EU_focus_88: "Предложить право Союза"
	BA_EU_focus_88_desc: "Мы примем 'право Союза', имеющее прямое обязательное действие и иерархически более высокое, чем внутренние законы государств-членов. Это право, стоящее выше национальных интересов и обычаев, станет крепкой связью, связывающей Европу как правовое сообщество, и незыблемой правовой основой интеграции. Равенство перед законом применяется также и между государствами."

	BA_EU_focus_89: "Законотворчество"
	BA_EU_focus_89_desc: "Через Европейский парламент мы издадим волну интегрированных законов, охватывающих экологию, права человека, цифровые технологии, энергетику и другое. Закон определяет общество и рисует будущее. Мы ломаем старые рамки, чтобы сплести справедливый и инновационный правовой каркас для новой Европы. Молот парламента кует историю."

	BA_EU_focus_90: "Взять за образец международное право Кивотоса"
	BA_EU_focus_90_desc: "Мы глубоко изучим прецеденты и передовую правовую практику Кивотоса — где сосуществуют существа со сверхчеловеческой силой — чтобы установить четкие критерии для беспрецедентных споров: злоупотребление мистическими силами, разрушение Ореолов и другое. Мы должны позаимствовать эту правовую мудрость, чтобы управлять неизвестными силами, избегать хаоса и утверждать порядок."

	BA_EU_focus_91: "Закон выше государства"
	BA_EU_focus_91_desc: "Мы конституционно закрепим, что решения Суда ЕС и право Союза имеют приоритет над национальными конституциями и законами. Это самый решительный и необратимый шаг для перехода от союза суверенных государств к подлинной федерации. Мы будем едины через закон."

	BA_EU_focus_92: "Право вмешательства в переговоры"
	BA_EU_focus_92_desc: "Мы предоставим ЕС право вмешиваться и выступать посредником в конфликтах интересов между членами, или напрямую представлять союз в ключевых дипломатических переговорах с третьими странами. Разделенные голоса слабы; голос единой Европы силен. Мы больше не будем вести переговоры 27 маленькими ртами, а одним большим голосом."

	BA_EU_focus_93: "Организовать Европейскую конституцию"
	BA_EU_focus_93_desc: "Мы создадим комиссию для разработки исторической 'Европейской конституции', определяющей ценности и идеалы ЕС, фундаментальные права и структуру управления. Это будет не просто кодекс: это будет учредительный документ, объявляющий о рождении нового порядка, обещание, содержащее душу нашего сообщества. Высечем нашу мечту в письменах."

	BA_EU_focus_94: "Независимые следственные полномочия"
	BA_EU_focus_94_desc: "Мы учредим мощное независимое федеральное следственное агентство, способное самостоятельно расследовать трансграничную коррупцию, терроризм и организованную преступность, не поддаваясь давлению национальных правительств или политических сил. Только расследование без убежищ выпрямляет правосудие и наказывает тех, кто пытается быть выше закона."

	BA_EU_focus_95: "Контроль договоров"
	BA_EU_focus_95_desc: "Мы будем осуществлять полномочия по предварительному пересмотру и утверждению договоров, которые государства-члены намереваются подписать самостоятельно с третьими странами, чтобы гарантировать, что они не противоречат интересам или безопасности союза. Мы должны блокировать тайные соглашения и одностороннюю дипломатию, вредящие сплоченности, поддерживая единую внешнюю политику."

	BA_EU_focus_96: "Предложить Конституцию"
	BA_EU_focus_96_desc: "После интенсивных дебатов мы представим парламенту окончательный проект Европейской конституции и вступим в процесс референдумов и ратификации в масштабе всего континента. Это не приказ сверху: это великий демократический процесс, где граждане сами напрямую решают свое будущее и правила управления. Пришло время быть хозяевами истории."

	BA_EU_focus_97: "Надзор за государствами-членами"
	BA_EU_focus_97_desc: "Мы запустим систему постоянного надзора для мониторинга соблюдения государствами-членами демократических ценностей, верховенства закона и прав человека союза. Те, кто нарушает или откатывается назад в демократии, будут предупреждены и наказаны для поддержания здоровья блока. Доверие рождается не из слепой веры, а из постоянной проверки."

	BA_EU_focus_98: "Европейская исполнительная комиссия"
	BA_EU_focus_98_desc: "Мы повысим 'Европейскую исполнительную комиссию' с роли простого административного органа до формального правительства. Этот орган, руководящий разработкой и выполнением политики и бюджетными операциями, станет де-факто 'европейским кабинетом министров' и сердцем, ведущим союз. Сильная исполнительная власть создает эффективную Европу."

	BA_EU_focus_99: "Правосудие"
	BA_EU_focus_99_desc: "Для укрепления верховенства закона мы модернизируем отсталые судебные системы и усилим независимость и профессионализм судей, чтобы гарантировать справедливые и быстрые суды. Только приговоры, основанные на законе и совести — а не на деньгах или власти — успокаивают обиды и поддерживают социальную справедливость. Справедливый суд — последний бастион демократии."

	BA_EU_focus_100: "Институционализация совместных расследований"
	BA_EU_focus_100_desc: "Для раскрытия сложных трансграничных преступлений — наркоторговли, торговли людьми, киберпреступности — мы институционализируем обязательное формирование совместных следственных групп (JIT) полицией вовлеченных стран. Мы должны показать преступникам, бегущим между странами, что убежища не существует. Координированное расследование — самый быстрый путь к победе в войне с преступностью."

	BA_EU_focus_101: "Применение Конституции"
	BA_EU_focus_101_desc: "Мы официально обнародуем и введем в силу Европейскую конституцию, ратифицированную подавляющей поддержкой граждан. Европа больше не рыхлый союз, а возрождается как мощное федеративное государство, объединенное одним флагом, одной конституцией и одной судьбой. Каждая статья Конституции будет защищать наши жизни и освещать будущее."

	BA_EU_focus_102: "Наднациональная исполнительная власть"
	BA_EU_focus_102_desc: "Если национальное правительство не выполняет решения Европейского суда, Союз обеспечит реальную исполнительную способность: сможет налагать принудительные штрафы или мобилизовать административные ресурсы для принуждения к исполнению. Закон без исполнения — не более чем бумажный тигр и предмет насмешек. Авторитет закона рождается из строгого применения."

	BA_EU_focus_103: "Обмен судимостями"
	BA_EU_focus_103_desc: "Мы создадим интегрированную базу данных судимостей для обмена в реальном времени между всеми государствами-членами отпечатками пальцев, ДНК и криминальным прошлым. Больше нельзя будет совершить преступление в одной стране и сбежать в другую, чтобы 'отмыть' личность. Пересечение границы не стирает преступление."

	BA_EU_focus_104: "Право вмешательства в споры Союза"
	BA_EU_focus_104_desc: "Если внутри государства-члена вспыхнет неконтролируемая гражданская война, серьезные беспорядки или действия, разрушающие конституционный порядок, Союз будет иметь чрезвычайное право развернуть силы и восстановить порядок, защищая демократию. Это последняя страховка для защиты граждан от внутреннего врага."

	BA_EU_focus_105: "Организовать Европол"
	BA_EU_focus_105_desc: "Мы реформируем Европол — ранее мало чем отличавшийся от органа обмена информацией — и расширим его до мощного федерального агентства с прямыми полномочиями расследования и ареста, по образцу ФБР. Его агенты будут действовать по всей Европе и преследовать до конца крупные преступные организации и террористов, чтобы захватить их."

	BA_EU_focus_106: "Унифицировать следственные полномочия"
	BA_EU_focus_106_desc: "Мы передадим следственные полномочия по тяжким преступлениям — терроризму, наркоторговле, отмыванию денег — от национальных полиций федеральному агентству, резко повысив эффективность и беспристрастность. Мы вырвем с корнем местный сговор и 'удобные' расследования и построим систематическую общеевропейскую способность борьбы с преступностью."

	BA_EU_focus_107: "Предложить орган посредничества"
	BA_EU_focus_107_desc: "Мы создадим постоянный орган арбитража и посредничества, позволяющий разрешать территориальные споры между государствами или торговые трения между компаниями путем диалога и урегулирования до того, как они дойдут до дорогостоящих и медленных судебных процессов. Своевременное урегулирование конфликтов и поиск взаимовыгодных соглашений — признак зрелого общества."

	BA_EU_focus_108: "Европейский суд"
	BA_EU_focus_108_desc: "Мы укрепим авторитет и независимость 'Европейского суда', ответственного за толкование Конституции Союза и вынесение окончательного решения по вопросам права Союза. Его решения будут окончательными и не подлежащими обжалованию, и все государства-члены и граждане должны будут им подчиняться. Богиня правосудия завяжет глаза и будет судить беспристрастно, только по закону."

	### Администрация и борьба с коррупцией
	BA_EU_focus_109: "Администрация"
	BA_EU_focus_109_desc: "Мы основательно реформируем раздутую и медлительную бюрократию и внедрим систему цифровой администрации, используя передовые технологии, такие как блокчейн и ИИ, для максимизации прозрачности и эффективности. Мы должны снизить барьеры и повысить качество услуг, чтобы граждане могли получать доступ к общественным благам быстро и удобно, в любом месте и в любое время. Умное правительство строит умную Европу."

	BA_EU_focus_110: "Наднациональный надзор"
	BA_EU_focus_110_desc: "Мы будем использовать сильные аудиторские полномочия для надзора за соответствием административных процедур каждой страны стандартам и процедурам Союза и требовать исправления незаконных или несправедливых действий. Надзор из центра сдержит местный произвол и одинаково повысит административный уровень во всем Союзе."

	BA_EU_focus_111: "Продвигать ротацию должностей"
	BA_EU_focus_111_desc: "Мы усилим обязательную ротацию высоких должностных лиц — склонных к коррупции, если они засиживаются — и без колебаний будем увольнять некомпетентных или халатных бюрократов, внося напряжение и дисциплину в аппарат. Застоявшаяся вода гниет; только текущая вода остается чистой. Сломайте бюрократический комфорт и утвердите культуру заслуг."

	BA_EU_focus_112: "Нормы срока полномочий"
	BA_EU_focus_112_desc: "Мы строго ограничим сроки полномочий на ключевых государственных должностях, выборных или назначаемых, прерывая приватизацию власти и цикл коррупции, который приносит долгое пребывание у власти. Власть не вечна: это временная возможность служения, делегированная. Выложитесь полностью за отведенное время и стройте культуру ухода, пока еще аплодируют."

	BA_EU_focus_113: "Кампания по борьбе с коррупцией"
	BA_EU_focus_113_desc: "Мы запустим масштабную общеевропейскую кампанию против взяточничества, торговли влиянием и хищений, укоренившихся в обществе. Защищая информаторов и сурово наказывая коррумпированных чиновников, мы должны запечатлеть идею, что 'коррупция = крах'. Только чистые руки делают политику чистой, а добросовестность является источником национальной конкурентоспособности."

	BA_EU_focus_114: "Назначение наблюдателей"
	BA_EU_focus_114_desc: "Мы развернем внешних наблюдателей, назначенных Союзом, в министерствах, государственных учреждениях и на крупных государственных стройках для постоянного присутствия на месте. Они будут действовать как 'тайные инспекторы', следящие и сообщающие в реальном времени о внутренней коррупции и расточительстве. Куда доходит взгляд контроля, там беззаконию нет места."

	BA_EU_focus_115: "Ограничение переизбрания"
	BA_EU_focus_115_desc: "Чтобы предотвратить призрак диктатуры — лидеров, меняющих Конституцию для самосохранения — мы конституционно строго ограничим переизбрание президента и премьер-министра. Демократия не должна зависеть от одного героя, а от хорошо продуманных систем и бдительного гражданства. Мирная смена власти — цветок демократии."

	BA_EU_focus_116: "Подавление мошенничества на государственном уровне"
	BA_EU_focus_116_desc: "Мы будем жестко наказывать мошенничество в масштабах государства: когда правительства манипулируют статистикой для необоснованного получения субсидий Союза или приукрашивают счета, чтобы скрыть свое финансовое положение. Такой паразитизм пожирает общий бюджет и может подтолкнуть весь Союз к кризису. Нечестная страна не заслуживает быть членом."

	BA_EU_focus_117: "Контроль исполнения бюджета"
	BA_EU_focus_117_desc: "Мы построим цифровую систему мониторинга бюджета, позволяющую публиковать и отслеживать в реальном времени каждую государственную трату. Любой сможет следить, используются ли налоги по назначению и не отклоняются ли они туда, куда не следует, блокируя расточительство в корне. Прозрачность — основа финансового здоровья."

	BA_EU_focus_118: "Европейская прокуратура"
	BA_EU_focus_118_desc: "Мы создадим 'Европейскую прокуратуру (EPPO)' для расследования и уголовного преследования преступлений, наносящих ущерб финансам Союза: хищение средств, финансовое мошенничество и тому подобное. Они будут пересекать границы, чтобы преследовать виновных до конца и возвращать потерянные налоги граждан."

	BA_EU_focus_119: "Изъятие приказов"
	BA_EU_focus_119_desc: "При расследованиях крупномасштабной коррупции мы будем быстро изымать официальные документы, электронные письма и записи мессенджеров, содержащие неправомерные приказы или давление, закрепляя их как доказательства. Мы должны блокировать попытки сорвать расследование, 'подчищая хвосты', и обнажить ствол: боссов наверху, привлекая их к правосудию. Записи не лгут."

	### Отчетность с прошлым и будущее
	BA_EU_focus_120: "Роспуск военизированных организаций"
	BA_EU_focus_120_desc: "Мы распустим силой и конфискуем все оружие незаконных вооруженных организаций вне государственного контроля: партийных ополчений, политических головорезов и экстремистских группировок. В демократии законная сила должна быть исключительной монополией государства; частное насилие не может быть терпимо ни под каким предлогом. Мир на улицах должна поддерживать только публичная власть."

	BA_EU_focus_121: "Наказание за геноцид"
	BA_EU_focus_121_desc: "Мы будем преследовать и наказывать, не применяя срока давности, преступления против человечности, поправшие человеческую совесть: этнические чистки, геноцид, систематические пытки. Время не стирает преступление; мы не можем позволить преступникам спокойно закрыть глаза. Перед исторической справедливостью нет срока давности: мы будем помнить, и снова помнить, чтобы судить."

	BA_EU_focus_122: "Наказание за преступления ненависти"
	BA_EU_focus_122_desc: "Мы будем отягчать наказание за преступления, совершающие насилие или разжигающие ненависть по признаку расы, религии, страны происхождения или пола. Защищать меньшинства и уважать разнообразие — центральная ценность нашего Союза, и мы должны не допустить, чтобы вирус ненависти заразил общество. Мир без дискриминации — это по-настоящему безопасный мир."

	BA_EU_focus_123: "Расследование ущерба гражданским лицам"
	BA_EU_focus_123_desc: "Мы проведем всеобъемлющую перепись гражданских лиц, которые были несправедливо убиты или ранены во время войны и массовых убийств, и будем продвигать официальные извинения и репарации на государственном уровне. Назвать по именам забытых жертв и восстановить их честь — долг выживших. Только исцелив боль прошлого, мы сможем двинуться к подлинному примирению."

	BA_EU_focus_124: "Расследование в отношении младших офицеров"
	BA_EU_focus_124_desc: "Трусливые оправдания вроде 'я просто выполнял приказ' больше не работают. Младшие офицеры и исполнители, которые руководили или допускали массовые убийства на местах, также должны ответить за свои действия. Мы должны предостеречь от банальности зла и учить, что истинная воинская честь — сохранять совесть, способную отказаться от несправедливого приказа."

	BA_EU_focus_125: "Запрет фашизма"
	BA_EU_focus_125_desc: "Мы строго запретим законом любые восхваления или пропаганду нацизма, фашизма и тоталитаризма, а также использование их символов, и распустим силой политические организации, следующие им. Мы не можем допустить свободу идей, разрушающих демократию. Мы должны решительно подавить, чтобы семя демона не проросло вновь."

	BA_EU_focus_126: "Искоренение ультранационализма"
	BA_EU_focus_126_desc: "Мы будем жестко противостоять ультранационалистическим силам, которые исключают другие народы, кричат шовинизм и сеют разделение и ненависть, считая их врагами общества. Мы не союз, связанный кровью и землей, а ценностями свободы и прав человека. Изгоним призрак замкнутого национализма и взрастим открытое сознание глобального гражданства."

	BA_EU_focus_127: "Окончательный приговор"
	BA_EU_focus_127_desc: "Мы завершим долгий и болезненный судебный процесс и вынесем окончательный исторический приговор военным преступникам. Это не просто наказание: это ритуал, осуждающий зло прошлого, утешающий жертв и демонстрирующий, что правосудие живо. С этим приговором мы прощаемся с темным прошлым и, уже без груза, сможем идти с более легким сердцем в новую эру."

	BA_EU_focus_128: "Путь Европы"
	BA_EU_focus_128_desc: "На руинах войны, разделения и Великого Перемещения мы возвели с потом и слезами башню мира и процветания. Сегодня Европа стряхивает с себя призраков прошлого и встает в центре мира как образец новой цивилизации, где мистика Кивотоса и человеческая мудрость гармонично сосуществуют. Это 'путь Европы', который мы выбрали, построили и должны пройти. История навсегда запомнит нашу смелость и нашу мудрость."
