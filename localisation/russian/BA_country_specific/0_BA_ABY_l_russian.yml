	ABY_election_event.1.t: "Выборы в [ABY.GetName] [GetYear] года"
	ABY_election_event.1.d: ""
	ABY_election_event.1.a: "Вечный президент, Ее Превосходительство Сироко!"

	SOV_bcerossiya: "Всероссийский временный комитет"

	ABY_news_event.1.t: "Временное правительство Абидоса нарушает перемирие"
	ABY_news_event.1.d: "Сегодня силы временного правительства Абидоса нарушили перемирие с Хяккияко и начали вторжение.\n\nЭто район, где вооруженные столкновения были частыми, но одновременно с началом наступления вспыхнуло восстание немцев в Судетах и Силезии; иностранная пресса считает это спланированным вторжением.\n\nОднако местные страны и страны Кивотоса не придают этому большого значения, считая это последним отчаянным рывком."
	ABY_news_event.1.a: "Вперед! За освобождение!"
	ABY_news_event.1.b: "Говорят, что загнанная в угол крыса кусает кошку?"

	ABY_news_event.2.t: "Столкновение между Шанхайцзином и Абидосом"
	ABY_news_event.2.d: "Шанхайцзин проигнорировал последний ультиматум Абидоса, требующий возвращения их незаконно оккупированных ключевых регионов, и обе страны вступили в состояние войны.\n\nВ то время как многие страны внимательно следят за курсом временного правительства Абидоса, которое вопреки всему победило Хяккияко, эта вторая война вызвала большое недоверие среди государств Кивотоса; в то же время некоторые местные страны выступили с заявлениями поддержки, так что на этот раз позиции смешаны."
	ABY_news_event.2.a: "Победа не за горами."
	ABY_news_event.2.b: "Улыбнется ли им удача снова?"

	ABY_news_event.3.t: "Создание Временного демократического правительства Австрии"
	ABY_news_event.3.d: "Произошло нечто удивительное.\nКогда силы временного правительства Абидоса вошли в Линц, горожане встретили их как освободителей: бросали лепестки и кричали «ура», оказав восторженный прием.\nГлавнокомандующий Асагири Соу заявила в интервью, что подчинится решениям правительства.\n\nТем временем временное правительство встретилось с делегацией во главе с Социал-демократической партией Австрии и только что объявило о формировании Временного демократического правительства Австрии, а также о плане освобождения Австрии.\nШанхайцзин заявляет, что это гнусная уловка и проявление экспансионистских амбиций, но, похоже, это не находит большого отклика."
	ABY_news_event.3.a: "К освобождению Австрии."
	ABY_news_event.3.b: "Страны двух миров…? Кто они, черт возьми?"

	ABY_news_event.4.t: "Формирование Федерального правительства Абидоса"
	ABY_news_event.4.d: "Временный федеральный президент Окусора Аянэ объявила сегодня о формировании федерального правительства Абидоса–Чехия–Австрия. Унаследовав временную конституцию, была провозглашена временная федеральная конституция, включающая, среди прочего, полную автономию Судет; она также заявила, что вскоре будет объявлена исправленная конституция для закладки основ государства и проведения всеобщих выборов.\n\nМежду тем о таких инцидентах, как перемещение некоторых дивизий внутри временного правительства на север/юг к новой столице, или о том, что совет директоров Нефтис был передан в суд, она ограничилась словами «внутренние дела» и не стала вдаваться в подробности.\nНекоторые эксперты выражают озабоченность по поводу политической нестабильности, отмечая сходство с процессом военного переворота; другие, напротив, считают, что, возможно, удалось предотвратить переворот. Мнения разделились."
	ABY_news_event.4.a: "Масарик, отец наш… ты видишь это?"
	ABY_news_event.4.b: "Рождение нового демократического государства."

	ABY_news_event.5.t: "Военный переворот в Абидосе"
	ABY_news_event.5.d: "Асагири Соу, командующий австрийским фронтом временного правительства Абидоса и национальный герой, предала свои заявления о лояльности и совершила военный переворот.\n\nПосле переворота правительственные здания и посольства были закрыты, подтвержденной информации мало; кроме того, передвижение журналистов ограничено, и действуют контрольно-пропускные пункты.\n\nГенерал Асагири Соу, ныне председатель Национального комитета просвещения, объявила, что приняла решение спасти родину после подтверждения отвратительного заговора гнусного временного правительства, но избегала подробностей, сказав, что они будут раскрыты позже.\n\nКроме того, местонахождение ключевых политических фигур временного правительства неизвестно, что вызывает споры о том, живы они или мертвы."
	ABY_news_event.5.a: "Вот так рушится наша демократия?"
	ABY_news_event.5.b: "Еще одна страна впадает в экстремизм."

	ABY_news_event.6.t: "[ABY.GetName] вводит систему «гражданского союза»"
	ABY_news_event.6.d: "Временное правительство Абидоса официально объявило об утверждении закона, который впервые после Великого Перемещения юридически признает систему «гражданского союза» между европейцами и жителями Кивотоса.\n\nОжидается, что это решение станет важной вехой для того, чтобы жители двух миров фактически сформировали единое сообщество. Представитель заявил: «Эта система направлена на уважение союза всех жителей независимо от их происхождения и фона и на защиту соответствующих законных прав», и добавил: «Это первый шаг к реализации ценности гармонии, к которой стремится наше сообщество».\n\nХотя в некоторых кругах сохраняются опасения по поводу культурных различий, большинство граждан воспринимают это с энтузиазмом, считая прогрессивным решением, соответствующим названию «страна двух миров»."
	ABY_news_event.6.a: "Постойте! Разойдитесь! Разойдитесь!!"
	ABY_news_event.6.b: "Межвидовые браки и однополые браки? Боже мой!"

	ABY_news_event.7.t: "[ABY.GetName] принимает «эсперанто»"
	ABY_news_event.7.d: "Временное правительство Абидоса, обеспокоенное языковыми конфликтами, объявило, что официально примет эсперанто, нейтральный международный язык, в качестве официального языка.\n\nЭто смелое решение, призванное решить проблему административной неэффективности и этнических конфликтов, вызванных смешанным использованием чешского, немецкого и языка Кивотоса. Правительство объяснило: «Введение эсперанто, который не склоняется ни к одной этнической группе, обеспечит справедливую основу для общения для всех членов».\n\nСогласно объявлению, все официальные документы будут составляться на эсперанто, и он также будет включен как обязательный предмет на всех уровнях образования. Наблюдается, сможет ли это решение открыть новый путь гармонии для временного правительства, стоявшего перед кризисом «Вавилонской башни»."
	ABY_news_event.7.a: "Espero (надежда)."
	ABY_news_event.7.b: "А дальше?"

	ABY_news_event.8.t: "Второй переворот в Абидосе"
	ABY_news_event.8.d: "Железный кулак Асагири Соу наконец достиг своего конца. Командир Сунаоками Сироко, которая притворялась сдавшейся, выжидая свой шанс, прошлой ночью возглавила тайно собранное гражданское ополчение и лоялистов в армии и молниеносно атаковала дворец.\n\nПосле хаотичных уличных боев Соу была захвачена, и командир Сунаоками Сироко провозгласила «справедливость и восстановление рухнувшего порядка». Граждане выходят на улицы, чтобы приветствовать возвращение героини, но существуют и обеспокоенные взгляды: объявленное ею военное положение и жесткий военный контроль могут быть другой формой авторитаризма."
	ABY_news_event.8.a: "Да здравствует командир Сироко!"
	ABY_news_event.8.b: "Это что, традиционная игра или как?"

	ABY_news_event.9.t: "Провозглашение Великой Федерации Абидоса"
	ABY_news_event.9.d: "Президент Сунаоками Сироко официально оформила объединение со Словакией и одновременно начала военные операции, пересекая границу Венгрии. В своем заявлении она подчеркнула, что это «священная война» для «прекращения венгерского диктаторского режима и освобождения наших угнетенных братьев-словаков».\n\nОдновременно правительство провозгласило перед миром создание Великой Федерации Абидоса, охватывающей Чехию, Австрию, Словакию и Венгрию. Перед лицом продвижения этой федерации, уже ставшей доминирующей силой в Центральной Европе, Румыния и Югославия также выразили поддержку, и дискуссия о возрождении старой «Малой Антанты» набирает силу."
	ABY_news_event.9.a: "Слава Великому Абидосу."
	ABY_news_event.9.b: "Еще одна форма объединения?"

	ABY_news_event.10.t: "Возрождение Малой Антанты"
	ABY_news_event.10.d: "Лидеры [ABY.GetName], [ROM.GetName] и [YUG.GetName] встретились сегодня в Братиславском замке, чтобы подписать исторический договор о взаимной обороне. Тем самым «Малая Антанта», поддерживавшая мир в Центральной Европе в межвоенный период, официально возродилась.\n\nВ совместном заявлении три лидера постановили «совместно реагировать на любую агрессию внешних сил, угрожающих миру в бассейне Дуная». Этим договором [ABY.GetName] получает международное признание своего положения как твердого гегемона Центральной Европы."
	ABY_news_event.10.a: "Возродим наследие."
	ABY_news_event.10.b: "Начало новой гегемонии в Восточной Европе."

	ABY_news_event.11.t: "[ABY.GetName] провозглашает Федеральный закон"
	ABY_news_event.11.d: "[ABY.GetName] сегодня обнародовала новую федеральную конституцию и объявила о прекращении военного контроля над оккупированными регионами Венгрии. В результате все венгерские жители немедленно получают федеральное гражданство без дискриминации.\n\nПредставитель правительства заявил: «Только полная интеграция, без различия между победителями и побежденными, — наш путь», и объявил о масштабном плане сбалансированного развития восточных регионов, отсталых из-за войны. Также он намекнул, что начнется обсуждение строительства в долгосрочной перспективе новой административной столицы, оставив Прагу, для эффективного управления расширенной территорией федерации."
	ABY_news_event.11.a: "Федерация будет вечна!"
	ABY_news_event.11.b: "Как долго продержится этот союз?"

