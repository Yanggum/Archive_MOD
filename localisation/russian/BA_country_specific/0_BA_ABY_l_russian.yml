	ABY_shiroko_fas_event.11.t: "Стальная ограда"
	ABY_shiroko_fas_event.11.d: "\"Сенпай, западный немецкий регион… Геенна и Тринити следят за нами. Если они увидят нашу слабость, они попытаются захватить гегемонию в регионе. Чтобы избежать войны, мы должны показать, что мы сильны… и одновременно заводить друзей.\"\n\nАнализ Аянэ был точен. Сироко кивнула.\n\n«Да. Я знаю. Если меня не провоцируют, я не кусаю. Но нужна страховка.»\n\nСироко встала перед микрофоном в студии. Был сценарий, но она бегло пролистала его и просто отложила в сторону. И начала говорить своим обычным плоским голосом.\n\n«Мы можем быть сильны и сами по себе. Но с друзьями мы сильнее. С сегодняшнего дня Абидос пожимает руку Румынии и Югославии. Помните «Малую Антанту»? Мы ее возрождаем.»\n\nОна перевела дыхание и отправила сообщение на запад.\n\n«И западным германским странам я тоже вот что скажу: если вы не будете зариться на нашу землю и будете нас уважать, мы тоже не хотим воевать. Давайте жить дружно. Все просто.»\n\nЕе взгляд пронзил камеру.\n\n«Но если вы тронете моих друзей или ступите на нашу землю без спросу… тогда я вас не прощу. Я буду преследовать вас до края ада и опустошу. Вы знаете, какая я. Абидос возвращает то, что получает. Так что запомните хорошенько.»\n\nГрубое заявление, лишенное дипломатической риторики."
	ABY_shiroko_fas_event.11.a: "Это запечатлелось в соседних странах как предупреждение и предложение, более мощные, чем любой дипломатический документ."

	ABY_shiroko_fas_event.12.t: "Перековать мечи на орала"
	ABY_shiroko_fas_event.12.d: "\"Так нельзя, сенпай! Соу поставила все на военные заводы и оставила это в руинах. Дороги перерезаны, не хватает товаров первой необходимости… сейчас люди аплодируют, но если они будут голодать, это в любой момент может обернуться гневом.\"\n\nУпреки Серики были болезненны, но правдивы. Нономи тоже поддержала: «Да. Сейчас нужно заботиться о столе людей, а не о танках.»\n\nСироко посмотрела на карту. Для нее карта всегда была зоной боевых действий, которую нужно завоевать… но теперь это был дом, который нужно защищать.\n\nНесколько дней спустя Сироко поднялась на трибуну центральной площади. Толпа смотрела на нее снизу. Она схватила микрофон и, словно выплевывая слова, сказала:\n\n«Мы победили. Но победа не дает тебе еды.»\n\nПлощадь мгновенно затихла.\n\n«Если есть голод, победа не имеет смысла. Сейчас нужны не пули: нужен хлеб. Поэтому мы меняемся.»\n\nОна указала куда-то.\n\n«На заводах мы больше не будем делать детали для танков: будем делать трактора. Мы снова соединим перерезанные дороги и снова отстроим разрушенные школы. Город или деревня, люди этого мира или люди Кивотоса — неважно. Все, кто живет на этой земле, должны есть досыта и спать, вытянув ноги.»\n\nСироко стукнула себя кулаком в грудь.\n\n«Честно говоря, я умею только ломать и воевать. Строить у меня плохо получается. Поэтому я буду учиться у своих друзей… и у всех в Абидосе. Мы перекуем мечи на орала. Я выполняю свои обещания. Да.»\n\nУУУААА!\n\nКрик, сотрясший площадь. Люди поверили в грубую искренность, скрытую в ее манере говорить. Но Сироко не улыбалась. В толпе она чувствовала холодный взгляд Хосино, молча наблюдающей за ней."
	ABY_shiroko_fas_event.12.a: "Когда-нибудь..."

	ABY_shiroko_fas_event.13.t: "Великая Федерация Абидоса"
	ABY_shiroko_fas_event.13.d: "Перед зданием парламента в Будапеште, на берегу Дуная, толпа размахивала флагами Абидоса, Словакии и Венгрии вместе. После победы в объединении Словакии и освободительной войне в Венгрии Сироко предстала там не как завоевательница, а как «освободительница». Вместо своей обычной практичной тактической куртки на ней был мундир строгого покроя с президентской перевязью.\n\nСироко взяла микрофон и посмотрела на толпу. Ее глаза были тверды, без колебаний.\n\n«Да. Мы все вместе. Война закончилась. Диктаторы исчезли, и мы вернули нашу семью.»\n\nОна указала на огромную карту позади. Границы Чехии, Словакии, Австрии и Венгрии были стерты, и обширная территория была закрашена одним цветом.\n\n«Мы больше не чужие. Чехия, Словакия, Австрия, Венгрия… мы одна семья. А семья не может жить врозь. Поэтому я все объединила.»\n\nИ она провозгласила.\n\n«С сегодняшнего дня эта страна — «Великая Федерация Абидоса».»\n\nРазразилось ликование. Сироко подняла руку, чтобы успокоить их, и заговорила жестко.\n\n«Мы выросли. Мы стали сильнее. Теперь никто не может тронуть нашу семью. Если ты вошел в мою ограду, я защищаю тебя до конца. Я сделаю так, чтобы вы не голодали и не жили в страхе. Таков мой путь. Таков путь Великого Абидоса.»\n\nЕе логика была проста. Сложные этнические конфликты или историческая ненависть покрывались ее собственным определением: «семья внутри моей ограды».\n\n«Великий Абидос не останавливается. Следуйте за мной.»"
	ABY_shiroko_fas_event.13.a: "Родился гегемон Центральной Европы."

	ABY_shiroko_fas_event.14.t: "Волчья стая"
	ABY_shiroko_fas_event.14.d: "В большом конференц-зале президентского дворца в Хорне Сироко предстала перед прессой вместе с послами Румынии и Югославии. Флаги трех стран висели рядом, возвещая о возрождении огромной стены, протянувшейся через Центральную Европу.\n\n«Мир все еще опасен. На западе и на востоке на нас смотрят. Если будешь драться один, тебя легко поранят. Поэтому я снова позвала старых друзей.»\n\nВместо того чтобы читать речь, Сироко говорила в своей прямой манере.\n\n«Помните «Малую Антанту»? Она возвращается. Румыния, Югославия и наш Великий Абидос. Отныне эти трое — одно тело.»\n\nОна сжала кулак в воздухе.\n\n«Будем прикрывать друг другу спины. Если ударят Румынию, ударю я. Если ударят меня, поможет Югославия. Простое правило.»\n\nОна посмотрела в камеру.\n\n«Это не для того, чтобы кому-то досадить. Это чтобы укрепить ограду нашего дома. Но предупреждаю: тем, кто попытается через нее перепрыгнуть, лучше быть готовыми. Мы трое пойдем вместе. Если тронете моих друзей, я не оставлю вас в покое.»\n\nНе было ни трудных слов вроде «договор о взаимной обороне» или «коллективная безопасность», которые написала Аянэ. Но логика стаи — «тронул одного, идут все» — была яснее и угрожающе любой дипломатии. Граждане ликовали, а соседи напряглись. Великий военный блок, господствующий на Дунае, официально воскрес."
	ABY_shiroko_fas_event.14.a: "Один за всех, все за одного..."

	ABY_shiroko_fas_event.15.t: "Балканский лис и волчица"
	ABY_shiroko_fas_event.15.d: "В безопасном доме, спрятанном в Белграде, Иосип Броз Тито со странным выражением лица смотрел на агента разведки Абидоса, присланного как представитель Сироко. Агент протянул ему портфель с документами, подписанными собственноручно Сироко.\n\n«Это предложение президента Сироко: для решения внутренних этнических конфликтов и некомпетентности монархии она желает сотрудничать с секретарем Тито.»\n\nТито пролистал бумаги. Огромное финансирование, современное оружие и косвенная поддержка путем развертывания войск Абидоса на границе в случае переворота. Условием было только «поддерживать дружественные отношения с Абидосом».\n\n«Это явное вмешательство во внутренние дела. Ваш президент, похоже, считает, что переворачивать чужие страны — это как помочь соседу убраться в доме.»\n\nТито усмехнулся, пуская дым сигары. Агент, вежливо, но твердо, передал намерение Сироко.\n\n«Ее превосходительство считает, что для того, чтобы югославский народ обрел настоящую стабильность, нужен такой сильный и способный лидер, как вы, а не нынешний королевский дом. Она подчеркивает, что это не преследует никакой политической компенсации: это чистая поддержка ради лучшего будущего Югославии. Она просит только, чтобы после прихода к власти вы относились к нашей Федерации как к брату.»\n\nТито сухо рассмеялся. Он не знал, наивность это или гордость. Обычно такие предложения сопровождаются грязными условиями: уступка территории, экономическое подчинение. Но Сироко двигалась, действительно, по своей собственной справедливости: «если Тито будет править, народу будет лучше».\n\n«Опасный идеалист… но нет причин отказываться.»\n\nТито был реалистом. Нужно будет следить за настроениями Абидоса, да, но с такой поддержкой он мог с лихвой завершить революцию.\n\n«Хорошо. Я принимаю. Если кто-то хочет быть другом, почему отказываться?»\n\nТито протянул руку для рукопожатия."
	ABY_shiroko_fas_event.15.a: "«Добрая воля» Сироко собиралась изменить карту Балкан."

	ABY_shiroko_fas_event.16.t: "Ягненок и волчица"
	ABY_shiroko_fas_event.16.d: "В тронном зале замка Пелеш в Румынии король Михай I, нервничая, принял посланника Сироко. Для молодого монарха со слабой политической базой ситуация была минным полем: роскошь Кароля II и коррумпированные депутаты разлагали страну.\n\nПосланник с уважением передал послание.\n\n«Президент глубоко обеспокоена положением Вашего Величества. Она говорит, что не может оставаться в стороне, пока неразбериха вокруг Румынии мешает вашему правлению и заставляет страдать народ.»\n\n«Абидос… хочет мне помочь? Почему? Мне нечего им дать.»\n\nПосланник склонил голову.\n\n«Ее превосходительство считает, что у Вашего Величества доброе сердце, но угрожающие силы вокруг не дают вам исполнить свою волю. Она хочет, чтобы румынский народ жил в мире под властью такого милосердного монарха, как вы. Мы будем «щитом», который уберет эти препятствия.»\n\nЭто было больше похоже на логику сильного хулигана, защищающего слабого парня, чем на международную дипломатию. Но в этих словах была странная искренность. Михай I посмотрел на план поддержки: модернизация королевской гвардии, разведка, экономическая помощь.\n\nВ глазах молодого, неопытного короля Сироко казалась могущественным и справедливым защитником. Он знал, что ее методы грубы и авторитарны, но ему хотелось верить, хотя бы наполовину, в тот «идеал», который она провозглашала.\n\n«Хорошо… я приму добрую волю президента Сироко. Румыния будет относиться к Абидосу как к своей самой доверенной братской стране.»\n\nМихай I кивнул. Сироко вторгалась во внутреннюю политику Румынии, используя свое влияние… но для нее это было, без сомнения, «защитой младшего брата»."
	ABY_shiroko_fas_event.16.a: "Может быть, это… немного чрезмерная опека."

	ABY_shiroko_fas_event.17.t: "Подписание Федерального закона"
	ABY_shiroko_fas_event.17.d: "Перед зданием парламента в Будапеште вместо венгерского триколора развевался огромный федеральный флаг Великого Абидоса. Сироко предстала перед толпой венгерских граждан. В их глазах смешивались страх перед завоевателем и облегчение от того, что война закончилась. Сироко отодвинула подготовленную речь и взяла микрофон.\n\n«Да. Война закончилась. Опустите оружие.»\n\nС ее первой фразы напряженная площадь загудела.\n\n«С сегодняшнего дня не существует «оккупированной венгерской территории». Военный контроль отменен. Вы больше не побежденный народ: отныне вы граждане Великой Федерации Абидоса. У вас будут те же права, что у чеха или австрийца.»\n\nОна провозгласила новый федеральный закон, известный как «Закон о семье».\n\n«Прошлое не важно. Если ты внутри моей ограды, мы одна семья. Я не дискриминирую семью. Плохо, что вы досаждали словакам, но достаточно пообещать, что это не повторится. Тогда я тоже буду вас защищать. Никто не будет относиться к вам как к гражданам второго сорта.»\n\nОна указала на восток.\n\n«Мы отстроим это отсталое место. Построим заводы, возведем школы, раздадим хлеб. Если ты живешь в этой федерации, ты должен быть так же сыт. Это мое правило.»\n\nЭто было просто и грубо… но сильнее любого юридического кодекса. Это была не рука победителя побежденному, а обещание главы семьи своим. Венгры переглянулись, ошеломленные, и тут кто-то начал аплодировать."
	ABY_shiroko_fas_event.17.a: "Это был звук принятия нового защитника, а не завоевателя."

	ABY_shiroko_fas_event.18.t: "Тень отца"
	ABY_shiroko_fas_event.18.d: "\"Да здравствует мать Федерации, президент Сироко!\"\n\n\"Истинная наследница Масарика!\"\n\nКаждый раз, когда эти крики доносились в окно дворца, грудь Сироко сжималась. «Мать Федерации». Этот титул, который ей повесили, был странным… и слишком тяжелым.\n\nВ углу кабинета висел портрет Томаша Масарика: настоящего «взрослого», посвятившего жизнь демократии и гуманизму и, даже правя долгое время, не разрушившего конституционный порядок.\n\n«Сенсей… я правильно делаю?»\n\nСироко посмотрела на свои руки. Ее правительство было эффективным: голод исчез, границы были безопасны. Но парламент превратился в хор поднятых за нее рук, а пресса умела только восхвалять. Масарик учил людей ходить; Сироко несла людей на себе и бежала. И люди забывали, как ходить самостоятельно.\n\n«Ммм… я не Сенсей. Я просто…»\n\nПока народ превращал ее в божество, Сироко чувствовала, что сама становится чудовищем. Портрет Масарика сегодня, казалось, смотрел на нее с необычной суровостью. Она задернула шторы и закрыла мир снаружи."
	ABY_shiroko_fas_event.18.a: "Тень, скрытая блеском обожания, становилась все темнее."

	ABY_shiroko_fas_event.19.t: "Самый длинный день Венгрии"
	ABY_shiroko_fas_event.19.d: "Дьёр изменился. С тех пор как было восстановлено главное здание Абидоса, это место перестало быть простым провинциальным городом. Выросли небоскребы в стиле Абидос, и после объявления о переносе административной столицы он стал новым сердцем Федерации.\n\nИштван, молодой венгр, сидел на террасе кафе и смотрел на пейзаж. Его родина, Венгрия, была разделена на три части: одна в Румынии, другая в Югославии, а остаток здесь, в Великом Абидосе.\n\n«Живется лучше, чем раньше. Ни короля, ни дворян.»\n\nСтарик рядом рассмеялся. Это была правда: улицы были полны жизни, люди улыбались. С новостью о том, что столицей станет Дьёр, многие венгры воодушевились, будто сами становятся центром Федерации. Но Иштван знал.\n\nТо, что росло на улицах Дьёра, были вывески и культура «в стиле Кивотоса». Венгерский национализм? Воскрешение Великой Венгрии? Те, кто кричал об этом сейчас, были объевшимися свиньями, развешивающими фото Сироко и славящими ее.\n\n«Нас не завоевали. Нас переварили.»\n\nПод этим гигантским главным зданием Абидоса венгерская идентичность молча таяла. Если бы был тиран, которому можно было бы сопротивляться с кровью, возможно, было бы легче. Но хлеб и процветание Сироко были слишком сладки.\n\nИштван потрогал значок с венгерским триколором, спрятанный в кармане. Вздохнул и засунул его еще глубже.\n\n«Да… если живется хорошо, этого достаточно, правда?»\n\nИ он отпил свой кофе."
	ABY_shiroko_fas_event.19.a: "В день величайшего процветания Венгрии Венгрия молча умирала."

	ABY_shiroko_fas_event.20.t: "Узница золотого трона"
	ABY_shiroko_fas_event.20.d: "Все «обещания революции» Сироко были выполнены. Голод закончился, преступность упала до нуля, и Великая Федерация Абидоса стала гегемоном Центральной Европы. Внешне она была идеальной правительницей.\n\nНо по ночам Сироко пила одна в темном кабинете.\n\n«В какой момент все пошло не так?»\n\nОна знала: чем дольше длилось ее правление, тем сильнее атрофировались демократические мускулы страны. Пока она все решала и все проблемы решала, система парализовалась.\n\n«Я хочу уйти.»\n\nОна думала об этом десятки раз. Хотелось снять форму, снова стать простой гражданкой и кататься на велосипеде с подругами. Но она была солдатом. И ее чутье на поле боя показывало ей жестокую реальность.\n\nЕсли она уйдет сейчас… стервятники набросятся на вакуум власти. Амбициозные военные-политики. Они не восстановят демократию: они разорвут Федерацию на части.\n\n«Я… должна терпеть.»\n\nОна приковала себя к «золотому трону». Она должна была быть солнцем для народа, даже если это солнце сжигало ее заживо. Сироко смотрела на ночной город из окна и желала, чтобы однажды появился кто-то сильнее, правильнее, кто снял бы ее с этого проклятого места. Революция или импичмент — было все равно."
	ABY_shiroko_fas_event.20.a: "Молясь о том, чтобы однажды быть освобожденной, волчица в ту ночь снова охраняла трон."

	ABY_shiroko_fas_event.21.t: "Молчаливая урна"
	ABY_shiroko_fas_event.21.d: "Сироко, мечтая вернуть демократию, настояла на проведении всеобщих выборов. В глубине души она надеялась, что оппозиция вырастет, будет следить за ней, и тогда власть можно будет распределить естественным путем.\n\n«Пусть будут честными. Не вмешиваться, вообще.»\n\nОна повторяла это снова и снова Министерству внутренних дел и разведке. Выборы прошли без обмана: никаких подмен урн или угроз.\n\nНо когда результат появился на экране, Сироко пришла в отчаяние.\n\n[Федеральная демократическая республиканская партия: 92% голосов, полная победа по всем округам]\n\nОппозиция была уничтожена. Нет: с самого начала существование значимой оппозиции было невозможным. Народ даже не мог вообразить альтернативу Сироко, героине войны и матери, дающей хлеб. Даже кандидаты от оппозиции вели кампанию под лозунгом: «мы последуем воле президента Сироко».\n\nЕе советники откупорили шампанское, празднуя сокрушительную победу, но Сироко, побледнев, опустилась на стул. Подавляющая поддержка народа, по иронии судьбы, давала ей индульгенцию на вечную диктатуру. Урна выражала народную волю… но эта самая воля убивала демократию. Внутри системы, которую она сама создала, Сироко стала богиней, не способной проиграть."
	ABY_shiroko_fas_event.21.a: "\"Это… демократия?\""

	ABY_shiroko_fas_event.22.t: "На всех парах"
	ABY_shiroko_fas_event.22.d: "Рост популярности только усилил беспокойство Сироко. Если демократия не может укорениться естественным путем, значит, придется строить систему хотя бы насильно.\n\n«Нет времени. Лучше быстро и несовершенно, чем идеально и поздно.»\n\nОна форсировала реформы, как будто руководила военной операцией.\n\n«Больше власти местным советам? Не ждите принятия закона: делайте указом немедленно.»\n«Независимость суда? Если не хватает судей, увольте военных юристов и отправьте их в провинции.»\n«Свобода прессы? Дайте субсидии газетам, чтобы они критиковали правительство, хотя бы принудительно.»\n\nЕе намерения были благими: распределить власть и принять надзор. Но результат, полученный в обход процесса, был катастрофическим.\n\nМестные советы, без подготовки, стали добычей местных заправил. Импровизированное правосудие выносило приговоры, оглядываясь больше на Сироко, чем на закон. А пресса, финансируемая государством, вместо «здоровой критики» извергала «замаскированную под критику лесть».\n\nБашня, которую Сироко поспешно возвела, была замком из песка. Чем больше она трогала систему, тем сильнее та перекашивалась и ломалась. Волчица с болью понимала, что ее нетерпение только уродует режим… и укрепляет его как чудовищную диктатуру."
	ABY_shiroko_fas_event.22.a: "\"Почему не получается… если это так просто?\""

	ABY_shiroko_fas_event.23.t: "Понять через разрыв"
	ABY_shiroko_fas_event.23.d: "Хосино закрыла бухгалтерскую книгу на столе: тайный счет Социалистического союза Абидоса. За последние недели туда поступали огромные пожертвования неизвестного происхождения. Проследив их, источником оказался не кто иной, как «Секретариат президентского дворца».\n\nХосино направилась прямо во дворец. Это была их первая встреча лицом к лицу с тех пор, как Сироко вступила в должность.\n\n«Ухии~ а это что такое, Сироко-тян?»\n\nХосино бросила бухгалтерскую книгу на стол.\n\nСироко молча посмотрела на нее.\n\n«Оппозиция слишком слаба. Если нет сил, которые следят, правительство гниет. Лучше, чтобы это была ты… лучше, чтобы ты на меня нападала. Это лучше, чем если появятся какие-то странные типы.»\n\nЭто был извращенный способ Сироко «защитить демократию»: вырастить собственного врага для баланса власти, отчаянный жест.\n\nХосино издала недоверчивый смешок.\n\n«Ха… ты действительно глупа. Какая легитимность у оппозиции, растущей на деньги правительства? Это просто вторая линия. Марионетка.»\n\n«Но все же…!»\n\n«Я не приму. Эти деньги — нет.»\n\nХосино сказала твердо.\n\n«И с сегодняшнего дня я тоже увольняюсь с должности чиновника. Теперь я действительно стану гражданским лицом.»\n\nГлаза Сироко дрогнули. Это был момент разрыва последней оставшейся связи. Хосино открыла дверь, чтобы уйти, на секунду остановилась и сказала, не оборачиваясь.\n\n«Сироко-тян. Не пытайся тащить все на себе одна. Ты сломаешься.»\n\n«…»\n\n«Я буду делать свое дело снаружи. И если ты действительно ошибешься, тогда я приду и остановлю тебя по-настоящему. Так что… держись до тех пор.»\n\nДверь закрылась. Сироко осталась одна в пустом кабинете. Внешне это был полный разрыв. Но Сироко уткнулась лицом в стол и впервые за долгое время слегка улыбнулась.\n\nОблегчение от того, что есть «настоящий враг», который следит за ней и может остановить. Последняя фраза Хосино стала единственным утешением для волчицы, запертой на холодном троне."
	ABY_shiroko_fas_event.23.a: "Да…"

