#Абидос
	#ABY_num_of_students_tt: "Вы сможете собрать студентов для восстановления академии.\nТекущее количество студентов: §G[?var:ABY_num_of_students]§!"
	#ABY_exiles_var_tt: "Количество студентов, которые будут переведены: §G150§!"
	#aby_rebuild_high_school_text_desc: "Использование гражданских фабрик: §g[GetABY_num_of_students$§!\n\nЕженедельная рабочая сила: §g50§!\n\nПризывное население: §g-10%§!"

	landmark_destroyed_ABY_homeschool: "Огромная песчаная дюна"
	landmark_destroyed_ABY_homeschool_desc: "Гигантская песчаная гора высотой 1 км над уровнем моря, появившаяся из ниоткуда на северо-западе Дьёра вместе с Великим Перемещением. Венгерское правительство многократно пыталось убрать ее, но каждый раз терпело неудачу из-за непрекращающегося притока песка. Однако, поскольку внутри песка был найден таинственный минерал «Чхонхвисок» и фрагменты передовых технологий неизвестного происхождения, эта опасная гора стала считаться не просто стихийным бедствием, а сокровищницей неизведанного. Секреты, которые она хранит, все еще спят глубоко в песке."

	landmark_ABY_homeschool: "Главное здание Абидоса"
	landmark_ABY_homeschool_desc: "Легендарное «Главное здание старшей школы Абидоса», наконец явившее свое величие после того, как была убрана песчаная гора высотой 1 км, покрывавшая Дьёр. После долгого процесса реставрации это колоссальное сооружение было безупречно восстановлено. Оно является истоком и духовной опорой Федерации Абидоса, подавляющим монументом, видимым из любой точки города Дьёр. Для жителей Абидоса, вернувших свой потерянный дом, это святилище души; для граждан Федерации — мемориальное сооружение, символизирующее несгибаемую волю, победившую пустыню."

	ABY_build_homeschool_landmark_tt: "Заменяет §Y$landmark_destroyed_ABY_homeschool$§! на §Y$landmark_ABY_homeschool$§!."

	# Открытие Абидоса
	ABY_country_intro_header: "§YСапфир, потерявший свой свет§!"
	ABY_country_intro_header_1: "§YМаскированная банда в купальниках§!"
	ABY_country_intro_header_2: "§YЧехословакия§!"
	ABY_country_intro_header_3: "§YМой дом, Судеты§!"
	ABY_country_intro_header_4: "§YГордиев узел§!"
	ABY_country_intro_header_5: "§YНация двух миров§!"

	ABY_country_intro_content: "С чем можно сравнить старшую школу Абидоса?\nВозможно, самое подходящее — это сапфир, который больше не блестит. В прошлом, когда семьдесят председателей студенческого совета множились в Абидосе и разгоралась гражданская война, правление председателя Шематы — которая защитила порядок, объединила Абидос и, более того, поставила весь Кивотос на колени, наводя ужас — сегодня не более чем легенда. Все, что он/она построил(а) в Абидосе, было погребено под песком, не оставив следа.\n\nВ отчаянной ситуации Великое Перемещение еще больше усугубило хаос.\n\n1 ноября 1935 года старшая школа Абидоса переместилась в Хорн, к северу от Дуная в Австрии. Чтобы избежать вооруженного конфликта, она сотрудничала с австрийцами и чехами, стараясь стабилизировать регион. Но несколько дней спустя Шанхайцзин, подчинивший себе Австрию, воспринял это как угрозу и вторгся в Абидос; а вскоре к атаке присоединилась и Хяккияко.\n\nПока шла ожесточенная битва за главное здание, Серика, вышедшая за припасами, была задержана СКЕБАН. Оставшиеся четверо покинули главное здание и отправились из Линца, чтобы спасти свою подругу."

	ABY_country_intro_content_1: "Чтобы скрыть свою личность, студентки Абидоса надели маски и совершили налет на базу СКЕБАН в Зноймо. Однако найденные там документы показали, что Хяккияко уже подчинила себе СКЕБАН и перевезла задержанных в другое место.\n\nИз-за оплошности Нономи — то ли случайно, то ли намеренно — они получили прозвище «маскированная банда в купальниках». Но, несмотря на смешное название, их боевая мощь была подавляющей.\n\nЧетверо по очереди разгромили силы Хяккияко и, появляясь и исчезая как призраки, обыскали весь город. Они атаковали Брно и Табор, чтобы найти след Серики, и, наконец, получили зацепку: ее перевезли в Хяккияко (Прагу).\n\nНе теряя времени, четверо отправились в Прагу, и это путешествие стало событием, посеявшим семя временного коалиционного правительства."

	ABY_country_intro_content_2: "Ворвавшись в Прагу, студентки Абидоса с точностью сокрушили оборонительные линии и спасли Серику. В процессе они нашли содержащихся там чехословацких государственных деятелей.\n\nАбидос заключил с ними союз и сформировал чешско-абидосское временное правительство. С помощью Эдварда Бенеша — который, даже будучи заключенным, выучил язык Кивотоса, общаясь с охраной, и определил местонахождение разрозненных чешских частей — после побега из Праги они последовательно спасали изолированные чешские войска в Кладно, Мельнике и Йичине, увеличивая свои силы.\n\nХотя в Млада-Болеславе они не смогли ничего, кроме как отдать дань уважения уже уничтоженному отряду, останавливаться было некогда.\n\nВременное правительство двинулось на север и связалось с Группой Нефтис, перемещенной в Либерец, образовав альянс для обеспечения поддержки материалами и финансами.\nКроме того, Асагири Соу, компетентный командир из Группы Нефтис, также присоединилась к ним, став большой помощью в будущих битвах."

	ABY_country_intro_content_3: "Временное правительство двинулось на запад и связалось с ополчением Немецкой партии Судет, которое находилось под давлением Хяккияко.\n\nПод командованием Конрада Генлейна и Карла Германа Франка они защищали свой дом и приняли предложение Абидоса и чешских лидеров, заключив союз.\n\nС тремя объединенными силами коалиционное временное правительство реорганизовало оборонительную линию Судет и вскоре начало полномасштабное наступление на Эгерланд, ключевой стратегический пункт на северо-западе.\n\nПосле ожесточенной битвы они вернули Эгерланд и укрепили оборону, остановив продвижение Хяккияко на север.\n\nС этого момента коалиция стала фактически общей судьбой: интересы каждой силы наконец-то начали совпадать в общих рамках."

	ABY_country_intro_content_4: "В Карловых Варах, крупнейшем городе на севере Судет, коалиционное временное правительство официально укрепило свою базу.\n\nСоюзные силы успешно отразили крупное наступление Хяккияко, пытавшееся прорвать оборонительную линию, и эта победа дала начало переговорам о перемирии 25 декабря, во время рождественского перемирия.\n\nПолитики, генералы и представители Кивотоса собрались для переговоров, и 31 декабря наконец было подписано соглашение о прекращении огня.\n\nВременное правительство Абидоса: государство-союзник, сформированное силами Кивотоса, чехами и немцами. Оно все еще держится. Но... сможет ли эта странная коалиция сохраниться даже после того, как каждый достигнет своих целей?\nСмогут ли они распутать сложные проблемы идеологии и нации, которые их связывают?\n\nТолько время покажет.\n\nБудет ли найден способ развязать гордиев узел? Или, как в старых сказаниях, его в конце концов разрубят?\n"
	ABY_country_intro_content_5: "Три силы нации двух миров договорились сотрудничать для освобождения Чехословакии, Судет и Линца.\n\nВидя это, со стороны Абидос называют, иногда с уважением, иногда с презрением, «нацией двух миров».\n\nЭто прозвище, народы, составляющие его, и даже их идеи... все разнообразно в этой «нации двух миров». Сможет ли она сохранить это имя до конца?\n\nПламя войны на мгновение утихло, но его угли все еще тлеют по всей Европе.\n\nБудущее все еще окутано туманом, и выдержит ли их союз до конца... этот ответ откроется лишь в далеком завтра.\n\n\n§CРазработка - Koi, Mako, .spear_, 민트쿤mintcoon§!\n§YОсобая благодарность - 총괄, Pencildude, Imika, Fraise§!"
	ABY_guide: "§YЦели§!\n\n£white_dot §4Создайте временное коалиционное правительство и разработайте операцию по освобождению Богемии, Судет и Линца.§!\n£white_dot §4С помощью Сенсея помогите студенткам Абидоса преодолеть свои недостатки и травмы.§!\n£white_dot §4Получите приветствие от австрийцев и удовлетворите их требования.§!\n£white_dot §4Освободите Австрию и создайте федеральное правительство.§!\n\n    £white_dot §CОстановите заговор Совета просвещения и создайте стабильное демократическое правительство, чтобы восстановить наследие Масарика.§!\n        £white_dot §YНайдите способ сосуществования двух миров.§!\n            £white_dot §gВосстановите Чехословакию и Малую Антанту.§!\n            £white_dot §gЗащитите родину от вражеских вторжений и создайте там демократическое правительство.§!\n            £white_dot §gПредставьте путь к новой объединенной Европе.§!\n        или же...\n        £white_dot §YНайдите способ объединения двух миров.§!\n            £white_dot §gСоздайте федеративную республику и откажитесь от гегемонии Абидоса ради великого дела.§!\n            £white_dot §gЗащитите родину от вражеских вторжений и создайте там другую бикультурную республику.§!\n            £white_dot §gСозовите конференцию для евро-кивотосского объединения и продолжайте двигаться вперед.§!\n\n    £white_dot §tНайдите способ защитить Федерацию от государственного переворота.§!\n        £white_dot §YВедите переговоры с ними и гарантируйте безопасность Комитета контрмер.§!\n            £white_dot §gВыйдите на улицы с цветами и пойте, чтобы вернуть утраченную свободу.§!\n            £white_dot §gНе отступайте перед ружьями. Взывайте к солдатам.§!\n            £white_dot §gРади свободы используйте все средства, кроме насилия.§!\n        или же...\n        £white_dot §YОткажитесь от переговоров с путчистами.§!\n            £white_dot §gСкройтесь в подполье, чтобы избежать политических репрессий военного командования.§!\n            £white_dot §gОбъедините партии вокруг Партии федерального единства и создайте Народный фронт.§!\n            £white_dot §gВосстаньте с поддержкой СССР и победите фашистский режим.§!\n                £white_dot §gКак острие Советского Союза, поднимите меч против Кивотоса.§!\n                £white_dot §gПроведите чистки и подавите оппозицию, чтобы укрепить личную диктатуру.§!\n                £white_dot §gПодавите великий протест, возникший в Праге.§!\n            или же...\n            £white_dot §gВосстаньте своими силами и восстановите дарованную нам демократию.§!\n                £white_dot §gНе дайте Народному фронту распасться и создайте солидарность.§!\n                £white_dot §gОпубликуйте осуждение экстремизма и остановите вторжение обоих миров.§!\n                £white_dot §gЗаложите основы социал-демократии и двигайтесь к реформе.§!\n\n    £white_dot §0Свергните федеральное правительство путем переворота и уничтожьте оппозицию.§!\n        £white_dot §YИз мести ветеранов, бросьте все и идите вперед.§!\n        или же...\n        £white_dot §YПритворяйтесь перед миром, чтобы уничтожить все, что связано с Абидосом.§!\n            £white_dot §gПровозгласите себя лидером и спасителем, и сосредоточьте всю власть.§!\n            £white_dot §g«Очистите» местных жителей, понизив их ниже кивотосцев, и обеспечьте жизненное пространство.§!\n            £white_dot §gУничтожьте устаревшую культуру Кивотоса и замените ее «просвещенной» культурой.§!\n            £white_dot §gВ конце концов, уничтожьте Восточную Азию и Америку и превратите эту планету в новый дом для кивотосцев.§!\n            £white_dot §R...и вспомните, что на самом деле вы хотели сделать.§!\n\n§YКак войти в пути§!\n\nДо операции «Падающие лепестки» происходит 12 событий этики; через их выборы формируется федеральная этика.\n\nИнклюзивизм <-> Плюрализм\nЭгалитаризм <-> Авторитаризм\nИндивидуализм <-> Коллективизм\nНационализм\n\nОна делится на 3 противоположные этики и 1 независимую этику.\nВ противоположных этиках считается выбранной та, что сильнее.\nЭтика национализма, если она фанатичная, игнорирует остальные; если не фанатичная, она игнорируется для выбора пути.\nПри завершении фокуса «Самая длинная ночь Федерации» последующие политические фокусы определяются в зависимости от федеральной этики, которой вы обладаете.\n\nЛокал (местная жительница) - Инклюзивизм / Эгалитаризм / Коллективизм\nАянэ - Плюрализм / Авторитаризм / Коллективизм\nХосино - Плюрализм / Эгалитаризм / Коллективизм\nСерика (Южный Кивотос) - Инклюзивизм / Эгалитаризм / Индивидуализм\nСерика (Абидос) - Инклюзивизм / Авторитаризм / Коллективизм\nСироко (Демократия) - Плюрализм / Эгалитаризм / Индивидуализм\nСироко (Диктатура) - Плюрализм / Авторитаризм / Индивидуализм\nНономи - Инклюзивизм / Авторитаризм / Индивидуализм\nСоу - Национализм\n\n\n§CРазработка - Koi, Mako, .spear_, 민트쿤mintcoon§!\n§YОсобая благодарность - 총괄, Pencildude, Imika, Fraise§!"
	ABY_GATHERING_STORM_DESC: "Старшая школа Абидоса когда-то была самой большой и богатой академией Кивотоса, но все более сильное опустынивание и непрерывно растущий долг привели к ее упадку. Пятеро оставшихся студенток Абидоса отчаянно боролись, чтобы защитить свою школу.\n\nПосле Великого Перемещения ситуация вступила в новую фазу. Долг, который их связывал, исчез; маленький автономный округ, напротив, очень помог сдерживать столкновения между жителями и местными; и они смогли получить сотрудничество местного населения.\nНо зато конфликты между самими местными жителями в этом регионе стали проблемой.\nЭто будет необходимо решить."

