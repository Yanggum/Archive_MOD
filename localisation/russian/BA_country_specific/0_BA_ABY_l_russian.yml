	ABY_new_event.149.t: "Присоединение чешского сопротивления"
	ABY_new_event.149.d: "После того как силы Хяккияко отошли из [9.GetName], организация сопротивления, действовавшая в этом районе, связалась с армией коалиционного правительства. Они были вооружены легким личным оружием и частью трофейного снаряжения. После переговоров между командирами члены сопротивления были включены в официальную цепочку командования армии коалиции. Благодаря этому гарнизон [9.GetName] был немедленно усилен."
	ABY_new_event.149.a: "Добро пожаловать!"

	ABY_new_event.150.t: "Присоединение чешского сопротивления"
