	ABY_political: "Борьба за влияние"
	ABY_political_desc: "\nВременный текст: различные этносы и фракции смешаны и борются за влияние.\n\n\n§YПосле освобождения Богемии политическое направление будет определено в зависимости от политической ситуации!§!\n\nЕсли §2Демократия§! находится §Yу власти§!, власть будет передана Чешскому временному правительству.\n\nЕсли §RКоммунизм§! находится §Yу власти§!, ???\n\nЕсли §LФашизм§! находится §Yу власти§!, возродится Австрийская Республика.\n\nЕсли §gНеприсоединившиеся§! находятся §Yу власти§!, старшая школа Абидоса возьмет инициативу.\n§YЕсли вы завершите фокус экономического контроля Абидоса, инициативу возьмет Группа Нефтис!§!\n"
