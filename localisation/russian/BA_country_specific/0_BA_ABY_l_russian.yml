	ABY_czech_head_1_trait: "§YОтец Богемии§!\n  Стабильность: §G+30.00%§!\n  Получение политической власти: §G+15%§!\n  Ежедневная поддержка демократии: §G+0.10§!\n\nТомаш Гарриг Масарик родился 7 марта 1850 года в Годонине, Моравия. Достигнув юности, как философ и социальный реформатор, сыграл пионерскую роль в чешском национальном движении, основанном на австрославизме. Он посвятил себя автономии чешского народа в рамках Австро-Венгерской империи, но во время Первой мировой войны, отражая международную обстановку, перешел к линии чехословацкой независимости и способствовал провозглашению независимости 28 октября 1918 года. В том же году, 14 ноября, стал первым президентом, сыграв решающую роль в строительстве государства и установлении демократии; ушел с поста президента в 1935 году. Однако с Великим Перемещением снова стал лидером чешского временного правительства и, несмотря на преклонный возраст, снова прилагает усилия ради освобождения Чехии."
	ABY_czech_head_2_trait: "§YАктивист сопротивления§!\n  Модификатор призывного населения: §G+15%§!\n  Поддержка войны: §G+10.00%§!\n\nЭдвард Бенеш родился 28 мая 1884 года в Богемии, в составе Австро-Венгерской империи. Как ученик Томаша Масарика, посвятил себя чешскому национально-освободительному движению. Отличился в дипломатии и администрации, занимал несколько ключевых правительственных постов и работал над повышением международного престижа Чехословакии. В 1935 году стал вторым президентом. После Великого Перемещения Чехословакия рухнула, и было создано чешское временное правительство; после отставки Масарика в 1937 году Бенеш стал новым лидером чехов и, как преемник Масарика, посвящает себя освобождению Чехии."
	ABY_german_head_1_trait: "§YАрбитр демократии§!\n  Еженедельная стабильность: §G+0.50%§!\n  Ежедневная поддержка фашизма: §R-0.10§!\n  Ежедневная поддержка демократии: §G+0.10§!\n\nЛюдвиг Чех родился 14 февраля 1870 года во Львове. Юрист и политик, говорящий по-немецки еврейского происхождения, унаследовал социал-демократическую традицию конца Австро-Венгерской империи и после основания Чехословакии с 1929 года занимал пост министра в области социального обеспечения; впоследствии также занимал важные должности в области общественных работ, посвятив себя защите прав и интересов чехословаков немецкого происхождения. Однако после Великого Перемещения, как самый высокопоставленный немецкий чиновник в чехословацком правительстве, стал представителем судетских немцев. Кроме того, его здоровье ухудшается день ото дня из-за последствий ранения пулей во время Великого Перемещения."
	ABY_german_head_2_trait: "§YСудетский националист§!\n  Стабильность: §G+15.00%§!\n  Получение политической власти: §R-10%§!\n  Призывное население: §Y-0.50%§!\n  Ежедневная поддержка неприсоединения: §R-0.10§!\n\nКонрад Генлейн родился 24 мая 1898 года в регионе с немецким населением в составе Австро-Венгерской империи. В юности стал главной фигурой немецкого автономистского движения в Чехословакии. В начале 1930-х годов, как лидер Немецкой партии Судет, активно работал над укреплением организации и единства партии, сыграв центральную роль в пробуждении политического сознания судетов. После Великого Перемещения внезапно получил поддержку большинства судетских немцев и внутри коалиционного правительства стал политической фигурой, влиянием уступающей только Масарику. После смерти Чеха официально стал немецким представителем, но испытывает огромное давление из-за ситуации."
	ABY_abydos_head_trait: "§YЩит Абидоса§!\n  Поддержка войны: §G+10.00%§!\n  Атака дивизий на основной территории: §G+10.0%§!\n  Мод. стабильности от штрафа оборонительной войны: §G+20.00%§!\n\nТаканаши Хосино, единственная ученица 3-го года Старшей школы Абидоса и духовная опора Комитета контрмер, на первый взгляд кажется просто милой ленивицей, обожающей спать. Глядя на ее спокойные действия, она больше похожа на милую кохай, чем на внушительную сенпай. Однако, когда ее любимая Старшая школа Абидоса и ее кохаи оказываются в опасности, она проявляет такую силу и справедливость, что забываешь о той мягкости и нежности. Хотя она склонна поддаваться эмоциям, ее исключительная боевая способность скрывает даже эту опрометчивость, и она способна сломать все, что стоит на ее пути, и двигаться вперед. Тем не менее, даже она иногда проявляет неуклюжую и странную сторону. Если ее кохаи спрашивают об этом, она избегает ответа.\n\nКакой невысказанный секрет она хранит в своем сердце?"

