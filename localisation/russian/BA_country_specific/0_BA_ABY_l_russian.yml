	ABY_shiroko_fas_outdoor_tt: "За каждое определенное количество союзников: §G15§!\nЗа каждое определенное количество марионеток: §G5§!\nУнаследовать Малую Антанту: §G30§!\nПредложить Федеральный закон: §G30§!\nЗа каждую успешную дипломатию: §G10§!\nЗа каждый успешный переворот: §G20§!"
	ABY_shiroko_fas_indoor_tt: "Провозгласить Великий Абидос: §G30§!\nЗа каждую основную территорию: §G2§!\nЗа каждую основную территорию с культурной инфраструктурой: §G3§!\nПредложить Федеральный закон: §G30§!\nВосстановить главное здание Абидоса: §G15§!\nЗа каждый конкретный внутренний фокус: §G10§!"

