	ABY_idea_eocordnldnjsghl_4_1_desc: "Комитет контрмер по предотвращению закрытия Абидоса был клубом, созданным, чтобы не допустить закрытия Старшей школы Абидоса.\nНо теперь, после неизвестного феномена, Комитет взвалил на себя тяжелую миссию: защищать не только Старшую школу Абидоса, но и близлежащие городские районы и даже местных жителей.\nНовые контрмеры, которые им предстоит выработать, никогда не будут простыми.\n\n§YКомитет контрмер§!\n§P- Таканаши Хосино §!\n§4-§! £GFX_BA_mika \n§7-§! £GFX_BA_mika \n§1-§! £GFX_BA_mika \n§t-§! £GFX_BA_mika "
	ABY_idea_eocordnldnjsghl_4_2: "Комитет контрмер"
	ABY_idea_eocordnldnjsghl_4_2_desc: "Комитет контрмер по предотвращению закрытия Абидоса был клубом, созданным, чтобы не допустить закрытия Старшей школы Абидоса.\nНо теперь, после неизвестного феномена, Комитет взвалил на себя тяжелую миссию: защищать не только Старшую школу Абидоса, но и близлежащие городские районы и даже местных жителей.\nНовые контрмеры, которые им предстоит выработать, никогда не будут простыми.\n\n§YКомитет контрмер§!\n§P-§! £GFX_BA_mika \n§4- Сунаоками Сироко §!\n§7-§! £GFX_BA_mika \n§1-§! £GFX_BA_mika \n§t-§! £GFX_BA_mika "

	ABY_idea_czech_comming: "Чешское изгнание"
	ABY_idea_czech_comming_desc: "Из того, что они называют «Богемией», древнего сердца Чехии, прибывает массовая волна чешских изгнанников.\nОни горят решимостью и жаждой мести и решили сотрудничать с нами."
	ABY_idea_no_people: "Нехватка административного персонала"
	ABY_idea_no_people_desc: "Государственная система не работает только с главой государства и его министрами. На самом деле можно сказать, что оперативный персонал на нижних уровнях даже более важен, но прямо сейчас у нас нет этого персонала.\n\n§YЕсли мы восстановим контроль над Временным правительством, мы сможем улучшить ситуацию.§!"
