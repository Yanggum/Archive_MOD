	ABY_new_event.152.a: "Добро пожаловать!"

	ABY_new_event.153.t: "Неожиданный освободитель"
	ABY_new_event.153.d: "Тема: Освобождение всей Австрии и интеграция в Федерацию\nОтправитель: Командир гарнизона Линца, Асагири Соу\n\nКраткое содержание доклада:\nПосле вступления армии коалиции в Линц и Хорн сопротивление Шанхайцзина оказалось меньше ожидаемого. Примечательна реакция местных жителей Австрии: они с энтузиазмом встречают наши силы, называя нас «освободителями от Шанхайцзина». Эта поддержка уже не просто симпатия, а перерастает в активное желание сотрудничать. Предлагается воспользоваться ситуацией, чтобы освободить всю Австрию и интегрировать ее в Федерацию в качестве нового члена.\n\nВ зале Верховного совета в Карловых Варах, после окончания чтения, Бенеш открыл рот с удовлетворенным выражением.\n\n«Со стратегической точки зрения это прекрасная возможность. Мы полностью устраним угрозу с южной границы и сможем распространить свое влияние до Дуная.»\n\nКак будто это было очевидно, он посмотрел на Генлейна. Генлейн на мгновение потер подбородок и заговорил осторожно.\n\n«Несомненно, стратегические преимущества очевидны. Но есть один момент, который мы должны учесть. Как вы знаете, наша коалиция держится на трех уникальных столпах: чехи, Абидос и «судетские» немцы. Это равновесие — наша сила.»\n\nЕго голос был рациональным и спокойным.\n\n«Если мы примем Австрию, возникнет более широкая категория: «немцы». И тогда может размыться особая позиция и роль, которые мы, судетские немцы, построили. Ради стабильности Федерации, возможно, правильнее будет сначала укрепить сплоченность нынешних членов.»\n\nОн ни разу не произнес слов «судетский национализм», но его намерение было недвусмысленным. Лицо Бенеша слегка напряглось. В этот момент вмешалась Аянэ, до сих пор молчавшая.\n\n«Я согласна с осторожностью господина Генлейна. Роли и права трех столпов, образующих основу Федерации, важнее всего. Тогда что, если мы воспользуемся этой возможностью, чтобы сделать это еще яснее?»\n\nАянэ переглянулась с Бенешем, и Бенеш, уловив ее намерение, коротко кивнул. Аянэ повернулась к Генлейну.\n\n«Прежде чем одобрить операцию, давайте официально подтвердим основополагающие принципы Федерации с помощью клятвы. Пусть Чехия и Абидос признают «судетских немцев» самостоятельным и независимым членом нашей Федерации и поклянутся, что их автономия и права не будут нарушены ни при каких будущих обстоятельствах.»\n\nЛегкая улыбка появилась на губах Генлейна. Он получил именно то, что хотел.\n\n«Предложение госпожи Аянэ очень разумно. Если это обещание будет предпослано, я также с радостью поддержу расширение Федерации.»"
	ABY_new_event.153.a: "В разговоре этих закаленных политиков «Нация Двух Миров» единогласно решила двигаться на юг."

	ABY_new_event.174.t: "Территориальные переговоры"
	ABY_new_event.174.d: "Заполните содержимое здесь"
	ABY_new_event.174.a: "Согласен."
	ABY_new_event.174.b: "Мы оккупируем это."

	ABY_new_event.175.t: "Предложение об интеграции в Европейскую Федерацию"
	ABY_new_event.175.d: "Заполните содержимое здесь"
	ABY_new_event.175.a: "Хорошо."
	ABY_new_event.175.b: "Мы останемся независимой страной."

	ABY_new_event.201.t: "Восстание судетских немцев!"
	ABY_new_event.201.d: "Подтверждено, что в Богемии также существовали независимые организации, объединенные Абидосом под флагом этнической автономии в нескольких регионах Богемии!\n\nТеперь эти силы объявили революционное восстание против нас в сотрудничестве с военными усилиями Абидоса, и в Силезском регионе Судет уже идут бои."
	ABY_new_event.201.a: "Черт возьми!"

	ABY_new_event.202.t: "Успешное восстание судетского ополчения!"
	ABY_new_event.202.d: "Мы получили информацию, что организованное нами судетское немецкое ополчение провозгласило революцию в Силезском регионе Судет! Без сомнения, это будет большой помощью нашей победе в войне."
	ABY_new_event.202.a: "Хорошо!"

	ABY_new_event.206.t: "Мятеж подавлен"
	ABY_new_event.206.d: ""
	ABY_new_event.206.a: "Хорошо!"
	ABY_new_event.206.b: ""
	ABY_new_event.206.c: ""

	ABY_new_event.209.t: "Возвращение Временного правительства"
	ABY_new_event.209.d: "Эдвард Бенеш, сидя в автомобиле, молча созерцал дорогу, медленно ведущую в Прагу. Это был факт, которым можно было гордиться: они освободили Богемию благодаря победе союзников. Но его сердце становилось все тяжелее. Он уже знал из рассказов, как его родина должна была быть отмечена следами Хяккияко... но пейзаж, разворачивающийся перед его глазами, намного превосходил все, что он себе представлял.\n\nЧем ближе они подъезжали к городу, тем отчетливее становились черты японской архитектуры. Улицы, покрытые черепичными крышами, сады в японском стиле, красные тории, полностью заменившие знакомый ему пейзаж. Большинство чешских зданий, когда-то составлявших сердце Праги, исчезли, а те, что остались, были изменены в японской эстетике.\n\nБенеш глубоко вздохнул, глядя в окно. Он знал, что эти изменения неизбежны. Он уже получал отчеты и принимал реальность того, что на их отмену потребуется время. Но видеть Прагу своими глазами было намного страннее и тревожнее, чем он чувствовал в своем воображении.\n\nКарлов мост через Влтаву тоже причинил ему боль. Мост остался нетронутым, но японские фонари, висящие на его перилах, светили чужим светом. От того Карлова моста, который он помнил, символа чешской гордости, не осталось и следа.\n\n«Неужели... это Прага...?» пробормотал Бенеш. В его голосе смешивались сложные эмоции.\n\nОн вспомнил Прагу прошлого: величественный силуэт собора Святого Вита, горожане, поющие о свободе на площади. Город перед ним, казалось, предавал все эти воспоминания.\n\nТем не менее, он попытался взять себя в руки. То, что Прага сохранила такой облик, не означало, что чешский дух исчез. Изменить город займет время, но вернуть ему чешскую душу все еще возможно.\n\nВ тот день небо над Прагой было покрыто густыми облаками, но в сердце Бенеша горела яркая надежда."
	ABY_new_event.209.a: "«Это только начало»."

	ABY_new_event.211.t: "Ротшильд"
	ABY_new_event.211.d: ""
	ABY_new_event.211.a: "К этой славе, еще раз."

	ABY_new_event.229.t: "Уведомление для игроков Абидоса"
	ABY_new_event.229.d: "Привет. Я Mintcoon, моддер, ответственный за Абидос.\n\nПрежде всего, я хотел предложить вам новый опыт, тестируя различные изменения после первого реворка Абидоса, но приношу свои искренние извинения за то, что из-за моего недостаточного планирования и навыков моддинга результат в итоге страдал от частых перезапусков и провалов. Особенно я сожалею и глубоко размышляю о том факте, что во время реворка, из-за неоднозначного использования и смешивания уже существующих систем, возникло много багов и структурных проблем.\n\nВпредь реворки будут проводиться только после достаточной подготовки и проверки, и я постараюсь, чтобы после следующего реворка не было крупных переделок.\nОднако из-за различных проблем в реальной жизни — особенно академических трудностей — я был вынужден принять решение временно приостановить разработку Абидоса до середины ноября. Пожалуйста, поймите, что в такой занятой ситуации, если бы я форсировал реворк основной страны, такой как Абидос, я боюсь, что те же самые проблемы прошлого повторятся.\n\nДо середины ноября я буду время от времени разрабатывать второстепенные страны, такие как Египет, и в этот период планирую сосредоточиться на базовой подготовке, чтобы еще больше повысить качество Абидоса. Хотя процесс может занять время, даже если на мгновение обо мне забудут, я сделаю все возможное, чтобы вернуться с версией, настолько впечатляющей, что она запечатлеется в вашей памяти, как только вы вернетесь.\n\nЯ глубоко благодарен за ваше великодушие и постоянный интерес и сделаю все возможное, чтобы снова встретиться с вами с улучшенной версией."
	ABY_new_event.229.a: "Спасибо."
	ABY_new_event.229.b: ""

	ABY_new_event.230.t: "Отчет об исследовании - Тринити"
	ABY_new_event.230.d: "Краткое содержание: Отчет о сотнях трупов и медицинском оборудовании, найденных под Великим Собором Тринити.\nПримечание: Перед входом в Великий Собор многие записи были сожжены или уничтожены, поэтому не хватает проверяемых материалов.\n\n1. Рядом с трупами были найдены в больших количествах сыворотка Мистицизма и ткацкий станок/ткач Мистицизма, среди прочего.\n\n2. Причина смерти, общая для всех, предположительно — полная полиорганная недостаточность или остановка сердца из-за перегрузки соматической мускулатуры и самоуничтожающейся иммунной активации.\n\n3. У всех трупов наблюдались значения Мистицизма выше нормального диапазона.\n\n4. Были найдены, хотя и без проверяемого содержания, приказы Чайной партии и другие документы, поэтому предполагается операция под руководством правительства Тринити.\n\n5. Дата смерти в целом совпадает с периодом кампании Тринити по «поддержке бездомных и социально дезадаптированных».\n\nЗаключение: Считается вероятным, что это были эксперименты над людьми в рамках проекта инъекции Мистицизма животным, проводившегося в Исследовательском центре Мистицизма Абидоса. Однако, поскольку большая часть данных была уничтожена, не удалось извлечь значимых результатов, кроме подтверждения того, что при инъекции Мистицизма людям без соответствующих мер возникает реакция, аналогичная животным, и наступает смерть. Требуется поддержка с более широкими исследовательскими материалами.\n\nИсследовательская группа Мистицизма № 37, отряд в Великом Соборе."
	ABY_new_event.230.a: "Утверждено."

	ABY_new_event.231.t: "Отчет об исследовании - Геенна"
	ABY_new_event.231.d: "Краткое содержание: Следы, подобные экспериментам над людьми в Тринити, были найдены в крупном гражданском сооружении недалеко от центрального района Геенны. Не наблюдалось признаков вмешательства Общества Пандемониум или Дисциплинарного комитета, поэтому считается действием гражданского клуба. Успешных образцов не было, но получено значительное количество данных.\n\n1. В целом напоминает подземные медицинские сооружения Великого Собора, но лишено базовой исследовательской среды, такой как гигиена и т.д.\n\n2. Была подробно зарегистрирована летальная доза по весу и ИМТ. При превышении определенного порога смерть наступает мгновенно; подробные цифры прилагаются.\n\n3. В заметках исследователя или личных блокнотах не найдено следов приказов Общества Пандемониум или Дисциплинарного комитета; скорее, похоже, что Дисциплинарный комитет выслеживал их.\n\n4. При инъекции Мистицизма ниже летальной дозы физические способности непрерывно возрастают; в критической точке достигается сила, подобная силе кивотосца, но мышечная ткань полностью разрушается за считанные секунды и наступает смерть.\n\n5. Проводились эксперименты на животных с экстраполяцией значений, но не удалось получить производительности, сравнимой с захваченными данными. Считается, что вне людей значительных эффектов не будет.\n\nЗаключение: Представляется необходимым использование вспомогательных средств, таких как стабилизаторы, при инъекции Мистицизма. Поскольку эксперименты на животных не могут дать значимых результатов, предлагается, неизбежно, приступить к экспериментам на людях на основе текущих данных.\n\nИсследовательская группа № 26, отряд в центральном районе."
	ABY_new_event.231.a: "Утв(…удалено)\nОтказано."

	ABY_new_event.232.t: "Отчет об исследовании - Миллениум"
	ABY_new_event.232.d: "Краткое содержание: Под исследовательским учреждением, связанным с Семинаром в Миллениуме, были найдены следы массовых исследований инъекций Мистицизма. Большинство данных сохранились нетронутыми.\n\n1. По масштабу данных оценивается, что было задействовано как минимум десятки тысяч человек. Поэтому были найдены более подробные цифры, чем в Геенне. Прилагаются.\n\n2. Хотя это находится в учреждении Семинара, в исследовательских блокнотах и личных записях нет упоминаний об их одобрении или прямых ссылок, поэтому нельзя подтвердить, был ли Семинар замешан.\n\n3. Примерно через неделю диализа и приема/инъекции высокотоксичных препаратов удалось подавить самоуничтожающийся иммунитет, активирующийся при инъекции Мистицизма.\n\n4. Тем же методом удалось отсрочить разрушение тела, но результаты указывают на то, что продолжительность жизни ограничится примерно 5 годами.\nПримечание: Классифицировано как совершенно секретное дело.\n\n5. Предполагается, что подопытные были «подготовлены», и найдены следы последующего исследовательского плана по предотвращению сокращения жизни. План: дополнительная инъекция Мистицизма кивотосца, …, инъекция Мистицизма плодам, … (опущено). См. приложения.\nПримечание: Классифицировано как совершенно секретное дело.\n\nЗаключение: Дополнительные расчеты на основе данных подтверждают, что, как бы ни откладывалось разрушение, невозможно отсрочить его более чем на 10 лет.\n\nДополнительный отчет: Наблюдается прогресс в экспериментах с механизированными костюмами, подстегнутый абсолютным запретом на эксперименты над людьми и получением этих данных. Однако для продвижения к практическим исследованиям требуется сотрудничество с военными, и кажется неизбежным раскрытие части этих материалов, поэтому запрашивается разрешение.\n\nИсследовательская группа № 3, отряд в Миллениуме."
	ABY_new_event.232.a: "В ожидании."

	ABY_new_event.233.t: "Краткое содержание отчета о министерском совещании № 395, глава 86"
	ABY_new_event.233.d: "Разгорается спор о публикации или непубликации данных из исследовательского отчета Миллениума.\n\nДостигнуто соглашение опубликовать часть данных для гражданского сектора.\n\nДетальные данные будут раскрыты армии с правилами, предотвращающими утечку для лиц ниже ранга генерала.\n\n(пропуск)\nКраткое содержание № 396, глава 3\n\nПодтвержден детальный отчет по плану «Джаггернаут».\nСпор мнений из-за требуемого чрезмерного бюджета.\n\nЗапись удалена.\n\nОкончательное заключение вынесено."
	ABY_new_event.233.a: "План Джаггернаут утвержден."
	ABY_new_event.233.b: "План Джаггернаут отклонен."

	ABY_new_event.234.t: "Отчет Министерства экономики: выбор корпорации"
	ABY_new_event.234.d: "Для концентрации ограниченных государственных ресурсов и закладки основ экономического восстановления рассматриваются как особенно жизнеспособные следующие три компании в качестве ключевых партнеров.\n\n· Группа Нефтис (НИОКР): Обладает уникальной исследовательской способностью в Кивотосе. Не имеет немедленной производственной базы, но обладает потенциалом для долгосрочного обеспечения технологической самодостаточности и гегемонии в отраслях будущего.\n\n· Корпорация Ротшильд (финансы): Незаменима для восстановления рухнувшей финансовой системы и привлечения внешнего капитала. Самый безопасный вариант для установления стабильного экономического оборота.\n\n· Škoda Works (тяжелая промышленность/вооружение): Обеспечивает немедленные эффекты для реагирования на текущие военные угрозы и усиления обороноспособности. Наиболее реалистичная альтернатива для военной самодостаточности коалиции."
	ABY_new_event.234.a: "Ротшильд и К°"
	ABY_new_event.234.b: "Škoda Works"
	ABY_new_event.234.c: "Группа Нефтис"

	ABY_new_event.235.t: "Асагири Соу"
	ABY_new_event.235.d: "Асагири Соу, способный командир, который во время Великого Перемещения собрал PMC Нефтис после потери своего верховного командования, сопротивлялся Хяккияко и во время бегства из Праги поддерживал Временное правительство бронепоездом, сегодня официально пообещала покинуть Железнодорожную академию Хайлендер и служить командиром армии Временного правительства.\n\nБлагодаря этому PMC Нефтис под ее командованием (официально принадлежащая Группе Нефтис) также перешла в состав армии Временного правительства.\n\nВременное правительство выражает глубокую благодарность, и она также принесла присягу на верность."
	ABY_new_event.235.a: "С таким способным человеком на нашей стороне будущее Временного правительства выглядит светлым!"

	ABY_new_event.236.t: "Спасибо за игру!"
	ABY_new_event.236.d: "Бета-контент Абидоса завершен. Увидимся в следующем обновлении! Если хотите продолжить игру, нажмите на опцию ниже."
	ABY_new_event.236.a: "Продолжить игру"

 
