	ABY_descision_category_shiroko_fas: "Клятвы революции"
	ABY_shiroko_fas_info_tt: "\n§YДа здравствует Ее Превосходительство президент Сунаоками Сироко!§!\n\nЕе Превосходительство, вступая в должность, объявила §YКлятвы революции§!.\n§YКлятвы революции§! делятся на §Cвнутреннюю политику§! и §Cвнешнюю политику§!, и за каждые §G30§! очков прогресса в каждой части, при завершении фокуса §YЗолотой трон§! увеличится эффект полученной черты!\n§RНаивная волчица все еще верит, что это путь к демократии.§!"
	ABY_shiroko_fas_indoor_head_tt: "§CВнутренняя политика§!\nТекущий счет: §G[?var:ABY_var_shiroko_indoor]§!"
