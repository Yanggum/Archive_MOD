 # 오스트리아 유화 정책
 SHA_Austrian_appeasement_policy: "Политика умиротворения Австрии"
 SHA_Austrian_appeasement_policy_desc: "Австрийцы изначально были хозяевами этих земель. Однако практически невозможно вернуть им территорию. Поэтому самым мудрым выбором было бы подчинить их системе с помощью политики умиротворения, а не жестких мер."
 SHA_gathering_of_radicals: "Собрание радикалов"
 SHA_gathering_of_radicals_desc: "Лидер Врат Дракона, проводя политику умиротворения Австрии, игнорирует традиции Шанхайцзин. Это явно разрушает наши традиции и подвергает Шанхайцзин новым угрозам. Чтобы защитить нашу любимую академию, мы должны свергнуть $SHA_KISAKI$ с власти!"
 SHA_Cooperation_with_Kaguya: "Сближение с Оперной труппой Пекина"
 SHA_Cooperation_with_Kaguya_desc: "Оперную труппу Пекина можно считать, возможно, самой лояльной группой в Шанхайцзин. Однако, чтобы свергнуть нынешнего лидера, который игнорирует их советы и действует в одностороннем порядке, сотрудничество с ними необходимо."
 SHA_podium_room_cooperation: "Сближение с Обществом алхимии"
 SHA_podium_room_cooperation_desc: "Ходят слухи, что некоторые радикалы, последователи Синтани Кай, собираются в Обществе алхимии. Если нам удастся связаться с ними, они могут оказать большую помощь в свержении нынешнего лидера."
 SHA_Kisaki_Suppression: "Подавление Кисаки"
 SHA_Kisaki_Suppression_desc: "Время пришло! Подготовлена пекинская опера, чтобы разоблачить глупость нынешнего лидера. Сотрудничая с Оперной труппой Пекина и некоторыми радикалами Врат Дракона, мы используем представление как возможность сместить лидера и короновать $SHA_KAGUYA$ как нового лидера."

# Ruta Shintani Kai
 SHA_Shintani_Kai_Follow: "Реабилитация Синтани Кай"
 SHA_Shintani_Kai_Follow_desc: "Хотя Синтани Кай была проблемой, вызвавшей несколько беспорядков в Шанхайцзин, она была несправедливо изгнана без надлежащего процесса тираническими действиями $SHA_KISAKI$. Теперь мы вернем ее обратно."
 SHA_Kaguya_ousted: "Изгнание $SHA_KAGUYA$"
 SHA_Kaguya_ousted_desc: "С помощью Оперной труппы Пекина нам удалось свергнуть $SHA_KISAKI$. Но теперь Оперная труппа Пекина — не более чем бесполезная обуза. Сотрудничая с Обществом алхимии, мы атакуем Оперную труппу Пекина, чтобы свергнуть $SHA_KAGUYA$ с поста лидера и взять под контроль Врата Дракона."
 SHA_Shanhaijing_fascism: "Фашизм Шанхайцзин"
 SHA_Shanhaijing_fascism_desc: ""
 SHA_Eastern_Alchemy_Society_solidarity: "Солидарность с Восточным обществом алхимии"
 SHA_Eastern_Alchemy_Society_solidarity_desc: ""
 SHA_consolidate_industries: "Консолидация австрийской промышленности"
 SHA_consolidate_industries_desc: ""
 SHA_Sundan_dosage: "Ускорение разработки Сундань"
 SHA_Sundan_dosage_desc: "Чтобы выполнить цель и причину существования Шанхайцзин, и ради амбиций Синтани Кай, мы должны ускорить разработку Сундань."
 SHA_Expansion_of_military_factories: "Расширение военных заводов"
 SHA_Expansion_of_military_factories_desc: ""
 SHA_podium_room_expansion: "Расширение Общества алхимии"
 SHA_podium_room_expansion_desc: "Будет полезно расширить его."
 SHA_cult_of_personality: "Культ личности"
 SHA_cult_of_personality_desc: ""
 SHA_great_commander: "Великий командующий"
 SHA_architect_of_fascism: "Архитектор фашизма"
 SHA_Seonin: "\"Бессмертный\""

 SHA_ascension: "Вознесение"
 SHA_ascension_desc: ""
 SHA_Alchemy_and_modern_science: "Алхимия и современная наука"
 SHA_Alchemy_and_modern_science_desc: ""
 SHA_supremacy_of_will: "Превосходство воли"
 SHA_supremacy_of_technology: "Превосходство технологии"
 SHA_Twilight_of_the_Gods: "Сумерки богов"
 SHA_Twilight_of_the_Gods_desc: "Пока пламя яростно горит, Рейн омывает крематорий. Тогда три девы Рейна появляются у тлеющих углей. Когда Хаген видит, что они ищут кольцо, он снимает доспехи и прыгает в разлившиеся воды. Но две девы утаскивают его в глубину, а третья находит кольцо и радуется. Небо окрашивается в красный, пока постепенно появляется зал Вальхаллы. Боги и герои, сидящие в Вальхалле, охвачены огромным пламенем, и огонь пожирает все, когда занавес падает."
 SHA_Ragnarok: "Рагнарёк"
 SHA_Ragnarok_desc: "Черный волк пожирает небо, змеиный яд окрашивает море.\nРог звучит, война начинается, боги идут к своей судьбе.\n\nОгненный конь скачет по земле, великан сбивает солнце.\nНо когда пламя все поглотит, новый мир снова прорастет."
 l_spanish:

# 보수 혁명 루트
 SHA_conservative_revolution: "Консервативная революция"
 SHA_conservative_revolution_tt: "Преобразует текущую §Yподдержку фашизма§! в §Yподдержку нейтралитета§!."
 SHA_conservative_revolution_desc: "Годами в Шанхайцзин не было настоящего консервативного лидера, и, учитывая краткое правление предыдущего лидера, этот упадочный вакуум тянулся десятилетиями. Это лицемерие должно прекратиться. Мы должны реорганизовать Шанхайцзин в соответствии с идеалами истинных патриотов через великую Консервативную революцию."
 SHA_new_shanhaijing_conservatism: "Новый консерватизм Шанхайцзин"
 SHA_new_shanhaijing_conservatism_desc: "Годами консерватизм Шанхайцзин был испорчен и осквернен, сведен к инструменту политиков. Теперь мы должны вернуть его идеологическую чистоту, чтобы восстановить истинный консерватизм. Пришло время переопределить суть консерватизма Шанхайцзин и восстановить его ценности."
 SHA_Expansion_of_cooperation_with_other_clubs: "Расширение сотрудничества с другими клубами"
 SHA_Expansion_of_cooperation_with_other_clubs_desc: "Временно отложив идеологические разногласия, мы должны сотрудничать. Враги окружают нас со всех сторон, обладая силой, способной сокрушить нас, как яростный шторм. Поэтому мы должны объединиться, чтобы защитить пламя консерватизма Шанхайцзин и поддерживать его горение до конца."
 SHA_Cabinet_Secretariat: "Тайный совет Шанхайцзин"
 SHA_Cabinet_Secretariat_desc: "Нынешний лидер должен оставаться символом консерватизма Шанхайцзин и единства народа и студенток. Однако, чтобы консультировать лидера по политике и облегчить связь между Вратами Дракона и правительством, мы учредим новый Тайный совет. Этот орган будет состоять исключительно из патриотичных и добродетельных консерваторов, которые будут верно служить будущему Шанхайцзин."
 SHA_organic_national_polity: "Органический национальный строй"
 SHA_organic_national_polity_desc: "Либеральный подход Кивтос на севере не подходит для общества Шанхайцзин. Мы не должны следовать коррумпированному электорализму, а должны двигаться к реализации идеалов Оперной труппы Пекина и консервативных теоретиков Шанхайцзин. Построение меритократического авторитаризма, где способные возвышаются и руководят — Органического национального строя — это наш путь."
 SHA_Democratic_Culture_Censorship: "Искоренение анти-Кивтос демократической культуры"
 SHA_Democratic_Culture_Censorship_desc: "Название говорит само за себя"
 SHA_New_Genryumon_Peking_Opera_Department_Relations: "Новые отношения Врат Дракона - Оперной труппы Пекина"
 SHA_New_Genryumon_Peking_Opera_Department_Relations_desc: ""
 SHA_Engine_of_conservative_revolution: "Двигатель Консервативной революции"
 SHA_Engine_of_conservative_revolution_desc: ""
 SHA_people_conservatism: "Продвижение народного консерватизма"
 SHA_people_conservatism_desc: ""
 
 SHA_2nd_conservative_revolution: "Вторая Консервативная революция"
 SHA_2nd_conservative_revolution_desc: "После двух десятилетий упадка, найдя истинного консервативного лидера, мы восстановили ценности великой Консервативной революции. Кроме того, мы вернули территорию, захваченную Хякки Яко, и успешно завершили революцию. Однако в обществе все еще сохраняются пережитки упадочной культуры. Чтобы полностью их искоренить, мы должны начать Вторую Консервативную революцию. Это будет решающим шагом для полной реализации идеалов патриотов."
 SHA_eradication_of_liberalism: "Искоренение либерализма"
 SHA_eradication_of_liberalism_desc: ""
 SHA_Resurrection_of_the_Soul_of_Shanhaijing: "Воскрешение души Шанхайцзин"
 SHA_Resurrection_of_the_Soul_of_Shanhaijing_desc: ""
 SHA_Establishment_of_the_National_Council: "Учреждение Академического совета"
 SHA_Establishment_of_the_National_Council_desc: ""
 SHA_Kivotos_conservative: "Распространение Консервативной революции"
 SHA_Kivotos_conservative_desc: "Либерализм и социализм Кивтос — это отвратительные опухоли, поощряющие анти-Шанхайцзин заговоры. Они распространились по всему Кивтос, и само их существование представляет собой явную угрозу. Поэтому мы должны распространять нашу революцию шире, чтобы реализовать истинные консервативные ценности и вернуть Кивтос на правильный путь."
 SHA_clash_of_civilizations: "Столкновение цивилизаций"
 SHA_clash_of_civilizations_desc: "С началом великого столкновения студентки Шанхайцзин добровольно присоединились к этому монументальному течению! Под знаменем великой Консервативной революции мы должны объединиться, чтобы спасти мир от злокачественных опухолей либерализма и социализма. Это не просто политическое противостояние, а решающая битва, которая определит будущее цивилизации!"
 
# Común
 SHA_strike_suppression: "Подавление забастовок"
 SHA_strike_suppression_desc: "Сразу после Великого инцидента Шанхайцзин приняла еще более строгую политику изоляционизма, что вызвало недовольство Торговой ассоциации. Наконец, в декабре они начали всеобщую забастовку, требуя реформ и открытости в противовес политике Врат Дракона. Однако мы должны ясно дать им понять, что такие действия только ухудшают положение Шанхайцзин, и, если необходимо, подавить их силой."
 SHA_Sack_of_Rumi: "Сдерживание Руми"
 SHA_Sack_of_Rumi_desc: "Акесиро Руми была идентифицирована как одна из подстрекателей декабрьской всеобщей забастовки. Сдерживая Руми и вводя жесткие санкции против Ассоциации Черной Черепахи, мы защитим традиции Шанхайцзин и еще больше укрепим наши консервативные ценности."

# Armonía local (Comunista, Demócrata)
 SHA_local_harmony: "Местная гармония"
 SHA_local_harmony_desc: ""

 SHA_appointment_of_BTP: "Назначение персонала Ассоциации Черной Черепахи"
 SHA_appointment_of_BTP_desc: "Мир быстро меняется, и Ассоциация Черной Черепахи, отвечающая за торговлю, находится в центре этих изменений. Они с большей вероятностью предложат более прогрессивные реформы, чем 'консервативные' Врата Дракона. Если мы массово назначим фигур из Ассоциации, мы могли бы встать на путь более передового развития."
 SHA_release_austrian_politician: "Освобождение австрийских политиков"
 SHA_release_austrian_politician_desc: "Внедрение новой политики в Шанхайцзин привело к амнистии большинства политиков австрийского происхождения. Многие из них адаптировались к новому порядку и надеются снова войти в политику."
 SHA_university_of_vienna: "Венский университет"
 SHA_university_of_vienna_desc: ""
 SHA_formation_of_labor_union: "Формирование профсоюзов"
 SHA_formation_of_labor_union_desc: ""
 SHA_womens_education_initiative: "Женское образование"
 SHA_womens_education_initiative_desc: "В Шанхайцзин долгое время гарантировалось равное образование для женщин. Но в Австрии ситуация была иной: женщины страдали от дискриминации, что привело к очевидному образовательному разрыву."
 SHA_progressivism_through_science: "Прогресс через науку"
 SHA_progressivism_through_science_desc: ""
 SHA_fight_against_extremism: "Борьба с экстремизмом"
 SHA_fight_against_extremism_desc: "Экстремизм всегда вредил обществу. Они продвигают радикальные методы, которые нельзя терпеть. Мы должны активно противостоять этой угрозе."
 SHA_strengthening_parliamentarism: "Укрепление парламентаризма"
 SHA_strengthening_parliamentarism_desc: "Хотя система, сосредоточенная на Вратах Дракона и их Лидере, внешне кажется совершенной, она имеет структурные ограничения, где чрезмерная власть Лидера гарантирует длительное правление. Мы должны укрепить Врата Дракона, чтобы создать противовес власти Лидера."
 SHA_a_new_constitution: "Разработка Конституции Шанхайцзин"
 SHA_a_new_constitution_flag: "§Y$SHA_strengthening_parliamentarism$§! завершен"
 SHA_str_par_focus_days_tt: "Текущие дни: [?SHA_a_new_constitution_flag:days|Y0]"
 SHA_defensive_democracy: "Оборонительная демократия"
 SHA_defensive_democracy_desc: "Демократизация Шанхайцзин станет одним из величайших достижений за столетия. Эта демократия не может быть легко утеряна или повреждена. Так же, как мы не можем предоставлять свободы врагам свободы, мы должны действовать, чтобы предотвратить самоуничтожение демократии изнутри."
 SHA_transplanting_capitalist_system: "Открытие рынков"
 SHA_transplanting_capitalist_system_desc: "Экономика Шанхайцзин работала по плановой системе, управляемой экспертами Врат Дракона, с крайне ограниченным открытием рынков. Однако коммерческий успех Ассоциации Черной Черепахи заметен, позволяя студенткам испытать преимущества свободного рынка. Теперь мы должны распространить эти изменения на национальный уровень, чтобы гарантировать больше экономических свобод."
 SHA_transplanting_capitalist_system_tt: "Фокус будет заблокирован после $SHA_establish_the_SEZ$."
 SHA_transplanting_capitalist_system_2_tt: "Если §Yзавершите фокус§!, §Rпотеряете его эффекты§!."
 SHA_democracy_education: "Демократическое образование"
 SHA_democracy_education_desc: "Основа демократии — в каждом гражданине Шанхайцзин. Но после многих лет авторитарного правления Лидера наблюдается политическая апатия. Если мы не будем действовать, эта демократия может рухнуть из-за общественного безразличия."
 SHA_hold_elections: "Проведение выборов"
 SHA_hold_elections_desc: "С достигнутой стабильностью и разработанной конституцией пришло время провести первые свободные выборы в соответствии с установленным порядком. Кандидаты готовы вести Шанхайцзин; теперь народ решит."
 SHA_a_responsible_government: "Ответственный президент"
 SHA_guided_democracy: "Бывший Лидер, нынешний президент"

 SHA_communist_branch: "Принять австромарксизм"
 SHA_communist_branch_desc: "$AUS_austromarxism_focus_desc$"
 SHA_communism_focus_1: "'Красная Вена'"
 SHA_communism_focus_1_desc: "С распадом Империи Вена страдала от крайней бедности, жилищного кризиса, безработицы, инфляции. 'Красная Вена' относится к серии прогрессивных политик, реализованных между 1919 и 1934 годами, когда Социал-демократическая партия управляла городом для решения этих проблем. Хотя 'Красная Вена' закончилась, когда правые пришли к власти после февральского восстания 1934 года, она остается образцом общественного жилья, основой городского благосостояния и архетипом прогрессивной муниципальной политики."
 SHA_red_wien: "'Красная Вена'"
 SHA_Naukograd: "Наукоград"
 SHA_Naukograd_desc: "Наукоград означает 'город науки' и является названием для городов с высокой концентрацией исследовательских и опытно-конструкторских учреждений."
 SHA_communism_focus_2: "Левые ополчения"
 SHA_communism_focus_2_tt: "Когда начнется §Yгражданская война§!, мы получим §Yдивизии ополчения§!. Если мы §Yв гражданской войне§! или если §Yгражданская война§! уже закончилась, мы получим их немедленно."
 SHA_communism_focus_2_desc: "Чтобы подготовиться к гражданской войне, мы организуем ополчения, поддерживающие наше дело."
 SHA_communism_focus_3: "Возобновить движение советов"
 SHA_communism_focus_3_desc: "Движение советов было революционным рабочим движением, распространившимся по всей Европе после войны. Возобновив его, мы снова зажжем революционное пламя рабочего класса."
 SHA_communism_focus_4: "Популистский корпоративизм"
 SHA_communism_focus_5: "Левый поворот Black Tortoise Promenade"
 SHA_communism_focus_6: "'Теория массовой забастовки'"
 SHA_communism_focus_6_desc: "Всеобщая забастовка — наш кулак!"
 SHA_communism_focus_7: "Месть за 34-й"
 SHA_communism_focus_7_desc: "В феврале 1934 года последний факел защиты социал-демократической австрийской республики был безжалостно растоптан контрреволюционными силами. Теперь рукоятка ножа в наших руках!"
 SHA_communism_focus_8: "Социалистический Шанхайцзин"
 SHA_communism_focus_8_desc: ""
 SHA_communism_focus_9: "Интернационалистический блок"
 SHA_communism_focus_9_desc: "Мы должны проявлять солидарность с социалистическими товарищами за рубежом."
