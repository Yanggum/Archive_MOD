 SHA_the_third_kivotos: "Третий Кивтос"
 SHA_the_third_kivotos_desc: "Шанхайцзин и Хякки Яко всегда находились на географической периферии Кивтос. Эта географическая особенность была преимуществом для развития нашей уникальной культуры и идентичности. Освобождаясь от тени трех великих академий (Генны, Тринити, Миллениума) и Первого и Второго Кивтос, сформированных под их влиянием, мы провозгласим новый Третий Кивтос, свободный от установленных порядков."
 SHA_Liberation_of_South_Kivotos: "Освобождение Южного Кивтос"
 SHA_Liberation_of_South_Kivotos_desc: ""
 SHA_Utopia: "Утопия"
 SHA_Utopia_desc: "В кровавых битвах Южный Кивтос объединился в единую академию. Все поднимают бокалы, празднуя объединение, полные радости. Мы достигли утопии для всех, и все жители Южного Кивтос будут жить в процветании и безопасности."

