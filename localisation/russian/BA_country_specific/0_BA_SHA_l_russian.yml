 SHA_Trinity_Tea_Party: "Импорт чайных листьев"
 SHA_Trinity_Tea_Party_desc: "В последнее время, по мере активизации обмена между некоторыми студентками Тринити и Шанхайцзин, популярность черного чая взрывно возросла. Теперь студентки не могут его достать из-за дефицита. Столкнувшись с этой ситуацией, Врата Черного Дракона нарушат традиционные обычаи и официально запросят у Тринити импорт черного чая."
