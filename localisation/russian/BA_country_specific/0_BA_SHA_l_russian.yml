 SHA_senzu_bean_experiment: "Провести эксперимент"
 SHA_senzu_bean_experiment_desc: "Чтобы стать бессмертными, мы начнем эксперимент."
 SHA_senzu_bean_unethical_experiment: "Провести неэтичный эксперимент"
 SHA_senzu_bean_unethical_experiment_desc: "Чтобы приблизиться к цели, мы должны быть холодны. Хотя метод эксперимента может быть неэтичным и вызывать дискомфорт у тех, кто на него смотрит, если это путь, приближающий нас к цели, мы примем его и будем продвигать."
 SHA_senzu_bean_budget_increase: "Покрыть расходы"
 SHA_senzu_bean_budget_increase_desc: "Подготовка трав для обретения бессмертия требует огромных затрат, невозможных для покрытия на индивидуальном уровне. Поэтому мы назовем это 'национальным исследованием' и будем использовать государственный бюджет для покрытия необходимых средств."
 SHA_senzu_bean_herbalism: "Собрать травы"
 SHA_senzu_bean_herbalism_desc: "Чтобы стать бессмертным, необходимо собрать лекарственные травы, известные своей пользой для организма. Говорят, в частности, что нужно собрать редкие растения, растущие только глубоко в горах. В этом смысле гористая местность Австрии представляет собой очень подходящую среду для сбора трав."
 SHA_senzu_bean_clinical_trials: "Клинические испытания"
 SHA_senzu_bean_clinical_trials_desc: "Мы планируем провести испытания препарата, направленного на обретение бессмертия, с участием в качестве испытуемых некоторых наивных людей. Вводя им лекарство и наблюдая за их реакциями и развитием, мы сможем приблизиться к цели еще на один шаг."

 shakai.1.t: "Путь к бессмертию"
 shakai.1.d: "'Бессмертный' — это единственная цель, которую преследует Синтани Кай, и относится к 'вечному' существу в традиции бессмертия. Передается, что существуют десятки методов обретения бессмертия, но ни один из них не имеет гарантии успеха. Даже нелепые методы — такие как употребление ртути — считались естественными под именем традиции.\n\nОднако Синтани Кай приходит к пониманию истинного метода обретения бессмертия. Мгновение памяти, ярко вспыхнувшее в ее сознании, стало четкой целью, и она начала путешествие, чтобы преследовать это воспоминание. Но прежде чем она достигла этой цели, предыдущая Госпожа Врат попыталась помешать ей, и в процессе это в конечном итоге привело к бедствию для всего Шанхайцзин.\n\nВ конце концов, предыдущая Госпожа Врат впала в немилость, и Рюге Кисаки взошла как новая Госпожа Врат, временно закрыв инцидент; Синтани Кай была вынуждена отправиться в изгнание. Но с событием, называемым 'Великим перемещением', Клуб Пекинской оперы — в союзе с радикалами — сверг Рюге Кисаки и, изгнав даже наивную консерваторку Урусибару, Синтани Кай стала фактическим правителем Шанхайцзин.\n\nТеперь Синтани Кай всерьез начинает великое путешествие к обретению бессмертия, своей давней мечте. Каким бы долгим и трудным ни был путь, если она будет двигаться, глядя только на цель, когда-нибудь она непременно достигнет его конца."
 shakai.1.a: "Долгий и трудный путь"

 shakai.2.t: "Захваченная улика"
 shakai.2.d: "Перед нами появился удивительный результат. Продолжая эксперименты по обретению бессмертия, мы нашли улику. Она окажет огромную помощь в создании эликсира."
 shakai.2.a: "Еще немного."

