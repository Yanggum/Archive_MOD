  SHA_Kirchenbeitragsgesetz: "Закон о церковном взносе"
  SHA_Kirchenbeitragsgesetz_desc: "'Kirchenbeitragsgesetz' (Закон о церковном взносе) — это правовая система Австрии, которая позволяет признанным религиозным организациям взимать со своих прихожан взнос определенного размера. Этот взнос не является налогом, а представляет собой обязательство, вытекающее из добровольного членства; сбор осуществляется самой религиозной организацией, а государство предоставляет правовую основу. С помощью этого мы заставим Церковь самофинансироваться; и, в свою очередь, обложим ее налогом, чтобы реализовать принцип секуляризма."
