 If_you_dont_write_here_I_ll_kill_you: "¡Нужна доработка!"
 SHA_GATHERING_STORM_DESC: "Высшая академия Шанхайцзин, школа традиций и гастрономии на окраинах Кивтос, раньше стабильно функционировала, опираясь на процветающую туристическую индустрию и торговые районы Ассоциации Черной Черепахи.\n\nКогда улеглась пыль Инцидента в Кивтос, на бывших австрийских территориях возникла Шанхайцзин, управляемая Вратами Дракона. Но ее появление также принесло новые угрозы руководству ее директора, Рюге Кисаки.\n\nТеперь Шанхайцзин сталкивается с внешними угрозами: возрождающиеся конфликты Кивтос на севере и агрессивная Италия на юге. Не говоря уже о внутренних нестабильностях, которые нельзя игнорировать."

 SHA_country_intro_header: "Академия традиций и гастрономии [SHA.GetName]"
 SHA_country_intro_content: "Древняя Высшая академия Шанхайцзин, расположенная на окраинах Кивтос, была прекрасной школой с уникальной культурой, отличавшей ее от других. Она процветала благодаря туризму Ассоциации Черной Черепахи и передовому развитию.\n\nВнутренняя борьба за власть настолько интенсивна, что можно только удивляться, как Шанхайцзин вообще функционирует. Падение предыдущего директора и восхождение Рюге Кисаки потрясло как радикалов, так и консерваторов Врат Дракона. После ее назначения фракция Кисаки и умеренные быстро выросли, усиливая борьбу за власть с радикалами и консерваторами за лидерство во Вратах Дракона.\n\nНо эти споры не ограничиваются Вратами Дракона. Ассоциация Черной Черепахи, вторая по силе группа, пионер туризма и гастрономии с частыми внешними контактами, естественно, выступает за реформы, что порождает напряженность с консервативными ценностями Шанхайцзин.\n\n§YРазработано: jindoi§!"

