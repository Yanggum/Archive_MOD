l_spanish:

# 이벤트
 shacom.1.t: "Австромарксизм"
 shacom.1.d: "После Февральского восстания 1934 года левые силы на австрийской земле были уничтожены. При фашистском режиме рабочий класс, крестьянство и интеллигенция стонали, и пламя демократии погасло в одно мгновение. Однако Великое перемещение обрушилось на Австрию, и ситуация изменилась. С яростным наступлением Шанхайцзин австрийское руководство потерпело непоправимый удар, и это стало новым шансом для местных левых. В гражданской сфере левые организации борются за возвращение влияния, которое они имели до 1934 года, и связь с левым крылом Black Tortoise Promenade будет очень полезной."
 shacom.1.a: "Встречай ветер перемен!"
 shacom.2.t: "Красная Вена"
 shacom.2.d: "В течение всего межвоенного периода Вена сохраняла автономию под руководством левых партий. Там испытывались и внедрялись масштабные программы общественной помощи, которые в конечном итоге укоренились и улучшили повседневную жизнь горожан. Но после прихода фашистов к власти все это исчезло. Сегодня венские рабочие поддерживают левое крыло Black Tortoise Promenade. Организовать их и закрепиться в Вене будет большим подспорьем для грядущей революции."
 shacom.2.a: "Приготовимся к восстанию!"
 shacom.3.t: "Столкновение на центральной площади"
 shacom.3.d: "4-го числа прошлого месяца тысячи граждан собрались на площади Центрального особого района, чтобы провести митинг, выступая против феодального правительства Врат Черного Дракона и требуя возвращения республики. После приказа о разгоне исполнительный аппарат Врат Черного Дракона открыл по ним огонь, и в результате десятки гражданских лиц были ранены. Протест был разогнан, но граждане ясно помнят выстрелы того дня, 4-го числа."
 shacom.3.a: "Сопротивляйся угнетению!"
 shacom.4.t: "Движение советов"
 shacom.4.d: "С 1918 по 1920 год в различных странах Европы предпринимались многочисленные попытки социально-политических преобразований через советы, стихийно сформированные рабочими, крестьянами и солдатами. Хотя все эти попытки в Германии, Венгрии и Австрии были сорваны, мы унаследуем их наследие. Правитель рабочего класса — сам рабочий класс!"
 shacom.4.a: "К советской республике!"
 shacom.5.t: "Новый лидер Альянса свободных профсоюзов"
 shacom.5.d: "Акасиро Руми из-за своего нерешительного характера не смогла отразить радикальную общую волю членов. Мы должны выбрать нового подходящего лидера, чтобы возглавить организацию как красный профсоюз!"
 shacom.5.a: "Каяма Рейдзё!"
 shacom.5.b: "Отто Бауэр!"
 shacom.5.c: "Якуси Сая...?"
 shacom.6.t: "Идеологическая борьба"
 shacom.6.d: "С воссозданием профсоюзов, которые были ослаблены или уничтожены, идеологическая борьба между ними также вновь возникла. Красный профсоюз, служащий левой идеологии, которая начала профсоюзное движение на этих землях, требует гораздо более широких профсоюзных прав; но католический профсоюз, поддерживающий сотрудничество с правительством и ограниченные полномочия, выступает против этого."
 shacom.6.a: "Поддержим красный профсоюз."
 shacom.6.b: "Поддержим католический профсоюз."
 shacom.7.t: "Судьба Врат Черного Дракона"
 shacom.7.d: "Врата Черного Дракона, которые функционировали как орган управления — то есть студенческий совет — Высшей средней школы Шанхайцзин, были свергнуты социалистической Красной гвардией, и Верховный совет объявил об их роспуске. Однако относительно обращения с их руководством существуют две позиции: заключить их в тюрьму или перевоспитать трудом."
 shacom.7.a: "Они должны заплатить за свои преступления."
 shacom.7.b: "Труд — это перевоспитание!"
 shacom.8.t: "Пролетарская культурная эстетика"
 shacom.8.d: "Культурные формы, развитые при феодализме и капитализме, больше недействительны при социалистическом Шанхайцзин. Теперь мы должны активно продвигать 'социалистическую' эстетику, основанную на реализме. Начало будет положено внутренней реформой Клуба Пекинской оперы."
 shacom.8.a: "К искусству народа!"
 shacom.9.t: "Общественная забота"
 shacom.9.d: "При старых режимах уход за детьми был культурой, которая показательным образом перекладывалась на женщин. Но ясно, что такая отсталая культура не может быть принята в новом обществе.\n\nПоэтому мы решили использовать признанное учреждение 'Сад Мэйхуа' по всему Шанхайцзин. Расширенное учреждение, новый 'Красный сад Мэйхуа', будет не просто службой воспитания и ухода за детьми для жителей Кивтос, но и новой формой заботы, чей охват распространится также на человечество.\n\nС момента своего основания Красный сад Мэйхуа получил поддержку бесчисленных австрийских матерей. Благодаря этому мы сможем сделать еще один шаг к гармонии с местными жителями и, в то же время, направлять детей — которые будут основой новой академии — к 'желаемому образу мышления'."
 shacom.9.a: "Это инновация."
 shacom.10.t: "Прогресс — моя сила!"
 shacom.10.d: "Якуси Сая решила войти в политику."
 shacom.10.a: "Технократ, надо же."
 shacom.10_tt: "\n§YЯкуси Сая§! может быть §Gразблокирована§! как §Yдемократический лидер§!.\n§YЯкуси Сая§! может быть §Gразблокирована§! как §Yкоммунистический лидер§!."
 shacom.11.t: "Захват Лихтенштейна"
 shacom.11.d: "Лихтенштейн был суверенным княжеством, граничащим с нами на западе. Но параноидальная тревога распространилась среди Красной гвардии, оказавшейся в нестабильном окружении, и поэтому часть их дивизий добровольно двинулась в Лихтенштейн. Незначительное и несущественное сопротивление было легко подавлено, а герцог и высшие священники бежали в изгнание. Тем не менее, из страха перед сопротивлением, гражданам были предоставлены свобода вероисповедания и широкая автономия; и за исключением того, что там будет размещена Красная гвардия, они будут жить практически так же, как и раньше."
 shacom.11.a: "Мы должны предотвращать самоуправные действия."
 shacom.12.t: "Наследие Люксембург"
 shacom.12.d: "Роза Люксембург, немецкая революционерка, родившаяся в Польше, и теоретик социализма, еще в 1906 году писала о 'теории массовой забастовки', излагая, каким должен быть путь к рабочей республике. При определенных предварительных условиях даже неорганизованные рабочие могут участвовать в крупномасштабных политических забастовках и оказывать устрашающее давление. Мы начнем одновременные забастовки в Вене и других крупных городах, остановим промышленность, парализуем экономику и принудим угнетателей к поражению!"
 shacom.12.a: "Пусть все готовят коктейли Молотова!"
 shacom.13.t: "Победоносная забастовка"
 shacom.13.d: "Движимые народным пылом, многочисленные студентки также присоединились к нашему делу, что позволило вооруженным организациям в любой момент вступить в сговор с забастовщиками и затруднило Вратам Черного Дракона применение военной силы. Врата Черного Дракона пытались неоднократно вести переговоры, но не смогли пробить непреклонный, как сталь, тезис рабочих. В конце концов, организованная Красная гвардия штурмовала Врата Черного Дракона, не встретив сопротивления. Их руководство, предвидя поражение, бежало в изгнание или сдалось. Революция победила!"
 shacom.13.a: "В этом сила массовой забастовки."
 shacom.14.t: "Принцип национального самоопределения"
 shacom.14.d: "Наш Шанхайцзин, гордо провозглашающий социализм в Центральной Европе, должен бороться в солидарности против угнетения наций и народов и против империализма. В то же время Австрия функционирует как национальное государство немцев, что предполагает наличие у нас территориальных прав на другие германские регионы Центральной Европы. Мы должны вернуть наши законные территории!"
 shacom.14.a: "К национальному освобождению!"
 shacom.15.t: "Второй интернационал"
 shacom.15.d: "Второй интернационал был международной федерацией социалистических партий, основанной в 1889 году и распущенной в 1916 году. Хотя Третий интернационал сталинистов все еще существует, их социалистические идеалы явно отличаются от наших. Мы восстановим Второй интернационал, чтобы на международной арене практиковать 'социализм Шанхайцзин' и воплотить в жизнь марксистские принципы!"
 shacom.15.a: "Это исторический момент."
 shacom.16.t: "Угрозы вокруг"
 shacom.16.d: "Революционное пламя, которое мы зажгли, опасно хрупко. Нет товарищей, поддерживающих нашу революцию ни в одном направлении; наоборот, мы окружены врагами, готовыми обрушить контрреволюционный топор на наши головы. Наши соседи боятся пути, которым мы хотим следовать. На самом деле, Венгрия с ее авторитарным режимом или Италия под фашистским правлением могут вторгнуться в нас под предлогом восстановления их 'фашистской Австрии'. Как бы то ни было, они боятся нашего социализма, и это материализуется как одновременное вторжение, в стиле контрреволюции 1919 года на Востоке. Мы должны готовиться! Мы должны выжать максимум из наших собственных возможностей, чтобы сдержать эти угрозы и освободить угнетенный рабочий класс соседних стран."
 shacom.16.a: "Нет времени!"
 shacom.16_tt: "В течение §Y720§! дней наши §tвраждебные соседи§! нападут на нас! Мы можем отсрочить §Yмомент их атаки§! различными средствами."
 shacom.17.t: "Красный террор"
 shacom.17.d: "Рядом с нами обосновался неудобный сосед [SHA.getname]. Они подстрекают к забастовкам и революциям в сопредельных странах, и мы должны противостоять этой атаке. Когда наступит подходящий момент, мы сможем объединить силы с другими соседями и упредительно подавить их, прежде чем угроза подрыва государства достигнет нас."
 shacom.17.a: "Антикоммунизм непоколебим!"
 shacom.18.t: "Наступление"
 shacom.18.d: "Время пришло. Мы можем начать наступление против [SHA.getname]!"
 shacom.18.a: "Вперед!"
 shacom.18.b: "Еще нет."
 shacom.19.t: "Вмешательство марксистов"
 shacom.19.d: "Из-за концентрации марксистов в стране и сочувствующего им гражданского общества мы были вынуждены отменить план антикоммунистического наступления."
 shacom.19.a: "Какая жалость."
 shacom.20.t: "Революционная война"
 shacom.20.d: "Случилось то, чего мы опасались. Но весь народ [SHA.getname] поднимется, как общая воля, и даст отпор контрреволюционному наступлению."
 shacom.20.a: "Остановим контрреволюцию!"
 shacom.21.t: "Диктатура пролетариата"
 shacom.21.d: "После перехода системы к социализму, приняв решение усилить сотрудничество с советскими, мы пришли к выводу, что предпочтительнее принять революционную теорию советского образца. Следуя мысли Ленина и Сталина, вся система будет реформирована, и некоторые инакомыслящие мнения будут временно запрещены посредством демократического централизма."
 shacom.21.a: "\"Все это необходимое действие.\""
 shacom.22.t: "\"Великий скачок!\""
 shacom.22.d: "Чтобы противостоять множеству врагов, окружающих нас, Партия решила принять в качестве политической программы этого года 'Великий скачок', подражающий советскому стахановскому движению. Через несколько лет мы станем великой державой, которую невозможно будет игнорировать в Европе и Кивтос! По приказу Партии планы Великого скачка распространились на все фронты и секторы: везде мы будем 'высоко прыгать'!"
 shacom.22.a: "Доверимся и последуем за Партией и товарищем Генеральным секретарем!"
 shacom.23.t: "Воробьи"
 shacom.23.d: "Как обычно, [SHA.getleader] вышел инспектировать рабочие места трудовых масс. Во время этого визита он отправился в сельскую местность, чтобы проверить ситуацию в сельском хозяйстве, возникшую в результате текущего Великого скачка, и там стал свидетелем поразительной сцены: маленькая птичка клевала зерно. Партийные бюрократы, также видевшие это, предложили изгнать этих птиц с полей, и [SHA.getleader] глубоко задумался над этим предложением."
 shacom.23.a: "\"Они милые, можем оставить их в покое!\""
 shacom.24.t: "Обнаружена неэффективность народных коммун"
 shacom.24.d: "В процессе коллективизации сельского хозяйства, который, казалось, продвигался с наивной нормальностью, была раскрыта неэффективность бюрократии! Зафиксировано серьезное падение трудового энтузиазма среди крестьян во время коллективизации, и для решения этой проблемы нам придется пересмотреть подход с самого начала."
 shacom.24.a: "Проклятье!"
 shacom.25.t: "Студентки, очарованные Культурной революцией"
 shacom.25.d: "Культурная революция - это переход от культурных форм капиталистическая и феодальная надстройка-идеология, право, искусство и т. Д.— К новой передовой системе. По партийной логике, это должно быть достигнуто на уровне сознания; поэтому студентки были перевоспитаны и возродились в качестве ярых борцов за революцию. Однако в процессе некоторые студентки-экстремистки требовали еще более радикального роспуска органа власти и проводили дерзкие ультралевые акции. Небольшими актами вандализма и терроризма они нанесли ущерб местному культурному наследию и стали социальной проблемой; в конце концов они заняли дворец Хофбург, и они начали сидячую забастовку. Ситуация была быстро урегулирована, но Партия признала необходимость пересмотра политики."
 shacom.25.a: "Какие стремительные."
 shacom.26.t: "Результаты Большого скачка вперед"
 shacom.26.d: "Наступил момент, предусмотренный Партией. Партия проводит оценку Большого Скачка вперед."
 shacom.26.a: "Все это результат нашего выбора."
 shacom.26_tt_1: "§YБольшой Скачок Вперед: Коллективизация сельского хозяйства§! он был §Gзавершон:§!\n"
 shacom.26_tt_2: "§YБольшой Скачок Вперед: Коллективизация сельского хозяйства§! §Rне удалось завершить:§!\n"
 shacom.26_tt_3: "\n§YБольшой Скачок Вперед: Ускорение производства вооружений§! §Gзавершен:§!\n"
 shacom.26_tt_4: "\n§YБольшой Скачок Вперед: Ускорение производства вооружений§! §Rне удалось завершить:§!\n"
 shacom.26_tt_5: "\n§YБольшой Скачок Вперед: культурная революция§! он был §Gзавершон:§!\n"
 shacom.26_tt_6: "\n§YБольшой Скачок Вперед: культурная революция§! §Rне удалось завершить:§!\n"
 shacom.26_tt_7: "\n§YБольшой Скачок Вперед: Военная реформа§! §Gзавершена:§!\n"
 shacom.26_tt_8: "\n§YБольшой Скачок Вперед: Военная реформа§! §Rне удалось завершить:§!\n"
 shacom.26_tt_9: "\n§GВсе программы Большого Скачка Вперед завершены!§!\n"
 shacom.27.t: "Католическое сопротивление"
 shacom.27.d: "Местные католические силы Австрии, которые с самого начала с подозрением относились к нашей новой линии для Шанхайцзин, решили перейти к действиям. Опираясь на прочную организационную связь между Церковью и верующими, они формируют, в основном в сельской местности, политические ассоциации, выступающие против нашего дела."
 shacom.27.a: "Проклятье!"
 shacom.28.t: "Подавить католическое сопротивление"
 shacom.28.d: "За последний период мы нанесли видимое поражение сопротивлению Католической церкви, которая была нашей оппозиционной политической организацией. Теперь мы полностью сокрушим ее остатки с помощью законных и экономических средств, уничтожив всякую возможность сопротивления!"
 shacom.28.a: "Бороться!"
 shacom.29.t: "Сельский социализм"
 shacom.29.d: "Проблема традиционного австромарксизма — или социал-демократии — заключается в том, что он активно не вел пропаганду в сельской местности. До сих пор крестьяне, связанные с католическими силами, рассматривались как классовые враги, тормозящие социальный прогресс; но отныне мы будем активно вовлекать их и организовывать революционное крестьянское движение."
 shacom.29.a: "Хорошо."

 shafas.1.t: "Переворот Оперного клуба!"
 shafas.1.d: "\"Именем традиции Шанхайцзин, мы осуждаем лидера Сюаньлун, $SHA_KISAKI$!\"\n\nВ день, предназначенный для великого представления, сотни зрителей и членов Оперного клуба собрались на площади Байху. Но то, что было представлено в тот день, не было простым спектаклем.\n\nПьеса жестко высмеивала нынешнего лидера Сюаньлун, $SHA_KISAKI$, сравнивая ее с \"Темным Владыкой\". Сюжет рассказывал о том, как глупый правитель безрассудно открывает городские ворота ветрам перемен, ввергая свой народ в хаос.\n\nС помощью шокирующих сцен представление посылало четкий сигнал критики в адрес лидера. По окончании пьесы площадь взорвалась ликованием, и вскоре как радикалы, так и консерваторы внутри Сюаньлунм начали мобилизацию.\n\nТак это представление стало первым выстрелом революции. Радикальные и консервативные фракции вместе с Оперным клубом объявили на площади Байху об отстранении $SHA_KISAKI$, погрузив место в хаос и ярость.\n\nВ настоящее время $SHA_KISAKI$ находится под домашним арестом в своей резиденции VIP. Хотя она сохраняет определенные привилегии как бывший лидер, будущее Шан Хайцзин остается неопределенным. Никто не знает, каким курсом пойдет $SHA_KAGUYA$, новый лидер.\n\nОднако внутри начинают возникать тревоги: ходят слухи, что $SHA_KAI$, несколько лет назад нарушившая безопасность Шан Хайцзин, замышляет очередной темный заговор..."
 shafas.1.a: "Защитим нашу традицию!"

 shafas.3.t: "Проникшие радикалы"
 shafas.3.d: "В настоящее время Шанхайцзин погружен в хаос. Государственный переворот Клуба Пекинской оперы превратился в революцию, и лидер Сяньлунмэнь Кисаки передала свой пост Урусибаре Кагуе, находясь теперь под домашним арестом в своей резиденции VIP. Хотя революция завершилась с определенным успехом, остается еще бесконечное множество проблем, требующих решения.\n\nОднако внутри Шанхайцзин замечены подозрительные движения. Синтани Кай стремится использовать этот хаос, чтобы стать новым лидером Шанхайцзин. Радикалы из Йонданбанга не признают нынешнего временного лидера, Урусибару Кагую, и подчиняются только приказам Синтани Кай, что заставляет подозревать, что Йонданбанг уже попал под ее контроль."
 shafas.3.a: "Мы должны опережать на два шага."

 shafas.4.t: "Государственный переворот Совета Сюаньу!"
 shafas.4.d: "После переворота Клуба Пекинской оперы в Шанхайцзин произошел еще один государственный переворот. На этот раз Совет Сюаньу собрал оставшиеся умеренные фракции Сяньлунмэнь и начал противостоять нашим силам.\n\nОни утверждают, что революция Клуба Пекинской оперы — это полное предательство традиций Шанхайцзин и что все было организовано с целью восстановления Синтани Кай. Они также провозглашают себя истинными восстановителями стабильности Шанхайцзин и подстрекают студенток к революции."
 shafas.4.a: "Совет Сюаньу совершил свой переворот!"
 shafas.4.b: "Они заплатят за свое предательство!"

 shafas.5.t: "Несколько месяцев назад"
 shafas.5.d: "В 1929 году Великая депрессия, начавшаяся в США, достигла и Австрии, находящейся за тысячи километров. Экономический удар оставил многих граждан без работы, они вышли на улицы, требуя хлеба и работы. Однако усилия политиков по борьбе с кризисом были совершенно бесплодны.\n\nВ ноябре произошел Великий катаклизм, затянувший Шанхайцзин в Австрию. Центральное правительство было нейтрализовано, и Сяньлунмэнь Шанхайцзин взяло на себя законодательную, судебную и исполнительную власть, став новой властью в стране. Но вместе с властью они унаследовали и экономические проблемы.\n\nСяньлунмэнь немедленно провозгласило временные законы, которые смогли эффективно решить проблему безработицы. Однако это не означало конца Великой депрессии. Впереди еще много препятствий и трудных решений. Только мудрость и правильный подход смогут преодолеть эти трудности."
 shafas.5.a: "Встретим это!"

 shafas.6.t: "Консервативная революция"
 shafas.6.d: "Два месяца назад, чтобы сдержать Совет Сюаньу и последствия Великого катаклизма, Клуб Пекинской оперы стремился объединить фракции со схожими идеологиями и целями. Они сыграли ключевую роль в защите интересов Шанхайцзин. Благодаря их усилиям цели Совета Сюаньу были сорваны, а влияние Великого катаклизма сдержано.\n\nОднако Шанхайцзин по-прежнему находится под угрозой не только из-за внешних опасностей, но и из-за внутренних недостатков. Слабая парламентская политика нынешнего лидера сводила его к роли марионетки, угрожая разрушить основы консерватизма Шанхайцзин. Чтобы предотвратить это, Клуб Пекинской оперы поднял знамя революции внутри академии.\n\nПод блестящим руководством Урусибары Кагуи консерваторы Сяньлунмэнь наконец достигли того, что их мелкие распри и нерешительность мешали им получить раньше. Старые конфликты закончились, и был построен мост между старым консервативным движением и современным. Эпоха бесцельного парламентского идеализма и квази-социалистических экспериментов Совета Сюаньу закончилась.\n\nНастало время, когда истинный Клуб Пекинской оперы разрушит коррумпированные структуры прошлого и начнет консервативную революцию."
 shafas.6.a: "Да начнется."

 shafas.7.t: "Силы обороны Шанхайцзин"
 shafas.7.d: "Силы обороны Шанхайцзин являются основной силой, отвечающей за наземную оборону и национальную территорию. Однако, скорее чем государственная армия, это сила, верная Сяньлунмэнь. Их верховный главнокомандующий — нынешний лидер, [SHA.GetLeader], а оперативное руководство возложено на исполнительного директора, $SHA_MINA$.\n\nИстория Сил обороны удивительно коротка. Они были основаны предыдущим лидером для поддержки его экспансионистской политики и реорганизованы как военная сила под эгидой Сяньлунмэнь. Но после падения старого лидера экспансионистская политика была отменена, а силы значительно сокращены.\n\nТем не менее, Силы обороны сыграли ключевую роль в критические моменты, защищая территорию Шанхайцзин в конфликтах с другими академиями и изгоняя Синтани Кай.\n\nВо время Великого катаклизма они снова вступили в действие. Однако политика разоружения Рюге Кисаки серьезно ослабила их мощь. При нехватке снаряжения и политической напряженности они были на грани поражения от австрийских федеральных сил. Но благодаря руководству Кисаки и $SHA_MINA$, они одержали победу в стиле Фабия и успешно защитили Шанхайцзин.\n\nСегодня положение Сил обороны отнюдь не оптимистично. Постоянные сокращения и потеря боеспособности оставили их плохо подготовленными к внешним угрозам. В этой нестабильной международной обстановке они не могут позволить себе оставаться в своем нынешнем состоянии."
 shafas.7.a: "Верность!"

 shafas.8.t: "Последний ультиматум"
 shafas.8.d: "Правительство Шанхайцзин заявляет о суверенитете над [972.GetName], территорией, оккупированной Хяккияко силой, и требует ее немедленного возврата. Если не последует ответа в течение 48 часов, обе нации вступят в состояние войны. Это предупреждение ясно дает понять, что это не пустая угроза.\n\nС другой стороны, у нас также есть территориальный спор с Шанхайцзин по поводу [1021.GetName]. Однако упоминание этого сейчас может быть истолковано как объявление военных намерений, что еще больше обострит напряженность. Необходимо действовать осторожно."
 shafas.8.a: "Мы не отступим!"

 shafas.9.t: "[FROM.GetAdjective] отклонил наше требование"
 shafas.9.d: "Есть ли что-то еще сказать?"
 shafas.9.a: "Тогда война!"

 shafas.10.t: "Роль Коноэ Мины"
 shafas.10.d: "Коноэ Мина сумела полностью уничтожить силы Австрийской федерации и ополчения, получив медаль за заслуги. Ее лидерство и стратегическое мышление были высоко оценены как внутри армии, так и за ее пределами, что заметно повысило военный и разведывательный потенциал Шанхайцзин. Однако, несмотря на эти достижения, ее официальный титул остается расплывчатым \"исполнительный директор\", не отражая четко ее положение и власть.\n\nНастало время правительству Шанхайцзин предоставить ей соответствующий пост и полномочия. Это не просто вопрос личного признания, а необходимость для поднятия морального духа и укрепления организационной структуры армии."
 shafas.10.a: "Восхвалим ее наступательные навыки."
 shafas.10.b: "Восхвалим ее оборонительные навыки."
 shafas.10.c: "Восхвалим ее мобильность."
 shafas.10.e: "Восхвалим ее организаторские способности."

 shafas.11.t: "Триумфальное возвращение"
 shafas.11.d: "Заговор удался! Сегодня рано утром радикалы и члены Йонданбанга сумели свергнуть Урусибару Кагую и провозгласили своего лидера, Синтани Кай, новой властью. Хотя ошибки Урусибары Кагуи повлияли на ее падение, большая часть заслуг принадлежит нашему умелому манипулированию событиями.\n\nВ настоящее время Синтани Кай перестраивает правительство по своему усмотрению. Многие ключевые чиновники Сяньлунмэнь были уволены или вынуждены уйти в отставку, в то время как новые должности быстро занимаются верными последователями Синтани Кай. Оставшиеся чиновники не могут оказать сопротивления перед подавляющим большинством loyalists.\n\nСинтани Кай готовится произнести речь, в которой официально объявит о политических изменениях."
 shafas.11.a: "Все по плану."

 shafas.12.t: "Распространяющийся страх"
 shafas.12.d: "Среди народа Шанхайцзин ходили теории заговора о причастности Синтани Кай к революции. Недавно эти теории подтвердились, и студентки Шанхайцзин боятся, что снова произойдет нечто подобное тому, что случилось в прошлом."
 shafas.12.a: "Примем быстрые меры против Синтани Кай."
 shafas_12_tt: "Через 35 дней начнется суд над $SHA_KAI$."

 shafas.13.t: "Суд над $SHA_KAI$"
 shafas.13.d: "$SHA_KAI$ вызвала большой хаос в прошлом Шанхайцзин. Лекарство, которое она распространяла ради собственной выгоды, нанесло смертельный вред студенткам Шанхайцзин, и тогдашний лидер Рюге Кисаки, нарушив традицию, силой изгнала ее. Однако во время революции было обнаружено, что некоторые члены Йонданбанга контактировали с Синтани Кай, поэтому Урусибара Кагуя созвала суд, чтобы вернуть народную поддержку."
 shafas.13.a: "Вероятно, правильным решением для успокоения народа будет изгнать ее."
 shafas.13.b: "Установим за ней строгое наблюдение."

 shafas.14.t: "Судьба Якуси Саи"
 shafas.14.d: "Когда Восточная алхимическая лаборатория полностью перешла в руки Синтани Кай, судьба Якуси Саи — бывшего главы лаборатории — стала медленно приближаться. Якуси Сая — фигура, придерживающаяся полностью противоположной позиции по сравнению с Синтани Кай, и долгое время она последовательно выступала против экспериментов Кай: неэтичных, но практичных.\n\nСинтани Кай лично не питает к ней особых чувств, и ее намерение — закрыть дело, понизив Саю до рядового члена лаборатории. Однако внутри самой лаборатории растут голоса, требующие заключения Саи."
 shafas.14.a: "Ограничимся понижением"
 shafas.14.b: "Тогда заключите ее"

 shafas.17.t: "Радикальное ополчение"
 shafas.17.d: "В результате политического хаоса в Шанхайцзин и воздействия Великого перемещения некоторые радикальные группы внутри Высшей средней школы Шанхайцзин сплотились и начали деятельность ополчения. Их основные цели — силы левой ориентации, включая Black Tortoise Promenade, против которых они проводят нападения.\n\nСтудентки обладают определенными средствами для отражения этих набегов, но местные австрийцы — нет; это может стать искрой для будущих конфликтов."
 shafas.17.a: "Это должно быть немедленно остановлено. Пошлите исполнительный орган и распустите ополчение."
 shafas.17.b: "Зачем нам мешать действиям патриотов?"

 shalose.1.t: "Вспыхивают массовые протесты"
 shalose.1.d: "Массовые протесты с требованием отставки правительства"
 shalose.1.a: "Это что-то неортодоксальное..."

 shalose.2.t: "Конец"
 shalose.2.d: "На следующий день после того, как поражение было официально подтверждено, Синтани Кай уничтожила все следы своего существования. Она не оставила ни одного сообщения. Ее кабинет остался как есть, неприбранным, а колбы и диаграммы, с которыми она работала лично, остались там.\n\nЛюди говорят, что ученый, не сумевший принять поражение, в конце концов стер себя в лаборатории.\n\nСегодня Высшая средняя школа Шанхайцзин переживает хаос, близкий к анархии, без лидерства. Среди населения ходят различные догадки о местонахождении Синтани Кай, но никто не может утверждать наверняка: выбрала ли она смерть или скрылась для нового эксперимента?\n\nЕдинственное, что точно, — это то, что перед грузом ответственности она не смогла вылупиться из скорлупы безумия и что даже в последний момент пыталась взвалить все на себя одну."
 shalose.2.a: "\"Это эксперимент.\" Это была фраза, которую она часто повторяла."

 shalose.2.d_2: "Через несколько дней после того, как поражение было официально признано, Урусибара Кагуя добровольно предстала перед гражданами. Она признала, что консервативная революция провалилась, и заявила, что примет законный суд в соответствии с волей народа. Она была немедленно арестована и отправлена на суд.\n\nЗначительная часть общественного мнения требовала ее изгнания, но суд счел, что она поддается перевоспитанию, и решил заключить ее в Исправительный департамент. Однако это решение вызвало сильную реакцию среди студенток Шанхайцзин. Выражалось недовольство тем, что человека, вызвавшего внутренний хаос в Шанхайцзин, судят \"извне\".\n\nС появлением тех, кто утверждал, что приговор несправедлив, ситуация обострилась до уровня ополчений. Те, кто выступал против консервативной революции и перевооружился с ультраправой идеологией, организовали вооруженные группы, и произошли различные эпизоды насилия, включая нападения с применением огнестрельного оружия на Центральный особый район Шанхайцзин."
 shalose.2.b: "Сколько людей пострадало под лозунгом \"великая консервативная революция\"...?"

 shalose.3.t: "Военный переворот"
 shalose.3.d: "Город не погрузился во тьму. В каждом месте, где гас свет, пробуждалась пушка, и за этими пушками стояла Коноэ Мина. Правительственное здание Высшей средней школы Шанхайцзин открылось, не оказав сопротивления, и никто ее не остановил. Не было причин останавливать, не было сил.\n\nПосле исчезновения Синтани Кай режим шатался, словно вися в пустоте. Отсутствующий лидер, рухнувшая администрация, безоружные гражданские. Слово 'правительство' больше не имело значения, и люди хотели ясного голоса: курса, приказа, появления кого-то.\n\nИ именно Коноэ Мина прошла сквозь эту пустоту. Раньше она была офицером оперативного отдела в Силах обороны и дослужилась до командира батальона. Она говорила мало, но по какой-то причине часто забывала о радиосвязи. Когда разворачивала карту, начинала с того, что держала ее вверх ногами… но, тем не менее, достигала цели назначения.\n\nСилы обороны под ее командованием двинулись к центру города. Это было почти бескровное вступление. Правительство уже было в состоянии анархии, а ополчения и жители, контролировавшие улицы, приветствовали Силы обороны с робкой надеждой на 'возвращение порядка'."
 shalose.3.a: "Порядок восстановлен!"

 shadem.1.t: "Первые выборы"
 shadem.1.desc: "В Шанхайцзин прошли первые в истории демократические выборы. Эти выборы — не просто назначение лидера: поскольку речь идет о переходе к демократии и президентских выборах, они вызвали огромный интерес даже среди различных академий Кивтос.\n\nМногие люди участвовали в предвыборной кампании и тщательно обдумывали, за кого голосовать, и наконец настал день судьбы.\n\nВ этих выборах приняли участие в общей сложности три кандидатки.\nПервая — бывшая госпожа Врат, Рюге Кисаки. Вторая — Акасиро Руми, возглавляющая реформы и имеющая на данный момент самую высокую поддержку. Обе обеспечили огромные проценты поддержки, и никто не может легко склонить чашу весов.\n\nТеперь приближается решающий момент: выборы, которые определят будущее Шанхайцзин."
 shadem.1.desca: "В Шанхайцзин прошли первые в истории демократические выборы. Эти выборы — не просто назначение лидера: поскольку речь идет о переходе к демократии и президентских выборах, они вызвали огромный интерес даже среди различных академий Кивтос.\n\nМногие люди участвовали в предвыборной кампании и тщательно обдумывали, за кого голосовать, и наконец настал день судьбы.\n\nВ этих выборах приняли участие в общей сложности три кандидатки.\nПервая — бывшая госпожа Врат, Рюге Кисаки. Вторая — Акасиро Руми, возглавляющая реформы и имеющая на данный момент самую высокую поддержку. И, наконец, глава Восточной алхимической лаборатории, Якуси Сая.\n\nТеперь приближается решающий момент: выборы, которые определят будущее Шанхайцзин."
 shadem.1.a: "Рюге Кисаки!"
 shadem.1.b: "Акасиро Руми!"
 shadem.1.d: "Якуси Сая!"

 shadem.2.t: "К народу"
 shadem.2.desc: "Огромное количество людей в Шанхайцзин до сих пор мало знают о демократии. От разделения властей — краеугольного камня демократии — до обязанностей и ответственности граждан при демократической системе, значительная часть населения не понимает эти концепции точно. Акасиро Руми пришла к выводу, что не сможет посеять свои идеалы в Шанхайцзин только с помощью талантов, воспитанных старыми Вратами Черного Дракона, и решила разработать контрмеру."
 shadem.2.a: "К народу! — Интеллигенция, просвещайте народ!"

 shafla.1.t: "Нужно много есть и восстанавливать силы!"
 shafla.1.desc: "По указу Врат Черного Дракона, провозглашавшему продвижение проектов помощи, те, кто суетился больше всех, были из Black Tortoise Promenade. Во время Великого перемещения они сами вышли на передовую, чтобы защитить корпорацию; но на этот раз они вели совершенно иную борьбу: готовили еду для голодающих.\n\nКогда наступило время обеда, люди столпились перед Black Tortoise Promenade. Филиалы были по всему Шанхайцзин, но самым известным была, без сомнения, главная штаб-квартира в [4.GetCapitalVictoryPointName]. Это было связано с тем, что необыкновенное кулинарное мастерство Акасиро Руми широко распространилось из уст в уста.\n\nСреди толпы осторожно подошел мальчик:\n\"Эй… не могли бы вы дать мне немного еды…? Я голоден… хотя бы немного…\"\n\nРуми посмотрела на мальчика и тепло улыбнулась.\n\"Конечно, парень. Сильно проголодался? Ха-ха-ха, хорошо. Подожди немного. Я приготовлю тебе самую лучшую еду!\"\n\nОна вошла на кухню и быстро задвигала руками. Вскоре она поставила перед ним специальный жареный рис, приготовленный с душой. Мальчик, сияя улыбкой, уплетал еду; а Руми молча наблюдала за этой сценой. Так время медленно текло."
 shafla.1.a: "Еда важна, знаешь ли?"

 shafla.2.t: "Переходная рецессия"
 shafla.2.desc: "Рынок открылся, и мы внедрили капиталистические элементы, отойдя от системы плановой экономики, управляемой центральным правительством. Эти реформы давали более эффективные результаты, чем предыдущая экономическая политика, но слишком быстрый переход нес высокий риск вызвать рецессию в процессе.\n\nСмелый вызов внедрения капитализма казался провалом из-за того, что был близок к кризису; однако анализ, обнародованный сегодня специалистами, дал обнадеживающий прогноз. Экономика постепенно улучшается, люди снова потребляют. Преимущества капиталистической экономики начинают становиться очевидными, и кажется, настало время постепенно сокращать вмешательство экспертов и завершить экономическую реформу Шанхайцзин."
 shafla.2.a: "Это хорошие новости!"

 shafla.3.t: "Ууааат!"
 shafla.3.desc: "Когда пост госпожи Врат Черного Дракона перешел от Урусибары Кагуи к Синтани Кай, Акасиро Руми решила, что ее фракция, Black Tortoise Promenade, получит удар. Она предчувствовала кризис и немедленно действовала. Но для нового режима это могло стать лишь огромной помехой, и Синтани Кай подготовила уловку.\n\n— Бууум!\n\nВнезапный взрыв потряс внутренности Black Tortoise Promenade. Находившиеся внутри вздрогнули и побежали к источнику грохота, откуда начал подниматься дым. Сначала это приняли за простую суматоху, но как раз когда студентки Black Tortoise Promenade — включая Руми — пытались выйти…\n\nОдна за другой начали взрываться несколько бомб, и густой дым мгновенно окутал помещение.\n\nВскоре, когда дым рассеялся, появилась, невероятно, группа студенток Black Tortoise Promenade, превратившихся в маленьких девочек.\n\n\"Что… что происходит?!\"\n\n\"Ч-что нам делать, президент…?\"\n\nОзадаченная Рейдзё в панике спросила Руми.\n\nРуми на мгновение оцепенела, но тут же пришла в себя и отдала приказ:\n\n\"Свяжись с Саей. Немедленно!\"\n\n\"Д-да… да!\"\n\n\"И кроме того—\"\n\nЕще один взрыв. На этот раз сама Руми превратилась в свою детскую версию."
 shafla.3.a: "Мы немедленно отправились в больницу. К счастью, с ее здоровьем все было в порядке."
 shafla_3_tt: "Портрет Акасиро Руми меняется следующим образом:\n--------------------------------\n\n\n\n\n\n\n£GFX_Portrait_SHA_Akeshiro_Rumi_Child\n\n\n\n\n\n\n\n--------------------------------"

 shadip.1.t: "[SHA.GetAdjective] запрашивает экспорт чайных листьев"
 shadip.1.desc: "Сегодня из [64.GetCapitalVictoryPointName] прибыл дипломатический документ. Это было первое — и символическое — официальное сообщение между обеими академиями, отправленное стороной [SHA.GetLeader] из Шанхайцзин. Однако его содержание, как ни удивительно, оказалось относительно незначительным вопросом.\n\nШанхайцзин уже давно поддерживает неформальные обмены с Чайным клубом Тринити, и на этот раз передал запрос на официальный импорт 'чайных листьев', выращиваемых в Тринити. Анализируется, что подоплекой просьбы является внезапный бум чайной культуры в Шанхайцзин, который вызвал взрывной рост спроса.\n\nПоскольку сторона Шанхайцзин официально запросила это по дипломатическим каналам, отказ может создать риск ухудшения отношений между академиями."
 shadip.1.a: "Одобрим экспорт чайных листьев!"
 shadip.1.b: "Нет причин раздавать ресурсы Тринити."

 shadip.2.t: "[TRM.GetAdjective] начинает экспорт чайных листьев"
 shadip.2.desc: "К счастью, сторона [64.GetCapitalVictoryPointName] начала экспорт чайных листьев, и сегодня в Шанхайцзин поступила первая партия для покрытия быстрорастущего спроса на черный чай.\n\nВ частности, эта поставка включает особые чайные листья премиум-класса для госпожи Врат Черного Дракона, и известно, что они были выращены непосредственно Чайной партией Тринити. Кроме того, были переданы искусно приготовленные домашнее печенье от стороны [TRM.GetLeader], что было воспринято как искренний жест дружбы, выходящий за рамки простого коммерческого обмена."
 shadip.2.a: "Прекрасная история."

 shadip.3.t: "[TRM.GetAdjective] отклоняет предложение об экспорте чайных листьев"
 shadip.3.desc: "К сожалению, сторона [TRM.GetAdjective] отклонила наше предложение."
 shadip.3.a: "И это они отклоняют?"

# 뉴스 이벤트
 shanews.01.t: "Государственный переворот в Шанхайцзин!"
 shanews.01.desc: "Сегодня утром пришла шокирующая новость, потрясшая весь Кивтос: Клуб Пекинской оперы совершил государственный переворот против лидера Сяньлунмэнь, Рюге Кисаки. Хотя они оправдывают свои действия, утверждая, что Кисаки предала традиции Шанхайцзин, правда, скрытая за этим событием, остается загадкой. После Великого катаклизма Шанхайцзин оставался изолированным, но все указывает на то, что сейчас произошло нечто важное.\n\nС тех пор как Оперный клуб захватил власть, зловещие слухи не прекращаются. Вновь всплыло имя Синтани Кай, одной из \"Семи Зверей Преступности\", ранее изгнанной из Шанхайцзин, которая, как сообщается, недавно сбежала из тюрьмы, что еще больше взбудоражило общественность."
 shanews.01.a: "Традиция, а не перемены!"
 shanews.01.b: "В конце концов, это тоже перемены."

 shanews.02.t: "Консервативная революция в Шанхайцзин"
 shanews.02.desc: "Сегодня произошел неожиданный поворот. Клуб Пекинской оперы во главе с Урусибарой Кагуей объявил, что передает всю свою власть Рюге Кисаки и полностью посвятит себя внедрению консерватизма Шанхайцзин. Сразу после объявления многочисленные члены Оперного клуба вышли на улицы, выражая свою поддержку.\n\nДо сих пор Рюге Кисаки не сделала никаких официальных заявлений, но ее молчание широко интерпретируется как негласное одобрение действий Оперного клуба."
 shanews.02.a: "Искореним упадочную культуру!"
 shanews.02.b: "Что, черт возьми, происходит?"
 shanews.02.c: "Еще один пример реакционного государства."

 shanews.03.t: "Второй государственный переворот в Шанхайцзин"
 shanews.03.desc: "Сегодня пришла еще одна шокирующая новость из Шанхайцзин. Синтани Кай, 'Позор Мифую' и одна из 'Семи Зверей Преступности', победила Оперный клуб в борьбе за власть и взяла под контроль правительство. Это событие вызывает большой переполох во всем Шанхайцзин.\n\nВ своей речи Синтани Кай провозгласила, что 'будет служить Шанхайцзин', произнося сладкие слова, но только она знает свои истинные намерения. Другие академии еще не сделали официальных заявлений, но вряд ли они одобрят случившееся."
 shanews.03.a: "Поприветствуем ее!"
 shanews.03.b: "Это угроза безопасности..."
 shanews.03.c: "Звучит зловеще..."
 shanews_04_template: "\n\nС подписанием [SHA.GetFactionName] в Южном Кивтос эксперты прогнозируют, что конкуренция за гегемонию на Балканах еще более усилится. Кроме того, Италия — имеющая прямые интересы в договоре — проявляет сдержанную реакцию."
 shanews.04.t: "Создание Шанхайцзинского договора"
 shanews.04.t_1: "Восстановление Второго интернационала"
 shanews.04.desc_c: "С новой волной перемен, дующей в Шанхайцзин, сегодня [SHA.GetLeader] создал Шанхайцзинский договор. Урусибара Кагуя, директор Клуба Пекинской оперы и фактическая фигура власти в Шанхайцзин, решительно поддержала создание этого соглашения и оценила его как необходимую политику для консерватизма Шанхайцзин.$shanews_04_template$"
 shanews.04.desc_s: "С новой волной перемен, дующей в Шанхайцзин, сегодня [SHA.GetLeader] создал Шанхайцзинский договор. [SHA.GetLeader] подчеркнул, что это соглашение было неизбежным выбором в рамках его политической линии, и признал, что в результате не осталось ничего другого, кроме как частично изменить некоторые изоляционистские политики.$shanews_04_template$"
 shanews.04.desc_nothing: "С новой волной перемен, дующей в Шанхайцзин, сегодня [SHA.GetLeader] создал Шанхайцзинский договор. [SHA.GetLeader] приложил усилия для продвижения соглашения даже ценой коррекции действующей изоляционистской политики и, несмотря на оппозицию своих сторонников, провел его, используя власть Госпожи Врат.$shanews_04_template$"
 shanews.04.a: "Восстает новый Шанхайцзин!"
 shanews.04.c: "А как же сохранение изоляционизма?"
 shanews.04.d: "Родилась новая гегемония?"
 shanews.05.t: "Создание [SHA.getfactionname]"
 shanews.05.desc_1: "С новой волной перемен, дующей в Шанхайцзин, сегодня [SHA.GetLeader] подчеркнул роль [SHA.getname] в Западном фронте Коминтерна. [SHA.GetLeader] подчеркнул, что этот тезис является 'национальной борьбой', направленной на практику социализма, и провозгласил, что под интернационалистическим блоком они будут продвигаться по пути освобождения рабочих.$shanews_04_template$"
 shanews.05.desc_2: "С новой волной перемен, дующей в Шанхайцзин, сегодня [SHA.GetLeader] восстановил Второй интернационал. [SHA.GetLeader] подчеркнул, что этот тезис является 'национальной борьбой', направленной на практику социализма, и провозгласил, что только провозглашение нового Интернационала может стать путем к освобождению рабочих.$shanews_04_template$"

