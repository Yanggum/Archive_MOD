 # Ruta de derrota

 SHA_fall_of_dragon: "Падение дракона"

 SHA_defeat_kisaki_focus_1: "Реставрация Рюге Кисаки"
 SHA_defeat_kisaki_focus_1_desc: "Рюге Кисаки была, по сути, жертвой истории. Она была не более чем марионеткой, используемой узурпировавшими власть для легитимации своего собственного режима. Однако, несмотря на это, она является символом объединения Шанхайцзин и подлинным лидером, продолжающим род долгой истории."
 SHA_defeat_kisaki_focus_2: "Реставрация Врат Черного Дракона"
 SHA_defeat_kisaki_focus_2_desc: "Реформы, проводимые предыдущими правительствами, были направлены на ослабление авторитета Врат Черного Дракона. Однако эти правительства в конце концов пали в результате военного переворота, и мы восстановили законного лидера, Рюге Кисаки. Теперь осталось только вернуть честь и престиж Врат Черного Дракона."
 SHA_defeat_kisaki_focus_3: "Союз Южного Кивтос"
 SHA_defeat_kisaki_focus_4: "Распространение унионизма Южного Кивтос"
 SHA_defeat_kisaki_focus_5: "Движение неприсоединения Шанхайцзин"
 SHA_defeat_kisaki_focus_6: "Страна утренней тишины"

 SHA_defeat_mina_focus_1: "Продолжение военного правительства"
 SHA_defeat_mina_focus_1_desc: "Чтобы решить общие проблемы, стоящие перед Шанхайцзин, мы пришли к выводу, что сохранение военного правительства является наилучшим вариантом. Конечно, наше правительство может не иметь легитимности, но сейчас у нас нет роскоши тратить время на ненужные процессы принятия решений."
 SHA_defeat_mina_focus_2: "Распространение реваншизма"
 SHA_defeat_mina_focus_4: "Испытания летательных аппаратов"
 SHA_defeat_mina_focus_5: "Тайное перевооружение"

 SHA_defeat_mina_focus_7: "Смерть или бесчестье"

 SHA_defeat_industry_focus_1: "Попытка экономической самодостаточности"
 SHA_defeat_industry_focus_1_desc: ""
 SHA_defeat_industry_focus_2: "Пересмотр Гайгакуского договора"
 SHA_defeat_industry_focus_2_desc: "Гайгакуский договор чрезмерно суров и превратился в соглашение, полностью поглотившее основу роста Шанхайцзин. Поэтому Шанхайцзин мобилизует своих дипломатов для пересмотра договора, стремясь скорректировать его в направлении, менее жестком, чем раньше."
 SHA_add_HYA_SHA_huzika: "Подписание §YГайгакуского договора§!"
 SHA_add_HYA_SHA_huzika_tt: "Текущие дни [?SHA_add_HYA_SHA_huzika:days|Y0]"
 SHA_defeat_industry_focus_3: "Снятие ограничений с Black Tortoise Promenade"
 SHA_defeat_industry_focus_4: "Поддержка Black Tortoise Promenade"

 # 국민정신
 SHA_Austrian_fascist_militia: "Австрийское фашистское ополчение"
 SHA_Austrian_fascist_militia_desc: "Когда Шанхайцзин переместилась, разоруженная Австрия сдалась без сопротивления. Но господство Шанхайцзин стало еще одной угрозой для австрийцев. Те, кто отказался это принять, взялись за оружие, ведя партизанскую войну, которая вызывает постоянные беспорядки в системе Шанхайцзин."
 SHA_shanhaijing_isolation: "Изоляционизм Шанхайцзин"
 SHA_shanhaijing_isolation_desc: ""
 SHA_Eastern_Alchemy_Society_idea_desc: "Восточное общество алхимии — это клуб, изучающий алхимию в Шанхайцзин. Хотя это может показаться ненаучным, на самом деле он больше похож на современную химико-биологическую лабораторию. Его конечная цель — создать эликсир бессмертия, экспериментируя с различными снадобьями.\n\nХотя они знают, что бессмертие почти невозможно, они ставят амбициозные цели, чтобы стимулировать новые открытия во время исследований."
 SHA_Eastern_Alchemy_Society_low: "Низкий бюджет для Общества алхимии"
 SHA_Eastern_Alchemy_Society_low_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_medium: "Высокий бюджет для Общества алхимии"
 SHA_Eastern_Alchemy_Society_medium_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_high: "Очень высокий бюджет для Общества алхимии"
 SHA_Eastern_Alchemy_Society_high_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$\n\nНедавно возникли опасения среди студенток. Ходят слухи, что правительство намеренно концентрирует средства в Обществе алхимии, мешая другим клубам нормально функционировать. Хотя поддержка Общества может способствовать национальному развитию, будет трудно избежать общественного недовольства и социальной нестабильности."
 SHA_Eastern_Alchemy_Society_super_low: "Сокращение бюджета Общества алхимии"
 SHA_gathering_of_radicals_idea: "Собрание радикалов"
 SHA_gathering_of_radicals_idea_desc: "Радикалы объединяются как политическая сила. Неясно, что они планируют, но они, несомненно, являются плохой новостью для нынешнего лидера Кисаки."
 SHA_emergency_measures_idea: "Чрезвычайные меры"
 SHA_emergency_measures_idea_desc: "В мире, становящемся все более агрессивным, [SHA.GetNameDef] должна быстро развивать промышленный потенциал, чтобы удовлетворять национальные потребности и использовать возможности."
 SHA_walking_the_dragon: "Консервативная революция Шанхайцзин"
 SHA_Black_Tortoise_Promenade: "Ассоциация Черной Черепахи"
 SHA_Black_Tortoise_Promenade_desc: "Торговая федерация, собирающая ингредиенты со всего Кивтос, считающаяся кулинарной столицей Шанхайцзин. Эта особенность позволила им доминировать как в традиционной гастрономии, так и в различных кухнях Кивтос.\n\nОднако их открытая природа привела к конфликту с консерваторами, такими как Врата Дракона."
 SHA_suppressed_Black_Tortoise_Promenade: "Ограниченная Ассоциация Черной Черепахи"
 SHA_suppressed_Black_Tortoise_Promenade_desc: "Бывшая торговая федерация, знаменитая сбором ингредиентов Кивтос, теперь находится под строгим контролем Врат Дракона. Любое отклонение от их традиций жестко регулируется, что заставляет их терять все политическое влияние.\n\nТо, что было кулинарным пионером, теперь едва выживает, тоскуя по своему славному прошлому под консервативными ограничениями."
 SHA_Shanhaijinfascism: "Фашизм Шанхайцзин"
 SHA_Shanhaijinfascism_desc: "Фашизм Шанхайцзин радикально отвергает традиционные ценности. Длительный изоляционизм породил радикальные и реформистские фракции, которые, считая, что Врата Дракона больше не стремятся к переменам, сформировали тайные организации.\n\nНедавний подъем Синтани Кай был использован этими группами. Принимая прагматизм и смелые реформы, он завоевал поддержку реформистов и радикалов.\n\nЭта идеология продвигает превосходство Шанхайцзин и сильное неприятие Хякки Яко за оккупацию территорий после Инцидента. Они требуют жесткой внешней политики и внутренних реформ для восстановления своего статуса.\n\nОна представляет собой полный разрыв с традиционным изоляционизмом, но ее влияние — положительное или разобщающее — все еще неясно."
 SHA_corporate_state_idea: "Строительство корпоративного государства"
 SHA_daily_ideologiy_excluding_neutrality: "Все идеологии, кроме неприсоединения §R-0.5§!"
 SHA_corporate_state_idea_6: "Оплот реакции"
 SHA_collapsed_economy: "Великая депрессия"
 SHA_aup_modifier: "$SHA_collapsed_economy$"
 SHA_collapsed_economy_tt: "$MODIFIER_POLITICAL_POWER_COST$ [?SHA_aup_pp|-=]\n$MODIFIER_STABILITY_FACTOR$: [?SHA_aup_stability|+=%]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?SHA_aup_factory_output|+=%]"
 SHA_collapsed_economy_desc: "§CУровень Великой депрессии§!: §Y[?SHA_aup_anger|0]§!\nВеликая депрессия 1929 года в США затронула даже далекую Австрию. Но из-за некомпетентности предыдущего австрийского правительства Шанхайцзин унаследовала эту проблему.\n\nУлицы полны безработных и рабочих, требующих хлеба. Этот кризис будет продолжаться, пока длится Депрессия."
 RUS_increase_pop_anger: "§RУровень Великой депрессии изменяется на [?SHA_anger_change].§!"
 RUS_decrease_pop_anger: "§GУровень Великой депрессии изменяется на [?SHA_anger_change].§!"
 SHA_supreme_economic_council: "Центральный экономический совет"
 SHA_ASFTU: "Национальная федерация профсоюзов"
 SHA_clash_of_civilizations_idea: "Столкновение цивилизаций"
 SHA_clash_of_civilizations_idea_desc: "Упадочная демократия, распространившаяся по миру, разъедает нашу плоть. Мы должны быть авангардом революции, внедряя консервативные ценности, чтобы создать лучший мир."
 SHA_Shintani_kais_cult_of_personality_ns: "Культ личности"
 SHA_domestic_air_production: "Отечественное производство самолетов"
 SHA_shadow_of_Shintani_Kai: "Тень Синтани Кай"
 SHA_shadow_of_Shintani_Kai_desc: "С подтверждением возвращения Синтани Кай сам факт ее существования заставляет Шанхайцзин дрожать от страха и не доверять нынешнему правительству."
