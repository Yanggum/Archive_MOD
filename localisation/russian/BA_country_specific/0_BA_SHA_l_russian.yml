 SHA_coup_of_Black_Tortoise_Promenade_desc: "\n\n£GFX_SHA_Rumi_cat\n\n\n\n\nBlack Tortoise Promenade — это организация открытого характера, политически тесно связанная с реформистами из Врат Черного Дракона. Эта открытость приводила к постоянным конфликтам с консерваторами, ценящими традиции Шанхайцзин. Однако с тех пор, как Клуб Пекинской оперы начал революцию во имя сохранения традиции, столкновение с Black Tortoise Promenade перестало быть чем-то неизбежным."
 SHA_BTP_revolt_mission: "Восстание Black Tortoise Promenade"

 SHA_Eastern_Alchemy_Society_cat: "Восточная алхимическая лаборатория"
 SHA_Eastern_Alchemy_Society_cat_desc: "\n\n£GFX_SHA_Saya_cat\n\n\n\n\nВосточная алхимическая лаборатория, в настоящее время руководимая Якуси Саей, является — как следует из названия — клубом, исследующим алхимию. Только по названию ее можно принять за группу лженауки, но реальность иная: лаборатория обладает объектами, заполненными передовым оборудованием, одним из самых совершенных даже в Кивтос, и с их помощью поддерживает очень интенсивную исследовательскую деятельность.\n\nКонечная цель лаборатории — создать эликсир бессмертия. Конечно, все ее участницы прекрасно знают, что реалистично такой эликсир невозможен. Однако это намеренно высокая цель: двигаться к труднодостижимой цели, чтобы в процессе получить новые открытия и инновационные результаты."
 SHA_EAS_Budget_passed: "Бюджет утвержден"
 SHA_EAS_Budget_cuts: "Сокращение бюджета"
 SHA_remove_EAS_tooltip: "$SHA_Eastern_Alchemy_Society_cat$"
 SHA_EAC_active_flag: "Бюджет не был ни утвержден, ни сокращен"

 SHA_invade_of_Hyakkiyako_cat: "Война Южного Кивтос"
 SHA_invade_of_Hyakkiyako_cat_desc: "Армия Шанхайцзин вступила в войну неподготовленной из-за поспешного нападения. Однако Хяккияко также была серьезно потрясена внезапной атакой, и ее наступательные возможности ослабли. Используя эту брешь, Шанхайцзин планирует быстро завершить свой военный режим и принудить Хяккияко к капитуляции."
 SHA_operational_planning: "Выполнить план наступления"
 SHA_shock_relief: "Ослабление шока"
 SHA_attack_plan: "Наступление Шанхайцзин"
 
 HYA_invade_of_Hyakkiyako_cat: "Война Южного Кивтос"
 HYA_invade_of_Hyakkiyako_cat_desc: "С момента Великого перемещения Шанхайцзин и Хяккияко вели непрерывный спор о территориальных правах на Южные Судеты и регион Линца. Теперь, когда война разразилась, мы должны положить конец этому территориальному спору."

 SHA_Solving_the_austria_Militia: "Разрешить проблему австрийских ополчений"

 SHA_conservative_policy_cat: "Консервативная революция"
 SHA_conservative_policy_cat_desc: "\n\n£GFX_decision_SHA_conservative_policy_cat_picture\n\n\n\n\nВ разгар резкого потрясения политического ландшафта §GШанхайцзин§!, тот, кто сокрушил всю борьбу за власть и в итоге победил, была §1Урусибара Кагуя§!. Она официально объявила о §Y'Консервативной революции'§!, которую так долго готовила, и всерьез начала путь реформ, одновременно представив §gРюге Кисаки§! как символического лидера для консолидации поддержки всего студенческого сообщества.\n\nПосле применения первой меры реформы обсуждались различные политики, и в центре всего находятся §Yконсервативные идеалы§!, которым следует §1Урусибара Кагуя§!. Она проводит систематическую реконструкцию на социальном уровне: перестройку системы образования на основе традиционных ценностей и порядка, консерватизацию общественной политики и переопределение собственной этики §GШанхайцзин§!.\n\nЭти реформы выходят за рамки простых политических изменений: они представляют собой работу по восстановлению с нуля идентичности и философии §GШанхайцзин§! и процесс, четко определяющий будущий курс. Под руководством §1Урусибары Кагуи§! §GШанхайцзин§! преодолевает хаос прошлого и превращается в §Yновую форму консервативного государства§!.\n"
 SHA_conservative_social_reform: "Консервативная революция: социальная сфера"
 SHA_conservative_social_reform_desc: "Общество Шанхайцзин серьезно повреждено пороками либерализма. В особенности либеральные ценности, индивидуализм и дарвинистское мышление разрушают традиции и общественный порядок Шанхайцзин, распространяя болезнь по всему обществу. Чтобы преодолеть этот кризис, мы должны с помощью консервативной революции восстановить собственные ценности Шанхайцзин и вернуть традиционные идеалы и нормы. Принимая нынешнюю Госпожу Врат, Рюге Кисаки, в качестве духовного стержня, ключевой задачей будет достижение социальной сплоченности и интеграции, ориентированной на сообщество."
 SHA_conservative_economy_reform: "Консервативная революция: экономическая сфера"
 SHA_conservative_economy_reform_desc: "Экономика полностью свободного рынка — это структура, которая не может избежать краха, и контроль академии над ключевыми отраслями промышленности необходим. В частности, в стратегически важных секторах, таких как оборонная промышленность, мы еще больше усилим контрольные возможности академии. Крупные государственные предприятия будут использоваться не только как экономические субъекты, но и как центральные инструменты для выполнения правительственной политики и оказания дипломатического влияния. На такие предприятия будут направлены приближенные к Вратам Черного Дракона лица для осуществления внутреннего надзора и контроля.\n\nСледуя изоляционистской линии, Шанхайцзин работал над экономической самодостаточностью и развитием импортозамещающих отраслей; теперь достигнуты результаты, позволяющие производить большинство товаров внутри страны. Мы продолжим двигаться к цели построения самодостаточной и прочной экономики, которая не будет колебаться перед внешним давлением или нестабильной международной обстановкой."
 SHA_conservative_policy_reform: "Консервативная революция: политическая сфера"
 SHA_conservative_policy_reform_desc: "'Вертикаль власти' — это теория, ядро которой состоит в построении идеально единой цепи командования во всей организации, с Госпожой Врат на вершине. Особое внимание уделяется усилению контроля над регионами путем направления лиц, назначенных непосредственно Госпожой Врат. Кроме того, в отношении сил с антиправительственными тенденциями мы будем настойчиво выяснять источники их финансирования, чтобы затруднить его получение; тем самым мы будем стремиться сократить их деятельность и постепенно ликвидировать организации."
 SHA_conservative_army_reform: "Воспитывать гордость Шанхайцзин"
 SHA_conservative_army_reform_desc: "Многие не осознают должным образом, насколько велик Шанхайцзин. Шанхайцзин гордится своей долгой историей и традициями, и огромное количество людей живет в счастливом сообществе под его защитой. Однако, если этот факт не будет широко распространен, это может стать угрозой для сплоченности сообщества. Поэтому, с целью воспитания гордости за Шанхайцзин и укрепления чувства общности, мы планируем производить и распространять различные пропагандистские материалы."
 SHA_conservative_xuanwu_merchant_association: "'Консервативная' Black Tortoise Promenade"
 SHA_conservative_xuanwu_merchant_association_desc: "Акасиро Руми — фигура с настолько высоким признанием внутри Шанхайцзин, что ее невозможно игнорировать. Простое заточение ее может, наоборот, привести к падению поддержки правительства. Поэтому Врата Черного Дракона направят лиц с 'консервативными' наклонностями в Black Tortoise Promenade для осуществления внутреннего надзора и контроля, эффективно управляя влиянием Руми."
 SHA_conservative_rule_of_law: "Расширение карательной политики"
 SHA_conservative_rule_of_law_desc: "Самая важная ценность в сообществе — это 'стабильность'. Мы не можем проявлять никакой жалости к преступникам, которые ей угрожают. Хотя метод может показаться строгим и суровым, для защиты общественного порядка необходимо применять твердые наказания к правонарушителям и обеспечивать реальное облегчение жертвам. Для стабильного общества карательные санкции неизбежны."
 SHA_conservative_purge_of_decadent_culture: "Искоренить упадочную культуру"
 SHA_conservative_purge_of_decadent_culture_desc: "Современное искусство и искусство Земли подобны яду, разъедающему Шанхайцзин. Эта упадочная и роскошная культура не приносит ничего для развития Шанхайцзин. Все произведения упадочного искусства должны быть уничтожены, и собственная культура Шанхайцзин должна возродиться. Многие интеллектуалы и художники должны быть принуждены вносить вклад в общество, поднимая молот вместо пера."

 SHA_conservative_clash_of_civilizations: "Продолжить священную войну"
 SHA_conservative_clash_of_civilizations_desc: "Время поджимает, и враг не падает легко. Настало время мобилизовать студенток Шанхайцзин более широко, чтобы прорвать оборонительные линии врага и нанести решающий удар в его сердце. Возможно, это решение не получит поддержки всех, но, под ценностями великой консервативной революции, убеждение в необходимости освободить Кивтос от чумы и хаоса должно быть превыше всего."

 SHA_conservative_revolution_ns: "Консервативная революция Шанхайцзин"
 SHA_conservative_revolution_ns_change: "Модификаторы §Y$SHA_conservative_revolution_ns$§!"
 SHA_conservative_revolution_modifier: "$SHA_conservative_revolution_ns$"

