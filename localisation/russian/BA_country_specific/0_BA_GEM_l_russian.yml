 GEH_armageddon: "Armagedón"
 GEM_gehenna_nation_founding: "Fundación del Estado de Gehenna"
 GEM_gehenna_academy_is_a_school_where_everyone_is_happy_right: "Desde hace un tiempo, parece que en la Academia Gehenna todos son felices, ¿no crees? Je, je."
 GEM_opinion_manipulation_and_secretariat_revolution: "Manipulación de la opinión pública y revolución del Secretariado"
