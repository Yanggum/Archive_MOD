# # 중점
 GEH_warning_wuiongwuiong:0 "Convocatoria de emergencia de la Manmajeon"
 GEH_warning_wuiongwuiong_desc:0 "Tras el traslado de Kivotos a este otro mundo, las estudiantes de Gehenna han caído en el caos.\nUna vida cotidiana distinta a la de antes, y el misterio del Halo debilitado... La presidenta Makoto ha decidido convocar con urgencia a la Manmajeon, el consejo estudiantil de Gehenna."

 GEH_hyungzipa_ak:0 "Investigación sobre el terreno"
 GEH_hyungzipa_ak_desc:0 "Como resultado de la reunión de emergencia, que fue un caos absoluto, la Manmajeon ha decidido salir a investigar el lugar.\nMakoto, convencida de que cuidar de las votantes y supervisar personalmente es el deber de una presidenta, sale del edificio junto con las ejecutivas de la Manmajeon."

 GEH_gukbanggun_problem:0 "El problema del Wehrmacht"
 GEH_gukbanggun_problem_desc:0 "Mientras las ejecutivas de la Manmajeon intentaban comprender la situación, algunas que habían ido al norte desde el distrito central regresaron corriendo y empezaron a informar sobre una fuerza armada desconocida.\n¿Quiénes son, exactamente?"

 GEH_warning_sunjun:0 "Declaración del estado de emergencia"
 GEH_warning_sunjun_desc:0 "El nuevo entorno no ha sido amable con nosotras. Atentados por todas partes y la caída del campus del norte.\nMakoto, como presidenta de Gehenna, ha tomado una decisión.\nDesde que llegamos a este otro mundo, han cambiado demasiadas cosas.\nEs una decisión inevitable si queremos calmar este caos y volver a la normalidad."

 GEH_nego_whit_wehrmacht_new:0 "Negociar con el Wehrmacht"
 GEH_nego_whit_wehrmacht_new_desc:0 "El contacto con ellos es un destino inevitable.\nEn ese caso, la Manmajeon ha concluido que, en esta situación, colaborar es mejor que luchar.\nLa presidenta Makoto empezó a buscar, dentro de Gehenna, a estudiantes que antes estudiaban lenguas antiguas,\ny con su ayuda decidió llevar a cabo las negociaciones."

 GEH_subjugation:0 "Ataque contra los remanentes"
 GEH_subjugation_desc:0 "El Wehrmacht del norte no ha podido asegurar suministros clave durante mucho tiempo desde la caída del gobierno alemán.\nA diferencia de antes, ahora están mucho más debilitados: si los atacamos, podremos dar un paso más hacia el mantenimiento del orden en Gehenna."

 GEM_Neutralize_Makoto:0 "Neutralizar a Makoto"
 GEM_Neutralize_Makoto_desc:0 "La presidenta Makoto de la Manmajeon ya era poco fiable incluso antes del Gran Traslado, pero desde entonces ha seguido con palabras y acciones que suponen una amenaza considerable para la Manmajeon y la Academia Gehenna.\nSepararemos a la presidenta Makoto de sus funciones oficiales y aplicaremos medidas temporales."

 GEM_maintaining_dictatorship:0 "El gobierno de la presidenta y el mando unificado"
 GEM_maintaining_dictatorship_desc:0 "\"¡Con el grandioso gobierno y la determinación de la señora Makoto, superaremos por completo el caos de Gehenna!\"\n- Discurso de la presidenta Makoto (extracto)\n\n¡El sistema de cogobierno de la Manmajeon, el órgano legítimo de liderazgo de la Academia Gehenna, entrará en funcionamiento!"

 GEM_gehenna_academy:0 "Gehenna primero"
 GEM_gehenna_academy_desc:0 "Aliarse con fuerzas externas sin duda dañará la identidad de la Academia Gehenna.\nLa Manmajeon colocará a Gehenna como la máxima prioridad y trabajará para afrontar todas las amenazas externas."

 GEM_perfect_team_disbanded:0 "Disolver el Comité de Disciplina"
 GEM_perfect_team_disbanded_desc:0 "Ahora es el momento de acabar con el Comité de Disciplina.\nApartaremos, aquí y ahora, al Comité de Disciplina que se interpone en el camino de la Manmajeon y de la presidenta Makoto, y construiremos una Academia Gehenna unificada."

 GEM_working_with_the_perfect_team:0 "Una sola Gehenna"
 GEM_working_with_the_perfect_team_desc:0 "Para que la Academia Gehenna pueda responder a las amenazas externas, la cooperación estrecha entre el Comité de Disciplina y la Manmajeon es imprescindible."

 GEM_ultimatum_to_the_war_navy:0 "Ultimátum a la Armada de Guerra"
 GEM_ultimatum_to_the_war_navy_desc:0 "Ahora que el Wehrmacht se ha integrado con nosotras tras las negociaciones Gehenna–Wehrmacht, propondremos a la Armada de Guerra, exiliada en la isla de Gotland, que se una a nuestro bando."

 GEM_food_supply_network:0 "Red de suministro alimentario"
 GEM_food_supply_network_desc:0 "Como la Academia Gehenna ha caído en un lugar nuevo, necesitamos crear una nueva red de suministro de alimentos.\nCon esto, también podremos mitigar en cierta medida los desmanes que provoca la Sociedad de Investigación Gourmet."

 GEM_digging_new_hot_springs:0 "Desarrollar nuevas aguas termales"
 GEM_digging_new_hot_springs_desc:0 "El Departamento de Desarrollo de Aguas Termales está presionando a la Manmajeon para invertir en nuevos proyectos termales.\nPodremos aprobar sus acciones y aportar un pequeño apoyo financiero para que detengan sus actividades destructivas."

 GEM_stable_food:0 "Alimentos estables"
 GEM_stable_food_desc:0 "El Departamento de Desarrollo de Aguas Termales está presionando a la Manmajeon para invertir en nuevos proyectos termales.\nPodremos aprobar sus acciones y aportar un pequeño apoyo financiero para que detengan sus actividades destructivas."

 GEM_upscale_strategy:0 "Estrategia de alta gama"
 GEM_upscale_strategy_desc:0 "Para satisfacer el paladar exigente de la Sociedad de Investigación Gourmet, el Club de Almuerzos Escolares producirá algunas raciones de comida de categoría superior."

 GEM_hot_spring_tourism:0 "Turismo de aguas termales"
 GEM_hot_spring_tourism_desc:0 "Dejaremos que el Departamento de Desarrollo de Aguas Termales opere el negocio turístico termal, desviando parte de sus excesos hacia otro lado."

 GEM_club_of_gehenna:0 "¡Los clubes de Gehenna!"
 GEM_club_of_gehenna_desc:0 "Aunque ocurran incidentes aquí y allá, todos los clubes de Gehenna funcionan sin problemas.\nEl sistema de clubes de Gehenna seguirá siendo firme en el futuro."

 GEM_union_state:0 "Estado federal"
 GEM_union_state_desc:0 "La Federación Alemania–Gehenna, uno de los puntos tratados en las negociaciones Gehenna–Wehrmacht, se ha establecido de verdad tras concluir con éxito.\nAhora Alemania y Gehenna operarán como un solo estado federal, con derechos iguales para ambas partes."

 GEM_german_wehrmacht:0 "Wehrmacht alemán"
 GEM_german_wehrmacht_desc:0 "En las negociaciones anteriores, el Wehrmacht aceptó unirse a la Academia Gehenna a cambio de una considerable autonomía.\nDebemos pensar cómo aprovechar a este nuevo Wehrmacht integrado."

 GEM_luftwaffe:0 "Integración de la Luftwaffe"
 GEM_luftwaffe_desc:0 "Podemos integrar en la Academia Gehenna a la fuerza aérea alemana, cuyo sistema de mando está completamente roto, aprovechando los puntos de contacto con el Wehrmacht.\nAunque no todos nos seguirán, incluso si solo una parte de la Luftwaffe se nos une, podremos cubrir el vacío aéreo."

 GEM_general_staff:0 "Estado Mayor"
 GEM_general_staff_desc:0 "Empezando por restaurar la organización de Estado Mayor alemana, reconstruiremos los sistemas que antes poseía el antiguo Wehrmacht alemán."

 GEM_systematic_training_system:0 "Sistema de entrenamiento del Wehrmacht"
 GEM_systematic_training_system_desc:0 "Tomaremos como modelo el sistema de entrenamiento del Wehrmacht alemán, que logró grandes resultados contra nosotras incluso sin Halos, para entrenar a las estudiantes de Gehenna."

 GEM_german_officer_corps:0 "Cuerpo de oficiales alemanes"
 GEM_german_officer_corps_desc:0 "Es cierto que muchos generales del Wehrmacht se separaron en protesta por la integración con Gehenna, pero aun así logramos absorber una cantidad nada despreciable de su alto mando."

 GEM_creation_of_the_gehenna_wehrmacht:0 "Fundar el Wehrmacht de Gehenna"
 GEM_creation_of_the_gehenna_wehrmacht_desc:0 "Crearemos el ejército de Gehenna tomando como base el sistema del Wehrmacht.\nEsto mejorará enormemente la capacidad de las estudiantes de Gehenna para ejecutar operaciones de combate."

 GEM_joint_staff:0 "Cuartel General de Estado Mayor Conjunto"
 GEM_joint_staff_desc:0 "Un sistema donde conviven el ejército alemán y el de Gehenna reducirá de forma considerable nuestra capacidad operativa en tiempos de guerra.\nPara resolver este problema, estableceremos un Estado Mayor Conjunto y aumentaremos en gran medida la capacidad de Gehenna para conducir operaciones."

 GEM_gehenna_militarism:0 "Militarismo de Gehenna"
 GEM_gehenna_militarism_desc:0 "Para responder a la amenaza de potencias extranjeras, ampliaremos el ejército a gran escala,\ny mediante propaganda y educación fomentaremos la unidad entre las estudiantes de Gehenna y las y los alemanes dentro de las fuerzas armadas."

 GEM_solitary_force:0 "Unidad de bloqueo"
 GEM_solitary_force_desc:0 "Por desgracia, debemos admitir que la actitud de las estudiantes de Gehenna no encaja con el ejército.\nPara mejorar su capacidad de combate, desplegaremos unidades de bloqueo, y la deserción será castigada con severidad."

 GEM_reorganization_of_the_private_army:0 "Reforma del sistema de ejércitos privados"
 GEM_reorganization_of_the_private_army_desc:0 "Ampliaremos a gran escala el sistema existente de ejércitos privados de la Manmajeon y lo reorganizaremos como una fuerza destinada a proteger a toda Gehenna.\nCon este proceso, podremos restaurar con normalidad la capacidad militar de Gehenna."

 GEM_crazy_heroism:0 "Heroísmo fanático"
 GEM_crazy_heroism_desc:0 "A través de la propaganda, formaremos guerreras y guerreros de la Manmajeon que carguen en el frente sin miedo.\nNuestros héroes de guerra serán alabados sin fin, y esa gloria se transmitirá de generación en generación."

 GEM_pandemonium_assault_unit:0 "Fuerza de asalto de la Manmajeon"
 GEM_pandemonium_assault_unit_desc:0 "Formaremos organizaciones paramilitares que cooperen con nuestro ejército para reforzar la capacidad militar de la Academia Gehenna."

 GEM_inhumane_tactics:0 "Ofensiva de oleadas humanas"
 GEM_inhumane_tactics_desc:0 "El Halo no se destruye con facilidad con ataques comunes.\nEn vez de entrenamiento disperso, introducir a más estudiantes en combate hará que el poder militar de Gehenna aumente más rápido y con mayor fuerza."

 GEM_superiority_of_will:0 "La superioridad de la voluntad"
 GEM_superiority_of_will_desc:0 "En el campo de batalla nacen los héroes.\nMediante propaganda y educación repetida, podremos completar a la perfección la formación ideológica del ejército estudiantil de Gehenna."

 GEM_war_with_trinity:0 "Guerra con Trinity"
 GEM_war_with_trinity_desc:0 "Con respuestas débiles no podremos cortar la mala sangre con Trinity.\nEl interminable conflicto y el abismo emocional que se ha profundizado entre Gehenna y Trinity terminarán por completo, aquí y ahora."

 GEM_help_perfect_team:0 "Cooperar con el Comité de Disciplina"
 GEM_help_perfect_team_desc:0 "Ahora que Trinity marcha hacia el corazón de Gehenna, debemos aceptar toda ayuda posible.\nAunque provenga del Comité de Disciplina, que ha sido hostil con nosotras."

 GEM_ethnic_hatred:0 "Explotar el odio"
 GEM_ethnic_hatred_desc:0 "El abismo emocional que se ha profundizado durante tanto tiempo entre las dos academias está ayudando enormemente a nuestra guerra.\nLas estudiantes de Gehenna, enfurecidas por las atrocidades de Trinity, cooperan activamente con nuestro esfuerzo bélico."

 GEM_march_of_the_demons:0 "La marcha de los demonios"
 GEM_march_of_the_demons_desc:0 "Ha llegado el momento de cortar la respiración de Trinity.\nPrepararemos una contraofensiva total y daremos inicio a la avanzada contra esa pérfida Trinity."

 GEM_unlimited_conscription:0 "Eliminar el límite de reclutamiento"
 GEM_unlimited_conscription_desc:0 "La Manmajeon acaba de aprobar una ley para movilizar sin restricciones no solo a las estudiantes de Gehenna, sino también a la población alemana local para nuestra guerra."

 GEM_defend_gehenna:0 "¡Defended Gehenna!"
 GEM_defend_gehenna_desc:0 "Debemos responder al ataque sorpresa de Trinity.\nTenemos que ganar tiempo para reorganizar nuestras fuerzas y contener la invasión de esas lunáticas aladas."

 GEM_sorting_out_the_maginot:0 "Purgar la guarnición de la Línea Maginot"
 GEM_sorting_out_the_maginot_desc:0 "Es hora de barrer y destruir por completo al ejército francés de la Línea Maginot, atrincherado en sus fortalezas."

 GEM_natsume_iroha:0 "¡La reformista de la Manmajeon!"
 GEM_natsume_iroha_desc:0 "La candidata más adecuada para liderar la nueva Manmajeon será Natsume Iroha, una prometedora comandante de tanque de Gehenna."

 GEM_motomiya_chiaki_focus:0 "Expansión de la Secretaría"
 GEM_motomiya_chiaki_focus_desc:0 "La secretaria de la Manmajeon, Motomiya Chiaki, encabezará el nuevo liderazgo."

 GEM_manmajeon_secretariat_founding: "Fundación de la Secretaría de la Manmajeon"
 GEM_press_agencies_integration: "Integración de las agencias de prensa"
 GEM_weekly_manmajeon_expansion: "Expansión semanal de la Manmajeon"
 GEM_publicity_director_chiaki: "Chiaki, directora de propaganda pública"
 GEM_public_opinion_censorship: "Censura de la opinión pública"
 GEM_ibuki_cf: "Rodaje del comercial de Ibuki"
 GEM_dignified_nation: "Una nación digna"

 GEM_group_leadership_system:0 "Decisión de la Manmajeon"
 GEM_group_leadership_system_desc:0 "La Manmajeon ha acordado destituir a Makoto.\nAhora, la Manmajeon se preparará para elegir a una nueva presidenta."

 GEM_pandemonium_reform:0 "Reforma de la Manmajeon"
 GEM_pandemonium_reform_desc:0 "El nuevo liderazgo de la Manmajeon corregirá la administración laxa de antaño y recortará el presupuesto despilfarrado."

 GEM_pandemonium_expansion:0 "Ampliación de ejecutivas de la Manmajeon"
 GEM_pandemonium_expansion_desc:0 "Iroha ha comenzado a organizar a gran escala nuevas ejecutivas de la Manmajeon para distribuir su carga de trabajo."

 GEM_local_government_takeover:0 "Tomar el control del gobierno estatal"
 GEM_local_government_takeover_desc:0 "Si tomamos el control de los gobiernos estatales alemanes, podremos reducir la carga administrativa de la Manmajeon y asegurar con facilidad el control sobre los gobiernos locales."

 GEM_local_autonomy:0 "Autonomía local"
 GEM_local_autonomy_desc:0 "Establecer el control total de la Manmajeon sobre toda Gehenna exige una carga administrativa enorme.\nApoyaremos activamente un sistema de autonomía local para buscar una convivencia pacífica entre Gehenna y Alemania."

 GEM_social_reorganization:0 "Proteger la identidad alemana"
 GEM_social_reorganization_desc:0 "Natsume Iroha respetará la identidad alemana y la utilizará para transformar Gehenna en una nueva academia."

 GEM_united_states_of_gehenna:0 "Estados Unidos de Gehenna"
 GEM_united_states_of_gehenna_desc:0 "El nuevo sistema de Gehenna, organizado con gobiernos estatales y la Manmajeon, será conocido como los “Estados Unidos de Gehenna”.\nUn parlamento alemán elegido democráticamente y la Manmajeon cooperarán y se controlarán mutuamente para construir una academia sana."

 GEM_ruler_of_gehenna:0 "Gobernante de Gehenna"
 GEM_ruler_of_gehenna_desc:0 "\"¡La gran gobernante de Gehenna no es otra que la señora Hanuma Makoto! Que todos sigan mi guía.\"\n- Segundo discurso de la presidenta Makoto (extracto)"

 GEM_cultural_dominance:0 "Dominio de la cultura popular"
 GEM_cultural_dominance_desc:0 "La presidenta Makoto ha enseñado que, para gobernar de verdad Gehenna, hay que dominar su cultura popular.\nLas y los miembros de la Manmajeon, siguiendo su voluntad, se harán con el control cultural de Gehenna."

 GEM_bodyguard:0 "Fundar el Departamento de Protección de la Manmajeon"
 GEM_bodyguard_desc:0 "Debido al enorme poder de la presidenta, si esta fuera atacada y no pudiera desempeñar sus funciones, el trámite administrativo de la Manmajeon se volvería extremadamente complejo y caótico.\nPara evitar que ocurra tal situación, formaremos una unidad de protección que siga a la presidenta [GEM.GetLeader]."

 GEM_suppression_of_german:0 "Reprimir la resistencia"
 GEM_suppression_of_german_desc:0 "Resistencias contrarias a nuestra academia están operando por todas partes.\nLas erradicaremos para lograr una estabilización temporal del orden público."

 GEM_policing:0 "Ejercer la autoridad policial"
 GEM_policing_desc:0 "Algunos clubes de Gehenna, mediante acciones extremas, están debilitando la capacidad administrativa de la Manmajeon.\nRestringiremos sus actividades para mejorar la capacidad de gobierno de la Manmajeon."

 GEM_dissolution_of_state_government:0 "Disolver por la fuerza los gobiernos estatales"
 GEM_dissolution_of_state_government_desc:0 "La Manmajeon disolverá por la fuerza los gobiernos estatales y comenzará a ejercer un control directo sobre las regiones.\nLa reorganización administrativa traerá algo de caos, pero lo que obtendremos superará con creces cualquier costo."

 GEM_gehenna_identity:0 "Régimen único"
 GEM_gehenna_identity_desc:0 "El extraño sistema en el que coexistían el gobierno estatal alemán y el gobierno académico de la Manmajeon ha llegado a su fin.\nEl doble gobierno se derrumbará, y la Manmajeon actuará como el único régimen del territorio de Gehenna."

 GEM_take_control_of_pandemonium:0 "Tomar el control de la Manmajeon"
 GEM_take_control_of_pandemonium_desc:0 "Aunque Hanuma Makoto ha sido apartada recientemente de varias tareas prácticas, su influencia sobre la Manmajeon y sobre toda Gehenna sigue siendo enorme.\nHemos logrado neutralizar parte de sus atribuciones; ahora es el momento de sacar oficialmente a Hanuma Makoto del puesto de presidenta de la Manmajeon y enderezar la política de Gehenna."

 GEM_budget_reorganization:0 "Reorganización del presupuesto"
 GEM_budget_reorganization_desc:0 "El inicio para arreglar el trabajo administrativo de la Manmajeon es volver a revisar por completo todos los presupuestos asignados.\nEs hora de recortar el dinero que se está desperdiciando por todas partes bajo las órdenes de Hanuma Makoto."

 GEM_tanga_ibuki:0 "...¿Ibuki?"
 GEM_tanga_ibuki_desc:0 "Hmm, parece que Tanga Ibuki dice que quiere probar a ser presidenta de la Manmajeon."

