 GEM_club_problem_decision:0 "Clubes de Gehenna"
 GEM_club_problem_decision_desc:0 "Entre los §Gclubes§! de la §YAcademia Gehenna§!, hay dos que desde antes del Gran Cataclismo han sido el dolor de cabeza de toda la §YAcademia Gehenna§!. El §3Club de Desarrollo de Aguas Termales§! causa destrucción a gran escala bajo el pretexto del desarrollo de aguas termales, y el §pClub de Investigación Gourmet§! creció explosivamente tras el Gran Cataclismo, criticando la comida callejera alemana y, con el respaldo de la línea dura antialemana dentro de Gehenna, encabeza los actos terroristas contra la población local.\n\nLos actos terroristas de estos clubes están causando graves obstáculos a la administración de la §YAcademia Gehenna§!, pero en el futuro podremos obtener beneficios en diversos ámbitos mediante la §Gcooperación§! o la §Rrepresión§! de estos clubes, y la estabilización de la §YAcademia Gehenna§! quedará en nuestras manos."

