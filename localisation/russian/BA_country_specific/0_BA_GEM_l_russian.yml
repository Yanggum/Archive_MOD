 GEM_war_preparations: "Preparativos de guerra"
 GEM_war_preparations_desc: "Para estar totalmente preparados para la guerra venidera, la preparación debe abarcar no solo a la Manmajeon, sino también a toda la industria y la infraestructura de Gehenna."

 GEM_prepare_for_the_next_blockade_ww: "Prepararse para el aislamiento nacional"
 GEM_prepare_for_the_next_blockade_ww_desc: "Si nuestro país entra en guerra con otra nación, muchas relaciones diplomáticas cambiarán y se cortarán.\nSi preparamos a fondo la batalla decisiva en territorio alemán, el aislamiento diplomático apenas podrá afectarnos."

