 GEM_gehenna_national_reconquest: "Reconquista nacional de Gehenna"
 GEM_gehenna_national_reconquest_desc: "Tras un gran fracaso, hemos perdido parte del territorio de la Academia Gehenna y hemos creado una amenaza al norte: un Estado que posee la enorme ideología de la unificación alemana. Para salir de esta situación amenazante y estabilizar el país, debemos someterlos incluso por la fuerza y unificar la hegemonía de toda la Academia Gehenna y de todos los dominios alemanes."
