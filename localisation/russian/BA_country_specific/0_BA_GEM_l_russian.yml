 GEH_anarchist_society:0 "Club de Desarrollo de Aguas Termales"
 GEH_anarchist_society_desc:0 "El Club de Desarrollo de Aguas Termales es el club de obras civiles de Gehenna y, de facto, su cuerpo de ingenieros. Con una obsesión delirante por las aguas termales, perforan agujeros por todas partes y, en casos graves, incluso revientan tuberías de desagüe mientras afirman que “es una terma”, provocando problemas con frecuencia."
 GEH_anarchist_society_8_desc:0 "Tras ser disuelto directamente por el Comité de Disciplina y reorganizado como un nuevo club, el Club de Desarrollo de Aguas Termales ya no causa problemas."

 GEH_Gourmet_Research_Society_idea:0 "Club de Investigación Gastronómica"
 GEH_Gourmet_Research_Society_idea_desc:0 "El Club de Investigación Gastronómica. Por el nombre parecería un club que investiga la alta cocina, pero en realidad se sabe que, si algo es rico, van a donde sea y se lo comen sin importar si es Trinity o Millennium. Peor aún: si la comida no les gusta, llegan a volar el restaurante sin miramientos, causando caos social."
 GEH_dongari_problem:0 "Problemas de clubes"

 GEH_pandemonium_militia: "Legión de la Manmajeon"
 GEH_pandemonium_militia_desc: "La Legión de la Manmajeon es una fuerza privada leal a [GEM.GetLeader], unida como un solo cuerpo bajo el lema de ‘por Gehenna’."

 GEH_great_horn:0 "Gran caos"
 GEH_great_horn_desc:0 "Por una situación inesperada, Gehenna está sumida en un estado de caos absoluto. Con la comprensión de la situación todavía incompleta, si nos preguntaran qué podemos hacer, podríamos responder con confianza: “nada”. La prioridad es entender lo que ocurre lo antes posible."
 GEH_great_horn_1:0 "Reconocimiento de la situación"
 GEH_great_horn_1_desc:0 "Hemos logrado entender la situación, pero eso no significa que algo haya cambiado de forma drástica. Gehenna sigue teniendo pocas opciones disponibles."
 GEH_great_horn_2:0 "Situación mejorada"
 GEH_great_horn_2_desc:0 "En cierta medida —solo en cierta medida—, la situación ha mejorado con claridad. Gehenna se está recuperando y ahora tenemos margen para considerar varias opciones."

