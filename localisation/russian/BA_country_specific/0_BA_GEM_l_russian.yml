 GEM_organize_the_opposition: "Organizar a la oposición"
 GEM_organize_the_opposition_desc: "El gobierno no ha cumplido sus promesas y debe ser tratado en consecuencia. Es hora de unificar a la oposición para reunir apoyos y atacar a [ROOT.GetLeader]."
 GEM_appeal_to_the_geh_spirit: "Avivar el espíritu de Gehenna"
 GEM_appeal_to_the_geh_spirit_desc: "Debemos apelar a la determinación, resiliencia y fortaleza especiales de las estudiantes de Gehenna frente a la adversidad. Todo el pueblo del distrito autónomo de Gehenna debe esforzarse unido para superar cualquier dificultad. ¡Nuestra comunidad libre—Gehenna nos hace fuertes!"
 GEM_entice_the_masses: "Agitar a las masas"
 GEM_entice_the_masses_desc: "Las masas se dejan sacudir con facilidad. Prometiendo resolver pequeños problemas que les toquen el corazón, nuestro gobierno puede volverse más atractivo para la gente común de Gehenna y ganarse su favor."
