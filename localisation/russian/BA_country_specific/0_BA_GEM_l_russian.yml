 GEM_focus_ended_tooltip_AO: "§gComo aún no hemos decidido ninguna dirección política, el Estado Alemán será nuestra orientación política.§!"
 GEM_focus_ended_tooltip_A1_A: "§gComo seguimos el camino de $GEH_akzhxh$, podremos usurpar la hegemonía alemana y crear un Lebensraum más amplio.§!"
 GEM_focus_ended_tooltip_A2_A: "§gComo seguimos el camino de $GEH_satsuki$, podremos fundar el Ministerio de Ilustración Popular para aliviar el conflicto étnico, expandir la política tras bambalinas, gobernar todas las religiones o incluso convertirnos en el Emperador de toda Alemania.§!"
 GEM_focus_ended_tooltip_A3_A: "§gComo seguimos el camino de $GEH_dlfhgk$, se restaurará gradualmente la Federación Alemana liberal de 1848.§!"
 GEM_focus_ended_tooltip_A4_A: "§gComo seguimos el camino de $GEH_motomiya_chiaki$, se proclamará un sistema de partido único que integrará a todos los partidos.§!"

 GEM_focus_ended_tooltip_C: "§gComo mantenemos la forma de Estado de la Academia Gehenna, se desbloquearán las rutas de “el pueblo alemán para Gehenna”.§!"
 GEM_focus_ended_tooltip_C1: "§gComo seguimos el camino de $GEH_akzhxh$, proclamaremos el Gran Estado de Gehenna.§!"
 GEM_focus_ended_tooltip_C2: "§gComo seguimos el camino de $GEH_satsuki$, reconstruiremos la academia sobre la base de NK Ultra o lavaremos el cerebro de todas las estudiantes y las masas.§!"
 GEM_focus_ended_tooltip_C3: "§gComo seguimos el camino de $GEH_dlfhgk$, comenzarán las reformas para la ciudadanía alemana dentro de los Estados Unidos de Gehenna.§!"
 GEM_focus_ended_tooltip_C4: "§gComo seguimos el camino de $GEH_motomiya_chiaki$, se proclamará la Nación Gehenna para poner fin al conflicto étnico.§!"

 GEM_focus_ended_tooltip_B: "§gComo hemos establecido un federalismo con Alemania, se desbloquearán las rutas del “Estado de dos pueblos”.§!"
 GEM_focus_ended_tooltip_BO: "§gComo aún no hemos decidido ninguna dirección política, el Estado de dos pueblos será nuestra orientación política.§!"
 GEM_focus_ended_tooltip_B1_B: "§gComo seguimos el camino de $GEH_akzhxh$, podremos proclamar un Lebensraum más amplio.§!"
 GEM_focus_ended_tooltip_B2_B: "§gComo seguimos el camino de $GEH_satsuki$, se nos darán varias opciones para mediar el conflicto entre gehenna y alemanes, y definir la dirección de NK Ultra.§!"
 GEM_focus_ended_tooltip_B3_B: "§gComo seguimos el camino de $GEH_dlfhgk$, comenzarán las reformas de la Federación de Estados Unidos Alemana-Gehenna.§!"
 GEM_focus_ended_tooltip_B4_B: "§gComo seguimos el camino de $GEH_motomiya_chiaki$, se proclamará la Nación Gehenna para poner fin al conflicto étnico.§!"

 GEM_focus_ended_tooltip_1O: "§gComo aún no hemos decidido ninguna dirección política, seguiremos el camino de $GEH_akzhxh$.§!"
 GEM_focus_ended_tooltip_2O: "§gComo aún no hemos decidido ninguna dirección política, seguiremos el camino de $GEH_satsuki$.§!"
 GEM_focus_ended_tooltip_3O: "§gComo aún no hemos decidido ninguna dirección política, seguiremos el camino de $GEH_dlfhgk$.§!"
 GEM_focus_ended_tooltip_4O: "§gComo aún no hemos decidido ninguna dirección política, seguiremos el camino de $GEH_motomiya_chiaki$.§!"

 GEM_focus_ended_tooltip_tip: "§OTIP: ¡Este enfoque político ramifica el árbol según cuál enfoque se complete primero!§!"

 GEM_focus_ended_tooltip_B1_1: "§gComo ya se proclamó el Estado de dos pueblos, $GEH_akzhxh$ intentará construir el Estado de dos pueblos más poderoso.§!"
 GEM_focus_ended_tooltip_B2_2: "§gComo ya se proclamó el Estado de dos pueblos, $GEH_satsuki$ intentará aliviar el conflicto étnico mediante hipnosis.§!"
 GEM_focus_ended_tooltip_B3_3: "§gComo ya se proclamó el Estado de dos pueblos, $GEH_dlfhgk$ reforzará el federalismo entre ambos pueblos.§!"
 GEM_focus_ended_tooltip_B4_4: "§gComo ya se proclamó el Estado de dos pueblos, $GEH_motomiya_chiaki$ dará el salto hacia un imperio de convivencia.§!"

 GEM_focus_ended_tooltip_A1_1: "§gComo ya se proclamó el Estado Alemán, $GEH_akzhxh$ intentará fundar el Gran Estado Germánico y convertirse en Führer.§!"
 GEM_focus_ended_tooltip_A2_2: "§gComo ya se proclamó el Estado Alemán, $GEH_satsuki$ construirá la idea espiritual del pueblo alemán.§!"
 GEM_focus_ended_tooltip_A3_3: "§gComo ya se proclamó el Estado Alemán, $GEH_dlfhgk$ reforzará el sistema federal al estilo alemán.§!"
 GEM_focus_ended_tooltip_A4_4: "§gComo ya se proclamó el Estado Alemán, $GEH_motomiya_chiaki$ intentará convertirse en Führer para proteger a la pequeña Academia Gehenna.§!"

