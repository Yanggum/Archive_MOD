 GEM_maginot_line_stabilization: "Pacificar la Línea Maginot"
 GEM_maginot_line_stabilization_desc: "La enorme amenaza llamada Trinity ha desaparecido, y toda fuerza capaz de oponerse a que anexemos legítimamente Alsacia y Lorena y expulsemos a todas las guarniciones de la Línea Maginot se ha desvanecido sin dejar rastro.\n¡Anexionaremos Alsacia-Lorena!"

