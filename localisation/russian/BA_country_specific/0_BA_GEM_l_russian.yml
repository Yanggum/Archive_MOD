 GEM_ibuki_system_action_1_icon_tt: "§tAmbición§!\nLa ambición de Ibuki Tanga. Es el grado en que busca sueños más grandes, metas más altas y el logro de tareas mediante la guerra; y la capacidad de una agitadora que empuja a su entorno a seguir sus grandes planes.\n\n§g - Este icono proviene de 'League of Legends'.§!"
 GEM_ibuki_system_action_2_icon_tt: "§OPrestigio§!\nEl prestigio de Ibuki Tanga. Es el grado en que busca autoridad, poder y ser venerada; y la capacidad de una intrigante que maneja a la gente.\n\n§g - Este icono proviene de 'League of Legends'.§!"
 GEM_ibuki_system_action_3_icon_tt: "§1Eficiencia§!\nLa eficiencia de Ibuki Tanga. Es el grado en que busca orden, administración eficiente y sangre fría para cumplir objetivos; y la capacidad de una administradora que gestiona el sistema.\n\n§g - Este icono proviene de 'League of Legends'.§!"
 GEM_ibuki_system_action_4_icon_tt: "§CIdeales§!\nLos ideales de Ibuki Tanga. Es el grado en que busca sueños internos, idealismo de cuento de hadas y mediar conflictos para inducir armonía; y la capacidad de una soñadora que “encanta” a su entorno para que siga sus sueños.\n\n§g - Este icono proviene de 'League of Legends'.§!"

