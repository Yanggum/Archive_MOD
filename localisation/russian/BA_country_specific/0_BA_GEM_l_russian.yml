 GEM_makoto_system_decision: "Las hazañas de Makoto Hanuma"
 GEM_makoto_system_tt: "§tLas hazañas de Makoto Hanuma§! están actualmente en el estado [GEM_makoto_system_loc]."
 GEM_makoto_system_0_text: "§WIncapaz§!"
 GEM_makoto_system_1_text: "§CInsignificante§!"
 GEM_makoto_system_2_text: "§GDeficiente§!"
 GEM_makoto_system_3_text: "§gEndeble§!"
 GEM_makoto_system_4_text: "§LIncompleto§!"
 GEM_makoto_system_5_text: "§YNormal§!"
 GEM_makoto_system_6_text: "§OEjemplar§!"
 GEM_makoto_system_7_text: "§pExcelente§!"
 GEM_makoto_system_8_text: "§tGrandioso§!"
 GEM_makoto_system_9_text: "§SMajestuoso§!"
 GEM_makoto_system_up: "La etapa de §YLas hazañas de Makoto Hanuma§! §Saumenta§!.\n- Siguiente etapa: [GEM_makoto_system_oneup_loc]"
 GEM_makoto_system_temp_trigger_upper: "La etapa de §YLas hazañas de Makoto Hanuma§! es igual o mayor que [GEM_makoto_system_temp_loc]"
 GEM_makoto_system_temp_trigger_lower: "La etapa de §YLas hazañas de Makoto Hanuma§! es menor que [GEM_makoto_system_temp_loc]"
 GEM_makoto_system_desc_ONE: "§tMakoto Hanuma§! es arrogante. Es una líder extremista de la que cualquiera podría decir que es temeraria. Sí, eso es un hecho indiscutible. Sin embargo, precisamente por eso, aún quedan muchas cosas en el mundo que solo ella, quien va al frente, puede hacer.\n\nLas §Yhazañas§! de §tMakoto Hanuma§! reflejan esta tendencia. A medida que logre más, sus §Yhazañas§! aumentarán, y cuanto más altas sean, sus grandes ideas empezarán a materializarse poco a poco en la realidad. Pero cuanto más §Sgrandiosas sean las gestas§! que alcance, quizá más se irá alejando de las cosas pequeñas."
 GEM_makoto_system_desc_RIGHT: "Makoto Hanuma quizá sea una villana, pero a una persona no se la puede juzgar solo por un aspecto. La forma en que cuida a quienes la rodean, cómo piensa en Gehenna y el hecho de ser una autoridad electa y legítima resaltan su doble cara.\n\nPor eso, cuanto más bajas sean sus hazañas, más capaz será de seguir su propio camino sin tambalearse por su arrogancia."
 GEM_makoto_system_decision_1: "Moralización de Alemania"
 GEM_makoto_system_decision_2: "Integración de los dos mundos"
 GEM_makoto_system_decision_3: "Nuevo orden"
 GEM_makoto_system_decision_4: "Teoría del nacionalismo gehennaín"
 GEM_makoto_system_decision_4_desc: "¡Alabemos la libertad de Gehenna! ¿En qué situación estamos? En una crisis de desaparición de la academia. Para que Gehenna sobreviva, debemos establecer una forma de actuar 'propia de Gehenna' y cultivar una etnicidad nuestra, para nosotros y solo nuestra."
 GEM_makoto_system_decision_5: "Teoría de la Gehenna libre"
 GEM_makoto_system_decision_5_desc: "¿Qué es la libertad de Gehenna? Incluso dentro del desorden, levantamos nuestra propia comunidad y vivimos libres bajo el gobierno de una líder elegida. ¡Esto puede consolidarse como una ideología: un liberalismo, la libertad más gehennaína!"
 GEM_makoto_system_decision_6: "La posición más propia de la Prefectura"
 GEM_makoto_system_decision_6_desc: "La Prefectura de Gehenna, como siempre, solo debe existir debajo de nosotras. Su 'orden' es la mayor amenaza para la libertad de Gehenna, y tras el Gran Cataclismo demostraron esas sospechas al actuar como caudillos militares."

 GEM_satsuki_system_decision: "El control de Satsuki Kogyoku"


 GEM_iroha_system_decision: "El consejo asesor de Iroha Natsume"


 GEM_chiaki_system_decision: "La propaganda de Chiaki Motomiya"
 GEM_chiaki_system_desc_ONE: "Poder propagandístico: [?GEM_chiaki_system_ori_var|H.0]"
 GEM_chiaki_system_var_tt: "- Poder propagandístico §S+$RIGHT|0$§!"
 GEM_chiaki_system_desc_TWO: "§YChiaki Motomiya§! se esfuerza por cubrir el país con §tpropaganda§!. Cada §tpropaganda§! puede ejecutar varias campañas a la vez y se suma al §Spoder propagandístico§!."
 GEM_chiaki_system_decision_costup_tt: "Esta §Ydecisión§! aumenta su §Ycoste§! cada vez que se elige."
 GEM_chiaki_system_decision_1: "Propaganda masiva: propaganda estatal"
 GEM_chiaki_system_decision_2: "Campaña: ahorro de consumo"
 GEM_chiaki_system_decision_3: "Campaña: apoyo administrativo"
 GEM_chiaki_system_decision_4: "Propaganda: emisión de deuda pública"
 GEM_chiaki_system_decision_5: "Propaganda masiva: defensa de la patria"
 GEM_chiaki_system_decision_6: "Campaña: separación de residuos y reciclaje"
 GEM_chiaki_system_decision_7: "Campaña: erradicar la discriminación de género"
 GEM_chiaki_system_decision_8: "Propaganda: héroe del trabajo"
 GEM_chiaki_system_decision_9: "Propaganda: fomentar el servicio militar"
 GEM_chiaki_system_decision_10: "Propaganda masiva: guerra total nacional"
 GEM_chiaki_system_decision_11: "Propaganda: disfrute cultural de [ROOT.GetAdjective]"
 GEM_chiaki_system_decision_12: "Campaña: reforma cultural"
 GEM_chiaki_system_decision_13: "Propaganda: aliviar conflictos"
 GEM_chiaki_system_decision_14: "Propaganda: innovación económico-tecnológica"
 GEM_chiaki_system_decision_15: "Propaganda: redistribución de la riqueza"
 GEM_chiaki_system_decision_16: "Propaganda: revolución hacia la producción"
 GEM_chiaki_system_decision_17: "Propaganda: impulsar empresas financieras"
 GEM_chiaki_system_decision_18: "Propaganda: acopio de carbón"
 GEM_chiaki_system_decision_19: "Campaña: lucha de la comunidad étnica"
 GEM_chiaki_system_decision_20: "Campaña: des-etnonacionalismo"

 GEM_chiaki_system_decision_1_desc: "¡A todas las ciudadanas del Estado, obreras, campesinas, estudiantes que cultivan y se dedican al país, debe concedérseles la gloria que merecen!"
 GEM_chiaki_system_decision_2_desc: "¡Reducir el despilfarro y convertir por completo los recursos nacionales en poder nacional!"
 GEM_chiaki_system_decision_3_desc: "Para que la administración del Estado funcione con fluidez, debemos incentivar la participación administrativa de todo el pueblo."
 GEM_chiaki_system_decision_4_desc: "¡Compra bonos de defensa y sirve a la patria!"
 GEM_chiaki_system_decision_5_desc: "¡Entrégate por la patria; aquí hay una crisis histórica!"
 GEM_chiaki_system_decision_6_desc: "La separación correcta de residuos permite ahorrar recursos y proteger el medio ambiente."
 GEM_chiaki_system_decision_7_desc: "Ahora que conviven numerosas etnias, debemos eliminar diversas formas de discriminación."
 GEM_chiaki_system_decision_8_desc: "¡Al trabajador diligente, la gloria que merece!"
 GEM_chiaki_system_decision_9_desc: "¡El país te necesita!"
 GEM_chiaki_system_decision_10_desc: "¡Levantaos ahora, pueblo, y enfrentaos a la tormenta!"
 GEM_chiaki_system_decision_11_desc: "Fusionar y difundir nuestra cultura y la de esta tierra."
 GEM_chiaki_system_decision_12_desc: "Si reducimos los puntos de fricción entre nosotros, podremos construir un país mejor."
 GEM_chiaki_system_decision_13_desc: "Pelearse dentro de la sociedad no hace más que publicitar nuestras debilidades ante otras sociedades."

 #########################################################################
 GEAC_you_will_lose_the_bonus_tt: "§RDeclarar la guerra a otra Academia Gehenna dañará gravemente los valores de cooperación y coexistencia; por ello, seremos expulsados del frente cooperativo de Gehenna y perderemos para siempre el acceso al árbol de enfoques compartido.§!"
 GEAC_event.1.t: "¡[FROM.PREV.GetNameDefCap] rompió la cooperación de Gehenna al declarar la guerra a [FROM.PREV.FROM.GetNameDefCap]!"
 GEAC_if_join_tt: "Si aceptamos este acuerdo, se establecerá un §Ypacto de no agresión§! y se desbloqueará un §Yárbol de enfoques compartido§! para el desarrollo industrial entre las academias de Gehenna."
 GEAC_event.1.desc: "Ha llegado una noticia sorprendente: [FROM.PREV.GetNameDefCap] declaró la guerra a otro miembro y ha aplastado el valor de la cooperación mutua dentro del bloque gehenna-germánico. Como resultado, el bando [FROM.PREV.GetNonIdeologyName] ha sido excluido de los planes de cooperación industrial que se llevan a cabo en todo Gehenna. Aún se desconoce qué impacto tendrá esto sobre el tratado. Podría reforzar la cohesión de otros poderes del bloque gehennaín… o podría provocar, en cadena, el fin de la unidad de Gehenna..."
 GEAC_event.1.a: "Solo espero que esto no lleve al colapso total de Gehenna..."

 GEAC_event.2.t: "Plan de cooperación industrial de Gehenna"
 GEAC_event.2.desc: "[GEAC_leader.GetLeader] se acercaba a [ROOT.GetLeader] proponiendo un pacto de no agresión, dejando abierta la posibilidad de una cooperación más duradera en el futuro. Los diplomáticos [event_target:GEAC_leader.GetAdjective] analizaron con detalle la historia e intereses comunes entre ambos países, y trabajaron con empeño, cada uno desde su posición, deseando sinceramente la paz entre naciones hermanas. Hasta ahora, las negociaciones avanzan sin problemas, pero la decisión final de firmar o no firmar recae en nosotros."
 GEAC_event.2.a: "Aunque nos caigamos mal, hay que hacer lo que hay que hacer."
 GEAC_event.2.b: "No somos tan cercanos, [GEAC_leader.GetLeader]."

 GEAC_event.3.t: "[FROM.GetName] acepta la cooperación industrial entre academias de Gehenna"
 GEAC_event.3.desc: "[FROM.GetLeader] reaccionó de forma muy favorable al tratado de coexistencia y al pacto de no agresión que propusimos, y dijo que no había necesidad de perder más tiempo, firmando el tratado de inmediato. Con su aceptación, ¡nos hemos acercado un paso más a la paz de nuestra patria y del mundo!"
 GEAC_event.3.a: "Aunque nos caigamos mal, hay que hacer lo que hay que hacer."

 GEAC_event.4.t: "¡[FROM.GetName] rechaza la cooperación industrial entre academias de Gehenna!"
 GEAC_event.4.desc: "[FROM.GetLeader] escribió una larga carta informando a [ROOT.GetLeader] que proponer un pacto de no agresión no era más que desperdiciar papel y tinta. Además, [FROM.GetLeader] escribió que formalizar una alianza entre [FROM.GetNameDef] y [FROM.GetNameDef] solo era una pérdida de tiempo, y que en adelante no participaría en ningún plan [ROOT.GetAdjective]."
 GEAC_event.4.a: "...podía haber dicho simplemente 'no'."

 GEH_tank_designer: "Industria pesada de Gehenna"
 GEH_tank_designer_tooltip: "Modificadores de §Y$GEH_tank_designer$§!:"

 GEAC_unified_but_divided_gehenna_academy: "Desarrollo industrial pan-Gehenna"
 GEAC_unified_but_divided_gehenna_academy_desc: "Gehenna, los germanos y Luxemburgo—Manmajeon—Prefectura del oeste alemán comparten diversas culturas y mantienen una apertura fronteriza activa. Aunque se lleven mal, el trabajo de desarrollar conjuntamente la academia es algo que debe hacerse."
 GEAC_basic_available_trigger_tt: "No estar en guerra con una facción de la Academia Gehenna"
 GEAC_unified_but_divided_gehenna_academy_flag: "Estamos en solidaridad mutua con la Academia Gehenna,"
 GEAC_academy_railroad_opening: "Inaugurar el ferrocarril de la Academia Gehenna"
 GEAC_academy_railroad_opening_desc: "La industria de reconstruir y conectar a nivel nacional los ferrocarriles colapsados debe empezar no por la imposición unilateral de una facción, sino sobre la base de la cooperación de todo Gehenna."
 GEAC_organic_industry_strengthening: "Plan de conglomerado industrial orgánico"
 GEAC_organic_industry_strengthening_desc: "Debemos asentar firmemente un enorme conglomerado que supervise la industria de todo Gehenna; y para una cooperación amplia entre construcción y producción, se requiere coordinación a escala pan-Gehenna."
 GEAC_organic_industry_strengthening_tt: "$GEH_tank_designer_tooltip$\n Velocidad de investigación industrial: §G+10%§!\n Velocidad de construcción: §G+5.00%§!\n §YEquipo de infantería§!: £GFX_production_cost  coste de producción: §G-5.00%§!\n"
 GEAC_germanic_cultural_sphere_induction: "Inducir una esfera cultural germánica"
 GEAC_germanic_cultural_sphere_induction_desc: "La cultura de la Academia Gehenna se parece en muchos aspectos a la cultura del territorio alemán actual, aunque también tiene diferencias. Pero ahora que competimos con Trinity por el liderazgo de toda Alemania, debemos enfatizar la afinidad entre la cultura alemana y la nuestra."
 GEAC_air_defense_conception: "Plan de defensa del espacio aéreo"
 GEAC_air_defense_conception_desc: "Debemos instalar innumerables cañones antiaéreos para prepararnos ante los bombardeos que siguen a la superioridad aérea enemiga. Así, el cielo de Gehenna estará a salvo."
 GEAC_makoto_line: "Línea Makoto"
 GEAC_makoto_line_desc: "La 'Línea Makoto' propuesta por Makoto Hanuma en diciembre de 1935 es una línea de fortificaciones diseñada bajo el principio de no ceder ni un palmo de tierra a Trinity. Seguiremos ese principio."
 GEAC_hina_line: "Línea Hina"
 GEAC_hina_line_desc: "La 'Línea Hina' propuesta por Hina Sorasaki en enero de 1936 es un plan de fortificación de grandes ciudades diseñado para proteger instalaciones industriales clave ante ataques desde múltiples frentes y prepararse para el peor escenario. Ejecutaremos este plan."
 GEAC_makoto_line_tt: "Añade §G4§! §Yfortalezas§! en la frontera de los estados adyacentes a §YTrinity§!:"
 GEAC_hina_line_tt: "Añade §G4§! §Yfortalezas§! en las §Yciudades principales§! de todo Gehenna:"
 GEAC_air_defense_conception_tt: "Si controlamos los estados correspondientes, se añadirán §YAA§! al máximo en las regiones de §YHannover§!, §YHesse§!, §YOstrheinland§!, §YOberbayern§! y §YLuxembourg§!"
 GEAC_gehenna_artillery: "Artillería de campaña de Luxemburgo"
 GEAC_gehenna_artillery_desc: "Con los obreros altamente cualificados de Luxemburgo antes del Gran Cataclismo y un plan industrial sistemático, la artillería de campaña de Luxemburgo—Agencia demuestra un rendimiento excelente en todo Gehenna. Integraremos ese secreto en el conglomerado industrial."
 GEAC_gehenna_artillery_tt: "$GEH_tank_designer_tooltip$\n £GFX_prod_eff_cap Límite de eficiencia de producción: §G+5.00%§!\n §YEquipo de infantería§!: £GFX_production_cost  coste de producción: §G-5.00%§!\n §YArtillería§!: £GFX_production_cost  coste de producción: §G-5.00%§!\n §YCañón AA§!: £GFX_production_cost  coste de producción: §G-5.00%§!\n §YCañón AT§!: £GFX_production_cost  coste de producción: §G-5.00%§!\n"
 GEAC_steel_industry_development: "Industria siderúrgica de Baviera"
 GEAC_steel_industry_development_desc: "La Prefectura de Gehenna ha invertido de forma continua en la industria siderúrgica de Baviera desde el Gran Cataclismo. Si desarrollamos aún más la siderurgia, ¡podremos concentrar los recursos de todo Gehenna en Baviera!"
 GEAC_hot_spring_industry_expansion: "Gran operación ‘Burbujeo de Aguas Termales’ de Gehenna"
 GEAC_hot_spring_industry_expansion_desc: "¿Sabías que el agua termal de parte de la cordillera Hinnom, que se trasladó junto a nosotros durante el Gran Cataclismo, continúa bajo tierra conectándose a lo largo de Gehenna? ¡El Club de Desarrollo de Aguas Termales lo sabe muy bien! Con un poco de… potencia explosiva y audacia, podremos declarar el éxito de esta gran ‘Operación Burbujeo de Aguas Termales’."
 GEAC_hot_spring_industry_expansion_tt: "$GEH_tank_designer_tooltip$\n Velocidad de construcción de §Yinfraestructura§!: §G+10.00%§!\n Velocidad de construcción de §Yfábricas civiles§!: §G+10.00%§!"
 GEAC_steel_industry_development_tt: "Importa recursos de otros países de Gehenna y añade en la £GFX_resources_strip|4 §Ycapital§! §Y5§!, £GFX_resources_strip|2 §Y6§!, £GFX_resources_strip|5 §Y6§!."
 GEAC_steel_industry_development_tt2: "Añade en la £GFX_resources_strip|5 §Ycapital§! §Y6§!."

