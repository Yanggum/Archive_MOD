 GEM_federal_basic_law_enactment_flag: "§Y$GEM_federal_basic_law_enactment$§! enfoque completado"
 GEM_corporatist_economy: "Economía corporativista"
 GEM_state_level_economic_plan: "Plan económico a nivel estatal"
 GEM_over_flashy_reforms: "Más que planes llamativos…"
 GEM_over_flashy_reforms_flag: "§Y$GEM_over_flashy_reforms$§! enfoque completado"
 GEM_practical_results: "¡Resultados que valgan la pena!"
 GEM_practical_results_flag: "§Y$GEM_practical_results$§! enfoque completado"
 GEM_retirement_of_a_giant: "Retiro de un gigante"
 GEM_retirement_of_a_giant_tt: "¡La persona elegida por evento heredará parcialmente algunos rasgos obtenidos por Natsume Iroha!"
 GEM_reelection_decision: "Decisión de reelección"

 ###### Estado alemán
 GEM_focus_ended_3_A_endfocus: "Fortalecer al gobierno federal"
 GEM_focus_ended_3_A_endfocus_desc: "El nacimiento de la federación no fue más que el comienzo. Las potestades dispersas y el complejo sistema administrativo repartido entre los estados, que la propia Natsume Iroha concedió, deben volver a reducirse ahora que Iroha gobierna plenamente. Es momento de concentrar todo el poder en el gobierno federal y hacer que el país se mueva con disciplina y unidad."

 GEM_union_of_parties: "Unión de los partidos"
 GEM_union_of_parties_desc: "El Partido Nazi, una oposición fuerte, sigue siendo una amenaza que fomenta la fragmentación del poder. Para aislarlos y debilitar su influencia, unificaremos a todos los partidos moderados alemanes y a los partidos de Gehenna en un gran «partido gobernante federal», construyendo una fuerza política imposible de contrarrestar."

 GEM_night_of_roses: "Noche de las Rosas"
 GEM_night_of_roses_desc: "Hay que arrancar las espinas del nacionalismo que amenazan la armonía de un Estado multiétnico. En una sola noche, purgaremos de golpe a todos los líderes nacionalistas que se oponen a la federación. Con esta noche adornada no con sangre, sino con rosas, el Estado por fin se volverá puro."

 GEM_german_federal_president: "Presidente federal alemán"
 GEM_german_federal_president_desc: "Este nuevo país necesita un único centro capaz de calmar las divisiones y abarcar a todos. Creamos el cargo de «presidente federal alemán» y entronizamos a Natsume Iroha en él, otorgándole la autoridad absoluta para decidir el futuro del Estado."

 GEM_the_glorious_plan: "Ese plan grandioso"
 GEM_the_glorious_plan_desc: "Para sostener el poder con estabilidad entre múltiples adversarios amenazantes y atraer apoyo, Natsume Iroha aprobará reformas visibles y llamativas. No es su estilo, pero la situación política obliga a elegir."

 GEM_reelection_law: "Ley de reelección"
 GEM_reelection_law_desc: "Las grandes tareas no se logran en un instante. Para garantizar la estabilidad del país y completar numerosas reformas políticas, abolimos el límite de mandatos del presidente federal. Mientras el país la necesite, Natsume Iroha nos guiará para siempre."

 GEM_leader_of_the_oak: "La líder del roble"
 GEM_leader_of_the_oak_desc: "Como el roble, símbolo del pueblo alemán, Natsume Iroha es ahora el centro inquebrantable de los «nuevos alemanes». Al ensalzarla como «la líder del roble», proclamamos que su sola existencia es la identidad y el eje del nuevo pueblo alemán."

 GEM_hasrant: "Herzland"
 GEM_hasrant_desc: "Las capitales del pasado están encadenadas a recuerdos de odio y división. Sobre una página en blanco, construiremos una nueva capital: «Herzland», el corazón del mundo. Esta gran ciudad simbolizará la gloria eterna de nuestra federación multiétnica."

 herzland: "Herzland"
 GEM_hasrant_idea_deff: "Trabajos de base de Herzland"
 GEM_hasrant_idea_deff_tt: "Este espíritu nacional se elimina al completar el enfoque '§Y$GEM_hasrant$§!'."
 GEM_germania_idea_deff: "Trabajos de base de Germania"
 GEM_germania_idea_deff_tt: "Este espíritu nacional se elimina al completar el enfoque '§Y$GEM_approval_of_germania_project$§!'."

 GEM_pioneer: "Pioneros"
 GEM_pioneer_desc: "Somos grandes pioneros que fundieron los fragmentos de dos mundos para crear una nueva nación. Un Estado unificado bajo una sola identidad y una sola líder se convertirá en el hito de una nueva era que todos los demás deberán seguir."

 GEM_architect_of_the_new_world: "Arquitecta del Nuevo Mundo"
 GEM_architect_of_the_new_world_desc: "La presidenta Natsume Iroha, que creó orden dentro del caos y levantó una nueva utopía sobre las ruinas del viejo mundo, ya no es una simple líder: es la «arquitecta del Nuevo Mundo». Bajo su diseño, nuestra civilización escribirá una nueva historia."

 ###### Federación
 GEM_focus_ended_3_B_endfocus: "Líder electa conjuntamente por ambos partidos"
 GEM_focus_ended_3_B_endfocus_desc: "Las dos facciones que conducen el país han reconocido y elegido conjuntamente a nuestra líder mediante un compromiso histórico. Ahora, la presidenta nacional [ROOT.GetLeader] guiará este compromiso histórico de nuestra nación."

 GEM_neutral_presidency: "Presidencia neutral"
 GEM_neutral_presidency_desc: "Una presidenta elegida con el apoyo de ambos partidos no puede ponerse del lado de ninguno. Estableceremos la presidencia como una institución neutral y trascendente por encima de la política de facciones. La presidenta no será una jugadora, sino una árbitra que supervisa que las reglas de la federación se cumplan con justicia."

 GEM_finding_ideology_in_cooperation: "Encontrar una ideología en la cooperación"
 GEM_finding_ideology_in_cooperation_desc: "Nuestra ideología no nace en un escritorio. En el proceso de gobernar juntos el país —Gehenna y Alemania— descubriremos valores comunes y construiremos nuevas ideas. En la práctica de la cooperación, nuestra nueva ideología irá tomando forma."

 GEM_expansion_of_state_authority: "Expansión de la autoridad de los estados"
 GEM_expansion_of_state_authority_desc: "Una federación fuerte se levanta sobre estados fuertes y autónomos. Para evitar la intervención excesiva del gobierno central y respetar las tradiciones y voces propias de cada región, transferiremos más competencias a los gobiernos estatales."

 GEM_expansion_of_federal_government_authority: "Expansión de la autoridad del gobierno federal"
 GEM_expansion_of_federal_government_authority_desc: "Un país con dos corazones está condenado a la división. Para superar el regionalismo ineficiente y hacer valer una voluntad nacional unificada, fortaleceremos drásticamente la autoridad del gobierno federal y estableceremos un sistema de gobierno centralizado."

 GEM_corporatist_economy_b: "Economía corporativista"
 GEM_corporatist_economy_b_desc: "Buscamos una tercera vía: ni el caos del libre mercado ni la rigidez del control estatal. Introducimos una economía corporativista en la que el mundo laboral, el mundo industrial y el gobierno planifican y conducen la economía juntos a través de corporaciones que representan a cada nación, sustituyendo el conflicto por la cooperación."

 GEM_weimar_presidential_succession: "Sucesión de la presidencia de Weimar"
 GEM_weimar_presidential_succession_desc: "Para consolidar nuestra legitimidad y vincularnos al legado democrático alemán, proclamamos que la presidencia federal hereda la legitimidad de la presidencia de la República de Weimar. Nuestra líder no es una nueva dominadora, sino una heredera que restauró una tradición democrática interrumpida."

 GEM_german_fuehrer_succession: "Sucesión del Führer alemán"
 GEM_german_fuehrer_succession_desc: "Por la unidad nacional y un liderazgo fuerte, no daremos la espalda a los símbolos históricos de Alemania. Declaramos que la presidencia federal hereda la autoridad del «Führer», estableciéndose como el símbolo de un poder central fuerte que no tolera la división."

 GEM_coordinator: "Coordinadora"
 GEM_coordinator_desc: "Por fin, el papel de la presidenta ha quedado definido. Ella no es la representante del oficialismo ni la enemiga de la oposición. Es la «coordinadora» que armoniza los intereses de las dos grandes facciones y gestiona para que la gran máquina llamada Estado no se detenga. Su liderazgo silencioso es la verdadera fuerza que sostiene esta federación."

 #### 치아키 휘하 중점
 ###### 노말
 GEM_focus_ended_4O_endfocus: "Propaganda y propaganda"
 GEM_focus_ended_4O_endfocus_desc: "La política no es el registro de los hechos, sino la edición de la percepción. Motomiya Chiaki definió el primer paso en la gestión del Estado como el \"control del mensaje\". Extraeremos titulares impactantes que capturen la atención del público y definiremos esta era caótica no mediante verdades aburridas, sino a través de una agitación que haga latir el corazón. La pluma es más fuerte que la espada, y el micrófono llega más lejos que el fusil."

 GEM_practical_technocratic_network: "Red tecnocrática práctica"
 GEM_practical_technocratic_network_desc: "Los burócratas que solo se entregan a discusiones de escritorio no son más que revistas de otra época destinadas al cierre. Lo único que puede respaldar la capacidad de acción de la secretaria son los profesionales de campo que se mueven con sus propios pies. Ignorando los procedimientos complejos, Chiaki reúne a talentos competentes capaces de producir resultados inmediatos y construye una red administrativa independiente. A partir de ahora, el Estado girará sin descanso, como una imprenta que nunca se detiene."

 GEM_pioneer_of_innovation: "Pionera de la innovación"
 GEM_pioneer_of_innovation_desc: "Aferrarse a viejas costumbres no es el camino de un \"genio\". Debemos convertirnos en pioneros de la innovación, rompiendo sin titubeos los marcos existentes. Con la \"autoridad del escritorio\", editaremos con audacia los sistemas ineficientes que se han extendido por toda la sociedad y llenaremos ese vacío con ideas ingeniosas y nuevas. Un hoy idéntico al ayer es, para nosotros, una negligencia en el deber."

 GEM_propaganda_propaganda_propaganda: "¡Propaganda, propaganda, propaganda!"
 GEM_propaganda_propaganda_propaganda_desc: "¿Decían que lo importante hay que decirlo tres veces? No. Hay que repetirlo hasta que las masas lo crean. Desde los carteles en las calles hasta las ondas de radio y la portada del periódico matutino, derramaremos nuestra visión a través de todos los medios posibles. No existe lugar al que no llegue la voz de Chiaki. Esto no es una simple promoción, sino una marea colosal de información que penetra incluso en el subconsciente del pueblo."

 GEM_gehenna_everywhere: "Gehenna en todas partes"
 GEM_gehenna_everywhere_desc: "Gehenna no es solo una academia. Es un \"estilo\" libre y dinámico. Implantaremos la cultura vibrante propia de Gehenna en todos los rincones de la sociedad para renovar la atmósfera rígida que dominaba esta tierra. El espíritu de Gehenna, infiltrado en la vida cotidiana, se convertirá en el adhesivo más natural que una a dos grupos dispares."

 GEM_trend_leading: "Liderar la tendencia"
 GEM_trend_leading_desc: "Quien sigue jamás puede ocupar la portada. No debemos limitarnos a leer el flujo de la época: debemos convertirnos en \"creadores de tendencias\" que generan la moda en sí. Al lanzar los temas más avanzados y apropiarnos de la agenda en política, economía y cultura, haremos que el público nos siga por iniciativa propia. Estar en el centro del tema: eso es el poder."

 GEM_international_brand_marketing: "Marketing de marca internacional"
 GEM_international_brand_marketing_desc: "El Estado también es un producto. Por excelente que sea su contenido interno, si el envoltorio es deficiente, no se vende. Con su característico sentido estético, Chiaki planea rebrandear de manera sofisticada la imagen nacional y venderla en la escena internacional. Una marca país atractiva es el mayor activo para romper el aislamiento diplomático y atraer a potenciales inversores y aliados."

 GEM_corporate_tax_deduction: "Deducciones corporativas"
 GEM_corporate_tax_deduction_desc: "Para crear una primicia, se necesita presupuesto de investigación. Concederemos audaces beneficios fiscales para que las empresas puedan operar libremente y generar riqueza nacional. Esto no es un privilegio, sino un incentivo racional para atraer capital al gran proyecto llamado Estado. De graneros abundantes nace la generosidad, y de presupuestos holgados surge la gran política."

 GEM_populist_leader: "Líder populista"
 GEM_populist_leader_desc: "Las teorías complejas o la moral anticuada no conmueven el corazón de las masas. Chiaki se comunica directamente con el pueblo sin intermediarios y representa sus deseos. A veces provocadoras, a veces conmovedoras, sus palabras enardecen a las multitudes. La capacidad de identificar con precisión lo que el pueblo quiere: esa es el arma más poderosa en la era democrática."

 GEM_philosopher_king: "Rey filósofo"
 GEM_philosopher_king_desc: "Los filósofos de la antigüedad decían que un país debía gobernarse con sabiduría. En la era moderna, ¿no es Chiaki, capaz de comprender toda la información y los flujos del mundo y de hallar el punto de \"edición\" más perfecto, la líder que mejor encarna ese ideal? Su intuición y perspicacia geniales son la brújula que señala la única respuesta correcta para la nación en medio de la confusión."

 GEM_leader_of_the_people: "Líder del pueblo"
 GEM_leader_of_the_people_desc: "Motomiya Chiaki ha trascendido ya el papel de simple secretaria o política. Es el ícono de la época, la auténtica \"estrella\" que el pueblo anhelaba. Con una sola palabra suya la opinión pública baila, y con un solo gesto el Estado se pone en movimiento. Más allá de las ideologías de izquierda y derecha, la nación se unifica en torno a su figura como eje central, preparándose para el siguiente gran salto."

 GEM_propaganda_propaganda_propaganda_flag: "§Y$GEM_propaganda_propaganda_propaganda$§! completado"
 GEM_trend_leading_flag: "§Y$GEM_trend_leading$§! completado"

 ###### Estado Alemán
 GEM_focus_ended_4_A_endfocus: "Toma de posesión del Führer"
 GEM_focus_ended_4_A_endfocus_desc: "El vacío de poder del Estado Alemán ha llegado a su fin. Para heredar el legado del expresidente Hanuma Makoto y estabilizar el caos nacional, la presidenta Motomiya Chiaki asume oficialmente el cargo de \"Führer\". Esto no es una simple sucesión de puesto, sino una declaración del nacimiento de un líder único que ostenta el derecho de edición del Estado. Desde la punta de su pluma, la historia de Alemania será corregida de nuevo."

 GEM_rune_script_adoption_4A: "Adopción de escritura rúnica"
 GEM_rune_script_adoption_4A_desc: "La esvástica, símbolo de los fracasos del pasado, debe ser descartada. Adoptamos la \"runa Othala\", símbolo del legado y el misticismo germánicos antiguos, como nuevo emblema nacional. Esta es una manipulación simbólica sofisticada que, al tiempo que marca distancia con el Partido Nazi, refuerza la autoridad mística del régimen al reivindicar los orígenes del pueblo germano."

 GEM_weimar_lottery: "Lotería de Weimar"
 GEM_weimar_lottery_desc: "Es un momento que requiere legitimidad estable más que símbolos radicales. El Führer Chiaki restauró la tricolor negro-rojo-dorado, herencia de la República de Weimar, proclamando que el régimen actual no es un conquistador bárbaro, sino el legítimo sucesor de Alemania. Este gesto conciliador atraerá el reconocimiento internacional y apaciguará la resistencia de los moderados internos."

 GEM_motomiya_socialism: "Socialismo Motomiya"
 GEM_motomiya_socialism_desc: "Las ideologías tradicionales de izquierda y derecha son insuficientes para atravesar la compleja situación actual. El \"Socialismo Motomiya\" es un camino propio que combina una fuerte economía de control estatal con políticas de bienestar radicales para el pueblo. Este sistema, que prioriza beneficios intuitivos y propaganda por encima de teorías complejas, se convertirá en un modelo de gobierno populista que domina el Estado sobre la base de un apoyo popular abrumador."

 GEM_left_wing_grand_coalition: "Gran coalición del ala izquierda"
 GEM_left_wing_grand_coalition_desc: "Para superar los límites del gobierno en solitario, el Führer Chiaki impulsa una gran coalición con fuerzas de izquierda, incluyendo al Partido Comunista Alemán y al Partido Socialdemócrata Alemán. Más que un compromiso ideológico, se trata de una alianza estratégica destinada a absorber fuerzas políticas dispersas dentro del sistema y asegurar el impulso del gobierno. Las diversas voces serán controladas y afinadas a través de un único y gigantesco altavoz."

 GEM_denazification_movement_4A: "Desnazificación"
 GEM_denazification_movement_4A_desc: "Para asegurar la legitimidad del nuevo régimen, comienza una purga a gran escala contra el Partido Nazi y sus seguidores, residuos de una era pasada. La \"desnazificación\" no es solo una liquidación del pasado, sino una tarea indispensable para eliminar a las únicas fuerzas políticas alternativas y resetear por completo el panorama político. A partir de ahora, su existencia será eliminada permanentemente del papel llamado Estado."

 GEM_clandestine_communist_group_4A: "Grupos comunistas clandestinos"
 GEM_clandestine_communist_group_4A_desc: "Los restos del nazismo no son más que un mal antiguo manejable, pero los marxistas-leninistas que operan en la clandestinidad son un veneno letal que sacude los cimientos del Estado. El Führer Chiaki ha determinado que su \"socialismo científico\" es la mayor amenaza para nuestra eficiente edición estatal. Aunque debamos posponer el castigo a los restos nazis o incluso utilizarlos, concentraremos todas nuestras capacidades de contrainteligencia en aislar y erradicar permanentemente a estos revolucionarios rojos de la sociedad."

 GEM_small_gehenna_academy_protection: "Protección de la pequeña Academia Gehenna"
 GEM_small_gehenna_academy_protection_desc: "Incluso en la expansión del Estado, la identidad de la Academia Gehenna no debe ser dañada. Chiaki ha designado el distrito autónomo de la academia como una zona de protección especial en la que el poder estatal no puede intervenir arbitrariamente. Es un mecanismo de seguridad destinado a preservar nuestras raíces fundamentales en medio del caos y a dejar un refugio espiritual al que siempre podamos regresar."

 GEM_gehenna_student_council_representative: "Representante del consejo estudiantil de Gehenna"
 GEM_gehenna_student_council_representative_desc: "Se necesita un sistema que conecte de manera eficiente el doble rol de jefe de Estado y presidente del consejo estudiantil. Elevamos el consejo estudiantil de Gehenna a una institución con representatividad en el máximo órgano decisorio del Estado, estableciendo una línea directa para que las opiniones de los estudiantes se reflejen directamente en la política nacional. Es una estructura de gobernanza innovadora que convierte la energía dinámica de la academia en energía de gobierno."

 GEM_whatisthis_4O_tt: "Este enfoque se transformará en un árbol de enfoques completo al completar §Y$GEM_new_system_and_new_state_construction$§!."
 GEM_whatisthis_4O_tooltip: "§gEl árbol de enfoques también cambiará dependiendo de si se completa alguno de los enfoques §Y$GEM_rune_script_adoption_4A$§!, §Y$GEM_weimar_lottery$§!, o bien §Y$GEM_left_wing_grand_coalition$§!, §Y$GEM_denazification_movement_4A$§!, §Y$GEM_clandestine_communist_group_4A$§!.§!"
 GEM_whatisthis_4O: "???"
 GEM_national_editor_4O_1: "Establecimiento de la República Social Alemana"
 GEM_national_editor_4O_1_desc: "La autoridad del Estado y la capacidad inclusiva de la gran coalición de izquierda se han combinado para dar origen a la 'República Social Alemana'. Este país persigue simultáneamente el orgullo nacional y la igualdad social, y aspira a ser una sólida comunidad de bienestar en la que el Estado asume la responsabilidad por la vida del pueblo. Este es el resultado de convertir los ideales del presidente Makoto en políticas realistas por parte de la secretaria Chiaki."

 GEM_national_editor_4O_2: "Presidenta Nacional Chiaki"
 GEM_national_editor_4O_2_desc: "Motomiya Chiaki, que eliminó a sus rivales mediante la desnazificación y hundió por completo el estatus del Partido Nazi, asume el cargo de 'Presidenta Nacional'. Ella se apodera tanto de la autoridad constitucional como de un prestigio extralegal, y reorganiza la Alemania, antes sumida en el caos, en un fuerte sistema centralista. Es un intento de restaurar el orden mediante una dictadura legal."

 GEM_national_editor_4O_3: "Proclamación del corporativismo estatal"
 GEM_national_editor_4O_3_desc: "Para pulverizar la fantasía destructiva de la 'lucha de clases' que claman los comunistas, presentamos una poderosa alternativa llamada 'corporativismo estatal'. Este sistema organiza a todas las capas de la sociedad en 'corporaciones' bajo el control del Estado y concentra todas las capacidades en la movilización de la patria. El 'Partido Patriota Alemán del Corporativismo Estatal' absorberá por completo la base de apoyo del antiguo Partido Nazi mediante esta nueva ideología y consolidará su posición como la única fuerza alternativa."

 GEM_national_editor_4O_4: "Establecimiento de la República Popular Alemana"
 GEM_national_editor_4O_4_desc: "Con la unión del legado de Weimar y la radicalidad revolucionaria de la izquierda, se proclama la 'República Popular Alemana', donde el pueblo es el dueño. El Führer Chiaki niega la autoridad del antiguo régimen y se comunica directamente con las masas, buscando aliviar la desigualdad social mediante políticas de reparto audaces. Este es un experimento de democracia populista que rompe las viejas costumbres y coloca los anhelos del pueblo en el centro del gobierno."

 GEM_national_editor_4O_5: "Constitución de Chiaki"
 GEM_national_editor_4O_5_desc: "El gobierno, que completó la purga política y heredó la legalidad de Weimar, promulgó la 'Constitución de Chiaki', que reúne la filosofía de gobierno del Führer Chiaki. Esta constitución otorga al líder plenos poderes para administrar el Estado de manera extraordinaria en tiempos de crisis y garantiza institucionalmente una administración eficiente y un liderazgo fuerte. Se trata de un régimen de autoritarismo legal completado mediante procedimientos democráticos."

 GEM_national_editor_4O_6: "Coalición negro-rojo-dorado"
 GEM_national_editor_4O_6_desc: "El fracaso de la República de Weimar surgió de una tolerancia que permitía libertad incluso a quienes pretendían derrocar el sistema. La Presidenta Nacional Chiaki forma la 'coalición negro-rojo-dorado' con conservadores y centristas, y proclama una 'democracia defensiva' que aniquila legalmente a las fuerzas de extrema izquierda que amenazan la democracia liberal. Esta gran operación de depuración roja, que moviliza toda la autoridad legal del parlamento, será la fría determinación de la democracia para salvaguardar el orden."

 ###### Federación
 GEM_focus_ended_4_B_endfocus: "Hacia el imperio mundial"
 GEM_focus_ended_4_B_endfocus_desc: "El escenario llamado Europa se ha vuelto demasiado estrecho para contener la narrativa de nuestra federación. Hay tinta de sobra, la punta de la pluma está afilada, y el anhelo del pueblo quiere la siguiente página. Ahora, más allá de las fronteras del continente, avanzaremos para ejercer nuestro 'derecho de edición' sobre el vasto papel cuadriculado que es el mundo entero."

 GEM_push_for_nazi_party_closure: "Impulsar el cierre del Partido Nazi"
 GEM_push_for_nazi_party_closure_desc: "Bajo el pretexto del bipartidismo, la vida de los remanentes nazis que parasitan dentro de la 'oposición alemana' llega hasta aquí. Su viejo y gastado repertorio racista ya solo provoca cansancio en los lectores. La secretaria general Chiaki activa la autoridad de la Oficina para la Protección de la Constitución y ordena el 'trabajo final de corrección': disolver por la fuerza al Partido Nazi, antidemocrático y anacrónico, y confiscar sus bienes al erario."

 GEM_domestic_antifa_formation: "Formación de Antifa doméstica"
 GEM_domestic_antifa_formation_desc: "Hay que limpiar físicamente en las calles los residuos del fascismo. Reunimos a los activistas de Manmajeon y a los jóvenes izquierdistas alemanes para organizar una 'Acción Antifascista (Antifa)' oficial. Bajo la aquiescencia de la Prefectura de Gehenna... no, de las autoridades de seguridad pública, estos 'criticarán activamente' a los espectros de otra época con porras y cócteles molotov."

 GEM_denazification_4B: "Desnazificación"
 GEM_denazification_4B_desc: "Borramos por completo las manchas de la hakenkreuz incrustadas por toda la sociedad. Identificaremos a los colaboradores nazis en la función pública, la educación, la justicia y el ejército, y los condenaremos a la pena de borrado de registro. Esto no es una simple purga, sino un proceso de edición exhaustivo para no dejar ni siquiera el rastro del villano en nuestra nueva narrativa nacional."

 GEM_neubolk_declaration: "Declaración de 'Neubolk'"
 GEM_neubolk_declaration_desc: "¡Declaramos que el alma libre de Gehenna y la disciplina de acero de Alemania se han unido para dar nacimiento al 'Neubolk', es decir, al 'nuevo pueblo'! Linaje u origen no importan. Solo quien jura lealtad bajo la bandera de la federación y disfruta de nuestra cultura obtiene el derecho de ser el verdadero protagonista de esta nueva era."

 GEM_autobahn_expansion_in_trinity: "Expansión de la Autobahn en Trinity"
 GEM_autobahn_expansion_in_trinity_desc: "Es hora de arrasar los jardines y callejones de la ocupada Trinity, pintorescos pero ineficientes. Construyan una Autobahn de ocho carriles (cuatro por sentido) que atraviese sus elegantes lugares de Tea Party. El rugido de los blindados federales y los camiones logísticos, lanzados a toda velocidad, será la propaganda visual más contundente para cubrir su 'cultura' con nuestra 'eficiencia'."

 GEM_minority_law: "Ley de minorías"
 GEM_minority_law_desc: "A medida que el territorio de la federación se expande, personas de diversos orígenes han ingresado en nuestro cercado. Promulgamos la 'Ley de minorías' para garantizar protección legal y ciudadanía a todos los que deseen unirse al Neubolk. Eso sí, bajo el supuesto de que se sometan a nuestro orden 'corregido'."

 GEM_entrenchment_of_two_party_system: "Consolidación de la costumbre bipartidista"
 GEM_entrenchment_of_two_party_system_desc: "¿De verdad hace falta eliminar al Partido Nazi? Una buena historia siempre necesita un rival que genere tensión. Reconocemos a la oposición alemana de tendencia nazi como un socio dentro del sistema, y elevamos su incesante confrontación política a un 'espectáculo'. El pueblo se entusiasmará con este drama feroz en el parlamento y olvidará su descontento con el régimen."

 GEM_imitation_of_german_national_community: "Imitación de la comunidad nacional alemana"
 GEM_imitation_of_german_national_community_desc: "Satisfagamos la fantasía de la 'comunidad nacional (Volksgemeinschaft)' que tanto añoran los antiguos alemanes. Solo que, en su centro, no estará el Führer, sino la secretaria general. Mediante enormes concentraciones de masas que enfatizan el trabajo, el ocio y la unidad, debemos forjar —aunque sea artificialmente— el vínculo entre ambos grupos. Aunque la forma sea una imitación del nazismo, el contenido servirá estrictamente a los intereses de Gehenna."

 GEM_strong_populist_politics: "Gobierno populista fuerte"
 GEM_strong_populist_politics_desc: "Las masas quieren pan y circo, y chocolate, antes que ideologías complejas. Inviertan presupuestos enormes para ampliar el bienestar popular y cautiven ojos y oídos del pueblo con festivales deslumbrantes y propaganda. Si la popularidad puede comprarse con dinero, no existe costo de gobierno más barato que ese."

 GEM_global_struggle: "Lucha global"
 GEM_global_struggle_desc: "La mejor manera de cubrir las contradicciones internas es crear un enemigo externo. Dividimos el mundo entre 'nosotros' y 'ellos' e instigamos una lucha incesante. Solo la sensación de crisis de una amenaza bélica eterna es el adhesivo más poderoso para mantener unida a esta federación heterogénea."

 GEM_revival_of_lebensraum: "Relanzamiento del Lebensraum"
 GEM_revival_of_lebensraum_desc: "Un territorio estrecho no basta para contener nuestra grandeza. Reinterpretamos de forma moderna la vieja teoría del 'espacio vital' para justificar la expansión territorial necesaria que absorba los recursos y la mano de obra de la federación. Esto no es una simple invasión. Es, para asegurar el papel donde registrar nuestra narrativa, una 'obtención de espacio' profundamente literaria e inevitable."

 GEM_codified_ethnic_distinction: "Codificación legal de la distinción étnica"
 GEM_codified_ethnic_distinction_desc: "Reconocer las diferencias es el inicio del orden. Los que tienen cuernos y los que no, los que portan misterio y los que no. Mediante la ley, distinguimos con claridad el rol y las obligaciones de cada grupo. Esto no es discriminación. Es una técnica de dirección que reduce el caos del escenario social asignando a cada quien un papel acorde a su 'carácter'."

 GEM_nord_hinnom_civilization_4B: "Civilización nórdico-hinnom"
 GEM_nord_hinnom_civilization_4B_desc: "El espíritu de dos grandes pueblos debe unirse bajo un solo nombre. Combinando 'Nórdico', nacido de los mitos del norte, y 'Hinnom', origen de Gehenna, creamos una nueva civilización dominante: 'nórdico-hinnom'. Esta nueva cultura será un privilegio exclusivo que solo disfruten los dos pueblos dominantes y un símbolo noble que los distinga de otros pueblos inferiores. Arte, filosofía y rituales: todo será reorganizado bajo este nuevo nombre."

 GEM_deutsche_federation_declaration: "Federación Deutsche"
 GEM_deutsche_federation_declaration_desc: "Aspiramos a un Estado constitucional racional y moderno, fruto de la fusión entre la Alemania del pasado y la Gehenna del presente. Con la proclamación de la 'Deutsche Föderation', Motomiya Chiaki abandona el título de secretaria general y asume como la primera 'presidenta' de la federación. Es el nacimiento de la república más poderosa y avanzada de la historia, creada por la unión del misterio de Kivotos y la razón europea."

 GEM_federation_of_three_peoples: "Federación de tres pueblos"
 GEM_federation_of_three_peoples_desc: "La libertad de Gehenna, la disciplina de Alemania y la cultura de la derrotada Trinity. Estos tres elementos encajan y giran como un enorme engranaje. Rompemos el marco del Estado-nación y proclamamos la 'Federación de tres pueblos'. Ahora, la oficina de secretaría de Chiaki trasciende a un simple jefe de Estado: como 'administradora general de la federación', coordinará a estos tres colosales pueblos y dirigirá un imperio burocrático gigantesco sin precedentes."

 GEM_intercultural_integration: "Integración intercultural"
 GEM_intercultural_integration_desc: "La escritura rúnica del norte se combina con la demonología de Gehenna, y las óperas de Wagner se reorquestan en heavy metal. No teman el choque de dos culturas distintas. En esa estridencia nacerá una 'cultura imperial' única, original y abrumadora que nadie podrá imitar."
 GEM_approval_of_germania_project: "Impulsar el Proyecto Germania"
 GEM_approval_of_germania_project_desc: "Traigan el plan de la capital mundial Germania que ideó Albert Speer. Claro, no lo usaremos tal cual. Como burlándonos del Tratado del Edén de Trinity, reconstruiremos Berlín como una grandiosa ciudad mística cubierta de cúpulas, mármol y magia. Será la encarnación del propio Pandemonium descendiendo a la tierra."
 GEM_approval_of_herzland_project: "Impulsar el Proyecto Herzland"
 GEM_approval_of_herzland_project_desc: "¿De verdad hay que aferrarse a la vieja Berlín? Desarrollamos la región de Hesse, que ya desde antes del Gran Cataclismo operaba como el corazón de Gehenna, como el nuevo distrito central del Estado: 'Herzland'. Este lugar, donde se alzarán instalaciones administrativas de vanguardia, laboratorios de magia y una gigantesca ciudad-academia, latirá como el nuevo corazón y cerebro de la federación."
 GEM_world_capital: "Capital mundial"
 GEM_world_capital_desc: "¿Decían que todos los caminos llevan a Roma? Ahora, todos los caminos llevan a nuestra capital. El lugar donde convergen la política, la economía y la cultura del mundo. Esto no es solo una ciudad. Es el centro del mundo donde se editan y publican todas las historias del planeta Tierra, el lugar donde se encuentra la oficina de Chiaki."
 GEM_advance_federation: "¡Adelante, federación!"
 GEM_advance_federation_desc: "El orden interno ha terminado. Ahora es momento de mirar hacia afuera. Más allá de las fronteras, ellos siguen siendo existencias llenas de 'erratas' que aún no han recibido nuestra gran corrección. Ejército entero, ¡avancen! Donde se clave la bandera de la federación, ahí estará la primera línea de la civilización."
 GEM_advance_federation_flag: "§Y$GEM_advance_federation$§! enfoque completado"
 GEM_horn_is_the_new_wing: "Los cuernos son las nuevas alas"
 GEM_horn_is_the_new_wing_desc: "Durante mucho tiempo, el orgullo del pueblo alemán residió en las poderosas alas extendidas del águila. Pero ahora nos enfrentamos a otro símbolo del orgullo. Los cuernos del líder, firmes y elevados, atravesando la tormenta. Ya no son un objeto de temor extraño. La gente ve en esos duros cuernos una voluntad de acero que nos protege y una fuerza indómita que no se doblega ante ninguna adversidad."
 GEM_comprehensive_anti_discrimination_law: "Ley integral contra la discriminación"
 GEM_comprehensive_anti_discrimination_law_desc: "Sobre el escritorio de la administradora general se amontonan incontables peticiones. Hombres bestia, robots y numerosos pueblos conquistados de distintos colores de piel y lenguas. Para mantener una federación tan inmensa, la tolerancia es indispensable. Prohibimos toda discriminación contra cualquier forma de vida inteligente. Si paga impuestos a la federación y jura lealtad, da igual si es perro, robot o humano: todos serán por igual un 'objeto de administración'. Eso es la esencia misma de la burocracia al estilo Kivotos."

