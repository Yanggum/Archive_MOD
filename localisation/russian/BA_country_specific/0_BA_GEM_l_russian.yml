 GEH_logistics_network:0 "Red de transporte logístico estable"
 GEH_individualism_german:0 "Wehrmacht alemana"
 GEM_ethnic_hatred_idea:0 "Odio hacia Trinity"
 GEM_attack_order_idea:0 "Orden de ataque de Makoto"
 GEM_ethnic_hatred_idea_2:0 "Aprovechar el odio"
 GEM_ethnic_hatred_idea_3:0 "La marcha de los demonios"
 GEH_Manmajun_bodyguard:0 "Departamento de escolta de Manmajeon"
 GEH_Manmajun_bodyguard_desc: "El Departamento de escolta de Manmajeon es una unidad de inteligencia directa que existe para defenderse de diversas operaciones terroristas dirigidas contra [GEM.GetLeader]."
 GEH_shadow_of_makoto:0 "La sombra de Makoto"
 GEH_state_government_remove_idea:0 "Disolución de los gobiernos estatales"
 GEH_schutzstaffel_idea:0 "Guardia de protección (Schutzstaffel)"
 GEH_local_autonomy_idea:0 "Garantía de derechos de autonomía local"
 GEH_local_autonomy_idea_desc:0 "Natsume Iroha, la nueva presidenta de Manmajeon, protegió al legislar diversas actividades administrativas autónomas llevadas a cabo en las regiones de Alemania."
 GEH_united_states_of_gehenna_idea:0 "Estados Unidos (United States)"
 GEH_united_states_of_gehenna_idea_desc:0 "Bajo el liderazgo de Natsume Iroha, Gehenna renació como los Estados Unidos de Gehenna, una forma de unión de varios estados. El líder del gobierno estatal será elegido por votación en cada estado, y el gobernador electo obtendrá un escaño en el parlamento alemán, guiando a Gehenna mediante control mutuo y cooperación con Manmajeon."
 GEH_unstable_integration_idea:0 "Integración inestable"
 GEH_unstable_integration_idea_desc:0 "La integración entre Gehenna y la Wehrmacht se selló tras largas negociaciones, pero la profunda zanja de conflicto entre estudiantes y ciudadanos aún no se ha llenado. Debemos mantener un equilibrio adecuado entre ambos grupos."
 GEH_prussian_idea:0 "Soldados prusianos"
 GEH_individualism_2: "Reforma del ejército"
 GEH_individualism_2_7: "Ejército de Gehenna"
 GEH_individualism_2_7_desc: "El ejército de Gehenna está formado con una estructura peculiar basada en organizaciones de milicia. Por supuesto, a cambio ha provocado el debilitamiento de las fuerzas centrales, pero es innegable que posee un poder militar formidable."
 GEH_political_turmoil:0 "Caos político"
 GEH_political_turmoil_desc:0 "Actualmente, la Academia Gehenna se encuentra en un conflicto político centrado en Makoto. La facción reformista encabezada por Iroha desea la destitución de Makoto y la reconstrucción de Gehenna, mientras que la facción conservadora —incluyendo a Satsuki y Chiaki— quiere proteger el cargo de presidenta de Makoto.\n\nEsta situación de conflicto en Gehenna no hace más que volver aún más caótica a una Gehenna ya caótica, y podría causar una amenaza grave."
 GEH_sudetenland_disturbances:0 "Disturbios en los Sudetes"
 GEH_sudetenland_disturbances_hard:0 "Disturbios extremos en los Sudetes"
 GEH_nazism_4_idea:0 "El Cuarto Reich"
 GEH_nazism_4_idea_desc:0 "Hurgando entre las cenizas, el ejército expulsado volvió a pisar una vez más el territorio de la patria. Sobre las ruinas donde todo se derrumbó, proclamamos el Estado de los alemanes y declaramos que Alemania ha regresado a esta tierra.\n\nY hasta el día en que logremos la completa unificación de Alemania, la Wehrmacht avanzará, y avanzará una vez más."
 GEH_nazism_5_idea: "El Cuarto Reich: Estado multinacional"
 GEH_nazism_5_idea_desc: "Hurgando entre las cenizas, el ejército expulsado volvió a pisar una vez más el territorio de la patria. Sobre las ruinas donde todo se derrumbó, proclamamos el Estado de los alemanes y declaramos que Alemania ha regresado a esta tierra.\n\nSin embargo, la Alemania que ha regresado no es la Alemania del pasado. La existencia de los forasteros de otro mundo, los kivotosianos, nos enseñó un nuevo camino hacia la fuerza. Nuestro Cuarto Reich no será un Estado de una sola etnia, sino un imperio multinacional unido bajo el águila alemana. Los de Gehenna como los de Gehenna, los alemanes como alemanes. Cada uno, desde su lugar, defenderá la patria, y esta diversidad controlada por una disciplina de hierro será nuestra nueva fuerza."
 GEH_nazism_6_idea: "El Cuarto Reich: el nuevo pueblo alemán"
 GEH_nazism_6_idea_desc: "Hurgando entre las cenizas, el ejército expulsado volvió a pisar una vez más el territorio de la patria. Sobre las ruinas donde todo se derrumbó, proclamamos el Estado de los alemanes y declaramos que Alemania ha regresado a esta tierra.\n\nPero el 'pueblo alemán' del que hablamos no es el pueblo del pasado. La existencia de los forasteros de otro mundo, los kivotosianos, nos obligó a redefinirnos. El nuevo alemán no se define por la sangre, sino por una voluntad de acero hacia la patria y una lealtad absoluta. Los de Gehenna y los alemanes se fundirán en el crisol de una nueva era, renaciendo como un único y más fuerte 'pueblo alemán'."
 GEH_nazism_A41_idea: "Alemania mundial"
 GEH_nazism_A41_idea_desc: "Apagando las llamas entre las cenizas, reconstruyendo las ruinas, un nuevo amanecer ha llegado. Todo el pueblo alemán se ha integrado en un solo Estado, y ahora somos, con orgullo, un Estado del 'pueblo alemán'. Bajo el nombre de Alemania mundial, el motor recién forjado ruge hacia el mundo.\n\nLa 'germanidad' como identidad fue intentada en el pasado por diversos Estados —como los países báltico-prusianos o la Austria del sur—, pero nosotros la definimos como una voluntad de acero y lealtad hacia la patria. Los de Gehenna y los alemanes se fundirán en el crisol de una nueva era, renaciendo como un único y más fuerte 'pueblo alemán'."
 GEH_nazism_A42_idea: "El Cuarto Reich"
 GEH_nazism_A42_idea_desc: "Hurgando entre las cenizas, el ejército expulsado volvió a pisar una vez más el territorio de la patria. Sobre las ruinas donde todo se derrumbó, proclamamos el Estado de los alemanes y declaramos que Alemania ha regresado a esta tierra.\n\nUnificaremos como uno solo a todo el pueblo alemán sin distinguir entre Gehenna y germánicos, francos, bávaros, alemanes del sur, austriacos o luxemburgueses, y esto se definirá con el nombre de 'Gran Germania'. Dispersando el mundo entero en cenizas y trazando de nuevo el pincel sobre ellas, el Estado se alza y da un salto hacia adelante."

 GEM_two_nations_one_state_idea_deff: "Redacción del proyecto de ley de dos pueblos"
 GEM_two_nations_one_state_idea_deff_tt: "Este espíritu nacional se elimina al completar el enfoque '§Y$GEM_two_nations_one_state$§!'."
 GEM_rolling_the_dice_idea_deff: "Los dados han sido lanzados."
 GEM_rolling_the_dice_idea_deff_tt: "Este espíritu nacional se eliminará de forma natural mediante la cadena de eventos que ocurra."
 GEM_two_nations_one_state_idea: "Coalición social horizontal"
 GEM_two_nations_one_state_idea_desc: "Los niños de una nueva generación se educarán y crecerán en un mismo salón, aprenderán la armonía de forma natural, y las diferencias culturales también se resolverán gradualmente."

 GEH_nazism_alt_idea:0 "Política de dos facciones"
 GEH_nazism_alt_idea_desc:0 "Por fin, comenzó una política en la que dos facciones, encontradas como un solo país desde dos mundos, se miran de frente con orgullo. Convivencia, cogobierno, concesiones... suena bien, pero ahora no es lo importante. Las dos facciones se han tomado de la mano hacia un objetivo común. Y cuando el objetivo termine, ya no podrán separarse.\n\nAsí, el Estado más monstruoso, nacido para contener los ideales de todos, seguirá avanzando. Porque el punto de cruce entre ideal e ideal no siempre es hermoso."
 GEH_nazism_alt_1_B_1_idea:0 "Cruce de dos mundos"
 GEH_nazism_alt_1_B_1_idea_desc:0 "Convivencia, cogobierno, concesiones... aquellas palabras que alguna vez sonaron vacías ahora han encontrado su lugar, de una forma extraña, entre el ruido del parlamento. La facción reunida en torno al antiguo Manmajeon y la facción que representa la voz de todos los alemanes. Dos grandes corrientes se han institucionalizado como 'partidos' bajo el nombre del Estado.\n\nSu confrontación ya no es un caos destructivo. Es como dos pistones perfectamente sincronizados que mueven una enorme máquina llamada país. Dentro de esta lucha predecible, el Estado avanza con estabilidad. El cruce entre ideal e ideal no era hermoso, pero al final quedó la forma más estable de 'Estado'."
 GEH_nazism_alt_1_B_2_idea:0 "Gobierno de coalición de facciones"
 GEH_nazism_alt_1_B_2_idea_desc:0 "La gran confrontación entre las dos facciones ya es cosa del pasado. Las voces afiladas se han apagado y la lucha encarnizada fue reemplazada por una cooperación silenciosa. En apariencia, es la imagen de un gobierno de coalición ideal, pero en el trasfondo solo hay una mano invisible presionando los hombros de ambos gigantes para alinearlos.\n\nYa no se gruñen el uno al otro. En su lugar, solo asienten en silencio hacia la misma dirección. En esta extraña armonía, el Estado ya no late con dos corazones. Avanza únicamente al ritmo de un solo pulso inaudible."
 GEH_nazism_alt_2_B_2_idea:0 "El Estado de dos mundos"
 GEH_nazism_alt_2_B_2_idea_desc:0 "Los cañones que antes se apuntaban el uno al otro ahora señalan, lado a lado, en la misma dirección. Tal vez sea el resultado de una extraña simbiosis por la supervivencia, o tal vez el fruto de un ideal noble. El caos de Gehenna y el orden de Alemania ya no se niegan entre sí, y en una forma extraña están llenando las grietas del otro.\n\nAquí ya no existe un gehennaín puro, ni un alemán completo. Solo existen nuevos ciudadanos que han perdido al yo de su pasado, bajo el nombre de 'Estado de dos mundos'."
 GEH_nazism_alt_3_idea: "El Estado de dos mundos y dos partidos"
 GEH_nazism_alt_3_idea_desc: "Convivencia, cogobierno, concesiones... aquellas palabras que alguna vez sonaron vacías ahora han encontrado su lugar, aunque sea en una forma extraña, entre el ruido del parlamento. El 'Partido Popular de la Gran Gehenna', reunido en torno al antiguo Manmajeon, y el 'Partido Nacionalsocialista Obrero Alemán', que representa la voz de todos los alemanes. La confrontación de estos dos grandes partidos se ha convertido en el nuevo corazón que mueve a este Estado.\n\nEl cruce entre ideal e ideal no era hermoso, pero en lugar de un caos monstruoso dio a luz una lucha ordenada. Sobre este frágil equilibrio, el Estado de dos pueblos seguirá avanzando."
 GEH_nazism_alt_3B41_idea: "Un Estado, dos partidos"
 GEH_nazism_alt_3B41_idea_desc: "Un poderoso partido gobernante y un partido opositor integran ampliamente a toda la sociedad y, extrayendo cada uno una gran narrativa llamada la ambición de su pueblo, construyen un Estado único, imperfecto pero fuerte.\n\nLa oposición es absorbida por ambos partidos, y los conflictos étnicos que podrían desembocar en una guerra civil quedan sellados en el parlamento. Dos partidos para dos mundos: no serán hermosos, pero son más ardientes y apasionados que cualquier otra cosa."
 GEH_nazism_alt_3B42_idea: "Convivencia étnica del Neubolk"
 GEH_nazism_alt_3B42_idea_desc: "La convivencia y el cogobierno entre el bloque oficialista de coalición —encabezado por el Partido Popular de la Gran Gehenna— y el bloque opositor —encabezado por el Partido Nacional del Pueblo Alemán—, así como la fuerte cohesión en favor del antifascismo, están uniendo a nuestro pueblo como uno solo.\n\nLa homogeneidad cultural entre Gehenna y lo germánico, el anhelo por la gran integración del 'mundo germanófono' y una visión resplandeciente hacia el futuro son la base que, desde lo más bajo, sostiene todo y hace que nuestra sociedad entera sea una."

