 GEM_ibuki_system_decision: "Florecimiento"
 GEM_ibuki_system_decision_desc: "Que §YIbuki Tanga§! haya alcanzado el puesto de líder únicamente con su propia fuerza es, por primera vez, un hecho único. Ahora debe moverse para dejar de depender de la ayuda de los ejecutivos de Manmajeon y convertirse por sí misma en la §Y'líder de la academia y del Estado'§!.\n\nEl §GFlorecimiento§! de Ibuki Tanga se divide en un total de §Ydos tramos§!. En cada §Ytramo§! puedes obtener diversos buffs, y el §Ycolor§! que haya crecido más §Gteñirá§! ese §Ytramo§! para hacerlo florecer.\n\nCada §Ycolor§! se divide en cuatro: §tambición§!, §Oprestigio§!, §1eficiencia§! y §Cideales§!. §GTeñir§! el §Yprimer tramo§! aumenta estadísticas base, y §Gteñir§! el §Ysegundo tramo§! desbloquea el §Yárbol de enfoques único§! de §YIbuki Tanga§!."

 GEM_ibuki_system_time_of_growth: "Tiempo de crecimiento §g(1er tramo)§!"
 GEM_ibuki_system_flowers_blooming: "El día en que florecen las flores §g(2º tramo)§!"
 GEM_ibuki_system_time_of_growth_available_tt: "§GNo podemos hacer que dejemos de florecer por nuestra cuenta.§!"
 GEM_ibuki_system_action_progress_bar_tt: "§HPlataformas de crecimiento§! restantes de §YIbuki Tanga§!: [?GEM_ibuki_system_stage_text|+.0]"

 GEM_ibuki_system_action_center_tt: "Los §Ycolores§! actuales de §YIbuki Tanga§! son los siguientes.\n1er tramo:\n - §tAmbición§!: [?GEM_ibuki_system_one_array_value^0|.0H] §g([?GEM_ibuki_system_one_array_lv^0|.0g] etapa)§!\n - §OPrestigio§!: [?GEM_ibuki_system_one_array_value^1|.0H] §g([?GEM_ibuki_system_one_array_lv^1|.0g] etapa)§!\n - §1Eficiencia§!: [?GEM_ibuki_system_one_array_value^2|.0H] §g([?GEM_ibuki_system_one_array_lv^2|.0g] etapa)§!\n - §CIdeales§!: [?GEM_ibuki_system_one_array_value^3|.0H] §g([?GEM_ibuki_system_one_array_lv^3|.0g] etapa)§!\n\n2º tramo:\n - §tAmbición§!: [?GEM_ibuki_system_two_array_value^0|.0H] §g([?GEM_ibuki_system_two_array_lv^0|.0g] etapa)§!\n - §OPrestigio§!: [?GEM_ibuki_system_two_array_value^1|.0H] §g([?GEM_ibuki_system_two_array_lv^1|.0g] etapa)§!\n - §1Eficiencia§!: [?GEM_ibuki_system_two_array_value^2|.0H] §g([?GEM_ibuki_system_two_array_lv^2|.0g] etapa)§!\n - §CIdeales§!: [?GEM_ibuki_system_two_array_value^3|.0H] §g([?GEM_ibuki_system_two_array_lv^3|.0g] etapa)§!"
 GEM_ibuki_system_time_of_growth_1_tt: "¡Ahora mismo §tAmbición§! es lo más alto!"
