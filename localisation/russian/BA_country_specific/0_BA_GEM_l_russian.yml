l_russian:

# # 이건 만마전의 의장 하누마 마코토의 대사 예시입니다.
# 드디어 강림하였도다! 키키킥, 판데모니움 소사이어티의 하누마 마코토 님이 직접 찾아와 주신 것이다. 극진히 환대하도록.
# 키키킥. 뭐, 좋아. 그럼 마코토 님의 위업 이야기를 시작하지.
# 늦었지 않나. 마침 키보토스 정복을 위한 획기적인 구상이 떠오른 참이다.
# 위업은 하룻밤 사이에 이루어지지 않는 법. 마코토 님은 절대로 포기하지 않을 테니 말이다.
# 이 몸의 연설을 똑똑히 듣도록!
# 키키킷! 쏴라! ...응? 거, 거꾸로라고!?
# 과연, 지도자의 극치에 이른 나에게도, 아직 성장의 여지가 있었다니. 키시싯!
# 이 분위기, 제법 괜찮지 않은가.
# 이로하 녀석을, 확실히 포획하려면……
# 게헨나 파티를 기념해, 특별히 개점한 상점이다. 맘껏 둘러보도록. 키킷.
#
#
# # 이건 만마전의 의원 겸 전차장 (그리고 실질 역할은 마코토 뒷바라지 및 비서)인 나츠메 이로하의 대사 예시입니다
# 하아, 어쩌다 이렇게 되어버린 걸까요. 뭐, 이렇게 된 이상, 해야 할 일은 하겠지만요.
# 하아, 뭔가요. 당번이라니⋯ 네네. 부탁받은 이상 열심히 하겠습니다.
# 후우⋯ 살짝 딴 데서 농땡이 부리지 않을래요?
# ⋯열심히 하고 있다구요?
# 귀찮지만⋯ 하아, 어쩔 수 없죠.
# 뭔가요. 해야 할 일은 다 끝내뒀는데요.
# 어쩐 일이신가요? 뭔가 부탁할 거라도?
# 하아, 그러니까, 초무적철갑 토라마루⋯ 출격합니다~
# 농땡이⋯⋯ 치게 내버려두지는 않을 것 같네요. 어쩔 수 없죠⋯
# 감사합니다⋯⋯ 뭔가요? 평범하게 감사인사 정도는 한다구요.
# 과연, 여기라면 들키지 않을 것 같네요.
# 이 푹신푹신한 방석, 가지런히 놓인 여러 간식들. 거기다 책과 게임까지 잔뜩.
# 후후, 제법 나쁘지 않은 곳이지요?
# 저만의, 제가 자랑하는 쉼터라구요. 어떠신가요?
# 그럼 공범도 있겠다. 늘 그랬듯이 오늘도 땡땡이 쳐볼까요?
# 슬슬 정리되는 느낌이지만⋯⋯ 부디 마지막까지 방심하지 마시길. 귀찮은 일은 질색인지라.
#
#
# # 이건 만마전의 마스코트 겸 최중요인물 탄가 이부키의 대사 예시입니다.
# 이부키, 얌전히 기다렸어! 칭찬해줘 칭찬!
# 이부키, 도와주러 왔어! 뭐하면 돼~? 그전에, 간식타임을 갖자고…? 응! 이부키도 그게 좋아!
# 사업비 집행 정산 내역서…… …라니, 무슨 의미……?
# 에헤헤, 이부키한테 할 말이 있어~?
# 응! 이부키도 도와줄게!
# 와아~ 이부키랑 놀아주는 거야~?
# 이부키가 지나간다~!
# 앗! 나쁜 사람이다!
# 다 같이 그림 그리자!
# 
# 
# # 이건 만마전의 정보부장 코교쿠 사츠키의 대사 예시입니다.
# 자아~ 기다렸지? 만마전의 정보부장, 쿄고쿠 사츠키야. 후후훗, 잘 부탁해.
# 쿄고쿠 사츠키, 만마전의 정보부장이야. 알고 있겠지만. 후훗.
# NK 울트라 계획에 흥미 있어?
# 자아, 나를 위해 힘내주렴.
# 어때? 강해진 것 같지?
# 만마전, 총공격이야!
# 으흥~ 이런 느낌? 나쁘지 않네.
# 헤에~ 내 생일도 기억해준 거야?
# 
# 
# # 이건 만마전의 서기 (겸 주간 만마전 기자) 모토미야 치아키의 대사 예시입니다.
# 호외요, 호외! 만마전의 서기, 모토미야 치아키가 찾아왔습니다~!
# 준비~! 땅!
# 취재 시작입니다!
# 기삿거리의 냄새가……. 아핫! 들켜버렸네요!
# 여기다가 <주간 만마전> 스탠드를 놓는다면…….
# 아, 이건 이부키 쨩이 좋아할 것 같네요~!
# 아하핫! 셔터 찬스, 잡았습니다!
# 후후! 서기의 행동력을 얕보면 안 되거든요!
# 앗, 제 생일이네요? 편집하느라 깜빡했습니다~! 아하하! 알려 주셔서 감사합니다!
# 다음 호에 쓸만한 사진, 건져볼까요~!
# 

#게헨나
 GEM_country_intro_header: "Academia de Libertad y Caos"
 GEM_country_intro_content: "Libertad y caos, y el conflicto entre el Comité de Disciplina y el Pandemonium Society. Sin un reglamento escolar decente, el horario de entrada de las estudiantes es un desmadre; la academia está llena únicamente de caos y libertad: desde atentados con bombas por cosas sin importancia, hasta conflictos entre clubes.\n\n¿Desde cuándo empezó el choque entre el Pandemonium Society y el Comité de Disciplina? En algún momento, la grieta se hizo tan profunda que ya cruzaron un punto de no retorno. El Pandemonium Society recorta el presupuesto del Comité de Disciplina buscando pretextos absurdos, y el Comité de Disciplina detesta al Pandemonium Society con toda el alma. ¿Cuándo se podrá cerrar esa brecha?\n\nDesde que Kivotos fue arrojado a otro mundo, en Gehenna ha empezado un caos aún mayor. Gehenna está más caótica que nunca. El Pandemonium Society se esfuerza por resolver todos los problemas. Sin embargo, mientras exista al norte el Grupo de Defensa Nacional —una fuerza armada local—, nuestra vida puede estar amenazada en cualquier momento.\n\nAun así, con tu elección, podrás alzar una vez más el prestigio de la gran Gehenna.\n\n§YDesarrollo: SKSKle§!"
 GEM_guide: "£white_dot Declara el estado de emergencia y decide la relación con el Comité de Disciplina.\n£white_dot Prepárate para la tormenta que se aproxima.\n\n§gPandemonium Society es un país cuyo árbol de enfoques puede cambiar según qué enfoque se complete primero, y también puede sufrir transformaciones especiales según condiciones o situaciones únicas.§!\n\n§gÁrboles base por líder§!\n  £white_dot Presidenta §YHanuma Makoto§!\n  £white_dot Presidenta §YKyogoku Satsuki§!\n  £white_dot Presidenta §YNatsume Iroha§!\n  £white_dot Presidenta §YMotomiya Chiaki§!\n  £white_dot Presidenta §YTanga Ibuki§! - (§RIncompleto§!)\n\n §gEnfoques de entrada al Origen por líder§!\n  £white_dot §OEstado de Guerra Perpetua§! de Hanuma Makoto\n  £white_dot §OPaís Pacífico§! de Kyogoku Satsuki\n  £white_dot §OEstados Unidos de Gehenna§! de Natsume Iroha\n  £white_dot §ONueva Administración§! de Motomiya Chiaki\n  £white_dot §OCrecimiento§! de Tanga Ibuki - (§RIncompleto§!)\n\n §gEnfoques de entrada al Origen por forma de Estado§!\n  £white_dot Proclamar §OEstado Alemán§!\n  £white_dot Proclamar §OFederación Alemana-Gehenna§!\n  £white_dot Mantener la Academia Gehenna\n\n§RPongan punto final a todo con sangre.§!"

# 지도자 설명
 GEH_makoto_main_leader_desc: "Hanuma Makoto jamás dudó de que estaba destinada a convertirse en una gran gobernante. El pequeño consejo estudiantil de Gehenna y el cargo de presidenta del Pandemonium Society eran un escenario demasiado estrecho para contener su enorme ambición.\n\nLa “Gran Transición” no fue una crisis para ella, sino la oportunidad que por fin había llegado. Al ver un mundo sumido en el caos, se convenció de que solo su genial liderazgo podía enderezarlo todo. Desde someter al Comité de Disciplina y unificar Gehenna, sus hazañas se expandieron sin freno: tomó Luxemburgo, aplastó a su archirrival Trinity e incluso metió en sus manos la tecnología de Millennium. Finalmente ascendió al puesto vacante de presidenta del Consejo Estudiantil General y se alzó en la cima de todas las estudiantes.\n\nAhora es la presidenta del Pandemonium Society, la unificadora de Gehenna y la dominadora de toda Europa. Sus viejos cargos no son más que uno de tantos epítetos que describen su grandeza. El mundo yace bajo sus pies, y ella, con una sonrisa satisfecha, traza su siguiente plan.\n\n\"¡Kikikí! ¡Míralo! ¡Todo esto no fue más que un peldaño para mi gran hazaña! ¿Y si ahora empezamos la verdadera conquista del mundo?\""
 GEH_makoto_fuehrer_leader_desc: "Tras la Gran Transición, el Estado Alemán reconstruido era poderoso, pero no tenía un líder auténtico capaz de guiarlo. El Partido Nazi, reducido a la oposición, seguía atado a sus fracasos del pasado; y el gobierno de coalición estaba fracturado. Hanuma Makoto no dejó pasar ese vacío de poder.\n\nEn vez de arrebatarlo todo por la fuerza, eligió un método más astuto: proclamó una nueva ideología llamada “corporativismo nacional” y alzó un nuevo símbolo, la “runa Odal”, ofreciendo una alternativa más atractiva y poderosa que el viejo ideario nazi. Su estrategia funcionó. Quienes estaban hartos de la vieja dirigencia se reunieron bajo su bandera, y al final, devoró el corazón de su rival y usurpó el puesto.\n\nAhora la llaman “Führer”. Una extranjera con cuernos de Gehenna que, de forma paradójica, se convirtió en el símbolo del nacionalismo alemán más extremo. Para ella, el linaje no importa: la única condición para ser un “nuevo alemán” es la lealtad hacia ella.\n\n\"¡Kishishit! La sangre y el linaje son puro adorno. El verdadero líder de esta tierra lo toma el más capaz. Es decir... yo.\""
 GEH_makoto_president_leader_desc: "Tras la Gran Transición, el Estado Alemán reconstruido era poderoso, pero no tenía un líder auténtico capaz de guiarlo. El Partido Nazi, reducido a la oposición, seguía atado a sus fracasos del pasado; y el gobierno de coalición estaba fracturado. Hanuma Makoto no dejó pasar ese vacío de poder.\n\nEn vez de arrebatarlo todo por la fuerza, eligió un método más astuto: proclamó una nueva ideología llamada “corporativismo nacional” y alzó un nuevo símbolo, la “runa Odal”, ofreciendo una alternativa más atractiva y poderosa que el viejo ideario nazi. Su estrategia funcionó. Quienes estaban hartos de la vieja dirigencia se reunieron bajo su bandera, y al final, devoró el corazón de su rival y usurpó el puesto.\n\nAhora, como presidenta del Estado Alemán, interpreta el papel de guardiana de la estabilidad y el orden. Aunque su “Partido Patriota Alemán de Corporativismo Nacional” es el único partido gobernante, de cara al público mantiene la fachada de una democracia multipartidista. Tras eliminar la mayor amenaza y hacerse con el pretexto más convincente, su dominio se vuelve más astuto y sólido que cualquier dictadura.\n\n\"Kikikí… ‘Presidenta’. Suena bastante bien, ¿no? Sea cual sea el cargo, lo único que importa es quién está detrás del rostro.\""
 GEH_makoto_directorate_leader_desc: "Para Hanuma Makoto, el antagonismo entre Gehenna y Alemania no era un problema que resolver, sino una oportunidad perfecta para fundirlos en un solo crisol y forjar una nueva herramienta de dominación. En vez de elegir un bando, decidió someter a ambas fuerzas por el poder y levantar por encima un país nuevo, hecho a su medida.\n\nEl resultado es el “Directorio de la Gran Gehenna–Gran Alemania”. No es una federación ni una unión: es un Estado centralista fuerte que existe únicamente para imponer la voluntad de una sola persona: Hanuma Makoto. Ella se hace llamar “Directora”, y utiliza tanto el caos de Gehenna como el orden alemán como instrumentos de gobierno.\n\nLa identidad de ambos pueblos ya no significa nada. Solo existen como “ciudadanos” para la gloria de la Directora. Para ella, este enorme país no es más que una máquina de guerra poderosa para materializar su verdadera ambición: la conquista del mundo.\n\n\"¡Kikikí! ¿Gehenna? ¿Alemania? ¡Esas distinciones ya no significan nada! ¡La única voluntad de este Gran Directorio soy yo, Hanuma Makoto-sama! ¡Ahora, con esta fuerza unificada, comencemos la verdadera hazaña!\""
 GEH_makoto_liberal_director_desc: "El “Directorio de la Gran Gehenna–Gran Alemania” de Hanuma Makoto estaba destinado a convertirse en un Estado de control perfecto. Pero su obra se tambaleó ante una enorme crisis nacional. El centralismo férreo se acercó al colapso por una resistencia inesperada y por ineficiencias, y por primera vez tuvo que admitir que quizá su forma de hacer las cosas podía estar equivocada.\n\nPero Hanuma Makoto no se derrumbó. Con una ligera culpa, volvió a sacar el “viejo sueño” que había abandonado: la fuerza original de Gehenna, “libertad y caos”. Decidió renunciar a parte de su poder absoluto y revivir la libertad anarquista de Gehenna y el legado olvidado de la democracia de Weimar.\n\nEn el nuevo sistema y con nuevas figuras, también reparó las relaciones —que se habían enfriado— entre los ejecutivos del Pandemonium Society. Ahora, como “Directora”, vuelve a avanzar hacia la utopía que soñaba cuando era presidenta del consejo.\n\n\"...Bueno, ahora sí debería funcionar. Vamos: a mi manera, disfruten la verdadera ‘libertad’.\""
 GEM_satsuki_reformed_leader_desc: "Kyogoku Satsuki era originalmente la jefa del Departamento de Inteligencia del Pandemonium Society. Diagnosticó el caos y los conflictos interminables de Gehenna como una “enfermedad” que destruye la paz, y se movió en secreto para crear una academia donde todos pudieran coexistir en armonía.\n\nNo se expuso en primera línea. En su lugar, maximizó el poder de inteligencia y, mediante un sistema avanzado de inducción psicológica llamado “Proyecto NK Ultra”, ajustó a toda la sociedad con una mano invisible. Las estudiantes creían que por voluntad propia habían dejado de pelear y elegido la armonía, pero todo el proceso estaba bajo su diseño perfecto.\n\nTras lograr por fin una paz completa, se atormentó por su propio método. Y decidió confiar en la buena voluntad de la gente, en lugar de controlarla por la fuerza. Ahora ya no es una gobernante en las sombras, sino una “guía” del país. NK Ultra ya no es un grillete que encadena la mente: es un faro que ayuda a no perder el camino correcto. Bajo su gobierno, Gehenna se convirtió en un país extraño, pero pacífico, que alcanzó una estabilidad sin precedentes y una armonía autónoma a la vez.\n\n\"Jejeje… obligar a otros a seguirte es cosa de amateurs. La verdadera paz se completa cuando todos creen que caminan por el camino correcto por voluntad propia.\""
 GEM_satsuki_despotic_leader_desc: "Kyogoku Satsuki era originalmente la jefa del Departamento de Inteligencia del Pandemonium Society. Diagnosticó el caos interminable de Gehenna como una “enfermedad” que destruye la paz, y se movió en secreto para crear una academia donde todos pudieran coexistir en armonía.\n\nA través del “Proyecto NK Ultra”, ajustó a toda la sociedad con una mano invisible y construyó un país de paz perfecta donde todo conflicto y descontento se desvanecía. Pero llegó a comprender que esa paz, por fin alcanzada, era demasiado frágil. El miedo a que una sola duda o un destello de libre albedrío devolviera todo al caos del pasado la llevó a apretar aún más las riendas del control. Decidió quedarse como la gobernante perfecta tras el telón.\n\nAhora Gehenna es un enorme organismo ajustado con precisión bajo su voluntad. Todo conflicto se elimina de antemano, y el pueblo vive en una calma eterna. Ella es una guardiana absoluta y solitaria que carga con todo el peso para sostener ese paraíso artificial.\n\n\"...Un poco… siento que este lugar pesa demasiado.\""
 GEM_satsuki_despotic_2_leader_desc: "Kyogoku Satsuki era originalmente la jefa del Departamento de Inteligencia del Pandemonium Society. Diagnosticó el caos interminable de Gehenna como una “enfermedad” que destruye la paz, y se movió en secreto para crear una academia donde todos pudieran coexistir en armonía.\n\nA través del “Proyecto NK Ultra”, ajustó a toda la sociedad con una mano invisible y construyó un país de paz perfecta donde todo conflicto y descontento se desvanecía. Pero en esa armonía perfecta, comprendió que la última disonancia era ella misma: la única existencia que recuerda el pasado, duda y carga con el peso de todo control.\n\nTras años de fatiga, eligió convertirse en el “último sujeto de prueba” para completar el sistema: integró incluso su conciencia al NK Ultra, eliminando el último factor inestable.\n\nAhora ya no existe la “persona” Kyogoku Satsuki. Se convirtió en el componente central —y a la vez una pieza— del mundo pacífico que creó. El Estado funciona por sí solo en una armonía eterna, siguiendo la última voluntad que ella dejó.\n\n\"Ah… por fin… yo también podré estar en paz.\""
 GEM_satsuki_atonement_leader_desc: "Kyogoku Satsuki fue, en otro tiempo, la jefa de inteligencia del Pandemonium Society y una gobernante en las sombras que manipulaba la voluntad de Gehenna. En nombre de la paz, cometió el gran pecado de aplastar el libre albedrío de todos con el “Proyecto NK Ultra”.\n\nSin embargo, dentro de la prisión de control perfecto que ella misma construyó, eligió el camino de mirar su culpa y cortarla de raíz. Bajó la cabeza ante antiguos enemigos para pedir perdón y destruyó con sus propias manos el grillete que encadenaba la mente del pueblo. Ese acto de expiación la arrancó del trono de la gobernante absoluta.\n\nAhora ya no es una diseñadora divina. Es una “expiadora” que, sobre las ruinas de la distopía que creó, se dedica a la verdadera democracia y a la reconciliación. Su gobierno es un viaje doloroso: cargar con el pecado del pasado y buscar una armonía real dentro de una libertad inestable. Los restos tecnológicos de NK Ultra se usan únicamente para sanar heridas antiguas y suturar conflictos entre pueblos. La Gehenna que ella dirige no es perfecta ni completamente estable, pero por fin obtuvo la oportunidad de elegir su futuro con su propia voluntad.\n\n\"Devolver con mis propias manos el futuro que les arrebaté… es mi último deber.\""
 GEM_satsuki_collective_leader_desc: "Kyogoku Satsuki fue, en otro tiempo, la jefa de inteligencia del Pandemonium Society y una gobernante en las sombras que manipulaba la voluntad de Gehenna. En nombre de la paz, cometió el gran pecado de aplastar el libre albedrío de todos con el “Proyecto NK Ultra”.\n\nPero tras lograr el control completo, se atormentó al entender que su método no era más que otra forma de violencia. No podía fingir que nada pasó, pero decidió expiar democratizando el sistema que creó y guiando su poder hacia un fin benévolo.\n\nRenunció al poder absoluto y estableció un liderazgo colectivo centrado en el “Partido del Directorio Panfederal”, donde participan los mejores talentos de Gehenna y Alemania. Ahora ya no es una dictadora absoluta, sino la “primera camarada” y mediadora que conduce este gran foro de debate. NK Ultra ya no domina la mente de los miembros del partido; se utiliza solo como dispositivo de apoyo para ajustar, evitando que los debates internos se derramen al exterior como conflictos destructivos, y para ayudar a extraer “la mejor conclusión para ambos mundos” de entre todas las opiniones.\n\nBajo su gobierno, Gehenna realiza el experimento más idealista: no una libertad total, pero tampoco un control coercitivo… sino un país que avanza hacia un objetivo común: “un futuro mejor”. Esa es la forma de expiación que ella encontró.\n\n\"Ahora quiero ir por un camino un poco distinto. Porque esta vez… es una decisión ‘mía’.\""
 GEM_satsuki_oceania_leader_desc: "Kyogoku Satsuki fue, en otro tiempo, la jefa de inteligencia del Pandemonium Society. Diagnosticó el caos y los conflictos interminables de Gehenna como una enfermedad mental que destruye la paz, y se movió en secreto para crear una academia donde todos pudieran convivir.\n\nSu gobierno superó la mera dominación y alcanzó el nivel de redefinir la realidad misma. Bajo el ideal de la “unificación”, derribó la frontera anticuada entre Gehenna y Alemania y proclamó la “Federación Pandemonium”. Todas las funciones del Estado se unificaron perfectamente en cuatro departamentos: Ministerio de la Verdad, Ministerio de la Paz, Ministerio del Amor y Ministerio de la Abundancia.\n\nEn este nuevo país ya no existe la “persona” Kyogoku Satsuki. Ella es el Partido, la única voluntad que gobierna todo pensamiento del Estado. El “Proyecto NK Ultra” ya no solo ajusta la mente del pueblo: ahora reescribe el pasado, controla el lenguaje e incluso vuelve imposible la idea misma de “traición”, convirtiéndose en una herramienta de manipulación ideológica total. Bajo su gobierno, el pueblo jura lealtad absoluta dentro de un orden perfecto y una estabilidad eterna.\n\n\"La guerra es la paz. La libertad es la esclavitud. La ignorancia es fuerza. Jejeje… y yo… soy todos ustedes.\""

 GEM_satsuki_makoto_president_leader_desc: "Hanuma Makoto es la primera presidenta de la Federación Alemana-Gehenna. Bajo la política tras bambalinas de Kyogoku Satsuki, su exhibicionismo y simpleza fueron vistos como el símbolo perfecto para capturar la atención del público. Por supuesto, Makoto está convencida de que todo esto es el resultado natural de su gran hazaña.\n\nCree que por fin llegó a la cima para liderar una nación dividida, y todos los días suelta nuevos “planes de conquista mundial”. El departamento de inteligencia sufre intentando controlar su imprevisibilidad, pero irónicamente esa misma imagen le ha grabado al público la figura de una líder fuerte y ambiciosa.\n\nSin notar en lo más mínimo dónde está el verdadero poder de la federación, cumple su papel como la marioneta más vistosa y ruidosa.\n\n\"¡Kikikí! ¡Mírenlo! ¡El puesto de presidenta de la federación le queda perfecto a Makoto-sama! Ahora, ¿pasamos al siguiente paso para conquistar el mundo?\""
 GEM_satsuki_chiaki_president_leader_desc: "Motomiya Chiaki es la primera presidenta de la Federación Alemana-Gehenna. Su energía desbordante y su habilidad para dominar a la prensa —que ya había mostrado como secretaria del Pandemonium Society— fueron evaluadas como el talento ideal para construir una imagen positiva de la nueva federación.\n\nIncluso ahora, como presidenta, su esencia sigue siendo la de una “reportera”. Como si estuviera cubriendo la gran exclusiva histórica de la “unificación federal”, anuncia políticas todos los días y se comunica con la ciudadanía, montando la imagen de un país vibrante. Las noticias positivas que ella produce cohesionan el apoyo popular y, al mismo tiempo, sirven como la cortina de humo más efectiva para ocultar el verdadero gobierno que ocurre tras bambalinas.\n\nNadie sabe si ella es consciente de que es la protagonista de esta gran obra, o si simplemente está embelesada con este enorme “notición”.\n\n\"¡Extra, extra! ¡Amanece un día esperanzador en la federación guiada por la presidenta Motomiya Chiaki! A ver… ¿cuál será el titular de hoy? ¡Empieza la cobertura!\""
 GEM_satsuki_iroha_president_leader_desc: "Natsume Iroha es la primera presidenta de la Federación Alemana-Gehenna. Llegó a ese puesto por una sola razón: porque era la que más ‘hueva’ tenía. Kyogoku Satsuki vio con claridad que su desinterés por la política y su inclinación al inmovilismo eran condiciones ideales para el gobierno en la sombra.\n\nIroha convirtió la oficina presidencial en su rincón cómodo y pasa la mayor parte del tiempo leyendo o jugando. Cree firmemente en la promesa de que la “capaz” presidenta Satsuki y el Departamento Nacional de Inteligencia resolverán todos los asuntos difíciles. Ella piensa que cumple con su papel con solo aparecer de vez en cuando en eventos oficiales y leer discursos preparados.\n\nSu pereza, paradójicamente, le trajo al país la mayor estabilidad: el líder que menos se mueve es el títere más perfecto.\n\n\"Haa… ¿trabajo presidencial? ¿Qué es eso? Si Satsuki-san ya se está encargando de todo lo difícil. Yo solo tengo que poner un sello de vez en cuando… Bueno, ya es hora de tirarme la hueva.\""
 GEM_satsuki_makoto_liberator_desc: "Hanuma Makoto estaba destinada a ser la cara pública de la federación: el títere más vistoso de la gobernante tras el telón. El “Proyecto NK Ultra” de Kyogoku Satsuki era perfecto; todas las variables estaban bajo su control. Con una sola excepción: Hanuma Makoto.\n\n¿Fue por un lazo extraño del pasado? Satsuki dudó en aplicar interferencia mental total solo sobre Makoto. Y esa pequeña vacilación humana se convirtió en la única grieta del imperio perfecto. La genialidad anómala e indomable arrogancia de Makoto, sin estar controladas, detectaron la mínima sensación de extrañeza dentro del mundo “ajustado”.\n\nElla rompió por su propia voluntad los hilos invisibles que la manipulaban, en un instante de rebelión. Ahora ya no es una presidenta títere, sino la “liberadora” que rescató a Gehenna de una paz engañosa. Irónicamente, el Estado de control perfecto colapsó por el pequeño resto de humanidad que quedó en el corazón de su diseñadora.\n\n\"¡Kikikí! ¡Intentar dominar el gran espíritu de Makoto-sama fue, desde el inicio, una idea estúpida!\""

 GEM_reelection_decision_leader_desc: "Natsume Iroha jamás imaginó que acabaría aquí. Creía que su vida seguiría como siempre: hacer administración en el Pandemonium Society y, de vez en cuando, conducir un tanque con el nombre vergonzoso que Makoto le puso… “Toramaru, Acorazado Ultra Invencible”. Pero en medio del gigantesco caos que trajo la Gran Transición, Iroha se convirtió en presidenta del Pandemonium Society y, ahora, en la primera presidenta y fundadora de la nación.\n\nIroha decidió reelegirse para evitar el caos que estallaría si se retirara, para esquivar el dolor de cabeza de escoger sucesor… o por simple sentido de responsabilidad.\n\nAhora, digan lo que digan, permanecerá como una de las pocas figuras destinadas a ser elegidas como la presidenta del pueblo y una de las más grandes “gehenna” de la historia.\n\n\"...Hasta decir ‘qué hueva’ ya me da hueva, la neta.\""
 GEM_iroha_story_a_leader_desc: "Yozakura Kirara era una estudiante de Gehenna y la jefa del club Brilla-Brilla. Incluso en el caos repentino tras la Gran Transición, ella intentó proteger la vida cotidiana… pero, dentro de las reformas de Natsume Iroha, empezó a interesarse por la política.\n\nFascinada por el mundo brillante que construía Iroha, Kirara se metió a la política por la federación y fue elegida al gobierno estatal como una legisladora novata del bloque gehenna. Con el tiempo, se destacó como política y, con una imagen cercana al pueblo, logró incluso ganar la reelección.\n\nIroha la nombró su sucesora y se retiró. Ahora, Yozakura Kirara está destinada a guiar el pequeño mundo que Natsume Iroha dejó atrás.\n\n\"¡Por una Gehenna y una Alemania brillantes!\""
 GEM_iroha_story_b_leader_desc: "Hatami Erika era una estudiante de Gehenna y miembro del club Brilla-Brilla. Siguiendo a su amiga y jefa del club, Yozakura Kirara —quien empezó a interesarse por la política tras la llegada al poder de Natsume Iroha—, Hatami Erika también se inició en la política, pero se interesó más por representar a los de abajo.\n\nTras ver la reelección de Kirara, Erika logró ser elegida como legisladora de primer periodo en el gobierno estatal. Con un terreno político parecido al de Kirara —o incluso con una imagen más cercana al pueblo—, debutó en el parlamento con aplomo.\n\nIroha la nombró su sucesora y se retiró. Ahora Hatami Erika comenzará una política para los que están más abajo, esos que Natsume Iroha no alcanzó a ver.\n\n\"¿Quizá me sienta un poquito mal con la jefa…?\""

 GEM_Natsume_Iroha_A_desc: "Natsume Iroha jamás imaginó que acabaría aquí. Creía que su vida seguiría como siempre: hacer administración en el Pandemonium Society y, de vez en cuando, conducir un tanque con el nombre vergonzoso que Makoto le puso… “Toramaru, Acorazado Ultra Invencible”. Pero en medio del gigantesco caos que trajo la Gran Transición, Iroha se convirtió en presidenta del Pandemonium Society. Y ahora, en la primera presidenta… y en una dictadora.\n\nClaro, no son tantos los que la llaman una dictadora de verdad. Tras aprobarse la ley de reelección, ese número creció, pero sigue siendo demasiado flexible y democrática para parecerse a un dictador autoritario tradicional.\n\nSin embargo, Natsume Iroha se evalúa a sí misma como dictadora. Aquello de “proteger la pequeña libertad y caos de Gehenna”… ya es cosa del pasado. Convertida en la gran líder de la federación alemana, hoy también es la jinete que aprieta las riendas del pueblo alemán.\n\n\"...Hasta aquí lo dejo.\""

 GEM_weimar_presidential_succession_leader_desc: "Natsume Iroha jamás imaginó que se convertiría en una figura histórica. Creía que su vida seguiría como siempre: hacer administración en el Pandemonium Society y, de vez en cuando, conducir un tanque con un nombre vergonzoso… “Toramaru, Acorazado Ultra Invencible”. Pero en medio del caos y la locura fascista que nacieron de la Gran Transición, ella terminó cargando con la última bandera de la República de Weimar.\n\nSigue ejerciendo la presidencia porque sabe que, si no es ella, no quedará nadie capaz de proteger esta democracia tan frágil. Defender la libertad resultó ser… mucho más ‘hueva’ de lo que pensaba.\n\nAhora quedará registrada en la historia no solo como una gehenna, sino como la guardiana que salvó la democracia alemana en pleno caos.\n\n\"...Debí no haber hecho democracia… ahora estoy el doble de cansada…\""

 GEM_german_fuehrer_succession_leader_desc: "Natsume Iroha jamás imaginó que se convertiría en la máxima líder del país. Creía que su vida seguiría como siempre: hacer administración en el Pandemonium Society y, de vez en cuando, conducir un tanque con un nombre vergonzoso… “Toramaru, Acorazado Ultra Invencible”. Pero sobre las ruinas que dejó la Gran Transición, entendió que, para guiar a un pueblo dividido, hacía falta un gobierno federal fuerte y unificado.\n\nSu camino, que empezó como presidenta del Pandemonium Society, terminó por llevarla al puesto de “Führer”. No por ambición personal, sino por la elección más realista para respetar la historia y el deseo alemán de un líder fuerte… y para ganarse sus corazones.\n\nAceptó ese cargo pesado porque sabe que, si no es ella, nadie podrá manejar bien la máquina enorme que es el gobierno federal. Administrar un país resultó ser más complicado que cualquier ‘hueva’ que hubiera imaginado.\n\nLa mayor floja de Gehenna terminó, paradójicamente, convertida en la máxima líder de la nueva federación, reconocida tanto por alemanes como por gehenna.\n\n\"...Que todos me obedezcan es cómodo, pero que yo tenga que decidirlo todo… de verdad es lo peor.\""

