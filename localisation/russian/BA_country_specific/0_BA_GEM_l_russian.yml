 # Nota: había dos entradas duplicadas con la misma clave GEH_GATHERING_STORM_DESC en tu texto.
 GEM_GATHERING_STORM_DESC:0 "Todo funciona de forma improvisada; la violencia desbocada de los clubes ha llegado a un punto imposible de contener, y el conflicto entre la Manmajeon y el Comité de Disciplina es tan conocido que hasta otras academias lo saben. En Gehenna siempre se escuchan explosiones y tiroteos: el caos lo llena todo.\n\nCuando ocurrió el Gran Cataclismo, la tierra sin ley cayó en la confusión.\nLos recién llegados nos mostraron hostilidad y trataron de expulsarnos, pero resistimos con firmeza. Sin embargo, mientras Sorazaki Hina del Comité de Disciplina mantenga los ojos abiertos, en Gehenna soplará un vendaval de sangre."

