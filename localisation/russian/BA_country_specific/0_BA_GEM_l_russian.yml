 GEH_Manmajun_Bupae: "Corrupción descontrolada"
 GEH_Manmajun_Bupae_desc: "La corrupción de la Manmajeon es tan famosa que la conocen todas las academias.\nQue la Manmajeon es corrupta es prácticamente un secreto a voces, empezando por sus conflictos con el Comité de Disciplina. Hay muchos problemas: recortan el presupuesto del Comité de Disciplina o imponen impuestos absurdos. Pero los estudiantes suelen ser indiferentes a la política o ni siquiera pagan impuestos, así que el dinero sucio se cubre íntegramente con el presupuesto recortado del Comité de Disciplina."
