 GEM_satsuki_department_expansion: "Ampliación del Departamento NK-Ultra"
 GEM_satsuki_department_expansion_tt: "§gEl árbol de enfoques de Kyogoku Satsuki ofrece un rendimiento poderoso, pero cuanto más se complete, más difícil será cambiar de líder.§!"

 GEM_what_are_you_talking_about_i_was_always_the_student_council_president: "¿De qué hablas? Si la presidenta de Gehenna siempre he sido yo, ¿no?"
 GEM_what_are_you_talking_about_i_was_always_the_student_council_president_tt: "El evento §Y¡Destituir a la presidenta de la Manmajeon!§! tendrá una §Rprobabilidad§! de ser reemplazado por un evento donde §YKyogoku Satsuki§! es elegida de forma asegurada. §R(25%)§!"

 GEM_starting_today_a_special_department_just_for_me_should_be_created: "Desde hoy, creo que necesito un departamento 'especial' solo para mí. ¿Me ayudas?"
 GEM_starting_today_a_special_department_just_for_me_should_be_created_tt: "El evento §Y¡Destituir a la presidenta de la Manmajeon!§! tendrá una §Rprobabilidad§! muchísimo mayor de ser reemplazado por un evento donde §YKyogoku Satsuki§! es elegida de forma asegurada. §R(66%)§!"
 GEM_demonstration_of_military_achievements:0 "Demostración de logros militares"
 GEM_demonstration_of_military_achievements_desc:0 "Nuestra historia está llena de grandes logros militares. Al reconocer lo que nuestro ejército ha conseguido en la actualidad como otro gran logro, podremos elevar su moral e incrementar aún más su lealtad."
 GEM_demonstration_of_military_achievements_trigger:0 "Debe cumplirse una de las siguientes:\n   Más de §Y2§! países súbditos\n   Más de §Y19§! estados ocupados en §YEuropa§!"
 GEM_country_leader_change_blocks_progress_demonstration_military_achievement_tt:0 "§R¡Si cambias al líder del país después de completar el enfoque §Y$GER_demonstration_of_military_achievements$§!, ya no podrás completar los enfoques §Y$GER_an_invincible_army$§! y §Y$GER_the_supreme_leader$§!!§!"

 GEM_an_invincible_army:0 "El invencible ejército de Gehenna"
 GEM_an_invincible_army_desc:0 "A través de numerosos logros y victorias, nuestro ejército ha aprendido mucho en el campo de batalla y, digan lo que digan los agitadores enemigos, ¡hemos demostrado que el ejército [ROOT.GetAdjective] es verdaderamente invencible!"
 GEM_an_invincible_army_trigger:0 "Debe cumplirse una de las siguientes:\n   Más de §Y5§! países súbditos\n   Más de §Y49§! estados ocupados en §YEuropa§!"

 GEM_the_supreme_leader_trigger:0 "[ROOT.GetNameDefCap] ha hecho rendirse a §Y2 potencias principales§! o más"
 GEM_the_supreme_leader:0 "El Líder Supremo"
 GEM_the_supreme_leader_desc:0 "Con los programas de reforma y reconstrucción indicados, la lealtad de todas las estudiantes de Gehenna hacia [ROOT.GetLeader] y su causa ha alcanzado un nuevo nivel. Esta tendencia de apoyo total a nuestro líder y a nuestra academia debe continuar."

 #### Enfoques bajo el Reich Alemán
 ############# Ruta: “Primero el Reich Alemán”
 GEM_focus_ended_AO:0 "El estado de la nación alemana resucitada"
 GEM_focus_ended_AO_desc:0 "La Academia Gehenna ya no existe. Para que las estudiantes y la población puedan vivir plenamente en la nueva era, fue sensato fundar el Reich Alemán e integrarnos en las instituciones del orden previo al Gran Traslado.\n\n§O¡Del montón de cenizas, el águila alza el vuelo!§!"

 GEM_peace_achievement:0 "Pacificación lograda"
 GEM_peace_achievement_desc:0 "Hemos reunificado todos los antiguos dominios alemanes, y Alemania, señor de Europa Central, ha regresado. ¡Volveremos a despegar y avanzaremos hacia el futuro de nuestra nación y nuestro pueblo!"

 GEM_union_of_affection:0 "Cohesión de coalición. De alguna manera."
 GEM_union_of_affection_desc:0 "La confianza no se construye de la noche a la mañana. Lo que necesitamos ahora no es una armonía ideal, sino una coexistencia realista. Mediante acuerdos políticos y objetivos compartidos, construiremos una alianza forzosa que haga que dos facciones que se odian cooperen a la fuerza."

 GEM_to_not_lose_initiative:0 "Para no perder la iniciativa"
 GEM_to_not_lose_initiative_desc:0 "Que hayamos aceptado su nombre no significa que vayamos a cederles la iniciativa de fundar este estado. En el nuevo sistema federal, la fuerza central que actúe como núcleo debe seguir siendo la nuestra. Debemos encontrar la forma de contener el desafío de los políticos germánicos y mantener el control."

 GEM_fierce_political_propaganda:0 "Propaganda política implacable"
 GEM_fierce_political_propaganda_desc:0 "Para convertir a dos pueblos en una sola ciudadanía, hace falta algo más que leyes. Con una campaña masiva de propaganda usando periódicos, radio y carteles, grabaremos en el corazón de todos la identidad compartida del “nuevo alemán”."

 GEM_two_nations_one_state:0 "Dos naciones, un solo Estado"
 GEM_two_nations_one_state_desc:0 "Gehenna y Alemania: dos pueblos con historia, cultura e incluso estructura corporal distintas. Reconocer esas diferencias y, aun así, exigir una lealtad compartida a un solo Estado. Este es el mayor dilema y el gran desafío al que se enfrenta nuestra república."

 GEM_rolling_the_dice:0 "Lanzar los dados"
 GEM_rolling_the_dice_desc:0 "La integración gradual es segura, pero demasiado lenta. A veces se necesita una apuesta audaz para empujar la historia hacia adelante. Si tiene éxito, acelerará la unificación; si fracasa, esta paz frágil se hará añicos."

 GEM_leader_of_us:0 "El líder de “nosotros”"
 GEM_leader_of_us_desc:0 "Por fin siento que lo tengo claro. Así debe ser el líder de nosotros. Sigamos la guía de [ROOT.GetLeader], que ha atravesado toda tormenta política.\n¡Avancemos! Hacia el futuro, por Gehenna... ¡y por Alemania!"

 GEM_redefinition_of_german_nation:0 "Redefinir la nación alemana"
 GEM_redefinition_of_german_nation_desc:0 "¿Qué es la “nación alemana”? Romperemos las viejas cadenas de la sangre. Renaceremos como una nueva identidad cívica que abarque a todos los que han jurado construir el futuro de esta tierra juntos. La distinción entre gente de Gehenna y alemanes desaparecerá, y solo existirá el “nuevo alemán”."

 GEM_multiethnic_state:0 "Estado multiétnico"
 GEM_multiethnic_state_desc:0 "La vieja fantasía de que solo un pueblo es grandioso fue lo que trajo la tragedia a esta tierra. En lugar de imponer una sola identidad, elegimos un camino donde todos los pueblos vean respetadas sus culturas y tradiciones propias. Gehenna como Gehenna, Alemania como Alemania: ciudadanía igualitaria, logrando una armonía más fuerte dentro de la diversidad."

 ############# Ruta: Makoto
 GEM_focus_ended_1_A:0 "Usurpar la hegemonía alemana"
 GEM_focus_ended_1_A_desc:0 "La poderosa hegemonía alemana es una herramienta magnífica, pero cayó en manos equivocadas. Expulsaremos a los ineficientes gobernantes previos y usurparemos el fuerte sistema estatal que construyeron para usarlo como trampolín de nuestras hazañas. A partir de ahora, la fuerza de Alemania será empuñada por el líder más capaz: nosotras."

 GEM_new_knot:0 "Una nueva pregunta"
 GEM_new_knot_desc:0 "Somos los gobernantes de Alemania, pero no somos alemanes. Esta contradicción evidente puede sacudir los cimientos del Estado. Debemos hacernos la pregunta: ¿qué es un “alemán”? ¿La sangre, la cultura, o la voluntad del fuerte que gobierna de hecho esta tierra? Debemos hallar una respuesta."

 GEM_provable_problem:0 "Un problema demostrable"
 GEM_provable_problem_desc:0 "La pregunta “¿qué es un alemán?” ya no pertenece a la filosofía. Es un problema que podemos definir y demostrar. Estableceremos un sistema que pruebe la cualificación del “nuevo alemán” según la lealtad al Estado, la adhesión a nuestra ideología y la contribución a la gran empresa."

 GEM_gordian:0 "El nudo gordiano"
 GEM_gordian_desc:0 "Intentar desatar el enredo de sangre e historia es una necedad. Un gran líder no deshace el nudo: lo corta. Declararemos que quienes gobiernan y abren el futuro somos la nueva definición de Alemania, y que nuestra forma de hacer las cosas es la forma alemana. La discusión termina aquí."

 GEM_successor_of_fuehrer_station:0 "La sucesora del puesto de Führer"
 GEM_successor_of_fuehrer_station_desc:0 "El puesto de Führer no significa solo al máximo gobernante: simboliza la hegemonía alemana en sí. Cuando la presidenta Hanuma Makoto herede oficialmente el estatus de Führer, aseguraremos legitimidad como gobernantes legítimos de Alemania, no como usurpadores externos, y concentraremos todo el poder en la presidenta."

 GEM_mini_gehenna_academy:0 "Pequeña Academia Gehenna"
 GEM_mini_gehenna_academy_desc:0 "Hemos tomado la hegemonía alemana, pero el estatus de nuestra patria, la Academia Gehenna, sigue siendo ambiguo. Codificaremos su estatus legal dentro del Reich y rediseñaremos su papel. La presidenta del consejo estudiantil también actuará como delegación oficial que represente los intereses de la comunidad de Gehenna dentro de Alemania. Es el primer paso para gobernarlas y administrarlas eficazmente dentro del nuevo orden."

 GEM_broader_german:0 "Un alemán más amplio"
 GEM_broader_german_desc:0 "La definición de “alemán” se libera de la cadena de la sangre. Quienes acepten nuestros nuevos criterios y educación, juren lealtad al Führer y participen en la gran empresa obtendrán la misma condición como “alemanes en un sentido más amplio”. Es un método eficaz para reforzar la cohesión interna y absorber potenciales resistencias."

 GEM_gehenna_liberalism_forced_implantation:0 "Implantación forzada de la cultura de Gehenna"
 GEM_gehenna_liberalism_forced_implantation_desc:0 "Crear una “Pequeña Academia Gehenna” dentro de Alemania no es más que un compromiso pasivo. Iremos más lejos: convertiremos a toda Alemania en una Gehenna gigantesca. Desmantelaremos la cultura vieja de esta tierra e implantaremos a la fuerza nuestro modo de hacer las cosas bajo el nombre de la “libertad de Gehenna”. Los alemanes encontrarán una nueva identidad no en su orden, sino en nuestro grandioso caos."

 GEM_cultural_hegemony_rule:0 "El orden de la hegemonía cultural"
 GEM_cultural_hegemony_rule_desc:0 "Está preparándose una nueva ley para redefinir por completo qué significa ser alemán. Tomaremos por completo la hegemonía cultural de esta tierra e impondremos nuestro orden. El viejo sistema legal alemán será descartado y solo nuestra ideología de gobierno y pensamiento pluralista serán implantados. Toda cultura e idea servirá como herramienta para consolidar nuestro dominio."

 GEM_hanuma_makoto_constitution:0 "Constitución de Hanuma Makoto"
 GEM_hanuma_makoto_constitution_desc:0 "Para poner fin a toda disputa y establecer el nuevo orden para siempre, promulgaremos la “Constitución de Hanuma Makoto”. Esta definirá como leyes inmutables la autoridad absoluta del Führer, la nueva definición de “alemán” y el gran objetivo del Estado. Será el cimiento eterno de la Alemania recreada, del nuevo imperio."

 GEM_back_to_1933:0 "De vuelta a 1933"
 GEM_back_to_1933_desc:0 "Reformar la hegemonía alemana ha demostrado ser demasiado costoso. Hanuma Makoto pospondrá temporalmente sus grandes ambiciones y, en su lugar, elegiremos la estabilidad apaciguando el descontento restaurando el “viejo orden” anterior a 1933. Un gran líder también sabe dar un paso atrás. Ahora nuestra atención volverá a cuestiones más esenciales, como recuperar las relaciones con las ejecutivas de la Manmajeon, que se habían enfriado."

 ############# Ruta: Satsuki
 GEM_focus_ended_2_A:0 "Fundar el Ministerio de Ilustración Pública"
 GEM_focus_ended_2_A_desc:0 "Hemos traído la paz a Gehenna a nuestra manera, pero esto es solo el comienzo. Aún quedan el vasto territorio alemán y sus masas bajo nuestra influencia. Debemos crear un órgano para establecer el orden de la nueva era. El “Ministerio de Ilustración Pública” se encargará de difundir nuestros ideales por toda Alemania y unificar una opinión pública fragmentada. Controlando todos los medios, reformando la educación e implantando valores unificados, asentaremos los cimientos de un Estado verdaderamente estable y armonioso."

 GEM_populism_flow_framework:0 "Encauzar el flujo del populismo"
 GEM_populism_flow_framework_desc:0 "Las emociones de las masas, el populismo, son como un gran río. Si intentas bloquearlo, el dique revienta y arrasa con todo; si abres cauces y guías su dirección, puede fertilizar la tierra. El descontento interno irá hacia un enemigo externo imaginario, y la lealtad dispersa se dirigirá a un solo símbolo: el Estado. El pueblo creerá ser el protagonista de su época, pero incluso sus consignas y su fervor no serán más que engranajes moviéndose dentro de nuestro diseño meticuloso."

 GEM_germany_gehenna_hegemony_integration:0 "Integración de la hegemonía Alemania–Gehenna"
 GEM_germany_gehenna_hegemony_integration_desc:0 "Dos pueblos, un solo Estado. La sensación de extrañeza entre quienes vienen de Kivotos y los alemanes nativos es la grieta más fundamental que amenaza nuestro sistema. El simple control no basta para cerrar ese abismo: debemos fundir ambas identidades en un solo crisol. Haremos que la vieja división entre “Gehenna” y “Alemania” sea irrelevante. Cuando todos se vean a sí mismos como ciudadanía del nuevo Estado, nuestra hegemonía quedará asentada sobre roca."

 GEM_sovereign_of_the_people:0 "Soberana de las masas"
 GEM_sovereign_of_the_people_desc:0 "El Estado ya no es un aparato de gobierno separado del pueblo. Es la manifestación perfecta de su voluntad colectiva y, en su cúspide, la única que la armoniza y guía: yo. Ahora que he integrado Gehenna y Alemania y tomado incluso el flujo ideológico de las masas, me he convertido no por sangre ni autoridad, sino encarnando el “orden” y la “paz” que todos anhelan, en la verdadera soberana. Para vigilar cualquier movimiento impuro, interno o externo, que amenace esta nueva armonía, nuestros ojos y oídos deben extenderse más lejos y más hondo."

 GEM_secret_leadership_and_popular_suffrage:0 "Un liderazgo secreto y el derecho de elección popular"
 GEM_secret_leadership_and_popular_suffrage_desc:0 "Quizá el control absoluto no sea la única respuesta. Conceder al pueblo la libertad de elegir, mientras controlamos el resultado de esa elección: ese es el método de gobierno más estable y refinado. Introduciremos un sistema electoral donde el pueblo elija a sus representantes. Debatirán, votarán y creerán que su voluntad se refleja en la política. Pero su libertad solo se permitirá dentro de la jaula más hermosa que hayamos diseñado."

 idea_GEM_secret_leadership_and_popular_suffrage:0 "Política tras el telón"
 idea_GEM_secret_leadership_and_popular_suffrage_desc:0 "Para democratizar y operar los procedimientos NK-Ultra, debe organizarse un parlamento secreto de líderes elegidos mediante la libertad ideológica; por ello, este país está promoviendo intrigas entre varias instituciones para formar y controlar los departamentos de lavado de cerebro, y operan procedimientos clandestinos.\n\nEl pueblo jamás lo sabrá.\nPara siempre."

 idea_GEM_anti_state_activist_arrest:0 "Operación contra terroristas antiestatales"

 GEM_state_religion_nation:0 "Nación de religión de Estado"
 GEM_state_religion_nation_desc:0 "Los sistemas políticos cambian con la época, pero la fe perdura para siempre. Para convertir la paz que hemos logrado en un imperio milenario, debemos elevar nuestra ideología al rango de religión. Como “diosa” que trajo orden del caos, ya no seré solo una líder: seré la suma sacerdotisa de la nueva era. Los principios de “NK-Ultra” serán nuestra doctrina y las instituciones del Estado, nuestros templos. Quien se oponga a nuestro camino ya no será un reo político, sino un hereje que profana lo sagrado."

 GEM_emperor_of_all_germany:0 "Emperatriz de toda Alemania"
 GEM_emperor_of_all_germany_desc:0 "Para gobernar eficazmente a todos los alemanes y ampliar el sistema NK-Ultra, ascenderé no como una simple líder, sino como la “Kaiserin” del nuevo Imperio Alemán. Mi voluntad será ley; mi convicción, historia. Todas las fuerzas políticas alemanas se unificarán y toda oposición a NK-Ultra será barrida. Al final, solo quedará mi gobierno."

 GEM_reconciliation_of_all_peoples:0 "Armonía de todos los pueblos"
 GEM_reconciliation_of_all_peoples_desc:0 "Nuestro sistema está establecido, pero aún no hemos conquistado por completo el corazón de toda la gente. Iniciaremos un gran proyecto para curar las viejas heridas y lograr una reconciliación nacional genuina. Derribaremos monumentos que simbolizan la división del pasado y construiremos nuevos símbolos de unidad. Con programas sociales que ofrezcan oportunidades iguales sin importar clase u origen, haremos que todos sientan que son miembros orgullosos del Estado."

 GEM_internationalism_nk_ultra:0 "NK-Ultra internacionalista"
 GEM_internationalism_nk_ultra_desc:0 "El virus del caos y la disputa que una vez enfermó a Gehenna sigue rugiendo más allá de nuestras fronteras. Mientras el mundo arda, nuestra paz nunca será completa. Los principios de “NK-Ultra” no son una receta para un solo país, sino un evangelio de salvación para toda la humanidad. Ha llegado el momento de exportar nuestra “paz”. Enviaremos agentes, difundiremos nuestras ideas y comenzaremos una cruzada silenciosa y secreta por el día en que el mundo entero sea uno bajo nuestro orden."

 GEM_closed_curve_parliament:0 "Parlamento de curva cerrada"
 GEM_closed_curve_parliament_desc:0 "Por fin, nuestro sistema de gobierno ha alcanzado su forma definitiva: un sistema perfectamente autocontenido que no se tambalea por variables externas, el “Parlamento de curva cerrada”. Toda decisión se toma dentro de un rango predecible y toda acción sirve a la armonía del conjunto. La gran máquina llamada Estado, guiada por una mano invisible, funcionará ahora sin el menor error. La arquitecta de la paz ha completado su obra maestra y, como guardiana eterna de su estructura, ha afirmado con firmeza su papel."

 ############# Ruta: Iroha
 GEM_focus_ended_3_A:0 "Constitución Federal Alemana"
 GEM_focus_ended_3_A_desc:0 "Rechazamos tanto la tiranía del Imperio como el caos de Kivotos. Construiremos un nuevo Estado sobre el sueño de nuestros antepasados de 1848, fallido pero grandioso. Es el primer paso hacia una república unificada y libre para todos los alemanes."

 GEM_restore_german_federal_territories:0 "Recuperar los territorios federales alemanes"
 GEM_restore_german_federal_territories_desc:0 "Las fronteras legítimas de la Federación Alemana imaginada por el Parlamento Nacional de Fráncfort aún no se han restaurado. Nuestra misión histórica es recuperar todos los territorios germánicos dispersos y unificarlos bajo una gran federación."

 GEM_new_federalist_constitution_of_freedom:0 "Nueva constitución federalista de libertad"
 GEM_new_federalist_constitution_of_freedom_desc:0 "Nuestra nueva constitución será un monumento a la libertad. Para que la dictadura del pasado no vuelva a poner un pie en esta tierra, garantizaremos los derechos fundamentales y codificaremos la separación de poderes, consolidando el cimiento inamovible de la democracia."

 GEM_respect_rights_of_states:0 "Respetar los derechos de los Estados"
 GEM_respect_rights_of_states_desc:0 "La unificación no debe significar centralización. Desde Baviera hasta Schleswig-Holstein, lograremos unidad en la diversidad mediante un auténtico federalismo que respete las tradiciones y la autonomía de cada Estado."

 GEM_master_of_central_europe:0 "Amo de Europa Central"
 GEM_master_of_central_europe_desc:0 "Una Alemania libre y unificada tiene una misión mayor. No basta con existir: debemos ser el Estado líder que dirija el orden de Europa Central. Con nuestra fuerza e ideales, tomaremos la hegemonía de la región."

 GEM_introduce_socialist_economy:0 "Introducir una economía socialista"
 GEM_introduce_socialist_economy_desc:0 "La libertad política sin igualdad económica no es más que un lema vacío. Heredando el espíritu revolucionario de 1848, introduciremos políticas socialistas que protejan a los trabajadores y redistribuyan la riqueza para ofrecer oportunidades justas para todas y todos."

 GEM_most_advanced_german_federation:0 "La federación alemana más avanzada"
 GEM_most_advanced_german_federation_desc:0 "Nuestra federación será el ejemplo del mundo. Combinando libertad democrática e igualdad socialista, construiremos la sociedad más progresista y justa de la historia, y seremos un faro de esperanza para los pueblos oprimidos del mundo."

 GEM_greater_german_federation:0 "Gran Federación Alemana"
 GEM_greater_german_federation_desc:0 "El sueño de 1848 por fin se ha hecho realidad. Todos los alemanes disfrutan de la libertad bajo una sola bandera, y la patria antes dividida renace completa. Esta es la Gran Federación Alemana que nuestros antepasados anhelaron conquistar con su sangre."

 GEM_fortress_of_progress:0 "Fortaleza del progreso"
 GEM_fortress_of_progress_desc:0 "Nuestros ideales progresistas amenazan a las fuerzas caducas de alrededor. Para proteger los frutos de la revolución, la federación debe convertirse en una sólida “fortaleza del progreso” que no ceda ante presión externa alguna."

 GEM_federal_parliament_including_all_political_forces:0 "Parlamento federal que incluye a todas las fuerzas políticas"
 GEM_federal_parliament_including_all_political_forces_desc:0 "No tememos a las opiniones contrarias como los dictadores del pasado. Formaremos un parlamento federal donde todas las fuerzas políticas democráticas, de conservadores a progresistas, participen en igualdad para forjar el futuro del país mediante debate y compromiso."

 ############# Ruta: Chiaki
 GEM_focus_ended_4_A:0 "Entrada en vigor de la Ley de Unificación de Partidos"
 GEM_focus_ended_4_A_desc:0 "Los partidos que proliferan no son más que ruido que estorba el gobierno eficiente. Para unificar la “línea editorial” de la gran página que es el Estado, la secretaria Motomiya Chiaki ha promulgado la “Ley de Unificación de Partidos”. Esto no es dictadura, sino una “edición” indispensable para transmitir la gran visión con la mayor claridad. Ahora el ruido desaparecerá y solo quedará la ejecución sincronizada."

 GEM_german_nation:0 "Declarar la “nación alemana”"
 GEM_german_nation_desc:0 "Definir a los alemanes por sangre y costumbre es anticuado. En medio de una coyuntura caótica, la secretaria Chiaki prepara una declaración histórica para “redefinir” el concepto de nación. A partir de ahora, la “nación alemana” no significará sangre, sino a todos los que se adapten al nuevo orden de esta tierra y suden bajo la dirección de Chiaki. No es abolición del viejo nacionalismo: será una exclusiva que sacudirá la era."

 GEM_german_unification_inheriting_the_will:0 "Unificación alemana heredando la voluntad"
 GEM_german_unification_inheriting_the_will_desc:0 "La gran historia y potencial de Alemania es un activo demasiado valioso como para desecharlo sin más. En lugar de derribar la tradición alemana, Chiaki ha elegido la “herencia”: añadir encima el liderazgo de Gehenna. Respetaremos el orgullo alemán, pero Gehenna sostendrá el timón; puliremos ese manuscrito superventas llamado “Alemania” hasta hacerlo aún más perfecto."

 GEM_german_and_germanic_separation:0 "Separación entre Alemania y lo germánico"
 GEM_german_and_germanic_separation_desc:0 "La cadena biológica de lo “germánico” está frenando el desarrollo del Estado. Chiaki ha iniciado un experimento revolucionario separando el “germánico de sangre” del “ciudadano alemán político”. Ahora, la ciudadanía no se prueba por la sangre de los ancestros, sino por la lealtad a la constitución. Esta edición radical convertirá a innumerables extranjeros en nuestros partidarios más fervientes."

 GEM_academy_state_boundary_adjustment:0 "Ajuste de la frontera academia–Estado"
 GEM_academy_state_boundary_adjustment_desc:0 "La mezcla de autonomía académica y autoridad estatal provoca ineficiencia administrativa. Con su decisión característica, Chiaki ha iniciado una “limpieza de maquetación” para redefinir con claridad la frontera entre academia y Estado. La academia se encarga de educación y autogobierno; el Estado, como órgano superior de gobierno. Así, obtendremos a la vez libertad desenfadada y capacidad administrativa sistemática."

 GEM_anti_state_activist_arrest:0 "Arrestar a elementos antiesestatales"
 GEM_anti_state_activist_arrest_desc:0 "Ahora que el gran rumbo del Estado está fijado, no podemos tolerar a agitadores que rompen filas por quejas menores. Chiaki ha ordenado una gran “tarea de corrección” contra elementos antiesestatales que dañan la estabilidad social. Como borrar erratas que molestan al lector, eliminaremos con rapidez y precisión las disonancias esparcidas por la sociedad."

 GEM_chiaki_constitution:0 "Constitución de Chiaki"
 GEM_chiaki_constitution_desc:0 "La ley suprema no debe ser una costumbre vieja ni una imitación extranjera. Chiaki ha hecho pública la primera versión de la “Constitución de Chiaki”, que condensa su filosofía de gobierno. Priorizando eficiencia, prosperidad y felicidad de las masas, esta constitución simplifica procedimientos complejos y garantiza la decisión del líder: una guía perfecta para el futuro germano-Gehenna."

 GEM_small_gehenna_academy:0 "Pequeña Academia Gehenna"
 GEM_small_gehenna_academy_desc:0 "Si Gehenna se vuelve demasiado grande, nuestra identidad se diluirá. Chiaki ha decidido mantener a Gehenna como un grupo élite de pocos pero selectos: la “Pequeña Gehenna”. La enorme población e industria alemanas serán el cuerpo, y Gehenna el cerebro que las dirige. Este modelo dual es el esquema de gobierno más eficiente."

 GEM_better_integration:0 "Una integración mejor"
 GEM_better_integration_desc:0 "La verdadera integración se completa cuando se derriban fronteras y todo se mezcla. Chiaki ha puesto en marcha un “proyecto de gran integración” donde estudiantes de Gehenna, ciudadanía alemana y diversas minorías se fusionan en la vida cotidiana. La sinergia impredecible de orígenes distintos será el arma más poderosa que diferencie a nuestro país de los estados caducos y estancados."

 GEM_greater_german_reich:0 "Gran Reich Alemán"
 GEM_greater_german_reich_desc:0 "Por fin se ha proclamado la gran hazaña que marcará una página de la historia: el “Gran Reich Alemán (Großdeutsches Reich)”. La combinación del elitismo racional de Gehenna y el potencial de Alemania ha creado un nuevo imperio más eficiente y poderoso que cualquiera del pasado. Bajo la dirección de la “Pequeña Gehenna”, este coloso industrial se moverá al unísono y hará temblar al mundo con nuestro peso abrumador."

 GEM_german_social_republic:0 "Plan de la República Social Alemana"
 GEM_german_social_republic_desc:0 "El punto al que ha llegado la filosofía de Chiaki no es una fría dictadura, sino una comunidad cálida donde todos puedan sonreír. La “República Social Alemana” es la promesa más fuerte de que el Estado se responsabilizará de la vida de su gente. Las políticas distributivas audaces y los compromisos flexibles, tan propios de Chiaki, suturarán los conflictos de clase y etnia, creando el “final feliz” más estable y próspero."

 GEM_german_peoples_republic:0 "República Popular Alemana"
 GEM_german_peoples_republic_desc:0 "Hemos derribado la vieja autoridad y el supremacismo de sangre, y construimos una sociedad igualitaria bajo un solo nombre: “el pueblo”. La “República Popular Alemana” es la cristalización del igualitarismo radical y las reformas sensacionales de Chiaki. La demolición de privilegios, la movilización masiva y los eventos nacionales interminables convertirán este país en un crisol de revolución que no se detiene."

 GEM_manmajeon_chairmanship_separation:0 "Separar el cargo de presidenta de la Manmajeon"
 GEM_manmajeon_chairmanship_separation_desc:0 "Con el peso de las responsabilidades como jefa de Estado, Motomiya Chiaki ya no puede seguir atada al título de “presidenta del consejo estudiantil de Gehenna”. Por ello, ha decidido separar el cargo de presidenta de la Manmajeon y el liderazgo nacional para correr a toda velocidad tras la gran exclusiva llamada “gobernar el Estado”. Desde la silla de secretaria hasta la cima del país, su trayectoria entra ahora en una nueva fase."

 GEM_german_A4_right:0 "???"
 GEM_german_A4_left:0 "???"
 GEM_german_A4_tooltip:0 "§gEl árbol de enfoques cambiará según cuál de estos se haya completado: §Y$GEM_greater_german_reich$§!, §Y$GEM_german_social_republic$§! o §Y$GEM_german_peoples_republic$§!.§!"
 GEM_german_A4_tt:0 "Este enfoque cambiará a un árbol completo al completar uno de estos: §Y$GEM_greater_german_reich$§!, §Y$GEM_german_social_republic$§! o §Y$GEM_german_peoples_republic$§!."

 GEM_german_A41_right:0 "Reactivar el Frente Alemán del Trabajo"
 GEM_german_A41_left:0 "Batallón de Defensa de la Patria Alemana"

 GEM_german_A42_right:0 "Grandes corporaciones y grandes bancos"
 GEM_german_A42_left:0 "Coalición social cooperativista"

 GEM_german_A43_right:0 "Participación del gran capital en el gobierno"
 GEM_german_A43_left:0 "Nacionalizar todas las empresas alemanas"

 GEH_germany_gehennea_militia_1:0 "Batallón de Defensa de la Patria Alemana"
 GEH_germany_gehennea_militia_1_desc:0 "El Batallón de Defensa de la Patria, formado por el Servicio de Trabajo y milicias anticapitalistas, protege al Estado junto a la ciudadanía y apoya los frentes industriales."

 #### Enfoques bajo la Federación Alemania–Gehenna
 GEM_focus_ended_BO:0 "Reforzar la política de facciones"
 GEM_focus_ended_BO_desc:0 "Un solo Estado, dos corazones. Para sostener la paz frágil de la federación, hemos elegido la coexistencia realista en vez de una integración ideal. Reconoceremos facciones fuertes que representen la identidad de cada lado y abriremos una nueva era en la que el país se gobierna a través de su competencia."

 GEM_new_people_of_new_regime:0 "Nueva ciudadanía del nuevo régimen"
 GEM_new_people_of_new_regime_desc:0 "Ni Gehenna ni “viejos alemanes”. Estableceremos el concepto de “pueblo federal”: una nueva ciudadanía que, bajo la ley de la federación, posee derechos y deberes iguales. No sustituye identidades antiguas: añade sobre ellas una nueva lealtad nacional."

 GEM_gehenna_ruling_party_formation:0 "Formar el partido gobernante de Gehenna"
 GEM_gehenna_ruling_party_formation_desc:0 "El viejo sistema de la Manmajeon, un conjunto de clubes e intereses, es demasiado caótico para dirigir un Estado moderno. Unificaremos todas las fuerzas de origen Gehenna para crear un partido único, fuerte y disciplinado: el “Partido Popular de Toda Gehenna”."

 GEM_push_reform_beyond:0 "¡Empuja la reforma más allá!"
 GEM_push_reform_beyond_desc:0 "El poder del nuevo partido gobernante debe usarse para el cambio. Desataremos una ola de eficiencia administrativa al estilo Kivotos y reformas sociales en toda la federación, rompiendo costumbres alemanas caducas y llevando al país hacia la siguiente era."

 GEM_anton_drexler_rehabilitation:0 "Rehabilitar a Anton Drexler"
 GEM_anton_drexler_rehabilitation_desc:0 "El nuevo partido germano debe liberarse de los fantasmas del pasado. En lugar del símbolo llamado Hitler, revalorizaremos el nacionalismo conservador del fundador del partido, Anton Drexler, para redefinir nuestras raíces ideológicas y atraer a un electorado más moderado."

 GEM_in_the_name_of_the_fuehrer:0 "En nombre del Führer"
 GEM_in_the_name_of_the_fuehrer_desc:0 "Führer: un nombre de gloria y, a la vez, de herida. No quedaremos atrapadas en la locura del pasado. En su lugar, reexaminaremos el legado de fuerte nacionalismo y anticomunismo que dejó y lo convertiremos en un arma ideológica para unir a la nación alemana en estos tiempos caóticos."

 GEM_in_the_name_of_all_germany:0 "En nombre de toda Alemania"
 GEM_in_the_name_of_all_germany_desc:0 "La archienemiga Trinity se ha arrodillado. Con esta gran victoria, por fin hemos superado la división y logrado una Alemania verdaderamente unida. Nuestra causa ya no está limitada a un líder ni a un legado del pasado. Es el nombre mismo de “toda Alemania” victoriosa, y con esa gloria haremos resonar la fuerza de una nación unificada ante el mundo."

 GEM_the_more_things_change:0 "Aunque todo cambie,"
 GEM_the_more_things_change_desc:0 "Nueva constitución, nuevo partido, nuevo pueblo. Todo en el país ha cambiado. Ya no somos simples ocupantes y ocupados: somos socios políticos iguales que compiten dentro de un mismo sistema."

 GEM_the_more_they_stay_the_same:0 "más cosas permanecen."
 GEM_the_more_they_stay_the_same_desc:0 "Pero aunque todo haya cambiado, hay cosas que no cambian: las pequeñas travesuras de las estudiantes de Gehenna y la cultura alemana siguen ahí. Por eso seguimos siendo Alemania y Gehenna, solo que bajo un mismo Estado. Todo conflicto quedará sellado dentro del parlamento."

 GEM_two_party_state:0 "El Estado de dos partidos"
 GEM_two_party_state_desc:0 "El nuevo orden por fin se ha completado: partido gobernante de Gehenna y oposición alemana. Un sistema bipartidista donde dos grandes fuerzas se vigilan y compiten mientras conducen el país. Es inestable, pero es la forma final y dinámica de nuestra federación."

 ############# Ruta (Federación) Makoto
 GEM_focus_ended_1_B:0 "Unificar la hegemonía alemana"
 GEM_focus_ended_1_B_desc:0 "Solo hay una forma de que Gehenna y los alemanes vivan sin chocar: asegurar esferas de vida separadas para cada pueblo. ¡Bajo el nombre del gran gobierno de coalición, avanzará el plan por el Lebensraum!"

 GEM_germania_grand_coalition:0 "Gran coalición de Germania"
 GEM_germania_grand_coalition_desc:0 "Unir a dos pueblos tan distintos en un solo Estado nunca será sencillo. Debemos construir un sistema de gran coalición en el que participen las fuerzas políticas alemanas y la Manmajeon de Gehenna, asegurando estabilidad política y estableciendo una administración unificada. Así comienza la nueva Germania."

 GEM_nazi_party_dissolution:0 "Expulsar al partido nazi"
 GEM_nazi_party_dissolution_desc:0 "Para completar el Estado de dos mundos, debemos destruir a las fuerzas del nacionalismo duro. Nos ayudaron a formar el gobierno federal y quizá lo sigan haciendo, pero no ahora. Reuniremos a partidos minoritarios alemanes para formar una coalición, arrestaremos en masa a los ultranacionalistas, disolveremos el NSDAP y lo absorberemos."

 GEM_german_nationalism_reformation:0 "Reformar el nacionalismo alemán"
 GEM_german_nationalism_reformation_desc:0 "Debemos reformarlo para que la categoría de “alemán” incluya a la ciudadanía federal más amplia. En el proceso, se facilitará la participación política masiva de minorías antes marginadas en la federación, gente de otros países o incluso de origen Trinity."

 GEM_silent_state:0 "El Estado silencioso"
 GEM_silent_state_desc:0 "Existen voces internas y externas que se oponen al nacimiento de la nueva federación. Debemos identificar a todo elemento impuro que amenace la estabilidad y, mediante una agencia de inteligencia poderosa, silenciar a la oposición. La gran empresa federal debe avanzar sin el menor temblor, y para ello es imprescindible un control interno total."

 GEM_lebensraum_of_two_nations:0 "Lebensraum de dos pueblos"
 GEM_lebensraum_of_two_nations_desc:0 "El territorio actual es demasiado estrecho para materializar el potencial ilimitado de nuestra federación. El pueblo alemán necesita industria y tierras agrícolas; el pueblo de Gehenna, nuevas áreas de actividad y recursos. Ha llegado el momento de expandir nuestro espacio vital legítimo por la supervivencia y la prosperidad futura de la federación."

 GEM_trinity_colonization:0 "Colonización de Trinity"
 GEM_trinity_colonization_desc:0 "Trinity, en el extremo opuesto de nuestra ideología, es el mayor obstáculo y a la vez el fruto más codiciado para la expansión federal. Incorporaremos sus tierras como colonia para asegurar abundantes recursos e implantaremos nuestro sistema superior, desarrollándolo como un nuevo hogar para el pueblo de Gehenna."

 GEM_south_germany_unification:0 "Unificación del sur de Alemania"
 GEM_south_germany_unification_desc:0 "Nuestros compatriotas de Austria, que comparten la misma sangre y lengua, siguen fuera de la federación. Ya no podemos observar una historia dividida. Unir a todos los pueblos germánicos bajo una sola bandera es nuestra tarea histórica y hará a la federación aún más poderosa."

 GEM_outer_gehenna_unification:0 "Unificación de la “Gehenna exterior”"
 GEM_outer_gehenna_unification_desc:0 "La región de Luxemburgo, fuera del control federal, debe incorporarse a la federación: allí se han asentado fuerzas de origen Gehenna y, además, su líder también es una estudiante de Gehenna."

 GEM_achievement_of_two_nations_utopia:0 "Lograr la utopía de dos pueblos"
 GEM_achievement_of_two_nations_utopia_desc:0 "Por fin nuestra gran empresa se ha consumado. La federación ha superado toda amenaza interna y externa y ha construido una utopía donde dos pueblos conviven en armonía dentro de sus propias esferas de vida, disfrutando de prosperidad eterna. El nombre de la Federación Germania–Gehenna brillará por siempre en la historia, y comienza una nueva era."

 GEM_gehenna_federation_establishment:0 "Establecer la Gran Federación de Gehenna"
 GEM_gehenna_federation_establishment_desc:0 "El plan final de Hanuma Makoto llega al fin a su conclusión. La federación ha aplastado todas las amenazas internas y externas y ha construido un nuevo orden donde innumerables pueblos conviven en armonía, cada uno con sus propios derechos. El nombre de la Gran Federación de Gehenna brillará por siempre en la historia, y comienza una nueva era."
 
 GEM_focus_ended_2_B:0 "Fundación del Ministerio de la Verdad"
 GEM_focus_ended_2_B_desc:0 "La verdad ha sido revelada. Pero una verdad abandonada no es más que otro nombre para el caos. Para que las heridas del pasado no vuelvan a dividirnos, ahora es necesario ‘gestionar’ la verdad. El ‘Ministerio de la Verdad’ no oculta los hechos. Je, je… simplemente guía a toda la ciudadanía para que ‘comprenda’ correctamente el pasado y pueda avanzar hacia una mejor armonía. Es el primer paso más honesto para reconstruir la confianza."
 GEM_realistic_cooperativism:0 "Cooperativismo realista"
 GEM_realistic_cooperativism_desc:0 "Gehenna y Alemania. Forzar a dos pueblos con historias e identidades distintas a fundirse en uno solo es ineficiente y solo genera rechazo. El camino realista comienza por reconocer sus diferencias. Diseñaremos un sistema perfecto en el que ambas facciones se respeten, se vigilen y no tengan más remedio que coexistir. La cooperación no será una opción, sino la única forma de supervivencia."
 GEM_suppression_of_radical_parties:0 "Supresión de los partidos radicales"
 GEM_suppression_of_radical_parties_desc:0 "Quienes amenazan el delicado equilibrio que hemos diseñado no vienen de fuera, sino de dentro: los extremistas. Ni los puristas de Gehenna ni los fanáticos arios tienen cabida en nuestra sociedad armoniosa. En nombre de la paz, eliminaremos estas semillas de conflicto en silencio y de manera exhaustiva. No es más que una poda inevitable por la estabilidad social."
 GEM_establishment_of_two_party_system:0 "Establecimiento de una estructura bipartidista"
 GEM_establishment_of_two_party_system_desc:0 "Acallar todas las voces es una necedad. En su lugar, basta con crear un cauce seguro por el que puedan fluir. Fundaremos dos partidos oficiales que representen los intereses de Gehenna y de Alemania. Competirán de forma sana dentro de reglas establecidas y actuarán como válvula de escape para el descontento popular. Claro está… quien fija esas reglas soy yo. Je, je."
 GEM_gradual_abolition_of_nk_ultra:0 "Abolición gradual de NK Ultra"
 GEM_gradual_abolition_of_nk_ultra_desc:0 "El sistema se ha estabilizado. La gente empieza a aprender a mantener la armonía por sí misma. Entonces, ya no es necesario que los tome de la mano para siempre. Retiraremos gradualmente el dispositivo auxiliar llamado ‘NK Ultra’, dándoles la oportunidad de demostrar que eligen la paz por voluntad propia. Este es el último ‘acto de fe’ que les concedo."
 GEM_leader_standing_on_two_feet:0 "Una líder que se sostiene sobre dos pies"
 GEM_leader_standing_on_two_feet_desc:0 "La guía tras el telón ya no es necesaria. Ahora que el sistema comienza a funcionar por sí solo, yo también saldré de las sombras y me presentaré ante la ciudadanía como una ‘líder’. No gobernar con una mano invisible, sino conducir al país basándome en su confianza. Ese es el último paso para demostrar que la paz que he construido es auténtica."
 GEM_opposition_control_and_great_leader:0 "Control de la oposición y la gran líder"
 GEM_opposition_control_and_great_leader_desc:0 "La democracia es el mecanismo de estabilización más eficiente. Eso sí, solo cuando está perfectamente controlada. En lugar de reprimir a la oposición, ‘guiaremos’ a sus dirigentes. Parecerán oponerse con vehemencia, pero al final siempre elegirán un ‘compromiso sensato’ por el bien del Estado. Al observar ese proceso, la ciudadanía confiará en mí como una gran líder capaz de superar cualquier crisis."
 GEM_your_fatherland:0 "Su patria"
 GEM_your_fatherland_desc:0 "Creerán que luchan por sus respectivos partidos, pero en realidad no serán más que actores de esta gran obra, reforzando su sentido de pertenencia al Estado. Este país ya no es solo mío. Cuando Gehenna y Alemania, todas y todos, crean que es ‘su patria’ y quieran protegerla, mi gobierno estará por fin completo."
 GEM_leap_toward_the_ideal_of_unification:0 "Un salto hacia el ideal de la unificación"
 GEM_leap_toward_the_ideal_of_unification_desc:0 "Mientras coexistan dos facciones, la chispa del conflicto nunca se extinguirá. Para alcanzar una paz verdadera, debemos derribar las viejas fronteras de ‘Gehenna’ y ‘Alemania’. Fusionaremos únicamente las virtudes de ambos pueblos para crear una nueva nación integrada, libre del pasado: el ‘germano-gehenna’. No es simple conciliación, es un salto hacia una nueva humanidad."
 GEM_pioneers_of_the_fatherland:0 "Los pioneros de la patria"
 GEM_pioneers_of_the_fatherland_desc:0 "Un nuevo pueblo necesita nuevos héroes. Las figuras del pasado no son más que símbolos de división. Rescataremos de la historia de Gehenna y Alemania a quienes encarnaron los valores de la ‘integración’ y la ‘pionería’, elevándolos como ‘Pioneros de la Patria’ para convertirlos en el núcleo de la nueva identidad nacional. El futuro depende de cómo editemos el pasado."
 GEM_breaking_down_boundaries:0 "Derribar las fronteras"
 GEM_breaking_down_boundaries_desc:0 "Idioma, cultura, formas de vida… eliminaremos de manera sistemática todas las barreras que separan a ambos pueblos. Haremos obligatoria una educación integrada, fomentaremos nuevos festivales donde ambas culturas se mezclen de forma natural e incluso reorganizaremos las zonas residenciales. Con el tiempo, olvidarán incluso que alguna vez pertenecieron a pueblos distintos."
 GEM_one_party_collective_leadership_system:0 "Sistema de liderazgo colectivo de partido único"
 GEM_one_party_collective_leadership_system_desc:0 "Un pueblo unificado solo necesita un único partido. Dentro de ese partido existirán diversas facciones que podrán expresar libremente sus opiniones. Pero una vez tomada una decisión, el partido actuará con una sola voluntad. La tecnología NK Ultra se utilizará ahora únicamente como herramienta auxiliar para ayudar a este liderazgo colectivo a alcanzar siempre la conclusión ‘más armoniosa’."
 GEM_diversified_ideology_and_unified_rule:0 "Ideología diversificada y gobierno unificado"
 GEM_diversified_ideology_and_unified_rule_desc:0 "Miren: dentro del partido se debaten libremente innumerables corrientes de pensamiento. Sin embargo, el Estado siempre se gobierna de forma coherente y estable. Hemos encontrado el equilibrio ideal que garantiza la libertad ideológica individual y, al mismo tiempo, mantiene la unidad del conjunto nacional. Esto es el verdadero significado de una democracia avanzada."
 GEM_one_leader:0 "Una sola líder"
 GEM_one_leader_desc:0 "Un sistema y un Estado solo pueden tener una líder. Todo pensamiento y toda voluntad deben emanar de mí. La ciudadanía pensará a través de mí, sentirá a través de mí y se unificará a través de mí. Ya no soy una gobernante. Soy el Estado mismo."
 GEM_unification_of_state_departments:0 "Unificación de los departamentos del Estado"
 GEM_unification_of_state_departments_desc:0 "Je, je… los nombres de los departamentos actuales son demasiado complejos… y anticuados. ‘Ministerio de Información’, ‘Comité de Disciplina’… todos son restos del pasado. Elevaremos el Ministerio de la Verdad a ‘Ministerio de la Verdad Absoluta’ y dejaremos solo cuatro ministerios esenciales. El ‘Ministerio de la Paz’, que mantiene la paz a través de la guerra; el ‘Ministerio del Amor’, que gestiona el pensamiento y el afecto; y el ‘Ministerio de la Abundancia’, que distribuye una prosperidad controlada. Estos cuatro pilares ejecutarán mi voluntad sin margen de error y garantizarán la estabilidad eterna: la forma más perfecta de Estado."
 GEM_national_renovation:0 "Renovación nacional"
 GEM_national_renovation_desc:0 "Gehenna y Trinity. Todos los vestigios del viejo orden han sido barridos. Nuestro nuevo Estado integrado ya no necesita atarse a nombres del pasado. Renovamos la nación bajo el nombre de la gran federación que abarca Gehenna, Alemania y todos los territorios conquistados: la ‘Gran Federación de Gehenna’. Esta es la proclamación que marca el verdadero inicio de una nueva era."
 GEM_yet_the_dawn_rises:0 "Y aun así, el amanecer llega"
 GEM_yet_the_dawn_rises_desc:0 "La oscuridad del pasado fue profunda. Pero miren: dos soles se iluminan mutuamente y coexisten. No es perfecto, pero por fin hemos encontrado armonía en medio del conflicto. Sobre esta paz frágil construiremos el mañana. Sí, pese a innumerables errores… aun así, el amanecer llega."
 GEM_nation_seeking_future:0 "Una nación en busca del futuro"
 GEM_nation_seeking_future_desc:0 "Todas las fronteras del pasado han desaparecido. Ahora avanzamos como un solo pueblo hacia un único futuro. Tras atravesar un túnel largo y oscuro, por fin hemos encontrado la luz. Nadie sabe qué futuro aguarda a este nuevo Estado, pero una cosa es segura: ya no estamos atados al pasado, solo miramos hacia adelante."
############# 이로하
 GEM_focus_ended_3_B:0 "Constitución de la Unión Federal Germano-Gehenna"
 GEM_focus_ended_3_B_desc:0 "Una federación de dos naciones y una unión de numerosos estados. Hemos construido una nueva esperanza sobre un terreno inestable; por eso, aún no podemos detenernos. La Unión Federal exige más reformas y será la única carta clave para armonizar a los dos pueblos, Gehenna y Alemania."
 GEM_rise_of_gehenna_party:0 "Surgimiento de los partidos gehenna"
 GEM_rise_of_gehenna_party_desc:0 "Bajo el sistema federal, las viejas estructuras políticas del antiguo Pandemonium y del Comité de Disciplina ya no son válidas. Para negociar y competir en igualdad de condiciones con los partidos alemanes, debemos crear nuevos partidos que representen la voluntad política de la facción gehenna."
 GEM_two_factions_one_system:0 "Dos facciones, un solo sistema"
 GEM_two_factions_one_system_desc:0 "Alemanes y gehenna: dos pueblos demasiado distintos se han alzado bajo una sola bandera. Para que la federación no se derrumbe en una guerra civil, debemos establecer un marco político estable en el que los partidos de ambos lados se reconozcan mutuamente y coexistan."
 GEM_activate_coalition:0 "Activar la coalición"
 GEM_activate_coalition_desc:0 "No basta con levantar un marco político; ahora hace falta cooperación real. Impulsaremos gobiernos de coalición en los parlamentos estatales y en el parlamento federal, donde partidos alemanes y gehenna formen gobierno juntos y den el primer paso hacia la integración."
 GEM_equal_conscription_law:0 "Ley de conscripción igualitaria"
 GEM_equal_conscription_law_desc:0 "El deber de defensa no debe recaer solo en un pueblo. Al imponer la obligación del servicio militar por igual tanto a alemanes como a gehenna, compartiremos —a través de la sangre— una identidad auténtica como ‘ciudadanía de la Unión Federal’."
 GEM_establish_bereaved_family_compensation_system:0 "Establecer el sistema de compensación a familias de caídos"
 GEM_establish_bereaved_family_compensation_system_desc:0 "Las familias de quienes cayeron durante el Gran Traslado —y en el caos que siguió hasta hoy— no deben ser discriminadas por su origen. Junto con la reforma de la conscripción, instauraremos un sistema unificado de compensación que abarque tanto a alemanes como a gehenna, demostrando que el Estado valora por igual la vida de toda su ciudadanía."
 GEM_gehenna_grand_coalition:0 "La gran coalición de Gehenna"
 GEM_gehenna_grand_coalition_desc:0 "No se puede gobernar un país solo con idealismo. El profundo abismo de desconfianza entre gehenna y alemanes aún no ha sido colmado. En vez de apostar a tender la mano, elegimos el camino más realista y estable. Puede que esto no sea reconciliación, sino una división perpetua; pero esta sólida alianza política será el dique más fuerte frente a las amenazas internas y externas que intenten fracturar la Unión."
 GEM_reaching_out_to_each_other:0 "La mano tendida al otro"
 GEM_reaching_out_to_each_other_desc:0 "Las leyes y las instituciones han levantado un esqueleto frío, pero la sangre cálida que debe llenarlo aún no circula. Gehenna y alemanes siguen viéndose como ‘ellos’, no como ‘nosotros’. En lugar de tomar el camino seguro de la gran coalición, comenzamos una apuesta idealista. Si tiene éxito, lograremos una verdadera reconciliación saltándonos décadas de tiempo. Si fracasa… la desconfianza se hundirá a una profundidad incontrolable."
 GEM_we_are_back:0 "¡Hemos vuelto!"
 GEM_we_are_back_desc:0 "La larga era de caos y división ha terminado. Alemania y Gehenna han renacido por fin como un solo país y un solo pueblo. Ahora, la Unión Federal mostrará una vez más su presencia en el escenario mundial como un Estado fuerte y unificado que ha superado las heridas de la fragmentación."
 GEM_trinity_oppression:0 "Represión trinitaria..."
 GEM_trinity_oppression_desc:0 "Hemos logrado armonizarnos con los alemanes, pero dentro de nosotros queda otro nuevo ‘forastero’. Los trinitarios, antiguos rivales de Gehenna. Al reprimir su cultura y controlar su influencia, consolidaremos aún más la homogeneidad de la Unión."
 GEM_federation_of_three_nations:0 "¿...Una federación de tres naciones?"
 GEM_federation_of_three_nations_desc:0 "Si fuimos capaces de integrar a los alemanes, ¿no podríamos aceptar también a los trinitarios como parte de nosotros? Gehenna, Alemania y Trinity: exploraremos la posibilidad de avanzar hacia una federación más grande y grandiosa que respete la singularidad de los tres pueblos."
 GEM_federation_of_three_nations1_tt:0 "Al completar el enfoque $GEM_reaching_out_to_each_other$:"
 GEM_federation_of_three_nations2_tt:0 "Al completar el enfoque $GEM_gehenna_grand_coalition$:"

 ############# 치아키
 GEM_focus_ended_4_B: "Declaración de la «Nación Gehenna»"
 GEM_focus_ended_4_B_desc: "El caos de esta tierra surgió porque nos hemos definido mutuamente como «otros». La secretaria Chiaki deroga el viejo linajismo y proclama la «Nación Gehenna», un nuevo concepto superior que trasciende la raza y el origen.\n\nAhora, los germanos, los estudiantes de Gehenna, los ciudadanos de los distritos autónomos y las innumerables razas diferentes son todos hermanos dentro del gran cercado de una única «Nación Gehenna». Esto no es una simple unión física, sino una gran fusión química orientada a la «unidad en la diversidad». Tenemos raíces distintas, pero a partir de ahora quedaremos registrados como una misma comunidad de destino en un solo libro de historia que Chiaki edita."

 GEM_manmajeon_chairmanship_separation_B: "Separación del cargo de presidenta del Manmajeon"
 GEM_manmajeon_chairmanship_separation_B_desc: "A medida que las responsabilidades como jefa de Estado se vuelven más pesadas, Motomiya Chiaki ya no puede seguir atada al título de «presidenta del consejo estudiantil de Gehenna». Por ello, toma la audaz decisión de separar el cargo de presidenta del Manmajeon del liderazgo estatal y lanzarse a toda velocidad tras la exclusiva de mayor escala: la «gestión del Estado». Su trayectoria, iniciada en el puesto de secretaria y culminada en la cima del país, entra ahora en una nueva fase."

 GEM_national_schizophrenia_expulsion: "Expulsión de la esquizofrenia nacional"
 GEM_national_schizophrenia_expulsion_desc: "La pregunta estéril de «¿soy alemán o soy gehenna?» queda ahora prohibida. Para tratar esta esquizofrenia nacional, la secretaria Chiaki define la obstinación en identidades inferiores como una patología social. Solo tendremos una única mente sana: la de «ciudadanos federales». Esto no es un olvido forzado. Es un proceso terapéutico imprescindible para integrar un yo fragmentado y renacer como una «mente única» más sana y poderosa."

 GEM_anti_federal_nationalist_group: "Grupos nacionalistas antifederales"
 GEM_anti_federal_nationalist_group_desc: "El mayor enemigo de nuestra gran unificación no está fuera, sino dentro. Los nacionalistas alemanes obsesionados con la pureza de sangre y los supremacistas de Gehenna son «pacientes paranoicos reaccionarios» incapaces de leer el signo de los tiempos. La secretaria Chiaki los define como «faccionalistas antifederales» y los declara una presencia cancerosa que obstaculiza la integración social. Por la gran exclusiva de la unificación total, estos fósiles de otra era, aferrados a la lógica obsoleta de la sangre y ensuciando las páginas, serán eliminados sin contemplaciones."

 GEM_minor_party_cooptation_induction: "Inducción por cooptación de partidos minoritarios"
 GEM_minor_party_cooptation_induction_desc: "Un gran río no rechaza a los pequeños afluentes, sino que los acoge. Para ampliar la base de apoyo de la federación, la secretaria Chiaki emplea una estrategia flexible de cooptación, integrando bajo la bandera federal a partidos minoritarios sin un color ideológico definido. A cambio, se les concederán pequeños roles y voz dentro del parlamento federal. Esta «cooptación estratégica» otorgará legitimidad democrática a nuestro gobierno y se convertirá en la ingeniería política más eficiente para aislar a la oposición."

 GEM_chiaki_reform: "Reforma Chiaki"
 GEM_chiaki_reform_desc: "Así como el vino nuevo requiere odres nuevos, una nueva nación necesita un nuevo sistema. La «Reforma Chiaki» es un proyecto de reconstrucción social a gran escala que inyecta la identidad de la «Nación Gehenna» en la administración, la educación y la cultura en su conjunto. Las leyes anticuadas, complejas e ineficientes serán abolidas sin miramientos y sustituidas por sistemas pragmáticos que aceleren la integración federal. Esto no es un simple cambio institucional. Es un trabajo creativo de edición que recorta y recompone dos manuscritos —el germano y el gehenna— para crear una obra maestra completamente nueva."

 GEM_enthusiastic_public_opinion_leadership: "Liderazgo de una opinión pública entusiasta"
 GEM_enthusiastic_public_opinion_leadership_desc: "Antes de que la razón comprenda, la emoción debe reaccionar. Con un talento genial, la secretaria Chiaki dirige los medios de masas para transformar el apoyo popular a la federación en un fandom entusiasta. Las calles se llenan de consignas esperanzadoras y en la radio resuenan himnos que cantan el futuro de la unificación. Fascinadas por la visión deslumbrante presentada por Chiaki, las masas llegarán a creer que ellas mismas son las protagonistas de una gran historia."

 GEM_decadence_of_old_culture: "Decadencia de la cultura antigua"
 GEM_decadence_of_old_culture_desc: "Para que florezca una nueva cultura, es necesario extirpar las raíces viejas. La secretaria Chiaki inicia una sofisticada operación cultural que relega fuera del interés popular a las tradiciones particulares que rechazan la unificación, etiquetándolas como «costumbres decadentes que obstaculizan el progreso». \"Provincianas, aburridas e ineficientes\". Al imponer estas imágenes sobre el legado del pasado, la juventud se alejará de forma natural de las viejas tradiciones y anhelará la nueva y refinada cultura de la federación."

 GEM_left_wing_opposition_acceptance: "Aceptación de la oposición de izquierda"
 GEM_left_wing_opposition_acceptance_desc: "Si es para expulsar al espectro del nacionalismo, incluso el enemigo de ayer puede convertirse en aliado. La secretaria Chiaki ha percibido que el carácter internacionalista de las fuerzas de izquierda, opuestas a las divisiones étnicas, conecta con nuestra teoría de integración de la «Nación Gehenna». Los incorporaremos al sistema y los utilizaremos como sabuesos para contener a los nacionalistas de derecha. Aunque su ideología no coincida plenamente con la nuestra, mientras corramos hacia el mismo destino de una «federación unificada», serán compañeros de viaje útiles."

 GEM_clandestine_communist_group: "Grupos comunistas clandestinos"
 GEM_clandestine_communist_group_desc: "En público claman por la igualdad, pero en la sombra no son más que esbirros dispuestos a ofrecer el Estado que hemos construido a Moscú. La secretaria Chiaki ha comprendido que los comunistas pretenden utilizar la integración federal como herramienta para su propia revolución. Estas células rojas clandestinas intentan contaminar nuestro país con la lucha de clases. Los declararemos enemigos de la federación y los vigilaremos y bloquearemos minuciosamente desde las sombras."

 GEM_new_system_and_new_state_construction: "Construcción del nuevo sistema y del nuevo Estado"
 GEM_new_system_and_new_state_construction_desc: "Finalmente, se ha completado un nuevo mundo que nadie podría haber imaginado. Nacida tras romper la prisión del linaje, la «Federación Gehenna-Alemania» es un Estado de fusión multinacional sin precedentes en la historia humana, y el borrador caótico del pasado ha sido descartado. Ahora pasamos la primera página de un nuevo Estado perfectamente editado, un best seller que será recordado para siempre."

 GEM_german_B4_tt: "Este enfoque cambiará a un árbol de enfoques completo al completar §Y$GEM_new_system_and_new_state_construction$§!."
 GEM_german_B4_tooltip: "§g§Y$GEM_left_wing_opposition_acceptance$§! y §Y$GEM_clandestine_communist_group$§! también cambiarán el árbol de enfoques según cuál de §Y$GEM_populist_leader$§! o §Y$GEM_corporate_tax_deduction$§! se haya completado.§!"
 GEM_german_B4: "???"
 GEM_german_B4_1: "Plan quinquenal de democratización económica"
 GEM_german_B4_1_desc: "¿Quién dijo que es imposible atrapar dos conejos de un tiro: el crecimiento empresarial y los derechos de los trabajadores? La secretaria Chiaki diseñó una estructura de circulación revolucionaria que hace fluir el poder de capital obtenido por las empresas mediante la inversión hacia los salarios obreros, exigidos por la «oposición de izquierda». Este sistema económico, donde los frutos del crecimiento van directo al bolsillo del pueblo, se convertirá en el guion del «final feliz» más ideal de la historia, en el que el capital y el trabajo alcanzan una armonía perfecta."

 GEM_german_B4_2: "Establecimiento del complejo militar-industrial"
 GEM_german_B4_2_desc: "Para proteger nuestro Estado de los enemigos que se mueven en la sombra, necesitamos una fuerza poderosa. La secretaria Chiaki combinó el capital de los grandes conglomerados con la seguridad nacional para lanzar un enorme «complejo militar-industrial». Ahora las empresas producen el escudo del Estado, y el Estado, con ese poder, vigila minuciosamente a las fuerzas que buscan derrocar el sistema. Esta es la «alianza de hierro» más fuerte y eficiente entre el capital y la autoridad pública."

 GEM_german_B4_3: "Constitución socialista"
 GEM_german_B4_3_desc: "El fundamento del Estado no reside en las élites, sino en el «pueblo», protagonista de la historia. Esta nueva constitución, que incorpora el apoyo fervoroso de las masas y la ideología de las fuerzas de izquierda, hará renacer a la Federación Gehenna como un verdadero Estado de bienestar. Este código, supervisado personalmente por la secretaria Chiaki, es el libreto del «drama humano» más cálido y conmovedor de la historia, garantizando a todo ciudadano la felicidad desde la cuna hasta la tumba."
 GEM_chiaki_system_decision_GEM_german_B4_3_1: "Giro a la izquierda a nivel nacional"
 GEM_chiaki_system_decision_GEM_german_B4_3_2: "Propaganda del nuevo sistema: movimiento socialista"
 GEM_chiaki_system_decision_GEM_german_B4_3_3: "Propaganda del nuevo sistema: movimiento socialista"

 GEM_german_B4_4: "Democracia con características gehenna de la nueva era"
 GEM_german_B4_4_desc: "La verdadera democracia no es la desgastante lucha de clases, sino la «comunión directa» entre el líder y el pueblo. La secretaria Chiaki bloqueó las maniobras divisorias de los comunistas y proclamó la «democracia con características gehenna de la nueva era», unida como una sola por la nación y el Estado. Este sistema, que «edita» el anhelo popular con la mayor rapidez y precisión para convertirlo en políticas, es el modelo de gobierno más eficiente para atravesar una época caótica."
 idea_GEM_german_B4_4: "Democracia con características gehenna de la nueva era"
 idea_GEM_german_B4_4_desc: "¿Por qué una reforma de izquierda tendría que incluir necesariamente el socialismo? Impulsaremos reformas «para nuestro Estado» y mantendremos distancia del internacionalismo de ellos."

 #### 두 민족의 국가
 ############# 마코토
 GEM_focus_ended_1_C: "Proclamación del Gran Estado de Gehenna"
 GEM_focus_ended_1_C_desc: "Todas las facciones de Gehenna, antes divididas, han sido finalmente unificadas bajo una sola bandera. Abolimos el viejo orden del pasado y proclamamos ante todo Kivotos el nacimiento de un Estado poderoso y grandioso, el «Gran Estado de Gehenna», centrado en el Manmajeon. Este será el primer hito en el camino hacia nuestras grandes gestas."
 GEM_ruler_in_the_sky: "El gobernante en los cielos"
 GEM_ruler_in_the_sky_desc: "El verdadero gobernante no se ata a los asuntos triviales de la tierra, sino que, desde lo alto, señala el rumbo que debe seguir el Estado. Debemos divinizar la existencia de la presidenta y establecer una autoridad intocable, para que todos sigan su voluntad sin dudar. Su gobierno no será objeto de comprensión, sino de veneración."
 GEM_ten_thousand_demon_dictatorship: "Dictadura del Manmajeon"
 GEM_ten_thousand_demon_dictatorship_desc: "Para una administración estatal eficiente y una toma de decisiones rápida, se necesita un único y poderoso centro de gravedad. Es momento de eliminar cualquier posible disonancia dentro del Manmajeon y concentrar todo el poder en la presidenta, reuniendo todas las capacidades del Estado hacia un solo objetivo. Este es un proceso indispensable para lograr hazañas imparables."
 GEM_heir_of_thunder_emperor: "Heredera del Trono del Emperador del Trueno"
 GEM_heir_of_thunder_emperor_desc: "La autoridad de la presidenta ha trascendido ya los límites de lo humano y se ha convertido, como la del antiguo «Emperador del Trueno», en objeto de reverencia. Basándose en un carisma absoluto, se preparará una guerra total que supere los límites del Estado, y todo quedará listo para ser conquistado bajo su nombre. Su voluntad será la ley del país."
 GEM_supreme_ruler_walking_the_earth: "La suprema gobernante que camina sobre la tierra"
 GEM_supreme_ruler_walking_the_earth_desc: "Un gran líder no permanece únicamente sobre el estrado, sino que desciende directamente entre las masas para despertar su fervoroso apoyo. A través de grandes concentraciones y visitas de campo, debemos fortalecer el vínculo entre la presidenta y el pueblo, y hacer que la perciban como el eje del Estado y la encarnación de su propia voluntad. Un carisma poderoso se convierte en una base de gobierno más sólida que cualquier fuerza física."
 GEM_ten_thousand_demon_council: "Consejo del Manmajeon"
 GEM_ten_thousand_demon_council_desc: "Un gran líder necesita personas capaces que respalden su voluntad y asistan en los asuntos del Estado. Estableceremos el «Consejo del Manmajeon», compuesto por figuras clave del Manmajeon, para asegurar la estabilidad del gobierno y sentar las bases de un sistema de dominio más estructurado. Esto no es arbitrariedad, sino el inicio de un gobierno racional."
 GEM_ten_thousand_demon_council_tt: "Construye ferrocarriles de §Ynivel 1§! desde §Y[Root.Capital.GetName]§! hasta las §Ycapitales de los miembros de la facción§! accesibles por tierra."
 GEM_designer_of_all_demons: "El diseñador de todos los demonios"
 GEM_designer_of_all_demons_desc: "El Estado es como una enorme máquina. Rediseñaremos de la forma más eficiente posible todos los sistemas industriales, militares y administrativos del país. El líder no debe limitarse a gobernar, sino demostrar su valía como el gran diseñador que concibe y opera a la perfección la máquina llamada Estado."
 GEM_unification_of_all_gehenna_states: "Unificación de todos los estados de Gehenna"
 GEM_unification_of_all_gehenna_states_desc: "Los distintos distritos autónomos de Gehenna aún mantienen viejas costumbres y sistemas administrativos obsoletos. Para consolidar la autoridad del gobierno central y gestionar eficientemente el territorio, debemos unificar los sistemas administrativos de todas las regiones y construir una infraestructura integrada que complete la verdadera unificación."
 GEM_one_party_one_nation: "Un partido, una nación"
 GEM_one_party_one_nation_desc: "Todas las voces del Estado deben unificarse en una sola. Excluiremos a todas las fuerzas políticas ajenas al Manmajeon y estableceremos un sistema de partido único en el que la voluntad del partido sea la voluntad del Estado, asegurando la unidad ideológica. Las opiniones disidentes ya no serán toleradas; solo avanzaremos hacia un único objetivo."
 GEM_what_it_means_to_be_sovereign: "Lo que significa gobernar un Estado"
 GEM_what_it_means_to_be_sovereign_desc: "La verdadera soberanía no nace simplemente de oprimir al otro mediante la fuerza. Estableceremos una ideología de gobierno estatal y construiremos un sistema basado en el Estado de derecho para otorgar legitimidad a nuestro dominio. Este es el proceso necesario para ser reconocidos no como conquistadores temporales, sino como gobernantes eternos."

 ############# Satsuki
 GEM_focus_ended_2_C: "El futuro de la Academia Gehenna"
 GEM_focus_ended_2_C_desc: "El caos inicial ha sido contenido. Pero si mi método solo ha traído una estabilidad temporal, entonces todos estos esfuerzos carecen de sentido. La verdadera paz no debe mantenerse mediante un control externo, sino perdurar eternamente como parte intrínseca del propio sistema. Ahora debemos avanzar a la siguiente etapa que decidirá el futuro de Gehenna. Es el momento de encontrar la respuesta a cómo hacer que esta paz sea permanente."
 GEM_psychology_department_foundation: "Fundación del Departamento de Psicología"
 GEM_psychology_department_foundation_desc: "El control mental forzado solo acaba generando resistencia. La solución más fundamental reside en la educación. Al fundar el «Departamento de Psicología», haremos que todos los estudiantes aprendan de forma académica las causas del conflicto y los principios de la armonía. Llegarán a comprender su propia mente y a aprender a coexistir con los demás. Esto no es control, sino iluminación."
 GEM_satsuki_school_rules: "Reglamento escolar de Satsuki"
 GEM_satsuki_school_rules_desc: "La mente humana es extremadamente voluble. Lo que necesitan no son ideologías complejas, sino reglas claras y simples. El «Reglamento escolar de Satsuki» define el modelo de conducta más ideal que todos los estudiantes deben seguir. Con solo obedecer estas normas, podrán convertirse en miembros de una sociedad armoniosa sin angustia alguna. Aliviar el dolor de la elección: eso es la verdadera misericordia."
 GEM_advanced_nk_ultra_solution: "Solución NK Ultra avanzada"
 GEM_advanced_nk_ultra_solution_desc: "Las tecnologías del pasado eran burdas. Ahora podemos ajustar el inconsciente colectivo de la sociedad de una forma mucho más sofisticada y suave, hasta el punto de que nadie pueda percibirlo. Ya sea a través de la educación o de la tecnología, nuestras soluciones se infiltrarán en toda la sociedad y crearán una corriente imparable que nadie podrá resistir."
 GEM_gehenna_psychology_institute: "Instituto de Psicología de Gehenna"
 GEM_gehenna_psychology_institute_desc: "El Departamento de Psicología evoluciona y se sitúa ahora en la cúspide de todas las disciplinas de Gehenna como el «Instituto de Psicología de Gehenna». Su programa educativo va más allá de la simple transmisión de conocimientos: busca que los estudiantes comprendan la esencia de las estructuras psicológicas que conforman la sociedad y, finalmente, alcancen su propia «iluminación». Solo quienes se comprendan a sí mismos por completo a través de este proceso estarán capacitados para liderar esta academia pacífica."
 GEM_modern_solution: "Solución «moderna»"
 GEM_modern_solution_desc: "Las reglas por sí solas no pueden controlar por completo los impulsos más profundos del ser humano. Se necesita una solución más segura y permanente. Introduciremos tecnología neuroingenieril de vanguardia para desarrollar implantes neuronales que estabilicen las áreas del cerebro que generan conflictos. Esto no es violencia contra la mente. Es simplemente la «vacuna» más moderna para prevenir la enfermedad llamada caos."
 GEM_diligent_gehenna_citizen: "Ciudadano gehenna diligente"
 GEM_diligent_gehenna_citizen_desc: "Mirad. Ya no existen los estudiantes del pasado que desperdiciaban su tiempo en conflictos y vacilaciones. Todos están satisfechos con su papel y trabajan diligentemente por el desarrollo de la comunidad. Aquellos que han perdido su angustia interior representan la imagen más feliz, productiva e ideal del «ciudadano gehenna»."
 GEM_ordered_unconscious: "Inconsciente ordenado"
 GEM_ordered_unconscious_desc: "Nuestro objetivo va más allá del control del comportamiento consciente. Pretendemos grabar los conceptos de «armonía» y «orden» en lo más profundo del inconsciente de todos los miembros de la sociedad. Cuando ni siquiera en los sueños sea posible imaginar el conflicto, nuestra sociedad alcanzará por fin una estabilidad perfecta, inmune a cualquier impacto externo."
 GEM_inner_integrity: "Integridad interna"
 GEM_inner_integrity_desc: "Finalmente hemos alcanzado una etapa en la que los deseos individuales y los objetivos de la comunidad coinciden a la perfección. Los estudiantes ya no «obedecen» las reglas; todos sus pensamientos y acciones contribuyen de forma natural a la armonía social. Un estado en el que desaparece incluso la angustia sobre el bien y el mal, lo correcto y lo incorrecto: eso es la «integridad interna» perfecta."
 GEM_ark_nation: "Estado Arca"
 GEM_ark_nation_desc: "Hemos completado la única «arca» que flota en medio del mar del caos. Mientras el mundo exterior sigue sufriendo por el odio y la guerra, dentro de nuestro Estado solo existen la paz y el orden perfectos. Ahora nuestra misión es proteger firmemente esta arca y, algún día, llevar esta luz de salvación también al mundo exterior."
 GEM_preparation_for_future_war: "Preparativos para la guerra futura"
 GEM_preparation_for_future_war_desc: "Nuestra paz no hace sino estimular aún más el caos externo. Los bárbaros que no comprenden el orden intentarán algún día destruir nuestra arca. Por lo tanto, prepararnos para la guerra con el fin de proteger nuestra paz es el deber más sagrado. Esta guerra no será de conquista, sino una cruzada para salvaguardar la armonía."
 GEM_academy_secret_corps: "Cuerpo secreto de la academia"
 GEM_academy_secret_corps_desc: "Para proteger nuestros ideales, necesitamos la hoja más pura, una que no pueda ser corrompida por los propios ideales. El «Cuerpo secreto de la academia» estará compuesto únicamente por individuos que hayan alcanzado por completo la integridad interna. Sin emociones ni dudas, se moverán únicamente para eliminar cualquier elemento que amenace la estabilidad del Estado, como los guardianes más eficientes y despiadados."
 GEM_manifestation_of_unconscious: "Manifestación del inconsciente"
 GEM_manifestation_of_unconscious_desc: "La tecnología de implantes neuronales no se limita a mantener la estabilidad interna. Ahora podemos vincular todas las mentes conectadas en una única y gigantesca red, proyectando ese inconsciente unificado como una «fuerza» directa hacia el mundo exterior. Esto no es una simple guerra psicológica. Es la preparación para una guerra contra la caótica realidad externa, impulsada por nuestro orden interno perfecto."
 GEM_ordered_unconscious_tt: "Completa todas las decisiones §Y$GEM_diligent_gehenna_citizen_1$§! y §Y$GEM_diligent_gehenna_citizen_2$§!"
 ############# 이로하
 GEM_focus_ended_3_C: "La lucha por el idealismo, aunque nos rompan"
 GEM_focus_ended_3_C_desc: "La posición de los ciudadanos de origen alemán, asentada sobre el sistema federal creado por la primera presidenta de la Federación, Natsume Iroha, sigue siendo inestable. Trabajo forzado impuesto por capitalistas de Kivotos —ya ilegal pero aún vigente—, el desprecio de los estudiantes... Lucharemos para resolverlo todo."

 GEM_file_human_rights_commission: "Presentar una denuncia ante la Comisión de Derechos Humanos"
 GEM_file_human_rights_commission_desc: "La «zona gris» es el escenario de explotación laboral donde las empresas de Kivotos, esquivando la mirada del gobierno federal que busca un Estado pequeño, actúan a espaldas del mercado. Hasta ahora nadie ha podido frenarlo, pero nosotros lo sacaremos a la luz."

 GEM_demolish_gray_zone: "Demoler la zona gris"
 GEM_demolish_gray_zone_desc: "Toda explotación laboral debe terminar. La primera presidenta Natsume Iroha tampoco lo desearía, y como tras la revelación hemos conseguido más votos de simpatía de los ciudadanos y estudiantes de origen gehenna de lo esperado, toda esta explotación laboral llegará a su fin."
 GEM_demolish_gray_zone_flag: "§YEnfoque $GEM_demolish_gray_zone$§! completado"

 GEM_under_natsume_iroha_arrangement: "Bajo la disposición de Natsume Iroha"
 GEM_under_natsume_iroha_arrangement_desc: "Natsume Iroha... Es una figura realmente compleja. Algunos la llaman dictadora que dañó la libertad de la Academia Gehenna; otros, una pionera que devolvió la libertad a los alemanes; y otros la califican de liberal de laissez-faire que impulsa un gobierno pequeño. Pero. La razón por la que los alemanes hoy pueden sobrevivir esperando el sol de mañana, es gracias a su disposición."

 GEM_enact_equal_labor_law: "Ley de trabajo igualitario"
 GEM_enact_equal_labor_law_desc: "El empleo en igualdad de condiciones para los gehenna y los alemanes, así como para las diversas minorías étnicas dentro de la federación, aún no se ha materializado. Reuniendo la fuerza de las organizaciones políticas alemanas, introduciremos desde el nivel de los gobiernos estatales el derecho laboral igualitario."
 GEM_enact_equal_labor_law_flag: "§YEnfoque $GEM_enact_equal_labor_law$§! completado"

 GEM_pass_ethnic_quota_system: "Aprobar el sistema de cuotas étnicas"
 GEM_pass_ethnic_quota_system_desc: "Para garantizar el empleo igualitario de todas las etnias dentro de Gehenna, deben aplicarse cuotas en diversos ámbitos de la sociedad. Todas las organizaciones civiles alemanas volcarán todos sus esfuerzos para que el proyecto de ley sea aprobado."

 GEM_federal_republic_of_all_germans: "La Federación de todos los alemanes"
 GEM_federal_republic_of_all_germans_desc: "¡Alemania, Alemania por encima de todo, por encima de todo en el mundo!\nSi, para la defensa y la protección, permanecemos siempre unidos como hermanos,\n¡desde el Mosa hasta el Memel, desde el Etsch hasta el Belt!\n\n-Canción de los alemanes, 1.ª estrofa (extracto)"

 GEM_build_all_german_memorial: "Construcción del monumento conmemorativo panalemán"
 GEM_build_all_german_memorial_desc: "Con la cooperación de innumerables organizaciones civiles y el patrocinio de toda clase de estratos, construiremos un monumento con los nombres de todos los alemanes que fueron víctimas de la xenofobia."
 GEM_build_all_german_memorial_idea: "Construcción del monumento conmemorativo panalemán"
 GEM_build_all_german_memorial_idea_tt: "Este espíritu nacional se eliminará al completar el enfoque «§Y$GEM_build_all_german_memorial$§!»."
 GEM_build_all_german_memorial_buff_idea: "Monumento conmemorativo panalemán"
 GEM_build_all_german_memorial_buff_idea_desc: "Recordad,\ncuando habléis de nuestra debilidad,\naquel tiempo sombrío del que os librasteis,\njunto con nosotros.\n-Bertolt Brecht, <A los descendientes>"

 ############# Chiaki
 GEM_focus_ended_4_C: "La era de Chiaki"
 GEM_focus_ended_4_C_desc: "El caos del período de transición ha terminado. La secretaria Motomiya Chiaki deja de ser una colaboradora en la sombra y comienza su marcha como líder nacional en primera línea. Bajo su mando, el Estado funcionará dinámicamente como una rotativa que no se detiene, y solo la visión que ella apruebe será la única dirección de este país. Se inaugura, por fin, la era de Chiaki."

 GEM_journalism_department_expansion: "Expansión del Departamento de Periodismo de Gehenna"
 GEM_journalism_department_expansion_desc: "En la guerra moderna, la información es un recurso tan importante como las balas. La secretaria Chiaki decidió elevar el club de prensa de Gehenna a una agencia de inteligencia a escala nacional y construir una gigantesca red mediática estatal, más allá de un simple periódico escolar. Ahora, toda la organización administrativa del Estado se moverá con agilidad como una redacción que recopila y procesa información, asegurando una capacidad precisa de control informativo."

 GEM_cultural_consensus: "Consenso cultural"
 GEM_cultural_consensus_desc: "Para resolver el choque heterogéneo entre la desenfrenada libertad de Gehenna y la rigurosidad alemana, el Estado intenta una «edición cultural» a través de los medios. La secretaria Chiaki enfatiza los denominadores comunes de ambas culturas y excluye de la vista pública los elementos de conflicto, induciendo un consenso natural en toda la sociedad. Esto no es una unidad impuesta, sino una fusión cultural refinada que se forma mediante una puesta en escena sofisticada."

 GEM_world_in_the_shutter: "El mundo dentro del obturador"
 GEM_world_in_the_shutter_desc: "La secretaria Chiaki cree que gobernar la percepción es el verdadero gobierno, más que la conquista física. En lugar de gobernar el mundo tal como es, eligió presentar al público una «realidad editada» reinterpretada a través del lente. La realidad caótica se ordena dentro del encuadre, y solo las imágenes aprobadas por el Estado serán aceptadas como verdad por las masas. El mundo quedará registrado tal como aparece en el visor."

 GEM_propaganda_war: "Guerra de propaganda"
 GEM_propaganda_war_desc: "Los medios no son solo un instrumento de registro, sino un arma para golpear al enemigo. La secretaria Chiaki ha movilizado toda la capacidad mediática disponible para iniciar una guerra psicológica a gran escala, atacando las ideas del enemigo y elevando la voluntad de los nuestros. La frontera de la verdad se vuelve difusa y solo sobrevive el mensaje vencedor. Nuestra propaganda, más allá de las fronteras, será el bombardeo más poderoso para grabar la superioridad de nuestro sistema."

 GEM_put_down_the_camera: "Dejar la cámara"
 GEM_put_down_the_camera_desc: "Con la sola perspectiva de un observador no se puede conducir un país. La secretaria Chiaki salió de detrás del visor y tomó la decisión de intervenir directamente en el flujo de la historia. Ya no será una cronista, sino una gobernante que cambiará la realidad mediante órdenes administrativas directas y ejecución de políticas. Un liderazgo sustantivo, más allá de la imagen escenificada, conducirá al Estado."

 GEM_chiaki_reform_C: "Reforma Chiaki"
 GEM_chiaki_reform_C_desc: "Comienza una reforma de alta intensidad sobre todo el sistema estatal. La secretaria Chiaki derribó la burocracia ineficiente e introdujo un nuevo sistema administrativo que se mueve con agilidad, como si compitiera por primicias. Los complejos procedimientos de aprobación se omiten sin miramientos y solo el rendimiento y la velocidad se convierten en el criterio de supervivencia de la organización. Esta reforma transformará al Estado en la organización más rápida y eficiente."

 GEM_manmajeon_chairmanship_separation_C: "Separación del cargo de presidenta del Manmajeon"
 GEM_manmajeon_chairmanship_separation_C_desc: "A medida que las responsabilidades como jefa de Estado se vuelven más pesadas, Motomiya Chiaki ya no puede seguir atada al título de «presidenta del consejo estudiantil de Gehenna». Por ello, toma la audaz decisión de separar el cargo de presidenta del Manmajeon del liderazgo estatal y lanzarse a toda velocidad tras la exclusiva de mayor escala: la «gestión del Estado». Su trayectoria, iniciada en el puesto de secretaria y culminada en la cima del país, entra ahora en una nueva fase."

 GEM_establishment_of_gehenna_republic: "Establecimiento de la República de Gehenna"
 GEM_establishment_of_gehenna_republic_desc: "Finalmente se ha proclamado la fundación de la República de Gehenna. Este nuevo Estado no se levanta sobre una autoridad antigua ni sobre grupos cerrados, sino sobre la información, la comunicación y la visión de la secretaria Chiaki. Los ciudadanos no son definidos como súbditos pasivos, sino como fervorosos suscriptores y participantes del medio llamado Estado. Esta república libre y vibrante presentará al mundo un nuevo modelo de Estado."

 GEM_national_editor_chiaki: "Chiaki, editora nacional"
 GEM_national_editor_chiaki_desc: "Motomiya Chiaki ha ascendido más allá de ser una simple líder y se ha convertido en la única «editora nacional» que decide el destino del país. Según su dictamen, se editan y corrigen las políticas estatales, la vida del pueblo y el curso de la historia. La realidad es su papel de manuscrito, y el mundo fluirá en la dirección que ella pretenda. Este es el trabajo final de corrección para crear el mundo más perfecto."

 GEM_national_editor_C4_tt: "Este enfoque cambiará a un árbol de enfoques completo al completar §Y$GEM_national_editor_chiaki$§!."
 GEM_national_editor_C4_tooltip: "§g§Y$GEM_world_in_the_shutter$§! y §Y$GEM_put_down_the_camera$§! también cambiarán el árbol de enfoques según cuál de §Y$GEM_populist_leader$§! o §Y$GEM_corporate_tax_deduction$§! se haya completado.§!"
 GEM_national_editor_C4: "???"

 GEM_national_editor_C4_1: "«Populista»"
 GEM_national_editor_C4_1_desc: "La secretaria Chiaki ha concebido el Estado como un gran escenario y al pueblo como público. Empuja los problemas complejos y sombríos de la realidad fuera del encuadre mediático y enfatiza únicamente imágenes vistosas y estimulantes capaces de enardecer a las masas. En la brillante fantasía que derraman los medios, el pueblo olvidará el dolor de la realidad y enviará un apoyo ciego a su líder."

 GEM_national_editor_C4_2: "Reformadora administrativa"
 GEM_national_editor_C4_2_desc: "La secretaria Chiaki dejó el bolígrafo y saltó al terreno. Rompe el muro asfixiante de la burocracia y se mete directamente en la vida del pueblo para impulsar reformas radicales que reflejen sus voces en las políticas. Sus órdenes improvisadas y rompedoras sacuden el orden existente, pero las masas depositarán una confianza absoluta en una líder que actúa y responde de inmediato a sus problemas."

 GEM_national_editor_C4_3: "Participación de los grandes conglomerados en el gobierno"
 GEM_national_editor_C4_3_desc: "Para envolver al Estado como un «Sueño Gehenna» refinado y próspero, la secretaria Chiaki invitó a los grandes conglomerados como socios de gobierno. En este paisaje perfecto de rascacielos que forman bosques y capital que desborda, empresarios y élites administran el Estado eficientemente bajo la dirección de Chiaki. Las historias de las sombras se editan, pero la prosperidad visible del país brillará con un fulgor sin precedentes."

 GEM_national_editor_C4_4: "Responsabilidad social corporativa"
 GEM_national_editor_C4_4_desc: "La secretaria Chiaki mira la realidad de frente con una frialdad lúcida. Incentiva el crecimiento empresarial, pero ejerce un fuerte control para que las ganancias obtenidas fluyan hacia el conjunto de la sociedad. A las empresas se les otorga una pesada responsabilidad social como piezas clave del gran proyecto llamado Estado. Este es un modelo estatal racional y calculado, destinado a controlar la codicia del capital y realizar una distribución eficiente."

