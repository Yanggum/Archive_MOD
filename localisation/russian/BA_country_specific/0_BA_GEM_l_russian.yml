 #### Enfoques bajo Makoto
 ###### Normal
 GEM_focus_ended_1O_endfocus: "La academia más prestigiosa del mundo"
 GEM_focus_ended_1O_endfocus_desc: "La academia más prestigiosa del mundo"
 GEM_the_great_usurper: "La gran usurpadora"
 GEM_the_great_usurper_desc: "La presidenta de nuestra academia debería ser, por derecho, la gobernante de todas las academias. ¡En medio de una gran guerra, arrebatamos a todos sus presidentes estudiantiles!"
 GEM_war_materiel_system: "Sistema de suministros de guerra"
 GEM_war_materiel_system_desc: "Para una guerra mundial, debemos contar con un sistema mundial. Construiremos un Estado de guerra que se mueva eternamente, saquearemos y anexaremos a todos los países vecinos. ¿Qué duda podría ser necesaria? Lo hicimos porque podíamos. Y podremos hacer aún más."
 GEM_prefect_hegemony_raid: "Arrebatar la hegemonía del Comité de Disciplina"
 GEM_prefect_hegemony_raid_desc: "La unificación de Gehenna ya se ha logrado, y el Comité de Disciplina finalmente se arrodilló bajo nuestra espada.\n\n¡La verdadera unificación de Gehenna aún no ha terminado!"
 GEM_legacy_of_luxembourg: "Legado de Luxemburgo"
 GEM_legacy_of_luxembourg_desc: "El experimento político de Luxemburgo ha terminado y su incorporación como estado extragehenna se ha completado.\n\nAhora absorberemos todo lo que les pertenecía."
 GEM_secure_trinity_host: "Asegurar el puesto de anfitrión de Trinity"
 GEM_secure_trinity_host_desc: "El conflicto entre Trinity y el Manmajeon ha terminado por completo, y para extinguir incluso los conflictos futuros, [ROOT.GetLeader] debe convertirse en el anfitrión de Trinity.\n\n¡Nuestro propio Tratado Edén se ha completado!"
 GEM_declare_student_council_president: "Proclamar a la presidenta del Consejo General de Estudiantes"
 GEM_declare_student_council_president_desc: "Las hojas han caído y el Consejo General de Estudiantes ha caído en nuestras manos. Por supuesto, ¿acaso no es justo que el competente consejo estudiantil de Gehenna reemplace a su inepta dirigencia, absorba toda la legitimidad de Kivotos y lo anexe todo?\n\n¡Viva la presidenta del Consejo General de Estudiantes, [ROOT.GetLeader]!"
 GEM_secure_millennium_president: "Asegurar al presidente de Millennium"
 GEM_secure_millennium_president_desc: "Millennium, otra de las tres grandes academias, también cayó bajo nuestra espada. Por supuesto, lo absorberemos todo, y su tecnología será utilizada para la guerra.\n\n¡Ahora el seminario lo organizamos nosotros!"
 GEM_king_of_kings: "Rey de reyes"
 GEM_king_of_kings_desc: "La presidenta del Manmajeon y legítima unificadora de Gehenna, gobernante de Luxemburgo, anfitriona de Trinity, presidente de Millennium, presidenta del Consejo General de Estudiantes de Kivotos, presidenta estudiantil de todos los estudiantes y gobernante de toda Europa: [ROOT.GetLeader]."
