 GEM_crossing_the_atlantic: "Cruzando el Atlántico"
 GEM_crossing_the_atlantic_desc: "Hemos derrotado a todos los rivales del continente y los hemos puesto bajo nuestro dominio.\nAhora, para aplastar la amenaza más allá del Atlántico e imponer nuestra paz al mundo entero, debemos volver a concentrarnos en la producción que dará nacimiento a una gran armada."
 trigger_BA_infantry_equipment_k_tt: "Más de §Y$RIGHT|0$000§! unidades de equipo de infantería en el ejército"
 GEM_crossing_the_atlantic_dockyards_tt: "En los estados costeros de Europa controlados por completo por [ROOT.GetNameWithFlag], se añaden §Y2 $dockyard$§! y se elimina §Y1 $arms_factory$§! por cada astillero naval.\n(El efecto se aplica priorizando estados costeros con al menos un $arms_factory$, hasta un máximo de §Y10§! estados.)"

 GEM_hyakkiyagyo_invasion: "Atacar a Hyakkiyako"
 GEM_influence_the_hyakkiyagyo: "Agitación proalemana en Hyakkiyako"
 GEM_expand_claims_in_baltic: "Ampliar reclamaciones sobre el Báltico"
 GEM_expand_claims_in_baltic_desc: "Históricamente, en el mar Báltico vive un número considerable de inmigrantes germanos.\nAhora que Gehenna controla la hegemonía alemana y actúa como el principal estado representante de la mayoría germana, traerlos de vuelta a su patria es, tanto para ellos como para nosotras, el mejor interés posible."

