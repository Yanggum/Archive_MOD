 GEH_prepare_for_the_next_blockade_3_desc: "A medida que la amenaza de una gran guerra se vuelve visible, numerosas estudiantes de Gehenna se ofrecen como voluntarias en frentes de trabajo o forman por sí mismas fuerzas armadas, y por fin innumerables centros industriales están operando como es debido."
