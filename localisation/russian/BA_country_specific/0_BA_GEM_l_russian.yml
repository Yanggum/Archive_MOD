 GEH_separation_law_1: "Proyecto de ley de separación de los alemanes"
 GEH_separation_law_tt: "§RMientras exista la ley de separación, el Estado de los alemanes no puede alcanzar la etapa §5apoyado§!.§!"

 GEH_german_nationalism_issue: "El Estado de los alemanes"
 GEH_german_nationalism_issue_desc: "Aunque una cantidad considerable de estudiantes cruzó hacia la región alemana a causa del Gran Cataclismo, seguimos siendo minoría. Gracias a las capacidades físicas de las estudiantes hemos repelido los ataques de los alemanes y continuado la vida académica sin mayores problemas; sin embargo, si ellos comienzan a desarrollar una capacidad de resistencia organizada, podría convertirse en una amenaza grave.\n\nPara obtener el apoyo de los alemanes, debemos enfatizar nuestra homogeneidad cultural o respetar sus costumbres culturales; además, esforzarnos de manera sostenida para que ambas esferas culturales lleguen a ser verdaderamente una sola, y finalmente lograr que todos los alemanes reconozcan que nosotros podemos convertirnos en el Estado que representa a Alemania."

