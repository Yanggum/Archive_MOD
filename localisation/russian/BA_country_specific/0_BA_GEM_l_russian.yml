 GEH_nego_wehrmacht_decisions:0 "Negociar con el Ejército de Defensa"
 GEH_nego_wehrmacht_decisions_desc:0 "El Ejército de Defensa es el instrumento militar del grupo conocido como Alemania. Cuando desembarcamos en suelo alemán, se enfrentaron a nosotros y empezaron a mostrar hostilidad, llegando incluso a herir a nuestras estudiantes y provocar diversos incidentes. Sin embargo, si negociamos bien con el Ejército de Defensa y encontramos puntos en común, podremos establecer una relación de coexistencia."

 GEH_State_government_dismantlement_work_category: "Gobiernos estatales alemanes de la Academia Gehenna"
 GEH_State_government_dismantlement_work_category_desc: "Con un poco de fuerza, podremos anexionar los gobiernos estatales alemanes para reducir la carga administrativa del Comité de Disciplina y asegurar con facilidad el control sobre los gobiernos locales."
 GEH_state_government_dismantlement_work: "Anexar gobierno estatal"

 GEH_war_defence_category: "Planificación operativa"
 GEH_war_defence_category_desc: "\n\n£GFX_GEH_eden_war_decision\n\n\n\n\nDesde el pasado hasta el presente, la mala sangre entre Gehenna y Trinity no ha cesado. Bajo el liderazgo del presidente del Consejo General Estudiantil, se planeaba firmar el Tratado de Edén, pero al llegar a esta dimensión ese plan quedó pospuesto indefinidamente. El reciente caso de desaparición del presidente del Consejo General convirtió el Tratado de Edén en algo inexistente, y, debido al golpe de Estado ocurrido en Trinity, el abismo entre Gehenna y Trinity se ha profundizado.\n\nUna chispa bastará para incendiarlo todo."

