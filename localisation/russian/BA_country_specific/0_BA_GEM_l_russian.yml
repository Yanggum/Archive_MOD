 GEH_present_situation:0 "Evaluar la situación actual"
 GEH_present_situation_desc:0 "Nadie parece haberse dado cuenta todavía de lo que ocurre en esta situación repentina. Entonces, lo más urgente será entender primero qué está pasando."

 GEH_nego_with_wehrmacht:0 "Negociar con el Ejército de Defensa Nacional"
 GEH_nego_with_wehrmacht_desc:0 "Hemos recibido una propuesta de negociación por parte del Ejército de Defensa Nacional, una fuerza armada alemana que existía en este mundo, en la tierra donde ahora estamos parados. Debemos aceptarla y, coordinándonos con los locales, superar esta crisis."

 GEH_nego_continue:0 "Continuar la negociación"
 GEH_nego_continue_desc:0 "El Pandemonium Society está llevando muy bien las conversaciones. Sigamos negociando tal como vamos."

 GEH_dark_nego:0 "Operar en las sombras"
 GEH_dark_nego_desc:0 "El Pandemonium Society es un grupo incompetente. El Ejército de Defensa Nacional seguramente piense que negociar con el Comité de Disciplina es más provechoso que negociar con ellos. Contactémoslos directamente."

 GEH_nego_settlement:0 "Cerrar el acuerdo"
 GEH_nego_settlement_desc:0 "La negociación con el Ejército de Defensa Nacional fue un éxito. Sea la negociación que haya sido."

 GEH_establish_governance:0 "Consolidar el poder"
 GEH_establish_governance_desc:0 "La negativa unilateral del Comité de Disciplina es un acto claro de desprecio hacia nuestro Pandemonium Society. Es hora de dejarles bien claro quién es el dueño del poder."

 GEH_establish_new_government:0 "Establecer un nuevo gobierno"
 GEH_establish_new_government_desc:0 "Ya echamos al líder incompetente. Ahora es momento de formar un nuevo gobierno."

 GEH_end_of_crisis:0 "Fin de la crisis"
 GEH_end_of_crisis_desc:0 "Por ahora hemos superado la mayor parte de la crisis, así que ya tenemos margen para mirar hacia otros frentes."

 GEH_look_situaition:0 "Enfrentar la realidad"
 GEH_look_situaition_desc:0 "Aunque el conflicto interno se resolvió en cierta medida, la situación internacional no nos es precisamente favorable. Y aun ese conflicto “resuelto” sigue existiendo. No debemos apartar la mirada: tenemos que encarar la realidad."

 GEH_look_inside:0 "Mirar hacia dentro"
 GEH_look_inside_desc:0 "El conflicto interno continúa, y los problemas por resolver se acumulan. Debemos mirar de frente esa realidad."

 GEH_look_outward:0 "Mirar hacia fuera"
 GEH_look_outward_desc:0 "Nuestra posición es mala: estamos rodeados por posibles fuerzas hostiles en las cuatro direcciones. Hay que asumirlo y abrir una discusión profunda sobre nuestra política exterior."

 GEH_one_step_closer:0 "Acercarnos primero"
 GEH_one_step_closer_desc:0 "Si nosotros abrimos el corazón primero y tratamos de derretir este ambiente como de hielo delgado, seguro que ellos también cooperarán con sinceridad. Probablemente."

 GEH_clear_method:0 "El método limpio y seguro"
 GEH_clear_method_desc:0 "La política internacional es la selva, y en la selva el método para sobrevivir ya está probado: actuar estrictamente por el interés nacional. Tenemos fuerza, y debemos usarla de forma activa."


 GEH_perfactteam_lute:0 "¡Comienza la batalla!"
 GEH_perfactteam_lute_desc:0 "El Pandemonium Society y el Comité de Disciplina finalmente han cruzado el punto de no retorno.\nCon esta pelea quedará claro quién es el verdadero dueño de Gehenna."

 GEH_nego_countiune_manmajun:0 "Se respira el ambiente de guerra"
 GEH_nego_countiune_manmajun_desc:0 "Con el inicio de las negociaciones parecía que llegaría la paz con el Ejército de Defensa Nacional, pero la situación está avanzando, poco a poco, en una dirección distinta a la que el Pandemonium Society esperaba.\nPensándolo bien, se decía que la tierra donde hoy está Gehenna era originalmente territorio alemán.\n¿De verdad se quedarán quietos si, en la práctica, les arrebataron su tierra?"

 GEH_dark_nego_hina:0 "Preparar un golpe preventivo"
 GEH_dark_nego_hina_desc:0 "El Pandemonium Society siempre consideró al Comité de Disciplina como una espina en el ojo.\nAhora que han comenzado a negociar con el Ejército de Defensa Nacional, no sabemos qué puede venirse.\nDebemos prepararnos primero."

 GEH_nego_settlement_new:0 "Fin de la negociación"
 GEH_nego_settlement_new_desc:0 "Las negociaciones entre la Academia Gehenna y el Ejército de Defensa Nacional alemán han concluido.\nAunque durante el proceso estallaron varios incidentes.\n¿Qué resultado nos estará esperando?"

 GEH_manmajun_takeover:0 "Consolidar el poder"
 GEH_manmajun_takeover_desc:0 "La negativa unilateral del Comité de Disciplina es un acto claro de desprecio hacia nuestro Pandemonium Society. Es hora de dejarles bien claro quién es el dueño del poder."


 ### Eventos de Gehenna ###

 GEM_balance_of_power_event.1.t: "¡Destitución de [ROOT.GetLeader], presidenta del Pandemonium Society!"
 GEM_balance_of_power_event.1.desc: "Hoy se ha confirmado que [ROOT.GetLeader] no logró asegurar los votos necesarios para sobrevivir a la moción de censura solicitada dentro del Pandemonium Society.\n\nSu apoyo se redujo drásticamente en las nuevas elecciones de presidenta del consejo estudiantil, celebradas en medio de dudas sobre el liderazgo del Pandemonium Society, debido a que [ROOT.GetLeader.GetHerHis] rompió sus promesas. Ese error político se convirtió en una crisis, y ahora [ROOT.GetLeader.GetSheHe] ha terminado como chivo expiatorio."
 GEM_balance_of_power_event.1.a: "Hanuma Makoto aún tiene cosas por hacer."
 GEM_balance_of_power_event.1.b: "Kyogoku Satsuki es una senpai confiable."
 GEM_balance_of_power_event.1.c: "Natsume Iroha le es útil al Pandemonium Society."
 GEM_balance_of_power_event.1.d: "¡Motomiya Chiaki tiene ambición!"

 GEM_balance_of_power_event.2.t: "Una presidenta que aún goza de confianza"
 GEM_balance_of_power_event.2.desc: "La moción de censura que estaba prevista hoy dentro del Pandemonium Society… por alguna razón, terminó antes incluso de empezar. Quienes exigían la votación parecen ni siquiera recordar por qué tuvieron una idea tan tonta, y todas las estudiantes confían de manera absoluta en el liderazgo de Kyogoku Satsuki, sin la menor duda.\n\nLa oposición a [ROOT.GetLeader] parece no haber existido desde el principio. Como si fuera la única verdad del mundo, todos creen que siempre fue así, “desde el inicio”. No hubo confusión. Solo una certeza silenciosa llenando por completo el Pandemonium Society."
 GEM_balance_of_power_event.2.a: "¿Yo… estaba confundida…?"

 GEM_balance_of_power_event.3.t: "Un reemplazo natural"
 GEM_balance_of_power_event.3.desc: "La posición de [ROOT.GetLeader], presidenta del Pandemonium Society, parecía sólida. Al menos, hasta esta mañana. Las estudiantes que caminaban por los pasillos lo comprendieron de pronto: ¿por qué estábamos siguiendo a [ROOT.GetLeader]? ¿Acaso la presidenta del consejo estudiantil de Gehenna no había sido Kyogoku Satsuki desde el principio?\n\nLa duda se convirtió en certeza en un instante. [ROOT.GetLeader] ya no parece más que una estudiante común, y todas las miradas se dirigen de forma natural hacia la verdadera líder, Kyogoku Satsuki. Como si estuvieran enderezando un botón mal abrochado desde hace mucho, todo parece haber vuelto a su lugar."
 GEM_balance_of_power_event.3.a: "Ahora sí, todo se siente correcto."

 GEM_balance_of_power_event.101.t: "La decisión de la academia más grandiosa"
 GEM_balance_of_power_event.101.desc: "Hasta ahora, la Academia Gehenna solo había recibido el odio de Trinity y el desprecio de Millennium y del Consejo Estudiantil General, tachada de ser una academia llena únicamente de caos. Pero a partir de hoy, será distinto.\n\nHoy a las 8 p. m., la presidenta [ROOT.GetLeader] aprobó desde el podio un proyecto de ley que apelaba a un “avance hacia la academia más grandiosa”. ¡Gehenna debe cambiar en todos los aspectos! ¡Es indudable que Gehenna está destinada a recuperar su antigua gloria y a gobernar toda Kivotos!\n\nY así, el nuevo orden de Gehenna se extenderá hacia el mundo. Al final de un gran camino, sin duda, quedará un gran resultado. Bajo el gobierno de [ROOT.GetLeader.GetHerHis], ya está en marcha una reorganización militar total y una orden de movilización estudiantil para aplastar a todas las academias."
 GEM_balance_of_power_event.101.a: "¡Lo dominaremos todo!"

 GEM_balance_of_power_event.102.t: "Ilustración"
 GEM_balance_of_power_event.102.desc: "Los burócratas de la Academia Gehenna, desde hace algún tiempo, buscan la paz y actúan para reducir el caos, sometiéndose al gobierno del Pandemonium Society en lugar de chocar entre sí.\n\nPor supuesto, eso debe ser gracias al excelente gobierno de nuestra presidenta, [ROOT.GetLeader]. Si todos lo creen y lo siguen, se hará realidad. La presidenta [ROOT.GetLeader] promulgó una nueva ley y recitó con calma un discurso: Gehenna renacerá ahora en la benevolencia y la cooperación.\n\nLas estudiantes y civiles comunes sienten extrañeza ante el cambio *radical* de la cultura y la sociedad… pero esa duda se extinguirá. [ROOT.GetLeader.GetHerHis] te está observando. Siempre. En cualquier lugar."
 GEM_balance_of_power_event.102.a: "Y así, todo caos desapareció."

 GEM_balance_of_power_event.103.t: "Constitución de los Estados Unidos de Gehenna"
 GEM_balance_of_power_event.103.desc: "El pueblo de nuestra federación establece la Constitución de los Estados Unidos de Gehenna con el fin de cimentar una fusión moderada de culturas y una justicia común, y de garantizar la defensa colectiva de toda Gehenna.\n\n\n1. Los Estados Unidos de Gehenna son una república federal. Las decisiones se toman a través del Congreso Federal, compuesto por Senado y Cámara de Representantes.\n\n2. Los Estados Unidos de Gehenna heredan la forma de Estado de la antigua Academia Gehenna y del Estado Alemán.\n\n......"
 GEM_balance_of_power_event.103.a: "Da fruto."

 GEM_balance_of_power_event.104.t: "Proclamación del nuevo sistema"
 GEM_balance_of_power_event.104.desc: "Se han promulgado las nuevas reglas escolares de Gehenna. La Secretaría, que ahora será un cargo simultáneo con la Presidencia, cumplirá el papel del centro administrativo que antes tenía el gobierno central.\n\nMuchos sienten dudas ante los cambios de Gehenna, pero cubriremos esas dudas con innumerables medios, periódicos y transmisiones.\n\nLa nueva administración de Gehenna se ha establecido, y ya empezó a moverse. Comienza el gobierno de la Secretaria [ROOT.GetLeader]."
 GEM_balance_of_power_event.104.a: "¡Viva la Secretaría!"


 GEM_news.1.t: "La influencia de Alemania en [HYA.GetNameDef]"
 GEM_news.1.desc: "En cuanto a la cordialidad reciente entre países dentro de la “esfera de influencia alemana”, hoy, en un discurso de [From.GetLeader], [From.GetName] anunció su compromiso con la cooperación política y diplomática con [HYA.GetNameDef].\n\nCon una población germanoparlante considerable, [HYA.GetNameDef] fue elegido como socio natural para los intereses [From.GetAdjective].\n\nAunque la situación es incierta, [HYA.GetNameDef] parece dispuesto a cooperar y, al menos, sus fronteras quedan garantizadas como seguras frente a las ambiciones territoriales de [GEM.GetNameDef]."
 GEM_news.1.a: "La amistad con Gehenna es mejor que ser gobernados por Gehenna."
 GEM_news.1.b: "Hyakkiyako ahora está con Gehenna."
 GEM_news.1.c: "¿Paz en nuestro tiempo?"

 GEM_news.2.t: "Declaración de dominio europeo por parte de [GEM.GetNameDefCap]"
 GEM_news.2.desc: "[GEM.GetLeader] de [GEM.GetNameDef] anunció un plan ambicioso para dominar toda Kivotos y construir la hegemonía [GEM.GetAdjective] en el continente. Declararon que es un derecho innato de las nuevas estudiantes de Gehenna y que jamás volverán a arrodillarse ante potencias extranjeras.\n\nTodas las fábricas militares de la antigua Gehenna están funcionando bajo el nuevo plan, y se ha activado una movilización hacia todas las estudiantes. Es evidente que se acerca una gran guerra."
 GEM_news.2.a: "¡Hay que aplastarlos!"
 GEM_news.2.b: "¡El mundo es nuestro!"

 GEM_news.3.t: "¡Un gobierno espantoso dentro de [GEM.GetNameDefCap]!"
 GEM_news.3.desc: "Hasta ayer, [GEM.GetLeader] de [GEM.GetNameDef] era considerado un líder competente. Sin embargo, según los reportes que no dejan de salir, la actividad de nuevas instituciones y múltiples materiales verificados, se ha revelado que la presidenta [GEM.GetLeader] ha estado llevando a cabo experimentos continuos de lavado de cerebro contra burócratas, capitalistas y una enorme parte de la población de Gehenna.\n\nYa ni intentan ocultarlo. Declaran abiertamente que consolidarán el “gobierno estable” [GEM.GetAdjective], lo cual marca el fin definitivo de la antigua Academia Gehenna."
 GEM_news.3.a: "Oh… Dios mío."
 GEM_news.3.b: "Ese periódico jamás se publicó en Gehenna."

 GEM_news.4.t: "Proclamación de los Estados Unidos de Gehenna y Alemania"
 GEM_news.4.desc: "[GEM.GetLeader] de [GEM.GetNameDef] asumió el recién creado cargo de Presidenta Federal junto con una reforma constitucional. La constitución, que declara heredar la forma de Estado de Gehenna y de Alemania, es un gran punto de inflexión porque establece de forma democrática un federalismo explícito entre ambos mundos.\n\nNo es que no hayan existido intentos similares en países pequeños, pero es la primera vez que un poder del tamaño de una de las tres grandes academias —como Gehenna— intenta un cambio así."
 GEM_news.4.a: "Observémoslos."
 GEM_news.4.b: "¡Vivan los Estados Unidos!"

 GEM_news.5.t: "La Noche de las Rosas"
 GEM_news.5.desc: "Toda la federación está conmocionada. Anoche, las fuerzas federales de seguridad iniciaron una operación nacional y arrestaron a cientos de figuras clave del nacionalismo. En una rueda de prensa de emergencia, el portavoz del gobierno anunció que “se frustró una conspiración golpista que buscaba derrocar el sistema multinacional”.\n\nEl gobierno bautizó la operación como “La Noche de las Rosas”. La explicación oficial es: “Para cuidar un jardín armonioso, hay que arrancar la maleza espinosa llamada odio”.\n\nCon esta purga, todas las fuerzas nacionalistas opositoras —incluyendo a los duros del partido nazi— han sido desmanteladas. Ya no queda nadie capaz de desafiar el poder de la presidenta Natsume Iroha, y un silencio pesado se siente en las calles."
 GEM_news.5.a: "Fue un sacrificio inevitable por el orden."
 GEM_news.5.b: "Resolvieron la purga con otra purga."

 GEM_news.6.t: "Todos los ríos desembocan en el mar"
 GEM_news.6.desc: "Hoy, la política de la federación entró en una nueva era. Todos los partidos gehenna y los partidos alemanes no nazis —incluyendo al Pandemonium Society, el Partido Comunista, el Socialdemócrata y el Partido de Centro— declararon una fusión histórica, integrándose en un solo “Partido Social Popular Germánico”.\n\nUn ex miembro del Pandemonium Society, elegido como primer líder del partido, declaró que fue “una decisión para terminar las luchas internas desgastantes y concentrar todas las capacidades del Estado en una sola”. Con esto, la política partidista libre dentro de la federación prácticamente llegó a su fin.\n\nComunistas y conservadores que quizá alguna vez se apuntaron con armas, ahora están lado a lado bajo una misma bandera. La diversidad política fue sacrificada bajo el gran objetivo de la “unidad nacional”. Ahora, en la federación solo existe un partido gobernante gigantesco… y una oposición frente a él."
 GEM_news.6.a: "La división significa derrota."
 GEM_news.6.b: "¿Una lucha desesperada… o simplemente dictadura?"

 GEM_news.7.t: "Fundación de [FROM.GetName]"
 GEM_news.7.desc: "No pasó mucho desde que el mundo se horrorizó por el plan de lavado de cerebro masivo de la presidenta [FROM.GetLeader], pero su locura ya ha empezado a retorcer incluso la realidad.\n\nEl mal presentimiento que se respiraba desde que el Pandemonium Society tomó Alemania se convirtió en terror tras la revelación del “Proyecto NK Ultra”. Y hoy, la presidenta [FROM.GetLeader] volvió ese terror realidad: desechó incluso el nombre del país “Alemania” y proclamó la reconstrucción de “Thule”, el Estado mítico de la mitología aria.\n\nSe han detectado indicios de que empezó a inyectar por la fuerza en la mente de toda la población la “antigua mitología aria”, aparentemente vinculada al ocultismo nazi. El antiguo territorio alemán se ha transformado en un “Estado mítico” subordinado a la voluntad de una sola persona, y Europa tiembla ante una locura donde la razón y el sentido común no funcionan."
 GEM_news.7.a: "Hacia la idea de un nuevo pueblo."
 GEM_news.7.b: "¿Qué demonios está pasando ahí adentro?"
 GEM_news.7.c: "Ahora ya no hablarán el idioma de la razón."

 GEM_news.8.t: "Reforma constitucional de [FROM.GetName]"
 GEM_news.8.desc: "No pasó mucho desde que el mundo se horrorizó por el plan de lavado de cerebro masivo de la presidenta [FROM.GetLeader], pero su siguiente paso, en vez de una locura abierta, genera una duda todavía más incomprensible.\n\nEl mal presentimiento que se respiraba desde que el Pandemonium Society tomó Alemania se convirtió en terror tras la revelación del “Proyecto NK Ultra”. Sin embargo, hoy la presidenta [FROM.GetLeader] mostró ese terror no como guerra, sino como “paz”. Proclamó la fundación de “[FROM.GetName]” y declaró que creará una comunidad ideal donde todos los pueblos convivan en armonía.\n\nBajo el pretexto de “promover el entendimiento y la empatía mutua”, se observan indicios de que el NK Ultra ha comenzado a operar a gran escala en toda la república federal. Europa observa con ansiedad, temiendo que esto sea el prólogo de una enorme obra de engaño."
 GEM_news.8.a: "Dentro de un coro elegante."
 GEM_news.8.b: "Da miedo pensar qué se esconde detrás de esas sonrisas."
 GEM_news.8.c: "Una dictadura disfrazada con su rostro más hermoso."

 GEM_news.9.t: "Revolución de la Secretaría de Gehenna"
 GEM_news.9.desc: "[GEM.GetLeader] de [GEM.GetNameDef] acaba de abolir los antiguos principios de liderazgo y estableció nuevas reglas escolares que otorgan poderes a la Secretaría. Ahora parece que el liderazgo real de la Academia Gehenna ha pasado a manos de la Secretaría del Pandemonium Society, marcando un gran punto de inflexión.\n\n[GEM.GetLeader], que ascendió como la nueva líder del Pandemonium Society, proclama una nueva administración y sigue emitiendo periódicos y transmisiones asegurando que se están llevando a cabo grandes reformas."
 GEM_news.9.a: "Observémoslos."
 GEM_news.9.b: "¡Viva la revolución!"

 GEM_news.10.t: "La Purga de Chiaki"
 GEM_news.10.desc: "Anoche, la capital federal quedó sumida en un silencio tenso. Por orden directa de la secretaria Motomiya Chiaki, se ejecutó una purga relámpago contra facciones radicales dentro del partido gobernante de coalición, la “Alianza Panfederal”, una operación conocida como “La Purga de Chiaki”.\n\nLos detenidos eran germanistas de “pureza” provenientes del viejo partido nazi y supremacistas gehenna que despreciaban a los locales.\n\nTras la fría “corrección” de una sola noche, los partidos integrantes de la Alianza Panfederal bajaron sus viejos letreros y decidieron fusionarse en un partido único: el “Partido Social Popular Panfederal”, adoptando la ideología de Chiaki como doctrina exclusiva.\n\nAhora, el bullicio de debates en el parlamento se ha desvanecido. Las semillas de división, escondidas bajo el nombre de la diversidad, fueron eliminadas, y los nacionalistas dentro de la federación han sufrido una gran caída política."
 GEM_news.10.a: "Una crónica escrita con sangre no se borra fácil."
 GEM_news.10.b: "Una edición perfecta y limpia."
 GEM_news.10.c: "¡Sí! Así se trata a los enemigos políticos."

 GEM_event.1.t: "Tratado de Sangre y Hierro"
 GEM_event.1.desc: "El Pandemonium Society, en medio del enorme choque entre dos mundos, ha propuesto un tratado para proteger toda Kivotos y promover la solidaridad mutua y valores antiterrestres. Al firmarlo, aceptamos compartir información sobre las amenazas de las grandes potencias de la Tierra y cooperar estrechamente contra dichas amenazas."

 GEM_event.2.t: "Danzig para Polonia"
 GEM_event.2.desc: "Un visitante inesperado llegó al palacio presidencial de Varsovia: una misión diplomática enviada por el Pandemonium Society de la Academia Gehenna. Traen una propuesta sorprendente: devolvernos los antiguos territorios polacos, incluida Danzig.\n\nPero nada es gratis. A cambio, Polonia debe convertirse en un aliado firme de la Academia Gehenna. Eso, en la práctica, implica ceder parte de nuestra soberanía e ingresar bajo su “protección política”. Algunos lo denuncian como expansionismo de Gehenna; otros argumentan que, en la Europa caótica posterior a la Gran Transición, conseguir un protector fuerte es una elección realista.\n\n¿Es una oportunidad única para recuperar territorios perdidos y reconstruir el país… o el camino hacia un nuevo yugo? Ha llegado un momento decisivo para el futuro de Polonia."
 GEM_event.2.a: "Debemos recuperar nuestro territorio."
 GEM_event.2.b: "Nada vale más que la independencia."

 GEM_event.201.t: "Aceptan el trato de [FROM.GetNameDefCap]"
 GEM_event.201.desc: "[FROM.GetLeader] de [FROM.GetNameDef] aceptó el trato por el cual [FROM.GetAdjective] recibe antiguos territorios polacos a cambio de nuestra “protección política”. Ahora su régimen está en nuestras manos, y ya se están trazando planes para aprovechar los recursos de toda Polonia."
 GEM_event.201.a: "Es un pacto de fraternidad mutua entre [ROOT.GetAdjective] y [FROM.GetAdjective]."

 GEM_event.202.t: "Rechazan el trato de [FROM.GetNameDefCap]"
 GEM_event.202.desc: "[FROM.GetNameDefCap] rechazó nuestra propuesta. Argumentaron que no es más que un engaño para devorar toda Polonia, expulsaron cortésmente a nuestros diplomáticos y sostuvieron que cualquier cooperación entre ambos países será imposible para siempre..."
 GEM_event.202.a: "¡Aceleran su propia ruina!"
 GEM_event.202.b: "Qué lástima."

 GEM_event.501.a: "¡Es una gran gloria para Gehenna y Alemania!"
 probably_lead_to_war_with_GEM_tt:0 "Esto escalará hasta una §Rguerra§! con §Y[GEM.GetNameWithFlag]§!."

 GEM_event.6.t: "Resolución final por la Academia Gehenna"
 GEM_event.6.desc: "El Pandemonium Society por fin cruzó la línea. Abandonaron el nombre de Gehenna y empezaron a usurpar el nombre del viejo fantasma del pasado que siempre despreciamos: “Deutsche”.\n\nMientras el Comité de Disciplina, tras la Gran Transición, expulsaba con sangre y sudor los restos nazis de Baviera y levantaba un nuevo orden, ellos, cegados por su hambre de poder, eligieron tomar la mano de los criminales de la historia. Esto no es una simple disputa política: es un desafío frontal a la identidad de Gehenna, una traición que arroja el futuro de todas las estudiantes.\n\nBajo la bandera que ellos levantan, es obvio qué destino nos espera a nuestras estudiantes: empujarlas como carne de cañón para los “adultos”, y manchar el espíritu libre de Gehenna con el fantasma opresivo del viejo régimen. Ya no tiene sentido hablar. No hay espacio para la conciliación. Antes de que ese grupo arrogante y corrupto se consolide por completo bajo el nombre de “Deutsches Reich”, debemos actuar.\n\nNo es una opción: es una orden severa de la historia. Como verdaderos guardianes de Gehenna, el Comité de Disciplina prenderá el fuego del juicio sobre ese falso imperio. Con nuestras manos, debemos recuperar el nombre de Gehenna."
 GEM_event.6.a: "Pandemonium cruzó la línea."
 GEM_event.6.b: "Ignóralo. Aún necesitamos aliados."

 GEM_event.601.t: "Resolución final por la Academia Gehenna"
 GEM_event.601.desc: "Camaradas respetados,\n\nEl Pandemonium Society ha abandonado el nombre de Gehenna y ha tomado la mano de los pecados de la historia. El Comité de Disciplina no puede tolerar esa traición y, para evitar que su locura se extienda por toda Kivotos, hemos alzado la bandera de la “Alianza Antinazi”.\n\nEsta no es solo la lucha de Gehenna. Es una lucha por la justicia de toda Kivotos, una lucha contra un fantasma resucitado.\n\nLes rogamos que se unan a nosotros en esta contienda sagrada para demostrar que el orden y la justicia triunfan. Esperamos su decisión."
 GEM_event.601.a: "Por supuesto. Cruzaron la línea."
 GEM_event.601.b: "La carta fue quemada."

 GEM_event.602.t: "Resolución final por la Academia Gehenna"
 GEM_event.602.desc: "No hay tragedia mayor que el instante en que debemos apuntar nuestras armas contra compatriotas.\n\nPero el Pandemonium Society eligió ese camino por sí mismo. Han manchado el honor de Gehenna y se han vuelto uno con los enemigos contra los que hemos luchado. El último tiempo que les concedimos ya terminó. Todo esfuerzo por una solución diplomática se hizo pedazos, y ahora solo queda el juicio por la fuerza.\n\nEl reloj del ultimátum sigue corriendo, y todos los preparativos han terminado. Es hora de demostrar nuestra determinación con hechos."
 GEM_event.602.a: "Es la hora de decidir."

 GEM_event.603.t: "Resolución final por la Academia Gehenna"
 GEM_event.603.desc: "Telegrama del Cuartel General de la Alianza Antinazi.\n\nSe declara que el plazo del ultimátum final contra el Pandemonium Society ha expirado.\n\nTodas las fuerzas aliadas, entren en estado de preparación para el combate. Pronto se emitirá la orden de inicio de guerra total. Según el juramento, prepárense para responder a nuestro llamado."
 GEM_event.603.a: "Es la hora de decidir."

 GEM_event.604.t: "Resolución final por la Academia Gehenna"
 GEM_event.604.desc: "La Alianza Antinazi se ha formado y el frente ya está trazado. La traición del Pandemonium Society es una realidad irreversible.\n\nNo podemos darles tiempo para reagruparse y reforzarse bajo la bandera del falso “Estado Alemán”. Cuanto más tardemos, mayor será el sacrificio que pagaremos.\n\nHa llegado el momento de actuar. No hay más tiempo que perder. Prepararemos el ultimátum y entraremos en la fase final de preparación para la batalla decisiva que se aproxima. El reloj ya empezó a moverse."
 GEM_event.604.a: "Es la hora de decidir."

 GEM_event.605.t: "Los fantasmas del viejo régimen"
 GEM_event.605.desc: "Los opositores de Gehenna finalmente cruzaron la línea de la locura. Bajo el nombre vistoso de la “Alianza Antinazi”, han formado abiertamente una alianza militar para enfrentarse a nuestro Pandemonium Society.\n\nEsto es una traición evidente y una provocación inaceptable que busca arrojar a Gehenna al fuego de la guerra civil. Esos idealistas ingenuos gritan “justicia” y “orden”, pero lo único que traerán sus actos es destrucción y división. Los enemigos más peligrosos de Gehenna son precisamente quienes se aferran a viejos pretextos sin ver la realidad.\n\nNuestro Pandemonium Society solo tomó las decisiones necesarias para la supervivencia y prosperidad de Gehenna. Su arrogancia moralista ya llegó a un punto que no podemos pasar por alto. Si quieren guerra, se la daremos. Camaradas del Pandemonium Society: prepárense para la lucha que viene. Está llegando el momento de enseñarles a esos rebeldes tontos quién es el verdadero dueño de Gehenna."
 GEM_event.605.a: "La guerra se acerca."
 GEM_story.1.t: "Presidenta Natsume Iroha"
 GEM_story.1.desc: "\"¡Gracias a la gran determinación de la presidenta Natsume, por fin el gobierno estatal alemán ha pasado a formar parte de nuestra Sociedad Pandemonium! ¡Vaya, esto sí que es una noticia enorme para ocupar la portada de 'Manmajeon Semanal'!\"\n\nChiaki saltaba de emoción agitando su libreta de reportera, pero Iroha, sentada en el asiento presidencial, solo suspiraba mirando una montaña de documentos.\n\n\"Agh… ¿gran determinación ni qué nada? Solo hice lo que tenía que hacer. Y a partir de ahora es cuando de verdad empieza lo fastidioso. Revisar todo ese papeleo y además ganarnos a los burócratas locales para nuestro bando… con solo pensarlo ya me duele la cabeza.\"\n\nEn ese momento, Makoto, que estaba en el sofá del rincón del despacho, con los brazos cruzados y el labio fruncido por pura inconformidad, metió su cucharada.\n\n\"¡Hmph! ¿Tanto escándalo solo por conseguir un par de gobiernos regionales? Cuando yo, Makoto-sama, era presidenta, tenía un gran plan para conquistar todo Kivotos…\"\n\nMakoto carraspeó un instante y enseguida siguió hablando con su risa característica.\n\n\"…Pero, kikikik. En vez de aplastar a los que se resisten con la fuerza, absorberles todo el sistema administrativo y quitarles incluso la capacidad de resistir… ¡No suena nada mal! Iroha, ¿así que sí te da para usar la cabeza? ¡Como era de esperarse de una subordinada que, aunque fuera por un tiempo, llegó a ganarse la confianza de Makoto-sama!\"\n\nAnte un “halago” que no sonaba a halago en absoluto, Iroha se apretó la sien. Y Chiaki, como si no quisiera perderse ni ese gesto, seguía disparando fotos sin parar. La toma del gobierno estatal alemán era, sin duda, un gran logro. Pero al imaginar el peso de todo el trabajo administrativo que venía detrás, lo único que Iroha podía hacer era extrañar, desde ya, el dulce descanso después de la jornada… y sus videojuegos."
 GEM_story.1.a: "Bueno… si la absorción se completa, ¿se me va a reducir el trabajo, no?"
 value_GEM_state_government_takeover_tt: "§gSi completas este enfoque, se reduce el tiempo necesario para completar la decisión de §YAdquisición del gobierno estatal§!.§!"

 GEM_story.2.t: "El debut de verdad"
 GEM_story.2.desc: "\"¡Corten! ¡Perfecto! ¡Muy bien! Ibuki-chan, esa sonrisa de hace un momento fue increíble. ¡Acaba de nacer una escena histórica que se va a robar el corazón de Gehenna!\"\n\nLa voz enérgica de Chiaki, la presidenta, resonó por todo el set. Todo el equipo estaba conteniendo la respiración mientras miraban el monitor, y en la pantalla aparecía Ibuki sonriendo radiante, con la bandera de Gehenna de fondo.\n\n\"¡Waa~! ¿Ibuki lo hizo bien? ¡Felicítame! Y entonces… ¿ya puedo comer un snack~?\"\n\nIbuki, a la que le estaban retocando el maquillaje, lo dijo con una alegría inocente. Iroha, sentada en una silla plegable revisando el guion, soltó un suspiro.\n\n\"Agh… apenas terminamos una sola toma. Y todavía falta un montón. Si seguimos así, ni pasando la noche entera nos va a alcanzar…\"\n\nEntonces, desde un rincón del set, Hanuma Makoto, que había estado observándolo todo, se metió con una sonrisa satisfecha.\n\n\"¡Kikikik! ¡Como esperaba, valió la pena que Makoto-sama notara desde temprano el potencial de estrella de Ibuki y la tuviera cerca! Mi idea genial de usar la ternura de Ibuki como propaganda… Chiaki, la estás ejecutando bastante bien.\"\n\nChiaki, sin inmutarse por lo que decía Makoto, respondió riéndose.\n\n\"¡Ajajá, ánimo todos! ¡El comercial de Ibuki-chan se va a convertir en el nuevo símbolo de nuestra Gehenna! ¡Bien, preparen la siguiente toma!\""
 GEM_story.2.a: "Y dicen que se vendió bastante bien."

 GEM_iroha_story.1.t: "El Estados Unidos de hoy"
 GEM_iroha_story.1.desc: "Natsume Iroha jamás imaginó que terminaría siendo elegida como la nueva presidenta del Manmajeon. Creía que su vida seguiría como siempre: ocupándose de la administración de Manmajeon y, de vez en cuando, conduciendo el tanque con el nombre vergonzoso que Makoto le puso… el “Toramaru Superinvencible Blindaje Pesado”.\n\nPero la situación cambió drásticamente tras la Gran Transferencia. Eso empujó a Natsume Iroha hasta el puesto de presidenta de Manmajeon, y los intentos que hizo —para reducir su propia carga y construir una Gehenna un poco mejor— la convirtieron en la primera presidenta de la Federación de los Estados Unidos.\n\n\"Agh… ¿en qué momento acabé así? …Aunque bueno, aun así ya no puedo echarme para atrás.\"\n\nInstalada en la recién construida oficina presidencial, la presidenta de Manmajeon, líder benevolente para los alemanes, y ahora presidenta de la Federación, Natsume Iroha suspiró… pero también se vio obligada a tener un poco más de determinación que de costumbre.\n\nPorque ahora había mucha gente que dependía de ella. Y porque… ya había caminado demasiado lejos."
 GEM_iroha_story.1.a: "Un respiro con una taza de café."

 GEM_iroha_story.2.t: "La Ley Fundamental Federal"
 GEM_iroha_story.2.desc: "El aire del parlamento era pesado, y el tiempo se arrastraba como si fuera pegajoso. Natsume Iroha pensó que preferiría mandar todo al demonio y salir corriendo a echar una siesta en la cabina del Toramaru. La Ley Fundamental Federal. El resultado final de un proceso horriblemente aburrido en el que, durante meses, decenas de burócratas habían pesado cada palabra como si fuera oro.\n\nLa guerra o los conflictos eran más sencillos. Solo había que derrotar al enemigo de enfrente. Pero la paz… la paz era una cadena interminable de documentos, reuniones y responsabilidad. ¿Cómo es que la presidenta Hanuma Makoto podía disfrutar de algo tan agotador? Iroha no lograba entenderlo.\n\n\"Agh… ¿por qué el mundo de los adultos funciona de una manera tan cansada?\"\n\nSu pequeño suspiro se perdió bajo el sonido solemne de la lectura del proyecto de ley. Las competencias de la federación, la autonomía de los estados, los derechos civiles. Eran temas importantes, sin duda, pero a Iroha le sonaban como un hechizo para dormir. Y más todavía porque había pasado noches enteras revisando cada cláusula.\n\nFinalmente, el mazo cayó y la ley fue aprobada. Estallaron aplausos, pero a los oídos de Iroha le sonó como si fuese el primer folio de una gigantesca montaña de papeleo que empezaba a pasar página… como si su acogedora almohada quedara cada vez más lejos."
 GEM_iroha_story.2.a: "Pero… con esto sí se me habrá reducido un poco el trabajo, ¿no?"

 GEM_iroha_story.3.t: "La segunda elección más fastidiosa"
 GEM_iroha_story.3.desc: "Un cojín esponjoso, el aroma del café recién hecho, y una consola en las manos. La breve paz que le permitían a Natsume Iroha se tambaleó por culpa de una sola hoja de papel sobre el escritorio. “Formulario de confirmación de intención de reelección”. Era corto, pero cada palabra pesaba más que cualquier otro documento que hubiera firmado.\n\nSi no firmaba, podría liberarse de toda esa responsabilidad asfixiante. Una tarde tranquila con el Toramaru, siestas sin que nadie la molestara… el futuro sonaba dulce solo con imaginarlo.\n\nPero… ¿y el caos que vendría después? Si esa paz torpe que había construido se derrumbaba, y volvían las luchas de facciones y el juego sucio… arreglarlo sería varias veces más fastidioso que ahora. Agh, ¿por qué el mundo de los adultos siempre funciona así?\n\nAl final, para evitar la opción más fastidiosa, decidió escoger la segunda más fastidiosa. Con un suspiro largo y profundo, Natsume Iroha tomó la pluma y escribió su nombre. Era el momento en que oficializaba su candidatura para las próximas elecciones.\n\n\"…¿De verdad fue lo correcto?\"\n\nSu murmullo se deshizo en el aire silencioso del despacho. Aún faltaba mucho para las elecciones. Por lo menos hoy… estaría bien holgazanear un poco más."
 GEM_iroha_story.3.a: "Bueno, por hoy ya estuvo."

 GEM_iroha_story.4.t: "La retirada de una gigante"
 GEM_iroha_story.4.desc: "En la quietud de la noche, la luz del despacho presidencial seguía encendida. Natsume Iroha miró su taza de café vacía y, en silencio, contempló la vista nocturna de la ciudad a través de la ventana. Un ruido justo… ni terriblemente estridente, ni tan silencioso como para ahogar. Esa era la paz que ella quería.\n\nFue una sucesión interminable de responsabilidades. Pero… ya estaba. La federación se había estabilizado, y al menos existía un sistema mínimo para que todo siguiera funcionando incluso sin ella. Con esto… debería ser suficiente.\n\nEn el instante en que lo pensó, la sintió: una liberación, como si una armadura de acero que le había aplastado los hombros durante años se deshiciera en polvo. La cabina acolchada del Toramaru, su rincón acogedor… la vida cotidiana que tanto extrañaba por fin parecía estar al alcance.\n\nClaro: aún quedaba un último documento, el más fastidioso de todos. Para evitar el caos tras su salida, debía designar a un sucesor. Esa sería su última obligación como presidenta de la federación… y como Natsume Iroha."
 GEM_iroha_story.4.a: "Dicen que Yozakura Kirara logró ser reelecta como diputada recientemente."
 GEM_iroha_story.4.b: "Hatami Erika también parece una alternativa excelente."

 GEM_iroha_story.5.t: "Fundación de la Alianza Alemana por los Derechos Humanos"
 GEM_iroha_story.5.desc: "En el viejo salón cívico de Múnich, el aire estaba lleno de expectativas cautelosas y determinación firme. En el estrado, un veterano socialdemócrata recorrió con la mirada a antiguos camaradas —que en otro tiempo habían sido rivales— y a jóvenes estudiantes que acababan de alcanzar la mayoría de edad, antes de hablar.\n\n\"Durante el pasado, estuvimos dispersos: socialdemócratas, miembros del Partido Popular, del Partido de Centro… Nos criticamos unos a otros y luchamos por intereses propios. Pero hoy, nos reunimos aquí bajo un solo nombre: ‘alemanes’.\"\n\nSu voz era baja, pero cada persona en el salón podía oírlo con claridad.\n\n\"Bajo la arrogancia de las estudiantes de Kivotos y la codicia de los capitalistas, nuestros derechos fueron pisoteados. Pero ya no guardaremos silencio. Sea o no su intención, dentro de este extraño orden que construyó la presidenta Natsume Iroha, por fin hemos obtenido una pequeña rendija para alzar la voz. No dejaremos pasar esta oportunidad.\"\n\nCon esa declaración, se fundó oficialmente la “Alianza Alemana por los Derechos Humanos”. Los aplausos no fueron estruendosos. Esto no era una proclamación de victoria. Era un juramento silencioso que anunciaba el inicio de una larga lucha: recuperar, dentro del marco de la ley, los derechos que les habían arrebatado."
 GEM_iroha_story.5.a: "Que nuestra voz, algún día, les llegue."

 GEM_iroha_story.6.t: "La esperanza grabada sobre el código"
 GEM_iroha_story.6.desc: "La voz serena de la locutora en la radio fue más dramática que cualquier grito. \"…Con el resultado de la votación del parlamento federal, se declara aprobado el proyecto de ‘cuotas étnicas’.\" Un breve silencio. Y luego, en la sede de la Alianza, el júbilo que habían reprimido durante tanto tiempo por fin estalló.\n\nEl veterano presidente sindical se limpió discretamente las lágrimas tras sus gafas, y estudiantes universitarios jóvenes se abrazaron celebrando. En el estrado, el presidente de la Alianza gritó con una voz temblorosa.\n\n\"¡Camaradas! ¡Esto no es solo la aprobación de una ley! ¡Es el primer paso para demostrar que ya no somos extranjeros en esta tierra; que somos dueños iguales y legítimos de la Federación! ¡Por fin, con nuestras propias manos, hemos conquistado el derecho de que nuestros hijos no sufran desprecio injusto en las aulas, en las fábricas, ni en las oficinas públicas!\"\n\nPor supuesto, las letras en un código no borrarían toda discriminación de la noche a la mañana. La resistencia de los grupos establecidos de Kivotos quizá se volvería todavía más feroz. Pero hoy, habían logrado abrir la primera grieta en un muro que parecía imposible. Solo eso… ya era una victoria casi milagrosa.\n\nAl menos hoy, se permitirían celebrar esta pequeña victoria. Porque a partir de mañana, tendrían que prepararse para una lucha más larga."
 GEM_iroha_story.6.a: "¡Lo logramos!"

 GEM_iroha_story.7.t: "Una elección por el orden"
 GEM_iroha_story.7.desc: "Hoy, el mapa político de la Federación cambió para siempre. Tras innumerables discusiones y compromisos, los principales partidos de origen Gehenna por fin se unieron bajo una sola gran alianza: la “Gran Coalición de Gehenna”.\n\nEn la conferencia de prensa, su primer portavoz lo declaró así.\n\n\"Ya no desperdiciaremos la fuerza nacional en discusiones ideológicas estériles. A partir de hoy, la política de la Federación queda clara: nuestra Gran Coalición de Gehenna gobernará como partido responsable, y los partidos de origen alemán nos fiscalizarán como una oposición sana.\"\n\nNo era una reconciliación: era un apretón de manos frío para una convivencia ordenada. En vez de mezclarse en un mismo crisol, las dos naciones conducirían el Estado respetando sus propias áreas. La era de la fragmentación terminó. Empezó la era de las dos facciones."
 GEM_iroha_story.7.a: "La estabilidad es el mayor valor."

 GEM_iroha_story.8.t: "Una apuesta llamada confianza"
 GEM_iroha_story.8.desc: "Hace apenas unos meses, nadie habría imaginado una escena así. En un estrado donde colgaban lado a lado la bandera de Manmajeon y la del Partido de Centro, los líderes de origen Gehenna y de origen alemán se encararon. Una ceremonia de investidura para un gobierno de coalición que buscaba poner fin a una era de desconfianza y hostilidad. Era una apuesta enorme.\n\nEn el instante en que sus manos se estrecharon, los flashes estallaron por todo el lugar. El político veterano del Partido de Centro, en el estrado, habló con una voz temblorosa.\n\n\"En lugar del camino fácil de la desconfianza, hemos elegido el camino difícil de la confianza. Antes que la ley, antes que la ideología, somos vecinos bajo el mismo cielo. Esta coalición no es ingeniería política: es una promesa hacia el futuro.\"\n\nEl auditorio no se llenó con vítores de vencedores, sino con la emoción contenida de quienes presenciaban un nuevo comienzo. Por supuesto, desde mañana los esperaría la realidad: comprender culturas distintas y superar prejuicios profundamente arraigados no sería fácil. Pero hoy, habían dado el primer paso, el más difícil. Si esa frágil chispa podría convertirse en un gran incendio de reconciliación… ahora dependería de ellos."
 GEM_iroha_story.8.a: "Por una sola Federación."

 GEM_iroha_story.9.t: "Otro apretón de manos"
 GEM_iroha_story.9.desc: "El día en que Gehenna y Alemania se estrecharon la mano, muchos lo llamaron un “milagro”. Pero en el camino hacia una verdadera reconciliación, aún quedaba por superar la montaña más alta: Trinity, el enemigo histórico de siglos.\n\nEn lugar de repetir una historia de recelo y antagonismo, la coalición Manmajeon–Partido de Centro eligió de nuevo una apuesta que parecía imposible: ofrecer un lugar dentro del gobierno a los partidos de origen Trinity.\n\nHoy, en el estrado, tres personas se dieron la mano. Los cuernos de Gehenna, el águila alemana, y las alas de Trinity se reunieron por fin bajo un mismo símbolo. El milagro no terminó con uno solo. Gehenna, Alemania y Trinity: una federación de tres naciones demostraba que lo imposible podía convertirse en realidad."
 GEM_iroha_story.9.a: "Un “Tratado de Edén” para una nueva era."

 GEM_iroha_story.10.t: "La estructura triangular"
 GEM_iroha_story.10.desc: "La llegada al poder de la Gran Coalición de Gehenna y la consolidación de los partidos alemanes como oposición parecían conducir la política de la Federación hacia un orden estable, como si el país se encaminara a un bipartidismo firme. Pero apareció una nueva variable sobre esa base: Trinity.\n\nQuienes alguna vez fueron enemigos se convirtieron en una fuerza política imposible de ignorar. La Gran Coalición de Gehenna quedó ante una decisión difícil: ¿seguir tratándolos como enemigos, o atraerlos al sistema para gestionarlos desde dentro?\n\nLa respuesta fue la segunda. Ahora, la Federación era como una mesa sostenida por tres patas enormes: Gehenna, Alemania y Trinity. El bipartidismo terminó. A partir de aquí, comenzaba una era de equilibrio complejo… donde era imposible prever el siguiente paso."
 GEM_iroha_story.10.a: "…Se sumó otro rival."

 GEM_iroha_story.11.t: "El ruido llamado libertad"
 GEM_iroha_story.11.desc: "La lámpara de araña del parlamento temblaba peligrosamente por los gritos de los diputados. Ese fue el primer paisaje del “parlamento federal que incluye a todas las fuerzas políticas”. El resultado de reunir en un solo lugar a todos los que alguna vez fueron marcados como ilegales no fue un debate ordenado… fue un caos.\n\nDe un lado, una “coalición de Manmajeon” —mezclando Manmajeon, socialdemócratas, el Partido de Centro e incluso comunistas— exigía orden. Del otro lado, diputados del Partido Nacionalsocialista Obrero Alemán, con bigote, lanzaban abucheos y bloqueaban el procedimiento.\n\nPero incluso en ese gran estruendo, había quienes seguían su propio ritmo. Haruna Kurodate, del Club de Investigación Gourmet, bebía té con elegancia desde su escaño y se lamentaba: “El diseño acústico de este parlamento es lo peor. Antes de la gastronomía, habrá que enseñar modales básicos.” Los diputados de partidos pequeños venidos de Trinity permanecían sentados con el gesto rígido, incapaces de creer lo que veían. Y los representantes de minorías, como los daneses y los sorbios, se esforzaban por conseguir un turno de palabra en medio de la pelea de los gigantes.\n\n¿Era esta la forma que soñábamos para la libertad y la democracia? Nadie lo sabía. Pero una cosa era segura: comparada con el silencio helado de un dictador, esta libertad ruidosa se sentía mucho más humana."
 GEM_iroha_story.11.a: "Aun así… del ruido nace la música."

 GEM_iroha_story.12.t: "Un grillete llamado consenso"
 GEM_iroha_story.12.desc: "Natsume Iroha se preguntó, muy en serio, cómo demonios había llegado hasta aquí. Con ser presidenta de Manmajeon ya era suficientemente fastidioso, pero ahora era una “líder elegida en conjunto” con el apoyo tanto de los bloques de origen Gehenna como de origen alemán. Sobre el escritorio, informes en idioma Gehenna e informes en alemán estaban alineados uno al lado del otro, como si fueran una frontera invisible que le provocaba dolor de cabeza.\n\n\"Agh… hasta extraño la época de la presidenta Makoto.\"\n\nAl menos entonces solo había un tipo de dolor de cabeza con el que lidiar. Pero ya no. Ahora debía hacer equilibrio en una cuerda floja entre las quejas de Gehenna y las exigencias alemanas. Un solo suspiro mal dado, y esa federación frágil podría derrumbarse. Y el desastre que vendría después… solo imaginarlo ya era terriblemente fastidioso.\n\nEl café dulce dentro del Toramaru y las siestas tranquilas parecían reliquias de un pasado lejano. En lugar de tomar la pluma, Iroha empujó con calma los dos tipos de informes hacia un lado del escritorio.\n\nHabía llegado demasiado lejos. Y tirar todo por la borda ahora solo traería un futuro todavía más fastidioso. Ella lo sabía demasiado bien."
 GEM_iroha_story.12.a: "…Primero, aunque sea, café."

 GEM_iroha_story.13.t: "La historia de Alemania, la historia de Gehenna."
 GEM_iroha_story.13.desc: "En el estrado del festival conmemorativo de la reconstrucción federal, Natsume Iroha soltó un pequeño suspiro frente al micrófono. Esto no se le daba. Pero cuando vio abajo cómo se mezclaban estudiantes de Gehenna con familias alemanas, riendo y hablando, una sonrisa tenue se le dibujó en el rostro.\n\n\"…Siguen siendo ruidosos, como siempre. Bueno, sea de aquel lado o de este… parece que la forma de disfrutar un festival no es tan distinta. Desde la Gran Transferencia, pasaron tantas cosas… pero aun así, si pudimos levantarnos otra vez y reír juntos, ¿no es suficiente con eso? …En fin, disfruten el tiempo. Eso es todo.\"\n\nEl discurso fue solo eso. Pero para los burócratas capaces del gobierno y para los analistas políticos, esas pocas palabras significaron mucho más. Dos ejes: “levantarse juntos” sobre la herida compartida de la Gran Transferencia, y una “similitud” cultural que no era tan pequeña como se pensaba. Algo nuevo estaba naciendo.\n\nIroha solo había dicho lo que tenía frente a los ojos… pero esa frase casual ya empezaba a convertirse en la nueva dirección de la federación."
 GEM_iroha_story.13.a: "Bueno… no es una mala historia."

 GEM_iroha_story.14.t: "Mediadora veterana"
 GEM_iroha_story.14.desc: "El aire en el despacho presidencial estaba tenso. El líder del Partido Popular Pro-Gehenna y el representante del Partido Nacionalsocialista Obrero Alemán se gruñían encima del presupuesto sin ceder un centímetro. Pero Natsume Iroha solo apoyaba la barbilla en la mano y miraba su taza de café enfriándose. “Ya empezaron otra vez”, pensó.\n\nAntes habría querido huir de ese ruido. Pero tras incontables reuniones y negociaciones, había aprendido a leer el flujo de estas peleas: cuándo intervenir, a quién había que alimentar el orgullo, y qué concesión lanzar para que ambos retrocedieran a regañadientes. Lo entendía… de forma irritante, demasiado bien.\n\nCuando la discusión llegó al límite, ella habló con voz baja. Unas cuantas preguntas, una propuesta pequeña de concesión, y una frase que parecía atravesar la siguiente jugada del rival. No era apasionada, pero sí afilada, apuntando al núcleo de ambos. Una hora después, los dos firmaron un acuerdo a regañadientes y salieron del despacho, vacilantes.\n\nSola, Iroha dejó escapar un suspiro profundo. Agh… ¿en qué momento se acostumbró a ser buena en cosas tan fastidiosas? No le alegraba nada sentirse competente."
 GEM_iroha_story.14.a: "Mañana sí que voy a holgazanear, de verdad…"

 GEM_iroha_story.15.t: "Las huellas de la historia"
 GEM_iroha_story.15.desc: "Hubo un tiempo en que ambas naciones se apuntaban con armas. Los nombres “gehenna” y “alemán” parecían un muro imposible de cruzar. Pero tras un largo tiempo y muchísimos compromisos, bajo el liderazgo de Natsume Iroha, ambos bandos finalmente llegaron a un acuerdo.\n\nHoy, el parlamento federal, con unanimidad a favor tanto del Partido Popular Pro-Gehenna como de la oposición alemana, añadió una nueva frase al preámbulo constitucional.\n\n\"Esta constitución se promulga para el desarrollo conjunto del pueblo de Gehenna y del pueblo germánico.\" \n\nBreve, pero más pesada que cualquier declaración: esa sola línea dejó escrito para siempre que ambas naciones eran un único país. Iroha, observando ese momento histórico desde abajo del estrado, dejó escapar un suspiro… y por primera vez en mucho tiempo, fue uno realmente tranquilo. El país estable que tanto deseaba —donde “ya no ocurren cosas fastidiosas”— por fin se completaba."
 GEM_iroha_story.15.a: "Buen trabajo."
 GEM_makoto_story.1.t: "Discurso de unificación de Gehenna"
 GEM_makoto_story.1.desc: "Bajo la bandera de la Sociedad Pandemonium, todo lo que era Gehenna se arrodilló. El último foco de resistencia en las calles, el Comité de Disciplina, fue desarmado, y su vieja justicia le cedió el sitio al nuevo orden de la presidenta Hanuma Makoto. Ahora Gehenna deja atrás su pasado dividido y, unida bajo una verdadera líder, está lista para mostrar su poder en todo Kivotos. Makoto se pone frente a las estudiantes de una Gehenna unificada y proclama la apertura de una nueva era.\n\n\"¡Kikikik! ¡Escuchad, mis queridas estudiantes de Gehenna! ¡Hoy, yo, Hanuma Makoto, estoy aquí como la 'legítima unificadora' de Gehenna! ¡Ya no existen esas reglas viejas e ineficientes que nos ataban, ni esos regañones llamados Comité de Disciplina! ¡Ellas jamás entendieron el valor de los verdaderos logros; solo gritaban por mantener el status quo y no hicieron más que estorbar mis grandiosos planes!\"\n\nCuando Makoto toma aire, estalla el clamor de las estudiantes reunidas en la plaza.\n\n\"¡A partir de ahora, Gehenna hablará con una sola voz: mi voz! ¡Se moverá con una sola voluntad: mi voluntad! ¡Ya no queda nada que pueda detenernos! ¡Con esta fuerza unificada, demostraremos la grandeza de Manmajeon a todo Kivotos! ¡Escuchad bien este discurso! ¡La nueva era de Gehenna comienza justo ahora, aquí mismo!\"\n\nAl terminar el discurso, Makoto regresa al despacho con una risa satisfecha. Iroha, siguiéndola, deja caer sobre el escritorio una montaña de documentos y suelta un suspiro profundo.\n\n\"Agh… ¿cómo acabamos así? El discurso estuvo genial, pero estos papeles de aprobación… todos van a tener que pasarlos ustedes, presidenta. Como el Comité de Disciplina desapareció, todo el trabajo administrativo se nos vino encima.\""
 GEM_makoto_story.1.a: "¿Q-qué? ¿No se supone que estos documentos complicados los hacen los burócratas competentes?!"
 GEM_makoto_story.1.b: "B-bueno… sí. Haré lo que pueda."

 GEM_makoto_story.2.t: "Discurso de integración de la “ex-Gehenna”"
 GEM_makoto_story.2.desc: "La Agencia 68, símbolo de la zona sin ley de Kivotos, por fin cayó bajo la influencia de Manmajeon. Es una lástima que la pandilla de la Agencia 68 se haya escapado, pero el experimento político de Rikuhachima Aru llegó a su fin.\n\n\"¡Kikikik! La verdad, fueron bastante insistentes. ¡Pero al final se arrodillaron ante el grandioso plan de Makoto-sama! ¡Con esto, puede decirse que contribuimos a la unificación de Gehenna!\"\n\nMakoto habla con soberbia, brazos cruzados, y a su lado Iroha abre la boca.\n\n\"Agh, ¿qué fue esto? ¿Armar tanto escándalo por conquistar un lugar tan pequeño, que encima ni le interesábamos mucho…? Sí, sí. Ya que me lo pidieron, voy a ordenar el informe, pero… ¿para la próxima podrían escoger un rival un poco más ‘legítimo’?\"\n\n\"¡Kikikit! ¡Iroha, aún no entiendes! ¡El desorden pequeño es justo lo que corroe el gran orden! ¡Yo pienso eliminar hasta la espina más mínima para conquistar Kivotos!\""
 GEM_makoto_story.2.a: "No tuvo gran significado."
 GEM_makoto_story.2.b: "¡Ahora lo que necesitamos es un pretexto!"

 GEM_makoto_story.3.t: "Discurso de investidura como Host"
 GEM_makoto_story.3.desc: "La Academia General Trinity, que clamaba justicia y nobleza, por fin cayó bajo la bandera de Gehenna. El Club de Realización de la Justicia, su orgullo, se desmoronó, y las estudiantes recibieron a un nuevo gobernante. En la mesa del Tea Party donde alguna vez se sentó Nagisa, ahora Hanuma Makoto se sienta disfrutando la victoria. Frente a las estudiantes de Trinity reunidas, deja grabado quién es el “Host” de esta nueva era.\n\n\"¡Kikikit! Este ambiente… no está nada mal. Tazas y postres de ‘clase’, y esa elegancia falsa. ¡Ahora todo esto le pertenece a esta yo, Hanuma Makoto! ¡Esa ‘justicia’ rancia que ustedes veneraban terminó cayendo ante mi ambición! ¡Mirad: esta es la diferencia de poder!\"\n\nMakoto levanta la taza de té y continúa.\n\n\"A partir de ahora, Trinity ya no estará atada a creencias hipócritas. ¡Su potencial se usará únicamente para mis logros: levantar un gran orden que abarque todo Kivotos! ¡Los que estén borrachos de gloria pasada, retírense! ¡Escuchad bien el discurso de esta yo, el nuevo ‘Host’!\"\n\nTras el discurso, en el salón de té hecho un desastre, Iroha encuentra el sofá que se ve más cómodo y se deja caer.\n\n\"Fuu… ¿no quieren que me escape tantito a holgazanear? Este cojín está bastante esponjoso. La verdad, aquí parece que no me van a descubrir. Mientras usted da su discurso, me voy a echar una cabezadita.\"\n\n\"Espera, Iroha… no, ahora no es el momento. ¡Kishishit! Bien, ¡disfrutemos el regusto de esta victoria!\""
 GEM_makoto_story.3.a: "¡¿Eh?! ¡¿Esto qué es?! ¡¿Está amargo?! ¿En el Tea Party comen cosas así?"
 GEM_makoto_story.3.b: "Para conquistar Trinity por completo, tendré que aprender algo de ceremonia del té."

 GEM_makoto_story.4.t: "Discurso de investidura como Presidenta del Consejo General de Estudiantes"
 GEM_makoto_story.4.desc: "La Torre Sanctum, el corazón de Kivotos que había caído en el caos tras la desaparición de la presidenta del Consejo General, por fin recibió a una nueva dueña. El ejército de Hanuma Makoto aplastó la resistencia de las facciones del Consejo General y tomó su poder. Makoto ya no es solo presidenta de Gehenna: ahora ocupa el puesto de “Presidenta del Consejo General de Estudiantes”, gobernante de todo Kivotos. A través del sistema de transmisión de la Torre Sanctum, hace resonar su voz por todo Kivotos.\n\n\"¡Kikikik! ¡A todas las estudiantes de Kivotos! ¡El puesto de presidenta del Consejo General, que estuvo vacío por tanto tiempo, y esta era de caos y desorden, terminan hoy! ¡Yo, Hanuma Makoto, soy la nueva presidenta del Consejo General de Kivotos! Ya no tienen por qué vagar sin rumbo. ¡Solo necesitan seguir mi grandiosa guía!\"\n\nSu voz rebosa confianza.\n\n\"Se los prometo: bajo un liderazgo fuerte, Kivotos será una fortaleza inexpugnable, inmune a cualquier amenaza. ¡Bajo mi gobierno, Kivotos disfrutará la mayor prosperidad de su historia! Los logros no se construyen en una sola noche. ¡Pero Makoto-sama jamás se rendirá! ¡Abran paso a mi era!\"\n\nCuando termina la transmisión y Makoto se gira los hombros tiesos, Iroha, sentada en el sillón de la presidencia del Consejo, hojea documentos y habla.\n\n\"Agh… o sea, ya dejé todo listo, ¿sí? Me maté entendiendo el enorme sistema administrativo del Consejo General. ¿Presidenta… no, Presidenta del Consejo General? Lo siguiente es revisar el presupuesto de Millennium. No creo que me dejen holgazanear… qué se le va a hacer…\""
 GEM_makoto_story.4.a: "¡Espera! ¡Apreté el botón equivocado!"
 GEM_makoto_story.4.b: "Un líder grandioso no se tambalea por esto."

 GEM_makoto_story.5.t: "Discurso de investidura como Directora General de Millennium"
 GEM_makoto_story.5.desc: "Millennium Science School, símbolo de razón y racionalidad, se rindió bajo los pies de Manmajeon. Ni el Club de Ingenieras armado con tecnología de punta, ni las agentes élite de C&C lograron frenar la ambición de Makoto. Ahora, toda la tecnología y los datos de Millennium pertenecen a una sola persona: Hanuma Makoto, la nueva “Directora General”. Ella envía un mensaje a todo el alumnado usando la base de datos central de Millennium.\n\n\"¡Kikikik! ¡Talentos sobresalientes de Millennium! ¡Su conocimiento y su tecnología ya no se desperdiciarán en investigaciones sin propósito! ¡Desde hoy, yo soy su nueva Directora General! ¡Todas sus investigaciones y todos sus inventos serán parte de mi grandioso plan para unificar Kivotos!\"\n\nMakoto continúa su discurso mientras levanta drones hackeados en el aire.\n\n\"¡Esos robots que ustedes hacen como si fueran juguetes… es hora de que se muevan por un propósito real! ¡Kishishit! Lo importante es esto: su poder tecnológico está bajo mi control. ¡Ya no hay debate! ¡Solo ejecución!\"\n\nMientras tanto, en un rincón de la sala de juntas, Iroha encontró la silla que se veía más cómoda y estaba jugando en una tablet.\n\n\"Gracias… ¿Qué pasa? Esta silla está tan cómoda que se me salió el agradecimiento. A su discurso todavía le falta mucho, presidenta, así que hasta entonces me voy a quedar aquí descansando.\""
 GEM_makoto_story.5.a: "¡Espera! ¡¿Por qué los drones me están atacando?!"
 GEM_makoto_story.5.b: "¡Ordena una nueva investigación!"

 GEM_makoto_story.6.t: "Promulgación de la Nueva Constitución Alemana"
 GEM_makoto_story.6.desc: "\"Agh… qué fastidio, pero ni modo. Ya está listo el discurso de la presidenta Makoto… solo queda esperar a que se acabe ese evento ruidoso.\"\n\nDe pie junto al estrado, Natsume Iroha murmuró con un pequeño suspiro. En su línea de visión, en el balcón del Reichstag renovado, apareció Hanuma Makoto, y un rugido enorme surgió de la multitud que llenaba la plaza. Makoto abrió los brazos disfrutando el clamor.\n\n\"¡Kikikik! ¡Mirad, mis nuevos súbditos! ¡Hoy, en nombre de Hanuma Makoto, se abre un nuevo capítulo de la historia! El viejo ‘Reich’ estaba atado a las cadenas de un linaje rancio e ineficiente y caminaba hacia su propia ruina. ¡Intentar desatar ese nudo enredado no es más que pérdida de tiempo de necios! ¡Esta yo, como gran líder, corté ese nudo de un solo tajo!\"\n\nMakoto proclamó mirando la plaza.\n\n\"¡A partir de ahora, ‘alemán’ ya no se definirá por una sangre antigua! Solo quien participe en mis logros y sea absolutamente leal a mi liderazgo demostrará la verdadera cualificación para ser alemán. ¡Cuando su voluntad apunte hacia mí, entonces disfrutarán el honor de ser parte de este gran Estado! ¡Y hoy, para grabar este nuevo orden para siempre, declaro la promulgación de la ‘Nueva Constitución Alemana’!\"\n\nHizo una pausa y, con una sonrisa satisfecha, gritó.\n\n\"¡Desde este instante, abolimos los residuos del pasado atados al linaje: el nombre ‘Deutsches Reich’! ¡Desde hoy, nuestra patria renace como el gran ‘Deutschland’, que acoge a todos los unidos bajo mi ideología! ¡Kishishit! Bajo mi gobierno, este nuevo Deutschland dará el primer paso para conquistar Kivotos… no, ¡para conquistar este mundo entero! ¡Vamos, vitoread! ¡La era de su nuevo Führer, Hanuma Makoto!\"\n\nEn la plaza, el júbilo fanático y el silencio calculado se mezclaron en un solo estruendo."
 GEM_makoto_story.6.a: "¡Con esto, Hanuma Makoto-sama demostró su valor como líder incluso en este nuevo mundo!"

 GEM_makoto_story.7.t: "Sobre el estrado"
 GEM_makoto_story.7.desc: "\"¡Kikikik! ¡Mis queridas compañeras de Gehenna! ¡He escuchado hasta aquí sus pequeñas inquietudes y dudas! ¿Que si no pueden dormir pensando cuál es su papel en este camino grandioso? ¿Qué les pasará a sus futuros? ¿Que si andan atormentadas por preocupaciones así de insignificantes?\"\n\nEn el auditorio recién acondicionado del parlamento, Hanuma Makoto abrió los brazos hacia la multitud de estudiantes de Gehenna reunidas. Tras la Gran Transferencia, al quedar integradas bajo el enorme Estado alemán, la inquietud se había extendido entre ellas. Y Makoto pensaba cortarla de un tajo.\n\n\"¡Insensatas! ¿Han olvidado a quién siguen? ¡Mirad! ¡Mirad lo que esta yo, Hanuma Makoto, ha preparado para ustedes! Antes, Gehenna era solo una región autónoma… pero desde ahora, la Academia Gehenna será un territorio sagrado e inviolable, con un estatus legal especial dentro de este gran Estado alemán. ¡Ya no son simples estudiantes de una academia caótica! ¡Son la élite que encabezará mis logros, la piedra angular de este nuevo imperio! ¡Así que tiren sus dudas y síganme! ¡Su futuro lo garantizaré yo misma, Hanuma Makoto! ¡Kishishit!\"\n\nAl terminar su declaración, el auditorio se cubrió de un clamor eufórico que aplastó la ansiedad. Recibiendo a Makoto al bajar del estrado, Iroha soltó un suspiro cansado. “Agh… ya por fin se acabó… con esto, ¿me dejarán holgazanear un rato, no?” Pensando en qué otro discurso fastidioso se inventaría Makoto después, Iroha ya extrañaba el cojín esponjoso de su refugio."
 GEM_makoto_story.7.a: "Después de todo, a las estudiantes les hacía falta una voz que les diera tranquilidad."

 GEM_makoto_story.8.t: "Medida temporal"
 GEM_makoto_story.8.desc: "La oficina de la Sociedad Pandemonium cambió. El lugar donde antes había montañas de papeleo, garabatos incomprensibles y aquel sofá esponjoso donde la senpai Iroha se echaba siestas… ya no existe. En su lugar hay muebles perfectamente alineados, paredes vacías y un diseño alemán que solo grita eficiencia. Es como si el “Manmajeon” que conocíamos hubiera desaparecido y hubiéramos entrado por error a la oficina de otra persona.\n\nClaro, sé que esto forma parte del proyecto grandioso de la presidenta Makoto: la “estandarización cultural”. Para gobernar Alemania, debemos parecer alemanes. ¿Cómo no entender su profunda intención?\n\nPero… ¿de verdad era esto lo que queríamos? Que incluso nuestra libertad caótica se convierta en un pasado que “debe enterrarse”… se siente extrañamente helado. En este espacio frío, ¿podrá nacer la misma imaginación o los planes audaces de antes?\n\n…Agh. Basta de divagar. Hay que cumplir con el cierre del artículo. Tomo la pluma y empiezo a exprimir frases para alabar este “gran cambio”."
 GEM_makoto_story.8.a: "Flotaba un leve presagio inquietante."

 GEM_makoto_story.9.t: "Símbolos de la nueva era"
 GEM_makoto_story.9.desc: "El gran salón de Hesse se llenó de nuevas banderas. En vez de los símbolos familiares de la Academia Gehenna o del Partido Nazi, un nítido “rúnico Othala” adornaba el estrado. Hanuma Makoto, subida al podio, disfrutó las miradas contradictorias que caían sobre ella antes de hablar.\n\n\"¡Kikikik! ¡Hoy este día quedará en la historia! ¡Esto no es Manmajeon! ¡Esto tampoco es un partido de Gehenna! Hoy, aquí mismo, ¡proclamo la fundación del ‘Partido Patriota Alemán de Corporativismo Nacional’!\"\n\nMakoto tomó aire y gritó con una pasión casi delirante.\n\n\"¡Alemania se perdió! ¡Gime bajo ideologías viejas y líderes incompetentes! ¡Solo yo, Hanuma Makoto, puedo volver grande a Alemania, por eso he decidido cargar con el destino alemán con mis propias manos!\"\n\nEn un lado del salón, las estudiantes de Gehenna se miraron entre sí, desconcertadas. “¿Y por qué tenemos que ser patriotas alemanes…?” Su lealtad era hacia Gehenna, no hacia esta tierra extraña. Los representantes de los partidos alemanes dentro de la coalición se quedaron petrificados: habían buscado colaboración… y de pronto se habían convertido en comparsas de un nuevo fanatismo.\n\nPero, a diferencia de ellos, el público alemán que llenaba el salón se encendió de euforia. El origen de Makoto no les importaba. Reconstrucción nacional, orden fuerte, y la promesa familiar de “un solo pueblo”. Solo estaban presenciando el nacimiento de una nueva líder que prometía una “Alemania fuerte”. En medio de reacciones opuestas, Makoto escuchó únicamente los aplausos hacia ella y sonrió con satisfacción. Su apuesta más extraña y audaz acababa de abrir el telón."
 GEM_makoto_story.9.a: "Se retira entre aplausos."

 GEM_makoto_story.10.t: "Ilegalización de la NSDAP"
 GEM_makoto_story.10.desc: "A partir de hoy, se prohíben todas las actividades del Partido Nacionalsocialista Obrero Alemán (NSDAP) y se declara su existencia como ilegal mediante el “Decreto de Purificación Nacional”.\n\nEsta medida no se debe a una simple diferencia ideológica. Las campañas de exclusión étnica extremista y la incitación al odio contra grupos específicos, perpetradas por el Partido Nazi desde el pasado, violan de frente los valores de integración que persigue nuestra “patria unificada”. Su ideología es un veneno: siembra semillas de división y destruye la comunidad desde dentro.\n\nLa nueva Alemania no separa a sus ciudadanos por sangre u origen. Solo la lealtad al Estado y la voluntad de participar en un logro común otorgan la cualificación de “nuevo alemán”. En esta gran era de integración, no hay lugar para ideas antiguas que proclaman la superioridad de un grupo étnico y justifican la exclusión y la violencia.\n\nPor lo tanto, todos los activos del Partido Nazi pasarán al Estado, y su dirigencia será arrestada por obstruir la integración nacional. Limpiaremos la mancha del pasado y avanzaremos hacia el futuro como una patria verdaderamente unida."
 GEM_makoto_story.10.a: "Es una detención política."

 GEM_makoto_story.11.t: "El Partido Patriota de Corporativismo Nacional"
 GEM_makoto_story.11.desc: "Ocurrió un terremoto político. Cuando la línea de “fusión cultural Gehenna–germana” impulsada por el Führer Hanuma Makoto comenzó a ganar poder de persuasión popular, se produjo una gran fractura dentro del Partido Nazi, su rival. Al ver el dinamismo de la nueva era y la posibilidad de “victoria”, los miembros jóvenes y los pragmáticos del Partido Nazi abandonaron a una dirigencia vieja, atada al fracaso del pasado, y empezaron a sumarse en masa al “Partido Patriota Alemán de Corporativismo Nacional” de Makoto.\n\nCon este éxodo masivo, el panorama político alemán se reconfiguró por completo. El partido de Makoto se transformó en una fuerza gigantesca con mayoría aplastante en el parlamento, estableciendo un sistema de “coalición con predominio de un solo partido”, donde los demás partidos menores quedaban como socios meramente formales. En cambio, el Partido Nazi, tras perder talento clave y base de apoyo, quedó reducido a un pequeño partido de ancianos duros, incapaz ya de ejercer influencia política.\n\nEn vez de eliminar al adversario con fuerza, Makoto absorbió su poder desde el corazón y se infló a sí misma. Fue la victoria más astuta y perfecta al estilo de Hanuma Makoto."
 GEM_makoto_story.11.a: "¡Por la victoria!"

 GEM_makoto_story.12.t: "Los cuernos son las nuevas alas"
 GEM_makoto_story.12.desc: "En las calles de Hesse, ya terminada la marcha del Frente Juvenil Corporativista, Hans y Fritz se apoyaban en un muro observando la avenida vacía.\n\nFritz habló primero.\n\"Oye… a veces siento que la gente de Gehenna es de verdad muy distinta a nosotros.\"\n\nHans asintió.\n\"Ni me lo digas. Son fuertes como bestias, comen cosas rarísimas… y para empezar, ¡tienen cuernos en la cabeza! Parecen demonios.\"\n\nFritz se quedó pensando un instante, y luego sonrió de lado.\n\"¿Demonios? No sé. Últimamente, esos cuernos me parecen… bastante geniales.\"\n\n\"¿Qué?\"\n\n\"Piénsalo. El Führer también los tiene, ¿no? Es la más fuerte y la que guía a todos. Es como… un símbolo de poder.\"\n\nHans se quedó sin palabras por lo absurdo, y luego se echó a reír.\n\"Jaja, símbolo de poder… oye, dicho así, suena convincente.\"\n\nLas risas de los dos jóvenes resonaron un momento en la calle vacía. Sin darse cuenta de cómo estaba cambiando su patria."
 GEM_makoto_story.12.a: "Algo que está cambiando."

 GEM_makoto_story.13.t: "En nombre de lo celestial"
 GEM_makoto_story.13.desc: "La plaza de Hesse, ya caída la noche, brillaba como si fuera mediodía por decenas de miles de antorchas. Pero esas llamas no eran el naranja normal: ardían en un púrpura siniestro, como si quemaran azufre de Gehenna.\n\nEn el centro de la plaza, una enorme hoguera devoraba los restos de una civilización “inferior”. Libros viejos del liberalismo alemán se mezclaban con textos teológicos de Trinity y revistas científicas de Millennium, volviéndose ceniza en conjunto.\n\nLa columna que marchaba entonaba primero cantos militares antiguos germanos y luego cambiaba a un himno de guerra de Gehenna, intenso y peculiar, en su lengua. Un alto dirigente, desde el estrado, proclamó que “la sangre pura nórdica debe purificarse con el fuego sagrado de Hinom, y solo el destino de dos grandes naciones tiene derecho a gobernar este mundo”.\n\nEste es el primer ritual que anuncia el nacimiento de la “civilización nórdico-hinom”. Donde antes ardían la razón y la lógica, nació una ideología cargada del odio del Estado."
 GEM_makoto_story.13.a: "El nacimiento del segundo mal."

 GEM_makoto_story.14.t: "Detrás del estrado"
 GEM_makoto_story.14.desc: "El discurso fue sorprendentemente corto y conciso. Hanuma Makoto terminó una declaración general de que “respetará el sistema de 1933 para mantener la estabilidad y el orden del Estado alemán”, y bajó con prisa del estrado. Los burócratas alemanes se quedaron desconcertados por esa inesperada proclamación de “status quo”, pero las ejecutivas de Manmajeon se dispersaron como si ya lo conocieran.\n\nMotomiya Chiaki siguió a Makoto hacia la sala de descanso. Ahí ya la esperaba Tanga Ibuki, con crayones en la mano.\n\n\"¡Makoto! ¡Te tardaste! ¡Iba a dibujar con Ibuki!\"\n\n\"¡Kikikik! Te hice esperar, Ibuki. Es hora de mostrar el gran espíritu artístico de esta yo… ¡Ah! ¡Los crayones no van por ahí!\"\n\nChiaki sonrió al ver a Makoto toda torpe y a Ibuki riéndose con inocencia. Más que el enorme “logro” de gobernar Alemania, Makoto se veía mucho más metida en jugar con Ibuki. Presionando el obturador, Chiaki pensó: ajajá, así sí parece nuestra presidenta."
 GEM_makoto_story.14.a: "¡Esto sí es una 'exclusiva'!"

 GEM_makoto_story.15.t: "Cuando sale el nuevo sol"
 GEM_makoto_story.15.desc: "\"¡Kikikik! ¡Mis queridas compañeras, y… alemanes que serán mis nuevos súbditos! ¿Creían que esta yo se conformaría con el orden viejo de Alemania? ¡Qué insensatez!\"\n\nDesde el balcón del Reichstag, Hanuma Makoto gritó hacia la plaza donde se mezclaban estudiantes de Gehenna y burócratas alemanes de rostro tenso.\n\n\"¡Ustedes, alemanes, estaban atrapados en la prisión aburrida llamada ‘orden’! ¡Pero Makoto-sama los liberará con sus propias manos de esas cadenas rancias! ¡No encerraré a Gehenna en una academia estrecha! ¡Convertiré a toda Alemania en nuestra gran Gehenna!\"\n\nEn un lado de la plaza, estallaron vítores. Las estudiantes del Club de Investigación Gourmet anotaron “un nuevo horizonte gastronómico”, y el Club de Desarrollo de Aguas Termales ya empezaba a medir el terreno cerca del parlamento.\n\n\"¡A partir de hoy aprenderán la verdadera ‘libertad’! ¡Explosiones! ¡Traiciones! ¡Y lucha interminable! ¿No es eso el verdadero motor del progreso? ¡Su cultura vieja renacerá bajo nuestro gran caos! ¡Kishishit!\"\n\nCuando terminó el discurso, la plaza se partió: el clamor eufórico de Gehenna contra el silencio horrorizado de los alemanes. Iroha recibió a Makoto al bajar, apretándose la sien.\n\n\"Agh… presidenta. Convertir a toda Alemania en Gehenna es cientos de veces más fastidioso que solo abrir una academia… Ahora voy a tener que limpiar accidentes de explosiones por todo el país…\""
 GEM_makoto_story.15.a: "Creo que es la decisión correcta."

 GEM_makoto_story.16.t: "La nueva posición de Gehenna"
 GEM_makoto_story.16.desc: "En el despacho del Reichstag, el Führer Hanuma Makoto revisaba documentos con satisfacción, como encarnación viva de la voluntad del “pueblo Gehenna-germano”. Había tomado toda Alemania, pero no olvidaba la fuerza que la sostenía: Gehenna.\n\n\"¡Kikikik! La lealtad de los alemanes está asegurada, ¡pero mi verdadera espada son las compañeras de Gehenna! ¡Iroha!\"\n\n\"Agh… ¿me llamó, mi Führer? ¿Qué cosa fastidiosa toca ahora…?\"\n\nCuando Iroha entró con una carpeta, Makoto señaló un enorme mapa de Alemania.\n\n\"¡Vamos a nombrar en masa a estudiantes de Gehenna en los puestos administrativos clave y en el mando militar de todo el país! Para dirigir este gran imperio, no bastan los viejos burócratas alemanes: necesito ‘los de verdad’, mis manos y mis pies.\"\n\n\"¿Eh? Pero eso va a provocar la reacción de los alemanes…\"\n\n\"¿Reacción? ¡Kishishit! ¿Quién se atrevería a oponerse a mi decisión a estas alturas? Pronto lo entenderán: el estilo de Gehenna es la fuerza más eficiente y más poderosa para conducir este imperio. ¡Prepara los procedimientos ya!\"\n\nIroha, intuyendo el trabajo que se apilaría como montaña, suspiró profundamente… pero los ojos de Makoto ya ardían mirando hacia el siguiente logro."
 GEM_makoto_story.16.a: "¡Este imperio se completará con la fuerza de dos pueblos!"

 GEM_makoto_story.17.t: "El trabajo del partido"
 GEM_makoto_story.17.desc: "En el despacho del Reichstag, el Führer Hanuma Makoto, líder del recién definido “pueblo Gehenna-germano”, bostezó de aburrimiento mientras revisaba documentos. Conquistar Alemania había sido divertido… pero una vez en la cima, el trabajo administrativo repetitivo era insoportable.\n\n\"Kikikik… ¿Creen que Makoto-sama se volvió Führer para aprobar nimiedades así? ¡Iroha!\"\n\n\"Agh… ¿me llamó, mi Führer? ¿Qué toca hoy…?\"\n\n\"¡Delega todo este trabajo práctico fastidioso al sistema de liderazgo colectivo del ‘Partido Patriota Alemán de Corporativismo Nacional’! ¡Ya les di un cargo, así que tendrán que trabajar, ¿no?!\"\n\nIroha la miró con ojos sorprendidos.\n\n\"¿Eh? ¿Pero va a delegar el poder del Führer al partido…?\"\n\n\"¡Cállate! Un gran líder no debe quedarse atrapado en el trabajo del día a día: ¡debe concebir logros mayores! ¡Desde hoy me concentraré en cosas más importantes! Por ejemplo… sí, ¡tendré que aumentar el tiempo para jugar con Ibuki! ¡Kishishit!\"\n\nMakoto se levantó de un salto y salió del despacho. Iroha, sola, alternó la mirada entre el “aumento de presupuesto para la sala de juegos exclusiva de Ibuki” que Makoto acababa de firmar y la montaña de documentos prácticos que ni siquiera había abierto… y suspiró hondo."
 GEM_makoto_story.17.a: "Agh… ¿cómo acabamos así?"

 GEM_makoto_story.18.t: "Presidenta del Estado Hanuma Makoto"
 GEM_makoto_story.18.desc: "En el Reichstag, una vez más, ondeó la bandera tricolor negro-rojo-oro. Era el día del discurso de investidura de Hanuma Makoto, que abandonó el título de “Führer” y aceptó el cargo de “Presidenta del Estado”.\n\n\"¡Kikikik! ¡Mis grandes súbditos! ¡Los símbolos viejos han sido purgados! ¡Pero los logros de un verdadero líder no se ocultan detrás de un símbolo! ¿Qué importa el nombre? ¿‘Führer’ o ‘Presidente’?\"\n\nMakoto gritó desde el balcón a la plaza. Su voz estaba llena de confianza.\n\n\"¡Solo importa una cosa! ¡Que quien está aquí de pie es Hanuma Makoto-sama! Creerán que han encontrado estabilidad bajo este tricolor… pero no lo olviden: el corazón de este Estado sigue dentro del puño de esta yo. ¡Kishishit! ¡Mis logros empiezan ahora!\"\n\nAbajo, Chiaki apretó el obturador con ganas. \"¡Ajajá! ‘Líder moderada proclama una nueva Alemania’… ¡es un titular perfecto!\"\n\nA su lado, Iroha se apretó la cabeza. \"Agh… cambiarle el nombre no cambia nada. Esa personalidad sigue igual… y a mí solo me van a aumentar los trabajos fastidiosos.\""
 GEM_makoto_story.18.a: "Los logros no se construyen en una sola noche."

 GEM_makoto_story.19.t: "Política parlamentaria"
 GEM_makoto_story.19.desc: "\"¡Maldita sea! ¡Esto no era así! ¡Creí que el puesto de ‘Presidenta del Estado’ sería más grande y más genial!\"\n\nHanuma Makoto empujó con irritación los acuerdos de negociación de coalición y las actas parlamentarias apiladas sobre el escritorio. El plan de eliminar al Partido Nazi y convertirse en una presidenta “moderada” había salido tal cual… pero ¿había sido insuficiente su logro? En vez de ser una gobernante absoluta, terminó atrapada por la molesta “política parlamentaria”.\n\n\"Kikikik… ¿se atreven a exigirme que modifique el presupuesto? A este y a aquel los voy a purgar…\"\n\n\"Agh… Presidenta. Es que con el ‘Partido Patriota Alemán de Corporativismo Nacional’ no alcanza la mayoría por sí solo, no hay de otra. Mire… los diputados de los socios de coalición están esperando…\"\n\nIroha asomó la cabeza por la puerta, hablando como si le diera pereza.\n\n\"¡Cállate! ¡Justo estaba por concebir una idea revolucionaria para conquistar Kivotos! ¡Reunirme con esos insignificantes… qué pérdida de tiempo!\"\n\n\"¡No puede llamarles ‘insignificantes’, Presidenta!\" Chiaki se metió de golpe haciendo estallar el flash. \"‘Presidenta Hanuma Makoto critica de frente a sus socios de coalición: ¿se avecina un desastre político?’ Ajajá, ¡esto sí es una exclusiva!\"\n\n\"¡Ugh… uaaah! ¡Quita esa cámara ahora mismo!\"\n\nMakoto explotó de rabia ante la realidad de que su gran logro estaba siendo frenado por un simple juego parlamentario."
 GEM_makoto_story.19.a: "¡M-mi logro… el logro de esta yo…!"

 GEM_makoto_story.20.t: "Suspensión de poderes"
 GEM_makoto_story.20.desc: "Al amanecer de hoy, sin que nadie lo anticipara, el Consejo de Regencia de Gehenna movilizó por sorpresa a parte del ejército y de fuerzas armadas, y suspendió la autoridad de la regente Hanuma Makoto.\n\nAsí, la “Unión de los Dioses” de Hanuma Makoto finalmente llegó a su fin. El Consejo Federal, reorganizado con nobles germánicos y conservadores de Gehenna, concluyó que sus logros delirantes estaban llevando al país entero hacia la ruina.\n\nAhora, sobre estas ruinas, debemos elegir a una nueva líder para reconstruir el orden. ¿Quién alzará una voz racional capaz de reemplazar su locura?"
 GEM_makoto_story.20.a: "Yozakura Kirara está recibiendo el fervor del pueblo."
 GEM_makoto_story.20.b: "¡Es hora de que actúe el Alto Mando de las Fuerzas de Defensa!"
 GEM_makoto_story.20.c: "…Natsume Iroha va a arreglar este desastre."

 GEM_puppet_events.1.t: "El destino de [GEM_puppet_target.GetName]"
 GEM_puppet_events.1.desc: "Se ha establecido un Comisariado del Reich en la región de [GEM_puppet_target.GetName], y debemos nombrar a una persona capaz de controlar esta zona. El bando de [ROOT.GetLeader] desea colocar a una figura de línea dura como gobernante, pero quizá la respuesta sea simplemente nombrar a alguien más conciliador, o incluso promover a un local."
 GEM_puppet_events.1.a: "Necesitamos a una estudiante de Gehenna en quien podamos confiar."
 GEM_puppet_events.1.b: "Formemos un gobierno cercano a los locales."


 GEM_satsuki_story.1.t: "Decidir el nombre del país"
 GEM_satsuki_story.1.desc: "Todo marchaba con normalidad. La vieja cáscara llamada «Alemania» había sido tomada con éxito, y el Proyecto NK Ultra estaba ajustando por completo la conciencia de las masas bajo el nuevo orden. Pero… una nueva era siempre necesita nuevos símbolos.\n\nKogyoku Satsuki recorrió con la mirada los tres expedientes colocados sobre su escritorio. Eran los nombres propuestos para el nuevo Estado por el Departamento de Inteligencia.\n\nApoyando la barbilla en la mano, Satsuki se sumió un instante en sus pensamientos. Los tres nombres, cada uno a su manera, estimulaban la psicología colectiva y lograban grabar con eficacia la identidad nacional. No había una diferencia esencial. Al final, no era más que una cuestión de qué tipo de «atmósfera» se deseaba proyectar.\n\n«Je, je… Elija el que elija, no habrá una gran diferencia a la hora de guiar a las masas. Lo importante es el simbolismo que encierra el nombre. Esto es puramente… una cuestión de mi “gusto”. Bien, ¿con qué nombre registraremos esta nueva era?»"
 GEM_satsuki_story.1.a: "Hyperbórea suena bien."
 GEM_satsuki_story.1.b: "Thule suena bien."
 GEM_satsuki_story.1.c: "Decidámoslo explicando su significado."

 GEM_satsuki_story.2.t: "Una fusión histórica"
 GEM_satsuki_story.2.desc: "La plaza estaba llena de un fervor extraño. Las banderas de la Sociedad Pandemonium y la esvástica, antiguo símbolo del Estado alemán, ondeaban una junto a la otra. Bajo aquellos dos símbolos contradictorios, la multitud reunida lanzaba un clamor prometido, como si todos compartieran una sola voz.\n\nEl representante del Partido Nazi subió a la tribuna y clamó por la «gloria aria», pero en su voz no había rastro alguno de odio. Cuando terminó su discurso, la presidenta del Pandemonium, Kogyoku Satsuki, subió en silencio al estrado. Su voz resonó suavemente por toda la plaza a través de los altavoces.\n\n«Mírenlo. El odio y el conflicto han desaparecido. El caos de Gehenna y las heridas de Alemania han sanado, y por fin hemos alcanzado la armonía bajo una sola voluntad. Bajo el nombre de la “Gran Federación Germánica de la Libertad”, la humanidad y Kivotos recibirán una paz eterna».\n\nAl concluir el discurso, la plaza volvió a llenarse de vítores cuidadosamente ajustados y de un silencio que sofocaba cualquier desconcierto. Al oír aquel sonido, Satsuki sonrió con sinceridad. Fanática, dictadora… no le importaba cómo la llamara el mundo. Ellos no lo entenderían. Un mundo perfecto sin conflictos, disputas ni tristeza. Si para crear un mundo pacífico y armonioso donde todos fueran felices había que arrebatar de buen grado una pequeña porción del libre albedrío individual, entonces valía la pena. Eso, precisamente, era el verdadero bien."
 GEM_satsuki_story.2.a: "Gehenna y Alemania, unificadas."

 GEM_satsuki_story.3.t: "Una conversación en una tarde tranquila"
 GEM_satsuki_story.3.desc: "Era una tarde apacible. Kogyoku Satsuki observaba en silencio, desde su despacho presidencial, el paisaje ordenado de Gehenna que se extendía tras la ventana. Ya no se oían explosiones ni disparos. Era el mundo perfectamente armonioso que había soñado.\n\nEn ese momento, la puerta del despacho se abrió de golpe y Hanuma Makoto irrumpió en la sala.\n\n«¡Satsuki! ¡Ha llegado esta gran Makoto! ¡Ki, ki, ki! El mundo que has creado es demasiado aburrido. ¡No hay explosiones! ¡No hay conspiraciones! ¡Ni siquiera cuando intento planear la conquista de Kivotos nadie me toma en serio!»\n\nMakoto resopló con desdén y se acercó a la ventana. Tras observar durante un rato a los estudiantes que transitaban por la calle en silencio, murmuró como dejándolo caer:\n\n«…Es terriblemente soso. Pero bueno, lo admitiré. Es algo que ni siquiera yo, Makoto-sama, pude lograr. Convertir este caos llamado Gehenna… en algo realmente silencioso».\n\nMakoto se giró hacia Satsuki y, por primera vez, la miró con unos ojos que no estaban llenos de burla, sino de una emoción extraña.\n\n«Y sin usar trucos cobardes como la hipnosis. …¡Ki, ki, ki! Nada mal, Kogyoku Satsuki».\n\nAl escuchar esas palabras, Satsuki contuvo la respiración por un instante. El reconocimiento puro, sin ninguna coerción, proveniente de la boca de Makoto, su mayor objetivo y la encarnación misma del caos de Gehenna. Aquello conmovió su corazón más profundamente que los elogios perfectamente ajustados de millones de personas. En ese instante, Satsuki sintió por primera vez que su “Estado pacífico” estaba verdaderamente completo."
 GEM_satsuki_story.3.a: "…Lo siento."

 GEM_satsuki_story.4.t: "La última sujeto de prueba"
 GEM_satsuki_story.4.desc: "Todo era perfecto. Gehenna, o mejor dicho, el mundo que ella había recreado, resonaba en paz como una gigantesca sinfonía sin una sola nota discordante. En los rostros de los ciudadanos que se veían a través del enorme monitor del despacho no había ni una pizca de preocupación. Al contemplar aquella escena, Kogyoku Satsuki sintió un profundo agotamiento. Todos eran felices, pero la única persona que debía diseñar y sostener toda esa felicidad, la única que cargaba con el peso del mundo, era ella misma.\n\nJe… se le escapó una risa. En este mundo perfectamente ajustado, la única fuente de disonancia era ella. Todos estaban en calma, excepto ella, que recordaba el pasado, dudaba y sufría bajo el peso de todo aquello. Para completar el sistema, debía eliminar la última variable restante: “yo”. No podía haber una justificación más perfecta. Sí, esto sería el verdadero significado de la “finalización”.\n\n…La Satsuki de antaño jamás habría llegado a esta conclusión. Pero tras años cargando sola con todo, estaba demasiado cansada. En silencio, se dirigió al despacho presidencial. Se sentó en el sillón del presidente. No, en la silla destinada a la última sujeto de prueba, y alzó el péndulo que siempre llevaba consigo, aunque hacía tiempo que casi no lo usaba."
 GEM_satsuki_story.4.a: "Y entonces, el mundo se volvió perfectamente silencioso."

 GEM_satsuki_story.5.t: "La penitente de pesada culpa"
 GEM_satsuki_story.5.desc: "La tribuna estaba envuelta en un pesado silencio. Todas las figuras clave de Gehenna, junto con los líderes de la oposición que antaño habían sido considerados enemigos, se habían reunido en un mismo lugar. La presidenta Kogyoku Satsuki tomó el micrófono con manos temblorosas, dejando a un lado el discurso preparado. Incapaz de alzar la vista hacia el público, inclinó la cabeza hacia el suelo.\n\n«Hoy… me presento ante ustedes para expiar mis errores. Bajo el nombre de la paz, pisoteé su libre albedrío mediante el Proyecto NK Ultra. Es un pecado imperdonable. Pero… si detuviéramos este sistema de golpe, no haríamos más que regresar al horrible caos del pasado que apenas logramos sellar. Por ello… a partir de este momento, ceso de forma inmediata y permanente toda interferencia mental sobre todos los legisladores aquí presentes. En cuanto al público general, prometo reducir gradualmente el proyecto para mantener la estabilidad social y sustituirlo por una comunicación auténtica».\n\nTras terminar su disculpa, Satsuki ya no pudo articular palabra y solo movió los labios en silencio.\n\nSentada entre el público, Iroha sintió de repente un mareo. «Ah… con razón todo iba demasiado bien». Aquella vaga sensación de extrañeza, la armonía antinatural con la que todos se movían al unísono… Al darse cuenta de que no se debía a su propia apatía, sino a los restos de un tenue lavado de cerebro, esbozó una sonrisa amarga.\n\nQuien rompió el pesado silencio fue Hanuma Makoto.\n\n«¡Ki, ki, ki! ¿De qué sirve disculparse ahora? ¡Lo importante es lo que viene después! ¡A partir de ahora, sin usar esos trucos cobardes, dirígeme Gehenna cara a cara y en igualdad de condiciones, conmigo, Makoto-sama!»\n\nAnte su clara exclamación, la sala se agitó. Las miradas se dirigieron al representante del Partido Nazi, Anton Drexler. Todos esperaban su furia, pero él se levantó lentamente apoyándose en su bastón.\n\n«…Nuestro partido ha decidido aceptar la propuesta de la presidenta. Los miembros deberán acatarla».\n\nFue una declaración unilateral. Los militantes tras él estaban llenos de conmoción y descontento, pero no se atrevieron a oponerse ante la mirada firme de Drexler. Él lo sabía: sin esta extraña unificación, todos habrían perecido. Remover el pasado era lo mismo que renunciar al futuro.\n\nPor fin, Satsuki alzó la cabeza. En sus ojos había lágrimas, pero también una nueva determinación."
 GEM_satsuki_story.5.a: "Todo cambio no es inmediato, pero sí seguro."

 GEM_satsuki_story.6.t: "¡Bienvenidos al Instituto de Psicología de Gehenna!"
 GEM_satsuki_story.6.desc: "El auditorio estaba repleto de la emoción y las expectativas de los estudiantes de nuevo ingreso. Quien subió al estrado fue la presidenta del consejo estudiantil y directora del instituto, Kogyoku Satsuki. Con una suave sonrisa, tomó el micrófono.\n\n«Queridos estudiantes de primer año, les doy mi más sincera bienvenida. Tal vez hayan oído aterradores rumores sobre la “antigua Gehenna”: una era de caos donde cada día resonaban disparos y las peleas entre clubes no tenían fin».\n\nUna breve tensión recorrió la sala, pero Satsuki continuó hablando con una voz amable.\n\n«Pero mírennos ahora. Nuestro instituto es diferente. Aquí, en el “Instituto de Psicología de Gehenna”, lo primero que aprendemos es a comprender nuestro propio corazón y el de los demás. Porque los conflictos nacen de los malentendidos, y los malentendidos nacen de la ignorancia. Je, je… cuando se conoce la causa, la solución es sencilla».\n\nSus palabras tenían una extraña fuerza persuasiva. Los estudiantes asentían sin darse cuenta.\n\n«De ahora en adelante vivirán experiencias maravillosas. La ansiedad y las preocupaciones de su corazón se derretirán como la nieve, podrán relacionarse con cualquiera de forma natural y todos juntos crearán una vida estudiantil alegre y unida… Estos días ideales son lo que promete nuestra academia. Este es el primer paso hacia el “inconsciente ordenado”. Ahora, ¡disfruten al máximo de su radiante juventud! ¡Su historia no ha hecho más que comenzar!»\n\nAl terminar el discurso, el auditorio se llenó de un aplauso perfectamente unificado y entusiasta, como si todos acabaran de confirmar una misma promesa."
 GEM_satsuki_story.6.a: "Al mirarla a los ojos, sentí que me esperaba una vida académica perfecta."

 GEM_satsuki_story.7.t: "Preludio del orden"
 GEM_satsuki_story.7.desc: "El mundo estaba sumido en una niebla gris e indiferente, y la despiadada tiranía llamada realidad hería a todos con sus aristas afiladas. Todas las melodías eran ruidos que aullaban sin control, y todas las danzas no eran más que forcejeos que se desgarraban entre sí.\n\nEntonces, apareció una afinadora.\n\nElla no cortó las disonancias con una espada. En su lugar, acarició una por una las cuerdas de cada alma, reajustándolas al tono más sereno y hermoso. No destrozó la dura realidad con un martillo. En cambio, sembró semillas de orden perfecto en cada corazón, haciendo que esas aristas afiladas se desgastaran por sí solas.\n\nMiren. La niebla se disipa y el tirano pierde su trono. Todas las voces que aullaban sin control se convierten en un gran coro, y los forcejeos que causaban heridas pasan a ser una gigantesca danza colectiva cuidadosamente coreografiada.\n\nY así canta la leyenda. Que frente al gran mal de la indiferencia y la realidad, existió una heroína de una era que salvó al mundo no con espadas, sino con susurros; no con destrucción, sino con armonía. Este mundo silencioso que ella creó es la sinfonía eterna que continúa interpretando."
 GEM_satsuki_story.7.a: "Fin de un capítulo."


 GEM_germany_story.1.t: "Los dados han sido lanzados"
 GEM_germany_story.1.desc: "Nuestro nuevo Estado se ha levantado sobre la fuerza, pero todavía no ha recibido el juicio del pueblo. Cada vez se hacen más fuertes las voces de los idealistas que sostienen que la verdadera legitimidad no nace del cañón de un fusil, sino de las urnas. Ahora nos encontramos ante una elección crucial. ¿Debemos celebrar unas elecciones generales libres para todos los alemanes y así legitimar nuestro dominio, o concluir que aún es demasiado pronto y priorizar la estabilidad?\n\nSi forzamos la elección, la victoria asentará nuestro gobierno sobre una base sólida. Pero la derrota significaría perderlo todo. En cambio, si escogemos la estabilidad, mantendremos el poder, pero quizá carguemos para siempre con la etiqueta de ser “los que temen a las elecciones”. Es, literalmente, una apuesta por el destino mismo de la nación."
 GEM_germany_story.1.a: "Me someteré al juicio del pueblo. Celebren las elecciones."
 GEM_germany_story.1.b: "La Ley Habilitante ha sido extendida."

 GEM_germany_story.2.t: "Victoria al filo del amanecer"
 GEM_germany_story.2.desc: "La noche de las elecciones, el aire en la sede de la coalición de la Manmajeon estaba saturado de humo de tabaco y nerviosismo. A medida que avanzaba el conteo, la situación se volvió impredecible. En las ciudades arrasábamos, pero en las zonas rurales se volcaban votos hacia el Partido Nazi y los partidos conservadores. Las encuestas de salida, que habían dado por segura nuestra victoria, se invirtieron, y la sombra de la derrota se hizo cada vez más densa.\n\nA las cuatro de la madrugada, cuando todos habían caído en un silencio sepulcral, llegó el resultado del último centro de conteo y alguien murmuró: «…Ganamos». Con esas dos palabras, un suspiro de alivio, reprimido durante horas, llenó toda la sala. No fue una victoria aplastante: fue un triunfo agónico, logrado tras un duelo que helaba la sangre, por apenas unos miles de votos.\n\nEn lugar de vítores, cayó un silencio aún más profundo. Habíamos ganado, pero al mismo tiempo confirmamos cuán profundamente dividido estaba este país. Los dados cayeron de nuestro lado, sí, pero apenas por una sola cara. Y ahora se nos ha impuesto una pesada responsabilidad: convertir esta victoria precaria en una verdadera unidad."
 GEM_germany_story.2.a: "Al menos por ahora, contamos con apoyo."

 GEM_germany_story.3.t: "Un susurro tras el telón"
 GEM_germany_story.3.desc: "En lugar de la apuesta pública que sería una elección, realizamos una encuesta nacional a través de nuestra organización secreta de inteligencia. Hoy, un informe sellado fue depositado sobre el escritorio del liderazgo. Al abrirlo con manos temblorosas, el resultado fue… increíblemente positivo. El informe concluía que nuestra coalición gozaba de un apoyo abrumador en todas las clases y regiones.\n\nPero antes que la alegría, llegó una duda helada. ¿Es esto verdad? ¿De verdad hemos conquistado el corazón del pueblo? ¿O se trata de la adulación del Departamento de Inteligencia para tranquilizarnos, o de una trampa sutil del enemigo para hacernos bajar la guardia?\n\nEl resultado era tan perfecto que, precisamente por eso, no podíamos evitar desconfiar de su veracidad. Evitamos el riesgo de las elecciones, pero a cambio quedamos atrapados en una niebla donde ni siquiera sabemos qué es la “verdad”. ¿Somos gobernantes sabios, o unos necios que se dejan engañar por la mentira más dulce?"
 GEM_germany_story.3.a: "…¿Deberíamos creer este informe?"

 GEM_germany_story.4.t: "Por suerte, la Manmajeon cuenta con apoyo"
 GEM_germany_story.4.desc: "Durante un tiempo tuvimos que contener la respiración y observar los resultados. Nos preparamos para lo peor: protestas masivas, el surgimiento de organizaciones clandestinas, incluso una guerra civil. Pero no ocurrió nada.\n\nLas calles estaban tranquilas y los ciudadanos volvieron a su rutina. Incluso el Partido Nazi, que más nos preocupaba, en vez de llamar a la revolución, levantaba pancartas en el parlamento y cumplía el papel de una oposición legal. Entonces lo comprendimos: los alemanes no desean el caos. No querían los espectros del pasado, sino un líder fuerte que los condujera a un futuro estable.\n\nY ese líder éramos nosotros. Nuestro gobierno ya no se tambalea."
 GEM_germany_story.4.a: "Nuestra legitimidad ya no admite dudas."

 GEM_germany_story.5.t: "Un compromiso para sobrevivir"
 GEM_germany_story.5.desc: "Sala de reuniones de la sede central del Partido Nazi. El humo de tabaco era denso y el ambiente, pesado. Ya no eran los únicos dueños de este país. Con la aparición del gigantesco partido gobernante llamado “Partido Popular de la Gehenna Unificada”, ahora no eran más que “la primera fuerza de oposición alemana”.\n\nEl líder del partido, de pie ante el estrado, recorrió con la mirada a los cuadros dirigentes con gesto endurecido.\n\n«En el pasado, convertimos en enemigos a todo lo que no éramos nosotros. Esa fue nuestra fuerza. Pero los tiempos han cambiado. El “Gran Traslado” sacudió nuestro mundo, y Gehenna, esa potencia extranjera, ahora es nuestro socio federal. En esta situación, el viejo y rancio nacionalismo germánico ya no basta para sobrevivir».\n\nHizo una pausa, comprobando si alguien tenía objeciones.\n\n«El Zentrum, el Partido Popular… incluso aquellos que fueron nuestros rivales, al final también son alemanes. A los ojos de Gehenna, todos somos el mismo “alemán”. Entonces nosotros también debemos actuar como tal. Más importante que la pureza ideológica es la supervivencia y la iniciativa de nuestro pueblo. Desde hoy, acabaremos con la fragmentación y renaceremos como una única oposición gigantesca que abarque a todos los partidos alemanes».\n\nEn la sala cayó un silencio. No era un acuerdo entusiasta, sino la férrea determinación de quienes aceptan una realidad amarga."
 GEM_germany_story.5.a: "Por una sola Alemania."

 GEM_antinazi_preemptive_strike: "Golpe preventivo contra el nazismo"
 GEM_antinazi_preemptive_strike_desc: "La estrategia estatal federal de la Sociedad Pandemonium ha terminado deslizándose hacia el reconocimiento del nazismo, al punto de autoproclamarse como el propio Estado alemán. Debemos prepararnos para declarar la guerra contra la Pandemonium y los nazis rehabilitados, que pretenden poner a la Academia Gehenna y a todo Kivotos en manos de la vieja Alemania."

 GEH_preparations_for_operation_longsword_breaking_operation: "Operación Romper la Espada Larga"
 GEH_preparations_for_operation_longsword_breaking_operation_tt: "Desde el inicio de $GEH_preparations_for_operation_longsword_breaking_operation$ hasta que declaremos la guerra a [GEM.GetNameDef], podremos prepararnos durante §Y70 días§!. En cuanto expire el plazo de la misión, declararemos la guerra a [GEM.GetNameDef]."
 GEH_preparations_for_operation_longsword_breaking_operation_alt_tt: "§RNos prepararemos durante §Y70 días§! hasta que los países objetivo nos declaren la guerra. En cuanto expire el plazo de la misión, nos declararán la guerra.§!"

 GEH_event.1.t:0 "Convocatoria de emergencia"
 GEH_event.1.desc:0 "En un día de cálida luz solar, como cualquier otro, de pronto Kivotos se había trasladado a un mundo extraño.\nLo que se veía tras las ventanas de la sala de reuniones de la Manmajeon no eran los rascacielos familiares ni el brillante anillo del cielo.\nSalvo algunos edificios de Gehenna, solo se veían casas bajas y antiguas, como las que solo se describen en novelas.\n\nAl principio, los directivos de la Manmajeon observaban con ojos brillantes, como si les pareciera fascinante, pero pronto lo único que quedaba en sus miradas era el miedo.\n\nEn la sala de reuniones de la Manmajeon solo estaban Iroha, Ibuki y unos pocos directivos.\nEntonces, la puerta se abrió de golpe con un estruendo y alguien irrumpió en la sala.\n\n«¡Ki, ki, ki, convocatoria de emergencia~! ¡Iroha! ¡Reúne a todos los directivos de la Manmajeon!»\n«Haa… ni siquiera sé dónde está cada quien… qué fastidio.»\n\nIroha, harta de las órdenes de Makoto que ya le taladraban los oídos, lanzó a un lado la novela que estaba leyendo y se puso de pie.\n\nIroha empezó a traer de uno en uno a los directivos que se habían perdido por el campus de Gehenna, quedándose allí sin saber qué hacer.\n\nNada más empezar la reunión, Makoto, muy a su estilo, lanzó una afirmación rebosante de confianza:\n«¡Con este incidente, esos del Comité de Disciplina y Trinity deben estar sumidos en el caos! ¡Ahora es la oportunidad de barrerlos a todos! ¡Ki, ki, ki!»\n«Makoto-senpai… creo que no somos quienes para decir eso…»\n\nEn la sala, donde se oían murmullos, un directivo tembló de los labios y dio su opinión.\n\n«Dadas las circunstancias, deberíamos llamar хотя sea al Comité de Disciplina y discutirlo juntos…»\n\nAntes de que terminara, Makoto pateó la silla y se levantó gritando.\n\n«¿Qué estás diciendo? ¡Como acabo de decir, hay que arrancar al Comité de Disciplina de raíz!»\n\nAl final, la reunión terminó sin obtener ningún beneficio significativo…"
 GEH_event.1.a:0 "No sacamos gran cosa."

 GEH_event.2.t:0 "Inspección"
 GEH_event.2.desc:0 "Algunos edificios de Gehenna seguían en pie, pero la ciudad donde vivía la gente era completamente distinta.\nLos rascacielos habían desaparecido, y en su lugar estaban los estilos arquitectónicos de un país llamado Alemania que solo se veía en libros; ciudadanos que hablaban cosas extrañas; \nTodo eso era incomparable con el Kivotos que conocíamos antes de llegar a este otro mundo.\n\n«¿¡Qué demonios es todo esto!? ¡No es la Gehenna que yo conocía! ¡Iroha! ¡Explícalo!»\n«Uff… yo tampoco logro aceptar esta situación…»\n\nEn ese momento, Ibuki, que venía al lado, miraba con ojos redondos y brillantes.\n\n«¿Y estas comidas qué son?»\n\nAl fijarse bien, a diferencia de la comida habitual de Kivotos, había muchos platos grasosos y de gran tamaño.\n\nMientras tanto, los estudiantes de Gehenna, aunque no podían comunicarse, ya se estaban mezclando con la gente que originalmente vivía aquí."
 GEH_event.2.a:0 "La comida callejera estaba rica."

 GEH_event.3.t:0 "El problema del Ejército de Defensa"
 GEH_event.3.desc:0 "Los directivos que habían enviado de patrulla al distrito norte de Gehenna entraron a la sala con un semblante tan oscuro que parecía que iban a desplomarse en cualquier momento.\nTras servirles té caliente para calmarlos, decidieron escuchar la explicación con tranquilidad.\n\n«Bien, ¿y qué vieron? ¡¿No me digan que era Trinity?!»\n«Tampoco sería algo para sorprenderse, ¿no?»\n\nTras la frase de Makoto, cargada de expectativa, uno de los directivos por fin abrió la boca.\n\n«¡Hay gente con cascos extraños, armados, desplegados en el distrito norte de Gehenna!»\n\n«¿Qué? ¿¡No son ni Trinity ni el Comité de Disciplina?!»\n«¿¡Qué demonios están haciendo en nuestro territorio?!»\n\nEn medio del caos por el nuevo dato, la presidenta Makoto susurró para sí.\n\n«Ki, ki, ki… no sé quiénes son, pero si cooperamos con ellos, podríamos someter a la Tea Party y hacer que el Comité de Disciplina se quede calladito…»\n\nMakoto estaba teniendo pensamientos muy propios de Makoto, y, como era de esperarse, a diferencia de lo que ella imaginaba, ellos nos estaban hostigando.\n\n…Parece que no tienen intención de cooperar con nosotros. Cuanto más nos acercábamos, más alzaban sus fusiles como si fueran a matarnos, e incluso llegaron a disparar para intimidar.\n\n¿Será porque siempre llevamos armas?\n\nAlgunos de ellos nos miraban, asustados."
 GEH_event.3.a:0 "¡Es grave!"

 GEH_event.4.t:0 "Declaración de estado de emergencia"
 GEH_event.4.desc:0 "Tras comprender la situación del distrito norte, la Manmajeon volvió a reunirse.\n\n«Parece que cooperar no será tan fácil…»\n\nAnte una resistencia más fuerte de lo esperado, los hombros de Makoto caían abatidos.\n\nEntonces Iroha abrió la boca.\n\n«Dejemos de estar así y busquemos una contramedida realista, senpai ㅡㅡ»\n«¡Entonces hipnoticémoslos y conviertámoslos en los nuestros!»\n\nSatsuki estaba emocionada por mostrar el hipnotismo que investigaba.\n\n«Haa… eso no va a funcionar…»\n\nCon dos senpai tan desesperantes, a Iroha le empezó a latir la cabeza.\n\nEn una situación estancada, Makoto, que había estado sentada en silencio, abrió la boca.\n\n«¡Primero declaramos el estado de emergencia! ¡Cuando los ciudadanos sufran, lo correcto es que la Manmajeon lo resuelva!\n¡Y como es emergencia, también recortamos el presupuesto del Comité de Disciplina! ¡Recorte, recorte! ¡Ki, ki, ki!»"
 GEH_event.4.a:0 "¡Es hora de mostrar el prestigio de la Manmajeon!"

 GEH_event.5.t:0 "Inicio de negociaciones con el Ejército de Defensa"
 GEH_event.5.desc:0 "Tras declarar el estado de emergencia, y luego de discutirlo en reunión, la Manmajeon decidió intentar primero dialogar con ellos en el distrito norte.\n\n«Haa… qué fastidio…»\n\nColgaron una bandera blanca en el vehículo blindado Toramaru de Iroha, y varios estudiantes y directivos de la Manmajeon se dirigieron al distrito norte de Gehenna.\nMakoto se caló el sombrero aún más al recordar que llevaban bandera blanca, pero no había otra.\n\nAl llegar, el grupo de la Manmajeon se acercó lentamente a los soldados que montaban guardia.\nQuizá por la bandera blanca, no nos dispararon.\n\nGracias a que habían reclutado con antelación a estudiantes que estudiaban lenguas antiguas, pudimos entender lo que decían.\nSu país era el “Estado alemán”, y ellos se presentaron como una organización militar llamada el “Ejército de Defensa”.\nAdemás, afirmaron que la zona donde ahora se encontraba Gehenna era originalmente territorio del Estado alemán.\n\nTras presentarnos mutuamente, la Manmajeon y el mando del Ejército de Defensa iniciaron negociaciones, comenzando por aclarar malentendidos.\nPero, por alguna razón, el ambiente se mantuvo incómodamente tenso…"
 GEH_event.5.good_desc:0 "La delegación de la Manmajeon ha iniciado negociaciones con nosotros. Declararon que su objetivo es la armonía entre Gehenna y el Ejército de Defensa, y comenzaron la reunión con nuestros representantes. Estas negociaciones, destinadas a resolver y ajustar choques previos y diferencias entre ambas partes, requerirán muchísimo tiempo. Tras fijar algunos calendarios, la delegación de la Manmajeon regresó a Gehenna."
 GEH_event.5.bad_desc:0 "Hemos obtenido noticias de que la Manmajeon ha comenzado negociaciones con el Ejército de Defensa del norte. Esto puede suponer un golpe peligroso para nuestra posición, así que debemos obstaculizarlo o unirnos a la negociación."
 GEH_event.5.a:0 "Cooperar será inevitable."
 GEH_event.5.b:0 "Al menos escuchemos lo que tienen que decir."
 GEH_event.5.c:0 "Esto es grave."

 GEH_event.6.t:0 "Punto de negociación: incidente de lesiones a estudiantes"
 GEH_event.6.desc:0 "«(En alemán) ¡Alto! ¡Si se acercan más, abriremos fuego!»\n«¿Qué dicen esos? ¿Y qué son esas ropas raras?»\n«¿Y a mí qué? Si hasta con un cañón antiaéreo, con descansar un poco se pasa… ¿qué miedo da ese rifle?»\n«(En alemán) ¡Última advertencia! ¡No se acerquen!»\n«¡Oye~! ¡Esa es nuestra zona de Gehenna~! ¡No bloqueen el paso y háganse a un lado!»\n«(En alemán) ¡Maldita sea, abran fuego!»\n\nPara someter a estudiantes desprevenidos, bastaron unas cuantas balas. Los estudiantes, que desconocían los cambios en el misterio del Halo, no tenían razón para temerles a las balas, y acabaron recibiendo una lluvia de disparos.\n\nPor suerte, o quizá no, como el Ejército de Defensa no ajustó bien la mira, los estudiantes solo quedaron gravemente heridos.\n\n«Menos mal que pudimos evacuar rápido a los… no, a los heridos. Aunque no les dieron en puntos vitales, la hemorragia no fue poca.»\n\nDe hecho, alguien había mencionado este problema en una reunión de la Manmajeon antes de iniciar las negociaciones, pero en medio del caos lo habían olvidado.\nLa presidenta Makoto cayó en una duda: ¿debía ponerse del lado del Ejército de Defensa para fortalecer la cooperación, o ponerse del lado de los estudiantes como presidenta de Gehenna?\n\nLo correcto parece ser apoyar a los estudiantes, pero entonces es incierto qué postura adoptará el Ejército de Defensa.\nPor otro lado, si se apoya al Ejército de Defensa, se perderá la confianza de los estudiantes de Gehenna."
 GEH_event.6.a:0 "Ponte del lado del Ejército de Defensa."
 GEH_event.6.b:0 "Ponte del lado de los estudiantes."

 GEH_event.7.t:0 "Retirada de [FROM.FROM.GetName]"
 GEH_event.7.desc:0 "Debido a la reducción de nuestra influencia, no tuvimos más remedio que ceder [FROM.FROM.GetName] en la negociación. Quienes participaron parecieron aceptar el resultado, pero no pudimos evitar las críticas internas."
 GEH_event.7.a:0 "Nos arrinconaron en la negociación."

 GEH_event.8.t:0 "¡Hina rechaza la propuesta de negociación!"
 GEH_event.8.desc:0 "«Hola a todos, desde la Manmajeon tenemos un anuncio para ustedes, estudiantes. A partir de ahora, con el Estado alemán y…»\n\nAunque muchos puntos eran inadmisibles, al oír el anuncio de la Manmajeon que, en la práctica, desmantelaba el Comité de Disciplina, Sorazaki Hina apretó el puño con fuerza.\n\n«Así que al final van a salir con esto… Aко, prepárate. Vamos a la Manmajeon.»\n«¡Entendido, jefa!»\n«Iori, Chinatsu, ustedes también vengan.»\n\nAsí, el Comité de Disciplina se dirigió a la Manmajeon para expresar su oposición al resultado de la negociación.\n\n¡Bang! Hina pateó la puerta y entró en la sala de reuniones de la Manmajeon.\nAllí se habían reunido varios oficiales del Ejército de Defensa para consultas adicionales.\n\n«Ah, así que esa es la jefa del Comité de Disciplina, Sorazaki Hina.»\n«Ki, ki, ki, así es. Ellas están bajo la Manmajeon…»\n\nAntes de que terminara, Hina habló.\n\n«Me opongo a este resultado.»\n\nAl oírlo, los oficiales del Ejército de Defensa y los directivos de la Manmajeon empezaron a agitarse.\n\n«¿Qué… qué? ¡Esto ya lo ha decidido y está en marcha por orden de esta Makoto-sama! ¡No se puede cambiar!»\n«Disculpe, Makoto-sama, tengo entendido que el Comité de Disciplina es la fuerza armada más poderosa de Gehenna… ¿qué está pasando aquí?»\n\nHina continuó.\n\n«Ah. ¿Ejército de Defensa? Como acaban de oír, esta negociación se cancela.»\n\nLos oficiales del Ejército de Defensa, con expresiones incrédulas, salieron rápidamente de la sala.\nNadie sabe qué ocurrirá a partir de ahora…"
 GEH_event.8.a:0 "¡Hina…!!!"
 GEH_event.8.b:0 "El Comité de Disciplina no tiene relación con Gehenna."

 GEH_event.9.t:0 "Las actividades de orientación del Comité de Disciplina"
 GEH_event.9.desc:0 "La Manmajeon, centrada en las negociaciones, lo había olvidado: el Comité de Disciplina es la fuerza armada más poderosa de Gehenna.\nEn una Gehenna cada vez más caótica, el Comité de Disciplina incrementó su actividad acorde a la situación.\nLos estudiantes pensaban: ¿no es mejor el Comité de Disciplina, que mantiene el orden, que la Manmajeon, que intenta cooperar con el Ejército de Defensa que nos atacó?\nSin profesor y sin intervención del Consejo General Estudiantil, comenzó a extenderse la idea de que a la Manmajeon no le importaban en lo más mínimo los estudiantes de Gehenna.\n\n«¡Manmajeon, despierta!»\n«¡Makoto, piensa en nuestros estudiantes!»\n«¡El Comité de Disciplina es mejor que la Manmajeon!»\n\nSurgieron protestas contra la Manmajeon. Aún eran pequeñas, pero la gente empezaba a reunirse poco a poco.\n\nTal vez ocurra algo más “grave” de lo que se pensaba.\n\nAl darse cuenta tarde de la situación, la Manmajeon tuvo que tomar la siguiente decisión…"
 GEH_event.9.a:0 "Somételos."
 GEH_event.9.b:0 "Nos queda algo más importante."

 GEH_event.10.t:0 "Incidente de ataque a estudiantes"
 GEH_event.10.desc:0 "En un día despejado, dos estudiantes de Gehenna disfrutaban de un picnic en un bosque silencioso.\n\n«Como siempre, aquí está muchísimo mejor que la ciudad, toda revuelta~»\n«Pero… ¿esto no es el distrito norte? Los del Comité de Disciplina dijeron que no fuéramos hacia allá…»\n«¿Qué problema va a pasar tan adentro? Ni siquiera está tan lejos del distrito central~»\n\nMientras tanto, una unidad de reconocimiento del Ejército de Defensa, en misión de patrulla, estaba explorando el bosque donde estaban las estudiantes.\n\n«Sargento, allí se ven esas de Gehenna.»\n«…Por culpa de esas bastardas, mi Múnich fue ocupada…» El sargento les apuntó con el arma.\n«¿Sargento? ¿De verdad es necesario?»\n«Es un bosque poco transitado. ¿Qué importa?»\n\nAl final, el odio del sargento las alcanzó. El disparo claro y potente rompió el silencio del bosque, y el lugar se llenó de los gritos de las dos estudiantes.\n\nY, poco después, una estudiante que milagrosamente logró escapar llegó a la ciudad de Gehenna, arrastrando los pies y respirando con dificultad, cargando a su amiga a la espalda.\nPor suerte, gracias a la rápida respuesta del Departamento de Medicina de Emergencias, pudieron aplicar primeros auxilios, pero como la estudiante está inconsciente, todos solo pueden mirar, desesperados.\n\nA pesar de que la Manmajeon seguía impulsando la negociación, volvió a ocurrir un ataque a estudiantes. Algunos soldados del Ejército de Defensa atacaron a una estudiante inocente de Gehenna, y esta vez cayó en estado moribundo.\nSi llegara a morir, se produciría la primera muerte.\n\nAún no se ha difundido la noticia por toda Gehenna, pero la Manmajeon pretende encubrirlo en silencio para no afectar el progreso de la negociación.\nEn cambio, el Comité de Disciplina quiere descubrir la verdad, hallar al culpable y castigarlo.\n\nSi el caso se entierra, se controlará a los implicados y pasará en silencio con solo unos pocos enterados.\nSi se investiga y muchos estudiantes se enteran, el apoyo a la Manmajeon caerá, y el Comité de Disciplina será alabado."
 GEH_event.10.a:0 "Cúbrelo en silencio."
 GEH_event.10.b:0 "Investiga a fondo y encuentra al culpable."

 GEH_event.11.t:0 "Incidente de ataque a civiles"
 GEH_event.11.desc:0 "«¿Tenemos que vivir esquivando la muerte a manos de esos alemanes?»\n«¿Por qué solo nosotras tenemos que aguantar esto, por querer vivir con dignidad en la tierra de Gehenna?»\n\nEntonces, vieron a un alemán. Era un ciudadano común, que normalmente ni le gustaba ni le disgustaba Gehenna.\nLas estudiantes, desbordadas por el odio, lo arrastraron y lo dejaron incapaz de caminar.\n\nNo se sabe si llamarlo suerte, pero ejercieron la violencia en un lugar poco transitado.\nTras el incidente, por el reporte de un estudiante que pasaba, el Departamento de Medicina de Emergencias acudió rápidamente y pudo atenderlo,\npero parece que el rumor se está extendiendo entre los alemanes.\n\nAl recibir el informe, Iroha, de la Manmajeon, se agarró la cabeza y lamentó la orden de Makoto de “esconder todo lo malo”.\n\n«Haa… ¿hasta cuándo vamos a ocultarlo…? ¿Qué haremos si nos descubren…?»\n\nClaro, si esto también se oculta, hasta que terminen las negociaciones se calmará en silencio.\nPero si el Comité de Disciplina inicia una investigación, el prestigio de la Manmajeon caerá día tras día.\n\nCon las emociones cada vez más tensas, ¿qué deberíamos hacer?"
 GEH_event.11.a:0 "Cúbrelo en silencio."
 GEH_event.11.b:0 "Encuentra al culpable y discúlpate con la víctima."

 GEH_event.12.t:0 "Odio mutuo"
 GEH_event.12.desc:0 "Los rumores siempre se difunden. Al final, con las emociones de varios incidentes llevadas al extremo, comenzaron atentados de alemanes locales contra estudiantes.\n\nAl principio se limitaban a insultos o pequeñas protestas, pero la cosa se fue intensificando y empezaron a producirse daños directos.\nLes arrojaban comida a estudiantes que comían en restaurantes locales; en las calles aparecían grafitis de odio contra Gehenna;\nse colaban en el campus de Gehenna e intentaban provocar incendios… el nivel de violencia era mucho más grave.\n\nÚltimamente incluso circula el rumor de que han secuestrado a una estudiante y está desaparecida; solo podemos esperar que no sea cierto.\nYa estábamos confundidos por haber llegado a otro mundo, y el conflicto con los locales se agrava.\nAún no es como para sentir un terror absoluto, pero… muchos estudiantes quieren oír la postura de la Manmajeon."
 GEH_event.12.a:0 "Anuncia que, cuando terminen las negociaciones, el conflicto también disminuirá poco a poco."
 GEH_event.12.b:0 "Encuentra a la estudiante desaparecida."
 
 GEH_event.13.t:0 "Movimientos sospechosos del Comité de Disciplina"
 GEH_event.13.desc:0 "«¡Iroha! ¿Qué está haciendo ahora el Comité de Disciplina?»\n«Mm… últimamente los informes de actividad han sido escasos…»\n«¡Ki, ki, ki! ¡Al final deben haber quedado aplastadas por los esfuerzos de esta Makoto-sama!!»\n«¿No deberíamos investigarlo aparte…? Ugh, solo pensarlo me da flojera…»\n\nÚltimamente, los directivos de la Manmajeon no saben qué está haciendo el Comité de Disciplina.\nAlgunos dicen que quizá el Comité de Disciplina vaya a volcar a la Manmajeon.\n\nLa Manmajeon sabe que está perdiendo la confianza de los estudiantes por los disturbios recientes,\npero solo algunos directivos creen que el Comité de Disciplina esté relacionado con ello."
 GEH_event.13.a:0 "Investiga al Comité de Disciplina y averigua por qué han bajado su actividad."
 GEH_event.13.b:0 "No habrá ningún problema… por ahora."

 GEH_event.14.t:0 "El Ejército de Defensa entra en acción"
 GEH_event.14.desc:0 "«¡Presidenta!»\n\nAl oír el informe, la presidenta Makoto empezó a temblar de pies a cabeza.\nEl Ejército de Defensa del Estado alemán comenzó a avanzar centrado en el distrito norte de Gehenna, y formó un frente hasta la parte superior del distrito central.\nNos estaban apuntando.\n\nNo pasó mucho tiempo hasta que llegó una carta oficial del Estado alemán.\n«El resultado de la negociación es inválido y lamentamos que esta situación haya ocurrido.»\n\nEntonces, un directivo de la Manmajeon entró a la sala, pálido de miedo, y reportó un hecho aún más impactante.\n\n«¡P-Presidenta!! ¡Parece que el ejército alemán se está preparando para la guerra!»\n«¿¡Qué dijiste?!»\n\nLa sala de reuniones de la Manmajeon se convirtió en un caos al instante. ¿Qué significa que el ejército alemán va a invadir?\nComo el misterio del Halo ha disminuido, nosotros también можем morir si nos disparan.\n\n«Ki, ki, ki… entonces, ya que estamos, podremos limpiar tanto al Comité de Disciplina como al Estado alemán. ¡Prepárense para la guerra!»\n\nMakoto dijo cosas incomprensibles hasta el final, pero no se equivocaba en que la guerra no podía evitarse."
 GEH_event.14.a:0 "¡Estudiantes de Gehenna! ¡Prepárense para la guerra!"
 GEH_event.14.b:0 "Pero quizá aún quede una oportunidad para negociar."
 GEH_event.14.c:0 "No tiene nada que ver con nosotros."

 GEH_event.15.t:0 "¡Golpe de Estado del Comité de Disciplina!"
 GEH_event.15.desc:0 "Nuestra jefa del Comité de Disciplina, Sorazaki Hina, concluyó que ya no podía seguir viendo las acciones de la Manmajeon sin hacer nada.\nIgnoraron a los estudiantes que sufrían, encubrieron incidentes e intentaron cooperar a ciegas con unos alemanes de origen incierto.\nEl Comité de Disciplina, que había mantenido el orden de Gehenna, decidió gobernar directamente Gehenna para establecer el orden en este caos.\nLos estudiantes que la apoyan son, en la práctica, la mitad de Gehenna, o más, y juraron lealtad al Comité de Disciplina.\n\nLas consignas de protesta de los estudiantes, que antes eran «¡Manmajeon, despierta!», cambiaron a «¡Makoto, renuncia!».\nYa es hora de actuar.\n\n«Jefa, desplegaré a los combatientes del Comité de Disciplina.»\n«Vamos a llevar esto hasta el final, Makoto.»"
 GEH_event.15.bad_desc:0 "El comportamiento del Comité de Disciplina era sospechoso desde hacía tiempo. Pero eran un organismo subordinado a la Manmajeon.\nAunque fueran la fuerza armada oficialmente reconocida más poderosa.\n\nPero la situación cambió. Sorazaki Hina, esa que se hace llamar jefa del Comité de Disciplina, cruzó el río que no debía cruzar.\nPretender derribar Gehenna por su propio beneficio es absurdo.\n\n«Haa… al final iba a pasar…»\n«Ki, ki, ki… ¡Iroha! ¡Ha llegado el momento de usar eso de verdad!»\n«Sí… entendido… aunque me dé algo de vergüenza… Ultra-invencible blindaje Toramaru, ¡salida!»\n\nUn rencor inevitable… ha llegado el momento de poner fin a este conflicto."
 GEH_event.15.a:0 "¡Por el orden de Gehenna!"
 GEH_event.15.b:0 "¡Guerreros de la gloriosa Manmajeon!"

 GEH_event.16.t:0 "[FROM.GetName] ha aceptado suspender la guerra con nosotros"
 GEH_event.16.desc:0 "[FROM.GetName] ha aceptado las negociaciones de alto el fuego de Gehenna, iniciadas por la guerra contra otra gran potencia, y nuestra guerra ha entrado en un estado de tregua temporal. ¡La Academia Gehenna está lista para luchar contra el enemigo!"
 GEH_event.16.a:0 "¡Venceremos!"

 GEH_event.17.t:0 "El fin de la Manmajeon"
 GEH_event.17.desc:0 "Tras el uso de la fuerza por parte de la jefa del Comité de Disciplina, la Manmajeon desapareció sin dejar rastro, y Sorazaki Hina se ciñó la corona de laurel de Gehenna.\n\nAún queda mucho por hacer."
 GEH_event.17.a:0 "Bien."

 GEH_event.18.t:0 "Un problema de clubes que emerge"
 GEH_event.18.desc:0 "En Gehenna existen innumerables clubes, pero en la práctica no estaban bajo el control de la Manmajeon y causaban daños y problemas sociales al deambular por todas partes. Pero ahora que la Manmajeon ha pasado a la historia y el Comité de Disciplina ha tomado el poder, por fin podremos controlarlos."
 GEH_event.18.a:0 "Sí."

 GEH_event.19.t:0 "Celebración de una reunión"
 GEH_event.19.desc:0 "Contenido sobre discutir en una reunión entre la jefa del Comité de Disciplina y sus miembros cómo resolver el “problema de los clubes”."
 GEH_event.19.a: "Negociemos con ellos."
 GEH_event.19.b: "Si no escuchan, disuélvanlos."
 GEH_event.20.t:0 "El fin de las negociaciones"
 GEH_event.20.desc:0 "\"...Con esto, damos por concluidas las negociaciones entre Gehenna y el Estado alemán.\"\n\"Ki, ki, ki... ¡Nuestra Gehenna se volverá aún más fuerte gracias a este acuerdo!\"\n\nTras un largo tiempo, las negociaciones entre la Manmajeon y el Ejército de Defensa alemán llegaron finalmente a su fin.\nAunque ambas partes parecían satisfechas con el resultado, hay cláusulas cuyo significado puede variar según la interpretación.\n\nSin embargo, es incierto si el Comité de Disciplina, la máxima fuerza armada de Gehenna, reconocerá este acuerdo impulsado por la Manmajeon.\nSi el Comité de Disciplina no lo acepta, chocará de frente con la Manmajeon, que ha estrechado la mano del Ejército de Defensa.\n\nEn cualquier caso, la negociación ha terminado, y ahora toca anunciarlo."
 GEH_event.20.a:0 "¡Nuestra Gehenna se volverá aún más fuerte!"

 GEH_event.21.t:0 "Desconocidos"
 GEH_event.21.desc:0 "En la delegación negociadora del Ejército de Defensa que volvimos a encontrar se habían colado personas que no habíamos visto antes. Vestían uniformes azules de otro estilo y, al entrar en la sala, nos observaron con una mirada curiosa. La negociación que comenzó bajo esas miradas se desarrolló casi igual que antes. Los de uniforme azul, sin hacer grandes intervenciones, se limitaron a seguir el proceso y luego se marcharon."
 GEH_event.21.a:0 "Así que son nuevos."

 GEH_event.22.t:0 "Alianza temporal"
 GEH_event.22.desc:0 "Cuando estalló la guerra contra una gran potencia y Gehenna quedó amenazada, los estudiantes de Gehenna, mediante negociación, comenzaron a cooperar entre sí para detener por un momento la guerra civil y hacer frente al enemigo.\nSin embargo, cuánto durará esta alianza es una incógnita."
 GEH_event.22.a:0 "¡Protejan a Gehenna!"

 GEH_event.23.t:0 "La guerra civil continúa"
 GEH_event.23.desc:0 "Tras terminar la guerra contra el Ejército de Defensa, la coalición de Gehenna fue disuelta. El día en que vuelvan a unirse queda para un futuro lejano.\nGehenna se ha dividido para siempre. La unidad pasajera que existió por un momento ya no existe.\nLa unificación de Gehenna se logrará por la paz o por la sangre… pero parece que aún no es el momento."
 GEH_event.23.a:0 "Gehenna es una."

 GEH_event.24.t:0 "Cooperación con el Club de Desarrollo de Aguas Termales"
 GEH_event.24.desc:0 "Sorazaki Hina, en persona, se esforzó por encontrar un punto de compromiso con el Club de Desarrollo de Aguas Termales. Tras mucha insistencia, lo consiguió, y el club decidió cooperar activamente."
 GEH_event.24.a:0 "Qué fastidio, pero salió bien."

 GEH_event.25.t: "El Club de Desarrollo de Aguas Termales se rinde"
 GEH_event.25.desc: ""
 GEH_event.25.a: "Ajá."

 GEH_event.26.t:0 "Resistencia de la Agencia de Detectives"
 GEH_event.26.desc:0 "(Más o menos: la agencia de detectives rechaza el ultimátum)"
 GEH_event.26.a:0 "¡Arrásenlos!"

 GEH_event.27.t: "La caída de la Manmajeon"
 GEH_event.27.desc: ""
 GEH_event.27.a: "Ajá."

 GEH_event.29.t: "Departamento de Medicina de Emergencias"
 GEH_event.29.desc: "Se inició una reunión para cooperar con el Departamento de Medicina de Emergencias, y aceptaron gustosamente la propuesta."
 GEH_event.29.a: "Perfecto."

 GEH_event.30.t: "El problema del Club de Investigación Gastronómica"
 GEH_event.30.desc: "El Club de Investigación Gastronómica suele recorrer los distritos autónomos causando alboroto y es, en la práctica, como una carga para Gehenna. Debemos decidir qué hacer con ellas."
 GEH_event.30.a: "¿Se podrá razonar con ellas...?"

 GEH_event.31.t: "La fortaleza de acero"
 GEH_event.31.desc: "Si uno baja hacia el suroeste desde el distrito central de Gehenna, se encuentra con las bocas de cañón de una fortaleza de acero apuntándonos. Por ahora no es más que una fortaleza vacía, sin nadie dentro. El único pequeño problema es que, durante el desembarco en el mundo humano, sufrió algunos daños menores. Pero daños de este nivel pueden repararse con nuestra tecnología.\n\nQue sea una fortaleza de acero no significa que detenga a los enemigos a la perfección, pero será un escudo sólido: retrasará al enemigo y resistirá sus ataques. El problema es cómo usarla. Como está en lo más profundo de nuestra retaguardia, es un lugar demasiado desafortunado para emplearla como último bastión.\n\nLa buena noticia es que nuestro departamento de obras, el Club de Desarrollo de Aguas Termales, puede trasladarla conservándola perfectamente. Pero hay una gran duda: si la movemos… ¿a dónde debemos llevarla?\n\nLa elección es tuya."
 GEH_event.31.a: "..."

 GEH_event.32.t:0 "El fin del Comité de Disciplina"
 GEH_event.32.desc:0 "\"¡Gracias a la grandiosa dirección de la presidenta Makoto, esos del Comité de Disciplina se han rendido!\"\n\n\"¡No sabíamos nada de Gehenna, de verdad es increíble, senpai!\""
 GEH_event.32.a:0 "Mm. Sí, perfecto, como siempre."

 GEH_event.33.t:0 "Aquel día"
 GEH_event.33.desc:0 "Amaneció. El Club de Aguas Termales se mueve conforme al plan y está realizando la obra base para desenterrar la Línea Maginot. Pero seguimos sin decidir su ubicación. ¿Dónde debería ser?"
 GEH_event.33.a:0 "...Trinity."

 GEH_event.34.t: "Gehenna de acero, fortaleza de acero"
 GEH_event.34.desc: "Tras la supervisión directa de la presidenta Hina del Consejo Estudiantil de Gehenna, el plan avanzó sin fallos y a la perfección; hoy se nos ha informado de que la fase final ha concluido."
 GEH_event.34.a: "¡Bien hecho!"
 GEH_dismantle_maginot_tt: "Si las fortalezas de la Línea Maginot desaparecen por completo y el espíritu nacional se elimina, se construirá una nueva Línea Maginot."
 GEH_move_maginot_tt: "Se construirán fortalezas en la frontera con Trinity."

 GEH_event.35.t: "Apoyo a la investigación"
 GEH_event.35.desc: ""
 GEH_event.35.a: "Armas"
 GEH_event.35.b: "Industria"
 GEH_event.35.c: "Electrónica"

 GEH_event.36.t: "Ceder un paso."
 GEH_event.36.desc: "Con mucho esfuerzo se logró fijar una fecha de reunión con el Club de Investigación Gastronómica, pero tras escuchar sus disparates, al final Hina baja la cabeza y les ruega. El club acepta la petición y, a partir de entonces, causan menos destrozos que antes."
 GEH_event.36.a: "Qué fastidio."

 GEH_event.38.t: "Fin de la guerra de reconquista"
 GEH_event.38.desc: "La guerra de reconquista... ¡se acabó el servicio..!"
 GEH_event.38.a: "Ajá."

 GEH_event.39.t: "Un problema muy grande"
 GEH_event.39.desc: "¿Y ahora qué hacemos con Makoto?"
 GEH_event.39.a: "Eso digo yo."

 GEH_event.40.t: "El fin de todo (1/2)"
 GEH_event.40.desc: "Tras la rendición de Trinity, quienes tuvieran aunque fuera un mínimo de responsabilidad en esta guerra inmoral y salvaje desaparecieron en la horca, tras los juicios por crímenes de guerra.\nSolo después de que corrió una sangre tan pequeña —polvo, comparada con los sacrificios de todo este tiempo— la paz llegó como si fuera una mentira.\n\nEn el centro del distrito central de Gehenna, convertido en ruinas, Sorazaki Hina, jefa del Comité de Disciplina, no podía estar segura de nada.\nSu capacidad era demasiado insignificante como para devolver a la normalidad todo lo que en esta tierra se había convertido en ceniza.\n\nLos ángeles de Trinity, crueles y sin compasión, intentaron borrar todo lo que era Gehenna.\nAl principio ella no vaciló.\nPero cuando el enemigo empezó a cruzar líneas una tras otra, ella también se estremeció.\nCuanto más se alargaban tras los ángeles las huellas ensangrentadas, más empezó Hina a creer que todo era culpa de su propia impotencia.\nPor eso, aunque la guerra hubiera terminado, Hina seguía atrapada dentro de ella.\nNadie podía sacarla.\nEntre el rencor de los muertos que clamaban su nombre y las voces que intentaban justificarla, Hina seguía hundiéndose en un pantano llamado desesperación.\n\nCabello desordenado, alas caídas que arrastraban por el suelo, mirada sin enfoque; un Halo más pequeño de lo habitual y cuernos que habían perdido su brillo.\nLa figura de la jefa del Comité de Disciplina que vio la administradora principal, Amau Ako, era distinta a la que recordaba.\nLo que tenía frente a sus ojos no era más que una sola chica frágil, sumida en la tristeza."
 GEH_event.40.a: "Siguiente"

 GEH_event.42.t: "El fin de todo (2/2)"
 GEH_event.42.desc: "\"Ako… por favor… vete…\"\n\n\"Jefa…\"\n\n\"Perdón por decepcionarte… no soy tan fuerte como tú crees… ya estoy demasiado cansada…\"\n\n\"No, jefa. Yo… solo quería darle las gracias.\"\n\nAnte unas palabras de gratitud que jamás habría esperado, Hina alzó la cabeza y miró a Ako.\nUna mirada cálida la envolvía: no había lástima ni reproche, solo gratitud… y disculpa.\n\n\"…¿Gracias…? ¿Por qué…?\"\n\n\"Quería agradecerle que siempre se esforzara por todas… Aunque cargara con más de lo que debería… Siempre la vimos caminar en silencio hacia adelante…\"\n\n\"…\"\n\n\"No sé cuánta responsabilidad ha cargado exactamente… pero ahora quiero ayudarla, aunque sea un poco, a aligerar ese peso.\"\n\n\"Ako…\"\n\n\"De ahora en adelante, yo lo cargaré con usted. Ya está bien…\"\n\nFue entonces cuando Sorazaki Hina lo entendió.\nIncluso dentro de la destrucción total que Trinity había infligido, todavía quedaban muchas cosas.\nSobre los edificios derrumbados y la tierra arrasada, aún había innumerables estudiantes: Gehenna seguía respirando.\nPor eso, reconstruirlo todo no era un trabajo que recayera solo sobre ella.\nNo había motivo para angustiarse sola, ni necesidad de cargar con todo sola.\nPorque ella también era solo una Gehenna.\n\n\"…Ako.\"\n\n\"Sí, jefa?\"\n\n\"Yo también… tengo algo que quiero decirte…\""
 GEH_event.42.a: "Gracias. Siempre."

 GEH_event.43.t: "El Ejército de Defensa alemán, absorbido por la Manmajeon"
 GEH_event.43.desc: "Ha llegado la noticia de que, en las negociaciones Gehenna–Ejército de Defensa que la Manmajeon lleva a cabo, el Ejército de Defensa ha elegido unificarse con la Manmajeon. Esto está provocando una confusión considerable. Si esta negociación concluye con éxito, podría estallar un problema enorme."
 GEH_event.43.a: "¡Maldición!"
 GEH_event.43.b: "Alemania y Gehenna ahora son una."
 GEH_event.43.c: "Hay que resolverlo ya."

 GEH_event.44.t: "Ruptura de las negociaciones Gehenna–Ejército de Defensa"
 GEH_event.44.desc: "Hemos recibido recientemente la noticia de que las negociaciones Gehenna–Ejército de Defensa que la Manmajeon estaba llevando a cabo han sido declaradas fallidas por parte del Ejército de Defensa."
 GEH_event.44.a: "Vaya…"

 GEH_event.45.t: "Separación e independencia del Ejército de Defensa"
 GEH_event.45.desc: "Con la conclusión de las negociaciones Gehenna–Ejército de Defensa, conforme al tratado se ha independizado el Ejército de Defensa con los territorios estipulados, y ahora Gehenna y el Ejército de Defensa seguirán caminos distintos."
 GEH_event.45.a: "Un final agridulce."

 GEH_event.46.t: "Propuesta federal de la Manmajeon"
 GEH_event.46.desc: "A través de la Manmajeon se nos ha transmitido una propuesta para establecer un Estado federal que otorgaría al Ejército de Defensa una amplia autonomía y permitiría, a la vez, la creación de un gobierno alemán. Debemos discutir esta propuesta y enviar una respuesta."
 GEH_event.46.a: "Consultar también la opinión de la marina."
 GEH_event.46.b: "Aceptar."
 GEH_event.46.c: "Rechazar."

 GEH_event.47.t: "Propuesta federal - Aceptación"
 GEH_event.47.desc: "El Ejército de Defensa nos ha enviado una respuesta aceptando nuestra postura."
 GEH_event.47.a: "¡Alemania y Gehenna son una!"

 GEH_event.48.t: "Propuesta federal - Rechazo"
 GEH_event.48.desc: "El Ejército de Defensa nos ha enviado una carta indicando que no puede aceptar nuestra postura, y la propuesta federal que presentamos ha sido rechazada."
 GEH_event.48.a: "Entonces, sigamos negociando."

 GEH_event.49.t: "Propuesta federal de la Manmajeon - El mando del ejército nos cede la decisión"
 GEH_event.49.desc: "El Ejército de Defensa alemán nos informó de la propuesta de la Manmajeon y nos cedió la autoridad para tomar la decisión final."
 GEH_event.49.a: "Aceptar."
 GEH_event.49.b: "Rechazar."

 GEH_event.50.t: "Fin de las negociaciones Gehenna–Alemania"
 GEH_event.50.desc: "La Manmajeon nos notificó unilateralmente que ha concluido las negociaciones con el Ejército de Defensa alemán."
 GEH_event.50.a: "No podemos aceptar este resultado."
 GEH_event.50.b: "...Lo aceptamos."
 GEH_event.50.c: "Diles que observen qué sucede."

 GEH_event.51.t: "Votación de ratificación del ex presidenta Hanuma Makoto"
 GEH_event.51.desc: "\"...Con esto, se da por rechazada la votación de ratificación de la ex presidenta Hanuma Makoto.\"\nEl final de Hanuma Makoto, gobernante de la Manmajeon y máxima autoridad, fue más deslucido de lo esperado: con solo rechazar una votación de ratificación, su era terminó por completo.\n\n\"¿Yo, Makoto-sama… perdí en una votación…?\"\nLa ex presidenta de la Manmajeon, ahora una estudiante común, murmuró eso.\nBueno, era lo natural. La Manmajeon se sostenía gracias al escaso interés de los estudiantes de Gehenna… y ahora los estudiantes por fin comprendieron la gravedad de la situación.\n\n\"¡Esto no tiene sentido! ¡Fraude, seguro que fue un fraude!\"\nHanuma Makoto gritó así.\n\nY no pasó mucho tiempo antes de que los legisladores de la Manmajeon, sin una sola deserción, eligieran a una nueva presidenta."
 GEH_event.51.a: "Es el resultado que quería."

 GEH_event.52.t: "El nuevo líder de Alemania"
 GEH_event.52.desc: "Hemos ganado la disputa de influencia contra Gehenna y, a continuación, se ha establecido el Estado alemán. Ahora necesitamos un nuevo líder que guíe al Estado alemán, y este nuevo líder gobernará Alemania durante mucho tiempo."
 GEH_event.52.a: "$GER_gerd_von_rundstedt$, canciller militar"
 GEH_event.52.b: "$GER_karl_donitz$, el nuevo Führer"
 GEH_event.52.c: "$GER_albert_speer$, el nuevo líder del partido"

 GEH_event.53.t: "La renuncia de Natsume Iroha"
 GEH_event.53.desc: "Los cambios políticos que atravesó Gehenna dieron un golpe enorme a los directivos de la Manmajeon. El hecho de que la Manmajeon ya no fuese el único gobierno de Gehenna y debiera transferir la mayor parte del poder al gobierno alemán no solo conmocionó a sus directivos: para cualquier estudiante de Gehenna, no, para cualquier ciudadano de Kivotos, sería un shock.\n\nPero ya es un hecho consumado, y Natsume Iroha, incapaz de adaptarse a este entorno, le declaró su renuncia a Makoto. Puede que la libre, grandiosa y tricéfala Academia Gehenna ya no exista."
 GEH_event.53.a: "Natsume Iroha, estudiante común"

 GEH_event.54.t: "Votación de ratificación de la presidenta Hanuma Makoto"
 GEH_event.54.desc: "\"...Entonces, iniciaremos la votación de ratificación de Hanuma Makoto.\"\nLa gobernante de la Manmajeon, y al mismo tiempo una de sus legisladoras, Hanuma Makoto, al fracasar en las negociaciones de unificación con el Ejército de Defensa alemán, no tuvo más remedio que asumir la responsabilidad de haber creado un país enemigo virtual más en el norte.\n\n\"¿Yo, Makoto-sama… podría no ser ratificada…?\"\nHanuma Makoto, presidenta de la Manmajeon, ahora sometida a la prueba de los estudiantes de Gehenna y de los directivos de la Manmajeon, murmuró así.\nTal vez… fuera un desenlace anunciado desde el momento en que no lograron imponerse de forma abrumadora en la negociación. La resistencia inesperada y la extralimitación del Comité de Disciplina, y la falta de cooperación del Ejército de Defensa… la negociación comenzó en medio de todo eso.\n\nY, bajo la concentración de todos y el interés estudiantil más alto que jamás se había imaginado —aunque antes fuera de un solo dígito—, comenzó la votación de ratificación de Hanuma Makoto."
 GEH_event.54.a: "\"...Con esto, la presidenta Hanuma Makoto ha sido ratificada.\""
 GEH_event.54.b: "\"La presidenta interina de la Manmajeon queda fijada como Kyogoku Satsuki.\""
 GEH_event.54.c: "\"La administración de la Manmajeon quedará temporalmente a cargo de la Secretaría.\""

 GEH_event.55.t: "Ultimátum final de [GEM.GetName]"
 GEH_event.55.desc: "[GEM.GetName], tras concluir con éxito las negociaciones con el Ejército de Defensa alemán, nos envió un documento oficial ordenándonos obedecer. Al ver el nombre de Rundstedt firmado como comandante supremo, nuestro alto mando cayó en una confusión considerable. Se estima que todos nuestros planes para recuperar Alemania se han ido al traste, y parece que incluso el “pretexto” de ‘Alemania’ se lo han llevado ellos."
 GEH_event.55.a: "No nos queda más que someternos."
 GEH_event.55.b: "...Busquemos otra salida."
 GEH_event.55.c: "Con no ir allí, se acaba el problema."

 GEH_event.56.t: "Aceptación de la Kriegsmarine"
 GEH_event.56.desc: "La Kriegsmarine aceptó el ultimátum que enviamos y, poco después, su comandante en jefe se puso en contacto con nosotros. A través del proceso de transferencia del mando, la Kriegsmarine ha pasado oficialmente a estar bajo nuestro control."
 GEH_event.56.a: "Es glorioso."

 GEH_event.57.t: "Rechazo de la Kriegsmarine"
 GEH_event.57.desc: "La Kriegsmarine rechazó el ultimátum que enviamos. Aunque llevan mucho tiempo operando sin suministros, parece que no han renunciado a su hostilidad hacia nosotros."
 GEH_event.57.a: "Que hagan lo que quieran."

 GEH_event.58.t: "¿El Eje?"
 GEH_event.58.desc: "Aunque la Manmajeon mantiene una alianza con nosotros, han empezado a abrazar el nacionalismo alemán e incluso intentan construir una enorme alianza llamada “las Potencias del Eje”.\n\nDebemos decidir si, en respuesta a sus movimientos, rompemos la alianza con ellos o nos unimos a esa facción llamada el Eje."
 GEH_event.58.a: "Romper la alianza con la Manmajeon."
 GEH_event.58.b: "Construyamos con ellos un nuevo orden."

 GEH_event.59.t: "Ruptura de alianza del Comité de Disciplina"
 GEH_event.59.desc: "La serie de acciones que emprendimos al abrazar el nacionalismo alemán contribuyó a que las relaciones diplomáticas con el Comité de Disciplina empeoraran al extremo.\n\nEl Comité de Disciplina finalmente decidió romper la alianza con nosotros, y puede que ahora tengamos que enfrentar a un nuevo enemigo."
 GEH_event.59.a: "El Comité de Disciplina sigue siendo igual de caprichoso."

 GEH_event.60.t: "Solicitud de mediación de Gehenna"
 GEH_event.60.desc: "La Academia Gehenna manifestó su intención de reimpulsar el Tratado de Edén que promovía el ex presidente del Consejo General Estudiantil, y nos solicitó mediación.\n\nAhora debemos elegir: ¿intentaremos resolver el problema diplomático entre Gehenna y Trinity, o nos desentenderemos?"
 GEH_event.60.a: "Mediar un acuerdo de paz entre Gehenna y Trinity."
 GEH_event.60.b: "No podemos hacer nada al respecto."
 GEH_event.60.c: "La Trinity actual es, sin duda, peligrosa."

 GEH_event.61.t: "El Consejo General reimpulsa el Tratado de Edén"
 GEH_event.61.desc: "Recientemente, la Academia Gehenna ha empezado a revisar de nuevo el Tratado de Edén que promovía el ex presidente del Consejo General Estudiantil, y se estima que Sanctum Tower se ha sumado a ello.\n\nDebemos elegir: ¿aceptaremos este tratado e intentaremos negociar la paz con Gehenna, o lo obstaculizaremos y mantendremos el statu quo?"
 GEH_event.61.a: "Apoyar la creación del organismo del Tratado de Edén."
 GEH_event.61.b: "Lamentablemente, no hemos recibido ningún contacto."
 GEH_event.61.c: "No queremos un tratado de paz con Gehenna."

 GEH_event.62.t: "Reacción positiva de Trinity"
 GEH_event.62.desc: "Parece que Trinity está considerando de forma positiva nuestra intención de impulsar el Tratado de Edén. El contenido exacto solo se sabrá cuando termine la mediación del Consejo General Estudiantil, pero por la reacción hasta ahora, parece que avanza con éxito."
 GEH_event.62.a: "¿Será un éxito?"

 GEH_event.63.t: "Trinity rechaza el tratado"
 GEH_event.63.desc: "El intento de mediación del Consejo General Estudiantil se fue al traste, y se reveló que Trinity expresó una postura dura y abiertamente negativa respecto al Tratado de Edén. Ahora quizá tengamos que prepararnos para la guerra contra Trinity, y esta conducta de Trinity podría incluso atraer al Consejo General Estudiantil a nuestro bando."
 GEH_event.63.a: "Hm."

 GEH_event.64.t: "El Consejo General rechaza el tratado"
 GEH_event.64.desc: "El Consejo General Estudiantil mostró rechazo a involucrarse en el complejo problema diplomático entre Trinity y Gehenna, alegando que el Tratado de Edén ya es un tratado fracasado.\n\nParece que el Tratado de Edén se derrumbó incluso antes de llegar a Trinity."
 GEH_event.64.a: "Qué lástima."

 GEH_event.65.t: "El Consejo General propone un tratado de defensa"
 GEH_event.65.desc: "Con base en los rápidos cambios recientes del panorama político de Trinity, el Consejo General Estudiantil propuso una defensa mutua.\n\nAhora podemos impulsar una nueva forma de Tratado de Edén para prepararnos contra la ideología fanática de Trinity."
 GEH_event.65.a: "Es una buena idea."
 GEH_event.65.b: "No nos interesa."

 GEH_event.66.t: "Gehenna acepta el tratado de defensa"
 GEH_event.66.desc: "El liderazgo de Gehenna decidió aceptar el tratado de defensa que propusimos. Con esto, parece que hemos encontrado un excelente compañero para la gran guerra que estallará en el futuro."
 GEH_event.66.a: "Bien."

 GEH_event.67.t: "Gehenna rechaza el tratado de defensa"
 GEH_event.67.desc: "Gehenna rechazó nuestra propuesta, expresando que no tiene interés en el tipo de tratado de defensa que ofrecimos."
 GEH_event.67.a: "Qué pena."

 GEH_event.68.t: "Ceremonia de firma del Tratado de Edén"
 GEH_event.68.desc: "Hoy es el día en que se firmará el Tratado de Edén bajo la mediación del Consejo General Estudiantil.\n\nEl largo conflicto entre Trinity y Gehenna llegará hoy a su fin."
 GEH_event.68.a: "Firmar el tratado."

 GEH_event.69.t: "Disturbios alemanes en los Sudetes"
 GEH_event.69.desc: "Tras las concesiones masivas de Gehenna a favor de los alemanes, su propaganda parece haber dado una fuerte motivación a los alemanes que viven en nuestro territorio.\n\nLos alemanes residentes en los Sudetes han salido a las calles formando grandes marchas de protesta, y se están produciendo disturbios de diversas formas."
 GEH_event.69.a: "Siempre acaban siendo un problema."

 GEH_event.70.t: "¡Retirada total del Comité de Disciplina!"
 GEH_event.70.desc: "El Comité de Disciplina, que llevaba tiempo en conflicto con nosotros, acaba de notificarnos unilateralmente que detendrá sus actividades de mantenimiento del orden público.\n\nCon su retirada de nuestro territorio, se estima que la carga de seguridad sobre nosotros aumentará de manera significativa."
 GEH_event.70.a: "El Comité de Disciplina nos teme."
 GEH_event.70.b: "Recordémosles cuál es su lugar."

 GEH_event.71.t: "¡La Manmajeon expulsa al Comité de Disciplina!"
 GEH_event.71.desc: "La Manmajeon, que llevaba tiempo en conflicto con nosotros, acaba de enviarnos unilateralmente un documento oficial exigiendo que abandonemos el territorio que controla.\n\nQue la Manmajeon nos expulse podría significar que se preparan para la guerra contra nosotros. Debemos impedir el caos que se aproxima en Gehenna."
 GEH_event.71.a: "¿Pero por qué?"
 GEH_event.71.b: "Hay que acelerar el plan."

 GEH_event.72.t: "Apaciguamiento desde Gehenna"
 GEH_event.72.desc: "Tras declarar abiertamente la hostilidad contra Trinity, la Academia Gehenna, llegada de otro mundo, nos solicitó que entremos en la guerra si Gehenna se enfrenta a Trinity, basándose en nuestras pérdidas territoriales.\n\nParece que Gehenna intenta superar la diferencia de poder nacional con Trinity mediante una solución diplomática, y este tratado podría darnos la oportunidad de recuperar el territorio perdido."
 GEH_event.72.a: "Es una buena idea. Por ahora."
 GEH_event.72.b: "Una idea peligrosísima."

 GEH_event.73.t: "Polonia acepta el tratado"
 GEH_event.73.desc: "[POL.GetName] aceptó el apaciguamiento que propusimos y emitió un tratado en el que declara que, en la futura guerra entre Gehenna y Trinity, entrará en combate de nuestro lado."
 GEH_event.73.a: "Bien. Por ahora."

 GEH_event.74.t: "Polonia rechaza el tratado"
 GEH_event.74.desc: "[POL.GetName] rechazó nuestra propuesta, argumentando que podría poner en peligro el destino nacional de Polonia."
 GEH_event.74.a: "No esperaba mucho."

 GEH_event.75.t: "Entrada en guerra: Gehenna y Polonia"
 GEH_event.75.desc: "Según el tratado previo con Gehenna, en esta situación Polonia debe entrar en guerra contra Trinity. Claro está: dado que la situación internacional ha cambiado a gran escala desde entonces, podemos ignorar el tratado."
 GEH_event.75.a: "Cumplimos el tratado."
 GEH_event.75.b: "..."
 GEH_event.75.c: "¿Eso no fue Gehenna invadiendo?"

 GEH_event.76.t: "¡Polonia entra en la guerra!"
 GEH_event.76.desc: "[POL.GetName], conforme al tratado firmado anteriormente, ha entrado en la guerra de nuestro lado contra Trinity.\n\n¡Esta acción de Polonia nos dará una gran ventaja en la guerra contra Trinity!"
 GEH_event.76.a: "Agradezcamos su honestidad."

 GEH_event.77.t: "Polonia rompe el tratado"
 GEH_event.77.desc: "Según el tratado previo, [POL.GetName] debería entrar en guerra para ayudarnos en una situación como esta. Sin embargo, [POL.GetName] nos notificó que no participará, alegando cambios en la situación internacional y una reinterpretación del tratado."
 GEH_event.77.a: "Ni falta que hacían."

 GEH_event.78.t: "Reforma del ejército"
 GEH_event.78.desc: "Como resultado de nuestros esfuerzos constantes, hemos mejorado la capacidad operativa militar de [GEM.GetName]. Ahora contamos con un ejército mejor, y con ello podremos planificar operaciones superiores."
 GEH_event.78.a: "Sigan."

 GEH_event.100.t: "Decisión de Edén - El ascenso de la estrella naciente"
 GEH_event.100.desc: "Hace siglos, un conflicto que empezó por una disputa trivial terminó convirtiéndose en una guerra total que decidiría el destino de dos academias.\n\nTrinity, la invasora, estaba convencida de que solo necesitaría unas semanas para derribar a Gehenna. Eran superiores en número y en tecnología, y no dudaban de su victoria. Pero pasaron por alto algo: la ira espontánea de los estudiantes de Gehenna, su unidad y, por encima de todo, su anhelo de “libertad”.\n\nLos estudiantes de Gehenna se alzaron en armas. Eligieron el campo de batalla en lugar de las clases, y se arrojaron a las trincheras en lugar de quedarse en el pupitre. Su lucha no fue una simple defensa de la academia. Fue una lucha por la identidad, una lucha por demostrar que estaban vivos.\n\nLa bandera roja de Gehenna no se quebró bajo ninguna opresión y, finalmente, alcanzaron el corazón de Trinity: Edén. La última batalla allí fue feroz, con incontables sacrificios, pero al final Trinity se arrodilló. Su arrogancia se pagó con derrota, y Gehenna salió victoriosa.\n\nPero la victoria tuvo un precio terrible. La ciudad se derrumbó y las calles quedaron marcadas por la guerra. En el lugar de los amigos perdidos cayó el silencio, y la academia quedó devastada. Sin embargo, Gehenna sobrevivió. Y, sobre todo, protegió la “libertad”.\n\nAhora volverán a levantarse. Construirán una nueva escuela sobre los escombros y avanzarán recordando los nombres de sus camaradas caídos. La libertad de Gehenna, que una vez estuvo al borde del abismo, se ha convertido en una convicción ganada con sangre. Y esa convicción no volverá a romperse."
 GEH_event.100.a: "¡Eterna!"

 GEH_event.41.t: "La rendición de Trinity"
 GEH_event.41.desc: "Trinity se rindió ante nuestro avance, y Misono Mika y sus remanentes desaparecieron sin dejar rastro. En su lugar, otro miembro de la facción Pater firmó el documento de rendición, y la guerra Gehenna–Trinity concluyó oficialmente.\n\nEn la guerra contra Trinity derramamos muchísima sangre, pero una vez más logramos proteger a Gehenna… y todos los milagros empezarán desde ahora."
 GEH_event.41.a: "Punto final"
