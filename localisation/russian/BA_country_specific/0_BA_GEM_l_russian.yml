 GEH_GEM__war_with_TRM:0 "Proclamar la guerra contra Trinity"
 GEH_GEM__war_with_TRM_desc:0 "La Academia General Trinity ha invadido un país que es parte de nuestra academia. Para proteger Gehenna, debemos atrevernos a declarar la guerra a la Academia General Trinity."

