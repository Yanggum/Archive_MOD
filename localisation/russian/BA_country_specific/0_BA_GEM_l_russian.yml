 GEM_security_militia: "Proteger a la milicia"
 GEM_security_militia_desc: "La Legión Pandemonium es una organización de ejército privado leal operada por la Pandemonium Society.\nAmpliaremos esta organización para asegurar fuerza militar insuficiente y minimizar las amenazas en la retaguardia del frente."

 GEM_coerced_loyalty: "Lealtad forzada"
 GEM_coerced_loyalty_desc: "La Legión Pandemonium debe ser más leal que cualquier otra organización a la Manmajeon y a Gehenna, y debe poder consumirse a sí misma por la gran misión.\nLas haremos así."

 GEM_honor_and_glory: "Honor y gloria"
 GEM_honor_and_glory_desc: "Cada soldado de la legión tendrá un destino más honorable y glorioso que cualquier otro soldado de Gehenna.\nLos panfletos en la calle y las emisiones de la Manmajeon los seguirán alabando sin cesar."

 GEM_great_duty: "Gran deber"
 GEM_great_duty_desc: "Cada estudiante de Gehenna carga con un gran deber.\nComo la academia más fuerte y las estudiantes más resistentes, seremos leales a Gehenna por toda la eternidad."

 GEH_towards_the_greatest_academy: "Hacia la academia más grande"
