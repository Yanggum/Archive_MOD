 ###### Estado alemán
 GEM_focus_ended_1_A_endfocus: "Asunción como Führer"
 GEM_focus_ended_1_A_endfocus_desc: "El caos del Estado alemán ha terminado y todo el poder se concentra ahora en una sola persona. La presidenta Hanuma Makoto hereda oficialmente el puesto de «Führer» que el líder de la oposición usurpaba. Esto no es solo una disputa por un cargo: es una declaración que pone fin al debate sobre quién representa verdaderamente la voluntad del pueblo alemán. Bajo su liderazgo, el viejo nazismo será reemplazado y Alemania recibirá una nueva era."
 GEM_national_corporatism_proposal: "Proclamar el corporativismo estatal"
 GEM_national_corporatism_proposal_desc: "La vieja ideología del nazismo existente no puede conducir la nueva era. Por ello, el «corporativismo estatal» se proclama como la ideología central que guiará al régimen actual. Este sistema organiza a todos los estratos de la sociedad en «corporaciones» bajo el control del Estado, concentrando todas las capacidades en el logro de las «grandes gestas». El «Partido Patriota Alemán del Corporativismo Estatal» absorberá la base de apoyo del antiguo Partido Nazi mediante esta nueva ideología y consolidará su posición como la única alternativa."
 GEM_rune_script_adoption: "Adopción de la escritura rúnica"
 GEM_rune_script_adoption_desc: "El símbolo del fracaso que usa la oposición, la esvástica, debe ser abolido como corresponde. En su lugar, adoptaremos la «runa Odal», símbolo del legado germánico antiguo, de la sangre y de la tierra, como emblema del nuevo Estado. Esto no es un simple cambio de símbolo. Es el inicio de una guerra simbólica: negamos la legitimidad del Partido Nazi existente y proclamamos que nosotros somos los verdaderos herederos de esta tierra."
 GEM_bury_gehenna_culture: "Enterrar la cultura de Gehenna"
 GEM_bury_gehenna_culture_desc: "Para convertirnos en gobernantes absolutos de Alemania, debemos borrar la percepción de que el propio gobernante es un «forastero». En especial, mientras exista una oposición nacionalista, nuestros orígenes en Gehenna pueden ser atacados como una debilidad política. Por ello, los rasgos culturales propios de Gehenna serán suprimidos de forma deliberada en el ámbito público. Es una decisión política fría para asegurar la legitimidad del gobierno y bloquear pretextos de ataque por parte de nuestros adversarios."
 GEM_gehenna_german_cultural_integration: "Integración cultural gehenna-germana"
 GEM_gehenna_german_cultural_integration_desc: "Comienza el intento de fundir en un solo crisol la tradición germana y el espíritu de Gehenna para crear una cultura nueva, más superior y poderosa. No se trata de un simple intercambio cultural, sino del proceso de reorganizar la cultura alemana teniendo como núcleo la energía y el espíritu de lucha de Gehenna. La nueva cultura «gehenna-germana» reforzará la legitimidad del nuevo sistema y funcionará como una fuente eterna de fuerza para el Estado."
 GEM_leader_of_germans: "Líder de los alemanes"
 GEM_leader_of_germans_desc: "El Führer deja de ser un conquistador externo y es elevado como la encarnación de la voluntad de la «nación gehenna-germana» redefinida. Su voz se convierte en la voz de toda la nación, y sus decisiones serán aceptadas como el destino indiscutible del pueblo. Así, la adoración al Führer se eleva a escala nacional y se completa un sistema de liderazgo absoluto, imposible de desafiar."
 GEM_expel_leftists_from_coalition: "Expulsar a la izquierda de la coalición"
 GEM_expel_leftists_from_coalition_desc: "Bajo la consigna de un Estado, una nación y una sola voluntad, todo elemento que perjudique la pureza ideológica debe ser eliminado. Las fuerzas de izquierda de la coalición, que alguna vez fueron necesarias para estabilizar el régimen, son ahora tratadas como herramientas que ya cumplieron su función y serán purgadas. Esto se presentará no como una simple lucha de poder, sino como parte de una «gran purificación» para unificar toda la energía del Estado en una sola dirección."
 GEM_denazification_movement: "Movimiento de desnazificación"
 GEM_denazification_movement_desc: "Para que el nuevo orden sustituya por completo al espectro del pasado, es necesario un corte claro con el viejo régimen. En consecuencia, se despliega un amplio «movimiento de desnazificación» contra el Partido Nazi opositor que amenaza al gobierno y contra sus símbolos. Más que una auténtica depuración ideológica, se trata de una elección política: proclamar que solo nosotros somos la única alternativa, ilegalizar y eliminar al partido rival más poderoso y así consolidar nuestra base de poder."
 GEM_national_president_and_tricolor_flag: "Presidente nacional y bandera tricolor"
 GEM_national_president_and_tricolor_flag_desc: "Ahora que hemos eliminado al Partido Nazi, nuestro rival más poderoso, el régimen ya no necesita aferrarse a símbolos extremos. En lugar del título de «Führer», adoptaremos el cargo más moderado de «presidente nacional», y restauraremos la bandera tricolor de la República de Weimar como un gesto conciliador hacia la comunidad internacional y los moderados internos. Es una elección pragmática para envolver la esencia autoritaria del régimen con la apariencia de un Estado «legal» y ampliar la base de apoyo."
 GEM_slightly_more_progressive: "Un poco más progresista"
 GEM_slightly_more_progressive_desc: "Con todos los principales competidores políticos eliminados, es momento de asegurar el apoyo popular para elevar la estabilidad del régimen. Se introducen algunas reformas sociales limitadas. Medidas simbólicas como la mejora del entorno laboral o los derechos de las mujeres servirán como herramientas propagandísticas para mostrar que el régimen no es solo un aparato de represión. Esta ilusión de «progreso» aliviará el descontento público y se convertirá en un medio eficaz para mantener intacta la estructura central del poder mientras el gobierno continúa."
 GEM_under_one_united_fatherland: "Bajo una patria unificada"
 GEM_under_one_united_fatherland_desc: "La era de la división ha terminado. Los espectros de las viejas ideologías han sido purgados y todos los adversarios internos han guardado silencio. Ya no tiene sentido distinguir entre gehenna y alemanes. Más allá de la sangre y del origen, solo la lealtad hacia la «patria unificada» se ha convertido en el único valor. Bajo el liderazgo absoluto de [ROOT.GetLeader], todas las naciones, a la vez que ven respetado su lugar, han sido integradas en una sola y gigantesca voluntad. Ahora la patria ha superado todo conflicto interno y por fin está lista para proyectar su fuerza hacia el exterior. ¡La marcha hacia la gran gesta comienza ahora!"
 ###### 연방
 GEM_focus_ended_1_B_endfocus: "La alianza de los dioses"
 GEM_focus_ended_1_B_endfocus_desc: "La vieja idea de que existe una sola nación superior es estrecha de miras e ineficiente. La verdadera fuerza solo se completa cuando los dos linajes más poderosos se toman de la mano y dominan el mundo. El «Gran Traslado» fue destino: una revelación que ordenaba a la nación germana, descendiente de los nórdicos, y a la nación de Gehenna, heredera de Hinnom, estas dos «naciones de los dioses», encontrarse para abrir un gran destino. Ahora, bajo el estandarte de la federación, nos haremos uno y, con los inferiores bajo nuestros pies, escribiremos un nuevo mito para la era venidera."

 GEM_1_B_germany_first: "Alemania primero"
 GEM_1_B_germany_first_desc: "Para afianzar la alianza de las dos grandes naciones, debemos aprovechar los símbolos y el orden ya arraigados en esta tierra. Pondremos al frente de la federación la tradición y la estética del nacionalismo alemán. Es la elección más realista para asegurar el apoyo de la mayoría alemana y tomar el control del sistema estatal existente con eficacia. La fuerza de Gehenna, como una daga oculta en el interior, será afilada aún más bajo la armadura germánica."

 GEM_two_nations_pure_blood_law: "Ley de sangre pura de las dos naciones"
 GEM_two_nations_pure_blood_law_desc: "La alianza de las dos naciones no debe ser una fusión mediante el mestizaje, sino un «pacto» en el que cada una conserve su pureza. La fortaleza germana y el misterio de Gehenna se manifiestan con mayor pureza dentro de su propio linaje. La «Ley de sangre pura de las dos naciones» prohíbe estrictamente los matrimonios mixtos entre gehenna y alemanes, y es un decreto sagrado para preservar las características propias de las dos naciones dominantes y mantener eternamente la fuerza de la federación."

 GEM_fuhrer_successor: "Sucesora del Führer"
 GEM_fuhrer_successor_desc: "El cargo de Führer ya no es patrimonio exclusivo de una nación en particular. Es el puesto del «más superior», quien guía a las dos naciones de los dioses. Hanuma Makoto es gehenna, pero su liderazgo abrumador y su visión demuestran que ella misma es la cualificación del Führer. Al heredar este título, la federación establecerá un principio de liderazgo de una nueva dimensión, por encima del linaje, y obtendrá un centro absoluto capaz de acallar toda duda."

 GEM_1_B_gehenna_first: "Gehenna primero"
 GEM_1_B_gehenna_first_desc: "El nacionalismo alemán es poderoso, pero no deja de ser un legado del pasado. El verdadero futuro debe comenzar con nosotros, con el modo de Gehenna que ha llegado de nuevo. Colocaremos en el corazón de la federación los símbolos de Gehenna y la historia de su lucha. Los alemanes, al abandonar sus viejas tradiciones y someterse bajo el orden superior y dinámico de Gehenna, comprenderán la auténtica gloria. Los gobernantes somos nosotros, y el método también debe ser el nuestro."

 GEM_legacy_reactivation: "Reactivación del legado"
 GEM_legacy_reactivation_desc: "En la historia de Gehenna no solo hubo caos: existió la era del «Emperador del Trueno», que doblegaba todo con poder absoluto. Desenterramos ese legado olvidado y resucitaremos sus formas de gobierno y sus símbolos para convertirlos en la ideología rectora de la nueva federación. Es un proceso para elevar el orgullo de la nación de Gehenna e imprimir en los alemanes, de forma inequívoca, quién posee de verdad la historia del dominio."

 GEM_successor_of_thunder_god_myth: "Heredera del mito del Emperador del Trueno"
 GEM_successor_of_thunder_god_myth_desc: "Para Gehenna, el «Emperador del Trueno» es, en sí mismo, un mito de poder que trasciende eras. Hanuma Makoto se proclama su legítima heredera. No reproducirá al tirano del pasado: absorberá su mito para convertirse en una leyenda viviente. A partir de ahora, la líder de la federación no reinará como una simple gobernante, sino como un ser mítico que desciende junto al trueno."

 GEM_nord_hinnom_civilization: "Civilización Nórdica-Hinnom"
 GEM_nord_hinnom_civilization_desc: "El espíritu de las dos grandes naciones debe unirse bajo un solo nombre. Combinando «Nórdico», nacido de la mitología del norte, y «Hinnom», la raíz de Gehenna, creamos una nueva civilización dominante: «Nórdica-Hinnom». Esta nueva cultura será un privilegio exclusivo que solo las dos naciones dominantes pueden disfrutar, y un símbolo noble que las separa de las razas inferiores. Arte, filosofía y ritos: todo será reorganizado bajo este nuevo nombre."

 GEM_nord_hinnom_civilization_flag: "§Y$GEM_nord_hinnom_civilization$§! enfoque completado"

 GEM_cow_dies_and_kindred_die: "El ganado muere, y también los parientes, pero"
 GEM_cow_dies_and_kindred_die_desc: "La integración interna de la civilización «Nórdica-Hinnom» se ha completado. Ahora debemos demostrar su superioridad ante el mundo exterior. Nuestro primer objetivo son las otras grandes potencias de Kivotos, que siguen caminos distintos mientras permanecen divididas. Aunque puedan considerarse nuestros «parientes», también son rivales que obstaculizan nuestra gran gesta. Al absorberlos a todos y forjar un imperio colosal, nos acercaremos a una gloria inmortal."

 GEM_honor_of_the_name_never_dies: "El honor de quien deja su nombre jamás muere."
 GEM_honor_of_the_name_never_dies_desc: "Kivotos, por fin, se ha unificado bajo una sola voluntad. Ahora nuestra mirada se dirige al vasto continente europeo donde viven los nativos de este mundo. Desde Iberia hasta los Urales, todo territorio debe incorporarse al espacio vital de la civilización «Nórdica-Hinnom». La construcción de este inmenso imperio justificará todo sacrificio y será la última gran gesta en la que se grabará toda la gloria del imperio."

 GEM_omnipotence: "Sensación de omnipotencia"
 GEM_omnipotence_desc: "Todo se ha rendido ante la gran gesta de la líder. Ahora que el mito de Gehenna y la fuerza germana se han fundido en uno, lo «imposible» no existe en el diccionario de este régimen. Esta sensación de omnipotencia es el derecho natural concedido a la líder que guía a las naciones de los dioses. Y con este gran poder como fundamento, se preparará una epopeya eterna para coronar el último capítulo de la historia."

 GEM_eternal_epic: "Epopeya eterna"
 GEM_eternal_epic_desc: "Aunque las tormentas de la historia arrasen toda narración, el nombre de la líder que dejó su nombre no morirá. La bandera de la civilización «Nórdica-Hinnom» debe ondear por todo el mundo, más allá de Europa. Esta gesta quedará registrada como el único mito hasta el día en que la historia de la humanidad llegue a su fin. Para completar esta «epopeya eterna», comienza la última guerra de conquista."

 GEM_the_tower: "La Torre (The Tower)"
 GEM_the_tower_desc: "La gran visión de la líder está quedando atrapada por una resistencia inesperada. La gesta de la «alianza de los dioses» chirría, y en lugar de armonía entre las dos naciones, solo hay disonancias. Pese a los planes geniales de la líder, esta enorme torre que hemos levantado está temblando desde sus cimientos."

 GEM_day_of_decision: "El día de la decisión"
 GEM_day_of_decision_desc: "Al final, las fuerzas viejas no pudieron comprender lo nuevo. La gesta de la líder era tan grandiosa que los mediocres no soportaron su peso y, aterrados, le dieron la espalda. Los viejos aristócratas germanos y los conservadores de Gehenna se han aliado para etiquetarla de «fracasada» e intentan arrastrarla fuera de su puesto aquí y ahora. Ha llegado el día de la decisión. Antes que abandonar la gesta… solo queda incendiarlo todo."

 GEM_old_dream: "El viejo sueño"
 GEM_old_dream_desc: "La gran visión de la líder se tambalea. Pero, en lugar de enfrentar un destructivo «día de la decisión», ella ha sacado su viejo sueño. Ahora, bajo una nueva bandera llamada «liberalismo nacional transmundial», proclama que conducirá esta federación por un camino más moderado y democrático, permitiendo elecciones libres en lugar de represión. Esto significa que su gesta chocó contra un muro y, al mismo tiempo, marca un nuevo comienzo para superar la crisis del modo más propio de Gehenna."

 #### Bajo Satsuki
 ###### Normal
 GEM_focus_ended_2O_endfocus: "Es la academia más pacífica."
 GEM_focus_ended_2O_endfocus_desc: "Gehenna, la academia de la libertad y el caos. Pero… ¿de verdad es lo mejor? El Club de Investigación Gourmet vive explotando cosas, el Comité de Disciplina y el Manmajeon se enfrentan sin fin, y las estudiantes se tirotean por trivialidades. Todo este desorden, al final, no es más que «dolor». Je, je… Yo solo quiero construir una academia donde todas vivan en paz: sin peleas, entendiéndose mutuamente. Curar la enfermedad llamada conflicto y construir la forma más ideal de «academia». Ese es mi único objetivo."

 GEM_intelligence_expansion_of_manmajeon: "Expansión del Departamento de Inteligencia del Manmajeon"
 GEM_intelligence_expansion_of_manmajeon_desc: "Para mi ambicioso plan de construir una academia pacífica, necesito observar toda la información de la academia como si estuviera en la palma de mi mano. Debemos ampliar el personal y el equipo del Departamento de Inteligencia y extender la red de vigilancia a cada rincón. Es el primer paso para detectar con antelación los signos del caos y analizar las causas de todo conflicto."

 GEM_secret_reformation: "Reforma secreta"
 GEM_secret_reformation_desc: "La verdadera reforma no se logra con discursos ni debates. Debe completarse en silencio, como el agua que se filtra, antes de que nadie se dé cuenta. Mientras los demás se distraen con ruidosos juegos políticos, yo, en lo más profundo del Departamento de Inteligencia, completaré el diseño del sistema perfecto para «curar» Gehenna: «NK Ultra». Esto sí que es una reforma en el sentido más auténtico."

 GEM_academy_nation_construction: "Construcción de un Estado-academia"
 GEM_academy_nation_construction_desc: "Con una estructura vieja e ineficiente no puede alcanzarse la paz verdadera. Ahora que tengo en mis manos el plano perfecto llamado «NK Ultra», es hora de construir una nueva academia. Eliminaremos por completo las luchas de facciones innecesarias y los procedimientos administrativos ineficientes, y crearemos un Estado ideal donde todas las estudiantes y organizaciones se muevan, perfectamente sincronizadas, hacia un único objetivo: «la paz de la academia». La nueva Gehenna que yo misma diseñaré y construiré."

 GEM_veil_politics: "Política del telón"
 GEM_veil_politics_desc: "Un gobernante que se pone al frente siempre termina siendo blanco de rechazo y odio. Pero… ¿y si lo coordinamos todo desde detrás de un telón, con una mano invisible? Je, je… Yo ocuparé el puesto de presidenta, pero el gobierno real se hará desde donde no se ve. La gente creerá que eligió la paz por voluntad propia, pero incluso esa voluntad será parte de mi plan. La política más estable es aquella en la que nadie se da cuenta de que es «política»."

 GEM_maybe_hypnosis_was_never_needed: "Mmm… quizá, cosas como la hipnosis… nunca fueron necesarias."
 GEM_maybe_hypnosis_was_never_needed_desc: "Todo se ha quedado en silencio. Tal como yo quería, la academia ha encontrado una paz perfecta. Pero… a veces lo pienso: ¿no habré ido demasiado lejos? Puede que estas niñas, incluso sin que yo cambiara sus corazones a la fuerza, hubieran podido entenderse y escoger la paz por sí mismas. Sí… he decidido volver a confiar en las personas. «NK Ultra» ya no será un medio de control forzoso, sino una «guía» que ayude a todos a encontrar el camino correcto."

 GEM_but_now_it_is_too_late_to_turn_back: "Pero… ya es demasiado tarde para volver al principio."
 GEM_but_now_it_is_too_late_to_turn_back_desc: "Todo se ha quedado en silencio. Tal como yo quería, la academia ha encontrado una paz perfecta. Pero… a veces una inquietud me roza. Esta paz es tan frágil que, en cuanto afloje aunque sea un instante las riendas del control, quizá vuelva al horrible caos del pasado. Una sola duda puede derrumbarlo todo. No… no vacilaré. Si es para proteger esta paz por siempre, mi método no cambiará jamás. Porque ya es demasiado tarde para regresar."

 GEM_peaceful_nation_endfocus: "Un Estado pacífico"
 GEM_peaceful_nation_endfocus_desc: "Por fin… mi sueño de toda la vida se ha hecho realidad. La Gehenna manchada por el odio y el conflicto ya no existe. Claro, para alcanzar esta paz perfecta tuve muchísimas dudas. Si el camino que elegí era realmente el mejor, si no había una ruta mejor… Hubo momentos en que esa duda me tambaleó. Pero ahora ya no titubeo. Elegí mi camino y debo creer que esa elección fue correcta. Para proteger esta paz y completar el «Estado más pacífico» que soñé. Je, je… yo solo seguiré avanzando."

 GEM_peaceful_nation_endfocus_tt1: "\nSi se eligió la opción de la izquierda:"
 GEM_peaceful_nation_endfocus_tt2: "\nSi se eligió la opción de la derecha:"

 ###### Estado alemán
 GEM_focus_ended_2_A_endfocus: "¿Qué piensas del mundo más allá de la mente?"
 GEM_focus_ended_2_A_endfocus_desc: "Si miras la historia del Partido Nacionalsocialista Obrero Alemán, hubo un proceso en el que existió la Sociedad Thule, una alianza de ocultistas, y el nacionalismo germano siempre ha tenido un trasfondo mítico. Respetarlos y cumplir su utopía… ¿no es eso lo que desean los alemanes?"

 GEM_occult_reconstruction: "Reconstrucción del ocultismo"
 GEM_occult_reconstruction_desc: "Comprenderemos, analizaremos y sistematizaremos por completo los mitos y el misticismo en los que creen. Porque las creencias irracionales pueden ser el medio de control más poderoso. En vez de negar sus mitos, los reconstruiremos en su forma más perfecta y se los devolveremos a su mundo mental, para que ellos mismos caminen hacia el paraíso."

 GEM_secret_propaganda: "Propaganda secreta"
 GEM_secret_propaganda_desc: "El control visible solo genera resistencia. La verdadera armonía se completa cuando la gente llega a «creer» que desea la paz por sí misma. Sembramos nuestro mensaje en todos los ámbitos inconscientes de la sociedad: medios, arte e incluso el ruido de las calles. Sin darse cuenta, odiarán el conflicto y ansiarán el orden. Esta es la propaganda más perfecta, moldeada por una mano invisible."

 GEM_nk_ultra_procedure_mandate: "Obligatoriedad de NK Ultra"
 GEM_nk_ultra_procedure_mandate_desc: "La estabilidad mental de toda la población es el deber más importante que debe asumir el Estado. «NK Ultra» se impondrá como una política avanzada de salud pública para prevenir y tratar la enfermedad social del conflicto y el odio. Mediante «revisiones mentales» periódicas y «procedimientos de estabilización psicológica», ayudaremos a que todo ciudadano mantenga una mente pacífica. Por supuesto, nadie tiene derecho a rechazar este «tratamiento». Es por la felicidad de todos."

 GEM_nazi_party_manmajeon_merger: "Fusión del Partido Nazi y el Manmajeon"
 GEM_nazi_party_manmajeon_merger_desc: "Dos grupos que se vigilaban mutuamente se han tomado de la mano. ¿Parece un milagro? No, no es un milagro: es el resultado de la «comprensión». Yo solo los ayudé un poco para que se entendieran y avanzaran hacia el objetivo común de la «paz». Ahora Gehenna y Alemania ya no son enemigos: se han convertido en camaradas que caminan hacia un mismo gran ideal."

 GEM_thule_radiance: "La irradiación de Thule"
 GEM_thule_radiance_desc: "Los alemanes anhelaban el regreso de su mito olvidado, «Thule». Entonces solo hay que cumplir ese sueño. Unificaremos al pueblo germano bajo un único mito llamado «Thule». Así, los conflictos por raza y origen desaparecerán para siempre, y todos vivirán en armonía como herederos de la gran Arya."

 GEM_provable_issue: "Un problema demostrable"
 GEM_provable_issue_desc: "Habrá quienes no se dejen convencer por mitos, ¿verdad? Entonces demostraremos, en lugar de una realidad caótica, la existencia de un modelo social perfecto demostrable por lógica: un «paraíso». Una sociedad donde todas las variables están controladas y la felicidad de todos está garantizada. Demostraremos quién podría atreverse a resistirse ante esta visión racional."

 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful: "Je, je… ojalá todos fueran un poquito más pacíficos."
 GEM_hehe_everyone_i_wish_were_a_bit_more_peaceful_desc: "Por fin, todo se ha quedado en silencio. En las calles no hay peleas, en los corazones no hay odio, y en todos los rostros descansa una sonrisa serena. El mundo que yo soñaba está justo aquí. Claro, para llegar a esta paz perfecta, hubo que recortar unas cuantas cosas innecesarias… como la dolorosa libertad de voluntad. Pero por esta paz perfecta… ¿no es un precio insignificante?"

 GEM_aryan_spirit: "El alma aria"
 GEM_aryan_spirit_desc: "Míralo. Ya no existen ni gehenna ni alemanes. Solo existe un único pueblo que comparte el puro y noble «alma aria». Bajo nuestro gobierno, por fin han superado todo conflicto y han alcanzado una integración espiritual. Qué escena tan pacífica… contemplemosla una vez."

 GEM_choir: "Coro"
 GEM_choir_desc: "Como un coro donde todas las voces forman una sola armonía, nuestra sociedad ha alcanzado una concordia perfecta. Cada uno interpreta la melodía más eficiente en su lugar, y todo ello se une para completar la gran sinfonía llamada «paraíso». Ya no existe disonancia alguna. No habrá música más hermosa que esta."

 ###### Federación
 GEM_focus_ended_2_B_endfocus: "Bien, construyamos una federación genial. Je, je."
 GEM_focus_ended_2_B_endfocus_desc: "Je, je… Gehenna y Alemania. Niñas ruidosas reuniéndose para hacer un ruido aún mayor. Pero está bien. Este nuevo escenario llamado federación es un entorno excelente para realizar mi ideal. Una federación maravillosa donde todos se toman de la mano y ríen felices. Yo misma les mostraré cómo se hace."

 GEM_bipartisan_control: "Control bipartidista"
 GEM_bipartisan_control_desc: "Reprimir de frente la rivalidad política entre los dos bloques más grandes de la federación —el bloque gehenna y el bloque alemán— es ineficiente. En su lugar, intervenimos en secreto en el liderazgo y la agenda de ambos partidos para conducir su competencia dentro de límites controlables. Así, se mantiene la actividad política superficial, pero se previenen de raíz choques radicales que podrían sacudir los cimientos del Estado."

 GEM_node_control: "Dominio de nodos"
 GEM_node_control_desc: "Identificamos los puntos clave —política, economía, prensa y ejército— que constituyen los pilares del Estado, y usamos las capacidades de inteligencia para asegurar el control de esos puntos. Al apoderarnos de las arterias principales del país, podremos guiar la dirección de toda la federación hacia donde queramos con la mínima resistencia."

 GEM_secret_approach: "Enfoque secreto"
 GEM_secret_approach_desc: "Las reformas radicales siempre provocan rechazo popular. Por eso, todo cambio debe avanzar de un modo que se filtre naturalmente en el sistema social mientras el público no se da cuenta. El enfoque secreto busca minimizar las posibilidades de resistencia y rediseñar el Estado por el método más estable."

 GEM_establish_national_intelligence_agency: "Establecer la Agencia Nacional de Inteligencia"
 GEM_establish_national_intelligence_agency_desc: "El Departamento de Inteligencia del Manmajeon existente tiene límites a la hora de gestionar toda la federación. Fundamos una nueva «Agencia Nacional de Inteligencia» que abarque Gehenna y Alemania para unificar operaciones e información y maximizar la eficiencia. Esta institución será el escudo invisible que proteja la estabilidad de la federación."

 GEM_leader_behind_the_curtain: "La gobernante tras el telón"
 GEM_leader_behind_the_curtain_desc: "La mirada del público siempre se concentra en la líder como individuo. Para evitar esa carga y ese riesgo, colocamos a una figura de alta notoriedad como «presidenta» para que sea el rostro oficial de la federación. El gobierno real se ejercerá desde detrás del telón, manteniendo así un dominio estable y coherente."

 GEM_president_makoto: "Presidenta Makoto" #elige 1
 GEM_president_makoto_desc: "Colocar a Hanuma Makoto como presidenta es efectivo para atraer la mirada del público, pero conlleva un riesgo calculado. Satsuki aplicó sobre ella una interferencia mental ligera por motivos personales, y como resultado, las conductas imposibles y la arrogancia indomable de Makoto siguen latentes. Es el títere más llamativo y, al mismo tiempo, la variable más peligrosa capaz de sacudir este sistema perfecto."

 GEM_president_chiaki: "Presidenta Chiaki" #elige 1
 GEM_president_chiaki_desc: "La energía positiva y la capacidad de control mediático de Motomiya Chiaki son ventajosas para renovar la imagen del país y asegurar el apoyo popular. Ella se convertirá en el símbolo ideal de un futuro brillante para la federación."

 GEM_president_iroha: "Presidenta Iroha" #elige 1
 GEM_president_iroha_desc: "Natsume Iroha, por su indiferencia hacia la política y su inclinación al statu quo, puede ser la líder más obediente al control tras bambalinas. Su presencia dará la impresión de que el Estado se mantiene estable sin cambios radicales."

 GEM_extraordinary_genius: "Un genio extraordinario" #bajo Hanuma Makoto presidenta
 GEM_extraordinary_genius_desc: "Cuando todos se mueven con una sola voluntad, solo ella podrá resistirse. Sus ideas chispeantes y sus hábitos más arrogantes serán la llave más crucial para que Hanuma Makoto pueda darse cuenta de que algo va mal. Ya sea que se conforme con el puesto otorgado o que, insatisfecha, lo derribe todo, esas acciones salpicarán de color un Estado monocromático."

 GEM_ruler_propaganda: "Propaganda del líder" #Chiaki / Makoto compartido
 GEM_ruler_propaganda_desc: "Iniciamos una campaña propagandística a gran escala para elevar a la nueva presidenta electa como símbolo de la unidad nacional. A través de su imagen, se afianza la identidad nacional y se concentra la atención de las masas en el símbolo, no en la esencia de la política."

 GEM_economic_collectivization: "Colectivización económica" #Chiaki / Iroha compartido
 GEM_economic_collectivization_desc: "Impulsamos una colectivización económica que coloca las principales industrias y el capital de la federación bajo control estatal. Bajo la bandera de la «prosperidad común», eliminamos factores de inestabilidad y construimos un sistema en el que el Estado gestiona a la perfección el flujo de todos los recursos."

 GEM_national_harmony_association: "Asociación de Armonía Nacional" #todos
 GEM_national_harmony_association_desc: "Establecemos la «Asociación de Armonía Nacional», a la que toda la población debe afiliarse obligatoriamente. Esta organización fomentará el sentido comunitario mediante intercambios sociales y voluntariado, y a la vez funcionará como un medio clave para difundir la ideología del régimen y gestionar la opinión pública."

 GEM_B_peaceful_country: "Una federación pacífica" #después de Asociación
 GEM_B_peaceful_country_desc: "Por fin, todos los planes se han completado. El conflicto ha desaparecido, la economía se ha estabilizado y la población siente satisfacción dentro del orden armonioso que el Estado propone. En la superficie, se ha completado la forma más ideal de una federación pacífica."

 GEM_forced_cancellation_of_nk_ultra: "Cancelación forzosa de NK Ultra" #bajo Hanuma Makoto presidenta
 GEM_forced_cancellation_of_nk_ultra_desc: "\"...Algo no cuadra. Definitivamente no cuadra. Si fuera yo, Hanuma Makoto-sama, jamás habría actuado así. ¿Que este gran gobernante sienta que está siendo gobernado por alguien...? De verdad, esto…\"\n\n§O\"Por fin siento que he vuelto a ser la gobernante\"§!"

 GEM_ruler_behind_the_curtain_modifed: "La gobernante tras el telón"
 GEM_president_makoto_flag: "§Y$GEM_president_makoto$§! enfoque completado"

 #### Bajo Iroha
 ###### Normal
 GEM_focus_ended_3O_endfocus: "Soy presidenta de la federación, pero no quiero trabajar."
