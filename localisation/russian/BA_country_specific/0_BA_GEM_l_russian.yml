 GEM_motion_of_no_confidence_against_leader: "Moción de censura contra la presidenta [ROOT.GetLeader]"
 GEM_motion_of_no_confidence_against_leader_desc: "[ROOT.GetLeader] no ha puesto el esfuerzo suficiente para resolver los problemas a los que se enfrenta nuestro país, y es evidente que esto no va a cambiar. Ha llegado el momento de someter a votación de censura para destituir a esta líder incompetente."
