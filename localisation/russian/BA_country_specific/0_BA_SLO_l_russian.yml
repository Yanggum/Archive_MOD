  SLO_develop_the_agrarian_economy: "Развивать аграрную экономику"
  SLO_develop_the_agrarian_economy_desc: "Планируя будущее нашей экономики, мы всегда должны сохранять реалистичную перспективу. Реальность такова, что словацкая экономика по сути является аграрной экономикой, а не промышленной. Но мы не должны считать это недостатком; наоборот, мы должны сделать все возможное, чтобы превратить этот факт в наше преимущество."
  SLO_pursue_industrialization: "Стремиться к индустриализации"
  SLO_pursue_industrialization_desc: "На протяжении столетий наша экономика была заброшена, что привело нас к прискорбной ситуации, когда мы даже не достигли индустриализации и остались в отсталости под гнетом бывших Чехии и Венгрии. Теперь, когда мы являемся независимым государством, мы должны исправить эту несправедливость и направить все наши ресурсы на то, чтобы наконец принести индустриализацию в Словакию."
  SLO_finish_the_dubnica_nad_vahom_factory: "Завершить строительство завода в Дубнице-над-Вагом"
  SLO_finish_the_dubnica_nad_vahom_factory_desc: "Оружейный завод в Дубнице-над-Вагом строился компанией Škoda Works (Škoda Works Pilsen), но работы были остановлены в связи с нашей независимостью. Мы должны завершить его строительство и превратить его в главный источник вооружения для нашей армии."
  SLO_establish_the_state_geological_institute: "Основать Национальный геологический институт"
  SLO_establish_the_state_geological_institute_desc: "Горное дело на наших землях исторически процветало благодаря Татрам и их природным ресурсам, но пришло в упадок после Великой войны. В рамках усилий по его возрождению мы основаем Национальный геологический институт под патронажем Дмитрия Андрусова."
  SLO_expand_the_apollo_refinery: "Расширить нефтеперерабатывающий завод Apollo"
  SLO_expand_the_apollo_refinery_desc: "Нефтеперерабатывающий завод, принадлежащий компании Apollo и расположенный в Братиславе, был ключевым элементом городской промышленности, и его значение возрастает еще больше с увеличением спроса на нефть в современной войне. Мы должны использовать наши ресурсы для его расширения и усиления экономической независимости и самодостаточности."
  SLO_slovak_academy_of_sciences_and_arts: "Словацкая академия наук и искусств"
  SLO_slovak_academy_of_sciences_and_arts_desc: "Словацкое образование было заброшено чехословацким правительством, и даже сегодня нам не хватает персонала и учреждений, необходимых для исследования современных технологий, что отстает от других стран. Чтобы ответить на эту ситуацию, мы основаем Словацкую академию наук и искусств."
  SLO_electrification: "Расширить сеть электроснабжения"
  SLO_electrification_desc: "В нашей стране по-прежнему плохое электроснабжение, и не все дома имеют электричество. Мы должны улучшить эту ситуацию и в то же время сосредоточиться на разработке новых технологий в области электронных устройств. Благодаря этому все процессы станут намного проще."
  SLO_expansion_of_the_slovak_university: "Расширение Словацкого университета"
  SLO_expansion_of_the_slovak_university_desc: "Словацкий университет (бывший Университет Коменского) по-прежнему является крупнейшим высшим учебным заведением страны, и мы должны продолжать его расширять, чтобы повысить общее качество образования. Мы создадим новые факультеты, например, факультет естественных наук."
  SLO_connect_the_villages: "Соединить деревни"
  SLO_connect_the_villages_desc: "Чтобы еще больше повысить эффективность нашей аграрной экономики, мы должны сосредоточиться на улучшении дорог и железных дорог, соединяющих деревни. С улучшением путей сообщения людям будет легче перевозить и продавать сельскохозяйственную продукцию по всей стране, оживляя тем самым экономику."
  SLO_modernization_of_agriculture: "Механизация сельского хозяйства"
  SLO_modernization_of_agriculture_desc: "Как и промышленные технологии, сельскохозяйственные технологии и методы также постоянно развиваются, и в последние годы в этой области были достигнуты большие успехи. Мы должны внедрить современные технологии и провести процесс массовой механизации, чтобы поддерживать наше сельское хозяйство на современном уровне."
  SLO_expand_agricultural_exports: "Расширить экспорт сельскохозяйственной продукции"
  SLO_expand_agricultural_exports_desc: "Поскольку мы способны обеспечить себя достаточным количеством продовольствия, необходимо экспортировать сельскохозяйственную продукцию в соседние страны, чтобы стимулировать экономическое развитие и улучшить наши отношения с другими государствами региона."
  SLO_utilize_southern_farmlands: "Использовать южные сельскохозяйственные угодья"
  SLO_utilize_southern_farmlands_desc: "Может показаться, что сельское хозяйство почти невозможно на большей части нашей страны из-за гор Татр, но это не так. В частности, южные регионы, близкие к границе с Венгрией, обладают обильными плодородными землями, которые могут стать богатым и продуктивным источником сельскохозяйственных поставок."
  SLO_new_steel_plants: "Построить новые сталелитейные заводы"
  SLO_new_steel_plants_desc: "Реорганизовав нашу сеть сталелитейных заводов и перейдя на новые современные предприятия, мы сможем еще больше ускорить расширение тяжелой промышленности. Это позволит нам производить ресурсы, необходимые для нашей зарождающейся индустриальной экономики."
  SLO_promote_urbanization: "Поощрять урбанизацию"
  SLO_promote_urbanization_desc: "Братислава уже привлекла большое внимание с тех пор, как стала столицей после обретения независимости, но значительная часть нашего населения по-прежнему живет в небольших городах. Мы должны изменить нашу политику, чтобы стимулировать рост крупных городов — особенно Братиславы — как густонаселенных промышленных центров."
  SLO_grand_projects: "Грандиозные проекты"
  SLO_grand_projects_desc: "Достижение индустриализации означает гораздо больше, чем просто строительство нескольких фабрик. Это означает возведение крупных сталелитейных заводов, модернизацию железнодорожной сети и создание широкой сети заводов, способных производить все, от военных товаров до товаров гражданского назначения. Мы должны подготовить нашу промышленность, еще находящуюся на ранней стадии, к тому, чтобы она соответствовала этим задачам."
  SLO_development_in_the_vah_valley: "Развитие долины Ваг"
  SLO_development_in_the_vah_valley_desc: "В бассейне реки Ваг расположено много городов, и там сосредоточена промышленность, включая ключевые заводы, такие как в Поважска-Бистрице и Дубнице-над-Вагом. Продолжающееся развитие этого региона необходимо для нашей программы индустриализации."
  SLO_defense_law: "Закон о национальной обороне"
  SLO_defense_law_desc: "Словакия переживает опасные времена, а это значит, что мы должны подготовить как армию, так и население. Мы примем новый Закон о национальной обороне, который определит призывной возраст и общий статус армии."
  SLO_military_high_school: "Военная академия"
  SLO_military_high_school_desc: "С основанием словацкой армии также была создана военная академия для подготовки нового состава Генерального штаба на службе нации, и многие бывшие словацкие военные командиры из Чехословакии присоединились к нам. Мы должны поддержать эту академию, чтобы повысить профессионализм Генерального штаба и подготовить новое поколение младших командиров."
  SLO_lessons_of_war: "Уроки войны"
  SLO_lessons_of_war_desc: "Мы воочию пережили, что такое война, и извлекли из нее важные уроки. Весь этот опыт теперь можно использовать для совершенствования и развития нашей стратегии, а также для улучшения военной подготовки."
  SLO_expand_the_military_industrial_complex: "Расширить военно-промышленный комплекс"
  SLO_expand_the_military_industrial_complex_desc: "Заводы в Поважска-Бистрице и Дубнице-над-Вагом находятся недалеко друг от друга и вдоль реки Ваг образуют военно-промышленный комплекс. Их близость облегчает улучшение координации между ними и их совместное расширение. Именно это мы и сделаем."
  SLO_study_foreign_weapons: "Изучать иностранное вооружение"
  SLO_study_foreign_weapons_desc: "Наша отечественная оружейная промышленность мала, но наша способность разрабатывать собственное оружие еще более ограничена, и значительная часть нашей армии по-прежнему оснащена устаревшим чехословацким вооружением. Лучший способ улучшить ситуацию — учиться у более успешных в этой области стран. Мы можем покупать или запрашивать оружие, произведенное великими державами, для его оценки."
  SLO_tatra_warriors: "Воины Татр"
  SLO_tatra_warriors_desc: "Словакия — горная страна, поэтому бои в горах нам не чужды. Мы должны создать в армии специальные подразделения, способные эффективно сражаться в горной местности и защищать родину от иностранного вторжения."
  SLO_learn_from_czechoslovak_tanks: "Учиться у чехословацких танков"
  SLO_learn_from_czechoslovak_tanks_desc: "Если мы хотим развить мобильные силы для нашей армии, мы должны найти способ превзойти нашего предшественника, Чехословакию, которая действительно имела собственную возможность разработки танков. У нас все еще есть большое количество чехословацких танков, и ресурсы, необходимые для их эксплуатации и изучения в целях будущих разработок бронетехники, минимальны."
  SLO_the_fast_division: "Быстрая дивизия"
  SLO_the_fast_division_desc: "Развернуть большую армию почти невозможно, поэтому мы должны сконцентрировать ресурсы на создании, хотя бы одной, дивизии, способной прорвать фронт и развить успех: дивизии, состоящей по большей части из бронетехники. Это и будет Быстрая дивизия."
  SLO_labor_corps: "Штрафной батальон"
  SLO_labor_corps_desc: "Штрафной батальон будет частью нашей армии, состоящей из 'нежелательных' членов нашего общества, и будет использоваться вместе с армией на фронте для строительства траншей и других военных сооружений."
  SLO_technical_divisions: "Технические дивизии"
  SLO_technical_divisions_desc: "Мы должны реорганизовать несколько военных частей в так называемые 'технические дивизии'. Эти дивизии будут использоваться для множества задач, от технического обслуживания и ремонта боевых машин до рытья траншей. Они станут ядром словацкой обороны."
  SLO_establish_the_air_force: "Основать Военно-воздушные силы"
  SLO_establish_the_air_force_desc: "Мы должны объединить небольшие самолеты, унаследованные от Чехословакии, для защиты словацкого неба и создать независимые военно-воздушные силы, способные действовать даже вдали от родины."
  SLO_aviation_school: "Авиационная школа"
  SLO_aviation_school_desc: "С рождением наших военно-воздушных сил также должно быть основано учреждение для подготовки новых пилотов: Авиационная школа. Мы будем использовать опыт существующих пилотов (в основном из чехословацкой программы 'Тысяча пилотов для Республики') для обучения следующего поколения."
  SLO_anti_air_defenses: "Средства ПВО"
  SLO_anti_air_defenses_desc: "Если наших военно-воздушных сил будет недостаточно для разгрома авиации захватчика, мы должны подготовить план действий на случай непредвиденных обстоятельств для защиты нашего воздушного пространства. Этот план будет состоять из стационарных зенитных орудий, стратегически развернутых по всей стране, способных эффективно сбивать вражеские самолеты."
  SLO_aircraft_production_at_dubnica_nad_vahom: "Производство самолетов в Дубнице-над-Вагом"
  SLO_aircraft_production_at_dubnica_nad_vahom_desc: "Современный завод в Дубнице-над-Вагом уже продемонстрировал способность производить авиационные двигатели, но наши военно-воздушные силы требуют большего. Мы должны реконструировать часть завода для производства самолетов. Это будет дорого, но в долгосрочной перспективе окупится, так как мы больше не будем зависеть от заграницы в авиационной технике."
  SLO_emergency_squadron: "Аварийная эскадрилья"
  SLO_emergency_squadron_desc: "Могут возникнуть возможности использовать наши военно-воздушные силы за границей, но мы должны быть осторожны, чтобы не забыть о защите собственного воздушного пространства. Для этого мы сформируем аварийную истребительную эскадрилью, которая будет патрулировать небо Словакии."
  SLO_close_air_support: "Непосредственная авиационная поддержка"
  SLO_close_air_support_desc: "Мы должны разрабатывать и производить наши собственные пикирующие бомбардировщики для поддержки армии на поле боя вместе с нашими истребителями. Благодаря этому военно-воздушные силы станут незаменимым элементом боя."
  SLO_heavy_aircraft_development: "Разработка тяжелых самолетов"
  SLO_heavy_aircraft_development_desc: "По мере роста нашей промышленности нельзя исключать возможность производства более крупных самолетов, таких как тяжелые истребители или стратегические бомбардировщики. Мы всесторонне исследуем эти идеи и разработаем, своими силами и внутри страны, модели такого типа."