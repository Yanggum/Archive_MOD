l_russian:
  # Словакия
  SLO_GATHERING_STORM_DESC: "С поражением Австро-Венгерской империи в Первой мировой войне венгерское господство, длившееся тысячу лет, наконец подошло к концу.\n\nВ ноябре 1935 года, с Великим Перемещением, Чехословацкая республика рухнула, и словаки получили свое первое независимое государство. Однако отсталая аграрная экономика и демократические голоса, восстающие против диктатуры Словацкой народной партии, сотрясают эту молодую страну.\n\nКакой путь изберет первое независимое государство Словенско… только небу известно."
  SLO_guide: "§YЦели§!\n\n£white_dot §0Под руководством Глинки стабилизируйте Словакию и решите будущее Народной партии.§!\n    £white_dot §4Проведите всеобщие выборы и верните демократию в Словакию.§!\n        £white_dot §YКак Словацкая национальная партия, изгоните диктатуру путем коалиции с коммунистами.§!\n            £white_dot §gОсвободите соотечественников в Богемии и восстановите Чехословакию.§!\n            £white_dot §gПроведите конференцию в Вишеграде с Польшей и Венгрией для обсуждения объединения.§!\n        или же...\n        £white_dot §YКак Коммунистическая партия Словакии, придите к власти путем коалиции с Национальной партией и присоединитесь к Коминтерну.§!\n            £white_dot §gОсвободите соотечественников в Богемии и установите Социалистическую Республику Чехословакию.§!\n            £white_dot §gОсвободите регион Дуная вместе с Советским Союзом и установите Дунайскую федерацию.§!\n    или же...\n    £white_dot §4Усильте диктатуру Словацкой народной партии и двигайтесь к славе Словакии под руководством Глинки.§!\n        £white_dot §YПоддержите консерваторов Йозефа Тисо и работайте на стабильность Словакии.§!\n            £white_dot §gИспользуйте возможность, чтобы освободить Богемию и восстановить федерацию под словацким руководством.§!\n            £white_dot §gСотрудничайте с Польшей для объединения западных славян и образования Западной Славии.§!\n        или же...\n        £white_dot §YПоддержите радикалов Войтеха Туки и усильте словацкий национализм.§!\n            £white_dot §gОккупируйте Богемию и ассимилируйте чехов.§!\n            £white_dot §gПоднимите меч против соседних стран на пути к возрождению древней Великой Моравии.§!\n\n\n§CРазработка - Jindoi, 민트쿤mintcoon§!"
  SLO_country_intro_header: "Свет зари, отголоски Великой Моравии"
  SLO_country_intro_header_1: "Тысячелетнее иго, под тенью Венгрии"
  SLO_country_intro_header_2: "Новая надежда, рождение Чехословакии"
  SLO_country_intro_content: "Заселение славянскими народами региона Словакии восходит к V и VI векам. \nОни сыграли центральную роль, к VII веку, в формировании первого славянского государства: Империи Само, возглавляемой франкским купцом Само. \nПозже, в начале IX века, было основано Нитранское княжество с центром в Нитре, на западе современной Словакии, которое вскоре объединилось с Моравским княжеством и развилось в Великоморавскую державу, первое централизованное государство славян.\nВеликоморавская держава правила обширной территорией, включавшей современные Чехию и Словакию, а также части Венгрии. \nВ частности, во время правления князя Ростислава деятельность миссионеров, братьев Кирилла и Мефодия, прибывших из Византийской империи, глубоко повлияла на словацкую историю. \nОни совершали литургию на славянском языке и создали глаголицу, первую письменность славян, заложив основы собственной славянской культуры и христианской веры. \nЭто позже стало важным корнем словацкой национальной идентичности. Однако в начале X века Великоморавская держава была уничтожена мадьярами, вторгшимися с востока, и Словакия вступила в новую, долгую и суровую историческую главу."
  SLO_country_intro_content_1: "После распада Великоморавской державы, с XI века территория Словакии была включена как часть Венгерского королевства на протяжении почти тысячи лет. \nЗа этот долгий период Словакия была известна как 'Верхняя Венгрия' и переживала взлеты и падения в ходе венгерской истории. \nВ XIII веке она пережила трагедию опустошения монгольским нашествием, но позже была постепенно восстановлена благодаря немцам, иммигрировавшим для развития горного дела и торговли. \nВ 1526 году, когда Венгрия была разгромлена Османской империей в битве при Мохаче, ход истории снова изменился. \nС большей частью венгерской территории под османским владычеством центр Венгерского королевства, управляемого домом Габсбургов, переместился в словацкий регион. \nВ результате нынешняя столица Братислава (тогда Пожонь) выполняла в течение около 300 лет роль столицы Венгерского королевства, выступая политическим и культурным центром. \nВ 1867 году, с установлением Австро-Венгерской империи, Венгрия получила значительную внутреннюю автономию, и для словаков это ознаменовало начало очередного испытания. \nВенгерское правительство проводило жесткую политику мадьяризации: запрещало образование на словацком языке и подавляло национальную культуру. \nОднако это угнетение, парадоксальным образом, в конечном итоге укрепило и еще больше сплотило словацкое национальное самосознание."
  SLO_country_intro_content_2: "С поражением Австро-Венгерской империи в Первой мировой войне венгерское господство, длившееся тысячу лет, наконец подошло к концу. \n28 октября 1918 года Словакия, следуя принципу самоопределения наций, объединилась с чешским народом — с которым поддерживала тесные языковые и культурные связи — и основала Чехословацкую республику, открыв новую историческую главу. \nОднако новое независимое государство несло с собой нерешенные проблемы. \nВ то время как чешские земли под австрийским владычеством достигли значительного промышленного развития, Словакия оставалась отсталой и сосредоточенной на сельском хозяйстве под венгерским владычеством, что создало серьезный экономический дисбаланс между двумя регионами. \nКроме того, из-за длительной политики мадьяризации было очень мало словацких интеллектуалов с высшим образованием, поэтому большинство ключевых административных и образовательных должностей остались в руках чехов, что также стало потенциальным фактором трений между двумя народами. \nТем не менее, Чехословакия считалась стабильным государством, которому успешно удалось утвердить демократию в Центральной Европе, и Словакия смогла в этот период заложить ценную основу для политического, экономического и культурного роста. \nВ ноябре 1935 года, с Великим Перемещением, Чехословацкая республика рухнула, и словаки получили свое первое независимое государство. Однако отсталая аграрная экономика и демократические голоса, восстающие против диктатуры Словацкой народной партии, сотрясают эту молодую страну.\nКакой путь изберет первое независимое государство Словенско… только небу известно."

