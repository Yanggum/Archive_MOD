  ## ПОДСКАЗКИ ##
  SLO_vote_tt: "В §YСловакии§! состоятся §Yвсеобщие выборы§!. Результат будет варьироваться в зависимости от §Yпопулярности партий§!.\n- Если популярность §RКоммунизма§! или §CДемократии§! находится между §Y25% ~ 49%§!, а популярность §LФашизма§! §Yниже 50%§!:\nБудет сформировано §Yкоалиционное правительство§! для противостояния §LФашизму§!.\n- Если популярность §RКоммунизма§! или §CДемократии§! или §LФашизма§! составляет §Y50% и выше§!:\n§YПартия, соответствующая своей популярности§! сформирует кабинет.\n- Если §RКоммунистическая партия§! войдет в §YКабинет§!, §LНародная партия§! может §Yне признать§! §Yрезультаты выборов§!."
  SLO_tt_1: "Длительность национального духа §YЧешские изгнанники§! продлевается на §Y720 дней§!."
  SLO_tt_2: "Не завершен фокус §YДавление на Венгрию§!, или сторона [POL.GetAdjective] приняла §Yразрыв отношений§! с §Y[HUN.GetAdjective]§!."
  POL_cut_of_HUN_no: "§Y[POL.GetAdjective]§! не приняла разрыв отношений с §Y[HUN.GetAdjective]§!."
  SLO_tt_3: "Вы подписали §Yсоглашение§! по крайней мере с §Yодной страной§!."
  SLO_tt_4: "В нашей стране построена §Y1 гражданская фабрика§!.\n§RНо Словакия будет оказывать на нас большее влияние.§!"
  SLO_tt_5: "§Y3 гражданские фабрики§! будут добавлены в нашу страну в течение §Y180 дней§!.\n§RНо Словакия будет оказывать на нас большее влияние.§!"
  SLO_tt_6: "§YСловацкие рабочие§! будут работать в нашей стране в течение §Y360 дней§!.\n§RНо Словакия будет оказывать на нас большее влияние.§!"
  SLO_tt_7: "Устраняется, когда §Yвлияние Словакии§! падает ниже §Y70%§!."
  SLO_tt_8: "\nЗапросить у §Yчленов фракции§! подписание §YАнти-венгерского фронта§! и принятие §Yэмбарго против Венгрии§!."
  SLO_tt_9: "§Y[HUN.GetNameWithFlag]§! с большей вероятностью примет, если выполнено следующее:\n - §Y[SLO.GetNameWithFlag]§! имеет больше войск, чем §Y[HUN.GetNameWithFlag]§!\n - §Y[SLO.GetNameWithFlag]§! является великой державой\n - §Y[SLO.GetNameWithFlag]§! состоит во фракции вместе с §Y[ROM.GetNameWithFlag], [YUG.GetNameWithFlag], [POL.GetNameWithFlag]§!\n - §RЕсли [HUN.GetNameWithFlag] является великой державой или состоит во фракции, вероятность принятия уменьшится.§!"
  SLO_tt_10: "При начале §Yвойны против Венгрии§!:"
  SLO_tt_11: "Вы получаете §Y6 дивизий§!, сформированных из §Y9 батальонов пехоты и артиллерийской поддержки§!."
  SLO_tt_12: "Вы получаете §Y4 элитные дивизии§!, сформированные из §Y7 батальонов пехоты, 2 батальонов артиллерии и артиллерийской поддержки§!."
  SLO_tt_13: "Если популярность §LФашизма§! ниже §Y50%§!, §Rнарод разгневается§!."
  SLO_tt_add_5: "Влияние на §Yэту страну§!: §G+5%§!."
  SLO_tt_remove_5: "Влияние на §Yэту страну§!: §R-5%§!."
  SLO_tt_2remove_5: "Влияние §YСловакии§!: §G-5%§!."
  SLO_tt_allremove_2: "Влияние на §Yвсех членов§!: §R-2%§!."
  SLO_tt_more75: "Влияние на §Yэту страну§!: §G75%§! или более."
  SLO_tt_more100: "Влияние на §Yэту страну§!: §G100%§! или более."
  SLO_tt_south_slovakia: "Устраняется при контроле над регионом §Y[664.GetName]§!."
  SLO_tt_bohemia: "Устраняется при контроле над регионом §Y[9.GetName]§!."
