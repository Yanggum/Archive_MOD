 # 4. Eventos (Events)
 # ================================================
 # Eventos iniciales / generales
 TRK_events.1.t: "[TRK.GetName]"
 TRK_events.1.desc: "Когда осела пыль, новый правитель вошел на территории, которые контролировал Тринити. Победитель, которого никто не может отрицать: Академия Генна. [TRK.GetName], управляемая в форме военного правительства, имеет четкие цели: восстановить земли, опустошенные войной Генны и Тринити, и построить новый, по-настоящему свободный Тринити, а не жестокий и репрессивный режим, как в прошлом. Конечно, при условии, что все это будет происходить под надзором Генны.\n\nВ настоящее время военное правительство Генны оказывает сильное давление на временную администрацию: провести новые выборы в законодательный орган, созвать учредительное собрание и пересмотреть новую конституцию. Кроме того, оно требует, чтобы Хост была избрана демократическими процедурами. Нравится нам это или нет, скоро будут новая конституция и выборы. Судьба Тринити теперь в руках ее граждан."
 TRK_events.1.a: "Понял."

 TRK_events.2.t: "Избирательный период в Тринити"
 TRK_events.2.desc: "Конституция была изменена, и Тринити скоро проведет выборы. Это выборы огромного значения: первые свободные выборы после Мисоно Мики. Избирательная комиссия зарегистрировала в общей сложности четыре кандидатуры и фракции, то есть партии.\n\nПервая — это народная фракция под названием «Студенческая коалиция Тринити» во главе с Уравой Ханако. Вторая — Юридзоно Сейя, которая считалась жертвой трагического убийства, но восстановила Орден рыцарей Гроба Господня и разрушенную фракцию Санктус, чтобы снова претендовать на должность Хост. Третья — Кирифуджи Нагиса, которая была заключена в тюрьму Мисоно Микой, но была освобождена, когда Генна наступала на Эдем, а Манмаджун вместе с Дисциплинарным комитетом вытащили ее из заточения; ее героическая история дала ей наибольшую популярность среди студентов и масс. Наконец, хотя и неся презрительное прозвище «приспешница фракции Патер», Утадзуми Сакурако и Сестринство — крупнейший представитель тринитарного христианства — участвуют в этих выборах.\n\nНа выборах в Тринити избирают Хост и, одновременно, места в Чайной партии. Когда они закончатся, независимо от результата, Генна положит конец военному правительству и полностью передаст власть гражданскому правительству, хотя по-прежнему будет сохранять огромное влияние. Основные фракции Тринити готовятся с рвением: заполняют должности, собирают средства и стараются восстановить свою организацию и идеологию. В отличие от обычного избирательного цикла, когда выбираются не все должности сразу, все знают, насколько важны выборы [GetYear], на которых разыгрываются все места в Чайной партии."
 TRK_events.2.a: "Демократия стала реальностью!"

 TRK_events.3.t: "Вопрос об избирательных правах немцев"
 TRK_events.3.desc: "Право голоса для немцев уже давно является повторяющейся проблемой. Во время правления Мисоно Мики право голоса для немцев было гарантировано, хотя и в очень ограниченной форме. Однако после поражения голоса местных немцев стали громче, и этот вопрос снова был вынесен на обсуждение.\n\nКонечно, остается вопрос, в какой степени должно быть гарантировано их политическое участие. Это все еще открытое решение: сохранить ли ограниченное избирательное право и право быть избранным по образцу Мисоно Мики, или предоставить полное признание. Со временем нам не останется ничего другого, кроме как обсудить это; сделать это сейчас тоже не обязательно плохо."
 TRK_events.3.a: "Мы обсудим это позже."
 TRK_events.3.b: "Закрепим в конституции избирательное право немцев."

 TRK_events.4.t: "Религия Пероро?"
 TRK_events.4.desc: "Внутри торжественной часовни горят сотни свечей, и звучит величественный орган. Но в центре алтаря была не Дева Мария, а «Огромная кукла лимитированного издания Пероро, подмигивающая (Вер. коллаборации Кайтенгер)».\n\nСтудентки в рясах держали не Библии, а светящиеся палочки, и свет свечей снизу вверх жутковато освещал глупое и милое лицо Пероро.\n\n«О... Господь Пероро... твоему игривому языку мы вверяем наши души...!»\n«Пусть розыгрыш мерча... дарует нам благодать «выигрыша»!»\n«Но! Но! Но!»\n\nТогда из-за алтаря девушка с белыми крыльями пятилась с холодным потом. На голове у нее была шляпа «Верховной жрицы», как будто ее насильно нахлобучили.\n\n«П-простите... я просто пришла, потому что мне сказали, что это обмен лимитированного мерча... почему атмосфера стала религиозной? И не могли бы вы снять с меня эту шляпу?»\n\n«Смотрите! Наша «Фауст» получила откровение от бога Пероро!»\n«Уоооо! Фауст! Фауст!»\n\n«Да нет же—!»\n\nКто-то донес, и Комитет справедливости вмешался. Религиозная группа была подвергнута простому расследованию, и во время конфискации был обнаружен неожиданный предмет: удивительно, но в списке конфискованного имущества значилось 400 кукол Пероро."
 TRK_events.4.a: "Но! Но! Но!"

 TRK_events.5.t: "Независимость органа управления"
 TRK_events.5.desc: "Телефон не перестает звонить. Факс извергает листы, как водопад, а за окном видны срочно отправленные грузовики с центральной территории Генны, поднимающие облака пыли, въезжая в колонну.\n\n«Что это все? Тактические шаттлы 168? Батальон новейшей полевой артиллерии, который должен быть в метрополии? А этот документ?!»\n\nНа бумаге, которую администратор держал дрожащими руками, заголовок был недвусмысленным: **Чрезвычайный административный приказ № 66: Передача автономии Органу договора Эдема и постоянное закрепление активов**. С гражданской войной в Генне, склоняющейся к поражению, они решили, что лучше перебросить все ресурсы сюда, чем отдавать их вражеской фракции.\n\nСклады вот-вот лопнут от танков и припасов, перенаправленных из самого сердца страны. На столе громоздятся пункты «гарантии автономии», разработанные слоями, чтобы даже единое и победоносное правительство Генны не могло легко до них добраться. Еще вчера мы были просто оккупационным органом, оглядывающимся на метрополию. В одночасье мы стали самой хорошо вооруженной «независимой» администрацией в Кивотосе.\n\nЭто не подарок. Это последнее проклятие — и тошнотворная ловушка — побежденных: чтобы мы выжили, противостоя победившему правительству метрополии. Но какой у нас другой выбор? Двигатели танков уже запущены, а печать на документе уже высохла."
 TRK_events.5.a: "Часы тикают с неотложной настойчивостью."

 TRK_events.6.t: "Независимость органа управления"
 TRK_events.6.desc: "Отчет об оккупации попал на стол. Но сообщаемые цифры абсурдно отличались от ожидаемых.\n\n«Полный захват ключевых военных складов. Однако внутри пусто. Материалов нет.»\n\nТо, что войска нашли при входе, было хаотичными следами шин грузовиков, уехавших в спешке, и несколькими листами накладных, которые не успели сжечь. Проследив маршрут, подтвердили, что огромный объем пропавших танков, артиллерии и предметов первой необходимости был в экстренном порядке перемещен в приграничную зону, находящуюся в ведении «Органа договора Эдема (ETO)».\n\nС приближением поражения оппозиционная фракция предпочла использовать лазейку в договоре, чтобы «передать» свои активы третьей зоне, вместо того чтобы позволить единому правительству поглотить эти ресурсы и усилиться. Сбросив туда материалы вместе с документами о передаче автономии, они превратили район, управляемый ETO, в крепость, на которую метрополия не может навязать свой контроль.\n\nЭто последний взмах побежденных, мелочная месть. Мы выиграли гражданскую войну, но в обмен нам подставили к горлу бомбу замедленного действия: сильно вооруженный «непокорный автономный округ»."
 TRK_events.6.a: "Часы тикают с неотложной настойчивостью."

 TRK_events.7.t: "Возможность?"
 TRK_events.7.desc: "После гражданской войны и столкновений между академиями Генны, Орган управления Эдема, имеющий с нами общую границу, по-видимому, оказался во временно незащищенной административной позиции; или, что еще хуже, в квази-независимом состоянии.\n\nДругими словами: если, исходя из целей Отделения Ариус, мы решительно потребуем возврата территории суверенитета Ариус, они, вероятно, будут вынуждены согласиться. Они еще не перевооружились и сосредоточены на укреплении границы с Генной; вряд ли они смогут позволить себе угрозу в тылу."
 TRK_events.7.a: "Хорошо. Отправьте ультиматум."
 TRK_events.7.b: "Нет… Генна, вероятно, вмешается."

 TRK_events.8.t: "Ультиматум Отделения Ариус"
 TRK_events.8.desc: "Похоже, Отделение Ариус рассматривает инцидент с Органом управления Эдема как возможность. Они прислали нам ультиматум с требованием уступки территории недалеко от Данцига, которую считают своей, и, кажется, готовят вторжение против нашей академии на границе."
 TRK_events.8.a: "Нет альтернативы. Мы должны защищать границу с Генной."
 TRK_events.8.b: "Решительно отвергнуть!"

 TRK_events.9.t: "Возврат территорий суверенитета Органом управления Эдема"
 TRK_events.9.desc: "Воспользовавшись инцидентом с Органом управления Эдема, они согласились вернуть территорию, суверенитет которой мы требовали. Мы аннексировали регион без какого-либо военного столкновения!"
 # (no option line provided in original)

 TRK_events.10.t: "Отказ от ультиматума Органом управления Эдема"
 TRK_events.10.desc: "Воспользовавшись инцидентом с Органом управления Эдема, мы потребовали возврата спорной территории, но Орган заявил, что не существует никаких международных оснований для принадлежности этой зоны нам, и отказался ее возвращать.\n\nЭто дипломатическое унижение — которое может быть понято только как пренебрежение нашим суверенитетом, унаследованным от одностороннего изгнания старым советом старого Тринити — возможно, вынудит нас готовиться к войне!"
 TRK_events.10.a: "Объявите войну!"
 # Eventos electorales (Election Events)
 TRK_election_events.1.t: "Речь Уравы Ханако"
 TRK_election_events.1.desc: "\"Ах, проверка микрофона... раз, два. Хи-хи... Всем привет. Я Урава Ханако. До сих пор политика Тринити была очень тяжелой, не так ли? Как нижнее белье, которое не подходит по размеру... хи-хи.\"\n\nПервой начала действовать Урава Ханако. Она лучше всех знает, что ее база поддержки слаба, поэтому с самого начала выработала стратегию: действовать интенсивно и заявить о своем присутствии.\n\nК счастью, кажется, это сработало. Речь Уравы Ханако быстро распространилась через социальные сети."
 TRK_election_events.1.a: "Граждане воодушевились речью Уравы Ханако!"
 TRK_election_events.1.b: "Граждане почувствовали неловкость из-за непристойностей."

 TRK_election_events.2.t: "Фракция Санктус и Орден помощи"
 TRK_election_events.2.desc: "Фракция Санктус сильно раскололась после попытки убийства Юридзоно Сейи. После Мисоно Мики Юридзоно Сейя, ее последователи и Орден помощи снова поднимают рушащуюся фракцию.\n\nОрден помощи, руководимый убеждениями своего командира Аомори Мине, держался относительно далеко от политики. Однако появление Мисоно Мики и война против Генны оставили у них определенное чувство ответственности: их незаинтересованность в политике также частично способствовала возникновению этой ситуации. Поэтому они оказывают определенное политическое влияние, хотя и ограничиваются косвенной поддержкой фракции Санктус.\n\nСреди граждан Тринити сформировалась умеренная база поддержки, основанная главным образом на исторических добрых делах Ордена помощи и симпатии к Юридзоно Сейе."
 TRK_election_events.2.a: "Примерная стратегия!"

 TRK_election_events.3.t: "Протест против Генны"
 TRK_election_events.3.desc: "Тот факт, что мы были побеждены Генной, естественно, стал огромным ударом для студентов Тринити. Протесты против военного правительства Генны проводились часто и продолжались даже тогда, когда Кирифуджи Нагиса объезжала Центральный округ, проводя кампанию и произнося речь. Место внезапно стало хаотичным; сторонники Кирифуджи Нагисы столкнулись с анти-генновскими протестующими, и вскоре начались драки.\n\nКирифуджи Нагиса была несколько озадачена, но взяла себя в руки и начала свою речь, демонстрируя свою выдержку."
 TRK_election_events.3.a: "Кирифуджи Нагиса успокоила ситуацию своим харизматичным влиянием."
 TRK_election_events.3.b: "Кирифуджи Нагиса не смогла успокоить ситуацию."

 TRK_election_events.4.t: "Благотворительная деятельность Сестринства"
 TRK_election_events.4.desc: "Сестринство участвует в президентских выборах, но по сути остается церковной группой, основанной на христианстве. Естественно, они всегда занимались благотворительностью. Во время избирательной кампании эта благотворительность не прекращалась; возможно, даже немного усилилась.\n\nКонечно, эта деятельность не лишена противоречий: просматривается, пусть и слегка, намерение расширить свое политическое влияние с помощью благотворительности. Утадзуми Сакурако заявила, что это действия, основанные на христианских принципах, и поэтому далекие от политики, но никто не знает ее истинных намерений."
 TRK_election_events.4.a: "Ну... это свобода, не так ли?"
 TRK_election_events.4.b: "Давайте временно ограничим благотворительность."

 TRK_election_events.5.t: "Выбор немецких граждан"
 TRK_election_events.5.desc: "На этих выборах, где немцам гарантировано — хотя и в ограниченной форме — право политического участия, куда склонятся их сердца? По крайней мере, не в сторону Сестринства, которое сотрудничало с фракцией Патер и Мисоно Микой.\n\nС расширением политических прав кандидаты продвигают политику, направленную на местных немцев. Урава Ханако, например, выступает за полное равноправие; она также не забывает о защите меньшинств. Точно так же и другие фракции в определенной степени разработали политику для немцев."
 TRK_election_events.5.a: "Немцы выбрали местную партию!"
 TRK_election_events.5.b: "Они выбрали Студенческую коалицию!"
 TRK_election_events.5.c: "Они выбрали фракцию Санктус!"
 TRK_election_events.5.d: "Они выбрали фракцию Филиус!"

 TRK_election_events.6.t: "Юридзоно Сейя в центре противоречий"
 TRK_election_events.6.desc: "Распространилась информация, что соглашение между Юридзоно Сейей и Орденом помощи в огромной степени способствовало приходу к власти Мисоно Мики, и теперь требуют объяснений как от фракции Санктус, так и от Ордена помощи.\n\nМногие пришли к выводу, что если бы Юридзоно Сейя вернулась, не заключая этой сделки, она могла бы сдержать безудержность Мисоно Мики. Граждане Тринити решительно требуют объяснений."
 TRK_election_events.6.a: "Юридзоно Сейе удалось погасить противоречия."
 TRK_election_events.6.b: "Юридзоно Сейе не удалось погасить противоречия."

 TRK_election_events.7.t: "Лихорадка Студенческой коалиции"
 TRK_election_events.7.desc: "Традиционная Чайная партия была жесткой, изолированной от внешнего мира и не отражала должным образом волю студентов. Поэтому студенты Тринити естественно воодушевились Уравой Ханако и Студенческой коалицией, поднимающими такие знамена, как справедливость и прозрачность.\n\nКажется, Урава Ханако тоже умело использует этот образ. Особенно после провала «популизма» Мисоно Мики студенты проявляют больший интерес к политическим решениям и более активно выражают свое мнение; как будто открылась новая страница в политике Тринити."
 TRK_election_events.7.a: "Интересно."
 TRK_election_events.7.b: "Нужно найти способ помешать им."

 TRK_election_events.8.t: "Единство через веру"
 TRK_election_events.8.desc: "Кампания Сестринства опирается на лозунг: «Тринити, которым мы снова сможем гордиться». Медленно заполняя вакуум избирательной базы, оставленный фракцией Патер, Сестринство быстро растет.\n\nОсобенно сильно они подчеркивают христианскую доктрину, что привело к тому, что часть местного населения также оказывает им определенную поддержку. Кроме того, Сестринство выходит из тени фракции Патер: они открыто выступают против политического насилия и незаконных действий и претворяют это в жизнь, постепенно оправляясь от прошлого, которое вызвало неприятие многих студентов."
 TRK_election_events.8.a: "Новая форма тринитарного консерватизма?"

 TRK_election_events.9.t: "Блудный сын"
 TRK_election_events.9.desc: "Во время правления Мисоно Мики несколько лидеров из других фракций присоединились к фракции Патер; среди них также были кадры из фракции Филиус, такие как Нагаёси Субару или Ямамото Нана.\n\nТеперь они хотят вернуться во фракцию Филиус, и большинство стремится вернуться в политику. Если они совершили преступления в эпоху Мисоно Мики, они будут расследованы и осуждены, но в лоне Филиуса обсуждается, как обращаться с этими «блудными сынами»: оппортунистами, которые присоединились к Патеру, а теперь намереваются вернуться в свою бывшую фракцию."
 TRK_election_events.9.a: "Разрешить возвращение."
 TRK_election_events.9.b: "Нет места уступкам."

 TRK_election_events.10.t: "Конец кампании"
 TRK_election_events.10.desc: "День выборов очень близок. Кампания также вступает в финальную стадию. С явными сильными и слабыми сторонами каждой кандидатуры, кто лучше завершил?"
 TRK_election_events.10.a: "Студенческая коалиция"
 TRK_election_events.10.b: "Фракция Санктус"
 TRK_election_events.10.c: "Фракция Филиус"
 TRK_election_events.10.d: "Сестринство"

 TRK_election_events.11.t: "Итоги выборов!"
 TRK_election_events.11.desc: "Напряженная кампания закончилась, и выборы также завершились. Пока каждая кандидатура наблюдает за подсчетом голосов в своем командном центре, все внимание Тринити сосредоточено там.\n\nКто возглавит следующий этап Тринити? Кем бы он ни был, его ждет трудный путь. Наследие, оставленное Мисоно Микой, отравило Тринити. Исцеление этой паники может занять годы или даже больше.\n\nОднако даже в этой тьме есть луч надежды. Студенты Тринити вернули драгоценную свободу: у них есть лидер, избранный их собственными руками, настоящий работающий парламент, и они больше не находятся во власти беззакония и насилия. Это именно начало истинной демократии.\n\nКогда подсчет голосов вот-вот будет опубликован, все взгляды устремлены на одну точку. Кто будет следующей Хост Тринити...?"
 TRK_election_events.11.a: "Урава Ханако из Студенческой коалиции!"
 TRK_election_events.11.b: "Юридзоно Сейя из Санктус!"
 TRK_election_events.11.c: "Кирифуджи Нагиса из Филиус!"
 TRK_election_events.11.d: "Утадзуми Сакурако из Сестринства!"
 TRK_election_events.11.e: "Сообщение разработчика"

 TRK_election_events.12.t: "Инаугурационная речь Хост"
 TRK_election_events.12.desc.hanako: "\"Хи-хи... Никогда не думала, что выберут кого-то вроде меня... Быть Хост Тринити... Ничего себе, просто слушать это уже... волнующе, не так ли?\"\n\nУрава Ханако и Студенческая коалиция превзошли другие фракции и получили избрание граждан.\n\nУрава Ханако — фигура реформистского и прогрессивного характера. Уже давно она испытывала глубокое недовольство старыми обычаями Тринити. С возвышением Мисоно Мики ситуация достигла предела, и в конце концов Ханако не оставалось ничего другого, кроме как покинуть Тринити и исчезнуть.\n\nНо наступил переломный момент. После поражения началось военное правительство Генны, а также открылись выборы в Тринити. В midst этих перемен Ханако открыла новую возможность: надежду на то, что Тринити тоже может измениться.\n\nТеперь, вступив в должность Хост с доверием и поддержкой студентов Тринити, перед ней открывается новое будущее. Темное и душное прошлое Тринити, как змеиное гнездо, наконец-то уйдет в историю."
 TRK_election_events.12.a: "Поздравляем, Урава Ханако!"

 TRK_election_events.12.desc.seia: "\"То, что вы выбрали меня, означает, что вы верите в меня, верно? Хи-хи. Я сделаю все возможное, чтобы оправдать эти ожидания.\"\n\nЮридзоно Сейя и фракция Санктус превзошли другие фракции и получили избрание граждан.\n\nЮридзоно Сейя обладает одновременно прогрессивными и консервативными чертами. Нелегко точно определить ее идеологию, но есть кое-что ясное: никто не может отрицать, что она реформист. Чтобы преобразовать Тринити, она будет убеждать и вести переговоры. Если потребуется, она также не будет колебаться, чтобы действовать решительно.\n\nКакой Тринити она пытается построить? Это даже трудно представить. Ее своеобразный, почти потусторонний характер может также отразиться в политике государства. Но одно несомненно: выбрана новая Хост, и граждане удовлетворены этим выбором.\n\nПеремены в Тринити уже начались. Никто не знает, будут ли они просачиваться постепенно или разразиться ураганом."
 TRK_election_events.12.b: "Поздравляем, Юридзоно Сейя!"

 TRK_election_events.12.desc.nagisa: "\"Сумма вашего драгоценного доверия дала мне новую возможность. В этом месте, где рассеялся туман подозрений, я обещаю выполнять свои обязанности Хост... чтобы ваши улыбки, которые я вижу перед собой, никогда не были нарушены.\"\n\nКирифуджи Нагиса и фракция Филиус превзошли другие фракции и получили избрание граждан.\n\nКирифуджи Нагиса стремится к стабильности Тринити и постепенным реформам. Ее лидерство и харизма — способность вести переговоры, идти на компромисс и при этом сохранять инициативу — были одной из причин, по которым Тринити смог выжить даже в midst феномена Перемещения.\n\nХотя она не смогла остановить дворцовый переворот Мисоно Мики и трагедия разразилась, самоотверженность, которую она проявила в этом процессе, превратилась в героическую историю. Это привело к ее избирательной победе после войны.\n\nТринити вернет стабильность, которая была до Мисоно Мики. Студенты устали от хаоса и хотят вернуться к нормальной жизни. Это желание выбрало Кирифуджи Нагису. Ее прагматичный подход обеспечит устойчивое развитие на стабильной основе. Нам не нужны радикальные изменения: осторожная реформа — вот что нужно Тринити сейчас."
 TRK_election_events.12.c: "Поздравляем, Кирифуджи Нагиса!"

 TRK_election_events.12.desc.sakurako: "\"В прошлом Сестринство вступило в сговор с неправильной властью и стало тенью, которая подавляла вашу свободу и обрекала вас на молчание. Даже с этой виной и несмываемым клеймом, я смиренно приму вашу волю, доверившую мне эту тяжелую миссию. Как Хост, я не превращу ваши голоса в простую формальность, но сделаю их своим священным писанием и буду служить с самого низкого места...\"\n\nУтадзуми Сакурако и Сестринство превзошли другие фракции и получили избрание граждан. Сестринство, которое было тенью Мисоно Мики, снова держит власть. Раньше они были тенью правительства; теперь, неся карму прошлого, они вышли на свет.\n\nСакурако стремится защищать, поддерживать и укреплять религиозные ценности в меняющемся контексте. Конечно, она не намерена навязывать их жестко. (Исходный текст обрывается здесь.)"
 TRK_election_events.12.d: "Поздравляем, Утадзуми Сакурако!"

 TRK_election_events.13.t: "Рекрутинг выбор ★3!"
 TRK_election_events.13.desc: "§BПосле покупки билета выбора ★3 выберите студентку.§!\nВы сможете выбрать студентку в меню выбора студенток до истечения срока действия обменного билета.\n£white_dot Если вы выберете студентку, которую уже завербовали, она превратится в Элигму и Элеф этой студентки."
 TRK_election_events.13.a: "Урава Ханако"
 TRK_election_events.13.b: "Юридзоно Сейя"
 TRK_election_events.13.c: "Кирифуджи Нагиса"
 TRK_election_events.13.d: "Утадзуми Сакурако"

 # Eventos de ambientación (Flavor Events)
 TRK_flavor_events.1.t: "Какова была ошибка 1936 года?"
 TRK_flavor_events.1.desc: "Беспрецедентная катастрофа: покушение на Юридзоно Сейю; избрание Мисоно Мики Хост; пятая всеобъемлющая конституционная реформа Общей академии Тринити; и даже война против Генны... Неудачи Тринити начались с Мисоно Мики и закончились Мисоно Микой.\n\nОднако наследие, оставленное Мисоно Микой и ее террористами, отравило весь Тринити. Студенты больше не верят в Чайную партию и смотрят на нее с подозрением. Кроме того, сопротивление остаточных кадров фракции Патер распространяет по всему Тринити дешевые теории заговора: что за этим стояла скрытая сила, что фракции Филиус и Санктус саботировали нас, что Комитет справедливости не выполнил свой долг, и прочую ерунду.\n\nНо мы получили новую возможность выпрямить историю. Конечно, это возможность, рожденная под надзором внешней силы, а не нашими собственными руками. Тем не менее, мы не должны довольствоваться реальностью. Даже если академия остается под пристальным взглядом военного правительства Генны, мы должны предотвратить другой случай, подобный Мисоно Мике. Это не вариант: это миссия, навязанная нам эпохой."
 TRK_flavor_events.1.a: "\"Даже оставаться спокойным не так-то легко.\""

 TRK_flavor_events.2.t: "Будущее фракции Санктус"
 TRK_flavor_events.2.desc: "С пробуждением Юридзоно Сейи фракция Санктус продвигалась в своем восстановлении под ее руководством. В процессе Сейя, ее последователи, некоторые кадры прогрессивной ориентации и даже ветераны присоединились, и Санктус постепенно возвращал облик, который имел до Мисоно Мики.\n\nПосле неудавшегося покушения на Юридзоно Сейю ее «глаз, чтобы видеть будущее» закрылся. Без своей пророческой силы Сейя была преследуема комплексом неполноценности: она чувствовала, что больше ни на что не годна. Но восстанавливая фракцию — убеждая ветеранов и прогрессивных лидеров, двигаясь на своих ногах и проходя через множественные инциденты — она восстановила свою самооценку, и ее прежнее циничное и пессимистичное отношение полностью излечилось.\n\nФракция Санктус также получила великий альянс: Орден помощи, возглавляемый Аомори Мине. Сделки с Мине было достаточно, чтобы сблизить их, и теперь обе фракции нуждаются друг в друге. Этот союз, возможно, не вечен, но на какое-то время будет прочным."
 TRK_flavor_events.2.a: "\"Вот именно: все пути, в конце концов, ведут к одному.\""

 TRK_flavor_events.3.t: "Урава Ханако снова активна"
 TRK_flavor_events.3.desc: "После прихода к власти Мисоно Мики она исчезла без следа... но теперь снова объявилась. Конечно, в своем стиле: появилась в новом откровенном наряде, и Шимоэ Кохару утихомирила ее, снова вернув сцену к повседневной «нормальности».\n\nКакова именно причина ее возвращения? Шимоэ Кохару, которая была с ней довольно близка, спрашивала ее несколько раз, но так и не получила четкого ответа. Тем не менее, если собрать недавние события, возможно, проступит контур.\n\nНеизвестно, метит ли она на пост Хост или замышляет что-то другое. Она всегда была исключительной, и кажется маловероятным, что кто-то полностью поймет сердце этой девушки."
 TRK_flavor_events.3.a: "Искреннее желание"

 TRK_flavor_events.4.t: "Выдержка Сестер"
 TRK_flavor_events.4.desc: "Сестринство. С чего начать их описывать? Если бы нужно было выбрать фракцию с самой неоднозначной позицией в нынешнем Тринити, первой на ум пришло бы Сестринство. Сестры, которые заключили сделку с Мисоно Микой и стали прислужницами Чайной партии, сегодня презираемы гражданами и теми, кто верит в тринитарное христианство.\n\nПосле поражения Сестринство все еще демонстрирует свое присутствие, опираясь на огромную силу тринитарного христианства. Но что они действительно могут сделать? Чтобы вернуться назад, они уже прошли слишком далеко. По крайней мере, обновление их имиджа потребует много времени."
 TRK_flavor_events.4.a: "…хотя, если подумать, я сама уже в ситуации, когда заключила сделку с грехом."

 TRK_flavor_events.5.t: "‘Хост’ Урава Ханако"
 TRK_flavor_events.5.desc: "\"Хост, календарь заседаний кабинета министров.\"\n\n\"О, ты принесла его лично... Какая ты прилежная.\"\n\n\"Хост, отчет о приоритетных вопросах.\"\n\n\"Ах, я как раз его ждала. Спасибо.\"\n\nПосле обмена бюрократическими фразами дверь закрылась, и идеальная улыбка на губах Уравы Ханако немного померкла. С тех пор как она была избрана Хост, ее повседневная жизнь крутилась без передышки.\n\nОна была готова до определенной степени, но реальность превзошла все ожидания. Бесконечно накапливающиеся документы на утверждение, протокольные церемонии... Она скучала по тем дням, когда могла сбросить с себя эту униформу и эти удушающие обязанности и свободно бродить ночью, не имея на себе ни нитки.\n\nХанако подперла подбородок и посмотрела в окно. Люди помнят ее только как гения, которого невозможно разгадать, или как чудачку, которая наслаждается непристойными шутками. Но тот внутренний голос, который действительно хочет быть понятым, не находит, куда обратиться."
 TRK_flavor_events.5.a: "Девушка, которую трудно понять"

 # Eventos de noticias (News Events)
 TRK_news_events_title.1: "Урава Ханако избрана Хост Чайной партии"
 TRK_news_events_title.2: "Юридзоно Сейя избрана Хост Чайной партии"
 TRK_news_events_title.3: "Кирифуджи Нагиса избрана Хост Чайной партии"
 TRK_news_events_title.4: "Утадзуми Сакурако избрана Хост Чайной партии"
 TRK_news_events_desc.1: "На первых свободных выборах, проведенных в Тринити, кандидат Урава Ханако от Студенческой коалиции была избрана. Это исторический момент, когда воля народа была отражена в урнах для голосования после поражения Мисоно Мики.\n\nИзбранный президент Урава Ханако пообещала реформировать Тринити. В своей речи она поклялась, что случай, подобный Мисоно Мике, никогда не повторится. Она также выразила стремление построить по-настоящему свободную академию.\n\nОстальные кандидатуры также поздравили победительницу. На всеобщих выборах был получен аналогичный результат, поэтому кажется, что реформы Ханако не потеряют импульс."
 TRK_news_events_desc.2: "На первых свободных выборах, проведенных в Тринити, была избрана кандидат Юридзоно Сейя от фракции Санктус. После поражения Мисоно Мики электорат снова выбрал кандидата из Чайной партии.\n\nЮридзоно Сейя объявила о трансформации Тринити. В своей речи она поделилась своим видением, размышляла о прошлом и продемонстрировала готовность к переменам. Поскольку на всеобщих выборах фракция Санктус получила высокую долю голосов по сравнению с другими фракциями, ожидается, что ее планы будут продвигаться без помех.\n\nОстальные кандидатуры также поздравили избранного президента. Время покажет, придут ли перемены в Тринити как внезапная волна или как постепенный прилив."
 TRK_news_events_desc.3: "На первых свободных выборах, проведенных в Тринити, была избрана кандидат Кирифуджи Нагиса от фракции Филиус. После поражения Мисоно Мики электорат снова выбрал кандидата из Чайной партии.\n\nКирифуджи Нагиса подчеркнула необходимость постепенных изменений в Тринити. Она подтвердила прагматичный подход, соответствующий меняющемуся миру, и в своей речи передала послание о необходимости размышлять о прошлом и двигаться в будущее.\n\nНа всеобщих выборах фракция Филиус также получила высокую долю голосов, превзойдя другие. Остальные кандидатуры также поздравили избранного президента."
 TRK_news_events_desc.4: "На первых свободных выборах, проведенных в Тринити, была избрана кандидат Утадзуми Сакурако от Сестринства. Хотя на ней лежало клеймо сотрудничества с Мисоно Микой, она все же была избрана при поддержке народной воли.\n\nВ своей речи избранный президент Утадзуми Сакурако подчеркнула, что необходимо ценить консервативные принципы. Она также часто ссылалась на тринитарное христианство, что ожидаемо, учитывая изначальную природу Сестринства.\n\nНа всеобщих выборах Сестринство также получило высокую долю голосов, превзойдя другие фракции. Остальные кандидатуры поздравили избранного президента."
 TRK_news_events.1.a: "Вариант А"
 TRK_news_events.1.b: "Вариант B"
 TRK_news_events.1.c: "Вариант C"

