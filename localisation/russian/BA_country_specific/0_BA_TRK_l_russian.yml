 # Enfoques económicos
 TRK_trinity_capital_forced_dissolution: "Принудительный роспуск крупного тринитарного капитала"
 TRK_trinity_capital_forced_dissolution_desc: "Очевидно, что рождение экстремистского режима Тринити поддерживалось обильным лоббированием со стороны крупных капиталистов, связанных с Тринити, и немецких предпринимателей, и что бесчисленные практики хищничества со стороны крупного капитала служили для поддержания хода военной машины Тринити. Чтобы предотвратить возникновение второго экстремистского режима, мы должны демонтировать мегакорпорации, способные самостоятельно осуществлять политическую власть."
 TRK_currency_reform: "Денежная реформа"
 TRK_currency_reform_desc: "Огромное количество валюты, выпущенной Тринити, серьезно подорвало доверие к ней из-за войны и государственных облигаций, выпущенных во время конфликта. Мы должны решительно провести денежную реформу: конфисковать старую валюту и выпустить новую."
 TRK_forced_labor_management_reconciliation: "Принудить к сотрудничеству рабочих и работодателей"
 TRK_forced_labor_management_reconciliation_desc: "Чтобы помешать крупному капиталу в одностороннем порядке навязывать свою волю массам в политике, мы принудим к участию рабочих в управлении предприятиями."
 TRK_strong_small_economy: "Экономика маленьких гигантов"
 TRK_strong_small_economy_desc: "Экономика нового Тринити будет опираться не на огромные конгломераты, а на малые и средние предприятия: маленькие, эффективные и мощные. Ожидается, что сама эта структура будет сдерживать возникновение экстремизма в будущем."
 TRK_reversal_of_brain_drain: "Обратить утечку мозгов"
 TRK_reversal_of_brain_drain_desc: "Мы обратим вспять «утечку мозгов», которая вынудила многочисленные таланты и ученых уехать за границу при экстремистском режиме Тринити, приглашая их вернуться, чтобы вновь стимулировать инновации в Тринити."
 TRK_prohibition_of_the_second_extremism: "Предотвратить второй экстремизм"
 TRK_prohibition_of_the_second_extremism_desc: "Быстрое восстановление жилых районов и дорог, опустошенных после войны, и обеспечение новых кварталов дешевым жильем повысит доверие к нашему правительству и предотвратит прорастание второго экстремизма."
 TRK_eden_academy: "Академия Эдем"
 TRK_eden_academy_desc: "Академия Эдем будет играть роль в возрождении научных инноваций Тринити и, в то же время, выполнять функцию «очищения» для восстановления здоровой гражданской культуры, загрязненной старым экстремистским режимом."
 TRK_restoration_of_collapsed_industry: "Восстановить разрушенную промышленность"
 TRK_restoration_of_collapsed_industry_desc: "Мы возобновим промышленные инвестиции, которые были давно остановлены, пропагандируя, что промышленность немецкой экономики отдаляется от коллапса и восстанавливается, возвращая в русло кривые занятости и роста."
 TRK_social_market_economy: "Социальная рыночная экономика"
 TRK_social_market_economy_desc: "Мы стали свидетелями конца эпохи и должны признать, что абсолютного свободного рынка больше не существует. В рамках «капитализма порядка» государство будет устанавливать правила рынка и очерчивать справедливую стартовую линию, направляя силу рынка на общественное благо."

 # ================================================
 # 3. Espíritus nacionales (National Spirits)
 # ================================================
 TRK_economic_collapse_ns: "Остатки Департамента экономического развития Академии"
 TRK_economic_collapse_ns_desc: "Департамент экономического развития Академии, созданный под руководством Мисоно Мики, полностью разрушил экономику Тринити. После его роспуска предприятия, управляемые непосредственно академией — раздутые до избытка — впали в полный хаос. Некоторые немецкие компании вернули своих прежних владельцев или были выкуплены по бросовым ценам. Однако значительная часть предприятий и заводов все еще требует реструктуризации."
 TRK_gehenna_puppet: "Военная администрация Генны"
 TRK_gehenna_puppet_desc: "Мы потерпели поражение в войне против Генны, и военная администрация остается на территории Тринити. Мы независимы только по названию."
 TRK_gehenna_puppet_next: "Гражданская администрация Генны"
 TRK_gehenna_puppet_next_desc: "Военная администрация Генны, представленная органом управления Эдема, была вынуждена резко изменить форму после объединения Генны, когда исчез один из ее главных политических покровителей. Результатом стало создание официальной гражданской администрации Генны, в рамках которой нам была возвращена значительная автономия."

 TRK_industry_ns: "Новая тринитарная промышленность"
 TRK_industry_ns_desc: "Как обсуждалось при основании старого органа договора, будет проводиться децентрализация, чтобы в экономике Тринити концентрированный крупный капитал снова не мог доминировать в политике в одностороннем порядке. Мы приступили к долгой задаче разрушения или национализации раздутых конгломератов и разделения их на более мелкие экономические единицы."

 TRK_freedom_of_religion_ns: "Свобода вероисповедания"
 TRK_new_trinity_capitalism_ns: "Новый тринитарный капитализм"
 TRK_academy_economic_committee_ns: "Экономическая комиссия академии"
