 TRK_lobbying_corp_ns_desc: "Крупные компании оказывают давление на правительство с целью отмены антимонопольного закона."
 TRK_democratic_government_ns: "Зарождающееся демократическое правительство"
 TRK_weaks_democratic_government_ns: "Слабое демократическое правительство"
