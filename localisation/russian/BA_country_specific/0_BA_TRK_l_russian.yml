 # Decisiones (Decisions) y categorías
 TRK_election_campaign_cat: "Первые выборы в Тринити"
 TRK_election_campaign_cat_desc: "После реформы новой конституции Тринити провел свободные выборы для избрания Хост. Эти выборы имеют большое значение, так как являются первыми свободными выборами после Мисоно Мики. На этих выборах будет восстановлена представительная демократия, разрушенная в Тринити.\n\nВ настоящее время, [TRK_election_potent]  ([?TRK_SU_var|C0], [?TRK_ST_var|O0], [?TRK_FI_var|Y0], [?TRK_SH_var|L0])"
 TRK_eden_collapse_decision_category: "Крах Органа управления Эдема"
 TRK_eden_collapse_decision_category_desc: "Орган управления Эдема был военным правительством Тринити со стороны Генны, но правительство Генны полностью рухнуло до завершения оккупации. Когда стало ясно, что военное правительство больше не может существовать, бюрократы Генны в Органе Эдема обсуждают с нами интеграцию. Поскольку их центральное правительство уже рухнуло, нет никакой возможности, чтобы они могли сопротивляться."
 TRK_eden_collapse_decision: "Передача юрисдикции"
 TRK_eden_collapse_decision_desc: "Мы получаем юрисдикцию над военным правительством. [TRK.GetLeader] подпишет соглашение."

 # Biografía general del líder
 TRK_government_general_leader_desc: "Война Генны и Тринити закончилась поражением Тринити, и территории, которые контролировал Тринити, сейчас находятся под властью Академии Генны. Военное правительство Генны, дислоцированное в Центральном округе, ищет местных коллаборационистов."

 KPD_thalman_joke_leader_desc: "§YРождение:§! §L16 апреля 1886 г., Гамбург, Германская империя§!\n§YБиография:§! §LЕсли перевернуть «Тельман» задом наперед, получится «нналмьлет», а вопрос о том, что это значит, на самом деле является вопросом и не является им одновременно; попытка найти смысл и в то же время жест, мягко отстраняющий саму идею «смысла»… (Сохраняется абсурдный тон; изначально очень длинный текст не был переведен дословно, чтобы избежать нечитаемой стены текста, но если вам нужно 100% дословно, я сделаю это).§!"

