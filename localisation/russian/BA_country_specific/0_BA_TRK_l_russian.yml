 TRK_after_the_dust_settles: "Когда осядет пыль"
 TRK_after_the_dust_settles_desc: "Войны было более чем достаточно, чтобы оставить нас истощенными. Экономические показатели рухнули, а жизнь людей превратилась в катастрофу."
 TRK_new_constitution: "Составить новую конституцию"
 TRK_new_constitution_desc: "Новая конституция, одобренная бывшей Мисоно Микой и фракцией Патер, слишком опасна: ее структура облегчает появление еще одного диктатора, подобного ей. Мы должны аннулировать ее и по-настоящему составить демократическую конституцию."
