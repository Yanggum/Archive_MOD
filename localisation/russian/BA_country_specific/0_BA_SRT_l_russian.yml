l_russian:
  SRT_country_intro_header: "§CКарбаног на грани закрытия§!"
  SRT_country_intro_content: "\nСпециальная академия SRT — это специализированная школа, учрежденная Генеральным студенческим советом, которая готовит специальные подразделения, предназначенные для быстрого разрешения серьезных криминальных ситуаций в каждой академии. В Кивотосе безопасность внутри каждого академического округа обычно является ответственностью самой академии, в то время как за их пределами ее поддерживает Академия полиции Валькирия; однако из соображений автономии Валькирия не могла вмешиваться в дела других академий. Поэтому президент Совета, используя свои полномочия, предоставила иммунитет и создала SRT для подготовки сил, способных силой вмешиваться там, где это необходимо. Создание SRT, однако, игнорировало автономию академий; возникло недовольство, но харизма и престиж президента подавили всякую оппозицию.\n\nПосле Великого Перемещения SRT оказалась изолирована от Совета и в итоге обосновалась в Бретани, Франция. В отличие от Миллениума, где столкновения между студентами и местными жителями переросли в тотальную войну, SRT немедленно подавила беспорядки и стабилизировала ситуацию. Однако без связи с Советом растет неразбериха: некоторые хотят вернуться и выполнить свою первоначальную миссию; другие считают, что SRT должна сама вершить правосудие.\n\nТвой выбор определит курс SRT. Неси правосудие SRT по всему миру!\n\n§YРазработка - Mako§!\n§YВспомогательная разработка - KR_appleman, mintcoon, Lolenheim, Wolha§!"
  SRT_guide: "Цели\n£white_dot. Избежать риска закрытия.\n£white_dot. Восстановить связь с Генеральным студенческим советом или освободиться от его контроля.\n£white_dot. Бороться за признание в качестве официальной академии."
 
