  # Eventos
  SRT_event.1.t: "Оценка ситуации"
  SRT_event.1.d: "Похоже, нас перенесло в другой мир. Связь со Студенческим советом прервана, и мы должны решить, как выжить здесь. Даже рискуя закрытием академии, мы должны выжить."
  SRT_event.1.a: "Понял."

  SRT_event.2.t: "Решение"
  SRT_event.2.d: "Мы обнаружили, что помимо Студенческого совета здесь существует внеправовая организация под названием Федеральный исследовательский клуб Схале. Мы должны решить, склоним ли мы голову перед Схале или откажемся подчиняться."
  SRT_event.2.a: "SRT никогда не склонит голову."
  SRT_event.2.b: "Нет другого выбора..."

