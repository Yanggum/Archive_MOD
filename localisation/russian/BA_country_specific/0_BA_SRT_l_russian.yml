  SRT_sword_of_srt_hero: "Меч Кивотоса"
  SRT_sword_of_srt_hero_desc: "Давным-давно Орден Святой Юстины был мечом Академии Тринити: он разил, подавлял и уничтожал ее врагов. Некоторые студенты считают, что их миссия и миссия SRT похожи; так же, как они были рыцарским орденом Тринити, мы являемся орденом Совета. Мы — меч Кивотоса; мы поднимем пылающий клинок и обнажим его против врагов!"
