  SRT_focus_1: "Оценка ситуации"
  SRT_focus_1_desc: "Проклятье! Что, черт возьми, произошло? Вся связь со Студенческим советом прервана. За пределами академии густой лес, которого раньше не было; дороги исчезли, а запасы скудны. Мы умрем с голоду, прежде чем выберемся отсюда. Полный хаос… Где она? Найдите её немедленно!"
  SRT_focus_1_1: "Решение"
  SRT_focus_1_1_desc: "Юкино Ситидо из взвода FOX созывает экстренное собрание. С каждым днем запасы уменьшаются, и студенты требуют плана. Связь с Советом нестабильна; возможно, мы должны выбрать свой собственный путь. Юкино должна решить."
  SRT_focus_2: "Отказаться от подчинения"
  SRT_focus_2_desc: "Получает поддержку интерпретация, что Совет без президента не может командовать SRT. Некоторые радикалы уже составили манифест, и молчание Юкино раскрывает ее позицию. Осталось только возвести этот манифест в ранг официальной декларации."
  SRT_focus_2_1: "Подчиниться"
  SRT_focus_2_1_desc: "Хотя Совет и является тигром без зубов, согласно уставу он все еще выше нас. Мы не будем пользоваться полной свободой, но безопасность, которую он обеспечивает, с лихвой это компенсирует. Давайте, принесем присягу на верность."
  SRT_focus_b: "Конец Студенческого совета"
