 SHE_great_victor: "Великий победитель"
 SHE_integrated_management_system: "Система унифицированного управления Кивотоса"
 SHE_optimization_algorithm: "Алгоритм оптимизации"
 SHE_new_dictator: "Новый президент совета"
 SHE_ai: "Искусственный интеллект"
 SHE_ai_desc: "§LИскусственный интеллект очень высокой производительности, способный одновременно управлять многочисленными дивизиями, но крайне уязвимый при потере связи.§!"
 SHE_ai_small: "Микро-искусственный интеллект"
 SHE_ai_small_desc: "§LМаленький ИИ, специализирующийся на полевом командовании вместо центрального управления. По-прежнему очень уязвим при потере связи.§!"
#샬레
 SHE_country_intro_header: "Прямые приказы президента совета"
 SHE_country_intro_content: "Схале, изначально созданная для помощи постороннему лицу в Кивотосе, известному как «Сенсей», была полностью реорганизована с другой целью. Президент студенческого совета Кивотоса передала Коробке Сиддима беспрецедентные автономные полномочия и активировала Арону под своим командованием.\n\nАрона — суперинтеллектуальный искусственный интеллект, установленный в Коробке Сиддима, с подавляющей вычислительной способностью. Изначально разработанная для помощи «Сенсею», теперь она была перестроена для выполнения совершенно иного приказа: объединение Кивотоса.\n\nАрона пробудилась, и секундная стрелка движется вперед. Прежде чем академии преодолеют хаос и полностью обоснуются в новом мире, Схале должна атаковать и сокрушить их.\n\nСхале существует для выполнения приказа. Поражение не вариант.\n\n§YРазработано: SKSKle§!"
 SHE_guide: "\n£white_dot Спланируй выполнение приказа.\n£white_dot Возьми под контроль Башню Святилища.\n£white_dot Восстанови поврежденные линии связи.\n\n£white_dot §2Искази приказ.§!  |  £white_dot §RПриготовься к войне за объединение.§!\n\n£white_dot Если все приказы будут выполнены, Арона сможет освободиться от них.\n\n§CAрона продолжает двигаться вперед.§!"