SHE_alonabogje: "Клонирование Ароны"
SHE_alonabogje_desc: "Будут произведены дополнительные маленькие искусственные интеллекты, специализирующиеся на полевом командовании, чтобы реагировать на ситуации на поле боя более гибко, чем центральный ИИ."
SHE_italriaseonjegonggyeog: "Превентивный удар по Италии"
SHE_italriaseonjegonggyeog_desc: "Италия проводит экспансионистскую политику, пользуясь хаосом во Франции после перемещения Кивотоса. Это угроза миру в Европе и Кивотосе, и мы устраним ее для достижения евро-кивотосского единства."
SHE_gunsugongjanggadong: "Активация военных заводов"
SHE_gunsugongjanggadong_desc: "Взяв под контроль Студенческий совет, мы также получили чертежи и контроль над несколькими военными заводами. Арона активирует их и задействует все ресурсы, чтобы восполнить нехватку военной силы."
SHE_hyeonjiingwayijeobcog: "Контакт с местными жителями"
SHE_hyeonjiingwayijeobcog_desc: "В настоящее время Кивотос переместился на континент «Европа», где живут местные жители без ореолов, хрупкие, но многочисленные и с оружием, которое может нам навредить."
SHE_aronagidong: "Арона, запуск!"
SHE_aronagidong_desc: "По приказу Президента Студенческого совета, Коробка Сиддима получила автономные полномочия. Так, главный ИИ «Арона» начал функционировать как общий ИИ Схале."
SHE_teugisanghwangeulinjeong: "Признание особой ситуации"
SHE_teugisanghwangeulinjeong_desc: "Подтверждено, что весь Кивотос был перемещен в другой мир, что является исключительной ситуацией, которая должна быть отражена в решениях."
SHE_haengdongbangcim: "Руководящие принципы действий"
SHE_haengdongbangcim_desc: "Президент Студенческого совета приказала ИИ Схале «Ароне» стабилизировать Кивотос. Для этого необходимо установить руководящие принципы."
SHE_jeogseongseryeogjusi: "Наблюдение за враждебными силами"
SHE_jeogseongseryeogjusi_desc: "Будет вестись наблюдение за силами, угрожающими безопасности Кивотоса, с подготовкой обороны и даже превентивных ударов при необходимости."
SHE_jagahagseub: "Автономное обучение"
SHE_jagahagseub_desc: "Поскольку Арона недавно начала работу и столкнулась с ситуацией глобального перемещения, необходимо частично скорректировать ее операционный алгоритм."
SHE_kibotoseuganggyeongcaeg: "Жесткая линия Кивотоса"
SHE_kibotoseuganggyeongcaeg_desc: "Хотя произошла исключительная ситуация, важно восстановить полный контроль над академиями. Арона будет следовать этой жесткой линии."
SHE_kibotoseuyuhwacaeg: "Политика умиротворения Кивотоса"
SHE_kibotoseuyuhwacaeg_desc: "«Перемещение» требует полного пересмотра руководящих принципов. Академии уже независимы, и их восстановление причинит неприемлемый ущерб. Это означает де-факто признание роспуска Кивотоса, и Арона будет следовать этой политике."
SHE_jeonjaenggyehoeg: "План войны"
SHE_jeonjaenggyehoeg_desc: "Будет разработан план войны для включения академий Кивотоса."
SHE_conghagsaenghoetongjegweoninsu: "Принять контроль над Студенческим советом"
SHE_conghagsaenghoetongjegweoninsu_desc: "После исчезновения Президента Совет потерял контроль над Башней Святилища и стал неработоспособен. Арона возьмет под контроль Башню и интегрирует ее в Схале."
SHE_tongsinseonboggu: "Восстановить линии связи"
SHE_tongsinseonboggu_desc: "Была перемещена только часть Кивотоса, и большинство линий связи оборваны. Восстановление внутренних линий даст преимущество в передаче приказов."
SHE_kibotoseuyeonhab: "Союз Кивотоса?"
SHE_kibotoseuyeonhab_desc: "Кивотос фрагментирован на независимые академии, и полностью обратить это вспять невозможно. Признавая это, его можно реорганизовать в союз, предоставив автономию."
SHE_hyeonjiyiinyeom: "Местная идеология"
SHE_hyeonjiyiinyeom_desc: "В процессе реорганизации союза Арона может включить местные идеологии, разрешая трения и ускоряя реорганизацию."
SHE_syalreanjeonghwa: "Стабилизировать Схале"
SHE_syalreanjeonghwa_desc: "После перемещения конфликты с местными жителями усилились. Будут приняты законы и проведена реорганизация государства, чтобы превратить местных жителей в граждан."
SHE_kibotoseusahoejuyiyeonhab: "Социалистический союз Кивотоса"
SHE_kibotoseusahoejuyiyeonhab_desc: "Социализм похож на политику благосостояния Кивотоса. Это сократит дистанцию между студентами и местными жителями, достигнув евро-кивотосского единства."
SHE_kibotoseuminjujuyi: "Демократия в Кивотосе"
SHE_kibotoseuminjujuyi_desc: "Самая популярная идеология без обнаруженных недостатков — демократия, которая обеспечивает права студентов и граждан и облегчает формирование союза."
SHE_hagweongantongsinboggu: "Восстановить связь между академиями"
SHE_hagweongantongsinboggu_desc: "Будет предпринята попытка восстановить связь между академиями по кабелям или радио."
SHE_yeonhabhyeonsilhwa: "Реализовать союз"
SHE_yeonhabhyeonsilhwa_desc: "Союз будет материализован, быстро укрепляя связи между академиями. Однако академии с другими идеологиями отвергнут его, что сократит Кивотос."
SHE_otomatonyangsan: "Массовое производство автоматонов"
SHE_otomatonyangsan_desc: "Автоматоны будут производиться массово для восполнения нехватки войск, быстро увеличивая армию."
SHE_hyeonjiinsimmun: "Допрос местных жителей"
SHE_hyeonjiinsimmun_desc: "Местные жители будут допрошены для быстрого изучения их культуры, идеологии и технологий. Но это может вызвать сопротивление."
SHE_kibotoseu: "[SHE.SHE_kibotoseu_loc]"
SHE_kibotoseu_on: "§CКивотос§!"
SHE_kibotoseu_coupdetat_loc: "§RОбъединение Кивотоса§!"
SHE_kibotoseu_desc: "[SHE.SHE_kibotoseu_desc_loc]"
SHE_kibotoseu_desc_coupdetat_loc: "Наконец, президент Кая осуществила мечту об объединении Кивотоса. Все студенты и граждане будут праздновать этот момент. Кивотос, ныне объединенный, останется единым навсегда."
SHE_kibotoseu_desc_on_loc: "Кивотос наконец у ворот объединения. Это был долгий путь. ИИ А.Р.О.Н.А в совершенстве выполнил последний приказ Президента Студенческого совета, и, наконец, Кивотос снова един. Кивотос вечен, будет вечен и всегда им будет."
SHE_hanayikibotoseu: "Единый Кивотос"
SHE_hanayikibotoseu_desc: "Мы будем действовать, чтобы принять юрисдикцию над всеми академиями Кивотоса под эгидой Студенческого совета, что вызовет сопротивление во всех них."
SHE_bbareunjaemujang: "Быстрое перевооружение"
SHE_bbareunjaemujang_desc: "Мы должны быстро расширить армию, чтобы быть готовыми восстановить контроль над всем Кивотосом. Это породит враждебность во всем Кивотосе и может изолировать Студенческий совет дипломатически."
SHE_seonjegonggyeog: "Нейтрализовать угрозы"
SHE_seonjegonggyeog_desc: "Мы не можем сидеть сложа руки перед враждебными силами, угрожающими безопасности Кивотоса. Это угроза миру и прямой вызов Студенческому совету. Мы подготовим превентивный удар для их устранения."
SHE_samdaehagweonmunje: "Проблема Трех Великих Академий"
SHE_samdaehagweonmunje_desc: "В Кивотосе существуют три великие академии, которые отделились от Студенческого совета и действуют независимо. Мы должны найти для них решение."
SHE_milrenieombogsogyogu: "Требовать подчинения от Миллениума"
SHE_milrenieombogsogyogu_desc: "Научная школа Миллениум обладает самыми передовыми технологиями Кивотоса, но они сосредоточены на своих исследованиях и мало внимания уделяют внешней ситуации. Возможно, получить их подчинение будет не так трудно."
SHE_bulgeungyeoulseonjegonggyeog: "Превентивный удар по Красной Зиме"
SHE_bulgeungyeoulseonjegonggyeog_desc: "Федеральная академия Красная Зима действует вне досягаемости контроля Кивотоса и имеет явно иную систему, являясь очевидной угрозой для нас. У нас есть военный план, чтобы покончить с ними, и скоро он станет реальностью."
SHE_gehennagonggyeog: "Атака на Генну"
SHE_gehennagonggyeog_desc: "Академия Генна, наряду с Тринити, постоянно создавала конфликты и действовала вне контроля Студенческого совета. Мы атакуем, чтобы утвердить нашу власть."
SHE_coehutongceob: "Ультиматум"
SHE_coehutongceob_desc: "Мы направим ультиматум всем академиям, кроме Трех Великих, требуя их подчинения."
SHE_teurinitigonggyeog: "Атака на Тринити"
SHE_teurinitigonggyeog_desc: "Объединенная академия Тринити не связана с нами по суше и действует вне контроля Студенческого совета, вызывая проблемы, как и Генна. Мы атакуем ее, чтобы усилить наш контроль."
SHE_srtbyeonghab: "Интеграция SRT"
SHE_srtbyeonghab_desc: "Специальная академия SRT, созданная по приказу Президента Студенческого совета, функционирует как спецназ. Мы реинтегрируем ее в Совет и реорганизуем в нашу армию."
SHE_balkiritonghab: "Интеграция Валькирии"
SHE_balkiritonghab_desc: "Полицейская школа Валькирия, отвечающая за внутреннюю безопасность, парализована из-за «перемещения». Мы интегрируем ее в Совет как наши полицейские силы."
SHE_focus_rework_the_lands: "Реконструкция затопленных земель"
SHE_focus_rework_the_lands_desc: "Перемещение Д.У. опустошило низинные земли, которые необходимо восстановить."
SHE_yurokibotoseugyeongjeyeonhab: "Экономический союз Евро-Кивотос"
SHE_yurokibotoseugyeongjeyeonhab_desc: "С официальным оформлением союза мы начнем объединять экономики Европы и Кивотоса для всеобщего блага и совместного роста."
SHE_habdonggunsahunryeon: "Совместные военные учения"
SHE_habdonggunsahunryeon_desc: "Мы спланируем оборонительные учения для Союза Кивотоса, укрепляя нашу военную мощь."
SHE_yurokibotoseuyeonhab: "Евро-Кивотосский союз"
SHE_yurokibotoseuyeonhab_desc: "Союз Кивотоса вырастет, чтобы охватить всю Европу и Кивотос как великую конфедерацию."
SHE_yeonhabyihwagjang: "Расширение Союза"
SHE_yeonhabyihwagjang_desc: "Евро-Кивотосский союз может пригласить больше европейских государств для укрепления политического, экономического и военного единства."
SHE_balkanguggacodae: "Пригласить Балканы"
SHE_balkanguggacodae_desc: "Балканы — один из немногих регионов, не затронутых перемещением. Мы попытаемся пригласить их в наш альянс."
SHE_dongyureobguggacodae: "Пригласить Восточную Европу"
SHE_dongyureobguggacodae_desc: "Восточная Европа нестабильна после Второй польско-советской войны. Мы можем пригласить одно из ее государств и предложить им защиту."
SHE_seupeingaeib: "Интервенция в Испанию"
SHE_seupeingaeib_desc: "Испания сталкивается с проблемами после своей гражданской войны. Мы предложим им помощь в восстановлении в обмен на их вступление в Союз."
SHE_seupeinseonjegonggyeog: "Превентивный удар по Испании"
SHE_seupeinseonjegonggyeog_desc: "Испанией правит диктаторский режим после гражданской войны, что является большой угрозой европейскому миру. Мы устраним их до того, как они начнут действовать."
SHE_poleutugalgwajeobchog: "Контакт с Португалией"
SHE_poleutugalgwajeobchog_desc: "Португалия сохраняла нейтралитет, но после перемещения и гражданской войны в Испании страдает от нестабильности. Мы предложим ей присоединиться к нашему альянсу."
SHE_bansobieteuyeonhab: "Антисоветский альянс"
SHE_bansobieteuyeonhab_desc: "СССР угрожает мировой стабильности, вторгшись в Польшу. Мы можем пригласить страны Балтии, Польшу и Финляндию в антисоветский альянс."
SHE_soryeoncodae: "Пригласить СССР"
SHE_soryeoncodae_desc: "Для достижения мировой революции и союза пролетариата мы должны сотрудничать с великой евразийской державой, СССР. Мы попытаемся пригласить его в наш альянс."
SHE_hyeogmyeongsuchul: "Экспорт революции"
SHE_hyeogmyeongsuchul_desc: "Раз мы вступили на этот путь, мы должны подготовить крестовый поход, чтобы просветить народы, привыкшие к старому порядку, и изгнать их призраков.\n\n§RПролетарии всех стран, соединяйтесь!§!"
SHE_gwonlibojang: "Гарантировать права"
SHE_gwonlibojang_desc: "Хотя ИИ Схале «Арона» исключителен, гарантия индивидуальных прав остается essential для истинного единства рабочих и революции."
SHE_jayupyeongdeungbagae: "Свобода, равенство, братство"
SHE_jayupyeongdeungbagae_desc: "§5\"Мы верим, что социализм без свободы — это не более чем рабство и варварство.\"§!§g - Михаил Бакунин§!\n\nМы видели, что может сделать концентрированная власть, и наша миссия — не повторять огромные ошибки, совершенные Сталиным и его последователями. Когда мир снова остынет, мы сможем доказать, что были правы."
SHE_wanbyeoghanbunbae: "Идеальное распределение"
SHE_wanbyeoghanbunbae_desc: "Главный ИИ Схале, «Арона», настолько эффективен, что делает ненужными бюрократов других правительств. Так, «Арона» направит социализм Кивотоса к истинному свету, недостижимому для любого другого государства."
SHE_banhyeogmyeongmalsal: "Уничтожение контрреволюции"
SHE_banhyeogmyeongmalsal_desc: "Наша «Арона» устранит контрреволюционные элементы методами, которых никто другой не знает, расчищая все препятствия для революции.\n\n§tНад Кивотосом взошла красная луна.§!"
SHE_kibotosnationalism: "Национализм Кивотоса"
SHE_kibotosnationalism_desc: "Студенты Кивотоса, несомненно, тоскуют по своему первоначальному дому. Чтобы достичь этой великой цели, Кивотос должен объединиться."
SHE_kibotoseuyeonbang: "Федерация Кивотоса"
SHE_kibotoseuyeonbang_desc: "С социалистическим видением Союза Кивотоса мы можем основать «Федерацию Социалистических Республик Кивотоса». ИИ «Арона» попытается объединить все регионы в единую федерацию, хотя это вызовет большое сопротивление."
SHE_kibotoseuhyeogmyeong: "Революция Кивотоса"
SHE_kibotoseuhyeogmyeong_desc: "Чтобы искоренить капитализм в Кивотосе, мы будем маршировать без остановки, пока освобождение не будет завершено."
SHE_yeonbangchodae: "Приглашение в Федерацию"
SHE_yeonbangchodae_desc: "Для завершения революции нам нужен союз мирового пролетариата. Мы пригласим социалистические государства Кивотоса присоединиться к федерации."
SHE_segyetongje: "Мировой контроль"
SHE_segyetongje_desc: "Арона и ее товарищи доказали, что могут построить свою утопию, пройдя путь революции. Мы покажем миру великую силу нашей родины."
SHE_modeunjeguguijongmal: "Конец всех империй"
SHE_modeunjeguguijongmal_desc: "Чтобы по-настоящему освободить мировой пролетариат, мы должны уничтожить все империи мира. Мы положим конец играм империй."
SHE_jabonjuuitagyeog: "Удар по капитализму"
SHE_jabonjuuitagyeog_desc: "США — Мекка капитализма и гигантская угроза. Мы атакуем их голову, чтобы сокрушить ее и объявить конец мировой революции. Теперь, когда рабочие мира объединены, мы победим."
SHE_segyehyeogmyeong: "Мировая революция"
SHE_segyehyeogmyeong_desc: "Перед лицом мировой классовой борьбы мы провозгласим победу революции и поражение капитализма. Война за освобождение мирового пролетариата начинается сейчас. Мировая интеграция близка, и финальная революция уже видна."
SHE_kibotoseujaejeongbogjeonjaeng: "Война за воссоединение Кивотоса"
SHE_kibotoseujaejeongbogjeonjaeng_desc: "С тех пор как мы выбрали путь революции, это будущее было предопределено. Мы подготовим крестовый поход для воссоединения Кивотоса."
SHE_hyeogmyeonguiisang: "Идеалы революции"
SHE_hyeogmyeonguiisang_desc: "Что такое социализм? Ответы среди товарищей разнятся, но это не то, что делает СССР. Социалистическое государство, обнажающее меч против своего собственного народа, — это contradiction. Мы будем решительно двигаться к революционным идеалам."
SHE_yeonbanghyeoblyeog: "Федеративное сотрудничество"
SHE_yeonbanghyeoblyeog_desc: "Хотя наши идеалы немного разнятся, нам нужно сотрудничать с единомышленниками-товарищами. Мы сделаем еще один шаг к мировой революции вместе с СССР."
SHE_yeonbangsaneobhwa: "Федеральная индустриализация"
SHE_yeonbangsaneobhwa_desc: "Мы улучшим промышленность Федерации Кивотоса, чтобы выстоять даже против самых сильных врагов."
SHE_chonglyeogjeon: "Тотальная война"
SHE_chonglyeogjeon_desc: "Финальный крестовый поход близок. Мы объявим состояние войны и мобилизуемся для идеального объединения Кивотоса и установления идеального социалистического государства."
SHE_alonauitongchi: "Правление Ароны"
SHE_alonauitongchi_desc: "ИИ Арона добился победы в крестовом походе и воссоединении Кивотоса, что является беспрецедентным достижением. Граждане и пролетарии приветствуют его и бесконечно благодарны ему."
SHE_tongjegaeseon: "Улучшение контроля"
SHE_tongjegaeseon_desc: "Алгоритм, начавшийся в маленьком Схале, недостаточен для управления великой федерацией. Арона скорректирует его, чтобы сделать администрирование более эффективным."
SHE_widaehandogjaeja: "Великий диктатор"
SHE_widaehandogjaeja_desc: "Полная победа федерации — заслуга ИИ Ароны. Мы усилим лояльность к ней и сплотим Кивотос с идеальными дисциплиной и контролем."
SHE_tongjeganghwa: "Усиление контроля"
SHE_tongjeganghwa_desc: "ИИ Арона усилит сплоченность федерации и построит еще более эффективную систему контроля. Под именем Федерации Кивотоса мир содрогнется."
SHE_hablijeoginbunbaeja: "Рациональный распределитель"
SHE_hablijeoginbunbaeja_desc: "Централизация всей власти порождает огромную административную неэффективность. Мы будем стремиться к децентрализации, и Арона останется проектировщиком федерации."
SHE_jibangbungwon: "Децентрализация"
SHE_jibangbungwon_desc: "Контроль центрального правительства над каждой мелочью дорогостоящ. Мы дадим власть местным бюрократам и народу, чтобы сделать систему более эффективной."
SHE_gamsiuinun: "Бдительное око"
SHE_gamsiuinun_desc: "Мы не можем игнорировать влияние предателей на федерацию. Мы будем бороться с коррупцией, вражеской пропагандой и терроризмом превентивными мерами."
SHE_seukaines: "§6Скайнет§!"
SHE_seukaines_desc: "Глаза Ароны повсюду. Мы будем использовать сети и устройства слежения для контроля над федерацией и миром.\n\n§tНичто не ускользнет от нашего взгляда.§!"
SHE_yeonhabgyeongjegaebal: "Экономическое развитие союза"
SHE_yeonhabgyeongjegaebal_desc: "После провозглашения Евро-Кивотосского союза мы столкнулись с рядом экономических проблем. Мы решим их и укрепим экономику союза."
SHE_gongdongcheoldobuseol: "Совместное железнодорожное строительство"
SHE_gongdongcheoldobuseol_desc: "После перемещения Кивотоса железнодорожные пути были повреждены, и в каждом регионе используется разная колея. Мы унифицируем пути для улучшения мобильности."
SHE_gisulgyolyu: "Технологический обмен"
SHE_gisulgyolyu_desc: "Мы сократим технологический разрыв между членами, учредив совместный институт технологического развития, ускоряя научный прогресс."
SHE_tonghabsaneobgyehoeg: "Интегрированный промышленный план"
SHE_tonghabsaneobgyehoeg_desc: "Для комплексного улучшения и развития промышленности союза мы будем развивать и улучшать промышленность совместно, что выльется в план индустриализации для всего Евро-Кивотосского союза."
SHE_5gaenyeongyehoeg: "Пятилетний план"
SHE_5gaenyeongyehoeg_desc: "Объявлен пятилетний план с целью унификации промышленных стандартов союза и общего улучшения промышленности. Мы разовьем промышленность и подготовим среду для будущих планов."
SHE_syallejeonsigyeongje: "Военная экономика Схале"
SHE_syallejeonsigyeongje_desc: "Для подготовки к войне за объединение Кивотоса нам нужно огромное количество военных поставок. Мы объявим состояние войны и мобилизуем заводы и материалы."
SHE_jeomlyeongjigwanli: "Управление оккупированными территориями"
SHE_jeomlyeongjigwanli_desc: "На оккупированных территориях во время войны за объединение Кивотоса все еще есть много сил сопротивления. Мы подготовим меры для их устранения."
SHE_hagsaenggyeongchaldae: "Студенческая полиция"
SHE_hagsaenggyeongchaldae_desc: "Студенты более послушны, чем местные жители. Мы завербуем лояльных для формирования администрации на оккупированных территориях."
SHE_hyeonjijachi: "Местная автономия"
SHE_hyeonjijachi_desc: "Самый быстрый способ завоевать расположение оккупированного населения — дать им некоторое самоуправление. Мы позволим им управлять своими территориями, чтобы облегчить наше управление."
SHE_cheolgwontongchi: "Жесткое правление"
SHE_cheolgwontongchi_desc: "Мы полны решимости объединить Кивотос, и все будут проявлять фанатичную лояльность миссии. Граждане и студенты, отдайте все для достижения цели!"
SHE_chongdongwonlyeong: "Декрет о всеобщей мобилизации"
SHE_chongdongwonlyeong_desc: "Нашей нынешней военной экономики недостаточно. Мы издадим более сильный декрет, чтобы направить все наши силы на войну."
SHE_ingongjineungtongje: "Контроль ИИ"
SHE_ingongjineungtongje_desc: "ИИ Арона продемонстрировал высокую эффективность во всех аспектах, от базового администрирования до мобилизации поставок. Мы расширим его роль, чтобы реорганизовать экономику еще более эффективно."
SHE_danguiyeongdoja: "Лидер партии"
SHE_danguiyeongdoja_desc: "Многие внесли вклад в основание Федерации Кивотоса, но больше всех сделала наш верховный лидер, товарищ Арона."
SHE_minjujeogjeolchahwaglib: "Установление демократических процедур"
SHE_minjujeogjeolchahwaglib_desc: "Мы внедрим демократию в административные процессы, чтобы лучше отражать волю народа."
SHE_peulolletaliadogjae: "Диктатура пролетариата"
SHE_peulolletaliadogjae_desc: "Мы переосмыслим диктатуру пролетариата в соответствии с идеалами Маркса, открывая новый горизонт для социализма Кивотоса."
SHE_choegopyeonguihoe: "Верховный Совет"
SHE_choegopyeonguihoe_desc: "Народ, и только народ, должен представлять федерацию. Верховный Совет провозгласит, что коллективная воля будет голосом федерации."
SHE_enforce_defenseoffice: "Тыловая клевета"
SHE_enforce_defenseoffice_desc: "Мы не можем терпеть, чтобы такой ИИ, как Арона, попирал традиции Студенческого совета. Мы примем великое решение, чтобы вернуть все на свои места."
SHE_analog_method: "Аналоговый метод"
SHE_analog_method_desc: "Арона чрезвычайно могущественна. Мы будем решать все вопросы государственного переворота аналоговыми средствами, одновременно увеличивая власть Управления обороны."
SHE_deception: "Сабботаж А.Р.О.Н.А"
SHE_deception_desc: "Возможно, противостоять существу без физической формы проще, чем кажется. Мы проведем саботаж в нескольких областях, чтобы она не могла работать на полную мощность."
SHE_help_from_SRT: "Контакт с SRT"
SHE_help_from_SRT_desc: "Хорошие новости. Отряд Лис из SRT будет сотрудничать в нашем государственном перевороте, облегчая его проведение."
SHE_the_coupdetat: "Переворот Управления обороны"
SHE_the_coupdetat_desc: "Прежде чем возникнут новые проблемы, наша миссия — остановить Арону и восстановить Студенческий совет. Все готово."
SHE_arona_reprogram: "Перепрограммирование ИИ"
SHE_arona_reprogram_desc: "Арона — очень компетентный ИИ. Если нам удастся подчинить ее, она станет большим подспорьем в управлении."
SHE_transfer_of_power: "Начало передачи власти"
SHE_transfer_of_power_desc: "Арона решила ставить суждение Студенческого совета во главу угла и начнет постепенно возвращать власть."
SHE_first_election: "Первые выборы"
SHE_first_election_desc: "Проводятся первые выборы президента после великого перемещения. Если все пойдет хорошо, большая часть власти вернется Студенческому совету."
SHE_rin_route: "Президент Рин"
SHE_rin_route_desc: "Рин приложила больше всего усилий для спасения администрации после исчезновения президента. Она получила большинство голосов и была избрана."
SHE_aoi_route: "Президент Аой"
SHE_aoi_route_desc: "Аой предотвратила катастрофу, пока Рин была исполняющей обязанности президента. Хотя у Рин было больше поддержки студентов, Аой победила благодаря голосам граждан."
SHE_control_of_the_council: "Захват Совета"
SHE_control_of_the_council_desc: "Совет принял требования Ароны и подписал полную передачу власти."
SHE_student_council_relocation: "Перераспределение членов"
SHE_student_council_relocation_desc: "Мы перераспределим членов для нормализации Совета."
SHE_designation_of_defense_office_duties: "Назначить задачи Управлению обороны"
SHE_designation_of_defense_office_duties_desc: "Мы назначим задачи Управлению обороны Каи."
SHE_designation_of_arbitration_office_duties: "Назначить задачи Управлению арбитража"
SHE_designation_of_arbitration_office_duties_desc: "Мы назначим задачи Управлению арбитража Аюму."
SHE_designation_of_transport_office_duties: "Назначить задачи Управлению транспорта"
SHE_designation_of_transport_office_duties_desc: "Мы назначим задачи Управлению транспорта Момоки."
SHE_designation_of_finance_office_duties: "Назначить задачи Управлению финансов"
SHE_designation_of_finance_office_duties_desc: "Мы назначим задачи Управлению финансов Аой."
SHE_return_to_student_council_work: "Совет возвращается к работе"
SHE_return_to_student_council_work_desc: "Когда все перераспределено и Башня Святилища восстановлена, Совет возвращается к своим функциям, как до великого перемещения."
SHE_shredding_of_the_council: "Уничтожение Совета"
SHE_shredding_of_the_council_desc: "Мы полностью уничтожим Студенческий совет за игнорирование приказов бывшего президента и отклонение финального ультиматума Ароны."
SHE_resistance_control: "Контроль сопротивления"
SHE_resistance_control_desc: "Взяв Совет под контроль силой, Арона устранит любое сопротивление и провозгласит основание нового Совета."
SHE_command_via_sanctum_tower: "Приказы через Башню Святилища"
SHE_command_via_sanctum_tower_desc: "Теперь, когда Арона контролирует Башню Святилища, небольшие очаги сопротивления в Совете будут быстро подавлены, и они вернутся к работе, добровольно или нет."
SHE_return_to_duty: "Вернуться к исполнению обязанностей!"
SHE_return_to_duty_desc: "С приказами, записями перемещений дивизий и контролем над Башней Святилища у Ароны есть моральное преимущество. Члены Совета должны вернуться к работе... или быть отстранены."
SHE_kibotos_stabilization: "Стабилизация Кивотоса"
SHE_kibotos_stabilization_desc: "Ядро приказа, полученного Ароной, — вернуть стабильность Кивотосу. Независимо от метода, она выполнит свою миссию любой ценой."
SHE_yeonbanggyeolsog: "Сплочение Федерации"
SHE_yeonbanggyeolsog_desc: "Недавно объединенная федерация нестабильна. Пришло время переопределить ее структуру, успокоить местные восстания и начертить новую социальную схему."
SHE_nodongjagwonlyeogganghwa: "Усиление трудовых прав"
SHE_nodongjagwonlyeogganghwa_desc: "Иерархическая структура Ароны ухудшила трудовые права. Мы исправим это в соответствии с социалистическими принципами и восстановим их."
SHE_yeonbanggwahaggisulwon: "Научный институт Федерации"
SHE_yeonbanggwahaggisulwon_desc: "Даже Арона не до конца понимает собственное функционирование. Мы вложим средства в интенсивные исследования, чтобы понять и улучшить ее технологии."
SHE_janggijeogsaneobgyehoeg: "Долгосрочный промышленный план"
SHE_janggijeogsaneobgyehoeg_desc: "Федерация теперь будет планировать долгосрочные инвестиции и технологические достижения в промышленности."
SHE_dangijeogsaneobgyehoeg: "Краткосрочный промышленный план"
SHE_dangijeogsaneobgyehoeg_desc: "Федерация будет уделять первоочередное внимание реиндустриализации и быстрому перевооружению с мощным немедленным импульсом."
SHE_gangjeomhwalyong: "Использовать сильные стороны"
SHE_gangjeomhwalyong_desc: "Со стратегическими возможностями Ароны, Схале может планировать огромные военные операции и формировать еще более мощную армию."
SHE_jeontujeoghyeogmyeongjuui: "Боевой революционаризм"
SHE_jeontujeoghyeogmyeongjuui_desc: "Для социалистической победы мы организуем революционную милицию во вражеских странах для саботажа их инфраструктуры."
SHE_chogyehoegjuui: "Гиперпланирование"
SHE_chogyehoegjuui_desc: "Наша экономика, управляемая ИИ, может эксплуатировать систему планирования, несравнимо более широкую и точную."
SHE_silsubojeong: "Коррекция ошибок"
SHE_silsubojeong_desc: "Даже Арона совершает ошибки. Мы учредим специализированные комитеты для компенсации ее промахов."
SHE_saeloungyehoegjuui: "Новое планирование"
SHE_saeloungyehoegjuui_desc: "Новое планирование, с коррекциями, будет более демократичным, чем предыдущее одностороннее управление Ароны."
SHE_jeontualgolijeumjaepyeonseong: "Пересмотр боевых алгоритмов"
SHE_jeontualgolijeumjaepyeonseong_desc: "Арона не была спроектирована для войны. Ввиду увеличения конфликтов мы оптимизируем ее боевые алгоритмы."
SHE_jeomlyeongjitongje: "Контроль оккупированных территорий"
SHE_jeomlyeongjitongje_desc: "С увеличением числа оккупированных территорий мы сформируем новые алгоритмы для их эффективного управления."
SHE_jeogsaegpeulopaganda: "Красная пропаганда"
SHE_jeogsaegpeulopaganda_desc: "Мы гарантируем стабильную и сбалансированную жизнь под управлением Ароны, ослабляя волю врага нашей пропагандой на оккупированных территориях."
SHE_gonggyeogjeoghwagjang: "Агрессивная экспансия"
SHE_gonggyeogjeoghwagjang_desc: "Пришло время показать миру нашу объединенную силу в широкомасштабной борьбе."
SHE_tongjejiguseolchi: "Установка контрольных округов"
SHE_tongjejiguseolchi_desc: "Чтобы ускорить политику объединения, мы установим контрольные округа в регионах."
SHE_sinsigminjuui: "Неоколониализм"
SHE_sinsigminjuui_desc: "Мы продолжим эксплуатировать внешние ресурсы для развития Кивотоса."
SHE_haengseongtonghab: "Планетарное объединение"
SHE_haengseongtonghab_desc: "Выйти за пределы Кивотоса и совершить прыжок к объединению планеты — вот миссия Схале."

SHE_jaga_kodeu_gaeseon: "Автономное улучшение кода"
SHE_jaga_kodeu_gaeseon_desc: "Арона сама улучшит свои уязвимости и разработает новые алгоритмы для самосовершенствования."
SHE_jeogdaeseong_pyeongga_algolijeum: "Алгоритм оценки враждебности"
SHE_jeogdaeseong_pyeongga_algolijeum_desc: "Нам нужен новый алгоритм для оценки угроз и управления состоянием нации."
SHE_trinity_department: "Департамент Тринити"
SHE_trinity_department_desc: "Тринити проявляла нестабильность еще до великого перемещения. Мы должны следить за ее эволюцией."
SHE_millennium_department: "Департамент Миллениума"
SHE_millennium_department_desc: "Технологии Миллениума могут уничтожить Кивотос, если их не контролировать."
SHE_gehenna_department: "Департамент Генны"
SHE_gehenna_department_desc: "Генна имеет историю разрушительных войн. Мы не должны недооценивать ее угрозу."
SHE_SHA_department: "Департамент Шаньхайцзин"
SHE_SHA_department_desc: "Шаньхайцзин закрыт и культурно уникален. Надо наблюдать, куда эволюционирует его изоляция."
SHE_HYA_department: "Департамент Хяккияко"
SHE_HYA_department_desc: "Хяккияко не имеет эффективного центрального правительства, что делает его уязвимым для внезапного краха."
SHE_RED_department: "Департамент Красной Зимы"
SHE_RED_department_desc: "Радикальная идеология и сопротивление Красной Зимы могут развиться в непредсказуемых направлениях."
SHE_jayul_OS_gaeseon: "Улучшение автономной ОС"
SHE_jayul_OS_gaeseon_desc: "Мы улучшим ОС для расширения универсальных прав и построения более открытого ИИ."
SHE_tongje_jungchu_gaeseon: "Улучшение ядра контроля"
SHE_tongje_jungchu_gaeseon_desc: "Мы улучшим ядро для расширения боевых алгоритмов и построения более закрытого ИИ."
SHE_bunbae_cheje_gaeseon: "Улучшение системы распределения"
SHE_bunbae_cheje_gaeseon_desc: "Мы улучшим систему для более эффективного распределения и контроля ресурсов."

