l_russian:
 #샬레 이벤트#
 SHE_yeonhabhyeonsilhwa_tt: "Разблокирует §Yрешение£decision_icon_small§! для приглашения наций, аффилированных с §YKivotos§!, в нашу §Yсферу влияния§!."
 SHE_puppet_flag: "§RЗона под контролем§!"
 kivotos_hardline_tt: "§YМы§! выберем §Rжесткую линию§!."
 kivotos_appeasement_tt: "§YМы§! выберем §Gполитику умиротворения§!."
 kivotos_hardline: "§CArona§! выбрала §Rжесткую линию§!."
 kivotos_appeasement: "§CArona§! выбрала §Gполитику умиротворения§!."
 SHE_event.1.t: "Решение"
 SHE_event.1.desc: "Из-за аномалии в Кивотосе вся связь прервана, и академии создали свои собственные независимые фракции. Другими словами, Кивотос раскололся. `Arona`, ИИ Схалe, активированный по приказу президента студенческого совета, оценивает варианты выполнения её последней директивы: стабилизировать Кивотос."
 SHE_event.1.a: "То, что произошло, не отменить."
 SHE_event.1.b: "Мы не хотим расколотый Кивотос."
 SHE_event.2.t: "7-е заседание Исполнительного комитета - Срочный вопрос"
 SHE_event.2.desc: "\"... Это правда, секретарь?\" Нанагами Рин просматривала отчет с видимым замешательством. Суть была ясна: 'Арона', главный ИИ Схалe, утверждала, что действует по приказу исчезнувшего президента, и требовала одностороннего слияния Схалe со студенческим советом, провозглашая себя его законной преемницей. Рин знала о секретном существовании Схалe, но ИИ, требующий контроля? Хотя ИИ Кивотоса продвинуты, Арона особо не выделялась.\n\nСледуя протоколу, Рин созвала экстренное собрание. Готовясь, она провела расследование и обнаружила, что Арона получала энергию нерегулярно, что могло вызвать сбои. Однако президент игнорировала эти отчеты. Была ли это действительно ее воля? Рин почувствовала комок в горле. Когда ее позвали, она направилась в зал заседаний.\n\nПоднявшись на трибуну, Рин глубоко вздохнула. Она знала, что не была 'сверхчеловеком' и должна была говорить осторожно. 'Извините за срочность, но причина этого собрания в том, что...'"
 SHE_event.2.a: "\"... Это воля президента.\""
 SHE_event.2.b: "\"... Это сбой ИИ.\""
 has_trait_COU_power_struggle: "§RЕсли мы не завершим фокус нормализации администрации вовремя, мы столкнемся с серьезными ограничениями в противодействии Схале!§!"
 SHE_event_2_c_tt: "§RЕсли не завершить фокус вовремя, слияние станет неизбежным!§!"
 SHE_event.3.t: "Принятие студенческим советом"
 SHE_event.3.desc: "Студенческий совет признал свой хаос и согласился на слияние со Схале."
 SHE_event.3.a: "Хорошо."
 SHE_event.4.t: "Отказ студенческого совета"
 SHE_event.4.desc: "Студенческий совет отклонил слияние, подтвердив свой суверенитет. Это помешает планам Схале."
 SHE_event.4.a: "Тогда будет война."
 SHE_event.5.t: "Предложение о присоединении к Федерации"
 SHE_event.5.desc: "Сегодня утром Схале предложила нам присоединиться к Федерации Кивотоса. Они утверждают, что для завершения пролетарской революции социалистические академии должны объединиться."
 SHE_event.5.a: "Хорошая идея."
 SHE_event.5.b: "Отклонить."
 SHE_event.6.t: "[FROM.GetName] принимает"
 SHE_event.6.desc: "[FROM.GetName] принял предложение присоединиться к Федерации, поддерживая наше дело."
 SHE_event.6.a: "Добро пожаловать, товарищ."
 SHE_event.7.t: "[FROM.GetName] отклоняет"
 SHE_event.7.desc: "[FROM.GetName] отклонил предложение о Федерации. Они пойдут своим путем."
 SHE_event.7.a: "Я так и знал, реакционеры."
 SHE_event.8.t: "[SHE.GetName] пытается нас аннексировать"
 SHE_event.8.desc: "Мы обнаружили, что [SHE.GetName] планирует реинтегрировать нашу академию под свой контроль. Мы должны решить, сопротивляться или подчиниться."
 SHE_event.8.a: "Мы не сдадимся легко."
 SHE_event.8.b: "Это будет воля президента."
 SHE_event.9.t: "[KSP.GetName] сопротивляется"
 SHE_event.9.desc: "[KSP.GetName] прервал связь и объявил враждебность. Война неизбежна."
 SHE_event.9.a: "Все усложняется."
 SHE_event.10.t: "Ультиматум от [SHE.GetName]"
 SHE_event.10.desc: "[SHE.GetName] требует нашего подчинения. Готовимся к войне или принимаем?"
 SHE_event.10.a: "Готовиться к войне."
 SHE_event.10.b: "За единый Кивотос."
 SHE_event.11.t: "[FROM.GetName] сопротивляется"
 SHE_event.11.desc: "[FROM.GetName] отклонил наш ультиматум, развернув войска на нашей границе. Мы должны готовиться к войне за единый Кивотос."
 SHE_event.11.a: "Выступаем."
 SHE_event.12.t: "[FROM.GetName] подчиняется"
 SHE_event.12.desc: "[FROM.GetName] через дипломатические каналы заявил о своем ненападении. Мы получили права пересечения границы, административное влияние и другие привилегии."
 SHE_event.12.a: "Они будут в безопасности."
 SHE_event.13.t: "Ультиматум от [SHE.GetName]"
 SHE_event.13.desc: "[SHE.GetName] предлагает гарантировать свободные исследования после объединения, если мы сотрудничаем. Принимаем их контроль или готовимся к войне?"
 SHE_event.13.a: "Готовиться к войне."
 SHE_event.13.b: "Если мы сможем исследовать, этого достаточно, верно?"
 SHE_event.14.t: "[FROM.GetName] становится враждебным"
 SHE_event.14.desc: "[FROM.GetName] отклонил ультиматум и мобилизовал войска. Война за объединение неизбежна."
 SHE_event.14.a: "Все пошло не так."
 SHE_event.15.t: "[FROM.GetName] сотрудничает"
 SHE_event.15.desc: "[FROM.GetName] согласился сотрудничать в объединении. Им была назначена конкретная роль в процессе, с сохранением сотрудничества после интеграции."
 SHE_event.15.a: "Они будут в безопасности."
 SHE_event.16.t: "Переворот в [FROM.GetName]"
 SHE_event.16.desc: "Кая, директор обороны студенческого совета, возглавила переворот в [FROM.GetName]. Оставляем их фракцию или остаемся?"
 SHE_event.16.a: "Добро пожаловать, новый президент."
 SHE_event.16.b: "Мы пойдем своим путем."
 SHE_event.17.t: "[FROM.GetName] покидает фракцию"
 SHE_event.17.desc: "[FROM.GetName] осудил наш переворот и отделился от нашей сферы влияния."
 SHE_event.17.a: "Они нам и не нужны были."
 SHE_event.18.t: "[FROM.GetName] присоединяется к Федерации"
 SHE_event.18.desc: "Наша материнская нация, [FROM.GetName], вошла в Федерацию Кивотоса. Теперь наш контроль зависит от этого образования."
 SHE_event.18.a: "Есть с этим проблемы?"
 SHE_event.18.b: "Возможность обрести независимость?"
 SHE_event.18.RED: "Теперь мы Новая Алая Зима!"
