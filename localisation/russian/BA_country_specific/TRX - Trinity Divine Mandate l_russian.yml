TR4_radaslau_astrouski_ns: "$BLR_radislau_astrouski$"
TR4_radaslau_astrouski_ns_desc: "§YРождение:§! §L25 октября 1887, Минская губерния, Российская империя§!\n§YБиография:§! §LRадаслаў Астроўскі родился в семье землевладельца. Во время учебы в Слуцкой школе был исключен за участие в революции 1905 года. В 1908 году поступил в Санкт-Петербургский университет, но в 1911 году был арестован по обвинению в участии в студенческих беспорядках. К счастью, был освобожден и смог продолжить и завершить обучение.\n\nПосле окончания университета Астроўскі работал учителем в Минске и был свидетелем Октябрьской революции 1917 года. Он выступил против большевистского режима и, как представитель Всебелорусского съезда, защищал независимость Белоруссии. За это был арестован Красной гвардией и впоследствии продолжал свою борьбу, чередуя аресты и освобождения.\n\nКогда разразилась война между Тринити и [SOV.GetName], он укрепил свои националистические убеждения и начал сотрудничать с Тринити. Центральная белорусская рада стремится заручиться поддержкой белорусского народа и восстановить свою национальную идентичность. Он созвал Второй Всебелорусский съезд, отрицал легитимность белорусского советского режима и провозгласил себя законным наследником Белорусской Народной Республики.§!"
TRN_central_council: "Центральная белорусская рада"
TRN_central_council_desc: "\n\n\n£GFX_TRN_banner_central_council\n\n\n\n\nЦентральная белорусская рада (парламент) была создана Тринити путем набора местных коллаборационистов. Рада во главе с председателем $BLR_radislau_astrouski$ поддерживает особую систему, сосуществующую с Северо-Восточным теократическим доминионом."