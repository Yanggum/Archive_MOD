 FRA_across_mid_desc:0 "Используя наше подавляющее военно-морское превосходство, мы разработаем более конкретные и спланированные десантные операции для осуществления быстрой и безопасной высадки."
 FRA_last_liberate_plan_flag_tt: "Другой §Y£GFX_decision_icon_small план возвращения метрополии§! выполняется"
 FRA_fight_with_MIL_1: "План возвращения метрополии - I"
 FRA_fight_with_MIL_1_desc: "Этот план, насчитывающий сотни страниц, долго обсуждавшихся централизованным Генеральным штабом, представляет собой конкретный оперативный план возвращения метрополии Франции. Его цель — заставить флот, военно-воздушные силы и армию сотрудничать для пересечения Средиземного моря и высадки в метрополии. Операция разделена на несколько этапов, и каждый требует тщательной подготовки и координации.\n\nНа первом этапе наша цель — высадиться в метрополии и обеспечить плацдарм."
 FRA_fight_with_MIL_2: "План возвращения метрополии - II"
 FRA_fight_with_MIL_2_desc: "На втором этапе наша цель — расширить плацдарм и вести позиционную войну внутри метрополии. Для этого мы будем сотрудничать с местным Сопротивлением для усиления сбора информации и поддержки. Кроме того, мы планируем ввести дополнительные силы и снаряжение для поддержания военных операций внутри метрополии.\n\nНа этом этапе мы уделим особое внимание защите гражданских лиц и гуманитарной помощи внутри метрополии."
 FRA_fight_with_MIL_3: "План возвращения метрополии - III"
 FRA_fight_with_MIL_3_desc: "На третьем этапе наша цель — вернуть основные города и стратегические пункты посредством крупного наступления внутри метрополии. Для этого мы сосредоточим все поставки на атаке и тем самым полностью вытесним контроль Миллениума из метрополии.\n\n§4Это финальная битва!§!"
