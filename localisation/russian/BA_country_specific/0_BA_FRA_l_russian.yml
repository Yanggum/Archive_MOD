 FRA_country_intro_header: "§4Нация блистательной культуры и несгибаемая§!"
 FRA_country_intro_content: " Франция, от Французской революции, через Июльскую революцию, Февральскую революцию и Третью республику, выковала долгую историю сопротивления и свободы, равенства и братства. Это историческое прошлое является предметом огромной гордости для французов, но также сделало политически трудным для них избежать хаоса.\n\n Эта гордость достигла своего апогея, когда в Великой войне они разгромили Германскую империю и одержали победу. После этой почетной победы французское общество, преодолевая свои раны, снова развивалось. Оно восстановило опустошенный северо-восток и приняло на себя центральную роль в мировом порядке.\n\n Однако после Великой депрессии, зародившейся в Соединенных Штатах, Франция погрузилась в огромный застой. Франция все больше отдалялась от всякого рода положительных эпитетов — великолепие, ослепительность, красота — и этот бурлящий социальный образ отразился как есть в политике, способствуя росту социализма, фашизма и монархистов. Этот упадок принес французам глубокое чувство разочарования. Но это разочарование не заставило их сдаться. Под темной эпохой те, кто обладает несгибаемой волей, сохраняют силу и решимость преодолеть ее.\n\n В 1935 году Франции пришлось вести войну против существ, которых она никогда не встречала в своей истории. Перед лицом сущностей из другого мира, называемых Кивотос, армия, правительство и французский народ сражались изо всех сил. Но Франция сильно отставала в их технологии и боевой мощи; и, по мере того как хаотическая политическая ситуация и борьба за власть ослабляли ее оборону, вся Франция пала в руки Кивотос, вызвав великий кризис: правительству и высшему военному командованию пришлось отправиться в изгнание в Северную Африку.\n\n Но французы не подчинились. По всей метрополии было организовано Сопротивление (Résistance), которое продолжает сопротивляться существам из другого мира; а французское правительство, изгнанное в Северную Африку, хотя и ослабленное, продолжает искать способы вернуть метрополию. Правительство в изгнании имеет твердую волю сражаться до конца, победить и освободить народ от сил другого мира, вернув многих в свои дома. Единственное, что им нужно, — это укрепить способность самого правительства в изгнании.\n\n Правительство, сильно разделенное после изгнания, затуманивает нашу цель. И все же Франция никогда не сдастся.\n\n§YРазработка: AfterImage, SKSKIe"
 FRA_guide:0 "Лидерство [FRA_philippe_petain.getname]\n\n£white_dot Стабилизирует Африку.\n£white_dot Расширяет национальные возможности путем быстрой индустриализации.\n£white_dot Возвращает родину, которую у вас отняли.\n£white_dot Восстанавливает дух Франции, отняв его у некомпетентных и коррумпированных демократических сил."
