 FRA_exile_navy_desc: "Французский флот был поврежден и заброшен на долгое время из-за чрезмерной перегрузки при эвакуации, принудительного использования эвакуированных кораблей и отсутствия инфраструктуры обслуживания и ремонта. Если мы быстро не решим эти проблемы, незначительные повреждения кораблей могут перерасти в серьезные проблемы."
