 FRA_prepare_war:0 "Сопротивление"
 FRA_prepare_war_desc:0 " Французское слово, означающее сопротивление — 'Résistance' — это понятие, охватывающее французское националистическое массовое движение и организации сопротивления, выступающие против господства Миллениума.\n\n Сопротивление действует в шести разделенных регионах и в каждом ведет вооруженную борьбу против сил безопасности Миллениума. Они могут быть рассеяны или временно подавлены, но поддержка и одобрение французского народа быстро восстанавливают их организационные способности, поэтому Миллениум не может полностью их уничтожить, кроме как прибегнув к решительным мерам.\n\n С другой стороны, Сопротивление, проникшее в каждый регион, осуществляет всевозможные диверсии против Миллениума, а также поддерживает свою родину в изгнании. Кроме того, если часть из них будет уничтожена и они решат, что больше не могут поддерживать сопротивление в метрополии, они смогут предпринять массовый исход в Северную Африку, как это сделала их собственная страна.\n"

