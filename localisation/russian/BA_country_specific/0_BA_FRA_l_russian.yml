 FRA_fernand_de_brinon: "Фернан де Бренон"

 FRA_GATHERING_STORM_DESC_1: "Франция, страна культуры и искусств, победительница Великой войны, обрела ослепительную славу, разгромив Германию. Но когда захватчики из другого измерения подожгли всю Европу и двинулись на Францию, в 1935 году, пока страна все еще пребывала в политическом хаосе, Франция сопротивлялась… и все же была побеждена, будучи вынужденной встать на путь изгнания.\n\nФранция сразу после изгнания окутана полной тьмой. Внутри по-прежнему царит беспорядок, но все вместе ищут способ вернуть метрополию. Если они все еще французы, долгий путь к возвращению родины уже лежит перед их глазами."

 FRA_focus_shortcut_industry: "Индустриализация"
 FRA_focus_shortcut_diplomacy: "Дипломатия в изгнании"
 FRA_focus_shortcut_intervention: "Интервенция"
 FRA_focus_shortcut_military: "Военная реформа"
 FRA_focus_shortcut_resistance: "Сопротивление"
 FRA_focus_shortcut_garrison: "Управление гарнизонами"
 FRA_focus_shortcut_innercircle: "Звезда Франции"

 FRA_focus.1:0 "Изгнание окончено!"
 FRA_focus.1_desc:0 "Петен укрепил свою решимость снова отвоевать метрополию."
 FRA_focus.1_tt:0 "\n§4Мы четко определим чрезвычайное положение и конкретно пересмотрим комплексные планы по проникновению в метрополию.§!" 
 FRA_focus_ind:0 "Приготовления к индустриализации"
 FRA_focus_ind_desc:0 "Мы расширим промышленность ценой многочисленных жертв."
 FRA_focus_2:0 "Тотальная мобилизация" 
 FRA_focus_2_desc:0 "Чтобы воздвигнуть здания, стоящие посреди пустоты, нужно много жертв. Путем всеобъемлющей и быстрой мобилизации рабочей силы мы добьемся индустриализации в короткие сроки."
 FRA_focus_3.1:0 "Развивать Тунис"
 FRA_focus_3.1_desc:0 "Промышленность важнее людей. Разве мы не сможем дать благосостояние и свободу после того, как разовьемся?"
 FRA_focus_3:0 "Развивать Алжир"
 FRA_focus_3_desc:0 "Промышленность важнее людей. Разве мы не сможем дать благосостояние и свободу после того, как разовьемся?"
 FRA_focus_4:0 "Развивать Марокко"
 FRA_focus_4_desc:0 "Промышленность важнее людей. Разве мы не сможем дать благосостояние и свободу после того, как разовьемся?"
 FRA_focus_5:0 "Развивать Западную Африку"
 FRA_focus_5_desc:0 "Промышленность важнее людей. Разве мы не сможем дать благосостояние и свободу после того, как разовьемся?"
 FRA_focus_6:0 "Большая алжирская мельница"
 FRA_focus_6_desc:0 "Пищевая промышленность обеспечит воспроизводство рабочей силы в больших масштабах."
 FRA_focus_6.5:0 "Правые ополчения"
 FRA_focus_6.5_desc:0 "На западе Франции много консервативных организаций сопротивления с прочно укоренившимися в сердце традиционными ценностями. Они могут стать для нас большой силой."
 FRA_focus_6.8:0 "Теневая экономика"
 FRA_focus_6.8_desc:0 "Через теневую экономику метрополии мы сможем получать необходимые припасы и оказывать неблагоприятное экономическое воздействие на иностранные державы, захватившие нашу территорию."
 FRA_focus_7:0 "Поощрять гражданскую промышленность"
 FRA_focus_7_desc:0 "Основа промышленности — гражданская промышленность. Даже на этой выжженной африканской земле мы должны поощрять гражданскую промышленность, чтобы заложить основы индустриализации."
 FRA_focus_9:0 "Алжирская кредитно-финансовая компания"
 FRA_focus_9_desc:0 "Нам необходимо расширить контролируемую финансовую организацию как институт, облегчающий колонистам Северной Африки получение средств для покупки земли и сельскохозяйственного развития."
 FRA_market_ideology: "Свободная торговля"
 FRA_market_ideology_desc: "У нас нет средств на индустриализацию. Мы должны открыть все двери и продавать наши ресурсы."
 FRA_focus_9.5:0 "Общественное строительство"
 FRA_focus_9.5_desc:0 "Чтобы ускорить планы индустриализации, следующие год за годом, мы построим крупномасштабные жилые комплексы: дешевые, прочные и способные вместить рабочих."
 FRA_focus_state_corporatism: "Государственный корпоративизм"
 FRA_focus_state_corporatism_desc: ""
 FRA_focus_technocratic_economy: "Технократическая экономика"
 FRA_focus_technocratic_economy_desc: ""
 FRA_focus_free_market_economy: "Экономика свободного рынка"
 FRA_focus_free_market_economy_desc: ""
 FRA_focus_10: ""
 FRA_focus_10_desc: ""
 FRA_focus_10.5:0 "Алжирский франк"
 FRA_focus_10.5_desc:0 "Путем денежной реформы мы полностью адаптируемся к африканской экономике."
 FRA_focus_10.7:0 "Дороги через Сахару"
 FRA_focus_10.7_desc:0 "Из-за огромного барьера пустыни Сахары внутренние регионы Западной Африки испытывают трудности со снабжением. Транссахарская железная дорога полностью решит эту проблему и ускорит развитие внутренних районов."
 FRA_focus_10.6:0 "Строительство плотин"
 FRA_focus_10.6_desc:0 "Во внутренних районах Алжира образуются плоскогорья. Мы построим плотины, чтобы развивать эти регионы и активно использовать водные ресурсы."
 FRA_focus_8: "Комплексная разведывательная сеть"
 FRA_focus_8_desc: "Информационная война — ядро современной войны. Мы должны органически связать информацию из метрополии и использовать ее в военных операциях."
 FRA_focus_11:0 "Контролируемая экономика"
 FRA_focus_11_desc:0 "Миф о рыночном росте работает только в обычные времена. Государство должно напрямую вмешиваться и координировать все аспекты промышленности, чтобы экономика оставалась в своем лучшем состоянии."
 FRA_focus_12: "Восстановление Министерства колоний" 
 FRA_focus_12_desc: "Мы должны восстановить Министерство колоний (Ministère des Colonies), которое курирует колониальную администрацию, чтобы максимизировать эффективность колониального управления."
 FRA_focus_13: "Экваториальный каучук"
 FRA_focus_13_desc: "Мы можем обеспечить каучук, стратегический ресурс, на экваторе."
 FRA_focus_15:0 "Уход из Индокитая"
 FRA_focus_15_desc: "Становится очевидным, что мы больше не можем удерживать Индокитай. Мы оставим колонию путем организованного вывода, максимально сохраняя наши интересы."

 FRA_industry_focus_0: "Распашка сельскохозяйственных земель"
 FRA_industry_focus_0_desc: "С продвижением урбанизации сельскохозяйственное производство оказывается под давлением. Чтобы избежать голода во время индустриализации, мы должны распахать пустошь, столь же обширную, как юг Франции."
 FRA_industry_focus_1: "Субсидии горнодобывающим компаниям"
 FRA_industry_focus_1_desc: "Полезные ископаемые — это валюта. Горнодобыча — источник национального богатства!"
 

 FRA_Deuxieme_Bureau: "2-й Генеральный штаб"
 FRA_Deuxieme_Bureau_tt: "Если существует §Yразведывательное агентство§!, то §Gулучшает§! §Yразведывательное агентство§!."

 FRA_focus_arm_1: "Приготовления к войне"
 FRA_focus_arm_1_desc: "В этой душной Африке мы теперь должны готовиться к борьбе."
 FRA_focus_arm_2: "Масштабная высадка десанта"
 FRA_focus_arm_2_desc: "Мы должны развернуть за один раз крупные десантные силы в самом крупном опорном пункте. Путем исследования десантных судов и тренировочных симуляций мы сформируем пехотные части, опытные в амфибийных операциях."
 FRA_focus_new_arm_1: "Доктрина применения пехоты"
 FRA_focus_new_arm_1_desc: "В контексте, когда предлагаются новые взгляды на военную систему, нам, к сожалению, не хватает способности к новаторским попыткам. Вместо этого мы получим спокойное преимущество перед врагом с помощью мощной тактики применения пехоты."
 FRA_focus_new_arm_2: "Рассредоточенный строй"
 FRA_focus_new_arm_2_desc: "Мы рассредоточим пехотные части, чтобы гибко сражаться на обширной территории."
 FRA_focus_new_arm_3: "Развертывание огневой завесы"
 FRA_focus_new_arm_3_desc: "Мы сконцентрируем пехоту для фокусировки огневой мощи."
 FRA_focus_arm_13: "Штурмовые войска"
 FRA_focus_arm_13_desc: "Мы организуем элитные штурмовые силы и завершим ядро доктрины, ориентированной на пехоту."
 FRA_focus_new_arm_8: "'Élan Vital'"
 FRA_focus_new_arm_8_desc: "'Élan Vital' — это славная традиция, унаследованная издавна от Великой французской армии. Мы должны броситься в наступление с несгибаемым духом и, в конце концов, полностью сломать линию врага штыковой атакой." #여기까지 보병
 FRA_focus_arm_3: "Прорыв в одной точке"
 FRA_focus_arm_3_desc: "Не зная огневой мощи врага, слепое продвижение пехоты — это практически самоубийство. Крайне важно сначала сосредоточить подавляющую огневую мощь в одной точке, чтобы прорвать его линию и безопасно высадить наши войска."
 FRA_focus_new_arm_5: "Доктрина огневой поддержки"
 FRA_focus_new_arm_5_desc: "Мы разработаем доктрину огневой поддержки для поддержки пехоты."
 FRA_focus_arm_5: "Наземная поддержка"
 FRA_focus_arm_5_desc: ""
 FRA_focus_new_arm_6: "Морской огонь"
 FRA_focus_new_arm_6_desc: "Огнем поддержки корабельной артиллерии мы сосредоточим огневую мощь в десантных операциях, чтобы поддержать продвижение пехоты."
 FRA_focus_new_arm_9: "Воля к подавляющей огневой мощи"
 FRA_focus_new_arm_9_tt: "\nПолучить очки инноваций:\n§YНаземный бой§!: §R-2§!" #여기까지 포병
 FRA_focus_arm_15: "Новая французская военная наука"
 FRA_focus_arm_15_desc: "Мы должны проанализировать, почему мы проиграли прошлую войну, и установить новую военную науку. С ее помощью мы одержим победу в операции по возвращению метрополии."
 FRA_focus_new_arm_12: "Оборона плацдарма после высадки"
 FRA_focus_new_arm_12_desc: "После высадки мы должны обороняться на фронте, чтобы остановить контратаки врага."
 FRA_focus_new_arm_13: "Спровоцировать войну на истощение"
 FRA_focus_new_arm_13_desc: "Оборона асимметрично выгоднее нападения. Мы должны перерезать линии снабжения врага и постоянно истощать его живую силу и ресурсы."
 FRA_focus_new_arm_14: "Хорошо спланированное наступление"
 FRA_focus_new_arm_14_desc: "Мы должны ударить по слепой зоне врага тщательно спланированным наступлением и сломать его линию." #여기까지 진지전
 FRA_focus_arm_3.5: "Применение кавалерийских танков"
 FRA_focus_arm_3.5_desc: "[FRA_charles_de_gaulle.getname] и его сторонники с особым акцентом упоминают историческую победу 'Осады Эриду' на окраинах Парижа, посреди последнего поражения. Тогда [FRA_charles_de_gaulle.getname] использовал бронетанковые дивизии, основанные на доктрине мобильной войны, чтобы полностью уничтожить второй опорный пункт врага — это была критическая победа, позволившая правительству продержаться еще месяц. По этим причинам они желают сформировать мобильные силы и вести маневренную войну в операции по возвращению метрополии."
 FRA_armor_factory: "Расширение производственных мощностей"
 FRA_armor_factory_desc: "Для управления бронетанковыми дивизиями требуются крупномасштабные производственные мощности. Мы расширим возможности танковых заводов, чтобы увеличить производство бронетанкового снаряжения."
 FRA_focus_new_arm_7: "Решающее бронетанковое сражение"
 FRA_focus_new_arm_7_desc: "Мы должны прорвать фронт с помощью маневренной войны с кавалерийскими танками и дать крупное решающее сражение главным силам врага." #여기까지 기병전차
 FRA_focus_arm_4: "Североафриканская армия"
 FRA_focus_arm_4_desc: "Мы должны объединить и реорганизовать воинские части, служившие в метрополии, с частями, служащими в Африке, а также с частями африканского происхождения. Новая 'Североафриканская армия' будет регулярной армией правительства в изгнании и возглавит авангард возвращения метрополии."
 FRA_focus_arm_14: "Расширить Иностранный легион"
 FRA_focus_arm_14_desc: "Хотя они и не живут в метрополии, уроженцы Западной Африки — такие же французы, как и мы. Мы расширим Иностранный легион, чтобы многие уроженцы могли служить в нем за Францию."
 FRA_focus_new_arm_4: "Мусульманские воины"
 FRA_focus_new_arm_4_desc: "Мы должны снова привлечь во Францию превосходные воинские группы Северной Африки, такие как тиральеры, марокканские гумьеры, спаги и африканские стрелки, и обучить их."
 FRA_focus_new_arm_4_tt: "\nВ §YСеверной Африке§! §Yмусульманские дивизии§! §Gприсоединятся§! к Франции.\n\n"
 FRA_focus_new_arm_10: "Использовать захваченное снаряжение"
 FRA_focus_new_arm_10_desc: "Для ведения пехоты в больших масштабах обеспечение снаряжением является критически важным вопросом. Мы будем захватывать пехотное снаряжение у врага, чтобы гарантировать устойчивость системы снабжения."
 FRA_focus_new_arm_10_tt: "Во время §4Окончательного решения о возвращении метрополии§! §Gдоступно§!:\n"
 FRA_focus_new_arm_11: "Слава Великой армии"
 FRA_focus_new_arm_11_desc: "Возрождая славную традицию Великой французской армии, мы поднимем моральный дух Североафриканской армии и улучшим ее боевую мощь." #여기까지 외인부대
 FRA_focus_new_arm_0: "Высший институт оборонных исследований"
 FRA_focus_new_arm_0_desc: "Теории современной войны, стратегия и тактика постоянно меняются. Мы создадим отдел для реагирования на эти изменения." 
 FRA_colonial_munitions_industry: "Запустить колониальные арсеналы"
 FRA_colonial_munitions_industry_desc: "Мы запустим арсеналы в Северной Африке для поддержки производства военных материалов для возвращения метрополии."
 FRA_focus_arm_6: "Технология противодействия ореолу"
 FRA_focus_arm_6_desc: "Чтобы победить тех с ореолом, кто не падает от винтовочных пуль, требуется более сильная огневая мощь. Возможно, противотанковые орудия — это ответ." 
 FRA_vertical_integration: "Слияние малых и средних предприятий"
 FRA_vertical_integration_tt: "Государства §YСеверной Африки§! с как минимум §Y2§! §Yгражданскими фабриками§!:"
 FRA_focus_arm_11: "Моторизованная тактика"
 FRA_focus_arm_11_desc: "В нынешней ситуации производство бронированных танков представляет слишком много трудностей. Пришло время внедрить технологию и разработать быстрые и относительно дешевые машины." #여기까지 고등 국방 연구원
 FRA_focus_arm_8: "Воссоединить флот"
 FRA_focus_arm_8_desc: "У нас есть десятки военных кораблей, которые использовались для эвакуации метрополии. Мы должны систематически организовать оставшиеся корабли, чтобы подготовиться к будущему." 
 FRA_focus_arm_9: "Основать морскую пехоту"
 FRA_focus_arm_9_desc: "Мы должны основать морскую пехоту, которая будет тесно сотрудничать с флотом, чтобы максимизировать шансы на успех в амфибийных операциях."
 FRA_focus_new_arm_15: "Разработать плавающие танки" 
 FRA_focus_new_arm_15_desc: "Мощный батальон плавающих танков сокрушит врагов в точке высадки и на большой скорости прорвет фронт. Мы разработаем их и развернем в морской пехоте."
 FRA_focus_arm_10: "Строительство верфей"
 FRA_focus_arm_10_desc: "Судостроительная промышленность Северной Африки недостаточна для поддержания нашего флота. Мы должны построить верфи, чтобы обеспечить устойчивость военно-морской мощи."
 FRA_focus_arm_12.5: "Сосредоточиться на восстановлении флота"
 FRA_focus_arm_12.5_desc: "Где мы проиграли, так это на суше, а не на море. Фактически, море можно считать местом победы для нас, потому что мы сохранили практически все корабли, которые имели при эвакуации. Мы сосредоточимся на восстановлении военно-морской мощи и закреплении нашего превосходства на море."
 FRA_naval_arms_race: "Военно-морская гонка"
 FRA_naval_arms_race_desc: "Офицеры французского флота крайне обеспокоены возможностью того, что флот [MIL.getadjective] в конечном итоге превзойдет нашу военно-морскую мощь. Мы вступим в гонку кораблестроения, чтобы укрепить ее."
 FRA_make_auxiliary: "Строительство вспомогательных судов"
 FRA_make_auxiliary_desc: "Мы сосредоточимся на строительстве вспомогательных судов, чтобы сформировать соответствующий военно-морской флот."
 FRA_focus_arm_12: "Продажа капитальных кораблей"
 FRA_focus_arm_12_desc: "Прямо сейчас французский флот перенасыщен до такой степени, что обслуживание в Северной Африке становится непосильным. Мы должны продать часть капитальных кораблей и реорганизовать флот в управляемый."
 FRA_make_submarine: "Приоритет подводным лодкам"
 FRA_make_submarine_desc: "Подводные лодки — самое эффективное средство для перерезания морских путей снабжения врага. Мы сосредоточимся на строительстве подводных лодок для улучшения наших возможностей по морской блокаде."
 FRA_naval_commander: "Командование военно-морскими операциями"
 FRA_naval_commander_desc: "Мы должны создать Командование военно-морскими операциями для повышения эффективности военно-морских операций."
 FRA_control_mediterrian: "Контроль над Западным Средиземноморьем"
 FRA_control_mediterrian_desc: "Поскольку наша военно-морская мощь достаточно превосходит вражескую, французский флот смог контролировать все Средиземноморье и выполнять операции с большей легкостью."
 FRA_control_mediterrian_tt_1: "При завершении фокуса §Y$FRA_focus_arm_12.5$§!:\n  "
 FRA_control_mediterrian_tt_2: "При завершении фокуса §Y$FRA_focus_arm_12$§!:\n  " #여기까지 해군
 FRA_focus_arm_7: "Приготовления к воздушной войне в метрополии"
 FRA_focus_arm_7_desc: "Наши военно-воздушные силы были бессильны перед мощными реактивными истребителями [MIL.getadjective]. Мы должны подготовиться к воздушной войне в метрополии и сформировать военно-воздушные силы, способные противостоять реактивным самолетам."
 FRA_focus_arm_9.5: "Разрабатывать истребители"
 FRA_focus_arm_9.5_desc: "Истребители — самый важный фактор для завоевания превосходства в воздухе. Мы сосредоточимся на разработке истребителей."
 FRA_focus_arm_8.5: "Разрабатывать штурмовую авиацию"
 FRA_focus_arm_8.5_desc: "Нам нужны самолеты для поддержки наступления армии."
 FRA_focus_new_arm_16: "Построить авиастроительные предприятия"
 FRA_focus_new_arm_16_desc: "Мы построим авиастроительные предприятия, чтобы заложить основу для укрепления военно-воздушных сил."
 FRA_paratroopers: "Сформировать воздушно-десантные войска"
 FRA_paratroopers_desc: "Мы сформируем воздушно-десантные войска, чтобы обеспечить способность нарушать тылы врага и осуществлять внезапные удары."
 FRA_stop_air: "Отказаться от воздушной войны"
 FRA_stop_air_desc: "В ситуации, вынуждающей выбирать и концентрировать ресурсы, у нас нет возможности поддерживать военно-воздушные силы. Мы откажемся от победы в воздухе и вместо этого сосредоточимся на поддержке сухопутных сил."
 FRA_defense_air: "Противовоздушная оборона"
 FRA_defense_air_desc: "Способность врага вести воздушную войну представляет угрозу. Мы сосредоточимся на противовоздушной обороне, чтобы сдержать ее."
 FRA_sell_airplane: "Продажа самолетов"
 FRA_sell_airplane_desc: "Мы будем продавать самолеты, чтобы инвестировать в другие сектора." #여기까지 공군

 FRA_authenticity_in_the_international_community: "Подтвердить легитимность перед международным сообществом"
 FRA_authenticity_in_the_international_community_desc: "После переворота наше правительство сталкивается с противоречиями относительно того, является ли оно законным правительством в изгнании. Мы должны решить эту задачу."
 FRA_mediterranean_diplomacy: "Средиземноморская дипломатия"
 FRA_mediterranean_diplomacy_desc: "Чтобы вернуть метрополию, неизбежна высадка через Средиземное море, и для этого требуется контроль над морем в этой зоне. Хотя может быть разница между уровнем наших флотов и флотов врага, мы сможем преодолеть ее с помощью дипломатии со все еще существующими средиземноморскими странами."
 FRA_confirm_italian_hegemony: "Признать итальянскую гегемонию"
 FRA_confirm_italian_hegemony_desc: "Италия, ставшая нашим союзником после подписания Стрезского фронта, сегодня царит как хозяин Средиземноморья. Хотя это ранит нашу гордость, мы должны признать ее гегемонию и поддерживать дружественные отношения. Ее помощь необходима для обеспечения контроля над морем."
 FRA_italian_invest: "Инвестиции итальянских промышленников"
 FRA_italian_invest_desc: "Итальянские капиталисты ищут новые земли возможностей, куда стоит вкладывать средства, и мы нуждаемся в их промышленных инвестициях. Мы сможем получить их в обмен на влияние в Тунисе."
 FRA_in_the_same_boat: "В одной лодке" #제미나이가 영어 표현은 '같은 배를 타다'래요
 FRA_in_the_same_boat_desc: "У Испании и нас общее то, что исекайцы отняли у нас территорию. Нам нужна помощь Испании для возвращения метрополии, и Испания нуждается в нас, чтобы изгнать исекайцев и воссоединить страну. Испания и Франция, на практике, не более чем две страны в одной лодке."
 FRA_barrier_against_kivotos-Bolshevism: "Барьер против исекай-большевизма"
 FRA_barrier_against_kivotos-Bolshevism_desc: "В зоне Каталонских Пиренеев обосновались исекайцы и реакционные силы. Если мы поддержим Испанию в их разгроме, возможно, Испания также предоставит силы для нашей войны по возвращению метрополии."
 FRA_north_africa_road: "Североафриканская автомагистраль"
 FRA_north_africa_road_desc: "Наши колониальные территории и территории Испании граничат, что облегчает транспортировку припасов. Если мы построим автомагистраль в Северной Африке, мы сможем еще больше увеличить поток логистики."
 FRA_trade_treaty: "Средиземноморская торговля"
 FRA_trade_treaty_desc: "Наш союзник, Соединенное Королевство, из-за географических ограничений испытывает трудности со своевременной экономической поддержкой. Мы сможем решить эту проблему, поощряя торговлю со средиземноморскими странами."
 FRA_mediterranean_economic_bloc: "Общесредиземноморское экономическое пространство"
 FRA_mediterranean_economic_bloc_desc: "По мере усиления торговли между странами, окружающими Средиземное море, мы должны объединить их в единое экономическое пространство и сконцентрировать все наши возможности."
 FRA_mediterranean_economic_bloc_tt: "§YСтраны§!, обладающие национальным духом §Y$FRA_mediterranean_trade_treaty$§!:"
 FRA_solidarity_between_governments_in_exile: "Солидарность между правительствами в изгнании"
 FRA_solidarity_between_governments_in_exile_desc: "После Великой транспозиции европейские страны, которые, как и мы, потеряли свою метрополию, горят решимостью вернуть ее. Хотя сила каждой по отдельности незначительна, солидарность между правительствами в изгнании может компенсировать разницу в силах."
 FRA_halifax_conference: "Галифаксская конференция"
 FRA_halifax_conference_desc: "Мы и Соединенное Королевство были когда-то правителями мира, но Великая транспозиция отняла это место, отдав его нациям из другого мира. Чтобы вернуть метрополию и восстановить мировой порядок, сотрудничество с Соединенным Королевством необходимо, поэтому мы запросили конференцию с ними."
 FRA_invest_from_anglo_financier: "Инвестиции английских финансистов"
 FRA_invest_from_anglo_financier_desc: "Соединенное Королевство сегодня — самая могущественная финансовая нация. Даже если мы в изгнании, если мы привлечем их инвестиции, мы сможем усилиться."
 FRA_italian_joint_struggle_on_kivotos: "Совместная борьба против Кивот"
 FRA_italian_joint_struggle_on_kivotos_desc: "В соответствии с изначальной целью формирования Стрезского фронта, необходима совместная борьба против сил, захвативших нашу землю."
 FRA_befriend_with_belgium: "Сотрудничество с Бельгией для возвращения метрополии"
 FRA_invest_from_belgian_capitalist: "Инвестиции богатых конголезских капиталистов"
 FRA_mining_rubber_with_bel: "Совместная добыча экваториального каучука"
 FRA_belgian_model: "Бельгийская модель"
 FRA_claim_hegemony_on_equatorial_africa: "Гегемония в Экваториальной Африке"
 FRA_ouster_the_king: "Свергнуть короля-угнетателя"
 FRA_belgium_provisional_mainland_restoration_government: "Бельгийское временное правительство по восстановлению метрополии"
 FRA_befriend_with_netherland: "Дружба с нидерландским правительством в изгнании"
 FRA_befriend_with_netherland_desc: "Нидерландское правительство, как и мы, было разгромлено атакой из другого мира и находится в изгнании в Ост-Индии. Однако оно в затруднении из-за повстанческих сил в Индонезии. Если, по случайности, повстанцы победят, деколонизация может стать мировой тенденцией. Мы больше не можем позволить себе смотреть в другую сторону."
 FRA_focus_on_colonial_deiplomacy: "Сосредоточиться на колониальной дипломатии"
 FRA_focus_on_colonial_deiplomacy_desc: "Мы должны уделять внимание не только колониям Африки, но и колониям Ближнего Востока и Азии. Мы обеспечим французский контроль в Сирии и Индокитае. "
 FRA_military_minister_to_indochina: "Направить военного губернатора в Индокитай"
 FRA_french_indochina: "Развивать Французский Индокитай"
 FRA_french_indochina_desc: "Индокитай богат природными ресурсами. Мы должны развивать этот регион, чтобы поднять нашу промышленность."
 FRA_withdraw_from_indochina: "Вернуть промышленность из Индокитая"
 FRA_withdraw_from_indochina_desc: "Мы не можем бесконечно удерживать нестабильный регион Индокитая. Предпочтительнее вернуть часть основной промышленности и вложить ее в Алжир."
 FRA_withdraw_from_indochina_tt: "Из каждой страны к @FRA§Y[FRA.getadjective]§!:\n"
 FRA_southeast_asia_economic_bloc: "Экономический блок Юго-Восточной Азии"
 FRA_southeast_asia_economic_bloc_desc: "Экономический блок, созданный под руководством [FRA.getadjective], нацелен на взаимовыгодное экономическое сотрудничество, передачу технологий и торговый союз между странами-членами. Внутри этого экономического сообщества Франция имеет лишь статус страны-наблюдателя, но, поскольку Франция контролирует право голоса участвующих Вьетнама, Лаоса и Камбоджи, Франция де-факто действует как председатель."
 FRA_intervention_to_middle_east: "Вмешаться на Ближнем Востоке"
 FRA_intervention_to_middle_east_desc: "В регионе Ближнего Востока происходят крупные сражения. Мы не можем избежать вмешательства для защиты наших интересов."
 FRA_french_syr: "Французская Сирия"
 FRA_french_syr_desc: "Мы должны восстановить Французскую Сирию и снова создать наш форпост на Ближнем Востоке."

  FRA_focus_resistance_1:0 "Контакт с метрополией"
 FRA_focus_resistance_1_desc:0 "Нам удалось связаться с товарищами из Сопротивления, действующими в метрополии. Мы должны сотрудничать с ними, чтобы вернуть наш дом."
 FRA_focus_resistance_2:0 "Активный подход"
 FRA_focus_resistance_2_desc:0 "В последней войне Франция победила с помощью отчаянной оборонительной тактики, но эти враги прорвали нашу оборону и восторжествовали. Теперь наша очередь, как тогда враги, активно стремиться к отвоеванию метрополии."
 FRA_focus_resistance_3:0 "Осторожный подход"
 FRA_focus_resistance_3_desc:0 "Причина, по которой мы были мгновенно разгромлены врагом из другого мира, заключалась не только в разнице боевой мощи, но и в том, что у нас не было точной информации об их армии. Возьмем прошлое поражение как урок и будем продвигаться более осторожно, наблюдая за их стратегией и тактикой."
 FRA_focus_resistance_4:0 "Сельское сопротивление"
 FRA_focus_resistance_4_desc:0 "На плодородных обширных равнинах юга Франции живут крестьяне, верные католической вере. Они не объединены в единую организацию, но в борьбе против исекайцев проявят сплоченный фронт."
 FRA_focus_resistance_5:0 "В теплое место"
 FRA_focus_resistance_5_desc:0 "Все приготовления закончены. Великая армия Франции, флот и военно-воздушные силы нацелены на захватчиков ради своих семей. Мы не можем гарантировать победу, но мы должны идти. В теплое место!"
 FRA_ita_is_helping_tt:0 "\nПоскольку §Y[ITA.getname]§! принял нашу просьбу, §Yчасти Сопротивления§! поднимутся на границе §YМиллениум - [ITA.getname]§!."
 FRA_spr_is_helping_tt:0 "\nПоскольку §Y[SPR.getname]§! приняла нашу просьбу, §Yчасти Сопротивления§! поднимутся на границе §YМиллениум - [SPR.getname]§!."
 FRA_focus_resistance_7:0 "Масштабная пропаганда"
 FRA_focus_resistance_7_desc:0 "Уже пора, чтобы все граждане, все еще остающиеся в метрополии, узнали об этом. Мы расклеим листовки на улицах и через радио сделаем известной нашу великую решимость."
 FRA_focus_resistance_6:0 "Красные партизаны"
 FRA_focus_resistance_6_desc:0 "Французская коммунистическая партия обладает самой крупной организацией Сопротивления в метрополии. Они связывают фермы и фабрики, используют университеты как базы, перевозят и перемещают подпольную прессу и ведут партизанскую войну в северной портовой зоне и парижском промышленном поясе."
 FRA_when_uprise: "При завершении национального фокуса §Y$FRA_focus_resistance_14$§!:\n"
 FRA_focus_resistance_9:0 "Организовать Армию освобождения Сопротивления"
 FRA_focus_resistance_9_desc:0 "С информацией, полученной от вернувшихся в метрополию участников сопротивления, мы поняли, что Миллениум сейчас находится в хаотическом положении. Используя эту возможность, все граждане Франции возьмутся за оружие и, не щадя жертв, изгонят захватчиков из другого мира, чтобы вернуться домой." 
 FRA_focus_resistance_10: "Бюро связи"
 FRA_focus_resistance_10_desc: "Если мы установим устойчивую систему связи с Сопротивлением, мы сможем вести войну более эффективно."
 FRA_focus_resistance_8:0 "Всеобщая забастовка"
 FRA_focus_resistance_8_desc:0 "Среди товарищей в метрополии есть небольшое число, с которым мы можем тайно связаться внутри фабрик. Если, опираясь на них, мы проведем крупномасштабную всеобщую забастовку, мы временно парализуем промышленность врага и поможем продвижению наших главных сил."
 FRA_focus_resistance_11:0 "Обучение ополчения"
 FRA_focus_resistance_11_desc:0 ""
 FRA_focus_resistance_12:0 "Проникновение в порты"
 FRA_focus_resistance_12_tt: "В §Yпортовых городах§! метрополии поднимутся §Yчасти Сопротивления§!."
 FRA_focus_resistance_12_desc:0 ""
 FRA_focus_resistance_13: "Береговая разведка"
 FRA_focus_resistance_13_desc: "Предварительная информация необходима для осуществления высадки."
 FRA_focus_resistance_14:0 "Восстание!"
 FRA_focus_resistance_14_desc:0 "Сопротивление готово! Настало время нанести дисциплинированный удар в сердце врага!"
 FRA_prepare_for_naval_invasion: "Приготовления к высадке"
 FRA_prepare_for_naval_invasion_desc: ""

 FRA_focus_garrison_0: "Управление гарнизонами"
 FRA_focus_garrison_0_desc: ""
 FRA_focus_garrison_1: "Регулирование интересов"
 FRA_focus_garrison_1_tt: "§gЭта ветвь снизит уровень кризиса Франции путем регулирования интересов между французами и колонизированными.§!"
 FRA_focus_principle_of_autonomy: "Принцип автономии"
 FRA_focus_principle_of_autonomy_tt: "§gЭта ветвь защитит права и интересы колонистов и использует их для разрешения забастовки.§!\n\n"
 FRA_focus_garrison_2: "Успокоение"
 FRA_focus_garrison_2_tt: "§gЭта ветвь разрешит забастовку путем быстрых переговоров.§!\n\n"
 FRA_focus_garrison_3: "Политическое представительство колонистов"
 FRA_focus_garrison_4: "Сохранение налоговых льгот"
 FRA_focus_garrison_5: "Самооборона колонистов"
 FRA_focus_garrison_6: "Антизабастовочный закон"
 FRA_focus_garrison_7: "Отмена приоритета земли"
 FRA_focus_garrison_8: "Реформа Туземного кодекса"
 FRA_focus_garrison_9: "Формирование местных элит"
 FRA_focus_garrison_10: "Расширить Алжирский университет"
 FRA_focus_garrison_11: "Основать Народный комиссариат внутренних дел"
 FRA_focus_garrison_11_tt: "§YИ почему это они, черт возьми, пытаются основать НКВД как замену Франции?§!"
 FRA_focus_garrison_11_real: "Главное управление национальной безопасности"
 FRA_focus_garrison_11_real_desc: ""
 FRA_focus_garrison_12: "Подавление нелегальных сверхурочных работ"
 FRA_focus_garrison_13: "Приют для бедных мусульман"

 FRA_focus_war_1:0 "Война за возвращение метрополии"
 FRA_focus_war_1_desc:0 "Началась война за возвращение нашего дома."
 FRA_focus_war_2:0 "Вернуть юг"
 FRA_focus_war_2_desc:0 "Быстрым наступлением мы вернули равнины юга Франции."
 FRA_focus_war_3:0 "Вернуть запад"
