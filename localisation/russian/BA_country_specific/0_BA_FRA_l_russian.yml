 FRA_ascension_of_character_tt: "§Y$CHARACTER$§! возвышается внутри §Y$FRA_inner_circle_member_title$§! до следующего:"
 FRA_replace_ascended_advisor_tt: "§RУдаляется из§! §Y$FRA_inner_circle_member_title$§!:\n§Y$CHARACTER$§! с ролью $TRAIT$"
 FRA_ascended_character_trait_swap_tt: "§Y$CHARACTER$§! возвышается внутри §Y$FRA_inner_circle_member_title$§!:"

 FRA_inner_circle.01.t: "Возвышение [BA_GetAscendingAdvisorName]"
 FRA_inner_circle.01.desc: "[BA_GetAscendingAdvisorName] проявил formidable амбиции и оказал влияние внутри партии. Однако его попытка требовать большего контроля столкнулась с оппозицией других членов и привела к борьбе за власть. Вопрос в том, удалось ли [BA_GetAscendingAdvisorName] достаточно впечатлить [ROOT.GetLeader], чтобы обеспечить себе место в ближайшем кругу."
 FRA_inner_circle.01.a: "Заменить [BA_GetAscendedAdvisorName1]"
 FRA_inner_circle.01.b: "Заменить [BA_GetAscendedAdvisorName2]"
 FRA_inner_circle.01.c: "Заменить [BA_GetAscendedAdvisorName3]"
