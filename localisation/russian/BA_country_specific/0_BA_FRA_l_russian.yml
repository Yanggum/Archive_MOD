l_russian:
 #정당 (나는 .yml 비정규화를 지지해요)
 FRA_CGT: "Всеобщая конфедерация труда"
 FRA_CGT_long: "Всеобщая конфедерация труда\n§gПосле изгнания Всеобщая конфедерация труда стала временным центром притяжения для объединения левых сил в процессе перестройки французского политического ландшафта. Это произошло потому, что Французская коммунистическая партия сосредоточила свои усилия на сопротивлении в метрополии и поэтому — негласно — избегала слишком резкой критики колониальной администрации правительства в изгнании, что в итоге создало среду борьбы, сосредоточенную вокруг профсоюзов, а не партий. Её ряды неоднородны: от алжирских мусульман, стремящихся к радикальной независимости, до французов, требующих лишь равного обращения с метрополией, и тех, кто сосредоточен исключительно на рабочем движении.§!"
 FRA_PPNA: "СААК/ВКТ-АС"
 FRA_PPNA_long: "Североафриканская ассоциация рабочих и крестьян/Секция Алжира ВКТ\n§gСевероафриканская ассоциация рабочих и крестьян (СААК) — это партийная организация, наследница «Североафриканской звезды» и наиболее влиятельная левая антиимпериалистическая группировка в регионе. Она завоевала популярность среди тех, кто был возмущен тем, что Французская коммунистическая партия под прикрытием национального фронта закрывала глаза и мирилась с правым поворотом правительства в изгнании; а также среди бедняков и низших слоев населения, мусульманского среднего класса и интеллигенции, молодежи и социалистов. В особенности, союз СААК с ВКТ обеспечил ей огромные организационные возможности: это смягчает её идеологическую узость и в то же время четко определяет для её сторонников единую цель: антиимпериалистическая и антиэксплуататорская трудовая борьба.§!"
 FRA_neutrality_party_mil_gov: "Военный кабинет"
 FRA_neutrality_party_mil_gov_long: "Военный кабинет\n§gНесмотря на Третью республику, французское высшее командование сохраняет ярко выраженный консервативный оттенок, и более того, часть его руководства становится даже реакционной. Армия не доверяет выборным правительствам, и провал в метрополии дал ей предлог для подрыва принципа гражданского контроля. Под руководством единого лидера, избранного вооруженными силами, Военный кабинет организуется сверху вниз, формируя вертикальную и иерархическую политическую структуру.§!"
 FRA_democratic_party_mil_gov: "Народный фронт"
 FRA_democratic_party_mil_gov_long: "Народный фронт Франции\n§gШирокий центристско-левый партийный альянс — в составе Коммунистической партии, Французской секции Рабочего интернационала и Радикальной партии, среди прочих — организовался после изгнания, чтобы противостоять военному перевороту военного кабинета. Более чем какой-либо другой блок, он сплотился для проведения в жизнь антифашизма и борьбы против диктатуры; и, в случае некоторых радикализированных секторов, они готовы даже осуществить право на сопротивление насильственным путем.§!"
 FRA_PCF: "Французская коммунистическая партия"
 FRA_PCF_long: "Французская коммунистическая партия\n§gОбъявив о полном разрыве с Североафриканской ассоциацией рабочих и крестьян, Французская коммунистическая партия стала основной альтернативой на первых выборах, проведенных по всей Северной Африке, заполнив вакуум, оставленный запрещенной к участию СААК. Позиционируя себя как партию, которая принимает революционные требования алжирцев и в то же время умеет гибко договариваться о компромиссах с бывшими бюрократами французского военного режима, ФКП ежедневно критиковала «экстремизм» СААК и взяла в качестве официальной линии создание «единого федеративного социалистического французского государства». Таким образом, она привлекла тех, кто был утомлен революционным путем СААК, де-факто терпимо относилась к бывшим чиновникам и прочно закрепила свои позиции.§!"
 FRA_democratic_party_nextgov: "Народный фронт"
 FRA_democratic_party_nextgov_long: "Народный фронт Франции\n§gШирокий центристско-левый партийный альянс — включая Коммунистическую партию, Французскую секцию Рабочего интернационала и Радикальную партию — с момента изгнания был крупнейшей противодействующей силой военному кабинету. Когда Франция оказалась на грани полного распада и страна повернула вправо, Народный фронт в итоге трансформировался на практике почти в единую партию. Хотя он всегда проводил четкую линию по отношению к радикальному пути СААК и ставил во главу угла компромисс и сдержанность, сегодня они наконец получили власть в Африке, как и желали.§!"
 FRA_PSF: "Французская социальная партия"
 FRA_PSF_long: "Французская социальная партия\n§g«Секретный комитет революционного действия», первоначально известный как «Боевые кресты», в отличие от других фашистских организаций, сумел создать значимый политический проект не только в метрополии, но и в Алжире. Основанные на католических и антикоммунистических принципах, они составляют ядро французской колониальной системы.§!"


 BA_resistance_icon_1_tt:0 "Сопротивлениеㅣ§YSлабое§!"
 BA_resistance_icon_2_tt:0 "Сопротивлениеㅣ§OУмеренное§!"
 BA_resistance_icon_3_tt:0 "Сопротивлениеㅣ§RСильное§!"
 FRA_propaganda_blank:0 "Пропаганда еще не размещена."
 FRA_propaganda_tt:0 "Пропаганда не размещена."
 FRA_propaganda_FRA_1:0 "§4Служи родине!§!"
 FRA_propaganda_FRA_2:0 "§4Усиль натиск!§!"
 FRA_propaganda_FRA_3:0 "§4Триколор реет§!"
 FRA_propaganda_FRA_4:0 "§4Французский идеализм§!"
 FRA_propaganda_FRA_5:0 "§4'Уже почти!' - Инвестируйте в освобождение Франции с облигациями обороны§!"
 FRA_propaganda_FRA_6:0 "§4Следуй приказам маршала!§!"
 FRA_propaganda_FRA_7:0 "§4Все для освобождения!§!"

#프랑스 이벤트
 FRA_pet.1.t:0 "Верденский лев"
 FRA_pet.1.d:0 "Северная Африка была ему знакома. Пейзаж за окном, напомнивший ему о службе в крупнейшей войне межвоенного периода десять лет назад, заставил его погасить трубку и подняться с места. [FRA_philippe_petain.getname] не находил происходящее приятным. Для элитного французского офицера поражение родины было унизительным и удручающим, и тот факт, что это хлопотное и одновременно критически важное дело легло на него, представляло собой огромную ношу. И все же он инстинктивно понимал, что это как раз тот самый последний момент, когда он может служить своей стране, и он также знал, куда должен вести путь, чтобы стать героем.\n\nСекретарь, стоя перед кабинетом, открыл рот.\n\n\"Превосходительство, ежемесячный отчет о работе.\""
 FRA_pet.1.a:0 "\"Родина зовет меня!\""
 FRA_pet.2.t:0 "Решение ради родины"
 FRA_pet.2.d:0 "В глазах [FRA_philippe_petain.getname] нынешняя ситуация была чрезвычайным положением, и без действительно комплексного метода Франция не сможет продвинуться к отвоеванию метрополии. [FRA_philippe_petain.getname] будет бороться за возвращение наследия предков, даже если для этого придется 'смело' отказаться от наследия французского колониализма и сосредоточиться на укреплении национальной мощи."
 FRA_pet.2.a:0 "Да здравствует Маршал!"
 FRA_pet.3.t:0 "Бегство Пьера Лаваля"
 FRA_pet.3.d:0 "Хотя недавний переворот парализовал парламент, Пьер Лаваль все еще мог сохранить пост премьер-министра. Однако это военное восстание стало для него прямой угрозой, и мрачное будущее правительства в изгнании не казалось ему привлекательным. Вместо этого он решил осуществить то, что обдумывал последние несколько дней."
 FRA_pet.3.a:0 "\"Быстрее, убираемся отсюда!\""
 FRA_pet.30.t:0 "Бегство Пьера Лаваля"
 FRA_pet.30.d:0 "Хотя недавний переворот парализовал парламент, Пьер Лаваль все еще мог сохранить пост премьер-министра. Однако это военное восстание стало для него прямой угрозой, и мрачное будущее правительства в изгнании не казалось ему привлекательным.\n\nПоэтому Пьер Лаваль бежал на территорию нашей академии и демонстрирует шаги, направленные на то, чтобы сыграть роль посредника между французами в стране и нашей администрацией."
 FRA_pet.30.a:0 "Пока понаблюдаем."
 FRA_pet.4.t:0 "\"Искры Республики\""
 FRA_pet.4.d:0 "[FRA_maurice_gamelin.getname] был героем Великой войны и уважаемым ветераном в армии. Когда Париж пал, он остался сидеть в своем кресле, безутешно плача. Этот жест проистекал из его патриотизма по отношению к Республике и демократии, которые он почитал. Конституционный дух Франции был приостановлен военным положением [FRA_philippe_petain.getname], и, потеряв все — метрополию и режим, — прославленный офицер штаба был не более чем солдатом, ожидающим приказов."
 FRA_pet.4.a:0 "\"Я помню дух 14 июля!\""
 FRA_pet.4_tt:0 "§g[ROOT.getname] попытается претендовать на пост временного председателя военной комиссии, если Петен будет отстранен.§!"
 FRA_pet.5.t:0 "\"Лотарингский крест\""
 FRA_pet.5.d:0 "[ROOT.getname] сейчас фигура, привлекающая огромное внимание во французской армии. Всего несколько месяцев назад он разгромил город-крепость под названием Эриду, полное средоточие объединенных футуристических технологий. Его бронетанковые силы сражались храбро, и публика во всей Франции рукоплещет ему. Он все еще восходящая звезда, но с течением времени он сам знает, что в итоге займет место первого ряда. Французское высшее командование, напротив, все еще застряло в старом мире. Скоро Франция, кажется, будет нуждаться в его правлении."
 FRA_pet.5.a:0 "\"Франция проиграла только одно сражение.\""
 FRA_pet.6.t:0 "Национальная революция"
 FRA_pet.6.d:0 "\"Национальная революция\" — это программа общенациональной социальной перестройки, с помощью которой Маршал определяет причину поражения Третьей республики не только как военную некомпетентность, но и как результат внутреннего 'либерализма', 'социализма', 'беспорядка' и 'безнравственности', и стремится преодолеть их. Для Маршала отвоевание метрополии должно сопровождаться внешним ростом и внутренней дисциплиной. Под девизом 'Труд, Семья, Отечество' Франция снова поднимется!"
 FRA_pet.6.a:0 "Все ждут его руководства."
 FRA_pet.7.t:0 "Хартия труда"
 FRA_pet.7.d:0 "Маршал инициировал масштабную трудовую реформу, чтобы предотвратить любые марксистские или социалистические попытки подорвать Республику. Объявленная в [GetMonth] \"Хартия труда\" признает единственной законной рабочей организацией единый корпоративный профсоюз, контролируемый государством; запрещает и распускает все остальные профсоюзы и стремится установить экономическую систему государственного корпоративизма, вдохновленную традиционным католическим порядком."
 FRA_pet.7.a:0 "Будем служить родине!"

 FRA_pet.8.t:0 "Роль женщины"
 FRA_pet.8.d:0 "В течение многих лет традиционный семейный порядок рухнул и был заменен новым взглядом на семью: коррумпированным и декадентским. Это, несомненно, неправильно. Маршал вернет роль женщин на их исконное место, основываясь на католическом порядке."
 FRA_pet.8.a:0 "Все возвращается на свои места."
 FRA_pet.8_tt:0 "§gМусульманские элиты, обладающие властью в Северной Африке, предпочитают эту политику.§!"
 FRA_dar.1.t:0 "Адмирал-администратор"
 FRA_dar.1.d:0 "[FRA_francois_darlan.getname] смог, наконец, насладиться глубоким сном. Бессонные ночи, потраченные на планирование исхода, переправу десятков тысяч солдат и гражданских лиц, и ярость, пришедшая только потом, когда он осознал, что родина потеряна, терзали его; но после всего этого ему удалось обрести некоторое спокойствие. К счастью, политики в парламенте — такие невероятные — были связаны маршалом, и это позволило ему восстановить надежду. Когда он встал с кровати, его адъютант принес новости."
 FRA_dar.1.a:0 "\"Адмирал, вы назначены премьер-министром!\""
 FRA_appointed_by_prime_minister_tt:0 "§Y[ROOT.getname]§! назначен §Yпремьер-министром Военного кабинета§!:\n"
 FRA_dar.2.t:0 "Индустриальное изгнание"
 FRA_dar.2.d:0 "Мы успешно осуществили дополнительный четырехмесячный план исхода с юга метрополии. Административная сеть [MIL.getname], все еще ограниченная севером и городскими районами, не смогла предотвратить контакты и крупномасштабную разведывательную работу в сельской местности и портах; в результате нам удалось обеспечить больше капитала и рабочей силы, чем ожидалось в начале исхода."
 FRA_dar.2.a:0 "К счастью."
 FRA_dar.3.t:0 "Средиземное море"
 FRA_dar.3.d:0 "Премьер-министр [FRA_francois_darlan.getname] понимает лучше, чем кто-либо, что будущая операция по отвоеванию метрополии будет крупномасштабной высадкой. И он также знает, что самое необходимое в такой операции: подавляющее военно-морское превосходство. Поэтому он решил выделить специальный бюджет и инвестировать в производство в преддверии крупного морского сражения в ближайшем будущем."
 FRA_dar.3.a:0 "Средиземное море наше!"
 FRA_dar.4.t:0 "За горами"
 FRA_dar.4.d:0 "[FRA_francois_darlan.getname] связался с [ITA.getname], чтобы запросить простую военную уступку: разрешить, в рамках программы, направленной на организацию хорошо скоординированного восстания ополчения Сопротивления на границе между [MIL.getname] и [ITA.getname], временно занять часть территории для использования в качестве учебной зоны."
 FRA_dar.4.a:0 "Примут ли они запрос?"
 FRA_prov_event.1.t:0 "Исход Сопротивления"
 FRA_prov_event.1.d:0 "Многие участники Сопротивления, сражавшиеся в метрополии, осознали свои пределы и присоединились к правительству чрезвычайного положения."
 FRA_prov_event.1.a:0 "Добро пожаловать, товарищи!"
 FRA_prov_event.3.t:0 "Великое восстание в Северной Африке, крах правительства чрезвычайного положения"
 FRA_prov_event.3.d:0 "\"Чрезвычайное положение\" и \"мобилизация\" были не более чем другой формой \"диктатуры\" и \"рабства\". Гордая \"Свобода, Равенство, Братство\" родины, которую мы помнили, никогда не могла стать девизом угнетателя.\n\nФранция будет запомнена как первая колониальная империя, разрушенная своими колонизованными. Сегодня французское правительство чрезвычайного положения рухнуло из-за массовой революции, возглавленной армиями независимости бесчисленных африканских племен — включая Алжир, Тунис и Марокко — и солдатами, сочувствующими их делу."
 FRA_prov_event.3.a:0 "Правительство должно осуществлять на практике то, чего все желают всеобщим образом. - Жан-Жак Руссо"
 FRA_prov_event.3.a_tt:0 "§RПравительство чрезвычайного положения, с его жестоким режимом, получило обратно бумеранг. Они заплатят соответствующую цену.§!"
 FRA_prov_event.4.t:0 "Перспективы североафриканской экономики"
 FRA_prov_event.4.d:0 "Если что-то и есть хорошее в несчастье, так это то, что французское правительство вкладывало значительные средства в промышленность Алжира на протяжении десятилетий. Этот регион сможет быстро индустриализироваться."
 FRA_prov_event.4.a:0 "Это было прозорливостью Карла X!"
 FRA_prov_event.5.t:0 "Реформа Туземного кодекса"
 FRA_prov_event.5.d:0 "Французский Туземный кодекс относится к совокупности дискриминационных законов, применяемых к коренным колониальным жителям. Согласно этим нормам, проводится различие между французскими гражданами и туземцами: последним не гарантируются права гражданства или голоса, и, кроме того, они подвергаются произвольным наказаниям и мобилизации на принудительные работы по решению администратора без суда. Чтобы успокоить всеобщую забастовку, мы предоставим им право на суд, ограниченное гражданство и ограничим произвольный призыв против них."
 FRA_prov_event.5.a:0 "Граждане второго сорта!"
 FRA_prov_event.6.t:0 "Оппозиция против военной диктатуры"
 FRA_prov_event.6.d:0 "Среди членов правящей коалиции в парламенте некоторые депутаты от \"Французской секции Рабочего интернационала (СФИО)\" и Французской коммунистической партии, последовавшие в изгнание, начали критиковать антидемократический захват власти [FRA_philippe_petain.getname]."
 FRA_prov_event.6.a:0 "Нечего долго думать. Заприте их всех!"
 FRA_custody:0 "§RЗаключение под стражу§!"
 FRA_prov_event.8.t:0 "Борьба за дипломатию"
 FRA_prov_event.8.d:0 "С момента решения Его Превосходительства [FRA_philippe_petain.getname] правительство [FRA.GetName] сосредоточилось на оправдании военного переворота и обеспечении легитимности преемственности предыдущему правительству. Хотя многие демократические страны выразили обеспокоенность нашими действиями, а коммунисты в метрополии отказались называть нас законным правительством, благодаря нашим усилиям на сегодняшний день международное сообщество считает нас законным французским правительством в изгнании."
 FRA_prov_event.8.a:0 "К счастью."
 FRA_prov_event.9.t:0 "Предложение Гранадской декларации"
 FRA_prov_event.9.d:0 "Правительство [FRA.getname] в настоящее время находится в изгнании из-за большевиков из другого мира, называемых [MIL.getname]. Сторона [FRA.getadjective] желает установить с нами отношения дипломатическо-военного сотрудничества, чтобы положить конец изгнанию и отвоевать метрополию. Поскольку северо-восточный регион родины [SPR.getadjective] также был узурпирован этими большевиками из другого мира, мы сможем получить выгоду, сотрудничая с ними."
 FRA_prov_event.9.a:0 "Вместе мы сильны!"
 FRA_prov_event.9.b:0 "Нам не нужна их помощь."
 FRA_prov_event.10.t:0 "Министр военной администрации"
 FRA_prov_event.10.d:0 "Правительство метрополии направило министра военной администрации для усиления контроля над колониями."
 FRA_prov_event.10.a:0 "Какая докука."
 FRA_prov_event.11.t:0 "Предложение [FRA.getadjective] присоединиться к экономическому блоку Юго-Восточной Азии"
 FRA_prov_event.11.d:0 "Министерство промышленности и экономики правительства [FRA.GetName] предложило, чтобы [THIS.getname] присоединился к экономическому блоку Юго-Восточной Азии, ядром которого является Индокитай. Франция фигурирует в этом сообществе только как наблюдатель, но поскольку голоса Вьетнама, Лаоса и Камбоджи — французских колоний — полностью под контролем Франции, на практике блок создан так, чтобы Франция действовала как председатель. Поэтому это сообщество частично включит экономику [THIS.getname] во французскую экономическую сферу. Однако инвестиции и передача технологий из Франции, а также взаимное сотрудничество внутри блока могут принести нам выгоды, которые компенсируют эти недостатки."
 FRA_prov_event.11.a:0 "Звучит заманчиво."
 FRA_prov_event.11.b:0 "Мы не попадемся на этот дешевый трюк."
 FRA_prov_event.12.t:0 "Выход [FROM.getadjective] из экономического блока Юго-Восточной Азии"
 FRA_prov_event.12.d:0 "Правительство [FROM.getname] уведомило о своем выходе из экономического блока, заявив, что он больше не является взаимовыгодным."
 FRA_prov_event.12.a:0 "Какая жалость."
 FRA_prov_event.13.t:0 "Принятие [FROM.getadjective]"
 FRA_prov_event.13.d:0 "[FROM.GetName] принял нашу просьбу."
 FRA_prov_event.13.a:0 "Они были благоразумны."
 FRA_prov_event.14.t:0 "Предложение [FRA.getadjective] торгового соглашения"
 FRA_prov_event.14.d:0 "Правительство [FRA.getname] предложило нам средиземноморское торговое соглашение, которое позволило бы ему торговать ресурсами по низкой цене в обмен на наши инвестиции."
 FRA_prov_event.14.a:0 "Это хорошая сделка."
 FRA_prov_event.14.b:0 "Нет необходимости."
 FRA_prov_event.15.t:0 "Разрыв [FROM.getadjective] средиземноморского торгового соглашения"
 FRA_prov_event.15.d:0 "Правительство [FROM.getname] разорвало свое торговое соглашение с нами."
 FRA_prov_event.15.a:0 "Это непросто."
 FRA_prov_event.16.t:0 "Принятие [SPR.getadjective]"
 FRA_prov_event.16.d:0 "Правительство [SPR.getname] полностью приняло декларацию, осью которой является укрепление наших дипломатическо-военных отношений, что окажет большую помощь в процессе отвоевания метрополии."
 FRA_prov_event.16.a:0 "Они надежные товарищи."
 FRA_prov_event.17.t:0 "Отказ [SPR.getadjective]"
 FRA_prov_event.17.d:0 "Правительство [SPR.getname] выразило вежливый отказ от Гранадской декларации."
 FRA_prov_event.17.a:0 "Они насмехаются над нами."
 FRA_prov_event.21.t:0 "Совместные военные учения [FRA.getadjective]-[SPR.getadjective]"
 FRA_prov_event.21.d:0 "Проведены совместные военные учения обеих армий против [MIL.getname] и [WHY.getname], сил, враждебных большевизму из другого мира."
 FRA_prov_event.21.a:0 "Пусть враги сдаются!"
 FRA_prov_event.20.t:0 "Договор о дружбе с Францией в изгнании"
 FRA_prov_event.20.d:0 "Как подписант Стрезского фронта, [FRA.getname] признает нашу средиземноморскую гегемонию и просит о более активном сотрудничестве для отвоевания метрополии. Если мы примем это, мы сможем расширить свою территорию без помех с их стороны."
 FRA_prov_event.20.a:0 "Наша дружба глубока."
 FRA_prov_event.20.b:0 "Нет необходимости сотрудничать с ними."
 FRA_prov_event.22.t:0 "Отказ [FROM.GetAdjective]"
 FRA_prov_event.22.d:0 "Правительство [FROM.getname] отклонило нашу просьбу."
 FRA_prov_event.22.a:0 "Какая жалость."
 FRA_prov_event.23.t:0 "Сотрудничество изгнанников [ITA.GetAdjective]"
 FRA_prov_event.23.d:0 "Благодаря сотрудничеству правительства [ITA.getName] все больше изгнанников пересекают границу, чтобы поддержать правительство в изгнании. Мы сможем использовать это как трамплин для ускорения приготовлений к отвоеванию."
 FRA_prov_event.23.a:0 "Спасибо."
 FRA_prov_event.24.t:0 "Запрос [FRA.getadjective] на инвестиции"
 FRA_prov_event.24.d:0 "Правительство [FRA.getname] запросило инвестиции у наших промышленников. Инвестировать в североафриканскую пустыню не сулит большой выгоды, но если мы будем активно инвестировать в регион Туниса, чтобы получить желаемую территорию, возможно, мы сможем потребовать Тунис в качестве компенсации, когда они отвоюют метрополию."
 FRA_prov_event.24.a:0 "Звучит заманчиво."
 FRA_prov_event.24.b:0 "Это бесполезная затея."
 FRA_prov_event.24_tt:0 "@FRA§Y[FRA.getadjective]§! после §4отвоевания метрополии§! сможет потребовать контроль над §Y[458.getname]§! и §Y[665.getname]§!."
 FRA_prov_event.25.t:0 "Инвестиции [ITA.GetAdjective]"
 FRA_prov_event.25.d:0 "Итальянские промышленники начали инвестировать в наш регион. Однако, возможно, ценой за это нам придется уступить им права на Тунис."
 FRA_prov_event.25.a:0 "Сиюминутная необходимость важнее."
 FRA_prov_event.26.t:0 "Строительство североафриканской автомагистрали"
 FRA_prov_event.26.d:0 "Правительство [FRA.getname] намеревается построить \"североафриканскую автомагистраль\" от Сеуты до Триполи в сотрудничестве с правительством [ITA.getName] и стороной [SPR.getname]. Это не более чем корыстный план для их промышленной базы в Северной Африке, но он также предлагает явные выгоды для нас."
 FRA_prov_event.26.a:0 "Это хорошее предложение."
 FRA_prov_event.26.b:0 "Не время подыгрывать им."
 FRA_prov_event.27.t:0 "Строительство автомагистрали стороной [FROM.getadjective]"
 FRA_prov_event.27.d:0 "К счастью, [FROM.getname] участвует вместе с нами в строительстве автомагистрали."
 FRA_prov_event.27.a:0 "Спасибо."
 FRA_prov_event.28.t:0 "Провал в метрополии"
 FRA_prov_event.28.d:0 "На нас напали в мирное время. Неожиданная Великая транспозиция из другого мира призвала десятки тысяч чужаков во французскую метрополию, и их передовые футуристические технологии подожгли Францию. Франция сопротивлялась, но захватчики были сильны, а правительство расколото. Исход после полного поражения был, теоретически, \"стратегическим отступлением\", но никто не осмеливается отрицать, что это был \"провал в метрополии\"."
 FRA_prov_event.28.a:0 "Что нам осталось?"
 FRA_prov_event.29.t:0 "Найдена точка соприкосновения"
 FRA_prov_event.29.d:0 "Мы получили решающие доказательства того, что всеобщая североафриканская забастовка была инспирирована Североафриканской ассоциацией рабочих и крестьян! Это заставит партию действовать более осторожно на забастовочном фронте."
 FRA_prov_event.29.a:0 "Красные агенты!"
 FRA_prov_event.29_tt:0 "\nОтныне увеличение £GFX_repairing §Yорганизации забастовки§! из-за £GFX_decision_icon_small §Y$FRA_PPNA_activation$§! снижено до §R5§!."
 FRA_prov_event.30.t:0 "Запрос [FRA.getadjective] на единый фронт"
 FRA_prov_event.30.d:0 "[FRA.GetName] запросил у правительства [ITA.getname] и правительства [ENG.getname] помощи в предстоящем решающем сражении за отвоевание метрополии. В частности, это означает, что когда армия [FRA.getadjective] будет осуществлять крупную высадку против врага, мы также направим пограничные силы для их поддержки. Для этого нам придется развернуть войска. Чтобы выполнить ранее подписанный \"Стрезский фронт\", было бы благоразумно помочь им."
 FRA_prov_event.30.a:0 "Поможем с удовольствием."
 FRA_prov_event.30.b:0 "Это слишком рискованно."
 FRA_prov_event.30_tt:0 "§gЭто будет большим подспорьем для Франции.§!"
 FRA_prov_event.31.t:0 "Принятие [FROM.getadjective]"
 FRA_prov_event.31.d:0 "Правительство [FROM.getname] приняло нашу просьбу."
 FRA_prov_event.32.t:0 "Перспективы Национального флота"
 FRA_prov_event.32.d:0 "Французский национальный флот восходит к Королевскому флоту кардинала Ришелье в XVII веке и с гордостью защищал океаны мира и заморские территории Франции. Однако, чтобы поддержать всю Францию во время Великой транспозиции, были мобилизованы почти все корабли, и вскоре им пришлось выполнять операцию по массовой переброске в Северную Африку. В результате корабли накопили усталость из-за перегрузки и принудительного использования, и вдобавок, из-за отсутствия обслуживающих мощностей, они временно пришвартованы в Северной Африке.\nЕсли в таком состоянии они подвергнутся вражеской атаке, французский флот понесет тяжелые потери. В настоящее время флот настоятельно настаивает на том, чтобы правительство приняло меры для решения этой проблемы. Если мы не примем меры в ближайшее время, военно-морская мощь резко ослабнет."
 FRA_prov_event.32.a:0 "Многое нужно сделать."
 FRA_prov_event.33.t:0 "Переговоры"
 FRA_prov_event.33.d:0 "Перед лицом наших мер забастовочные силы признают, что продолжать забастовку им больше не выгодно. Правительство направило делегацию и провело переговоры с руководством забастовочного комитета, пообещав гарантировать зарплату на период забастовки и выполнить согласованные требования. Забастовка скоро закончится."
 FRA_prov_event.33.a:0 "К счастью."
 FRA_prov_event.35.t:0 "Недовольство армии"
 FRA_prov_event.35.d:0 "Хотя это было решение самого [FRA_philippe_petain.getname], духовного столпа армии, многие в вооруженных силах испытывают скептицизм по поводу идеи отказа от французской гегемонии. Хотя [FRA_philippe_petain.getname] пока подавил это недовольство своим достоинством и авторитетом, все знают, что, в конце концов, он фигура, вознесенная временной военной комиссией... и это означает, что точно так же его смещение возможно и рукой армии."
 FRA_prov_event.35.a:0 "\"Все ради Республики.\""
 FRA_prov_event.35_tt:0 "\n§RОтныне всякий раз, когда возникнет недовольство армии, лидер должен будет взойти на эшафот.§!"
 FRA_prov_event.36.t:0 "Галифаксская конференция"
 FRA_prov_event.36.d:0 "В канадском городе Галифакс дипломаты [ENG.getname] и послы [FRA.getname] провели переговоры. Они обсудили восстановление военного союза, подобного Антанте в Великой войне, промышленное сотрудничество между регионами изгнания и взаимное сотрудничество в колониальной администрации."
 FRA_prov_event.36.a:0 "Да здравствует франко-британская дружба!"
 FRA_prov_event.37.t:0 "Галифаксская конференция"
 FRA_prov_event.37.a:0 "Вместе мы сильны!"
 FRA_prov_event.37.b:0 "Нам не нужна такая дипломатия."

 # 프랑스 뉴스 이벤트
 # id = 38 39 40 41 44 46 53 65 71 76
 # 는 전부 BA_news_l_english 으로 이사 갔습니다. 뉴스 이벤트는 따로 구분해주세요.. << 미안! -프랑스 모더
FRA_prov_event.45.c:0 "Поддержим восстановление колоний."

FRA_prov_event.47.t:0 "Французская социальная партия"
FRA_prov_event.47.d:0 "Правая группа ветеранов, знаменитая под именем \"Боевые кресты\" де ля Рока, организовала надпартийную paramilitary силу для отвоевания Алжира. Первоначально поддерживаемые европейскими колонистами в Алжире, теперь они действуют под названием \"Французская социальная партия\" и совершают террористические акты и прямые действия против антиправительственных движений, выступающих против французского господства в Алжире, даже вмешиваясь в общественный порядок по своему усмотрению. Они проправительственные, но могут в любой момент активировать свой внутренний механизм фашистского толка."
FRA_prov_event.47.a:0 "Они патриоты?"

FRA_prov_event.50.t:0 "Активность Народной партии"
FRA_prov_event.50.d:0 "При внешней поддержке сомнительного происхождения всеобщая забастовка реорганизует свою структуру."
FRA_prov_event.50.a:0 "Проклятье!"

FRA_prov_event.51.t:0 "Призрак"
FRA_prov_event.51.d:0 "Французская коммунистическая партия, продукт французского социалистического движения межвоенного периода, сохраняла ярко выраженный красный оттенок в политике; но после беспорядков 1934 года она взяла линию совместной борьбы с \"Французской секцией Рабочего интернационала (СФИО)\", заняв левое крыло Народного фронта. Однако при прохождении Великой транспозиции правительство и армия, в своей вопиющей некомпетентности, 'бросили' страну врагу, а социальные элиты, финансовые капиталисты, предприятия, политики и офицеры бежали в изгнание в Северную Африку. В отличие от них, Французская коммунистическая партия проявила солидарность с рабочими крупных городов, организовала Сопротивление против авторитарного режима [MIL.getadjective] и возглавила оппозиционное движение; и, в то же время, решительно выступает против реакционного правительства Франции в изгнании.\n\nВ этой ситуации североафриканское социалистическое движение организуется вокруг \"Всеобщей конфедерации труда (ВКТ)\", а не ФКП, которая сосредоточена на сопротивлении в метрополии. Они объединяют трудящиеся массы и рабочее движение в едином направлении и сплачивают массовое движение против правительства в изгнании, но также демонстрируют отсутствие внутреннего единства: североафриканские фракции независимости и французские реваншистские фракции противостоят друг другу."
FRA_prov_event.51.a:0 "Как бы то ни было, они будут под постоянным наблюдением."

FRA_prov_event.52.t:0 "Положение колониальной администрации"
FRA_prov_event.52.d:0 "После исхода французского правительства сопротивление против колониального господства усиливается по всей Африке. Наша колониальная администрация требует, прежде всего, гарантий безопасности, и более широкое военное вмешательство в протекторатах, таких как Марокко и Тунис, будет неизбежным."
FRA_prov_event.52.a:0 "Проведем операцию по стабилизации."

FRA_prov_event.53.t:0 "Ущерб флоту"
FRA_prov_event.53.d:0 "Повреждения, накопленные на кораблях, брошенных на долгое время, достигли точки, когда их эксплуатация невозможна. Мы должны отпустить корабли, которые больше нельзя использовать."
FRA_prov_event.53.a:0 "Проклятье."

FRA_prov_event.54.t:0 "Вооруженное восстание в горах"
FRA_prov_event.54.d:0 "По мере того как антиправительственная активность в городских районах значительно ослабла, основные движения антиколониального сопротивления смещаются в горные регионы. Там они ведут партизанскую войну, становясь огромной головной болью для наших сил безопасности и регулярной армии."
FRA_prov_event.54.a:0 "Тараканы!"

FRA_prov_event.55.t:0 "Предложение отклонено"
FRA_prov_event.55.d:0 "[FROM.GetName] отклонил нашу просьбу."
FRA_prov_event.55.a:0 "Какая жалость."

FRA_prov_event.56.t:0 "Предложение Франции"
FRA_prov_event.56.d:0 "Франция попросила нас, когда она будет проводить операцию по отвоеванию, разрешить ей пересечь нашу границу для атаки. Если мы поможем им, мы сможем оказывать влияние на них после того, как они восстановят метрополию."
FRA_prov_event.56.a:0 "Поможем им."
FRA_prov_event.56.b:0 "Франции нельзя доверять."

FRA_prov_event.57.t:0 "Изгнанники"
FRA_prov_event.57.d:0 "Многочисленные французы, потерпевшие поражение в метрополии, прибывают в изгнание в Северную Африку. Они представляют собой огромную нагрузку на нашу экономику и общество, и мы должны придумать способ их принять."
FRA_prov_event.57.a:0 "Какая докука."

FRA_prov_event.58.t:0 "Исход Сопротивления"
FRA_prov_event.58.d:0 "Местные французы, сопротивлявшиеся в метрополии или недовольные нашим правительством, пересекли границу в Северную Африку."
FRA_prov_event.58.a:0 "Пусть делают, что хотят."
FRA_prov_event.58.b:0 "Не докладывай мне больше об этих вещах!"

FRA_prov_event.59.t:0 "Требование Францией прав на стоянку"

FRA_prov_event.60.t:0 "Предложение принято"
FRA_prov_event.60.d:0 "[FROM.GetName] принял нашу просьбу о помощи."
FRA_prov_event.60.a:0 "Большое спасибо."

FRA_prov_event.61.t:0 "Роль Министерства колоний"
FRA_prov_event.61.d:0 "С крахом административной сети метрополии и нестабильностью правительства из-за переворота администрация во многих колониальных секторах не функционирует должным образом. Поэтому необходимо расширить автономию Министерства колоний для восстановления и укрепления колониальной администрации.\nНекоторые утверждают, что, чтобы избежать краха Французской колониальной империи, Министерство колоний должно иметь возможность более жестко и срочно осуществлять военное командование для местной безопасности. Однако эти меры могут привести к чрезмерному расширению его власти и, в долгосрочной перспективе, стать искрой для движений антиколониального сопротивления.\nС другой стороны, парламентарии выступают против обоих предложений, считая, что администрация через Министерство колоний является продолжением отхода от демократического порядка и системы сдержек и противовесов."
FRA_prov_event.61.a:0 "Расширим автономию Министерства колоний."
FRA_prov_event.61.b:0 "Их нужно вооружить."
FRA_prov_event.61_tt:0 "Все государства §YФранцузской Западной Африки§!:\n"
FRA_prov_event.61_tt_1:0 "Все государства §YФранцузской Экваториальной Африки§!:\n"

FRA_prov_event.62.t:0 "Путь военной реформы"
FRA_prov_event.62.d:0 "Катастрофическое поражение 1935 года в метрополии оставило нам множество военных уроков. Прежде всего, мы вспоминаем, как мощная механическая инженерия существ из другого мира безжалостно уничтожала французских солдат. Кроме того, враги с ореолом не могли быть эффективно атакованы обычными пулями. В этой среде традиционная тактика 'оборонять траншею, а затем контратаковать' лишь давала им время перегруппировать свои линии и выявить наши слабости. В предстоящей военной реформе необходимо будет принять тактику, решающую эти проблемы.\n\nДругой военный вызов заключается в том, что из-за географических препятствий операция по отвоеванию требует высадки десанта. К счастью, в битве при Галлиполи мы получили большое понимание крупномасштабных десантов. Предметом спора было: сосредоточить ли огонь в одной точке или осуществить массовую высадку в самом крупном опорном пункте, чтобы дать решающее сражение в метрополии.\n\nТем временем [FRA_charles_de_gaulle.getname] и его сторонники подчеркивают историческую победу 'Осады Эриду' на окраинах Парижа, достигнутую в разгроме. Тогда [FRA_charles_de_gaulle.getname], основываясь на доктрине маневренной войны, использовал бронетанковые дивизии, чтобы полностью разрушить второй опорный пункт врага; эта критическая победа позволила правительству продержаться еще месяц. Поэтому они желают сформировать мобильные силы и вести маневренную войну при отвоевании. Проблема, однако, в самом производстве бронетанковых дивизий."
FRA_prov_event.62.a:0 "Это эра военных потрясений."

FRA_prov_event.63.t:0 "Продажа линкора [FRA.getadjective]"
FRA_prov_event.63.d:0 "Правительство [FRA.getadjective] предложило нам купить линкор."
FRA_prov_event.63.a:0 "Это хорошее предложение."
FRA_prov_event.63.b:0 "У нас нет возможностей."
FRA_prov_event.63_tt:0 "Передать §Y1 линкор§! [PREV.getflag][PREV.getadjective]"

FRA_prov_event.64.t:0 "Покупка линкора [FROM.getadjective]"
FRA_prov_event.64.d:0 "Возможно, из-за дешевизны, по которой мы его продали, [FROM.getname] с удовольствием купил наш линкор."
FRA_prov_event.64.a:0 "Все необходимо."

FRA_prov_event.65.t:0 "Отказ от покупки линкора [FROM.getadjective]"
FRA_prov_event.65.d:0 "[FROM.getname] отклонил наше предложение о покупке."
FRA_prov_event.65.a:0 "Какая жалость."

FRA_prov_event.66.t:0 "Давление"
FRA_prov_event.66.d:0 "Французский парламент и премьер-министр Пьер Лаваль отстранили Филиппа Петена от французской политики, ссылаясь на экономический спад, трудовой кризис, потерю международного престижа и коллапс.\n\nПосле принудительного отстранения Филиппа Петена Пьер Лаваль официально объявил в речи о конце правительства Петена.\n\n\"В такой чрезвычайной ситуации, как нынешняя, не существует такого понятия, как герой. Мы должны следовать гражданской власти, избранной народом. До сегодняшнего дня Петен возвеличивал себя посредством жестокого и неприемлемого угнетения, и его правительство заставляло народ день за днем влачить жалкое существование. Наш парламент сумел заставить [FRA_philippe_petain.getname] уйти в отставку, и Франция снова будет справедливой!\""
FRA_prov_event.66.a:0 "Он должен ответить."

FRA_prov_event.67.d:0 "Протесты, переросшие в беспорядки, распространились по всей территории правительства чрезвычайного положения. Пан-африканская группа красного террора под названием \"Народный фронт освобождения Африки\" штурмовала офис Петена и провозгласила освобождение Африки."
FRA_prov_event.67.a:0 "Я здесь еще ничего не сделал, извините."

FRA_prov_event.68.t:0 "Итальянское влияние"
FRA_prov_event.68.d:0 "Ценой за помощь в войне за отвоевание Италия потребовала поддержки военной промышленности и постоянного признания суверенитета над [735.getname] и [1093.getname]."
FRA_prov_event.68.a:0 "Без них мы были бы бессильны."

FRA_prov_event.69.t:0 "Деколонизация"
FRA_prov_event.69.d:0 "Мы освободим все наши колонии. Однако, в соответствии с интернационалистскими принципами, мы также продолжим солидарность с ними."
FRA_prov_event.69.a:0 "Да здравствует социализм!"
FRA_prov_event.69_tt:0 "§tМы освободим или вернем все колонии, которыми мы несправедливо владели.§!"

FRA_prov_event.70.t:0 "Выборы"
FRA_prov_event.70.d:0 "С уходом [FRA_philippe_petain.getname] французский парламент восстановил свою законную власть как конституционный институт, сформированный народом. Однако мы должны провести выборы, которые не могли проводиться годами. Народный фронт, антифашистский блок, объединенный под единым делом, представляет собой коалицию французских левых партий, ставящих во главу угла общественное благо или обобществление. Напротив, Национальное объединение, сформированное широкой коалицией правых партий для предотвращения прихода левых к власти, стремится защищать французские ценности и восстановить славу Франции. Обе силы борются яростно, но народ должен выбрать только одну."
FRA_prov_event.70.a:0 "Победа Национального объединения!"
FRA_prov_event.70.b:0 "Народный фронт взял власть!"

FRA_prov_event.72.t:0 "Обращение со студентами"
FRA_prov_event.72.d:0 "После подавления всего значительного сопротивления студентов большинство студентов из другого мира заключены в тюрьму. Если мы их ликвидируем, мы сможем способствовать стабильности Франции и мира. Но, поскольку они тоже люди, мы могли бы предоставить им суд. Если состоится суд, поскольку большинство из них — подростки, они будут отправлены в исправительные учреждения."
FRA_prov_event.72.a:0 "Казнить их."
FRA_prov_event.72.b:0 "Проведем суд."

FRA_prov_event.73.t:0 "Выбор места для Эйфелевой башни"
FRA_prov_event.73.d:0 "Поскольку Башня Тысячелетия была построена на месте старой Эйфелевой башни, мы должны выбрать место для новой Эйфелевой башни. В разгар этих дебатов алжирцы, помогавшие нашему возвращению, желают перенести Эйфелеву башню в Алжир. Если мы примем их просьбу, они, несомненно, будут более лояльны к Франции."
FRA_prov_event.73.a:0 "Постройте ее рядом с Башней Тысячелетия."
FRA_prov_event.73.c:0 "Зачем восстанавливать пережиток старой эпохи?"

FRA_prov_event.74.t:0 "Эйфелева башня построена!"
FRA_prov_event.74.d:0 "Эйфелева башня завершена."
FRA_prov_event.74.a:0 "Да здравствует Франция!"

FRA_prov_event.75.t:0 "Решение Маршала"
FRA_prov_event.75.d:0 "Пока восстановление начинает налаживаться, военные фракции предложили Петену сформировать 'временную' олигархическую систему для обеспечения стабильности Франции и отвоевания территории."
FRA_prov_event.75.a:0 "Франция все еще нуждается в Петене."
FRA_prov_event.75.b:0 "Моя миссия окончена."

FRA_prov_event.77.t:0 "Всеобщая забастовка во Франции!"
FRA_prov_event.77.d:0 "Во Франции вспыхнула организованная всеобщая забастовка. Генераторы остановлены, фабрики не производят. Магазины закрыты, и многочисленные рабочие организации маршируют к кампусу!"
FRA_prov_event.77.a:0 "Проклятье."
FRA_prov_event.77_tt:0 "\nЕсли война во французской метрополии не закончится в течение §Y360 дней§!, лидеры обеих стран начнут мирные переговоры."

FRA_prov_event.78.t:0 "Управление Башней Тысячелетия"
FRA_prov_event.78.d:0 "Башня Тысячелетия перешла в наши руки. Мы должны решить, что с ней делать."
FRA_prov_event.78.a:0 "Используем ее как административное здание."
FRA_prov_event.78.b:0 "Она будет идеальна как исследовательский институт."
FRA_prov_event.78.c:0 "Мы не можем оставлять остатки французского кризиса."
FRA_prov_event.78.e:0 "Используем как жилье."
FRA_prov_event.76_tt:0 "§tВариант доступен при коммунистическом режиме.§!"

FRA_prov_event.79.t:0 "Транспортная инфраструктура"
FRA_prov_event.79.d:0 "Мы приобрели технологию, необходимую для современной транспортной инфраструктуры."
FRA_prov_event.79.a:0 "Сосредоточимся на метрополии."
FRA_prov_event.79.b:0 "Установите ее на всех территориях."

FRA_prov_event.80.t:0 "Инженерная технология"
FRA_prov_event.80.d:0 "Исследование инженерной технологии другого мира завершено. Теперь мы применим ее в реальных областях."
FRA_prov_event.80.a:0 "Это инновация."

FRA_prov_event.81.t:0 "Электрическая технология обеспечена"
FRA_prov_event.81.d:0 "Поскольку даже в другом мире использовались различные устройства на основе электричества, мы тщательно проанализировали их электрическую технологию. В результате мы смогли приобрести превосходную электрическую технологию."
FRA_prov_event.81.a:0 "Промышленность получит дальнейшее развитие."

FRA_prov_event.82.t:0 "Механические устройства проанализированы"
FRA_prov_event.82.d:0 "Мы тщательно проанализировали механические устройства другого мира и, благодаря этому, получили различные инженерные знания."
FRA_prov_event.82.a:0 "Используем это на транспорте."
FRA_prov_event.82.b:0 "А если применить это в военной промышленности?"

FRA_prov_event.83.t:0 "Контроль линий связи"
FRA_prov_event.83.d:0 "Мы взяли под контроль линии связи другого мира и завершили их исследование."
FRA_prov_event.83.a:0 "Теперь вся страна может общаться в реальном времени."

FRA_prov_event.84.t:0 "Автоматизированные процессы"
FRA_prov_event.84.d:0 "Нам удалось получить и усвоить технологию автоматизации от студентов из другого мира, называемых 'Миллениум'. Мы применим ее в первую очередь в производственном секторе."
FRA_prov_event.84.a:0 "Тогда отправим всех безработных в армию."

FRA_prov_event.85.t:0 "Производство роботов"
FRA_prov_event.85.d:0 "После настойчивых исследований нам удалось производить боевых роботов."
FRA_prov_event.85.a:0 "Немедленно разверните их!"

FRA_prov_event.87.t:0 "Утечка технологии Миллениума"
FRA_prov_event.87.d:0 "Организация Сопротивления, продолжающая борьбу в метрополии, проникла в лабораторию Центрального округа Миллениума и получила часть его технологии."
FRA_prov_event.87.a:0 "Впечатляет."

FRA_prov_event.88.t:0 "Обеспечение промышленными инструментами"
FRA_prov_event.88.d:0 "Пока продолжалось сопротивление на нашем северо-востоке метрополии, Сопротивление отправило в метрополию различные промышленные инструменты, которые оно обеспечило."
FRA_prov_event.88.a:0 "Полезно."

FRA_prov_event.89.t:0 "Массовое подавление Сопротивления"
FRA_prov_event.89.d:0 "Некоторые участники Сопротивления, спасаясь от общенационального подавления Миллениума, решили оставить борьбу и отправиться в изгнание, присоединившись к Северной Африке."
FRA_prov_event.89.a:0 "Они будут очень полезны."
FRA_prov_event.89_tt:0 "\n§YИнтенсивность сопротивления§! в метрополии §Rснизилась§!."

FRA_prov_event.90.t:0 "Дезертирство из Сопротивления"
FRA_prov_event.90.d:0 "Некоторые участники организаций сопротивления, спасаясь от общенационального подавления, оставили борьбу и отправились в изгнание в Северную Африку."
FRA_prov_event.90.a:0 "Никогда не возвращайтесь!"

FRA_prov_event.91.t:0 "Железная дорога завершена"
FRA_prov_event.91.d:0 "Железная дорога, пересекающая Сахару, успешно завершена."
FRA_prov_event.91.a:0 "Индустриализация Западной Африки не за горами."

FRA_prov_event.92.t:0 "Железнодорожный бум"
FRA_prov_event.92.d:0 "Тысячи предметов и припасов грузятся на поезд для пересечения Сахары между Западной Африкой и Северной Африкой. Строительство Транссахарской железной дороги было успешным, и мы сможем ускорить индустриализацию."
FRA_prov_event.92.a:0 "Это была правильная политика."
FRA_prov_event.92_tt:0 "\nЕсли была завершена §Yмодернизация Транссахарской железной дороги§!, достигается лучший эффект."
FRA_prov_event.92_tt_1:0 "\nЛучший эффект достигается при завершении §Yмодернизации Транссахарской железной дороги§!."

FRA_prov_event.93.t:0 "Сопротивление студентов"
FRA_prov_event.93.d:0 "Студенческие силы из другого мира, все еще остающиеся в отвоеванной метрополии, продолжают сопротивляться нашему правительству."
FRA_prov_event.93.a:0 "Какая докука."

FRA_prov_event.94.t:0 "Конец всеобщей североафриканской забастовки"
FRA_prov_event.94.d:0 "Благодаря усилиям нашего правительства руководство забастовочного комитета решило распуститься и положить конец забастовке. Дым снова поднимается над фабриками, и корабли снова швартуются в доках."
FRA_prov_event.94.a:0 "К счастью."

FRA_prov_event.95.t:0 "Дипломатия на Ближнем Востоке"
FRA_prov_event.95.d:0 "После полного поражения Соединенного Королевства от другого мира Ближний Восток освободился от империалистического кулака и завоевал свою независимость. Мы не можем этого принять. Мы должны снова вручить им светоч цивилизации. Но мы не должны упускать из виду, что для этого существует несколько методов."
FRA_prov_event.95.a:0 "Координация с ними необходима для нашей большой стратегии."
FRA_prov_event.95.b:0 "Это возвращение империи, арабы!"

FRA_prov_event.96.t:0 "Требования Франции"
FRA_prov_event.96.d:0 "Французский посол потребовал от нас подчинения и сказал, что также будет серьезно рассмотрено применение силы для навязывания требования."
FRA_prov_event.96.a:0 "Примем их требования."
FRA_prov_event.96.b:0 "Мы никогда не сможем им подчиниться!"

FRA_prov_event.97.t:0 "Принятие Швейцарией"
FRA_prov_event.97.d:0 "Швейцария подчинилась нам."
FRA_prov_event.97.a:0 "Мудрый выбор."

FRA_prov_event.98.t:0 "Отказ Швейцарии"
FRA_prov_event.98.d:0 "Швейцария отклонила нашу просьбу."
FRA_prov_event.98.a:0 "Сила иногда является лучшим средством."

FRA_prov_event.99.t:0 "Сайгонское соглашение"
FRA_prov_event.99.d:0 "Становится очевидным, что мы больше не можем удерживать Индокитай. Мы откажемся от колонии путем организованного вывода, максимально сохраняя наши интересы."
FRA_prov_event.99.a:0 "Это правильно."

FRA_prov_event.100.t:0 "Совет Сопротивления"
FRA_prov_event.100.d:0 "Внутри Франции гордый французский народ продолжает сопротивляться угнетению существ из другого мира. Основные политические силы, которые их объединяют, — две: с одной стороны, коммунисты, организовавшие сопротивление вокруг городов; с другой, фашисты, основанные на католическом чувстве и сельских общинах. Однако коммунисты демонстрируют сильную сплоченность вокруг Французской коммунистической партии и СФИО, в то время как фашисты представляют собой лишь изолированные очаги сопротивления из-за proliferation фашистских организаций.\n\nМы сможем использовать их для поддержания влияния в метрополии."
FRA_prov_event.100.a:0 "Они надежны."

FRA_prov_event.101.t:0 "Управление студентами"
FRA_prov_event.101.d:0 "Студенты, все еще остающиеся на юге Франции, угрожают общественному порядку и социальной безопасности и в любой момент могут стать приспешниками Миллениума. Если мы установим над ними жесткий контроль, мы сможем устранить риск заранее."
FRA_prov_event.101.a:0 "Да. Уничтожьте их всех."
FRA_prov_event.101.b:0 "Достаточно просто заключить их в тюрьму."

FRA_prov_event.102.t:0 "Французская морская блокада"
FRA_prov_event.102.d:0 "Французский флот блокировал наши морские торговые пути."
FRA_prov_event.102.a:0 "Как трусливо."

FRA_prov_event.103.t:0 "Победа в пограничном конфликте"
FRA_prov_event.103.d:0 "Мы твердо отбили врага."
FRA_prov_event.103.a:0 "Ура!"

FRA_prov_event.104.t:0 "Поражение в пограничном конфликте"
FRA_prov_event.104.d:0 "Мы временно отошли из спорной зоны. Но это никоим образом не означает полного поражения."
FRA_prov_event.104.a:0 "Ну и ну..."

FRA_prov_event.105.t:0 "Холодная ночь"
FRA_prov_event.105.d:0 "Умеренные наконец полностью изгнали радикалов из военного правительства."
FRA_prov_event.105.a:0 "Наступила стабильность."

FRA_prov_event.106.t:0 "Холодная ночь"
FRA_prov_event.106.d:0 "Радикалы, изгнав [ROOT.GetLeader], закрепили твердое преимущество внутри военного правительства."
FRA_prov_event.106.a:0 "Вперед!"

FRA_prov_event.107.t:0 "Конференция в Виши"
FRA_prov_event.107.d:0 "Мы проведем дипломатические переговоры с Миллениумом в Виши. Наша делегация запросит пакт о ненападении и взаимный обмен."
FRA_prov_event.107.a:0 "Они прибыли."

FRA_prov_event.108.t:0 "Конференция в Виши"
FRA_prov_event.108.d:0 "По просьбе Франции мы провели в Виши встречу с ее делегацией. Они выразили желание ослабить конфронтацию и, более того, полностью ее устранить: они хотят взаимного сосуществования между Миллениумом и Францией, запрашивая пакт о ненападении и обмены между ними."
FRA_prov_event.108.a:0 "Дальнейшая конфронтация не выгодна никому."
FRA_prov_event.108.b:0 "Нет, разговаривать с ними — пустая трата времени."

FRA_prov_event.109.t:0 "Принятие Миллениумом"
FRA_prov_event.109.d:0 "Миллениум принял нашу просьбу."
FRA_prov_event.109.a:0 "Это начало мира."

FRA_prov_event.110.t:0 "Отказ Миллениума"
FRA_prov_event.110.d:0 "Делегация Миллениума отклонила нашу просьбу."
FRA_prov_event.110.a:0 "Мы бессильны."

FRA_prov_event.111.t:0 "Запрос о присоединении к Антанте"
FRA_prov_event.111.d:0 "После освобождения Франции Франция пригласила нас в твердый фронт для освобождения всей Европы от сущностей другого мира. Присоединившись к Антанте, мы сможем обеспечить солидарность и развитие в безопасности, экономике и обществе."
FRA_prov_event.111.a:0 "Нравится нам это или нет, лучше всего сотрудничать с ними."
FRA_prov_event.111.b:0 "Сотрудничать с ними не кажется хорошей идеей."

FRA_prov_event.112.t:0 "Соглашение Антанты об экономическом развитии"
FRA_prov_event.112.d:0 "Антанта предложила нам участвовать в соглашении об экономическом развитии."
FRA_prov_event.112.a:0 "Примем их помощь."
FRA_prov_event.112.b:0 "Только самостоятельная экономика имеет смысл."

FRA_prov_event.113.t:0 "Орган Антанты по отвоеванию"
FRA_prov_event.113.d:0 "Антанта предложила нам присоединиться к органу по отвоеванию."
FRA_prov_event.113.a:0 "Военная координация с ними имеет смысл."
FRA_prov_event.113.b:0 "Еще рано."

FRA_prov_event.114.t:0 "Сделка с колониальными жителями"
FRA_prov_event.114.d:0 "Мы решили разрешить им обрести независимость, если они будут участвовать в отвоевании метрополии и старательно следовать инструкциям правительства."
FRA_prov_event.114.a:0 "Смотрите на Средиземное море!"
FRA_prov_event.114.b:0 "Но мы уже завершили деколонизацию."

FRA_prov_event.115.t:0 "Выполнение обещания"
FRA_prov_event.115.d:0 "Мы должны выполнить обещание, данное колониальным жителям около трех лет назад."
FRA_prov_event.115.a:0 "Выполним наше обещание."
FRA_prov_event.115.b:0 "Для независимости еще рано. Обязательство созданием автономных регионов."
FRA_prov_event.115.c:0 "Это обещание было неизбежным. Франция все еще сохраняет право собственности на регионы!"
FRA_prov_event.115.e:0 "Проведите референдум о том, присоединятся ли они к Французскому Союзу."

FRA_prov_event.117.t:0 "Изолированный Индокитай"
FRA_prov_event.117.d:0 "Поражение Соединенного Королевства и усиление японской гегемонии в Восточной Азии быстро ослабляют наши связи с колониями. С другой стороны, в Индокитае Индокитайская коммунистическая партия, возглавляемая силами независимости и социалистами, набирает силу. Мы должны сдержать их."
FRA_prov_event.117.a:0 "Проклятье."
FRA_prov_event.117_tt:0 "§YКолониальные правительства§! могут посредством §Yподходов§! быть §Gлояльны§! §YФранции§! или §Yначать§! §Rвойну за независимость§!. §RВойна за независимость§! §Yзакончится§!, если §YФранция§! потеряет §Yконтроль§! над §Yвсем Индокитаем§!."

FRA_prov_event.120.t:0 "Государственный переворот"
FRA_prov_event.120.d:0 "После отчаянного поражения в метрополии кабинет погружен в глубочайшее чувство поражения. Армия объявила 'временное' военное правительство до возвращения всей Франции, ссылаясь на некомпетентность кабинета во время войны, а также на отсутствие прогресса после изгнания и раскол текущего кабинета. [FRA_philippe_petain.getname] был возведен в должность председателя Временной военной комиссии и после месяца подготовки объявил о систематической реорганизации кабинета в военное правительство."
FRA_prov_event.120.a:0 "¡[FRA_philippe_petain.getname] dirige Francia!"

FRA_prov_event.121.t:0 "Терроризм"
FRA_prov_event.121.d:0 "По мере увеличения числа изгнанников французское правительство начало сносить существующие алжирские поселения и строить жилье для изгнанников. Это вызвало огромный гнев среди алжирцев и привело к некоторым террористическим актам, создав ощущение кризиса безопасности."
FRA_prov_event.121.a:0 "Увеличьте штат полиции!"

FRA_prov_event.122.t:0 "Некачественные работы"
FRA_prov_event.122.d:0 "Беспрестанно подгонять и эксплуатировать рабочих никогда не означало эффективности. Падение производительности и потеря мотивации привели к снижению качества: в центре Алжира были обнаружены многочисленные дефектные дороги и здания, и правительство было вынуждено принять временные меры."
FRA_prov_event.122.a:0 "Это всего лишь мелкая проблема."

FRA_prov_event.123.t:0 "Выплата по облигациям"
FRA_prov_event.123.d:0 "Приняв решение выплатить по облигациям обороны, мы должны выполнить наши долговые обязательства."
FRA_prov_event.123.a:0 "У каждой сделки есть своя цена."

FRA_prov_event.124.t:0 "Дополнительное изгнание"
FRA_prov_event.124.d:0 "Молодые люди из юго-восточной метрополии, ближайшей к правительству в изгнании, присоединяются к нашей армии, чтобы поддержать дело."
FRA_prov_event.124.a:0 "Хорошо."

FRA_prov_event.125.t:0 "Отсрочка обещания"
FRA_prov_event.125.d:0 "Пока продолжается война, мы должны немного отложить наше обещание колониальным жителям. Однако, чем чаще это повторяется, тем сильнее будут их протесты."
FRA_prov_event.125_tt:0 "\nТерпение колониальных жителей не безгранично. После этого выбора можно отложить еще §Y[?FRA_promise_var]§! раз."
FRA_prov_event.125.a:0 "Они тоже поймут."
FRA_prov_event.125.b:0 "Минуточку… сколько раз мы уже откладывали?"

FRA_prov_event.126.t:0 "Стрезский фронт"
FRA_prov_event.126.d:0 "Из-за вторжения сущностей из другого мира Республика, Соединенное Королевство и Италия были вынуждены подписать Стрезский фронт. Но поскольку Республика сейчас в изгнании, чтобы сохранить союз с Италией, мы должны принять их требования. Поэтому Петен и военное правительство решили не комментировать размещение итальянской армии в Ницце и Савойе."
FRA_prov_event.126.a:0 "Это неизбежный выбор."

FRA_prov_event.127.t:0 "Теневая экономика рухнула"
FRA_prov_event.127.d:0 "Из-за новой экономической политики, проводимой Миллениумом, поддерживать крупномасштабную теневую экономику больше невозможно. Соответственно, правительство решило постепенно выходить из бизнеса, связанного с теневой экономикой."
FRA_prov_event.127.a:0 "Как жаль."

FRA_prov_event.128.t:0 "Теневая экономика рухнула"
FRA_prov_event.128.d:0 "Благодаря новой политике, которую мы проводим, экономика академического дна не выдержала изменений и рухнула. В результате мы смогли контролировать экономику всей академии."
FRA_prov_event.128.a:0 "Как раз вовремя, хорошие новости."

FRA_prov_event.129.t:0 "Запрос Франции на инвестиции"
FRA_prov_event.129.d:0 "Французский посол запросил у нас инвестиции."
FRA_prov_event.129.a:0 "Инвестируем в них."
FRA_prov_event.129.b:0 "Мы не можем им доверять."

FRA_prov_event.130.t:0 "Принятие [FROM.getname]"
FRA_prov_event.130.d:0 "Посол [FROM.getname] принял нашу просьбу об инвестициях."
FRA_prov_event.130.a:0 "Большое спасибо."

FRA_prov_event.131.t:0 "Отказ [FROM.getname]"
FRA_prov_event.131.d:0 "Посол [FROM.getname] отклонил нашу просьбу об инвестициях."
FRA_prov_event.131.a:0 "Разочаровывает."

FRA_prov_event.133.t:0 "Ресоциализация завершена"
FRA_prov_event.133.d:0 "Программа ресоциализации, направленная на бывших студентов Миллениума, завершена. Мы сможем повторно использовать послушную часть перевоспитанных студентов в качестве офицеров."
FRA_prov_event.133.a:0 "Именно так, как мы планировали."

FRA_prov_event.134.t:0 "Подъем фашизма"
FRA_prov_event.134.d:0 "Победа Национального объединения на выборах подтвердила, что фашистские силы пользуются народной поддержкой. В этом контексте три течения, лидирующие во французском фашизме, до сих пор чередовали сотрудничество и конкуренцию между собой, но они больше не смогут поддерживать первое. Кто полностью возглавит это фашистское движение — это решит только меняющийся политический ландшафт — и Бог."
FRA_prov_event.134.a:0 "Только вера и гармония изменят Францию."
FRA_prov_event.134.b:0 "Вспомни былую славу!"
FRA_prov_event.134.c:0 "Успех фашизма должен следовать прецеденту."

FRA_prov_event.135.t:0 "Массовая мобилизация"
FRA_prov_event.135.d:0 "Независимо от насилия, сотни и тысячи молодых людей ежедневно выходят на улицы, повторяя протесты и беспорядки. В разгаре этого непрерывного хаоса, чтобы обрести фашистскую гегемонию, мы должны учитывать, какие массы были мобилизованы в наибольшем количестве."
FRA_prov_event.135.a:0 "Ветераны и солдаты"
FRA_prov_event.135.b:0 "Кажется, монархисты самые многочисленные."
FRA_prov_event.135.c:0 "Посмотри на тысячи рабочих!"

FRA_prov_event.136.t:0 "Пропаганда и политическая повестка"
FRA_prov_event.136.d:0 "Город охвачен звуками листовок и громкоговорителей. Это потому, что все французские фашисты бросились в пропаганду с убеждением, что если не сейчас, то возможности не будет. И все же, поскольку ключевая политическая повестка различается по фракциям, мы должны выяснить, какая тема привлекает больше внимания людей."
FRA_prov_event.136.a:0 "Без Бога индивид не существует."
FRA_prov_event.136.b:0 "Монархическая реставрация укрепляет Францию."
FRA_prov_event.136.c:0 "Только класс и труд могут решить реальные проблемы."

FRA_prov_event.137.t:0 "Ядро парламентаризма"
FRA_prov_event.137.d:0 "Мы собрали достаточно поддержки и возможностей. Осталось только открыто противостоять парламентаризму. Теперь важно лишь то, какая сила первой выведет массы на улицу."
FRA_prov_event.137.a:0 "Боевые кресты!"
FRA_prov_event.137.b:0 "Французское действие действует, как и подобает его имени!"
FRA_prov_event.137.c:0 "Франсистское движение вышло!"

FRA_prov_event.138.t:0 "Рассвет"
FRA_prov_event.138.d:0 "Повторяющаяся борьба за власть, достигая момента передачи фашистского режима, рассеивает свой туман. Одна фракция подавит две другие и возглавит французский фашизм. Однако это не означает исчезновения других фашистских фракций. Французские фашисты все еще могут сотрудничать друг с другом, и ситуация всегда может измениться."
FRA_prov_event.138.a:0 "Боевые кресты ведут Францию!"
FRA_prov_event.138.b:0 "Да здравствует Французское действие и король Франции!"
FRA_prov_event.138.c:0 "Будьте верны франсистскому движению и ортодоксальному фашизму!"

FRA_prov_event.139.t:0 "Пыл"
FRA_prov_event.139.d:0 "Хотя Французская коммунистическая партия находится в изгнании, она осуществила столь же радикальную, сколь и передовую трансформацию. Теперь уже недостаточно просто меняться: нужно строить."
FRA_prov_event.139.a:0 "Инвестируем в оборону."
FRA_prov_event.139.b:0 "Укрепим промышленность."

FRA_prov_event.140.t:0 "Теневая экономика"
FRA_prov_event.140.d:0 "Пока мы не могли коснуться экономики, кажется, французы построили во всей экономике огромную невидимую систему, направленную на отвоевание. Позже это нужно будет пересмотреть."
FRA_prov_event.140.a:0 "Проблематично."

FRA_prov_event.141.t:0 "Капиталисты бегут!"
FRA_prov_event.141.d:0 "Многие капиталисты на оккупированных территориях бегут из Миллениума, чтобы поддержать [FRA.GetName]."
FRA_prov_event.141.a:0 "Производство пострадает."

FRA_prov_event.142.t:0 "Мирное предложение Франции"
FRA_prov_event.142.d:0 "Франция запросила прекращение огня в обмен на передачу Корсики Италии на постоянной основе."
FRA_prov_event.142.a:0 "Наконец-то Корсика вернулась в объятия родины!"
FRA_prov_event.142.b:0 "Они также должны уступить Тунис!"

FRA_prov_event.143.t:0 "[ITA.getName] требует Тунис"
FRA_prov_event.143.d:0 "[ITA.getName] сообщил нам, что для полного прекращения огня они должны получить контроль над регионом Туниса."
FRA_prov_event.143.a:0 "Мы не можем принять их требования."
FRA_prov_event.143.b:0 "Ситуация критическая. Примем их требования."

FRA_prov_event.144.t:0 "Отказ Франции"
FRA_prov_event.144.d:0 "Франция отказалась передать контроль над Тунисом."
FRA_prov_event.144.a:0 "Они не знают цены мира."
FRA_prov_event.144.b:0 "Мы не можем понять их требования."

FRA_prov_event.145.a:0 "Adieu pour toujours, Millenium.\n(Прощай навсегда, Миллениум.)"
FRA_prov_event.145.t:0 "Казнь Юуки"
FRA_prov_event.145.d:0 "\"...Принимая во внимание, что очевидное нарушение суверенитета Республики, бесчеловечные действия без причины и их терпимость и пособничество составляют серьезное дело, которое должно быть сурово наказано, выносится следующий приговор подсудимой-\".\n\nМгновенный звук секундной стрелки, висевшей над залом суда, показался вечностью.\n\n\"Подсудимая Хаясэ Юука: смертная казнь.\"\n\nВ напряженном зале глухой стук председательского молотка прозвучал трижды. У Юуки свело желудок. Но больше самой смертной казни ее мучил ливень ликования, обрушивавшийся с трибун. Что, собственно, она сделала не так? В суде само существование Юуки стало преступлением. Хотя она отрицала это, хотя кричала, что не сделала ничего плохого, они не принимали этого. И каждый раз гнев, смешанный с рыданиями, пожирал ее. Конец истории был предрешен с самого начала. Ей лишь дали время подумать об этом.\n\nПока древняя технологическая империя испускала последний вздох, Юука тяжело дышала в подземелье и тьме Марселя. Смертный приговор уже был подтвержден. Но как? Юука перебрала все мыслимые сценарии. Надо было по возможности избежать мучительной смерти; так что, если все равно суждено умереть, она хотела угаснуть спокойно. По иронии судьбы, когда прошли дни, в которые она молила о жизни... она начала молить о смерти.\n\n\"Идет дождь.\" В ночь, когда Юука, прислонившись к решетке, не могла уснуть, шел дождь. Как и в тот день, когда Миллениум был превращен в пепел под факелом голубой свободы, тоже шел дождь. Юука гадала, что стало с Рио, удалось ли Ноа спастись бегством, и заперта ли по-прежнему буйная Коюки. Ей стало смешно. Она не смеялась ни разу за месяц, но чем ближе подходил конец, тем больше она возвращала себе утраченный смех. Она давно отказалась от расчетов из-за количества переменных, но разум и логика, казалось, уже знали ответ. Моросящий дождь остудил жар машины.\n\n\"Приговоренная к смерти № 18, выходи!\"\n\nОхранник крикнул, открывая решетчатую дверь. Юука взглянула на настенные часы. Было 12. Поняв, что наступила ее полночь, она инстинктивно ощутила тяжелый ужас пребывания на пороге между жизнью и смертью. Предположив, что этот разговор будет последним, она наконец открыла рот, который держала закрытым. Последний разговор должен быть, более чем когда-либо, рациональным и логичным и содержать нечто, что можно доказать.\n\n\"Что стало с членами Семинара?\"\n\n\"...\"\n\nНеучтиво, в последнем разговоре Юуки, сколько бы она ни коверкала слова, ни признавала вину, ни умоляла о прощении, охранник не отвечал. Ей это весьма не понравилось, но выбора не было. Она медленно пошла по жесткому тюремному коридору. Она покосилась на боковые камеры, но видела лишь бесконечную череду пустых камер. Она попала туда со многими другими девушками. Но теперь, словно они спрятались где-то, их уже не было видно. Куда они делись? Калькулятор, готовый быть раздавленным, запустил свой последний расчет.\n\nПройдя около десяти с лишним минут, она вышла через стальную дверь толщиной 20 см. Хотя надежд выжить не было, в глубине души она все же лелеяла надежду на жизнь. Но жестокая причина и логика не позволили ей мечтать о тщетной надежде. Ей связали руки у наружной виселицы.\n\n\"Наконец-то настал мой час.\"\n\n\"До тебя уже умерли многие. Не думай о глупостях: лучше подумай о своем последнем желании.\"\n\n\"Перед смертью я хотела бы, чтобы вы ответили на мой вопрос. Это мое последнее желание. Ноа, Рио, Коюки… куда они делись?\"\n\n\"Они прямо здесь.\"\n\n\"Что?\"\n\n\"Я говорю, они прямо здесь. Прямо над землей, на которой ты стоишь.\"\n\nЕе затошнило. Те самые дорогие люди, о которых она думала хоть на мгновение, уже давно были мертвы. И, более того, тем же методом, что и Юука… только раньше. Юука представила Ноа, корчащуюся от боли, не умирая сразу; Рио, принимающую все перед выстрелами; Коюки, содрогающуюся перед смертью. Это были сцены, которые Юука уже предвидела, но тот факт, что она пришла к выводу, что так оно и было, сделал ее еще более отвратительной.\n\nЗвук медленно приближающихся сапог тоже не способствовал спокойствию. На глаз, десять шагов. Даже если бы она могла умереть с одного 'безболезненного' удара, Юука не хотела предстать перед смертью. Она хотела жить, хотела продлить эту утомительную жизнь.\n\n\"Приступайте.\" Сказал человек в форменной фуражке французской армии, надвинутой на глаза; на первый взгляд, высокопоставленный офицер. С его кратким приказом те, кто стоял перед расстрельной командой, засуетились: приготовили журналистов и проверили винтовки солдат. Юука заключила, что ее так просто не отпустят.\n\n\"Приготовиться к стрельбе-\"\n\nСердце Юуки начало бешено колотиться. Куда ни глянь, выхода для бегства не было. Вода, проникающая в машину, в конце концов выводит ее из строя.\n\n\"- Огонь!\"\n\nОна крепко зажмурилась. Когда жнец взмахнул своей косой, она молилась, чтобы умерла сразу."

FRA_prov_event.146.t:0 "Опустошение севера Франции"
FRA_prov_event.146.d:0 "Бесконечные городские бои и атаки и оборона, сменявшие друг друга десятки раз в день, опустошили городские районы севера, включая Париж."
FRA_prov_event.146.a:0 "Это всего лишь небольшая жертва."

FRA_prov_event.147.t:0 "Административный хаос"
FRA_prov_event.147.d:0 "С отвоеванием метрополии огромная территория и многочисленные французы перешли под наш контроль. Пока мы не восстановим административную систему, мы будем испытывать огромную путаницу в применении политик."
FRA_prov_event.147.a:0 "Какая докука."

FRA_prov_event.148.t:0 "Опустошение юга Франции"
FRA_prov_event.148.d:0 "Из-за сохраняющегося сельского сопротивления, партизанской войны и операций по опустошению на юге сельские районы юга были опустошены."

FRA_prov_event.149.t:0 "Память о Парижской коммуне"
FRA_prov_event.149.d:0 "В 1871 году, отказываясь принять поражение во франко-прусской войне и восстав против буржуазного правительства, граждане Парижа установили Парижскую коммуну и в течение трех месяцев осуществляли современный социализм, сражаясь против правительственных сил. Хотя буржуазные войска, поддерживаемые Германией, в конечном итоге уничтожили Национальную гвардию, защищавшую Париж, и убили бесчисленное количество граждан, боевой дух революции жив.\n\n18 марта, день памяти Парижской коммуны, отныне будет объявлен национальным праздником."
FRA_prov_event.149.a:0 "Встаньте, и вы тоже!"

FRA_prov_event.150.t:0 "Социалистическая конституция [GetYear] года"
FRA_prov_event.150.d:0 "Преодолев капиталистическое общество и путем мирной конституционной реформы, социалистическая Франция наконец явила свой облик. Новая французская социалистическая конституция будет включать: общественную собственность на средства производства; широкое социальное обеспечение и благосостояние под ответственностью государства; установление рабочей власти посредством трудовых прав и отраслевых советов; и всесторонний запрет дискриминации — независимо от того, явно она прописана в кодексах или нет."
FRA_prov_event.150.a:0 "Вперед, к социалистической Франции!"

FRA_prov_event.151.t:0 "Теория освобождения женщин"
FRA_prov_event.151.d:0 "До сих пор основным течением феминизма был 'либеральный феминизм'. Но у него есть предел: он требовал расширения прав женщин, не преодолевая внутренних противоречий капитализма и либерализма; а Франция, к тому же, является отсталой в правах страной, неспособной полностью реализовать даже те политики, которые этот либеральный феминизм отстаивает.\n\nОднако мы будем двигаться к открытому обществу, в котором, перед лицом навязывания домашнего и заботливого труда капитализмом, мы смело отменим гендерную дискриминацию в оплате труда и повышениях, военной службе и других социальных сферах; и будем активно признавать телесную свободу женщин, гарантируя право на аборт."
FRA_prov_event.151.a:0 "Отменим дискриминацию!"

FRA_prov_event.152.t:0 "Диверсифицированные профсоюзы"
FRA_prov_event.152.d:0 "Профсоюзы обычно действуют для продвижения интересов своих членов, но большинство из них проявляют политическую ориентацию и действуют в союзе с партиями.\n\nВ этом контексте мы могли бы усилить правительство, незаметно поддерживая умеренный реформистский профсоюз или радикальный социалистический профсоюз. Также возможно сохранять нейтралитет правительства."
FRA_prov_event.152.a:0 "Поддержим умеренный профсоюз."
FRA_prov_event.152.b:0 "Поддержим радикальный социалистический профсоюз."
FRA_prov_event.152.c:0 "Предпочтительнее сохранять нейтралитет."

FRA_prov_event.153.t:0 "Опустошение востока Франции"
FRA_prov_event.153.d:0 "Партизанская война, ведшаяся с ограниченной видимостью в горах и лесах, сосредоточилась на востоке, опустошив его до такой степени, что горнодобывающая промышленность, сосредоточенная там, больше не может функционировать."
 FRA_recover.1.t:0 "Награждение солдат"
 FRA_recover.1.d:0 "Временный комитет, сформированный после объявления освобождения, решил вручить награды всем тем, кто во время войны за освобождение проливал кровь или погиб, защищая свои семьи, народ и родину."
 FRA_recover.1.a:0 "Все они — граждане, достойные гордости."
 FRA_recover.3.t:0 "Влияние Испании"
 FRA_recover.3.d:0 "[SPR.getname] потребовала, чтобы мы поддержали восстановление ее национальной промышленности, разрушенной гражданской войной, в качестве компенсации за помощь во время войны за освобождение."
 FRA_recover.3.a:0 "Мы должны выполнить обещание."
 FRA_recover.4.t:0 "Роспуск Сопротивления"
 FRA_recover.4.d:0 "По мере восстановления нашей национальной территории Сопротивление будет реорганизовано и интегрировано в регулярную армию, и, таким образом, распущено."
 FRA_recover.4.a:0 "Все вы много работали до сих пор."
 FRA_recover.5.t:0 "Обращение с коллаборационистами"
 FRA_recover.5.d:0 "Мы должны разобраться с мелкими буржуа, которые сотрудничали с другим миром после Великой транспозиции."
 FRA_recover.5.a:0 "Все они будут наказаны по закону."
 FRA_recover.5.b:0 "У них тоже не было выбора. Вместо этого исключим их из публичной сферы."
 FRA_recover.6.t:0 "Спор о собственности"
 FRA_recover.6.d:0 "Пока бесчисленные граждане отправлялись в изгнание в Северную Африку, другие, оставшиеся в метрополии, заняли земли и имущество, которые те оставили. Однако с возвращением изгнанников мы должны разрешить эти споры о собственности. Один из способов — вернуть им их имущество; другой — признать новых владельцев и взамен выплатить изгнанникам компенсацию за значительную часть того, что у них было отнято."
 FRA_recover.6.a:0 "Вернем имущество изгнанникам."
 FRA_recover.6.b:0 "Выплатим компенсацию изгнанникам."

 FRA_ex_event.1.t:0 "Алжирский кризис"
 FRA_ex_event.1.d:0 "Прошло несколько месяцев с тех пор, как гнев на метрополию за невыполнение обещаний охватил улицы Алжира. Алжирцы начнут движение для критики и противодействия метрополии."
 FRA_ex_event.1.a:0 "Они не знают своего места."

 FRA_ex_event.3.t:0 "Спорадические собрания в Алжире"
 FRA_ex_event.3.d:0 "От служб безопасности поступили тревожные новости. С рассвета начались собрания арабов во многих местах, включая бывшие стадионы и театры, и всего за несколько часов улицы полностью заполнились демонстрантами. Алжир уже погрузился в хаос.\n\nБольшинство членов кабинета утверждает, что нынешняя ситуация возникла из-за приказа о мобилизации, изданного сразу после поражения. Они говорят, что состояние страны, чей вес внутренней экономики снизился до крайности, начинает разрушать их жизни. Возможно, мы выжали их слишком сильно.\n\nОбнародовано заявление на уровне правительства, и мы надеемся, что это хоть немного успокоит недовольство арабов. Однако часть сил безопасности утверждает, что мы должны запретить собрания, чтобы погасить искру как можно скорее. Кабинет разделился на два лагеря, и час принятия решения приближается."
 FRA_ex_event.3.a:0 "Запретите собрания!"
 FRA_ex_event.3.b:0 "Они успокоятся сами собой."
 FRA_ex_event.4.t:0 "Антиколониальная демонстрация"
 FRA_ex_event.4.d:0 "Левые организации провели протесты с требованием отказа от колониальной политики и предоставления французского гражданства алжирцам."
 FRA_ex_event.4.a:0 "Они не думают о национальных интересах."
 FRA_ex_event.4.b:0 "Возможно, это правильно."
 FRA_ex_event.5.t:0 "Реакция алжирской общины"
 FRA_ex_event.5.d:0 "Алжирская община, проживающая во Франции, присоединилась к антиколониальному дискурсу и высказывается в пользу автономии Алжира."
 FRA_ex_event.5.a:0 "Ситуация становится все более серьезной."
 FRA_ex_event.5.b:0 "Мы больше не можем откладывать. Примем их требования."
 FRA_ex_event.6.t:0 "Вооруженная борьба в Алжире"
 FRA_ex_event.6.d:0 "ㅈㄱㄴ"
 FRA_ex_event.6.a:0 "Проклятье."
 FRA_ex_event.7.t:0 "Международное осуждение"
 FRA_ex_event.7.d:0 "ㅈㄱㄴ"
 FRA_ex_event.7.a:0 "Если бы мы подавили их заявления..."
 FRA_ex_event.7.b:0 "Что, если мы достигнем соглашения с алжирским руководством?"
 FRA_ex_event.8.t:0 "Всеобщая алжирская забастовка"
 FRA_ex_event.8.d:0 "Алжирцы начали всеобщую забастовку, чтобы навязать свои требования."
 FRA_ex_event.8.a:0 "Они действительно перешли черту."
 FRA_ex_event.9.t:0 "Референдум?"
 FRA_ex_event.9.d:0 "Поскольку всеобщая забастовка затягивается на месяцы, общенациональные антиколониальные организации и руководство алжирского движения за независимость предложили разрешить нынешний кризис демократическими средствами."
 FRA_ex_event.9.a:0 "Демократия — это роскошь для варваров."
 FRA_ex_event.9.b:0 "Они правы."
 FRA_ex_event.10.t:0 "Константинские соглашения"
 FRA_ex_event.10.d:0 "При условии независимости нам удалось вырвать у алжирцев важные уступки, и Константинское соглашение было успешно заключено."
 FRA_ex_event.10.a:0 "Это дипломатия соглашения."
 FRA_ex_event.11.t:0 "Алжирская война за независимость"
 FRA_ex_event.11.d:0 "Вчера мэрия Алжира была занята тысячами людей, и там был поднят алжирский флаг. Алжирские политические лидеры собрали paramilitary организации и молодежь и штурмовали французские военные базы."
 FRA_ex_event.11.a:0 "Это было неизбежно."
 FRA_ex_event.12.t:0 "Арабская поддержка Алжира"
 FRA_ex_event.12.d:0 "Марокко, Тунис и другие соседние с Алжиром страны поддерживают независимость Алжира."
 FRA_ex_event.12.a:0 "Проклятье!"
 FRA_ex_event.13.t:0 "Итальянское вмешательство"
 FRA_ex_event.13.d:0 "Италия поддерживает Алжир."
 FRA_ex_event.13.a:0 "После Алжира — вы!"
 FRA_ex_event.14.t:0 "Растущие антивоенные настроения"
 FRA_ex_event.14.d:0 "В то время, когда мы должны восстанавливать страну после возвращения национальной территории, абсурдно расходовать ресурсы на бессмысленную войну против Алжира, и к тому же нет законной причины. Молодые люди считают несправедливым, что их отправляют воевать."
 FRA_ex_event.14.a:0 "Нынешняя молодежь..."
 FRA_ex_event.15.t:0 "Освобождение"
 FRA_ex_event.15.d:0 "[FRA_philippe_petain.getname] созерцал город света, сбивавший с толку его воспоминания.\n\nОна может шататься, но не утонет; может рухнуть город, но никогда не погаснет его голубой свет.\n\nГород сияет.\n\nХотя треугольная железная башня исчезла и на ее месте воздвигнут белоснежный хрустальный дворец, он все равно сияет.\nХотя в значительной степени утрачены следы старой республики и города, с большим количеством серого, чем черных и коричневых крыш, он продолжает сиять.\nПариж остается существованием, которое остается с тобой всю жизнь, как движущийся праздник.\n\nПетен двинулся в путь. Вместе с другими он направился к исторической церкви с куполом на берегу Сены. Церкви, куда граждане приходили во времена революции, с реющим триколором, чтобы добыть ружья; и раньше, и теперь она функционировала как мавзолей, где покоятся герои Франции.\n\nДом инвалидов.\n\nПетен созерцал саркофаг. Он созерцал самый большой саркофаг в Доме инвалидов: под триколором, дом, где покоится тело величайшего из генералов, величайшего из императоров Французской империи.\n\nДитя семьи Бонапарт, рожденное в корсиканской деревушке, властвовало над гегемонией Европы. В конце концов он пал, не сумев победить русский холод, но миф об императоре все еще жив.\n\nНесколько лет назад, на Рождество, Петен — которому пришлось покинуть родину и бежать — лишь смотрел на саркофаг. Это была сцена, немыслимая даже всего несколько месяцев назад. Он желал вернуться на родину, но были моменты, когда он думал, что не вернется, пока не уснет навеки внутри гроба.\n\nИ все же Петен наконец вернулся. Он изгнал студенток с ореолами над головами и снова ступил на землю как хозяин гексагона.\nПетен вышел из Дома инвалидов. Толпы, ликования. Реющий триколор.\n\nОни смотрели на него, на своего врага. Парижане, французы, люди старой республики приветствовали его. Франция смотрела на Петена.\n\nПетен был переполнен эмоциями.\nОн пытался сохранить спокойствие, но не смог.\n\nМаршал закричал."
 FRA_ex_event.15.a:0 "'Да здравствует Франция!'"
 FRA_ex_event.16.t:0 "Подавление левых"
 FRA_ex_event.16.d:0 "Несмотря на то, что парламент был распущен, такие левые фигуры, как Леон Блюм и Эдуар Даладье, по-прежнему имеют огромное влияние в политике. В частности, Леон Блюм критиковал военную диктатуру Петена, утверждая: \"То, что он, военный герой и символ победы, распустил парламент, — это жестокое моральное предательство, мятеж против демократии; если это не так, то что же?\"\n\nПосле этого заявления Петен, во имя национальной стабильности, издал ордера на арест лидеров левых, ссылаясь на заговор коммунистического терроризма против правительства и ответственность за поражение в войне Миллениум-Франция. Даладье и Блюм, публиковавшие в Париже декларацию против военной диктатуры, были арестованы на месте, и несколько лидеров левых партий были заключены в тюрьму один за другим.\n\nВ настоящее время в комитете по восстановлению рассматривается этот случай со всей серьезностью, и обсуждается законопроект о запрете левых партий."
 FRA_ex_event.16.a:0 "Если это для защиты Франции от нападок левых..."
 FRA_ex_event.17.t:0 "Военная служба Сопротивления"
 FRA_ex_event.17.d:0 "После возвращения национальной территории Сопротивление по всей Франции расследуется нашим правительством, и кажется, что большинство его членов уже сложили оружие.\n\nЧтобы противостоять угрожающим силам в Европе после освобождения, мы могли бы снова вложить оружие в их руки и организовать дивизии Сопротивления, получив тем самым легко большую, хорошо обученную армию."
 FRA_ex_event.17.a:0 "Название Армия национального освобождения звучит хорошо."
 FRA_ex_event.17.b:0 "Нет, нам нужны не солдаты, а рабочие."
 FRA_ex_event.18.t:0 "Танковый производственный завод"
 FRA_ex_event.18.d:0 "Восстанавливая контроль над промышленными объектами Миллениума и адаптируясь к их передовым технологиям, мы получили контроль над большим танковым производственным заводом, который планировала Научная школа Миллениума.\n\nБольшая часть власти Научной школы Миллениума приостановлена, поэтому мы не можем запустить завод, но сможем сформировать дивизии с этими танками."
 FRA_ex_event.18.a:0 "Хорошо."
 #Decisiones de Francia
 FRA_ALG_war:0 "Алжирский кризис"
 FRA_ALG_war_desc:0 "С возвращением территории метрополии 'большинство' французов праздновало, но 'меньшинство' — алжирцы, рассматриваемые как нецивилизованное население — не могло этого сделать. Франция, обещавшая независимость другим колониям в обмен на их сотрудничество в войне, в случае с Алжиром утверждала, что алжирцы — французы и что Алжир является частью территории метрополии, отрицая тем самым его независимость. Угнетение всегда порождает сопротивление. Алжирцы будут решительно противостоять Франции."
