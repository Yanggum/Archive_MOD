 FRA_inner_circle_petain.3.t: "Лидерство Филиппа Петена"
 FRA_inner_circle_petain.3.d: "Алжирское солнце было палящим, но в кабинете маршала Филиппа Петена витала лишь холодная тишина. За окном виднелась не гладь Сены, а суровые воды Средиземного моря; и окружали его не парижские салонные огни, а пропитанные поражением офицеры-изгнанники. \"Провал в метрополии\". Эти слова, болезненные, как кость, давили на грудь старого маршала.\n\n\"Республика мертва. Нет... она покончила с собой.\"\n\nПетен опустил взгляд на отчет на своем письменном столе. Бесконечные дискуссии в парламенте, коррупция политиков и армия, рухнувшая бессильно перед монстром из другого мира по имени \"Миллениум\". \"Свобода, равенство, братство\" — клич Третьей республики — в итоге принес лишь беспорядок, распущенность и поражение. Теперь он понимал тяжесть креста, который должен был нести.\n\nМало было вернуть землю. Франция должна была возродиться. Нужно было отбросить иллюзию гнилой демократии и с помощью дисциплины, порядка и жертвы очистить душу нации. Это будет болезненный процесс, но неизбежный. Дрожащей рукой он взял перьевую ручку.\n\n\"'Труд, Семья, Отечество (Travail, Famille, Patrie)'. Это будет наше новое знамя.\"\n\nДокумент, который он подписал, был не просто административным распоряжением. Это был разрыв с прошлым и сигнал, возвещающий начало великой операции под названием \"Национальная революция (Révolution nationale)\". Старый лев снова принял одинокое решение, чтобы спасти родину."
 FRA_inner_circle_petain.3.a: "Франция возродится."

 FRA_inner_circle_maurice_gamelin.5.t: "Хранитель Республики"
 FRA_inner_circle_maurice_gamelin.5.desc: "В кабинете Алжира витала тяжелая тишина. На месте, где пал гигантский идол по имени Филипп Петен, остались лишь разбросанные остатки его авторитаризма и осколки разбитой республики. Морис Гамелен, созерцая воды Средиземного моря за окном, погрузился в глубокое раздумье. Армия была неспокойна, и по всем колониям одновременно разносились голоса, требующие восстановления демократии, и молчание, жаждущее сильного руководства.\n\nОн повторил себе: какую форму должна принять республика, которая снова приходит в движение? Старые политики и парламентарии, во главе с Лавалем, требовали немедленно созвать парламент и без промедления восстановить юридическую преемственность Третьей республики. Это был самый безопасный путь вернуть легитимность и народную поддержку, но он также нес риск вернуть мелочную партийную борьбу и неэффективность прошлого. Шла война. Враг был силен, а мы — слишком слабы.\n\nС другой стороны, офицеры Генерального штаба настаивали на том, что до окончания войны должен сохраняться жесткий военный контроль. Логика была такова: до дня победы армия должна выступать в роли \"опекуна\" и \"покровительствовать\" республике посредством \"опеки\" (훈정). Это было эффективно... и заманчиво, но страх впасть в неотличимый путь от диктатуры Петена — которого он так презирал — заставил его колебаться.\n\nРука Гамелена сжалась на ручке. Его выбор определит характер правительства в изгнании... нет, само будущее Франции. Он должен был решать не как честь старого солдата, а как подлинный хранитель Республики."
 FRA_inner_circle_maurice_gamelin.5.a: "Восстановить Парламент, чтобы обеспечить демократическую легитимность."
 FRA_inner_circle_maurice_gamelin.5.b: "До победы армия покровительствует Республике."

