 FRA_disruption_event.1.t: "Маленькая искра - 1"
 FRA_disruption_event.1.d: " \"О чем ты говоришь? Давай, выкладывай.\"\n\"В таком состоянии я не могу вам сказать.\"\n\"Почему?\"\n\"Мы пришли сюда, представляя 2500 рабочих.\"\n\"Понимаю. И что?\"\n\"Мы используем уважительное обращение, но заместитель директора завода и начальники разговаривают с нами пренебрежительно.\"\n\"Это была наша ошибка.\"\n\n \"Итак, каковы именно ваши требования?\"\n\"Повышение зарплаты на 25%, немедленная выплата задолженности по зарплате и безусловное восстановление на работе несправедливо уволенных. Вот и все.\"\n\"Зарплаты уже были скорректированы в феврале и выплачиваются в соответствии с этой корректировкой. Бонус также был выплачен в конце прошлого года.\"\n\"Это было одностороннее повышение. Выплаченный бонус даже не заслуживает названия бонуса. Он едва равнялся месячной сверхурочной работе.\"\n\n \"Начальник филиала, отдайте нам ту тетрадь. И покончим с этим.\"\n\"Когда мы получим ответ компании на наши требования?\"\n\"Ничего не ждите. Нам нечего давать тем, кто все видит в черном свете. Я не понимаю, почему вы отрицаете наш прогресс.\"\n\"Это не так. Те, кто работает на промышленном фронте, — это мы, рабочие. Мы просто требуем, чтобы эти выгоды также возвращались нам. Почему мы должны ослабевать ради здоровой экономики?\"\n\"Со временем все решится.\""
 FRA_disruption_event.1.a: "\"Рабочие уже слишком долго ждали.\""

 FRA_disruption_event.2.t: "Маленькая искра - 2"
 FRA_disruption_event.2.d: " Вспыхнул огонь. Мы провели двое полных суток без сна, защищая завод. Жандармы были безжалостны. Я видел, как голова товарища окрасилась в красный. К счастью, им не удалось проникнуть на завод. Сталелитейный завод превратился в неприступную крепость. Мы заперли администраторов в комнате. Инструменты стали оружием. Длинные бревна преграждали путь жандармам. Мы ждали Рахима, который ушел передать вести. Еда начала заканчиваться.\n\n Мы были полностью окружены жандармерией. Ничто не могло попасть на завод. И выйти тоже. Трое трусов убежали, но были избиты до потери сознания. Они не хотели драться. К счастью, у нас было достаточно коктейлей Молотова. Доменная печь не остывала. Если бы мы вылили расплавленный металл, они бы не смогли подняться.\n\n С соседнего завода доносились звуки ломающихся и сталкивающихся вещей. Пятнадцать человек присоединились к нашему заводу через потайной проход. Они сообщили нам, что все с соседнего завода были арестованы. Отступать было некуда.\n\n Снаружи были видны рассредоточенные солдаты. Я не понимаю по-французски. Они что-то кричали в громкоговорители, и несколько товарищей поспешно спрятались. Я думал, они трусы. Бревна и каски защищали меня. Я изо всех сил швырнул в них коктейль Молотова."
 FRA_disruption_event.2.a: "\"Огонь!\""

 FRA_disruption_event.3.t: "Алжирское сопротивление"
 FRA_disruption_event.3.d: "Алжир, рассматриваемый и управляемый как часть 'территории метрополии' Франции, кажется наиболее стабильным регионом Французской Северной Африки. Однако в этой зоне растут структурное недовольство колониальной властью, ее подавление и ростки национализма. 'Североафриканская звезда' (Étoile nord-africaine, ENA), основанная в 1926 году, организует движение сопротивления, основанное на национализме. Хотя она многократно объявлялась вне закона, она сохраняет подпольные ячейки и ждет своего часа."
 FRA_disruption_event.3.a: "Это ужасно."
 FRA_disruption_event.3_tt: "\n§gПоскольку пути, отличные от §4Филиппа Петена§!, еще полностью не разработаны, в §Wтекущей версии§! §Yфаза кризиса Франции§! не может превысить §R4§!.§!\n\n"

 FRA_disruption_event.4.t: "Зима в Оране"
 FRA_disruption_event.4.d: " Луи Мартен начинал каждый день на рассвете, грузя товары у порта. Маленький домик, оставленный ему отцом, перешел к банку, когда цена на пшеницу рухнула во время Великой депрессии. Единственное, что осталось, — это комната размером с кухню и старая кровать.\n\n \"Луи, если ты и сегодня не найдешь работу, на ужин будет только хлеб.\"\nСказала его жена Мари, протирая глаза при свете зари. Луи не ответил; нахлобучил шляпу и вышел.\n\n В порту он боролся за работу, сталкиваясь плечом к плечу с рабочими-мусульманами-алжирцами. Все были бедны. Все голодали. Но Луи не мог быть им ни другом, ни врагом. Между ними существовала невидимая граница. Дистанция, созданная французским паспортом.\n\n Возвращаясь, Луи встретил Мари и двух своих дочерей, несущих тюки. Он попытался радостно поздороваться с ними, но не смог. В глазах девочек скопились слезы. Не сумев утешить мрачное лицо Мари, Луи отчаянно побежал к пустырю, где стоял его дом.\n\n \"Бах!\"\nКрыша рухнула, подняв облако пыли. Когда пыль рассеялась, люди с железными молотами обнаружили Луи.\n\n Чиновник, казалось, отвечавший за снос, подошел. Он протянул бумагу и ручку, указывая пальцем на квадрат. Он должен был подписать. Тогда Луи поднял левую руку.\n\n Все произошло в одно мгновение. Чиновник закрыл лицо обеими руками, наклоняя тело. Кровь сочилась сквозь его пальцы. Луи ударил его снова. Чиновник упал ничком. Люди с молотами набросились на Луи."
 FRA_disruption_event.4.a: "Все быстро кончилось. Луи лежал на земле, как мертвый."

 FRA_disruption_event.5.t: "Урбанизация"
 FRA_disruption_event.5.d: " Утренний морской бриз был свеж. Юссеф Бенхамид инстинктивно почувствовал, что пришла весна. Каждое утро он начинал день, вдыхая аромат кофе в переулках Касбы. Его лавка, унаследованная от отца, была маленькой лавкой тканей, тесной, но с окном, где белые ткани развевались на ветру. Порт, видный из окна, и снующие люди были как вся его собственная жизнь. Хотя он выглянул, чтобы вдохнуть весенний воздух, выражение его лица не выражало удовольствия. В тот день истекал окончательный срок 'принудительного выселения', объявленного мэрией месяц назад.\n\n \"Это не просто переезд, Юссеф.\"\nОн вспомнил слова своего соседа Жан-Пьера.\n\"Они снесут наши лавки и построят здесь проспект и площадь в европейском стиле.\"\n\n С минарета мечети разнесся призыв к молитве. Люди построились в ряды. Они оставили здания и пошли за солдатами, возглавлявшими марш. Они шли полдня.\n\n Солдаты остановились. Люди тоже.\n Те, кто был впереди, спросили солдат, куда им теперь идти.\n Солдат ответил.\n\n\n\n Юссеф пережил ужасный опыт. Солдаты бросили людей на равнине безо всякой инфраструктуры. К счастью, они могли пить воду из узкой реки поблизости. Еды не было. Некоторые ушли. Они не могли направиться в город из-за солдат. У Юссефа было предчувствие, что они вернутся через три дня.\n\n \"Пожалуйста! Дайте нам еды! Мой сын умирает!\"\nЧерез неделю отовсюду слышались отчаянные крики. Три дня спустя не было слышно даже этого. Юссеф не ел два дня. На северном горизонте вырисовывались здания города. Он ждал спасения."
 FRA_disruption_event.5.a: "\"Враг, мы здесь!\""

 FRA_disruption_event.6.t: "Земля"
 FRA_disruption_event.6.d: " Весной 1938 года ячмень на равнине Митиджа созревал. Но Абдельхамид и его семья хорошо знали, что это зерно им не принадлежит. Земля, которую они возделывали, была собственностью европейского землевладельца, господина Рено, и более половины урожая должно было отдаваться в качестве арендной платы.\n\n Той зимой колониальное правительство еще больше увеличило арендную плату и потребовало уплаты наличными. Все это несмотря на сокращение урожая из-за засухи и вредителей. Жители деревни собрались под старой смоковницей позади мечети.\n\n Старый имам сказал:\n \"Если зерно, которое мы вырастили своим потом, не попадает в рот нашим детям, это не воля Божья.\"\n\n С того дня крестьяне перестали ходить в поля. Они оставили вилы прислоненными во дворах и вместо этого разговаривали с активистами, прибывшими из Алжира. Они слышали такие слова, как 'крестьянский союз' и 'права'.\n\n На второй день жандармерия вошла в деревню. Господин Рено обвинил Абдельхамида в 'невыполнении контракта' и конфисковал его скот. Дети плакали, но он не опустил головы.\n\n Жители деревни перестали возделывать землю. На четвертый день жандармы опустошили деревню. Но на пятый день люди тоже не вышли. Жандармерия увезла десятки людей. Жители деревни яростно сопротивлялись, но в конце концов все были подавлены.\n\n \"...говорят, произошло что-то подобное.\""
 FRA_disruption_event.6.a: "\"Хорошая история. Депортируем их.\""

 FRA_disruption_event.7.t: "Клич справедливости, прозвучавший на равнине Митиджа"
 FRA_disruption_event.7.d: "                                                        Из Алжира, 14 марта 1938 г. — Специальный корреспондент М. Лоран\n\n На плодородной равнине Митиджа бедные крестьяне-мусульмане начали историческую борьбу. На протяжении десятилетий они жили под гнетом европейских землевладельцев. Сегодня более половины зерна, которое они вырастили, силой отнимается и отправляется через порт в амбары буржуазии метрополии. Пока дети голодают, а жены выживают, деля хлеб, землевладельцы попивают кофе в кафе Алжира.\n\n На прошлой неделе издольщики деревни решили не выходить в поля. В их руках были не вилы, а знамя справедливости.\n \"Хлеба и прав!\"\n Это простое и великое требование наполнило поля Митиджи.\n\n Рабочие и крестьяне Северной Африки, слушайте! Эти крестьяне — наши братья, и они ведут ту же борьбу. Их борьба — первый шаг к разрыву цепей колониальной эксплуатации и совместному движению, рабочих и крестьян, к свободе.\n\n Колониальное правительство посылает жандармерию, чтобы запугивать, конфисковывать скот и угрожать. Но мы знаем это: голос голодного никогда не будет заглушен. Клич, звучащий в полях Алжира, достигнет доков Орана, фабрик Константины и сталелитейных заводов Аннабы.\n\n Мы с ними. Снижение арендной платы! Отмена уплаты наличными! Право на землю для всех крестьян! Борьба алжирских крестьян — наша борьба. За свободу и хлеб, единым фронтом!\n\n- Североафриканская народная партия"
 FRA_disruption_event.7.a: "Что это, черт возьми?! Немедленно закрыть!"

 FRA_disruption_event.8.t: "Североафриканская народная партия"
 FRA_disruption_event.8.d: " Североафриканская народная партия (СНП) является политической организацией, наследницей 'Североафриканской звезды', и наиболее влиятельной левой антиимпериалистической организацией в Северной Африке. Она завоевала поддержку среди тех, кто был возмущен тем, что Французская коммунистическая партия смотрела сквозь пальцы на правый поворот правительства в изгнании под национальной коалицией. Она пользуется популярностью среди бедняков, низших слоев, мусульман среднего класса, интеллигенции, молодежи и социалистов. В частности, союз с ВКТ обеспечил ей огромные организационные способности, преодолев ее идеологическую узость и дав ее сторонникам четкую и единственную цель: антиимпериалистическая и антиэксплуататорская рабочая борьба.\n\n Согласно данным разведки, несколько членов партии присутствовали на конференции Коминтерна в 1937 году, и было подтверждено, что они получали финансовую поддержку от Советского Союза."
 FRA_disruption_event.8.a: "Какая головная боль."

 FRA_disruption_event.9.t: "Безработица"
 FRA_disruption_event.9.d: "Рабочие работали на одной и той же фабрике, но все делали это изолированно. Время приема пищи было коротким. Рабочие-европейцы заходили в столовую. Мы ели хлеб и оливки в углу фабрики. Надсмотрщик Дюме говорил, что это 'норма'. И подгонял нас есть. Каждый раз, когда мы заканчивали, надсмотрщики заставляли нас делать упражнения. Мы выходили во двор и пинали мяч до изнеможения. Казалось, они ненавидели, когда мы собирались поговорить.\n\n \"Дело не в том, что мы не умеем говорить. Это форма борьбы.\"\nСказал мне Мустафа.\n \"Мы должны бороться за минимальное обращение, которого заслуживаем. Борьба всегда возникает, когда сталкиваются правильное и неправильное. Подумай, на чьей мы стороне.\"\n\n Мустафа пропустил обед. Я, как всегда, пинал мяч.\n\n Зарплату урезали. Блестящие машины появились по всей фабрике. Объем работы увеличился. С наступлением ночи мы были измотаны. Тогда надсмотрщик Дюме говорил о рецессии. Мы боялись, что фабрика закроется. Дюме знал это.\n\n В день получки рабочие говорили еще меньше. Соседнему товарищу доверять было нельзя. Тот, кто упоминал о несправедливости, увольнялся, и никто не знал почему.\n\n Мустафа исчез однажды с фабрики. Не спрашивая, все знали, что с ним случилось."
 FRA_disruption_event.9.a: "'Я чувствовал вину.'"
