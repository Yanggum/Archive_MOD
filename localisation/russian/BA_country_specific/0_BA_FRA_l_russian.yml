 FRA_free_france_event.1.t: "Паралич административных способностей"
 FRA_free_france_event.1.d: "После краха французского правительства в изгнании в Африке из-за массового восстания африканцев мы собрали армию из офицеров, бежавших в хаосе. Однако у нашего правительства нет возможности контролировать даже глубины пустыни, и нам не остается ничего, кроме как наблюдать, как африканцы в пустыне объявляют о своей независимости."
 FRA_free_france_event.1.a: "Мы вернем это позже."

 FRA_free_france_event.2.t: "Декларация независимости Мали"
 FRA_free_france_event.2.d: "Пока мы погружались в хаос, организации за независимость в Западной Африке — воодушевленные, увидев массовое восстание в Северной Африке — начали действовать.\n\nТе, кто называет себя Армией независимости Мали, провозгласили против нас декларацию независимости."
 FRA_free_france_event.2.a: "Мы не можем этого допустить."
 FRA_free_france_event.2.b: "Другого выбора нет."

 FRA_free_france_event.3.t: "Декларация независимости Мавритании"
 FRA_free_france_event.3.d: "Пока мы погружались в хаос, организации за независимость в Западной Африке — воодушевленные, увидев массовое восстание в Северной Африке — начали действовать.\n\nТе, кто называет себя Армией независимости Мавритании, провозгласили против нас декларацию независимости."
 FRA_free_france_event.3.a: "Мы не можем этого допустить."
 FRA_free_france_event.3.b: "Другого выбора нет."

 FRA_free_france_event.4.t: "Независимость Западной Африки"
 FRA_free_france_event.4.d: "Воодушевленные декларациями независимости Мали и Мавритании, мелкие организации за независимость в Западной Африке также объявили о своих собственных декларациях и направили нашему правительству одностороннее уведомление."
 FRA_free_france_event.4.a: "Подавить мятеж."
 FRA_free_france_event.4.b: "Здесь нельзя."
 FRA_free_france_event.4.c: "...Признать его."

