 FRA_resistance_of_locals: "Сопротивление колонизированных"
 FRA_rol_modifier: "$FRA_resistance_of_locals$"
 FRA_resistance_of_locals_tt: "$MODIFIER_POLITICAL_POWER_COST$ [?FRA_rol_pp|-=]\n$MODIFIER_STABILITY_FACTOR$: [?FRA_rol_stability|+=%]\n$MODIFIER_COMPLIANCE_GROWTH$: [?FRA_rol_cg|+=%]\n$MODIFIER_RESISTANCE_TARGET$: [?FRA_rol_resist|-=%]"
 FRA_resistance_of_locals_desc: "С тех пор как берберские пираты Алжира были покорены в 1830 году, колония, охватывающая три континента, заложила основу сегодняшней славной Франции. Однако борьба за ее завоевание находится в крайней противоположности любым эпитетам вроде 'благородная'. Триколор Французской империи (Empire français), развевающийся над городами континента, пустил корни не иначе как на пролитой крови. Министерство колоний (Ministère des Colonies) уничтожало туземцев, восстававших против нас, разрывало их связи и, разделяя их, построило централизованную колониальную систему. И даже спустя более ста лет Западная Африка и десятки миллионов подчиненных, которыми мы управляем, всегда пытаются вырваться из тени латинян. В Ханое, Браззавиле, Дакаре, Касабланке... даже в Алжире. Пока национальная мощь Франции сохранялась, французская армия была готова подавить любой мятеж. Но ситуация изменилась: Париж, город света, пал в руки врага, и 'французское правительство' — не более чем правительство в изгнании, выживающее в Генерал-губернаторстве Алжира. Теперь, когда все изменилось, этот континент стал чем-то более ужасным, чем что-либо другое. Мы должны крепко держать поводья, чтобы не упасть с этой шаткой позиции!"


 FRA_revolution_nationale: "Национальная революция"
 FRA_revolution_nationale_desc: "$FRA_pet.6.d$"
 FRA_revolution_nationale_charles_de_gaulle_1: "Народная революция"
 FRA_revolution_nationale_maurice_gamelin_1: "Народная революция"
 FRA_revolution_nationale_charles_de_gaulle_1_desc: "'Национальная революция' Петена была не более чем оковами, выкованными за закрытыми дверями стариками, пропитанными пораженчеством. Но новая революция под руководством Шарля де Голля иная. Это не навязывание сверху вниз, а сам пылкий крик десятков тысяч, собравшихся на улицах. Французы отказались становиться рабами! Наша революция будет самым динамичным и великим 'национальным сопротивлением', в котором все мужчины и женщины этой земли превратятся в единую гигантскую волну, чтобы смести захватчиков."
 FRA_revolution_nationale_maurice_gamelin_1_desc: "Произвол и репрессии, совершенные под именем 'Национальной революции', задушили истинный дух Франции: 'свободу, равенство, братство'. Маршал Морис Гамелен размышляет о гордыне армии, попытавшейся встать во главе политики, чтобы лепить народ. Истинная революция заключается не в создании чего-то нового, а в возвращении к конституционному духу 1875 года и к ценностям Республики, которые мы утратили. Эта 'Народная революция' поднимется не под шаг сапог, а на основе свода законов; и победа будет вырвана не командным криком диктатора, а дисциплиной и добровольной самоотдачей проснувшихся граждан."

