 FRA_petain_focus_0: "'Верденский лев'"
 FRA_petain_focus_1: "Национальная революция\n (Révolution nationale)"
 FRA_petain_focus_2: "Труд (Travail)"
 FRA_petain_focus_3: "Семья (Famille)"
 FRA_petain_focus_4: "Отечество (Patrie)"
 FRA_petain_focus_0_desc: "В 1916 году в окопах Вердена мы поклялись, что \"они не пройдут!\" и в конце концов победили. Сегодня, хотя нас оттеснили за море, награды маршала все еще сияют. Народ, пропитанный поражением, нуждается в точке объединения. Маршал Филипп Петен снова предложит себя Франции, чтобы спасти родину."
 FRA_petain_focus_1_desc: "Падение Третьей республики было не просто военным провалом. Это был неизбежный результат коррумпированной парламентской политики, декадентского либерализма и морального разложения, распространившегося по всему обществу. Чтобы вернуть родину, мы должны сначала очиститься изнутри. Смыть грязь прошлого и восстановить душу Франции — вот что такое \"Национальная революция\"."
 FRA_petain_focus_2_desc: "Жадность капитализма и агитация социализма осквернили священную ценность труда. Мы отвергаем разрушительную фантазию классовой борьбы. Каждый француз должен усердно трудиться на своем месте, и государство будет направлять этот труд так, чтобы он правильно способствовал великой задаче восстановления родины."
 FRA_petain_focus_3_desc: "Распущенность индивидуализма разрушила самую базовую единицу Франции — семью. Сильное государство вырастает из сильных семей. Мы должны восстановить традиционный патриархальный порядок и поощрять рождаемость и воспитание, чтобы перекроить будущее Франции, страдающей от нехватки населения. Семья будет колыбелью Национальной революции."
 FRA_petain_focus_4_desc: "Наша верность должна быть направлена не на какую-либо фракцию или идеологию, а только на вечную сущность, называемую \"Франция\". Мы должны собрать рассеянные сердца, отказаться от эгоизма и разжечь патриотизм, который жертвует собой ради целого. Только наша родина — испытанная землей, кровью и историей — является нашей единственной верой."

# 샤를 드골
 FRA_charles_de_gaulle_focus_0: "Де Голль, защитник"
 FRA_charles_de_gaulle_focus_1: "Наступательная доктрина"
 FRA_charles_de_gaulle_focus_2: "Сдержать консерваторов в армии"
 FRA_charles_de_gaulle_focus_0_desc: "Старые маршалы все еще не могут очнуться от кошмара окопной войны. Но Шарль де Голль знает: это поражение произошло не из-за недостатка храбрости, а из-за того, что наши методы устарели. Дальновидность и несгибаемая воля молодого генерала — единственная надежда встряхнуть армию, пропитанную пораженчеством, и превратить ее в современную силу."
 FRA_charles_de_gaulle_focus_1_desc: "Обороняться — не более чем другое название поражения. Мы больше не будем прятаться за очередной линией Мажино. Скорость, маневр и концентрация огня. Только смелая наступательная доктрина, возглавляемая бронетанковыми силами, может вырвать победу у подавляющего врага."
 FRA_charles_de_gaulle_focus_2_desc: "Пораженцы, доминирующие в высшем военном руководстве, и консерваторы, цепляющиеся за устаревшие доктрины, — это рак, блокирующий реформу. Генерал де Голль расширит свое влияние, чтобы отстранить их от ключевых постов и заполнить штаб молодыми, способными офицерами, думающими только о победе."

# 모리스 가믈랭
 FRA_maurice_gamelin_focus_0: "Гамелен, защитник"
 FRA_maurice_gamelin_focus_1: "Систематическая система мобилизации"
 FRA_maurice_gamelin_focus_2: "Политизированная армия"
 FRA_maurice_gamelin_focus_0_desc: "Хотя оборона метрополии провалилась, Морис Гамелен остается опытным командующим, контролирующим организацию и управление армией. Радикальный авантюризм только потопит вооруженные силы в такой шаткой ситуации. Только осторожный и систематический подход Гамелена может сохранить хаотическую силу в изгнании как армию с порядком."
 FRA_maurice_gamelin_focus_1_desc: "Импровизированная контратака — это самоубийство. Мы должны тщательно оценить людские и материальные ресурсы Алжира и всех колоний и построить систематическую систему мобилизации, способную снабжать армию с максимальной эффективностью. Победа начинается не на поле боя, а на складах и в бухгалтерских книгах."
 FRA_maurice_gamelin_focus_2_desc: "Армия — это не просто группа, стреляющая из оружия. Это опора государства и последний бастион, гарантирующий политическую стабильность. Генерал Гамелен усилит политические сети внутри армии, чтобы она играла руководящую роль в принятии решений правительства в изгнании."

# 공동 (드골 & 가믈랭)
 FRA_charles_de_gaulle_maurice_gamelin_focus_2: "Реорганизовать французскую армию"
 FRA_charles_de_gaulle_maurice_gamelin_focus_2_desc: "Хотя у этих генералов разные взгляды, они сходятся в одном: с этой мешаниной ничего нельзя поделать. Объединить и реорганизовать под единой цепочкой командования побежденных, бежавших из метрополии, войска колониального гарнизона и местных новобранцев — задача более неотложная, чем любая стратегия."

# 막심 베이강
 FRA_maxime_weygand_focus_0: "Вейган, генерал-губернатор Алжира"
 FRA_maxime_weygand_focus_1: "Алжирский Иностранный легион"
 FRA_maxime_weygand_focus_0_desc: "Алжир — уже не просто колония. Это сама Франция. Генерал-губернатор Максим Вейган, с военной дисциплиной и административными способностями, превратит Алжир в прочную крепость правительства в изгнании. Все приготовления к возвращению метрополии начинаются здесь, в Алжире."
 FRA_maxime_weygand_focus_1_desc: "Нам не хватает живой силы. Губернатор Вейган соберет молодежь Алжира под знаменем Франции. Обещая им честь, жалованье и будущее гражданство, он создаст мощный Иностранный легион, способный сражаться как в пустыне, так и в горах."

# 샤를 노게스
 FRA_charles_nogues_focus_0: "Ногес, генерал-губернатор Марокко"
 FRA_charles_nogues_focus_1: "Марокканский Иностранный легион"
 FRA_charles_nogues_focus_0_desc: "Марокко — стратегический пункт, соединяющий Атлантику и Средиземноморье. Генерал-губернатор Шарль Ногес поддерживал стабильность Марокко, умело управляя султаном и племенными вождями. Его опытное правительство устранит факторы нестабильности в тылу и превратит Марокко в логистическую базу для возвращения метрополии."
 FRA_charles_nogues_focus_1_desc: "Берберы и арабы Марокко — суровые, но храбрые воины. Губернатор Ногес соберет их для расширения Марокканского Иностранного легиона. Они будут ценными силами для операций в суровых условиях, которые регулярной французской армии трудно выносить."

# 샤를 모라스
 FRA_charles_maurras_focus_0: "Идеолог Шарль Моррас"
 FRA_charles_maurras_focus_1: "Труд и родина"
 FRA_charles_maurras_focus_2: "Ценность духовенства"
 FRA_charles_maurras_focus_3: "Французское действие"
 FRA_charles_maurras_focus_0_desc: "Республика была болезнью, разъедающей дух Франции. Шарль Моррас, лидер 'Французского действия' (Action Française), верит, что сейчас настала возможность ее исцелить. Только уничтожив ложный идол демократии и вернувшись к традиции и порядку, свойственным Франции, наша нация сможет выжить."
 FRA_charles_maurras_focus_1_desc: "Борьба между капиталистами и рабочими только разделяет нацию. Моррас предлагает корпоративизм, преодолевающий классовый конфликт: труд на благо родины и государство, защищающее этот труд. В этом органическом союзе экономика восстановит стабильность, а национальная мощь будет восстановлена."
 FRA_charles_maurras_focus_2_desc: "Католическая церковь — душа истории Франции. Мы должны восстановить авторитет Церкви, подорванный антиклерикалами-республиканцами. Вера вооружит духовно народ в невзгодах и придаст моральную легитимность правительству в изгнании."
 FRA_charles_maurras_focus_3_desc: "Настало время действовать. Нам нужны не уличные головорезы, а воины с идеями. Мы расширим организацию 'Французского действия', чтобы заставить замолчать оппозицию и распространить идеал монархической реставрации и интегрального национализма в каждый уголок."

# 프랑수아 드 라 로크
 FRA_francois_de_la_rocque_focus_0: "Идеолог Франсуа де ля Рок"
 FRA_francois_de_la_rocque_focus_1: "Корпоративная экономика"
 FRA_francois_de_la_rocque_focus_2: "Французская молодежь"
 FRA_francois_de_la_rocque_focus_3: "Консолидировать всех правых"
 FRA_francois_de_la_rocque_focus_0_desc: "Ни старая республика, ни монархическая реакция не являются ответом. Франсуа де ля Рок, возглавляющий 'Боевые кресты' (Croix-de-Feu), защищал порядок, авторитет и интеграцию масс. Он сочетает христианский социализм с авторитарным руководством, предлагая новый путь консервативной революции с народной привлекательностью."
 FRA_francois_de_la_rocque_focus_1_desc: "Хаотичному laissez-faire пришел конец. Мы должны построить корпоративистскую экономическую систему, координируемую государством и с участием представителей профессий. Так мы обуздаем злоупотребления капитала, защитим права рабочих и максимизируем национальную производительность."
 FRA_francois_de_la_rocque_focus_2_desc: "Будущее принадлежит молодежи. Де ля Рок организует 'Французскую молодежь', вооруженную дисциплиной, патриотизмом и христианским духом служения. Это будут не просто бойскауты, а авангард нового поколения, который встанет во главе восстановления родины."
 FRA_francois_de_la_rocque_focus_3_desc: "Чтобы противостоять угрозе левых и некомпетентности республиканцев, мы должны объединить раздробленных правых. Де ля Рок, опираясь на свою популярность, сформирует большую пан-правую коалицию, объединяющую консерваторов, католиков и националистов, чтобы взять политическую инициативу."

# 피에르 라발
 FRA_laval_focus_0: "Премьер-министр Пьер Лаваль"
 FRA_laval_focus_1: "Усилить антикоммунистическую позицию"
 FRA_laval_focus_0_desc: "Пьер Лаваль — мастер выживания. Даже среди обломков рушащейся Третьей республики он сохранил пост премьер-министра. Хотя армия уменьшила его власть, его выдающиеся политические способности и административные навыки являются незаменимым активом для управления погруженным в хаос правительством в изгнании."
 FRA_laval_focus_1_desc: "Внутренний враг так же опасен, как и внешний. Премьер-министр Лаваль будет жестко подавлять коммунистов и социалистов. Устраняя подрывные элементы, угрожающие безопасности, он будет стремиться к социальной стабильности и консолидации поддержки консервативного блока."

# 프랑수아 다를랑
 FRA_darlan_focus_0: "'Адмирал-администратор' Дарлан"
 FRA_darlan_focus_2: "Стратегия морской гегемонии"
 FRA_darlan_focus_3: "За горами"
 FRA_darlan_focus_0_desc: "Адмирал Франсуа Дарлан — не просто военный. Он превратил флот в свой личный инструмент и, кроме того, обладает острым политическим чутьем администратора. С разгромленной сухопутной армией Дарлан, сохраняющий нетронутой военно-морскую мощь, является сильной личностью, которую невозможно игнорировать в правительстве в изгнании."
 FRA_darlan_focus_2_desc: "Море — наша артерия. Дарлан установит контроль над морем в Средиземноморье, опираясь на мощный флот. Это ключевая стратегия для поддержания контакта с метрополией, защиты движения припасов между колониями и блокирования вражеского морского проникновения."
 FRA_darlan_focus_3_desc: "Наш взгляд не ограничивается морем. Мы будем наблюдать за границей с Италией и ситуацией за Альпами; при необходимости спланируем смелые операции, сочетающие морскую пехоту и горные войска. Пересечь горы кажется невозможным, но для Дарлана нет ничего невозможного."

# 프랑수아 다를랑 & 피에르 라발 (공동)
 FRA_darlan_and_laval_focus_1: "Поддержать перенос промышленности метрополии"

 FRA_resolution_to_oust_philippe_petain: "Резолюция о смещении Филиппа Петена"

 FRA_head_of_state_charles_de_gaulle: "Глава государства Шарль де Голль"
 FRA_head_of_state_maurice_gamelin: "Глава государства Морис Гамелен"

 FRA_charles_de_gaulle_focus_3: "Правительство национального героя"
 FRA_charles_de_gaulle_focus_4: "Африканская военная экономика"
 FRA_charles_de_gaulle_focus_5: "Культ личности Де Голля"

 FRA_maurice_gamelin_focus_3: "Рыцарь углей"
 FRA_maurice_gamelin_focus_4: "Частичное восстановление парламентского порядка"
 FRA_maurice_gamelin_focus_5: "Наставничество Республики"
 FRA_maurice_gamelin_focus_6: "Обещать после отвоевания"

 FRA_henri_giraud_focus_0: "Главнокомандующий Анри Жиро"
 FRA_henri_giraud_focus_1: "Сосредоточиться на военной реформе"
 FRA_henri_giraud_focus_2: "Французская армия новой эры"

 FRA_alphonse_juin_focus_0: "Начальник штаба Альфонс Жюэн"
 FRA_alphonse_juin_focus_1: "Продолжить республиканскую революцию"
 FRA_alphonse_juin_focus_2: "Политика военного primacy"

 FRA_andre_philip_0: "Национальный координатор Андре Филип"
 FRA_andre_philip_1: "Реорганизовать социальную экономику"
 FRA_andre_philip_2: "Великое дело Франции"
 FRA_rene_pleven_focus_0: "Национальный координатор Рене Плевен"
 FRA_rene_pleven_focus_1: "Поворот к линии Национальной революции"
 FRA_rene_pleven_focus_2: "Построить систему нового государства"

 FRA_national_revolutionary_committee_regime_overthrow: "Сформировать Национальный революционный комитет"
 FRA_charles_maurras_focus_4: "Фюрер Шарль Моррас"
 FRA_charles_maurras_focus_5: "Аннулировать закон об изгнании"
 FRA_charles_maurras_focus_6: "Восстановить орлеанистов"
 FRA_charles_maurras_focus_6_desc: "Орлеанисты пользуются значительной поддержкой среди французских монархистов. Хотя некоторые критики предпочли бы другого претендента, едва ли есть сомнения, что наследник Орлеана имеет наилучшую возможность мирно объединить страну за собой."
 FRA_charles_maurras_focus_7: "Легитимное наследование"
 FRA_charles_maurras_focus_7_desc: "Монархисты-легитимисты считают одну фракцию карлизма законным наследником трона Франции. Назначение их кандидата открывает заманчивую возможность того, что при системе двойной короны Испания и Франция могут управляться одновременно."
 FRA_charles_maurras_focus_8: "Провозгласить Третью империю"
 FRA_charles_maurras_focus_8_desc: "Бонапартисты могут рассматриваться как посторонние в споре о престолонаследии, но они несут с собой мечту о времени, когда вся Европа склоняла голову перед французским императором."

 FRA_francois_de_la_rocque_focus_4: "Фюрер Франсуа де ля Рок"
 FRA_francois_de_la_rocque_focus_5: "Революционное дело"
 FRA_francois_de_la_rocque_focus_6: "Революция порядка"
 FRA_francois_de_la_rocque_focus_7: "Культ Жанны д'Арк"

 FRA_jacques_chevalier_0: "Национальный директор Жак Шевалье"
 FRA_jacques_chevalier_1: "Институт подготовки католического духовенства"
 FRA_jacques_chevalier_2: "Национальная мораль"
 FRA_joseph_darnand_0: "Национальный директор Жозеф Дарнан"
 FRA_joseph_darnand_1: "Основать Французскую молодежь"
 FRA_joseph_darnand_2: "Новое государство"
 FRA_georges_bardeche_0: "Национальный пропагандист Жорж Бардеш"
 FRA_georges_bardeche_1: "Систематическая пропаганда"
 FRA_georges_bardeche_2: "Ценности Национальной революции"
 FRA_inner_circle_member_title: "Звезда Франции"
 FRA_inner_circle_event_pending_flag: "Имеется ожидающее событие §Y$FRA_inner_circle_member_title$§!.\n"
 FRA_inner_circle_cd_flag: "Другие §Y$FRA_inner_circle_member_title$§! уже назначены!"
