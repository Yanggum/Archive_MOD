 FRA_ALG_aftermath:0 "Последствия отмены Туземного кодекса"
 FRA_ALG_aftermath_desc:0 "Туземный кодекс, установленный на долгое время для ассимиляции и эксплуатации алжирцев, отменен, и им предоставлено французское гражданство в общем порядке. Однако националистические силы, радикальные мусульмане Алжира и убежденные сторонники независимости подвергают это решение жесткой критике. Кроме того, в связи с внезапным включением в центральную французскую администрацию, расходуются различные социальные издержки."
 ALG_constantine_agreement:0 "Константинское соглашение"
 ALG_constantine_agreement_desc:0 "Соглашение, достигнутое в Константине, является пактом, по которому в обмен на предоставление независимости Алжиру Франция сохранит различные интересы в Алжире. Хотя Алжир остается в подчинении Франции, через десять лет они смогут полностью обрести независимость."
