  GEAF_prioritize_the_army: "Приоритет армии"
  GEAF_prioritize_the_army_desc: "Германия, а ранее Пруссия, была сухопутной державой. Мы должны оснастить Хеер, чтобы доминировать над любым врагом."
  GEAF_prioritize_the_navy: "Приоритет флоту"
  GEAF_prioritize_the_navy_desc: "Контроль над морями жизненно важен для проекции силы. Наш Кригсмарине должен сравняться с любым флотом противника."
  GEAF_extra_funds_to_waffenamt: "Дополнительное финансирование Waffenamt"
