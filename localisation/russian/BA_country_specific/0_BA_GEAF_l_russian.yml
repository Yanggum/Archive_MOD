  GEAF_Mefo_return: "Погасить векселя Мефо"
  GEAF_Mefo_return_desc: "Пришло время обменять наши векселя Мефо на реальную промышленность. Этим мы провозгласим восстановление немецкой экономики и начнем настоящую экономическую деятельность."
  GEAF_prioritize_economic_growth: "Приоритет роста"
  GEAF_prioritize_economic_growth_desc: "Ошибочная фискальная политика чуть не разрушила нашу экономику. Пришло время делать тракторы вместо танков и раздавать лопаты вместо винтовок!"
  GEAF_currency_reforms: "Денежная реформа"
  GEAF_currency_reforms_desc: "Первый шаг к восстановлению и экономическому подъему — всеобъемлющая реформа валюты."
  GEAF_lower_taxes: "Снизить налоги"
  GEAF_lower_taxes_desc: "Перевооружение легло бременем налогов на народ. Облегчение бремени сократит доходы государства в краткосрочной перспективе, но граждане будут тратить свободнее."
  GEAF_workers_rights: "Права трудящихся"
  GEAF_workers_rights_desc: "Профсоюзы сильно изменились за эти годы. Реформировав их, мы сможем объединить рабочих и предоставить им льготы."
  GEAF_abolish_price_controls: "Отменить контроль цен"
  GEAF_abolish_price_controls_desc: "Введенный для поддержки перевооружения, сейчас он душит экономику. Его отмена снизит поступления, но стимулирует частную инициативу."
  GEAF_increased_trade: "Увеличить торговлю"
  GEAF_increased_trade_desc: "Чтобы процветать, мы должны импортировать то, что не производим. Заключим торговые соглашения — на наших условиях — с другими странами."
