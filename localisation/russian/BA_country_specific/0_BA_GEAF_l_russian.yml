# Germany split paths
 GE1_start_focus: "Объединение Западной Германии"
 GE1_start_focus_desc: "Благодаря нашим военным успехам наши силы смогли объединить Западную Германию. Теперь пришло время воссоединить бывшие фигуры правительства."

 GE2_start_focus: "Объединение Восточной Германии"
 GE2_start_focus_desc: "Благодаря нашим военным успехам наши силы смогли объединить Восточную Германию. Теперь пришло время воссоединить бывшие фигуры правительства."

 GE1_reorganize_nationale_volksarmee: "Основание Национальной народной армии"
 GE1_reorganize_nationale_volksarmee_desc: "В наших вооруженных силах все еще преобладают коррупция и апология фашизма. Чтобы предотвратить сопротивление и предательство, мы должны сначала очистить ряды от тех, кто может восстать. Этот процесс создаст большие вакансии в армии, поэтому для обеспечения безопасности народа нам придется назначить новых лояльных офицеров, которые поведут наших храбрых солдат на поля сражений, которые могут возникнуть."

 GE1_monarchist_sentiment: "Монархические настроения"
 GE1_monarchist_sentiment_desc: "Наш народ желает монархии, и он ее получит. Хотя точная форма правления еще не определена, очевидно, что немцам нужен Кайзер."

 GE2_return_of_the_kaiserreich: "Реставрация Германской империи"
 GE2_return_of_the_kaiserreich_desc: "С момента объединения произошло бесчисленное множество событий. Теперь те, кто следует за нами, жаждут монархии и приложат усилия для восстановления Кайзера на троне."

 GE2_start_the_proletarian_revolution: "Республика Пролетарской Революции"
 GE2_start_the_proletarian_revolution_desc: "Теперь, когда наше государство объединило Западную Германию и провозгласило революцию пролетариата, мы, без сомнения, являемся авангардом революции и маяком человечества."

 GE2_ambition_for_the_west: "К западным территориям"
 GE2_united_homeland: "Единая родина"
 GE2_united_homeland_desc: "После разрушений Великого Перехода и долгой войны за объединение мы должны стремиться к восстановлению родины. Для достижения этой цели мы попросим народ временно отложить личный комфорт и сосредоточить все ресурсы на этой миссии."

