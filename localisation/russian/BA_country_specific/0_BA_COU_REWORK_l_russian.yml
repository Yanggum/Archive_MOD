  COU_focus_lock_the_kronous_desc: ""
  COU_focus_establish_humans_rights: "Повысить статус Офиса гарантии прав человека"
  COU_focus_establish_humans_rights_desc: "Офис гарантии прав человека был создан как временный департамент после Великого Катаклизма 1935 года и, под руководством фашиста Яна Баарса — перешедшего на нашу сторону — увеличил свое влияние внутри Административного комитета до уровня, почти равного 11 существующим департаментам. Поэтому повышение статуса этого офиса до положения, почти эквивалентного этим 11 департаментам, несомненно, необходимо для нашего правительства."
  COU_focus_stop_our_deals: "Приостановить сделки"
  COU_focus_stop_our_deals_desc: ""
  #COU_focus_take_their_money: "Конфисковать средства"
  COU_focus_treay_of_amsterdam: "Амстердамская декларация"
  COU_focus_treay_of_amsterdam_desc: "В то время как единственными территориями, получавшими внимание, были Автономный округ Кронос и округ Хайлендер, местные жители Фландрии и Северной Франции — долгое время забытые — вели долгую борьбу против подхода Административного комитета, сосредоточенного на Нижних землях. Мы обязаны принять их законные мнения и развивать этот регион."
  COU_shaking_royalty: "Поколебать лояльность"
  COU_shaking_royalty_desc: "По всему Генеральному студенческому совету есть те, кто называет себя 'патриотами' и до сих пор видит в нас захватчиков... но, сколько может продлиться эта хрупкая лояльность? Если мы бросим им хороший кусок мяса, эти легкомысленные и поверхностные оппортунисты скоро встанут на нашу сторону."
  COU_give_power_to_degrelle: "Повышение Дегрелля"
  COU_give_power_to_degrelle_desc: "Лучший способ показать, что игра изменилась, — представить эффектный 'пример'. Мы возьмем в пример Леона Дегрелля, лояльного нам, и, давая ему больше власти и привилегий, сможем увеличить число коллаборационистов и лучше сосредоточиться на гармонии с местными жителями."
  COU_keep_our_deals: "Сохранить сделки"
  COU_keep_our_deals_desc: ""
  COU_focus_buy_their_weapon: "Незаконный оборот огнестрельного оружия"
  COU_focus_buy_their_weapon_desc: ""
  COU_reduction_of_administrative_committee_authority: "Нейтрализовать Свободных офицеров"
  COU_reduction_of_administrative_committee_authority_desc: "После Войны в Нижних землях офицеры бывшего врага, оставшиеся на континенте, сформировали организацию под названием 'Свободные офицеры' и наносили нам ущерб; но мы больше не можем это терпеть. Мы должны разделить их, разрушить и полностью нейтрализовать."

