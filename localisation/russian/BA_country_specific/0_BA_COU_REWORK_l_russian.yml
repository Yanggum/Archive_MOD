  #DUMMY#
  #COU_stabilization_of_the_student_council: "Стабильность Генерального студенческого совета"
  #COU_stabilization_of_the_student_council_desc: "К счастью, хотя и был некоторый шум, Генеральный студенческий совет восстановил стабильность. Но глава Казначейства Оки Аой попросила созвать собрание по вопросу, связанному с предыдущим столкновением с SCHALE."
  COU_impeachment_of_chief_executive: "Отстранение временной"
  COU_impeachment_of_chief_executive_desc: "§g"Ты не Председатель Генерального студенческого совета. Исполнительный руководитель. Надеть повязку временной не делает тебя ею."§!\n\nНанагами Рин, как Исполнительный руководитель, хотя, возможно, из-за вмешательства организации под названием SCHALE, перешла недопустимую черту, принижая Председателя Совета в этом процессе. На этом собрании мы одобрим вотум недоверия и отстраним Исполнительного руководителя."
  COU_focus_in_the_darkness: "Скрываясь в темноте"
  COU_focus_in_the_darkness_desc: "..."
  COU_strengthening_bonds_tt: "В столичном регионе страны: добавляется §G1 место строительства§! и §Y1 гражданская фабрика§!."
  COU_autonomous_legislation_tt: "Новые советники станут доступны."
  COU_export_of_revolution_tt: "Условия решения §YПолитическое вмешательство§! смягчаются."
  COU_resolution_47_of_THIS_tt: "§GСоответствующие страны§! будут исключены из §YОрганизации сотрудничества Кивотоса§!."
  COU_war_deterrence_tt: "Будет продвигаться закон, запрещающий войны между странами §YОрганизации сотрудничества Кивотоса§!."
  COU_establishment_of_autonomous_system: "Установить систему автономии"
  COU_establishment_of_autonomous_system_desc: "Взяв инициативу в борьбе за власть, мы смогли посадить Юраги Момоку председателем Чрезвычайного комитета и получили возможность создать институциональную основу для автономии, которую ранее обещали местным жителям. С помощью этого мы сможем еще больше укрепить нашу базу поддержки."

  #Национальные духи Генерального студенческого совета
  #START
  COU_admin_confusion: "Административный хаос"
  COU_admin_confusion_desc: "После Великого Катаклизма Генеральный студенческий совет потерял контроль, и этот административный хаос, похоже, продлится еще некоторое время."
  COU_admin_confusion_tooltip: "При устранении: происходит событие '§YВосстановленная власть Совета§!'."
  COU_chronic_principledism: "Силы обороны"
  COU_chronic_principledism_desc: "Силы обороны — это военная организация Генерального студенческого совета, созданная единогласным решением Административного комитета для защиты Башни Святилища и обороны D.U., столицы Кивотоса, после Великого Катаклизма. Однако из-за чрезмерных зарплат и льгот, предназначенных для избежания низкого уровня призыва, качество каждой дивизии выросло, но вместе с тем мы потеряли способность вести крупномасштабную войну."
  COU_chronic_principledism_tp_army: "Ленивые Силы сухопутной обороны"
  COU_chronic_principledism_tp_army1: "[COU_CCP_ARMY]"
  COU_chronic_principledism_tp_navy: "Упрощенные Силы военно-морской обороны"
  COU_chronic_principledism_tp_navy1: "[COU_CCP_NAVY]"
  COU_chronic_principledism_tp_air: "Малоопытные Силы противовоздушной обороны"
  COU_chronic_principledism_tp_air1: "[COU_CCP_AIR]"
  COU_CPT_tooltip: "Модификаторы §Y$COU_chronic_principledism$§!"
  COU_Perfidus: "Perfidus"
  COU_Perfidus_desc: "В процессе стабилизации правительства после безоговорочной капитуляции Бельгии Офис обороны во главе с Ширануи Каей предложил набирать местных коллаборационистов и использовать их для управления. Официально их называют 'коллаборационистами', но часто их называют на латыни Perfidus: предатели."
  COU_Perfidus_tooltip_modf: "£decision_icon_small §YРешение разблокировано§!: Perfidus"
  COU_Perfidus_tooltip: "Модификаторы §Y$COU_Perfidus$§!"
  COU_industry: "Экономика, управляемая администрацией"
  COU_industry_desc: "Из-за природы Генерального студенческого совета как гигантской бюрократии, даже при реорганизации в государство, наследие прошлого все еще присутствует. Экономика Совета не отдана на откуп рынку: она движется бумагами Административного комитета."
  #ADD
  COU_name_of_the_student_council: "Власть Совета"
  COU_name_of_the_student_council_desc: "Хотя Генеральный студенческий совет больше не осуществляет тот же контроль, что и до Великого Катаклизма, он по-прежнему является 'единственным', способным контролировать и выступать посредником между всеми академиями; даже потускневшая, его власть оказывает меж академическое влияние, которое невозможно игнорировать."
  COU_local_lost_techonology: "Частично переработанные технологии Кивотоса"
  COU_local_future_techonology: "Переработанные технологии Кивотоса"
  COU_league_of_nations_spectator: "Наблюдательный комитет Лиги Наций"
  COU_duty_of_gsc: "Долг Генерального студенческого совета"
  COU_reworked_army: "Недавно реорганизованные Силы обороны"
  COU_reworked_army_desc: "Прошло не так много времени с реорганизации Сил обороны. Они быстро привыкнут к новому опыту, но дисциплина еще не полностью устоялась."
  COU_land_defence_force: "Силы сухопутной обороны"
  COU_air_defence_force: "Силы противовоздушной обороны"
  COU_naval_defence_force: "Силы военно-морской обороны"
  COU_focus_tank_assembly_idea: "Процесс сборки"
  COU_focus_antitank_artillery_idea: "Противотанковый батальон"
  COU_focus_focus_on_plane_production: "Сосредоточиться на производстве самолетов"
  COU_fk_anti_sh: "Потеря легитимности"
  COU_plot_of_rin: "Заговор Офиса координации"
  COU_plot_of_rin_desc: "Вопреки всему, стало достоянием общественности, что по всему Генеральному студенческому совету полно предателей, присоединившихся к Офису координации, что перегружает работу и усиливает давление на управление."

