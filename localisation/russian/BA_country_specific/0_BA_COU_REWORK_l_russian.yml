  #Возобновление работ Зёйдерзе
  COU_restart_the_zuiderzee_works: "Работы в Зёйдерзе"
  COU_restart_the_zuiderzee_works_desc: "Это замечательное инженерно-строительное сооружение, завершенное в 1932 году бывшим голландским правительством, должно продолжаться независимо от того, кто его выполняет. Из-за природы Нижних земель необходимы более твердая земля и больше пригодной для застройки почвы, и возобновление этого проекта будет осуществляться в еще большем масштабе."
  COMPLETED_LEV1: "§YФаза 1§! завершена."
  COMPLETED_LEV2: "§YФаза 2§! завершена."
  COMPLETED_LEV3: "§YФаза 3§! завершена."
  COU_restore_our_fucked_lands: "Фаза 1: восстановить дамбу Зёйдерзе"
  COU_restore_our_fucked_lands_desc: "Чтобы вернуть полностью затопленную землю, мы возведем огромную временную стену вокруг подлежащей восстановлению территории и с помощью насосов откачаем воду; в конце концов Зёйдерзе снова станет Эйсселмером. Конечно... некоторые сооружения могут оказаться 'разрушенными' в процессе..."
  COU_restore_our_lost_factories: "Фаза 2: срочный ремонт затопленных фабрик"
  COU_construct_sea_dam: "Фаза 3: строительство дамбы-плотины"
  COU_extra_lands: "Полный пересмотр городского плана"
  COU_restore_flevoland_province: "Восстановить провинцию Флеволанд"
  COU_restore_flevoland_province_desc: "Во время Великого Катаклизма дамба Зёйдерзе была полностью разрушена, и Флеволанд был затоплен до полного 'исчезновения'. Теперь, когда мы восстановили дамбу, Флеволанд снова поднялся над уровнем моря, и мы должны восстановить его как положено."
  COU_use_dam_for_energy: "Максимизировать производство энергии"
  COU_use_dam_for_energy_desc: "Зёйдерзе, который стал морем после наводнения 1916 года, до сих пор демонстрирует подавляющую силу: если восстановленная дамба рухнет, он может снова стать морем. Мы воспользуемся этим фактом и, используя плотину, построенную вместе с дамбой в фазе 3, максимизируем производство энергии."
  COU_custom_cost_pol25civ3: "£pol_power §Y25§! £civ_factory §Y2§!"
  COU_custom_cost_pol25civ3_blocked: "£pol_power §R25§! £civ_factory §R2§!"

  #Развитие Фландрии и Северной Франции
  COU_industry_of_flandern_northern_france: "Амстердамская декларация"
  COU_industry_of_flandern_northern_france_desc: "Административный комитет официально пообещал Фландрии и Северной Франции, что выделит больший бюджет, чем раньше. Все накопившееся недовольство исчезнет с несколькими статьями расходов!"

  #Общие решения
  COU_decision_the_student_council: "Миссии"
  COU_decision_the_student_council_desc: "£GFX_action_point_texticon §7Очки действия§! — это инструмент переговоров для убеждения и привлечения высокопоставленных лиц Генерального студенческого совета. Они получаются при регулярном выполнении определенных §gтребований§!, предъявляемых Административному комитету, называемых §Yмиссиями§!.\n\nС помощью £GFX_action_point_texticon §7Очков действия§! вы можете 'подсластить' Административный комитет, чтобы установить желаемую политику или национальный фокус.\n\nВ настоящее время у вас [?global.cou_apcost|+0] £GFX_action_point_texticon §7Очков действия§!."
  COU_check_the_missions_1: "Течение времени"
  COU_check_the_missions_1_desc: "Если вы выполните миссию в течение заданного времени, вы сможете получить ОД."
  COU_check_the_missions_2: "Течение времени"
  COU_check_the_missions_2_desc: "Руководители будут удовлетворены, если вы выполните представленную работу в установленный срок."
  COU_check_the_missions_3: "Течение времени"
  COU_check_the_missions_3_desc: "Соблюдение срока необязательно, но так будет лучше."

  COU_the_srt_problem: "Передать в суд Специальную академию SRT"
  COU_the_srt_problem_desc: "Во время Великого Катаклизма Специальная академия SRT совершила ошибку, уничтожив большую часть Королевского дома Оранских-Нассау, включая Вильгельмину. Эта 'резня', совершенная по собственному решению командира отряда, привела к тому, что с наступлением нового года Высокий суд Нидерландов запросил у Генерального студенческого совета передать дело в суд. Похоже, пути назад нет."

  #Доверие к временной Рин
  COU_tooltip_end_rin_system: "£decision_icon_small Механика §YДоверие к временной Рин§! удалена из игры."
  COU_getout_rin_decision: "Доверие к временной Рин"
  COU_getout_rin_decision_desc: "\n\n\n\n\n£GFX_COU_decision_picure_COU_norin\n\n\n\n\n\n\n\nНанагами Рин была, по процедуре, единственным человеком, способным заполнить вакуум, оставленный Председателем Генерального студенческого совета. Но когда ситуация начала успокаиваться и возникли сомнения в ее власти, между Офисом координации и внутренними кругами Административного комитета вспыхнул раскол по вопросу о том, действительно ли Нанагами Рин может заменить вакантное место. Теперь временная Рин оказалась вынуждена вести неизбежную и непредвиденную борьбу за сохранение стабильности своей должности."
  COU_txt_rin_percent: "Текущее доверие: §Y[?NORIN_stab_percent]%§!"
  COU_NORIN_stab_percent_goodfive: "Доверие к §Y[COU.COU_RIN.GetName]§!: §G+5%§!"
  COU_NORIN_stab_percent_goodonefive: "Доверие к §Y[COU.COU_RIN.GetName]§!: §G+15%§!"
  COU_NORIN_stab_percent_badonefive: "Доверие к §Y[COU.COU_RIN.GetName]§!: §R-15%§!"
  COU_NORIN_stab_percent_badten: "Доверие к §Y[COU.COU_RIN.GetName]§!: §R-10%§!"
  COU_NORIN_stab_percent_badfive: "Доверие к §Y[COU.COU_RIN.GetName]§!: §R-5%§!"

  COU_norin_movement_of_opposition: "Деятельность оппозиции"
  COU_norin_movement_of_opposition_desc: "Внутри Генерального студенческого совета набирают силу оппозиционеры, которые оскорбляют Нанагами Рин и утверждают, что ее правление — это тирания, основанная на авторитете Председателя."
  COU_motivate_royalists_movement: "Объединить лоялистов Офиса координации"
  COU_rin_completeing_focus_prokaya: "Успокоить Офис обороны"
  COU_rin_completeing_focus_prokaya_desc: "Нанагами Рин собирается завершить фокус 'Успокоить Офис обороны'."
