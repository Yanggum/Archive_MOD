  COU_focus_offensive: "Психологическая переподготовка"
  COU_focus_offensive_desc: "В армии слабый ум равен смерти. Люди этого мира будут без конца обучаться тому, как убивать выходцев из Кивотоса, а слабая дисциплина и слабое состояние ума означают смерть и поражение. Этого не должно случиться. Мы должны как можно скорее внедрить психологическую переподготовку."
  COU_focus_spirit_of_chasseurs_ardennais: "Дух Chasseurs Ardennais"
  COU_focus_spirit_of_chasseurs_ardennais_desc: "Chasseurs Ardennais были элитным бельгийским подразделением с эмблемой кабана. Во время Великого Катаклизма, несмотря на крайнюю неполноценность, они 'сопротивлялись и кусались' как кабаны, нанося нам большие потери. Их благородный дух достоин изучения."
