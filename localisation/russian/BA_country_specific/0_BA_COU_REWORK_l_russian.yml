  ##Перфидус
  COU_decision_cat_perfidus:0 "Перфидус"
  COU_decision_cat_perfidus_desc:0 "«Моя честь сегодня будет похоронена под этими стенами, но если завтра утром дети внутри этой крепости смогут открыть глаза, я с радостью понесу клеймо предателя».\n\nВозможно, перенос Генерального студенческого совета и столицы Кивотоса в Низины был судьбой, предначертанной Богом. Правительства Низин в ужасе бежали, но среди хаоса нашлись и те, кто, проявив благоразумие, сумел просчитать выгоды и интересы. Это они, официально именуемые «коллаборационистами», а в просторечии — оскорбительно — Перфидус. Отношения с ними сыграют решающую роль в нашей местной ассимиляции."
  COU_perfidus_gui_txt11:0 "Лидер"
  PERFIDUS_LEON_tooltip:0 "Лидер Перфидус: «Инквизитор» §YЛеон Дегрель§!"
  COU_perfidus_gui_txt1:0 "Текущие эффекты от Перфидус:"
  COU_perfidus_gui_txt2:0 "Скорость набора [?COU_Perfidus_ms|%+1]\nОрганизация дивизии [?COU_Perfidus_aof|%+1]\nПрирост людского резерва [?COU_Perfidus_cf|%+1]\nСтабильность [?COU_Perfidus_sta|%+1]\nЛимит эффективности производства [?COU_Perfidus_fmef|%+1]\nСкорость роста подчинения [?COU_Perfidus_cg|%+1]\nВремя обучения [?COU_Perfidus_ttf|%+1]"
  COU_perfidus_happy_yay:0 "Перфидус §Gдовольны§!."

  COU_collaboraters_wants_political_money:0 "Периодические требования привилегий"
  COU_collaboraters_wants_political_money_desc:0 "Перфидус сотрудничают с нами, но работать бесплатно не намерены. Конечно, почти все они — оппортунисты; но также верно и то, что возлагаемые на них задачи — например, «рейды безопасности» вместо Валькирии или миссии Оборонного ведомства — требуют реальных жертв. Поэтому они периодически требуют привилегий: финансирования или политической поддержки. Если мы будем вовремя удовлетворять их требования, проблем не возникнет; если нет — они будут работать для нас «менее охотно»."
  COU_custom_cost_mil1:0 "£mil_factory  §Y1§!"
  COU_custom_cost_mil1_blocked:0 "£mil_factory  §R1§!"
  COU_perfidus_give_cp:0 "Повысить некоторых командиров"
  COU_perfidus_give_cg:0 "Выделить дополнительные средства"
  COU_perfidus_give_pp:0 "Политическая поддержка"
  COU_perfidus_give_mil:0 "Выделить специализированный военный завод"

