  COU_focus_petition_45: "Принять петицию 45-ти"
  COU_focus_petition_45_desc: "В последнее время Генеральный студенческий совет упростил флот, резко сократил военно-морской бюджет и отменил, сократил или минимизировал планы строительства новых кораблей. В результате флот, состоящий из местных жителей, и морские адмиралы выразили свое недовольство, и группа из 45 человек подала совместную петицию в Административный комитет. Интерес к флоту должен продолжаться, и эта петиция будет принята."
