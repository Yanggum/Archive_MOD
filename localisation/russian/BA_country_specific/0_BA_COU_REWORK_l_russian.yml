  COU_establish_oss: "Стратегическое бюро Кивотоса"
  COU_establish_oss_desc: ""
  COU_focus_battle_for_lost_technology: "Частичный редизайн технологий"
  COU_focus_battle_for_lost_technology_desc: ""
  COU_focus_electronics_innovation: "Возрождение электроники Кивотоса"
  COU_focus_electronics_innovation_desc: ""
  COU_focus_wonderweapons: "Перезапуск проекта A.N.T.I.O.C.H."
  COU_focus_wonderweapons_desc: "Термобарическая боеголовка для баллистических ракет, реликвия проекта A.N.T.I.O.C.H., восстановленная Шичидо Юкино, была уничтожена после Великого Катаклизма, чтобы сохранить этот новый мир и избежать огромного хаоса, который возник бы, если бы она просочилась и наложилась на Катаклизм. Однако, поскольку ситуация явно перестанет быть для нас благоприятной, мы возобновим проект A.N.T.I.O.C.H. более 'умеренным' методом."
  COU_establish_spa: "Амнистия для Отряда Фокс"
  COU_establish_spa_desc: ""
  COU_tooltip_establish_spa: "Освобождение §YОтряда Фокс§!."
