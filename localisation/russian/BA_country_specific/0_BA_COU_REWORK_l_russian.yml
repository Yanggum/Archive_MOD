  #Кая
  COU_focus_black_coffee: "То, что не меняется"
  COU_focus_black_coffee_desc: "Месяц размышлений Ширануи Каи принес ей не боль, а убеждение: убеждение в том, что обычная медлительность и половинчатость никогда не смогут подавить хаос Генерального студенческого совета. В мире есть вещи, которые не меняются со временем: стремление к совершенному порядку, построенному на контроле, и логика, согласно которой существует 'сверхчеловек', способный воздвигнуть этот порядок."
  COU_focus_questions_about_the_handover_procedure: "Поставить под сомнение процедуру передачи"
  COU_focus_questions_about_the_handover_procedure_desc: "То, что упускает Нанагами Рин, — это дневник Председателя Генерального студенческого совета, который мы нашли после ее исчезновения. Дневник, который при нормальных обстоятельствах должен был храниться где-то в подвале SCHALE... но по случайности попал в наши руки, и Кая с тех пор управляла им лично. Если это необходимый шаг для отстранения Рин, то с 'легкой корректировкой' содержания мы сможем создать изъян в самом временном режиме Нанагами Рин."
  COU_focus_without_rin_royalists: "Исключить Офис общей координации"
  COU_focus_without_rin_royalists_desc: "Политическое влияние Офиса общей координации сейчас огромно; мы не можем просто так его трогать. Но теперь, когда их коррупция стала достоянием общественности, а активность оппозиции расцветает, если мы намеренно сотрудничаем с начальниками отделов и позволяем процессу течь как 'исключение' Офиса координации, их влияние получит сокрушительный удар."
  COU_focus_talk_with_aoi: "Встреча с Аой"
  COU_focus_talk_with_aoi_desc: "Оки Аой, глава Казначейства, неуклонно расширяла свое влияние с тех пор, как доверие к временному правительству Рин было поставлено под сомнение. По характеру своей должности она может сильно влиять на многие департаменты; поэтому обеспечение Казначейства и Оки Аой должно быть абсолютным приоритетом."
  COU_focus_intentional_manipulation: "Преднамеренная манипуляция"
  COU_focus_intentional_manipulation_desc: "Чего руководящие сотрудники Административного комитета Генерального студенческого совета ненавидят больше всего, так это ложь, коррупцию и манипуляции. Эффективный способ нанести удар по политической жизни временного правительства Нанагами Рин — разрушить доверие к ней путем преднамеренной манипуляции документами."
  COU_focus_rin_getout_please: "Резолюция об отстранении"
  COU_focus_rin_getout_please_desc: "Настал момент. Доверие к Нанагами Рин — временной с большими амбициями, но малым содержанием — рухнуло до дна. Теперь, когда Кая указана как законная новая временная, настало время сбросить Рин с трона."
  COU_stab_percent_ten_minus: "§YДоверие к временной§! ниже §Y10%§!."
