  SHE_COU_division_of_military: "Истинный владелец Башни Святилища"
  SHE_COU_division_of_military_desc: "В тот день, когда исчезновение Председателя стало известно всему Кивотосу, Арона из SCHALE начала серьезно сомневаться в легитимности и самом существовании Совета. Поскольку вооруженное столкновение стало неизбежным, напряженность в Низинах усиливается."
