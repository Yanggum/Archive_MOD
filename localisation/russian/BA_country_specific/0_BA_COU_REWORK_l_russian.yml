  COU_focus_expand_air_experience: "Расширить план летной подготовки"
  COU_focus_expand_air_experience_desc: "Фюзеляжи покрываются пылью! У нас более чем достаточно топлива, но по 'разным причинам' мы не смогли тренироваться как следует, и военно-воздушные силы — которые почти не участвовали в боях — не могут поддерживать фронт и господствовать в небе. Даже если придется попросить инженеров проявить немного понимания, мы должны расширить и выполнить план летной подготовки."
