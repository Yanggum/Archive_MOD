  COU_loss_of_justification:0 "Утрата обоснования"


  ##Альянс Кивотоса 
  COU_kivotos_alliance.1.t:0 "Страна-лидер решает отправить экспедиционные силы"
  COU_kivotos_alliance.1.desc:0 "Одна из стран-членов Организации сотрудничества Кивотоса была атакована страной, не являющейся членом, и страна-лидер решила отправить экспедиционные силы для её защиты.\n\nМы должны решить, участвовать ли в этой отправке."
  COU_kivotos_alliance.1.a:0 "Защитим Кивотос!"
  COU_kivotos_alliance.1.b:0 "Сейчас не время множить врагов."

  COU_kivotos_alliance.2.t:0 "Пакт о ненападении договорной организации Кивотоса"
  COU_kivotos_alliance.2.desc:0 "Страна-лидер предложила договор, запрещающий войны между странами Организации сотрудничества Кивотоса. Похоже, она настроена решительно продвигать его, и мы должны определить нашу позицию и то, покинем ли мы организацию."
  COU_kivotos_alliance.2.a:0 "Подписать договор."
  COU_kivotos_alliance.2.b:0 "Это вмешательство во внутренние дела."

  COU_kivotos_alliance.3.t:0 "[FROM.GetName] выходит из мирного договора"
  COU_kivotos_alliance.3.desc:0 "После недавней смены правительства в [FROM.GetName], [FROM.GetName] объявила, что выйдет из мирного договора."
  COU_kivotos_alliance.3.a:0 "Исключить их в соответствии с договором."
  COU_kivotos_alliance.3.b:0 "Сейчас не время множить врагов."

  COU_kivotos_alliance.4.t:0 "Восстановление статуса Полицейской академии"
  COU_kivotos_alliance.4.desc:0 "После передачи контроля над Башней Святилища статус Полицейской академии был временно заморожен, но мы надеялись на новый Совет, и в конце концов наши полномочия были восстановлены.\n\nТеперь мы можем возобновить нашу работу как Полицейская академия Кивотоса."
  COU_kivotos_alliance.4.a:0 "Эм... это хорошо?"

  COU_kivotos_alliance.5.t:0 "Альянс Кивотоса"
  COU_kivotos_alliance.5.desc:0 "Альянс Кивотоса — это федерация, объединяющая все академии Кивотоса. Он был создан ради стабильности Кивотоса: студенты всех академий объединяются, чтобы работать ради этой стабильности.\n\nМы должны решить, присоединиться ли к Альянсу или остаться независимыми и все равно работать ради стабильности."
  COU_kivotos_alliance.5.a:0 "Присоединимся к Альянсу."
  COU_kivotos_alliance.5.b:0 "Мы справимся сами."

  COU_kivotos_alliance.6.t:0 "[FROM.GetName] присоединяется к Альянсу"
  COU_kivotos_alliance.6.desc:0 "[FROM.GetName] присоединилась к Альянсу Кивотоса."
  COU_kivotos_alliance.6.a:0 "Будем работать ради стабильности Кивотоса."

  COU_kivotos_alliance.7.t:0 "[FROM.GetName] отвергает Альянс"
  COU_kivotos_alliance.7.desc:0 "[FROM.GetName] выразила свой отказ."
  COU_kivotos_alliance.7.a:0 "Понял."

  COU_kivotos_alliance.8.t:0 "[FROM.GetName] запрашивает вступление в Организацию сотрудничества Кивотоса"
  COU_kivotos_alliance.8.desc:0 "[FROM.GetName] выразила намерение присоединиться к Организации сотрудничества Кивотоса.\n\n[FROM.GetName] не была страной-членом, но в связи с изменениями в международной обстановке, похоже, хочет быть с нами."
  COU_kivotos_alliance.8.a:0 "Чем больше союзников, тем лучше."
  COU_kivotos_alliance.8.b:0 "Это страна, которой нельзя доверять."

  COU_kivotos_alliance.9.t:0 "Успешное вступление в Организацию сотрудничества Кивотоса"
  COU_kivotos_alliance.9.desc:0 "Усилия нашего правительства по вступлению в Организацию сотрудничества Кивотоса увенчались успехом, когда [FROM.GetName] одобрила наше членство."
  COU_kivotos_alliance.9.a:0 "Это был результат, которого мы хотели."

  COU_kivotos_alliance.10.t:0 "Неудачное вступление в Организацию сотрудничества Кивотоса"
  COU_kivotos_alliance.10.desc:0 "Несмотря на усилия нашего правительства, страна-лидер Организации сотрудничества Кивотоса отклонила наше членство."
  COU_kivotos_alliance.10.a:0 "Посмотрим, как они справятся без нас."

  COU_cooperative_treaty_ratification: "Ратификация Мирного договора Кивотоса"
  COU_cooperative_treaty_ratification_TT: "§RВаша страна ратифицирует мирный договор.§!"
  COU_cooperative_treaty_ratification_TT_FROM: "§RЭта страна ратифицирует мирный договор.§!"
  COU_cooperative_treaty_ratification_TT_JOIN: "§RВаша страна ратифицирует мирный договор, поэтому не может присоединяться к войнам стран-членов организации, которые находятся в состоянии войны.§!"
  COU_cooperative_treaty_ratification_TT_JOIN_FROM: "§RВаша страна находится в состоянии войны со страной-членом Организации сотрудничества Кивотоса, поэтому не может призвать страну, ратифицировавшую мирный договор.§!"

  landmark_COU_tower:0 "Башня Святилища"
  landmark_COU_tower_desc:0 "Башня Святилища — это здание, расположенное в сердце Кивотоса. Это место, где собираются академии и студенты Кивотоса для проведения встреч и принятия решений. Это символическое здание Кивотоса, и все решения, принятые здесь, глубоко влияют на будущее Кивотоса."

  #Открытие
  #COU_country_intro_content: "На самом деле Генеральный студенческий совет не был организацией, имеющей форму государства, как академия. Если сравнивать его с институтами Земли, Совет выполнял роль, подобную Лиге Наций, и поэтому долгое время утвердился в Кивотосе как справедливость и порядок. По крайней мере, до того трагического дня в ноябре 1935 года.\n\nВеликий Катаклизм разрушил Кивотос из конца в конец. От начала и до конца то, что считалось само собой разумеющимся, стало ложным, а то, что считалось ложным, стало принятым фактом. На этой новой земле, где мы должны были выживать, Совет не мог избежать физических столкновений со странами Низин, с которыми мы делили неудобное место. Мирный подход был проигнорирован жалкой бомбардировкой; и человечество, лишенное своего дома, взялось за оружие против Кивотоса, назвав его «захватчиком». Кивотос подавил их подавляющими технологиями и силой, но мы не можем отводить взгляд от проблем, возникших в процессе.\n\nБельгия и Нидерланды не продержались и двух месяцев в Войне в Низинах. От Бельгии, где королю едва удалось спастись, до королевы Вильгельмины, сраженной во время военной операции SRT... Великий Катаклизм оставил огромный след не только на Кивотосе, но и на человечестве.\n\nГлубокая рана, которая никогда не заживет.\n\nМудрые выбрали сотрудничество, чтобы выжить. Организация коллаборационистов, созданная под руководством Сирануй Кая и Оборонного ведомства, помогла великой реструктуризации и стабилизации Совета. Получив новый статус, они подчиняются приказам, не гнушаясь никакими средствами и методами, с молчаливого согласия Совета.\n\nИ теперь Совет должен встретить новый рассвет. От затопления мегаполиса Д.У. до сопротивления Народного фронта сопротивления — все вызовы, стоящие перед нами, обнажают грубые и явные провалы Совета и Председателя, а также горькое истинное лицо Великого Катаклизма. Больше нет времени на промедление. Совет должен снова править Кивотосом. Должен установить справедливость. Должен восстановить порядок.\n\n§RДаже если это нужно для искупления всех грехов и ошибок, совершенных, ничего не понимая.§!\n\n§YРазработка - SKSKIe, YurizonoSeia, Imika§!"
  COU_country_intro_header: "Порядок Кивотоса"
  COU_country_intro_content: "Как бы мы могли просто объяснить человечеству, никогда не слышавшему о Генеральном студенческом совете? Возможно, подходящей альтернативой будет сравнение с Организацией Объединенных Наций или с федеральным правительством Соединенных Штатов. Генеральный студенческий совет Кивотоса со столицей Д.У. в центре был великим порядком и хранителем. Он контролировал все центральные административные учреждения и, координируя споры и политику между академиями, оказывал огромное политическое влияние вплоть до Великого Катаклизма. Координационное бюро и Административный комитет, состоящий из 11 департаментов, гармонично работали вместе, чтобы выполнять административные процедуры.\n\nОднако, как и любая организация, Совет не был идеален. Хроническая нехватка административных возможностей перед лицом лавины жалоб, не поспевающее делопроизводство и укоренившийся «менталитет бюрократа» были повторяющимися проблемами, которые долгое время подтачивали репутацию Совета. Например, та популярная поговорка — слегка преувеличенная игра слов, но всё еще очень актуальная — что если попросить починить дорогу, через шесть месяцев починят только половину.\n\nТем не менее, высочайшая автономия каждой академии во многом способствовала упрощению работы Совета... а также замедляла скорость обработки. Другой проблемой была система, при которой, если административное распоряжение не было строго необходимым, каждой академии было достаточно сослаться на свою автономию, чтобы его проигнорировать."
  COU_country_intro_header_1: "Великий Катаклизм и Война в Низинах"
  COU_country_intro_content_1: "Примерно в 13:00 обычного дня... здесь, в ноябре 1935 года, Земля и Кивотос столкнулись с гигантским катаклизмом. Из-за этого инцидента, названного «Великим Катаклизмом», который никогда не будет забыт, академии были перемещены массово, и в некоторых случаях даже целые города были перенесены в этот другой мир.\n\nНекоторые места, казалось, были замещены; другие — словно исчезли навсегда. В то время как академии повсюду сталкивались с вооруженными силами местных жителей, Совет, как порядок Кивотоса, пытался решать проблемы максимально мирным путем. Председатель встретилась с премьер-министром Нидерландов и провела переговоры с королем Бельгии.\n\nНо жестокая судьба не пошла по желаемому пути. Мирные соглашения, с каждым днем всё больше затягивающиеся, и столкновения между военными организациями выросли до точки, которую невозможно было сдержать. В конце концов, Председателю не осталось ничего другого, кроме как предложить Совету метод: подавить их силой. Это был момент, когда разразилась Война в Низинах.\n\nЧтобы как можно быстрее завершить ситуацию, Председатель разрешила неизбирательный огонь с целью захвата лидеров Нидерландов и Бельгии. Это вызвало катастрофу из-за отсутствия информации: отряды Специальной академии SRT вырезали королевский дом Оранских-Нассау, пытавшийся бежать в изгнание.\n\nЭто было то, чего никто в Совете не ожидал. И, по сути, именно тогда Совет «впервые узнал», что пуля может убить человека.\n\nРезультат этой неосмотрительности и отсутствия информации был разрушительным. Узнав об истреблении королевской семьи, нидерландская армия начала сопротивляться даже с помощью самоубийственных атак, а правительство Бельгии исключило любую возможность переговоров; более того, цель — король — бежал в Конго.\n\nДругими словами: Председатель не добилась абсолютно ничего из того, что намеревалась.\n\nИ после того, как неожиданно превратилась в убийцу, месяц спустя, в декабре 1935 года, Председатель внезапно исчезла. Хотя этот факт держался в абсолютном секрете в течение месяца, до Нового 1936 года... никто не знает, как долго продержится эта хрупкая ложь.\n\nПроцедурно, Нанагами Рин, Исполнительный директор, была назначена временно исполняющей обязанности Председателя и выполняет работу, но некоторые указывают, что Нанагами Рин злоупотребляет властью."
  COU_country_intro_header_2: "Возложенный долг"
  COU_country_intro_content_2: "После Великого Катаклизма интернет-система рухнула, часть технологий Кивотоса была безвозвратно утеряна, а безудержное использование автономии академиями после Катаклизма привело к ситуации, когда Совет больше не мог оказывать никакого влияния.\n\nОсознав, что Кивотос был сброшен из эры стабильности и развития в дикость, Совет прошел через период организованной реструктуризации. Координационное бюро стало функционировать как президентская канцелярия, Административный комитет — как орган исполнительной власти, и Совет — от великого порядка — возродился как система академий; в определенном смысле, как государство, так же как академии Кивотоса.\n\nНа практике это было не чем иным, как отказом от всекивотосского контроля, но это была необходимая реформа для выживания.\n\nТеперь Совет стоит перед развилкой: обосноваться здесь, в этих Низинах, ничего не делая и наблюдать, сложа руки, как другие академии выходят из-под контроля... или бороться за то, чтобы вернуть контроль над Кивотосом, не гнушаясь никакими средствами и методами.\n\nНекоторые опасаются, что Совет, ослепленный своей былой славой, стал варварским. Однако, как порядок Кивотоса и как один из его членов, Совет получил долг — контролировать Кивотос, погруженный в хаос.\n\nЕсли Совет замешкается, ни Совет... ни кто-либо другой... не сможет предотвратить исчезновение порядка.\n\n§YРазработка : Imika§!\n§LПредыдущая разработка : SKSKIe, YurizonoSeia§!"

  #COU_guide: "Цель\n\nУстраните хаос Совета.\nКонтролируйте Арону, ИИ «Федерального исследовательского клуба SCHALE», о существовании которого мы даже не знали и который получил приказы от Председателя.\n\n§YПиршество на песчаном замке§!\n£white_dot. Провозгласите себя законным Советом и сражайтесь. За этот пир, который может оказаться не более чем иллюзией на песке.\n£white_dot. Обращайтесь с коллаборационистами осторожно. Как если бы вы дрессировали голодных львов и воронов, держа кусок мяса у них перед глазами.\n£white_dot. А после вступите в финальную битву. С коммунистами, которые никогда не смогут сосуществовать с вами под одним солнцем.\n\n§CВременно исполняющая обязанности с легитимностью§!\n£white_dot. Защищайте пост временно исполняющей обязанности в центре бури.\n£white_dot. Успокойте хаос Кивотоса и зажгите новое будущее.\n\n§RНежеланный пост§!\n£white_dot. Просто решите проблему протестов.\n£white_dot. И встретьте судьбу. Хотели вы того или нет, в конце концов это судьба, которая придет.\n£white_dot. Наблюдайте за будущим, которого вы не хотели, но которое в итоге создали. Каким бы ни был его конец, он скоро предстанет перед вами.\n\n§RИ в день, когда всё закончится, встретьте неизбежную судьбу лицом к лицу, независимо от того, каков будет исход.§!"

  COU_guide: ""
