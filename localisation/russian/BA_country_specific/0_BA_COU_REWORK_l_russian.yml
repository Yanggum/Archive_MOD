  COU_focus_air_command_coppens: "Поддержать Коппенса"
  COU_focus_air_command_coppens_desc: "Во время Войны в Нижних землях, в воздушном бою над Леуварденом, Вилли Коппенс — который сдался нам — вспомнил, что, когда он лично пилотировал передовой фюзеляж Кивотоса, он испытал огромное изумление как человек, жаждущий небес... или, другими словами, был напуган до смерти. С тех пор он продвинулся как столп и влиятельная фигура Сил обороны ВВС, и Коппенс отстаивает превосходство нашего технологического преимущества."
  COU_focus_test_kivotos_new_plane: "Анализ и исследование"
  COU_focus_test_kivotos_new_plane_desc: "После Великого Катаклизма фюзеляжи Кивотоса, пришедшие с нами, включают некоторые модели, которые еще не были найдены в остальной части Кивотоса. Мы выделим персонал лаборатории, чтобы полностью разобрать их и осмотреть, не оставляя ни одной детали без проверки, чтобы максимально ускорить прогресс наших аэронавтических исследований."
  COU_focus_air_command_donnet: "Поддержать Донне"
  COU_focus_air_command_donnet_desc: "Майк Донне, сбитый и захваченный в плен после воздушного боя над Гаагой во время Войны в Нижних землях, поклялся сотрудничать с нами. И хотя летательные аппараты, используемые человечеством, являются ранними моделями, он, лично испытав в Гааге, что массовое производство может дать преимущество в воздушной войне, отстаивает серийное производство 'подходящих' фюзеляжей."
