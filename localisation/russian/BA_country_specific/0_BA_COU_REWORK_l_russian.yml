  COU_focus_guarantee_support_weapons: "Накапливать припасы"
  COU_focus_guarantee_support_weapons_desc: "Даже армия страны с отдельными солдатами, превосходящими в бою и психической стойкости, ничего не значит, если эти солдаты голодают. По-настоящему превосходная и передовая армия — та, которая одевает свои войска в теплую одежду зимой, обеспечивает, чтобы не кончались боеприпасы, и хорошо их кормит."
