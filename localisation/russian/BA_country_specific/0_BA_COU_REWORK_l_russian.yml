  COU_we_fucked: "Раскрыть исчезновение Председателя Совета"
  COU_we_fucked_desc: "Неизвестно как, но исчезновение Председателя Совета — которое мы скрывали более месяца — просочилось в Школу Кронос. Теперь это невозможно остановить."

