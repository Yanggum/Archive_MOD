  #Экономика
  COU_focus_after_two_months: "После Великого Катаклизма"
  COU_focus_after_two_months_desc: "После Великого Катаклизма в ноябре 1935 года Генеральный студенческий совет был реорганизован в форму, подобную государству с собственной властью принятия решений; в результате промышленная база — которая обычно ограничивалась пассивным руководством и подписанием документов — стала строиться и планироваться гораздо более активно и напрямую."
  COU_focus_look_the_our_economy_fucked: "Анализ провала восстановления"
  COU_focus_look_the_our_economy_fucked_desc: "Административный комитет не знал, что экономика Нидерландов в огромной степени зависела от торговли и экспорта. Неужели это было единственное, чего мы не знали? Если мы потерпели неудачу, значит, на то были четкие причины."
  COU_economy_focus_0: "Перезапустить проект Зёйдерзе"
  COU_economy_focus_0_desc: "Проект Зёйдерзе относится к строительству дамбы, завершенному в 1932 году. Однако после Великого Катаклизма 1935 года внезапное перемещение D.U. и Башни Святилища привело к катастрофическому результату: повторному затоплению земель, отвоеванных у моря. Отправной точкой экономического восстановления станет новый проект Зёйдерзе."
  COU_establishment_of_federal_industrial_committee: "Покупка предприятий"
  COU_establishment_of_federal_industrial_committee_desc: "Предприятия движутся строгой логикой денег. Патриотическое предприятие по определению невозможно; если мы дадим им немного денег для стабилизации нашей экономики, они будут способны сделать для нас все что угодно."
  COU_tooltip_unlock_dutch_belgium_cons: "Все §Yзаблокированные конструкторы§! станут §Gдоступны§!."
  COU_focus_order_highlander: "Купить Хайлендер"
  COU_focus_order_highlander_desc: ""
  COU_focus_mineral_prospecting: "Реактивировать Лимбургский угольный бассейн"
  COU_focus_mineral_prospecting_desc: "Шахты, такие как Maurits и Winterslag в Лимбурге, полностью обанкротились в социальном хаосе Великого Катаклизма из-за сильной внешней зависимости начала 30-х годов. Но мы не можем больше игнорировать полезные и обильные шахты, которые производили до 500 миллионов тонн угля в год. Все существующие государственные шахты будут выкуплены и снова запущены!"
  COU_focus_project_delta: "Проект Дельта"
  COU_focus_project_delta_desc: ""
  COU_focus_on_industrial_complex: "Восстановить гражданскую промышленность"
  COU_focus_on_industrial_complex_desc: ""
  COU_focus_restore_cable_internet: "Восстановить кабельную сеть"
  COU_focus_restore_cable_internet_desc: ""
  COU_focus_apprenticeship_jordaanoproer: "Разобраться с Йорданским бунтом"
  COU_focus_apprenticeship_jordaanoproer_desc: "Йорданский бунт был восстанием безработных в июле 1934 года, оставившим глубокую рану в голландском обществе. Мы, как наследники той ситуации, обязаны — как ответственные за экономическое восстановление Нижних земель — разрешить его."
  COU_focus_have_with_galopin: "Принять принцип Галопена"
  COU_focus_have_with_galopin_desc: "'Патриотичные' бельгийцы — то есть нелояльные — в своем отчаянном сопротивлении, пытаясь сохранить свою промышленную и экономическую структуру, доставили нам много хлопот: комитет Галопена во главе с Александром Галопеном отстаивал так называемый принцип Галопена. Но если мы застанем их врасплох и, вместо сопротивления, примем этот принцип и активно сотрудничаем с ними, мы сможем абсорбировать их потенциал без серьезного ущерба."
  COU_focus_absorption_belgian_assets: "Абсорбировать бельгийские активы"
  COU_focus_absorption_belgian_assets_desc: ""
  COU_focus_plan_de_man: "План Де Мана"
  COU_focus_plan_de_man_desc: "Этот трудовой план, разработанный Де Маном в 1933 году, представляет его доктрину планирования: он стремится создать национализированный сектор — включающий кредитную организацию и ключевые, уже практически монополизированные отрасли — для построения системы смешанной экономики. Хотя левые движения, особенно Троцкий, критиковали его от 'плана обмана рабочих' до 'реформированного инструмента консерватизма буржуазной демократии', эффективный и действенный план Анри Де Мана наконец нашел подходящий момент и должен быть выполнен."
  COU_focus_have_with_hirschfeld: "Назначить Хиршфельда"
  COU_focus_have_with_hirschfeld_desc: "Если местные жители создают какой-то кустарный комитет для экономического сопротивления, то мы создадим более изощренный комитет, чтобы противостоять им. Хиршфельд, сторонник протекционизма в эпоху господства идеологии свободной торговли и молодой директор Министерства труда, торговли и промышленности, является многообещающим экономистом среди коллаборационистов Генерального студенческого совета. Мы официально привлечем его для построения нашей собственной экономики."
  COU_focus_expansion_of_protectionism: "Расширить протекционизм"
  COU_focus_expansion_of_protectionism_desc: "Хиршфельд, убежденный сторонник протекционизма, запросил расширение тарифного обложения — ранее ограниченного местными государствами — для защиты парализованной промышленности и выращивания новых отраслей, а также расширение импортных квот и продление сроков субсидий."
  COU_focus_plan_de_vos_tinbergen: "План Де Фоса–Тинбергена"
  COU_focus_plan_de_vos_tinbergen_desc: "Этот план, задуманный в 1935 году, но так и не реализованный, был совместно написан Хейном Восом и Яном Тинбергеном. При участии Казначейства переписанный план предусматривает инвестиции в 200 миллионов иен в общественные работы через Общий экономический совет, способный координировать предприятия, рабочих и Административный комитет, трудоустроить 200 000 человек и, используя эффект мультипликатора, повысить покупательную способность рабочего класса для оживления экономики."
  COU_focus_currency_unification: "Денежная унификация"
  COU_focus_currency_unification_desc: ""
  COU_focus_abandon_the_gold_standard: "Частично вернуть золотой стандарт"
  COU_focus_abandon_the_gold_standard_desc: ""
  #COU_focus_modernizing_agriculture: "Модернизация сельского хозяйства"
  #COU_focus_modernizing_agriculture_desc: "[Отмененный фокус]"
  COU_focus_eco_rework_the_dead_lands: "Обязательная установка насосов в Нижних землях"
  COU_focus_eco_rework_the_dead_lands_desc: "Хотя дамба Зёйдерзе была восстановлена, из-за особенностей рельефа Нижних земель почва все еще мягкая и с несовершенным основанием. Чтобы преодолеть это и полностью закрыть ущерб от наводнений, мы должны обязать установку насосов."
  COU_focus_rework_our_roads: "Обеспечить резервы поездов Хайлендер"
  COU_focus_rework_our_roads_desc: ""
