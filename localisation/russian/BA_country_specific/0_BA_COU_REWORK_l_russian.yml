  COU_mission_defence: "Особое поручение: оборона военных фабрик"
  COU_mission_defence_desc: "Некоторые военные фабрики, находящиеся под прямым контролем Генерального студенческого совета, часто ошибочно считаются 'заброшенными', и поэтому часто становятся целью таких фракций, как Сукэбаны. Мы воспользуемся этой возможностью, чтобы четко их предупредить."
  COU_mission_battle_with_gangs: "Особое поручение: возвращение военных припасов"
  COU_mission_battle_with_gangs_desc: "После Великого Катаклизма Офис обороны не смог вернуть немалое количество военного имущества — например, огнестрельного оружия. Это нельзя игнорировать: мы должны сформировать специальную команду и вернуть утерянные предметы."
