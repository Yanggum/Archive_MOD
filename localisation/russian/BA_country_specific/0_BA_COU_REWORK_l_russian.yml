  #Экран выбора 
  COU_GATHERING_STORM_DESC: "Генеральный студенческий совет Кивотоса, расположенный в центральном районе города-академии-гиганта Кивотоса — федерации, состоящей из тысяч больших и малых школ, — это учреждение, которое контролирует все центральные административные объекты и координирует споры, политику и конфликты между академиями в автономных районах.\n\nЕще не так давно Кивотос двигался под «порядком Совета». Все академии следовали нашим приказам и подчинялись.\n\nК сожалению, этот ничтожный порядок, возглавляемый Советом, впал в состояние вне контроля из-за бедствия под названием «Великий Катаклизм». Похоже, день, когда порядок снова восстанет, наступит не сегодня."
  #Какое решение примет Председатель, чтобы преодолеть эту беспрецедентную ситуацию?