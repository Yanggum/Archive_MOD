  COU_focus_confidence_and_supply: "Доверие и компенсация"
  COU_focus_confidence_and_supply_desc: "Временный режим Рин должен продолжаться. Его легитимность — столп, который никто не может отрицать; то, что нам нужно сейчас, — это не изнурительная политическая война, а реальное сотрудничество, чтобы выправить хаос на новых основаниях, которые она подготовила. И ключевая процедура для этого — выполнить 'доверие и компенсацию' в пользу временной Рин."
