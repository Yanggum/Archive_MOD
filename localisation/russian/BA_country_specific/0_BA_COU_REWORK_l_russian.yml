  COU_focus_dual_leader_system: "Система коллективного руководства"
  COU_focus_dual_leader_system_desc: "Возникла новая система. Не сумев устойчиво преодолеть низкое общественное доверие, Нанагами Рин ушла с поста временной по предложению Оки Аой. Однако низкая местная поддержка Оки Аой вынудила ее вступить в странные отношения сотрудничества с Юраги Момокой, и новая система коллективного руководства начала функционировать."

