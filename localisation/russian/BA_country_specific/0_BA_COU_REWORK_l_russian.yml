  #Военное дело
  COU_reorganizing_the_defense_office: "Реорганизовать Силы обороны"
  COU_reorganizing_the_defense_office_desc: "Силы обороны, созданные после Великого Катаклизма из-за необходимости в вооруженных силах, показали выдающийся уровень подготовки и результатов благодаря высоким зарплатам и профессиональным программам обучения. Однако трагические примеры других академий предполагают, что такая грандиозная военная система не может существовать долго. Даже если вспыхнет недовольство среди войск, реорганизация в обычную армию неизбежна."
  COU_focus_introduction_of_defendu: "Внедрить Defendu"
  COU_focus_introduction_of_defendu_desc: "Система ближнего боя, известная как Defendu, представляет собой комбинированную тактику, разработанную в 20-х годах Уильямом Э. Фэйрбэйрном и Эриком А. Сайксом для обучения полиции Шанхая. Если мы внедрим эту полезную тактику — своего рода неполноценную альтернативу CQB — мы сможем повысить вероятность выживания и обеспечить победу, предложив альтернативу CQB местным армиям с устаревшим тактическим мышлением и снаряжением."
  COU_focus_invite_collaboraters_to_high_command: "Включить коллаборационистов в Верховное командование"
  COU_focus_invite_collaboraters_to_high_command_desc: ""
  COU_focus_annex_small_armies: "Принять командование малыми академиями"
  COU_focus_annex_small_armies_desc: "В Кивотосе существуют очень маленькие или почти забытые академии; некоторые из них удалось контролировать во время Великого Катаклизма вместе с D.U. или благодаря административной способности Генерального студенческого совета. Хотя эти академии обладают автономией и имеют свои собственные армии и системы безопасности, их структуры слишком ненадежны, чтобы на них полагаться; поэтому принятие нами их цепи командования будет полезнее как для них, так и для нас."
  COU_focus_unification_ammunition_process: "Унифицировать процесс производства боеприпасов"
  COU_focus_unification_ammunition_process_desc: "С тех пор как Генеральный студенческий совет подчинил военные заводы Нижних земель, стало трудно эффективно использовать предприятия из-за различий в процессах между фабриками Кивотоса и другими: разные боеприпасы, или даже одни и те же боеприпасы, но с разными процедурами на более детальных производственных линиях. Для эффективного производства боеприпасов необходима унификация процесса."
  COU_focus_order_to_fn_herstal: "Инспектировать оборонный арсенал"
  COU_focus_order_to_fn_herstal_desc: ""
  COU_focus_assumption_of_hemberg_military_factory: "Реактивировать арсенал Хембрюг"
  COU_focus_assumption_of_hemberg_military_factory_desc: ""

  #Сухопутные войска
  COU_focus_build_military_culture: "Укрепить дисциплину"
  COU_focus_build_military_culture_desc: "С момента своего создания в 1935 году Силы обороны суши демонстрировали 'действительно удивительную' дисциплину и нормы. Пропускать тренировки было минимумом: они избегали боя и разворовывали расходы, среди прочих серьезных проблем. Чтобы они выполняли функцию армии, приоритетно укрепить эту упавшую дисциплину."
  COU_focus_defensive2: "Признать исключительную ситуацию" # если id и gfx-код совпадают, выводится соответствующий gfx
  COU_focus_defensive2_desc: "Большинство тех, кто составляет армию пехоты с ореолом, — все еще подростки из старшей школы или даже младше. Навязывать им суровую военную дисциплину и строгую иерархию было бы слишком жестоко. Признание этой исключительной ситуации и избегание чрезмерно суровых мер может быть правильным путем."
  COU_focus_ready_for_tank_assembly: "Подготовить массовое производство танков"
  COU_focus_ready_for_tank_assembly_desc: ""
  COU_focus_more_tank_production_line: "Расширить производственную линию"
  COU_focus_more_tank_production_line_desc: ""
  COU_focus_replan_vastion_holland: "Возобновить Vesting Holland"
  COU_focus_replan_vastion_holland_desc: "Vesting Holland было ядром стратегии национальной обороны голландской армии в 30-х годах: тактика, основанная на сильной обороне, использующей естественную местность и укрепления от нынешнего района Ширатори до зоны Харухабара. Наша основная стратегия должна принять форму обороны с последующим контрударом."
  COU_focus_great_operation_system: "Система всеобъемлющих операций"
  COU_focus_great_operation_system_desc: ""
  COU_focus_central_military_reserach: "Механизированная армия"
  COU_focus_central_military_reserach_desc: ""
  COU_focus_tank_assembly: "Процесс сборки"
  COU_focus_tank_assembly_desc: ""
  COU_focus_tactical_advantage: "Тактическое преимущество"
