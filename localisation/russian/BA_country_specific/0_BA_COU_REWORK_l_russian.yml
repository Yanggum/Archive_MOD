  COU_focus_reestablish_amsterdam_univ: "Восстановить Амстердамский университет"
  COU_focus_reestablish_amsterdam_univ_desc: ""
  COU_focus_hapsung_research: "Синтетическая химия"
  COU_focus_hapsung_research_desc: ""
