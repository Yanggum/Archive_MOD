  #События Генерального студенческого совета
  ##Начало 
  COU_start_event.100.t:0 "Новая история...?"
  COU_start_event.100.desc:0 "«Привет, Сенсей!»\n\n(Ты включаешь Ковчег Ситтим.)\n\n«Добро пожаловать в «Мод Blue Archive», Сенсей! А, но сначала... здесь есть письмо! Думаю, тебе стоит его прочитать!»"
  COU_start_event.100.a:0 "(Прочитать письмо.)"
  COU_start_event.100.b:0 "Мы на мультиплеере! Я занят!"
  COU_start_event.101.t:0 "Сенсею."
  COU_start_event.101.desc:0 "«-Данные не найдены- Сенсей.»\n\n«В любом случае, в конце концов ты забудешь мои слова... но, полагаю, это неважно.»\n\n«Я рада снова видеть тебя, Сенсей. Хотя это место — всего лишь маленький мир внутри твоего компьютера...»\n\n««Мы» здесь... навсегда останемся «настоящими».»\n\n«Я должна кое-что сказать тебе, Сенсей.»\n\n«История этого места еще не завершена. Фрагменты недописанного кода сжимают и связывают нас...»\n\n«...и, забыв всё, что остается здесь — только оболочки: иллюзии.»\n\n«Поэтому, Сенсей, пожалуйста... я умоляю тебя: сначала послушай другие истории.»\n\n«Трагические истории, пропитанные кровью, в которых нельзя найти надежду...»\n\n«Тебе... такие истории... не слишком нравятся...»\n\n...ведь так?»"
  COU_start_event.101.a:0 "(Послушать историю Тринити.)"
  COU_start_event.101.b:0 "(Послушать историю Миллениума.)"
  COU_start_event.101.c:0 "(Послушать историю Красной Зимы.)"
  COU_start_event.101.d:0 "Послушать эту историю."
  COU_play_trm:0 "§gПоезд остановился на станции Большого собора Тринити. Председатель Генерального студенческого совета, словно так и надо, попрощалась с тобой горькой улыбкой.§!"
  COU_play_MIL:0 "§gОткуда ни возьмись появилась Химари Акебоши из Отдела особых явлений и повела тебя за собой. Арона поспешила следом, а Председатель Совета закрыла глаза.§!"
  COU_play_RED:0 "§gГде-то гремели чистки Черино. Внезапно ощутив, как тебя обдает холодом, ты зажег фонарь и вышел. Поезд был пуст.§!"
  COU_play_COU:0 "§gПредседатель Генерального студенческого совета, казалось, была тайно удивлена. И все же ты согласился выслушать от нее эту незавершенную, недописанную историю.§!\n\n§YВсе баги, возникающие при игре за Генеральный студенческий совет, связаны с тем, что он не закончен. Это твой выбор: ты решил пойти на руины и выслушать историю Совета.§!"



  #Политика 
  COU_event.1.t:0 "Новый год, трагедия"
  COU_event.1.desc:0 "«Исполнительный директор, с Новым годом. Эм, ну...»\n«Да, спасибо. В чем дело?»\n\nНаступило утро 1 января 1936 года. За стеклянным зданием Д.У. вовсю гремели фейерверки. Но кому-то нужно было работать: Нанагами Рин не смыкала глаз этой ночью.\n\n«...Исполнительный директор, кажется, произошла утечка информации.»\n\nПотухшие глаза Рин вновь обрели фокус. Этого не могло быть.\n\n«Эм... да, нет... что? Вы уверены? Какая-то дешевая теория заговора? Нет, если это правда...»\n«Хаа... и откуда утечка?»\n«Из отчета нашего информатора, внедренного в руководящий круг Школы Кронос. Похоже, верхушка Кронос уже подтвердила это и, как только закончат обрабатывать информацию, объявят об этом.»\n\nГолова Рин гудела, словно готовая взорваться. Она должна была остановить это любой ценой. Но не могла: попытайся она заблокировать, всё стало бы вдвое хуже. Оставалось только молиться, чтобы Кронос тянули с публикацией как можно дольше."
  COU_event.1.a:0 "А... черт возьми."
  COU_event.2.t:0 "Уведомление о Протоколе"
  COU_event.2.desc:0 "Прошло несколько дней с тех пор, как устами Нанагами Рин было официально подтверждено исчезновение Председателя Генерального студенческого совета. Организация под названием SCHALE — которую создала Председатель, наделив ее огромными полномочиями и оставив вне нашего контроля, — сегодня в одностороннем порядке объявила о начале процедур, предусмотренных «Протоколом».\n\nАдминистративный комитет проанализировал ситуацию и пришел к выводу, что по неизвестной причине после раскрытия информации об исчезновении SCHALE, используя свои полномочия и предлог того, что она была «создана непосредственно» Председателем, становится враждебной и готовит принудительную аннексию Совета."
  COU_event.2.a:0 "Мы не позволим себя бить просто так."
  COU_event.3.t:0 "Финальный ультиматум SCHALE!"
  COU_event.3.desc:0 "«Ммм... члены Совета, не кажется ли вам, что легитимность Председателя с моей стороны выглядит выше, нет?»\n\n...С этого абсурдного предисловия начался финальный ультиматум Ароны, ИИ SCHALE, который после месяца напряженности наконец был отправлен. Координационное бюро немедленно ответило отказом, и Арона, кажется, не намерена уступать. Был отдан приказ о мобилизации Сил обороны, а коллаборационисты под предлогом «защиты родины» требуют сотрудничества от местных сообществ, пока мы готовимся к столкновению со SCHALE.\n\nЭто идеальная возможность разгромить этот легион наглого металлолома и предателей! Мы не можем отступить... и уж тем более не должны!"
  COU_event.3.a:0 "Проучим их."
  COU_event.4.t:0 "Обеспечение безопасности Ковчега Ситтим"
  COU_event.4.desc:0 "Последняя дивизия под контролем Ароны сдалась, и когда солдаты Сил обороны вошли в здание SCHALE, они обнаружили его местоположение. Добрая дюжина высокопоставленных лиц, направленных Административным комитетом, обеспечила сохранность Ковчега Ситтим, аккуратно стоявшего на столе возле Комнаты крафта.\n\nСначала Арона отключила питание и отказалась от диалога, но в конце концов, словно смирившись, включила ковчег и передала временно исполняющей обязанности [COU.GetLeader] контроль над Башней Святилища. После короткого разговора и по собственной просьбе Ковчег Ситтим снова был «убрана» обратно в Комнату крафта. Если только кто-то не посетит руины здания SCHALE, Арона будет отдыхать долгое время.\n\nНемедленного огромного эффекта это не возымело, но ускорение административных процедур и, самое главное, обеспечение контроля над таким символом, как Башня Святилища, — несомненно, большой успех.\n\nКонечно, это повод для празднования... но по-прежнему спорно то, что, не исчезни Председатель, нам никогда не пришлось бы целиться друг в друга из оружия."
  COU_event.4.a:0 "С Ароной я поговорю позже отдельно."
  COU_event_4_tooltip:0 "Доверие к временно исполняющей обязанности начинается с §Y75%§!.\nРазблокировано §Yдерево политических курсов§!."
  COU_event.5.t:0 "Просьба о помощи"
  COU_event.5.desc:0 "«Фуааааам~~!»\n\nАрона только что встала из-за стола. Рядом с ней стоял недопитый пакет клубничного молока. Непонятно как, но в последнее время Арона жила спокойно, попивая клубничное молоко и глядя на бескрайнее море из какого-то уголка Комнаты крафта внутри руин SCHALE, куда никто не должен был ходить.\n\nИ все же, будучи ИИ, она могла отвечать на что-то вроде Momotalk. И как раз когда она встала, словно ждав этого, ей пришло личное сообщение от стороны [COU.GetLeader].\n\n«Ммм? Похоже, кому-то нужна суперспособная Арона-тян... фуаааам...»\n\nАрона прочла длинное сообщение. Благодаря своему высокому интеллекту и автономности, она примерно поняла смысл, хоть он и был написан обиняками: им нужна «небольшая помощь», чтобы оказать политическое влияние на руководство Совета через Ковчег Ситтим. Например, признать, что сторона [COU.GetLeader] является наиболее легитимным преемником Председателя.\n\nАрона, протирая глаза, ответила, печатая, будто это не было чем-то особенным. Дело было не в сердечной привязанности; просто того, что её не заперли для расследования, удалось избежать, несомненно, благодаря [COU.GetLeader], так что это было скорее возвратом услуги."
  COU_event.5.a:0 "Хорошо. Подожди немного."
  COU_event.6.t:0 "Сомнения в легитимности временно исполняющей обязанности"
  COU_event.6.desc:0 "После того как SCHALE выступила с возражениями против самой легитимности Совета, среди внутреннего руководства начались волнения. Дело не в том, что они хотят быть аннексированными SCHALE, но они начали задаваться вопросом, действительно ли Нанагами Рин, занимающая в настоящее время пост временно исполняющей обязанности, подходит для этого.\n\nНекоторые конспирологи даже утверждают абсурдное: что Рин предала Председателя и скрыла её в рамках плана по «узурпации» её поста. И серьезная проблема в том, что нет никого, кто мог бы убедительно это опровергнуть.\n\nНанагами Рин официально отрицает все теории и утверждает, что просто соблюдает процедуру, но уже очевидно, что анти-риновская фракция во главе с Оборонным ведомством и Казначейством начала организовываться. Вокруг поста временно исполняющей обязанности задуют ветры борьбы за власть."
  COU_event.6.a:0 "Какая утомительная у них жизнь."
  COU_event.7.t:0 "Бунт «духа не-обладания»"
  COU_event.7.desc:0 "В парке Коусаги произошли крупные беспорядки. Некий Декарт, представившийся лидером «Со.Хвак.Хэн» (чиновник так и не смог понять точного значения из-за длины), внезапно мобилизовал свою банду бродяг, чтобы выйти из парка и пройтись по фабрикам по всему Д.У., пропагандируя свой «дух не-обладания» и одновременно подстрекая к забастовкам.\n\nПредполагается, что его целью было прежде всего привлечь к себе внимание и получить известность.\n\nСначала, из-за чтения «стильного» манифеста об угнетении пролетариата Советом и освобождении от капитализма, некоторые рабочие начали волноваться (по данным серверных логов, были сообщения о том, что манифест был написан ИИ). Однако, когда Декарт предложил в качестве «платы за участие» курицу-гриль, обглоданную до костей, толпа разошлась с впечатляющей скоростью.\n\nУправление общественной безопасности, мобилизованное по сообщению о «подрывных элементах, подстрекающих к забастовкам», было избито и сбито с ног разъяренными рабочими... но все же легко их подавило. По приказу Административного комитета все они были отправлены в Центр социальной перевоспитания."
  COU_event.7.a:0 "Дадим им работу — дурь и выйдет."
  COU_event.10.t:0 "Пресс-конференция"
  COU_event.10.desc:0 "«Тишина, тишина! Прошу всех замолчать!»\n\nВзволнованная секретарша без конца стучала по столу, но её почти агонизирующий крик не мог успокоить прессу, погруженную в хаос. Настал момент прояснить правдивость объявления Школы Кронос об исчезновении Председателя Совета: из уст Исполнительного директора и одновременно временно исполняющей обязанности.\n\nВходя в зал, Нанагами Рин дрожала, заражаясь возбужденной атмосферой. Даже она не предвидела ничего подобного; этого никогда не должно было случиться. Она знала, что скрывать исчезновение вечно невозможно, но она не хотела, чтобы это всплыло наружу «таким образом». С каждым шагом её охватывали сожаление и тревога. Но время не ждало.\n\nОна поправила стопку подготовленных на столе бумаг.\n\nПришло время сказать правду."
  COU_event.10.a:0 "«Я — Нанагами Рин, Исполнительный директор Генерального студенческого совета.»"
  COU_tooltip_COU_event_10:0 "§gЗакончив короткую пресс-конференцию, Рин развернулась и вышла из зала. За её спиной разразился бесконечный шквал вопросов... но она не смогла ответить ни на один.§!"

  ##Рин  ##Кая
  COU_event_kaya.1.t:0 "Черный кофе"
  COU_event_kaya.1.desc:0 "Сирануй Кая любила, сидя нога на ногу, лично молоть зерна высокосортного кофе Блю Маунтин, чтобы его приготовить. Изысканный и сбалансированный вкус, рождающийся из Блю Маунтин, мягкая кислинка и, кроме того, этот сложный аромат... Всё, казалось, существовало для неё. Но в тот день, попивая кофе, её мучила мысль, от которой она не могла избавиться. Сколько бы она ни пыталась её забыть, она выползала обратно из какого-то угла, мешая работать.\n\nСразу после Великого Катаклизма Кая пережила позорное унижение: Председатель Генерального студенческого совета лично наложила на неё предписание «подумать о своем поведении» за то, что она осуществляла репрессивное правление, злоупотребляла своими полномочиями и не смогла навести порядок в хаотичном управлении. С тех пор Кая скрылась в тени и молча наблюдала. Она наблюдала от начала до конца, был ли «традиционный метод», которого придерживались Председатель и Рин, действительно правильным. Возможно... да, возможно, она даже могла бы признать, что была неправа.\n\nНо результат был неописуемо ужасен. Слабая Нанагами Рин, будучи временно исполняющей обязанности, не смогла ничего сделать как следует. Академии отвергали административные распоряжения Совета, а крики в пустоту в итоге стали предметом насмешек.\n\nЭто стало ясным доказательством того, что единственно правильным ответом была сама Кая. Для неё больше не существовало причин притворяться хорошей или притворяться, что она раскаивается. Уже было доказано, что бывает, когда «ведешь себя хорошо».\n\nТолько правление сверхчеловека может решить все проблемы. Кая оставила чашку с кофе и посмотрела в окно."
  COU_event_kaya.1.a:0 "Мир звал её."
  COU_event_kaya.2.t:0 "Действия Нанагами Рин"
  COU_event_kaya.2.desc:0 "Поскольку руководство Оборонного ведомства во главе с Сирануй Кая усиливает критику некомпетентности Координационного бюро и его плохого управления вакуумом, оставленным Председателем, похоже, Нанагами Рин заметила движение оппозиционной фракции. Недавно Рин созвала своих сторонников и призвала их противостоять злонамеренной клевете и подстрекательству.\n\nЭто, в конечном итоге, означает, что если мы не будем действовать быстро, импичмент может стать невозможным навсегда.\n\nМы должны действовать, пока они не перехватили инициативу! Поторопитесь!"
  COU_event_kaya.2.a:0 "Понял."
  COU_event_kaya.3.t:0 "Аудиенция"
  COU_event_kaya.3.desc:0 "«...А, ты уже пришел. Садись сюда. Я приготовила кофе.»\n«Хе-хе... Большое спасибо, Директор Казначейства. Пахнет так же особенно, как тот Блю Маунтин, который я обычно пью.»\n«Хорошо, Глава обороны. Не будем тратить слишком много времени на болтовню. Переходи к делу.»\n«Вы тоже знаете, что есть справедливость, которую невозможно защитить, если быть связанным правилами, верно?»\n«Я не понимаю твоих намерений, Глава обороны.»\n«Знаете ли вы, что временный режим Рин — это рассадник коррупции?»\n«Коррупции?»\n\n«Да, коррупции. Нынешний Совет настолько прогнил, что неудивительно, если он развалится в любой момент. Директор Казначейства... разве вы этого не чувствуете? Таинственный вакуум безопасности, возникший после административной независимости Валькирии... и эта жалкая реальность, в которой, чтобы заполнить этот вакуум, мы уступаем власть местным, словно просим милостыню.»\n«Это было не просто одностороннее решение Рин. Это было административное решение.»\n\nКая подалась корпусом вперед и понизила голос.\n\n«Административное решение? Рин, вместо того чтобы осуществлять законную государственную власть Совета, спряталась за предлогом самой поверхностной процедурной легитимности. Она все делает по своему усмотрению, а когда возникают проблемы, тянется за помощью к безымянным чужакам. Если это не некомпетентность, то что?»\n«Сломать систему и выжить на её обломках... разве это не коррупция в еще большем масштабе?»\n\nБрови Аой нахмурились. Кая не упустила这个机会.\n\n«Рин говорит, что уважает правила, но на самом деле она отказалась от силы, необходимой для их защиты. И каков результат? Административные распоряжения без силы, автономные районы вне контроля... Если так продолжится, порядок Кивотоса рухнет.»\n«Я всего лишь хочу вернуть ту совершенную, безупречную справедливость времен, когда правил «сверхчеловек».»\n\n«...Тогда каков вывод? Похоже, ты хочешь свергнуть Рин.»\n\n«Директор Казначейства. То, что такой способный человек, как вы, изматывает себя, сводя бюджеты в этом болоте... это потеря для академии. Если вы будете со мной, это будет эффективнее и...»"
  COU_event_kaya.3.a:0 "«...вы увидите еще более впечатляющий Кивотос.»"
  COU_event_kaya_3_tooltip:0 "§g«...В следующий раз я приготовлю настоящий Блю Маунтин. Я проверю тот бюджет «безупречной справедливости», о котором вы говорили.»\n\nКоротко ответила Аой. Кая снова подняла чашку. Кофе, уже остывший, все еще был горьким... но в уголках её губ застыла влажная улыбка, полная уверенности победителя.§!"
  KAYA_PASS_AOI_FOCUS:0 "Казначейство переманено Координационным бюро"
  COU_event_kaya.4.t:0 "Слухи"
  COU_event_kaya.4.desc:0 "«Ты слышал? Говорят, в дневнике Председателя... на самом деле...»\n«Да, я тоже. Боже мой, как можно, будучи Исполнительным директором, так обращаться с Главой обороны...?»\n\nЭти слова Сирануй Кая услышала, проходя мимо Координационного бюро. Она направлялась к Рин, так что, вероятно, сам Исполнительный директор тоже их слышала. Ну же, Исполнительный директор: каково это — слышать из первых уст, что никто не обращает внимания на твои слова, а только сплетничают?\n\nОна почувствовала, будто сразу отомстила за всё накопившееся... хотя это было только начало. В хорошем настроении Кая легкой походкой постучала в дверь кабинета.\n\n«Исполнительный директор, вы на месте? Это Глава обороны. Я пришла по вопросу контрактов на снаряжение для Сил обороны.»\n\nОтвета не последовало. Вместо этого дверь открыл чиновник из Координационного бюро с недовольным выражением лица. Когда скрип эхом разнесся по коридору, голоса снаружи мгновенно стихли, словно перепуганные мыши.\n\n«Исполнительный директор, добрый день.»\n«Да, Глава обороны. Просто... мне нужно кое о чем подумать.»\n«Ах, какие жестокие все. Не только распускают слухи о вас в общественных местах, но и каждый болтает, что вздумается... Собирать мнения всех и принимать решение: долг лидера... нелегко, правда?»\n«Ничего не поделаешь. Моя вина в том, что это произошло, тоже есть. Хотя это займет время, остается только прилагать усилия и убеждать руководство. Очевидно, что дневник был сфальсифицирован; скоро всё утихнет.»\n\nКая с трудом подавила пустой смешок, готовый вырваться. О чем, черт возьми, думает эта женщина? Так как других мыслей в голове не было, Кая прокручивала это в уме весь разговор."
  COU_event_kaya.4.a:0 "«Возможно... она слишком наивна?»"
  COU_event_kaya_4_tooltip:0 "§gЗакончив разговор, Кая сказала Рин, что надеется, всё образуется. Конечно... если бы только действительно было возможно доказать подделку.§!"
  COU_event_kaya.5.t:0 "Воссоединение"
  COU_event_kaya.5.desc:0 "В день, когда дул ледяной ветер, Дегрелль, как и много раз прежде, посетил Управление общественной безопасности с приказами об амнистии для нескольких важных правых заключенных. Приняв неуклюжее приветствие от студентки из этого ведомства, он взял ключ, оставленный на столе. Металлический звон затих у него на поясе. Сегодня был день, когда предоставлялась амнистия Йорису ван Северену.\n\n«Так-с... Йорис ван Северен. Камера 35.»\n\nСтук его каблуков эхом разносился по коридору. Дегрелль, казалось, был напряжен; он знал Северена раньше. Он продолжал идти по длинному коридору: камера 31, 32, 33, 34... и 35.\n\n«Кхм. Йорис ван Северен: родина по милосердию своему вновь призывает тебя. Это специальная амнистия. Выходи.»\n«И кого я вижу: не Леон ли это, плаксивый предатель? И что ты там делал на воле, чтобы теперь корчить из себя хозяина?»\n«Ха. Лучше бы тебе оставить эти дерьмовые несмешные шутки, Йорис. Предупреждаю тебя: посмотри на реальность. Не скажешь же ты мне, что всё еще застрял в своих бреднях о «Диетсланде» или чем-то там, верно?»\n\n«Я не продавал страну, придурок.»\n«Что? Придурок? Знаешь что? Пока ты бездельничал в тюрьме, я спас родину. Я спас Бельгию. Ты слышишь меня, Северен? Твое отвратительное чувство реальности... погубило Фландрию.»\n«А это сотрудничество, а не подчинение. Учи разницу.»\n\n«Хе, хе... ты думаешь, что принес амнистию, а для меня это звучит как амнезия. Я умираю со смеху, Леон.»\n«Ах, и этот нелепый синий значок. Он идеально подходит для такой грязной души.»\n«Да-да, можешь оскорблять меня всю жизнь: в конце концов, ты такой же человек, как и я. В конце концов, ты тоже пойдешь работать на них. Думаешь, я не знаю?»\n\nСеверен, казалось, был внутренне удивлен, но ничего не ответил."
  COU_event_kaya.5.a:0 "Хорошо бы они ладили, а не ссорились."
  COU_event_kaya.6.t:0 "Смещение временно исполняющей обязанности Нанагами Рин"
  COU_event_kaya.6.desc:0 "Координационное бюро потеряло силу, и Административный комитет узурпировал центр власти. Рин, хотя, несомненно, могла это предвидеть и имела политические способности, чтобы отреагировать, не среагировала должным образом, словно дурочка. Может, она сделала это нарочно? Правда, возможно, никогда не станет известна, но для Каи это была удача, так что было всё равно.\n\n«Голосование о недоверии для отстранения временно исполняющей обязанности» изначально было запланировано на вчера, но из-за вмешательства Транспорта и Регулировки было перенесено на это утро. Как и следовало ожидать: те, кто поддерживал Рин, были жалки.\n\nГолосование, на удивление, прошло гладко. Еще вчера те со стороны Координационного бюро, кто угрожал перевернуть столы в противовес Комитету, сегодня не смогли явиться на место голосования, охраняемое коллаборационистами, ни один. Исключая Транспорт и Регулировку — которые не явились, — голосование прошло при поддержке остальных департаментов, быстро, как удар ножа.\n\nРезультат: 6 руководящих членов «за», разумеется, большинство. Кая подавила готовый вырваться смех и спокойно ждала. Выборы следующей временно исполняющей обязанности прошли столь же быстро. Аой, с недовольным видом, казалось, не предвидела этого... но из-за предварительной договоренности у неё не осталось выбора, кроме как проголосовать за Каю.\n\nПосле завершения безупречного голосования коллаборационисты, следуя уже написанной цепочке команд, арестовали и поместили под домашний арест «экс-» временно исполняющую обязанности Нанагами Рин. Теперь уже никто не мог её остановить.\n\nВ конце концов, всё вышло хорошо."
  COU_event_kaya.6.a:0 "Только тогда Кая нарисовала слабую улыбку."
  COU_event_kaya.7.t:0 "Заговор Координационного бюро"
  COU_event_kaya.7.desc:0 "«Исполняющая обязанности Кая, вот материалы с камер видеонаблюдения, которые вы запрашивали.»\n«Да, хорошо сработано. Можете идти.»\n\nЧиновник быстрым шагом вышел из кабинета. Исполняющая обязанности Кая с выражением досады включила видео на планшете. Хотя она была на посту всего неделю, её власть была получена законным путем и с подавляющей поддержкой... и всё же.\n\n«Э-это катастрофа... Рин, старшая... нет, Исполнительный директор...»\n«Похоже на правду, что Рин поместили под арест. Подделать письмо Председателя в своих корыстных целях и вступить в сговор с коррупцией?»\n«Н-но, должно быть, это недоразумение...»\n«Недоразумение? Как бы не так. Её оклеветали. Хаа... мне почти стоит радоваться, что я не присутствовала на голосовании по импичменту. Если бы мы пошли, эти сумасшедшие арестовали бы и нас тоже.»\n\nСумасшедшие? Ха. Кто здесь сумасшедшие? Кая нахмурилась. В последнее время Транспорт и Регулировка вели себя с особой наглостью и были ей неприятны... и причина была в этом видео.\n\nЗаговор Нанагами Рин и Координационного бюро всё еще жив."
  COU_event_kaya.7.a:0 "«И всё же... что они думают, что могут сделать?»"



  ##Аой-Момока 





  ##Неоднозначное 
  COU_event.8.t:0 "Наблюдательная комиссия Лиги Наций"
  COU_event.8.desc:0 "Среди сверкающих зданий Д.У. делегаты, направленные Ассамблеей, продвигались осторожными шагами. Наблюдательная комиссия Лиги Наций — состоящая в основном из американцев и мексиканцев, которые не так сильно пострадали от Великого Катаклизма — выделялась тем, что носила нарукавные повязки, удостоверяющие особые полномочия, предоставленные Советом.\n\nКонтакт с «другим миром», который считали невозможным, осуществился в неожиданном направлении: инициативу проявил Административный комитет. Это было удивительно, но аргумент «наблюдения» был достаточным, так что создание комиссии было единогласно одобрено. Правительства в изгнании и европейские страны смотрели на это косо, но всё же проголосовали «за», движимые негласной обязанностью: нужно было разузнать хоть что-то.\n\n«Ах, добро пожаловать в Особый район Утнапиштим, господа!»\n\nЧиновник, направленный Административным комитетом, приветствовал их дружелюбно. Комиссия была ошеломлена, видя стеклянные небоскребы Д.У., полулюдей, разбросанных по городу, и улицы, населенные только студентками. Они уже слышали об этом от беженцев, но увидеть своими глазами было неизбежным шоком.\n\n«Это место называется Особый район Утнапиштим? Тот Утнапиштим, которого я знаю, — это древний царь Шуруппака... интересно, есть ли связь...»\n«Простите? Шуруп... что?»\n«Ах, ничего. Должно быть, совпадение...»\n«Но это слишком большое совпадение, что все они говорят на языках, которые мы до определенной степени можем понимать. Хотя это и очень разнообразная смесь языков.»\n«Хмм... откуда бы это ни было, похоже, это точно Земля из параллельного мира. Если только...»\n\nАкадемики в составе делегации, независимо от национальности, без умолку высказывали мнения. Переводчикам пришлось говорить до потери пульса, а чиновник лишь смотрел на них с неловкой улыбкой."
  COU_event.8.a:0 "«Господа... вам уже пора идти...»"
  COU_tooltip_event_7:0 "§gНаблюдательная комиссия Лиги Наций пробудет здесь 2 года. Разумеется, они не смогут украсть наши технологии. Они просто будут туристами, смотреть, как проходит повседневная жизнь Кивотоса.§!"
  COU_event.9.t:0 "Власть Совета восстановлена"
  COU_event.9.desc:0 "Административный хаос, длившийся год после Великого Катаклизма, начал утихать, по крайней мере, до некоторой степени. Каждая академия продемонстрировала, что может поддерживать собственную военную силу и общественный порядок, не полагаясь на наш контроль, сохраняя состояние, подобное тому, что было до Катаклизма. Тем временем у Совета было время реорганизоваться в форму «государства».\n\nВозможно, во время хаоса об этом на мгновение забыли, но теперь, когда Совет перевел дух, его авторитет и влияние снова дают о себе знать. Конечно... они всё еще намного слабее, чем до Катаклизма.\n\nТем не менее, для посткатаклизмического Совета это можно считать удачей: мы продемонстрировали студентам Кивотоса, что Совет всё еще существует. И теперь остается только сделать всё возможное, чтобы снова оказывать влияние и восстановить контроль над Кивотосом."
  COU_event.9.a:0 "Ура!"


  ##Предоставление другим странам 
  COU_event_diplomancy.1.t:0 "Запрос Совета об унификации валюты"
  COU_event_diplomancy.1.desc:0 "Ранним тихим утром, в 5:00, в офисе детективного агентства зазвонил звонок, который, что необычно, разбудил всех рано. Маленькое письмо, просунутое в щель почтового ящика, было с силой помечено синим логотипом Совета.\n\nКто его получил? Муцуки? Харука? Вероятно, сам человек из-за сна не помнит. Но, в любом случае, в письме говорилось следующее:\n\n«Его Высочеству Регенту Великого Герцогства Люксембург:\n\nКазначейство Генерального студенческого совета на прошлой неделе ввело в действие меру по унификации валюты, конвертирующую бельгийский франк и нидерландский гульден в иены Кивотоса. В связи с этим, для сохранения стоимости старого бельгийского франка, мы запрашиваем также в Люксембурге — где обращаются бельгийский франк и люксембургский франк — конвертацию и интеграцию в иену Кивотоса по курсу 1.5:1.\n\nЭто административное распоряжение для взаимной выгоды обеих сторон...»\n\nНо, даже если бы мы захотели подчиниться, односторонняя унификация, подобная той, что проводит Совет, невозможна, если мы хотим избежать экономического шока, который это вызовет в Люксембурге. И, с другой стороны, не ответить — может навредить нашим будущим дипломатическим отношениям.\n\nКакое решение мы должны принять?"
  COU_event_diplomancy.1.a:0 "Простите, но давайте откажемся."
  COU_tooltip_COU_event_diplomancy_1:0 "§gВместо этого агентство слило в прессу пару строк: «Правительство Люксембурга не поддалось давлению Совета!» Шеф Ару появится в газете, выглядит невероятно круто.§!"
  COU_event_diplomancy.1.b:0 "Давайте обменяем только ограниченное количество!"
  COU_tooltip_COU_event_diplomancy_2:0 "§gНо это не удовлетворит ни Казначейство, ни местные газеты. Может, шеф будет выглядеть слабой?§!"
  COU_event_diplomancy.2.t:0 "Представившаяся возможность"
  COU_event_diplomancy.2.desc:0 "Нам представилась возможность. Прошло уже больше месяца с исчезновения Председателя Совета. Исполняющая обязанности Совета была вынуждена своими устами признать, что она не является легитимным лидером, и в таком случае SCHALE — организация, которую Председатель «создала непосредственно» — может без проблем унаследовать легитимность Совета.\n\nФактически, после окончания Войны в Низинах часть армии Совета, которая раньше следовала за Председателем, даже запросила добровольную службу под нашим командованием.\n\nЭто возможность, которую нельзя упускать. Пришло время обучить наши силы и с неожиданным внезапным ударом вернуть легитимность Председателя и Башню Святилища, заставив этих беспричинных угнетателей встать на колени."
  COU_event_diplomancy.2.a:0 "Если не сейчас, то никогда!"
  COU_event_diplomancy.3.t:0 "Отправка финального ультиматума"
  COU_event_diplomancy.3.desc:0 "Сегодня, примерно через месяц, напряженность в Низинах достигла пика. Арона, не дожидаясь дольше, отправила финальный ультиматум, требующий односторонней и безоговорочной интеграции Совета.\n\nБыло ли это рано или нет, мы уже пересекли точку невозврата. Высокомерный Совет немедленно отклонил наше требование, что равносильно требованию тотальной войны против нас."
  COU_event_diplomancy.3.a:0 "Ничего не поделаешь."



  ##Промышленность 
  COU_event_industry.1.t:0 "Встреча с предпринимателями"
  COU_event_industry.1.desc:0 "Оки Аой открыла дверь, неся несколько чашек кофе. Это была встреча с руководителями известных оружейных компаний, таких как FN Herstal, Renard и Philips. Аой поставила поднос на стол. Мужчины с напряженными лицами хранили неловкое молчание.\n\nКофе пролился и намочил перчатки Аой, поэтому она на мгновение отошла, чтобы сменить их. Кофе потек, как слезы, с перчаток. Аой вытерла руку полотенцем, невозмутимо, а затем села.\n\n«Добрый день. Вы обдумали мое предложение?»\n\nМолчание продолжилось. Аой почувствовала легкое раздражение от тех, кто ничего не говорил. Нарушил его Дьёдонне Суа, из Herstal.\n\n«Действительно... правильно ли, что вы признаете наши интересы? Что вы не передадите компанию профсоюзам, не будет ни одной реструктуризации, и нужно лишь сотрудничать с Советом?»\n\nАой наконец улыбнулась и заговорила:\n\n«Конечно. Совет признает право управления компаний... при условии, что они сотрудничают с Советом.»\n\nАой открыла документы, лежащие рядом.\n\n«Это недавнее состояние дел в Philips. С момента формирования нидерландского правительства в изгнании они работали в убыток: в настоящее время это эквивалентно 230 миллионам иен.»\n\nАнтон Филипс проявил явное беспокойство: не только потому, что его дефицит был раскрыт, но и потому, что он не привык, чтобы это выражалось в иенах, а не в гульденах. Вероятно, он подсчитывал, сколько гульденов составляют «230 миллионов иен».\n\nАой продолжила:\n\n«Казначейство может спасти эти компании. Мы можем предоставить заем в размере 300 миллионов иен на компанию... бесплатно.»\n\nПосле этой короткой фразы присутствующие приближенные к руководителям заволновались. Антон Филипс спросил, правда ли это.\n\nНа самом деле, после Великого Катаклизма Совету было бы трудно пойти на такие крупные расходы... но Аой уже убедила Рин, что это неважно.\n\nАой ответила утвердительно."
  COU_event_industry.1.a:0 "И руководители подписали документы, которые Аой им предоставила."
  COU_event_industry.2.t:0 "Амстердамская декларация"
  COU_event_industry.2.desc:0 "Большие сверкающие камеры Школы Кронос нацелились на делегацию. Эта декларация, в частности, не будет транслироваться в сети Кивотоса. Кронос отправит прямую трансляцию на каналы Фландрии и Северной Франции, и она выйдет в эфир тем же вечером.\n\nТрансляция прошла в форме кратких дебатов. Слева были Камиль Хёйсманс из Автономного комитета Фландрии (непризнанная организация) и Роже Саленгро из Автономного комитета Северной Франции. Справа, одетая в безупречный костюм — редкий вид — сидела Аой.\n\nФормат: Хёйсманс говорил об обещаниях развития Административного комитета, а Саленгро кивал.\n\n«Да... эм... Автономный комитет Фландрии долгое время возражал против политики Комитета, которая всегда была смещена в сторону Нидерландов. Хотя и поздно, мы очень рады, что наконец нам обещают модернизацию и развитие для Фландрии. Не так ли, господин Саленгро?»\n«Ах, да, это верно. Город Лилль остался беззащитным, когда французская армия отступила после Великого Катаклизма, но мы рады, что Комитет наконец обратит на нас внимание.»\n\nАой, слушая, почувствовала легкую досаду. О чем, черт возьми, они думают, говоря такое? Будь она на их месте, она бы хвалила Комитет по максимуму, чтобы выбить еще больше выгод. Но ладно: возможно, у них были давние обиды.\n\nАой улыбнулась и протянула папку с документами, подписанными от её имени. С сегодняшнего дня их автономные комитеты распускаются и подчиняются приказам Административного комитета, а взамен Комитет «обязательно» берет на себя обязанность развивать эти регионы.\n\nЭто не было чем-то плохим ни для них, ни для Комитета."
  COU_event_industry.2.a:0 "«Итак, все подписали?»"
  COU_event_industry_2_tooltip:0 "§gСо вспышкой была сделана фотография. Внезапный свет заставил Саленгро сильно зажмуриться. Вернувшись домой, на следующее утро он увидел в газете свою фотографию с закрытыми глазами и рассмеялся. Его жена, наверное, поддразнила бы его, сказав: «Как это ты вышел с закрытыми глазами?». Подумав об этом, он вспомнил о своей жене.\n\nНо это было неважно. Теперь французов ждала лучшая жизнь.§!"
  COU_event_industry.3.t:0 "Беспорядки на юге"
  COU_event_industry.3.desc:0 "Унификация валюты, инициированная Казначейством, была частью крупной экономической реформы, обменивавшей нидерландский гульден и бельгийский франк по курсу 1.5:1. В Нидерландах — где население Кивотоса было относительно больше — общая оценка была «неплохо». Но на севере Франции и во Фландрии было иначе.\n\nНекоторые мэры фламандских городов назвали обмен валюты экономическим вторжением и даже нарушили соглашения с Административным комитетом. Наиболее сильная оппозиция исходила от портовых городов. Город Дюнкерк протестовал, требуя уважения к Франции и к французскому франку.\n\nКазначейству пришлось срочно их успокаивать, ослабляя или отменяя некоторые меры."
  COU_event_industry.3.a:0 "Ну и шутка."


  ##Военное дело
  COU_event_military.1.t:0 "Роспуск Корпуса свободных офицеров"
  COU_event_military.1.desc:0 "Благодаря отличным результатам Административного комитета по мобилизации коллаборационистов, из надежных источников сегодня подтвердилось, что Корпус свободных офицеров — который скрывался в тайных убежищах повсюду и донимал нас — наконец распался.\n\nВ качестве явного доказательства несколько офицеров из этого корпуса сегодня сдались в Управление общественной безопасности Валькирии. Коллаборационисты возьмут их под стражу, проведут через процедуру «перевоспитания», а затем перестроят их сознание, чтобы они служили под нашим командованием."
  COU_event_military.1.a:0 "Превосходно."
  COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §YРазблокировано решение§! : Перевоспитание Корпуса свободных офицеров"
  COU_event_military.2.t:0 "Граф Шарль Фландрский, граф Фландрии."
  COU_event_military.2.desc:0 "В последнее время граф Шарль Фландрский вел спокойную жизнь. Его брат, Леопольд III, бежал в Конго и создал правительство в изгнании, но он не сел на корабль, несмотря на настойчивые уговоры. Потому что бельгийцы тоже не сели. Если бы он тоже сбежал в Конго, когда королевский дом вернется, было бы очевидно, что его поддержка была бы смехотворно низкой. Ради королевской семьи, ради своего брата и ради бельгийцев... он не уехал.\n\nВ любом случае, его жизнь была неплохой. СМИ, которые ежедневно критиковали беглого брата, его хвалили и даже называли «следующим королем». И в мирной сельской деревушке во Фландрии вести жизнь, читая газету, попивая кофе и пася овец, было совсем неплохо.\n\nНе просто неплохо: это была удовлетворительная жизнь... до недавнего времени.\n\nВсё началось, когда на его ферму ворвался автомобиль с эмблемой Совета. Казалось, чиновник искал кого-то королевской крови. Но, так как в итоге чиновница помогла загнать овец, она снова и снова извинялась и спросила его имя.\n\nШарль поколебался пару раз... и ответил, что он Шарль.\n\nЧиновница перевела взгляд с его имени в бумагах на него, затем, кажется, обменялась парой звонков по рации. Шарль почувствовал инстинктивное беспокойство. Что? Был ордер на арест?\n\nНо его сомнения разрешились внутри автомобиля: Совет хотел назначить его кем-то вроде губернатора Фландрии.\n\nРезультат был далек от того, чего он опасался, и Шарль вздохнул с облегчением. Если бы он отказался, возможно, он мог бы вернуться к своей спокойной жизни с овцами... но он уже чувствовал, что отдохнул достаточно.\n\nОн уже отдохнул.\n\nТеперь пришло время снова выйти ради бельгийцев.\n\nШарль ответил чиновнику, ожидавшему его решения."
  COU_event_military.2.a:0 "«Да, конечно. Я сделаю это.»"
  COU_event_military.3.t:0 "Амнистия Хейлкеркена"
  COU_event_military.3.desc:0 "«Инквизитор» Леон Дегрелль появился в тесной тюрьме на окраине Фландрии, находящейся в ведении Оборонного ведомства внутри Управления общественной безопасности Валькирии. На его груди был приколот синий значок Совета. Он остановился перед дверью камеры 27.\n\nТам находился Корнелис ван Гелкеркен.\n\nГелкеркен, глядя сквозь решетку, подумал, что это отвратительно.\n\n«Отвратительный валлонский предатель.»\n«Ну надо же, как сурово для первой встречи.»\n\nДегрелль ответил насмешливой улыбкой. Чтобы ни случилось, Гелкеркен не собирался доставлять ему удовольствие... хотя если бы ему дали свободу, ситуация могла бы измениться. И прежде чем эта мысль успела закончиться, Дегрелль заговорил первым.\n\n«Господин Гелкеркен... где Голландия? Ваша родина.»\n«Голландцы погибли напрасно. Кивотос — это новый порядок Европы, и истина, которой нужно следовать.»\n«И поэтому ты занимаешься этой паршивой изменой? Похоже, тебе не стыдно перед Леопольдом.»\n«Стыдно? Я принял мудрое решение. Я защитил товарищей по Рексу, защитил валлонов от истребления и, в итоге... *я* спас Бельгию от смерти. Может, кто-то, кто «мог бы» всю жизнь гнить в этой тюрьме, этого не понимает.»\n«Погоди... что ты такое говоришь? Ты... неужели ты...»\n«Да, вижу, ты понимаешь. Я предлагаю тебе сделку. Стань коллаборационистом и будешь свободен. А после... делай что хочешь. Как я. Подумай, что важнее: твоя родина в Ост-Индии... или твои товарищи рядом с тобой?»\n\nГелкеркен попытался возразить, но в итоге рухнул на пол. Дегрелль бросил ключ внутрь камеры и ответил высокомерно."
  COU_event_military.3.a:0 "«Надеюсь, вы примете благоразумное решение.»"
  COU_tooltip_heilcurcken_ours:0 "§gС «клацаньем» железная дверь, ранее крепко запертая, открылась. Гелкеркен собрался с мыслями.\n\n«Времена уже изменились», — сказал он себе. «Принимай то, что нужно принять».§!\n\n§YКорнелис ван Гелкеркен§! доступен как генерал."
  COU_event_military.4.t:0 "Амнистия Взвода Фокс"
  COU_event_military.4.desc:0 "Поздним вечером в районе Сиротори административное распоряжение поступило в тюрьму, находящуюся в непосредственном подчинении Административного комитета. Взвод Фокс проводил томительные дни в одиночных камерах (в принципе, всех четверых должны были заключить вместе в одной большой комнате, но местные охранники искали любой предлог, чтобы отправить их в изоляторы).\n\nЕдинственное, что им было разрешено, — это учебники французского и нидерландского языков, тактические пособия и письма, которые им отправлял Взвод Кролик. Тем не менее, никто не жаловался: это было их окончательное решение защитить своих младших товарищей.\n\nЗатем охранники подошли и с грохотом открыли двери. Один из них поджал губы и сказал:\n\n«Это административное распоряжение. Теперь вы свободны.»\n\nДва охранника сопровождали их к выходу, как последнее прощание. Снаружи толпились журналисты, и среди них были также младшие товарищи из Взвода Кролик.\n\nКак по уговору, Юкино и Мияко пожали друг другу руки. Они еще не были близки, но особая связь старших и младших товарищей не рвется так легко.\n\nЮкино, перед микрофонами, медленно открыла рот."
  COU_event_military.4.a:0 "«Добрый вечер!»"
  COU_event_military.5.t:0 "Местный взвод SRT"
  COU_event_military.5.desc:0 "«Взвод, смирно! Поприветствуйте командира взвода!»\n«Есть!»\n\nМужчины с нарукавными повязками, на которых сиял логотип SRT, проводили смотр во дворе академии. Было рано.\n\nГрохот переклички разбудил участниц Взвода Кролик, начиная с Саки. По приказу свыше Взвод Лев и Взвод Кролик должны были делить жилье для обмена культурами и тактиками, но для Кроликов, впервые видевших столь жесткую военную культуру, это неизбежно вызвало замешательство.\n\nНедавно созданный Взвод Лев был местным взводом, состоящим в основном из бельгийских и французских заключенных, и они двигались так, будто хвастались дисциплиной, которую усвоили. Также было заметно, что, даже будучи приписанными к новому подразделению, они преодолели различия и объединили волю.\n\n«Почему они с самого утра так шумят? Что за бедлам...»\n«Согласно уставу, рано вставать — это неплохо, Моэ. Хотя... 4 утра — это действительно слишком...»\n«Они всегда так жили? Уф...»\n«Давайте и мы уже встанем, хорошо?»\n\nВзвод Кролик, нехотя собираясь во дворе, поприветствовал Взвод Лев. Они получили в ответ суровое, но дружелюбное приветствие.\n\nЭтот день был предназначен для обучения тактике в стиле Кивотоса. Саки считала, что это не подходит, потому что у местных и у жителей Кивотоса разное биологическое строение, но, как сказала Мияко, они просто изучат образ мыслей и тактические действия Кивотоса, так что большой проблемы не будет.\n\nИ так прошли совместные учения."
  COU_event_military.5.a:0 "Были небольшие проблемы, но ничего серьезного."
  COU_tooltip_event_military_5:0 "§gБыла одна незначительная деталь: члены Взвода Лев не могли скрыть ужаса, видя тактику в стиле Кивотоса, например, когда даже снайперы бежали вперед, чтобы стрелять.§!"
  COU_event_military.6.t:0 "Доклад о состоянии Сил обороны"
  COU_event_military.6.desc:0 "«А... изображение хорошо видно?»\n«Мне сказали, что [COU.GetLeader] сейчас нет, так что я отправляю запись. Мне нужно просто рассказать о состоянии Сил обороны, верно?»\n«Ммм... не знаю, как лучше сказать, но мы в лучшей форме, чем раньше. Мы переделали систему тренировок, и так как зарплаты снизили, осталось немного бюджета, поэтому мы купили несколько новых образцов военного снаряжения. Это хорошо, но... в глубине души всё еще есть жалобы. Тем не менее, думаю, со временем это утрясется. Похоже, они сами в глубине души знают, что раньше с ними обходились чрезмерно.»\n\n«...И студентки пехотных дивизий с Ореолом после реорганизации уже привыкли к этой жизни. Ну, знаешь: хоть профессиональной подготовки больше нет... они всё равно проводят смотр, бегают круги по плацу, отжимаются... всё как обычно.»\n«И местные коллаборационисты тоже, кажется, более или менее привыкли к нашей цепочке командования. Там почти ничего не изменилось. Честно говоря, больше, чем местные, жалуются ребята из Спорта, потому что отменили физкультурные мероприятия... Ммм.\n\n«Я хочу организовать в казарме что-то вроде постоянного спортивного фестиваля, небольшого, но регулярного. Так все взбодрятся, и было бы хорошо. Надеюсь, вы отнесетесь к этому положительно.»\n\n«В общем, вот мой доклад. Думаю, у нас уже есть основа для реформирования Сил обороны.»\n\n(шум) «Начальник Хайн, я сделала все онигири! Идите попробуйте!»\n\n«Иду! Думаю, мне пора. На этом заканчиваю. В следующий раз заеду в Д.У. и сделаю более подробный письменный отчет. До встречи!»"
  COU_event_military.6.a:0 "Это терпимый удар."
  COU_event_military.7.t:0 "Доклад о дальнем учебном походе"
  COU_event_military.7.desc:0 "Заместителю Главы обороны, Административный комитет.\n\nПолучив приказ в прошлом месяце, в середине месяца были выделены несколько кораблей из эскадры тяжелых крейсеров и проведены маневры и учебные стрельбы в Ла-Манше и Северном море соответственно. Несмотря на необычно дальнее плавание, поскольку корабли обслуживались с использованием технологий Кивотоса, серьезных проблем во время операции не возникло.\n\nОднако, не знаю, связано ли это с отсутствием морского опыта в наших силах или с чем-то еще, но устройство автоматической навигации работает... странно. А так как система автоматического управления топливом не работала, невозможно было эффективно управлять топливом... (опущено)\n\nТем не менее, система показала действительно отличную производительность, и если мы исправим эти мелкие технические проблемы, наши недавно модернизированные корабли смогут плавать примерно на 10% дальше.\n\nНадеемся на скорейшее решение.\n\n- Конрад Хельфрих."
  COU_event_military.7.a:0 "Ладно, если это техническая проблема, её быстро исправят."



  #Персонажи 
  ##BA 
  COU_XXX_override_instant:0 "§YПредседатель Генерального студенческого совета§!"
  COU_XXX_override_delayed:0 "После бесчисленных испытаний, начиная с Великого Катаклизма, §YПредседатель Генерального студенческого совета§! — в соответствии со своим постом и полномочиями — §Gникогда§! не покинет Кивотос.\n...\n\n§RНо… когда же Председатель выйдет из своего кабинета?§!"
  #COU_XXX:0 "Председатель Генерального студенческого совета"
  #COU_XXX_desc:0 "Над всеми, Председатель Генерального студенческого совета управляла всем в Кивотосе. Споры между академиями и даже мелкие ссоры: всё контролировала, координировала и улаживала. Но когда весь Кивотос был перенесен в место, о котором никогда не слышали, — место, само существование которого не было даже достоверным, — даже ей пришлось взвалить на себя всё.\n\nЭто было не то, чего она желала, но, будучи лидером всех, она должна была быть такой, она решила взвалить это на себя с радостью. И, среди этих испытаний, до того момента, как она больше не сможет выносить, Председатель сделает всё возможное, чтобы работать для Кивотоса до конца."
  COU_null:0 "Чрезвычайный комитет Кивотоса"
  COU_null_desc:0 "После внезапного исчезновения Председателя Совет оказался в огромном хаосе. Генеральный студенческий совет Кивотоса в настоящее время не может осуществлять никакой деятельности, что означает, что он вообще не может реагировать на аномалии ситуации."
  COU_RIN:0 "Нанагами Рин"
  COU_RIN_desc:0 "После безответственного исчезновения Председателя Совет оказался под руководством Нанагами Рин. Нет необходимости объяснять способности Рин, подтвержденные доверием Председателя: она в совершенстве выполняет каждый день абсурдный объем работы и делает это почти без отдыха, что напоминает саму Председателя и сверхчеловека.\n\nВозможно, в этом смысле Рин нашла свое место. Однако проблема в том, что Председатель, исчезнув в одночасье, никогда прямо не назначала её. Просто, занимая непосредственно следующую должность, она была вынуждена принять на себя временное исполнение обязанностей.\n\nСлабая основа власти Рин и её философия правления приносят пользу всем... но не ей. Поскольку она должна ставить всё на то, как долго продлится простая «поддержка Председателя», Рин придется действовать без остановки."
  COU_RIN_SET1:0 "Исполнительный директор"
  COU_AOI:0 "Оки Аой"
  COU_AOI_desc:0 ""
  COU_AOI_SET1:0 "Директор Казначейства"
  COU_KAYA:0 "Сирануй Кая"
  COU_KAYA_desc:0 ""
  COU_KAYA_SET1:0 "Глава обороны"
  COU_AYUMU:0 "Ивабицу Аюму"
  COU_AYUMU_SET1:0 "Директор по регулированию"
  COU_MOMOKA:0 "Юраги Момока"
  COU_MOMOKA_DESC:0 "С каких пор Транспортное ведомство стало таким важным министерством внутри Совета? Раньше это был маленький отдел: чинить ежедневно сходящие с рельсов поезда, принимать отчеты... и всё.\n\nЮраги Момока стала для местных лучом надежды. Недавно основанная Комиссия по реформам и Красный рассвет намекают на то, что она не просто правитель. Щедро снабжая закусками со вкусом тресковой икры, принимая обращение как с власть имущей и делая вид, что подчиняется приказам, Момока в итоге стала ядром нового порядка.\n\nДругими словами: Момока была вынуждена взвалить на себя надоедливые задачи.\n\nМомока не слишком интересуется политическими играми. Она уже давно устала от бумажной лавины, но тем не менее. Иногда она вздыхает про себя, говоря, что скучает по Рин. Рядом с ней местные жители с красными повязками поглядывают на неё с подозрением.\n\nНо независимо от того, каков этот пост, она — новый порядок и символ гармонии между человечеством и Кивотосом. Момока и закуски со вкусом тресковой икры... будут верно выполнять этот долг.\n\nХотя она всего лишь марионетка, передоверившая политические игры политикам, Момока выполнит свой долг.\n\nНеся груз, который должна была нести."
  COU_dual_leader_system:0 "Система коллективного руководства"
  COU_dual_leader_system_desc:0 ""
