  BA_decisions_investment_in_student_council: "Инвестиции в сотрудничество Кивотоса"
  BA_decisions_investment_in_student_council_desc: "В сотрудничестве с центральным правительством Кивотоса мы подготовили несколько инвестиционных предложений для развития и процветания академий."

  BA_decisions_goverment_target: "Политическое вмешательство в [FROM.GetName]"
  BA_decisions_goverment_target_desc: "На нас лежит ответственность направлять страны Кивотоса по правильному пути. Поэтому мы не можем позволить [FROM.GetName] сбиться с него."

  BA_decisions_defensive_war_target: "Ответ на вторжение [FROM.GetName]"
