  RE4_investment_in_finland_tt:0 "Каждый раз при завершении этого фокуса §Y[RE4.GetNameWithFlag]§! получает национальный дух §YВлияние Красной Зимы§!, который в случае начала §YСеверной войны за суверенитет§!, если §Y[RED.GetNameWithFlag]§! находится в состоянии войны, применяет §R-1%§! к атаке дивизий (накапливается до §R-25%§!). (Текущее значение: [?RE4.RE4_investment_in_finland|+.0%])"
  RE4_investment_in_finland_dynamic_modifier:0 "Влияние Красной Зимы"

  RED_northern_sovereignty_war:0 "Северная война за суверенитет"
  RED_northern_sovereignty_war_desc:0 "§YВоенное правительство§!, учрежденное на территориях §YДании§!, §YНорвегии§! и §YШвеции§!, обычно считается частью Федеральной академии Красная Зима, но сейчас, когда готовится §YСеверная война за суверенитет§!, попытки §Gкооптировать§! Военное правительство возглавляются [RENSW_RED_leader_ADJ] и [RENSW_RE4_leader_ADJ]. Если конкуренция за влияние будет проиграна, §YВоенное правительство§! примет участие в §YСеверной войне за суверенитет§! на стороне §Rврага§!.\n\nЧто касается влияния, во время §YСеверной войны за суверенитет§! §YВоенное правительство§! последует за стороной §g[RENSW_RE4_leader_ADJ]§!, но если влияние §S[RENSW_RED_leader_ADJ]§! достигнет 100, это §YВоенное правительство§! вступит в войну на стороне §S[RENSW_RED_leader_ADJ]§!."

  redpuppet.1000.t:0 "§YСеверная война за суверенитет§!!"
  redpuppet.1000.desc:0 "Гражданская война в Красной Зиме началась. После лет внутренней борьбы, бесчисленных переворотов, революций и постоянной угрозы падения вновь и вновь, Бюро Красной Зимы наконец раскололось. Теперь эти две фракции сражаются на улицах за контроль над страной.\n\n[RE4.GetLeader] провозгласила себя лидером Федеральной академии Красная Зима и из своей временной столицы в [RE4.Capital.GetName] ведет гражданскую войну против [RED.GetLeader]."
  redpuppet.1000.a:0 "Приготовиться к бою!"

