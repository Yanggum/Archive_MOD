  red_northern_sovereignty_war_1side_icon_cherino_tt:0 "Сейчас Черино оказывает следующее влияние:\n §Y[RE1.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re1_var|S.0]\n §Y[RE2.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re2_var|S.0]\n §Y[RE3.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re3_var|S.0]\n\nСейчас Черино контролирует следующие Военные правительства:[RED_northern_sovereignty_war_use_RE1_side1][RED_northern_sovereignty_war_use_RE2_side1][RED_northern_sovereignty_war_use_RE3_side1]\n\nСейчас Черино готовится вторгнуться в:\n[RED_northern_sovereignty_war_rdy_process_cherino_tt]"

  red_northern_sovereignty_war_1side_icon_minori_tt:0 "Сейчас Минори оказывает следующее влияние:\n §Y[RE1.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re1_var|S.0]\n §Y[RE2.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re2_var|S.0]\n §Y[RE3.GetNameWithFlag]§! Влияние [?global.red_northern_sovereignty_re3_var|S.0]\n\nСейчас Минори освободила следующие Военные правительства:[RED_northern_sovereignty_war_use_RE1_side1][RED_northern_sovereignty_war_use_RE2_side1][RED_northern_sovereignty_war_use_RE3_side1]\n\nСейчас Минори готовится вторгнуться в:\n[RED_northern_sovereignty_war_rdy_process_minori_tt]"

  red_northern_sovereignty_war_2side_icon_marina_tt:0 "Сейчас Марина контролирует следующие Военные правительства:[RED_northern_sovereignty_war_use_RE1][RED_northern_sovereignty_war_use_RE2][RED_northern_sovereignty_war_use_RE3]\n\nСейчас Марина готовится вторгнуться в:\n[RE4_northern_sovereignty_war_rdy_process_marina_tt]"

