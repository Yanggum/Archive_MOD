  redpuppet.2000.t:0 "Победа на [FROM.GetAdjective] фронте"
  redpuppet.2000.desc:0 "Настойчивая поддержка Суоми и самоотверженная борьба Комитета скандинавских изгнанников наконец принесли плоды. С сегодняшнего дня силы Военного правительства Красной Зимы, действовавшие в тени в [FROM.GetAdjective], полностью изгнаны, и гражданская война за свободу завершилась нашей победой.\n\nВ столице, где наконец погас огонь войны, было установлено новое правительство, лояльное нам. Зарождающееся правительство выразило глубокую благодарность за помощь Финляндии, освободившую страну от жестокого господства Красной Зимы, и поклялось под нашим руководством вместе защищать свободу и стабильность севера.\n\nЭто великая веха, достигнутая перед лицом экспансионизма Красной Зимы, и она станет щитом, который еще больше укрепит нашу северную границу."
  redpuppet.2000.a:0 "Великолепная победа!"

  redpuppet.2001.t:0 "Поражение на [FROM.GetAdjective] фронте"
  redpuppet.2001.desc:0 "Пришли болезненные новости из Военного правительства. Из-за упорного наступления финских марионеток и агитации внутренних мятежных сил, наше Военное правительство, дислоцированное в [FROM.GetAdjective], наконец рухнуло.\n\nРеакционеры, поддержанные Финляндией, захватили столицу и установили новое марионеточное правительство. Наши выжившие солдаты с трудом отступают за границу. Это поражение нанесло тяжелый удар по престижу Федеральной академии Красная Зима и привело к серьезному вакууму в нашем влиянии в Северной Европе.\n\nМы никогда не забудем это поражение, и однажды мы взыщем этот долг."
  redpuppet.2001.a:0 "Проклятье!"

  redpuppet.2100.t:0 "Поражение на [FROM.GetAdjective] фронте"
  redpuppet.2100.desc:0 "Пришел безнадежный доклад из Военного правительства. Комитет скандинавских изгнанников, боровшийся за свободу [FROM.GetAdjective], и наши силы поддержки, помогавшие им, наконец рухнули под сокрушительным наступлением Военного правительства Красной Зимы.\n\nСтолица пала, а борцы за свободу, которые сопротивлялись, были казнены или отправлены в лагеря для интернированных. Это поражение — не просто военная неудача: это трагедия, в которой была разрушена наша надежда на свободу севера. Стальные сапоги Красной Зимы уже дошли до самых ворот нашей границы. Мы должны готовиться к еще более суровым испытаниям."
  redpuppet.2100.a:0 "Проклятье!"

  redpuppet.2101.t:0 "Победа на [FROM.GetAdjective] фронте"
  redpuppet.2101.desc:0 "Пришли великолепные вести о победе из Военного правительства! Мы успешно подавили мятежные силы в [FROM.GetAdjective], подстрекаемые финскими реакционерами, и снова подняли наше красное знамя над столицей.\n\nОчистившись от внутренних врагов и отбросив марионеток за границу, революционное правительство [FROM.GetAdjective] еще больше укрепилось. Эта победа еще раз демонстрирует силу Федеральной академии Красная Зима, вселяя страх в наших врагов и надежду в наших товарищей.\n\nСтабильность севера обеспечена, и теперь мы сможем сосредоточить наши силы на освобождении других мест."
  redpuppet.2101.a:0 "Великолепная победа!"

