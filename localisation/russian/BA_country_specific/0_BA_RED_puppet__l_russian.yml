  RED_second_great_northern_war:0 "Вторая великая северная война"
  RED_second_great_northern_war_desc:0 "§YВоенное правительство§!, учрежденное на территориях §YДании§!, §YНорвегии§! и §YШвеции§!, обычно считается частью Федеральной академии Красная Зима, но теперь, когда Финляндия организовала широкий Комитет скандинавских изгнанников и призывает ко §YВторой великой северной войне§!, попытки §Gвзять под контроль§! Военные правительства в каждом регионе возглавляются §SКрасной Зимой§! и §CФинляндией§!.\n\nЧто касается влияния, во время §YВторой великой северной войны§! §YВоенное правительство§! обычно сохраняет нейтралитет; однако, если §SКрасная Зима§! и §CФинляндия§! полностью возобладают во всех сферах влияния, вспыхнет §RСкандинавская гражданская война§! и будут разблокированы различные решения для поддержки этой войны."

  red_second_great_northern_war_RED_side_icon_tt:0 "Сейчас Красная Зима оказывает следующее влияние:\n §Y[RE1.GetNameWithFlag]§! Влияние [?global.red_re1_second_great_northern_war_red_var|S.0]\n §Y[RE2.GetNameWithFlag]§! Влияние [?global.red_re2_second_great_northern_war_red_var|S.0]\n §Y[RE3.GetNameWithFlag]§! Влияние [?global.red_re3_second_great_northern_war_red_var|S.0]"
  red_second_great_northern_war_FIN_side_icon_tt:0 "Сейчас Финляндия оказывает следующее влияние:\n §Y[RE1.GetNameWithFlag]§! Влияние [?global.red_re1_second_great_northern_war_fin_var|C.0]\n §Y[RE2.GetNameWithFlag]§! Влияние [?global.red_re2_second_great_northern_war_fin_var|C.0]\n §Y[RE3.GetNameWithFlag]§! Влияние [?global.red_re3_second_great_northern_war_fin_var|C.0]"

