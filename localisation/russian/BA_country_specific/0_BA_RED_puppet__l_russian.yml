  RED_northern_sovereignty_war_rdy_process_cherino_1_tt:0 "§gЧерино раскрывает скандал #227 Марины§! §G(1/4)§!"
  RED_northern_sovereignty_war_rdy_process_cherino_2_tt:0 "§gЧерино раскрывает скандал #227 Марины\nНачинается кооптация Военного правительства§! §Y(2/4)§!"
  RED_northern_sovereignty_war_rdy_process_cherino_3_tt:0 "§gЧерино раскрывает скандал #227 Марины\nНачинается кооптация Военного правительства\nКооптировано как минимум одно Военное правительство§! §Y(3/4)§!"
  RED_northern_sovereignty_war_rdy_process_cherino_4_tt:0 "§gЧерино раскрывает скандал #227 Марины\nНачинается кооптация Военного правительства\nКооптировано как минимум одно Военное правительство\nЗавершен фокус «Сместить председателя Комитета безопасности»§! §R(4/4)§!\n\n§R\"Теперь [RENSW_RED_leader_ADJ] может объявить Северную войну за суверенитет.\"§!"

  RED_northern_sovereignty_war_rdy_process_minori_1_tt:0 "§gМинори завершает революцию Красной Зимы§! §G(1/4)§!"
  RED_northern_sovereignty_war_rdy_process_minori_2_tt:0 "§gМинори завершает революцию Красной Зимы\nРаспространяет революцию в Военном правительстве§! §Y(2/4)§!"
  RED_northern_sovereignty_war_rdy_process_minori_3_tt:0 "§gМинори завершает революцию Красной Зимы\nРаспространяет революцию в Военном правительстве\nУчреждено как минимум одно Освободительное бюро§! §Y(3/4)§!"
  RED_northern_sovereignty_war_rdy_process_minori_4_tt:0 "§gМинори завершает революцию Красной Зимы\nРаспространяет революцию в Военном правительстве\nУчреждено как минимум одно Освободительное бюро\nЗавершен фокус «Революция скандинавов»§! §R(4/4)§!\n\n§R\"Теперь [RENSW_RED_leader_ADJ] может объявить Северную войну за суверенитет.\"§!"

  RE4_northern_sovereignty_war_rdy_process_marina_1_tt:0 "§gМарина решает начать революцию из-за скандала #227§! §G(1/4)§!"
  RE4_northern_sovereignty_war_rdy_process_marina_2_tt:0 "§gМарина решает начать революцию из-за скандала #227\nПеренос штаб-квартиры Комитета безопасности§! §Y(2/4)§!"
  RE4_northern_sovereignty_war_rdy_process_marina_3_tt:0 "§gМарина решает начать революцию из-за скандала #227\nПеренос штаб-квартиры Комитета безопасности\nУчрежден Комитет по предотвращению контрреволюции§! §Y(3/4)§!"
  RE4_northern_sovereignty_war_rdy_process_marina_4_tt:0 "§gМарина решает начать революцию из-за скандала #227\nПеренос штаб-квартиры Комитета безопасности\nУчрежден Комитет по предотвращению контрреволюции\nЗавершен фокус «Кодовое имя: Операция Иван Купала»§! §R(4/4)§!\n\n§R\"Теперь Марина может объявить Северную войну за суверенитет.\"§!"

