  RE4_redwinter_military_advisors: "Военные советники Красной Зимы"
  RE4_redwinter_military_advisors_desc: "С отправкой военных советников с родины мы сможем планировать более тонкие операции и проводить более агрессивные наступления. Пришло время уверенно вести за собой на поле боя."
  RE4_redwinter_military_advisors_remove_tt: "\nУсловие удаления: Мир с §Y@FIN[FIN.GetAdjective]§!"
  RED_redwinter_military_advisors: "$RE4_redwinter_military_advisors$"
  RED_redwinter_military_advisors_desc: "Поход в Финляндию столкнулся с более сильным сопротивлением, чем ожидалось. Чтобы преодолеть этот тупик, отправлены военные советники для усиления наступления и обеспечения стратегической информацией."
  RED_redwinter_military_advisors_remove_tt: "\nУсловие удаления: Мир с §Y[RE4.GetName]§!"
  RE4_finland_colonial_dynamic_modifier: "Финляндская автономная комиссия"
  modify_RE4_finland_colonial_dynamic_modifier_tt: "Модификатор §Y$RE4_finland_colonial_dynamic_modifier$§!:"
  RE4_warning_this_idea_can_be_removed_tt: "§RЭтот национальный дух будет удален, если [RE4.GetNameDef] перестанет быть колонией§!"

  # Events redpuppet
  redpuppet.1.t: "Запрос на поставки от [RE4.GetName]"
  redpuppet.1.d: "Спонтанное восстание студенческого ополчения положило начало наступлению на Финляндию, и Красная Зима ожидала быстрой победы. Однако война затянулась, истощив запасы Комитета обороны. Без дополнительной поддержки удержать фронт будет невозможно. Требуется срочная помощь с родины."
  redpuppet.1.a: "Конечно!"
  redpuppet.1.b: "У нас у самих дефицит..."
  redpuppet.2.t: "Запрос отклонен [FROM.GetName]"
  redpuppet.2.desc: "Несмотря на наши мольбы, [FROM.GetName] отклонил запрос, сославшись на собственную нехватку оружия. Нам придется преодолеть это препятствие самим."
  redpuppet.2.a: "Сегодня ветер дует особенно холодно..."
  redpuppet.3.t: "Запрос принят [FROM.GetName]"
  redpuppet.3.desc: "§Y[FROM.GetName]§! принял наш запрос! Поставки прибывают нескончаемым потоком поездов, оживляя наш фронт."
  redpuppet.3.a: "В атаку, пришло время наступления!"
  redpuppet.4.t: "Запрос на военных советников от [RE4.GetName]"
  redpuppet.4.desc: "[RE4.GetName], сформированный из студенческого ополчения, демонстрирует признаки истощения после затяжной войны с [FIN.GetAdjective]. Они срочно запрашивают военных советников."
  redpuppet.4.a: "Почему бы не помочь им?"
  redpuppet.5.t: "[FROM.GetName] отправляет военных советников"
  redpuppet.5.desc: "§Y[FROM.GetName]§! согласился отправить военных советников! С их поддержкой мы надеемся скоро завершить эту войну."
  redpuppet.5.a: "Отличная новость!"
  redpuppet.6.t: "[FROM.GetName] отказывается отправлять советников"
  redpuppet.6.desc: "Они серьезно нам отказали?"
  redpuppet.6.a: "Лол"
  redpuppet.7.t: "Запрос на офицеров от [RE4.GetName]"
  redpuppet.7.desc: "[RE4.GetName] нуждается в опытных командирах. Они предлагают отобрать двух генералов для усиления своей военной структуры."
  redpuppet.7.a: "$RED_marina$ — Ее наступательные способности надежны."
  redpuppet.7.b: "$RED_Tomoe$ — Ее планирование почти безупречно."
  redpuppet.7.c: "Пусть справляются сами."
  RE4_she_is_leader_tt: "\nЭтот человек станет §YЛидером Комитета обороны @RE4[RE4.GetName]§!"
  redpuppet.8.t: "[FROM.GetName] соглашается отправить офицеров"
  redpuppet.8.desc: "Заголовок совпадает с содержанием."
  redpuppet.8.a: "Отличная новость!"
  redpuppet.9.t: "[FROM.GetName] отказывается отправить офицеров"
  redpuppet.9.desc: "[FROM.GetName] говорит нам решать свои проблемы самим."
  redpuppet.10.t: "Зимняя война"
  redpuppet.10.desc: "Разгромив Норвегию, Данию и Швецию, Красная Зима не остановилась. В Кеми, Финляндия, местные студенты спонтанно подняли восстание, сформировав Комитет обороны, который сейчас наступает на юг. Великая война за Финляндию вот-вот начнется."
  redpuppet.10.a: "На юг!"
  redpuppet.10.b: "Мы будем защищать нашу родину!"
  redpuppet.11.t: "Победа [RE4.GetName] в Зимней войне"
  redpuppet.11.desc: "После тяжелых боев [RE4.GetName] захватил $VICTORY_POINTS_11105$. Войска маршируют победно под ошеломленными взглядами местных жителей."
  redpuppet.11.a: "Великая победа!"
  redpuppet.12.t: "Поражение [RE4.GetName] в Зимней войне"
  redpuppet.12.desc: "[RE4.GetName] был окончательно разбит после ожесточенного сопротивления финнов. Освобождение Кеми празднуется гуляньями и фейерверками."
  redpuppet.12.a: "..."
  redpuppet.13.t: "[RED.GetName] решает инвестировать"
  redpuppet.13.desc: "[RED.GetName] утвердил план промышленных инвестиций в [925.GetName]."
  redpuppet.13.a: "Большое преимущество."
  redpuppet.14.t: "Основание Финляндской автономной комиссии"
  redpuppet.14.desc: "После падения финского правительства Красная Зима установила новую автономную администрацию. Однако эта Комиссия сопротивляется прямому контролю со стороны Красной Зимы."
  redpuppet.14.a: "Наглые мятежники."
  redpuppet.15.t: "Надзорный комитет"
  redpuppet.15.desc: "Перед лицом вызывающего поведения Финляндии Красная Зима учреждает Надзорный комитет для контроля за ее ключевыми экономическими и политическими решениями."
