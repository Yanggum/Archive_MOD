IDC_establishment_of_indochina_union_tt: "Добавляет §Yосновные государства§! на все территории §Yтрех стран Индокитая§!."

IDC_event.1.t: "Запрос поддержки от националистов [FROM.GetAdjective]"
IDC_event.1.desc: "Националисты [FROM.GetAdjective] готовятся к войне за независимость против своих правителей. При условии, что мы предоставим им оружие для их борьбы, они обещают укрепить отношения с нами после своей победы, утверждая, что ослабленная [FRA.GetName] пойдет на пользу нашим интересам."
IDC_event.1.a: "Конечно"
IDC_event.1.b: "Нет причин вмешиваться."
IDC_event.2.t: "Принятие поддержки от [FROM.GetNameDefCap]"
IDC_event.2.desc: "Наши дипломаты вернулись после консультаций с командованием [FROM.GetAdjective], достигнув соглашения, по которому они предоставят нам рабочую силу и снаряжение, если мы объявим войну нашим угнетателям. Сегодня великий день для народа [ROOT.GetAdjective]!"
IDC_event.2.a: "Отлично"
IDC_event.3.t: "Отказ в поддержке от [FROM.GetNameDefCap]"
IDC_event.3.desc: "Наши дипломаты вернулись с пустыми руками после переговоров с командованием [FROM.GetAdjective]. Никакого соглашения достигнуто не было, и те, кого мы считали союзниками, предали нас..."
IDC_event.3.a: "Как прискорбно"

IDC_event.4.t: "Запрос промышленной помощи от [FROM.GetAdjective]"
IDC_event.4.desc: "Добившись независимости, [FROM.GetAdjective] запросила нашу промышленную помощь. Они подчеркивают, что инфраструктура Индокитая неудовлетворительна и что им не хватает промышленных экспертов, предлагая будущее сотрудничество, такое как проекция регионального влияния и установка военной инфраструктуры, и просят направить промышленных специалистов в их страну."
IDC_event.4.a: "Конечно"
IDC_event.4.b: "Этот регион нас не интересует."
IDC_event.5.t: "Принятие поддержки от [FROM.GetNameDefCap]"
IDC_event.5.desc: "Наши дипломаты, связавшись с промышленными экспертами и дипломатическими представителями [FROM.GetAdjective], получили твердые обязательства по инвестициям в нашу страну. Это возможность восполнить нашу нехватку специалистов и получить высококачественные стальные ресурсы!"
IDC_event.5.a: "Хорошо."
IDC_event.6.t: "Отказ в поддержке от [FROM.GetNameDefCap]"
IDC_event.6.desc: "Наши дипломаты вернулись с пустыми руками после переговоров с представителями [FROM.GetAdjective]. Никакого соглашения достигнуто не было, и, похоже, они не заинтересованы в инвестировании в нашу промышленность."
