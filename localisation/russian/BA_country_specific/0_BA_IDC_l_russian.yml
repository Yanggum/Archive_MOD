IDC_tirailleurs_reformed_flag: "Пехота реорганизована в армию [ROOT.GetAdjective]"
IDC_tirailleurs: "Пехота"
IDC_tirailleurs_desc: "Пехота — это жандармская и армейская сила, созданная в 1884 году, вскоре после образования Федерации Французского Индокитая. Офицерский корпус полностью состоит из французов или европейских наемников, в то время как большинство рядовых солдат — местные жители [ROOT.GetAdjective]. Они очень эффективны в бою, но дискриминация и плохое управление вызвали глубокое недовольство."
modify_IDC_tirailleurs_tt: "Изменения в §Y$IDC_tirailleurs$§!:"

