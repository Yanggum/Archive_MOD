IDC_slander_the_colonial_authorities: "Клевета на колониальные власти"
IDC_anti_colonialist_propaganda_idea: "Лига независимости [ROOT.GetAdjective]"
IDC_outbreak_of_indochina_war: "Начало Индокитайской войны"
has_IDC_independence_war_starter: "Наша страна начала Индокитайскую войну"
IDC_independence_war_ongoing: "Индокитайская война продолжается"
IDC_independence_war_onended: "Индокитайская война закончилась победой Индокитая"
IDC_outbreak_of_indochina_war_tt: "Наша армия воспользуется ослаблением колониальной администрации, чтобы свергнуть колониальные власти и официально начать войну за независимость путем государственного переворота. Если нам удастся контролировать §YКамбоджу§!, §YЛаос§! и §YВьетнам§!, братские государства Индокитая присоединятся к войне за независимость. Если весь Индокитай будет освобожден или враг будет полностью разгромлен и вынужден подписать мирный договор, мы сможем добиться полной независимости от бывшей метрополии.\n\nТочно так же, если враг контролирует §YКамбоджу§!, §YЛаос§! и §YВьетнам§!, он сможет вынудить нас подписать мирный договор и сохранить контроль над нашей страной."
IDC_indochina_communist_party_contact_tt: "§RМы больше не сможем пытаться вести мирные переговоры о независимости и сосредоточимся исключительно на вооруженной борьбе§!"
IDC_vietcong_unit_tt: "Когда начнется война за независимость, мы получим 3 §Yдивизии Вьетконга§!. Если поддержка §Yкоммунизма§! достигнет достаточного уровня, они смогут совершить государственный переворот и взять на себя руководство правительством."
IDC_monarchist_movement_tt: "Когда начнется война за независимость, мы получим 2 §Yгвардейские дивизии§!, и монархические настроения в стране будут неуклонно расти."
idea_IDC_rural_enlightenment_movement: "Движение сельского просвещения"
IDC_surrender_of_france: "Капитуляция Франции"
IDC_surrender_of_france_desc: "Если братья-борцы за независимость Индокитая будут контролировать все индокитайские провинции и смогут надежно заблокировать любое будущее французское вторжение, мы сможем обеспечить нашу независимость. Остался лишь последний момент для освобождения всех народов Индокитая."
IDC_break_the_law: "Нарушение закона"
IDC_break_the_law_tt: "В начале ни один из §YВьетнама§!, §YЛаоса§!, §YКамбоджи§! или §Y[1068.getName]§! не контролируется §Y[FRA.GetNameWithFlag]§!"
IDC_break_the_law_tt_NOT: "В начале §Y[FRA.GetNameWithFlag]§! контролирует по крайней мере один из §YВьетнама§!, §YЛаоса§!, §YКамбоджи§! или §Y[1068.getName]§!"

IDC_establish_the_anc_modifier_tt: "§RЗавершение фокусов, связанных с пехотой Индокитая, больше не будет возможным§!"
IDC_establish_the_anc_locking_tt: "Удаляет национальный дух §YПехота Индокитая§! и заменяет его на §YАрмия [ROOT.GetAdjective]§!, сохраняя половину ранее полученных бонусов."
IDC_establish_the_anc: "Создание армии [ROOT.GetAdjective]"
IDC_establish_the_anc_desc: "Многие из наших требований наконец-то выполнены. Сегодня день, когда мы сформировали настоящую армию [ROOT.GetAdjective], способную с гордостью встретить любого врага, который перед нами предстанет."
IDC_marine_nationale: "Национальный флот"
IDC_marine_nationale_desc: "Хотя мы никогда не вкладывали в него должным образом, большинство современных государств нуждаются в военно-морском флоте. Мы должны решить, будет ли его целью переброска войск через южную часть Тихого океана или проведение более эффективных операций на реках и близлежащем побережье."
IDC_expand_shipping_industry: "Расширение судостроительной промышленности"
IDC_expand_shipping_industry_desc: "Во многие регионы нашей страны трудно добраться без воздушного или речного транспорта. Кроме того, морские связи с заграницей жизненно важны, поэтому мы должны расширить судостроительную промышленность, чтобы удовлетворить потребности нашего государства в модернизации."
IDC_south_atlantic_navy: "Флот южной части Тихого океана"
IDC_south_atlantic_navy_desc: "Если мы хотим должным образом защитить нашу независимость, мы должны помешать колониальным державам снова высадиться на наших берегах."
IDC_brown_water_navy: "Речной и прибрежный флот"
IDC_brown_water_navy_desc: "Обширные океаны не являются нашим приоритетом. Однако для обеспечения национальной безопасности мы должны эффективно патрулировать наши протяженные реки, озера и побережья."
IDC_coastal_defence_fleet: "Развитие флота береговой обороны"
IDC_coastal_defence_fleet_desc: "Мы должны должным образом защищать наши побережья, и этого можно достичь только путем строительства мощных судов береговой обороны, способных действовать вблизи береговой линии."
IDC_supply_line_disruption_tactics: "Тактика нарушения линий снабжения"
IDC_supply_line_disruption_tactics_desc: "Вражеские линии снабжения могут быть разрушены одним точным ударом. Наши подводные лодки будут отвечать за это, играя ключевую роль в будущих войнах."
IDC_force_arienne_congolaise: "Военно-воздушные силы [ROOT.GetAdjective]"
IDC_force_arienne_congolaise_desc: "Чтобы иметь возможность должным образом противостоять нашим врагам, мы должны реорганизовать нашу авиацию и создать официальные военно-воздушные силы в составе новой армии."
IDC_procure_foriegn_equipment: "Закупка иностранного снаряжения"
IDC_procure_foriegn_equipment_desc: "Нам не хватает промышленной базы и технических знаний, необходимых для самостоятельной разработки и производства самолетов, поэтому разумнее сосредоточиться на закупке конструкций или самих летательных аппаратов у наших союзников."
IDC_aeronautical_research_department: "Департамент авиационных исследований"
IDC_aeronautical_research_department_desc: "Хотя авиация не была приоритетной областью для инвестиций, мы не должны чрезмерно полагаться на иностранные державы. Даже с высокими затратами необходимо разрабатывать и производить наши собственные самолеты."
IDC_scouting_the_terrain: "Разведка местности"
IDC_scouting_the_terrain_desc: "Наши обширные джунгли затрудняют передвижение и осложняют обнаружение врага до того, как он приблизится к крупным городам. Поэтому военно-воздушные силы должны будут играть ключевую роль в разведывательных миссиях."
IDC_expand_production_facilities: "Расширение производственных мощностей"
IDC_expand_production_facilities_desc: "Мы должны увеличить производство военного снаряжения, и единственный способ сделать это — построить новые объекты, которые позволят это."
IDC_forces_terrestres: "Сухопутные силы"
IDC_forces_terrestres_desc: "Наиболее важным компонентом любой армии являются сухопутные силы, и в настоящее время наши имеют множество недостатков. Мы должны инвестировать в них, чтобы иметь возможность твердо противостоять нашим врагам."
IDC_from_a_gendarmerie_to_a_fighting_force: "От жандармерии к боевой силе"
IDC_from_a_gendarmerie_to_a_fighting_force_desc: "Пришло время оставить позади наше происхождение как жандармской пехоты и перепроектировать армию так, чтобы она перестала походить на полицейские силы и превратилась в подлинную военную силу."
IDC_academie_militaire_de_kananga: "Военная академия [ROOT.Capital.GetName]"
IDC_academie_militaire_de_kananga_desc: "Не только рядовые солдаты, но и офицеры и генералы требуют обучения. Инвестиции в военную академию [ROOT.Capital.GetName] позволят нашей армии лучше выполнять свои будущие задачи."
IDC_standardize_military_production: "Стандартизация военного производства"
IDC_standardize_military_production_desc: "При хаотичном смешении иностранного и отечественного снаряжения наша военная промышленность не может быстро производить необходимые материалы. Мы должны стандартизировать снаряжение, используемое армией."
IDC_societe_africaine_dexplosifs_congo: "Компания боеприпасов Индокитая"
IDC_societe_africaine_dexplosifs_congo_desc: "Еще одним условием для производства нашего собственного оружия является наличие государственной компании, способной удовлетворить наши потребности в пределах наших границ. С этой целью мы должны основать Компанию боеприпасов Индокитая."
IDC_triga_i_project: "Проект ядерного оружия"
IDC_triga_i_project_desc: "Будущее энергии — это ядерная энергия, и наши ученые напряженно работали над строительством первой ядерной установки в Индокитае. Как только эта цель будет достигнута, мы сможем использовать эту энергию в военных целях."
IDC_military_service_for_citizenship: "Военная служба за гражданство"
IDC_military_service_for_citizenship_desc: "В нашей стране много людей, не имеющих ни гражданства, ни паспорта. Следуя примеру римлян, мы должны предоставлять гражданство тем, кто прослужит в армии определенный срок, привлекая тем самым новых потенциальных призывников."
IDC_guerilla_tactics_drills: "Обучение тактике партизанской войны"
IDC_guerilla_tactics_drills_desc: "Наша местность идеально подходит для тактики 'бей-и-беги'. Мы должны обучить наших солдат владеть ею, чтобы победить любого врага, которого мы встретим."
IDC_french_as_martial_language: "Французский как военный язык"
IDC_french_as_martial_language_desc: "Традиционно цепи командования пехоты Индокитая использовали французский в качестве основного языка. Это доказало свою эффективность, поэтому нет причин это менять."
IDC_adopt_lingala_and_swahili_as_martial_languages: "Местные языки в армии"
IDC_adopt_lingala_and_swahili_as_martial_languages_desc: "Хотя исторически цепь командования использовала французский, мы должны порвать с нашими бывшими хозяевами, устранить следы империализма и принять наши местные языки."

IDC_31e_brigade_parachutiste: "Создание воздушно-десантной бригады"
IDC_31e_brigade_parachutiste_desc: "Мы должны создать элитное воздушно-десантное подразделение, способное быстро захватывать населенные пункты, уничтожать внутренних врагов и служить элитной гвардией для защиты национальных лидеров."
IDC_peacekeeping_forces: "Миротворческие силы"
IDC_peacekeeping_forces_desc: "Хотя война сейчас не опустошает Индокитай, она опустошает другие части мира. Даже если мы должны отправлять войска в дальние земли ради других, мы должны делать это во имя лучшего будущего."
