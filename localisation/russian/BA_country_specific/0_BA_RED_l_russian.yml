   REDF_eastern_offensive_defeat_desc:0 "Амнистия Особого отряда 227 отменена, и не было никакой героической победы. Теперь мы должны задуматься о том, что должно было случиться неизбежно: о Северном комитете изгнанников, который организует Финляндия, и о восстаниях военных правительств, которые последуют за этим."
