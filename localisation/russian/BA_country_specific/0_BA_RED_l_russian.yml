   RED_first_AEP: "Первая альтернативная экономическая политика"
   RED_first_AEP_desc: "Радикальная коллективизация и национализация не являются решением нашей текущей ситуации. В этом контексте 'военной экономики' необходима альтернативная экономическая политика. 'План альтернативной экономики' изменяет наши традиционные социалистические политики, интегрируя рыночные элементы, тем самым стимулируя рост малых и средних предприятий и создавая более прочную промышленную базу."
   RED_second_AEP: "Вторая альтернативная экономическая политика"
   RED_second_AEP_desc: "Радикальная коллективизация и национализация не являются решением нашей текущей ситуации. В этом контексте 'военной экономики' необходима альтернативная экономическая политика. 'План альтернативной экономики' изменяет наши традиционные социалистические политики, интегрируя рыночные элементы, тем самым стимулируя рост малых и средних предприятий и создавая более прочную промышленную базу."
