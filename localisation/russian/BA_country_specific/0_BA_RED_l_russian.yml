   RED_demand_cat: "Народные требования"
   RED_demand_cat_desc: "Наше правительство, опирающееся на поддержку масс, обязано удовлетворять их требования. Если мы не сможем их выполнить, мы потеряем их доверие, и наша легитимность будет подорвана.\n\n\n  £GFX_air_experience Активных миссий: §Y[?RED.RED_public_mission_activated]§!\n  £GFX_air_experience Успешных миссий: §G[?RED.RED_public_mission_completed]§!\n  £GFX_air_experience Проваленных миссий: §R[?RED.RED_public_mission_failed]§!"

   RED_demand_three_day_work: "Внедрить 3-дневную рабочую неделю"
   RED_demand_three_day_work_desc: "Массы требуют трехдневной рабочей недели, чтобы обеспечить достойную жизнь и досуг. Необходимо срочно принять закон."
   RED_demand_rearm: "Тотальное перевооружение"
   RED_demand_rearm_desc: "Политика агрессивной экспансии [TRM.getname] встревожила массы. Перевооружение необходимо для противостояния реакционной угрозе."
   RED_demand_industrialization: "Требование индустриализации"
   RED_demand_industrialization_desc: "Следуя историческому материализму Маркса, мы знаем, что экономический базис определяет надстройку. Радикальная и демократическая индустриализация укрепит социализм."
   RED_demand_quit: "Выход из Организации сотрудничества Кивотоса"
   RED_demand_quit_desc: "Нынешняя Организация сотрудничества Кивотоса — не более чем контрреволюционный инструмент. Мы должны выйти, чтобы защитить нашу революцию!"
   RED_demand_hospital: "Требование полевых госпиталей"
   RED_demand_hospital_desc: "Солдаты, организованные в профсоюзы, требуют лучших медицинских условий на фронте. Мы должны интегрировать полевые госпитали в наши подразделения."
   RED_demand_RMC_cut: "Распустить Революционный военный совет"
   RED_demand_RMC_cut_desc: "Красный бонапартизм должен быть устранен. Военные структуры должны быть демократизированы и подчинены солдатским профсоюзам."
   RED_demand_stability: "Обеспечить стабильность"
   RED_demand_stability_desc: "Административные профсоюзы требуют пяти основных политик для улучшения жизни народа: безопасность, стабильность, надежная система благосостояния, регулярное политическое участие и административная стабильность."
   RED_demand_infra: "Расширить инфраструктуру"
   RED_demand_infra_desc: "После гражданской войны строительные профсоюзы требуют срочного восстановления страны."
   RED_demand_arms: "Основать военно-промышленный комплекс"
   RED_demand_arms_desc: "Профсоюзы оборонной промышленности требуют расширения и углубления связей между военной промышленностью и вооруженными силами."
   RED_demand_chemi: "Развивать нефтехимическую промышленность"
   RED_demand_chemi_desc: "Производственный профсоюз предлагает развивать химическую промышленность для решения дисбаланса ресурсов и построения самообеспеченной экономики."
   RED_demand_core: "Интегрировать Скандинавию"
   RED_demand_core_desc: "Теперь, когда оккупационные режимы распущены, а оппозиция разгромлена, мы должны относиться к скандинавским народам как к равным и обеспечить их интеграцию."
   RED_demand_fin: "Восточная кампания"
   RED_demand_fin_desc: "Массы опасаются, что контрреволюционные силы уничтожат их достижения. Они предлагают превентивную революционную войну против Финляндии, угнетаемой реакционными феодальными элементами."
   RED_demand_defense_capital: "Защитить [141.GetCapitalVictoryPointName]"
   RED_demand_defense_capital_desc: "В войне с [TRM.getname] массы организуют баррикады и оборонные комитеты на каждом углу. Защита столицы любой ценой — наш абсолютный приоритет."
   RED_demand_system: "Завершить революционную систему"
   RED_demand_system_desc: "Массы, хотя и возвращаются к работе, чувствуют неуверенность перед переменами. Мы должны завершить структуру государства, чтобы дать им безопасность."
   RED_demand_industry: "Промышленная реструктуризация"
   RED_demand_industry_desc: "Хотя мы разгромили капиталистов, все еще сохраняются реакционные производственные отношения. Радикальная реструктуризация необходима."
   RED_demand_europe: "Освободить Европу"
   RED_demand_europe_desc: "Миллионы людей в Европе все еще находятся под гнетом эксплуататоров. Наш долг — освободить их!"

   RED_zenkyoutou_cat_dynamic_modifier: "Конференция революционного студенческого действия"
   RED_zenkyoutou_cat: "Конференция революционного студенческого действия"
   RED_zenkyoutou_cat_desc: "После славной §YСоциалистической революции§! под руководством §tМинори Ясумори§! академия вступила в великую трансформацию. Департамент общественных работ, преодолевая свои пределы, открыл новые революционные методы за границей, вдохновляясь §RАнархо-синдикализмом§! и социалистическими студенческими движениями. Так родилась §YКонференция революционного студенческого действия§!, также известная как §t'Дзенкёто'§!, международная социалистическая студенческая организация, поддерживаемая Центральным комитетом Красной Зимы."
   RED_install_zkt: "Установить Дзенкёто в [FROM.Controller.getname]"

   RED_population_issue_cat: "Проблемы перенаселения"
   RED_population_issue_cat_desc: "Миллионы студентов пересекли границу во время Катаклизма. Города перенаселены, конфликты с местными жителями растут. Если мы не примем меры, голод неизбежен.\nЗавершите фокус §Y$RED_land_research$§!, чтобы разблокировать решения для §YОблегчения перенаселения§! £GFX_decision_icon_small."
