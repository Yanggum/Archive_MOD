   RED_council_for_worker: "Совет для рабочих"
   RED_council_for_worker_desc: "Ужасная диктатура 'Бюро' произошла от слов 'более равный народ'. Новое синдикалистское рабочее правительство, основанное на принципе 'все люди равны, и нет народа более равного, чем другие', поведет людей."
   RED_to_left: "Борьба за производство"
   RED_to_left_desc: "В мире все еще много буржуазных угнетателей. Зависеть от капиталов, которые нам предлагают с улыбкой, — значит просто привести другого диктатора. Пришло время бороться за создание автономной производственной экономической системы."
   RED_workerparty_upgrade: "Демократическая индустриализация"
   RED_workerparty_upgrade_desc: "В отличие от политики индустриализации, руководимой правительством, политика индустриализации, возглавляемая рабочими, движимая добровольным спросом на индустриализацию самих рабочих, является уникальным социальным явлением в Красной Зиме."
   RED_union_igwan: "Плановый город"
   RED_union_igwan_desc: "Под руководством парламента южная часть кампуса Красной Зимы урбанизируется. После завершения строительства юг кампуса станет самым развитым и пригодным для жизни городом в Красной Зиме."
   RED_industrial_union: "Учреждение отраслевых профсоюзов"
   RED_industrial_union_desc: "Отраслевой профсоюз — это профсоюз, в который может вступить любой человек, работающий в одной отрасли. Наше дружественное к рабочим правительство активно способствует созданию и расширению отраслевых профсоюзов во многих областях."
   RED_worekr_pro: "Специализация рабочих"
   RED_worekr_pro_desc: "Квалифицированные рабочие в каждой области не только более эффективны в работе, но и показывают высокую производительность. Если они смогут обучать своим навыкам других рабочих, общее производство будет максимально увеличено."
   RED_mechanize_agri: "Механизация сельского хозяйства"
   RED_mechanize_agri_desc: "Хотя природная среда Северной Европы не идеальна для сельского хозяйства, использование сельскохозяйственной техники с технологией Кивотоса может позволить эффективно использовать пахотные земли."
   RED_gaegan_silsi: "Расширение сельского хозяйства"
   RED_gaegan_silsi_desc: "Механизация сельского хозяйства увеличила количество земли, которую мы можем обрабатывать. Парламент готовит план по выращиванию культур, которые обогатят столы и желудки нашего народа, на обширных равнинах вокруг кампуса."
   RED_school_communism: "Дополнительное распределение пудинга"
   RED_school_communism_desc: "В своей книге 'Завоевание хлеба' анархист этого мира Петр Кропоткин утверждал, что 'революционное правительство должно предоставлять полезные предметы непосредственно крестьянам, а не платить им деньгами'. Аналогично, нашему революционному правительству необходимо предоставлять материалы напрямую, чтобы обеспечить твердую поддержку масс. В нашем случае пудинг может сыграть эту роль."
   RED_HYUSIK: "3-дневная рабочая неделя"
   RED_HYUSIK_desc: "Трехдневная рабочая неделя была самым желанным идеалом благосостояния рабочих Красной Зимы, что было почти невозможно при гнете Бюро. Теперь, когда Совет рабочих создан, содержание трехдневной рабочей недели активно пересматривается."
   RED_worekrs_research: "Самые передовые трудовые права"
   RED_worekrs_research_desc: "Благодаря усилиям дружественного к рабочим совета, рабочие Красной Зимы могут добровольно идти на свои рабочие места, чтобы достичь и перевыполнить дневную норму производства, и наслаждаться качественной жизнью и комфортом, превосходящими жизнь рабочих других стран в свои выходные дни."
   RED_council_set_up: "Социалистическая индустриальная зона"
   RED_council_set_up_desc: "Южная часть кампуса Красной Зимы была зоной, наиболее сильно разрушенной во время ожесточенного сопротивления Бюро в ходе революции. В поисках подходящего места для строительства фабрик парламент спланировал создание большой промышленной зоны в этом районе."
   RED_asdfdd: "Улучшение горнодобычи"
   RED_asdfdd_desc: "Исследования местных ученых показали, что в центральной части кампуса Красной Зимы и его окрестностях есть много неразработанных месторождений железной руды. Нет причин колебаться в развитии горнодобычи, если это необходимо для построения автономной производственной экономической системы."
   RED_worker_republic_desc: "После многочисленных усилий совета Красная Зима установила успешную политику, благоприятную для рабочих. Теперь люди Красной Зимы будут жить с достоинством и автономией, не страдая под эгоистичным и жадным капитализмом. Да здравствует Рабочая Республика Красная Зима!"
   RED_military_union: "Оборонительный профсоюз"
   RED_military_union_desc: "Для полного успеха революции крайне важно развивать оборонную промышленность, а для этого нам нужно завоевать сердца тех, кто в ней работает. Создание оборонительного профсоюза — это способ заручиться их поддержкой."
   RED_Civilian_factory_union: "Профсоюз гражданских фабрик"
   RED_Civilian_factory_union_desc: "Большинство рабочих Красной Зимы заняты в обрабатывающей промышленности. Чтобы отстаивать их требования и выслушивать их мнения, необходимо активно способствовать созданию профсоюза фабрик."
   RED_infrastructure_union: "Строительный профсоюз"
   RED_infrastructure_union_desc: "Один из предшественников нынешнего парламента, 'Департамент услуг Красной Зимы', был известен своим опытом в гражданском строительстве еще со времен Кивотоса. Они окажут большую помощь в создании строительного профсоюза."
   RED_gun_gaebal: "Медиа-профсоюз"
   RED_gun_gaebal_desc: "Медиа-профсоюз, основанный редакцией «Красного Медведя», поддерживает борьбу журналистов и поглотил и консолидировал все местные упавшие СМИ для освещения повседневной жизни в Красной Зиме. Парламент присвоил Миёси Таканэ, представителю профсоюза, титул 'Народный журналист' и высоко оценил борьбу профсоюза."
   RED_soldier_union: "Солдатский профсоюз"
   RED_soldier_union_desc: "Солдатам, сражающимся на фронте, также необходимо объединяться, чтобы противостоять несправедливым требованиям. Солдатский профсоюз, основанный юными героями революционной войны, будет бороться за права солдат."
   RED_mil-ind_complex: "Профсоюз офисных работников"
   RED_mil-ind_complex_desc: "В западном мире офисные работники живут угнетенно, как винтики в машине. Мы дадим этим 'офисным работникам' право формировать свои собственные профсоюзы и предоставим большую автономию для поощрения их борьбы."
   RED_education_union: "Профсоюз образования"
   RED_education_union_desc: "Учителя в школах также имеют право на уважение как 'работники образования'. Если мы реализуем их справедливые требования прав и благосостояния, в конечном итоге мы повысим качество образования."
   RED_combine_of_edu_and_labor: "Сочетание образования и труда"
   RED_combine_of_edu_and_labor_desc: "В отличие от образования в стратифицированных реакционных государствах, образование в Красной Зиме превосходно в воспитании эффективных и трудолюбивых рабочих. Поэтому мы также должны позволить нашим местным студентам получать такое же образование."
   RED_revolution_city: "Революционный город"
   RED_revolution_city_desc: "Строить жилье с передовыми технологиями и современной инфраструктурой рядом с рабочими местами трудящихся и предоставлять его им и их семьям. Город, в котором есть все эти применения, может по праву называться 'революционным городом'."
   RED_housing_committee: "Комитет по развитию жилья"
   RED_housing_committee_desc: "Если многие из нашего народа живут в трущобах из-за нехватки жилья, они могут не доверять нашему правительству. Комитет по развитию жилья, возглавляемый строительным профсоюзом, начал работу по освоению земель в кампусе и прилегающих районах для удовлетворения потребностей растущего населения."
   RED_work_for_worker: "К освобождению труда"
   RED_work_for_worker_desc: "В течение долгого периода в Красной Зиме мы боролись против угнетателей и изменяли несправедливые социальные структуры, чтобы создать государство для рабочих. Теперь заря освобождения труда озаряет Красную Зиму."

   RED_minori_diplo_0: "Революционный изоляционизм"
   RED_minori_diplo_0_desc: "Массы, находящиеся под влиянием либерализма, склонны думать, что изоляция — это что-то устаревшее, феодальное и негативное без контекста. Однако сохранение изоляции необходимо для защиты революции. Сотрудничество или союз с режимами или системами, угнетающими другие трудящиеся массы, является явным предательством народа и противоречит революции."
   RED_minori_diplo_1: "Автономия"
   RED_minori_diplo_1_desc: "\"Автономное государство рабочих\""
   RED_minori_diplo_2: "Равенство"
   RED_minori_diplo_2_desc: "\"За равноправную Красную Зиму!\""
   RED_minori_diplo_3: "Освобождение"
   RED_minori_diplo_3_desc: "\"Рабочие всего Кивотоса и мира, объединяйтесь для освобождения!\""
   RED_minori_diplo_4: "Марш лишений"
   RED_minori_diplo_4_desc: "В Красной Зиме каждые несколько лет беспрецедентная волна холода приносит с собой великий голод. Хотя этот последний великий голод был компетентно урегулирован нашим правительством без серьезных проблем, этот 'Марш лишений' выявил недостатки в нашей политике, которые необходимо исправить."
   RED_minori_diplo_5: "Продовольственная самообеспеченность"
   RED_minori_diplo_5_desc: "После выживания в величайшем голоде в истории Красной Зимы осталась задача полной самообеспеченности продовольствием. Если мы повторим ошибки прошлого, поддержка нас уменьшится."
   RED_minori_diplo_6: "Приготовления к революционной войне"
   RED_minori_diplo_6_desc: "Хотя хаос в Красной Зиме постепенно уменьшается, мир становится все более неупорядоченным. Чтобы противостоять буржуа и империалистам мира, мы должны ускорить наши приготовления к революционной войне, которые мы продвигали."
   RED_minori_diplo_6_tt: "\nЕсли начнется §Rвойна§! с §Y@TRM [TRM.getname]§!, в зависимости от количества завершенных фокусов §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§!, будет добавлен национальный дух §YРеволюционная война§!."
   RED_minori_diplo_7: "Конференция студенческой борьбы"
   RED_minori_diplo_7_desc: "Под лозунгом автономного и горизонтального союза студенческих групп Конференция студенческой борьбы была создана студентами различных дисциплин, собравшимися для сохранения благосостояния Красной Зимы. Их щедрая поддержка поможет в подготовке к революционной войне."
   RED_minori_diplo_8: "Солидарность с зарубежными организациями"
   RED_minori_diplo_8_desc: "В мире есть много организаций, борющихся явно и тайно за освобождение рабочих. Были ли эти организации основаны людьми из Кивотоса или местными жителями, если они движимы общим делом освобождения рабочих, все они товарищи, и мы обязаны их поддерживать."
   RED_minori_diplo_9: "Добровольческие красные бригады"
   RED_minori_diplo_9_desc: "Как мы вновь подтвердили в Первомайскую революцию, революция по сути требует силы. Чтобы помочь зарубежным организациям, борющимся за автономию рабочих, мы создали добровольческие бригады. Эти 'Красные бригады', названные так из-за отличительной красной военной формы, включают большинство героев, участвовавших в Первомайской революции."
   RED_minori_diplo_10: "Рабочий интернационализм"
   RED_minori_diplo_10_desc: "Война, ведущаяся с использованием оборудования, произведенного рабочими, в конечном счете, является борьбой между товарищами-рабочими. Поэтому, если разразится война, мы должны убедить рабочих прекратить работу и под руководством Рабочего Интернационала стремиться к быстрому завершению войны и ускорить падение капиталистического класса."
   RED_minori_diplo_11: "План 'Красная Финляндия'"
   RED_minori_diplo_11_desc: "В прошлом Финляндия служила буфером между нами и Советским Союзом. Однако теперь, когда советская угроза стала реальной, мы должны рассмотреть и пересмотреть планы по привлечению Финляндии на нашу сторону."
   RED_minori_diplo_12: "Антимонополизм"
   RED_minori_diplo_12_desc: "Миллениум использует свои подавляющие технологии исключительно для собственной монополии. Мы больше не можем игнорировать растрату технологий в угоду немногим."
   RED_minori_diplo_13: "Антинацизм"
   RED_minori_diplo_13_desc: "Они несут опасную идеологию превосходства. Мы должны защитить тех, кого они определяют как 'низшие расы', от угнетения."
   RED_minori_diplo_14: "Антибольшевизм"
   RED_minori_diplo_14_desc: "Мы радовались, когда в этом мире появилось еще одно государство с нашей идеологией. Но они предали эти высокие идеалы. Предатели должны быть устранены."
   RED_minori_diplo_15: "Мировая революция"
   RED_minori_diplo_15_desc: "Мы привели Красную Зиму к светлому будущему через революцию. Но мы не можем останавливаться на достигнутом. Мы обязаны распространить священную революцию за наши границы."
   RED_minori_diplo_16: "Антиимпериализм"
   RED_minori_diplo_16_desc: "Англия и Франция гордятся цивилизациями, построенными за счет других. Это ошибочное империалистическое мышление должно быть исправлено."
   RED_minori_diplo_17: "Антифеодализм"
   RED_minori_diplo_17_desc: "Идея о том, что один человек правит другим, — это устаревшая идеология, от которой давно следовало отказаться."
   RED_minori_diplo_18: "Антифашизм"
   RED_minori_diplo_18_desc: "Италия, как государство-основатель фашизма, все еще проводит агрессивную внешнюю политику. Мы должны бороться с этой злокачественной идеологией."
   RED_minori_diplo_19: "Антидиктатура"
   RED_minori_diplo_19_desc: "Арона незаконно заняла Генеральный студенческий совет и установила диктатуру. Этот безумный ИИ должен быть немедленно остановлен."
   RED_minori_diplo_20: "Антикапитализм"
   RED_minori_diplo_20_desc: "Пока капитализм, враг рабочих, процветает в США, революция не закончится. Начиная с США, революционная волна пересечет океан."
   RED_minori_diplo_21: "§0Уничтожение идеализма§!"
   RED_minori_diplo_21_desc: "После появления чего-то странного, видевшие это подверглись промывке мозгов. Мы должны победить это странное существо, чтобы доказать, что верящие в духовное ошибаются."


   #Военно-морской флот
   RED_cruiser_question: "Реактивация норвежского линкора"
   RED_cruiser_question_desc: "Сообщается, что несколько линкоров, освобожденных от бывшего норвежского флота, были списаны и брошены. Хотя они довольно устарели по нашим стандартам, они могут быть возвращены в строй с некоторыми модификациями."
   RED_nortraship: "Обеспечение гражданских перевозок"
   RED_nortraship_desc: "Для логистики и быстрой переброски войск на расстояния мы должны обеспечить гражданские транспортные суда, даже если это повлечет за собой значительные политические издержки."
   RED_naval_rearmament: "Перевооружение флота"
   RED_naval_rearmament_desc: "Враги, угрожающие Красной Зиме, находятся не только на суше и в воздухе, но и на море. Из-за нашего географического положения, окруженного тремя побережьями, перевооружение флота является неотложным."
   RED_coastal_artillery: "Строительство береговых укреплений"
   RED_coastal_artillery_desc: "В отличие от востока, который хорошо защищен благодаря близости к нескольким странам Балтийского моря, западное побережье, где находится центральный офис, плохо оборудовано. Крайне важно обезопасить эту зону встречи Северного моря и датского пролива."
   RED_large_navy: "Крупномасштабный флот"
   RED_large_navy_desc: "Чтобы господствовать на морях, нам нужен мощный флот. Корректировка наших доктрин и продвижение военно-морских технологий значительно усилят наши силы."
   RED_light_cruisers: "Разработка легких крейсеров"
   RED_light_cruisers_desc: "Легкие крейсеры, хотя и не являются главными действующими лицами в морских сражениях, доказали свою чрезвычайную полезность в ролях поддержки. Это оправдывает ускоренные инвестиции в их разработку."
   RED_heavy_cruisers: "Разработка тяжелых крейсеров"
   RED_heavy_cruisers_desc: "Присутствие тяжелых крейсеров, способных осуществлять эффективную оборону, необходимо для контроля регионов за пределами Балтийского моря и господства в океанах."
   RED_small_navy: "Флот быстрого реагирования"
   RED_small_navy_desc: "Учитывая ограниченные промышленные возможности Красной Зимы для строительства большого флота, мы должны принять и использовать доктрины быстрого реагирования, специализирующиеся на партизанской войне на море."
   RED_submarines: "Разработка подводных лодок"
   RED_submarines_desc: "Подводные лодки, построенные с использованием передовых технологий, трудно обнаружить, и они способны потопить гораздо более крупного противника. Их использование максимизирует наши шансы на выживание и эффективность на относительно мелководном Балтийском море."
   RED_destroyers: "Разработка эсминцев"
   RED_destroyers_desc: "Военно-морские транспорты, отвечающие за снабжение и перевозки, уязвимы для подводных лодок. Разработка эсминцев имеет решающее значение для защиты этих жизненно важных линий."
   RED_controller_of_baltic: "Властелин Балтийского моря"
   RED_controller_of_baltic_desc: "Мы добились окончательного контроля над Балтийским морем — задачи, которую старые имперские державы так и не смогли выполнить. Теперь мы можем с гордостью провозгласить себя властелинами Балтийского моря."

   #Перевооружение
   RED_rearming_focus_0: "План перевооружения"
   RED_rearming_focus_0_desc: "Армия Красной Зимы из-за переходного периода и ожесточенного сопротивления местных жителей утратила былую мощь. С помощью местных сторонников, благоприятных для нашего правительства, мы должны ускорить перевооружение."
   RED_rearming_focus_1: "Увеличение производства военного снаряжения"
   RED_rearming_focus_1_desc: "Как исторически говорилось, накопление военного снаряжения до конфликта имеет решающее значение. Мы должны построить новые фабрики за пределами кампуса, чтобы увеличить производство военного снаряжения."
   RED_rearming_focus_2: "Промышленный комплекс"
   RED_rearming_focus_2_desc: "Рядом со старым кампусом академии в Емтланде есть пустующие земли. Создав там промышленный комплекс и используя проблемных студентов старой академии для производства военного снаряжения, мы можем значительно увеличить наше производство."
   RED_rearming_focus_3: "Усовершенствованные производственные мощности"
   RED_rearming_focus_3_desc: "После обширной разработки Фронтом освобождения знаний нам удалось создать производственные мощности, способные эффективно работать как с оборудованием Кивотоса, так и с оборудованием этого мира. Трудовой сектор проявил большой интерес к этим мощностям и планирует заменить ими все свои текущие установки."
   RED_rearming_focus_4: "Консолидация арсеналов"
   RED_rearming_focus_4_desc: "Разрозненные фабрики неэффективны для производства военного снаряжения. Хотя централизация арсеналов имеет недостатки, такие как большая уязвимость для атак, она необходима для более эффективного производства снаряжения."
   RED_rearming_focus_5: "Тундровый промышленный район"
   RED_rearming_focus_5_desc: "Засушливый регион тундры на первый взгляд кажется бесплодным, но обладает достаточной территорией для размещения промышленных комплексов. Используя наши технологии, мы можем превратить эту пустошь в продуктивный промышленный район."
   RED_rearming_focus_6: "Система массового производства"
   RED_rearming_focus_6_desc: "После бесчисленных повторяющихся задач студенты трудового сектора, ответственные за военное производство, приобрели опыт в этой области. Они даже разработали собственную систему массового производства, которую распространяют на другие фабрики."
   RED_rearming_focus_6_tt: "Увеличение производства фабрик: §G+3.00%§!"
   RED_rearming_focus_7: "Научная организация труда"
   RED_rearming_focus_7_desc: "Фронт освобождения знаний предложил улучшенную систему производства, ориентированную на рост эффективности, которая улучшает систему, разработанную трудовым сектором. Принятие этой системы обещает более эффективный промышленный рост."
   RED_rearming_focus_8: "Преданность производству"
   RED_rearming_focus_8_desc: "Сейчас крайне важно производить больше военного снаряжения. Хотя это может снизить эффективность производства, в Красной Зиме мы всегда отдавали приоритет количеству, и результаты всегда были удовлетворительными."
   RED_rearming_focus_8_tt: "Увеличение производства фабрик: §G+5.00%§!\nРост эффективности производства: §R-5.00%§!"
   RED_rearming_focus_9: "Эффект масштаба"
   RED_rearming_focus_9_desc: "Военная промышленность стала отдельной экономикой внутри Красной Зимы. Мы должны расширять наши фабрики, чтобы поддерживать этот экономический подъем."
   RED_rearming_focus_10: "Институт трудовой социальной инженерии"
   RED_rearming_focus_10_desc: "Гармония между трудом и обществом напрямую связана с жизнью населения. Для разработки политики, эффективно уравновешивающей эти два аспекта, нам нужна научная база. Создание института, посвященного трудовой социальной инженерии, позволит нам разрабатывать стабильную политику без народных волнений."
RED_rearming_focus_11: "Страстная жертва"
RED_rearming_focus_11_desc: "Если разразится война, жизнь населения погрузится в нищету. Если небольшая жертва может продемонстрировать нашу подавляющую мощь, сдержать вторжение соседних стран и сохранить мир, то эта жертва будет запомнена как благородный поступок."
RED_rearming_focus_12: "Пульс военной промышленности"
RED_rearming_focus_12_desc: "Военная экономика Красной Зимы вступила в свой золотой век. Многочисленные фабрики неустанно трудятся, производя военное снаряжение, словно сердце гиганта сильно бьется. Вновь Красная Зима преодолела трудности переходного периода и сделала шаг вперед."
RED_rearming_focus_13: "Артиллерийский завод"
RED_rearming_focus_13_desc: "Артиллерия — самый надежный друг пехоты. И много орудий гарантируют много побед. Нам следует построить артиллерийский завод, чтобы обеспечить достаточную артиллерийскую поддержку в военное время."
RED_rearming_focus_14: "Электростанция"
RED_rearming_focus_14_desc: "Электричество необходимо для современной жизни. Нам следует расширить наши генерирующие мощности, чтобы наши рабочие могли трудиться при ярком и теплом свете."

RED_army_production_improve: "Военно-промышленно-академическое сотрудничество"
RED_army_production_improve_desc: "Враги, угрожающие рабочим, повсюду. Мы должны исследовать военные технологии, чтобы гарантировать, что наши товарищи не будут жить в страхе."
RED_army_production_improve_tt: "Скорость исследований: §G+2.50%§!"
RED_strengthen_the_mobilization_plan: "Усиление мобилизации"
RED_strengthen_the_mobilization_plan_desc: "Исторически армия Красной Зимы действовала без надлежащего милитаристского подхода, полагаясь в основном на массовые атаки. Сейчас пришло время внедрить в Красной Зиме более совершенную и проработанную военную доктрину."
RED_military_engineering: "Военная инженерия"
RED_military_engineering_desc: "Война в этом регионе имеет свои правила. Если мы не приспособимся, нас просто оставят позади."
RED_artillery: "Артиллерия Красной Зимы"
RED_artillery_desc: "Некоторые офицеры Красной Зимы проявили глубокий интерес к артиллерии, способной уничтожать врагов на большом расстоянии."
RED_the_means_to_wage_war: "Исследование вспомогательного снаряжения"
RED_the_means_to_wage_war_desc: "Вспомогательное снаряжение, разработанное элитой Фронта освобождения знаний, поможет тем, кто сражается на поле боя."
RED_superior_war_machines: "Превосходство танков"
RED_superior_war_machines_desc: "Большинство местных жителей не знают о мощи и скорости танков. Однако те, кто сражался с контрреволюционерами, знают о превосходстве танков, и поэтому мы должны производить их много."
RED_quantity: "'Количество'"
RED_quantity_desc: "Как однажды сказал Наполеон, я всегда побеждал меньшинство большинством."
RED_quality: "'Качество'"
RED_quality_desc: "Не случайно существует термин 'элита'."
RED_quantity_to_quality: "Закон перехода количества в качество"
RED_quantity_to_quality_desc: "Закон перехода количества в качество, центральная концепция диалектического материализма, гласит, что количественные изменения, достигнув определенного порога, вызывают качественные изменения, приводя к новому качественному состоянию. Эти качественные изменения, в свою очередь, ведут к количественному расширению."
RED_quantity_to_quality_tt: "Получает половину эффектов национальных идей §Y$RED_quantity$§! и §Y$RED_quality$§!:\n\n"
RED_tank_destroyer: "Истребитель танков"
RED_tank_destroyer_desc: "Какими бы могущественными ни были солдаты Ореола, есть пределы в противостоянии танкам. Инвестиции в разработку противотанкового оружия будут чрезвычайно полезны."
   RED_arms_industrial_optimize: "Оптимизация военной промышленности"
   RED_arms_industrial_optimize_desc: "Текущая организация нашей военной промышленности — полный хаос. Нам необходимо поддерживать единообразие в военном производстве."
   RED_baltic_forts: "Тактическая механизация"
   RED_baltic_forts_desc: "Те, кто умирает от одного выстрела, разработали 'бронированные автомобили'. В условиях нехватки чудес в нашем мире нам тоже нужна эта технология."
   RED_defend_the_east_line: "Технология авианосцев"
   RED_defend_the_east_line_desc: "Военные корабли, несущие самолеты, — это невероятно творческая технология в этом мире. Мы должны ее перенять."
   RED_improve_the_south_line: "Реактивные двигатели"
   RED_improve_the_south_line_desc: "Ух ты! Не могу поверить, что существует то, что позволяет летать на высокой скорости в небе! Эта авиационная технология, соперничающая или даже превосходящая Миллениум, должна быть исследована."
   RED_through_the_road_of_snow: "Сквозь заснеженный путь"
   RED_through_the_road_of_snow_desc: "Доставка припасов по снегу на линию фронта — задача, в которой мы уже стали экспертами."
   RED_rehabilitated_military: "Великая реформа боевой доктрины"
   RED_rehabilitated_military_desc: "Преподаватели военных наук рекомендуют внедрить боевые доктрины в академии. Мы должны принять их советы и провести великую реформу военной доктрины."
   RED_military_reorganization_tt: ""
   RED_trench_exp: "Обучение окопной войне"
   RED_trench_exp_desc: "В отличие от Кивотоса, где преобладали городские бои, здесь нормой является окопная война. Для этого требуется специализированная подготовка."
   RED_trench_exp_tt: "Скорость строительства окопов: §G+5.0%§!\nМаксимальный уровень окопов: §G+5.0§!\nПолучаемый урон от ближней авиаподдержки: §G-5.0%§!"
   RED_an_adaptable_army: "Адаптируемая армия"
   RED_an_adaptable_army_desc: "Хотя климат этого места похож на Красную Зиму, в других регионах есть неизвестные нам условия. Мы должны подготовить наши войска к адаптации в различных климатических условиях."
   RED_an_adaptable_army_tt: "Потери от холода: §G-10.00%§!\nПотери от жары: §G-5.00%§!\nСнижение штрафов за местность: §G+10.0%§!"
   RED_penal_battalions: "Армия Нового Света"
   RED_penal_battalions_desc: "Потратив огромные ресурсы времени и бюджета на великую военную реформу, армия Красной Зимы теперь может гибко адаптироваться к вражеской тактике и эффективно проводить комбинированные операции."
   RED_shock_troops: "Обучение координации"
   RED_shock_troops_desc: "Секрет органичного перемещения больших армий — это обучение. Путем постоянных учений мы должны развивать сотрудничество между солдатами."
   RED_restore_cossack_units: "'Дисциплина'"
   RED_restore_cossack_units_desc: "В отличие от плохо обученной армии, дисциплинированная армия может раскрыть свой максимальный потенциал даже в неожиданных ситуациях."
   RED_restore_cossack_units_tt: "Атака пехотных дивизий: §G+5.0%§!\nСкорость пехоты: §G+5.00%§!"
   RED_cohesion_first: "'Энтузиазм'"
   RED_cohesion_first_desc: "С достаточным рвением к делу Красной Зимы и революции даже обычные рабочие и крестьяне могут присоединиться к нашей зимней армии. Хотя их обучение займет время, их сплоченность, основанная на энтузиазме, сравняется — или превзойдет — сплоченность дисциплинированных войск."
   RED_cohesion_first_tt: "Скорость мобилизации: §G+5.00%§!\nСкорость восстановления дивизий: §G+5.0%§!\nВремя обучения: §R+10.00%§!"

   RED_army_focus_1: "Профессиональные офицеры"
   RED_army_focus_1_desc: "Офицеры, окончившие военные академии, — незаменимые таланты. С их помощью мы должны провести полный пересмотр военной доктрины Красной Зимы."
   RED_army_focus_1_tt: "Скорость планирования: §G+10.0%§!\nИзменение призываемого населения: §R-5%§!"
   RED_army_focus_2: "Приоритет снабжению"
   RED_army_focus_2_desc: "Как гласит старая пословица, армия движется благодаря снабжению. Мы должны создать эффективную сеть снабжения, чтобы свести к минимуму сбои при непредвиденных обстоятельствах."
   RED_army_focus_2_tt: "Эффективность снабжения: §G+10%§!"
   RED_army_focus_3: "Солдатский совет"
   RED_army_focus_3_desc: "Коммуникация в таких жестких организациях, как армия, может быть неэффективной. Чтобы решить эту проблему, мы создадим солдатские советы, которые будут планировать и выполнять операции."
   RED_army_focus_3_tt: "Максимальный бонус планов: §R-5.0%§!\nСкорость планирования: §R-5.0%§!"
   RED_army_focus_4: "Крупномасштабные операции"
   RED_army_focus_4_desc: "В отличие от других академий Кивотоса, Красная Зима специализируется на крупных контингентах пехоты. Для эффективного управления ими ключевым будет сотрудничество между родами войск."
   RED_army_focus_4_tt: "Ширина боя подчиненных подразделений: §G-10.0%§!"
   RED_army_focus_5: "Централизованный контроль"
   RED_army_focus_5_desc: "Тщательное планирование и подготовка — лучшее оружие для войны. Чтобы достичь этого, центральный контроль должен быть абсолютным."
   RED_army_focus_5_tt: "Максимальный бонус планов: §G+10.0%§!"
   RED_army_focus_6: "Развертывание ополчения"
   RED_army_focus_6_desc: "В разгар опустошительной войны некоторые граждане могут вызваться добровольцами для защиты своих сообществ. Мы обучим этих патриотов эффективно служить на фронте."
   RED_army_focus_6_tt: "Защита ополчения Ореола: §G+5.00%§!"
   RED_army_focus_7: "Принцип демократического централизма"
   RED_army_focus_7_desc: "'Решать демократически и подчиняться принятым решениям.'\n\nЭто не сложно. Солдаты будут преданно служить военным планам, установленным путем обсуждения и голосования."
   RED_army_focus_7_tt: "Защита пехотных дивизий: §G+5.00%§!"

   #Фокус на ВВС
   RED_invest_only_one_mio: "Инвестировать в местного конструктора"
   RED_invest_only_one_mio_desc: "Из-за воздействия Великого Искажения большинство самолетов, произведенных в Кивотосе, больше не могут использоваться. Если мы инвестируем в местные компании, мы решим проблему отсутствия ВВС."
   RED_airforce_training_project: "Проект летной подготовки"
   RED_airforce_training_project_desc: "Хотя новый мир похож на природную среду Красной Зимы, есть географические различия. С помощью местных офицеров мы должны сформировать ВВС, адаптированные к местности."
   RED_redwinter_moustache_airport: "Аэропорт 'Усы' Красной Зимы"
   RED_redwinter_moustache_airport_desc: "Авиация 'Краснозимские Усы' — один из символов Красной Зимы. Восстановление этого места повысит престиж нашей академии."
   RED_extend_air_bases: "Расширение авиабаз"
   RED_extend_air_bases_desc: "Даже с хорошо обученными пилотами и современными самолетами мы не сможем эффективно действовать без авиабаз. Пришло время использовать наше превосходное гражданское строительство для их постройки."
   RED_air_doctrine_focus: "Консолидация воздушной доктрины"
   RED_air_doctrine_focus_desc: "Установление воздушной доктрины, адаптированной к ситуации Красной Зимы, позволит проводить более эффективную тактическую подготовку."
   RED_offensive_airforce: "Шок и трепет"
   RED_offensive_airforce_desc: "Какое оружие может уничтожить способность врага вести войну, проникая глубоко на его территорию? Только бомбардировщики способны на это."
   RED_defensive_airforce: "Превосходство в воздухе"
   RED_defensive_airforce_desc: "Контроль над небом необходим для победы. Чтобы защитить наши войска и наших людей, мы должны обеспечить превосходство в воздухе."
   RED_air_bomber: "Фокус на проектировании бомбардировщиков"
   RED_air_bomber_desc: "Важность бомбардировщиков уже доказана. Наши новые разработки сделают бомбардировки более эффективными и разрушительными."
   RED_air_fighter: "Фокус на проектировании истребителей"
   RED_air_fighter_desc: "Большое количество истребителей может завоевать небо даже против технологически превосходящего противника. Используя нашу рабочую силу, мы окрасим небо в красный цвет."
   RED_redwinter_airforce: "Военно-воздушные силы Красной Зимы"
   RED_redwinter_airforce_desc: "Благодаря нашим усилиям мы сформировали военно-воздушные силы, адаптированные к новому миру, с полностью обученными пилотами, вооруженными гибкой доктриной и современным оборудованием."


   #Фокус на Великой Зимней войне
   RED_revolution_war_focus_0: "Антифашистская священная война"
   RED_revolution_war_focus_0_desc: "Фашистское вторжение началось! Войска Тринити пересекают наши границы и не остановятся, пока не уничтожат нас. Эта война — крестовый поход за защиту социализма: мы будем сражаться и победим, чего бы это ни стоило!"
   RED_revolution_war_focus_1: "Военная мобилизация"
   RED_revolution_war_focus_1_desc: "Наше общество было готово к войне. Мы должны перевести гражданскую промышленность на военные рельсы и быстро отправить все припасы на фронт."
   RED_revolution_war_focus_2: "Эффективный транспорт"
   RED_revolution_war_focus_2_desc: "Перебои в транспорте повлияют на скорость снабжения. Несмотря на возможную оппозицию, мы реквизируем гражданские средства и улучшим дороги для поддержания логистического потока."
   RED_revolution_war_focus_2_tt: "Скорость пехоты: §G+3.00%§!\nПотребление снабжения: §G-3.0%§!\n\n"
   RED_revolution_war_focus_3: "Самообеспечивающаяся экономика"
   RED_revolution_war_focus_3_desc: "С самого начала Красная Зима боролась за выживание в одиночку. Теперь эта устойчивость проявится в нашей войне против Тринити."
   RED_revolution_war_focus_4: "Комиссары на фронте"
   RED_revolution_war_focus_4_desc: "Ужасы войны подрывают моральный дух. Комиссары на фронте напомнят нашим войскам об их цели: защищать свою родину."
   RED_revolution_war_focus_5: "Народный волнорез"
   RED_revolution_war_focus_5_desc: "Единственный способ выжить — доверять друг другу и поддерживать друг друга. Наше единство станет твердым волнорезом перед лицом фашистских волн."
   RED_revolution_war_focus_6: "Студенческие учебные центры"
   RED_revolution_war_focus_6_desc: "Все больше и больше студентов добровольно вызываются защищать родину. Мы расширим учебные центры, чтобы подготовить этих храбрецов."
   RED_revolution_war_focus_7: "Кустарное производство винтовок"
   RED_revolution_war_focus_7_desc: "В Красной Зиме легче достать оружие, чем ручку. Все, от рабочих до домохозяек, будут собирать винтовки для снабжения фронта."
   RED_revolution_war_focus_8: "Массовая мобилизация"
   RED_revolution_war_focus_8_desc: "Хотя тысячи уже маршируют на фронт, Тринити наступает. Мы должны мобилизовать все доступные резервы, чтобы остановить их."
   RED_revolution_war_focus_9: "Восстания в оккупированных зонах"
   RED_revolution_war_focus_9_desc: "Наши солдаты, проникшие в тыл врага, организуют восстания с рабочими и крестьянами, чтобы сковывать захватчиков."
   RED_revolution_war_focus_9.5: "Противотанковая технология"
   RED_revolution_war_focus_9.5_desc: "Ядро Тринити — их бронированный блицкриг. Мы исследуем и развернем противотанковое оружие, чтобы противостоять ему."
   RED_revolution_war_focus_10: "Мобильная оборона"
   RED_revolution_war_focus_10_desc: "Мы не можем статически оборонять всю территорию. С помощью мобильных сил мы будем выбирать, когда и где сопротивляться, нанося удар по врагу, когда это больнее всего."
   RED_revolution_war_focus_11: "Горные егеря"
   RED_revolution_war_focus_11_desc: "Егеря из Емтланда, эксперты в экстремальных условиях, присоединяются к нашей борьбе. Они наши лучшие снайперы."
   RED_revolution_war_focus_12: "Превосходство в огневой мощи"
   RED_revolution_war_focus_12_desc: "Хотя технология Тринити превосходит нашу, никакая броня не выдержит артиллерийского снаряда. Нам нужно больше асимметричной силы."
   RED_revolution_war_focus_12.5: "Зенитная тактика"
   RED_revolution_war_focus_12.5_desc: "Хотя мы сдерживаем их армию, воздушные атаки наносят ущерб нашей промышленности. Необходимо срочно разработать тактику противовоздушной обороны."
   RED_revolution_war_focus_13: "Фабрики на полную мощность"
   RED_revolution_war_focus_13_desc: "Война также ведется в тылу. Все работают, от детей до стариков, производя припасы для наших солдат."
   RED_revolution_war_focus_14: "Эффективное использование бронетехники"
   RED_revolution_war_focus_14_desc: "Чтобы противостоять вражескому продвижению, мы развернем бронетанковые подразделения, которые будут удерживать территорию и укреплять уязвимые точки."
   RED_revolution_war_focus_15: "Контратака"
   RED_revolution_war_focus_15_desc: "Тринити истощена, и их мораль падает. Пришло время начать наше наступление и вернуть им насилие, которое они посеяли!"
   RED_revolution_war_focus_16: "Национальная фортификация"
   RED_revolution_war_focus_16_desc: "Наш лесистый полуостров — естественная крепость. Укрепив стратегические точки, мы значительно замедлим любое вражеское продвижение."
   RED_revolution_war_focus_17: "Партизанская война"
   RED_revolution_war_focus_17_desc: "Наши партизаны без устали тревожат врагов в тылу, вынуждая Тринити вести войну на два фронта."


