   RED_minori_revolutionary_isolationism_desc: "Народы, находящиеся под влиянием либерализма, видят в изоляции нечто отсталое или феодальное. Однако для защиты революции сохранение изоляции является обязательным. Сотрудничество с режимами, угнетающими массы, — непростительное предательство."
