   RED_revolutionary_committee:0 "Революционный комитет"
   RED_SSdF:0 "ССдФ"
   RED_SSdF_long:0 "Скандинавский союз социал-демократии\n§gСкандинавский союз социал-демократии является органом сотрудничества между Социал-демократической рабочей партией Швеции, Норвежской рабочей партией и Социал-демократической партией Дании, общей целью которых является сдерживание радикализма революционного правительства.§!"
   RED_SAC-PWD:0 "САЦ-ДУ"
   RED_SAC-PWD_long:0 "Центральная конфедерация рабочих Швеции - Департамент услуг Красной Зимы\n§gЦентральная конфедерация рабочих Швеции (САЦ) — это синдикалистская федерация профсоюзов Швеции. САЦ объединяет в единый союз людей из всех секторов и отраслей, включая безработных и студентов. Она возникла в 1910 году как ультралевая оппозиция влиянию социал-демократии на рабочее движение.§!"
   RED_SACSAF-PWD:0 "САЦ/САФ-ДУ"
   RED_SACSAF-PWD_long:0 "Центральная конфедерация рабочих Швеции / Синдикалистская федерация рабочих - Департамент услуг Красной Зимы\n§gЦентральная конфедерация рабочих Швеции и Синдикалистская федерация рабочих составляют основной синдикалистский профсоюзный конгресс Швеции. САЦ объединяет в единый союз людей из всех секторов и отраслей, включая безработных и студентов. Они возникли в 1910 году как ультралевая оппозиция влиянию социал-демократии на рабочее движение, и хотя САФ отделилась от САЦ в 1928 году, в настоящее время они сотрудничают в рамках 'Красного фронта' под руководством Департамента услуг.§!"

