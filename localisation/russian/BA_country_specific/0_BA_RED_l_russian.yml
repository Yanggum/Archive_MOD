   # События
   RED_ending_event.1.t: "День Победы"
   RED_ending_event.1.d: "Это должно было случиться рано или поздно. Бесконечные расколы внутри марксистского движения, начиная со Второго Интернационала, подошли к концу благодаря [RED.getleader]. Флаг Красной Зимы развевается над Кремлем, и Советского Союза как суверенного государства больше не существует."
   RED_ending_event.1.a: "Долгая идеологическая война окончена."
   RED_ending_event.2.t: "Возвращение левой оппозиции"
   RED_ending_event.2.d: "Троцкий думал, что народ, измученный репрессивной эксплуатацией при сталинском режиме, встретит его с распростертыми объятиями. Но реальность оказалась иной.\n\n\"Антисоветский террорист разрушил страну!\"\n\n\"Прочь, гадюка!\"\n\n\"Осуждаем угнетателя!\"\n\nБлагодаря политическим маневрам верных сталинистов по всей федерации возникли антитроцкистские митинги. Будущее левой оппозиции будет нелегким."
   RED_ending_event.2.a: "Проклятье."
   RED_ending_event.2_tt: "\n§RМы должны сдержать рост сталинистских настроений!§!"
   RED_ending_event.3.t: "Сталинистское сопротивление"
   RED_ending_event.3.d: "Война все еще продолжается! Сталинистские партизаны организовали городских рабочих под контрреволюционным флагом, чтобы освободиться от нашего контроля, в то время как в сельской местности сталинистские партизаны используют колхозы как базы для своей деятельности."
   RED_ending_event.3.a: "Это выходит из-под контроля..."
   RED_ending_event.3_tt: "\n§RМы должны остановить сталинистских партизан!§!"
   RED_ending_event.4.t: "Революционный трибунал"
   RED_ending_event.4.d: "Искра революции загорается сама. Февральская революция привела к Октябрьской, которая вылилась в Гражданскую войну красных и белых, кульминируя теперь в этой идеологической войне. Последовательные контрреволюции были побеждены; теперь начинается подлинная революция. Под руководством Центрального революционного трибунала Ленинграда мы проведем чистки сталинистских бюрократов и военных в каждом регионе."
   RED_ending_event.4.a: "Пусть заплатят за свои преступления!"
   RED_ending_event.5.t: "Ленинградский революционный трибунал: Высшие бюрократы"
   RED_ending_event.5.d: "Номер: № 0004\nЗаголовок: Обвинительный акт\nКомиссия по расследованию контрреволюционных преступлений обвиняет:\n\nI. Обвиняемые: $SOV_iosif_stalin$, $SOV_lazar_kaganovich$, $SOV_vyacheslav_molotov$\nII. Основные обвинения: Контрреволюционный заговор, незаконный захват государственной и партийной власти, предательство рабочего класса.\nIII. Запрашиваемый приговор: Смертная казнь для всех трех обвиняемых.\n\nIV. Основания обвинения:\n\n1. Сталин и его сообщники отвергли принципы рабочей демократии, установленные товарищем Лениным, превратив Советы в бюрократическую олигархию.\n- Монополизировали решения Центрального Комитета, нерационально исключая ключевых фигур, таких как Лев Троцкий.\n- Управляли экономикой, исходя не из социалистических теорий, а из стремления удержать власть, ухудшая положение рабочих и крестьян.\n- Заменили диктатуру пролетариата бюрократической олигархией, разрушив социализм.\n\n2. Политика насильственной коллективизации Сталина жестоко подавляла крестьянство и нанесла ущерб социалистическому строительству.\n- Вызванный в 1932-1933 годах в Украине и Поволжье голод унес жизни миллионов.\n- Использование насилия вместо революционного участия крестьян отбросило социалистическую экономику назад.\n\n3. Сталинский центр препятствовал международному коммунистическому движению.\n- Упустил революционные возможности в Германии, Китае и Испании.\n- Свел СССР к изолированному социалистическому государству, предав ленинские принципы."
   RED_ending_event.5.a: "Утверждено."
   RED_ending_event.6.t: "Ленинградский революционный трибунал: НКВД"
   RED_ending_event.6.d: "Номер: № 0009\nЗаголовок: Обвинительный акт\nКомиссия по расследованию контрреволюционных преступлений обвиняет:\n\nI. Обвиняемые: Все высшее руководство НКВД\nII. Основные обвинения: Контрреволюционный заговор, нарушение диктатуры пролетариата, предательство рабочего класса.\nIII. Запрашиваемый приговор: Смертная казнь для некоторых и немедленный роспуск НКВД.\n\nIV. Основания обвинения:\n\n1. НКВД установил режим контрреволюционного террора внутри Советов, уничтожив диктатуру пролетариата.\n- Во время Большой чистки систематически казнили партийные кадры и профсоюзных лидеров.\n- Арестовывали, пытали и казнили верных большевиков.\n- Уничтожили внутрипартийную демократию, превратившись в тайную полицию на службе культа Сталина.\n\n2. По приказу Сталина жестоко подавляли рабочих и крестьян.\n- Арестовывали и казнили миллионы крестьян, сопротивлявшихся насильственной коллективизации.\n- Установили репрессивный надзор на фабриках и в колхозах.\n\n3. Фальсифицировали контрреволюционные заговоры.\n- Фабриковали доказательства и добывали признания под пытками.\n- Навязывали ложные показания во время Московских процессов.\n\n4. Разрушили международное коммунистическое движение.\n- Сеяли террор в коммунистических организациях, например, во время Гражданской войны в Испании.\n- Похищали и убивали революционеров за границей."
   RED_ending_event.6.a: "Утверждено."
   RED_ending_event.6.b: "Часть обвинений была отклонена."
   RED_ending_event.6_tt: "§gНКВД временно будет служить организационным щитом против сталинистского террористического заговора.§!"
   RED_ending_event.7.t: "Ленинградский революционный трибунал: Красная Армия"
   RED_ending_event.7.d: "Номер: № 0013\nЗаголовок: Обвинительный акт\nКомиссия по расследованию контрреволюционных преступлений обвиняет:\n\nI. Обвиняемые: Контрреволюционные руководители Красной Армии.\nII. Основные обвинения: Контрреволюционный заговор, сотрудничество со сталинистами во время идеологической войны.\nIII. Запрашиваемый приговор: Отстранение некоторых офицеров.\n\nIV. Основания обвинения:\n\n1. Некоторые бюрократы в Красной Армии нарушили принцип рабочего контроля над вооруженными силами.\n- Сотрудничали с контрреволюционными фракциями во время идеологической войны."
   RED_ending_event.7.a: "Утверждено."
   RED_ending_event.7_tt: "§gПотребуется время, чтобы восстановить профессионализм Красной Армии. Многие офицеры будут обижены и тайно симпатизировать сталинистскому сопротивлению.§!"
   RED_ending_event.8.t: "Ленинградский революционный трибунал: Сталинистские террористы"
   RED_ending_event.8.d: "Номер: № 0041\nЗаголовок: Обвинительный акт\nКомиссия по расследованию контрреволюционных преступлений обвиняет:\n\nI. Обвиняемые: Организаторы и пособники сталинистского террора.\nII. Основные обвинения: Контрреволюционный террор, предательство рабочего класса.\nIII. Запрашиваемый приговор: Смертная казнь для главных зачинщиков, трудовая перевоспитание для некоторых.\n\nIV. Основания обвинения:\n\n1. Сталинистские группы совершали вооруженные нападения на рабочее государство.\n- Убийства советских крестьян и партийных кадров в сельской местности.\n- Заговоры с целью саботажа фабрик, учреждений и советов.\n- Нападения на железные дороги и линии связи с целью парализовать пролетарское государство."
   RED_ending_event.8.a: "Утверждено."
   RED_ending_event.9.t: "Роспуск Обвинительной комиссии"
   RED_ending_event.9.d: "Во времена крайнего кризиса крайние меры оправданы, но их полезность закончилась. Мы приняли все необходимые меры для поддержания порядка. В связи с растущей озабоченностью абсолютной властью Комиссии, после завершения последнего революционного трибунала Комиссия приняла решение самораспуститься. Больше не существует института, имеющего право обвинять в контрреволюционных действиях. Революционные судьи вернутся к своей обычной судебной роли."
   RED_ending_event.9.a: "Хорошая работа."
   RED_ending_event.10.t: "Реконструкция авангардной партии"
   RED_ending_event.10.d: "С завершением чистки бюрократов партия теперь может выполнять свою авангардную роль. Больше нельзя допускать предательств по отношению к революции и народу. Авангардная партия будет направлять и организовывать народ на пути вперед."
   RED_ending_event.10.a: "Будем следовать ленинским принципам!"
   RED_ending_event.10_tt: "Может быть устранен §Y$RED_stalinist_sentiments_1$§! с помощью решения §Y£GFX_decision_icon_small Демонтаж бюрократии§!."

   # Обычные события
   RED_ordinary_event.1.t: "Черино теряет прекрасные усы"
   RED_ordinary_event.1.d: "\"\""
   RED_ordinary_event.2.t: "Особый класс 227"
   RED_ordinary_event.2.d: "\"Черт возьми, какой же здесь все-таки бардак!\"\n\nАмами Нодока жаловалась голосом, полным разочарования. \"Ну, после Великого Перемещения неудивительно, что они забыли про старую школу.\"\n\nЗаметила Майой Шигуре. Обе понимали, что их возвращение в главную школу отложено на неопределенный срок, возможно, в десять раз дольше, чем ожидалось. К счастью, им удалось раздобыть припасы из близлежащей местной деревни, что немного улучшило условия.\n\nОднако после особенно неудобной ночи, полной кошмаров, Нодока обнаружила, что старая школа была полностью перестроена за один день."
   RED_ordinary_event.2.a: "Что за черт здесь творится!?"
   RED_ordinary_event.3.t: "Отопление"
   RED_ordinary_event.3.d: "С восстановлением школы требовалось много топлива, чтобы поддерживать в ней тепло. Амами Нодока собирала деревянные обломки для растопки.\n\n\"Уф, эта деревянная балка слишком глубоко в земле. Сколько бы я ни старалась, не вытащить!\"\n\n\"Правда? Дай-ка помогу, давай тянуть вместе!\"\n\nБлагодаря помощи Шигуре Нодоке наконец удалось вытащить балку из земли.\n\n\"Аааах!\"\n\nКак раз в этот момент из земли ударила мощная струя воды, быстро образовавшая лужу, а точнее, небольшое озеро.\n\n\"Черт, я вся промокла! Вот невезуха!\"\n\n\"Нет, Нодока, посмотри внимательно на воду! Пахнет серой... это горячий источник!\""
   RED_ordinary_event.3.a: "\"Онсэн!?\""
   RED_ordinary_event.4.t: "Горячие источники!"
   RED_ordinary_event.4.d: "\"Хм. Но что нам делать с этими горячими источниками? Похоже, от них мало пользы.\"\n\n\"Как ты можешь говорить, что онсэн бесполезен?!\"\n\nВнезапно из ниоткуда появились члены Департамента освоения горячих источников Геенны и Шимокура Мегу. Полностью игнорируя ошеломленные вопросы Нодоки о том, как они добрались так быстро, они в мгновение ока построили гигантский рёкан и комплекс горячих источников, после чего удалились."
   RED_ordinary_event.4.a: "\"Что только что произошло? Это было как ураган.\""

   # События Троцкого (tro_event)
   RED_tro_event.1.t: "Покушение на Троцкого со стороны [SOV.getname]!"
   RED_tro_event.1.d: "К сожалению, наш местный советник 'Лев Троцкий' когда-то был одним из главных лидеров-большевиков наряду с Владимиром Лениным в борьбе против капитализма. Однако в 1920-х годах Троцкий проиграл борьбу за власть нынешнему советскому лидеру Иосифу Сталину и был вынужден отправиться в изгнание, оказавшись здесь.\n\nСталин, чтобы укрепить свою власть в Советском Союзе, неоднократно использовал свои разведывательные сети, чтобы попытаться убить Троцкого.\n\nМы не позволим 'выродившемуся рабочему государству' забрать жизнь нашего товарища Троцкого. Мы защитим его жизнь любой ценой!"
   RED_tro_event.1.a: "Усильте охрану!"
   RED_tro_event.1_tt: "\nВы можете добиться §GПобеды§! в §YЗмейке§!, завершив фокусы §Y$RED_advance_security$§! или §Y$RED_all_power_to_redwinter$§!."
   RED_tro_event.2.t: "Смерть Троцкого"
   RED_tro_event.2.d: "Нам не удалось защитить Троцкого. Однако его наследие останется в нашей академии."
   RED_tro_event.2.a: "Что же нам теперь делать?"
   RED_tro_event.3.t: "Жалобы Черино"
   RED_tro_event.3.d: "\"Почему остановили строительство моей статуи?!\"\n\nРенкава Черино была разочарована тем, что Троцкий выступает против ее проекта идолопоклонничества. Однако по мере стабилизации ситуации после Великого Перемещения все больше и больше членов Секретариата поддерживали Троцкого.\n\n\"Сейчас важно обеспечить жизнь народа и студентов, а не поощрять культ личности.\"\n\nЧерино хотела немедленно выгнать его, но, зная, что не сможет победить его в споре, посмотрела на Томоэ в поисках поддержки. Однако Томоэ также отговорила ее, сказав: \"Тебе не стоит этого делать, Черино-чан\".\n\nЧерино скрестила руки и осталась стоять, ворча."
   RED_tro_event.3.a: "Может, мне стоит почитать книгу..."
   RED_tro_event.4.t: "Фронт освобождения знаний"
   RED_tro_event.4.d: "Акиидзуми Момидзи, студентка-библиотекарь, работала в составе Фронта освобождения знаний. Пока она выполняла свою обычную работу, внезапно появилась Черино с несколькими членами Комитета безопасности.\n\n\"Э, президент Черино? Почему вы вдруг сюда пришли?\"\n\n\"Хороший вопрос! Я пришла сюда по очень важной причине -\"\n\n\"Нет, не нужно объяснять. Вы пришли конфисковать наши драгоценные книги, да?!\"\n\n\"Я пришла не конфисковывать книги, я пришла...!\"\n\n\"Я не позволю вам забрать эту книгу! Я даже не дочитала её!\"\n\n\"Подожди! Я не за этим пришла! Я пришла получить знания!\"\n\n\"Э...? Какие именно знания вам нужны?\"\n\n\"Я должна получить больше знаний, чем Троцкий! Этот тип такой умный, что я не могу победить его в дебатах о коммунизме!\"\n\n\"А... если так, я бы рекомендовала начать с 'Манифеста Коммунистической партии' Карла Маркса. Он идеально подходит для начинающих.\"\n\nС книгой в руках Черино вернулась в Секретариат."
   RED_tro_event.4.a: "Что вообще происходит?! Ничего не понимаю!"
   RED_tro_event.5.t: "Создание Комитета по делам беженцев"
   RED_tro_event.5.d: "Благодаря помощи Троцкого в решении наших проблем, славная товарищ Черино решила помочь спасти его соратников, преследуемых сталинистами по всему миру. По прямому приказу Черино был быстро создан комитет для доставки троцкистов-изгнанников в безопасное место в Красной Зиме."
   RED_tro_event.5.a: "Давайте спасем их!"
   RED_tro_event.5_tt: "\n§gВы сможете отправлять агентов в страны, куда были изгнаны троцкисты, чтобы спасти их.§!"
   RED_tro_event.6.t: "Название Автономной республики"
   RED_tro_event.6.d: "\"Название 'Автономная республика' звучит очень скучно.\"\n\nЧерино пожаловалась Томоэ, которая улыбнулась и пошла передавать жалобы Черино в соответствующий комитет."
   RED_tro_event.6.a: "Неприемлемо!"
   RED_tro_event.6.b: "Что ж, если это мнение Черино..."
   RED_tro_event.7.t: "Мировая революция"
   RED_tro_event.7.d: "Мы больше не можем откладывать! Мы решили распространить революционные идеалы социализма по всему миру. От Тихого до Атлантического океана, от Азии до Океании, от Северного полюса до Южного: мы сделаем так, чтобы красный флаг развевался над каждой фабрикой и каждым холмом!"
   RED_tro_event.7.a: "Да здравствует мировая революция!"
   RED_tro_event.7_tt: "\n§gЕсли мы находимся в состоянии войны, некоторые негативные эффекты будут уменьшены вдвое.§!"
   RED_tro_event.8.t: "Отношение к Секретариату"
   RED_tro_event.8.d: "Пока баланс сил окончательно не определился, мы не можем относиться к Черино или Секретариату как к врагам. Однако устранение политического соперника, основываясь на сталинистских прецедентах, не обязательно было бы ошибкой."
   RED_tro_event.8.a: "Внимательно следите за Секретариатом."
   RED_tro_event.8.b: "Давайте распустим Секретариат сейчас же!"
   RED_tro_event.9.t: "Принудительное переселение рабочих-мигрантов"
   RED_tro_event.9.d: "Для достижения наших амбициозных промышленных целей необходимо мобилизовать рабочих из разных регионов. Рабочие-мигранты будут направлены на проекты плановых городов и расширение промышленной инфраструктуры."
   RED_tro_event.9.a: "Это хорошая идея."

   # Общие события (RED_generic)
   RED_generic.1.t: "Запрос на инвестиции от [RED.getname]"
   RED_generic.1.d: "[RED.getname] обратилась к нам с просьбой приобрести ее 'Восстановительные облигации'. По истечении срока мы сможем вернуть инвестиции с процентами."
   RED_generic.1.a: "Хорошая сделка."
   RED_generic.1.b: "Мы сейчас заняты."
   RED_generic.2.t: "Согласие [FROM.getname]"
   RED_generic.2.d: "[FROM.getname] согласилась приобрести наши облигации."
   RED_generic.2.a: "С благодарностью."
   RED_generic.3.t: "Отказ [FROM.getname]"
   RED_generic.3.d: "[FROM.getname] отклонила нашу просьбу."
   RED_generic.3.a: "Какая жалость."
   RED_generic.4.t: "Корректировка продажи внутренних облигаций"
   RED_generic.4.d: "Местные капиталисты и мелкая буржуазия пытаются приобрести облигации."
   RED_generic.4.a: "Разрешим только ограниченные покупки."
   RED_generic.4.b: "Должным образом их отрегулируем."
   RED_generic.4.c: "Позволим им действовать свободно."
   RED_investment_tt_1: "Предоставлено гражданских фабрик: §G+2§!"
   RED_investment_tt_2: "Предоставлено гражданских фабрик: §G+4§!"
   RED_investment_tt_3: "Предоставлено гражданских фабрик: §G+6§!"
   RED_generic.5.t: "Истечение срока Восстановительных облигаций"
   RED_generic.5.d: "Срок действия облигаций истек. Мы можем либо погасить их, либо продлить их действие."
   RED_generic.5.a: "Давайте погасим."
   RED_generic.5.b: "Продлим срок."
   RED_generic.6.t: "Погашение облигаций [RED.getname]"
   RED_generic.6.d: "[RED.getname] погасила наши облигации с процентами."
   RED_generic.6.a: "Отлично."
   RED_generic.7.t: "Продление срока погашения облигаций [RED.getname]"
   RED_generic.7.d: "[RED.getname] попросила отложить погашение облигаций."
   RED_generic.7.a: "Это что, мошенничество?"
   RED_generic.8.t: "Отказ от погашения облигаций [RED.getname]"
   RED_generic.8.d: "[RED.getname] объявила, что не будет погашать приобретенные облигации."
   RED_generic.8.a: "Черт, нас обманули!"
   RED_generic.9.t: "Крах кредита"
   RED_generic.9.d: "После нашего отказа погашать облигации наше доверие рухнуло. Паника парализует экономику, финансы и промышленность. Нам нужна 'крайняя' и 'немедленная' политика, чтобы выжить!"
   RED_generic.9.a: "Черт возьми!"
   RED_generic.9_tt: "\nЕсли вы не завершите фокус §Y$RED_unlimited_inflation$§! или §Y$RED_currency_suspension$§! в течение §Y60§! дней, экономика полностью рухнет!"
   RED_generic.10.t: "Восстановительные облигации"
   RED_generic.10.d: "Положение академии буквально катастрофическое. Перенаселение, нехватка продовольствия, отсутствие товаров народного потребления, разрушенная инфраструктура и паралич управления со всей очевидностью показывают, что мы не можем восстановиться в одиночку.\n\nМы должны гибко применять принципы социализма. Принимая внешние инвестиции, мы восстановим, взрастим и разовьем нашу промышленность до достижения самообеспеченности.\n\n...Выплата долгов — это проблема будущего."
   RED_generic.10.a: "К экономическому восстановлению!"
   RED_generic.10_tt: "Через §Y365§! дней нам, возможно, придется вернуть §Rвдвое§! больше полученных гражданских фабрик в течение §Y365§! дней."
   RED_generic.11.t: "Местные специалисты"
   RED_generic.11.d: "Очевидно, что академия неспособна восстановить собственную промышленность после Великого Перемещения. Поэтому нам нужно привлечь местных специалистов и даже капиталистов в качестве советников, чтобы ускорить промышленное восстановление."
   RED_generic.11.a: "Другого выхода нет."
   RED_generic.12.t: "Альтернативная экономическая политика"
   RED_generic.12.d: "Радикальная коллективизация и национализация не решат нынешний кризис. Нам требуется 'Альтернативная экономическая политика' (АЭП), которая временно изменит наше социалистическое планирование, включив элементы рынка для стимулирования роста малых и средних предприятий и создания прочной промышленной базы."
   RED_generic.12.a: "Это не ревизионизм, это чрезвычайная мера."
   RED_generic.12_tt: "Цель §YПервой Альтернативной экономической политики§! — превысить §Y40§! гражданских фабрик."
   RED_generic.12_tt_1: "Цель §YВторой Альтернативной экономической политики§! — превысить §Y80§! гражданских фабрик."
   RED_generic.13.t: "Роспуск Оборонного комитета"
   RED_generic.13.d: "После кампаний в Швеции, Дании и Норвегии '[RE4.Getname]' прекратил сопротивление в [148.GetCapitalVictoryPointName] и решил самораспуститься. Наше скандинавское приключение заканчивается здесь."
   RED_generic.13.a: "Хорошая работа."
   RED_generic.15.t: "Оценка Первой АЭП"
   RED_generic.15.d: "Умеренно большой зал заседаний заполнили народные комиссары и экономические эксперты для оценки успеха Альтернативной экономической политики (АЭП). В то время как местные специалисты хвалили ее, члены родом из Кивотоса выказывали скептицизм. Это решение окажет значительное влияние на нашу будущую экономическую политику."
   RED_generic.15.a: "АЭП была успешной!"
   RED_generic.15.b: "Мы должны остановить этот безумный эксперимент."
   RED_generic.15.c: "Результаты неоднозначны, нужно продолжать наблюдение."
   RED_generic.15.a_tt: "§YАЭП получила успешную поддержку§! благодаря превышению §G40§! гражданских фабрик."
   RED_generic.15.b_tt: "§gМы откажемся от АЭП и вернемся к плановой экономике.§!\n\nБудут разблокированы новые промышленные фокусы, ориентированные на планирование."
   RED_generic.15.c_tt: "§YПоддержка АЭП слабая§!, так как мы не превысили §R40§! гражданских фабрик."
   RED_throw_aep_away: "Переход от §YАЭП§! к §YПлановой экономике§!"
   RED_generic.16.t: "Цель достигнута досрочно"
   RED_generic.16.d: "Мы достигли целей АЭП раньше запланированного срока."
   RED_generic.16.a: "Впечатляет."
   RED_generic.18.t: "Внешняя политика"
   RED_generic.18.d: "Пока мы сосредотачивались на внутренней политике, мир быстро изменился. Пришло время обратить наше внимание вовне."
   RED_generic.18.a: "Примем прагматичные решения."
   RED_generic.18.b: "Будем агрессивно защищать наш суверенитет."
   RED_generic.19.t: "Промышленное планирование"
   RED_generic.19.d: "Плановая промышленность работает с эффективностью, не сравнимой с рынком. Но чтобы внедрить ее здесь, в этом капиталистическом мире, нам нужно провести полную социальную трансформацию вместе с экономическим планированием. Хотя администрация все еще слаба, мы подготовили десятилетний план, ориентированный также на укрепление военной промышленности."
   RED_generic.19.a: "Мы должны спокойно корректировать экономику."
   RED_generic.20.t: "Поражение в пограничном конфликте"
   RED_generic.20.d: "Мы потерпели поражение в пограничном конфликте."
   RED_generic.20.a: "Черт возьми."
   RED_generic.20.b: "Если мы проиграли конфликт, мы выиграем войну!"
   RED_generic.21.t: "Победа в пограничном конфликте"
   RED_generic.21.d: "Мы одержали победу в пограничном конфликте."
   RED_generic.21.a: "Отлично."
   RED_generic.22.t: "Поддержка от [RED.getname]"
   RED_generic.22.d: "Поддержка от [RED.getadjective] прибыла к нам."
   RED_generic.22.a: "С благодарностью."
   RED_generic.23.t: "Предложение от [RED.getname]"
   RED_generic.23.d: "Мы получили предложение от Красной Зимы об импорте низкооплачиваемых рабочих."
   RED_generic.23.a: "Это хорошая сделка."
   RED_generic.23.b: "Похоже, это невыгодно для нас."
   RED_generic.24.d: "Мы получили предложение от Красной Зимы об обмене ресурсами и технологиями."
   RED_generic.25.t:0 "Что такое Военная администрация?"
   RED_generic.25.d:0 " Военная администрация — это орган военного управления, созданный при Секретариате после Великого Перехода, когда Красная Зима продвинулась на запад в Норвегию и начала северное наступление против остатков сил Швеции. Хотя формально они подчиняются приказам Секретариата, в зонах своей юрисдикции они обладают властью, не полностью контролируемой.\n\n Однако, с крахом административной системы, у нас нет иного выбора, кроме как вложить огромные усилия в их подчинение.\n\n Из-за географической удаленности от академии материальное снабжение Военных администраций ограничено, что привело к сильному подъему демократического сопротивления среди местного населения на оккупированных территориях. По мере роста поддержки демократии эта тенденция усиливается, что ведет к увеличению нестабильности Военных администраций. Если эта нестабильность достигнет критического уровня, Военные администрации рухнут, и регион выйдет из-под контроля нашей академии. Поэтому мы должны подавлять поддержку демократии внутри Военных администраций.\n\n Тем не менее, нестабильность Военных администраций может быть снижена с помощью решений или фокусов, использующих снаряжение и командные способности, таких как '$RED_enlarge_secret_police$', '$RED_enemy_of_class$' и '$RED_welcome_immigrate$'. Чтобы окончательно распустить Военные администрации, мы можем превратить их в автономные республики через фокус '$RED_enticing_locals$', затем интегрировать их через фокус '$RED_welcome_immigrate$', или же аннексировать их через фокус '$RED_depress_locals$' и постепенно ассимилировать."
   RED_generic.25.a:0 "Отлично, я все прекрасно понял!"
   RED_generic.26.t:0 "Курс индустриализации в зонах под военным управлением"
   RED_generic.26.d:0 "Мы должны способствовать индустриализации в регионах, ранее управлявшихся Военными администрациями. Однако наша административная способность все еще недостаточна, поэтому мы можем поддержать местную промышленность, чтобы она развивала свою собственную индустриализацию автономно. С другой стороны, если мы примем модель централизованного экономического планирования, мы сможем осуществлять прямой контроль над промышленностью в целом."
   RED_generic.26.a:0 "Воспользуемся местной промышленностью."
   RED_generic.26.b:0 "Административную способность можно компенсировать любой ценой!"
   RED_generic.27.t:0 "Отмена военного положения"
   RED_generic.27.d: "Военное положение, объявленное примерно на два месяца, требовало контроля Секретариата практически над всеми секторами академии и местных регионов. Это возложило чрезмерную нагрузку на отдельных бюрократов и чрезмерно истощило наши административные ресурсы. Теперь, когда западное наступление завершено, по предложению товарища директора Секретариата Черино, Секретариат решил отменить военное положение, что станет первой мерой в процессе административного восстановления, планируемого на будущее."
   RED_generic.27.a: "Не осталось никакой значительной угрозы!"
   RED_generic.28.t: "Угроза всеобщей забастовки"
   RED_generic.28.d: "Не только Военные администрации, но и бюрократы Красной Зимы, направленные для замены местных чиновников, оказались некомпетентными, неэффективными и, к тому же, эксплуататорами. Центр неспособен их контролировать, и в результате местное рабочее движение переросло рамки переговоров и экономической борьбы, развившись в широкую межотраслевую координацию и антисистемное движение. Без решительного роспуска этих структур сложно ожидать стабильного управления академией."
   RED_generic.28.a: "Договоримся о разумном компромиссе с профсоюзами."
   RED_generic.28.b: "Подавить их."

   RED_reading.1.t: "'Манифест Коммунистической партии'"
   RED_reading.1.d: "'Призрак бродит по Европе — призрак коммунизма.'\n\n 'Манифест Коммунистической партии', начинающийся с этой многозначительной фразы, представляет собой брошюру, написанную Карлом Марксом и Фридрихом Энгельсом в феврале 1848 года. Он содержит основные принципы коммунистической мысли, резюмируемые фразой 'Вся история человечества есть история борьбы классов', и предлагает анализ этой доктрины.\n\n \"Черт, ничего не понимаю!\"\n\n Черино решила найти Троцкого и попросить его объяснить. Троцкий рассказал ей об индустриальном обществе XIX века и Просвещении, поместив это в исторический контекст.\n\n \"Так возникли два класса: буржуазия и пролетариат.\"\n\n 'Манифест' объясняет, что история движется через классовую борьбу, конфликт между господствующими и угнетенными классами, примером чему служат отношения свободных и рабов, дворян и простолюдинов, господ и крепостных. В индустриальном обществе этими основными классами являются буржуазия и пролетариат. Буржуазия, выросшая с Промышленной революцией, владеет средствами производства (фабриками, землей, машинами) и обладает экономической и политической властью; это господствующий класс. С другой стороны, пролетариат обладает только своей рабочей силой, которую вынужден продавать, чтобы выжить, и эксплуатируется буржуазией. Противоречие между этими классами порождает неравенство и внутренние экономические кризисы капитализма, что ведет к необходимости пролетарской революции.\n\n \"Кроме того, Маркс не ограничился анализом общества, он также определил задачи коммунистов.\"\n\n В этой брошюре Маркс подчеркивает, что уничтожение частной собственности — это долг коммунистов, и выделяет, что их конечная цель — построение бесклассового общества.\n\n \"Голова все еще болит, но, кажется, я в целом поняла!\""
   RED_reading.1.a: "'Пролетарии всех стран, соединяйтесь!'"
   RED_reading.2.t: "Какую книгу мне прочесть?"
   RED_reading.2.d: "Черино решила посетить Фронт освобождения знаний, чтобы выбрать книгу."
   RED_reading.2.a: "Книгу Маркса"
   RED_reading.2_tt_marx: "\n§RОсталось книг Карла Маркса: §Y[?RED_read_marx]§!."
   RED_reading.2.b: "Книгу Каутского"
   RED_reading.2_tt_kautsky: "\n§RВы прочитали §Yвсе§! книги §RКарла Маркса§!, открыв эту опцию.\n\n§RОсталось книг Карла Каутского: §Y[?RED_read_kautsky]§!."
   RED_reading.2.c: "Книгу Ленина"
   RED_reading.2_tt_lenin: "\n§RВы прочитали §Yвсе§! книги §RКарла Маркса§!, открыв эту опцию.\n\n§RОсталось книг Владимира Ленина: §Y[?RED_read_lenin]§!."
   RED_reading.2.e: "Книгу Люксембург"
   RED_reading.2_tt_luxembourg: "\n§RВы прочитали §Yвсе§! книги §RКарла Маркса§!, открыв эту опцию.\n\n§RОсталось книг Розы Люксембург: §Y[?RED_read_luxembourg]§!."
   RED_reading.2.f: "Книгу Троцкого"
   RED_reading.2_tt_trotsky: "\n§RВы прочитали §Yвсе§! книги §RВладимира Ленина§!, открыв эту опцию.\n\n§RОсталось книг Льва Троцкого: §Y[?RED_read_trotsky]§!."
   RED_reading.2.g: "Книгу Бухарина"
   RED_reading.2_tt_bukharin: "\n§RВы прочитали §Yвсе§! книги §RВладимира Ленина§!, открыв эту опцию.\n\n§RОсталось книг Николая Бухарина: §Y[?RED_read_bukharin]§!."
   RED_reading.2.h: "Книгу Зиновьева"
   RED_reading.2_tt_zinoviev: "\n§RВы прочитали §Yвсе§! книги §RВладимира Ленина§!, открыв эту опцию.\n\n§RОсталось книг Григория Зиновьева: §Y[?RED_read_zinoviev]§!."
   RED_reading.2.i: "Книгу Сталина"
   RED_reading.2_tt_stalin: "\n§RВы прочитали §Yвсе§! книги §RЛьва Троцкого§!, §RНиколая Бухарина§! или §RГригория Зиновьева§!, открыв эту опцию.\n\n§RОсталось книг Иосифа Сталина: §Y[?RED_read_stalin]§!."
   RED_reading.2.j: "Больше нет вариантов!"
   RED_reading.2_tt_no: "\nВы прочитали все доступные на данный момент книги.\n\n...Однако, возможно, есть выдающийся марксист в §Y@ITA [ITA.getname]§!.\n\n§tОтправим агента на разведку в Италию!§!"
   RED_reading.2.k: "Книгу Грамши"
   RED_reading.2_tt_gramsci: "\n§RВы прочитали §Yвсе§! остальные книги, открыв эту опцию.\n\n§RОсталось книг Антонио Грамши: §Y[?RED_read_gramsci]§!.\n\n§gЭто будет последнее чтение.§!"
   RED_reading.3.t: "'Капитал'"
   RED_reading.3.d: "Черино потребовалось много смелости. Один лишь вид толстого тома и аура сложности, исходившая от этих трех букв, заставили все ее тело сопротивляться. Однако, к ее несчастью, Момидзи заметила ее в этот момент.\n\n \"Ого...! Вы действительно собираетесь читать сложный 'Капитал'? Это впечатляет!\"\n\n Черино подумала, что если скажет, что не хочет читать, то потеряет авторитет как президент студсовета. Поэтому, скрепя сердце, она взяла тяжелую книгу в руки.\n\n Нельзя было позволить себе вздремнуть. Срок возврата в Фронт освобождения знаний составлял две недели, и если она будет читать так же медленно, как раньше, ей запретят вход. Читая дальше, Черино понимала, что 'Капитал' еще сложнее 'Манифеста', поэтому решила снова попросить помощи у Льва Троцкого.\n\n Троцкий объяснил ей на примере пирожков тайяки, которые продавались в школьной лавке. \"Товарищ, знаете ли вы, почему тайяки нужно покупать за деньги?\"\n\n \"Потому что они вкусные?\"\n\n \"Тоже верно, но основная причина в том, что тайяки — это продукт, созданный трудом. Маркс считал, что 'потребительная стоимость' и 'меновая стоимость' определяют стоимость товара.\"\n\n Хотя Черино кивнула, выражение ее лица оставалось сложным. Троцкий продолжил:\n\n \"Что произойдет, если уменьшится количество людей, делающих тайяки в академии?\"\n\n \"Тайяки станет меньше, и они подорожают!\"\n\n \"Именно! Но при капитализме стоимость определяется не только спросом и предложением. Также влияет 'общественно необходимое рабочее время' для производства продукта.\"\n\n Черино, скрестив руки, задумалась. \"Значит, капиталисты пытаются заставить рабочих работать быстрее, чтобы увеличить свою прибыль?\"\n\n Троцкий улыбнулся. \"Товарищ, вы очень хорошо понимаете.\"\n\n Черино стало любопытно, как конкретно осуществляется эта капиталистическая эксплуатация. Троцкий терпеливо объяснил: \"Предположим, рабочий производит тайяки в течение 10 часов в день. Однако всего за 5 часов работы он мог бы создать стоимость, эквивалентную своей заработной плате, необходимой для существования.\"\n\n \"Значит, остальные 5 часов...?\"\n\n \"Идут прямо в карман капиталиста. Это то, что мы называем 'прибавочной стоимостью'.\"\n\n Черино сжала кулаки. \"Это несправедливо! Рабочий работает больше, а его доход не растет!\"\n\n Троцкий кивнул. \"Вот почему мы совершили революцию. Только когда рабочие будут напрямую контролировать средства производства, станет возможно подлинно равноправное общество.\"\n\n Несколько дней спустя на заседании Секретариата Черино представила коллегам 'Капитал' и провозгласила необходимость 'революции тайяки'."
   RED_reading.3.a: "Члены Секретариата почувствовали, что у них разболелась голова."

   RED_marina_event.1.t: "Уставшая Марина - 1"
   RED_marina_event.1.d: "\"...\"\n\n\"...Комиссар безопасности, проснитесь!\"\n\n На очередном заседании Секретариата уснувшая Икекура Марина вздрогнула и проснулась. Генеральный секретарь Черино сделала ей замечание и возобновила обсуждение предыдущего вопроса.\n\n Пока Марина пыталась снова сосредоточиться, Черино при поддержке Томоэ предлагала ввести в академию нелепого персонажа-маскота по имени 'Фероро'. Вместо того чтобы вмешаться, Марина позволила затуманенному зрению овладеть собой."
   RED_marina_event.1.a: "Может, предложить ей отдохнуть?"
   RED_marina_event.2.t: "Уставшая Марина - 2"
   RED_marina_event.2.d: "\"Мое мнение остается твердым. Я искренне ценю намерение товарища Молотова поддержать Красную Зимнюю Федерацию, но мы все еще способны полагаться на себя.\"\n\n \"Если ваше мнение изменится, не стесняйтесь связаться с нами. Федерация готова принять вас с распростертыми объятиями.\"\n\n В три часа ночи измученная Марина вернулась в свое жилье и без сил упала на кровать."
   RED_marina_event.2.a: "...Не хочу идти на завтрашнее собрание."
   RED_marina_event.3.t: "Уставшая Марина - 3"
   RED_marina_event.3.d: "\"Так Октябрьская революция распространилась в Гражданской войне красных и белых. Я сам организовал Крестьянскую Красную Армию... ...и, чтобы избежать бонапартизма, требовалась полная реализация народной власти...\"\n\n Пожилой мужчина посетил Секретариат, чтобы прочитать 'лекцию'. Многие члены слушали внимательно, но Марина, хотя и была компетентна в военных и теоретических вопросах, опасалась, что этот ветеран вытеснит ее с позиции. Она не могла отделаться от мысли, что Томоэ привела его, чтобы сместить ее. Пока ее разум наполнялся тревогами, она едва слушала речь старика, хотя уловила некоторые завуалированные критические замечания в адрес авторитарных мер, которые проводил Комитет безопасности."
   RED_marina_event.3.a: "Теперь, когда я думаю об этом, разве Молотов не упоминал что-то об этом человеке?"
   RED_marina_event.4.t: "Иван Купала"
   RED_marina_event.4.d: "Фестиваль Ивана Купала, традиционно отмечаемый летом, прошел на опустошенной земле Академической Федерации после Великого Разлома. Хотя все многое пережили, хотя бы на один день они отложили свои печали и наслаждались праздником."
   RED_marina_event.4.a: "После праздника вернемся к работе."
   RED_marina_event.5.t: "Уставшая Марина - 4"
   RED_marina_event.5.d: "\"То, что вы сказали, — недопустимое оскорбление Генерального секретаря и нашей Академической Федерации. Я сделаю вид, что ничего не слышала.\"\n\n \"Однако этот повстанческий взгляд и авторитарное управление неизбежно развратят революцию. Нужно вырвать с корнем того, кто возглавляет такие антисоветские заговоры, даже если для этого потребуется применить силу. Только так мы продвинемся к истинному социализму.\"\n\n Марина закончила разговор, ясно дав понять, что между ними больше не будет сделок."
   RED_marina_event.5.a: "\"Мы больше не увидимся.\""
   RED_marina_event.6.t: "Уставшая Марина - 5"
   RED_marina_event.6.d: "\"И что плохого в том, чтобы задерживать и допрашивать тех, кто нарушает правила?\"\n\n Марина ответила повышенным голосом.\n\n Троцкий попросил ее, чтобы для укрепления подлинной диктатуры пролетариата она относилась к народным массам как к субъектам взаимопомощи, а не как к объектам контроля.\n\n \"Черт возьми, ты предлагаешь лишь недостижимые идеалы. А если бы у тебя действительно была поддержка народа, почему твое западное наступление провалилось? Ты тоже некомпетентен...!\"\n\n \"Товарищ Марина, проявите уважение к местному Народному комиссару!\"\n\n Когда Томоэ бесцеремонно прервала ее, Марина, сославшись на недомогание, покинула зал."
   RED_marina_event.6.a: "'Томоэ определенно что-то замышляет.'"
   RED_marina_event.7.t: "Иван Купала"
   RED_marina_event.7.d: "Хотя обсуждалось удаление статуй Черино в рамках мер против авторитаризма, несколько бюстов все еще стояли в коридорах Секретариата. Марина, раздраженная очевидной зависимостью Черино от Троцкого, шла, погруженная в свои мысли, когда глухой стук привлек ее внимание.\n\n \"Черт, я разбила бюст.\""
   RED_marina_event.7.a: "'...'"
   RED_marina_event.8.t: "Лето - 1"
   RED_marina_event.8.d: "Солнце не могло полностью прогреть земли Красной Зимней Федерации, но его тепла было достаточно, чтобы расслабить умы. Благодаря фестивалю улицы кишели студентами академии и местными жителями, окрашивавшими шумный центр в свои собственные цвета.\n\n \"Но, товарищ Президент, если этот план провалится, Троцкий сможет использовать это как предлог для роспуска как Комитета безопасности, так и Гвардии Секретариата.\"\n\n \"Это только укрепляет обоснованность наших действий. Существует большая внешняя сила, желающая видеть Троцкого у руля. Если мы захватим Троцкого и объявим 'военную революцию' против его угнетения и переворота, наше дело засияет еще ярче. Испытывайте гордость! Решительно противостоим несправедливости и смело объединимся во имя правоты!\"\n\n На несколько секунд в подвале воцарилась тишина, а затем разразились приветствия и аплодисменты членов службы безопасности."
   RED_marina_event.8.a: "'Река уже вышла из берегов...'"
   RED_marina_event.9.t: "Лето - 2"
   RED_marina_event.9.d: "Под тусклым лунным светом, делившим мир на тень и сияние, город никак не мог уснуть. Эхо торопливых шагов и повторяющихся выстрелов нарушало ночную тишину.\n\n Спонтанно сформировавшиеся народные ополчения не имели информации о центре управления, в то время как Гвардия Секретариата арестовывала Высшее командование Зимней армии по обвинению в контрреволюции.\n\n На рассвете, около 6:00, после 10 минут перестрелки в штабе Секретариата, военное положение было объявлено во всем Чернограде. Согласно специальному закону военного времени, Комитет безопасности сформировал Военный трибунал, который немедленно выдал ордера на арест высокопоставленных чиновников.\n\n Хотя Троцкому, Черино и другим высшим руководителям удалось бежать, масштабная охота продолжалась до 11:00. Однако обнаружилось лишь то, что их уже нет в городе. В связи с этим Военный трибунал созвал пленарное заседание."
   RED_marina_event.9.a: "Сначала объявим военную революцию."
   RED_wartime_judicial_commission: "Военный трибунал"
   RED_marina_event.10.t: "Лето - 3"
   RED_marina_event.10.d: "Захват центрального Секретариата с использованием Гвардии и Комитета безопасности прошел успешно, но контроль не удалось распространить на пригородные и сельские районы. Старое правительство пало, и новое находилось в процессе формирования. В этом вакууме власти могло возникнуть что угодно..."
   RED_marina_event.10.a: "Черт, мы слишком поспешили!"
   RED_marina_event.11.t: "Восстание вспомогательных служб"
   RED_marina_event.11.d: "Административный коллапс привел к восстанию оппозиционных сил."
   RED_marina_event.11.a: "Черт возьми!"
   RED_marina_event.12.t: "Восстание Фронта освобождения знаний"
   RED_marina_event.13.t: "Независимость Издательского департамента"
   RED_marina_event.14.t: "Восстание в Старом здании"
   RED_marina_event.15.t: "Восстание Троцкого"
   RED_marina_event.16.t: "Независимость САПМИ"
   RED_marina_event.17.t: "Восстановление Секретариата"


   RED_event.1.t:0 "Последний ультиматум [FROM.GetName]"
   RED_event.1.d:0 "[FROM.GetName] прислала нам последний ультиматум. Они требуют передачи контроля над Готландом и заявили, что не остановятся перед войной, если мы не согласимся.\n\nЧто нам делать?"
   RED_event.1.a:0 "Примем их требования"
   RED_event.1.b:0 "Это неприемлемо"
   RED_event.2.t:0 "[FROM.GetName] принимает наши требования"
   RED_event.2.d:0 "[FROM.GetName] в конце концов уступила нашему давлению и решила передать нам контроль над Готландом."
   RED_event.2.a:0 "Они приняли разумное решение"
   RED_event.3.t:0 "[FROM.GetName] отвергает наши требования"
   RED_event.3.d:0 "Несмотря на наши угрозы, [FROM.GetName] заявила, что будет защищать Готланд до конца."
   RED_event.3.a:0 "Они приняли глупое решение"
   RED_event.4.t:0 "Решение системы военного управления"
   RED_event.4.d:0 "Система военного управления, установленная Федеральной академией Красной Зимы после войны, была эффективна для местного контроля, но теперь мы должны столкнуться с такими проблемами, как командиры, сговаривающиеся с повстанцами, коррупция внутри армии и все более интенсивное сопротивление.\n\nРади будущего Федеральной академии отмена системы военного управления, не соответствующей нашей идеологии, и, более того, интеграция всей Скандинавии в Федеральную академию станут необходимыми средствами."
   RED_event.4.a:0 "Действительно, Военная администрация должна быть отменена."
   RED_event.5.t:0 "Баланс сил внутри Секретариата"
   RED_event.5.d:0 "Лев Троцкий, революционер-большевик русского происхождения, быстро набирает популярность среди студентов и собирает поддержку. Единое руководство Черино начинает давать трещины, и Троцкий приближается к центру власти."
   RED_event.5.a:0 "Это нехороший знак."
   RED_event.6.t:0 "Судьба Издательского департамента"
   RED_event.6.d:0 " \"Предложение товарища Черино — не более чем лицемерие: подобно буржуазным демократам, они называют 'свободой' политику невмешательства, позволяя без ограничений пропаганду внешних контрреволюционных сил и распространение непроверенных слухов, делая вид, что заботятся о народе. Я прошу вас отозвать это предложение.\"\n\nТвердый голос Троцкого наполнил зал заседаний.\n\n \"Если ты так говоришь, Троцкий, то можно ли также утверждать, что ты сам, беспокоясь о сокращении издательского департамента, где работают многие твои сторонники, и о потере своей политической базы, искажаешь мои намерения и демонстрируешь симптомы этой мелкобуржуазной 'детской болезни'? Очевидно, что директивы о цензуре и масштабы издательского департамента давно утратили свою цель 'сохранения революционной природы'!\"\n\nТроцкий ответил, обвинив Черино в уходе от публичных дебатов и использовании ad hominem."
   RED_event.6.a: "Позиция Черино возобладала."
   RED_event.6.b: "Троцкий получил поддержку постоянного комитета."
   RED_edit_disagree: "Черино выиграла дебаты."
   RED_edit_disagree_1: "Троцкий выиграл дебаты."
   RED_event.7.t: "[FROM.GetName] ищет союза"
   RED_event.7.d: "[FROM.GetName] обратилась к нам, заявляя о желании заключить союз. Они ждут нашего решения."
   RED_event.7.a: "Хорошо. Присоединимся к ним."
   RED_event.7.b: "Нет, они нам не нужны."
   RED_event.8.t: "[FROM.GetName] принимает наше предложение"
   RED_event.8.d: "Они приняли наше предложение."
   RED_event.8.a: "Отлично."
   RED_event.9.t: "[FROM.GetName] отклоняет наше предложение"
   RED_event.9.d: "Они отклонили наше предложение."
   RED_event.9.a: "Какая жалость."
   RED_event.10.t: "Запрос на проход войск от [RED.GetName]"
   RED_event.10.d: "[RED.GetName] запросила права на проход войск."
   RED_event.10.a: "У нас нет выбора."
   RED_event.10.b: "Отказать."
   RED_event.11.t: "Предложение пакта о ненападении от [RED.GetName]"
   RED_event.11.d: "[RED.GetName] предложила подписать пакт о ненападении. Перед лицом угрозы со стороны [SOV.GetAdjective] это может быть полезно."
   RED_event.11.a: "Это хорошее предложение."
   RED_event.11.b: "Мы не будем с ними договариваться."
   RED_event.12.t: "[FROM.GetName] соглашается"
   RED_event.12.d: "[FROM.GetName] согласилась с нашим предложением."
   RED_event.12.a: "Отлично."
   RED_event.13.t: "[FROM.GetName] отказывается"
   RED_event.13.d: "[FROM.GetName] отклонила наше предложение."
   RED_event.13.a: "Понял."
   RED_event.14.t: "Троцкисты в бегах!"
   RED_event.14.d: "Многие интеллектуалы, бюрократы и активисты внутри Советского Союза, симпатизирующие делу товарища Троцкого, покинули СССР и отправились в изгнание, узнав о возобновлении деятельности Троцкого в [RED.GetName]. Если нам повезет, товарищ Черино сможет объединить их под своим руководством."
   RED_event.14.a: "Ситуация меняется."


# События (Марины)
   RED_event.15_tt: "\nЕсли вы выполните §Y[?RED_prepare]§! фокусов из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите национальный дух с наименьшим эффектом."
   RED_event.15_tt1: "\nЕсли вы выполните как минимум §G1§! фокус из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите второй национальный дух с наименьшим эффектом."
   RED_event.15_tt2: "\nЕсли вы выполните как минимум §G4§! фокуса из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите третий национальный дух с наименьшим эффектом."
   RED_event.15_tt3: "\nЕсли вы выполните как минимум §G7§! фокусов из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите национальный дух с эффектом ниже среднего."
   RED_event.15_tt4: "\nЕсли вы выполните как минимум §G10§! фокусов из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите национальный дух со средним эффектом."
   RED_event.15_tt5: "\nЕсли вы выполните как минимум §G16§! фокусов из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите национальный дух с эффектом выше среднего."
   RED_event.15_tt6: "\nЕсли вы выполните как минимум §G21§! фокус из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите третий национальный дух с наибольшим эффектом."
   RED_event.15_tt7: "\nЕсли вы выполните как минимум §G27§! фокусов из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите второй национальный дух с наибольшим эффектом."
   RED_event.15_tt8: "\nЕсли вы выполните §Gвсе§! фокусы из числа §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! и §Y$RED_redwinter_moustache_airport$§!, вы получите национальный дух с наибольшим эффектом."
   RED_event.15.t: "Революционная война"
   RED_event.15.d: "Это было неизбежно. Прежде чем пламя революции, вспыхнувшее в Скандинавии, охватит весь мир, оно сначала испепелит тени фашистских и нацистских реакционеров."
   RED_event.15.a: "Защитим революцию, сокрушим нацистов!"
   RED_event.16.t: "Республика рабочих"
   RED_event.16.d: "Пролетарские массы взяли в свои руки все средства производства и утвердились как господствующий класс. Республика рабочих должна теперь повышать свою производительность, чтобы двигаться в будущее вместе с другими угнетенными товарищами. Благодаря правильным мерам после революции мы стабилизировали экономику и доказали, что возможно построить децентрализованный социализм. Остался только прогресс для Красной Зимней Федерации!"
   RED_event.16.a: "Да здравствует социализм!"
   RED_event.17.t: "Рассвет синдикализма"
   RED_event.17.d: "Профсоюзы были реорганизованы в массовом порядке во всех секторах. Рабочие производят, планируют, выражают мнения и голосуют через свои профсоюзы. Это окончательная победа синдикализма на фронте повседневной жизни, подлинный акт освобождения труда."
   RED_event.17.a: "Да здравствуют профсоюзы!"
   RED_event.18.t: "Норвежские социалисты"
   RED_event.18.d: "С завершением интеграции Норвегии норвежские социалисты желают присоединиться к нашему правительству."
   RED_event.18.a: "Добро пожаловать, товарищи!"

   RED_event.19.t: "Департамент услуг отвергает Марину"
   RED_event.19.d: ""
   RED_event.19.a: "Черт возьми..."
   RED_event.20.t: "Устойчивая угроза"
   RED_event.20.d: ""
   RED_event.20.a: "\"Осталось еще больше?!\""

   RED_event.21.t: "Ускоренные изменения"
   RED_event.21.d: "Хотя многие праздновали введение трехдневной рабочей недели, резкое падение производства сделало невозможным ее постоянное поддержание. В качестве альтернативы мы решили гарантировать трехдневную неделю только студентам и предложить гибкий график с 4.5-дневной рабочей неделей для местных рабочих."
   RED_event.21.a: "Какая жалость."
   RED_event.21.b: "Может быть, мы сможем как-то ее сохранить."
   RED_event.22.t: "Оценка Второй АЭП"
   RED_event.22.d: "Сотни народных комиссаров собрались в гигантском зале, чтобы на внеочередной сессии обсудить политику альтернативной экономики, продвигаемую фракциями, критикующими АЭП.\n\n\"Буржуазное происхождение товарища Арнольда, эксплуатировавшего датских рабочих, является общеизвестным фактом! Его возвращение в качестве промышленного наблюдателя — угроза нашей социалистической системе.\"\n\n\"Налоги, взимаемые с малого и среднего бизнеса, только замутняют пролетарскую идентичность масс!\"\n\nГолоса оппозиции звучали энергично. В отсутствие консенсуса было созвано голосование для определения будущего альтернативной экономической политики."
   RED_event.22.a: "Углубим кооперативизм!"
   RED_event.22.b: "Разбавим ее рыночным социализмом!"
   RED_event.22_tt_1: "Мы не достигли целевого показателя в §Y80 гражданских фабрик§! для §YВторой АЭП§!, что затрудняет ее продолжение:\n"
   RED_event.22_tt_2: "Мы достигли целевого показателя в §G80 гражданских фабрик§! для §YВторой АЭП§!, что затрудняет ее роспуск:\n"
   RED_event.24.t: "Переворот Фронта освобождения мятного шоколада"
   RED_event.24.d: "Фронт освобождения мятного шоколада, разочарованный нехваткой мятного шоколада после Великого Разлома и отсутствием ответов на их требования, совершил государственный переворот. Переодевшись курьерами, они проникли в главный кампус, заняли здания и атаковали Гвардию. Застигнутая врасплох, Гвардия временно отступила."
   RED_event.24.a: "Черт возьми!"
   RED_event.24_tt: "\nИз-за национального духа §Y$RED_threat_of_coup$§! происходят повторяющиеся перевороты. Этот дух может быть устранен с помощью фокуса §Y$RED_club_focus_2$§!."
   RED_event.25.t: "Переворот Движения против лимона в караагэ"
   RED_event.25.d: "После Великого Разлома террористические атаки Движения против лимона в караагэ усилились. Когда Секретариат ответил репрессивными мерами, они организовали ночной штурм кампуса, разбили гвардейцев и учредили Временный антилимонный комитет. Они объявили, что через несколько дней сформируют новое правительство."
   RED_event.25.a: "Они совершенно безумны."
   RED_event.26.t: "Переворот Конфедерации ледяного душа среди зимы"
   RED_event.26.d: "В 3 часа ночи члены Конфедерации ледяного душа среди зимы захватили кампус и заняли Секретариат. Бюрократы, которые еще не прибыли, 'к счастью', наслаждаются вынужденным оплачиваемым отпуском, пока готовится операция по восстановлению."
   RED_event.26.a: "Не слишком торопясь."
   RED_event.27.t: "Подавление"
   RED_event.27.d: "Операция по подавлению последнего переворота успешно завершена. Офицеры безопасности убирают пропагандистские листовки и повстанческие флаги по всему городу. [RED.getleader] снова садится в своем кабинете, чтобы возобновить управление."
   RED_event.27.a: "Какое облегчение."
   RED_there_is_coup_flag: "§tПравительство было парализовано постоянными переворотами§!"
   RED_event.28.t: "Уничтожение антиправительственных групп"
   RED_event.28.d: "Угроза постоянных государственных переворотов в Красной Зимней Федерации наконец искоренена. Лидеры основных повстанческих фракций арестованы и заключены в Старом здании, а их последователи разогнаны. Федерация теперь политически стабилизирована!"
   RED_event.28.a: "Наконец-то."
   RED_event.28_tt_1: "§LКонфедерация ледяного душа среди зимы распущена.§!"
   RED_event.28_tt_2: "\n§LДвижение против лимона в караагэ искоренено.§!"
   RED_event.28_tt_3: "\n§LВсе активы Фронта освобождения мятного шоколада конфискованы.§!"
   RED_event.29.t: "Выпуск фальшивых денег"
   RED_event.29.d: "Враг начал выпускать фальшивые деньги, чтобы разрушить нашу экономику."
   RED_event.29.a: "Проклятье!"
   RED_event.30.t: "Великая Зимняя война"
   RED_event.30.d: "Как наш народ, так и враг уже признают, что эта война будет тяжелой. Мы должны найти способ ее преодолеть."
   RED_event.30.a: "Победим их!"
   RED_event.31.t: "Биологическое оружие"
   RED_event.31.d: "Враг использует биологическое оружие, чтобы препятствовать нашим операциям."
   RED_event.31.a: "Кажется, это было запрещено..."
   RED_event.32.t: "Демографические проблемы"
   RED_event.32.d: "Великий Разлом переместил миллионы студентов в этот регион. Однако ограничения инфраструктуры очевидны. Перенаселение угрожает вызвать беспорядки, экономический коллапс и всеобщий хаос."
   RED_event.32.a: "Мы должны решить это любой ценой!"
   RED_event.32_tt: "\nВы можете снизить §Rперенаселение§!, разблокировав особые решения с помощью фокуса §Y$RED_land_research$§!."
   RED_event.33.t: "Консолидация чжушаистов"
   RED_event.33.d: "Чжушаисты, выступающие за капиталистический путь, набирают силу. Мы должны их сдержать!"
   RED_event.33.a: "Какая проблема..."
   RED_event.34.t: "Роспуск чжушаистов"
   RED_event.34.d: "Благодаря активной антикапиталистической кампании чжушаисты распущены."
   RED_event.34.a: "И слава богу."
   RED_event.35.t: "Решение демографических проблем"
   RED_event.35.d: "Хотя это был бурный процесс после Великого Разлома, мы наконец решили проблему перенаселения. Однако мы все еще сталкиваемся с нехваткой не только продовольствия, но и основных потребительских товаров."
   RED_event.35.a: "Пока у нас есть товары для распределения, все будет хорошо!"
   RED_event.36.t: "Небольшая проблема"
   RED_event.36.d: "Завершив наступление в Хельгеланде, Секретариат значительно расширил свой административный аппарат. Хотя непосредственная угроза уменьшилась, в некоторых областях были обнаружены пропуски в отчетах и потеря связи. Это не кажется серьезным, но мы должны расследовать это."
   RED_event.36.a: "Мы должны усилить подготовку секретарей."
   RED_event.36.b: "Что это за военные офисы?"
   RED_event.37.t: "Разоблачение коррупции"
   RED_event.37.d: "Разрушительный отчет поступил в Секретариат: секретари Федерации замешаны в коррупции с местными жителями. Производственные показатели были завышены для получения дополнительных ресурсов, пайки отдела снабжения были фиктивными, а многие подразделения народной обороны распущены или перестали существовать. Даже военные сводки больше не заслуживают доверия!"
   RED_event.37.a: "Это ужасно!"
   RED_event.38.t: "Всплеск промышленного развития"
   RED_event.38.d: "Кризис перенаселения превратился в возможность. Студенты помогают на полях, в мастерских, на лесопилках и в шахтах. Эта рабочая сила неизбежно подстегнет производство в Скандинавии и Академической Федерации."
   RED_event.38.a: "Какое облегчение."
   RED_event.38_tt: "Будут случайным образом завершены три фокуса из дерева §Yместных специалистов§!. Если они уже завершены, вы получите гражданские фабрики за каждый оставшийся фокус.\n\n"
   RED_event.39.t:0 "Местные правые, принесенные в жертву Красному террору"
   RED_event.39.d:0 "В то время как многие местные политики правого толка отправились в изгнание вместе со своим монархом, многочисленные молодежные группы правого толка продолжают препятствовать строительству нашей академии. По решению Секретариата была проведена зачистка против них; однако во время передачи приказов конкуренция за заслуги между кадрами привела к тому, что каждой единице были назначены квоты на чистку, что вылилось в indiscriminate аресты и задержания местного населения.\n\nХотя директива была отозвана через неделю, препятствовавшие нам военизированные организации были решительно разгромлены."
   RED_event.39.a:0 "Было ли это хорошо?"


   # События / Коллапс Военного правительства

   RED_instability_system.1.a: "Если вы это видите, это баг."

   RED_instability_system.2.t: "Нестабильность в Военном правительстве"
   RED_instability_system.2.d: "Военный командир [FROM.GetName] сообщает нам, что граждане начинают ускользать из-под контроля военных властей. Не только в [FROM.GetName], но и на всех оккупированных территориях ситуация выходит из-под контроля. Мы должны действовать, чтобы решить проблемы военных правительств."
   RED_instability_system.2.a: "Это серьезно."
   RED_instability_system_2_tt: "Смотрите вкладку §YСобытия и Решения§!."

   RED_instability_system.3.t: "Народная демонстрация"
   RED_instability_system.3.d: "Толпы людей протестуют на главных проспектах [ROOT.capital.GetName]."
   RED_instability_system.3.a: "Мы ничего не можем поделать."
   RED_instability_system.3.b: "Разогнать протестующих."

   RED_instability_system.4.t: "Революционная волна"
   RED_instability_system.4.d: "Мы не знаем, являются ли протесты стихийным сопротивлением или организованным движением. Единственное, что точно — граждане формируют ополчения и маршируют к нашим административным офисам.\n\nВозможно, репрессивный военный режим, который мы установили, теперь дает о себе знать."
   RED_instability_system.4.a: "Присоединимся к протестующим. Попытаемся убедить их."
   RED_instability_system.4.b: "Всем на боевые позиции!"

   RED_instability_system.6.t: "Весна [FROM.GetAdjective]"
   RED_instability_system.6.d: "Военная администрация в [FROM.GetAdjective] присоединилась к массовой демонстрации, требуя, чтобы мы вели переговоры с гражданами. Как протестующие, так и местное военное командование критикуют наше правительство как угнетательское и требуют построить мирные отношения с местными государствами."
   RED_instability_system.6.a: "Подавить восстание!"
   RED_instability_system.6.b: "Хорошо... хорошо, попробуем снова."

   RED_instability_system.61.t: "Молчание [FROM.GetName]"
   RED_instability_system.61.d: "Мы попытались договориться с [FROM.GetName], но получили только молчание. Переговоры провалились. Мы должны подготовиться к их агрессии."
   RED_instability_system.61.a: "Будем сопротивляться до конца!"

   RED_instability_system.62.t: "Экономика под контролем"
   RED_instability_system.62.d: "[FROM.GetName] разрешила создание независимого государства в обмен на мобилизацию наших ресурсов в их экономических проектах. Хотя мы еще какое-то время будем экономически подчинены, мы добились независимости."
   RED_instability_system.62.a: "Наконец-то принесло плоды."

   RED_military_government_occupation.1.t: "Оккупация Дании"
   RED_military_government_occupation.2.t: "Оккупация Норвегии"
   RED_military_government_occupation.3.t: "Оккупация Швеции"
   RED_military_government_occupation.4.t: "Оккупация Финляндии"

   RED_military_government_occupation.1.desc: "Силы Красной Зимней Академической Федерации разгромили всех повстанцев и вошли во вражескую столицу. Благодаря этой военной операции местные жители не смогут противостоять нашему правительству некоторое время.\n\nТеперь мы должны решить, как управлять завоеванной территорией."
   RED_military_government_occupation.1.a: "Восстановить Военное правительство."
   RED_military_government_occupation.1.b: "Установить марионеточное правительство."
   RED_military_government_occupation.1.c: "Управлять напрямую."
   RED_military_government_occupation.1.d: "Интегрировать в Академическую Федерацию."

   # События / Минори

   RED_minori_event.1.t: "Всеобщая забастовка Департамента услуг"
   RED_minori_event.1.d: "Минори Ясумори, глава Департамента услуг, объявила, что как работники департамента, так и народные массы отказываются и дальше подчиняться авторитарному Секретариату, неспособному справиться с Великим Разломом. Они начинают бессрочную всеобщую забастовку до тех пор, пока Секретариат не будет распущен."
   RED_minori_event.1.a: "Этого следовало ожидать."
   RED_minori_event.2.t: "Забастовка судостроителей"
   RED_minori_event.2.d: "Судостроители Красной Зимней Федерации, которые месяцами не получали зарплату после Великого Разлома, были спровоцированы на начало забастовки."
   RED_minori_event.2.a: "Меньше расходов для нас."
   RED_minori_event.3.t: "Забастовка временных работников"
   RED_minori_event.3.d: "Студенты, работавшие на временных работах или платформах, мобилизованные как солдаты или госслужащие после Великого Разлома, неоднократно требовали компенсации. Секретариат отверг эти требования, ссылаясь на 'академический долг'. Теперь часть этих студентов присоединилась к всеобщей забастовке, что отражается на экономических показателях."
   RED_minori_event.3.a: "Им еще многому предстоит научиться."
   RED_minori_event.4.t: "Первомайская демонстрация"
   RED_minori_event.4.d: "Как и каждый год, Первомай в Федерации завершался военным парадом и культом личности Черино. Однако в этом году публика выглядела напряженной, как будто что-то было решено.\n\nКогда кавалерия и военная техника маршировали по проспекту, внезапно раздались свистки. Организованно протестующие захватили военную технику и атаковали парад. Застигнутые врасплох, солдаты едва могли сопротивляться; некоторые даже присоединились к протестующим.\n\nПолицейские участки, вокзалы, банки и административные офисы были захвачены в считанные часы, и граждане начали вооружаться, штурмуя арсеналы.\n\nК вечеру подтвердилось: Черино и Секретариат бежали на запад."
   RED_minori_event.4.a: "Это революция!"
   RED_minori_event.5.t: "Контрреволюционная угроза"
   RED_minori_event.5.d: "Приходят тревожные новости: Черино, Ренка и чиновники бывшего Секретариата перегруппировывают силы на западе, чтобы начать контрреволюцию, опираясь на остатки военной мощи. Мы должны готовиться!"
   RED_minori_event.5.a: "Будем сопротивляться с железным единством!"
   RED_minori_event.5_tt: "§RВсе дивизии будут распущены!§!\n\n"
   RED_minori_event.6.t: "Вооруженные крестьяне"
   RED_minori_event.6.d: "Вдохновленные революцией, бедные крестьяне восстали, изгнали помещиков и управляющих, сожгли арендные договоры и вооружились для защиты своей земли."
   RED_minori_event.6.a: "Победим помещиков и Черино!"
   RED_minori_event.7.t: "Революционный военный совет"
   RED_minori_event.7.d: "Наша военизированная организация, Революционный военный совет, наконец вступает в дело. Мобилизованы тысячи красных бойцов для разгрома контрреволюции."
   RED_minori_event.7.a: "Раздавим контрреволюцию!"
   RED_minori_event.8.t: "Будущее Издательского департамента"
   RED_minori_event.8.d: "Через неделю после революции подтвердилось, что Издательский департамент распространял слухи и дезинформацию. Обсуждается судьба Якумо Арамаки: радикалы требуют ее казни как предупреждения, в то время как умеренные предлагают превратить ее в революционного пропагандиста."
   RED_minori_event.8.a: "Казнить Якумо."
   RED_minori_event.8.b: "Завербуем ее для революции."
   RED_minori_event.11.t: "Противостояние с верховной властью"
   RED_minori_event.11.d: "Черино, превратившая Красную Зимнюю Федерацию в подразумеваемую олигархию, была захвачена крестьянским ополчением в порту на севере Норвегии. Ее доставили в Черноград, и Революционный комитет решил подвергнуть ее открытому 'Народному суду'.\n\nВ течение трех дней, без адвоката, Черино противостояла морю камней, бросаемых разъяренной публикой. Некоторые интеллектуалы выступали за ее перевоспитание, ссылаясь на ее умственную некомпетентность; но большинство, возглавляемое радикальной фракцией, требовало смертной казни за планирование контрреволюции. В конце концов, она была приговорена к смерти без права апелляции.\n\nДо казни она останется заключенной в специальном крыле, примыкающем к старой красной школе."
   RED_minori_event.11.a: "Так заканчивает диктатор!"
   RED_minori_event.12.t: "Пощада для жестокой"
   RED_minori_event.12.d: "Марина знала, что ее участь будет мрачной. Она попыталась найти убежище вместо того, чтобы выдать Троцкого СССР, но не смогла собрать союзников.\n\nКогда она прибыла в порт, докеры предали ее, донеся революционным силам. Она сражалась, пока Троцкий бежал, но была схвачена и доставлена в столицу в ужасных условиях.\n\nХотя Революционный комитет решил приговорить ее к принудительным работам вместо казни, Марина не вынесла унижения. Она несколько раз пыталась покончить с собой, безуспешно. Наконец, ожидая перевода, она была линчевана в своей камере разъяренной толпой."
   RED_minori_event.12.a: "Мы милосердны... насколько это возможно."
   RED_minori_event.13.t: "Администратор Секретариата"
   RED_minori_event.13.d: "В отличие от Черино, Томоэ Саширо обладала административной компетенцией. Поэтому Революционный комитет решил дать ей возможность служить новому правительству. Первоначально она согласилась на низшую должность, но после казни Черино отказалась от всех постов и попросила отправить ее в трудовой лагерь, как и других бывших чиновников."
   RED_minori_event.13.a: "Хотя это не вернет Черино."
   RED_minori_event.14.t: "Победа в Дании"
   RED_minori_event.14.d: "Наши храбрые революционеры застали врасплох силы военного правительства в Дании, разгромив их и освободив территорию."
   RED_minori_event.14.a: "Славная победа!"
   RED_minori_event.15.t: "Альянс корейских рабочих"
   RED_minori_event.15.d: "Корейские рабочие, уставшие от режима Черино, сформировали ополчения и присоединились к нашим революционным силам."
   RED_minori_event.15.a: "Добро пожаловать, товарищи!"
   RED_minori_event.16.t: "Роспуск Революционного комитета"
   RED_minori_event.16.d: "Теперь, когда угнетательский режим Черино пал, пришло время учредить республику и новую конституцию. Революционный комитет, состоящий из профсоюзных лидеров, студентов и левых теоретиков, решил самораспуститься, чтобы уступить место избранному Учредительному собранию."
   RED_minori_event.16.a: "Хорошая работа, товарищи!"
   RED_minori_event.17.t: "Конституция: Суверенные институты"
   RED_minori_event.17.d: "Существует несколько моделей социалистического государства. Синдикализм предлагает наделить профсоюзы полномочиями напрямую управлять промышленностью и политикой. Однако некоторые теоретики предупреждают, что профсоюзы могут выродиться в авторитарные структуры. Поэтому другие предлагают укрепить трудовые и региональные советы, основанные на прямой демократии. Учредительное собрание должно решить, какую модель мы выберем."
   RED_minori_event.17.a: "Профсоюзы — истинные представители народа."
   RED_minori_event.18.t: "Конституция: Коллективное руководство"
   RED_minori_event.18.d: "Пережив злоупотребления личной власти при Черино, мы решили принять систему коллективного руководства. Так мы избежим чрезмерной концентрации власти в одних руках."
   RED_minori_event.18.a: "Центральный комитет станет новым голосом народа."
   RED_minori_event.19.t: "Конституция: Дебаты о многопартийности"
   RED_minori_event.19.d: "Внутри Ассамблеи идут дебаты о введении однопартийной или многопартийной системы. Одни утверждают, что однопартийная система предотвратит контрреволюции; другие выступают за защиту свободы организации как необходимого условия социализма."
   RED_minori_event.19.a: "Будем двигаться к многопартийному социализму."
   RED_minori_event.19.b: "Однопартийная система защитит революцию."
   RED_minori_event.20.t: "Конституция: Первые выборы"
   RED_minori_event.20.d: "Свободные выборы были тщательно подготовлены. Хотя голосовали не все, более 90% народа приняло участие, празднуя свой первый демократический опыт.\n\nЦентральной фигурой этих выборов стала Ясумори Минори, лидер Департамента услуг и вдохновитель февральской всеобщей забастовки."
   RED_minori_event.20.a: "Минори избрана Председателем Студенческого совета!"
   RED_minori_event.21.t: "Независимость [FROM.getname]"
   RED_minori_event.21.d: "С провозглашением независимости [FROM.getname] мы должны решить, принять ли их отделение мирно или противостоять им военным путем, чтобы предотвратить их падение в руки буржуазного авторитаризма."
   RED_minori_event.21.a: "Атакуем!"
   RED_minori_event.21.b: "Пока нет. Подождем."
   RED_minori_event.22.t: "Конституция: Переименование городов"
   RED_minori_event.22.d: "Многие города носят имена, связанные с Черино и ее режимом. Теперь мы обсуждаем, восстановить ли традиционные местные названия или назвать их в честь революционеров прошлого. В любом случае, население встретит перемены с энтузиазмом."
   RED_minori_event.22.a: "Уважим местные названия."
   RED_minori_event.22.b: "Почтим революционеров прошлого."
   RED_victorypoint_stockholm: "Стокгольм"
   RED_victorypoint_yetebori: "Гётеборг"
   RED_victorypoint_udebala: "Уддевалла"
   RED_victorypoint_paloon: "Фалун"
   RED_victorypoint_marx: "Марксград"
   RED_victorypoint_blanki: "Бланкиград"
   RED_victorypoint_praudhon: "Прудонград"
   RED_victorypoint_bakunin: "Бакунинград"
   RED_minori_event.23.t: "Автономия"
   RED_minori_event.23.d: "Пока империализм продолжает расти, диктатуры пролетариата в одной стране недостаточно. Мы должны экспроприировать иностранный капитал и позволить рабочим управлять промышленностью автономно. Только тогда революция будет полной."
   RED_minori_event.23.a: "Свергнем капитализм-империализм!"
   RED_minori_event.24.t: "Равенство"
   RED_minori_event.24.d: "Капитал разделяет и сталкивает народ, чтобы увековечить свое господство. Национализм, шовинизм: все инструменты разделения должны быть отвергнуты в нашем социалистическом обществе. Все рабочие, включая иммигрантов, должны быть признаны равными перед законом, с полным доступом к трудовым и политическим правам после интеграции."
   RED_minori_event.24.a: "Мы не такие, как капиталисты."
   RED_minori_event.25.t: "Освобождение"
   RED_minori_event.25.d: "'Социализм в одной стране', продвигаемый лицемерами, называющими себя революционерами, ошибочен. Революция должна непрерывно расширяться, пока не освободит все народы мира. Мы не можем остановиться, пока не разрушим все авторитарные, капиталистические, империалистические и националистические системы."
   RED_minori_event.25.a: "Давайте разорвем цепи вместе!"
   RED_minori_event.26.t: "Приглашение в Рабочий Интернационал"
   RED_minori_event.26.d: "Молодое социалистическое правительство Красной Зимней Федерации попросило у нас поддержки, чтобы избежать изоляции. Принять их приглашение укрепило бы дело мировой революции."
   RED_minori_event.26.a: "Солидарность делает нас сильнее."
   RED_minori_event.26.b: "Еще не время."
   RED_minori_event.27.t: "Профсоюзная забастовка"
   RED_minori_event.27.d: "Рабочие потребовали, чтобы плоды недавнего экономического роста были преобразованы в бонусы и повышение зарплат. Они начали забастовку, чтобы добиться этого."
   RED_minori_event.27.a: "Дадим им заслуженную награду."
   RED_minori_event.27.b: "Это неприемлемо."
   RED_minori_event.28.t: "Народный референдум"
   RED_minori_event.28.d: "Муниципальный чиновник, обвиненный своей семьей в коррупции, был подвергнут народному референдуму. После интенсивных дебатов о его предательстве революционных идеалов он был отстранен подавляющим большинством."
   RED_minori_event.28.a: "Вот как работает прямая демократия!"
   RED_minori_event.29.t: "На пути борьбы (1/2)"
   RED_minori_event.29.d: "Многие люди сталкиваются с бурями в своей жизни. Все встречают волны, разной силы и размера. Никто не застрахован.\n\nКак люди — существа, существующие 'между' другими, как указывает иероглиф для 'человек' в китайском — мы склонны искать помощь, а также предлагать ее. Так формируется солидарность.\n\nПеред лицом трудностей некоторые советуют смириться, но другие учат нас подвергать сомнению то, что кажется естественным. Это истинные революционеры.\n\nКогда теология господствовала в Европе, некоторые мудрецы развенчали понятие 'божественности', чтобы возвеличить человеческое достоинство. Позже такие революционеры, как Лютер, разорвали с религиозным абсолютизмом.\n\nСледуя этой традиции, молодой немец — когда все принимали национализм и капитализм — написал свой 'Манифест', бросая вызов невидимому угнетению буржуазии.\n\nМногие говорят, что социализм потерпел неудачу. Но те, кто действительно знает Маркса, понимают, что его критика была строгой и глубокой. Предрассудки против социализма просто демонстрируют, насколько мы все еще отчуждены."
   RED_minori_event.29.a: "..."
   RED_minori_event.30.t: "На пути борьбы (2/2)"
   RED_minori_event.30.d: "Красная Зимняя Федерация, ведомая Ясумори Минори и ее Красным фронтом, смогла построить самую прогрессивную и демократическую рабочую республику XX века.\n\nИ все это стало возможным благодаря тебе.\n\nВозможно, изначально ты выбрал радикальный путь только из симпатии к Минори или из любопытства. Но приняв это решение, ты открыл двери революции. Как в 'Отверженных', когда граждане Чернограда подняли оружие в Первомай.\n\nКонтрреволюция Черино была разгромлена. Старые статуи были сброшены, города переименованы, а революционные достижения закрепили такие права, как трехдневная рабочая неделя, всеобщее социальное обеспечение и прямая демократия.\n\nВозможно, ты не смог осуществить все революционные мечты. Но это не важно: благодаря твоему решению народ пережил самую славную эпоху своей истории.\n\nВозможно, этот простой мод игры не изменит мир. Но, по крайней мере, на мгновение он зажег в тебе искру надежды, достоинства и революции.\n\nГрамши говорил: \"Взвешивай интеллектом, но действуй волей\". Наш разум может быть пессимистичен, но наша воля всегда будет оптимистична.\n\nПусть ты продолжишь борьбу в этом море под названием жизнь, как истинный революционер."
   RED_minori_event.30.a: "Большое спасибо за игру!"
   RED_minori_event.30_tt: "Надеюсь, что ты и я сможем пройти этот путь борьбы с достоинством и надеждой!\n§g- С революционным приветом, моддер §YAfterImage§!.§!"
   RED_minori_event.31.t: "Уход Минори"
   RED_minori_event.31.d: "Ясумори Минори, бывший глава Департамента услуг, героиня Майской революции и Политический комиссар Революционного военного совета, завершила свой срок в этом месяце. Ее популярность оставалась чрезвычайно высокой до самого конца, с поддержкой в [RED.GetPartySupport]%.\n\nВ знак признания ее самоотверженного служения народу Центральный комитет оставил ее позицию вакантной и решил сохранить коллективное руководство."
   RED_minori_event.31.a: "Отличная работа, товарищ!"


   RED_missions_char.1.t: "Народное требование: 3-дневная рабочая неделя"
   RED_missions_char.1.d: "Народ требует введения трехдневной рабочей недели, чтобы обеспечить достойную человеческую жизнь и качественное свободное время. Мы должны быстро принять соответствующий закон."
   RED_missions_char.1.a: "К достойной жизни!"
   RED_missions_char.2.t: "Народное требование: Провал"
   RED_missions_char.2.d: "Мы не выполнили народные требования вовремя. Доверие к рабочему правительству подрывается."
   RED_missions_char.2.a: "Проклятье."
   RED_public_mission_failed_over_5: "\n§YПровалив более §Y6§! народных требований, народ серьезно не доверяет режиму.§!"
   RED_public_mission_failed_over_2: "\n§YПровалив более §Y3§! народных требований, народ начинает серьезно не доверять режиму.§!"
   RED_missions_char.3.t: "Народное требование: Успех"
   RED_missions_char.3.d: "Мы успешно выполнили народные требования. Новое правительство пользуется твердым доверием!"
   RED_missions_char.3.a: "Социализм укрепляется!"
   RED_missions_char.4.t: "Народное требование: Тотальное перевооружение"
   RED_missions_char.4.d: "Агрессивная экспансия [TRM.getname] пугает массы, которые требуют тотального перевооружения для подготовки к революционной войне, которая также освободит угнетенные народы врага."
   RED_missions_char.4.a: "Сокрушим фашистов!"
   RED_missions_char.5.t: "Народное требование: Индустриализация"
   RED_missions_char.5.d: "Согласно историческому материализму Маркса, продвижение экономической структуры является ключевым. Сделаем ставку на радикальную и демократическую индустриализацию для укрепления социализма."
   RED_missions_char.5.a: "Все для максимального развития производительных сил!"
   RED_missions_char.6.t: "Народное требование: Выход из Организации сотрудничества Кивотоса"
   RED_missions_char.6.d: "Нынешняя организация сотрудничества рассматривается как контрреволюционный инструмент на службе капиталистов и феодалов. Мы должны немедленно выйти!"
   RED_missions_char.6.a: "Никаких компромиссов с врагом!"
   RED_missions_char.7.t: "Народное требование: Поддержка полевых госпиталей"
   RED_missions_char.7.d: "С созданием военных профсоюзов солдаты требуют большей защиты на фронте. Мы можем удовлетворить это требование, учредив полевые госпитали."
   RED_missions_char.7.a: "Революция должна заботиться о своих бойцах!"
   RED_missions_char.8.t: "Народное требование: Роспуск Революционного военного совета"
   RED_missions_char.8.d: "'Красный бонапартизм' — это опасность концентрации политической власти в военных структурах. Мы должны распустить Революционный военный совет и преобразовать его остатки в солдатские профсоюзы."
   RED_missions_char.8.a: "Пусть власть остается в народе!"
   RED_missions_char.9.t: "Народное требование: Социальная стабилизация"
   RED_missions_char.9.d: "Профсоюзы госслужащих требуют улучшения безопасности, управления, благосостояния и обеспечения постоянного политического участия для укрепления социалистического идеологического господства."
   RED_missions_char.9.a: "За народное благосостояние!"
   RED_missions_char.10.t: "Народное требование: Расширение инфраструктуры"
   RED_missions_char.10.d: "После гражданской войны страна нуждается в срочном восстановлении. Профсоюз строителей требует массового расширения инфраструктуры."
   RED_missions_char.10.a: "Железная дорога — кровь промышленности!"
   RED_missions_char.11.t: "Народное требование: Военно-промышленный комплекс"
   RED_missions_char.11.d: "Профсоюз оборонной промышленности предлагает качественно расширить военно-промышленный сектор для укрепления революционной обороны."
   RED_missions_char.11.a: "Революционные инновации!"
   RED_missions_char.12.t: "Народное требование: Развитие тяжелой промышленности"
   RED_missions_char.12.d: "Производственный профсоюз предлагает создать нефтеперерабатывающие заводы для стимулирования тяжелой промышленности, достижения самообеспеченности и устранения зависимостей."
   RED_missions_char.12.a: "За независимую экономику!"
   RED_missions_char.13.t: "Народное требование: Интеграция Скандинавии"
   RED_missions_char.13.d: "После роспуска военных правительств Черино мы должны относиться к освобожденному населению как к равным, облегчая их интеграцию."
   RED_missions_char.13.a: "Свобода, равенство, солидарность!"
   RED_missions_char.14.t: "Народное требование: Восточное наступление"
   RED_missions_char.14.d: "Народ требует революционного наступления на Финляндию, чтобы избежать угрозы реакционных сил с востока."
   RED_missions_char.14.a: "Сокрушим реакцию!"
   RED_missions_char.15.t: "Народное требование: Защитить [141.GetCapitalVictoryPointName]"
   RED_missions_char.15.d: "Перед лицом войны с [TRM.getname] граждане организуют народную оборону на каждой улице и в каждом квартале. Центральный комитет решил защищать любой ценой студенческую штаб-квартиру в [141.GetCapitalVictoryPointName]."
   RED_missions_char.15.a: "Они не пройдут!"
   RED_missions_char.16.t: "Народное требование: Консолидация режима"
   RED_missions_char.16.d: "После революции население жаждет стабильности. Мы должны завершить построение социалистического режима, чтобы успокоить народ."
   RED_missions_char.16.a: "Ускорим трансформацию!"
   RED_missions_char.17.t: "Народное требование: Реструктуризация промышленности"
   RED_missions_char.17.d: "Хотя мы свергли капитализм, все еще существуют архаичные производственные отношения. Мы должны завершить радикальную реструктуризацию в сторону синдикалистской экономики."
   RED_missions_char.17.a: "К синдикалистской экономике!"
   RED_missions_char.18.t: "Народное требование: Освободить Европу"
   RED_missions_char.18.d: "Миллионы рабочих в Европе все еще угнетены. Наш долг — принести революционное освобождение на их земли!"
   RED_missions_char.18.a: "Да здравствует освобождение народов!"


   RED_bop_event.1.t:0 "Человек с козлиной бородкой"
   RED_bop_event.1.d:0 " Черино вспомнила.\n\n В хаосе Секретариата Томоэ по приказу Секретариата искала местного советника, который мог бы помочь стабилизировать ситуацию.\n\n \"Товарищ Генеральный секретарь, мы привели в качестве местного советника теоретика-социалиста по имени 'Лев Троцкий'.\"\n\n Троцкий, улыбаясь, словно хваля энтузиазм студентов, продвигающих социалистическое движение, пожал руку Черино. С тех пор Троцкий обучал Черино и высокопоставленных чиновников Секретариата социалистической теории и давал политические советы."
   RED_bop_event.1.a:0 "Черино скучала всю лекцию."

   RED_revolution.1.t:0 "Размышление"
   RED_revolution.1.d:0 " В отличие от обычного, в течение почти двух месяцев Ясумори Минори жила чрезвычайно занятой жизнью. Ей приходилось каждый день восстанавливать и ремонтировать десятки разрушенных местных зданий и военных сооружений. Руководя масштабными стройками весь день, Минори без сил падала дома, пропитанная усталостью.\n\n Прошло несколько часов. Минори проснулась в не самом приятном состоянии, потревоженная шумом снаружи: непрекращающимися свистками, стуком копыт, приветствиями, криками, визгами и руганью, прерывавшими ее сон. Спросонья она решительно вышла, чтобы твердо протестовать против тех, кто посягает на всеобщее право на поиск счастья.\n\n\"Уважайте трудовое законодательство! Убирайтесь, угнетатели!\"\n\n Снаружи было еще более хаотично, чем она себе представляла. Не только площадь была заполнена, но и дым поднимался из каждого переулка. В этот момент Минори устыдилась себя. Пока она была занята работой, местные рабочие подвергались репрессиям и эксплуатации."
   RED_revolution.1.a:0 "Только тот, кто живет, движется и действует, является истинным рабочим!"
   RED_revolution.2.t:0 "Присоединение Департамента услуг"
   RED_revolution.2.d:0 "После твердых требований Ясумори Минори Департамент услуг откликнулся на местную забастовку и вступил в частичную забастовку солидарности. Секретариат осудил антисистемные действия Ясумори Минори, но никто не проявил ни малейшего интереса к комментариям Секретариата."
   RED_revolution.2.a:0 "Рабочий класс сам по себе интернационален!"
   RED_revolution.3.t:0 "Солидарность с профцентром"
   RED_revolution.3.d:0 " Еще до активного участия Департамента услуг февральская всеобщая забастовка уже распространялась благодаря частичным забастовкам солидарности местных профсоюзных федераций Норвегии, Дании и Швеции. Ясумори Минори посетила лидеров различных профсоюзных федераций и активно просила их присоединиться к забастовке, получив положительные ответы. Однако это также вызвало большее или меньшее сопротивление среди профсоюзных лидеров.\n\n\"...Но запомните это. Забастовка — это не политическое средство и не инструмент преобразования, а просто еще одна форма диалога, предназначенная для переговоров и экономической борьбы. Мы прекратим забастовку, как только будет восстановлена парламентская демократия и достигнуты экономические цели.\"\n\n\"Почему здешние рабочие такие пассивные?!\"\n\n Тем не менее, была организация, которая активно поддержала позицию Минори: 'Центральная конфедерация рабочих Швеции' (САЦ). Будучи профцентром синдикалистского толка, САЦ разделяла с Минори важность прямых действий и антикапиталистической борьбы и заявила о намерении играть ведущую роль в этом конфликте."
   RED_revolution.3.a: "Преобразующие движения рождаются из активного участия."
   RED_revolution.4.t: "Резолюция 1936 года, № 5"
   RED_revolution.4.d: "Хотя формируется преобразующее руководство, ведутся интенсивные дебаты о том, действительно ли сам Департамент услуг является революционным. Учитывая, что почти все здания Красной Зимы были построены Департаментом услуг и что они даже принимают внешние заказы, он больше похож на гигантский строительный кооператив, чем на какую-либо обычную строительную компанию. Однако тот факт, что его члены находятся в наемном труде и товарном производстве при капитализме, в сочетании с тем, что многие присоединились по экономическим мотивам, служит препятствием для укоренения преобразующего характера во всей организации.\n\nУже несколько недель в центре обсуждается необходимость твердой организационной линии, обязывающей всех членов Департамента услуг участвовать в едином фронте борьбы, и этот вопрос обсуждается внутри."
   RED_revolution.4.a: "Утверждается."
   RED_revolution.4_tt: "§gСтатья 1. Все члены Департамента услуг постановляют участвовать во всеобщей забастовке как субъекты преобразующей борьбы.\nСтатья 2. Запрещаются любые индивидуальные переговоры и компромиссы подчиненных организаций.\nСтатья 3. Категорически отвергается оппортунизм, и организация не будет распущена до достижения целей.\n§!"
   RED_revolution.5.t: "Социал-демократическая рабочая партия"
   RED_revolution.5.d: "Концепция социалистической партии, участвующей в выборах, возникла в конце XIX века, и Социал-демократическая рабочая партия Швеции является одной из них. После неоднократных процессов умеренности через борьбу за избирательное право нынешняя партия пытается по возможности избегать насилия; однако ее политика разоружения лишь облегчила быструю капитуляцию перед Красной Зимой. По иронии судьбы, благодаря этому партия смогла сохранить определенное влияние.\n\n Ее широкая народная база достаточна, чтобы политизировать всеобщую забастовку. Тем не менее, ее умеренность ограничит требования 'восстановлением парламентской демократии', что вызывает серьезное беспокойство у Минори."
   RED_revolution.5.a: "Разве они не просто еще один вид капиталистов?"
   RED_revolution.6.t: "Компромисс"
   RED_revolution.6.d: "\"В конечном счете, наша цель — восстановление парламентской демократии.\"\n\n Минори, как будто не было другого выбора, кивнула и приняла его рукопожатие."
   RED_revolution.6.a: "Мы ищем солидарности, не боясь изоляции."
   RED_revolution.7.t: "Кооптация"
   RED_revolution.7.d: "Арамаки Якумо провела несколько счастливых недель. Шум печатных станков, который раньше был для нее невыносим, теперь звучал как пение птиц на рассвете; грохот машин — как колокола на башне с часами. Якумо наслаждалась каждым мгновением.\n\n Почему? Потому что чем больше она печатала теорий заговора и тривиальной пропаганды о [RED.GetLeader], тем больше денег и пудинга — нет, постой, что там говорила Минори? — ах да, освобождение рабочего класса приближалось.\n\n Пока Якумо, опершись на печатный станок и напевая, просматривала отпечатки, Минори, инспектировавшая Издательский клуб, подошла поприветствовать его. Якумо ответила улыбкой.\n\n\"Якумо! Ты выглядишь довольной. Как идут дела с печатью?\"\n\n\"Очень хорошо. Очень много товарищей покупают эти вещи.\"\n\n\"...Якумо, я, кажется, говорила тебе не продавать их...\" Минори схватилась за голову с серьезным выражением лица. Якумо ответила неловкой улыбкой, в любом случае слушая, как Минори объясняет преимущества 'разоблачения того и этого' и 'гарантирования чего-либо'. Нет, на самом деле она не слушала. Якумо наслаждалась мыслью, что, даже беря всего пять иен за штуку, деньги будут накапливаться бесконечно.\n\n\"Если бы я знала, что так будет, я бы печатала больше этого вместо этих глупых манги\", — подумала Якумо."
   RED_revolution.7.a: "Хе. Хе. Хе."
   RED_revolution.8.t: ""

