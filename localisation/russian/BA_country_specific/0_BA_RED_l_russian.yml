# Вступительный текст
RED_country_intro_header: "Честь предстать перед высшей властью!"
RED_country_intro_content: "Федеральная академия Красная Зима — это мега-академия, обладающая обширным кампусом, сравнимым с тремя главными академиями Кивотоса, и большим количеством учениц. Она поддерживала порядок и равновесие под руководством великого президента студенческого совета, Ренки, и Черино. Однако из-за ежедневных революций по пустяковым причинам и слабого обмена с другими академиями репутация и финансовое положение академии неуклонно ухудшались.\n\nВнезапный великий конфликт полностью изменил судьбу Красной Зимы, становившуюся все более нестабильной. Частые революции и забастовки службы безопасности ослабили промышленность Красной Зимы, а вакуум, вызванный великим конфликтом, нанес фатальный удар по и без того ослабленной промышленной базе. Со временем нехватка материалов из-за остановки производства на объектах академии усилилась, и, что еще хуже, внезапное появление Красной Зимы заставило местных жителей и существующие правительства потерять территории и ответить военными действиями, ввергнув академию в еще более глубокую трясину. Наконец, под руководством начальника службы безопасности, Икэкуры Марины, была начата крупномасштабная операция по подавлению «нечистых элементов», и сразу после того, как она начала сокращать их власть, главный секретарь, Саширо Томоэ, приказала учредить гражданские администрации на оккупированных территориях. Однако это остановилось вместе с усилением внутренних проблем.\n\nТем временем человек, представившийся Львом Троцким, связался с секретариатом, предложив, что если они будут сотрудничать с ним, он предложит решение внутренних проблем Красной Зимы. Пока секретариат колебался перед лицом этого подозрительного предложения, Красная Зима уже была объята пламенем хаоса. Недовольные тиранией Черино, начальник службы безопасности Ясумори Минори и ее департамент безопасности объявили всеобщую забастовку, а местные жители, выступавшие против секретариата, также сочувствовали этому и расширяли свою власть. С другой стороны, нечистые элементы внутри секретариата, возглавляемые Икэкурой Мариной, очищались один за другим, но если решение не будет найдено, их лояльность может в конце концов пошатнуться.\n\nБольшинство государственных переворотов в Кивотосе, происходивших в Красной Зиме, заканчивались восстановлением Черино. Но на этот раз все иначе. Если хаос внутри академии не удастся успокоить, когда произойдет очередной переворот, никто не знает, как он пройдет на этот раз...\n\n§YРазработано: Jamm, satsuji, SKSKle, Afimage (Русский перевод Kasishon)§!"
RED_guide: "Принятие троцкизма\n\n£white_dot Соберите exiled левых оппозиционеров.\n£white_dot Выступите посредником в борьбе за власть между Львом Троцким, Ренкой и Черино.\n£white_dot Присоединитесь к Троцкому в мировой революции и верните Советский Союз.\n£white_dot Вооружите Черино левой идеологией через чтение.\n\n\nФевральская всеобщая забастовка\n\n£white_dot Свергните коррумпированный и прогнивший секретариат.\n£white_dot Восстановите Красную Зиму и провозгласите новую систему.\n£white_dot Дайте землю крестьянам, фабрики рабочим и свободу студентам.\n£white_dot Наступайте, пока не будет освобожден последний человек!\n\n\nВ поисках идеологической чистоты | §YНе завершено§!\n\n£white_dot Разоблачите лицемерие угнетателей и провозгласите подлинный марксизм-ленинизм.\n£white_dot Полностью уничтожьте контрреволюционеров и левых экстремистов.\n£white_dot С единой линией и авангардной партией добейтесь ослепительного развития.\n£white_dot Прорвите двойной фронт капитализма-фашизма под единством мирового коммунизма.\n\n§RНайдите полярную звезду революции!§!"

   RED_GATHERING_STORM_DESC: "Федеральная академия Красная Зима изначально сталкивалась с революцией или государственным переворотом как минимум раз в неделю, что обычно приводило к смещению президента студенческого совета. И конец всегда был возвращением на пост генерального секретаря Черино.\n\nВеликий конфликт полностью изменил атмосферу в Красной Зиме. Академия столкнулась с беспрецедентным кризисом, и неуклюжая реакция Черино заставила студентов усомниться в ее компетентности как генерального секретаря.\n\nПриближается государственный переворот, связанный с позицией внутри академии. Однако в следующий раз, когда ее сместят, трудно гарантировать ее возвращение."

