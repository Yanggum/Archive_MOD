# Путь Минори
   RED_first_focus:0 "§GВыбранный фокус сразу после начала.§!"
   RED_dipose_cherino: "Февральская всеобщая забастовка"
   RED_dipose_cherino_desc: "Несмотря на то, что население страдает от последствий Великих перемен, Бюро Красной Зимы занималось только борьбой за власть, игнорируя нас. Мы должны подготовиться к великой борьбе против коррумпированной Черино и Бюро Красной Зимы."
   RED_labor_world: "Обеспечить поддержку беднейших крестьян"
   RED_labor_world_tt: "\nЕсли произойдет революция, §Yкласс беднейших крестьян§! добровольно организует §Yотряды самообороны§!."
   RED_labor_world_desc: "Хотя большинство участников забастовки — рабочие, среди пострадавших также значительное количество обнищавших крестьян. Если мы обеспечим им справедливое распределение продовольствия и коллективизацию ферм, и, что самое важное, систему распределения пудинга, мы сможем заручиться их горячей поддержкой."
   RED_RMC: "Революционный военный совет"
   RED_RMC_tt: "\nЕсли произойдет революция, вы получите помощь от §Yспециалистов по обороне§! и §Yкрестьянских и рабочих армий§! для ведения революционной войны."
   RED_RMC_desc: "Для эффективного руководства рабочими и крестьянами, собравшимися со всех сторон, и для успешного проведения революции необходимо единое и организованное руководство. Революционный военный совет, сформированный из ветеранов и студентов, отличившихся в боях, возьмет на себя эту роль."
   RED_native_leftists: "Союз с местными левыми"
   RED_native_leftists_tt: "\nЕсли произойдет революция, вы сможете назначить местных §Yсоветников-социалистов§!."
   RED_native_leftists_desc: "Среди местных лидеров, присоединившихся к всеобщей забастовке, есть несколько разделяющих наши идеи. После установления общего фронта с местными жителями и жителями Кивотоса они пообещали поддерживать рабочее правительство, созданное после революции."
   RED_sans_culotte: "Призыв к санкюлотам"
   RED_crush_local_capitalist_government:0 "Разгромить местное капиталистическое правительство"

   RED_take_publish_club:0 "Кооптировать Издательский клуб"
   RED_take_publish_club_tt:0 "\nЕсли этот §Yфокус§! не будет §Yзавершен§!, §Y$RED_yakumo$§! присоединится к §Rконтрреволюции§!"
   RED_the_threats_abound: "'Первомай'"
   RED_the_threats_abound_desc: "День трудящихся приближается, омраченный культом личности Черино, теряя свое истинное значение. Мы, вместе с сочувствующими внутри армии и революционной армией, начнем революцию в этот день, чтобы свергнуть старый режим и построить Красную Зиму для рабочих."
   RED_maintaining_the_fire: "Сохраняя пламя революции"
   RED_maintaining_the_fire_desc: "Хотя в Кивотосе было много буржуа и угнетателей, в этом мире, куда мы попали, тоже есть буржуа и угнетатели, а также самозванцы нашего революционного духа, которые относятся к жизням рабочих как к мухам, утоляя свои властные амбиции. Мы должны подготовиться к еще большей революции против них."
   RED_freedom_of_thought: "Совет юных кадетов"
   RED_freedom_of_thought_desc: "Совет юных кадетов проводит исследования для рабочих и борется с теми, кто вредит рабочим. Молодежь оживит Федерацию Красной Зимы."
   RED_deal_with_ger: "Изгнание Бюро"
   RED_deal_with_ger_desc: "Хотя Первомайская революция увенчалась успехом, влияние Бюро все еще существует в кампусе Красной Зимы. Прежде чем эти реакционеры, при поддержке Бюро, смогут вмешаться в революцию, мы должны отрезать их корни."
   RED_back_to_workplace: "Возвращение на рабочие места"
   RED_back_to_workplace_desc: "После успешной Первомайской революции Черино и Бюро бежали в норвежское военное правительство. Длительная забастовка, начавшаяся в феврале, закончилась победой Революционного комитета. Сейчас настало время всем рабочим вернуться на свои рабочие места. На фабрики 'без владельцев', в цеха 'без менеджеров'."
   RED_defense_revolution: "Защитить революцию!"
   RED_defense_revolution_desc: "Хотя мы добились успеха во многочисленных революциях в Кивотосе, мы часто становились самоуспокоенными после победы революции и были легко побеждены контрреволюцией Бюро. Поскольку Первомайская революция имела большой успех, пришло время исправить ошибки прошлого и уделить первоочередное внимание рабочему правительству, которое является результатом революции."
   RED_communist_diplo: "Боевой союз"
   RED_communist_diplo_desc: "Боевой союз — это вооруженная группа, добровольно организованная пылкими студентами с революционным духом, являющаяся авангардом и защитниками революции. Собравшиеся со всех сторон, эти люди будут сражаться насмерть, чтобы защитить революционную победу, завоеванную кровью народа."
   RED_communist_diplo_tt: "\nВ каждом принадлежащем вам и неразоруженном государстве будут созданы §Y2 дивизии гражданской войны§!."
   RED_new_council: "Новая социалистическая конституция"
   RED_new_council_desc: "После революции Революционный комитет решил добровольно распуститься для разработки новой конституции и был заменен Учредительным собранием. По мере обсуждения новой конституции в ознаменование успеха революции и установления основ нашего рабочего правительства, дебаты продолжаются."
   RED_GGOKDUGAKSI: "Превращение Департамента услуг в марионетку"
   RED_workerfront: "Учреждение Совета"
   RED_attack_geh: "Внезапная атака на датскую военную администрацию"
   RED_attack_geh_desc: "Новости о поражении Бюро и успехе революции распространяются по всем военным администрациям. Прежде чем Бюро, бежавшее в Норвегию, сможет мобилизовать свои войска, мы должны внезапно атаковать близлежащую военную администрацию в Дании, чтобы остановить их мобилизацию."
   RED_anti_fascism_policy: "Революционный трибунал"
   RED_anti_fascism_policy_desc: "Черино и Бюро снова были свергнуты рабочими. Сейчас самое время предать суду реакционеров из Бюро, которые установили диктатуру под сладкой ложью 'действовать от имени народа'."

