# Промышленность
RED_road_to_south: "Реконструкция южных дорог"
RED_road_to_south_desc: "Дороги на юге относительно хорошо построены по сравнению с севером. При небольшом обслуживании они могли бы быть очень полезны."
RED_road_to_south_tt: "\n§RОблегчить перенаселение§! с помощью §Y£GFX_decision_icon_small решения§!."
RED_road_to_north: "Реконструкция северных дорог"
RED_road_to_north_desc: "Несмотря на то, что север более отсталый, чем юг, именно по этой причине он таит в себе больше возможностей. Создание базовой транспортной сети — первый шаг к развитию региона, так что давайте начнем реконструкцию сейчас."
RED_land_research: "Решение жилищной проблемы"
RED_land_research_desc: "С начала великого конфликта наши дома были разрушены. Чтобы избежать катастрофы, когда все останутся ночевать на улицах, мы должны полностью искоренить жилищную проблему."
RED_improve_railway_network: "Улучшение железнодорожной сети"
RED_improve_railway_network_desc: "Снабжение — основа войны. Мы должны поддерживать нашу железнодорожную систему, чтобы обеспечить снабжение."
RED_economy_dev_plan: "План экономического развития"
RED_economy_dev_plan_desc: "Хронический экономический спад постоянно причинял страдания жителям этого района. Нам нужно как можно скорее улучшить ситуацию."
RED_industrial_planning: "Промышленное планирование"
RED_entice_publicworks_cherino: "Привлечь департамент общественных работ"
RED_entice_publicworks_minori: "Расширить департамент общественных работ"
RED_entice_publicworks: "[RED_entice_publicworks]"
RED_entice_publicworks_tt: "\n§YПри найме§!:"
RED_entice_publicworks_desc: "Помощь департамента общественных работ необходима для экономического восстановления. Нам нужно привлечь их к участию в усилиях по восстановлению.\nДостаточного количества пудинга в качестве награды будет достаточно, чтобы убедить их."
RED_upgrade_heavy_industry: "Расширение тяжелой промышленности"
RED_upgrade_heavy_industry_desc: "Чтобы восстановить экономику, нам нужны промышленные объекты как основа. Сначала расширим объекты тяжелой промышленности, чтобы увеличить производство."
RED_upgrade_light_industry: "Стимулирование легкой промышленности"
RED_upgrade_light_industry_desc: ""
RED_upgrade_army_industry: "Расширение военной промышленности"
RED_upgrade_army_industry_desc: "Инвестиции для подготовки к иностранному вторжению необходимы. Подготовим заводы для производства военных поставок."
RED_steel_casting_industry: "Расширение сталелитейного производства"
RED_steel_casting_industry_desc: "Сталь — базовый ресурс для всей промышленности. Мы должны расширить добычу железной руды, чтобы увеличить производство стали."
RED_synthetic_rubber: "Синтетический каучук"
RED_synthetic_rubber_desc: "Хроническая нехватка каучука вызывает перебои в производстве. Новая технология синтетического каучука могла бы решить эту проблему."
RED_oil_production: "Разработка нефтяных месторождений"
RED_oil_production_desc: "Нам не хватает нефти. К счастью, с нашей передовой технологией мы можем разрабатывать нефтяные месторождения Северного моря, до которых местные жители не добрались."
RED_industrial_futurization: "Фокусировка на производстве"

RED_industrial_futurization_desc: ""
RED_future_production_line: "Военно-промышленный комплекс"
RED_future_production_line_desc: "Система производства здесь крайне неэффективна. Теперь, когда базовые отрасли несколько устоялись, пришло время для полного пересмотра производственной линии."
RED_economic_miracle: "Экономическое чудо"
RED_restored_economy: "Восстановленная экономика"
RED_restored_economy_desc: "Благодаря усилиям нашего правительства по экономическому восстановлению, мы преодолели невзгоды великого конфликта и возглавили экономическое развитие. Да здравствует Федеральная академия Красная Зима!"
RED_new_economy_focus_0: "Мобилизовать все средства"
RED_new_economy_tt: "§gМы будем двигаться к быстрому росту через жертвы.§!\n\n"
RED_new_economy_focus_0_tt: "\nПри завершении этого фокуса §Y$RED_rearming_focus_1$§! и некоторые определенные фокусы будут заблокированы."
RED_new_economy_focus_1: "К полной занятости"
RED_new_economy_focus_2: "Персональное распределение на рабочем месте"
RED_new_economy_focus_3: "Общественные работы"
RED_new_economy_focus_4: "Служение и самоотдача"
RED_new_economy_focus_5: "Промышленная мобилизация"
RED_new_economy_focus_6: "Масштабное разоружение"
RED_new_economy_focus_7: "Облигации восстановления Красной Зимы"
RED_new_economy_focus_8: "Займ Кайзера"
RED_new_economy_focus_9: "Денежно-кредитная политика"
RED_new_economy_focus_10: "Безграничная инфляция"
RED_new_economy_focus_11: "Замораживание валюты"
RED_new_economy_focus_12: "Предел собственности"
RED_new_economy_focus_13: "Введение трудовых облигаций"
RED_new_economy_focus_14: "Освоение земель"
RED_new_economy_focus_15: "Фокус на добыче ресурсов"
RED_new_economy_focus_16: "Модернизация сельского хозяйства"

RED_economy_focus_0: "Расширение научных и инженерных клубов"
RED_economy_focus_0_desc: ""
RED_economy_focus_1: "Освоение региона Тундры"
RED_economy_focus_1_desc: "Сейчас это просто бесполезная и холодная земля, но оставлять ее такой — лишь пустая трата территории. Мы инвестируем в инфраструктуру, чтобы заложить основы промышленного развития севера."
RED_economy_focus_2: "[142.getname] Алюминиевый рудник"
RED_economy_focus_2_desc: "Мы улучшим добычу алюминия, чтобы продвинуться к самообеспечению ресурсами."
RED_economy_focus_3: "Интеграция местных технических бюрократов"
RED_economy_focus_3_desc: "На месте, куда мы переместились, все еще существует много жизнеспособных местных производств. Если мы их разовьем, это принесет значительную промышленную выгоду."
RED_economy_focus_5: "План развития сельских районов"
RED_economy_focus_5_desc: "Мы будем развивать сельское хозяйство, один из ключевых промышленных секторов, с помощью нашего плана развития сельских районов."
RED_economy_focus_6: "Поддержка механизации сельского хозяйства"
RED_economy_focus_6_desc: "Все крестьяне смогут двигаться к более высокому урожаю, вспахивая свои поля тракторами."

RED_economy_focus_8: "План индустрии потребительских товаров"
RED_economy_focus_8_desc: "Нехватка потребительских товаров приближается к катастрофе. Мы должны решить это."
RED_economy_focus_9: "Первая альтернативная экономическая политика"
RED_economy_focus_9_desc: "Радикализация коллективизации и национализации определенно не являются решениями для текущей ситуации. Во времена нынешней промышленной «войны» необходима альтернативная экономическая политика. Буквально, «альтернативная экономическая политика» — это модификация исходной социалистической экономической политики, включающая элементы рынка, посредством которой мы будем стимулировать малые и средние предприятия и создавать прочную промышленную инфраструктуру."
RED_economy_focus_10: "Поддержка частных предприятий"
RED_economy_focus_10_desc: "Поскольку администрация находится в состоянии паралича, не все предприятия могут управляться академией. Мы передадим промышленность различным частным компаниям."
RED_economy_focus_11: "Восстановление морской индустрии"
RED_economy_focus_11_desc: "У этой земли, которую мы оккупировали, есть доступ к большой береговой линии. Инвестиции в океан — это инвестиции в эту землю."

RRED_economy_focus_13: "Активация торговли"
RED_economy_focus_13_desc: "Хотя Красная Зима выбрала политический изоляционизм, торговля необходима для существования государства. Мы снимем запрет на торговлю на ограниченных территориях, чтобы импортировать ресурсы, которых не хватает в нашей стране."
RED_economy_focus_14: "Вторая альтернативная экономическая политика"
RED_economy_focus_14_desc: "С успехом первой альтернативной экономической политики мы успешно продемонстрировали компетентность нашего правительства. Мы не остановимся на достигнутом и улучшим слабые места первой альтернативной экономической политики и максимизируем ее преимущества с помощью «Второй альтернативной экономической политики»."
RED_economy_focus_15: "Денежная реформа"
RED_economy_focus_15_desc: "Различная денежная система в Кивотосе и у местных жителей вызвала серьезные потрясения в финансовой индустрии. Мы должны ускорить денежную реформу, чтобы успокоить этот хаос."
RED_economy_focus_16: "Адресная социальная поддержка"
RED_economy_focus_16_desc: "Одной из главных задач второй альтернативной экономической политики является адресная социальная поддержка. Мы будем в приоритетном порядке поддерживать экономически уязвимые группы, чтобы помочь их реинтеграции в общество."
RED_economy_focus_17: "Рыночный социализм"
RED_economy_focus_17_desc: ""
RED_economy_focus_18: "Выращивание товарных культур"
RED_economy_focus_18_desc: "Сельское хозяйство служит не только для самообеспечения продовольствием. Товарные культуры — это богатство."
RED_economy_focus_19: "Коммерческое сельское хозяйство"
RED_economy_focus_19_desc: "Мы передадим управление сельским хозяйством торговцам, чтобы мы могли стремиться к большему воспроизводству капитала."
RED_economy_focus_20: "Рыбная промышленность и аквакультура"
RED_economy_focus_21: "Движение Красного Коня"
RED_economy_focus_22: "Кооперативная экономика"
RED_economy_focus_23: "Независимый центральный банк"
RED_economy_focus_24: "Гибкая занятость"
RED_economy_focus_25: "Сельский капитализм"
RED_economy_focus_26: "Поселок Фолькехмет"
RED_first_aep_tt: "Этот фокус является частью §tПервой альтернативной экономической политики§!.\n\n"
RED_second_aep_tt: "Этот фокус является частью §tВторой альтернативной экономической политики§!.\n\n"
RED_economy_focus_27: "Усиление регулирования"

RED_club_focus_0: "Вычислительное бюро Красной Зимы"
RED_club_focus_0_desc: "Необходимо восстановить академию, остановившуюся из-за великого конфликта. Сначала нам нужно восстановить парализованную административную способность."
RED_club_focus_1: "Восстановление Департамента питания"
RED_club_focus_1_desc: "Даже если администрация будет восстановлена и академия снова заработает, если мы не решим фундаментальную проблему питания, мы снова рухнем. Давайте восстановим Департамент питания, чтобы избежать худшего."
RED_club_focus_2: "Восстановление контроля над клубами"
RED_club_focus_2_desc: "Мы должны взять под контроль необузданную угрозу со стороны клубов!"
RED_club_focus_3: "Реконструкция старого здания"
RED_club_focus_3_desc: "После великого конфликта возникла необходимость реконструировать старое здание, где собираются проблемные элементы. Давайте реконструируем старое здание, чтобы показать, что у академии нет проблем."
RED_club_focus_4: "Привлечение спецкласса 227"
RED_club_focus_4_desc: "Мы привлечем спецкласс 227, чтобы они внесли свой вклад в академию."
RED_club_focus_5: "Поддержка гуманитарных и социальных наук"
RED_club_focus_5_desc: "\"Без математики невозможно провести точные количественные измерения или астрономию, без химии нельзя правильно выплавить железо, а без теологии нельзя правильно мыслить о религии.\" - Джон Холл\n\nИ без философии и социологии нельзя взывать к освобождению. Мы повысим уровень знаний общества в целом через высшее образование для рабочих!"
RED_club_focus_6: "Авангард искусства"
RED_club_focus_6_desc: "Творчество — это непрерывная агония. Мы должны сломать привычные шаблоны и открыть новые горизонты, чтобы вызвать бесконечную революцию в нашем воображении. Только после отрицания, демонтажа и попрания всех реальностей, опыта, представлений и знаний будет достигнуто истинное освобождение!"
RED_club_focus_7: "Реализм"
RED_club_focus_7_desc: "Мы должны быть способны критически и реалистично видеть сквозь призму «реалистической литературы» капиталистическую и феодальную структуру. Любое преобразование начинается с восприятия и оценки."
RED_club_focus_8: "Коммерческая литература"
RED_club_focus_8_desc: "Перо сильнее меча. Кроме того, оно приносит деньги. Мы направим исключительные писательские способности академии в коммерцию."
RED_great_punch: "Великий удар"
RED_great_punch_desc: "Отчаянно нуждаемся в мощном оружии на случай чрезвычайной ситуации."
RED_rocket_romance: "Ракетный роман"
RED_rocket_romance_desc: "Ракетную технологию можно считать суммой всех наук и технологий."
RED_club_focus_9: "Фронт освобождения знаний"
RED_club_focus_10: "Народный университет Красной Зимы"
RED_club_focus_11: "Курорт комнаты 227"
RED_club_focus_11_tt: "§Y[THIS.getname]§! станет адмиралом."
BA_onsen: "Курорт"

# Фокус секретариата
RED_our_leader_cherino: "Наш лидер, Черино"
RED_our_leader_cherino_desc: "Великий лидер Красной Зимы, Черино, справлялась с хаосом великого конфликта и является единственным лидером, который может снова сделать нашу академию великой. Даже если есть ложная пропаганда со стороны реакционеров, мы без колебаний доверяем Черино, следуем за ней и боремся против всех буржуев мира."
RED_accept_trotskism: "Альтернатива советскому коммунизму"
RED_accept_trotskism_desc: "После великого конфликта наша академия боролась за место государства и лидера международного коммунизма, которое ранее занимал так называемый Советский Союз. Чтобы решить эту ситуацию, товарищ Черино лично предложила место в секретариате Красной Зимы странному изгнаннику по имени Троцкий. Хотя доверять ему рано, было бы лучше довериться выбору товарища Черино."
RED_the_fourth_international: "Четвертый интернационал"
RED_the_fourth_international_desc: "Так называемый Третий интернационал при сталинистах не имеет ничего общего с теориями Маркса и Ленина и искажает демократически контролируемое государство рабочих в антиутопию. Нам нужен новый интернационал, который бросит им вызов!"
RED_restore_the_security: "Восстановление службы безопасности"
RED_restore_the_security_desc: "В настоящее время в Красной Зиме лояльный народ смешан с реакционерами. Если мы восстановим агентство безопасности, которое было разрушено из-за великого конфликта, и поддержим его функционирование, мы сможем эффективно поддерживать порядок."
RED_locals_problem: "Контроль над военной администрацией"
RED_locals_problem_desc: "Пришло время серьезно управлять военными администрациями, которые Федеральная академия Красная Зима получила в результате великой революционной войны, развязанной после великого конфликта. Нынешнее жестокое господство должно быть свергнуто, и, наконец, вся Скандинавия должна присоединиться к нашей академии."
RED_locals_problem_tt: "\n§LИскоренение коррупции внутри военной администрации!§!\n\n"
RED_depress_locals: "Политика принудительного переселения"
RED_depress_locals_desc: "Мы принудительно переселим все местное население в места, более контролируемые нами, и заполним эти пространства ученицами и автономными жителями Красной Зимы для достижения эффективной и быстрой интеграции."
RED_enticing_locals: "Создание автономных республик"
RED_enticing_locals_desc: "Людям нужен не только кнут, но и подходящий пряник. Мы покончим с чрезмерным угнетением местного населения со стороны агентства безопасности и создадим местное автономное правительство, чтобы урегулировать отношения между нами и местными жителями и создать стабильную систему."
RED_enticing_locals_tt: "§Y$RED_social_reform$§! и другие системы фокусов изменятся.\n\n"
RED_redwinter_office: "Офис Красной Зимы"
RED_redwinter_office_desc: "Офис Красной Зимы является главным административным учреждением федеральной академии. После великого конфликта, разрушившего региональную административную систему, мы должны сделать все возможное, чтобы восстановить промышленность и политику академии до нормального состояния."
RED_redbear_editorial: "Издательство «Красный Медведь»"
RED_redbear_editorial_desc: "В нашей администрации огромная дыра, и процесс полон коррупции. Несмотря на это, к счастью, единственное существующее в этой академии пресс-учреждение на нашей стороне. Хотя это временная мера, это будет лучший способ на время успокоить жалобы."
RED_heros_at_front: "Герои фронта"
RED_heros_at_front_desc: "Те, кто пошли на фронт вместо нас и сражаются, достойны звания героев. Президент Черино хвалит их самоотверженность и приказала добавить пудинг в рацион героев как славную привилегию."
RED_welcome_immigrate: "Принятие местной Коммунистической партии"
RED_welcome_immigrate_desc: "Мы будем активно использовать местные организации, которые частично сочувствуют нашему делу."
RED_welcome_thugs: "Принудительное размещение трудовых мигрантов"
RED_welcome_thugs_desc: "Нам нужно транспортировать и развертывать рабочую силу из разных регионов для достижения целей наших сложных промышленных планов. Трудовые мигранты теперь будут направляться на строительство спланированных городов и расширение промышленных объектов."

RED_kivotos_halo_militia_add-10_tt: "§C«Ополчение Ореола»§! §YКивотоса§! §RЛимит размера уменьшен§!: §R-10§!\n"
RED_kivotos_halo_militia_add1_tt: "§C«Ополчение Ореола»§! §YКивотоса§! §GЛимит размера увеличен§!: §G+1§!\n"
RED_kivotos_halo_militia_add2_tt: "§C«Ополчение Ореола»§! §YКивотоса§! §GЛимит размера увеличен§!: §G+2§!\n"
RED_kivotos_halo_militia_add3_tt: "§C«Ополчение Ореола»§! §YКивотоса§! §GЛимит размера увеличен§!: §G+3§!\n"
RED_kivotos_halo_militia_add6_tt: "§C«Ополчение Ореола»§! §YКивотоса§! §GЛимит размера увеличен§!: §G+6§!\n"
RED_enlarge_secret_police: "Расширение тайной полиции"
RED_enlarge_secret_police_desc: "Мы не можем полагаться только на военную администрацию для поддержания внутреннего порядка. Централизация и нисходящее управление разрозненными операциями по обеспечению безопасности усилят контроль."
RED_enlarge_secret_police_tt: "§YНестабильность в военной администрации§! §Gуменьшится§!:\n\n"
RED_enemy_of_class: "Враги класса"
RED_enemy_of_class_desc: "Несмотря на наши усилия, направленные на совместное продвижение к новому обществу, в регионе всё еще присутствуют реакционные мелкобуржуазные элементы, пытающиеся контрреволюционным путем помешать этому. Мы объявим этих лиц «врагами класса» и одержим победу в этой борьбе!"
RED_industry_of_mil_gov: "Индустриализация территории военной администрации"
RED_industry_of_mil_gov_desc: "Исследования показывают, что территории, которые мы удерживаем как военные администрации, уже достаточно индустриализированы. Если мы проведем индустриализацию территории военной администрации непосредственно из центра, это не только усилит контроль над военной администрацией, но и значительно повысит промышленный потенциал академии."
RED_develope_local_industry: "Развитие местной промышленности"
RED_develope_local_industry_desc: "Мы должны признать, что наших возможностей недостаточно для принятия плановой экономики. Мы должны предоставить значительную автономию местным властям."
RED_develope_local_industry_tt: "Сосредоточено на §Yповышении эффективности промышленности§! региона."
RED_local_economic_plan: "Нисходящий местный экономический план"
RED_local_economic_plan_desc: "Хорошо продуманный промышленный план полезнее всего остального."
RED_local_economic_plan_tt: "Сосредоточено на §Gиндустриализации§! региона."
RED_social_reform: "Социальная реформа"
RED_social_reform_desc: "Индустриализация не должна заканчиваться только на экономическом и промышленном секторах. Мы реформируем прежнюю капиталистическую систему образования и культуры и достигнем одновременной материальной и духовной индустриализации."
RED_develop_re1: "Датская реформа"
RED_develop_re1_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_develop_re2: "Норвежская реформа"
RED_develop_re2_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_develop_re3: "Реформа Сапми"
RED_develop_re3_desc: "Был завершен детальный план в соответствии с регионом реализации."

RED_horizontal_intergration: "Горизонтальная интеграция"
RED_horizontal_intergration_desc: "Неэффективно, когда несколько агентств одновременно занимаются одной и той же работой. Мы подготовимся к горизонтальному слиянию."
RED_intergrate_re1: "Промышленная интеграция Дании"
RED_intergrate_re1_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_intergrate_re2: "Промышленная интеграция Норвегии"
RED_intergrate_re2_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_intergrate_re3: "Промышленная интеграция Сапми"
RED_intergrate_re3_desc: "Был завершен детальный план в соответствии с регионом реализации."

RED_horizontal_intergration: "Горизонтальная интеграция"
RED_horizontal_intergration_desc: "Неэффективно, когда несколько агентств одновременно занимаются одной и той же работой. Мы подготовимся к горизонтальному слиянию."
RED_intergrate_re1: "Промышленная интеграция Дании"
RED_intergrate_re1_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_intergrate_re2: "Промышленная интеграция Норвегии"
RED_intergrate_re2_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_intergrate_re3: "Промышленная интеграция Сапми"
RED_intergrate_re3_desc: "Был завершен детальный план в соответствии с регионом реализации."
RED_advance_security: "Усиление агентства безопасности"
RED_advance_security_desc: "Агентство безопасности безупречно и усердно выполняло миссии, порученные секретариатом, и они заслуживают большей поддержки и большего количества пудинга."
RED_advance_security_tt: "§tВыиграйте в игре «Змейка»§! §Gи обеспечьте победу§!."
RED_end_of_counter_revolution: "Конец контрреволюции"
RED_end_of_counter_revolution_desc: "Мы не можем продолжать управлять государством под постоянной угрозой переворотов и гражданских войн. Необходима более сильная и быстрая административная власть, чтобы устранить все эти угрозы."
RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs: "Повышение статуса агентства безопасности до Министерства внутренних дел"
RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs_desc: "Агентство безопасности теперь будет функционировать как министерство внутренних дел, не только поддерживая порядок, но и обеспечивая безопасность государства."
RED_socialism_over_the_world: "Перманентная революция"
RED_socialism_over_the_world_desc: "Марксизм гласит, что если условия подходящие, революция неизбежна. Однако есть случаи, когда условия не полностью благоприятствуют, и даже если условия благоприятствуют, это применимо не везде. Мы не можем довольствоваться реальностью, ожидая революции, которая может произойти через несколько столетий. Прямо сейчас рабочие и крестьяне во всем мире страдают, и мы не можем ждать их освобождения."
RED_the_builder_of_the_winter_army: "Строитель Зимней армии"
RED_the_builder_of_the_winter_army_desc: "Под руководством товарища Троцкого, выдающегося революционера и бывшего политического оппонента Сталина, военная реформа Красной Зимы продвигается быстрее!"
RED_the_builder_of_the_winter_army_tt: "\n§Y$RED_restore_cossack_units$§! или §Y$RED_cohesion_first$§! Три системных подхода будут завершены случайным образом."
RED_collectivist_economy: "Коллективистская экономика"
RED_collectivist_economy_desc: "Мы быстро уйдем от капиталистического способа производства."
RED_strengthen_heavy_industry: "Укрепление тяжелой промышленности"
RED_strengthen_heavy_industry_desc: "Тяжелая промышленность — это сердце нашей экономики. Если мы хотим, чтобы революция не просто выжила, но и добилась успеха, мы должны еще больше укрепить сектор тяжелой промышленности."
RED_strengthen_heavy_industry_tt: "\n§LИскоренение коррупции в производственном секторе!§!\n\n"
RED_agricultural_collectivization: "Сельскохозяйственная коллективизация"
RED_agricultural_collectivization_desc: "Сельскохозяйственная коллективизация Сталина была политически мотивирована и не следовала социальному анализу или революционной теории. Однако у нас есть Троцкий и его способные теоретики, и вместе с ними мы преодолеем «провалившуюся» сталинскую коллективизацию и достигнем подлинного коллективного сельского хозяйства."
RED_system_decentralization: "Децентрализация системы"
RED_system_decentralization_desc: "Сталин централизовал не только партию, но и все государство в себе. Это был явно контрреволюционный подход, который украл власть у рабочих. В нашей Красной Зиме, наоборот, мы позволим рабочим самим решать свою судьбу."
RED_strengthen_the_trade_unions: "Укрепление профсоюзов"
RED_strengthen_the_trade_unions_desc: "При Сталине профсоюзы, которые должны представлять рабочих в оппозиции к управлению, превратились в инструменты управления, руководящие рабочими, и фактически помешали рабочим получить выгоды от революции. К счастью, рабочие здесь очень демократичны и самообучаемы."
RED_large_administrative: "Обширная администрация"
RED_large_administrative_desc: "Нам нужно восстановить контроль над недостаточным управлением в сельских районах."
RED_large_administrative_tt: "\n§LИскоренение коррупции в сельской местности!§!\n\n"
RED_strengthen_regional_party: "Укрепление региональной партии"
RED_strengthen_regional_party_desc: "Предоставляя больше автономии низовым партийным организациям, мы делаем еще один шаг к демократии снизу вверх."
RED_long_live_the_workers_government: "Обеспечить производство пудинга"
RED_long_live_the_workers_government_tt: "\nОбеспечить дополнительное снабжение §Yпудингом§!."
RED_long_live_the_workers_government_desc: "Сейчас важнее всего благосостояние. Мы сначала обеспечим поддержку масс, прежде чем внедрять политику."
RED_got_pudding_flag_tt: "\nДополнительное снабжение §Yпудингом§! не обеспечено:\n"
RED_all_power_to_redwinter: "Вся власть советам!"
RED_all_power_to_redwinter_tt_1: "§gНа всех рабочих местах, во всех сельских районах, от чайных до площадей — всё полно речей о новом обществе!§!"
RED_all_power_to_redwinter_desc: "«Совет» как орган социального участия народа больше не должен контролироваться секретариатом. Наоборот, секретариат теперь должен быть под контролем совета. Как говорится: «Вся власть советам!»"
RED_all_power_to_redwinter_tt: "§YДлина очереди§! составляет §Y5§! или более"
RED_all_power_to_redwinter_tt_2: "\nПолучается до §G3§! §Yгражданских фабрик§! в зависимости от §YДлины очереди§!, превышающей §Y5§!:\n"
RED_invite_trotskists: "Пригласить троцкистов"
RED_invite_trotskists_desc: "У Троцкого есть свои последователи. С тех пор как он потерял власть в Советском Союзе, они были в изгнании или скрывались по всему миру. Мы должны созвать их сюда, чтобы работать вместе с ним."
RED_expand_publishing_dep: "Расширение издательского отдела"
RED_expand_publishing_dep_tt: "§Y$RED_cherino$§! §RКоммунистические знания §YCherino§! равны §Y6§! или более (текущее: §Y[?RED_cherino_communism_knowledge]§!)"
RED_expand_publishing_dep_desc: "Мир Исекая полон фейковых новостей, как и в Школе Хронос. Только «Красный Медведь», издаваемый исключительно издательским отделом, является правдивым СМИ, и нам нужно публиковать его больше, чтобы расширить издательский отдел."
RED_socialist_press: "Социалистическая пресса"
RED_kill_editorial: "Ослабление издательского отдела"
RED_kill_editorial_tt: "§LИскоренение коррупции внутри издательского отдела!§!\n\n"
RED_merger_of_educational_institutions: "Полное поглощение образовательных учреждений"
RED_merger_of_educational_institutions_desc: "Западная образовательная политика, пропитанная буржуазным мышлением, не нужна в Красной Зиме. Мы ликвидируем все образовательные учреждения, способствующие реакции, и передадим метод образования Красной Зимы всем учебным заведениям."
RED_merger_of_educational_institutions_tt: "\n§LИскоренение коррупции внутри образовательных учреждений!§!\n\n"
RED_collectivist_propaganda: "Коллективистская пропаганда"
RED_collectivist_propaganda_desc: "Борьба всех народов является общей, и мы не оставим ни один народ бороться в одиночку. Следовательно, достижения всех народов должны быть общими."
RED_the_production_movement: "Борьба за производство"
RED_the_production_movement_desc: "Чтобы укрепить наши позиции в соревновании с капиталистическим миром, мы не можем быть им сдерживаемы. Нам нужно создать свою собственную производственную базу без внешнего вмешательства, и сейчас самое время начать борьбу за производство."
RED_socialist_realism: "Социалистический реализм"
RED_socialist_realism_desc: "Путь к славной Красной Зиме не всегда гладок. В ходе этого процесса некоторые народы могут потерять надежду. Мы должны поощрять искусство, которое показывает, какова Красная Зима на самом деле, и демонстрировать, что мы прилагаем усилия."
RED_heroism_propaganda: "Пропаганда героизма"
RED_heroism_propaganda_desc: "Хотя достижения всех народов Красной Зимы являются общими для всех членов рабочего класса, те, кто посвятил себя народам, должны быть признаны героями, которым все народы должны подражать."
RED_war_hero: "Герой войны"
RED_war_hero_desc: "Все народы Красной Зимы объединились, чтобы противостоять врагам, угрожающим Красной Зиме, и всегда будут это делать. Однако мы не должны игнорировать солдат, проявивших исключительные способности в защите родины."
RED_pluralistic_view: "Плюралистический взгляд"
RED_liberal_for_debate: "Свободные дебаты"
RED_press_commercial_magazine: "Публикация коммерческих журналов"
RED_free_press: "Свободная пресса"
RED_principle_of_democratic_centralism: "Принцип демократического централизма"

RED_foreign_policy: "Внешняя политика"
RED_foreign_policy_desc: "Хотя в нынешней ситуации Красной Зимы важно уделять первостепенное внимание внутренним делам, также крайне важно поддерживать отношения со старыми городами-академиями и формировать связи с местными государствами. Красная Зима должна готовиться к тому, чтобы снова выйти на мировую арену."
RED_political_realism: "Политический реализм"
RED_political_realism_desc: "Хотя завершение революции требует кровопролития, нет необходимости в больших жертвах. Если мы проведем более гибкую внешнюю политику, мы сможем свести к минимуму жертвы народов и завершить революцию."
RED_expansionism: "Активная оборона"
RED_expansionism_desc: "\"Единственная настоящая защита — это активная оборона.\"\n- Мао Дзедун"
RED_attack_fin: "Вторая оборонительная комиссия"
RED_attack_fin_desc: "Наша оборонительная комиссия, которая двинулась на север как продолжение северного наступления, потерпела сокрушительное поражение в Финляндии. Однако это не означает наше поражение. Мы должны восстановить оборонительную комиссию в регионе Финляндии и сделать её нашей военной базой."
RED_gotland_or_war: "Самооборона в Северном море"
RED_gotland_or_war_desc: "Готланд изначально принадлежал Швеции, но был неожиданно занят остатками немецкого флота после их поражения. Однако это стратегический пункт, необходимый для обеспечения полной гегемонии на Балтийском море, поэтому мы предъявим им окончательный ультиматум с требованием покинуть Готланд."
RED_attack_ger: "Южное наступление"
RED_attack_ger_desc: "Скандинавский полуостров и Европа разделены проливом, что делает крайне сложным проведение операций по региональной обороне в датском регионе. Наступление на Шлезвиг и далее на Гольштейн приведет к безопасности реки Штёр, что является преимуществом в позиционной войне с использованием реки."
RED_GEK_gave_goatland_flag: "§Y[GEK.GetAdjective]§! уступил §Y[124.getname]§!"
RED_GEK_gave_goatland_flag_tt: "Текущие дни: [?RED_GEK_gave_goatland_flag:days|Y0]"
RED_hegemony_on_balt: "Гегемония на Балтике"
RED_hegemony_on_balt_desc: "Нам нужна явная гегемония на Балтийском море."
RED_deal_with_fin: "Союз с государством-буфером"
RED_deal_with_fin_desc: "Финляндия, граничащая с нами, а также с Советским Союзом, также враждебна по отношению к Советскому Союзу. Если мы протянем руку первыми, возможно, они не будут проявлять к нам враждебность и будут сотрудничать против Советского Союза."
RED_deal_with_fin_tt: "\n§gМожет использоваться в государствах Междуморья, находящихся в состоянии войны с §Y[SOV.GetAdjective]§!."
RED_seek_allies: "Поиск союзников"
RED_seek_allies_desc: "Мы должны искать союзников против Советов."
RED_support_german: "Поддержка [GEK.getname]"
RED_support_german_desc: "Мы должны поддерживать товарищей, выступающих против гегемонии Тринити."
RED_support_geh: "Поддержка Геенны"
RED_support_geh_desc: "Мы должны поддерживать товарищей, выступающих против гегемонии Тринити."
RED_trade_with_KAI: "Активация гражданского обмена"
RED_trade_with_KAI_desc: "Изоляция на самом деле не очень хорошая идея."
RED_infiltrate_trm: "Проникновение в Тринити"
RED_infiltrate_trm_desc: "Мы должны подготовиться к экспансии Тринити."
RED_unlock_operation_tt: "@TRM§Y[TRM.getadjective]§! может быть целью §Yопераций§! §Gдоступны§!:\n§YВыпуск фальшивых денег§!, §YРаспространение биологического оружия§!"

BA_fake_money_gang: "Выпуск фальшивых денег"
BA_fake_money_gang_desc: "Мы будем выпускать фальшивые деньги, чтобы нанести непоправимый ущерб экономике вражеской страны."
BA_corona_gang: "Распространение биологического оружия"
BA_corona_gang_desc: "Кажется, я помню, что раньше это было запрещено."

RED_attack_sov: "Обезопасить Советский Союз"
RED_attack_sov_desc: "Односторонний подход советского лидера представляет угрозу для нашей революции, и установленный факт, что мы должны противостоять им, чтобы завершить нашу революцию. И сейчас пришло время."
RED_new_inteligence_agency: "Новое учреждение разведывательного агентства"
RED_new_inteligence_agency_desc: "Печальная известность Разведывательного агентства Красной Зимы хорошо известна в городах-академиях. Президент Черино приказала реорганизовать Разведывательное агентство Красной Зимы, чтобы подготовиться как к внутренним, так и к внешним врагам."
RED_professioner_undercover: "Специалист по внедрению"
RED_professioner_undercover_desc: "Для безопасного проникновения на вражескую территорию нужны элитные агенты, прошедшие интенсивную психологическую и физическую подготовку. Специалисты по внедрению, обученные нашими дружественными агентами, будут действовать как наши глаза и уши на чужбине."
RED_fraktiya: "Провокаторы"
RED_fraktiya_desc: "Пришло время развернуть специальных агентов, назначенных для раскола местных организаций сопротивления."
RED_international_frontline: "Революционная гвардия"
RED_international_frontline_desc: ""
RED_communist_instigation: "Интернациональные советские добровольцы"
RED_communist_instigation_desc: "Поддержание пролетарского интернационализма является долгом каждого рабочего."
RED_anti_stalin_in_spain: "Антисталинский фронт в Испании"
RED_anti_stalin_in_spain_desc: "$SOV_covert_support_for_spanish_poum_desc$"
RED_trotsky_s_world_revolution: "Мировая революция Троцкого"
RED_trotsky_s_world_revolution_desc: "Недавно произошло столкновение мнений между Черино, председателем студенческого совета нашей академии, и Троцким, создателем идеологии Федеральной академии. Мы должны поддержать теорию мировой революции Троцкого и подготовиться к революционной войне по всему миру в этом хаосе."
RED_cherino_s_systemic_revolution: "Системная революция Черино"
RED_cherino_s_systemic_revolution_desc: "Недавно произошло столкновение мнений между Черино, председателем студенческого совета нашей академии, и Троцким, создателем идеологии Федеральной академии. Мы должны поддержать теорию системной революции Черино, свергнуть авторитет авангардной организации и достичь устойчивого коммунизма в этом хаосе."
RED_party_reorganization: "Новый тезис"
RED_party_reorganization_desc: "Была создана новая платформа для руководства Советом Красной Зимы, и вскоре весь федеральный режим будет реорганизован в соответствии с этой платформой."
   RED_party_reorganization_tt: "§R[RED.getname] столкнется с политическим переходом, согласованным с идеологией Троцкого и левой оппозицией.§!"
   RED_party_reorganization_tt_1: "§R[RED.getname] столкнется с политическим переходом, согласованным с идеологией Черино и секретариатом.§!"
   RED_centralization: "Состояние централизации"
   RED_centralization_tt: "\n§YСовет по восстановлению освобожденных зон§! увидит усиление своей военной мощи."
   RED_union_nation_tt: "\n§YПолучит больше промышленности от Совета по восстановлению освобожденных зон§!."
   RED_union_nation: "Самоопределение наций"
   RED_workers_state: "Рабочая республика"
   RED_workers_state_desc: "Наша нация, рабочая республика, приложит усилия, чтобы не выродиться в коррумпированное бюрократическое государство, подобное соседнему Советскому Союзу, и продолжит вкладывать средства в освобождение народов мира."

   RED_party_central_dissolution: "Роспуск Центрального Комитета"
   RED_party_central_dissolution_desc: "Центральный Комитет Коммунистической партии играл доминирующую роль в партии, представляя свои мнения как мнения всей партии. Теперь, чтобы продвигаться к диктатуре партии, а не только комитета, влияние Центрального Комитета будет значительно уменьшено, а голос товарищей по партии будет усилен."
   RED_thesis_tt: "Когда будет завершена концентрация §Y$RED_party_reorganization$§!:\n\n"
   RED_freedom_of_debate_unity_of_action: "Свобода дебатов и единство действий"
   RED_multi_party_system: "Многопартийное сотрудничество"
   RED_soc_dem_party_name_long: "Социал-демократическая рабочая партия"
   RED_soc_dem_party_name: "СДРП"
   RED_hegemony_struggle: "Борьба за культурную гегемонию"
   RED_free_soviets: "Свободные советы"
   RED_free_soviets_desc: "Чтобы продвигаться к диктатуре партии, нам нужны подлинные советы, созданные и управляемые народом. Теперь рабочие на рабочих местах могут свободно создавать и распускать советы, а партийные чиновники также могут быть отозваны путем импичмента."
   RED_democratic_planned_economy: "Центральный контроль над промышленностью"
   RED_no_war_but_class_war: "Не война, а классовая война"
   RED_ideal_of_bolshevism_again: "Возрождение большевистского идеала"
   RED_cherino_core_of_solidarity: "Ядро солидарности"
   RED_day_of_victory: "День победы"
   RED_return_of_left_oppisition: "Возвращение левой оппозиции"
   RED_revolutionary_trial: "Революционный трибунал"
   RED_bolshevik_leninism: "Большевизм-Ленинизм"
   RED_social_rebuild: "Социальная реконструкция"
   RED_rebuild_party: "Реконструкция авангардной партии"
   RED_annex_party: "Присоединение партии"
   RED_fix_error: "Исправление идеологических ошибок"
   RED_creative_deconstructivism: "Творческий деконструктивизм"
   RED_federalization: "Федерализация"
   RED_military_government: "Советская военная администрация"
   RED_redwinter_in_world: "Красная Зима в мире"
   # Советский фокус
   RED_strengthen_the_trade_unions_by_sov: "$SOV_strengthen_the_trade_unions$"
   RED_the_peoples_revolution: "$SOV_the_peoples_revolution$"
   RED_the_supreme_soviet: "$SOV_the_supreme_soviet$"
   RED_for_the_common_good: "$SOV_for_the_common_good$"
   RED_victory_over_devastation: "$SOV_victory_over_devastation$"
   RED_victory_over_devastation_tt: "Фабрика товаров народного потребления: §Y-2.0%§!\nИзменение популярности партии: §G+15.00%§!\nЛимит капитуляции: §G+10.00%§!\nСкорость ремонта фабрик: §G+10.00%§!"
   RED_socialist_humanism: "$SOV_socialist_humanism$"
   RED_regional_development: "$SOV_regional_development$"
   RED_autonomous_soviet_republics: "$SOV_autonomous_soviet_republics$"
   RED_international_union_of_soviet_republics: "$SOV_international_union_of_soviet_republics$"
   RED_international_union_of_soviet_republics_tt: "Стоимость торговли для метрополии: §G-10%§!\nИзменение популярности партии: §G+10%§!"

   RED_liberation_of_the_kibotus_states: "Революционная война Киботуса"
   RED_liberation_of_the_kibotus_states_desc: "Мы должны вести первую революционную войну, чтобы демонтировать диктаторский режим академий Киботуса и установить народное государство."
   RED_liberation_of_the_kibotus_states_tt: "§gМожно использовать в граничащих государствах Киботуса§!"
   RED_armed_workers: "Вооруженный пролетариат"
   RED_armed_workers_tt: "\n§gМожно использовать в государствах, находящихся в состоянии войны§!"
   RED_war_communism_focus: "Военный коммунизм"
   RED_people_s_liberation_war: "Всемирная народно-освободительная война"
   RED_people_s_liberation_war_desc: "Началась международная освободительная война, чтобы освободить угнетенных рабочих и крестьян, а также колонизированные народы мира. Наша нация объединится как одна и выступит вперед во имя мирового освобождения."
   RED_people_s_liberation_war_tt: "Немедленное объявление войны граничащим §Yслабым странам§! (Если существует §Yпакт о ненападении§!, война не объявляется). §Y£GFX_decision_icon_small Распространение революции§! Решение также работает для местных слабых стран."
   RED_permanent_revolution: "Перманентная революция"


   # Путь Марины
   RED_no_error_at_ideology: "В поисках идеологической чистоты"
   RED_ivan_kupla: "Иван Купала"
   RED_ivan_kupla_desc: "В Красной Зиме государственные перевороты всегда были почти культурной традицией. Однако сейчас недостаточно только культуры: нужен великий план для построения истинной академии. Следующий фестиваль Ивана Купала станет отправной точкой."
   RED_coup_of_office: "Переворот Марины"
   RED_coup_of_office_desc: "Наш переворот увенчался успехом! Ренка и Черино, которые не смогли быть примером для студентов, бежали, узнав о перевороте, а гвардия захватила всех членов студенческой ассоциации и другие школьные силы под предлогом восстановления порядка. Теперь никто не сможет остановить Марину, ни сейчас, ни в будущем.\n\n...Так ведь, Марина?"
   RED_labor_party_problem: "Проблема Департамента услуг"
   RED_labor_party_problem_desc: "После переворота Департамент услуг затаил на нас глубокую обиду и решил продолжить саботаж и всеобщие забастовки. Более того, в центре клубов, отозвавших свою поддержку Офису, всегда находился Департамент услуг."
   RED_suppress_the_labor_party: "Подавить Департамент услуг"
   RED_suppress_the_labor_party_desc: "Наша первая цель должна заключаться в ограничении деятельности Департамента услуг. Остановив их протесты и разогнав их с помощью гвардии, мы сможем затем внести поправки во внутренние правила, чтобы урезать их власть."
   RED_arrest_minori: "Арестовать Минори"
   RED_arrest_minori_desc: "\"Глава Департамента услуг, Ясумори Минори!\n\nВы арестованы прямо сейчас по обвинению в организации незаконных собраний, руководстве хаотичными всеобщими забастовками и заговоре с целью переворота против Офиса и Академии вместе с другими студентами Федерации.\"\n\n"
   RED_split_the_labor_party: "Создать фракции в Департаменте услуг"
   RED_split_the_labor_party_desc: "С исчезновением Минори Департамент услуг погрузился в хаос. Даже временное руководство не может его контролировать, что представляет собой возможность, которую мы не можем упустить."
   RED_keep_an_eye_on_labor_party: "Усилить наблюдение за Департаментом услуг"
   RED_keep_an_eye_on_labor_party_desc: "Хотя мы арестовали Минори и ослабили Департамент, если появится новый подобный лидер, наши усилия будут напрасны. Поэтому крайне важно поддерживать постоянное наблюдение за ними."
   RED_puppet_labor_party: "Превратить Департамент услуг в марионетку"
   RED_puppet_labor_party_desc: "Отлично! Большинство членов Департамента присягнули на верность Офису и приняли наследие товарища Черино и лидерство Марины.\n\nТеперь Департамент услуг принадлежит нам, и мы можем управлять им по своему усмотрению."
   RED_down_with_traitors: "Искоренить предателей"
   RED_down_with_traitors_desc: "Хотя переворот был успешным, все еще существуют разрозненные силы, отвергающие нашу парадигму и гегемонию. В Красной Зиме, где перевороты стали дурной культурной привычкой, эта нестабильность должна быть устранена. Если мы не остановим внутренних предателей, наш режим не продержится."
   RED_military_purge: "Чистка вооруженных сил"
   RED_military_purge_desc: "Хотя Гвардия и новый Кадетский корпус являются нашей основной опорой, они все же являются вооруженными силами. Если однажды они осмелятся восстать, мы должны быть в состоянии подавить их и убедиться, что они находятся под кулаком Марины.\n\n\"Чистка начинается сейчас.\""
   RED_trace_the_cherino: "Выследить Черино"
   RED_trace_the_cherino_desc: "С прошлого фестиваля Ивана Купала Черино бесследно исчезла. Однако ходят тревожные слухи, что она передвигается среди клубов, пытаясь подорвать нашу гегемонию. Мы должны захватить ее, пока она не разрушила наше новое будущее!"
   RED_fate_of_trotsky: "Судьба Троцкого"
   RED_fate_of_trotsky_desc: "Лев Троцкий, некогда знаменитый советский революционер и соперник Сталина, был свергнут и оказался в Красной Зиме. Хотя он провозглашает борьбу за революцию, его путь не обязательно совпадает с нашим. Прежде чем он станет угрозой, мы должны устранить любую опасность."
   RED_marina_is_the_only_one: "Новый лидер Красной Зимы"
   RED_marina_is_the_only_one_desc: "Товарищ Марина добилась значительных успехов. Под ее руководством академия, погруженная в хаос, восстановила стабильность. Все попытки переворота были подавлены. Марина — революционная героиня Красной Зимы и законная преемница Черино."
   RED_heir_of_cherino: "Представитель Красной Зимы"
   RED_heir_of_cherino_desc: "Хотя она пришла к власти путем переворота, она с лихвой выполнила свой долг. Быстро подавив оппозицию и восстановив стабильность, она напомнила всем о прежней Черино. Теперь она может быть принята как новый президент студенческого совета Красной Зимы."
   RED_office_united_as_one: "Объединенный Офис"
   RED_office_united_as_one_desc: "Смятение в Офисе наконец прекратилось. Все внутренние враги искоренены, и последователи Черино больше не могут ступить в академию. Хотя Марина — единственная выжившая в Офисе, это и позволило ей выжить. Мы должны присягнуть на верность Марине, нашему единственному и истинному лидеру."
   RED_secure_the_publishing_department: "Обезопасить Издательский департамент"
   RED_secure_the_publishing_department_desc: "Издательский департамент, отвечающий за школьную газету «Красный Медведь» и другие СМИ, является крупнейшим пресс-учреждением академии. Контроль над ним позволит нам укрепить нашу легитимность."
   RED_appease_yakumo: "Умиротворить Якумо"
   RED_appease_yakumo_desc: "Арамаки Якумо имеет дурную репутацию в академии, но также обладает огромным влиянием в Издательском департаменте. Если нам удастся привлечь ее на свою сторону, мы сможем использовать ее сеть для продвижения Офиса."
   RED_purge_the_redbear: "Чистка редакции «Красного Медведя»"
   RED_purge_the_redbear_desc: "Хотя «Красный Медведь» является правдивой прессой, его редактор совершил серьезные акты коррупции и реакционной журналистики, наносящие ущерб нашему делу. Мы должны остановить его гегемонию и предотвратить дальнейший ущерб."
   RED_redbear_new_editor_in_cheif: "Новый главный редактор «Красного Медведя»"
   RED_redbear_new_editor_in_cheif_desc: "После чистки качество «Красного Медведя» упало. Мы должны найти нового редактора. К счастью, у нас уже есть кандидатка: Миёси Таканэ, лучший критик Издательского департамента, сможет выправить эту ситуацию."
   RED_purge_the_pd: "Чистка Издательского департамента"
   RED_purge_the_pd_desc: "Издательский департамент имеет большое влияние во всей академии. Однако в нем также есть элементы, которые могут быть опасны для Офиса. Мы должны провести чистку всех возможных реакционеров."
   RED_expand_the_pd_budget: "Расширить бюджет Издательского департамента"
   RED_expand_the_pd_budget_desc: "После реструктуризации Департамента у нас есть остаточный доход. Поскольку исследование показало плохие условия труда, настало время укрепить более продуктивные элитные силы."
   RED_new_redbear_movement: "Новое движение «Красного Медведя»"
   RED_new_redbear_movement_desc: "Наша реформа, начатая в «Красном Медведе», достигла своего полного расцвета. Ее пропаганда рассеяла студенческие опасения, а ее реформы подняли уровень журналистики.\n\nЧерез «Новое движение «Красного Медведя»» мы продемонстрировали, что никакие другие СМИ не являются столь мудрыми и правдивыми, как мы."
