 # 이벤트
 EGY_news.1.t: "Голубые рубашки организованы в Египте"
 EGY_news.1.desc: "Политическая пресса Каира недавно выразила обеспокоенность тем, что они называют Голубыми рубашками: молодежной организацией партии Вафд, или, по мнению некоторых, бандой головорезов. Они утверждают, что, хотя они были созданы для подавления антидемократической деятельности, группа радикализировалась и теперь угрожает демократической системе. Некоторые СМИ распространили сцены, в которых Голубые рубашки применяют насилие к гражданским лицам, что вызвало резкую критику внутри страны и за рубежом.\n\nКоролевский парламент Египта заявил, что проблем с поддержанием мира нет, но секторы политической академии предупреждают, что нестабильность в политике Каира усиливается, и требуют решительных мер. Перед лицом требований быстрого реагирования правительство решило обнажить меч и планировать широкое расследование в отношении Голубых рубашек. Однако граждане обеспокоены: с момента краха Британской империи Каир дрожит."
 EGY_news.1.a: "Они идут по стопам Веймара."

 EGY_news.2.t: "Подписание Соглашения в Мансуре"
 EGY_news.2.desc: "С обеспечением партией Вафд более половины мест в парламенте, король Фарук I одобрил план реформ в направлении конституционной монархии, и было подписано 'Соглашение в Мансуре'. С этим соглашением Египет официально преобразовался в конституционную монархию, и граждане восхваляли превосходное суждение короля.\n\nАнализируется, что Вафд, путем компромиссов с малыми партиями, еще больше консолидирует свою политическую базу, повышая возможность установления демократии с доминирующей партией. Местные эксперты считают соглашение важным поворотным пунктом в политической системе Египта, и хотя также возникли опасения по поводу возможного демократического регресса из-за концентрации власти, правительство заявило о своей приверженности национальному единству и установлению стабильного политического порядка. Иностранная пресса отреагировала неоднозначно, как положительно, так и отрицательно, и внимательно следит за тем, какое влияние это окажет на внутреннюю и внешнюю ситуацию."
 EGY_news.2.a: "Начало африканской демократии?"

 EGY_news.3.t: "Антиколониальная декларация"
 EGY_news.3.desc: "Недавно правительство Египта официально объявило Антиколониальную декларацию, выражая твердую позицию против европейского колониального господства.\n\nПосле изгнания Британской империи в Канаду и обретения независимости Египтом и Британской Восточной Африкой, Египет стремился к тесному сотрудничеству с независимыми африканскими государствами. В то же время он открыто критиковал итальянское господство над Эфиопией и принимал антиколониальные повстанческие организации в Европе, усиливая свои действия антиколониального характера.\n\nПравительственные чиновники подчеркнули, что посредством этой декларации Египет намерен утвердить свою волю к международной солидарности против колониализма и внести вклад в построение нового международного порядка, основанного на автономии и равенстве."
 EGY_news.3.a: "Египет стремится стать лидером Африки."

 EGY_news.4.t: "Альянс на Ближнем Востоке"
 EGY_news.4.desc: "Согласно новостям из Каира, Королевство Египет усиливает свои дипломатические контакты с несколькими независимыми королевствами Аравийского полуострова и подписантами Саадабадского договора, на фоне быстро меняющейся международной обстановки. Правительственный чиновник заявил, что тесное сотрудничество с Аравией, Ираном и Турцией является важным шагом для защиты региональной автономии и расширения экономических обменов.\n\nЭто движение интерпретируется как часть тенденции, в которой независимые государства Ближнего Востока объединяются для обеспечения взаимной безопасности и политической независимости, в то время как соперничество между державами усиливается. Министерство иностранных дел Египта объявило, что в ближайшем будущем состоятся переговоры о пакте общей обороны и усилении экономического сотрудничества, что, как ожидается, окажет значительное влияние на региональный баланс."
 EGY_news.4.a: "Вчерашние враги — сегодняшние союзники."

 EGY_news.5.t: "Зеленые рубашки организованы в Египте"
 EGY_news.5.desc: "В политике Каира недавняя коалиция между Братьями-мусульманами и партией Молодой Египет оказывает большое влияние. Как часть этого сотрудничества, обе силы запустили молодежную организацию, вдохновленную итальянскими Черными рубашками, так называемые 'Зеленые рубашки'.\n\nОни жестоко сталкиваются с 'Голубыми рубашками' Вафда на улицах и в кампусах, повышая политическую напряженность. Зеленые рубашки провозглашают египетский империализм и исламский фундаментализм и открыто критикуют Вафд, партию большой коалиции с демократическим оттенком. Политические аналитики предупреждают, что это противостояние может усугубить нестабильность и привести к реконфигурации внутреннего политического порядка."
 EGY_news.5.a: "Какую форму примет их империализм?"

 EGY_news.6.t: "Воссоздание Похода на Рим"
 EGY_news.6.desc: "Политика Каира перевернулась. 'Зеленые рубашки', подталкиваемые коалицией партии Молодой Египет и Братьев-мусульман, вошли в королевский дворец и, де-факто, взяли под контроль политическую инициативу. Иностранные СМИ окрестили это событие 'Походом на Каир', говоря, что 'оно напоминает поход Муссолини на Рим'.\n\nКороль Фарук I принял их требования, чтобы избежать вооруженного столкновения, и в результате египетская политика быстро трансформируется в сторону системы фашистского толка. Эксперты оценивают, что Египет де-факто отказался от демократического порядка и вступил в новую форму государства с сильным авторитарным оттенком и исламским фундаментализмом, с серьезными последствиями, ожидаемыми для всего Ближнего Востока."
 EGY_news.6.a: "Родилась вторая компания Италии."

 EGY_news.7.t: "Провозглашение Египетской империи"
 EGY_news.7.desc: "Еще один поворотный момент открылся в египетской политике. Король Фарук I официально провозгласил 'Египетскую империю' и решил использовать титул императора. Этот выбор, отличный от традиционных титулов, таких как фараон, султан или хедив, вызывает немалую смуту внутри страны и за рубежом.\n\nАналитики отмечают, что в midst пересекающихся интересов различных сил Фарук I выбрал относительно 'нейтральный' титул 'императора' вместо того, чтобы подчеркивать традицию какой-либо конкретной группы. Это интерпретируется как попытка одновременно обеспечить исламскую легитимность и современную государственную власть, и ожидается, что это вызовет значительные изменения в египетской идентичности и внешних отношениях."
 EGY_news.7.a: "Империя? А не фараон?"

 EGY_news.8.t: "Государственный переворот в Египте"
 EGY_news.8.desc: "В Египте произошло событие огромной важности, потрясшее национальную политику. Король Фарук I, поддерживаемый армией, совершил государственный переворот и приостановил работу парламента. Затем он объявил о восстановлении Конституции 1930 года, де-факто объявив о возвращении абсолютной монархии.\n\nЭта мера означает провал ограниченной попытки демократического парламентаризма и интерпретируется как начало новой структуры власти, где сливаются армия и корона. Эксперты анализируют, что Фарук I выбрал силовой контроль над внутренней нестабильностью и социальными конфликтами, что, помимо усиления внутренних политических разногласий, может нанести серьезный удар по внешнему доверию."
 EGY_news.8.a: "Власть вернулась к королю."

 EGY_news.9.t: "Восстание Свободных офицеров"
 EGY_news.9.desc: "В Египте гражданская война между силами, верными королю, и революционерами из Свободных офицеров началась всерьез. Через несколько дней после того, как Свободные офицеры подняли оружие в знак протеста против провозглашения Фаруком I абсолютной монархии и восстановления Конституции 1930 года, обе стороны ведут ожесточенные бои вокруг Каира и ключевых военных точек.\n\nПо приказу короля многочисленные старшие офицеры и ключевые подразделения регулярной армии присоединились к верному лагерю; однако значительная часть младших офицеров и солдат, обремененных накопленной за годы обидой, присоединилась к революционным силам, и фронт быстро расширяется. Население, движимое неприятием неравенства и коррумпированной придворной политики, также демонстрирует поддержку революционерам, превращая конфликт из простой борьбы за власть в тотальное противостояние по поводу системы страны."
 EGY_news.9.a: "Республика в Египте?"

 EGY_south_africa.60.t: "Свобода Анголе"
 EGY_south_africa.60.d: "Освобожденные от ига колонизаторов-угнетателей, народ [ANG.GetName] готов взять на себя ответственность за свою собственную судьбу. Они создали временное правительство и подготовили проект конституции. Теперь осталось только передать власть от нашей военной администрации новому правительству [ANG.GetAdjective]."
 EGY_south_africa.60.a: "Новое государство должно направляться осторожно; иначе контрреволюция победит."
 EGY_south_africa.60.b: "Мы принимаем вас с распростертыми объятиями!"
 EGY_south_africa.60.c: "Пока еще невозможно это разрешить."

