 EGY_unhappy_parliament: "Недовольный парламент"
 EGY_unhappy_parliament_desc: "Хотя Конституция 1923 года была приостановлена год назад, египетский парламент все еще не ладит с королем. Теперь, когда Великобритания погрузилась в хаос и британское влияние в Египте ослабло, партия Вафд, имеющая большинство в парламенте, еще больше укрепляет свою решимость проводить реформы."
 EGY_Binah_problem: "Проблема 'Бины'"
 EGY_Binah_problem_desc: "'Бина' — это гигантская машина в форме змеи, которая в настоящее время постоянно осуществляет разрушительную деятельность на территории Египта. Пока не появится 'кто-то', способный полностью обезвредить Бину, противостояние между этим огромным разрушителем и египетской армией будет продолжаться без остановки.\n\nТекущее здоровье Бины: §Y[?var:EGY_Binah_health]§!"
 EGY_Binah_action_escalate: "Увеличение зоны активности Бины"
 EGY_Binah_action_destroy_infra: "Разрушительные злодеяния Бины"
 EGY_modernization_program: "Программа модернизации"
 EGY_modernization_program_desc: "После обретения независимости от Великобритании из-за внезапного появления наций из другого мира, наша страна нуждается в ускоренной модернизации. Путем реформ во всех сферах — промышленности, образовании, армии и других — мы должны укрепить нашу позицию в новом мировом порядке."
 EGY_nile_dams: "Строительство плотин на Ниле"
 EGY_nile_dams_desc: "Нил — наша жизненная артерия. Если мы внедрим передовые технологии того другого мира и построим плотины, мы сможем повысить продуктивность сельского хозяйства и стабильно снабжать электричеством."
 EGY_egyptian_oil: "Совместная разработка египетской нефти"
 EGY_egyptian_oil_desc: "Теперь, когда мы освободились от вмешательства западных держав, мы можем приступить к разработке собственной нефти. Путем технологического сотрудничества с нациями из другого мира мы будем эффективно разрабатывать наши нефтяные ресурсы."
 EGY_industrialization: "План индустриализации"
 EGY_industrialization_desc: "Освободившись от британского господства, наша страна имеет слабую собственную промышленную базу. Мы должны установить независимый план индустриализации, взяв за образец модели индустриализации наций из другого мира."
 EGY_textile_expansion: "Расширение текстильной промышленности"
 EGY_textile_expansion_desc: "Качество египетского хлопка известно во всем мире. Теперь мы должны перестать быть простым экспортером сырья и возродиться как страна, производящая текстиль с высокой добавленной стоимостью."
 EGY_mechanise_cotton: "Механизация хлопковой промышленности"
 EGY_mechanise_cotton_desc: "Используем передовые сельскохозяйственные технологии, пришедшие из другого мира, для механизации выращивания и переработки хлопка. С их помощью мы сможем значительно повысить производительность."
 EGY_state_enterprises: "Основание государственных предприятий"
 EGY_state_enterprises_desc: "Чтобы конкурировать в новом мировом порядке, мы должны основать государственные предприятия в стратегически важных промышленных секторах. С их помощью мы сможем укрепить основы экономического развития."
 EGY_red_sea_trade: "Активизировать торговлю в Красном море"
 EGY_red_sea_trade_desc: "Теперь, когда значение Суэцкого канала еще больше возросло, мы должны активизировать торговлю через Красное море, чтобы превратить нашу страну в центр обмена между Востоком и Западом. Также стоит рассмотреть открытие новых торговых путей с нациями из другого мира."
 EGY_railroad_expansion: "Расширение железнодорожной сети"
 EGY_railroad_expansion_desc: "С помощью технологий другого мира построим национальную железнодорожную сеть. Это в значительной степени поспособствует промышленному развитию и интеграции страны."
 EGY_egyptian_steel: "Строительство египетского сталелитейного завода"
 EGY_egyptian_steel_desc: "Для автономной индустриализации сталелитейная промышленность необходима. Построим современный сталелитейный завод, используя технологии другого мира, и укрепим нашу промышленную базу."
 EGY_domestic_arms: "Разработка отечественного оружия"
 EGY_domestic_arms_desc: "Мы должны исследовать и перенять передовые технологии оружия из другого мира, чтобы разработать собственное отечественное оружие. Это поможет как укрепить оборону, так и стимулировать оружейную промышленность."
 EGY_dockyards_of_alexandria: "Верфи Александрии"
 EGY_dockyards_of_alexandria_desc: "Построим современные верфи в Александрии, важном порту с древних времен. Используя технологии другого мира, мы должны заложить основы для строительства собственного флота."
 EGY_german_weapons: "Принять немецкое оружие"
 EGY_german_weapons_desc: "Воспользуемся хаотической ситуацией в Европе, вызванной появлением наций из другого мира, и импортируем новейшее оружие из Германии. С его помощью мы сможем ускорить модернизацию нашей армии."
 EGY_unify_electrical_standards: "Программа стандартизации электричества"
 EGY_unify_electrical_standards_desc: "С проникновением различных электрических технологий из другого мира путаница усиливается. Мы должны унифицировать электрические стандарты на национальном уровне, чтобы повысить промышленную эффективность и ускорить модернизацию."
 EGY_egyptian_cinema: "Развитие египетской киноиндустрии"
 EGY_egyptian_cinema_desc: "Разовьем киноиндустрию, чтобы расширить наше культурное влияние. Мы сможем создать уникальную египетскую кинокультуру, включив различные культуры и технологии из другого мира."
 EGY_egyptian_radio: "Основание египетской радиовещательной станции"
 EGY_egyptian_radio_desc: "Построим национальную радиовещательную сеть для использования в единении народа и распространении информации. Внедряя технологии радиовещания из другого мира, мы сможем создать еще более эффективную систему связи."
 EGY_blue_nile_dams: "Строительство плотин на Голубом Ниле"
 EGY_blue_nile_dams_desc: "В сотрудничестве с Суданом построим большую плотину на Голубом Ниле. Этот проект, опирающийся на технологии другого мира, будет большим подспорьем для выработки электроэнергии и ирригации."
 EGY_synthetic_resources: "Разработка синтетических ресурсов"
 EGY_synthetic_resources_desc: "Используем передовые химические технологии, пришедшие из другого мира, для строительства производственных мощностей синтетических ресурсов. С их помощью мы сможем решить проблему нехватки ресурсов и повысить промышленную конкурентоспособность."
 EGY_modernise_sudan: "Городская модернизация"
 EGY_modernise_sudan_desc: "Модернизация регионов, входящих в состав Египта, необходима для национального развития. Используем технологии для улучшения инфраструктуры и содействия индустриализации."
 EGY_expand_railroads: "Южное расширение железнодорожной сети"
 EGY_expand_railroads_desc: "Продлим железнодорожную сеть до юга Судана, чтобы укрепить национальную интеграцию и облегчить освоение ресурсов. Внедряя передовые железнодорожные технологии другого мира, мы сможем построить эффективную транспортную систему."
 EGY_invest_in_homeground: "Инвестировать в метрополию"
 EGY_invest_in_homeground_desc: "Осуществим массированные инвестиции в промышленность и инфраструктуру египетской территории. Чтобы не отставать в конкуренции с нациями из другого мира, мы должны еще больше укрепить наши основы."
 EGY_airports_for_sudan: "Строительство аэропортов"
 EGY_airports_for_sudan_desc: "Построим современные аэропорты в египетских регионах для улучшения транспорта и логистики. Внедряя авиационные технологии другого мира, мы сможем создать эффективную и безопасную систему аэропортов."
 EGY_resources_of_the_south: "Освоение ресурсов"
 EGY_resources_of_the_south_desc: "Разовьем обильные ресурсы египетских регионов. Если мы используем передовые технологии добычи из другого мира, станет возможным более эффективное и экологичное освоение ресурсов."
 EGY_new_universities: "Новые университеты"
 EGY_new_universities_desc: "Учредим новые университеты для приобретения и исследования разнообразных знаний и технологий из другого мира. С их помощью мы сможем ускорить научно-техническое развитие нашей страны и подготовку кадров."
 EGY_egyptian_airports: "Расширение египетских аэропортов"
 EGY_egyptian_airports_desc: "В связи с увеличением обмена с другим миром, построим и расширим современные аэропорты по всей стране. Это в огромной степени поможет развитию туризма и стимулированию международной торговли."
 EGY_new_economy: "Новая экономическая система"
 EGY_new_economy_desc: "В конкуренции и сотрудничестве с нациями из другого мира мы должны построить собственную уникальную экономическую систему. Создадим новую экономическую модель, охватывающую традицию и современность, Восток и Запад, реальность и другой мир."
 EGY_black_monday_recovery: "Преодолеть экономический кризис"
 EGY_black_monday_recovery_desc: "Мы должны преодолеть мировой экономический кризис, вызванный появлением наций из другого мира. Воспользуемся нашей уникальной ситуацией, чтобы найти возможности для восстановления и открыть новые двигатели роста."
 EGY_secure_cotton_fields: "Обеспечить хлопковые районы"
 EGY_secure_cotton_fields_desc: "Мы должны защитить и развивать хлопковую промышленность, становой хребет египетской экономики. Внедрим сельскохозяйственные технологии другого мира и сосредоточимся на повышении производительности и качества выращивания."
 EGY_cotton_subsidies: "Субсидии хлопковой промышленности"
 EGY_cotton_subsidies_desc: "Предоставим субсидии хлопкоробам и смежным отраслям для укрепления их конкурентоспособности. Чтобы выжить в конкуренции с нациями из другого мира, требуется активная поддержка правительства."
 EGY_secure_holdings: "Защита активов"
 EGY_secure_holdings_desc: "В запутанной международной ситуации, вызванной появлением наций из другого мира, мы должны защитить и стабилизировать наши активы за рубежом. Наряду с дипломатическими усилиями, если необходимо, также следует рассмотреть военную оборону."
 EGY_protect_industry: "Защита промышленности"
 EGY_protect_industry_desc: "Мы должны защитить нашу зарождающуюся промышленность от передовых технологий и продуктов из другого мира. Путем соответствующей тарифной политики и промышленной поддержки повысим конкурентоспособность отечественной промышленности."
 EGY_reopen_stock_exchange: "Открыть фондовую биржу"
 EGY_reopen_stock_exchange_desc: "Вновь откроем фондовую биржу, которая была закрыта из-за экономического кризиса. Правильно управляя притоком капитала из другого мира, мы сможем вернуть жизнеспособность нашей экономике."
 EGY_farouks_reforms: "Реформы Фарука"
 EGY_farouks_reforms_desc: "Внедрим реформы под руководством молодого короля Фарука. Нам нужны сбалансированные реформы: активно принимая пришедшее из другого мира, но сохраняя египетские традиции."
 EGY_administrative_reforms: "Административная реформа"
 EGY_administrative_reforms_desc: "Ликвидируем пережитки британского колониального правления и, взяв за образец передовые административные системы другого мира, построим нашу собственную эффективную административную систему."
 EGY_judical_reforms: "Судебная реформа"
 EGY_judical_reforms_desc: "Создадим новую судебную систему, гармонично объединяющую исламское право, современное право и правовые системы другого мира. С ее помощью мы сможем реализовать более справедливое и эффективное правовое государство."
 EGY_bureaucracy_reforms: "Реформа бюрократии"
 EGY_bureaucracy_reforms_desc: "Реформируем неэффективную бюрократическую систему старого порядка и внедрим передовые методы управления из другого мира для создания современной и прозрачной бюрократической системы."
 EGY_islams_status: "Подтвердить статус ислама"
 EGY_islams_status_desc: "Мы должны переопределить религиозную идентичность, теперь нарушенную проникновением элементов из другого мира. Сохраняя исламскую традицию, требуется гибкая интерпретация и применение, соответствующие новой эре."
 EGY_education_reform: "Образовательная реформа"
 EGY_education_reform_desc: "Изучим различные образовательные системы другого мира и создадим новую образовательную систему, гармонично сливающуюся с нашим традиционным образованием. С ее помощью мы сможем подготовить таланты, которые поведут Египет будущего."
 EGY_finish_reforms: "Завершить реформы"
 EGY_finish_reforms_desc: "Проверим достижения реформ на данный момент, исправим недостатки и завершим реформы. Теперь Египет возродится как современное государство, способное стоять плечом к плечу с нациями из другого мира."
 EGY_Third_Arab_Congress: "Третий Арабский конгресс"
 EGY_Third_Arab_Congress_desc: "В ситуации на Ближнем Востоке, преобразованной появлением наций из другого мира, единство арабских стран важнее, чем когда-либо. Проведем Третий Арабский конгресс и найдем новые пути сотрудничества."
 EGY_Radio_Free_Cairo: "Радио Свободный Каир"
 EGY_Radio_Free_Cairo_desc: "Создадим радиостанцию, ориентированную на весь арабский мир. Используя технологии радиовещания из другого мира, мы сможем распространять наш голос по всему Ближнему Востоку и пропагандировать идеал арабского единства."
 EGY_Coordinate_Al_Fatat: "Сотрудничество с Аль-Фатат"
 EGY_Coordinate_Al_Fatat_desc: "Будем сотрудничать с Аль-Фатат, националистической панарабской организацией, чтобы усилить движение за арабское единство. Перед лицом угрозы со стороны наций из другого мира арабское единство стало еще важнее."
 EGY_Coordinate_Al_Ahd: "Сотрудничество с Аль-Ахд"
 EGY_Coordinate_Al_Ahd_desc: "Построим отношения сотрудничества с Аль-Ахд, националистическим тайным обществом в Ираке. С их помощью мы сможем расширить наше влияние в Месопотамии и укрепить основы арабского единства."
 EGY_Society_Defence_Palestine: "Общество защиты Палестины"
 EGY_Society_Defence_Palestine_desc: "Чтобы противостоять палестинскому вопросу, теперь еще более сложному из-за появления наций из другого мира, организуем общество защиты. С его помощью мы сможем защитить арабов Палестины и расширить наше влияние."
 EGY_Support_the_Imamate: "Поддержать Имамат Йемена"
 EGY_Support_the_Imamate_desc: "Поддержим Имамат Йемена на юге Аравийского полуострова, чтобы расширить наше влияние в регионе. Это поможет защитить арабскую независимость от вмешательства наций из другого мира."
 EGY_Liberate_Tripolitania: "Освободить Триполитанию"
 EGY_Liberate_Tripolitania_desc: "Освободим регион Триполитании в Ливии, находящийся под властью Италии. Это хорошая возможность расширить наше влияние в Северной Африке, воспользовавшись хаосом, вызванным нациями из другого мира."
 EGY_Support_Maghrebi_Rebels: "Поддержать магрибских повстанцев"
 EGY_Support_Maghrebi_Rebels_desc: "Поддержим магрибских повстанцев, борющихся за независимость от французской Северной Африки. Это возможность положить конец французскому колониальному господству, ослабленному появлением наций из другого мира."
 EGY_Expand_Alexandria: "Расширить Александрию"
 EGY_Expand_Alexandria_desc: "Расширим и модернизируем Александрию, наш главный портовый город. Внедряя передовые портовые технологии из другого мира, мы сможем развить ее как центр средиземноморской торговли."
 EGY_Coordinate_Peninsula: "Сотрудничество на Аравийском полуострове"
 EGY_Coordinate_Peninsula_desc: "Установим отношения сотрудничества со странами Аравийского полуострова, включая Саудовскую Аравию. Мы сможем совместно противостоять угрозе со стороны наций из другого мира и усилить арабское единство."
 EGY_Bureau_Military_Engineering: "Основать Бюро военной инженерии"
 EGY_Bureau_Military_Engineering_desc: "Оснуем Бюро военной инженерии для исследования и разработки передовых военных технологий из другого мира. С его помощью мы сможем модернизировать наши вооруженные силы и достичь технологической самодостаточности."
 EGY_Operation_Abu: "Операция 'Абу'"
 EGY_Operation_Abu_desc: "Проведем секретную операцию по расширению нашего влияния в палестинском регионе. Перед лицом вмешательства наций из другого мира мы сможем защитить арабские интересы и усилить нашу позицию в регионе."
 EGY_Victory_Levant: "Победа в Леванте"
 EGY_Victory_Levant_desc: "Нам удалось укрепить наше влияние в регионе Леванта. Теперь самое время использовать этот регион как трамплин и двигаться к мечте о большем арабском единстве."

