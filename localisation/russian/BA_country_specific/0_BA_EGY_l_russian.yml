 EGY_guide: "Цели\n\n£white_dot Добиться независимости от Британской империи.\n£white_dot Стабилизировать политический хаос и определить курс правительства.\n\n£white_dot §YПривести партию Вафд и демократию к победе§!\n      - Союз со странами Ближнего Востока и освобождение Африки под флагом антиколониализма.\n или...\n£white_dot §YВести нацию в соответствии с исламским законом и, в союзе с Италией, устранить коррумпированные и слабые остатки старого порядка.§!\n      - Провозгласить Египетскую империю и вернуть славу Египта.\n или...\n£white_dot §YУкрепить власть вооруженных сил, распустить парламент и совершить государственный переворот.§!\n      - Присягнуть на верность королевскому дому и провозгласить Египетскую империю.\n     или...\n      - Свергнуть коррумпированную монархию и двигаться к объединению арабского мира.\n\n\n§CРазработка - Mako, mintcoon§!"
 EGY_country_intro_header: "Колыбель древней цивилизации, великолепной и процветающей"
 EGY_country_intro_header_1: "Иностранное господство и 1800 лет тьмы"
 EGY_country_intro_header_2: "Земля, где восходит новое солнце"
 EGY_country_intro_content: "Цивилизация Древнего Египта началась около 3100 г. до н.э., когда Верхний и Нижний Египет были впервые объединены, и с тех пор были заложены основы великолепной культуры, искусства и науки, которые навсегда останутся в истории человечества. Под руководством легендарного царя Нармера (Менеса) оба региона слились воедино, и была установлена централизованная государственная система; вокруг реки Нил было достигнуто гармоничное развитие сельского хозяйства, религии и политики. Во времена Древнего царства осуществлялись крупные архитектурные проекты, такие как строительство пирамид, максимизируя власть государства и его технические возможности, и это закрепилось как вечные памятники, переданные потомкам. Сложная административная система и религиозные ритуалы того времени принесли стабильность и процветание всему обществу, заложив основы для расцвета древних египтян, цивилизации, основанной на глубоком благоговении перед природой и богами.\nВ Среднем царстве политические и административные реформы вместе с политикой региональной интеграции успешно проводились; Египет преодолел внутренние и внешние кризисы и получил возможность возрождения в культуре и искусстве в целом. В этот период появились выдающиеся достижения в литературе, искусстве и архитектуре, еще больше повысив престиж страны, и во всех социальных слоях развитие продвигалось путем эффективного распределения ресурсов и административных реформ. С наступлением Нового царства сильная центральная власть сочеталась с большой военной мощью, и Египет, побеждая в войнах с соседними государствами, установил свое международное положение. Во времена правления великих фараонов, таких как Рамсес II, территориальная экспансия, экономическое процветание и культурные достижения достигли своего пика; опираясь на накопленные знания и технологии, Египет позиционировал себя как культурный центр, оказавший большое влияние на мировые цивилизации. Религиозные ритуалы, искусство и архитектура того времени ценились как образцовые достижения для потомков, и то, как вся страна функционировала как единая органическая система, стало живым свидетельством позитивного исторического развития.\nНачиная с завоевания Александра Македонского в 332 г. до н.э., Египет испытал влияние греческой культуры, а затем была установлена династия Птолемеев, вступив в новую эру, в которой эллинизм и египетская традиция слились. Династия Птолемеев с центром в Александрии пережила большое развитие знаний, искусства и торговли, и с введением греческих стилей политика, общество и культура в целом претерпели значительные изменения. В этот период, хотя собственные традиционные ценности и обычаи Египта частично трансформировались, появилась сложная конфигурация, в которой обе культуры взаимно дополняли друг друга. Тем не менее, при Птолемеях, по мере увеличения внутренних и внешних политических конфликтов и вмешательства иностранных держав, также наблюдалось постепенное ослабление автономии по сравнению с предыдущими эпохами. Эти изменения оценивались как нейтральное отражение реальности: с одной стороны, они предлагали возможность нового культурного скачка как продолжения позитивного развития, а с другой, подразумевали определенное размывание существующих традиций.\nЦивилизация Древнего Египта, от начала своего объединения, через Древнее, Среднее и Новое царства, наслаждалась золотым веком и оказала огромное влияние на человеческую культуру; а эллинистический переход династии Птолемеев стал важным поворотным моментом в истории Египта. Так, Древний Египет после своего первого объединения достиг в течение долгого времени стабильного развития и великих культурных достижений, а затем, даже в midst культурного слияния с иностранными державами, показал историческую грань, в которой сосуществовали усилия по сохранению тысячелетней традиции и инновации."
 EGY_country_intro_content_1: "Под владычеством Римской империи Египет, хотя изначально обладал богатыми зерновыми землями и большим экономическим потенциалом, постепенно вошел в эпоху застоя и страданий из-за римской колониальной политики и чрезмерного налогообложения. Из-за безжалостного контроля римской административной системы и эксплуатации ресурсов, экономическая независимость и культурная автономия Египта были сильно ограничены, и многие крепостные и крестьяне испытывали крайние страдания, теряя основы жизни. Рим рассматривал Египет как стратегический анклав и применял жесткий военный и административный контроль; в этом процессе традиционные ценности и социальная организация Египта были серьезно повреждены. В этих обстоятельствах Египет потерял свой суверенитет, и из-за грабительских налогов Рима и частых реквизиций все общество погрузилось в хаос.\nДаже в период Византийской империи Египет не мог избежать экономического упадка, вызванного иностранным вмешательством и внутренними раздорами. Военные угрозы, частые восстания и неэффективное управление поддерживали общество в состоянии длительной нестабильности, и традиционная египетская культура и искусство постепенно отступали. Под давлением римской и византийской систем Египет на долгое время деградировал до темных веков, когда у него не осталось иного выбора, кроме как сосредоточиться на отчаянной борьбе за выживание, а не на культурном развитии. Во всех социальных слоях преобладали неравенство и несправедливое обращение, и жизнь народа проходила в midst крайних страданий и безнадежности, в то время как древняя слава Египта постепенно забывалась.\nДо арабского завоевания Египет, как уже описывалось, сохранял общее состояние застоя из-за иностранной эксплуатации, внутренних конфликтов и неадекватности административной системы, утверждая мрачную реальность во всем обществе и экономике. Принудительное внешнее господство, чрезмерные налоги и военное бремя причинили египтянам крайние страдания и недовольство, и в результате египетское общество постепенно теряло свою жизнеспособность. Эти темные века длились до того, как Османская империя ступила в регион, показывая, как традиционные египетские ценности и культура были серьезно ослаблены среди внутренних конфликтов и внешнего давления. В целом, можно оценить, что Египет в то время потерял свою экономическую и политическую автономию и надолго впал в ярмо страданий и застоя."
 EGY_country_intro_content_2: "Когда Мухаммед Али стал губернатором Египта в начале XIX века, Египет, находившийся под косвенным господством Османской империи, начал полноценно переходить на путь модернизации. Мухаммед Али провел смелые реформы — военную реформу, реорганизацию административной системы, реформы в экономике, образовании и промышленности, — вдохнув новую жизнь в египетское общество. В то время он активно перенимал западные технологии и системы и сосредоточился на трансформации традиционной египетской структуры в современное государство; в результате были достигнуты заметные успехи в военной мощи и экономических возможностях. Во всех социальных слоях эти реформы постепенно приносили стабильность, и по всей стране внедрялись элементы современности и расширялась инфраструктура.\nС конца XIX до начала XX века Египет демонстрировал энергичное развитие националистического движения даже под империалистическим давлением европейских держав. В 1919 году вспыхнула великая революция за независимость, и это восстание стало событием, в котором египетский народ активно выразил свое стремление вернуть суверенитет и политическую независимость. В этот период египтяне развернули различные движения за независимость и политические попытки против британского колониального господства, и эти усилия начали получать позитивную оценку также и в международном сообществе. Для активистов независимости большое значение имело стремление возродить национальные традиции и культуру и заложить основы самодостаточности как современного государства.\nПосле Мухаммеда Али Египет, постепенно консолидируя современную администрацию и промышленную базу, продолжал прилагать усилия для восстановления собственной идентичности даже в midst иностранного вмешательства. Западные системы и технологии внедрялись в политической, экономической и культурной сферах, и эти изменения сыграли важную роль в утверждении Египта как современного государства. В частности, различные социальные движения и политические попытки, направленные на независимость, положительно повлияли на восстановление египетского суверенитета, повысили национальную гордость и стали детонатором, толкающим к изменениям, ориентированным на будущее. В то время египетское общество, в сложной конфигурации, где сосуществовали традиция и современность, показало, как, не сгибаясь перед внешним давлением, оно предпринимало непрестанные усилия ради независимости и постепенно расширяло свою автономию.\nОднако усилия Египта вступили в новую фазу из-за удара Великого Перемещения, произошедшего в ноябре 1935 года. Британская империя потеряла половину своей метрополии из-за вторжения существ из другого мира, и независимость Египта стала близка; но монстр, появившийся в пустыне вместе с Великим Перемещением, 'Бина', пожирает способность государства. Пока не появится 'спаситель', который займется ими, это будет болью и испытанием, которое Египет должен вынести."

