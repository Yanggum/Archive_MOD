 EGY_event.1.t: "Изгнание Контрмерного комитета Абидоса"
 EGY_event.1.d: "Абидос пал и оказался в руках врага. Они объявили Контрмерный комитет беглецами и провозгласили, что принесут конец судьбе Абидоса. Сопротивление преподавателей Абидоса закончилось после нескольких дней боев, и покинуть свою любимую родину стало неоспоримой реальностью.\n\nДесять тысяч абидосцев и тысяча местных жителей. Группа, принявшая иное решение, чем большинство, оставшееся на своей земле, отправилась в путь без определенной цели. Они пересекли Дунай, прошли через Босфор. За пустыней, без конца в поле зрения.\n\nВ эпоху, когда все боролись за выживание, было логично думать, что никто их не примет. И, кроме того, как они могли выжить без мистики? Это была общая проблема, и многие считали это предрешенным: что они испустят последний вздох.\n\nТе, кто обладал мистикой, не имели времени плакать. Они не умрут от пары пуль, но даже сильные девушки ничего не могли поделать с болезнью и голодом. Одна за другой девушки падали; и они продолжали идти по побережью, оставляя позади умирающих. Они искали лишь маленькое убежище или надеялись продержаться, пока всех не призовет судьба небес....\n\nИ тогда была Египет.\n\nОни верили, что с падением Британии, державшей их в цепях, они наконец-то насладятся истинной свободой. Но только когда зверь из глубин Сахары двинулся и бросил десятки тысяч в смерть, они поняли, что свобода имеет свою цену. Они почувствовали бессилие перед монстром, которому не вредили ни пули, ни снаряды; они просили помощи у академий Кивотоса, опустошивших Европу. Ответа не было.\n\nКогда всех, независимо от левых или правых, охватила безнадежность, группа под названием Абидос постучалась в границу Синая. У них были ореолы. У них была мистика. Они были способны победить зверя, угрожавшего пронзить тысячи лет истории. Хотя их осталось всего около трехсот, они, несомненно, были лучом надежды.\n\nЕгипет принял их с распростертыми объятиями, и"
 EGY_event.1.a: "Абидос наконец нашел убежище."

 EGY_event.2.t: "Губернатор Судана"
 EGY_event.2.d: "\"Ваше Величество, что это значит? Что я должен вернуться...?\"\n\n'Сэр Стюарт' Симс побледнел. Ему удалось получить билет на самолет после получения срочного уведомления явиться в королевский дворец в Каире... и все же новость, которую ему сообщили, была такова.\n\n\"Разве вы не знаете, сколько я сделал в Судане? Прошло всего два года! Еще осталось бесчисленное количество незавершенных политик; это не может так закончиться!\"\n\n\"Мне жаль, но я не могу удовлетворить эту просьбу. Похоже, Букингем больше не желает, чтобы вы оставались губернатором Судана. Как я могу ослушаться этого приказа? Вы, верный подданный Его Величества, знаете это лучше меня.\"\n\n\"Тогда почему кабинет привез меня из Танганьики? Они все еще нуждаются во мне.\"\n\n\"Повторяю тебе: у меня нет полномочий отменять приказ Букингема. Возвращайся в Англию и говори там, если хочешь.\"\n\nКакой пустой момент после стольких лет. Когда он вступал в должность губернатора Судана, он поклялся, что, повинуясь воле Его Величества, будет проводить политику в их пользу. Но если даже экономический план рассчитан на пять лет, двух лет слишком мало.\n\nИ что он мог сделать? Кабинет просто махал ему рукой, чтобы он возвращался, потому что нашел кого-то «лучше».\n\n\"......Я вернусь в Канаду. Я окажусь загнанным в угол где-нибудь в Оттаве и пойму, что в политике нет места для меня.\"\n\nПотому что эти типы, которые всегда смотрят только на Европу, никогда не будут беспокоиться об Африке.\n\nКороль просто посмотрел на него и произнес прощальные слова."
 EGY_event.2.a: "\"Всего доброго. Ты много работал.\""

 EGY_event.3.t: "Смерть Фуада I"
 EGY_event.3.d: "Фуад I умирает, восходит Фарук I."
 EGY_event.3.a: "Да здравствует Фарук I!"

 EGY_event.4.t: "Абидос"
 EGY_event.4.d: "\"Сверху решено принять условия для допуска их изгнания. Взамен от них требуется сотрудничать в поражении зверя 'Бины'.\"\n\"Согласна. Контрмерный комитет готов немедленно развернуться, но тем временем подготовьте место, где остальные смогут восстановиться.\"\n\nПосле перечисления условий с одной и другой стороны, чиновник и Контрмерный комитет продолжили разговор.\n\n\"Поселение будет определено в центре Каира.\"\n\"…Если возможно, сделайте это в маленьком городе. Мы, из Кивотоса, отличаемся от местных; жить в большом городе будет трудно. Мы хотим поселиться в маленьком городе.\"\n\nНа это чиновник просмотрел документы. Первоначальный план состоял в том, чтобы разместить их в анклаве внутри Каира, но это не было большой проблемой. Название места, откуда они пришли, было... ах... Абидос. Да. Если это был Абидос...\n\n\"Кхм... минутку. Есть маленький город под названием 'Абидос', с тем же названием, что и место, откуда они родом. Как вы на это смотрите?\"\n\"Абидос…\"\n\nАбидос: первая столица в истории Египта. Но сегодня это не более чем археологический памятник и маленький город без особого значения. Если их поселить там, будет ли это выгодой или потерей? Чиновник решил, что это не его дело.\n\n\"Хорошо. Тогда будем считать все условия согласованными.\""
 EGY_event.4.a: "\"Хорошо. Итак, куда нам нужно идти?\""

 EGY_event.5.t: "Хор рассвета"
 EGY_event.5.d: "В предрассветных сумерках, в Эль-Файюме — месте, которое указал ему один житель, — солдат остался один. Все товарищи из батальона уже исчезли, и как раз когда зверь собирался выстрелить лучом из пасти, его тело достигло предела, и ему не оставалось ничего, кроме как рухнуть. Когда тень отчаяния охватывала его сердце, он увидел девушку, появившуюся в небе, как метеор, рассекающий небосвод. Девушка бросилась с достоинством небесного посланника. Ее глаза горели, как пламя, и когда она ударила зверя тем, что держала в руке, монстр — не дрожавший, сколько бы его ни атаковали — сильно содрогнулся. Он онемел.\n\nЭтот чудесный поворот перед его глазами вызывал, как отражение, сияние древнего бога Хора. Один, со всеми исчезнувшими товарищами, он почувствовал смесь восхищения и страха перед храбростью и силой той девушки. Воспользовавшись мгновением, когда Бина направила свой взгляд на нее, он развернулся и бежал. Пока он убегал, образ девушки четко запечатлелся в каком-то уголке его разума, как таинственная и сияющая форма Хора, оставляя неизгладимое впечатление. "
 EGY_event.5.a: "И так началось прозвище 'Хор рассвета'."

 EGY_event.6.t: "Церемония выпуска в военной академии 1939 года"
 EGY_event.6.d: "В 1939 году, через три года после Великого Катаклизма, церемония выпуска в военной академии Египта прошла по обычной процедуре, несмотря на последствия катастрофы. В зале курсанты в безупречной парадной форме спускались по лестнице по очереди, и состоялось вручение дипломов вместе с официальным протоколом. Представитель выпускников, Гамаль Абдель Насер, произнес краткую речь перед товарищами; выпускники вскоре отправятся в Судан, чтобы начать службу в качестве офицеров."
 EGY_event.6.a: "Добро пожаловать!"

