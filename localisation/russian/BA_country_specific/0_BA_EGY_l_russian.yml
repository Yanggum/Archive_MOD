 EGY_idea_pella_mobilization_2: "Декрет о мобилизации феллахов"
 EGY_idea_puppet_council: "Марионеточный парламент"

 EGY_industrial_modernization_idea: "План промышленной модернизации"
 EGY_industrial_modernization_idea_desc: "Наш план промышленной модернизации, сочетающий мастерство Древнего Египта с передовыми технологиями другого мира, будет продвигаться без остановки, как течение Нила."

 EGY_camel_corps_idea: "Верблюжий корпус Сета"
 EGY_camel_corps_idea_desc: "Названный в честь Сета, бога пустыни, наш верблюжий корпус пересекает пески, оснащенный материалом, усиленным технологиями другого мира, становясь объектом ужаса для врагов."

 EGY_shendi_cavalry_idea: "Кавалерия Шенди Хора"
 EGY_shendi_cavalry_idea_desc: "Как крылья Хора, бога неба, наша кавалерия — сформированная из знаменитых лошадей Шенди, быстрых и выносливых — играет ключевую роль в отражении вражеских атак."

 EGY_military_schools: "Военные школы Тота"
 EGY_military_schools_desc: "Наши военные школы, носящие имя Тота, бога мудрости, обучают в гармонии стратегии Древнего Египта и современной тактике другого мира, готовя лучших офицеров."

 EGY_desert_training_idea: "Подготовка в пустыне Амона"
 EGY_desert_training_idea_desc: "Под благословением Амона, хранителя пустыни, наши солдаты изучают выживание и боевые техники в безжалостных условиях. В сочетании с методами выживания из другого мира, эта подготовка превращает нашу армию в призраков пустыни."

 EGY_royal_gendarmerie: "Королевская полиция Маат"
 EGY_royal_gendarmerie_desc: "Названная в честь Маат, богини справедливости и порядка, наша Королевская полиция защищает внутренний мир и стабильность, сочетая передовые следственные техники из другого мира с древнеегипетским понятием справедливости."

 EGY_merchant_marine_idea: "Вооруженный торговый флот Ра"
 EGY_merchant_marine_idea_desc: "Благословленные Ра, богом солнца, наши вооруженные торговые суда принимают системы движения из другого мира и бороздят моря с удивительной скоростью. В мире торгуют, в войне поддерживают флот: выполняют жизненно важную функцию."

 ### 해군 MIO ###
 suez_canal_company: "Компания Суэцкого канала"
 suez_canal_company_desc: "Эта организация, управляющая Суэцким каналом — воротами, соединяющими мир и другой мир, — теперь также прилагает усилия к разработке боевых кораблей с передовыми технологиями. Рожденные от союза мудрости Древнего Египта и технологий другого мира, эти суда станут ужасом для наших врагов."

 alexandria_shipyard: "Александрийская верфь"
 alexandria_shipyard_desc: "Верфь этого города, носящего имя Александра Македонского, теперь включает технологии другого мира для производства новейших эскортных кораблей. Элегантность Клеопатры и сила современных технологий сливаются в этих судах, которые примут на себя морскую оборону."

 ### 항공기 MIO ###
 egypt_air: "Авиация Египта"
 egypt_air_desc: "Легкие самолеты Авиации Египта, словно с крыльями Хора, принимают техники полета из другого мира и обладают удивительной маневренностью. Они плавны, как течение Нила, и быстры, как ветер пустыни."

 sudan_airways: "Авиалинии Судана"
 sudan_airways_desc: "Унаследовав силу черных фараонов Нубии, средние самолеты Авиалиний Судана применяют технологию двигателей из другого мира и демонстрируют удивительную производительность. Их мощное присутствие ощущается при пересечении Сахары."

 ### 물자 MIO ###
 shoubra_engineering: "Инженерия Шубры"
 shoubra_engineering_desc: "Расположенная в Шубре, сердце Каира, эта компания производит лучшее пехотное снаряжение, сочетая мастерство Древнего Египта с передовыми технологиями другого мира. Ее оружие сияет и мощно, как свет Ра."

 egyptian_engineering: "Египетская инженерия"
 egyptian_engineering_desc: "Сочетая мудрость наших предков, построивших пирамиды, с артиллерийскими технологиями другого мира, это предприятие разрабатывает артиллерийские орудия удивительной производительности. Их пушки разрушительны, словно содержат гнев Сета."

