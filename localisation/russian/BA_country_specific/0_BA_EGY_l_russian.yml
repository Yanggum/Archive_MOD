 EGY_idea_exiled_kings: "Изгнанный египетский королевский дом"
 # Военные - Армия
 EGY_army_reforms: "Реформа армии"
 EGY_army_reforms_desc: "В midst хаоса, вызванного измеренческим перемещением, Египет обрел независимость. Чтобы противостоять новым угрозам, мы должны укрепить нашу военную мощь. Реформа армии — наша первейшая задача."

 EGY_mobile_warfare: "Мобильная война"
 EGY_mobile_warfare_desc: "Мы должны изучить передовую тактику другого мира и разработать доктрину мобильной войны, используя бескрайние просторы пустыни."

 EGY_shendi_horses: "Кавалерия Шенди"
 EGY_shendi_horses_desc: "Кавалерия, использующая знаменитых лошадей региона Шенди, значительно повысит мобильность нашей армии."

 EGY_royal_camel_corps: "Королевский верблюжий корпус"
 EGY_royal_camel_corps_desc: "Верблюжьи подразделения, пересекающие пустыню, станут символом нашей армии. Оснуем Королевский верблюжий корпус, еще более усиленный технологиями другого мира."

 EGY_motorized_efforts: "Усилия по моторизации"
 EGY_motorized_efforts_desc: "Мы должны модернизировать нашу армию, внедряя передовые автомобильные технологии из другого мира."

 EGY_desert_mobility: "Как ветер пустыни"
 EGY_desert_mobility_desc: "Сокрушите врага мобильностью, быстрой и непредсказуемой, как ветер пустыни."

 # Военные - Флот
 EGY_naval_reforms: "Реформа флота"
 EGY_naval_reforms_desc: "Мощный флот, охватывающий Средиземное и Красное моря, станет ключом к защите нашей независимости."

 EGY_naval_companies: "Торговый флот"
 EGY_naval_companies_desc: "Теперь, когда мы обеспечили контроль над Суэцким каналом, мы должны развить солидный торговый флот для получения экономической выгоды."

 EGY_navy: "Продолжить реформу флота"
 EGY_navy_desc: "Мы должны активно внедрять военно-морские технологии другого мира, чтобы еще больше усилить нашу военно-морскую мощь."

 EGY_expand_dockyards: "Расширить верфи"
 EGY_expand_dockyards_desc: "Расширим верфи в Александрии и Порт-Саиде, чтобы продолжать развивать наш флот."

 EGY_the_queen_of_the_mediteranian: "Королева Средиземноморья"
 EGY_the_queen_of_the_mediteranian_desc: "Египет восстанет как новая держава Средиземноморья. До того дня, когда наш флот будет господствовать на море!"

 # Военные - Военно-воздушные силы
 EGY_aviation_reforms: "Реформа авиации"
 EGY_aviation_reforms_desc: "Мы должны внедрить передовые авиационные технологии из другого мира и построить мощные военно-воздушные силы, способные защитить наше небо и сокрушить врага."

 EGY_pilot_training: "Подготовка пилотов"
 EGY_pilot_training_desc: "Даже лучший самолет бесполезен без опытного пилота. Подготовим нашу молодежь, чтобы она стала лучшими пилотами в мире."

 EGY_expand_air_ports: "Расширить аэропорты"
 EGY_expand_air_ports_desc: "Мы должны расширить аэропорты Каира и Александрии, чтобы разместить больше самолетов."

 EGY_aviation_industry: "Авиационная промышленность"
 EGY_aviation_industry_desc: "Наша цель — приобрести собственные мощности по производству самолетов, используя технологии другого мира."

 EGY_rule_the_skies: "Господствуй в небесах"
 EGY_rule_the_skies_desc: "Когда египетские орлы завладеют небом Ближнего Востока, наши враги задрожат от страха."

 # Военные - Армия (продолжение)
 EGY_grand_battle_plan: "Великая стратегия"
 EGY_grand_battle_plan_desc: "Мы должны впитать знания стратегов из другого мира и установить нашу собственную великую стратегию. Стратегия, сочетающая мудрость Нила с мощью пустыни, приведет наших врагов в замешательство."

 EGY_expand_military_academy: "Расширить военную академию"
 EGY_expand_military_academy_desc: "Расширим Военную академию в Каире и пригласим военных инструкторов из другого мира, чтобы готовить наших офицеров на высочайшем мировом уровне."

 EGY_planning_schools: "Школы стратегии"
 EGY_planning_schools_desc: "Оснуем уникальные школы стратегии, сочетающие теорию стратегии из другого мира с мудростью Древнего Египта. Здесь родятся стратеги будущего."

 EGY_improve_officer_corps: "Улучшить офицерский корпус"
 EGY_improve_officer_corps_desc: "Даже в midst хаоса, вызванного измеренческим перемещением, наш офицерский корпус должен стать сильнее. Построим новую систему подготовки офицеров, гармонично объединяющую знания из другого мира с нашими традициями."

 EGY_general_staff: "Египетский генеральный штаб"
 EGY_general_staff_desc: "Оснуем Генеральный штаб, сочетающий мудрость фараона с передовой стратегией другого мира. Они станут мозгом египетской армии и приведут нас к победе."

 EGY_new_army: "Новая египетская армия"
 EGY_new_army_desc: "Родилась новая египетская армия, где слились древняя слава и технологии будущего. Теперь мы не боимся никакого врага!"

 EGY_domestic_gunsmiths: "Отечественное производство оружия"
 EGY_domestic_gunsmiths_desc: "Настало время производить уникальное и мощное египетское оружие, сочетая передовые технологии другого мира с нашим традиционным мастерством. Такое же грубое, как песок пустыни, и такое же острое, как течение Нила, наше оружие заставит врагов дрожать от ужаса."

 EGY_desert_training: "Боевая подготовка в пустыне"
 EGY_desert_training_desc: "Наша армия должна научиться сражаться в безжалостной среде пустыни. С программой подготовки, сочетающей техники выживания из другого мира и мудрость наших предков, наши солдаты смогут передвигаться по пустыне с той же свободой, с какой рыба плавает в воде."

 EGY_labour_corps: "Трудовой корпус"
 EGY_labour_corps_desc: "Унаследовав дух наших предков, воздвигших пирамиды, создадим современный Трудовой корпус. Сочетая строительные технологии другого мира с нашей настойчивостью, мы построим прочную инфраструктуру, способную преодолеть любые трудности."

 EGY_strengthen_royal_gendarmerie: "Усилить королевскую жандармерию"
 EGY_strengthen_royal_gendarmerie_desc: "Сочетая передовые технологии безопасности из другого мира с нашими традиционными способами поддержания порядка, создадим мощную и эффективную королевскую жандармерию. Они будут не только защищать внутреннюю стабильность, но и, если потребуется, играть роль поддержки регулярной армии."
 # Военные - Флот (продолжение)
 EGY_defend_the_coasts: "Береговая оборона"
 EGY_defend_the_coasts_desc: "Наша страна с протяженной береговой линией вдоль Средиземного и Красного морей нуждается в прочной системе береговой обороны. Внедрим оборонные технологии из другого мира и защитим наши берега как неприступную крепость."

 EGY_light_cruisers: "Разработка легких крейсеров"
 EGY_light_cruisers_desc: "Легкие крейсера, сочетающие мобильность и огневую мощь, станут решающим фактором, способным изменить баланс сил в Средиземноморье."

 EGY_submarines: "Подводные силы"
 EGY_submarines_desc: "Включим передовые подводные технологии из другого мира и подготовим стратегическую карту для того, чтобы поставить Суэцкий канал и Средиземное море в сферу нашего влияния."

 EGY_marine_focus: "Египетская морская пехота"
 EGY_marine_focus_desc: "Настало время превратить воинов Нила в морских бойцов. Египетская морская пехота еще больше усилит наше морское господство."

 # Военные - Военно-воздушные силы (продолжение)
 EGY_dominate_the_sky: "Господство в небе"
 EGY_dominate_the_sky_desc: "Если благословение бога Ра и авиационные технологии другого мира объединятся, мы сможем господствовать в небе Ближнего Востока."

 EGY_fighters: "Исследование истребителей"
 EGY_fighters_desc: "Изучим передовые конструкции истребителей из другого мира и, сочетая их с нашим традиционным мастерством, создадим лучшие истребители в мире."

 EGY_battle_ground_support: "Поддержка наземных сил"
 EGY_battle_ground_support_desc: "Превосходство в воздухе должно быть преобразовано в победу на земле. Обеспечим, чтобы наши самолеты могли эффективно поддерживать наземные силы на полях сражений в пустыне."

 EGY_bombers: "Исследование бомбардировщиков"
 EGY_bombers_desc: "Бомбардировщики дальнего действия, способные поражать тылы врага, дадут нам стратегическое преимущество. Сделаем так, чтобы египетские орлы стали объектом ужаса для наших врагов."

 EGY_aviation_industry_investment: "Инвестиции в авиационную промышленность"
 EGY_aviation_industry_investment_desc: "Собственное производство самолетов необходимо для нашей независимости и военного укрепления. Осуществим полномасштабные инвестиции в развитие авиационной промышленности на основе технологий другого мира."

 # Военные - Флот (дополнительно)
 EGY_grand_navy: "Великий флот"
 EGY_grand_navy_desc: "Настало время построить мощный Великий флот, охватывающий Средиземное и Красное моря, сочетая морскую цивилизацию Древнего Египта с передовыми военно-морскими технологиями другого мира."

 EGY_heavy_cruisers: "Разработка тяжелых крейсеров"
 EGY_heavy_cruisers_desc: "Когда тяжелые крейсера, несущие величество фараона, будут бороздить Средиземное море, наши враги задрожат от страха. Разовьем тяжелые крейсера, еще более усиленные технологиями другого мира."

 EGY_destroyers: "Усилия по эсминцам"
 EGY_destroyers_desc: "Эсминцы, быстрые и маневренные, станут становым хребтом нашего флота. Создадим флотилии эсминцев, таких же быстрых и смертоносных, как крокодилы Нила."

 # Военные - Военно-воздушные силы (дополнительно)
 EGY_air_defence_force: "Силы противовоздушной обороны"
 EGY_air_defence_force_desc: "Защищать небо Египта — наш священный долг. Построим уникальную сеть противовоздушной обороны, сочетая зенитные технологии другого мира с особенностями нашей территории."

 EGY_egyptian_paratroopers: "Египетские парашютисты"
 EGY_egyptian_paratroopers_desc: "Воины Египта с крыльями Хора! Технологии воздушно-десантных операций из другого мира вместе с нашими храбрыми солдатами породят самые мощные воздушно-десантные силы на Ближнем Востоке."

 # Дополнительные фокусы
 EGY_desert_warfare_expertise: "Специалисты по войне в пустыне"
 EGY_desert_warfare_expertise_desc: "Пустыня — наша крепость и наше оружие. Объединим мудрость, накопленную за тысячелетия боев в пустыне, с передовой тактикой другого мира и станем сильнейшими в войне в пустыне."

 EGY_suez_canal_fortification: "Укрепление Суэцкого канала"
 EGY_suez_canal_fortification_desc: "Суэцкий канал — наша жизненная артерия. Используем оборонные технологии другого мира, чтобы превратить канал в неприступную крепость, дабы ни один захватчик не осмелился его возжелать."

 EGY_ancient_wisdom_modern_warfare: "Древняя мудрость, современная война"
 EGY_ancient_wisdom_modern_warfare_desc: "Объединим мудрость Древнего Египта, воздвигшего пирамиды, с современными военными технологиями другого мира и создадим новую военную парадигму, которая поразит мир."

 EGY_nile_delta_industry: "Индустриализация дельты Нила"
 EGY_nile_delta_industry_desc: "Индустриализируем плодородный регион дельты Нила с помощью технологий другого мира и превратим его в сердце нашей военной промышленности. Оружие, произведенное здесь, защитит нашу независимость."

 EGY_sphinx_guardians: "Стражи Сфинкса"
 EGY_sphinx_guardians_desc: "Оснуем специальные силы, где объединятся древняя тайна и технологии другого мира. 'Стражи Сфинкса' будут защищать секреты Египта, и для врагов станут объектом ужаса."

 EGY_pharaohs_vengeance: "Месть фараона"
 EGY_pharaohs_vengeance_desc: "Египет, долгие века находившийся под властью иностранных держав, наконец обрел независимость. Теперь, во имя фараона, настало время обнажить меч мести против тех, кто нас угнетал!"

