 EGY_event.22.t: "Мохамед Нагиб"
 EGY_event.22.d: "Мохамед Нагиб выдохнул дым сигареты, входя в Генеральный штаб. Мой самый любимый помощник — Гамаль Абдель Насер — ждал напряженно. Понаблюдав за ним мгновение, он похлопал его по плечу. Напряжение не рассеялось.\n\n\"Садись. Нам нужно кое-что обсудить.\"\n\nХотя великие державы топтали Африку, пустыня оставалась суверенным страхом. Нил функционировал как кровь, защищавшая Египет от этого страха, и фараон навязывал свою власть, господствуя над ним. Даже после того, как Египет стонал под британскими сапогами и власть королевского дома померкла, они все еще действовали так, будто несли кровь фараона.\n\nРеволюция, чтобы покончить со всем этим гнетом, была мечтой обоих. Война с Германией закончилась, но ничего не изменилось; мы хотели увидеть мир, где все египтяне живут в равенстве. Поэтому мы осмелимся завоевать истинную независимость с оружием в руках.\n\n\"Это о том, о чем мы говорили раньше. Хотя бы номинально, поставить ее лидером военного правительства...\"\n\n\"Нет.\"\n\nНасер перебил его спокойно, но сурово.\n\n\"Разве мы не говорили об этом так долго? Чтобы эта революция победила, мы должны основать республику. Одна монархия против другой? Что подумают люди? Коронация этой девушки-инопланетянки как королевы была бы отрицанием нашей собственной идентичности. Это дело египетского народа, а не Абидоса. Извини, но не может быть одной монархии за другой.\"\n\nНасер закрыл глаза. Он по-прежнему уважал полковника, но в этот момент почувствовал, что убедить его будет нелегко.\n\n\"Полковник, мы боремся за тех, кто угнетает Египет, а не за какой-то абстрактный национализм. Какая разница, монархия это или республика? Даже если путь нации верен, мы не можем тратить время на выбор лидера, которого 'нация' хочет. Я верю, что она должна быть лидером народа.\"\n\nНагиб покачал головой с неловкой улыбкой.\n\n\"И все же мы должны воздвигнуть монархию? В нашей крови течет бурная история тысяч лет. Эта девушка не египтянка и не является для Египта кем-то близким. Она не сможет нести эту бурную кровь, власть и ответственность.\"\n\nНасер невольно замолчал. Возможно, полковник был прав. Но ситуация была безотлагательной; молодой человек, продвигающийся по стране, должен был выбирать. Это уже не то, что можно решить убеждением. Он сунул руку под одежду и достал пистолет."
 EGY_event.22.a: "\"Полковник... простите.\""

 EGY_event.23.t: "Революция, разделенная надвое"
 EGY_event.23.d: "\"...Что ты делаешь? Ты правда думаешь, что это что-то изменит?\"\n\n\"Это воля народа, и она будет исполнена. Еще раз прошу прощения, полковник.\"\n\nИз теней комнаты появились скрытые офицеры и окружили Нагиба. Нагиб вздрогнул, но его выражение осталось спокойным.\n\n\"...Значит, в конце концов это случилось. Я не буду держать на тебя зла. Мы прошли вместе более десяти лет; у тебя тоже есть свои причины и оправдания. Я никогда не смогу полностью тебя понять, но так оно и будет.\"\n\nНе опуская оружия, Насер пристально смотрел на Нагиба долгое время.\n\n\"Я никогда не забуду все, чему вы меня научили. Но, как вы сказали, у меня тоже есть свои обстоятельства для таких действий. Это ничего личного, не беспокойтесь. Теперь пришло время отдохнуть в далеком и тихом месте.\"\n\nНавсегда.\n\nПолковник Мохамед Нагиб был человеком с достаточным опытом: чтобы понимать реальность и подчиняться ей. Когда он раздавил сигарету в пепельнице, черный пепел рассыпался.\n\n\"Делай что хочешь. У меня все равно не будет реальной власти.\"\n\nКогда Насер отдал краткий приказ, офицер схватил Нагиба за плечо. Этот взгляд, твердый, как прямая палка, заставил охранника колебаться. Насеру не оставалось ничего, кроме как позволить ему уйти самостоятельно.\n\nПрежде чем покинуть тот офис — так похожий на дом — который он больше никогда не увидит, Нагиб посмотрел на своего преемника.\n\n\"Насер. Выполняй свой долг. Иди вперед ради блага нации.\"\n\nКак нельзя вернуть пролитую воду, так нельзя отменить принятое решение. Насер знал это. Нагиб тоже. Человек, который всего несколько часов назад был главным героем революции, сделал шаг в холодную реальность.\""
 EGY_event.23.a: "Всей своей жизнью, за родину и народ."

 EGY_event.24.t: "Исчезающие воспоминания о Британии"
 EGY_event.24.d: "Сэр Виктор Хьюберт Тейт, или главный советник военно-воздушных сил Королевства Египет, адаптировался — по-своему — к климату пустыни. Хотя ему казалось, что это полная противоположность канадской зиме, внутри зданий было более сносно, чем он предполагал. По крайней мере, он мог позволить себе съесть пару фиников.\n\nЭто была спокойная жизнь. Возможно, по окончании срока полномочий советника он вернется в Канаду или уйдет на пенсию. После сегодняшнего вызова во дворец он думал пригласить друга на ужин.\n\n\"Королевство Египет глубоко благодарно за усилия сэра Виктора Тейта по сей день.\"\n\nПока он не услышал это необычное уведомление о репатриации.\n\nК счастью, это было то, что он уже предвидел. Британская империя пала, Его Величество король бежал в Канаду, и великие державы, доминировавшие в Европе, рушились одна за другой. Египет тоже должен был действовать.\n\n\"Тогда... эм... мне нечего сказать. В конце концов, этот день настал.\"\n\n\"Парламент постановил, что раз Лондонский мост рухнул, пришло время освободиться от британских когтей... не понимая, что Египет должен навсегда оставаться рядом с Британией.\"\n\nКороль естественно улыбнулся, но в глубине души была тревога, свойственная эпохе.\n\n\"Я не мог отвергнуть их.\"\n\"Это было мудрое решение. В конце концов, в Соединенном Королевстве... и во многих других местах... подули ветры перемен. Если бы я отверг их, реакция была бы значительной.\"\n\n\"Все, что ты отдал до сегодняшнего дня, я не забуду. Египет правил этими землями тысячи лет, но, не сумев приспособиться к временам, потерял многое. Однако благодаря тебе мы восстановили военно-воздушные силы и теперь можем быть должным образом подготовлены к вражеским бомбардировкам. Спасибо.\"\n\nКороль протянул руку, и они обменялись кратким рукопожатием. Это была грубая рука.\n\n\"Желаю тебе всегда оставаться твердым.\"\n\n\"Египет всегда будет в моем сердце. Желаю ему вечного мира, Ваше Величество.\""
 EGY_event.24.a: "Последний след Британии ушел."

 EGY_event.25.t: "Запрос на вступление во фракцию [FROM.GetName]"
