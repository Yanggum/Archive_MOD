l_russian:
 COU_question_about_acting_authority: "Наблюдение за левым уклоном"
 COU_question_about_acting_authority_desc: "Некоторые члены Административного комитета негативно оценивают политическую ориентацию нынешнего Директора транспорта, Юраги Момоки. В частности, существует подозрение, что в условиях кризиса, вызванного исчезновением Председателя Генерального студенческого совета, директор вступила в сговор с местными жителями с целью организации крупного заговора, направленного на полный демонтаж самого Студенческого совета Кивотоса."
 COU_crackdown_on_anti_kivotos_activities: "Подавление анти-кивотосской деятельности"
 COU_crackdown_on_anti_kivotos_activities_desc: "Среди местных фракций все еще много тех, кто враждебно к нам настроен из-за нашего перемещения и последовавшего за этим коллапса региональных правительств, и кто поэтому сопротивляется нам. Мы должны подавить эти силы и способствовать дальнейшей стабилизации региона."
 COU_political_intervention_of_SRT: "Связаться с SRT"
 COU_political_intervention_of_SRT_desc: "Одновременно с введением военного положения было предложено связаться со Специальной академией SRT — подразделением спецназа при Совете — чтобы оно, вместо Академии полиции Валькирия, в настоящее время испытывающей нехватку кадров из-за Великого Катаклизма, могло взять на себя обеспечение общественной безопасности в регионе."
 COU_expedited_administrative_processing: "Ускоренная административная обработка"
 COU_expedited_administrative_processing_desc: "Сейчас наш административный паралич вызывает множественный хаос. Чтобы быстро решить эту проблему, мы решили уделить первоочередное внимание восстановлению административного аппарата."
 COU_opening_of_local_culture: "Открытость местной культуре"
 COU_opening_of_local_culture_desc: "Хотя некоторые студенты могут быть обеспокоены, было предложено, что для получения сотрудничества с местными фракциями мы сначала должны узнать их культуру. Возможно, это окажется нам достаточно полезным."
 COU_expansion_of_autonomy: "Гарантия автономии"
 COU_expansion_of_autonomy_desc: "Мы — незваные чужаки, и для местных мы не более чем захватчики. Сначала мы должны гарантировать им автономию, чтобы уменьшить их недовольство."
 COU_establishment_of_human_rights_committee: "Учредить Управление по гарантии прав человека"
 COU_establishment_of_human_rights_committee_desc: "Говорят, что страна под названием «Германия», где находились Генна и Тринити, в прошлом установила индивидуальные права с помощью закона, известного как Веймарская конституция. Используя это, давайте также учредим Управление по гарантии прав человека, чтобы и студенты, и местные жители могли пользоваться основными правами, которых они заслуживают. И директором этого управления станет единственный «местный» директор в Генеральном студенческом совете!"
 COU_focus_add_state_core_nord_fadcale: "Гарантировать французскую автономию"
 COU_focus_add_state_core_nord_fadcale_desc: "После одностороннего вмешательства французского гарнизона в Нор-Па-де-Кале регион перешел под наш контроль, и французы внутри Нор-Па-де-Кале не получили надлежащей автономии. Если мы уже принимаем даже голландцев и бельгийцев, то добавление еще нескольких французов ничего не изменит."
 COU_focus_reestablish_srt: "Пересмотреть отношение к SRT"
 COU_focus_reestablish_srt_desc: "В настоящее время SRT содержится в Исправительном учреждении Валькирии, но это очень полезные таланты, и они непременно должны снова найти место, где смогут служить."
 COU_flag_fucking_srt: "§RИз-за SRT происходят беспорядки§!"
 COU_union_negotiation: "Учредить Трудовой комитет"
 COU_union_negotiation_desc: "Для местных жителей, которые нам помогают, мы должны учредить Трудовой комитет и прислушиваться к их голосам."
 COU_infrastructure_restoration: "Восстановить инфраструктуру"
 COU_infrastructure_restoration_desc: "Железнодорожная сеть этого другого мира, в который мы были перемещены, имеет проблемы, совершенно отличные от железнодорожной сети Кивотоса. Мы должны улучшить ее, хотя бы частично."
 COU_strengthening_of_valkyrie_authority: "Укрепить власть Академии полиции"
 COU_strengthening_of_valkyrie_authority_desc: "Учитывая текущую ситуацию, мы должны укрепить власть Академии полиции Валькирия и снять различные ограничения, например, касающиеся применения оружия."
 COU_vertical_integration: "Вертикальная интеграция"
 COU_vertical_integration_desc: "Хотя возможно некоторое недовольство, ради эффективности мы сможем интегрировать различные предприятия в вертикальную производственную цепочку, снизить затраты и повторно использовать избыточные заводы."
 COU_reorganization_of_administrative_committee: "Слияние департаментов"
 COU_reorganization_of_administrative_committee_desc: "Объединив департаменты со схожими функциями, мы сможем сделать администрирование более плавным."
 COU_restructuring_of_defense_office: "Реорганизовать Управление обороны"
 COU_restructuring_of_defense_office_desc: "Мы реорганизуем Управление обороны, чтобы размещать студентов на нужных нам должностях, в нужном месте и в нужное время."
 COU_normalization_of_administration: "Нормализация администрации"
 COU_normalization_of_administration_desc: "Благодаря многочисленным усилиям административная система нормализовалась, и осталась только последняя работа. Мы взяли на себя инициативу в борьбе за власть, и Генеральный студенческий совет наконец готов двигаться дальше.\n\n§gЕсли мы никогда не сможем понять друг друга, сможем ли мы понять себя через то, чего не понимаем?§!"
 COU_normalization_of_administration_tt: "Хотя §YСирануи Кая§!, нынешняя ось §Yборьбы за власть§!, не смогла полностью завершить противостояние с оппозицией, ей удалось достичь соглашения о совместном противостоянии §YSCHALE§!."

 #린
 COU_stabilization_of_the_student_council: "Стабилизация Студенческого совета"
 COU_stabilization_of_the_student_council_desc: "К счастью, несмотря на некоторые трения, Студенческий совет восстановил стабильность. Однако Директор финансов, Оки Аой, попросила созвать собрание по вопросу, связанному с предыдущим конфликтом против SCHALE."
 COU_student_council_amendment: "Поправка к Совету"
 COU_student_council_amendment_desc: "§2\"То, что они не разделяют мое мнение, не дает мне права подавлять других, прикрываясь авторитетом.\"§!\n\nНа этом собрании Нанагами Рин, исполняющая обязанности Председателя Генерального студенческого совета, объявила о поправке к Совету, с помощью которой успокоила недовольство оппозиционной фракции и провозгласила, что сделает все возможное как временный руководитель должности Председателя Студенческого совета Кивотоса."
