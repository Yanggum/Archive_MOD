 COU_start_event.1.t: "Создание Студенческого ополчения обороны"
 COU_start_event.1.desc: "Рин сидела в задумчивости, с беспокойным взглядом. В нормальных условиях она, вероятно, пила бы кофе, сосредоточенно работая, но больше она не могла.\n\nПозиция Рин была под угрозой со стороны жадных рук, стремящихся удовлетворить только свои интересы, и в то же время убийства и жестокие преступления против студентов Кивотоса росли угрожающими темпами. Как представитель Генерального студенческого совета, Рин должна была что-то сделать.\n\nИ тут в голове администратора Рин всплыло одно из главных правил Совета: «Студенческий совет не может владеть военной организацией». Но... что, если его нарушить? Что, если это единственный правильный путь? Разве нельзя было бы проигнорировать одно-единственное правило?\n\nИтак, несколько дней спустя администратор Рин остановилась перед репортерами, держа в руках цилиндрический контейнер. Затем она достала флаг.\n\n«С этого момента наш Генеральный студенческий совет официально снимает ограничение на владение военными структурами, установленное Статьей 2 Закона о гарантии автономии академий, и объявляет о создании Студенческого ополчения обороны — военизированной организации. Ее высшее командование будет состоять из бывших членов Специальной академии SRT или специалистов в военной области». \n\nВ одно мгновение журналисты начали забрасывать ее самыми разными вопросами, а некоторые даже принялись оскорблять ее.\n\nНо глаза администратора Рин... нет. Глаза Председателя Студенческого совета Рин уже были полны решимости, прикованные к официальному флагу Студенческого ополчения обороны, который она держала в руках."
 COU_start_event.1.a: "\"Ради всеобщего блага... другого выхода нет.\""
 COU_start_event.1.b: "\"Ты забыла, что частная армия — это узурпация власти?\""

 COU_start_event.2.t: "Момоку исключили с собрания"
 COU_start_event.2.desc: "С раннего утра Момоку вызвали в зал заседаний Секретариата Генерального студенческого совета. Снаружи здание было заполнено бельгийскими протестующими, и через окна было видно, как студентки Академии полиции Валькирия полностью блокируют вход своими щитами.\n\nС недовольным видом Момока вошла в зал и, как обычно, открыла пакетик печенья со вкусом ментайко, слушая требования протестующих. Но точек соприкосновения не было. Одни требовали независимости Бельгии, другие — автономии. В конце концов, среди множества запутанных требований Момока, не подумав, вслух ляпнула то, что пришло ей в голову.\n\n\"А что если... просто дать им то, что они просят?\"\n\nВскоре Момоку буквально вытолкали из здания с видом полной обреченности. И пробираясь через центр, заполненный протестующими, чтобы купить еще печенья (оно уже закончилось), она по лени надела форму Совета... и так протестующие узнали, кто она.\n\nВопреки ее опасениям, что это станет проблемой, протестующие сказали, что купят ей все, что она захочет, в обмен на утечку информации о том, что обсуждалось внутри Совета. И вот, получив кучу пакетиков с печеньем, Момока начала рассказывать прямо там, жуя.\n\n\"...Честно говоря, они к ним не очень хорошо относятся. Мол, нужно сохранять политический нейтралитет и все такое... вы же знаете, администратор Рин всегда была такой строгой~. А... но, если честно, моя идея была просто принять их мнения как есть, и представляете? Меня выгнали с собрания!\""
 COU_start_event.2.a: "\"Эй... что это ты так усердно записываешь?\""
 COU_start_event.2.b: "\"Чтобы мы приняли то, что говорит толпа? Смешно.\""

