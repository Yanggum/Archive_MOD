 COU_nation_moving_forward: "Нация, движущаяся вперед"
 COU_nation_moving_forward_desc: "В своем изначальном смысле коммунизм — это термин, охватывающий движение, отрицающее все аспекты существующей системы и толкающее общество вперед. Мы должны ускорить социальное развитие и проводить перманентные революционные реформы, не искаженный восточными авторитаристами коммунизм, а коммунизм в его истинном значении."

