 COU_leftward_shift: "Левый поворот"
 COU_leftward_shift_desc: "Час настал. Теперь, когда даже пост председателя Чрезвычайного комитета был оставлен добровольно, наша Комиссия по реформе Кивотоса построит страну, где все — и студенты, и местные жители — будут равны и едины.\n\n§SПролетарии всех стран, соединяйтесь!§!"

 COU_honorary_student_council_president: "Почетный председатель Студенческого совета"
 COU_honorary_student_council_president_desc: "§p\"Э? А это еще что?\"§!\n\nХотя мы заставили Юраги Момоку добровольно покинуть пост председателя Чрезвычайного комитета, Комиссия по реформе считает, что назначение ее Почетным председателем, пусть и на церемониальную должность, поможет стабилизировать Генеральный студенческий совет."

