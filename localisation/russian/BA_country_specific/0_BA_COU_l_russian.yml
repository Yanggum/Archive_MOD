 COU_start_event.4.t: "Игра престолов"
 COU_start_event.4.desc: "\"...Так главный администратор все-таки это сделала.\" Сирануи Кая, сидя боком на стуле, заговорила. Она пила кофе с озабоченным лицом... но на губах играла улыбка.\n\nОставить полностью функциональный SRT и создать новую военизированную организацию? Рин была словно стеклянное окно: ее намерения просвечивали сквозь каждое движение. Какой бы предлог она ни придумывала своим льстивым ртом, в конечном счете она просто дрыгала ногами, чтобы у нее не отобрали ее тарелку.\n\nКая поставила чашку и включила телевизор. Как она и ожидала, идиоты на экране притворялись эрудитами, говоря, что Рин жаждет железной диктатуры, что она метит на пост Председателя Совета и так далее, и тому подобное.\n\nХа. Ни за что. У этой безмозглой главной администраторши нет таких намерений. Она просто боится потерять свое место.\n\nКая отодвинула кофе и выдвинула из ящика стола маленькую шахматную доску. Она подумала, что скоро ребята из SRT прибегут, перепуганные, умолять ее о помощи... хотя, скорее всего, этого не случится, поэтому она коротко вздохнула. Нельзя становиться слабой.\n\nНа доске были только королева и два коня. Рин была королевой, а она — конем. Затем она достала восемь пешек и выставила их спереди.\n\nШахматная партия за трон началась.\n\nКая взяла пешку и тихонько постучала ею по столу. В игре за трон неизбежно нужны пешки. Только так можно поймать королеву и закончить партию. Так она думала."
 COU_start_event.4.a: "\"Не будем спешить... и подождем.\""

 COU_start_event.5.t: "Пересечение"
 COU_start_event.5.desc: "Директор обороны Сирануи Кая постучала по шахматной доске. Ходов было мало, а вероятность — низкая. Чтобы прорвать блокаду... ей нужен был SRT.\n\nНо тут с другой стороны закрытой двери послышались быстрые шаги.\n\nЭврика. Как и в ее предсказании с низкой вероятностью, она оказалась права. Судя по звуку, это был один человек.\n\n«Директор обороны! Открой дверь!» — закричал Ситидо Юкино срочным голосом. Кая поставила пешку на место и открыла, сделав вид, что «я ничего не знаю».\n\n«Что случилось?» — спокойно спросила она.\n\n«Что случилось? Ты спрашиваешь, что случилось?! Ты что, телевизор не смотришь?!» Голос был очень грубым... но также испуганным. Кае это понравилось.\n\n«Сначала заходите», — ответила она со спокойной улыбкой. Пешка сама пришла просить у нее помощи: это было забавно. И к тому же именно та вероятность, в которой она сомневалась.\n\nКая налила два горячих кофе из кофеварки и поставила их на стол. Юкино взяла их дрожащими руками, пытаясь успокоиться, хотя не могла скрыть отчаянного выражения лица.\n\n«Я знаю. Похоже, главный администратор Рин создала замену SRT», — начала Кая. Как будто она ждала этих слов, Юкино бросилась говорить.\n\n«Да! Ты тоже это знаешь! Этот главный администратор в конце концов это сделал! То ли своих спецназовцев ей показалось мало, то ли она хочет нас зачистить, или что... но она это делает!»\n\n«Да, похоже на то. И с очень высокой вероятностью Лисья Группа и Кроличья Группа будут списаны. Не так ли?»\n\n«Ты все прекрасно понимаешь! Мне нужна твоя помощь! Ты же была рядом с Рин, да? Тогда... не могла бы ты убедить ее отменить создание? Я заплачу что угодно!»\n\n«Боюсь, главный администратор упряма. Я пыталась поговорить с ней, когда вернулась с пресс-конференции... и это не помогло».\n\nВыражение лица Юкино внезапно стало совершенно отчаянным."
 COU_start_event.5.a: "\"Но... есть еще один выход.\""

 COU_start_event.6.t: "Восемь пешек"
 COU_start_event.6.desc: "\"Но... есть еще один выход.\"\n\nРасфокусированные глаза Юкино снова обрели осмысленность и впились в Каю. Кая тихонько хихикнула.\n\n«Предположим, эта королева — Рин, а этот конь — я».\n\nКая передвинула коня так, что он оказался прямо перед королевой. Но каждый раз, когда она это делала, королева без труда его уничтожала.\n\nТогда она взяла восемь пешек и расставила их на доске.\n\nТеперь конь побеждал с подавляющим преимуществом.\n\n«Мне нужна небольшая поддержка от SRT».\n\n«Главный администратор говорит, что заполнит эту 'Студенческую милицию обороны' людьми из SRT... разве это не очевидная ложь?»\n\n«Если так, то последний способ выжить для SRT — это чтобы главный администратор передумала... или чтобы ее заменили».\n\n«Но она, кажется, не намерена меняться».\n\n«И, по правде... я очень ценю SRT. Они способные люди, достойное уважения спецподразделение. Поэтому я хочу спросить их кое о чем».\n\nКая протянула восемь пешек."
 COU_start_event.6.a: "\"Вы собираетесь ничего не делать и быть списанными?..\""
 COU_start_event.6.b: "\"...или вы собираетесь бороться за выживание?\""

 COU_event_notkaya.1.t: "Согласиться"
 COU_event_notkaya.1.desc: "\"Ха... ха... хватит... довольно...!\"\n\nСирануи Кая бежала и бежала, пока не стала выглядеть жалко. Позади нее группа чиновников в наушниках медленно приближалась.\n\nКая не могла этого принять. В этом не было смысла. Помощники, которых она с таким трудом собрала... благополучие Совета... и ее собственные амбиции... все кричало от боли. Если бы в итоге это оказалось таким пустым фарсом, она бы никогда не начинала.\n\nОна не могла этого принять.\n\nС ее покрасневшего от ярости лица начали капать холодные слезы.\n\n«Не может быть... неужели Рин, Аой, Хайн... позволили этим ублюдкам собой 'манипулировать'... Не врите мне...»\n\nКая перестала бежать. Она рухнула на пол и разрыдалась. Сквозь всхлипывания чиновники приблизились и с бесстрастными лицами открыли чемоданчик.\n\n«Директор обороны. Это приказ исполняющей обязанности Председателя. Подпишите».\n\nЧемоданчик открылся со щелчком, и экран встроенного компьютера загорелся. Там был «приказ»: немедленно отстранить Сирануи Каю от должности за предательство.\n\n«Шмыг... шмыг... понятно... значит, все кончено...»\n\nКая бросила перчатки и вытерла слезы. Плакать дальше ничего не даст.\n\n«Хорошо... ладно... я сделаю это, да? Я сделаю...»\n\nДрожащими руками она положила ладонь на тачпад.\n\nКогда чиновники поспешно ушли, у Каи полностью подкосились ноги, и она рухнула. Так, на полу, она всхлипывала часами."
 COU_event_notkaya.1.a: "\"Нет... в этом нет смысла...\""

 COU_empty_of_monarchs: "Фронт национального сопротивления"
 COU_empty_of_monarchs_desc: "Подавляющее большинство голландской и бельгийской армий покинули родину и бежали, но не все. Офицеры, оставшиеся в Нижних Землях — будь то по приказу монарха или с приказом остаться — агитируют местных жителей препятствовать нашему сотрудничеству и сеют хаос в администрации."

 COU_no_communism_movement: "Сопротивление Управления обороны"
 COU_no_communism_movement_desc: "После принятия Закона о суверенитете в Генеральном студенческом совете Кая и Управление обороны открыто провозгласили «мятеж», заявив, что не допустят, чтобы земной коммунизм проник и поглотил Студенческий совет."

 COU_autonomous_legislation_idea: "Закон о суверенитете"
 COU_autonomous_legislation_idea_desc: "Закон об автономии местных жителей — известный как «Закон о суверенитете» — был создан на основе того факта, что после Великого Перемещения и лобового столкновения двух миров европейские граждане полностью утратили свой суверенитет. Этот закон содержит широкий спектр прав на автономию для обеспечения уровня суверенитета, аналогичного тому, что был до Великого Перемещения."

 COU_socialist_world_republic_idea: "Всемирная Социалистическая Республика"
 COU_socialist_world_republic_idea_desc: "Гигантский идеологический блок, который, как ведущая страна глобального социалистического движения, обличает трудовые проблемы мира и поддерживает революции. Выйдя за пределы маленькой земли под названием Кивотос, они будут двигаться вперед, пока труд во всем мире не будет освобожден."

 COU_outcast_of_the_era: "Отставшие от эпохи"
 COU_outcast_of_the_era_desc: "Прошло много времени с тех пор, как Кивотос обрушился на Европу, и теперь Кивотос устанавливает стандарты для мирового рабочего. В системе, которую они строят, мы остались позади, и огромный технологическо-социальный разрыв вызывает серьезные проблемы."

