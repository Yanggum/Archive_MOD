 COU_initiation_of_free_medical_care: "Введение бесплатного здравоохранения"
 COU_initiation_of_free_medical_care_desc: "Великое государство не бросает своих граждан, когда они болеют. Мы создадим всеобъемлющую систему здравоохранения, чтобы улучшить общее здоровье нашего населения. Все объединятся здесь, чтобы защитить ее."

