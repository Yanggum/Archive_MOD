#левые
 COU_autonomous_legislation: "Закон о суверенитете"
 COU_autonomous_legislation_desc: "Взяв на себя инициативу в борьбе за власть, мы смогли посадить Юраги Момоку на пост председателя Чрезвычайного комитета и получили возможность создать институциональную основу для автономии, которую ранее обещали местным жителям. Это позволит нам еще больше укрепить нашу поддержку."
 COU_neutralize_kaya_clique: "Нейтрализовать Управление обороны"
 COU_neutralize_kaya_clique_desc: "Управление обороны, сборище коварных империалистических фашистов, немедленно оказало сопротивление, как только вступили в силу положения Закона о суверенитете. Для проведения реформы мы должны нейтрализовать Управление обороны."

 COU_inclusion_of_union_in_administrative_committee: "Включить рабочий комитет в Административный комитет"
 COU_inclusion_of_union_in_administrative_committee_desc: "По совету некоторых советников-людей, реформа никогда не может быть осуществлена одним человеком. Для завершения реформы, выполняя наше обещание о гармонии с местными жителями и их автономии, мы включим в Административный комитет рабочий комитет, состоящий из местных жителей."
 COU_logistics_control_of_student_council: "Признать авторитет Административного комитета"
 COU_logistics_control_of_student_council_desc: "На постах председателя Комиссии по реформе и Чрезвычайного комитета Момока доказала свою полезность. Она больше не должна быть Золушкой, которой грозит исключение без защиты Рин: мы должны признать ее гордым членом Административного комитета со всеми вытекающими полномочиями."
 COU_resignation_of_acting_authority: "Отставка председателя Чрезвычайного комитета"
 COU_resignation_of_acting_authority_desc: "Юраги Момока не намерена долго сохранять эту должность. Как только безопасность Транспортного управления будет обеспечена и риск ее исключения будет снят, она уйдет в отставку."

