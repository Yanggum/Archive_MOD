  BLM_gang_thugs_war: "Война банд"
  BLM_gang_thugs_war_1: "Растущее напряжение"
  BLM_gang_thugs_war_1_desc: "Раздор между Скебанами и Бандой Шлемов в рамках временного сотрудничества после Великого Переноса лишь усилил старые обиды. На фоне действий обеих групп, посягающих на интересы друг друга, вот-вот вспыхнет масштабная борьба."
  BLM_gang_thugs_war_2: "Ночь выстрелов"
  BLM_gang_thugs_war_2_desc: "Ситуация, разгоревшаяся после того, как Банда Шлемов обезглавила одного из Скебанов, явно указывает на тотальную войну между Скебанами и Бандой Шлемов. Борьба уже началась, и теперь мы должны поддержать фракцию, которая окажется победителем в последний момент."

  BLM_gang_thugs_war_thugs_side_1: "Активность Курихамы Акими"
  BLM_gang_thugs_war_thugs_side_1_desc: "Курихама Акими — фигура, имеющая престиж легендарной Скебан среди преступников. Она горит жаждой мести Банде Шлемов, которая заточила ее в Исправительном Учреждении, и ее действия дадут Скебанам большое преимущество."
  BLM_gang_thugs_war_thugs_side_1_end: "Успокоить Курихаму Акими"
  BLM_gang_thugs_war_thugs_side_1_end_desc: "Действия Курихамы Акими представляют потенциальную угрозу для нашего Черного Рынка, поэтому мы должны остановить ее, чтобы она не продолжала действовать на стороне Скебанов."
  BLM_gang_thugs_war_thugs_side_1_first: "Курихама Акими совершает свою первую акцию"
  BLM_gang_thugs_war_thugs_side_1_end_tt: "Предотвращает дальнейшие действия Курихамы Акими в поддержку Скебанов.\n"
  BLM_gang_thugs_war_gang_side_1: "Поддержать Банду Шлемов"
  BLM_gang_thugs_war_thugs_side_2: "Поддержать Скебанов"
  BLM_gang_thugs_war_gang_side_2: "Поставлять оружие Банде Шлемов"
  BLM_gang_thugs_war_thugs_side_3: "Поставлять оружие Скебанам"

  BLM_gang_thugs_war_gang_side_up_tt: "§YБанда Шлемов получает преимущество.§!"
  BLM_gang_thugs_war_thugs_side_up_tt: "§YСкебаны получают преимущество.§!"

  BLM_bretagne_revolution_decision: "Бретонская революция"
  BLM_bretagne_revolution_decision_1: "Операция начата"

  #События студентов Ариус
  #이벤트
  BLM_event.1.t: "Зловещее затишье"
  BLM_event.1.d: "По переулкам и рынкам Бретани разливается странное молчание. Напряжение между Бандой Шлемов и Скебанами, которые до сих пор удерживали свои территории в молчаливом мире, постепенно нарастает. Атмосфера напоминает тревожное затишье перед бурей.\n\nХодят слухи, что обе группы усиливают споры за контроль над Черным Рынком и его прибылью. Провокации и завуалированные предупреждения всплыли на поверхность за последние недели, еще больше ухудшив отношения между двумя сторонами. Некоторые шепчутся, что в тени уже началась невидимая борьба за власть.\n\nЛюди с напряженными взглядами оглядываются по сторонам, избегая даже баров, где раньше беспечно пили. Напряжение распространяется по городу, как шип, и достаточно одной искры, чтобы разразилась катастрофа."
  BLM_event.1.a: "Это не к добру."
  BLM_event_1_tt: "§RБлизится война банд.§!"

  BLM_event.2.t: "Война банд"
  BLM_event.2.d: "Движение за независимость Бретани было полностью подавлено, уступив место новому порядку под руководством могущественных преступных организаций, прибывших из других миров. В городах и портах Бретани теперь процветает Черный рынок, где свободно торгуют контрабандой и запретными товарами. Различные банды сотрудничают, чтобы расширять и обогащать Черный рынок, превращая регион в землю без закона и справедливости.\n\nНо этот хрупкий мир продлился недолго. Конфликт между Бандой Шлемов и Скебанами вышел наружу, подтолкнув обе стороны к грани тотальной войны. Казнь лидера Скебанов Бандой Шлемов стала точкой невозврата. Это обезглавливание было не просто убийством, а откровенной провокацией, и во тьме Бретани ожидается жестокая месть.\n\nВесь город превратился в поле заговоров и борьбы за власть. В переулках и на рынках витает угрожающая атмосфера, в то время как предательства, столкновения и месть погружают Бретань в хаос. Никто не может предсказать, кто выйдет победителем из этой войны."
  BLM_event.2.a: "Мятеж начался."

  BLM_event.3.t: "Судьба"
  BLM_event.3.da: "После ожесточенной борьбы в криминальных низах Бретани война между Бандой Шлемов и Скебанами подошла к концу. Скебаны, используя свою информационную сеть и численное превосходство, смогли сокрушить оплоты Банды Шлемов один за другим, достигнув победы. Хотя Банда Шлемов обладала хорошо обученными войсками и организованной структурой, они не смогли противостоять мобильности и численному превосходству соперников.\n\nТем не менее, Банда Шлемов исчезла не полностью. Во время конфликта их лидеры и остатки сил быстро эвакуировались на окраины Бретани, где создали новые базы. Хотя они побеждены, они перегруппировываются в поисках мести, укрепляя свои ряды и пересматривая стратегию.\n\nСкебаны теперь контролируют большую часть Черного рынка и криминального мира Бретани, но Банда Шлемов затаилась, выжидая своего часа. В тени Бретани непростое перемирие предвещает будущие битвы, еще более непредсказуемые."
  BLM_event.3.db: "Ожесточенная борьба между Бандой Шлемов и Скебанами наконец завершилась. Банда Шлемов, благодаря своей дисциплинированной силе, организованной структуре и точному планированию, смогла подчинить себе Скебанов. Разведывательная сеть и численное преимущество Скебанов оказались недостаточными против тщательной стратегии Банды Шлемов, которая захватила их основные оплоты один за другим.\n\nХотя Скебаны сопротивлялись до конца, они не смогли сохранить свое влияние в криминальном мире и в конечном итоге рассеялись или сдались. Их лидеры были захвачены, но некоторые члены сбежали и планируют вернуться из тени.\n\nТеперь Банда Шлемов полностью доминирует в криминальном мире и на Черном рынке Бретани, становясь неоспоримым сувереном местной преступности. Однако, зная, что остатки Скебанов могут появиться в любой момент, они управляют своим контролем осторожно и жестко."
  BLM_event.3.dc: "Война между Бандой Шлемов и Скебанами не выявила явного победителя, ввергнув Бретань в еще больший хаос. Обе банды оказались в тупике, не в силах победить друг друга. Тем временем движения за независимость Бретани используют вакуум власти, чтобы восстановить свои силы на окраинах.\n\nЭти группы начали находить сторонников в царящем хаосе, где закон и порядок рухнули. Так Бретань впадает в анархию, и хаос продолжает распространяться бесконтрольно."
  BLM_event.3.a: "Скебаны победили."
  BLM_event.3.b: "Банда Шлемов победила."
  BLM_event.3.c: "Конфликт не закончен."

  BLM_event.4.t: "Начинается независимость Бретани"
  BLM_event.4.d: "За горизонтом Бретани, после долгого ожидания, вновь зажигается пламя, которое называют «революцией». На стенах улиц остаются каракули, написанные кровью, и песня, ставшая символом сопротивления, распространяется шепотом, словно заклинание. Люди глубоко вздыхают в тишине, медленно, но верно поднимая гнев, который слишком долго подавляли.\n\nТеперь мы должны решить. Неспособные и жестокие угнетатели, пожиравшие Бретань годами, больше не заслуживают управлять нашей землей и нашей жизнью. Те, кто только набивал свои карманы и закрывал уши на боль народа... не более чем последний мусор, который должен быть сметен с этой земли. Настал час построить истинное Государство Бретань, воздвигнутое руками бретонцев для бретонцев.\n\nНо путь никогда не будет гладким. Настоящая независимость не завершается простой сменой флага. Существует структура преступности и коррупции, вросшая в самые глубокие корни этой земли, и в ее центре находится гигантский преступный синдикат, известный как Черный рынок. Подобно раку, этот организм вторгся в экономику и информационную сеть городов, взращивая в тени стражей и преступные банды, такие как Банда Шлемов и Скебаны, накапливая прибыль ценой бесчисленных жизней.\n\nОружие и наркотики, которыми торгуют подпольно, контрабанда и дезинформация, и картель страха и молчания, сделавший это возможным... всему этому необходимо положить конец. У нас не так много времени. Революция требует скорости, и возможность не приходит дважды. Если мы сейчас замешкаемся, история снова впадет в боль и унижение.\n\nРассвет Бретани наступит с кровью. Но эта кровь должна быть кровью угнетателя, и в конце этой крови должен взойти свет освобождения.\n\nМиссия, стоящая перед нами, ясна."
  BLM_event.4.a: ""Восстановите Бретань. Со всей строгостью, превыше всего.""

  BLM_event.5.t: "Провозглашение основания, написанное кровью"
  BLM_event.5.d: "Под небом Бретани наконец наступило истинное утро.\n\nВоля народа, поднятая через кровь, пот и отчаяние, отбросила долгую тьму назад, и революция заслужила право называться победой. Непрерывный успех операций, присоединение внутренних союзников и, в решающий момент, раскол внутри самой преступной организации даровали революционной армии единственный окончательный удар... и этот удар стал поворотным моментом, переломившим ход войны.\n\nВ ночь, когда был взят центральный коридор Черного рынка, город выл в красном пламени; даже оплот Банды Шлемов, пришедшей из другого мира, рухнул, и сопротивление подошло к концу. Остатки Скебанов объявили о капитуляции, и преступный альянс был распущен. И на этих руинах Временное Правительство Бретани зачитало Декларацию об Основании."
  BLM_event.5.a: ""Мы, как истинные хозяева этой земли, провозглашаем Государство Бретань для бретонцев и бретонцами.""

  BLM_event.6.t: "Разрушенный рассвет"
  BLM_event.6.d: "Бретонская революция в конечном итоге стала незавершенной историей. Эта великая попытка, начатая среди жертв, решимости и сдерживаемого сопротивления, угасла после борьбы, столь же жестокой, сколь и отчаянной. Хотя революционерам несколько раз удавалось захватывать ключевые анклавы Черного рынка и они, казалось, зажгли искру контратаки, в конце концов они были безжалостно раздавлены ответным ударом преступного альянса, превосходящего их в организации и ресурсах.\n\nРеволюция провалилась. И это было не просто поражение в бою: это была надежда, снова поглощенная тьмой.\n\nНа улицы снова опустился черный занавес, и магнаты Черного рынка начали контролировать Бретань еще более хитрыми и тщательными методами. Люди перестали бунтовать. Нет... даже слово «бунт» было забыто, словно его никогда не существовало.\n\nИ так Бретань снова стала землей молчания."
  BLM_event.6.a: "Справедливость была побеждена; независимость осталась мечтой, а свобода, заплатив слишком высокую цену, была безжалостно растоптана."

  BLM_opposition.1.t: "Убежище студенток Ариус: Дзёмаэ Саори"
  BLM_opposition.1.d: "Мы только что получили донесение: остатки филиала Ариус проникли на наш Черный рынок, возглавляя нескольких, кто сбежал вместе с подавлением Школы-Филиала Ариус в Тринити. По-видимому, она пересекла границу, чтобы добраться до нас, неоднократно уклоняясь от преследования Тринити.\n\nПо словам наших агентов, после личной встречи с ней все указывает на то, что она бежала, переплыв реку, чтобы спастись от преследователей из Тринити, а затем собрала других студенток в аналогичной ситуации и привела их на этот Черный рынок. Судя по ее поведению, она, кажется, легко адаптировалась к среде Черного рынка."
  BLM_opposition.1.a: "В конце концов, преступники всегда собираются в одном месте."

  BLM_opposition.2.t: "Убежище студенток Ариус: Имасино Мисаки"
  BLM_opposition.2.d: "Только что поступило сообщение, что студентка, по-видимому, из Ариус, вошла на Черный рынок. Она одета опрятно, но ее действия казались подозрительными; после слежки мы смогли подтвердить, что это была студентка из филиала.\n\nНаш агент после разговора с ней лично говорит, что она кажется человеком с глубоким чувством самоотвращения и, вероятно, сбежала, чтобы избежать преследования Тринити."
  BLM_opposition.2.a: "Филиал Ариус..."

  BLM_opposition.3.t: "Убежище студенток Ариус: Хакари Ацуко"
  BLM_opposition.3.d: "Студентка в очень заметном наряде вошла на Черный рынок. Из-за ее своеобразной одежды и манер в старом стиле, кажется, мы обнаружили ее быстро.\n\nК удивлению, после личного разговора она, по-видимому, принадлежит к филиалу Ариус. Как выяснилось, она сбежала, пересекая границу Тринити, в одиночку пересекла горный хребет Вогезов, двинулась на юг, а затем вернулась по этому маршруту на лодке."
  BLM_opposition.3.a: "Сурова в поступках, несмотря на внешность."

  BLM_opposition.4.t: "Убежище студенток Ариус: Цутинага Хиёри"
  BLM_opposition.4.d: "Подозрительная монахиня внезапно вошла на наш Черный рынок и начала расспрашивать о информации о филиале Ариус. После задержания и допроса она оказалась студенткой филиала Ариус, и, кажется, сбежала недавно.\n\nПосле нескольких вопросов она раскрыла, что ее зовут Цутинага Хиёри, и рассказала нам, что ей удалось сбежать из Тринити довольно своеобразным способом."
  BLM_opposition.4.a: "Она сбежала оттуда на поезде?"