#중점
  BLM_dawn_of_bretagne_port: "Рассвет порта Бретани"
  BLM_dawn_of_bretagne_port_desc: "Порты Бретани просыпаются в предрассветной тьме, чтобы стать новым эпицентром преступности. Контрабандисты и криминальные организации стекаются сюда, готовые снискать международную славу."
  BLM_crime_division_of_labor: "Разделение преступного труда"
  BLM_crime_division_of_labor_desc: "По мере того как преступная деятельность становится более изощренной, мы установим четкое разделение ролей и специализацию внутри организации, функционирующую как эффективная индустрия."
  BLM_criminal_syndicate: "Формирование преступного синдиката"
  BLM_criminal_syndicate_desc: "Мелкие преступные банды Бретани объединятся в единый синдикат для сотрудничества ради общей выгоды. Этот синдикат централизует власть и ресурсы всех нелегальных операций."
  BLM_smuggled_weapons_research: "Исследование контрабандного оружия"
  BLM_smuggled_weapons_research_desc: "Мы начнем исследования оружия на основе контрабанды, стремясь к тому, чтобы черный рынок получил самые передовые оружейные технологии."
  BLM_smuggling_export_industry_expansion: "Расширение контрабандной индустрии"
  BLM_smuggling_export_industry_expansion_desc: "Бретань превратит контрабандную индустрию в свой основной источник дохода, расширяя сеть нелегального экспорта для максимизации прибыли."
  BLM_securing_drug_production_facilities: "Обеспечение безопасности объектов по производству наркотиков"
  BLM_securing_drug_production_facilities_desc: "Мы установим лаборатории по производству наркотиков на окраинах Бретани, тем самым укрепляя нашу международную сеть наркоторговли. Организации будут ревностно охранять эти объекты."
  BLM_international_crime_port: "Международный криминальный порт"
  BLM_international_crime_port_desc: "Порт Бретани вскоре станет эпицентром европейской криминальной сети, где будут процветать наркоторговля, торговля оружием и торговля людьми."
  BLM_sicilian_mafia_cooperation: "Сотрудничество с Сицилийской мафией"
  BLM_sicilian_mafia_cooperation_desc: "Черный рынок Бретани заключит союзы с Сицилийской мафией, интегрируясь в международную криминальную сеть для получения большей выгоды и усиления своей власти."
  BLM_balkan_market_expansion: "Расширение на балканский рынок"
  BLM_balkan_market_expansion_desc: "Мы планируем расширить наше влияние на Балканы, установив там новые маршруты контрабанды и торговли оружием, тем самым укрепляя нашу региональную власть."
  BLM_kivotos_crime_sponsorship: "Криминальное спонсорство в Кивотосе"
  BLM_kivotos_crime_sponsorship_desc: "При спонсорстве криминальных групп в Кивотосе черный рынок получит новые источники финансирования и международные альянсы, которые укрепят нашу операционную базу."
  BLM_second_market_domination: "Господство на втором рынке"
  BLM_second_market_domination_desc: "Стремясь к господству на 'Втором рынке', черный рынок расширяет сферу своего влияния на всю нелегальную торговлю, укрепляя свою экономическую мощь."
  BLM_london_gang_contact: "Контакт с лондонскими бандами"
  BLM_london_gang_contact_desc: "Установив контакт с криминальными бандами Лондона, мы укрепим нашу международную сеть и получим доступ к новым ресурсам и влиянию."
  BLM_atlantic_smuggling_route_establishment: "Создание трансатлантического контрабандного маршрута"
  BLM_atlantic_smuggling_route_establishment_desc: "Мы откроем контрабандные маршруты через Атлантику для перевозки оружия и наркотиков между Европой и Северной Америкой, что принесет огромную экономическую выгоду."
  BLM_great_leap: "Великий скачок"
  BLM_great_leap_desc: "Черный рынок Бретани готовится к качественному скачку, расширяя свое экономическое и политическое влияние через индустриализацию преступности."
  BLM_systematic_industrialization: "Системная индустриализация"
  BLM_systematic_industrialization_desc: "Благодаря организованной индустриализации, черный рынок Бретани сделает свои преступные операции еще более эффективными за счет специализации и модернизации своей инфраструктуры."
  BLM_crime_enterprise: "Криминальное предприятие"
  BLM_crime_enterprise_desc: "Черный рынок Бретани превратится в настоящее криминальное предприятие, управляя преступностью как стабильной и прибыльной индустрией."
  BLM_international_crime_industry_alliance: "Международный альянс криминальной индустрии"
  BLM_international_crime_industry_alliance_desc: "Мы сформируем международный альянс криминальной индустрии, сотрудничая с преступными организациями по всему миру для обмена ресурсами и прибылью в глобальном масштабе."


  BLM_bretagne_independent_organization_and_start_of_war: "Объявление войны в Бретани"
  BLM_bretagne_independent_organization_and_start_of_war_desc: "Националистические ополчения Бретани продолжают укрепляться и выступать против нашего контроля. Ради интересов черного рынка мы должны начать против них тотальную войну."
  BLM_gang_thugs_domination: "Банды, Скебаны и Господство"
  BLM_gang_thugs_domination_desc: "Полное господство над Бретанью близко. Черный рынок готов вновь явить миру свою силу."
  BLM_sealing_conflicts_in_confusion: "Сдерживание конфликтов в хаосе"
  BLM_sealing_conflicts_in_confusion_desc: "Хотя конфликт между Скебанами и Бандой Шлемов обостряется, все организации признают, что должны объединиться ради выживания. Пока что они будут временно сотрудничать."
  BLM_gang_priority: "Приоритет Банде Шлемов"
  BLM_gang_priority_desc: "Банда Шлемов, с ее превосходной подготовкой и организацией, лидирует в преступном мире. Мы поддержим их, чтобы они эффективно использовали свои ресурсы."
  BLM_thugs_priority: "Приоритет Скебанам"
  BLM_thugs_priority_desc: "Хотя они менее организованы, Скебаны собирают информацию и большое количество членов из различных академий. Мы поддержим их, чтобы использовать их численное преимущество."
  BLM_organized_public_security_management: "Организованное управление общественной безопасностью"
  BLM_organized_public_security_management_desc: "Банда Шлемов, благодаря своей дисциплине, идеально подходит для поддержания порядка в Бретани, подавляя как независимцев, так и обычных преступников."
  BLM_suppression_of_skeban_radicals: "Подавление радикальных Скебанов"
  BLM_suppression_of_skeban_radicals_desc: "Децентрализованная природа Скебанов позволяет некоторым игнорировать внутренние соглашения и устраивать беспорядки. Мы нейтрализуем их ради стабильности черного рынка."
  BLM_mimicking_of_bills: "Имитация законов"
  BLM_mimicking_of_bills_desc: "Имитация законов других стран может быть полезна. Мы скопируем их судебные системы для структурирования нашей организации."
  BLM_free_district_bretagne: "Свободный округ Бретань"
  BLM_free_district_bretagne_desc: "Скебаны из Кивотоса — сердце черного рынка, живущие без школьных правил. Их свободный дух представляет культурную сущность черного рынка."
  BLM_loose_zone_order: "Гибкий порядок в зоне"
  BLM_loose_zone_order_desc: "Мы, прежде всего, преступная организация. Нам не нужно поддерживать строгий общественный порядок, как другим государствам."
  BLM_free_skeban_spirit: "Свободный дух Скебанов"
  BLM_free_skeban_spirit_desc: "Свобода Скебанов непревзойденна. Мы расширим нашу организацию как открытое сообщество, чтобы увеличить ее размер."
  BLM_organized_armament_strengthening: "Организованное усиление вооружений"
  BLM_organized_armament_strengthening_desc: "Перед лицом угрозы войны с Другим Миром мы должны усилить наше вооружение, даже ценой больших жертв. Фракции черного рынка достигли тайного согласия на это."
  BLM_return_of_seven_prisoners: "Возвращение Семи Заключенных"
  BLM_return_of_seven_prisoners_desc: "В хаосе после исчезновения президента студсовета Семь Заключенных — иконы преступного мира — сбежали. Их вербовка даст нам огромную военную мощь и обеспечит лояльность фракций."
  BLM_bretagne_law: "Закон Бретани"
  BLM_bretagne_law_desc: "Отныне законы черного рынка будут править Бретанью. С помощью Стражей Рынка и союзных организаций мы сформируем могущественную беззаконную зону."

  BLM_gang_thugs_war_focus: "Война банд"
  BLM_gang_thugs_war_focus_desc: "Прошлой ночью произошел неприятный инцидент. Столкновение между Скебанами и Бандой Шлемов уже свершившийся факт, и их противостояние в конечном итоге станет угрозой для Черного Рынка. Мы должны быстро определить курс."

