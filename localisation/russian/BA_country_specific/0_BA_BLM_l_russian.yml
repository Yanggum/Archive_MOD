  BLM_expansion_of_the_black_market_tt_1: "Вы можете принять в общей сложности §Y3§! решения в §Y[FROM.GetNameWithFlag]§!. Сейчас вы можете принять еще §Y[?FROM.BLM_black_market_expansion]§! решений.\n\nТекущие принятые решения:\n[BLM_expansion_of_the_black_market_tt_casino_dt][BLM_expansion_of_the_black_market_tt_guns_dt][BLM_expansion_of_the_black_market_tt_drugs_dt][BLM_expansion_of_the_black_market_tt_bodys_dt][BLM_expansion_of_the_black_market_tt_office_dt]"
  BLM_expansion_of_the_black_market_tt_2: "Все решения в §Y[FROM.GetNameWithFlag]§! приняты. Отныне вы можете расширить §YОтделение черного рынка§! в страну, соседнюю с §Y[FROM.GetNameWithFlag]§!.\n\nТекущие принятые решения:\n [BLM_expansion_of_the_black_market_tt_casino_dt][BLM_expansion_of_the_black_market_tt_guns_dt][BLM_expansion_of_the_black_market_tt_drugs_dt][BLM_expansion_of_the_black_market_tt_bodys_dt][BLM_expansion_of_the_black_market_tt_office_dt]"

