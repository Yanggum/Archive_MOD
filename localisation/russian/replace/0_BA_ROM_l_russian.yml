l_russian:

ROM_modify_the_constitution: "Защита Конституции"
ROM_modify_the_constitution_desc: "Защита Конституции"

# Господство на Балканах
ROM_big_empire: "Строительство Великой Румынии"
ROM_big_empire_desc: "Мы не только подчинили себе все Балканы, но и сокрушили существ из иного мира, становясь новой великой державой."

ROM_attack_ITA: "Обеспечить Средиземноморье"
ROM_attack_ITA_desc: "Средиземное море — жизненно важный морской регион. Враг не слаб, но это не причина отказываться от Средиземноморья."

ROM_secure_the_SHA: "Обеспечить Австрию"
ROM_secure_the_SHA_desc: "Неизвестный враг поверг Европу в хаос. В качестве первого шага великого крестового похода мы освободим Австрию."

ROM_be_roma: "Истинный наследник Рима"
ROM_be_roma_desc: "Название нашей страны означает землю римлян, и мы всегда называли себя римлянами. Теперь Рим в наших руках. Кто сможет отрицать, что мы наследники Рима?"

# Фашизм
ROM_appoint_TRM_friendly_government: "Назначить правительство, дружественное Патеру"
ROM_appoint_TRM_friendly_government_desc: "Будущее Румынии зависит от поддержания хороших отношений с державами из иного мира, которые появляются на Западе. Мы должны назначить правительство, которое понимает эту реальность."

# Неприсоединившиеся
ROM_all_parties_must_continue: "Все вечеринки должны продолжаться"
ROM_all_parties_must_continue_desc: "Чтобы укрепить позиции короля, вечеринки должны продолжаться. Как бы ни была серьезна финансовая ситуация, необходимо поддерживать политический импульс."