 GER_increasing_cg_tt: "§Y$MODIFIER_CONSUMER_GOODS_FACTOR$§! §Rбудет увеличиваться§! каждый месяц на §Y[?ROOT.GER_monthly_consumer_goods_increase|%1]§! до достижения §Y100%§!. Ежемесячная сумма увеличения §Rбудет расти§! в зависимости от количества §Yнеосновных штатов§!, контролируемых §Y[ROOT.GetName]§!."