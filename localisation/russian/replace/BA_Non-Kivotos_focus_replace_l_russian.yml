#Indochina
 #Eventos
 indochina_event.1.t: "Революция в Индокитае"
 indochina_event.1.d: "По мере того как поддержка Коммунистической партии Индокитая распространяется по всей стране, коммунистический лидер Хо Ши Мин провозгласил коммунистический Вьетнам и начал восстание. Мы должны подавить их."
 indochina_event.1.a: "Проклятье."

 #Национальные духи
 VIN_upcoming_riot: "Неминуемое восстание"
 VIN_upcoming_riot_tt: "\nПо истечении: активируется событие '§Y$indochina_event.1.t$§!'"
 VIN_indochina_war_idea: "Партизаны Индокитая"
 VIN_indochina_war_idea_desc: "Регион Индокитая создает серьезные трудности для ведения войны противником из-за жаркого климата, густых джунглей и активного участия местного населения."


#Китай
 CHI_mission_to_germany: "Дипломатическая миссия в Италию"
 CHI_closer_ties_with_germany: "Более тесные связи с Италией"
 CHI_closer_ties_with_germany_desc: "Наша делегация, отправленная в Италию, открыла огромные возможности для сотрудничества, и в будущем мы даже сможем получить кредиты на промышленное развитие."
 CHI_give_falkenhausen_citizenship_desc: "Группа немецких советников сыграла решающую роль в восстановлении и модернизации нашей армии. Теперь, когда Германия исчезла, мы должны позволить им остаться здесь."

#Проверим, работает ли замена – Польша
 POL_italian_alliance: "Каспийское море"
 POL_italian_alliance_desc: "Антибольшевистский фронт не должен ограничиваться Восточной Европой! Нации по ту сторону Анатолии могут оказать нам неоценимую помощь."
 POL_protect_yugoslavia: "Украинская национальная армия"
 POL_protect_yugoslavia_desc: "В 1922 году Украина была территориально опустошена большевиками. Мы соберем националистические силы Западной Украины и используем их как антибольшевистских добровольцев."
 POL_diplomatic_mission_to_YUG: "Отправить дипломатическую миссию в [YUG.getName]"
 POL_the_mediterranean: "Черное море"
 POL_the_mediterranean_desc: "Страны Черного моря имеют прямую границу с [SOV.getadjective]. Они не будут колебаться, приняв нашу протянутую руку."
 POL_coerce_slovakia: "Добровольцы Свободной Польши"
 POL_coerce_slovakia_desc: "Из-за незаконной агрессии [SOV.getadjective] наша родина потеряла свои северо-восточные территории. Мы должны организовать националистическое ополчение в этих регионах, чтобы противостоять им!"
 POL_hungarian_alliance: "Бригада белорусских добровольцев"
 POL_hungarian_alliance_desc: "Хотя и слабый, белорусский национализм все еще жив. Мы мобилизуем молодежь, разделяющую белорусскую идентичность."
 POL_invite_greece: "[POL_russian_volunteers]"
 #/Работает хорошо

#Советский Союз
 NSB_soviet_soviet_german_trade_agreement.2.t: "[SOV.getadjective]-[MIL.getadjective] Торговое соглашение подписано"
 SOV_propaganda_anti_fascism: "Вперед, на фронт освобождения человечества!"


#Соединенные Штаты
 USA_intervention_in_europe: "Интервенция в старый порядок"
 USA_intervention_in_europe_desc: "Наступил новый порядок. Мы должны вмешаться, чтобы не дать старому порядку, уже рухнувшему, подняться вновь."
 USA_war_plan_gold_desc: "Франция обратила свой взор на Научную школу Миллениум. Если им удастся завладеть научными технологиями Миллениума, это будет представлять для нас чрезвычайно серьезную угрозу."
 USA_war_plan_silver_desc: "Итальянский экспансионизм продолжается безудержно. Если имперские амбиции, которые они лелеют, вступят в конфликт с нашими национальными интересами, мы должны быть готовы."
 USA_war_plan_white_desc: "С крахом старого порядка коммунистическая угроза расширяется. Нет большей опасности для нашей страны и мира."
 USA_war_plan_red_desc: "Хотя Соединенное Королевство серьезно пострадало от рук нового порядка, оно остается великой морской державой в Европе. Этот факт беспокоит нас."
 USA_war_plan_black: "План войны «Темно-синий»"
 USA_war_plan_black_desc: "Кажется, они хранят молчание, но на самом деле они — самый опасный враг в мире. Мы должны победить их, прежде чем реагировать станет невозможно."

