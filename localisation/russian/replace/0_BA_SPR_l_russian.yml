## События
SPBA_event.1.desc: "Всеобщие выборы 1936 года прошли в довольно напряженной обстановке из-за продолжительного национального чрезвычайного положения. Однако конечный результат был ясен: масштабная избирательная кампания Национального фронта во главе с Испанской конфедерацией независимых правых принесла свои плоды.\n\nНеограниченная финансовая поддержка капиталистов и беспокойство, вызванное 'Великим Перемещением', произошедшим на севере, стали решающим политическим удобрением для консерваторов. В результате раскол Народного фронта привел к тому, что многие избиратели предпочли правых, обещавших порядок и стабильность, вместо республиканского хаоса и безответственных действий левых.\n\nНедавно установленная СИДА провозглашает восстановление государства под руководством президента [Root.GetLeader], опираясь на 'доверие народа'. Однако на улицах уже звучат лозунги 'большевизма из иного мира', и все левые силы начинают клеймить как предателей.\n\nХотя победа СИДА стала результатом законного избирательного процесса, политическое насилие и социальная раздробленность не только не утихли, но, кажется, вступили в новую фазу. Правительство, вместо поиска примирения с оппозицией, проявляет признаки желания подавлять ее без колебаний и использовать внешние угрозы как предлог для установления сильной авторитарной системы."
SPBA_event.1.a: "Нет лучшей альтернативы!"

SPBA_event.2.t: "Кортесы свергают президента!"
SPBA_event.2.desc: "Как только победа Испанской конфедерации независимых правых на всеобщих выборах подтвердилась, политический мир Мадрида пришел в головокружительное движение.\n\nПрезидент [Root.GetLeader] пытался продолжать защищать республиканский конституционный порядок, но большинство Национального фронта в Кортесах заклеймило его как некомпетентного и отсталого лидера.\n\nИспользуя как предлог Великое Перемещение, произошедшее на севере, и разрозненное левое сопротивление, Кортесы представили срочное предложение и утвердили отставку президента почти молниеносно.\n\nПоддерживаемые высшим военным командованием и фалангистскими ополчениями, лидеры СИДА взяли власть с быстротой, казавшейся тщательно спланированной. Новое государственное руководство пообещало сильный авторитарный порядок, сосредоточенный вокруг испанской армии.\n\nНесмотря на видимость процедурной законности, этот эпизод представляет собой на практике парламентский переворот и останется в истории как поворотный момент в политической истории Испании."
SPBA_event.2.a: "Для поддержания порядка нужно сильное правительство."

SPBA_event.3.t: "Последние угли республиканских офицеров"
SPBA_event.3.desc: "\"Коридоры Министерства обороны были погружены в мертвую тишину. Но это было не безмятежное спокойствие, а тревожное предвестие надвигающейся бури. Каждый раз, когда свежеотпечатанный официальный вестник переходил из рук в руки среди офицеров, слышались лишь приглушенные вздохи и шепот проклятий. Лавина пропаганды, распространяемая правительством и государственными СМИ, была не чем иным, как открытым заявлением о чистке.\n\nОдин генерал с ассамблейными наклонностями с разочарованным видом уронил документы. «Мы должны были знать это с того момента, как они вышвырнули президента парламентским переворотом… Хиль-Роблес разрушает Республику в мантии, а не в мундире». Никто не смог ответить. Многие товарищи уже были арестованы или помещены под надзор по подозрению в связях с 'большевизмом из иного мира'. Под лезвием, казалось бы, законных законов все левые генералы в армии теперь были вынуждены подставить свои шеи.\n\nТишину нарушил Висенте Рохо Льюч. Не говоря ни слова, он прошел в свой кабинет и взял свою любимую авторучку. В его заявлении об отставке была только одна строка: «Этот офицер был верен Республике, но не может служить Республике, которая больше не существует». Подписав, он положил свои знаки различия на стол.\n\nЕго отставка была только началом. От самых уважаемых стратегов Генерального штаба до молодых офицеров на фронте, солдаты, верившие в республиканские идеалы, начали оставлять оружие и должности один за другим. За одну ночь стол министра обороны был погребен под сотнями писем об отставке. Правительство Национального фронта смогло 'очистить' армию, не пролив ни капли крови. Но цена была расколом института, ценившего честь как саму жизнь, и подлила масла в огонь воли к сопротивлению, которая еще не угасла. Политика Мадрида была запятнана чернилами вместо крови, но в тот день испанская армия раскололась надвое."
SPBA_event.3.a: "Одна часть истории клонится к закату."

SPBA_event.4.t: "Продление национального чрезвычайного положения"
SPBA_event.4.desc: "Продление национального чрезвычайного положения было единогласно одобрено в Кортесах благодаря тесному сотрудничеству между Национальным фронтом и некоторыми центристскими партиями. Немедленно испанская армия — особенно элитные силы Африканской армии — была развернута в основных городах страны под предлогом операций по поддержанию порядка.\n\nВо многих местах мавританские солдаты патрулируют улицы, покуривая сигареты, в то время как социалистов с красными повязками жестоко избивают при бешеной поддержке части населения. Гражданская гвардия часто провоцирует столкновения в крупных городах, ссылаясь на изъятие 'оружия', и при теплом приеме священников и монахинь испанская армия эффективно укрепляет контроль над городами.\n\nНесмотря на то, что большинство Народного фронта отказалось принять продление, стало еще яснее, что Испания пропитана фанатичным антикоммунизмом и необузданной жаждой мести."
SPBA_event.4.a: "Хватайте и вешайте предателей, которые восстанут!"

