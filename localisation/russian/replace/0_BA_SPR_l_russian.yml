## Национальный дух
SPR_kivotos_bolshevism: "Иномирный большевизм"
SPR_kivotos_bolshevism_desc: "Событие 'Великого Перемещения' 1935 года разрушило все в Испании. И поскольку существа, называемые Кивотосом, оказались явными социалистами (вероятно), шаткое здание общества, долгое время гнившее в Испании, превратилось в уродливую форму, едва избежавшую краха благодаря твердому коллективному безумию иномирного большевизма. День, когда это безумие закончится, наступит только с завершением Реконкисты против Кивотоса."
SPR_catholic_revolution: "Революсьон Католика"
SPR_catholic_revolution_desc: "Поскольку коммунистические захватчики пожирали Испанию, рабочие решили верить в церковь и Бога вместо профсоюзов и Маркса. Серия национальных католических реформ, произошедших в этом процессе, известна под общим названием Революсьон Католика, и старая социалистическая культура заменяется новой католической культурой."
