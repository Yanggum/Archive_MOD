SPBA_national_emergency_extension_desc: "2 ноября 1935 года великий хаос в Европе и постоянные столкновения на измененных границах привели к провозглашению национального чрезвычайного положения и введению военного положения по всей Испании. Теперь, гранича с государствами иного мира, известными как Кивотос, и имея собственные отторгнутые территории, необходима еще более жестокая мобилизация."

