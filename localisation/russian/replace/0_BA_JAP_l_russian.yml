 MEN_add_core_of_mongolia: "Интеграция Монголии"
 MEN_add_core_of_mongolia_desc: "Годами мы законно претендовали на Монголию, но нелегитимное правительство в Улан-Баторе отвергало наши требования и продолжало оккупацию нашей территории. Теперь, когда наш самый надежный союзник, [JAP.GetAdjective], сверг это правительство, законное право управления вернулось в наши руки. Мы должны провозгласить наш суверенитет над Монголией и объединить монголов под единым правительством."