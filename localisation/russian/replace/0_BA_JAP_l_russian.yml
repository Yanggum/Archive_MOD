l_russian:
 JAP_guide: "Подданный Его Величества Императора\n\n£white_dot Завершить контроль над Маньчжурией и Северным Китаем.\n£white_dot Завершить освобождение народов Юго-Восточной Азии.\n£white_dot §YЗавершить Сферу Сопроцветания.§!\n\n§RЕсли весь мир под небом — одна семья, разве это может быть плохо?§!"
 JAP_country_intro_header: "Страна восходящего солнца"
 JAP_country_intro_content: "Реставрация Мэйдзи полностью преобразила Японию, которая раньше цеплялась лишь за наследие прошлого. Страна с тридцатью миллионами жителей всего за семьдесят лет стала домом, где живут более семидесяти миллионов подданных, более чем вдвое больше прежнего; и богатство нации не удвоилось, а выросло в десятки раз. И в довершение всего, после победы над Россией престиж Империи распространился по всей Великой Восточной Азии с порывом восходящего солнца.\n\nРеставрация изменила Японию радикально, но не все шло позитивно. Слава Империи, достигнутая за последнее столетие, связана с жертвами крестьян для стимулирования индустриализации, а богатство, созданное государством, остается в деформированной структуре, сконцентрированной на вершине социальной пирамиды. Гордость за развитие современной промышленности, если заглянуть внутрь, — не более чем неуклюжее подражание западным товарам.\n\nЭкспансионистская политика, направленная против Кореи и Китая, скрывала свою темную сторону, но это тоже не может длиться вечно. Огромные военные расходы и усилившаяся позиция армии оказывают огромное давление на правительство. Колониальная администрация, за исключением Тайваня, накапливает постоянные дефициты; а Финансовая паника Сёва и Великая депрессия затянули все проблемы Империи в ужасающий узел, словно Гордиев. Маньчжурский инцидент, рассматриваемый как возможность разрубить его, на самом деле усугубил ситуацию, разозлив такие державы, как Великобритания и Нидерланды.\n\nТак, прошедшие годы эпохи Сёва распространили предзнаменование того, что, несмотря на гордость и великолепие, Империя движется к ужасному упадку."
 JAP_country_intro_header_1: "$JAP_country_intro_header$"
 JAP_country_intro_content_1: "Подвиг, который Токугава Иэясу совершил тайно, выжидая своего часа, повторился. Чужая группа, похожая на человечество, но не идентичная, полностью наложилась на Запад, и в то же время давление, тяготевшее над Империей, также рассеялось.\n\nЭто были хорошие новости, да, но на это нельзя смотреть легкомысленно. Империя должна созерцать то, что будет после закрепления незыблемой позиции в Великой Восточной Азии. Если знаешь себя и знаешь врага, одержишь сто побед; но пока знания об этих существах из другого мира ограничены. У некоторых даже белая кожа, что напоминает определенных лиц, которые исчезли или все еще остаются; в то время как другие странным образом похожи на нашу Империю или Китай.\n\nС рассветом 11-го года Сёва мы вступили в новую фазу. Для Империи еще осталось много задач. Даже оставляя в стороне эти новые существа, сельская бедность сохраняется, а с исчезновением Европы экономика, вместо улучшения, откатилась назад сильнее, чем раньше. Однако, в отличие от прошлого, ясно, что перед Империей открылись варианты, которые не ведут исключительно к упадку."

 JAP_Revolution_democracy: "Японский революционный комитет"
 JAP_Revolution_democracy_DEF: "Японский революционный комитет"
 JAP_Revolution_democracy_ADJ: "Японского революционного комитета"
 JAP_No_More_militarism: "Гражданский контроль"
 JAP_No_More_militarism_desc: "Во время Великой депрессии армия вмешивалась в несколько инцидентов. Несмотря на успех революции, все еще существует военное руководство с милитаристскими наклонностями. Мы должны контролировать их демократическими средствами."
 JAP_zaibatsus: "Дзайбацу"
 JAP_zaibatsus_empowered: "Усиленные дзайбацу"
 JAP_zaibatsus_challenged: "Оспоренные дзайбацу"
 JAP_challenge_the_zaibatsus: "Бросить вызов дзайбацу"
 JAP_guide_the_zaibatsus: "Направлять дзайбацу"
 JAP_intervene_in_china_communism: "Распространять революцию"
 JAP_intervene_in_china_communism_desc: "Наша революция не должна закончиться в Японии. Мы должны расширить ее на весь мир."
 JAP_defeat_American_Imperialism: "Разгромить американский империализм"
 JAP_defeat_American_Imperialism_desc: "Соединенные Штаты позиционируют себя на международной арене как колыбель свободы, но на самом деле они ничем не отличаются от любого другого империалистического государства. Мы должны сломать их гегемонию в Тихом океане и построить общее процветание."
 JAP_Remember_Daisho_Demokrashi: "Помнить демократию Тайсё"
 JAP_Remember_Daisho_Demokrashi_desc: "1920-е годы были золотым веком для Японии как в культурном, так и в экономическом плане. Пробудим в народе ностальгию по тем «добрым временам» и призовем их требовать свои права."
 JAP_Opposition_of_Peace_Preservation_Act: "Оппозиция Закону о сохранении мира"
 JAP_Opposition_of_Peace_Preservation_Act_desc: "Закон о сохранении мира, принятый в 1925 году, служил основанием для подавления как левых, так и правых сил, подавляя демократические и либеральные движения и ускоряя превращение Японии в милитаристское государство."
 JAP_purge_the_militarists: "Чистка милитаристов"
 JAP_remove_of_peace_preservation_act: "Отмена Закона о сохранении мира"
 JAP_remove_of_peace_preservation_act_desc: "Проклятый закон, терзавший японское общество и народ с 1925 года, больше не существует. Он останется лишь страницей в учебниках истории."
 JAP_Civil_War_Damage_Recovery: "Восстановление после гражданской войны"
 JAP_Civil_War_Damage_Recovery_desc: "Гражданская война, охватившая всю Японию, оставила сотни тысяч жертв. Мы должны компенсировать им потери и восстановить разрушенные дома и инфраструктуру."
 JAP_Local_autonomy_expansion: "Расширение местной автономии"
 JAP_Local_autonomy_expansion_desc: ""
 JAP_remove_of_Ministry_of_Development: "Упразднение Министерства колоний"
 JAP_remove_of_Ministry_of_Development_desc: ""
 JAP_liberate_south_seas_mandate: "Интегрировать мандат Южных морей"
 JAP_liberate_south_seas_mandate_desc: "После нашего участия в Великой войне в Европе мы получили бывшие немецкие колонии в Тихом океане в качестве награды. Хотя они все еще управляются как мандаты Лиги Наций, процесс ассимиляции коренного населения значительно продвинулся. Поэтому мы официально интегрируем их как часть нашей метрополии."
 JAP_the_taiwan_question: "Тайваньский вопрос"
 JAP_the_taiwan_question_desc: "Хотя мы управляли Тайванем некоторое время, вопрос его самоопределения становится все более насущным. Можем ли мы утверждать, что действительно защищаем демократические идеалы, если отказываем в праве на самоопределение нашим соседям?"
 JAP_crush_chinese_communists: "Уничтожить китайских коммунистов"
 JAP_crush_chinese_communists_desc: ""
 JAP_develop_nanyo_gunto: "Развивать мандат Южных морей"
 JAP_develop_nanyo_gunto_desc: "Мандат Южных морей — наш трамплин на юг и наша база для проекции в океан. Мы должны больше инвестировать в этот регион."
 JAP_crush_soviet: "Уничтожить великую угрозу"
 JAP_crush_soviet_desc: "[SOV.GetName] позиционирует себя как страна для рабочих, но на самом деле [SOV.GetLeader] осуществляет власть как диктатор в поисках личной выгоды. Мы должны освободить народы, страдающие под кулаком [SOV.GetLeader]."
 JAP_the_korean_question: "Корейский вопрос"
 JAP_devlop_korean: "Развивать Корею"
 JAP_devlop_korean_desc: ""
 JAP_develop_taiwan: "Развивать [524.GetName]"
 JAP_develop_taiwan_desc: "Развивать [524.GetName]"

 BA_japan.1.t: "Граждане требуют отмены Закона о сохранении мира!"
 BA_japan.1.d: "Секретно\nДоклад\nИмперия Великая Япония, год Сёва 11 [GetMonth]\nТема: Доклад о протестах с требованием отмены Закона о сохранении мира\n\n1. В ключевых городах, таких как Токио, Осака и Нагоя, вспыхнули крупные протесты с требованием отмены Закона о сохранении мира.\n2. Протестующие настаивают на его немедленной отмене и продолжают собираться в центрах городов.\n3. Военная полиция развернута на местах и находится в противостоянии с протестующими. Ситуация контролируется жестко, чтобы не допустить ее ухудшения.\n4. На данный момент серьезных столкновений нет, но есть признаки возможной эскалации протестов. Требуется постоянное наблюдение.\n\nКонец доклада"
 BA_japan.1.a: "Предатели, враги нации! Огонь!"
 BA_japan.1.b: "Мы должны прислушаться к голосу народа."
 BA_japan.2.t: "Решительное подавление протестов подрывных элементов"
 BA_japan.2.d: "1. Премьер-министр приказал немедленно разогнать демонстрантов силой.\n2. Военной полиции отдан приказ жестко подавлять, рассматривая даже развертывание армии в случае необходимости.\n3. Принято решение арестовать зачинщиков и сурово их наказать."
 BA_japan.2.a: "Конец доклада"
 BA_japan.3.t: "План продвижения правовой реформы, прислушиваясь к народу"
 BA_japan.3.d: "1. Премьер-министр решил принять требования протестующих.\n2. Отдано распоряжение о формировании специального комитета для отмены Закона о сохранении мира.\n3. Планируется встреча с представителями протестующих, ведутся переговоры о мирном роспуске."
 BA_japan.4.t: "Фусэ Тацудзи"
 BA_japan.4.d: "Сегодня Фусэ Тацудзи был арестован в своей резиденции Специальной высшей полицией по обвинению в нарушении Закона о сохранении мира. Бывший прокурор, адвокат по правам человека и бывший депутат, избранный от Рабоче-крестьянской партии на всеобщих выборах 1928 года, он является фигурой, уважаемой простым народом, и тем, кто возглавил недавние протесты за отмену этого закона.\n\nОн указал на отсутствие демократической легитимности у нынешнего правительства и на существование Закона о сохранении мира и заявил, что продолжит борьбу за его отмену и восстановление демократии.\n\nПосле 12 часов пыток он признался по всем пунктам обвинения. Что нам с ним делать?"
 BA_japan.4.a: "Обвини его в нарушении Закона о сохранении мира и заключи в тюрьму Осаки!"
 BA_japan.6.t_china: "[609.GetName] превращена в ничейную землю"
 BA_japan.6.t_manchu: "[745.GetName] превращена в ничейную землю"
 BA_japan.6.d: "Не следует ли нам воспользоваться гражданской войной в Японии и захватить эту зону?"
 BA_japan.6.a: "Вторжение, вперед!"
 BA_japan.7.t: "[FROM.GetAdjective] отбирает у нас территорию"
 BA_japan.7.d: "Заголовок говорит сам за себя"
 BA_japan.8.t: "Свободные выборы на [524.GetName]"
 BA_japan.8.d: "Сегодня было объявлено, что в штаб-квартире Японского гражданского правительства в провинции [524.GetName], бывшей канцелярии генерал-губернатора, состоится голосование по вопросу интеграции с Китаем. Новость быстро распространилась через местные СМИ, и голосование состоится завтра.\n\nТеперь нам остается ждать, выберут ли они интеграцию с Китаем или полную интеграцию с внутренней территорией..."
 BA_japan.9.t: "[524.GetName] выбирает интеграцию с внутренней территорией"
 BA_japan.9.d: "К счастью, в голосовании, проведенном среди жителей [524.GetName], вариант интеграции с внутренней территорией получил немного больше голосов, чем независимость. Официально остров [524.GetName] перестает быть заморской территорией и считается частью метрополии, интегрируясь в систему префектурного управления.\n\nПосле голосования сторонники независимости [524.GetName] решили бороться за расширение привилегий региона в японском парламенте."
 BA_japan.9.a: "Отлично."
 BA_japan.10.t: "[524.GetName] выбирает интеграцию с Китаем"
 BA_japan.10.d: "К сожалению, в голосовании, проведенном среди жителей [524.GetName], интеграция с Китаем получила немного больше голосов, чем интеграция с метрополией. С сегодняшнего дня управление [524.GetName] передано «Временному переходному правительству Тайваня», возглавляемому местными жителями.\n\nХотя они по-прежнему будут оставаться под нашим сильным влиянием, флаг Восходящего Солнца был тихо спущен в резиденции губернатора в Тайбэе, будучи замененным флагом с синим небом, белым солнцем и красной землей китайского правительства."
 BA_japan.10.a: "Желаем им удачи."
 BA_japan.11.t: "[FROM.GetAdjective] возвращает [524.GetName]"
 BA_japan.11.d: "Заголовок говорит сам за себя"
 BA_japan.11.a: "Банзай!"
 BA_japan.12.t: "Генералы, прибывшие из [FROM.GetAdjective]!"
 BA_japan.12.d: "Сообщается, что Япония перевела генералов с милитаристскими наклонностями в Маньчжурию.\n\nБудет ли кто-то играть за Маньчжоу-го, пока японский ИИ идет по демократическому пути в моде Blue Archive?"
 BA_japan.12.a: "Вот как..."
 BA_japan.13.t: "Доклад о переводе генералов-милитаристов"
 BA_japan.13.d: "Секретно  \nДоклад  \nИмперия Великая Япония, год Сёва 11 [GetMonth]\nТема: Доклад о переводе генералов с милитаристскими наклонностями в Маньчжурию\n\n1. Недавно несколько генералов экспансионистского и милитаристского склада были отправлены в Маньчжурию.\n2. Эти офицеры были известны своей приверженностью политике агрессивной экспансии и военным приготовлениям.\n3. Хотя им поручены новые миссии в Маньчжурии, отмечаются признаки недовольства и сопротивления. Требуется постоянное наблюдение и сбор разведданных.\n\nКонец доклада"
 BA_japan.14.t: "[FROM.GetAdjective] предлагает индустриализировать [ROOT.GetName]!"
 BA_japan.14.d: "[FROM.GetAdjective] предложила нам план индустриализации Кореи. Это может значительно ускорить индустриализацию [ROOT.GetAdjective], но также вызывает опасения по поводу возможного всеобщего экономического подчинения [FROM.GetAdjective]."
 BA_japan.14.a: "Лучше так, чем ничего..."
 BA_japan.14.b: "Нам это не нужно."
 BA_japan.15.t: "[FROM.GetAdjective] одобряет наш план индустриализации"
 BA_japan.15.d: "[FROM.GetAdjective] приняла наше предложение. В настоящее время квалифицированные рабочие из [ROOT.GetAdjective] отправились в [FROM.GetAdjective] для передачи технических знаний, и отношения между двумя странами еще больше укрепятся."
 BA_japan.15.a: "Отлично!"
 BA_japan.16.t: "[FROM.GetAdjective] отклоняет наш план индустриализации"
 BA_japan.16.d: "[FROM.GetAdjective] отклонила наше предложение..."
 BA_japan.16.a: "Как жаль..."
 BA_japan.17.t: "[FROM.GetAdjective] возвращает нам территорию!"
 BA_japan.17.d: "Общий контент о возврате утерянной территории"
 BA_japan.18.t: "Отставка Хаяси Сэндзюро"
 BA_japan.18.d: "Его Величество Император лично отправил в отставку военного министра Хаяси Сэндзюро, чтобы обуздать высокомерие фракции Тосэйха. После этого Его Величество приказал прекратить конфликты между фракциями Тосэйха и Кодоха. Моральный дух Тосэйха снизился, а Кодоха, кажется, удовлетворена."
 BA_japan.18.a: "Что произошло?"
 BA_japan.19.t: "Решение"
 BA_japan.19.d: "Активность молодых офицеров, поддерживающих Кодоха, усилилась, что вызвало опасения по поводу возможного государственного переворота внутри правительства. Они часто тайно встречаются, и их контакты с высшим военным командованием становятся все более частыми.\n\nКак Его Величество Император, так и японское правительство внимательно следят за ними, хотя прямых улик пока не найдено. Тем не менее, атмосфера напряженная, и Япония, кажется, на пороге важного события."
 BA_japan.19.a: "Готовь тотальное подавление."
 BA_japan.19.b: "Пусть их тайно поддержат."
 BA_japan.19.c: "Не будем действовать так поспешно."
 BA_japan.20.t: "Попытка восстания молодых офицеров"
 BA_japan.20.d: "Молодые офицеры попытались свергнуть кабинет и захватить контроль над Токио, но им не удалось убить премьер-министра и арестовать высокопоставленных чиновников, и их вооруженное восстание в Токио было подавлено быстрее, чем ожидалось.\n\nПравительство объявило чрезвычайное положение и при содействии лояльных сил армии решительно подавило мятежников. Зачинщики переворота были арестованы или казнены на месте, и восстание было полностью разгромлено.\n\nИмператор выпустил заявление, осуждающее предательство, и правительство объявило, что восстание полностью взято под контроль. Кодоха обречена на полную чистку."
 BA_japan.20.a: "Кодоха пришел конец."
 BA_japan.21.t: "Массовая отставка кабинета Окады Кэйсукэ"
 BA_japan.21.d: "После подавления путча молодых офицеров ужасная реакция Окады Кэйсукэ вызвала постоянную критику со стороны армии и народа. Вскоре, уступая давлению военных, Окада объявил о полной отставке своего кабинета.\n\nПолитическое внимание теперь сосредоточено на том, кто будет назначен новым премьер-министром."
 BA_japan.21.a: "Хирота Коки, сбалансированный премьер-министр."
 BA_japan.21.b: "Угаки Кадзусигэ, армейский модератор."
 BA_japan.21.c: "Хаяси Сэндзюро из фракции Тосэйха."
 BA_japan.22.t: "Отставка Хироты Коки"
 BA_japan.22.d: "Хирота Коки, находясь под давлением армии и с низким уровнем народной поддержки, в конце концов решил уйти в отставку с поста премьер-министра.\n\nПосле его отставки фракции Тосэйха удалось политически маневрировать, чтобы назначить Хаяси Сэндзюро новым премьер-министром."
 BA_japan.22.a: "Какой кошмар..."
 BA_japan.23.t: "Формирование кабинета Коноэ Фумимаро"
 BA_japan.23.d: "С ростом общественного мнения, настроенного против армии, и продолжающимися политическими ошибками Тосэйха, японская политическая сцена почувствовала необходимость перемен. В этом контексте Коноэ Фумимаро принял просьбу Императора и сформировал новый кабинет, привлекая большое общественное внимание. Несмотря на давление армии, Коноэ стал центральной фигурой и лидером, на которого народ возлагал надежды.\n\nС момента вступления в должность он привлек внимание Кодоха и общественности. За его умеренной политикой внимательно следят, и в настоящее время известно, что он продвигает смягчение Закона о национальной безопасности."
 BA_japan.23.a: "Положимся на него."
 BA_japan_23_tt: "§RЕсли национальная реформа не будет завершена к октябрю 1940 года, Коноэ Фумимаро потеряет необходимый политический импульс.§!"
 BA_japan.24.t: "Роспуск парламента Хаяси Сэндзюро"
 BA_japan.24.d: "Едва вступив в должность, Хаяси Сэндзюро начал движения по нейтрализации парламента. Он ускорил решение неотложных вопросов предыдущего кабинета и принял решение о роспуске парламента. Хотя некоторые партии решительно возражали, Хаяси проигнорировал их и организовал выборы при поддержке милитаристских фракций.\n\nОднако пром-милитаристские партии потерпели сокрушительное поражение на выборах. Их попытка снова распустить парламент провалилась. В конце концов, растущая оппозиция в палате завершилась вотумом недоверия, вынудив его быстро уйти в отставку."
 BA_japan.24.a: "Коноэ Фумимаро станет новым премьер-министром."
 BA_japan.25.t: "Отставка Угаки Кадзусигэ"
 BA_japan.25.d: "После попытки путча Кодоха Угаки Кадзусигэ был назначен премьер-министром. Он пытался стимулировать экономическое восстановление путем сокращения военных расходов, что вызвало недовольство как среди радикальных фракций, так и среди Тосэйха. Его отказ усилить гарнизон в Маньчжурии был особенно спорным.\n\nАрмия обвинила его в отсутствии лидерских качеств, и его народная поддержка рухнула. После того как военный министр ушел в отставку под давлением Тосэйха, Угаки решил, что не может сохранить кабинет, и подал в отставку."
 BA_japan.25.a: "Коноэ Фумимаро станет новым премьер-министром."
 BA_japan.27.t: "Основание Ассоциации поддержки императорского правления"
 BA_japan.27.desc: "Движение за новый порядок, инициированное Коноэ Фумимаро, начиналось с благородных намерений реформировать Японию и освободить ее от военного влияния. Однако со временем его идеалы были искажены под сильным давлением армии. Его мечты о реформах угасли, а его действия оказались связаны диктатом военных.\n\nСегодня официально основана «Ассоциация поддержки императорского правления». Эта организация стремится объединить японский народ в рамках тотальной системы национальной мобилизации для войны, устанавливая централизованный режим сотрудничества правительства и военных. Все политические партии распущены, и эта ассоциация становится единственной политической организацией Японии."
 BA_japan.27.a: "Это будет полезно."
 BA_japan.27.b: "Она полностью манипулируется военными."
 BA_japan.27.c: "Это никак не влияет на наше дело."
 BA_japan.27.d: "Политический ландшафт Японии кардинально изменился."
 BA_japan_27_flag: "§YАссоциация поддержки императорского правления§! стала марионеткой армии"
 BA_japan.28.t: "Основание Ассоциации поддержки императорского правления"
 BA_japan.28.d: "Коноэ Фумимаро возглавил Движение за новый порядок, чтобы восстановить Японию перед лицом кризиса, с твердым убеждением, что старая многопартийная система неспособна вести страну в будущее. С целью осуществления национального обновления он основал новый политический порядок.\n\nТак сегодня официально родилась «Ассоциация поддержки императорского правления». Эта организация, в повиновении Императору, возьмет на себя задачу объединения японского народа, руководства политическими и экономическими реформами и превращения Японии в современное, эффективное государство. Это новая система, основанная на традициях и душе народа.\n\nВсе партии распущены. Эта ассоциация будет единственным двигателем национальной реформы. Под именем Императора все граждане будут сотрудничать для построения сильной империи. Солнце Японии сияет новым светом и не остановится в своем движении вперед."
 BA_japan.28.a: "Вперед, к Новому Порядку!"
 BA_japan.29.t: "Учреждение Императорской Ставки"
 BA_japan.29.d: "Япония была втянута в войну против [FROM.GetName]. Чтобы обеспечить эффективное руководство конфликтом и мобилизацию ресурсов, фракция Тосэйха учредила «Императорскую Ставку». Этот орган полностью объединяет кабинет и армию под военной структурой управления.\n\nУтвержденная Императором, эта Ставка будет руководить всеми военными операциями под командованием Тосэйха и заниматься военными решениями и управлением национальными ресурсами. Япония вступает в режим тотальной войны."
 BA_japan.29.a: "Понял."
 BA_japan.30.t: "Основание Революционной лиги за Кокутай"
 BA_japan.30.d: "После провала реформ Коноэ Фумимаро реформисты оказались в хаосе. Политическое давление Тосэйха сорвало умеренные усилия Коноэ, и радикальная идеология Кодоха во главе с Кита Икки возродилась. При поддержке радикальных кругов армии и националистов была основана «Революционная лига за Кокутай».\n\nКита Икки, выступая за революцию, центрированную на Императоре, объединил радикалов из армии, националистически настроенных интеллектуалов и социалистов-реформистов под одной целью: фундаментальная трансформация японского государства."
 BA_japan.30.a: "Мы вырвем с корнем раковую опухоль Японии."
 BA_japan.31.t: "Отставка Коноэ Фумимаро"
 BA_japan.31.d: "Сегодня премьер-министр Коноэ Фумимаро объявил о своей отставке, заявив, что выполнил свою роль и не планирует возвращаться.\n\nВместе с отставкой он рекомендовал принца Хигасикуни Нарухико в качестве своего преемника. Однако некоторые министры предлагают назначить Тодзё Хидэки для контроля над армией."
 BA_japan.31.a: "Тодзё Хидэки, будем надеяться, он нас услышит."
 BA_japan.31.b: "Принц Нарухико, его авторитет может подчинить армию."
 BA_japan.32.t: "Тодзё Хидэки уходит в отставку после потери [JAP_tojo_hideki_end.GetName]"
 BA_japan.32.d: "Во время подготовки к войне против [USA.GetName] Тодзё Хидэки столкнулся с растущей критикой. Потеря [JAP_tojo_hideki_end.GetName] под его руководством стала последней каплей. Он больше не может оставаться у власти.\n\nПод политическим давлением Тодзё подал в отставку. Его преемником станет Койсо Куниаки, бывший генерал-губернатор Кореи."
 BA_japan.32.a: "Сможет ли Койсо Куниаки переломить ситуацию?"
 BA_japan.40.t: "Ван Цзинвэй переходит на сторону Японии!"
 BA_japan.40.d: "Шокирующая новость. Ван Цзинвэй, считающийся героем революции и преемником Сунь Ятсена, бежал из Чунцина и прибыл в Шанхай, находящийся под японской оккупацией.\n\nЕго конфликт за власть с Чан Кайши начался с первоначального сотрудничества, но постепенно обострялся. Когда Чан был назначен председателем Гоминьдана и оттеснил Вана на должность вице-председателя, отношения между ними полностью разорвались.\n\nПосле падения Уханя Ван счел, что продолжать сопротивление бессмысленно. Он заключил тайный пакт с Японией, бежал в Ханой, а затем в Шанхай. Этот поступок был расценен как предательство, и националистическое правительство приказало его убить. Однако ему удалось выжить, и он разорвал связи с Чаном и правительством, которое применило против него силу, несмотря на отсутствие явных актов предательства."
 BA_japan.40.a: "\"Брат, иди по легкому пути. Я пойду по трудному.\""
 BA_japan_40_tt: "\"Как печально и больно. Только надеюсь, он одумается и вернется.\"\n– Чан Кайши"

 BA_japan.41.t: "Ван Цзинвэй присоединяется к Правительству обновления"
 BA_japan.41.d: "Операция по привлечению Ван Цзинвэя увенчалась успехом! С провалом операции Траутманна и затянувшейся японо-китайской войной Ван прибыл в Шанхай и начал обсуждения создания нового Национального правительства Республики Китай под своим руководством вместе с несколькими прояпонскими фигурами."
 BA_japan.41.a: "Война скоро закончится!"

 BA_japan.42.t: "Судьба [MEN.GetName]"
 BA_japan.42.d: "[MEN.GetName] — довольно противоречивое правительство. Хотя оно было создано для монголов, на его фактической территории проживает больше китайцев и маньчжуров, чем монголов. Теперь мы должны решить его судьбу."
 BA_japan.42.a: "Используем это как базу для поглощения [MON.GetAdjective]"
 BA_japan.42.b: "Он нам больше не нужен; понизим его до автономного правительства [WCH.GetAdjective]"
 BA_japan.42.c: "Понизим его до автономного правительства [WCH.GetAdjective] и используем это как предлог для претензий на территорию [MON.GetAdjective]"

 BA_japan.43.t: "Переговоры с [TIB.GetAdjective]"
 BA_japan.43.d: "Тибет находится в периферийной зоне Китая, но расположен прямо над британской колонией Индией, что дает стратегическое преимущество для фланговой атаки. С другой стороны, если британцам удастся повлиять на Тибет или превратить его в колонию, Китай окажется под угрозой с фланга. Поэтому мы должны обеспечить прочную интеграцию Тибета в Сферу сопроцветания Великой Восточной Азии."
 BA_japan.43.b: "Если мы уступим [601.GetName] и [604.GetName], они присоединятся к нашему делу."
 BA_japan.43.a: "Банзай!"

 BA_japan.44.t: "Переговоры с [FROM.GetAdjective]?"
 BA_japan.44.d: "Блаблабла... если честно, кто будет играть за Тибет? Честно говоря, думаю, никто."
 BA_japan.44.a: "Это как раз то, что мне было нужно"

 BA_japan.45.t: "[FROM.GetAdjective] решает присоединиться к нашему делу"
 BA_japan.45.d: "[FROM.GetAdjective] решила участвовать в нашем деле. Мы на шаг ближе к Азиатскому процветанию!"
 BA_japan.45.a: "Банзай!"

