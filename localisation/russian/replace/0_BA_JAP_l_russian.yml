 JAP_economic_stimulus_plan: "План экономического стимулирования"
 JAP_economic_stimulus_plan_desc: "Исчезновение Европы и экономический коллапс США оставили значительные шрамы на нашей экономике. Мы должны разработать план выхода из этой опасной ситуации."

 JAP_nation_of_the_rising_sun: "Страна восходящего солнца"

 JAP_opposition_to_the_army: "Оппозиция Тосэйха"

 JAP_purge_the_kodoha_faction: "Контроль гражданского правительства"
 JAP_purge_the_kodoha_faction_desc: "Армия будет строго контролировать гражданское правительство, чтобы взять на себя полный контроль над государственной властью. Мы ограничим политическое влияние гражданских лиц и направим всю политику государства по военной инициативе."

 JAP_support_for_the_manchurian_faction: "Поддержка Маньчжурской фракции"
 JAP_support_for_the_manchurian_faction_desc: "Маньчжурская фракция, возглавившая Маньчжурский инцидент, решительно поддерживает политику интеграции Великой Восточной Азии. Они стремятся укрепить свое влияние там, используя ресурсы и военную силу для достижения своих конечных целей."

 JAP_disarmament_for_the_economy: "Разоружение ради экономики"

 JAP_establishment_of_special_economic_recovery_investigative_committee: "Специальный комитет по расследованию экономического восстановления"
 JAP_establishment_of_special_economic_recovery_investigative_committee_desc: "Тосэйха сыграла главную роль в реагировании на Великую депрессию. Мы оспорим их экономическое управление и сформируем комитет для представления альтернативной системы."

 JAP_purge_of_pro_military_officials: "Чистка пром-военных чиновников"

 JAP_formation_of_fumimaro_konoe_cabinet: "Формирование нового кабинета"
 JAP_formation_of_fumimaro_konoe_cabinet_desc: "Мы назначаем премьер-министром Коноэ Фумимаро, фигуру, способную сдерживать армию и стабилизировать японскую политику, поддерживаемую как Кодоха, так и народом."

 JAP_establishment_of_the_imperial_rule_assistance_association: "Движение за новую систему"
 JAP_establishment_of_the_imperial_rule_assistance_association_desc: "Движение за новую систему Коноэ направлено на уменьшение военного влияния и создание обширной единой национальной структуры. Оно воспользуется потерей власти армией для укрепления авторитета правительства."

 JAP_protection_of_the_kodoha: "Ослабление Закона о сохранении мира"
 JAP_protection_of_the_kodoha_desc: "С целью стабилизации японской политики мы защитим различные анти-Тосэйха фигуры, которые были арестованы. Мы гарантируем их политическое присутствие и ослабим армию, ускоряя политические реформы."

