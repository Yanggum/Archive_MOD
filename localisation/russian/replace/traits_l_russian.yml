  GEH_satsuki_trait_2_O_L: "Богиня рядом с бывшей Геенной\n§gДаже если это шаткое равновесие на вершине.§!"
  GEH_satsuki_trait_2_O_R: "Любимая богиня бывшей Геенны\n§gТы любил её.§!"
  GEH_satsuki_trait_2_O_L_A: "Богиня рядом со всей Геенной и Германией\n§gПоследний полевой цветок, расцветший в центре.§!"
  GEH_satsuki_trait_2_O_R_A: "Любимая богиня, идущая по земле\n§gТы любил её.§!"
  GEH_satsuki_trait_2_O_R_B_1_1: "Тяжело искупающая\n§gТеперь как простой человек.§!"
  GEH_satsuki_trait_A: "Любимая богиня бывшей Германии\n§gВечный лидер всех немцев, пророчица, правящая потерянным раем, наша сияющая богиня.§!"
  GEM_state_religion_nation_trait: "Верховная жрица"
  GEM_emperor_of_all_germany_trait: "Кайзерин всей Германии"
  GEH_motomiya_chiaki_trait: "Генеральный секретарь Геенны"
  GEH_motomiya_chiaki_trait_OL1: "Рациональность и разум\n§gНаш лидер, который, как король-философ, направляющий инновации, стремится построить эффективное государство.§!"
  GEH_motomiya_chiaki_trait_OR1: "Народный генеральный секретарь\n§gГосударство обязано гарантировать жизнь граждан; это проявляется под лозунгом «от колыбели до могилы».§!"
  GEH_motomiya_chiaki_trait_A0: "Фюрер\n§gТеперь наследница орла.§!"
  GEH_motomiya_chiaki_trait_A1: "Народный фюрер\n§gДолжность Фюрера социальной республики — это карта, гарантирующая общее благо всего народа, великий контракт.§!"
  GEH_motomiya_chiaki_trait_A2: "Председатель Нации\n§gНаш лидер, стремящийся победить великое зло и защитить германо-геенновскую цивилизацию в каждом кризисе.§!"
  GEH_motomiya_chiaki_trait_A3: "Фюрер\n§gОрел, разбивающий скорлупу и взлетающий.§!"
  GEH_motomiya_chiaki_trait_A4: "Верховный главнокомандующий народа\n§gДолжность Верховного главнокомандующего Германской Народной Республики — это орган консенсуса общего блага, избираемый как суверен для смягчения классового конфликта и поиска пути.§!"
  GEH_motomiya_chiaki_trait_A5: "Германия рассвета\n§gГермания возродилась, и, согласно имени родины как земли немцев, она принимает Геенну, юг Германии, франков и все меньшинства.§!"
  GEH_motomiya_chiaki_trait_A6: "Оплот консерватизма\n§gМотомия Тиаки продвинула широкие правые компромиссы для стабилизации германского государства, и теперь ее называют символом германского государства и великим Верховным главнокомандующим.§!"
