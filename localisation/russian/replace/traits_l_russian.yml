  GEM_pp_trait_tooltip: "Черта Национальной усталости:\n Устраняется при завершении одного из этих национальных фокусов: §Y$GEH_armageddon$§!, §Y$GEM_gehenna_academy_is_a_school_where_everyone_is_happy_right$§!, §Y$GEM_gehenna_nation_founding$§!, §Y$GEM_school_rules_revision$§!, §Y$GEM_opinion_manipulation_and_secretariat_revolution$§!"
  GEM_governor_general_trait: "Администраторша"
  GEM_fortress_of_progress_trait: "Лидер, идущий впереди\n§gГерманская Федерация не может остановиться. Как знаменосцы, направляющие поток всех исторических преобразований, и передовая пехота цивилизации, мы должны идти вперед и сокрушать врагов!§!"
  GEM_leader_of_us_trait: "Национальный лидер\n§gЛидер германского государства и надежда Геенны, несущая самое тяжелое бремя. Это наш гордый лидер, направляющий две задачи: защиту Геенны и управление германским государством среди бесчисленных политических бурь.§!"
  GEM_occult_reconstruction_trait: "Оккультистка\n§gОднажды она продвигает левую революцию, а на другой день — реакционный откат; наша оккультистка демонстрирует хаотичный курс, но по своим собственным правилам.§!"
  GEM_gehennaism_trait: "Очень по-геенновски\n§gПосле провозглашения германского государства Ханума Макото приняла решения, которые разрушили ожидания существующих немцев, и внедряет культуру Геенны во все сферы общества.§!"
  GEM_mini_gehenna_academy_trait: "Также Председатель Студенческого совета Академии Геенны\n§gПредседатель Студенческого совета Геенны после провозглашения германского государства получила определенную и переработанную роль: служить своего рода представительной делегацией сферы Геенны.§!"
  GEM_small_gehenna_academy_trait: "Малая Академия Геенны\n§gМалая Академия Геенны — это новая Академия Геенны, переработанная после провозглашения германского государства, с уменьшенной и четко определенной ролью: одна из представительных организаций сферы Геенны и небольшое сообщество, предназначенное для сохранения традиций и культуры Геенны.§!"
  GEM_better_integration_trait: "Национальный интеграционист\n§gКак геенновцы, так и немцы, в конечном счете, живут в одном государстве. Преднамеренное разделение создает лишь преднамеренную дискриминацию; поэтому мы должны продвигать лучшую интеграцию. Мы начнем с принятия немецких студентов в Академию Геенны.§!"
  GEM_chiaki_system_decision_GEM_german_B4_3_1_on_trait: "Бескровная революционерка"
  GEM_chiaki_system_decision_GEM_german_B4_3_1_off_trait: "Дамба"
  GEM_hero_of_order: "Герой порядка"
  GEM_anti_prometheus: "Переваривание\n§gПламя человечества, принесенное Прометеем, ввергается в бессознательное и разрушение. Все это должно закончиться сейчас. Мы будем последним ковчегом этой эпохи.§!"
  GEM_marionette: "Марионетка"
  GEM_ruler_propaganda_trait: "Господство над массовой культурой"
  GEM_liberator: "Освободительница\n§gСтеклянный город, построенный на иллюзиях, рухнул из-за просвещения самого высокомерного.§!"
  GEM_irregular: "Нестандартная\n§gТу, кто мечтала о самом высоком небе, заставили быть лидером земли; пора снова смотреть на небо.§!"
  GEM_trait_gourmet_research_society: "Клуб гурманских исследований"
  GEM_trait_hot_spring_department: "Клуб освоения горячих источников"
