  GEM_oberste_heeresleitung_trait: "Верховное главнокомандование армии"
  GEM_next_chairman_of_the_people: "Второй Народный председатель"
  GEH_chairman_of_the_people: "Народный председатель"
  GEM_manmajeon_chairmanship_separation_trait: "Председатель Пандемониума"
  GEH_chairman_of_the_people_1: "Твердый Народный председатель\n§gНацуме Ироха — основательница федерации и ее первый председатель. Как великая сияющая звезда, твердо стоящая в потоке огромной борьбы, она будет управлять федерацией.§!"
  GEH_chairman_of_the_people_b_1: "Народный председатель\n§gНацуме Ироха — историческая фигура, поддерживаемая двумя фракциями, и председатель Федеративных Штатов. Как мирный лидер, принимающий всех в хаосе фракционной политики, она будет управлять федерацией.§!"
  GEH_chairman_of_the_people_b_2: "Народный фюрер\n§gНацуме Ироха — символ федерального правительства и лидер недавно восстановленной должности Фюрера. Хотя она не может обладать такой же сильной властью, как бывший Фюрер, будучи самым важным сувереном двух фракций, она будет выступать посредником и направлять федерацию.§!"
  GEM_coordinator_trait: "Координатор Федерального государства"
  GEH_chairman_of_the_people_a: "Лидер дуба\n§gНацуме Ироха — символ новых немцев и лидер новой нации. Как сильный дуб, Германия останется навсегда запечатленной, глубоко в этой земле.§!"
  GEH_chairman_of_the_people_a2: "Город сердца\n§gНацуме Ироха — искательница всех федеральных немцев и строительница, создающая комфортный рай для всех народов. Светлый марш всех федеральных народов будет сохранен.§!"
  GEH_Iroha_trait_a: "Командир танка\n§gНаш твердый лидер, всегда идущий на танке, где бы и когда бы то ни было.§!"
