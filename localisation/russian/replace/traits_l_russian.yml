  BA_robot_general: "Робот"
  BA_robot_general_desc: "§LУ этого командира может быть грубое металлическое тело, или изящное тело из наномашин, или даже искусственная кожа, неотличимая от человеческой. Но какова бы ни была его форма, этот командир — безжизненная машина.§!"
