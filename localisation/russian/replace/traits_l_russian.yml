  COU_KAYA_TRAIT: "Честолюбивая\n§gШирануи Кая — честолюбивая особа, жаждущая власти. Люди описывают ее как человека, который ради власти поможет в чем угодно.§!"
  COU_the_fail: "Высокомерная неудачница\n§gСудьба амбиций, искаженных властью, всегда предрешена. Пришло время заплатить горькую цену за это высокомерие.§!"

