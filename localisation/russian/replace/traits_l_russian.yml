  # Генеральный студенческий совет
  COU_dictator: "Председатель Генерального студенческого совета\n§gДолжность Председателя Генерального студенческого совета никогда не бывает легкой.§!"
  COU_arona_notgood: "Переработка\n§gПредседатель Генерального студенческого совета загнана на край пропасти. Не только система управления полностью рухнула из-за Великого Перемещения, но даже после более чем двух месяцев попыток контроля академии отказываются от координации и контроля. Председатель продолжала перерабатывать, готовая на все, чтобы снова контролировать Кивотос, снова и снова, но... ее состояние немного серьезно. Нет, очень серьезно.§!"
  COU_dictator_rin: "Исполняющая обязанности Председателя Генерального студенческого совета\n§gДолжность Председателя Генерального студенческого совета никогда не бывает легкой. Даже если это временно.§!"
