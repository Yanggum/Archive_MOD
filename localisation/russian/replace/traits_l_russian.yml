  # Геенна (Дисциплинарный комитет)
  GEH_military_chairman: "Военный администратор"
  GEH_military_chairman_2: "Лидер военных вождей"
  GEH_military_chairman_ako: "Гражданка в форме\n§gСорасаки Хина — не просто военный лидер. Она — Председатель Федеративной Республики и ярая сторонница парламентаризма; она передает большую часть власти совету и поддерживает технократов.§!"
  GEH_military_chairman_amau: "Гражданка в форме\n§gСорасаки Хина — не просто военный лидер. Как председатель совета, защищающая конституцию Федеративной Республики, она стала символом закона, порядка и незыблемой контролируемой демократии.§!"
  GEH_military_chairman_c: "Председатель Комитета национальной обороны\n§gСорасаки Хина посвятила себя обороне Академии Геенны и защите родины. Как Председатель Комитета национальной обороны, сдерживающий фактор Исполнительного департамента, она прилагает всесторонние усилия для стабильной защиты государства Геенны.§!"
  GEH_military_chairman_cl: "Председатель Студенческого совета Геенны\n§gСорасаки Хина — председатель студенческого совета Академии Геенны и глава Дисциплинарного комитета. Некоторые критикуют ее как диктатора, другие называют слишком слабой. Но есть один неоспоримый факт: то, что Геенна может продолжать существовать такой, какая она есть сегодня, зависит от решений Сорасаки Хины.§!"
  GEM_horns_are_new_wings: "Рога — это новые крылья\n§gТо, что у тебя выросли рога, не значит, что ты не можешь быть лидером германского народа. Она стала гордым лидером всех немцев, и теперь Ханума Макото навсегда останется в памяти как Фюрер Германии.§!"
  GEM_horns_are_new_wings_chiaki: "Рога — это новые крылья\n§gТо, что у тебя выросли рога, не значит, что ты не можешь быть лидером Европы. Она стала гордым лидером всей пангерманской сферы, включая Германию, Баварию и Рейн, и теперь Мотомия Тиаки навсегда останется в истории.§!"
  b_tjsehqnwkd_start: "Глава Дисциплинарного комитета"
  b_tjsehqnwkd_week: "Стальная глава Дисциплинарного комитета"
  b_tjsehqnwkd: "Стальная глава Дисциплинарного комитета"
  b_tjsehqnwkd2: "Стальная глава Дисциплинарного комитета"
  b_tjsehqnwkd_play_woman_of_iron_skin: "Характерная артистка Геенны-Баварии"
  b_tjsehqnwkd3: "Первая Великая Догма\n§gСлова и действия Сорасаки Хины всегда правильны. Ее лидерство стало «великой догмой», которой должен следовать каждый гражданин государства.§!"
  b_tjsehqnwkd3_tooltip: "Первая Великая Догма"
  b_tjsehqnwkd_hina_week: "Глава Дисциплинарного комитета из мягкого железа"
  GEH_not_you_plz_X: "Глава Дисциплинарного комитета медицины"
  GEH_not_you_plz_A: "Глава Дисциплинарного комитета гастрономии"
  GEH_not_you_plz_B: "Глава Дисциплинарного комитета горячих источников"
  GEH_principle_trait_A: "Теоретик порядка"
  GEH_principle_trait_B: "Сложный посредник"
  GEH_principle_trait_C: "Теоретик гармонии"
  GEH_ako_trait_Z: "Главный администратор\n§gЗаменяя ушедшую Сорасаки Хину, временно исполняет обязанности главы Дисциплинарного комитета.§!"
  GEH_ako_trait_Y: "Студенческий председатель разума\n§gАмау Ако, после бывшего главы Дисциплинарного комитета Сорасаки Хины и бывшего председателя Пандемониума Ханумы Макото, стала студенческим председателем Геенны. Теперь она пытается заботиться о всей Геенне, а не только о Сорасаки Хине как о личности.§!"
  GEH_ako_trait_X: "Игривая глава Дисциплинарного комитета\n§gАмау Ако, преемница бывшего главы Дисциплинарного комитета Сорасаки Хины, стала главой Дисциплинарного комитета Геенны. Она старается заполнить пустоту, оставленную Хиной, и иногда снимает стресс от работы, давая неразумные административные приказы Широми Иори.§!"
  GEH_ako_trait_0: "Главный администратор"
  GEH_ako_trait_1: "Реформатор Дисциплинарного комитета"
  GEH_Sorasaki_Hina_trait: "Сталь, защищающая Геенну"
  GEH_Emergency_Medicine_Club: "Клуб неотложной медицины"
  GEH_Emergency_Medicine_Sena_Club: "Глава Клуба неотложной медицины"
  GEH_artist: "Художница"
  GEH_bauhaus: "Баухаус"
  GEH_degenerate_art: "Дегенеративная художница"
  GEH_composer: "Классический композитор"
  GEH_purist: "Пуристка"
  GEH_purist_l: "Дамба отечества\n§gПредседатель студенческого комитета, Широми Иори, — это сито, которое отфильтровывает бесчисленные «загрязнения национальной культуры», и земледелец, возделывающий почву, на которой вырастет нация.§!"
  GEH_purist_r: "Восстановительница Геенны\n§gКонтролерша Широми Иори — это плавильный котел, который слил цивилизацию Геенны и немецкую цивилизацию, и реконструктор цивилизации, искоренивший дегенеративную культуру Геенны-Германии и стабилизировавший отечество.§!"
  GEH_paranoia_ako: "Параноидальная хинофилка"
  GEH_morning_star_club_ako: "Глава Клуба Утренней Звезды"
  GEH_paranoia_ako_bad: "Сломленный главный администратор"
  GEH_paranoia_ako_good: "Вечная спутница Хины"
  GEH_friendly_sociopath: "Дружелюбная социопатка\n§g«Хина» в совершенстве имитирует вплоть до тиков и жестов настоящей Сорасаки Хины, и внутри офиса Дисциплинарного комитета играет роль «идеального начальника», которым восхищаются главный администратор и все члены. Но для нее прямо сейчас все граждане — не более чем подходящие фигуры, которые должны использоваться для Дисциплинарного комитета Геенны; и в ее обращении с теми, кто не является членом комитета, не чувствуется ни капли человечности.§!"
  GEH_friendly_sociopath_tooltip: "Дружелюбная социопатка"
  GEH_successor_of_hina: "Преемница Хины"
  GEH_puppet_of_prefect_team: "Бессильная марионетка\n§gЕдинственная власть Нацуме Ирохи — подписывать утверждение на документах совета Офиса планирования.§!"
  GEH_last_hope_of_prefect_team: "Последняя надежда Дисциплинарного комитета"
  GEH_puppet_leader_hina: "Лидер-марионетка\n§gЕсли Ако будет заниматься всем, зачем беспокоиться об управлении страной?§!"
  GEH_ako_partner_leader_hina: "Спутница Ако\n§gПока Ако рядом с ней, Хина никогда не сломается.§!"
  GEH_pioneer_of_science: "Пионер науки\n§gСистема советов развивается с целью догнать Миллениум. Несмотря на любые трудности, мы достигнем науки и технологий Миллениума.§!"
  GEH_yumeji_no_hana: "Цветок на пути грез\n§gСорасаки Хина полностью победила неприятие к Ако, широко распространившееся от разведывательной секции Дисциплинарного комитета до центральной партии Дойчланда, и добилась счастья для обеих.§!"
  GEH_the_terrible: "Гром"
  GEH_the_guardian_of_freedom: "Хранительница свободы"
  GEH_puppet_leader_hina_bad: "Председатель-марионетка\n§gСорасаки Хина управляет государством не по своей воле; она не более чем символический председатель, представляющий «волю масс».§!"
  GEH_military_chairman_hina: "Неудавшийся военный администратор"
  GEH_iori_trait_c_l: "Председатель Студенческого комитета Геенны\n§gПосле трагического исчезновения Сорасаки Хины Широми Иори выступила вперед с призывом защищать «чистую культуру Кивотоса». Она больше не просто глава Исполнительного департамента: она председатель, ведущая всех кадетов Геенны. Под ее руководством Геенна будет поклоняться превосходству кивотосцев с Ореолом и возродится как мощное военное государство, исключающее любое внешнее влияние, загрязняющее родину.§!"
  GEH_iori_trait_c_r: "Новый контролер\n§gТрагедия Сорасаки Хины оставила в Геенне глубокую рану и необходимость исцеления. Широми Иори поднялась, чтобы снова поднять эту разбитую родину. Она хочет очистить весь хаос и загрязнение, которые сломили Хину, и доказать, что только железный порядок может спасти Геенну.§!"
  GEH_celestial_revolution_trait: "Культурная революция"
  GEH_celestial_revolution_trait_1: "Культурная революция"
  GEH_celestial_revolution_trait_2: "Культурная революция"
  GEH_celestial_revolution_trait_B: "Жажда свободы"
  GEH_celestial_revolution_trait_C: "Жажда порядка"
  GEH_saint_gehenna_academy_A: "Председатель Студенческого совета Геенны\n§gХатами Эрика считается одной из самых благожелательных и ориентированных на порядок фигур в Геенне, где исчезла Сорасаки Хина. Теперь, как председатель студенческого совета, она сотрет шрамы безумия и хаоса и выпрямит Академию Святой Геенны.§!"
  GEH_saint_gehenna_academy_B: "Председатель Студенческого совета Геенны\n§gХиномия Чинацу была объявлена «предательницей» в разгар безумия за обнаружение предателей и была на грани потери почти всей своей власти. Однако благодаря постоянным усилиям по улучшению своего имиджа ее искренность достигла цели; и теперь, в Академии Святой Геенны, она останется как та, кто близко помнит Сорасаки Хину.§!"
  GEH_saint_gehenna_academy_C: "Председатель Студенческого совета Геенны\n§gАйкиё Фуука считается самой необычной кандидаткой в председатели студенческого совета Геенны. Даже в хаосе она стремилась только к тому, чтобы накормить студентов Геенны, и в результате завоевала большую базу поддержки. Рассказывают, что в период выборов она получила восторженную поддержку Клуба гурманских исследований и что почти вся пропаганда была сделана этим клубом.§!"
  GEH_eternal_hina_sorasaki: "Наш вечный глава Дисциплинарного комитета\n§gСорасаки Хина исчезла, но мы решили возвести ее в ранг нашего вечного главы. Комитет Сорасаки Хины будет направлять и защищать государство, используя слова Сорасаки Хины из прошлого и уже установленную методологию «сорасакизма».§!"
  GEH_morning_star_club_A: "Добрый студенческий председатель\n§gЁдзакура Кирара считается самой благожелательной фигурой из-за множества граней, проявленных ею во время кампании. Возглавляя социальный клуб «Сияй-Сияй», она завоевала большую популярность с пропагандой «Юность Геенны».§!"
  GEH_morning_star_club_B: "Начальник снабжения и студенческий председатель\n§gАйкиё Фуука получила высокую поддержку среди кандидаток в студенческие председатели Геенны. Она стремилась только к тому, чтобы накормить студентов Геенны, и в результате завоевала большую базу поддержки. Рассказывают, что в период выборов она получила восторженную поддержку Клуба гурманских исследований и что почти вся пропаганда была сделана этим клубом.§!"
# Красная Зима
  hate_soviet: "Антисоветские настроения\n"
  b_tjrlwkd: "Товарищ Черино, Генеральный секретарь"
  RED_cherino_small_trait: "Директор Секретариата"
  RED_bright_polar_star: "Багровая Полярная звезда революции"
  RED_bright_polar_star_desc: "\n §L«Откуда происходит прогресс цивилизации и развитие истории, то есть «социальная трансформация»? — От накопления противоречий в обществе».\n\n Ренка и Черино наконец-то прозрели. Черино стала истинной революционеркой и, стоя в центре академии, в ядре «единства и сплоченности», сияет решимостью. Студенты и массы с Черино в центре формируют стальную солидарность!\n\n Но это не значит, что Черино, как прежде, насаждает угнетение и тиранию. Народ всегда мог бы свергнуть ее и изгнать, но лидерство, которое проявила Черино, не позволяет этого. Путем собственной идеологической борьбы и изучения доктрины Черино перековала себя и добилась ослепительного успеха: разрушила внутренние противоречия Красной Зимы, такие как авторитарные организационные структуры, конфликты с местными жителями, разрыв между идеологией и реальностью или множественные промышленные и экономические противоречия, растворяя старое общество в новом.\n\n Черино возродилась как путеводительница. Массы, блуждавшие среди противоречий, наконец нашли «Полярную звезду революции» и крепко сжали ее в руках. Раз у нас есть направление, теперь нужно двигаться вперед!§!"
