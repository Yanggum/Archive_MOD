  Черты пути неприсоединения/коммунизма Ару
  HEU_gehenna_german_culture_trait: "Защитница германского народа"
  HEU_aru_depression_1: "Депрессивное расстройство\n§gКогда она одна, неизвестно, но по крайней мере перед персоналом Агентства 68 она может изобразить улыбку. Возможно, с усилием она сможет это преодолеть. По крайней мере, Ару так считает.§!"
  HEU_aru_depression_2: "Депрессивное расстройство средней-тяжелой степени\n§gНе потому ли все страдают, что я все еще жива? Не был бы мир счастливее, если бы я исчезла? Для начала, почему я здесь? Почему я должна оставаться здесь и смотреть, как другие умирают из-за меня?§!"
  HEU_aru_chroma_1: "§RТяжело ранена§!\n§gБудучи испорченной Хромой и превратившись в террористку, Ару остается без сознания, лежа в больничной кровати...§!"
  HEU_aru_chroma_2: "Террорификация\n§gДаже будучи испорченной Хромой, она все еще ценный босс, подруга и компаньонка для членов Агентства 68.§!"
  HEU_grand_prince_of_luxembourg: "Великая герцогиня люксембуржцев\n§gРикухатима Ару, как основательница Дома Рикухатима, взошла как великая герцогиня Великого Герцогства Люксембург. В ознаменование того, что она получила герцогский трон путем всенародного избрания, титул был установлен как «Великая герцогиня люксембуржцев», а не «Великая герцогиня Люксембурга».§!"
  HEU_grand_prince_of_luxembourg_alt: "Великая герцогиня люксембуржцев\n§gПутем компромисса с Коммунистической партией становится нединастическим, ненаследственным монархом; если она отречется или умрет, Люксембург будет преобразован в республику.§!"
  HEU_benriya_leader_trait: "Фактический лидер Агентства 68\n§gПосле инцидента с заточением Ару стала очень пассивной в политике; скорее, «ей надоела политика». Теперь ты должен вести агентство.§!"
  HEU_trinity_leader_trait: "Исполняющая обязанности Хост Тринити\n§gПосле Закона о Союзе лидер фракции Йоханн и командир Госпитальерского ордена стали лидерами Тринити, так что это почетная должность, которую премьер-министр занимает номинально.§!"

