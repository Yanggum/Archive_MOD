  medical_officer_desc: "§LОн обучен как медицинский офицер.§!"
  powerful_sublime: "Могущественное возвышенное"
  powerful_sublime_desc: "§LСогласно некоторым теориям, студентки Кивотоса являются аватарами божественного, а ореол был бы отметкой, раскрывающей святость, стоящую за их существом. Большинство студенток Кивотоса после Великого Перемещения используют вспомогательные устройства из-за нехватки мистики в земной среде; но некоторые, благословленные великой силой возвышенного, могут воспроизводить фрагменты этой грозной мистики даже на этих бесплодных землях, при условии достаточной поддержки.§!"
  legendary_sublime: "Легендарное возвышенное"
