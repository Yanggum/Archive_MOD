 #Правые
 USA_rising_exiled_germans_state: "Восстание изгнанных немцев"
 USA_rising_exiled_germans: "Беспорядки немцев в Америке"
 USA_rising_exiled_germans_1st: "Перегруппировка правых"
 USA_rising_exiled_germans_2st: "Расширение восстания"
 USA_rising_exiled_germans_3st: "Окончательное решение"

 USABA_revolutionaries_of_the_nation: "Революционеры нации"
 USABA_strong_propaganda: "Сильная пропаганда"
 USABA_expansion_of_influence_in_america: "Расширение влияния в Америке"
 USABA_destruction_of_jewish_groups: "Уничтожение еврейских групп"
 USABA_rise_to_power: "Приход к власти"

 USABA_revolutionaries_of_the_nation_desc: "Два поражения и бегство из Европы. Все это было испытанием для нашей немецкой нации. Теперь, на этом далеком американском континенте, мы должны бороться за новое выживание. Мы — последние революционеры нашей нации, стоящие во главе судьбы немецкого народа."
 USABA_strong_propaganda_desc: "Американские СМИ после Великой войны превратились в инструменты популизма и сенсационности. Манипулировать ими в нашу пользу будет проще, чем кажется."
 USABA_expansion_of_influence_in_america_desc: "Мы должны превзойти многочисленные группы давления в Соединенных Штатах и расширить наше влияние любыми средствами: пропагандой, популизмом, теориями заговора или скандалами — всем, что необходимо."
 USABA_destruction_of_jewish_groups_desc: "Еврейские группы — наш сильнейший оппонент и исторические враги нашего народа. Путем постоянных атак и культа нашей милиции мы уничтожим их сети влияния."
 USABA_rise_to_power_desc: "Вот теперь действительно начинается. Соединенные Штаты Америки формируются горсткой европейских изгнанников — Немецким комитетом. Пришло время готовить национальную войну за отвоевание Европы."

 USABA_joining_hands: "Объединить усилия"
 USABA_compromise_plan: "План компромисса"
 USABA_controlling_the_far_right: "Сдерживать крайне правых"
 USABA_attacks_on_conspiracy_theories: "Атаки на теории заговора"
 USABA_limiting_german_militia: "Ограничить немецкую милицию"
 USABA_towards_a_new_era_in_america: "К новой эре в Америке"

 USABA_joining_hands_desc: "Для реальной трансформации Соединенных Штатов мы должны укрепить наше сотрудничество с европейскими изгнанниками — особенно немцами."
 USABA_compromise_plan_desc: "Наше правительство не может полностью интегрировать немцев, но может помочь им однажды вернуться на свои родные земли."
 USABA_controlling_the_far_right_desc: "Немецкий комитет явно вышел из-под контроля. Их бредовые теории и следующая за ними милиция представляют угрозу для будущего республики."
 USABA_attacks_on_conspiracy_theories_desc: "Их теории заговора слабы и легко опровергаются. Гитлер сбежал на Луну? Мы должны разоблачить отсутствие логики в их речах и демонтировать их базы поддержки."
 USABA_limiting_german_militia_desc: "Мы не можем позволить милиции действовать бесконтрольно. Национальная гвардия и правоохранительные органы должны сотрудничать, чтобы демонтировать эти экстремистские группы."
 USABA_towards_a_new_era_in_america_desc: "Наконец-то мы можем увидеть основы подлинной Америки. Новая эра наступает, и с ней мы развеем все тени."

 USA_rising_exiled_germans_3st_flag: "Началась Третья гражданская война в США"
 USA_rising_exiled_germans_3st_flag_NOT: "Третья гражданская война в США не началась"

 USABA_german_national_protection_law_tt: "Со временем §YПредставительный комитет немцев§! начнет свою собственную ветвь фокусов."
 USABA_german_ch: "Представительный комитет немцев"
 USABA_revolutionaries_of_the_nation_tt: "§gЛени Рифеншталь, бывший кинорежиссер в старой Германии, а теперь ключевая фигура среди изгнанников, будет приглашена в правительство.§!"

 USABA_towards_a_new_era_in_america_tt: "§YПредставительный комитет немцев§! больше не сможет завершить свою линию фокусов."

 USABA_german_ch_idea: "Представительный комитет немцев"
 USABA_german_ch_idea_modifier_tt: "Модификаторы §Y$USABA_german_ch_idea$§!:"

 USABA_german_government_restored: "Восстановление германского правительства"

