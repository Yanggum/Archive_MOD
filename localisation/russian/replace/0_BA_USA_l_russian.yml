 usa_chroma_event.1.t: "Установление временного правительства"
 usa_chroma_event.1.d: "После уничтожения Вашингтона неизвестными сущностями Соединенные Штаты погрузились в хаос. С исчезновением ядра правительства граждане запаниковали, и общественный порядок начал рушиться. Однако армия США не прекращала сопротивления до конца. Им с большим трудом удалось сдержать атаку таинственных врагов, известных как «Цвета».\n\nВо время этого кризиса лидерам и ключевым фигурам правительства удалось бежать на запад, пересекая Скалистые горы, и там они начали приготовления к восстановлению нации. В месте своего изгнания они учредили временное правительство и мобилизуют все оставшиеся ресурсы для подготовки к новой войне.\n\nНас ждет долгая война. Эта борьба с неизвестным врагом не закончится скоро и принесет великие жертвы и страдания. Но Соединенные Штаты сделали свой выбор. Мы выжили, и теперь мы будем двигаться вперед."
 usa_chroma_event.1.a: "Остановите их, используйте все необходимые средства!"
 usa_chroma_event.1.b: "К счастью, запад в безопасности."

 usa_chroma_event_1_tt: "§YВсе политики§! §Yотступят§! или присоединятся к §YВременному правительству [USA.GetFlag]§!.\n§YВсе военно-морские командиры§! §Yотступят§! или присоединятся к §YВременному правительству [USA.GetFlag]§!.\n\n"

 usa_chroma_event.3.t: "Победа Цветов"
 usa_chroma_event.3.d: "Хотя армия США яростно сопротивлялась, она не смогла сдержать атаку Цветов. Эти неизвестные сущности одну за другой сокрушали наши оборонительные линии, и теперь их присутствие приближается к нашему правительству в изгнании.\n\nК счастью, они, кажется, не хотят пересекать Скалистые горы. Их продвижение остановилось у подножия гор, давая нам возможность найти новое решение.\n\nНастало время объединить немногие оставшиеся территории и восстановить Соединенные Штаты. Наши ресурсы ограничены, но мы никогда не сдадимся. Мы должны найти способ вернуть свободу и процветание на эту землю."
 usa_chroma_event.3.a: "Сможем ли мы действительно добиться этого...?"

 usa_chroma_event.4.t: "Восстановление Конгресса и исполнительной власти США"
 usa_chroma_event.4.d: "После многочисленных кризисов нам удалось изгнать неизвестные сущности, Цвета, с нашей территории. Этот славный день останется в истории: целостность Соединенных Штатов восстановлена вновь!"
 usa_chroma_event.4.a: "Отлично!"

 usa_chroma_event.5.t: "Временное правительство?"
 usa_chroma_event.5.d: "Перед лицом внезапного вторжения неизвестных существ многие американские политики могут поддаться страху и помешать нашим военным операциям. Поступило предложение: отправить всех этих «пацифистов» за Скалистые горы и учредить Временную административную администрацию для размещения политиков и беженцев, устранив тем самым любые препятствия нашим военным усилиям."
 usa_chroma_event.5.a: "Да, мы применим экстремальные военные стратегии."
 usa_chroma_event.5.b: "Нет, даже если будет путаница, мы этого не допустим."
 usa_chroma_event.5.c: "У нас есть сила, чтобы твердо противостоять этой ситуации."

 USPG_john_nance_garner: "Джон Нэнс Гарнер"

