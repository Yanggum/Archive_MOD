 USABA_usa_event_5_idea: "Неизбирательные военные операции"
 USABA_usa_event_5_idea_desc: "Принудительный призыв гражданских, оккупация промышленных предприятий и зачистки в городских районах для предотвращения индоктринации: многие незаконные военные операции проводятся нами. Это решение, которого, к сожалению, мы не могли избежать."

