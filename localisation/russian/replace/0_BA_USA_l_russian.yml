 USABA_civil_war_idea_tt: "Будет удалено после окончания гражданской войны:\nМы не в состоянии гражданской войны"

 USABA_SOV_enter_american_civilwar: "Запросить поддержку у [SOV.GetFactionName]"
 USABA_soviet_equipment_shipments: "Отправка советского снаряжения"
 USABA_soviet_military_advisors: "Советские военные советники"
 USABA_soviet_recovery_aid: "Экономическая помощь для советского восстановления"
 USABA_subvert_soviet_control: "Сломать советский контроль"
 USA_soviet_team: "Американская Советская Социалистическая Республика"

 USABA_so_the_jews_are_the_problem: "Значит, евреи — это проблема?"
 USABA_so_the_jews_are_the_problem_desc: "Поражение Германии в Великой войне и нынешний упадок Соединенных Штатов... В конце каждого заговора всегда стоит еврей. Мы должны объявить их врагами американского народа!"
 USABA_so_the_jews_are_the_problem_tt: "В столице организована §YМилиция немецких националистов§!."
 USABA_so_the_jews_are_the_problem_red_tt: "\n§RЕсли после гражданской войны не будет быстро принят Закон о защите немецкого народа, правое ополчение и немцы в США превратятся в бунтовщиков!§!"

 USABA_german_ethnic_union_in_america: "Немецкий этнический союз в Америке"
 USABA_german_ethnic_union_in_america_desc: "В декабре 1935 года, после официального роспуска германского государства и краха его вооруженных сил, многие немцы бежали из европейской катастрофы в Соединенные Штаты. Мы должны принять их и расширить нашу милицию, чтобы подавить восстание в Бостоне."
 USABA_german_ethnic_union_in_america_tt: "В столице создаются §G6§! дивизий §YМилиции немецких националистов§!"

 USABA_german_national_protection_law: "Закон о защите немецкого народа"
 USABA_german_national_protection_law_desc: "Пока изгнанные немцы не смогут вернуться на свои земли, мы должны установить специальное законодательство, гарантирующее им «особый» статус в Соединенных Штатах."

 BA_end_USA_congress_tt: "§RКонгресс Соединенных Штатов приостановлен.§!\n§RСтабильность будет снижаться в зависимости от поддержки демократических партий.§!"

