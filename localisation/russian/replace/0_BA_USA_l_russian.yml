# События

 USA_recover_from_2nd_great_depression_tt: "§Y$USA_recover_from_2nd_great_depression_categorie$§!: будут деактивированы все связанные промышленные решения."

 usa_chroma_event.2.t: "Экономическое восстановление прервано"
 usa_chroma_event.2.d: "Поскольку наша страна подвергается нападению, мы не можем продолжать планы экономического восстановления. Возможно, мы сможем возобновить их, если вернется мир, но сейчас мы должны сосредоточиться на военном производстве."
 usa_chroma_event.2.a: "Воспользуемся военным бумом."

 usa_event.1.t: "Заявление перед Конгрессом"
 usa_event.1.d: "Захватчики из другого мира оккупировали европейский континент, угнетая его народы.\n\nМы оставались в стороне не из страха, а чтобы подготовить идеальный момент для освобождения Европы — и всего человечества — безопасно.\n\nМы терпеливо ждали. Час освобождения настал!"
 usa_event.1: "Война, чтобы покончить со всеми войнами"

 usa_event.2.t: "Симптомы нового экономического кризиса"
 usa_event.2.d: "Исчезновение европейского рынка сильно ударило по нашим основным экспортным компаниям. Торговые пути закрылись, доходы рухнули, а мелкие инвесторы массово банкротятся. Их тревога распространяется, и признаки нового кризиса появляются повсюду."
 usa_event.2.a: "Это не к добру…"

 usa_event.3.t: "Предзнаменования краха"
 usa_event.3.d: "Крах европейского рынка не был простым временным шоком. Цепные банкротства торговых компаний увлекли за собой мелких инвесторов. Финансовая система сжимается, и основы американской экономики начинают дрожать. Все кажется в порядке, но под поверхностью... зреет катастрофа."
 usa_event.3.a: "Все будет хорошо... правда?"

 usa_event.4.t: "Вторая Великая депрессия"
 usa_event.4.d: "Инопланетяне разрушили старый порядок и оккупировали Европу, и вместе с этим активы, которыми наши инвесторы владели там, превратились в макулатуру. Биржи Лондона, Берлина и Парижа рухнули цепной реакцией, увлекая за собой Уолл-стрит. Нью-Йоркская фондовая биржа теперь — пустошь.\n\nТорговля с Европой полностью парализована, оставляя наши компании с неоплаченными товарами, закрытыми фабриками и беспрецедентным кризисом.\n\nВесь американский народ теперь понимает, что началась новая депрессия."
 usa_event.4.a: "Мы снова в 1929-м?"

 usa_event.5.t: "Улицы, которые больше не сияют"
 usa_event.5.d: "Порт Нью-Джерси, некогда сиявший огнями и маяками, потерял свой блеск. Европа, наш крупнейший рынок, исчезла. Торговые компании обанкротились, и порт опустел.\n\nНам не удалось создать новые трансатлантические торговые пути. Старые компании мертвы и не вернутся."
 usa_event.5.a: "Остались только руины."

 usa_event.6.t: "Город, полный безработных"
 usa_event.6.d: "Вашингтон, округ Колумбия, который раньше был оживленным центром, теперь окутан тьмой. Молодые люди бродят без работы, еды не хватает, грузовые поезда остановились, огни погасли.\n\nЗакрытые предприятия, рабочие на улице… Новый курс пытается ответить, но этого недостаточно. Восстановление кажется недостижимым."
 usa_event.6.a: "Больше Гувервиллей!"

 usa_event.7.t: "Гибель американского сельского хозяйства"
 usa_event.7.d: "Славный кукурузный пояс падает. После Пыльного котла и краха европейского рынка даже последние крупные агропредприниматели умоляют о помощи.\n\nНо мы не можем ее предложить. Европа пала, СССР больше не покупает у нас, животноводство рухнуло. Никто не нуждается в нашем урожае. Нам остается только смотреть, как они тонут."
 usa_event.7.a: "Житница Америки мертва."

 usa_event.8.t: "Крах финансового рынка"
 usa_event.8.d: "Банки сталкиваются с набегами вкладчиков и массовыми неплатежами. Финансовая система потеряла всякое доверие. Принудительные слияния, закрытия, бегство капитала…\n\nНи тайная печать денег, ни продажа мусорных облигаций больше не сработают. Конец."
 usa_event.8.a: "Мы в полной жопе!"

 usa_event.9.t: "Банкротство банка"
 usa_event.9.d: "National City Bank Нью-Йорка закрылся.\n\nБанкротства, потеря доверия, массовое изъятие вкладов, непосильные долги… Они больше не могли выдержать.\n\nТолпа перед банком никогда не увидит своих денег. Финансовая система Нью-Йорка смертельно ранена. Это событие знаменует начало экономического коллапса Америки."
 usa_event.9.a: "Они продержались дольше, чем я ожидал…"

 usa_event.10.t: "Антиправительственные протесты"
 usa_event.10.d: "Пригороды Нью-Йорка покрыты Гувервиллями. Безработица и нищета зашкаливают. Массовые протесты становятся жестокими, и полицейские репрессии уже в порядке вещей.\n\nКаждый раз, когда разгоняют один протест, рождается другой. Город — поле битвы. От нормальности ничего не осталось. Безнадежность царит."
 usa_event.10.a: "Сможет ли Рузвельт вселить надежду еще раз?"

 usa_event.11.t: "Смертный приговор"
 usa_event.11.d: "Ни тайная печать денег, ни продажа токсичных облигаций, ни национализация банков не предотвратили крах Федеральной резервной системы. Доллар потерял всякое доверие. Радикальные реформы провалились.\n\nНаши союзники больше не покупают нашу продукцию. Будущее мрачно. Остался только хаос разгневанного Юга."
 usa_event.11.a: "Боже, благослови Америку…"

 usa_event.12.t: "Немецкий мятеж в Детройте"
 usa_event.12.d: "Немецкие изгнанники и их ополчение заняли Детройт.\n\nПодавление их может развязать третью гражданскую войну. Мы должны решить."
 usa_event.12.a: "Это усложняется..."

 usa_event.13.t: "Немецкий мятеж распространяется на [USA_rising_exiled_germans_2st.GetName]"
 usa_event.13.d: "Беспорядки расширяются. Если мы не будем действовать, они усилятся еще больше."
 usa_event.13.a: "Какого черта…?"

 usa_event.14.t: "Третий кризис национального распада"
 usa_event.14.d: "Немецкие мятежники провозглашают себя Бригадой национального спасения и вербуют гражданских. Либо мы раздавим их сейчас, либо уступим их требованиям. Сейчас!"
 usa_event.14.a: "Это кошмар."

 usa_event.15.t: "Требование от [FROM.GetName] относительно Филиппин"
 usa_event.15.d: "Пока мы реагируем на европейский кризис, [FROM.GetName] требует от нас передачи контроля над Филиппинами.\n\nМы можем согласиться или готовиться к войне."
 usa_event.15.a: "Мы уступим Филиппины."
 usa_event.15.b: "Готовьтесь к войне."

 usa_event.16.t: "Вывод [FROM.GetName] с Филиппин"
 usa_event.16.d: "После нашего требования [FROM.GetName] вывел свои силы с Филиппин, и теперь у нас есть полный контроль, чтобы решить их судьбу."
 usa_event.16.a: "Отлично."

 usa_event.17.t: "[FROM.GetName] отклоняет нашу просьбу"
 usa_event.17.d: "Несмотря на наше щедрое дипломатическое сообщение, [FROM.GetName] решил вступить с нами в войну."
 usa_event.17.a: "Этого следовало ожидать."

 usa_event.19.t: "Совет Ирохи"
 usa_event.19.d: "Хааа... какая морока... но ладно, я им нужна, не так ли?"
 usa_event.19.a: "Сделаем, как она сказала!"

 usa_event.20.t: "Ибуки принимает приглашение на вечеринку"
 usa_event.20.d: "Очаровательный талисман Генны, Ибуки, приняла наше приглашение и присутствовала на вечеринке в посольстве.\n\nКак может существовать такое милое создание? Как и ожидалось, ее сопровождала команда охраны, и она радостно наслаждалась мероприятием."
 usa_event.20.a: "Ибуки — прелесть!"

 usa_event.21.t: "Промышленность решает проблему товаров народного потребления"
 usa_event.21.d: "После окончания Великой депрессии мы в крупных масштабах реорганизовали промышленность товаров народного потребления, которая производила избыток."
 usa_event.21.a: "Это только начало."

 usa_event.22.t: "Промышленность решает проблему строительства"
 usa_event.22.d: "После депрессии мы решили проблемы собственности капиталистов и оживили строительный сектор."
 usa_event.22.a: "Мы продвигаемся."

 usa_event.23.t: "Промышленность решает проблему производства"
 usa_event.23.d: "Мы преодолели проблемы, вызванные политикой принудительного трудоустройства, с помощью более эффективной стратегии найма."
 usa_event.23.a: "Мы почти закончили!"

 usa_event.24.t: "Промышленность решает все проблемы"
 usa_event.24.d: "Все побочные эффекты радикальной промышленной реформы преодолены. Вместо безработных и бродяг мы видим счастливые семьи на улицах."
 usa_event.24.a: "Наконец-то!!!"

 usa_event.25.t: "Реализация Закона о хранении продовольствия"
 usa_event.25.d: "С банкротством сельскохозяйственных предприятий мы должны освободить продовольственные резервы, накопленные в соответствии с законом о хранении.\n\nХотя граждане сначала не доверяли этой мере, теперь они увидят ее мудрость."
 usa_event.25.a: "Отлично."

 usa_new_civil_event.1.t: "Штат отделяется от Союза!"
 usa_new_civil_event.1.desc: "Некоторые штаты, организованные под Фронтом освобождения человечества, объявили о своем отделении от федерального правительства и отказе сотрудничать с нашей внешней политикой.\n\nМы должны ответить немедленно! Мы не потерпим разделения Союза!"
 usa_new_civil_event.1.a: "Уничтожьте их!"



