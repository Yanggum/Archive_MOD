######################Новые фокусы######################
######################################################
 USA_fast_train: "Военная реформа"
 USA_fast_train_desc: "Из-за чрезмерного разоружения наши вооруженные силы находятся в критическом состоянии как по количеству, так и по качеству. Мы уволим некомпетентных командиров и создадим эффективную военную программу, которая повысит уровень подготовки."

 USA_army_of_the_united_states_propaganda: "Парад армии Соединенных Штатов"
 USA_army_of_the_united_states_propaganda_desc: "В честь преодоления Великой депрессии мы организуем парад армии США и инициируем серию лоббистских усилий для получения от Конгресса средств на перевооружение."

 ##################################
 ########### Коммунистическая Америка ###########
 ##################################

 USABA_forced_wake_up: "Шоковая терапия"
 USABA_forced_wake_up_desc: "Мы временно принудительно запустим большое количество заводов и реорганизуем определенные промышленные сектора. Эта мера вызовет сопротивление, но сможет оживить экономику в краткосрочной перспективе."

 USABA_force_to_give_job: "Принудительное создание рабочих мест"
 USABA_force_to_give_job_desc: "Во время Великой депрессии на одних фабриках наблюдается избыток безработных, в то время как другим не хватает рабочих. Мы принудительно распределим безработных туда, где они больше всего нужны."

 USABA_every_worker_welfare: "Ввести рабочее нормирование"
 USABA_every_worker_welfare_desc: "Рабочие трудятся в тяжелых условиях и получают жалкую зарплату. Нынешние временные меры не будут устойчивыми и могут привести к забастовкам. Мы должны предотвратить эту ситуацию."

 USABA_replace_industry: "Реструктуризация промышленности"
 USABA_replace_industry_desc: "Чтобы справиться с нехваткой продовольствия и предметов первой необходимости, мы реструктурируем большую часть промышленности. Хотя некоторые капиталисты выступят против, эта мера жизненно важна для преодоления Великой депрессии."

 USABA_establish_government_industry: "Народные комиссары на предприятиях"
 USABA_establish_government_industry_desc: "Вторая Великая депрессия была вызвана крахом европейского рынка после Великой войны. Чтобы решить проблему разрушительного перепроизводства, государственное вмешательство в дела предприятий неизбежно."

 USA_bad_kivotos_RED: "Следовать за Красной Зимой"
 USA_bad_kivotos_RED_desc: "Это может показаться абсурдным и нелепым решением… но, возможно, оно не так уж и плохо."

 USA_bad_kivotos_RED_pudding: "Импортировать пудинг из Красной Зимы"
 USA_bad_kivotos_RED_pudding_desc: "Одним из главных коммерческих символов Федеративной академии Красная Зима является их школьный пудинг. Мы будем импортировать его и распространять по всей стране."

 USA_bad_kivotos_RED_more_pudding: "Национализировать производство пудинга"
 USA_bad_kivotos_RED_more_pudding_desc: "Пудинг Красной Зимы превосходен, но его транспортировка издалека создает высокие затраты. Мы создадим местные фабрики для расширения его распространения по всей стране."

 USA_be_red: "Подъем Коммунистической партии"
 USA_be_red_desc: "Демократическая партия не смогла ответить на Вторую Великую депрессию. Только Коммунистическая партия, эффективно справившаяся с кризисом, имеет легитимность для управления."

 USA_big_industry_plan: "Вторая реструктуризация промышленности"
 USA_big_industry_plan_desc: "Мы должны эффективно реорганизовать промышленную систему, которую мы создали как временную меру. Хотя это может вызвать временную неразбериху, в будущем это принесет большую производительность."
 USA_big_industry_plan_1_tt: "\nЧерез 90 дней после завершения этого фокуса:"
 USA_big_industry_plan_2_tt: "\nЧерез 180 дней после завершения этого фокуса:"
 USA_big_industry_plan_3_tt: "\nЧерез 270 дней после завершения этого фокуса:"
 USA_big_industry_plan_4_tt: "\nЧерез 360 дней после завершения этого фокуса:"

 USA_final_economic_plan: "Третья реструктуризация промышленности"
 USA_final_economic_plan_desc: "После успеха Второй реструктуризации промышленности пришло время применить новую экономическую идеологию и перепроектировать нашу промышленную систему."
 USA_final_economic_plan_tt: "Улучшит национальный дух в зависимости от ветки, завершенной во время Второй реструктуризации промышленности."

 USA_the_aggresive_comintern_2: "Антифашистская политика"
 USA_the_aggresive_comintern_2_desc: "Фашистская агитация распространяется по Европе после Великой войны, угнетая рабочих. Наш долг — искоренить эти режимы."

 USA_the_union_comintern_2: "Поддержка революции"
 USA_the_union_comintern_2_desc: "Рабочие мира живут в условиях угнетения. Наша обязанность — помочь им подняться и бороться за свое освобождение."

 usa_my_way: "Наш собственный путь"
 usa_my_way_desc: "Марксизм-ленинизм был испорчен и искажен диктаторами. В отличие от тоталитарных режимов, называющих себя коммунистическими, мы построим подлинное утопическое государство для рабочих."

 USA_the_comintern: "Пересмотр внешней политики"
 USA_the_comintern_desc: "Пока мы решали наши внутренние проблемы, мир кардинально изменился. Пришло время посмотреть вовне."

 USA_the_aggresive_comintern: "Агрессивная внешняя политика"
 USA_the_aggresive_comintern_desc: "Международная обстановка хаотична. Для ее стабилизации нам нужна решительная и наступательная внешняя политика."

 USA_the_union_comintern: "Примирительная внешняя политика"
 USA_the_union_comintern_desc: "Решение международных конфликтов насилием принесет только новые проблемы. Мы должны подходить к этим напряжениям с дипломатией и умеренностью."

 USA_modified_capitalism: "Модифицированный капитализм"
 USA_modified_capitalism_desc: "Государство не должно оставаться в стороне от экономики, но и не должно вмешиваться чрезмерно. Эта стратегия может помочь исправить противоречия капитализма."

 USA_economic_interventionism: "Полностью плановая экономика"
 USA_economic_interventionism_desc: "Уже недостаточно вмешиваться в ключевые сектора: государство должно контролировать всю экономику, чтобы уравновесить спрос и предложение, избегая кризисов, подобных Великой депрессии."

 USA_sov_economy_together: "Промышленное развитие США-СССР"
 USA_sov_economy_together_desc: "СССР добился ускоренной индустриализации с помощью своего пятилетнего плана, хотя и пожертвовал сельским хозяйством. Совместное промышленное развитие принесет пользу обеим странам."

 USA_sov_factory_together: "Совместное развитие военной промышленности"
 USA_sov_factory_together_desc: "В дополнение к гражданскому развитию, мы будем сотрудничать с СССР в военной промышленности. Это поможет противодействовать годам разоружения."

 USA_red_team: "Неожиданный выбор"
 USA_red_team_desc: "Европейцы, существа из другого мира… даже мы сами не ожидали такого решения. Но если что-то и ясно, так это то, что они проиграют… а мы победим."
 USA_add_dog: "Пригласить Серебряный легион"
 USA_add_dog_desc: "Мы оформим приглашение фашистским движениям, набирающим влияние в Соединенных Штатах, чтобы объединить силы для решения этой критической ситуации."

 USABA_fireside_chats: "Продолжить беседы у камина"
 USABA_fireside_chats_desc: "С 1933 года беседы у камина были серией вечерних радиообращений президента Франклина Д. Рузвельта. Знакомыми и близкими миллионам граждан словами они говорили о преодолении Великой депрессии и страхах перед чрезвычайным положением. Теперь радио поведет нас и во время этой второй великой депрессии."

 USABA_develop_corn_belt: "Закон о чрезвычайном продовольственном резерве"
 USABA_develop_corn_belt_desc: "С неминуемым крахом крупных агропромышленных предприятий кукурузного пояса мы должны предвидеть будущий продовольственный кризис, накапливая резервы и гарантируя снабжение предметами первой необходимости."
 USA_2nd_great_depression_4th_end_of_agriculture_endflag: "Банкротство сельскохозяйственных предприятий"

 USABA_maintenance_of_isolation_policy: "Сохранять изоляционизм"
 USABA_maintenance_of_isolation_policy_desc: "Соединенные Штаты будут дистанцироваться от хаоса и иностранных кризисов, чтобы сосредоточиться на собственных проблемах. Мы не будем вмешиваться в международные конфликты и сосредоточимся на экономическом восстановлении и внутренней стабильности. Минимизируя внешние влияния, мы будем стремиться к национальной самообеспеченности."
 USABA_maintenance_of_isolation_policy_desc_cst: "§gНачинается подготовка плана экономической самообеспеченности США.§!"

 USABA_massive_bailout: "Массовое финансовое спасение"
 USABA_massive_bailout_desc: "Чтобы предотвратить полный крах финансовой системы, мы осуществим масштабный план спасения. Мы спасем банки и ключевые отрасли, чтобы восстановить доверие народа и остановить экономический спад. Это будет первый шаг к восстановлению."

 USABA_government_propaganda: "Правительственная пропаганда"
 USABA_government_propaganda_desc: "Правительство запустит интенсивную пропагандистскую кампанию, чтобы вселить надежду и уверенность в граждан. Мы будем использовать все доступные средства, чтобы успокоить социальный хаос и укрепить народную поддержку."

 USABA_contact_with_opposition: "Связаться с оппозицией"
 USABA_contact_with_opposition_desc: "Мы будем искать двухпартийное сотрудничество, связавшись с оппозицией. Во времена кризиса политическая стабильность является ключом. Мы выслушаем их предложения и вместе решим ситуацию, способствуя национальному единству."

 USABA_blurring_focus: "Стратегическое размытие"
 USABA_blurring_focus_desc: "Правительство обнародует множество вопросов, чтобы рассеять общественное внимание. Так мы снизим политическое давление и ослабим тревогу граждан. Мы не позволим народу понять масштабы кризиса, уменьшая социальные конфликты."

 USABA_secret_economic_program: "Секретная экономическая программа"
 USABA_secret_economic_program_desc: "Мы проведем непубличные экономические меры. При молчаливой поддержке оппозиции мы выпустим токсичные облигации и создадим деньги для поддержания государственных финансов. Мы выиграем немного времени."

 USABA_unrestricted_inflation_permitted: "Разрешить неограниченную инфляцию"
 USABA_unrestricted_inflation_permitted_desc: "Мы позволим безудержную инфляцию для оживления экономики. Даже если ценность валюты будет принесена в жертву, мы уменьшим бремя долгов и стимулируем потребление. Это радикальная, но необходимая мера."
 USABA_regression_strategy_loweffect_tt: "Уменьшает количество §Yгражданских заводов§!, ликвидируемых при завершении §Y$USABA_regression_strategy$§!"

 USABA_expansion_of_state_authority: "Делегировать полномочия штатам"
 USABA_expansion_of_state_authority_desc: "Перед лицом неспособности федерального правительства решить кризис, мы передадим власть штатам. Каждый штат будет решать свои собственные проблемы, снимая часть центрального политического давления."

 USABA_regression_strategy: "Стратегия реверсии"
 USABA_regression_strategy_desc: "Отказываясь от современной экономики, мы вернемся к системе самообеспечения. Мы реорганизуем наши ресурсы и промышленность, чтобы гарантировать выживание страны. С простой и стабильной системой мы оставим позади рухнувший финансовый сектор."

 USABA_american_reindustrialization: "Американская реиндустриализация"
 USABA_american_reindustrialization_desc: "Чтобы оживить нашу экономику, мы проведем политику массовой реиндустриализации. Мы реструктурируем производственную систему, ориентированную на промышленность, начиная новый экономический подъем."
 USABA_american_reindustrialization_desc_cst: "Разблокирует серию решений для промышленного восстановления Соединенных Штатов."

 USA_devil_economy: "Экономическое сотрудничество США-СССР"
 USA_devil_economy_desc: "Эсминец-ваниль (заполнитель)."

 USA_support_RED: "Поддержка Красной Зимы"
 USA_support_RED_desc: "Вишневая ферма, лол (заполнитель)."

 USA_support_SOV: "Поддержка СССР"
 USA_support_SOV_desc: "С поддержкой гиганта ничто не может остановить Советский Союз."

 USA_old_team_nuclear: "Проект Манхэттен"
 USA_old_team_nuclear_desc: "Мы подтвердили, что наше обычное оружие неэффективно против существ из другого мира. Нам нужна огневая мощь, превосходящая всякое воображение."

# Защита старого порядка
 USA_old_team: "Защитники старого порядка"
 USA_old_team_desc: "Пока существа из другого мира устанавливали новый порядок в Европе, Соединенные Штаты сопротивлялись. Теперь пришло время освободить европейцев — и человечество — от их страданий."

 USA_support_alies: "Поддержка союзников"
 USA_support_alies_desc: "Англия и Франция, изгнанные в свои колонии после потери территорий, объединили силы с целью отвоевать Европу. Мы должны оказать им военную поддержку, чтобы проложить путь к освобождению."

 USA_attack_COU: "Освобождение Нидерландов"
 USA_attack_COU_desc: "Низменные земли — единственные жизнеспособные ворота для входа США в оккупированную Европу. Мы освободим их угнетенный народ и проложим путь на континент."

 USA_support_GEK: "Поддержка Германии"
 USA_support_GEK_desc: "Германия была разделена и уничтожена в midst войны между двумя силами из другого мира. Мы поддержим немецких беженцев и обещаем освободить их родину."

 USA_support_north_europe: "Поддержка Северной Европы"
 USA_support_north_europe_desc: "Норвегия, Швеция и Дания страдают под исекайским вторжением и радикальными доктринами. Мы будем тайно помогать им, ожидая возможности искоренить красную чуму в Скандинавии."

 USA_attack_KAI: "Освобождение Соединенного Королевства"
 USA_attack_KAI_desc: "Хотя Соединенное Королевство потеряло свою территорию, его боевой дух сохраняется. Вместе с ними мы победим захватчиков из другого мира и восстановим их родину."

 USA_attack_MIL: "Освобождение Франции"
 USA_attack_MIL_desc: "Французы, некогда защитники свободы и равенства, были низведены до рабов бездушных машин. Освободим их и докажем, что демократия все еще жива."

 USA_attack_TRM: "Освобождение Восточной Германии"
 USA_attack_TRM_desc: "Нацисты предали человечество, сотрудничая с захватчиками. Пришло время вершить правосудие!"

 USA_attack_GEH: "Освобождение Западной Германии"
 USA_attack_GEH_desc: "Трансмерные демоны стреляли по гражданским лицам без всякой причины. Мы освободим немцев от их тирании и полностью изгоним их."

 USA_support_FIN: "Поддержка Финляндии"
 USA_support_FIN_desc: "Финляндии удалось вернуть свою территорию от исекайских захватчиков, но ее военные возможности ограничены. Поддерживая их, мы сможем использовать их как плацдарм для освобождения всей Скандинавии."

 USA_attack_RED: "Освобождение Северной Европы"
 USA_attack_RED_desc: "После долгой подготовки настало время освободить Скандинавию. Сразимся с красной чумой и восстановим демократию!"

 USA_old_team_guardian: "Декларация победы"
 USA_old_team_guardian_desc: "Прошло много времени с начала тотальной войны против захватчиков из другого мира. Несмотря на их тактику и технологии, наша страна восторжествовала. Еще раз Соединенные Штаты победили тиранов, угрожавших свободе!"

 USA_marshall_plan: "План Маршалла"
 USA_marshall_plan_desc: "Хотя мы выиграли войну, Европа была опустошена. Если мы не вмешаемся, могут возникнуть новые конфликты. «План Маршалла», предложенный Джорджем Маршаллом, восстановит экономически европейские нации."

 USA_attack_abyss: "Финальная война"
 USA_attack_abyss_desc: "Наш истинный враг все это время был скрыт. Масштабы ужаса, с которым мы столкнулись, бросают вызов всякой логике... но мы должны сражаться."

 USA_Pax_Americana: "§CПакс§! §tАмерикана§!"
 USA_Pax_Americana_desc: "После бесчисленных войн и кровопролития, под руководством великой Америки мир пережил вторжение из другого мира и теперь залечивает раны. Наступила новая эра: мировой порядок, возглавляемый не колониальными империями, а Соединенными Штатами.\n§CПакс§! §tАмерикана!§!"
# Интеграция в Новый порядок
 USA_new_team: "Присоединиться к Новому порядку"
 USA_new_team_desc: "Европейские империи, доминировавшие в мировом порядке своей властью, рухнули после Великого Перемещения. Мы должны установить дружественные связи с теми, кто сверг старый порядок, и установить новый.\n§RРади высшего дела мы пожертвуем всем. Присоединишься ли ты к нам?§R"

 USA_new_team_TV: "Пропаганда"
 USA_new_team_TV_desc: "Все еще существует много скептиков относительно нашей дружбы с существами из другого мира. С помощью небольшой пропаганды мы можем подчеркнуть преимущества этого союза и заручиться их поддержкой."

 USA_new_team_marry: "Межмерный законопроект"
 USA_new_team_marry_desc: "Некоторые исекаи, пересекшие в США, находятся в правовом вакууме. Чтобы защитить их и предотвратить будущие конфликты, необходимо принять специальное законодательство, регулирующее их статус."

 USA_new_team_anime: "Показ аниме"
 USA_new_team_anime_desc: "Видео, на котором Кисаки выполняет высокоинтенсивную гимнастику, стало сенсацией среди всех возрастов. Чтобы разрушить стереотипы о существах из другого мира, мы покажем это видео по всей стране."

 USA_new_team_civilwar: "Окончательное решение"
 USA_new_team_civilwar_desc: "Мы уже приняли трудные решения ради лучшего будущего. Теперь пришло время действовать. Хотя все называют нас предателями человечества, однажды они узнают, что мы были правы.\n§RВсе готово. Пришло время бросить кости!§!"
 USA_new_team_civilwar_tt: "§RНемедленно вспыхивает гражданская война!§!"

 USA_new_team_threat: "Убеждение и компромисс"
 USA_new_team_threat_desc: "Некоторые члены Конгресса все еще выступают против нашего решения. Мы должны убедить их, что будущее, которое предлагает Новый порядок, более многообещающе."

 USA_new_team_help: "Запросить добровольцев Нового порядка"
 USA_new_team_help_desc: "Мы поддерживаем друг друга как братья. Теперь настал их черед проявить искренность."

 USA_blue_kivotos: "Демократия Нового порядка"
 USA_blue_kivotos_desc: "Среди существ из другого мира существуют политические системы, подобные нашей. Если мы будем сотрудничать с ними, мы избежим идеологических трений."

 USA_bad_kivotos: "Национализм Нового порядка"
 USA_bad_kivotos_desc: "Чтобы присоединиться к Новому порядку, возможно, нам придется отказаться от собственных убеждений, даже если они стоили веков борьбы и крови."

 USA_blue_kivotos_MIL: "Следовать за Миллениумом"
 USA_blue_kivotos_MIL_desc: "Научная школа Миллениум обладает несравненными технологиями даже среди исекаев. Их союз может подтолкнуть технологический прогресс Соединенных Штатов."

 USA_bad_kivotos_Eden: "Следовать за Эдемским договором"
 USA_bad_kivotos_Eden_desc: "Две, казалось бы, непримиримые нации объединились. Этот союз — сильнейший в мире исекаев, и мы присоединимся к нему, чтобы сохранить нашу национальную мощь."

 USA_bad_kivotos_COU: "Следовать за Студенческим советом"
 USA_bad_kivotos_COU_desc: "Студенческий совет был высшей властью среди наций другого мира. Мы поддержим его восстановление, чтобы получить влияние среди других академий."

 USA_bad_kivotos_GEM: "Следовать за Генной"
 USA_bad_kivotos_GEM_desc: "Мир всегда следовал закону сильнейшего. Генна понимает это лучше всех. Присоединимся к ним."

 USA_bad_kivotos_TRM: "Следовать за Тринити"
 USA_bad_kivotos_TRM_desc: "Они, с их благородным сердцем и ангельской внешностью, являются примером Нового порядка. Будем следовать за ними."

 USA_bad_kivotos_support_hina: "Поддержать Хину"
 USA_bad_kivotos_support_hina_desc: "Чем больше мы изучаем Генну, тем больше разочаровываемся… за исключением Дисциплинарного комитета. Будем следовать за их лидером, Хиной."

 USA_bad_kivotos_support_makoto: "Поддержать Макото"
 USA_bad_kivotos_support_makoto_desc: "Макото не особенно компетентна, но у нее бывают моменты большой проницательности. Она взяла под контроль ситуацию перед лицом анархических демонов, и это внушает доверие."

 USA_bad_kivotos_support_mika: "Поддержать Мику"
 USA_bad_kivotos_support_mika_desc: "Мика более эмоциональна и наивна, чем мы предполагали. Но слабое сердце не означает слабую силу. Будем следовать за ней."

 USA_bad_kivotos_support_hina_2: "Консультироваться с Дисциплинарным комитетом"
 USA_bad_kivotos_support_hina_2_desc: "Не только Хина компетентна. Комитет может помочь нам восстановить нашу страну после гражданской войны."

 USA_bad_kivotos_GEH_halo_infantry: "Совместные учения с Дисциплинарным комитетом"
 USA_bad_kivotos_GEH_halo_infantry_desc: "Дисциплинарный комитет тренировался до уровня, сравнимого с армией США. Совместные учения будут полезны для обеих сторон."

 USA_bad_kivotos_GEM_tank: "Принять тяжелые танки Генны"
 USA_bad_kivotos_GEM_tank_desc: "Тяжелые танки Генны, такие как Торамару, достойны копирования. Перепроектируем нашу танковую доктрину, взяв с них пример."

 USA_bad_kivotos_GEM_halo_infantry: "Комбинированные учения с Генной"
 USA_bad_kivotos_GEM_halo_infantry_desc: "Хотя у них нет сверхлюдей, военные технологии Генны превосходны. Воспользуемся этим для реформирования наших сил."

 USA_bad_kivotos_support_iroha: "Поддержать Ироху"
 USA_bad_kivotos_support_iroha_desc: "Ироха — один из немногих здравомыслящих людей в Хяккияко. Если мы последуем ее советам, мы преодолеем последствия войны."

 USA_bad_kivotos_support_ibuki: "Пригласить Ибуки"
 USA_bad_kivotos_support_ibuki_desc: "Существует ли кто-то более милый, чем она? Одно ее присутствие станет опорой для американского народа."

 USA_bad_kivotos_support_GEM_club: "Создать лобби клубов"
 USA_bad_kivotos_support_GEM_club_desc: "Несмотря на их репутацию, у клубов Генны есть талант. Поддержим их сетью лобби, чтобы они могли проявить себя наилучшим образом."

 USA_bad_kivotos_totalwar: "Объявить тотальную войну"
 USA_bad_kivotos_totalwar_desc: "Оставим старый порядок и посвятим себя новому. Не на словах, а на деле. Все должны участвовать."

 USA_bad_kivotos_support_TRM_club: "Сотрудничать с Книжным клубом"
 USA_bad_kivotos_support_TRM_club_desc: "Книжный клуб Тринити обширен и строг. Подписав официальный договор, мы разделим их обширные знания."

 USA_bad_kivotos_TRM_halo_infantry: "Совместные учения с Тринити"
 USA_bad_kivotos_TRM_halo_infantry_desc: "Хотя они мирные, студентки Тринити обладают большими военными способностями. Мы сосредоточимся на их превосходстве в поддержке союзников для проведения совместных маневров."

 USA_bad_kivotos_justice: "Сотрудничать с Департаментом юстиции"
 USA_bad_kivotos_justice_desc: "Департамент юстиции — это автономное полицейское подразделение с большой властью. Если мы будем сотрудничать с ними, мы искореним антинациональные силы."

 USA_bad_kivotos_justice_sword: "Меч Тринити"
 USA_bad_kivotos_justice_sword_desc: "Станем мечом Тринити. Устраним любую угрозу их порядку."

 USA_bad_kivotos_halo_infantry_2: "«Третий путь»"
 USA_bad_kivotos_halo_infantry_2_desc: "Объединим технологии Нового порядка с нашим опытом. Никто не шел этим путем… но мы пойдем."

 USA_bad_kivotos_GEH_hina_learn: "Пригласить Хину в Вест-Пойнт"
 USA_bad_kivotos_GEH_hina_learn_desc: "Дисциплинарный комитет держится, по сути, на Хине. Пригласим ее в нашу военную академию для развития ее талантов как командира."

 USA_bad_kivotos_GEH_halo_infantry_support: "Обучать Дисциплинарный комитет"
 USA_bad_kivotos_GEH_halo_infantry_support_desc: "Результативность Комитета ниже ожидаемой. Проинструктируем их по тактике и физической подготовке."

 USA_blue_kivotos_MIL2: "Гарнизонное соглашение США-Миллениум"
 USA_blue_kivotos_MIL2_desc: "Мы уничтожим красных мятежников, которые доставляют им столько проблем."

 USA_blue_kivotos_MIL3: "Исследовательское соглашение США-Миллениум"
 USA_blue_kivotos_MIL3_desc: "Их технологии кажутся взятыми из волшебной сказки."

 USA_blue_kivotos_MIL3_halo: "Исследовать неизвестное"
 USA_blue_kivotos_MIL3_halo_desc: "Возможность исследовать тайны исекаев и их внезапного появления."

 USA_blue_kivotos_MIL3_rocket: "Разработать спутники"
 USA_blue_kivotos_MIL3_rocket_desc: "Представлял ли ты себе оставить человеческий след в том небе, на которое раньше мог только смотреть издалека?"

 USA_bad_kivotos_halo_infantry_division: "Изучать пехоту с ореолом"
 USA_bad_kivotos_halo_infantry_division_desc: "Наши пушки кажутся фейерверками, наши танки — металлоломом. В будущем солдаты с ореолом будут доминировать на поле боя."

 USA_bad_kivotos_support_Mika: "Поддержать Мику"
 USA_bad_kivotos_support_Mika_desc: "Мы должны стать рыцарями, защищающими эту почти ангельскую фигуру."

 USA_bad_kivotos_Mika_fanclub: "Сформировать гвардию Мики"
 USA_bad_kivotos_Mika_fanclub_desc: "Следовать ее приказам без колебаний, убирать все препятствия. Это наша миссия."

 USA_support_brazil: "Поддержать Южную Америку"
 USA_support_brazil_desc: "С алхимией Бразилии Новый порядок падет легко."

 USA_support_spain: "Поддержать Пиренейский полуостров"
 USA_support_spain_desc: "Пиренейский полуостров имеет стратегическое значение. Если нам удастся, чтобы они присоединились, больше наций вступят в нашу международную лигу."

 USA_support_ITA: "Поддержать Италию"
 USA_support_ITA_desc: "Италия — единственная настоящая сила, оставшаяся в Европе. Мы должны объединиться с ними."

