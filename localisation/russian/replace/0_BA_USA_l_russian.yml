 USA_intervention_in_kivotos: "Интервенция против Нового порядка"
 USA_intervention_in_kivotos_desc: "Старый порядок рухнул. Мы должны вмешаться, чтобы не дать Новому порядку доминировать в мире."

 USA_war_plan_MIL: "План войны «Синий»"
 USA_war_plan_MIL_desc: "Французы яростно сопротивляются крайнему угнетению со стороны Миллениума. С их духом сопротивления даже подавляющая наука может быть преодолена."

 USA_war_plan_GEH: "План войны «Розовый»"
 USA_war_plan_GEH_desc: "Те, кто имеет демоническую внешность, или, возможно, сами демоны, являются сущностями, которые должны быть устранены в первую очередь."

 USA_war_plan_TRM: "План войны «Черный»"
 USA_war_plan_TRM_desc: "Союз с нацистами из другого мира — это явно античеловеческий акт. У нас есть священный долг: очистить нацистов-предателей и падших ангелов."

 USA_war_plan_GEK: "Операция «Возвращение Германии»"
 USA_war_plan_GEK_desc: "Немецкий Кригсмарине имеет волю вернуть свою родину, но у него недостаточно сил. Наша помощь имеет решающее значение для освобождения Германии."

 USA_war_plan_WIN: "План войны «Бирюзовый»"
 USA_war_plan_WIN_desc: "Что может быть ужаснее, чем коммунизм в союзе с сущностями из другого мира?"

 USA_war_plan_KAI: "План войны «Хаки»"
 USA_war_plan_KAI_desc: "Кто знает, что сделает корпоративное государство, которое начинает войны без оправдания? Единственное, что ясно: если мы позволим ему действовать, оно принесет лишь больше хаоса."

