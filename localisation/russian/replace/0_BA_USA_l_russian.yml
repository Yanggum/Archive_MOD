#기존 로컬 수정
 USA_continue_the_new_deal: "Пересмотреть Новый курс"
 USA_continue_the_new_deal_desc: "Пока Новый курс успешно продвигался, нас потрясла новость о том, что вся Европа оккупирована сущностями из другого мира. Теперь мы столкнулись со второй критической угрозой и должны встретить надвигающийся финансовый кризис."
 USA_reestablish_the_gold_standard: "Признать провал правительства"
 USA_reestablish_the_gold_standard_desc: "Признавая, что политика Нового курса, продвигаемая демократами, недостаточна для исправления текущей ситуации, мы примем меры по дальнейшей приватизации и расширению автономии. Так мы сможем переложить ответственность за этот кризис."

 USA_gold_standard: "Меры по приватизации"
 USA_send_lindbergh_to_germany: "Организовать авиаотряд Линдберга"
 USA_send_lindbergh_to_germany_desc: "Известный летчик выразил желание собрать немецких эмигрантов, служивших в ВВС во время предыдущей войны, чтобы изучить старые немецкие авиационные технологии. Поддержка этого предложения принесет нам пользу, расширив возможности наших военно-воздушных сил."
 USA_work_with_the_bund: "Поддержка немецких американцев"
 USA_work_with_the_bund_desc: "Четкое различие и соответствующая поддержка немецких эмигрантов продемонстрируют нашу позицию немецко-американскому сообществу. Убедимся, что они воспринимают нашу добрую волю."
 war_plan_black: "План войны «Черный»"

 USA_wartime_industry: "Быстрое перевооружение"
 USA_wartime_industry_desc: "Хотя нам удалось защитить нашу гражданскую промышленность, того же нельзя сказать о военной. Сейчас, когда анти-кивотосские настроения растут, пришло время быстро наращивать наш военный потенциал."

