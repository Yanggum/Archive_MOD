l_russian:
  # Фокусы
  ITA_request_control_of_french_territories: "Договор с Францией"
  ITA_request_control_of_french_territories_desc: "Теперь, когда Франция провозгласила восстановление метрополии, мы можем, в обмен на поддержку Франции, предложить договор, по которому французское правительство в изгнании уступит нам французские территории, когда вернется в метрополию."

  ITA_italy_first_desc: "Чтобы воплотить в жизнь великую славу Италии, нужна мощная вооруженная сила... Хотя Европа была охвачена войной и рухнула, слава Италии еще не пала."

  ITA_negotiate_italian_claims: "Укрепить Стрезский фронт"
  ITA_negotiate_italian_claims_desc: "Мы официально укрепим Стрезский фронт и построим треугольный союз между Италией, Францией и Соединенным Королевством. Теперь, когда колоссальная угроза нависла над Европой, пришло время оставить старые обиды и пожать друг другу руки."

  ITA_ratify_the_stresa_front: "Договор о европейской безопасности"
  ITA_ratify_the_stresa_front_desc: "Чтобы противостоять врагам Европы, требуется военное сотрудничество в более широком масштабе. Военное сотрудничество между Италией, Францией и Соединенным Королевством будет расширено, и в дальнейшем мы даже сможем проводить совместные военные учения."

  ITA_guarantee_austrian_independence: "Занавес, нависший над Европой"
  ITA_guarantee_austrian_independence_desc: "Враги из иного мира, появившиеся после падения Северной Европы, явно угрожают северу Италии. Как истинный лидер Стрезского фронта, Италия проведет твердую линию против захватчиков, завоевавших Европу, и продемонстрирует свою решимость решительным ответом."

  ITA_german_military_cooperation: "Принять немецких изгнанников"
  ITA_german_military_cooperation_desc: "Поскольку Германия рухнула в одно мгновение, мы можем включить в свой состав различных специалистов, включая немецких ученых, чтобы стимулировать научно-технический прогресс Италии."

  ITA_pact_of_steel: "Распустить Стрезский фронт"
  ITA_pact_of_steel_desc: "В европейском хаосе Стрезский фронт, импровизированное соглашение, больше не выгоден Италии теперь, когда Соединенное Королевство и Франция пали. Мы разорвем пакт и будем стремиться к экспансии на Балканы."

  ITA_treaty_with_germany: "Европейский технологический договор"
  ITA_treaty_with_germany_desc: "Поскольку Европа разрушена, а Соединенное Королевство и Франция пали, мы должны создать более прочную основу с новыми союзниками."

  ITA_human_fascism: "Декларация человеческого фашизма"
  ITA_human_fascism_desc: "Тот факт, что только Италия избежала Великого Перемещения, не может быть случайностью. Мы должны начать прыжок к объединению всего человечества и единой Европе. Настало время сделать великий первый шаг для человечества."

  ITA_human_fascism_tt: "[ROOT.GetNameWithFlag] не состоит в союзе ни с одной страной Кивотоса.\n§RЭто решение будет заблокировано навсегда, если [ROOT.GetName] вступит в союз со страной Кивотоса.§!"

  ITA_rise_of_pan_europeanism: "Подъем панъевропеизма"
  ITA_rise_of_pan_europeanism_desc: "Помимо итальянского национализма — Великой Италии, Римской империи — внутри Италии активно обсуждается панъевропеизм, направленный на решительное объединение всей Европы."

  ITA_europea_citizens: "Европейское гражданство"
  ITA_europea_citizens_desc: "Мы все живем в единой Европе. Мы должны отказаться от мелких националистических чувств прошлого и достичь великой европейской интеграции."

  ITA_comfort_more_comfort: "Утешение, еще утешение"
  ITA_comfort_more_comfort_desc: "Италия теперь окружена странами Кивотоса. Чтобы осуществить панъевропейскую амбицию, мы должны разбить эту тюрьму и продвинуться еще дальше на север."

  ITA_europea_army: "Европейская армия"
  ITA_europea_army_desc: "Чтобы реализовать амбиции всех европейцев, мы создадим Европейскую армию, набираемую по всей Европе. Наша армия станет самой стойкой и мощной на континенте и будет действовать для воплощения великого видения."

  ITA_europea_army_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+10.0%§!\n\n"

  ITA_one_europea: "Единая Европа"
  ITA_one_europea_desc: "Европа должна объединиться. Наше Панъевропейское государство провозгласит крестовый поход по всей Европе, объединив европейское человечество под одним флагом и одним лозунгом."

  # События
  PASTA_event.1.t: "Формирование Стрезского фронта"
  PASTA_event.1.d: "После того как [ITA.GetName] выполнила Стрезский договор, было решено расширить Стрезский фронт и превратить его в полноценную фракцию. Мы должны решить, присоединится ли наша страна к [ITA.GetName] или нет."
  PASTA_event.1.a: "За восстановление Европы"
  PASTA_event.1.b: "Нет, мы не собираемся присоединяться к Италии"

  PASTA_event.2.t: "[FROM.GetName] присоединяется к Стрезскому фронту"
  PASTA_event.2.d: "С решением [FROM.GetName] присоединиться к нашему Стрезскому фронту сплоченность между европейскими странами еще больше укрепляется."
  PASTA_event.2.a: "Объединяйтесь!"

  PASTA_event.3.t: "Стрезский фронт отклонен"
  PASTA_event.3.d: "[FROM.GetName] отказалась подписать наш договор, что стало серьезной неудачей в плане Стрезского фронта."
  PASTA_event.3.a: "Они думают выжить в одиночку?"

  PASTA_event.4.t: "Италия предлагает поддержать сопротивление Миллениума"
  PASTA_event.4.d: "[ITA.GetName] выразила намерение, что в обмен на помощь в нашей войне против Миллениума она желает получить уступку части территорий на юге Франции.\n\nЖестко сталкиваются две позиции: обеспечить союзника в войне против Миллениума, уступив несколько провинций, или отказаться, потому что мы не можем оставить французскую территорию."
  PASTA_event.4.a: "Нет, нужно отказаться."
  PASTA_event.4.b: "Это всего лишь несколько провинций."

  PASTA_event.5.t: "Франция отклоняет предложение"
  PASTA_event.5.d: "[FRA.GetName] отклонила договор, предусматривавший уступку южных территорий в обмен на наше участие в войне против Миллениума."
  PASTA_event.5.a: "Хм."

  PASTA_event.6.t: "Франция принимает предложение"
  PASTA_event.6.d: "[FRA.GetName] одобрила договор, по которому в обмен на наше участие в войне против Миллениума она уступит нам южные территории в будущем."
  PASTA_event.6.a: "Хорошо."

  PASTA_event.7.t: "Застойная атмосфера"
  PASTA_event.7.d: "После окончания Эфиопской войны итальянское общество погрузилось в глубокое молчание. Беспрецедентный факт того, что вся Европа была сметена странными пришельцами, был достаточен, чтобы повергнуть всю Италию в ужас.\n\nТеперь, когда эффект нашего контроля над прессой ослаб, все итальянские граждане только пытаются скрыть свой страх перед пришельцами с севера."
  PASTA_event.7.a: "Это страх, с которым мы должны столкнуться."

  PASTA_event.8.t: "Протесты итальянских фашистов!"
  PASTA_event.8.d: "Заявление [ROOT.GetName] о союзе с государствами пришельцев, возникшими после Великого Перемещения, потрясло фашистов, националистов и граждан всех слоев общества в Италии.\n\nНекоторые организовали анти-Кивотос демонстрации, и забастовки распространяются на промышленные объекты по всей Италии!"
  PASTA_event.8.a: "Не лезь в мою внешнюю политику!"

  italy.5.t: "Итало-венгерский технологический обмен"
  italy.5.b: "Мы не собираемся присоединяться к Италии."
  italy.6.t: "Итало-венгерский технологический обмен: принят!"
  italy.6.d: "Как мы и ожидали, Венгрия с готовностью приняла ряд технологических обменов. С новой угрозой, нависшей над Европой, Италия должна найти новый путь к выживанию."
  italy.7.t: "Итало-венгерский технологический обмен: отклонен!"
  italy.7.d: "Венгрия отклонила предложенный нами технологический обмен."

  # Национальный дух
  PASTA_signatories_of_the_stresa_idea: "Подписанты Стрезского фронта"
  PASTA_signatories_of_the_stresa_idea_desc: "В хаосе, последовавшем за высадкой Кивотоса в Европе, Стрезский фронт, импровизированный под руководством Соединенного Королевства, Франции и Италии, сталкивается с роспуском по мере того, как Соединенное Королевство и Франция входят в кризис."

  PASTA_ratify_the_stresa_front_idea: "Трехсторонний договор о безопасности"

  PASTA_shock_to_daejeon: "Шок Великого Перемещения"
  PASTA_shock_to_daejeon_desc: "Тот факт, что вся Европа была сметена сущностями из иного мира, был ужасающим ударом для Италии. Несмотря на цензуру СМИ, оправданную войной с Эфиопией, все итальянское население охвачено скрытым страхом."
  PASTA_shock_to_daejeon_tt: "При союзе со страной Кивотоса трансформируется:\nПри союзе со страной §YКивотоса§! возникают масштабные негативные эффекты."

  PASTA_human_fascism_idea: "Человеческий фашизм"
  PASTA_human_fascism_idea_desc: "Италия — единственная великая держава, которая избежала разрушения Европы, и возглавляет различные анти-Кивотос деятельности. Италия станет страной с явным предначертанием для Европы, нет: для всего человечества."
  PASTA_human_fascism_idea_tt: "§RНельзя вступать в союз со странами Кивотоса.§!"

  PASTA_pan_europea_FRA_idea: "Интеграция европейцев французского происхождения"
  PASTA_pan_europea_GER_idea: "Демонтаж германо-немецкого национализма"
  PASTA_pan_europea_HOL_idea: "Европейское восстановление Нидерландов"
  PASTA_pan_europea_SWE_idea: "Северное освобождение: Швеция"
  PASTA_pan_europea_NOR_idea: "Северное освобождение: Норвегия"
  PASTA_pan_europea_DEN_idea: "Северное освобождение: Дания"

  # Подсказки
  ITA_HUN_italy_same_tt: "§YИталия§! и §YВенгрия§! имеют одинаковую §Yидеологию§!."

