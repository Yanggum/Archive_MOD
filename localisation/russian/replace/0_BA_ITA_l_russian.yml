  form_pan_europea_CZE_tt: "Контролировать весь европейский регион §YЧехии§!"
  form_pan_europea_states_tt: "При выборе этого решения вы получаете ядро на §Yвсех контролируемых вами необходимых государствах§!"
  form_pan_europea_SWE_tt: "Контролировать весь европейский регион §YШвеции§!"
