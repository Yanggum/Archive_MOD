japanese_fascism: "Японские военные"
japanese_fascism_desc: "После Маньчжурского инцидента военные стали истинной правящей силой Японии. Опираясь на подавляющую военную мощь, они доминировали над кабинетом министров и политическими силами, направляя все ключевые решения государства."

imperial_rule_assistance_association: "Ассоциация помощи трону"
imperial_rule_assistance_association_desc: "Ассоциация помощи трону — это партия, основанная Коноэ Фумимаро в рамках Движения нового порядка. Созданная для воплощения идеалов Коноэ Фумимаро, она стала единственной политической партией Японии, образовав гигантскую политическую структуру."

imperial_rule_assistance_association_neutrality: "Ассоциация помощи трону"
imperial_rule_assistance_association_neutrality_desc: "Ассоциация помощи трону была создана Коноэ Фумимаро, чтобы освободиться от контроля армии. Хотя Движение нового порядка изначально достигло определенных успехов, оно потерпело неудачу из-за давления военных и в настоящее время превратилось в чисто номинальную партию, поддерживающую и легитимизирующую линию армии."

decagramaton_neutrality: "Идеология Декаграмматона"
decagramaton_neutrality_desc: "Декаграмматон — это система искусственного интеллекта, провозглашающая себя священным искателем. Эта уникальная идеология, сформированная искусственными интеллектами, 'просветленными' Декаграмматоном, и пророками, следующими за ним, была продемонстрирована, проанализирована и воспроизведена и действует с целью способствовать пришествию нового бога, сосредоточиваясь на демонстрации собственного существования."

