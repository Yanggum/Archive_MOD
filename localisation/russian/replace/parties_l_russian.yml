l_russian:
stalinism: "Сталинизм"
stalinism_desc: "Форма правления, применяющая и развивающая политику марксизма-ленинизма. Сталинизм отстаивает не только необходимость сильного и авторитарного социалистического государства, способного проводить чистки контрреволюционных элементов, но и социализм в отдельно взятой стране, то есть построение социализма в рамках одного государства."

trotskyism: "Троцкизм"
trotskyism_desc: "Форма правления, применяющая и развивающая политику марксизма-ленинизма. Троцкизм отстаивает не только необходимость сильной авангардной партии для чистки контрреволюционных элементов, но и перманентную революцию для свержения капиталистических государств до того, как рабочее государство окажется изолированным эмбарго со стороны капиталистических держав."

