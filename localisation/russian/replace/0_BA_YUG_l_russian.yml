  ## Фокусы
  YUG_western_focus: "Регентский совет"
  YUG_western_focus_desc: "Германофильская политика регента, князя Павле, закончилась с падением Германии, но регентство не должно подойти к концу. Петр II еще молод и неспособен править. Поэтому мы усилим ослабленную власть регентства через Регентский совет."
  YUG_expand_the_university_of_ljubljana: "Поддержка исследований"
  YUG_expand_the_university_of_ljubljana_desc: "Мы должны поддерживать национальные исследования и поощрять технологическое развитие, чтобы защитить нашу страну от захватчиков."
  YUG_establish_the_banovina_of_croatia_desc: "Мы должны создать полуавтономный орган в Хорватии, чтобы фрагментировать и демонтировать силы хорватских националистов."
  YUG_evolution: "Контроль"
  YUG_join_axis: "Сближение с Италией"
  YUG_join_axis_desc: "Многие стали свидетелями того, как Франция, наш традиционный союзник, была позорно изгнана с европейского континента. Раньше дипломатический союз с Италией был бы невозможен, но в текущей ситуации никто не сможет возразить. Это будет последний выбор для защиты Югославии."

  YUG_united_kingdom_tt: "Мы сможем добавить наши §Yосновные территории§! к §Yосновным территориям§! §Y[SER.GetNameWithFlag]§!, §Y[SLV.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[KOS.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§!, §Y[HRZ.GetNameWithFlag]§!, §Y[MAC.GetNameWithFlag]§!, §Y[TRA.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! и §Y[BUL.GetNameWithFlag]§!."

  ## События
  YUG_event.1.t: "Народный антифашистский фронт"
  YUG_event.1.d: "Мы номинально провозгласили Народный фронт, и на практике к нему присоединились лишь несколько групп. Несомненно, это будет полезно позже."
  YUG_event.1.a: "Но их очень мало."
  YUG_event.2.t: "Чистка оппозиции"
  YUG_event.2.d: "Внутри партии есть оппозиционеры, которые, соблазненные реакционным примирением, выступают за реформу вместо революции. Мы отправим их в Советский Союз вместе с бухаринцами."
  YUG_event.2.a: "Прощайте, товарищи... навсегда..."
  YUG_event.3.t: "Конец королевской семьи"
  YUG_event.3.d: "Великая революция, предназначенная покончить с реакционной феодальной монархией, победила, и большая часть королевской семьи не смогла бежать за границу. Как нам с ними поступить?"
  YUG_event.3.a: "Казнить королевскую семью."
  YUG_event.3.b: "Изгнать королевскую семью."
  YUG_event.3.c: "Конфисковать их имущество и позволить им жить как обычным гражданам."
  YUG_event.5.t: "Предложение югославской поддержки"
  YUG_event.5.d: "Югославия, которая поддерживала нашу революцию, предложила вмешаться напрямую. Если мы согласимся, мы сможем завершить революцию."
  YUG_event.5.a: "Принять предложение."
  YUG_event.5.b: "Мы не марионетки."
  YUG_event.6.t: "Цена революции"
  YUG_event.6.d: "Югославия похвалила нашу мирную смену правительства, но также потребовала полностью искоренить внутренние оппозиционные силы. Мы можем подчиниться их приказам или противостоять им."
  YUG_event.7.d: "Правительство [YUG.GetAdjective] отправило нам предложение объединить Балканы под центральным правительством с целью содействия сотрудничеству и взаимопониманию между различными народами региона. По словам [YUG.GetLeader], это будет последний и великий шаг к балканской федерации, которая оставит позади конфликты прошлого и гарантирует прочный мир.\n[YUG.GetNameDef] теперь ожидает ответа правительства [ROOT.GetAdjective]."
  YUG_event.10.d: "Правительство [FROM.GetAdjective] отказалось присоединиться к Объединенной Балканской Федерации, хотя решило сохранить существующий союз.\nОднако [FROM.GetLeader] публично заявил, что реакция Югославии на этот отказ покажет, является ли истинной целью федерации расширение границ Югославии за пределы воображаемого или же она действительно стремится к объединенной социалистической балканской республике без условий. В любом случае, [FROM.GetNameDef] никогда не откажется от своей независимости и культурной идентичности."

  YUG_event.11.t: "[From.GetNameDefCap] сближается с фашистскими государствами"
  YUG_event.11.desc: "Сегодня [From.GetLeader] отправил телеграмму в [Root.Capital.GetName], выразив заинтересованность в подписании пакта о ненападении с фашистскими державами. Опасаясь агрессии [SOV.GetAdjective] и растущего внутреннего национализма, [From.GetLeader] пытается сблизиться с [Root.GetNameDef]. Хотя это не подразумевает формального союза, это может втянуть [From.GetNameDef] в нашу сферу влияния и облегчить ее вступление в [Root.GetFactionName]."
  YUG_event.111.t: "Возражение [From.GetNameDefCap]!"
  YUG_event.111.tripartite_rejection: "[From.GetLeader] отклонил предложение [Root.GetAdjective] подписать пакт о ненападении с фашистскими государствами, сославшись на то, что у них \"другие идеи\"."
  YUG_event.111.allied_objection: "Наше решение сблизиться с фашистскими государствами вызвало глубокие споры внутри страны и за ее пределами, подрывая легитимность [Root.GetLeader] как регента Петра II. Офицеры югославской армии объявили Петра II совершеннолетним и при поддержке [From.GetAdjective] двинулись на Белград, требуя немедленного отречения [Root.GetLeader]."
  YUG_event.111.allied_objection_no_best: "[From.GetLeader] выразил серьезную озабоченность по поводу нашей внешней политики."
  YUG_event.111.a: "У нас нет другого выбора, кроме как принять это."
  YUG_event.111.b: "Готовиться к войне!"
  YUG_event.111.c: "Игнорировать."
  YUG_event.112.t: "[From.GetNameDefCap] подписывает пакт о ненападении с фашистами"
  YUG_event.112.desc: "Правительство [YUG.GetAdjective] сегодня подписало пакт о ненападении с фашистскими государствами. Хотя это еще не означает присоединения [YUG.GetNameDef] к [From.GetFactionName], это демонстрирует растущую фашистскую симпатию [YUG.GetLeader] и его лояльность этим державам. Многие ожидают ответа [Root.GetAdjective] на это тревожное развитие, но пока царит лишь молчание [Root.GetLeader]."
  YUG_event.112.a: "[YUG.GetLeader], трусливый ублюдок!"
  YUG_event.112.b: "Кажется, нам не о чем беспокоиться."

  YUG_event.12.t: "[From.GetNameDefCap] присягает на верность"
  YUG_event.12.desc: "Правительство [YUG.GetAdjective] запросило у нас защиту, предложив взамен разрешить широкое вмешательство в свои внутренние дела."
  YUG_event.12.a: "[YUG.GetLeader], добро пожаловать."
  YUG_event.12.b: "Игнорировать."

  YUG_event.121.t: "[From.GetAdjective] соглашается!"
  YUG_event.121.desc: "После долгих размышлений [From.GetAdjective] согласилась предоставить нам защиту."
  YUG_event.121.a: "Воздух Рима чист."

  YUG_event.122.t: "[From.GetAdjective] отказывает!"
  YUG_event.122.desc: "[From.GetAdjective] решила отклонить нашу просьбу о защите."
  YUG_event.122.a: "Проклятье."

  YUG_event.13.t: "Путь к республике"
  YUG_event.13.desc: "Германия пала.\nПеред лицом вторжения из иного мира государство, которое когда-то стремилось к европейской гегемонии, рухнуло, не оставив следа, и вместе с ним исчезла германофильская политика князя Павле.\n\nАрмия вступила в состояние чрезвычайного положения, и большая часть оставшихся сил была перемещена в Словению для противостояния угрозе.\n\nЮный король хранит молчание, и корона больше не отдает приказов.\n\nЯ не могу не спросить:\nС каких пор эта монархия нас защищала?\nС каких пор королевская семья разделяла страдания народа?\n\nСегодня на этой земле нет власти. Есть только пустота.\nА пустота принадлежит тому, кто первым протянет руку.\n\nИстория наблюдает за нами.\nЦепляться за отжившее государство, выживающее именем короля,\nили воздвигнуть республику на рухнувшем троне?\n\nКолебаться — значит проиграть.\nСегодня мы должны выбрать."
  YUG_event.13.a: "Историю пишут победители."

  YUG_event.14.t: "Народный фронт"
  YUG_event.14.desc: "Они спрашивают:\nПочему мы носим разные имена?, почему мы поднимаем разные флаги?\n\nНо самый важный вопрос вот в чем:\nКто отдает нам приказы?\nИ кто живет за счет нашего голода?\n\nНа фабриках — рабочий;\nв казармах — солдат;\nна улицах — безработный;\nвсе склоняют головы на своих местах.\n\nНас учили, что мы разные,\nно мы получаем одни и те же приказы\nи целиимся из одних и тех же орудий.\n\nНекоторые говорят:\nСейчас не время объединяться.\nСначала нужно решить, что правильно.\n\nНо разделение всегда начиналось наверху,\nа цену всегда платили внизу.\n\nСегодня мы должны выбрать:\nПроигрывать под своими именами\nили сопротивляться под одним флагом?"
  YUG_event.14.a: "Присоединяйтесь к рабочему фронту! Ты тоже рабочий!"

  YUG_event.15.t: "Памфлет"
  YUG_event.15.desc: "Король молчит, а народ истекает кровью.\n\nРегентство правит именем короля,\nно никто не берет на себя ответственность.\n\nМонархия говорит о порядке,\nно мы видели только тюрьмы и цензуру.\n\nКто разрушил эту страну?\nКоролевская семья.\nМонархисты.\nРегентство, которое их защищало.\n\nМы больше не подданные.\nЭта земля не принадлежит королю,\nона принадлежит народу.\n\nСвергнуть регентство!\nУпразднить монархию!\nУстановить республику!"
  YUG_event.15.a: "Именем рабочих, крестьян, солдат и безымянного народа."

  YUG_event.16.t: "День регентства"
  YUG_event.16.desc: "Машина ехала медленно.\nОна останавливается на мгновение перед светофором.\nЯ смотрю в окно: знакомые улицы, знакомые лица.\n\nЯ думал, этого эскорта будет достаточно.\nИли, точнее, я желал, чтобы этого было достаточно.\n\nОкно открыто.\nВходит воздух.\nМысли расслабляются на мгновение.\nКороткий сухой звук.\nЭто не взрыв.\nЭто не предупреждение.\nЭто звук с намерением.\n\nГрудь реагирует первой.\nЗатем приходит боль.\nЯ пытаюсь за что-то ухватиться, но в руках нет сил.\n\nРаздается еще один выстрел.\nСтекло трескается.\nЯ слышу крики охраны, но они не складываются в слова.\n\nМашина ускоряется.\nНо я уже не могу двигаться.\n\nВзгляд опускается вниз.\nЯ вижу землю\nи темно-красное пятно, расползающееся по упавшим документам.\n\nФразы, написанные именем короля.\nНа них\nпадает моя кровь.\n\nЯ не был королем.\nЭто, по крайней мере, точно.\n\nТогда\nпочему эта кровь должна была пролиться?\n\nМысль не доходит до конца.\nТишина, более тихая, чем выстрел, покрывает все."
  YUG_event.16.a: "Надо было остаться смотреть картины..."

  YUG_event.17.t: "Разделение"
  YUG_event.17.desc: "Слышен скрип стула.\nКто-то встает.\n\n\"Монархия пала. Тогда почему реформы всегда останавливаются?\"\n\nСлышен ропот, но он не останавливается.\n\n\"Земельная реформа откладывается, профсоюзные забастовки подавляются, а старые королевские бюрократы выживают под именем 'опыта'.\"\n\"Это случайность? Или потому, что здесь все еще есть те, кто не может отпустить руку монархистов?\"\n\nКто-то протестует, но его голос тонет.\n\n\"Тот, кто отвергает полную реформу, независимо от намерений, в конечном счете помогает монархии.\"\n\nОн ударяет по столу.\n\n\"Решайте сейчас. Или идите с народом, или исчезните вместе с остатками короны.\"\n\nВ зале остается только тишина."
  YUG_event.17.a: "Правые предали Народный фронт!"

  YUG_event.18.t: "Итальянское вторжение"
  YUG_event.18.desc: "Радио передало только факты.\nИтальянская армия пересекла границу.\n\nГород замирает на мгновение.\nНа фабриках останавливаются станки;\nв магазинах затягиваются расчеты;\nна улицах люди снова и снова перепроверяют новость.\n\nВ казармы приходят приказы.\nПричины не объясняются.\nИ никто не спрашивает.\nКогда начинается война, спрашивать — роскошь.\n\nВ деревне мало слов.\nВойна не нова.\nТолько на этот раз она ближе.\nМолодые люди переглядываются,\nа старики вспоминают прошлые войны.\n\nВ офисах и министерствах бумаги движутся быстро.\nСтавятся печати, телефоны не умолкают.\nНекоторые беспокоятся о стране,\nдругие — о режиме,\nа третьи — просто о завтрашнем дне.\n\nОдни впадают в ярость,\nдругие смиряются,\nа третьи молча готовятся.\n\nФакт в том, что итальянское вторжение изменит повседневную жизнь всех, кто живет в этой стране."
  YUG_event.18.a: "Раз уж началось, будем сражаться до конца."

  YUG_event.19.t: "Объявление войны Италии"
  YUG_event.19.desc: "Решение было недолгим.\nСобрание было кратким, а фраза еще короче.\n\nОбъявление войны Италии утверждено.\n\nТелеграммы отправляются немедленно, дипломатические документы скрепляются печатями, и линии на карте теряют свое значение.\n\nВ городах новость распространяется быстро.\nНекоторые молча кивают, другие долго смотрят в окно.\nВойна началась, но многие уже знали, что когда-нибудь она начнется.\n\nВ казармах ожидание сменяется движением.\nСолдаты больше не задают вопросов.\nВойна с объявлением стала реальностью.\n\nВ деревне колокола и радио звучат одновременно.\nВпервые война ощущается близко.\n\nВ офисах и министерствах огни не гаснут и ночью.\nВойна больше не является дипломатическим вопросом, это тотальное требование государства.\n\nЭто решение было принято не ради режима или идеологии.\n\nЭто был ответ на один факт.\n\nГраница пала, и альтернатив больше не осталось."
  YUG_event.19.a: "Эта война решит все."

  YUG_event.20.t: "Победа, и после"
  YUG_event.20.desc: "Мы победили.\n\nИз сельских районов Сербии, гор Боснии и городов Хорватии и Словении мы изгнали итальянскую армию.\n\nМы пересекли Альпы и реку Пьяве, заняв Венецию, Геную, Болонью и Флоренцию.\n\nИ наконец мы взяли Рим, столицу Италии и центр тысячелетней европейской цивилизации.\n\nНаш флаг развевается по всей Италии; в Белграде проходит парад, и наши молодые люди вернутся домой.\n\nНо ни одна из этих побед не была бесплатной.\n\nКладбища полны, а больницы переполнены ранеными.\n\nГорода были разрушены итальянскими бомбардировками; отцы потеряли детей, а дети — отцов.\n\nНикто не сможет вернуться во времена до войны.\n\nК лучшему это или к худшему."
  YUG_event.20.a: "Все изменилось, но мы все равно победили."

