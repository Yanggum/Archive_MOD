  ## Подсказки

  ## Вступительное описание
  YUG_country_intro_header: "Хаотичная земля южных славян"
  YUG_country_intro_content: "С момента основания Югославии вряд ли кто-то скажет, что страна была мирной, ни внешне, ни внутренне.\nЮгославия, государство, воздвигнутое под предлогом объединения южных славян, в отличие от своего названия как 'земли южных славян', имела серьезные внутренние проблемы.\nКак бы ни были красивы цвета, когда краски смешиваются, они становятся черными.\nХорваты, словенцы, боснийцы, черногорцы, македонцы и даже сербы: из-за этнических проблем и всевозможных конфликтов у Югославии не было ни минуты передышки.\nСтолкновения с македонцами, подъем словенского национализма и даже деятельность ультраправой хорватской организации Усташа: Югославия горела изнутри.\nВ 1934 году король Александр I был убит, и его брат, князь Павле, осуществлял регентство вместо Петра II, которому было всего 11 лет.\nКнязь Павле сблизился с Германией, которая зарилась на югославский 'пирог', пытаясь хоть немного продлить жизнь королевству.\nПока не появились захватчики из иного мира.\nЭти новоприбывшие сокрушили Германию и Францию, а Соединенное Королевство, которое едва сопротивляется, тоже готовится к изгнанию в Канаду.\nВ этой катастрофе князь Павле не мог не быть ошеломлен, но вскоре развернул армию в приграничной зоне бывшей Австрии, 'Шаньхайцзин'.\nЮгославия снова брошена в мир, где пахнет войной.\nВсе еще нерешенные этнические проблемы лишают югославский народ сил объединиться и противостоять захватчикам, а наша зависимая от внешнего мира экономика рушится после того, как Соединенное Королевство, Франция и Германия были растоптаны захватчиками из иного мира.\nВ этой ситуации власть князя Павле рушится, а на севере появляются волны беженцев, еще больше обостряя политические споры.\nДля земли южных славян существует только два будущих: быть растерзанной, страдая от всевозможных болезней, или преодолеть кризис и сопротивляться до конца."
  YUG_guide: "- Установите политическую систему, которая решит будущее Югославии.\n   - Регентский совет\n      - Укрепить Радикальную коалицию (завершено)\n      - Отправить в отставку фашистского премьер-министра - распустить парламент (в разработке, играбельно)\n      - Отправить в отставку фашистского премьер-министра - конституционная реформа (в разработке, не играбельно)\n   - Строительство республики\n      - Отказ от левого экстремизма (в разработке, не играбельно)\n      - Признание коммунистической партии (завершено)\n- Разрешите проблемы между внутренними этносами.\n- Защитите Югославию от иностранных держав, таких как Италия.\n- Мирно сосуществуйте с людьми из иного мира или освободите европейцев от них."

  ## Новые фокусы

  YUG_Establishment_of_the_Republic: "Строительство республики"
  YUG_Establishment_of_the_Republic_desc: "Германофильская политика князя Павле закончилась, когда Германия была уничтожена захватчиками из иного мира. В эти смутные времена наш путь будет не путем королевства, руководимого некомпетентным регентом и юным незрелым королем, а полной реформой через строительство республики."
  YUG_end_of_compromism: "Отказ от компромисса"
  YUG_end_of_compromism_desc: "Умеренные все еще верят, что, как и в Великой войне, королевская семья может функционировать нормально. Но после Великой войны королевская власть практиковала тиранию и спровоцировала раскол страны, и невозможно, чтобы монархисты согласились с нашим идеалом демократии. Больше не будет компромисса с королевской семьей и ее приспешниками. Их концом будет только гибель от предательства и раскола."
  YUG_recognize_the_soviet_union: "Признать коммунистическую партию"
  YUG_recognize_the_soviet_union_desc: "Союз коммунистов Югославии рассматривался послевоенным правительством как большая угроза и был насильственно распущен. Но они могут стать союзниками, разделяющими наши республиканские идеалы, и ради строительства республики мы признаем их как легальную партию."
  YUG_Creating_anti_monarchy_sentiment: "Поощрение антимонархических настроений"
  YUG_Creating_anti_monarchy_sentiment_desc: "Система королевской диктатуры блокировала политическое развитие Югославии на протяжении десятилетий. Под предлогом интеграции многонационального государства монархия подавляла оппозицию и нейтрализовала парламент. Мы будем организованно распространять антимонархические настроения, разоблачая, что монархия больше не может представлять будущее югославского народа."
  YUG_popular_front: "Народный фронт"
  YUG_popular_front_desc: "Союз коммунистов Югославии — не простая партия. У них есть опыт подпольной борьбы, которого нет у нас, и глубоко укоренившиеся рабочие ячейки на фабриках и шахтах. Если мы объединимся с ними через Народный фронт, подняв антифашистское и антимонархическое знамя, мы разделим их организационные способности и боевой опыт и сможем более эффективно расширять антисистемное движение."
  YUG_underground_organization_integration: "Интеграция подпольных организаций"
  YUG_underground_organization_integration_desc: "Партии и организации, присоединившиеся к нашему делу, имеют свои собственные подпольные структуры. Теперь, интегрировав их под единую цепочку командования, мы сможем превратить разрозненное сопротивление в организованную и эффективную борьбу. Единые приказы и скоординированные действия сделают возможным длительное сопротивление монархии и фашистским силам."
  YUG_Assassination_of_the_Regent: "Убийство регента"
  YUG_Assassination_of_the_Regent_desc: "Наконец настал этот день. Наша подпольная организация сопротивления уже пустила корни по всей стране, ожидая лишь сигнала. Среди югославского народа разочарование и ненависть к королевской семье достигли пика, и система регентства больше не может поддерживать свою легитимность. Настало время решать. Пришло время устранить регента и свергнуть старый монархический режим всенародным восстанием. Будущее Югославии решится сегодня, на улицах и фабриках."
  YUG_Establishment_of_the_Republic_Constitution: "Обнародование республиканской конституции"
  YUG_Establishment_of_the_Republic_Constitution_desc: "После устранения регента и национальной революции юный король Петр II был вынужден отказаться от дальнейшего правления. Теперь мы официально упраздним монархию и установим республиканскую конституцию, основанную на равенстве всех и демократических принципах. Югославия, управляемая королем, мертва. Здесь рождается новое государство, где народ осуществляет суверенитет, и этой конституцией мы провозгласим начало новой эры."
  YUG_anti_rightist_struggle: "Борьба против правых"
  YUG_anti_rightist_struggle_desc: "Республика установлена, но силы, поддерживавшие монархию, еще не исчезли полностью. Они сформировали реакционную правую силу в союзе с капиталистами, духовенством и помещиками и постоянно влияют на другие правые политические силы. Мы должны ликвидировать их организацию и базу, чтобы защитить завоевания революции и гарантировать выживание республики. Нельзя исключать, что в процессе будут 'невинные жертвы', но цена отказа от революции будет намного выше."
  YUG_Seeking_support_from_the_Soviet_Union: "Искать поддержку Советского Союза"
  YUG_Seeking_support_from_the_Soviet_Union_desc: "Советский Союз хорошо знает, что нужно революционной нации для выживания. Если мы получим его одобрение и поддержку, мы сможем обеспечить реальную силу для противостояния внутренней реакции и внешнему давлению."
  YUG_Create_People_s_Army: "Создание партийной армии"
  YUG_Create_People_s_Army_desc: "Союз коммунистов Югославии получил более 1/8 мест в Учредительном собрании 1920 года, но потерял их все из-за насильственного роспуска правительства. Можем ли мы гарантировать, что после построения республики такое не повторится? Чтобы никогда не повторять этого, мы внедримся в подпольные организации, интегрированные под единым командованием, и, взяв под контроль их руководство, усилим наше господство и создадим новую партийную армию с собственной секретной цепочкой командования."

  YUG_form_peasant_councils: "Создать советы издольщиков"
  YUG_form_peasant_councils_desc: "Чтобы построить равноправную республику, власть издольщиков и мелких крестьян должна быть усилена в местной политике. Создавая советы издольщиков, мы сможем обеспечить базу поддержки, совпадающую с нашими республиканскими идеалами, и гарантировать справедливое владение землей."

  YUG_Purge_Reactionist_in_Party: "Чистка внутренней оппозиции в партии"
  YUG_Purge_Reactionist_in_Party_desc: "В настоящее время в партии есть оппозиционеры, выступающие против наших идеалов. Они связаны с бухаринцами, нападают на нынешнее руководство и способствуют внутреннему расколу, поэтому мы отправим их в Москву, чтобы положить конец расколу партии."
  YUG_workers_republic: "Рабочая республика"
  YUG_workers_republic_desc: "По мере расширения политического влияния Союза коммунистов Югославии растет мнение, что их представительство в парламенте было недооценено, а забастовки, протесты и уличные бои рабочих и крестьян происходят по всей стране. Союз коммунистов Югославии мобилизует партизан, партийную армию, для обеспечения национального контроля."
  YUG_With_Marshal_Tito: "Вместе с маршалом Тито"
  YUG_With_Marshal_Tito_desc: "Тито доказал свое лидерство как руководитель партии и партийной армии, сыграв центральную роль в захвате власти. Мы изберем его президентом нашей республики."
  YUG_federal_defense_council1: "Федеральный совет обороны"
  YUG_federal_defense_council1_desc: "Армия республики контролируется сербскими генералами. Создав Федеральный совет обороны, мы сможем уменьшить власть сербского Генерального штаба, обеспечить более равные повышения и получить более разнообразные стратегии."
  YUG_Peoples_Army_Reorganization: "Реорганизация партийной армии"
  YUG_Peoples_Army_Reorganization_desc: "Партийная армия оказала большую помощь в захвате власти, но, будучи импровизированной сборкой различных подпольных организаций, ее цепочка командования и структура не систематичны, и многим не хватает надлежащей подготовки. Мы должны реорганизовать ее, чтобы превратить в сильную, эффективную и хорошо обученную армию."
  YUG_Partisan_War_Tactics: "Партизанская война"
  YUG_Partisan_War_Tactics_desc: "С 1920-х годов мы накопили опыт подпольной борьбы, и география Югославии очень подходит для партизанской деятельности. Мы должны разработать доктрину, использующую наш опыт и местность, и заложить основы для сопротивления, даже если захватчик оккупирует нашу территорию."
  YUG_Last_of_Royal_family: "Конец королевской семьи"
  YUG_Last_of_Royal_family_desc: "Мы свергли некомпетентную династию Карагеоргиевичей и установили рабочую республику в Югославии. Теперь мы должны решить их судьбу."
  YUG_Brotherhood_And_Unity: "Братство и единство"
  YUG_Brotherhood_And_Unity_desc: "Братство и единство — официальная политика в отношении отношений между южнославянскими народами и меньшинствами: относится ко всем этносам равно и, чтобы преодолеть национальные конфликты и ненависть, мирно поощряет сходства и взаимную зависимость."
  YUG_Harmony_in_Religion: "Межрелигиозная гармония"
  YUG_Harmony_in_Religion_desc: "Южнославянские народы долгое время находились под властью иностранных держав и приняли религию правящих государств. Религия глубоко влияет на идентичность каждого народа, и если мы необдуманно нападем на нее, это будет серьезной угрозой стабильности нашей системы. Вместо односторонних нападок мы будем способствовать межрелигиозному диалогу для уменьшения этнических конфликтов."
  YUG_state_atheism: "Конфискация религиозного имущества"
  YUG_state_atheism_desc: "Религия — опиум для народа. В Югославии религия не сделала ничего, кроме разжигания конфликтов между этносами, поэтому мы начнем политику государственного атеизма, конфискуя религиозное имущество."
  YUG_Break_authoritarianism: "Отказ от авторитаризма"
  YUG_Break_authoritarianism_desc: "Авторитаризм приносит партии только коррупцию и упадок. Ради лучшей партии мы откажемся от авторитаризма."
  YUG_workers_self_management: "Система рабочего самоуправления"
  YUG_workers_self_management_desc: "Рабочее самоуправление в Югославии было организовано в соответствии с теориями Тито и Эдварда Карделя. Рабочие имеют право управлять своим рабочим местом и управляют им автономно и демократично."
  YUG_Centralized_Economy: "Экономическая централизация"
  YUG_Centralized_Economy_desc: "Централизуя экономику, мы сможем построить эффективную экономику и усилить экономическую власть партии."
  YUG_strengthening_of_the_central_party: "Укрепить центральную партию"
  YUG_strengthening_of_the_central_party_desc: "Концентрируя функции и власть в центральной партии, мы сможем добиться лучшего управления и большей стабильности."
  YUG_yugoslavia_expansion: "Великая Федеративная Республика Югославия"
  YUG_yugoslavia_expansion_desc: "'План Великой Федеративной Республики Югославия' состоит в том, чтобы включить Республику Болгарию и Республику Албанию, наших нынешних союзников, в Федеративную Республику Югославию. Хотя не обойдется без сопротивления со стороны основных народов каждой республики, этот план широко поддерживается и необходим для защиты революции."
  YUG_balkan_federation: "Федерация Социалистических Республик Балкан"
  YUG_balkan_federation_desc: "Концепция балканской федерации появилась в конце XIX века, и ее центральная цель — построить общую федеративную республику, объединяющую Балканский полуостров на основе новой политической интеграции: интернационализма, социализма, социальной солидарности и экономического равенства. Мы можем реализовать этот план, продвигая революции в странах Балкан."
  YUG_balkan_defense_training: "Оборона Балкан"
  YUG_balkan_defense_training_desc: "Для защиты Балканского полуострова мы должны сотрудничать с армиями других стран. Мы установим доктрину для этого и поделимся ею с другими нациями."
  YUG_internationalism: "Интернационализм"
  YUG_internationalism_desc: "Мы освобождены, но в мире еще много рабочих, страдающих под гнетом угнетателей. В соответствии с принципом интернационализма мы будем поддерживать их освобождение и борьбу, и иногда мы сможем развертывать нашу армию, чтобы вызвать единство и борьбу рабочих мира."
  YUG_industrial_integration: "Интегрированная промышленность"
  YUG_industrial_integration_desc: "Интегрируя промышленность Югославии, Болгарии и Албании, мы сможем укрепить экономику более эффективно."
  YUG_eradication_of_nationalism: "Уничтожение 'национализма'"
  YUG_eradication_of_nationalism_desc: "Национализм — не более чем инструмент угнетателей. Они использовали вымышленное понятие нации, чтобы разделить рабочих и заставить их враждовать друг с другом. Мы уничтожим национализм, чтобы ликвидировать дискриминацию между этносами."
  YUG_equality_among_ethnic_groups: "Равенство между этносами"
  YUG_equality_among_ethnic_groups_desc: "После недавнего включения Болгарии и Албании в федерацию основные этнические группы каждой республики реагируют с недовольством. Мы будем подчеркивать равенство между этносами, чтобы улучшить их положение и устранить сопротивление."

  YUG_yugoslavian_nationalism: "Югославский национализм"

  YUG_multinational_state: "Многонациональное государство"

  YUG_constitutional_monarchy: "Конституционная монархия"
  YUG_constitutional_monarchy_desc: "Мы сформируем большую коалицию с участием большинства центристских партий страны, назначив премьер-министром Антона Корошеца, бывшего премьер-министра и первого главу правительства несербского происхождения, с целью укрепления конституционной монархии, установленной конституционной реформой."

  YUG_Death_of_the_January_6th_Dictatorship: "Смерть режима 6 января"
  YUG_Death_of_the_January_6th_Dictatorship_desc: "Режим 6 января репрессивен, и в нынешней ситуации, когда доверие к королевской семье рухнуло, он вызовет только нестабильность. Мы должны ликвидировать остатки режима 6 января и построить новую Югославию."
  YUG_Election_Law_Reform: "Реформа избирательного закона"
  YUG_Election_Law_Reform_desc: "Нынешний избирательный закон и округа разработаны так, чтобы благоприятствовать определенным этносам. Чтобы обеспечить представительство меньшинств и равенство между этносами, мы должны реформировать избирательный закон."
  YUG_Neutralize_the_Royal_Family: "Превратить королевскую семью в символ"
  YUG_Neutralize_the_Royal_Family_desc: "Поскольку доверие к королевской семье упало до нуля, а Петр II еще молод, мы должны превратить королевскую семью в символическую фигуру и не допускать ее вмешательства в политику."
  YUG_Establishment_of_an_Independent_Constitutional_Court: "Учредить независимый конституционный суд"
  YUG_Establishment_of_an_Independent_Constitutional_Court_desc: "Создание независимого конституционного суда необходимо для стабильности нашего государства. Мы должны создать конституционный суд, независимый от других политических расчетов."
  YUG_Depoliticization_of_State_Institutions: "Департизация государственных институтов"
  YUG_Depoliticization_of_State_Institutions_desc: "В настоящее время есть чиновники с ультраправыми идеями, назначенные бывшим премьер-министром. Кроме того, из-за некомпетентных и антидемократических чиновников, назначенных во время предыдущего абсолютизма, в 1935 году произошли фальсификации на выборах; мы должны уволить их и обучить чиновников департизации."
  YUG_Special_Committee_on_Eradication_of_Corruption: "Специальный комитет по борьбе с коррупцией"
  YUG_Special_Committee_on_Eradication_of_Corruption_desc: "Чтобы полностью искоренить коррупцию, эндемичную для периода абсолютизма, мы должны создать специальный комитет с полными полномочиями и провести тщательное расследование."
  YUG_Farm_Support_Policy: "Политика поддержки ферм"
  YUG_Farm_Support_Policy_desc: "Говорят, что основа страны — сельское хозяйство. С глобальной рецессией фермы страдают; мы должны предоставить субсидии для стимулирования сельского хозяйства."
  YUG_Agricultural_Modernization: "Модернизация сельского хозяйства"
  YUG_Agricultural_Modernization_desc: "Модернизация сельского хозяйства — наша судьба. Мы должны внедрить тракторы и подвести электричество в деревню, чтобы повысить сельскохозяйственную производительность."
  YUG_Industrial_Subsidies: "Промышленные субсидии"
  YUG_Industrial_Subsidies_desc: "Хотя ущерб фермам продолжается, если индустриализация не будет идти впереди, национальная экономика также застопорится. Мы должны предоставить субсидии промышленности для содействия ее развитию."
  YUG_Unemployment_Pension: "Пособие по безработице"
  YUG_Unemployment_Pension_desc: "Безработица стремительно растет. Чтобы поддерживать покупательную способность населения, мы должны выплачивать пособие по безработице."
  YUG_Partial_Removal_of_Press_Censorship: "Частичная отмена цензуры прессы"
  YUG_Partial_Removal_of_Press_Censorship_desc: "Цензура прессы должна быть отменена в долгосрочной перспективе, но поскольку экстремистские силы развязаны в нестабильной ситуации, мы должны отменить ее частично, оставив пространство для вмешательства государства в СМИ."
  YUG_Wipe_Out_Fascist_Influence: "Искоренить фашистское влияние"
  YUG_Wipe_Out_Fascist_Influence_desc: "Цензура прессы, которую мы поддерживаем, может быть использована для искоренения влияния фашистских сил, как внутренних, так и внешних."
  YUG_Complete_Removal_of_Press_Censorship: "Полная отмена цензуры прессы"
  YUG_Complete_Removal_of_Press_Censorship_desc: "Полностью отменив цензуру прессы, мы сможем показать, что принимаем реформистское общественное мнение внутри страны."
  YUG_Limited_Allowance_of_Communist_Parties: "Разрешить ограниченную деятельность коммунистических партий"
  YUG_Limited_Allowance_of_Communist_Parties_desc: "Коммунизм несовместим с монархией, но из-за их размера мы должны их признать. Разрешим их политическую деятельность ограниченно и заставим их действовать в рамках закона."
  YUG_Guaranteeing_Cultural_Autonomy: "Гарантировать культурную автономию"
  YUG_Guaranteeing_Cultural_Autonomy_desc: "Мы должны гарантировать культурную автономию этносам страны. Позволим в школах преподавать языки меньшинств кроме сербохорватского, и пусть радио может вещать на языках каждого народа."
  YUG_Special_Committee_on_Religious_Harmony: "Специальный комитет по религиозной гармонии"
  YUG_Special_Committee_on_Religious_Harmony_desc: "Внутри страны существует много религий, и большинство этнических конфликтов проистекает из религии. Учредим специальный комитет по религиозной гармонии, который будет заниматься религиозными вопросами."
  YUG_Minority_Language_Coverage: "Гарантировать использование языков меньшинств"
  YUG_Minority_Language_Coverage_desc: "Разрешим совместное использование языков меньшинств в государственных учреждениях в регионах их компактного проживания, тем самым гарантируя права меньшинств."
  YUG_Constitution_Reform: "Конституционная реформа"
  YUG_Constitution_Reform_desc: ""
  YUG_With_Socialist_Party: "Переговоры с Социалистической партией"
  YUG_With_Socialist_Party_desc: ""
  YUG_Anti_Extremism: "Отказ от экстремизма"
  YUG_Antxi_Extremism_desc: ""
  YUG_With_Independent_Democratic_Party: "Переговоры с Независимой демократической партией"
  YUG_With_Independent_Democratic_Party_desc: ""
  YUG_Strengthening_Welfare: "Усиление благосостояния"
  YUG_Strengthening_Welfare_desc: ""
  YUG_alliance_with_the_uk: "Присоединиться к Союзникам"
  YUG_alliance_with_the_uk_desc: ""
  YUG_alliance_with_france: "Союз с Францией"
  YUG_alliance_with_france_desc: ""

  YUG_oust_the_fascists: "Отправить в отставку фашистского премьер-министра"
  YUG_oust_the_fascists_desc: "Нынешний премьер-министр Югославии, Милан Стоядинович, злоупотребил своей властью, чтобы заполнить государственный сектор своими сторонниками. Кроме того, внутри партии его называют лидером, и он руководит партийной армией. Поскольку он представляет угрозу для нынешней монархической системы, мы отстраним его от должности и назначим другого премьер-министра."
  YUG_Strengthening_Radical_Union: "Укрепить Радикальный союз"
  YUG_Strengthening_Radical_Union_desc: "Югославский радикальный союз — это партия нынешнего премьер-министра Милана Стоядиновича. Поддерживая Радикальный союз, мы подтвердим власть Регентского совета для стабилизации страны и, посредством фашистской политики премьер-министра, сможем улучшить отношения с Италией."
  YUG_regency_council: "Господство регентства"
  YUG_regency_council_desc: "Князь Павле сам доказал, что способен управлять Югославией. Оставляя в стороне еще юного короля, князь Павле и Регентский совет будут защищать Югославию."
  YUG_dissolution_of_parliament: "Роспуск парламента"
  YUG_dissolution_of_parliament_desc: "Югославский парламент потерял свою власть после того, как премьер-министр и лидер правящей партии, Радикального союза, Милан Стоядинович, был изгнан со своей позиции. Настало время распустить ненужный парламент и вернуться к монархическому абсолютизму."
  YUG_defender_of_all_yugoslavia: "Защитник всей Югославии"
  YUG_defender_of_all_yugoslavia_desc: "Король является защитником всех югославов и территорий Югославии. Естественно, король обладает всей полнотой власти для их защиты."
  YUG_Revial_of_the_January_6th_Dictatorship: "Восстановление режима 6 января"
  YUG_Revial_of_the_January_6th_Dictatorship_desc: "Восстановление режима 6 января и возврат к монархическому абсолютизму помогут преодолеть кризис, с которым мы сталкиваемся."
  YUG_Iron_Fist: "Железный кулак"
  YUG_Iron_Fist_desc: "Те, кто выступает против установления монархического абсолютизма, преклонят колени перед железным кулаком короля."
  YUG_Kings_Chetniks: "Королевские четники"
  YUG_Kings_Chetniks_desc: "Четники всегда были верными слугами государства и королевской семьи со времен Королевства Сербия. Официально признав их и включив в государственный аппарат, мы сможем использовать их как руки и ноги королевской власти."
  YUG_strengthening_of_parliamentary_powers: "Усилить парламент"

  YUG_pledge_of_allegiance: "Клятва верности"

  YUG_Kings_Goverment: "Правительство Короля"

  YUG_Rewards_For_Loyalty: "Награды для верных"

  YUG_Economic_Centralization: "Экономическая централизация"

  YUG_Capitalist_Support: "Поддержка капиталистов"

  YUG_Capitalist_Suppression: "Подавление капиталистов"

  YUG_Acquire_Deliverables: "Получение результатов"

  YUG_Industrial_Management: "Управление промышленностью"

  YUG_State_Capitalism: "Государственный капитализм"

  YUG_Agricultural_Subsidy: "Сельскохозяйственные субсидии"

  YUG_Mining_Mechanization: "Механизация горнодобычи"
  YUG_duce_of_yugoslavia: "Дуче Югославии"
  YUG_duce_of_yugoslavia_desc: "Милана Стоядиновича называют 'Вождем (Vođa)' внутри Радикального союза. Мы верим, что, как и Дуче Италии, он сделает сильной новую Югославию."
  YUG_yugoslav_nationalism: "Югославская нация"
  YUG_yugoslav_nationalism_desc: "Термин 'югославская нация' первоначально относился собирательно к славянским народам, живущим в Южной Европе, особенно на Балканском полуострове, таким как сербы и хорваты. Отныне слово 'югославская нация' будет означать самих югославов."
  YUG_serbian_nationalism: "Сербская нация"
  YUG_serbian_nationalism_desc: "Среди национальностей Королевства Югославия самой многочисленной является сербская нация. В Югославии нация с наибольшими правами также должна быть сербской."
  YUG_support_for_chekhnite: "Реорганизация четников"
  YUG_support_for_chekhnite_desc: "Четники — это монархическая милиция, основанная во времена Королевства Сербия, и их происхождение восходит даже к движениям сопротивления против Османской империи. Они также поддерживали сербскую армию как добровольцы во время Великой войны. Мы можем реорганизовать их в соответствии с нашей идеологией и использовать."
  YUG_state_cooperativeism: "Государственный корпоративизм"
  YUG_state_cooperativeism_desc: "Государственный корпоративизм подчеркивает сотрудничество между классами, и государство контролирует экономику. Государственный корпоративизм — это выбор для нашей экономики."
  YUG_ORJUNA_reunion: "Восстановление Организации югославских националистов"
  YUG_ORJUNA_reunion_desc: "Организация югославских националистов была югославской националистической группой, протофашистской и преимущественно антикоммунистической по идеологии, основанной в 1921 году в Королевстве сербов, хорватов и словенцев. Они поддерживали унитарный югославский национализм и эффективно подавляли хорватских и словенских сепаратистов, но были распущены с абсолютизмом 1929 года. Если мы восстановим эту организацию и превратим ее в инструмент государства и партии, мы сможем эффективно сдерживать сепаратистские силы."
  YUG_border_retreat: "Отступление от границы"
  YUG_border_retreat_desc: "Мы нашли идеальное решение, которое раз и навсегда решает как проблему национализма внутри Югославии, так и территориальные претензии Италии."

  YUG_evolution2: "Эволюция"
  YUG_evolution2_desc: "Чтобы ответить на внешнюю угрозу, нам нужно более сильное государство. Пришло время построить эволюционировавшую Югославию, где наши разногласия уже решены."
  YUG_power_strengthening: "Усиление власти"
  YUG_power_strengthening_desc: "Мы усилим нашу власть, укрепляя контроль над военным сословием."
  YUG_moschettieri_del_duce: "Усиление милиции"
  YUG_moschettieri_del_duce_desc: "Мы должны усилить милиции, борющиеся за наш режим, чтобы укрепить господство нашего правительства."
  YUG_deposition_of_the_king: "Низложение короля"
  YUG_deposition_of_the_king_desc: "Коррумпированная королевская семья долгое время монополизировала власть, разграбляя богатство страны и порабощая народ. Теперь мы сбросим их с трона и двинемся к новой Югославии."
  YUG_symbol_of_the_nation: "Символ нации"
  YUG_symbol_of_the_nation_desc: "Королевская семья является символом Югославии, символом югославов и символом нашей армии. Их изгнание вызовет сильную реакцию и может стать актом, отрицающим легитимность нашего режима. Мы сохраним их как наш символ."
  YUG_disintegration_of_yugoslavia: "Распад Югославии"
  YUG_disintegration_of_yugoslavia_desc: "Югославия — не более чем искусственное и противоречивое образование. Мы демонтируем Югославию."
  YUG_greater_serbia: "Великая Сербия"
  YUG_greater_serbia_desc: "Оставляя иллюзорную мечту под названием Югославия, мы должны переучредить себя как новое государство. Югославия, что бы ни говорили, в конечном счете является страной сербской нации и останется ею."
  YUG_serbian_imperialism: "Сербский империализм"
  YUG_serbian_imperialism_desc: "Сербия должна стать больше. Для комфортной жизни сербского народа нужны больше земель, больше ресурсов и больше жертв."
  YUG_greater_serbian_defense_force: "Сербские силы обороны"
  YUG_greater_serbian_defense_force_desc: "Чтобы защитить Сербию, нам нужна большая и более сильная армия. Мы создадим новую армию для новой родины."
  YUG_seeking_alliance_with_italy: "Дружба с Италией"

  YUG_invasion_of_BUL: "Вторжение в Болгарию"
  YUG_invasion_of_BUL_desc: "Болгария постоянно жаждет Македонии, которая является нашей территорией. Кроме того, Болгария обладает землями и ресурсами, которые нам нужны; мы должны нанести превентивный удар, чтобы обеспечить стабильность государства."
  YUG_invasion_of_ALB: "Вторжение в Албанию"
  YUG_invasion_of_ALB_desc: "В Албании добывают нефть. Нам нужна нефть, и она есть у Албании, поэтому мы должны вторгнуться в Албанию."
  YUG_invasion_of_HUN: "Вторжение в Венгрию"
  YUG_invasion_of_HUN_desc: "Венгрия имеет плодородный зерновой регион, пересекаемый Дунаем, и леса для деревообрабатывающей промышленности. Кроме того, известно, что она обладает крупными месторождениями бокситов. Мы вторгнемся в нее, чтобы обеспечить ресурсы."
  YUG_invasion_of_ROM: "Вторжение в Румынию"
  YUG_invasion_of_ROM_desc: "Нефтяные месторождения Плоешти в Румынии являются крупнейшими в Европе. Кроме того, вдоль Дуная есть большие сельскохозяйственные угодья; мы обеспечим Румынию, чтобы гарантировать счастье сербов."
  YUG_invasion_of_GRE: "Вторжение в Грецию"
  YUG_invasion_of_GRE_desc: "Греция имеет много разнообразных ресурсов. Кроме того, ее острова послужат нам базой для экспансии в Средиземноморье. Мы обеспечим Грецию."
  YUG_invasion_of_TUR: "Умиротворение Ближнего Востока"
  YUG_invasion_of_TUR_desc: "Турция является наследницей Османской империи, которая порабощала нас, а дальше находится богатый нефтью Ближний Восток. Мы нападем на Турцию и государства Ближнего Востока, чтобы отомстить за нашу нацию и обеспечить у них ресурсы, необходимые для нашей жизни."
  YUG_oath_of_loyalty: "Клятва верности"
  YUG_oath_of_loyalty_desc: "Мы должны правильно осознавать свое положение в международной политике. На севере — враждебные захватчики из иного мира; на востоке — Советский Союз, стремящийся доминировать на Балканах; на западе — Италия, захватившая территорию нашей страны. У наших бывших союзников больше нет силы, поэтому присягнуть на верность дружественной Италии — это способ, чтобы наша ценность была максимально оценена."
  YUG_strengthening_of_syndicalist_economy: "Развитие корпоративистской экономики"
  YUG_strengthening_of_syndicalist_economy_desc: "Корпоративистская экономика успешно утвердилась в нашей стране; теперь пришло время пожинать плоды. Будем дальше развивать корпоративистскую экономику и укреплять нашу национальную экономику."
  YUG_strengthening_production_plans: "Оружейный завод Балкан"
  YUG_strengthening_production_plans_desc: "Наша страна должна стать острием итальянского копья на Балканах и нуждается в материалах, которые могут поддержать итальянскую армию. Будем оружейным заводом Балкан и производить припасы для итальянской армии и нашей."
  YUG_resource_production: "Производство ресурсов"
  YUG_resource_production_desc: "В нашей стране захоронено довольно много ресурсов. Мы должны добывать их и поставлять на рынок."
  YUG_self_sufficient_economy: "Международная угроза"
  YUG_self_sufficient_economy_desc: "Чтобы ответить на международную угрозу, нам нужна более эффективная экономика и больше офицеров. Мы создадим эффективное государство."

  YUG_Gauge_Standardization: "Стандартизация ширины колеи"
  YUG_Gauge_Standardization_desc: "Железнодорожная сеть, где сосуществуют разные ширины колеи, не может выполнять свою функцию. Мы должны стандартизировать ширину национальной железнодорожной колеи."
  YUG_improve_light_industry: "Поддержка автомобильного сектора"
  YUG_improve_light_industry_desc: "Поддерживая автомобильный сектор, мы сможем улучшить внутреннюю логистику и обеспечить транспортные средства для грядущей войны."
  YUG_Improve_Heavy_Industry: "Развитие тяжелой промышленности"
  YUG_Improve_Heavy_Industry_desc: "Для защиты страны необходимо достаточное количество оружия. Развивая тяжелую промышленность, мы сможем заложить основы для будущей военной промышленности."
  YUG_Rural_Electrification: "Развитие сельской местности"
  YUG_Rural_Electrification_desc: "Мы должны развивать сельские районы по всей стране, чтобы обеспечить нашу продовольственную безопасность. Электрифицируя деревню и прокладывая дороги, по которым смогут ездить тракторы, грузовики и другие транспортные средства, мы сможем увеличить сельскохозяйственное производство."
  YUG_Serbian_Urbanization: "Урбанизация Сербии"
  YUG_Serbian_Urbanization_desc: "Из-за долгого господства бывшей Османской империи индустриализация и урбанизация Сербии задержались по сравнению с северными регионами. Урбанизация Сербии должна быть нашим главным приоритетом."
  YUG_Northen_Urbanization: "Урбанизация севера"
  YUG_Northen_Urbanization_desc: "Регионы Словении и Хорватии достигли определенной степени индустриализации и урбанизации под властью Австрии и Венгрии, но все еще недостаточно по сравнению с другими европейскими городами. Мы должны ускорить урбанизацию севера, чтобы обеспечить промышленных рабочих."
  YUG_Bosnia_Urbanization: "Урбанизация Боснии"
  YUG_Bosnia_Urbanization_desc: "Урбанизация и индустриализация Боснии задерживаются из-за ее пересеченной местности. Поскольку урбанизация Боснии необходима для национальной экономики, мы должны инвестировать в Боснию."
  YUG_Sourthen_Urbanization: "Урбанизация юга"
  YUG_Sourthen_Urbanization_desc: "Южные регионы, включая Черногорию, Македонию и Косово, еще не вышли из-под влияния долгого османского господства. Местная промышленность и города долгое время оставались отсталыми и заброшенными, а использование земли неэффективно.\nМы должны урбанизировать юг."
  YUG_Expand_Shipyards: "Расширение верфей"
  YUG_Expand_Shipyards_desc: "Мы находимся на Адриатике, и великие державы, включая Италию, следят за нами. Чтобы прорвать будущие военно-морские блокады и противостоять вторжениям, нам понадобятся верфи, способные строить военные корабли и транспорты."
  YUG_Construction_Improvements: "Улучшения в строительстве"
  YUG_Construction_Improvements_desc: "Без домов люди не могут жить, а без фабрик нельзя производить необходимые товары. Мы должны улучшить строительную способность государства, чтобы выжить в этом кризисе."
  YUG_Morava_Ironworks: "Моравский металлургический завод"
  YUG_Morava_Ironworks_desc: "В бассейне реки Моравы есть шахты, производящие различные ресурсы. Чтобы использовать их потенциал, мы должны построить металлургический завод, перерабатывающий эти ресурсы."
  YUG_Improved_Productivity: "Повышение производительности"
  YUG_Improved_Productivity_desc: "Улучшение нашей строительной способности позволило возвести многочисленные фабрики, но\n наша производительность даже не дотягивает до пяток передовых промышленных стран.\n Мы должны повысить производительность наших фабрик,\n чтобы использовать их более эффективно."

  YUG_War_Against_Italy: "Война против Италии"
  YUG_War_Against_Italy_desc: "В конце концов, война с Италией была неизбежна. Раз она началась, мы должны сражаться до конца. Нет ни компромисса, ни капитуляции. В конце этого пути только рабство."
  YUG_National_Emergency_Declaration: "Объявление национального чрезвычайного положения"
  YUG_National_Emergency_Declaration_desc: "Война с Италией — вопрос выживания для нашего государства и народа. Мы должны немедленно объявить национальное чрезвычайное положение и призвать к единству всего населения."
  YUG_Hold_the_Line: "Держать строй!"
  YUG_Hold_the_Line_desc: "Итальянские силы продолжают врываться на нашу территорию. Мы не можем отступать вечно. Вспомним дух Драгутина Гавриловича и солдат, которые при обороне Белграда в Великой войне предприняли отчаянную атаку на австро-венгерский плацдарм. Мы будем держать строй до последнего вздоха."
  YUG_urgent_mobilization: "Приказ о срочной мобилизации"
  YUG_urgent_mobilization_desc: "Фронт непрерывно пожирает войска. Чтобы заменить убитых и раненых и дать хоть минимальный отдых измотанным частям, мы должны решить нехватку рабочей силы. Для преодоления этой ситуации частичных мер недостаточно. Мы должны задействовать все мобилизуемые людские ресурсы и отправить максимально возможное количество войск на фронт."
  YUG_Short_term_production_increase: "Краткосрочное увеличение производства"
  YUG_Short_term_production_increase_desc: "Война пожирает огромное количество припасов. Солдаты на фронте не смогут должным образом сражаться без винтовок, пушек, радио, бинтов, боеприпасов и многих других материалов. Мы перегруппируем и реорганизуем тыл для достижения краткосрочного увеличения производства."
  YUG_One_Gun_One_Man: "По одной винтовке на человека"
  YUG_One_Gun_One_Man_desc: "Нам удалось усилить рабочую силу путем массовой мобилизации, но без винтовок они не смогут выполнять свою функцию на фронте. Мы должны увеличить производство оружия, чтобы, по крайней мере, можно было поставить одну винтовку на каждого человека."
  YUG_Scavenging_the_Legacy_of_the_Great_War: "Рыться в наследии Великой войны"
  YUG_Scavenging_the_Legacy_of_the_Great_War_desc: "Военных припасов всегда не хватает. Мы откроем склады, где были свалены излишки, оставшиеся после Великой войны, и используем пригодный материал."
  YUG_Coastal_Anti_Air_Base: "Прибрежная зенитная база"
  YUG_Coastal_Anti_Air_Base_desc: "Итальянские ВВС опустошают нашу территорию. Мы не сможем остановить их нашей слабой авиацией, но, развернув зенитные базы на побережье, сможем в определенной степени сопротивляться."
  YUG_Molotov_Cocktail_Supply: "Поставка коктейлей Молотова"
  YUG_Molotov_Cocktail_Supply_desc: "Большинство итальянской бронетехники использует бензиновые двигатели. А бензиновые двигатели уязвимы для огня. Мы будем поставлять коктейли Молотова как временное противотанковое средство."
  YUG_Mountain_Gun: "Горная пушка"
  YUG_Mountain_Gun_desc: "Территории Югославии и Италии состоят из многочисленных гор. Если мы разработаем специализированную для этого артиллерию, мы сможем завоевать огневое превосходство в горных районах."
  YUG_Strengthening_Communication_Network: "Усиление сети связи"
  YUG_Strengthening_Communication_Network_desc: "Если нужно упомянуть один из важнейших факторов современной войны, связь не может быть исключена. Мы проложим военные линии связи по всей стране и подготовим операторов, чтобы связь не прерывалась."
  YUG_Full_Scale_Counterattack: "Полномасштабное контрнаступление"
  YUG_Full_Scale_Counterattack_desc: "Итальянская армия истощила себя, нападая на нас. Ее боеприпасы иссякли, раненых не счесть, а моральный дух рухнул. Теперь наша очередь вышвырнуть их за границу."
  YUG_Climbing_the_Mountain_Alps: "Пересеките Альпы"
  YUG_Climbing_the_Mountain_Alps_desc: "Нам удалось вышвырнуть итальянскую армию за границу, но теперь Альпы преграждают нам путь. Мы проведем обучение горной войне для всей армии и подготовим зимнее снаряжение. Альпы больше не смогут нас остановить."
  YUG_Crossing_the_Piave_River: "Пересекая реку Пьяве"
  YUG_Crossing_the_Piave_River_desc: "Мы пересекли Альпы и также заняли Венецию. Теперь мы должны пересечь Пьяве. Подготовим саперов и понтонные мосты. Пересекайте горы и реки и двигайтесь к победе."
  YUG_Victory_in_Italy: "Победа в Италии"
  YUG_Victory_in_Italy_desc: "Мы победили. Теперь мы соберем уроки, полученные в Италии, и превратим их в доктрину для подготовки к будущим войнам."

