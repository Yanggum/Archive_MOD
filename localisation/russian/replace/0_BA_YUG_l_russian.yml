  ## Идеи
  anti_german_military: "Армия независимости"
  anti_german_military_desc: "Фракции внутри югославских ВВС отказываются сотрудничать с фашистскими государствами, угрожающими интересам Югославии. Если государство заключит союз с фашистами, они могут попытаться свергнуть режим."
