 l_russian:
  LOADING_TIP_0:0 "Добро пожаловать, учитель. Сегодня я тоже на Вас рассчитываю.\n- Сунаоками Сироко"
  LOADING_TIP_1:0 "Где бы найти хорошее местечко, чтобы вздремнуть~\n- Таканаси Хосино"
  LOADING_TIP_2:0 "Я Куроми Сэрика. Предупреждаю сразу: пока я с тобой, ты должен вести себя хорошо, понял?\n- Куроми Сэрика"
  LOADING_TIP_3:0 "Хорошего Вам дня, учитель~! Позвольте мне позаботиться обо всем, что Вам нужно.\n- Идзаёи Нономи"
  LOADING_TIP_4:0 "Если вопрос по расписанию, я тоже проверю.\n- Окусура Аянэ"
  LOADING_TIP_5:0 "Видите, учитель? Это называется 'быть в другой лиге'.\n- Рикухатима Ару"
  LOADING_TIP_6:0 "Та-дам! Наконец-то я появилась! А теперь повеселимся, учитель!\n- Асаги Муцуки"
  LOADING_TIP_7:0 "Хорошо не иметь привязанностей и не получать ран, но одиночество всё равно тяготит...\n- Ониката Каёко"
  LOADING_TIP_8:0 "Можно мне побыть с Вами? Если я ни на что не гожусь, скажите мне об этом в любой момент...\n- Игуса Харука"
  LOADING_TIP_9:0 "С Новым годом, учитель..! Спасибо, что специально позвонили мне... Извините!! ...А?! С-спасибо!\n- Игуса Харука"
  LOADING_TIP_10:0 "Э-эм... Вы точно хотели позвать меня? Не ошиблись?\n- Игуса Харука"
  LOADING_TIP_11:0 "Глава дисциплинарного комитета, Хинада. Мое имя Вы уже знаете... я в Вашем распоряжении.\n- Сорасаки Хина"
  LOADING_TIP_12:0 "Угх... угх, мне больно? Член дисциплинарного комитета Генны не должен так страдать!\n- Сироми Иори"
  LOADING_TIP_13:0 "Если Вам тяжело, скажите мне. Заботиться о Вас — тоже моя обязанность.\n- Амао Ако"
  LOADING_TIP_14:0 "Добро пожаловать в клуб кулинарных исследований. Отправимся в приключение в поисках идеального вкуса?\n- Куродатэ Харуна"
  LOADING_TIP_15:0 "Что?! Подождите! Это не входило в наши планы! Прогулка!? Вы в своем уме!? Вот так, просто взять и пойти!?\n- Амао Ако"
  LOADING_TIP_16:0 "Я Фуука из отдела снабжения. Если у Вас будут пожелания по блюдам, говорите в любое время.\n- Айкиё Фуука"
  LOADING_TIP_17:0 "Хаах, как я до такого докатилась? Ну ладно, раз уж так вышло, сделаю то, что должна.\n- Нацумэ Ироха"
  LOADING_TIP_18:0 "Трупы... нет, простите, где раненые?\n- Химуро Сэна"
  LOADING_TIP_19:0 "Препятствия? Разобраться с ними — предоставьте это мне!\n- Симокура Мэгу"
  LOADING_TIP_20:0 "У-чи-тель~ пожалуйста, еще одно усилие!\n- Хаясэ Юука"
  LOADING_TIP_21:0 "Не желаете ли погрузиться со мной в мир разума и логики?\n- Усио Ноа"
  LOADING_TIP_22:0 "Давайте делать мир веселее!\n- Конури Маки"
  LOADING_TIP_23:0 "Добро пожаловать, учитель. Вы прибыли примерно на 43 секунды раньше запланированного времени.\n- Омагари Харэ"
  LOADING_TIP_24:0 "Хе-хе, пришло время сиять супергениальной и деликатной хакерше из Миллениума?\n- Акэбоси Химари"
  LOADING_TIP_25:0 "Эми из Особого отдела по изучению паранормальных явлений. Ожидаю указаний.\n- Идзумимото Эйми"
  LOADING_TIP_26:0 "А? Вы шутите?\n- Микамо Нэру"
  LOADING_TIP_27:0 "Дзюдзю! Я знала, что я Вам понадоблюсь!\n- Итиносэ Асуна"
  LOADING_TIP_28:0 "Мой господин по умолчанию — Миллениум, но сегодня... Вы мой учитель.\n- Какудатэ Карин"
  LOADING_TIP_29:0 "§SСвет!§!\n- Тэндо Арису"
  LOADING_TIP_30:0 "С этого момента начинается супервеселая история!\n- Сайба Момой"
  LOADING_TIP_31:0 "Я помогу Вам лучшим ходом, учитель.\n- Сайба Мидори"
  LOADING_TIP_32:0 "Глава отдела разработки игр... Юдзу. Вы правда... возьмете меня с собой?\n- Ханаока Юдзу"
  LOADING_TIP_33:0 "Я знала, что этот момент настанет, и ждала его. Мгновение, когда ты произнесешь мое имя... прямо сейчас.\n- Нэкоцука Хибики"
  LOADING_TIP_34:0 "Ха-ха-ха... хоть я и несовершенна... пожалуйста, позаботьтесь обо мне.\n- Адзитани Хифуми"
  LOADING_TIP_35:0 "Я Урава Ханако. Рассчитываю на Вашу поддержку во многих аспектах с этого момента. ...Да, 'во многих аспектах'.\n- Урава Ханако"
  LOADING_TIP_36:0 "Если всё тщетно, зачем мы продолжаем жить...?\n- Сирасу Адзуса"
  LOADING_TIP_37:0 "Нечистые предметы будут сожжены, сожжены!\n- Симоэ Кохару"
  LOADING_TIP_38:0 "Кхэ-хэ-хэ...\n- Кэндзаки Цуруги"
  LOADING_TIP_39:0 "Хасуми Ханэкава из отдела осуществления правосудия. Жду Ваших приказов, учитель.\n- Ханэкава Хасуми"
  LOADING_TIP_40:0 "Задумывались ли вы когда-нибудь о короткейке? Учитель.\n- Ютори Нацу"
  LOADING_TIP_41:0 "Не стоит недооценивать меня из-за моего роста! Мои способности безграничны!\n- Ибараги Ёсими"
  LOADING_TIP_42:0 "Желаю Вам торжественного и святого дня.\n- Иоти Мари"
  LOADING_TIP_43:0 "Каждое твое движение... я всегда за ним наблюдаю.\n- Утадзуми Сакурако"
  LOADING_TIP_44:0 "...Вы в мире? Приветствую Вас от имени Тринити.\n- Кирифудзи Нагиса"
  LOADING_TIP_45:0 "Да! Вы долго ждали? Теперь мой черед сиять £GFX_BA_star\n- Мисоно Мика"
  LOADING_TIP_46:0 "Здесь как будто §Pпоявляется злой гений§!£GFX_BA_star Да! Я — воплощение всех моих планов.\n- £GFX_BA_mika"
  LOADING_TIP_47:0 "П-п-пожалуйста... тише...\n- Кодзэки Уи"
  LOADING_TIP_48:0 "Я Минэ Аомори, глава рыцарского ордена милосердия. Кому нужна помощь?\n- Аомори Минэ"
  LOADING_TIP_49:0 "Ну, главное — это твое настроение. Благодаря тебе, Сэрина очень счастлива!\n- Суми Сэрина"
  LOADING_TIP_50:0 "Спасибо за работу, учитель. Можно мне теперь пойти спать?\n- Касуга Цубаки"
  LOADING_TIP_51:0 "Мое тело всё еще недостаточно сильно... но я покажу Вам результаты своих тренировок.\n- Мидзуха Мимори"
  LOADING_TIP_52:0 "Именно в критические моменты, энергично! Здесь появляюсь я!\n- Исами Каэдэ"
  LOADING_TIP_53:0 "Ах, добро пожаловать, учитель! Мяу-мяу... Да, это было идеально.\n- Кавава Сидзуко"
  LOADING_TIP_54:0 "Учитель, я написала хайку... не хотите послушать?\n- Вараку Тисэ"
  LOADING_TIP_55:0 "Ах... наконец-то я Вас встретила!\n- Косака Вакамо"
  LOADING_TIP_56:0 "Идзуна, я буду стараться! Нин-нин!\n- Куда Идзуна"
  LOADING_TIP_57:0 "Ты терпеливо ждал? Ты хороший мальчик~\n- Сунохара Сюн"
  LOADING_TIP_58:0 "Если мне когда-нибудь придется есть морковку... в следующий раз я приду сюда.\n- Сунохара Кокона"
  LOADING_TIP_59:0 "Честь лицезреть высшую власть!\n- Рэнкава Черино"
  LOADING_TIP_60:0 "За президента Черино и для президента Черино!\n- Сасиро Томоэ"
  LOADING_TIP_61:0 "Бежать бесполезно!\n- Икэкура Марина"
  LOADING_TIP_62:0 "Дзюдзю... сколько бы я ни смотрела на твое лицо, учитель, оно мне никогда не надоест!\n- Амами Нодока"
  LOADING_TIP_63:0 "Время смешивать напитки и менять жизни.\n- Маёи Сигурэ"
  LOADING_TIP_64:0 "Я — работница Кивотоса, объединяйтесь!\n- Ясумори Минори"
  LOADING_TIP_65:0 "Я хочу быть еще... полезнее для студентов Кивотоса.\n- Накацукаса Кирино"
  LOADING_TIP_66:0 "Минуточку, простите~ время пончиков~\n- Нэмугаки Фубуки"
  LOADING_TIP_67:0 "Я ждала Вас, учитель. Если Вам понадобится сила Агентства общественной безопасности, дайте мне знать.\n- Огата Канна"
  LOADING_TIP_68:0 "RABBIT 1. Начинаю операцию.\n- Цукиюки Мияко"
  LOADING_TIP_69:0 "Позывной RABBIT 2. Связь в норме.\n- Сорай Саки"
  LOADING_TIP_70:0 "На связи RABBIT 3. Где следующая точка для бомбардировки?\n- Кадзэкура Моэ"
  LOADING_TIP_71:0 "Эм, на связи RABBIT 4. В-вы меня звали...?\n- Касумидзава Мию"
  LOADING_TIP_72:0 "Я всё еще сбилась с пути, но когда-нибудь...\n- Дзёмаэ Саори"
  LOADING_TIP_73:0 "Хотелось бы, чтобы на этой тропе тоже расцвело много цветов.\n- Хакари Ацуко"
  LOADING_TIP_74:0 "В этой гигантской пустоте нет ответов.\n- Имасино Мисаки"
  LOADING_TIP_75:0 "Жизнь — это череда страданий...\n- Цутинага Хиёри"
  LOADING_TIP_76:0 "Я ждала. Учитель.\n- Нанагами Рин"
  LOADING_TIP_77:0 "Фуфу, я ждала Вас.\n- Юраги Момока"
  LOADING_TIP_78:0 "Впечатляюще... Вы решили и это?\n- Ивабицу Аюму"
  LOADING_TIP_79:0 "Учитель! Время приступать к заданиям. Арона поможет Вам, будучи рядом!\n- Арона"
  LOADING_TIP_80:0 "...Сначала давайте проясним кое-что. Мы не желаем противостоять Вам. На самом деле, мы хотим сотрудничать.\n- ?? ??"
  LOADING_TIP_81:0 "Совет: это окно советов.\n- BA Mode Gaebaljin"
  LOADING_TIP_82:0 "Мир полон волшебства. Да, так же, как и наша встреча.\n- Сирао Эри"
  LOADING_TIP_83:0 "Музыка — это то, для чего достаточно просто разделять одно пространство.\n- Сиина Цумуги"
  LOADING_TIP_84:0 "...Хе-хе, как интересно. Я тоже с нетерпением буду ждать следующего раза. И как член совета общежития, и как Призрак Благодеяния.\n- Киёсуми Акира"
  LOADING_TIP_85:0 "Я защищу тебя. Так же, как и в своей прошлой жизни...\n- Итагаки Каноэ"
  LOADING_TIP_86:0 "Life is disaster.\n- Уцуми Аоба"
  LOADING_TIP_87:0 "Хоть тут и есть система автопилота, я ей почти не пользуюсь. Потому что это неинтересно, правда? Водить нужно своими руками.\n- Татибана Нодзоми"
  LOADING_TIP_88:0 "Академия железнодорожного транспорта Хайлендер — Татибана Хикари, в том числе — директор —\n- Татибана Хикари"
  LOADING_TIP_89:0 "Не волнуйтесь. Вы не умрете. Я не допущу этого. Исчезнуть должен не герой, а инструмент, уничтожающий мир.\n- Кэй"
  LOADING_TIP_90:0 "Я — воля, созданная под знаменем, и странник королевства, достигшего края мира. Имя, которое я сам дал себе как доказательство своего существования — Малхут.\n- Малхут"
  LOADING_TIP_91:0 "Гррраааа!\n- Сильнейший единорог-лев"