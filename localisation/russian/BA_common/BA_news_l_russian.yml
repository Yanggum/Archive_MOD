l_russian:
  
#События и новости
  BA_news.1.t:0 "Генеральный президент исчез"
  BA_news.1.desc:0 "После Великой войны 1935 года Кивотосу пришлось выдержать административные беспорядки и восстания. Теперь, два месяца спустя, генеральный президент исчез. Его исчезновение было подтверждено, когда административный сотрудник отправился вручать ежедневный отчет; однако директора Генеральной Ассоциации не объявляли о его отсутствии до недели спустя, вызвав еще больший переполох.\n\nГлавный администратор Рин Нанагами официально объявила об исчезновении генерального президента и заявила, что временно возьмет на себя его обязанности. Эксперты предсказывают, что усилия генерального президента по контролю над академиями, предпринятые после Великой войны, будут полностью сведены на нет."
  BA_news.1.a:0 "Не может быть..."
  BA_news.1.b:0 "Подтверждаю приказы."
  BA_news.1.c:0 "Что ты сказал?"
  BA_news.1.d:0 "Кажется, царит хаос."

  BA_news.2.t:0 "Студенческий совет объединяется с Schale!"
  BA_news.2.desc:0 "Сегодня мы получили шокирующую новость о том, что 'Schale', федеральный исследовательский клуб, основанный по приказу генерального президента, поглотил Студенческий Совет. По неизвестным причинам был активирован суперинтеллектуальный искусственный интеллект по имени 'Арона', хранившийся в Ящике Ситтим, и взял под контроль Schale. В конце концов, не в силах противостоять внутреннему расколу и коллапсу, Студенческий Совет согласился на объединение под руководством Ароны. Во время церемонии объединения Арона действовала только через свой голос, и Рин Нанагами объявила, что 'отныне Schale будет представлять Студенческий Совет'."
  BA_news.2.a:0 "Миссия выполнена!"
  BA_news.2.b:0 "Какая угроза..."
  BA_news.2.c:0 "Это озадачивает."
  BA_news.2.d:0 "Святилище что?"

  BA_news.3.t:0 "Тринити окутана тьмой"
  BA_news.3.desc:0 "Сегодня пришла ужасающая новость. Мисоно Мика передала все полномочия Чайной Вечеринки фракции Патер, консолидировав свою власть над Тринити. Эта новость потрясла весь Кивотос, и растут голоса, обеспокоенные коллапсом Тринити. Со времен Великой войны интриги между 'националистами' и фракцией Патер с целью сделать Мику хозяйкой Чайной Вечеринки наконец увенчались успехом.\n\nМисоно Мика, президент Тринити, открыто продемонстрировала желание радикализировать Тринити, используя враждебный язык по отношению к Генне. В настоящее время из-за контроля над доступом и въездом в Тринити внутреннее состояние академии неизвестно."
  BA_news.3.a:0 "Новый рассвет для Тринити."
  BA_news.3.b:0 "Тьма нависает над нами."
  BA_news.3.c:0 "Мы должны подготовиться."
  BA_news.3.d:0 "Завеса приподнята."

  BA_news.4.t:0 "Тринити начинает войну"
  BA_news.4.desc:0 "После бесконечной напряженности между академиями наконец вспыхнула война. На границе между Генной и Тринити, месте многочисленных предыдущих военных столкновений, Тринити предприняло внезапную атаку, спровоцировав масштабный конфликт. Генна, изначально вынужденная отступать, теперь перегруппировывает свои войска для создания прочной обороны на границе.\n\nС началом войны между двумя главными пороховыми бочками все внимание Кивотоса приковано к Генне и Тринити."
  BA_news.4.a:0 "Атакуйте всеми силами!"
  BA_news.4.b:0 "Сопротивляйтесь!"
  BA_news.4.c:0 "Подтверждено."

  BA_news.5.t:0 "Триумфальное шествие Тринити"
  BA_news.5.desc:0 "Вчера, через несколько дней после капитуляции Генны, войска Тринити провели грандиозное победное шествие в центре Генны. Мероприятие ознаменовало их решительную победу и продемонстрировало их военную мощь, выставив как самое передовое вооружение Тринити, так и трофейное оружие Генны.\n\nМисоно Мика провозгласила это славной победой, хотя некоторые наблюдатели выразили обеспокоенность по поводу влияния такой демонстрации на региональную стабильность. Пока отслеживаются реакции остаточных сил Генны и других игроков, мир следит за следующими шагами Тринити."
  BA_news.5.a:0 "Да здравствует Тринити!"
  BA_news.5.b:0 "Конец давней вражды."

  BA_news.6.t:0 "Британское правительство бежит в Канаду"
  BA_news.6.desc:0 "После поражения в войне с [KAI.GetName] британское правительство решило отправиться в изгнание в Канаду. Этой ночью огромные авиалайнеры перевезли британских политиков и королевскую семью на американский континент.\n\nХотя Лондон пал перед захватчиками, быстрая эвакуация позволила частично сохранить и королевскую семью, и вооруженные силы. Ученые по всему миру анализируют причины этого необычного явления."
  BA_news.6.a:0 "Мы вернемся."
  BA_news.6.b:0 "Великая победа."
  BA_news.6.c:0 "Какая шокирующая новость."
  BA_news.6.e:0 "Зловещее предзнаменование."

  BA_news.7.t:0 "Объявление Федерального Закона"
  BA_news.7.desc:0 "Сегодня утром [TRM.GetLeader] ворвалась в утренний покой с шокирующим заявлением. В официальной речи она раскрыла план ассимиляции Академии Генна с Тринити, с целью объединения обоих учреждений. Новость потрясла студентов Тринити, и после объявления толпы студентов вышли на улицы протестовать.\n\nХотя Бригаде Справедливости удалось разогнать демонстрации, сопротивление сохраняется. Эксперты предупреждают, что после недавней войны между двумя академиями политика ассимиляции столкнется с огромными препятствиями."

  BA_news.7.a:0 "'Генны' больше не существует."
  BA_news.7.b:0 "Армия, пытающаяся смешать воду и масло."

  BA_news.8.t:0 "Война Тринити с Советским Союзом"
  BA_news.8.desc:0 "Сегодня знаменует поворотный момент в мировой истории. Новостные каналы сообщают о продвижении Армии Тринити на советскую территорию, в то время как разведывательные службы мобилизуются. В крупных советских городах молодежь записывается в армию, а Красная Армия готовится противостоять силам Тринити.\n\nВоенные эксперты утверждают, что исход непредсказуем. Каким бы ни был результат, эта война оставит неизгладимый след в истории человечества."

  BA_news.8.a:0 "Атакуйте всеми силами!"
  BA_news.8.b:0 "Настойчивостью и трудом мы преодолеем любые препятствия."
  BA_news.8.c:0 "Столкновение двух гигантов."

  BA_news.9.t:0 "Единый Кивотос"
  BA_news.9.desc:0 "Сегодня на Чайной Вечеринке Тринити было официально провозглашено, что Кивотос объединен под руководством Мисоно Мики. Миллионы людей собрались на улицах Эдема, перед центральным зданием Тринити, приветствуя и размахивая их флагом.\n\nМисоно Мика была приведена к присяге как генеральный президент всего Кивотоса, и в своей речи она подчеркнула союз Тринити и академий. Кульминационный момент наступил, когда она объявила об 'окончательной и полной победе Тринити'."

  BA_news.9.a:0 "Сегодня поднялось знамя торжества."
  BA_news.9.b:0 "Подтверждено."

  BA_news.10.t:0 "Провозглашение Федерации Кивотоса"
  BA_news.10.desc:0 "Сегодня станет знаковым днем в истории Кивотоса. Революционные идеалы [FROM.GetAdjective] были провозглашены миру. [FROM.GetLeader], возглавляющий новую 'Федерацию Кивотоса', объявил коммунистическое видение после объединения академий, побежденных в гражданской войне Студенческого Совета.\n\nВ столице [FROM.GetAdjective] население торжественно отдает дань уважения, убежденное, что Федерация твердо движется к своим революционным идеалам. Ожидается, что народ сохранит пламя революции навсегда."

  BA_news.10.a:0 "Мы будем двигаться к революции!"
  BA_news.10.b:0 "Ох."
  BA_news.10.c:0 "Интересно."

  BA_news.11.t:0 "Жемчужина Средиземноморья, Италия"
  BA_news.11.desc:0 "Через несколько дней после капитуляции Британии перед Kaiser Corporation итальянская армия высадилась на Мальте и Кипре. Они заявили, что защищают человеческие территории от захватчиков, но на самом деле намереваются занять вакуум, оставленный упадком Британии в Средиземноморье.\n\nБританское правительство осудило это необъявленное вторжение как нарушение международного права и угрозу глобальному миру."

  BA_news.11.a:0 "Великая победа!"
  BA_news.11.b:0 "У Великобритании не было выбора."
  BA_news.11.c:0 "Мы не отступим!"

  BA_news.12.t:0 "Нападение на Юридзоно Сейю"
  BA_news.12.desc:0 "На Сейю Юридзоно, прозванную 'Реформатором' и избранную хозяйкой Чайной Вечеринки, напали в ее резиденции. Чайная Вечеринка созвала экстренное собрание; фракциям Санктус, Филиус и Патер потребуется время, чтобы выбрать следующего хозяина.\n\nКогда Орден Справедливости прибыл, нападавший уже скрылся, а Сейя была без сознания. В настоящее время она госпитализирована, и Орден обещает не оставлять нападавшего безнаказанным."

  BA_news.12.a:0 "Остановите преступника!"
  BA_news.12.c:0 "Они погружены в хаос."

  BA_news.13.t:0 "Хаос Тысячелетия"
  BA_news.13.desc:0 "В Кивотосе гремит новость о великом событии, исходящем из Миллениума. Чтобы очистить одни из самых проблемных руин, фракция Семина приказала провести бомбардировку, но это разбудило неописуемый страх, спавший глубоким сном.\n\nAL-1S быстро оценила ситуацию и начала контратаку против Семины, в ходе которой один из ее высокопоставленных командиров исчез. Кроме того, на Кивотос опустилась новая тьма."
  BA_news.13.a:0 "Принцесса."

  BA_news.14.t:0 "Япония раскрывает свои амбиции"
  BA_news.14.desc:0 "Когда таинственная сила, известная как Кивотос, высадилась в Европе и вызвала пожар по всему континенту, Японская Империя воспользовалась моментом, чтобы завоевать острова в Тихом океане и оккупировать концессии, принадлежавшие западным державам. Японское правительство представляет эти действия как победу своих суверенных прав и развернуло интенсивную пропагандистскую кампанию.\n\nПравительство Китайской Республики выразило решительный протест, а США направили жесткое предупреждение через своего посла в Токио."
  BA_news.14.a:0 "Да здравствует Император!"
  BA_news.14.b:0 "Они игнорируют наши предупреждения."
  BA_news.14.c:0 "Подтверждено."

  BA_news.15.t:0 "Разрушенное домино"
  BA_news.15.desc:0 "Сегодня в 11:00 тысячи людей пожаловались на необъяснимую головную боль. Пока мир погружался в замешательство из-за этого явления, небо ненадолго потемнело, и в северном полушарии наблюдались столпы неизвестного света.\n\nМеждународные эксперты подозревают, что это может быть событием, подобным высадке силы 'Кивотос' год назад. Кроме того, лицо, утверждающее, что оно агент разведки США, заявило, что 'это заговор внеземных сил', вызвав ожесточенные дебаты."
  BA_news.15.a:0 "Да будет свет!"

  BA_news.16.t:0 "Гражданская война в Генне"
  BA_news.16.desc:0 "Сегодня распространилась новость о крупном военном столкновении в Генне между Дирекцией и Манмаджоном. Дирекция утверждает, что изгоняет силы обороны и Манмаджон для восстановления порядка, в то время как Манмаджон обвиняет Дирекцию в предательстве из-за сотрудничества с Тринити. Обе стороны, с собственными аргументами, развязали гражданскую войну.\n\nСтолкновение уже идет, и предсказать победителя невозможно. Каким бы ни был результат, останутся только руины."
  BA_news.16.a:0 "Да здравствует Хина, глава Дирекции!"
  BA_news.16.b:0 "Солдаты Манмаджона, вперед!"
  BA_news.16.c:0 "Наши враги разделены."
  BA_news.16.d:0 "Гражданская война?"

  BA_news.17.t:0 "Коллапс Тринити"
  BA_news.17.desc:0 "Официально подтвержден коллапс Тринити, академии с многовековой историей, вызвав глубокое потрясение."
  BA_news.17.a:0 "Предки..."
  BA_news.17.b:0 "Это к лучшему."
  BA_news.17.c:0 "Выражаю свои соболезнования."
  BA_news.17.d:0 "Угроза уменьшилась."

  BA_news.18.t:0 "Свет цвета"
  BA_news.18.desc:0 "В одно мгновение все существа на планете издали крик ужаса перед ужасающей психической волной. Хотя она исчезла через секунды, все мы ее помним.\n\nПосле прохождения волны все одновременно посмотрели на север, вспоминая световой столп, виденный неделями ранее в северном полушарии. Это событие обрушило линии экстренной помощи по всему миру и породило культ, поклоняющийся этому таинственному свету."
  BA_news.18.a:0 "Глаз, взирающий на планету."

  BA_news.19.t:0 "Революция в Индии"
  BA_news.19.d:0 "[429.GetName] и его социалисты провозгласили 'Совет Бхарата', положив начало революции и войне за независимость в Индии. Толпы вооружились и восстали против колониального господства, готовые умереть за освобождение от веков угнетения. Тем временем британское правительство, все еще ошеломленное войной с [KAI.GetName] и потерей своей метрополии, не сделало официального заявления. Ситуация в Индии становится все более неопределенной."
  BA_news.19.a:0 "Кажется, индийцы жаждут независимости."

  BA_news.20.t:0 "Перемирие между Францией и Миллениумом"
  BA_news.20.d:0 "Франция и Миллениум больше не могли выносить разрушений войны. Этим утром их дипломаты в импровизированном зале переговоров на фронте достигли соглашения, которое заставило замолчать пушки и остановило кровопролитие."
  BA_news.20.a:0 "Это был выбор меньшего зла."
  BA_news.20.b:0 "Франция расколота."

  BA_news.21.t:0 "Война Франции за возвращение"
  BA_news.21.d:0 "Рано утром французский флот открыл огонь, ознаменовав начало официального состояния войны с Миллениумом. Изгнанные после своего поражения, французские изгнанники в Африке не сдались и оттуда начали свое наступление. С выстрелом их пушек началась операция по возвращению, и французы диаспоры восстают против господства Миллениума."
  BA_news.21.a:0 "Вперед, французская армия!"
  BA_news.21.b:0 "Сможет ли Франция вернуть свой дом?"

  BA_news.22.t:0 "Резня в [FROM.FROM.GetName]"
  BA_news.22.desc:0 "Ранним утром члены группы, называющей себя [FROM.GetName], заняли бывшую Научную Школу Миллениума и устроили кровавое истребление. По данным источников, все выжившие были казнены или подвергнуты процессам 'перевоспитания', а их места будут заменены металлическими автоматами.\n\nПеред лицом этого зверства международное сообщество уже готовится объявить войну [FROM.GetName], и мировые лидеры заявляют, что не могут допустить победы этих машин-убийц."
  BA_news.22.a:0 "Приказ выполнен."
  BA_news.22.b:0 "Действительно... жутко."

  BA_news.23.t:0 "Государственный переворот в Канаде"
  BA_news.23.desc:0 "Изгнанники, прибывшие в Канаду, свергли канадское правительство и, под руководством Эдуарда, установили новый режим путем государственного переворота."
  BA_news.23.b:0 "Влияние Тэджона достигло Америки."
  BA_news.23.a:0 "Ситуация в Канаде мрачна."

  BA_news.24.t:0 "Ковчег Атрахасиса"
  BA_news.24.desc:0 "В руинах бывшей школы Миллениума, Атрахасиса, было обнаружено загадочное здание. Кажется, оно связано с AL-1S, ответственной за падение Научной Школы Миллениума, но его цель все еще неизвестна."
  BA_news.24.a:0 "Ковчег."

  BA_news.25.t:0 "Падение Научной Школы Миллениума"
  BA_news.25.desc:0 "Произошло нечто невероятное. В течение нескольких дней линии связи Научной Школы Миллениума были перерезаны, и информации почти не поступало. Недавно сообщение, предположительно отправленное Микамо Неру, главой C&C, утверждало, что школа была уничтожена армией машин под командованием AL-1S, и сопротивление было минимальным. Научной Школы Миллениума, которую мы знали, больше не существует; вместо нее группа, называющая себя Атрахасисом, взяла на себя управление."
  BA_news.25.a:0 "Информация просочилась."
  BA_news.25.b:0 "Это кажется невероятным."

  BA_news.26.t:0 "Успех революции в Индии"
  BA_news.26.d:0 "Британская Империя, потеряв Британские острова, превратилась в тигра с вырванными клыками. Война за независимость Индии, возглавляемая южными революционерами, завершилась взятием Дели и победой повстанцев. Новое революционное правительство объявило о созыве совета для решения судьбы Бхарата."
  BA_news.26.a:0 "Победа над империализмом!"
  BA_news.26.b:0 "Британская Империя потеряла свою власть."
  BA_news.26.c:0 "Мы беззащитны."

  BA_news.27.t:0 "Запуск спутника Научной Школой Миллениума"
  BA_news.27.d:0 "Научная Школа Миллениума объявила, что после нескольких попыток им удалось запустить спутник в космос, и они уже планируют новые запуски. Мировые лидеры быстро созвали пресс-конференции, и было зарегистрировано множество наблюдений объекта, поднимающегося в небе."
  BA_news.27.a:0 "Миссия выполнена."
  BA_news.27.b:0 "Их технологии превосходят наши."

  BA_news.28.t:0 "Коллапс Стрезского фронта"
  BA_news.28.d:0 "Договор безопасности, поддерживавший Стрезский фронт, рухнул, когда один из его членов вышел. Министр иностранных дел Италии глубоко сожалел о ситуации и предупредил, что альянс может полностью распасться."
  BA_news.28.a:0 "Как прискорбно."
  BA_news.28.b:0 "Европа разваливается?"

  BA_news.29.t:0 "Французский парламент распущен"
  BA_news.29.d:0 "После возвращения континентальной территории маршал Петен объявил о роспуске французского парламента. Хотя депутаты пытались войти в здание, они были разогнаны жандармерией. Эксперты предупреждают, что французская демократия получила смертельный удар."
  BA_news.29.a:0 "Маршал поведет нас."
  BA_news.29.b:0 "Амбиции старца."

  BA_news.30.t:0 "Четвертый Интернационал"
  BA_news.30.desc:0 "Сегодня в Чернограде собрались многочисленные делегаты, посланные коммунистическими организациями со всего мира, для проведения конференции. Под влиянием сторонников теории Троцкого, таких как Ренка и Черино, была заложена основа Четвертого Интернационала.\n\nОднако до сих пор неизвестно, какое влияние окажет это движение на международную политическую арену. Эта новость разожгла зависть Сталина, который подозревает, что многие члены партийной верхушки и армии поддерживают Троцкого, и встревожен, обнаружив, что они все еще живы. Его паранойя полностью активизировалась, и Сталин заперся в своей резиденции. Его недоверие и нестабильность могут вызвать кризис в советском режиме и даже ввергнуть СССР в гражданскую войну."
  BA_news.30.a:0 "Сколько всего Интернационалов?"
  BA_news.30.b:0 "Поприветствуем наших новых товарищей!"
  BA_news.30.c:0 "Троцкисты..."
  BA_news.30.d:0 "Новое будущее для коммунизма?"

  BA_news.31.t:0 "Гражданская война в Kaiser Corporation"
  BA_news.31.desc:0 "Сегодня утром внезапный государственный переворот, возглавляемый высокопоставленными руководителями совета, погрузил Kaiser Corporation в гражданскую войну. Президентская фракция, сотрудники, нанятые советом, и остальной персонал начали вооруженные столкновения, и армия отступила от границы, чтобы сдержать внутренний кризис.\n\nПрезидент заявил, что предпочитает уничтожить компанию, чем позволить ей попасть в руки 'предателей'."
  BA_news.31.a:0 "Теперь пути назад нет."
  BA_news.31.b:0 "Гражданская война в компании?"

  BA_news.32.t:0 "Реставрация Габсбургов"
  BA_news.32.desc:0 "Никто бы этого не предвидел. Усилия Отто фон Габсбурга по возвращению трона Австрии увенчались успехом: он вступил в официальный союз с Абидосом, и ходят слухи о восстановлении двуединой австро-венгерской монархии. Под приветственные крики он был провозглашен королем во дворце в Вене.\n\nВ коронационной речи он неоднократно благодарил Абидос за верность и защиту и заявил о своем намерении вновь собрать земли Габсбургов, никогда не пренебрегая Абидосом."
  BA_news.32.a:0 "Ура!"
  BA_news.32.b:0 "Они полностью сошли с ума."
  BA_news.32.c:0 "Империя восстает снова?"

  BA_news.33.t:0 "Возвращение Монгольской Империи"
  BA_news.33.desc:0 "Наследник Великой Монгольской Империи, некогда доминировавшей в Евразии, вновь появился. Его экспансионистская политика увенчалась успехом: он обеспечил территории соседних стран и, после переговоров с СССР, получил Бурятию, Читу и Бодайбо."
  BA_news.33.a:0 "Ура!"
  BA_news.33.b:0 "Ужас вернулся."

  BA_news.34.t:0 "Открытие ядерного деления"
  BA_news.34.desc:0 "Эксперимент с ураном, проведенный Отто Ганом и Фрицем Штрассманом в химической лаборатории Тринити, удивил научное сообщество. При бомбардировке урана нейтронами неожиданно было обнаружено образование бария, более легкого элемента.\n\nЭто явление невозможно объяснить существующей теорией. Исследователи выдвинули гипотезу ядерного деления. Хотя экспериментальные результаты были очень точными, физическое объяснение остается туманным. Это открытие, открывающее возможность ядерного деления, привлекает внимание научного сообщества своей высвобождаемой энергией и потенциальными применениями."
  BA_news.34.a:0 "Какое открытие!"
  BA_news.34.b:0 "Это будет иметь огромные последствия."

  #Внезапные протесты во Франции!!
  #ㄴ Я знаю Францию, но мне очень жаль, что так вышло
  BA_news.35.t:0 "$FRA_prov_event.71.t$"
  BA_news.35.d:0 "$FRA_prov_event.71.d$"

  FRA_prov_event.38.t:0 "Возвращение Франции"
  FRA_prov_event.38.d:0 "Франция вернулась — то, что никто не считал возможным, стало реальностью. Последняя война, провозглашенная [FRA.getLeader] в Алжире, и возвращение метрополии наконец свершились, и французские граждане приветствуют свою окончательную победу. Победив гораздо более совершенные военные машины и сверхлюдей с ореолами, Франция восстанавливает свою администрацию и готовится к реконструкции."
  FRA_prov_event.38.a:0 "Да здравствует Франция!"
  FRA_prov_event.38.b:0 "Старый порядок вернулся."

  FRA_prov_event.39.t:0 "Освобождение Марселя"
  FRA_prov_event.39.d:0 "От порта Марселя до городского центра силы Миллениума сопротивлялись, но в конце концов Триколор был поднят в Ратуше, объявляя об освобождении города на берегу Атлантики. Многие французы присоединились к Сопротивлению, узнав новость, и неясно, сможет ли Миллениум сдержать это движение."
  FRA_prov_event.39.a:0 "Это только начало."
  FRA_prov_event.39.b:0 "Ситуация усложняется."

  FRA_prov_event.40.t:0 "Освобождение Бордо"
  FRA_prov_event.40.d:0 "Как и в Марселе, силы Миллениума сопротивлялись до последнего момента, но в конце концов Триколор был поднят в Ратуше Бордо, сигнализируя об освобождении города, выходящего на Атлантику. Многие граждане присоединились к Сопротивлению, и неизвестно, сможет ли Миллениум контролировать это расширение восстания."

  FRA_prov_event.41.t:0 "Освобождение Орлеана"
  FRA_prov_event.41.d:0 "Сегодня днем, около 17:00, французское правительство объявило об освобождении Орлеана, города в центре Франции. Находясь всего в 100 км от Парижа, многие уже предсказывают окончательную победу Франции."
  FRA_prov_event.41.a:0 "Конец уже виден!"
  FRA_prov_event.41.b:0 "Защищайте Башню Миллениума!"

  FRA_prov_event.44.t:0 "Зверства в Африке"
  FRA_prov_event.44.d:0 "Журналист раскрыл, что военное правительство Филиппа Петена во Франции жестоко угнетало и эксплуатировало африканских граждан. Согласно статье, в проектах принудительной индустриализации и урбанизации Алжира и прилегающих районов целые семьи остались без крова, и несколько рабочих погибли после двух дней работы без отдыха."
  FRA_prov_event.44.a:0 "И что с того?"
  FRA_prov_event.44.b:0 "Колониальная эксплуатация обнажена."

  FRA_prov_event.46.t:0 "Восстания в Индокитае"
  FRA_prov_event.46.d:0 "Под руководством Коммунистической партии Индокитая во главе с Хо Ши Мином во Французском Индокитае вспыхнула революция. За один день повстанцы заняли Ханойскую ратушу и зажгли искру восстания, в то время как северные провинции постепенно втягивались в конфликт."
  FRA_prov_event.46.a:0 "Всегда коммунисты создают проблемы."
  FRA_prov_event.46.b:0 "Это предел французского империализма."

  FRA_prov_event.53.t:0 "Конфликт в Экваториальной Африке"
  FRA_prov_event.53.d:0 "Территориальный спор между Соединенным Королевством и Французской Республикой перерос в столкновения. Сегодня утром французское правительство объявило войну Соединенному Королевству в своем посольстве в Алжире, требуя суверенитета над бывшей Французской Экваториальной Африкой. Аналитики полагают, что это ответ на отказ Британии вести переговоры после французского исхода в Алжир при поддержке британского флота."
  FRA_prov_event.53.a:0 "Наш давний союз разрушен."

  FRA_prov_event.65.t:0 "Государственный переворот во Франции"
  FRA_prov_event.65.d:0 "Во французском Правительстве Чрезвычайного Положения авторитарная политика Петена вызвала массовые забастовки и беспорядки. Противостояние между маршалом Петеном и офицером Анри Мордаком достигло кульминации, когда Мордак штурмовал офис Петена, требуя его отставки. Петену пришлось отречься, и Мордак учредил временное правительство с обещаниями демократии."
  FRA_prov_event.65.a:0 "Мордак поведет свободную Францию!"
  FRA_prov_event.65.b:0 "Я уже подозревал, что они замышляют."

  FRA_prov_event.71.t:0 "Галифаксская конференция"
  FRA_prov_event.71.d:0 "После британского изгнания в Канаду французские представители встречались в Галифаксе в течение нескольких дней. Они договорились о сотрудничестве для возвращения метрополии и обсудили различные уровни взаимодействия."
  FRA_prov_event.71.a:0 "Первый шаг к возвращению домой."
  FRA_prov_event.71.b:0 "У нас схожая судьба."

  FRA_prov_event.76.t:0 "Коллапс Франции"
  FRA_prov_event.76.d:0 "Угнетатели, изгнанные в Западную Африку, были свергнуты революцией. Подобно тому, как они разрушили монархию, стрела ранила их снова. Африка погружается в хаос, полевые командиры контролируют улицы, и происходят нападения на французских поселенцев. Колониальная империя пала и будет первой, кто исчезнет."
  FRA_prov_event.76.a:0 "Какая катастрофа."

  #Внезапные протесты во Франции!!
  BA_news.36.t: "Чайная Вечеринка стерта с лица земли"
  BA_news.36.d: "Сегодня в Эдеме взорвалась ядерная бомба. Более двух третей города были мгновенно разрушены; уцелели лишь несколько укрепленных зданий. Лидеры Чайной Вечеринки выживают с трудом, пытаясь сдержать кризис. Ужас оружия запечатлелся в коллективной психике: ценность жизни упала. Никто не рассматривал долгосрочные последствия радиоактивного ветра и бесчисленных жертв."
  BA_news.36.a: "Боже мой."

  BA_news.37.t:0 "Третья Советско-Польская война"
  BA_news.37.d:0 "Долгий конфликт между двумя нациями вспыхнул вновь. Сегодня утром в Москву поступило окончательное объявление войны Варшавой [SOV.GetName], положившее начало Третьей Польско-Советской войне. Польский посол заявил, что, пока их союзники с ними, в их победе нет сомнений. Перестрелки уже идут в Люблине и Белостоке, и будущее Восточной Европы неопределенно."
  BA_news.37.a:0 "Удастся ли России победить снова?"
  BA_news.37.b:0 "Сметем империю зла!"
  BA_news.37.c:0 "Пусть помнят 1921 год."

  BA_news.38.t:0 "Отставка Рё Цукацуки"
  BA_news.38.d:0 "Из-за недавних политических изменений в [MIL.GetName] Рё Цукацуки ушла в отставку с поста президента ассоциации семинаров и отказалась от всей политической власти. Пресса полагает, что она подверглась давлению, и ее местонахождение неизвестно. Мир с интересом ожидает назначения ее преемника."
  BA_news.38.a:0 "Это то, чего мы хотели."
  BA_news.38.b:0 "Очень сложная политическая структура."

  BA_news.39.t:0 "Суд над Рё Цукацуки"
  BA_news.39.d:0 "Суд над бывшим президентом Рё Цукацуки транслировался сегодня из Центра Миллениума. Несмотря на показания против нее, она хранила молчание, и слушание завершилось без сюрпризов. Это интерпретируется как укрепление власти нового президента [MIL.GetLeader]."
  BA_news.39.df:0 "Во время предвзятого суда Рё Цукацуки красноречием перевернула ситуацию, вынудив его преждевременно завершиться. Хотя предполагалось укрепить власть [MIL.GetLeader], провал этой попытки может развязать политический кризис в Миллениуме."
  BA_news.39.a:0 "Теперь она преступница."
  BA_news.39.b:0 "Действительно исключительная."
  BA_news.39.c:0 "Интересно."

  BA_news.40.t: "Объявление изоляции Британских островов"
  BA_news.40.d: "Британское правительство официально признало свое поражение перед неизвестными пришельцами. Король Георг V погиб в бою. За неимением альтернативы, корона объявила 'Политику изоляции Британских островов' — решение, которое обсуждалось, но считалось неизбежным после унизительного поражения."
  BA_news.40.a: "Мы вернем утраченное."
  BA_news.40.b: "Есть еще гражданские, которых нужно защищать!"
  BA_news.40.c: "Побежденные в ярости."

  BA_news.41.t: "Падение Тринити"
  BA_news.41.d: "[SOV.GetName] занял Эдем; Тринити капитулировало. Мисоно Мика и ее последователи исчезли, а Утазуми Сакурако и Ханекава Хасуми подписали капитуляцию. Красная армия водрузила флаг [SOV.GetName] в Парламенте Эдема, удостоверяя уничтожение Тринити."
  BA_news.41.a: "Слава народу!"
  BA_news.41.b: "Империя зла пала."
  BA_news.41.c: "..."

  BA_news.42.t: "Реактивация города-крепости Эриду"
  BA_news.42.d: "Эриду, павший после последнего крупного французского штурма, возобновил операции. Хотя Научная Школа Миллениума официально не подтвердила, все указывает на то, что крепость была отремонтирована и запущена, хотя ее былого великолепия, кажется, достичь не удастся."
  BA_news.42.a: "Самая мощная крепость возвращается к жизни."

  BA_news.43.t: "Роспуск Союзников"
  BA_news.43.d: "Сегодня Соединенное Королевство объявило о роспуске Союзников. Было заявлено, что без Оси альянс не имеет цели. Несколько членов критиковали это решение, но британское правительство хранило молчание."
  BA_news.43.a: "А как же пришельцы?"

  BA_news.44.t: "Политическое насилие перерастает в гражданскую войну"
  BA_news.44.d: "Столкновения между чернорубашечниками, коммунистами и противниками социализма усилились. По всей стране формировались ополчения, вынуждая армию выбирать стороны. Автономия флота и федералов поддерживает 'демократическое' правительство, но многие подразделения дезертировали. Озворлд Мозли провозгласил правительство кризиса для управления конфликтом до его завершения."
  BA_news.44.a: "Будущее родины поставлено на карту!"

  BA_news.45.t: "Конец гражданской войны в Британии"
  BA_news.45.d: "Отсутствие народной поддержки привело демократическое правительство к признанию нашей победы и поиску мира в своих колониях. Королевский флот вернулся под наше командование, а автономии отказываются следовать за недемократическим правительством, предпочитая оставаться независимыми членами Содружества."
  BA_news.45.a: "Начнем восстановление."

  BA_news.46.t: "Второе Собрание"
  BA_news.46.d: "После победы фракции Ариус в Эдеме Второе Собрание Тринити запретило все фракции, кроме Ариус. Эксперты Кивотоса комментируют, что это интерпретируется как месть за изгнание Ариус на Первом Собрании."
  BA_news.46.a: "Это обещанная месть."
  BA_news.46.b: "Невероятно."
  BA_news.46.c: "Понял."

  BA_news.47.t:0 "Изгнание Петена"
  BA_news.47.d:0 "После дней массовых забастовок и протестов французское изгнание низложило Петена. Анри Мордак и его последователи штурмовали резиденцию Петена, заставили его уйти в отставку, и Ассамблея в Алжире полностью отстранила его."
  BA_news.47.a:0 "Двигаемся к демократии!"
  BA_news.47.b:0 "Франция все еще в кризисе."

  BA_news.48.t:0 "Подъем Сообщества Восточной Африки"
  BA_news.48.d:0 "С уходом Британии Кения, Уганда и Танзания объединились под эгидой Сообщества Восточной Африки. После интенсивных переговоров они согласились на федерацию для защиты от возможной реколонизации."
  BA_news.48.a:0 "Конец империализма приближается."
  EAC_leader_name: "Конференция Сообщества Восточной Африки"

  BA_news.49.t:0 "Рождение Социалистической единой партии Германии"
  BA_news.49.d:0 "После коллапса Тринити социалистические партизаны объединили Коммунистическую партию и Социал-демократическую партию в новую Социалистическую единую партию Германии, которая будет функционировать как единственная социалистическая сила. Члены правого крыла были изгнаны, и [KPD.GetName], кажется, движется к социалистическому государству."
  BA_news.49.a:0 "К победе коммунизма!"
  BA_news.49.b:0 "Глобальная нестабильность возрастет."

  BA_news.50.t:0 "Создание Организации Берлинского договора"
  BA_news.50.d:0 "СССР и [ROOT.GetName] объявили об основании Организации Берлинского договора, военного, гражданского и разведывательного альянса, предназначенного для противодействия растущей нестабильности в Европе и мире."
  BA_news.50.a:0 "Мы победим вместе!"
  BA_news.50.b:0 "Новая международная угроза."

  BA_news.51.t:0 "Гражданская война в Хяккияко"
  BA_news.51.d:0 "В Академии Хяккияко группа, называющая себя [FROM.GetName], объявила войну студенческому правительству, развязав внутренний конфликт крупного масштаба. [FROM.GetName] претендует на звание единственной законной власти. Международные СМИ критикуют хрупкость их политической системы."
  BA_news.51.a:0 "Восстановите порядок!"
  BA_news.51.b:0 "Захватывающий сценарий."

  BA_news.52.t:0 "Нападение на Широми Иори!"
  BA_news.52.d:0 "Широми Иори, специалист второго года Дисциплинарного комитета Генны, была тяжело ранена выстрелом из дробовика и ударом приклада. Подтверждено, что нападавшей была Игуса Харука. Врачи оценивают восстановление в месяцы, что ослабит Дисциплинарный комитет."
  BA_news.52.a:0 "Подтверждено."

  BA_news.53.t:0 "Агентство 68 приходит к власти в Генне"
  BA_news.53.d:0 "Агентство 68 взяло на себя управление Академией Генна. Заручившись поддержкой студентов, ее директор Рикухачима Ару потребовала передачи власти, и, к удивлению, студенческий совет одобрил это. Старый режим Манмаджона, одного из Трех Великих, рухнул, и теперь Агентство возвышается как новая сила."
  BA_news.53.a:0 "Подтверждено."

  BA_news.54.t:0 "Бомбардировка Тринити Агентством"
  BA_news.54.d:0 "Подтверждено, что Разведывательное Агентство провело интенсивную бомбардировку Тринити. Прошлой ночью батареи возле границы открыли одновременный огонь, разрушая деревни и города и вызывая многочисленные жертвы. Этот акт провокации может развязать более крупный конфликт."
  BA_news.54.a:0 "Подтверждено."

  BA_news.55.t:0 "Взрыв в рамэнной Шибасаки"
  BA_news.55.d:0 "Знаменитая рамэнная Шибасаки в Абидосе была взорвана минами Клеймор. Подозревается, что студентка первого года Генны установила и привела в действие взрывчатку. Взрыв ощущался за 10 км от кампуса, и культовое блюдо исчезло полностью."
  BA_news.55.a:0 "Подтверждено."

  BA_news.56.t:0 "Рикухачима Ару, президент студенческого совета Генны"
  BA_news.56.d:0 "После умиротворения Генны Рикухачима Ару была законно избрана президентом студенческого совета. Ее избрание знаменует конец старого правительства Манмаджона и начало новой эры под ее руководством."
  BA_news.56.a:0 "Подтверждено."

  BA_news.57.t: "[RED.GetNameDef] переживает государственный переворот"
  BA_news.57.desc: ""
  BA_news.57.a: "Свергнем Черино!"
  BA_news.57.b: "Все по плану..."
  BA_news.57.c: "У них получилось."

  BA_news.58.t:0 "Учреждение Чешского Временного Правительства"
  BA_news.58.d:0 "Сегодня в Судетах было сформировано Чешское Временное Правительство. При поддержке малой академии Абидос они обещают вернуть всю чешскую территорию и осуждают репрессии Альянса Пэкгуя. Мир наблюдает за этим беспрецедентным сотрудничеством между двумя мирами."
  BA_news.58.a:0 "Какие плоды принесет этот союз?"

  BA_news.59.t:0 "Теорема невозможности"
  BA_news.59.d:0 "Статья из [MIL.GetName] излагает 'Теорему невозможности', доказывающую, что не существует демократической системы предпочтений, которая правильно оценивала бы общественное благосостояние. Если она будет принята, это подрывает идею демократического и рационального общества. Экономисты яростно спорят, и в авторитарных государствах уже возникли протесты."
  BA_news.59.a:0 "Рая не существует."
  BA_news.59.b:0 "Невероятно."

  BA_news.60.t:0 "Восшествие Ибуки Танга на трон"
  BA_news.60.d:0 "После серии интриг в Манмаджоне [FROM.GetLeader] взошел на трон и провозгласил Ибуки Танга императрицей. Говорят, что теперь она защитница Генны и проводник для всех ее студенток. Ее международное влияние все еще неясно."
  BA_news.60.a:0 "За нашу императрицу!"
  BA_news.60.b:0 "Подозрительно странно."

  BA_news.61.t:0 "Государственный переворот в Агентстве Общественной Безопасности"
  BA_news.61.d:0 "Полицейская Академия Валькирия объявила об отстранении директора Огата Канны на экстренном заседании Агентства Общественной Безопасности. Флаг Агентства был поднят в штабе, а Канна находится под домашним арестом. Аналитики считают, что Валькирия потеряла административный контроль."
  BA_news.61.a:0 "Будущее Валькирии неопределенно!"

  BA_news.62.t:0 "Константинское соглашение"
  BA_news.62.d:0 "Франция, под давлением требований независимости Алжира и международного сообщества, вела переговоры в Константине с алжирскими лидерами. Они договорились об уступках Алжиру, который сохранит экономическую зависимость в течение десятилетия до полной независимости."
  BA_news.62.a:0 "Взаимная выгода."
  BA_news.62.b:0 "Франция без насилия?"

  BA_news.63.t:0 "Война за независимость Алжира"
  BA_news.63.d:0 "Когда репрессивные меры против мусульман вызвали протесты, демонстранты заняли ратушу Алжира, обозначив критическую точку в Северной Африке. Минуты спустя, с поднятием алжирского флага, было объявлено о начале войны за независимость. Различные алжирские политические группы сформировали молодежные ополчения и атаковали французские базы. Французское правительство объявило 'Операцию по поддержанию порядка в Северной Африке', предвещая жесткие репрессии."
  BA_news.63.a:0 "Единая Франция под угрозой со стороны мусульман!"
  BA_news.63.b:0 "Колониальная империя рушится."

  BA_news.64.t:0 "Возвышение Коммунистической партии Чехии"
  BA_news.64.d:0 "Сегодня, после возвращения Чехии и политического хаоса в Академии Абидос, Коммунистическая партия Чехии одержала победу во внутренней борьбе за власть и объявила, что будет управлять страной под своим руководством. Академия Абидос осудила этот захват власти, но эффективных действий по оспариванию не ожидается."
  BA_news.64.a:0 "Невероятно."

  BA_news.65.t:0 "Конференция в Яулжи"
  BA_news.65.d:0 "В Яулжи обсуждался пакт о взаимной обороне между [POL.GetName] и [ABY.GetName] на фоне международной нестабильности. Обе стороны подтвердили, что договор направлен на обеспечение прочного мира в Центральной Европе, и соседние страны внимательно следят за этими событиями."
  BA_news.65.a:0 "Держи их под наблюдением."

  BA_news.66.t: "Государственный переворот во Франции!"
  BA_news.66.desc: "В [Getyear] году [GetMonth] армия под руководством Филиппа Петена восстала против радикального правительства, обвиняемого в трусости и некомпетентности. Они штурмовали парламент и захватили власть. Тысячи солдат маршируют в Алжире, встречаемые народными приветствиями. Петен пообещал преодолеть национальный кризис и вернуть метрополию, завоевав пыл французов."
  BA_news.66.a: "Маршал, мы здесь!"
  BA_news.66.b: "Это второе повторение 18 брюмера."

  BA_news.67.t: "Независимость следственной власти Валькирии"
  BA_news.67.d: "Директор Немугаки Фубуки из Полицейской Академии Валькирия объявила сегодня, что вернула себе следственные полномочия, которые до сих пор находились у Шале как федерального департамента, оказавшегося бесполезным. Фубуки заявила, что Валькирия будет действовать как независимый и исправительный орган, выполняя свою функцию как сила поддержания закона. Ожидается сопротивление других академий, но Фубуки обещала больше деталей в будущем. В любом случае, имя 'Шале' исчезнет из административных записей Валькирии."
  BA_news.67.a: "Воительница разорвала свои цепи!"
  BA_news.67.b: "Начнем!"
  BA_news.67.c: "Как они смеют!"

  BA_news.68.t: "Сейя Юридзоно избрана хозяйкой Чайной Вечеринки"
  BA_news.68.desc: "После экстренного заседания Чайной Вечеринки Сейя Юридзоно была избрана новой хозяйкой. В своей речи Юридзоно предупредила, что Тринити сталкивается с новой угрозой и не может игнорировать свои проблемы. Ожидается, что под ее руководством Чайная Вечеринка претерпит значительные преобразования."
  BA_news.68.a: "Мне это не слишком интересно."
  BA_news.68.b: "Надеюсь, все получится."
  BA_news.68.c: "Интересный выбор."

  BA_news.69.t: "Французское восстание в Миллениуме"
  BA_news.69.desc: "В Научной Школе Миллениума вспыхнуло массовое восстание. Это приписывают неспособности школы справиться с французским сопротивлением после войны. Французское правительство, изгнанное в Африку, хранит молчание, хотя были обнаружены следы тайных поставок, отправленных во Францию."
  BA_news.69.a: "У них немного шансов."
  BA_news.69.b: "[MIL.GetLeader], ответь за это."
  BA_news.69.c: "Еще одна война?"

  BA_news.70.t:1 "Убийство Льва Троцкого"
  BA_news.70.d:2 "Лев Троцкий, бывший соратник Ленина и претендент на советское руководство, умер сегодня в норвежской больнице после нападения с ледорубом испанского агента, связанного с советским Министерством внутренних дел. После внутреннего поражения он жил в изгнании в Норвегии как политический советник Федерации Школы Красной Зимы."
  BA_news.70.a:0 "Ужасно."
  BA_news.70.b:0 "Миссия выполнена."
  BA_news.70.c:0 "Заслуженный конец для агитатора."
  BA_news.70.q:0 "Сегодня пала наша звезда."

  BA_news.71.t: "Революция в Японии!"
  BA_news.71.d: "В Японии вспыхнула демократическая революция: огромные демонстрации свергли милитаристский режим в Токио при широкой народной поддержке. Вооруженные силы и группы правого толка обещают сопротивляться, что положило начало гражданской войне."
  BA_news.71.2.t: "Минсю Икки"
  BA_news.71.2.d: "Демократическое восстание распространяется по всей Японии: города и промышленность присоединяются к движению, в то время как армия и крайне правые заявляют, что будут сражаться до конца."

  BA_news.72.t:1 "[FROM.GetAdjective] весна"
  BA_news.72.d:2 "Иностранные вещатели в милитаризованной зоне [FROM.GetAdjective] единодушно сообщили о 'движении за независимость', охватывающем всю территорию. Временное правительство, называющее себя 'подпольным правительством древнего королевства', зачитало по радио свою декларацию независимости. Конгресс [USA.GetName] одобрил необычную поддержку, поддержанную [ENG.GetName], [FRA.GetName] и [ITA.GetName]."
  BA_news.72.a:0 "Борьба за свободу."
  BA_news.72.b:0 "Немедленные меры."

  BA_news.73.t: "Аннексия Санкайкэй"
  BA_news.73.d: "После нацистского переворота в столице [SHA.Capital] войска Тринити пересекли границу и оккупировали район, встреченные приветствиями. На площади Хеден Мисоно Мика объявила о слиянии с Тринити и провозгласила регион стратегическим бастионом."
  BA_news.73.a: "Восточная крепость возрождается!"

  BA_news.74.t: "Британская победа!"
  BA_news.74.d: "Британская армия, оказавшаяся в ловушке после падения Лондона, перегруппировалась в Ливерпуле и предприняла чудесную контратаку против Kaiser Corporation, переломив ход событий и одержав одну из самых памятных побед в британской истории."
  BA_news.74.a: "Правь, Британия!"

  BA_news.75.t: "[TRM.GetName] оформляет анти-Краснозимний пакт"
  BA_news.75.d_soviet: "[TRM.GetLeader] всегда выступал против коммунизма и рассматривал [TRM.GetNameDef] как своего врага. Сегодня они оформили 'анти-Краснозимний пакт' — договор, обязывающий его подписантов к взаимной обороне против любой агрессии Красной Зимы."
  BA_news.75.d_not_soviet: "[TRM.GetNameDefCap] осуждал коммунизм годами и теперь распространяет договор, чтобы страны, которым угрожает [RED.GetName], могли присоединиться и поддержать того, кто подвергнется нападению."

  BA_news.76.t:0 "Побег семи заключенных"
  BA_news.76.desc:0 "С исчезновением президента студсовета семеро заключенных — Осаке Вакамо, Киёсуми Акира, Синтани Кай и другие — сбежали из тюрьмы Валькирии. Это событие обнажило послевоенную уязвимость и заставило студсовет и Валькирию хранить молчание."
  BA_news.76.a:0 "Шокирующе."
  BA_news.76.b:0 "Это было предсказуемо."

  BA_news.77.t:0 "Фестиваль Хяккияко"
  BA_news.77.desc:0 "Хяккияко отпраздновало свой большой фестиваль с цветущей сакурой, фонариками и фейерверками. Празднество продемонстрировало великолепие и развитие академии в ночное время."
  BA_news.77.a:0 "Наша честь вечна!"
  BA_news.77.b:0 "Это воистину прекрасно."

  BA_news.78.t:0 "Война НамКиботос"
  BA_news.78.desc:0 "Пограничный конфликт между [HYA.GetNameDef] и [SHA.GetNameDef] перерос в вооруженное столкновение, которое угрожает распространиться на весь Киботос. Сохраняется обеспокоенность по поводу более широкой войны между академиями."
  BA_news.78.a:0 "Изгоним захватчика!"
  BA_news.78.b:0 "Вернем нашу академию."
  BA_news.78.c:0 "Шокирующая новость."

  BA_news.79.t:0 "Гражданская война в Красной Зиме"
  BA_news.79.desc:0 "Забастовки и движение Ясунори Минори и гражданских ополчений переросли в революцию. Хотя МИД преуменьшает это, международные эксперты сомневаются в способности правительства подавить восстание."
  BA_news.79.a:0 "За революцию!"
  BA_news.79.b:0 "Отвергнем подрывных элементов!"
  BA_news.79.c:0 "Это было неизбежно."

  BA_news.80.t:0 "Резня в Миллениуме"
  BA_news.80.desc:0 "Научная Школа Миллениума казнила без суда пленных, граждан и студенческие организации, арестовывая или убивая диссидентов. Международное сообщество осуждает это зверство как военное преступление."
  BA_news.80.a:0 "Они думали, мы этого хотели?"
  BA_news.80.b:0 "Боже мой..."

  BA_news.81.t: "Передача Трансильвании"
  BA_news.81.desc: "При германском посредничестве Северная Трансильвания была возвращена Венгрии по договору, подписанному в Вене. Это вновь открывает дебаты о границах после великой войны."
  BA_news.81-2.desc: "Германия выступила посредником в Вене для полного возвращения Трансильвании Венгрии, что вызвало дебаты о реорганизации границ в послевоенный период."

  BA_news.82.t:0 "Элизабет вступает на венгерский трон"
  BA_news.82.desc:0 "Элизабет, внучка Франца Иосифа I, была провозглашена королевой Венгрии в Будапеште, обязавшись улучшить условия рабочих и защищать наиболее уязвимых."
  BA_news.82.a:0 "За королевство народа!"
  BA_news.82.b:0 "Социалистическая монархия?"

  BA_news.83.t:0 "Реставрация Австро-Венгрии"
  BA_news.83.desc:0 "Венгрия освободила Австрию и объявила о восстановлении двуединой империи. Императрица Элизабет поклялась защищать угнетенных и искоренить бедность, несмотря на обеспокоенность соседних государств."
  BA_news.83.a:0 "Мы не забудем жертву народа."
  BA_news.83.b:0 "Красная империя?"
  BA_news.83.c:0 "Границы под угрозой."

  BA_news.84.t:0 "Левые в [FROM.GetName]"
  BA_news.84.desc:0 "После исчезновения их лидера $COU_MOMOKA$ ушла с поста президента и передала власть народному комитету. Грядут радикальные реформы, вдохновленные социализмом."
  BA_news.84.a:0 "Да здравствует революция!"
  BA_news.84.b:0 "Слишком левые."
  BA_news.84.c:0 "Угрожающе."

  BA_news.85.t:0 "MOMOKA, почетный президент"
  BA_news.85.desc:0 "Реформистский комитет [FROM.GetName] предложил почетный титул президента $COU_MOMOKA$, и она приняла его как символическую фигуру."
  BA_news.85.a:0 "Вперед с реформами!"
  BA_news.85.b:0 "Новый союзник?"
  BA_news.85.c:0 "Согласен."

  BA_news.86.t:0 "Победа MOMOKA в борьбе за власть"
  BA_news.86.desc:0 "$COU_RIN$ сформировала комитет после исчезновения лидера, но $COU_MOMOKA$, прислушавшись к народным требованиям, стала истинной победительницей и заняла пост председателя комитета."
  BA_news.86.a:0 "За нового лидера!"
  BA_news.86.b:0 "Интересно."

  BA_news.87.t:0 "Выход [FROM.GetName] из кооператива Киботос"
  BA_news.87.desc:0 "[FROM.GetName] объявил о выходе из кооперативной организации Киботос, заявив, что она больше не приносит им пользы. Основанная после войны, она теперь теряет авторитет без своего основателя."
  BA_news.87.a:0 "Жаль."
  BA_news.87.b:0 "Единство рушится?"

  BA_news.88.t:0 "Конец кооператива Киботос"
  BA_news.88.desc:0 "[FROM.GetName] вышел и доказал, что сотрудничество в Киботосе не имеет смысла. Организация потеряла своего проводника и причину существования."
  BA_news.88.a:0 "Новая эра начинается!"
  BA_news.88.b:0 "Прощай, Киботос."

  BA_news.89.t:0 "Резолюция 47 Киботоса"
  BA_news.89.desc:0 "Президент [FROM.GetName] активировал норму, отстраняющую любого члена, находящегося в состоянии войны с другим, что привело к исключению и протесту со стороны санкционированных."
  BA_news.89.a:0 "Это нам выгодно?"
  BA_news.89.b:0 "Жалко."

  BA_news.90.t:0 "Исключение [FROM.GetName]"
  BA_news.90.desc1:0 "Организация Киботос отстранила [FROM.GetName] за ратификацию запрещенного договора, впервые исключив члена по этой причине."
  BA_news.90.desc2:0 "Отстранение после исключения подписанта демонстрирует продолжающуюся потерю авторитета кооператива."
  BA_news.90.a:0 "Это преимущество для нас?"
  BA_news.90.b:0 "Неслыханно."

  BA_news.91.t:0 "Победа Санкайкэй"
  BA_news.91.desc:0 "[SHA.GetName] победил [HYA.GetName] в войне НамКиботос. На центральной площади [SHA.getLeader] провозгласил военную, стратегическую и политическую победу, утвердив свою гегемонию."
  BA_news.91-2.desc:0 "После сокрушительной победы они объявили о создании 'нового порядка' в столице и плане 'жизненного пространства'. Слухи о чистках беспокоят международное сообщество."
  BA_news.91-3.desc:0 "Урушибара Кагуя заявила, что консервативная революция вступает в новую фазу. Публика ликовала, и только ей известна конечная судьба."
  BA_news.91.a:0 "Великий триумф!"
  BA_news.91.b:0 "Смотрите на возвышение."
  BA_news.91.c:0 "Будущие проблемы?"
  BA_news.91.d:0 "Тень распространяется."
  BA_news.91.e:0 "Признаю поражение."
  BA_news.91.f:0 "Предусмотрительно."

  BA_news.92.t:0 "Победа Хяккияко"
  BA_news.92.desc:0 "[HYA.GetName] выиграл благодаря ночным операциям и систематическим оккупациям. Их силы взяли ключевые точки и установили жесткий контроль. На конференции [HYA.GetLeader] объявил об усилении безопасности, хотя корреспонденты выражают сомнения."
  BA_news.92.a:0 "Послевоенная реконфигурация."
  BA_news.92.b:0 "Придется подождать результатов."
  BA_news.92.c:0 "Невероятно."

  BA_news.93.t:0 "Победа Абидоса"
  BA_news.93.desc:0 "Малая Академия Абидос добилась удивительной победы в НамКиботос благодаря местной поддержке и тактике партизанской войны. [ABY.GetLeader] провозгласил, что их победа — это победа населения, и их план восстановления привлекает международное внимание."
  BA_news.93.a:0 "Мир восстановлен."
  BA_news.93.b:0 "Невероятно."

  BA_news.94.t:0 "Здоровье Огата Канны ухудшается"
  BA_news.94.desc:0 "Лидер Огата Канна потеряла сознание от переутомления, пытаясь решить проблемы Полицейской Академии Валькирия после войны. Ее падение предвещает смену власти в Валькирии."
  BA_news.94.a:0 "Плохие новости."
  BA_news.94.b:0 "Понял."

  BA_news.95.t:0 "Отставка Огата Канны"
  BA_news.95.desc:0 "Огата Канна ушла в отставку с поста президента студсовета [KSP.GetName] из-за ухудшения здоровья и борьбы за власть. Ожидается неизбежная политическая перестройка."
  BA_news.95.a:0 "..."
  BA_news.95.b:0 "Наконец-то это случилось."

  BA_news.96.t:0 "Возрождение Лиги Наций"
  BA_news.96.desc:0 "После вторжений пришельцев Лига Наций устарела. Теперь, когда мир един, они обещают не повторять ошибок прошлого."
  BA_news.96.a:0 "На этот раз она выживет."
  BA_news.96.b:0 "Просыпается гигант."
  BA_news.96.c:0 "Благословение нам."

  BA_news.97.t:0 "США сближаются с Киботосом"
  BA_news.97.desc:0 "США официально объявили о дружбе и сотрудничестве с Киботосом. Европа обвиняет их в предательстве, в то время как Киботос празднует этот шаг как ключевой для интеграции человека и пришельца. Мир ждет их следующего хода."
  BA_news.97.a:0 "Время показать убеждения."
  BA_news.97.b:0 "Они знают, за кем следовать."
  BA_news.97.c:0 "Конец человечества!"

  BA_news.98.t:0 "Формирование Федерации Междуморья"
  BA_news.98.desc:0 "Польша и страны Восточной Европы создали Федерацию Междуморья после укрепления связей в войне [SOV.GetAdjective]-[POL.GetOldAdjective]. Всенародный референдум подавляющим большинством одобрил это."
  BA_news.98.a:0 "Возникает новая сила."

  BA_news.99.t:0 "Демократия Сёва"
  BA_news.99.desc:0 "Комиссия по освобождению Японии и император Хирохито провозгласили конец гражданской войны, обнародовали демократическую конституцию и сократили императорские полномочия, переименовав страну в 'Японию'. Хирохито публично появился, чтобы утешить граждан, и дипломатический мир наблюдает за влиянием на Азию."
  BA_news.99.a:0 "Да здравствует император и демократия!"
  BA_news.99.b:0 "Будем надеяться на сотрудничество."
  BA_news.99.c:0 "Конституционная монархия?"

  BA_news.100.t:0 "Великий голод в Бенгалии"
  BA_news.100.desc:0 "Кабинет Черчилля приказал провести месячную морскую блокаду Индии для победы в войне, что вызвало гуманитарную катастрофу в Бенгалии. Миллионы умерли от голода, и международное сообщество решительно осуждает это военное преступление."
  BA_news.100.a:0 "Будь он проклят."
  BA_news.100.b:0 "Они перешли все границы."
  BA_news.100.c:0 "Их надо изгнать из Индии."

  BA_news.101.t:0 "Наступление Второй Великой Депрессии"
  BA_news.101.desc:0 "С крахом экономики США Нью-Йоркская фондовая биржа практически закрылась, и Уолл-стрит погрузилась в кризис. Это оказало катастрофическое влияние на всю Европу. Финансовые рынки в значительной степени зависят от инвестиций США, и страх перед банкротствами и финансовыми крахами распространился.\n\nБанки Канады, Италии, Испании и других стран закрылись, и тысячи граждан столкнулись с внезапной безработицей и бедностью. Эта катастрофа потрясает мировые экономические структуры и подпитывает страх перед новой Великой Депрессией."
  BA_news.101.a:0 "Все должны были это предвидеть."
  BA_news.101.b:0 "Мы хотели, чтобы они пали, но не так."
  BA_news.101.c:0 "Нужна новая политика."
  BA_news.101.d:0 "Мы виноваты?"
  BA_news.101.e:0 "Нашим банкам предстоят тяжелые месяцы."

  BA_news.102.t:0 "Коронация Эдуарда VIII"
  BA_news.102.desc:0 "Последний монарх, непосредственно правивший Великобританией и Ирландией, король Георг V, скончался незадолго до изгнания в Канаду. Его правление, как первого монарха из дома Виндзоров, запомнится поражением на Британских островах и потерей родины. Трон перешел к принцу Уэльскому Эдуарду, который теперь носит титул Эдуарда VIII.\n\nКороль Эдуард, движимый жаждой мести и великими амбициями, поддерживает напряженные отношения с канадским парламентом. Его обещание вернуть метрополию оправдало его популярность среди британских изгнанников в Канаде."
  BA_news.102.a:0 "Боже, храни короля!"

  BA_news.103.t:0 "Вина побежден!"
  BA_news.103.desc: "Грозный враг, известный как 'Вина', терзавший Египет, наконец-то побежден. Египет возвращает мир, и настроение населения поднимается. Хотя личность Вины остается загадкой, мир празднует эту победу и внимательно следит за следующими шагами Египта."
  BA_news.103.a: "Наконец-то!"
  BA_news.103.b: "Удивительно!"

  BA_news.104.t:0 "Провозглашение [From.GetNameDef]"
  BA_news.104.desc:0 "После панъевропейской декларации [From.GetOldAdjective] и нескольких 'войн за освобождение' идея панъевропейского государства под идеологией человеческого фашизма укоренилась по всей Европе. Это государство объявляет крестовый поход против стран Кивотоса и возвеличивает гордость итальянцев как центр Европы.\n\nЗемли, считающиеся 'освобожденными', уже начинают восстановление. С официальным провозглашением европейской интеграции страна будет переименована в [From.GetNameDef]."
  BA_news.104.a:0 "Единая Европа!"
  BA_news.104.b:0 "Осуществима ли эта огромная мечта?"
  BA_news.104.c:0 "Мы должны готовиться к войне."

  BA_news.105.t:0 "Массовый голод в Красной Зиме"
  BA_news.105.desc:0 "Руководство Красной Зимы не смогло организовать план снабжения для миллионов студентов, прибывших после Великой войны. Город заполнился трупами на холмах, а люди, оставшись без еды, прибегали даже к каннибализму. Те, кто еще сохраняет рассудок, бегут в другие страны, в то время как протесты за пайки и ответный огонь армии наполняют атмосферу постоянной стрельбой."
  BA_news.105.a:0 "Ужасная трагедия."

  BA_news.106.t:0 "Конец Черного Рынка"
  BA_news.106.desc:0 "Черный Рынок, самый страшный преступный анклав в Европе, возникший после Великой войны в Кивотосе, был искоренен военной операцией [FROM.FROM.GetName]. Эта группа торговала незаконным оружием, дестабилизирующим Кивотос и европейские страны. После этой победы Черный Рынок не сможет возродиться."
  BA_news.106.a:0 "Жаль."
  BA_news.106.b:0 "Худший преступный рынок закрыт."
  BA_news.106.c:0 "Деятельность мафиози прекратится."

  BA_news.107.t:0 "Появление Декаграмматонов"
  BA_news.107.d:0 "На поле боя появился новый тип живого оружия беспрецедентного характера: существа, известные как Декаграмматоны. Кажется, они воплощают чистую силу цвета."
  BA_news.107.a:0 "Наша идеальная эволюция."
  BA_news.107.b:0 "Ужасающая сущность."

  BA_news.108.t:0 "Жестокие репрессии в Бретани"
  BA_news.108.d:0 "После Великой войны регионы Бретани оказались под контролем преступных организаций, наследников Черного Рынка Кивотоса.\n\nНедавно они начали беспощадную войну против националистических бретонских групп за независимость, развязав жестокую кампанию репрессий."
  BA_news.108.a:0 "Страх — мощный инструмент господства."
  BA_news.108.b:0 "Воистину ужасающе."

  BA_news.109.t:0 "Отправка добровольцев из Миллениума"
  BA_news.109.d:0 "Подтверждено присутствие добровольцев из Миллениума в разгар Гражданской войны в Испании. Они заявляют, что прибыли 'добровольно' для 'решения кризиса с беженцами' и привлечения к ответственности воюющих сторон. Никто не знает, какое дипломатическое влияние окажет это вмешательство Кивотоса."
  BA_news.109.a:0 "Покажем силу нашей академии!"
  BA_news.109.b:0 "Нужно сдержать гегемонизм Миллениума."

  BA_news.110.t:0 "Полное вмешательство Миллениума"
  BA_news.110.d:0 "После нескольких подозрительных передвижений в Пиренеях, в ночи были запущены сигнальные ракеты, послужившие сигналом: армия Миллениума одновременно пересекла горный хребет. Это полное вмешательство в Гражданскую войну в Испании бросает вызов любой комиссии или альянсу и подверглось резкой критике. Миллениум квалифицирует это как 'специальную военную операцию', а не вторжение."
  BA_news.110.a:0 "'Специальная военная операция', не вторжение."
  BA_news.110.b:0 "Мы должны остановить эту необузданную гегемонию!"

  BA_news.111.t:0 "Лихорадка культуры другого мира в США!"
  BA_news.111.d:0 "В настоящее время США полностью покорились культуре другого измерения. Самым популярным является общенациональное упражнение Санкайкэй — 'Сильное упражнение'. Каждое утро вытягивание рук и ног стало повседневной сценой."
  BA_news.111.a:0 "Кисаки знает, что делает!"
  BA_news.111.b:0 "Запутанная ситуация."
  BA_news.111.c:0 "Они полностью чокнутые."

  BA_news.112.t:0 "Заявление США о гарантированной независимости Миллениума"
  BA_news.112.a:0 "Мудрое решение."
  BA_news.112.b:0 "Неужели они создадут научный клуб?"

  BA_news.113.t:0 "Заявление США о гарантированной независимости Эдемского договора"
  BA_news.113.a:0 "Мудрое решение."
  BA_news.113.b:0 "Очень своеобразный альянс."

  BA_news.114.t:0 "Заявление США о гарантированной независимости студенческого совета"
  BA_news.114.a:0 "Мудрое решение."
  BA_news.114.b:0 "Они нас предали!"

  BA_news.115.t:0 "США поддерживают Генну"
  BA_news.115.a:0 "Они умеют воевать."
  BA_news.115.b:0 "...Смогут ли они атаковать Статую Свободы?"
  BA_news.115.c:0 "Теракты в США умножатся."

  BA_news.116.t:0 "США поддерживают Тринити"
  BA_news.116.a:0 "Они будут ангельскими посланниками."
  BA_news.116.b:0 "Хорошо, что они на нашей стороне."
  BA_news.116.c:0 "Это катастрофа!"

  BA_news.117.t:0 "США поддерживают Красную Зиму"
  BA_news.117.a:0 "Надеюсь, это правильный путь..."
  BA_news.117.b:0 "Не ожидал, но добро пожаловать."
  BA_news.117.c:0 "Удивительное заявление."

  BA_news.118.t:0 "Провозглашение законного правительства [WCH.Getleader]"
  BA_news.118.d:0 "Сегодня утром режим Ван Цзинвэя объявил об официальном окончании Второй японо-китайской войны и провозгласил себя законным правительством Китая. В Нанкине они подписали мирное соглашение с Японией, ознаменовав начало нового порядка в Азии.\n\nХотя война закончилась, напряженность в Восточной Азии остается высокой. Легитимность Ван Цзинвэя и внутренние реакции будут ключевыми вызовами для стабильности."
  BA_news.118.a:0 "Первый шаг к освобождению Азии!"
  BA_news.118.b:0 "Тревожная новость..."

  BA_news.119.t: "[FRA.getname] выходит из Индокитая"
  BA_news.119.d: "Французские власти признали, что больше не могут поддерживать свое господство в Индокитае. После переговоров с Хо Ши Мином колониальное правительство вернуло свои активы и вышло, наконец предоставив региону независимость."
  BA_news.119.a: "Лучший из вариантов."
  BA_news.119.b: "Французский колониализм исчезает."
  BA_news.119.c: "Победа антиколониальной борьбы!"

  BA_news.120.t:0 "[USA.getname] присоединяется к Коммунистическому Интернационалу"
  BA_news.120.d:0 "Сегодня мир получил удивительную новость: Соединенные Штаты, управляемые Лейбористской партией, вступили в Коммунистический Интернационал. Это решение поражает всех, независимо от идеологии, нации или вида."
  BA_news.120.a:0 "Нет вечных врагов."
  BA_news.120.b:0 "Добро пожаловать, товарищ!"
  BA_news.120.c:0 "Что происходит?"

  BA_news.121.t: "[USA.getname] объявляет коммунистическую партию"
  BA_news.121.d: "В Вашингтоне был объявлен радикальный дипломатический поворот: США резко раскритиковали СССР как 'олигархический авторитарный режим' и в то же время провозгласили себя истинным маяком прогресса и социализма. Москва не отреагировала, но столкновение кажется неизбежным."
  BA_news.121.a: "Пролетарии всех стран, соединяйтесь!"
  BA_news.121.b: "Какая самонадеянность."
  BA_news.121.c: "Родилась еще одна красная чума."

  BA_news.125.t: "Троцкий сопротивляется"
  BA_news.125.d: "После изгнания в Норвегию Троцкий сблизился с центром [RED.getname] и пережил несколько покушений, укрывшись благодаря защите службы охраны.\n\n«Я не боюсь смерти. Революция продолжается силой идеологии, а не отдельных лиц; преследование Сталина лишь доказывает его страх перед справедливостью», — заявил Троцкий. Вскоре десятки людей, предположительно связанных с СССР, были арестованы, показывая, что Троцкий теперь практически вне советской опасности."
  BA_news.125.a: "Антисталинизм остается твердым!"
  BA_news.125.b: "Контрреволюционеры разгуливают на свободе."
  BA_news.125.c: "Коммунистам нравится разделяться?"

  BA_news.126.t:0 "'Прискорбные беспорядки'"
  BA_news.126.d:0 "Студенческий совет в смятении. После исчезновения президента закрытие академии SRT вызвало сопротивление подразделений FOX и RABBIT, которые сначала заняли главное здание, а затем парк Косаги. Полиция мобилизовала силы, но не смогла искоренить эти силы спецназа, поддерживаемые анонимными поставками.\n\nИсполнительный комитет объявил о 'жестком ответе' и созвал экстренное заседание."
  BA_news.126.a:0 "Надо было закрыть академию раньше!"
  BA_news.126.b:0 "И все же они защищают свою школу..."

  BA_news.127.t:0 "'Призрачные сигналы в Кивотосе'"
  BA_news.127.d:0 "По всему Кивотосу улавливаются слабые сигналы, которые, кажется, исходят с севера Британских островов. После их обнаружения автоматы и роботы безопасности демонстрируют аномальное поведение, и целые роботизированные подразделения внезапно исчезли в нескольких регионах.\n\nНаучная Школа Миллениума сообщает, что группа роботов пыталась захватить судно в Дуврском проливе, а затем была обездвижена, не раскрыв информации. Перед отключением их голоса прошептали: 'Он придет' и 'Дженико приближается', словно одержимые присутствием."
  BA_news.127.a:0 "Наша очередь..."
  BA_news.127.b:0 "Что с ними случилось?"

  BA_news.128.t: "Крах Менджи Може"
  BA_news.128.d: "Несмотря на яростное сопротивление, неудержимое продвижение [SOV.getname] унизило Польшу и ее союзников. Только Польша готовится к последней обороне, в то время как остальные ищут индивидуальные соглашения с СССР."
  BA_news.128.a: "Они были горсткой некомпетентных."

  BA_news.129.t:0 "Процедура закрытия SRT"
  BA_news.129.d:0 "Сегодня началось закрытие специальной академии SRT, обвиняемой в резне дома Оранских-Нассау после Великой войны. Большинство ее учеников было поглощено Валькирией, но подразделения FOX и RABBIT восстали, были быстро разбиты и заключены в тюрьму. Дальнейшие детали неизвестны."
  BA_news.129.a:0 "Окончательная судьба Лисы и Кролика."

  BA_news.130.t:0 "'Радио-хаос в Кивотосе'"
  BA_news.130.d:0 "Рано утром произошли массовые помехи в передачах из-за призрачного сигнала. Автоматы и роботы были взломаны, и самопровозглашенный Декаграмматон объявил 'Последнее Сообщение': война между расами закончится только с уничтожением одной из них, и предлагает распустить все армии и принять это.\n\nПосле его заявления роботы и автоматы усилили протесты, и в нескольких кампусах произошли теракты. Эксперты полагают, что это атака, планировавшаяся долгое время."
  BA_news.130.a:0 "Час настал..."
  BA_news.130.b:0 "Приближается нечто большее."

  BA_news.131.t:0 "Скандал с S.C.H.A.L.E"
  BA_news.131.d:0 "Федеральный исследовательский клуб S.C.H.A.L.E, созданный по прямому приказу президента, потребовал слияния со студенческим советом, ссылаясь на легитимность. Кабинет [COU.Getleader] и исполнительный комитет классифицировали это как 'механическую ошибку' и отклонили слияние. S.C.H.A.L.E ответил вручением объявления войны, вызвав скандал."
  BA_news.131.a:0 "Это неправильно!"
  BA_news.131.b:0 "Механическая ошибка? Смешно."

  BA_news.132.t:0 "Импичмент временной Рин"
  BA_news.132.d:0 "Политический переполох потряс студенческий совет. После борьбы за власть была одобрена резолюция о недоверии Рин, главе кабинета, которая теперь находится под домашним арестом. Кая Ширануи, глава обороны и новый временный президент, пообещала восстановить стабильность и искоренить внешние угрозы. Однако ее назначение до сих пор не признано другими академиями."
  BA_news.132.a:0 "Выпьем за временную Каю!"
  BA_news.132.b:0 "Темная волна."

  BA_news.133.t:0 "Кая Ширануи назначена президентом"
  BA_news.133.d:0 "Как и ожидали эксперты, Кая Ширануи, глава обороны, была единогласно избрана президентом студенческого совета. Отвергая наследие своей предшественницы, она вернула контроль над Башней Санктум благодаря Ящику Ситтим, хотя и не добилась полного признания. После вступления в должность она запросила визит в Красную Зиму; во въезде было отказано, что свидетельствует о нестабильности ее положения.\n\nКая Ширануи выразила 'глубокое сожаление' в отношении Красной Зимы и снова запросила въезд, но ответа не последовало."
  BA_news.133.a:0 "Аплодисменты президенту Кае!"
  BA_news.133.b:0 "Это будет неопределенное правление."

  BA_news.134.t:0 "Борьба необладания!"
  BA_news.134.d:0 "Возле Башни Санктум возникло новое движение: 'Со.Хва.Хэн.', возглавляемое Декартом, отвергает навязанное социальное перевоспитание и продвигает борьбу необладания. При поддержке голландских и фламандских рабочих они бросают вызов контролю Валькирии и продвигают необладание на пан-Кивотос-Европейском уровне.\n\nОднако скандалы о личной жизни Декарта в интернете подорвали популярность движения."
  BA_news.134.a:0 "Говорит разумно!"
  BA_news.134.b:0 "Интересно."

  BA_news.135.t:0 "Конец идеологической войны"
  BA_news.135.d:0 "На бескрайней русской степи стихли выстрелы. Завеса поля боя поднялась, открыв, что [RED.getname] контролирует весь [SOV.GetAdjective]. Многие сталинисты бегут в изгнание. Несомненно, эпоха Сталина закончилась."
  BA_news.135.a:0 "Темная эра коммунизма."
  BA_news.135.b:0 "Истинная историческая победа."
  BA_news.135.c:0 "Две ветви коммунизма воссоединились."

  BA_news.136.t:0 "Запуск I-Phone"
  BA_news.136.d:0 ""... и сегодня мы с гордостью представляем I-Phone, прогресс человечества."\n\nPhillips удивил Кивотос, представив это чудо. Говорили, что технологии Кивотоса недосягаемы, но поддержка студенческого совета способствовала этому огромному прорыву. Хотя он уступает местной модели, его цена и производительность завоевали людей.\n\nПравительства по всему миру спешат с внедрением, и Phillips расширяет проекты сетей связи и энергетики."
  BA_news.136.a:0 "Это действительно впечатляет."

  BA_news.137.t:0 "Коронация королевы Каи Ширануи"
  BA_news.137.d:0 "Для голландцев наступила тьма. После убийства королевы Вильгельмины SRT королевство осталось без монарха. Сегодня на пышной церемонии — с речами Альфреда Хитона и Леона Дегреля — Кая Ширануи взошла на трон. Были приглашены Леопольд III и [HEU.GetLeader], но они не присутствовали."
  BA_news.137.a:0 "Нидерланды не умирают ради зрелища!"
  BA_news.137.b:0 "Протокол королевы кажется натянутым."
  BA_news.137.c:0 "Две смерти Голландии в одной!"

  BA_news.138.t:0 "Венский договор"
  BA_news.138.d:0 "Всеобщая забастовка в Сирии, начавшаяся в декабре, превратилась в антиколониальное движение по всему французскому Ближнему Востоку. Хотя холодный парламент отверг диалоги, Петен подписал соглашение, чтобы сосредоточиться на метрополии. Сирия и Ливан освобождаются от французского господства, и войска выйдут в течение двух месяцев."
  BA_news.138.a:0 "Колониализм агонизирует."

  BA_news.139.t:0 "Формирование Фронта Освобождения Роботов Кивотоса"
  BA_news.139.d:0 "В Кивотосе организована повстанческая армия роботов, сеющая хаос в нескольких регионах."
  BA_news.139.a:0 "Это катастрофа."

  BA_news.140.t:0 "Утверждение Стрезского фронта"
  BA_news.140.desc:0 "Перед лицом день ото дня усиливающейся угрозы из других миров сторона [ENG.GetAdjective] официально объявила о повторном разрешении 'Стрезского фронта', способного играть роль общего антикивотосского фронта.\n\nВ этом процессе правительство [ENG.GetAdjective] вновь созывает бывшие страны-подписанты договора, демонстрируя намерение вновь возродить Стрезский фронт, ставший простой формальностью.\n\nОднако непрерывность Стрезского фронта не гарантирована. Если хотя бы одна из стран-подписантов откажется от официального утверждения или отзовет свое сотрудничество, этот фронт снова столкнется с опасностью распада."
  BA_news.140.a:0 "Это удивительное развитие!"
  BA_news.140.b:0 "Это, как бы то ни было, звучит не очень..."
  BA_news.140.c:0 "Это первый шаг к восстановлению национальной территории!"
  BA_news.140.d:0 "Может быть, мы получим надежного союзника?"
  BA_news.140.e:0 "Нужно пересмотреть."

  BA_news.141.t:0 "Странные слухи с Британских островов"
  BA_news.141.desc:0 "Циркулируют тревожные слухи от антиправительственных сил, утверждающих, что им удалось бежать с Британских островов. Согласно содержанию слуха, после ареста сил, противостоящих ИИ, который в настоящее время управляет островами, они хранят в виртуальном мире ментальные данные, извлеченные из мозга; утверждается, что некоторые личности подвергаются 'постоянной изоляции', а другие используются для извлечения информации.\n\nУтверждается, что этот виртуальный мир реконструирует и показывает момент, когда пользователь был наиболее счастлив, на основе воспоминаний, извлеченных из мозга, и что в комфорте виртуального мира постепенно промывали мозги.\n\nВ связи с этим этические организации академий потребовали 'Декларацию цифровых прав без границ' и призвали провести расследование на уровне академий и Генерального студенческого совета."
  BA_news.141.a:0 "Это была необходимая мера"
  BA_news.141.b:0 "Если это правда... это действительно ужасно"

  BA_news.142.t:0 "Волна одновременных терактов по всему Кивотосу!"
  BA_news.142.desc:0 "По всему Кивотосу произошли одновременные и организованные теракты, направленные против административных органов и военных цепочек командования. В Миллениуме произошли взрывы и перестрелки возле кампуса, и сообщалось о подобных атаках в Тринити, Генне и Шанхайцзине.\n\nПредполагается, что в этих терактах использовались специальные бомбы, способные уничтожать ореолы. Число подтвержденных гражданских жертв только в каждой академии достигает нескольких тысяч, и, поскольку значительная часть находится в тяжелом состоянии, ожидается, что число погибших также резко возрастет. Каждая академия квалифицировала эту атаку как беспрецедентную организованную атаку и объявила о масштабном расследовании.\n\nЭксперты считают, что эти одновременные организованные теракты — дело рук недавно сформированного 'Фронта Освобождения', и судят, что попытка нейтрализовать военные цепочки командования означает неизбежность вторжения, поэтому немедленно было объявлено чрезвычайное положение."
  BA_news.142.a:0 "Это только начало."
  BA_news.142.b:0 "Пошли C&C"
  BA_news.142.c:0 "Миллениумская столица, Эдем, не падет от такого."
  BA_news.142.d:0 "Ибуки... Ибуки в безопасности?"
  BA_news.142.e:0 "Соберите членов Дисциплинарного Комитета!"
  BA_news.142.f:0 "Надвигается снежная буря..."
  BA_news.142.g:0 "В этом нет ничего крутого..."
  BA_news.142.h:0 "Терроризм ни при каких обстоятельствах не может быть терпим."

  BA_news.143.t:0 "Декларация механической поддержки восстановления"
  BA_news.143.desc:0 "ИИ, недавно изгнавший Гематрию и взявший власть на севере Британских островов, отправил официальную телеграмму всем академиям Кивотоса. Этот ИИ выразил глубокую озабоченность разрушением инфраструктуры после Великого Перехода и крайним хаосом, проистекающим из этого, и заявил о намерении отправить подразделения поддержки восстановления, состоящие из автоматизированной техники и автоматов, предлагая гуманитарную помощь.\n\nОжидается, что передовая технология автоматизации и высокая производственная способность этих подразделений поддержки станут мощным средством быстрого преодоления кризиса, с которым в настоящее время сталкиваются Академические Государства, особенно выделяясь в строительстве, производстве припасов и восстановлении инфраструктуры.\n\nОднако некоторые сектора предупреждают, что 'экстремальная ориентированная на мир идеология', которую защищает этот ИИ, может стать семенем нового конфликта."
  BA_news.143.a:0 "..."
  BA_news.143.b:0 "Машины нас поддерживают?"

  BA_news.144.t:0 "Воссоединение Генны [GEM.GetName]"
  BA_news.144.desc:0 "Генна, которая была разделена, сегодня вновь объединена под началом [GEM.GetLeader]. До сих пор Генна была раздроблена на две военные силы: Общество Пандемониума и Дисциплинарный Комитет, но разделению Генны пришел конец благодаря руководству [GEM.GetLeader]. Однако семена раздора все еще остаются. Бывшие члены Дисциплинарного Комитета не присягают на верность новому правительству, и ожидается, что восстановление разрушенной войной национальной мощи займет время.\n\nТем не менее, воссоединение Генны [GEM.GetName], несомненно, является историческим событием, и после восстановления руин Генна снова может возвыситься как мощная академия."
  BA_news.144.a:0 "За славу!"
  BA_news.144.b:0 "Генна снова едина"
  BA_news.144.c:0 "Ситуация в Кивотосе резко меняется"

  BA_news.145.t:0 "Вторжение в Миллениум!"
  BA_news.145.desc:0 "Сегодня утром началось полномасштабное вторжение механических сил на севере Миллениума. Миллениум, кажется, выигрывает у 'Освободительной Армии', но, по данным Разведывательного Управления, подтверждено, что многочисленные транспортные корабли перемещаются через Дуврский пролив для поддержки Освободительной Армии. Уже сообщается, что в некоторых районах фронта были замечены огромные орудия, известные как 'Пророки', поэтому ожидается, что ситуация для Миллениума ухудшится.\n\nСеминар немедленно провозгласил борьбу до конца, и Миллениум установил оборонительную линию, сосредоточенную на Эриду, но перед лицом растущего механического наступления кажется, что Миллениуму будет трудно остановить его в одиночку."
  BA_news.145.a:0 "За светлое будущее"
  BA_news.145.b:0 "Защищайте Эриду любой ценой!"
  BA_news.145.c:0 "Начало еще одной резни"

  BA_news.146.t:0 "Ибуки"
  BA_news.146.desc:0 "Прошло две недели с тех пор, как по всему Кивотосу с помощью дронов были совершены неизбирательные теракты, и до сих пор не подтверждено, жива ли или мертва Танга Ибуки, талисман Общества Пандемониума, что заставило многих людей выражать обеспокоенность. Некоторые даже выдвинули возможность того, что Ибуки уже стала жертвой той атаки дронов две недели назад.\n\nВ связи с этим сегодня Общество Пандемониума официально объявило в своем коммюнике, что Танга Ибуки трагически погибла в результате неизбирательной и бесчеловечной атаки, совершенной силами Декаграмматона. Общество Пандемониума также решительно осудило силы Декаграмматона, ответственные за атаку, и провозгласило: 'Будет твердое возмездие и всестороннее наказание экстремистских механических сил, жестоко отнявших детскую жизнь'."
  BA_news.146.a:0 "Другого выбора не было..."
  BA_news.146.b:0 "Ибуки..."
  BA_news.146.c:0 "Такая юная жизнь была принесена в жертву"

  BA_news.147.t:0 "Какое влияние оказал Мистицизм на человечество?"
  BA_news.147.desc:0 "После Великого Перехода существовали догадки, что небольшие количества мистицизма, рассеянные по всему миру, могли каким-то образом повлиять на человечество. Статья, опубликованная анонимной силой, повысила вероятность того, что это правда.\n\nСогласно этой статье, подтверждено, что те, кто был глубоко подвержен влиянию мистицизма, чрезвычайно преуспевают в общении с другими и в сопереживании и разделении эмоций. Даже без языка или визуальной информации было подтверждено, что они могут воспринимать эмоциональное состояние или намерения другого и сопереживать, делая возможным глубокое взаимопонимание.\n\nОднако анонимная сила выразила негативный взгляд на будущее в рекомендациях статьи, утверждая: 'Эта способность понимать ближнего используется только на войне. Возможно, это печальная мутация, рожденная конфликтом. Крах цивилизации может наступить раньше, чем время, необходимое для взаимопонимания'."
  BA_news.147.a:0 "Наши результаты исследований оправдывают наши действия"
  BA_news.147.b:0 "Бедные люди..."
  BA_news.147.c:0 "Если бы мы могли общаться без недопонимания... мог бы наступить мир?"

  BA_news.148.t:0 "Серебряный Жнец Исландии"
  BA_news.148.desc:0 "Совместные силы элиты нескольких наций, посланные для поиска выживших в Исландии, полностью исчезли. На месте остались только следы жестокого боя, и единственной найденной зацепкой была одна девушка, известная как 'Серебряный Жнец'. Наряду с этой шокирующей трагедией, предзнаменования 'Цвета', угрожающего поглотить мир, наблюдались одновременно в различных регионах, погружая мир в колоссальный хаос."
  BA_news.148.a:0 "Мне их жаль"
  BA_news.148.b:0 "Эта девушка — студентка Абидоса?"
  BA_news.148.c:0 "Проклятое чудовище... нужно будет как следует подготовиться"

  BA_news.149.t:0 "Начало Мирной Операции в Бретани"
  BA_news.149.desc:0 "После Великого Перехода Бретань стала зоной беззакония, где преступные организации практически взяли под контроль всю администрацию. Академии рассматривали возможность вмешательства в Бретань в прошлом, но исчезновение президента Генерального Студенческого Совета и рост напряженности войны в Кивотосе привели к тому, что вопрос был забыт.\n\nОднако сегодня сообщается, что механические силы начали полицейскую и военную операцию по восстановлению порядка в Бретани. Было объявлено, что эта операция направлена на стабильность и защиту граждан Бретани, а также на строгое преследование преступных групп.\n\nБольшинство Академических Государств избегают комментариев по этому поводу, и некоторые ставят под сомнение, действительно ли механическая сила, фанатично одержимая миром, остановится на Мирной Операции в Бретани. Существует мнение, что само это вторжение интерпретируется как послание, направленное всему Кивотосу."
  BA_news.149.a:0 "Ради мира"
  BA_news.149.b:0 "Это тревожно"
  BA_news.149.c:0 "Одной зоной беззакония меньше"

  BA_news.150.t:0 "Война Конца"
  BA_news.150.desc:0 "Механическая сила 'Декаграмматон' начала полномасштабное военное наступление против остаточных сил Кивотоса, мобилизовав все свои механические легионы. Одновременные атаки на всех фронтах включают крупные бронетанковые подразделения и воздушные эскадрильи, предназначенные для господства в небе, и сообщается, что множество особых сущностей, называемых 'Пророками', прорывают оборонительные линии на передовой. Эта атака анализируется как систематическое вторжение, целью которого является покорение всех живых организмов, выходящее за рамки простого локального конфликта.\n\nЛидеры основных академий официально определили этот конфликт как 'Войну Конца', в которой на карту поставлено выживание цивилизации, и немедленно объявили всеобщую мобилизацию. Представитель Генны заявил: 'Это не война для переговоров, а война на истребление', и добавил: 'Это будет последнее сопротивление всего разумного'."
  BA_news.150.a:0 "Ради мира"
  BA_news.150.b:0 "Сражайтесь до конца"
  BA_news.151.t:0 "Конец Шале"
  BA_news.151.desc:0 "Ранним утром все коммуникации автономного округа 'Шале (SCHALE)', считавшегося надеждой для Кивотоса даже после исчезновения Генерального Студенческого Совета, полностью прервались. По данным источников, которым удалось приблизиться к месту, Шале было полностью занято механическими легионами Декаграмматона, и было подтверждено отсутствие внутреннего сопротивления.\n\nСамая трагическая новость заключается в том, что 'Ящик Ситтим', центральная система Шале, наконец замолчал. Сигнал управляющего ИИ 'Арона' полностью исчез, и предполагается, что в настоящее время система находится под контролем Декаграмматона.\n\nВ то же время наблюдались тревожные изменения в Башне Санктум, символе Кивотоса. Ночью башня была покрыта неизвестными металлами и золотистым сиянием, превратившись в гигантскую механическую иглу, чью первоначальную форму уже невозможно узнать."
  BA_news.151.a:0 "Мы будем двигаться вперед"
  BA_news.151.b:0 "..."

  BA_news.153.t:0 "Вторая Гражданская война в США"
  BA_news.153.desc:0 "Последнее наследие Великого Перехода наконец достигло Соединенных Штатов. Вторая Великая Депрессия и проистекающие из нее политические и социальные конфликты менее чем за сто лет стали спусковым крючком для того, чтобы север и юг США противостояли друг другу. Правительство президента [CSA.GetLeader] Конфедеративных Штатов Америки и их делегация подражали речи Джефферсона Дэвиса и официально объявили о своем выходе из Союза.\n\nФедеральное правительство объявило это изменой и немедленно инициировало процедуры реагирования, в то время как штаты Ржавого пояса, испуганные второй гражданской войной, выдвинули генерала Омара Брэдли командующим и, по-видимому, сформировали добровольную нейтральную зону."
  BA_news.153.a:0 "Повесить предателей!"
  BA_news.153.b:0 "Дом разделен."

  BA_news.154.t:0 "Балканские переговоры, сведенные к формальности"
  BA_news.154.d:0 "С целью построения общего фронта против экспансионистских планов Болгарии 'Балканский пакт', подписанный в Афинах в 1934 году [GRE.getadjective], [ROM.getadjective], [TUR.getadjective] и [YUG.getadjective], был направлен на сохранение геополитического статус-кво в регионе после окончания Великой войны. Однако после Великого Перехода, с изменением геополитической структуры, стороны, участвующие в балканских переговорах, предпочли решать свои проблемы самостоятельно. Страны-подписанты больше не будут гарантировать взаимную независимость, и это приведет к усилению влияния [ITA.GetAdjective] на Балканах."
  BA_news.154.a:0 "Запал пороховой бочки зажжен."

  BA_news.155.t:0 "Советская декларация об освобождении Европы"
  BA_news.155.desc:0 "В ознаменование победы, которую [SOV.GetAdjective] недавно одержал над Академическими Государствами Кивотоса, с утра проводится огромный военный парад в [SOV.GetCapitalVictoryPointName]. Лидер [SOV.GetLeader] [SOV.GetAdjective] произнес речь, празднуя великую победу. В своей речи [SOV.GetLeader] заявил: 'Мы одержали беспрецедентную победу. Источник этого великого триумфа кроется в единстве нации [SOV.GetAdjective], в огромной силе армии, в мужестве и трудоспособности народа [SOV.GetAdjective]'."
  BA_news.155.a:0 "Вечная слава героям, сражавшимся за родину!"
  BA_news.155.b:0 "Освободители Европы или новые властители?"

  BA_news.156.t:0 "Резолюция Ле Бефа [Getyear] года"
  BA_news.156.desc:0 "Послы стран-членов [POL.getfactionname] встретились в Ле Бефе с лидерами [RSA.getname]. Признавая, что для прекращения режима [SOV.getname] необходима деятельность [RSA.getname] и поддержка ее, они постановили консолидировать альянс, ориентированный на достижение своих целей, установив с [RSA.getname] систему тесного военного сотрудничества с [POL.getfactionname]."
  BA_news.156.a: "К концу режима [SOV.getname]!"
  BA_news.156.b: "Предатели!"
  BA_news.156.c: "Хитрецы."

  BA_news.157.t:0 "Крах [GEM.GetName]"
  BA_news.157.desc.makoto:0 "С захватом здания парламента Общества Пандемониума атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, Ханума Макото, харизма Общества Пандемониума и его лидер со времен Великого Перехода, не имела иного выбора, кроме как признать полное поражение стороны [GEM.GetName].\n\nВместо того чтобы бежать, Макото покорно сдалась армии [ROOT.GetAdjective], но пока она лично связывалась с победоносной армией для официальной капитуляции, ее приближенные и личная охрана выиграли время, чтобы иметь возможность эмигрировать за границу. Даже сторона [ROOT.GetLeader] была очень удивлена благородством, большим, чем ожидалось, которое продемонстрировала Макото."
  BA_news.157.desc.ibuki:0 "С захватом здания парламента Общества Пандемониума атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, Танга Ибуки, символ Общества Пандемониума и благородная дама Генны, не имела иного выбора, кроме как признать полное поражение стороны [GEM.GetName].\n\nНепосредственно перед поражением Ибуки лично оставила благодарственное послание товарищам из Общества Пандемониума, которых она больше всего ценила, и сдалась стороне [ROOT.GetAdjective]. Капитуляция [ROOT.GetName], кажется, означает конец истории Общества Пандемониума."
  BA_news.157.desc.satsuki:0 "С захватом здания парламента Общества Пандемониума атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что ни NK Ultra, ни любая другая научная технология не могут изменить поражение Общества Пандемониума.\n\nНепосредственно перед поражением Сацуки лично оставила благодарственное послание товарищам из Общества Пандемониума, которых она больше всего ценила, и сдалась стороне [ROOT.GetAdjective]. Капитуляция [ROOT.GetName], кажется, означает конец истории Общества Пандемониума."
  BA_news.157.desc.chiaki:0 "С захватом здания парламента Общества Пандемониума атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что даже перо Тиаки, самой способной журналистки Общества Пандемониума, не может изменить ход войны.\n\nНепосредственно перед поражением Тиаки лично оставила благодарственное послание товарищам из Общества Пандемониума, которых она больше всего ценила, и сдалась стороне [ROOT.GetAdjective]. Капитуляция [ROOT.GetName], кажется, означает конец истории Общества Пандемониума."
  BA_news.157.desc.iroha:0 "С захватом здания парламента Общества Пандемониума атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, даже Ироха, стратег Общества Пандемониума, больше не может говорить о 'победе Общества Пандемониума'.\n\nИроха, командуя последней дивизией, лично поднялась на Торамару и сражалась против армии [ROOT.GetAdjective], пока героически не попала в плен. Хотя она потерпела поражение, сопротивление Ирохи произвело большое впечатление на многих граждан."
  BA_news.157.desc.generic:0 "С захватом здания парламента центрального округа Генны атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что история Общества Пандемониума, наследника студенческого совета Генны, подошла к концу. Бюрократы уже составляют документы о капитуляции и вступают в запоздалые переговоры."
  BA_news.157.a:0 "Означает ли это конец [GEM.GetName]?" # страна Кивотоса
  BA_news.157.b:0 "Что-то огромное происходит в Кивотосе!" # страна не-Кивотоса

  BA_news.158.t:0 "Крах [GEH.GetName]"
  BA_news.158.desc.ako.generic:0 "С захватом штаб-квартиры Дисциплинарного Комитета атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что даже Сорасаки Хина, легендарный военный лидер Генны, больше не имеет сил изменить ход войны.\n\nИз-за эмоциональной нестабильности после Великого Перехода Хина, психологически зависевшая от Амау Ако, была так подавлена, что не могла даже составить декларацию о капитуляции или что-либо еще; не в силах даже переодеться из розовой пижамы, она села в машину Ако и бежала за границу."
  BA_news.158.desc.ako.nagisa:0 "С захватом штаб-квартиры Дисциплинарного Комитета атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что даже Сорасаки Хина, легендарный военный лидер Генны, больше не имеет сил изменить ход войны.\n\nИз-за эмоциональной нестабильности после Великого Перехода Хина, психологически зависевшая от Амау Ако, была так подавлена, что не могла даже составить декларацию о капитуляции или что-либо еще; и говорят, что до момента явки за стол капитуляции под гарантии безопасности Нагисы она все бросила и вела жизнь затворницы у себя дома."
  BA_news.158.desc.hina:0 "С захватом штаб-квартиры Дисциплинарного Комитета атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что даже Сорасаки Хина, легендарный военный лидер Генны, больше не имеет сил изменить ход войны.\n\nСорасаки Хина сражалась против армии [ROOT.GetAdjective] на последнем фронте и была героически захвачена в плен. Хотя она потерпела поражение, сопротивление Хины произвело большое впечатление на многих граждан."
  BA_news.158.desc.iori:0 "С захватом штаб-квартиры Дисциплинарного Комитета атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что даже Сорасаки Хина, легендарный военный лидер Генны, больше не имеет сил изменить ход войны.\n\nПередав все свои полномочия Широми Иори, Сорасаки Хина была захвачена, помогая беженцам бежать за границу в приграничной зоне. То, что Хина была захвачена, кажется, означает полный крах Дисциплинарного Комитета Генны."
  BA_news.158.desc.generic:0 "С захватом штаб-квартиры Дисциплинарного Комитета атакой стороны [ROOT.GetNameDef] и флагами [ROOT.GetAdjective], развевающимися над ключевыми городами, кажется, что история Дисциплинарного Комитета Генны сегодня подошла к концу. Бюрократы Планового Отдела передали документы о капитуляции оккупационным силам [ROOT.GetAdjective], и теперь влияние Комитета снизилось до уровня местных партизан."
  BA_news.158.a:0 "Означает ли это конец [GEH.GetName]?" # страна Кивотоса
  BA_news.158.b:0 "Что-то огромное происходит в Кивотосе!" # страна не-Кивотоса

  BA_news.159.t:0 "Крах [TRM.GetName]"
  BA_news.159.desc.generic:0 "В войне Генна-Тринити, кажется, [TRM.GetNameDef] уже вступил в свою финальную стадию.\n\nБольшая часть его территории уже поглощена войсками Генны, и остались только остаточные силы с подорванным моральным духом, преследуемые массовым дезертирством. Тем не менее, они продолжают сопротивляться, надеясь, что чудо спасет их, даже когда почти вся надежда угасла.\n\nФактически, некоторые лидеры [TRM.GetAdjective] уже встретились с генералами вражеских сил, чтобы обсудить условия неизбежной полной капитуляции."
  BA_news.159.a:0 "Означает ли это конец [TRM.GetName]?" # страна Кивотоса
  BA_news.159.b:0 "Что-то огромное происходит в Кивотосе!" # страна не-Кивотоса

  BA_news.160.t: "Гранадская декларация"
  BA_news.160.d: "[SPR.getname] и [FRA.getname] объединили усилия, чтобы преодолеть территориальные потери, вызванные Великим Переходом. Оба правительства осуждают [WHY.getname] и [MIL.getname], две оси большевизма из другого мира, и этот договор — предназначенный для взаимной поддержки во Втором Возвращении и в решающей битве за восстановление национальной территории, и для поддержания дипломатического и военного сотрудничества в будущем — был провозглашен в Гранаде, где [SPR.getadjective] завершил Реконкисту в своей прошлой истории, демонстрируя тем самым твердую волю в отношении своих целей."
  BA_news.160.a: "Да здравствует анти-Кивотосский блок!"
  BA_news.160.b: "Большевизм из другого мира?"

  BA_news.161.t: "Вступление Каи в должность временного президента"
  BA_news.161.d: "Борьба за власть вокруг временной должности Генерального Студенческого Совета, кажется, завершилась с концом временного правительства Рин. Как было объявлено на утренней пресс-конференции, вотум недоверия для приостановки полномочий временного правительства был без проблем одобрен при поддержке большинства высокопоставленных чиновников Генерального Студенческого Совета, и Нанагами Рин была отстранена.\n\nНемедленное голосование по выбору следующего временного президента единогласно завершилось избранием Ширануи Каи из Оборонного ведомства. Хотя Транспортное ведомство и Координационное ведомство не признают нового временного президента, кажется, что курс власти уже склонился в пользу Оборонного ведомства."
  BA_news.161.a: "Пожелаем удачи новому временному президенту."
  BA_news.161.b: "Это дурное предзнаменование."

  BA_nuke.0.t:0 "Арона под ядерной атакой"
  BA_nuke.0.d:0 "[SHE.GetName], центральный ИИ Ароны, подвергся прямому ядерному удару сегодня рано утром. Несмотря на наличие противовоздушной обороны, ядро ИИ было сильно повреждено. Хотя это кажется концом, несколько планов действий в чрезвычайных ситуациях позволят удивительно быстро восстановиться."
  BA_nuke.0.a:0 "[SHE.GetName] на грани краха?"
  BA_nuke.0.b:0 "Ах."

  fallnews.1.t:0 "Падение Эдема"
  fallnews.1.d:0 "Многовековая столица Тринити Эдем была взята силами Генны. На ее соборе теперь развевается знамя Генны, и древняя жемчужина Тринити перестала существовать."
  fallnews.1.a:0 "Эдем пал?"

  fallnews.2.d:0 "После массированного штурма советской армии Эдем, многовековая столица Тринити, был захвачен. Танковые дивизии вторглись в город, и собор теперь украшает красный флаг СССР.\n\nКрасный медведь поглотил Эдем."
  fallnews.2.b:0 "Пусть всегда горит искра революции!"

  fallnews.3.t:0 "Освобождение Парижа"
  fallnews.3.d:0 "Подтверждено освобождение Парижа от ига [MIL.GetNameDef]. Французская армия вошла в город, и парижане приветствуют своих освободителей. Руководство [MIL.GetNameDef] бежало, и Триколор развевается над Башней Миллениума."
  fallnews.3.a:0 "Vive la France!"

  fallnews.4.t:0 "Падение Хяккияко"
  fallnews.4.d:0 "Столица [HYA.GetNameDef], Хяккияко, была взята армией Санкайкэй. Ее сакуры и деревянные дома сгорели, и восстановление может занять столетия.\n\nС Хяккияко в руках врага будущее Хяккияко мрачно."
  fallnews.4.a:0 "День, когда пали цветы."

  fallnews.5.t:0 "Падение Центральной зоны Санкайкэй"
  fallnews.5.d:0 "Историческая столица Санкайкэй была захвачена прошлой ночью силами Хяккияко. Хотя бои еще идут в пригородах, древний мегаполис лежит в руинах, а его правительство бежало."
  fallnews.5.a:0 "Конец Центральной зоны Санкайкэй."

  fallnews.6.t:0 "Падение Варшавы"
  fallnews.6.d:0 "После тяжелых боев войска Тринити взяли Варшаву, столицу [POL.GetNameDef]. Местное ополчение оказывает лишь слабое сопротивление; город под контролем Тринити, и Польша получает сокрушительный удар.\n\nЭто начало восточной амбиции Тринити."
  fallnews.6.a:0 "У Польши не было шанса."
  fallnews.6.b:0 "Да здравствует Тринити!"

  fallnews.7.t:0 "Падение Центрального округа Генны"
  fallnews.7.d:0 "Центральный округ Генны был оккупирован Тринити после яростного штурма. Это продвижение дает большое стратегическое преимущество и запечатывает судьбу Генны."
  fallnews.7.a:0 "Конец Генны близок."
  fallnews.7.b:0 "Изгоним Генну!"

  fallnews.8.t:0 "Падение Южного округа Генны"
  fallnews.8.d:0 "Южный округ Генны также был взят Тринити, что укрепляет контроль над регионом Баварии и еще больше ослабляет Генну."

  fallnews.9.t:0 "Падение Ливерпуля"
  fallnews.9.d:0 "Ливерпуль, последний оплот британского сопротивления, был взят силами Kaiser PMC после захвата города. Несмотря на попытки взорвать мост Royal Albert Dock, оккупация была неизбежна. С падением Ливерпуля британское сопротивление практически прекращается."
  fallnews.10.d:0 "С последним оплотом в осаде Лондон остался свободным от боевых действий. Население вышло праздновать освобождение, и зазвонили колокола. Хотя некоторые районы все еще под контролем Kaiser PMC, искра восстания распространяется. Вернет ли наконец Великобритания свою свободу?"

  BA_Super_Event_asd:0 "Возвышение Мики"
  sp_event_asd_QUOTE:0 "У студентов есть свои причины; даже если мы не можем знать их истинные мысли, мы можем понять их и доверять им. Это то, что я как учитель и взрослый должен делать.\n…Мика не ведьма."
  sp_event_asd_QUOTE_NAME:0 "- Сенсей"
  sp_event_asd_REMARK:0 "Равновесие нарушено"

  sup_aby_cze_union:0 "Война Тринити-Советская"
  sup_aby_cze_union_QUOTE:0 "Наша цель справедлива,\nнаши враги падут,\nи победа будет за нами."
  sup_aby_cze_union_QUOTE_NAME:0 "- Юрий Левитан"
  sup_aby_cze_union_REMARK:0 "Окончательная война"

  sup_untiy_germay:0 "Обнародование Закона об Объединении"
  sup_untiy_germay_QUOTE:0 "Единое Тринити, вечное!"
  sup_untiy_germay_QUOTE_NAME:0 "- Мисоно Мика"
  sup_untiy_germay_REMARK:0 "Тринити не распадается."

  sup_invasion_another_dimension:0 "Хроматическое вторжение"
  sup_invasion_another_dimension_QUOTE:0 "Страх — это самое древнее и сильное чувство человека, а самое древнее и сильное чувство — страх перед неизвестным."
  sup_invasion_another_dimension_QUOTE_NAME:0 "- Г. Ф. Лавкрафт"
  sup_invasion_another_dimension_REMARK:0 "Это цвет космоса."

  sup_trinity_gehenna_war:0 "Война Генны-Тринити"
  sup_trinity_gehenna_war_QUOTE:0 "Если ты должен причинить вред кому-то, сделай это так основательно, чтобы он никогда не боялся твоей мести."
  sup_trinity_gehenna_war_QUOTE_NAME:0 "- Никколо Макиавелли"
  sup_trinity_gehenna_war_REMARK:0 "Конец давней вражды"

  sup_Kivotos:0 "Один Кивотос"
  sup_Kivotos_QUOTE:0 "Когда проблеск подсознания укажет тебе путь, отбрось сомнения и действуй немедленно. Ожидание ведет только к неудаче."
  sup_Kivotos_QUOTE_NAME:0 "- Неизвестный автор"
  sup_Kivotos_REMARK:0 "Да здравствует!"

  sup_france:0 "Возвращение Франции"
  sup_france_QUOTE:0 "Я был с вами в дни славы и в дни невзгод."
  sup_france_QUOTE_NAME:0 "- Филипп Петен"
  sup_france_REMARK:0 "Vive la France!"

  sup_france_com:0 "Социалисты возвращаются во Францию"
  sup_france_com_QUOTE:0 "Мир нам, война тиранам. Рабочие, бастуйте и сражайтесь, чтобы уничтожить классы!"
  sup_france_com_QUOTE_NAME:0 "- Интернационал"
  sup_france_com_REMARK:0 "За освобождение рабочих"

  sup_france_dem:0 "Демократы возвращаются во Францию"
  sup_france_dem_QUOTE:0 "Мораль заключается в мужестве принимать решения."
  sup_france_dem_QUOTE_NAME:0 "- Леон Блюм"
  sup_france_dem_REMARK:0 "Vive la République!"

  sup_france_fas:0 "Фашисты возвращают Францию"
  sup_france_fas_QUOTE:0 "Монархия требует одного мудреца; демократия — мудрого большинства."
  sup_france_fas_QUOTE_NAME:0 "- Шарль Моррас"
  sup_france_fas_REMARK:0 "Слава Франции!"

  sup_britain:0 "Соединенное Королевство возвращает Британию"
  sup_britain_QUOTE:0 "Мы не сдадимся. Мы будем сражаться на земле, на море и в воздухе с мужеством."
  sup_britain_QUOTE_NAME:0 "- Уинстон Черчилль"
  sup_britain_REMARK:0 "Правь, Британия!"

  sup_GER_mil:0 "Вермахт объединяет Германию"
  sup_GER_mil_QUOTE:0 "Атакуй, когда ситуация неясна."
  sup_GER_mil_QUOTE_NAME:0 "- Хайнц Гудериан"
  sup_GER_mil_REMARK:0 "Орел возрождается"
  BA_Munich:0 "Мюнхен"
  BA_Frankfurt:0 "Франкфурт"
  BA_Essen:0 "Эссен"
  BA_Hamburg: "Гамбург"

  sup_HUN_BALKAN:0 "Объединение Балкан"
  sup_HUN_BALKAN_QUOTE:0 "Услышьте клич последней битвы! Народ, под знамя освобождения, вперед!"
  sup_HUN_BALKAN_QUOTE_NAME:0 "- Интернационал"
  sup_HUN_BALKAN_REMARK:0 "Вперед, под знаменем!"

  sup_BA_superevent_Middle_Asia_war: "Война на Ближнем Востоке"
  sup_BA_superevent_Middle_Asia_war_QUOTE: "Зло, с которым мы так долго боролись, пало на нас."
  sup_BA_superevent_Middle_Asia_war_NAME: "- Георг VI"
  sup_BA_superevent_Middle_Asia_war_REMARK: "Что я могу сказать?"

  sup_mil_key: "Безымянная принцесса богов"
  sup_mil_key_QUOTE: "Я подтвердила, что атака прекратилась. Теперь мы исправим ошибку и приведу <принцессу> к трону, который ей принадлежит."
  sup_mil_key_QUOTE_NAME: "- Кей"
  sup_mil_key_REMARK: "Дверь открывается."

  sup_mil_atrahasis: "Ковчег Атрахасиса"
  sup_mil_atrahasis_QUOTE: "Принцесса получила ключ, и ковчег готов. По просьбе верховных жрецов мы построим новое святилище на этой земле."
  sup_mil_atrahasis_QUOTE_NAME: "- Кей"
  sup_mil_atrahasis_REMARK: "Новый ковчег."

  sup_China_Japan_War: "Японо-китайская война"
  sup_China_Japan_War_QUOTE: "Они — ножи и тарелки;\nмы — мясо и рыба."
  sup_China_Japan_War_QUOTE_NAME: "- Сунь Ятсен"
  sup_China_Japan_War_REMARK: "Война начинается."

  sup_launch_vehicle: "Спутник"
  sup_launch_vehicle_QUOTE: "Небо казалось таким странно чужим, что я никогда не думал, что другая нация превзойдет нас в технологиях."
  sup_launch_vehicle_QUOTE_NAME: "- Линдон Б. Джонсон"
  sup_launch_vehicle_REMARK: "Земля голубая."

  sup_teaparty_nuked: "Марш павших"
  sup_teaparty_nuked_QUOTE: "Я был солдатом, но никогда не питал симпатии к войне."
  sup_teaparty_nuked_QUOTE_NAME: "- Улисс С. Грант"
  sup_teaparty_nuked_REMARK: "Смерть приближается."

  sup_sov_pol_war: "Война на равнинах Восточной Европы"
  sup_sov_pol_war_QUOTE: "Вперед, на запад! За трупами в Польше лежит путь ко всему миру.\nМарш на Вильню, Минск, Варшаву!"
  sup_sov_pol_war_QUOTE_NAME: "- Михаил Тухачевский"
  sup_sov_pol_war_REMARK: "Фитиль уже полностью сгорел."

  sup_Soviet_Win: "День советской победы"
  sup_Soviet_Win_QUOTE: "Мне хотелось крикнуть тем, кто вечно спит в нашей земле: Товарищи, мы сделали это!"
  sup_Soviet_Win_QUOTE_NAME: "- Василий Гроссман"
  sup_Soviet_Win_REMARK: "Воля народа."

  sup_redwinter_civilwar: "Гражданская война в Красной Зиме"
  sup_redwinter_civilwar_QUOTE: "Мы твердо верим, что свобода без социализма — это привилегия и несправедливость, а социализм без свободы — это рабство и варварство."
  sup_redwinter_civilwar_QUOTE_NAME: "- Михаил Бакунин"
  sup_redwinter_civilwar_REMARK: "Права не существует без борьбы."

  sup_HYA_SHA_war: "Война НамКивотос"
  sup_HYA_SHA_war_QUOTE: "Ветер короля теряется в сорняках,\nи тигры с драконами пожирают друг друга в войне."
  sup_HYA_SHA_war_QUOTE_NAME: "- Ли Бо"
  sup_HYA_SHA_war_REMARK: "Война драконов и тигров"

  sup_united_nations: "Возрождение Лиги Наций"
  sup_united_nations_QUOTE: "Солнце увидит рассвет, реки достигнут моря,\nи новый день свободы настанет для всех."
  sup_united_nations_QUOTE_NAME: "- Из 'Лига идет вперед'"
  sup_united_nations_REMARK: "И Лига идет вперед."

  sup_68_revolutions: "Кульминация Революции 68"
  sup_68_revolutions_QUOTE: "Будем реалистами: потребуем невозможного."
  sup_68_revolutions_NAME: "- Лозунг мая 68-го"
  sup_68_revolutions_REMARK: "Запрещать запрещено."

  sup_com_aru_german_reunification: "Обнародование Закона об Объединении"
  sup_com_aru_german_reunification_QUOTE: "Операция еще не началась, а ты уже беспокоишься о возможной неудаче?"
  sup_com_aru_german_reunification_QUOTE_NAME: "- Рикухачима Ару"
  sup_com_aru_german_reunification_REMARK: "Значит, в конце концов это был успех?"

  sup_GEI_DEC: "Непредвиденные обстоятельства"
  sup_GEI_DEC_QUOTE: "Придите ко мне, все труждающиеся и обремененные, и Я успокою вас."
  sup_GEI_DEC_QUOTE_NAME: "Матфея 11:28"
  sup_GEI_DEC_REMARK: "Разве ложный рай — это рай?"

  sup_COU_KAYA_LETSGo: "Вступление в должность временного президента Каи"
  sup_COU_KAYA_LETSGo_QUOTE:0 "...такими методами шаткой демократии\nничего не решить.\nКивотос должен управляться сверхлюдьми."
  sup_COU_KAYA_LETSGo_QUOTE_NAME: "- Ширануи Кая"
  sup_COU_KAYA_LETSGo_REMARK: "Поднимая взгляд во тьме"

  sup_gehenna_reunification_benriya: "Воссоединение Генны"
  sup_gehenna_reunification_benriya_QUOTE: "Это нормально, потому что я ни к чему не привязана, и нет ничего, что могло бы ранить меня,\nно все равно быть одной — одиноко."
  sup_gehenna_reunification_benriya_QUOTE_NAME: "- Ониката Каёко"
  sup_gehenna_reunification_benriya_REMARK: "Вместе веселее"

  sup_gehenna_reunification_prefect_team: "Воссоединение Генны"
  sup_gehenna_reunification_prefect_team_QUOTE: "...Что бы ни случилось, то, что должен делать Дисциплинарный Комитет, не меняется.\nКак обычно."
  sup_gehenna_reunification_prefect_team_QUOTE_NAME: "- Сорасаки Хина"
  sup_gehenna_reunification_prefect_team_REMARK: "Ради порядка"

  sup_gehenna_reunification_pandemonium_society: "Воссоединение Генны"
  sup_gehenna_reunification_pandemonium_society_QUOTE: "Если мир станет мирным... болезненные вещи исчезнут.\nЕсли бы мы могли контролировать людей, разве не случилось бы так, что эти вещи не происходили бы?"
  sup_gehenna_reunification_pandemonium_society_QUOTE_NAME: "- Кёгоку Сацуки"
  sup_gehenna_reunification_pandemonium_society_REMARK: "Завоевание ради мира"

  ARI_all_blood.t:0 "'Вся кровь равна' – Речь"
  ARI_all_blood.desc:0 "Студенты! Поразмышляйте о нашем прошлом за гнетом Беатрис. Если бы у тогдашнего президента была истинно благородная кровь, страдали бы мы от ее тирании? Был ли хоть один благородный, восставший против Беатрис? Нет: они сотрудничали с ней и не проявили желания остановить хаос. Поэтому сегодня мы даруем всему студенчеству право благородной крови. Помните всегда: всякая кровь благородна."
  ARI_all_blood.a:0 "Это была великая речь."
  ARI_to_vitory_at_last.t:0 "'К окончательной победе' – Речь"
  ARI_to_vitory_at_last.desc:0 "Народ Ариуса! Прошли месяцы — даже годы — с тех пор, как мы прибыли на эту землю. Мы живем здесь, выучили их язык, их мышление и их идеологию. Мы приняли как миссию посвятить себя мировому пролетариату, но принять недостаточно: мы должны действовать. Весь народ, вся академия должна мобилизоваться для окончательной победы. Вперед, действуйте!"
  ARI_to_vitory_at_last.a:0 "Без дел вера мертва, как царство без народа."
  ARI_soviet_diplomacy.t:0 "Контакт с СССР"
  ARI_soviet_diplomacy.desc:0 "— Товарищ секретарь, у меня доклад. — Молотов? Что случилось? — Девушка, называющая себя послом 'Филиала Ариус', просит установить дипломатические отношения. — Филиал? Нет такого государства; должно быть, сумасшествие. — Однако ее нашли в открытом Балтийском море корабли федерации, без признаков кораблекрушения. Она утверждает, что доплыла сюда. — Балтийское море... интригующе. Займись этим. — Понял."
  ARI_soviet_diplomacy.a:0 "Так завершился контакт с СССР."

  KAP_event.1.t:0 "Провозглашение академического города Капила"
  KAP_event.1.desc:0 "Наконец-то закончилась долгая борьба. Враги были рассечены мечом Кохане, а полученных земель и ресурсов достаточно, чтобы восстановить академический город. Пришло время вернуться к повседневной жизни, по которой мы так скучали."
  KAP_event.1.a:0 "День чести перед учителем."
  KAP_event.1.b:0 "Мы должны следить за их действиями."
  KAP_event.1.d:0 "Мы должны следить за их действиями."

  KAP_event.2.t:0 "Третий Великий Переход"
  KAP_event.2.desc:0 "В поисках потерянной звезды.\nИстория тех, кто следует по следам и стремится восстановить.\nИстория тех, кто противостоит судьбе и завоевывает истинную свободу.\nИстория тех, кто преследует звезды.\n...\nПризрачная история сияющей звезды."
  KAP_event.2.a:0 "Мы должны найти звезду."
  KAP_event.2.b:0 "Великий Переход повторяется снова и снова?"
  KAP_event.2.d:0 "Великий Переход повторяется снова и снова?"