  ABY_rebuild_high_school_desc:0 "Старшая школа Абидос когда-то была могущественной академией, не имеющей себе равных, но после её падения ситуация свелась к тому, что её едва поддерживают всего пять человек.\nПостоянно страдая от нехватки персонала, после инцидента с Великим Смещением появились те, кто оказался здесь в ловушке и не смог вернуться в свою родную академию.\nЕсли мы используем этих людей, это станет большим подспорьем в восстановлении Старшей школы Абидос."
