  RED_redwinter_progress_tt: "§tКонференция Совместной Борьбы Академий§!\n\n§RБазовая фракция§! ([?RED_redwinter_progress_LEFT_value]%)\n- §RБазовая фракция§! — это фракция §Yнепримиримых работников§!, продвигающая свои цели главным образом через §Yборьбу§! и §Yзабастовки§!.\n\n§SЦентральная фракция§! ([?RED_redwinter_progress_CENTER_value]%)\n- §SЦентральная фракция§! — это фракция, ценящая §Yширокое сотрудничество§!, сочетающая §Yумеренную линию§! с §Yлинией борьбы§!.\n\n§pНародная фракция§! ([?RED_redwinter_progress_RIGHT_value]%)\n- §pНародная фракция§! — это фракция, действующая §Yчерез присоединение к массовым движениям§!, принимая в качестве основных руководств §Yумеренную пропаганду§! и §Yреформу§!.\n\nКак революционная студенческая организация, рожденная из слияния §Rреволюционного активизма§! Минори и §tнепримиримой революционной теории§! анархо-синдикализма, они унаследовали в неизменном виде §Yактивистскую революционную теорию§!, которую имел бывший Отдел Подрядчиков, и возглавляют антиправительственные протесты, движимые социалистами в странах по всему миру.\n\nВ настоящее время, после Великого Смещения, предсуществовавшие в Кивотосе §Yсоциальные противоречия§! обнажаются до предела. §tДзенкёто§! — это полуавтономная организация, состоящая из революционных студенток из каждой местной академии Кивотоса, действующих при поддержке §YЦентрального Комитета Красной Зимы§!.\n\nОни не только ведут §Yидеологическую учебную борьбу§! внутри академии, но и поддерживают в национальном масштабе §Yреволюционное социалистическое движение§! через §Yсеминары идеологических лекций§!, участие в §tрабоче-крестьянских собраниях§!, §tскоординированные академические бойкоты§!, §Rкрасный террор§! и §Rрасширение подпольных организаций§!, без прикрас обнажая перед массами уродство правящих классов и вытекающие из этого социальные противоречия во всех академиях Кивотоса."
  RED_redwinter_organizational_tt: "§tОрганизационная емкость Конференции Совместной Борьбы Академий§! (текущая: §Y[?RED_redwinter_organizational_value]§!)\n\n§YОрганизационная емкость§! определяет, сколько действий может предпринять §tКонференция Совместной Борьбы Академий§!. Используя §Yорганизационную емкость§!, вы можете проводить больше §Cреструктуризаций организации§! или организовывать большее количество §Cборьбы§!.\n\n§tОрганизационная емкость§! §Cвосполняется§! каждый месяц на §Y[?RED_redwinter_organizational_recovery_value]§! до максимума в §Y[?RED_redwinter_organizational_recovery_max_value]§!. Ежемесячное увеличение определяется §Yорганизационной линией§!, а максимум восстановления будет варьироваться в зависимости от §Yлояльности Конференции§! и различных решений.\n\n§YМаксимум восстановления§! §tорганизационной емкости§! в настоящее время будет §Rограничен§! §Yлояльностью Конференции§! до §Y[?RED_redwinter_organizational_recovery_max_value]§!. §YБазовый максимум восстановления§! составляет §Y[?RED_redwinter_organizational_max_value]§!."
  RED_redwinter_left_wing_tt: "§YФорма борьбы§!\n\n§YФорма борьбы§! направляет основную линию борьбы организации §tКонференция Совместной Борьбы Академий§!. В соответствии с §Yлинией борьбы§!, все §tКонференции§! будут действовать под §Yнашим§! командованием.[RED_redwinter_leftwing_tooltip]"
  RED_redwinter_right_wing_tt: "§YОрганизационная линия§!\n\n§YОрганизационная линия§! определяет, как структурируется организация §tКонференция Совместной Борьбы Академий§!. В соответствии с §YОрганизационной линией§!, организации §tКонференции§! в пределах §Yнашей§! сферы влияния будут структурированы таким образом.[RED_redwinter_rightwing_tooltip]"

