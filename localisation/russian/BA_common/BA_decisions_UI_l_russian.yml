  TRN_internal_factions_categories: "Чайная Вечеринка"
  TRN_internal_factions_categories_desc: "\n\n£GFX_decision_header_TRN_Teaparty\n\n\n\n\nЦепочка событий, произошедших после Великого Смещения, была более чем достаточна, чтобы поколебать до основания устои триумвирата Тринити. Каждая фракция перестала быть партнером по совместному управлению и превратилась в группу интересов, действующую в собственных интересах. Внутреннее доверие рухнуло, а подозрения и взаимное недоверие проявляются всё более открыто. Должны ли мы протянуть им руку и пойти на компромисс, или считать само их существование угрозой и устранить их? Фракции действуют по своей собственной логике и под своими предлогами, но в конечном итоге остается только борьба за власть и выживание.\n"
  TRM_ui_loyalty_header: "Лояльность"
  TRM_ui_popularity_header: "Влияние"

  TRM_popularity_TOOLTIP: "§YВлияние§! показывает, насколько фракция в данный момент влиятельна внутри академии.\nПо мере увеличения §YВлияния§!, влияние, которое фракция оказывает на академию, становится всё больше.\nПрежде чем распустить фракцию, необходимо свести её §YВлияние§! к 0 с помощью особых решений."
  TRM_LOYALTY_TOOLTIP: "§YЛояльность§! показывает степень готовности фракции сотрудничать с правительством академии.\nЧем выше §YЛояльность§!, тем больше положительных эффектов получит правительство академии от фракции. В противном случае она получит отрицательные эффекты.\nЕсли §YЛояльность§! упадет до §R-50§! или ниже, они могут начать масштабную борьбу против правительства академии."

