  RED_zenkyoutou_RIGHT_1_effect_tooltip: "Эффекты при смене текущей организационной линии на §YПодпольное тайное общество§!:\n Каждый месяц увеличивается влияние §RБазовой фракции§!\n Стоимость борьбы: §G-15%§!\n Увеличение влияния: §R-15%§!"
  RED_zenkyoutou_RIGHT_2_effect_tooltip: "Эффекты при смене текущей организационной линии на §YАвангард§!:\n Каждый месяц увеличивается влияние §SЦентральной фракции§!"
  RED_zenkyoutou_RIGHT_3_effect_tooltip: "Эффекты при смене текущей организационной линии на §YМассовую организацию§!:\n Каждый месяц увеличивается влияние §pНародной фракции§!\n Стоимость борьбы: §R-15%§!\n Увеличение влияния: §G+15%§!"

  RED_zenkyoutou_CENTER_1_effect_tooltip: "Эффекты при смене текущей лояльности организации на §YЛояльность Красной Зиме§!:\n Максимум восстановления организационной емкости Конференции: §R-50§!\n\nМодификаторы §YКонференции Совместной Борьбы Академий§!:\n Получение политической власти: §G+10%§!\n Скорость строительства: §G+10%§!\n Ежедневное получение покорности: §G+0.030%§!\n Скорость роста силы разведсети: §G+10.00%§!"
  RED_zenkyoutou_CENTER_2_effect_tooltip: "Эффекты при смене текущей лояльности организации на §YДело коммунизма§!:\n Максимум восстановления организационной емкости Конференции: §R-30§!\n\nМодификаторы §YКонференции Совместной Борьбы Академий§!:\n Скорость строительства: §G+5%§!\n Ежедневное получение покорности: §G+0.010%§!\n Скорость роста силы разведсети: §G+5.00%§!"
