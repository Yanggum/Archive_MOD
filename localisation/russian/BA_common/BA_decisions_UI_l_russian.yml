  ABY_descision_category_german_terrorist: "Нападения немецких террористов"
  ABY_descision_category_german_terrorist_desc: "В прошлый раз нам удалось одним ударом уничтожить руководящую верхушку австрийских национал-социалистов.\n\nОднако мы получили известия, что остатки всё ещё активны и совершают террористические акты тут и там. Хотя и не так, как раньше, но из-за того, что они, кажется, действуют организованно, если мы не сможем сдержать их до стабилизации правительства, может сложиться крайне опасная ситуация. По крайней мере, пока не завершатся переговоры, нам придется подавлять их деятельность.\n\n§RЕсли их контроль достигнет 100% до подписания соглашения, обратного пути не будет!§!"
  ABY_german_terrorist_occup_txt: "§YКонтроль немецких террористов§!"
