  RED_redwinter_leftwing_1_tooltip: ""
  RED_redwinter_leftwing_2_tooltip: "\n\nТекущая форма борьбы: §RКрасный террор§!\n§RКрасный террор§! наносит §Yцелевой стране§! легкий §Yурон промышленности§! и огромный урон §Yстабильности§! и §Yодобрению войны§!, потребляя собственную организацию §tКонференции Совместной Борьбы Академий§!. Каждый раз, когда террор успешен, увеличивается §Yвлияние§! §RБазовой фракции§!.\n\n"
  RED_redwinter_leftwing_3_tooltip: "\n\nТекущая форма борьбы: §SИдеологическая учебная борьба§!\n§SИдеологическая учебная борьба§! организует §Yсеминары§! в §Yцелевой стране§! для ознакомления с делом §tКонференции Совместной Борьбы Академий§!, увеличивая §Yвлияние Конференции§! и §Yподдержку коммунизма§!. Каждый раз, когда организуется семинар, увеличивается §Yвлияние§! §SЦентральной фракции§!.\n\n"
  RED_redwinter_leftwing_4_tooltip: "\n\nТекущая форма борьбы: §pТактика единого фронта§!\n§pТактика единого фронта§! пытается объединиться с основными партиями для достижения целей §tКонференции Совместной Борьбы Академий§!. Каждый раз, когда единый фронт успешен, увеличивается §Yвлияние§! §pНародной фракции§!.\n\n"
  RED_redwinter_leftwing_5_tooltip: "\n\nТекущая форма борьбы: §YОрганизация массовых протестов§!\n§YОрганизация массовых протестов§! потребляет организационную емкость §tКонференции Совместной Борьбы Академий§! для организации демонстраций. Успех протеста определяется пропорционально §Yвлиянию Конференции§! и §Yподдержке коммунизма§!. Каждый раз, когда массовый протест успешен, в этой стране увеличиваются §Yподдержка коммунизма§! и §Yвлияние Конференции§!.\n\n"
  RED_redwinter_leftwing_6_tooltip: "\n\nТекущая форма борьбы: §YПровоцирование забастовок§!\n§YПровоцирование забастовок§! потребляет влияние §tКонференции Совместной Борьбы Академий§! для организации забастовок. Размер забастовки определяется пропорционально §Yвлиянию Конференции§! и §Yподдержке коммунизма§!. В зависимости от размера §Yзабастовки§!, наносит целевой стране легкий §Yштраф промышленности§! и урон §Yстабильности§!.\n\n"

  RED_redwinter_rightwing_1_tooltip: ""
  RED_redwinter_rightwing_2_tooltip: "\n\nТекущая организационная линия: §RПодпольное тайное общество§!\n§RПодпольное тайное общество§! заставляет организацию §tКонференции Совместной Борьбы Академий§! действовать тайно. Снижает стоимость §Yборьбы§!, но рост §tвлияния Конференции§! становится очень медленным. Постоянно увеличивает §Yвлияние§! §RБазовой фракции§!.\n\n"
  RED_redwinter_rightwing_3_tooltip: "\n\nТекущая организационная линия: §RАвангард§!\n§RАвангард§! реструктурирует организацию §tКонференции Совместной Борьбы Академий§! в форме авангардной партии, руководимой небольшим числом руководящих фигур. Постоянно увеличивает §Yвлияние§! §SЦентральной фракции§!.\n\n"
  RED_redwinter_rightwing_4_tooltip: "\n\nТекущая организационная линия: §pМассовая организация§!\n§pМассовая организация§! реструктурирует организацию §tКонференции Совместной Борьбы Академий§! в форме массовой партии. Скорость роста §tвлияния Конференции§! становится очень высокой, но увеличивается стоимость §Yборьбы§!. Постоянно увеличивает §Yвлияние§! §pНародной фракции§!.\n\n"

