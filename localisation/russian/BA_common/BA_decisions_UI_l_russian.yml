#########################
########## Валькирия ###########
#########################
KSP_pokemon_archive: "Исправительное Бюро Валькирии"
KSP_pokemon_archive_desc: "Исправительное бюро — ключевая организация Валькирии, посвященная исправлению отклоняющегося поведения учениц и направлению их на правильный путь. Мы принимаем учениц с разным прошлым и проблемами, поддерживая их, чтобы они могли вырасти «здоровыми» членами общества. Это не ограничивается простым дисциплинарным наказанием, а предоставляет им возможность внести вклад в мощь Валькирии, позволяя им обдумать совершенные ошибки и сделать первый шаг к тому, чтобы стать «правильными» ученицами."

KSP_pokemon_correct_ayumu: "Исправление Ивабицу Аюму"
KSP_pokemon_correct_ayumu_desc: "Главный координатор Административного комитета Генерального Студенческого Совета была одной из многих людей, которые тихо работали внутри Генерального Студенческого Совета. После Великого Смещения, пока Совет распадался и его уносило хаосом, она в конечном итоге добровольно вошла в камеру Исправительного бюро. Если нам удастся убедить ее, что мы взяли под контроль Генеральный Студенческий Совет, мы сможем поручить ей посредничество в отношениях между Королевством Бельгия и Полицейской Академией Валькирия, которые оставались нестабильными с момента формирования коалиционного правительства."
KSP_pokemon_correct_ayumu_flag: "Исправление Ивабицу Аюму завершено"

KSP_pokemon_correct_nanagami_rin: "Исправление Нанагами Рин"
KSP_pokemon_correct_nanagami_rin_desc: "Главный администратор Нанагами Рин исполняла обязанности президента Генерального Студенческого Совета с момента исчезновения настоящего президента. Хотя в настоящее время она лишена всей власти и содержится в Исправительном бюро, разрешение ей работать в Полицейской Академии Валькирия могло бы оказать большую помощь в преодолении хаоса, который доминирует в текущей политической ситуации."
KSP_pokemon_correct_nanagami_rin_flag: "Исправление Нанагами Рин завершено"

KSP_pokemon_correct_aoi: "Исправление Оки Аой"
KSP_pokemon_correct_aoi_desc: "Директор по финансам Оки Аой была чрезвычайно компетентным принципиальным человеком во времена, когда Генеральный Студенческий Совет был прочным, и ее усилия были продемонстрированы предотвращением объявления моратория немедленно после Великого Смещения. В то время, когда Полицейская Академия Валькирия шатается из-за расширения, не соответствующего ее реальным возможностям, включить ее и поручить ей финансы — чрезвычайно привлекательное предложение."
KSP_pokemon_correct_aoi_flag: "Исправление Оки Аой завершено"

KSP_pokemon_correct_kaya: "Исправление Ширануи Каи"
KSP_pokemon_correct_kaya_desc: "До Великого Смещения Оборонное ведомство Генерального Студенческого Совета было печально известно своими постоянными скандалами, ответственность за которые, без сомнения, лежала на его директоре, Ширануи Кае. Однако также верно, что благодаря ее руководству Генеральный Студенческий Совет смог, с трудом, поддерживать общественный порядок в Д.У. сразу после катастрофы. Теперь, когда полный контроль над Советом в наших руках, что, если мы передадим ей часть полномочий по безопасности Полицейской Академии Валькирия и доверим ей оборону округа под ее юрисдикцией? Конечно, потребуется определенное исправление."
KSP_pokemon_correct_kaya_flag: "Исправление Ширануи Каи завершено"

KSP_pokemon_correct_momoka: "Исправление Юраки Момоки"
KSP_pokemon_correct_momoka_desc: "Директор по транспорту известна как внутри Генерального Студенческого Совета, так и во внешнем обществе как настоящая «бездельница». Она компетентна и умеет должным образом использовать свой высокий интеллект, но в то же время склонна саботировать свои собственные административные способности. Если нам удастся заставить ее понять текущую ситуацию и легитимность миссии Полицейской Академии Валькирия по поддержанию порядка — кому-то, кому, кажется, не слишком важно различать добро и зло — разве она не возьмется хотя бы за регулирование движения в Д.У.?"
KSP_pokemon_correct_momoka_flag: "Исправление Юраки Момоки завершено"

KSP_pokemon_correct_srt: "Исправление SRT"
KSP_pokemon_correct_srt_desc: "Специальная Академия SRT была вооруженной силой, напрямую подчиненной президенту Генерального Студенческого Совета, вовлеченной во множество инцидентов — включая так называемые «неразрешенные дела» — о которых, возможно, даже мы не имеем полного представления. Подчиняясь только президенту и став практически независимой от Совета после ее исчезновения, эта организация все еще имеет несколько отрядов спецназа с большим опытом. Дать им работу было бы неплохой идеей, хотя это потребовало бы решительных мер, таких как принудительное слияние."

KSP_pokemon_correct_abydos: "Исправление Абидоса"
KSP_pokemon_correct_abydos_desc: "То, что когда-то было крупнейшим институтом Кивотоса, пало на дно пустыни. Пять учениц, которые до Великого Смещения отчаянно боролись, чтобы защитить свою альма-матер от атак Kaiser Industries, поступили в Исправительное бюро. Они согласились сотрудничать с нами при условии, что будет гарантирована автономия бывшей территории Абидоса. Вместе с промышленными объектами бывшей территории Богемии, члены Комитета чрезвычайных мер Абидоса, хоть и немногочисленные, обладают несравненным опытом и могут оказать большую помощь."
KSP_pokemon_correct_gehenna: "Исправление Дисциплинарного комитета"
KSP_pokemon_correct_gehenna_desc: "Дисциплинарный комитет, неофициальная военная сила Академии Генна, которая внесла огромный вклад в поддержание порядка на бывшей территории Германского Государства, в итоге пошел по пути, отличному от нашего, и закончил заключенным в Исправительном бюро. Глава комитета, вероятно, сильнее любого в Полицейской Академии Валькирия, включая директора Общественной безопасности. Хотя их враждебность к нам сохраняется, они также представляют значительную силу. Они должны стать частью нас; мы не знаем, сработает ли примирительная политика, но не должны ли мы хотя бы попытаться?"

KSP_pokemon_correct_pandemonium: "Исправление Пандемониума"
KSP_pokemon_correct_pandemonium_desc: "Общество Пандемониума, широко известное как Манмаджон, было студенческим советом Академии Генна и занималось внешней политикой, бюджетом и администрированием, пока мы не завоевали Генну. Под руководством президента студенческого совета Ханумы Макото, известного явкой в 3% на выборах, казалось, что они эффективно управляли обширной администрацией Генны. Однако любой, кто хоть немного их знает, согласится, что специальность Манмаджон — политические интриги. Хотя их включение, возможно, не слишком выгодно для Полицейской Академии Валькирия, по крайней мере их танковые и артиллерийские подразделения являются мощной силой, и в этом у нас есть явный интерес."

KSP_pokemon_correct_millenium: "Исправление Миллениума"
KSP_pokemon_correct_millenium_desc: "Научная Школа Миллениум была колоссальной академией. Над бесчисленными ученицами, полными мечтаний, горстка непревзойденных за столетие гениев контролировала административную власть. Не технологии Миллениума диктовали курс академии, а их гениальность. Возможно, они даже могли предвидеть будущее, но, кажется, не предугадали, что скоро окажутся заключенными Исправительного бюро. Было бы непростительной растратой не использовать их талант. Не лучше ли снять с них наручники и попробовать примирительную политику?"

KSP_pokemon_correct_white_ghost: "Исправление Хяккияко"
KSP_pokemon_correct_white_ghost_desc: "Долгое время этот регион был полем битвы бесчисленных школьных филиалов, но под посредничеством Арбитражного комитета по спору Хакухёрран они объединились под именем Хяккияко. Достичь объединения территории, которую, казалось, невозможно было сплотить иными средствами, кроме силы, — это выдающееся достижение и демонстрирует способности Хакухёрран, Департамента Оммё и различных клубов Хяккияко. Если, включив их, нам удастся хоть немного стабилизировать общественный порядок в регионе, охваченном хаосом из-за мононокэ, это будет достаточно привлекательный вариант."

KSP_pokemon_correct_chinese_mountain: "Исправление Шаньхайцзин"
KSP_pokemon_correct_chinese_mountain_desc: "Старшая Школа Шаньхайцзин не может похвастаться большим общественным порядком, но по крайней мере их лояльность Вратам Черного Дракона прочна. До Великого Смещения Врата Черного Дракона и Компания Воина-Черепахи были на грани гражданской войны из-за идеологических разногласий, но теперь, даже будучи помещенными в одну камеру, они не провоцируют крупных конфликтов. Возможно, они уже приняли наше господство. Это идеальное время, чтобы они признали наше превосходство, и цена примирительной политики не так уж высока."

KSP_pokemon_correct_redwinter: "Исправление Красной Зимы"
KSP_pokemon_correct_redwinter_desc: "Федеральная Академия Красная Зима была самым демократичным государством Кивотоса, с руководством, которое менялось каждую неделю. После капитуляции, по-видимому, бессрочная власть директора Общественной безопасности должна была продолжиться, что вызвало массовую забастовку Департамента подрядчиков — ситуация, совсем не благоприятная для нас. Ренка и Черино, бывший президент студенческого совета, которая также одновременно занимала должности начальника уборки, генерального секретаря, главы спортивного клуба, главы клуба уборки, главы дисциплинарного комитета и главы столовой, получили обещание по два пудинга ежедневно в Исправительном бюро и предложили нам свой совет, а также готовность сотрудничать. Следуя их рекомендации, мы подготовили щедрое количество пудинга, не разбавленного водой, чтобы запросить сотрудничество Департамента подрядчиков и учениц Красной Зимы."

KSP_pokemon_correct_trinity: "Исправление Тринити"
KSP_pokemon_correct_trinity_desc: "Всесторонняя Академия Тринити была признана одной из трех великих академий и, казалось, была полна решимости сохранить свои позиции даже после Великого Смещения. Спровоцировав войны и конфликты с соседними странами и даже столкнувшись с Полицейской Академией Валькирия, нам с трудом удалось их победить. Однако большинство учениц Тринити до сих пор не признают нас законным студенческим советом. К счастью, мы знаем метод, как заставить замолчать их протесты. Понадобятся всего три человека."

KSP_pokemon_correct_arius: "Исправление Ариуса"
KSP_pokemon_correct_arius_desc: "Было действительно удивительно, что Старшая Школа Ариус, изгнанная в прошлом Никейским Собором и брошенная после использования и списания на войне, вновь появилась после Великого Смещения. Хотя мы аннексировали силой Ариус, который сформировал элитные войска, подпитываемые жаждой мести Тринити, мы очень мало знаем о них. Интеграция их в наш лагерь может потребовать невообразимых усилий, но последующие награды гарантированы."

KSP_annex_cou: "Инкорпорация Генерального Студенческого Совета"
KSP_annex_cou_decesion: "Решение об инкорпорации Генерального Студенческого Совета"
KSP_annex_cou_decesion_desc: "Мы инкорпорируем Генеральный Студенческий Совет в Валькирию. С этим территория Валькирии расширяется, и власть Генерального Студенческого Совета переходит к Валькирии."


