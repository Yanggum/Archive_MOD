  #Кружок происхождения
  FROM_NONE: "§LНет принадлежности§!"
  FROM_Tea_Party: "§LПринадлежит к Студенческому совету Объединенной академии Тринити§!"
  FROM_After_School_Sweets_Club: "§LПринадлежит к Клубу сладостей после уроков§!"
  FROM_Sisterhood: "§LПринадлежит к Сестринству§!"
  FROM_Library_Committee: "§LПринадлежит к Библиотечному комитету§!"
  FROM_Justice_Task_Foce: "§LПринадлежит к Клубу осуществления правосудия§!"
  FROM_Knights_Hospitaller: "§LПринадлежит к Госпитальерскому ордену§!"
  FROM_Trinity_Vigilante_Crew: "§LПринадлежит к Патрулю добровольцев§!"
  FROM_Problem_Solver_68: "Принадлежит к Агентству 68"

  #Объединенная академия Тринити
  TRN_Airi_advisor_desc: "$FROM_Trinity_AcademyFROM_After_School_Sweets_Club$\n\n§LВеселая участница Клуба сладостей после уроков Тринити. Обладает расслабленным и спокойным характером, превыше всего ценит время, проведенное за сладостями и беседами с подругами. Ее любимое лакомство — сладкое мороженое, в последнее время она полностью подсела на мятный вкус с шоколадом.§!\" TRN_Yoshimi_advisor_desc: \"$FROM_Trinity_AcademyFROM_After_School_Sweets_Club$\n\n§LНизкого роста, очаровательная, с блестящими глазами и... легкой дерзостью. Подруги часто называют ее «маленьким зверьком». Хотя ее рост — это комплекс, она больше всех хочет выглядеть взрослой. Поэтому в школе и перед подругами она всегда выпрямляется, стараясь казаться более спокойной и зрелой. Но эта торжественная решимость длится недолго: ее выражение лица тут же выдает ее.\n\nОднако есть момент, когда она действительно сияет: когда она исследует свои любимые кафе со сладостями и пробует сезонные десерты. Обычно она поджимает губы, чтобы выглядеть взрослой, но перед десертом все заботы исчезают, и на ее лице расцветает сияющая улыбка. Это выражение — как у взволнованного зверька, нашедшего любимую еду — настолько очаровательно, что делает счастливыми даже окружающих.§!"
  TRN_Natsu_advisor_desc: "$FROM_Trinity_AcademyFROM_After_School_Sweets_Club$\n\n§LУчастница Клуба сладостей после уроков Тринити; зачинщица проказ и самопровозглашенная «романтик». Имеет привычку отпускать странно философские фразы или сравнивать всё со сладостями. Всегда втягивает других в неприятности своими бредовыми идеями, но на самом деле в глубине души она просто хочет разделить свой «роман» со всеми. Поскольку ее определение «романа» меняется каждый раз, со стороны трудно отрицать впечатление, что все в итоге оказываются «во власти Нацу».§!\" TRN_Kazusa_advisor_desc: \"$FROM_Trinity_AcademyFROM_After_School_Sweets_Club$\n\n§LЧлен Клуба сладостей после уроков, со спокойным и молчаливым характером. Обычно не выделяется и в основном молча следует за действиями других. Хотя ее постоянно затягивает в странности группы и это ее утомляет, с другой стороны, она считает ценным даже это.§!"
  TRN_Mika_advisor_desc: "$FROM_Trinity_AcademyFROM_Tea_Party$\n\n§LОдин из членов «Чаепития» и подруга детства другой лидерши, Нагисы. Однако, поскольку они находятся в политически противоположных лагерях, она четко разделяет личное и публичное. Всегда улыбается, как будто все вокруг забавно, и проявляет живой и веселый характер, но за этой маской скрываются заботы, которые она не может рассказать кому попало... девушка, чей внутренний мир трудно прочитать.§!\" TRN_Nagisa_advisor_desc: \"$FROM_Trinity_AcademyFROM_Tea_Party$\n\n§LОдин из членов «Чаепития». Говорит мягким и нежным голосом, но, поскольку нелегко раскрывает свои мысли, людям трудно приблизиться к ней, и они чувствуют себя неуверенно. Ее хобби — готовить чайные листья и закуски для «Чаепития»; многие ученицы Тринити мечтают участвовать в чаепитии вместе с ней.§!"
  TRN_Seia_advisor_desc: "$FROM_Trinity_AcademyFROM_Tea_Party$\n\n§LВ глазах других она образованна и непредсказуема, с видом капризной аристократки. После инцидента иногда кажется более упрямой и серьезной, чем раньше.§!\" TRN_Sakurako_advisor_desc: \"$FROM_Trinity_AcademyFROM_Sisterhood$\n\n§LНабожная сестра-ученица из Сестринства Тринити. Серьезна во всем и пользуется глубоким доверием многих. Исполняет свои обязанности с благочестивым сердцем, но из-за своей ригидности иногда отстает от моды или здравого смысла.§!"
  TRN_Wakaba_Hinata_advisor_desc: "$FROM_Trinity_AcademyFROM_Sisterhood$\n\n§LПрилежная и добросердечная девушка из Сестринства. Будучи ответственной за администрацию Собора Тринити, она несет большую нагрузку и старательно выполняет свою работу, будучи доброй со всеми. Однако из-за своей неуклюжести она часто совершает ошибки и ей не хватает уверенности. Хотя она всегда носит в сумке огромный стационарный гранатомет, она ни разу не показала, что это ей в тягость.§!\" TRN_Mari_advisor_desc: \"$FROM_Trinity_AcademyFROM_Sisterhood$\n\n§LНабожная и сострадательная девушка из Сестринства. Всегда встречает учениц Тринити с мягкой и доброй улыбкой. У нее очаровательная внешность, но ее спокойная и утешающая атмосфера заставляет многих обращаться к ней за советом. Поскольку она всегда чувствует, что ей еще многого не хватает, она мечтает стать великой сестрой, как ее сэмпаи.§!"
  TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_AcademyFROM_Library_Committee$\n\n§LГлава Библиотечного комитета Тринити. Любит книги настолько, что говорит, будто они ей нравятся больше, чем люди; особенно книги, хранящие след времени. В повседневной жизни она запирается в архиве редких книг — куда почти никто не ходит — чтобы читать или ухаживать за старыми томами.§!\" TRN_Shimiko_advisor_desc: \"$FROM_Trinity_AcademyFROM_Library_Committee$\n\n§LБиблиотекарь Библиотечного комитета Тринити. Настоящий книжный червь и одна из немногих учениц, прочитавших всё огромное собрание библиотеки Тринити. Ей так же нравится читать, как и рекомендовать книги; когда она знакомится с кем-то, она пытается предложить ему книги, соответствующие его вкусам.§!"
  TRN_tsurugi_advisor_desc: "$FROM_Trinity_AcademyFROM_Justice_Task_Foce$\n\n§LГлава Клуба осуществления правосудия и «официальное стратегическое оружие» Тринити. Обладает воинственным и жестоким характером: если ей что-то не нравится, она сначала ломает это, а потом спрашивает. Благодаря способностям заместительницы Хасуми, клуб кое-как держится. Хотя Цуруги — словно бешеная собака, которую невозможно контролировать, перед определенным человеком она проявляет более «девичью» сторону, не умея скрыть смущение.§!\" TRN_Hasumi_advisor_desc: \"$FROM_Trinity_AcademyFROM_Justice_Task_Foce$\n\n§LВторое лицо Клуба осуществления правосудия. Помимо того, что она заменяет хаотичную Цуруги, она также выполняет роль тактического командира клуба. Из-за этого она может казаться спокойной и умной ученицей Тринити... но она все равно часть клуба. Никто лучше нее не умеет сохранять спокойствие... и при этом совершать безрассудные поступки.§!"
  TRN_Ichika_advisor_desc: "$FROM_Trinity_AcademyFROM_Justice_Task_Foce$\n\n§LЧлен Клуба осуществления правосудия с всегда расслабленным выражением лица. Даже в клубе с такими разными ученицами она обычно берет на себя гибкость и координацию. У нее также хорошие отношения с другими академиями. Известна своим мягким выражением и добротой, но это не природное качество: это часть ее усилий.§!\" TRN_Mashiro_advisor_desc: \"$FROM_Trinity_AcademyFROM_Justice_Task_Foce$\n\n§LПрилежный член Клуба осуществления правосудия. Носит огромную крупнокалиберную снайперскую винтовку, не подходящую ее росту, и молча выполняет миссии по огневой поддержке. Говорит мало, но она не застенчива и не лишена социальных навыков; на самом деле, если заходит тема «справедливости», она склонна говорить больше обычного.§!"
  TRN_Koharu_advisor_desc: "$FROM_Trinity_AcademyFROM_Justice_Task_Foce$\n\n§LЧлен Клуба осуществления правосудия. Хотя сама она считает себя элитой, на самом деле она настолько глупа, что даже не может уследить за уроками. У нее есть хобби — коллекционировать пикантные журналы; достаточно любой мелочи, чтобы ее «пикантное» воображение разыгралось, и она в итоге смущалась.§!\" TRN_Ajitani_Hifumi_advisor_desc: \"$FROM_Trinity_AcademyFROM_NONE$\n\n§LХотя она не выделяется ни внешностью, ни оценками, она очень популярна благодаря своему мягкому и покладистому характеру. Она внимательно выслушивает проблемы и истории окружающих, но именно из-за этого иногда поддается влиянию атмосферы и невольно создает проблемы.§!"
  TRN_Hanako_advisor_desc: "$FROM_Trinity_AcademyFROM_NONE$\n\n§LМилая и заботливая барышня. На первый взгляд она действительно кажется скромной и элегантной, но как только открывает рот, отпускает всевозможные эротические комментарии: первостатейная проблема. Ученицы, знающие ее истинное лицо, напрягаются и оглядываются по сторонам каждый раз, когда Ханако начинает говорить.§!\" TRN_Mine_advisor_desc: \"$FROM_Trinity_AcademyFROM_Knights_Hospitaller$\n\n§LВоительница в белом, прямая и с твердой волей, хотя также обладает свирепой стороной. «Слава» (?) о том, что «Минэ ломает, а Госпитальерский орден лечит», уже хорошо известна во всем Тринити. Когда у нее выдается свободная минутка, она проверяет свое снаряжение или готовит чай и закуски, чтобы угостить знакомых и успокоить сердце. Говорят, что ее знание черного чая не уступает даже Хасуми из Клуба осуществления правосудия.§!"
  TRN_Serina_advisor_desc: "$FROM_Trinity_AcademyFROM_Knights_Hospitaller$\n\n§LДобрая девушка из Госпитальерского ордена Тринити. Добросердечна и любит волонтерство; заботится о здоровье до чрезмерной степени, поэтому ее часто называют «мамочкой». Хотя она чувствительна и не выносит ссор и споров, перед врагами, угрожающими миру, она всегда готова твердо противостоять им.§!\" TRN_Hanae_advisor_desc: \"$FROM_Trinity_AcademyFROM_Knights_Hospitaller$\n\n§LВеселая и оживленная новенькая участница Госпитальерского ордена. Она позитивна и полна энергии, но как только видит пациента, поднимает слишком много шума и в итоге ухудшает ситуацию. Она странная девушка во многих отношениях, но говорят, что пациенты, получившие ее поддержку, загадочным образом выздоравливают от любой болезни за короткое время.§!"
  TRN_Suzumi_advisor_desc: "$FROM_Trinity_AcademyFROM_Trinity_Vigilante_Crew$\n\n§LУчастница патруля добровольцев, защищающего безопасность учениц Тринити. По мере того как участились нападения со стороны других академий, она вызвалась добровольцем патрулировать улицы, чтобы предотвратить их. Ее часто ошибочно воспринимают как холодную и суровую из-за ее пламенного чувства справедливости, но на самом деле у нее есть и добрая сторона.§!\" TRN_Reisa_advisor_desc: \"$FROM_Trinity_AcademyFROM_Trinity_Vigilante_Crew$§LДоброволец, внезапно появляющаяся в разных уголках Тринити. Из-за своей шумной и крикливой атмосферы ее иногда принимают за шутницу, но на самом деле она относится к работе добровольца серьезнее всех. Она всегда представляется, но каждый раз ее приветственная фраза меняется чуть-чуть.§!"

  TRK_yurijono_seia_desc: "$FROM_Trinity_Academy$§LПринадлежит к фракции Sanctus\n\nВ глазах других она образованна и непредсказуема, с видом капризной аристократки. С тех пор как она поправила здоровье, иногда также проявляет несколько более упрямую и озорную сторону, как ребенок.§!"
  TRK_kirifuji_Nagisa_desc: "$FROM_Trinity_Academy$§LПринадлежит к фракции Filius§!\n\n§LГоворит мягким и нежным голосом, но, поскольку нелегко раскрывает свои мысли, людям трудно приблизиться к ней, и они чувствуют себя неуверенно. Ее хобби — готовить чайные листья и закуски для «Чаепития»; многие ученицы Тринити мечтают участвовать в чаепитии вместе с ней.§!"

  TRN_Ninomae_Mirai_joke_leader_desc: "$FROM_Trinity_Academy$§LПринадлежит к фракции Pater§!\n\n§LВ тот момент, когда возникает имя Ниномаэ Мирай, первым приходит ощущение, что не нужно останавливаться, чтобы решить, на кого указывает — или на кого не указывает — это имя; и, на самом деле, даже не так важно, возникло ли это ощущение, но, в общем: здесь просто помещено имя, и сказать это заранее, как ни странно, успокаивает. Ниномаэ Мирай, появляющаяся в этом тексте, — персонаж из фанфикшн-новеллы: имя было просто «одолжено», так что возражения вроде «это не так» даже не применимы, и все же я действительно, действительно хочу это подчеркнуть.\n\nНиномаэ Мирай, кажется, что-то делает, но на самом деле ничего не делает; и кажется, что ничего не делает, но даже это не точно. Она стоит где-то, это так, но как только пытаешься объяснить, где именно, фраза удлиняется без причины, а длинные фразы порождают другие фразы, и история о месте ускользает в какую-то щель. Так повествование уходит в сторону снова и снова, и на пути остаются бесполезно яркие слова, которые, когда на них наступаешь, оставляют лишь ощущение бессмысленного шума.\n\nВ ее имени есть «будущее», но это не значит, что мы будем говорить о будущем. Также не о прошлом. О настоящем — тем более. И все же фразы продолжают притворяться, что они что-то говорят; и из-за этого притворства читающий продвигается с мыслью «на всякий случай» к следующей строке, только для того, чтобы следующая строка сделала то же самое, пока не забудется даже то, что такое «направление».\n\nВ конце концов, этот текст, кажется, о Ниномаэ Мирай, но на самом деле он только кружит вокруг имени, рассыпает украшения, избегает темы и заменяет содержание количеством слов. И, опять же: это фанфикшн, и имя было только одолжено; если ты попытаешься искать смысл или обсуждать сеттинг, в тот же миг ты уже отдалишься от потока этого текста. Единственное, что остается — это то, что эти фразы блуждают... и даже за это не нужно цепляться: ничего не случится.§!"

  #Старшая школа Абидос
  ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\nБудучи единственной ученицей 3-го года старшей школы Абидос и эмоциональной опорой Контрмерного комитета, Таканаси Хосино на первый взгляд кажется просто очаровательной лентяйкой, обожающей спать. Глядя на то, как она действует так спокойно, она ощущается скорее милой «кохай», чем внушительной «сэмпай».\n\nНо когда Абидос — школа, которая ей не подходит — или ее кохай оказываются в опасности, ее сладкая и мирная сторона исчезает, и она проявляет такую сильную твердость и прямоту, что хочется спросить: «А куда делась та милая и мягкая Хосино, которая была только что?». Она может немного поддаваться эмоциям, но ее боевая мощь настолько выдающаяся, что эта опрометчивость затмевается: она сокрушает всё, что блокирует ей путь, и продолжает двигаться вперед.\n\nИ все же бывают моменты, когда она также проявляет неуклюжую и странную сторону. Хотя ее кохай спрашивают ее об этом, она уклоняется от ответа. Какова же та история, которую она хранит в сердце и не может рассказать?"
  ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\nПри первой встрече с Сунаоками Сироко, ученицей 2-го года Контрмерного комитета, вы можете влюбиться в первое впечатление. Ее красивая и очаровательная внешность в сочетании со спокойным и мягким, почти шепчущим голосом могут заставить вас влюбиться... но вскоре она обманет ваши ожидания.\n\nОна активна, обладает выносливостью, которой никто не может достичь; и абсурдные идеи, которые она выдает — настолько далекие от здравого смысла, словно между ними миллиарды световых лет — обычно ставят в тупик даже ее коллег по Комитету. Однако эта черта в итоге служит средством, вызывающим к ней еще больше симпатии.\n\nХотя она ученица 2-го года, ее неудержимая энергия напоминает только что распустившуюся ученицу 1-го года; но ее боевое мастерство ощущается как у ветерана 3-го года, уже тысячу раз закаленного. Поэтому для Хосино и Нономи она — очаровательная кохай; в то время как для Сэрики и Аянэ — сильная и достойная уважения сэмпай."
  ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\nИдзаёи Нономи, ученица 2-го года старшей школы Абидос, — та, кто излучает больше всего «сэмпайской» атмосферы. Ее всегда позитивные и светлые отношение и слова иногда будоражат Контрмерный комитет, но также поддерживают в нем всегда веселую атмосферу.\n\nКроме того, она заботится обо всех, прислушивается к мнениям и избегает ссор: у нее очень материнская сторона. Как «ответственная за закуски» комитета, она всегда выполняет роль поддержания боевого духа.\n\nС другой стороны, иногда она достает штуку под названием «золотая карта». Говорят, это безлимитная карта, которой можно купить всё что угодно... тогда почему она не использовала ее, чтобы оплатить долги Абидоса? Иногда возникает этот вопрос, но комитет не углубляется в это. Возможно, Хосино что-то знает."
  ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\nСамая младшая в Абидосе и очаровательная растеряша: Куроми Сэрика часто попадается на удочку. Нередко из-за своей легковерности она теряет деньги, которые с таким трудом копила.\n\nНо в то же время она, вероятно, самая трудолюбивая и вносит наибольший вклад в выплату долгов старшей школы Абидос. Сэрика любит Абидос особой любовью. Ее сэмпаи из внимательности сказали ей, чтобы деньги, которые каждая зарабатывает на подработках, не использовались для долга, а шли только то, что они зарабатывают, когда работают вместе... но Сэрика тайно использует свою зарплату для выплаты долга школы.\n\nИногда она становится суровой и говорит резко в ответ на абсурдные выходки своих сэмпаев — особенно Сироко — но в глубине души она девушка, которая любит Контрмерный комитет больше всех."
  ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\nОкусура Аянэ, секретарь Контрмерного комитета, самая младшая, но среди сэмпаев с такими сильными характерами именно она больше всех проявляет взрослое отношение. Другими словами, кто-то мог бы подумать, что в ней «нет изюминки» или «ей не хватает черт», но среди таких экстравагантных сэмпаев ее «нормальность» сияет как индивидуальность.\n\nЕе часто затягивают, или ей приходится останавливать бредовые идеи: она верно исполняет роль «голоса разума» в Комитете.\n\nК этому моменту вы могли бы подумать, что у Аянэ нет ничего, кроме «нормальности», но это не так. Просто она остается в тени. Аянэ очень умна: она контролирует все доходы и расходы комитета; у нее есть способность извлекать больше прибыли из тех же ресурсов, чем другие; и она управляет всеми объектами Абидоса. Это не то, что любой может повторить.\n\nИ хотя это тоже остается незамеченным на фоне подавляющих способностей ее сэмпаев, ее физическая выносливость — одна из лучших. Короче говоря: цельная девушка, с головы до ног."

  #Объединенная академия Красная Зима
  RED_trotsky_desc: "$FROM_RedWinter_Academy$§LЛев Троцкий был политиком, революционером и марксистским теоретиком большевистского крыла, действовавшим в Российской империи и Советском Союзе; кроме того, он был идеологическим основателем троцкизма. На своем пути он был центральной фигурой Октябрьской революции и, как основатель и лидер Красной армии, внес огромный вклад в строительство советского государства. Его одно время считали возможным преемником Владимира Ленина, но он проиграл борьбу за власть Иосифу Сталину, был исключен из Коммунистической партии и выслан из страны, которую помог основать. После изгнания он переезжал с места на место, критикуя сталинскую систему.§!\n\n§YБиография§! : §LРодился в Яновке, маленькой деревне Елисаветградского уезда Херсонской губернии Российской империи. Его отец, Давид Леонтьевич Бронштейн, был украинцем еврейского происхождения из Полтавы, и в семье говорили на суржике — смеси/пиджине украинского и русского. Его отец был зажиточным крестьянином. Когда Троцкому исполнилось 9 лет, его отправили в Одессу учиться в немецкую лютеранскую школу. Поскольку Одесса была международным городом, где сосуществовало множество этносов, Троцкий пробудился к интернационализму; разительный контракт со Сталиным, грузином, который твердо подчеркивал русский национализм. Троцкий показал блестящие успехи в учебе — окончил с отличием — и владел немецким, а также свободно говорил по-английски и по-французски. В своей автобиографии он говорил, что его языковые способности были «средними» и что особенно он не говорил свободно по-английски; однако в его речах на английском заметно, что, хотя произношение неловкое, построение фраз, кажется, не представляет больших проблем.\n\nВ то время Российская империя жила под абсолютизмом царя, и революционные силы разного идейного происхождения росли как грибы после дождя: любой с минимальным «пробуждением» в итоге пропитывался революционными идеями. Троцкий, изучавший математику, сначала был народником, искавшим социалистическую революцию на русской традиции, но позже испытал влияние марксизма. Его идеологический поворот — от консерватора к народнику, а затем к марксисту — был удивительно быстрым.\n\nБудучи еще студентом, он включился в революционное движение и сыграл центральную роль в организации рабочих Николаева на юге Украины. С тех пор проявились его организаторские способности. Кроме того, его ораторское искусство было исключительным: когда после Февральской революции войска мятежного контрреволюционного генерала Лавра Корнилова вошли в столицу, Троцкий вышел, чтобы остановить их, и произнес речь; только услышав его выступление, войска разошлись по собственной воле, и путч провалился. Он также был превосходным писателем, до такой степени, что Ленин позже заметил: «Его тексты великолепны, но стиль слишком цветист». Британский историк Роберт Сервис, известный исследователь СССР, даже сказал, что, даже если бы Троцкий не был революционером, он оставил бы свое имя в истории как писатель или критик.§!" # А этот почему затесался в Тринити?

  GER_dietrich_bonhoeffer_desc: "§YРождение:§! §L4 февраля 1906 года, Бреслау, Германская империя§!\n§YБиография:§! §LДитрих Бонхёффер родился в 1906 году в Бреслау, в Германской империи, и вырос в семье с сильными лютеранскими традициями. Его дед был придворным капелланом, а мать была культурным человеком, способным обучать детей Библии, поэзии и песням. Однако его отец был равнодушен к вере, и его братья также относились к религии цинично. Когда Бонхёффер объявил, что хочет стать теологом, семья воспротивилась, но он ответил: «Тогда я изменю их», не уступая в своем решении. В конце концов семья уважила его решимость.\n\nИзучив теологию в Тюбингене и Берлине, он получил признание в академических кругах за диссертацию об «общении святых», а благодаря учебной поездке в Рим расширил свое критическое понимание католической литургии и доктрины. Увидев подъем нацизма, Бонхёффер был одним из самых критичных: в 1933 году он даже утверждал в радиопередаче, что власть лидера должна быть ограничена. Позже, перемещаясь между Лондоном и Германией, он осуждал нацистские репрессии против церкви и возглавлял усилия по призыву к церковному сопротивлению.\n\nНо в 1935 году, с началом Великого Переноса, политическая картина Германии резко изменилась. Когда Мисоно Мика пришла к власти, многие успокоились из-за ее кажущейся германофилии, но вскоре это оказалось иллюзией, и под именем «церковной борьбы» начались религиозные репрессии в национальном масштабе.\n\nБонхёффер уже знал, что должен делать. Он также знал, что его путь приведет к трагическому финалу... но его решение не дрогнуло.§!"