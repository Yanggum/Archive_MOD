  FROM_Gehenna_Academy: "§YПредставление ученицы:§!\n§LAкадемия Геннаㅣ§!"
  FROM_Millennium_Academy: "§YПредставление ученицы:§!\n§LНаучная школа Миллениумㅣ§!"
  FROM_Trinity_Academy: "§YПредставление ученицы:§!\n§LОбъединенная академия Тринитиㅣ§!"
  FROM_Hyakkiyako_Academy: "§YПредставление ученицы:§!\n§LОбъединенная академия Хяккиякоㅣ§!"
  FROM_SHANHAIJING_Academy: "§YПредставление ученицы:§!\n§LСтаршая школа Шаньхайцзинㅣ§!"
  FROM_RedWinter_Academy: "§YПредставление ученицы:§!\n§LОбъединенная академия Красная Зимаㅣ§!"
  FROM_Valkyrie_Academy: "§YПредставление ученицы:§!\n§LПолицейская академия Валькирияㅣ§!"
  FROM_SRT_Academy: "§YПредставление ученицы:§!\n§LСпециальная школа SRTㅣ§!"
