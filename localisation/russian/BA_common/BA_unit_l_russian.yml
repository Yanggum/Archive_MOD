#Снаряжение#
  kivotos_infantry_equipment: "Ткацкий станок тайны"
  kivotos_infantry_equipment_short: "Ткацкий станок тайны"

  kivotos_infantry_equipment_0:0 "Неполный ткацкий станок тайны"
  kivotos_infantry_equipment_0_short:0 "Неполный ткацкий станок тайны"

  kivotos_infantry_equipment_1:0 "Ткацкий станок тайны"
  kivotos_infantry_equipment_1_short:0 "Ткацкий станок тайны"

  kivotos_infantry_equipment_desc: "Полностью разработанный ткацкий станок тайны, созданный для восполнения острой нехватки тайны после Великого Перехода Кивотоса в иной мир."
  kivotos_infantry_equipment_0_desc: "Прототип ткацкого станка тайны. Хотя его производительность ниже, чем предполагалось в теории, он обладает способностью генерировать тайну."
  kivotos_infantry_equipment_1_desc: "Полностью разработанный ткацкий станок тайны для восполнения нехватки тайны после Великого Перехода. Он был разработан под руководством Сираиси Утахи из Миллениума и Якуси Саи из Шанхайцзина и известен как оборудование, спасшее Кивотос от неминуемого поражения."

  decagrammaton_equipment: "Компоненты Пророка"
  decagrammaton_equipment_0: "Компоненты Пророка"
  decagrammaton_equipment_desc: "Компоненты, используемые в огромных машинах, управляемых Декаграмматоном. Эти колоссальные машины, известные как «Пророки», обладают крайне уникальным механизмом функционирования."

  kivotos_dron_equipment: "Оборудование дронов Кивотоса"
  kivotos_dron_equipment_0: "Оборудование дронов Кивотоса"
  kivotos_dron_equipment_desc: "Оборудование, используемое дронами, управляемыми в Кивотосе."

  ABYDOS_modern_infantry_equipment:0 "Полу-современное пехотное снаряжение"
  ABYDOS_modern_infantry_equipment_desc:0 "Пехотное снаряжение, вдохновленное современным вооружением Кивотоса, изготовленное путем замены пластиков и синтетических смол на сталь."

  juggernaut_equipment:0 "Снаряжение Джаггернаута"
  juggernaut_equipment_0:0 "Снаряжение Джаггернаута"
  juggernaut_equipment_desc:0 "Некоторые страны отвергли негуманные методы искусственного ореола, такие как принудительный призыв студентов или контракты с пятилетним сроком жизни. Как более этичную альтернативу, они разработали мистическую пехоту на основе бронированных экзоскелетов: костюм Джаггернаута. Хотя он быстро потребляет калории пользователя и зависит от его физического состояния, он не оказывает неблагоприятного воздействия на здоровье. В целом, он предлагает мощь, сходную с пехотой с искусственным ореолом, но со стоимостью производства примерно в три раза выше, что затрудняет его массовое развертывание."

  syemmata_railway_gun: "Железнодорожное орудие класса Шеммата"
  syemmata_railway_gun_equipment: "Железнодорожное орудие класса Шеммата"
  syemmata_railway_gun_equipment_short: "Железнодорожное орудие Шеммата"
  syemmata_railway_gun_equipment_desc: "Это колоссальное орудие, символ сотрудничества между Генной и Абидосом, обладает беспрецедентной мощью и исключительной точностью в радиусе атаки 500 км. Это идеальное асимметричное стратегическое оружие, которое обеспечит нашей нации подавляющую гегемонию."

  syemmata_railway_gun_equipment_1: "Железнодорожное орудие класса Шеммата"
  syemmata_railway_gun_equipment_1_short: "Железнодорожное орудие Шеммата"
  syemmata_railway_gun_equipment_1_desc: "Это колоссальное орудие, символ сотрудничества между Генной и Абидосом, обладает беспрецедентной мощью и исключительной точностью в радиусе атаки 500 км. Это идеальное асимметричное стратегическое оружие, которое обеспечит нашей нации подавляющую гегемонию."

  ABY_syemmata_railway_gun_equipment_1: "Железнодорожное орудие Шеммата"

  BA_sp_land_syemmata_railway_gun: "Железнодорожное орудие класса Шеммата"
  ABY_BA_sp_land_syemmata_railway_gun: "Железнодорожное орудие Шеммата"
  BA_sp_land_syemmata_railway_gun_desc: "Это колоссальное орудие, символ сотрудничества между Генной и Абидосом, обладает беспрецедентной мощью и исключительной точностью в радиусе атаки 500 км. Это идеальное асимметричное стратегическое оружие, которое обеспечит нашей нации подавляющую гегемонию."

