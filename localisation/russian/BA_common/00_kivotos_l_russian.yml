l_russian:
  kim_yong_ha_name: "Ким Ён Ха"
  kim_yong_ha_desc: "Я вышел к Чхонгечхону, чтобы укрепить свою решимость"

  #Общее
  BA_HISTORICAL_CHOICE_TT: "§gЭто историческое решение.§!"
  BA_kivotos_school_country_category: "Академии Кивотоса"
  BA_kivotos_school_country_category_desc: "Эта страна, изначально бывшая академией из места под названием Кивотос, сохраняет культуру из другого измерения, предшествовавшего Великому Переносу. Кроме того, ореолы над их головами явно отличают их от существующих людей и сформировали своего рода кивотосский национализм. Они тоскуют по своему изначальному Кивотосу и сохраняют его прошлую культуру."
  BA_decisions_give_me_the_COU: "Возвышение [ROOT.GetLeader] как президента Генерального студенческого совета"
  BA_decisions_me_is_COU: "Преобразовать страну в Генеральный студенческий совет Кивотоса"
  BA_all_country_category: "Альянс Кивотоса"
  BA_all_country_category_desc: "S.C.H.A.L.E. начинался как внештатный клуб Генерального студенческого совета, но по приказу президента его цель полностью изменилась. Приняв великую цель объединения Кивотоса, S.C.H.A.L.E. вскоре поглотил парализованный Студенческий совет и основал Альянс Кивотоса. Недавно S.C.H.A.L.E. реорганизовал этот альянс, чтобы приспособить его к реальности, переименовав в «Евро-Кивотосский альянс», и теперь мы можем выбирать, что мы будем делать внутри него."
  BA_join_the_kibotos_alliance: "Присоединиться к Альянсу Кивотоса"
  BA_participation_in_economic_cooperation: "Евро-Кивотосское экономическое сотрудничество"
  BA_remove_dead_lands: "Решить проблему затопленных районов D.U."
  BA_remove_dead_lands_desc: "Пока Генеральный студенческий совет и S.C.H.A.L.E. вели между собой споры, они совершенно не решили проблему наводнений в районе D.U. Восстановление затопленных зон, заброшенных на долгое время, — как ни странно — перешло под нашу ответственность."

  BA_from_southern_kivotos: "Объединение южного Кивотоса"
  BA_from_southern_kivotos_desc: "Южная периферия Кивотоса, часто представленная Хяккияко и Шаньхайцзин, является более закрытым регионом, чем другие. Хотя после Великого Переноса произошли различные изменения, уникальная культура южного Кивотоса сохраняет отличительные черты, явно отличающиеся от остальных. Поскольку мы управляем всеми регионами, соответствующими южному Кивотосу, мы можем подчеркивать эту общую культуру."
  southern_kivoto_decision: "Объединить южный Кивотос"

  form_southern_kivotos_nation_flag: "§YЮжный Кивотос§! объединен."

  #Общие идеи
  BA_isolation: "Изоляция"
  BA_isolation_desc: "Наша система дипломатии и торговли временно парализована из-за чрезвычайной ситуации.\n\n"
  BA_can_remove_isolation_flag: "Условия для снятия §YИзоляции§! выполнены."
  Aftermath_of_the_Second_Soviet_Polish_War: "Последствия Второй советско-польской войны"
  Aftermath_of_the_Second_Soviet_Polish_War_desc: "В ужасном хаосе, вызванном прибытием в Европу странных существ, называющих себя Кивотосом, на советско-польской границе вспыхнули мелкие стычки, которые вскоре переросли во Вторую советско-польскую войну, которой не желала ни одна из стран. Вступив в войну, к которой они не были готовы, обе стороны понесли огромные людские потери, и конфликт закончился, не принеся никому никакой выгоды."
  BA_soviet_puppet_idea: "Советская республика"
  BA_three_major_academies: "Три великие академии"
  BA_three_major_academies_desc: "В Кивотосе существуют три академии-гиганта, известные как «три великие академии». Эти академии имеют больше учениц и постоянные армии большего масштаба, чем остальные."
  BA_three_major_academies_tt: "£GFX_unit_halo_infantry_icon_small Лимит §Yшаблонов§! для §CПехоты с ореолом§!: §G+6§!"
  BA_railway_gauge_issue: "Проблемные железные дороги"
  BA_railway_gauge_issue_desc: "Железнодорожная сеть этого нового мира сильно отличалась от нашей. Множество путей, разорванных эффектами dimensional переноса, наряду с участками разной ширины колеи и другими проблемами, значительно задерживают наши строительные работы."
  BA_exiles_of_the_future: "Изгнанники из будущего"
  BA_exiles_of_the_future_desc: "Неизвестный мир, множество отсталых технологий и никогда не виданные научные теории повергли нас в замешательство. Возможно, нам потребуется больше времени, чтобы адаптироваться к науке и технологиям этого мира и даже продвинуть их вперед."
  MIL_laboratory: "Лаборатория Миллениума"
  NC_airship_department: "Школа Кронос"
  koki_electricity: "Koki Electric"
  BA_veronica: "Вероника"

  BA_kiovotos_spain_event.1.t: "Хаос прямо под боком"
  BA_kiovotos_spain_event.1.d: "Хаос охватил территорию непосредственно к югу от нашей. Согласно информации от Veritas, военное руководство [SPR.getname] попыталось совершить государственный переворот, но правительство и граждане организуют силы сопротивления, чтобы противостоять ему. С другой стороны, бесчисленные беженцы бегут от гражданской войны и скапливаются на нашей территории. Мы должны урегулировать эту ситуацию."
  BA_kiovotos_spain_event.1.a: "Проклятье."
  BA_kiovotos_spain_event.2.t: "Проблема беженцев"
  BA_kiovotos_spain_event.2.d: "Мы не можем сидеть сложа руки, пока число беженцев растет. Граждане юга требуют немедленно их выслать. В то же время некоторые студенческие группы утверждают, что такие меры бесчеловечны."
  BA_kiovotos_spain_event.2.a: "Давайте вышлем их всех."
  BA_kiovotos_spain_event.2.b: "Очевидно, что вся вина за эту ситуацию лежит на военном руководстве Испании."
  BA_kiovotos_spain_event.2.c: "Мы должны напрямую свергнуть некомпетентное испанское правительство."
  BA_kiovotos_spain_event.3.t: "Дебаты о создании Интервенционного комитета"
  BA_kiovotos_spain_event.3.d: "После отправки добровольцев из Миллениума в гражданскую войну в Испании, другие страны Кивотоса также пытаются без ограничений вмешиваться в конфликт. Чтобы избежать идеологических столкновений и конфликтов интересов между государствами Кивотоса и поддерживать сотрудничество, мы могли бы учредить и управлять Интервенционным комитетом, который координировал бы и ограничивал эти интервенции."
  BA_kiovotos_spain_event.3.a: "Давайте учредим Интервенционный комитет."
  BA_kiovotos_spain_event.3.b: "Действительно ли нужно их контролировать?"
  BA_kiovotos_spain_event.3_tt: "В странах-членах органа сотрудничества Кивотоса стоимость £GFX_pol_power Политической власти для решения £GFX_decision_icon_small §YВыйти из органа сотрудничества Кивотоса§! уменьшается на 20."
  BA_kiovotos_spain_event.4.t: "Установлен Интервенционный комитет"
  BA_kiovotos_spain_event.4.d: "По решению Генерального студенческого совета, было решено установить Интервенционный комитет при органе сотрудничества Кивотоса. Комитет стремится помешать странам Кивотоса без разбора вмешиваться в гражданскую войну в Испании и имеет полномочия по надзору за добровольческими корпусами. Тем не менее, если мы будем должным образом соблюдать положения комитета, мы сможем свободно осуществлять военную деятельность в разрешенных рамках."
  BA_kiovotos_spain_event.4.a: "Нам надели кандалы на ногу."
  BA_kiovotos_spain_event.5.t: "Предложение Миллениума"
  BA_kiovotos_spain_event.5.d: "В условиях все более глубокого вмешательства в гражданскую войну Миллениум предложил соглашение о невмешательстве. Это предложение — сократить требуемые ресурсы путем корректировки регламента Интервенционного комитета в обмен на управление добровольцами минимального размера — вызывает интенсивные дебаты среди членов органа сотрудничества."
  BA_kiovotos_spain_event.5.a: "Давайте примем его."
  BA_kiovotos_spain_event.5.b: "Суверенитет все еще наш."
  BA_kiovotos_spain_event.6.t: "Остановить Миллениум"
  BA_kiovotos_spain_event.6.d: "Глупое решение Миллениума только усугубляет ситуацию, не в силах положить конец гражданской войне! До сих пор мы избегали военного возмездия из-за огромной мощи Миллениума, но этому пришел конец. Мы быстро ударим по равнинам северной Франции, чтобы сломать их способность к контратаке и остановить глубоко ошибочную гегемонию Миллениума!"
  BA_kiovotos_spain_event.6.a: "Вперед!"
  BA_kiovotos_spain_event.6.b: "Нет, это слишком опрометчиво."

  BA_interference_committee: "Интервенционный комитет"

  ABY_abydos_sandstorm: "Песчаная буря Абидоса"
  ABY_abydos_sandstorm_desc: "\n\n\n£GFX_ABY_abydos_sandstorm_picture \n\n\n\nАбидос был академией, владевшей обширной пустыней. Однако, переместившись в Европу посредством Великого Переноса, прибыли только сама академия и часть автономного района. Тем не менее, похоже, что этой части автономного района было достаточно, чтобы вызвать опустынивание на обширных территориях Европы. Пока экосистема не восстановится с течением времени, в этом регионе будут дуть песчаные бури."

  generic_research_advances: "Достижения в исследованиях"
  generic_research_advances_desc: "Благодаря активным инвестициям нашего правительства, исследования и разработки быстро прогрессируют."

  #Общие черты
  cronos_school: "Радиовещательная компания Кивотоса"
  MIL_automaton_manufacturer: "Учреждение передовых научных исследований"
  train_school: "Железнодорожная компания Кивотоса"
  GEH_designer: "Беспорядочный разработчик"
  RED_designer: "Красная промышленная компания"

  BA_generic_event.1.t: "Мандат на [269.getname]"
  BA_generic_event.1.desc: "После окончательного поражения британского правительства в решающей битве за метрополию, они почти полностью утратили способность контролировать колонии. Чтобы более гладко вести войну, которую мы ведем против [ETH.getname], мы должны воспользоваться их колонией, [269.getname]. Даже если наши войска войдут в этот регион, британскому правительству ничего не останется, кроме как принять это; поэтому мы получим мандат на управление территорией, чтобы наши дивизии могли там действовать."
  BA_generic_event.1.a: "Легче просить прощения, чем разрешения."
  BA_generic_event.1.b: "Не нужно дергать льва за усы."

  BA_generic_event.2.t: "Вопрос о концессиях в Китае"
  BA_generic_event.2.desc: "С крахом Великобритании концессии в Китае стали ничейной землей. Под предлогом «защиты» японцев внутри концессий мы силой захватили их."
  BA_generic_event.2.a: "Хорошая идея."
  BA_generic_event.2.b: "Я не могу продать будущее."

  BA_generic_event.3.t: "Лондонский мост рушится"
  BA_generic_event.3.desc: "С уходом флага Британской империи, господствовавшей в Тихом океане, наши соперники в этом регионе исчезли. Мы можем воспользоваться этой возможностью, чтобы захватить гегемонию в Тихом океане."
  BA_generic_event.3.a: "Захватить!"
  BA_generic_event.3.b: "Я не могу продать будущее."

  BA_generic_event.4.t: "Итальянская операция по вторжению в Миллениум"
  BA_generic_event.4.desc: "Италия утверждает, что сейчас самое время атаковать Миллениум, и запрашивает объявление войны."
  BA_generic_event.4.a: "Это идеальный момент"
  BA_generic_event.4.b: "Сейчас нельзя."

  BA_generic_event.5.t: "Предложение мира от Китая"
  BA_generic_event.5.desc: "Китайская Республика не смогла противостоять наступлению Японской империи и сегодня предложила нам мир."
  BA_generic_event.5.a: "Отлично."

  BA_generic_event.6.t: "Япония соглашается"
  BA_generic_event.6.desc: "Япония приняла наш мирный договор."
  BA_generic_event.6.a: "Как прискорбно."

  BA_generic_event.7.t: "Абидос требует референдума"
  BA_generic_event.7.desc: "В речи Отто фон Габсбурга в [4.GetName] венгерские подданные умоляли разрешить им вернуться под их власть. Однако в знак примирения он публично заявил, что народ Австрии должен решить сам суверенно."
  BA_generic_event.7.a: "Позвольте людям говорить."
  BA_generic_event.7.b: "Это нужно оставить экспертам."

  BA_generic_event.8.t: "Референдум одобрен"
  BA_generic_event.8.desc: "Результаты референдума уже известны, и предварительный подсчет указывает, что союз с Абидосом получил большинство."
  BA_generic_event.8.a: "Это воля народа."

  BA_generic_event.9.t: "Референдум провалился"
  BA_generic_event.9.desc: "Несмотря на идеальную подготовку сторонников Абидоса и монархистов, предварительный результат, по-видимому, с небольшим перевесом, — сохранение статус-кво."
  BA_generic_event.9.a: "Тогда остается только один метод."

  BA_generic_event.10.t: "Референдум отклонен"
  BA_generic_event.10.desc: "Венгерский лидер, [HUN.Getleader], отклонил наше требование о проведении референдума."

  BA_generic_event.11.t: "Анархия в Северной Ирландии"
  BA_generic_event.11.d: "Британская империя пала перед существами из другого измерения и встала на путь изгнания. С их уходом с Британских островов все британские войска в Северной Ирландии были выведены, создав вакуум безопасности.\nТеперь, когда Британия ушла, судьба Северной Ирландии может быть только одна."
  BA_generic_event.11.a: "Оккупировать Северную Ирландию!"
  ENG_to_IRE_Betray: "Предатели"
  BA_generic_event.11.b: "Оказать умеренную помощь Британии в поддержании порядка."
  ENG_to_IRE_HAPPYCAT: "Была оказана помощь"

  BA_generic_event.12.t: "Слава забытых преступников"
  BA_generic_event.12.d: "Исследуя остров Таити, мы нашли множество могил. После изучения было подтверждено, что они принадлежат группе преступников. Странно то, что у них было огромное количество золотых слитков. При исследовании происхождения было установлено, что они происходят из Сен-Дени, то есть слитки, украденные из банка старого Нового Орлеана.\n\nОграбление банка в Новом Орлеане, оставшееся нераскрытым делом на всю жизнь в 1899 году, глубоко потрясло американскую историю. После ограбления преступники бесследно исчезли.\nИх так и не удалось найти, и дело осталось вечной тайной, обреченной быть забытой со временем. Однако новость о том, что они были абсурдным образом найдены на Таити, повергла американское общество в шок.\n\nСуществует две основные теории о том, почему они оказались на Таити: что они покинули США на корабле и потерпели кораблекрушение из-за шторма, или что они намеренно уехали, захватив слитки. Ученые до сих пор расходятся во мнениях, но многие американские граждане принимают вторую.\n\nКак бы то ни было, их смерть станет сигналом того, что эпоха преступников наконец закончилась."
  BA_generic_event.12.a: "Красный, смерть и искупление"

  BA_generic_event.13.t: "Открытие ядерного деления"
  BA_generic_event.13.d: "Отто Ган и Штрасман провели эксперимент, облучая уран нейтронами. Целью было получить радиоактивные изотопы и с помощью химического анализа подтвердить новые элементы.\n\nОднако продукт оказался элементом, гораздо более легким, чем уран. Штрасман с помощью точного анализа подтвердил, что это барий. Это был результат, невозможный для объяснения существующими теориями.\n\nОба выдвинули гипотезу, что ядро разделилось в реакции между ураном и нейтронами. Химически эксперимент был очень убедительным, но они не были уверены в своем физическом объяснении.\n\nГан поделился результатами со своей коллегой Лизой Мейтнер. Мейтнер и Отто Фриш интерпретировали их теоретически и пришли к выводу, что ядро урана, получив удар нейтрона, делится, образуя два более легких элемента. В этом процессе выделялось огромное количество энергии, и они назвали это «ядерным делением».\n\nОткрытие вызвало большой шок в научном сообществе, особенно потому, что открывало возможность разработки атомных бомб из огромной энергии, выделяемой при делении."
  BA_generic_event.13.a: "Это невероятное открытие!"

  BA_generic_event.16.t: "§tОбнаружен проект KV!§!"
  BA_generic_event.16.d: "Вскоре после того, как Великий Перенос сбросил нас в этот странный мир, пришла новость о том, что на далеком Востоке появилась новая сила из-за Великого Переноса.\n\nЭто поразительное открытие, так что мы должны немедленно отправиться туда! Прямо сейчас, быстро!"
  BA_generic_event.16.a: "Кажется, это великолепная идея!"
  BA_generic_event.16.b: "Нет, ты с ума сошла?"

  BA_generic_event.17.t: "[USA.getname] хочет присоединиться к Коммунистическому Интернационалу"
  BA_generic_event.17.d: "[USA.getname] выразил желание присоединиться к Коммунистическому Интернационалу."
  BA_generic_event.17.a: "Какая хорошая новость!"
  BA_generic_event.17.b: "Они нам не нужны в нашей фракции."

  BA_generic_event.18.t: "[USA.getname] отказывается"
  BA_generic_event.18.d: "В ответ на наше намерение присоединиться, [USA.getname] твердо отверг его."
  BA_generic_event.18.a: "Посмотрим, как у них пойдут дела без нас."

  BA_generic_event.19.t: "Сон в кабинете"
  BA_generic_event.19.d: "......Это была моя вина.\n\nМои решения. И всё, что они повлекли за собой.\nЧто только сейчас, придя к этому результату, я понимаю, что ты был прав.......\n\n......Поэтому, хотя у меня нет права просить, я умоляю тебя.\n\nСэнсэй. [ROOT.GetLeader]\nВ любом случае ты забудешь мои слова, но... наверное, это неважно, да?\nДаже если ты ничего не вспомнишь, вероятно, в той же ситуации ты примешь те же решения.......\n\nПоэтому, возможно... важно не пережитое, а выбор.\nВыборы, которые можешь сделать только ты.\n\nПомнишь, мы говорили о человеке, который несет ответственность?\nТогда я не понимала... но теперь понимаю.\n\nВзрослый. Ответственность и долг, и выбор, существующий за их пределами.\n\nДаже то, что это означает.\n\n.......\nИтак, Сэнсэй.\nТолько ты, взрослый, которому я могу доверять,\nможешь найти иной результат, отличный от этой искривленной и деформированной судьбы…\n\nможешь найти... варианты, ведущие к этому месту.\n\nИтак, Сэнсэй.\nПожалуйста......."
  BA_generic_event.19.a: "Сэнсэй... что?"

  BA_generic_event.20.t: "Новый золотой век Монголии"
  BA_generic_event.20.d: "В году [GetYear] была написана новая история в монгольской степи. Даже под веками иностранного господства и угнетения искра народа никогда не угасала... и наконец разгорелась великим пламенем. Потомки Чингисхана снова стали хозяевами истории на земле своих предков."
  BA_generic_event.20.a: "Баярла!"

  BA_generic_event.401.t: "Наступает новый год"
  BA_generic_event.401.d: "Это был шумный и хаотичный год с новыми соседями, но Новый год наступил снова.\nХотя некоторые ненавидят и проливают слезы, большинство вышло на улицы, чтобы встретить новый год, неуклюже, но полным жизни. Даже те, кто еще вчера подозревали и следили друг за другом, сегодня шли вместе, разделяя неловкие улыбки.\nУченицы и местные жители могут выглядеть по-разному внешне, но большинство представляет и желает мирного и полного надежд будущего в этом году.\n\nПо крайней мере, сейчас."
  BA_generic_event.401.a: "В этом году будет немного лучше, правда?"

  #События режима Сэнсэя с 13XX
  BA_generic_event.1301.t: "Контакт от Генерального студенческого совета"
  BA_generic_event.1301.d: "Уважаемый Сэнсэй:\n\nЯ Нанагами Рин, временно исполняющая обязанности президента Генерального студенческого совета, отвечающая за надзор за администрацией Автономного района Кивотоса.\n\nЯ узнала, что Вы, как лидер страны, стали новым Сэнсэем, и поэтому связываюсь с Вами.\nМы надеемся, что Вы установите дружественные отношения с Кивотосом и будете направлять наших учениц по правильному пути. С этого момента я в Вашем распоряжении."
  BA_generic_event.1301.a: "Взаимно, Рин. Рад работать с тобой."
  BA_generic_event.1301.b: "Подожди, Сэнсэй? О чем ты говоришь?"
  BA_generic_event.1302.t: "Ответ Генерального студенческого совета"
  BA_generic_event.1302.d: "Ах, простите. Я была невежлива. Обращение «Сэнсэй» — это титул, который в Кивотосе дают самому уважаемому лидеру и советнику. Мы считаем, что Вы обладаете достаточными заслугами, и поэтому называем Вас так; но если обращение Вам неприятно, мы исправим его."
  BA_generic_event.1302.a: "Нет, все в порядке. Можешь называть меня «Сэнсэй»."
  BA_generic_event.1302.b: "Этот титул слишком велик для меня."

  BA_generic_event.1303.t: "Чрезвычайное предложение Генерального студенческого совета"
  BA_generic_event.1303.d: "Сэнсэй, я связываюсь с Вами снова. На самом деле Генеральный студенческий совет почти парализован в административном отношении из-за отсутствия президента. Чтобы Кивотос восстановил стабильность под Вашим руководством, мы желаем временно передать Вам административные полномочия Генерального студенческого совета. Я прошу Вас рассмотреть наше предложение."
  BA_generic_event.1303.a: "Я принимаю предложение. Я также защищу ваш мир."
  BA_generic_event.1303.b: "Дайте мне немного времени подумать."
  BA_generic_event.1303.c: "Прости, но я не могу сделать этого."

  BA_generic_event.1304.t: "Ультиматум Генерального студенческого совета"
  BA_generic_event.1304.d: "Сэнсэй, мы сожалеем о Вашем отказе. Но мы не можем просто так отступить. Если Вы не станете нашим лидером, тогда мы сделаем Вас им... даже силой. Такова наша решимость, решимость Генерального студенческого совета."
  BA_generic_event.1304.a: "......!"