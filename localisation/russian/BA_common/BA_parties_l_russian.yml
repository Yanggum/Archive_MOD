  HEU_democratic_party:0 "Правая партия - Реформистская фракция"
  HEU_democratic_party_long:0 "Правая партия - Реформистская фракция\n§gРеформистская фракция, внутреннее течение Правой партии, в отличие от консервативного крыла, не отрицает современную демократию — включая всеобщее избирательное право — и стремится реализовать политику христианской демократии, основанную на католической идеологии. Правая партия традиционно была правой партией, опиравшейся на крестьянство и католицизм Люксембурга.§!"
  HEU_communism_party:0 "Коммунистическая партия Люксембурга"
  HEU_communism_party_long:0 "Коммунистическая партия Люксембурга\n§gКоммунистическая партия Люксембурга — это сталинская ультралевая партия, объявившая об отделении и независимости в 1921 году после столкновения линий с Люксембургской Социалистической Рабочей партией, левой силой. Она завоевала большую популярность среди рабочих сталелитейной и горнодобывающей промышленности на юге Люксембурга; однако до выборов 1934 года, даже если им удавалось быть избранными депутатами, правящая партия — Правая партия — запретила им доступ в парламент (посредством процедур лишения мандатов).§!"
  HEU_fascism_party:0 "GEDELIT"
  HEU_fascism_party_long:0 "Немецкая ассоциация литературы и искусств\n§gGEDELIT, возглавляемая люксембургским профессором греческого языка Дамианом Кратценбергом, вышла за рамки концепции простого «литературного общества» и проповедовала пангерманский национализм: культурную однородность между Люксембургом и Германией и идею о том, что Люксембург должен интегрироваться как часть Германии. GEDELIT чрезвычайно выросла, поглотив и объединив в 1931 году Партию независимого государства, правое популистское формирование, и стала осью ультраправого движения в Люксембурге в 30-е годы.§!"
  HEU_neutrality_party:0 "Дом Рикухачима"
  HEU_neutrality_party_long:0 "Детективное Агентство 68 / Коалиционное правительство с Правой партией\n§gПосле Великого Перехода Люксембург стал единственной страной в Центральной Европе среди государств, атакованных силами Кивотоса, которой удалось сохранить свой суверенитет и территорию. Регент Люксембурга Рикухачима Ару продвигает несколько идеалистичную интеграцию между группами Генны и люксембуржцами; но Правая партия, хотя и поддерживает ее с большой осторожностью, наблюдает с глубоким беспокойством, что ее интеграционное движение подрывает их базу поддержки.§!"

  HEU_benriya_party:0 "Детективное Агентство 68"
  HEU_rechtspartei_party:0 "Правая партия"
  HEU_PRL_party:0 "Радикальная либеральная партия"
  HEU_PRL_party_long:0 "Радикальная либеральная партия\n§gРадикальная либеральная партия не является ни особенно радикальной, ни либеральной; тем не менее, она является привлекательной альтернативой для городского среднего класса, который считает себя прогрессивным и хочет голосовать за что-то «более тонкое», чем Правая партия с запахом деревни. Основанная в 1904 году, эта партия первоначально называлась Либеральная лига (Liberale Liga), но в водовороте мелких либеральных групп Люксембурга меняла название снова и снова. После 30 лет политической жизни PRL поняла, что на политической сцене, смещенной вправо, выживают, «поставив направление влево и поворачивая вправо»: до Великого Перехода она поддерживала политику Правой партии и действовала как младший коалиционный партнер, по-своему разворачивая идеал люксембургского радикального либерализма.§!"
  HEU_LSAP_party:0 "Люксембургская Рабочая партия"
  HEU_LSAP_party_long:0 "Люксембургская Рабочая партия\n§gХотя Люксембургская Рабочая партия — социалистическая сила страны — была основана в 1902 году, она получила реальное политическое влияние только после введения всеобщего избирательного права в 1919 году. В отличие от Коммунистической партии Люксембурга, отделившейся из-за разногласий по поводу СССР, Рабочая партия выступала против как Советского Союза, так и сталинизма, и защищала «разделение и автономию между профсоюзами и партией».§!"
  HEU_grand_coalition_party:0 "Правительство Национального Единства"
  HEU_grand_coalition_party_long_1:0 "Большая коалиция Детективного Агентства 68 / Правой партии / Радикальной либеральной партии / Коммунистической партии Люксембурга"
  HEU_grand_coalition_party_long_2:0 "Большая коалиция Детективного Агентства 68 / Федеральной лиги кадетов / Радикальной либеральной партии / Коммунистической партии Люксембурга"
  HEU_volksdeutsche_party:0 "Немецкое национальное движение"
  HEU_volksdeutsche_party_long:0 "Немецкое национальное движение\n§gНемецкое национальное движение, возглавляемое люксембургским профессором греческого языка Дамианом Кратценбергом, является нацистской политической силой, наследующей GEDELIT, люксембургское национал-социалистическое движение начала 30-х годов. Кратценберг поддерживал идеал, что люксембуржцы — тот же народ, что и немцы; однако это Немецкое национальное движение было отвергнуто традиционными силами люксембургских правых.§!"
  HEU_pro_kayoko_party:0 "Армия Люксембурга"
  HEU_pro_kayoko_party_long:0 "Армия Люксембурга\n§gПосле государственного переворота люксембургская армия раскололась. Монархические силы, поддерживающие Рикухачиму Ару, после провозглашения Оникаты Каёко новым премьер-министром Люксембурга объявили кабинет Муцуки нелегитимным и начали партизанскую войну. Что они являются лояльными монархистами и сторонниками Ару — несомненно, но это не означает, что они демократичны или либеральны.§!"
  HEU_pro_mutsuki_party:0 "Правительство Чрезвычайного Положения"
  HEU_pro_mutsuki_party_long:0 "Кабинет Муцуки"
  HEU_pro_mutsuki_party_trinity:0 "Чайная Вечеринка"
  HEU_pro_mutsuki_party_trinity_long:0 "Чайная Вечеринка\n§gАсаги Муцуки так же непредсказуема, как и ее прозвище «дьяволенок». Поскольку компьютеризированные архивы были утеряны в хаосе после Великого Перехода, никто не может опровергнуть доказательствами и основаниями ее утверждения о том, что «я не из Генны, а агент разведки, посланный из Тринити», ни ее эксцентричность в самопровозглашении «Хозяином Люксембурга». Скорее, чем руководствоваться определенной идеологией, Чайная Вечеринка управляется капризами Асаги Муцуки и постидеологической популистской политикой, стремящейся угодить люксембургским массам.§!"
  HEU_pro_mutsuki_party_gehenna:0 "Временное Революционное Правительство Генны"
  HEU_pro_mutsuki_party_gehenna_long:0 "Временное Революционное Правительство Генны\n§gАсаги Муцуки так же непредсказуема, как и ее прозвище «дьяволенок». Поскольку компьютеризированные архивы были утеряны в хаосе после Великого Перехода, никто не может опровергнуть доказательствами и основаниями ее утверждение о том, что «я — “Император Грома”, вернувшийся из хаоса Великого Перехода». Временное Революционное Правительство Генны не руководствуется какой-то особой идеологией: оно управляется капризами Асаги Муцуки и постидеологической популистской политикой, стремящейся угодить люксембургским массам.§!"

  HEU_mutsuki_path_ending_neutrality_party_long:0 "Дом Рикухачима\n§gПосле Великого Перехода Люксембург стал единственной страной в Центральной Европе среди государств, атакованных силами Кивотоса, которой удалось сохранить свой суверенитет и территорию. Даже после переворота кабинета Асаги монархический блок еще больше укрепился, и основное течение Радикальной либеральной партии — либеральной партии — стало ярым союзником Рикухачимы Ару.§!"
  HEU_mutsuki_path_ending_generic:0 "Трехсторонняя конференция"
  HEU_mutsuki_path_ending_generic_long:0 "Трехсторонняя конференция Люксембург–Генна–Тринити\n§gОлигархическое правительство, сформированное представителями Люксембурга и академий Генны и Тринити, в соответствии с Законом о Союзе, направило делегатов для избрания премьер-министра. Пока новый премьер-министр не будет избран посредством демократического процесса, Трехсторонняя конференция де-факто является единственной политической силой с легитимностью в Германских Федеративных Княжествах.§!"
  HEU_mutsuki_path_ending_gehenna:0 "Радужная коалиция"
  HEU_mutsuki_path_ending_gehenna_long:0 "Коммунистическая партия Люксембурга – Немецкое национальное движение – Радикальная либеральная партия – Партия независимости Генны\n§gЛево-правая коалиция, известная как «Радужная коалиция», охватывает от Коммунистической партии крайне левого толка до Немецкого национального движения крайне правого толка. Из-за идеологических разногласий и столкновений интересов Люксембурга, Германии и Генны внутренние отношения в коалиции непросты. Единственная идентичность, удерживающая их вместе, — это фигура Рикухачимы Ару как символического лидера.§!"
  HEU_mutsuki_path_ending_haruka_long:0 "Коммунистическая партия Люксембурга – Немецкое национальное движение – Радикальная либеральная партия – Партия независимости Генны\n§gЛево-правая коалиция, известная как «Радужная коалиция», охватывает от Коммунистической партии крайне левого толка до Немецкого национального движения крайне правого толка. Из-за идеологических разногласий и столкновений интересов Люксембурга, Германии и Генны внутренние отношения в коалиции непросты. В частности, проблема ненависти Харуки к Генне делает нестабильным само существование Рикухачимы Ару — этой хрупкой идентичности, удерживающей их вместе, и заставляет коалицию держаться в шатком равновесии.§!"
  HEU_mutsuki_path_ending_trinity:0 "Черно-белая коалиция"
  HEU_mutsuki_path_ending_trinity_long:0 "Христианско-социальная народная партия – Общество Пандемониума – Орден Рыцарей Помощи\n§g«Черно-белая коалиция», образованная прочным союзом двух академий Тринити и Генны и объединением с Христианско-социальной народной партией, склоняющейся к христианской демократии, связана глубокой дружбой, несмотря на то, что это коалиция между двумя исторически враждебными академиями. Общество Пандемониума не преследует политической идеологии: оно ищет только частную выгоду; поэтому на практике национальную политику проводят силы, близкие к католическому консерватизму. Вместе со своей монархической склонностью в пользу Рикухачимы Ару, Черно-белая коалиция стремится реализовать идеологию социального консерватизма, отрицающую резкие изменения в обществе.§!"

  HEU_permanent_mandates_commission:0 "ПМК"
  HEU_permanent_mandates_commission_long:0 "Постоянная комиссия по мандатам Лиги Наций\n§gСозданная в 1920 году, Постоянная комиссия по мандатам Лиги Наций управляет подмандатными территориями до достижения ими независимости. Хотя оценка колонизированных стран в адрес ПМК довольно негативна, и все еще спорно, имеет ли система мандатов реальную волю сделать бывшие колонии независимыми, ПМК может быть самой справедливой альтернативой для осуществления власти в этих регионах.§!"
  gehenna_local_neutrality_puppet_party:0 "Местные националисты"
  gehenna_local_democratic_puppet_party:0 "Местное автономное правительство"

  SHA_democratic_party:0 "Торговая палата Сюаньу - Центральная фракция"
  SHA_democratic_party_long:0 "Торговая палата Сюаньу - Центральная фракция\n§gТорговая палата Сюаньу является главным центром, где сосредоточено снабжение продовольствием всего Кивотоса, и мощным купеческим консорциумом. Поддерживая активную торговлю со всем Кивотосом, она естественным образом приобрела открытый характер, и поэтому находится под постоянным наблюдением и сдерживанием со стороны Сюаньлунмэнь.\n\nВнутри Палаты центральная фракция, в отличие от радикалов, исключает насильственные средства и стремится реализовать прогрессивные идеалы путем постепенных реформ, сохраняя либеральную демократию и рыночную экономику.§!\n"
  SHA_neutrality_party:0 "Сюаньлунмэнь"
  SHA_neutrality_party_long:0 "Сюаньлунмэнь - Центральная фракция"
  SHA_communism_party:0 "Торговая палата Сюаньу - Левая"
  SHA_communism_party_long:0 "Торговая палата Сюаньу - Левая\n§gТорговая палата Сюаньу является главным центром, где сосредоточено снабжение продовольствием всего Кивотоса, и мощным купеческим консорциумом. Поддерживая активную торговлю со всем Кивотосом, она естественным образом приобрела открытый характер, и поэтому находится под постоянным наблюдением и сдерживанием со стороны Сюаньлунмэнь.\n\nЛевая Торговой палаты Сюаньу родилась из конвергенции тех, кто устал от непрерывного наблюдения и санкций со стороны Сюаньлунмэнь. Они считают, что у Сюаньлунмэнь больше нет воли к реформам и что постепенные изменения имеют пределы; поэтому они утверждают, что текущая система должна быть полностью разрушена.\n§!"
  SHA_communism_party_1: "Торговая палата Сюаньу"
  SHA_communism_party_1_long: "Торговая палата Сюаньу\n§gТорговая палата Сюаньу является главным центром, где сосредоточено снабжение продовольствием всего Кивотоса, и мощным купеческим консорциумом. Поддерживая активную торговлю со всем Кивотосом, она естественным образом приобрела открытый характер, и поэтому находится под постоянным наблюдением и сдерживанием со стороны Сюаньлунмэнь. Они считают, что у Сюаньлунмэнь больше нет воли к реформам и что постепенные изменения имеют пределы; поэтому они утверждают, что текущая система должна быть полностью разрушена.\n§!"
  SHA_communism_party_BfG: "Альянс свободных профсоюзов"
  SHA_communism_party_BfG_long: "Альянс свободных профсоюзов\n§gПосле принятия австромарксизма радикальное левое течение внутри Торговой палаты Сюаньу стремится распустить Палату и, сотрудничая с остатками Федерации свободных профсоюзов Австрии, вызвать трансформацию на этих землях. Они утверждают, что у Сюаньлунмэнь больше нет воли к реформам и что текущая система должна быть полностью разрушена путем радикального перехода к социализму.\n§!"

  SHA_fascism_party:0 "Клуб Пекинской оперы"
  SHA_fascism_party_long:0 "Клуб Пекинской оперы"

  SHA_peking_opera_blackdragon_cop:0 "Сюаньлунмэнь"
  SHA_peking_opera_blackdragon_cop_long:0 "Сюаньлунмэнь\n§gХотя номинально вся полнота власти Шанхайцзина возложена на Рюге Кисаки, настоящий центр власти — другой. Нынешний президент Клуба Пекинской оперы и теневая фигура Сюаньлунмэнь, Урушибара Кагуя, является воплощением реальной власти в Шанхайцзине.\n\nВсе восхваляют Рюге Кисаки, но она уже не более чем декоративная фигура, выполняющая приказы Урушибары Кагуи. Подлинная сила, направляющая Шанхайцзин, движется в тени: тихо, но неуклонно.§!\n"
  SHA_Peking_Opera_Club:0 "Клуб Пекинской оперы - Сюаньлунмэнь"
  SHA_Peking_Opera_Club_long:0 "Клуб Пекинской оперы - Сюаньлунмэнь\n§gВ недавней революции Клуб Пекинской оперы получил полную передачу власти от Рюге Кисаки. Кроме того, чтобы избежать административного вакуума, он полностью поглотил членов Сюаньлунмэнь, породив странную систему сотрудничества между Клубом Пекинской оперы и Сюаньлунмэнь.§!\n"
  SHA_Radical_party:0 "Радикалы Шанхайцзина"
  SHA_Radical_party_long:0 "Йонданбан - Радикалы Шанхайцзина\n§gХодили слухи, что скрытые последователи Шинтани Кай внутри Йонданбана объединили силы с некоторыми радикалами из Сюаньлунмэнь, и революция Клуба Пекинской оперы подтвердила это. Они обычно сотрудничают с Шинтани Кай и стремятся привнести новые идеи в Шанхайцзин.§!\n"
  SHA_Shintani_KAI_party:0 "Новый Йонданбан"
  SHA_Shintani_KAI_party_long:0 "Новый Йонданбан - Шинтанизм\n§gШинтанизм — новая руководящая идеология Шанхайцзина; как следует из названия, это доктрина, провозглашенная непосредственно Шинтани Кай. Небольшая группа, исследовавшая вместе с Шинтани Кай, в поисках новой руководящей идеологии, противоположной Сюаньлунмэнь, в конечном итоге придала форму шинтанизму после непрерывных исследований.\n\nЭта идеология одновременно является прогрессивным движением, отвергающим традицию, и доктриной, основанной на крайнем элитизме, требующей усиления государственного контроля через технократический акселерационизм. Шинтанизм превращает инновации и технологическое развитие в центральные принципы правления и стремится полностью реорганизовать существующий порядок.§!\n"

