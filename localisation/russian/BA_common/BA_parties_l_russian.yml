  MIL_fascism_party_long:0 "Cleaning & Clearing\n§gCleaning & Clearing, департамент обслуживания и подразделение специальных операций Научной Школы Миллениума, сыграло большую роль в Войне Миллениума с Францией после Великого Перехода. Их отличительная черта в том, что они маскируются под клуб горничных, и все их участницы сражаются в форме горничных. Хотя их миссия — быть подразделением специальных операций, выполняющим тайные операции, их истинная природа — секрет, который, по сути, всем известен; тем не менее, они стали образцом для подражания для огромного количества людей.§!\n"
