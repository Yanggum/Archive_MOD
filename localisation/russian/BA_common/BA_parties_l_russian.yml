  ABY_fascism_party_united:0 "Противники пангерманизма"
  ABY_democratic_party_czecho:0 "Национальная социальная партия"
  ABY_communism_party_czecho:0 "Коммунистическая партия"
  ABY_fascism_party_czecho:0 "Национальное фашистское сообщество"
