  ABY_democratic_party_2:0 "Национальная социал-демократическая партия"
  ABY_communism_party_2:0 "Партия федеральной интеграции"
  ABY_fascism_party_2:0 "Общество Просвещения"
  ABY_neutrality_party_2:0 "Либеральная республиканская партия"
  ABY_democratic_party_2_long:0 "Национальная социал-демократическая партия\n§gНациональная социал-демократическая партия — это широкая центристская партия, сформированная вокруг Чешской национальной социальной партии и Австрийской социал-демократической партии, возглавляемая Эдвардом Бенешем, учеником и одним из наследников Томаша Масарика. Однако, несмотря на пропаганду «широкой демократической коалиции», она продвигает связи с фашистскими партиями, такими как Отечественный фронт, что вызвало выход некоторых левых партий и породило народные подозрения, создавая различные проблемы.§!"
  ABY_communism_party_2_long:0 "Партия федеральной интеграции\n§gЭта партия была создана Таканаси Хосино, которая была представителем Кивотоса в триумвирате коалиционного правительства, после успеха операции освобождения, объединив левые силы Кивотоса и местного уровня. Обладая широкой системой благосостояния и пролетарско-крестьянской политикой, она пользуется большой поддержкой среди низших классов. Однако, защищая своеобразную идеологию — монархический социализм, она, по-видимому, с трудом получает поддержку интеллектуалов.§!"
  ABY_fascism_party_2_long:0 "Общество Просвещения\n§gТеории заговора об Обществе Просвещения, тайной организации внутри армии, существовали и раньше; но во время чистки нацистских сил внутри партии, проведенной Конрадом Генлейном, было раскрыто, что оно действительно существует. Тем не менее, из-за удаленной информации неизвестно, чего они хотят, кто их лидер и практически ничего. Единственное, что точно, — Общество Просвещения стремится свергнуть это правительство. Военная и гражданская разведка сосредоточены на их обнаружении и раскрытии их истинной природы, работая над нейтрализацией их заговора до того, как он материализуется.§!"
  ABY_neutrality_party_2_long:0 "Либеральная республиканская партия\n§gЛиберальная республиканская партия — это демократическая партия, поддерживающая невмешательство; с широкой про-предпринимательской политикой и сокращениями налога на наследство она пользуется большой популярностью среди высших классов. Существует много спекуляций о том, как партия без базы и корней смогла войти в парламент, но многие политики подозревают влияние «трех крупных конгломератов» (Nephthys, Škoda и Ротшильдов).§!"
  ABY_democratic_party_3:0 "Национальная социально-либеральная партия"
  ABY_communism_party_3:0 "Социалистический союз Абидоса"
  ABY_fascism_party_3:0 "Федеральная демократическая республиканская партия"
  ABY_neutrality_party_3:0 "Вооруженные силы"
  ABY_democratic_party_3_long:0 "Национальная социально-либеральная партия\n§gЭта широкая партия была создана путем перегруппировки того, что осталось от Национальной социал-демократической партии после попытки государственного переворота ее лидера Эдварда Бенеша. Лидер, Окусура Аянэ, говорит о любви вместо ненависти и о включении вместо исключения; она приняла партии-компоненты старой Национал-социал-демократической партии, которые раньше считались «мятежниками», и строго выступает против фашизма, стремясь сохранить демократические ценности, оставленные Масариком.§!"
  ABY_communism_party_3_long:0 "Социалистический союз Абидоса\n§gШирокая левая партия, основанная Таканаси Хосино. Хотя она носит вывеску «социалистический союз», на самом деле это огромная политическая коалиция, охватывающая от умеренных реформистов центра справа до коммунистов крайне левого толка. Поскольку сосуществует множество идеологий, внутренние дебаты интенсивны; однако под руководством Хосино и великим делом «благосостояния и равенства для всех» она остается крупнейшей политической силой федерации.§!"
  ABY_fascism_party_3_long:0 "Федеральная демократическая республиканская партия\n§gОснована Сунаоками Сироко после того, как она, возглавляя лояльных солдат и ополченцев, подавила переворот Суо. Вокруг Сироко — героини, защитившей государство — партия обеспечила абсолютное большинство мест и установила де-факто систему однопартийной диктатуры. Однако ее железное правление основано не на терроре, а на восторженной поддержке и доверии гражданства; с сокрушительным импульсом они подавили хаос и ведут федерацию.§!"
  ABY_neutrality_party_3_long:0 "Вооруженные силы\n§gФракция профессиональных военных, которые во время переворота Суо хранили молчание, не присоединяясь ни к мятежникам, ни к сопротивлению. Они решительно отвергают политическое вмешательство армии и сосредоточены исключительно на своем долге как солдат: защите территории и исполнении приказов. Независимо от ориентации правительства, они клянутся в абсолютной лояльности законно установленному правительству и во времена политических потрясений остаются непоколебимым столпом, поддерживающим федеральные силы.§!"
  ABY_democratic_party_4:0 "Орден Сехмет"
  ABY_communism_party_4:0 "§RРаспущена§!"
  ABY_fascism_party_4:0 "Истинный Кивотос - За Просвещение"
  ABY_neutrality_party_4:0 "Совет директоров Nephthys"
  ABY_democratic_party_4_long:0 "Орден Сехмет\n§gЭта партия родилась как организация сопротивления, сформированная Куроми Сэрикой, единственным членом Комитета по противодействию, которому удалось избежать плена во время переворота Асагири Суо. Те, кто даже в безвыходной ситуации не сломались и боролись за спасение своих товарищей и защиту демократии, сегодня возрождаются как политическая сила, символизирующая свободу и справедливость федерации. С боевым духом тех дней они не доверяют авторитаризму и ставят свободу граждан своей высшей ценностью.§!"
  ABY_fascism_party_4_long:0 "Истинный Кивотос - За Просвещение\n§g«Истинный Кивотос - За Просвещение» — это пан-кивотосское националистическое движение, организованное Асагири Суо. В большинстве академий Кивотоса отделения этой партии — организованные вокруг «Истинного Кивотоса - За Просвещение» — сотрясают общество и непрерывно вызывают волны пан-кивотосистского движения. Это движение обладает тоталитарным характером, а также уклоном в ультраправый популизм: оно требует абсолютной лояльности Лидеру народа Кивотоса и призывает двигаться к развитию и «раю» нации Кивотоса. Местные жители, видя лозунги вроде «жизненного пространства кивотосцев», вспоминают национал-социализм павшей Германии и испытывают страх.§!"
  ABY_communism_party_4_long:0 "§RРаспущена§!"
  ABY_neutrality_party_4_long:0 "Совет директоров Nephthys\n§gСовет директоров Nephthys является истинным органом принятия решений Группы Nephthys. После Великого Перехода и исчезновения президента, на поверхности Нономи фигурирует как следующий президент и высшая власть, но реальная власть перешла к совету. Тем не менее, влияние президента — не то, что можно игнорировать, поэтому они поддерживают баланс путем компромиссов с ней.§!"

