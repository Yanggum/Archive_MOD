  TRM_mika_unconfirmed_party:0 "§g[Не авторизовано]§!"
  TRM_mika_unconfirmed_party_long:0 "[Неавторизованная организация]\n§gКогда Мисоно Мика узурпировала власть и под ее руководством была принята новая Конституция, остальные фракции под систематическим подавлением фракции Патер либо самораспустились, либо были распущены силой. Тем не менее, есть те, кто продолжает действовать в подполье, чтобы свергнуть фракцию Патер, но даже это не более чем бесцельный выброс гнева перед реальностью.§!\n"

  TRM_nagi_nagi_democratic_party:0 "Чайная Вечеринка - Фракция Филиус"
  TRM_nagi_nagi_democratic_party_long:0 "Чайная Вечеринка - Фракция Филиус\n§gАнтипопулизм и аристократический характер фракции Филиус постепенно усилились после Великого Перехода, после их политических споров с фракцией Патер. Защита традиции, сохранение благородной веры Тринити и пан-кивотосизм — наследующий факел Эдемского Договора до Великого Перехода — являются тремя столпами, символизирующими фракцию Филиус.§!"
  TRM_nagi_nagi_neutrality_party:0 "Чайная Вечеринка - Фракция Филиус"
  TRM_nagi_nagi_neutrality_party_long:0 "Чайная Вечеринка - Фракция Филиус\n§gАнтипопулизм и аристократический характер фракции Филиус постепенно усилились после Великого Перехода, после их политических споров с фракцией Патер. Некоторые жесткие сектора имеют еще более элитарную склонность, чем умеренные силы.§!"
  TRM_nagi_nagi_fascism_party:0 "Чайная Вечеринка - Фракция Патер"
  TRM_nagi_nagi_fascism_party_long:0 "Чайная Вечеринка - Фракция Патер\n§gКак главная популистская оппозиция Тринити, фракция Патер продолжает оказывать влияние как крупнейшая оппозиция даже после своего поражения на выборах Хозяина в 1936 году. Их «тринитарный социализм», измененный и реформированный, их второе Тринити, служащее народу, остается главной угрозой для элитизма Тринити.§!"
  TRM_nagi_nagi_communism_party:0 "Коммунистическая партия Германии"
  TRM_nagi_nagi_communism_party_long:0 "Коммунистическая партия Германии\n§gМестная сила, действующая в Тринити после Великого Перехода.§!"

