  manyoshu:0 "Манъёсю"
  manyoshu_noun:0 "Манъёсю"
  manyoshu_long:0 "Манъёсю"
  manyoshu_desc:0 "Общежитие архивного типа, расположенное в глубине переулка, полного букинистических магазинов. Само общежитие превращено в огромную библиотеку, и внутри него навалены бесчисленные старые книги со стихами, песнями и историями. Кроме того, внутри здания также находится огромный букинистический магазин. Легко обмануться его роскошным видом, но студентки этого общежития — не более чем люди со свободным сердцем, наслаждающиеся поэзией, саке и хорошим вкусом."
  singican:0 "Сингикан"
  singican_noun:0 "Сингикан"
  singican_desc:0 "Одно из крупнейших общежитий в Капиле. Так как студенток много, иерархия и дисциплина обычно относительно строги. Но, как и его размер, также существует множество проблем."
  singican_long:0 "Сингикан"
  uranotsukasa:0 "Ураноцукаса"
  uranotsukasa_noun:0 "Ураноцукаса"
  uranotsukasa_desc:0 "Одно из больших общежитий с большим влиянием в Капиле. Когда-то это было специальное общежитие, готовившее онмёдзи. Сегодня оно почти исчезло с течением времени, но во многих уголках общежития все еще можно найти следы этой идентичности, накопленной за долгие годы как центра подготовки онмёдзи."
  uranotsukasa_long:0 "Ураноцукаса"
  yunowka:0 "Юноока"
  yunowka_noun:0 "Юноока"
  yunowka_desc:0 "Используется как общежитие после ремонта термального жилья, которое давно было закрыто и заброшено. Поскольку это старое деревянное здание, жильцы жалуются очень сильно; тем не менее, большая общественная баня пользуется хорошей репутацией. По слухам, где-то в общежитии спрятана невероятная ротенбуро (открытая ванна), или что-то в этом роде."
  yunowka_long:0 "Юноока"

