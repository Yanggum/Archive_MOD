  Названия партий марионеточных государств Тринити
  TRN_puppet_party_name:0 "Военно-гражданская администрация Тринити"
  TRN_puppet_party_name_long:0 "Военно-гражданская администрация Тринити"

  Если Тринити сохраняет студентку Тринити в качестве лидера, используется это название партии.
  BAUKR_fascism_party_long:0 "Организация украинских националистов (фракция Мельника)\n§gОрганизация украинских националистов, известная как ОУН, была основана в Вене и действовала в основном в регионе Галиции. Вначале ОУН расширяла свое влияние, сотрудничая с множеством мелких правых групп. Когда разразилась война между Тринити и Россией, благодаря усилиям сотрудничества под руководством Андрея Мельника было создано украинское государство, пусть и как марионетка Тринити. Однако фракция ОУН-Б, сосредоточенная вокруг Бандеры, поняла, что Тринити также не имеет искреннего интереса к независимости Украины, и начала террористические атаки. Но после подавления Оперативной группой Правосудия ОУН-Б в конце концов исчезла в тени истории.§!\n"
  BAUKR_fascism_party:0 "ОУН-М"
  BABLR_fascism_party:0 "Белорусская центральная рада"
  BABLR_fascism_party_long:0 "Белорусская центральная рада\n§gНачальник академической разведки представил предложение эффективно управлять обширным регионом Белоруссии, и в результате была создана Белорусская центральная рада с целью управления территорией. Это учреждение, созданное вокруг местного коллаборациониста Радослава Островского, мечтает о полной независимости Белоруссии, но ее будущее — не более чем тьма...§!\n"
  BASOV_fascism_party_russian: "$SOV_fascism_party_russian$\n§gКонстантин Родзаевский, лидер Всероссийской фашистской партии, был амбициозным молодым политиком. С начала своей деятельности он контактировал с белыми русскими интеллектуалами для расширения своей базы и наращивал влияние, совершая акты антиправительственного террора внутри Советского Союза. В процессе, когда Тринити завоевывала СССР и искала подходящих местных коллаборационистов, Всероссийская фашистская партия не могла не привлечь внимания. После контакта с Тринити Родзаевский был назначен лидером Священного Доминиона Востока и наконец приступил к руководству своей родиной, Россией. Не ведая, однако, что за всем этим Тринити манипулирует ими и заражает Матушку-Россию.§!\n"
  BATR2_fascism_party:0 "ФГКНИ"
  BATR2_fascism_party_long:0 "Комитет французского правительства по защите национальных интересов\n§gКогда Тринити вторглась в Миллениум, политики, намеревавшиеся восстановить Францию, собрались, опираясь на Тринити, и так родился Комитет французского правительства по защите национальных интересов. Под поддержкой Тринити они работают над защитой французских граждан и сохранением их наследия, а также других национальных интересов; но на самом деле, будучи не в состоянии ослушаться приказов Тринити, они рассматриваются как полу-марионеточное правительство. Кроме того, поскольку север Франции находится под прямым управлением Тринити, реальное влияние Комитета ограничено только югом.§!\n"

