  MIKA_FASCISM_SHORT:0 "Чайная Вечеринка"
  MIKA_FASCISM_LONG:0 "Чайная Вечеринка - Фракция Патер\n§gПосле Первого Собора фракция Патер утратила свой милитаристский оттенок и выродилась в группу консерватизма, элитизма и авторитаризма, сохранявшую больше внешность, чем суть. Однако Инцидент Великого Перехода и историческая особенность Тринити переплелись, и фракция Патер вернулась к своей форме до того Первого Собора.\nЭта трансформация не была простой случайностью, а продолжением цели, которую имела первая лидер фракции Патер. Нынешний лидер, Мисоно Мика, также наследует это русло и питает твердую волю построить великое и справедливое Тринити.\n«Тринити спасет себя само»§!\n"
