  COU_democratic_party:0 "Главное бюро"
  COU_democratic_party_long:0 "Главное бюро\n§gГлавное бюро — это департамент, осуществляющий надзор и координацию Генерального Студенческого Совета, и его Главный Администратор выполняет роль директора. Другими словами, Главное бюро — это само сердце Административного Комитета.§!"
  COU_communism_party:0 "Административный Комитет"
  COU_communism_party_long:0 "Транспортное бюро\n§gТранспортное бюро играет ключевую роль в хаотичном трафике Кивотоса. Его основная работа — управлять всевозможными мелкими инцидентами: от частых ограблений инкассаторских машин, терактов в поездах и прочих разнообразных происшествий.§!"
  COU_fascism_party:0 "Административный Комитет"
  COU_fascism_party_long:0 "Оборонное бюро\n§gОборонное бюро — незаменимый департамент для обороны Кивотоса. Его основная работа — поддерживать порядок и общественную безопасность в обществе, где индивидуальное владение огнестрельным оружием и тяжелым вооружением считается нормальным.§!"
  COU_neutrality_party:0 "Административный Комитет"
  COU_neutrality_party_long:0 "Финансовое бюро\n§gФинансовое бюро — это департамент, который на основе точного налогового учета и строгого финансового управления устанавливает и распределяет бюджет Генерального Студенческого Совета, не позволяя ни одному департаменту действовать самостоятельно и «как вздумается».§!"

