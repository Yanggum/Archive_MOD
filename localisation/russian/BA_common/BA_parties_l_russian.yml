l_russian:
  #Идеологии#

  aicontrol:0 "Контроль ИИ"
  aicontrol_desc:0 "Высокоразвитый искусственный интеллект контролирует всю страну. Вся государственная политика определяется в соответствии с автономным суждением и принятием решений ИИ."
  fascism_aicontrol:0 "Контроль ИИ"
  fascism_aicontrol_desc:0 "Высокоразвитый искусственный интеллект контролирует всю страну. Вся государственная политика определяется в соответствии с автономным суждением и принятием решений ИИ."
  tea_party_fascism_ideology:0 "Фракция Патер"
  tea_party_fascism_ideology_desc:0 "Милитаризм фракции Патер и ее абсолютная преданность своему лидеру берут начало в конфликтах Тринити тысячелетней давности, подобно тому, как фашизм зародился на Земле. Позже, после «консенсуса» Первого Великого Собрания, на котором фракции Тринити объединились в одну, с исчезновением конфликтов блеск фракции Патер постепенно угас, и она слилась воедино вместе с крестом."
  pater_nazism:0 "Тринитарный социализм"
  pater_nazism_desc:0 "Тринитарный социализм — это собственная идеология Тринити, рожденная в меняющемся мире. Эта идеология носит правый и ультранационалистический характер, и ее последователи часто пытаются мобилизовать силу масс для достижения радикальных целей. Они презирают традиционную демократию и иногда используют народное презрение к старому порядку. Во многих случаях они прибегают к эклектическим вдохновениям для решения основных проблем общества."
  tea_party_neutrality_ideology:0 "Фракция Филиус"
  tea_party_neutrality_ideology_desc:0 "Фракция Филиус традиционно является силой, которая возглавляла Чайную Вечеринку и вела Тринити. Обычно они продвигают мирные методы, но в прошлом, в процессе объединения Тринити, они также способствовали различным актам насилия; это люди, которые ради Тринити не колебались бы прибегнуть и к крайним действиям."
  emergency_military_government:0 "Чрезвычайное военное правительство"
  emergency_military_government_desc:0 "Для преодоления чрезвычайной ситуации военное командование напрямую вмешивается в управление страной."
  The_Colour_democratic:0 "§0Цвет§! - §1Вторженцы из иного измерения§!"
  The_Colour_democratic_desc:0 "§0Колоссальная сила атакует планету.§!\n\n§1Эта неизвестная сила разъедает мир и обладает силой деформировать все, с чем вступает в контакт, искажая это в нечто иное, чем прежде. Кажется, конец мира приближается.§!"
  The_Colour_communism:0 "§0Цвет§! - §1Вторженцы из иного измерения§!"
  The_Colour_communism_desc:0 "§0Колоссальная сила атакует планету.§!\n\n§1Эта неизвестная сила разъедает мир и обладает силой деформировать все, с чем вступает в контакт, искажая это в нечто иное, чем прежде. Кажется, конец мира приближается.§!"
  The_Colour_fascism:0 "§0Цвет§! - §1Вторженцы из иного измерения§!"
  The_Colour_fascism_desc:0 "§0Колоссальная сила атакует планету.§!\n\n§1Эта неизвестная сила разъедает мир и обладает силой деформировать все, с чем вступает в контакт, искажая это в нечто иное, чем прежде. Кажется, конец мира приближается.§!"
  The_Colour_neutrality:0 "§0Цвет§! - §1Вторженцы из иного измерения§!"
  The_Colour_neutrality_desc:0 "§0Колоссальная сила атакует планету.§!\n\n§1Эта неизвестная сила разъедает мир и обладает силой деформировать все, с чем вступает в контакт, искажая это в нечто иное, чем прежде. Кажется, конец мира приближается.§!"
  technocracy:0 "Технократия"
  technocracy_desc:0 "Технократия — это система, в которой технократы с научными, техническими знаниями и специализацией управляют обществом. Обычно правительство осуществляется как олигархия через комитет, состоящий из технократов."
  technocracy_communism:0 "Технократический коммунизм"
  technocracy_communism_desc:0 "Как форма технократии, технократический коммунизм — это система, в которой технократы с научными, техническими знаниями и специализацией управляют социалистической экономикой."
  technocracy_fascism:0 "Технократическая политика порядка"
  technocracy_fascism_desc:0 "Для координации отношений между кивотосцами и местными жителями и реализации «порядка, предшествовавшего Великому Переходу», необходимо «управление публичной властью» со стороны сильной, авторитарной и закрытой группы. Для этого мы будем широко расширять укрепление судебной власти и секретность правительства."
  artnocracy:0 "Артнократия"
  artnocracy_desc:0 "Артнократия — это разновидность, похожая по системе на технократию, хотя преследует иные ценности: режим, в котором артнократы с художественной чувствительностью и специализацией управляют обществом. Обычно правительство осуществляется как олигархия через комитет, состоящий из артнократов."
  artnocracy_fascism:0 "Артнократическая политика порядка"
  artnocracy_fascism_desc:0 "Для координации отношений между кивотосцами и местными жителями и реализации «порядка, предшествовавшего Великому Переходу», необходимо «управление публичной властью» со стороны сильной, авторитарной и закрытой группы. Для этого мы будем широко расширять укрепление судебной власти и секретность правительства."
  fascism_hitler:0 "Национал-социалистическая немецкая рабочая партия"
  fascism_hitler_desc:0 "§RОн вернулся!§!\n\nПо какой-то причине исчезнувший Верховный фюрер Адольф Гитлер был найден в Ирландии. Неизвестно, как Гитлер, который исчез, смог вернуться, но сейчас время следовать за ним.\n\nХайль Гитлер!"
  tea_party_ideology:0 "Триумвират Тринити"
  tea_party_ideology_desc:0 "Эта уникальная система правления Тринити, принимающая форму олигархии по согласию, строится через борьбу и завоевание политической власти. Осуществление власти производится через Чайную Вечеринку, где лидеры трех фракций §gПатер§!, §HFилиус§! и §GСанктус§! по очереди исполняют роль хозяина. Эта система специализируется на искажении мнений студентов и масс и на распространении фракционного мышления."
  hardboiled_noir:0 "Рикухачимаизм"
  hardboiled_noir_desc:0 "Рикухачимаизм — это панэтнонационалистическая идеология Кивотоса, утверждающая, что пока существует местная культура, взаимное сосуществование между местными жителями и кивотосцами невозможно; и что для гармонии между кивотосцами и местными жителями необходимы полное искоренение местной человеческой культуры, сильный государственный атеизм и единство кивотосцев.\n\nВ отличие от других регионов, таких как Германия, Франция или Северная Европа, где во время «Великого Перехода» произошел крах существующего порядка, Люксембург сохранил свою территорию и удержал нетронутыми партийные системы, культуру и религию местных жителей. Поэтому Люксембург остался редким примером страны, пытавшейся сосуществовать с кивотосцами, сохраняя социальное положение местных жителей.\n\nОднако местная правая партия Люксембурга смотрела на академии Кивотоса, состоящие из девушек, как на «низших», и как местные последователи нацистов, так и католические силы также отвергали кивотосцев. Идеал Ару, продвигавший равноправное сосуществование кивотосцев и местных жителей, был растоптан и использован местными политическими силами; и Ару, потеряв всякую надежду на человечество, пришла к убеждению, что только полный демонтаж местной культуры может защитить кивотосцев.\n\nНезависимо от панэтнонационализма рикухачимаизма, структура власти Агентства 68 основана на личной диктатуре, сосредоточенной на Рикухачиме Ару."
  monarchist_socialism:0 "Монархический социализм"
  monarchist_socialism_desc:0 "Социалистическое государство и монархия обычно не сочетаются, но исторически, в результате различных компромиссов, обсуждалось и даже достигалось сосуществование социализма и монархии. Первый случай — когда относительно слабые коммунисты по сравнению с монархистами по компромиссу соглашаются терпеть монархию даже после коммунизации. Типичный пример — Монголия, где после коммунизации 1921 года Богд-хан сохранял власть до 1924 года.\n\nНапротив, монархический социализм также может быть компромиссом, который монархисты предлагают коммунистам для восстановления монархии при сильной коммунистической системе. Советское монархическое движение Младороссы предложило альтернативу, при которой коммунистическая система Советского Союза сохранялась, но царь становился символом Союза.\n\nНаконец, существует случай, когда сам марксизм, неоднократно реформируясь, становится достаточно умеренным, чтобы допускать монархию. Типичный пример — скандинавская модель социал-демократии, созданная путем компромисса между капиталистами и социалистами после Сальтшёбаденского соглашения."
  monarchist_socialism_democratic:0 "Монархический социализм"
  monarchist_socialism_democratic_desc:0 "Социалистическое государство и монархия обычно не сочетаются, но исторически, в результате различных компромиссов, обсуждалось и даже достигалось сосуществование социализма и монархии. Первый случай — когда относительно слабые коммунисты по сравнению с монархистами по компромиссу соглашаются терпеть монархию даже после коммунизации. Типичный пример — Монголия, где после коммунизации 1921 года Богд-хан сохранял власть до 1924 года.\n\nНапротив, монархический социализм также может быть компромиссом, который монархисты предлагают коммунистам для восстановления монархии при сильной коммунистической системе. Советское монархическое движение Младороссы предложило альтернативу, при которой коммунистическая система Советского Союза сохранялась, но царь становился символом Союза.\n\nНаконец, существует случай, когда сам марксизм, неоднократно реформируясь, становится достаточно умеренным, чтобы допускать монархию. Типичный пример — скандинавская модель социал-демократии, созданная путем компромисса между капиталистами и социалистами после Сальтшёбаденского соглашения."
  plutocracy_ideology:0 "Плутократия"
  plutocracy_ideology_desc:0 "Плутократия — это политическая система, в которой доминирует экономическая власть богатого класса или слоя."
  syndicalism:0 "Синдикализм"
  syndicalism_desc:0 "Синдикализм требует автономного управления профсоюзами и для его достижения защищает прямое действие рабочих. Поскольку он состоит в основном из рабочих низового уровня, это одно из самых активных социалистических течений."
  war_communism:0 "Военный коммунизм / Левое военное правительство"
  war_communism_desc:0 "Военный коммунизм и левое военное правительство — это системы, в которых при авторитарной мобилизации государство осуществляет контроль над политикой, промышленностью, а иногда и над повседневной жизнью в целом.\n\nВоенный коммунизм — это экономико-политический режим, принимаемый правительством или организацией, объявляющей себя коммунистической, для беспрепятственного ведения войны. Самый типичный пример — правительство большевиков во время Гражданской войны в России в 1918–1921 годах; конкретно применялись насильственная национализация, исключение рынка, продразверстка и система нормирования товаров первой необходимости.\n\nЛевое военное правительство относится к системе, в которой военная фракция коммунистической направленности захватывает власть в государстве путем государственного переворота, или в которой военное командование коммунистов управляет оккупированными территориями. Обычно оно отличается от гражданских социалистических правительств ярко выраженным военным характером."
  scandinavian_social_democracy:0 "Социал-демократия"
  scandinavian_social_democracy_desc:0 "Скандинавская социал-демократия относится к идеологической трансформации — или ко всему процессу в целом — посредством которой социал-демократические партии Швеции, Норвегии и Дании, в отличие от других социал-демократических партий межвоенного периода, постепенно сокращают разрыв между требованиями масс и ревизионистским марксизмом после революционной и радикальной подрывной деятельности системы, неуклонно, но решительно склоняясь влево."
  Cohabitism:0 "Когабитизм"
  Cohabitism_desc:0 "Когабитизм — это демократическая идеология, которая объединяет кивотосцев и европейцев в рамках единого политического сообщества, определяя видовую идентичность как первичную ось, а национальную идентичность как вторичную ось. Ее центральный принцип — гарантировать всем членам равные юридические и социальные возможности. Политическая система стремится к централизованной демократии, но принимает структуру, допускающую сдержки и противовесы при распределении полномочий президента и парламента схожим образом. Она разделяет сходство с акцентом на гражданское равенство гражданского национализма, но отличается тем, что исходит из субстантивного разделения: «сосуществование двух видов», а не «общее гражданство».\n\nВ конечном счете, государство утверждает, что оно должно смягчать национальные различия и подчеркивать общую идентичность на видовом уровне, заявляя, что только сосуществование разных видов сохраняет социальную стабильность и национальную идентичность. Для этого центральное правительство использует сильные инструменты контроля, такие как интегративное образование, политика общего языка и интеграция государственных учреждений. Однако могут возникать побочные эффекты, такие как культурное и языковое размывание, утрата традиций меньшинств и неравномерное развитие между регионами; для компенсации одновременно применяются институциональные механизмы, такие как федеральное распределение полномочий и система множественных столиц, обеспечивающие региональное представительство и баланс развития.\n\nВ качестве практических механизмов это включает формирование общего политического пространства через всеобщее благосостояние, государственное образование и языковую политику; программы обмена и взаимного признания между видами; ограниченную гарантию региональной автономии и концентрацию центральных полномочий в сферах безопасности и дипломатии. Вкратце, когабитизм — это «демократическая идеология, предназначенная для того, чтобы различные группы непрерывно сосуществовали в рамках одного государства, признавая вид в качестве базовой единицы, но гарантируя равные возможности и сильную интеграционную способность центра»."
  Civil_nationalism:0 "Гражданский национализм"
  Civil_nationalism_desc:0 "Гражданский национализм (гражданский национализм) — это идеология, которая основывает национальную сплоченность не на крови или языковой/культурной однородности, а на гражданстве как политическом сообществе, конституции, равенстве перед законом и общих политических процедурах. Она считает, что чувство принадлежности членов государства проистекает не из происхождения, а из «желания жить вместе» и лояльности государственным институтам; и понимает государство как добровольный союз суверенных граждан.\n\nЕго интеллектуальные корни находятся в эпохе Просвещения и в политических дискуссиях американской и французской революций. В частности, Эрнест Ренан выразил идею, что «нация — это ежедневный плебисцит» (или ежедневное согласие), представляя волю народа как ядро сплоченности. Поэтому гражданский национализм стремится формировать и поддерживать национальную идентичность посредством правовых и политических процедур и гражданских добродетелей (гражданское образование, общественные дебаты, всеобщее избирательное право и т. д.).\n\nВ контексте XIX века гражданский национализм противопоставлялся романтическому или органическому национализму (например, гердеровским дискурсам, сосредоточенным на крови и культуре). В то время как последний видел нацию как естественную и историческую непрерывность, гражданская перспектива подчеркивает политический выбор и принятие норм через национальность и гражданство. На практике она имела сильную тенденцию интегрировать группы различного происхождения в единое политическое сообщество посредством конституции, верховенства закона и инклюзивной политики (расширение гражданства, государственное образование и т. д.)."
  culturlic_Integralism:0 "Демократический социализм"
  culturlic_Integralism_desc:0 "Демократический социализм — это политическое и интеллектуальное течение, сформировавшееся в конце XIX века путем сочетания утопического социализма, традиции чартизма и постепенного, парламентского социализма. Эта идеология стремится реализовать социальное и экономическое равенство посредством демократических процедур и государственных институтов, с целью общественного управления средствами производства, расширения общественного сектора и обширной политики благосостояния. Вместо того чтобы неуклонно следовать традиционной марксистской линии немедленного революционного свержения, она принимает постепенный путь, смягчающий и преобразующий противоречия капитализма посредством выборов, парламента, профсоюзов и законодательных реформ.\n\nВ его интеллектуальном ядре выделяется влияние ревизионизма (Эдуард Бернштейн), утверждавшего, что можно приблизиться к социалистическим целям путем реформ через профсоюзы и партии. Британское фабианское течение подчеркивало постепенное преобразование общества через институты и политику. Напротив, революционные левые, такие как Роза Люксембург, резко критиковали градуализм, и существовали интенсивные внутренние и межфракционные дебаты.\n\nВ политической и экономической практике она исходила из политической демократии — всеобщего избирательного права, многопартийности — но придавала важность расширению государственного сектора, укреплению трудовых прав и социальному контролю и демократическому управлению экономикой (например, кооперативное управление). Она не считала полную национализацию промышленности и финансов непременным условием и была склонна организовывать экономику демократическим путем через регулирование, общественную собственность и модели солидарного управления."
  culturlic_Integralism_com:0 "Демократический социализм"
  culturlic_Integralism_com_desc:0 "Демократический социализм — это политическое и интеллектуальное течение, сформировавшееся в конце XIX века путем сочетания утопического социализма, традиции чартизма и постепенного, парламентского социализма. Эта идеология стремится реализовать социальное и экономическое равенство посредством демократических процедур и государственных институтов, с целью общественного управления средствами производства, расширения общественного сектора и обширной политики благосостояния. Вместо того чтобы неуклонно следовать традиционной марксистской линии немедленного революционного свержения, она принимает постепенный путь, смягчающий и преобразующий противоречия капитализма посредством выборов, парламента, профсоюзов и законодательных реформ.\n\nВ его интеллектуальном ядре выделяется влияние ревизионизма (Эдуард Бернштейн), утверждавшего, что можно приблизиться к социалистическим целям путем реформ через профсоюзы и партии. Британское фабианское течение подчеркивало постепенное преобразование общества через институты и политику. Напротив, революционные левые, такие как Роза Люксембург, резко критиковали градуализм, и существовали интенсивные внутренние и межфракционные дебаты.\n\nВ политической и экономической практике она исходила из политической демократии — всеобщего избирательного права, многопартийности — но придавала важность расширению государственного сектора, укреплению трудовых прав и социальному контролю и демократическому управлению экономикой (например, кооперативное управление). Она не считала полную национализацию промышленности и финансов непременным условием и была склонна организовывать экономику демократическим путем через регулирование, общественную собственность и модели солидарного управления."
  ABYDOS_democracy:0 "Демократический централизм Абидоса"
  ABYDOS_democracy_desc:0 "Демократический централизм Абидоса — это система, традиционно унаследованная в Абидосе, которая стремится сочетать свободные внутренние дебаты (демократию) с единым исполнением решенного (централизмом). Она укрепилась, подчеркивая согласованность между дебатами и действиями внутри студенческого совета и института, и впоследствии была принята как центральный организационный принцип Шематы и различных режимов Абидоса.\n\nВ частности, внутри студенческого совета допускаются активные дебаты и критика; но как только решение принято, все студенты должны следовать ему и, вовне, действовать единым фронтом. Нижестоящие организации обязаны выполнять решения вышестоящих, и предусмотрено, что мнения меньшинства могут высказываться внутри школы, но не должны препятствовать решенному действию.\n\nИз-за особенности Абидоса, за пределами центра допускается широкая местная автономия, но центральная власть сосредоточена в основном в одном лице. Реформированный демократический централизм Абидоса определяет школу как государство, а студенческий совет как парламент, и позволяет даже не-студентам из местных жителей иметь значимый голос; однако, если сохраняются подавление меньшинств и исключение фракций, это таит в себе высокую вероятность эволюции в фактическую диктатуру одного лица."
  Self_Reliance:0 "Государственный иллюстрационизм"
  Self_Reliance_desc:0 "Государственный иллюстрационизм — это идеология, основанная на национализме Кивотоса, утверждающая, что высшие кивотосцы обязаны «кивотосизировать» Европу. В этой идеологии считается, что кивотосцы внутренне превосходят местных жителей, и что они должны расширять свою культуру и строить единое общество. В центре государственного иллюстрационизма находится лидер, который одновременно является «путеводителем», «пророком» и «просветителем». Этот лидер считается тем, кто приведет Кивотос к славе во времена кризиса, и от него требуется фанатичное следование, близкое к вере.\n\nЭта доктрина решительно поддерживает объединение Кивотоса, утверждая, что «Великий Переход» был божественным откровением и представляет собой послание Бога, повелевающее доминировать над местными жителями и двигаться вперед как правителям нового мира. В этом смысле государственный иллюстрационизм обладает одновременно социалистическими элементами, подчеркивающими полное равенство между кивотосцами, и империалистическим аспектом, рассматривающим местных жителей как объект доминирования. Кроме того, он принимает систему личной диктатуры, в которой вся власть сосредоточена в лидере, стремясь сильно контролировать всю страну посредством централизованного правительства.\n\nСледовательно, государственный иллюстрационизм предстает как смесь всевозможных идей. Долг объединения и экспансии, основанный на превосходстве народа Кивотоса, и требование абсолютного доверия и лояльности к лидеру в этом процессе приобретают характер простых лозунгов, которые легко доходят до масс. Таким образом, этот государственный иллюстрационизм, где смешиваются различные идеологические элементы, передает широкое политическое и социальное послание и, однажды распространившись, имеет тенденцию сильно распространяться, почти как религия."
  Government_Federalism:0 "Правительственный федерализм"
  Government_Federalism_desc:0 "Правительственный федерализм, в двух словах, — это форма, при которой два или более правительства с полностью одинаковыми институтами внутри одной страны интегрируются в одно.\nНа первый взгляд это может показаться институтом, но эта идея не является жесткой доктриной, применимой при любых обстоятельствах, а гибко меняется в зависимости от ситуации, стремясь к наиболее оптимальной форме.\n\nКаждое правительство сотрудничает в рамках унитарного государства, двигаясь так, словно они фракции.\nЭта система может напоминать партийную политику или модель Соединенных Штатов, но в этой системе при каждом правительстве могут существовать партии, и она функционирует строго как единое унитарное государство, а не как автономный округ, государственная федерация или конфедерация.\nОднако что касается главы государства, представляющего правительство или страну, он избирается от каждого правительства и формирует общее собрание.\nАдминистративные различия регионов, где расположено каждое правительство, а также существовавшие ранее этнические и культурные различия не различаются законом, и правила устанавливаются как высшая форма мандата для определения этих различий.\nКроме того, автономные округа и места не отделяются как административные единицы.\n\nКак политическая мысль, она имеет много пробелов и, в целом, является экспериментальной идеей, но неоспоримый факт заключается в том, что она действительна только в странах с очень небольшой территорией."
  satsukiism:0 "Правление Сацуки"
  satsukiism_desc:0 "Правление Сацуки относится к режиму высокоразвитой психологической инженерии, возглавляемому не традиционной идеологией и не массовым движением, а самой Когёку Сацуки, директором по разведке Пандемониума. «Проект NK Ultra», составляющий основу этой системы, выходит за рамки простой пропаганды: он использует все информационные сети и средства массовой информации государства для вмешательства в сам процесс мышления масс и направления конкретных выводов как будто бы это было «естественным консенсусом».\n\nПоэтому общество при правлении Сацуки представляет странную двойственность. Поскольку важнейшие государственные вопросы решаются по воле Сацуки, оно напоминает идеальную абсолютную монархию; но граждане не чувствуют угнетения или принуждения и верят, что присоединяются к общественной гармонии по собственному суждению. Дебаты и конфликты считаются ненужной неэффективностью и исчезают, и общество движется стабильно и гармонично, как будто оно огромный организм.\n\nПоэтому в «правлении Сацуки» нет восторженных сторонников или идеологических товарищей. Существуют только «граждане», выполняющие отведенную роль в тихом и стабильном порядке. В конечном счете, это воплощает беспрецедентно антиутопическое общество: чрезвычайно стабильное, но идеально контролируемое, где свободная воля индивида полностью подчинена спроектированному порядку."
  satsukiism_B_1_1:0 "Конкордантная демократия"
  satsukiism_B_1_1_desc:0 "Конкордантная демократия — это уникальная политическая идеология, которая возродилась путем самоотрицания системы одностороннего ментального контроля Когёку Сацуки. Переломный момент этой системы наступил, когда сама президент Сацуки признала бесчеловечность Проекта NK Ultra, официально извинилась перед бывшими силами противника и объявила о завершении проекта.\n\nУдивительно, но даже оппозиция прошлого терпела это темное наследие. Сформировалось общее восприятие, что без того принудительного объединения нельзя было бы избежать разрушительной гражданской войны и этнических конфликтов. В условиях этого странного социального консенсуса пропагандистские технологии и технологии психологического внушения, оставленные NK Ultra, не были отброшены, а получили новое назначение.\n\nТеперь эти технологии используются ограниченно как инструмент «гармонизации», предназначенный для улаживания конфликтов между этносами и направления общественного консенсуса, вместо навязывания воли единоличного лидера. Государство больше не контролирует индивидуальные мысли, но мягко направляет из невидимого, чтобы все общество двигалось к общей цели «конкордии».\n\nСледовательно, конкордантная демократия внешне уважает плюрализм и демократические процедуры, но в своей основе действует сильная воля предотвращать радикальные конфликты общества в корне. Это новая форма демократии, стремящаяся к миру не в полной свободе, а в «управляемой конкордии»."
  satsukiism_B_1_2:0 "Демократия по-сацукийски"
  satsukiism_B_1_2_desc:0 "Правление Сацуки относится к режиму высокоразвитой психологической инженерии, возглавляемому не традиционной идеологией и не массовым движением, а самой Когёку Сацуки, директором по разведке Пандемониума.\n\nДемократия по-сацукийски, которую она в настоящее время предлагает, представляет собой диктаторскую систему, носящую маску развитой демократии, завершенную путем еще более тонкого использования массовой психологии. На поверхности она, кажется, уважает здоровую политическую конкуренцию и демократические процедуры через двухпартийную систему, представляющую соответственно Генну и Германию.\n\nНо в основе существует теневая политика, которая через усиленный «Проект NK Ultra» полностью контролирует даже руководство и ключевые повестки оппозиционной партии. Жаркие парламентские дебаты и столкновения между партиями — не более чем грандиозное театральное представление, поставленное по сценарию президента Сацуки.\n\nНарод верит, что участвует в политике по свободной воле, и в итоге почитает Сацуки как «великого лидера», который «разрешает» эти искусственно созданные конфликты и объединяет нацию. Этот процесс прививает сильное чувство принадлежности и политической эффективности, но в конечном итоге все варианты движутся только в рамках намерений Сацуки.\n\nСледовательно, это самая стабильная и совершенная антиутопия: даже конфликт используется как идеальный инструмент контроля. Народ верит, что поддерживает лидера и любит родину по собственной воле, но с самого начала существовал только один вариант."
  satsukiism_B_2_1:0 "Олигархия занавеса"
  satsukiism_B_2_1_desc:0 "Олигархия занавеса — это форма, в которой философия правления Когёку Сацуки перерастает личное господство и становится самой системой. При этом режиме государство управляется уникальной тайной организацией, знающей правду об NK Ultra, и Сацуки отступает как абсолютный авторитет, чтобы стать символической точкой объединения коллективного руководства.\n\nНа поверхности внутри организации существуют различные фракции, и политика определяется путем демократических дебатов и консенсуса. Однако вне всего этого процесса существует «занавес». Технология «NK Ultra», которая раньше контролировала отдельные умы, теперь, под именем партии, возродилась как великое устройство гармонизации, индуцирующее сосуществование всего общества.\n\nЭта технология не навязывает конкретное мнение. Вместо этого она мягко размывает радикальные идеи, порождающие конфликт, и направляет все дебаты к завершению во имя великой цели социальной интеграции. Народ верит, что в полной свободе мысли достигает самых идеальных выводов, и испытывает удовлетворение от совершенного социального консенсуса, возникающего в процессе.\n\nВ результате олигархия занавеса реализует самую идеальную форму интегрированного государства. Общество, где все добровольно гармонизируются не из-за принуждения или диктатуры, а под невидимой «доброй волей». Это самая мирная утопия и, в то же время, самая тщательно спроектированная."
  satsukiism_B_2_2:0 "Мысль"
  satsukiism_B_2_2_desc:0 "Это финальная стадия и самая совершенная форма правления Сацуки. Государство — это уже не совокупность разнообразных индивидов, а только расширенное «я» единственного лидера: Когёку Сацуки. Ее воля — закон и истина, а ее мысль — единственная идеология всей нации.\n\nВсе функции общества идеально контролируются четырьмя департаментами с парадоксальными названиями: Департамент Истины, Департамент Мира, Департамент Любви и Департамент Изобилия. Департамент Истины разграничивает прошлое; Департамент Мира управляет внутренними и внешними врагами ради вечной стабильности; Департамент Любви внушает абсолютную лояльность; а Департамент Изобилия распределяет все ресурсы наиболее «эффективным» образом.\n\nВ этой системе «Проект NK Ultra» — уже не просто техника промывания мозгов. Это инструмент манипуляции реальностью, который перенастраивает сознание народа и заходит так далеко, что заставляет исчезнуть само понятие таких слов, как «свобода» или «измена». Индивид исчез, и остались только части, существующие для партии и лидера. Здесь нет конфликта, нет сомнений, нет боли. Только совершенный порядок и послушание, и пустой мир, рожденный из этого, будут продолжаться вечно."
  satsukiism_C_1:0 "Правление гипнотического студенческого совета"
  satsukiism_C_1_desc:0 "Правление гипнотического студенческого совета — это уникальная социально-политическая система, превращающая «Академию Психологии Генны» в идеальную академию. Для большинства студентов школа кажется миром из легкого романа. Без серьезных конфликтов и споров, все движутся к своим мечтам, и продолжается повседневная школьная жизнь, почти совершенная, со счастливым концом.\n\nСекрет этой идеальной гармонии кроется в базовых техниках психологического внушения, которым обучаются все студенты. Благодаря этому они заботятся друг о друге и понимают друг друга, а разрушительные конфликты естественным образом растворяются.\n\nНо истинное ядро системы — это «рост и пробуждение». Посредством продвинутого курса выдающиеся студенты проникают в суть психологической структуры, поддерживающей это общество, и, наконец, могут самостоятельно «выпуститься» из ментальных ограничений. Только меньшинство элит, которые полностью понимают себя и достигают истины системы, получают право войти в высший орган принятия решений государства: «Студенческий Совет».\n\nСледовательно, это место одновременно и идеальная академия, где большинство живет счастливой школьной жизнью, и мир, где немногие пробужденные работают для защиты этого счастья. Студенческий Совет не угнетает массы. Он просто мягко «защищает», в мире, тех, кто еще не пробудился."
  pandemonium:0 "Пандемониум Генны"
  pandemonium_desc:0 "Политика Общества Пандемониума очень своеобразна. Политическая система, рожденная из низкого политического участия студентов, затрудняет даже различение, являются ли они на самом деле студенческим советом или просто группой, которая себя таковой провозглашает. Единственным доказательством их власти является сертификат, выданный Генеральным Студенческим Советом Кивотоса."
  neopandemonium:0 "Реформированный Пандемониум"
  neopandemonium_desc:0 "Это студенческий совет Генны, реформированный из старой политической системы Пандемониума, которая возникла из-за низкого политического участия студентов, и теперь функционирующий нормально. Это политическая идеология, опирающаяся на характерные физические черты, такие как рога, свойственные «студентам Генны», и на различные националистические чувства, вытекающие из этого."
  makotoism_A1:0 "Государственный корпоративизм"
  makotoism_A1_desc:0 "Государственный корпоративизм — это тоталитарная идеология, основанная на крайнем национализме. Эта мысль стремится положить конец всем внутренним конфликтам, организуя всех членов общества — рабочих, капиталистов, крестьян и т. д. — в их соответствующие «корпорации», контролируемые государством. Устраняя «антигосударственные» элементы, такие как классовая борьба или политическое противостояние, режим мобилизует все возможности страны для достижения «великой цели», представленной абсолютным лидером, называемым «Фюрером».\n\nГосударственный корпоративизм проявляет сходство с существующим национал-социализмом во многих аспектах, но обладает решающим отличием: он определяет критерий нации не по «крови», а по «абсолютной лояльности Фюреру и государству». Этим текущий режим обеспечивает предлог для подрыва и поглощения базы поддержки старой нацистской партии и, в то же время, для включения в систему гетерогенного элемента происхождения из Генны. Другими словами, он провозглашается «новой, компетентной» альтернативой, заменяющей старый, провалившийся нацизм.\n\nЭта система поддерживается сильной пропагандой, укрепляющей культ личности лидера, и безжалостным подавлением всех оппозиционных сил. В конечном счете, государственный корпоративизм преследует, помимо внутренней интеграции, «агрессивный экспансионизм». Мобилизовать все ресурсы единого государства, чтобы в конечном итоге завоевать мир — вот конечная цель этой идеологии."
  makotoism_B:0 "Мировой гегемонистский национализм"
  makotoism_B_desc:0 "Мировой гегемонистский национализм — это радикальная ультранационалистическая идеология, основанная на священном пакте между германцами и геннанцами, называемыми двумя «избранными народами».\n\nПоследователи этой доктрины интерпретируют «Великий Переход» не как простую случайность, а как священное откровение: что «северный народ», наследник северных мифов, и «народ Генны», рожденный из долины Хинном, должны встретиться, чтобы править миром. Они верят, что эти два «народа богов» родились с судьбой доминировать над всеми остальными низшими народами.\n\nПолитически это проявляется как режим совместного правления двух доминирующих народов, и лидер наследует одновременно мифы германского Севера и геннанского Хиннома, обеспечивая легитимность господства, выходящую за пределы крови.\n\nВ конечном счете, эта идеология под знаменем новой доминирующей цивилизации, называемой «Норд-Хинном», ставит конечной целью сначала объединение разделенного Кивотоса, а затем бесконечную экспансию, превращающую всю Европу в их жизненное пространство."
  makotoism_B1:0 "Мировой народный корпоративизм"
  makotoism_B1_desc:0 "Мировой народный корпоративизм — это прагматичная авторитарная идеология, которая после изгнания непредсказуемого личного правления Ханумы Макото переустанавливает существующий миф о «союзе богов» как основу государственного контроля.\n\nЭта доктрина больше не использует «священный пакт» между германцами и геннанцами как инструмент для капризного предприятия лидера, а как постоянный источник легитимности, поддерживающий государство.\n\nПод знаменем «народного корпоративизма» оба народа организуются в корпорации в соответствии с их «ролью» и «вкладом» в государство, а не по крови или идеологии. Партии, предприятия и трудовые организации структурируются так, чтобы служить, под единым государственным руководством, единой цели: «национальной стабильности».\n\nНа поверхности реформы продвигаются через парламент, но это не более чем строго контролируемая «управляемая демократия». Реальная власть абсолютно сконцентрирована в новой дирекции, которая подавляет все оппозиционные силы во имя дела «предотвращения возврата хаоса».\n\nВ конечном счете, эта идеология отвергает бешеный экспансионизм Макото и нацелена на стабильное государство, которое усиливает внутреннюю сплоченность посредством сильной центральной власти. Миф о «народе богов» теперь функционирует исключительно как мощный социальный клей, формирующий граждан, согласных с этой огромной государственной машиной."
  makotoism_B2:0 "Мировой национальный либерализм"
  makotoism_B2_desc:0 "Мировой национальный либерализм — это идеология, возникшая после рассеивания безумия раннего мирового гегемонистского национализма, представляет собой радикальную ультралиберальную идеологию, основанную на священном пакте между германцами и геннанцами, называемыми двумя «избранными народами».\n\nПоследователи этой доктрины интерпретируют «Великий Переход» не как простую случайность, а как священное откровение: что «северный народ», наследник северных мифов, и «народ Генны», рожденный из долины Хинном, должны встретиться, чтобы править миром. Предсказано, что эти два «народа богов» были предназначены для создания самого мирного государства.\n\nПолитически это проявляется как режим совместного правления двух доминирующих народов, и лидер наследует одновременно мифы германского Севера и геннанского Хиннома, обеспечивая легитимность господства, выходящую за пределы крови.\n\nВ конечном счете, эта идеология под знаменем новой доминирующей цивилизации, называемой «Норд-Хинном», преодолевает старый экспансионизм и посвящает себя заботе о родине, поврежденной крайним милитаризмом."
  satsukiism_makoto_B:0 "Реставрационизм Генны"
  satsukiism_makoto_B_desc:0 "Реставрационизм Генны — это идеология, провозглашенная «освободителем» Ханумой Макото после того, как она силой положила конец обманчивому ментальному контролю Когёку Сацуки, призывающая к возвращению к фундаментальному духу Генны.\n\nЯдро этой идеологии заключается в определении искусственной гармонии и тишины, созданных Сацуки, как «ложного мира» и «ментальной смерти». Реставрационисты утверждают, что взрывы Исследовательского клуба гурманов, бесчинства Клуба развития горячих источников и бесконечное противостояние с Дисциплинарным Комитетом являются «живым доказательством», демонстрирующим свободную душу и неугасимую жизненную силу Генны.\n\nПоэтому реставрационизм Генны не представляет сложной системы или детальной программы. Вместо этого он устанавливает как высший приоритет отмену всякого угнетающего контроля и возвращение полной автономии всем организациям академии и каждой студентке. Порядок существует в минимальной форме, и считается, что государство само найдет свое равновесие среди разнообразных конфликтов и хаоса.\n\nВ конечном счете, это означает идеальное возвращение к «изначальной Генне»: непредсказуемой, шумной и с вечно возникающими проблемами. Для них контролируемый рай — это самый страшный ад, а свободный хаос — единственное небо, которого заслуживает Генна."
  police_nationalism:0 "Орденизм Кивотоса"
  police_nationalism_desc:0 "Позиция, представляющая линию Валькирии, которую отстаивала Огата Канна с момента Великого Перехода до настоящего времени; это идеология, которая поддерживает и решительно отстаивает порядок Генерального Студенческого Совета Кивотоса."
  police_neutralism:0 "Реформизм Кивотоса"
  police_neutralism_desc:0 "Группа реформистов, собравшаяся вокруг оппозиции внутри Валькирии, критикует слабость существующей системы Валькирии и утверждает, что нужна более сильная политика для кивотосцев."
  police_communism:0 "Новый орденизм"
  police_communism_desc:0 "Новый орденизм — это доктрина, рожденная из серии инцидентов столкновения с местными жителями, произошедших после Великого Перехода. Его ядро — сострадание к местным жителям, и его главная идея утверждает, что студенты Кивотоса должны первыми протянуть руку народу Земли."
  police_democratic:0 "Новый орденизм"
  police_democratic_desc:0 "Новый орденизм — это доктрина, рожденная из серии инцидентов столкновения с местными жителями, произошедших после Великого Перехода. Его ядро — сострадание к местным жителям, и его главная идея утверждает, что студенты Кивотоса должны первыми протянуть руку народу Земли."
  cou_kaya_dictatorship:0 "Диктатура сверхчеловека"
  cou_kaya_dictatorship_desc:0 "Диктатура сверхчеловека — это термин, обозначающий систему единоличной диктатуры Ширануи Каи. Ширануи Кая провозглашает себя «сверхчеловеком» и действует как верховный главнокомандующий государства и диктатор. Хотя на самом деле Кая довольно далека от того, чтобы быть «сверхчеловеком»."
  cou_ideology:0 "Координационное бюро"
  cou_ideology_desc:0 "Координационное бюро Генерального Студенческого Совета — это департамент, отвечающий за надзор и координацию Генерального Студенческого Совета, выполняющий роль, сходную с ролью президентского офиса. Под руководством Главного Администратора оно сотрудничает с Административным Комитетом и иногда вступает с ним в конфликт, осуществляя надзор и управление Кивотосом в целом, как номинально, так и эффективно."
  cou_ideology_the_elevens_fascism:0 "Административный Комитет"
  cou_ideology_the_elevens_fascism_desc:0 "Административный Комитет Генерального Студенческого Совета официально насчитывает одиннадцать департаментов, и под гармоничным правлением одиннадцати исполнительных директоров осуществляет надзор и управление Кивотосом в целом, как номинально, так и эффективно."
  cou_ideology_the_elevens_neutrality:0 "Административный Комитет"
  cou_ideology_the_elevens_neutrality_desc:0 "Административный Комитет Генерального Студенческого Совета официально насчитывает одиннадцать департаментов, и под гармоничным правлением одиннадцати исполнительных директоров осуществляет надзор и управление Кивотосом в целом, как номинально, так и эффективно."
  cou_ideology_the_elevens_communism:0 "Административный Комитет"
  cou_ideology_the_elevens_communism_desc:0 "Административный Комитет Генерального Студенческого Совета официально насчитывает одиннадцать департаментов, и под гармоничным правлением одиннадцати исполнительных директоров осуществляет надзор и управление Кивотосом в целом, как номинально, так и эффективно."

  srt_nationalism:0 "Фракция Контроля SRT"
  srt_nationalism_desc:0 "Фракция Контроля SRT — это идеология, выступающая за контроль над SRT. При этой системе вся государственная политика определяется в соответствии с автономным и рациональным суждением SRT."
  srt_democratic:0 "Представительная Фракция SRT"
  srt_democratic_desc:0 "Представительная Фракция SRT — это идеология, отстаивающая внешнюю деятельность SRT. Внешняя деятельность SRT определяется в соответствии с автономным и рациональным суждением SRT."
  srt_communism:0 "Реформистская Фракция SRT"
  srt_communism_desc:0 "Реформистская Фракция SRT — это идеология, выступающая за реформу SRT. Реформа SRT определяется в соответствии с автономным и рациональным суждением SRT."
  srt_neutralism:0 "Фракция Принципов SRT"
  srt_neutralism_desc:0 "Фракция Принципов SRT — это идеология, отстаивающая принципы SRT. Принципы SRT определяются в соответствии с автономным и рациональным суждением SRT."
  corporate_state_workplace_democracy:0 "Корпоративное государство - внутренняя демократия"
  corporate_state_workplace_democracy_desc:0 "Внутренняя демократия, уникальная идеология, возникающая в рамках корпоративного государства, демократически распределяет среди рабочих права управления предприятием. Эта система иногда может быть даже более радикальной, чем у коммунистов, что было бы особенностью, свойственной корпоративному государству, гигантской концентрации финансового капитала."
  corporate_state_corporatism:0 "Корпоративное государство - капитализм"
  corporate_state_corporatism_desc:0 "Это государство является огромной корпорацией, преследующей прибыль, как и обычная компания. Корпоративная собственность распределена между несколькими крупными акционерами и, в целом, принимает политическую систему, сходную с олигархией."
  corporate_state_private_enterprise:0 "Корпоративное государство - частное предприятие"
  corporate_state_private_enterprise_desc:0 "Это государство является огромной корпорацией, управляемой единоличным лидером, представленным президентом. Большинство прав внутри предприятия сосредоточено в одном лице, что в целом создает политическую систему, сходную с диктатурой."
  corporate_state_nephtys:0 "Корпоративное государство"
  corporate_state_nephtys_desc:0 "Это государство является огромной корпорацией, преследующей прибыль, как и обычная компания. Корпоративная собственность распределена между несколькими президентами и членами совета директоров, принимая в целом политическую систему, сходную с олигархией."

  left_council_communism:0 "Советский коммунизм"
  left_council_communism_desc:0 "Советский коммунизм, находящийся в левом крыле социалистического движения, выступает за организацию рабочих советов и управление всем обществом посредством советской демократии. Он критикует систему авангардной партии Советского Союза, называя ее государственным капитализмом, и склонен также рассматривать профсоюзы как группы капиталистических интересов."

  criminal_enterprise:0 "Верховенство капитала"
  criminal_enterprise_desc:0 "Этот альянс преступников поклоняется капиталу и не скупится на средства, когда дело касается денег. От торговли наркотиками и убийства ключевых фигур до грабежей и войны — они сделают все во имя прибыли."
  crime_vanguard:0 "Красные террористы"
  crime_vanguard_desc:0 "Этот преступный альянс, возникший как часть левой революционной организации, будет совершать зверства без колебаний, если это позволит им достичь своих идеологических целей."
  criminal_state:0 "Государство вне закона"
  criminal_state_desc:0 "Это государство, возникшее из преступной организации, действует под командованием сильного авторитарного лидера, нацеленного на великие задачи. Для них мнение международного сообщества не имеет никакого значения."
  crime_syndicate:0 "Преступный синдикат"
  crime_syndicate_desc:0 "Преступный синдикат, альянс преступников, функционирует как система, движимая совпадением интересов, и из-за своих нынешних масштабов уже может считаться государством сам по себе. Они будут стремиться поддерживать собственный порядок и не слишком любят перемены."

  Social_Liberalism:0 "Социал-либерализм"
  Social_Liberalism_desc:0 "Социал-либерализм — это ветвь либерализма, сочетающая защиту свободы и индивидуальных прав с заботой о социальной справедливости. Он утверждает, что для того, чтобы все индивиды пользовались по-настоящему равной свободой, государство должно вмешиваться для исправления неравных социальных структур и экономических разрывов. Социал-либерализм решительно защищает фундаментальные права и гражданские свободы, одновременно продвигая расширение сетей социальной защиты, гарантирующих равенство возможностей. К этому относятся всеобщее здравоохранение, укрепление системы государственного образования и политика благосостояния, защищающая граждан от безработицы и бедности."
  National_conservatism:0 "Национальный консерватизм"
  National_conservatism_desc:0 "Национальный консерватизм — это ветвь консерватизма, сочетающая национализм — идеологию, ценящую национальный коллектив, основанный на однородной идентичности и исторических связях, или этническую общность, основанную на кровных узах, — с консерватизмом. Национальный консерватизм продвигает социальные движения для продвижения интересов сообщества, к которому принадлежит, защиты его от агрессивного вмешательства иностранных держав и, более того, поощрения коллективной автономии."

  pure_socialism:0 "Чистый социализм"
  pure_socialism_desc:0 "Чистый социализм — это тип «правого социализма», сформулированный в начале XX века Кита Икки. В государстве чистого социализма глава государства действует как «живой бог», символ, собирающий всю волю народа, и как защитник нации: он внедряет экономику, контролируемую и управляемую государством, и выполняет роль корректировки системы, чтобы богатство не концентрировалось в богатом капиталистическом классе. Сочетание системы экономики, контролируемой благосклонным живым богом, и религиозного фанатизма оказало сильное идеологическое влияние на фракцию Кодоха, одну из основных фракций японской армии."

  transitioning_democracy:0 "Переходная демократия"
  transitioning_democracy_desc:0 "Государство с переходной демократией находится, строго говоря, между полноценной демократией и недемократическим режимом. То, что страна свергает диктаторскую систему, не означает, что ее народ может сразу стать полностью свободным. Это происходит потому, что бюрократы, лояльные старому правительству, остаются на своих постах, поддерживая авторитарную политику, а силы безопасности, которые были лояльны диктатуре, также продолжают существовать, не будучи замененными, сохраняя контроль над правоохранительными органами. Переходная демократия — это не идеология, преследуемая самим правительством, а явление, возникающее в процессе перехода от диктаторского государства к демократическому после краха диктатуры."

  harmonism: "Государственный гармонизм"
  harmonism_desc: "Государственный гармонизм — это идеология, созданная Сорасаки Хиной для объединения хаотичного Дисциплинарного Комитета и эффективного использования его власти. На основе сосуществования местного и иномирного к ней добавлены множественные квалификаторы: власть государственных институтов, историческая легитимность Дисциплинарного Комитета, распределение власти между студентами Генны и местными гражданами, взаимная компенсация за Великий Переход вместе с классовым сотрудничеством. Сегодня это составляет двигатель, позволяющий Сорасаки Хине осуществлять жесткую диктаторскую политику; и это останется одной из идеологий, определивших XX век, и результатом прохождения Дисциплинарным Комитетом бурного межвоенного периода."
  irohasm_A: "Движение Новой Германии"
  irohasm_A_desc: "Движение Новой Германии — это прагматичная идеология государственной реформы, которая при правительстве Нацуме Ирохи стремится демонтировать и перестроить традиционный немецкий национализм. Это движение отвергает как провалившуюся демократию Веймара прошлого, так и разрушительное безумие нацизма, и нацелено на смелое преобразование и переписывание самой идентичности «Германии» для соответствия текущему федеральному государству.\n\nЯдро этой идеологии заключается не в идеологической чистоте, а исключительно в стабильности и контроле государства. Нацуме Ироха считает себя «наездницей» и верит, что должна объездить этого неукротимого зверя по имени «немцы» и направить его в новом направлении. Для этого символы, законы и культуры прошлого будут сохранены, если они полезны для государства; а если мешают, будут без колебаний упразднены или заменены новыми формами.\n\nДвижение Новой Германии не облачается в оболочку принудительной диктатуры. Вместо этого, посредством административных процедур и постепенных реформ, оно направляет общество в желаемом направлении и заставляет население само поверить, что оно становится частью новой Германии. В конечном счете, это чрезвычайно гибкая и прагматичная форма авторитаризма: та, что разрывает с любой идеологией прошлого и создает «Новую Германию», определяемую исключительно нынешним лидером."

  irohasm_B: "Генно-германизм"
  irohasm_B_desc: "Генно-германизм родился не из четкой теоретической основы, а является идеологией интеграции, сформировавшейся спонтанно внутри особой социально-политической реальности Германо-Геннанской Федерации, возникшей после Великого Перехода. Сначала он ограничивался подчеркиванием мирного сосуществования двух народов, но со временем развился и систематизировался как логика правления федерального президента Нацуме Ирохи, поддерживаемая совместно двумя партиями.\n\nЭта идеология фокусируется на общем опыте преодоления общей травмы «Великого Перехода», а также на неожиданных культурных сходствах, таких как ценность порядка и дисциплины и, тем не менее, наслаждение фестивалями. Исходя из этого, она устанавливает как первейшую добродетель народа лояльность и вклад не крови или миру происхождения, а «Федерации» как новому сообществу.\n\nВ политике она сохраняет двухпартийную систему между геннанским блоком и немецким блоком, но над ними обоими ставит «совместно избранного лидера» как трансцендентный символ интеграции. Этот лидер выступает посредником в крайних межфракционных противостояниях, выполняет символическую роль для национального единства и прежде всего стремится к реальной стабильности и процветанию, выше идеологической чистоты. Это уникальная модель прагматичного сосуществования, отличная как от ассимиляционизма (где одна часть поглощает другую), так и от мультикультурализма (который предполагает разделение каждой группы)."

  chiakism: "Мотомияизм"
  chiakism_desc: "Скорее, чем фиксированная политическая философия, мотомияизм напоминает гигантское, громкое «шоу политических развлечений» под руководством Мотомии Тиаки.\n\nВ этой системе государство функционирует как редакция большого еженедельного журнала. Для Тиаки важна не идеология или последовательная политика. Важно: «Какую великую эксклюзивную историю я взорву на этой неделе, чтобы удивить публику?». Вчера она может атаковать конгломераты, как будто она левая, и кричать «Эксклюзив антикоррупционной чистки!», а сегодня, как будто она правая, может пожать руку крупным корпорациям и вынести на обложку «Чудо мифа о росте!».\n\nЛюди, хотя и озадачены ее непредсказуемым курсом, не могут оторвать взгляд от этого захватывающего, ослепительного политического спектакля, который изливается без остановки. Это не что иное, как этап «редакционного собрания», на котором она ощупывает здесь и там и расширяет доску, прежде чем найти настоящую сенсацию, которой докажет свое лидерство."

  chiakism_left: "Благотворительный сенсационализм Тиаки"
  chiakism_left_desc: "Благотворительный сенсационализм Тиаки — это режим левого популизма под руководством Мотомии Тиаки, где каждый день — как праздник. Для Тиаки мрачная и скучная бедность — это «старая новость, которую нужно закрыть», а образ всеобщей улыбки — это «великая сенсация», которая должна занимать главный заголовок.\n\nС ее криком «Готовы~! Да!» государство распахивает настежь сейф. Благосостояние падает не через скучные административные процедуры, а обрушивается на гражданство как сюрпризы или розыгрыши. Она считает радость публики «лучшим шансом для фотоснимка» и, чтобы его получить, не колеблясь открывает склады привилегированных.\n\nВ результате эта система движима скорее ожиданием восторженной пропаганды, чем сложными теориями. Хотя она может быть импровизированной и нести фискальные риски, массы каждое утро страстно увлекаются «политикой типа экстренного выпуска» Тиаки и оказывают ей подавляющую поддержку."

  chiakism_right: "Приоритет роста по-тияковски"
  chiakism_right_desc: "Приоритет роста по-тияковски — это режим ускоренного роста, рожденный из сочетания характерного для Мотомии Тиаки «импульса действия» и правой технократической эффективности. В этой системе государство становится большой редакцией, а крупные корпорации — способными репортерами, производящими сенсации.\n\nТиаки без колебаний урезает сложные нормативные акты и удушающие процедуры, помечая их как «скучные истории, не годящиеся для новостей». Вместо этого она привлекает крупный капитал, возводит небоскребы, запускает заводы и ежедневно публикует на всю полосу бьющие рекорды темпы роста: «Ха-ха! Сенсация!». Здесь нет места некомпетентности и застою. Поклоняются только «результату» и «скорости».\n\nЭто не холодный элитизм. Тиаки провозглашает массам: «Не недооценивайте мою способность действовать!», и выставляет плоды роста как визуальное зрелище. Хотя темп может быть головокружительным, под ослепительной вспышкой Тиаки страна мчится к процветанию, как неудержимый поезд."

  chiakism_A_1: "Кооперативный сенсационализм по-тияковски"
  chiakism_A_1_desc: "Кооперативный сенсационализм по-тияковски — это режим интеграции, самый громкий и масштабный в истории, в котором «благотворительный сенсационализм» расширяется за пределы этнических границ. Тиаки стерла с редакционного стола старые категории «германец» и «геннанец», сказав, что это «избитая обстановка, снижающая интерес читателей».\n\n«Смотрите сюда! Щелк!» В объективе ее камеры все, что живет на этой земле (студенты Генны, бывшие германцы, граждане Веймара и даже потомки франков, рассеянные в истории), должно слиться в единое большое сообщество: «новый немецкий народ (Neues Volk)». Для «великой трогательной эпопеи», которая родится из этого разнообразного состава, она без колебаний открывает национальную сокровищницу, а дискриминаторов, препятствующих гармонии, рассматривает как «статистов, не умеющих читать атмосферу», выталкивая их со сцены.\n\nЭта система работает не на крови или истории, а под простым и мощным заголовком: «С сегодняшнего дня мы все друзья!». Хотя процесс может быть несколько импровизированным и шумным, массы с удовольствием проецируют себя в эту теплую и захватывающую «драму примирения» под руководством Тиаки и разражаются энтузиазмом."

  chiakism_A_2: "Приоритетный утилитарный развитизм по-тияковски"
  chiakism_A_2_desc: "Приоритетный утилитарный развитизм по-тияковски — это окончательный рациональный вывод, к которому приходит «приоритет роста». Для Тиаки этнический конфликт — не что иное, как «худшая неэффективность, из тех, что даже не годятся для новостей», которая подтачивает производительность большой корпорации под названием государство. Она заявляет, что объединит в один пакет военную мощь Генны, промышленные способности Германии и потенциал бесчисленных меньшинств, чтобы высвободить беспрецедентную синергию.\n\n«Сенсация! Наконец-то я нашла великий выигрышный предмет под названием “большая интеграция”!» Тиаки смело отбрасывает старое превосходство крови и реорганизует Генну, Германию и все гетерогенные группы в мега-проектную команду под названием «Германия». Теперь определение «немец» зависит не от крови, а от того, насколько ты способствуешь этому бешено мчащемуся графику роста.\n\nЭто не холодная политика ассимиляции. Тиаки объявляет на всю полосу взрывную реакцию, которую производят разные народы друг с другом, называя это «лучшим шансом для фотоснимка, чтобы удивить мир». Хотя в процессе презирается традиция и все плавится в тигле эффективности, под гламурной вспышкой, которую дает Тиаки, страна не останавливается и бежит к единственной цели: «сокрушительному процветанию»."

  chiakism_A_3: "Гуманистический социализм по-тияковски"
  chiakism_A_3_desc: "Гуманистический социализм по-тияковски — это теплый и стабильный режим, рождающийся, когда «благотворительный сенсационализм» приходит к соглашению с германской традицией. Тиаки поняла, что радикальные реформы изматывают население, и решила вместо этого построить государство как «серьезную газету», любимую долгое время.\n\n«Сенсация! Генна — не ее правитель, а ее добрейший сосед!» Она уменьшает масштаб академии Генны до «маленькой Генны», очищает ее и реорганизует как элитный орган для переговоров, одновременно широко гарантируя традиции и собственные права немецкого народа. Теперь геннанцы позиционируются уже не как привилегированный класс, а как «красивые персонажи второго плана», которые постепенно интегрируются в немецкое общество благодаря своей преданности.\n\nЭта система, вместо захватывающей революции, превращает в «трогательные заголовки» горячий суп, который подается каждый день, и стабильные пенсии. Хотя изменения продвигаются медленно, внутри этой «драмы сосуществования, которую невозможно смотреть без слез», поставленной Тиаки, немцы в конце концов принимают без отторжения лидерство Генны и оказывают ей твердую поддержку."

  chiakism_A_4: "Национализм по-тияковски"
  chiakism_A_4_desc: "Национализм по-тияковски — это наиболее эффективная модель элитарного правления, к которой приходит «приоритет роста» путем реалистического компромисса. Тиаки сочла, что переписывание силой огромной и превосходной «рукописи» под названием немецкая нация было бы неэффективным. Вместо этого она оставила Генну как уменьшенную элиту и выбрала путь завершения бестселлера под названием «Германия».\n\n«Каждый на своем месте! Германия производит, а Генна управляет! Разве это не идеальное распределение ролей?» В этой системе немецкая традиция и промышленная база строго защищаются и уважаются, потому что они сами являются источником национальной конкурентоспособности. Геннанский блок, вместо смешивания с немцами, функционирует как группа компетентных администраторов над ними; а интеграция происходит очень медленно, принимая только тех, кто прошел проверку.\n\nЭто не холодное господство. Тиаки с роскошью и зрелищностью продвигает сокрушительную мощь, рождающуюся из этой системы идеального разделения труда, называя это «историей успеха, на которую смотрит весь мир!». Немцы признают лидерство Генны, сохраняющее их идентичность, а Генна наслаждается процветанием на прочной базе под названием Германия: начинается тщательно рассчитанная эксклюзивная симбиотическая история."

  chiakism_B1: "Меньшевизм по-тияковски"
  chiakism_B1_desc: "Меньшевизм по-тияковски — это наиболее рациональная и постепенная социалистическая модель: государство направляет огромный капитал корпораций на превращение его в благосостояние масс. Секретарь Тиаки выбрала прагматичную линию: не радикальную большевистскую революцию, а улучшение жизни рабочих через «стратегический альянс» с капиталистами.\n\nВо внешней политике Тиаки квалифицирует и отвергает как «ленивую парламентскую демократию» Запада, так и «жесткий марксизм-ленинизм» Востока, считая их провальными планами. Вместо этого она ищет солидарность «третьего пути» с фашистскими государствами, которые хотят разорвать старую дихотомию между либерализмом и коммунизмом. Хотя идеологические корни различаются, у нас есть общая точка: что государство твердо берет инициативу и «редактирует» общество эффективно. Поэтому мы без колебаний возьмем их за руку.\n\n«Переговоры — это большая сенсация, чем борьба; а распределение — большая сенсация, чем разрушение!» Этот режим является точкой компромисса, настолько же спорной, насколько и процветающей, которую Тиаки «отредактировала» со своим особым чувством баланса из эффективности капитализма, идеала социализма и суровой реальности международной арены."

  chiakism_B2: "Национальный консерватизм"
  chiakism_B2_desc: "Национальный консерватизм — это мощная идеология правого популизма, ставящая национальную безопасность и экономическое процветание как высшие ценности. Чтобы защитить «нашу родину» от внешних угроз, возведена стальная стена общими усилиями всех социальных сообществ.\n\nВ этой системе свобода существует под порядком, а индивид функционирует как часть великой эпопеи под названием государство. Правительство вознаграждает народ высшей наградой: «гордостью», подкрепленной солидной военной мощью и сокрушительным экономическим ростом. Это реалистичный и твердый патриотизм, отвергающий слабый идеализм и завоевывающий выживание и процветание силой и способностью."

  chiakism_B3: "Коммунизм Пандемониума"
  chiakism_B3_desc: "Коммунизм Пандемониума — это самая радикальная и революционно смелая форма социализма, возглавляемая Мотомией Тиаки. Она отвергает серый коммунизм прошлого и создает новую систему, берущую необузданную свободу и характерный хаос Пандемониума Генны как топливо революции.\n\n«Скучная революция виновна! Если не весело, это не коммунизм!» В этом обществе народ не только поровну делит хлеб, но и в равной степени имеет право наслаждаться праздниками и освобождать свои желания. Огромные события, спонсируемые государством, и благосостояние смелых мер превращают каждый день в атмосферу, как будто это годовщина революции.\n\nКонечно, главная особенность этого общества — именно «свобода». Мысль Тиаки ценит творчество и индивидуальное наслаждение выше жесткой классовой структуры или принудительной мобилизации. Это создает революционное и, в то же время, хаотичное общество, но воплощает уникальный социализм, ядром которого является необузданная свобода и хаос, свойственные Пандемониуму Генны."

  chiakism_B4: "Либерализм революционного порядка"
  chiakism_B4_desc: "Либерализм революционного порядка — это деформированный авторитарный режим, возвышающийся на руинах эксперимента радикального социализма, разбившегося о стену «реальности». Секретарь Тиаки свергла капиталистов, но вместо того, чтобы полностью вернуть это богатство народу, она выбрала запереть его в гигантском сейфе под названием государство.\n\nВ этой системе существует «рынок», но он не свободен. Доминирует строгий «популизм государственного контроля», где Тиаки и небольшая группа отобранных элит сжимают и трясут все экономические артерии.\n\nЭто не идеал левых и не свобода правых. Это только холодная диктатура, разжигающая народный гнев антикапиталистической агитацией и покупающая лояльность благотворительными раздачами, разбрасываемыми государством. Революция осталась незавершенной, и вместо нее осталась только тяжелая цепь под названием «порядок»."

  chiakism_B5: "Демократия с характеристиками Генны новой эры"
  chiakism_B5_desc: "Демократия с характеристиками Генны новой эры — это оригинальная система правления, предложенная секретарем Мотомией Тиаки, сосредоточенная на сильной исполнительной власти и решении лидера. Эта идеология отвергает изнурительную партийную политику и парламентские фракционные борьбы как «национальное расточительство» и берет как идеал прямое общение лидера и народа для преодоления государственного кризиса.\n\nТиаки определяет себя не как диктатора, а как «главного редактора страны», защищающего истинную свободу перед лицом разнузданной анархии. Она утверждает, что «самая совершенная свобода возможна только на сильном порядке», и оправдывает, что ради эффективности и стабильности лидер осуществляет внеправовые полномочия.\n\nВ этой системе устраняются посредники, и массы оказывают лидеру абсолютное доверие посредством референдумов и механизмов прямой консультации. Хотя формально соблюдаются демократические процедуры, по сути вся власть сконцентрирована в одном лице: это самая рафинированная и мощная форма авторитаризма, практикуемая во имя «свободы»."

  chiakism_C1: "Теория Мотомии"
  chiakism_C1_desc: "Теория Мотомии — это собственная идеология правления секретаря Мотомии Тиаки, которая философски систематизирует ранний эмпирический успех «благотворительного сенсационализма». Она оригинально переосмыслила теорию гегемонии Антонио Грамши и пришла к выводу, что захват контроля над надстройкой — культурой и восприятием — является истинным ключом к государственной реформе.\n\nЯдро этой теории — стратегическое использование сконструированной реальности. Тиаки считает, что народная поддержка не обязательно должна возникать из объективной истины. Даже если это «сфабрикованные иллюзии», если ослепительные фестивали, смелое благосостояние и тщательно обработанный СМИ образ лидера могут воодушевить массы и создать подавляющие рейтинги поддержки, тогда это становится реальной властью.\n\nПоэтому популизм — не цель, а средство. Теория Мотомии предоставляет массам иллюзию, которую они жаждут, чтобы полностью овладеть культурной гегемонией, и использует эту абсолютную поддержку как «политическое топливо» для сокрушения сопротивления устоявшихся интересов и навязывания сверху радикальных реформ, задуманных лидером. Это кульминация «национального редактирования», выходящего за рамки простой демагогии: манипулирование восприятием и перестройка даже материальной базы."

  chiakism_C2: "Теория Мотомии"
  chiakism_C2_desc: "Теория Мотомии — это собственная идеология правления секретаря Мотомии Тиаки, которая философски систематизирует ранний эмпирический успех «благотворительного сенсационализма». Она оригинально переосмыслила теорию гегемонии Антонио Грамши и пришла к выводу, что захват контроля над надстройкой — культурой и восприятием — является истинным ключом к государственной реформе.\n\nОднако Тиаки делает шаг вперед и утверждает, что постоянная гегемония может быть завершена не на сконструированных иллюзиях, а на «реформах, которые чувствуются кожей». Эта теория занимает прагматичную «третью позицию», отвергающую как жестокость капитализма, так и жесткость коммунизма. Она ломает неэффективную бюрократию и изнурительные классовые конфликты и, посредством сильного централизованного руководства, объединяет рабочих и капиталистов, геннанцев и немцев в органическое сообщество государства.\n\nПоэтому в Теории Мотомии популизм — это не просто погоня за популярностью. Это движущая сила реформы: лидер напрямую собирает требования народа, немедленно воплощает их в политику, и сокрушительными результатами этой реальности нейтрализует устоявшиеся интересы. Это реалистичная и динамичная теория национальной реформы, открывающая новую эру Генны через субстантивное процветание, а не иллюзию."

  chiakism_C3: "Государственный капитализм"
  chiakism_C3_desc: "Государственный капитализм — это уникальная система правления, в которой политическая власть и крупный финансовый капитал полностью сливаются под лозунгом: «Государство для предприятий, и предприятия для государства». Секретарь Тиаки определила неопределенность свободного рынка как «неэффективный шум» и выбрала путь прямого участия государства в советах директоров мега-корпораций для централизованного «редактирования» экономики.\n\nЭта система начиналась с преследования чисто правой эффективности, но, парадоксальным образом, ее конечная структура напоминает советскую финансовую олигархию, где исчезает граница между государством и капиталом. В этой модели, теоретизированной на основе «власти элит», наблюдаемой в западных капиталистических обществах, таких как США, вращающаяся дверь между бюрократами и руководителями не существует: потому что с самого начала они — одно и то же.\n\nТеперь государство превратилось в гигантскую акционерную компанию, народ — в акционеров, а Тиаки, как бессменный CEO этого колоссального комплекса, направляет поток капитала. Здесь политика заменяется «советом директоров». Под целью сокрушительной эффективности и создания прибыли капитал и власть становятся едины и без сбоев управляют машиной под названием государство."

  chiakism_AA1: "Генно-немецкий либерализм"
  chiakism_AA1_desc: "Генно-немецкий либерализм — это идеология «оборонительного плюрализма» Тиаки, рожденная из болезненного осознания того, что слабая снисходительность Веймарской республики породила монстра по имени нацизм. Эта идея переопределяет свободу не как врожденное право невмешательства, а как «ответственное право», разрешенное только в пределах, не подрывающих социальную интеграцию и стабильность государства.\n\nПрезидент Мотомия Тиаки навсегда устранила, во имя Конституции, «свободу разрушения», которой пользовались нацизм, попирающий человеческое достоинство, и экстремизм, угрожающий системе. Вместо этого, внутри ограды «интеграции», установленной государством, все члены, независимо от крови или мира происхождения, получают равную и полную свободу как «новые немецкие граждане».\n\nСледовательно, этот режим не является слепым laissez-faire. Это самая сильная и реалистичная форма контролируемого либерализма: отказывая в свободе врагам свободы, она, парадоксальным образом, защищает истинное сосуществование и свободу многоэтнического общества."

  chiakism_AA2: "Социальная диктатура"
  chiakism_AA2_desc: "Социальная диктатура — это уникальная система доминирования одной партии, установленная на отчаянном чувстве кризиса: «разделение — это уничтожение». Чтобы предотвратить этническую катастрофу, которую принесла бы безграничная политическая борьба, президент Тиаки распустила все крупные левые силы Германии и Генны внутри огромной коалиции под названием «великое правительство единства», настолько массивной, насколько и нестабильной.\n\nЭта система напоминает однопартийную тем, что сохраняет формальные демократические процедуры, но структурно исключает реальную возможность чередования власти. Однако это не результат принуждения: оба народа добровольно выбрали вместо кровавой гражданской войны стабильность, благосостояние и постоянный мир, которые предлагает эта «добровольная диктатура», разработанная Тиаки.\n\nПоэтому в этом обществе не может существовать полноценной оппозиции. Государство эффективно управляется единой крупной правящей партией, и любой политический конфликт разрешается не борьбой, а внутренним, тихим и тщательным «редактированием». Это плод огромного компромисса: самый стабильный и мирный, но оскопивший политическую динамику ради выживания."

  chiakism_AA3: "Великий инклюзивный народный альянс"
  chiakism_AA3_desc: "Великий инклюзивный народный альянс — это широкая центристская система «большого шатра», написанная на новой странице под названием «Deutschland», после разрыва с авторитарным прошлым «Deutsches Reich». Президент Тиаки объединила оборонительную конституционную концепцию «генно-немецкого либерализма» со стабильностью «социальной диктатуры», создав гигантскую политическую черную дыру, охватывающую левых и правых.\n\nПри этом режиме национальные путаницы, такие как нацизм или радикальный коммунизм, строго исключаются во имя Конституции. Вместо этого все силы, уважающие Конституцию — от умеренного консерватизма до социал-демократии — поглощаются в рамках единой крупной партии под названием «народный альянс». Нет чередования власти, но народная воля включается через интенсивный и динамичный внутренний процесс настройки фракций.\n\nДругими словами, политика перемещается с уличной борьбы в дебаты в зале партийных собраний. Массы удовлетворены стабильностью «вечной правящей партии», которой руководит Тиаки, а Тиаки, как бессменный администратор этого огромного шатра, редактирует и координирует внутренне все конфликты государства. Это кульминация идеально контролируемой демократии: самой свободной и, парадоксальным образом, наименее меняющейся."

  traditionalism_with_trinity_characteristics:0 "Традиционализм с характеристиками Тринити"
  traditionalism_with_trinity_characteristics_desc:0 "Традиционализм с характеристиками Тринити — это идеология, которая, защищая благородную аристократическую олигархическую традицию, стремится к постепенным изменениям внутри системы. Установленный Кирифудзи Нагисой и продвигаемый Филиусом, традиционализм Тринити родился как реакция на милитаризм, отстаиваемый фракцией Патер. Филиус, основываясь на своем презрении к популизму, ценит просвещенную мысль, сосредоточенную на меньшинстве интеллектуалов и высших классов, которые «ведут» массы; сохранение ценностей Тринити — веры и благородства; и матриархальную роль Хозяина, ведущего с доброй любовью заблудших детей Тринити.\n\nОднако, несмотря на неприятие радикальных изменений, его религиозный характер и аристократическая олигархическая система, традиционализм Тринити в значительной степени отличается от католического традиционализма местного человечества. Причина в том, что с самого начала «консервативные» ценности, которые Тринити стремится защитить, сами по себе являются «прогрессивными» ценностями столетнего будущего, вне рамок понимания местных людей."
  traditionalism_with_trinity_characteristics_neutrality:0 "Традиционализм с характеристиками Тринити"
  traditionalism_with_trinity_characteristics_neutrality_desc:0 "Традиционализм с характеристиками Тринити — это идеология, которая, защищая благородную аристократическую олигархическую традицию, стремится к постепенным изменениям внутри системы. Установленный Кирифудзи Нагисой и продвигаемый Филиусом, традиционализм Тринити родился как реакция на милитаризм, отстаиваемый фракцией Патер. Филиус, основываясь на своем презрении к популизму, ценит просвещенную мысль, сосредоточенную на меньшинстве интеллектуалов и высших классов, которые «ведут» массы; сохранение ценностей Тринити — веры и благородства; и матриархальную роль Хозяина, ведущего с доброй любовью заблудших детей Тринити.\n\nОднако, несмотря на неприятие радикальных изменений, его религиозный характер и аристократическая олигархическая система, традиционализм Тринити в значительной степени отличается от католического традиционализма местного человечества. Причина в том, что с самого начала «консервативные» ценности, которые Тринити стремится защитить, сами по себе являются «прогрессивными» ценностями столетнего будущего, вне рамок понимания местных людей."

  arius_nihilism: "Нигилизм Ариуса"
  arius_nihilism_desc: "Нигилизм Ариуса — это наиболее изолированная и милитаризованная форма слепого нигилизма в Кивотосе: он берет как принцип правления экстремальную и пессимистическую интерпретацию отрывка «Суета сует, и всё — суета (Vanitas vanitatum, et omnia vanitas)».\n\nВ начале Альянса Тринити, филиальная школа Ариуса, скрывавшаяся в подземных катакомбах, спасаясь от преследований, трансформировалась — изолированная от внешнего мира — в деформированное казарменное общество, существующее только для «мести». В рамках этой идеологии «образование» перестает быть самореализацией студенток и заменяется тренировкой техник убийства, направленных на уничтожение эмоций и эффективное уничтожение других. Всякий мир, дружба и надежда мира определяются как «фальшивое лицемерие», и студенткам внушают веру в то, что только ненависть и страдания являются единственной правдой мира.\n\nВ политике этот режим поддерживается путем продолжения идеологии тотальной промывки мозгов, внедренной в прошлом Беатрис. Его члены объединяются не для преодоления пустоты, а присоединяются к противоречивому «культу смерти», который разрушает жизнь других, чтобы доказать, что собственная жизнь не имеет ценности.\n\nВ конце концов, нигилизм Ариуса предстает под предлогом разрушения «фальшивого мира» Тринити, но на самом деле означает самую печальную и разрушительную антиутопию в истории Кивотоса: потребление самих себя как расходного материала, запертых в застарелых обидах."

  academy_state_system_democratic: "Система академия-государство"
  academy_state_system_democratic_desc: "Система академия-государство, установленная после Великого Перехода, — это режим, возникающий, когда академическая система Кивотоса до Великого Перехода впоследствии берет на себя широкие общие административные задачи, включая автономные зоны. Президент студенческого совета одновременно занимает пост главы государства, а студенческий совет выполняет роль парламента; исполнительная и законодательная власть четко не различаются."
  academy_state_system_neutrality: "Система академия-государство"
  academy_state_system_neutrality_desc: "Система академия-государство, установленная после Великого Перехода, — это режим, возникающий, когда академическая система Кивотоса до Великого Перехода впоследствии берет на себя широкие общие административные задачи, включая автономные зоны. Президент студенческого совета одновременно занимает пост главы государства, а студенческий совет выполняет роль парламента; исполнительная и законодательная власть четко не различаются."
  rikuhachima_socialism:0 "$hardboiled_noir$"
  rikuhachima_socialism_desc:0 "$hardboiled_noir_desc$"

  KR_social_liberal: "$Social_Liberalism$"
  KR_social_liberal_desc: "Социал-либерализм — это режим, укорененный в традиции прогрессивного либерализма, который продвигает реконструкцию общественного договора в соответствии с требованиями меняющейся эпохи. Его конечная цель — укрепить, защитить и расширить реальную свободу гражданства посредством структурных реформ в политической и экономической сферах."

  theocracy_neutrality: "Теократия"
  theocracy_neutrality_desc: "Теократия, или теократическое правление, — это государство, в котором представитель Бога правит страной. Даже в теократических государствах правитель страны может избираться путем голосования, как в случае с Папой, но они отличаются от избранных лидеров демократических республик, следующих народному суверенитету, тем, что правитель теократического государства является религиозным представителем, которому Бог делегирует власть."

  IRE_ideology_fianna_fail: "Фианна Файл"
  IRE_ideology_fianna_fail_desc: "Фианна Файл считает, что независимость — это не вопрос ее «провозглашения», а вопрос ее «завершения», и стремится устранить как внешнее влияние, так и внутренние разногласия, блокирующие национальный суверенитет. Они оправдывают преодоление кризиса сильным правительством и мобилизацией масс и ставят единство национального сообщества выше классовой борьбы. Если необходимо, они склонны смело реструктурировать законы и институты, чтобы задать курс государства."
  IRE_ideology_fine_gael: "Фине Гэл"
  IRE_ideology_fine_gael_desc: "Фине Гэл находит легитимность государства не в революционном пылу, а в институтах, верховенстве закона и фискальной стабильности, и не доверяет резким переменам. Они ставят порядок и доверие выше, чтобы сдерживать социальные конфликты на управляемом уровне, и утверждают, что экономика должна восстанавливаться путем постепенных реформ и ответственной фискальной политики. Это сильный реализм, который верит, что выживание государства больше зависит от «преемственности», чем от «смелости»."

  KR_social_democrat: "$scandinavian_social_democracy$"
  KR_social_democrat_desc: "Социал-демократия относится к различным правительствам, руководимым левыми реформистскими течениями. Они утверждают, что насильственная классовая борьба не нужна для достижения их целей, и иногда вступают в конфликт по этому поводу с более радикальными товарищами. Большинство стремится к изменениям через голосование, но если ситуация доходит до крайности, существуют прецеденты, когда они также прибегали к революции."

  KR_social_conservative: "Социальный консерватизм"
  KR_social_conservative_desc: "Социальный консерватизм охватывает многочисленные демократические правительства, которые в меняющихся обстоятельствах стремятся поддерживать, защищать и укреплять традиционные ценности народа. Социальные консерваторы — не жесткие реакционеры; они обычно поддерживают верховенство закона и демократию, и в рамках текущей политической системы готовы продвигать постепенные и предсказуемые изменения, если считают, что они соответствуют их видению."
  KR_social_conservative_neutrality: "$KR_social_conservative$"
  KR_social_conservative_neutrality_desc: "$KR_social_conservative_desc$"
