 # Общие национальные фокусы#
 BA_factoriesof_new_world:0 "Фабрики нового мира"
 BA_factoriesof_new_world_desc:0 "После прибытия в неизвестный мир мы обнаружили бесчисленные фабрики. По сравнению с теми, что мы использовали, они очень отсталые, но их очень много, и они работают с удивительно высокой активностью."

 BA_a_lot_of_people:0 "Бесчисленные толпы"
 BA_a_lot_of_people_desc:0 "В этом месте существует количество людей, которое никогда не увидишь в Кивотосе. Мы можем использовать это население, чтобы ответить на хаус, вызванный этой аномальной ситуацией."

 BA_new_world_technology:0 "Технологии нового мира"
 BA_new_world_technology_desc:0 "Технологии, разработанные людьми этого мира, в целом уступают нашим; однако в определенных аспектах они превосходят даже технологии Кивотоса. Несомненно, есть чему поучиться и что перенять."

 BA_new_world_technology_army:0 "Местные жители"
 BA_new_world_technology_army_desc:0 "В отличие от людей Кивотоса, жители этого мира не имеют ореолов и могут умереть от одного-двух выстрелов. Поэтому их способ организации армий чрезвычайно систематичен и основан на развертывании огромного количества личного состава."

 BA_new_world_technology_new:0 "Технологические контрмеры"
 BA_new_world_technology_new_desc:0 "Ореолы устойчивы к физическому воздействию, но крайне уязвимы для химических и биологических атак. Мы разработаем контрмеры против этих угроз и усилим обороноспособность пехоты с ореолами."

 BA_new_world_technology_army1:0 "Военная доктрина"
 BA_new_world_technology_army1_desc:0 "Этот мир разработал исключительно передовые военные доктрины через мировую войну и многочисленные конфликты меньшего масштаба. Мы попытаемся изучить их и включить в нашу собственную доктринальную систему."

 BA_new_world_technology_army2:0 "Крупномасштабные военные операции"
 BA_new_world_technology_army2_desc:0 "Изучая их способ управления массовыми армиями, мы сможем реорганизовать нашу военную систему еще более продвинутым образом."

 BA_new_world_technology_halo:0 "Особое применение ореола"
 BA_new_world_technology_halo_desc:0 "Продолжающиеся исследования показали, что ореолы могут использоваться самыми разными способами, что приведет к расширению формирований войск, их использующих."

 BA_new_world_technology_halo_heavy:0 "Исследование многоцелевых ореолов"
 BA_new_world_technology_halo_heavy_desc:0 "Пехота с ореолами обладает чрезвычайно широким потенциалом. Мы углубим технологии Тайны, чтобы максимально реализовать этот потенциал."

 BA_horror_of_war:0 "Ужас войны"
 BA_horror_of_war_desc:0 "Мы будем использовать все возможные средства для максимально эффективного применения наших вооруженных сил и не будем колебаться при проведении крупномасштабных военных операций.\n\n§tНаконец, мы адаптировались к новому миру.§!"

