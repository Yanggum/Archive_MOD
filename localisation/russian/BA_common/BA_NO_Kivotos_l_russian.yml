 BA_pol_event.1.t: "Концепция Междуморья"
 BA_pol_event.1.d: "Чтобы Польша могла противостоять злому советскому вторжению, нам, естественно, нужны другие товарищи с общими интересами. Мы сделаем все возможное, чтобы союз с этими странами сформировался как можно скорее."
 BA_pol_event.1.a: "Это вопрос выживания нации."

 BA_pol_event.2.t: "Наследие войны"
 BA_pol_event.2.d: "Мы защитили страну от большевистского империализма, но необходима более широкая и быстрая подготовка, чтобы предотвратить вторую войну."
 BA_pol_event.2.a: "Мы живем в эпоху национального кризиса."
 BA_pol_event.2_tt: "§gЧасть промышленности западных территорий была перенесена в центральную Польшу:§!\n"
 BA_pol_event.2_tt_1: "§g\nМы освободились от эмбарго:§!"
 BA_pol_event.2_tt_2: "§gВоенная мобилизация идет:§!"

 BA_pol_event.3.t: "Горкинская конференция"
 BA_pol_event.3.d: "С падением наших главных городов ход войны быстро склонился на сторону Польши. Теперь наши силы сражаются не только против Польши, но и против внутреннего возрождения феодальных белых. Польша знает это и, чтобы скорее закончить войну, сделала предложение нашему правительству. Предложение освобождало Беларусь и Западную и Центральную Украину и отказывалось от влияния на три балтийских государства, сильно ослабляя нашу силу на западе; другими словами, это означало признание нашего фактического поражения."
 BA_pol_event.3.a: "Как и Ленин, мы тоже подумаем о завтрашнем дне."
 BA_pol_event.3.b: "Советский народ будет сражаться до конца и победит!"
 BA_pol_event.3_tt: "\nТем не менее, мы продолжим §Yвойну§! против §Y@RSA [RSA.getname]§!."

 BA_pol_event.4.t: "Советское согласие"
 BA_pol_event.4.d: "Советский Союз принял наше предложение, и родина и альянс смогли снова принести мир в Восточную Европу и мир."
 BA_pol_event.4.a: "Да здравствует Польша!"

 POL_win_of_intermarium_tt_1: "\n@POL §Y[POL.getname]§!: §YВосточный регион§! §Gвосстановлен§!"
 POL_win_of_intermarium_tt_2: "\n@ROM §Y[ROM.getname]§!: §YВосточный регион§! §Gрасширен§!"
 POL_win_of_intermarium_tt_3: "\n@ROM §Y[ROM.getname]§!: §YБессарабия§! §Gвосстановлена§!"
