 #Всплывающее окно
 POL_country_intro_header: "§9Нация ликования и независимости§!"
 POL_country_intro_content: " Не так давно флаг Польши гордо развевается в Варшаве. Польша провела долгие века под сапогами других стран и является молодой нацией, получившей независимость чуть более 30 лет назад.\n\nНачав появляться с силой в истории около X века, согласно славянскому мифу об основании, Польша была основана Лехом, одним из трех братьев — Леха, Чеха и Руса, — который двинулся на запад. С принятием католичества Королевство Польское вошло в средневековую историю; несмотря на периоды расцвета, оно пережило войны со Священной Римской империей и вторжение Монгольской империи. Однако в XIV веке оно переформировалось в польско-литовскую династическую унию, поднялось как великая держава и достигло своего апогея. Но белохвостый орел, чей взмах крыльев уже утомился, вступил с XVII века в эпоху кризиса, известную как Великий потоп, и, наконец, испытал унижение, будучи трижды разделенным между Пруссией, Россией и Австрией. После этого, пока в Западной Европе без устали бушевал вихрь истории, поляки могли только наблюдать, разделенные на три части.\n\nИ все же время в конце концов склонится в пользу Польши. Великая война, окрасившая кровью начало XX века, привела к тому, что Германия «освободила» российскую Польшу как «Регентское королевство»; после капитуляции Германии возникла «Вторая Польская Республика», которая сдержала западное наступление Советов и, оккупировав Центральную Литву, выросла в среднюю державу в Восточной Европе.\n\nПолитика молодой Польши была в целом нестабильной. В отличие от Запада, который мог сосредоточиться на восстановлении после Великой войны, Польша оказалась втянута в войны с СССР, территориальные споры с соседними государствами и стычки с немецкими ополченцами. Эта нестабильность достигла кульминации в перевороте Пилсудского в 1926 году, после которого движение Санация, сформированное Пилсудским и его сторонниками, в конечном итоге доминировало в польской политике до наших дней.\n\nК ноябрю 1935 года Польша впервые в своей истории столкнулась с необходимостью сражаться с существами, не являвшимися людьми. Эти существа, называемые «Кивотос», переместились на Землю и атаковали западные территории Польши. Польская армия сопротивлялась, но из-за технологического и тактического разрыва была вынуждена отступить. Кроме того, в результате хаоса, возникшего на западе, на советско-польской границе вспыхнули мелкие военные столкновения, которые вскоре переросли в войну.\n\nВо Второй советско-польской войне Польша не смогла повторить чудо 1919 года. Но плачевное состояние Красной армии обнажилось на многих фронтах, и СССР уже не мог продолжать продвижение по польской территории. Таким образом, путем быстро подписанного мирного соглашения Польше удалось выиграть краткую передышку… хотя также стало ясно, что Польша окружена как с востока, так и с запада.\n\nМежду Россией, ищущей третьего шанса, и Тринити, вооруженной технологиями будущего, судьба Польши начинает разворачиваться.\n\n§YРазработчик: AfterImage§!"
 POL_guide: "\n£white_dot Укрепи мощь Польши.\n£white_dot Верни утраченные западные и восточные территории.\n£white_dot Собери как можно больше союзников, чтобы противостоять СССР.\n£white_dot Останови последнюю войну захватчиков из другого мира.\n\n\n§9Польша снова восстанет!§!"

 SOV_country_intro_header: "Падение империи"
 SOV_country_intro_header_1: "После того как осядет пыль"
 SOV_country_intro_header_2: "Борьба за власть"
 SOV_country_intro_header_3: "Вторая советско-польская война и Великая чистка"
 SOV_country_intro_content: "Унизительное поражение в Русско-японской войне и Кровавое воскресенье, когда народ отвернулся от царя, стали стартовым сигналом, возвестившим о падении великой империи Востока.\n\nКогда два выстрела прогремели в Сараево, Босния, и разразилась Великая война, Россия, благодаря неожиданно быстрому указу о всеобщей мобилизации, сначала добилась также неожиданных успехов. Но они были недолгими. Поражение при Танненберге обнажило слабости Российской империи, и Брусиловский прорыв в конечном счете сокрушил императорскую армию. С крахом армии немецкие войска быстро оккупировали Прибалтику и продвинулись по Беларуси и Украине. Чтобы остановить ухудшение, Николай II лично принял командование, но эффект был обратным.\n\n8 марта 1917 года история открыла новую главу: Романовы, правившие 300 лет, пали, и на их руинах родилась новая республика. Однако эта республика попыталась продолжить войну и только повторяла изнурительные отступления. Владимир Ленин и большевики не упустили возможность и провозгласили Октябрьскую революцию."
 SOV_country_intro_content_1: "Когда пыль Гражданской войны в России осела, на землях, которые были Российской империей, возник Союз Советских Социалистических Республик с бесспорным правителем. Но цена гражданской войны была ужасающей: десять миллионов человек погибли, производство стали упало, а рекордная засуха принесла голод. Это была удручающая ситуация. Ленин ввел Новую экономическую политику для восстановления экономики и посвятил свои усилия послевоенному восстановлению.\n\nБудучи тяжело ранен в результате неудавшегося покушения в 1918 году, Ленин был ослаблен последствиями пуль и накопленным истощением; не имея возможности вести нормальную деятельность, он постепенно отдалялся от центра власти.\n\nВ 1924 году Ленин наконец умер от этих последствий, и внутри Коммунистической партии началась неразбериха."
 SOV_country_intro_content_2: "После смерти Ленина внутри Партии началась борьба за власть. В частности, противостояние между Сталиным и Троцким было ожесточенным. Сталин противопоставил теории перманентной революции Троцкого тезис о построении социализма в одной стране. Неоднократные отсутствия Троцкого в Центральном Комитете, наряду с наступлением блока Сталин-Зиновьев-Каменев, вытеснили его из центра власти, подтолкнув к изгнанию и уступив место системе «тройки».\n\nНо, как многие и ожидали, тройка просуществовала недолго. Когда отношения между Зиновьевым-Каменевым и Сталиным испортились, первые вытащили на свет тему внутрипартийной демократии — которую отстаивал Троцкий — чтобы атаковать Сталина. Со своей стороны, Бухарин, всколыхнувший страну своим знаменитым призывом «обогащайтесь», также критиковал Сталина, обвиняя его в легкомысленном отношении к капитализму.\n\nБлок Зиновьева-Каменева, даже включив в себя сосланного Троцкого, был вновь заклеймен как фракционный блоком Сталина-Бухарина и исключен из Партии. В конце концов Сталину удалось также очистить Бухарина, утвердившись в качестве единоличного лидера внутри Партии."
 SOV_country_intro_content_3: "В ноябре 1935 года в Восточной Европе ощущалась нестабильная напряженность. После «Великого Переноса» граница между Польшей и Советским Союзом стала пороховой бочкой. Непрерывные стычки привели, наконец, ко Второй советско-польской войне, которой не желала ни одна из сторон.\n\nЭта неожиданная война стала ударом для обеих сторон. Она началась без подготовки, привела к огромным потерям и примерно в течение месяца истощала ресурсы и силы. В частности, жалкое состояние Красной армии обнажилось, и Сталин получил сильный удар.\n\nВ связи с этим Сталин начал планировать массовую чистку высшего военного командования и правительственных бюрократов. Это выльется в величайшую Великую чистку в советской истории.\n\n1 января 1936 года начался новый год, но небо Европы остается темным. Пока раны советско-польской войны еще не зажили, Великая чистка Сталина вот-вот начнется."
 SOV_guide: "\n[SOV.GetName]ㅣЦентральная фракция\n£white_dot Завершите Пятилетку и полностью утвердитесь как промышленная держава.\n£white_dot Очисти врагов федерации, прячущихся внутри.\n£white_dot Освободи Европу и построй социализм в одной стране.\n\n[SOV.GetName]ㅣПравая оппозиция\n£white_dot Оспорь авторитет Сталина и узурпируй его пост.\n£white_dot Заверши Новую экономическую политику и закрепи скачок к индустриализации.\n£white_dot Широко распространяй международный революционный марксизм.\n\n\n§tПролетарии всех стран, соединяйтесь!§!"

