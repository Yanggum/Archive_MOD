#Южная Конфедерация 
 CSA_eugene_talmadge: "Юджин Талмадж"
 CSA_absolutly_dixie: "Антифедеральный южанин"
 CSA_eugene_talmadge_desc: "С тех пор как Юг раскололся надвое и пал Ричмонд, не прошло и 100 лет с тех пор, как гордый Юг был оккупирован подлыми угнетателями с Севера. Затяжной экономический кризис в США и угнетение и преследования Юга заставили южан вновь вспомнить дух Конфедерации; в результате южные штаты решили отделиться от Союза и настроились на независимость. И, подобно Джефферсону Дэвису, Талмадж из Джорджии принял пост президента Конфедеративных Штатов. Это стало возможным только потому, что он никогда не забывал ценностей Юга.\n\nРодившийся в штате Джорджия, Юджин Талмадж вырос сыном бедного фермера; пройдя через адвокатуру и сельскохозяйственный журнал, он вошел в политику. Своей грубой речью и зажигательными выступлениями он завоевал фермеров и белых низшего класса и всегда призывал к созданию подлинного Юга без вмешательства федерального правительства. Даже во время Великой депрессии он яростно выступал против Нового курса, называя его «оковами Вашингтона, подавляющими свободу»; вместо этого он отстаивал укрепление власти правительства штата и защиту фермеров Юга. Во все более ухудшающейся ситуации фермеры Юга чувствуют, что только Талмадж является представителем, отстаивающим их интересы.\n\nПравительство Талмаджа характеризуется подчеркиванием южных традиций и отрицанием власти федерального правительства, при этом принимая крайний национализм и экономический популизм. При горячей поддержке своей базы белых южан Талмадж сделает все возможное, чтобы горькая история не повторилась."

