 GEM_maginot_line_french_army: "Французская армия на Линии Мажино"
 GEM_maginot_line_french_army_tt: "Удаляется, если не контролируется Линия Мажино:\n Не контролируется штат §Y[28.getName]§!\n Не контролируется штат §Y[1053.getName]§!\nНезависимость [FRM.getName] при высокой капитуляции:\n Капитуляция на §Y25%§! и выше"

 FRM_event.1.t: "Призраки Мажино"
 FRM_event.1.d: "С тенью тотальной войны, накрывающей нашу родину, и солдатами на главном фронте, истекающими кровью день за днем, пришло донесение, которого никто не ожидал. На Линии Мажино — некогда французской, но теперь под нашим контролем — были замечены странные движения. Связь с гарнизонными силами прервалась, и срочно отправленный разведывательный отряд увидел, как башни этой колоссальной крепости поворачиваются, чтобы нацелиться на нас.\n\nНад крепостью снова развевался французский триколор, который мы считали исчезнувшим. Остатки «Второй французской армии», запертые внутри и выживающие как могли, не рухнули перед голодом и отчаянием: они взяли под полный контроль крепость. Они больше не беззащитные выжившие; они называют себя «Освободительной армией Мажино» и возникли как новая враждебная сила, поддерживаемая стальной крепостью.\n\nС нашим ухудшающимся фронтом эти призраки прошлого нашли свой шанс показать себя. В тот момент, когда главный фронт рушится, как нам следует поступить с этой вышедшей из-под контроля крепостью?"
 FRM_event.1.a: "Пока оставь их. Сосредоточься на главном фронте."
 FRM_event.1.b: "Нужно устранить угрозу в тылу!"

 #Румыния (ROM)
 BA_ROM_trade_treaty_with_germany: "Торговый договор с Италией"
 BA_ROM_trade_treaty_with_germany_desc: "Мы осознаем экономический интерес, который Италия проявляет к нашей стране. По мере увеличения поставок таких товаров, как нефть, мы сможем запросить поддержку Италии для модернизации нашей армии."
 BA_ROM_invite_german_advisors: "Пригласить итальянских советников"
 BA_ROM_invite_german_advisors_desc: "Итальянская помощь необходима для модернизации нашей армии. Они обладают ноу-хау технологий, которые нам нужны; мы должны получить их поддержку через корпус советников."
 BA_ROM_invite_german_advisors_tt: "Италия получает право на военный проход через Румынию."
 BA_ROM_license_german_equipment: "Лицензии на итальянское оборудование"
 BA_ROM_license_german_equipment_desc: "Итальянское оборудование превосходит наше, но мы сможем производить это оружие по лицензии."
 BA_ROM_join_axis: "Присоединиться к Оси"
 BA_ROM_join_axis_desc: "Настало время быть вместе с Осью. Вместе с Италией мы сможем выковать великое будущее Румынии."
 BA_ROM_german_romanian_oil_exploitation_company: "Итало-румынская нефтедобывающая компания"
 BA_ROM_german_romanian_oil_exploitation_company_desc: "Итальянский спрос на нефть огромен и дает нам выгодную возможность расширить наши нефтеперерабатывающие заводы."
 BA_ROM_demand_transnistria: "Требовать Транснистрию"
 BA_ROM_demand_transnistria_desc: "Теперь мы сильны и пользуемся поддержкой итальянского престижа. Чтобы построить Великую Румынию, настал час требовать Транснистрию."
 BA_ROM_split_czechoslovakia: "Обеспечить Словакию"
 BA_ROM_split_czechoslovakia_desc: "Словакия была создана с неестественной структурой, неспособной выжить самостоятельно. Мы не можем позволить этому привести к хаосу; мы должны вмешаться до того, как ситуация станет неуправляемой."

