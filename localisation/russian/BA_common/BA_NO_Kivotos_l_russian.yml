 FRM_alsace_lorraine_republic_desc: "Недолговечная республика снова появляется перед миром. Поражение Германии и Франции заставило людей Эльзаса-Лотарингии задуматься о создании своего собственного сообщества и о самозащите. Результатом является наша республика, которая сегодня гордо сияет в Страсбурге."
 FRM_stuck_in_double: "Между двумя гигантами"
 FRM_stuck_in_double_desc: "Эльзас и Лотарингия, после унизительной оккупации Генной, столкнулись с большой дилеммой. Чтобы французская армия пришла нам на помощь, это слишком далеко от Африки. Но искать нейтралитет тоже бесполезно: у нас почти нет друзей. Мы должны добиваться собственного выживания."
 FRM_defeatism: "Пораженчество"
 FRM_defeatism_desc: "Наши офицеры и солдаты, видя, как враг из другого мира безжалостно опустошает нашу родину, заразились пораженчеством."
 FRM_isolation: "Изоляция"
 FRM_isolation_desc: "Мы сопротивляемся, цепляясь за мрачную крепость. Мы должны решить проблему истощения запасов и постоянного падения морали."

