 l_russian: 
 #Восточная Африка 
 ENG_eastern_african_unification: "Стремление к объединению Восточной Африки"
 ENG_eastern_african_unification_desc: "Концепция единого Восточноафриканского сообщества вышла на свет. Многие интеллектуалы утверждают, что сообщество необходимо для совместного сотрудничества в области продовольствия, промышленности, экономики и безопасности в Восточной Африке."
 ENG_EA_economy: "Интегрированная экономика Восточной Африки"
 
 #Египет
 EGY_Binah: "Пустынный зверь"
 EGY_Binah_desc: "До сих пор считалось, что вторжение этих неизвестных существ ограничивается только Европой. Однако в последнее время упорно ходят слухи, что в египетской пустыне появилось неизвестное существо. Власти ограничили доступ в пустыню и проводят ее обследование, чтобы подтвердить достоверность слухов."

 #Советский Союз
  #Национальный дух
 BA_SOV_toward_warsaw: "Марш на Варшаву"
 BA_SOV_toward_warsaw_tt: "Этот §Yнациональный дух§! §Gусиливается§! максимум до §Y3§! раз каждые §Y240 дней§!."
 BA_SOV_support_kriegsmarine: "Поддержка Кригсмарине"
 BA_SOV_supporting_kriegsmarine: "Поддержка Красного флота"
 BA_SOV_massive_isolation: "Колоссальная изоляция"
 BA_SOV_massive_isolation_desc: "Европа сгорела и исчезла в гигантском горниле Великой войны, и даже воздух, которым дышали наши машины, развеялся вместе с пеплом. По ту сторону океана Соединенные Штаты отстранили от нас руку с ледяным молчанием.\n\nТеперь силы Кивотоса, представленные Генеральным студенческим советом, открыли свои торговые пути через «санитарный кордон» Польши и Румынии, перекрывая дыхание Матери-России. На севере лжепророки, называющие себя Красной Зимой, призвали в снегах Норвегии призрак Троцкого. Там уже осталась только чудовищная смесь новых левых и троцкизма, скалящая зубы на родину.\n\nНо красная звезда Федерации горит ярче в испытаниях. Чтобы завершить Пятилетку, мы прорвем эту удушающую экономическую блокаду. Под советским знаменем, с несгибаемой волей народа!"
  #Модификаторы мнения
 BASOV_anti_kivotos_policies_good: "Антикивотосская политика"
 BASOV_anti_kivotos_policies_bad: "Антикивотосская политика"
  #Фокусы
 SOVEX_armed_protest_on_baltic: "Вооруженная демонстрация на Балтике"
 SOVEX_armed_protest_on_baltic_desc: "Народы [LIT.getadjective], [LAT.getname] и [EST.getname] стонут под авторитарной олигархией. Чтобы свергнуть угнетающую их капиталистическую диктатуру и освободить трудящиеся массы, необходимо провести против них освободительную операцию."
 SOVEX_operation_on_black_sea: "Операция на Черном море"
 SOVEX_operation_on_black_sea_desc: "Военно-морские силы [ROM.getadjective] и [TUR.getadjective] угрожают нашим морским путям на Черном море. Мы должны утвердить там свое превосходство с помощью десантов на побережье."
 BA_SOV_armed_protest_modifier: "Наступательный план"
 SOVEX_Helsinki_secret_treaty: "Хельсинкский секретный пакт"
 SOVEX_Helsinki_secret_treaty_desc: ""
 SOVEX_overthrow_the_Holy_League: "Свергнуть «Священную лигу»"
 SOVEX_overthrow_the_Holy_League_desc: "«Священная лига», созданная монархами Старого Света для сдерживания Французской революции, переформировывается, чтобы снова раздавить нашу революцию. Мы больше не можем терпеть контрреволюционные действия этих западных государств. Мы должны превентивным ударом вырвать угрозу с корнем!"
 SOVEX_eastern_bloc: "«Восточный блок»"
 SOVEX_red_scandinavia: "Северное наступление"
 SOVEX_day_of_shame: "День позора"
 SOVEX_reduce_authority_of_secretariat: "Уменьшить полномочия Секретариата"
 SOVEX_red_revenge: "Красная месть"
 SOVEX_second_western_offensive: "Второе западное наступление"
 SOVEX_second_western_offensive_desc: "С падением Варшавы вызов Польши подошел к концу. По мере ускорения краха западной гегемонии пламя революции разгорается среди народов каждой страны. Они уже жаждут прихода Красной армии. Великий путь на Запад открыт, и Красная армия готова ответить на зов истории."

 SOVEX_anti_kivotos_policies: "Антикивотосская политика"
 SOVEX_anti_kivotos_policies_desc: "Мирного сосуществования с академиями Кивотоса быть не может. Мы должны обеспечить как можно больше союзников и подготовиться к неизбежному столкновению."
 SOVEX_approach_milenium: "Сближение с Миллениумом"
 SOVEX_approach_milenium_desc: "Нет причин не примириться с Миллениумом. Конечно, мы не сможем сосуществовать мирно вечно, но они не нападут первыми."
 SOVEX_liberate_oppressed_nations: "Освободить угнетенные нации"
 SOVEX_liberate_oppressed_nations_desc: "Западные державы угнетали и эксплуатировали бесчисленные народы в своих империалистических интересах. После Великого Переноса, когда их метрополии исчезли, это усилилось еще больше! Мы должны освободить эти угнетенные народы и помочь им самим решать свою судьбу."
 SOVEX_partnership_with_kriegsmarine: "Оказать давление на Кригсмарине"
 SOVEX_partnership_with_kriegsmarine_desc: "Для беспрепятственных операций на Балтике сотрудничество с [GEK.getadjective] необходимо. Если мы не можем сотрудничать, мы должны хотя бы помешать их действиям."
 SOVEX_partnership_with_kriegsmarine_tt: "\nПравительство §Y[GEK.getname]§! учредит §Yвоенную администрацию§! и, вместо того чтобы спешить с восстановлением §Yметрополии§!, §Gповернет§! к осторожной нейтральной позиции, §Yпро-[SOV.getadjective]§!."
 SOVEX_border_force_expansion: "Расширить пограничные войска"
 SOVEX_border_force_expansion_desc: "Теперь, когда тишина опустилась на руины Англии, Франции и Германии, больше нет причин колебаться. Мы перебросим все силы с Востока на Запад, чтобы бросить Красную армию на Запад. Бремя истории требует этого мгновения. Там, где пали старые великие державы, мы должны написать новую страницу."
 SOVEX_subjugation_of_western_allies: "Подчинить западных союзников"
 SOVEX_subjugation_of_western_allies_desc: "С крахом европейского рынка западные союзники погрузились в огромный экономический кризис. Их мощь медленно рушится, но мы стоим твердо. Теперь мы должны надавить на них, чтобы, пока наше наступление на Запад продвигается, они больше не могли быть помехой."
 SOVEX_italy_strategic_alliance: "Стратегический союз с [ITA.GetAdjective]"
 SOVEX_italy_strategic_alliance_desc: "[ITA.GetAdjective] — важный союзник, разделяющий нашу решимость даже в хаосе Европы. Их стратегическое положение и способность принимать решения станут большой поддержкой для продвижения на Запад. Мы будем сотрудничать с [ITA.GetAdjective], чтобы выковать новый порядок среди руин Запада."
 SOVEX_operatsiya_operation: "Операция: Красная буря"
 SOVEX_operatsiya_operation_desc: "Степь!\nБескрайняя степь!\nПо степи движутся герои.\nДа, герои Красной армии!\nНаши кони быстры, и наши танки тоже!\n- Степь"

 SOVEX_soviet_federation_declaration_of_national_humanism: "Декларация Человеческого Союза"
 SOVEX_soviet_federation_declaration_of_national_humanism_tt: "Этот национальный дух приведет к тому, что если §Y[SOV.GetNameWithFlag]§! начнет §YВторое западное наступление§!, мы временно не сможем присоединиться ни к какой войне."
 SOVEX_soviet_federation_declaration_of_national_humanism_2: "Политика невмешательства в Европе"
 SOVEX_soviet_federation_declaration_of_national_humanism_2_desc: "Советская пропаганда оказывает сильное влияние на наших граждан, делая невозможным для нас остановить советское наступление."
 SOVEX_soviet_proposal: "Советское предложение"
 SOVEX_soviet_proposal_tt: "Этот национальный дух, если §Y[SOV.GetNameWithFlag]§! начнет §YВторое западное наступление§!, превратится в цели войны против основных стран Кивотоса."
  #События
 BA_sov_event.1.t: "Поворот внешней политики"
 BA_sov_event.1.d: "Феномен «Великого Переноса» в Западной Европе, вторая война с Польшей и падение капиталистических держав Западной Европы заставили нас полностью пересмотреть и переписать наши внешнеполитические планы такими, какими мы их себе представляли. Коммунистическая партия и Народный комиссариат иностранных дел срочно разрабатывают новые дипломатические тезисы, которые сильно повлияют на нашу внешнюю политику в будущем."
 BA_sov_event.1.a: "Нестабильные времена."
 BA_sov_event.1_tt: "§Y$SOV_anti_fascist_policies$§! фокус §Rдеактивирован§!\n§Y$SOV_approach_germany$§! фокус §Rдеактивирован§!\n§Y$SOV_send_military_advisors_to_spain$§! фокус §Rдеактивирован§!\n\n"
 BA_sov_event.3.t: "[SOV.getadjective]-[MIL.getadjective] торговое соглашение"
 BA_sov_event.3.d: "Посол [SOV.getadjective] связался с нашими дипломатами и предложил торговое соглашение между двумя странами. Согласно предложению, [SOV.getname] будет поставлять нам сырье, такое как зерно, хлопок, нефть, металлическая руда и каучук. Взамен [SOV.getadjective] потребовали от нас соответствующих знаний в области фундаментальной науки и инженерных технологий.\nЭто соглашение, несомненно, поможет в войне против враждебных государств Кивотоса."
 BA_sov_event.3.b: "Мы не будем делиться с ними нашими технологиями!"
 BA_sov_event.4.t: "Подписание [MIL.getname] $BA_sov_event.3.t$"
 BA_sov_event.4.d: "Дипломат из [FROM.GetAdjective] сообщил нам, что они примут наше предложение. Теперь мы официально подписали торговое соглашение: [SOV.GetNameDef] будет поставлять [FROM.GetNameDef] зерно, хлопок, нефть, металлическую руду и каучук. Взамен мы получим знания в области фундаментальной науки и инженерных технологий.\nЭто соглашение, несомненно, поможет развитию нашей современной военной техники."
 BA_sov_event.4.a: "Это будет полезно для родины."
 BA_sov_event.5.t: "Давление Красного флота"
 BA_sov_event.5.d: "Красный флот [SOV.getadjective] блокирует восточное побережье Готланда и поставляет нам материалы. Это неприятно, но мы можем воспользоваться их помощью."
 BA_sov_event.5.a: "Сейчас не время обращать внимание на цвет кошки!"
 BA_sov_event.6.t: "Демонстрация силы [SOV.getadjective]"
 BA_sov_event.6.d: "Силы [SOV.getname] часто организуют демонстрации силы в Балтийском регионе. Эти действия повышают напряженность в этом районе и увеличивают риск военного столкновения между [SOV.getadjective] и государствами Балтии."
 BA_sov_event.6.a: "Запугайте их!"
 BA_sov_event.6.b: "Противостой угрозе!"
 BA_sov_event.7.t: "Военно-морские учения [SOV.getadjective]"
 BA_sov_event.7.d: "Силы [SOV.getname] часто организуют военные учения на Черном море. Эти действия повышают напряженность в этом районе и увеличивают риск военного столкновения между [SOV.getadjective] и странами Черного моря."
 BA_sov_event.8.t: "Уроки поля боя"
 BA_sov_event.8.d: "По мере продолжения войны мы смогли беспрепятственно разрабатывать стратегии и тактики против [POL.getfactionname]. Теперь, основываясь на этих уроках, мы сможем улучшить военную подготовку и боевую готовность."
 BA_sov_event.8.a: "Давайте сосредоточимся на удержании фронта!"
 BA_sov_event.8.b: "Нужна мобильная оборона."
 BA_sov_event.9.a: "Начнем операцию на Ближнем Востоке."
 BA_sov_event.9.b: "Мы должны раздавить мятежников."
 BA_sov_event.10.a: "Сокруши Балтику!"
 BA_sov_event.10.b: "К Черному морю!"

