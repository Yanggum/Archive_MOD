 BA_ITA_IDEA_FRA_CHIMGONG: "Санкции Лиги Наций"
 BA_ITA_IDEA_FRA_CHIMGONG_desc: "Королевство Италия 15 декабря 1935 года напало на Третью Французскую республику — захваченную иноземцами — даже без формального объявления войны. Лига Наций квалифицировала это действие как «акт очевидной агрессии» и «предательство человечества», и Королевство Италия оказалось в мировой изоляции из-за санкций. Эти последствия не скоро закончатся."

 #Япония — национальный дух
 JAP_china_hater: "Неудержимый экспансионизм"
 JAP_china_hater_desc: "Ресурсы Японской империи скудны, но континент — и граничащая с нами Китайская Республика — обладают ресурсами и огромной рабочей силой, с потенциалом стать угрозой для нас.\n\nЯпонский народ хочет войны. Наша армия не готова, но вражескую армию трудно назвать армией. Если мы ударим, чтобы вызвать потрясение, разгромим их силы и закончим войну быстрым продвижением, мы сможем удовлетворить народ обильными ресурсами и населением континента."
 BA_JAP_have_china_hater_TT: "(§Y@CHIПолевые командиры§!) Бонус к атаке против них: §G+5.00%§!"
 BA_JAP_have_china_hater_2_TT: "(§Y@CHIПолевые командиры§!) Штраф к защите против них: §R-5.00%§!"

 #Китай — национальный дух
 CHI_revange_of_Najing: "Война Сопротивления"
 CHI_revange_of_Najing_desc: "Республика ранена. Япония, без надлежащего объявления войны, ворвалась от Пекина до Нанкина на большой скорости, отняв у нас жизненно важные ресурсы и жизни невинных без разбора. Но этот ужас, вместо того чтобы разделить нас, объединил народ: он пробудил нашу решимость. Наш народ будет сопротивляться и сопротивляться… до последнего вздоха."

