 POL_road_to_intermarium_union: "Федерация Междуморья"
 POL_road_to_intermarium_union_desc: "Междуморье родилось как смелый план, основанный на надежде, что если малые государства Восточной Европы и Польша объединят силы, они смогут противостоять двум колоссальным угрозам: Германии и Советскому Союзу. Это было больше, чем просто политический союз: это была отчаянная мечта народов, жаждущих свободы и независимости.\n\nНо по прихоти судьбы архитектор этого великого проекта, Пилсудский, внезапно скончался, и пламя Междуморья, казалось, угасло. С его смертью померкли и надежды многих.\n\nОднако история иногда течет неожиданными путями. Сражаясь с огромным врагом — Советским Союзом — между этими странами родилась связь, скрепленная кровью. Эта солидарность, выкованная в огне войны, была сильнее любого политического пакта прошлого.\n\nТеперь нации между Балтийским и Черным морями рассматривают новую возможность. Если те, кто разделял одни и те же страдания, объединятся в одно целое, они смогут не только поддерживать альянс, но и мечтать о рождении подлинной федерации. Это уже будет не линия на карте, а твердое сообщество, объединенное стремлением к свободе и независимости."
