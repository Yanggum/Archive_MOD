 POL_moving_germans_later: "Последствия миграции перемещенных немцев"
 POL_moving_germans_later_desc: "Из-за политики полонизации, проводимой в восточных регионах Германии, которые аннексировала Польша, многие немцы потеряли свои дома и переселились в [ROOT.getname]. Мы оказались в ситуации, когда должны о них позаботиться."

 POL_moving_germans: "Миграция перемещенных немцев"
 POL_moving_germans_desc: "Из-за политики полонизации, проводимой в восточных регионах Германии, которые аннексировала Польша, многие немцы теряют свои дома и переселяются в [ROOT.getname]. Мы оказались в ситуации, когда должны о них позаботиться."

