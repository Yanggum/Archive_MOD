 POL_win_of_intermarium_tt_11: "\n@PER §Y[PER.getname]§!: §Y[TMS.getname]§! §Gправительство установлено§!"
 POL_win_of_intermarium_tt_12: "\n@ROM §Y[ROM.getname]§!, @TUR §Y[TUR.getname]§!: §Y[CRI.getname]§! §GОсвобожден и нейтрализован§!"
 POL_win_of_intermarium_tt_13: "\n@BLR §Y[BLR.getname]§!: §YЗападная территория§! §Gвосстановлена§!"

 BA_pol_event.5.t: "Советский отказ"
 BA_pol_event.5.d: "Несмотря на уже предрешенный ход войны, Советский Союз предпочел продолжить сопротивление."
 BA_pol_event.5.a: "Какие глупцы!"

 BA_pol_event.6.t: "Горкинская конференция"
 BA_pol_event.6.d: "С успехом карательного наступления против [SOV.getname] больше нет причин вести войну на истощение. Мы воспользуемся нашим преимуществом, чтобы вырвать у Советского Союза территории Восточной Европы и другие необходимые вещи и заняться более важными делами."
 BA_pol_event.6.a: "Война — это тоже дипломатия."

 BA_pol_event.7.t: "План Восточной крепости Междуморья"
 BA_pol_event.7.d_1: "Министерство иностранных дел [POL.getname] запросило у нас сотрудничество в строительстве совместной крепости на востоке против большевистского империализма."
 BA_pol_event.7.d_2: "Мы построим совместную крепость на востоке против большевистского империализма."
 BA_pol_event.7.a: "Лучше перебдеть, чем недобдеть."
 BA_pol_event.7.b: "Это необязательно."

 BA_pol_event.8.t: "Конец советско-польской войны"
 BA_pol_event.8.d: "Рано утром министерства иностранных дел Польши и Советского Союза выпустили совместное заявление. Оно включает, среди прочего, прекращение огня и независимость части государств-членов федерации. На практике это равносильно тому, что Советский Союз признает свое поражение, и Польша твердо получила компенсацию за два своих прошлых поражения."
 BA_pol_event.8.a: "Это наша победа!"
 BA_pol_event.8.b: "Это лишь небольшой откат."
 BA_pol_event.8.c: "Советский Союз в опасности."

 BA_pol_event.9.t: "Ситуация в Польше"
 BA_pol_event.9.d: "«Что оставила нам война?»\n\n Движение Санация, руководившее Польской Республикой последние десять лет, переживает мрачные времена после смерти нашего лидера Пилсудского. Поражения как на западе, так и на востоке посеяли во всем обществе всеобъемлющее чувство пустоты и пораженчества.\n\n Но это не единственное, что у нас осталось. Наш лидер Пилсудский завещал нам великую внешнюю политику: «Междуморье». Хотя наши предыдущие шаги — гегемонистские и милитаристские — стали препятствием для создания альянса, пересекающего моря, незаконное советское вторжение, продолжавшееся до всего лишь нескольких дней назад, стало великой угрозой для всех суверенных государств Восточной Европы. Перед лицом твердого строя объединенных независимых государств мы сможем противостоять большевистскому наступлению!"
 BA_pol_event.9.a: "Польша не склоняется!"
 BA_pol_event.9.b: "Попробуем жалкое сопротивление."

 BA_pol_event.10.t: "Требование [POL.getName] о вступлении в федерацию"

 BA_pol_event.11.t: "Укрепления построены"
 BA_pol_event.11.d: "Благодаря сотрудничеству мы смогли быстро установить линию обороны."
 BA_pol_event.11.a: "Хорошо."
 BA_pol_event.11_tt: "Из союзников §Y[?POL.POL_bunker_var]§! стран(а/ы) участвовали в строительстве укреплений, возведено §G[?POL_bunker_num_var]§! уровней §Yкрепости§!.\n\n"
 BA_pol_event.11_tt_1: "Из союзников §Y[?POL.POL_bunker_var]§! стран(а/ы) участвовали в строительстве укреплений, возведено §G[?POL_bunker_num_var]§! уровней §Yкрепости§!.\n\n"
 BA_pol_event.11_tt_2: "Из союзников §Y[?POL.POL_bunker_var]§! стран(а/ы) участвовали в строительстве укреплений, возведено §G[?POL_bunker_num_var]§! уровней §Yкрепости§!.\n\n"

 BA_pol_event.12.t: "Прометеизм"
 BA_pol_event.12.d: "«Прометеизм», политический план, инициированный с 1918 года Юзефом Пилсудским из Второй Польской Республики, имел целью ослабить [SOV.getadjective] путем поддержки националистических движений за независимость среди основных нерусских народов, живущих в границах [SOV.getadjective]. Теперь, когда война с [SOV.getadjective] началась, благодаря этой кампании мы можем вести войну более эффективно."
 BA_pol_event.12.a: "Свергнем Россию!"

 BA_pol_event.13.t: "Зимняя подготовка Междуморья"
 BA_pol_event.13.d: "Под руководством армии нашего твердого союзника [FIN.getname] страны-союзники Междуморья научились преодолевать холод."
 BA_pol_event.13.a: "Пусть зима поможет нам."

 BA_pol_event.14.t: "Инвестиции [FROM.getname] в судостроительную промышленность [NOR.getadjective]"
 BA_pol_event.14.d: "Правительство [POL.getadjective] инвестировало в нашу судостроительную промышленность, чтобы противостоять надвигающейся угрозе."
 BA_pol_event.14.a: "Это разумно."

 BA_pol_event.15.t: "Поставка шведской древесины"
 BA_pol_event.15.d: "Правительство [SWE.getadjective] решило поставлять дешевую древесину всем союзникам [POL.getfactionname]."
 BA_pol_event.15.a: "Сотрудничество делает нас сильнее!"

 BA_pol_event.16.t: "Партнерство с VEF"
 BA_pol_event.16.d: "VEF, электронная промышленность нашего твердого союзника [LAT.getname], согласилась поддержать весь альянс инженерным оборудованием."
 BA_pol_event.16.a: "Спасибо."

 BA_pol_event.17.t: "Текстильная промышленность [LIT.getadjective]"
 BA_pol_event.17.d: "Текстильные компании [LIT.getadjective] производят униформу по низкой цене для альянса."
 BA_pol_event.17.a: "Хорошо."

 BA_pol_event.18.t: "Поддержка добычи сланцевой нефти со стороны [FROM.GetAdjective]"
 BA_pol_event.18.d: "С тех пор как первая сланцевая нефть была впервые произведена на родине в 1921 году, и до тех пор, пока в 1924 году не была использована первая электроэнергия из сланцевой нефти в электросети, многие не считали сланцевую нефть важным ресурсом. Однако, вопреки нерешительности скептиков, в 1937 году мы смогли добыть миллион тонн горючего сланца за один год. Воодушевленные этими достижениями, наш союзник [FROM.getname] решил вложить больше капитала в наши предприятия по добыче сланца, чтобы подготовиться к войне с [SOV.getadjective]."
 BA_pol_event.18.a: "Спасибо!"
 BA_pol_event.20.t: "Судьба Восточной Германии"
 BA_pol_event.20.d: "Мы должны решить судьбу Восточной Германии, включая Берлин."
 BA_pol_event.20.a: "Вернем ее Вермахту."
 BA_pol_event.20.b: "Превратим Тринити в государство-марионетку."
 BA_pol_event.20.c: "Польша аннексирует Восточную Германию!"
 BA_pol_event.20.e: "Вернем ее Пруссии."

 BA_pol_event.21.t: "Судьба Мемеля"
 BA_pol_event.21.d: "Мы должны решить судьбу Мемеля, который был самой восточной территорией бывшей Германской империи."
 BA_pol_event.21.a: "Вернем его Литве."
 BA_pol_event.21.b: "Польша аннексирует его!"

 BA_pol_event.22.t: "Судьба Кенигсберга"
 BA_pol_event.22.d: "Мы должны решить будущую судьбу Кенигсберга, колыбели Пруссии."
 BA_pol_event.22.a: "Отправьте всех учениц с территории, оккупированной Переносом, и реорганизуйте ее в автономное государство."
 BA_pol_event.22.b: "Вернем его Вермахту."
 BA_pol_event.22.c: "Отделить Восточную Пруссию от Германии и превратить ее в государство-марионетку."
 BA_pol_event.22.g: "Отдайте его Пруссии."
 BA_pol_event.22.f: "Вернем его Тринити."
 BA_pol_event.22.e: "Кенигсберг наш!"

 BA_pol_event.23.t: "Судьба [5.getName]"
 BA_pol_event.23.d: "Мы должны решить судьбу [5.getName]."
 BA_pol_event.23.a: "Отдайте его Пруссии."
 BA_pol_event.23.b: "Вернем его Вермахту."
 BA_pol_event.23.c: "Отдайте его Тринити."
 BA_pol_event.23.e: "Польша аннексирует его!"

 BA_pol_event.24.t: "Судьба Гданьска"
 BA_pol_event.24.d: "Мы отомстили за унижение, когда Гданьск был временно оккупирован силой из другого мира по имени Ариус. Теперь мы решим судьбу Гданьска."
 BA_pol_event.24.a: "Восстановим отряд Ариус."
 BA_pol_event.24.b: "Уступим его Пруссии."
 BA_pol_event.24.c: "Гданьск — польская территория!"

 BA_pol_event.25.t: "[63.getname] и [68.getname]"
 BA_pol_event.25.d: "Мы должны решить судьбу [63.getname] и [68.getname]."
 BA_pol_event.25.a: "Отдайте их Восточной Германии."
 BA_pol_event.25.b: "Мы полонизируем этот регион."

 BA_pol_event.26.t: "Немецкие территории с польским населением"
 BA_pol_event.26.d: "Мы должны решить, что делать с нашими западными территориями, возвращенными в результате Великой войны."
 BA_pol_event.26.a: "Отдайте их Восточной Германии."
 BA_pol_event.26.b: "Эти земли принадлежат Польше!"

 BA_pol_event.27.t: "Судьба [66.getname]"
 BA_pol_event.27.d: "Мы должны решить судьбу [66.getname]."
 BA_pol_event.27.a: "Давайте сделаем Силезию независимой."
 BA_pol_event.27.c: "Отдайте его Восточной Германии."
 BA_pol_event.27.b: "Аннексируем его Польшей."

 BA_pol_event.28.t: "[67.getname]"
 BA_pol_event.28.d: "Мы также должны решить судьбу [67.getname]."
 BA_pol_event.28.a: "Уступите его Силезии."
 BA_pol_event.28.b: "Аннексируем."

 BA_pol_event.29.t: "Судьба Западной Германии"
 BA_pol_event.29.d: "Мы должны решить судьбу земель к западу от реки Везер."
 BA_pol_event.29.a: "Вернем ее Вермахту."
 BA_pol_event.29.b: "Освободите Общество Пандемониум!"
 BA_pol_event.29.c: "Раздробим ее вокруг Пруссии."
 BA_pol_event.29.e: "Раздробим ее полностью."

 BA_pol_event.30.t: "Судьба юга Германии"
 BA_pol_event.30.d: "После Западной Германии мы должны решить судьбу юга Германии, включая Баварию."
 BA_pol_event.30.a: "Передайте его Вермахту."
 BA_pol_event.30.b: "Уступите его Обществу Пандемониум."
 BA_pol_event.30.c: "Сделаем Баварию независимой."
 BA_pol_event.30.f: "Освободите Дисциплинарное управление."

 BA_pol_event.31.t: "Судьба Гольштейна и Шлезвига"
 BA_pol_event.31.d: "Мы должны решить судьбу Гольштейна и Шлезвига."
 BA_pol_event.31.a: "Вернем их Вермахту."
 BA_pol_event.31.b: "Уступите их Совету Пандемониума."
 BA_pol_event.31.c: "Отдайте их странам Севера."
 BA_pol_event.31.e: "Отдайте их Тринити."
 BA_pol_event.31.f: "Освободим Шлезвиг-Гольштейн."
 BA_pol_event.31.g: "Пусть Пруссия и страны Севера разделят их."

 BA_pol_event.32.t: "Судьба Везер-Эмса"
 BA_pol_event.32.d: "Решая судьбу Везер-Эмса, мы завершим раздел Германии."
 BA_pol_event.32.a: "Отдайте его фракции Западной Германии."
 BA_pol_event.32.b: "Отдайте его фракции Восточной Германии."

 BA_pol_event.33.t: "Название [763.getname]"
 BA_pol_event.33.d: "[763.getname] была чрезвычайно важным регионом для немцев, будучи колыбелью Пруссии. Однако, пока [763.getname] в наших руках, мы полонизируем топоним этого места или просто изменим его."
 BA_pol_event.33.a: "Уважаем немцев и изменим только произношение на польский лад."
 BA_pol_event.33.b: "Почтим лидера Санации, Пилсудского."
 BA_pol_event.33.c: "Используем имя Его Величества Короля."

 BA_pol_event.34.t: "Великий потоп"
 BA_pol_event.34.d: "Мы уже пережили Великий потоп в XVII веке. Тогда мы потерпели поражение, но сейчас все иначе. Сотни тысяч молодых людей, с мужеством Моисея, пересекающего потоп, служат, направляясь к победе, из Польши и наших союзников."
 BA_pol_event.34.a: "Пересеки Великий потоп!"

 BA_pol_event.35.t: "Песнь Междуморья"
 BA_pol_event.35.d: "О свобода, дышавшая под серым солнцем\nвосстань сейчас, на нашей земле\n\nАмбиции гегемонистских держав\nсреди них мы выжили\n\nУслышь шепот берегов Вислы\nуслышь эхо Карпат\n«Мы едины», — говорят они\n\nЧасовая башня Киева, площадь Минска\nплощадь Варшавы, улицы Бухареста\nвсе бьются в одном ритме\n\nМы не стадо овец в окружении волков\nтеперь мы стая, единая сила\n\nБратская клятва, данная хлебом и солью\nнаша мечта, защищенная кровью и слезами\nМеждуморье: в этом имени мы стоим\n\nМы вращаем колесо истории\nмы больше не игровая доска гигантов\nнаша судьба — нашими руками\n\nОт Балтийского моря до Черного моря\nнаша песня звучит"
 BA_pol_event.35.a: "\"Пусть Междуморье, свободное и сильное, будет вечным!\""

 BA_pol_event.36.t: "Предложение [FROM.GetAdjective] о присоединении к Междуморью"
 BA_pol_event.36.d: "[FROM.GetAdjective] провозгласил Федерацию Междуморья и одновременно предложил нам объединиться в федерацию."
 BA_pol_event.36.a: "Конечно! Мы едины!"
 BA_pol_event.36.b: "Наше будущее в другом месте."

 BA_pol_event.37.t: "Отказ [FROM.GetName]"
 BA_pol_event.37.d: "[FROM.GetName] отклонил наше предложение."
 BA_pol_event.37.a: "Мы понимаем их."

 BA_pol_event.38.t: "[FROM.getName] одобрил федерацию!"
 BA_pol_event.38.d: "[FROM.GetName] решил присоединиться к нашей федерации!"
 BA_pol_event.38.a: "Отлично!"

 BA_pol_event.39.t: "Судьба Рейнской области"
 BA_pol_event.39.d: "Мы должны решить судьбу Рейнской области."
 BA_pol_event.39.a: "Отдайте его Западной Германии."
 BA_pol_event.39.b: "Сделаем ее независимой."

 BA_pol_event.40.t: "Судьба Вюртемберга"
 BA_pol_event.40.d: "Мы должны решить судьбу юго-запада Германии."
 BA_pol_event.40.a: "Отдайте его Западной Германии."
 BA_pol_event.40.b: "Уступите его югу Германии."
 BA_pol_event.40.c: "Сделаем ее независимой."
 BA_pol_event.40.e: "Сформируем юг Германии вместе с Баварией."

 BA_pol_event.41.t: "Судьба Мекленбурга и Тюрингии"
 BA_pol_event.41.d: "Мы решим судьбу оставшихся немецких регионов."
 BA_pol_event.41.a: "Освободим их."
 BA_pol_event.41.b: "Превратим их в княжества Пруссии."
 BA_pol_event.41.c: "Аннексируем их Пруссией."

 BA_pol_event.42.t: "Корпус добровольцев Свободной Польши"
 BA_pol_event.42.d: "В восточных регионах, отторгнутых у Польши после второго западного наступления Советов, действуют польские националистические ополчения. Когда начнется советско-польская война, они восстанут, чтобы помочь Польше."
 BA_pol_event.42.a: "За Польшу!"
 BA_pol_event.42.b: "Это гегемонистский заговор."

 BA_pol_event.43.t: "Белорусские добровольцы"
 BA_pol_event.43.d: "В некоторых частях Беларуси существуют антикоммунистические подпольные организации, основанные на национализме. Когда начнется война между Польшей и Советами, они восстанут, чтобы помочь Польше."
 BA_pol_event.43.a: "За белорусских товарищей!"
 BA_pol_event.43.b: "Псы капиталистов."

 BA_generic_event.14.t: "Украинская национальная армия"
 BA_generic_event.14.d: "На западе Украины существуют про-польские националистические ополчения. Когда начнется война между Польшей и Советами, они восстанут, чтобы помочь Польше."
 BA_generic_event.14.a: "За украинских товарищей!"
 BA_generic_event.14.b: "Это антисоциалистический акт."

 BA_pol_event.44.t: "Восстание антисоветских националистических ополчений"
 BA_pol_event.44.d: "Подпольные вооруженные организации, поддерживаемые правительством [POL.getname], поднялись в такт нашему продвижению и присоединились к нашим рядам."
 BA_pol_event.44.a: "Спасибо."

 BA_pol_event.46.t: "Львовская декларация"
 BA_pol_event.46.d: "'Мы вновь подтверждаем, что большевизм является антисвободной идеологией, угнетающей и эксплуатирующей народ, и предлагаем создание Российского народного освободительного комитета для дебольшевизации русских земель. Этот комитет не будет распущен, пока не выполнит свою цель...'"
 BA_pol_event.46.d_1: "'Мы вновь подтверждаем, что правительство [SOV.getname] является антисвободным правительством, угнетающим и эксплуатирующим народ, и предлагаем создание [RSA.getname] для освобождения всей России. Этот комитет не будет распущен, пока не выполнит свою цель...'"
 BA_pol_event.46.a: "Сокрушим их!"
 BA_pol_event.46.b: "Наши оккупированные территории ценны."

 POL_FPV_modifier: "Корпус добровольцев Свободной Польши"
 POL_FPV_modifier_desc: ""
 POL_BVA_modifier: "Белорусские добровольцы"
 POL_UNA_modifier: "Украинская национальная армия"

 BA_intermarium_solidarity_event.1.t: "Новый союзник"
 BA_intermarium_solidarity_event.1.d: "Новый союзник, [FROM.FROM.getname], присоединился к [POL.getfactionname]. Это хорошая новость, но это также означает, что появилось еще одно мнение, которое нужно координировать."
 BA_intermarium_solidarity_event.1.a: "Отлично..."

 BA_intermarium_solidarity_event.2.t: "Объединенный военный фонд"
 BA_intermarium_solidarity_event.2.d: "Наши расходы на оборону вернулись в форме объединенного военного фонда."
 BA_intermarium_solidarity_event.2.a: "Отлично!"

 BA_intermarium_solidarity_event.3.t: "Объединенные силы обороны"
 BA_intermarium_solidarity_event.3.d: "Развернуты объединенные силы обороны, обученные на накопленном снаряжении."
 BA_intermarium_solidarity_event.3.a: "Это того стоило."

 BA_intermarium_solidarity_event.4.t: "Сепаратный мир [FROM.FROM.getname]"
 BA_intermarium_solidarity_event.4.d: "[FROM.FROM.getname] предал альянс и подписал сепаратный мир с Советским Союзом."
 BA_intermarium_solidarity_event.4.a: "Черт."

 BA_intermarium_solidarity_event.5.t: "Запрос [FROM.getname] о сепаратном мире"
 BA_intermarium_solidarity_event.5.d: "[FROM.getname] хочет договориться с нами, с условием выхода из Междуморья."
 BA_intermarium_solidarity_event.5.a: "Сделай, как они просят."
 BA_intermarium_solidarity_event.5.b: "Ни за что."

 BA_intermarium_solidarity_event.6.t: "Крах Междуморья"
 BA_intermarium_solidarity_event.6.d: "Сплоченность между союзниками была не более чем пламенем на ветру. Перед лицом гигантского врага мы в конце концов согнулись."
 BA_intermarium_solidarity_event.6.a: "Проклятье."
 #Решения
 SOV_propaganda_anti_kivotos: "Вперед, на фронт освобождения человечества!"
 BA_sov_making_ssr_cat: "Создание ССР"
 BA_sov_making_ssr_cat_desc: "ССР — это аббревиатура от «Советская Социалистическая Республика» и используется для обозначения отдельных республик, составляющих Советский Союз. СССР номинально является федерацией суверенных государств, и каждая союзная республика обладает статусом «Советская Социалистическая Республика». Теоретически ССР имела право свободно выйти из федерации, но это, вероятно, осуществилось бы только в «последний день Советского Союза»."
 POL_ssr_dec: "Создать ССР Польша"
 ROM_ssr_dec: "Создать ССР Румыния"
 TUR_ssr_dec: "Создать ССР Турция"
 KUR_ssr_dec: "Создать ССР Курдистан"
 FIN_ssr_dec: "Создать ССР Финляндия"
 PER_ssr_dec: "Создать ССР Иран"
 AFG_ssr_dec: "Создать ССР Афганистан"
 IRQ_ssr_dec: "Создать ССР Ирак"
 SOV_UKR_dokrib_ok: "В Украине вспыхнуло восстание."

 BA_sov_breakthrough_of_massive_isolation_cat: "Прорвать великую изоляцию"
 BA_sov_breakthrough_of_massive_isolation_cat_desc: "Европа, откуда мы импортировали станки и приглашали специалистов для Пятилетки, практически перестала существовать; и силы, называемые Кивотосом, сознательно участвуют в блокаде, исключая торговлю с Советским Союзом. Соединенные Штаты отвернулись от нас, и Япония следит за Дальним Востоком. Мы должны прорваться силой!"
 BA_sov_recruitment_of_exiled_european_scientists: "Нанимать европейских ученых-эмигрантов"
 BA_sov_strengthening_stakhanovite_movement: "Усилить стахановское движение"
 BA_sov_expansion_of_leningrad_machinery_institute: "Расширить Ленинградский машиностроительный институт"
 BA_sov_expansion_of_vavilov_state_optical_institute: "Расширить Государственный оптический институт имени Вавилова"
 BA_sov_expansion_of_moscow_metal_cutting_machine_tool_institute: "Расширить Московский станкоинструментальный институт"

