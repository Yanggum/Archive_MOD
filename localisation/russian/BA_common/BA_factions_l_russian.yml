 # Далее следуют манифесты фракций.

 pax_trinica_goal_name: "Мир под властью Тринити"
 pax_trinica_goal_desc: "Великий Перенос со всей очевидностью обнажил некомпетентность Генерального студенческого совета. Под руководством Мисоно Мики великая и справедливая Вторая Тринити является единственной академией, способной объединить весь Кивотос."
 gehenna_supremacy_goal_name: "Гегемония Генны"
 gehenna_supremacy_goal_desc: "Распространение порядка Генны на весь Кивотос и его объединение под ее знаменем — это высшая цель Федерации Генны."
 protection_of_the_old_trinity_order_goal_name: "Хранители традиций и порядка"
 protection_of_the_old_trinity_order_goal_desc: "Тринити и ее союзники утверждают, что они должны защищать древние традиции, унаследованные еще до Великого Переноса, сопротивляться подчинению порядку человеческих наций и сохранять культуру и мышление Кивотоса, основанные на сестринстве."
 pan_arabism_goal_name: "Арабское единство"
 pan_arabism_goal_desc: "Арабский народ слишком долго был разделен иностранными державами. Пришло время объединить его под одним знаменем!"
 gsc_supremacy_goal_name: "Контроль над Кивотосом"
 gsc_supremacy_goal_desc: "Генеральный студенческий совет должен полностью взять на себя ответственность и обязанности, соответствующие его названию, и Кивотосу суждено оставаться под его контролем, даже если рассматривать абсурдную гипотезу тотальной войны."

 # Цели
 ## Начальные цели
 one_trinity_goal_name: "Единая Тринити"
 one_trinity_goal_desc: "Чтобы преодолеть неполное наследие Первого Собора, пришло время интегрировать Филиальную школу Ариус. Это станет подлинным актом объединения Тринити и славным днем для всех ее учениц."

 ## Промежуточные цели
 goal_TRN_defeat_gehenna_name: "Контроль над городами Генны"
 goal_TRN_defeat_gehenna_desc: "Лучший способ ослабить военную мощь Генны — занять ее ключевые города. Если мы захватим главные вражеские оплоты, особенно Центральный и Южный округа, их воля к войне будет сломлена."
 goal_gehenna_defeat_trinity_name: "Контроль над оплотами Тринити"
 goal_gehenna_defeat_trinity_desc: "Ключевые оплоты Тринити являются идеальными стратегическими целями для Федерации Генны. Основная цель — Эдем, но только с падением всех значимых городов вокруг него поражение Тринити станет окончательным."
 goal_GEH_TRM_defeat_gehenna_name: "Сокрушить амбиции Пандемониума"
 goal_GEH_TRM_defeat_gehenna_desc: "Захват Центрального округа Генны и окружающих оплотов, жизненно важных центров Общества Пандемониум, является самой важной целью нашего военного плана. Не позволим флагу Пандемониума снова развеваться на этих землях."
 goal_LUX_defeat_gehenna_name: "Контроль над городами Генны"
 goal_LUX_defeat_gehenna_desc: "Чтобы учредить Германское Объединенное Герцогство под руководством Люксембурга и обеспечить долгосрочную безопасность наших союзников, ключевые города Генны должны быть оккупированы без исключения. Главная цель — Центральный округ, но только с падением всех окружающих оплотов будет подтверждено полное поражение Генны."

 ## Финальные цели
 faction_goal_no_trinity_in_gehenna_name: "Территориальная целостность Генны"
 faction_goal_no_trinity_in_gehenna_desc: "Теперь, когда Генна столкнулась с военной машиной Тринити, мы должны вернуть и сохранить нашу территорию перед лицом атак ее неумолимой волны. Генна останется единой и никогда больше не поддастся экспансионистским амбициям Тринити."
 COLLECTION_NO_TRINITY_IN_GEHENNA: "Штаты центральной территории Генны, контролируемые Тринити и ее союзниками"
 faction_goal_true_eden_treaty_name: "Единство перед лицом амбиций Пандемониума"
 faction_goal_true_eden_treaty_desc: "Пока война между Генной и Тринити усиливается, хозяйка Чаепития разрабатывает великую стратегию: изолировать географически Пандемониум посредством союза с Дисциплинарным комитетом и атаковать Центральный округ Генны с южного и восточного фронтов."