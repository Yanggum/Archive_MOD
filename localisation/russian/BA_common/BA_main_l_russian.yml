 gehenna_unification: "Объединение Академии Генна"
 gehenna_unification_desc: "После Великого Переноса кампус Генны оказался разделен на разные регионы; и после соперничества между Советом Пандемониума и Дисциплинарным комитетом академия распалась на враждующие группировки. Но теперь мы снова объединили Генну и воссоздали славное прошлое."
