 #Описание
 BA_scenario_name: "50 дней в новом мире"
 BA_scenario_desc: "Сверхъестественное явление? Или шутка Бога? Понадобилась бы тысяча лет, и всё равно не хватило бы, чтобы объяснить это. Но ожидание нового мира длилось недолго: оно разбилось вдребезги. Люди оттуда навесили на нас ярлык захватчиков и атаковали без колебаний. Из-за подавляющей разницы в силе они рухнули и пали с легкостью, но раны, которые они оставили, врезались глубоко в нас. Чтобы эта рана зажила, вероятно, потребуется много времени."

 Debug_BA_gathering_storm_desc: "Если ты меня видишь, пожалуйста, составь отчет об ошибке."
 highlight_major_1_tt: "@RED Путь §YФедеральной академии Красная Зима§!: "
 highlight_major_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_RED_path_texticon\n\n\n\n\n\n\n§YНаш лидер Черино§! - §RRенка и Черино§!\n  £white_dot §gРеволюция системы Черино§!\n  £white_dot §gМировая революция Троцкого§!\n§g========================================§!\n§YРуководство§!: Федеральная академия Красная Зима — это страна в стиле ванильной HOI4, без сюжетных событий и концовок. Рекомендуется тем, кто хочет свободную песочницу в ванильном стиле."

 highlight_major_2_tt: "@MIL Путь §YНаучной школы Миллениум§!: "
 highlight_major_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_MIL_path_texticon\n\n\n\n\n\n\n§tВсе пути не завершены!§!\n\n§YТехнократия под руководством Семинара§! - §CЦукацуки Рио§!\n  £white_dot §gУдержание власти Рио§!\n  £white_dot §gПравительство Хаясэ Юуки§!\n  £white_dot §gПравительство Усио Нои§!\n\n§YТехнократия под руководством Veritas§! - §GАкебоши Химари§!\n§g========================================§!\n§YРуководство§!: Миллениум — это страна в стиле ванильной HOI4, без сюжетных событий и концовок. Сложность низкая; рекомендуется тем, кто хочет свободную песочницу и не слишком сложный геймплей."

 highlight_major_3_tt: "@TRM Путь §YОбъединенной академии Тринити§!:"
 highlight_major_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_TRM_path_texticon\n\n\n\n\n\n\n§tВсе пути не завершены!§!\n\n§YРождение второй Тринити§! - §MМисоно Мика§!\n  £white_dot §gПостроение справедливой Тринити§!\n    £white_dot Имеет §Y2§! концовки.\n\n §YБлагородный долг§! - §LКирифудзи Нагиса§!\n  £white_dot §gНовое тысячелетие Тринити§!\n    £white_dot Имеет §Y2§! концовки.\n\n §YИстинная студенческая демократия§! - §YАджитани Хифуми§!\n  £white_dot §gРеабилитация Кирифудзи Нагисы§!\n    £white_dot Имеет §Y2§! концовки.\n  £white_dot §gПравительство Утадзуми Сакурако§!\n    £white_dot Имеет §Y1§! концовку. Существует ветка с Уравой Ханако.\n  £white_dot §gПравительство Аомори Минэ§!\n    £white_dot Имеет §Y1§! концовку.\n  £white_dot §gПрезидент совета Аджитани Хифуми§!\n    £white_dot Имеет §Y1§! концовку.\n§g========================================§!\n§YРуководство§!: Тринити — это простая сюжетная страна в формате Kaiserreich. Игра сосредоточена на прохождении фокусов; рекомендуется для начинающих в моде или тех, кто хочет насладиться легкими историями из повседневной жизни учениц Тринити."

 highlight_major_4_tt: "@COU Путь §YГенерального студенческого совета Кивотоса§!: "
 highlight_major_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_COU_path_texticon\n\n\n\n\n\n\n§YКомитет по чрезвычайным мерам Кивотоса§!\n  £white_dot §gЮраги Момока, почетный президент§!\n  £white_dot §gНанагами Рин, исполняющая обязанности президента§!\n\n§YТаящийся в темноте§! - §gШирануи Кая§! §R(Неиграбельно)§!\n§g========================================§!\n§YРуководство§!: Генеральный студенческий совет — это простая сюжетная страна в формате Kaiserreich. Сложность §Rочень высокая§!, так как с самого начала он находится под угрозой со стороны Шале; рекомендуется для продвинутых игроков."

 highlight_major_5_tt: "@GEM Путь §YОбщества Пандемониум§!: "
 highlight_major_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEM_path_texticon\n\n\n\n\n\n\n §gОбщество Пандемониум — это страна, где содержание дерева фокусов может меняться в зависимости от того, какой фокус ты завершишь первым, а также может претерпевать особые изменения из-за условий или уникальных ситуаций.§!\n\n§gБазовые деревья по лидеру§!\n  £white_dot Президент §YХанума Макото§!\n  £white_dot Президент §YКогёку Сацуки§!\n  £white_dot Президент §YНацумэ Ироха§!\n  £white_dot Президент §YМотомия Тиаки§!\n  £white_dot Президент §YТанга Ибуки§! - (§RНе завершен§!)\n\n §gФокусы входа в 'происхождение' по лидеру§!\n  £white_dot §OСостояние вечной войны§! Ханумы Макото\n  £white_dot §OМирная страна§! Когёку Сацуки\n  £white_dot §OСоединенные Штаты Генны§! Нацумэ Ирохи\n  £white_dot §OНовая администрация§! Мотомии Тиаки\n  £white_dot §OРост§! Танги Ибуки - (§RНе завершен§!)\n\n §gФокусы входа в 'происхождение' по форме правления§!\n  £white_dot Провозгласить §OГерманское государство§!\n  £white_dot Провозгласить §OФедерацию Германия–Генна§!\n  £white_dot Сохранить §OГенну§!\n\n§g========================================§!\n§YРуководство§!: Общество Пандемониум — это страна в стиле ванильной HOI4 со сложными системами и сильно разветвленными путями. У него есть запланированные войны против Дисциплинарного комитета Генны и Тринити, поэтому его сложность §Oвысокая§!. Рекомендуется для игроков среднего или продвинутого уровня, которые хотят свободную песочницу в ванильном стиле."

 highlight_major_6_tt: "@HYA Путь §YАльянса Хяккияко§!:\n\n\n\n\n\n   £GFX_HYA_path_texticon\n\n\n\n\n\n\nСильнейший: Иккаку Лев\n\n§g========================================§!\n§YРуководство§!: Хяккияко — страна §Yнормальной§! сложности в стиле песочницы: ванильная основа HOI4 с небольшим количеством сюжета. Рекомендуется тем, кто хочет играть свободно."
 highlight_major_7_tt: "@SHA Путь §YСтаршей школы Шаньхайцзин§!:\n\n\n\n\n\n   £GFX_SHA_path_texticon\n\n\n\n\n\n\nДаже лидер Кисаки использует Xiaomi\n §GНаследие красной склянки§!\n    £white_dot Возрождение островного марксизма\n    £white_dot Социализм с отличительными чертами Шаньхайцзин\n\n§g========================================§!\n§YРуководство§!: Шаньхайцзин — страна §Yнормальной§! сложности в стиле песочницы: ванильная основа HOI4 с небольшим количеством сюжета. Рекомендуется тем, кто хочет играть свободно."

 highlight_minor_1_tt: "@LUX Путь §YВеликого Герцогства Люксембург§! §g(Агентство 68)§!: "
 highlight_minor_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_HEU_path_texticon\n\n\n\n\n\n\n §gПрогерманское правительство§!\n  £white_dot Революция 68-го в Люксембурге - §G(По умолчанию)§!\n\n §gАнтигерманское правительство§!\n  £white_dot Принятие §YЗакона о гражданских правах§!\n  £white_dot Отклонение §YЗакона о гражданских правах§!\n\n§g========================================§!\n§YРуководство§!: Люксембург — страна §Rочень высокой§! сложности в сюжетном стиле с множеством событий и историй. Рекомендуется тем, кто хочет получить новый опыт в моде или интересуется историей исекая §YАгентства 68§!."

 highlight_minor_2_tt: "@GEH Путь §YДисциплинарного комитета Генны§!: "
 highlight_minor_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEH_path_texticon\n\n\n\n\n\n\n §gПравительство Соразаки Хины§!\n  £white_dot Милитаристское правительство Широми Иори\n  £white_dot Диктатура Соразаки Хины фанатичными членами\n  £white_dot Технократия Амау Ако и Отдела планирования\n  £white_dot Статус-кво\n\n §gОтставка Соразаки Хины§!\n  £white_dot Широми Иори как глава Дисциплинарного комитета\n  £white_dot Коллективное руководство фанатичных членов\n  £white_dot Правительство робота Соразаки Хины\n  £white_dot Коллективное руководство Отдела планирования\n  £white_dot Статус-кво\n§g========================================§!\n§YРуководство§!: Дисциплинарный комитет Генны — страна §Rвысокой§! сложности с простым сюжетом в формате Kaiserreich. Если ты не завоюешь всю Генну и весь Тринити за определенное время, Хина уйдет в отставку; и в зависимости от того, уйдет она или нет, история полностью меняется. Рекомендуется тем, кто ищет сложный геймплей."

 highlight_minor_3_tt: "@ABY Путь §YСтаршей школы Абидос§!:"
 highlight_minor_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ABY_path_texticon\n\n\n\n\n\n\n §4Восстановить наследие Масарика§!\n  £white_dot §gХозяева этой земли§! - §YМестное правительство§!\n    £white_dot Имеет §Y1§! концовку. - (§RНе завершена§!)\n  £white_dot §gСтрана двух миров§! - §tОкусура Аянэ§!\n    £white_dot Имеет §Y1§! концовку. - (§RНе завершена§!)\n\n§4Демократия, свеча на ветру§!\n  £white_dot §gГремящие ключи§! - §CСунаоками Сироко§!\n    £white_dot Имеет §Y2§! концовки. - (§Y1 концовка завершена§!)\n  £white_dot §gИстинная демократия народа§! - §PТаканаси Хосино§!\n    £white_dot Имеет §Y1§! концовку. - (§RНе завершена§!)\n\n§4Война безумцев§!\n  £white_dot §gМесть за мертвых.§! - §0Куроми Сэрика§!\n    £white_dot Имеет §Y2§! концовки. - (§RНе завершены§!)\n  £white_dot §gОсвети весь Кивотос.§! - §LАсагири Суо§!\n    £white_dot Имеет §Y1§! концовку. - (§RНе завершена§!)\n  £white_dot §gЛидер, потерявший власть.§! - §8Идзаёи Нономи§!\n    £white_dot Имеет §Y1§! концовку. - (§RНе завершена§!)\n§g========================================§!\n§YРуководство§!: Абидос — страна §Rвысокой§! сложности в сюжетном стиле, ориентированном на события. Большинство путей сотрудничают с местными жителями и стремятся завершить демократическую систему. Существует исторический персонаж, выполняющий роль 'Сэнсэя'; сюжет больше сосредоточен на взаимодействии/конфликте между кивотосцами и местными жителями, чем на внутренних раздорах между ученицами.\n§YРекомендуется тем, кто предпочитает истории между кивотосцами и местными жителями.§!"

 highlight_minor_4_tt: "@FRA Путь §YФранцузской Республики§!:"
 highlight_minor_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_FRA_path_texticon\n\n\n\n\n\n\n §YПуть к родине§!\n  £white_dot §g'Верденский лев'§! - §4Филипп Петэн§!\n  £white_dot §g'Искры Республики'§! - §tЖорж Гамелен§!\n  £white_dot §g'Лотарингский крест'§! - §YШарль де Голль§!\n§g========================================§!\n§YРуководство§!: Французская Республика — это страна в стиле ванильной HOI4, без сюжетных событий и концовок. Рекомендуется тем, кто хочет свободную песочницу в ванильном стиле."

 highlight_minor_5_tt: "@ARI Путь §YФилиала Ариус§!:"
 highlight_minor_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ARI_path_texticon\n\n\n\n\n\n\n §gАриус — это страна с уникальной структурой прогресса: по мере расширения его путь становится все шире.§!\n\n§gПравительство Отряда§!\n  £white_dot Победа консерваторов - (§CДоступно!§!)\n  £white_dot Победа реформистов - (§RНе завершено§!)\n  £white_dot Ничья - (§RНе завершено§!)\n\n§g========================================§!\n§YРуководство§!: Филиал Ариус балансирует между сюжетными событиями и стилем ванильной HOI4. У него есть запланированная война против Тринити, и его сложность §Rочень высокая§!. Рекомендуется для продвинутых игроков или для тех, кто хочет пережить историю Ариус."

 HYA_GATHERING_STORM_DESC: "Академия культуры и фестивалей, гордящаяся своей долгой историей и традициями. Хяккияко, как до, так и после Великого Переноса, продолжает жить хлопотливыми днями в огнях культурного фестиваля.\n\nНо мы больше не можем вечно наслаждаться фестивалем: мы должны принять реальность. Великая война, беспрецедентное событие, потрясла основы Кивотоса; и Хяккияко, как свисающая ветвь дерева, также должна принять перемены.\n\nДепартамент Инь-Ян, традиционно заменявший студенческий совет; Хяккарёран, получивший влияние после Великого Переноса; и многие другие борются, ища свой шанс."

 KSP_GATHERING_STORM_DESC: "Полицейская академия Валькирия пострадала больше всех среди академий от Великого Переноса. Ученицы, которые были рассеяны по всему Кивотосу, потеряли всякую связь в момент переноса, и до сих пор не удалось восстановить связь с ними. Кроме того, с крахом Исправительного управления Валькирии наиболее опасные элементы Кивотоса пытаются сбежать.\n\nСреди этих кризисов Канна делает всё возможное, чтобы возглавить Полицейскую академию Валькирия… но как долго она сможет продержаться?"

 SRT_GATHERING_STORM_DESC: "Известная своей суровой подготовкой и жестоким процессом отбора, Специальная академия SRT — это школа подготовки сил специального назначения, созданная президентом Генерального студенческого совета для гибкого реагирования на ситуации с тяжкими преступлениями в каждой академии. Её существование, однако, было спорным, поскольку считалось нарушением автономии академий; тем не менее, благодаря авторитету президента, серьезного сопротивления не было.\n\nИз-за хаоса Великого Переноса SRT оказалась изолирована от Генерального совета. Если в этой ситуации президент окажется в опасности, само существование SRT может стать неопределенным…"

