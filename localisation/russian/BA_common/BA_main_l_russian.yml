 ## ВКЛАДКА 3 #
 KR_welcome_splash_tab_3_content: "§YЗапомни следующее:§!\n£white_dot\n\n\n£white_dot\n\n\n£white_dot\n\n£white_dot\n\n\n\n\n§YСообщение о проблемах:§!\nЭтот мод всё еще в разработке, поэтому могут возникать ошибки и конфликты. Если возникнет какая-либо проблема, сообщи о ней в наш §YDiscord мода Blue Archive§!, чтобы мы могли исправить её как можно скорее. Ссылку можно найти на странице Steam."
 KR_welcome_splash_tab_3_content_0: "Мод Blue Archive не ограничивает выбор игрока, такой как §Rосвобождение стран§!, §Rбыстрая война§! или §Rиспользование читов§!, но мы рекомендуем по возможности избегать этого.\nВо время §Yмирного договора§! ты должен аннексировать как можно больше стран. В противном случае позже условия §Yсобытий или решений§! могут §Rсбиться или не применить эффекты§!, вызывая §Rпроблемы§!.\nВ меню §Yправил игры§! ты можешь настроить различные параметры, такие как §tактивация коллапса Тринити§! или §0прибытие Хромы§!.\nЭтот мод требует §Yналичия всех DLC§! для следования §Yзадуманному разработчиками направлению§!.\nПроверь на странице Steam, что §Yу тебя есть все DLC§!."

 ## ВКЛАДКА 4 ##
 KR_welcome_splash_tab_4_upper_header: "§YДобро пожаловать в Blue Archive BETA $BA_CURRENT_VERSION$"
 KR_welcome_splash_tab_4_lower_header: "Сделано с любовью командой Blue Archive:§!"
 KR_welcome_splash_tab_4_content: "SKSKle   Kangseul2702   AfterImage   jindoi  Sonetto  mintcoon  Imika\nJamm   sihyeon   Skoober   mako0922   goddess6431  _yurizono.seia_  UnineVesiKass  subikgm  16729kei\n\n§gКроме того, спасибо dawn, Rikka, victorious09, execution_2525, coy-0001, lusaviet, anpleur, crossesyes, neunal, 16729, kaichou09, Fraise, borikkori, pencildude, bang0709, the_master_pigeon, которые помогали в большей или меньшей степени. §!\n\nА также мы благодарим создателей модов:\n£GFX_tx_logo_road_to_56 The Road to 56, £GFX_tx_logo_kr Kaiserreich, £GFX_tx_logo_dh Darkest Hour, £GFX_tx_logo_pb Pax Britannica, £GFX_tx_logo_tno The New Order\n£GFX_tx_logo_ssw The Sun Shining on the World"
 KR_welcome_splash_tab_4_content_0: "Наша команда очень усердно работала, достигнув множества 'порогов', чтобы у тебя был лучший опыт в моде Blue Archive; и для нас большая честь, что ты играешь в наш мод.\nМы надеемся, что, играя в мод Blue Archive, ты получишь от него такое же удовольствие, какое мы получили при его создании."

