 BA_form_iberia_category: "Иберийская Федерация"
 BA_form_iberia_category_desc: "Прошли дни, когда мы все были славны, и сегодня мы стоим на потускневших иллюзиях. Хотя прошло более 300 лет с 1640 года, люди в Мадриде и Лиссабоне всё еще видят один и тот же сон. На протяжении трех столетий люди упорно боролись за то, чтобы вернуть эту фантазию в снах, которые повторяются каждый день. Хотя Пиренейский полуостров и погрузился в глубокую тьму между трещинами веков, мечта и иллюзия — какими бы тщетными они ни казались, разделяемые всеми — никогда не были ложью."
