BA_super.12.t: "Принцесса безымянных богов"
BA_super.12.d: "Условие активации: выбрана опция 1 в событии проблемы руин.\n\nНазвание песни: final destination of ark\nСсылка на видео: https://www.youtube.com/watch?v=Rm1GFl2xXEY 0 ~ 17"
 
BA_super.13.t: "Ковчег Атрахасиса"
BA_super.13.d: "Условие активации: завершен фокус «Ковчег Атрахасиса».\n\nНазвание песни: Codex of Omen\nСсылка на видео: https://www.youtube.com/watch?v=-CbkjQG7m38&pp=ygUOY29kZXggb2Ygb21lbiA%3D 0 ~ 33"

BA_super.14.t: "Японо-китайская война"
BA_super.14.d: "Условие активации: Япония завершает фокус «Инцидент на мосту Марко Поло».\n\nСсылка на видео: https://www.youtube.com/watch?v=w4FjeTk1ibE"

BA_super.15.t: "Искусственный спутник"
BA_super.15.d: "Условие активации: Миллениум завершает фокус «Запуск искусственного спутника».\n\nСсылка на видео: https://youtu.be/lPFKd5p_t0s?si=XYBnggdlqCOvuprw"

BA_super.16.t: "Марш мертвых"
BA_super.16.d: "Условие активации: Ариус завершает фокус войны против Тринити \n\nСсылка на видео: https://www.youtube.com/watch?v=4rkXoaucLeo"
 
BA_super.17.t: "Война на равнинах Восточной Европы"
BA_super.17.d: "Условие активации: Польша, завершив фокус «Совместный ответ», находится в состоянии войны с Советским Союзом \n\nСсылка на видео: https://www.youtube.com/watch?v=qiwmoHXGlkk"
 
BA_super.18.t: "День Победы"
BA_super.18.d: "Условие активации: Советский Союз выигрывает войну против Тринити \n\nСсылка на видео: https://youtu.be/ydHHIN6P20o?si=nan5eYMg5qCgLk6W \n\nОсобое примечание: версия TNO"


