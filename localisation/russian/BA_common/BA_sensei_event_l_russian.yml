l_russian:
 # =================================================================================
 # == Основные события (1022~1024)
 # =================================================================================
 BA_sensei_event.1022.t: "Конкурс фан-клубов Сэнсэя в Кивотосе"
 BA_sensei_event.1022.d: "В самом центре столицы поднялся шум. «Фан-клубы Сэнсэя» из каждой академии соревновались за звание «того, кто любит Сэнсэя сильнее всех».\n\nЮука, стуча по калькулятору, закричала: «Согласно научным данным, любовь Миллениума самая эффективная!»\n\nХина, скрестив руки, возразила: «Настоящая любовь доказывается делами. Наш Дисциплинарный комитет — самый сильный.»\n\nНагиса, элегантно попивая чай, заметила: «Даже любви нужен класс, девочки.»\n\nХосино, зевая, пробормотала: «Эхэхэ... любовь Абидоса, которая не меняется даже в отчаянии, вот настоящая~»\n\nЭтот конкурс, такой же прекрасный, как и шумный... что же делать?"
 BA_sensei_event.1022.a: "Любовь каждой из вас ценна, но я бы хотел, чтобы вы соблюдали порядок."
 BA_sensei_event.1022.b: "Я не могу ранить чистое сердце девушек."

 BA_sensei_event.1023.t: "Сюрприз от Ароны"
 BA_sensei_event.1023.d: "В офисе появилась огромная голограмма, и Арона материализовалась.\n\n«Сэнсэй, привет! Арона приготовила для вас особенный подарок! Та-дам~! Подключение всех административных систем Кивотоса к земному правительству!»\n\nАрона сияла улыбкой.\n\n«Помогать Сэнсэю — счастье для Ароны! С этим даже самая сложная бумажная работа решится в мгновение ока. Хотя... возможно, вас немного беспокоит доверять управление инопланетному ИИ вроде меня. Сэнсэй, ведь вы примете мою добрую волю, правда?»"
 BA_sensei_event.1023.a: "Я доверюсь доброй воле Ароны и буду сотрудничать."
 BA_sensei_event.1023.b: "Я благодарен тебе, но это слишком опасное предложение."

 BA_sensei_event.1024.t: "Периодическая проверка Генерального студенческого совета"
 BA_sensei_event.1024.d: "Огромный дирижабль приземлился перед правительственным зданием, и прибыла проверочная группа Генерального студенческого совета Кивотоса. Глава проверки, Рин, поправляя очки, сказала:\n\n«Сэнсэй. Настало время периодической проверки. Мы начнем инспекцию всех департаментов земного правительства согласно «Административному регламенту Кивотоса».»\n\nСписок, который она протянула, был полон странных пунктов, таких как «улучшение благосостояния учениц», «уровень поддержки клубной деятельности» и «целесообразность бюджета фестивалей».\n\n«Чтобы защитить честь Сэнсэя, такой уровень требований — это норма. Если вы пройдете проверку, то получите официальное признание Кивотоса; если провалите... сами знаете. Итак, вы примете эти строгие стандарты?»"
 BA_sensei_event.1024.a: "Я буду управлять страной в соответствии со стандартами Кивотоса."
 BA_sensei_event.1024.b: "Я приму проверку, но прошу также учесть наши критерии."
 BA_sensei_event.1024.c: "Я не могу принять такую нерациональную проверку."

 # =================================================================================
 # == Дополнительные основные события (1033-1065)
 # =================================================================================

 BA_sensei_event.1033.t: "Периодическое объявление Ароны"
 BA_sensei_event.1033.d: "Арона появилась в виде голограммы и вежливо поприветствовала.\n\n«Сэнсэй, здравствуйте. Я представлю вам общий отчет о Кивотосе за этот месяц. Ученицы каждой академии проявляют большой интерес к новостям о Сэнсэе, особенно к недавнему сотрудничеству с земным правительством.»\n\nС лучезарной улыбкой она продолжила:\n\n«Благодаря мудрым решениям Сэнсэя, отношения между Кивотосом и Землей с каждым днем улучшаются! Чтобы выразить свою благодарность, каждая академия подготовила небольшой подарок. Пожалуйста, примите его... это чистое сердце учениц.»"
 BA_sensei_event.1033.a: "Я с признательностью приму сердца учениц."
 BA_sensei_event.1033.b: "Давайте поддерживать хорошие отношения взаимопомощи."

 BA_sensei_event.1034.t: "Ежедневный отчет Ароны"
 BA_sensei_event.1034.d: "Как и каждый день, Арона появилась на мониторе моего офиса.\n\n«Сэнсэй, привет! Это Арона! Я принесла вам сегодняшние новости из Кивотоса! Сегодня в Миллениуме тестировали новое изобретение, в Генне Дисциплинарный комитет заседал целых 3 часа. В Тринити прошло элегантное чаепитие, а в Абидосе... эм... они всё так же живут полными сил, да!»\n\nАрона, показывая подробно составленный отчет, спросила:\n\n«Если я буду так каждый день отчитываться... это хоть немного поможет вам в работе, Сэнсэй?»"
 BA_sensei_event.1034.a: "Твой подробный отчет очень помогает мне."
 BA_sensei_event.1034.b: "Большое спасибо, Арона. Продолжай в том же духе."

 BA_sensei_event.1035.t: "Совещание по планированию межвузовского фестиваля"
 BA_sensei_event.1035.d: "Экран массового видеозвонка заполнили лица представителей фестивальных комитетов каждой академии. Сидзуко из Хяккияко вела собрание.\n\n«Итак, все! Давайте определим концепцию «Большого фестиваля Кивотоса с Сэнсэем»!»\n\nЗвонок сразу же стал шумным. Юука закричала: «Очевидно, это должен быть «Фестиваль технологий»!» Хина возразила: «Нет, это должен быть «Рок-фестиваль», чтобы показать нашу страсть!» Нагиса спокойно сказала: «А как насчет повышения уровня с помощью «Концерта классической музыки»?» Хосино, зевая, добавила: «Ммм~ «Выживание в пустыне» звучит весело~»\n\nВсе смотрели на меня. Как мне упорядочить этот хаос?"
 BA_sensei_event.1035.a: "Давайте сделаем фестиваль, объединяющий все концепции в гармонии."
 BA_sensei_event.1035.b: "Как насчет фестиваля по зонам, каждая в своем стиле?"
 BA_sensei_event.1035.c: "Сначала успокоимся и будем решать концепцию шаг за шагом."

 BA_sensei_event.1036.t: "Предложение программы академического обмена"
 BA_sensei_event.1036.d: "Рин, исполняющая обязанности президента Генерального студенческого совета, пришла с официальными документами.\n\n«Сэнсэй, это официальный запрос: академии Кивотоса желают академического обмена с учебными заведениями Земли. Миллениум предлагает науку и технологии; Тринити — гуманитарные науки; Генна — практические боевые искусства... Хяккияко — традиционную культуру; а Шаньхайцзин — архитектуру.»\n\nОна на мгновение заколебалась и указала на последнюю страницу.\n\n«И... Абидос хочет преподавать «техники выживания в безвыходных ситуациях» и «методы переговоров о списании долгов». Этот... такой... своеобразный образовательный обмен... вы одобрите его?»"
 BA_sensei_event.1036.a: "Разнообразие — сила образования. Примем все предложения."
 BA_sensei_event.1036.b: "Давайте отберем и сосредоточимся на практических предметах."
 BA_sensei_event.1036.c: "Предметы Абидоса... требуют повторного рассмотрения."

 BA_sensei_event.1037.t: "Отчет о деятельности клубов"
 BA_sensei_event.1037.d: "На мой личный планшет непрерывно поступали отчеты о деятельности клубов.\n\n«Сэнсэй! Бета-версия «Симулятора Сэнсэя» готова! Пожалуйста, протестируйте ее!»\n«Фуфуфу... Сэнсэй, на этот раз мы «наказали» несколько мошеннических ресторанов. Можете с нетерпением ждать.»\n«Мы отправляем вам образец чая, специально для вас смешанного. Пусть у вас будет минутка покоя...»\n\nНо больше всего сообщений, как и следовало ожидать, отправляли «фан-клубы Сэнсэя» из каждой академии. Глядя на их милое соревнование за звание «кто больше помогает Сэнсэю», я невольно улыбнулся."
 BA_sensei_event.1037.a: "Здоровая конкуренция — отличный стимул. Но... «наказали»?"
 BA_sensei_event.1037.b: "Дайте им знать, что сердце каждой из них ценно."

 BA_sensei_event.1038.t: "Специальное предупреждение метеослужбы Кроноса"
 BA_sensei_event.1038.d: "Когда я включил экран по экстренному запросу, директор-ученица метеослужбы Кроноса заговорила взволнованным голосом.\n\n«Сэнсэй! Мы обнаружили аномальное погодное явление в вашем районе! Ваша безопасность превыше всего. При необходимости мы используем все наше климатическое оборудование...!»\n\nКогда я объяснил, что технологии Земли другие, она на секунду расстроилась, но тут же снова повысила голос.\n\n«Т-тогда пусть поможет хотя бы наше сердце! Мы отправим зонты, одеяла и аварийные пайки космической почтой! Пожалуйста, берегите себя, Сэнсэй!»"
 BA_sensei_event.1038.a: "Я благодарен за теплое сердце учениц."
 BA_sensei_event.1038.b: "Скажи им, что у меня все хорошо и чтобы не волновались."

 BA_sensei_event.1039.t: "День периодического медосмотра"
 BA_sensei_event.1039.d: "Сэрина из Корпуса милосердия Тринити позвонила мне по видеосвязи с обеспокоенным лицом.\n\n«Сэнсэй... я беспокоюсь, что вы слишком много работаете. Наш медицинский персонал Кивотоса предлагает специальный удаленный осмотр здоровья только для вас.»\n\nЗа ней виднелись ученицы из других академий: Сэна из Генны размахивала специальным лекарственным средством; ученица Миллениума демонстрировала систему здоровья с ИИ.\n\n«Здоровье Сэнсэя волнует всех нас. Пожалуйста, примите наше внимательное предложение.»"
 BA_sensei_event.1039.a: "Я искренне благодарен за вашу заботу."
 BA_sensei_event.1039.b: "Спасибо за беспокойство, но у меня все хорошо."

 BA_sensei_event.1040.t: "Проект расширения библиотеки Шале"
 BA_sensei_event.1040.d: "Шимико из библиотеки древних книг Тринити развернула чертежи и взволнованно заговорила.\n\n«Сэнсэй! Это проект расширения библиотеки Шале. Наша цель — «идеальный роскошный кабинет для Сэнсэя». Другие академии тоже предложили помощь: Миллениум — с передовой системой поиска, Генна — с тактическими руководствами, а Хяккияко — с классической литературой.»\n\nОна сделала паузу и тихо добавила:\n\n«И... Абидос хочет пожертвовать «советы по экономной жизни» и «руководство по урегулированию долгов». Такая... особенная библиотека... вам нравится?»"
 BA_sensei_event.1040.a: "Разнообразные знания — вот истинное сокровище."
 BA_sensei_event.1040.b: "Лучше сосредоточиться на практических книгах."

 BA_sensei_event.1041.t: "Большая операция ко Дню Святого Валентина в Кивотосе"
 BA_sensei_event.1041.d: "С приближением 14 февраля мой офис чуть не рухнул от шоколада: особенный от Департамента снабжения Генны, ремесленные сладости Тринити, умный шоколад Миллениума...\n\nВ конце концов, Руми из Шаньхайцзин появилась с огромным планом.\n\n«Сэнсэй! Это проект «эксклюзивной шоколадной фабрики для Сэнсэя»! Мы будем поставлять вам лучший шоколад каждый год!»\n\nУченицы Абидоса, стесняясь, предложили мне шоколад ручной работы, говоря: «Может, он и не роскошный, но сердце в нем есть.» Как мне упорядочить этот сладкий хаос?"
 BA_sensei_event.1041.a: "Я с любовью приму сердце каждой ученицы."
 BA_sensei_event.1041.b: "Важно сердце, а не размер подарка."

 BA_sensei_event.1042.t: "Конференция по планированию летних каникул"
 BA_sensei_event.1042.d: "Наступил сезон каникул, и посыпались предложения о «летних каникулах с Сэнсэем» от всех академий: традиционный фестиваль Хяккияко, роскошный курорт Тринити, лагерь выживания Генны, VR-ретрит Миллениума...\n\nСреди всего прочего мое внимание привлекло одно предложение — от Абидоса.\n\n«Особая активность Абидоса: наблюдение за звездами в пустыне. Мы предоставим палатку и воду. Сэнсэй просто приходите.»\n\nОно было простым, но искренним. Перед лицом таких страстных предложений, что мне следует решить?"
 BA_sensei_event.1042.a: "Давайте устроим каникулы с мини-мероприятиями, отражающими каждую академию."
 BA_sensei_event.1042.b: "На этот раз я хочу провести спокойные каникулы."
 BA_sensei_event.1042.c: "Мне нравится предложение Абидоса."

 BA_sensei_event.1043.t: "Планирование специального мероприятия на Хэллоуин"
 BA_sensei_event.1043.d: "В октябре ученицы Хяккияко принесли план на Хэллоуин.\n\n«Сэнсэй! Давайте вместе насладимся «Большим Хэллоуином Кивотоса»!»\n\nПлан был полон уголков в стиле каждой академии.\n\n«Генна подготовит «настоящий дом с привидениями», Тринити — «элегантный бал вампиров», Миллениум — «научно-фантастический хоррор-опыт». Абидос... «исследование руин». И самое главное: Сэнсэй тоже должен участвовать в костюме! Пожалуйста!»"
 BA_sensei_event.1043.a: "Давайте устроим веселый Хэллоуин с ученицами."
 BA_sensei_event.1043.b: "Думаю, мне будет достаточно весело просто смотреть."

 BA_sensei_event.1044.t: "Комитет по подготовке к Рождеству"
 BA_sensei_event.1044.d: "Однажды в декабре ученицы Тринити пришли и элегантно поприветствовали.\n\n«Сэнсэй. Позвольте нам подготовить для вас особенное Рождество.»\n\nПозади них кивали ученицы из других академий: Тринити предлагала рождественский концерт, Генна — световое шоу, Миллениум — голографическую елку. Ученицы Абидоса показали украшения ручной работы, говоря: «Простое, но теплое Рождество».»\n\n«Сэнсэй, вы примете наш рождественский план?»"
 BA_sensei_event.1044.a: "Давайте объединим все события и устроим что-то грандиозное."
 BA_sensei_event.1044.b: "Я предпочитаю простое и теплое Рождество."

 BA_sensei_event.1045.t: "Празднование Большого спортивного фестиваля Кивотоса"
 BA_sensei_event.1045.d: "Ученицы спортивного клуба Генны пришли с заявлением:\n\n«Сэнсэй! Мы собираемся провести «Олимпиаду Кивотоса с Сэнсэем в качестве зрителя»! Настоящий поединок, на кону гордость каждой академии!»\n\nОни горели энтузиазмом: «Генна будет доминировать в боевых видах спорта, Миллениум — в киберспорте, а Тринити — в конном спорте и фехтовании!» Абидос уверенно заявил о себе в «испытаниях на выживание».»\n\n«Сэнсэй, смотри, как мы побеждаем. Все победы будут для тебя!»"
 BA_sensei_event.1045.a: "Важнее победы — давайте сделаем это местом единения, где все будут получать удовольствие."
 BA_sensei_event.1045.b: "Здоровая конкуренция — двигатель роста. Я жду этого с нетерпением."

 BA_sensei_event.1046.t: "Кулинарный конкурс Кивотоса"
 BA_sensei_event.1046.d: "Фуука, глава Департамента снабжения Генны, вежливо предложила.\n\n«Сэнсэй, мы хотим организовать для вас кулинарный конкурс. Ученицы, отвечающие за кухню в каждой академии, представят свои лучшие блюда.»\n\nЮри, стоявшая рядом, вытерла слюни и добавила: «Я буду судьей...!» Фуука остановила ее и продолжила.\n\n«Проблема в том... что Клуб гурманов тоже хочет участвовать. Их «взрывной вкус», возможно, не совсем... безопасен. Этот вкусный, но потенциально опасный конкурс... все в порядке, Сэнсэй?»"
 BA_sensei_event.1046.a: "Безопасность прежде всего. Пусть Клуб гурманов пройдет специальную проверку."
 BA_sensei_event.1046.b: "Я оценю все по справедливости. Что бы ни случилось."

 BA_sensei_event.1047.t: "Выставка студенческого искусства"
 BA_sensei_event.1047.d: "Ученица Тринити робко вручила мне брошюру.\n\n«Сэнсэй... художественные клубы объединились, чтобы спланировать «выставку искусства с Сэнсэем в качестве темы». Тринити готовит классические портреты, Миллениум — цифровое искусство, Генна — динамичное боевое искусство... а Абидос — картины на тему надежды.»\n\nПокраснев, она сказала:\n\n«Все работы содержат уважение и благодарность к Сэнсэю. Пожалуйста, приходите... и увидьте наши сердца.»"
 BA_sensei_event.1047.a: "Я хочу спокойно оценить каждую работу и почувствовать сердца учениц."
 BA_sensei_event.1047.b: "Я посмотрю в основном работы, хорошо отражающие стиль каждой академии."

 BA_sensei_event.1048.t: "Музыкальный концерт Кивотоса"
 BA_sensei_event.1048.d: "Ученица из музыкального клуба Генны взволнованно заговорила.\n\n«Сэнсэй! Послушай! Мы готовим для тебя специальный концерт! Наша группа, оркестр Тринити, электронная музыка Миллениума... невероятная сцена, охватывающая все жанры!»\n\nЗатем она серьезно понизила голос.\n\n«И в конце... все ученицы вместе споют «песню, посвященную Сэнсэю». Готовься плакать, Сэнсэй!»"
 BA_sensei_event.1048.a: "От одной только мысли о том, чтобы их услышать, я уже тронут."
 BA_sensei_event.1048.b: "Было бы также интересно сравнить стили каждой академии."

 BA_sensei_event.1049.t: "Научная выставка Кивотоса"
 BA_sensei_event.1049.d: "Ученица Миллениума продемонстрировала голографическую презентацию.\n\n«Сэнсэй, добро пожаловать на «Научно-техническую выставку Кивотоса» под руководством Миллениума! Все экспонаты были разработаны с целью «сделать жизнь Сэнсэя комфортнее». Мы представляем робототехнику и ИИ; Генна... химические эксперименты; Тринити — оборудование для астрономических наблюдений.»\n\nУвидев список от Абидоса, она на мгновение замолчала.\n\n«...Абидос представит «науку о переработке» и «техники экономии». Желаете испытать наши инновации, Сэнсэй?»"
 BA_sensei_event.1049.a: "Я проявлю большой интерес к технологиям и творчеству всех академий."
 BA_sensei_event.1049.b: "Я рассмотрю в основном практичные и безопасные технологии."

 BA_sensei_event.1050.t: "Совместное выступление театральных клубов"
 BA_sensei_event.1050.d: "Представители театральных клубов обсуждали сценарий «пьесы, где Сэнсэй — главный герой», но не могли прийти к согласию.\n\n«Сэнсэй должен быть мучимым героем!» (Тринити)\n«Нет, героем боевика, который все крушит!» (Генна)\n«Главный герой научной фантастики, спасающий будущее с помощью данных, ему идеально подходит.» (Миллениум)\n«А что, если это трогательная драма, обретающая надежду в отчаянии...?» (Абидос)\n\nВ конце концов они пришли спросить меня: «Сэнсэй! Каким главным героем вы хотите быть?»"
 BA_sensei_event.1050.a: "Я уважаю вашу творческую волю и посмотрю все пьесы."
 BA_sensei_event.1050.b: "А что, если объединить все в одну историю?"

 BA_sensei_event.1051.t: "Студенческий фотоконкурс"
 BA_sensei_event.1051.d: "Ученица из фотоклуба Миллениума объяснила конкурс.\n\n«Сэнсэй, тема — «Сэнсэй и Кивотос». Мы представим технические фото с высокотехнологичным оборудованием, Тринити представит художественные портреты, а Генна — динамичные экшн-фото.»\n\nЗатем она показала фото Абидоса: повседневные пейзажи, ничего особенного... но с мягким теплом внутри.\n\n«Не могли бы вы быть судьей? Мне интересно, какое фото тронет ваше сердце больше всего, Сэнсэй.»"
 BA_sensei_event.1051.a: "Я буду больше ценить сердце, чем техническое совершенство."
 BA_sensei_event.1051.b: "Я выберу работы, в которых хорошо заметны стиль и индивидуальность каждой академии."

 BA_sensei_event.1052.t: "Специальный мастер-класс Чайного клуба Тринити"
 BA_sensei_event.1052.d: "Ученицы Чайного клуба Тринити с уважением пригласили меня.\n\n«Сэнсэй, мы хотим подарить вам истинный отдых и душевное спокойствие. Не согласитесь ли вы посетить специальный чайный мастер-класс с чаем высочайшего качества?»\n\nНо когда слух распространился, другие академии захотели присоединиться: Генна принесет «чай, полезный для повышения боеспособности», Миллениум — «научно оптимизированный чай», а Абидос — «дешевый, но вкусный чай». Сможет ли мастер-класс быть действительно мирным?"
 BA_sensei_event.1052.a: "Попробовать чай из всех академий и прочувствовать их стили тоже звучит неплохо."
 BA_sensei_event.1052.b: "На этот раз я хочу по-настоящему отдохнуть с традиционным чаем Тринити."

 BA_sensei_event.1053.t: "Студенческий кинофестиваль"
 BA_sensei_event.1053.d: "Ученица из клуба аудиовизуального производства Миллениума взволнованно заговорила.\n\n«Сэнсэй! Мы планируем «Кинофестиваль Сэнсэя»! В моем научно-фантастическом фильме Сэнсэй появляется как герой, воссозданный с помощью новейшего CGI! Генна делает боевик, Тринити — арт-драму, а Абидос... «историю людей, не теряющих надежду».»\n\nОна предложила ведерко попкорна.\n\n«Вам не интересно посмотреть наши фильмы с Сэнсэем в главной роли?»"
 BA_sensei_event.1053.a: "Я посмотрю все работы и восхищусь вашим творчеством."
 BA_sensei_event.1053.b: "Я посмотрю в основном работы, где выделяются послание и стиль."

 BA_sensei_event.1054.t: "Киберспортивный турнир Кивотоса"
 BA_sensei_event.1054.d: "Момой и Мидори из Клуба разработки игр Миллениума закричали с энтузиазмом.\n\n«Сэнсэй! Грядет «Турнир Кивотоса, спонсируемый Сэнсэем»! И наш «Симулятор Сэнсэя» — официальная игра!»\n\n«Говорят, Генна будет сильна в экшн-играх, Тринити — в стратегиях, Хяккияко — в головоломках... а Абидос на удивление «темная лошадка» в играх на выживание!»\n\n«Все хотят посвятить свою победу Сэнсэю! Вы придете посмотреть, правда?»"
 BA_sensei_event.1054.a: "Я буду болеть за каждую академию в их сильных дисциплинах."
 BA_sensei_event.1054.b: "Важнее результата — давайте создадим атмосферу фестиваля, чтобы всем было весело."

 BA_sensei_event.1055.t: "Основание студенческой газеты Кивотоса"
 BA_sensei_event.1055.d: "На моем столе появился первый номер «Kivotos Times», созданный объединением газетных клубов. Заголовок на первой полосе гласил: «Наш герой: Спецвыпуск о Сэнсэе». У каждой академии была своя рубрика: Миллениум — технологии, Тринити — культура и искусство, Генна — спорт, Абидос — повседневная жизнь.\n\nВ конце было письмо от главного редактора:\n\n«Для Сэнсэя: понравилась ли вам наша газета? Если вы не против, мы хотели бы публиковать еженедельное интервью с Сэнсэем в «Рубрике Сэнсэя». Пожалуйста, позвольте нам!»"
 BA_sensei_event.1055.a: "Я буду активно поддерживать вашу журналистскую деятельность."
 BA_sensei_event.1055.b: "Я мог бы сотрудничать хотя бы в рамках краткого приветствия."

 BA_sensei_event.1056.t: "Церемония выпуска в Кивотосе"
 BA_sensei_event.1056.d: "Когда наступил март, представители учениц, готовящихся к выпуску, навестили меня. Ученица Тринити говорила торжественно; ученица Генны — энергично; ученица Миллениума — логично. Хотя их слова были разными, все они говорили об одном.\n\n«Сэнсэй... не могли бы вы прийти и произнести для нас напутственную речь?»\n\n«Благодаря Сэнсэю мы смогли вырасти. Мы также подготовили выпускной альбом с воспоминаниями о времени, проведенном с Сэнсэем. Пожалуйста, отпразднуйте наше новое начало.»"
 BA_sensei_event.1056.a: "Я посещу выпускные во всех академиях, чтобы поздравить их."
 BA_sensei_event.1056.b: "Я встречусь с представителями выпускниц и скажу им слова поддержки."

 BA_sensei_event.1057.t: "Ориентация для новых учениц"
 BA_sensei_event.1057.d: "В апреле начался новый семестр. Член студенческого совета доложил с взволнованным лицом.\n\n«Сэнсэй! Новенькие просто невероятны! Все кричали: «Хотим узнать о Сэнсэе!», так что половина ориентации ушла на объяснение величия Сэнсэя.»\n\nОн продолжил с гордостью:\n\n«Все полны решимости «стать ученицами, которые помогают Сэнсэю». Скоро они придут официально поприветствовать вас. Вы тепло примете наших милых новеньких, Сэнсэй?»"
 BA_sensei_event.1057.a: "Я тепло приму их и поддержу их чистый энтузиазм."
 BA_sensei_event.1057.b: "Посоветуй им хорошо изучить традиции и особенности каждой академии."

 BA_sensei_event.1058.t: "День большой уборки кампуса"
 BA_sensei_event.1058.d: "Ученица, вытирая пот, с гордостью доложила мне.\n\n«Сэнсэй! Сегодня мы провели генеральную уборку! С лозунгом «покажем наше лучшее лицо Сэнсэю» все участвовали добровольно. Генна убиралась как армия, Тринити — элегантно, а Миллениум — научно.»\n\nОна немного заколебалась и добавила:\n\n«Абидос... очень старался с целью «оставить все максимально чистым при ограниченных ресурсах». Вы похвалите наши старания, Сэнсэй?»"
 BA_sensei_event.1058.a: "Скажи им, что я тронут их ответственностью и усердием."
 BA_sensei_event.1058.b: "Напомни им, чтобы они в первую очередь заботились о здоровье и безопасности, не перенапрягаясь."

 BA_sensei_event.1059.t: "Предложение о школьной поездке"
 BA_sensei_event.1059.d: "Президенты студенческих советов каждой академии принесли совместное предложение о «школьной поездке с Сэнсэем». Тринити предложила художественный тур по Европе, Генна — исследование Амазонки, а Миллениум — посещение Силиконовой долины.\n\nИсполняющая обязанности президента Абидоса робко заговорила:\n\n«Мы... с Сэнсэем, куда угодно, хорошо. Это просто, но... от души.»\n\nВсе смотрели на меня умоляющими глазами. Как мне следует принять это теплое предложение?"
 BA_sensei_event.1059.a: "Давайте спланируем мини-поездки, отражающие стиль каждой академии."
 BA_sensei_event.1059.b: "Я благодарен вам, но из-за работы будет трудно участвовать."

 BA_sensei_event.1060.t: "Сезон студенческих выборов"
 BA_sensei_event.1060.d: "В каждой академии Кивотоса выборы в студенческий совет были в самом разгаре. Одна ученица взволнованно рассказывала мне о ситуации.\n\n«Сэнсэй! Главное обещание всех кандидаток — «укрепить сотрудничество с Сэнсэем»! Все кричат, что создадут академию, которая больше поможет Сэнсэю!»\n\n«Говорят, что, если они выиграют, первым делом поприветствуют Сэнсэя. Вот это страсть, правда! За какую кандидатку вы болеете, Сэнсэй?»"
 BA_sensei_event.1060.a: "Я буду подбадривать их и с интересом наблюдать за их предложениями."
 BA_sensei_event.1060.b: "Я должен сохранять нейтралитет, чтобы выборы были честными."

 BA_sensei_event.1061.t: "Проект межвузовского исследовательского сотрудничества"
 BA_sensei_event.1061.d: "Юука из Миллениума предложила амбициозный проект.\n\n«Сэнсэй! Проект «совместных межвузовских исследований для помощи Сэнсэю»! Миллениум предоставит технологии, Тринити — гуманитарное понимание, Генна — исполнительские способности, а Хяккияко и Шаньхайцзин добавят свои собственные знания и техники.»\n\nОна на мгновение взглянула на учениц Абидоса.\n\n«А Абидос... предоставит «реалистичные и экономичные решения». Этот проект, в котором мы объединяем усилия, чтобы помочь Сэнсэю... что вы думаете?»"
 BA_sensei_event.1061.a: "Звучит как идеальное сотрудничество, использующее сильные стороны каждой академии."
 BA_sensei_event.1061.b: "Давайте начнем с малого, с практических и достижимых целей."

 BA_sensei_event.1062.t: "Культурный фестиваль Кивотоса"
 BA_sensei_event.1062.d: "Ученица Хяккияко вручила мне приглашение.\n\n«Сэнсэй! Мы приглашаем вас на «Большой культурный фестиваль Кивотоса», в котором участвуют все академии. Это значимое событие для представления вам нашей культуры. Классика Тринити, современная культура Генны, технологии будущего Миллениума и наши традиции Хяккияко!»\n\nС гордостью она добавила:\n\n«Вы сможете прочувствовать все очарование Кивотоса в одном месте!»"
 BA_sensei_event.1062.a: "Я познакомлюсь с культурой всех академий и наслажусь их разнообразием."
 BA_sensei_event.1062.b: "Я сосредоточусь на уникальной культурной идентичности каждой академии."

 BA_sensei_event.1063.t: "Программа студенческого волонтерства"
 BA_sensei_event.1063.d: "Ученица Тринити с серьезным выражением лица представила предложение.\n\n«Сэнсэй... наши ученицы хотят заниматься волонтерством на Земле «следуя воле Сэнсэя». Мы планируем образовательную поддержку, помощь при стихийных бедствиях (Генна), техническую поддержку (Миллениум) и помощь нуждающимся соседям (Абидос).»\n\nС решительным взглядом она продолжила:\n\n«Мы хотим возвысить честь Сэнсэя и передать хороший образ Кивотоса. Пожалуйста, позвольте нам это.»"
 BA_sensei_event.1063.a: "Я буду активно поддерживать и поощрять ваш волонтерский дух."
 BA_sensei_event.1063.b: "Безопасность прежде всего; это должно быть организованно."

 BA_sensei_event.1064.t: "Выставка передовых технологий"
 BA_sensei_event.1064.d: "Студентка-инженер Миллениума провела меня по выставке.\n\n«Сэнсэй, это «Выставка передовых технологий для Сэнсэя». Голографические системы для совещаний, ИИ-ассистенты, автоматизация задач... все было разработано для вас. Технологии безопасности Генны и автоматизация строительства Шаньхайцзин также превосходны.»\n\nОна указала на стенд Абидоса.\n\n«Там раздел «технологии с низкой стоимостью и высокой эффективностью». Вам нравится наш технологический потенциал, Сэнсэй?»"
 BA_sensei_event.1064.a: "Я протестирую все технологии и изучу возможности для инноваций."
 BA_sensei_event.1064.b: "Я оценю в основном практичные и безопасные технологии."

 BA_sensei_event.1065.t: "Общее межвузовское соревнование"
 BA_sensei_event.1065.d: "Рин, исполняющая обязанности президента Генерального студенческого совета, объявила об открытии.\n\n«Сэнсэй, мы начинаем самое большое общее межвузовское соревнование в истории Кивотоса. Но настоящая цель — не победа. Это «показать Сэнсэю все таланты Кивотоса».»\n\nНа стадионе все ученицы махали мне рукой. На их лицах смешивались дух соперничества и страсть показать себя с лучшей стороны перед Сэнсэем.\n\n«Сэнсэй, пожалуйста, наблюдайте за нашей страстью!»"
 BA_sensei_event.1065.a: "Я буду одинаково аплодировать таланту и усилиям всех академий."
 BA_sensei_event.1065.b: "Я буду больше сосредоточен на их росте и дружбе, чем на результате."