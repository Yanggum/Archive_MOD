l_russian:
 BA_sensei_guidance: "Наставничество Сэнсэя"
 BA_sensei_guidance_desc: "Опыт, полученный при руководстве ученицами Кивотоса, теперь стал бесценным активом для управления страной. Чистое доверие и ожидания, возложенные ученицами, возлагают на нас большую ответственность, но также дают нам мужество, необходимое для преодоления любых трудностей."

 BA_sensei_millennium_collab: "Технологическое сотрудничество с Миллениумом"
 BA_sensei_millennium_collab_desc: "Сотрудничество с Научной школой Миллениум вывело технологический уровень страны на новый этап. Обмениваясь передовыми технологиями и большими данными, мы лидируем в инновациях, устремленных в будущее."

 BA_sensei_srt_security: "Консультации по безопасности от SRT"
 BA_sensei_srt_security_desc: "Реальный опыт Специальной академии SRT вдохнул новую жизнь в нашу систему национальной безопасности. Благодаря их специализированным консультациям наши вооруженные силы трансформируются в более эффективную и мощную организацию."

 BA_sensei_trinity_seminar: "Тактический семинар с Тринити"
 BA_sensei_trinity_seminar_desc: "Обмен с Объединенной академией Тринити выходит за рамки простой военной подготовки, предлагая глубокие размышления о стратегии и тактике. Семинары в сопровождении черного чая вдохновляют новое поколение командиров."

 BA_sensei_redwinter_admin: "Административная поддержка Красной Зимы"
 BA_sensei_redwinter_admin_desc: "Страстные ученицы Федеральной академии Красная Зима внесли революционные изменения в административную систему. Их смелые методы, хотя иногда и хаотичные, способствуют развитию страны с удивительной эффективностью."

 BA_sensei_gehenna_discipline: "Стальная дисциплина Генны"
 BA_sensei_gehenna_discipline_desc: "Суровая подготовка Дисциплинарного комитета Академии Генна восстановила военный порядок и максимизировала боевую мощь. Благодаря железной дисциплине наша армия возродилась как элитная сила, не боящаяся никакого врага."

 BA_sensei_hyakkiyako_order: "Городской порядок Хяккияко"
 BA_sensei_hyakkiyako_order_desc: "Ученицы Объединенной академии Хяккияко привнесли жизненную силу и порядок на улицы благодаря своим уникальным методам. Их деятельность, где переплетаются фестивали и традиции, завоевывает сердца народа и стабилизирует общество."

 BA_sensei_shanhaijing_project: "Совместный проект с Шаньхайцзин"
 BA_sensei_shanhaijing_project_desc: "Сотрудничество со Старшей школой Шаньхайцзин укрепило промышленную базу страны. Их технические способности и трудовая этика повысили нашу производительность, став новым двигателем экономического роста."

 BA_sensei_abydos_bonds: "Узы надежды Абидоса"
 BA_sensei_abydos_bonds_desc: "Идея, рожденная в отчаянии учениц Старшей школы Абидос, стала символом надежды для государственных финансов. Под лозунгом «Если с Сэнсэем» народ добровольно участвует в инвестициях в будущее."

 BA_sensei_gourmet_diplomacy: "Гастрономическая дипломатия"
 BA_sensei_gourmet_diplomacy_desc: "Кухня Департамента снабжения Генны и Клуба гурманов вышла за рамки еды, став дипломатическим оружием. Их исключительные блюда растопят сердца даже самых требовательных дипломатов и повышают престиж страны."

 BA_sensei_cheerleader_training: "Пламенная поддержка C&C"
 BA_sensei_cheerleader_training_desc: "Поддержка команды C&C из Миллениума — это не просто анимация. Их поддержка, вооруженная передовыми технологиями, поднимает боевой дух войск до предела и способна изменить ход сражения."

 BA_sensei_valkyrie_training: "Совместная подготовка с Валькирией"
 BA_sensei_valkyrie_training_desc: "Совместная подготовка с Полицейской академией Валькирия вывела наши правоохранительные способности на новый уровень. Благодаря учениям, приближенным к реальному бою, наши силы могут спокойно реагировать на любой кризис."

 BA_sensei_pandemonium_support: "«Поддержка» Пандемониума"
 BA_sensei_pandemonium_support_desc: "Поддержка Общества Пандемониум Генны может быть экстремальной, но это самый надежный метод достижения результатов. Их решительная способность действовать навязывает волю государства и усиливает наш голос на международной арене."

 BA_sensei_festival_management: "Комитет по управлению фестивалями"
 BA_sensei_festival_management_desc: "С присоединением Комитета Мацури из Хяккияко каждый национальный фестиваль превратился в произведение искусства. Их безупречное планирование объединяет народ и возвращает жизненную силу обществу."

 BA_sensei_redwinter_guidance: "Народное руководство Красной Зимы"
 BA_sensei_redwinter_guidance_desc: "Ученицы Федеральной академии Красная Зима зажгли искру революции в сердцах народа. Их страстное руководство пробуждает стремление к социальной справедливости и способствует преданности стране."

 BA_sensei_arius_governance: "Управление в стиле Ариус"
 BA_sensei_arius_governance_desc: "Метод Отряда Ариус опасен, но его эффективность неоспорима. Их готовность не останавливаться ни перед чем для достижения целей иногда становится самым быстрым способом решения проблем."

 BA_sensei_game_project: "Национальный видеоигровой проект"
 BA_sensei_game_project_desc: "Проект «Симулятор Сэнсэя», разработанный совместно с Клубом разработки игр Миллениума, выходит за рамки развлечения, становясь мощным инструментом мягкой силы. Это будет лучшее средство продемонстрировать миру наше величие."

 BA_sensei_abydos_prospecting: "Разведка ресурсов в стиле Абидос"
 BA_sensei_abydos_prospecting_desc: "Интуиция и настойчивость учениц Абидоса превратились в самое мощное оружие для обнаружения скрытых ресурсов страны. Их, казалось бы, безрассудные исследования часто завершаются чудесными находками."

 BA_sensei_justice_task_force: "Поддержка Департамента правосудия"
 BA_sensei_justice_task_force_desc: "С присоединением Департамента правосудия Тринити правосудие в нашем обществе стало еще более твердым. Их непоколебимое чувство справедливости искореняет коррупцию и укрепляет общество, где все равны перед законом."

 BA_sensei_veritas_analysis: "Анализ данных Veritas"
 BA_sensei_veritas_analysis_desc: "Аналитические способности Veritas из Миллениума стали фундаментальной основой государственного управления. Их точные прогнозы и глубокие идеи позволяют нам всегда принимать наилучшие решения."

 BA_sensei_gsc_audit: "Аудит Генерального студенческого совета"
 BA_sensei_gsc_audit_desc: "Периодические проверки Генерального студенческого совета болезненны, но они заставляют национальную систему развиваться. Стремление соответствовать их строгим стандартам повышает прозрачность и эффективность управления."

 BA_sensei_millennium_deep_collab: "Углубленное сотрудничество с Миллениумом"
 BA_sensei_millennium_deep_collab_desc: "Сотрудничество с Миллениумом вышло на новую фазу. Внедрение квантовых вычислений и искусственного интеллекта революционизирует все промышленные и научные сектора, приближая нас к технологической сингулярности."

 BA_sensei_srt_distrust: "Недоверие SRT"
 BA_sensei_srt_distrust_desc: "Наша осторожная позиция породила недоверие в Специальной академии SRT. Обеспокоенные отсутствием у нас решимости, в сотрудничестве в области безопасности начали появляться едва заметные трещины."

 BA_sensei_hyakkiyako_overreach: "Чрезмерные амбиции Хяккияко"
 BA_sensei_hyakkiyako_overreach_desc: "Фестивали Хяккияко зашли слишком далеко. Чрезмерные расходы и административное расточительство ложатся бременем на государственные финансы, в то время как среди населения накапливается усталость."

 BA_sensei_gehenna_integration: "Полная интеграция с Генной"
 BA_sensei_gehenna_integration_desc: "Полная интеграция с Академией Генна дала стране огромную мощь. Их исполнительские способности и боевая сила теперь полностью принадлежат нам, и мы больше не боимся никакой угрозы."

 BA_sensei_abydos_desperation: "Отчаяние Абидоса"
 BA_sensei_abydos_desperation_desc: "Цена игнорирования отчаянного положения учениц Абидоса была суровой. Когда их надежда рухнула, моральный дух народа и доверие к государству также пошатнулись."