#Всесторонняя Академия Тринити
  TRM_infantry_equipment_0:0 "Impairment/Blessing"
  TRM_infantry_equipment_0_short:0 "Impairment"
  TRM_infantry_equipment_0_desc:0 "Оружие нового поколения, разработанное по запросу Департамента Юстиции для замены устаревшего вооружения. Оно отличается превосходной точностью и приличной надежностью, хотя существуют оценки, указывающие на то, что ему еще недостает полноценной замены существующего оружия."
  TRM_infantry_equipment_1:0 "Quis ut Deus"
  TRM_infantry_equipment_1_short:0 "Quis ut Deus"
  TRM_infantry_equipment_1_desc:0 "Обычный пистолет-пулемет, разработанный в Тринити довольно давно. У него есть некоторые преимущества, такие как структура, пригодная для массового производства, и высокая скорострельность, но он оставляет желать лучшего из-за низкой надежности и точности."
  TRM_infantry_equipment_2:0 "Sweet Driver"
  TRM_infantry_equipment_2_short:0 "Sweet Driver"
  TRM_infantry_equipment_2_desc:0 "Легкая винтовка, и среди оружия, использующего тот же тип боеприпасов, она имеет относительно низкую отдачу. Это характерная для Тринити винтовка, которая к тому же обладает большим удобством использования и хорошей надежностью. Однако ее своеобразная внешность разделяет мнения среди пользователей."
  TRM_infantry_equipment_3:0 "Library Ruler"
  TRM_infantry_equipment_3_short:0 "Library Ruler"
  TRM_infantry_equipment_3_desc:0 "Исправляет недостатки предыдущего табельного вооружения. Точность повышена, а эргономика улучшена, сохраняя при этом уникальный внешний вид. Может быть оснащена подствольным гранатометом, что позволяет усиливать огневую мощь при необходимости."

