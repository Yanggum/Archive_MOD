#Старшая Школа Абидос
  ABY_infantry_equipment_0:0 "Разумные средства"
  ABY_infantry_equipment_0_short:0 "Разумные средства"
  ABY_infantry_equipment_0_desc:0 "Пистолет, который использует Окусура Аянэ. Это было табельное оружие, временно использовавшееся в начале Великого Смещения для покрытия нехватки вооружения. Хотя это пистолет, он обладает очень высокой огневой мощью, поэтому его до сих пор выдают офицерам."
  ABY_infantry_equipment_1:0 "Искренность"
  ABY_infantry_equipment_1_short:0 "Искренность"
  ABY_infantry_equipment_1_desc:0 "Штурмовая винтовка, которую использует Куроми Сэрика. Это табельное оружие, название которого означает «искренность» или «честность». Особенно среди солдат она стала популярна из-за слуха, что, верная своему названию, она показывает точно такие же результаты, как и на тренировках."
  ABY_infantry_equipment_2:0 "WHITE FANG 465"
  ABY_infantry_equipment_2_short:0 "WHITE FANG 465"
  ABY_infantry_equipment_2_desc:0 "Штурмовая винтовка, которую использует Сунаоками Сироко. Благодаря своей широкой универсальности и модульности — от винтовки designated marksman до штурмовой винтовки для пехоты — была принята в качестве нового табельного вооружения. Обладает значительной разрушительной силой, но из-за большого веса и использования специальных магазинов обсуждается ее улучшение."
  ABY_infantry_equipment_3:0 "BLACK FANG 465"
  ABY_infantry_equipment_3_short:0 "BLACK FANG 465"
  ABY_infantry_equipment_3_desc:0 "Улучшенная версия WHITE FANG 465: сохраняет свои достоинства, снижает вес и позволяет использовать стандартные магазины. Достигает прогресса в виде большей модульности, более простого обслуживания и улучшений в точности и дальности; однако взамен ее надежность немного снизилась, и иногда могут возникать сбои."
  ABY_ABYDOS_modern_infantry_equipment:0 "Око Гора + Beretta 92A1"
  ABY_ABYDOS_modern_infantry_equipment_short:0 "Око Гора + Beretta 92A1"
  ABY_ABYDOS_modern_infantry_equipment_desc:0 "Дробовик, вспомогательный пистолет-пулемет и бронежилет, используемые Таканаси Хосино. Поставляются в основном штурмовым подразделениям для прорыва фронта, зачистки вражеских траншей и удержания позиций до прибытия поддерживающей пехоты. Остальное полу-современное снаряжение — например, бронежилет со стальными пластинами — также интегрируется в обычную пехоту, увеличивая ее огневую мощь и обороноспособность."
  ABY_juggernaut_equipment_0:0 "Juggernaut Mini No.5"
  ABY_juggernaut_equipment_0_short:0 "Juggernaut Mini No.5"
  ABY_juggernaut_equipment_0_desc:0 "Миниган компании Nephthys, используемый Идзаёи Нономи, вместе с новым костюмом Джаггернаута. Миниган был облегчен за счет новых материалов, но он по-прежнему слишком требователен для обычной пехоты, поэтому был назначен в качестве вооружения для подразделений Джаггернаутов с усиленными экзоскелетами. Костюм Джаггернаута включает технологию обмена данными: если в том же строю развернуты дроны, дроны и Джаггернауты могут действовать в составе отделения, позволяя выполнять более эффективную тактику."