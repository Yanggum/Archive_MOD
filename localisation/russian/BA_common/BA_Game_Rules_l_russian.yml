#Национальные пути
  GEI_AI_BEHAVIOR: "@GEI Гематрия"
  RULE_OPTION_HISTORICAL_GEI_DESC: "ИИ Гематрии выберет свой путь полностью случайно."
  RULE_OPTION_COLOUR_PATH_COULOUR: "Хроматика"
  RULE_OPTION_COLOUR_PATH_COULOUR_DESC: "\n\n§RТребование:§!\nХроматика не должна быть отключена."
  RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON: "Декаграмматон"
  RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON_DESC: ""

  GEH_AI_BEHAVIOR:0 "@GEH Дисциплинарный Комитет Генны"
  RULE_OPTION_HISTORICAL_GEH_DESC:0 "ИИ Дисциплинарного Комитета Генны выберет свой путь случайно."
  RULE_OPTION_GEH_AKO:0 "Ассамблея Дисциплинарного Комитета – Победа §CAko§!"
  RULE_OPTION_GEH_HINA:0 "Ассамблея Дисциплинарного Комитета – Победа §Rфанатиков§!"
  RULE_OPTION_GEH_IORI:0 "Ассамблея Дисциплинарного Комитета – Победа §OИо§!ри"
  RULE_OPTION_GEH_GENERIC:0 "Ассамблея Дисциплинарного Комитета – §YРавновесие§!"
  RULE_OPTION_GEH_AKO_DESC:0 "После прихода к власти §CАмао Ако§! и Планового Отдела ИИ последует по пути, сосредоточенному на реформировании Дисциплинарного Комитета как бюрократического государства."
  RULE_OPTION_GEH_HINA_DESC:0 "Правительство будет захвачено фанатиками, почитающими §RSorasaki Hina§!, вынуждая её принять железную диктатуру; ИИ последует по соответствующему пути."
  RULE_OPTION_GEH_IORI_DESC:0 "После захвата власти §OШироми Иори§! и Исполнительным Отделом ИИ последует по пути, направленному на превращение Дисциплинарного Комитета в милитаристское государство."
  RULE_OPTION_GEH_GENERIC_DESC:0 "Споры между фракциями приведут к §Yничьей§!, что приведет к политике §Ystatus quo§! без значительных реформ."

  GEH_HINA_AI_BEHAVIOR:0 "@GEH Победа фанатиков Дисциплинарного Комитета"
  RULE_OPTION_HISTORICAL_GEH_HINA_DESC:0 "ИИ Дисциплинарного Комитета Генны выберет свой путь случайно.\n§RПредупреждение: фанатики должны прийти к власти.§!"
  RULE_OPTION_GEH_HINA_PUPPET: "$GEH_student_peoples_will$"
  RULE_OPTION_GEH_HINA_TERRIBLE: "$GEH_gehenna_leader$"
  RULE_OPTION_GEH_HINA_PUPPET_DESC:0 "Sorasaki Hina останется символическим лидером и марионеткой фанатиков.\n§RПредупреждение: фанатики должны прийти к власти.§!"
  RULE_OPTION_GEH_HINA_TERRIBLE_DESC:0 "Sorasaki Hina примет абсолютную власть как фактический автократ.\n§RПредупреждение: фанатики должны прийти к власти.§!"

  HEU_AI_BEHAVIOR:0 "@LUX Великое Герцогство Люксембург §g(Агентство 68)§!"
  RULE_OPTION_HISTORICAL_HEU_DESC:0 "ИИ Люксембурга установит революционное правительство, поддерживающее Генну, и провозгласит себя новым Генеральным Студенческим Советом Кивотоса."
  RULE_OPTION_PRO_GEH_FASCISM:0 "£GFX_BA_game_rule_flag_HEU Революция 68 – Агентство 68"
  RULE_OPTION_ANTI_GEH_FASCISM:0 "@LUX Независимый Люксембург – Революция 68"
  RULE_OPTION_ANTI_GEH_FASCISM_DESC:0 "Люксембург пойдет своим собственным путем, порвет с правыми и будет стремиться объединить Германию как лидер Революции 68."
  RULE_OPTION_ANTI_GEH_COMMUNISM:0 "@LUX Независимый Люксембург – Демократический социализм"
  RULE_OPTION_ANTI_GEH_COMMUNISM_DESC:0 "Люксембург будет сотрудничать с Коммунистической партией для объединения Германии."

  HEU_EYES_AI_BEHAVIOR:0 "@LUX Нарушение зрения Рикухачимы Ару"
  RULE_OPTION_ARU_EYES_RANDOM_DESC:0 "После потери глаза в коллективном избиении нацистами, врачи Люксембурга запросят у Миллениума создание продвинутого протеза. Решение Миллениума будет полностью случайным.\n§RПредупреждение: Люксембург должен выбрать независимость от Генны.§!"
  RULE_OPTION_ARU_EYES_GOOD: "Одобрение Миллениума"
  RULE_OPTION_ARU_EYES_GOOD_DESC:0 "Миллениум примет запрос и предоставит протез, позволяя Ару скрыть свою инвалидность.\n§RПредупреждение: Люксембург должен выбрать независимость от Генны.§!"
  RULE_OPTION_ARU_EYES_BAD: "Отказ Миллениума"
  RULE_OPTION_ARU_EYES_BAD_DESC:0 "Миллениум отклонит запрос. Ару будет использовать примитивный протез по технологии 1930-х годов, и её портрет изменится навсегда.\n§RПредупреждение: Люксембург должен выбрать независимость от Генны.§!"

  EDEN_WAR_AI_BEHAVIOR:0 "@LUX @GEH @GEM @TRM Итог Решающей Битвы в Эдеме"
  RULE_OPTION_HISTORICAL_EDEN_DESC:0 "Победитель Битвы в Эдеме неизвестен, пока война не разразится."
  RULE_OPTION_EDEN_VICTORY_GEHENNA:0 "@LUX @GEH @GEM Победа Генны"
  RULE_OPTION_EDEN_VICTORY_GEHENNA_DESC:0 "Генна неизбежно выиграет Битву в Эдеме.\n§RПредупреждение: работает только в столкновениях между ИИ.§!"
  RULE_OPTION_EDEN_VICTORY_TRINITY:0 "@TRM Победа Тринити"
  RULE_OPTION_EDEN_VICTORY_TRINITY_DESC:0 "Тринити неизбежно выиграет Битву в Эдеме.\n§RПредупреждение: работает только в столкновениях между ИИ.§!"

  TRN_PATH: "@TRM Кормчий родины"
  RULE_OPTION_TRN_PATH_RANDOM: "По умолчанию"
  RULE_OPTION_TRN_PATH_RANDOM_DESC: "Судьба Тринити следует за гармошкой, на которой играет Бог. Когда мелодия меняется, Тринити не может не двигаться с ней, переписывая историю Кивотоса."
  RULE_OPTION_TRN_PATH_PATER_SECT: "@TRM Мисоно Мика"
  RULE_OPTION_TRN_PATH_PATER_SECT_DESC: "После Инцидента с Юридзоно Сейей, Мисоно Мика одержала сокрушительную победу на выборах в Чайной Вечеринке, став хозяйкой. Новая эра для Тринити начинается в ее руках."
  RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR: "@TRM Мисоно Мика (высокая честь)"
  RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR_DESC: "Зажатая между идеалами и реальностью, Мика находит свой собственный ответ и решает служить всему народу, становясь подлинным лидером."
  RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR: "@TRM Мисоно Мика (низкая честь)"
  RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR_DESC: "Разрыв между идеалами и реальностью разъедает ее сердце, и Мика в конце концов становится тираном, предназначенным уничтожить всё."
  RULE_OPTION_TRN_PATH_FILIUS_SECT: "@TRM Кирифудзи Нагиса"
  RULE_OPTION_TRN_PATH_FILIUS_SECT_DESC: "Напишите здесь элегантное и подходящее описание для пути Кирифудзи Нагисы."

