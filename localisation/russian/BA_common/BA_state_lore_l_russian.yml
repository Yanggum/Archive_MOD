 SL_customname_Trinity_Heart: "Сердце Тринити"
 state_lore_name.1: "Эдем, тысячелетняя столица"
 state_lore_desc.1: "\nВ день, когда состоялся Первый Собор, все фракции Тринити объединились в одну. И в ознаменование этого момента был возведен новый город: Эдем. Этот город, названный именем Рая, вскоре утвердился как центр Тринити и на протяжении веков служил убежищем и оплотом для учениц. Даже сегодня Эдем почитается как ключевой город Тринити.\n\nНо Великий Перенос также принес Эдему кризис. В процессе боев с немецкой армией городу был нанесен значительный ущерб. Многие здания были разрушены, были раненые, хотя немецкое наступление в итоге провалилось. После этого центр города был быстро восстановлен, но шрамы войны все еще остаются здесь и там.\n\nНынешний Эдем, после завершения реконструкции, вновь обретает стабильный облик. Хотя раны прошлого все еще присутствуют, город продолжает выполнять свою функцию как решающий оплот Тринити.\n"

 state_lore_name.2: "[Statelore_Get_gehenna_centre_name]"
 state_lore_desc.2: "\n[Statelore_Get_gehenna_centre_desc]\n"
 state_lore_name.2_normal: "Сердце Генны"
 state_lore_desc.2_normal: "Центральный округ Генны относительно уцелел в разрушениях Великого Переноса. Хотя ученицы со свободным духом часто создают проблемы, к счастью, большинство этих инцидентов происходит далеко от центрального округа.\n\nНе существует множества записей о прошлом Генны, поэтому неизвестно, с каких пор сформировался центральный округ, был ли он спланированным городом или возник естественным путем с течением времени. Тем не менее, его здания построены с замечательной точностью и не разрушаются даже во время беспорядков, устраиваемых ученицами Генны.\n\nЗдесь находятся штаб-квартиры Общества Пандемониум и Дисциплинарного комитета. Однако после Великого Переноса конфликт между двумя сторонами изменил все. Когда Дисциплинарный комитет перенес свою базу власти в южный округ Генны, штаб-квартира, когда-то находившаяся в центральном округе, была наполовину заброшена и осталась там, как полупустая оболочка, оставленная позади."
 state_lore_name.2_TRN: "Второе сердце Тринити"
 state_lore_desc.2_TRN: "После решающей битвы за Эдем Генна склонилась перед Тринити, и флаг победы взвился высоко. Постройки в стиле Генны сносились одна за другой, и на их месте возводились новые здания, возведенные в эстетике самой Тринити. Некогда величественная штаб-квартира Общества Пандемониум была разрушена; теперь ее форму можно увидеть только в видеозаписях прошлого.\n\nБыли ученицы Генны, которые пытались продолжать сопротивление. Но их воля снова и снова подавлялась Департаментом правосудия, ополчениями, состоящими из учениц Тринити, и патрульными. Под именем «порядка» кольцо сжималось, пока им не навязали покорность.\n\nУлицы, которые раньше были ничейной землей, начали обретать безопасность, и ученицы Тринити тоже начали селиться в центральном округе. Бывшее сердце Генны постепенно стиралось из истории, и это пространство перекрашивается под именем Академии Тринити. Скоро это место будет называться новым именем.\n\nИ в этот миг имя Генны исчезало из памяти, в то время как будущее учениц погружалось во тьму под властью Тринити."

 state_lore_name.3: "Башня Миллениума"
 state_lore_desc.3: "\nБашня Миллениума с самого начала строилась по тщательному плану. Это здание — и окружающий его город — будучи концентрацией технологий Миллениума, функционировало на основе полной автоматизации и некоторое время считалось символом самого передового города.\n\nОднако после Великого Переноса ситуация изменилась. Энергия, питавшая автоматизированный город, начала истощаться, а ресурсы Земли были неэффективны для поддержания технологической системы Кивотоса. В конце концов, гигантский механизм, составляющий Миллениум, оказался на грани остановки.\n\nВ этот период война с Францией стала суровым испытанием. Миллениуму пришлось сопротивляться, даже потребляя свои накопленные резервы, и его города понесли сокрушительный удар.\n\nИ все же Башня Миллениума продолжает работать. Хотя она находится в нестабильном состоянии, когда никто не знает, когда она может остановиться, огромный город продолжает поддерживать свою собственную систему и двигаться сам по себе.\n"
  
 state_lore_name.4: "Башня Святилища"
 state_lore_desc.4: "\nБашня Святилища, воздвигнутая в столице Кивотоса, не раскрывает, кем и с какой целью она была построена. Под контролем Генерального студенческого совета башня — как следует из ее названия — автоматически управляла общественными учреждениями, социальной инфраструктурой и академиями всего Кивотоса… или, скорее, она делала это «раньше». До того, как Генеральный студенческий совет потерял контроль над Башней Святилища.\n\nКонтроль над этим таинственным зданием принадлежит исключительно Президенту Генерального студенческого совета. Хотя Башня Святилища управляла повседневной жизнью тысяч академий, после Великого Переноса способность Совета к контролю стала неактуальной, и, поскольку каждая академия построила свою собственную систему, маловероятно, что секреты этой башни скоро раскроются.\n\nНесмотря на то, что она находится в сердце Особого округа Утнапиштим, окрестности Башни Святилища удивительно тихи: мало кто входит или выходит. И когда оказываешься перед ней, чувство необъяснимого величия может даже подавить.\n"
  
 state_lore_name.5: "Офис Агентства"
 state_lore_desc.5: "\nОфис Агентства — это главный штаб одного из основных клубов Кивотоса, «Агентства 68». До Великого Переноса он находился в современном здании. Но после последовавшего за Великим Переносом хаоса — когда старый офис был превращен в пепел — нынешний кабинет Агентства стал Великим Герцогским Дворцом Великого Герцогства Люксембург.\n\nВеликий Герцогский Дворец был построен в эпоху Возрождения как городская ратуша Люксембурга, но в 1890 году его использование изменилось, и он стал новым дворцом Великого Герцогского Дома.\n\nКрасивый офис в готическом стиле Великого Герцогского Дворца превратился в кабинет Агентства под руководством Ару. Внешне он почти не изменился со времен своего дворцового прошлого, но внутри он заполнен секретными документами: как от корпоративной работы Агентства 68, так и от его обязанностей в качестве регента Великого Герцогства.\n\n«Рабочие» зоны дворца были переоборудованы под офис, приемные и тому подобное. Однако личные покои, где великогерцогская семья проводила свои дни, совершенно не используются. Сразу после Великого Переноса мародерствовавшие погромщики из Генны, пришедшие грабить драгоценности, застрелили в спальне Великую Герцогиню Шарлотту, ее супруга и их детей, которым не было и десяти лет.\n\nАру хранит урны с останками великогерцогской семьи в бывшей спальне и вместо этого живет в тесном пансионе в пятнадцати минутах ходьбы от дворца. Частные зоны — спальня, столовая и прочее — ежедневно убираются только по приказу Рику-хатимы Ару, и сотрудницы Агентства 68 их не используют.\n\nЦиники насмехаются, говоря, что Ару боится призрака убитой семьи и поэтому предпочитает спать, свернувшись калачиком на жестком диване в пансионе, а не на широкой кровати во дворце. Но те, кто хорошо ее знает, утверждают, что она просто сохраняет эти пустые помещения как жест уважения к убитой семье. Возможно, правда никогда не станет известна.\n"

 state_lore_name.6: "[Statelore_Get_Abydos_highschool_name]"
 state_lore_desc.6: "[Statelore_Get_Abydos_highschool_desc]"
 state_lore_name.6_normal: "Заброшенная руина"
 state_lore_desc.6_normal: "\nПосле того как Абидос отступил после вторжения Шаньхайцзин и Хяккияко, здание осталось пустым домом без хозяина. Сквозь окна больше не проникал свет, и по старым стенам гулял только ветер. Но, несмотря на это, оно не было полностью заброшено: периодически приходила уборочная компания, чтобы вытереть пыль и протереть рамы.\n\nЛюди задавались вопросом о причине такого ухода. Зачем содержать в идеальном порядке дом, в котором никто не живет? Однако после того, как Сюаньлунмэнь выпустил официальное заявление: «Не обсуждайте и не комментируйте это дело», все слухи и любопытство исчезли.\n\nТак здание и остается в углу города, молчаливо приводясь в порядок, словно в ожидании возвращения своего хозяина. И его неподвижность ощущается как тишина, предвещающая шаги, которые когда-нибудь вернутся.\n"
 state_lore_name.6_abydos_own_state: "Главный кампус Абидоса"
 state_lore_desc.6_abydos_own_state: "\nПосле того как Абидос вернул свою древнюю землю, они были удивлены: кто-то поддерживал место в безупречном состоянии, без единой зацепки для критики.\nФактически, обветшавшие сооружения были отремонтированы, а вода и электричество также были подключены. Поэтому коалиционное правительство решило использовать это место для иной цели, чем первоначальная.\n\nПосле решения сделать Хорн столицей коалиционного правительства, главный кампус Старшей школы Абидос официально стал Вторым филиалом Карловых Вар. Это место, Первый филиал Старшей школы Абидос, было переоборудовано в филиал Правительства Хорна и стало административным, политическим и интеграционным центром коалиционного правительства.\n\nХотя и в несколько ином направлении, здание школы вернуло себе жизненную силу. Иногда даже слышны стоны тех, кто работает сверхурочно, но теплая и стабильная атмосфера в конце концов вернулась.\n\nИ, на самом деле, некоторые оставшиеся учебные зоны были превращены в места для присмотра и обучения детей тех, кто там проживает, так что можно сказать, что оно не совсем утратило свое первоначальное предназначение.\n"

 state_lore_name.7: "[86.GetCapitalVictoryPointName]"
 state_lore_desc.7: "\nBasis Schola изначально был польским городом Познань: местом, пропитанным историей и культурой со времен Средневековья. Но теперь он превратился в землю, где возвышается главный штаб Госпитальеров и где простирается тень Тринити.\n\nОккупация Познани Тринити началась с заявления пленного немецкого офицера, захваченного во время зачистки. Он категорично утверждал: «Данциг и Познань — германские территории», и Тринити использовала эти слова как предлог для силовой оккупации Познани. Основные силы польской армии были скованы на советском фронте. Город, оставленный без защиты, пал, даже не имея возможности дать настоящий бой, и сопротивление рассыпалось на мелкие стычки. Так Познань была отторгнута, не имея даже «роскоши» великой жертвы.\n\nТринити не предстала завоевателем. Вместо принуждения она применила умеренную политику для привлечения горожан и восстановила рухнувшие администрацию и порядок. В результате Познань постепенно впиталась в систему управления Тринити, и теперь люди называют этот город Basis Schola.\n"

 state_lore_name.8: "[763.GetCapitalVictoryPointName]"
 state_lore_desc.8: "\nВеликая война отделила Кенигсберг от Германии. Однако этот город рос при особой поддержке и внимании германского правительства, а с приходом нацистского режима даже использовался как временная тюрьма для заключения оппозиционеров. По иронии судьбы, теперь, когда нацизм пал, именно нацистские силы оказываются там запертыми.\n\nСопротивление Кенигсберга не было ожесточенным. При непрерывных осаде и бомбардировках оборона города быстро рухнула. Когда германская армия сдалась и региональное правительство подняло белый флаг, Тринити наконец полностью завладела этой землей.\n\nНо цена была высока: Кенигсберг нес глубокие раны. Город, который когда-то называли духовной столицей немцев, был разрушен, и на этих руинах Тринити пишет новую историю. Проекты восстановления не только стремятся возродить руины, но и стереть имя прошлого. Сегодня это место больше не называется Кенигсберг. Тринити покрывает его своим собственным именем, Кимигаяма, открывая новую эру.\n"
  
 state_lore_name.9: "Вайс-Сити"
 state_lore_desc.9: "\nБлистательная слава 30-х годов уже позади. Тем не менее, Вайс-Сити остается столицей удовольствий, живя в тени солнца и разгула Франции. Этот город, вобравший в себя французское очарование, его суету и скрытую внутри жадность, бросает бесконечные истории своим посетителям.\n\nВ Оушен-Бич отели, украшенные в пастельных тонах, красуются, словно музеи, а белый песок сверкает на солнце, будто заставляя глаза слепнуть. В Маленькой Кубе поджаренный аромат из оживленных пекарен манит людей, но их подоплека так же остра, как взгляд торговца, стремящегося лишь к выгоде.\n\nНа блошином рынке Тиша Вака пиратские бренды встречают покупателей с выражением «более аутентичные, чем аутентичное», словно раскрывая саму суть этого города. А в порту Вайс-Сити, называемом мировой столицей круизов, выстраиваются роскошные суда: с одной стороны они демонстрируют элегантную романтику путешествий, а с другой — без стыда выставляют напоказ вес денег.\n\nВайс-Сити по-прежнему ярок, по-прежнему нелеп и в то же время странно горек. Здесь даже солнце светит с той же интенсивностью, что и бумажник туриста.\n\n§ОО, Вайс-Сити, детка!§!"

 state_lore_name.10: "[Statelore_Get_Abydos_homeschool_name]"
 state_lore_desc.10: "[Statelore_Get_Abydos_homeschool_desc]"
 state_lore_name.10_normal: "Огромная песчаная дюна"
 state_lore_desc.10_normal: "\nЭто был исторический венгерский город, где сливаются притоки Дуная, но после Великого Переноса он оказался в тени колоссальной песчаной горы. Несмотря на трагедию того, что северо-западный регион оказался погребен под песком, добыча «Пироксенов» и древних реликвий, хлынувших из горы, привлекла бесчисленных авантюристов и компании, что привело к деформированному развитию. Город сохраняет шаткое равновесие, где соседствуют угроза песчаных бурь и мечта разбогатеть одним ударом.\n\nНа месторождениях, куда не достает контроль правительства, несчастные случаи и инциденты не прекращаются ни на день, но соблазн голубого сияния, которое извергает песчаная гора, продолжает неустанно призывать людей в этот опасный город."
 state_lore_name.10_abydos_own_state: "Главное здание Абидоса"
 state_lore_desc.10_abydos_own_state: "\nПередовой футуристический мегаполис, возвышающийся на месте исчезнувшей песчаной горы, и священная земля (聖地) Федерации Абидоса. В новом городском районе на северо-западе, развитом вместе с реконструкцией главного здания, возвышаются небоскребы и инфраструктура последнего поколения, концентрирующие «сверхтехнологизм» Кивотоса, становясь бесспорно элитным городом на высочайшем уровне федерации.\n\nС главным зданием Абидоса как ядром, здесь сосредоточены ключевые функции политики, экономики и технологий, фактически выполняя роль второй столицы федерации. Место, где песок когда-то был синонимом бедствия, превратилось в символ надежды и процветания и теперь является большим оживленным городом, куда стекаются паломники и желающие обучиться передовым технологиям.\n"