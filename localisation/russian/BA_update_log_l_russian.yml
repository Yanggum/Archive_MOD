l_russian:
  BA_what_update_button_tt:0 "Главный экран: Красная Зима\n\n"
  BA_what_update_tt_delayed: "§YОбновление 0.7.2§!§W\n- §RКрасная Зима§!: завершена ветка «Принятие троцкизма»\n- §PШествие ста демонов§!: добавлен сценарий поражения Нанкиботоса в войне\n- §tОборонный комитет Красной Зимы§!: добавлен контент после создания автономного комитета Финляндии\n- §CРазведывательное агентство 68§!: добавлена концовка «Революции 68-го»"

  BA_pb_update_tt: "§CПравь, Британия§!"
  BA_pb_update_tt_delayed: "§L\"Будучи здоровым, не забывай о больных; будучи в спокойствии, не забывай о буре.\"\n\nЭта английская пословица передает мудрость о здоровье, делая акцент на профилактике и подготовке: будучи здоровым, предвидь трудности болезни и готовься к будущим рискам. Кроме того, она напоминает, что нынешняя стабильность не вечна, и призывает нас быть благодарными за настоящее.\n\nДо октября 1935 года эта поговорка, возможно, не находила отклика в Британии. Но после Кризиса Великой войны такие державы, как Франция и Германия, потерпели поражение от сущностей из иного мира. Германия рухнула, не имея возможности отступить; Франция бежала в Северную Африку; и Британия оказалась под такой же угрозой.\n\nАтака Корпорации Кайзера была подобна нападению спящей кошки, направленной против Британии: они захватили порт Дувр, а затем пал Лондон. Сейчас страной правит объединенное Верховное командование, но ситуация не улучшается.\n\nБоже, храни нашего короля.§!"
  BA_sr_update_tt: "§tСияй§!Я — Полярная звезда революции§!"
  BA_sr_update_tt_delayed: "§L\"В Великой войне социальные противоречия, возникающие из-за неравномерного развития, обнажаются без покрова и являют свою истинную форму.\"\n§t– Лев Троцкий§!\n\nСтуденты Красной Зимы прибыли в холодные края, до конца не понимая, за что они сражались в хаотической войне в Скандинавии, и оказались изолированы в незнакомой реальности. Однако у них есть два оружия:\n\nПервое — идеология. Они представляют революцию, готовые создать государство рабочих и крестьян и объединиться с единомышленниками.\n\nВторое — солидарность. Обладая опытом управления в крупных масштабах и действуя по единому плану, они могут продвигать свои цели с полной самоотдачей. Как только управление будет восстановлено, Красная Зима раскроет свой несравненный потенциал.\n\nИ все же их ждет множество испытаний:\n\n- Военизированные формирования Минори Ясумори и другие антиправительственные группы продолжают сеять хаос. Если Секретариат Ренки и Черино не преодолеет послевоенный экономический коллапс, гнев перерастет в насилие.\n- Массовая бюрократическая неэффективность сохраняется в таких институтах, как Генштаб, Комиссия безопасности и Военная администрация. Пока не будет сломлена пассивность бюрократов, управление будет продолжать давать сбои.\n- Внешние змеи окружают Красную Зиму: в Тринити растет фашистское контрреволюционное крыло, а местные правительства сохраняют враждебность. Требуется железная солидарность.\n\nБудучи подростками в пубертате, они блуждают без цели. Но если они последуют за идеологией и солидарностью, чтобы найти\n§tСияй§!Я — Полярная звезда революции§!, они будут двигаться вперед с силой, сокрушат препятствия и добьются триумфа.§!"
  BA_ger_update_tt: "§4Пасмурный день§! и §Oсолнечный§! §Yс сиянием§!"
  BA_ger_update_tt_delayed: "§L\"Но никто не будет плакать по нам. Зима не может длиться вечно. Однажды мы с радостью скажем: «Родина, ты снова моя».\"\n– Отрывок из «Солдат Болота»\n\nНемцы движутся по бескрайней пустоши, как скитальцы, ведомые Моисеем к недостижимому горизонту. Покинутые и без лидера, эти «сироты» продолжают жить и идти в неизвестность: в Германию.\n\nМоисей провел народ Израиля сквозь Красное море к новой земле, разделяя их веру. Кто станет Моисеем для немцев? Несомненно, он ответит на их страдания. Вопрос в том:\n\n§YКто будет немецким Моисеем?§!\n\nПод §4пасмурным днем§! и §Oсолнечным§! §Yс сиянием§!, они найдут ответ.§!"