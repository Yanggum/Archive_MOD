 JAP_Greater_East_Asia_Co_Prosperity_Sphere_desc: "\n\n£GFX_decision_daitoakyoaeigen\n\n\n\n\nLos pueblos de Asia llevan más de un siglo sufriendo bajo la opresión de las potencias occidentales en nombre del imperialismo. Para liberarlos de este dolor, debemos construir una esfera de influencia unificada en Asia, liderada por Japón, que los emancipe del dominio occidental."

