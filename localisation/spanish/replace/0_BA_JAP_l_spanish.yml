l_spanish:
 JAP_guide: "Súbdito de Su Majestad el Emperador\n\n£white_dot Completa el control sobre Manchuria y el Norte de China.\n£white_dot Culmina la liberación de los pueblos de Asia Sudoriental.\n£white_dot §YCompleta la Co-Prosperidad.§!\n\n§RSi todo bajo el cielo es una sola familia, ¿cómo podría no ser bueno?§!"
 JAP_country_intro_header: "La nación del sol naciente"
 JAP_country_intro_content: "La Restauración Meiji transformó por completo a un Japón que antes se aferraba únicamente a los legados del pasado. Un país de treinta millones de habitantes, en apenas setenta años, se convirtió en un hogar donde viven más de setenta millones de súbditos, más del doble que antes; y la riqueza de la nación no se duplicó, sino que creció decenas de veces. Y para colmo, tras derrotar a Rusia, el prestigio del Imperio se extendió por toda la Gran Asia Oriental con el ímpetu del sol naciente.\n\nLa Restauración cambió Japón de una manera radical, pero no todo avanzó de forma positiva. La gloria del Imperio conseguida durante el último siglo está ligada al sacrificio de los campesinos para impulsar la industrialización, y la riqueza forjada por el Estado permanece en una estructura deformada, concentrada en lo alto de la pirámide social. El orgullo de haber fomentado una industria moderna, si se mira por dentro, no es más que una imitación torpe de los productos occidentales.\n\nLa política expansionista dirigida contra Corea y China estaba ocultando su lado oscuro, pero esto tampoco puede durar para siempre. El enorme gasto militar y la posición fortalecida del ejército ejercen una presión inmensa sobre el gobierno. La administración colonial, salvo en Taiwán, acumula déficits constantes; y el Pánico Financiero de Shōwa y la Gran Depresión anudaron todos los problemas del Imperio de forma horrorosa, como si fueran el nudo gordiano. El Incidente de Manchuria, visto como una oportunidad para romperlo, en realidad agravó la situación al irritar a potencias como el Reino Unido y los Países Bajos.\n\nAsí, los años pasados de la era Shōwa esparcieron el presagio de que, pese a su orgullo y esplendor, el Imperio se encamina hacia una terrible decadencia."
 JAP_country_intro_header_1: "$JAP_country_intro_header$"
 JAP_country_intro_content_1: "La hazaña que Tokugawa Ieyasu conquistó en secreto, aguardando su momento, se ha repetido. Un grupo ajeno, semejante a la humanidad pero no idéntico, se superpuso por completo sobre Occidente, y al mismo tiempo la presión que pesaba sobre el Imperio también se disipó.\n\nFue una buena noticia, sí, pero no debe mirarse con ligereza. El Imperio debe contemplar lo que vendrá después de consolidar una posición inconmovible en la Gran Asia Oriental. Si uno se conoce a sí mismo y conoce al otro, alcanzará cien victorias; pero, por ahora, el conocimiento sobre esos seres del otro mundo sigue siendo limitado. Algunos incluso tienen la piel blanca y evocan a ciertos individuos que desaparecieron o que aún permanecen; mientras que otros se parecen, de forma extraña, a nuestro Imperio o a China.\n\nCon el amanecer del año Shōwa 11, hemos entrado en una nueva fase. Aún quedan muchas tareas para el Imperio. Incluso dejando de lado a estas nuevas existencias, la pobreza rural persiste, y con la desaparición de Europa la economía, en vez de mejorar, retrocede más que antes. Sin embargo, a diferencia del pasado, está claro que al Imperio se le han abierto opciones que no son únicamente la decadencia."

 JAP_Revolution_democracy: "Comité Revolucionario Japonés"
 JAP_Revolution_democracy_DEF: "el Comité Revolucionario Japonés"
 JAP_Revolution_democracy_ADJ: "del Comité Revolucionario Japonés"
 JAP_No_More_militarism: "Control civil"
 JAP_No_More_militarism_desc: "Durante la Gran Depresión, el ejército intervino en varios incidentes. A pesar del éxito de la revolución, aún permanece una cúpula militar con tendencias militaristas. Debemos controlarlos por medios democráticos."
 JAP_zaibatsus: "Zaibatsu"
 JAP_zaibatsus_empowered: "Zaibatsu fortalecidos"
 JAP_zaibatsus_challenged: "Zaibatsu desafiados"
 JAP_challenge_the_zaibatsus: "Desafiar a los Zaibatsu"
 JAP_guide_the_zaibatsus: "Guiar a los Zaibatsu"
 JAP_intervene_in_china_communism: "Difundir la revolución"
 JAP_intervene_in_china_communism_desc: "Nuestra revolución no debe terminar en Japón. Debemos expandirla por el mundo."
 JAP_defeat_American_Imperialism: "Derrotar al imperialismo estadounidense"
 JAP_defeat_American_Imperialism_desc: "Estados Unidos se ha promocionado internacionalmente como la cuna de la libertad, pero en realidad no es diferente de cualquier otro estado imperialista. Debemos romper su hegemonía en el Pacífico y construir una prosperidad común."
 JAP_Remember_Daisho_Demokrashi: "Recordar la democracia Taishō"
 JAP_Remember_Daisho_Demokrashi_desc: "La década de 1920 fue una época dorada para Japón tanto cultural como económicamente. Despertemos en el pueblo la nostalgia por aquellos 'buenos tiempos' y animémoslos a reclamar sus derechos."
 JAP_Opposition_of_Peace_Preservation_Act: "Oposición a la Ley de Preservación de la Paz"
 JAP_Opposition_of_Peace_Preservation_Act_desc: "La Ley de Preservación de la Paz, promulgada en 1925, sirvió como fundamento para reprimir tanto a las fuerzas de izquierda como de derecha, reprimiendo los movimientos democráticos y liberales y acelerando la conversión de Japón en un estado militarista."
 JAP_purge_the_militarists: "Depuración de los militaristas"
 JAP_remove_of_peace_preservation_act: "Abolición de la Ley de Preservación de la Paz"
 JAP_remove_of_peace_preservation_act_desc: "La ley maldita que atormentó a la sociedad y al pueblo japonés desde 1925 ya no existe. Solo quedará como una página más en los libros de historia."
 JAP_Civil_War_Damage_Recovery: "Recuperación tras la guerra civil"
 JAP_Civil_War_Damage_Recovery_desc: "La guerra civil que azotó todo Japón dejó cientos de miles de víctimas. Debemos compensarlos y reconstruir las casas e infraestructuras destruidas."
 JAP_Local_autonomy_expansion: "Expansión de la autonomía local"
 JAP_Local_autonomy_expansion_desc: ""
 JAP_remove_of_Ministry_of_Development: "Abolición del Ministerio de Colonias"
 JAP_remove_of_Ministry_of_Development_desc: ""
 JAP_liberate_south_seas_mandate: "Integrar el Mandato del Pacífico Sur"
 JAP_liberate_south_seas_mandate_desc: "Tras nuestra participación en la Gran Guerra en Europa, obtuvimos las antiguas colonias alemanas en el Pacífico como recompensa. Aunque aún se gobiernan como mandatos de la Sociedad de Naciones, el proceso de asimilación de los nativos ha avanzado considerablemente. Por ello, los integraremos formalmente como parte de nuestro territorio metropolitano."
 JAP_the_taiwan_question: "La cuestión de Taiwán"
 JAP_the_taiwan_question_desc: "Aunque hemos gobernado Taiwán durante un tiempo, su cuestión de autodeterminación se vuelve cada vez más urgente. ¿Podemos afirmar que defendemos verdaderamente los ideales democráticos si negamos el derecho a la autodeterminación de nuestros vecinos?"
 JAP_crush_chinese_communists: "Eliminar a los comunistas en China"
 JAP_crush_chinese_communists_desc: ""
 JAP_develop_nanyo_gunto: "Desarrollar el Mandato del Pacífico Sur"
 JAP_develop_nanyo_gunto_desc: "El Mandato del Pacífico Sur es nuestro trampolín hacia el sur y nuestra base para proyectarnos al océano. Debemos invertir más en esta región."
 JAP_crush_soviet: "Eliminar la gran amenaza"
 JAP_crush_soviet_desc: "[SOV.GetName] se promociona como un país para los trabajadores, pero en realidad [SOV.GetLeader] ejerce el poder como un dictador en busca de beneficio personal. Debemos liberar a los pueblos que sufren bajo el puño de [SOV.GetLeader]."
 JAP_the_korean_question: "La cuestión coreana"
 JAP_devlop_korean: "Desarrollar Corea"
 JAP_devlop_korean_desc: ""
 JAP_develop_taiwan: "Desarrollar [524.GetName]"
 JAP_develop_taiwan_desc: "Desarrollar [524.GetName]"

 BA_japan.1.t: "¡Ciudadanos exigen la abolición de la Ley de Preservación de la Paz!"
 BA_japan.1.d: "Secreto\nInforme\nImperio del Gran Japón, año Shōwa 11 [GetMonth]\nAsunto: Informe sobre las protestas que exigen la abolición de la Ley de Preservación de la Paz\n\n1. En ciudades clave como Tokio, Osaka y Nagoya, han estallado grandes protestas exigiendo la abolición de la Ley de Preservación de la Paz.\n2. Los manifestantes insisten en su abolición inmediata y continúan congregándose en el centro de las ciudades.\n3. La policía militar ha sido desplegada en el lugar y se mantiene en confrontación con los manifestantes. Se está manejando la situación con firmeza para evitar su deterioro.\n4. Por el momento no hay enfrentamientos graves, pero hay señales de que las protestas podrían intensificarse. Se requiere vigilancia continua.\n\nFin del informe"
 BA_japan.1.a: "¡Traidores, enemigos de la nación! ¡Abran fuego!"
 BA_japan.1.b: "Debemos escuchar la voz del pueblo."
 BA_japan.2.t: "Represión decidida contra protestas de elementos subversivos"
 BA_japan.2.d: "1. El Primer Ministro ha ordenado la disolución inmediata por la fuerza de los manifestantes.\n2. Se ha dado la orden a la policía militar de reprimir con dureza, considerando incluso el despliegue del ejército si es necesario.\n3. Se ha dispuesto el arresto de los cabecillas y su severo castigo."
 BA_japan.2.a: "Fin del informe"
 BA_japan.3.t: "Plan para impulsar la reforma legal escuchando al pueblo"
 BA_japan.3.d: "1. El Primer Ministro ha decidido aceptar las demandas de los manifestantes.\n2. Se ha ordenado la formación de un comité especial para abolir la Ley de Preservación de la Paz.\n3. Está prevista una reunión con los representantes de los manifestantes y se están llevando a cabo negociaciones para una disolución pacífica."
 BA_japan.4.t: "Fusé Tatsuji"
 BA_japan.4.d: "Hoy, Fusé Tatsuji fue arrestado en su residencia por la Policía Especial Superior bajo cargos de violar la Ley de Preservación de la Paz. Ex fiscal, abogado de derechos humanos y exdiputado electo por el Partido de los Trabajadores y Campesinos en las elecciones generales de 1928, es una figura respetada por el pueblo común y quien lideró las recientes protestas por la abolición de dicha ley.\n\nSeñaló la falta de legitimidad democrática del actual gobierno y la existencia de la Ley de Preservación de la Paz, y declaró que continuará su lucha por su abolición y la restauración de la democracia.\n\nTras 12 horas de tortura, confesó todos los cargos. ¿Qué debemos hacer con él?"
 BA_japan.4.a: "¡Acúsalo por violar la Ley de Preservación de la Paz y encarcélalo en la prisión de Osaka!"
 BA_japan.6.t_china: "[609.GetName], convertida en tierra de nadie"
 BA_japan.6.t_manchu: "[745.GetName], convertida en tierra de nadie"
 BA_japan.6.d: "¿Deberíamos aprovechar la guerra civil en Japón y tomar esta zona?"
 BA_japan.6.a: "¡Invasión, vamos!"
 BA_japan.7.t: "[FROM.GetAdjective] nos arrebata territorio"
 BA_japan.7.d: "El título lo dice todo"
 BA_japan.8.t: "Elecciones libres en [524.GetName]"
 BA_japan.8.d: "Hoy se ha anunciado que en la sede del Gobierno Civil Japonés en la provincia de [524.GetName], antigua oficina del gobernador general, se celebrará una votación sobre la integración con China. La noticia se difundió rápidamente a través de los medios locales y la votación se llevará a cabo mañana.\n\nAhora debemos esperar para ver si elegirán la integración con China o la plena integración con el territorio interior..."
 BA_japan.9.t: "[524.GetName] opta por la integración con el territorio interior"
 BA_japan.9.d: "Afortunadamente, en la votación realizada entre los residentes de [524.GetName], la opción de integración con el territorio interior obtuvo un margen ligeramente superior al de la independencia. Oficialmente, la isla de [524.GetName] deja de ser un territorio de ultramar y se considera parte de la metrópolis, integrándose al sistema administrativo de prefecturas.\n\nTras la votación, los independentistas de [524.GetName] han optado por luchar dentro de la Dieta japonesa para ampliar los privilegios de la región."
 BA_japan.9.a: "Excelente."
 BA_japan.10.t: "[524.GetName] opta por integrarse con China"
 BA_japan.10.d: "Lamentablemente, en la votación realizada entre los residentes de [524.GetName], la integración con China obtuvo un margen ligeramente superior al de la integración interior. Desde hoy, la administración de [524.GetName] ha sido transferida al 'Gobierno Provisional de Transición de Taiwán', liderado por residentes locales.\n\nAunque por ahora seguirán bajo nuestra fuerte influencia, la bandera del Sol Naciente ha sido bajada silenciosamente en la sede del gobernador en Taipéi, siendo reemplazada por la bandera de cielo azul, sol blanco y tierra roja del gobierno chino."
 BA_japan.10.a: "Les deseamos lo mejor."
 BA_japan.11.t: "[FROM.GetAdjective] devuelve [524.GetName]"
 BA_japan.11.d: "El título lo dice todo"
 BA_japan.11.a: "¡Wansui!"
 BA_japan.12.t: "Generales llegados desde [FROM.GetAdjective]!"
 BA_japan.12.d: "Se informa que Japón ha relegado a generales con tendencias militaristas a Manchuria.\n\n¿Alguien jugará con Manchukuo mientras la IA japonesa sigue la ruta democrática en el mod de Blue Archive?"
 BA_japan.12.a: "Vaya..."
 BA_japan.13.t: "Informe sobre el relevo de generales militaristas"
 BA_japan.13.d: "Secreto  \nInforme  \nImperio del Gran Japón, año Shōwa 11 [GetMonth]\nAsunto: Informe sobre el relevo de generales con tendencias militaristas hacia Manchuria\n\n1. Recientemente, varios generales de carácter expansionista y militarista han sido enviados a Manchuria.\n2. Estos oficiales eran conocidos por abogar por una política de expansión agresiva y preparativos bélicos.\n3. Aunque se les han asignado nuevas misiones en Manchuria, se detectan señales de descontento y resistencia. Se requiere vigilancia continua y recopilación de inteligencia.\n\nFin del informe"
 BA_japan.14.t: "¡[FROM.GetAdjective] propone industrializar [ROOT.GetName]!"
 BA_japan.14.d: "[FROM.GetAdjective] nos ha propuesto un plan de industrialización para Corea. Esto podría acelerar enormemente la industrialización de [ROOT.GetAdjective], pero también plantea preocupaciones sobre una posible subordinación económica general ante [FROM.GetAdjective]."
 BA_japan.14.a: "Peor es nada..."
 BA_japan.14.b: "No necesitamos nada de eso."
 BA_japan.15.t: "[FROM.GetAdjective] aprueba nuestro plan de industrialización"
 BA_japan.15.d: "[FROM.GetAdjective] ha aceptado nuestra propuesta. Actualmente, trabajadores cualificados de [ROOT.GetAdjective] han partido hacia [FROM.GetAdjective] para impartir conocimientos técnicos, y la relación entre ambas naciones se fortalecerá aún más."
 BA_japan.15.a: "¡Muy bien!"
 BA_japan.16.t: "[FROM.GetAdjective] rechaza nuestro plan de industrialización"
 BA_japan.16.d: "[FROM.GetAdjective] ha rechazado nuestra propuesta..."
 BA_japan.16.a: "Qué mal..."
 BA_japan.17.t: "¡[FROM.GetAdjective] nos devuelve territorio!"
 BA_japan.17.d: "Contenido genérico sobre la devolución del territorio perdido"
 BA_japan.18.t: "Destitución de Hayashi Senjūrō"
 BA_japan.18.d: "Su Majestad el Emperador ha destituido personalmente al Ministro del Ejército Hayashi Senjūrō para frenar la arrogancia de la facción Tōseiha. Después, Su Majestad ordenó que cesaran los conflictos entre la facción Tōseiha y la Kōdōha. La moral de los Tōseiha se ha visto reducida y la Kōdōha parece satisfecha."
 BA_japan.18.a: "¿Qué ha sucedido?"
 BA_japan.19.t: "Decisión"
 BA_japan.19.d: "Las actividades de los jóvenes oficiales que apoyan a la Kōdōha se han intensificado, lo que ha generado preocupación por un posible golpe de Estado dentro del gobierno. Se reúnen en secreto con frecuencia y sus contactos con altos mandos militares son cada vez más constantes.\n\nTanto Su Majestad el Emperador como el gobierno japonés los están vigilando de cerca, aunque aún no se ha encontrado evidencia directa. Aun así, la atmósfera es tensa y Japón parece estar al borde de un evento importante."
 BA_japan.19.a: "Prepara una represión total."
 BA_japan.19.b: "Que se les apoye en secreto."
 BA_japan.19.c: "No actuemos con tanta prisa."
 BA_japan.20.t: "Intento de insurrección de los jóvenes oficiales"
 BA_japan.20.d: "Los jóvenes oficiales intentaron derrocar al gabinete y tomar el control de Tokio, pero fracasaron en asesinar al Primer Ministro y detener a altos funcionarios, y su levantamiento armado en Tokio fue sofocado más rápido de lo esperado.\n\nEl gobierno declaró el estado de emergencia y, con la cooperación de las fuerzas leales del ejército, reprimió con firmeza a los insurgentes. Los cabecillas del golpe fueron arrestados o ejecutados en el acto, y la rebelión fue completamente aplastada.\n\nEl Emperador emitió una declaración condenando la traición, y el gobierno declaró que la insurrección fue completamente controlada. La Kōdōha está destinada a ser completamente purgada."
 BA_japan.20.a: "La Kōdōha ha llegado a su fin."
 BA_japan.21.t: "Renuncia en bloque del gabinete de Okada Keisuke"
 BA_japan.21.d: "Tras la represión del golpe de los jóvenes oficiales, la pésima respuesta de Okada Keisuke generó críticas constantes por parte del ejército y del pueblo. Poco después, cediendo ante la presión militar, Okada anunció la renuncia total de su gabinete.\n\nLa atención política ahora se centra en quién será designado como nuevo Primer Ministro."
 BA_japan.21.a: "Hirota Kōki, un primer ministro equilibrado."
 BA_japan.21.b: "Ugaki Kazushige, el moderador del ejército."
 BA_japan.21.c: "Hayashi Senjūrō, de la facción Tōseiha."
 BA_japan.22.t: "Renuncia de Hirota Kōki"
 BA_japan.22.d: "Hirota Kōki, bajo presión del ejército y con un bajo nivel de apoyo popular, ha decidido finalmente dimitir como Primer Ministro.\n\nTras su renuncia, la facción Tōseiha logró maniobrar políticamente para nombrar a Hayashi Senjūrō como nuevo Primer Ministro."
 BA_japan.22.a: "Qué desastre..."
 BA_japan.23.t: "Formación del gabinete de Konoe Fumimaro"
 BA_japan.23.d: "Con el aumento de la opinión pública contraria al ejército y los continuos errores políticos de la Tōseiha, el escenario político japonés sintió la necesidad de un cambio. En este contexto, Konoe Fumimaro aceptó la solicitud del Emperador y formó un nuevo gabinete, atrayendo gran atención pública. A pesar de la presión del ejército, Konoe surgió como una figura central y líder esperanzador para el pueblo.\n\nDesde su investidura, ha captado la atención de la Kōdōha y de la opinión pública. Su política moderada está siendo observada de cerca, y actualmente se sabe que está promoviendo una relajación de la Ley de Seguridad Nacional."
 BA_japan.23.a: "Confiemos en él."
 BA_japan_23_tt: "§RSi no se completa la reforma nacional antes de octubre de 1940, Konoe Fumimaro perderá el impulso político necesario.§!"
 BA_japan.24.t: "Disolución del parlamento por Hayashi Senjūrō"
 BA_japan.24.d: "Apenas asumió el cargo, Hayashi Senjūrō inició movimientos para neutralizar al parlamento. Aceleró la resolución de asuntos pendientes del gabinete anterior y tomó la decisión de disolver el parlamento. Aunque algunos partidos se opusieron fuertemente, Hayashi los ignoró y organizó elecciones con el apoyo de facciones militaristas.\n\nSin embargo, los partidos pro-militares sufrieron una aplastante derrota en las elecciones. Su intento de disolver nuevamente el parlamento fracasó. Finalmente, la creciente oposición en la cámara culminó con una moción de censura, obligándolo a renunciar rápidamente."
 BA_japan.24.a: "Konoe Fumimaro asumirá como nuevo Primer Ministro."
 BA_japan.25.t: "Renuncia de Ugaki Kazushige"
 BA_japan.25.d: "Tras el intento de golpe de la Kōdōha, Ugaki Kazushige fue nombrado Primer Ministro. Intentó impulsar la recuperación económica mediante la reducción del gasto militar, lo que generó descontento entre las facciones más radicales y la Tōseiha. Su negativa a reforzar la guarnición en Manchuria fue particularmente polémica.\n\nEl ejército lo acusó de falta de liderazgo, y su apoyo popular se desmoronó. Después de que el Ministro del Ejército renunciara presionado por la Tōseiha, Ugaki decidió que no podía mantener el gabinete y presentó su renuncia."
 BA_japan.25.a: "Konoe Fumimaro asumirá como nuevo Primer Ministro."
 BA_japan.27.t: "Fundación de la Asociación para el Apoyo al Régimen Imperial"
 BA_japan.27.desc: "El Movimiento de Nuevo Orden impulsado por Konoe Fumimaro comenzó con nobles intenciones de reformar Japón y liberarlo de la influencia militar. Sin embargo, con el tiempo, sus ideales fueron distorsionados bajo la fuerte presión del ejército. Su sueño reformista se desvaneció y sus acciones quedaron atadas a los dictados de los militares.\n\nHoy se ha fundado oficialmente la \"Asociación para el Apoyo al Régimen Imperial\". Esta organización busca unificar al pueblo japonés bajo un sistema total de movilización nacional para la guerra, estableciendo un régimen centralizado de cooperación entre gobierno y militares. Todos los partidos políticos han sido disueltos, y esta asociación se convierte en la única organización política de Japón."
 BA_japan.27.a: "Esto será útil."
 BA_japan.27.b: "Está completamente manipulado por los militares."
 BA_japan.27.c: "Esto no afecta en nada a nuestra causa."
 BA_japan.27.d: "El panorama político de Japón ha cambiado radicalmente."
 BA_japan_27_flag: "La §YAsociación para el Apoyo al Régimen Imperial§! se ha convertido en un títere del ejército"
 BA_japan.28.t: "Fundación de la Asociación para el Apoyo al Régimen Imperial"
 BA_japan.28.d: "Konoe Fumimaro lideró el Movimiento de Nuevo Orden para reconstruir Japón ante la crisis, con la firme convicción de que el viejo sistema multipartidista era incapaz de guiar al país hacia el futuro. Con el objetivo de implementar una renovación nacional, fundó un nuevo orden político.\n\nAsí nació hoy, oficialmente, la \"Asociación para el Apoyo al Régimen Imperial\". Esta organización, en obediencia al Emperador, se encargará de unir al pueblo japonés, liderar reformas políticas y económicas, y convertir a Japón en un estado moderno y eficiente. Es un nuevo sistema basado en la tradición y el alma del pueblo.\n\nTodos los partidos han sido disueltos. Esta asociación será el único motor de la reforma nacional. Bajo el nombre del Emperador, todos los ciudadanos colaborarán para construir un imperio fuerte. El sol de Japón brilla con nueva luz y no se detendrá en su avance."
 BA_japan.28.a: "¡Avancemos hacia el Nuevo Orden!"
 BA_japan.29.t: "Establecimiento del Cuartel General Imperial"
 BA_japan.29.d: "Japón se ha visto arrastrado a la guerra contra [FROM.GetName]. Para asegurar una dirección eficaz del conflicto y una movilización eficiente de recursos, la facción Tōseiha ha establecido el \"Cuartel General Imperial\". Este organismo integra completamente el gabinete y el ejército bajo una estructura de control militar.\n\nAprobado por el Emperador, este Cuartel dirigirá todas las operaciones de guerra bajo el mando de la Tōseiha y se encargará de las decisiones militares y la gestión de recursos nacionales. Japón entra así en un régimen de guerra total."
 BA_japan.29.a: "Entendido."
 BA_japan.30.t: "Fundación de la Liga Revolucionaria por el Kokutai"
 BA_japan.30.d: "Tras el fracaso de las reformas de Konoe Fumimaro, los reformistas quedaron en caos. La presión política de la Tōseiha frustró los esfuerzos moderados de Konoe, y la ideología radical de la Kōdōha, encabezada por Kita Ikki, resurgió. Con el apoyo de sectores radicales del ejército y nacionalistas, se fundó la \"Liga Revolucionaria por el Kokutai\".\n\nKita Ikki, abogando por una revolución centrada en el Emperador, unió a radicales del ejército, intelectuales nacionalistas y socialistas reformistas bajo un mismo objetivo: una transformación fundamental del Estado japonés."
 BA_japan.30.a: "Erradicaremos de raíz el cáncer de Japón."
 BA_japan.31.t: "Renuncia de Konoe Fumimaro"
 BA_japan.31.d: "Hoy, el Primer Ministro Konoe Fumimaro ha anunciado su renuncia, declarando que ha cumplido su papel y que no planea regresar.\n\nJunto con su dimisión, recomendó al príncipe Higashikuni Naruhiko como su sucesor. Sin embargo, algunos ministros sugieren nombrar a Tōjō Hideki para controlar al ejército."
 BA_japan.31.a: "Tōjō Hideki, confiemos en que nos escuche."
 BA_japan.31.b: "El Príncipe Naruhiko, su autoridad podría someter al ejército."
 BA_japan.32.t: "Tōjō Hideki dimite tras la pérdida de [JAP_tojo_hideki_end.GetName]"
 BA_japan.32.d: "Durante los preparativos de guerra contra [USA.GetName], Tōjō Hideki enfrentó crecientes críticas. La pérdida de [JAP_tojo_hideki_end.GetName] bajo su liderazgo fue el golpe final. Ya no puede seguir en el poder.\n\nBajo presión política, Tōjō ha renunciado. Su sucesor será Koiso Kuniaki, ex gobernador general de Corea."
 BA_japan.32.a: "¿Podrá Koiso Kuniaki revertir la situación?"
 BA_japan.40.t: "¡Wang Jingwei se pasa a Japón!"
 BA_japan.40.d: "Una noticia impactante. Wang Jingwei, considerado héroe de la revolución y sucesor de Sun Yat-sen, ha escapado de Chongqing y ha llegado a Shanghái, actualmente bajo ocupación japonesa.\n\nSu conflicto de poder con Chiang Kai-shek comenzó con su cooperación inicial, pero se fue intensificando. Cuando Chiang fue nombrado presidente del Kuomintang y desplazó a Wang al puesto de vicepresidente, la relación entre ambos quedó completamente rota.\n\nTras la caída de Wuhan, Wang juzgó que continuar resistiendo no tenía sentido. Hizo un pacto secreto con Japón, escapó a Hanói y luego a Shanghái. Este acto fue visto como una traición, y el gobierno nacionalista ordenó su asesinato. Sin embargo, logró sobrevivir y cortó vínculos con Chiang y el gobierno que usó la fuerza contra él, a pesar de no haber cometido actos explícitos de traición."
 BA_japan.40.a: "\"Hermano, toma el camino fácil. Yo tomaré el difícil.\""
 BA_japan_40_tt: "\"Qué triste y doloroso. Solo espero que reflexione y regrese.\"\n– Chiang Kai-shek"

 BA_japan.41.t: "Wang Jingwei se une al Gobierno de Renovación"
 BA_japan.41.d: "¡La operación para atraer a Wang Jingwei ha sido un éxito! Con el fracaso de la Operación Trautmann y la prolongada guerra sino-japonesa, Wang ha llegado a Shanghái y ha comenzado discusiones para establecer un nuevo Gobierno Nacional de la República de China bajo su liderazgo, junto a varias figuras pro-japonesas."
 BA_japan.41.a: "¡La guerra terminará pronto!"

 BA_japan.42.t: "El destino de [MEN.GetName]"
 BA_japan.42.d: "[MEN.GetName] es un gobierno bastante contradictorio. Aunque fue establecido para los mongoles, su territorio efectivo tiene más población china y manchú que mongola. Ahora debemos decidir su destino."
 BA_japan.42.a: "Usemos esto como base para devorar a [MON.GetAdjective]"
 BA_japan.42.b: "Ya no lo necesitamos; degradémoslo a un gobierno autónomo de [WCH.GetAdjective]"
 BA_japan.42.c: "Degradémoslo a gobierno autónomo de [WCH.GetAdjective] y usemos eso como excusa para reclamar territorio a [MON.GetAdjective]"

 BA_japan.43.t: "Negociaciones con [TIB.GetAdjective]"
 BA_japan.43.d: "Tíbet se encuentra en una zona periférica de China, pero al estar justo encima de la colonia británica de India, ofrece una ventaja estratégica para un ataque lateral. Por otro lado, si los británicos logran influenciar a Tíbet o convertirlo en colonia, China estaría en peligro por el flanco. Por eso debemos asegurarnos de integrar firmemente a Tíbet dentro de la Esfera de Prosperidad de la Gran Asia Oriental."
 BA_japan.43.b: "Si cedemos [601.GetName] y [604.GetName], se unirán a nuestra causa."
 BA_japan.43.a: "¡Banzai!"

 BA_japan.44.t: "¿Negociaciones con [FROM.GetAdjective]?"
 BA_japan.44.d: "Blablablá... siendo honestos, ¿quién jugaría como Tíbet? Sinceramente, creo que nadie lo haría."
 BA_japan.44.a: "Esto es justo lo que necesitaba"

 BA_japan.45.t: "[FROM.GetAdjective] decide unirse a nuestra causa"
 BA_japan.45.d: "[FROM.GetAdjective] ha decidido participar en nuestra causa. ¡Estamos un paso más cerca de la Prosperidad Asiática!"
 BA_japan.45.a: "¡Banzai!"

