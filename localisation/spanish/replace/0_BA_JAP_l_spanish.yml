 JAP_economic_stimulus_plan: "Plan de Estímulo Económico"
 JAP_economic_stimulus_plan_desc: "La desaparición de Europa y el colapso económico estadounidense han dejado cicatrices significativas en nuestra economía. Debemos idear un plan para salir de esta peligrosa situación."

 JAP_nation_of_the_rising_sun: "La Nación del Sol Naciente"

 JAP_opposition_to_the_army: "Oposición a la Tōseiha"

 JAP_purge_the_kodoha_faction: "Control del Gobierno Civil"
 JAP_purge_the_kodoha_faction_desc: "El ejército controlará estrictamente al gobierno civil para asumir el control total del poder estatal. Limitaremos la influencia política de los civiles y dirigiremos todas las políticas del Estado bajo la iniciativa militar."

 JAP_support_for_the_manchurian_faction: "Apoyo a la Facción de Manchuria"
 JAP_support_for_the_manchurian_faction_desc: "La facción de Manchuria, que lideró el incidente de Manchuria, apoya firmemente la política de integración del Gran Asia Oriental. Buscan fortalecer su influencia allí, empleando recursos y fuerza militar para alcanzar sus objetivos finales."

 JAP_disarmament_for_the_economy: "Desarme por la Economía"

 JAP_establishment_of_special_economic_recovery_investigative_committee: "Comité Especial de Investigación para la Recuperación Económica"
 JAP_establishment_of_special_economic_recovery_investigative_committee_desc: "La Tōseiha jugó un papel principal en la respuesta a la Gran Depresión. Cuestionaremos su gestión económica y formaremos un comité para presentar un sistema alternativo."

 JAP_purge_of_pro_military_officials: "Depuración de Funcionarios Pro-Militares"

 JAP_formation_of_fumimaro_konoe_cabinet: "Formación de un Nuevo Gabinete"
 JAP_formation_of_fumimaro_konoe_cabinet_desc: "Nombramos como Primer Ministro a Konoe Fumimaro, una figura capaz de contener al ejército y estabilizar la política japonesa, apoyado tanto por la Kōdōha como por el pueblo."

 JAP_establishment_of_the_imperial_rule_assistance_association: "Movimiento del Nuevo Sistema"
 JAP_establishment_of_the_imperial_rule_assistance_association_desc: "El movimiento del Nuevo Sistema de Konoe busca reducir la influencia militar y establecer una vasta estructura nacional unificada. Aprovechará la pérdida de poder del ejército para fortalecer la autoridad del gobierno."

 JAP_protection_of_the_kodoha: "Debilitamiento de la Ley de Preservación de la Paz"
 JAP_protection_of_the_kodoha_desc: "Con el fin de estabilizar la política japonesa, protegeremos a diversas figuras anti-Tōseiha que han sido arrestadas. Garantizaremos su presencia política y debilitaremos al ejército, acelerando las reformas políticas."

