 MEN_add_core_of_mongolia: "Integración de Mongolia"
 MEN_add_core_of_mongolia_desc: "Durante años hemos reclamado legítimamente Mongolia, pero el ilegítimo gobierno de Ulan Bator ha rechazado nuestras demandas y continuado con la ocupación de nuestro territorio. Ahora que nuestro aliado más confiable, [JAP.GetAdjective], ha derrocado dicho gobierno, el derecho legítimo de gobernar ha regresado a nuestras manos. Debemos proclamar nuestra soberanía sobre Mongolia y unificar a los mongoles bajo un solo gobierno."
