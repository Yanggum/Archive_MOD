 COU_arona_notgood: "Sobretrabajo\n§gLa Presidenta del Consejo Estudiantil General ha sido arrinconada al borde del abismo. No solo el sistema de gobierno se derrumbó por completo debido a la Gran Transferencia, sino que incluso tras más de dos meses de intentos de control, las academias se niegan a la coordinación y al control. La Presidenta ha continuado el sobreesfuerzo, dispuesta a todo para volver a controlar Kivotos una y otra vez, pero... lo suyo es un poco grave. No, muy grave.§!"
 COU_dictator_rin: "Presidenta interina del Consejo Estudiantil General\n§gEl cargo de Presidenta del Consejo Estudiantil General nunca es algo ligero. Aunque sea interina.§!"
