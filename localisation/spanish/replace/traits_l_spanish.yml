 GEH_purist_l: "Dique de la patria\n§gLa presidenta del comité estudiantil, Shiromi Iori, es el tamiz que filtra innumerables “contaminaciones culturales nacionales” y la agricultora que cultiva el suelo donde crecerá la nación.§!"
 GEH_purist_r: "Recontructora de Gehenna\n§gLa controladora Shiromi Iori es el crisol que fusionó la civilización de Gehenna y la de Deutsch, y la reconstructora de la civilización que erradicó la cultura degenerada Gehenna-alemana y estabilizó la patria.§!"
 GEH_paranoia_ako: "Hinófila paranoica"
 GEH_morning_star_club_ako: "Jefa del Club de Luz Estelar"
 GEH_paranoia_ako_bad: "Administradora principal derrumbada"
 GEH_paranoia_ako_good: "Compañera eterna de Hina"
 GEH_friendly_sociopath: "Sociópata amable\n§g“Hina” imita a la perfección hasta los tics y gestos de la verdadera Sorasaki Hina, y dentro de la oficina del Comité de Disciplina interpreta a la “jefa perfecta” que la administradora principal y todos los miembros admiran. Pero para ella, ahora mismo, todos los ciudadanos no son más que piezas apropiadas que deben usarse para el Comité de Disciplina de Gehenna; y en su trato hacia quienes no son miembros del comité no se percibe ni un ápice de humanidad.§!"
 GEH_friendly_sociopath_tooltip: "Sociópata amable"
 GEH_successor_of_hina: "Sucesora de Hina"
 GEH_puppet_of_prefect_team: "Marioneta impotente\n§gLa única autoridad de Natsume Iroha es firmar la aprobación en los documentos del consejo de la Oficina de Planificación.§!"
 GEH_last_hope_of_prefect_team: "La última esperanza del Comité de Disciplina"
 GEH_puppet_leader_hina: "Líder marioneta\n§gSi Ako se encargará de todo, ¿para qué preocuparse por gobernar el país?§!"
 GEH_ako_partner_leader_hina: "Compañera de Ako\n§gMientras Ako esté a su lado, Hina jamás se derrumbará.§!"
 GEH_pioneer_of_science: "Pionera de la ciencia\n§gEl sistema de consejos se está desarrollando con el objetivo de alcanzar a Millennium. Pese a cualquier dificultad, alcanzaremos la ciencia y tecnología de Millennium.§!"
 GEH_yumeji_no_hana: "Flor sobre el camino de los sueños\n§gSorasaki Hina derrotó por completo el rechazo hacia Ako, que se había extendido ampliamente desde la sección de inteligencia del Comité de Disciplina hasta el partido central de Deutschland, y logró la felicidad de ambas.§!"
 GEH_the_terrible: "Trueno"
 GEH_the_guardian_of_freedom: "Guardiana de la libertad"
 GEH_puppet_leader_hina_bad: "Presidenta marioneta\n§gSorasaki Hina no gobierna el Estado por su propia voluntad; no es más que una presidenta simbólica que representa la “voluntad de las masas”.§!"
 GEH_military_chairman_hina: "Administradora militar fracasada"
 GEH_iori_trait_c_l: "Presidenta del Comité Estudiantil de Gehenna\n§gTras la trágica desaparición de Sorasaki Hina, Shiromi Iori dio un paso al frente clamando por la defensa de la “cultura pura de Kivotos”. Ya no es solo la jefa del Departamento Ejecutivo: es la presidenta que lidera a todos los cadetes de Gehenna. Bajo su liderazgo, Gehenna adorará la supremacía de los kivotosianos con Halo y renacerá como un poderoso Estado militar que excluye toda influencia externa que contamine la patria.§!"
 GEH_iori_trait_c_r: "Nueva controladora\n§gLa tragedia de Sorasaki Hina dejó en Gehenna una herida profunda y la necesidad de sanar. Shiromi Iori se alzó para levantar de nuevo esta patria rota. Quiere limpiar todo el caos y la contaminación que derribaron a Hina, y demostrar que solo un orden férreo puede salvar a Gehenna.§!"
 GEH_celestial_revolution_trait: "Revolución cultural"
 GEH_celestial_revolution_trait_1: "Revolución cultural"
 GEH_celestial_revolution_trait_2: "Revolución cultural"
 GEH_celestial_revolution_trait_B: "Ansia de libertad"
 GEH_celestial_revolution_trait_C: "Ansia de orden"
 GEH_saint_gehenna_academy_A: "Presidenta del Consejo Estudiantil de Gehenna\n§gHatami Erika es considerada una de las figuras más benevolentes y centradas en una Gehenna donde Sorasaki Hina ha desaparecido. Ahora, como presidenta estudiantil, borrará las cicatrices de la locura y el caos y enderezará la Academia Saint Gehenna.§!"
 GEH_saint_gehenna_academy_B: "Presidenta del Consejo Estudiantil de Gehenna\n§gHinomiyа Chinatsu fue señalada como “traidora” en medio de la locura por detectar traidores y estuvo al borde de perder casi toda su autoridad. Sin embargo, con esfuerzos constantes por mejorar su imagen, su sinceridad llegó; y ahora, en la Academia Saint Gehenna, permanecerá como alguien que recuerda de cerca a Sorasaki Hina.§!"
 GEH_saint_gehenna_academy_C: "Presidenta del Consejo Estudiantil de Gehenna\n§gAikiyo Fuuka es considerada la candidata más inusual a presidenta estudiantil de Gehenna. Incluso en el caos, se esforzó únicamente por ofrecer una comida a los estudiantes de Gehenna, y como resultado ganó una gran base de apoyo. Se cuenta que durante el periodo electoral recibió el apoyo entusiasta del Club de Investigación Gourmet, y que casi toda la propaganda fue hecha por dicho club.§!"
 GEH_eternal_hina_sorasaki: "Nuestra jefa eterna del Comité de Disciplina\n§gSorasaki Hina ha desaparecido, pero decidimos elevarla como nuestra jefa eterna. El Comité Sorasaki Hina guiará y protegerá al Estado usando las palabras del pasado de Sorasaki Hina y la metodología ya establecida del “sorasakismo”.§!"
 GEH_morning_star_club_A: "Presidenta estudiantil amable\n§gYozakura Kirara es considerada la figura más benevolente por las múltiples facetas que mostró durante la campaña. Liderando el club social “Brilla-Brilla”, ganó gran popularidad con la propaganda de “Juventud Gehenna”.§!"
 GEH_morning_star_club_B: "Jefa de intendencia y presidenta estudiantil\n§gAikiyo Fuuka obtuvo un alto apoyo entre las candidatas a la presidencia estudiantil de Gehenna. Se esforzó únicamente por ofrecer una comida a los estudiantes de Gehenna, y como resultado ganó una gran base de apoyo. Se cuenta que durante el periodo electoral recibió el apoyo entusiasta del Club de Investigación Gourmet y que casi toda la propaganda fue hecha por dicho club.§!"
