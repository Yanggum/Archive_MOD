 GEH_ako_trait_Z: "Administradora principal\n§gSustituyendo a la retirada Sorasaki Hina, ejerce temporalmente como jefa interina del Comité de Disciplina.§!"
 GEH_ako_trait_Y: "Presidenta estudiantil de la razón\n§gAmau Ako, tras la ex jefa del Comité de Disciplina Sorasaki Hina y la antigua presidenta de Pandemonium Hanuma Makoto, se convirtió en la presidenta estudiantil de Gehenna. Ahora intenta mirar por Gehenna entera, no solo por Sorasaki Hina como individuo.§!"
 GEH_ako_trait_X: "Jefa del Comité de Disciplina juguetona\n§gAmau Ako, sucesora de la ex jefa del Comité de Disciplina Sorasaki Hina, se convirtió en la jefa del Comité de Disciplina de Gehenna. Se esfuerza por llenar el vacío de Hina y, a veces, libera el estrés del trabajo dándole órdenes administrativas irracionales a Shiromi Iori.§!"
