#게헨나 (선도부)
 GEH_military_chairman: "Administrador militar"
 GEH_military_chairman_2: "Líder de caudillos militares"
 GEH_military_chairman_ako: "Ciudadana de uniforme\n§gSorasaki Hina no es una simple líder militar. Es la Presidenta de la República Federal y una ferviente defensora del parlamentarismo; transfiere gran parte del poder al consejo y apoya a los tecnócratas.§!"
 GEH_military_chairman_amau: "Ciudadana de uniforme\n§gSorasaki Hina no es una simple líder militar. Como presidenta del consejo que protege la constitución de la República Federal, se convirtió en el símbolo de la ley, el orden y una democracia controlada e inquebrantable.§!"
 GEH_military_chairman_c: "Presidenta del Comité de Defensa Nacional\n§gSorasaki Hina se ha entregado a la defensa de la Academia Gehenna y a la protección de la patria. Como Presidenta del Comité de Defensa Nacional, freno del Departamento Ejecutivo, está realizando amplios esfuerzos para salvaguardar de forma estable al Estado de Gehenna.§!"
 GEH_military_chairman_cl: "Presidenta del Consejo Estudiantil de Gehenna\n§gSorasaki Hina es la presidenta del consejo estudiantil de la Academia Gehenna y la jefa del Comité de Disciplina. Algunos la critican como dictadora, otros la tachan de demasiado débil. Pero hay un hecho indiscutible: que Gehenna pueda seguir existiendo tal como es hoy depende de las decisiones de Sorasaki Hina.§!"
 GEM_horns_are_new_wings: "Los cuernos son nuevas alas\n§gQue te hayan salido cuernos no significa que no puedas ser la líder del pueblo germano. Se convirtió en la orgullosa líder de todos los alemanes, y ahora Hanuma Makoto será recordada para siempre como la Führer de Alemania.§!"
 GEM_horns_are_new_wings_chiaki: "Los cuernos son nuevas alas\n§gQue te hayan salido cuernos no significa que no puedas ser la líder de Europa. Se convirtió en la orgullosa líder de toda la esfera pangermana, incluidos Alemania, Baviera y el Rin, y ahora Motomiya Chiaki será recordada para siempre en la historia.§!"
 b_tjsehqnwkd_start: "Jefa del Comité de Disciplina"
