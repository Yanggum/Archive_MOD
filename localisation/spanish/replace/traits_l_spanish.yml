 GEM_manmajeon_chairmanship_separation_trait: "Presidenta del Pandemonium"
 GEH_chairman_of_the_people_1: "Firme Presidenta del Pueblo\n§gNatsume Iroha es la fundadora de la federación y su primera presidenta. Como una gran estrella resplandeciente que se mantiene firme en medio de la marea de enormes luchas, gobernará la federación.§!"
 GEH_chairman_of_the_people_b_1: "Presidenta del pueblo\n§gNatsume Iroha es una figura histórica respaldada por dos facciones y la presidenta de los Estados Federados. Como una líder apacible que abraza a todos en medio del caos de la política de facciones, gobernará la federación.§!"
 GEH_chairman_of_the_people_b_2: "Führer del pueblo\n§gNatsume Iroha es el símbolo del gobierno federal y líder del cargo de Führer recientemente restaurado. Aunque no pueda ejercer una autoridad tan fuerte como el antiguo Führer, como el soberano más importante de las dos facciones, mediará y guiará la federación.§!"
 GEM_coordinator_trait: "Coordinadora del Estado federal"
 GEH_chairman_of_the_people_a: "Líder del roble\n§gNatsume Iroha es el símbolo de los nuevos alemanes y la líder de la nueva nación. Como un roble fuerte, Alemania quedará grabada para siempre, profundamente en esta tierra.§!"
 GEH_chairman_of_the_people_a2: "Ciudad del corazón\n§gNatsume Iroha es la buscadora de todos los federados alemanes y una constructora que edifica un paraíso cómodo para todos los pueblos. La brillante marcha de todos los pueblos federados será preservada.§!"
 GEH_Iroha_trait_a: "Comandante de tanque\n§gNuestra firme líder, que marcha siempre en un tanque, donde sea y cuando sea.§!"
