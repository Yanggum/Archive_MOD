 GEH_motomiya_chiaki_trait: "Secretaria General de Gehenna"
 GEH_motomiya_chiaki_trait_OL1: "Racionalidad y razón\n§gNuestra líder, que como un rey filósofo que guía la innovación, se esfuerza por construir un Estado eficiente.§!"
 GEH_motomiya_chiaki_trait_OR1: "Secretaria general del pueblo\n§gEl Estado tiene el deber de garantizar la vida de los ciudadanos; esto se manifiesta bajo el lema de “de la cuna a la tumba”.§!"
 GEH_motomiya_chiaki_trait_A0: "Führer\n§gAhora, sucesora del águila.§!"
 GEH_motomiya_chiaki_trait_A1: "Führer del pueblo\n§gEl cargo de Führer de la república social es una carta que garantiza el bien común de todo el pueblo, un gran contrato.§!"
 GEH_motomiya_chiaki_trait_A2: "Presidenta de la Nación\n§gNuestra líder, que se esfuerza por derrotar al gran mal y proteger la civilización germano-gehniana en toda crisis.§!"
 GEH_motomiya_chiaki_trait_A3: "Führer\n§gUn águila que rompe el cascarón y alza el vuelo.§!"
 GEH_motomiya_chiaki_trait_A4: "Comandante suprema del pueblo\n§gEl cargo de Comandante Suprema de la República Popular Alemana es un organismo de consenso del bien público, elegido como soberano para aliviar el conflicto de clases y buscar el camino.§!"
 GEH_motomiya_chiaki_trait_A5: "Germania del amanecer\n§gAlemania ha renacido, y acorde al nombre de la patria como tierra de los alemanes, abraza a Gehenna, al sur de Alemania, a los francos y a todas las minorías.§!"
 GEH_motomiya_chiaki_trait_A6: "Fortaleza del conservadurismo\n§gMotomiya Chiaki impulsó amplios compromisos de derecha para estabilizar el Estado alemán, y ahora se la llama símbolo del Estado alemán y gran Comandante Suprema.§!"
