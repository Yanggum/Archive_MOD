 powerful_sublime:0 "Sublime poderoso"
 powerful_sublime_desc: "§LSegún algunas teorías, las estudiantes de Kivotos son avatares de lo divino, y el halo sería una marca que revela la sacralidad que existe tras su ser. La mayoría de estudiantes de Kivotos, tras la Gran Transición, usan dispositivos auxiliares debido a la escasez de mística en el entorno terrestre; pero algunas, bendecidas con el gran poder de lo sublime, pueden reproducir fragmentos de esa mística formidable incluso en estas tierras áridas, siempre que cuenten con suficiente apoyo.§!"
