 b_tjsehqnwkd3: "Primer Gran Dogma\n§gLas palabras y acciones de Sorasaki Hina siempre son correctas. Su liderazgo se ha convertido en el “gran dogma” que todo ciudadano del Estado debe seguir.§!"
