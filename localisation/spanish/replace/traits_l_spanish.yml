 RED_bright_polar_star: "La Estrella Polar carmesí de la revolución"
 RED_bright_polar_star_desc: "\n §L“¿De dónde proviene el progreso de la civilización y el desarrollo de la historia, es decir, la ‘transformación social’? — De cuando las contradicciones de la sociedad se han acumulado.”\n\n Renka y Cherino por fin se han iluminado. Cherino se convirtió en una verdadera revolucionaria y, de pie en el centro de la academia, en el núcleo de la “unidad y cohesión”, brilla con determinación. ¡Los estudiantes y las masas, con Cherino al centro, están formando una solidaridad de acero!\n\n Pero esto no significa que Cherino, como antes, esté imponiendo opresión y tiranía. El pueblo siempre podría derrocarla y expulsarla, pero el liderazgo que Cherino ha demostrado no lo permite. Mediante su propia lucha ideológica y aprendizaje doctrinal, Cherino se ha reforjado y ha logrado un deslumbrante mérito: derribar las contradicciones internas de Red Winter, como las estructuras organizativas autoritarias, los conflictos con los locales, la brecha entre ideología y realidad, o las múltiples contradicciones industriales y económicas, disolviendo la vieja sociedad en una nueva.\n\n Cherino ha renacido como guía. Las masas que vagaban entre contradicciones por fin encontraron la “Estrella Polar de la revolución” y la aferraron con fuerza en sus manos. Si ya tenemos dirección, ¡ahora toca avanzar!§!"
