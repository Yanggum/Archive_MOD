 HEU_regent_of_luxembourg: "Regente de Luxemburgo\n§gComo regente oficial del Gran Ducado de Luxemburgo y noble, es reconocida como una “humana” igual entre los Estados humanos.§!"
 HEU_aru_gehenna: "Presidenta del Consejo Estudiantil de Gehenna\n§gEn realidad no se presenta a Pandemonium en absoluto, pero nominalmente la presidenta estudiantil de Pandemonium es Rikuhachima Aru.§!"

 # 아루 파시스트 루트 트레잇
 HEU_regent_of_luxembourg_2: "Regente de Luxemburgo\n§gComo regente oficial del Gran Ducado de Luxemburgo y noble, es reconocida como una “humana” igual entre los Estados humanos.§!"
 HEU_school_of_atheism_trait: "Gran demonio"
 HEU_GSC_trait_1: "\"Presidenta del Consejo Estudiantil General de Kivotos\"\n§gAunque la mayoría de los trasladados no lo reconoce, ella reclama el cargo de “presidenta rival del Consejo Estudiantil General” de Kivotos.§!"
 HEU_GSC_trait_2: "Presidenta del Consejo Estudiantil General de Kivotos\n§g¡La forajida hardboiled se convirtió en la nueva presidenta del Consejo Estudiantil General de Kivotos!§!"

 # 아루 비동맹/공산 루트 트레잇
 HEU_gehenna_german_culture_trait: "Protectora del pueblo germano"
 HEU_aru_depression_1: "Trastorno depresivo\n§gCuando está sola no se sabe, pero al menos frente al personal de la Agencia 68 puede mostrar una sonrisa. Tal vez, con esfuerzo, pueda superarlo. Al menos, Aru eso cree.§!"
 HEU_aru_depression_2: "Trastorno depresivo moderado-severo\n§g¿No será que todos sufren porque yo sigo viva? ¿No sería todo el mundo más feliz si yo desapareciera? ¿Para empezar, por qué estoy aquí? ¿Por qué tengo que quedarme aquí viendo cómo otros mueren por mí?§!"
 HEU_aru_chroma_1: "§RGravemente herida§!\n§gTras ser corrompida por el Chroma y convertida en terrorista, Aru permanece inconsciente, acostada en una cama de hospital...§!"
 HEU_aru_chroma_2: "Terrorificación\n§gIncluso tras ser corrompida por el Chroma, sigue siendo la valiosa jefa, amiga y compañera de los miembros de la Agencia 68.§!"
 HEU_grand_prince_of_luxembourg: "Gran duquesa de los luxemburgueses\n§gRikuhachima Aru, como fundadora de la Casa Rikuhachima, ascendió como gran duquesa del Gran Ducado de Luxemburgo. Para conmemorar que obtuvo el trono ducal mediante elección popular, el título se fijó como “Gran Duquesa de los luxemburgueses”, y no “Gran Duquesa de Luxemburgo”.§!"
 HEU_grand_prince_of_luxembourg_alt: "Gran duquesa de los luxemburgueses\n§gMediante un compromiso con el Partido Comunista, se convierte en una monarca no hereditaria y no dinástica; si abdica o muere, Luxemburgo se transformará en república.§!"
 HEU_benriya_leader_trait: "Líder de facto de la Agencia 68\n§gTras el incidente de confinamiento, Aru se volvió muy pasiva en la política; más bien, “se hartó de la política”. Ahora tú debes guiar la agencia.§!"
 HEU_trinity_leader_trait: "Host interino de Trinity\n§gDespués de la Ley de la Unión, el líder de la facción Yohann y el comandante de la Orden Hospitalaria se convirtieron en los líderes de Trinity, así que es un cargo honorífico que el primer ministro asume como puesto nominal.§!"

