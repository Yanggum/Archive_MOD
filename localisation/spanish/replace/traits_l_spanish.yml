 GEM_pp_trait_tooltip: "Rasgo de Fatiga Nacional:\n Se elimina al completar uno de estos enfoques nacionales: §Y$GEH_armageddon$§!, §Y$GEM_gehenna_academy_is_a_school_where_everyone_is_happy_right$§!, §Y$GEM_gehenna_nation_founding$§!, §Y$GEM_school_rules_revision$§!, §Y$GEM_opinion_manipulation_and_secretariat_revolution$§!"
 GEM_governor_general_trait: "Administradora"
 GEM_fortress_of_progress_trait: "Líder que marcha al frente\n§gLa Federación Alemana no puede detenerse. Como abanderados que guían el flujo de todas las transformaciones históricas y como infantería de primera línea de la civilización, ¡debemos ir al frente y abatir a los enemigos!§!"
 GEM_leader_of_us_trait: "Líder nacional\n§gLíder del Estado alemán y esperanza de Gehenna que carga con el fardo más pesado. Es nuestra orgullosa líder, que guía dos tareas: proteger Gehenna y gobernar el Estado alemán en medio de innumerables turbulencias políticas.§!"
 GEM_occult_reconstruction_trait: "Ocultista\n§gUn día impulsa una revolución de izquierda y otro día un retroceso reaccionario; nuestra ocultista muestra un rumbo caótico, pero según sus propias reglas.§!"
 GEM_gehennaism_trait: "Muy Gehenna\n§gTras la proclamación del Estado alemán, Hanuma Makoto tomó decisiones que rompieron las expectativas de los alemanes existentes e inyecta la cultura de Gehenna en todos los ámbitos de la sociedad.§!"
 GEM_mini_gehenna_academy_trait: "También Presidenta del Consejo Estudiantil de la Academia Gehenna\n§gLa Presidenta del Consejo Estudiantil de Gehenna, tras la proclamación del Estado alemán, pasó a desempeñar un rol definido y rediseñado: servir como una especie de delegación representativa del ámbito de Gehenna.§!"
 GEM_small_gehenna_academy_trait: "Pequeña Academia Gehenna\n§gLa Pequeña Academia Gehenna es la nueva Academia Gehenna rediseñada tras la proclamación del Estado alemán, con un rol reducido y claramente definido: una de las organizaciones representativas del ámbito de Gehenna, y una pequeña comunidad destinada a preservar las tradiciones y la cultura de Gehenna.§!"
 GEM_better_integration_trait: "Integracionista nacional\n§gTanto los gehnianos como los alemanes, al final, viven dentro de un mismo Estado. La separación deliberada solo crea discriminación deliberada; por eso debemos impulsar una integración mejor. Empezaremos aceptando estudiantes alemanes en la Academia Gehenna.§!"
 GEM_chiaki_system_decision_GEM_german_B4_3_1_on_trait: "Revolucionaria incruenta"
 GEM_chiaki_system_decision_GEM_german_B4_3_1_off_trait: "Dique"
 GEM_hero_of_order: "Héroe del orden"
 GEM_anti_prometheus: "Digestión\n§gLa llama de la humanidad traída por Prometeo está arrojándola al inconsciente y a la destrucción. Todo esto debe terminar ahora. Seremos el último arca de esta era.§!"
