 GEM_liberator: "Liberadora\n§gLa ciudad de cristal edificada sobre ilusiones se derrumbó por la iluminación del más arrogante.§!"
 GEM_irregular: "Irregular\n§gA quien soñaba con el cielo más alto se le obligó a ser líder de la tierra; ya es hora de volver a mirar al cielo.§!"
