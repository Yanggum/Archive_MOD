l_spanish:
 #포커스
 ITA_request_control_of_french_territories:0 "Tratado con Francia"
 ITA_request_control_of_french_territories_desc:0 "Ahora que Francia ha proclamado la reconquista de la metrópoli, podemos, a cambio de apoyar a Francia, proponer un tratado por el cual el gobierno francés en el exilio nos cederá territorios franceses cuando regrese a la metrópoli."

 ITA_italy_first_desc:0 "Para materializar la gran gloria de Italia, hace falta una fuerza armada poderosa... Aunque Europa haya sido arrastrada por la guerra y se haya derrumbado, la gloria de Italia todavía no ha caído."

 ITA_negotiate_italian_claims:0 "Concretar el Frente de Stresa"
 ITA_negotiate_italian_claims_desc:0 "Consolidaremos formalmente el Frente de Stresa y construiremos una alianza triangular entre Italia, Francia y el Reino Unido. Ahora que una amenaza colosal se cierne sobre Europa, es hora de dejar atrás los viejos rencores y darnos la mano."

 ITA_ratify_the_stresa_front:0 "Tratado de Seguridad Europea"
 ITA_ratify_the_stresa_front_desc:0 "Para enfrentarnos a los enemigos de Europa, se requiere una cooperación militar a mayor escala. La colaboración militar entre Italia, Francia y el Reino Unido se ampliará, y más adelante incluso podremos celebrar ejercicios militares conjuntos."

 ITA_guarantee_austrian_independence:0 "El telón que se cierne sobre Europa"
 ITA_guarantee_austrian_independence_desc:0 "Los enemigos de otro mundo que aparecieron tras la caída de la Europa del norte amenazan de forma evidente el norte de Italia. Como auténtico líder del Frente de Stresa, Italia trazará una línea firme contra los invasores que conquistaron Europa y demostrará su determinación con una respuesta contundente."

 ITA_german_military_cooperation:0 "Acoger a los exiliados alemanes"
 ITA_german_military_cooperation_desc:0 "Con Alemania derrumbada en un instante, podemos incorporar a diversos talentos, incluidos científicos alemanes, para impulsar el avance científico y tecnológico de Italia."

 ITA_pact_of_steel:0 "Disolver el Frente de Stresa"
 ITA_pact_of_steel_desc:0 "En el caos europeo, el Frente de Stresa, un acuerdo improvisado, ya no beneficia a Italia ahora que el Reino Unido y Francia han caído. Romperemos el pacto y buscaremos expandirnos hacia los Balcanes."

 ITA_treaty_with_germany:0 "Tratado Tecnológico Europeo"
 ITA_treaty_with_germany_desc:0 "Con Europa destruida y el Reino Unido y Francia caídos, debemos forjar una base más sólida con nuevos aliados."

 ITA_human_fascism:0 "Declaración del Fascismo Humano"
 ITA_human_fascism_desc:0 "El hecho de que solo Italia haya evitado la Gran Traslación no puede ser casualidad. Debemos iniciar el salto hacia la unificación de toda la humanidad y una Europa unida. Es el momento de dar el gran primer paso por la humanidad."

 ITA_human_fascism_tt:0 "[ROOT.GetNameWithFlag] no está aliada con ningún país de Kivotos.\n§REsta decisión quedará bloqueada permanentemente si [ROOT.GetName] llega a aliarse con un país de Kivotos.§!"

 ITA_rise_of_pan_europeanism:0 "Auge del paneuropeísmo"
 ITA_rise_of_pan_europeanism_desc:0 "Más allá del nacionalismo italiano —la Gran Italia, el Imperio Romano—, dentro de Italia se debate activamente un paneuropeísmo destinado a unificar con fuerza a toda Europa."

 ITA_europea_citizens:0 "Ciudadanía Europea"
 ITA_europea_citizens_desc:0 "Todos vivimos en una sola Europa. Debemos abandonar los pequeños sentimientos nacionalistas del pasado y lograr una gran integración europea."

 ITA_comfort_more_comfort:0 "Consuelo, más consuelo"
 ITA_comfort_more_comfort_desc:0 "Italia está ahora rodeada por países de Kivotos. Para cumplir la ambición paneuropea, debemos romper esta prisión y avanzar aún más hacia el norte."

 ITA_europea_army:0 "Ejército Europeo"
 ITA_europea_army_desc:0 "Para realizar las ambiciones de todos los europeos, crearemos un Ejército Europeo reclutado en toda Europa. Nuestro ejército se volverá el más tenaz y poderoso del continente, y actuará para materializar una gran visión."

 ITA_europea_army_tt: "$ITA_modify_regio_esercito_dynamic_modifier_ns_intro$\n$MODIFIERS_ARMY_ATTACK_FACTOR$: §G+10.0%§!\n$MODIFIER_ARMY_MORALE_FACTOR$: §G+10.0%§!\n\n"

 ITA_one_europea:0 "Una sola Europa"
 ITA_one_europea_desc:0 "Europa debe unificarse. Nuestro Estado Paneuropeo proclamará una cruzada por toda Europa, uniendo a la humanidad europea bajo una sola bandera y una sola consigna."

 #이벤트
 PASTA_event.1.t:0 "Formación del Frente de Stresa"
 PASTA_event.1.d:0 "Tras cumplir [ITA.GetName] el Tratado de Stresa, se ha decidido ampliar el Frente de Stresa y convertirlo en una facción en toda regla. Debemos decidir si nuestro país se unirá o no a [ITA.GetName]."
 PASTA_event.1.a:0 "Por la restauración de Europa"
 PASTA_event.1.b:0 "No, no pensamos unirnos a Italia"

 PASTA_event.2.t:0 "[FROM.GetName] se une al Frente de Stresa"
 PASTA_event.2.d:0 "Con [FROM.GetName] decidiendo unirse a nuestro Frente de Stresa, la cohesión entre los países europeos se fortalece aún más."
 PASTA_event.2.a:0 "¡Uníos!"

 PASTA_event.3.t:0 "El Frente de Stresa, rechazado"
 PASTA_event.3.d:0 "[FROM.GetName] se ha negado a firmar nuestro tratado, lo que ha causado un gran contratiempo en el plan del Frente de Stresa."
 PASTA_event.3.a:0 "¿Piensan morir solos?"

 PASTA_event.4.t:0 "Italia propone apoyar la resistencia de Millennium"
 PASTA_event.4.d:0 "[ITA.GetName] ha expresado su intención de que, a cambio de ayudarnos en nuestra guerra contra Millennium, desea recibir la cesión de parte de los territorios del sur de Francia.\n\nSe enfrentan con dureza dos posturas: asegurar un aliado en la guerra contra Millennium cediendo algunas provincias, o negarse porque no podemos abandonar territorio francés."
 PASTA_event.4.a:0 "No, hay que rechazarlo."
 PASTA_event.4.b:0 "Solo son unas cuantas provincias."

 PASTA_event.5.t:0 "Francia rechaza la propuesta"
 PASTA_event.5.d:0 "[FRA.GetName] ha rechazado el tratado que contemplaba ceder territorios del sur a cambio de que participemos en la guerra contra Millennium."
 PASTA_event.5.a:0 "Hmm."

 PASTA_event.6.t:0 "Francia acepta la propuesta"
 PASTA_event.6.d:0 "[FRA.GetName] ha aprobado el tratado por el cual, a cambio de que participemos en la guerra contra Millennium, nos cederá territorios del sur en el futuro."
 PASTA_event.6.a:0 "Bien."

 PASTA_event.7.t:0 "Un ambiente estancado"
 PASTA_event.7.d:0 "Tras el final de la guerra de Etiopía, la sociedad italiana ha caído en un profundo silencio. El hecho sin precedentes de que toda Europa fuera barrida por unos extraños alienígenas bastó para sumir a toda Italia en el terror.\n\nAhora que el efecto de nuestro control de prensa se ha debilitado, todos los ciudadanos italianos solo están intentando ocultar su miedo a los alienígenas del norte."
 PASTA_event.7.a:0 "Es un miedo al que debemos hacer frente."

 PASTA_event.8.t:0 "¡Protestas de fascistas italianos!"
 PASTA_event.8.d:0 "La declaración de [ROOT.GetName] de aliarse con los estados alienígenas surgidos tras la Gran Traslación ha sacudido a los fascistas, nacionalistas y a ciudadanos de todas las clases en Italia.\n\n¡Algunos han organizado manifestaciones anti-Kivotos, y las huelgas se están extendiendo por las instalaciones industriales de toda Italia!"
 PASTA_event.8.a:0 "¡No te metas en mi política exterior!"

 italy.5.t:0 "Intercambio tecnológico Italia-Hungría"
 italy.5.b:0 "No pensamos unirnos a Italia."
 italy.6.t:0 "Intercambio tecnológico Italia-Hungría: ¡aceptado!"
 italy.6.d:0 "Tal como esperábamos, Hungría ha aceptado con gusto una serie de intercambios tecnológicos. Con una nueva amenaza cerniéndose sobre Europa, Italia debe encontrar un nuevo camino para sobrevivir."
 italy.7.t:0 "Intercambio tecnológico Italia-Hungría: ¡rechazado!"
 italy.7.d:0 "Hungría ha rechazado el intercambio tecnológico que propusimos."

 #국민정신
 PASTA_signatories_of_the_stresa_idea:0 "Signatarios del Frente de Stresa"
 PASTA_signatories_of_the_stresa_idea_desc:0 "En el caos que siguió al desembarco de Kivotos en Europa, el Frente de Stresa, improvisado bajo el liderazgo del Reino Unido, Francia e Italia, se enfrenta a su disolución a medida que el Reino Unido y Francia entran en crisis."

 PASTA_ratify_the_stresa_front_idea:0 "Tratado de seguridad tripartito"

 PASTA_shock_to_daejeon:0 "Choque de la Gran Traslación"
 PASTA_shock_to_daejeon_desc:0 "El hecho de que toda Europa fuera barrida por entidades de otro mundo fue un golpe aterrador para Italia. A pesar de la censura mediática justificada por la guerra con Etiopía, toda la población italiana está atrapada en un miedo latente."
 PASTA_shock_to_daejeon_tt: "Al aliarse con un país de Kivotos, se transforma:\nSe producen efectos negativos a gran escala al aliarse con un país de §YKivotos§!."

 PASTA_human_fascism_idea: "Fascismo Humano"
 PASTA_human_fascism_idea_desc: "Italia es la única gran potencia que esquivó la destrucción de Europa y lidera diversas actividades anti-Kivotos. Italia se convertirá en un país con un destino manifiesto para Europa, no: para toda la humanidad."
 PASTA_human_fascism_idea_tt: "§RNo se puede aliar con países de Kivotos.§!"

 PASTA_pan_europea_FRA_idea: "Integración de europeos de origen francés"
 PASTA_pan_europea_GER_idea: "Desmantelamiento del nacionalismo germano-alemán"
 PASTA_pan_europea_HOL_idea: "Reconstrucción europea de los Países Bajos"
 PASTA_pan_europea_SWE_idea: "Liberación nórdica: Suecia"
 PASTA_pan_europea_NOR_idea: "Liberación nórdica: Noruega"
 PASTA_pan_europea_DEN_idea: "Liberación nórdica: Dinamarca"

