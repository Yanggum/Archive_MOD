 YUG_western_focus:0 "Consejo de Regencia"
 YUG_western_focus_desc:0 "La política germanófila del regente, el príncipe Pavle, terminó con la caída de Alemania, pero la regencia no debe llegar a su fin. Pedro II aún es joven e inapto para gobernar. Por ello, reforzaremos la autoridad debilitada de la regencia a través de un Consejo de Regencia."
 YUG_expand_the_university_of_ljubljana:0 "Apoyo a la investigación"
 YUG_expand_the_university_of_ljubljana_desc:0 "Debemos apoyar la investigación nacional y fomentar el desarrollo tecnológico para proteger nuestro país de los invasores."
 YUG_establish_the_banovina_of_croatia_desc:0 "Debemos establecer un organismo semiautónomo en Croacia para fragmentar y desmantelar a las fuerzas nacionalistas croatas."
 YUG_evolution:0 "Control"
 YUG_join_axis:0 "Aproximación a Italia"
 YUG_join_axis_desc:0 "Muchos han presenciado cómo Francia, nuestro aliado tradicional, fue expulsada vergonzosamente del continente europeo. Antes habría sido imposible una alianza diplomática con Italia, pero en la situación actual nadie podría oponerse. Esta será la última elección para proteger a Yugoslavia."

 YUG_united_kingdom_tt:0 "Podremos añadir nuestros §Yestados núcleo§! a los §Yestados núcleo§! de §Y[SER.GetNameWithFlag]§!, §Y[SLV.GetNameWithFlag]§!, §Y[CRO.GetNameWithFlag]§!, §Y[MNT.GetNameWithFlag]§!, §Y[KOS.GetNameWithFlag]§!, §Y[BOS.GetNameWithFlag]§!, §Y[HRZ.GetNameWithFlag]§!, §Y[MAC.GetNameWithFlag]§!, §Y[TRA.GetNameWithFlag]§!, §Y[HUN.GetNameWithFlag]§! y §Y[BUL.GetNameWithFlag]§!."
 #이벤트
 YUG_event.1.t:0 "Frente Popular Antifascista"
 YUG_event.1.d:0 "Hemos proclamado nominalmente el Frente Popular, y en la práctica solo unos pocos grupos se han unido a él. Sin duda, será útil más adelante."
 YUG_event.1.a:0 "Pero son muy pocos."
 YUG_event.2.t:0 "Purga de la oposición"
 YUG_event.2.d:0 "Dentro del partido existen opositores que, seducidos por la conciliación reaccionaria, abogan por la reforma en lugar de la revolución. Los enviaremos a la Unión Soviética junto a los bujarinistas."
 YUG_event.2.a:0 "Adiós, camaradas... para siempre..."
 YUG_event.3.t:0 "El final de la familia real"
 YUG_event.3.d:0 "La gran revolución destinada a poner fin a la reaccionaria monarquía feudal ha triunfado, y la mayoría de la familia real no logró huir al extranjero. ¿Cómo deberíamos tratarlos?"
 YUG_event.3.a:0 "Ejecutar a la familia real."
 YUG_event.3.b:0 "Exiliar a la familia real."
 YUG_event.3.c:0 "Confiscar sus bienes y dejarlos vivir como ciudadanos comunes."
 YUG_event.5.t:0 "Propuesta de apoyo yugoslavo"
 YUG_event.5.d:0 "Yugoslavia, que apoyaba nuestra revolución, ha propuesto intervenir directamente. Si aceptamos, podremos consumar la revolución."
 YUG_event.5.a:0 "Aceptar la propuesta."
 YUG_event.5.b:0 "No somos títeres."
 YUG_event.6.t:0 "El precio de la revolución"
 YUG_event.6.d:0 "Yugoslavia ha elogiado nuestro cambio pacífico de gobierno, pero también nos ha exigido erradicar completamente a las fuerzas opositoras internas. Podemos obedecer sus órdenes o enfrentarnos a ellos."
 YUG_event.7.d:0 "El gobierno [YUG.GetAdjective] nos ha enviado una propuesta para unificar los Balcanes bajo un gobierno central, con el objetivo de fomentar la cooperación y el entendimiento entre los distintos pueblos de la región. Según [YUG.GetLeader], este sería el último y grandioso paso hacia una federación balcánica que dejaría atrás los conflictos del pasado y garantizaría una paz duradera.\n[YUG.GetNameDef] espera ahora la respuesta del gobierno [ROOT.GetAdjective]."
 YUG_event.10.d:0 "El gobierno [FROM.GetAdjective] ha rechazado unirse a la Federación Balcánica Unificada, aunque ha decidido mantener la alianza existente.\nSin embargo, [FROM.GetLeader] ha declarado públicamente que la reacción de Yugoslavia ante este rechazo revelará si el verdadero propósito de la federación es expandir las fronteras yugoslavas más allá de lo imaginable, o si realmente persigue una república socialista balcánica unificada sin condiciones. En cualquier caso, [FROM.GetNameDef] jamás renunciará a su independencia ni a su identidad cultural."

 YUG_event.11.t:0 "[From.GetNameDefCap] se acerca a los Estados fascistas"
 YUG_event.11.desc:0 "Hoy, [From.GetLeader] ha enviado un telegrama a [Root.Capital.GetName], expresando su interés en firmar un pacto de no agresión con las potencias fascistas. Temeroso de la agresión [SOV.GetAdjective] y del creciente nacionalismo interno, [From.GetLeader] intenta alinearse con [Root.GetNameDef]. Aunque esto no implica una alianza formal, podría arrastrar a [From.GetNameDef] a nuestra esfera de influencia y facilitar su entrada en [Root.GetFactionName]."
 YUG_event.111.t:0 "¡Objeción de [From.GetNameDefCap]!"
 YUG_event.111.tripartite_rejection:0 "[From.GetLeader] ha rechazado la propuesta [Root.GetAdjective] de firmar un pacto de no agresión con los Estados fascistas, alegando que tienen \"otras ideas\"."
 YUG_event.111.allied_objection:0 "Nuestra decisión de acercarnos a los Estados fascistas ha provocado una profunda controversia dentro y fuera del país, socavando la legitimidad de [Root.GetLeader] como regente de Pedro II. Oficiales del ejército yugoslavo han declarado mayor de edad a Pedro II y, con apoyo [From.GetAdjective], han marchado sobre Belgrado exigiendo la inmediata abdicación de [Root.GetLeader]."
 YUG_event.111.allied_objection_no_best:0 "[From.GetLeader] ha expresado serias preocupaciones respecto a nuestra política exterior."
 YUG_event.111.a:0 "No tenemos más remedio que aceptarlo."
 YUG_event.111.b:0 "¡Prepararse para la guerra!"
 YUG_event.111.c:0 "Ignorarlo."
 YUG_event.112.t:0 "[From.GetNameDefCap] firma un pacto de no agresión con los fascistas"
 YUG_event.112.desc:0 "El gobierno [YUG.GetAdjective] ha firmado hoy un pacto de no agresión con los Estados fascistas. Aunque esto aún no implica la adhesión de [YUG.GetNameDef] a [From.GetFactionName], demuestra la creciente simpatía fascista de [YUG.GetLeader] y su lealtad hacia estas potencias. Muchos esperan una respuesta [Root.GetAdjective] ante este preocupante desarrollo, pero hasta ahora solo reina el silencio de [Root.GetLeader]."
 YUG_event.112.a:0 "¡[YUG.GetLeader], cobarde bastardo!"
 YUG_event.112.b:0 "No parece que debamos preocuparnos."

 YUG_event.12.t:0 "[From.GetNameDefCap] jura lealtad"
 YUG_event.12.desc:0 "El gobierno [YUG.GetAdjective] nos ha solicitado protección, ofreciendo permitir una amplia injerencia en sus asuntos internos a cambio."
 YUG_event.12.a:0 "[YUG.GetLeader], bienvenido."
 YUG_event.12.b:0 "Ignorarlo."

 YUG_event.121.t:0 "¡[From.GetAdjective] acepta!"
 YUG_event.121.desc:0 "Tras una larga deliberación, [From.GetAdjective] ha accedido a brindarnos protección."
 YUG_event.121.a:0 "El aire de Roma es puro."

 YUG_event.122.t:0 "¡[From.GetAdjective] rechaza!"
 YUG_event.122.desc:0 "[From.GetAdjective] ha decidido rechazar nuestra solicitud de protección."
 YUG_event.122.a:0 "Maldición."

 YUG_event.13.t:0 "El camino hacia la república"
 YUG_event.13.desc:0 "Alemania ha caído.\nFrente a la invasión de otro mundo, el Estado que una vez aspiró a la hegemonía europea se ha derrumbado sin dejar rastro, y con él ha desaparecido la política germanófila del príncipe Pavle.\n\nEl ejército ha entrado en estado de emergencia, y la mayor parte de las fuerzas restantes se ha desplazado a Eslovenia para enfrentar la amenaza.\n\nEl joven rey guarda silencio, y la corona ya no da órdenes.\n\nNo puedo evitar preguntarme:\n¿Desde cuándo esta monarquía nos ha protegido?\n¿Desde cuándo la familia real ha cargado con el sufrimiento del pueblo?\n\nHoy no hay autoridad en esta tierra. Solo hay un vacío.\nY el vacío pertenece al primero que extiende la mano.\n\nLa historia nos observa.\n¿Aferrarnos a un Estado caduco que sobrevive en nombre del rey,\no erigir una república sobre un trono derrumbado?\n\nDudar es perder.\nHoy debemos elegir."
 YUG_event.13.a:0 "La historia la escriben los vencedores."

 YUG_event.14.t:0 "Frente Popular"
 YUG_event.14.desc:0 "Ellos preguntan:\n¿Por qué llevamos nombres distintos?, ¿por qué alzamos banderas diferentes?\n\nPero la pregunta más importante es esta:\n¿Quién nos da órdenes?\n¿Y quién vive de nuestro hambre?\n\nEn las fábricas, el obrero;\nen los cuarteles, el soldado;\nen las calles, el desempleado;\ntodos bajan la cabeza en su lugar.\n\nNos enseñaron que éramos distintos,\npero recibimos las mismas órdenes\ny apuntamos al mismo cañón.\n\nAlgunos dicen:\nNo es momento de unirnos.\nPrimero hay que decidir qué es correcto.\n\nPero la división siempre empezó arriba,\ny el precio siempre lo pagaron los de abajo.\n\nHoy debemos elegir:\n¿Perder con nuestros propios nombres,\no resistir bajo una sola bandera?"
 YUG_event.14.a:0 "¡Unámonos al frente obrero! ¡Tú también eres trabajador!"

 YUG_event.15.t:0 "Pasquín"
 YUG_event.15.desc:0 "El rey guarda silencio, y el pueblo sangra.\n\nLa regencia gobierna en nombre del rey,\npero nadie asume la responsabilidad.\n\nLa monarquía habla de orden,\npero solo vimos prisiones y censura.\n\n¿Quién arruinó este país?\nLa familia real.\nLos monárquicos.\nLa regencia que los protegió.\n\nYa no somos súbditos.\nEsta tierra no pertenece al rey,\npertenece al pueblo.\n\n¡Derrocar la regencia!\n¡Abolir la monarquía!\n¡Establecer la república!"
 YUG_event.15.a:0 "En nombre de los trabajadores, campesinos, soldados y del pueblo sin nombre."

 YUG_event.16.t:0 "Un día de la regencia"
 YUG_event.16.desc:0 "El coche avanzaba lentamente.\nSe detiene un momento frente al semáforo.\nMiro por la ventana: calles conocidas, rostros familiares.\n\nPensé que esta escolta sería suficiente.\nO, más exactamente, deseé que lo fuera.\n\nLa ventana está abierta.\nEntra el aire.\nLos pensamientos se aflojan por un instante.\nUn sonido breve y seco.\nNo es una explosión.\nNo es una advertencia.\nEs un sonido con intención.\n\nEl pecho reacciona primero.\nLuego llega el dolor.\nIntento aferrarme a algo, pero no tengo fuerza en las manos.\n\nSuena otro disparo.\nEl vidrio se agrieta.\nOigo gritos de los escoltas, pero no se convierten en palabras.\n\nEl coche acelera.\nPero yo ya no puedo moverme.\n\nLa vista baja.\nVeo el suelo,\ny una mancha rojo oscuro que se extiende sobre los documentos caídos.\n\nFrases escritas en nombre del rey.\nSobre ellas,\ncae mi sangre.\n\nYo no era el rey.\nEso al menos es seguro.\n\nEntonces,\n¿por qué debía derramarse esta sangre?\n\nEl pensamiento no llega al final.\nUn silencio más quieto que el disparo lo cubre todo."
 YUG_event.16.a:0 "Debí quedarme viendo cuadros..."

 YUG_event.17.t:0 "División"
 YUG_event.17.desc:0 "Se oye el roce de una silla.\nAlguien se pone de pie.\n\n\"La monarquía ha caído. ¿Entonces por qué las reformas siempre se detienen?\"\n\nHay murmullos, pero él no se detiene.\n\n\"La reforma agraria se aplaza, las huelgas sindicales se aplastan, y los antiguos burócratas reales sobreviven bajo el nombre de la ‘experiencia’.\"\n\"¿Es casualidad? ¿O es porque aquí aún hay quienes no pueden soltar la mano de los monárquicos?\"\n\nAlguien protesta, pero su voz se ahoga.\n\n\"Quien rechaza la reforma total, sin importar su intención, termina ayudando a la monarquía.\"\n\nGolpea la mesa.\n\n\"Decidan ahora. O avanzan con el pueblo, o desaparecen junto a los restos de la corona.\"\n\nEn la sala solo queda el silencio."
 YUG_event.17.a:0 "¡La derecha ha traicionado al Frente Popular!"

 YUG_event.18.t:0 "Invasión italiana"
 YUG_event.18.desc:0 "La radio solo transmitió hechos.\nEl ejército italiano ha cruzado la frontera.\n\nLa ciudad se detiene por un momento.\nEn las fábricas, las máquinas se apagan;\nen las tiendas, las cuentas se alargan;\nen las calles, la gente confirma la noticia una y otra vez.\n\nEn los cuarteles llegan las órdenes.\nNo se explican razones.\nY nadie pregunta.\nCuando empieza una guerra, preguntar es un lujo.\n\nEn el campo, hay pocas palabras.\nLa guerra no es nueva.\nSolo esta vez está más cerca.\nLos jóvenes se miran entre sí,\ny los ancianos recuerdan guerras pasadas.\n\nEn oficinas y ministerios, los papeles se mueven rápido.\nSe sellan documentos, los teléfonos no dejan de sonar.\nAlgunos se preocupan por el país,\notros por el régimen,\ny otros simplemente por el mañana.\n\nUnos se enfurecen,\notros se resignan,\ny otros se preparan en silencio.\n\nLo cierto es que la invasión italiana cambiará la vida cotidiana de todos los que viven en este país."
 YUG_event.18.a:0 "Ya que ha comenzado, lucharemos hasta el final."

 YUG_event.19.t:0 "Declaración de guerra a Italia"
 YUG_event.19.desc:0 "La decisión no fue larga.\nLa reunión fue breve, y la frase aún más.\n\nLa declaración de guerra a Italia ha sido aprobada.\n\nLos telegramas se envían de inmediato, los documentos diplomáticos se sellan, y las líneas en el mapa pierden su significado.\n\nEn las ciudades, la noticia se propaga rápido.\nAlgunos asienten en silencio, otros miran largo tiempo por la ventana.\nLa guerra ha comenzado, pero muchos ya sabían que algún día comenzaría.\n\nEn los cuarteles, la espera se convierte en movimiento.\nLos soldados ya no hacen preguntas.\nLa guerra, con la declaración, se ha vuelto realidad.\n\nEn el campo, las campanas y la radio suenan al mismo tiempo.\nPor primera vez, la guerra se siente cercana.\n\nEn oficinas y ministerios, las luces no se apagan ni de noche.\nLa guerra ya no es un asunto diplomático, sino una exigencia total del Estado.\n\nEsta decisión no se tomó por el régimen ni por la ideología.\n\nFue la respuesta a un solo hecho.\n\nLa frontera ha caído, y ya no quedan alternativas."
 YUG_event.19.a:0 "Esta guerra lo decidirá todo."

 YUG_event.20.t:0 "La victoria, y después"
 YUG_event.20.desc:0 "Hemos vencido.\n\nDesde las zonas rurales de Serbia, las montañas de Bosnia, y las ciudades de Croacia y Eslovenia, expulsamos al ejército italiano.\n\nCruzamos los Alpes y el río Piave, ocupando Venecia, Génova, Bolonia y Florencia.\n\nY finalmente tomamos Roma, capital de Italia y centro de miles de años de civilización europea.\n\nNuestra bandera ondea por toda Italia; en Belgrado se celebra un desfile, y nuestros jóvenes regresarán a casa.\n\nPero ninguna de estas victorias fue gratuita.\n\nLos cementerios están llenos, y los hospitales rebosan de heridos.\n\nLas ciudades fueron destruidas por los bombardeos italianos; padres perdieron a sus hijos, e hijos a sus padres.\n\nNadie podrá volver al tiempo anterior a la guerra.\n\nPara bien o para mal."
 YUG_event.20.a:0 "Todo ha cambiado, pero aun así hemos vencido."
