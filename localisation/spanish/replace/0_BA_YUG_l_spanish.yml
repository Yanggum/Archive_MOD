 anti_german_military_desc:0 "Las facciones dentro de la Fuerza Aérea Yugoslava se niegan a cooperar con Estados fascistas que amenazan los intereses de Yugoslavia. Si el Estado llegara a aliarse con los fascistas, podrían intentar derrocar al régimen."
