 #시작 설명
 YUG_country_intro_header:0 "La tierra caótica de los eslavos del sur"
 YUG_country_intro_content:0 "Desde la fundación de Yugoslavia, casi nadie diría que el país ha sido pacífico, ni externa ni internamente.\nYugoslavia, un Estado erigido bajo el pretexto de la unión de los eslavos del sur, a diferencia de su nombre como “tierra de los eslavos del sur”, ha tenido graves problemas internos.\nPor más hermosos que sean los colores, cuando las pinturas se mezclan, se vuelven negras.\nCroatas, eslovenos, bosnios, montenegrinos, macedonios e incluso serbios: por los problemas étnicos y todo tipo de conflictos, Yugoslavia no tuvo ni un momento para respirar.\nEnfrentamientos con los macedonios, el auge del nacionalismo esloveno, y hasta la actividad de la organización ultraderechista croata Ustasha: Yugoslavia ardía por dentro.\nEn 1934, el rey Alejandro I fue asesinado, y su hermano, el príncipe Pavle, ejerció la regencia en lugar de Pedro II, que apenas tenía 11 años.\nEl príncipe Pavle se acercó a Alemania, que codiciaba el “pastel” yugoslavo, intentando prolongar aunque fuera un poco la vida del reino.\nHasta que aparecieron los invasores de otro mundo.\nEstos recién llegados derribaron a Alemania y Francia, y el Reino Unido, que apenas resiste, también se prepara para exiliarse a Canadá.\nEn medio de esta catástrofe, el príncipe Pavle no tuvo más remedio que quedar desconcertado, pero pronto desplegó al ejército en la zona fronteriza de la antigua Austria, “Shanhaijing”.\nYugoslavia ha sido arrojada una vez más a un mundo donde se siente el olor de la guerra.\nLos problemas étnicos aún sin resolver están privando al pueblo yugoslavo de la fuerza para unirse y enfrentarse a los invasores, y nuestra economía dependiente del exterior se está derrumbando después de que el Reino Unido, Francia y Alemania fueran pisoteados por los invasores de otro mundo.\nEn esta situación, la autoridad del príncipe Pavle se desmorona, y al norte llegan oleadas de refugiados, intensificando aún más las disputas políticas.\nPara la tierra de los eslavos del sur solo existirán dos futuros: ser despedazada mientras sufre toda clase de enfermedades, o superar la crisis y resistir hasta el final."
 YUG_guide:0 "- Establezca el sistema político que decidirá el futuro de Yugoslavia.\n   - Consejo de Regencia\n      - Fortalecer la Coalición Radical (completado)\n      - Destituir al primer ministro fascista - disolver el parlamento (en desarrollo, jugable)\n      - Destituir al primer ministro fascista - reforma constitucional (en desarrollo, no jugable)\n   - Construcción de la república\n      - Rechazo del extremismo de izquierda (en desarrollo, no jugable)\n      - Reconocimiento del partido comunista (completado)\n- Resuelva los problemas entre las etnias internas.\n- Proteja Yugoslavia de potencias extranjeras como Italia.\n- Coexista pacíficamente con la gente del otro mundo, o libere a los europeos de ellos."

 #신중점

 YUG_Establishment_of_the_Republic:0 "Construcción de la república"
 YUG_Establishment_of_the_Republic_desc:0 "La política germanófila del príncipe Pavle terminó cuando Alemania fue destruida por los invasores de otro mundo. En estos tiempos de caos, nuestro camino no será el de un reino guiado por un regente incompetente y un rey joven e inmaduro, sino una reforma total a través de la construcción de una república."
 YUG_end_of_compromism:0 "Rechazo del compromiso"
 YUG_end_of_compromism_desc:0 "Los moderados aún creen que, como en la Gran Guerra, la familia real puede funcionar con normalidad. Pero tras la Gran Guerra, la realeza practicó la tiranía y provocó la división del país, y es imposible que los monárquicos estén de acuerdo con nuestro ideal de democracia. Ya no habrá compromiso con la familia real y sus esbirros. Su final solo será la ruina por traición y división."
 YUG_recognize_the_soviet_union:0 "Reconocer al partido comunista"
 YUG_recognize_the_soviet_union_desc:0 "La Liga de los Comunistas de Yugoslavia fue vista como una gran amenaza por el gobierno de posguerra, que la disolvió por la fuerza. Pero pueden convertirse en aliados que compartan nuestros ideales republicanos, y por la construcción de la república los reconoceremos como un partido legal."
 YUG_Creating_anti_monarchy_sentiment:0 "Fomentar el sentimiento antimonárquico"
 YUG_Creating_anti_monarchy_sentiment_desc:0 "El sistema de dictadura real ha bloqueado durante décadas el desarrollo político de Yugoslavia. Bajo el pretexto de integrar un Estado multiétnico, la monarquía reprimió a la oposición y neutralizó al parlamento. Difundiremos de forma organizada el sentimiento antimonárquico, desenmascarando que la monarquía ya no puede representar el futuro del pueblo yugoslavo."
 YUG_popular_front:0 "Frente Popular"
 YUG_popular_front_desc:0 "La Liga de los Comunistas de Yugoslavia no es un simple partido. Poseen experiencia de lucha clandestina que nosotros no tenemos, y células obreras profundamente arraigadas en fábricas y minas. Si nos aliamos con ellos a través de un Frente Popular que enarbole la bandera antifascista y antimonárquica, compartiremos su capacidad organizativa y su experiencia de combate, y podremos ampliar con mayor eficacia el movimiento antisistema."
 YUG_underground_organization_integration:0 "Integración de las organizaciones clandestinas"
 YUG_underground_organization_integration_desc:0 "Los partidos y organizaciones que se han sumado a nuestra causa poseen cada uno sus propias estructuras clandestinas. Ahora, al integrarlas bajo una única cadena de mando, podremos transformar una resistencia dispersa en una lucha organizada y eficaz. Órdenes unificadas y acciones coordinadas harán posible una resistencia prolongada contra la monarquía y las fuerzas fascistas."
 YUG_Assassination_of_the_Regent:0 "Asesinato del regente"
 YUG_Assassination_of_the_Regent_desc:0 "Por fin ha llegado ese día. Nuestra organización clandestina de resistencia ya ha echado raíces por todo el país, esperando únicamente la señal. Entre el pueblo yugoslavo, la decepción y el odio hacia la familia real han alcanzado su punto máximo, y el sistema de regencia ya no puede sostener su legitimidad. Ha llegado el momento de decidir. Es hora de eliminar al regente y derribar el viejo régimen monárquico mediante un levantamiento nacional. El futuro de Yugoslavia se decidirá hoy, en las calles y en las fábricas."
 YUG_Establishment_of_the_Republic_Constitution:0 "Promulgación de la constitución republicana"
 YUG_Establishment_of_the_Republic_Constitution_desc:0 "Tras la eliminación del regente y la revolución nacional, el joven rey Pedro II no tuvo más remedio que renunciar a seguir gobernando. Ahora aboliremos oficialmente la monarquía y estableceremos una constitución republicana basada en la igualdad de todos y en principios democráticos. La Yugoslavia gobernada por el rey ha muerto. Aquí nace un nuevo Estado donde el pueblo ejerce la soberanía, y mediante esta constitución proclamaremos el inicio de una nueva era."
 YUG_anti_rightist_struggle:0 "Lucha contra la derecha"
 YUG_anti_rightist_struggle_desc:0 "La república se ha establecido, pero las fuerzas que apoyaban la monarquía aún no han desaparecido por completo. Han formado una derecha reaccionaria aliada con capitalistas, clérigos y terratenientes, e influyen constantemente sobre otras fuerzas políticas derechistas. Debemos eliminar su organización y su base para proteger los logros de la revolución y garantizar la supervivencia de la república. No puede descartarse que en el proceso haya “víctimas inocentes”, pero el precio de abandonar la revolución sería mucho mayor."
 YUG_Seeking_support_from_the_Soviet_Union:0 "Buscar el apoyo de la Unión Soviética"
 YUG_Seeking_support_from_the_Soviet_Union_desc:0 "La Unión Soviética sabe bien qué necesita una nación revolucionaria para sobrevivir. Si obtenemos su aprobación y apoyo, podremos asegurar una fuerza real para enfrentarnos a la reacción interna y a la presión externa."
 YUG_Create_People_s_Army:0 "Creación de un ejército del partido"
 YUG_Create_People_s_Army_desc:0 "La Liga de los Comunistas de Yugoslavia obtuvo más de 1/8 de los escaños en la Asamblea Constituyente de 1920, pero los perdió todos por la disolución forzosa del gobierno. ¿Podemos garantizar que, tras la construcción de la república, algo así no volverá a ocurrir? Para no repetirlo jamás, nos infiltraremos en las organizaciones clandestinas integradas bajo un mando unificado y, tomando el control de su dirección, reforzaremos nuestro dominio y crearemos un nuevo ejército del partido con una cadena de mando secreta propia."
 
 YUG_form_peasant_councils:0 "Establecer consejos de aparceros"
 YUG_form_peasant_councils_desc:0 "Para construir una república igualitaria, el poder de los aparceros y pequeños campesinos debe fortalecerse en la política local. Al establecer consejos de aparceros, podremos asegurar una base de apoyo que coincida con nuestros ideales republicanos y garantizar una propiedad de la tierra equitativa."
 
 YUG_Purge_Reactionist_in_Party:0 "Purga de la oposición interna del partido"
 YUG_Purge_Reactionist_in_Party_desc:0 "Actualmente hay opositores dentro del partido que se oponen a nuestros ideales. Están vinculados con los bujarinistas, atacan a la dirección actual y fomentan la división interna, así que los enviaremos a Moscú para poner fin a la fractura del partido."
 YUG_workers_republic:0 "República obrera"
 YUG_workers_republic_desc:0 "A medida que la influencia política de la Liga de los Comunistas de Yugoslavia se expande, crece la opinión de que su representación en el parlamento ha sido subestimada, y huelgas, protestas y luchas callejeras de obreros y campesinos se desarrollan en todo el país. La Liga de los Comunistas de Yugoslavia movilizará a los partisanos, el ejército del partido, para asegurar el control nacional."
 YUG_With_Marshal_Tito:0 "Junto al mariscal Tito"
 YUG_With_Marshal_Tito_desc:0 "Tito ha demostrado su liderazgo como dirigente del partido y del ejército del partido, desempeñando un papel central en la toma del poder. Lo elegiremos como presidente de nuestra república."
 YUG_federal_defense_council1:0 "Consejo Federal de Defensa"
 YUG_federal_defense_council1_desc:0 "El ejército de la república está controlado por generales serbios. Al establecer un Consejo Federal de Defensa, podremos reducir la autoridad del Estado Mayor serbio, asegurar ascensos más igualitarios y obtener estrategias más diversas."
 YUG_Peoples_Army_Reorganization:0 "Reorganización del ejército del partido"
 YUG_Peoples_Army_Reorganization_desc:0 "El ejército del partido fue de gran ayuda para tomar el poder, pero al ser un ensamblaje improvisado de distintas organizaciones clandestinas, su cadena de mando y estructura no son sistemáticas y muchos carecen de entrenamiento adecuado. Debemos reorganizarlo para convertirlo en un ejército fuerte, eficiente y bien entrenado."
 YUG_Partisan_War_Tactics:0 "Guerra partisiana"
 YUG_Partisan_War_Tactics_desc:0 "Desde la década de 1920 hemos acumulado experiencia de lucha clandestina, y la geografía de Yugoslavia es muy adecuada para la actividad partisiana. Debemos elaborar una doctrina que aproveche nuestra experiencia y el terreno, y sentar las bases para resistir incluso si el invasor ocupa nuestro territorio."
 YUG_Last_of_Royal_family:0 "El final de la familia real"
 YUG_Last_of_Royal_family_desc:0 "Hemos derrocado a la incompetente dinastía Karađorđević y establecido una república obrera en Yugoslavia. Ahora debemos decidir su destino."
 YUG_Brotherhood_And_Unity:0 "Hermandad y unidad"
 YUG_Brotherhood_And_Unity_desc:0 "Hermandad y unidad es la política oficial sobre la relación entre los pueblos eslavos del sur y las minorías: trata a todas las etnias por igual y, para superar los conflictos y el odio nacionales, fomenta pacíficamente las similitudes y la interdependencia mutua."
 YUG_Harmony_in_Religion:0 "Armonía interreligiosa"
 YUG_Harmony_in_Religion_desc:0 "Los pueblos eslavos del sur estuvieron durante mucho tiempo bajo el dominio de potencias extranjeras y adoptaron la religión de los Estados dominantes. La religión influye profundamente en la identidad de cada pueblo, y si la atacamos de forma imprudente, será una amenaza grave para la estabilidad de nuestro sistema. En lugar de atacarlos unilateralmente, promoveremos el diálogo entre religiones para reducir los conflictos étnicos."
 YUG_state_atheism:0 "Confiscación de bienes religiosos"
 YUG_state_atheism_desc:0 "La religión es el opio del pueblo. En Yugoslavia, la religión no ha hecho nada salvo avivar los conflictos entre etnias, por lo que iniciaremos una política de ateísmo estatal confiscando los bienes religiosos."
 YUG_Break_authoritarianism:0 "Abandono del autoritarismo"
 YUG_Break_authoritarianism_desc:0 "El autoritarismo solo trae corrupción y decadencia al partido. Para un partido mejor, abandonaremos el autoritarismo."
 YUG_workers_self_management:0 "Sistema de autogestión obrera"
 YUG_workers_self_management_desc:0 "La autogestión obrera en Yugoslavia fue organizada conforme a las teorías de Tito y Edvard Kardelj. Los trabajadores tienen derecho a gestionar su lugar de trabajo y lo administran de manera autónoma y democrática."
 YUG_Centralized_Economy:0 "Centralización económica"
 YUG_Centralized_Economy_desc:0 "Al centralizar la economía, podremos construir una economía eficiente y fortalecer la autoridad económica del partido."
 YUG_strengthening_of_the_central_party:0 "Fortalecer el partido central"
 YUG_strengthening_of_the_central_party_desc:0 "Al concentrar funciones y poder en el partido central, podremos impulsar una administración mejor y una mayor estabilidad."
 YUG_yugoslavia_expansion:0 "Gran República Federativa de Yugoslavia"
 YUG_yugoslavia_expansion_desc:0 "El “plan de la Gran República Federativa de Yugoslavia” consiste en incorporar a la República de Bulgaria y a la República de Albania, actualmente nuestros aliados, a la República Federativa de Yugoslavia. Aunque no faltará resistencia de los pueblos mayoritarios de cada república, es un plan ampliamente respaldado y necesario para salvaguardar la revolución."
 YUG_balkan_federation:0 "Federación de Repúblicas Socialistas de los Balcanes"
 YUG_balkan_federation_desc:0 "El concepto de federación balcánica apareció a finales del siglo XIX, y su objetivo central es construir una república federal común que unifique la península balcánica sobre la base de una nueva integración política: internacionalismo, socialismo, solidaridad social e igualdad económica. Podemos hacer realidad este plan impulsando las revoluciones en los países de los Balcanes."
 YUG_balkan_defense_training:0 "Defensa de los Balcanes"
 YUG_balkan_defense_training_desc:0 "Para defender la península balcánica, debemos cooperar con los ejércitos de otros países. Estableceremos una doctrina para ello y la compartiremos con las demás naciones."
 YUG_internationalism:0 "Internacionalismo"
 YUG_internationalism_desc:0 "Nosotros hemos sido liberados, pero en el mundo aún hay muchos trabajadores que sufren bajo los opresores. De acuerdo con el principio del internacionalismo, apoyaremos su liberación y su lucha, y en ocasiones podremos desplegar nuestro ejército para suscitar la unidad y la lucha de los trabajadores del mundo."
 YUG_industrial_integration:0 "Industria integrada"
 YUG_industrial_integration_desc:0 "Al integrar las industrias de Yugoslavia, Bulgaria y Albania, podremos fortalecer la economía de forma más eficiente."
 YUG_eradication_of_nationalism:0 "Destrucción del “nacionalismo”"
 YUG_eradication_of_nationalism_desc:0 "El nacionalismo no es más que una herramienta de los opresores. Utilizaron el concepto ficticio de la nación para dividir a los trabajadores y hacer que se enfrentaran entre sí. Destruiremos el nacionalismo para eliminar la discriminación entre etnias."
 YUG_equality_among_ethnic_groups:0 "Igualdad entre etnias"
 YUG_equality_among_ethnic_groups_desc:0 "Tras la incorporación reciente de Bulgaria y Albania a la federación, los principales grupos étnicos de cada república están reaccionando con descontento. Enfatizaremos la igualdad entre etnias para mejorar su trato y eliminar la resistencia."


  YUG_yugoslavian_nationalism:0 "Nacionalismo yugoslavo"

 YUG_multinational_state:0 "Estado multinacional"

 YUG_constitutional_monarchy:0 "Monarquía constitucional"
 YUG_constitutional_monarchy_desc:0 "Formaremos una gran coalición en la que participen la mayoría de los partidos centristas del país, poniendo como primer ministro a Anton Korošec, ex primer ministro y primer jefe de gobierno no serbio, con el fin de consolidar la monarquía constitucional establecida mediante la reforma constitucional."

 YUG_Death_of_the_January_6th_Dictatorship:0 "La muerte del Régimen del 6 de enero"
 YUG_Death_of_the_January_6th_Dictatorship_desc:0 "El Régimen del 6 de enero es represivo y, en la situación actual, donde la confianza en la familia real se ha desplomado, solo provocará inestabilidad. Debemos eliminar los restos del Régimen del 6 de enero y construir una nueva Yugoslavia."
 YUG_Election_Law_Reform:0 "Reforma de la ley electoral"
 YUG_Election_Law_Reform_desc:0 "La ley electoral y los distritos actuales están diseñados para favorecer a determinadas etnias. Para asegurar la representación de las minorías y la igualdad entre etnias, debemos reformar la ley electoral."
 YUG_Neutralize_the_Royal_Family:0 "Convertir a la familia real en un símbolo"
 YUG_Neutralize_the_Royal_Family_desc:0 "Con la confianza en la familia real por los suelos y siendo Pedro II aún joven, debemos convertir a la familia real en una figura simbólica e impedir que intervenga en la política."
 YUG_Establishment_of_an_Independent_Constitutional_Court:0 "Establecer un tribunal constitucional independiente"
 YUG_Establishment_of_an_Independent_Constitutional_Court_desc:0 "El establecimiento de un tribunal constitucional independiente es necesario para la estabilidad de nuestro Estado. Debemos crear un tribunal constitucional que sea independiente de otros cálculos políticos."
 YUG_Depoliticization_of_State_Institutions:0 "Despolitización de las instituciones estatales"
 YUG_Depoliticization_of_State_Institutions_desc:0 "Actualmente existen funcionarios con ideas de extrema derecha nombrados por el ex primer ministro. Además, debido a funcionarios incompetentes y antidemocráticos nombrados durante el anterior absolutismo, en 1935 se produjo un fraude electoral; debemos destituirlos y educar a los funcionarios en la despolitización."
 YUG_Special_Committee_on_Eradication_of_Corruption:0 "Comité Especial Anticorrupción"
 YUG_Special_Committee_on_Eradication_of_Corruption_desc:0 "Para erradicar por completo la corrupción endémica del periodo absolutista, debemos crear un comité especial con plenos poderes y realizar una investigación exhaustiva."
 YUG_Farm_Support_Policy:0 "Política de apoyo a las granjas"
 YUG_Farm_Support_Policy_desc:0 "Se dice que la base del país es la agricultura. Con la recesión global, las granjas están sufriendo; debemos otorgar subsidios para impulsar la agricultura."
 YUG_Agricultural_Modernization:0 "Modernización agrícola"
 YUG_Agricultural_Modernization_desc:0 "La modernización agrícola es nuestro destino. Debemos introducir tractores y conectar electricidad al campo para aumentar la productividad agrícola."
 YUG_Industrial_Subsidies:0 "Subsidios industriales"
 YUG_Industrial_Subsidies_desc:0 "Aunque el daño a las granjas continúa, si la industrialización no va primero, la economía nacional también se estancará. Debemos otorgar subsidios a la industria para promover su desarrollo."
 YUG_Unemployment_Pension:0 "Pensión de desempleo"
 YUG_Unemployment_Pension_desc:0 "El desempleo se está disparando. Para mantener el poder de consumo de la población, debemos pagar una pensión de desempleo."
 YUG_Partial_Removal_of_Press_Censorship:0 "Suspensión parcial de la censura de prensa"
 YUG_Partial_Removal_of_Press_Censorship_desc:0 "La censura de prensa debe suspenderse a largo plazo, pero como las fuerzas extremistas están desatadas en una situación inestable, debemos suspenderla parcialmente, dejando margen para que el Estado pueda intervenir en los medios."
 YUG_Wipe_Out_Fascist_Influence:0 "Erradicar la influencia fascista"
 YUG_Wipe_Out_Fascist_Influence_desc:0 "La censura de prensa que mantenemos puede utilizarse para erradicar la influencia de las fuerzas fascistas, tanto internas como externas."
 YUG_Complete_Removal_of_Press_Censorship:0 "Suspensión total de la censura de prensa"
 YUG_Complete_Removal_of_Press_Censorship_desc:0 "Al suspender por completo la censura de prensa, podremos mostrar que aceptamos la opinión pública reformista dentro del país."
 YUG_Limited_Allowance_of_Communist_Parties:0 "Permitir limitadamente a los partidos comunistas"
 YUG_Limited_Allowance_of_Communist_Parties_desc:0 "El comunismo es incompatible con la monarquía, pero debido a su tamaño debemos reconocerlos. Permitamos su actividad política de forma limitada y hagamos que operen dentro del marco legal."
 YUG_Guaranteeing_Cultural_Autonomy:0 "Garantizar la autonomía cultural"
 YUG_Guaranteeing_Cultural_Autonomy_desc:0 "Debemos garantizar autonomía cultural a las etnias del país. Permitamos que en las escuelas se enseñen lenguas minoritarias además del serbocroata, y que la radio pueda emitir en los idiomas de cada pueblo."
 YUG_Special_Committee_on_Religious_Harmony:0 "Comité Especial de Armonía Religiosa"
 YUG_Special_Committee_on_Religious_Harmony_desc:0 "Dentro del país existen muchas religiones, y la mayoría de los conflictos étnicos nacen de la religión. Establezcamos un comité especial de armonía religiosa para que se haga cargo de los asuntos religiosos."
 YUG_Minority_Language_Coverage:0 "Garantizar el uso de lenguas minoritarias"
 YUG_Minority_Language_Coverage_desc:0 "Permitamos el uso conjunto de las lenguas minoritarias en las oficinas públicas de las regiones donde se concentran, garantizando así los derechos de las minorías."
 YUG_Constitution_Reform:0 "Reforma constitucional"
 YUG_Constitution_Reform_desc:0 ""
 YUG_With_Socialist_Party:0 "Negociar con el Partido Socialista"
 YUG_With_Socialist_Party_desc:0 ""
 YUG_Anti_Extremism:0 "Rechazo del extremismo"
 YUG_Antxi_Extremism_desc:0 ""
 YUG_With_Independent_Democratic_Party:0 "Negociar con el Partido Democrático Independiente"
 YUG_With_Independent_Democratic_Party_desc:0 ""
 YUG_Strengthening_Welfare:0 "Fortalecer el bienestar"
 YUG_Strengthening_Welfare_desc:0 ""
 YUG_alliance_with_the_uk:0 "Unirse a los Aliados"
 YUG_alliance_with_the_uk_desc:0 ""
 YUG_alliance_with_france:0 "Alianza con Francia"
 YUG_alliance_with_france_desc:0 ""

 YUG_oust_the_fascists:0 "Destituir al primer ministro fascista"
 YUG_oust_the_fascists_desc:0 "El actual primer ministro de Yugoslavia, Milan Stojadinović, ha abusado de su poder para llenar el sector público del Estado con sus partidarios. Además, dentro del partido se le llama líder y dirige un ejército partidario. Como es una amenaza para el sistema monárquico actual, lo destituiremos del cargo y designaremos a otro primer ministro."
 YUG_Strengthening_Radical_Union:0 "Fortalecer la Unión Radical"
 YUG_Strengthening_Radical_Union_desc:0 "La Unión Radical Yugoslava es el partido del actual primer ministro Milan Stojadinović. Al apoyar a la Unión Radical, reafirmaremos la autoridad del Consejo de Regencia para estabilizar el país y, mediante la política fascista del primer ministro, podremos mejorar las relaciones con Italia."
 YUG_regency_council:0 "El dominio de la regencia"
 YUG_regency_council_desc:0 "El príncipe Pavle ha demostrado por sí mismo que es capaz de gobernar Yugoslavia. Dejando atrás al rey aún joven, el príncipe Pavle y el Consejo de Regencia protegerán Yugoslavia."
 YUG_dissolution_of_parliament:0 "Disolución del parlamento"
 YUG_dissolution_of_parliament_desc:0 "El parlamento yugoslavo ha perdido su poder después de que el primer ministro y líder del partido gobernante, la Unión Radical, Milan Stojadinović, fuera expulsado de su posición. Ha llegado el momento de disolver un parlamento innecesario y regresar al absolutismo monárquico."
 YUG_defender_of_all_yugoslavia:0 "Protector de toda Yugoslavia"
 YUG_defender_of_all_yugoslavia_desc:0 "El rey es el protector de todos los yugoslavos y de los territorios de Yugoslavia. Naturalmente, el rey posee plenos poderes para protegerlos."
 YUG_Revial_of_the_January_6th_Dictatorship:0 "Restauración del Régimen del 6 de enero"
 YUG_Revial_of_the_January_6th_Dictatorship_desc:0 "Restaurar el Régimen del 6 de enero y regresar al absolutismo monárquico ayudará a superar la crisis que enfrentamos."
 YUG_Iron_Fist:0 "Puño de hierro"
 YUG_Iron_Fist_desc:0 "Quienes se opongan a la instauración del absolutismo monárquico se arrodillarán ante el puño de hierro del rey."
 YUG_Kings_Chetniks:0 "Los Chetniks del Rey"
 YUG_Kings_Chetniks_desc:0 "Los Chetniks siempre han sido siervos leales al Estado y a la familia real desde la época del Reino de Serbia. Al reconocerlos oficialmente e integrarlos en el aparato estatal, podremos utilizarlos como manos y pies de la realeza."
 YUG_strengthening_of_parliamentary_powers:0 "Fortalecer el parlamento"

 YUG_pledge_of_allegiance:0 "Juramento de lealtad"

 YUG_Kings_Goverment:0 "Gobierno del Rey"

 YUG_Rewards_For_Loyalty:0 "Recompensas para los leales"

 YUG_Economic_Centralization:0 "Centralización económica"

 YUG_Capitalist_Support:0 "Apoyo a los capitalistas"

 YUG_Capitalist_Suppression:0 "Represión de los capitalistas"

 YUG_Acquire_Deliverables:0 "Obtención de resultados"

 YUG_Industrial_Management:0 "Gestión industrial"

 YUG_State_Capitalism:0 "Capitalismo de Estado"

 YUG_Agricultural_Subsidy:0 "Subsidios agrícolas"

 YUG_Mining_Mechanization:0 "Mecanización minera"
 YUG_duce_of_yugoslavia:0 "El Duce de Yugoslavia"
 YUG_duce_of_yugoslavia_desc:0 "A Milan Stojadinović se le llama el 'Líder(Vođa)' dentro de la Unión Radical. Creemos que, al igual que el Duce de Italia, él hará fuerte a la nueva Yugoslavia."
 YUG_yugoslav_nationalism:0 "Nación yugoslava"
 YUG_yugoslav_nationalism_desc:0 "El término “nación yugoslava” originalmente se refería de forma colectiva a los pueblos eslavos que viven en el sur de Europa, especialmente en la península balcánica, como serbios y croatas. A partir de ahora, la palabra “nación yugoslava” pasará a significar a los propios yugoslavos."
 YUG_serbian_nationalism:0 "Nación serbia"
 YUG_serbian_nationalism_desc:0 "Entre las nacionalidades del Reino de Yugoslavia, la más numerosa es la nación serbia. En Yugoslavia, la nación con más derechos también debe ser la serbia."
 YUG_support_for_chekhnite:0 "Reorganización de los Chetniks"
 YUG_support_for_chekhnite_desc:0 "Los Chetniks son una milicia monárquica fundada en la época del Reino de Serbia, y su origen se remonta incluso a movimientos de resistencia contra el Imperio otomano. También apoyaron al ejército serbio como voluntarios durante la Gran Guerra. Podemos reorganizarlos de acuerdo con nuestra ideología y utilizarlos."
 YUG_state_cooperativeism:0 "Corporativismo estatal"
 YUG_state_cooperativeism_desc:0 "El corporativismo estatal enfatiza la cooperación entre clases y el Estado controla la economía. El corporativismo estatal es la elección para nuestra economía."
 YUG_ORJUNA_reunion:0 "Restablecimiento de la Organización de Nacionalistas Yugoslavos"
 YUG_ORJUNA_reunion_desc:0 "La Organización de Nacionalistas Yugoslavos fue un grupo nacionalista yugoslavo, protofascista y de ideología principalmente anticomunista, fundado en 1921 en el Reino de Serbios, Croatas y Eslovenos. Apoyaban un nacionalismo yugoslavo unitario y reprimieron eficazmente a separatistas croatas y eslovenos, pero fueron disueltos con el absolutismo de 1929. Si restauramos esta organización y la convertimos en herramienta del Estado y del partido, podremos contener con eficacia a las fuerzas separatistas."
 YUG_border_retreat:0 "Retirada de la frontera"
 YUG_border_retreat_desc:0 "Hemos encontrado una solución perfecta que resuelve de una vez tanto el problema nacionalista dentro de Yugoslavia como las reivindicaciones territoriales de Italia."

 YUG_evolution2:0 "Evolución"
 YUG_evolution2_desc:0 "Para responder a la amenaza extranjera, debemos tener un Estado más fuerte. Ha llegado el momento de construir una Yugoslavia evolucionada, donde nuestras divisiones ya han sido resueltas."
 YUG_power_strengthening:0 "Fortalecimiento del poder"
 YUG_power_strengthening_desc:0 "Fortaleceremos nuestro poder afianzando el control sobre el estamento militar."
 YUG_moschettieri_del_duce:0 "Fortalecimiento de la milicia"
 YUG_moschettieri_del_duce_desc:0 "Debemos reforzar las milicias que luchan por nuestro régimen para consolidar el dominio de nuestro gobierno."
 YUG_deposition_of_the_king:0 "Depósito del rey"
 YUG_deposition_of_the_king_desc:0 "La corrupta familia real ha monopolizado el poder durante mucho tiempo, saqueando la riqueza del país y esclavizando al pueblo. Ahora los bajaremos del trono y avanzaremos hacia una nueva Yugoslavia."
 YUG_symbol_of_the_nation:0 "Símbolo de la nación"
 YUG_symbol_of_the_nation_desc:0 "La familia real es el símbolo de Yugoslavia, el símbolo de los yugoeslavos y el símbolo de nuestro ejército. Expulsarlos provocaría una fuerte reacción y podría convertirse en un acto que niegue la legitimidad de nuestro régimen. Los mantendremos como nuestro símbolo."
 YUG_disintegration_of_yugoslavia:0 "Desintegración de Yugoslavia"
 YUG_disintegration_of_yugoslavia_desc:0 "Yugoslavia no es más que un conjunto artificial y contradictorio. Desmantelaremos Yugoslavia."
 YUG_greater_serbia:0 "Gran Serbia"
 YUG_greater_serbia_desc:0 "Abandonando el sueño ilusorio llamado Yugoslavia, debemos refundarnos como un nuevo Estado. Yugoslavia, digan lo que digan, al final es un país de la nación serbia, y lo seguirá siendo."
 YUG_serbian_imperialism:0 "Imperialismo serbio"
 YUG_serbian_imperialism_desc:0 "Serbia debe hacerse más grande. Para una vida cómoda del pueblo serbio, hacen falta más tierras, más recursos y más sacrificios."
 YUG_greater_serbian_defense_force:0 "Fuerza de Defensa Serbia"
 YUG_greater_serbian_defense_force_desc:0 "Para proteger Serbia, necesitamos un ejército más grande y más fuerte. Crearemos un nuevo ejército para la nueva patria."
 YUG_seeking_alliance_with_italy:0 "Amistad con Italia"

 YUG_invasion_of_BUL:0 "Invasión de Bulgaria"
 YUG_invasion_of_BUL_desc:0 "Bulgaria codicia constantemente Macedonia, que es nuestro territorio. Además, Bulgaria posee tierras y recursos que necesitamos; debemos atacarla preventivamente para asegurar la estabilidad del Estado."
 YUG_invasion_of_ALB:0 "Invasión de Albania"
 YUG_invasion_of_ALB_desc:0 "En Albania se extrae petróleo. Necesitamos petróleo y Albania lo tiene, así que debemos invadir Albania."
 YUG_invasion_of_HUN:0 "Invasión de Hungría"
 YUG_invasion_of_HUN_desc:0 "Hungría tiene una fértil región granera atravesada por el Danubio y bosques para la industria maderera. Además, se sabe que posee grandes yacimientos de bauxita. Los invadiremos para asegurar recursos."
 YUG_invasion_of_ROM:0 "Invasión de Rumanía"
 YUG_invasion_of_ROM_desc:0 "Los campos petrolíferos de Ploiești en Rumanía son los mayores de Europa. Además, a lo largo del Danubio hay grandes tierras de cultivo; aseguraremos Rumanía para garantizar la felicidad de los serbios."
 YUG_invasion_of_GRE:0 "Invasión de Grecia"
 YUG_invasion_of_GRE_desc:0 "Grecia tiene muchos recursos diversos. Además, sus islas nos servirán como base para expandirnos hacia el Mediterráneo. Aseguraremos Grecia."
 YUG_invasion_of_TUR:0 "Pacificación del Oriente Medio"
 YUG_invasion_of_TUR_desc:0 "Turquía es el heredero del Imperio otomano, que nos esclavizó, y más allá se encuentra un Oriente Medio rico en petróleo. Atacaremos a Turquía y a los Estados del Oriente Medio para vengar a nuestra nación y asegurar de ellos los recursos necesarios para nuestra vida."
 YUG_oath_of_loyalty:0 "Juramento de lealtad"
 YUG_oath_of_loyalty_desc:0 "Debemos reconocer correctamente nuestra posición en la política internacional. Al norte están los invasores hostiles de otro mundo; al este, la Unión Soviética que busca dominar los Balcanes; al oeste, Italia, que tomó territorio de nuestro país. Nuestros antiguos aliados ya no tienen fuerza, así que jurar lealtad a la amistosa Italia es la forma de que se valore al máximo nuestro valor."
 YUG_strengthening_of_syndicalist_economy:0 "Desarrollo de la economía corporativista"
 YUG_strengthening_of_syndicalist_economy_desc:0 "La economía corporativista se ha asentado con éxito en nuestro país; ahora es el momento de recoger los frutos. Desarrollemos aún más la economía corporativista y fortalezcamos nuestra economía nacional."
 YUG_strengthening_production_plans:0 "La fábrica de armas de los Balcanes"
 YUG_strengthening_production_plans_desc:0 "Nuestro país debe convertirse en la punta de lanza de Italia hacia los Balcanes, y necesita materiales que puedan apoyar al ejército italiano. Seamos la fábrica de armas de los Balcanes y produzcamos suministros para el ejército italiano y el nuestro."
 YUG_resource_production:0 "Producción de recursos"
 YUG_resource_production_desc:0 "En nuestro país hay bastantes recursos enterrados. Debemos extraerlos y suministrarlos al mercado."
 YUG_self_sufficient_economy:0 "Amenaza internacional"
 YUG_self_sufficient_economy_desc:0 "Para responder a la amenaza internacional, necesitamos una economía más eficiente y más oficiales. Crearemos un Estado eficiente."

 YUG_Gauge_Standardization:0 "Estandarización del ancho de vía"
 YUG_Gauge_Standardization_desc:0 "Una red ferroviaria donde conviven distintos anchos de vía no puede cumplir su función. Debemos estandarizar el ancho de vía ferroviario nacional."
 YUG_improve_light_industry:0 "Apoyo al sector automotriz"
 YUG_improve_light_industry_desc:0 "Al apoyar el sector automotriz, podremos mejorar la logística interna y asegurar vehículos para la guerra venidera."
 YUG_Improve_Heavy_Industry:0 "Impulso de la industria pesada"
 YUG_Improve_Heavy_Industry_desc:0 "Para proteger al país se necesita una cantidad suficiente de armas. Al impulsar la industria pesada, podremos sentar las bases para una futura industria militar."
 YUG_Rural_Electrification:0 "Desarrollo rural"
 YUG_Rural_Electrification_desc:0 "Debemos desarrollar las zonas rurales de todo el país para asegurar nuestra seguridad alimentaria. Al electrificar el campo y abrir caminos por donde puedan circular tractores, camiones y otros vehículos, podremos aumentar la producción agrícola."
 YUG_Serbian_Urbanization:0 "Urbanización de Serbia"
 YUG_Serbian_Urbanization_desc:0 "Debido al largo dominio del antiguo Imperio otomano, la industrialización y urbanización de Serbia se han retrasado en comparación con las regiones del norte. La urbanización de Serbia debe ser nuestra máxima prioridad."
 YUG_Northen_Urbanization:0 "Urbanización del norte"
 YUG_Northen_Urbanization_desc:0 "Las regiones de Eslovenia y Croacia lograron cierto grado de industrialización y urbanización bajo el dominio de Austria y Hungría, pero siguen siendo insuficientes frente a otras ciudades europeas. Debemos acelerar la urbanización del norte para asegurar trabajadores industriales."
 YUG_Bosnia_Urbanization:0 "Urbanización de Bosnia"
 YUG_Bosnia_Urbanization_desc:0 "La urbanización e industrialización de Bosnia se están retrasando por su terreno accidentado. Como la urbanización de Bosnia es indispensable para la economía nacional, debemos invertir en Bosnia."
 YUG_Sourthen_Urbanization:0 "Urbanización del sur"
 YUG_Sourthen_Urbanization_desc:0 "Las regiones del sur, incluyendo Montenegro, Macedonia y Kosovo, aún no han escapado de la influencia del largo dominio otomano. La industria y las ciudades locales han permanecido atrasadas y abandonadas durante mucho tiempo, y el uso de la tierra es ineficiente.\nDebemos urbanizar el sur."
 YUG_Expand_Shipyards:0 "Ampliación de astilleros"
 YUG_Expand_Shipyards_desc:0 "Estamos junto al Adriático y las grandes potencias, incluida Italia, nos acechan. Para romper futuros bloqueos navales y resistir invasiones, necesitaremos astilleros capaces de construir buques de guerra y transportes."
 YUG_Construction_Improvements:0 "Mejoras en la construcción"
 YUG_Construction_Improvements_desc:0 "Sin casas la gente no puede vivir, y sin fábricas no se pueden producir los bienes necesarios. Debemos mejorar la capacidad constructiva del Estado para sobrevivir a esta crisis."
 YUG_Morava_Ironworks:0 "Acería de Morava"
 YUG_Morava_Ironworks_desc:0 "En la cuenca del río Morava hay minas que producen diversos recursos. Para aprovechar su potencial, debemos construir una acería que refine esos recursos."
 YUG_Improved_Productivity:0 "Mejora de la productividad"
 YUG_Improved_Productivity_desc:0 "La mejora de nuestra capacidad constructiva permitió edificar numerosas fábricas, pero\n nuestra productividad ni siquiera alcanza los talones de los países industriales avanzados.\n Debemos mejorar la productividad de nuestras fábricas\n para poder utilizarlas de forma más eficiente."
 
 YUG_War_Against_Italy:0 "Guerra contra Italia"
 YUG_War_Against_Italy_desc:0 "Al final, la guerra contra Italia era inevitable. Una vez estallada, debemos luchar hasta el final. No hay compromiso ni rendición. Al final de ese camino solo hay esclavitud."
 YUG_National_Emergency_Declaration:0 "Declaración de estado de emergencia nacional"
 YUG_National_Emergency_Declaration_desc:0 "La guerra con Italia es una cuestión de supervivencia para nuestro Estado y nuestro pueblo. Debemos declarar de inmediato el estado de emergencia nacional y llamar a la unidad de toda la población."
 YUG_Hold_the_Line:0 "¡Mantengan la línea!"
 YUG_Hold_the_Line_desc:0 "Las fuerzas italianas siguen irrumpiendo en nuestro territorio. No podemos retroceder para siempre. Recordemos el espíritu de Dragutin Gavrilović y de los soldados que, en la defensa de Belgrado durante la Gran Guerra, lanzaron un asalto desesperado contra la cabeza de puente austrohúngara. Mantendremos la línea hasta el último aliento."
 YUG_urgent_mobilization:0 "Orden de movilización urgente"
 YUG_urgent_mobilization_desc:0 "El frente consume tropas sin cesar. Para reemplazar muertos y heridos y dar al menos un mínimo descanso a las unidades exhaustas, debemos resolver la escasez de mano de obra. Para superar esta situación, medidas parciales no bastan. Debemos convocar todos los recursos humanos movilizables y enviar el máximo de tropas posible al frente."
 YUG_Short_term_production_increase:0 "Aumento de producción a corto plazo"
 YUG_Short_term_production_increase_desc:0 "La guerra está devorando enormes cantidades de suministros. Los soldados del frente no podrán combatir adecuadamente sin fusiles, cañones, radios, vendajes, munición y muchos otros materiales. Reagruparemos y reorganizaremos la retaguardia para buscar un aumento de producción a corto plazo."
 YUG_One_Gun_One_Man:0 "Un fusil por hombre"
 YUG_One_Gun_One_Man_desc:0 "Hemos podido reforzar la mano de obra mediante una movilización masiva, pero sin fusiles no podrán cumplir su función en el frente. Debemos aumentar la producción de armas para que, al menos, pueda suministrarse un fusil por cada hombre."
 YUG_Scavenging_the_Legacy_of_the_Great_War:0 "Hurgar en el legado de la Gran Guerra"
 YUG_Scavenging_the_Legacy_of_the_Great_War_desc:0 "Los suministros militares siempre escasean. Abriremos los almacenes donde se apilaron excedentes sobrantes de la Gran Guerra y utilizaremos el material aprovechable."
 YUG_Coastal_Anti_Air_Base:0 "Base antiaérea costera"
 YUG_Coastal_Anti_Air_Base_desc:0 "La fuerza aérea italiana está devastando nuestro territorio. No podremos detenerla con nuestra débil aviación, pero al desplegar bases antiaéreas en la costa podremos resistir en cierta medida."
 YUG_Molotov_Cocktail_Supply:0 "Suministro de cócteles molotov"
 YUG_Molotov_Cocktail_Supply_desc:0 "La mayoría de los blindados italianos usan motores de gasolina. Y los motores de gasolina son vulnerables al fuego. Suministraremos cócteles molotov como un medio antitanque provisional."
 YUG_Mountain_Gun:0 "Cañón de montaña"
 YUG_Mountain_Gun_desc:0 "Los territorios de Yugoslavia e Italia están formados por numerosas montañas. Si diseñamos artillería especializada para ello, podremos conquistar la superioridad de fuego en las regiones montañosas."
 YUG_Strengthening_Communication_Network:0 "Fortalecimiento de la red de comunicaciones"
 YUG_Strengthening_Communication_Network_desc:0 "Si hay que mencionar uno de los factores más importantes de la guerra moderna, las comunicaciones no pueden faltar. Conectaremos líneas militares de comunicación por todo el país y formaremos operadores para que las comunicaciones no se corten."
 YUG_Full_Scale_Counterattack:0 "Contraataque a gran escala"
 YUG_Full_Scale_Counterattack_desc:0 "El ejército italiano se ha agotado atacándonos. Su munición se ha agotado, sus heridos se desbordan y la moral se ha desplomado. Ahora nos toca expulsarlos más allá de la frontera."
 YUG_Climbing_the_Mountain_Alps:0 "Cruzad los Alpes"
 YUG_Climbing_the_Mountain_Alps_desc:0 "Logramos expulsar al ejército italiano más allá de la frontera, pero ahora los Alpes nos bloquean el paso. Impartiremos entrenamiento de guerra de montaña a todo el ejército y prepararemos equipo invernal. Los Alpes ya no podrán detenernos."
 YUG_Crossing_the_Piave_River:0 "Cruzando el río Piave"
 YUG_Crossing_the_Piave_River_desc:0 "Hemos cruzado los Alpes y también ocupamos Venecia. Ahora debemos cruzar el Piave. Preparemos a los ingenieros y los puentes de pontones. Crucemos montañas y ríos y avancemos hacia la victoria."
 YUG_Victory_in_Italy:0 "Victoria en Italia"
 YUG_Victory_in_Italy_desc:0 "Hemos vencido. Ahora recopilaremos las lecciones obtenidas en Italia y las convertiremos en doctrina para prepararnos para las guerras futuras."

