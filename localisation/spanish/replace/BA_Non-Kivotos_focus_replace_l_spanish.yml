#Indochina
 #Eventos
 indochina_event.1.t:0 "Revolución en Indochina"
 indochina_event.1.d:0 "Con el apoyo al Partido Comunista de Indochina expandiéndose por todo el país, el líder comunista Ho Chi Minh ha proclamado un Vietnam comunista y ha iniciado una insurrección. Debemos reprimirlos."
 indochina_event.1.a:0 "Maldición."

 #Espíritus nacionales
 VIN_upcoming_riot: "Levantamiento inminente"
 VIN_upcoming_riot_tt: "\nAl expirar: se activa el evento '§Y$indochina_event.1.t$§!'"
 VIN_indochina_war_idea: "Guerrillas de Indochina"
 VIN_indochina_war_idea_desc: "La región de Indochina presenta serias dificultades para la conducción de la guerra por parte del enemigo, debido a su clima cálido, sus densas selvas y la implicación activa de la población local."


#China
 CHI_mission_to_germany:0 "Misión diplomática a Italia"
 CHI_closer_ties_with_germany:0 "Vínculos más estrechos con Italia"
 CHI_closer_ties_with_germany_desc:0 "Nuestra delegación enviada a Italia ha abierto enormes posibilidades de cooperación, e incluso podríamos obtener préstamos para el desarrollo industrial en el futuro."
 CHI_give_falkenhausen_citizenship_desc:0 "El grupo de asesores alemanes ha desempeñado un papel crucial en la reconstrucción y modernización de nuestro ejército. Ahora que Alemania ha desaparecido, debemos permitir que permanezcan aquí."

#Probemos si el reemplazo funciona – Polonia
 POL_italian_alliance:0 "Mar Caspio"
 POL_italian_alliance_desc:0 "¡El frente antibolchevique no debe limitarse a Europa Oriental! Las naciones más allá de Anatolia pueden ofrecernos una ayuda invaluable."
 POL_protect_yugoslavia:0 "Ejército Nacional Ucraniano"
 POL_protect_yugoslavia_desc:0 "En 1922, Ucrania fue devastada territorialmente por los bolcheviques. Reuniremos a las fuerzas nacionalistas de Ucrania Occidental y las utilizaremos como voluntarios antibolcheviques."
 POL_diplomatic_mission_to_YUG:0 "Enviar una misión diplomática a [YUG.getName]"
 POL_the_mediterranean:0 "Mar Negro"
 POL_the_mediterranean_desc:0 "Los países del Mar Negro comparten frontera directa con [SOV.getadjective]. No dudarán en aceptar la mano que les tendamos."
 POL_coerce_slovakia:0 "Voluntarios de la Polonia Libre"
 POL_coerce_slovakia_desc:0 "Debido a la agresión ilegal de [SOV.getadjective], nuestra patria ha perdido sus territorios del noreste. ¡Debemos organizar milicias nacionalistas en esas regiones para oponernos a ellos!"
 POL_hungarian_alliance:0 "Brigada de Voluntarios Bielorrusos"
 POL_hungarian_alliance_desc:0 "Aunque débil, el nacionalismo bielorruso sigue vivo. Movilizaremos a los jóvenes que comparten la identidad bielorrusa."
 POL_invite_greece:0 "[POL_russian_volunteers]"
