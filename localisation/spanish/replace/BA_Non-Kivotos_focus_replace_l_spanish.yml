 NSB_soviet_soviet_german_trade_agreement.2.t: "[SOV.getadjective]-[MIL.getadjective] Acuerdo comercial firmado"
 SOV_propaganda_anti_fascism: "¡Avancemos hacia el frente de la liberación de la humanidad!"


#Estados Unidos
 USA_intervention_in_europe:0 "Intervención en el viejo orden"
 USA_intervention_in_europe_desc:0 "Ha llegado un nuevo orden. Debemos intervenir para evitar que el viejo orden, ya derrumbado, vuelva a levantarse."
 USA_war_plan_gold_desc:0 "Francia está poniendo sus ojos en Millennium Science School. Si llegan a hacerse con la tecnología científica de Millennium, supondría una amenaza extremadamente grave para nosotros."
 USA_war_plan_silver_desc:0 "El expansionismo italiano continúa sin freno. Si las ambiciones imperiales que albergan entran en conflicto con nuestros intereses nacionales, debemos estar preparados."
 USA_war_plan_white_desc:0 "Con el colapso del viejo orden, la amenaza comunista se está expandiendo. No existe un peligro mayor para nuestro país y para el mundo."
 USA_war_plan_red_desc:0 "Aunque el Reino Unido ha sufrido graves daños a manos del nuevo orden, sigue siendo una gran potencia naval en Europa. Este hecho nos resulta inquietante."
 USA_war_plan_black:0 "Plan de Guerra Azul Oscuro"
 USA_war_plan_black_desc:0 "Parecen permanecer en silencio, pero en realidad son el enemigo más peligroso del mundo. Debemos derrotarlos antes de que sea imposible reaccionar."

