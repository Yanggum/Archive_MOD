 ##Personajes
 SPBA_gil_robles: "José María Gil-Robles"
 SPBA_indalecio_prieto: "Indalecio Prieto"

 ##Eventos
 SPBA_event.1.desc: "Las elecciones generales de 1936 se celebraron en un ambiente bastante rígido debido al prolongado estado de emergencia nacional. Sin embargo, el resultado final fue claro: la gran campaña electoral del Frente Nacional, encabezado por la Confederación Española de Derechas Autónomas, dio sus frutos.\n\nEl apoyo financiero ilimitado de los capitalistas y la inquietud provocada por la 'Gran Transición' ocurrida en el norte se convirtieron en un fertilizante político decisivo para los conservadores. Como consecuencia, la división del Frente Popular llevó a que muchos votantes optaran por la derecha, que prometía orden y estabilidad, en lugar del caos republicano y las acciones irresponsables de la izquierda.\n\nLa recién instalada CEDA proclama la reconstrucción del Estado bajo el liderazgo del presidente [Root.GetLeader], amparándose en la 'confianza del pueblo'. Sin embargo, en las calles ya resuenan consignas de 'bolchevismo de otro mundo', y el conjunto de las fuerzas de izquierda comienza a ser señalado como traidor.\n\nAunque la victoria de la CEDA fue el resultado de un proceso electoral legal, la violencia política y la fragmentación social no solo no se han calmado, sino que parecen haber entrado en una nueva fase. El gobierno, lejos de buscar la conciliación con la oposición, muestra signos de querer reprimirla sin miramientos y utilizar las amenazas externas como pretexto para instaurar un sistema autoritario fuerte."
 SPBA_event.1.a: "¡No existe una alternativa mejor!"

 SPBA_event.2.t: "¡Las Cortes derrocan al presidente!"
 SPBA_event.2.desc: "Apenas se confirmó la victoria de la Confederación Española de Derechas Autónomas en las elecciones generales, el mundo político de Madrid comenzó a moverse con vértigo.\n\nEl presidente [Root.GetLeader] intentó seguir defendiendo el orden constitucional republicano, pero la mayoría del Frente Nacional en las Cortes lo estigmatizó como un líder incompetente y anacrónico.\n\nUtilizando como pretexto la Gran Transición ocurrida en el norte y la resistencia izquierdista dispersa, las Cortes presentaron una moción de urgencia y aprobaron la destitución presidencial de forma casi fulminante.\n\nRespaldada por el alto mando militar y las milicias falangistas, la dirección de la CEDA tomó el poder con una rapidez que parecía cuidadosamente planificada. El nuevo liderazgo estatal prometió un orden autoritario fuerte, centrado en el Ejército español.\n\nPese a la apariencia de legalidad procedimental, este episodio constituye en la práctica un golpe de Estado parlamentario y quedará registrado como un punto de inflexión crucial en la historia política de España."
 SPBA_event.2.a: "Para mantener el orden, se necesita un gobierno fuerte."

 SPBA_event.3.t: "Las brasas finales de los oficiales republicanos"
 SPBA_event.3.desc: "\"Los pasillos del Ministerio de Defensa estaban en un silencio sepulcral. Pero no era una calma serena, sino el presagio inquietante de una tormenta inminente. Cada vez que el recién impreso boletín oficial pasaba de mano en mano entre los oficiales, solo se oían suspiros apagados y maldiciones susurradas. La avalancha de propaganda difundida por el gobierno y los medios estatales no era más que una declaración abierta de purga.\n\nUn general de tendencias asambleístas dejó caer los documentos con gesto abatido. «Deberíamos haberlo sabido desde el momento en que expulsaron al presidente mediante un golpe parlamentario… Gil-Robles está desmantelando la República con toga en lugar de uniforme». Nadie fue capaz de responder. Muchos camaradas ya habían sido arrestados o puestos bajo vigilancia por supuestos vínculos con el 'bolchevismo de otro mundo'. Bajo el filo de leyes aparentemente legítimas, todos los generales de izquierda dentro del Ejército estaban ahora obligados a ofrecer su cuello.\n\nQuien rompió el silencio fue Vicente Rojo Lluch. Sin decir palabra, caminó hasta su despacho y tomó su estilográfica favorita. En su carta de dimisión solo había una línea: «Este oficial fue leal a la República, pero no puede servir a una República que ya no existe». Tras firmar, depositó sus insignias de rango sobre el escritorio.\n\nSu renuncia fue solo el comienzo. Desde los estrategas más respetados del Estado Mayor hasta jóvenes oficiales en el frente, los soldados que habían creído en los ideales republicanos comenzaron a abandonar sus armas y sus cargos uno tras otro. En una sola noche, el escritorio del ministro de Defensa quedó sepultado bajo cientos de cartas de dimisión. El gobierno del Frente Nacional logró 'purificar' al Ejército sin derramar una sola gota de sangre. Pero el precio fue la fractura de una institución que valoraba el honor como la vida misma, y avivar con combustible la voluntad de resistencia que aún no se había extinguido. La política de Madrid quedó manchada de tinta en lugar de sangre, pero aquel día el Ejército español se partió en dos."
 SPBA_event.3.a: "Una parte de la historia llega a su ocaso."

 SPBA_event.4.t:0 "Prórroga del estado de emergencia nacional"
 SPBA_event.4.desc:0 "La prórroga del estado de emergencia nacional fue aprobada por unanimidad en las Cortes gracias a la estrecha cooperación entre el Frente Nacional y algunos partidos centristas. De forma inmediata, el Ejército español —en especial las fuerzas de élite del Ejército de África— fue desplegado en las principales ciudades del país bajo el pretexto de operaciones de mantenimiento del orden.\n\nEn numerosos lugares, soldados moros patrullan las calles fumando cigarrillos, mientras socialistas con brazaletes rojos son golpeados brutalmente entre el apoyo frenético de parte de la población. La Guardia Civil a menudo provoca enfrentamientos en las grandes ciudades alegando la incautación de 'armas', y con la cálida acogida de sacerdotes y monjas, el Ejército español consolida eficazmente el control urbano.\n\nA pesar de que la mayoría del Frente Popular se negó a aceptar la prórroga, ha quedado aún más claro que España está empapada de un anticomunismo fanático y un deseo de venganza desbordado."
 SPBA_event.4.a:0 "¡Capturad y colgad a los traidores que se rebelen!"

