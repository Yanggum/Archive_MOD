 SPBA_national_emergency_extension: "Prórroga del estado de emergencia nacional"
 SPBA_national_emergency_extension_desc: "El 2 de noviembre de 1935, el gran caos en Europa y los constantes enfrentamientos en fronteras alteradas llevaron a la proclamación del estado de emergencia nacional y la imposición de la ley marcial en toda España. Ahora, colindando con los estados de otro mundo conocidos como Kivotos y con territorios propios arrebatados, se hace necesaria una movilización aún más severa."

