l_spanish:

 ROM_modify_the_constitution: "Defensa de la Constitución"
 ROM_modify_the_constitution_desc: "Defensa de la Constitución"
 


 #Dominio de los Balcanes
 ROM_big_empire: "Construcción de la Gran Rumanía"
 ROM_big_empire_desc: "No solo hemos sometido a todos los Balcanes, sino que además hemos doblegado a los seres de otro mundo y estamos emergiendo como una nueva gran potencia."

 ROM_attack_ITA: "Asegurar el Mediterráneo"
 ROM_attack_ITA_desc: "El Mediterráneo es una región marítima de vital importancia. El enemigo no es débil, pero eso no es razón para renunciar al Mediterráneo."

 ROM_secure_the_SHA: "Asegurar Austria"
 ROM_secure_the_SHA_desc: "Un enemigo desconocido ha sumido a Europa en el caos. Como primer paso de una gran cruzada, liberaremos Austria."

 ROM_be_roma: "El verdadero heredero de Roma"
 ROM_be_roma_desc: "El nombre de nuestro país significa la tierra de los romanos, y siempre nos hemos llamado a nosotros mismos romanos. Ahora, Roma está en nuestras manos. ¿Quién podría negar que somos los herederos de Roma?"


 #Fascismo
 ROM_appoint_TRM_friendly_government: "Nombrar un gobierno afín a Pater"
 ROM_appoint_TRM_friendly_government_desc: "El futuro de Rumanía depende de mantener buenas relaciones con las potencias de otro mundo que están emergiendo en Occidente. Debemos nombrar un gobierno que comprenda esta realidad."


 #No alineados
 ROM_all_parties_must_continue: "Todas las fiestas deben continuar"
 ROM_all_parties_must_continue_desc: "Para consolidar la posición del rey, las fiestas deben continuar. Por muy grave que sea la situación financiera, es necesario mantener el impulso político."
