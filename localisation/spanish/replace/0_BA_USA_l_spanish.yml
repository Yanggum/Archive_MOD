l_spanish:
#기존 로컬 수정
 USA_continue_the_new_deal: "Reevaluar el New Deal"
 USA_continue_the_new_deal_desc: "Mientras el New Deal avanzaba con buen ritmo, nos llegó la impactante noticia de que toda Europa ha sido ocupada por entidades venidas de otro mundo. Ahora enfrentamos una segunda amenaza crítica y debemos afrontar la crisis financiera que se avecina."
 USA_reestablish_the_gold_standard: "Reconocer el Fracaso Gubernamental"
 USA_reestablish_the_gold_standard_desc: "Reconociendo que las políticas del New Deal promovidas por los demócratas no son suficientes para corregir la situación actual, tomaremos medidas para una mayor privatización y ampliación de la autonomía. Así podremos desviar la responsabilidad de esta crisis."

 USA_gold_standard: "Medidas de Privatización"
 USA_send_lindbergh_to_germany: "Organizar la Unidad Aérea de Lindbergh"
 USA_send_lindbergh_to_germany_desc: "Un aviador famoso ha expresado su deseo de reunir a exiliados alemanes que sirvieron en la fuerza aérea durante la guerra anterior, para aprender de la antigua tecnología aérea alemana. Apoyar esta propuesta nos beneficiará al expandir las capacidades aéreas de nuestras fuerzas armadas."
 USA_work_with_the_bund: "Apoyo de los Germano-Estadounidenses"
 USA_work_with_the_bund_desc: "Una clara distinción y apoyo apropiado a los exiliados alemanes demostrará nuestra postura ante la comunidad germano-estadounidense. Asegurémonos de que perciban nuestra buena voluntad."
 war_plan_black: "Plan de Guerra Negro"

 USA_wartime_industry: "Rearme Rápido"
 USA_wartime_industry_desc: "Aunque logramos proteger nuestra industria civil, no ocurrió lo mismo con la industria de guerra. En este momento, con los sentimientos anti-Kivotos en aumento, es hora de impulsar rápidamente nuestra capacidad bélica."

