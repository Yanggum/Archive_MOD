 USA_intervention_in_kivotos: "Intervención contra el Nuevo Orden"
 USA_intervention_in_kivotos_desc: "El viejo orden ha colapsado. Debemos intervenir para evitar que el Nuevo Orden domine el mundo."

 USA_war_plan_MIL: "Plan de Guerra Azul"
 USA_war_plan_MIL_desc: "Los franceses resisten ferozmente la opresión extrema de Millennium. Con su espíritu de resistencia, incluso una ciencia abrumadora puede ser superada."

 USA_war_plan_GEH: "Plan de Guerra Rosa"
 USA_war_plan_GEH_desc: "Aquellos con apariencia demoníaca, o quizás demonios en sí mismos, son entidades que deben ser eliminadas prioritariamente."

 USA_war_plan_TRM: "Plan de Guerra Negra"
 USA_war_plan_TRM_desc: "Aliarse con los nazis del otro mundo es un acto claramente antihumano. Tenemos un deber sagrado: purgar a los nazis traidores y a los ángeles caídos."

 USA_war_plan_GEK: "Operación Reconquista de Alemania"
 USA_war_plan_GEK_desc: "La Kriegsmarine alemana tiene la voluntad de recuperar su patria, pero no cuenta con las fuerzas suficientes. Nuestra ayuda es crucial para la liberación de Alemania."

 USA_war_plan_WIN: "Plan de Guerra Verde Azulado"
 USA_war_plan_WIN_desc: "¿Qué puede ser más horroroso que el comunismo aliado con entidades de otro mundo?"

 USA_war_plan_KAI: "Plan de Guerra Caqui"
 USA_war_plan_KAI_desc: "¿Quién sabe qué hará un estado corporativo que inicia guerras sin justificación? Lo único claro es que si lo dejamos actuar, solo traerá más caos."

