 USABA_SOV_enter_american_civilwar: "Solicitar Apoyo a [SOV.GetFactionName]"
 USABA_soviet_equipment_shipments: "Envío de Equipamiento Soviético"
 USABA_soviet_military_advisors: "Asesores Militares Soviéticos"
 USABA_soviet_recovery_aid: "Ayuda Económica para la Recuperación Soviética"
 USABA_subvert_soviet_control: "Romper el Control Soviético"
 USA_soviet_team: "República Socialista Soviética de América"

 USABA_so_the_jews_are_the_problem: "¿Entonces los judíos son el problema?"
 USABA_so_the_jews_are_the_problem_desc: "La derrota de Alemania en la Gran Guerra y la decadencia actual de los Estados Unidos... Al final de toda conspiración se encuentra siempre el judío. ¡Debemos declararlos enemigos del pueblo americano!"
 USABA_so_the_jews_are_the_problem_tt: "Se organiza una §YMilicia Nacionalista Alemana§! en la capital."
 USABA_so_the_jews_are_the_problem_red_tt: "\n§R¡Si no se promulga rápidamente la Ley de Protección del Pueblo Alemán tras la guerra civil, las milicias derechistas y los alemanes en EE.UU. se convertirán en alborotadores!§!"

 USABA_german_ethnic_union_in_america: "Unión Étnica Alemana en América"
 USABA_german_ethnic_union_in_america_desc: "En diciembre de 1935, tras la disolución oficial del Estado alemán y el colapso de sus fuerzas armadas, muchos alemanes huyeron del desastre europeo hacia los Estados Unidos. Debemos acogerlos y expandir nuestras milicias para sofocar la rebelión de Boston."
 USABA_german_ethnic_union_in_america_tt: "Se crean §G6§! divisiones de §YMilicia Nacionalista Alemana§! en la capital"

 USABA_german_national_protection_law: "Ley de Protección del Pueblo Alemán"
 USABA_german_national_protection_law_desc: "Hasta que los alemanes exiliados puedan regresar a sus tierras, debemos establecer una legislación especial que les garantice un estatus 'diferenciado' dentro de los Estados Unidos."

 BA_end_USA_congress_tt: "§REl Congreso de los Estados Unidos queda suspendido.§!\n§RLa estabilidad disminuirá en función del apoyo a los partidos democráticos.§!"

###### Después de la Guerra Civil

