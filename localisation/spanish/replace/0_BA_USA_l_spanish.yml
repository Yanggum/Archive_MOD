 USA_recover_from_2nd_great_depression_categorie_desc: "La Segunda Gran Depresión ha terminado. Lo único que queda es crecer de nuevo. Si Estados Unidos logró resistir su hora más oscura, puede volver a ser un gigante."
 USA_recover_from_2nd_great_depression_failure_mission: "Fracaso de la Reconstrucción Económica"
 USA_recover_from_2nd_great_depression_failure_mission_desc: "Tras adoptar una estrategia regresiva, el gobierno ha puesto todo en la reconstrucción. Si lo logramos, ganaremos el apoyo total del pueblo. Pero si fallamos… las consecuencias serán devastadoras."
 USA_recover_from_2nd_great_depression_east_coast_infra: "Reconstrucción de Infraestructura del Este"
