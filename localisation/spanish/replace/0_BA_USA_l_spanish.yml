#이벤트

 USA_recover_from_2nd_great_depression_tt: "§Y$USA_recover_from_2nd_great_depression_categorie$§!: se desactivarán todas las decisiones industriales relacionadas."
 
 usa_chroma_event.2.t: "Reconstrucción Económica Interrumpida"
 usa_chroma_event.2.d: "Dado que nuestro país está siendo atacado, no podemos continuar con los planes de reconstrucción económica. Tal vez podamos retomarlos si vuelve la paz, pero por ahora, debemos centrarnos en la producción militar."
 usa_chroma_event.2.a: "Aprovechemos el boom bélico."

 usa_event.1.t: "Una Declaración ante el Congreso"
 usa_event.1.d: "Los invasores de otro mundo han ocupado el continente europeo, oprimiendo a sus pueblos.\n\nNo nos hemos mantenido al margen por miedo, sino para preparar el momento perfecto y liberar a Europa —y a toda la humanidad— con seguridad.\n\nHemos esperado con paciencia. ¡La hora de la liberación ha llegado!"
 usa_event.1: "La guerra para acabar con todas las guerras"

 usa_event.2.t: "Síntomas de una Nueva Crisis Económica"
 usa_event.2.d: "La desaparición del mercado europeo ha golpeado fuertemente a nuestras principales compañías exportadoras. Las rutas comerciales se han cerrado, los ingresos se han desplomado, y los pequeños inversores están quebrando en masa. Su ansiedad se propaga, y las señales de una nueva crisis aparecen por todas partes."
 usa_event.2.a: "Esto no pinta bien…"

 usa_event.3.t: "Presagios del Colapso"
 usa_event.3.d: "El colapso del mercado europeo no fue un simple choque temporal. Las quiebras en cadena de las compañías comerciales han arrastrado a pequeños inversores. El sistema financiero se contrae, y las bases de la economía estadounidense comienzan a temblar. Todo parece en orden, pero bajo la superficie... el desastre se gesta."
 usa_event.3.a: "Todo estará bien... ¿verdad?"

 usa_event.4.t: "La Segunda Gran Depresión"
 usa_event.4.d: "Los alienígenas han destruido el viejo orden y ocupado Europa, y con ello, los activos que nuestros inversores poseían allí se volvieron papel mojado. Las bolsas de Londres, Berlín y París colapsaron en cadena, arrastrando con ellas a Wall Street. La bolsa de Nueva York es ahora un páramo.\n\nEl comercio con Europa quedó completamente paralizado, dejando a nuestras empresas con productos sin cobrar, fábricas cerradas y una crisis sin precedentes.\n\nTodo el pueblo estadounidense entiende ahora que ha comenzado una nueva depresión."
 usa_event.4.a: "¿Estamos en 1929 otra vez?"

 usa_event.5.t: "Calles que ya no Brillan"
 usa_event.5.d: "El puerto de Nueva Jersey, antaño resplandeciente con luces y faros, ha perdido su brillo. Europa, nuestro mayor mercado, desapareció. Las compañías comerciales quebraron y el puerto quedó vacío.\n\nFracasamos en crear nuevas rutas comerciales atlánticas. Las antiguas compañías están muertas, y no volverán."
 usa_event.5.a: "Solo quedan ruinas."

 usa_event.6.t: "Una Ciudad Llena de Desempleados"
 usa_event.6.d: "Washington D.C., que solía ser un centro lleno de vida, ahora está envuelto en oscuridad. Los jóvenes deambulan desempleados, la comida escasea, los trenes de carga se han detenido, y las luces se han apagado.\n\nEmpresas cerradas, trabajadores en la calle… El New Deal intenta responder, pero no es suficiente. La recuperación parece inalcanzable."
 usa_event.6.a: "¡Más Hoovervilles!"

 usa_event.7.t: "La Ruina de la Agricultura Americana"
 usa_event.7.d: "El glorioso cinturón del maíz está cayendo. Tras el Dust Bowl y el colapso del mercado europeo, incluso los últimos grandes agroempresarios suplican ayuda.\n\nPero no podemos ofrecérsela. Europa ha caído, la URSS ya no nos compra, y la industria ganadera ha colapsado. Nadie necesita nuestros cultivos. Solo nos queda ver cómo se hunden."
 usa_event.7.a: "El granero de América ha muerto."

 usa_event.8.t: "Colapso del Mercado Financiero"
 usa_event.8.d: "Los bancos enfrentan corridas y cesación de pagos masiva. El sistema financiero ha perdido toda credibilidad. Fusiones forzadas, cierres, huida de capital…\n\nNi imprimir dinero en secreto, ni vender bonos basura funcionará más. Se acabó."
 usa_event.8.a: "¡Estamos jodidos!"

 usa_event.9.t: "Quiebra Bancaria"
 usa_event.9.d: "El National City Bank de Nueva York ha cerrado.\n\nLas quiebras, la pérdida de confianza, los retiros masivos, las deudas impagables… Ya no pudieron resistir.\n\nLa multitud frente al banco no verá su dinero jamás. El sistema financiero de Nueva York está herido de muerte. Este evento marca el inicio del colapso económico estadounidense."
 usa_event.9.a: "Duraron más de lo que esperaba…"

 usa_event.10.t: "Protestas Antigubernamentales"
 usa_event.10.d: "Los suburbios de Nueva York están cubiertos de Hoovervilles. El desempleo y la miseria se desbordan. Las protestas masivas se tornan violentas, y la represión policial ya es rutina.\n\nCada vez que se disuelve una protesta, otra nace. La ciudad es un campo de batalla. Ya no queda nada de la normalidad. La desesperanza reina."
 usa_event.10.a: "¿Podrá Roosevelt inspirar esperanza una vez más?"

 usa_event.11.t: "Sentencia de Muerte"
 usa_event.11.d: "Ni la impresión de dinero secreta, ni la venta de bonos tóxicos, ni la nacionalización de bancos evitaron el colapso de la Reserva Federal. El dólar ha perdido toda credibilidad. Las reformas radicales han fracasado.\n\nNuestros aliados ya no compran nuestros productos. El futuro es oscuro. Lo que queda es el caos del sur enardecido."
 usa_event.11.a: "Que Dios bendiga a América…"

 usa_event.12.t: "Revuelta Alemana en Detroit"
 usa_event.12.d: "Los exiliados alemanes y sus milicias han ocupado Detroit.\n\nReprimirlos podría desatar una tercera guerra civil. Debemos decidir."
 usa_event.12.a: "Esto se complica..."

 usa_event.13.t: "Revuelta Alemana se Extiende a [USA_rising_exiled_germans_2st.GetName]"
 usa_event.13.d: "Los disturbios se expanden. Si no actuamos, escalarán aún más."
 usa_event.13.a: "¿Qué demonios…?"

 usa_event.14.t: "La Tercera Crisis de Disolución Nacional"
 usa_event.14.d: "Los rebeldes alemanes se proclaman Brigada de Salvación Nacional y reclutan civiles. O los aplastamos ahora, o cedemos a sus demandas. ¡Ya!"
 usa_event.14.a: "Esto es una pesadilla."
 
 usa_event.15.t: "Demanda sobre Filipinas por parte de [FROM.GetName]"
 usa_event.15.d: "Mientras respondemos a la crisis europea, [FROM.GetName] nos exige ceder el control de Filipinas.\n\nPodemos aceptar o prepararnos para la guerra."
 usa_event.15.a: "Cederemos Filipinas."
 usa_event.15.b: "Prepárense para la guerra."

 usa_event.16.t: "Retiro de [FROM.GetName] de Filipinas"
 usa_event.16.d: "Tras nuestra exigencia, [FROM.GetName] ha retirado sus fuerzas de Filipinas, y ahora tenemos el control total para decidir su destino."
 usa_event.16.a: "Perfecto."

 usa_event.17.t: "[FROM.GetName] rechaza nuestra petición"
 usa_event.17.d: "A pesar de nuestro generoso comunicado diplomático, [FROM.GetName] ha decidido enfrentarse a nosotros en guerra."
 usa_event.17.a: "Era de esperarse."

 usa_event.19.t: "El consejo de Iroha"
 usa_event.19.d: "Haaa... qué fastidio... pero bueno, me necesitan, ¿no?"
 usa_event.19.a: "¡Hagamos como ella dijo!"

 usa_event.20.t: "Ibuki acepta la invitación a la fiesta"
 usa_event.20.d: "La adorable mascota de Gehenna, Ibuki, aceptó nuestra invitación y asistió a la fiesta en la embajada.\n\n¿Cómo puede existir una criatura tan adorable? Como era de esperarse, fue escoltada por un equipo de seguridad y disfrutó alegremente del evento."
 usa_event.20.a: "¡Ibuki es un encanto!"

 usa_event.21.t: "Industria resuelve el problema de bienes de consumo"
 usa_event.21.d: "Tras el fin de la Gran Depresión, hemos reorganizado a gran escala la industria de bienes de consumo que estaba produciendo en exceso."
 usa_event.21.a: "Esto es solo el comienzo."

 usa_event.22.t: "Industria resuelve el problema de la construcción"
 usa_event.22.d: "Después de la depresión, solucionamos los problemas de propiedad de los capitalistas y reactivamos el sector de la construcción."
 usa_event.22.a: "Vamos avanzando."

 usa_event.23.t: "Industria resuelve el problema de producción"
 usa_event.23.d: "Hemos superado los problemas causados por la política de empleo forzado mediante una estrategia de contratación más eficiente."
 usa_event.23.a: "¡Ya casi terminamos!"

 usa_event.24.t: "Industria resuelve todos los problemas"
 usa_event.24.d: "Todos los efectos secundarios de la reforma industrial radical han sido superados. En lugar de ver desempleados y vagabundos, ahora vemos familias felices en las calles."
 usa_event.24.a: "¡¡¡Por fin!!!"

 usa_event.25.t: "Implementación de la Ley de Almacenamiento de Alimentos"
 usa_event.25.d: "Con la bancarrota de las empresas agrícolas, debemos liberar las reservas alimentarias acumuladas según la ley de almacenamiento.\n\nAunque los ciudadanos desconfiaron de esta medida en su momento, ahora verán su sabiduría."
 usa_event.25.a: "Excelente."

 usa_new_civil_event.1.t: "¡Un estado se separa de la Unión!"
 usa_new_civil_event.1.desc: "Algunos estados, organizados bajo el Frente de Liberación de la Humanidad, han declarado su secesión del gobierno federal y su negativa a cooperar con nuestra política exterior.\n\n¡Debemos responder de inmediato! ¡No toleraremos la división de la Unión!"
 usa_new_civil_event.1.a: "¡Destrúyanlos!"



