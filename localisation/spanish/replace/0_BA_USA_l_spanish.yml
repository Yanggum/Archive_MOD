 USA_soviet_stalin_valley: "Valle de Stalin"

 #Derecha
 USA_rising_exiled_germans_state: "Revuelta de los Alemanes Exiliados"
 USA_rising_exiled_germans: "Disturbios de los Alemanes en América"
 USA_rising_exiled_germans_1st: "Reagrupamiento Derechista"
 USA_rising_exiled_germans_2st: "Expansión de la Revuelta"
 USA_rising_exiled_germans_3st: "Decisión Final"

 USABA_revolutionaries_of_the_nation: "Revolucionarios de la Nación"
 USABA_strong_propaganda: "Propaganda Fuerte"
 USABA_expansion_of_influence_in_america: "Expansión de Influencia en América"
 USABA_destruction_of_jewish_groups: "Destrucción de Grupos Judíos"
 USABA_rise_to_power: "Ascenso al Poder"

 USABA_revolutionaries_of_the_nation_desc: "Dos derrotas y una huida de Europa. Todo esto ha sido la prueba de fuego de nuestra nación alemana. Ahora, en este lejano continente americano, debemos luchar por una nueva supervivencia. Somos los últimos revolucionarios de nuestra nación, de pie al frente del destino del pueblo alemán."
 USABA_strong_propaganda_desc: "Los medios estadounidenses se han convertido en instrumentos de populismo y sensacionalismo tras la Gran Guerra. Manipularlos a nuestro favor será más fácil de lo que parece."
 USABA_expansion_of_influence_in_america_desc: "Debemos superar a los múltiples grupos de presión en Estados Unidos y expandir nuestra influencia por todos los medios: propaganda, populismo, teorías conspirativas o escándalos, lo que sea necesario."
 USABA_destruction_of_jewish_groups_desc: "Los grupos judíos son nuestro oponente más fuerte y enemigos históricos de nuestro pueblo. A través de ataques constantes y la idolatría de nuestras milicias, destruiremos sus redes de influencia."
 USABA_rise_to_power_desc: "Ahora sí, comienza de verdad. Los Estados Unidos de América están siendo moldeados por un puñado de exiliados europeos — el Comité Alemán. Es hora de preparar una guerra nacional para la reconquista de Europa."

 USABA_joining_hands: "Unir Fuerzas"
 USABA_compromise_plan: "Plan de Compromiso"
 USABA_controlling_the_far_right: "Contener a la Extrema Derecha"
 USABA_attacks_on_conspiracy_theories: "Ataques contra las Teorías Conspirativas"
 USABA_limiting_german_militia: "Restringir a las Milicias Alemanas"
 USABA_towards_a_new_era_in_america: "Hacia una Nueva Era en América"

 USABA_joining_hands_desc: "Para una transformación real de los Estados Unidos, debemos fortalecer nuestra cooperación con los exiliados europeos — especialmente los alemanes."
 USABA_compromise_plan_desc: "Nuestro gobierno no puede integrar plenamente a los alemanes, pero sí puede ayudarlos a regresar a sus tierras natales algún día."
 USABA_controlling_the_far_right_desc: "El Comité Alemán está claramente fuera de control. Sus teorías delirantes y las milicias que las siguen son una amenaza para el futuro de la república."
 USABA_attacks_on_conspiracy_theories_desc: "Sus teorías conspirativas son débiles y fácilmente desmontables. ¿Hitler huyó a la Luna? Debemos exponer la falta de lógica en su discurso y desmantelar sus bases de apoyo."
 USABA_limiting_german_militia_desc: "No podemos permitir que las milicias actúen sin control. La Guardia Nacional y las fuerzas del orden deben cooperar para desmantelar a estos grupos extremistas."
 USABA_towards_a_new_era_in_america_desc: "Por fin, podemos ver los cimientos de una América auténtica. Una nueva era está amaneciendo, y con ella disiparemos todas las sombras."

 USA_rising_exiled_germans_3st_flag: "Ha estallado la Tercera Guerra Civil Estadounidense"
 USA_rising_exiled_germans_3st_flag_NOT: "No ha estallado la Tercera Guerra Civil Estadounidense"

 USABA_german_national_protection_law_tt: "Con el tiempo, el §YComité Representativo Alemán§! comenzará su propia rama de enfoques."
 USABA_german_ch: "Comité Representativo Alemán"
 USABA_revolutionaries_of_the_nation_tt: "§gLeni Riefenstahl, ex directora de cine en la antigua Alemania y ahora figura clave entre los exiliados, será invitada al gobierno.§!"

 USABA_towards_a_new_era_in_america_tt: "El §YComité Representativo Alemán§! ya no podrá completar su línea de enfoques."

 USABA_german_ch_idea: "Comité Representativo Alemán"
 USABA_german_ch_idea_modifier_tt: "Modificadores de §Y$USABA_german_ch_idea$§!:"

 USABA_german_government_restored: "Restauración del Gobierno Alemán"

