 USABA_usa_event_5_idea: "Operaciones militares indiscriminadas"
 USABA_usa_event_5_idea_desc: "Reclutamiento forzado de civiles, ocupación de empresas industriales, y operaciones de limpieza en zonas urbanas para prevenir el adoctrinamiento: muchas operaciones militares ilegales están siendo llevadas a cabo por nosotros. Es una decisión que, lamentablemente, no podíamos evitar."

 USABA_government_official_exile: "Exilio del personal gubernamental"
 USABA_relocation_of_naval_headquarters: "Traslado del cuartel naval"

 usa_chroma_event.1.t: "Establecimiento del gobierno provisional"
 usa_chroma_event.1.d: "Tras la aniquilación de Washington por entidades desconocidas, Estados Unidos cayó en el caos. Con el núcleo del gobierno desaparecido, los ciudadanos cayeron en pánico y el orden social comenzó a colapsar. Sin embargo, el Ejército de EE. UU. no abandonó la resistencia hasta el final. Lograron contener, con mucho esfuerzo, el ataque de los misteriosos enemigos conocidos como 'los Colores'.\n\nDurante esta crisis, los líderes y figuras clave del gobierno lograron escapar al oeste, cruzando las Montañas Rocosas, y allí comenzaron los preparativos para reconstruir la nación. En su lugar de exilio, establecieron un gobierno provisional y están movilizando todos los recursos restantes para preparar una nueva guerra.\n\nNos espera una larga guerra. Esta lucha contra el enemigo desconocido no acabará pronto y traerá grandes sacrificios y sufrimientos. Pero Estados Unidos ha tomado su decisión. Sobrevivimos, y ahora, avanzaremos."
 usa_chroma_event.1.a: "¡Detenedlos, usad todos los medios necesarios!"
 usa_chroma_event.1.b: "Por suerte, el oeste está a salvo."

 usa_chroma_event_1_tt: "§YTodos los políticos§! se §Yretirarán§! o se unirán al §YGobierno Provisional [USA.GetFlag]§!.\n§YTodos los comandantes navales§! se §Yretirarán§! o se unirán al §YGobierno Provisional [USA.GetFlag]§!.\n\n"

 usa_chroma_event.3.t: "Victoria de los Colores"
 usa_chroma_event.3.d: "Aunque el Ejército de EE. UU. resistió ferozmente, no pudo contener el ataque de los Colores. Estas entidades desconocidas aplastaron nuestras líneas defensivas una tras otra, y ahora su presencia se acerca a nuestro gobierno en el exilio.\n\nAfortunadamente, no parecen querer cruzar las Montañas Rocosas. Su avance se ha detenido al pie de las montañas, dándonos una ventana para encontrar una nueva solución.\n\nHa llegado la hora de unificar los pocos territorios restantes y reconstruir los Estados Unidos. Nuestros recursos son limitados, pero nunca nos rendiremos. Debemos encontrar una manera de devolver la libertad y la prosperidad a esta tierra."
 usa_chroma_event.3.a: "¿Realmente podremos lograrlo...?"

 usa_chroma_event.4.t: "Restauración del Congreso y Ejecutivo de EE. UU."
 usa_chroma_event.4.d: "Tras múltiples crisis, hemos logrado repeler a las entidades desconocidas, los Colores, de nuestro territorio. Este día glorioso quedará grabado en la historia: ¡la integridad de los Estados Unidos ha sido restaurada una vez más!"
 usa_chroma_event.4.a: "¡Perfecto!"

 usa_chroma_event.5.t: "¿Un gobierno provisional?"
 usa_chroma_event.5.d: "Frente a la repentina invasión de seres desconocidos, muchos políticos estadounidenses podrían ceder al miedo e interferir con nuestras operaciones militares. Ha llegado una propuesta: enviar a todos estos 'pacifistas' más allá de las Montañas Rocosas y establecer un Estado Administrativo Provisional para albergar a los políticos y refugiados, eliminando así cualquier obstáculo a nuestro esfuerzo bélico."
 usa_chroma_event.5.a: "Sí, aplicaremos estrategias militares extremas."
 usa_chroma_event.5.b: "No, aunque haya confusión, no lo permitiremos."
 usa_chroma_event.5.c: "Tenemos la fuerza para enfrentar esta situación con firmeza."

 USPG_john_nance_garner: "John Nance Garner"

