######################신규 중점들######################
######################################################
 USA_fast_train: "Reforma Militar"
 USA_fast_train_desc: "Debido a un excesivo desarme, nuestras fuerzas armadas se encuentran en una situación crítica tanto en cantidad como en calidad. Despediremos a los comandantes incompetentes y crearemos un programa militar eficiente que eleve el nivel de entrenamiento."

 USA_army_of_the_united_states_propaganda: "Desfile del Ejército de los Estados Unidos"
 USA_army_of_the_united_states_propaganda_desc: "En honor a la superación de la Gran Depresión, organizaremos un desfile del Ejército de EE.UU. e iniciaremos una serie de lobbies para obtener fondos del Congreso destinados al rearme."

 ##################################
 ########### AMÉRICA COMUNISTA ###########
 ##################################

 USABA_forced_wake_up: "Terapia de Choque"
 USABA_forced_wake_up_desc: "Pondremos en marcha temporalmente una gran cantidad de fábricas de forma forzada y reorganizaremos ciertos sectores industriales. Esta medida generará resistencia, pero podrá reactivar la economía a corto plazo."

 USABA_force_to_give_job: "Creación Forzada de Empleo"
 USABA_force_to_give_job_desc: "Durante la Gran Depresión, algunas fábricas sufren de exceso de desempleados, mientras que otras carecen de trabajadores. Asignaremos de forma obligatoria a los desempleados donde más se les necesita."

 USABA_every_worker_welfare: "Implementar Racionamiento Obrero"
 USABA_every_worker_welfare_desc: "Los trabajadores laboran en condiciones precarias y reciben salarios miserables. Las medidas temporales actuales no serán sostenibles y podrían derivar en huelgas. Debemos prevenir esa situación."

 USABA_replace_industry: "Reestructuración Industrial"
 USABA_replace_industry_desc: "Para enfrentar la escasez de alimentos y productos esenciales, reestructuraremos gran parte de la industria. Aunque algunos capitalistas se opongan, esta medida es vital para superar la Gran Depresión."

 USABA_establish_government_industry: "Comisarios del Pueblo en las Empresas"
 USABA_establish_government_industry_desc: "La Segunda Gran Depresión fue causada por el colapso del mercado europeo tras la Gran Guerra. Para resolver el exceso de oferta destructivo, la intervención estatal en las empresas es inevitable."

 USA_bad_kivotos_RED: "Seguir a Red Winter"
 USA_bad_kivotos_RED_desc: "Puede parecer una decisión absurda y ridícula… pero quizás no sea tan mala después de todo."

 USA_bad_kivotos_RED_pudding: "Importar Pudding de Red Winter"
 USA_bad_kivotos_RED_pudding_desc: "Uno de los mayores símbolos comerciales de la Federación Académica Red Winter es su pudding escolar. Lo importaremos y distribuiremos por todo el país."

 USA_bad_kivotos_RED_more_pudding: "Nacionalizar la Producción de Pudding"
 USA_bad_kivotos_RED_more_pudding_desc: "El pudding de Red Winter es excelente, pero su transporte desde tan lejos genera altos costos. Estableceremos fábricas locales para expandir su distribución a nivel nacional."

 USA_be_red: "Ascenso del Partido Comunista"
 USA_be_red_desc: "El Partido Demócrata ha fallado en responder a la Segunda Gran Depresión. Solo el Partido Comunista, que ha manejado eficazmente la crisis, tiene legitimidad para gobernar."

 USA_big_industry_plan: "Segunda Reestructuración Industrial"
 USA_big_industry_plan_desc: "Debemos reorganizar de manera eficiente el sistema industrial que creamos como medida provisional. Aunque pueda causar confusión temporal, traerá mayor productividad en el futuro."
 USA_big_industry_plan_1_tt: "\n90 días después de completar este enfoque:"
 USA_big_industry_plan_2_tt: "\n180 días después de completar este enfoque:"
 USA_big_industry_plan_3_tt: "\n270 días después de completar este enfoque:"
 USA_big_industry_plan_4_tt: "\n360 días después de completar este enfoque:"

 USA_final_economic_plan: "Tercera Reestructuración Industrial"
 USA_final_economic_plan_desc: "Tras el éxito de la Segunda Reestructuración Industrial, ha llegado el momento de aplicar una nueva ideología económica y rediseñar nuestro sistema industrial."
 USA_final_economic_plan_tt: "Mejorará el espíritu nacional dependiendo de la rama completada durante la Segunda Reestructuración Industrial."

 USA_the_aggresive_comintern_2: "Política Antifascista"
 USA_the_aggresive_comintern_2_desc: "La agitación fascista se extiende por Europa tras la Gran Guerra, oprimiendo a los trabajadores. Es nuestro deber erradicar a estos regímenes."

 USA_the_union_comintern_2: "Apoyo a la Revolución"
 USA_the_union_comintern_2_desc: "Los trabajadores del mundo viven bajo opresión. Es nuestra responsabilidad ayudarlos a levantarse y luchar por su liberación."

 usa_my_way: "Nuestro Propio Camino"
 usa_my_way_desc: "El marxismo-leninismo ha sido corrompido y distorsionado por dictadores. A diferencia de los regímenes totalitarios que dicen ser comunistas, construiremos un verdadero estado utópico para los trabajadores."

 USA_the_comintern: "Revisión de Política Exterior"
 USA_the_comintern_desc: "Mientras resolvíamos nuestros problemas internos, el mundo ha cambiado drásticamente. Es hora de mirar hacia afuera."

 USA_the_aggresive_comintern: "Política Exterior Agresiva"
 USA_the_aggresive_comintern_desc: "La situación internacional es caótica. Para estabilizarla, necesitamos una política exterior decidida y ofensiva."

 USA_the_union_comintern: "Política Exterior Conciliadora"
 USA_the_union_comintern_desc: "Resolver los conflictos internacionales con violencia solo traerá nuevos problemas. Debemos abordar estas tensiones con diplomacia y moderación."

 USA_modified_capitalism: "Capitalismo Modificado"
 USA_modified_capitalism_desc: "El Estado no debe mantenerse al margen de la economía, pero tampoco debe intervenir en exceso. Esta estrategia puede ayudar a corregir las contradicciones del capitalismo."

 USA_economic_interventionism: "Economía Planificada Total"
 USA_economic_interventionism_desc: "Ya no basta con intervenir en sectores clave: el Estado debe controlar toda la economía para equilibrar la oferta y la demanda, evitando crisis como la Gran Depresión."

 USA_sov_economy_together: "Desarrollo Industrial EE.UU.-URSS"
 USA_sov_economy_together_desc: "La URSS logró una industrialización acelerada con su plan quinquenal, aunque sacrificó su agricultura. Un desarrollo industrial conjunto traerá beneficios a ambos países."

 USA_sov_factory_together: "Desarrollo Conjunto de la Industria Militar"
 USA_sov_factory_together_desc: "Además del desarrollo civil, cooperaremos con la URSS en la industria armamentística. Esto ayudará a contrarrestar años de desarme."

 USA_red_team: "La Opción Inesperada"
 USA_red_team_desc: "Europeos, seres de otro mundo… incluso nosotros mismos no esperábamos esta decisión. Pero si hay algo seguro, es que ellos perderán… y nosotros ganaremos."
 USA_add_dog: "Invitar a la Legión Plateada"
 USA_add_dog_desc: "Formalizaremos la invitación a los movimientos fascistas que están ganando influencia dentro de los Estados Unidos, con el fin de sumar fuerzas para afrontar esta situación crítica."

 USABA_fireside_chats: "Continuar las Charlas junto al Fuego"
 USABA_fireside_chats_desc: "Desde 1933, las Charlas junto al fuego han sido una serie de discursos radiales vespertinos realizados por el presidente Franklin D. Roosevelt. Con palabras familiares y cercanas a millones de ciudadanos, hablaban sobre la recuperación de la Gran Depresión y los temores del estado de emergencia. Ahora, la radio nos guiará también durante esta segunda gran depresión."

 USABA_develop_corn_belt: "Ley de Reserva de Alimentos de Emergencia"
 USABA_develop_corn_belt_desc: "Con el colapso inminente de las grandes agroindustrias en el cinturón del maíz, debemos anticiparnos a una futura crisis alimentaria acumulando reservas y garantizando el suministro esencial."
 USA_2nd_great_depression_4th_end_of_agriculture_endflag: "Quiebra de las empresas agrícolas"

 USABA_maintenance_of_isolation_policy: "Mantener el Aislamiento"
 USABA_maintenance_of_isolation_policy_desc: "Estados Unidos se distanciará del caos y las crisis extranjeras para enfocarse en sus propios problemas. No intervendremos en conflictos internacionales y priorizaremos la recuperación económica y la estabilidad interna. Al minimizar las influencias externas, buscaremos la autosuficiencia nacional."
 USABA_maintenance_of_isolation_policy_desc_cst: "§gSe inician los preparativos para el plan de autosuficiencia económica de EE.UU.§!"

 USABA_massive_bailout: "Rescate Financiero Masivo"
 USABA_massive_bailout_desc: "Para evitar el colapso total del sistema financiero, ejecutaremos un plan masivo de rescate. Salvaremos bancos e industrias clave para restaurar la confianza del pueblo y frenar la caída económica. Este será el primer paso hacia la recuperación."

 USABA_government_propaganda: "Propaganda Gubernamental"
 USABA_government_propaganda_desc: "El gobierno lanzará una intensa campaña propagandística para infundir esperanza y confianza en la ciudadanía. Utilizaremos todos los medios disponibles para calmar el caos social y consolidar el respaldo popular."

 USABA_contact_with_opposition: "Contactar a la Oposición"
 USABA_contact_with_opposition_desc: "Buscaremos cooperación bipartidista contactando a la oposición. En tiempos de crisis, la estabilidad política es clave. Escucharemos sus propuestas y resolveremos juntos la situación, fomentando la unidad nacional."

 USABA_blurring_focus: "Desenfoque Estratégico"
 USABA_blurring_focus_desc: "El gobierno expondrá múltiples asuntos para dispersar la atención pública. Así reduciremos la presión política y aliviaremos la ansiedad ciudadana. Evitaremos que el pueblo comprenda la magnitud de la crisis, disminuyendo los conflictos sociales."

 USABA_secret_economic_program: "Programa Económico Secreto"
 USABA_secret_economic_program_desc: "Llevaremos a cabo medidas económicas no anunciadas públicamente. Con el apoyo tácito de la oposición, emitiremos bonos tóxicos y crearemos dinero para sostener las finanzas públicas. Ganaremos algo de tiempo."

 USABA_unrestricted_inflation_permitted: "Permitir Inflación Ilimitada"
 USABA_unrestricted_inflation_permitted_desc: "Permitiremos una inflación desenfrenada para reactivar la economía. Aunque se sacrifique el valor de la moneda, reduciremos el peso de las deudas y estimularemos el consumo. Es una medida radical, pero necesaria."
 USABA_regression_strategy_loweffect_tt: "Disminuye la cantidad de §Yfábricas civiles§! eliminadas al completar §Y$USABA_regression_strategy$§!"

 USABA_expansion_of_state_authority: "Delegar Poderes a los Estados"
 USABA_expansion_of_state_authority_desc: "Ante la incapacidad del gobierno federal para resolver la crisis, cederemos poder a los estados. Cada uno gestionará sus propios problemas, aliviando parte de la presión política central."

 USABA_regression_strategy: "Estrategia de Reversión"
 USABA_regression_strategy_desc: "Abandonando la economía moderna, regresaremos a un sistema de autosuficiencia. Reorganizaremos nuestros recursos e industrias para garantizar la supervivencia del país. Con un sistema simple y estable, dejaremos atrás el colapsado sector financiero."

 USABA_american_reindustrialization: "Reindustrialización Americana"
 USABA_american_reindustrialization_desc: "Para revitalizar nuestra economía, impulsaremos una política de reindustrialización masiva. Reestructuraremos el sistema productivo centrado en la manufactura, iniciando un nuevo auge económico."
 USABA_american_reindustrialization_desc_cst: "Desbloquea una serie de decisiones para la reconstrucción industrial de Estados Unidos."

 USA_devil_economy: "Cooperación Económica EE.UU.-URSS"
 USA_devil_economy_desc: "Vanilla destroyer ship (placeholder)."

 USA_support_RED: "Apoyo a Red Winter"
 USA_support_RED_desc: "Cherry farm lol (placeholder)."

 USA_support_SOV: "Apoyo a la URSS"
 USA_support_SOV_desc: "Con el apoyo de un gigante, nada puede detener a la Unión Soviética."

 USA_old_team_nuclear: "Proyecto Manhattan"
 USA_old_team_nuclear_desc: "Hemos confirmado que nuestras armas convencionales no son efectivas contra los seres del otro mundo. Necesitamos una potencia de fuego que sobrepase toda imaginación."

# Defensa del viejo orden
 USA_old_team: "Defensores del Viejo Orden"
 USA_old_team_desc: "Mientras los seres del otro mundo establecían un nuevo orden en Europa, Estados Unidos resistió. Ahora, ha llegado la hora de liberar a los europeos — y a la humanidad — de su sufrimiento."

 USA_support_alies: "Apoyo a los Aliados"
 USA_support_alies_desc: "Inglaterra y Francia, exiliadas en sus colonias tras perder sus territorios, han unido fuerzas con el objetivo de reconquistar Europa. Debemos apoyarlas militarmente para allanar el camino a la liberación."

 USA_attack_COU: "Liberación de los Países Bajos"
 USA_attack_COU_desc: "Las tierras bajas son la única puerta viable para que EE.UU. entre a la Europa ocupada. Liberaremos a su pueblo oprimido y abriremos paso hacia el continente."

 USA_support_GEK: "Apoyo a Alemania"
 USA_support_GEK_desc: "Alemania ha sido dividida y masacrada en medio de la guerra entre dos fuerzas del otro mundo. Apoyaremos a los refugiados alemanes y prometemos liberar su tierra natal."

 USA_support_north_europe: "Apoyo al Norte de Europa"
 USA_support_north_europe_desc: "Noruega, Suecia y Dinamarca sufren bajo la invasión isekai y doctrinas radicales. Los ayudaremos en secreto, esperando la oportunidad para erradicar el azote rojo en Escandinavia."

 USA_attack_KAI: "Liberación del Reino Unido"
 USA_attack_KAI_desc: "Aunque el Reino Unido perdió su territorio, su espíritu de lucha perdura. Junto a ellos, derrotaremos a los invasores del otro mundo y restauraremos su patria."

 USA_attack_MIL: "Liberación de Francia"
 USA_attack_MIL_desc: "Los franceses, otrora defensores de la libertad y la igualdad, han sido reducidos a esclavos de máquinas sin alma. Liberémoslos y demostremos que la democracia aún vive."

 USA_attack_TRM: "Liberación de Alemania Oriental"
 USA_attack_TRM_desc: "Los nazis han traicionado a la humanidad colaborando con los invasores. ¡Es hora de hacer justicia!"

 USA_attack_GEH: "Liberación de Alemania Occidental"
 USA_attack_GEH_desc: "Los demonios transdimensionales han disparado contra civiles sin motivo alguno. Liberaremos a los alemanes de su tiranía y los expulsaremos completamente."

 USA_support_FIN: "Apoyo a Finlandia"
 USA_support_FIN_desc: "Finlandia logró recuperar su territorio de manos de los invasores isekai, pero su capacidad militar es limitada. Al apoyarlos, podremos usarlos como punto de apoyo para liberar toda Escandinavia."

 USA_attack_RED: "Liberación del Norte de Europa"
 USA_attack_RED_desc: "Tras una larga preparación, ha llegado el momento de liberar Escandinavia. ¡Luchemos contra la plaga roja y restauremos la democracia!"

 USA_old_team_guardian: "Declaración de Victoria"
 USA_old_team_guardian_desc: "Ha pasado mucho tiempo desde que comenzó la guerra total contra los invasores de otro mundo. A pesar de sus tácticas y tecnología, nuestra nación ha prevalecido. ¡Una vez más, Estados Unidos ha vencido a los tiranos que amenazaban la libertad!"

 USA_marshall_plan: "Plan Marshall"
 USA_marshall_plan_desc: "Aunque ganamos la guerra, Europa quedó devastada. Si no intervenimos, podrían surgir nuevos conflictos. El 'Plan Marshall', propuesto por George Marshall, restaurará económicamente a las naciones europeas."

 USA_attack_abyss: "La Guerra Final"
 USA_attack_abyss_desc: "Nuestro verdadero enemigo ha estado oculto todo este tiempo. La magnitud del horror que enfrentamos desafía toda lógica... pero debemos luchar."

 USA_Pax_Americana: "§CPax§! §tAmericana§!"
 USA_Pax_Americana_desc: "Tras incontables guerras y derramamiento de sangre, bajo el liderazgo de la gran América, el mundo ha sobrevivido a la invasión del otro mundo y ahora sana sus heridas. Ha llegado una nueva era: un orden mundial liderado no por imperios coloniales, sino por Estados Unidos.\n§C¡Pax§! §tAmericana!§!"
# Integración al Nuevo Orden
 USA_new_team: "Unirse al Nuevo Orden"
 USA_new_team_desc: "Los imperios europeos que dominaban el orden mundial con su poder colapsaron tras la Gran Transposición. Debemos forjar lazos amistosos con quienes destronaron el viejo orden y establecer uno nuevo.\n§RPor la causa mayor, lo sacrificaremos todo. ¿Te unirás a nosotros?§R"

 USA_new_team_TV: "Propaganda"
 USA_new_team_TV_desc: "Aún existen muchos escépticos sobre nuestra amistad con los seres del otro mundo. Con un poco de propaganda, podemos enfatizar los beneficios de esta alianza y ganarnos su apoyo."

 USA_new_team_marry: "Proyecto de Ley Interdimensional"
 USA_new_team_marry_desc: "Algunos isekai que cruzaron a EE.UU. viven en un limbo legal. Para protegerlos y prevenir futuros conflictos, es necesario promulgar una legislación especial que regule su estatus."

 USA_new_team_anime: "Proyección de Anime"
 USA_new_team_anime_desc: "Un video de Kisaki realizando gimnasia de alta intensidad se ha convertido en una sensación entre grandes y chicos. Para romper estereotipos sobre los seres del otro mundo, proyectaremos este video en todo el país."

 USA_new_team_civilwar: "Decisión Final"
 USA_new_team_civilwar_desc: "Ya hemos tomado decisiones difíciles por un futuro mejor. Ahora es el momento de actuar. Aunque todos nos llamen traidores a la humanidad, algún día sabrán que teníamos razón.\n§R¡Todo está listo. Es hora de lanzar los dados!§!"
 USA_new_team_civilwar_tt: "§R¡Estalla una guerra civil inmediatamente!§!"

 USA_new_team_threat: "Persuasión y Compromiso"
 USA_new_team_threat_desc: "Algunos miembros del Congreso aún se oponen a nuestra decisión. Debemos convencerlos de que el futuro que ofrece el Nuevo Orden es más prometedor."

 USA_new_team_help: "Solicitar Voluntarios del Nuevo Orden"
 USA_new_team_help_desc: "Nos apuntamos entre hermanos. Ahora es momento de que ellos muestren su sinceridad."

 USA_blue_kivotos: "Democracia del Nuevo Orden"
 USA_blue_kivotos_desc: "Entre los seres del otro mundo, existen sistemas políticos similares al nuestro. Si colaboramos con ellos, evitaremos fricciones ideológicas."

 USA_bad_kivotos: "Nacionalismo del Nuevo Orden"
 USA_bad_kivotos_desc: "Para unirnos al Nuevo Orden, quizá debamos abandonar nuestras propias creencias, incluso si estas han costado siglos de lucha y sangre."

 USA_blue_kivotos_MIL: "Seguir a Millennium"
 USA_blue_kivotos_MIL_desc: "Millennium Science School posee una tecnología sin comparación, incluso entre los isekai. Su alianza puede impulsar el avance tecnológico de Estados Unidos."

 USA_bad_kivotos_Eden: "Seguir el Tratado de Edén"
 USA_bad_kivotos_Eden_desc: "Dos naciones aparentemente irreconciliables se han unido. Esta alianza es la más fuerte del mundo isekai, y nos uniremos a ella para preservar nuestro poder nacional."

 USA_bad_kivotos_COU: "Seguir al Consejo Estudiantil"
 USA_bad_kivotos_COU_desc: "El Consejo Estudiantil fue la mayor autoridad entre las naciones del otro mundo. Apoyaremos su reconstrucción para ganar influencia entre otras academias."

 USA_bad_kivotos_GEM: "Seguir a Gehenna"
 USA_bad_kivotos_GEM_desc: "El mundo siempre ha seguido la ley del más fuerte. Gehenna lo entiende mejor que nadie. Unámonos a ellos."

 USA_bad_kivotos_TRM: "Seguir a Trinity"
 USA_bad_kivotos_TRM_desc: "Ellas, con su corazón noble y aspecto angelical, son el ejemplo del Nuevo Orden. Sigámoslas."

 USA_bad_kivotos_support_hina: "Apoyar a Hina"
 USA_bad_kivotos_support_hina_desc: "Cuanto más estudiamos a Gehenna, más decepcionados nos sentimos… excepto por el Comité Disciplinario. Sigamos a su líder, Hina."

 USA_bad_kivotos_support_makoto: "Apoyar a Makoto"
 USA_bad_kivotos_support_makoto_desc: "Makoto no es precisamente competente, pero tiene momentos de gran lucidez. Ha tomado el control frente a demonios anárquicos, y eso inspira confianza."

 USA_bad_kivotos_support_mika: "Apoyar a Mika"
 USA_bad_kivotos_support_mika_desc: "Mika es más emocional e inocente de lo que imaginábamos. Pero un corazón débil no significa fuerza débil. Sigámosla."

 USA_bad_kivotos_support_hina_2: "Consultar al Comité Disciplinario"
 USA_bad_kivotos_support_hina_2_desc: "No solo Hina es competente. El Comité puede ayudarnos a reconstruir nuestro país tras la guerra civil."

 USA_bad_kivotos_GEH_halo_infantry: "Entrenamiento Conjunto con el Comité Disciplinario"
 USA_bad_kivotos_GEH_halo_infantry_desc: "El Comité Disciplinario ha entrenado al punto de equipararse con el Ejército de EE.UU. El entrenamiento conjunto será provechoso para ambos."

 USA_bad_kivotos_GEM_tank: "Adoptar Tanques Pesados de Gehenna"
 USA_bad_kivotos_GEM_tank_desc: "Los tanques pesados de Gehenna, como el Toramaru, son dignos de ser replicados. Rediseñemos nuestra doctrina blindada tomando ejemplo de ellos."

 USA_bad_kivotos_GEM_halo_infantry: "Ejercicios Combinados con Gehenna"
 USA_bad_kivotos_GEM_halo_infantry_desc: "Aunque carecen de superhumanos, la tecnología militar de Gehenna es excelente. Aprovechémosla para reformar nuestras fuerzas."

 USA_bad_kivotos_support_iroha: "Apoyar a Iroha"
 USA_bad_kivotos_support_iroha_desc: "Iroha es una de las pocas personas sensatas en Hyakkiyako. Si seguimos sus consejos, superaremos las secuelas de la guerra."

 USA_bad_kivotos_support_ibuki: "Invitar a Ibuki"
 USA_bad_kivotos_support_ibuki_desc: "¿Existe alguien más adorable que ella? Su sola presencia será un pilar para el pueblo estadounidense."

 USA_bad_kivotos_support_GEM_club: "Crear Lobby de Clubes"
 USA_bad_kivotos_support_GEM_club_desc: "Pese a su reputación, los clubes de Gehenna tienen talento. Apoyémoslos con una red de lobbies para que den lo mejor de sí."

 USA_bad_kivotos_totalwar: "Declarar Guerra Total"
 USA_bad_kivotos_totalwar_desc: "Abandonemos el viejo orden y comprometámonos con el nuevo. No de palabra, sino con acción. Todos deben participar."

 USA_bad_kivotos_support_TRM_club: "Cooperar con el Club de Lectura"
 USA_bad_kivotos_support_TRM_club_desc: "El club de lectura de Trinity es extenso y riguroso. Al firmar un tratado oficial, compartiremos su vasto conocimiento."

 USA_bad_kivotos_TRM_halo_infantry: "Ejercicio Conjunto con Trinity"
 USA_bad_kivotos_TRM_halo_infantry_desc: "Aunque pacíficas, las estudiantes de Trinity tienen gran capacidad militar. Nos enfocaremos en su superioridad en apoyo aliadas para realizar maniobras conjuntas."

 USA_bad_kivotos_justice: "Colaborar con el Departamento de Justicia"
 USA_bad_kivotos_justice_desc: "El Departamento de Justicia es una unidad de policía autónoma con gran poder. Si colaboramos con ellas, erradicaremos las fuerzas antinacionales."

 USA_bad_kivotos_justice_sword: "La Espada de Trinity"
 USA_bad_kivotos_justice_sword_desc: "Convertámonos en la espada de Trinity. Eliminemos toda amenaza contra su orden."

 USA_bad_kivotos_halo_infantry_2: "‘El Tercer Camino’"
 USA_bad_kivotos_halo_infantry_2_desc: "Combinemos la tecnología del Nuevo Orden con nuestras experiencias. Nadie ha tomado este camino… pero nosotros sí."

 USA_bad_kivotos_GEH_hina_learn: "Invitar a Hina a West Point"
 USA_bad_kivotos_GEH_hina_learn_desc: "El Comité Disciplinario se sostiene, en esencia, por Hina. Invitémosla a nuestra academia militar para desarrollar sus dotes como comandante."

 USA_bad_kivotos_GEH_halo_infantry_support: "Entrenar al Comité Disciplinario"
 USA_bad_kivotos_GEH_halo_infantry_support_desc: "El rendimiento del Comité es inferior a lo esperado. Instruyámoslas en táctica y entrenamiento físico."

 USA_blue_kivotos_MIL2: "Acuerdo de Guarnición EE.UU.-Millennium"
 USA_blue_kivotos_MIL2_desc: "Vamos a exterminar a los insurgentes rojos que les dan tantos problemas."

 USA_blue_kivotos_MIL3: "Convenio de Investigación EE.UU.-Millennium"
 USA_blue_kivotos_MIL3_desc: "Su tecnología parece sacada de un cuento de magia."

 USA_blue_kivotos_MIL3_halo: "Investigar lo Desconocido"
 USA_blue_kivotos_MIL3_halo_desc: "Una oportunidad para investigar los misterios de los isekai y su repentina aparición."

 USA_blue_kivotos_MIL3_rocket: "Desarrollar Satélites"
 USA_blue_kivotos_MIL3_rocket_desc: "¿Te has imaginado dejar una huella humana en ese cielo que antes solo podías mirar desde lejos?"

 USA_bad_kivotos_halo_infantry_division: "Estudiar a la Infantería Halo"
 USA_bad_kivotos_halo_infantry_division_desc: "Nuestros cañones parecen fuegos artificiales, nuestros tanques chatarra. En el futuro, los soldados halo dominarán el campo de batalla."

 USA_bad_kivotos_support_Mika: "Apoyar a Mika"
 USA_bad_kivotos_support_Mika_desc: "Debemos convertirnos en los caballeros que protegen a esta casi-angelical figura."

 USA_bad_kivotos_Mika_fanclub: "Formar la Guardia de Mika"
 USA_bad_kivotos_Mika_fanclub_desc: "Seguir sus órdenes sin dudar, remover todos los obstáculos. Esa es nuestra misión."

 USA_support_brazil: "Apoyar a Sudamérica"
 USA_support_brazil_desc: "Con la alquimia de Brasil, el Nuevo Orden caerá fácilmente."

 USA_support_spain: "Apoyar la Península Ibérica"
 USA_support_spain_desc: "La península ibérica es clave estratégicamente. Si logramos que se unan, más naciones se sumarán a nuestra liga internacional."

 USA_support_ITA: "Apoyar a Italia"
 USA_support_ITA_desc: "Italia es el único poder verdadero que queda en Europa. Debemos unirnos a ellos."

 USA_attack_SHA: "Liberar Europa Central"
 USA_attack_SHA_desc: "Todavía quedan invasores del otro mundo en Europa Central. Tenemos el deber de liberar incluso a la más débil de las naciones."

