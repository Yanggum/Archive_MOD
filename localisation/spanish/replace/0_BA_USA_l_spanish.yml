 USA_2nd_great_depression: "Nueva Crisis Económica..."
 USA_2nd_great_depression_desc: "Los invasores de otro mundo han borrado completamente el mercado europeo. Aunque aún no ha llegado a nosotros, sabemos qué pasa cuando una tormenta golpea a un gigante tambaleante.\n\nNadie parece tener una solución..." 

 USA_2nd_great_depression_activated_categorie: "Inicio de la Segunda Gran Depresión"
 USA_2nd_great_depression_activated_categorie_desc: "La tormenta ha llegado al Nuevo Mundo. El gigante ha caído. Ha comenzado la Segunda Gran Depresión." 

 USA_2nd_great_depression_1st: "¿Se Acerca una Crisis Económica?"

