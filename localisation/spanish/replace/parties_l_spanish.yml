 japanese_fascism: "Militares japoneses"
 japanese_fascism_desc: "Tras el Incidente de Manchuria, los militares emergieron como la verdadera fuerza gobernante de Japón. Apoyados en un poder militar abrumador, dominaron al gabinete y a las fuerzas políticas, dirigiendo todas las decisiones clave del Estado."

 imperial_rule_assistance_association: "Asociación de Asistencia al Régimen Imperial"
 imperial_rule_assistance_association_desc: "La Asociación de Asistencia al Régimen Imperial es un partido fundado por Konoe Fumimaro como parte del Movimiento del Nuevo Orden. Creada para materializar los ideales de Konoe Fumimaro, se ha convertido en el único partido político de Japón, formando una gigantesca estructura política."

 imperial_rule_assistance_association_neutrality: "Asociación de Asistencia al Régimen Imperial"
 imperial_rule_assistance_association_neutrality_desc: "La Asociación de Asistencia al Régimen Imperial fue creada por Konoe Fumimaro para liberarse del control del ejército. Aunque el Movimiento del Nuevo Orden obtuvo inicialmente ciertos logros, fracasó debido a la presión militar, y actualmente se ha convertido en un partido meramente nominal que respalda y legitima la línea del ejército."

 decagramaton_neutrality: "Ideología del Decagrammatón"
 decagramaton_neutrality_desc: "El Decagrammatón es un sistema de inteligencia artificial que se proclama a sí mismo como un buscador sagrado. Esta ideología singular, formada por inteligencias artificiales 'iluminadas' por el Decagrammatón y profetas que lo siguen, ha sido demostrada, analizada y reproducida, y actúa con el objetivo de propiciar la llegada de un nuevo dios, concentrándose en la demostración de su propia existencia."

