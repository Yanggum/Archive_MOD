 l_spanish:
 stalinism:0 "Estalinismo"
 stalinism_desc:0 "Una forma de gobierno que aplica y desarrolla las políticas del marxismo-leninismo. El estalinismo defiende no solo la necesidad de un Estado socialista fuerte y autoritario capaz de purgar los elementos contrarrevolucionarios, sino también el socialismo en un solo país, es decir, la construcción del socialismo dentro de un único Estado."

 trotskyism:0 "Trotskismo"
 trotskyism_desc:0 "Una forma de gobierno que aplica y desarrolla las políticas del marxismo-leninismo. El trotskismo defiende no solo la necesidad de un partido de vanguardia fuerte para purgar los elementos contrarrevolucionarios, sino también la revolución permanente para derrocar a los Estados capitalistas antes de que el Estado obrero quede aislado por los embargos de las potencias capitalistas."

