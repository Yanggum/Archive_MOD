 l_spanish:
  LOADING_TIP_0:0 "Bienvenido, profesor. Hoy también confío en usted.\n- Sunaookami Shiroko"
  LOADING_TIP_1:0 "¿Dónde será un buen lugar para echarme una siesta~\n- Takanashi Hoshino"
  LOADING_TIP_2:0 "Soy Kuromi Serika. Te lo advierto: mientras esté contigo, debes hacerlo bien, ¿eh?\n- Kuromi Serika"
  LOADING_TIP_3:0 "¡Que tengas un gran día también hoy, profesor~! Déjame encargarme de todo lo que necesites.\n- Izayoi Nonomi"
  LOADING_TIP_4:0 "Si es sobre el horario, yo también lo comprobaré.\n- Okusora Ayane"
  LOADING_TIP_5:0 "¿Lo ves, profesor? Esto es estar en otra liga.\n- Rikuhachima Aru"
  LOADING_TIP_6:0 "¡Tarán! ¡Al fin aparezco! Ahora vamos a divertirnos, profesor!\n- Asagi Mutsuki"
  LOADING_TIP_7:0 "Está bien no tener ataduras ni sufrir heridas, pero aun así la soledad pesa...\n- Onikata Kayoko"
  LOADING_TIP_8:0 "¿Puedo acompañarte? Si crees que no sirvo para nada, dímelo cuando quieras...\n- Igusa Haruka"
  LOADING_TIP_9:0 "¡Feliz Año Nuevo, profesor..! Gracias por llamarme a propósito... ¡Lo siento!! ...¡Ah?! G-gracias!\n- Igusa Haruka"
  LOADING_TIP_10:0 "E-eh... ¿realmente me llamaste a mí? ¿No estarás confundido?\n- Igusa Haruka"
  LOADING_TIP_11:0 "Jefa del comité disciplinario, Hinada. Ya sabes mi nombre... estoy a tus órdenes.\n- Sorasaki Hina"
  LOADING_TIP_12:0 "Ugh... ugh, ¿que me duele? ¡Un miembro del comité disciplinario de Gehenna no debería estar sufriendo tanto!\n- Shiromi Iori"
  LOADING_TIP_13:0 "Si lo estás pasando mal, dímelo. Cuidarte también es mi función.\n- Amaou Ako"
  LOADING_TIP_14:0 "Bienvenido al club de investigación culinaria. ¿Nos embarcamos en una aventura para descubrir el sabor definitivo?\n- Kurodate Haruna"
  LOADING_TIP_15:0 "¿¡Qué?! ¡Un momento! ¡Esto no es lo que acordamos! ¿¡Un paseo!? ¿¡Estás en tus cabales!? ¿¡Así, sin más!?\n- Amaou Ako"
  LOADING_TIP_16:0 "Soy Fuuka del abastecimiento. Si hay algún plato que desees, dímelo cuando quieras.\n- Aikiyo Fuuka"
  LOADING_TIP_17:0 "Haah, ¿cómo he terminado así? Bueno, ya que es así, haré lo que deba.\n- Natsume Iroha"
  LOADING_TIP_18:0 "¿Cadáver... no, perdón, dónde están los heridos?\n- Himuro Sena"
  LOADING_TIP_19:0 "¿Obstáculo? ¡Encárgate de ellos, déjamelo a mí!\n- Shimokura Megu"
  LOADING_TIP_20:0 "¡Pro-fe-sor~ un esfuerzo más, por favor!\n- Hayase Yuuka"
  LOADING_TIP_21:0 "¿Te gustaría adentrarte en el mundo de la razón y la lógica conmigo?\n- Ushio Noa"
  LOADING_TIP_22:0 "¡Hagamos el mundo más divertido!\n- Konuri Maki"
  LOADING_TIP_23:0 "Bienvenido, profesor. Llegaste aproximadamente 43 segundos antes de lo previsto.\n- Omagari Hare"
  LOADING_TIP_24:0 "Jeje, ¿es el turno de la supergenio y delicada hacker de Millennium para brillar?\n- Akeboshi Himari"
  LOADING_TIP_25:0 "Amy del Departamento Especial de Fenómenos Sobrenaturales. En espera.\n- Izumimoto Eimi"
  LOADING_TIP_26:0 "¿Ah? ¿Me estás bromeando?\n- Mikamo Neru"
  LOADING_TIP_27:0 "¡Juju! ¡Sabía que me necesitabas!\n- Ichinose Asuna"
  LOADING_TIP_28:0 "Mi amo es Millennium por defecto, pero hoy... tú eres mi maestro.\n- Kakudate Karin"
  LOADING_TIP_29:0 "§S¡Luz!§!\n- Tendo Arisu"
  LOADING_TIP_30:0 "¡Desde ahora, comienza una historia superdivertida!\n- Saiba Momoi"
  LOADING_TIP_31:0 "Te ayudaré con la mejor jugada, profesor.\n- Saiba Midori"
  LOADING_TIP_32:0 "Jefa del depto. de desarrollo de juegos... soy Yuzu. Realmente... ¿podrías llevarme contigo?\n- Hanaoka Yuzu"
  LOADING_TIP_33:0 "Supe que llegaría este momento y lo esperé. El instante en que dijeras mi nombre... justo ahora.\n- Nekotsuka Hibiki"
  LOADING_TIP_34:0 "Jajaja... aunque sea insuficiente... por favor, cuida de mí.\n- Ajitani Hifumi"
  LOADING_TIP_35:0 "Soy Urawa Hanako. Cuento con tu apoyo en muchos aspectos de ahora en adelante. ...Sí, 'en muchos aspectos'.\n- Urawa Hanako"
  LOADING_TIP_36:0 "Si todo es en vano, ¿por qué seguimos vivos...?\n- Shirasu Azusa"
  LOADING_TIP_37:0 "¡Los objetos impuros serán incinerados, incinerados!\n- Shimoe Koharu"
  LOADING_TIP_38:0 "Krhéhéhé...\n- Kenzaki Tsurugi"
  LOADING_TIP_39:0 "Hasumi Hanekawa del Departamento de Realización de la Justicia. Espero tus órdenes, profesor.\n- Hanekawa Hasumi"
  LOADING_TIP_40:0 "¿Alguna vez has reflexionado sobre el shortcake? Profesor.\n- Yutori Natsu"
  LOADING_TIP_41:0 "¡No me subestimes por ser pequeña! ¡Mi capacidad es inmensa!\n- Ibaragi Yoshimi"
  LOADING_TIP_42:0 "Espero que tengas un día solemne y sagrado.\n- Iochi Mari"
  LOADING_TIP_43:0 "Cada uno de tus movimientos... siempre los observo.\n- Utazumi Sakurako"
  LOADING_TIP_44:0 "...¿Estás en paz? Te saludo en nombre de Trinity.\n- Kirifuji Nagisa"
  LOADING_TIP_45:0 "¡Sí! ¿Has esperado mucho? Ahora es mi turno de brillar £GFX_BA_star\n- Misono Mika"
  LOADING_TIP_46:0 "Aquí es como §Paparece la mente maestra§!£GFX_BA_star ¡Sí! Soy la materialización de todos mis planes.\n- £GFX_BA_mika"
  LOADING_TIP_47:0 "P-p-por favor... guarda silencio...\n- Kojeki Ui"
  LOADING_TIP_48:0 "Soy Mine Aomori, líder de la Orden de Caballeros de Socorro. ¿Quién necesita ayuda?\n- Aomori Mine"
  LOADING_TIP_49:0 "Bueno, lo importante es tu estado de ánimo. ¡Gracias a ti, Serena está muy feliz!\n- Sumi Serina"
  LOADING_TIP_50:0 "Buen trabajo, profesor. ¿Puedo ir a dormir ahora?\n- Kasuga Tsubaki"
  LOADING_TIP_51:0 "Aunque mi cuerpo aún no es suficiente... te mostraré los resultados de mi entrenamiento.\n- Mizuha Mimori"
  LOADING_TIP_52:0 "¡Justo en los momentos críticos, con energía! ¡Aquí aparezco!\n- Isami Kaede"
  LOADING_TIP_53:0 "¡Ah, bienvenido, profesor! Miau miau... Sí, eso estuvo perfecto.\n- Kawawa Shizuko"
  LOADING_TIP_54:0 "Profesor, he escrito un haiku... ¿quieres escucharlo?\n- Waraku Chise"
  LOADING_TIP_55:0 "Ah... ¡por fin te he conocido!\n- Kosaka Wakamo"
  LOADING_TIP_56:0 "¡Izuna, me esforzaré! Nin nin!\n- Kuda Izuna"
  LOADING_TIP_57:0 "¿Has estado esperando en silencio? Eres un buen chico~\n- Sunohara Shun"
  LOADING_TIP_58:0 "Si alguna vez tengo que comer zanahoria... la próxima vez vendré aquí.\n- Sunohara Kokona"
  LOADING_TIP_59:0 "¡El honor de enfrentar la más alta autoridad!\n- Renkawa Cherino"
  LOADING_TIP_60:0 "¡Por la presidenta Cherino, y para la presidenta Cherino!\n- Sashiro Tomoe"
  LOADING_TIP_61:0 "¡Huir no sirve de nada!\n- Ikekura Marina"
  LOADING_TIP_62:0 "Juju... ¡no importa cuántas veces mire tu rostro, profesor, nunca me canso!\n- Amami Nodoka"
  LOADING_TIP_63:0 "Es hora de mezclar bebidas y cambiar vidas.\n- Mayoi Shigure"
  LOADING_TIP_64:0 "¡Soy un trabajador de Kibotos, uníos!\n- Yasumori Minori"
  LOADING_TIP_65:0 "Quiero ser aún más... de ayuda para los estudiantes de Kibotos.\n- Nakatsukasa Kirino"
  LOADING_TIP_66:0 "Un momento, disculpa~ es hora de las donas~\n- Nemugaki Fubuki"
  LOADING_TIP_67:0 "Te he estado esperando, profesor. Si necesitas el poder de la Agencia de Seguridad Pública, avísame.\n- Ogata Kanna"
  LOADING_TIP_68:0 "RABBIT 1. Iniciando operación.\n- Tsukiyuki Miyako"
  LOADING_TIP_69:0 "Indicativo RABBIT 2. Señal en buen estado.\n- Sorai Saki"
  LOADING_TIP_70:0 "Aquí RABBIT 3. ¿Dónde es el próximo punto de bombardeo?\n- Kazekura Moe"
  LOADING_TIP_71:0 "Eh, aquí RABBIT 4. ¿M-me estaban llamando...?\n- Kasumizawa Miyu"
  LOADING_TIP_72:0 "Sigo perdido en el camino, pero algún día...\n- Jomae Saori"
  LOADING_TIP_73:0 "Ojalá florecieran muchas flores en este sendero también.\n- Hakari Atsuko"
  LOADING_TIP_74:0 "En ese gigantesco vacío no hay respuestas.\n- Imashino Misaki"
  LOADING_TIP_75:0 "La vida es una sucesión de sufrimientos...\n- Tsuchinaga Hiyori"
  LOADING_TIP_76:0 "He estado esperando. Profesor.\n- Nanagami Rin"
  LOADING_TIP_77:0 "Fufu, te estuve esperando.\n- Yuragi Momoka"
  LOADING_TIP_78:0 "Impresionante... ¿has resuelto esto también?\n- Iwabitsu Ayumu"
  LOADING_TIP_79:0 "¡Profesor! Es hora de empezar tus tareas. ¡Arona te ayudará a tu lado!\n- Arona"
  LOADING_TIP_80:0 "...Primero definamos las cosas con claridad. No deseamos enfrentarnos a ti. De hecho, queremos colaborar.\n- ?? ??"
  LOADING_TIP_81:0 "Consejo: esta es la ventana de consejos.\n- BA Mode Gaebaljin"
 LOADING_TIP_82:0 "El mundo está lleno de magia. Sí, igual que este encuentro.\n- Shirao Eri"
 LOADING_TIP_83:0 "La música es algo que basta con compartir el mismo espacio.\n- Shiina Tsumugi"
 LOADING_TIP_84:0 "...Je, je, qué interesante. También lo esperaré con ganas la próxima vez. Como miembro del consejo del dormitorio y como el Fantasma de la Benevolencia.\n- Kiyosumi Akira"
 LOADING_TIP_85:0 "Te protegeré. Igual que lo hice en mi vida pasada...\n- Itagaki Kanoe"
 LOADING_TIP_86:0 "Life is disaster.\n- Utsumi Aoba"
 LOADING_TIP_87:0 "Aunque exista el sistema de conducción automática, casi no lo uso. Porque no tiene gracia, ¿no? Conducir tiene que ser con mis propias manos.\n- Tachibana Nozomi"
 LOADING_TIP_88:0 "Academia Ferroviaria Highlander – Tachibana Hikari, entre otros – directora –\n- Tachibana Hikari"
 LOADING_TIP_89:0 "No se preocupe. Usted no morirá. No permitiré que eso ocurra. Quien debe desaparecer no es el héroe, sino la herramienta que destruye el mundo.\n- Kei"
 LOADING_TIP_90:0 "Soy una voluntad creada bajo una bandera, y un peregrino de un reino que ha llegado al fin del mundo. El nombre que yo mismo daré como prueba de mi existencia es Malchut.\n- Malchut"
 LOADING_TIP_91:0 "¡Gñaaaaarrr!\n- El león de un cuerno más fuerte"
