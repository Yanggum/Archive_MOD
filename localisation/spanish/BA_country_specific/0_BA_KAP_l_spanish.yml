l_spanish:
#중점 제목 및 내용
  KAP_strengthen_the_central_secretariat:0 "Evaluar la situación actual"
  KAP_strengthen_the_central_secretariat_desc:0 "En 1936 el fenómeno conocido como la Gran Traslación engulló la Ciudad Académica y la arrojó a un mundo ajeno llamado Tierra. Debemos comprender lo antes posible lo que ocurre aquí."
  KAP_marxist_orthodoxy:0 "Aceptar la propuesta de Koito"
  KAP_marxist_orthodoxy_desc:0 "Un día, una estudiante de Shingikan llegó al campamento provisional del internado Yuno-oka. Era Ashiharatsumori Koito, elegida representante de Shingikan tras la Traslación. Sostiene que debemos solicitar ayuda inmediata a las potencias cercanas, aun a costa de renunciar a nuestro sistema. Su razonamiento convence a Kohane, que decide estrechar su mano y confiar en la opinión de los alumnos."
  KAP_soviet_leadership:0 "Una respuesta de ultramar"
  KAP_soviet_leadership_desc:0 "Koito no estaba equivocada. Ha llegado contestación desde el país llamado «Japón», al otro lado del mar. Quieren aliarse con nosotros para enfrentarse a las nuevas potencias venidas de otros mundos. No sabemos quiénes son realmente, pero gracias a su oferta quizá superemos la crisis."
  KAP_soviet_economic_aid:0 "Ayuda económica japonesa"
  KAP_soviet_economic_aid_desc:0 "Por fin han llegado los suministros que pedimos a Japón. Los estudiantes aclaman al forastero Hirohito y, con esta base, podremos prepararnos para la amenaza que se avecina."
  KAP_internationalism:0 "Unidos a ellos"
  KAP_internationalism_desc:0 "Japón nos comunica que desea luchar codo con codo en la misma alianza. El entusiasmo estudiantil es incontenible, y el acuerdo se sella en un abrir y cerrar de ojos. Ya no estamos solos en este mundo."
  KAP_agrarian_socialism:0 "La postura de Kohane"
  KAP_agrarian_socialism_desc:0 "La Ciudad Académica se halla sumida en el caos. En medio de esta penuria, Kohane —acostumbrada a la vida rural sin lujos— mantiene la serenidad y anima a los estudiantes. Afirma que solo la unidad total superará la crisis, y todos, necesitados de un líder, siguen sus pasos."
  KAP_rectification_campaign:0 "Movimiento estudiantil"
  KAP_rectification_campaign_desc:0 "Bajo una sola líder, los alumnos se organizan para resolver los problemas. Kohane siente —sin saber por qué— que el futuro se ilumina."
  KAP_maoism:0 "Kohane, la chica que soñaba"
  KAP_maoism_desc:0 "Gracias a la unidad, los días gloriosos de la Ciudad Académica resurgen poco a poco. Sin distinción de origen ni rango, todos actúan como uno. Kohane vuelve a soñar con la vida urbana que anhelaba."
  KAP_socialism_with_KAPnese_characteristics:1 "Unidad de la Ciudad Académica"
  KAP_socialism_with_KAPnese_characteristics_desc:1 "Ya no hay divisiones: una sola academia y un solo objetivo. Reunidos bajo el nombre del ferrocarril que nos enlazaba, blandimos la espada para restaurar la gloria de Kapila. ¡Nada podrá separarnos!"
  KAP_proclaim_the_peoples_republic:0 "Ciudad Académica de Kapila"
  KAP_proclaim_the_peoples_republic_desc:0 "Por fin se han disipado todas las amenazas. Kapila se alza de nuevo y se presenta al mundo con orgullo. ¡Que la luz del halo brille eternamente!"
  KAP_socialist_market_economy:0 "Halo radiante, filo fulgurante"
  KAP_socialist_market_economy_desc:0 "Cuando la luz del halo haga centellear la espada, avanzaremos sin temor."
  KAP_social_democracy:0 "La solución de Kaoru"
  KAP_social_democracy_desc:0 "Kaoru, del internado Manyoshu, descubre tras la Traslación que no hay rastro de los alumnos del internado Uranotsukasa. Averigua que, en la vecina China, esos estudiantes han tomado el poder tras negociar con los forasteros. Decidida, Kaoru parte para convencer a Uranotsukasa."
  KAP_coalition_government:0 "Gobierno académico"
  KAP_coalition_government_desc:0 "Kaoru logra conferenciar con Kuzunoha Rei, representante de Uranotsukasa. También ellos sufren el caos y temen una guerra inminente, según rumores locales. Para asegurar nuestra posición y prepararnos ante el peligro, iniciamos una persuasión paciente."
  KAP_purge_the_radicals:0 "Discurso a los estudiantes"
  KAP_purge_the_radicals_desc:0 "Anunciamos la cooperación con Uranotsukasa para ganar el apoyo estudiantil. Las academias se unen, la confusión disminuye y todos trabajan por el futuro."
  KAP_strengthen_the_left_wing_of_the_kmt:0 "La mano invisible de Kaoru"
  KAP_strengthen_the_left_wing_of_the_kmt_desc:0 "Mientras coopera con Uranotsukasa, Kaoru mueve hilos discretamente para granjearse simpatías dentro de China."
  KAP_remove_KAPang_kai_shek:0 "Renuncia de Rei"
  KAP_remove_KAPang_kai_shek_desc:0 "Kuzunoha Rei pierde apoyo frente a Kaoru tanto en China como en el gobierno académico. Renuncia a su régimen y busca unirse a nuestra alianza. El momento de la unión total está cerca."
  KAP_literacy_programs:0 "Reanudación de clases"
  KAP_literacy_programs_desc:0 "Aunque las circunstancias son duras, suspender el aprendizaje llevaría a una regresión imperdonable. Por el futuro, debemos volver a estudiar."
  KAP_land_redistribution:0 "Comenzar la reorganización"
  KAP_land_redistribution_desc:0 "La calamidad repentina ha sembrado la confusión. Necesitamos tiempo para decidir qué es prioritario."
  KAP_KAPna_medical_university:0 "Formación avanzada"
  KAP_KAPna_medical_university_desc:0 "Con recursos disponibles, ha llegado el momento de ampliar horizontes y saciar nuestra sed infinita de conocimiento."
  KAP_form_the_academy_of_sciences:0 "¡Ahora sí lo entiendo!"
  KAP_form_the_academy_of_sciences_desc:0 "¡Maldita sea, Kohane, ahora sí que lo entiendo todo!"
  KAP_enforce_the_three_rules:0 "Apagar la ansiedad"
  KAP_enforce_the_three_rules_desc:0 "¿Quién puede mantener la calma en semejante caos? Si no los tranquilizamos nosotros, el fuego nunca se apagará."
  KAP_permit_opium_trade:0 "El látigo de la persuasión"
  KAP_permit_opium_trade_desc:0 "A veces se necesitan métodos duros para convencer."
  KAP_ban_the_opium_trade:0 "La zanahoria de la unión"
  KAP_ban_the_opium_trade_desc:0 "Para alcanzar la unidad perfecta, además de la lógica, hace falta una pequeña recompensa."
  KAP_abolish_the_land_rent:0 "Nuestra conclusión"
  KAP_abolish_the_land_rent_desc:0 "Aunque vivamos en residencias distintas, todos somos de Kapila. Somos compañeros que ansían aprender, cueste lo que cueste."
  KAP_the_yanan_base_area:0 "Preparar infraestructuras"
  KAP_the_yanan_base_area_desc:0 "Aunque esta tierra es desconocida, necesitamos un lugar donde vivir y trabajar mientras permanezcamos aquí."
  KAP_focus_on_KAPna:0 "Escuchar al mundo"
  KAP_focus_on_KAPna_desc:0 "Los recursos escasean y no vemos un suministro claro. Tal vez, si tratamos con los habitantes locales, la tarea sea más sencilla."
  KAP_exploit_the_weak_neighbours:0 "Estudiar modelos económicos"
  KAP_exploit_the_weak_neighbours_desc:0 "Nuestro sistema de comercio está anticuado y cerrado. Debemos inspirarnos en las prácticas de este mundo para lograr mayor eficiencia."
  KAP_infiltration:0 "Seguir la tendencia"
  KAP_infiltration_desc:0 "Tras conversar con la gente de aquí, descubrimos que todo el país está inmerso en luchas decisivas. Detestaríamos quedarnos fuera de moda."
  KAP_prepare_for_war_with_japan:0 "Reafilar las espadas"
  KAP_prepare_for_war_with_japan_desc:0 "Tanta reflexión ha embotado nuestras hojas. Ha llegado la hora de afilarlas de nuevo."
  KAP_government_of_national_defense:0 "Corcel de acero"
  KAP_government_of_national_defense_desc:0 "La población local utiliza diversos vehículos. Nosotros tampoco podemos seguir a pie eternamente."

  KAP_confrontation_with_the_warlords:0 "Mil pétalos en el cielo"
  KAP_confrontation_with_the_warlords_desc:0 "Un día divisamos un ave metálica desconocida. Según las pesquisas, es un «avión» con el que dominan los cielos. Si pudiéramos construir uno, sería fabuloso."
# Easter Egg del Proyecto VK
 KAP_central_security_bureau:0 "Una atracción inexplicable"
 KAP_central_security_bureau_desc:0 "Habéis fracasado..."
 KAP_revolutionary_military_commission:0 "Corte del sueño tipo I"
 KAP_revolutionary_military_commission_desc:0 "Cada vez que salimos a interactuar cerca del mar, solemos ver sobre la superficie del agua estructuras desconocidas, cargadas de personas y mercancías.\n¿Será que por fin es posible disfrutar del ocio sobre el agua?"
 KAP_central_military_commission:0 "Prácticas de campo"
 KAP_central_military_commission_desc:0 "Ya no basta con observar desde lejos.\nEs hora de aprender, dominar y aplicar directamente la tecnología de este lugar."
 KAP_peoples_liberation_army:0 "Trabajo individual"
 KAP_peoples_liberation_army_desc:0 "Aunque una vez seguimos sus pasos, ahora nuestro ritmo ya no coincide con el de ellos."
 KAP_peoples_volunteer_army:0 "Trabajo en equipo"
 KAP_peoples_volunteer_army_desc:0 "La gente de aquí tiene muchísimo de lo que aprender.\nAdemás, nos parecemos bastante; parece que podríamos ser un gran dúo."
 KAP_anti_japanese_expedition:0 "Un arma nueva"
 KAP_anti_japanese_expedition_desc:0 "¿Que con solo mover un dedo alguien puede morir...?\nLas armas de fuego son cobardes, pero increíblemente poderosas..."
 KAP_provoke_japan:0 "La era de la gran pólvora"
 KAP_provoke_japan_desc:0 "Mano de obra, materiales, empresas... un hombre que una vez extorsionó todo lo que existía en este mundo: el Rey de la Extorsión, Bakku Byunglim.\nAntes de morir, dejó estas palabras que enviaron a todo el mundo directo a Pixiv:\n\"¿Mi tesoro? Si lo quieres, te lo daré.\nBúscalo. Dejé todos los futa del mundo allí.\"\nAsí, el mundo entra en la Gran Era del Futa."
 KAP_protracted_warfare:0 "Estrategia contra proyectiles"
 KAP_protracted_warfare_desc:0 "Si no se puede esquivar, solo queda cortar.\nNi siquiera las balas pueden engañar a nuestros ojos."
 KAP_peoples_war:0 "Tanque humano"
 KAP_peoples_war_desc:0 "A menudo se dice que la pluma es más fuerte que la espada,\npero quienes lo comprobaron con la espada ya abandonaron este mundo,\ny por eso no queda nadie que lo refute."
 KAP_mobile_warfare:0 "El estruendo que hace temblar la tierra"
 KAP_mobile_warfare_desc:0 "Es un arma nueva que supera con creces el poder de las armas de fuego.\nCon esta potencia, ni siquiera una espada podría detenerla."
 KAP_100_regiments_campaign:0 "Agencia Ferroviaria Nayuta Nº7"
 KAP_100_regiments_campaign_desc:0 "Hemos restaurado la agencia ferroviaria que una vez se encargaba de llevarnos a la escuela.\nPero ahora trabajará para asegurar nuestra victoria."

