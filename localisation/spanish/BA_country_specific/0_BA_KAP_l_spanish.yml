 KAP_ame: "Ame"
 KAP_AME_DESC: "Una chica de origen desconocido llegada con la Tercera Gran Transición.\nPasa la mayor parte de su día rodando por el suelo jugando con un peluche de foca y videojuegos.\nLe encantan los juegos, pero por falta de experiencia su habilidad es desastrosa, quedando siempre en el fondo sin importar qué juegue.\nAun así, su competencia general es incuestionable: puede manejar cualquier cosa,\ndesde drones holográficos hasta hackeos, e incluso molestar a su amiga de la infancia, E□□."

