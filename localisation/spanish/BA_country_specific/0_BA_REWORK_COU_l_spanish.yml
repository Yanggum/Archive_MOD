 COU_COU_division_of_military:0 "El verdadero soberano de la Sanctum Tower"
 COU_COU_division_of_military_desc:0 "Una organización llamada \"SCHALE\", que se presume fue creada por la Presidenta del Consejo General ahora desaparecida, nos notificó que ejecutará un protocolo contra nosotros. Desde entonces, SCHALE está absorbiendo gradualmente nuestras fuerzas armadas usando la autoridad y la legitimidad que dice poseer.\n\nDebemos investigar estos movimientos y responder a ellos."

 SHE_COU_division_of_military:0 "La resistencia de la Sanctum Tower"
 SHE_COU_division_of_military_desc:0 "Como el Consejo General está interfiriendo y rechazando nuestros protocolos, ha comenzado a restringir la influencia del Consejo sobre nosotros.\n\nPor orden de la Presidenta del Consejo General, debemos aplastar la resistencia del Consejo General y asumir el control."

