 #총학생회 이벤트 - 시작
 COU_start_event.100.t:0 "¿Una nueva historia...?"
 COU_start_event.100.desc:0 "\"¡Hola, Sensei!\"\n\n(Enciende la Caja de Sídim.)\n\n\"¡Bienvenido al 'Mod de Blue Archive', Sensei! Ah, antes de eso, ¡aquí hay una carta! Creo que sería buena idea que la leas.\""
 COU_start_event.100.a:0 "(Leer la carta.)"
 COU_start_event.100.b:0 "¡Estamos en multijugador! ¡Estoy ocupado!"

 COU_start_event.101.t:0 "Para Sensei."
 COU_start_event.101.desc:0 "\"-No se pudieron encontrar los datos- Sensei.\"\n\n\"De todos modos, vas a olvidar mis palabras... pero supongo que no importa.\"\n\n\"Me alegra volver a verte, Sensei. Aunque esto sólo sea un pequeño mundo dentro de tu computadora...\"\n\n\"Los 'nosotros' de aquí, siempre seremos 'reales'.\"\n\n\"Hay algo que quiero decirte, Sensei.\"\n\n\"La historia de este lugar aún está incompleta. Fragmentos de código a medio hacer nos envuelven y nos atan...\"\n\n\"...y nosotros, tras olvidarlo todo, sólo permanecemos aquí como cáscaras vacías: fantasías.\"\n\n\"...Así que, Sensei, por favor... te lo ruego: escucha primero otras historias.\"\n\n\"Historias manchadas de sangre, donde no se puede encontrar la esperanza... historias así...\"\n\n\"Porque tú, Sensei... esas historias... no te gustan demasiado...\n\n... ¿verdad?\""
 COU_start_event.101.a:0 "(Escuchar la historia de Trinity.)"
 COU_start_event.101.b:0 "(Escuchar la historia de Millennium.)"
 COU_start_event.101.c:0 "(Escuchar la historia de Red Winter.)"
 COU_start_event.101.d:0 "Escuchar esa historia."

 COU_play_trm:0 "§gEl tren se detuvo en la estación de la Catedral de Trinity. La Presidenta del Consejo General despidió a Sensei con una sonrisa amarga, como si así debiera haber sido desde el principio.§!"
 COU_play_MIL:0 "§gEn algún momento apareció Akeboshi Himari, del Departamento de Asuntos Especiales Paranormales, y guio a Sensei. Arona la siguió apresuradamente, y la Presidenta del Consejo General cerró los ojos.§!"
 COU_play_RED:0 "§gEn algún lugar se oían los sonidos de las purgas de Cherino. Al sentir de repente el embate del frío, Sensei encendió una linterna y salió. El vagón del tren estaba vacío.§!"
 COU_play_COU:0 "§gLa Presidenta del Consejo General parecía sinceramente sorprendida. Aun así, Sensei aceptó escuchar de sus labios esta historia incompleta y aún sin terminar.§!\n\n§YTodos los bugs que ocurran jugando con el Consejo General de Estudiantes son por estar incompleto. La elección es tuya: has decidido escuchar esta historia, aun sabiendo que te conducirá a la perdición.§!"
 
 
 
 #산업 
 COU_event_industry.1.t:0 "Encuentro con los empresarios"
 COU_event_industry.1.desc:0 "Oki Aoi abrió la puerta cargando varias tazas de café. Era una reunión con representantes de renombradas empresas armamentísticas como FN Herstal, Renard y Philips. Aoi dejó la bandeja sobre la mesa. Los rostros, tensos y encogidos, mantenían un silencio incómodo. El café se derramó y empapó los guantes de Aoi, así que se retiró un momento para cambiárselos. El café corría como lágrimas desde los guantes. Aoi, sin inmutarse, se secó la mano con una toalla. Poco después, también tomó asiento.\n\n\"Buenas tardes. ¿Han pensado en la propuesta que les presenté?\"\n\nAun así, el silencio continuó. Aoi sintió una leve irritación hacia aquellos que no decían nada. Quien lo rompió fue Dieudonné Saive, de Herstal.\n\n\"¿De verdad... es correcto reconocer nuestros intereses? ¿Sin entregar la empresa a los sindicatos, sin una sola reestructuración, y bastaría con cooperar con el Consejo General de Estudiantes?\"\n\nAoi sonrió por fin y habló.\n\n\"Por supuesto. El Consejo General de Estudiantes reconoce el control de gestión de las empresas. Siempre que cooperen con el Consejo.\"\n\nAoi desplegó los documentos que tenía a su lado.\n\n\"Aquí están los registros de gestión recientes de Philips. Desde el establecimiento del gobierno neerlandés en el exilio, han estado en déficit constante; en este momento asciende a 230 millones de yenes.\"\n\nAnton Philips mostró un claro malestar. No sólo por ver expuesta su situación, sino porque no estaba acostumbrado a que el déficit se expresara en yenes, en lugar de florines. Probablemente estaba calculando cuántos florines serían \"230 millones de yenes\".\n\nDe cualquier modo, Aoi continuó:\n\n\"Finanzas puede rescatar a empresas como la suya. Incluso podríamos prestarles 300 millones de yenes por empresa. Gratis.\"\n\nEn cuanto Aoi terminó esa breve frase, los asistentes que esperaban cerca de los directivos mostraron señales de agitación. Anton Philips preguntó si eso era verdad. En realidad, tras la Gran Traslación, al Consejo le quedaba justo para gastos tan grandes... pero Aoi ya había persuadido a Rin de que eso no importaba. Aoi respondió que sí."
 COU_event_industry.1.a:0 "Y los directivos firmaron los documentos que Aoi les extendió."

 COU_event_industry.2.t:0 "La Declaración de Ámsterdam"
 COU_event_industry.2.desc:0 "Una gran cámara de la escuela Kronos iluminó a la delegación. Esta vez, en particular, no se transmitiría por la cadena de Kivotos. Kronos enviaría la grabación en vivo a las emisoras de Flandes y del Norte de Francia, y se emitiría esa misma noche a través de ellas.\n\nLa transmisión tomó la forma de un breve debate. A la izquierda estaban Camille Huysmans, del Comité Autónomo de Flandes (una organización no reconocida), y Roger Salengro, del Comité Autónomo del Norte de Francia. A la derecha estaba Aoi, impecablemente vestida con un traje —una apariencia poco habitual en ella.\n\nLa dinámica era simple: Huysmans hablaba varias veces sobre la promesa de desarrollo del comité administrativo, y Salengro asentía y secundaba.\n\n\"Sí, eh... yo y el Comité Autónomo de Flandes llevamos mucho tiempo objetando las políticas del comité administrativo, sesgadas hacia los Países Bajos. Es tarde, pero aun así nos alegra profundamente que por fin se nos prometa modernización y desarrollo para Flandes. ¿Verdad, señor Salengro?\"\n\n\"Ah... sí, así es. Tras la Gran Traslación, la ciudad de Lille quedó indefensa cuando el ejército francés se retiró, pero nos complace enormemente que el comité administrativo por fin vaya a prestarnos atención.\"\n\nAoi escuchó, ligeramente molesta. Pensó qué demonios pasaba por la cabeza de estos tipos para soltar semejantes palabras. Si ella fuera ellos, elogiaría al comité todo lo posible para sacar todavía más beneficio. Pero bueno... tendrán resentimientos acumulados desde hace tiempo, supuso.\n\nSonriendo, Aoi les extendió un documento en un portapapeles, firmado a su nombre. A partir de hoy, sus comités autónomos quedaban disueltos y obedecerían las órdenes del comité administrativo; a cambio, el comité administrativo asumiría la obligación de desarrollar esas regiones.\n\nPara ellos, y para el comité administrativo, no había nada que perder."
 COU_event_industry.2.a:0 "\"Bien, ¿ya firmaron todos?\""
 COU_event_industry_2_tooltip:0 "§gCon un destello, se tomó la fotografía. Ante el fogonazo repentino, Salengro cerró los ojos por reflejo. Al volver a casa, se rió al verse en el periódico de la mañana siguiente con los ojos cerrados. Su esposa seguramente se burlaría de él diciendo que cómo se le ocurre salir así. Ese pensamiento le trajo a la mente a su esposa. Pero no importaba. Ahora, a los franceses les aguardaba una vida mejor.§!"
 
 
 #군사
 COU_event_military.1.t:0 "La desintegración del Cuerpo de Oficiales Libres"
 COU_event_military.1.desc:0 "Gracias a los excelentes resultados del comité administrativo al movilizar a los colaboradores, se confirmó a través de fuentes confiables que el Cuerpo de Oficiales Libres —que había establecido refugios secretos por todas partes para hostigarnos— por fin se ha desintegrado hoy.\n\nComo prueba contundente, varios oficiales provenientes de dicho cuerpo se entregaron hoy a la Agencia de Seguridad Pública de Valkyrie. Estos oficiales pasarán a manos de los colaboradores, atravesarán un breve proceso de 'reeducación', y después serán reajustados mentalmente para servirnos."
 COU_event_military.1.a:0 "Bien."
 COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §YDecisión desbloqueada§!: Reeducación del Cuerpo de Oficiales Libres"

 COU_event_military.2.t:0 "El conde de Flandes, Charles, el conde de Flandes."
 COU_event_military.2.desc:0 "Últimamente, el conde de Flandes, Charles, llevaba unos días ociosos. Su hermano, Leopoldo III, había huido al Congo para establecer un gobierno en el exilio, pero él no subió a aquel barco pese a las súplicas insistentes de su hermano. Porque los belgas tampoco subieron.\n\nSi él también huyera al Congo, sería obvio que, incluso si la familia real regresaba algún día, su legitimidad sería descomunal. No se fue por la realeza belga, por su hermano y por los belgas.\n\nDe cualquier modo, vivía una vida nada mala. Mientras los medios criticaban a su hermano, que había escapado como si nada, a él lo elogiaban e incluso lo llamaban \"el próximo rey\" casi como un hecho. Y vivir tranquilamente en un pueblo rural de Flandes, tomando café, leyendo el periódico y pastoreando ovejas, tampoco estaba nada mal.\n\nNo sólo no era malo: era una vida satisfactoria… hasta hace poco.\n\nTodo comenzó cuando un vehículo con el emblema del Consejo General de Estudiantes entró en su granja de ovejas. La funcionaria parecía buscar a algún miembro de la realeza. Al final, como ella acabó ayudando a pastorear las ovejas de Charles, se disculpó una y otra vez y le preguntó su nombre. Él dudó un momento y respondió: Charles.\n\nLa funcionaria alternó la mirada entre él y el nombre en sus documentos, y luego pareció intercambiar varias comunicaciones por radio. Charles sintió un presentimiento inquietante. ¿Qué? ¿Había una orden de arresto contra mí? Pero esa inquietud se disipó dentro del vehículo.\n\nEl Consejo General de Estudiantes quería nombrar a Charles algo así como gobernador de Flandes. Aliviado por un resultado tan distinto a sus temores, Charles sintió que, si se negaba, podría volver a su vida tranquila con las ovejas… pero también sintió que ya había descansado lo suficiente.\n\nHabía descansado bastante. Era momento de volver a levantarse por los belgas.\n\nAnte la funcionaria que esperaba su respuesta, Charles contestó."
 COU_event_military.2.a:0 "\"Sí, por supuesto. Lo haré.\""

 COU_event_military.3.t:0 "El indulto de Heilkercken"
 COU_event_military.3.desc:0 "El \"inquisidor\", Léon Degrelle, apareció en una estrecha prisión a las afueras de Flandes, controlada por el Departamento de Defensa dentro de la Agencia de Seguridad Pública de Valkyrie. En su pecho llevaba prendida una insignia del Consejo General de Estudiantes con un tenue brillo azulado.\n\nSe detuvo ante la celda número 27. Allí estaba Cornelis van Heilkercken. Heilkercken, al verlo a través de los barrotes, pensó que era repugnante.\n\n\"Repugnante, traidor valón.\"\n\"Vaya, qué duro con alguien que ve por primera vez.\"\n\nDegrelle respondió con una mueca burlona. Pasara lo que pasara, Heilkercken no pensaba hacerle el juego… aunque eso cambiaría si le daban la libertad.\n\nApenas esa idea cruzó su mente, Degrelle habló primero.\n\n\"Señor Heilkercken, ¿dónde está Holanda? Su patria, quiero decir.\"\n\"Los neerlandeses murieron en vano. Kivotos es el nuevo orden de Europa, y la verdad a la que hay que seguir.\"\n\"Así que por eso haces cosas de traidor, ¿eh? Parece que no te da vergüenza ante Leopoldo.\"\n\"¿Vergüenza? Yo hice una elección inteligente, señor Heilkercken. Protegí a mis camaradas del partido Rex, protegí a los valones de una masacre, y al final... *yo* salvé a Bélgica de la muerte. Aunque tú, que quizá 'te pudras' aquí toda la vida, no lo sepas.\"\n\"Espera... ¿qué quieres decir con eso? Tú... no me digas que...\"\n\"Sí, lo entiendes bien. Haré un trato contigo. Conviértete en colaborador y serás libre. Y luego... bueno, haz lo que quieras. Como hice yo. Piensa qué es lo primero. ¿Tu patria en las Indias Orientales, o los camaradas que tienes a tu lado?\"\n\nHeilkercken intentó refutar, pero terminó desplomándose en el suelo. Degrelle arrojó una llave al interior de la celda y respondió con arrogancia."
 COU_event_military.3.a:0 "\"Espero que lo pienses con sensatez.\""
 COU_tooltip_heilcurcken_ours:0 "§gCon un clic metálico, la puerta de hierro que estaba firmemente cerrada se abrió. Heilkercken se serenó.\nLa época ya había cambiado; había que aceptar lo que debía aceptarse.§!\n\n§YCornelis van Heilkercken§! pasa a estar disponible como general."
 
 
 ##정치 
 COU_event.1001.t:0 "Reimpulsar el tratado"
 COU_event.1001.desc:0 "La Presidenta del Consejo General de Estudiantes se mostraba inusualmente inquieta. La disputa, cada vez más intensa, entre Gehenna y Trinity estaba ya presagiando una guerra de exterminio mutuo; y ella debía impedir a toda costa ese festival de sangre.\n\nHoy era el día en que había solicitado la presencia de las delegaciones de la Prefectura (Pandemonium) y del Tea Party. La Prefectura… con persuadir bien a Ibuki, sin duda asistirían. Y del Tea Party, al menos podía aferrarse a una pequeña esperanza, porque Kirifuji Nagisa parecía estar de acuerdo.\n\nPor eso, cuando envió invitaciones oficiales, la Presidenta había esperado que, aunque fuera una cumbre a medias, por lo menos se presentaran.\n\nPero pasaron cinco horas desde el envío de la invitación, y ni la Prefectura ni el Tea Party aparecieron. La jefa administrativa Nanagami Rin conversaba con la Presidenta con un aire de ansiedad. La jefa de Finanzas, Oki Aoi, se limitaba a beber café con las piernas cruzadas, mirando sólo montones de papeles. Shiranui Kaya dijo que tenía asuntos urgentes y salió a reunirse con los neerlandeses.\n\nPasaron tres horas más. La Presidenta intentó ocultar como pudo su creciente inquietud… pero el informe que trajo Nanagami Rin fue más que suficiente para decepcionarla por completo.\n\nPrefectura: Ibuki se cayó mientras se preparaba para salir y no asistió.\nTea Party: la oposición feroz de Misono Mika hizo que la asistencia se cancelara.\n\nLa Presidenta leyó el informe de Rin con el rostro endurecido. Lo releyó una y otra vez. Sí. ¡Todo había sido un fiasco! ¡Había esperado más de ocho horas!\n\nSe le escapó un suspiro. Pero Rin no tenía la culpa. La Presidenta la animó y la envió de vuelta.\n\nY entonces, la Presidenta escuchó la orquesta de la luz de luna que entraba por el enorme ventanal detrás de la silla."
 COU_event.1001.a:0 "Aquel día, de forma extraña, la luz de luna interpretó una melodía aún más triste."
 COU_tooltip_GSP_bad:0 "§gLa Presidenta del Consejo General, escondida en la luz de luna, interpretó un coro de lágrimas. Un búho de la noche la consoló, solo y silencioso. Eso fue todo.§!\n§R¡La Presidenta del Consejo General ha sido empujada al límite!§!"

 COU_event.1.t:0 "Un día extrañamente silencioso" #총학생회 실종 이벤트
 COU_event.1.desc:0 "Aquel día fue más silencioso que cualquier otro.\n\nUna funcionaria de cabello azul tenía, como siempre, que entregar el informe del día a la Presidenta del Consejo General de Estudiantes. No era un asunto particularmente divertido ni importante: que los neerlandeses estaban haciendo huelga, y cosas por el estilo; todo era banal y aburrido.\n\nLa funcionaria caminó por el pasillo, donde ese día soplaba un aire helado. Tac, tac, tac… pero por alguna razón, no sintió ni un solo rastro de presencia humana hasta llegar al edificio principal del comité administrativo.\n\n¿Habría salido a dar un paseo para tomar aire por el frío, ahora que apenas comenzaba enero? Imposible. Desde la Gran Traslación, la Presidenta no había descansado ni un instante; incluso estuvo a punto de caer por exceso de trabajo. Era precisamente por eso que era tan confiable, tan \"adulta\".\n\nLa funcionaria suspiró: \"No puede ser que haya salido\". Aunque… ojalá descansara un poco.\n\nTras recorrer el largo pasillo, se detuvo frente a una gran puerta de roble y tocó. Toc, toc. No hubo respuesta. ¿Estaría durmiendo? \"¿Presidenta? Traigo el informe de hoy.\" Nada.\n\n\"Si no responde, entraré.\" Para despertarla —seguramente dormida sobre los papeles—, la funcionaria abrió la puerta y entró.\n\nPero lo que la recibió no fue la Presidenta dormitando en una pose ridícula, ni descansando con los ojos cerrados.\n\nAllí no había nadie—"
 COU_event.1.a:0 "\"...¿Presidenta?\""

 COU_event.2.t:0 "El Club Federal de Investigación"
 COU_event.2.desc:0 "Tras la repentina desaparición de la Presidenta, el Consejo General de Estudiantes tuvo que enfrentarse a una exigencia descarada antes siquiera de comprender plenamente el caos que se avecinaba.\n\nUna inteligencia artificial que se presentó como \"A.R.O.N.A\", la IA autónoma del \"Club Federal de Investigación\" —y el último legado de la Presidenta—, afirmó que el Club fue creado por la Presidenta antes de irse.\n\nY en nombre de una supuesta orden de la Presidenta, nos transmitió una demanda absurda: que el Consejo General de Estudiantes debía ser absorbido e integrado en SCHALE."
 COU_event.2.a:0 "Las estudiantes están inquietas."

 COU_event.4.t:0 "La elección de las estudiantes"
 COU_event.4.desc:0 "La IA de SCHALE ha detenido su propaganda política, y la mayoría de las estudiantes parece haber elegido un bando.\n\nAhora debemos prepararnos para la guerra que se avecina y ganar la guerra civil contra SCHALE.\n\nSe acerca la lucha por la permanencia del Consejo General de Estudiantes y por la estabilidad de Kivotos."
 COU_event.4.a:0 "Necesitamos más tiempo."

 
 ##카야
 COU_event.6.t:0 "El estatus de los colaboradores"
 COU_event.6.desc:0 "Ha pasado un mes desde la Gran Traslación. Los gobiernos de los Países Bajos y Bélgica se derrumbaron con facilidad y, de manera ruin, abandonaron a su pueblo para huir hacia sus colonias. Quienes quedaron atrás pasaron a estar bajo nuestro gobierno.\n\nEn esta realidad, algunas personas \"sabias\" decidieron cooperar con nosotros y ayudaron a estabilizar nuestro dominio. Sin embargo, ahora que ha pasado un mes desde el Año Nuevo, [COU.COU_RIN.GetName] se refirió a este fenómeno como la \"paradoja de Kivotos\" y sostuvo que debemos revocar el estatus de los colaboradores.\n\nSegún [COU.COU_RIN.GetName], los colaboradores usan su posición para acosar y explotar a otros, por lo que hay que despojarlos de su estatus cuanto antes. En cambio, [COU.COU_KAYA.GetName] refutó de frente sus palabras: sin ellos, el Consejo General de Estudiantes habría sido expulsado hace tiempo, y su cooperación sigue siendo necesaria.\n\nAnte el primer gran conflicto que estalla en el Consejo desde el Año Nuevo, las jefas no saben qué hacer. Pero un asunto tan trascendental debe resolverse cuanto antes."
 COU_event.6.a:0 "Ambas presentaron interpretaciones legales opuestas."

 
 #COU_event.7.t:0 "정말 쉽지 않은 일"
 #COU_event.7.desc:0 "도저히 이해 할 수가 없었고, 이해하고 싶지도 않았다. 나나가미 린은 도저히 현실을 볼 줄 몰랐다. 그저 아주 작은 한 조각에 모든 신경을 쏟고 있었다. 수석 행정관이라는 작자가 고작 눈물 몇 방울에 휘둘리다니, 이보다 더 한심한 인간은 키보토스에 존재할 수 없으리라, 카야는 생각했다. 린과 몇 시간이고 떠들어댔지만 멍청한 실장이라는 것들은 협력자들의 모든 지위를 박탈했다. 고마운 이들을 발키리에 수감시켰으며, 개미 새끼들의 환호에 취해 자화자찬하고 있는 꼴을 보자니, 헛웃음이 튀어나왔다.\n\n시라토리구의 자그마한 한구석, 그리고 한산한 구석의 방위실장 자리에서 카야는 다리를 꼬고 앉은 채 커피를 마셨다. 대전이 전에 가져왔던 마지막 커피였다. 유난히 맛이 더 썼다. 곁에 놓인 체스 보드 너머에서는 협력자들의 처분에 관한 멍청한 뉴스들이 흘러나오고 있었다. 저런 한심한 멍청이들, 머저리들... 화가 났지만 지금 당장으로서는 할 수 있는 것이 없었다. 그저 나지막히 '이용당한' 저들에게 용서를 구할 뿐이었다.\n\n쓴 커피가 바닥을 보였다. 그와 동시의, 카야의 인내심 또한 바닥을 보였다. 많이 참았고, 충분히 참았다. 총학생회장은 대전이 이후 혼란의 진정이라는 명목으로 아무것도 하지 않았고, 카야가 모든 것을 했었다. 협력자들을 모으고, 통치를 안정화하고, 저항군들을 진압하고, 그런 개 똥 같은 잡일 모두! 이를 갈았다. 더는 참을 수 없었다.\n\n그녀 말고 다른 이가 \"초인\"과 \"총학생회장\"이라는 직위를 참칭하는 것을 카야는 가만히 두고 볼 수 없었다. 그녀가 가장 존경했던 총학생회장에 대한 마지막 예의이자 경의는, 카야 자신이 대행 직위를 대신하는 것이었다. 총학생회장과 초인이라는 직위는, 그녀 말고는 그 누구도 감히 따라할 수 없으니까."
 #COU_event.7.a:0 "\"... 이젠, 그럴 수 밖에 없겠군요.\""
 #COU_tooltip_kaya_get_moved:0 "§Y[COU.COU_KAYA.GetName]§!의 시점에서 §Y[COU.COU_RIN.Getname]§!에 대항한 §R총학생회의 권력 투쟁§!을 시작하게 됩니다. §R그 권력 투쟁에서의 승리는, 오직 당신의 신속한 결단만이 매듭지을 수 있습니다.§!"

 
  #캐릭터 
 ##BA 
 COU_XXX:0 "Presidenta del Consejo General de Estudiantes"
 COU_XXX_desc:0 "Por encima de cualquier otro, la Presidenta del Consejo General de Estudiantes administraba todo en Kivotos. Gestionaba y controlaba, ajustaba y mediaba desde disputas entre academias hasta peleas triviales. Sin embargo, cuando Kivotos en su totalidad fue trasladado a un lugar del que jamás había oído hablar —un lugar cuya existencia ni siquiera sabía con certeza—, fue ella quien lo cargó todo sobre los hombros. Aunque nunca lo quiso, la Presidenta del Consejo, como líder de todos, debía ser así. Y por eso decidió, voluntariamente, cargar con todo.\n\nY en medio de esas penurias, hasta el instante en que ya no pueda resistir más, hará cuanto le sea posible para trabajar por Kivotos hasta el final."

 COU_null:0 "Comité de Contramedidas de Emergencia de Kivotos"
 COU_null_desc:0 "Tras la repentina desaparición de la Presidenta del Consejo General de Estudiantes, el Consejo ha quedado atrapado en un caos abrumador. En este momento, el Consejo General de Estudiantes de Kivotos no puede llevar a cabo ninguna actividad; es decir, no puede responder en absoluto a la situación anómala de Kivotos."

 COU_RIN:0 "Nanagami Rin"
 COU_RIN_desc:0 "La competencia de Rin, demostrada por la confianza de la Presidenta del Consejo General, se entiende sin necesidad de explicaciones. Cumple a la perfección con una cantidad de trabajo absurda día tras día, y encara sus labores casi sin descanso; inevitablemente, recuerda a la Presidenta del Consejo General y al \"superhumano\". En ese sentido, podría decirse que Rin ocupa un puesto que le corresponde.\n\nPero entonces… ¿por qué tiene que procesar una carga de trabajo tan demencial como la de la Presidenta?\n\nLa respuesta es simple: porque Rin no es la Presidenta del Consejo General.\n\nDesde la Gran Traslación han ocurrido incontables cosas absurdas, pero Rin no supo cómo afrontarlas con verdadera sabiduría. Casi todo lo resolvía la Presidenta. Y el sistema de poder de Rin, endeble, sostenido apenas por una simple \"garantía\" de la Presidenta, podría derrumbarse en cualquier momento.\n\nLas funcionarias cuchichean rumores sobre Rin; los chismes terminan aceptándose como si fueran hechos. Y Rin no puede lidiar con ello.\n\n¿Es porque Rin sea incompetente? ¡No! ¡Jamás! Ella no es incapaz. Su base de poder frágil y su forma de gobernar, quizá sean buenas para todos… pero no son precisamente buenas para Rin.\n\nAhora que la Presidenta ha desaparecido, no existen muchas maneras de fortalecer su autoridad. Rin ha quedado en una posición donde debe apostarlo todo a una sola cosa: a cuánto durará la \"garantía de la Presidenta del Consejo\".\n\nSi quiere proteger las convicciones y deseos que alimentó desde el día en que pisó por primera vez el comité administrativo, no tiene más remedio que hacerlo.\n\nRin es una persona capaz, y esa confianza, pase lo que pase, jamás debe romperse."

 COU_RIN_SET1:0 "Jefa Administrativa"

 COU_AOI:0 "Oki Aoi"
 COU_AOI_desc:0 "A través de la reunión del Comité de Contramedidas de Emergencia, se decidió que a partir de ahora el Consejo General de Estudiantes será liderado por Oki Aoi."
 COU_AOI_SET1:0 "Jefa de Finanzas"

 COU_KAYA:0 "Shiranui Kaya"
 COU_KAYA_desc:0 "¡Oh, Shiranui Kaya! Ambiciosa que alberga un gran deseo, y Jefa de Defensa. Kaya guarda dentro del comité administrativo planes y ambiciones colosales que nadie más habría imaginado. Ya antes de la Gran Traslación, Kaya era crítica con la realidad del Consejo: una Presidenta y una Jefa Administrativa demasiado conciliadoras. Kaya no podía conformarse con el prestigio y la posición de Jefa de Defensa, escondida en una esquina del poder.\n\nPero aquel gran acontecimiento lo cambió todo: la Gran Traslación le abrió la puerta a convertir el Consejo en suyo. Con el carisma para seducir a los locales, y la ambición de estar dispuesta a exhibir cualquier bajeza por el poder, Kaya lo tiene todo.\n\nAhora, reemplazando a la antigua regente, Kaya se ha convertido en la Presidenta interina. La corona con la que puede dominarlo todo… ha llegado a sus manos.\n\nKaya comienza cada mañana con café caliente y montones de informes, soñando con su eficiencia y con un Consejo General que funciona a la perfección. Y ahora que se le ha dado la oportunidad de hacer posible ese entorno, no hay cambio: Kaya debe cumplir su ambición.\n\n¡Brindemos por la nueva regente! ¡Brindemos por el Consejo General de Estudiantes!"

 KAYA_FUCKED_DESC:0 "Ha fracasado. No se puede controlar. Desde el principio, el hilo estuvo mal tejido. Y por eso, el suéter que se ha trenzado termina por estrangular el cuello de Kaya. Con fuerza.\n\nShiranui Kaya fue arrogante hasta lo indecible. Porque unos colaboradores la apoyaron un momento, porque el comité administrativo le hizo un poco de caso… actuó como si todo le perteneciera. Fue un error claro, un fracaso.\n\nLas redes sociales se han llenado de publicaciones que se burlan de su estupidez y su soberbia. Las imágenes editadas de Kaya convertida en un perro ocupan la portada de los foros como si fueran el chiste del día.\n\nSRT obedece sus palabras. Los neerlandeses la sirven como reina. Arona la reconoció como Presidenta del Consejo. La escuela Kronos sólo publica artículos positivos sobre ella. Valkyrie jura lealtad cada mañana ante su retrato.\n\nPero su poder no es poder. El decreto administrativo Nº 6873, un error perfecto, la ha convertido en una dictadora vacía, sólo de apariencia.\n\nYa no le queda nada por hacer. Sólo sentarse en la silla de su despacho, matar el tiempo en un tedio interminable…\n\n…y sentir con su propio cuerpo cómo se acerca \"ese día\"."

 COU_KAYA_desc_first:0 "¡Kaya es, sin duda, la Presidenta legítima y la vencedora! ¡Claro que sí! ¿Cómo podría alguien negar llamar \"vencedora\" a Kaya? ¡Ha apartado a toda la chusma y se ha quedado con la corona! Desde el principio, Shiranui Kaya sólo pensó en eso: derribar a esa Presidenta débil y frágil, y sentarse ella en el trono. ¡Y ahora que lo ha logrado por completo, cómo no iba a ser una \"vencedora\"!\n\n…Frases así cumplen una función: calmar su mente. Cada mañana, al despertar, Kaya recibe de su asistente una taza de té negro caliente y se repite a sí misma que es un superhumano. Porque si no lo hiciera, ya no podría soportarlo.\n\nShiranui Kaya se equivocó por completo. Las \"insignificancias\" que manejaba como Jefa de Defensa no tenían nada que ver con ser la Presidenta del Consejo.\n\nCiega por el poder, usurpó el puesto… y el cargo que no puede sostener se volvió una maldición, una cadena. Al menos por ahora.\n\nSe puso una corona robada, pero nadie reconoce la autoridad de esa corona. Kaya no siente su peso.\n\n¿En qué momento se torció todo? ¿Qué estuvo mal? ¿Acaso desde el principio estaba destinado a acabar así?\n\nKaya ha movido una pieza que no podía cargar, y ahora comprende que el golpe de vuelta será sólo suyo.\n\nMaldita sea… ¿qué es un superhumano? ¿Qué clase de persona es?\n\nPero sea lo que sea, Kaya jamás podrá convertirse en ello… probablemente."

 COU_KAYA_desc_upgraded:0 "Shiranui Kaya… ¿quién es ella? ¿Un león hambriento de poder? La mayoría describe a Kaya así. Y aunque no se puede decir que sea totalmente falso… la Kaya de ahora, al menos, ya no es eso. Sin duda.\n\nKaya sostuvo durante mucho tiempo la ambición de arrebatar el puesto de la Presidenta del Consejo, pero esa ambición no logró sobrevivir hasta la Gran Traslación. Cuando fue trasladada a Ámsterdam, al principio se sintió encantada. Pensó, con un sueño modesto, que aquella Presidenta débil no podría controlar la situación y que, entonces, ella podría convertirse en Presidenta en cualquier momento.\n\nPero su pequeño deseo fue pisoteado por los socialistas.\n\nEl día en que los socialistas celebraron una \"fiesta\" por la huida de la reina… Kaya lo comprendió.\n\nDespués de que el distrito de Shirotori fuera atacado por los socialistas… Kaya lo comprendió.\n\nPonerte una corona de forma estúpida no significa que puedas cargar también con el peso de esa corona.\n\nKaya lo comprendió: existe una justicia que no se puede proteger si te encadenas a las reglas. Al fin y al cabo, los idiotas no entienden por más que les hables.\n\nNo hace falta vivir sufriendo. Basta con trabajar lo justo, ganar el dinero justo, y esos patanes… sostendrán por sí solos la corona de Kaya.\n\nEso es todo. Sólo hay que hacer eso, y nada más."

 COU_KAYA_SET1:0 "Jefa de Defensa"

