 COU_kivotos_alliance.1.t:0 "Decisión del país presidente del Tratado: envío de una fuerza expedicionaria"
 COU_kivotos_alliance.1.desc:0 "Uno de los Estados miembros de la Organización de Cooperación de Kivotos ha sido atacado por un país no miembro, y el país presidente del Tratado ha decidido enviar una fuerza expedicionaria para protegerlo.\n\nDebemos decidir si participaremos o no en este despliegue."
 COU_kivotos_alliance.1.a:0 "¡Protejan a Kivotos!"
 COU_kivotos_alliance.1.b:0 "Ahora no es momento de sumar más enemigos."

 COU_kivotos_alliance.2.t:0 "Pacto de no agresión del Organismo del Tratado de Kivotos"
 COU_kivotos_alliance.2.desc:0 "El país presidente del Organismo del Tratado de Kivotos ha propuesto un tratado que prohíbe las guerras entre los países de la Organización de Cooperación de Kivotos. Parece que el país presidente pretende imponerlo con firmeza, y nosotros debemos decidir nuestra postura… y si abandonaremos el Organismo del Tratado."
 COU_kivotos_alliance.2.a:0 "Firmar el tratado."
 COU_kivotos_alliance.2.b:0 "Esto es una intromisión en asuntos internos."

 COU_kivotos_alliance.3.t:0 "Retiro del tratado de paz por parte de [FROM.GetName]"
 COU_kivotos_alliance.3.desc:0 "Tras un reciente cambio de régimen en [FROM.GetName], [FROM.GetName] ha declarado que se retirará del tratado de paz."
 COU_kivotos_alliance.3.a:0 "Expulsarlos según el tratado."
 COU_kivotos_alliance.3.b:0 "Ahora no es momento de sumar más enemigos."

 COU_kivotos_alliance.4.t:0 "Restablecimiento del estatus de la Academia de Policía"
 COU_kivotos_alliance.4.desc:0 "Después de que se transfiriera la autoridad de control de la Sanctum Tower, el estatus de la Academia de Policía quedó congelado temporalmente. Sin embargo, esperamos al nuevo Consejo General de Estudiantes, y finalmente nuestra autoridad ha sido restaurada.\n\nAhora podemos volver a trabajar como la Academia de Policía de Kivotos."
 COU_kivotos_alliance.4.a:0 "¿Eh… esto es bueno?"

 COU_kivotos_alliance.5.t:0 "Unión de Kivotos"
 COU_kivotos_alliance.5.desc:0 "La Unión de Kivotos es una alianza que reúne a todas las academias de Kivotos en una sola. Fue creada para la estabilidad de Kivotos, para que los estudiantes de todas las academias se unan y trabajen por dicha estabilidad.\n\nAhora debemos decidir si nos uniremos a la Unión de Kivotos, o si permaneceremos independientes y trabajaremos por la estabilidad por nuestra cuenta."
 COU_kivotos_alliance.5.a:0 "Unámonos a la Unión."
 COU_kivotos_alliance.5.b:0 "Nos basta con estar solos."

 COU_kivotos_alliance.6.t:0 "[FROM.GetName] se une a la Unión"
 COU_kivotos_alliance.6.desc:0 "[FROM.GetName] se ha unido a la Unión de Kivotos."
 COU_kivotos_alliance.6.a:0 "Trabajaremos por la estabilidad de Kivotos."

 COU_kivotos_alliance.7.t:0 "[FROM.GetName] rechaza la Unión"
 COU_kivotos_alliance.7.desc:0 "[FROM.GetName] ha expresado su decisión de rechazarla."
 COU_kivotos_alliance.7.a:0 "Entendido."

 COU_kivotos_alliance.8.t:0 "[FROM.GetName] solicita unirse a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.8.desc:0 "[FROM.GetName] ha expresado su intención de unirse a la Organización de Cooperación de Kivotos.\n\n[FROM.GetName] no era un Estado miembro, pero parece que, debido a cambios en la situación internacional, desea sumarse a nosotros."
 COU_kivotos_alliance.8.a:0 "Mientras más aliados, mejor."
 COU_kivotos_alliance.8.b:0 "Es un país en el que no se puede confiar."

 COU_kivotos_alliance.9.t:0 "Éxito: adhesión a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.9.desc:0 "Los esfuerzos de nuestro gobierno por unirse a la Organización de Cooperación de Kivotos han dado frutos: [FROM.GetName] aprobó nuestra entrada."
 COU_kivotos_alliance.9.a:0 "Justo el resultado que queríamos."

 COU_kivotos_alliance.10.t:0 "Fracaso: adhesión a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.10.desc:0 "A pesar de los esfuerzos de nuestro gobierno por unirse a la Organización de Cooperación de Kivotos, el país presidente del Organismo del Tratado rechazó nuestra adhesión."
 COU_kivotos_alliance.10.a:0 "A ver si pueden sin nosotros."

 COU_cooperative_treaty_ratification:0 "Ratificación del Tratado de Paz de Kivotos"
 COU_cooperative_treaty_ratification_TT:0 "§RTu país está ratificando el tratado de paz.§!"
 COU_cooperative_treaty_ratification_TT_FROM:0 "§REse país está ratificando el tratado de paz.§!"
 COU_cooperative_treaty_ratification_TT_JOIN:0 "§RTu país, al estar ratificando el tratado de paz, no puede unirse a una guerra de un país que esté en guerra contra un miembro de la Organización de Cooperación.§!"
 COU_cooperative_treaty_ratification_TT_JOIN_FROM:0 "§RTu país está en guerra con un miembro de la Organización de Cooperación de Kivotos, por lo que no puede llamar a un país que haya ratificado el tratado de paz.§!"

 landmark_COU_tower:0 "Sanctum Tower"
 landmark_COU_tower_desc:0 "La Sanctum Tower es un edificio ubicado en el centro de Kivotos. Es el lugar donde se reúnen todas las academias y estudiantes de Kivotos para celebrar reuniones y tomar decisiones. Como edificio emblemático, la Sanctum Tower es el símbolo de Kivotos, y todas las decisiones que se toman aquí tienen un gran impacto en su futuro."
 
 
 
 #오프닝
 COU_country_intro_header:0 "Justicia hecha pedazos, orden en caída libre"
 COU_country_intro_content:0 "En realidad, el Consejo General de Estudiantes no era una organización con forma de \"estado\" como las academias. Si lo comparamos con instituciones humanas, el Consejo General cumplía un papel similar al de la Sociedad de Naciones; y por eso, durante mucho tiempo, fue justicia y orden en Kivotos. Al menos, hasta que llegó aquel día trágico de noviembre de 1935.\n\nLa Gran Traslación lo revolvió todo en Kivotos. De principio a fin: lo que se daba por sentado se volvió falso, y lo que se creía falso pasó a ser un hecho público. Para sobrevivir en el nuevo lugar donde aterrizamos, el Consejo General no pudo evitar choques físicos con los estados de las tierras bajas, con quienes compartíamos un espacio incómodo. Nuestro enfoque pacífico fue ignorado con un bombardeo brutal; y la humanidad, despojada de su hogar, nos llamó \"invasores\" y alzó armas contra Kivotos.\n\nKivotos los reprimió con una abrumadora superioridad tecnológica y militar… pero los problemas surgidos en ese proceso no pueden ser ignorados.\n\nBélgica y los Países Bajos no sobrevivieron ni dos meses en la guerra de las tierras bajas. Bélgica, con sólo su rey escapando por los pelos; y la reina Guillermina, abatida durante una operación militar de SRT. La Gran Traslación dejó una marca enorme no sólo en Kivotos, sino también en la humanidad: una herida profunda que jamás sanará.\n\nLos sensatos eligieron colaborar para sobrevivir. La organización de colaboradores, creada bajo el impulso de Shiranui Kaya y el Departamento de Defensa, ayudó a la gran reestructuración y a la estabilización del Consejo General. Recibieron un nuevo estatus y, bajo la tolerancia del Consejo, cumplen órdenes sin importar medios ni métodos.\n\nY ahora, el Consejo General debe enfrentar un nuevo amanecer. Desde la inundación de la megaciudad D.U. hasta la resistencia del Frente de Resistencia Nacional: todos los desafíos frente a nosotros revelan, con crudeza, los claros errores del Consejo General y de su Presidenta, y la amarga realidad de la Gran Traslación.\n\nYa no hay tiempo para titubeos. El Consejo General debe volver a reinar sobre Kivotos. Debe erigir la justicia. Debe enderezar el orden.\n\n§RAunque sólo sea para expiar todos los pecados y errores cometidos sin comprenderlos.§!\n\n§YDesarrollo - SKSKIe, YurizonoSeia, Imika§!"

 COU_guide:0 ""
 
 #선택창 
 COU_GATHERING_STORM_DESC:0 "Ubicado en el distrito central de Kivotos —una enorme ciudad-academia federal compuesta por miles de escuelas grandes y pequeñas— el Consejo General de Estudiantes de Kivotos controla todas las instalaciones administrativas centrales y coordina las disputas, la política y los conflictos entre todas las academias dentro de los distritos autónomos.\n\nHasta hace no mucho, Kivotos se movía bajo el \"orden del Consejo General\". Todas las academias seguían nuestras órdenes y se sometían.\n\nPero, por desgracia, ese orden insignificante colapsó y se volvió incontrolable a causa del desastre llamado \"la Gran Guerra\". Con la Presidenta del Consejo consumida por el exceso de trabajo —al punto de que no sería extraño que desapareciera en cualquier momento—, el camino para volver a controlar Kivotos se ve interminable."
