 ##나나가미 
 #COU_stabilization_of_the_student_council: "Estabilización del Consejo General de Estudiantes"
 #COU_stabilization_of_the_student_council_desc: "Afortunadamente, aunque hubo algo de ruido, el Consejo General de Estudiantes recuperó la estabilidad. Sin embargo, la Jefa de Finanzas, Oki Aoi, solicitó convocar una reunión por el asunto relacionado con el choque previo con SCHALE."



 ##오키 (OKAY)
 COU_impeachment_of_chief_executive: "Destitución del interinato"
 COU_impeachment_of_chief_executive_desc: "§g\"Tú no eres la Presidenta del Consejo General de Estudiantes, Jefa Administrativa. Por más que te pongas el brazalete de interina, no te convierte en ella.\"§!\n\nNanagami Rin, la Jefa Administrativa Principal, aunque haya sido por culpa de la organización llamada SCHALE, cruzó una línea imperdonable al rebajar a la Presidenta del Consejo General de Estudiantes durante ese proceso. En esta reunión aprobaremos un voto de no confianza y la destituiremos."



 ##유라기 
 COU_strengthening_bonds_tt: "Se añadirá §G1 espacio de construcción§! y §Y1 fábrica civil§! en el estado capital del país."
 COU_autonomous_legislation_tt: "Nuevos consejeros estarán disponibles."
 COU_export_of_revolution_tt: "Se relajarán las condiciones de la decisión §YInterferencia política§!."
 COU_resolution_47_of_THIS_tt: "Los §Gpaíses correspondientes§! serán expulsados de la §YOrganización de Cooperación de Kivotos§!."
 COU_war_deterrence_tt: "Se impulsará una ley que prohíba la guerra entre países de la §YOrganización de Cooperación de Kivotos§!."
 COU_establishment_of_autonomous_system: "Establecer el sistema de autonomía"
 COU_establishment_of_autonomous_system_desc: "Tras imponernos en la lucha por el poder, podremos sentar a Yuragi Momoka como presidenta del Comité de Medidas de Emergencia y obtendremos la oportunidad de establecer bases institucionales para la autonomía que antes prometimos a los locales. Con ello, podremos afianzar aún más nuestra base de apoyo."
 
 
 
 #총학생회 국민정신
 COU_admin_confusion:0 "Caos administrativo"
 COU_admin_confusion_desc:0 "Tras la Gran Traslación, el Consejo General de Estudiantes perdió el control, y este caos administrativo parece que continuará por un tiempo."
 COU_cut_tower:0 "Pérdida de autoridad sobre la Sanctum Tower"
 COU_cut_tower_desc:0 "Al desaparecer la Presidenta del Consejo General de Estudiantes —quien poseía autoridad sobre la Sanctum Tower a través de la Caja de Shittim— también se perdió la autoridad sobre la Sanctum Tower que supervisaba Kivotos. Esto es una amenaza grave para el Consejo General de Estudiantes y para Kivotos."
 COU_Perfidus:0 "Perfidus"
 COU_Perfidus_desc:0 "Durante el proceso de estabilización del gobierno tras la declaración de rendición incondicional de Bélgica, el Departamento de Defensa encabezado por Shiranui Kaya propuso reclutar a locales cooperativos para utilizarlos en la administración. Oficialmente se les llama colaboradores, pero comúnmente —en latín— se les conoce como Perfidus, es decir, traidores."
 COU_Perfidus_tooltip_modf:0 "£decision_icon_small §YDecisión desbloqueada§!: Perfidus"
 COU_Perfidus_tooltip:0 "Cambio de §Y$COU_Perfidus$§!"
 COU_name_of_the_student_council:0 "Autoridad del Consejo"
 COU_name_of_the_student_council_desc:0 "Aunque tras la Gran Traslación el Consejo General de Estudiantes ya no puede ejercer el mismo control de antes, sigue siendo 'el único' que supervisa y media entre todas las academias; incluso desgastado, su autoridad e influencia pan-académica es imposible de ignorar." 
 COU_industry:0 "Economía dirigida por la administración"
 COU_industry_desc:0 "Por la naturaleza del enorme cuerpo burocrático llamado Consejo General de Estudiantes, aunque se haya reorganizado como un Estado, aún quedan legados del pasado. Su economía no se deja al mercado: se mueve sobre el papeleo del comité administrativo."

 
 
