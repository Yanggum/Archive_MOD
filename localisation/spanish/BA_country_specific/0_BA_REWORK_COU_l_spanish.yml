 COU_getout_rin_decision:0 "Destituir a Rin"
 COU_getout_rin_decision_desc:0 "\n\n\n\n£GFX_COU_decision_picure_COU_norin\n\n\n\n\n\n\n\n\n§L\"¿Incluso después de que la Presidenta del Consejo haya desaparecido, pretenden seguir escuchando las opiniones de la gente y hacer las cosas por procedimiento, oprimidos por su sombra...? Con métodos tan populistas no se resuelve nada. Kivotos debe ser dirigida por un superhombre.\"§!\n\nLa §Rdestitución§! de §YNanagami Rin§! empezó a discutirse desde el mismo momento en que §YRin§! se adelantó para cubrir el vacío de la §YPresidenta del Consejo General de Estudiantes§!. Su gobierno, basado en un estricto principismo, provocó un fuerte descontento en gente como §YShiranui Kaya§!, y ese conflicto terminó por desembocar en una §Rúltima lucha§!: la §Rdestitución§!. §YKaya§! ha iniciado acciones para §Rdestituir§! a §YRin§!.\n\nSin embargo, §YNanagami Rin§! tampoco se quedará sentada. §YRin§! también ha comenzado a moverse para §Rexcluir a Kaya del Consejo§!, y §Ren última instancia esta pelea se decidirá por quién doblega primero a la otra.§!\n\n§RPero§! no basta con hacerlo rápido para ganar. Debes conseguir el §Gapoyo§! de tres altos cargos: §YOki Aoi§!, §YSumomo§! y §YHaine§! (excluyendo a quienes no puedan asistir por heridas u otros motivos). §RSi no obtienes el apoyo de aunque sea una de estas tres, la destitución fracasará.§!\n\nAdemás, también debes obtener el §Yapoyo del público a la destitución§!. Si no los §G'educas'§! por todos los medios —prensa y medios de comunicación— y no §Rdestituyes§! a §YRin§! mediante un procedimiento §Gcompletamente legal y democrático§!, la §Ynueva Presidenta del Consejo§! podría terminar en un §Rmal final§!. Como los reyes durante la Revolución Francesa."
 
 COU_rin_getout_kaya:0 "Destitución preventiva de Kaya por Rin"
 COU_rin_getout_kaya_desc:0 "§YNanagami Rin§! está §Rconvenciendo§! a los altos cargos de que §YKaya§! \"provoca divisiones dentro del Consejo y participa en tratos ilegales con los locales, además de encubrir y colaborar con delitos\". §RSi Kaya no responde adecuadamente, perderá.§!"
 COU_increasing_the_crisis:0 "Sospechas en aumento"
 COU_increasing_the_crisis_desc:0 "En el Consejo General de Estudiantes sienten que la Jefa de Defensa ha estado actuando de forma sospechosa últimamente. Estas sospechas son inevitables: es un problema que debe afrontarse."
 COU_demand_establish_humans_land:0 "Establecer la Oficina de Garantía de Derechos Humanos"
 COU_demand_establish_humans_land_desc:0 "Crear la Oficina de Garantía de Derechos Humanos puede asegurar nuestra clara ventaja, pero no es algo que sea imprescindible hacer."
 COU_gets_aoi_first_eco_crisis:0 "Seducir a Aoi - manipular el informe de Finanzas"
 COU_gets_aoi_first_eco_crisis_desc:0 "Kaya ahora puede recibir los informes con prioridad. Si lo aprovechamos bien, podremos intentar seducir de nuevo a la Jefa de Finanzas… esta vez con manipulaciones y engaños aún más meticulosos."
 COU_gets_aoi_second_letsgo:0 "Seducir a Oki Aoi - conexión con Kaiser"
 COU_gets_aoi_second_letsgo_desc:0 "El golpe final y crítico para una Jefa de Finanzas cada vez más desconfiada de Rin será vincularla con Kaiser Corporation. Con documentos adecuadamente falsificados, crearemos esa conexión: aunque no logremos poner a Aoi del lado de Kaya, al menos podremos hacer que vote a favor de la destitución."
 COU_gets_smomo_cou_supports_kaya:0 "Seducir a Sumomo - la corriente."
 COU_gets_smomo_cou_supports_kaya_desc:0 "Sumomo posee un cargo y autoridad equivalentes a los de un jefe. Para seducirla, basta con mostrarle la 'corriente'… el flujo de la 'tendencia' dominante."
 COU_dutch_law_letsgo:0 "Presentar la Ley de Deutschland"
 COU_dutch_law_letsgo_desc:0 "Para Kaya ya no queda un rival mayor que Rin como interina. Con el apoyo suficiente, Kaya podrá imponer la Ley de Deutschland de forma 'coercitiva'."
 COU_SRT_buntang_rabbits_first:0 "Contactar al escuadrón RABBIT"
 COU_SRT_buntang_rabbits_first_desc:0 "Para empezar, SRT no puede llevar a cabo el sabotaje sólo con el escuadrón FOX. Lo primero es contactar a las subordinadas que se han ocultado en algún lugar."
 COU_SRT_FOX_attack_good_rins:0 "Escuadrón FOX - asaltar el comité administrativo"
 COU_SRT_FOX_attack_good_rins_desc:0 "En plena noche, el escuadrón FOX asaltará la Sanctum Tower y el comité administrativo para atacar a los jefes favorables a la interina Rin."
 COU_SRT_RABBITS_attack_good_rins:0 "Escuadrón RABBIT - sabotear la red de transporte"
 COU_SRT_RABBITS_attack_good_rins_desc:0 "Siguiendo órdenes, el escuadrón RABBIT saboteará la red de transporte de D.U. para debilitar la posición de la interina Rin."
 COU_attack_the_cou_workers:0 "Interceptar informes"
 COU_attack_the_cou_workers_desc:0 "Innumerables funcionarios entregan todos los asuntos e informes del Consejo primero a la interina Rin. Eso equivale a reconocer su legitimidad; debemos impedirlo por cualquier medio necesario."
 COU_use_fascist_militas:0 "Movilizar milicias fascistas"
 COU_use_fascist_militas_desc:0 "Los fascistas rebeldes siempre están listos. Podemos utilizarlos para reducir la legitimidad de la interina Rin."
 COU_workers_notworks_bruh:0 "Impulsar una huelga"
 COU_workers_notworks_bruh_desc:0 "Los trabajadores leales siempre están listos. Dirán: \"No trabajaremos mientras la interina Rin no dimita\", y eso reducirá su legitimidad."
 COU_getout_rin_right_now:0 "Presentar la moción de destitución de Rin"
 COU_getout_rin_right_now_desc:0 "Todo ha salido bien. Ahora… ahora… de verdad… es hora de echar a la interina Rin."
 

