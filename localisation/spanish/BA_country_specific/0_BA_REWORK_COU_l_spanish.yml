 ##스타트 
 COU_establishment_of_emergency_measures_committee_NOT: "Convocar al comité administrativo"
 COU_establishment_of_emergency_measures_committee: "Comité de Medidas de Emergencia de Kivotos"
 COU_establishment_of_emergency_measures_committee_NOT_desc: "Ha comenzado el Año Nuevo de 1936, y la Presidenta del Consejo General de Estudiantes ha convocado a los jefes de departamento para tomar como lección los errores y fracasos de los últimos dos meses. Durante los próximos meses, el comité administrativo se encargará de cerrar las secuelas de la Traslación y preparar el nuevo año."
 COU_establishment_of_emergency_measures_committee_desc: "Poco después de que la Presidenta del Consejo General de Estudiantes desapareciera, apareció un autoproclamado 'Club Federal de Investigación' llamado \"SCHALE\", exigiendo lo absurdo: que, por orden de la Presidenta, el Consejo General de Estudiantes debía ser absorbido por SCHALE. Ante esto, la Jefa Administrativa Principal, Nanagami Rin, asumirá como presidenta interina en uso de su autoridad y decidió convocar el Comité de Medidas de Emergencia de Kivotos."
 
 COU_support_nanagami: "Reforma estructural de la Jefa Administrativa Principal"
 COU_support_nanagami_desc: "La Jefa Administrativa Principal, Nanagami Rin, ha señalado las faltas del comité administrativo —que apenas han cambiado desde la Gran Traslación— y propuso una reforma estructural para resolver la causa de raíz. Está claro que se trata de un asunto que debe ejecutarse con la máxima prioridad."
 COU_united_netherlands_law: "Ley de Unión de los Países Bajos"
 COU_united_netherlands_law_desc: ""
 COU_survivor_of_kivotos: "Garantía de estabilidad de Kivotos"
 COU_survivor_of_kivotos_desc: ""
 COU_support_oki: "Revisión de la estructura financiera por la Jefa de Finanzas"
 COU_support_oki_desc: "La Jefa de Finanzas, Oki Aoi, señaló que, junto con la autoridad del Consejo General de Estudiantes colapsada tras la Gran Traslación, la estructura financiera quedó hecha pedazos hasta un nivel espantoso. Sostuvo que la prioridad de toda reforma debe concentrarse en la economía. Por supuesto, esto debe implementarse con máxima prioridad."
 COU_expropriate_industrialist: "Una solución definitiva"
 COU_expropriate_industrialist_desc: ""
 COU_integration_of_puppet_economies: "Comprar capital local"
 COU_integration_of_puppet_economies_desc: ""
 COU_support_shiranui: "Plan de defensa de academias de la Jefa de Defensa"
 COU_support_shiranui_desc: "Hace mucho que se quebró la paz que el Consejo General de Estudiantes garantizaba. Por ello, la mayoría de los planes concebidos desde hace tiempo por el Departamento de Defensa se han vuelto inútiles, y la Jefa de Defensa, Shiranui Kaya, lo ha señalado: debemos implementarlo con máxima prioridad."
 COU_the_belgian_crusade: "Dividir para gobernar"
 COU_the_belgian_crusade_desc: ""
 COU_kill_the_medusa: "La lanza clavada en el cuello de la serpiente"
 COU_kill_the_medusa_desc: ""
 COU_our_plan_treaty: "La solución tradicional"
 COU_our_plan_treaty_desc: ""
 COU_our_plan_war:0 "La determinación para resolverlo"
 COU_our_plan_war_desc: ""
 
 
 
 ##경제
 COU_focus_after_two_months: "Después de la Gran Traslación"
 COU_focus_after_two_months_desc: "Tras la Gran Traslación de noviembre de 1935, el Consejo General de Estudiantes fue reorganizado en una forma similar a un Estado con capacidad propia de decisión. Como resultado, pasó de una conducción pasiva —limitada a firmar documentos— a planificar, construir y dirigir de manera más activa y directa su base industrial."
 COU_focus_look_the_our_economy_fucked: "Análisis del fracaso de la recuperación"
 COU_focus_look_the_our_economy_fucked_desc: "El comité administrativo no sabía que la economía neerlandesa dependía enormemente del comercio y de las exportaciones. ¿De verdad solo ignorábamos eso? Si fracasamos, sin duda hubo razones claras."
 COU_economy_focus_0: "Reimpulsar el Proyecto del Zuiderzee"
 COU_economy_focus_0_desc: "El Proyecto del Zuiderzee se refiere a la obra de diques completada en 1932. Sin embargo, tras la Gran Traslación de 1935, el desplazamiento repentino de D.U. y de la Sanctum Tower provocó un resultado desastroso: la re-inundación de las tierras ganadas al mar. El punto de partida para la recuperación económica recaerá, precisamente, en un nuevo Proyecto del Zuiderzee."
 COU_establishment_of_federal_industrial_committee: "Comprar empresas"
 COU_establishment_of_federal_industrial_committee_desc: "Las empresas se mueven estrictamente por la lógica del dinero. No existe algo como una empresa 'patriótica', y si para estabilizar nuestra economía les damos algo de dinero, podrán hacer cualquier cosa por nosotros."
 COU_tooltip_unlock_dutch_belgium_cons:0 "Todos los §Ydiseñadores bloqueados§! pasarán a estar §Gdisponibles§!."
 COU_focus_order_highlander: "Cooperar con Highlander"
 COU_focus_order_highlander_desc: ""
 COU_focus_mineral_prospecting: "Reactivar la cuenca minera de Limburgo"
 COU_focus_mineral_prospecting_desc: "Minas como Maurits y Winterslag en Limburgo quebraron por completo durante el caos social de la Gran Traslación debido a su fuerte dependencia externa a inicios de los años 30. Pero no podemos seguir dejando de lado estas minas útiles, que llegaron a producir hasta 500 millones de toneladas de carbón al año. ¡Se comprarán todas las minas estatales existentes y se pondrán en marcha otra vez!"
 COU_focus_project_delta: "Proyecto Delta"
 COU_focus_project_delta_desc: ""
 COU_focus_on_industrial_complex: "Reconstruir la industria civil"
 COU_focus_on_industrial_complex_desc: ""
 COU_focus_restore_cable_internet: "Reconstruir la red de cable"
 COU_focus_restore_cable_internet_desc: ""
 COU_focus_apprenticeship_jordaanoproer: "Contener el Jordaanoproer"
 COU_focus_apprenticeship_jordaanoproer_desc: "El Jordaanoproer fue un motín de desempleados ocurrido en julio de 1934, que dejó cicatrices profundas en la sociedad neerlandesa. Como herederos de esa realidad, y como responsables de gestionar la economía de las Tierras Bajas, tenemos el deber de contenerlo."
 COU_focus_have_with_galopin: "Adoptar el Principio Galopin"
 COU_focus_have_with_galopin_desc: "Los belgas 'patrióticos' —es decir, desleales— fueron un dolor de cabeza: en su resistencia desesperada por preservar su industria y estructura económica, el Comité Galopin encabezado por Alexandre Galopin enarboló el llamado Principio Galopin. Sin embargo, si aprovechamos su descuido y adoptamos ese principio, cooperando activamente con ellos, podremos absorber su potencial sin sufrir grandes daños."
 COU_focus_absorption_belgian_assets: "Absorber los activos belgas"
 COU_focus_absorption_belgian_assets_desc: ""
 COU_focus_plan_de_man: "Plan De Man"
 COU_focus_plan_de_man_desc: "Este plan laboral, ideado por De Man en 1933, representa la doctrina planificadora de De Man: crear un sector nacionalizado que abarque la organización del crédito y las industrias clave ya de facto monopolizadas, para construir una economía mixta. Aunque la izquierda —especialmente Trotsky— lo denunció desde 'un plan para engañar a los obreros' hasta 'una herramienta reformada del conservadurismo de la democracia burguesa', este plan eficiente y efectivo de Henri De Man finalmente ha encontrado el momento apropiado y debe ejecutarse."
 COU_focus_have_with_hirschfeld: "Incorporar a Hirschfeld"
 COU_focus_have_with_hirschfeld_desc: "Si los locales organizan algo parecido a un comité improvisado para llevar a cabo resistencia económica, entonces nosotros podemos formar un comité de mayor nivel para hacerles frente. Hirschfeld, un joven director del Ministerio de Trabajo-Comercio-Industria que defendía el proteccionismo cuando el libre comercio era la norma, es un economista prometedor entre los colaboradores del Consejo General de Estudiantes. Lo incorporaremos oficialmente para construir nuestra economía propia."
 COU_focus_expansion_of_protectionism: "Ampliar el proteccionismo"
 COU_focus_expansion_of_protectionism_desc: "Hirschfeld, como firme defensor del proteccionismo, ha solicitado ampliar la imposición de aranceles —que antes se limitaba a los Estados locales— para proteger una industria paralizada y fomentar nuevas capacidades, además de extender los cupos de importación y los plazos de subsidios."
 COU_focus_plan_de_vos_tinbergen: "Plan De Vos–Tinbergen"
 COU_focus_plan_de_vos_tinbergen_desc: "Concebido en 1935 pero nunca aplicado, este plan fue redactado conjuntamente por Hein Vos y Jan Tinbergen. En su nueva versión con participación del Departamento de Finanzas, propone invertir 200 millones de yenes en obras públicas a través de un Comité Económico General que coordine empresas, trabajadores y el comité administrativo, para emplear a 200.000 personas y, mediante el efecto multiplicador, aumentar el poder adquisitivo de la clase trabajadora y revitalizar la economía."
 COU_focus_currency_unification: "Unificación monetaria"
 COU_focus_currency_unification_desc: ""
 COU_focus_abandon_the_gold_standard: "Reintroducción parcial del patrón oro"
 COU_focus_abandon_the_gold_standard_desc: ""
 #COU_focus_modernizing_agriculture: "Modernización agrícola"
 #COU_focus_modernizing_agriculture_desc: "[Focus descartado]"
 COU_focus_eco_rework_the_dead_lands: "Obligatoriedad de instalar bombas en las Tierras Bajas"
 COU_focus_eco_rework_the_dead_lands_desc: "Aunque se reconstruyó el dique del Zuiderzee, las características geográficas de las Tierras Bajas siguen dejando un terreno blando y con cimientos incompletos. Para romper esto y cerrar por completo los daños por inundación, debemos hacer obligatoria la instalación de bombas."
 COU_focus_rework_our_roads: "Asegurar reservas de trenes Highlander"
 COU_focus_rework_our_roads_desc: ""
 COU_focus_attack_northern_france: "Integrar el norte de Francia"
 COU_focus_attack_northern_france_desc: ""
 COU_focus_restore_grebee_peelram_line: "Reforzar la línea defensiva Grebbe–Peel-Raam"
 COU_focus_restore_grebee_peelram_line_desc: ""
 COU_tooltip_construct_bunker_shalle: "Si controlamos el §Yestado de D.U. Schale§!:"
 COU_focus_reestablish_amsterdam_univ: "Reconstruir la Universidad de Ámsterdam"
 COU_focus_reestablish_amsterdam_univ_desc: ""
 COU_focus_hapsung_research: "Química sintética"
 COU_focus_hapsung_research_desc: ""
 #COU_focus_reestablish_tourism: "Reconstruir la industria turística"
 #COU_focus_reestablish_tourism_desc: "[Focus descartado]"
 COU_focus_lock_the_kronous: "Controlar Kronous"
 COU_focus_lock_the_kronous_desc: ""
 COU_focus_establish_humans_rights: "Establecer la Oficina de Garantía de Derechos Humanos"
 COU_focus_establish_humans_rights_desc: ""
 COU_focus_stop_our_deals: "Suspender los tratos"
 COU_focus_stop_our_deals_desc: ""
 #COU_focus_take_their_money: "Confiscar fondos"
 COU_focus_treay_of_amsterdam: "Declaración de Ámsterdam"
 COU_focus_treay_of_amsterdam_desc: "Mientras solo los distritos autónomos de Kronous y Highlander acaparaban atención, los habitantes locales de Flandes y del norte de Francia —olvidados por el comité administrativo centrado en las Tierras Bajas— han luchado durante mucho tiempo contra su trato. Debemos aceptar sus demandas legítimas y asumir el deber de desarrollar y hacer prosperar esta región."

 ##군사
 COU_shaking_royalty: "충성심 뒤흔들기"
 COU_shaking_royalty_desc: "총학생회 곳곳의 자칭 '애국자'들은 '아직까지도' 우리를 침략자로 여기고 있습니다만, 그 얄량한 충성심이 과연 언제까지고 지속될 수 있을까요? 그들에게 맛좋은 고기 한 덩이만 던져 준다면 그 얄팍하기 그지없는 기회주의자들은 곧 우리 편이 될 것입니다."
 COU_give_power_to_degrelle: "드그렐 진급"
 COU_give_power_to_degrelle_desc: "판이 바뀌었다는 것을 알려주는 가장 좋은 방법은 보기 좋은 '본보기'를 보이는 것입니다. 우리에게 충성적인 레옹 드그렐을 본보기로 삼아 그에게 더 많은 권력과 혜택을 제공함으로서 우리는 협력자의 규모를 늘려 현지인들과의 조화에 신경쓸 수 있을 것입니다."
 COU_keep_our_deals: "거래 지속"
 COU_keep_our_deals_desc: ""
 COU_focus_buy_their_weapon: "불법화기 밀매"
 COU_focus_buy_their_weapon_desc: ""
 COU_reduction_of_administrative_committee_authority: "자유 장교단 무력화"
 COU_reduction_of_administrative_committee_authority_desc: "저지대 전쟁 이후 본토에 잔류한 적국의 장교들은 자유 장교단이라는 조직을 꾸려 우리에게 피해를 주었으나 더 이상 이러한 피해를 감내할 수 없습니다. 이들을 이간질하고 파괴해 완벽히 무력화시켜야만 합니다."
 
 
 
