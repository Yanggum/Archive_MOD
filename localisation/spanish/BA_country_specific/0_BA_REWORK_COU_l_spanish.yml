 ##자위더르해 사업 재개
 COU_restart_the_zuiderzee_works:0 "Obras del Zuiderzee"
 COU_restart_the_zuiderzee_works_desc:0 "Esta obra colosal de ingeniería civil, completada en 1932 por el antiguo gobierno neerlandés, debe continuar sin importar quién la lleve a cabo. Por las características de las Tierras Bajas, se requieren más terreno y suelo firme, y la reanudación del proyecto se realizará a una escala aún mayor."
 COMPLETED_LEV1:0 "Se completó la §Yfase 1§!."
 COMPLETED_LEV2:0 "Se completó la §Yfase 2§!."
 COMPLETED_LEV3:0 "Se completó la §Yfase 3§!."
 COU_restore_our_fucked_lands:0 "Fase 1: Reconstruir el dique del Zuiderzee"
 COU_restore_our_fucked_lands_desc:0 "Para recuperar el terreno completamente hundido, primero levantaremos enormes muros temporales alrededor de las zonas a reconstruir; luego drenaremos el agua con bombas, y finalmente volveremos a convertir el Zuiderzee en el IJsselmeer. Claro… puede que algunas instalaciones terminen \"destruidas\" en el proceso."
 COU_restore_our_lost_factories:0 "Fase 2: Reparación urgente de fábricas inundadas"
 COU_construct_sea_dam:0 "Fase 3: Construcción del dique-mar"
 COU_extra_lands:0 "Revisión total del plan urbano"
 COU_restore_flevoland_province:0 "Restablecer la provincia de Flevoland"
 COU_restore_flevoland_province_desc:0 "Durante la Gran Traslación, la provincia de Flevoland fue inundada y literalmente 'desapareció' cuando el dique del Zuiderzee quedó destrozado. Ahora que lo hemos reconstruido, Flevoland vuelve a emerger sobre el nivel del mar, y debemos restablecerla como corresponde."
 COU_use_dam_for_energy:0 "Maximizar la producción de energía"
 COU_use_dam_for_energy_desc:0 "El Zuiderzee, que ya una vez se convirtió en mar tras la inundación de 1916, todavía hoy exhibe una fuerza abrumadora: si el dique reconstruido se derrumbara, podría volver a ser mar. Aprovecharemos ese hecho para maximizar la producción de energía utilizando el dique y la presa construidos en la fase 3."
 COU_custom_cost_pol25civ3:0 "£pol_power  §Y25§! £civ_factory  §Y2§!"
 COU_custom_cost_pol25civ3_blocked:0 "£pol_power  §R25§! £civ_factory  §R2§!"
 
 ##플란데런-북프랑스개발
 COU_industry_of_flandern_northern_france:0 "Declaración de Ámsterdam"
 COU_industry_of_flandern_northern_france_desc:0 "El comité administrativo prometió oficialmente a Flandes y al norte de Francia que, a partir de ahora, asignará más presupuesto que antes. ¡Todo el resentimiento acumulado desaparecerá con unos cuantos desembolsos nuestros!"
 
 ##공용 디시전 
 COU_decision_the_student_council:0 "Misiones"
 #COU_decision_the_student_council_desc:0 "£GFX_COU_decision_gsc\n\n\n\n\n\n§YEl Consejo General de Estudiantes§! gobernaba toda Kivotos con la §YSanctum Tower§! como centro. Dicho Consejo está compuesto por el §Ycomité administrativo§!, que §goficialmente§! cuenta con §Y11 departamentos§! para facilitar la gestión y dispersar el poder, reforzando el control del Consejo. Algunas §gdependencias temporales§! creadas tras la §YGran Traslación§! §Rno se contabilizan oficialmente§!.\n\nNormalmente, los asuntos dentro del Consejo son presentados por §YFinanzas, Transporte, Coordinación, Defensa y Deportes§! —estos §g5§! departamentos— que compiten por priorizar sus propuestas. Para activar un asunto se requiere un §YTicket de agenda§! £schedule_ticket_texticon. Los §YTickets de agenda§! £schedule_ticket_texticon se reponen §gcada 3 meses§! en §g1 unidad§!. No se reponen por encima de §g6§!.\n\nActualmente tienes [?global.cou_schedule_point|+0]/6 §YTickets de agenda§! £schedule_ticket_texticon.\n"
 COU_decision_the_student_council_desc:0 "£GFX_action_point_texticon §7Action Point§! (AP) es una especie de moneda de negociación usada para persuadir y comprar voluntades dentro del comité administrativo. Se obtiene al cumplir varias §gexigencias periódicas§! que el comité presenta, llamadas §Ymisiones§!.\n\nCon £GFX_action_point_texticon §7AP§!, podrás influir en el comité administrativo para fijar las políticas o enfoques nacionales que deseas.\n\nActualmente tienes [?global.cou_apcost|+0] £GFX_action_point_texticon §7AP§!."
 COU_check_the_missions_1:0 "Paso del tiempo"
 COU_check_the_missions_1_desc:0 "Si completas la misión dentro del tiempo dado, obtendrás AP."
 COU_check_the_missions_2:0 "Paso del tiempo"
 COU_check_the_missions_2_desc:0 "Los miembros del comité administrativo quedarán satisfechos si se completa dentro del tiempo dado."
 COU_check_the_missions_3:0 "Paso del tiempo"
 COU_check_the_missions_3_desc:0 "No es obligatorio cumplir el plazo, pero es mejor hacerlo."
 
