 COU_the_srt_problem:0 "Remitir a juicio a la Academia Especial SRT"
 #COU_regain_schedule_ticket:0 "Reponer ticket de agenda"
 COU_the_srt_problem_desc:0 "Durante la Gran Traslación, la Academia Especial SRT cometió un error desastroso: masacró a la mayoría de la Casa Real de Orange-Nassau, incluida Wilhelmina. Este 'massacre' —perpetrado por decisión propia del comandante de escuadrón— hizo que, con la llegada del Año Nuevo, el Tribunal Superior de los Países Bajos solicitara al Consejo General de Estudiantes llevarlo a juicio. No parece posible deshacer esa decisión."
 COU_the_decart_problem:0 "Descartes y la lucha por el desapego"
 COU_the_decart_problem_desc:0 "Tras la Gran Traslación, ha crecido una tendencia a evitar el trabajo. El plan de cierto robot para aprovecharse con astucia de quienes han caído en un nihilismo irresponsable… continuará."
 COU_the_normal_days_of_cou:0 "Vida cotidiana en el Consejo General de Estudiantes"
 COU_tooltip_some_normal_days_event:0 "§gOcurrirán aleatoriamente eventos de vida cotidiana dentro del Consejo General de Estudiantes.§!"
 
 ##페르피두스
 COU_decision_cat_perfidus:0 "Perfidus"
 COU_decision_cat_perfidus_desc:0 "\"Mi honor quedará enterrado hoy bajo estas murallas, pero si mañana por la mañana los niños dentro de este castillo pueden abrir los ojos, aceptaré gustoso la marca de traidor.\"\n\nQue la capital del Consejo General de Estudiantes y de Kivotos haya sido trasladada a las Tierras Bajas quizá sea un destino dictado por Dios. Los gobiernos de las Tierras Bajas huyeron aterrados, pero entre ellos existieron quienes, con sabiduría, eligieron el beneficio y el interés propio. Oficialmente se les llama colaboradores; comúnmente, con el apodo despectivo, Perfidus. La relación con ellos desempeñará un papel crucial en nuestra integración local."
 COU_perfidus_gui_txt11:0 "Líder"
 PERFIDUS_LEON_tooltip:0 "Líder de Perfidus: el 'Inquisidor' §YLeón Degrelle§!"
 COU_perfidus_gui_txt1:0 "Efectos actuales por Perfidus:"
 COU_perfidus_gui_txt2:0 "Velocidad de movilización [?COU_Perfidus_ms|%+1]\nOrganización de las divisiones [?COU_Perfidus_aof|%+1]\nPoblación reclutable: modificador [?COU_Perfidus_cf|%+1]\nEstabilidad [?COU_Perfidus_sta|%+1]\nLímite de eficiencia de producción [?COU_Perfidus_fmef|%+1]\nVelocidad de aumento de sumisión [?COU_Perfidus_cg|%+1]\nTiempo de entrenamiento [?COU_Perfidus_ttf|%+1]"
 COU_perfidus_happy_yay:0 "¡Los Perfidus están §Gsatisfechos§!!"
 
 COU_collaboraters_wants_political_money:0 "Exigencia periódica de fondos"
 COU_collaboraters_wants_political_money_desc:0 "Los Perfidus cooperan con nosotros, pero no piensan trabajar gratis. En parte porque casi todos son oportunistas, sí, pero también porque las tareas que asumen —como despliegues de seguridad en sustitución del Departamento de Defensa y de Valkyrie— requieren financiación. Por eso nos exigen periódicamente dinero o apoyo político. Si satisfacemos sus demandas a tiempo, no habrá problema… pero si no, trabajarán \"con menos ganas\" para nosotros."
 
