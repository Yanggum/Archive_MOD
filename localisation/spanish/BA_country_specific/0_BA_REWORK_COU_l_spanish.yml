 COU_MOMOKA:0 "Yuragi Momoka"
 COU_MOMOKA_DESC:0 "¿Desde cuándo el Departamento de Transporte se volvió un ministerio tan importante dentro del Consejo General? No era más que una pequeña oficina: reparar trenes que descarrilaban cada día, recibir reportes… y poco más.\n\nYuragi Momoka se convirtió en un rayo de esperanza para los locales. La nueva Comisión de Reforma y el Amanecer Rojo insinúan que ella no es una simple gobernante. Con abundante suministro de botanas sabor menta (mentaiko), el trato propio de una figura de poder, y fingiendo obediencia, Momoka terminó convirtiéndose en el núcleo del nuevo orden.\n\nEn otras palabras: Momoka no es más que alguien obligada a cargar con asuntos fastidiosos.\n\nMomoka no tiene demasiado interés en los juegos políticos. Hace ya mucho que se cansó de procesar aún más papeles y burocracia. A veces, suspira a solas, diciendo que echa de menos a Rin. A su lado, los locales con brazaletes rojos sólo la observan con recelo.\n\nPero sea cual sea el lugar donde la pongan, ella es el nuevo orden: el símbolo de la armonía entre la humanidad y Kivotos.\n\nMomoka… y las botanas sabor mentaiko… cumplirán fielmente con ese deber.\n\nAunque sea poco más que una marioneta que ha arrojado los complejos juegos políticos a los políticos… aun así, Momoka cumplirá.\n\nCargando el peso que debe cargar."

