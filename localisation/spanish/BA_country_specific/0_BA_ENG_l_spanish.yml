 #tt
 ENG_stop_exile_1_tt: "§REsta decisión afectará gravemente los planes de exilio.§!"
 ENG_tooltip_bonto_banger: "Se añadirá una §Yfortificación§! para defensa."
 go_to_can_tt: "§REl plan de exilio se pondrá en marcha y partiremos hacia Canadá.§!"

 #중점
 ENG_focus_fire_at_the_britain: "La lucha final"
 ENG_focus_fire_at_the_britain_desc: "La corporación de máquinas conocida como Kaiser Corporation no nos dio ni la más mínima oportunidad de negociar y nos atacó sin piedad. El enemigo se movía con la velocidad y agresividad de un león marino, y en un abrir y cerrar de ojos, ciudades clave como Londres fueron cayendo una a una. Sin embargo, gracias a la desesperada resistencia de nuestras fuerzas, hemos logrado sobrevivir y pelear durante más de dos meses. Esto no es solo una guerra, es la última lucha por la supervivencia de Britannia. Debemos ganar por cualquier medio... o huir para sobrevivir."
 ENG_protect_liverpool: "Defender Liverpool"
 ENG_protect_liverpool_desc: "Liverpool se ha convertido en un punto estratégico vital para Gran Bretaña. Este lugar representa nuestra última esperanza y podría ser la base desde donde lancemos una contraofensiva. Si logramos un punto de inflexión milagroso aquí, podríamos revertir la situación y lanzar un contraataque decisivo."
 ENG_the_defense_of_liverfool_tt_1: "§Y$VICTORY_POINTS_6384$§!:\n"
 ENG_the_defense_of_liverfool_tt_2: "§Y$VICTORY_POINTS_6318$§!:\n"
 ENG_AirForceUtilization: "Uso de la Fuerza Aérea"
 ENG_AirForceUtilization_desc: "Afortunadamente para nosotros, el enemigo no parece estar utilizando su fuerza aérea de forma intensiva. Esta es una oportunidad que debemos aprovechar. Como dice el dicho: 'quien domina el cielo, domina el campo de batalla'. Es el momento de que nuestra fuerza aérea juegue su papel decisivo. Si conseguimos superioridad aérea, aún podemos cambiar el rumbo de la guerra."
 ENG_Assault_Troops: "Fundación de tropas de asalto"
 ENG_Assault_Troops_desc: "Estamos por formar nuestras tropas de asalto, cuya misión será irrumpir en las líneas enemigas, atacar la retaguardia vulnerable y romper su defensa con golpes rápidos y certeros. Si estas tropas colaboran estrechamente con la fuerza aérea, podremos frenar la ofensiva enemiga y ganar tiempo para contraatacar. Esta unidad podría ser nuestra última oportunidad."
 ENG_building_a_position: "Construcción de posiciones defensivas"
 ENG_building_a_position_desc: "Todos están reuniendo escombros y levantando murallas de arena improvisadas. El tiempo no está de nuestro lado. La amenaza de un nuevo ataque enemigo es constante. No hay tiempo que perder: hay que cargar, apilar y proteger antes de que el enemigo llegue."
 ENG_mercenary_recruitment: "Reclutamiento de mercenarios"
 ENG_mercenary_recruitment_desc: "Cada vez más extranjeros, muchos de ellos provenientes de dominios autónomos, quieren unirse a nuestra guerra. Muchos cuentan con experiencia valiosa adquirida en la Gran Guerra. Necesitamos esa experiencia desesperadamente. Si los reclutamos y los llevamos al frente de inmediato, podrán desempeñar un papel crucial en la defensa de Inglaterra."
 ENG_focus_colonies_one: "Unidad del Commonwealth"
 ENG_focus_colonies_one_desc: "La guerra en suelo británico es cada vez más intensa. Frente a la ofensiva enemiga, necesitamos reunir todos los recursos posibles de los dominios exteriores. Si logramos consolidar la unidad del Commonwealth, podremos contener la invasión enemiga. Esta ya no es solo una lucha británica, es una lucha del imperio entero."
 ENG_Rule_the_Sky: "Dominio del cielo"
 ENG_Rule_the_Sky_desc: "Debemos destruir por completo la aviación enemiga. Su tecnología avanza rápidamente, y pronto podrían alcanzarnos. No tenemos mucho tiempo. Hay que movilizar todos nuestros aviones y tomar el control del cielo. Si no defendemos nuestro cielo, el campo de batalla será suyo."
 ENG_focus_militas_more: "Movilizar milicias"
 ENG_focus_militas_more_desc: "Tras la Gran Guerra, Inglaterra cayó en la ilusión de una paz eterna, y redujo su ejército. Pero desde el ataque sorpresa de 1935, hemos vuelto a la guerra con crudeza. Ahora, miles de ciudadanos están tomando las armas para proteger sus hogares. Si los organizamos correctamente, podrán reforzar nuestras líneas y contener al enemigo."
 ENG_Accelerate_exile_planning: "Acelerar el plan de exilio"
 ENG_Accelerate_exile_planning_desc: "La derrota ya es una realidad. Solo llegan noticias de retirada, y nuestras tropas no dan abasto. No queda ni fuerza ni esperanza. Para evitar más muertes, debemos acelerar el plan de exilio y buscar una salida antes de que sea demasiado tarde."
 ENG_lessons_of_kaiser_war: "Lecciones de la guerra con Kaiser"
 ENG_lessons_of_kaiser_war_desc: "El enemigo nos ha dejado duras lecciones. Aprovecharon el factor sorpresa y su velocidad para conquistar nuestras posiciones, y su tecnología casi nos arrolla. Pero encontramos sus puntos débiles y conseguimos mejorar nuestra tecnología. Gracias a eso, logramos frenar su avance. Ahora es momento de usar estas lecciones para reconstruirnos."
 ENG_Industrial_facility_Relocation: "Traslado de instalaciones industriales"
 ENG_Industrial_facility_Relocation_desc: "Aunque gran parte de nuestro territorio ha sido ocupado, no todo está perdido. Debemos trasladar urgentemente las instalaciones industriales que aún quedan hacia Canadá y otros dominios seguros. El tiempo corre en nuestra contra."
 ENG_underground_workshop: "Talleres subterráneos"
 ENG_underground_workshop_desc: "Necesitamos crear de inmediato talleres secretos en las regiones subterráneas de Escocia que aún no han sido afectadas por la guerra. Aunque sean improvisados, pueden producir el material que tanto necesitamos. No hay tiempo que perder."
 ENG_London_Industrial_Relocation: "Evacuación industrial de Londres"
 ENG_London_Industrial_Relocation_desc: "No podemos permitir que la industria y el patrimonio de Londres caigan en manos del enemigo. Debemos moverlo todo a lugares seguros cuanto antes. Si no actuamos ahora, lo perderemos para siempre."
 ENG_WeWillWin: "¡Vamos a ganar!"
 ENG_WeWillWin_desc: "¡La retirada enemiga es clara! Hemos atravesado sus defensas y sus bases están al alcance. Debemos atacar rápidamente, capturar su base y ondear orgullosos la Union Jack. ¡La victoria está al alcance, y el final de esta guerra se vislumbra al fin!"
 ENG_we_will_win: "$ENG_WeWillWin$" 

 #Adición
 ENG_Victory_Mainland: "Victoria en el continente"
 ENG_Victory_Mainland_desc: "Hemos obtenido la victoria en la lucha en el continente."
 ENG_Government_Return: "Retorno del gobierno en el exilio"
 ENG_Government_Return_desc: "Retorno del gobierno en el exilio"ç

 #디시전
 britian_war: "Guerra de Britannia"
 britian_war_desc: "Han pasado tres meses desde que las fuerzas de otro mundo, conocidas como Kaiser Corporation, invadieron las Islas Británicas. La batalla continúa y la situación se vuelve cada vez más desfavorable para nosotros. Para escapar de esta guerra, hemos elaborado un plan de exilio: cuanto más tiempo resista el ejército británico, más suministros podremos enviar a Canadá."
 give_can_fac: "Preparar el exilio hacia Canadá"
 go_to_can: "Ejecutar el plan de exilio"
 ENG_stop_exile_1: "Desarrollar plan de contraataque"
 ENG_stop_exile_2: "Cancelar plan de exilio"

 ENG_request_for_protection: "Solicitar protección"
 ENG_request_for_protection_flag: "§YSolicitud de protección§! ya enviada"
 ENG_end_of_protection_flag: "Potencia protectora de la §Ysolicitud de protección§!"
 ENG_end_of_protection: "Finalizar protección"


 #캐릭터
 ENG_british_army: "Mando Unificado del Ejército Británico"
 ENG_british_army_DESC: "Hasta el momento en que, durante la Gran Transferencia, se enfrentaron a fuerzas desconocidas, Londres había confiado en la prudencia del gabinete de Baldwin antes que en el alto mando militar. Aquellos días en los que se creía, con optimismo, que la sabiduría de la democracia y las lecciones de la Gran Guerra resolverían la situación de forma sensata fueron destrozados una y otra vez. En medio de una guerra cada vez más intensa, Jorge V delegó plenos poderes en el Mando Unificado del Ejército Británico en sustitución del gabinete de Baldwin, ordenándole resistir hasta el final por el Reino Unido.\n\n...porque el objetivo no era simplemente vencer al enemigo, sino lograr una retirada exitosa de las Islas Británicas antes de eso. Tras largas deliberaciones, el Parlamento llegó a la desesperada conclusión de que no era posible derrotar al enemigo. Por ello, para preservar el Imperio Británico y preparar el futuro, era imprescindible ganar tiempo. Tras Jorge V, el Parlamento huyó sucesivamente a Canadá, y en una desierta Downing Street solo permanece el Mando Unificado, encabezado por Bernard Montgomery.\n\nAunque el rey y el Parlamento ya no estén aquí, los británicos y el ejército británico sí lo están. Enviar la mayor cantidad posible de activos a Canadá y ganar tiempo para embarcar al mayor número posible de británicos rumbo a Canadá: esa es la principal misión del Mando Unificado.\n\nHasta el día de la victoria, que Dios salve a Su Majestad el Rey y al Reino Unido."
 ENG_edward_VIII: "Eduardo VIII"
 ENG_george_VI: "Jorge VI"
 ENG_elizabeth_II: "Isabel II"
 IMP_kingsley_wood: "Kingsley Wood"
 ENG_Health_minister: "Ministro de Salud"


 #트레잇
 ENG_Last_Resistance: "Ganar tiempo\n§gToda Bretaña arde viva. Los gritos de dolor resuenan, pero nadie acude en su ayuda.§!"

 #아이디어
 ENG_defence: "Resistencia final"
 ENG_identify_weaknesses: "Identificar debilidades"
 CAN_arab: "Guerra de Oriente Medio"
 ENG_idea_yung_yunbang_one: "Cohesión del Commonwealth"
 ENG_operation_exile: "Plan de exilio"
 ENG_under_surprise_attack: "Bajo ataque sorpresa"
 ENG_save_the_liverpool: "El milagro de Liverpool"
 ENG_operation_exile_week: "Flexibilización del plan de exilio"
 CAN_british_disease: "La enfermedad británica"
 CAN_british_disease_desc: "Seamos sinceros: por más que lo disfracemos como una 'gran evacuación', ¿de verdad alguien cree que trasladar a la población, empaquetándola como a los antiguos esclavos negros, no iba a traer consigo enfermedades?"
 ENG_low_admin_Strength: "Debilitamiento administrativo"
 ENG_low_admin_Strength_desc: "El debilitamiento de la capacidad administrativa ha provocado un auge del crimen, y las guarniciones coloniales están siendo atacadas por guerrillas emboscadas."
 ENG_homless_n_health_1: "Problema de los desplazados - grave"
 ENG_homless_n_health_1_desc: "Tras el final de la guerra, quienes perdieron sus hogares por los bombardeos comenzaron a vivir bajo puentes, en edificios derrumbados y casas abandonadas, buscando refugio del viento y la lluvia. El estado de salud e higiene de los desplazados es espantoso."
 ENG_homless_n_health_2: "Problema de los desplazados - atención"
 ENG_homless_n_health_2_desc: "Gracias a las tiendas militares y a los hospitales de campaña, los desplazados han conseguido espacios donde vivir. Sin embargo, la falta de sistemas adecuados de agua y alcantarillado, así como de recolección de basura, mantiene unas condiciones sanitarias deplorables."
 ENG_disassembled_parliment: "Parlamento disuelto"
 ENG_disassembled_parliment_desc: "En octubre de 1935, el primer ministro británico disolvió el Parlamento de cara a las próximas elecciones. Sin embargo,"
 ENG_dissolving_commonwealth: "El ocaso del Commonwealth"
 ENG_dissolving_commonwealth_desc: "La guerra contra Kaiser Corporation ha debilitado al Reino Unido. Aunque las colonias aún nos siguen, buscarán escapar de nuestra influencia."
 ENG_great_depression_01: "Gran Depresión de posguerra"

 ENG_postwar_devastation: "Devastación de posguerra"

 #이벤트
 ENG_lose_global_flag: " §YReino Unido§! ha sido derrotado por §YKaiser Corporation§!"
 ENG_win_global_flag: "§YReino Unido§! ha derrotado a §YKaiser Corporation§!"
 ENG_ba.1.t: "Declaración del estado de emergencia"
 ENG_ba.1.desc: "Los forasteros que aparecieron repentinamente en los cielos de Londres atacaron indiscriminadamente a la población civil, y en un instante el sur de Inglaterra cayó en manos del enemigo. Declararemos oficialmente el estado de emergencia para enfrentarnos a ellos."
 ENG_ba.1.a: "¡Resistan la violencia!"

 ENG_ba.2.t: "Una solución"
 ENG_ba.2.desc: "No se vislumbra ninguna solución…"
 ENG_ba.2.a: "Esto es grave."

 ENG_ba.3.t: "Solicitud de ayuda"
 ENG_ba.3.desc: "Acepten este personal."
 ENG_ba.3.a: "Mejor que nada…"
 
 ENG_ba.4.t: "Identificación de debilidades"
 ENG_ba.4.desc: "Hemos encontrado sus puntos débiles."
 ENG_ba.4.a: "¡Eso es! ¡Justo esto!"

 ENG_ba.5.t: "El problema de Gehenna"
 ENG_ba.5.desc: "¡Gehenna, que ha ocupado ilegalmente el norte de Escocia, ha ignorado en repetidas ocasiones nuestras demandas de retirada!"
 ENG_ba.5.a: "Solo la violencia logrará calmarlos."

 ENG_ba.6.t: "¡Retirada de Gehenna!"
 ENG_ba.6.desc: "Tras la gran guerra librada en las Islas Británicas contra Kaiser Corporation, y con la victoria británica asegurada, Gehenna se retiró apresuradamente de Escocia llevándose consigo todas sus instalaciones."
 ENG_ba.6.a: "Increíble."

 ENG_ba.7.t: "Colapso de las colonias de ultramar"
 ENG_ba.7.desc: "Tras la derrota del Reino Unido ante entidades de otro mundo y su exilio en Canadá, llegan noticias de que las antiguas colonias imperiales están colapsando. El rey Eduardo VIII, exiliado en Canadá, parece profundamente conmocionado por la noticia y no ha emitido ninguna postura oficial."
 ENG_ba.7.a: "Oh no."

 ENG_ba.23.t: "Independencia de Egipto"
 ENG_ba.23.d: "En medio del caos extremo que sacude al Imperio, Egipto —que hasta ahora había permanecido bajo nuestra subordinación— ha declarado oficialmente su intención de expulsar nuestra influencia de su territorio. Tras largos años bajo la órbita del Imperio Británico, Egipto ha optado por el camino de la independencia, y con ello sentimos que el Imperio ya no conserva su antigua grandeza.\n\nLa declaración de independencia de Egipto provocará un fuerte impacto político en todo Oriente Medio y el norte de África, y sus repercusiones asestarían un duro golpe a la autoridad de nuestro Imperio. Crece la preocupación de que más colonias sigan este mismo camino, señal inequívoca de que la cohesión del Imperio Británico se está desmoronando."
 ENG_ba.23.a: "El Imperio Británico se derrumba."
 
 ENG_ba.24.t: "Retirada de África Oriental"
 ENG_ba.24.d: "Mientras el caos imperial se intensifica, hemos repatriado a todos los funcionarios coloniales para garantizar la seguridad de los británicos en África Oriental y evitar la pérdida de capital colonial.\n\nEsperamos que esta medida limite las pérdidas que podrían surgir del estado de anarquía y confusión en la región."
 ENG_ba.24.a: "Al menos evitamos lo peor."

 ENG_ba.25.t: "Dominio autónomo de África Occidental"
 ENG_ba.25.d: "Ante el continuo colapso de las antiguas colonias imperiales, hemos elevado África Occidental Británica al estatus de dominio autónomo para evitar su desintegración total. Con ello, las antiguas colonias de África Occidental adquieren un estatus similar al de Canadá y Australia."
 ENG_ba.25.a: "Es lo menos malo."

 ENG_ba.8.t: "Movimiento independentista intensificado en la India"
 ENG_ba.8.desc: "Tras la reciente derrota frente a entidades de otro mundo, las autoridades coloniales en la India han enviado informes inquietantes. Según estos, el movimiento independentista se está radicalizando en todo el subcontinente, y la ira popular se expresa de forma mucho más organizada y violenta que antes. En particular, las fuerzas comunistas están expandiendo rápidamente su influencia y declarando diversas formas de lucha contra el dominio británico. Salen a las calles, organizan fábricas y zonas rurales, y corean consignas antiimperialistas."
 ENG_ba.8.a: "La joya del Imperio se nos escapa de las manos."
 
 ENG_ba.9.t: "Partición de la India"
 ENG_ba.9.desc: "En el caótico Imperio de la India, los comunistas han iniciado una rebelión."
 ENG_ba.9.a: "Oh no."

 ENG_ba.10.t: "La división"
 ENG_ba.10.d: "Tras la repentina derrota británica, la India ha sido dividida, y ahora debemos tomar una decisión."
 ENG_ba.10.a: "¡Obtendremos la victoria en todos los territorios bajo el reinado de Su Majestad!"
 ENG_ba.10.b: "¡Luchen por la liberación del pueblo y la democracia!"
 ENG_ba.10.c: "¡Viva el Pakistán independiente!"

 ENG_ba.11.t: "Revolución india"
 ENG_ba.11.d: "Los disturbios se han transformado en motines, y los motines en revolución. Formaremos de inmediato un consejo para dirigirla."
 ENG_ba.11.a: "¡Romped las cadenas!"

 ENG_ba.12.t: "Manifestaciones masivas"
 ENG_ba.12.d: " Aunque miles de líderes políticos indios han sido encarcelados, la voluntad de resistencia colonial no solo no se ha quebrado, sino que arde con mayor intensidad. Lo que comenzó como marchas pacíficas se ha transformado en cierres comerciales, huelgas generales y resistencia campesina, extendiéndose y profundizándose en forma y alcance, sumiendo a la colonia en un torbellino.\n\nEl gobierno ha ordenado al virrey [RAJ.GetLeader] que tome medidas para sofocar la situación."
 ENG_ba.12.a: "¡Dispérsenlos de inmediato!"

 ENG_ba.13.t: "Levantamiento enemigo"
 ENG_ba.13.d: "En las regiones del noreste, individuos instigados por propaganda izquierdista han desatado disturbios a gran escala."
 ENG_ba.13.a: "¡Enfréntenlos!"

 ENG_ba.14.t: "Derrota"
 ENG_ba.14.d: "El ejército revolucionario resultó ser más fuerte de lo esperado, y las autoridades coloniales apenas pueden mantener sus fuerzas debido al drástico descenso del apoyo desde la metrópoli. Nuestra sede del virreinato en Delhi ha caído, y solo tras negociar con los revolucionarios hemos logrado un alto el fuego temporal."
 ENG_ba.14.a: "Hemos perdido gran parte del control."

 ENG_ba.15.t: "Consejo convocado"
 ENG_ba.15.d: "Decenas de miles de personas de toda la India —anticolonialistas, comunistas, demócratas, religiosos, intelectuales y trabajadores— se han reunido. Nos encontramos en un momento decisivo que determinará el presente y el futuro de la India, es decir, Bharat."
 ENG_ba.15.a: "¡Viva Bharat!"
 
 ENG_ba.16.t: "La industria de Bharat"
 ENG_ba.16.d: "Tras dos días de preparación, la asamblea se ha dividido en cuatro facciones, aparentemente según líneas ideológicas. Nehru, Bose, Pillai y Gandhi se han convertido en los líderes de cada una. Además, cada facción debate y examina diversas políticas para atraer al bloque moderado sin afiliación. Una semana después de la convocatoria del consejo, estalló el debate sobre el modelo de estructura industrial."
 ENG_ba.16.a: "¡Organicemos la economía sobre la base de cooperativas!"
 ENG_ba.16.b: "¡Nacionalicemos toda la economía y derroquemos a la clase capitalista!"
 ENG_ba.16.c: "¡Fomentemos el crecimiento mediante un mercado libre y empresas reguladas!"
 ENG_ba.16.e: "La agricultura es la base de toda nación. ¡Establezcamos una economía agrarista!"

 ENG_ba.17.t: "La defensa de Bharat"
 ENG_ba.17.d: "Con el debate industrial apaciguado, surgió un nuevo tema: la defensa. Las facciones se enfrentan ferozmente sobre la doctrina militar que Bharat debe adoptar."
 ENG_ba.17.a: "Implementemos la guerra móvil basándonos en estudiantes formados en Alemania."
 ENG_ba.17.b: "Estudiemos el empleo de grandes ejércitos con apoyo soviético."
 ENG_ba.17.c: "Desarrollemos nuestra propia artillería de campaña para lograr la autodefensa."
 ENG_ba.17.e: "Mejoremos y adoptemos la guerra de trincheras tradicional."

 ENG_ba.18.t: "La religión de Bharat"
 ENG_ba.18.d: "Cuando otro de los puntos en disputa parecía resolverse, el consejo disfrutó de una breve calma. Sin embargo, pronto estalló el debate sobre el estatus de la religión. Las facciones de Nehru y Pillai defendieron la completa exclusión de la religión del gobierno, mientras que las de Gandhi y Bose aceptaron la intervención religiosa."
 ENG_ba.18.a: "El pueblo necesita fe."
 ENG_ba.18.b: "La religión no debe intervenir en la política."

 ENG_ba.19.t: "La diplomacia de Bharat"
 ENG_ba.19.d: "Con el consejo acercándose a su fin, las facciones presentaron sus compromisos finales en política exterior. Pillai y la facción del Partido Comunista de Bharat abanderaron el internacionalismo socialista; la facción de Gandhi defendió la neutralidad perpetua y el pacifismo; mientras que Nehru y Bose promovieron una política expansionista basada en el nacionalismo de Bharat."
 ENG_ba.19.a: "La estabilidad es lo que la India necesita."
 ENG_ba.19.b: "Debemos liberar a otros pueblos oprimidos del mundo."
 ENG_ba.19.c: "¡Por el renacimiento de la nación Bharat!"

 ENG_ba.20.t: "Disolución"
 ENG_ba.20.d: "El periodo de sesiones del consejo ha concluido y finalmente se celebraron elecciones para el jefe de Estado."
 ENG_ba.20.a: "¡Viva el primer presidente, Chandra Bose!"
 ENG_ba.20.b: "¡El camarada Krishna Pillai liderará Bharat!"
 ENG_ba.20.c: "¡Jawaharlal Nehru ha sido elegido presidente!"
 ENG_ba.20.e: "¡Bajo el liderazgo del Mahatma Gandhi prosperaremos!"

 ENG_ba.22.t: "Otro levantamiento"
 ENG_ba.22.d: "En la región de Madrás, trabajadores, campesinos y estudiantes se han alzado contra la discriminación y la opresión existentes."
 ENG_ba.22.a: "Debemos planear que se unan a nosotros."

 ENG_ba.26.t: "Liverpool defendida"
 ENG_ba.26.d: "Gracias a la lucha total de los ciudadanos y del ejército británico, hemos logrado defender Liverpool. A partir de aquí podremos lanzar una contraofensiva o acelerar el plan de exilio."
 ENG_ba.26.a: "Una gran victoria."

 ENG_ba.100.t: "Gran Bretaña defendida"
 ENG_ba.100.d: "Gracias a la lucha total de los ciudadanos y del ejército británico, hemos logrado defender la patria británica. Ahora debemos reconstruir una nación devastada."
 ENG_ba.100.a: "Hemos superado el peor momento."

 ENG_ba.101.t: "Devastación de posguerra"
 ENG_ba.101.d: "Aunque logramos defender Gran Bretaña, los feroces combates en el territorio metropolitano han devastado profundamente al otrora hermoso país. De la reconstrucción dependerá la supervivencia del Reino Unido."
 ENG_ba.101.a: "\"Una rosa arrojada a la basura.\""

 ENG_ba.102.t: "Las preocupaciones de Baldwin"
 ENG_ba.102.d: "El gobierno británico ha regresado a la patria, pero enfrenta un problema aún mayor. El Parlamento, disuelto en octubre de 1935 para las elecciones periódicas, vio dichas elecciones pospuestas por la guerra contra Kaiser Corporation, y ahora..."
 ENG_ba.102.a: "\"Al menos debemos reunir al gabinete primero\""

