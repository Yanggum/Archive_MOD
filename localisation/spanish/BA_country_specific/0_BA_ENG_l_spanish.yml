 BEL_Leopold_III: "Leopoldo III"
 BEL_exile_shock: "Impacto del exilio"
 BEL_collapsed_army: "Ejército colapsado"
 BEL_resistance_problem: "Problema de la resistencia"

 COG_event.1.t: "¡Gran Bretaña se derrumba!"
 COG_event.1.desc: "Gran Bretaña ha colapsado ante entidades de otro mundo. Ya no recibimos ni siquiera recursos, y las colonias están infestadas de insurgentes; el caos interno es incontrolable. Sea como sea, el destino de Bélgica es sombrío."
 COG_event.1.a: "Maldita sea."

 COG_event.2.t: "Estallan disturbios"
 COG_event.2.desc: "Los nativos del Congo han comenzado a cuestionar nuestro dominio, y con la caída de Gran Bretaña su ira ha estallado. El dueño del Congo podría cambiar. Debemos actuar de inmediato."
 COG_event.2.a: "¡Reprímanlos a todos, rápido!"

 COG_event.3.t: "¡Los disturbios se convierten en guerra civil!"
 COG_event.3.desc: "En respuesta a la represión violenta del gobierno ante los disturbios nacionales, los nativos del Congo se han levantado en rebelión."
 COG_event.3.a: "Que Dios nos ayude."
