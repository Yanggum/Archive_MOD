 RE4_redwinter_military_advisors: "Asesores Militares de Red Winter"
 RE4_redwinter_military_advisors_desc: "Con el envío de asesores militares desde la patria, podemos planificar operaciones más refinadas y lanzar ofensivas más agresivas. Es hora de liderar el campo de batalla sin vacilaciones."
 RE4_redwinter_military_advisors_remove_tt: "\nCondición para eliminarlo: Estar en paz con §Y@FIN[FIN.GetAdjective]§!"
 RED_redwinter_military_advisors: "$RE4_redwinter_military_advisors$"
 RED_redwinter_military_advisors_desc: "La aventura hacia Finlandia enfrenta más resistencia de la esperada. Para superar este estancamiento, se envían asesores militares para reforzar la ofensiva y asegurar información estratégica."
 RED_redwinter_military_advisors_remove_tt: "\nCondición para eliminarlo: Estar en paz con §Y[RE4.GetName]§!"
