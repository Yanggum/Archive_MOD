 RED_northern_sovereignty_war:0 "Guerra de Soberanía del Norte"
 RED_northern_sovereignty_war_desc:0 "El §YGobierno Militar§! establecido en territorios de §YDinamarca§!, §YNoruega§! y §YSuecia§! suele considerarse parte de la Academia Federal de Invierno Rojo, pero ahora, mientras se prepara la §YGuerra de Soberanía del Norte§!, los intentos por §Gcooptar§! al Gobierno Militar están siendo liderados por [RENSW_RED_leader_ADJ] y [RENSW_RE4_leader_ADJ]. Si se pierde la competencia de influencia, el §YGobierno Militar§! participará en la §YGuerra de Soberanía del Norte§! del §Rlados enemigo§!.\n\nEn términos de influencia, durante la §YGuerra de Soberanía del Norte§! el §YGobierno Militar§! seguirá al bando de §g[RENSW_RE4_leader_ADJ]§!, pero si la influencia de §S[RENSW_RED_leader_ADJ]§! llega a 100, ese §YGobierno Militar§! entrará en el bando de §S[RENSW_RED_leader_ADJ]§!."

 redpuppet.1000.t:0 "¡Guerra de Soberanía del Norte!"
 redpuppet.1000.desc:0 "La guerra civil de Invierno Rojo ha comenzado. Tras años de luchas internas, entre innumerables golpes, revoluciones y la amenaza constante de caer una y otra vez, la Oficina de Invierno Rojo finalmente se ha fracturado. Ahora, estos dos bandos combaten en las calles por el control del país.\n\n[RE4.GetLeader] se ha proclamado líder de la Academia Federal de Invierno Rojo, y desde su capital provisional en [RE4.Capital.GetName], lidera la guerra civil contra [RED.GetLeader]."
 redpuppet.1000.a:0 "¡Prepárense para el combate!"

