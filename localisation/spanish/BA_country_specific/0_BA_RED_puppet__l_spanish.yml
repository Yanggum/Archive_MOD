# Eventos redpuppet
 redpuppet.1.t: "Solicitud de Suministros de [RE4.GetName]"
 redpuppet.1.d: "El levantamiento espontáneo de milicianos estudiantiles inició la ofensiva hacia Finlandia, y Red Winter esperaba una victoria rápida. Sin embargo, la guerra se ha prolongado, agotando los suministros del Comité de Defensa. Sin apoyo adicional, mantener el frente será imposible. Se solicita ayuda urgente desde la patria."
 redpuppet.1.a: "¡Por supuesto!"
 redpuppet.1.b: "Nosotros también estamos escasos..."
 redpuppet.2.t: "Solicitud Rechazada por [FROM.GetName]"
 redpuppet.2.desc: "Pese a nuestras súplicas, [FROM.GetName] rechazó la solicitud alegando su propia escasez de armas. Tendremos que superar este obstáculo solos."
 redpuppet.2.a: "Hoy el viento sopla particularmente frío..."
 redpuppet.3.t: "Solicitud Aceptada por [FROM.GetName]"
 redpuppet.3.desc: "¡[FROM.GetName] aceptó nuestra solicitud! Los suministros ahora llegan en trenes incesantes, revitalizando nuestro frente."
 redpuppet.3.a: "¡A atacar, es hora de la ofensiva!"
 redpuppet.4.t: "Solicitud de Asesores Militares de [RE4.GetName]"
 redpuppet.4.desc: "[RE4.GetName], formado por milicias estudiantiles, muestra signos de agotamiento tras la prolongada guerra contra [FIN.GetAdjective]. Solicitan asesores militares urgentemente."
 redpuppet.4.a: "¿Por qué no ayudarles?"
 redpuppet.5.t: "[FROM.GetName] Envía Asesores Militares"
 redpuppet.5.desc: "¡[FROM.GetName] ha aceptado enviar asesores militares! Con su apoyo, esperamos concluir pronto esta guerra."
 redpuppet.5.a: "¡Una noticia excelente!"
 redpuppet.6.t: "[FROM.GetName] Rechaza Enviar Asesores"
 redpuppet.6.desc: "¿En serio nos rechazaron?"
 redpuppet.6.a: "ㅋㅋ (risa coreana, equivalente a LOL)"
 redpuppet.7.t: "Solicitud de Oficiales de [RE4.GetName]"
 redpuppet.7.desc: "[RE4.GetName] necesita líderes experimentados. Proponen seleccionar dos generales para reforzar su estructura militar."
 redpuppet.7.a: "$RED_marina$ — Su capacidad ofensiva es confiable."
 redpuppet.7.b: "$RED_Tomoe$ — Su planificación es casi perfecta."
 redpuppet.7.c: "Que se las arreglen solos."
 RE4_she_is_leader_tt: "\nEsta persona será §YLíder del Comité de Defensa de @RE4[RE4.GetName]§!"
 redpuppet.8.t: "[FROM.GetName] Acepta Enviar Oficiales"
 redpuppet.8.desc: "Título igual al contenido."
 redpuppet.8.a: "¡Una gran noticia!"
 redpuppet.9.t: "[FROM.GetName] Rechaza Enviar Oficiales"
 redpuppet.9.desc: "[FROM.GetName] nos dice que resolvamos solos nuestros problemas."
 redpuppet.10.t: "La Guerra de Invierno"
 redpuppet.10.desc: "Tras vencer a Noruega, Dinamarca y Suecia, Red Winter no se detuvo. En Kemi, Finlandia, estudiantes locales se levantaron espontáneamente, formando un Comité de Defensa que ahora avanza hacia el sur. La gran guerra por Finlandia está por comenzar."
 redpuppet.10.a: "¡Hacia el sur!"
 redpuppet.10.b: "¡Defenderemos nuestra patria!"
 redpuppet.11.t: "Victoria de [RE4.GetName] en la Guerra de Invierno"
 redpuppet.11.desc: "Tras duros combates, [RE4.GetName] capturó $VICTORY_POINTS_11105$. Las tropas marchan victoriosas bajo la mirada atónita de los locales."
 redpuppet.11.a: "¡Una gran victoria!"
 redpuppet.12.t: "Derrota de [RE4.GetName] en la Guerra de Invierno"
 redpuppet.12.desc: "[RE4.GetName] fue finalmente derrotado tras la feroz resistencia finlandesa. La liberación de Kemi es celebrada con fiestas y fuegos artificiales."
 redpuppet.12.a: "..."
 redpuppet.13.t: "[RED.GetName] Decide Invertir"
 redpuppet.13.desc: "[RED.GetName] ha aprobado un plan de inversión industrial en [925.GetName]."
 redpuppet.13.a: "Gran ventaja."
 redpuppet.14.t: "Fundación de la Comisión Autónoma de Finlandia"
 redpuppet.14.desc: "Tras la caída del gobierno finlandés, Red Winter estableció una nueva administración autónoma. Sin embargo, esta Comisión se resiste a aceptar control directo de Red Winter."
 redpuppet.14.a: "Rebeldes insolentes."
 redpuppet.15.t: "Comité de Supervisión"
 redpuppet.15.desc: "Ante la actitud desafiante de Finlandia, Red Winter establece un Comité de Supervisión para monitorear sus decisiones económicas y políticas clave."
