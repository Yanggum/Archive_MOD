 RED_second_great_northern_war:0 "Segunda Gran Guerra del Norte"
 RED_second_great_northern_war_desc:0 "El §YGobierno Militar§! establecido en territorios de §YDinamarca§!, §YNoruega§! y §YSuecia§! suele considerarse parte de la Academia Federal de Invierno Rojo, pero ahora que Finlandia ha organizado un amplio Comité de Exiliados Nórdicos y clama por la §YSegunda Gran Guerra del Norte§!, los intentos por §Gtomar el control§! de los Gobiernos Militares en cada región están siendo liderados por §SInvierno Rojo§! y §CFinlandia§!.\n\nEn términos de influencia, durante la §YSegunda Gran Guerra del Norte§! el §YGobierno Militar§! suele mantenerse neutral; sin embargo, si §SInvierno Rojo§! y §CFinlandia§! llegan a dominar por completo todas las esferas de influencia, estallará la §RGuerra Civil Nórdica§! y se desbloquearán varias decisiones para apoyar la guerra civil."

