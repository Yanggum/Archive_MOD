 RE4_investment_in_finland_tt:0 "Cada vez que este enfoque se complete, §Y[RE4.GetNameWithFlag]§! obtendrá el espíritu nacional §YInfluencia de Invierno Rojo§!, que en caso de estallar la §YGuerra de Soberanía del Norte§!, si §Y[RED.GetNameWithFlag]§! está en guerra, aplicará un §R-1%§! al ataque de divisiones (acumulable hasta §R-25%§!). (Actual: [?RE4.RE4_investment_in_finland|+.0%])"
