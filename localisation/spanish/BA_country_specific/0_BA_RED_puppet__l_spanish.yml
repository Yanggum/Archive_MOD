 redpuppet.2000.t:0 "Victoria en el frente [FROM.GetAdjective]"
 redpuppet.2000.desc:0 "El persistente apoyo de Suomi y la lucha abnegada del Comité de Exiliados Nórdicos finalmente han dado frutos. Desde hoy, las fuerzas del Gobierno Militar de Invierno Rojo que operaban en las sombras en [FROM.GetAdjective] han sido expulsadas por completo, y la guerra civil por la libertad ha llegado a su fin con nuestra victoria.\n\nEn la capital, donde el fuego de la guerra por fin se apagó, se estableció un nuevo gobierno alineado con nosotros. El gobierno naciente expresó su profunda gratitud por la ayuda de Finlandia, que liberó al país de la cruel dominación de Invierno Rojo, y juró, bajo nuestro liderazgo, salvaguardar juntos la libertad y la estabilidad del norte.\n\nEsto es un gran hito logrado frente al expansionismo de Invierno Rojo, y será un escudo que fortalecerá aún más nuestra frontera septentrional."
 redpuppet.2000.a:0 "¡Una victoria magnífica!"

 redpuppet.2001.t:0 "Revés en el frente [FROM.GetAdjective]"
 redpuppet.2001.desc:0 "Han llegado noticias dolorosas desde el Gobierno Militar. Debido a la persistente ofensiva de los títeres finlandeses y la agitación de fuerzas rebeldes internas, nuestro Gobierno Militar estacionado en [FROM.GetAdjective] ha colapsado al fin.\n\nLos reaccionarios, respaldados por el apoyo finlandés, han tomado la capital y han establecido un nuevo gobierno títere. Nuestros soldados supervivientes se retiran con dificultad más allá de la frontera. Esta derrota ha asestado un duro golpe al prestigio de la Academia Federal de Invierno Rojo y ha provocado un grave vacío en nuestra influencia en el norte de Europa.\n\nNo olvidaremos jamás esta derrota, y algún día cobraremos esta deuda."
 redpuppet.2001.a:0 "¡Maldita sea!"

 redpuppet.2100.t:0 "Revés en el frente [FROM.GetAdjective]"
 redpuppet.2100.desc:0 "Ha llegado un informe desesperanzador desde el Gobierno Militar. El Comité de Exiliados Nórdicos, que luchaba por la libertad de [FROM.GetAdjective], y nuestras fuerzas de apoyo que los asistían, finalmente se han derrumbado ante la abrumadora ofensiva del Gobierno Militar de Invierno Rojo.\n\nLa capital ha caído, y los combatientes por la libertad que resistían han sido ejecutados o arrastrados a campos de internamiento. Esta derrota no es sólo un revés militar: es una tragedia en la que se ha quebrado nuestra esperanza por la libertad del norte. Las botas de acero de Invierno Rojo ya han llegado hasta las puertas mismas de nuestra frontera. Debemos prepararnos para pruebas aún más duras."
 redpuppet.2100.a:0 "¡Maldita sea!"

 redpuppet.2101.t:0 "Victoria en el frente [FROM.GetAdjective]"
 redpuppet.2101.desc:0 "¡Han llegado espléndidas noticias de victoria desde el Gobierno Militar! Hemos reprimido con éxito a las fuerzas rebeldes en [FROM.GetAdjective], instigadas por los reaccionarios finlandeses, y hemos vuelto a hacer ondear nuestra bandera roja en la capital.\n\nAl purgar a los enemigos internos y rechazar a los títeres más allá de la frontera, el gobierno revolucionario de [FROM.GetAdjective] se ha fortalecido aún más. Esta victoria demuestra una vez más la fortaleza de la Academia Federal de Invierno Rojo, infundiendo temor en nuestros enemigos y esperanza en nuestros camaradas.\n\nLa estabilidad del norte ha quedado asegurada, y ahora podremos concentrar nuestras fuerzas en la liberación de otros lugares."
 redpuppet.2101.a:0 "¡Una victoria magnífica!"

