 ABY_new_event.153.t:0 "Un libertador inesperado"
 ABY_new_event.153.d:0 "Asunto: Liberación de toda Austria e integración en la Federación\nRemitente: Comandante de la guarnición de Linz, Asagiri Suou\n\nResumen del informe:\nTras la entrada del ejército de la coalición en Linz y Horn, la resistencia de Shanhaijing ha sido menor de lo esperado. Cabe destacar la reacción de los habitantes locales de Austria: están recibiendo a nuestras fuerzas con entusiasmo, definiéndonos como «libertadores de Shanhaijing». Este apoyo ya no es mera simpatía, sino que evoluciona hacia una voluntad activa de cooperación. Se propone aprovechar la situación para liberar toda Austria e integrarla como nuevo miembro de la Federación.\n\nEn la sala del Consejo Supremo de Karlovy Vary, al terminar la lectura, Beneš abrió la boca con una expresión satisfecha.\n\n«Desde el punto de vista estratégico, es una oportunidad inmejorable. Eliminaremos por completo la amenaza de la frontera sur y podremos extender nuestra influencia hasta el Danubio.»\n\nComo si fuera obvio, miró a Henlein. Henlein se frotó el mentón un instante y habló con cautela.\n\n«Sin duda, las ventajas estratégicas son claras. Pero hay un punto que debemos considerar. Como saben, nuestra coalición se sostiene sobre tres pilares singulares: los checos, Abydos y los alemanes “sudetes”. Ese equilibrio es nuestra fuerza.»\n\nSu voz era racional y serena.\n\n«Si aceptamos a Austria, emergerá una categoría más amplia: “los alemanes”. Y entonces podría diluirse la posición y el papel propios que los sudetes hemos construido. Por la estabilidad de la Federación, quizá lo correcto sea fortalecer primero la cohesión de los miembros actuales.»\n\nNo pronunció ni una sola vez las palabras “nacionalismo sudete”, pero su intención era inequívoca. El rostro de Beneš se endureció sutilmente. En ese momento, Ayane, que había guardado silencio, intervino.\n\n«Estoy de acuerdo con la prudencia del señor Henlein. Los roles y derechos de los tres pilares que forman la base de la Federación son más importantes que nada. Entonces, ¿qué les parece si aprovechamos esta oportunidad para dejarlo aún más claro?»\n\nAyane cruzó miradas con Beneš, y Beneš captó su intención y asintió brevemente. Ayane se volvió hacia Henlein.\n\n«Antes de aprobar la operación, reafirmemos oficialmente los principios fundamentales de la Federación mediante un juramento. Que Chequia y Abydos reconozcan a los “alemanes sudetes” como un miembro propio e independiente de nuestra Federación, y prometan que su autonomía y sus derechos no serán vulnerados en ninguna circunstancia futura.»\n\nUna leve sonrisa apareció en los labios de Henlein. Había obtenido exactamente lo que quería.\n\n«La propuesta de la señorita Ayane es muy razonable. Si esa promesa se antepone, yo también apoyaré gustosamente la expansión de la Federación.»"
 ABY_new_event.153.a:0 "En la conversación de esos políticos tan curtidos, la «Nación de Dos Mundos» decidió por unanimidad avanzar hacia el sur."

