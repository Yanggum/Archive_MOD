 ABY_political:0 "Lucha por la influencia"
 ABY_political_desc:0 "\nTexto provisional: varias etnias y facciones están mezcladas y compiten por la influencia.\n\n\n§Y¡Tras recuperar Bohemia, la dirección política se decidirá según la situación política!§!\n\nSi §2la Democracia§! está §Yen el poder§!, el poder se transferirá al Gobierno Provisional Checo.\n\nSi §Rel Comunismo§! está §Yen el poder§!, ???\n\nSi §Lel Fascismo§! está §Yen el poder§!, renacerá la República de Austria.\n\nSi §gNo Alineado§! está §Yen el poder§!, la Preparatoria Abydos tomará la iniciativa.\n§Y¡Si completas el enfoque de control económico de Abydos, el Grupo Neftis tomará la iniciativa!§!\n"
