 ABY_new_event.120.t:0 "¿El socialismo iza la bandera blanca?"
 ABY_new_event.120.d:0 "Nuestras victorias consecutivas han aplastado su esperanza. Nuestros soldados, que avanzan sin cesar hacia el este de Europa, informan de un frente que se está derrumbando a un ritmo grave —o comparable a ello—. Si estos reportes son ciertos, el colapso total del ejército ruso está a las puertas… o quizá ya haya comenzado.\n\nEsta mañana, el gobierno soviético en Moscú, a diferencia de la actitud que nos mostró en el pasado, proclamó que no rechazará ninguna rendición condicionada y nos ofreció la paz. A cambio de entregarnos vastos territorios de Europa Oriental —incluyendo las estepas de chernozem y las ciudades portuarias de Crimea—, desean una paz permanente y, con una actitud desesperada, parecen suplicar nuestra misericordia. La opinión pública está fuertemente dividida, pero ocupar Rusia por completo conlleva enormes dificultades. Considerando su potencial, la mejor forma de asegurar la hegemonía de Abydos y bloquear la amenaza rusa durante décadas podría ser la paz."
 ABY_new_event.120.a:0 "Por supuesto. Celebremos nuestra gloriosa victoria."
 ABY_new_event.120.b:0 "Nos dirigiremos al lejano Extremo Oriente."

