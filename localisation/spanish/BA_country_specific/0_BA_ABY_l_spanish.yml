 ABY_descision_focus_event.1.t:0 "El juramento de Bohemia"
 ABY_descision_focus_event.1.d:0 "A inicios de 1936, el ayuntamiento de Karlovy Vary se encontraba abarrotado de quienes deseaban ser testigos de una nueva historia. El gobierno provisional checo, la delegación representante de los alemanes sudetes, y las estudiantes de la Academia Abydos, situadas en el centro de todos estos cambios. En medio de una atmósfera solemne, Edvard Beneš subió al estrado. Su voz era baja, pero tenía la fuerza suficiente para grabarse con claridad en los oídos de todos.\n\n\"Queridos ciudadanos checos. Hemos perdido nuestra capital, Praga. Sin embargo, jamás hemos perdido nuestro espíritu. Nuestro objetivo es claro: la liberación completa de Chequia. Declaro solemnemente aquí que dedicaremos todos nuestros esfuerzos hasta el día en que nuestra soberanía vuelva a erguirse firmemente en esta tierra.\"\n\nAnte aquella declaración silenciosa pero firme, los checos en el público asintieron con expresiones severas. En lugar de un aplauso ensordecedor, un silencio cargado de determinación cubrió la sala. Poco después, Tomáš Masaryk, respetado por todos, subió al estrado.\n\n\"Tal como dice el señor Beneš, debemos recuperar nuestra patria. Pero debemos recordar algo importante: esta tierra ya no es solo nuestra, sino también el hogar de vecinos que vivirán junto a nosotros. Una nación verdadera no se completa solo con la recuperación del territorio, sino cuando personas distintas forman una comunidad en armonía. Respetemos nuestras diferencias y construyamos juntos el mañana.\""
 ABY_descision_focus_event.1.a:0 "Cada pueblo alzó su propia voz para gritar: ¡Viva!"
 
 ABY_descision_focus_event.2.t:0 "La voz de los Sudetes"
 ABY_descision_focus_event.2.d:0 "Tras Masaryk, Konrad Henlein, representante de los alemanes sudetes, subió al estrado. Comenzó su discurso con un tono sereno, sin dejar aflorar sus emociones.\n\n\"Honorables compatriotas sudetes. Durante demasiado tiempo hemos vivido privados de nuestra voz. Nuestros derechos legítimos deben ser garantizados, y la patria del sur que nos fue arrebatada debe volver a nuestros brazos. Esta es una exigencia de supervivencia, y no aspiramos a nada más que eso. Solo deseamos proteger nuestra tierra natal.\"\n\nEl discurso contenido y pulido de Henlein despertó una profunda empatía y una firme cohesión entre los residentes de origen alemán. Cuando él descendió del estrado, Ludwig Czech, de semblante afable, tomó el micrófono. Con una sonrisa suave, dijo:\n\n\"El deseo de proteger nuestra patria es el mismo para todos nosotros. Hoy, nuestra patria se ha vuelto más amplia, gracias a nuestros vecinos checos y a los invitados llegados de Abydos. Cuando hablemos de nuestros derechos, demostremos la madurez de considerar también los derechos de ellos. Solo cuando escuchemos las historias del otro, podremos convertirnos en verdaderos vecinos.\""
 ABY_descision_focus_event.2.a:0 "Un aplauso atronador envolvió la sala."
 
 ABY_descision_focus_event.3.t:0 "La promesa de Abydos"
 ABY_descision_focus_event.3.d:0 "La última oradora fue Takanashi Hoshino, de la Academia Abydos. Subió al estrado con su característica expresión adormilada.\n\n\"Uhee~ bueno, no sé decir cosas tan grandilocuentes. Nosotros solo necesitábamos un lugar donde poder vivir seguros junto a nuestros kouhai y amigos, y por eso llegamos hasta aquí. Ojalá este lugar pueda convertirse en algo así. Y a los que se atrevan a meterse con los nuestros, no los dejaremos en paz. Ese es el único principio de Abydos.\"\n\nLa sinceridad contenida en aquellas palabras sin adornos conmovió el corazón del público. Cuando Hoshino se retiró, Okusora Ayane cerró los discursos con una voz calmada.\n\n\"Nuestro comienzo fue proteger a nuestros compañeros. Y ahora hemos comprendido que todos los aquí reunidos debemos convertirnos en compañeros que se protegen mutuamente. La soberanía de Chequia, los derechos de los Sudetes, la seguridad de Abydos. Todo ello converge en un único objetivo: nuestra prosperidad común. Hoy no damos simplemente un paso hacia un acuerdo, sino el primer paso como una comunidad de destino que construirá un nuevo futuro en conjunto.\"\n\nCon la declaración de Ayane, los tres representantes firmaron el acuerdo. Personas de distintos orígenes, ideologías e incluso mundos sellaron esta profunda promesa. Así, el \"Estado de los Dos Mundos\" nació oficialmente, cargando tanto esperanza como desafíos."
 ABY_descision_focus_event.3.a:0 "El primer capítulo de una historia de armonía nacida del odio."

 ABY_descision_focus_event.4.t:0 "La estabilidad recuperada"
 ABY_descision_focus_event.4.d:0 "Informe de operación militar: Caso Katakata, Nº 107\n\nTras la caída de la última base del Sector 8, la cúpula dirigente del Grupo del Casco Katakata, que había huido, sometió a las tropas fronterizas en dirección a Egeland e intentó solicitar asilo en Hyakkiyako. Sin embargo, al verse obligados a retroceder hacia el puesto de vigilancia tras un ataque del ejército de Hyakkiyako, fueron detectados por los centinelas y, con la intervención de la gendarmería, se logró su captura.\nNota: La comandante de la gendarmería, Sunaookami Shiroko, lideró personalmente la vanguardia.\n\nLas facciones leales del grupo del casco que realizaban actividades de guerrilla en distintos sectores cesaron mayoritariamente sus operaciones y se rindieron tras la detención de sus líderes.\n\nDebido al elevado número de rendidos y capturados, se determinó que no era un asunto que debiera ser gestionado por el ejército, por lo que la autoridad de decisión fue transferida al gobierno.\n\n\nInforme: Comisión Jurídica, Nº 782\n\nSegún la legislación vigente, no deben ser considerados prisioneros de guerra, sino rebeldes, en cuyo caso la mayoría de los miembros sería encarcelada.\nNo obstante, conforme a la Ley de Poderes de Emergencia promulgada mediante la Orden Administrativa Nº 111, es posible considerarlos fuerzas de resistencia, en cuyo caso serían tratados como prisioneros de guerra, permitiéndoseles el asilo o un servicio militar limitado.\n\nResumen: Dependiendo de la interpretación legal, pueden ser clasificados como fuerzas de resistencia o como rebeldes, y el trato variará en consecuencia. Por lo tanto, la decisión queda delegada en el poder ejecutivo."
 ABY_descision_focus_event.4.a:0 "Considéralos rebeldes y somételos a juicio."
 ABY_descision_focus_event.4.b:0 "Cada combatiente cuenta. Considéralos fuerzas de resistencia."

 ABY_descision_focus_event.5.t:0 "El Valle de las Presidentas Estudiantiles"
 ABY_descision_focus_event.5.d:0 "Cuando la búsqueda de personas de Kivotos dentro del gobierno provisional estaba llegando a su fin, la milicia organizó un destacamento de búsqueda y se dirigió al Valle de las Presidentas Estudiantiles. A pesar de ser una región casi deshabitada, el valle, que contaba con la mayor área de transferencia dentro de Abydos, retrasó la operación debido a su entorno inhóspito y su enorme extensión.\n\nSolo tras reunir cerca de 200 efectivos y completar el entrenamiento de adaptación fue posible ingresar en la zona.\nSin embargo, por más que avanzaron hacia el interior del valle, no se escuchaba ni rastro de presencia humana, ni siquiera el sonido de pequeños animales.\n\n\"¿De verdad hay algo aquí?\"\n\"Eso parece... ya casi anochece...\"\n\"¿Eh? ¡Allí hay algo!\"\n\"¿Qué?\"\n\nEl destacamento se aproximó a una gigantesca silueta negra visible a lo lejos, y al llegar frente a ella, se quedaron sin palabras.\n\n\"Eso es... ¿qué es eso...?\"\n\"Oye, dime algo. ¿En Kivotos hay cosas así caminando por ahí?\"\n\"No... yo tampoco había visto algo así antes...\"\n\"Tiene el emblema de Abydos. Y eso es... ¿de Gehenna...?\"\n\nFrente al tren blindado negro, armado con cañones y tan alto como un edificio, permanecieron atónitos por un largo momento."
 ABY_descision_focus_event.5.a:0 "¿Fotos? ¿Alguien tiene una cámara?"

 ABY_descision_focus_event.6.t:0 "El legado del Señor del Trueno"
 ABY_descision_focus_event.6.d:0 "La información sobre esta arma secreta fue estrictamente ocultada, y se celebró una reunión a la que solo asistieron unos pocos altos mandos.\n\n\"...El cañón ferroviario Shemata. Un arma que lleva el nombre de la legendaria presidenta estudiantil que puso fin al periodo de caos de Abydos y condujo a la academia a su época de mayor esplendor.\"\n\n\"Entonces, ¿cuáles son sus especificaciones?\"\n\n\"Está equipado con un cañón naval triple de 203 mm como armamento secundario, dos cañones navales simples de 152 mm, seis cañones dobles de 127 mm, y como armamento principal, una torreta de plasma de 500 mm. Según la descripción, puede disparar proyectiles de una tonelada de peso hasta una distancia de 500 km.\"\n\"Con un radio de 500 km, todo el territorio alemán entra dentro de su alcance desde su ubicación actual.\"\n\nAnte unas especificaciones tan absurdas, la sala se llenó de murmullos.\nTanto en la Tierra como en Kivotos se había investigado continuamente el desarrollo de armas de gran poder, pero esta arma asimétrica, aparecida de repente como un cometa, tenía el potencial de elevar a este pequeño país a la categoría de potencia hegemónica, al menos en términos de poder militar.\n\n\"Sin embargo, el hecho de que sea el legado del Señor del Trueno resulta inquietante... Solo con poseer este legado, las academias de Kivotos intentarán destruirnos, o más exactamente, destruir el cañón ferroviario, en cuanto tengan la oportunidad.\"\n\n\"Pero destruir esta arma supondría una pérdida nacional, y el coste de hacerlo de forma segura sería astronómico. Tal como dijo la secretaria Ayane, si poseerla ya nos convierte en un objetivo y no podemos destruirla, ¿no sería mejor utilizarla?\"\n\nA pesar de haber obtenido una arma tan poderosa, el debate no cesaba debido a las diferencias de perspectiva entre los habitantes de Kivotos y los locales."
 ABY_descision_focus_event.6.a:0 "Hasta que llegó una llamada."

 ABY_descision_focus_event.7.t:0 "El arma de la ruina"
 ABY_descision_focus_event.7.d:0 "\"Sí, aquí el gabinete del gobierno provisional de coalición...\"\n\"Secretaria Ayane, creo que debería atender usted.\"\n\"Es Gehenna.\"\n\nUna llamada del jefe de inteligencia del Comité de Disciplina de Gehenna. La información sobre el cañón ferroviario Shemata debía ser estrictamente confidencial, ¿cómo se había filtrado? Ayane no podía ni siquiera imaginarlo. El contenido de la llamada fue simple: para Gehenna, el cañón ferroviario Shemata era el indeseable legado del Señor del Trueno, una peligrosa arma de destrucción masiva. El departamento de inteligencia comunicó que su intención era destruirlo.\n\nTras finalizar la breve pero pesada llamada, Ayane habló.\n\n\"La existencia de Shemata... se ha filtrado. Gehenna ya lo sabe.\"\n\nGehenna conocía la información sobre Shemata y exigía su desmantelamiento a cambio de apoyo militar. Ante este hecho, la sala de reuniones se agitó.\n\n\"¡Es imposible! ¡Era información gestionada como ultrasecreta! ¿Cómo pudieron...\"\n\"¡El departamento de inteligencia de Gehenna debe haber intervenido! ¡Esto es una clara injerencia en nuestros asuntos internos!\"\n\"Aun así, al menos no nos exigen incondicionalmente que destruyamos el cañón. Han puesto como condición el apoyo militar.\"\n\"¡Y ni siquiera sabemos cuán útil será ese apoyo! ¡Quizá nos convenga más conservar el cañón!\"\n\nSe desató un fuerte alboroto dentro del gobierno provisional de coalición. Ayane no poseía el carisma necesario para imponer orden. Se limitó, como secretaria, a organizar las opiniones de los representantes de Kivotos y de los locales hasta que se alcanzara un consenso. Afortunadamente, la discusión no degeneró en un enfrentamiento grave. Todos coincidían en una cosa: era necesaria una respuesta rápida.\n\nLa conclusión fue clara. Ayane volvió a tomar el auricular.\n\n\"Hemos considerado su propuesta de manera positiva.\""
 ABY_descision_focus_event.7.a:0 "...El cañón ferroviario Shemata debe ser destruido."
 ABY_descision_focus_event.7.b:0 "...Pero no podemos aceptar una injerencia en nuestros asuntos internos."

 ABY_descision_focus_event.8.t:0 "Solicitud de apoyo"
 ABY_descision_focus_event.8.d:0 ""
 ABY_descision_focus_event.8.a:0 "Solicitemos ayuda."

 ABY_descision_focus_event.9.t:0 "Proclamación del gobierno federal"
 ABY_descision_focus_event.9.d:0 "La instauración del gobierno federal se llevó a cabo con rapidez... de una forma extrañamente rápida.\n\nGracias a los esfuerzos de Masaryk, las sospechas que Beneš albergaba hacia Abydos se disiparon con celeridad, pero tras su muerte, los agitadores de Chequia y Austria avivaron la pequeña chispa de duda que aún permanecía en el corazón de Beneš.\n\nEdvard Beneš. Uno de los tres héroes de la independencia checoslovaca y discípulo del padre de la patria, Tomáš Masaryk. Precisamente por ello, durante el proceso de formación del nuevo gobierno aceptó casi íntegramente los consejos de Masaryk.\n...De no haber sido por esos agitadores, los habría aceptado todos.\n\nAl final, otorgó solo una autoridad mínima al Comité de Contramedidas de Abydos y aplicó políticas de represalia contra Hyakkiyako y Shanhaijing.\n\n\"Después de todo, ni siquiera él puede ser perfecto siempre.\"\n\"La resistencia de los kivotosianos de Hyakkiyako y Shanhaijing es menor de lo esperado...\"\n(Según las afirmaciones de las chicas de Abydos) \"La obsesión de los kivotosianos por las armas de fuego es tremenda... aparte de que la mitad de Shanhaijing —quizá algo llamado la Puerta del Dragón Negro— se alzó en rebelión armada tras la orden de confiscación, no hubo una resistencia organizada significativa...\"\n\n\"Podemos adoptar una postura aún más dura.\""
 ABY_descision_focus_event.9.a:0 "Su mirada era fría, pero en su interior ardía la chispa de la venganza."

 ABY_descision_focus_event.10.t:0 "El Comité de Contramedidas"
 ABY_descision_focus_event.10.d:0 "\"¡Nos engañaron! ¡Nos engañaron por completo!\"\n\n\"S-Serika, tranquilízate...\"\n\n\"Sí. Yo voy a ir ahora mismo a...\"\n\n\"¡Senpai Shiroko!\"\n\n\"Uhee~, eso no se puede, Shiroko-chan.\"\n\n\"Ah, senpai Hoshino...\"\n\n\"Eso es algo que debe hacer este viejo.\"\n\n\"...\"\n\n\"Mmm~ pensé que me había vuelto bastante cercana a Beneš, así que esto me decepciona un poco...\"\n\n\"Ajajá... ejem, pero piénsenlo todos un poco.\"\n\"Aunque fue a petición del profesor, en realidad este no era nuestro trabajo, ¿no?\"\n\"No aceptamos esa propuesta para imponer nuestra autoridad, ¿cierto?\"\n\n\"Bueno...\"\n\"Eso es verdad.\"\n\n\"En cierto modo, quizá esto era lo que tenía que pasar. El profesor nos pidió que ayudáramos a Beneš, no que lo hiciéramos todo por él.\"\n\"Viéndolo bien, el profesor le confió la gestión del país a Beneš, así que puede decirse que todo salió según lo previsto.\"\n\"Y Beneš es una persona inteligente, ¿no? Seguro que lo hará bien.\"\n\n\"Sí... aun así me siento traicionada. ¿Tú no, Ayane? El profesor reconoció tanto a Beneš como a ti como sucesores.\"\n\n\"Mentiría si dijera que no me queda ninguna pena. Pero hemos corrido sin parar estos últimos años. Aunque el comité se haya disuelto y todos, excepto Nonomi-senpai, se gradúen por distintas circunstancias, poder reunirnos así para hablar me hace sentir como si hubiéramos vuelto al antiguo comité de contramedidas, y eso me gusta.\"\n\n\"Uhee~, sí, si Ayane lo ve así~ entonces hagamos lo mejor que podamos desde nuestro lugar.\""
 ABY_descision_focus_event.10.a:0 "¡Oooh!"

 ABY_descision_focus_event.11.t:0 "Víctima convertida en agresor"
 ABY_descision_focus_event.11.d:0 "El gabinete de Edvard Beneš del recién formado gobierno federal de Abydos publicó órdenes administrativas adicionales.\nEran órdenes de desalojo forzoso en grandes ciudades como Praga y Viena.\nEn circunstancias normales, una orden de ese tipo no habría causado problemas graves, pero el gabinete de Beneš cometió un error nefasto: utilizó a checos para los desalojos forzosos dentro de Chequia, y a germanos para los desalojos forzosos dentro de Austria.\nQuizá en el gabinete lo consideraron mucho más eficiente, pero el odio de checos y austríacos hacia los kivotosianos superaba cualquier imaginación.\nAunque (puesto que los kivotosianos eran mucho más fuertes que los locales) no pudieron ocurrir sucesos de alta intensidad como masacres, precisamente por eso su odio se concentró y terminó generando discriminación administrativa.\n\n\"¿Qué significa esto...? En el decreto federal decía claramente que se pagarían los costos de reubicación...\"\n\n\"¿No te estoy diciendo que no hay dinero? Si no hay dinero, ¿cómo quieres que paguemos?\"\n\n\"Entonces, ¿a dónde se supone que vayamos y qué se supone que comamos para vivir...?\"\n\n\"¿Y a mí qué? ¡Vete a esa barriada de chabolas que hicieron en las afueras de Praga!\"\n\nY cosas como esa ya eran el pan de cada día.\n\n¡Bam! ¡Crash!\n\n\"¡Oigan, hijos de puta! ¿Otra vez? ¡Carajo! ¡¿Cuántas van ya?! ¡No queda ni un mueble entero, mierda, mierda!\"\n\nTambién era frecuente que lanzaran cócteles molotov o explosivos improvisados contra tiendas o restaurantes kivotosianos.\nPero los kivotosianos no morían por algo tan insignificante, y al final lo único que se acumulaba, capa tras capa, era su odio.\nLos linchamientos colectivos ocurrían ocasionalmente en zonas donde los locales eran mayoría frente a los kivotosianos, y los kivotosianos, que no morían con facilidad por más que los golpearan, se convirtieron en su \"juguete\" favorito.\n\nAquel lugar que alguna vez fue llamado la nación de los dos mundos, ahora se había convertido en el polvorín del Danubio, donde la pólvora se iba acumulando, y por fin se encendió la chispa.\n\n¡Pum! ¡Pum!\nComo cualquier otro día, en las afueras de Viena se estaba produciendo un linchamiento.\n\n\"Oye, perra, ¿ya te entra la razón? ¿Ah?\"\n\n\"...Espera, Dietrich. Esta... no se está moviendo.\"\n\n\"...¿Qué?\"\n\nUna docena larga de jóvenes austríacos que estaban linchando a una estudiante de Shanhaijing se quedaron helados al mismo tiempo.\n\n\"Joder... no está respir...ando...\"\n\n\"¡Rápido... rápido, traigan una pala, hijos de puta!\"\n\nEnterraron a toda prisa a la chica muerta, pero estaban tan concentrados cavando que no escucharon el sonido de los arbustos crujiendo."
 ABY_descision_focus_event.11.a:0 "Y al día siguiente, el incidente ocupó grandes titulares en el periódico."

 ABY_descision_focus_event.12.t:0 "La calma antes de la tormenta"
 ABY_descision_focus_event.12.d:0 "Beneš, con los telegramas llegándole desde todas partes del país, sudó frío.\nTras la muerte de una estudiante de Shanhaijing en un linchamiento en Viena, los kivotosianos ya no se dejaron golpear.\nAsaltaron comisarías y cuarteles, y crearon el \"Frente Unido de Kivotos del Sur\", para oponerse de forma organizada al gobierno federal. Lo único tranquilizador era que todavía no habían ocurrido masacres masivas de represalia, pero cualquiera con algo de visión sabría que era solo cuestión de tiempo.\n\nY eso... Beneš también lo sabía.\n\"A... ah...\"\n¿En qué momento empezó a torcerse todo?\nBuscó un modo de salir de aquella situación.\nNo se le ocurría nada.\nEstaba jodido. Jodidísimo, de verdad.\nIntentó convencerse de que no era su culpa, una victoria mental barata.\nPero su conciencia le sujetó el tobillo.\nSí. Esto era culpa suya.\nY mientras él siguiera siendo el líder, estaba seguro de que no podría detenerlo.\nPero no podía entregarles el poder. Si lo hacía, el legado de Masaryk se derrumbaría.\nAlguien que pudiera salvar el legado de Masaryk y resolver esta situación...\nAh."
 ABY_descision_focus_event.12.a:0 "Solo había una posibilidad."

 ABY_descision_focus_event.13.t:0 "Una actuación por la nación"
 ABY_descision_focus_event.13.d:0 "\"Los plenos poderes... te entregaré los plenos poderes, los míos y los del gobierno.\"\n\"Por favor, puedes hacer conmigo lo que quieras, pero protege a la federación...\"\n\n\"Ja, ¿a estas alturas vienes con eso, señor Beneš?\"\n\n\"Senpai, ahora no es momento de pelear.\"\n\n\"¡Ese descarado lo echó todo a perder y encima nos pide que lo arreglemos! ¡Y él se larga tan campante!\"\n\n\"Lo sient... no, les pido disculpas. Aceptaré el castigo por haber confiado ciegamente en mis capacidades y provocar este resultado. Pero por favor, escuchen mi propuesta.\"\n\n\"¿Y ahora qué, qué estás diciendo...?\"\n\n\"Senpai.\"\n\n\"...Bien. A ver, habla.\"\n\nResumida en una sola línea, la propuesta de Beneš era un golpe político: caer junto con los oportunistas que devoraban al país, y luego que Abydos —en especial Ayane— lo destituyera mediante impeachment, asumiera como presidenta y aplicara una política de conciliación.\n\n\"¡O sea que al final le estás diciendo a Ayane que se convierta en la villana!\"\n\n\"...Sí, eso es.\"\nBeneš se mordió los labios con fuerza.\n\n\"Ayane, no tienes por qué escuchar a este hijo de... esto es...\"\n\n\"Lo aceptaré.\"\n\n\"...¿Por qué?\"\n\"¡¿Y qué tiene que ver este país con nosotros?! ¡Con que protejamos Abydos...!\"\n\n\"Hice una promesa con el profesor.\"\n\"Que el día en que este país usara el nombre de Abydos, no solo los kivotosianos de Abydos serían abidósianos... Chequia, Austria, Hyakkiyako, Shanhaijing... todos los que vivan dentro de Abydos serían abidósianos.\"\n\"Nosotros estamos protegiendo a Abydos. Solo estamos haciendo lo que siempre hemos hecho.\""
 ABY_descision_focus_event.13.a:0 "Por Abydos, también hay que asumir el papel de villano."

 ABY_descision_focus_event.14.t:0 "La mañana de la federación"
 ABY_descision_focus_event.14.d:0 "\"A, a. Buenos días. Les saluda Okusora Ayane, segunda presidenta federal.\"\n\"En nombre de todos, me disculpo por las molestias causadas anoche debido al intento de ley marcial del primer presidente, Edvard Beneš.\"\n\"Como ya habrán escuchado, lo reitero una vez más. El nuevo gobierno de Abydos destituyó al gabinete de Beneš, que intentó provocar una guerra civil y destruir el orden democrático, y revocó las órdenes administrativas innecesarias y excesivas de ese gabinete.\"\n\"Los puntos revocados son los siguientes: orden de desalojo forzoso de kivotosianos, privación de derechos políticos, ...\"\n\nFue la primera transmisión del gabinete de Ayane, recién inaugurado tras el suceso que más tarde sería llamado \"La noche más larga de la federación\".\nAunque algunas órdenes clave —como la orden administrativa de desarme— no fueron revocadas, y el apartado de impuestos adicionales a los kivotosianos se limitó a una versión suavizada, para la mayoría de los kivotosianos del sur, el ascenso de Abydos —hasta entonces visto en gran medida desde fuera como una especie de organización títere del gobierno provisional checo— se interpretó como una revolución kivotosiana, lo que provocó la desintegración del \"Frente Unido de Kivotos del Sur\".\nAlgunos con visión o extremistas comprendieron que Abydos y el gobierno provisional checo estaban del mismo lado y ofrecieron una resistencia feroz, pero esa resistencia fue desapareciendo poco a poco ante la indiferencia de los kivotosianos del sur.\n\nSorprendentemente, la intensa resistencia local que Beneš temía no se produjo. No se sabe si fue por la confianza de que Abydos no los oprimiría, o simplemente porque se rindieron ante la re-toma del poder por los kivotosianos; en cualquier caso, fue una buena noticia."
 ABY_descision_focus_event.14.a:0 "El sol de la mañana de la federación se alzó con fuerza."

 ABY_descision_focus_event.15.t:0 "Matrícula voluntaria"
 ABY_descision_focus_event.15.d:0 "Jadeo... jadeo...\nAh, mierda, estoy jodida.\nEntré a saquear una tienda local porque llevaba días sin comer y, justo en ese momento, me topé de frente con la milicia de Abydos.\n\n\"Jadeo, jadeo... aunque me muera, no voy a entrar a una academia arruinada como Abydos.\"\n\nHace unas semanas se promulgó una orden administrativa: si un kivotosiano que actuaba dentro del territorio del gobierno provisional no pertenecía a Abydos, sería considerado espía de Hyakkiyako y sería arrestado y encarcelado. Tras emitirse la orden, la mayoría de los ciudadanos no afiliados / afiliados a Hyakkiyako dentro de Abydos renovaron su ciudadanía, y las grandes organizaciones estudiantiles que se opusieron a la orden fueron todas eliminadas en un plazo de dos semanas, salvo el Grupo del Casco Katakata.\n\nLa chica, Nagasawa Yui, simplemente odiaba Abydos.\nNo por una razón grandiosa; solo no quería entrar a una escuela arruinada.\nAsí que se ocultó como no afiliada... hasta que la descubrieron hoy.\n\n\"Ah.\"\n\nEn ese momento algo se le enganchó en el pie y cayó, rodando por el suelo.\nIntentó levantarse de inmediato y huir, pero al final la atraparon.\n\n\"Mmm, Nagasawa Yui, no afiliada; no consta que te hayas unido en particular al Grupo del Casco.\"\n\n\"Y-yo... ¿voy a ir a la cárcel?\"\n\n\"En principio sí, pero... con este nivel, podríamos mostrarte clemencia.\"\n\n\"¿C-clemencia? ¡G-gracias, muchas gracias!\"\n\n\"Con la condición de que, aunque sea ahora, llenes la solicitud de ingreso a Abydos.\"\n\n\"¿Eh...?\"\n\"E-esto... ¿y si me niego qué pasa...?\"\n\n\"Entonces, mmm... en tu caso te asignarían a la unidad penal Halo.\"\n\n\"¿Qué...? ¿¡Qué!?\"\n\"¡Lo acepto! ¡Me inscribiré! ¡Ingresaré!\"\n\n\"Bien, ¡bienvenida a Abydos por tu matrícula voluntaria! Ase... digo, ¡estudiante!\"\n\nSi la chica hubiera sabido que todo estudiante de Abydos debe recibir entrenamiento militar y ser asignado al ejército, ¿habría tomado otra decisión? Sin duda, puede decirse que es una historia tremendamente absurda."
 ABY_descision_focus_event.15.a:0 "Ttahh..."

 ABY_descision_focus_event.16.t:0 "El traidor"
 ABY_descision_focus_event.16.d:0 "\"E-esto qué...\"\n\nAnte los ojos del hombre se desplegaba un infierno en la tierra.\nPersonas extrañas con anillos en la cabeza aparecidas con un destello, y animales caminando en dos patas, estaban disparando indiscriminadamente a los civiles.\nLa hermosa Praga se convirtió en un mar de sangre en un instante.\n\n\"¡Malditos locos! ¡¿Qué demonios están haciendo?!\"\n\nGritó mientras empujaba a una mujer que apuntaba con un arma a un niño.\nClac.\nEl cañón de un arma se alzó frente a sus ojos.\n¡Bang!\n\n\"¡Ugh! ¡Aaah, aaahhh!\"\nEl hombre se despertó gritando.\n¿Cuántos días llevaba teniendo esa pesadilla?\n\nEl hombre, Oskar Schindler, era uno de los \"traidores\" que cooperaban con Hyakkiyako.\nHabía actuado como espía en cooperación con el régimen nazi alemán, pero fue descubierto en 1935 y encarcelado. Sin embargo, con la Gran Transferencia, la prisión perdió el control y él también pudo escapar. Al huir, juró vengarse de los checos que lo habían humillado.\n\nPero empezó a sentir dudas.\nEl deseo de venganza, que al principio fue una emoción momentánea, se fue debilitando con el paso de los días.\nY lo que llenó ese vacío fue un rechazo hacia Hyakkiyako.\nAnte aquellos que disparaban a la gente y lanzaban granadas solo por diversión, Schindler sintió un rechazo profundamente humano.\nCuando dos días atrás vio cómo ejecutaban sumariamente en la plaza a niños y mujeres capturados, con el pretexto de que eran resistencia checa, recibió un impacto indescriptible.\n\nDesde entonces comenzó a esconder checos en su fábrica.\nNo era compasión por los checos, sino asco hacia Hyakkiyako, ese rechazo visceral.\n\nPero había un límite para lo que podía ocultar, y le dolía no poder salvarlos a todos.\n\n\"...Oye.\"\n\"Schindler. ¿Me escuchas?\"\n\n\"Ah, Dietrich. Perdona. Me fui un momento con otros pensamientos.\"\n\n\"Sí, bueno, ¿qué? ¿Qué te parece mi idea de negocio?\"\n\nEllos también eran \"traidores\" como él.\nMuchos empresarios de origen alemán se pegaron al gobierno de Hyakkiyako, explotando a sus compatriotas y llevando una vida lujosa.\nComo él también era uno de ellos, sentía culpa.\n\n\"...Por eso, últimamente el gobierno nos está suministrando prisioneros checos, así que está de lujo: ni pagas mano de obra.\"\n\nJusto cuando estaba a punto de sentir asco por ellos otra vez, algo le cruzó la mente.\nY por primera vez en mucho tiempo, pudo sonreír."
 ABY_descision_focus_event.16.a:0 "\"Sí, ¿no? Me parece una idea excelente.\""

 ABY_descision_focus_event.17.t:0 "La lista de Schindler"
 ABY_descision_focus_event.17.d:0 "\"Aquí están los prisioneros que solicitó.\"\n\nEl burócrata kivotosiano le entregó a Schindler la lista de prisioneros checos y le hizo una seña.\nSchindler, con naturalidad, sacó joyas de oro de su manga y se las ofreció.\n\n\"Hm. Espero que siga esforzándose por la academia aliada.\"\n\nPara cuando había pasado alrededor de un mes desde que Schindler obtuvo aquella revelación, decenas de miles de checos estaban protegidos en el complejo de fábricas de Schindler.\nComo era imposible reproducir perfectamente el equipo de Kivotos con la tecnología actual, en su fábrica se generaban \"algo más\" de productos defectuosos que en otras, y la producción era \"un poco\" insuficiente en relación con la cantidad de trabajadores; pero gracias a las joyas de oro que salían de su manga, no hubo mayores problemas.\n\nComo Schindler solicitó al gobierno de Hyakkiyako un número \"algo\" elevado de prisioneros en comparación con el tamaño de su fábrica, incluso prisioneros de la resistencia que originalmente debían ser ejecutados fueron trasladados a su fábrica.\n\nSchindler observó a los prisioneros entregados entrando en la fábrica.\nLa proporción de niños y mujeres era bastante alta, pero eran \"metalúrgicos cualificados\". Por fuera se veían abatidos, pero sus miradas brillaban, como si hubieran encontrado esperanza.\n\nEsa noche, cuando Schindler inspeccionaba la fábrica, un anciano se le acercó.\nEl anciano le entregó, como regalo, una insignia tipo clip hecha con retazos de metal.\nComo a aquel empresario corrupto que explotaba prisioneros le daban regalos con frecuencia, aceptó la insignia sin sospechar.\nTras terminar la inspección y antes de irse, en su despacho sonrió mientras examinaba la insignia que el anciano le había dado.\n\n\"Hm, para que lo haya hecho un anciano solo, es bastante fina. ¿No quedaría raro si la llevo puesta a diario?\"\n\nFrente al espejo, se colocó la insignia en su traje caro.\n\nPlop.\n\nAl colocarla, cayó de la insignia un diminuto papel enrollado.\nExtrañado, lo abrió y vio un número de teléfono y la frase: \"Hemos recibido la lista de Schindler\".\n\nSchindler cerró la puerta con llave y llamó a ese número.\n\nPoco después, la persona al otro lado habló en un alemán fluido.\n\"Señor Schindler, buenas noches. ¿Ha recibido la lista?\"\n\nSchindler respondió con las manos temblando.\n\"Sí. He recibido la lista de Schindler.\"\n\nEntonces, la voz al otro lado respondió:\n\"Encantado, señor Schindler.\""
 ABY_descision_focus_event.17.a:0 "\"Le contactamos desde la nación de los dos mundos.\""

 ABY_descision_focus_event.18.t:0 "Ofreciéndolo todo"
 ABY_descision_focus_event.18.d:0 "Aunque era un hombre disoluto, Schindler visitaba su fábrica todos los días; sin embargo, de manera inusual, aquel día no fue.\nEl sol ya estaba alto, pero Schindler permanecía quieto en la cama, pensando únicamente en la propuesta de ayer.\n\n\"¿Podrías ayudar y ocultar a la organización de la resistencia de origen alemán en Ostrava? Si crees que van a descubrirte, puedes negarte...\".\n\nPara ser sincero, no creía demasiado que lo descubrieran, pero lo que lo hacía dudar era otra cosa.\nLa \"nación de los dos mundos\", el gobierno provisional de Abydos, era una organización que se oponía a Hyakkiyako y Shanhaijing, y contaba con el apoyo de los checos y austríacos locales.\nPero Schindler no estaba seguro de que ellos pudieran ganar.\nNo le parecía posible que una organización tan pequeña, aunque tuviera apoyo local, derrotara a la poderosa Hyakkiyako y a Shanhaijing.\nPero, al mismo tiempo, pensó que si él ayudaba a la resistencia, quizá la probabilidad de victoria aumentaría aunque fuera un poco.\nMientras mil ideas chocaban, llegó a un pensamiento concreto.\n\nSe levantó de la cama y abrió su caja fuerte.\nEl oro que antes la llenaba, ahora apenas quedaba en un puñado.\n\n\"Quería vivir entre riqueza y lujos...\"\n\"...y mira, por aferrarme a estupideces, voy a perder todo lo que conseguí... jaja...\"\nLo decía así, pero ¿por qué no sentía realmente arrepentimiento?\nTomó una decisión.\nEra un empresario corrupto, y también el motivo de su decisión lo era.\n\"Jeje... sí, al fin y al cabo, si ellos no ganan, yo me muero, ¿no?\"\n\"...¿Dijeron que si los ayudaba me darían una recompensa nacional?\"\n\"Bien, ¡todavía no estoy viejo! ¡Aún me quedan muchas oportunidades de vivir entre riqueza y lujos! ¡Jajajaja!\""
 ABY_descision_focus_event.18.a:0 "Con una expresión aliviada, llamó al gobierno provisional."

 ABY_descision_focus_event.19.t:0 "La muerte de Tomáš Masaryk"
 ABY_descision_focus_event.19.d:0 "Toc, toc.\n\"¿Aún duerme?\"\nLa ama de llaves abrió la puerta con cuidado y entró.\n\"Señor Masaryk, ¿cómo puede seguir durmiendo hasta tan tarde? ¿Se toma su medicina...?\"\nMasaryk parecía dormir profundamente, pero ni siquiera se movió ante sus palabras.\nLa ama de llaves, con cautela, acercó la mano bajo su nariz.\n\nPlaf.\n\"A, aah...\"\n\nEl padre de Bohemia, el rey de hierro, el primer presidente, el maestro...\nTomáš Garrigue Masaryk, aquella noche, se fue de este mundo en paz mientras dormía profundamente."
 ABY_descision_focus_event.19.a:0 "Masaryk, nuestro padre, por favor confía en tus hijos."
 ABY_descision_focus_event.20.t:0 "Despedida"
 ABY_descision_focus_event.20.d:0 "Sala del Comité de Contramedidas de la Escuela Secundaria Abydos.\n\nDesde temprano por la mañana, sonó el teléfono en la Escuela Secundaria Abydos.\n\"Sí, habla el Comité de Contramedidas de Abydos.\"\n\"...\"\n\nClic.\n\n\"¡¿Ayane?! ¿Qué pasó?\"\n\n\"E-el profesor... d-dicen que... fa-falleció...\"\n\n\"...¿Qué?\"\n\"¿Qué...?\"\n\"¿Q-qué estás diciendo?!\"\n\n¡Bang!\n\n\"¡S-Shiroko-chan!\"\n\nHoshino y Serika salieron corriendo tras Shiroko, que se había lanzado fuera, y Nonomi se quedó para consolar a Ayane, que había empezado a llorar.\n\n\nEdificio del Gobierno Provisional.\n\nRiiin.\n\"Sí, habla Beneš.\"\n\n\"...¿Cómo dice?\"\n\"No... no puede ser... Él... mi maestro...\"\n\"...Iré de inmediato.\"\n\n\nSede del Partido Alemán de los Sudetes.\n\n\"Habla Konrad Henlein.\"\n\n\"¿Qué... acaba de decir?\"\n\"¿E-él... al final falleció...?\"\n\"Iré ahora mismo.\""
 ABY_descision_focus_event.20.a:0 "La noticia del fallecimiento se transmitió en un instante."

 ABY_descision_focus_event.21.t:0 "El padre de Bohemia"
 ABY_descision_focus_event.21.d:0 "El funeral de Masaryk, que en teoría debía celebrarse como funeral de Estado, se realizó de forma sencilla en la plaza de Karlovy Vary.\nAunque se había bloqueado de antemano el acceso a Karlovy Vary antes de la ceremonia, se reunieron decenas de miles de personas.\nIrónicamente, la mayoría de quienes acudieron al funeral de Tomáš Masaryk, el padre de Bohemia, eran alemanes sudetes. De por sí la población checa era reducida, pero eso ya no importaba.\nMasaryk, que debería haber sido llamado el padre de Chequia, fue llamado el padre de Bohemia. Eso significaba que no solo era el padre de los checos, sino también el padre de los alemanes de Bohemia; y los alemanes también lo respetaban como a un padre y lo lloraban de corazón.\n\nEn la plaza de Karlovy Vary, una de sus sucesoras, Okusora Ayane, terminó primero un breve discurso fúnebre; le siguió el representante del Partido Alemán de los Sudetes, Konrad Henlein. Y, por último, otro de sus sucesores, Edvard Beneš, leyó el discurso final.\n\n\"...Masaryk, incluso después de partir, permanece entre nosotros; fue para todos nosotros ejemplo y desafío. Un caso de fe en el ser humano que Europa y el mundo necesitan con desesperación hoy. Lo que nos queda es la tarea de, en esta crisis europea sin precedentes, construir buena voluntad y amistad entre Kivotos y Europa. Entonces podremos crear, después de 1936, el Estado completamente nuevo más perfecto y armonioso de Europa: socialmente, nacionalmente y políticamente justo. Es un Estado que debemos forjar sin falta por nuestra supervivencia y nuestro futuro, y será una existencia destinada a preservar el legado que Masaryk mostró entre nosotros, el mismo legado que Masaryk mostró al mundo entero...\"\n\"...¡Presidente libertador, seguiremos su camino para liberar una vez más nuestra patria y ser fieles al legado que nos ha dejado en nuestras manos!\"\n\nCuando Beneš terminó el panegírico, resonó el Canto de San Wenceslao, el himno más antiguo de Chequia y de Europa.\n\nDespués, una carroza llevó su cuerpo fuera de la plaza, subiendo la colina. En ese momento, siete soldados escoltaron el féretro, simbolizando a las siete etnias que componían (o estaban por componer) la federación.\n\nLa carroza se detuvo en el edificio del gobierno provisional, y fue depositado en el patio trasero.\nOriginalmente debía ser enterrado en Lány, donde descansaba su familia, pero se dice que en vida Masaryk dejó estas palabras: \"...no gasten grandes esfuerzos por mi cuerpo muerto... ...enterradme en un lugar al que cualquiera pueda venir, y no me muevan...\".\n\nY los que sobrevivieron avanzarán para proteger su legado, para liberar la patria, y para la confianza y la amistad entre Kivotos y Europa."
 ABY_descision_focus_event.21.a:0 "Seremos fieles.\nLa verdad vence."

 ABY_descision_focus_event.22.t:0 "Sudetenland, nuestro Sudetenland"
 ABY_descision_focus_event.22.d:0 "Ludwig Czech, el ministro de origen alemán que representaba a los alemanes de los Sudetes.\nDurante la huida, estuvo a punto de morir varias veces al recibir balas perdidas.\nAunque se decía que Abydos estaba \"arruinada\", existía un pequeño hospital en el distrito autónomo transferido, y Czech logró sobrevivir tras una operación de emergencia.\nSin embargo, las complicaciones por el tratamiento tardío dañaron gravemente su salud, y en marzo de 1937, llegó a su fin.\n\nY tras su muerte, quien se convirtió en el nuevo portavoz de los alemanes sudetes y miembro del triunvirato fue el líder del Partido Alemán de los Sudetes: Konrad Henlein.\n\n\"¿Cómo... terminamos así...?\"\n\nHenlein era el fundador del nacionalismo sudete, a veces llamado henleinismo, y el Sudetenland que él lideraba se estaba acercando poco a poco a su objetivo final: la autonomía dentro de Checoslovaquia...\nPero el cataclismo de la Gran Transferencia lo elevó de golpe a líder nacional (de los alemanes), y con la proclamación de la federación, incluso los alemanes de Austria pasaron a verlo como el salvador de los alemanes austríacos.\n\n\"B-bueno, al menos Austria es mejor que esos palurdos prusianos que se dejan manipular por un bigotón...\"\n\"Joder... ah... ¡yo solo soy un sudete común! ¡¿Por qué esperan tanto de mí?!\"\n\"Señor Masaryk... en momentos así, ¿qué haría usted...?\"\n\nCada vez que Beneš, discípulo y sucesor de Masaryk, se negaba a dialogar y transigir con él, Henlein asumía que Masaryk, maestro de Beneš, también sería igual.\nPero el Masaryk que conoció en persona era completamente distinto.\nAunque quizá veía a los alemanes sudetes como forasteros, los consideraba objeto de inclusión y diálogo, no invasores como Beneš.\n\n\"¿Así que lo dejaste a Beneš porque eso es la democracia? Ja...\"\n\"Qué lástima que ese hombre sea un demócrata. Si no fuera por eso, lo habría tomado como maestro de inmediato. Jaja...\"\n\"La democracia es... terriblemente ineficiente. A un tumor podrido como Beneš, que hasta ignora las palabras de su maestro, habría que extirparlo ya.\"\n\nAl ver un nombre escrito en un informe, frunció el ceño.\n\n\"...Y también a este tumor de mierda.\""
 ABY_descision_focus_event.22.a:0 "Karl Hermann Frank."

 ABY_descision_focus_event.23.t:0 "El Partido Henlein Sudete"
 ABY_descision_focus_event.23.d:0 "Henlein solo pretendía, como líder de los alemanes sudetes en la joven República Checoslovaca, conseguir algo de autonomía. Pero su plan empezó a torcerse a partir de 1935.\nDesde luego criticaba la democracia, y en realidad tampoco le gustaba demasiado el sistema, pero aun así le parecía mucho mejor que el \"pangermanismo\" que pregonaba ese tal \"cabo bohemio\".\nTras la llegada de los nazis al poder, mientras en Austria el movimiento nacionalsocialista amenazaba al gobierno, el Sudetenland se mantuvo relativamente tranquilo: esa era una de las razones.\n\n\"Si ese maldito Frank y el del bigote de cepillo no estorbaran, carajo...\"\n\nPara oponerse a la Alemania nazi, Henlein ensalzó una democracia que no le agradaba, criticó a los nazis y logró que los cuadros del partido juraran lealtad no a Alemania, sino a Henlein como individuo.\nY poco antes de la Gran Transferencia, Karl Hermann Frank —uno de sus leales— lo citó en una pequeña ciudad cerca de Praga.\n\n\"Frank, es la primera vez que me llamas aparte. ¿Dices que tienes algo que denunciar?\"\n\n\"S-saludos. Señor líder.\"\n\"Verá... he encontrado rastros de corrupción.\"\n\n\"¡Corrupción! ¡Eso hay que erradicarlo, por supuesto! Bien hecho, Frank.\"\n\n\"Jaja, gracias. Entonces... ¿le explico este caso de corrupción?\"\n\nPero, contra lo esperado, mientras más hablaba Frank, más pálido se volvía Henlein.\n\n\"...Así que no logro entender a dónde desapareció aquella gran suma —casi 15.000 reichsmarks— que entró desde el consulado alemán. Usted, que detesta tanto el nacionalsocialismo, no habrá usado ese dinero, ¿verdad, señor líder?\"\n\nSí, había aceptado dinero de Alemania. Y le había dado un magnífico golpe por la espalda, usándolo para actividades antinazis...\nPero nunca imaginó que Frank fuera su títere. Por eso incluso le había informado del uso de los fondos...\n\n\"Basta de hipocresía barata. ¿Qué demonios quieres decir, Frank?\"\n\nEn vez de responder, Frank sacó una pistola.\n\n\"¿Qué... es esto...?\"\n\n\"Aaah, señor líder. Si uno es alemán, ¿no debería prosperar, como es debido, dentro del gran abrazo de una Gran Alemania unificada?\"\n\n\"No digas estu...\"\n\nClic.\n\"A partir de ahora, cada vez que pronuncie una palabra, mi dedo se moverá un poco.\"\n\"Así que desde ahora me responderás solo con sí o no, Henlein, ¿entendido?\"\n\n\"...Sí.\"\n\nFrank le ordenó mover al Partido Alemán de los Sudetes para crear opinión a favor de la anexión a la Alemania nazi.\nCon el cañón apuntándole, Henlein no tuvo más remedio que aceptar.\n\nPero ahora, la situación había cambiado.\n\n\"Neumann, Schwennhardt... ja. Delante de mí se deshicieron en adulaciones, y resulta que estaban preparando una fiestecita tan linda.\"\n\nDesde aquel día, Henlein movió a sus peones para identificar a quienes simpatizaban con los nazis dentro del partido, y ahora podía barrerlos a todos de una vez."
 ABY_descision_focus_event.23.a:0 "\"Hay que moverse rápido, antes de que ese hijo de puta se dé cuenta.\""

 ABY_descision_focus_event.24.t:0 "Duelo de verdaderas intenciones"
 ABY_descision_focus_event.24.d:0 "En plena noche, cuando todos dormían, en la habitación de Masaryk aún seguía encendida una tenue luz.\nEdvard Beneš, Rihardt Tesařžík... mirando los nombres anotados en su cuaderno, Masaryk escribía consejos para ellos.\n\"Ja, ¿ya es la última página? Hoy se acabará rápido, entonces.\"\nEn la última página había nombres desconocidos.\n\nOkusora Ayane: falta de confianza. ¿Complejo por la edad? Aplicada y flexible.\nIzayoi Nonomi: con el consejo de administración sigue habiendo roces, pero parece que se llevan mejor que antes. Aprende economía rápido. ¿Educación temprana?\nKuromi Serika: se deja engañar, pero jamás trabaja a medias. Los documentos correctos: perfectos, sin huecos. Hay que entrenarla para detectar documentos erróneos.\nSunaookami Shiroko: capacidad física, mando y liderazgo excelentes. Pero cómo decirlo... tiene un aire muy \"salvaje\". Aun así, sigue mejorando.\nTakanashi Hoshino: excelente ocultando emociones con una sonrisa cercana... me tiene cautela. ¿Por qué será?\n\nMasaryk se quedó pensativo al ver el último nombre.\n\n...\n\nÚltimamente Hoshino no lograba dormir.\nIncluso el fingir siestas para parecer despreocupada, en estos días terminaba siendo sueño de verdad.\nNo lo entendía.\nPor qué sus adorables kouhai seguían a ese <adulto>.\n\nHoshino siempre tuvo confianza en su capacidad para leer el corazón de las personas, pero el corazón de aquel anciano era imposible de descifrar.\nToda buena voluntad tiene un precio.\nHoshino lo había vivido en carne propia.\nPero no lograba entender cuál era el \"precio\" que ese adulto —al que sus kouhai llamaban Sensei— le exigiría algún día.\n\n\"Novecientos millones de yenes...\"\nNovecientos millones de yenes.\nPara Abydos era mucho, pero para otras academias era tan poco que hasta lo ignoraban en los libros.\nY aun así, con esa migaja, muchos adultos la ataban con una correa y la explotaban.\nEsa correa tan importante...\nMasaryk la había cortado sin dudar."
 ABY_descision_focus_event.24.a:0 "Hoshino no se veía capaz de pagar ese precio."

 ABY_descision_focus_event.25.t:0 "Empresa y gobierno"
 ABY_descision_focus_event.25.d:0 "\"...Con esto, el acuerdo queda formalizado.\"\n\"El contenido es el siguiente.\"\n\"Primero, transferir al gobierno provisional el control de los terrenos privados del Grupo Nephthys.\"\n\"Segundo, el gobierno federal cederá a Nephthys un cierto porcentaje de las instalaciones industriales de Chequia y Austria, y...\"\n\n\"¡Excelente! ¡Señor Masaryk!\"\n\n\"Sí. Como portavoz del gobierno provisional, le expreso mi agradecimiento, señorita Nonomi.\"\n\nCon un apretón de manos, los terrenos privados del Grupo Nephthys pasaron oficialmente a pertenecer al gobierno provisional.\nY los dos protagonistas de la negociación volvieron juntos al gobierno provisional en coche.\n\n\"¿E-estuvo suuúper cansado, Sensei?\"\n\n\"Jeje. Pero ahora usted es, con todas las letras, la cabeza de una corporación, señorita Nonomi. Aunque el consejo de administración lleve el timón, en eventos importantes tendrá que presentarse con frecuencia; no puede venirse abajo desde ya.\"\n\n\"Uuugh... si incluso esto, que ya estaba decidido de antemano, fue tan pesado... no quiero ni imaginar lo duro que será negociar de verdad...\"\n\n\"Si le sirve como buena noticia: sorprendentemente, muchas negociaciones ya las resuelve el equipo técnico de antemano, y luego solo se fija el resultado así. Esto viene de mi experiencia en política; quizá en economía sea algo distinto, pero política y economía se parecen, así que puede tomarlo como referencia.\"\n\n\"Aun así, me da miedo... si surge algún imprevisto...\"\n\n\"Hm. Entonces, para aliviar un poco su ansiedad, ¿qué le parece si hoy hacemos una tutoría especial? Parece que tenemos tiempo; podríamos practicar cómo responder ante distintos escenarios.\"\n\n\"Mmm... quiero descansar, pero oportunidades así no hay muchas~ ¡Sí!\"\n\n\"Ja, ja, no se alargará. Entonces, ¿de qué lado le gustaría aprender más?\""
 ABY_descision_focus_event.25.a:0 "\"Mmm~ más que gestión, quiero aprender política general~!\""
 ABY_descision_focus_event.25.b:0 "\"Mmm~ quiero aprender tips políticos relacionados con la gestión~!\""

 ABY_descision_focus_event.26.t:0 "Integración separada"
 ABY_descision_focus_event.26.d:0 "\"Parece que hace falta un poco más de fuerza policial en el distrito autónomo~\"\n\n\"Sí, comisionada.\"\nHoshino llamó al secretario que ya se iba.\n\n\"Ah, y deja las condiciones igual que antes. No saques gente del ejército: recluta civiles, y en proporción a la población, ¿va~?\"\n\n\"Sí, lo tengo.\"\n\n\"Uhee, qué rígido eres~ Si te pones así, este viejito se pone triste, ¿sabes~?\"\n\n\"Es trabajo, comisionada.\"\nAun así, el secretario sonrió levemente.\n\"De todos modos... lo está haciendo muy bien. Gracias, como siempre.\"\n\n\"Uhee, ¡claro!\"\n\nCuando el secretario salió, la jefa del distrito autónomo de Abydos, Takanashi Hoshino, siguió con el papeleo.\n\nDesde que Masaryk, Sensei, llegó, Hoshino hizo de todo: desde administración hasta trabajo físico; y tras aportar méritos en la reorganización del distrito autónomo de Abydos, se convirtió en su jefa.\n\nHizo que la zona industrial pasara a manos del gobierno local e integró la ciudad de Karlovy Vary —transferida junto al distrito— bajo el distrito autónomo de Abydos.\nFue un buen resultado: un compromiso entre los kivotosianos, que evitaban el complejo fabril, y los locales, que preferían el complejo.\n\nLa orden administrativa 111 del gobierno provisional seguía vigente, pero Hoshino tenía una idea.\n\"Si ahora no creamos un precedente de integración, esta federación no durará.\"\n\nCon ese pensamiento, trabajó para convertir el distrito autónomo de Abydos en un símbolo de integración. Era el único distrito donde operaba la policía (y no la gendarmería), y las patrullas iban en parejas mixtas: un kivotosiano y un local.\nEse esfuerzo logró resultados como la convivencia de dos mundos, pero la tarea de integrar dos mundos fundamentalmente distintos seguía estancada.\n\nEn esa situación, Hoshino se quedó pensativa mirando una demanda administrativa sobre permitir matrimonios entre kivotosianos y locales."
 ABY_descision_focus_event.26.a:0 "\"Ya que estamos, hagámoslo a lo grande.\""
 ABY_descision_focus_event.26.b:0 "\"Si lo permitimos, el gobierno podría colapsar.\""

 ABY_descision_focus_event.27.t:0 "Control recuperado"
 ABY_descision_focus_event.27.d:0 "\"¿Cómo va la situación?\"\n\n\"Las zonas Egerland A, B y D están finalizadas; en la zona C, una guerrilla de 132 personas ha construido una fortaleza de madera y resiste atrincherada. Si reforzamos un poco más el fuego de morteros, caerá pronto.\"\n\n\"Mm... probablemente será difícil. Las fortalezas de madera del Grupo del Casco no se pueden atravesar con armas personales ni con morteros.\"\n\n\"¿Sí? ¿Cómo puede ser eso...?\"\n\n\"Sí. Ya he luchado con ellos varias veces. Y también fui a verlo al campo. Esa fortaleza es más resistente de lo que parece.\"\n\"Así que tendremos que concentrar drones de ataque.\"\n\n\"¡Sí! ¡Entendido, comandante!\"\n\nLa puerta de la tienda se abrió y entró un mensajero.\n\"Ha llegado un informe del cuartel general.\"\n\n\"Orden de disciplina militar. Se confirma que el ex presidente Tomáš Garrigue Masaryk se dirige en secreto al Mando de Gendarmería de Egerland.\"\n\nTras leerlo, el ayudante de Shiroko encendió el micrófono e hizo un anuncio.\n\"Todo el personal del cuartel general: uniforme en orden y reúnanse en el patio de armas. Padre viene. Padre viene. Fin.\"\n\n...\n\n\"Sí, me alegra que Sensei haya venido. Pero...\"\nShiroko miró el patio de armas.\n\"...¿No podrías decirles aunque sea una palabra? Si los reunimos y solo dices que se dispersen...\"\n\n\"Ja, ja. La señorita Shiroko, para entretener a este ocioso, me está creando trabajo.\"\n\n\"A... ¡No! ¡No es eso...!\"\n\n\"No digo que no. De hecho, dar un discurso tras tanto tiempo suena bien.\"\n\"No he preparado nada, así que no será largo, pero eso también será mejor para esos soldados.\"\n\nMasaryk se quedó un instante y dijo:\n\"Pero entonces... ¿qué le parece si el discurso lo da usted, señorita Shiroko?\"\n\nShiroko se quedó pensando."
 ABY_descision_focus_event.27.a:0 "\"No, aun así, creo que es mejor que lo haga Sensei.\""
 ABY_descision_focus_event.27.b:0 "\"Sí, entonces lo intento yo.\""

 ABY_descision_focus_event.28.t:0 "Aprendizaje práctico"
 ABY_descision_focus_event.28.d:0 "\"Crear un nombre nuevo cuesta mucho, y ninguna parte estará de acuerdo. Ustí nad Labem. Dejémoslo claro.\"\n\"¡No, o sea, te digo que al final es lo mismo! ¡Aussig o Ustí, de todas formas ellos lo van a llamar como quieran!\"\n\"¡Es que Ustí viene del checo antiguo, y Aussig es cómo lo leen en alemán! ¡Hay que usar el original, Ustí!\"\n\"¡Ya cedimos en Elbe/Labe, así que al menos Ustí hay que conservarlo! ¡Ladrones!\"\n\"¡¿Tiene sentido ponerle un nombre checo a una ciudad donde viven nuestros alemanes sudetes?! ¡¿Sí o no, carajo?!\"\n\nAl ver que la reunión se estaba calentando, Ayane exigió silencio y declaró un receso de quince minutos.\n\nMasaryk recibió a Ayane cuando bajó del estrado.\n\n\"Ha sido duro, señorita Ayane.\"\n\n\"¿Cree que esta vez lo hice bien, Sensei?\"\n\n\"Hm, se nota que poco a poco mejora. Pero...\"\n\nDespués de que Masaryk señalara los puntos a corregir, la reunión se reanudó; y solo tras repetir varios recesos y reaperturas, la reunión —que duró diez horas— pudo concluir.\nYa entrada la noche, por fin pudieron irse, y Masaryk y Ayane conversaron en un viejo restaurante cercano mientras comían kulajda.\n\n\"...Pero tengo una duda.\"\n\n\"¿Cuál, señorita Ayane?\"\n\n\"Entendí por qué me eligió entre tantos kivotosianos porque me lo dijo la última vez, pero... usted tiene un discípulo tan inteligente como Beneš, así que me pregunto por qué me está formando a mí.\"\n\n\"Hm. No hay nadie tan inteligente y buen político como Beneš. Pero al mismo tiempo le falta flexibilidad y tiene una inclinación algo radical, así que hay aspectos en los que no encaja con una federación multinacional.\"\n\"Al final, hacía falta un socio político que lo compensara: alguien que pudiera abarcar a todos y servir de freno a Beneš. Y, además, alguien con un potencial político sobresaliente. Yo elegí a la señorita Ayane para ese papel.\"\n\n\"Ah...\"\n\n\"Algún día... si yo regreso al lugar de donde vine, por favor ayude a que Beneš no tome decisiones equivocadas.\""
 ABY_descision_focus_event.28.a:0 "\"...Sí. Protegeré el legado de Sensei.\""
 ABY_descision_focus_event.28.b:0 "\"...No se preocupe. La ciudadanía, por sí sola, conducirá el camino correcto.\""

 ABY_descision_focus_event.29.t:0 "Planificar a largo plazo"
 ABY_descision_focus_event.29.d:0 "\"Uff... el papeleo sí que es difícil...\"\n\nSeparando por un momento la vista de los documentos, Serika se estiró largamente.\nYa había pasado bastante desde la Gran Transferencia, y Serika estaba encargada del trabajo de establecer el \"Comité de las 8 Provincias del Sur\".\nCon la ayuda de Sensei y Ayane, ahora ya tenía cierta maña con los documentos, pero seguía habiendo demasiado trabajo y no estaba del todo acostumbrada.\n\n\"Tal vez... de verdad no sirvo para los papeles...\"\n\"No, señorita Serika. Usted está dando lo mejor de sí.\"\n\"¿Eh? ¡¿Sensei?!\"\n\nEn algún momento, Masaryk ya estaba de pie en la puerta.\n\n\"Con solo haber asumido un cargo tan pesado como el de viceministra del Interior y haberlo llevado hasta ahora sin grandes problemas, la señorita Serika ya ha demostrado capacidad de sobra.\"\n\n\"Pero lo único que puedo detectar por mí misma son omisiones pequeñitas, o cosas exageradas de forma demasiado evidente...\"\n\n\"Jeje. Lo normal es que los pequeños avances, uno a uno, se acumulen y te hagan crecer.\"\n\nAun con el consuelo de Masaryk, Serika seguía con un gesto preocupado.\n\n\"Hm, tiene cara de estar dándole vueltas a algo. ¿Puede decírmelo?\"\n\nTras escucharlo, Serika dudó un momento y preguntó de golpe:\n\n\"Si tengo que tomar una decisión importante en una situación en la que no pueda preguntarle a usted... ¿qué debería hacer?\"\n\nMasaryk se sorprendió un poco, pero escuchó con atención.\n\n\"Últimamente pienso que cualquier cosa podría pasar. Y en el peor de los casos, podría llegar una situación en la que yo tenga que cargar con todos. Gracias a usted ya no me engañan sin más, pero si eso me cae encima de golpe, y si no hay nadie que me aconseje, voy a tomar una decisión equivocada. Así que Sensei, por si acaso... dígame qué tengo que hacer.\" \n\nMasaryk ya contemplaba su propia muerte, así que había pensado mucho al respecto, pero lo que preocupaba a Serika parecía ser una situación mucho más grave.\nMasaryk se quedó pensativo un instante y finalmente le dio este consejo:\n\n\"Quiero que piense con la suficiente profundidad en qué consecuencias podría traer la decisión que tome, señorita Serika. En especial...\"\n\n\"Y si llega ese momento, recuerde también que su propia seguridad es lo más importante.\""
 ABY_descision_focus_event.29.a:0 "\"También recuerde que el trabajo del gobierno no se hace en solitario.\""
 ABY_descision_focus_event.29.b:0 "\"Pero recuerde también que no debe encargarle a otros lo que le toca a usted.\""

 ABY_descision_focus_event.30.t:0 "Recuperación territorial"
 ABY_descision_focus_event.30.d:0 "Cuando la amenaza de Shanhaijing y Hyakkiyako desapareció por completo de Chequia y Austria, se abrió un nuevo capítulo de la historia. En el Salón Vladislav del Castillo de Praga, los tres líderes que habían encabezado el gobierno provisional —Edvard Beneš, Konrad Henlein y Okusora Ayane— se alinearon ante periodistas nacionales y extranjeros para proclamar el lanzamiento oficial del \"Gobierno Federal de Abydos\". Fue una declaración histórica de que aquella frágil alianza, unida por mera supervivencia, avanzaba ahora hacia una comunidad estatal permanente.\n\nLo primero que se anunció fue el levantamiento oficial de la \"Orden de Movilización Total de Emergencia\", que marcaba el fin del estado de guerra. Con esa medida, innumerables soldados que habían pasado años atados al frente por fin podrían volver a su patria y al abrazo de sus familias; y toda la federación se vio envuelta en alivio y júbilo. Fue un anuncio simbólico, cargado con la voluntad firme del gobierno federal de apartar la sombra de la guerra y dirigirse hacia una era de paz.\n\nA continuación, el gobierno federal prometió celebrar pronto las primeras elecciones generales en las que participarían todos los miembros de la federación. Con ello presentó el plan de formar un gabinete legítimo que reflejara de manera justa la voluntad de todas las etnias y clases sociales, poner fin al sistema de liderazgo provisional y asentar las bases de una democracia plena.\n\nTambién dejó clara su intención de concentrar las capacidades del Estado en la reconstrucción, y no en la guerra. Anunció un plan de desarme: reducir gradualmente el tamaño del ejército, inflado por el estado de guerra, para ajustarlo a tiempos de paz; y declaró que el presupuesto y los recursos liberados se invertirían con máxima prioridad en un gran proyecto de reconstrucción destinado a restaurar ciudades y bases industriales destruidas por la guerra. La \"nación de los dos mundos\" comenzaba, por fin, a bajar las armas y a preparar el martillo y el arado."
 ABY_descision_focus_event.30.a:0 "Recuperamos la tierra."

 ABY_descision_focus_event.31.t:0 "El soldado y la chica"
 ABY_descision_focus_event.31.d:0 "Vítězslav y los miembros de su pelotón mantenían posición de alerta, con fusiles y subfusiles en mano. Otras naciones rechinaban los dientes ante los invasores, pero Vítězslav y su unidad eran la excepción. Más bien, luchaban como aliados. En comparación con quienes no paraban de insultarlas llamándolas \"locas con un aro en la cabeza\", aquello era realmente extraño. Y de paso, les dejaba una sensación rara.\n\n\"¡Pelotón, atención! ¡Fuerza enemiga aproximándose a menos de 100 metros!\"\n\"¿Ya? ¿Empezamos? ¡Tengan cuidado para que nadie salga herido!\"\n\nA diferencia de Vítězslav y sus hombres, tensos hasta el límite, la mujer frente a ellos sostuvo el arma con calma, casi relajada. Mientras todos tragaban saliva al ver el halo sobre la cabeza de aquellos a los que llamaban Kivotos...\n\n\"E-eh... ¿pasa algo?\"\n\"No, nada.\"\n\"Oiga, ¿por qué me mira así? ¡Pensé que traía algo en la cara!\"\n\"Cállate y concéntrate en lo tuyo.\"\n\nVítězslav levantó el fusil, echó el cerrojo y cargó munición. Se oían disparos a lo lejos. Con manos temblorosas aferradas a los fusiles, los soldados tragaron saliva y esperaron a que el enemigo entrara en distancia de tiro. En cuanto Vítězslav confirmó que el Grupo del Casco había entrado en el rango, les gritó a sus hombres y a la infantería de halo de Kivotos."
 ABY_descision_focus_event.31.a:0 "\"¡Por nuestra patria, Chequia!\""

 ABY_descision_focus_event.32.t:0 "Hacia Viena"
 ABY_descision_focus_event.32.d:0 "Fue justo cuando la última chica de Kivotos lanzó una granada y las fuerzas de Shanhaijing empezaron a retirarse. Fritz, el soldado que había huido a duras penas desde Austria a Chequia, desde Chequia más allá hasta Abydos, no pudo evitar sentir la ironía de estar luchando junto a aquellas chicas de Kivotos que tanto había detestado. Cuando disparó su última bala de fusil y remató destruyendo el halo de la última chica de Kivotos, Fritz por fin pudo soltar un suspiro.\n\nCuando bajó el fusil, miró a las chicas que, igual que él, llevaban cascos checos. Cada vez que las oía parlotear en japonés, Fritz no podía evitar que la irritación le subiera; pero esta vez habían luchado juntos, así que, en cierto modo, les debía una.\n\n\"Aah, atención todos.\" Un oficial abrió la boca con un megáfono.\n\n\"Pronto nos dirigiremos a Viena para hacer un desfile. Las fuerzas restantes de Shanhaijing ya se han retirado, así que no habrá ataques. Los de Kivotos, muévanse a la izquierda; los europeos, a la derecha.\"\n\nFritz gruñó mientras se incorporaba, y empezó a moverse hacia el lugar donde lo esperaban sus compañeros."
 ABY_descision_focus_event.32.a:0 "Bueno... al menos es mejor que antes."

 ABY_descision_focus_event.33.t:0 "Una alianza que enlaza la esperanza"
 ABY_descision_focus_event.33.d:0 "Tomáš Masaryk no perdió la esperanza ni siquiera después de que Checoslovaquia colapsara a manos de Hyakkiyako. Intentó reagrupar a ministros y generales dispersos y, como resultado, convenció a líderes militares como Vojtěch Luža y Rihardt Tesařžík, así como a políticos encabezados por Štefan Osuský, sentando las bases de una nueva coalición. Aunque cada uno tenía metas distintas, todos decidieron seguir al gobierno provisional de Abydos —heredero del espíritu del gobierno provisional checoslovaco— y cumplir su papel a través de la cooperación.\n\nEn la sala de reuniones, Masaryk habló con voz pesada: \"Cada uno de nosotros tiene objetivos distintos, pero si alemanes, checos y abidósianos no unimos fuerzas, nadie podrá triunfar. Nuestra experiencia y capacidad son indispensables para fortalecer esta coalición.\" \n\nVojtěch Luža asintió en silencio y dijo: \"Señor, hemos negociado con la organización de resistencia alemana y logramos resultados significativos. A cambio de que nuestro cuerpo de oficiales los entrene y forme suboficiales, aceptaron nuestra cadena de mando. Para liberar Chequia, nosotros los necesitamos y ellos nos necesitan; así podremos actuar de forma organizada, a la altura del nombre de Fuerzas Aliadas del Gobierno Provisional.\" \n\nŠtefan Osuský también añadió: \"Apoyar al políticamente inmaduro gobierno provisional de Abydos y coordinar la cooperación entre fuerzas diversas es también nuestra responsabilidad. En esta coalición coexistiremos y cumpliremos fielmente nuestro papel.\" \n\nEdvard Beneš observó la escena con una tenue sonrisa. \"Tomáš, mírelo. Aún tenemos camaradas que desean entregarse por Checoslovaquia. Con ellos, sin duda podremos liberar la patria.\" \n\nMasaryk asintió otra vez con un gesto decidido y concluyó con voz firme:\n\"Sin su dedicación y su esfuerzo, la cooperación de hoy habría sido imposible. Aunque nuestros objetivos no sean idénticos, debemos avanzar juntos hacia la liberación de esta tierra y hacia un futuro nuevo. Les pido que den lo mejor en el lugar que les ha tocado.\""
 ABY_descision_focus_event.33.a:0 "At zije Ceskoslovensko!(¡Viva Checoslovaquia!)"

 ABY_descision_focus_event.34.t:0 "Bajo la bandera checa"
 ABY_descision_focus_event.34.d:0 "En un restaurante tranquilo de Praga, dentro de un reservado herméticamente cerrado, voces bajas debatían el futuro de Chequia. En el centro estaba Edvard Beneš. Frente a él se sentaban veteranos que habían luchado junto a él por la independencia, académicos de tendencia nacionalista y representantes de grupos juveniles llenos de fervor. Les preocupaba que, tras el eslogan de la \"armonía\" federal, el espíritu checo se diluyera.\n\n\"Señores,\" Beneš habló con calma. \"Nuestro objetivo es uno: reconstruir una Chequia fuerte y soberana. Agradecemos la ayuda de Abydos, pero son forasteros. A los sudetes hay que vigilarlos siempre. El verdadero dueño de este país debe ser el pueblo checo.\" \n\nNo estaba dando un discurso. Solo hablaba, en voz baja, pero con una convicción inflexible.\n\n\"Necesito su fuerza. Dentro del marco federal, debemos hacer que la voz checa sea la que resuene con mayor fuerza. Debemos recuperar nuestra influencia en educación, cultura y administración, en todos los campos.\" \n\nCon esas palabras, las fuerzas nacionalistas dispersas encontraron un punto de gravedad. Aquella noche, bajo una sola bandera llamada \"Renacimiento de Chequia\", sellaron una alianza invisible."
 ABY_descision_focus_event.34.a:0 "Beneš aseguró su base de apoyo más poderosa."

 ABY_descision_focus_event.35.t:0 "Una barrera invisible"
 ABY_descision_focus_event.35.d:0 "La maniobra de Beneš era como una guerra sin disparos. Para debilitar la influencia de Abydos, se movía con astucia y tenacidad. En las reuniones donde se definían las grandes políticas federales, el innovador plan de reconstrucción económica presentado por Ayane se posponía una y otra vez con el argumento de la \"falta de realismo\". Detrás de eso estaba la oposición organizada de burócratas checos que Beneš había colocado en puestos clave.\n\n\"La propuesta de la señorita Ayane es idealista, pero en la ejecución práctica podrían surgir dificultades. ¿Qué tal si añadimos un comité técnico compuesto por expertos checos para complementarla?\" \n\nSonaba razonable, pero el resultado era una reducción del poder de las figuras provenientes de Abydos. El trabajo de Serika, que estaba demostrando capacidad en el Ministerio del Interior, se retrasaba por problemas menores de procedimiento; y el gran proyecto de inversión propuesto por el Grupo Nephthys de Nonomi chocaba con una barrera invisible: regulaciones administrativas enredadas. En la prensa empezaron a filtrarse, poco a poco, artículos citando a \"fuentes gubernamentales\" que señalaban la \"ineficiencia de las políticas al estilo Kivotos\". Beneš jamás atacaba a Abydos de frente. Solo tejía una telaraña de procedimientos complejos y comités, y con ella..."
 ABY_descision_focus_event.35.a:0 "les iba atando manos y pies poco a poco."

 ABY_descision_focus_event.36.t:0 "Un apretón de manos con el diablo"
 ABY_descision_focus_event.36.d:0 "Incluso Beneš, que estaba ampliando su influencia, tenía una preocupación: Austria. En las regiones austríacas recién incorporadas, su línea nacionalista no encontraba gran apoyo. Para asegurar una mayoría estable, tenía que ceder en parte de sus convicciones. Al final, tomó una decisión que nadie esperaba: tendió la mano a los remanentes del antiguo partido autoritario de Austria, el \"Frente Patriótico\".\n\nEn una reunión secreta en un viejo hotel de Viena, el representante del Frente Patriótico lo recibió con una sonrisa cínica. \"¿Qué se le ofrece a un demócrata como usted, señor Beneš, ante reliquias de otro tiempo como nosotros?\"\n\nBeneš respondió sin cambiar el gesto: \"No apoyo su ideología. Pero ustedes tienen la fuerza para controlar Austria. Si me apoyan en las elecciones que vienen, les garantizaré autonomía dentro de Austria y no interferencia por sus actividades pasadas.\" \n\nEra un acto de negación como demócrata. Un apretón de manos con el diablo que Masaryk, si estuviera vivo, jamás habría tolerado. Pero Beneš no dudó. Para un objetivo mayor —construir un Estado fuerte centrado en los checos— incluso aliarse con fuerzas antidemocráticas no era más que un \"mal necesario\"..."
 ABY_descision_focus_event.36.a:0 "se justificó a sí mismo."

 ABY_descision_focus_event.37.t:0 "Un primer paso manchado"
 ABY_descision_focus_event.37.d:0 "Las primeras elecciones generales prometidas con el nacimiento del Gobierno Federal de Abydos se celebraron más en medio del caos que de la esperanza. Con las cicatrices de la guerra aún abiertas, la elección preparada a toda prisa empezó a fallar desde el principio. No existía un padrón unificado, y el conteo de votantes en cada región se hizo de forma improvisada. Las disputas legales —la ciudadanía de los kivotosianos, la elegibilidad de los votantes en Austria— continuaron hasta la víspera, agravando la confusión.\n\nEl día de la votación, los problemas explotaron con más fuerza. En algunas zonas rurales de Chequia y Austria, urnas completas desaparecieron; en otras, grupos armados desconocidos irrumpieron en los centros de votación para amenazar a la gente y forzar apoyo a ciertos partidos. En el Sudetenland se detectaron numerosos indicios de maniobras de obstrucción del voto contra electores de origen alemán. El escrutinio tampoco fue transparente: en algunos distritos se anunciaron resultados absurdos con participación superior al 100%, y no fueron raros los casos en que observadores de la oposición fueron expulsados de los centros de conteo.\n\nTras las elecciones, la oposición y la sociedad civil levantaron de inmediato sospechas de \"fraude electoral\" y anunciaron protestas masivas. Pero el gobierno federal actuó rápido. El Ministerio del Interior, dirigido por Beneš, reforzó el control mediático bajo el pretexto de la \"estabilidad nacional\" y etiquetó las denuncias como \"agitación antisistema que provoca caos social\". Algunos grandes medios, en connivencia con el poder, inundaron titulares afirmando que la elección había sido justa; y figuras clave que impulsaban las sospechas recibieron misteriosas auditorías fiscales o vieron su pasado expuesto, quedando políticamente destruidas.\n\nAl final, la enorme sombra de duda se hundió poco a poco sin que hubiera una investigación clara, bajo la dirección del gobierno. El ganador final de esta elección turbia fue Edvard Beneš. Uniendo a su bloque nacionalista con fuerzas de derecha como el Frente Patriótico, logró por poco la mayoría, y ascendió como el primer primer ministro de la federación de Abydos. Sin embargo, su gabinete cargaba desde su nacimiento con el límite de una \"victoria manchada\". La legitimidad estaba dañada y..."
 ABY_descision_focus_event.37.a:0 "la democracia de la federación nació inestable, con semillas de desconfianza y división desde su primer paso."

 ABY_descision_focus_event.38.t:0 "El maestro"
 ABY_descision_focus_event.38.d:0 "Clic. Clac.\n\nLa situación cambió.\nLa pistola que él había apuntado no hace mucho, ahora lo estaba apuntando a él.\n\nEn realidad, ni siquiera él creía que el golpe fuera a triunfar.\nPor eso había planeado hasta una ruta de escape hacia Alemania...\nPero la capacidad de información de Henlein, ese traidor, era más fuerte de lo que imaginaba.\n\n\"¿Tienes algo que decir, Frank?\"\n\n\"...Solo una cosa.\"\n\"Tú también eres alemán. ¿Por qué no quieres unirte dentro del abrazo de una Gran Alemania unificada?\"\n\n\"Bueno, ¿no será que me conmoví con el gran ideal democrático?\"\nHenlein respondió con burla.\n\n\"No digas estupideces.\"\n\n\"Je. ¿Se notó?\"\n\n\"Si solo vas a burlarte, mátame de una vez. No sigo vivo para oír eso.\"\n\n\"Bien. Te lo digo como es.\"\n\"Los sudetes, desde hace generaciones, hemos sido la aristocracia en esta Bohemia. Incluso tras la fundación de Checoslovaquia, podíamos alzar la voz y ocupar la cúspide privilegiada de la sociedad.\"\n\"¿Y ahora que sea un ciudadano más de Alemania? ¿No es eso tirar ese privilegio y convertirme en un simple don nadie? Yo solo quiero vivir a lo grande.\" \n\n\"¡E-este... asqueroso!\"\n\"¡¿Rechazas el gran destino del pueblo alemán por una razón tan miserable?! ¡Maldito traidor! ¡El conjunto del pueblo alemán es uno, y existe solo para el pueblo alemán! ¡Que abandones la gran causa por codicia personal demuestra que tú... tienes sangre jud... urgh!\" \n\n\"Judío, dice. ¿No sabes que lo segundo que más odio son los judíos?\"\n\n\"Ugh... huff... ¿lo segundo? ¿Entonces qué es lo primero?\"\n\n\"¿Qué va a ser? Los nazis como tú.\""
 ABY_descision_focus_event.38.a:0 "Antes de que Frank pudiera responder, Henlein apretó el gatillo."

 ABY_descision_focus_event.39.t:0 "Retiro"
 ABY_descision_focus_event.39.d:0 "\"...Nuestra Checoslovaquia —la única democracia nacida de los restos de Austria-Hungría— guardará ese ideal para siempre en el pecho y avanzará hacia el futuro.\"\n\"Por la presente lo declaro. Yo, Tomáš Garrigue Masaryk, renunciaré al cargo de presidente dentro de diez días, a partir de las 08:00, y juro mantener neutralidad ante cualquier situación política posterior.\" \n\nNadie lo había previsto. Incluso los altos cargos del mundo político, incluido Edvard Beneš, no pudieron ocultar la confusión en sus rostros.\n\n\"Ejem. Sí, estarán muy sorprendidos. Lamento no haberlo dicho antes. Pero hace ya 35 años que decidí dejar la presidencia y vivir como un ciudadano común. Esta vez solo asumí temporalmente, porque es una emergencia sin precedentes en toda época y lugar.\"\n\"Ahora que el gobierno está formado, que yo siga aquí también es un acto contrario a la Constitución. Y, sobre todo... ¿cuánto más va a vivir este viejo? Jeje.\" \n\nÉl se reía, pero nadie pudo esconder la tristeza.\n\n\"Señores, pasado mañana cumpliré casi noventa. Me da miedo cometer errores por culpa de la edad. Y no quiero morir de repente y lanzar a este país al caos. Este país necesita sangre joven.\"\n\"Por eso planeo celebrar elecciones generales dentro de una semana. Así que les pido: ejerzan el valioso derecho que se les ha dado. Muéstrenles, aunque perdamos tierra, que no perderemos el ideal democrático.\"\n\"¡Muéstrenles que jamás nos doblegaremos ante la violencia y la opresión!\"\n\nAl terminar el discurso, estalló un aplauso atronador. Masaryk bajó del estrado con lágrimas en los ojos, pero la sensación de alivio que llegó como una ola lo consoló."
 ABY_descision_focus_event.39.a:0 "Adiós."

 ABY_descision_focus_event.40.t:0 "Tomáš Masaryk"
 ABY_descision_focus_event.40.d:0 "Tras terminar la ceremonia de lanzamiento, Tomáš Masaryk volvió a su residencia preparada en las afueras de Karlovy Vary.\nColgó su sombrero de ala y su largo abrigo en el perchero y se dejó caer, como desplomándose, sobre una pequeña silla de madera.\nSin rastro de la energía de hace un rato, el anciano —agotado hasta los huesos— sacó de su cartera dos pequeños papeles del tamaño de una tarjeta.\n\nCuando Praga desapareció, su casa desapareció con ella, y también su hijo Jan Masaryk y su hija Olga Masaryková. Aquellos papeles eran fotografías: los únicos fragmentos de recuerdo que le quedaban, sin ni siquiera una prenda de sus hijos.\n\nApoyó las fotos de su hijo y su hija en dos floreros con claveles blancos, y vertió en dos vasos de cristal, frente a ellos, el vino barato y el jugo que había comprado de camino.\n\nLágrimas calientes le cayeron por las mejillas; y, aun con gafas, se le nubló por completo la vista. Como un niño incapaz de controlar sus emociones, se desplomó sobre el escritorio y lloró a voz en cuello.\nDecía que lo sentía, que debió llevárselos; que en cuanto oyó la noticia quiso correr a Praga, pero quienes lo seguían lo detuvieron y no tuvo opción; y siguió pidiendo perdón a quienes no podían oírlo ni aceptarlo.\nFrente a los demás debía ser fuerte; si él se quebraba, todos perderían la esperanza; él no podía ser el padre de Jan y Olga, tenía que ser el padre de Chequia... se lamentó así hasta que, vencido por el cansancio, se quedó dormido.\n\nÉl era el padre de Chequia, sí...\npero también era el padre de dos niños."
 ABY_descision_focus_event.40.a:0 "Era un padre común."

 ABY_descision_focus_event.41.t:0 "Fallecimiento de Ludwig Czech"
 ABY_descision_focus_event.41.d:0 "El viento frío de marzo de 1937 soplaba sobre el cementerio de Karlovy Vary. Las secuelas del disparo sufrido en el caos inmediato posterior a la Gran Transferencia terminaron por arrebatar al símbolo más dedicado de la reconciliación en la \"nación de los dos mundos\". Ludwig Czech, el veterano político que hizo de la convivencia entre checos y alemanes la fe de toda su vida, se durmió así para siempre.\n\nEn su funeral se reunieron muchas figuras del gobierno de coalición para despedirlo en su último camino. Delegaciones de Chequia y Abydos, incluido Edvard Beneš y Okusora Ayane, guardaron el lugar con rostros sombríos. En cambio, el \"padre de Bohemia\", Masaryk, no pudo asistir por problemas de salud propios de su vejez, insinuando que una era estaba llegando a su fin.\n\nQuien subió al estrado para el elogio fúnebre fue Konrad Henlein. Mientras honraba la noble voluntad de Czech, también subrayó la unidad y el rumbo que debían seguir los alemanes sudetes. Aquello no fue solo una despedida: fue también una declaración para grabarse como nuevo líder, heredero de la voluntad de Czech. La estrella que simbolizaba la vieja reconciliación se había apagado, pero su muerte, irónicamente, se convirtió en un catalizador que amarró aún más aquella extraña alianza de los que quedaban."
 ABY_descision_focus_event.41.a:0 "Se apaga una estrella de una era."

 ABY_descision_focus_event.42.t:0 "Preocupación por el ejército"
 ABY_descision_focus_event.42.d:0 ""
 ABY_descision_focus_event.42.a:0 "Los comisarios políticos serán el rompeolas."
 ABY_descision_focus_event.42.b:0 "Respeten la autonomía del ejército."

 ABY_descision_focus_event.43.t:0 "La segunda entrevista privada"
 ABY_descision_focus_event.43.d:0 "\"Uhee~ ¿esto es déjà vu…? Otra vez la misma situación.\"\n\nCuando Hoshino se quejó y se dejó caer al suelo, Masaryk, frente a ella, soltó un \"jeje\" bajo. La puerta cerrada del taller era exactamente igual que aquel día de hacía un año. Pero ya no quedaba rastro de aquel aire incómodo y afilado entre ambos.\n\n\"Eso parece. Esta vez, ¿de quién será el error? De todos modos, es un alivio que no se sienta tan incómodo como la última vez.\"\n\nHoshino sonrió con un resoplido. Durante el último año, en lugar de desconfiar de Masaryk, eligió aprender de él. A veces era un maestro estricto, y a veces un abuelo amable.\n\n\"Como hay tiempo, ¿hablamos un poco, Sensei?\"\n\nHoshino tomó la iniciativa. Ya lo llamaba \"Sensei\" con naturalidad.\n\n\"Bien. De hecho, había algo que quería preguntarle… Después de que recuperamos Linz y Praga, ¿qué quiere hacer Hoshino?\"\n\nLa mirada de Masaryk contenía una pregunta seria, dirigida no a una simple estudiante, sino a una colega política. Hoshino miró al techo un momento, pensó, y luego lo miró de frente, como si hubiera tomado una decisión.\n\n\"Quiero hacer política. Voy a reunir a quienes busquen estabilizar la vida de la gente, que todos tengan oportunidades equitativas y que exista un mínimo de bienestar garantizado. Y con ellos voy a formar un partido.\" \n\n\"¿Un gran partido paraguas socialista? Es un objetivo excelente.\" \nMasaryk asintió.\n\"Pero... ahí dentro… ¿también incluiría al partido comunista?\"\n\n\"Sí, claro.\" \n\nAnte la respuesta sin vacilación, en el rostro cálido de Masaryk apareció por primera vez un gesto de incomodidad. Una tenue arruga se dibujó en su entrecejo.\n\n\"Señorita Hoshino, yo confío en usted, pero no puedo confiar en los comunistas. No son más que papel que obedece al amo del Kremlin. Son una amenaza latente dentro del sistema democrático. Hay que excluirlos.\" \n\n\"No te preocupes. La democracia la voy a proteger pase lo que pase.\" \n\nHoshino respondió con calma y continuó.\n\n\"Pero, Sensei... esa frase, ¿no te suena conocida? Eso de 'amenaza latente, así que hay que excluirla'.\" \n\nPor un instante, los ojos de Masaryk se abrieron un poco. Hoshino siguió.\n\n\"Tú mismo te enfrentaste a quienes llamaban así a los residentes de origen alemán, y los abrazaste. Para alguien, ellos también eran una amenaza latente. Y aun así, tú lo demostraste: hay que ver la posibilidad y practicar la inclusión.\" \n\nSe hizo silencio. Y entonces, de los labios de Masaryk brotó una risa baja.\n\n\"Jeje… esta sí que fue una buena. Olvidé por completo lo que yo mismo les había enseñado.\" \n\nRascándose la cabeza como avergonzado, Masaryk la miró con ojos cálidos.\n\n\"Tiene razón. Yo estaba equivocado. Creer en la posibilidad y abrazarla: así empezó todo. Bien. Este viejo apoyará el camino de la señorita Hoshino.\" \n\"Pero quiero preguntarle una cosa. Si algo se interpone en el ideal de la señorita Hoshino... ¿qué hará?\""
 ABY_descision_focus_event.43.a:0 "\"...Entonces, aunque haya que ceder, hay que lograrlo.\""
 ABY_descision_focus_event.43.b:0 "\"...Nosotros empezamos, desde el principio, por un ideal.\""

 ABY_descision_focus_event.44.t:0 "Los dos hijos de Bohemia"
 ABY_descision_focus_event.44.d:0 "La sala de la convención del Partido Alemán de los Sudetes estaba llena de fervor. Cuando, en el estrado, Tomáš Masaryk y Konrad Henlein leyeron lado a lado una declaración de amistad por el futuro de la \"nación de los dos mundos\", estalló un aplauso atronador. Pero tras el acto oficial, en el despacho privado de Henlein, entre ambos se deslizó un frío sutil.\n\nHenlein, recostado en su silla, con las piernas cruzadas y los brazos plegados, recibió a Masaryk. No faltó a la etiqueta, pero toda su postura enviaba un mensaje tácito: \"esto no es más que una alianza política\". Masaryk, sin embargo, no se inmutó y sostuvo su taza de té con una sonrisa benévola.\n\n\"La convención fue un éxito, señor Henlein. Casi se podía sentir aquí mismo el anhelo de sus compatriotas sudetes.\" \n\n\"Solo quieren recuperar sus derechos legítimos, señor.\" respondió Henlein con rigidez.\n\n\"Por supuesto. Que quien pierde su casa quiera recuperarla es natural.\" Masaryk continuó con suavidad. \"A veces pienso que, antes de llamarnos checos o alemanes, todos éramos vecinos, arraigados en esta tierra de Bohemia. Como los árboles de un bosque: roble, abedul, distintos... pero, al final, un mismo bosque.\" \n\n\"Un bosque... pero algunos árboles también tapan la luz del sol de otros.\" La voz de Henlein estaba llena de espinas.\n\n\"Así es. Por eso hace falta un jardinero que cuide el bosque: para que ningún árbol se marchite y para que ningún árbol crezca tanto que dañe a los demás. ¿No deberíamos convertirnos, el uno para el otro, en esa clase de existencia?\" \n\nEn las palabras de Masaryk no había cálculo político ni coerción: solo filosofía, de un ser humano a otro. Henlein, sin darse cuenta, descruzó las piernas. Sintió como si una pequeña grieta apareciera en el muro sólido de su interior.\n\nMasaryk miró por la ventana y siguió:\n\"Señor Henlein, no considero que los sudetes sean la nación checa. Pero ustedes son, sin duda, ciudadanos de este país. Que hablemos diferente y tengamos culturas distintas... ¿cómo podría ser eso motivo para oprimir a otro ser humano bajo el mismo cielo? Lo distinto no es lo incorrecto; es solo distinto.\" \n\nEn ese instante, Henlein comprendió que aquellas palabras no eran retórica política, sino la convicción que atravesaba toda la vida del anciano. No veía a los sudetes como herramienta electoral ni como pieza de una coalición, sino que los respetaba de verdad como dueños iguales de esta tierra.\n\nNo se sabe cuánto tiempo pasó. Su conversación continuó hasta que la noche se hizo profunda.\n\nCuando Masaryk se levantó para marcharse, Henlein también se levantó en silencio y lo acompañó hasta la puerta. Su actitud era completamente distinta a la altivez torcida del comienzo. Se inclinó profundamente y saludó con el respeto debido: no solo a un estadista veterano, sino a un ser humano al que había llegado a admirar de verdad.\n\nTras despedirlo, Henlein se quedó pensando, en silencio, sobre la democracia que Masaryk defendía."
 ABY_descision_focus_event.44.a:0 "Lo respeto, pero no respeto la democracia."
 ABY_descision_focus_event.44.b:0 "Quizá... podría creerle un poco."

 ABY_descision_focus_event.45.t:0 "Los dos mundos"
 ABY_descision_focus_event.45.d:0 ""
 ABY_descision_focus_event.45.a:0 "Los dos mundos deben cooperar, pero no pueden volverse uno."
 ABY_descision_focus_event.45.b:0 "Los dos mundos pueden volverse uno."

 ABY_descision_focus_event.46.t:0 "Aumento de la desconfianza hacia el ejército"
 ABY_descision_focus_event.46.d:0 ""
 ABY_descision_focus_event.46.a:0 "Aun así, un poco de control civil sí hace falta."
 ABY_descision_focus_event.46.b:0 "No nos dejaremos arrastrar por rumores absurdos."

 ABY_descision_focus_event.47.t:0 "El barco que deja la playa"
 ABY_descision_focus_event.47.d:0 "El cálido sol primaveral de 1937 iluminaba con fuerza el auditorio recién construido de la Escuela Secundaria Abydos. Era difícil creer que, apenas dos años atrás, aquel lugar fuera una escuela en ruinas con solo cinco estudiantes. Ahora el auditorio estaba lleno de kouhai y de nuevos alumnos llenos de vida. Todas las miradas se dirigían a cinco senpais sentados en la primera fila, alineados bajo el estrado. Hoshino, Shiroko, Nonomi, Serika y Ayane. Hoy era su ceremonia de graduación.\n\nEn Kivotos, \"graduación\" era un concepto extraño. Los estudiantes eran los dueños de la academia, y la academia era ellos. Pero aquí, en Europa, para gobernar el país junto a los locales, el estatus de \"estudiante\" se había convertido en una atadura honorífica. Ayane aceptó la realidad con serenidad. \"Es el procedimiento más racional.\" Serika, dolida, pasó días y noches agarrada a los documentos de preparación de la ceremonia, quejándose.\n\nQuien subió al atril como director temporal fue su maestro: Tomáš Masaryk. Alternó la mirada entre las cinco y el público, y empezó un discurso breve pero pesado.\n\n\"Mis queridos estudiantes, y mis respetados colegas. He oído que, en Kivotos, graduarse es algo poco común. Pero hoy no nos hemos reunido para celebrar un final, sino para felicitar un gran inicio. Ustedes, que protegieron una escuela en medio de un mar de arena, ahora se han convertido en pilares que sostienen un Estado. Al dejar atrás las cadenas del estudiante y dar su primer paso como auténticos líderes de esta nación, este viejo maestro los observará con orgullo.\" \n\nCon un aplauso ardiente, Masaryk bajó del estrado y las cinco se pusieron de pie. Como siempre, se picaban entre ellas, pero sus pasos avanzaron como uno solo hacia el micrófono. Hoshino con su rostro adormilado, Shiroko con una voluntad férrea, Nonomi sonriendo con dulzura, Serika tensa pero erguida, y Ayane, serena, como si estuviera ordenándolo todo.\nCuando se alinearon, el auditorio, que era un hervidero, se quedó en silencio como si le hubieran echado agua.\n\nLas cinco estudiantes dieron un paso al frente, hacia el micrófono."
 ABY_descision_focus_event.47.a:0 "Las cinco estudiantes empezaron discursos distintos, cada una con su propia voz."
 ABY_descision_focus_event.47.b:0 "Las cinco estudiantes dieron un discurso con una sola voz."
 ABY_ABYDOS_Portrait_Change: "Se reemplaza el §Yretrato§! del §YComité de Contramedidas§!."

 ABY_descision_focus_event.48.t:0 "Sobre la ética"
 ABY_descision_focus_event.48.d:0 "Antes de la Operación Caída de Pétalos aparecerán 12 eventos de ética, y mediante sus opciones se formará la ética federal.\n\nInclusivismo<->Pluralismo\nIgualitarismo<->Autoritarismo\nIndividualismo<->Colectivismo\nNacionalismo\n\nSe divide en tres ejes éticos opuestos y un eje ético independiente.\nEn los ejes opuestos, se considera seleccionada la ética más fuerte de las dos; en el caso del nacionalismo, si es fanático ignora otras éticas, y si no es fanático se ignora al decidir rutas.\nAl completar el enfoque \"La noche más larga de la federación\", los enfoques políticos posteriores se determinan según la ética federal que se tenga.\n\nLocales: Inclusivismo / Igualitarismo / Colectivismo\nAyane: Pluralismo / Autoritarismo / Colectivismo\nHoshino: Pluralismo / Igualitarismo / Colectivismo\nSerika (Kivotos Sur): Inclusivismo / Igualitarismo / Individualismo\nSerika (Abydos): Inclusivismo / Autoritarismo / Colectivismo\nShiroko (democracia): Pluralismo / Igualitarismo / Individualismo\nShiroko (dictadura): Pluralismo / Autoritarismo / Individualismo\nNonomi: Inclusivismo / Autoritarismo / Individualismo\nSuou: Nacionalismo"
 ABY_descision_focus_event.48.a:0 "Confirmar."
 ABY_descision_focus_event.48.b:0 ""

 ABY_descision_focus_event.49.t:0 "El problema del idioma"
 ABY_descision_focus_event.49.d:0 "Tras el armisticio con Hyakkiyako, el gobierno provisional de coalición empezó a recuperar la estabilidad poco a poco. Sin embargo, las grietas internas que habían quedado ocultas bajo la gran amenaza de la guerra comenzaron a mostrarse. Entre ellas, el problema más urgente y complejo era el \"idioma\".\n\nChecos, alemanes, e incluso kivotosianos con halo sobre la cabeza. Tres pueblos distintos, tres lenguas distintas mezcladas dentro de un mismo Estado. Para la eficiencia administrativa, el gobierno designó provisionalmente el checo como lengua oficial, pero eso pronto se convirtió en una nueva chispa de conflicto. Las quejas de las comunidades alemana y kivotosiana estallaron abiertamente, y quienes no sabían checo quedaron excluidos de trámites, o no recibieron garantías adecuadas de educación.\n\nMientras los líderes se quebraban la cabeza con este problema, una propuesta llegó desde un lugar inesperado: el \"Comité Esperanto de Bohemia\". Propusieron adoptar el esperanto —una lengua internacional neutral, no subordinada a un pueblo— como nueva lengua oficial de la federación. La introducción del esperanto ofrecería una línea de partida justa para checos, alemanes y kivotosianos, y sería un símbolo real de armonía acorde al nombre de \"nación de los dos mundos\"."
 ABY_descision_focus_event.49.a:0 "No podemos repetir el error del Imperio Dual."
 ABY_descision_focus_event.49.b:0 "No podemos desperdiciar personal administrativo por esto."

 ABY_descision_focus_event.50.t:0 "Entrevista privada"
 ABY_descision_focus_event.50.d:0 "\"Uhee~ se cerró por completo.\"\n\n\"Jeje... entonces tendremos que esperar hasta que termine la reunión.\"\n\nSe quedaron atrapados.\nEn el breve instante en que Masaryk fue a buscar a Hoshino, que se había quedado dormida y no había ido a la reunión, el guardia cerró la puerta del taller y se marchó.\nAsí, los dos se sentaron frente a frente, incómodos, dentro del taller a oscuras.\nEntonces Hoshino fue la primera en hablar.\n\n\"Oye~ señor Masaryk. ¿Cómo van últimamente los kouhai? Todos te siguen a ti, así que este viejito se siente solo, ¿sabes?\"\n\nMasaryk, al darse cuenta de que Hoshino intentaba conducirlo con preguntas capciosas, decidió tratarla no como político, sino con sinceridad.\n\"Bueno, todos se esfuerzan, señorita Hoshino. En especial, la señorita Serika ha mostrado un crecimiento verdaderamente notable.\"\n\n\"Hee~\"\n\"Entonces... ¿qué quieres tú que les pase a esas chicas, señor Masaryk?\"\n\n\"Yo espero que, en el futuro, esas chicas se conviertan en un punto de ruptura hacia la armonía de los dos mundos.\" \n\nAnte un Masaryk que, a diferencia de lo habitual, hablaba sin esconder sus emociones, Hoshino se sobresaltó y dejó escapar un poco de su interior con prisa."
 ABY_descision_focus_event.50.a:0 "\"Uhee... ¿de verdad ellas quieren eso~?\""
 ABY_descision_focus_event.50.b:0 ""

 ABY_descision_focus_event.51.t:0 "Sensei"
 ABY_descision_focus_event.51.d:0 "\"...Quizá lo que hago sea teñir el lienzo blanco de niños puros con los colores que yo deseo.\"\n\"Les enseñé a mentir. Les enseñé a desconfiar de las personas, a reprimir su naturaleza, a convivir con quienes detestan.\"\n\"Ellos me llaman <Sensei>, pero yo mismo dudo de si poseo las cualidades que ese título implica en Kivotos.\"\n\"Ni siquiera pude proteger a mi propia familia… ¿de verdad tengo derecho a ser el <Sensei> de unos niños que conocí de repente? Ah… perdón, señorita Hoshino. Me desvié del tema.\"\n\nHoshino vio una pequeña gota formarse en los ojos de Masaryk.\nAsí como ella ocultaba su verdadera naturaleza para proteger a Abydos y a sus kouhai, aquel hombre también había interpretado el papel de un líder de acero por el bien de su patria.\n\n\"No, continúe. Quiero escuchar más de su historia, señor Masaryk.\"\n\n\"Si usted lo desea…\"\n\"He vivido una vida tejida de mentiras. Si esas mentiras fueron por mi propio beneficio… los filósofos podrían discrepar, pero yo creo que no.\"\n\"Puedo afirmar con orgullo que todas mis mentiras fueron para proteger aquello que amaba.\"\n\"Lo que hice con esos niños… probablemente fue por la misma razón.\"\n\nHoshino habló sin darse cuenta:\n\"¡E-entonces usted también hizo lo que debía…!\"\n\nEn ese momento, la puerta se abrió.\n\"Excelencia, ¿estaba aquí? Nos preocupamos porque no regresaba…\"\n\"Jajaja, no es nada. ¿Ya terminó la reunión?\"\n\"Casi. Pero hay asuntos que requieren su presencia inmediata.\"\n\"Bien, vayamos de inmediato.\"\n\n\"Yo…\"\nCuando Hoshino intentó decir algo, Masaryk le dejó una sola frase."
 ABY_descision_focus_event.51.a:0 "\"Cada uno debe hacer lo que le corresponde. Así lo hicieron también esos niños.\""
 ABY_descision_focus_event.51.b:0 ""

 ABY_descision_focus_event.52.t:0 "La última lección"
 ABY_descision_focus_event.52.d:0 "El tiempo no estaba del lado de Masaryk. Al ver la sangre que acompañaba a su tos, comprendió que no le quedaba mucho. Ya no podía posponerlo. Debía sentar el último cimiento para que Abydos avanzara sin tambalearse incluso después de su partida.\n\nConvocó a todo el alumnado de la Academia Abydos al auditorio. En el estrado se encontraban Hoshino, ya graduada, junto a sus cuatro compañeras.\n\nCuando Masaryk anunció su renuncia al cargo de \"director provisional\" y la abolición definitiva del puesto de director, el auditorio se llenó de murmullos. Para los estudiantes, él no era solo un líder político, sino un maestro benevolente que les había abierto el camino.\n\n\"¡Sensei! ¿No puede quedarse como director un poco más?\"\n\nAnte la voz temblorosa de un estudiante de primer año, Serika tomó el micrófono con suavidad.\n\n\"Entiendo que se sientan tristes. Pero Sensei no se va. Solo regresa al lugar al que siempre debió pertenecer.\"\n\nAyane añadió con calma:\n\"Las academias de Kivotos siempre han sido gobernadas por los estudiantes. Sensei fue un pilar temporal para ayudarnos a echar raíces aquí. Ahora transformaremos oficialmente el Comité de Contramedidas en un Consejo Estudiantil y dirigiremos la escuela por nuestra cuenta, como un distrito autónomo dentro de la Federación.\"\n\nHoshino se acercó al micrófono con su expresión habitual.\n\"Uhee~ Oigan, aunque Sensei no esté, aquí estamos nosotras, ¿no? No se preocupen. Esta… ejem, estas hermanas mayores se encargarán de todo.\"\n\nLas palabras de las cinco graduadas tranquilizaron poco a poco a los estudiantes. Cuando el auditorio quedó en silencio, Masaryk comenzó su última lección.\n\n\"Creí haberles enseñado muchas cosas, pero al mirar atrás, fui yo quien más aprendió de ustedes. Aprendí a no perder la esperanza incluso en la desesperación, y a aceptar sin prejuicios a vecinos de otros mundos.\"\n\nSu voz era quebrada, pero resonó con claridad en el corazón de todos.\n\n\"Ustedes son estudiantes de Abydos, pero también…\""
 ABY_descision_focus_event.52.a:0 "\"…los ciudadanos que iluminarán el futuro de la Federación Abydos.\""
 ABY_descision_focus_event.52.b:0 "\"…jóvenes que llevan los sueños de la Federación Abydos.\""
