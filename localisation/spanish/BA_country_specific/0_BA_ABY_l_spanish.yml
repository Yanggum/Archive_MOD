 ABY_new_event.229.t:0 "Aviso para los jugadores de Abydos"
 ABY_new_event.229.d:0 "Hola. Soy Mintcoon, el modder encargado de Abydos.\n\nAntes que nada, quería ofrecerles una nueva experiencia probando diversos cambios tras el primer rework de Abydos, pero les pido disculpas de corazón porque, por mi falta de planificación y habilidad de modding, el resultado terminó sufriendo reinicios frecuentes y fracasos. En especial, lamento y reflexiono profundamente sobre el hecho de que, durante el rework, al usar y mezclar de manera ambigua sistemas ya existentes, surgieron muchos bugs y problemas estructurales.\n\nDe aquí en adelante, los reworks se realizarán solo tras una preparación y verificación suficientes, y procuraré que no haya grandes remodelaciones después del próximo rework.\nSin embargo, debido a varios problemas de la vida real —sobre todo dificultades académicas—, me he visto obligado a tomar la decisión de pausar temporalmente el desarrollo de Abydos hasta mediados de noviembre. Les pido por favor que comprendan que, en una situación tan ocupada, si forzara un rework de un país principal como Abydos, temo que se repitan los mismos problemas del pasado.\n\nHasta mediados de noviembre, desarrollaré de vez en cuando países secundarios como Egipto y, durante ese periodo, planeo concentrarme en la preparación de base para elevar aún más la calidad de Abydos. Aunque el proceso pueda tomar tiempo, aunque por un momento lo olviden, haré mi mejor esfuerzo para volver con una versión tan impresionante que quede grabada en su memoria en cuanto regresen.\n\nLes agradezco profundamente su generosidad y su interés constante, y haré todo lo posible para volver a verlos con una versión mejorada."
 ABY_new_event.229.a:0 "Gracias."
 ABY_new_event.229.b:0 ""

 ABY_new_event.230.t:0 "Informe de investigación - Trinity"
 ABY_new_event.230.d:0 "Resumen: Informe sobre los cientos de cadáveres y equipos médicos hallados bajo la Gran Catedral de Trinity.\nNota: Antes de entrar a la Gran Catedral, numerosos registros fueron quemados o triturados, por lo que faltan materiales verificables.\n\n1. Alrededor de los cadáveres se hallaron en grandes cantidades suero de Misticismo y telar/tejedor de Misticismo, entre otros.\n\n2. La causa de muerte, común a todos, se estima como fallo multiorgánico total o paro cardíaco, debido a sobrecarga de músculo somático y activación inmunitaria autodestructiva.\n\n3. En todos los cadáveres se observaron valores de Misticismo por encima del rango normal.\n\n4. Se hallaron, aunque sin contenido verificable, órdenes del Tea Party y otros documentos, por lo que se presume una operación dirigida por el gobierno de Trinity.\n\n5. La fecha de las muertes coincide, en términos generales, con el periodo de la campaña de Trinity de «apoyo a personas sin hogar y socialmente inadaptadas».\n\nConclusión: Se considera probable que fueran experimentos humanos de un proyecto de inyección de Misticismo en animales realizado en el Centro de Investigación de Misticismo de Abydos. Sin embargo, como gran parte de los datos fue destruida, no fue posible extraer resultados significativos más allá de confirmar que, al inyectar Misticismo en humanos sin medidas adecuadas, se produce una reacción similar a la de los animales y sobreviene la muerte. Se requiere apoyo con materiales de investigación más amplios.\n\nEquipo de Investigación de Misticismo N.º 37, destacamento en la Gran Catedral."
 ABY_new_event.230.a:0 "Autorizado."

 ABY_new_event.231.t:0 "Informe de investigación - Gehenna"
 ABY_new_event.231.d:0 "Resumen: Se hallaron rastros similares a los experimentos humanos de Trinity en una gran instalación civil cerca del distrito central de Gehenna. No se observaron indicios de intervención del Pandemonium Society ni del Comité Disciplinario, por lo que se considera un acto de un club civil. No hubo muestras exitosas, pero se obtuvo una cantidad considerable de datos.\n\n1. En general se asemeja a las instalaciones médicas subterráneas de la Gran Catedral, pero carece de un entorno básico de investigación como higiene, etc.\n\n2. Se registró con detalle la dosis letal por peso y por IMC. Al superar cierto umbral, la muerte es inmediata; cifras detalladas adjuntas.\n\n3. No se hallaron indicios, en notas del investigador ni en cuadernos personales, de órdenes del Pandemonium Society o del Comité Disciplinario; más bien, parece que el Comité Disciplinario los estaba rastreando.\n\n4. Al inyectar Misticismo por debajo de la dosis letal, las capacidades físicas aumentan de forma continua; en el punto crítico, se alcanza una fuerza similar a la de un kivotosiano, pero el tejido muscular colapsa por completo en cuestión de segundos y sobreviene la muerte.\n\n5. Se realizaron experimentos en animales extrapolando los valores, pero no se obtuvo un rendimiento comparable al de los datos capturados. Se considera que, fuera de humanos, no habrá efectos significativos.\n\nConclusión: Parece necesario el uso de coadyuvantes como estabilizadores al inyectar Misticismo. Como los experimentos animales no pueden ofrecer resultados significativos, se propone, de manera inevitable, proceder con experimentos humanos basados en los datos actuales.\n\nEquipo de Investigación N.º 26, destacamento en el distrito central."
 ABY_new_event.231.a:0 "Aut(…borrado)\nDenegado."

 ABY_new_event.232.t:0 "Informe de investigación - Millennium"
 ABY_new_event.232.d:0 "Resumen: Bajo una instalación de investigación afiliada a Seminar en Millennium se hallaron huellas de investigación masiva de inyección de Misticismo. La mayoría de los datos estaban preservados intactos.\n\n1. Por la escala de los datos, se estima que se emplearon como mínimo decenas de miles de personas. Por ello, se hallaron cifras más detalladas que las encontradas en Gehenna. Adjuntos.\n\n2. Aunque se ubica en una instalación de Seminar, en cuadernos de investigación y notas personales no se hallan menciones a su aprobación ni referencias directas, por lo que no se puede confirmar si Seminar estuvo implicada.\n\n3. Tras aproximadamente una semana de diálisis y la ingestión/inyección de fármacos altamente tóxicos, se logró suprimir la inmunidad autodestructiva que se activa con la inyección de Misticismo.\n\n4. Con el mismo método se logró retrasar el colapso corporal, pero los resultados indican que la esperanza de vida quedaría limitada a unos 5 años.\nNota: Clasificado como asunto ultrasecreto.\n\n5. Se estima que los sujetos de prueba fueron «dispuestos», y se hallaron rastros de un plan de investigación posterior para evitar la reducción de vida. Plan: inyección adicional de Misticismo de kivotosiano, …, inyección de Misticismo en fetos, … (omisión). Ver adjuntos.\nNota: Clasificado como asunto ultrasecreto.\n\nConclusión: Cálculos adicionales basados en los datos confirman que, por más que se retrase el colapso, es imposible aplazarlo más allá de 10 años.\n\nInforme adicional: Se observa progreso en los experimentos de traje mecanizado, impulsados por la prohibición absoluta de experimentación humana y por la obtención de estos datos. Sin embargo, para avanzar hacia investigación práctica se requiere cooperación con los militares, y parece inevitable revelar parte de estos materiales, por lo que se solicita autorización.\n\nEquipo de Investigación N.º 3, destacamento en Millennium."
 ABY_new_event.232.a:0 "En suspenso."

 ABY_new_event.233.t:0 "Resumen del Informe de Reunión Ministerial N.º 395, capítulo 86"
 ABY_new_event.233.d:0 "Estalla la disputa sobre si publicar o no los datos del informe de investigación de Millennium.\n\nSe acuerda publicar una parte de los datos al sector civil.\n\nLos datos detallados se revelarán al ejército, con normas para evitar filtraciones por debajo del rango de general.\n\n(omisión)\nResumen del N.º 396, capítulo 3\n\nConfirmado el informe detallado del plan «Juggernaut».\nDisputa de opiniones por el presupuesto excesivo requerido.\n\nRegistro eliminado.\n\nConclusión final emitida."
 ABY_new_event.233.a:0 "Se aprueba el plan Juggernaut."
 ABY_new_event.233.b:0 "Se rechaza el plan Juggernaut."

 ABY_new_event.234.t:0 "Informe del Ministerio de Economía: selección de corporación"
 ABY_new_event.234.d:0 "Para concentrar los recursos limitados del Estado y sentar las bases de la reconstrucción económica, se consideran especialmente viables las siguientes tres empresas como socios clave.\n\n· Grupo Nephthys (I+D tecnológica): Posee una capacidad de investigación única en Kivotos. No cuenta con una base productiva inmediata, pero tiene el potencial de asegurar, a largo plazo, la autosuficiencia tecnológica y la hegemonía de las industrias del futuro.\n\n· Corporación Rothschild (finanzas): Imprescindible para reconstruir el sistema financiero colapsado y atraer capital externo. La opción más segura para establecer una circulación económica estable.\n\n· Škoda Works (industria pesada/armamento): Garantiza efectos inmediatos para responder a las amenazas militares actuales y reforzar el poder de defensa. La alternativa más realista para la autosuficiencia militar de la coalición."
 ABY_new_event.234.a:0 "Rothschild & CO."
 ABY_new_event.234.b:0 "Škoda Works"
 ABY_new_event.234.c:0 "Grupo Nephthys"

 ABY_new_event.235.t:0 "Asagiri Suou"
 ABY_new_event.235.d:0 "Asagiri Suou, una comandante capaz que, durante la Gran Transición, reunió a Nephthys PMC tras perder a su mando supremo, resistió a Hyakkiyako y, durante la huida de Praga, apoyó al Gobierno Provisional con un tren blindado, ha prometido hoy oficialmente abandonar la Academia Ferroviaria Highlander y servir como comandante del ejército del Gobierno Provisional.\n\nCon ello, la Nephthys PMC bajo su mando (oficialmente propiedad del Grupo Nephthys) también pasó a ser fuerza del ejército del Gobierno Provisional.\n\nEl Gobierno Provisional expresa un profundo agradecimiento, y ella también ha jurado lealtad."
 ABY_new_event.235.a:0 "¡Con alguien tan capaz de nuestro lado, el futuro del Gobierno Provisional se ve brillante!"

