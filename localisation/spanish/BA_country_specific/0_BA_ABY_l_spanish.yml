 ABY_new_event.201.t:0 "¡Levantamiento de los alemanes de los Sudetes!"
 ABY_new_event.201.d:0 "¡Se ha confirmado que en Bohemia también existían organizaciones independientes, reunidas por Abydos bajo la bandera de la autonomía étnica en varias regiones bohemias!\n\nAhora, estas fuerzas han declarado una insurrección revolucionaria contra nosotros en cooperación con el esfuerzo bélico de Abydos, y en la región de Silesia de los Sudetes ya se están librando combates."
 ABY_new_event.201.a:0 "¡Maldita sea!"

