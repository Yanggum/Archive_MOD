  ABY_new_event.63.t:0 "Refugio de los judíos"
 ABY_new_event.63.d:0 "Justo después de la Gran Transición, los judíos mostraron reacciones diversas.\n\nAlgunos celebraron; otros gritaron desesperados. Las razones del grito serían distintas para cada uno, pero las razones del júbilo eran, en general, las mismas: la esperanza de poder escapar de la persecución antijudía que se extendía por toda Europa. Era evidente que el gobierno de los forasteros de otro mundo no se interesaría por si alguien era judío o no. Y así fue… pero precisamente eso se convirtió en su error.\nHasta ahora, los gobiernos locales, ya fuera por convicciones personales o para no mostrar debilidad ante el exterior, habían contenido —aunque fuera de manera superficial— la violencia antisemita mediante el uso del poder público. Sin embargo, el gobierno de los forasteros no tenía el menor interés en los conflictos entre los nativos. No: los avivó aún más. Ninguna autoridad pudo protegerlos. Y el júbilo inicial terminó transformándose en desesperación, en gritos. Buscaron un refugio… y llegaron a uno de los gobiernos de los forasteros.\n\nEl Gobierno Provisional de Abydos: prácticamente el único gobierno donde los forasteros y los locales se unían y se trataban en igualdad. Ellos respaldaron a la empresa judía Rothschild como corporación representativa del Estado, permitieron la inmigración judía sin restricciones, otorgaron ciudadanía inmediata y reconocieron y protegieron los derechos religiosos y culturales del pueblo judío. Un auténtico paraíso en el que los judíos podían ser tratados como personas.\n\nComo resultado, hoy también se congregan judíos en el puesto de control migratorio de Abydos.\n\n«Yo… ¿de verdad aquí… podremos vivir seguros?»\n\nLos agentes de migración, formados por forasteros y locales, sonrieron y respondieron."
 ABY_new_event.63.a:0 "\"Por supuesto. Ustedes solo son europeos que profesan el judaísmo.\""
 ABY_new_event.63.b:0 "\"Por supuesto. Aquí los judíos están a salvo.\""

 ABY_new_event.64.t:0 "Una alianza que enlaza la esperanza"
 ABY_new_event.64.d:0 "Tomáš Masaryk no perdió la esperanza ni siquiera después de que Checoslovaquia colapsara a manos de Hyakkiyako. Se esforzó por reagrupar a los ministros y generales dispersos y, como resultado, logró sentar las bases de una nueva coalición al convencer a líderes militares como Vojtěch Luža y Richard Tesařík, así como a políticos encabezados por Štefan Osuský. Aunque cada uno tenía objetivos distintos, juraron seguir al Gobierno Provisional de Abydos —heredero del espíritu del Gobierno Provisional de Checoslovaquia— y cooperar, cumpliendo cada cual su papel.\n\nEn la sala de reuniones, Masaryk habló con voz grave:\n«Ahora cada uno de nosotros tiene su propio objetivo, pero si las facciones alemana, checa y de Abydos no unen fuerzas, nadie podrá triunfar. Nuestra experiencia y capacidades son indispensables para fortalecer esta coalición.»\n\nVojtěch Luža asintió en silencio y dijo:\n«Excelencia, hemos avanzado en las negociaciones con las organizaciones de resistencia germanas y obtuvimos resultados significativos. A cambio de que nuestro cuerpo de oficiales los entrene y forme suboficiales, aceptaron someterse a nuestro mando. Para liberar Chequia y Austria, nos necesitamos mutuamente; una acción organizada, digna del nombre de las Fuerzas Aliadas del Gobierno Provisional, será posible.»\n\nŠtefan Osuský añadió:\n«También es nuestro deber apoyar a un Gobierno Provisional de Abydos políticamente inexperto y fomentar la cooperación entre fuerzas diversas. Debemos coexistir en esta coalición y cumplir con fidelidad nuestro papel.»\n\nEdvard Beneš observó la escena y sonrió levemente:\n«Tomáš, mire. Aún tenemos camaradas dispuestos a consagrarse por Checoslovaquia. Con ellos, sin duda lograremos liberar la patria.»\n\nMasaryk asintió con determinación y concluyó con voz firme:\n«Sin su entrega y esfuerzo, la cooperación de hoy habría sido imposible. Aunque nuestros objetivos no sean idénticos, debemos avanzar juntos hacia la liberación de esta tierra y hacia un nuevo futuro. Les pido que cada uno dé lo mejor de sí en el lugar que le corresponde.»"
 ABY_new_event.64.a:0 "At zije Ceskoslovensko!(¡Viva Checoslovaquia!)"

