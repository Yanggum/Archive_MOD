 ########################################################

 ABY_focus_establish_sekhmet: "Formar la Brigada Sekhmet"
 ABY_focus_establish_sekhmet_desc: "Parece que esos fascistas no conocen la palabra “conciencia”. ¿Secuestraron a todos nuestros compañeros y ahora dicen que, si queremos salvarlos, vayamos con ellos? No. Eso no va a pasar.\nKurokami Serika, la única que logró escapar de sus garras, fundó la Brigada Sekhmet —nombrada por la diosa de la venganza— con una sola determinación: rescatar al Comité de Contramedidas."

 ABY_focus_contact_with_hyakkaryoran: "Contactar con Hyakkaryōran"
 ABY_focus_contact_with_hyakkaryoran_desc: "Kiryu Kikyo, de Hyakkaryōran de la Academia Aliada Hyakkiyako, ha reunido a gente con intereses comunes para formar una resistencia, buscando vengar a su compañera de club, Kadenokōji Yukari. Si Kikyo se une, será una oportunidad para compensar la falta de visión estratégica de Serika."

 ABY_focus_deal_with_genbushokai: "Trato con la Sociedad Comercial Genbu"
 ABY_focus_deal_with_genbushokai_desc: "La Sociedad Comercial Genbu de Shanhaijing ha sobrevivido adaptándose a los cambios… pero bajo la opresión fascista no durará mucho. Si dejamos claro que unirse a nuestra causa también es su camino para sobrevivir, tarde o temprano se pondrán de nuestro lado."

 ABY_focus_succeed_legitimacy: "Declarar la sucesión de la legitimidad del Comité de Contramedidas"
 ABY_focus_succeed_legitimacy_desc: "Quien más contribuyó a la integración de Chequia y Austria fue el Comité de Contramedidas. Kurokami Serika, su única superviviente, proclamó que ella es quien hereda su legitimidad."

 ABY_focus_expand_guerilla: "Expandir la guerrilla"
 ABY_focus_expand_guerilla_desc: "¡Esos fascistas deben sufrir, cueste lo que cueste!"

 ABY_focus_persuade_czech: "Convencer a los checos"
 ABY_focus_persuade_czech_desc: "Hay muchos checos que guardan resentimiento por el liderazgo austríaco. Podemos atraerlos a la sublevación a cambio de beneficios políticos en el futuro."

 ABY_focus_overthrow_austrian_fascism_government: "Derrocar al gobierno fascista austríaco"
 ABY_focus_overthrow_austrian_fascism_government_desc: "Ha llegado el momento de responder a la sangre derramada por los kivotosianos. ¡Levantaremos una insurrección contra el gobierno fascista de Austria y los expulsaremos por completo!"

 ABY_focus_vengeance_for_abydos: "La venganza de Abydos"
 ABY_focus_vengeance_for_abydos_desc: "El Frente Patriótico le arrebató por completo la felicidad a Abydos. Sería justo devolverles el golpe… pero Serika no podía sacarse de la cabeza unas palabras que Takanashi Hoshino dijo tiempo atrás. Tras dudarlo, Serika tomó una decisión y comenzó su propia venganza."

 ABY_focus_threats_outside: "Amenazas externas"
 ABY_focus_threats_outside_desc: "Por desgracia, los cuadros principales del Frente Patriótico escaparon al exterior cruzando una frontera indefensa. Serika sostiene que, si no se elimina por completo a los remanentes, habrá más víctimas. Sin embargo, la jefa de operaciones Kikyo aconseja que primero debemos ocuparnos del Estado fascista kivotosiano.\nLo único seguro es que, sea cual sea el camino, debemos prepararnos para la guerra."

 ABY_focus_exterminate_kivotos_fascism: "Erradicar el fascismo de Kivotos"
 ABY_focus_exterminate_kivotos_fascism_desc: "No podemos pasar por alto que kivotosianos como nosotros hayan caído ante el veneno del fascismo. Los del norte se han embriagado con ese veneno; nos corresponde despertarlos."

 ABY_focus_accept_prefect_team: "Aceptar el exilio del Comité de Disciplina"
 ABY_focus_accept_prefect_team_desc: "El Comité de Disciplina defendía el ideal correcto: priorizar a los kivotosianos. Comparten nuestro objetivo; debemos acogerlos como corresponde."

 ABY_focus_plan_antigerman_riot: "Incitar manifestaciones anti-alemanas"
 ABY_focus_plan_antigerman_riot_desc: "Entre los habitantes de Gehenna hay quienes están descontentos con la decisión de Makoto de priorizar a los alemanes por encima de los kivotosianos. Si les damos un pequeño pretexto, no será difícil instigarlos."

 ABY_focus_prepare_for_halo_war: "Prepararse para la guerra de halos"
 ABY_focus_prepare_for_halo_war_desc: "Ya vencimos a Hyakkiyako y Shanhaijing, pero fue más por estrategia que por superioridad nacional. Ahora el enemigo es un país con un poder militar enorme que ha ocupado tanto Gehenna como Trinity. La estrategia por sí sola tiene límites; debemos prepararnos también para una guerra total entre infanterías Halo."

 ABY_focus_attack_german_fascists: "Atacar a los fascistas alemanes"
 ABY_focus_attack_german_fascists_desc: "Hemos recibido inteligencia de que la Marina de Guerra alemana está estacionada en una isla cercana al territorio alemán. Incluso si no nos amenazan hoy, lo harán algún día. Debemos cortar el brote antes de que crezca."

 ABY_focus_operation_austerlitz: "Operación Austerlitz"
 ABY_focus_operation_austerlitz_desc: "Ha llegado la hora decisiva. ¡Con esta guerra, el fascismo de Kivotos desaparecerá por completo!"

 ABY_focus_eliminate_terran_fascism: "Erradicar el fascismo terrícola"
 ABY_focus_eliminate_terran_fascism_desc: "La dirección de la venganza ya está decidida. Debemos juzgar a los terrícolas que profesan el fascismo."

 ABY_focus_ally_with_kivotos_states: "Tender la mano a los estados de Kivotos"
 ABY_focus_ally_with_kivotos_states_desc: "Mientras estemos en guerra contra los terrícolas, necesitamos estabilidad en la retaguardia. Enviaremos emisarios a todos los estados de Trinity que aún existan para proponer cooperación."

 ABY_focus_judge_josef_tiso: "Juzgar a Jozef Tiso"
 ABY_focus_judge_josef_tiso_desc: "Jozef Tiso es un fascista clerical oportunista. Que un fascista pueda golpearnos en cualquier momento significa que una semilla de desastre está brotando bajo nuestros pies."

 ABY_focus_end_of_bizzare_regency: "El fin de la extraña regencia"
 ABY_focus_end_of_bizzare_regency_desc: "Se dice que la región de Burgenland, que controlamos, fue originalmente territorio húngaro. Si Hungría clama por el revisionismo, el choque con nosotros será cuestión de tiempo. Debemos movernos primero."

 ABY_focus_pressure_toward_yugoslavia: "Presionar a Yugoslavia"
 ABY_focus_pressure_toward_yugoslavia_desc: "Para atacar a Italia —nuestro objetivo final— con eficiencia, exigiremos a Yugoslavia la cesión de ciertos territorios. Lo acompañaremos con un ultimátum: negarse sería ayudar a los fascistas."

 ABY_focus_operation_odoacer: "Operación Odoacro"
 ABY_focus_operation_odoacer_desc: "Se ha confirmado que la mayoría de los remanentes del Frente Patriótico huyeron al sur, hacia Italia. ¡Debemos conquistar Italia, cuna del fascismo, y extinguir el fascismo en Europa!"

 ABY_focus_stalking_vf_remnants: "Cazar los remanentes del Frente Patriótico"
 ABY_focus_stalking_vf_remnants_desc: "Tras desmoronarse, el Frente Patriótico se dispersó por muchas partes, pero seguimos recibiendo informes de que buscan una oportunidad de revancha desde cerca. Debemos rastrearlos y capturarlos a todos."

 ABY_focus_demand_vf_to_swiss: "Exigir a Suiza la entrega de los remanentes"
 ABY_focus_demand_vf_to_swiss_desc: "Hemos obtenido información reciente de que Ernst Rüdiger Starhemberg, líder del Frente Patriótico, ha huido a Suiza. Atacar Suiza también nos forzaría a sangrar; por eso, para “preservar su neutralidad”, exigiremos que entreguen a Starhemberg."

 ABY_focus_though_war_is_over: "La guerra terminó, pero…"
 ABY_focus_though_war_is_over_desc: "Kurokami Serika ha corrido hasta ahora mirando solo a la venganza. Logró la venganza que quería, pero su corazón sigue sintiéndose asfixiado.\n\n¿Podrá encontrar un nuevo sentido para su vida?"

 ABY_focus_bloodthirst_of_lion: "La sed del león"
 ABY_focus_bloodthirst_of_lion_desc: "\"Aún no… ¡aún no ha terminado la venganza…!\"\n\nCreímos que erradicar el fascismo era la mejor venganza. Pero al ver cómo los locales empezaban a resistirse, los pensamientos de Serika comenzaron a cambiar. Si no fuera por ellos, el Comité de Contramedidas no habría muerto…"

 ABY_focus_ungrateful_purge: "Purga ingrata"
 ABY_focus_ungrateful_purge_desc: "Al notar el giro de Serika, Kikyo intenta, como sea, convencerla de detener más guerras. Aunque hemos recibido mucho de su ayuda, si intenta impedir nuestro nuevo ideal, debemos eliminarla sin piedad.\n\nLa piedra angular se ha convertido en un obstáculo que hay que arrancar."

 ABY_focus_general_mobilization_order: "Orden de movilización para la guerra"
 ABY_focus_general_mobilization_order_desc: "Para hacer realidad el nuevo sueño de Serika, el Estado se movilizará al máximo, incluso si tiene que prepararse para una guerra interminable."

 ABY_focus_reversed_halo: "Halo invertido"
 ABY_focus_reversed_halo_desc: "\"¿Eh…? ¿Mi halo siempre fue así…?\"\n\nCuando Serika notó la anomalía, ya era demasiado tarde."

 ABY_focus_until_all_terrans_die: "Hasta que mueran todos los terrícolas"
 ABY_focus_until_all_terrans_die_desc: "Poseída por el misterio de la guerra y la venganza, Serika inició una sangrienta revancha contra los terrícolas."

 ABY_focus_bloody_ecstacy: "Éxtasis sangriento"
 ABY_focus_bloody_ecstacy_desc: "Al ver la sangre humana derramarse, ella reía… y reía. En carcajadas, iba matando enemigos uno tras otro. Ante su figura, enemigos y aliados temblaban de terror…"

 ABY_focus_girl_dyed_with_blood: "La chica teñida de sangre"
 ABY_focus_girl_dyed_with_blood_desc: "La situación en el frente empeora y la moral del pueblo se desploma. Solo la risa de Sekhmet resuena junto a los disparos.\n\nPero no tardará en llegar el día en que Sekhmet, sin tiempo siquiera de sentir el vacío de la venganza, beba la copa que le ha sido devuelta."

 ABY_focus_end_of_vengeance: "El fin de la venganza"
 ABY_focus_end_of_vengeance_desc: "Serika recordó por qué provocó la guerra. Arrancar el Frente Patriótico de raíz era, al final, por la seguridad de los kivotosianos inocentes. El objetivo se ha cumplido; ahora es el momento de construir un país para los kivotosianos."

 ABY_focus_ideal_of_integration: "El ideal de la integración"
 ABY_focus_ideal_of_integration_desc: "Tras la guerra, el pueblo se ha ido unificando cada vez más. Ahora sueñan con el ideal de la integración del Sur de Kivotos."

 ABY_focus_southern_kivotos_industries: "Desarrollo industrial del Sur de Kivotos"
 ABY_focus_southern_kivotos_industries_desc: "Hemos recuperado la paz; ahora podemos invertir en el desarrollo económico. Un enorme complejo industrial que abarca tres academias ha comenzado a construirse."

 ABY_focus_effort_for_peace: "Esfuerzo por la paz"
 ABY_focus_effort_for_peace_desc: "Ya no seremos quienes impulsen guerras. Una parte del gasto militar se invertirá ahora en elevar el nivel de vida."

 ABY_focus_restore_sightseeing: "Restaurar el turismo"
 ABY_focus_restore_sightseeing_desc: "Hyakkiyako y Shanhaijing dependen en gran medida del turismo. Reconstruir el sector turístico —apagado por el Gran Traslado y la guerra— también beneficiará a nuestra economía."

 ABY_focus_expand_fortress: "Ampliar las fortificaciones"
 ABY_focus_expand_fortress_desc: "Hay un dicho: si quieres la paz, prepárate para la guerra. Aunque el exterior esté estable por ahora, también es necesario estar listos para el día en que nuestra paz sea amenazada."

 ABY_focus_negotiation_again: "Renegociación"
 ABY_focus_negotiation_again_desc: "A diferencia de Hyakkaryōran, que eligió acompañar por completo a Serika, Shanhaijing cooperó con nosotros guardándose un as bajo la manga. Ahora es el momento de volver a persuadirlos."

 ABY_focus_serika_dictatorship: "La dictadura de Serika"
 ABY_focus_serika_dictatorship_desc: "Derrocar al gobierno austríaco que oprimía a los kivotosianos, ganar la guerra y barrer al Frente Patriótico… nada de eso habría empezado sin Serika. La líder del Estado unificado debe ser, como corresponde, Serika."

 ABY_focus_kivotos_priority: "Kivotosianos primero"
 ABY_focus_kivotos_priority_desc: "Estableceremos un nuevo orden en el que los kivotosianos reciban un trato preferente. Pero también subrayaremos que no es por ser “superiores”, sino porque en este mundo aún somos vulnerables."

 ABY_focus_new_kivotos_council: "Un nuevo Consejo Estudiantil de Kivotos"
 ABY_focus_new_kivotos_council_desc: "El Consejo Estudiantil General ha quedado paralizado y ya no cumple su función. Debemos crear un nuevo consejo para contener el caos venidero."

 ABY_focus_abydos_sand_fiesta: "Festival de Arena de Abydos"
 ABY_focus_abydos_sand_fiesta_desc: "Aprovechando que el Gran Traslado movió terrenos desérticos, Serika planea celebrar un festival de arena. Esto curará el cuerpo y el espíritu de los agotados, y además simbolizará que Abydos lidera el Sur de Kivotos."

 ABY_focus_restore_democracy: "Restaurar la democracia"
 ABY_focus_restore_democracy_desc: "Antes del Gran Traslado, Chequia era el único Estado democrático de Europa Central. Reconstruir la democracia también ayudará a integrar a los dos pueblos."

 ABY_focus_assembly_of_people: "Parlamento de todo el pueblo"
 ABY_focus_assembly_of_people_desc: "Si solo se escucha a un lado e ignoras al otro, el conflicto es inevitable. Si el parlamento se compone en partes iguales de kivotosianos y locales, se podrá respetar la voz de ambos."

 ABY_focus_combination_between_two_people: "Integración de dos pueblos"
 ABY_focus_combination_between_two_people_desc: "El Sur de Kivotos unificado será un Estado donde ambos pueblos sean respetados."

 ABY_focus_lamp_festival_for_new_era: "Festival de Faroles para una nueva era"
 ABY_focus_lamp_festival_for_new_era_desc: "En el pasado, en la Academia Aliada Hyakkiyako celebraban un festival de faroles para pedir la unidad del campus, dejando flotar faroles en el agua. Con ese mismo sentido, el Parlamento del Sur de Kivotos ha declarado que celebrará un festival de faroles para desear la integración."

 ABY_focus_girl_with_white_uniform: "La chica del uniforme blanco"
 ABY_focus_girl_with_white_uniform_desc: "Cuando el Comité de Contramedidas quedó reducido a Serika como única superviviente, el destino del Sur de Kivotos pendía de un hilo. Pero Serika reunió a quienes compartían su voluntad y, al final, cambió ese destino miserable.\n\nMientras observa las calles pacíficas del Sur de Kivotos ya unificado, Serika se dirige al querido campus para contarles a los miembros del Comité cómo le ha ido…"

##################################################################################################################################################

### 육군 중점 (현지군 및 일반 교리)
### 육군 중점
 ABY_focus_army_1: "Disolver las milicias"
 ABY_focus_army_1_desc: "Justo después del Gran Traslado, la entrega de las milicias y patrullas vecinales que se alzaron voluntariamente para proteger a la patria sumida en el caos quedará grabada para siempre en la historia. Sin embargo, ahora que el sistema estatal se está estabilizando y el ejército regular se reconstruye, unas milicias con cadenas de mando difusas y niveles de entrenamiento dispares pueden convertirse en un factor que reduzca la eficiencia de las operaciones militares. Debemos agradecerles su servicio y disolverlas con honor, o bien integrarlas como parte del ejército regular mediante un riguroso proceso de selección. La guerra moderna no se gana solo con patriotismo ardiente; únicamente el entrenamiento avanzado y un mando y control perfectamente coordinados pueden garantizar la victoria. La era de los amateurs ha terminado."

 ABY_focus_army_2: "Prioridad: defensa nacional"
 ABY_focus_army_2_desc: "La realidad, fría e implacable, es que nuestro poder nacional y nuestras fuerzas armadas son insuficientes frente a los potenciales enemigos que nos rodean. En estas circunstancias, expandir el frente de forma temeraria o adoptar acciones militares agresivas solo nos llevaría a la autodestrucción. Debemos fortificar los puntos clave del territorio y construir líneas defensivas escalonadas en las rutas de avance del enemigo, obligándolo a desangrarse mediante una estrategia de desgaste. Nuestro objetivo no es la expansión territorial, sino la supervivencia de la patria. Hagan que el enemigo estrelle su cabeza contra nuestra defensa de acero y derrame su sangre. Cada gota de nuestra sangre debe intercambiarse por diez del enemigo, y cada piedra de esta tierra será, para ellos, una montaña imposible de superar."

 ABY_focus_army_3: "Prioridad: golpe preventivo"
 ABY_focus_army_3_desc: "Con una postura puramente defensiva no se puede tomar la iniciativa en la guerra. La mejor defensa es un ataque tan poderoso que el enemigo ni siquiera se atreva a intentarlo. Antes de que el enemigo concentre sus fuerzas y complete sus líneas de suministro, debemos golpear su corazón en el momento de máxima vulnerabilidad. Establezcan una doctrina de ataque preventivo relámpago, concentrando una movilidad y una potencia de fuego superiores para tomar al enemigo por sorpresa. Solo paralizando su mando y quebrando su voluntad de combatir podremos, pese a nuestra desventaja, hacernos con la victoria. Solo quien lee el flujo del campo de batalla y se mueve primero puede bailar con la diosa de la victoria. Dudar es perder."

 ABY_focus_army_4: "Introducir trincheras tácticas"
 ABY_focus_army_4_desc: "La guerra de trincheras no es, ni mucho menos, una reliquia de tiempos pasados. Debemos combinar los avanzados conceptos defensivos transmitidos desde Kivotos con la geografía accidentada de nuestro territorio para construir una red defensiva orgánica, no simples zanjas. Configuren fuegos cruzados capaces de cubrirse mutuamente y construyan búnkeres robustos y pasadizos subterráneos que protejan a nuestras fuerzas de la artillería y los ataques aéreos enemigos. Estas trincheras tácticas modernas serán un pantano que ralentice al enemigo y, a la vez, un trampolín para el contraataque. Por muchos proyectiles que el enemigo descargue, nosotros podremos tomar aliento bajo tierra y preparar un golpe mortal. Es una fortaleza de acero inmóvil."

 ABY_focus_army_5: "Establecer un sistema de mando central"
 ABY_focus_army_5_desc: "Para que unidades de orígenes y trasfondos distintos se muevan como un solo organismo, es imprescindible un sistema de control central fuerte y unificado. Creen un mando integrado que abarque ejército, fuerza aérea e incluso unidades Halo, y modernicen una red avanzada de comunicaciones para que las órdenes del cuartel general lleguen con rapidez y precisión hasta el último soldado en primera línea. La proliferación de mandos y la desobediencia de órdenes son el enemigo más peligroso: conducen directamente a la derrota. Solo cuando todas las unidades se muevan con una sola cabeza y una sola voluntad podremos aplastar al enemigo. Sofocar el caos y establecer el orden: ese es el primer paso hacia la victoria."

 ABY_focus_army_6: "Extender el tiempo de servicio"
 ABY_focus_army_6_desc: "En una situación de crisis donde se respira el presagio de la guerra, licenciar soldados precipitadamente sería una apuesta peligrosa que abriría un vacío grave en la defensa nacional. Formar a un soldado veterano requiere mucho tiempo; perderlo, apenas un instante. Debemos extender inevitablemente el servicio obligatorio para mantener el mayor número posible de tropas de élite con experiencia de combate. Habrá descontento entre soldados y familias, pero con la patria al borde del abismo no queda más remedio que exigir sacrificios individuales. Necesitamos más fusiles… y más manos capaces de usarlos. El sudor que derramamos hoy sustituirá la sangre de nuestras familias mañana."

 ABY_focus_army_7: "Aplanar el campo de batalla"
 ABY_focus_army_7_desc: "La forma más segura —y más despiadada— de eliminar todos los peligros en la ruta de avance, ya sean campos minados, alambradas superpuestas o líneas de trincheras en emboscada, es la proyección de una potencia de fuego abrumadora. Antes de que la infantería ponga un pie en terreno peligroso, movilicen toda la artillería disponible y ejecuten un bombardeo sin límites hasta aplanar físicamente el terreno. Como si un dios arara la tierra con un arado colosal, debemos hacer volar defensas y trampas sin dejar rastro. Cuando el humo se disipe, sobre los montículos de tierra volteada solo quedará un camino seguro y llano para nuestro avance. Si hay un obstáculo, lo reducimos a polvo y abrimos la ruta. Esa es nuestra manera."

 ABY_focus_army_8: "El legado de la Gran Guerra"
 ABY_focus_army_8_desc: "Las lecciones sangrientas de la Gran Guerra (Primera Guerra Mundial) siguen vigentes. Volcar una potencia de fuego masiva sobre las defensas enemigas y forzar un desgaste constante hasta agotar sus recursos humanos y materiales les provocará una pesadilla. Aunque nos acusen de despreciar vidas, no hay razón para renunciar a una ecuación de victoria ya probada. Una postura de guerra total —incluyendo duelos de artillería, guerra de trincheras e incluso el empleo de gas venenoso— implantará en el enemigo el terror de que, para ganar, no dudaremos en recurrir a cualquier medio. La guerra no es romanticismo: es la realidad más cruel, y existe para ganar."

 ABY_focus_army_9: "El camino de la vida"
 ABY_focus_army_9_desc: "Un suministro ininterrumpido en el frente es la línea vital y la arteria del ejército. Debemos fortificar las líneas logísticas de retaguardia y mejorar drásticamente el sistema de transporte para que los soldados no se queden sin munición ni pasen hambre. El ferrocarril es más importante que los tanques, y los camiones más valiosos que los fusiles. El enemigo intentará cortar nuestra ruta de suministro infiltrando fuerzas especiales o bombardeando desde el aire, pero defenderemos este 'camino de la vida' a cualquier costo. Si la logística colapsa, el ejército colapsa. Recuerden: la punta de la pluma de un oficial de suministros puede salvar a más soldados que la hoja del comandante enemigo."

 ABY_focus_army_10: "Reforzar la cohesión de las unidades"
 ABY_focus_army_10_desc: "Lo que une a soldados de orígenes, etnias y trayectorias diferentes en un solo ejército de acero es el compañerismo y la cohesión. Refuercen los vínculos mediante entrenamientos conjuntos intensivos y educación moral, construyendo una confianza capaz de hacer que arriesguen la vida unos por otros. Saber que hay un compañero al que puedes confiar tu espalda da más valor que cualquier arma de última generación. Un ejército unido bajo un solo nombre —la 'Fuerza Federal de Abydos'— podrá superar diferencias materiales y crear milagros. Somos hermanos."

 ABY_focus_army_11: "Expandir la red logística"
 ABY_focus_army_11_desc: "Cuanto más se adentre el ejército en territorio enemigo, más aumentará exponencialmente la demanda de suministros, y más largas y frágiles serán las líneas logísticas. Debemos ampliar la red ferroviaria, pavimentar carreteras e instalar depósitos de campaña a lo largo del frente para elevar drásticamente nuestra capacidad de sostener operaciones. El límite del suministro es el límite del avance. Empujaremos ese límite más lejos y más amplio, para que nuestras tropas reciban lo necesario de inmediato sin importar dónde estén. La caravana incesante de camiones será el motor que haga posible un avance sin descanso."

 ABY_focus_army_12: "Hierro y pólvora"
 ABY_focus_army_12_desc: "El dios de la guerra, dormido, despierta con el olor acre del hierro y la pólvora. Los proyectiles producidos al movilizar toda nuestra capacidad industrial —desde las fábricas de Škoda hasta las acerías de Vítkovice— caerán como lluvia de acero sobre el enemigo. Se escondan en trincheras o se hundan en búnkeres, nuestras granadas los encontrarán. No habrá refugio en esta tierra. Solo una potencia artillera abrumadora puede aplastar por completo la voluntad de resistencia y traer la victoria: más cañones, más proyectiles, explosiones más grandes. Este es el único idioma con el que hablaremos con el enemigo."

 ABY_focus_army_13: "Gran estrategia"
 ABY_focus_army_13_desc: "Ganar batallas locales no garantiza la victoria en la guerra. No debemos embriagarnos con triunfos pequeños: hay que leer la partida completa, coordinando en conjunto la política, la diplomacia, la economía y el poder militar del Estado. Predigan a gran escala los movimientos del enemigo y diseñen una gran estrategia meticulosa que maximice nuestras fortalezas y compense debilidades. Muevan las piezas con la visión de quien mira todo el tablero de ajedrez. A veces, hará falta la decisión audaz de ceder carne para tomar hueso. La guerra no se hace con fusiles: se hace con la mente."

 ABY_focus_army_14: "Asalto masivo"
 ABY_focus_army_14_desc: "Cuando la táctica compleja o la habilidad no bastan, no hay método más seguro y demoledor que desgarrar el frente enemigo de frente con una superioridad aplastante de tropas. Elevar al máximo la moral y ejecutar asaltos simultáneos y en oleadas por todo el frente. Ante el ímpetu de nuestras fuerzas que avanzan con gritos, el enemigo cederá, aterrorizado, abandonando posiciones y huyendo. La marea humana lo devorará todo. Habrá sacrificios, sí, pero es el precio que debemos pagar por la victoria. ¡Al ataque!"

 ABY_focus_army_15: "Superioridad de fuego"
 ABY_focus_army_15_desc: "Proyecten un fuego abrumador y sostenido hasta el punto de que la infantería enemiga no se atreva a sacar la cabeza de la trinchera. Integren orgánicamente todo el poder de fuego —armas ligeras, artillería, cañones de tanque y apoyo aéreo— y viértanlo sobre puntos clave. Borren toda forma de vida en el objetivo y hagan al enemigo desaparecer como polvo. En el campo de batalla no hay piedad: solo la potencia de fuego es la verdad, y una potencia de fuego mayor es una verdad mayor. No buscamos someter al enemigo; buscamos eliminarlo."

 ### Focos de infantería Halo
 ABY_focus_halo_1: "Reconstruir el ejército regular"
 ABY_focus_halo_1_desc: "El crecimiento exponencial del número de estudiantes no es solo un aumento poblacional: significa que el potencial militar de la federación está disparándose. Reclutaremos a estudiantes voluntarios y estableceremos un 'Mando Halo' con autoridad propia de mando y personal dentro del ejército, iniciando la formación de auténticas 'divisiones Halo'. Los estudiantes dejarán de ser guerrillas dispersas o fuerzas auxiliares; bajo un mando y control sistemáticos y entrenamiento militar, se convertirán en un activo estratégico central del ejército federal. Su misterio, unido a la disciplina militar, será una hoja más poderosa y afilada para proteger la patria."

 ABY_focus_halo_2: "Investigar la infantería mística"
 ABY_focus_halo_2_desc: "Los estudiantes portadores de 'Misterio' poseen una durabilidad sobrehumana difícil de herir con armas convencionales y una potencia de fuego capaz de rivalizar con un pelotón entero. Debemos analizar científicamente sus capacidades y convertirlas en datos tácticos, desarrollando doctrinas y organizaciones optimizadas. No dependeremos de “individuos fuertes”: probaremos su valor como 'arma estratégica' sistematizada capaz de voltear el tablero y alcanzar objetivos estratégicos. El Misterio no es un milagro; es un poder que debemos controlar y utilizar."

 ABY_focus_halo_3: "El deber de la lealtad"
 ABY_focus_halo_3_desc: "Los estudiantes son libres y de fuerte personalidad, pero ahora debemos inculcarles responsabilidad y pertenencia como soldados federales. Hay que recordarles una y otra vez que su poder especial no les pertenece solo a ellos: les fue dado para proteger a este país y a los ciudadanos que sufren. Mediante una intensa educación moral y el estudio de la historia federal, hagan que la luz del halo brille aún más como una lealtad inquebrantable hacia la patria. Antes que estudiantes, son soldados honorables de Abydos."

 ABY_focus_halo_4: "Doctrina de defensa activa"
 ABY_focus_halo_4_desc: "Aprovechando la extraordinaria capacidad física y reflejos de los estudiantes, estableceremos una defensa activa: no resistir pasivamente en trincheras, sino cortar el ataque enemigo desde su punto de partida. Al detectar señales de ofensiva, maniobrar de inmediato para romper la punta de lanza y contraatacar, convirtiendo la defensa en ofensiva. Esta defensa móvil minimizará nuestras bajas. No bloquear con el escudo, sino abatir la espada del enemigo con la nuestra. Esa es la defensa que buscamos."

 ABY_focus_halo_5: "La infantería mística de una nueva era"
 ABY_focus_halo_5_desc: "No podemos abandonar la humanidad y convertirnos en demonios por la victoria. Cancelaremos por completo los experimentos “Halo artificial” antiéticos e inhumanos que consumen la vida del sujeto, y adoptaremos oficialmente la tecnología de exoesqueletos reforzados con energía mística: los 'Juggernauts'. Aunque su coste de producción sea enorme, estas armaduras de acero demostrarán simultáneamente nuestra superioridad técnica y legitimidad moral, ofreciendo una potencia de combate comparable a la de los kivotosianos sin dañar la salud del usuario. Luchamos para proteger la vida, no para usarla como consumible."

 ABY_focus_halo_6: "Ampliar el ejército regular"
 ABY_focus_halo_6_desc: "Debemos ampliar el reclutamiento a más estudiantes y aplicar entrenamiento intensivo para aumentar el número de divisiones de infantería Halo. Más allá de los límites de una fuerza especial pequeña, formaremos un ejército lo bastante grande como para cubrir todo el frente y actuar como fuerza principal en guerras de gran escala. Para que el crecimiento cuantitativo no degrade la calidad, mantendremos criterios estrictos de selección y un programa de entrenamiento estandarizado. La innumerable luz de halos que cubra el campo de batalla traerá desesperación al enemigo."

 ABY_focus_halo_7: "Introducir tecnología de enlace de datos"
 ABY_focus_halo_7_desc: "Para exprimir al 100% el potencial de los trajes Juggernaut, es imprescindible una conexión orgánica entre pilotos. Implementen un sistema de enlace de datos en tiempo real basado en tecnología de Millennium, compartiendo información de sensores de cada traje, comprendiendo el campo de batalla en 3D y transmitiéndolo al mando. No será un conjunto de máquinas: será una legión de acero moviéndose como una sola red nerviosa. Compartir información es supervivencia y victoria."

 ABY_focus_halo_8: "Investigar el portaaviones terrestre de apoyo"
 ABY_focus_halo_8_desc: "Los trajes Juggernaut son poderosos, pero requieren muchos recursos e instalaciones para mantenimiento, carga y reabastecimiento. Para apoyarlos eficientemente desarrollaremos un enorme 'portaaviones terrestre de apoyo' que se despliegue a lo largo del frente. Taller móvil, estación de carga y refugio para los soldados: este buque terrestre será un faro que permitirá a las unidades Juggernaut operar en profundidad sin preocuparse por el suministro. Como un barco cruzando el desierto, esta fortaleza de acero atravesará el yermo llevando la victoria."

 ABY_focus_halo_9: "Comandantes de asalto"
 ABY_focus_halo_9_desc: "Seleccionaremos estudiantes con gran poder de combate, carisma y una sobresaliente visión táctica para nombrarlos comandantes de asalto. No dirigirán desde búnkeres seguros en retaguardia: respirarán junto a la tropa en el frente, empuñando armas y abriendo brechas. Su ejemplo elevará la moral hasta las nubes. Los soldados estarán dispuestos a dar la vida por un líder que se lanza antes que ellos al peligro. Los héroes nacen en tiempos turbulentos y se forjan en campos de batalla bañados de sangre."

 ABY_focus_halo_10: "Guardianes de la Federación"
 ABY_focus_halo_10_desc: "Los estudiantes de Abydos ya no son extranjeros ni invitados. Son el escudo más sólido que protege a la federación y la lanza más afilada que perfora el corazón del enemigo. Los ciudadanos confían y los respetan; los estudiantes usan su poder por la seguridad y la felicidad del pueblo. Ese vínculo y esa confianza unirán a la nación con una fuerza mayor que cualquier arma física. Somos una comunidad de destino: nos protegemos mutuamente."

 ABY_focus_halo_11: "Fuerza de tarea terrestre"
 ABY_focus_halo_11_desc: "Con los Juggernauts como núcleo, formaremos una fuerza mecanizada de alta movilidad —la 'Fuerza de Tarea Terrestre'— con organización mixta de tanques, vehículos blindados, artillería autopropulsada y más. Cuando los Juggernauts rompan el frente, la infantería mecanizada y el apoyo de fuego ampliarán la brecha y asegurarán el territorio conquistado. Esta orden de caballeros de acero será el martillo federal que atraviese cualquier defensa y arrase la retaguardia. Muestren la armonía perfecta entre velocidad, potencia de fuego y protección."

 ABY_focus_halo_12: "El núcleo del ejército federal"
 ABY_focus_halo_12_desc: "La infantería Halo ya no es un apoyo: es el núcleo que lidera la planificación operativa del ejército federal. Toda estrategia y táctica se diseña para maximizar sus capacidades, y las fuerzas convencionales pasan a apoyar y cubrir los flancos. El protagonista del campo de batalla ha cambiado. Nuestra victoria depende de sus manos, de sus cañones… y de su Misterio. Si ellos fracasan, la federación fracasa."

 ABY_focus_halo_13: "Ola de luz"
 ABY_focus_halo_13_desc: "La luz resplandeciente de innumerables halos llenando el frente es, para los nuestros, un faro de esperanza; para el enemigo, la señal de una destrucción inminente. Inicien la gran ofensiva 'Ola de Luz', arrasando al enemigo con potencia de fuego abrumadora, poder místico y una voluntad inquebrantable. Ante el ejército luminoso que avanza como una marea furiosa, las fuerzas de la oscuridad desaparecerán sin dejar rastro. Nada puede detener esta marcha sagrada. ¡Avancen, hasta el día de la victoria!"

 ### Focos de la Fuerza Aérea
 ABY_focus_air_1: "Reconstruir la Fuerza Aérea"
 ABY_focus_air_1_desc: "Reparen las pistas destrozadas por los bombardeos y encuentren, limpien y ajusten los aparatos abandonados y cubiertos de polvo en las esquinas de los hangares. Un ejército que pierde el cielo es como un ave con las alas rotas: solo media fuerza. Aunque hoy solo tengamos unos cuantos biplanos viejos y entrenadores como inicio débil, volveremos a alzarnos con vigor hacia el firmamento. Quien domina el aire posee los ojos y oídos del campo de batalla, y gobierna la guerra. Para defender la tierra, primero debemos recuperar el cielo."

 ABY_focus_air_2: "Nueva doctrina aérea"
 ABY_focus_air_2_desc: "No podemos repetir las formas obsoletas del combate aéreo de la Gran Guerra. Debemos establecer doctrinas nuevas e innovadoras acordes a la guerra moderna, combinando orgánicamente la movilidad de los helicópteros y la potencia de fuego de las aeronaves de ala fija, y ejecutando apoyo aéreo cercano (CAS) en estrecha coordinación con las fuerzas terrestres. La fuerza aérea no solo lucha por su cuenta: debe ser un elemento clave que conduzca las operaciones de tierra a la victoria. La innovación en el cielo traerá la victoria en el suelo."

 ABY_focus_air_3: "Capturar cazas"
 ABY_focus_air_3_desc: "Los cazas a reacción modernos trasladados desde Kivotos son 'tecnología desbordada' que supera por completo nuestra comprensión y capacidad de copia. Debemos buscarlos y capturarlos desesperadamente en aeródromos clausurados o hangares secretos repartidos por los territorios ocupados. Aunque no podamos producirlos por falta de piezas y dificultades de mantenimiento, el estruendo que rasga el cielo y esos halcones de acero volando a velocidad supersónica sembrarán un miedo y una desesperación incomprensibles en el enemigo."

 ABY_focus_air_4: "Aviación del Ejército"
 ABY_focus_air_4_desc: "Crearemos una fuerza aérea bajo mando directo del ejército que apoye de inmediato según las órdenes del comandante terrestre, sin pasar por trámites complejos del mando aéreo. Helicópteros y aeronaves ligeras de ataque que vuelen sobre el frente, golpeen trincheras enemigas y cubran el avance serán el paraguas más confiable para la infantería. Una aviación que responde al instante a las necesidades del terreno elevará enormemente nuestra flexibilidad táctica. Infantería y aviación deben luchar como una sola."

 ABY_focus_air_5: "Espíritu de rama independiente"
 ABY_focus_air_5_desc: "La fuerza aérea no es una sirvienta del ejército ni un simple apoyo. Debemos fomentar su orgullo e identidad como arma independiente capaz de fijar y ejecutar objetivos estratégicos propios. Bombardeos estratégicos contra la retaguardia y dominio del aire para sellar la actividad enemiga son dominios letales y exclusivos del poder aéreo. El dueño del cielo somos nosotros, y sin interferencias de nadie protegeremos los cielos de la patria."

 ABY_focus_air_6: "La artillería del cielo"
 ABY_focus_air_6_desc: "El bombardeo guiado de alta precisión y los ataques con cohetes son cañones disparados desde el cielo. Golpeen más lejos, más alto y con mayor precisión que la artillería terrestre limitada por el terreno. Incluso bases logísticas o centros de mando en la retaguardia, que el enemigo cree seguros, están al alcance de nuestras bombas. Si la artillería es el dios del campo de batalla, la aviación es el rey de los dioses que juzga desde arriba. No existe lugar para escapar de la lluvia de muerte que cae del cielo."

 ABY_focus_air_7: "Golpe a tierra"
 ABY_focus_air_7_desc: "Concentremos el uso de aeronaves de ataque a tierra, especializadas en arrasar fuerzas mecanizadas, columnas de tanques y largas caravanas logísticas. Resistiendo el fuego antiaéreo con blindaje sólido y convirtiendo a los monstruos de acero en chatarra mediante cañones y misiles antitanque, estas aeronaves serán segadoras para los enemigos en tierra. Por grueso que sea el blindaje de un tanque, ante el halcón del cielo no es más que presa sin escapatoria."

 ABY_focus_air_8: "Dogfight"
 ABY_focus_air_8_desc: "Formen pilotos de la más alta pericia y lleven la maniobrabilidad al límite para asegurar una ventaja decisiva en el combate aéreo cerrado (dogfight). En esas vueltas feroces a la cola del enemigo y maniobras que desafían la gravedad, el instante de colocar al rival en la mira y derribarlo es la razón de ser y el orgullo del piloto. Gane los duelos del firmamento y limpie los cielos de los aviones enemigos que los ensucian."

 ABY_focus_air_9: "Especialización aérea"
 ABY_focus_air_9_desc: "En lugar de aeronaves polivalentes que hacen todo a medias, desarrollaremos y desplegaremos aparatos especializados y optimizados para misiones concretas: cazas de superioridad, cazabombarderos, reconocimiento, etc. Aeronaves que rindan al máximo en su campo elevarán drásticamente la tasa de éxito de las operaciones. Una hoja que domina una sola técnica hasta el extremo es la más afilada y letal."

 ABY_focus_air_10: "Terror primigenio"
 ABY_focus_air_10_desc: "El estruendo desgarrador que llega desde el cielo rompe la moral y desata el pánico incluso antes de que caigan las bombas. Maximicen la guerra psicológica instalando sirenas especialmente diseñadas (p. ej., las Trompetas de Jericó) en bombarderos en picado. El terror primitivo e instintivo de la muerte cayendo en vertical supera incluso la destrucción física: es el arma más eficiente. El enemigo huirá solo con oír ese sonido."

 ABY_focus_air_11: "Asesino de dioses"
 ABY_focus_air_11_desc: "Si la artillería terrestre es llamada 'dios del campo de batalla', la fuerza aérea debe ser quien mata a ese dios: el 'asesino de dioses'. Ataquen con precisión y neutralicen como objetivos prioritarios las posiciones de artillería, lanzacohetes múltiples, radares de contrabatería y demás activos clave. Cuando la potencia enemiga quede silenciada y su dios muera, nuestras fuerzas terrestres podrán avanzar sin temor al bombardeo. La lanza que mata dioses cae desde el cielo."

 ABY_focus_air_12: "El segundo campo de batalla"
 ABY_focus_air_12_desc: "Cuando la guerra terrestre se estanca y queda atrapada en trincheras, la salida está en el cielo. Definamos el aire no como un mero espacio de apoyo, sino como el segundo campo de batalla principal, y cambiemos el carácter de la guerra con operaciones aéreas masivas. Lanzamientos aerotransportados, asaltos a gran escala, bombardeos estratégicos: ataques multidimensionales desde el cielo volverán inútiles las defensas enemigas. Si no se puede ganar en tierra, se gana en el aire."

 ABY_focus_air_13: "Guardianes de la mayor altura"
 ABY_focus_air_13_desc: "Los interceptores de gran altitud que vuelan cerca de la estratosfera son los guardianes de la cota más alta de la patria. Aseguren que ni un solo bombardero estratégico o avión de reconocimiento enemigo pueda soltar una bomba en nuestro territorio ni espiar nuestros secretos. Por alto que vuelen, nuestros misiles y cazas los derribarán. Nuestros cielos estarán protegidos como una fortaleza, y bajo ellos los ciudadanos dormirán en paz. Somos el escudo del cielo."

 ### Focos de la Marina
 ABY_focus_navy_1: "Asegurar la costa"
 ABY_focus_navy_1_desc: "Durante mucho tiempo fuimos un país encerrado sin salida al mar, pero hoy se abre una oportunidad histórica: un camino hacia el océano. Acondicionen la valiosa costa que tanto nos costó asegurar y construyan puertos modernos y bases navales donde puedan atracar grandes buques, estableciendo un punto de apoyo para proyectar poder naval. Un país sin mar es una cárcel; renunciar al mar es renunciar al mundo. Hoy rompemos la puerta de esa prisión y alzamos anclas rumbo al gran azul."

 ABY_focus_navy_2: "Absorber tecnología de construcción naval"
 ABY_focus_navy_2_desc: "Nuestra tecnología naval aún gatea. Absorban activamente a técnicos expertos de las ciudades portuarias y el saber tradicional de construcción naval de la histórica Istria, investigando y desarrollando rápidamente una capacidad propia de construir buques. No se avergüencen de imitar: la imitación es madre de la creación. Sobre su base, forjaremos una flota poderosa hecha a nuestra medida. Algún día, naves construidas por nosotros surcarán los mares del mundo."

 ABY_focus_navy_3: "Marina de alta mar"
 ABY_focus_navy_3_desc: "No basta con contentarnos con el oleaje costero. Construyan una auténtica marina de operaciones oceánicas capaz de cortar líneas de suministro marítimas enemigas, golpear directamente su territorio y llegar donde haya intereses nacionales. El mar es amplio y nuestra ambición también. Hagan que nuestra bandera ondee más allá del horizonte, y que donde pase nuestra flota, ese mar se convierta en nuestro mar."

 ABY_focus_navy_4: "Marina defensiva"
 ABY_focus_navy_4_desc: "Con nuestros recursos limitados, es irreal operar una gran flota como las potencias. En lugar de perseguir sueños, desarrollemos una 'marina defensiva' pequeña pero eficiente, especializada en defensa costera y operaciones cercanas, centrada en frustrar intentos de desembarco. Minas, artillería costera y lanchas rápidas: una marina espinosa como erizo protegerá nuestras aguas. Entrar quizá sea fácil; salir no lo será."

 ABY_focus_navy_5: "Crear fuerzas de tarea"
 ABY_focus_navy_5_desc: "Crearemos fuerzas de tarea (Task Force) móviles, combinando destructores, cruceros, submarinos y buques de apoyo según la misión. Estas fuerzas flexibles maximizarán la eficiencia operativa y permitirán responder activamente a un entorno naval cambiante. Como una manada de lobos sobre el mar, detecten al objetivo, rodéenlo con organización… y muerdan sin soltar."

 ABY_focus_navy_6: "Señores del mar"
 ABY_focus_navy_6_desc: "La historia demuestra que quien domina el mar domina el mundo y se queda con la riqueza. Construyan una flota principal poderosa para asegurar por completo el control de los mares cercanos y controlar las rutas comerciales. Sin nuestro permiso, ni un carguero enemigo —ni siquiera un pez— cruzará estas aguas. Nuestro mar será un mar de paz… o la tumba del enemigo. La elección es suya."

 ABY_focus_navy_7: "Doctrina de una nueva era"
 ABY_focus_navy_7_desc: "Entre el romanticismo del gran cañón y la eficiencia del portaaviones, debemos encontrar la doctrina óptima para nosotros. Investiguen doctrinas que rompan moldes: tácticas de golpe y fuga con lanchas misilísticas, guerra asimétrica con submarinos, etc. Quien derriba a un dinosaurio enorme no siempre es un tiranosaurio: puede ser una manada de raptores ágiles e inteligentes. Con tácticas innovadoras, anulen las flotas gigantes del enemigo."

 ABY_focus_navy_8: "Expandir la flota litoral"
 ABY_focus_navy_8_desc: "Construyan numerosas lanchas torpederas y corbetas de patrulla, relativamente baratas y rápidas de producir, para tejer una red densa de defensa costera. Bloqueen de raíz infiltraciones de submarinos o fuerzas especiales enemigas, y protejan con seguridad nuestras rutas marítimas. El dueño del mar somero no es el acorazado, sino nuestras lanchas rápidas y ágiles. Usen costas complejas e islas para atraer al enemigo… y aniquilarlo."

 ABY_focus_navy_9: "Acorazados y grandes cañones"
 ABY_focus_navy_9_desc: "Cañones gigantes y un blindaje capaz de rebotar cualquier ataque: el romance eterno del marino y el símbolo del poder nacional. Impulsen un plan de construcción de superacorazados capaces de tomar la iniciativa naval y sembrar terror. El impacto de una andanada de gran calibre llegada desde más allá del horizonte infligirá un daño irreparable a la flota enemiga y volteará la balanza de la guerra. Un cañón grande y hermoso siempre tiene razón."

 ABY_focus_navy_10: "Expandir la aviación naval"
 ABY_focus_navy_10_desc: "También en el mar, quien domina el cielo vence. Amplíen masivamente la aviación naval, ya sea desde portaaviones o bases costeras. Torpedos de aviones torpederos y bombas de bombarderos en picado que atraviesen la defensa antiaérea serán la amenaza más letal incluso para los acorazados más grandes. No se aten a la distancia de los cañones: golpeen desde más lejos y más temprano, y hundan al enemigo."

 ABY_focus_navy_11: "Lobos del mar"
 ABY_focus_navy_11_desc: "Una flota submarina que recorre en silencio las profundidades es un terror invisible y una presión psicológica constante. Mediante guerra submarina irrestricta, paralicen el suministro marítimo enemigo y hundan por sorpresa sus buques capitales desprevenidos. En el abismo oscuro, preparamos el golpe más mortal. Cuando el enemigo navegue confiado… nuestro torpedo rasgará el vientre de su barco."

 ABY_focus_navy_12: "Guardia de defensa marítima"
 ABY_focus_navy_12_desc: "Elevaremos la marina a una Guardia de Defensa Marítima: una organización paramilitar dedicada a proteger aguas territoriales y soberanía marítima. Con un sistema de vigilancia y respuesta rápida, en tiempos de paz realizará operaciones antipiratería y rescate; en guerra, misiones de defensa nacional. Como centinelas de la paz del mar, no permitiremos ninguna intrusión ilegal."

 ABY_focus_navy_13: "El escudo que protege la patria"
 ABY_focus_navy_13_desc: "La marina es el escudo de acero que protege la patria sobre el mar. Preservar intactas nuestras ciudades costeras y el territorio ante bombardeos navales y desembarcos es la razón más noble de su existencia. En la línea donde rompen las olas, estaremos nosotros, bloqueando el ataque con el cuerpo entero. Si caemos, la patria será saqueada: con esa determinación, no permitan que ni un solo buque enemigo ponga pie en tierra."

### 산업 중점
 ABY_focus_industry_1: "Reactivar la zona industrial"
 ABY_focus_industry_1_desc: "Despierten de nuevo las máquinas detenidas del distrito industrial que, junto con las afueras de Abydos, fue trasladado milagrosamente. Aunque solo sea una parte del conjunto, la tecnología dormida y el potencial de producción allí son enormes. Restablezcan el suministro eléctrico e incorporen mano de obra ociosa para recuperar la capacidad industrial. El estruendo de las fábricas volviendo a girar con fuerza y el humo de las chimeneas son el latido del corazón de la reconstrucción nacional: la prueba de que nuestra Federación de Abydos se está levantando sobre las ruinas."

 ABY_focus_industry_2: "Apoyar a las grandes corporaciones"
 ABY_focus_industry_2_desc: "Para un crecimiento económico eficiente liderado por el Estado, concederemos audaces incentivos fiscales y subsidios a las grandes empresas que ya han demostrado capacidad y capital. Aprovechando su enorme músculo financiero y su tecnología avanzada, podremos ampliar en poco tiempo la base industrial, esperando que esos logros se derramen hacia las pymes y los hogares. Hay que criar gigantes para que carguen cargas mayores. Este es un tiempo de elegir y concentrar."

 ABY_focus_industry_3: "Mantener el equilibrio entre las tres grandes empresas"
 ABY_focus_industry_3_desc: "La over-technology de Nephthys, la abrumadora capacidad de producción de Škoda y el inmenso poder de capital de Rothschild. Estos tres gigantes son los tres pilares que sostienen nuestra economía. El gobierno debe ajustar con delicadeza para que el poder no se incline hacia un solo lado y rompa el equilibrio, y convertir su competencia sana en el motor del desarrollo nacional. Si esta cuerda floja —precaria pero precisa— tiene éxito, obtendremos una sinergia económica más poderosa que la de cualquier nación."

 ABY_focus_industry_4: "Fusionar pequeñas empresas"
 ABY_focus_industry_4_desc: "Consoliden y fusionen las pequeñas y frágiles pymes que proliferan sin orden para elevar la eficiencia de gestión y evitar inversiones duplicadas innecesarias. Promuevan economías de escala para asegurar competitividad en el mercado internacional y ganar margen para I+D e inversión en equipos. Como arroyos que se unen para formar un gran río, las empresas integradas y fortalecidas crearán mayor valor agregado y robustecerán la columna vertebral de la economía nacional."

 ABY_focus_industry_5: "Expandir el complejo industrial de Bohemia"
 ABY_focus_industry_5_desc: "Construyan en Bohemia —centro industrial tradicional y hogar de artesanos cualificados— un gran complejo industrial moderno. Aprovechen su sólida infraestructura y excelente mano de obra para convertir la región en la mayor base de producción de Europa. En lugar de los bosques de Bohemia, se alzarán chimeneas; el humo que se eleve desde allí simbolizará la prosperidad y el poder inagotables de nuestra federación."

 ABY_focus_industry_6: "Atraer las finanzas de Rothschild"
 ABY_focus_industry_6_desc: "La guerra y la reconstrucción de posguerra requieren fondos inimaginables. Atraigan activamente la red financiera global de la familia Rothschild, emperadores de las finanzas europeas, para reforzar unas arcas públicas insuficientes y elevar nuestra credibilidad externa. Hay que destapar la arterioesclerosis del dinero para que el gigante llamado economía pueda moverse. Pongan el poder del oro de nuestro lado para financiar la guerra y acelerar el crecimiento."

 ABY_focus_industry_7: "Aumentar el salario mínimo"
 ABY_focus_industry_7_desc: "Solo cuando la vida de los trabajadores se estabiliza y su poder adquisitivo aumenta, el mercado interno revive y la productividad mejora. Actualicen el salario mínimo a la realidad para garantizar una vida digna y sofocar el descontento social provocado por la desigualdad. Un trabajador bien alimentado y bien vivido produce mejor calidad y muestra mayor lealtad a la empresa. Esto no es simple bienestar: es una inversión para el crecimiento económico."

 ABY_focus_industry_8: "Escindir empresas"
 ABY_focus_industry_8_desc: "No se trata de debilitar a los grandes conglomerados partiéndolos a la fuerza. Al contrario: es una estrategia para maximizar eficiencia y especialización, creando filiales profesionales separadas por área de negocio y fomentando legalmente la expansión diversificada. Ramas numerosas y fuertes, extendidas desde una raíz gigantesca, elevarán cuota de mercado en cada sector y, al final, fortalecerán aún más a la matriz y a toda la economía nacional."

 ABY_focus_industry_9: "Desarrollar Austria"
 ABY_focus_industry_9_desc: "Ejecuten una inversión intensiva en Austria, región muy dañada por la guerra o relativamente marginada del desarrollo. Combinen la abundante hidroelectricidad y minerales de los Alpes con los excelentes recursos humanos de Viena para asegurar un nuevo motor de crecimiento nacional. Es hora de forjar de nuevo el milagro del Danubio. Austria dejará de ser periferia: será otro eje central de la federación."

 ABY_focus_industry_10: "Recuperar la industria de Škoda"
 ABY_focus_industry_10_desc: "En estos tiempos caóticos, activos, instalaciones y técnicos de Škoda Works fueron ocupados ilegalmente o dispersados por otras fuerzas. Recuperémoslos con firmeza mediante medidas de nacionalización. La capacidad de gran industria pesada y la tecnología de producción de artillería de Škoda son el núcleo y el orgullo de nuestra industria militar. Abracen otra vez nuestro 'corazón de acero' perdido y derramen armas para proteger la patria."

 ABY_focus_industry_11: "Prohibir el trabajo infantil"
 ABY_focus_industry_11_desc: "Incluso en tiempos de guerra existe una línea mínima que debemos respetar como seres humanos. Las manos pequeñas de los niños deben sostener lápices, no máquinas engrasadas. Prohíban estrictamente por ley el trabajo infantil y envíen a los niños a la escuela para formarlos como la fuerza que sostendrá el futuro de la nación. Será una inversión más valiosa que la productividad inmediata y demostrará nuestra victoria moral."

 ABY_focus_industry_12: "Cooperación de investigación empresarial"
 ABY_focus_industry_12_desc: "Integren la tecnología exclusiva y los laboratorios secretos de las empresas en grandes proyectos de investigación dirigidos por el Estado. Con cooperación industria-academia-investigación, reduzcan inversiones duplicadas y aceleren el desarrollo tecnológico para crear sistemas de armas y nuevas tecnologías que sorprendan al mundo. Compartir y fusionar el conocimiento crea un nuevo poder. Construyan una estructura donde el beneficio empresarial sea, al mismo tiempo, el beneficio nacional."

 ABY_focus_industry_13: "Ampliar los astilleros de Istria"
 ABY_focus_industry_13_desc: "Amplíen drásticamente y modernicen con equipos de última generación los viejos astilleros de Istria, nuestro único puente de salida al mar. Construyan diques de gran tamaño capaces de producir acorazados más grandes y más transportes, sentando una base sólida para el aumento del poder naval. El pequeño astillero del Adriático se convertirá en una cuna gigantesca que geste una marina oceánica. El sueño de dominar el mar empieza aquí."

 ABY_focus_industry_14: "Introducir tecnología avanzada de refinado"
 ABY_focus_industry_14_desc: "Adopten la química avanzada de Kivotos o las técnicas modernas de refinación de países desarrollados para maximizar la eficiencia de producción de combustible. La tecnología que convierte cada gota de crudo, sin desperdicio, en gasolina y combustible de aviación de alta calidad permitirá que nuestras fuerzas mecanizadas y nuestra aviación operen sin detenerse. La eficiencia energética es poder nacional y la llave de la victoria."

 ABY_focus_industry_15: "Producción de buques de transporte"
 ABY_focus_industry_15_desc: "Construyan una gran flota de transportes para importar suministros de guerra con estabilidad desde el extranjero o mover tropas con rapidez. Refuercen la capacidad logística marítima ampliando una marina mercante que mantenga la línea de vida sobre el mar atravesando la amenaza de los submarinos enemigos. Detrás de los acorazados llamativos, ellos cargan en silencio el peso: los verdaderos héroes ocultos que sostienen la guerra."

 ABY_focus_industry_16: "Activar la presentación de propuestas obreras"
 ABY_focus_industry_16_desc: "Los problemas y mejoras del terreno productivo los conoce mejor quien hace girar la máquina, no quien se sienta en un escritorio. Reactiven comités de consulta obrero-patronal e instauren sistemas de sugerencias para que los trabajadores aporten libremente ideas y mejoren la ineficiencia del proceso. Una pequeña idea de un trabajador despierto puede transformar de forma radical la productividad de toda la fábrica."

 ABY_focus_industry_17: "Economía de grupos corporativos"
 ABY_focus_industry_17_desc: "Agrupen vertical y horizontalmente filiales de sectores similares para formar grandes grupos empresariales (cárteles/conglomerados), creando sinergias. La concentración de capital, tecnología y talento hará posible ejecutar megaproyectos nacionales. Crezcan para adquirir competitividad internacional: en el ecosistema económico también aplica que unidos se vive y separados se muere."

 ABY_focus_industry_18: "Industrializar zonas montañosas"
 ABY_focus_industry_18_desc: "Construyan fábricas subterráneas e instalaciones de protección robustas en profundas zonas montañosas, seguras frente a bombardeos estratégicos o ataques nucleares. Un cinturón industrial que aproveche los Alpes y los Cárpatos, fortalezas naturales, garantizará que incluso en el peor escenario de guerra —con el territorio devastado— la producción de armas no se detenga. Aunque haya que cortar montañas y excavar túneles, debemos proteger nuestras fábricas."

 ABY_focus_industry_19: "Compartir tecnología de Nephthys"
 ABY_focus_industry_19_desc: "Incentiven y apoyen que la over-technology monopolizada por el Grupo Nephthys se comparta con el conjunto de la industria civil. Cuando la tecnología avanzada de Kivotos se injerta en la manufactura local, lograremos saltos de productividad y revoluciones de calidad que superen el sentido común. La tecnología del futuro cambiará la industria del presente y nos convertirá en una potencia tecnológica."

 ABY_focus_industry_20: "Trabajo en tres turnos"
 ABY_focus_industry_20_desc: "Las jornadas excesivas acumulan fatiga, reducen productividad y provocan accidentes industriales. Aboliremos el cruel sistema de dos turnos e introduciremos un sistema de tres turnos que garantice '8 horas de trabajo, 8 horas de descanso'. Un entorno laboral mejorado elevará la moral y, a largo plazo, permitirá mantener líneas de producción más estables, precisas y de alta calidad. Una fábrica que opera 24 horas no debe sostenerse en el sacrificio del obrero, sino en un sistema racional."

 ABY_focus_industry_21: "Monopolio empresarial"
 ABY_focus_industry_21_desc: "En sectores estratégicos que afectan directamente la seguridad nacional o requieren inversiones enormes, reconoceremos el estatus monopolístico de la empresa líder. Eviten el desperdicio de poder nacional por competencia interna excesiva y formen, mediante apoyo concentrado, una empresa campeona nacional capaz de competir en el mercado global. A veces, una sola empresa genial alimenta a diez mil ciudadanos. Por eficiencia, podemos apartar la equidad por un momento."

 ABY_focus_industry_22: "Cooperación de I+D entre las tres grandes"
 ABY_focus_industry_22_desc: "Hagan que Nephthys, Rothschild y Škoda derriben sus cercas y se tomen de la mano en proyectos conjuntos de investigación. La combinación de tecnología de Kivotos, información y capital del poder financiero judío, y el saber industrial checo producirá resultados innovadores más allá de toda imaginación. Esto no es simple cooperación empresarial: es un gran salto adelantado a su época, una revolución industrial."

 ### Enfoques de desarrollo de recursos
 ABY_focus_building_1: "Reconstruir la infraestructura"
 ABY_focus_building_1_desc: "Reparen con máxima prioridad y rapidez carreteras, ferrocarriles y puentes destruidos y cortados por el fuego de la guerra, para desbloquear el flujo logístico. Sin una red de transporte fluida, ni los recursos bajo tierra, ni los productos de fábrica, ni las tropas del frente podrán moverse a tiempo. Reconectar las arterias obstruidas del país y hacer que la sangre vuelva a circular es el primer paso de toda reconstrucción. Quien abre caminos, obtiene riqueza."

 ABY_focus_building_2: "Acero de Bohemia"
 ABY_focus_building_2_desc: "Desarrollen a gran escala los ricos yacimientos de hierro de Bohemia, con el objetivo de autoabastecer al 100% las materias primas de la siderurgia. Sin depender de importaciones, las piedras rojas extraídas de nuestras entrañas pasarán por el alto horno y se convertirán en nuestros tanques, buques y rascacielos. Tallen los huesos de la tierra para fortalecer el esqueleto del Estado. El hierro es poder nacional."

 ABY_focus_building_3: "Acerías Moravia–Vítkovice"
 ABY_focus_building_3_desc: "Amplíen la histórica acería de Vítkovice, famosa desde la época del Imperio austrohúngaro, e introduzcan equipos modernos de fabricación de acero. Eleve más alto el fuego del alto horno y opere 24 horas: con el metal fundido que brota construiremos un imperio de acero. Este lugar es el corazón de nuestra industria y el motor ardiente que forja las armas que llevarán la guerra a la victoria. Como un horno que no se detiene, nuestra pasión tampoco se enfriará."

 ABY_focus_building_4: "Desarrollar recursos raros"
 ABY_focus_building_4_desc: "Debemos encontrar recursos estratégicos raros indispensables para armas avanzadas y aeronaves: tungsteno, cromo, aluminio y más. Refuercen estudios geológicos de precisión en todo el territorio y abran nuevas minas para reducir dependencia de importaciones y establecer seguridad de recursos. Una piedra pequeña y brillante puede convertirse en la fuerza que atraviesa el blindaje de un tanque. Necesitamos la obsesión de encontrar incluso lo que no parece existir."

 ABY_focus_building_5: "Priorizar la producción de acero"
 ABY_focus_building_5_desc: "Concentren toda la capacidad industrial y los recursos del Estado en la producción de acero como máxima prioridad. Reduzcan bienes de consumo civiles y conviertan plantas, incluso automotrices, en instalaciones de apoyo siderúrgico: enfóquense solo en acero para defensa e industria pesada. Hoy no necesitamos mantequilla para una vida cómoda; necesitamos cañones para detener al enemigo. Solo el acero puede protegernos."

 ABY_focus_building_6: "Acería de Salzburgo"
 ABY_focus_building_6_desc: "Construyan una nueva gran acería en Salzburgo (Austria) para dispersar y ampliar la capacidad siderúrgica. Establezcan un proceso limpio y eficiente aprovechando la abundante energía hidroeléctrica alpina para reducir costos energéticos. Es transformar los regalos de la naturaleza —montañas y ríos— en acero sólido. Logren armonía entre naturaleza e industria."

 ABY_focus_building_7: "Acero de los Sudetes"
 ABY_focus_building_7_desc: "Rehabiliten minas clausuradas e instalaciones siderúrgicas en los Sudetes, donde se ubica la base de Abydos, y reactívenlas. Construyan un sistema estable de suministro para que el acero producido en el lugar más cercano llegue con mayor rapidez a fábricas y al frente. Hagan de nuestro patio trasero una fortaleza de acero autosuficiente. La lámpara alumbra peor debajo: no descuiden los recursos cercanos."

 ABY_focus_building_8: "Desarrollar el yacimiento petrolífero de Matzen"
 ABY_focus_building_8_desc: "Desarrollen de forma plena el yacimiento encontrado en Matzen (Austria) para asegurar un valioso recurso petrolero. Extraer con nuestras manos el “oro negro” que mueve fuerzas mecanizadas y aviación es crucial en términos estratégicos. Una gota de petróleo vale una gota de sangre. Extraigan la sangre de la tierra e inyéctenla en el corazón mecánico de nuestra nación como combustible para la victoria."

### 연구 중점
 ABY_focus_research_1: "Cooperación tecnológica local"
 ABY_focus_research_1_desc: "La over-technology de Kivotos no lo es todo. Respetemos y cooperemos con la ingeniería mecánica refinada de Chequia y Austria, acumulada durante siglos, y con el saber hacer de los ingenieros locales. Cuando el conocimiento de ambos mundos se une y compensa las carencias del otro, la sinergia tecnológica se multiplica. La fusión es el camino más directo hacia la verdadera innovación. Tomaremos lo mejor de ambos mundos."

 ABY_focus_research_2: "Uso militar de drones"
 ABY_focus_research_2_desc: "Desarrollaremos drones propios de reconocimiento y de ataque preciso a pequeña escala para desplegarlos en el campo de batalla. Los drones, capaces de explorar zonas peligrosas donde un soldado no puede entrar y de ejecutar ataques suicidas con una precisión que el ser humano no alcanza, son la fuerza clave de la guerra del futuro. Un colibrí pequeño e imperceptible se convertirá en el ojo y el aguijón venenoso que derriba a un gigante. El avance tecnológico cambia la forma de la guerra."

 ABY_focus_research_3: "Ingeniería inversa de helicópteros básicos"
 ABY_focus_research_3_desc: "Los helicópteros traídos de Kivotos son pocos; no podemos gastarlos como si fueran consumibles. Debemos desmontarlos y analizarlos con precisión para reconstruir un diseño básico que pueda producirse en masa con el nivel industrial local. Aunque no podamos reproducir por completo el rendimiento abrumador del original, innumerables aeronaves de rotor construidas por nuestras manos traerán un nuevo viento al campo de batalla. Empiecen por imitar y avancen hacia crear."

 ABY_focus_research_4: "Operación de drones para fuerzas especiales"
 ABY_focus_research_4_desc: "Dotaremos a los comandos de élite con pequeños drones portátiles para maximizar su capacidad operativa. Ver al enemigo tras un muro y detectar trampas tras una esquina elevará de forma drástica su supervivencia y la tasa de éxito de las misiones. El ojo que vigila al enemigo desde lo invisible nos conduce a la victoria. La superioridad de información es el núcleo de la táctica de unidades pequeñas."

 ABY_focus_research_5: "Adoptar helicópteros de Kivotos"
 ABY_focus_research_5_desc: "Aseguraremos planos y piezas clave de helicópteros originales de alto rendimiento fabricados en Kivotos, ya sea del Grupo Nephthys o de los restos del derrotado Kaiser. Estas aeronaves, con una movilidad y armamento que la tecnología local no puede imitar, serán la llave para dominar el cielo y devastar a las fuerzas terrestres enemigas. Aunque no entendamos la tecnología, si podemos usarla, es el mejor arma. Demuestren el verdadero poder de la over-technology."

 ABY_focus_research_6: "Mejorar el equipo de infantería"
 ABY_focus_research_6_desc: "Modernizaremos y aligeraremos el equipo individual que decide la vida o la muerte del soldado: armas personales, chalecos antibalas, equipos de comunicación y más. Un equipo más ligero, más resistente y más potente reducirá la fatiga y aumentará la eficiencia de combate. Una pequeña diferencia en el equipo separa la vida de la muerte y, en última instancia, decide la victoria o la derrota. Denle a nuestros soldados lo mejor."

 ABY_focus_research_7: "Formar unidades de helicópteros móviles"
 ABY_focus_research_7_desc: "Crearemos fuerzas de asalto aerotransportado basadas en numerosos helicópteros de transporte. Golpear la retaguardia enemiga y tomar puntos clave por sorpresa, superando montañas y ríos, es la flor de la guerra moderna: la 'caballería del aire'. Como valquirias que descienden del cielo con la música de Wagner para juzgar al enemigo, siembren el terror donde menos lo esperen."

 ABY_focus_research_8: "Ampliar la investigación de tecnología de Kivotos"
 ABY_focus_research_8_desc: "Investigaremos a fondo tecnologías avanzadas de Kivotos —energía mística, armas ópticas, escudos de energía— e intentaremos su aplicación militar. Descifren principios que la ciencia actual no puede comprender y conviértanlos en armas para obtener una superioridad tecnológica aplastante. Una tecnología que parece magia se volverá nuestra realidad y consumirá a nuestros enemigos. Quien toma el futuro primero, vence."

 ### Enfoques continuos (Guerra total)
 ABY_continuous_focus_political: "Guerra total: reforzar la centralización"
 ABY_continuous_focus_political_desc: "En tiempos de guerra, cuando la supervivencia del Estado está en juego, se requiere un liderazgo fuerte y coherente. Reduzcan temporalmente la autoridad de gobiernos locales y del parlamento, y concentren el poder en el gobierno central y el gabinete de guerra para establecer un sistema de decisiones rápido. La supervivencia eficiente está por encima de los procedimientos democráticos. Una sola cabeza y una sola orden son lo único que puede sofocar el caos y superar la crisis."

 ABY_continuous_focus_command: "Guerra total: producción de equipo militar"
 ABY_continuous_focus_command_desc: "Volcaremos toda la capacidad industrial disponible en la producción de material bélico. Detengan la producción de bienes de consumo y conviertan fábricas civiles en fábricas militares; prioricen la cantidad por encima del control de calidad para abastecer al frente con armas sin descanso. Urge más un fusil en las manos del soldado. La calidad importa, sí, pero ahora necesitamos volumen para aplastar al enemigo."

 ABY_continuous_focus_mobilization: "Guerra total: conscripción universal"
 ABY_continuous_focus_mobilization_desc: "Recluten a todos los que puedan empuñar un arma, sin distinción de sexo o edad, para ampliar la reserva. Ante la crisis nacional, no puede haber excepciones. No solo los soldados del frente: también los civiles de retaguardia son guerreros potenciales. Lucharemos hasta el último hombre por la patria. Todo el pueblo es el ejército, y todo el territorio es una fortaleza."

 ABY_continuous_focus_war: "Guerra total: guerra de liberación"
 ABY_continuous_focus_war_desc: "Nuestro objetivo no es una simple victoria, sino recuperar todo lo perdido a manos del enemigo. Expulsen por completo al invasor de nuestra tierra sagrada y no detengan el avance hasta que nuestros compatriotas oprimidos alcancen la verdadera liberación. No hay compromisos. Esta guerra es una cruzada por nuestra libertad y dignidad: solo hay victoria o muerte."

 ### Integración inicial y reforma política
 BA_EU_focus_1: "Comunidad Euro-Kivotos"
 BA_EU_focus_1_desc: "Sobre las cenizas del caos y la destrucción que dejó la Gran Transición, debemos buscar un nuevo camino para sobrevivir. Las viejas fronteras y los sistemas de gobierno colapsados ya no pueden contener esta catástrofe sin precedentes. Los líderes de Europa y los representantes de las academias de Kivotos se reúnen y declaran solemnemente la creación de la 'Comunidad Euro-Kivotos', que une el destino de ambos mundos. Esto va más allá de un simple tratado: es un experimento gigantesco, sin precedentes históricos, para construir una nueva civilización donde convivan la humanidad y el misterio; el único faro de esperanza para la supervivencia de todos."

 BA_EU_focus_2: "Comisión de esclarecimiento de la verdad"
 BA_EU_focus_2_desc: "Numerosas tragedias ocurridas durante el choque y la fusión de los dos mundos —desapariciones misteriosas y masacres— siguen enterradas en la oscuridad. Debemos poner en marcha una comisión independiente, capaz de investigar sin zonas prohibidas, para desenterrar toda la verdad. Si no calmamos a las almas de las víctimas injustas y no secamos las lágrimas de sus familias, nunca pondremos fin a la era de la desconfianza ni avanzaremos hacia un futuro de reconciliación. Solo el valor de mirar de frente las heridas del pasado trae verdadera sanación."

 BA_EU_focus_3: "Comisión de juicios a criminales de guerra"
 BA_EU_focus_3_desc: "Quienes aprovecharon el caos para devastar a civiles inocentes y cometieron crímenes contra la humanidad no pueden ser perdonados. Instalaremos una comisión especial de juicios a criminales de guerra para castigar no solo a remanentes nazis, sino a todo criminal que, en la confusión de la Gran Transición, perpetró masacres y saqueos. Sin importar rango o posición, cualquiera con pruebas en su contra será llevado ante la justicia; la hoja de la justicia será implacable. Esta es la primera declaración para cerrar la era de la barbarie y abrir la era del Estado de derecho."

 BA_EU_focus_4: "Juicios en ausencia"
 BA_EU_focus_4_desc: "La ausencia del acusado no puede convertirse en salvoconducto. Aunque criminales de guerra hayan huido cruzando fronteras o se hayan ocultado cambiando de identidad, no escaparán del juicio. Incluso mediante juicios en ausencia, haremos públicas sus culpas ante el mundo con las pruebas y testimonios disponibles y dictaremos sentencia histórica. Estén donde estén, vivirán perseguidos con la marca eterna de 'criminal de guerra'. La justicia no debe retrasarse ni detenerse."

 BA_EU_focus_5: "Cumbre europea"
 BA_EU_focus_5_desc: "Convocaremos una conferencia histórica donde se reúnan los jefes de Estado y los representantes de los principales distritos autónomos académicos para decidir el destino del continente. Habrá debates encendidos por intereses y posturas políticas enfrentadas, pero debemos avanzar hacia la gran causa de una 'Europa unida' mediante diálogo y compromiso. Este foro sellará un pasado de división y diseñará un futuro común; sus decisiones serán la piedra angular del nuevo orden."

 BA_EU_focus_6: "Cooperación política recíproca"
 BA_EU_focus_6_desc: "Reconociendo las diferencias entre los sistemas políticos de cada país y el singular autogobierno de las academias de Kivotos, construiremos un marco de cooperación estrecha bajo el objetivo común de supervivencia y prosperidad. Institucionalicen cumbres regulares de alto nivel y programas de intercambio técnico para aumentar el entendimiento mutuo y construir confianza, reduciendo fricciones y malentendidos innecesarios. La cooperación que florece sobre el respeto a la diferencia es la más sólida."

 BA_EU_focus_7: "Organizar reuniones informales"
 BA_EU_focus_7_desc: "Crearemos un canal de diálogo informal entre líderes para tratar asuntos sensibles y complejos difíciles de resolver por vías oficiales y protocolares. Encuentros sin rigidez y conversaciones francas pueden ser la llave para destrabar crisis y encontrar soluciones reales. Estos esfuerzos de comunicación bajo la mesa serán el lubricante que mueva con flexibilidad a una gran unión."

 BA_EU_focus_8: "Formar una alianza transnacional de partidos"
 BA_EU_focus_8_desc: "Fomentaremos que partidos de ideologías afines formen alianzas que crucen fronteras, para debatir políticas y compartir visión a escala paneuropea, por encima de los intereses estrechos de cada país. Esto sentará la base para fuerzas políticas transnacionales en el parlamento europeo capaces de liderar una agenda común. Una alianza unida por valores e ideas —no por nación— será un poderoso motor de integración política."

 BA_EU_focus_9: "Organizar el Parlamento Europeo"
 BA_EU_focus_9_desc: "Constituiremos el 'Parlamento Europeo' como el máximo órgano legislativo que represente la voluntad política de todos los ciudadanos y estudiantes de Europa. Diputados elegidos por procedimientos democráticos en cada país y distrito autónomo debatirán y aprobarán leyes de la unión. Este templo democrático será el arma más poderosa para asegurar la legitimidad de nuestra comunidad: decidir el futuro con votos y debate, no con fusiles. Ese es el valor supremo que debemos proteger."

 BA_EU_focus_10: "Organizar el Consejo Europeo"
 BA_EU_focus_10_desc: "Estableceremos el 'Consejo Europeo', compuesto por los jefes de gobierno de los Estados miembros, para definir la dirección política y las prioridades estratégicas de la unión. Como máximo órgano de decisión, coordinará intereses complejos y ejercerá liderazgo rápido y firme en crisis. Necesitamos, más que nunca, la sabiduría del Consejo para respetar la soberanía y aun así hablar con una sola voz."

 BA_EU_focus_11: "Asignación de escaños"
 BA_EU_focus_11_desc: "Asignar escaños en el Parlamento Europeo es una tarea delicada y crucial que determina la legitimidad democrática de la unión. No basta con la proporcionalidad poblacional: debemos proteger intereses de países pequeños y equilibrar la representación política entre locales y kivotosianos. Establezcan principios justos y racionales para una distribución que nadie sienta como exclusión, construyendo un sistema de democracia representativa que todos puedan aceptar."

 BA_EU_focus_12: "Conceder competencias supranacionales"
 BA_EU_focus_12_desc: "Para que la unión funcione como un órgano integrado con poder real y no como una mera confederación nominal, los Estados deben transferir parte de su soberanía a la unión. Delegar decisiones en áreas clave —diplomacia, defensa, moneda— será doloroso, pero inevitable para una prosperidad mayor y una seguridad firme. Cedan pequeñas porciones de soberanía nacional para forjar una gran soberanía europea."

 BA_EU_focus_13: "Derecho de candidatura paneuropeo"
 BA_EU_focus_13_desc: "Garantizaremos que cualquier ciudadano europeo pueda postularse a las elecciones del Parlamento Europeo sin importar su país de residencia. Este paso innovador derriba la barrera de la nacionalidad y hará nacer políticos verdaderamente paneuropeos que representen el interés común, no el beneficio de un solo Estado. Un clima político donde se juzgue por capacidad y visión acelerará la integración."

 BA_EU_focus_14: "Celebrar reuniones periódicas"
 BA_EU_focus_14_desc: "Regularizaremos las sesiones del Parlamento y del Consejo para construir un sistema político estable y predecible. Encuentros y debates regulares facilitan la comunicación, fortalecen la cohesión y garantizan la continuidad de políticas sin vaivenes. Gobernar por sistema elimina incertidumbre y asegura la sostenibilidad de la unión."

 BA_EU_focus_15: "Derecho de voto paneuropeo"
 BA_EU_focus_15_desc: "Otorgaremos a todos los ciudadanos europeos el derecho a votar en el lugar donde residan, sin importar su nacionalidad. Trabajadores y migrantes que se mueven libremente deben poder participar en decisiones que afectan su vida. Ampliar el sufragio hará que las raíces de la democracia crezcan más profundas y más anchas."

 BA_EU_focus_16: "Elecciones generales europeas"
 BA_EU_focus_16_desc: "Tras una larga preparación, celebraremos por fin las primeras elecciones generales simultáneas en toda Europa. Esta fiesta democrática, con cientos de millones acudiendo a votar, proclamará al mundo que ya no somos un conjunto de naciones divididas, sino 'ciudadanos de una Europa unida'. Saber que nuestros representantes, elegidos por nuestras manos, decidirán el futuro traerá orgullo y esperanza."

 ### Reforma económica y laboral
 BA_EU_focus_17: "Imitar el sistema monetario de Kivotos"
 BA_EU_focus_17_desc: "Tomaremos como referencia el sistema financiero avanzado y la gestión monetaria sofisticada de Kivotos para reformar de raíz la economía europea devastada por la posguerra. La adopción de pagos digitales, trazabilidad transparente del flujo de fondos y técnicas eficientes de política monetaria inyectará nueva vida en las viejas y obstruidas venas financieras de Europa. La unión de tecnología y finanzas llevará nuestra economía a un nuevo nivel."

 BA_EU_focus_18: "Introducir la legislación laboral de Kivotos"
 BA_EU_focus_18_desc: "Inspirándonos en la ética laboral avanzada de Kivotos, que prioriza derechos y autonomía, reformaremos a gran escala el entorno laboral arcaico de Europa. Tratar al trabajador como una persona digna de respeto, fortalecer derechos humanos y bienestar, es condición necesaria para elevar productividad y lograr un gran pacto social. Los productos de un trabajador feliz tienen la mejor competitividad."

 BA_EU_focus_19: "Banco Central"
 BA_EU_focus_19_desc: "Fundaremos un 'Banco Central Europeo (BCE)' independiente para dirigir la política monetaria de toda la unión y supervisar los mercados financieros. Mantener estabilidad de precios, reducir brechas económicas y proteger el valor del euro en crisis: este cuartel general financiero será el último bastión de la estabilidad europea. La integración de soberanía monetaria significa la culminación de la integración económica."

 BA_EU_focus_20: "Propuesta del Euro-EN"
 BA_EU_focus_20_desc: "Impulsaremos una nueva moneda única de reserva, el 'Euro-EN', que combine la enorme escala económica europea con la aplastante tecnología de Kivotos. Esta divisa fuerte y confiable desafiará la hegemonía del dólar y redirigirá los flujos de capital global hacia Europa. La moneda no es solo intercambio: es símbolo de poder nacional. El Euro-EN será la bengala que anuncie nuestro renacer."

 BA_EU_focus_21: "Comunidad Europea del Acero y el Carbón"
 BA_EU_focus_21_desc: "Gestionando en común acero y carbón —materiales estratégicos esenciales— mediante un organismo supranacional, bloquearemos de raíz la posibilidad de guerras internas y sentaremos la base del desarrollo industrial. Los recursos que antes empujaban a apuntarnos con armas serán ahora activos compartidos para paz y prosperidad. Esto no es solo cooperación económica: es el seguro más sólido para una paz permanente."

 BA_EU_focus_22: "Eliminar barreras arancelarias"
 BA_EU_focus_22_desc: "Aboliremos con decisión todos los aranceles y barreras no arancelarias que frenaban el comercio interno y reducían eficiencia, creando un gran mercado único. El libre movimiento de bienes elevará competitividad empresarial y ofrecerá a consumidores productos más baratos y variados. La integración del mercado es la vía más segura para agrandar el pastel europeo."

 BA_EU_focus_23: "Aplicar una reforma monetaria"
 BA_EU_focus_23_desc: "Ordenaremos y eliminaremos las monedas antiguas, complejas e ineficientes, deterioradas por la inflación, e impondrémos una transición forzosa a una nueva moneda única. Habrá confusión y resistencia inicial, pero un sistema monetario unificado reducirá costos de transacción, impulsará inversión y actuará como un adhesivo poderoso que unirá la economía europea. Sin dolor que parta el hueso, no crece piel nueva."

 BA_EU_focus_24: "Producción conjunta, consumo conjunto"
 BA_EU_focus_24_desc: "Para evitar inversiones duplicadas y lograr economías de escala, construiremos una división del trabajo por industrias. Cada país se enfocará en lo que mejor hace para producir lo óptimo y compartir resultados en el mercado único, incrementando la riqueza de toda Europa. Con cooperación en lugar de competencia, y compartición en lugar de monopolio, forjaremos un futuro más próspero."

 BA_EU_focus_25: "Abrir fronteras"
 BA_EU_focus_25_desc: "Heredando y ampliando el espíritu de Schengen, retiraremos todos los puestos de control y barreras fronterizas entre miembros. Viajar, trabajar y estudiar libremente sin pasaporte ni visado será uno de los beneficios más grandes y tangibles. Donde desaparece la frontera física, las personas y las ideas fluyen y crean innovación."

 BA_EU_focus_26: "Finanzas europeas"
 BA_EU_focus_26_desc: "Construiremos una gran red financiera única que conecte Londres, Fráncfort, París y los centros financieros de los distritos autónomos, para que el capital fluya sin obstáculos. Un mercado financiero europeo integrado ofrecerá más oportunidades de inversión, dará plataforma a startups y actuará como un motor potente de crecimiento. Donde circula el dinero, nace la oportunidad."

 BA_EU_focus_27: "Comunidad de desarrollo de recursos"
 BA_EU_focus_27_desc: "Para asegurar independencia energética y reducir dependencia externa, impulsaremos de forma conjunta el desarrollo de todos los recursos naturales del continente. Desde el petróleo del Mar del Norte hasta minas de tierras raras del Este, todo recurso en tierra y mar se gestionará sistemáticamente como activo común de la unión, no propiedad exclusiva de un Estado. Eviten la 'weaponización' de recursos y construyan una cadena de suministro estable."

 BA_EU_focus_28: "Economía europea unificada"
 BA_EU_focus_28_desc: "Alcanzaremos por fin una unión económica completa, con política fiscal, monetaria, comercial e industrial integradas. Con un gran mercado interno, fuerte poder de compra y tecnología avanzada, Europa dejará atrás su pasado marginal y volverá a erigirse como eje de la economía mundial. Nuestro poder económico ejercerá influencia más fuerte que cualquier fuerza militar."

 BA_EU_focus_29: "Tribunal de Cuentas"
 BA_EU_focus_29_desc: "Instalaremos un organismo de auditoría fuerte e independiente para vigilar que el enorme presupuesto de la unión se ejecute con transparencia y eficiencia. Que ni un solo euro de impuestos sea desperdiciado o desviado; si se detecta malversación, se exigirá responsabilidad con severidad. Solo unas finanzas limpias ganan la confianza ciudadana y sostienen la legitimidad de la unión."

 BA_EU_focus_30: "Distribución de presupuesto común"
 BA_EU_focus_30_desc: "Introduciremos un potente mecanismo de ajuste fiscal: fondos aportados por países ricos apoyarán a regiones rezagadas para corregir desequilibrios. No es caridad, sino inversión en desarrollo equilibrado y cohesión continental. Una distribución justa basada en solidaridad es el pilar moral más importante que sostiene la unión."

 BA_EU_focus_31: "Revisión presupuestaria"
 BA_EU_focus_31_desc: "Para impedir crisis de deuda por populismo fiscal o gestión laxa, la unión revisará anticipadamente presupuestos nacionales y podrá emitir recomendaciones de corrección. La disciplina fiscal es un principio no negociable para la estabilidad común: debemos evitar que el fracaso de un país se propague como dominó."

 BA_EU_focus_32: "Compartir recursos"
 BA_EU_focus_32_desc: "Crearemos un sistema de respuesta de emergencia que priorice el intercambio de alimentos, energía y medicinas entre miembros en crisis: guerra, desastres, epidemias. Somos una comunidad de destino que comparte no solo alegrías, también dolor y peligros. En la adversidad, nuestra solidaridad brillará más."

 BA_EU_focus_33: "Introducir economía planificada"
 BA_EU_focus_33_desc: "Para una recuperación rápida y una industrialización acelerada, mantendremos la economía de mercado como base, pero incorporaremos temporalmente elementos de planificación a escala paneuropea. Se requiere intervención estatal activa y estratégica para corregir fallos de mercado, impulsar industrias clave y asignar recursos eficientemente. Hay momentos en que la mano visible es más necesaria que la invisible."

 BA_EU_focus_34: "Conceder poder de auditoría supranacional"
 BA_EU_focus_34_desc: "Otorgaremos a los órganos de auditoría de la unión la autoridad de inspeccionar directamente instituciones públicas nacionales y empresas que reciban apoyo de la unión. Auditorías exhaustivas sin fronteras ni santuarios romperán cadenas de corrupción y elevarán la transparencia administrativa. Donde hay corrupción, no florece la integración."

 BA_EU_focus_35: "Expandir polígonos industriales"
 BA_EU_focus_35_desc: "Crearemos grandes complejos industriales multinacionales en fronteras y regiones rezagadas para construir un modelo exitoso de cooperación económica. Fábricas donde trabajadores y técnicos de distintas nacionalidades sudan juntos simbolizarán no solo beneficio económico, sino reconciliación e integración. Quien trabaja junto, no se apunta con un fusil."

 BA_EU_focus_36: "Plan de desarrollo conjunto"
 BA_EU_focus_36_desc: "Elaboraremos un plan conjunto a largo plazo para desarrollar regiones relativamente atrasadas del Este y del Sur, y elevar el nivel de infraestructura en toda Europa. El objetivo final: que cualquier ciudadano, viva donde viva, goce de oportunidades similares y alta calidad de vida. La prosperidad no debe ser monopolio de unos pocos países."

 BA_EU_focus_37: "Enviar inspectores"
 BA_EU_focus_37_desc: "Asignaremos inspectores permanentes de la unión a proyectos clave financiados por el presupuesto común y a organismos administrativos nacionales. No bastan reportes en papel: escucharán la voz del terreno y detectarán de inmediato ineficiencias o corrupción para corregirlas. Cuando hay un vigilante frente a tus ojos, la administración se vuelve más honesta."

 BA_EU_focus_38: "Espacio económico europeo"
 BA_EU_focus_38_desc: "Formaremos un gran bloque económico ampliado que abarque, además de miembros, países vecinos del Mediterráneo, Norte de África y Oriente Medio. Mediante acuerdos de libre comercio y alianzas tecnológicas, expandiremos el territorio económico europeo y ampliaremos influencia geopolítica. Nuestro mercado no está encerrado en el continente: está abierto al mundo."

 BA_EU_focus_39: "Autoridad Laboral"
 BA_EU_focus_39_desc: "Crearemos una 'Autoridad Laboral Europea' para coordinar políticas de empleo y administrar un mercado laboral integrado. Proteger derechos de trabajadores transfronterizos, resolver desempleo y crear empleos de calidad para la industria del futuro son tareas prioritarias. El trabajo no es mercancía: el trabajador es protagonista de la economía."

 BA_EU_focus_40: "Mecanización industrial"
 BA_EU_focus_40_desc: "Introduciremos activamente automatización y robótica avanzadas de Kivotos en la industria para elevar la productividad de las fábricas de manera drástica. El trabajo repetitivo, peligroso y duro pasará a las máquinas; el ser humano se enfocará en tareas más creativas y valiosas. La productividad por innovación tecnológica es la base material para reducir horas y mejorar calidad de vida."

 BA_EU_focus_41: "Jornada de 8 horas"
 BA_EU_focus_41_desc: "Para garantizar salud y vida digna, estableceremos por ley y aplicaremos con rigor el principio histórico de '8 horas de trabajo, 8 de descanso y 8 de sueño'. La muerte por sobrecarga laboral, fruto de tratar al humano como consumible por lucro, debe desaparecer como un vestigio de barbarie. Una vida con descanso crea mayor eficiencia."

 BA_EU_focus_42: "Oficina de empleo y trabajo"
 BA_EU_focus_42_desc: "Reformaremos y ampliaremos la oficina de empleo y trabajo para apoyar formación, reinserción y un reclutamiento justo sin discriminación. Forjaremos una sociedad donde quien quiera trabajar encuentre un puesto acorde a su capacidad, y donde incluso tras caer exista oportunidad real de levantarse."

 BA_EU_focus_43: "Normas de seguridad industrial"
 BA_EU_focus_43_desc: "Mejoraremos de forma radical el entorno de trabajo peligroso y dictaremos normas estrictas de seguridad industrial con sanciones severas para reducir accidentes a cero. La vida y seguridad del trabajador son un valor absoluto por encima de cualquier ganancia empresarial o resultado económico. En un lugar inseguro, no debe realizarse trabajo alguno."

 BA_EU_focus_44: "Semana laboral de 5 días"
 BA_EU_focus_44_desc: "Implantaremos la semana laboral de cinco días en todos los sectores para garantizar tiempo de ocio y familia. El equilibrio vida-trabajo no solo eleva productividad: también impulsa industrias de ocio y el consumo interno, creando un círculo virtuoso. El descanso también mueve la economía."

 BA_EU_focus_45: "Apoyar negociaciones laborales"
 BA_EU_focus_45_desc: "Operaremos un organismo profesional de mediación para resolver conflictos laborales mediante diálogo productivo y cultura de convivencia. En lugar de recurrir a huelgas y cierres patronales, buscaremos acuerdos racionales por conversación y concesión mutua. La estabilidad de las relaciones laborales es indispensable para un desarrollo económico sostenible."

 BA_EU_focus_46: "Subsidio por lesiones"
 BA_EU_focus_46_desc: "Fortaleceremos de manera sustancial la protección social que cubre tratamiento y sustento para trabajadores lesionados o enfermos por causa laboral. Estado y empresas deben ser un pilar fiable para los trabajadores industriales, sosteniéndolos hasta que recuperen la salud y vuelvan al trabajo. Quien mueve la industria no puede ser abandonado."

 BA_EU_focus_47: "Legalizar sindicatos"
 BA_EU_focus_47_desc: "Garantizaremos como derecho constitucional la libertad de asociación, negociación colectiva y acción colectiva de todos los trabajadores. Sindicatos sanos y democráticos son socios clave: limitan abusos empresariales, defienden derechos laborales y ayudan a realizar justicia social. Una sociedad sin trabajadores oprimidos es la única verdaderamente libre."

 BA_EU_focus_48: "Legislación laboral avanzada"
 BA_EU_focus_48_desc: "Promulgaremos la 'Carta Laboral Europea', el estándar más alto del mundo en protección del trabajador, combinando lo mejor de Europa y Kivotos. Europa será no solo un lugar propicio para negocios, sino el continente donde el trabajador es más respetado y más feliz. Nuestros estándares laborales serán el nuevo referente global."

 ### Integración social y cultural
 BA_EU_focus_49: "Conferencia de jurisdicción de distritos federales"
 BA_EU_focus_49_desc: "Convocaremos reuniones periódicas para administrar con eficiencia los distritos federales directos y las autonomías dispersas por Europa, y para mediar conflictos entre centro y periferia, y entre regiones. Este foro no será una imposición unilateral del gobierno central, sino un espacio de comunicación y consenso continuo con los gobiernos locales para eliminar puntos ciegos administrativos y materializar democracia de base."

 BA_EU_focus_50: "Restauración del patrimonio cultural"
 BA_EU_focus_50_desc: "Impulsaremos a gran escala la restauración de patrimonio cultural destruido por la guerra y el retorno a su lugar de origen de piezas saqueadas y dispersas. Estos bienes no son simples objetos antiguos: son raíces que sostienen la identidad y el orgullo europeos. Reconstruir piedra sobre piedra es reconstruir nuestra dignidad."
 BA_EU_focus_51: "Reconocer la especificidad cultural"
 BA_EU_focus_51_desc: "En lugar de una integración coercitiva y uniforme, respetaremos y fomentaremos las tradiciones culturales y las lenguas propias de cada pueblo, región y distrito autónomo académico. La diversidad no es una semilla de división, sino el alimento que enriquece y vuelve más colorida la cultura europea. Cuando reconocemos y disfrutamos nuestras diferencias, podemos realizar el auténtico espíritu europeo de la 'unidad en la diversidad'."

 BA_EU_focus_52: "Ajuste de fronteras"
 BA_EU_focus_52_desc: "Reajustaremos pacíficamente las fronteras irracionales trazadas como legado del imperialismo o como resultado de guerras, considerando el contexto histórico y la distribución étnica actual. Debemos poner fin a las tragedias creadas por líneas dibujadas a la fuerza en un mapa, y sentar las bases de una paz duradera fijando límites razonables y naturales de acuerdo con la voluntad democrática de los habitantes de la región."

 BA_EU_focus_53: "Confiscación de municiones"
 BA_EU_focus_53_desc: "Tras la Gran Transición, una cantidad enorme de municiones sin control, dispersas entre civiles, es una bomba de tiempo. Para prevenir choques armados accidentales y delitos, debemos aplicar medidas firmes: confiscar por la fuerza el exceso de munición en manos privadas y destruirlo. Un arma sin balas no es más que un garrote. Borremos el olor a pólvora impregnado en la sociedad y llenemos el aire de paz."

 BA_EU_focus_54: "Conectar redes clandestinas"
 BA_EU_focus_54_desc: "Sacaremos a la luz a las redes de resistencia y grupos de autodefensa que operaban ocultos en lo profundo durante la ocupación, integrándolos como organizaciones civiles legales o como fuerzas de reserva. El patriotismo inquebrantable y la sólida cohesión que demostraron en tiempos oscuros son una energía valiosa para la reconstrucción nacional. A quienes lucharon en la sombra, ahora debemos darles condecoraciones y un papel social."

 BA_EU_focus_55: "Fortalecer la autoridad pública"
 BA_EU_focus_55_desc: "Para restaurar el orden legal colapsado por la guerra y el caos, ampliaremos drásticamente el personal policial e introduciremos equipos avanzados y técnicas forenses científicas para modernizar el sistema de seguridad. Un Estado que no puede proteger a sus ciudadanos del crimen y la violencia carece de razón de ser. Recuperar la autoridad debilitada de la fuerza pública mediante la aplicación justa de la ley es el primer paso para devolver una vida cotidiana segura."

 BA_EU_focus_56: "Subsidio de reasentamiento"
 BA_EU_focus_56_desc: "Otorgaremos un subsidio integral de asentamiento —incluyendo vivienda, manutención y costos de capacitación laboral— para que refugiados y desplazados, que perdieron su hogar por la guerra, puedan echar raíces de esperanza en tierras desconocidas. Ayudarlos a erguirse como miembros plenos de la sociedad, y no como extranjeros marginados, es un deber humanitario del Estado y la inversión más segura para la integración social."

 BA_EU_focus_57: "Garantizar derechos de paso por tramos"
 BA_EU_focus_57_desc: "Incluso en zonas donde persisten disputas o áreas controladas por necesidad militar, emitiremos permisos especiales de paso que garanticen un tránsito civil seguro y libre. La vida cotidiana —reencontrar a la familia dispersa y sostener el sustento— es un derecho humano que debe protegerse al máximo aun en emergencia. Aunque los caminos estén controlados, el flujo de personas no debe romperse."

 BA_EU_focus_58: "Celebrar elecciones libres dentro de las academias"
 BA_EU_focus_58_desc: "Promoveremos y supervisaremos que, incluso en los distritos autónomos académicos de Kivotos dominados por unos pocos fuertes, se elijan dirigentes estudiantiles mediante procedimientos transparentes y democráticos. Los principios de la democracia, y no la ley del más fuerte, deben aplicarse sin excepción. La experiencia de autogobierno a través de representantes elegidos por los propios estudiantes los formará como futuros ciudadanos democráticos."

 BA_EU_focus_59: "Libre circulación"
 BA_EU_focus_59_desc: "Eliminaremos por completo toda clase de restricciones y barreras que obstaculizaban el movimiento de personas y bienes dentro del continente europeo. La libertad de viajar es un derecho fundamental, y que personas de distintas regiones se desplacen libremente, intercambien cultura y se comprendan mutuamente es el camino más rápido hacia la integración real. Con caminos abiertos, Europa será una."

 BA_EU_focus_60: "Distritos autónomos supranacionales"
 BA_EU_focus_60_desc: "Designaremos y operaremos distritos autónomos especiales que no pertenezcan a la soberanía de un Estado específico, sino que estén bajo administración directa de la Unión Europea. Serán laboratorios de administración supranacional donde convivan múltiples etnias y culturas, y donde la mística de Kivotos se fusione con la tradición europea. Como una casa modelo que adelanta el futuro de Europa, estos distritos serán símbolo de innovación y coexistencia."

 BA_EU_focus_61: "Establecer un distrito federal"
 BA_EU_focus_61_desc: "Crearemos un gran distrito administrativo federal que concentre los poderes legislativo, ejecutivo y judicial de la Unión Europea, funcionando como capital. Bruselas, Estrasburgo o una tercera ciudad renacerá como el nuevo corazón de Europa, actuando como red nerviosa central que insufla vitalidad a todo el continente. No será solo una ciudad: será el lugar donde el sueño europeo se hace realidad."

 BA_EU_focus_62: "Comisión de disciplina cultural"
 BA_EU_focus_62_desc: "Fundaremos una comisión independiente para vigilar y regular choques culturales, discursos de odio y actos discriminatorios que puedan surgir durante la rápida integración. Respetaremos la libertad de expresión, pero no toleraremos acciones que pisoteen la dignidad ajena. Es un órgano de consenso social para asentar una cultura de tolerancia y respeto. Debemos construir un lenguaje de convivencia más allá del odio."

 BA_EU_focus_63: "Añadir cláusulas de legítima defensa"
 BA_EU_focus_63_desc: "En situaciones urgentes donde la autoridad pública no pueda llegar a tiempo, elaboraremos una ley que amplíe significativamente el alcance reconocido de la legítima defensa, para que los ciudadanos puedan protegerse a sí mismos, a su familia y a sus vecinos de crímenes o amenazas a la vida. El Estado tiene el deber de proteger la seguridad, pero también debe respetar y garantizar el derecho natural de cada ciudadano a defenderse."

 BA_EU_focus_64: "Formar gabinetes autónomos"
 BA_EU_focus_64_desc: "Para una administración adaptada a las particularidades de cada distrito federal y autónomo, permitiremos que las poblaciones locales conformen gabinetes propios elegidos por ellas mismas. La descentralización —que quienes mejor conocen la realidad local resuelvan sus problemas— en lugar de un control uniforme del gobierno central, será el abono que fortalezca las raíces de la democracia."

 ### Seguridad pública e integración militar
 BA_EU_focus_65: "Registro obligatorio de armas"
 BA_EU_focus_65_desc: "Haremos obligatorio el registro de todas las armas de fuego de propiedad civil para eliminar puntos ciegos en el control de armas y reforzar la responsabilidad del propietario. Saber con precisión quién tiene qué arma y dónde la posee es la base más elemental del orden público. Las 'armas fantasma' no registradas solo sirven al crimen. Solo una gestión transparente puede prevenir accidentes y delitos con armas."

 BA_EU_focus_66: "Reorganizar zonas"
 BA_EU_focus_66_desc: "Sin atarnos a divisiones administrativas antiguas, analizaremos científicamente la demanda real de seguridad, los cambios demográficos y la distribución de zonas de riesgo para reajustar racionalmente las jurisdicciones policiales. Una asignación eficiente de personal acelerará la respuesta al crimen y elevará la calidad del servicio, aumentando la satisfacción ciudadana. Si el crimen no conoce fronteras, la respuesta policial tampoco debe tener huecos."

 BA_EU_focus_67: "Prohibir armas automáticas"
 BA_EU_focus_67_desc: "Prohibiremos por completo la posesión civil de armas militares automáticas —fusiles automáticos, subfusiles, ametralladoras— y las confiscaremos de inmediato. Ya no podemos permitir que armas hechas para el campo de batalla circulen por calles en paz. Un armamento excesivo que amenaza la seguridad no es libertad: es libertinaje y fuente de terror."

 BA_EU_focus_68: "Simplificar procedimientos de control"
 BA_EU_focus_68_desc: "Reduciremos controles excesivos que intimidan y retrasan a los ciudadanos, e incorporaremos reconocimiento facial y equipos de escaneo para aumentar a la vez rapidez y precisión de los filtros de seguridad. Debemos construir un sistema inteligente que minimice molestias cotidianas y, aun así, bloquee eficazmente el movimiento de terroristas y criminales. Libertad y seguridad pueden coexistir."

 BA_EU_focus_69: "Mejorar munición no letal"
 BA_EU_focus_69_desc: "Para reducir víctimas innecesarias durante control de disturbios o detención de sospechosos, desarrollaremos y distribuiremos equipos de sujeción no letal de alto rendimiento: balas de goma, táseres, cañones acústicos y más. La fuerza pública existe para proteger a la ciudadanía, no para herirla o matarla. Neutralizar al criminal respetando la vida es el estándar de una seguridad avanzada."

 BA_EU_focus_70: "Operar armerías estatales"
 BA_EU_focus_70_desc: "Aboliremos armerías privadas que venden armas sin control por lucro, y permitiremos compras limitadas solo a través de armerías estatales, bajo evaluación estricta. Al controlar de forma transparente todo el proceso de distribución, bloquearemos de raíz que armas terminen en manos de criminales o personas con trastornos mentales. Es una medida contundente."

 BA_EU_focus_71: "Compensar a la industria armamentística"
 BA_EU_focus_71_desc: "Compensaremos a las empresas militares que sufran impacto económico por políticas estrictas de control de armas, apoyando la reconversión industrial o priorizando contratos de suministro militar. Reduciremos la resistencia del sector y redirigiremos su capacidad tecnológica e infraestructura hacia un propósito público: fortalecer la defensa. Un incentivo estratégico."

 BA_EU_focus_72: "Armas inteligentes"
 BA_EU_focus_72_desc: "Haremos obligatoria la tecnología de armas inteligentes en todas las armas nuevas: solo podrán disparar usuarios autorizados mediante biometría registrada (huella, venas, etc.). Con ello evitaremos que armas robadas o extraviadas sean usadas por el crimen, y preveniremos disparos accidentales por curiosidad infantil. Será un gran ejemplo de cómo la tecnología protege la seguridad."

 BA_EU_focus_73: "Zonas de portación restringida"
 BA_EU_focus_73_desc: "Designaremos escuelas, hospitales, oficinas públicas, templos y otros espacios concurridos como 'Gun-Free Zone', prohibiendo estrictamente el ingreso de armas bajo cualquier motivo. Aumentar estas zonas seguras para que la gente viva sin miedo a tiroteos es un requisito básico de una sociedad civilizada."

 BA_EU_focus_74: "Plan de regulación de armas a 50 años"
 BA_EU_focus_74_desc: "Es imposible eliminar en poco tiempo armas que se han difundido durante décadas. Estableceremos un plan a largo plazo, gradual y por etapas, de medio siglo, para reducir la posesión civil y transformar la cultura armada, con el objetivo final de una 'sociedad pacífica sin armas'. Lo inicia nuestra generación y lo completará la siguiente: cambiará el futuro de Europa."

 BA_EU_focus_75: "Fuerzas Armadas de la Unión Europea"
 BA_EU_focus_75_desc: "Integraremos los ejércitos nacionales para crear las 'Fuerzas Armadas de la Unión Europea (EAF)' con un mando unificado. Es un sistema de defensa independiente que reemplaza a la OTAN y rompe la dependencia de Estados Unidos, protegiendo la soberanía y el territorio europeos frente a amenazas externas. Bajo una sola bandera, el ejército europeo será un escudo firme para la paz mundial."

 BA_EU_focus_76: "Guardia Fronteriza Europea"
 BA_EU_focus_76_desc: "Para enfrentar refugiados, contrabando y terrorismo internacional, organizaremos una 'Guardia Fronteriza Europea' profesional que defienda conjuntamente las fronteras exteriores de la UE. Una vigilancia férrea por tierra y mar protegerá las puertas de Europa y será la condición previa para garantizar la libre circulación interna. Una valla sólida hace una casa segura."

 BA_EU_focus_77: "Guardia Costera Europea"
 BA_EU_focus_77_desc: "Operaremos una 'Guardia Costera Europea' integrada para vigilar las amplias aguas territoriales y la zona económica exclusiva, realizar rescates marítimos y reprimir la pesca ilegal. El mar es recurso y vía de vida. Quienes luchan con las olas para imponer la ley del mar mantendrán nuestras aguas en paz y abundancia."

 BA_EU_focus_78: "Defensa Aérea Europea"
 BA_EU_focus_78_desc: "Construiremos una red de radares tipo telaraña y un sistema de misiles antiaéreos que cubra toda Europa, y estableceremos un mando integrado de defensa aérea. Ni un avión ni un misil enemigo podrán violar nuestro espacio aéreo. Ojos y puños que vigilan el cielo 24 horas regalarán noches de sueño tranquilo a la ciudadanía."

 BA_EU_focus_79: "Integrar legiones Halo"
 BA_EU_focus_79_desc: "Unificaremos las fuerzas portadoras de Halo, antes dispersas y operadas por separado, bajo un 'Mando de Operaciones Especiales' dentro de la EAF. Su poder de combate sobrehumano, fruto de capacidades místicas, ejecutará misiones que las fuerzas convencionales no pueden resolver: serán la lanza más fuerte y el as bajo la manga que protege a Europa. Separados son un riesgo; unidos, invencibles."

 BA_EU_focus_80: "Ley de registro de PMC"
 BA_EU_focus_80_desc: "Incorporaremos al marco legal a las empresas militares privadas (PMC) que actuaban sin control en el caos de la guerra. Con requisitos estrictos de registro y supervisión transparente, dejaremos de tratarlas como meros mercenarios tras el dinero y las convertiremos en socios confiables que complementen la seguridad nacional. El poder debe ir acompañado de responsabilidad."

 BA_EU_focus_81: "Mando unificado de Halo"
 BA_EU_focus_81_desc: "Crearemos un mando dedicado que comprenda en profundidad las particularidades de tropas de Kivotos y tropas locales, y las combine orgánicamente para una operación eficiente. Esta nueva fuerza híbrida, donde se armonizan poder místico y tácticas modernas, mostrará una capacidad sin precedentes que supera el sentido común militar. Es la evolución de la guerra."

 BA_EU_focus_82: "Ley de movilización de emergencia de PMC"
 BA_EU_focus_82_desc: "Estableceremos base legal para que, en estado de emergencia o invasión masiva, el Estado pueda requisar de inmediato recursos y personal de PMC registradas y desplegarlos junto a fuerzas regulares. Cuando la supervivencia está en juego, debemos movilizar todo poder disponible para detener al enemigo. La supervivencia va antes que el contrato."

 BA_EU_focus_83: "Mando del Ejército Europeo"
 BA_EU_focus_83_desc: "Instalaremos el 'Alto Mando del Ejército Europeo' para dirigir todas las operaciones terrestres del continente. Nombraremos comandantes por capacidad y experiencia, sin importar nacionalidad, construyendo un ejército verdaderamente aliado que luche por la victoria de toda la unión, no por intereses de origen. Hablamos lenguas distintas, pero la orden es una."

 BA_EU_focus_84: "Mando Naval Europeo"
 BA_EU_focus_84_desc: "Crearemos el 'Mando Naval Europeo' para proteger todos los mares europeos: Mediterráneo, Atlántico, Mar del Norte y Báltico. Integrando flotas nacionales ampliaremos alcance y control marítimo, haciendo realidad la lección histórica de que quien domina el mar mueve el mundo. Nuestra flota será una fuerza de paz oceánica."

 BA_EU_focus_85: "Control de la Fuerza Aérea Europea"
 BA_EU_focus_85_desc: "Fundaremos el 'Control de la Fuerza Aérea Europea' para liderar defensa del espacio aéreo, operaciones aeronáuticas y, a futuro, el desarrollo espacial. Con gestión integrada de cazas avanzados y sistemas satelitales, aseguraremos superioridad aérea y mantendremos viva la ambición europea hacia el cielo y el espacio. Vigilen el futuro de Europa desde lo más alto."

 BA_EU_focus_86: "Integración del mando"
 BA_EU_focus_86_desc: "Para actuar con rapidez y coherencia en crisis, delegaremos el control operativo de guerra de los ejércitos nacionales al Comandante Supremo de la EAF, unificando la cadena de mando. En momentos de vida o muerte, solo un ejército que se mueve con disciplina bajo una orden clara, y no con procedimientos complejos, puede vencer. Un mando eficiente ahorra la sangre de los soldados."

 ### Integración legal y judicial
 BA_EU_focus_87: "Imitar el derecho internacional"
 BA_EU_focus_87_desc: "Con base en el sistema de derecho internacional ya probado por el tiempo, lo adaptaremos a la realidad especial de la Unión Europea fusionada con Kivotos. En vez de crear leyes desde cero, levantar un nuevo orden jurídico sobre la sabiduría y normas acumuladas por la humanidad reduce errores y asegura estabilidad. Es la vía más sensata."

 BA_EU_focus_88: "Proponer el derecho de la Unión"
 BA_EU_focus_88_desc: "Promulgaremos un 'derecho de la Unión' con fuerza vinculante directa y jerarquía superior a las leyes internas de los Estados miembros. Este derecho, por encima de intereses y costumbres nacionales, será la banda fuerte que ate a Europa como comunidad jurídica y la base legal inquebrantable de la integración. La igualdad ante la ley también se aplica entre Estados."

 BA_EU_focus_89: "Legislar"
 BA_EU_focus_89_desc: "A través del Parlamento Europeo, emitiremos una oleada de leyes integradas que abarquen medio ambiente, derechos humanos, digital, energía y más. La ley define la sociedad y dibuja el futuro. Estamos rompiendo marcos viejos para tejer un armazón jurídico justo e innovador para la nueva Europa. El martillo del hemiciclo forja la historia."

 BA_EU_focus_90: "Tomar como referencia el derecho internacional de Kivotos"
 BA_EU_focus_90_desc: "Estudiaremos en profundidad casos y precedentes legales avanzados de Kivotos —donde coexisten seres de fuerza sobrehumana— para establecer criterios claros ante disputas inéditas: abuso de poderes místicos, destrucción de Halos y más. Debemos tomar prestada esa sabiduría jurídica para manejar fuerzas desconocidas, evitar el caos y asentar el orden."

 BA_EU_focus_91: "La ley por encima del Estado"
 BA_EU_focus_91_desc: "Consolidaremos constitucionalmente que las sentencias del Tribunal de Justicia de la UE y el derecho de la Unión prevalecen sobre constituciones y leyes nacionales. Es el paso más decisivo e irreversible para pasar de una unión de Estados soberanos a una auténtica federación. Seremos uno a través de la ley."

 BA_EU_focus_92: "Derecho de intervención en negociaciones"
 BA_EU_focus_92_desc: "Otorgaremos a la UE la facultad de intervenir y mediar en conflictos de intereses entre miembros, o de representar directamente a la unión en negociaciones diplomáticas clave con terceros países. Voces divididas son débiles; la voz de una Europa unida es poderosa. Ya no negociaremos con 27 bocas pequeñas, sino con una sola gran voz."

 BA_EU_focus_93: "Organizar la Constitución Europea"
 BA_EU_focus_93_desc: "Constituiremos una comisión para redactar una histórica 'Constitución Europea' que defina valores e ideales de la UE, derechos fundamentales y estructura de gobierno. No será solo un código: será el documento fundacional que anuncia el nacimiento de un nuevo orden, una promesa que contiene el alma de nuestra comunidad. Grabemos nuestro sueño en letras."

 BA_EU_focus_94: "Poder de investigación independiente"
 BA_EU_focus_94_desc: "Fundaremos una poderosa agencia federal de investigación, independiente, capaz de investigar por cuenta propia corrupción transfronteriza, terrorismo y crimen organizado sin verse sometida a presiones de gobiernos nacionales o poderes políticos. Solo una investigación sin santuarios endereza la justicia y castiga a quienes pretendan estar por encima de la ley."

 BA_EU_focus_95: "Control de tratados"
 BA_EU_focus_95_desc: "Ejerceremos la autoridad de revisar y aprobar previamente los tratados que los Estados miembros pretendan firmar por su cuenta con terceros países, para asegurar que no contradigan intereses o seguridad de la unión. Debemos bloquear acuerdos ocultos y diplomacias unilaterales que dañen la cohesión, manteniendo una política exterior unificada."

 BA_EU_focus_96: "Proponer la Constitución"
 BA_EU_focus_96_desc: "Tras intensos debates, presentaremos al parlamento el borrador final de la Constitución Europea y entraremos en un proceso de referendos y ratificaciones a escala continental. No es una orden desde arriba: es un gran proceso democrático donde la ciudadanía decide directamente su futuro y las reglas de gobierno. Es hora de ser dueños de la historia."

 BA_EU_focus_97: "Supervisar a los Estados miembros"
 BA_EU_focus_97_desc: "Pondremos en marcha un sistema de supervisión permanente para monitorear si los Estados miembros respetan valores democráticos, Estado de derecho y derechos humanos de la unión. A quienes incumplan o retrocedan en democracia se les advertirá y sancionará para mantener la salud del bloque. La confianza nace no de la fe ciega, sino de la verificación constante."

 BA_EU_focus_98: "Comisión Ejecutiva Europea"
 BA_EU_focus_98_desc: "Elevaremos la 'Comisión Ejecutiva Europea' del papel de simple órgano administrativo al de un gobierno formal. Este organismo, que dirige elaboración y ejecución de políticas y operación presupuestaria, se convertirá de facto en el 'gabinete europeo' y en el corazón que conduce a la unión. Un ejecutivo fuerte crea una Europa eficiente."

 BA_EU_focus_99: "Justicia"
 BA_EU_focus_99_desc: "Para consolidar el imperio de la ley, modernizaremos sistemas judiciales atrasados y reforzaremos independencia y profesionalismo de jueces para garantizar juicios justos y rápidos. Solo sentencias basadas en la ley y la conciencia —no en el dinero o el poder— alivian agravios y sostienen la justicia social. Un tribunal justo es el último bastión de la democracia."

 BA_EU_focus_100: "Institucionalizar investigaciones conjuntas"
 BA_EU_focus_100_desc: "Para resolver delitos complejos que cruzan fronteras —narcotráfico, trata de personas, cibercrimen— institucionalizaremos que las policías de los países involucrados formen obligatoriamente equipos conjuntos de investigación (JIT). Debemos demostrar a criminales que huyen entre países que no existe refugio. La investigación coordinada es el camino más rápido para ganar la guerra contra el crimen."
 BA_EU_focus_101: "Aplicar la Constitución"
 BA_EU_focus_101_desc: "Promulgaremos oficialmente y pondremos en vigor la Constitución Europea, ratificada con el apoyo abrumador de la ciudadanía. Europa ya no es una alianza laxa, sino que renace como un poderoso Estado federal unido bajo una sola bandera, una sola constitución y un solo destino. Cada artículo de la Constitución protegerá nuestras vidas e iluminará el futuro."

 BA_EU_focus_102: "Poder ejecutivo supranacional"
 BA_EU_focus_102_desc: "Si un gobierno nacional no cumple las sentencias del Tribunal Europeo, la Unión asegurará capacidad real de ejecución: podrá imponer multas coercitivas o movilizar recursos administrativos para forzar su cumplimiento. Una ley sin ejecución no es más que un tigre de papel y motivo de burla. La autoridad de la ley nace de una aplicación estricta."

 BA_EU_focus_103: "Compartir antecedentes penales"
 BA_EU_focus_103_desc: "Crearemos una base de datos penal integrada para compartir en tiempo real, entre todos los Estados miembros, huellas dactilares, ADN y antecedentes criminales. Ya no será posible delinquir en un país y huir a otro para “lavar” la identidad. Cruzar una frontera no hace desaparecer el delito."

 BA_EU_focus_104: "Derecho de intervención en disputas de la Unión"
 BA_EU_focus_104_desc: "Si dentro de un Estado miembro estalla una guerra civil incontrolable, disturbios graves o actos que destruyan el orden constitucional, la Unión tendrá la autoridad de emergencia para desplegar fuerzas y restaurar el orden, defendiendo la democracia. Este es el último seguro para proteger a la ciudadanía del enemigo interno."

 BA_EU_focus_105: "Organizar Europol"
 BA_EU_focus_105_desc: "Reformaremos Europol —antes poco más que un organismo de intercambio de información— y lo ampliaremos hasta convertirlo en una poderosa agencia federal con facultades directas de investigación y arresto, al estilo del FBI. Sus agentes operarán en toda Europa y perseguirán hasta el final a grandes organizaciones criminales y terroristas para capturarlos."

 BA_EU_focus_106: "Unificar competencias de investigación"
 BA_EU_focus_106_desc: "Trasladaremos la competencia investigadora de delitos graves —terrorismo, narcotráfico, lavado de dinero— desde policías nacionales hacia la agencia federal, elevando drásticamente la eficiencia y la imparcialidad. Cortaremos de raíz la colusión local y las investigaciones “a modo”, y construiremos una capacidad sistemática paneuropea contra el crimen."

 BA_EU_focus_107: "Proponer un organismo de mediación"
 BA_EU_focus_107_desc: "Estableceremos un órgano permanente de arbitraje y mediación que permita resolver, mediante diálogo y ajuste, disputas territoriales entre Estados o fricciones comerciales entre empresas antes de llegar a litigios costosos y lentos. Cerrar conflictos a tiempo y hallar acuerdos mutuamente beneficiosos es señal de una sociedad madura."

 BA_EU_focus_108: "Tribunal de Justicia Europeo"
 BA_EU_focus_108_desc: "Consolidaremos la autoridad y la independencia del 'Tribunal de Justicia Europeo', responsable de interpretar la Constitución de la Unión y emitir el fallo final sobre asuntos de derecho de la Unión. Sus sentencias serán definitivas e irrevocables, y todos los Estados miembros y ciudadanos deberán acatarlas. La diosa de la justicia se vendará los ojos y juzgará con imparcialidad, solo conforme a la ley."

 ### Administración y anticorrupción
 BA_EU_focus_109: "Administración"
 BA_EU_focus_109_desc: "Reformaremos a fondo una burocracia inflada y lenta, e introduciremos un sistema de administración digital usando tecnologías avanzadas como blockchain e IA para maximizar transparencia y eficiencia. Debemos bajar las barreras y elevar la calidad del servicio para que la ciudadanía acceda a lo público de forma rápida y cómoda, en cualquier lugar y momento. Un gobierno inteligente construye una Europa inteligente."

 BA_EU_focus_110: "Supervisión supranacional"
 BA_EU_focus_110_desc: "Ejerceremos fuertes facultades de auditoría para supervisar si los trámites administrativos de cada país se ajustan a estándares y procedimientos de la Unión, y exigir correcciones ante actos ilegales o injustos. La vigilancia del centro frenará arbitrariedades locales y elevará por igual el nivel administrativo en toda la Unión."

 BA_EU_focus_111: "Impulsar la rotación de cargos"
 BA_EU_focus_111_desc: "Reforzaremos la rotación obligatoria de altos funcionarios —propensos a corromperse si se enquistan— y expulsaremos sin titubeos a burócratas incompetentes o negligentes, inyectando tensión y disciplina al aparato. El agua estancada se pudre; solo el agua que fluye se mantiene limpia. Rompan la comodidad burocrática y asienten una cultura de mérito."

 BA_EU_focus_112: "Normas de mandato"
 BA_EU_focus_112_desc: "Limitaremos estrictamente los mandatos de cargos públicos clave, electos o designados, cortando la privatización del poder y el ciclo de corrupción que trae el largo control. El poder no es eterno: es una oportunidad temporal de servicio delegada. Denlo todo en el tiempo asignado y construyan una cultura de irse cuando aún aplauden."

 BA_EU_focus_113: "Campaña de represión anticorrupción"
 BA_EU_focus_113_desc: "Lanzaremos una gran campaña paneuropea contra el soborno, el tráfico de influencias y la malversación arraigados en la sociedad. Protegiendo a denunciantes y castigando con severidad a funcionarios corruptos, debemos grabar la idea de que 'corrupción = ruina'. Solo manos limpias hacen política limpia, y la integridad es la fuente de la competitividad nacional."

 BA_EU_focus_114: "Asignar supervisores"
 BA_EU_focus_114_desc: "Desplegaremos supervisores externos designados por la Unión en ministerios, instituciones públicas y grandes obras estatales para que permanezcan en sitio. Actuarán como 'inspectores encubiertos' que vigilan y denuncian en tiempo real corrupción interna y despilfarro. Donde llega la mirada del control, la ilegalidad pierde su lugar."

 BA_EU_focus_115: "Limitar la reelección"
 BA_EU_focus_115_desc: "Para impedir el fantasma de la dictadura —líderes que reforman la Constitución para perpetuarse— restringiremos constitucionalmente, de forma estricta, la reelección del presidente y del primer ministro. La democracia no debe depender de un solo héroe, sino de sistemas bien diseñados y ciudadanía despierta. La alternancia pacífica es la flor de la democracia."

 BA_EU_focus_116: "Reprimir el fraude a nivel estatal"
 BA_EU_focus_116_desc: "Castigaremos con dureza el fraude a escala estatal: gobiernos que manipulen estadísticas para cobrar subsidios de la Unión de forma indebida o maquillen cuentas para ocultar su situación fiscal. Este tipo de parasitismo devora el presupuesto común y puede empujar a toda la Unión a una crisis. Un país deshonesto no merece ser miembro."

 BA_EU_focus_117: "Vigilar la ejecución presupuestaria"
 BA_EU_focus_117_desc: "Construiremos un sistema digital de monitoreo presupuestario que permita publicar y rastrear en tiempo real cada gasto público. Cualquiera podrá vigilar si los impuestos se usan según su propósito y no se desvían a donde no deben, bloqueando desde la raíz el despilfarro. La transparencia es la base de la salud fiscal."

 BA_EU_focus_118: "Fiscalía Europea"
 BA_EU_focus_118_desc: "Crearemos la 'Fiscalía Europea (EPPO)' para investigar y acusar delitos que dañen las finanzas de la Unión: malversación de fondos, fraudes financieros y similares. Cruzarán fronteras para perseguir a los culpables hasta el final y recuperar los impuestos perdidos de la ciudadanía."

 BA_EU_focus_119: "Incautar órdenes"
 BA_EU_focus_119_desc: "En investigaciones de corrupción a gran escala, confiscaremos con rapidez documentos oficiales, correos electrónicos y registros de mensajería que contengan órdenes o presiones indebidas, asegurándolos como evidencia. Debemos bloquear intentos de sabotear la investigación “cortando colas” y exponer el tronco: a los jefes en la cima, llevándolos ante la justicia. Los registros no mienten."

 ### Ajuste de cuentas con el pasado y futuro
 BA_EU_focus_120: "Disolver organizaciones paramilitares"
 BA_EU_focus_120_desc: "Disolveremos por la fuerza y confiscaremos todas las armas de organizaciones armadas ilegales fuera del control estatal: milicias partidistas, matones políticos, y milicias extremistas. En una democracia, la fuerza legítima debe ser monopolio exclusivo del Estado; la violencia privada no puede tolerarse bajo ningún pretexto. La paz en las calles solo debe sostenerla la autoridad pública."

 BA_EU_focus_121: "Castigar genocidios"
 BA_EU_focus_121_desc: "Perseguiremos y castigaremos, sin aplicar prescripción, crímenes contra la humanidad que pisotearon la conciencia humana: limpieza étnica, genocidio, tortura sistemática. El tiempo no borra el delito; no podemos permitir que los perpetradores cierren los ojos en paz. Ante la justicia histórica no hay vencimiento: recordaremos, y volveremos a recordar, para juzgar."

 BA_EU_focus_122: "Castigar crímenes de odio"
 BA_EU_focus_122_desc: "Sancionaremos con agravantes los delitos que ejercen violencia o incitan odio por raza, religión, país de origen o género. Proteger a minorías y respetar la diversidad es un valor central de nuestra Unión, y debemos evitar que el virus del odio enferme a la sociedad. Un mundo sin discriminación es un mundo verdaderamente seguro."

 BA_EU_focus_123: "Investigar daños a civiles"
 BA_EU_focus_123_desc: "Realizaremos un censo exhaustivo de civiles que fueron injustamente asesinados o dañados en la guerra y las masacres, e impulsaremos disculpas oficiales y reparaciones a nivel estatal. Llamar por su nombre a las víctimas olvidadas y restaurar su honor es deber de quienes sobrevivieron. Solo sanando el dolor del pasado podremos avanzar hacia una reconciliación auténtica."

 BA_EU_focus_124: "Investigar a oficiales subalternos"
 BA_EU_focus_124_desc: "Las excusas cobardes de 'solo obedecí' ya no sirven. Los oficiales subalternos y ejecutores que dirigieron o toleraron masacres en el terreno también deben responder por sus actos. Debemos alertar contra la banalidad del mal y enseñar que el verdadero honor militar es conservar la conciencia capaz de rechazar órdenes injustas."

 BA_EU_focus_125: "Sancionar el fascismo"
 BA_EU_focus_125_desc: "Prohibiremos estrictamente por ley toda alabanza o propaganda del nazismo, el fascismo y el totalitarismo, así como el uso de sus símbolos, y disolveremos por la fuerza a las organizaciones políticas que los sigan. No podemos permitir la libertad de ideas que destruyen la democracia. Debemos aplastar con firmeza para que la semilla del demonio no vuelva a brotar."

 BA_EU_focus_126: "Erradicar el ultranacionalismo"
 BA_EU_focus_126_desc: "Enfrentaremos con dureza a fuerzas ultranacionalistas que excluyen a otros pueblos, gritan chovinismo y siembran división y odio, tratándolas como enemigas sociales. No somos una unión atada por sangre y tierra, sino por valores de libertad y derechos humanos. Expulsemos el espectro del nacionalismo cerrado y cultivemos una conciencia abierta de ciudadanía global."

 BA_EU_focus_127: "Veredicto final"
 BA_EU_focus_127_desc: "Concluiremos el largo y doloroso proceso judicial y dictaremos el veredicto final de la historia sobre los criminales de guerra. No es solo castigo: es un ritual que condena el mal pasado, consuela a las víctimas y demuestra que la justicia sigue viva. Con este fallo, nos despedimos del pasado oscuro y, ya sin cargas, podremos caminar con el corazón más ligero hacia una nueva era."

 BA_EU_focus_128: "El camino de Europa"
 BA_EU_focus_128_desc: "Sobre las ruinas de la guerra, la división y la Gran Transición, levantamos con sudor y lágrimas una torre de paz y prosperidad. Hoy Europa se sacude los espectros del pasado y se alza en el centro del mundo como modelo de una nueva civilización, donde la mística de Kivotos y la sabiduría humana conviven en armonía. Este es el 'camino de Europa' que elegimos, construimos y debemos recorrer. La historia recordará para siempre nuestro valor y nuestra sabiduría."

