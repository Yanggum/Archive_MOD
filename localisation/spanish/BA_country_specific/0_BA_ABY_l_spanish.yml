 ABY_shiroko_fas_event.1.t: "Plano torpe"
 ABY_shiroko_fas_event.1.d: "La primavera de Praga era caótica, pero en los ojos de los ciudadanos brillaba un fervor como nunca antes. La popularidad de Shiroko, la “heroína salvadora de la patria” que derrocó a Suou, se disparaba hasta el cielo, y las próximas elecciones generales no eran, en la práctica, más que su coronación. Pero la propia Shiroko, sentada frente al escritorio del palacio de gobierno, fruncía el ceño.\n\n\"Mm… ¿y cómo se gobierna un país? Es complicado.\"\n\nNo tenía una gran ideología ni una filosofía política. Tras desvelarse pensando, arrancó una hoja del cuaderno y anotó, con letra torpe, lo primero que se le venía a la cabeza.\n\nQue nadie pase hambre.\nAl que haga el mal, castigarlo de verdad.\nA los nuestros, protegerlos hasta el final.\nEl banco… no, el tesoro público, usarlo con transparencia.\n\nCuando aquel memo burdo, sin título, que empezó a circular como “Las promesas de la revolución”, salió publicado en los periódicos, la reacción fue extrañamente explosiva. Los comentaristas políticos se burlaron: “no tiene la dignidad de un jefe de Estado”. Pero los ciudadanos, hartos de las mentiras pretenciosas de los políticos de siempre, enloquecieron: “esto sí es sinceridad sin maquillaje”, “así de directa habla una loba”.\n\nShiroko se sintió desconcertada ante aquella devoción ciega. Sola, no podía. De inmediato convocó a los miembros del Comité de Contramedidas.\n\nSe abrió la puerta de la sala y entraron Ayane, Nonomi y Serika. Pero el asiento más importante estaba vacío.\n\n\"¿Y Hoshino, senpai?\"\n\n\"…Dice que no vendrá.\"\n\nAyane lo comunicó con un gesto sombrío. Hoshino había definido el armado de las milicias y la revolución por la fuerza como “el inicio de otra dictadura”. Seguía yendo a trabajar como funcionaria menor en la administración, pero se negaba incluso a cruzar miradas con Shiroko, y mucho menos a hablar en privado.\n\nPero no podían detenerse.\n\n\"No hay de otra. Por ahora… tenemos que seguir adelante.\"\n\nShiroko miró a las tres que quedaban.\n\n\"Ayúdenme. Solo sé pelear. Pero este país no se mueve solo con peleas.\"\n\n\"¡De verdad, senpai, es que sin nosotras no puedes!\" refunfuñó Serika mientras recogía los papeles del Ministerio del Interior.\n\n\"La economía déjamela a mí~ Voy a intentar usar el poder de Nephthys para algo bueno.\" Nonomi sonrió y abrió los informes financieros.\n\n\"Yo te apoyaré con la diplomacia y la administración en general.\" Ayane se ajustó las gafas.\n\nAsí, el gobierno de la loba comenzó de forma precaria: con tres asistentes… y un vigilante que le dio la espalda."
 ABY_shiroko_fas_event.1.a: "Por toda mi vida, por la Federación y por la revolución."

