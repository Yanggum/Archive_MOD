 ABY_shiroko_fas_event.11.t: "La valla de acero"
 ABY_shiroko_fas_event.11.d: "\"Senpai, la región alemana del oeste… Gehenna y Trinity nos están vigilando. Si nos ven débiles, intentarán tomar la hegemonía de la zona. Para evitar la guerra, tenemos que demostrar que somos fuertes… y al mismo tiempo hacer amigos.\"\n\nEl análisis de Ayane era certero. Shiroko asintió.\n\n\"Sí. Lo sé. Si no me provocan, no muerdo. Pero hace falta un seguro.\"\n\nShiroko se plantó ante el micrófono del estudio. Había un guion, pero lo hojeó por encima y lo apartó sin más. Y empezó a hablar con su voz plana de siempre.\n\n\"Podemos ser fuertes incluso solos. Pero con amigos somos más fuertes. Desde hoy, Abydos se da la mano con Rumanía y Yugoslavia. ¿Se acuerdan de la ‘Pequeña Entente’? Pues la revivimos.\"\n\nRespiró un instante y lanzó el mensaje hacia el oeste.\n\n\"Y a los países alemanes del oeste también les digo esto: si no codician nuestra tierra y nos respetan, nosotros tampoco queremos pelear. Llevémonos bien. Es simple.\"\n\nSu mirada atravesó la cámara.\n\n\"Pero si tocan a mis amigos, o pisan nuestra tierra sin permiso… entonces no los voy a perdonar. Los voy a perseguir hasta el fin del infierno y los voy a vaciar. Ya saben cómo soy. Abydos devuelve lo que recibe. Así que acuérdense bien.\"\n\nUna declaración cruda, sin retórica diplomática."
 ABY_shiroko_fas_event.11.a: "Eso se grabó en los países vecinos como una advertencia y una oferta más poderosas que cualquier documento diplomático."

 ABY_shiroko_fas_event.12.t: "Fundir las armas para hacer pan"
 ABY_shiroko_fas_event.12.d: "\"¡Así no se puede, senpai! Suou lo apostó todo a las fábricas militares y dejó esto hecho un desastre. Se cortaron carreteras, faltan bienes básicos… ahora la gente aplaude, pero si tienen hambre, eso puede volverse rabia en cualquier momento.\"\n\nLos regaños de Serika dolían, pero eran verdad. Nonomi también apoyó: \"Sí. Ahora toca cuidar la mesa de la gente, no los tanques.\"\n\nShiroko miró el mapa. Para ella, un mapa siempre había sido un área de operaciones que conquistar… pero ahora era un hogar que debía proteger.\n\nDías después, Shiroko subió a la tarima de la plaza central. Una multitud la miraba desde abajo. Ella agarró el micrófono y, como si escupiera las palabras, dijo:\n\n\"Ganamos. Pero la victoria no te da de comer.\"\n\nLa plaza quedó en silencio al instante.\n\n\"Si hay hambre, ganar no sirve de nada. Ahora lo que hace falta no son balas: es pan. Así que vamos a cambiar.\"\n\nSeñaló hacia algún lugar.\n\n\"En las fábricas ya no haremos piezas para tanques: haremos tractores. Volveremos a unir las carreteras cortadas y levantaremos otra vez las escuelas derrumbadas. Ciudad o campo, gente de este mundo o gente de Kivotos, da igual. Todos los que viven en esta tierra tienen que comer hasta llenarse y dormir con las piernas estiradas.\"\n\nShiroko se dio un golpecito en el pecho.\n\n\"La verdad, yo solo sé romper y pelear. Construir se me da mal. Por eso voy a aprender de mis amigos… y de todos en Abydos. Fundiremos las armas para hacer pan. Yo cumplo mis promesas. Sí.\"\n\n¡WAAAH!\n\nEl grito que sacudió la plaza. La gente creyó en la sinceridad tosca escondida en su forma de hablar. Pero Shiroko no sonrió. Entre la multitud, sentía la mirada fría de Hoshino, observándola en silencio."
 ABY_shiroko_fas_event.12.a: "Algún día..."

 ABY_shiroko_fas_event.13.t: "La Gran Federación de Abydos"
 ABY_shiroko_fas_event.13.d: "Frente al Parlamento de Budapest, a orillas del Danubio, la multitud ondeaba juntas las banderas de Abydos, Eslovaquia y Hungría. Tras la victoria en la unificación de Eslovaquia y la guerra de liberación de Hungría, Shiroko se plantó allí no como conquistadora, sino como “libertadora”. En lugar de su habitual chaqueta táctica práctica, llevaba un uniforme de corte firme con la banda presidencial.\n\nShiroko tomó el micrófono y miró a la multitud. Sus ojos estaban firmes, sin titubeos.\n\n\"Sí. Ya estamos todos. La guerra terminó. Los dictadores desaparecieron y recuperamos a nuestra familia.\"\n\nSeñaló el enorme mapa colgado detrás. Las fronteras de Chequia, Eslovaquia, Austria y Hungría habían sido borradas, y un vasto territorio estaba pintado de un solo color.\n\n\"Ya no somos extraños. Chequia, Eslovaquia, Austria, Hungría… somos una sola familia. Y la familia no puede vivir separada. Por eso lo uní todo.\"\n\nY lo declaró.\n\n\"Desde hoy, este país es la ‘Gran Federación de Abydos’.\"\n\nEstalló el clamor. Shiroko alzó la mano para calmarlos y habló con dureza.\n\n\"Crecimos. Somos más fuertes. Ahora nadie puede tocar a nuestra familia. Si entraste en mi cerca, te protejo hasta el final. Haré que no pasen hambre y que no vivan con miedo. Esa es mi forma. Esa es la forma de la Gran Abydos.\"\n\nSu lógica era simple. Conflictos étnicos complejos u odios históricos quedaban cubiertos por su propia definición: “familia dentro de mi cerca”.\n\n\"La Gran Abydos no se detiene. Síganme.\""
 ABY_shiroko_fas_event.13.a: "Había nacido el hegemon de Europa Central."

 ABY_shiroko_fas_event.14.t: "La manada de lobos"
 ABY_shiroko_fas_event.14.d: "En la gran sala de conferencias del palacio presidencial de Horn, Shiroko compareció ante la prensa junto a los embajadores de Rumanía y Yugoslavia. Las banderas de los tres países colgaban una al lado de la otra, anunciando el renacer de un enorme muro que atravesaba Europa Central.\n\n\"El mundo sigue siendo peligroso. En el oeste y en el este nos miran. Si peleas solo, te lastiman fácil. Por eso llamé otra vez a viejos amigos.\"\n\nEn lugar de leer un discurso, Shiroko habló con su estilo directo.\n\n\"¿Se acuerdan de la ‘Pequeña Entente’? Pues vuelve. Rumanía, Yugoslavia y nuestra Gran Abydos. Desde ahora, estos tres son un solo cuerpo.\"\n\nApretó el puño en el aire.\n\n\"Vamos a cuidarnos la espalda. Si golpean a Rumanía, yo golpeo. Si me golpean a mí, Yugoslavia ayuda. Regla simple.\"\n\nMiró a la cámara.\n\n\"Esto no es para molestar a nadie. Es para reforzar la cerca de nuestra casa. Pero aviso: los que intenten saltarla, más les vale estar listos. Los tres iremos a la vez. Si tocan a mis amigos, no los voy a dejar en paz.\"\n\nNo hubo palabras difíciles como “tratado de defensa mutua” o “seguridad colectiva” que Ayane había escrito. Pero la lógica de la manada —“si tocas a uno, vamos todos”— era más clara y amenazante que cualquier diplomacia. Los ciudadanos vitorearon y los vecinos se pusieron tensos. El gran bloque militar que dominaba el Danubio había resucitado oficialmente."
 ABY_shiroko_fas_event.14.a: "Uno por uno, uno por uno..."

 ABY_shiroko_fas_event.15.t: "El zorro de los Balcanes y la loba"
 ABY_shiroko_fas_event.15.d: "En una casa segura, oculta en Belgrado, Josip Broz Tito miró con una expresión extraña al agente de inteligencia de Abydos, enviado como representante de Shiroko. El agente le tendió un maletín con documentos firmados de puño y letra por Shiroko.\n\n\"Es la propuesta de la presidenta Shiroko: para resolver los conflictos étnicos internos y la incompetencia de la monarquía, desea cooperar con el secretario Tito.\"\n\nTito hojeó los papeles. Financiación enorme, armas modernas, y apoyo indirecto mediante el despliegue de tropas de Abydos en la frontera si estallaba un golpe. La condición era solo “mantener relaciones amistosas con Abydos”.\n\n\"Esto es una interferencia interna clarísima. Su presidenta parece creer que voltear países ajenos es como ayudar a limpiar la casa del vecino.\"\n\nTito se burló, fumando un puro. El agente, cortés pero firme, transmitió la intención de Shiroko.\n\n\"Su excelencia considera que, para que el pueblo yugoslavo encuentre una estabilidad real, hace falta un líder fuerte y capaz como usted, más que la actual casa real. Recalca que esto no busca ninguna compensación política: es un apoyo puro por un futuro mejor para Yugoslavia. Solo pide que, tras asumir el poder, trate a nuestra Federación como a un hermano.\"\n\nTito soltó una risa seca. No sabía si era ingenuidad u orgullo. Normalmente, propuestas así vienen con condiciones sucias: cesión territorial, subordinación económica. Pero Shiroko se movía, de verdad, por su propia justicia: “si Tito manda, al pueblo le irá mejor”.\n\n‘Idealista peligrosa… pero no hay razón para decir que no.’\n\nTito era un realista. Tendría que vigilar el humor de Abydos, sí, pero con ese apoyo podía completar la revolución de sobra.\n\n\"Bien. Acepto. Si alguien quiere ser amigo, ¿por qué rechazarlo?\"\n\nTito tendió la mano para sellarlo."
 ABY_shiroko_fas_event.15.a: "La “buena intención” de Shiroko estaba a punto de cambiar el mapa de los Balcanes."

 ABY_shiroko_fas_event.16.t: "El cordero y la loba"
 ABY_shiroko_fas_event.16.d: "En el salón de audiencias del Castillo de Peleș, en Rumanía, el rey Mihai I recibió, nervioso, al emisario de Shiroko. Para un monarca joven con una base política débil, la situación era un campo minado: el lujo de Carol II y los diputados corruptos estaban pudriendo el país.\n\nEl emisario transmitió el mensaje con respeto.\n\n\"La presidenta está profundamente preocupada por Su Majestad. Dice que no puede quedarse de brazos cruzados mientras la confusión alrededor de Rumanía obstaculiza su gobierno y hace sufrir al pueblo.\"\n\n\"¿Abydos… quiere ayudarme? ¿Por qué? Yo no tengo nada que darles.\"\n\nEl emisario inclinó la cabeza.\n\n\"Su excelencia cree que Su Majestad tiene buen corazón, pero que fuerzas amenazantes a su alrededor no le dejan cumplir su voluntad. Quiere que el pueblo rumano viva en paz bajo el gobierno de un monarca benevolente como usted. Nosotros seremos el ‘escudo’ que retire esos obstáculos.\"\n\nEra más la lógica de un matón del barrio fuerte protegiendo a un chico débil que diplomacia internacional. Pero había una sinceridad extraña en esas palabras. Mihai I miró el plan de apoyo: modernización de la guardia real, inteligencia, ayuda económica.\n\nA ojos de un rey joven y sin experiencia, Shiroko parecía una protectora poderosa y justa. Sabía que su método era brusco y autoritario, pero quería creer, al menos a medias, en el “ideal” que ella proclamaba.\n\n\"De acuerdo… aceptaré la buena voluntad de la presidenta Shiroko. Rumanía tratará a Abydos como su país hermano de mayor confianza.\"\n\nMihai I asintió. Shiroko se adentraba en la política interna rumana usando su influencia… pero para ella era, sin duda, “proteger a un hermano menor”."
 ABY_shiroko_fas_event.16.a: "Quizá sea… un poco de sobreprotección."

 ABY_shiroko_fas_event.17.t: "Firma de la Ley Federal"
 ABY_shiroko_fas_event.17.d: "Frente al Parlamento de Budapest, en lugar del tricolor húngaro, ondeaba la enorme bandera federal de la Gran Abydos. Shiroko se presentó ante una multitud de ciudadanos húngaros. En sus ojos se mezclaban el miedo al conquistador y el alivio de que la guerra hubiera terminado. Shiroko apartó el discurso preparado y tomó el micrófono.\n\n\"Sí. La guerra terminó. Bajen las armas.\"\n\nCon su primera frase, la plaza, tensa, empezó a murmurar.\n\n\"Desde hoy no existe eso de ‘territorio ocupado húngaro’. Se acabó el control militar. Ya no son un pueblo derrotado: desde ahora son ciudadanos de la Gran Federación de Abydos. Tendrán los mismos derechos que un checo o un austriaco.\"\n\nLo declaró: una nueva ley federal, conocida como “la Ley de la Familia”.\n\n\"El pasado no importa. Si estás dentro de mi cerca, somos una familia. Yo no discrimino a la familia. Está mal que molestaran a los eslovacos, pero basta con prometer que no volverá a pasar. Entonces yo también los protegeré. Nadie va a tratarlos como ciudadanos de segunda.\"\n\nSeñaló hacia el este.\n\n\"Vamos a reconstruir este lugar atrasado. Levantaremos fábricas, construiremos escuelas y repartiremos pan. Si vives dentro de esta federación, tienes que estar igual de lleno. Esa es mi regla.\"\n\nEra simple y tosco… pero más fuerte que cualquier código legal. No era una mano tendida del vencedor al vencido, sino la promesa de un cabeza de familia a los suyos. Los húngaros se miraron, atónitos, y entonces alguien empezó a aplaudir."
 ABY_shiroko_fas_event.17.a: "Era el sonido de aceptar a un nuevo protector, no a un conquistador."

 ABY_shiroko_fas_event.18.t: "La sombra del padre"
 ABY_shiroko_fas_event.18.d: "\"¡Larga vida a la madre de la Federación, presidenta Shiroko!\"\n\n\"¡La verdadera heredera de Masaryk!\"\n\nCada vez que los vítores entraban por la ventana del palacio, Shiroko sentía el pecho oprimirse. “Madre de la Federación”. Ese título que le habían colgado era extraño… y demasiado pesado.\n\nEn un rincón del despacho colgaba el retrato de Tomáš Masaryk: un “adulto verdadero” que dedicó su vida a la democracia y el humanismo, y que, aun gobernando por largo tiempo, no destruyó el orden constitucional.\n\n‘Sensei… ¿lo estoy haciendo bien?’\n\nShiroko miró sus manos. Su gobierno era eficiente: el hambre había desaparecido y las fronteras eran seguras. Pero el parlamento se había vuelto su coro de manos alzadas, y la prensa solo sabía alabarla. Masaryk enseñó a la gente a caminar; Shiroko cargaba a la gente y corría. Y la gente estaba olvidando cómo caminar por sí misma.\n\n\"Mm… yo no soy Sensei. Yo solo…\"\n\nMientras el pueblo la convertía en una deidad, Shiroko intuía que estaba volviéndose un monstruo. El retrato de Masaryk parecía mirarla hoy con una severidad inusual. Ella corrió las cortinas y cerró el mundo afuera."
 ABY_shiroko_fas_event.18.a: "La sombra, ocultada por el brillo de la adoración, se volvía cada vez más oscura."

 ABY_shiroko_fas_event.19.t: "El día más largo de Hungría"
 ABY_shiroko_fas_event.19.d: "Győr había cambiado. Desde que se reconstruyó el edificio principal de Abydos, aquel lugar ya no era una simple ciudad provincial. Se alzaron rascacielos de estilo Abydos y, tras anunciarse el traslado de la capital administrativa, se convirtió en el nuevo corazón de la Federación.\n\nIstván, un joven húngaro, se sentó en la terraza de un café y contempló el paisaje. Su patria, Hungría, estaba partida en tres: una parte en Rumanía, otra en Yugoslavia y el resto aquí, en la Gran Abydos.\n\n\"Se vive mejor que antes. Ya no hay rey ni nobles.\"\n\nEl anciano de al lado rió. Era verdad: las calles estaban llenas de vida y la gente sonreía. Con la noticia de que Győr sería la capital, muchos húngaros se entusiasmaron como si fueran a convertirse en el centro de la Federación. Pero István lo sabía.\n\nLo que crecía en las calles de Győr eran los rótulos y la cultura “a lo Kivotos”. ¿Nacionalismo húngaro? ¿La resurrección de la Gran Hungría? Los que gritaban eso ahora eran cerdos saciados, colgando fotos de Shiroko y alabándola.\n\n‘No nos conquistaron. Nos digirieron.’\n\nBajo aquel gigantesco edificio principal de Abydos, la identidad húngara se iba derritiendo en silencio. Si hubiera un tirano al que resistir sangrando, quizá habría sido más fácil. Pero el pan y la prosperidad de Shiroko eran demasiado dulces.\n\nIstván rozó el pin del tricolor húngaro que llevaba guardado en el bolsillo. Suspira y lo empujó aún más al fondo.\n\n\"Sí… con que se viva bien, basta, ¿no?\"\n\nY bebió su café."
 ABY_shiroko_fas_event.19.a: "En el día de mayor prosperidad de Hungría, Hungría se estaba muriendo en silencio."

 ABY_shiroko_fas_event.20.t: "Prisionera del trono dorado"
 ABY_shiroko_fas_event.20.d: "Todas las “promesas de la revolución” de Shiroko se cumplieron. El hambre terminó, el crimen cayó al suelo y la Gran Federación de Abydos se alzó como potencia hegemónica de Europa Central. En apariencia, ella era una soberana perfecta.\n\nPero por las noches, Shiroko bebía sola en el despacho a oscuras.\n\n\"¿En qué momento empezó a salir mal?\"\n\nLo sabía: cuanto más se alargaba su mandato, más se atrofiaba el músculo democrático del país. Mientras ella decidía todo y resolvía todos los problemas, el sistema se paralizaba.\n\n‘Quiero dejarlo.’\n\nLo pensó decenas de veces. Quería quitarse el uniforme, volver a ser una ciudadana común y pedalear en bicicleta con sus amigas. Pero ella era soldado. Y su ojo para leer el flujo del campo de batalla le mostraba la realidad cruel.\n\nSi se retiraba ahora… carroñeros se lanzarían sobre el vacío de poder. Militares-políticos ambiciosos. No restaurarían la democracia: despedazarían la Federación.\n\n\"Yo… tengo que aguantar.\"\n\nSe ató al “trono dorado”. Tenía que ser el sol del pueblo, aunque ese sol la estuviera quemando viva. Shiroko miró la ciudad nocturna por la ventana y deseó que algún día apareciera alguien más fuerte, más correcto, que la bajara de ese asiento maldito. Que fuera una revolución o un impeachment, daba igual."
 ABY_shiroko_fas_event.20.a: "Rezando solo por ser liberada algún día, la loba volvió a guardar el trono esa noche."

 ABY_shiroko_fas_event.21.t: "La urna silenciosa"
 ABY_shiroko_fas_event.21.d: "Shiroko, soñando con recuperar la democracia, forzó la celebración de elecciones generales. En el fondo, esperaba que la oposición creciera, que la vigilara, y así poder distribuir el poder de forma natural.\n\n\"Que sea limpio. No se metan, para nada.\"\n\nSe lo ordenó una y otra vez al Ministerio del Interior y a Inteligencia. Las elecciones se celebraron sin trampas: no hubo urnas cambiadas ni amenazas.\n\nPero cuando el resultado apareció en la pantalla, Shiroko se desesperó.\n\n[Partido Republicano Democrático Federal: 92% de los votos, barrida total de escaños]\n\nLa oposición fue aniquilada. No: desde el inicio, era imposible que existiera una oposición significativa. El pueblo ni siquiera podía imaginar una alternativa a Shiroko, la heroína de guerra y madre que les daba pan. Hasta los candidatos opositores hacían campaña diciendo: “seguiremos la voluntad de la presidenta Shiroko”.\n\nSus asesores descorcharon champaña celebrando la victoria aplastante, pero Shiroko, pálida, se dejó caer. El apoyo abrumador del pueblo, irónicamente, le entregaba una absolución para una dictadura permanente. La urna representaba la voluntad popular… pero esa misma voluntad estaba matando la democracia. Dentro del sistema que ella misma creó, Shiroko se había convertido en una diosa incapaz de perder."
 ABY_shiroko_fas_event.21.a: "\"¿Esto… es democracia?\""

 ABY_shiroko_fas_event.22.t: "A toda velocidad"
 ABY_shiroko_fas_event.22.d: "El aumento de su popularidad solo hizo a Shiroko más inquieta. Si la democracia no podía asentarse de manera natural, entonces tendría que construir un sistema aunque fuera a la fuerza.\n\n\"No hay tiempo. Mejor rápido y imperfecto que perfecto y tarde (巧遲拙速).\"\n\nEmpujó las reformas como si dirigiera una operación militar.\n\n\"¿Más poder para los consejos locales? No esperen a que pase una ley: háganlo por decreto ya.\"\n\"¿Independencia judicial? Si faltan jueces, licencien a los abogados militares y mándenlos a provincias.\"\n\"¿Libertad de prensa? Den subsidios a los periódicos para que critiquen al gobierno, aunque sea a la fuerza.\"\n\nSu intención era buena: repartir el poder y aceptar vigilancia. Pero el resultado, al saltarse el proceso, fue desastroso.\n\nLos consejos locales, sin preparación, se volvieron presa de los caciques. La justicia improvisada dictaba sentencias mirando más a Shiroko que a la ley. Y la prensa financiada por el Estado, en vez de “crítica sana”, vomitó “elogios disfrazados de crítica”.\n\nLa torre que Shiroko levantó con prisa era un castillo de arena. Cuanto más la tocaba, más se torcía y se rompía el sistema. La loba estaba comprendiendo, con dolor, que su impaciencia solo deformaba el régimen… y lo reforzaba como una dictadura monstruosa."
 ABY_shiroko_fas_event.22.a: "\"¿Por qué no sale… si es algo simple?\""

 ABY_shiroko_fas_event.23.t: "Comprender a través de la ruptura"
 ABY_shiroko_fas_event.23.d: "Hoshino cerró el libro de cuentas sobre el escritorio: la cuenta secreta de la Alianza Socialista de Abydos. En las últimas semanas, estaban entrando donaciones enormes de origen desconocido. Tras rastrearlas, el origen era nada menos que “la Oficina de la Secretaría del Palacio Presidencial”.\n\nHoshino se fue directo al palacio. Era la primera vez que se veían cara a cara desde que Shiroko asumió.\n\n\"Uhee~ ¿y esto qué es, Shiroko-chan?\"\n\nHoshino tiró el libro de cuentas sobre la mesa.\n\nShiroko lo miró en silencio.\n\n\"La oposición es demasiado débil. Sin fuerzas que vigilen, el gobierno se pudre. Mejor que seas tú… mejor que tú me ataques. Es mejor eso a que aparezcan raros.\"\n\nEra la forma torcida de Shiroko de “proteger la democracia”: criar a su propio enemigo para equilibrar el poder, un manotazo desesperado.\n\nHoshino soltó una risa incrédula.\n\n\"Ja… de verdad eres tonta. ¿Qué legitimidad tiene una oposición que crece con dinero del gobierno? Eso es solo la segunda línea. Un títere.\"\n\n\"¡Pero aun así…!\"\n\n\"No lo voy a aceptar. Ese dinero no.\"\n\nHoshino habló con firmeza.\n\n\"Y desde hoy renuncio también al cargo de funcionaria. Ahora sí voy a ser una civil de verdad.\"\n\nLos ojos de Shiroko temblaron. Era el instante en que se rompía el último vínculo que quedaba. Hoshino abrió la puerta para irse, se detuvo un segundo y le habló sin girarse.\n\n\"Shiroko-chan. No intentes cargarlo todo sola. Te vas a romper.\"\n\n\"…\"\n\n\"Yo haré lo mío afuera. Y si de verdad te equivocas, entonces iré a pararte de verdad. Así que… aguanta hasta entonces.\"\n\nLa puerta se cerró. Shiroko quedó sola en el despacho vacío. En la superficie, era una ruptura total. Pero Shiroko enterró la cara en el escritorio y, por primera vez en mucho tiempo, sonrió apenas.\n\nEl alivio de tener un “enemigo real” que la vigile y la detenga. La última frase de Hoshino se volvió el único consuelo para la loba atrapada en el trono frío."
 ABY_shiroko_fas_event.23.a: "Sí…"


