 ABY_event.49.t:0 "Una sola opción"
 ABY_event.49.desc:0 "Tras el establecimiento del Gobierno Provisional de Abydos, surgieron diversos partidos.\n\nEntre ellos, los más representativos fueron:\n * Un partido democrático que, con Hoshino del Comité de Contramedidas de Abydos como eje, propone formar un parlamento y que el pueblo elija a los diputados.\n * Un partido comunista que, con Hoshino como máxima gobernante, sostiene que el pueblo debe trabajar por el partido y disfrutar de una vida igualitaria, sin brecha entre ricos y pobres.\n * Un partido fascista que, con Hoshino como máxima gobernante, afirma que el pueblo debe servir al Estado.\n\nSin embargo, llegamos a pensar que tantos partidos con opiniones distintas, más que ayudar, obstaculizan el desarrollo del país.\nAhora, entre todos esos partidos… tendremos que elegir uno."
 ABY_event.49.a:0 "¡Con la fuerza del Estado!"
 ABY_event.49.b:0 "¡Con la fuerza del pueblo!"

 ABY_event.50.t:0 "Operación Pétalos Caídos"
 ABY_event.50.desc:0 "La tregua fue solo un respiro. Mientras los frentes se estabilizaban y las líneas se trazaban en los mapas, los enemigos también se estaban reorganizando.\n\nEn el cuartel general, el ‘Gobierno de dos mundos’ tomó una decisión: si querían sobrevivir, debían golpear primero.\n\nLa operación recibió un nombre poético y cruel: §YOperación Pétalos Caídos§!. Un avance relámpago para abrirse paso hacia §YBohemia§!, recuperar las ciudades clave y, con ello, asegurar el corazón industrial y político necesario para sostener la guerra.\n\nLos checos pidieron velocidad antes de que el enemigo sellara los pasos.\nLos sudetes exigieron garantías: no abandonarían otra vez sus hogares.\nAbydos, con máscaras y determinación, solo hizo una pregunta: “¿Dónde está el objetivo?”\n\nLos trenes de suministros ya están listos. Las órdenes, firmadas. Los soldados y estudiantes esperan en silencio, con la respiración contenida.\n\nEl invierno aún no ha terminado.\nY cuando caigan los primeros ‘pétalos’, Europa sabrá que esta coalición no piensa desaparecer."
 ABY_event.50.a:0 "¡Hacia Bohemia!"




