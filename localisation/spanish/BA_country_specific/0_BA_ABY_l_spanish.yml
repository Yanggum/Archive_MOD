 ABY_new_event.209.t:0 "El regreso del Gobierno Provisional"
 ABY_new_event.209.d:0 "Edvard Beneš, sentado en el vehículo, contempló en silencio el camino que llevaba lentamente hacia Praga. Era un hecho del que sentirse orgulloso: habían recuperado Bohemia gracias a la victoria de los aliados. Pero su corazón se sentía cada vez más pesado. Ya sabía, por los relatos, cómo habría quedado su patria marcada por las huellas de Hyakkiyako… pero el paisaje que se desplegaba ante sus ojos superaba por mucho lo que había imaginado.\n\nCuanto más se acercaba a la ciudad, más nítidos se volvían los rasgos de la arquitectura japonesa. Calles cubiertas de techos de tejas, jardines al estilo japonés, torii rojos que habían reemplazado por completo un paisaje que le era familiar. La mayoría de los edificios checos que antes conformaban el corazón de Praga habían desaparecido, y aun los que quedaban habían sido modificados con estética japonesa.\n\nBeneš soltó un profundo suspiro mientras miraba por la ventana. Sabía que este cambio era inevitable. Ya había recibido informes y aceptaba la realidad de que revertirlo tomaría tiempo. Pero ver Praga con sus propios ojos era muchísimo más extraño e inquietante de lo que había sentido en su imaginación.\n\nEl Puente de Carlos, sobre el Moldava, también le dolió. El puente seguía intacto, pero las linternas japonesas colgadas en su baranda brillaban con una luz ajena. De aquel Puente de Carlos que recordaba, símbolo del orgullo checo, no se percibía nada.\n\n«¿De verdad… esto es Praga…?» murmuró Beneš. En su voz se mezclaban emociones complejas.\n\nRecordó la Praga del pasado: la silueta majestuosa de la Catedral de San Vito, los ciudadanos cantando a la libertad en la plaza. La ciudad que tenía enfrente parecía traicionar todos esos recuerdos.\n\nAun así, intentó recomponerse. Que Praga permaneciera con ese aspecto no significaba que el espíritu checo hubiera desaparecido. Cambiar la ciudad llevaría tiempo, pero devolverle el alma checa todavía era posible.\n\nAquel día, el cielo de Praga estaba cubierto de nubes espesas, pero dentro del corazón de Beneš ardía una esperanza brillante."
 ABY_new_event.209.a:0 "«Esto no es más que el comienzo»."

