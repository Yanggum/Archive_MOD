 ABY_czech_head_1_trait: "§YPadre de Bohemia§!\n	Estabilidad: §G+30.00%§!\n	Ganancia de poder político: §G+15%§!\n	Apoyo diario a la democracia: §G+0.10§!\n\nTomáš Garrigue Masaryk nació el 7 de marzo de 1850 en Hodonín, Moravia. Al llegar a la juventud, como filósofo y reformador social, desempeñó un papel pionero en el movimiento nacionalista checo basado en el austroeslavismo. Se dedicó a la autonomía del pueblo checo dentro del Imperio austrohúngaro, pero durante la Primera Guerra Mundial, reflejando la situación internacional, viró hacia la línea independentista checoslovaca y contribuyó a la proclamación de independencia del 28 de octubre de 1918. Ese mismo año, el 14 de noviembre, asumió como primer presidente, desempeñando un papel decisivo en la construcción del Estado y el establecimiento de la democracia; renunció a la presidencia en 1935. Sin embargo, con la Gran Transferencia volvió a ser líder del gobierno provisional checo y, pese a su avanzada edad, vuelve a esforzarse una vez más por la liberación de Chequia."
 ABY_czech_head_2_trait: "§YActivista de la resistencia§!\n	Modificador de población reclutable: §G+15%§!\n	Apoyo a la guerra: §G+10.00%§!\n\nEdvard Beneš nació el 28 de mayo de 1884 en Bohemia, dentro del Imperio austrohúngaro. Como discípulo de Tomáš Masaryk, se dedicó al movimiento de liberación nacional checo. Destacó en diplomacia y administración, ocupó varios cargos clave del gobierno y trabajó para elevar el prestigio internacional de Checoslovaquia. En 1935 asumió como segundo presidente. Tras la Gran Transferencia, Checoslovaquia colapsó y se estableció el gobierno provisional checo; después de la renuncia de Masaryk en 1937, Beneš se convirtió en el nuevo líder de los checos y, como sucesor de Masaryk, se dedica a la liberación de Chequia."
 ABY_german_head_1_trait: "§YArbitro de la democracia§!\n	Estabilidad semanal: §G+0.50%§!\n	Apoyo diario al fascismo: §R-0.10§!\n	Apoyo diario a la democracia: §G+0.10§!\n\nLudwig Czech nació el 14 de febrero de 1870 en Lwów. Abogado y político judío germanoparlante, heredó la tradición socialdemócrata del final del Imperio austrohúngaro y, tras la fundación de Checoslovaquia, se desempeñó desde 1929 como ministro en el área de bienestar social; posteriormente también ocupó cargos importantes en obras públicas, dedicándose a la defensa de los derechos e intereses de los checoslovacos de origen alemán. No obstante, después de la Gran Transferencia, como el funcionario alemán de mayor rango dentro del gobierno checoslovaco, se convirtió en portavoz de los alemanes de los Sudetes. Además, su salud empeora día con día debido a las secuelas del impacto de una bala durante la Gran Transferencia."
 ABY_german_head_2_trait: "§YNacionalista sudeto§!\n	Estabilidad: §G+15.00%§!\n	Ganancia de poder político: §R-10%§!\n	Población reclutable: §Y-0.50%§!\n	Apoyo diario al no alineamiento: §R-0.10§!\n\nKonrad Henlein nació el 24 de mayo de 1898 en una región de población alemana dentro del Imperio austrohúngaro. En su juventud emergió como figura principal del movimiento autonomista alemán dentro de Checoslovaquia. A inicios de la década de 1930, como líder del Partido Alemán de los Sudetes, trabajó activamente para fortalecer la organización y la unidad del partido, desempeñando un papel central en despertar la conciencia política de los sudetos. Después de la Gran Transferencia, de forma repentina pasó a recibir el apoyo de la mayoría de los alemanes sudetos, y dentro del gobierno de coalición se convirtió en una figura de influencia política solo por detrás de Masaryk. Tras la muerte de Czech, ascendió oficialmente como representante alemán, pero siente una enorme presión por la situación."
 ABY_abydos_head_trait: "§YEscudo de Abydos§!\n	Apoyo a la guerra: §G+10.00%§!\n	Ataque de las divisiones en territorio núcleo: §G+10.0%§!\n	Mod. de estabilidad por penalización de guerra defensiva: §G+20.00%§!\n\nTakanashi Hoshino, la única estudiante de 3.º año de la Preparatoria Abydos y pilar espiritual del Comité de Contramedidas, a primera vista parece solo una adorable holgazana a la que le encanta dormir. Viéndola actuar con tanta calma, se siente más como una linda kouhai que como una senpai imponente. Sin embargo, cuando su querida Preparatoria Abydos y sus kohai se ven en peligro, mostrará una fortaleza y rectitud tales que uno se pregunta a dónde se fue aquella suavidad y ternura. Aunque tiende a dejarse llevar por las emociones, su extraordinaria capacidad de combate hace que incluso esa temeridad quede disimulada, y será capaz de romper todo lo que se interponga en su camino y avanzar. Aun así, incluso ella a veces muestra un lado torpe y extraño. Si sus kohai le preguntan al respecto, evita responder.\n\n¿Qué secreto inconfesable guarda en su corazón?"

