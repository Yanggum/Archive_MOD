ABY_descision_focus_event.71.t:0 "El Escudo Rojo, una vez más"
ABY_descision_focus_event.71.d:0 "Bajo la luz de una vela en una oficina provisional y estrecha, observo un viejo mapa de Europa. Viena, París, Londres, Fráncfort… todos los lugares donde brillaba el nombre de mi familia ahora se han convertido en territorio de academias desconocidas, o en cenizas. La gente susurra que los Rothschild se acabaron. Que, como refugiado judío, ¿qué podría hacer? Algunos me compadecen; otros se burlan. No lo entienden: nuestro verdadero poder no está en el oro de las bóvedas, sino en el nombre mismo, 'Rothschild'. Y todavía me queda la acería de Vítkovice. El único corazón que sigue latiendo en esta tierra caótica.\n\nEsas chicas con halos extraños, los checos que perdieron su hogar, los alemanes llenos de odio… esta alianza inestable es una apuesta peligrosa, pero también la única oportunidad. Bien. Empezaré de nuevo desde esta pequeña chispa. Les aportaré capital, crearé crédito y reconectaré las venas de la economía derrumbada por la guerra. Me necesitarán.\n\nEl Escudo Rojo jamás se rompe. Aquí, en Bohemia, sacudiré Europa una vez más."
ABY_descision_focus_event.71.a:0 "Esa gloria, una vez más."
ABY_descision_focus_event.71.b:0 ""

ABY_descision_focus_event.72.t:0 "La heredera de manos vacías"
ABY_descision_focus_event.72.d:0 "De pie junto a la ventana de una pequeña oficina en Ústí nad Labem, abrí y cerré la palma de mi mano. Vacía. Así es Nephthys ahora. El enorme edificio de la sede en Kivotos, las fábricas interminables, las sucursales en cada distrito autónomo… todo eso pertenece a un mundo al que ya no puedo alcanzar. Lo único que cayó en Europa fue el nombre ‘Nephthys’, yo, y unas decenas de empleados.\n\nLa gente deposita sus expectativas en mí, pero el inmenso poder financiero que imaginan no es más que un espejismo. Si supieran la verdad, ¿se decepcionarían? Pero… Sensei me lo dijo. Que, porque tengo las manos vacías, puedo llenarlas de nuevo con cualquier cosa.\n\nSí, es cierto. Ya no tengo por qué estar aplastada por el peso del pasado. No hay capital, ni fábricas, ni red de distribución… nada. Pero tengo a mis amigos de Abydos, y este extraño gobierno de coalición.\n\nEmpieza desde aquí. Como construir desde suelo desnudo, ladrillo por ladrillo. No una Nephthys que reina con dinero como antes, sino una nueva Nephthys que ayude a todos con crédito y cooperación. Eso es lo que debo hacer en esta tierra caótica.\n\nCon estas manos vacías, crearé el mañana de todos."
ABY_descision_focus_event.72.a:0 "Por él, debo seguir el estandarte de la Federación."
ABY_descision_focus_event.72.b:0 "Por él, debo mantener la identidad como empresa."

ABY_descision_focus_event.73.t:0 "El corazón de acero no se apaga"
ABY_descision_focus_event.73.d:0 "Un taller provisional aturdido por golpes de martillo y chispas de soldadura. La enorme planta de Plzeň ahora pertenece a esos de Hyakkiyako, pero la gente olvida algo importante: el alma de Škoda no está en los ladrillos de la fábrica, sino en la cabeza y las manos de nuestros técnicos.\n\nReparando los viejos fusiles de la milicia de Henlein y montando nuevos motores en los blindados del ejército checo, volvimos a empezar. Lo perdimos todo: activos e instalaciones. Pero aún tenemos los 'planos'.\n\nAl final, el ejército de este gobierno provisional solo podrá apoyarse en el acero que nosotros forjemos. El poder de esas chicas con halo es asombroso, pero la guerra termina decidiéndose por logística y tecnología.\n\nEl profesor Masaryk confió en nosotros, y le devolveremos esa confianza. En este pequeño taller, crearemos un nuevo corazón para las fuerzas aliadas: cañones más potentes, blindajes más resistentes, motores más rápidos.\n\nŠkoda no es una simple empresa. Es la fuerza motriz de este país, y la lanza que perforará el corazón del enemigo. Ya verán: nuestra tecnología será el cimiento de esta nación extraña."
ABY_descision_focus_event.73.a:0 "Reconstruyamos la tradición."
ABY_descision_focus_event.73.b:0 ""

