 ABY_idea_eocordnldnjsghl_first_improved:0 "Comité de Contramedidas"
 ABY_idea_eocordnldnjsghl_first_improved_desc:0 "El Comité de Contramedidas para evitar el cierre de Abydos fue un club creado para impedir que la Preparatoria Abydos fuera clausurada.\nPero ahora, tras un fenómeno desconocido, el Comité ha cargado con una pesada misión: proteger no solo a la Preparatoria Abydos, sino también a los distritos urbanos cercanos e incluso a los habitantes locales.\nLas nuevas contramedidas que deberán forjar nunca serán sencillas.\n\n§YComité de Contramedidas§!\n§P- Takanashi Hoshino §!\n§4- Sunaookami Shiroko §!\n§7- Izayoi Nonomi §!\n§1- Kuromi Serika §!\n§t- Okusora Ayane §!"
