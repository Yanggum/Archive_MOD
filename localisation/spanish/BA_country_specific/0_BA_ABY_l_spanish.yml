 landmark_destroyed_ABY_homeschool: "Una enorme duna de arena"
 landmark_destroyed_ABY_homeschool_desc: "Una gigantesca montaña de arena de 1 km sobre el nivel del mar que apareció de la nada en el noroeste de Győr junto con la Gran Traslación. El gobierno húngaro intentó retirarla en múltiples ocasiones, pero fracasó todas las veces debido a la incesante afluencia de arena. Sin embargo, al hallarse dentro de la arena el misterioso mineral ‘Cheonghwiseok’ y fragmentos de tecnología avanzada de origen desconocido, esta peligrosa montaña empezó a considerarse no como un simple desastre natural, sino como un tesoro de lo desconocido. Los secretos que guarda siguen dormidos en lo profundo de la arena."

 landmark_ABY_homeschool: "Edificio principal de Abydos"
 landmark_ABY_homeschool_desc: "El legendario ‘Edificio principal de la Preparatoria Abydos’, que por fin reveló su imponencia tras retirar la montaña de arena de 1 km que cubría Győr. Tras un largo proceso de restauración, esta colosal estructura fue reconstruida a la perfección. Es el origen y pilar espiritual de la Federación de Abydos y un abrumador monumento visible desde cualquier punto de la ciudad de Győr. Para los habitantes de Abydos que recuperaron su hogar perdido, es un santuario del alma; para los ciudadanos de la Federación, es una construcción conmemorativa que simboliza una voluntad indomable que venció al desierto."

 ABY_build_homeschool_landmark_tt: "Reemplaza §Y$landmark_destroyed_ABY_homeschool$§! por §Y$landmark_ABY_homeschool$§!."

 #Apertura de Abydos#
 ABY_country_intro_header: "§YZafiro que perdió su luz§!"
 ABY_country_intro_header_1: "§YLa banda enmascarada de trajes de baño§!"
 ABY_country_intro_header_2: "§YChecoslovaquia§!"
 ABY_country_intro_header_3: "§YMi hogar, los Sudetes§!"
 ABY_country_intro_header_4: "§YEl nudo gordiano§!"
 ABY_country_intro_header_5: "§YLa nación de dos mundos§!"

 ABY_country_intro_content: "¿Con qué podríamos comparar a la Preparatoria Abydos?\nQuizá lo más apropiado sea un zafiro que ya no brilla. En el pasado, cuando setenta presidentes del consejo estudiantil proliferaban en Abydos y se desataba una guerra civil, el reinado de la presidenta Shemata —quien protegió el orden, unificó Abydos y, más aún, puso a todo Kivotos bajo sus pies, aterrorizándolo— hoy no es más que una leyenda. Todo lo que él/ella construyó en Abydos quedó sepultado bajo la arena, sin dejar rastro.\n\nEn medio de una situación desesperada, la Gran Traslación agravó aún más el caos.\n\nEl 1 de noviembre de 1935, la Preparatoria Abydos se trasladó a Horn, al norte del Danubio en Austria. Para evitar un conflicto armado, cooperó con austríacos y checos, esforzándose por estabilizar la región. Pero pocos días después, Shanhaijing, que había sometido Austria, lo percibió como una amenaza e invadió Abydos; y enseguida Hyakkiyako también se sumó al ataque.\n\nMientras se libraba una feroz batalla por el edificio principal, Serika, que salió a asegurar suministros, fue detenida por SKEBAN. Los cuatro restantes abandonaron el edificio principal y partieron de Linz para rescatar a su compañera."

 ABY_country_intro_content_1: "Para ocultar su identidad, las estudiantes de Abydos se pusieron máscaras y asaltaron una base de SKEBAN en Znojmo. Sin embargo, los documentos hallados allí revelaron que Hyakkiyako ya había subyugado a SKEBAN y había trasladado a los prisioneros retenidos a otro lugar.\n\nPor un lapsus de Nonomi —ya fuera por error o adrede—, ellas recibieron el apodo de ‘la banda enmascarada de trajes de baño’. Pero, pese a lo gracioso del nombre, su poder de combate era abrumador.\n\nLas cuatro derrotaron sucesivamente a las fuerzas de Hyakkiyako y, apareciendo y desapareciendo como fantasmas, registraron toda la ciudad. Atacaron Brno y Tábor para seguir la pista de Serika y, al final, obtuvieron una pista: había sido trasladada a Hyakkiyako (Praga).\n\nSin perder tiempo, las cuatro partieron hacia Praga, y ese viaje se convirtió en el acontecimiento que sembró la semilla de un gobierno provisional de coalición."

 ABY_country_intro_content_2: "Al irrumpir en Praga, las estudiantes de Abydos derrumbaron las líneas defensivas con precisión y rescataron a Serika. En el proceso, encontraron a figuras gubernamentales checoslovacas que estaban detenidas.\n\nAbydos se alió con ellos y formó un gobierno provisional checo–Abydos. Con la ayuda de Edvard Beneš —quien, aun encarcelado, había aprendido el idioma de Kivotos al relacionarse con los guardias e identificó la ubicación de unidades checas aisladas—, tras escapar de Praga rescataron sucesivamente tropas checas aisladas en Kladno, Mělník y Jičín, aumentando sus fuerzas.\n\nAunque en Mladá Boleslav no pudieron hacer más que rendir homenaje a un destacamento ya aniquilado, no había tiempo para detenerse.\n\nEl gobierno provisional avanzó al norte y contactó con el Grupo Neftis, trasladado a Liberec, formando una alianza para asegurar apoyo de material y fondos.\nAdemás, Asagiri Sou, un comandante competente del Grupo Neftis, se unió también, convirtiéndose en una gran ayuda para futuras batallas."

 ABY_country_intro_content_3: "El gobierno provisional se desplazó al oeste y contactó con la milicia del Partido Alemán de los Sudetes, que estaba bajo la presión de Hyakkiyako.\n\nBajo el mando de Konrad Henlein y Karl Hermann Frank, defendían su hogar, y aceptaron la propuesta de Abydos y los líderes checos, sellando una alianza.\n\nCon tres fuerzas unidas, el gobierno provisional de coalición reorganizó la línea defensiva de los Sudetes y, poco después, lanzó una ofensiva total hacia Egerland, un punto estratégico clave del noroeste.\n\nTras una batalla encarnizada, recuperaron Egerland y consolidaron la defensa, frenando el avance hacia el norte de Hyakkiyako.\n\nA partir de ese momento, la coalición se convirtió, en los hechos, en un destino compartido: los intereses de cada fuerza empezaron por fin a encajar dentro de un mismo marco."

 ABY_country_intro_content_4: "En Karlovy Vary, la mayor ciudad del norte de los Sudetes, el gobierno provisional de coalición consolidó su base de manera formal.\n\nLas fuerzas aliadas repelieron con éxito una gran ofensiva de Hyakkiyako que intentaba romper la línea defensiva, y esa victoria dio pie al inicio de negociaciones de armisticio el 25 de diciembre, durante la tregua navideña.\n\nPolíticos, generales y representantes de Kivotos se reunieron para negociar, y el 31 de diciembre finalmente se firmó el acuerdo de alto el fuego.\n\nEl Gobierno Provisional de Abydos: un Estado aliado formado por fuerzas de Kivotos, checas y alemanas. Aún se mantiene en pie. Pero… ¿podrá perdurar esta extraña coalición incluso después de que cada uno cumpla sus objetivos?\n¿Serán capaces de desatar los complejos problemas de ideología y nación que los enredan?\n\nSolo el tiempo lo sabe.\n\n¿Se revelará la manera de desatar el nudo gordiano? ¿O, como en los viejos relatos, acabará por cortarse?\n"
 ABY_country_intro_content_5: "Las tres fuerzas de la nación de dos mundos acordaron cooperar para liberar Checoslovaquia, los Sudetes y Linz.\n\nAl verlo, desde fuera llaman a Abydos, unas veces con respeto y otras con desprecio, ‘la nación de dos mundos’.\n\nEse apodo, los pueblos que lo conforman, e incluso sus ideas… todo es diverso en esta ‘nación de dos mundos’. ¿Podrá conservar ese nombre hasta el final?\n\nLas llamas de la guerra se han calmado por un momento, pero sus brasas siguen ardiendo en toda Europa.\n\nEl futuro aún está cubierto de niebla, y si su alianza resistirá hasta el final… esa respuesta solo se revelará en un lejano mañana.\n\n\n§CDesarrollo- Koi, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_guide: "§YObjetivos§!\n\n£white_dot §4Establece un gobierno provisional de coalición y elabora una operación para recuperar Bohemia, los Sudetes y Linz.§!\n£white_dot §4Con la ayuda del Sensei, ayuda a las estudiantes de Abydos a superar sus defectos y traumas.§!\n£white_dot §4Recibe la bienvenida de los austríacos y atiende sus exigencias.§!\n£white_dot §4Recupera Austria y establece un gobierno federal.§!\n\n    £white_dot §CDetén la conspiración del Consejo de la Ilustración y establece un gobierno democrático estable para reconstruir el legado de Masaryk.§!\n        £white_dot §YEncuentra una forma de coexistencia entre los dos mundos.§!\n            £white_dot §gReconstruye Checoslovaquia y la Pequeña Entente.§!\n            £white_dot §gDefiende la patria frente a las invasiones enemigas y establece allí un gobierno democrático.§!\n            £white_dot §gPresenta un camino hacia una Europa recién unificada.§!\n        o bien...\n        £white_dot §YEncuentra una forma de unificar los dos mundos.§!\n            £white_dot §gEstablece una república federal y renuncia a la hegemonía de Abydos por la gran causa.§!\n            £white_dot §gDefiende la patria frente a las invasiones enemigas y establece allí otra república bicultural.§!\n            £white_dot §gConvoca una conferencia para la unificación euro–Kivotos y continúa avanzando.§!\n\n    £white_dot §tBusca una forma de proteger la Federación de un golpe de Estado.§!\n        £white_dot §YNegocea con ellos y garantiza la seguridad del Comité de Contramedidas.§!\n            £white_dot §gSal a las calles con flores y canta para recuperar la libertad perdida.§!\n            £white_dot §gNo retrocedas ante los fusiles. Apela a los soldados.§!\n            £white_dot §gPor la libertad, utiliza todos los medios salvo la violencia.§!\n        o bien...\n        £white_dot §YRechaza negociar con los golpistas.§!\n            £white_dot §gEscóndete en la clandestinidad para evitar la represión política del mando militar.§!\n            £white_dot §gReúne partidos en torno al Partido de Unidad Federal y crea un Frente Popular.§!\n            £white_dot §gLevántate con apoyo de la URSS y derrota al régimen fascista.§!\n                £white_dot §gComo punta de lanza de la Unión Soviética, alza la espada contra Kivotos.§!\n                £white_dot §gPurga y reprime a la oposición para consolidar una dictadura personal.§!\n                £white_dot §gReprime la gran protesta surgida en Praga.§!\n            o bien...\n            £white_dot §gLevántate con nuestras propias fuerzas y restaura la democracia que se nos concedió.§!\n                £white_dot §gImpide que el Frente Popular se desintegre y construye la solidaridad.§!\n                £white_dot §gPublica una condena contra el extremismo y detén la invasión de ambos mundos.§!\n                £white_dot §gSienta las bases de la socialdemocracia y avanza hacia la reforma.§!\n\n    £white_dot §0Derriba el gobierno federal mediante un golpe y aniquila a la oposición.§!\n        £white_dot §YPor venganza de los veteranos, abandona todo y avanza.§!\n        o bien...\n        £white_dot §YFinge ante el mundo para destruir todo lo de Abydos.§!\n            £white_dot §gProclámate líder y salvador, y concentra todo el poder.§!\n            £white_dot §g‘Purifica’ a los locales, rebajándolos por debajo de los kivotosianos, y asegura el espacio vital.§!\n            £white_dot §gDestruye la cultura anticuada de Kivotos y sustitúyela por una cultura ‘ilustrada’.§!\n            £white_dot §gAl final, destruye Asia Oriental y América, y convierte este planeta en el nuevo hogar de los kivotosianos.§!\n            £white_dot §R...y recuerda qué era lo que en verdad querías hacer.§!\n\n§YCómo entrar a rutas§!\n\nHasta antes de la Operación ‘Pétalos Caídos’, aparecen 12 eventos de ética; a través de sus opciones se forma la ética federal.\n\nInclusivismo <-> Pluralismo\nIgualitarismo <-> Autoritarismo\nIndividualismo <-> Colectivismo\nNacionalismo\n\nSe divide en 3 éticas opuestas y 1 ética independiente.\nEn las éticas opuestas, se considera elegida la que sea más fuerte.\nLa ética de nacionalismo, si es fanática, ignora las demás; si no es fanática, se ignora para la decisión de ruta.\nAl completar el enfoque ‘La noche más larga de la Federación’, los enfoques políticos posteriores se determinan según la ética federal que poseas.\n\nLocal- Inclusivismo / Igualitarismo / Colectivismo\nAyane- Pluralismo / Autoritarismo / Colectivismo\nHoshino- Pluralismo / Igualitarismo / Colectivismo\nSerika (Sur de Kivotos)- Inclusivismo / Igualitarismo / Individualismo\nSerika (Abydos)- Inclusivismo / Autoritarismo / Colectivismo\nShiroko (Democracia)- Pluralismo / Igualitarismo / Individualismo\nShiroko (Dictadura)- Pluralismo / Autoritarismo / Individualismo\nNonomi- Inclusivismo / Autoritarismo / Individualismo\nSou- Nacionalismo\n\n\n§CDesarrollo- Koi, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_GATHERING_STORM_DESC:0 "La Preparatoria Abydos fue, en el pasado, la academia más grande y rica de Kivotos, pero la desertificación cada vez más grave y una deuda que no dejaba de crecer llevaron a su caída. Las cinco estudiantes que quedaron en Abydos luchaban desesperadamente para proteger su escuela.\n\nTras la Gran Traslación, la situación entró en una nueva fase. La deuda que las ataba desapareció; el pequeño distrito autónomo, al contrario, ayudó mucho a contener los choques entre residentes y locales; y pudieron obtener la cooperación de la población local.\nPero, en cambio, los conflictos entre los propios locales de esta región se han convertido en un problema.\nSerá urgente resolverlo."

