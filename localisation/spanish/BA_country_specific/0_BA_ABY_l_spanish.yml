 ABY_idea_katakata:0 "Pandilla de cascos Katakata"
 ABY_idea_katakata_desc:0 "No somos los únicos que hemos sido trasladados aquí. La pandilla de cascos Katakata, que solía acosarnos, también está en este lugar. Se han desplegado patrullas vecinales a gran escala para contenerlos, pero los asaltos y tomas de fábricas siguen ocurriendo con frecuencia.\nDebemos decidir qué hacer con ellos cuanto antes."
