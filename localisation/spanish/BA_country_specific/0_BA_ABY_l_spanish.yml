ABY_descision_focus_event.64.t:0 "La hoja en las sombras"
ABY_descision_focus_event.64.d:0 "La noche de Karlovy Vary era profunda, y las cortinas de la sala de reuniones en la residencia provisional de Ayane estaban firmemente cerradas para bloquear las miradas del exterior. Sobre el escritorio, una grabadora con cinta de carrete girando y varias fotografías borrosas en blanco y negro yacían esparcidas en desorden. Frente a Ayane estaban sentadas Serika, con el rostro tenso; Shiroko, con la expresión endurecida; y Hoshino y Nonomi, que habían borrado su habitual desgana.\n\n\"Lo que acaban de escuchar son registros de escuchas obtenidos de la red de inteligencia interna del ejército, 'Vigilante'.\"\n\nLa voz de Ayane era serena, pero el final caía con un peso sombrío. En las fotos se veía a Asagiri Suou reuniéndose en secreto con hombres en uniforme y con directivos de Nephthys de mirada codiciosa.\n\n\"¿La mayor Suou… de verdad ella?\" preguntó Serika, como si no pudiera creerlo.\n\n\"Es seguro.\" Shiroko respondió corto, levantando una de las fotos. \"Los movimientos de tropas son raros. Con el pretexto de maniobras, la 3.ª División Acorazada fue reubicada en puntos clave a las afueras de la capital. Es una formación de ataque evidente.\"\n\nCon los brazos cruzados, Hoshino murmuró en voz baja. \"Aprovecharán que Beneš se retiró y el panorama político está revuelto. Reunieron a los descontentos con que nosotros, 'forasteros', tomáramos el poder. Con el dinero de Nephthys, la fuerza de los remanentes nazis y su mando…\"\n\n\"No es una simple queja.\" Ayane habló con firmeza. \"Esto es una conspiración clara para derrocar al Estado. La mayor Suou planea, al amanecer de mañana, ocupar el parlamento y la residencia bajo el pretexto de una 'decisión para salvar a la nación'. Debemos adelantarnos. Esto no es una pelea política: es un asunto de supervivencia.\"\n\nLa mirada de Ayane ya no era la de una estudiante. Era la determinación de una líder responsable de un país."
ABY_descision_focus_event.64.a:0 "Suou actuará. Prepárense bien."
ABY_descision_focus_event.64.b:0 ""

ABY_descision_focus_event.65.t:0 "Líneas paralelas que no se tocan"
ABY_descision_focus_event.65.d:0 "Sala de interrogatorios del búnker subterráneo del Comando de Defensa de la Capital. Bajo la luz pálida de los fluorescentes, Asagiri Suou estaba sentada con las esposas puestas. Su uniforme se había desordenado durante la captura y las insignias habían sido arrancadas, pero su actitud seguía siendo arrogante, como si fuera la vencedora.\n\nCuando Ayane y los miembros del Comité de Contramedidas entraron desde el otro lado del cristal, Suou los recorrió con una sonrisa torcida.\n\n\"Felicidades, presidenta. ¿O ahora debo decir primera ministra? Para la inteligencia de ustedes, de juguete, lo hicieron bastante bien.\"\n\n\"Quiero preguntarle algo, señora Suou.\" Ayane cuestionó con frialdad. \"¿Por qué? Protegimos este país juntas. ¿Por qué apuntó su arma contra sus compañeras?\"\nSuou soltó una risa despectiva. En esa risa había un desprecio profundo.\n\n\"¿Compañeras? Ja… no te equivoques. Su actitud tibia y débil está enfermando a este país. Derrocaron a Beneš y tomaron el poder, ¿y qué hicieron? ¿Reconciliación? ¿Convivencia? Con ese idealismo de jardín de flores no se puede detener la enorme guerra que se acerca. Yo intenté volver a este país tan duro como el acero. ¡Aunque hubiera que ver sangre, un Estado fuerte que pudiera sobrevivir!\"\nClavó su mirada helada en Ayane.\n\n\"Pero… ¿de qué serviría decírtelo? Ustedes jamás lo entenderán. Son unas crías estúpidas que no saben qué es la guerra ni qué es un Estado.\"\nComo si ya no valiera la pena hablar, se recostó y cerró los ojos. No era la resignación de una derrotada; era un desprecio venenoso hacia seres a los que consideraba incapaces de entender.\n\nAyane se mordió el labio y se dio la vuelta."
ABY_descision_focus_event.65.a:0 "\"Asagiri Suou. La remito a un tribunal militar por conspiración de sedición y traición.\""

ABY_descision_focus_event.66.t:0 "El banquete de los cocodrilos"
ABY_descision_focus_event.66.d:0 "Una mansión lujosa en las afueras de Praga. Bajo la luz de un candelabro deslumbrante, los directivos de la facción dura del Grupo Nephthys se sentaban frente a Asagiri Suou. El aire estaba espeso por el humo de los puros, una tensión extraña y la codicia.\n\n\"Los fondos ya están listos, mayor. Nephthys tiene grandes expectativas puestas en esta 'gran operación'.\"\n\nLo dijo un director obeso, con una sonrisa grasienta.\n\n\"Durante todo este tiempo, bajo el nombre de Abydos, Nephthys se ha visto demasiado limitada. El método de la señorita Nonomi… fue demasiado ingenuo. Las empresas deben perseguir ganancias y poder. Si esto sale bien, el monopolio de los contratos gubernamentales y el suministro de material militar… nos lo garantizará, ¿verdad?\"\n\nSuou giró lentamente su copa de vino mientras los observaba. En sus ojos había desprecio hacia ellos, pero en sus labios se dibujaba una sonrisa tranquila.\n\n\"Por supuesto. Para reconstruir una nación se necesita la fuerza de personas ambiciosas como ustedes. Lo que yo quiero es un país fuerte, y un país fuerte nace del dinero, ¿no es así?\"\n\n\"¡Oh, oh! ¡Como era de esperar, general, usted sí entiende!\"\n\nLos directivos estallaron en risas satisfechas e intercambiaron miradas. En sus ojos brillaba el cálculo de usar a Suou como un espantapájaros para manejar el poder a su antojo.\n\nSuou también bebió un sorbo y se burló por dentro.\n\n'Viejos necios. Cuando esto triunfe, les abriré esos vientres codiciosos y llenarás el tesoro nacional.'\n\nSonó el tintineo cristalino de las copas. Cada uno con planes de usar al otro y destruirlo,"
ABY_descision_focus_event.66.a:0 "Los cocodrilos sonrieron y disfrutaron del banquete."

ABY_descision_focus_event.67.t:0 "La tentación del acero"
ABY_descision_focus_event.67.d:0 "La capital provisional, Praga, ardía. Las fuerzas golpistas de Suou avanzaban con ímpetu arrollador, pero la resistencia desesperada del Comando de Defensa de la Capital, dirigido por Shiroko, les impedía cruzar el río Moldava. Ya era el tercer día de un tenso enfrentamiento, separados por un solo puente.\n\nUna delegación de negociación del bando golpista llegó al puesto de mando de Shiroko con bandera blanca. Un oficial, impecablemente uniformado, saludó con respeto ante ella.\n\n\"Comandante Sunaookami. Más derramamiento de sangre inútil es una pérdida para la nación. El general Suou valora mucho su capacidad.\"\n\nShiroko apartó la vista del mapa que observaba con el rostro cubierto de tierra y lo fulminó. \"No habrá rendición.\"\n\n\"Escúcheme. Esta es la última oferta.\" El oficial sacó un sobre de documentos del pecho y lo colocó sobre la mesa. \"Si detiene la resistencia y se entrega ahora, solo restringiremos su libertad a usted, comandante. La seguridad del resto de los miembros del Comité de Contramedidas, incluida la primera ministra Ayane, quedará totalmente garantizada.\"\n\nLas cejas de Shiroko se movieron.\n\n\"Ni siquiera necesitan exiliarse. Bajo el nuevo gobierno, podrán vivir libremente como ciudadanos comunes. Ir a la escuela, trabajar, disfrutar de una vida normal… ¿no era esa la vida que realmente querían?\"\n\nLas palabras del oficial golpearon el punto más débil de Shiroko.\n\n\"Pero si continúa resistiendo… en la próxima ofensiva se empleará artillería pesada. Entonces no solo usted, sino también sus amigos, a quienes intentaba proteger, quedarán reducidos a cenizas.\"\n\nDentro del puesto de mando solo quedó un silencio pesado. Shiroko apretó con mano temblorosa la culata del fusil.\n\nSi solo yo cedo, todos estarán a salvo. Ya no habrá más sangre. Pero… ¿es lo correcto? ¿Puedo confiar en Suou?\n\nSu mirada se fue hacia la Praga en llamas tras la ventana y hacia los ayudantes exhaustos, dormidos desplomados. Sus labios se movieron, pero la orden no salió."
ABY_descision_focus_event.67.a:0 "Sí. Ustedes ya traicionaron mi confianza."
ABY_descision_focus_event.67.b:0 "...Esa condición, tienes que cumplirla."

ABY_descision_focus_event.68.t:0 "El dilema del vencedor"
ABY_descision_focus_event.68.d:0 "Balcón del Castillo de Praga. Suou miró hacia abajo. En las calles ondeaba su bandera, y los ciudadanos guardaban silencio frente a los cañones. El golpe había triunfado. El gobierno de Ayane cayó, y el ejército quedó en la palma de su mano.\n\n\"Excelencia.\" Su ayudante se acercó y preguntó con cautela. \"Felicidades. Por favor, dé su siguiente orden. Los miembros del Comité de Contramedidas bajo arresto domiciliario… y también hay agendada una reunión con los directivos de Nephthys que exigen participaciones.\"\n\nSuou, en lugar de responder, encendió un cigarrillo. El humo se deshizo en el aire. Más que euforia, su mente estaba dominada por un cálculo frío.\n\n'¿A quién conviene golpear primero?' \n\nEntrecerró los ojos y meditó.\n\nPrimera opción: el Comité de Contramedidas. Ellos son el símbolo de Abydos. Si los deja vivir, en cualquier momento podrían convertirse en un núcleo de resistencia. Pero si los ejecuta… la ira popular estallará, y los residentes de origen Kivotos se alzarán como una turba.\n\nSegunda opción: el consejo de Nephthys y los remanentes nazis. Son hienas codiciosas. Ya ganaron, y ahora querrán manosear el Estado y repartirse los beneficios. Si los purga con el pretexto de \"limpiar a las corporaciones corruptas y a las fuerzas extranjeras\", obtendrá el apoyo entusiasta de las masas. Pero si pierde de golpe su dinero y su fuerza armada… ¿podrá sostener este régimen inestable?\n\nSuou golpeó la baranda: toc, toc.\n\nLa revolución idealista terminó, y ahora la esperaba la política real, empapada en olor a sangre. Tenía el mango de la espada, pero aún no decidía hacia dónde apuntar primero la hoja."
ABY_descision_focus_event.68.a:0 "El Comité de Contramedidas es un riesgo"
ABY_descision_focus_event.68.b:0 "Hay un problema más urgente que ellos"

