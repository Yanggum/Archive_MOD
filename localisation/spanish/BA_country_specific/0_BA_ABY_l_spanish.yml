 ABY_idea_czech_comming:0 "Exilio checo"
 ABY_idea_czech_comming_desc:0 "Desde lo que ellos llaman “Bohemia”, el antiguo corazón de Chequia, está llegando una oleada masiva de exiliados checos.\nArden de determinación y sed de venganza, y han decidido cooperar con nosotros."
 ABY_idea_no_people:0 "Escasez de personal administrativo"
 ABY_idea_no_people_desc:0 "Un sistema estatal no funciona solo con el jefe de Estado y sus ministros. De hecho, podría decirse que el personal operativo por debajo es aún más importante, pero ahora mismo carecemos de ese personal.\n\n§YSi recuperamos el control del Gobierno Provisional, podremos mejorar la situación.§!"
