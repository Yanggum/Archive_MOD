 ABY_descision_category_focus:0 "Triunvirato"
 ABY_descision_category_masaryk:0 "La última llama"
 ABY_descision_category_masaryk_desc:0 "Tomáš Garrigue Masaryk,\nPresidente liberador, rey de hierro, padre de Bohemia, el Sensei de Abydos, y muchos otros títulos. En diciembre de 1935 pensaba renunciar a la presidencia, pero la Gran Transferencia y otras circunstancias se superpusieron, y no fue sino hasta enero de 1937 que por fin pudo apartarse de aquella inmensa autoridad que venía ejerciendo desde 1918.\n\nPero aunque la autoridad desaparezca, el peso de la responsabilidad no se esfuma. Se retiró del cargo público, pero sigue siendo una figura política poderosa, y serán sus sucesores quienes guíen este país.\n\nÉl lo sabe.\nQue no le queda demasiado tiempo.\n\nUn hombre respetado tanto por checos como por alemanes de Bohemia, al que llamaron el \"Padre de Bohemia\";\nun hombre respetado incluso por los de Kivotos y los de Abydos, al que llaman el \"Sensei de Abydos\".\n\n¡Dependiendo de cómo Masaryk emplee el tiempo final que le fue concedido, el destino de este país, e incluso el de ambos mundos, quedará decidido!"
 ABY_descision_category_two_world:0 "País de dos mundos"
 ABY_descision_category_two_world_desc:0 "País de dos mundos.\nDesde el exterior, a Abydos se le llama \"país de dos mundos\": a veces con reverencia, a veces con desprecio.\n\nQuienes lo reverencian lo llamarán una flor de armonía y esperanza que floreció en medio del odio y el caos;\nquienes lo desprecian lo reducirán, con cinismo, a un ideal imposible.\n\nNaturalmente, la realidad probablemente se parezca más a lo que creen estos últimos. Los locales ya arrastraban conflictos entre etnias, y los de Kivotos también arrastraban conflictos entre academias; sería un cuento de fantasía que dos razas tan distintas pudieran convivir sin fricciones.\n\nPero si los choques entre ambas razas pueden rebajarse al nivel de conflictos étnicos o de academias, con eso bastará.\n\nLa \"flor más hermosa del mundo\" que atrae todas las miradas no podemos hacerla florecer… y quizá ni siquiera exista.\n\nPero una \"orquídea sencilla que florece en el yermo\"… esa sí podríamos hacerla florecer, y también podría atraer la atención de todos.\n\nY eso es lo que queremos, lo que debemos aspirar a lograr."
