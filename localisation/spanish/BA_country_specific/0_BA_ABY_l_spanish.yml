ABY_descision_focus_event.75.t:0 "Espero (Esperanza)"
ABY_descision_focus_event.75.d:0 "Jan Filip, escritor que pertenecía a la filial checa del esperanto, sonrió levemente mientras observaba, aquí y allá, a locales y a gente de Kivotos aprendiendo esperanto. Jamás habría imaginado verlo. El esperanto, creado y presentado por el doctor Zamenhof, había acabado reduciéndose a algo infinitamente pequeño frente a la inmensidad del inglés y el francés… o eso creían.\n\n\"Saluton, mia amiko. (Hola, amigo.)\"\n\nMiloš Lukas, uno de sus compañeros de la asociación, lo miró y sonrió mientras respondía en esperanto. Aunque fuera en pequeña escala, la escena que el profesor Zamenhof había soñado se estaba desplegando.\n\nGente de Kivotos, alemanes y checos, sin distinción, aprendiendo esperanto para poder interactuar entre sí… y además, culminando en éxito. Ni siquiera ellos lo habrían previsto.\n\n\"Dime, Miloš… ¿no crees que estos de Kivotos quizá nos trajeron una oportunidad?\"\n\n\"¿Esperanza, eh?\"\n\nMiloš sonrió suavemente hacia él."
ABY_descision_focus_event.75.a:0 "\"Sí, esperanto (Esperanto). Por fin… por fin podemos cantar ese nombre.\""

ABY_descision_focus_event.76.t:0 "Recuperación de Bohemia"
ABY_descision_focus_event.76.d:0 ""
ABY_descision_focus_event.76.a:0 "Levantar la movilización total."

ABY_descision_focus_event.77.t:0 "El guía ante la encrucijada"
ABY_descision_focus_event.77.d:0 "Había pasado una semana desde que el golpe de Suou fue sofocado y los disparos se apagaron en las calles de Praga. Los edificios derruidos se reparaban, y los ciudadanos volvían a su rutina, pero en el despacho del máximo administrador el aire seguía pesado como el plomo.\n\nAyane alternaba la mirada entre dos informes gruesos sobre su escritorio. Unas ojeras profundas le marcaban el rostro. A su lado, Hoshino descansaba en el sofá, mirando al techo en silencio.\n\n\"Hay que decidirlo, senpai Hoshino. Ya no podemos aplazarlo.\"\n\nLa voz de Ayane era seca. Habían juzgado a Suou y defendido al gobierno democrático, pero eso no respondía a la pregunta de 'qué es lo que debemos proteger'.\n\n\"La primera opción es… la 'restauración'.\"\n\nAyane tomó el expediente de la izquierda.\n\n\"Heredar la legitimidad de la República de Checoslovaquia y de la República de Austria. Los dueños originales de estas tierras eran ellos. Nosotros regresamos, como prometimos, a la posición de 'quienes ayudan', y el nuevo líder sería elegido entre los locales. Es el camino con más legitimidad y menos polémica.\"\n\n\"Pero…\" Hoshino respondió en voz baja. \"Si hacemos eso, seremos 'invitados' para siempre. Y algún día podría estallar otra vez el conflicto entre 'dueños' e 'invitados'. Como con Beneš.\"\n\n\"Exacto.\"\n\nAyane apretó el expediente de la derecha. En la portada decía: [Plan de construcción de un nuevo Estado según la teoría de integración de dos mundos].\n\n\"Por eso nació esta 'teoría de los dos mundos'. No separar a locales y a gente de Kivotos, sino integrarlos por completo como 'ciudadanos federales' con una nueva identidad. No solo coexistencia: fusión. Si funciona, a largo plazo podría apagar la chispa del conflicto étnico desde la raíz. Es lo más cercano al verdadero ideal que soñaba el profesor Masaryk.\"\n\nPero la mano de Ayane temblaba. Mordiéndose el labio, habló con dolor.\n\"Pero, senpai… para seguir este camino… tendremos que ver sangre otra vez.\"\n\n\"……\"\n\n\"Tendremos que definir los nacionalismos checo, alemán, austriaco y de Kivotos como 'reliquias de otra era' y desmantelarlos a la fuerza. Reprimir a quienes rechacen nuestra identidad y someter por las armas a los radicales que se opongan a la integración para plantar este nuevo orden. No será lo mismo que lo que quería hacer Suou, pero al final… también caeremos en la contradicción de ejercer 'violencia por la paz'.\"\n\nAyane miró por la ventana. Sobre la ciudad que se reconstruía, dos futuros se superponían.\n\nEl camino del 'forastero honorable' que se retira respetando a los dueños del pasado.\n\nO el camino del 'pionero solitario' que, aunque quede cubierto de sangre, ata a la fuerza dos mundos para convertirlos en uno eterno.\n\n\"¿Cuál será la respuesta correcta, uhee…\" Hoshino sonrió con amargura mientras se incorporaba. \"Sea cual sea, yo comparto la responsabilidad. Ayane-chan, tú solo elige.\"\n\nAyane dejó escapar un suspiro profundo y levantó la pluma. Era hora de escribir la siguiente página de un libro de historia cuya tinta aún no se había secado."
ABY_descision_focus_event.77.a:0 "Los dueños de esta tierra"
ABY_descision_focus_event.77.b:0 "La tierra de dos mundos"

ABY_descision_focus_event.78.t:0 "La cuerda roja"
ABY_descision_focus_event.78.d:0 "En un callejón trasero de Praga, el aire de una casa segura subterránea, manchada de humedad, era pesado. Hoshino se hundía en un sofá viejo. Pese a la lucha de Shiroko, el empuje numérico de los golpistas era abrumador. Ayane, Serika, Nonomi, Shiroko… todas estaban encerradas en la prisión de Suou.\n\n\"Camarada… no, presidenta Hoshino. Se le ve mala cara.\"\n\nEl hombre sentado enfrente, Klement Gottwald, le habló fingiendo preocupación. Era el líder del 'Partido Comunista del Danubio', una facción minoritaria dentro de la Unión Socialista de Abydos. En condiciones normales, ni siquiera habría sido rival para Hoshino, pero desde que Abydos derrotó a los enemigos del Este, su influencia había crecido de forma extraña. Era un secreto a voces que detrás estaban los fondos y el apoyo masivo del Kremlin.\n\n\"Uhee~ Sí, mi aspecto es un desastre. Aun así, te agradezco que me hayas sacado de ahí, señor Gottwald.\"\n\n\"¿No somos camaradas? Moscú… no, nuestros militantes no podían quedarse de brazos cruzados viendo cómo la fascista Suou pisotea la democracia.\"\n\nGottwald deslizó un documento sobre la mesa: la declaración de formación del 'Frente Unido Antifascista'. Pero al leerlo, la mirada de Hoshino se afiló.\n\n\"Esto… dice que el mando militar y todas las decisiones del partido se delegan por completo al 'Comité del Danubio'. Básicamente me estás diciendo que me aparte y solo deje el letrero, ¿no?\"\n\n\"Es solo un procedimiento formal.\" Gottwald sonrió con picardía. \"Ahora lo que se necesita es el Kremlin… digo, un apoyo internacional fuerte y capacidad organizativa. Si usted acepta, le proporcionaremos el 'poder' para derrocar a Suou y rescatar de inmediato a sus valiosas compañeras.\"\n\nHoshino apretó el puño. La advertencia del Sensei Masaryk le resonó en los oídos.\n\n'No se puede confiar en los comunistas. Son marionetas del Kremlin.'\n\nLo sabía. Si tomaba esa mano, el partido que ella creó se convertiría en un partido satélite de la URSS, y el ideal de Abydos sería repintado de rojo. Era un pacto con el diablo.\n\nPero.\n\n\"¿De verdad… puedes salvar a nuestras chicas?\"\n\n\"Lo juro por mi vida.\"\n\nHoshino, con la mano temblorosa, tomó la pluma. Mientras sus kouhai estuvieran en esa prisión fría, no tenía opción. Aunque esa cuerda ardiera en rojo, tenía que agarrarla ahora."
ABY_descision_focus_event.78.a:0 "Atrapé la mano del diablo."

ABY_descision_focus_event.79.t:0 "El lobo liberado"
ABY_descision_focus_event.79.d:0 "En la oscuridad de un vehículo de traslado que traqueteaba, Shiroko miraba sus muñecas esposadas. Afuera se escuchaban sirenas anunciando la victoria del golpe. Ya estaba. Todo terminó. A cambio de su rendición, Ayane y las demás habían salvado la vida. Con eso bastaba, se repetía Shiroko. Aunque ella se convirtiera en un trofeo de Suou y acabara encerrada de por vida o ejecutada, la chispa de Abydos se había preservado.\n\nPero entonces…\n\n¡BANG-!\n\nUna explosión enorme sacudió el camión de traslado. Un frenazo chirriante, gritos y alaridos desde afuera.\n\n\"¡Es un ataque! ¡Todos a posiciones de combate!\"\n\n\"¡Deténganlos! ¡Esos locos… ugh!\"\n\nLos gritos desesperados de los soldados fueron ahogados por el rugido de una multitud. No era el grito de un ejército organizado. Eran voces crudas, de miles, decenas de miles, llenas de furia… y de esperanza.\n\n\"¡Devuélvanos a Shiroko!\"\n\n\"¡Liberen a la heroína de Abydos!\"\n\nLa puerta trasera fue arrancada con estruendo. Entre el sol cegador que se derramó adentro, aparecieron rostros de civiles con cócteles molotov, tubos de metal y viejas escopetas de caza. Eran ciudadanos de Praga. Sin temer a los blindados de Suou, habían embestido a mano limpia la caravana.\n\n\"¡Comandante! ¡Perdón por llegar tarde!\"\n\nUn joven con vendas ensangrentadas le cortó las esposas. Arrastrada afuera, Shiroko se quedó sin palabras ante lo que vio: una masa humana llenando la Plaza de Wenceslao. Coreaban su nombre mientras expulsaban a las fuerzas golpistas.\n\n\"¡¡Waaaah!! ¡¡Viva Shiroko!! ¡¡Viva la libre Abydos!!\"\n\nShiroko miró sus manos. Las manos atadas eran libres, y la ciudadanía la llamaba de nuevo al centro del campo de batalla. Ya no era una prisionera derrotada. Se había convertido en el núcleo mismo de una gran revolución."
ABY_descision_focus_event.79.a:0 "¿Qué… es esto...?"

ABY_descision_focus_event.80.t:0 "Entre sangre y terciopelo"
ABY_descision_focus_event.80.d:0 "En las escalinatas frente al Museo Nacional, recuperado por los ciudadanos, Shiroko estaba sentada sobre un camión usado como puesto de mando provisional, observando un mapa. Las fuerzas golpistas de Suou, presionadas por el ímpetu civil, se habían replegado temporalmente al oeste del Moldava. Pero se reorganizaban, y pronto intentarían una represión brutal con tanques al frente.\n\n\"¡Comandante, saqueamos el arsenal y armamos a los ciudadanos! Solo dé la orden. ¡Esta noche asaltamos la residencia y le arrancamos la cabeza a Suou!\"\n\nEl representante civil, alzado como líder de las milicias, gritó eufórico. Tras él, miles de ciudadanos, con molotovs y fusiles capturados, no apartaban la vista de la boca de Shiroko.\n\nShiroko accionó el cerrojo del fusil que le habían entregado, por pura costumbre.\n\n'Puedo pelear.'\n\nEl instinto del lobo susurraba. La guerra urbana era su especialidad. Si usaba a esta multitud como cebo y escudo, y ella dirigía una fuerza de choque para golpear el mando de Suou, había posibilidades. Era la solución más rápida y segura como soldado.\n\nPero…\n\nEn sus ojos entró la imagen de un niño pequeño sosteniendo un arma. Temblaba de miedo, fingiendo valentía. Si estallaba una guerra total, ese niño sería el primero en caer ante la ametralladora de Suou. Praga se convertiría en un mar de fuego, y aun ganando, el campo sería un montón de cadáveres.\n\n¿Eso era lo que quería proteger? ¿Un país en ruinas y ciudadanos muertos?\n\n'¿No hay otra forma?'\n\nBajó el arma y se quedó pensando.\n\nAbandonar las armas. No violencia.\n\nSonaba a locura: detener tanques con el cuerpo. Pero el ejército de Suou también estaba hecho de personas. Ellos también eran hijos y hermanos de alguien. Si llegaba la orden de disparar contra civiles desarmados y su conciencia vacilaba… si la facción neutral del ejército se pasaba a nuestro lado…\n\nEl único camino para ganar sin sangre; el más arriesgado, porque si fallaba terminaría en una masacre.\n\n\"¿Comandante?\"\n\nAnte la voz que la apuraba, Shiroko levantó la cabeza. Sus ojos dejaron de vacilar y se asentaron fríos. Apretó el fusil… y luego, muy despacio, lo dejó en el suelo.\n\nEl lobo tomó una decisión."
ABY_descision_focus_event.80.a:0 "Sí. No hay tiempo. Tenemos que ir ya."
ABY_descision_focus_event.80.b:0 "Todos, bajen las armas. Yo iré al frente."
 ABY_descision_focus_event.81.t:0 "La corona del lobo"
 ABY_descision_focus_event.81.d:0 "Praga había sido liberada, pero en las calles todavía flotaba un intenso olor a pólvora. Suou fue derrocada, pero el vacío de poder que dejó invocó a un monstruo llamado caos. Los ciudadanos saquearon los arsenales militares para armarse y, por doquier, se desataban venganzas privadas con la excusa de “cazar a los remanentes de Suou”. La “libertad” empezaba a convertirse en otro nombre para el “desorden”.\n\nShiroko, de pie junto a la ventana del despacho, contemplaba las calles convulsas. A su lado, los oficiales de estado mayor sostenían montañas de informes.\n\n\"Comandante, es imposible mantener la seguridad. Con la fuerza policial no podemos controlar a las milicias armadas y a las guardias ciudadanas. Debemos desplegar al ejército.\"\n\nShiroko se mordió el labio. Lo que ella deseaba era la restauración de la democracia, no un territorio sin ley. Pero no tenía a quién pedir consejo. Ayane y los demás, rescatados, estaban internados en el hospital por las secuelas de la tortura, aislados del exterior.\n\n\"Hace falta... orden.\"\n\nLa gente se reunía en la plaza gritando el nombre de Shiroko. No querían procedimientos parlamentarios ni debates: querían un “héroe” fuerte que los protegiera, aquí y ahora. Shiroko confundió aquellos vítores con un anhelo por la democracia.\n\n\"Mi misión es normalizar este país. Todavía... no es momento de soltar la espada.\"\n\nVolviéndose hacia sus oficiales, dio la orden:\n\n\"Extenderé los poderes de emergencia. Hasta que la seguridad se estabilice y el parlamento vuelva a la normalidad, yo asumiré la supervisión total del gobierno. Todas las fuerzas armadas irregulares deberán disolverse de inmediato y someterse al control del ejército.\"\n\nSin darse cuenta de que aquello era el primer botón que la encerraría para siempre en el yugo del poder,"
 ABY_descision_focus_event.81.a:0 "El lobo puro no lo sabía."
 ABY_descision_focus_event.81.b:0 ""

 ABY_descision_focus_event.82.t:0 "El peso del terciopelo"
 ABY_descision_focus_event.82.d:0 "Fue un milagro. Cuando Shiroko bajó el arma y, junto a la gente, se plantó frente a los tanques, los fusiles del bando golpista no dispararon. Suou fue arrestada sin derramar una sola gota de sangre, y la plaza se llenó del tintineo de llaveros y de velas encendidas. Con el tiempo, la gente lo llamaría “Revolución de Terciopelo”, porque habían derribado una dictadura con suavidad, pero con firmeza.\n\nEl país recuperó la estabilidad con rapidez. Shiroko creyó que su papel había terminado.\n\n\"Entonces... ya me toca volver. Lo que queda es asunto de Ayane y los políticos.\"\n\nFue al hospital para decirle a Ayane, postrada en cama, que regresaría. Pero Ayane, mirando al vacío por la ventana, negó con la cabeza.\n\n\"No, senpai. Yo... no voy a volver.\"\n\n\"¿Ayane?\"\n\n\"Estoy demasiado cansada. De confiar en la gente, de hacer política. Siento que la traición de Suou rompió algo dentro de mí. Ahora la política... me supera.\"\n\nLa negativa de Ayane fue un golpe. Lo mismo pensaban Hoshino y los demás: negaron con la cabeza mirando a Shiroko.\n\n\"Uhe~ Shiroko-chan. Ahora mismo, la única persona capaz de enderezar este país eres tú. ¿Por quién se levantó la gente?\"\n\n\"Así es. Aunque salgamos nosotras, el apoyo estaría por los suelos. Pero contigo, senpai, es distinto.\"\n\nShiroko, desconcertada, miró su viejo uniforme militar.\n\n\"Soy soldado. No sé de política.\"\n\n\"Puedes aprender. Nosotras te ayudaremos.\"\n\nHoshino puso una mano sobre el hombro de Shiroko. Shiroko miró las paredes blancas del hospital y los rostros exhaustos de sus compañeras. Alguien tenía que cargar con el peso. Con una mano temblorosa, empezó a desabrochar los botones del uniforme."
 ABY_descision_focus_event.82.a:0 "Era una ceremonia de partida hacia un campo de batalla más difícil que la guerra."
 ABY_descision_focus_event.82.b:0 ""

 ABY_descision_focus_event.83.t:0 "Democracia de hierro"
 ABY_descision_focus_event.83.d:0 "Seis meses después del anuncio de la extensión de poderes de emergencia, Shiroko se quitó el uniforme tal como había prometido. Renunció al mando militar y, ya como civil, fundó el “Partido Republicano Democrático Federal”. La gente estalló en vítores. Que la heroína de la patria dejara el fusil y tomara la boleta electoral bastaba para provocar la ilusión de que la democracia por fin se había completado.\n\nLos actos de campaña parecían conciertos de idols. Cuando Shiroko subía al estrado y saludaba con torpeza, decenas de miles enloquecían. La voz de la oposición era tratada como “ruido que estorba la reconstrucción nacional” y se hundía en el desinterés popular.\n\n\"Estoy aquí para proteger la vida cotidiana de todos. Haré un Abydos fuerte, una federación que no se tambalee.\"\n\nEl resultado fue aplastante. Un porcentaje cercano al 90%. Shiroko, al oír la confirmación de su victoria, soltó por fin un suspiro de alivio.\n\n\"Sí. Con esto basta. Los ciudadanos me eligieron, así que la legitimidad está asegurada. Ahora podré construir el país que Ayane soñaba.\"\n\nPero a su lado no quedaba ningún asesor que pudiera decirle “no”, ni un parlamento capaz de contenerla. Lo que Shiroko había creado era un gobierno de hierro con máscara democrática. Convertida en dueña del hemiciclo, sin darse cuenta de que su gobierno estaba asfixiando la democracia, Shiroko se encaminaba a convertirse en la dictadora más “democrática” de todas."
 ABY_descision_focus_event.83.a:0 "¡¡Viva la presidenta!!"

 ABY_descision_focus_event.84.t:0 "El lobo de traje"
 ABY_descision_focus_event.84.d:0 "Shiroko se afilió al “Partido Liberal Social del Pueblo”, una reorganización del partido centrista que antes lideraba Ayane. Para alguien que toda su vida solo había tocado armas y manuales de táctica, la política partidista era un terreno desconocido. Sin embargo, la franqueza y la capacidad de acción propias de Shiroko calaron en el corazón de los ciudadanos con más fuerza que la retórica elegante de los políticos de siempre.\n\n\"No sé de economía ni de diplomacia. Pero sé cumplir promesas. Y no pienso abandonar a nadie.\"\n\nSu discurso tosco viajó por las ondas y se extendió por toda la federación. Ayane se quedó en la sombra como asesora de políticas, cubriendo las carencias de Shiroko; Hoshino y Serika dirigieron la campaña, recorriendo el país; y con el apoyo financiero de Nonomi, la popularidad de Shiroko se disparó.\n\nY llegó la 2.ª elección general federal. El resultado fue la mayoría parlamentaria del Partido Liberal Social del Pueblo y una victoria contundente para Shiroko.\n\nLa noche en que se confirmó su triunfo, Shiroko subió al estrado para el discurso de aceptación. Bajo la lluvia de flashes, ya no era una comandante con uniforme. Vestida con un traje impecable, era una líder legítima y democrática destinada a guiar la armonía de dos mundos: la “presidenta de la Federación de Abydos”.\n\n\"La victoria de hoy no es solo mía. Sí: es de todos los que sostuvieron velas en la plaza. Ahora, junto a todos los ciudadanos de ambos mundos, iremos a asaltar el banco... no, el futuro.\"\n\nLa plaza quedó sepultada bajo una ovación por su última frase, mitad broma."
 ABY_descision_focus_event.84.a:0 "Era el verdadero inicio de la primavera."
 ABY_descision_focus_event.84.b:0 ""

