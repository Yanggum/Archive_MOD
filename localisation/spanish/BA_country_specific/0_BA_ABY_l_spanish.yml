 ABY_shiroko_fas_info_tt: "\n§Y¡Larga vida a Su Excelencia la Presidenta Sunaookami Shiroko!§!\n\nSu Excelencia, al asumir el cargo, anunció los §YJuramentos de la revolución§!.\nLos §YJuramentos de la revolución§! se dividen en §Cpolítica interna§! y §Cpolítica exterior§!, y por cada §G30§! puntos de progreso en cada parte, al completar el enfoque §YTrono Dorado§! ¡aumentará el efecto del rasgo obtenido!\n§RLa ingenua loba todavía cree que este es el camino hacia la democracia.§!"
 ABY_shiroko_fas_indoor_head_tt: "§CPolítica interna§!\nPuntaje actual: §G[?var:ABY_var_shiroko_indoor]§!"
 ABY_shiroko_fas_outdoor_head_tt: "§CPolítica exterior§!\nPuntaje actual: §G[?var:ABY_var_shiroko_outdoor]§!"
 ABY_shiroko_fas_outdoor_tt: "Por cada cierto número de aliados: §G15§!\nPor cada cierto número de títeres: §G5§!\nHeredar la Pequeña Entente: §G30§!\nProponer la Ley Federal: §G30§!\nPor cada diplomacia exitosa: §G10§!\nPor cada golpe de Estado exitoso: §G20§!"
 ABY_shiroko_fas_indoor_tt: "Proclamar la Gran Abydos: §G30§!\nPor cada estado núcleo: §G2§!\nPor cada estado núcleo con infraestructura cultural: §G3§!\nProponer la Ley Federal: §G30§!\nReconstruir el edificio principal de Abydos: §G15§!\nPor cada enfoque interno específico: §G10§!"

