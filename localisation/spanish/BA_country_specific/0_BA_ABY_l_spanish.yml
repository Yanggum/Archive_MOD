 SOV_bcerossiya:0 "Comité Provisional Panruso"

 ABY_news_event.1.t: "El gobierno provisional de Abydos rompe el alto el fuego"
 ABY_news_event.1.d: "Hoy, las fuerzas del gobierno provisional de Abydos rompieron el alto el fuego con Hyakkiyako e iniciaron una invasión.\n\nSe trata de una zona donde los choques armados eran frecuentes, pero al mismo tiempo que comenzó la ofensiva estalló un levantamiento de alemanes en Sudetes y Silesia; la prensa extranjera lo considera una invasión planificada.\n\nSin embargo, los países locales y los de Kivotos lo desestiman como un último manotazo desesperado y no parecen prestarle demasiada atención."
 ABY_news_event.1.a: "¡Vamos! ¡Por la liberación!"
 ABY_news_event.1.b: "¿Dicen que una rata acorralada muerde al gato?"

 ABY_news_event.2.t: "Choque entre Shanhaijing y Abydos"
 ABY_news_event.2.d: "Shanhaijing ignoró el ultimátum final de Abydos, que exigía la devolución de sus regiones nucleares ocupadas ilegalmente, y ambos países han entrado en estado de guerra.\n\nMientras numerosos países observan con atención el rumbo del gobierno provisional de Abydos, que contra todo pronóstico derrotó a Hyakkiyako, esta segunda guerra ha despertado una gran desconfianza entre los estados de Kivotos; al mismo tiempo, algunos países locales han emitido comunicados de apoyo, por lo que esta vez se entremezclan diversas posturas."
 ABY_news_event.2.a: "La victoria no está lejos."
 ABY_news_event.2.b: "¿Volverá a sonreírles la suerte?"

 ABY_news_event.3.t: "Establecimiento del Gobierno Democrático Provisional de Austria"
 ABY_news_event.3.d: "Ha ocurrido algo sorprendente.\nCuando las fuerzas del gobierno provisional de Abydos entraron en Linz, los ciudadanos los recibieron como libertadores: lanzaron pétalos y gritaron vivas, dándoles una bienvenida entusiasta.\nEl comandante en jefe, Asagiri Suou, declaró en una entrevista que acatará las decisiones del gobierno.\n\nPor su parte, el gobierno provisional se reunió con una delegación encabezada por el Partido Socialdemócrata de Austria y acaba de anunciar la formación del Gobierno Democrático Provisional de Austria, así como el plan para la liberación de Austria.\nShanhaijing denuncia que se trata de una artimaña vil y de una muestra de ambiciones expansionistas, pero parece que no está recibiendo gran eco."
 ABY_news_event.3.a: "Hacia la liberación de Austria."
 ABY_news_event.3.b: "¿Países de dos mundos…? ¿Quiénes demonios son?"

 ABY_news_event.4.t: "Formación del Gobierno Federal de Abydos"
 ABY_news_event.4.d: "La presidenta federal provisional, Okusora Ayane, declaró hoy la formación del gobierno federal de Abydos–Chequia–Austria. Heredando la constitución provisional, se promulgó una constitución federal provisional que incluye, entre otros puntos, la autonomía plena de los Sudetes; también afirmó que en breve se anunciará una constitución enmendada para asentar las bases del Estado y convocar elecciones generales.\n\nMientras tanto, sobre incidentes como el desplazamiento hacia el norte/sur de algunas divisiones dentro del gobierno provisional hacia la nueva capital, o el hecho de que el consejo directivo de Nephthys haya sido remitido a juicio, se limitó a decir que eran “asuntos internos” y evitó profundizar.\nAlgunos expertos expresan preocupación por la inestabilidad política, señalando similitudes con un proceso de golpe militar; otros, en cambio, opinan que quizá se logró impedir un golpe. Las posturas están divididas."
 ABY_news_event.4.a: "Masaryk, padre nuestro… ¿lo estás viendo?"
 ABY_news_event.4.b: "El nacimiento de un nuevo Estado democrático."

 ABY_news_event.5.t: "Golpe militar en Abydos"
 ABY_news_event.5.d: "Asagiri Suou, comandante del frente austríaco del gobierno provisional de Abydos y héroe nacional, traicionó sus declaraciones de lealtad y llevó a cabo un golpe militar.\n\nTras el golpe, edificios gubernamentales y embajadas fueron cerrados, y hay poca información confirmada; además, el paso de los periodistas está restringido y se operan puestos de control.\n\nEl general Asagiri Suou, ahora presidente del Comité Nacional de Ilustración, anunció que tomó una decisión para salvar la patria tras confirmar la repugnante conspiración del vil gobierno provisional, pero evitó dar detalles, diciendo que se revelarán más adelante.\n\nAsimismo, el paradero de figuras políticas clave del gobierno provisional es desconocido, lo que ha generado controversia sobre si están vivos o muertos."
 ABY_news_event.5.a: "¿Así se derrumba nuestra democracia?"
 ABY_news_event.5.b: "Otro país cae en el extremismo."

 ABY_news_event.6.t: "[ABY.GetName] introduce el sistema de 'unión civil'"
 ABY_news_event.6.d: "El gobierno provisional de Abydos anunció oficialmente que aprobó una ley que, por primera vez desde la Gran Transferencia, reconoce legalmente el sistema de 'unión civil' entre europeos y habitantes de Kivotos.\n\nSe espera que esta decisión sea un hito importante para que los residentes de ambos mundos formen, en los hechos, una sola comunidad. Un portavoz declaró: \"Este sistema busca respetar la unión de todos los residentes más allá de su origen y trasfondo, y proteger los derechos legales que correspondan\", y añadió: \"Es el primer paso para materializar el valor de la armonía que persigue nuestra comunidad\".\n\nAunque en algunos sectores persisten preocupaciones por las diferencias culturales, la mayoría de los ciudadanos lo recibe con entusiasmo, considerándolo una decisión progresista acorde con el nombre de 'país de dos mundos'."
 ABY_news_event.6.a: "¡Un momento! ¡Disuélvanse! ¡Disuélvanse!!"
 ABY_news_event.6.b: "¿Matrimonios entre especies y matrimonios homosexuales? ¡Dios mío!"

 ABY_news_event.7.t: "[ABY.GetName] adopta el 'esperanto'"
 ABY_news_event.7.d: "El gobierno provisional de Abydos, preocupado por los conflictos lingüísticos, anunció que adoptará oficialmente el esperanto, una lengua internacional neutral, como idioma oficial.\n\nEs una decisión audaz para resolver la ineficiencia administrativa y los conflictos étnicos causados por el uso mezclado del checo, el alemán y el idioma de Kivotos. El gobierno explicó: \"La introducción del esperanto, que no se inclina hacia ninguna etnia en particular, proporcionará una base de comunicación justa para todos los miembros\".\n\nSegún el anuncio, todos los documentos oficiales se redactarán en esperanto, y también se incorporará como asignatura obligatoria en todos los niveles escolares. Se observa con atención si esta decisión podrá abrir un nuevo camino de armonía para el gobierno provisional, que se encontraba frente a la crisis de una 'Torre de Babel'."
 ABY_news_event.7.a: "Espero (esperanza)."
 ABY_news_event.7.b: "¿Y luego?"

 ABY_news_event.8.t: "Segundo golpe en Abydos"
 ABY_news_event.8.d: "El puño de hierro de Asagiri Suou finalmente ha llegado a su fin. La comandante Sunaookami Shiroko, que fingía rendición mientras esperaba su oportunidad, lideró anoche a una milicia ciudadana reunida en secreto y a leales dentro del ejército, y asaltó el palacio a la velocidad del rayo.\n\nTras un caótico combate urbano, Suou fue capturada, y la comandante Sunaookami Shiroko proclamó \"la justicia y la restauración del orden derrumbado\". Los ciudadanos salen a las calles para vitorear el retorno de la heroína, pero también existen miradas preocupadas: el estado de sitio y el fuerte control militar que ella declaró podrían ser otra forma de autoritarismo."
 ABY_news_event.8.a: "¡Larga vida a la comandante Shiroko!"
 ABY_news_event.8.b: "¿Es un juego tradicional o qué?"

 ABY_news_event.9.t: "Proclamación de la Gran Federación de Abydos"
 ABY_news_event.9.d: "La presidenta Sunaookami Shiroko formalizó oficialmente la unificación con Eslovaquia y, al mismo tiempo, inició operaciones militares cruzando la frontera de Hungría. En su declaración, enfatizó que se trata de una “guerra santa” para \"poner fin al régimen dictatorial húngaro y liberar a nuestros hermanos eslovacos oprimidos\".\n\nA la par, el gobierno proclamó ante el mundo la creación de la Gran Federación de Abydos, que abarca Chequia, Austria, Eslovaquia y Hungría. Ante el avance de esta federación, ya convertida en la potencia dominante de Europa Central, Rumanía y Yugoslavia también han expresado su apoyo, y el debate sobre el renacimiento de la antigua 'Pequeña Entente' está tomando un fuerte impulso."
 ABY_news_event.9.a: "Gloria a la Gran Abydos."
 ABY_news_event.9.b: "¿Otra forma de unificación?"

 ABY_news_event.10.t: "Renacimiento de la Pequeña Entente"
 ABY_news_event.10.d: "Los líderes de [ABY.GetName], [ROM.GetName] y [YUG.GetName] se reunieron hoy en el Castillo de Bratislava para firmar un histórico tratado de defensa mutua. Con esto, la 'Pequeña Entente', que sostenía la paz de Europa Central en el período de entreguerras, ha renacido oficialmente.\n\nEn su declaración conjunta, los tres mandatarios resolvieron \"responder de forma conjunta ante cualquier agresión de fuerzas externas que amenacen la paz de la cuenca del Danubio\". Con este tratado, [ABY.GetName] obtiene el reconocimiento internacional de su posición como hegemon firme de Europa Central."
 ABY_news_event.10.a: "Hagamos renacer el legado."
 ABY_news_event.10.b: "El inicio de una nueva hegemonía en Europa del Este."

 ABY_news_event.11.t: "[ABY.GetName] proclama la Ley Federal"
 ABY_news_event.11.d: "[ABY.GetName] promulgó hoy una nueva constitución federal y anunció el fin del control militar sobre las regiones ocupadas de Hungría. En consecuencia, todos los residentes húngaros reciben de inmediato la ciudadanía federal sin discriminación.\n\nEl portavoz del gobierno declaró: \"Solo una integración completa, sin distinción entre vencedores y vencidos, es nuestro camino\", y anunció un plan masivo de desarrollo equilibrado para las regiones orientales, atrasadas por la guerra. Asimismo, insinuó que también se iniciará la discusión sobre construir, a largo plazo, una nueva capital administrativa dejando Praga, para gobernar de manera eficiente el territorio ampliado de la federación."
 ABY_news_event.11.a: "¡La Federación será una para siempre!"
 ABY_news_event.11.b: "¿Cuánto durará esa unión?"

