 ABY_new_event.236.d:0 "El contenido beta de Abydos ha finalizado. ¡Nos vemos en la próxima actualización! Si quieres seguir jugando, haz clic en la opción de abajo."
 ABY_new_event.236.a:0 "Seguir jugando"

 
