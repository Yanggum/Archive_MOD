 ABY_focus_first_desc: "Es evidente que la situación ha mejorado desde los días de la Gran Transferencia, ¿no? Ahora tenemos claro dónde estamos, con quién estamos y qué debemos hacer. Tras cerrar las negociaciones del gobierno de coalición con checos y alemanes, y tras reactivar, aunque sea un poco, la función del Consejo Estudiantil mediante una orden administrativa, ha llegado el momento de decidir el rumbo del país. Es lamentable no poder regalarle a nuestro pueblo, como obsequio de Año Nuevo, el fin del estado de emergencia. Recemos para que el próximo año sea mejor."
