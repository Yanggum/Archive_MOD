 ABY_descision_focus_event.94.t:0 "La llave de los grilletes dorados"
 ABY_descision_focus_event.94.d:0 "La noche de Praga vibraba con el hedor sangriento de la “limpieza” iniciada por Suou. Ella estaba eliminando sin piedad a los remanentes nazis y a los directores duros de Nephthys, bajo el pretexto de “erradicar la corrupción”. Pero incluso Suou había pasado algo por alto: la lógica del dinero es más tenaz que una cucaracha.\n\nA Nonomi, bajo arresto domiciliario, le llegó una comunicación cifrada. El remitente eran los directores “moderados” de la rama europea del Grupo Nephthys. Por supuesto, que fueran “moderados” solo significaba que eran menos violentos que los radicales; su mirada, que veía a Nonomi como una marioneta del linaje, era la misma.\n\n\"Señorita, esa loca llamada Suou intenta nacionalizar los activos del grupo. Los viejos radicales ya fueron eliminados. Los siguientes somos nosotros... y también usted.\"\n\nNonomi aferró el auricular con una mano temblorosa. Suou tenía de rehenes a sus amigas del Comité de Contramedidas. La forma de darle la vuelta a la situación era, irónicamente, depender justo de aquello de lo que tanto quería escapar: el poder financiero de Nephthys y sus soldados privados (PMC).\n\n\"¿Cuál es... la condición?\"\n\n\"Sencillo. Cuando nosotros apuñalemos por la espalda a Suou, usted nos otorgará legitimidad en nombre de Nephthys. Por la reconstrucción del grupo.\"\n\nNonomi cerró los ojos. Era agarrar la mano de otro demonio para expulsar al primero. Pero si podía salvar a sus amigas, su alma no le importaba."
 ABY_descision_focus_event.94.a:0 "\"Está bien... acepto la propuesta. Pero asegúrense de garantizar la seguridad de mis amigas.\""
 ABY_descision_focus_event.94.b:0 "\"Está bien... acepto la propuesta. Pero asegúrense de garantizar la seguridad de mis amigas.\""

 ABY_descision_focus_event.95.t:0 "Las fauces de acero"
 ABY_descision_focus_event.95.d:0 "A las 3 de la madrugada, los disparos retumbaron en el centro de Praga. Mercenarios PMC contratados por los directores moderados asaltaron oficinas gubernamentales clave. Su plan era capturar a Suou con la velocidad de un rayo. Sin embargo, el despacho al que irrumpieron estaba vacío.\n\n\"¿Se filtró la información?\"\n\nDesde el otro lado del transmisor del comandante mercenario, se escuchó la voz fría de Suou.\n\n\"Por esto no sirven los empresarios. Calculan ganancias y se les pasa el momento de apretar el gatillo.\" \n\nEra una trampa. Suou ya había detectado el movimiento de los moderados y los encerró dentro de un cerco. Unidades acorazadas emboscadas aplastaron a los mercenarios, y la guardia personal de Suou golpeó la sede provisional de Nephthys.\n\nAl amanecer, Suou apareció ante las cámaras con el uniforme manchado de sangre.\n\n\"Estimados ciudadanos: hoy hemos presenciado la repugnante rebelión de capitalistas que amenazan la democracia. El Grupo Nephthys ha intentado derrocar al Estado. Por lo tanto, por la presente activo poderes de emergencia: confisco todos los activos del Grupo Nephthys y lo declaro enemigo de la nación.\"\n\nEl fracaso del contragolpe le dio alas a Suou. Obtuvo un pretexto perfecto para “derrotar al enemigo interno” y, sin tener que mirar a nadie, comenzó una gran purga sangrienta. En las calles, arrastraban a empleados de Nephthys y opositores; el terror se apoderó de la ciudad."
 ABY_descision_focus_event.95.a:0 "Comenzó un banquete voraz."

 ABY_descision_focus_event.96.t:0 "El silencio del desierto"
 ABY_descision_focus_event.96.d:0 "Con los activos de Nephthys y las fábricas de armamento en sus manos, ya no había nada que se interpusiera ante Suou. Entonces decidió ocuparse del “último factor” más incómodo.\n\nEn el nivel más profundo de la prisión subterránea, Suou miró la celda con ojos fríos. Allí estaban sus antiguas compañeras: Hoshino, Shiroko, Ayane, Nonomi... Ninguna había perdido la mirada de resistencia.\n\n\"Qué lástima. Quería dejarlas vivir, pero son demasiado peligrosas. Si las perdono, algún día sin duda buscarán mi cuello.\"\n\n\"¡Suou! ¿Crees que saldrás ilesa de esta?\" gritó Hoshino, pero Suou no la escuchó.\n\n\"Conviértanse en abono para el país.\"\n\nCon un gesto suyo, sonaron los disparos. Uno, dos... y luego silencio. Los pilares que sostenían a Abydos se derrumbaron de forma absurda. Suou se dio la vuelta sin emoción. Pero cuando regresó a su despacho, frunció el ceño al leer un informe.\n\n\"Kuromi Serika... ¿aún se desconoce su paradero?\"\n\nSerika no estaba en el lugar cuando los arrestaron. No había cadáver, no había testigos. Sobre la victoria perfecta, se proyectó una sombra inquietante. La única superviviente."
 ABY_descision_focus_event.96.a:0 "Aquel pequeño rescoldo empezó a irritar los nervios de Suou."

 ABY_descision_focus_event.97.t:0 "Colmillo roto"
 ABY_descision_focus_event.97.d:0 "Desde las remotas montañas empezaron a circular rumores siniestros. Una fuerza de resistencia llamada “el Grupo Sekhmet” estaba emboscando las rutas de suministro del gobierno. En el centro de todo estaba la gata de la venganza: Kuromi Serika.\n\nSerika regresó viva del infierno. Reunió a los restos de Hyakkayouran de Hyakkiyako y del Gremio Comercial Hyunmu de Shanhaijing, viejos enemigos.\n\n\"¡La venganza por mis senpai... la cumpliré yo, cueste lo que cueste!\"\n\nLa rabia de Serika era feroz. El Grupo Sekhmet hostigó al ejército de Suou con guerrilla de golpes relámpago, e incluso liberó por un tiempo pequeñas ciudades provinciales. Pero frente al poder de fuego aplastante del ejército regular, era insuficiente. Suou ya no mostraba piedad.\n\n\"Para cazar ratas, lo mejor es el fuego.\" \n\nSuou ordenó un bombardeo masivo sobre el valle identificado como el último bastión de Sekhmet. Cayeron cientos de proyectiles y bombas incendiarias; el valle quedó envuelto en un infierno. Días después, los equipos de rastreo hallaron entre las cenizas una horquilla roja calcinada, supuestamente de Serika, y algunos restos humanos mutilados.\n\nAl recibir el informe, Suou por fin descorchó champán.\n\n\"Con esto, todas las variables desaparecen.\" \n\nLa muerte de Serika significó el fin de la resistencia."
 ABY_descision_focus_event.97.a:0 "...Tal vez."

 ABY_descision_focus_event.98.t:0 "La era de la Iluminación"
 ABY_descision_focus_event.98.d:0 "Con todos los rivales y amenazas erradicados, Abydos... no: el Gobierno Militar de Iluminación del Sur de Kivotos. Suou se definió a sí misma no como presidenta ni primera ministra, sino como algo más trascendente. Subió al estrado de la plaza central y contempló a cientos de miles.\n\n\"¡Hemos terminado con la era del caos y la división! La débil democracia, el capitalismo corrupto y la injerencia extranjera nos enfermaron. ¡Ahora debemos renacer!\"\n\nProclamó la “Revolución de la Iluminación”. Un sistema totalitario donde el Estado controla y guía cada aspecto de la vida. El parlamento fue disuelto y, en su lugar, lo sustituyó un partido fanático de Suou: “Por la Verdad de Kivotos–Por la Iluminación”.\n\n\"Me convertiré en la líder suprema que guíe a todo Kivotos y a esta tierra, y los conduciré por el camino de la gran prosperidad. Síganme. Solo yo tengo la respuesta.\" \n\nLa multitud que colmaba la plaza coreó su nombre, ya fuera por terror o por adoctrinamiento.\n\n\"¡Suou! ¡Suou! ¡Larga vida a la líder suprema!\"\n\nDesde ese día, el libre Abydos murió."
 ABY_descision_focus_event.98.a:0 "Solo quedó el “Imperio de Suou”."

 ABY_descision_focus_event.99.t:0 "La corona oxidada"
 ABY_descision_focus_event.99.d:0 "En el balcón de la residencia de Praga, Nonomi observaba a los ciudadanos que inundaban las calles celebrando. Suou fue arrestada y su guardia personal desarmada. En la superficie, era la victoria de la democracia y el triunfo de la justicia.\n\nPero el rostro de Nonomi estaba sombrío. Detrás de ella, se hallaban los directores moderados del Grupo Nephthys. Más que alegrarse, estaban ocupados revisando los libros de activos recuperados.\n\n\"Felicidades, señorita. No... ahora tendríamos que llamarla heroína, ¿verdad?\"\n\nDijo uno de ellos, aporreando una calculadora.\n\n\"Los trámites para devolver a nuestro nombre las fábricas que Suou nacionalizó ya han empezado. Y... pronto también quedará listo el cobro de los costos invertidos en este ‘apoyo’.\"\n\nNonomi esbozó una sonrisa amarga. El tirano llamado Suou había desaparecido, pero quienes tomaban su lugar eran mercaderes codiciosos. Sin derramar sangre, se tragaban el país entero usando a Nonomi como figura decorativa.\n\n\"Mis amigas... ¿están a salvo, verdad?\"\n\n\"Por supuesto. Están recibiendo el mejor tratamiento en el hospital. Aunque, por un tiempo, necesitarán ‘reposo’.\"\n\nEse “reposo” era una insinuación: serían rehenes por un tiempo. Nonomi apretó los puños. La era de la violencia terminaba, pero empezaba la era del capital. Y era tan asfixiante como la dictadura de Suou."
 ABY_descision_focus_event.99.a:0 "Una dictadura expulsó a otra dictadura."

 ABY_descision_focus_event.100.t:0 "Presidenta marioneta"
 ABY_descision_focus_event.100.d:0 "Tras el colapso del régimen de Suou, el gobierno de transición recuperó la estabilidad con rapidez. En el centro de todo estaba el capital inmenso del Grupo Nephthys. Y llegaron las elecciones. El consejo directivo llamó a Nonomi.\n\n\"Ceda la presidencia del grupo a un gerente profesional. Señorita—no, candidata—usted debe subir a un escenario más grande.\" \n\nLe exigieron postularse a la presidencia. No había derecho a negarse. El paquete de promesas que le pusieron en las manos era espantoso: flexibilización masiva de la ley laboral, abolición del impuesto corporativo, eliminación de regulaciones... Era convertir al Estado en propiedad privada de las empresas.\n\n\"Esto es... demasiado. La vida de los ciudadanos se va a derrumbar\", protestó Nonomi, pero los directores sonrieron con frialdad.\n\n\"¿Le pedimos ilegalizar sindicatos? ¿O abolir el salario mínimo? Esto es lo necesario para la ‘economía de libre mercado’. Y no lo olvide: si usted se niega, podemos buscar otra alternativa. En ese caso, no podemos garantizar lo que les ocurra a usted y a sus amigas.\" \n\nAl final, Nonomi bajó la cabeza. Para evitar lo peor, no tuvo más opción que escoger el mal menor.\nDurante la campaña, el dinero de Nephthys se esparció sin pudor. Los medios la maquillaron como una “santa salvadora de la patria”, y los candidatos rivales cayeron impotentes ante el poder del dinero.\n\nLa transmisión del conteo anunció la victoria de Nonomi. Llovía confeti, la gente aclamaba, pero los ojos de Nonomi en el estrado estaban vacíos. Se convirtió en presidenta, y al mismo tiempo, en una prisionera dentro de la cárcel más brillante."
 ABY_descision_focus_event.100.a:0 "La Federación de Abydos era ahora la “República de Nephthys”."
 
 ABY_serv_focus_event.1.t:0 "Informe de investigación – Gehenna"
 ABY_serv_focus_event.1.d:0 "Resumen: En una gran instalación civil cerca del Distrito Central de Gehenna se hallaron rastros similares a los experimentos biológicos de Trinity. No se observan indicios de intervención del Pandemonium Society ni del Comité Disciplinario, por lo que se considera un acto de un club civil. No hubo muestras exitosas, pero se obtuvieron numerosos datos.\n\n1. En general se asemeja a una instalación médica subterránea de la Catedral Alta, pero carece de condiciones básicas de investigación, como higiene.\n\n2. Se registran con detalle dosis letales por peso y por IMC. Al superar cierto umbral se produce muerte inmediata; las cifras exactas se adjuntan aparte.\n\n3. En notas del investigador y apuntes personales no se hallan rastros de órdenes del Pandemonium Society ni del Comité Disciplinario; por el contrario, parece que el Comité Disciplinario los estaba rastreando.\n\n4. Con la inyección de mística hasta antes de la dosis letal, el rendimiento físico aumenta de forma continua; al alcanzar el punto crítico se obtienen capacidades físicas similares a las de un kivotosiano, pero en cuestión de segundos el tejido muscular colapsa por completo y se produce la muerte.\n\n5. Se intentaron experimentos con animales a partir de cálculos inversos, pero no se lograron resultados comparables a los datos capturados. Se considera que fuera de humanos no habría efecto significativo.\n\nConclusión: Parece necesaria la administración de coadyuvantes como estabilizadores al inyectar mística. Dado que la experimentación animal no puede producir resultados útiles, se propone, de forma inevitable, proceder con experimentación humana basándose en los materiales existentes.\n\nEquipo de Investigación 26, desplegado en el Distrito Central."
 ABY_serv_focus_event.1.a:0 "Prohibido."

 ABY_serv_focus_event.2.t:0 "Informe de investigación – Millennium"
 ABY_serv_focus_event.2.d:0 "Resumen: Se hallaron rastros de investigación a gran escala sobre inyección de mística en el subsuelo de una instalación de investigación afiliada al Seminario de Millennium. La mayoría de los datos se preservaron intactos.\n\n1. Por la escala de los materiales, se estima que se usaron como mínimo decenas de miles de sujetos. Se hallaron datos con cifras más detalladas que los encontrados en Gehenna. Adjuntos.\n\n2. Está dentro de una instalación del Seminario, pero en cuadernos de investigación y notas personales no hay menciones a aprobación del Seminario ni referencias directas, por lo que no se confirma su implicación.\n\n3. Se logró suprimir con éxito la autodestrucción inmunitaria causada por la inyección de mística mediante una semana de diálisis sanguínea y la ingestión/administración de fármacos fuertemente tóxicos.\n\n4. Con el mismo método se logró retrasar el colapso corporal, pero el resultado indica que la esperanza de vida quedaría limitada a alrededor de 5 años.\nNota: clasificado como ultra secreto.\n\n5. Se presume que los sujetos fueron eliminados; se hallaron indicios de un plan para el siguiente estudio destinado a evitar la reducción de vida. Plan de investigación: inyección adicional de mística kivotosiana, ... , inyección de mística en fetos, ... (omitido). Ver anexos.\nNota: clasificado como ultra secreto.\n\nConclusión: Cálculos adicionales basados en los datos confirman que, por más que se retrase el colapso, no es posible extenderlo a más de 10 años.\n\nInforme adicional: La prueba de exotrajes mecanizados, impuesta por la prohibición de experimentación humana, está avanzando gracias a la obtención de estos materiales. Sin embargo, para investigación aplicada en combate será necesaria la cooperación con el estamento militar, y parece inevitable divulgar parte de los datos, por lo que se requiere autorización.\n\nEquipo de Investigación 3, desplegado en Millennium."
 ABY_serv_focus_event.2.a:0 "En revisión."

 ABY_serv_focus_event.3.t:0 "Resumen del Informe de Reunión Ministerial N.º 395, tomo 86"
 ABY_serv_focus_event.3.d:0 "Estalla la polémica sobre si deben divulgarse los datos del informe de investigación de Millennium.\n\nSe acuerda divulgar una parte de los datos al sector civil.\n\nLos datos detallados se divulgarán al ejército, pero se reglamenta que no se filtren por debajo del rango de general.\n\n(omitido)\nResumen del N.º 396, tomo 3\n\nSe confirma el informe detallado del “Proyecto Juggernaut”.\nSurge división de opiniones por el presupuesto excesivo requerido.\n\nRegistros eliminados.\n\nSe alcanza la conclusión final."
 ABY_serv_focus_event.3.a:0 "Se aprueba el Proyecto Juggernaut."
 ABY_serv_focus_event.3.b:0 "Se rechaza el Proyecto Juggernaut."

 ABY_serv_focus_event.4.t:0 "Informe de investigación – Trinity"
 ABY_serv_focus_event.4.d:0 "Resumen: Informe de investigación sobre varios cientos de cadáveres y equipo médico hallados en el subsuelo de la Catedral Alta de Trinity.\nNota: Antes de ingresar, múltiples registros fueron quemados o triturados, por lo que los materiales verificables son escasos.\n\n1. Se hallaron grandes cantidades de suero de mística y telar de mística alrededor de los cadáveres.\n\n2. Las causas de muerte son comunes: fallo orgánico total o paro cardiaco, presuntamente por sobrecarga muscular somática y activación inmunitaria autodestructiva.\n\n3. En todos los cuerpos, los valores de mística se observan por encima del rango normal.\n\n4. No se puede verificar el contenido, pero se hallaron órdenes del Tea Party, por lo que se presume que fue dirigido por el gobierno de Trinity.\n\n5. Las fechas de muerte, en general, coinciden con el periodo de “apoyo a indigentes y personas socialmente inadaptadas” del gobierno de Trinity.\n\nConclusión: Se considera experimentación biológica humana basada en los ensayos de inyección de mística en animales realizados por el Instituto Central de Investigación Mística de Abydos. Sin embargo, como la mayoría de los datos fue destruida, no es posible extraer resultados útiles más allá de que, sin medidas apropiadas, la inyección de mística en humanos produce una reacción similar a la de los animales y causa la muerte. Se requiere apoyo con materiales de investigación mucho más amplios.\n\nEquipo de Investigación Mística 37, desplegado en la Catedral Alta."
 ABY_serv_focus_event.4.a:0 "Autorizado."

