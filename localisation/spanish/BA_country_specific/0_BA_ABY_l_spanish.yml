 ABY_new_event.149.t:0 "Se une la resistencia checa"
 ABY_new_event.149.d:0 "Después de que las fuerzas de Hyakkiyako se retiraran de [9.GetName], una organización de resistencia que operaba en la zona se puso en contacto con el ejército de la coalición gubernamental. Estaban armados con armas ligeras individuales y parte de equipo capturado. Tras las conversaciones entre mandos, los miembros de la resistencia fueron incorporados a la cadena de mando oficial del ejército de la coalición. Con esta medida, la guarnición de [9.GetName] se reforzó de inmediato."
