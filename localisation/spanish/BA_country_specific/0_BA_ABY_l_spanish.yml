 ABY_idea_eocordnldnjsghl_first_fin_student_council:0 "Consejo Estudiantil de Abydos"
 ABY_idea_eocordnldnjsghl_first_fin_student_council_desc:0 "El Comité de Contramedidas para evitar el cierre de Abydos fue un club creado para impedir que la Preparatoria Abydos fuera clausurada.\nPero ahora que la Preparatoria Abydos se ha estabilizado, el Comité se ha integrado en el Consejo Estudiantil de Abydos.\nSu futuro no será sencillo, pero ahora hay una esperanza distinta a la de antes.\n\n§YConsejo Estudiantil de Abydos§!\n§P- Takanashi Hoshino §!\n§4- Sunaookami Shiroko §!\n§7- Izayoi Nonomi §!\n§1- Kuromi Serika §!\n§t- Okusora Ayane §!"
