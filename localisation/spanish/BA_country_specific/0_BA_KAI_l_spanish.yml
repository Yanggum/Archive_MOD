  # 스토리
   KAI_storyevent.1.t: "Un mal sueño"
   KAI_storyevent.1.desc: "El General Jackie Smith estaba sentado tranquilamente en una tienda de campaña utilizada como cuartel general temporal, recordando los viejos tiempos. Cuando estalló la Gran Guerra, tomó las armas sin dudarlo y luchó por su patria, y cuando terminó, cumplió con su deber como general. ¿Y el resultado? Fueron empujados al borde del aniquilamiento por el ataque sorpresa de extrañas máquinas.\n\nHmm, espera un momento, esto había estado ocurriendo desde noviembre de 1935, ¿y tiene sentido que “no-humanos” aparecieran “de repente” y nos atacaran? Más bien, sería más razonable describirlo como una mala y larga pesadilla.\n\nJackie Smith había estado teniendo esta mala, inquietante pesadilla durante más de dos meses. En el cuartel temporal de Liverpool, subió un poco el volumen de la radio y escuchó atentamente. Se escuchaba una canción algo distorsionada y con algo de estática.\n\n\"Hoy vamos a cantar una canción,\"\n\n\"Dame tu mano, tu blanca mano,\"\n\n\"Adiós, mi amor, adiós, mi amor, hasta luego, hasta luego.\"\n\n\"Porque nos vamos, porque nos vamos,\"\n\n\"¡Porque vamos rumbo a Liverpool!\"\n\nMientras escuchaba la canción en silencio, el general Jackie Smith sintió una incomodidad inexplicable. Incluso arrojó un bolígrafo que estaba sobre su escritorio. Esta maldita pesadilla no mostraba intención alguna de terminar.\n\nNo pasaron muchos minutos antes de que sonara el ruido de engranajes mecánicos. Era el sonido de esas máquinas que los británicos habían llamado \"helicópteros\". Cuando la orquesta desesperadamente ruidosa alcanzó su clímax, los sonidos de las máquinas se escucharon por todas partes. Eran ellos. Jackie Smith encendió el puro que había estado guardando. De todos modos, no tendría oportunidad de fumarlo después.\n\nPuso en marcha el gramófono que estaba al lado. Con un sonido de estática, comenzó a sonar \"Black Stitchel\" de Ivor Gurney.\n\nLa melodía fluía calmadamente, decorando el final. El centro de Liverpool ardía en llamas. Los helicópteros desembarcaban por todas partes, arrasándolo todo. Liverpool, Britania, e incluso él mismo.\n\nSe escucharon pasos pesados y las tropas mecánicas, hablando un inglés torpe, ordenaron rendirse de inmediato.\n\nPero al fin y al cabo, esto no era más que un absurdo sueño. Rendirse no es digno de un caballero. Un verdadero caballero mantiene su convicción hasta el final por su patria. Jackie Smith se levantó de su asiento, encendió su puro y gritó."
   KAI_storyevent.1.a:0 ""¡Váyanse a la mierda, bastardos idiotas!""
   KAI_tooltip_he_dead:0 "§gEn cuanto terminó sus palabras, los soldados de la PMC abrieron fuego. Incluso en el momento en que su insignificante vida se extinguió, no frunció el ceño y terminó su mal sueño con dignidad. Eso fue todo.§!\n\n@ENG §YJackie Smith§! ha caído en combate."

