   kai_political_fascism_desc: "£GFX_BA_kai_political_fascism_texticon §YEl President§! es el antiguo líder de Kaiser Corporation y busca un poder fuerte y centralizado.\n£GFX_BA_kai_political_fascism_texticon §YEl President§! es un líder capaz, que sabe cómo reprimir eficazmente a sus opositores."
   kai_political_communism_desc: "£GFX_BA_kai_political_communism_texticon §YLos Sindicatos§! están formados por los trabajadores de Kaiser Corporation que buscan una redistribución del capital.\n£GFX_BA_kai_political_communism_texticon §YLos Sindicatos§! representan la mayoría de la fuerza laboral y pueden organizar acciones colectivas."
   kai_political_democracy_desc: "£GFX_BA_kai_political_democracy_texticon §YEl Board of Directors§! es una facción emergente que surgió tras la inversión británica en Kaiser Corporation después del Gran Cataclismo.\n£GFX_BA_kai_political_democracy_texticon §YEl Board of Directors§! maneja el capital local con destreza y sabe cómo utilizar sus recursos."

   kai_political_loyalty_TOOLTIP: "§YLealtad§! representa el grado de cooperación de la facción con las acciones de la corporación.\nCuanto mayor sea la §Ylealtad§!, más efectos positivos obtendrá la facción para la corporación. Por el contrario, una lealtad baja traerá efectos negativos.\nSi la §Ylealtad§! es baja, estas facciones no cooperarán y pueden organizar actividades de resistencia."
   kai_political_influence_TOOLTIP: "§YInfluencia§! representa cuánto poder tiene la facción dentro de la corporación.\nA medida que aumenta la §Yinfluencia§!, el impacto de la facción en la corporación también crece.\nAntes de desmantelar una facción, será necesario reducir su §Yinfluencia§! a 0 mediante decisiones especiales."

