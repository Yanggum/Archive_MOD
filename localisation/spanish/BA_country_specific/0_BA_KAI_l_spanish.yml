l_spanish:
  ##인트로
 KAI_country_intro_header: "La lógica evidente del dinero"
 KAI_country_intro_content: "¡Ah, el dinero, más dinero! Es innegable que este misterioso objeto posee un encanto tan poderoso que incluso las mentes más lógicas y sabias caen en su trampa sin remedio. Todo el mundo trabaja por dinero. Sirven por dinero. Obedecen al presidente por dinero. Esta «lógica evidente del dinero» ha sido siempre el principio rector desde el surgimiento de Kaiser Corporation y el auge del capital.\n\nEl Gran Cataclismo dejó una profunda huella en Kaiser. Las filiales que una vez prosperaron en todo Kivotos fueron llamadas de vuelta por el Comité de Emergencia de Kaiser, y la reputación de la empresa cayó por los suelos. Los productos de Kaiser ya no son artículos de lujo: ahora son basura cara, reconocidos por su calidad, pero ignorados por su costo.\n\nPor tanto, Kaiser debe buscar un nuevo camino. Ya no basta con vender productos o especular con acciones. El conflicto con el Imperio Británico aparece como el escenario perfecto para forjar el nuevo destino de Kaiser.\n\nPoco después de la caída de Londres, numerosas empresas británicas firmaron juramentos de lealtad a Kaiser Corporation. Tanto en la Tierra como entre la humanidad, esta «lógica evidente del dinero» fue aceptada como verdad absoluta. Esto trajo un gran consuelo al presidente y a la corporación. Ahora debemos luchar por un nuevo amanecer. Dominar las Islas Británicas y aplastar su decadente civilización no es más que cuestión de tiempo.\n\nEstabilizar el estado corporativo de Kaiser, redefinir la diplomacia y recuperar la gloria de antaño en Kivotos ya no son meras metas, sino un destino inevitable, un amanecer brillante.\n\n§G¡Prospera, Kaiser Corporation, prospera, riqueza, y prosperen los capitales infinitos—\n\nfrutos grandiosos de nuestra civilización y fuente de nuestra dicha y felicidad!§!\n\n§YDesarrollado por - SKSKIe§!"
 KAI_guide: "Objetivos\n\n£white_dot. Termina la guerra contra Gran Bretaña.\n£white_dot. Restaura la gloria y grandeza de nuestra empresa.\n£white_dot. Acepta tranquilamente los resultados de la «lógica evidente del dinero», y demuestra al mundo que Kivotos está bajo nuestro control y que somos la corporación más grande del planeta.\n\nKaiser Corporation se ha transformado en un estado corporativo moderno, algo casi inédito en la historia. Ahora debes demostrar que este nuevo modelo de nación es tanto el punto de partida como el clímax del progreso humano. Sin importar las adversidades ni cuán inconcebible sea el enemigo al que debamos enfrentarnos,\n\n§Rprueba a toda costa la supervivencia y prosperidad del estado corporativo.§!"


  #시작 중점
 KAI_war_logistics: "Logística de guerra en Gran Bretaña"
 KAI_war_logistics_desc: "Contrario a lo que esperaba el presidente, la guerra contra Gran Bretaña lleva más de dos meses y nuestras fuerzas PMC comienzan a sufrir problemas logísticos. Debemos organizar suministros especiales para asegurar una victoria rápida y contundente."
 KAI_FOCUS_1: "Cazar al León"
 KAI_FOCUS_1_desc: "Los británicos siguen resistiendo inútilmente en las islas. Atrapamos al león dormido en nuestra red, solo queda darle el golpe final."
 KAI_FOCUS_2: "Seducir a los capitalistas"
 KAI_FOCUS_2_desc: "La lógica del dinero es universal. ¿Libras? ¿Marcos? ¿Chelines? Ahora no son más que papel mojado. Si apostamos por el yen, futura moneda global, los capitalistas británicos se unirán fácilmente a nuestra causa."
 KAI_FOCUS_8: "Victoria Corporativa"
 KAI_FOCUS_8_desc: "[ROOT.GetNameDef] ha triunfado."

