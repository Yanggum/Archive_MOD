 KAI_no_more_torture_desc: "Las largas jornadas laborales de [ROOT.GetNameDef] generan demasiados problemas. Reduciendo el exceso de trabajo y aumentando el tiempo libre, mejoraremos la productividad."
 KAI_president_fate: "El destino del presidente"
 KAI_president_fate_desc: "Con el sindicato en pleno control, es momento de decidir qué haremos con el presidente."

