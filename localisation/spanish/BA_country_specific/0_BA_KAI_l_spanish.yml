   KAI_power_of_the_corporate_state: "Lucha interna corporativa"
   KAI_power_of_the_corporate_state_desc: "§YKaiser Corporation§! luchó contra §YReino Unido§! después del Gran Cataclismo. Tras la guerra, la mayoría de las subsidiarias de §YKaiser Corporation§! quedaron incomunicadas, y nos encontramos gobernando un §Yestado-nación§!.\n\nDentro de §YKaiser Corporation§! existen varias facciones. El liderazgo corporativo encabezado por el President, los trabajadores organizados en los §YSindicatos§!, y los empresarios británicos que forman el §YBoard of Directors§!. Si no logramos mantener el §Gequilibrio§! entre estas tres facciones, Kaiser Corporation §Rcolapsará§!."

