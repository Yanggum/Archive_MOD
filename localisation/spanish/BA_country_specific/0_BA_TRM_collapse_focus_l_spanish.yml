  # --- Eventos de operaciones (KPD) ---
  TRN_collapse_event.11.t:0 "Éxito de la operación de Trinity"
  TRN_collapse_event.12.t:0 "Operación neutralizada"
  TRN_collapse_event.13.t:0 "Éxito de la guerrilla alemana"

  TRN_collapse_event.11.desc1:0 "Hemos desbaratado por completo la operación enemiga y obtenido la victoria.\n\n¡La aniquilación total de los rebeldes está cerca!"
  TRN_collapse_event.12.desc1:0 "El plan era perfecto, pero parece que los rebeldes pensaron lo mismo que nosotros. La operación ha fracasado."
  TRN_collapse_event.13.desc1:0 "Mientras mirábamos a otro lado, los rebeldes arrasaron una de nuestras bases y se retiraron.\n\nLa victoria se aleja un paso más."

  TRN_collapse_event.11.desc2:0 "El enemigo ejecutó un plan que anticipaba todos nuestros movimientos.\n\nSufrimos una derrota, pero no se repetirá."
  TRN_collapse_event.12.desc2:0 "El plan era perfecto, pero los tiranos de Trinity llegaron a la misma conclusión. La operación ha fracasado."
  TRN_collapse_event.13.desc2:0 "Mientras las patrullas Trinity buscaban en el lugar equivocado, completamos el objetivo con éxito.\n\n¡La liberación está cada vez más cerca!"

  TRN_collapse_event.11.a:0 "¡Excelente!"
  TRN_collapse_event.12.a:0 "Vaya..."
  TRN_collapse_event.13.a:0 "¡No!"

  TRN_collapse_event.11.b:0 "¡No!"
  TRN_collapse_event.13.b:0 "¡Magnífico!"

  # --- Eventos de operaciones (NSD) ---
  TRN_collapse_event.21.t:0 "Éxito de la operación de Trinity"
  TRN_collapse_event.22.t:0 "Operación neutralizada"
  TRN_collapse_event.23.t:0 "Éxito de las SS alemanas"

  TRN_collapse_event.21.desc1:0 "Hemos desbaratado por completo la operación de las SS y obtenido la victoria.\n\n¡El aplastamiento total de los rebeldes está próximo!"
  TRN_collapse_event.22.desc1:0 "El plan era perfecto, pero los rebeldes pensaron lo mismo que nosotros. La operación ha fracasado."
  TRN_collapse_event.23.desc1:0 "Mientras mirábamos a otro lado, los rebeldes arrasaron una de nuestras bases y se retiraron.\n\nLa victoria se aleja un paso más."

  TRN_collapse_event.21.desc2:0 "El enemigo anticipó cada punto de nuestro plan.\n\nHabrá que depurar responsabilidades."
  TRN_collapse_event.22.desc2:0 "El plan era perfecto, pero los invasores pensaron lo mismo que nosotros. La operación ha fracasado."
  TRN_collapse_event.23.desc2:0 "Con las principales fuerzas de Trinity desplazadas, cumplimos el objetivo a la perfección.\n\n¡La gloria alemana se acerca de nuevo!"

  TRN_collapse_event.21.a:0 "¡Excelente!"
  TRN_collapse_event.22.a:0 "Vaya..."
  TRN_collapse_event.23.a:0 "¡No!"

  TRN_collapse_event.21.b:0 "¡No!"
  TRN_collapse_event.23.b:0 "¡Magnífico!"

  # --- Petición de equipo (KPD) ---
  TRN_collapse_event.9.t:0 "Solicitud de armamento de [KPD.GetName]"
  TRN_collapse_event.9.desc:0 "[KPD.GetName] nos pide armamento para su guerra de guerrillas contra Trinity. Su ejército carece incluso del equipo básico para armar a sus hombres. Si aceptamos, nuestras relaciones con [TRM.GetName] se deteriorarán severamente."
  TRN_collapse_event.9.a:0 "Por supuesto que los ayudaremos."
  TRN_collapse_event.9.b:0 "Los ayudaremos... en secreto."

  TRN_collapse_event.91.t:0 "Ayuda de la URSS en armamento"
  TRN_collapse_event.91.desc:0 "[SOV.GetName] nos ha enviado el equipo solicitado para luchar contra [TRM.GetName]. ¡La victoria parece ahora segura!"
  TRN_collapse_event.91.a:0 "Excelente."

  TRN_collapse_event.92.t:0 "Acuerdo secreto de transporte soviético"
  TRN_collapse_event.92.desc:0 "[SOV.GetName] ha firmado un acuerdo de ayuda encubierta para apoyarnos contra [TRM.GetName]."
  TRN_collapse_event.92.a:0 "¿Evitará esto un choque directo con [TRM.GetName]?"
