  # --- Peligro de colapso de Trinity ---

  TRN_country_collapse_decisions:0 "Crepúsculo desvanecido"
  TRN_country_collapse_fali:0 "§t¡Trinity se desmorona!§!"
  TRN_country_collapse_success:0 "Se ha evitado el §Ycolapso de Trinity§!, pero aún §Yqueda mucho por hacer§!."
  TRM_bunggoehajima:0 "§YMedidas mínimas adoptadas§!"
  TRM_calm_storm:0 "Calma antes de la tormenta"
  TRN_country_collapse_decisions_plz_time:0 "Ganar tiempo"

  TRM_anti_trinity_game_desc:0 "El día en que el mundo se volcó, el destino de Trinity dejó de estar ligado a Kivotos y fue arrojado a tierras desconocidas. Despertamos en medio del caos, descubrimos cómo todo a nuestro alrededor había cambiado y comprendimos que la confusión era inevitable. Sin embargo, jamás nos rendimos: el sagrado ideal de Trinity no debía extinguirse en ningún lugar.\n\nPronto llegó la oleada de crisis. Los nativos de este nuevo mundo también estaban desorientados; se negaban a aceptar a seres enigmáticos que pretendían reemplazar a su desaparecido gobierno. Los choques entre nuestros estudiantes y ellos eran inevitables. Se formaron escuadrones de resistencia contra el dominio de Trinity y estallaron disturbios en varias regiones.\n\nEntonces, el Servicio de Información nos advirtió de que los enemigos preparaban su mayor prueba justo bajo nuestros pies. Si no la detenemos, Trinity perderá para siempre su gloriosa luz.\n\nSolo nuestra determinación y acciones pueden conjurar esta amenaza."

