#포커스
 l_spanish:
  # --- Focos ---

  TCA_invite_foreign_investors:0 "Buscar inversión extranjera"
  TCA_invite_foreign_investors_desc:0 "La guerra civil ha terminado y el caos político se apacigua. Ha llegado la hora de mirar al exterior."

  TCA_mission_to_the_us:0 "Invitar a un embajador estadounidense"
  #TCA_mission_to_the_us_desc:0 "China mantuvo durante largo tiempo estrechos colaboradores en EE. UU.; son la mejor opción para obtener el apoyo que necesitamos."

  TCA_closer_ties_with_us:0 "Cooperación [ROOT.GetAdjective]-estadounidense"
  #TCA_closer_ties_with_us_desc:0 "La delegación enviada a Alemania abrió grandes perspectivas de cooperación, incluido un crédito para el desarrollo industrial."

  TCA_hire_chennault:0 "Misión de oficiales estadounidenses"
  #TCA_hire_chennault_desc:0 "Claire Chennault, teórico norteamericano del combate aéreo, se ofrece a trabajar para nosotros. Si queremos reconstruir la fuerza aérea, debemos contratarlo."

  TCA_mission_to_the_soviet_union:0 "Entablar lazos con la URSS"
  #TCA_mission_to_the_soviet_union_desc:0 "La Unión Soviética ve a Japón como contrapeso y se interesa por China. Enviaremos una misión a Moscú para comprobar si nuestros objetivos coinciden."

  TCA_rapprochement_with_soviet_union:0 "Reconciliación con la URSS"
  TCA_rapprochement_with_soviet_union_desc:0 "Nos separa la ideología, pero compartimos intereses. Firmemos un pacto de no agresión que muestre al mundo nuestra cooperación."

  TCA_invite_soviet_advisers:0 "Invitar asesores soviéticos"
  TCA_invite_soviet_advisers_desc:0 "La URSS propone enviarnos una misión militar para ayudar a reconstruir nuestras tropas."

  TCA_purchase_tanks:0 "Antiguos diseñadores alemanes"
  TCA_purchase_tanks_desc:0 "Los blindados serán la punta de lanza de la guerra moderna. Absorberemos la experiencia alemana y organizaremos nuestra primera división acorazada."

  TCA_chinese_panzers:0 "Universidad Politécnica"
  TCA_chinese_panzers_desc:0 "Los investigadores estadounidenses generan innovaciones a diario en modernos centros. Debemos seguir su ejemplo y crear nuestra propia universidad técnica."

  TCA_tank_plant:0 "Fábrica de tanques"
  TCA_tank_plant_desc:0 "Con la investigación en marcha, podemos invertir en una planta dedicada a la producción de carros de combate."

  TCA_hire_soviet_designer:0 "Contratar diseñadores soviéticos"
  TCA_hire_soviet_designer_desc:0 "La URSS ha experimentado con blindados durante años y posee los mejores diseñadores. Contrataremos uno para que cree vehículos de combate para nosotros."

  TCA_joint_tank_development:0 "Desarrollo conjunto de tanques"
  TCA_joint_tank_development_desc:0 "La experiencia adquirida con los ingenieros soviéticos nos permite fundar un despacho conjunto y aprender mutuamente."

  TCA_experimental_mechanised_unit:0 "Unidad mecanizada experimental"
  #TCA_experimental_mechanised_unit_effect:0 "Obtiene una división con 2 bat. de tanques ligeros y 4 bat. motorizados\n"
  TCA_experimental_mechanised_unit_desc:0 "Los teóricos europeos han discutido mucho la mejor forma de usar los tanques. Combinarlos con infantería motorizada parece óptimo; crearemos una unidad así."

  TCA_the_soviet_volunteer_group:0 "Grupo voluntario soviético"
  TCA_the_soviet_volunteer_group_desc:0 "Nuestra fuerza aérea es lamentablemente débil frente a las potencias vecinas. La URSS contempla enviar un grupo de voluntarios."

  TCA_reach_out_to_france:0 "Reconciliación con el viejo orden"
  TCA_reach_out_to_france_desc:0 "Las antiguas potencias europeas, como Francia, viven exiliadas. Sin embargo, aún son fuertes y podemos cooperar con ellas para contener a los estados de Kivotos."

  TCA_maintenance_of_the_new_order_system:0 "Aceptar el nuevo orden"
  TCA_maintenance_of_the_new_order_system_desc:0 "El tiempo de las viejas potencias europeas pasó; debemos avanzar junto a Kivotos."

  TCA_construction_battalions:0 "Batallones de construcción"
  #TCA_construction_battalions_desc:0 "Si algo abunda en nuestro país es mano de obra. Crearemos unidades especiales de zapadores equipadas con simples palas para tareas de ingeniería."

  TCA_small_arms_expertise:0 "Especialización en armas ligeras"
  TCA_small_arms_expertise_desc:0 "El fusil individual sigue siendo el arma principal. Invirtamos recursos para mantenerlo actualizado."

  TCA_camco:0 "Fábrica de aeronaves"
  TCA_camco_desc:0 "Para forjar una industria aérea propia debemos aprender primero a montar y mantener los aviones que poseemos."

  TCA_french_military_mission:0 "Misión militar francesa"
  TCA_french_military_mission_desc:0 "El ejército francés es uno de los mejor entrenados de Europa; tenemos mucho que aprender de él."

  TCA_investment_into_shipbuilding:0 "Invertir en astilleros"
  TCA_investment_into_shipbuilding_desc:0 "Una gran flota exige una base industrial inmensa. Invitaremos a inversores extranjeros para construir nuevos astilleros."

  TCA_order_destroyers:0 "Producción de destructores"
  TCA_order_destroyers_desc:0 "El primer paso de la rearmada naval será un pequeño escuadrón de destructores."

  TCA_modern_submarines:0 "Submarinos modernos"
  TCA_modern_submarines_desc:0 "La guerra submarina contra el comercio, ideada por la vieja Alemania, debe renacer."

  TCA_light_cruiser_project:0 "Proyecto de crucero ligero"
  TCA_light_cruiser_project_desc:0 "Crear una auténtica armada oceánica empieza con modernizar la flota de cruceros. Iniciemos con algo modesto."

  TCA_heavy_cruiser_project:0 "Proyecto de crucero pesado"
  TCA_heavy_cruiser_project_desc:0 "El éxito inicial nos permite aumentar el tamaño y la potencia de nuestros cruceros para proteger la flota."

  TCA_coastal_patrol_planes:0 "Bombarderos de patrulla costera"
  TCA_coastal_patrol_planes_desc:0 "Nuestra larga costa solo puede vigilarse eficazmente desde el aire. Los torpederos modernos defenderán la línea sin excesivo gasto."

  TCA_naval_aviation:0 "Aviación naval"
  TCA_naval_aviation_desc:0 "El futuro de la guerra marítima pertenece a los portaaviones. Sin ellos nunca seremos una potencia naval real."

  TCA_new_world_technology_new:0 "Contramedidas tecnológicas"
  TCA_new_world_technology_new_desc:0 "Los halos resisten bien los impactos físicos, pero son vulnerables a armas químicas y biológicas. Desarrollaremos protección y aumentaremos su defensa."

  TCA_new_world_technology_halo:0 "Uso especial del halo"
  TCA_new_world_technology_halo_desc:0 "La investigación revela numerosas aplicaciones del halo, lo que ampliará las plantillas de unidades que lo emplean."

  TCA_new_world_technology_halo_heavy:0 "Investigación multipropósito del halo"
  TCA_new_world_technology_halo_heavy_desc:0 "El halo tiene un potencial inmenso. Exploraremos la magia para maximizar sus capacidades."

  TCA_train_marines:0 "Entrenar infantería de marina"
  TCA_train_marines_desc:0 "Nuestra costa es vulnerable a desembarcos, pero también nos permite atacar desde direcciones inesperadas. Formemos marines."

  TCA_elite_mountaineers:0 "Montañeses de élite"
  TCA_elite_mountaineers_desc:0 "La guerra en montaña es distinta. Aprovechemos nuestro terreno con fuerzas especializadas."

  TCA_combined_arms_warfare:0 "Guerra combinada"
  TCA_combined_arms_warfare_desc:0 "Los camiones sirvieron para experimentar con la guerra mecanizada, pero carecen de blindaje y atraviesan mal el campo de batalla. Debemos avanzar."

  TCA_pursuit_of_harmony:0 "Armonía entre dos mundos"
  TCA_pursuit_of_harmony_desc:0 "Debemos adaptarnos tras la Traslación. El primer paso será integrar a los estudiantes de Trinity."

  TCA_fighter_purchases:0 "Compra de cazas"
  TCA_fighter_purchases_desc:0 "Para enfrentar amenazas externas necesitamos cazas modernos. Como nuestra industria aún no puede fabricarlos, los adquiriremos en el extranjero."

  # --- Ideas / rasgos ---

  TCA_american_officer_corps:0 "Cuerpo de oficiales estadounidenses"

#이벤트
  TCA_shared.1.t:0 "Grupo Voluntario Soviético"
  TCA_shared.1.desc_a:0 "La lucha en la antigua Alemania continúa y necesitamos asistir, aunque sea con apoyo aéreo, a nuestros camaradas del ejército de [From.GetAdjective]. [From.GetLeader] nos ha solicitado pilotos y aviones: 50 bombarderos y 100 cazas de escolta.\n\nPara nuestros aviadores será una experiencia valiosa y podremos probar en combate nuestros nuevos modelos."
  TCA_shared.1.desc_b:0 "Mientras la guerra prosigue en la vieja Alemania, la fuerza aérea de [From.GetAdjective] se esfuerza por proteger los cielos de [From.GetNameDef] y apoyar a las tropas. A petición personal de [From.GetLeader], [SOV.GetLeader] ha cedido un grupo mixto con 50 bombarderos medios y 100 cazas.\n\nEs una excelente oportunidad para probar nuestro material más moderno en condiciones reales."
  TCA_shared.1.a:0 "Debemos ayudarlos todo lo posible."
  TCA_shared.1.b:0 "Tendrán que arreglárselas con lo que ya poseen."

