#중점
 BLM_dawn_of_bretagne_port: "El amanecer del puerto de Bretaña"
 BLM_dawn_of_bretagne_port_desc: "Los puertos de Bretaña despiertan en la oscuridad del amanecer para convertirse en el nuevo epicentro del crimen. Contrabandistas y organizaciones criminales se congregan aquí, listos para ganarse una fama internacional."
 BLM_crime_division_of_labor: "División del trabajo criminal"
 BLM_crime_division_of_labor_desc: "A medida que las actividades criminales se sofistican, estableceremos una división y especialización clara de roles dentro de la organización, funcionando como una industria eficiente."
 BLM_criminal_syndicate: "Formación del sindicato criminal"
 BLM_criminal_syndicate_desc: "Las pequeñas bandas criminales de Bretaña se unirán bajo un único sindicato para cooperar por el beneficio común. Este sindicato centralizará el poder y los recursos de todas las operaciones ilegales."
 BLM_smuggled_weapons_research: "Investigación de armas de contrabando"
 BLM_smuggled_weapons_research_desc: "Comenzaremos a investigar armas basadas en el contrabando, buscando que el mercado negro adquiera la tecnología armamentística más avanzada."
 BLM_smuggling_export_industry_expansion: "Expansión de la industria del contrabando"
 BLM_smuggling_export_industry_expansion_desc: "Bretaña convertirá la industria del contrabando en su principal fuente de ingresos, ampliando su red de exportación ilegal para maximizar beneficios."
 BLM_securing_drug_production_facilities: "Asegurar las instalaciones de producción de drogas"
 BLM_securing_drug_production_facilities_desc: "Instalaremos laboratorios de producción de drogas en las afueras de Bretaña, fortaleciendo así nuestra red internacional de narcotráfico. Las organizaciones protegerán celosamente estas instalaciones."
 BLM_international_crime_port: "Puerto criminal internacional"
 BLM_international_crime_port_desc: "El puerto de Bretaña pronto será el epicentro de la red criminal europea, donde prosperarán el narcotráfico, el tráfico de armas y la trata de personas."
 BLM_sicilian_mafia_cooperation: "Colaboración con la Mafia Siciliana"
 BLM_sicilian_mafia_cooperation_desc: "El mercado negro de Bretaña formará alianzas con la Mafia Siciliana, integrándose en la red criminal internacional para obtener mayores beneficios y fortalecer su poder."
 BLM_balkan_market_expansion: "Expansión al mercado balcánico"
 BLM_balkan_market_expansion_desc: "Planeamos expandir nuestra influencia hacia los Balcanes, estableciendo allí nuevas rutas de contrabando y tráfico de armas, consolidando así nuestro poder regional."
 BLM_kivotos_crime_sponsorship: "Patrocinio criminal en Kivotos"
 BLM_kivotos_crime_sponsorship_desc: "Con el patrocinio de grupos criminales en Kivotos, el mercado negro obtendrá nuevas fuentes de financiación y alianzas internacionales que fortalecerán nuestra base operativa."
 BLM_second_market_domination: "Dominio del segundo mercado"
 BLM_second_market_domination_desc: "Con el objetivo de dominar el 'Segundo Mercado', el mercado negro está ampliando su esfera de influencia sobre todo el comercio ilegal, consolidando su poder económico."
 BLM_london_gang_contact: "Contacto con las bandas londinenses"
 BLM_london_gang_contact_desc: "Al establecer contacto con las bandas criminales de Londres, fortaleceremos nuestra red internacional y accederemos a nuevos recursos e influencias."
 BLM_atlantic_smuggling_route_establishment: "Establecimiento de la ruta de contrabando atlántica"
 BLM_atlantic_smuggling_route_establishment_desc: "Abriremos rutas de contrabando a través del Atlántico para transportar armas y drogas entre Europa y América del Norte, generando así enormes beneficios económicos."
 BLM_great_leap: "El Gran Salto"
 BLM_great_leap_desc: "El mercado negro de Bretaña se prepara para un salto cualitativo, expandiendo su influencia económica y política a través de la criminalización industrializada."
 BLM_systematic_industrialization: "Industrialización sistemática"
 BLM_systematic_industrialization_desc: "Con una industrialización organizada, el mercado negro de Bretaña hará que sus operaciones criminales sean aún más eficientes mediante la especialización y modernización de su infraestructura."
 BLM_crime_enterprise: "Empresa criminal"
 BLM_crime_enterprise_desc: "El mercado negro de Bretaña evolucionará en una verdadera empresa criminal, gestionando el crimen como una industria estable y rentable."
 BLM_international_crime_industry_alliance: "Alianza internacional del crimen industrial"
 BLM_international_crime_industry_alliance_desc: "Formaremos una alianza internacional del crimen industrial, colaborando con organizaciones criminales de todo el mundo para compartir recursos y beneficios a escala global."


 BLM_bretagne_independent_organization_and_start_of_war: "Proclamación de la guerra en Bretaña"
 BLM_bretagne_independent_organization_and_start_of_war_desc: "Las milicias nacionalistas de Bretaña siguen fortaleciéndose y oponiéndose a nuestro control. Por el bien de los intereses del mercado negro, debemos iniciar una guerra total contra ellos."
 BLM_gang_thugs_domination: "Pandillas, Skebans y el Dominio"
 BLM_gang_thugs_domination_desc: "La dominación total de Bretaña está cerca. El mercado negro está listo para mostrar su poder al mundo una vez más."
 BLM_sealing_conflicts_in_confusion: "Contener los conflictos en medio del caos"
 BLM_sealing_conflicts_in_confusion_desc: "Aunque el conflicto entre los Skebans y el Helmet Gang se intensifica, todas las organizaciones reconocen que deben unirse por su supervivencia. Por ahora, cooperarán temporalmente."
 BLM_gang_priority: "Prioridad al Helmet Gang"
 BLM_gang_priority_desc: "El Helmet Gang, con su entrenamiento y organización superior, lidera el mundo del crimen. Los apoyaremos para utilizar sus recursos de manera eficiente."
 BLM_thugs_priority: "Prioridad a los Skebans"
 BLM_thugs_priority_desc: "Aunque menos organizados, los Skebans reúnen información y gran cantidad de miembros de diversas academias. Los apoyaremos para aprovechar su fuerza numérica."
 BLM_organized_public_security_management: "Gestión organizada de la seguridad pública"
 BLM_organized_public_security_management_desc: "El Helmet Gang, con su disciplina, es ideal para mantener el orden en Bretaña, reprimiendo tanto a los independentistas como a los delincuentes comunes."
 BLM_suppression_of_skeban_radicals: "Represión de radicales Skeban"
 BLM_suppression_of_skeban_radicals_desc: "La naturaleza descentralizada de los Skebans permite que algunos ignoren los acuerdos internos y causen disturbios. Los neutralizaremos por la estabilidad del mercado negro."
 BLM_mimicking_of_bills: "Imitación de leyes"
 BLM_mimicking_of_bills_desc: "Imitar las leyes de otros países puede ser útil. Copiaremos sus sistemas judiciales para estructurar nuestra organización."
 BLM_free_district_bretagne: "Distrito libre de Bretaña"
 BLM_free_district_bretagne_desc: "Los Skebans de Kivotos son el corazón del mercado negro, viviendo sin reglas escolares. Su espíritu libre representa la esencia cultural del mercado negro."
 BLM_loose_zone_order: "Orden flexible en la zona"
 BLM_loose_zone_order_desc: "Somos, ante todo, una organización criminal. No necesitamos mantener un orden social estricto como otros estados."
 BLM_free_skeban_spirit: "Espíritu libre Skeban"
 BLM_free_skeban_spirit_desc: "La libertad Skeban es inigualable. Ampliaremos nuestra organización como una comunidad abierta para aumentar su tamaño."
 BLM_organized_armament_strengthening: "Fortalecimiento armado organizado"
 BLM_organized_armament_strengthening_desc: "Ante la amenaza de la guerra contra el Otro Mundo, debemos reforzar nuestro armamento, incluso a costa de grandes sacrificios. Las facciones del mercado negro han llegado a un acuerdo secreto para hacerlo."
 BLM_return_of_seven_prisoners: "El retorno de los Siete Prisioneros"
 BLM_return_of_seven_prisoners_desc: "En el caos tras la desaparición del presidente estudiantil, los Siete Prisioneros —íconos de los forajidos— han escapado. Reclutarlos nos permitirá obtener un gran poder militar y asegurar la lealtad de las facciones."
 BLM_bretagne_law: "Ley de Bretaña"
 BLM_bretagne_law_desc: "A partir de ahora, las leyes del mercado negro regirán Bretaña. Con la ayuda de los Guardias del Mercado y las organizaciones aliadas, formaremos una poderosa zona sin ley."

 BLM_gang_thugs_war_focus: "Guerra de pandillas"
 BLM_gang_thugs_war_focus_desc: "Durante la noche de ayer ocurrió un incidente nada bueno. El choque entre los Skeban y la Banda del Casco ya es un hecho, y su enfrentamiento acabará convirtiéndose en una amenaza para el Mercado Negro. Rápido, debemos decidir el rumbo."

