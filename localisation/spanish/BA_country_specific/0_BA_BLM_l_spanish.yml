 BLM_bretagne_revolution_decision_1: "Operación iniciada"

BLM_event.1.t: "Silencio ominoso"
BLM_event.1.d: "Un extraño silencio recorre los callejones y mercados de Bretaña. La tensión entre Helmet Gang y las Skevan, que hasta ahora habían mantenido sus propios territorios en una paz tácita, está aumentando poco a poco. La atmósfera es la de una calma inquietante antes de la tormenta.\n\nSe rumorea que ambos grupos están intensificando sus disputas por el control y las ganancias del Mercado Negro. Provocaciones y advertencias veladas han salido a la luz durante las últimas semanas, empeorando aún más la relación entre ambos bandos. Algunos susurran que una lucha por el poder invisible ya ha comenzado en las sombras.\n\nLa gente observa su entorno con miradas tensas, evitando incluso los bares donde solían beber despreocupadamente. La tensión se extiende por la ciudad como una espina, y basta una chispa para desatar una catástrofe."
BLM_event.1.a: "Esto no pinta bien."
BLM_event_1_tt: "§RLa guerra de bandas se avecina.§!"

BLM_event.2.t: "Guerra de bandas"
BLM_event.2.d: "El movimiento independentista de Bretaña ha sido completamente aplastado, dando paso a un nuevo orden dirigido por poderosas organizaciones criminales llegadas de otros mundos. En las ciudades y puertos de Bretaña prospera ahora un floreciente Mercado Negro, donde se comercian libremente contrabando y bienes prohibidos. Diversas bandas cooperan para expandir y enriquecer el Mercado Negro, transformando la región en una tierra sin ley ni justicia.\n\nPero esta frágil paz no duró. El conflicto entre Helmet Gang y las Skevan salió a la luz pública, empujando a ambas partes al borde de una guerra total. La ejecución de un líder Skevan por parte de Helmet Gang marcó el punto de no retorno. Esta decapitación no fue solo un asesinato, sino una provocación descarada, y en la oscuridad de Bretaña se anticipa una brutal venganza. \n\nLa ciudad entera se ha convertido en un campo de conspiraciones y luchas de poder. En callejones y mercados se siente un ambiente amenazante, mientras traiciones, enfrentamientos y venganzas sumergen a Bretaña en el caos. Nadie puede predecir quién saldrá victorioso de esta guerra."
BLM_event.2.a: "Ha comenzado la revuelta."

BLM_event.3.t: "Destino"
BLM_event.3.da: "Tras una lucha feroz en los bajos fondos de Bretaña, la guerra entre Helmet Gang y las Skevan ha llegado a su fin. Las Skevan, usando su red de información y números superiores, lograron derribar los bastiones de Helmet Gang uno por uno, alcanzando la victoria. Aunque Helmet Gang poseía tropas bien entrenadas y una estructura organizada, no pudieron resistir la movilidad y superioridad numérica de sus rivales.\n\nNo obstante, Helmet Gang no ha desaparecido del todo. Durante el conflicto, sus líderes y fuerzas restantes evacuaron rápidamente hacia las afueras de Bretaña, donde establecieron nuevas bases. Aunque derrotados, están reagrupándose en busca de venganza, fortaleciendo sus filas y reformulando su estrategia.\n\nLas Skevan ahora controlan gran parte del Mercado Negro y el mundo subterráneo de Bretaña, pero Helmet Gang permanece agazapado, esperando su momento. En las sombras de Bretaña, una inestable tregua augura futuras batallas aún más impredecibles."
BLM_event.3.db: "La encarnizada lucha entre Helmet Gang y las Skevan finalmente ha concluido. Helmet Gang, gracias a su disciplinada fuerza, estructura organizada y planificación precisa, logró someter a las Skevan. La red de inteligencia y la ventaja numérica de Skevan fueron insuficientes ante la estrategia meticulosa de Helmet Gang, quien conquistó sus principales bastiones uno a uno.\n\nAunque las Skevan resistieron hasta el final, no pudieron mantener su influencia en el submundo y terminaron por dispersarse o rendirse. Sus líderes fueron capturados, pero algunos miembros escaparon y planean su retorno desde las sombras.\n\nAhora, Helmet Gang domina plenamente el mundo criminal y el Mercado Negro de Bretaña, erigiéndose como el soberano indiscutible del crimen local. Sin embargo, sabiendo que los restos de Skevan podrían reaparecer en cualquier momento, gestionan su control con cautela y rigor."
BLM_event.3.dc: "La guerra entre Helmet Gang y las Skevan no ha encontrado un vencedor claro, sumiendo a Bretaña en un caos aún mayor. Ambas bandas han quedado atrapadas en un estancamiento, incapaces de derrotar a la otra. Mientras tanto, los movimientos independentistas de Bretaña aprovechan el vacío de poder para reconstruir sus fuerzas desde las afueras.\n\nEstos grupos han comenzado a ganar simpatizantes en el caos reinante, donde la ley y el orden han colapsado. Bretaña cae así en la anarquía, y el caos continúa expandiéndose sin control."
BLM_event.3.a: "Skevan ha ganado."
BLM_event.3.b: "Helmet Gang ha ganado."
BLM_event.3.c: "El conflicto no ha terminado."

# Eventos de los estudiantes Arius
#이벤트
 BLM_event.1.t: "Silencio inquietante"
 BLM_event.1.d: "En los callejones traseros y las zonas comerciales de Bretaña se respira un silencio extraño. La tensión entre la Banda del Casco y los Skeban, que hasta ahora habían defendido sus territorios en una paz tácita, se eleva sutilmente, y una atmósfera como la calma antes de la tormenta envuelve la ciudad.\n\nSegún los rumores, el conflicto entre ambas organizaciones por los beneficios y el control del Mercado Negro se está intensificando poco a poco, y una serie de provocaciones recientes y advertencias veladas, aparecidas en las últimas semanas, habrían empeorado aún más su relación. En la oscuridad se susurra que ha comenzado una lucha de poder invisible entre la Banda del Casco y los Skeban.\n\nLa gente, visiblemente tensa, vigila con recelo a su alrededor, y hasta en los lugares donde normalmente se reunían a beber, ahora dan media vuelta con cautela. Una inquietud que parece a punto de estallar se esparce por la ciudad como una espina, insinuando que una sola chispa podría provocar un desenlace fatal."
 BLM_event.1.a: "Esto no pinta bien."
 BLM_event_1_tt: "§RSe aproxima una guerra de pandillas.§!"

 BLM_event.2.t: "Guerra de pandillas"
 BLM_event.2.d: "El movimiento independentista de Bretaña ha sido ya aplastado por completo, y un nuevo orden, dominado por una poderosa organización criminal llegada del otro mundo, ha echado raíces profundas en estas tierras. En las ciudades y puertos bretones se ha asentado un Mercado Negro que prospera en las sombras, donde toda clase de contrabando y bienes prohibidos se comercian libremente. Mientras diversas bandas colaboran para expandir y enriquecer este Mercado Negro, la región se ha convertido en una tierra sin ley, fuera del alcance de la justicia.\n\nPero la paz inestable entre ellos no duró mucho. A medida que el conflicto entre la Banda del Casco y los Skeban emergía a la superficie, la tensión entre ambos se precipitó hacia el límite. En especial, cuando un miembro de la Banda del Casco decapitó a una figura clave de los Skeban, la grieta entre ambas fuerzas alcanzó un punto de no retorno.\n\nAquel hecho se interpretó como una provocación descarada más que como un simple asesinato, y, mientras se prevé una represalia brutal, las noches de Bretaña empiezan a teñirse de sangre.\n\nAhora esta tierra se ha transformado en un escenario de conspiraciones entre sombras y disputas de poder; en las calles antes tranquilas y los callejones traseros flota un aire asesino. En el ciclo de traición, choques y venganza, Bretaña se hunde aún más en el caos, y nadie puede predecir quién será el vencedor cuando esta guerra llegue a su fin."
 BLM_event.2.a: "La contienda ha comenzado."

 BLM_event.3.t: "Destino"
 BLM_event.3.da: "La larga y encarnizada lucha entre la Banda del Casco y los Skeban, que chocaron sin tregua en los callejones oscuros y el submundo de Bretaña, por fin ha bajado el telón. Los Skeban, usando su red de información, desplegaron estrategias ágiles y respuestas rápidas, derribando uno a uno los bastiones de la Banda del Casco hasta alzarse con la victoria. Por momentos, las tropas entrenadas y la estructura sistemática de la Banda del Casco parecieron imponerse, pero ante la aplastante superioridad numérica de los Skeban y su veloz red de inteligencia, acabaron siendo impotentes.\n\nSin embargo, la Banda del Casco no quedó destruida por completo. En plena carnicería, figuras clave y restos de sus fuerzas abandonaron los principales puntos fuertes y se trasladaron con rapidez a las afueras de Bretaña para levantar una nueva base. Aceptan la derrota, sí, pero juran vengarse de los Skeban, tomando aire por un tiempo. Su fuerza sigue intacta y, de hecho, esta retirada les ha dado una oportunidad para reorganizarse internamente y reajustar su estrategia.\n\nLos Skeban han logrado controlar en gran medida el Mercado Negro y el submundo bretón, pero la Banda del Casco, acechando una oportunidad para contraatacar, conserva su influencia a su manera. En la oscuridad de Bretaña, el frágil equilibrio entre ambos anuncia un nuevo capítulo, y por un tiempo su conflicto se desarrollará de forma aún más compleja e impredecible."
 BLM_event.3.db: "La feroz batalla entre la Banda del Casco y los Skeban, librada en los callejones y el submundo de Bretaña, finalmente llegó a su fin. Con tropas bien entrenadas, una estructura organizativa estricta y estrategias minuciosas, la Banda del Casco fue oprimiendo a los Skeban paso a paso hasta imponerse. La red de información y la ventaja numérica de los Skeban se desmoronaron ante las tácticas precisas de la Banda del Casco, y sus principales enclaves fueron cayendo uno tras otro.\n\nLos Skeban resistieron hasta el final, pero se derrumbaron ante la aplastante organización de la Banda del Casco y ya no pudieron mantener su influencia en el submundo. Los restos de la facción se dispersaron con rapidez para esconderse o se rindieron, y la cúpula de los Skeban cayó en manos de la Banda del Casco. Pero los remanentes Skeban no han desaparecido por completo: quienes sobrevivieron se han replegado para reorganizarse y apostar por el futuro.\n\nLa Banda del Casco ha tomado ahora el control total del submundo y del Mercado Negro de Bretaña. Así, se yergue como soberana del hampa bretón, lista para controlar por completo ese mundo oscuro mediante una estructura aún más fuerte y un sistema de dominio más eficiente. Aun así, como los vestigios del pasado podrían reaparecer en cualquier momento, la Banda del Casco administrará Bretaña con mayor cautela y rigor para preservar su dominio."
 BLM_event.3.dc: "Como el conflicto entre la Banda del Casco y los Skeban no se resuelve con facilidad, Bretaña se hunde todavía más en el caos. Ninguna de las dos fuerzas logra someter a la otra y han quedado atrapadas en un punto muerto; en ese intervalo, las organizaciones independentistas bretonas han empezado a reconstruir lentamente su poder.\n\nAprovechando esta grieta, los grupos independentistas reanudan sus actividades en silencio desde la periferia, reuniendo apoyos en medio del desorden. Con ello, mientras la ley y el orden colapsan y la anarquía se acelera, Bretaña cae en una confusión todavía mayor."
 BLM_event.3.a: "Los Skeban han vencido."
 BLM_event.3.b: "La pandilla ha vencido."
 BLM_event.3.c: "El caos no ha terminado."

 BLM_event.4.t: "Comienza la independencia bretona"
 BLM_event.4.d: "Más allá del horizonte de Bretaña, tras una larga espera, vuelve a encenderse la llama que llaman “revolución”. En los muros de las calles quedan garabatos escritos con sangre, y una canción, convertida en símbolo de la resistencia, se extiende en voces bajas como un susurro. La gente respira hondo en silencio, elevando despacio, pero con certeza, la ira que llevaba demasiado tiempo reprimida.\n\nAhora debemos decidir. Los opresores incompetentes y violentos que han devorado Bretaña durante años ya no merecen gobernar nuestra tierra ni nuestras vidas. Aquellos que solo engordaron sus propios bolsillos y cerraron los oídos al dolor del pueblo… no son más que los últimos residuos que deben ser barridos de esta tierra. Ha llegado la hora de construir un verdadero Estado de Bretaña, levantado por manos bretonas, para los bretones.\n\nPero el camino no será nunca llano. La independencia real no se completa solo cambiando una bandera. Existe una estructura de crimen y corrupción clavada hasta en las raíces más profundas de esta tierra, y en su centro se encuentra un gigantesco sindicato criminal conocido como el Mercado Negro. Como un cáncer, este organismo ha invadido la economía y la red de información de las ciudades, criando desde la sombra a vigilantes y bandas criminales como la Banda del Casco y los Skeban, acumulando beneficios al precio de innumerables vidas.\n\nArmas y drogas que se comercian bajo tierra, contrabando y desinformación, y el cártel del miedo y el silencio que lo hizo posible… a todo eso hay que ponerle punto final. No nos sobra el tiempo. La revolución exige velocidad, y la oportunidad no llega dos veces. Si dudamos ahora, la historia volverá a caer en el dolor y la humillación.\n\nEl amanecer de Bretaña se abrirá con sangre. Pero esa sangre debe ser la del opresor, y al final de esa sangre debe alzarse la luz de la liberación.\n\nLa misión que se extiende ante nosotros es clara."
 BLM_event.4.a: "\"Reconstruid Bretaña. Con la mayor severidad, por encima de todo.\""

 BLM_event.5.t: "Proclamación de fundación escrita con sangre"
 BLM_event.5.d: "Bajo el cielo de Bretaña, por fin ha llegado una mañana verdadera.\n\nLa voluntad de un pueblo, levantada a través de sangre, sudor y desesperación, ha empujado la larga oscuridad hacia atrás, y la revolución se ha ganado el derecho a llamarse victoria. El éxito continuado de las operaciones, la adhesión de colaboradores internos y, en el momento decisivo, la fractura dentro de la propia organización criminal le concedieron al ejército revolucionario un único golpe definitivo… y ese golpe se convirtió en el punto de inflexión que dio la vuelta a la guerra.\n\nLa noche en que se tomó el corredor central del Mercado Negro, la ciudad aulló entre llamas rojas; incluso el bastión de la Banda del Casco, llegada del otro mundo, se derrumbó, y la resistencia llegó a su fin. Los remanentes Skeban declararon la rendición, y la alianza criminal fue desmantelada. Y sobre esas ruinas, el Gobierno Provisional de Bretaña leyó la Declaración de Fundación."
 BLM_event.5.a: "\"Nosotros, como verdaderos dueños de esta tierra, declaramos un Estado de Bretaña para los bretones, por los bretones.\""

 BLM_event.6.t: "Amanecer derrumbado"
 BLM_event.6.d: "La revolución bretona terminó por convertirse en una historia inconclusa. Este gran intento, iniciado entre sacrificios, determinación y una resistencia contenida, se apagó tras una lucha tan feroz como desesperada. Aunque los revolucionarios lograron tomar en varias ocasiones enclaves clave del Mercado Negro y parecieron encender la chispa del contraataque, acabaron desplomándose sin remedio ante la represalia de una alianza criminal superior en organización y recursos.\n\nLa revolución fracasó. Y no fue solo una derrota en el combate: fue la esperanza, devorada de nuevo por la oscuridad.\n\nEn las calles volvió a caer un telón negro, y los magnates del Mercado Negro empezaron a controlar Bretaña con métodos todavía más astutos y meticulosos. La gente dejó de rebelarse. No… incluso la palabra “rebelión” se olvidó, como si ya no existiera.\n\nY así, Bretaña volvió a ser una tierra de silencio."
 BLM_event.6.a: "La justicia fue derrotada; la independencia quedó como un sueño, y la libertad, tras exigir un precio demasiado caro, fue aplastada sin piedad."
 
 BLM_opposition.1.t: "Refugio de estudiantes de Arius: Jōmae Saori"
 BLM_opposition.1.d: "Acabamos de recibir un informe: un remanente de la rama de Arius ha entrado en nuestro Mercado Negro, liderando a unos cuantos que escaparon junto con la represión de la Escuela Filial de Arius en Trinity. Por lo visto, ella ha cruzado la frontera para llegar hasta nosotros tras evadir en repetidas ocasiones la persecución de Trinity.\n\nSegún nuestros agentes, tras reunirse con ella en persona, todo indica que huyó cruzando un río para escapar de los perseguidores de Trinity, y luego reunió a otras estudiantes en una situación similar para traerlas hasta este Mercado Negro. A juzgar por su comportamiento, parece haberse adaptado con facilidad al entorno del Mercado Negro."
 BLM_opposition.1.a: "Al final, los criminales siempre acaban reuniéndose en el mismo lugar."
 
 BLM_opposition.2.t: "Refugio de estudiantes de Arius: Imashino Misaki"
 BLM_opposition.2.d: "Hace un momento se informó que una estudiante, aparentemente de Arius, ha entrado en el Mercado Negro. Va vestida con pulcritud, pero sus acciones parecían sospechosas; tras seguirla, pudimos confirmar que era una estudiante procedente de la filial.\n\nNuestro agente, después de hablar con ella en persona, dice que parece una persona profundamente autodespreciativa, y que probablemente huyó para escapar de la persecución de Trinity."
 BLM_opposition.2.a: "La filial de Arius…"
 
 BLM_opposition.3.t: "Refugio de estudiantes de Arius: Hakari Atsuko"
 BLM_opposition.3.d: "Una estudiante con un atuendo muy llamativo ha entrado en el Mercado Negro. Debido a su vestimenta singular y sus modales de aire antiguo, parece que la detectamos con rapidez.\n\nSorprendentemente, tras hablar con ella en persona, parece pertenecer a la filial de Arius. Al parecer, escapó cruzando la frontera de Trinity, atravesó sola la cordillera de los Vosgos, avanzó hacia el sur y luego regresó por esta ruta en barco."
 BLM_opposition.3.a: "Dura en sus actos, pese a su apariencia."
 
 BLM_opposition.4.t: "Refugio de estudiantes de Arius: Tsuchinaga Hiyori"
 BLM_opposition.4.d: "Una monja sospechosa entró de repente en nuestro Mercado Negro y comenzó a husmear preguntando por información sobre la filial de Arius. Tras detenerla e interrogarla, resultó ser una estudiante de la filial de Arius, y parece que escapó hace poco.\n\nDespués de unas cuantas preguntas, reveló que su nombre es Tsuchinaga Hiyori y nos contó que logró escapar de Trinity mediante un método bastante peculiar."
 BLM_opposition.4.a: "¿Que escapó en tren desde allí?"

