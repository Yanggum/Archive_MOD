 BLM_gang_thugs_war: "Guerra de pandillas"
 BLM_gang_thugs_war_1: "Tensión en aumento"
 BLM_gang_thugs_war_1_desc: "La discordia entre los Skeban y la Banda del Casco, dentro de una relación de cooperación temporal tras la Gran Transferencia, ha hecho florecer aún más resentimientos. En medio de los movimientos de ambos grupos que invaden los intereses del otro, está por estallar una lucha de gran escala."
 BLM_gang_thugs_war_2: "Una noche de disparos"
 BLM_gang_thugs_war_2_desc: "La situación desatada después de que la Banda del Casco decapitara a un Skeban apunta claramente a una guerra total entre los Skeban y la Banda del Casco. La contienda ya ha estallado, y ahora debemos apoyar a la facción que saldrá victoriosa en el último momento."

 BLM_gang_thugs_war_thugs_side_1: "Actividad de Kurihama Akemi"
 BLM_gang_thugs_war_thugs_side_1_desc: "Kurihama Akemi es una figura con el prestigio de ser llamada la Skeban legendaria entre los forajidos. Arde de sed de venganza contra la Banda del Casco, que la encerró en la Oficina Correccional, y sus actividades supondrán una gran ventaja para los Skeban."
 BLM_gang_thugs_war_thugs_side_1_end: "Calmar a Kurihama Akemi"
 BLM_gang_thugs_war_thugs_side_1_end_desc: "Las actividades de Kurihama Akemi suponen una amenaza potencial para nuestro Mercado Negro, por lo que debemos detenerla para que no siga actuando del lado de los Skeban."
 BLM_gang_thugs_war_thugs_side_1_first: "Kurihama Akemi realiza su primera actividad"
 BLM_gang_thugs_war_thugs_side_1_end_tt: "Evita actividades adicionales de Kurihama Akemi apoyando a los Skeban.\n"
