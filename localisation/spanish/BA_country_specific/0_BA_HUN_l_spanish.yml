 HUN_SOV_research_group_desc:0 "Alianza de Investigación Hungría-Unión Soviética"
 HUN_Kun_Bela:0 "Béla Kun"
 HUN_elisabeth_maria_petznek:0 "Elisabeth Maria von Österreich"
 HUN_elisabeth_maria_habsburg:0 "Elisabeth Maria von Habsburg"
 HUN_Szalasi_Ferenc:0 "Ferenc Szálasi"
 BA_HUN_faction_1:0 "Segunda Alianza Central"
 HUN_GATHERING_STORM_DESC_1:0 "Tras la derrota del Imperio Dual en la Gran Guerra y su posterior disolución, logramos nuestra independencia, pero esta no fue del todo dulce. La recién fundada república colapsó incapaz de controlar el caos, seguida por la República Soviética que nos llevó a la humillación del Tratado de Trianon y finalmente, se instauró un Reino Regente bajo el mando de un almirante.\n\nEn 1935, una fuerza desconocida desembarcó en Europa y todo ardió. Las potencias aliadas que nos impusieron el tratado cayeron una tras otra, y Rumanía, como un tigre sin dientes, apenas sobrevive. Nos guste o no, se acerca el momento de decidir."
 HUN_PACT_OF_SHANHAIJING_FACTION:0 "Pacto Shanhaijing - Budapest"
 HUN_central_powers_FACTION:0 "Alianza Central"
 HUN_elizabeth_marie_habsburg_flag:0 "§YImperio Austrohúngaro§! restaurado"


#중점
#엘리자베트 마리
 HUN_elizabeth_marie:0 "La Gran Duquesa Roja"
 HUN_elizabeth_marie_desc:0 "La Gran Duquesa Roja, Elisabeth Marie, es considerada una figura extremadamente progresista dentro de la Casa de Habsburgo. Restaurando su trono e invitándola al poder, podremos lograr tanto la restauración de los Habsburgo como el establecimiento de una Hungría libre al mismo tiempo."

 HUN_dissolution_of_parliament:0 "Disolución del Parlamento"
 HUN_dissolution_of_parliament_desc:0 "Disolveremos el parlamento actual e implementaremos un nuevo sistema político, reorganizando así la estructura de gobierno del país." 

 HUN_parliamentary_takeover:0 "Control del Parlamento"
 HUN_parliamentary_takeover_desc:0 "Como miembro del Partido Socialdemócrata, Elisabeth Marie ejercerá una fuerte influencia sobre el parlamento." 

 HUN_social_welfare_budget_increase:0 "Aumento del presupuesto social"
 HUN_social_welfare_budget_increase_desc:0 "Incrementaremos significativamente el presupuesto de bienestar social para mejorar la calidad de vida de la población y reforzar la red de seguridad social, asegurándonos de que nadie más muera de hambre."

 HUN_womens_suffrage:0 "Sufragio femenino"
 HUN_womens_suffrage_desc:0 "Debemos otorgar el derecho al voto a las mujeres, promoviendo así su participación política y la igualdad."

 HUN_worker_rights_advancement:0 "Incorporación de los sindicatos"
 HUN_worker_rights_advancement_desc:0 "Invitaremos a los sindicatos al gobierno para mejorar los derechos laborales y aumentar el apoyo al régimen."

 HUN_economic_policy_shift:0 "Cambio en la política económica"
 HUN_economic_policy_shift_desc:0 "La política económica actual se basa en una intervención mínima del Estado en el mercado. Sin embargo, esta política ha causado numerosos problemas económicos, por lo que debemos modificarla."

 HUN_economic_control:0 "Refuerzo del control económico"
 HUN_economic_control_desc:0 "Fortaleceremos el control y la regulación de la actividad económica del país para aumentar su estabilidad y eficiencia."

 HUN_self_determination:0 "Autodeterminación"
 HUN_self_determination_desc:0 "Estableceremos un Consejo Nacional de Minorías para garantizar la autodeterminación de cada grupo étnico, avanzando hacia una federación igualitaria."
 
 HUN_austria_restoration:0 "Liberación de Austria"
 HUN_austria_restoration_desc:0 "Nuestros compatriotas austriacos han caído bajo la opresión de invasores de otro mundo. Liberaremos Austria y proclamaremos la restauración del Imperio Austrohúngaro."

 HUN_danube_federation:0 "Federación del Danubio"
 HUN_danube_federation_desc:0 "El antiguo Imperio de los Habsburgo se construyó sobre la dominación de otros pueblos. Ahora, dejaremos atrás ese pasado y estableceremos una federación igualitaria del Danubio."

 HUN_habsburg_federation:0 "Imperio Constitucional de los Habsburgo"
 HUN_habsburg_federation_desc:0 "Reconstruiremos un imperio constitucional bajo el liderazgo de la Casa de Habsburgo, estableciendo un fuerte gobierno central e impulsando más reformas socioeconómicas."

 HUN_centralization:0 "Nueva Centralización"
 HUN_centralization_desc:0 "Para implementar más reformas, estableceremos un gobierno altamente centralizado que abarque no solo el ámbito social, sino también la economía."

 HUN_women_soldiers:0 "Creación de tropas femeninas"
 HUN_women_soldiers_desc:0 "Formaremos unidades femeninas en el ejército, promoviendo la igualdad de género dentro de las fuerzas armadas y ampliando el papel de las mujeres."

 HUN_yugoslavia_alliance:0 "Alianza con Yugoslavia"
 HUN_yugoslavia_alliance_desc:0 "Dejando atrás los conflictos del pasado, una alianza estratégica con Yugoslavia será de gran beneficio para el futuro y el desarrollo mutuo de nuestras naciones."

 HUN_austria_integration:0 "Unificación con Austria"
 HUN_austria_integration_desc:0 "Ahora que hemos liberado Austria, podemos formar una federación como el primer paso hacia la creación de la Federación del Danubio."

 HUN_yugoslavia_unification:0 "Integración Federal de Yugoslavia"
 HUN_yugoslavia_unification_desc:0 "Ahora que controlamos la región yugoslava, podemos invitar a Yugoslavia a unirse como miembro de la Federación del Danubio."

 HUN_yugoslavia_federation_proposal:0 "Propuesta de Federación a Yugoslavia"
 HUN_yugoslavia_federation_proposal_desc:0 "Ahora que Yugoslavia mantiene una relación cercana con nuestro país, podemos proponerle unirse a nuestra federación."

 HUN_federal_empire:0 "Gran Federación del Danubio"
 HUN_federal_empire_desc:0 "Las naciones del Danubio permanecerán unidas para nunca más separarse. Como una república federal igualitaria de múltiples pueblos, la Federación del Danubio existirá para siempre."

