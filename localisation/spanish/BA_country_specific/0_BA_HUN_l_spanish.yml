#툴팁
 BA_HUN_tt_0:0 "Si nuestras fuerzas superan las §G100,000 soldados§! o estamos aliados con potencias como @SOV§Rusia Soviética§!, es más probable que @ROM§Y Rumanía§! acepte nuestras demandas."
 BA_HUN_tt_1:0 "Si nuestras fuerzas superan las §G100,000 soldados§! o estamos aliados con potencias como @SOV§Rusia Soviética§!, es más probable que @YUG§0 Yugoslavia§! acepte nuestras demandas."
 BA_HUN_tt_2:0 "§RLos disidentes serán eliminados.§!\nCuando la purga termine, la §Yamplia hostilidad anticomunista§! desaparecerá de la mentalidad nacional."
 BA_HUN_tt_3:0 "§RFinalmente, la unificación socialista de los Balcanes ha sido completada.§!"
 BA_HUN_tt_4:0 "§RTu nación será anexada por Hungría, lo que resultará en el fin de la partida.§!"
 BA_HUN_tt_5:0 "§RLos magiares han cruzado un punto sin retorno.§!"
 BA_HUN_tt_6:0 "§RTodo ha terminado.§!"
 BA_HUN_tt_7:0 "Punto clave para la ruta de §YSocialismo Balcánico§!."
 BA_HUN_tt_8:0 "Punto clave para la ruta de §YSoviético§!."
 BA_HUN_tt_9:0 "Declaramos la guerra a @SOV§Rusia Soviética§!.\nAdemás, @UKR§C Ucrania§!, a la que apoyamos, también se levantará contra ellos."
 BA_HUN_tt_10:0 "Se aplicará un §Rembargo§! a todos los países con ideología §Cdemócrata§!."
 BA_HUN_tt_11:0 "Se aplicará un §Rembargo§! a todas las principales monarquías al inicio que no sean §Rcomunistas§!.\n§Y@ENG Reino Unido\n@ITA Italia\n@JAP Japón\n@GRE Grecia\n@YUG Yugoslavia\n@BUL Bulgaria\n@ROM Rumanía\n@HOL Países Bajos\n@MAN Manchukuo§!"
 BA_HUN_tt_12:0 "Se eliminará cualquier indicio de §Rcomunismo prohibido§!."
 BA_HUN_tt_13:0 "Se aplicará un §Rembargo§! a todos los países con ideología §8fascista§!."
 BA_HUN_tt_14:0 "Los países balcánicos de nuestra esfera también recibirán este espíritu nacional."
 BA_HUN_tt_15:0 "Se obtendrá un §Ycasus belli§! contra todas las grandes potencias §8fascistas§!."
 BA_HUN_tt_16:0 "Hungría se une a la @SOV§Federación Socialista Soviética§!."
 BA_HUN_tt_17:0 "Cuando se elimine el espíritu nacional:\nse ganará §G+25.00% estabilidad§!."
 BA_HUN_tt_18:0 "§RUn imperio inestable se ha derrumbado una vez más.§!"
 HUN_uprising_strength_tt:0 "Fuerza actual de los §Ysocialistas§! basada en el apoyo: [HUN_communist_coup_target.Get_Hun_Uprising_strength]\nEsto depende de su apoyo §Ycomunista§! y del número de trabajadores armados."
 BA_HUN_conflict_tt:0 "§RSi la estabilidad cae por debajo del 20%, el imperio colapsará.§!\n"

