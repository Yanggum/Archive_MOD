 BA_HUN_wprnrxhdgkq:0 "Unificación Imperial"  
 BA_HUN_wprnrxhdgkq_desc:0 "\n\n£GFX_BA_HUN_decisions_OHHUNG\n\n\n\n\n                                             §Y\"Ni divididos ni separados.\"§!\n\n¿Qué nos dejó el Tratado de Versalles? División, conflicto y un resentimiento hacia los vencedores. Nuestro imperio fue desmembrado por Versalles, y en ese proceso, numerosos conflictos nos infligieron profundas heridas, generando desilusión hacia nuestra derrotada patria. Y de ese resentimiento hacia los vencedores brotó un afán de venganza que nos empujó a afilar nuestras espadas... hasta que todo cambió.\n\nUna fuerza misteriosa llegó a Europa, y la situación se transformó radicalmente. Hungría logró esquivar la catástrofe, pero los vencedores de la Gran Guerra la sufrieron en carne propia.\nNuestro reino actuó con rapidez: ignoramos el Tratado de Versalles, proclamamos el renacimiento de los Habsburgo y, tras liberar a Austria y Chequia de los invasores, declaramos el Imperio.\n\n                                         §t¡Nuestro Imperio será el último del mundo!§!"  
