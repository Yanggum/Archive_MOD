#이벤
 BA_HUN_event.1.t:0 "Reclamación húngara sobre Transilvania"
 BA_HUN_event.1.desc:0 "[HUN.GetName] ha reclamado que la región de §YTransilvania§!, perdida mediante el Tratado de Trianón, debe ser devuelta a Hungría ahora que dicho tratado ha sido anulado.\n\nAunque pueda haber sido su territorio, ¿acaso no es ahora parte legítima de nuestro país? Si entregamos esas tierras, la legitimidad y el prestigio de nuestro gobierno podrían verse gravemente afectados."
 BA_HUN_event.1.a:0 "Evitemos la guerra."
 BA_HUN_event.1.b:0 "Transilvania debe seguir siendo parte de Rumanía."

 BA_HUN_event.2.t:0 "Reclamación húngara sobre Voivodina"
 BA_HUN_event.2.desc:0 "[HUN.GetName] ha reclamado que la región de §YVoivodina y Banato Occidental§!, perdida mediante el Tratado de Trianón, debe ser devuelta a Hungría ahora que dicho tratado ha sido anulado.\n\nAunque pueda haber sido su territorio, ¿acaso no es ahora parte legítima de nuestro país? Si entregamos esas tierras, la legitimidad y el prestigio de nuestro gobierno podrían verse gravemente afectados."
 BA_HUN_event.2.a:0 "Evitemos la guerra."
 BA_HUN_event.2.b:0 "Voivodina debe seguir siendo parte de Serbia."

 BA_HUN_event.3.t:0 "La unificación de los Balcanes"
 BA_HUN_event.3.desc:0 "Finalmente, tras largos debates, Hungría se fusionará en una única nación como la §YRepública Socialista Balcánica§!.\n\nBajo la bandera roja y la rosa roja, magiares y pueblos balcánicos se han unido para formar una nueva gran potencia en Europa. Como la Unión Soviética, pero a diferencia de ella, pretendemos convertirnos en el §Yverdadero estado socialista§!, tiñendo el mundo entero de rojo, haciendo que florezcan rosas rojas por todo el mundo.\n\nSea como sea, ¡somos la única federación socialista de los Balcanes! ¡Viva el socialismo!"
 BA_HUN_event.3.a:0 "¡Viva la Federación Socialista Balcánica!"

 BA_HUN_event.9.t:0 "Inestabilidad en la @UKRRepública Socialista Soviética de Ucrania"
 BA_HUN_event.9.desc:0 "La República Socialista Soviética de Ucrania atraviesa actualmente una grave crisis, con múltiples levantamientos, huelgas y sabotajes.\nExpertos afirman que no se trata únicamente de un conflicto étnico, sino de un complot de [HUN.GetName] para desestabilizar la unión.\n\nAunque no está claro si esto es verdad o no."
 BA_HUN_event.9.a:0 "Hmm..."

 BA_HUN_event.12.a:0 "¡Traidores!" 

 BA_HUN_event.13.t:0 "Reincorporación de Horthy como oficial"
 BA_HUN_event.13.desc:0 "Miklós Horthy, líder de nuestro reino, fue anteriormente almirante de la desaparecida Austria-Hungría.\nPara reforzar nuestra defensa nacional, se plantea su reincorporación como oficial.\n\nAunque fue oficial naval, dadas las circunstancias actuales, podría ser necesario en el ejército de tierra."
 BA_HUN_event.13.a:0 "¡Que regrese a la marina!"
 BA_HUN_event.13.b:0 "Lo necesitamos en el ejército."

 BA_HUN_event.14.t:0 "Hungría reclama la separación de Galitzia"
 BA_HUN_event.14.desc:0 "Tras el asesinato de Horthy y la adopción de una política pro-soviética, Hungría nos presiona para separar la región de Galitzia de Polonia y establecer allí un gobierno socialista.\n\nSi rechazamos las demandas de Hungría, podría estallar la guerra."
 BA_HUN_event.14.a:0 "Evitemos la guerra."
 BA_HUN_event.14.b:0 "¡Galitzia debe seguir siendo polaca!"

 BA_HUN_event.15.t:0 "¡Campesinos contra la colectivización!"
 BA_HUN_event.15.desc:0 "Los campesinos que se oponen a la colectivización han organizado una revuelta."
 BA_HUN_event.15.a:0 "¡Quemen a esos reaccionarios pequeño-burgueses!"

 BA_HUN_event.16.t:0 "Purgar a los reaccionarios"
 BA_HUN_event.16.desc:0 "Con la instauración del gobierno obrero y campesino, no debemos olvidar a los capitalistas y monárquicos que explotaron a nuestro pueblo.\n\nDebemos mostrar a los reaccionarios que aún quedan dentro de Hungría el verdadero sabor de la revolución. Así construiremos una verdadera utopía socialista para trabajadores y campesinos. Debemos actuar con rapidez."
 BA_HUN_event.16.a:0 "¡Purguen a todos!"

 BA_HUN_event.17.t:0 "El fin de la Gran Purga"
 BA_HUN_event.17.desc:0 "Tras tres fases de purga, por fin ha terminado la larga y sangrienta purga. Puede que hayamos eliminado a muchos, pero creemos que fue la decisión correcta por el bien de la patria, la nación, nuestro sistema y el socialismo.\n\nSea como sea, la purga ha terminado y se abre un nuevo futuro para nosotros. Nadie sabe si será brillante o sombrío, pero siempre hemos superado la adversidad.\n\nSigamos adelante, por nuestra orgullosa patria, [HUN.GetName]."
 BA_HUN_event.17.a:0 "Misión cumplida."

 BA_HUN_event.18.t:0 "Primera Gran Purga"
 BA_HUN_event.18.desc:0 "Apenas han pasado dos semanas desde que comenzamos a eliminar a los reaccionarios y ya hemos capturado a numerosos capitalistas, simpatizantes fascistas y monárquicos contrarrevolucionarios. Debemos mostrarles a estos enemigos del socialismo lo que significa un estado de trabajadores y campesinos.\n\nEs lo justo."
 BA_HUN_event.18.a:0 "Eliminadlos a todos."

 BA_HUN_event.19.t:0 "Segunda Gran Purga"
 BA_HUN_event.19.desc:0 "Tras la sangrienta represión del mes pasado, muchas figuras clave del antiguo Reino de Hungría, tanto civiles como militares, han aparecido en las listas de purga. Aunque puedan ser administradores y oficiales competentes, no dejan de ser esclavos y cómplices del monarquismo.\n\nLa decisión es tuya. Si los perdonas, podrías ganar recursos valiosos... o cometer un terrible error.\n\nDecide. ¿Qué harás?"
 BA_HUN_event.19.a:0 "¡No hay piedad para los enemigos del socialismo!"
 BA_HUN_event.19.b:0 "Tal vez aún sean útiles."

 BA_HUN_event.20.t:0 "Tercera Gran Purga"
 BA_HUN_event.20.desc:0 "Aunque hemos eliminado a la mayoría de los infiltrados, puede que aún queden espías que amenacen nuestro régimen. Erradicarlos costará sangre y sacrificios, pero si así garantizamos la estabilidad del país, del sistema y del socialismo, será un precio justo.\n\nQuizá las futuras generaciones juzguen si esto fue por la estabilidad, la paz y la prosperidad de Hungría, o el peor error de nuestra historia.\n\nLa decisión es tuya. Elige con cuidado."
 BA_HUN_event.20.a:0 "¡Eliminad hasta el último traidor!"
 BA_HUN_event.20.b:0 "Tal vez sea demasiado arriesgado..."

 BA_HUN_event.21.t:0 "Invitación de [FROM.GetName] a la Federación del Danubio"
 BA_HUN_event.21.desc:0 "[FROM.GetName] nos ha enviado una invitación para integrar nuestra nación en su federación. Tras proclamar la Federación del Danubio, [FROM.GetName] ha realizado esfuerzos diplomáticos y políticos para unificar a los países vecinos, y parece que somos su siguiente objetivo.\n\nSi aceptamos, podríamos traer una paz duradera al Danubio, pero si rechazamos la oferta, defenderemos la independencia de Yugoslavia."
 BA_HUN_event.21.a:0 "Nos uniremos a la federación."
 BA_HUN_event.21.b:0 "Siempre seremos Yugoslavia."

 BA_HUN_event.22.t:0 "[FROM.GetName]: Rechazo a unirse a la Federación del Danubio"
 BA_HUN_event.22.desc:0 "A pesar de nuestros esfuerzos diplomáticos y políticos, [FROM.GetName] ha rechazado unirse a la Federación del Danubio. Alegan que no pueden abandonar la independencia de Yugoslavia y comparan nuestra propuesta con los peligrosos conflictos étnicos de la región.\n\nPodríamos imponer la unión por la fuerza, pero jamás lograríamos una verdadera integración."
 BA_HUN_event.22.a:0 "La paz es lo más valioso."
 BA_HUN_event.22.b:0 "¡Todos ustedes son nuestros enemigos!"

 BA_HUN_event.23.t:0 "[FROM.GetName] se une a la Federación del Danubio"
 BA_HUN_event.23.desc:0 "[FROM.GetName] ha aceptado nuestra invitación para unirse a la Federación del Danubio y ha firmado los acuerdos para iniciar el proceso de unificación. Anuncian que la unión de la región del Danubio pondrá fin a siglos de conflictos en los Balcanes y traerá una paz duradera. [FROM.GetName] cooperará activamente con nuestra causa."
 BA_HUN_event.23.a:0 "Una federación más poderosa."

 BA_HUN_event.101.t:0 "Difusión del sentimiento socialista en [ROOT.GetName]"
 BA_HUN_event.101.desc:0 ""
 BA_HUN_event.101.a:0 "Malditos comunistas..."
 BA_HUN_event.102.t:0 "Huelga de trabajadores en [ROOT.GetName]"
 BA_HUN_event.102.desc:0 ""
 BA_HUN_event.103.t:0 "Trabajadores armados"
 BA_HUN_event.103.desc:0 ""
 BA_HUN_event.104.t:0 "Los trabajadores exigen un cambio de gobierno"
 BA_HUN_event.104.desc:0 ""
 BA_HUN_event.104.a:0 "¿De verdad creen que son algo importante?"
 BA_HUN_event.104.b:0 "Si eso es lo que desean..."
 BA_HUN_event.105.t:0 "Oferta de ayuda de Hungría"
 BA_HUN_event.105.desc:0 "Hungría, que ha apoyado nuestra revolución, nos propone intervenir directamente. Si aceptamos esta oferta, podremos lograr la revolución."
 BA_HUN_event.105.a:0 "Aceptamos la oferta."
 BA_HUN_event.105.b:0 "¡No somos marionetas!"
 BA_HUN_event.106.t:0 "Los Balcanes unificados"
 BA_HUN_event.106.desc:0 ""
 BA_HUN_event.106.a:0 "¡Viva la Unión Balcánica!"
 BA_HUN_event.106.b:0 "No lo necesitamos."
 BA_HUN_event.107.t:0 "[HUN.GetName] se somete a nosotros"
 BA_HUN_event.107.desc:0 ""
 BA_HUN_event.107.a:0 "Bienvenidos, camaradas."
 BA_HUN_event.108.t:0 "Liberación de Austria - Plan de operaciones"
 BA_HUN_event.108.desc:0 "Debemos elegir el plan para la liberación de Austria.\n\nEl alto mando húngaro propone el 'Plan Viena', que consiste en atacar rápidamente Viena, mientras que otros sugieren el 'Plan Innsbruck', que implica consolidar el frente antes de lanzar la ofensiva."
 BA_HUN_event.108.a:0 "Se elige el Plan Viena."
 BA_HUN_event.108.b:0 "Se elige el Plan Innsbruck."
 BA_HUN_event.109.t:0 "El precio de la revolución"
 BA_HUN_event.109.desc:0 "Hungría ha elogiado el cambio pacífico de nuestro gobierno, pero nos ha enviado un ultimátum exigiendo la eliminación completa de la oposición interna. Podemos seguir sus órdenes o enfrentarnos a ellos."

 BA_HUN_event.200.t:0 "Reunificación del territorio austriaco"
 BA_HUN_event.200.desc:0 "Ahora que hemos restaurado el Imperio de los Habsburgo y liberado la región austriaca, podemos proclamar el legítimo retorno del Imperio Austrohúngaro."
 BA_HUN_event.200.a:0 "¡El gobierno de los Habsburgo ha regresado!"

 BA_HUN_event.900.t:0 "La caída del Imperio"
 BA_HUN_event.900.desc:0 ""
 BA_HUN_event.900.a:0 "Maldición."

#뉴스이벤
 BA_HUN_news.1.t:0 "Rumanía acepta las exigencias húngaras"
 BA_HUN_news.1.desc:0 "Rumanía ha aceptado la demanda húngara de ceder Transilvania.\n\nLa firme exigencia de Hungría para recuperar sus antiguos territorios ha sido aceptada, y Transilvania, hogar de los magiares, ha regresado a manos húngaras."
 BA_HUN_news.1.a:0 "Sorprendente."
 BA_HUN_news.2.t:0 "Rumanía rechaza las exigencias húngaras"
 BA_HUN_news.2.desc:0 "Rumanía ha rechazado la demanda húngara de ceder Transilvania.\n\nLa firme exigencia de Hungría para recuperar sus antiguos territorios ha sido rechazada, y las autoridades diplomáticas húngaras están considerando una guerra contra Rumanía."
 BA_HUN_news.2.a:0 "¿Esto llevará a la guerra?"
 BA_HUN_news.3.t:0 "Yugoslavia acepta las exigencias húngaras"
 BA_HUN_news.3.desc:0 "Yugoslavia ha aceptado la demanda húngara de ceder Voivodina.\n\nLa firme exigencia de Hungría para recuperar sus antiguos territorios ha sido aceptada, y Voivodina, hogar de los magiares, ha regresado a manos húngaras."
 BA_HUN_news.3.a:0 "Sorprendente."
 BA_HUN_news.4.t:0 "Yugoslavia rechaza las exigencias húngaras"
 BA_HUN_news.4.desc:0 "Yugoslavia ha rechazado la demanda húngara de ceder Voivodina.\n\nLa firme exigencia de Hungría para recuperar sus antiguos territorios ha sido rechazada, y las autoridades diplomáticas húngaras están considerando una guerra contra Yugoslavia."
 BA_HUN_news.4.a:0 "¿Esto llevará a la guerra?"
 BA_HUN_news.5.t:0 "Hungría unifica los Balcanes"
 BA_HUN_news.5.desc:0 "Hoy, [HUN.GetLeader] ha declarado que las naciones socialistas de los Balcanes se han fusionado, formando la Federación Socialista de los Balcanes.\n\nEl eje del mundo está girando hacia el socialismo, y ha surgido un nuevo poder dominante en los Balcanes."
 BA_HUN_news.5.a:0 "Una sola y unida región balcánica..."

