 FRA_GATHERING_STORM_DESC_1: "Francia, país de la cultura y las artes, y vencedora de la Gran Guerra, obtuvo una gloria deslumbrante al derrotar a Alemania. Pero cuando los invasores de otra dimensión incendiaron toda Europa y marcharon hacia Francia, en 1935, mientras el país seguía sumido en el caos político, Francia resistió… y aun así fue derrotada, viéndose obligada a tomar el camino del exilio.\n\nLa Francia inmediatamente posterior al exilio está envuelta en una oscuridad total. En el interior, el desorden sigue reinando, pero todos buscan juntos el modo de recuperar la metrópoli. Si todavía son franceses, el largo viaje para recuperar la patria ya está tendido ante sus ojos."

