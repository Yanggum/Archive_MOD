 FRA_propaganda_FRA_1:0 "§4¡Sirve a la patria!§!"
 FRA_propaganda_FRA_2:0 "§4¡Refuerza la ofensiva!§!"
 FRA_propaganda_FRA_3:0 "§4La tricolor ondea§!"
 FRA_propaganda_FRA_4:0 "§4Idealismo francés§!"
 FRA_propaganda_FRA_5:0 "§4'¡Ya casi!' - Invierte en la liberación de Francia con bonos de defensa§!"
 FRA_propaganda_FRA_6:0 "§4¡Sigue las órdenes del Mariscal!§!"
 FRA_propaganda_FRA_7:0 "§4¡Todo por la liberación!§!"

#프랑스 이벤트
 FRA_pet.1.t:0 "El león de Verdún"
 FRA_pet.1.d:0 "África del Norte le resultaba familiar. El paisaje al otro lado de la ventana, que le evocaba el recuerdo de haber servido en la mayor guerra del periodo de entreguerras hace diez años, hizo que apagara su pipa y se levantara del asiento. [FRA_philippe_petain.getname] no encontraba agradable lo que estaba ocurriendo. Para un oficial francés de élite, la derrota de la patria era humillante y desoladora, y el hecho de que ese asunto engorroso y a la vez crucial recayera sobre él le suponía una enorme carga. Aun así, comprendía de manera instintiva que este era precisamente el último momento en el que podía servir a su país, y también sabía hacia dónde debía dirigirse el camino para convertirse en un héroe.\n\nEl secretario, frente al despacho, abrió la boca.\n\n\"Excelencia, el informe de labores de este mes.\""
 FRA_pet.1.a:0 "\"¡La patria me llama!\""
 FRA_pet.2.t:0 "Una decisión por la patria"
 FRA_pet.2.d:0 "A ojos de [FRA_philippe_petain.getname], la coyuntura presente era un estado de emergencia, y sin un método verdaderamente integral, Francia no podría avanzar hacia la reconquista de la metrópoli. [FRA_philippe_petain.getname] luchará por recuperar la herencia de los antepasados, aun si para ello debe renunciar de forma 'audaz' al legado del colonialismo francés y concentrarse en fortalecer el poder nacional."
 FRA_pet.2.a:0 "¡Viva el Mariscal!"
 FRA_pet.3.t:0 "La huida de Pierre Laval"
 FRA_pet.3.d:0 "Aunque el golpe reciente había paralizado el Parlamento, Pierre Laval todavía podía conservar el cargo de primer ministro. Sin embargo, este levantamiento militar se convirtió para él en una amenaza directa, y el futuro sombrío del gobierno en el exilio no le resultaba atractivo. En su lugar, decidió llevar a cabo aquello que llevaba días sopesando."
 FRA_pet.3.a:0 "\"¡Vamos, deprisa, largo de aquí!\""
 FRA_pet.30.t:0 "La huida de Pierre Laval"
 FRA_pet.30.d:0 "Aunque el golpe reciente había paralizado el Parlamento, Pierre Laval todavía podía conservar el cargo de primer ministro. Sin embargo, este levantamiento militar se convirtió para él en una amenaza directa, y el futuro sombrío del gobierno en el exilio no le resultaba atractivo.\n\nPor ello, Pierre Laval ha huido hacia el territorio de nuestra academia, y está mostrando movimientos orientados a desempeñar un papel de mediador entre los franceses del país y nuestra administración."
 FRA_pet.30.a:0 "Por ahora, observemos."
 FRA_pet.4.t:0 "\"Las brasas de la República\""
 FRA_pet.4.d:0 "[FRA_maurice_gamelin.getname] era un héroe de la Gran Guerra y un veterano respetado dentro del ejército. Cuando París cayó, se quedó sentado en su silla, llorando sin consuelo. Aquel gesto nacía de su patriotismo hacia la República y la democracia que veneraba. El espíritu constitucional de Francia había quedado suspendido por la ley marcial de [FRA_philippe_petain.getname], y habiéndolo perdido todo—metrópoli y régimen—, el distinguido oficial de estado mayor no era más que un soldado aguardando órdenes."
 FRA_pet.4.a:0 "\"¡Recuerdo el espíritu del 14 de julio!\""
 FRA_pet.4_tt:0 "§g[ROOT.getname] intentará aspirar al puesto de presidente provisional de la comisión militar si Pétain es depuesto.§!"
 FRA_pet.5.t:0 "\"La cruz de Lorena\""
 FRA_pet.5.d:0 "[ROOT.getname] es ahora mismo una figura que atrae enorme atención dentro del ejército francés. Hace apenas unos meses, derrotó la ciudad-fortaleza llamada Eridu, un compendio total de tecnologías futuristas fusionadas. Sus fuerzas acorazadas combatieron con valentía y el público de toda Francia lo aclama. Aún no es más que una estrella en ascenso, pero con el paso del tiempo, él mismo sabe que terminará ocupando un puesto de primer orden. El alto mando francés, en cambio, sigue atrapado en el viejo mundo. Pronto, Francia parecerá necesitar su gobierno."
 FRA_pet.5.a:0 "\"Francia solo ha perdido una batalla.\""
 FRA_pet.6.t:0 "Revolución Nacional"
 FRA_pet.6.d:0 "\"Revolución Nacional\" es el programa de reestructuración social a escala estatal con el que el Mariscal define la causa de la derrota de la Tercera República no solo como incompetencia militar, sino también como resultado del 'liberalismo', el 'socialismo', el 'desorden' y la 'inmoralidad' internos, y busca superarlos. Para el Mariscal, la reconquista de la metrópoli debe ir acompañada de crecimiento exterior y de disciplina interior. ¡Bajo el lema 'Trabajo, Familia, Patria', Francia volverá a levantarse!"
 FRA_pet.6.a:0 "Todos esperan su guía."
 FRA_pet.7.t:0 "Carta del Trabajo"
 FRA_pet.7.d:0 "El Mariscal ha iniciado una reforma laboral a gran escala para impedir cualquier intento marxista o socialista de subvertir la República. La \"Carta del Trabajo\", anunciada en [GetMonth], reconoce como única organización obrera legítima a un solo sindicato corporativo controlado por el Estado; prohíbe y disuelve todos los demás sindicatos, y busca establecer un sistema económico de corporativismo estatal inspirado en el orden católico tradicional."
 FRA_pet.7.a:0 "¡Sirvamos a la patria!"

 FRA_pet.8.t:0 "El papel de la mujer"
 FRA_pet.8.d:0 "Durante muchos años, el orden familiar tradicional se ha derrumbado y ha sido reemplazado por una nueva visión de la familia: corrupta y decadente. Eso, sin duda, está mal. El Mariscal devolverá el papel de las mujeres a su lugar original, sobre la base del orden católico."
 FRA_pet.8.a:0 "Todo vuelve a su sitio."
 FRA_pet.8_tt:0 "§gLas élites musulmanas con poder en África del Norte prefieren esta política.§!"
 FRA_dar.1.t:0 "El almirante administrador"
 FRA_dar.1.d:0 "[FRA_francois_darlan.getname] pudo, al fin, disfrutar de un sueño profundo. Las noches en vela planificando el exilio, el traslado de decenas de miles de soldados y civiles, y la rabia que solo llegó después, al asumir que la patria se había perdido, lo habían atormentado; pero tras todo aquello, logró recuperar cierta calma. Por suerte, los políticos del Parlamento—tan difíciles de creer—estaban maniatados por el mariscal, y eso le permitió recomponer su esperanza. Cuando se levantó de la cama, su ayudante le trajo noticias."
 FRA_dar.1.a:0 "\"¡Almirante, lo han nombrado primer ministro!\""
 FRA_appointed_by_prime_minister_tt:0 "§Y[ROOT.getname]§! es nombrado §Yprimer ministro del Gabinete de guerra§!:\n"
 FRA_dar.2.t:0 "Exilio industrial"
 FRA_dar.2.d:0 "Hemos llevado a cabo con éxito un plan adicional de exilio de cuatro meses desde el sur de la metrópoli. La red administrativa de [MIL.getname], aún limitada al norte y a las zonas urbanas, no pudo impedir el contacto y el trabajo de inteligencia a gran escala en el campo y en los puertos; como resultado, hemos logrado asegurar más capital y mano de obra de lo esperado al inicio del exilio."
 FRA_dar.2.a:0 "Menos mal."
 FRA_dar.3.t:0 "El Mediterráneo"
 FRA_dar.3.d:0 "El primer ministro [FRA_francois_darlan.getname] entiende mejor que nadie que la futura operación para reconquistar la metrópoli será un desembarco a gran escala. Y también sabe qué es lo más necesario en una operación así: una supremacía naval aplastante. Por ello, ha decidido asignar un presupuesto especial e invertir en producción de cara a una gran batalla naval en un futuro cercano."
 FRA_dar.3.a:0 "¡El Mediterráneo es nuestro!"
 FRA_dar.4.t:0 "Más allá de las montañas"
 FRA_dar.4.d:0 "[FRA_francois_darlan.getname] se puso en contacto con [ITA.getname] para solicitar una concesión militar sencilla: permitir que, en el marco de un programa destinado a provocar un levantamiento de milicias de la Resistencia bien organizadas en la frontera entre [MIL.getname] y [ITA.getname], se ocupe temporalmente una porción de territorio para usarla como zona de entrenamiento."
 FRA_dar.4.a:0 "¿Aceptarán la solicitud?"
 FRA_prov_event.1.t:0 "Exilio de la Resistencia"
 FRA_prov_event.1.d:0 "Muchos miembros de la Resistencia que combatían en la metrópoli han reconocido sus límites y se han unido al gobierno de emergencia."
 FRA_prov_event.1.a:0 "¡Bienvenidos, camaradas!"
 FRA_prov_event.3.t:0 "La gran insurrección en África del Norte, colapso del gobierno de emergencia"
 FRA_prov_event.3.d:0 "\"Emergencia\" y \"movilización\" no eran más que otra forma de decir \"dictadura\" y \"esclavitud\". La orgullosa \"Libertad, Igualdad, Fraternidad\" de la patria que recordábamos jamás podía convertirse en el lema de un opresor.\n\nFrancia será recordada como el primer imperio colonial destruido por sus colonizados. Hoy, el gobierno de emergencia francés ha colapsado a causa de una revolución masiva encabezada por ejércitos independentistas de innumerables tribus africanas—incluyendo Argelia, Túnez y Marruecos—y por soldados que simpatizan con su causa."
 FRA_prov_event.3.a:0 "El gobierno debe poner en práctica lo que todos desean universalmente. - Jean-Jacques Rousseau"
 FRA_prov_event.3.a_tt:0 "§REl gobierno de emergencia, con su régimen violento, ha recibido de vuelta el boomerang. Pagarán el precio que les corresponde.§!"
 FRA_prov_event.4.t:0 "Perspectivas de la economía norteafricana"
 FRA_prov_event.4.d:0 "Si hay algo bueno dentro de la desgracia, es que el gobierno francés invirtió mucho en la industria de Argelia durante décadas. Esta región podrá industrializarse con rapidez."
 FRA_prov_event.4.a:0 "¡Fue la visión de Carlos X!"
 FRA_prov_event.5.t:0 "Reforma del Código Indígena"
 FRA_prov_event.5.d:0 "El Código Indígena francés se refiere al conjunto de leyes discriminatorias aplicadas a los nativos coloniales. Según estas normas, se distingue entre ciudadanos franceses y nativos: a estos últimos no se les garantizan derechos de ciudadanía ni voto, y además quedan expuestos a castigos arbitrarios y a la movilización al trabajo forzoso por decisión de un administrador, sin juicio previo. Para calmar la huelga general, les concederemos el derecho a ser juzgados, una ciudadanía limitada, y restringiremos el reclutamiento indiscriminado sobre ellos."
 FRA_prov_event.5.a:0 "¡Ciudadanos de segunda!"
 FRA_prov_event.6.t:0 "La oposición contra la dictadura militar"
 FRA_prov_event.6.d:0 "Entre los miembros de la coalición mayoritaria del Parlamento, algunos diputados de la \"Sección Francesa de la Internacional Obrera (SFIO)\" y del Partido Comunista Francés que siguieron al exilio han comenzado a criticar la toma del poder antidemocrática de [FRA_philippe_petain.getname]."
 FRA_prov_event.6.a:0 "No hay que pensarlo mucho. ¡Enciérrenlos a todos!"
 FRA_custody:0 "§RDetención§!"
 FRA_prov_event.8.t:0 "La lucha por la diplomacia"
 FRA_prov_event.8.d:0 "Desde la decisión de Su Excelencia [FRA_philippe_petain.getname], el gobierno de [FRA.GetName] se ha concentrado en justificar el golpe militar y asegurar la legitimidad de suceder al gobierno anterior. Aunque muchos países democráticos expresaron preocupación por nuestras acciones y los comunistas de la metrópoli se negaron a llamarnos gobierno legítimo, gracias a nuestros esfuerzos, a día de hoy la comunidad internacional nos considera el legítimo gobierno francés en el exilio."
 FRA_prov_event.8.a:0 "Menos mal."
 FRA_prov_event.9.t:0 "Propuesta de la Declaración de Granada"
 FRA_prov_event.9.d:0 "El gobierno de [FRA.getname] se encuentra actualmente en el exilio debido a los bolcheviques de otro mundo llamados [MIL.getname]. La parte [FRA.getadjective] desea establecer con nosotros una relación de cooperación diplomático-militar para terminar el exilio y reconquistar la metrópoli. Dado que la región nororiental de la patria [SPR.getadjective] también fue usurpada por esos bolcheviques de otro mundo, podremos obtener beneficios cooperando con ellos."
 FRA_prov_event.9.a:0 "¡Juntos somos fuertes!"
 FRA_prov_event.9.b:0 "No necesitamos su ayuda."
 FRA_prov_event.10.t:0 "Ministro de administración militar"
 FRA_prov_event.10.d:0 "El gobierno metropolitano ha enviado un ministro de administración militar para reforzar el control sobre las colonias."
 FRA_prov_event.10.a:0 "Qué fastidio."
 FRA_prov_event.11.t:0 "Propuesta [FRA.getadjective] para unirse al bloque económico del Sudeste Asiático"
 FRA_prov_event.11.d:0 "El Ministerio de Industria y Economía del gobierno de [FRA.GetName] ha propuesto que [THIS.getname] se adhiera a un bloque económico del Sudeste Asiático, con Indochina como núcleo. Francia figura en esta comunidad solo como observador, pero dado que el voto de Vietnam, Laos y Camboya—colonias francesas—está totalmente bajo control francés, en la práctica el bloque está diseñado para que Francia actúe como presidente. Por ello, esta comunidad incorporaría parcialmente la economía de [THIS.getname] a la esfera económica francesa. Sin embargo, la inversión y transferencia tecnológica desde Francia, así como la cooperación mutua dentro del bloque, podrían traernos beneficios que compensen esas desventajas."
 FRA_prov_event.11.a:0 "Suena tentador."
 FRA_prov_event.11.b:0 "No caeremos en su truco barato."
 FRA_prov_event.12.t:0 "Salida [FROM.getadjective] del bloque económico del Sudeste Asiático"
 FRA_prov_event.12.d:0 "El gobierno de [FROM.getname] ha notificado su retirada del bloque económico, alegando que ya no es mutuamente beneficioso."
 FRA_prov_event.12.a:0 "Qué lástima."
 FRA_prov_event.13.t:0 "Aceptación de [FROM.getadjective]"
 FRA_prov_event.13.d:0 "[FROM.GetName] ha aceptado nuestra solicitud."
 FRA_prov_event.13.a:0 "Han sido sensatos."
 FRA_prov_event.14.t:0 "Propuesta [FRA.getadjective] de acuerdo comercial"
 FRA_prov_event.14.d:0 "El gobierno de [FRA.getname] nos ha propuesto un acuerdo comercial mediterráneo que le permitiría comerciar recursos a bajo precio a cambio de nuestra inversión."
 FRA_prov_event.14.a:0 "Es un buen trato."
 FRA_prov_event.14.b:0 "No hace falta."
 FRA_prov_event.15.t:0 "Ruptura [FROM.getadjective] del acuerdo comercial mediterráneo"
 FRA_prov_event.15.d:0 "El gobierno de [FROM.getname] ha roto su acuerdo comercial con nosotros."
 FRA_prov_event.15.a:0 "No es sencillo."
 FRA_prov_event.16.t:0 "Aceptación de [SPR.getadjective]"
 FRA_prov_event.16.d:0 "El gobierno de [SPR.getname] ha aceptado íntegramente la declaración cuyo eje es el fortalecimiento de nuestras relaciones diplomático-militares, lo que será de gran ayuda en el proceso de reconquista de la metrópoli."
 FRA_prov_event.16.a:0 "Son camaradas fiables."
 FRA_prov_event.17.t:0 "Rechazo de [SPR.getadjective]"
 FRA_prov_event.17.d:0 "El gobierno de [SPR.getname] ha expresado un rechazo cortés a la Declaración de Granada."
 FRA_prov_event.17.a:0 "Se están burlando de nosotros."
 FRA_prov_event.21.t:0 "Ejercicio militar conjunto [FRA.getadjective]-[SPR.getadjective]"
 FRA_prov_event.21.d:0 "Se han realizado ejercicios militares conjuntos de ambos ejércitos contra [MIL.getname] y [WHY.getname], fuerzas hostiles al bolchevismo de otro mundo."
 FRA_prov_event.21.a:0 "¡Que los enemigos se rindan!"
 FRA_prov_event.20.t:0 "Tratado de amistad con la Francia exiliada"
 FRA_prov_event.20.d:0 "Como firmante del Frente de Stresa, [FRA.getname] reconoce nuestra hegemonía mediterránea y solicita una cooperación más activa para la reconquista de la metrópoli. Si lo aceptamos, podremos expandir nuestro territorio sin que ellos nos estorben."
 FRA_prov_event.20.a:0 "Nuestra amistad es profunda."
 FRA_prov_event.20.b:0 "No es necesario cooperar con ellos."
 FRA_prov_event.22.t:0 "Rechazo de [FROM.GetAdjective]"
 FRA_prov_event.22.d:0 "El gobierno de [FROM.getname] ha rechazado nuestra solicitud."
 FRA_prov_event.22.a:0 "Qué lástima."
 FRA_prov_event.23.t:0 "Cooperación exiliada de [ITA.GetAdjective]"
 FRA_prov_event.23.d:0 "Con la cooperación del gobierno de [ITA.getName], cada vez más exiliados cruzan la frontera para apoyar al gobierno en el exilio. Podremos usar esto como trampolín para acelerar los preparativos de reconquista."
 FRA_prov_event.23.a:0 "Gracias."
 FRA_prov_event.24.t:0 "Solicitud [FRA.getadjective] de inversión"
 FRA_prov_event.24.d:0 "El gobierno de [FRA.getname] ha solicitado inversión de nuestros industriales. Invertir en el desierto norteafricano no parece ofrecer grandes beneficios, pero si invertimos activamente en la región de Túnez para obtener el territorio que buscamos, quizá podamos exigir Túnez como compensación cuando ellos reconquisten la metrópoli."
 FRA_prov_event.24.a:0 "Suena tentador."
 FRA_prov_event.24.b:0 "Es un esfuerzo inútil."
 FRA_prov_event.24_tt:0 "@FRA§Y[FRA.getadjective]§! tras la §4reconquista de la metrópoli§! podrá exigir el control de §Y[458.getname]§! y §Y[665.getname]§!."
 FRA_prov_event.25.t:0 "Inversión de [ITA.GetAdjective]"
 FRA_prov_event.25.d:0 "Los industriales italianos han comenzado a invertir en nuestra región. Sin embargo, como precio por ello, quizá debamos cederles derechos sobre Túnez."
 FRA_prov_event.25.a:0 "La necesidad inmediata importa más."
 FRA_prov_event.26.t:0 "Construcción de la autopista norteafricana"
 FRA_prov_event.26.d:0 "El gobierno de [FRA.getname] pretende construir una \"autopista norteafricana\" desde Ceuta hasta Trípoli mediante cooperación con el gobierno de [ITA.getName] y la parte [SPR.getname]. Esto no es más que un plan interesado para su base industrial en África del Norte, pero también ofrece beneficios claros para nosotros."
 FRA_prov_event.26.a:0 "Es una buena propuesta."
 FRA_prov_event.26.b:0 "No es momento de seguirles el juego."
 FRA_prov_event.27.t:0 "Construcción de la autopista por parte de [FROM.getadjective]"
 FRA_prov_event.27.d:0 "Por fortuna, [FROM.getname] ha participado con nosotros en la construcción de la autopista."
 FRA_prov_event.27.a:0 "Gracias."
 FRA_prov_event.28.t:0 "El fracaso en la metrópoli"
 FRA_prov_event.28.d:0 "Fuimos atacados en pleno tiempo de paz. Una Gran Transposición inesperada desde otro mundo invocó a decenas de miles de forasteros en la metrópoli francesa, y su tecnología futurista de vanguardia incendió Francia. Francia resistió, pero los invasores eran fuertes y el gobierno estaba dividido. El exilio tras una derrota total fue, en teoría, una \"retirada estratégica\", pero nadie se atreve a negar que fue \"el fracaso en la metrópoli\"."
 FRA_prov_event.28.a:0 "¿Qué nos queda?"
 FRA_prov_event.29.t:0 "Se encuentra el punto de contacto"
 FRA_prov_event.29.d:0 "¡Hemos obtenido pruebas decisivas de que la huelga general norteafricana fue instigada por el Partido del Pueblo Norteafricano! Esto hará que el partido no tenga más remedio que actuar con mayor cautela en el frente de la huelga."
 FRA_prov_event.29.a:0 "¡Agentes rojos!"
 FRA_prov_event.29_tt:0 "\nA partir de ahora, el aumento de £GFX_repairing §Yorganización de la huelga§! debido a £GFX_decision_icon_small §Y$FRA_PPNA_activation$§! se reduce a §R5§!."
 FRA_prov_event.30.t:0 "Solicitud [FRA.getadjective] de frente común"
 FRA_prov_event.30.d:0 "[FRA.GetName] ha solicitado al gobierno de [ITA.getname] y al gobierno de [ENG.getname] que les ayuden en la futura batalla decisiva por la reconquista de la metrópoli. Concretamente, significa que cuando el ejército [FRA.getadjective] lleve a cabo un gran desembarco contra el enemigo, enviemos también fuerzas fronterizas para apoyarlos. Para ello, tendremos que desplegar tropas. Para cumplir el \"Frente de Stresa\" firmado anteriormente, sería sensato ayudarles."
 FRA_prov_event.30.a:0 "Ayudemos con gusto."
 FRA_prov_event.30.b:0 "Es demasiado arriesgado."
 FRA_prov_event.30_tt:0 "§gSerá de gran ayuda para Francia.§!"
 FRA_prov_event.31.t:0 "Aceptación de [FROM.getadjective]"
 FRA_prov_event.31.d:0 "El gobierno de [FROM.getname] ha aceptado nuestra solicitud."
 FRA_prov_event.32.t:0 "Perspectivas de la Armada Nacional"
 FRA_prov_event.32.d:0 "La Armada Nacional francesa se remonta a la Marina Real del cardenal Richelieu en el siglo XVII, y ha protegido con orgullo los océanos del mundo y los territorios de ultramar de Francia. Sin embargo, para apoyar a Francia entera durante la Gran Transposición, casi todos los buques fueron movilizados, y no tardaron en tener que ejecutar una operación de transporte masivo hacia África del Norte. Como resultado, los navíos acumulan fatiga por exceso de carga y uso forzado, y para colmo, debido a la ausencia de instalaciones de mantenimiento, se encuentran anclados provisionalmente en África del Norte.\nSi en este estado quedaran expuestos a un ataque enemigo, la marina francesa sufriría daños severos. Actualmente, la marina insiste con fuerza en que el gobierno adopte medidas para resolver esto. Si no actuamos pronto, la potencia naval se debilitará de forma drástica."
 FRA_prov_event.32.a:0 "Hay mucho por hacer."
 FRA_prov_event.33.t:0 "Negociaciones"
 FRA_prov_event.33.d:0 "Ante nuestra serie de medidas, las fuerzas huelguistas reconocen que continuar la huelga ya no les conviene. El gobierno envió una delegación y celebró conversaciones con la cúpula del comité de huelga, prometiendo garantizar los salarios durante el periodo de huelga y aplicar las demandas acordadas. La huelga terminará pronto."
 FRA_prov_event.33.a:0 "Menos mal."
 FRA_prov_event.35.t:0 "Descontento del ejército"
 FRA_prov_event.35.d:0 "Aunque haya sido una decisión del propio [FRA_philippe_petain.getname], pilar espiritual del ejército, muchos dentro de las fuerzas armadas sienten escepticismo ante la idea de renunciar a la hegemonía francesa. Si bien [FRA_philippe_petain.getname] ha sofocado por ahora ese descontento con su dignidad y autoridad, todos saben que, al fin y al cabo, es una figura elevada por una comisión militar provisional… y eso significa que, del mismo modo, su destitución también es posible por mano del ejército."
 FRA_prov_event.35.a:0 "\"Todo es por la República.\""
 FRA_prov_event.35_tt:0 "\n§RA partir de ahora, cada vez que surja el descontento del ejército, el líder deberá subir al cadalso.§!"
 FRA_prov_event.36.t:0 "Conferencia de Halifax"
 FRA_prov_event.36.d:0 "En la ciudad canadiense de Halifax, diplomáticos de [ENG.getname] y embajadores de [FRA.getname] han celebrado conversaciones. Debatieron la reconstrucción de una alianza militar como la de los Aliados en la Gran Guerra, la cooperación industrial entre las regiones del exilio y la cooperación mutua en la administración colonial."
 FRA_prov_event.36.a:0 "¡Viva la amistad franco-británica!"
 FRA_prov_event.37.t:0 "Conferencia de Halifax"
 FRA_prov_event.37.a:0 "¡Juntos somos fuertes!"
 FRA_prov_event.37.b:0 "No necesitamos esa diplomacia."

 # 프랑스 뉴스 이벤트
 # id = 38 39 40 41 44 46 53 65 71 76
 # 는 전부 BA_news_l_english 으로 이사 갔습니다. 뉴스 이벤트는 따로 구분해주세요.. << 미안! -프랑스 모더
FRA_prov_event.45.c:0 "Apoyemos la reconstrucción de las colonias."

FRA_prov_event.47.t:0 "Partido Social Francés"
FRA_prov_event.47.d:0 "Un grupo derechista de excombatientes, famoso bajo el nombre de 'Croix-de-Feu' de de La Rocque, ha organizado una fuerza paramilitar suprapolítica para la reconquista de Argelia. Originalmente apoyados por los colonos europeos en Argelia, ahora actúan bajo el nombre de 'Partido Social Francés' y perpetran terrorismo y acciones directas contra actividades antigubernamentales que se oponen al dominio francés en Argelia, interfiriendo incluso en el orden público por su cuenta. Son progubernamentales, pero pueden activar en cualquier momento su mecanismo interno de corte fascista."
FRA_prov_event.47.a:0 "¿Son patriotas?"

FRA_prov_event.50.t:0 "Actividad del Partido del Pueblo"
FRA_prov_event.50.d:0 "Con apoyo externo de procedencia dudosa, la huelga general está reorganizando su estructura."
FRA_prov_event.50.a:0 "¡Maldición!"

FRA_prov_event.51.t:0 "Un espectro"
FRA_prov_event.51.d:0 "El Partido Comunista Francés, producto del movimiento socialista francés del periodo de entreguerras, había conservado un marcado tono rojo en lo político; pero tras los disturbios de 1934 adoptó una línea de lucha conjunta con la 'Sección Francesa de la Internacional Obrera (SFIO)', ocupando el ala izquierda del Frente Popular. Sin embargo, al atravesar la Gran Transposición, el gobierno y el ejército, en una grave incompetencia, 'le arrojaron' el país al enemigo, y las élites sociales, los capitalistas financieros, las empresas, los políticos y los oficiales huyeron al exilio en África del Norte. En contraste con ellos, el Partido Comunista Francés se ha solidarizado con los trabajadores de las grandes ciudades, ha organizado la Resistencia contra el régimen autoritario de [MIL.getadjective] y ha liderado el movimiento de oposición; y, al mismo tiempo, se opone con fuerza al gobierno reaccionario de la Francia exiliada.\n\nEn esta situación, el movimiento socialista norteafricano se organiza en torno a la 'Confederación General del Trabajo (CGT)' en lugar del PCF, que está centrado en la resistencia en la metrópoli. Ellos reúnen a las masas trabajadoras y al movimiento obrero en una sola dirección y aglutinan un movimiento de masas contra el gobierno en el exilio, pero también muestran falta de unidad interna: facciones independentistas norteafricanas y facciones revanchistas francesas se enfrentan entre sí."
FRA_prov_event.51.a:0 "Sea como sea, estarán bajo vigilancia permanente."

FRA_prov_event.52.t:0 "La situación de la administración colonial"
FRA_prov_event.52.d:0 "Tras el exilio del gobierno francés, la resistencia contra el dominio colonial se está intensificando por toda África. Nuestra administración colonial requiere, ante todo, garantías de seguridad, y una intervención militar más amplia en protectorados como Marruecos y Túnez será inevitable."
FRA_prov_event.52.a:0 "Ejecutemos una operación de estabilización."

FRA_prov_event.53.t:0 "Daños en la armada"
FRA_prov_event.53.d:0 "Los daños acumulados en los buques abandonados durante largo tiempo han llegado al punto de impedir su operación. Debemos dejar ir a los barcos que ya no pueden usarse."
FRA_prov_event.53.a:0 "Maldición."

FRA_prov_event.54.t:0 "Insurrección armada en las montañas"
FRA_prov_event.54.d:0 "A medida que la actividad antigubernamental en zonas urbanas se ha debilitado considerablemente, los principales movimientos de resistencia anticolonial se están desplazando hacia regiones montañosas. Allí desarrollan guerra de guerrillas, convirtiéndose en un gran dolor de cabeza para nuestras fuerzas de seguridad y el ejército regular."
FRA_prov_event.54.a:0 "¡Cucarachas!"

FRA_prov_event.55.t:0 "Propuesta rechazada"
FRA_prov_event.55.d:0 "[FROM.GetName] ha rechazado nuestra solicitud."
FRA_prov_event.55.a:0 "Qué lástima."

FRA_prov_event.56.t:0 "Propuesta de Francia"
FRA_prov_event.56.d:0 "Francia nos ha pedido que, cuando lleve a cabo la operación de reconquista, le permitamos cruzar nuestra frontera para atacar. Si los ayudamos, podremos ejercer influencia sobre ellos después de que recuperen la metrópoli."
FRA_prov_event.56.a:0 "Ayudémosles."
FRA_prov_event.56.b:0 "No se puede confiar en Francia."

FRA_prov_event.57.t:0 "Exiliados"
FRA_prov_event.57.d:0 "Numerosos franceses derrotados en la metrópoli están llegando al exilio en África del Norte. Suponen una gran carga para nuestra economía y sociedad, y debemos idear una forma de acogerlos."
FRA_prov_event.57.a:0 "Qué fastidio."

FRA_prov_event.58.t:0 "Exilio de la Resistencia"
FRA_prov_event.58.d:0 "Franceses locales que resistían en la metrópoli o que estaban descontentos con nuestro gobierno han cruzado hacia África del Norte."
FRA_prov_event.58.a:0 "Que hagan lo que quieran."
FRA_prov_event.58.b:0 "¡No me informes más de estas cosas!"

FRA_prov_event.59.t:0 "Exigencia francesa de derechos de atraque"

FRA_prov_event.60.t:0 "Propuesta aceptada"
FRA_prov_event.60.d:0 "[FROM.GetName] ha aceptado nuestra solicitud de ayuda."
FRA_prov_event.60.a:0 "Muchas gracias."

FRA_prov_event.61.t:0 "El papel del Ministerio de Colonias"
FRA_prov_event.61.d:0 "Con la red administrativa de la metrópoli colapsada y el gobierno inestable por el golpe, la administración en muchas secciones coloniales no está funcionando adecuadamente. Por ello, es necesario ampliar la autonomía del Ministerio de Colonias para restaurar y consolidar la administración colonial.\nAlgunos sostienen que, para evitar el derrumbe del Imperio Colonial Francés, el Ministerio de Colonias debería poder ejercer de forma más dura y urgente autoridad de mando militar para la seguridad local. Sin embargo, estas medidas podrían resultar en una expansión excesiva de su poder y, a largo plazo, convertirse en la chispa de movimientos de resistencia anticolonial.\nPor otro lado, los parlamentaristas se oponen a ambas propuestas, al considerar que la administración vía el Ministerio de Colonias es una prolongación del alejamiento del orden democrático y de los contrapesos."
FRA_prov_event.61.a:0 "Ampliemos la autonomía del Ministerio de Colonias."
FRA_prov_event.61.b:0 "Hay que armarlos."
FRA_prov_event.61_tt:0 "Todos los estados de §YÁfrica Occidental Francesa§!:\n"
FRA_prov_event.61_tt_1:0 "Todos los estados de §YÁfrica Ecuatorial Francesa§!:\n"

FRA_prov_event.62.t:0 "El camino de la reforma militar"
FRA_prov_event.62.d:0 "La desastrosa derrota de 1935 en la metrópoli nos dejó múltiples lecciones militares. Ante todo, recordamos cómo la poderosa ingeniería mecánica de los seres de otro mundo aniquiló sin piedad a los soldados franceses. Además, los enemigos con Halo no podían ser atacados de forma efectiva con balas comunes. En ese entorno, la táctica tradicional de 'defender la trinchera y luego contraatacar' no hizo más que darles tiempo para reorganizar sus líneas e identificar nuestras debilidades. En la próxima reforma militar, será necesario adoptar tácticas que solucionen estos problemas.\n\nOtro desafío militar es que, por obstáculos geográficos, la operación de reconquista requiere un desembarco. Por suerte, en la Batalla de Galípoli obtuvimos un gran entendimiento sobre desembarcos a gran escala. El punto de disputa era si concentrar el fuego en un solo punto o realizar un desembarco masivo en el mayor bastión para librar la batalla decisiva en la metrópoli.\n\nMientras tanto, [FRA_charles_de_gaulle.getname] y sus partidarios subrayan la histórica victoria del 'Sitio de Eridu' en las afueras de París, lograda en medio de la derrota. En aquel entonces, [FRA_charles_de_gaulle.getname], basándose en la doctrina de guerra de maniobra, empleó divisiones acorazadas para derrumbar por completo el segundo bastión enemigo; una victoria crucial que permitió al gobierno resistir un mes. Por ello, desean formar fuerzas móviles y llevar a cabo guerra de maniobra en la reconquista. El problema, sin embargo, es la propia producción de las divisiones acorazadas."
FRA_prov_event.62.a:0 "Es una era de convulsión militar."

FRA_prov_event.63.t:0 "Venta de un acorazado [FRA.getadjective]"
FRA_prov_event.63.d:0 "El gobierno [FRA.getadjective] nos ha propuesto comprar un acorazado."
FRA_prov_event.63.a:0 "Es una buena propuesta."
FRA_prov_event.63.b:0 "No tenemos margen."
FRA_prov_event.63_tt:0 "Ceder §Y1 acorazado§! a [PREV.getflag][PREV.getadjective]"

FRA_prov_event.64.t:0 "Compra de acorazado por [FROM.getadjective]"
FRA_prov_event.64.d:0 "Quizá por lo barato que lo vendimos, [FROM.getname] ha comprado gustosamente nuestro acorazado."
FRA_prov_event.64.a:0 "Todo es necesario."

FRA_prov_event.65.t:0 "Rechazo de compra de acorazado por [FROM.getadjective]"
FRA_prov_event.65.d:0 "[FROM.getname] ha rechazado nuestra oferta de compra."
FRA_prov_event.65.a:0 "Qué lástima."

FRA_prov_event.66.t:0 "Presión"
FRA_prov_event.66.d:0 "El Parlamento francés y el primer ministro Pierre Laval apartaron a Philippe Pétain de la política francesa, alegando la recesión económica, la crisis laboral, la pérdida de prestigio internacional y el colapso.\n\nTras la destitución forzosa de Philippe Pétain, Pierre Laval anunció oficialmente en un discurso el fin del gobierno de Pétain.\n\n\"En una emergencia como la actual, no existe tal cosa como un héroe. Debemos seguir el poder civil elegido por el pueblo. Hasta hoy, Pétain se ha engordado a sí mismo mediante una opresión brutal e inaceptable, y su gobierno ha hecho que el pueblo se arrastre día a día en una vida de pobreza. Nuestro Parlamento ha logrado hacer dimitir a [FRA_philippe_petain.getname], ¡y Francia volverá a ser justa!\""
FRA_prov_event.66.a:0 "Debe rendir cuentas."

FRA_prov_event.67.d:0 "Las protestas, convertidas en disturbios, se extendieron por todo el territorio del gobierno de emergencia. Un grupo pan-africano de terror rojo llamado 'Frente de Liberación Popular Africano' asaltó la oficina de Pétain y proclamó la liberación de África."
FRA_prov_event.67.a:0 "A partir de aquí todavía no he hecho nada, perdón."

FRA_prov_event.68.t:0 "Influencia italiana"
FRA_prov_event.68.d:0 "Como precio por habernos ayudado en la guerra de reconquista, Italia exigió apoyo a la industria armamentística y el reconocimiento permanente de la soberanía sobre [735.getname] y [1058.getname]."
FRA_prov_event.68.a:0 "Sin ellos, habríamos sido impotentes."

FRA_prov_event.69.t:0 "Descolonización"
FRA_prov_event.69.d:0 "Liberaremos todas nuestras colonias. Sin embargo, de acuerdo con los principios internacionalistas, también continuaremos la solidaridad con ellas."
FRA_prov_event.69.a:0 "¡Viva el socialismo!"
FRA_prov_event.69_tt:0 "§tLiberaremos o devolveremos todas las colonias que dominamos injustamente.§!"

FRA_prov_event.70.t:0 "Elecciones"
FRA_prov_event.70.d:0 "Con la retirada de [FRA_philippe_petain.getname], el Parlamento francés recuperó su autoridad legítima como institución constitucional constituida por el pueblo. Sin embargo, debemos celebrar elecciones que no se han podido realizar durante años. El Frente Popular, bloque antifascista unido bajo una sola causa, es una coalición de partidos de izquierda franceses que prioriza el bienestar público o la comunización. En cambio, la Unión Nacional, formada por una amplia alianza de partidos de derecha para impedir que la izquierda tome el poder, pretende salvaguardar los valores franceses y recuperar la gloria de Francia. Ambas fuerzas luchan con fiereza, pero el pueblo debe elegir solo una."
FRA_prov_event.70.a:0 "¡Victoria de la Unión Nacional!"
FRA_prov_event.70.b:0 "¡El Frente Popular tomó el poder!"

FRA_prov_event.72.t:0 "Trato hacia los estudiantes"
FRA_prov_event.72.d:0 "Tras sofocarse toda resistencia significativa de los estudiantes, la mayoría de los estudiantes venidos de otro mundo están encarcelados. Si los eliminamos, podremos promover la estabilidad de Francia y del mundo. Pero, como también son humanos, podríamos concederles un juicio. Si se celebra juicio, como la mayoría son adolescentes, serán enviados a instalaciones de reeducación."
FRA_prov_event.72.a:0 "Ejecútenlos."
FRA_prov_event.72.b:0 "Celebremos un juicio."

FRA_prov_event.73.t:0 "Selección del emplazamiento de la Torre Eiffel"
FRA_prov_event.73.d:0 "Como la Torre del Milenio se construyó en el lugar donde estaba la antigua Torre Eiffel, debemos elegir la ubicación de la nueva Torre Eiffel. En medio de este debate, los argelinos que ayudaron en nuestro regreso desean traer la Torre Eiffel a Argel. Si aceptamos su petición, sin duda serán más leales a Francia."
FRA_prov_event.73.a:0 "Constrúyanla junto a la Torre del Milenio."
FRA_prov_event.73.c:0 "¿Por qué reconstruir un vestigio de la vieja era?"

FRA_prov_event.74.t:0 "¡Torre Eiffel completada!"
FRA_prov_event.74.d:0 "La Torre Eiffel ha sido completada."
FRA_prov_event.74.a:0 "¡Viva Francia!"

FRA_prov_event.75.t:0 "La decisión del Mariscal"
FRA_prov_event.75.d:0 "Mientras la reconstrucción empieza a encaminarse, las facciones militares le propusieron a Pétain formar un sistema oligárquico 'temporal' para garantizar la estabilidad de Francia y la reconquista territorial."
FRA_prov_event.75.a:0 "Francia aún necesita a Pétain."
FRA_prov_event.75.b:0 "Mi misión ha terminado."

FRA_prov_event.77.t:0 "¡Huelga general francesa!"
FRA_prov_event.77.d:0 "Ha estallado una huelga general organizada en toda Francia. Los generadores se han detenido, las fábricas no producen. Las tiendas han cerrado, ¡y numerosas organizaciones obreras están marchando hacia el campus!"
FRA_prov_event.77.a:0 "Maldición."
FRA_prov_event.77_tt:0 "\nSi la guerra en la metrópoli francesa no termina en §Y360 días§!, los líderes de ambos países iniciarán negociaciones de paz."

FRA_prov_event.78.t:0 "Gestión de la Torre del Milenio"
FRA_prov_event.78.d:0 "La Torre del Milenio ha caído en nuestras manos. Debemos decidir qué hacer con ella."
FRA_prov_event.78.a:0 "Usémosla como edificio administrativo."
FRA_prov_event.78.b:0 "Será perfecta como instituto de investigación."
FRA_prov_event.78.c:0 "No podemos dejar restos de la crisis francesa."
FRA_prov_event.78.e:0 "Usemosla como vivienda."
FRA_prov_event.76_tt:0 "§tOpción disponible bajo un régimen comunista.§!"

FRA_prov_event.79.t:0 "Infraestructura de transporte"
FRA_prov_event.79.d:0 "Hemos adquirido la tecnología necesaria para contar con infraestructura de transporte moderna."
FRA_prov_event.79.a:0 "Concentrémonos en la metrópoli."
FRA_prov_event.79.b:0 "Instálenla en todos los territorios."

FRA_prov_event.80.t:0 "Tecnología de ingeniería"
FRA_prov_event.80.d:0 "La investigación sobre la tecnología de ingeniería del otro mundo ha concluido. Ahora la aplicaremos en campos reales."
FRA_prov_event.80.a:0 "Esto es innovación."

FRA_prov_event.81.t:0 "Tecnología eléctrica asegurada"
FRA_prov_event.81.d:0 "Como incluso en el otro mundo se usaban diversas instalaciones basadas en la electricidad, analizamos a fondo su tecnología eléctrica. Como resultado, hemos podido adquirir una excelente tecnología eléctrica."
FRA_prov_event.81.a:0 "La industria se desarrollará aún más."

FRA_prov_event.82.t:0 "Dispositivos mecánicos analizados"
FRA_prov_event.82.d:0 "Hemos analizado minuciosamente los dispositivos mecánicos del otro mundo y, mediante ello, obtenido diversos conocimientos de ingeniería."
FRA_prov_event.82.a:0 "Usemoslo en el transporte."
FRA_prov_event.82.b:0 "¿Y si lo aplicamos a la industria armamentística?"

FRA_prov_event.83.t:0 "Control de líneas de comunicación"
FRA_prov_event.83.d:0 "Hemos tomado el control de las líneas de comunicación del otro mundo y concluido su investigación."
FRA_prov_event.83.a:0 "Ahora todo el país puede comunicarse en tiempo real."

FRA_prov_event.84.t:0 "Procesos automatizados"
FRA_prov_event.84.d:0 "Hemos logrado recibir y asimilar tecnología de automatización de los estudiantes del otro mundo llamados 'Milennium'. La aplicaremos prioritariamente al sector productivo."
FRA_prov_event.84.a:0 "Entonces mandemos a todos los desempleados al ejército."

FRA_prov_event.85.t:0 "Producción de robots"
FRA_prov_event.85.d:0 "Tras una investigación persistente, hemos logrado producir robots de combate."
FRA_prov_event.85.a:0 "¡Despliéguelos de inmediato!"

FRA_prov_event.87.t:0 "Filtración de tecnología de Millennium"
FRA_prov_event.87.d:0 "Una organización de la Resistencia que continúa luchando en la metrópoli se infiltró en un laboratorio del Distrito Central de Millennium y obtuvo parte de su tecnología."
FRA_prov_event.87.a:0 "Impresionante."

FRA_prov_event.88.t:0 "Aseguramiento de herramientas industriales"
FRA_prov_event.88.d:0 "Mientras continuaba la resistencia en nuestro noreste metropolitano, la Resistencia ha enviado a la metrópoli diversas herramientas industriales que había asegurado."
FRA_prov_event.88.a:0 "Útil."

FRA_prov_event.89.t:0 "Represión masiva de la Resistencia"
FRA_prov_event.89.d:0 "Algunos miembros de la Resistencia, huyendo de la represión nacional de Millennium, decidieron abandonar la lucha y exiliarse uniéndose a África del Norte."
FRA_prov_event.89.a:0 "Serán de gran ayuda."
FRA_prov_event.89_tt:0 "\nLa §Yintensidad de la resistencia§! en la metrópoli ha §Rdisminuido§!."

FRA_prov_event.90.t:0 "Deserción media de la Resistencia"
FRA_prov_event.90.d:0 "Algunos miembros de organizaciones de resistencia, huyendo de la represión nacional, han abandonado la lucha y se han exiliado a África del Norte."
FRA_prov_event.90.a:0 "¡No vuelvan jamás!"

FRA_prov_event.91.t:0 "Ferrocarril completado"
FRA_prov_event.91.d:0 "El ferrocarril que atraviesa el Sáhara se ha completado con éxito."
FRA_prov_event.91.a:0 "La industrialización de África Occidental no está lejos."

FRA_prov_event.92.t:0 "Boom ferroviario"
FRA_prov_event.92.d:0 "Miles de artículos y suministros se suben al tren para cruzar el Sáhara entre África Occidental y África del Norte. La construcción del Ferrocarril del Sáhara fue un éxito, y podremos acelerar la industrialización."
FRA_prov_event.92.a:0 "Fue una política acertada."
FRA_prov_event.92_tt:0 "\nSi se completó la §Yampliación del Ferrocarril del Sáhara§!, se obtiene un efecto mejor."
FRA_prov_event.92_tt_1:0 "\nSe obtiene un efecto mejor al completar la §Yampliación del Ferrocarril del Sáhara§!."

FRA_prov_event.93.t:0 "Resistencia de los estudiantes"
FRA_prov_event.93.d:0 "Las fuerzas estudiantiles de otro mundo que aún permanecen en la metrópoli reconquistada siguen resistiéndose a nuestro gobierno."
FRA_prov_event.93.a:0 "Qué fastidio."

FRA_prov_event.94.t:0 "Fin de la huelga general norteafricana"
FRA_prov_event.94.d:0 "Gracias a los esfuerzos de nuestro gobierno, la cúpula del comité de huelga decidió disolverse y dar por terminada la huelga. El humo vuelve a elevarse en las fábricas, y los barcos vuelven a atracar en los muelles."
FRA_prov_event.94.a:0 "Menos mal."

FRA_prov_event.95.t:0 "Diplomacia en Oriente Medio"
FRA_prov_event.95.d:0 "Tras la derrota total del Reino Unido a manos del otro mundo, Oriente Medio se liberó del puño imperialista y conquistó su independencia. No podemos aceptarlo. Debemos volver a entregarles la llama de la civilización. Pero no debemos pasar por alto que existen múltiples métodos para hacerlo."
FRA_prov_event.95.a:0 "La coordinación con ellos es esencial para nuestra gran estrategia."
FRA_prov_event.95.b:0 "¡Es el retorno del imperio, árabes!"

FRA_prov_event.96.t:0 "Exigencias de Francia"
FRA_prov_event.96.d:0 "El embajador francés nos exigió someternos, y dijo que también se considerará seriamente el uso de la fuerza para imponer la solicitud."
FRA_prov_event.96.a:0 "Aceptemos sus exigencias."
FRA_prov_event.96.b:0 "¡Jamás podemos someternos a ellos!"

FRA_prov_event.97.t:0 "Aceptación de Suiza"
FRA_prov_event.97.d:0 "Suiza se ha sometido ante nosotros."
FRA_prov_event.97.a:0 "Una elección sabia."

FRA_prov_event.98.t:0 "Rechazo de Suiza"
FRA_prov_event.98.d:0 "Suiza ha rechazado nuestra solicitud."
FRA_prov_event.98.a:0 "La fuerza, a veces, es el mejor medio."

FRA_prov_event.99.t:0 "Acuerdo de Saigón"
FRA_prov_event.99.d:0 "Se hace evidente que ya no podemos mantener Indochina. Renunciaremos a la colonia mediante una retirada ordenada, preservando al máximo nuestros intereses."
FRA_prov_event.99.a:0 "Es lo correcto."

FRA_prov_event.100.t:0 "Consejo de Resistencia"
FRA_prov_event.100.d:0 "Dentro de Francia, el orgulloso pueblo francés continúa resistiendo la opresión de los seres de otro mundo. Las principales fuerzas políticas que los aglutinan son dos: por un lado, los comunistas que organizaron la resistencia en torno a las ciudades; por el otro, los fascistas basados en el sentimiento católico y las comunidades rurales. Sin embargo, los comunistas muestran una fuerte cohesión alrededor del Partido Comunista Francés y la SFIO, mientras que los fascistas solo presentan resistencias aisladas debido a la proliferación de organizaciones fascistas.\n\nPodremos utilizarlos para mantener influencia en la metrópoli."
FRA_prov_event.100.a:0 "Son fiables."

FRA_prov_event.101.t:0 "Gestión de los estudiantes"
FRA_prov_event.101.d:0 "Los estudiantes que aún permanecen en el sur de Francia amenazan el orden público y la seguridad social, y en cualquier momento pueden convertirse en esbirros de Millennium. Si ejercemos un control firme sobre ellos, podremos cortar el riesgo de antemano."
FRA_prov_event.101.a:0 "Sí. Extermínenlos a todos."
FRA_prov_event.101.b:0 "Basta con encarcelarlos."

FRA_prov_event.102.t:0 "Bloqueo naval francés"
FRA_prov_event.102.d:0 "La flota francesa ha bloqueado nuestras rutas comerciales marítimas."
FRA_prov_event.102.a:0 "Qué cobarde."

FRA_prov_event.103.t:0 "Victoria en el conflicto fronterizo"
FRA_prov_event.103.d:0 "Hemos repelido al enemigo con firmeza."
FRA_prov_event.103.a:0 "¡Viva!"

FRA_prov_event.104.t:0 "Derrota en el conflicto fronterizo"
FRA_prov_event.104.d:0 "Nos hemos retirado temporalmente de la zona en disputa. Pero eso no significa, en absoluto, una derrota total."
FRA_prov_event.104.a:0 "Vaya..."

FRA_prov_event.105.t:0 "Noche fría"
FRA_prov_event.105.d:0 "Los moderados finalmente han expulsado por completo a los radicales del gobierno militar."
FRA_prov_event.105.a:0 "Ha llegado la estabilidad."

FRA_prov_event.106.t:0 "Noche fría"
FRA_prov_event.106.d:0 "Los radicales, al expulsar a [ROOT.GetLeader], han consolidado una ventaja firme dentro del gobierno militar."
FRA_prov_event.106.a:0 "¡Adelante!"

FRA_prov_event.107.t:0 "Conferencia de Vichy"
FRA_prov_event.107.d:0 "Celebraremos conversaciones diplomáticas con Millennium en Vichy. Nuestra delegación solicitará un pacto de no agresión y un intercambio mutuo."
FRA_prov_event.107.a:0 "Han llegado."

FRA_prov_event.108.t:0 "Conferencia de Vichy"
FRA_prov_event.108.d:0 "A petición de Francia, celebramos en Vichy una reunión con su delegación. Expresaron su deseo de aliviar la confrontación y, más allá, eliminarla por completo: quieren una coexistencia mutua entre Millennium y Francia, solicitando un pacto de no agresión e intercambios entre ambos."
FRA_prov_event.108.a:0 "Más confrontación no beneficia a ninguno."
FRA_prov_event.108.b:0 "No, hablar con ellos es una pérdida de tiempo."

FRA_prov_event.109.t:0 "Aceptación de Millennium"
FRA_prov_event.109.d:0 "Millennium ha aceptado nuestra solicitud."
FRA_prov_event.109.a:0 "Es el inicio de la paz."

FRA_prov_event.110.t:0 "Rechazo de Millennium"
FRA_prov_event.110.d:0 "La delegación de Millennium ha rechazado nuestra solicitud."
FRA_prov_event.110.a:0 "Somos impotentes."

FRA_prov_event.111.t:0 "Solicitud de adhesión a los Aliados"
FRA_prov_event.111.d:0 "Tras la liberación de Francia, Francia nos ha invitado a un frente firme para liberar a toda Europa de las entidades del otro mundo. Al unirnos a los Aliados, podremos garantizar solidaridad y desarrollo en seguridad, economía y sociedad."
FRA_prov_event.111.a:0 "Nos guste o no, lo mejor es cooperar con ellos."
FRA_prov_event.111.b:0 "Cooperar con ellos no parece una buena idea."

FRA_prov_event.112.t:0 "Acuerdo de desarrollo económico de los Aliados"
FRA_prov_event.112.d:0 "Los Aliados nos han propuesto participar en un acuerdo de desarrollo económico."
FRA_prov_event.112.a:0 "Aceptemos su ayuda."
FRA_prov_event.112.b:0 "Solo una economía autónoma tiene sentido."

FRA_prov_event.113.t:0 "Organismo Aliado de reconquista"
FRA_prov_event.113.d:0 "Los Aliados nos han propuesto unirnos al organismo de reconquista."
FRA_prov_event.113.a:0 "La coordinación militar con ellos es significativa."
FRA_prov_event.113.b:0 "Aún es pronto."

FRA_prov_event.114.t:0 "Trato con los coloniales"
FRA_prov_event.114.d:0 "Hemos decidido permitirles independizarse si participan en la reconquista de la metrópoli y siguen diligentemente las instrucciones del gobierno."
FRA_prov_event.114.a:0 "¡Miren al Mediterráneo!"
FRA_prov_event.114.b:0 "Pero ya hemos completado la descolonización."

FRA_prov_event.115.t:0 "Cumplimiento de la promesa"
FRA_prov_event.115.d:0 "Debemos cumplir la promesa que hicimos a los coloniales hace unos tres años."
FRA_prov_event.115.a:0 "Cumplamos nuestra promesa."
FRA_prov_event.115.b:0 "Aún es pronto para la independencia. Comprometámonos creando regiones autónomas."
FRA_prov_event.115.c:0 "Esa promesa era inevitable. ¡Francia aún conserva la propiedad de las regiones!"
FRA_prov_event.115.e:0 "Celebren un referéndum sobre si se unirán a la Unión Francesa."

FRA_prov_event.117.t:0 "Indochina aislada"
FRA_prov_event.117.d:0 "La derrota del Reino Unido y el fortalecimiento de la hegemonía japonesa en Asia Oriental están debilitando rápidamente nuestros lazos con las colonias. Por otro lado, en Indochina, el Partido Comunista Indochino, liderado por fuerzas independentistas y socialistas, está ganando poder. Debemos contenerlos."
FRA_prov_event.117.a:0 "Maldición."
FRA_prov_event.117_tt:0 "§YLos gobiernos coloniales§! pueden, mediante §Yenfoques§!, §Gser leales§! a §YFrancia§! o §Yiniciar§! una §Rguerra de independencia§!. La §Rguerra de independencia§! §Yterminará§! si §YFrancia§! pierde el §Ycontrol§! de §Ytoda Indochina§!."

FRA_prov_event.120.t:0 "Golpe de Estado"
FRA_prov_event.120.d:0 "Desde la desesperada derrota en la metrópoli, el gabinete está hundido en el mayor sentimiento de derrota. El ejército declaró un gobierno militar 'temporal' hasta retomar toda Francia, citando la incompetencia del gabinete durante la guerra, así como la falta de avances tras el exilio y la división del gabinete actual. [FRA_philippe_petain.getname] fue elevado como presidente de la Comisión Militar Provisional, y tras un mes de preparación ha anunciado la reorganización sistemática del gabinete en un gobierno militar."
FRA_prov_event.120.a:0 "¡[FRA_philippe_petain.getname] dirige Francia!"

FRA_prov_event.121.t:0 "Terrorismo"
FRA_prov_event.121.d:0 "A medida que aumentaban los exiliados, el gobierno francés empezó a demoler asentamientos argelinos existentes y a construir viviendas para los exiliados. Esto provocó una gran ira entre los argelinos y derivó en algunos actos de terrorismo, generando una sensación de crisis de seguridad."
FRA_prov_event.121.a:0 "¡Aumenten la fuerza policial!"

FRA_prov_event.122.t:0 "Obras deficientes"
FRA_prov_event.122.d:0 "Empujar y explotar sin descanso a los trabajadores nunca significó eficiencia. La caída de la productividad y la pérdida de motivación condujeron a una caída de la calidad: se encontraron numerosas carreteras y edificios defectuosos en el centro de Argel, y el gobierno no tuvo más remedio que tomar medidas temporales."
FRA_prov_event.122.a:0 "No es más que un problema menor."

FRA_prov_event.123.t:0 "Pago de bonos"
FRA_prov_event.123.d:0 "Al decidir pagar los bonos de defensa, debemos cumplir nuestras deudas."
FRA_prov_event.123.a:0 "Toda transacción tiene un precio."

FRA_prov_event.124.t:0 "Exilio adicional"
FRA_prov_event.124.d:0 "Jóvenes del sureste metropolitano, lo más cercano al gobierno en el exilio, se están incorporando a nuestro ejército para apoyar la causa."
FRA_prov_event.124.a:0 "Bien."

FRA_prov_event.125.t:0 "Prórroga de la promesa"
FRA_prov_event.125.d:0 "Mientras la guerra continúa, debemos posponer un poco nuestra promesa a los coloniales. Sin embargo, cuanto más se prolongue repetidamente, más fuertes serán sus protestas."
FRA_prov_event.125_tt:0 "\nLa paciencia de los coloniales tiene un límite. Tras esta elección, puede prorrogarse §Y[?FRA_promise_var]§! veces más."
FRA_prov_event.125.a:0 "Ellos también lo entenderán."
FRA_prov_event.125.b:0 "Un momento… ¿cuántas veces lo hemos pospuesto?"

FRA_prov_event.126.t:0 "Frente de Stresa"
FRA_prov_event.126.d:0 "Debido a la invasión de entidades del otro mundo, la República, el Reino Unido e Italia se vieron obligados a firmar el Frente de Stresa. Pero como la República está ahora en el exilio, para mantener la alianza con Italia debemos aceptar sus exigencias. Por ello, Pétain y el gobierno militar decidieron guardar silencio sobre el estacionamiento del ejército italiano en Niza y Saboya."
FRA_prov_event.126.a:0 "Es una elección inevitable."

FRA_prov_event.127.t:0 "Economía sumergida colapsada"
FRA_prov_event.127.d:0 "Debido a la nueva política económica aplicada por Millennium, ya no es posible mantener una economía sumergida de gran escala. En consecuencia, el gobierno decidió retirarse gradualmente de los negocios relacionados con la economía subterránea."
FRA_prov_event.127.a:0 "Qué pena."

FRA_prov_event.128.t:0 "Economía sumergida colapsada"
FRA_prov_event.128.d:0 "Gracias a la nueva política que implementamos, la economía del bajo fondo de la academia no resistió el cambio y colapsó. Como resultado, hemos podido controlar la economía de toda la academia."
FRA_prov_event.128.a:0 "Justo a tiempo, buenas noticias."

FRA_prov_event.129.t:0 "Solicitud de inversión de Francia"
FRA_prov_event.129.d:0 "El embajador francés nos ha solicitado inversión."
FRA_prov_event.129.a:0 "Invirtamos en ellos."
FRA_prov_event.129.b:0 "No podemos confiar en ellos."

FRA_prov_event.130.t:0 "Aceptación de [FROM.getname]"
FRA_prov_event.130.d:0 "El embajador de [FROM.getname] aceptó nuestra solicitud de inversión."
FRA_prov_event.130.a:0 "Muchas gracias."

FRA_prov_event.131.t:0 "Rechazo de [FROM.getname]"
FRA_prov_event.131.d:0 "El embajador de [FROM.getname] rechazó nuestra solicitud de inversión."
FRA_prov_event.131.a:0 "Decepcionante."

FRA_prov_event.133.t:0 "Resocialización completada"
FRA_prov_event.133.d:0 "El programa de resocialización dirigido a los antiguos estudiantes de Millennium ha concluido. Podremos reutilizar como oficiales a una parte obediente de los estudiantes reeducados."
FRA_prov_event.133.a:0 "Tal como lo planeamos."

FRA_prov_event.134.t:0 "Fascismo en ascenso"
FRA_prov_event.134.d:0 "La victoria electoral de la Unión Nacional ha confirmado que las fuerzas fascistas cuentan con apoyo popular. En este contexto, las tres corrientes que lideran el fascismo francés han repetido hasta ahora cooperación y competencia entre sí, pero ya no podrán mantener lo primero. Quién dirigirá por completo este movimiento fascista es algo que solo el cambiante panorama político—y Dios—decidirán."
FRA_prov_event.134.a:0 "Solo la fe y la armonía cambian a Francia."
FRA_prov_event.134.b:0 "¡Recuerda la gloria lejana!"
FRA_prov_event.134.c:0 "El éxito del fascismo debe seguir el precedente."

FRA_prov_event.135.t:0 "Movilización de masas"
FRA_prov_event.135.d:0 "Independientemente de la violencia, cientos y miles de jóvenes salen cada día a las calles, repitiendo protestas y disturbios. En medio de este caos continuo, para encontrar la hegemonía fascista debemos considerar qué tipo de masas se ha movilizado en mayor número."
FRA_prov_event.135.a:0 "Veteranos y soldados"
FRA_prov_event.135.b:0 "Parece que los monárquicos son los más numerosos."
FRA_prov_event.135.c:0 "¡Mira a miles de trabajadores!"

FRA_prov_event.136.t:0 "Propaganda y agenda política"
FRA_prov_event.136.d:0 "La ciudad está envuelta en el sonido de panfletos y altavoces. Es porque todos los fascistas franceses se han volcado en la propaganda con la convicción de que si no es ahora, no habrá oportunidad. Aun así, como la agenda política clave difiere por facción, debemos averiguar qué tema atrae más la atención de la gente."
FRA_prov_event.136.a:0 "Sin Dios, el individuo no existe."
FRA_prov_event.136.b:0 "La restauración monárquica fortalece a Francia."
FRA_prov_event.136.c:0 "Solo la clase y el trabajo pueden resolver los problemas reales."

FRA_prov_event.137.t:0 "El núcleo del parlamentarismo"
FRA_prov_event.137.d:0 "Hemos reunido suficiente apoyo y capacidad. Lo que queda es enfrentarnos de frente al parlamentarismo. Ahora, lo único que importa es qué fuerza será la primera en sacar a las masas a la calle."
FRA_prov_event.137.a:0 "¡Croix-de-Feu!"
FRA_prov_event.137.b:0 "¡Action Française actúa como su nombre!"
FRA_prov_event.137.c:0 "¡El movimiento francista ha salido!"

FRA_prov_event.138.t:0 "Amanecer"
FRA_prov_event.138.d:0 "La repetida lucha de poder, al llegar el momento de la transferencia de un régimen fascista, disipa su bruma. Una sola facción aplastará a las otras dos y liderará el fascismo francés. Sin embargo, eso no significa la desaparición de las demás facciones fascistas. Los fascistas franceses aún pueden cooperar entre sí, y la situación siempre puede cambiar."
FRA_prov_event.138.a:0 "¡Croix-de-Feu guía a Francia!"
FRA_prov_event.138.b:0 "¡Viva Action Française y el rey de Francia!"
FRA_prov_event.138.c:0 "¡Sean leales al movimiento francista y al fascismo ortodoxo!"

FRA_prov_event.139.t:0 "Ardor"
FRA_prov_event.139.d:0 "Aunque el Partido Comunista Francés está en el exilio, ha logrado una transformación tan radical como avanzada. Ahora ya no basta con cambiar: hay que construir."
FRA_prov_event.139.a:0 "Invirtamos en defensa."
FRA_prov_event.139.b:0 "Fortalezcamos la industria."

FRA_prov_event.140.t:0 "Economía sumergida"
FRA_prov_event.140.d:0 "Mientras no hemos podido tocar la economía, parece que los franceses han construido en toda la economía un gran sistema invisible orientado a la reconquista. Más adelante habrá que revisarlo."
FRA_prov_event.140.a:0 "Problemático."

FRA_prov_event.141.t:0 "¡Capitalistas que escapan!"
FRA_prov_event.141.d:0 "Muchos capitalistas en los territorios ocupados están escapando de Millennium para apoyar a [FRA.GetName]."
FRA_prov_event.141.a:0 "La producción se verá afectada."

FRA_prov_event.142.t:0 "Propuesta de paz de Francia"
FRA_prov_event.142.d:0 "Francia ha solicitado un alto el fuego a cambio de ceder Córcega permanentemente a Italia."
FRA_prov_event.142.a:0 "¡Por fin Córcega ha vuelto al abrazo de la patria!"
FRA_prov_event.142.b:0 "¡También deberán ceder Túnez!"

FRA_prov_event.143.t:0 "[ITA.getName] exige Túnez"
FRA_prov_event.143.d:0 "[ITA.getName] nos informó de que, para un alto el fuego total, deben obtener el control de la región de Túnez."
FRA_prov_event.143.a:0 "No podemos aceptar sus exigencias."
FRA_prov_event.143.b:0 "La situación es urgente. Aceptemos sus exigencias."

FRA_prov_event.144.t:0 "Rechazo de Francia"
FRA_prov_event.144.d:0 "Francia se negó a transferir el control de Túnez."
FRA_prov_event.144.a:0 "No conocen el valor de la paz."
FRA_prov_event.144.b:0 "No podemos entender sus exigencias."

FRA_prov_event.145.a:0 "Adieu pour toujour, Millenium.\n(Adiós para siempre, Milenio.)"
FRA_prov_event.145.t:0 "La ejecución de Yuuka"
FRA_prov_event.145.d:0 "\"...Considerando que la evidente violación de la soberanía de la República, los actos inhumanos sin causa y el haberlos tolerado y secundado constituyen un asunto grave que debe ser castigado severamente, se dicta la siguiente sentencia al acusado-\".\n\nEl sonido instantáneo del segundero colgado sobre la sala del tribunal se sintió como una eternidad.\n\n\"Acusada Hayase Yuuka: pena de muerte.\"\n\nEn la rígida sala, el golpe sordo del mazo resonó tres veces seguidas. A Yuuka se le revolvió el estómago. Pero más que la propia condena a muerte, la atormentaba la lluvia de vítores que caía desde las gradas. ¿Qué se suponía que había hecho mal? En el tribunal, la propia existencia de Yuuka se convirtió en el delito. Aunque lo negara, aunque gritara que no había hecho nada malo, no lo aceptaban. Y cada vez, la ira mezclada con sollozos la consumía. El final de la historia ya estaba decidido desde el principio. Solo le habían dado tiempo para pensarlo.\n\nMientras el antiguo imperio tecnológico exhalaba su último aliento, Yuuka respiraba con aspereza en el subsuelo y la oscuridad de Marsella. La pena de muerte ya estaba confirmada. ¿Pero cómo? Yuuka repasó todos los escenarios concebibles. Tenía que descartar, en lo posible, morir con dolor; así que, si de todos modos estaba destinada a morir, quería apagarse con tranquilidad. Irónicamente, cuando pasaron los días en los que rezaba por vivir… empezó a rezar por morir.\n\n\"Está lloviendo.\" La noche en que Yuuka, recostada contra los barrotes, no pudo dormir, estaba lloviendo. Como aquel día en que Millennium fue reducido a cenizas bajo la antorcha de la libertad azul, también llovía. Yuuka se preguntó qué habría sido de Rio, si Noa habría escapado con vida, y si la alborotadora Koyuki seguía encerrada. Le dio risa. No había reído ni una sola vez en un mes, pero cuanto más se acercaba al final, más recuperaba la risa perdida. Había abandonado los cálculos hacía tiempo por la cantidad de variables, pero la razón y la lógica parecían ya conocer la respuesta. La llovizna enfrió el calor de la máquina.\n\n\"¡Condenada a muerte número 18, sal!\"\n\nEl guardia gritó abriendo la puerta de barrotes. Yuuka miró el reloj de la pared. Eran las 12. Al intuir que su medianoche había llegado, sintió instintivamente el pesado terror de estar en el umbral entre la vida y la muerte. Suponiendo que esa conversación sería la última, abrió por fin la boca, que había mantenido cerrada. La última conversación debía ser, más que nunca, racional y lógica, y tener algo que pudiera demostrar.\n\n\"¿Qué pasó con los miembros del Seminario?\"\n\n\"...\"\n\nCon descortesía, en la última conversación de Yuuka, por más que torciera las palabras, confesara su culpa o suplicara perdón, el guardia no respondió. Le desagradó bastante, pero no tenía otra opción. Caminó lentamente por el duro pasillo de la prisión. Miró de reojo las celdas laterales, pero lo que veía era una hilera interminable de celdas vacías. Ella había entrado allí con muchas otras chicas. Pero ahora, como si se hubieran escondido en algún lugar, ya no se veían. ¿A dónde habían ido? La calculadora, a punto de ser triturada, inició su último cálculo.\n\nTras caminar unos diez y tantos minutos, salió por una puerta de acero de 20 cm de grosor. Aunque no tenía esperanzas de sobrevivir, en el fondo llegó a albergar una expectativa de vida. Pero la cruel razón y lógica no le permitieron soñar una esperanza vana. Le ataron las manos al patíbulo exterior.\n\n\"Por fin ha llegado mi hora.\"\n\n\"Antes que tú ya han muerto muchos. No pienses tonterías: mejor piensa en tu último deseo.\"\n\n\"Antes de morir, quisiera que respondiera a mi pregunta. Ese es mi último deseo. Noa, Rio, Koyuki… ¿adónde fueron?\"\n\n\"Están justo aquí.\"\n\n\"¿Qué?\"\n\n\"Te digo que están justo aquí. Justo encima de la tierra donde estás parada.\"\n\nLe dieron náuseas. Aquellas personas más queridas, en las que había pensado aunque fuera por un instante, ya llevaban mucho tiempo muertas. Y, además, por el mismo método que Yuuka… solo que antes. Yuuka imaginó a Noa retorciéndose de dolor por no morir de inmediato; a Rio aceptándolo todo antes de recibir los disparos; a Koyuki convulsionando ante la muerte. Eran escenas que Yuuka ya había previsto, pero el hecho de concluir que realmente era así la volvió aún más repugnante.\n\nEl sonido de botas que se acercaba lentamente tampoco ayudaba a calmarla. A ojo, eran diez pasos. Aunque pudiera morir de un solo golpe 'sin dolor', Yuuka no quería llegar ante la muerte. Quería vivir, quería prolongar esa vida tediosa.\n\n\"Procedan.\" Dijo un hombre con gorra de reglamento del ejército francés calada hasta los ojos; a simple vista, parecía un alto oficial. Con su breve orden, quienes estaban frente al pelotón se movieron con prisa: prepararon a los periodistas y revisaron los fusiles de los soldados. Yuuka concluyó que no la dejarían ir fácilmente.\n\n\"¡Preparados para disparar-\"\n\nEl corazón de Yuuka comenzó a latir con violencia. Mirara donde mirara, no había salida para escapar. El agua que se infiltra en la máquina acaba por averiarla.\n\n\"- ¡Fuego!\"\n\nCerró los ojos con fuerza. Cuando el segador blandió su guadaña, ella rezó para haber muerto de inmediato."

FRA_prov_event.146.t:0 "Devastación del norte de Francia"
FRA_prov_event.146.d:0 "Los combates urbanos interminables, y los ataques y defensas que cambiaban decenas de veces al día, devastaron las zonas urbanas del norte, incluida París."
FRA_prov_event.146.a:0 "No es más que un sacrificio menor."

FRA_prov_event.147.t:0 "Caos administrativo"
FRA_prov_event.147.d:0 "Con la reconquista de la metrópoli, la vasta tierra y numerosos franceses han quedado bajo nuestro control. Hasta que restauremos el sistema administrativo, sufriremos gran confusión en la aplicación de políticas."
FRA_prov_event.147.a:0 "Qué fastidio."

FRA_prov_event.148.t:0 "Devastación del sur de Francia"
FRA_prov_event.148.d:0 "Debido a la resistencia rural persistente, la guerra de guerrillas y las operaciones de devastación en el sur, las zonas rurales del sur han quedado devastadas."

FRA_prov_event.149.t:0 "Conmemoración de la Comuna de París"
FRA_prov_event.149.d:0 "En 1871, negándose a aceptar la derrota en la guerra franco-prusiana y levantándose contra el gobierno burgués, los ciudadanos de París establecieron la Comuna de París y, durante tres meses, implementaron un socialismo moderno mientras luchaban contra las fuerzas gubernamentales. Aunque las tropas burguesas, apoyadas por Alemania, finalmente aniquilaron a la Guardia Nacional que defendía París y masacraron a innumerables ciudadanos, el espíritu combativo de la revolución sigue vivo.\n\nEl 18 de marzo, día conmemorativo de la Comuna de París, será designado en adelante como feriado nacional."
FRA_prov_event.149.a:0 "¡Póngase de pie, usted también!"

FRA_prov_event.150.t:0 "Constitución socialista de [GetYear]"
FRA_prov_event.150.d:0 "Al superar la sociedad capitalista y mediante una reforma constitucional pacífica, la Francia socialista ha mostrado finalmente su figura. La nueva constitución socialista francesa incluirá: propiedad pública de los medios de producción; amplia seguridad social y bienestar bajo responsabilidad estatal; establecimiento del poder obrero mediante derechos laborales y consejos sectoriales; y la prohibición integral de la discriminación—esté o no expresamente codificada."
FRA_prov_event.150.a:0 "¡Avancemos hacia la Francia socialista!"

FRA_prov_event.151.t:0 "Teoría de la liberación de la mujer"
FRA_prov_event.151.d:0 "Hasta ahora, la corriente principal del feminismo ha sido el 'feminismo liberal'. Pero este tiene el límite de haber reclamado la expansión de los derechos de las mujeres sin superar las contradicciones internas del capitalismo y el liberalismo; y Francia es, además, un país atrasado en derechos, incapaz de realizar plenamente siquiera las políticas que ese feminismo liberal defiende.\n\nSin embargo, avanzaremos hacia una sociedad abierta en la que, frente a la imposición de trabajo doméstico y de cuidados por parte del capitalismo, aboliremos con audacia la discriminación de género en salarios y ascensos, servicio militar y otros ámbitos sociales; y reconoceremos activamente la libertad corporal de las mujeres, garantizando el derecho al aborto."
FRA_prov_event.151.a:0 "¡Abolid la discriminación!"

FRA_prov_event.152.t:0 "Sindicatos diversificados"
FRA_prov_event.152.d:0 "Los sindicatos normalmente actúan para promover los intereses de sus afiliados, pero la mayoría exhibe una orientación política y opera aliándose con partidos.\n\nEn este contexto, podríamos fortalecer el gobierno apoyando discretamente a un sindicato moderado reformista o a un sindicato socialista radical. También es posible mantener la neutralidad del gobierno."
FRA_prov_event.152.a:0 "Apoyemos a un sindicato moderado."
FRA_prov_event.152.b:0 "Apoyemos a un sindicato socialista radical."
FRA_prov_event.152.c:0 "Es preferible mantener la neutralidad."

FRA_prov_event.153.t:0 "Devastación del este de Francia"
FRA_prov_event.153.d:0 "La guerra de guerrillas librada con visibilidad limitada en montañas y bosques se ha concentrado en el este, devastándolo hasta el punto de que la industria minera, allí concentrada, ya no puede funcionar."
 FRA_recover.1.t:0 "Condecoración a los soldados"
 FRA_recover.1.d:0 "El comité provisional formado tras la declaración de liberación ha decidido otorgar condecoraciones a todos aquellos que, durante la guerra de recuperación, derramaron su sangre o perdieron la vida para proteger a sus familias, al pueblo y a la patria."
 FRA_recover.1.a:0 "Todos ellos son ciudadanos dignos de orgullo."
 FRA_recover.3.t:0 "Influencia de España"
 FRA_recover.3.d:0 "[SPR.getname] ha exigido que apoyemos la reconstrucción de su industria nacional, devastada por la guerra civil, como compensación por habernos ayudado durante la guerra de recuperación."
 FRA_recover.3.a:0 "Debemos cumplir la promesa."
 FRA_recover.4.t:0 "Disolución de la Resistencia"
 FRA_recover.4.d:0 "A medida que nuestro territorio nacional se recupera, la Resistencia será reorganizada e integrada en el ejército regular, quedando disuelta."
 FRA_recover.4.a:0 "Todos han trabajado duro hasta ahora."
 FRA_recover.5.t:0 "Tratamiento de los colaboradores"
 FRA_recover.5.d:0 "Debemos encargarnos de los pequeños burgueses que colaboraron con el otro mundo tras la Gran Transferencia."
 FRA_recover.5.a:0 "Todos serán castigados conforme a la ley."
 FRA_recover.5.b:0 "Ellos tampoco tuvieron elección. En su lugar, excluyámoslos del ámbito público."
 FRA_recover.6.t:0 "Disputa de propiedad"
 FRA_recover.6.d:0 "Mientras innumerables ciudadanos emprendían el exilio hacia el norte de África, otros que permanecieron en la metrópoli ocuparon las tierras y propiedades que aquellos dejaron atrás. Sin embargo, con el regreso de los exiliados, debemos resolver estas disputas de propiedad. Una forma es devolverles sus bienes; otra, reconocer a los nuevos propietarios y, a cambio, compensar a los exiliados por una parte considerable de lo que les fue arrebatado."
 FRA_recover.6.a:0 "Devolvamos las propiedades a los exiliados."
 FRA_recover.6.b:0 "Compensemos a los exiliados."

 FRA_ex_event.1.t:0 "Crisis argelina"
 FRA_ex_event.1.d:0 "Han pasado varios meses desde que la ira contra la metrópoli por incumplir sus promesas cubrió las calles de Argel. Los argelinos iniciarán un movimiento para criticar y oponerse a la metrópoli."
 FRA_ex_event.1.a:0 "No conocen su lugar."

 FRA_ex_event.3.t:0 "Concentraciones esporádicas en Argelia"
 FRA_ex_event.3.d:0 "Han llegado noticias alarmantes desde las autoridades de seguridad. Desde el amanecer, han comenzado concentraciones de árabes en numerosos lugares, incluidos antiguos estadios y teatros, y en apenas unas horas las calles se han llenado por completo de manifestantes. Argel ya se ha convertido en un caos.\n\nLa mayoría de los miembros del gabinete afirma que la situación actual se originó en la orden de movilización promulgada inmediatamente después de la derrota. Dicen que el estado de un país cuyo peso de la economía interna se ha reducido al extremo está empezando a destruir sus vidas. Quizá los hemos exprimido demasiado.\n\nSe ha publicado un comunicado a nivel gubernamental, y esperamos que con ello se calme aunque sea un poco el descontento de los árabes. Sin embargo, parte de las fuerzas de seguridad sostiene que debemos prohibir las concentraciones para apagar cuanto antes la chispa. El gabinete se ha dividido en dos, y la hora de decidir se acerca."
 FRA_ex_event.3.a:0 "¡Prohíban las concentraciones!"
 FRA_ex_event.3.b:0 "Se calmarán por sí solos."
 FRA_ex_event.4.t:0 "Manifestación anticolonial"
 FRA_ex_event.4.d:0 "Organizaciones de izquierda han realizado protestas exigiendo la retirada de la política colonial y la concesión de la ciudadanía francesa a los argelinos."
 FRA_ex_event.4.a:0 "No piensan en el interés nacional."
 FRA_ex_event.4.b:0 "Quizá eso sea lo correcto."
 FRA_ex_event.5.t:0 "Reacción de la comunidad argelina"
 FRA_ex_event.5.d:0 "La comunidad argelina residente en Francia se ha sumado al discurso anticolonial y está pronunciándose a favor de la autonomía de Argelia."
 FRA_ex_event.5.a:0 "La situación se agrava cada vez más."
 FRA_ex_event.5.b:0 "No podemos demorarlo más. Aceptemos sus demandas."
 FRA_ex_event.6.t:0 "Lucha armada en Argelia"
 FRA_ex_event.6.d:0 "ㅈㄱㄴ"
 FRA_ex_event.6.a:0 "Maldita sea."
 FRA_ex_event.7.t:0 "Condena internacional"
 FRA_ex_event.7.d:0 "ㅈㄱㄴ"
 FRA_ex_event.7.a:0 "Si hubiéramos reprimido sus declaraciones..."
 FRA_ex_event.7.b:0 "¿Y si alcanzamos un acuerdo con el liderazgo argelino?"
 FRA_ex_event.8.t:0 "Huelga general argelina"
 FRA_ex_event.8.d:0 "Los argelinos han iniciado una huelga general para imponer sus exigencias."
 FRA_ex_event.8.a:0 "Realmente han cruzado la línea."
 FRA_ex_event.9.t:0 "¿Referéndum?"
 FRA_ex_event.9.d:0 "A medida que la huelga general se prolonga durante meses, las organizaciones anticoloniales nacionales y el liderazgo del movimiento independentista argelino han propuesto resolver la crisis actual por medios democráticos."
 FRA_ex_event.9.a:0 "La democracia es un lujo para los bárbaros."
 FRA_ex_event.9.b:0 "Tienen razón."
 FRA_ex_event.10.t:0 "Acuerdos de Constantina"
 FRA_ex_event.10.d:0 "Bajo la premisa de la independencia, hemos logrado arrancar importantes concesiones a los argelinos y el acuerdo de Constantina se ha concluido con éxito."
 FRA_ex_event.10.a:0 "Esta es la diplomacia del acuerdo."
 FRA_ex_event.11.t:0 "Guerra de independencia argelina"
 FRA_ex_event.11.d:0 "Ayer mismo, el ayuntamiento de Argel fue ocupado por miles de personas y la bandera argelina fue izada allí. Los líderes políticos argelinos han reunido organizaciones paramilitares y a los jóvenes, y han asaltado bases militares francesas."
 FRA_ex_event.11.a:0 "Era inevitable."
 FRA_ex_event.12.t:0 "Apoyo árabe a Argelia"
 FRA_ex_event.12.d:0 "Marruecos, Túnez y otros países vecinos de Argelia están apoyando la independencia argelina."
 FRA_ex_event.12.a:0 "¡Maldita sea!"
 FRA_ex_event.13.t:0 "Interferencia italiana"
 FRA_ex_event.13.d:0 "Italia está apoyando a Argelia."
 FRA_ex_event.13.a:0 "¡Después de Argelia, van ustedes!"
 FRA_ex_event.14.t:0 "Creciente sentimiento antibélico"
 FRA_ex_event.14.d:0 "En el momento en que debemos reconstruir el país tras recuperar el territorio nacional, es absurdo consumir recursos en una guerra sin sentido contra Argelia, y tampoco existe una causa legítima. Los jóvenes consideran injusto que se les envíe a combatir."
 FRA_ex_event.14.a:0 "La juventud de hoy..."
 FRA_ex_event.15.t:0 "Liberación"
 FRA_ex_event.15.d:0 "[FRA_philippe_petain.getname] contempló la ciudad de la luz, que confundía sus recuerdos.\n\nPodrá tambalearse, pero no hundirse; podrá derrumbarse la ciudad, pero jamás apagarse su luz azul.\n\nLa ciudad brilla.\n\nAunque la torre triangular de hierro desapareció y en su lugar se alzó un palacio de cristal blanquísimo, sigue brillando.\nAunque se han perdido en gran medida las huellas de la vieja república y la ciudad, con más grises que tejados negros y marrones, continúa brillando.\nParís sigue siendo una existencia que permanece a tu lado toda la vida, como una fiesta en movimiento.\n\nPétain se puso en marcha. Junto a los demás, se dirigió a la histórica iglesia abovedada a orillas del Sena. La iglesia a la que los ciudadanos acudieron en tiempos de revolución, con la tricolor ondeando, para procurarse fusiles; antes y ahora, funcionaba como mausoleo donde duermen los héroes de Francia.\n\nLos Inválidos.\n\nPétain contempló el sarcófago. Contempló el mayor sarcófago de los Inválidos: bajo la tricolor, la casa donde descansa el cuerpo del más grande de los generales, del más grande de los emperadores del Imperio francés.\n\nEl niño de la familia Bonaparte, nacido en una aldea corsa, dominó la hegemonía de Europa. Al final cayó sin poder vencer el frío ruso, pero el mito del emperador sigue vigente.\n\nHace unos años, en Navidad, Pétain —que tuvo que abandonar la patria y huir— no hizo más que mirar el sarcófago. Era una escena impensable incluso hacía solo unos meses. Deseaba volver a la patria, pero hubo momentos en que pensó que no volvería hasta dormir para siempre dentro de un ataúd.\n\nY aun así, Pétain finalmente regresó. Expulsó a las estudiantes con aureolas sobre sus cabezas y volvió a pisar la tierra como dueño del hexágono.\nPétain salió de los Inválidos. Multitudes, vítores. La tricolor ondeando.\n\nEllos lo estaban mirando a él, a su enemigo. Los parisinos, los franceses, los de la vieja república, lo aclamaban. Francia miraba hacia Pétain.\n\nPétain estaba desbordado de emoción.\nIntentó mantener la calma, pero no pudo.\n\nEl mariscal gritó."
 FRA_ex_event.15.a:0 "'¡Viva Francia!'"
 FRA_ex_event.16.t:0 "Represión de la izquierda"
 FRA_ex_event.16.d:0 "A pesar de que el parlamento ha sido suspendido, figuras de izquierda como Léon Blum y Édouard Daladier siguen teniendo una enorme influencia en la política. En particular, Léon Blum criticó la dictadura militar de Pétain afirmando que: \"Que él, héroe de guerra y símbolo de la victoria, haya suspendido el parlamento, es una cruel traición moral, una rebelión contra la democracia; si no es eso, ¿qué es?\".\n\nTras este comunicado, Pétain, en nombre de la estabilidad nacional, emitió órdenes de arresto contra dirigentes de izquierda, alegando conspiración de terrorismo comunista contra el gobierno y la responsabilidad por la derrota en la guerra Milenio–Francia. Daladier y Blum, que estaban publicando en París una declaración contra la dictadura militar, fueron arrestados en el acto, y varios líderes de partidos de izquierda fueron encarcelados en cadena.\n\nActualmente, dentro del comité de reconstrucción se contempla el caso con gravedad, y se está debatiendo un proyecto de ley para prohibir los partidos de izquierda."
 FRA_ex_event.16.a:0 "Si es para proteger a Francia de los ataques de la izquierda..."
 FRA_ex_event.17.t:0 "Servicio militar de la Resistencia"
 FRA_ex_event.17.d:0 "Tras recuperar el territorio nacional, la Resistencia en toda Francia está siendo investigada por nuestro gobierno, y parece que la mayoría de sus miembros ya han depuesto las armas.\n\nPara enfrentarnos a las fuerzas amenazantes de Europa después de la recuperación, podríamos volver a poner armas en sus manos y organizar divisiones de la Resistencia, obteniendo con facilidad un gran ejército bien entrenado."
 FRA_ex_event.17.a:0 "El nombre de Ejército de Liberación Nacional suena bien."
 FRA_ex_event.17.b:0 "No, no necesitamos un ejército; necesitamos trabajadores."
 FRA_ex_event.18.t:0 "Fábrica de producción de tanques"
 FRA_ex_event.18.d:0 "Mientras recuperábamos el control de las instalaciones industriales de Milenio y nos adaptábamos a su tecnología avanzada, conseguimos el control de una gran fábrica de producción de tanques que la Escuela de Ciencia de Milenio estaba planificando.\n\nLa mayor parte de la autoridad de la Escuela de Ciencia de Milenio ha quedado suspendida, por lo que no podemos reactivar la fábrica, pero podremos formar divisiones con estos tanques."
 FRA_ex_event.18.a:0 "Bien."
 #Decisiones de Francia
 FRA_ALG_war:0 "Crisis argelina"
 FRA_ALG_war_desc:0 "Con la recuperación del territorio metropolitano, la 'mayoría' de los franceses celebró, pero la 'minoría' —los argelinos, tratados como población no civilizada— no pudo hacerlo. Francia, que había prometido la independencia a otras colonias a cambio de su cooperación en la guerra, sostuvo en el caso de Argelia que los argelinos eran franceses y que Argelia formaba parte del territorio metropolitano, negando así su independencia. La opresión siempre engendra resistencia. Los argelinos se opondrán firmemente a Francia."
 FRA_ALG_going_bad:0 "Empeora la resistencia argelina"
 FRA_ALG_going_bad_tt:0 "La resistencia argelina aumenta en §R1§!"
 FRA_ALG_gg:0 "Aprobar la independencia de Argelia"
 FRA_ALG_war_gg:0 "Retirarse de Argelia"
 FRA_ALG_war_ita:0 "Interferencia italiana"
 FRA_ALG_gg_tt:0 "El nivel de resistencia argelina es §Y5§! o superior"
