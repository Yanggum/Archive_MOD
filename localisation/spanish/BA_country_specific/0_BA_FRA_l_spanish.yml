 FRA_african_rage_mission: "Resistencia en expansión"

 FRA_disruption_event.1.t: "Pequeña chispa - 1"
 FRA_disruption_event.1.d: " \"¿De qué estás hablando? Vamos, dilo de una vez.\"\n\"En este estado no puedo decírselo.\"\n\"¿Por qué?\"\n\"Hemos venido aquí representando a 2,500 trabajadores.\"\n\"Ya veo. ¿Y entonces?\"\n\"Nosotros usamos un trato respetuoso, pero el subdirector de la planta y los jefes nos hablan de forma despectiva.\"\n\"Ha sido un error nuestro.\"\n\n \"Entonces, ¿cuáles son exactamente sus demandas?\"\n\"Aumento salarial del 25 %, pago inmediato de salarios atrasados y reincorporación incondicional de los despedidos injustamente. Eso es todo.\"\n\"Los salarios ya fueron ajustados en febrero y se están pagando conforme a ese ajuste. El bono también se pagó a finales del año pasado.\"\n\"Fue un aumento unilateral. El bono pagado ni siquiera merece llamarse bono. Apenas equivalía a un mes de horas extra.\"\n\n \"Jefe de sucursal, entréguenos ese cuaderno. Y terminemos con esto.\"\n\"¿Cuándo recibiremos la respuesta de la empresa a nuestras demandas?\"\n\"No esperen nada. No tenemos nada que dar a quienes ven todo con ojos negativos. No entiendo por qué niegan nuestro progreso.\"\n\"No es así. Quienes trabajan en el frente industrial somos nosotros, los trabajadores. Simplemente exigimos que esos beneficios también se nos devuelvan. ¿Por qué debemos debilitarnos para una economía sana?\"\n\"Con el tiempo, todo se resolverá.\""
 FRA_disruption_event.1.a: "\"Los trabajadores ya han esperado demasiado tiempo.\""

 FRA_disruption_event.2.t: "Pequeña chispa - 2"
 FRA_disruption_event.2.d: " El fuego se alzó. Pasamos dos días completos sin dormir defendiendo la fábrica. Los gendarmes fueron despiadados. Vi la cabeza de un compañero teñirse de rojo. Afortunadamente, no lograron entrar a la fábrica. La acería se convirtió en una fortaleza inexpugnable. Encerramos a los administradores en una sala. Las herramientas se volvieron armas. Largos troncos bloqueaban el avance de los gendarmes. Esperábamos a Rahim, que había salido a llevar noticias. La comida empezaba a escasear.\n\n Estábamos completamente rodeados por la gendarmería. Nada podía entrar en la fábrica. Tampoco salir. Tres cobardes escaparon corriendo, pero fueron golpeados hasta perder el conocimiento. Ellos no querían pelear. Por suerte, teníamos suficientes cócteles molotov. El alto horno no se enfrió. Si vertíamos el metal fundido, no podrían subir.\n\n Desde la fábrica de al lado se oían ruidos de cosas rompiéndose y chocando. Quince personas se unieron a nuestra fábrica por un pasaje oculto. Nos informaron que todos los de la fábrica vecina habían sido detenidos. Ya no había lugar para retroceder.\n\n Afuera se veían soldados dispersos. No entiendo francés. Gritaban algo por los altavoces y varios compañeros se ocultaron apresuradamente. Pensé que eran cobardes. Los troncos y los cascos de seguridad me protegían. Lancé con todas mis fuerzas un cóctel molotov hacia ellos."
 FRA_disruption_event.2.a: "\"¡Fuego!\""

 FRA_disruption_event.3.t: "Resistencia argelina"
 FRA_disruption_event.3.d: "Argelia, tratada y administrada como parte del 'territorio metropolitano' de Francia, parece la región más estable del África del Norte francesa. Sin embargo, en esta zona crecen el descontento estructural contra el poder colonial, su represión, y los brotes del nacionalismo. La 'Estrella del Norte de África' (Étoile nord-africaine, ENA), fundada en 1926, organiza un movimiento de resistencia basado en el nacionalismo. Aunque ha sido ilegalizada en múltiples ocasiones, mantiene células clandestinas y espera su oportunidad."
 FRA_disruption_event.3.a: "Es terrible."
 FRA_disruption_event.3_tt: "\n§gDebido a que las rutas distintas a §4Philippe Pétain§! aún no están completamente desarrolladas, en la §Wversión actual§! la §Yfase de crisis de Francia§! no puede superar §R4§!.§!\n\n"

 FRA_disruption_event.4.t: "El invierno de Orán"
 FRA_disruption_event.4.d: " Louis Martin comenzaba cada día al amanecer cargando mercancías cerca del puerto. La pequeña casa que su padre le había dejado pasó al banco cuando el precio del trigo se desplomó durante la Gran Depresión. Lo único que quedó fue una habitación del tamaño de una cocina y una cama vieja.\n\n \"Louis, si hoy tampoco consigues trabajo, para cenar solo habrá pan.\"\nDijo su esposa Marie, frotándose los ojos con la luz del amanecer. Louis no respondió; se caló el sombrero y salió.\n\n En el puerto competía por el trabajo chocando hombro con hombro con obreros musulmanes argelinos. Todos eran pobres. Todos pasaban hambre. Pero Louis no podía ser su amigo, ni tampoco su enemigo. Entre ellos existía una frontera invisible. Una distancia creada por un pasaporte francés.\n\n De regreso, Louis se encontró con Marie y sus dos hijas, cargando bultos. Intentó saludarlas con alegría, pero no pudo. Había lágrimas acumuladas en los ojos de las niñas. Sin poder consolar el rostro sombrío de Marie, Louis corrió desesperado hacia el solar donde estaba su casa.\n\n \"¡Bang!\"\nEl techo se desplomó levantando una nube de polvo. Cuando esta se disipó, personas con mazos de hierro descubrieron a Louis.\n\n Un funcionario que parecía estar a cargo de la demolición se acercó. Le entregó papel y pluma, señalando con el dedo un recuadro. Debía firmar. Louis levantó entonces su mano izquierda.\n\n Todo ocurrió en un instante. El funcionario se cubrió el rostro con ambas manos, inclinando el cuerpo. La sangre se filtró entre sus dedos. Louis lo golpeó de nuevo. El funcionario cayó de bruces. Los hombres con mazos se abalanzaron sobre Louis."
 FRA_disruption_event.4.a: "Todo terminó rápidamente. Louis yacía en el suelo como si estuviera muerto."

 FRA_disruption_event.5.t: "Urbanización"
 FRA_disruption_event.5.d: " La brisa marina de la madrugada era fresca. Youssef Benhamid sintió instintivamente que la primavera había llegado. Cada mañana comenzaba el día inhalando el aroma del café en los callejones de la Casbah. Su tienda, heredada de su padre, era una pequeña tienda de telas, estrecha pero con una ventana donde las telas blancas ondeaban al viento. El puerto visible desde la ventana y el ir y venir de la gente eran como su propia vida entera. Aunque se asomó para aspirar el aire primaveral, su expresión no mostraba disfrute alguno. Ese día vencía el plazo final del 'desalojo forzoso' anunciado por el ayuntamiento un mes antes.\n\n \"Esto no es solo mudarse, Youssef.\"\nRecordó las palabras de su vecino Jean-Pierre.\n\"Derribarán nuestras tiendas y construirán aquí una avenida y una plaza al estilo europeo.\"\n\n Desde el minarete de la mezquita resonó la llamada a la oración. La gente formó filas. Dejaron los edificios y caminaron siguiendo a los soldados que encabezaban la marcha. Caminaron medio día.\n\n Los soldados se detuvieron. La gente también.\n Los que iban al frente preguntaron a los soldados hacia dónde debían ir ahora.\n El soldado respondió.\n\n\n\n Youssef vivió una experiencia terrible. Los soldados abandonaron a la gente en una llanura sin ninguna infraestructura. Afortunadamente, podían beber agua de un estrecho río cercano. No había alimentos. Algunos se marcharon. No podían dirigirse hacia la ciudad por culpa de los soldados. Youssef tuvo el presentimiento de que regresarían en tres días.\n\n \"¡Por favor! ¡Denos comida! ¡Mi hijo se está muriendo!\"\nTras una semana, se escuchaban gritos desesperados por todas partes. Tres días después, ni siquiera eso se oía. Youssef llevaba dos días sin comer. En el horizonte norte se recortaban los edificios de la ciudad. Esperaba la salvación."
 FRA_disruption_event.5.a: "\"¡Enemigo, estamos aquí!\""

 FRA_disruption_event.6.t: "La tierra"
 FRA_disruption_event.6.d: " En la primavera de 1938, la cebada de la llanura de Mitidja maduraba. Pero Abdelhamid y su familia sabían bien que ese grano no les pertenecía. La tierra que cultivaban era propiedad del terrateniente europeo, el señor Renault, y más de la mitad de la cosecha debía entregarse como renta.\n\n Ese invierno, el gobierno colonial aumentó aún más la renta y exigió el pago en efectivo. Todo ello pese a la reducción de la cosecha por la sequía y las plagas. Los aldeanos se reunieron bajo la vieja higuera detrás de la mezquita.\n\n El anciano imán dijo:\n \"Si el grano que cultivamos con nuestro sudor no llega a la boca de nuestros hijos, esto no es la voluntad de Dios.\"\n\n Desde ese día, los campesinos dejaron de ir a los campos. Dejaron las horcas apoyadas en los patios y, en su lugar, hablaron con activistas llegados de Argel. Escucharon palabras como 'sindicato campesino' y 'derechos'.\n\n Al segundo día, la gendarmería entró en la aldea. El señor Renault acusó a Abdelhamid de 'incumplimiento de contrato' y le confiscó el ganado. Los niños lloraron, pero él no bajó la cabeza.\n\n Los aldeanos dejaron de cultivar. Al cuarto día, los gendarmes devastaron la aldea. Pero al quinto día, la gente tampoco salió. La gendarmería se llevó a decenas de personas. Los aldeanos resistieron con fiereza, pero finalmente todos fueron reprimidos.\n\n \"...dicen que ocurrió algo así.\""
 FRA_disruption_event.6.a: "\"Bonita historia. Deportémoslos.\""

 FRA_disruption_event.7.t: "El clamor de la justicia que resonó en la llanura de Mitidja"
 FRA_disruption_event.7.d: "                                                        Desde Argel, 14 de marzo de 1938 — Corresponsal especial M. Laurent\n\n En la fértil llanura de Mitidja, los pobres campesinos musulmanes han iniciado una lucha histórica. Durante décadas han vivido bajo la explotación de terratenientes europeos. Hoy, más de la mitad del grano que cultivaron es arrebatado por la fuerza y enviado, a través del puerto, a los almacenes de los burgueses de la metrópoli. Mientras los niños pasan hambre y las esposas sobreviven compartiendo pan, los terratenientes beben café en los cafés de Argel.\n\n La semana pasada, los aparceros de la aldea decidieron no salir a los campos. En sus manos, no había horcas, sino la bandera de la justicia.\n \"¡Pan y derechos!\"\n Esta simple y grandiosa exigencia llenó los campos de Mitidja.\n\n ¡Trabajadores y campesinos del Norte de África, escuchad! Estos campesinos son nuestros hermanos, y están en la misma lucha. Su combate es el primer paso para romper las cadenas de la explotación colonial y avanzar juntos, trabajadores y campesinos, hacia la libertad.\n\n El gobierno colonial envía a la gendarmería para intimidar, confiscar ganado y amenazar. Pero sabemos esto: la voz del hambriento nunca será silenciada. El clamor que resuena en los campos de Argelia llegará a los muelles de Orán, a las fábricas de Constantina y a las acerías de Annaba.\n\n Estamos con ellos. ¡Reducción de las rentas! ¡Fin del pago en efectivo! ¡Derecho a la tierra para todos los campesinos! La lucha de los campesinos argelinos es nuestra lucha. ¡Por la libertad y el pan, en un solo frente!\n\n- Partido Popular del Norte de África"
 FRA_disruption_event.7.a: "¿¡Qué demonios es esto!? ¡Ciérrenlo de inmediato!"

 FRA_disruption_event.8.t: "Partido Popular del Norte de África"
 FRA_disruption_event.8.d: " El Partido Popular del Norte de África (PPNA) es una organización política sucesora de la 'Estrella del Norte de África', y la organización de izquierda antiimperialista más influyente del Norte de África. Ha ganado apoyo entre quienes se indignaron al ver al Partido Comunista Francés mirar hacia otro lado ante el giro derechista del gobierno en el exilio bajo una coalición nacional. Goza de popularidad entre los pobres, las clases bajas, musulmanes de clase media, intelectuales, jóvenes y socialistas. En particular, al aliarse con la CGT, ha asegurado una enorme capacidad organizativa, superando su estrechez ideológica y dando a sus simpatizantes un objetivo claro y único: la lucha obrera antiimperialista y antiexplotación.\n\n Según informes de inteligencia, varios miembros del partido asistieron a la conferencia del Komintern de 1937 y se ha confirmado que recibieron apoyo financiero de la Unión Soviética."
 FRA_disruption_event.8.a: "Qué dolor de cabeza."

 FRA_disruption_event.9.t: "Desempleo"
 FRA_disruption_event.9.d: "Los trabajadores trabajaban en la misma fábrica, pero todos lo hacían de forma aislada. El tiempo de comida era corto. Los trabajadores europeos entraban al comedor. Nosotros comíamos pan y aceitunas en un rincón de la fábrica. El supervisor Dumais decía que eso era 'la norma'. Y nos apuraba a comer. Cada vez que terminábamos, los supervisores nos obligaban a hacer ejercicio. Salíamos al patio a patear el balón hasta morir de cansancio. Parecían odiar que nos reuniéramos a hablar.\n\n \"No es que no sepamos hablar. Esto es una forma de lucha.\"\nMe dijo Mustapha.\n \"Debemos luchar por el trato mínimo que merecemos. La lucha siempre surge cuando lo correcto y lo incorrecto chocan. Piensa de qué lado estamos.\"\n\n Mustapha se saltó el almuerzo. Yo, como siempre, pateé el balón.\n\n El salario se redujo. Aparecieron máquinas relucientes por toda la fábrica. El volumen de trabajo aumentó. Al caer la noche, estábamos exhaustos. Entonces el supervisor Dumais hablaba de la recesión. Teníamos miedo de que la fábrica cerrara. Dumais lo sabía.\n\n El día de pago, los trabajadores hablaban aún menos. El compañero de al lado era el menos confiable. Quien mencionaba una injusticia era despedido sin que nadie lo supiera.\n\n Mustapha desapareció un día de la fábrica. Sin preguntar, todos sabíamos lo que le había pasado."
 FRA_disruption_event.9.a: "'Sentí culpa.'"
 FRA_manage_strike_cat: "Huelga general colonial"
 FRA_manage_strike_cat_desc: "\n\n\n\n£GFX_decisions_FRA_strike\n\n\n\n\n\n\n\nNuestra industria ha quedado paralizada. Los pueblos del Norte de África han entrado en una huelga general antiimperialista para defender su derecho a sobrevivir. ¡Francia no es más que alguien aferrado a un precario acantilado llamado la era del imperialismo!\n\n Organización de la huelga de la §YCGT§! £GFX_repairing : §R[?FRA_cgt_org]§!§!\n §!Investigación de £GFX_inspect_texticon §Ypuntos de contacto§! con el §OPartido Popular del Norte de África§!: §Y[?FROM.FRA_ppna_search]%§!\n"
