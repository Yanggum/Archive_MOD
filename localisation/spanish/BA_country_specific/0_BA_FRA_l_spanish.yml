 FRA_across_mid:0 "Cruzando el Mediterráneo"
 FRA_across_mid_desc:0 "Aprovechando nuestra abrumadora superioridad naval, concebiremos operaciones de desembarco más concretas y planificadas, para ejecutar un desembarco rápido y seguro."
 FRA_last_liberate_plan_flag_tt: "Otro §Y£GFX_decision_icon_small plan de recuperación de la metrópoli§! está en marcha"
 FRA_fight_with_MIL_1: "Plan de recuperación de la metrópoli - I"
 FRA_fight_with_MIL_1_desc: "Este plan, de cientos de páginas discutidas durante largo tiempo por un Estado Mayor centralizado, es un plan operativo concreto para recuperar la Francia metropolitana. Su objetivo es que la marina, la fuerza aérea y el ejército cooperen para cruzar el Mediterráneo y desembarcar en la metrópoli. La operación se divide en varias fases, y cada una requiere una preparación y coordinación exhaustivas.\n\nEn la primera fase, nuestro objetivo es desembarcar en la metrópoli y asegurar una cabeza de playa."
 FRA_fight_with_MIL_2: "Plan de recuperación de la metrópoli - II"
 FRA_fight_with_MIL_2_desc: "En la segunda fase, nuestro objetivo es ampliar la cabeza de playa y llevar a cabo una guerra de posiciones dentro de la metrópoli. Para ello, cooperaremos con la Resistencia local para reforzar la recopilación de información y el apoyo. Además, planeamos introducir fuerzas y equipo adicionales para sostener las operaciones militares dentro de la metrópoli.\n\nEn esta fase, prestaremos especial atención a la protección de civiles y a la ayuda humanitaria dentro de la metrópoli."
 FRA_fight_with_MIL_3: "Plan de recuperación de la metrópoli - III"
 FRA_fight_with_MIL_3_desc: "En la tercera fase, nuestro objetivo es recuperar las principales ciudades y puntos estratégicos mediante una gran ofensiva dentro de la metrópoli. Para ello, concentraremos todos los suministros en el ataque y, con ello, expulsaremos por completo el control de Millennium en la metrópoli.\n\n§4¡Es la batalla final!§!"
