 FRA_focus.1:0 "¡El exilio se terminó!"
 FRA_focus.1_desc:0 "Pétain ha avivado su determinación de recuperar de nuevo la metrópoli."
 FRA_focus.1_tt:0 "\n§4Definiremos con claridad el estado de emergencia y revisaremos de forma concreta los planes integrales para penetrar en la metrópoli.§!" 
 FRA_focus_ind:0 "Preparativos para la industrialización"
 FRA_focus_ind_desc:0 "Ampliaremos la industria a costa de numerosos sacrificios."
 FRA_focus_2:0 "Movilización total" 
 FRA_focus_2_desc:0 "Para levantar edificios que se alzan en mitad de la nada, hacen falta muchos sacrificios. Mediante una movilización de mano de obra integral y rápida, lograremos la industrialización en poco tiempo."
 FRA_focus_3.1:0 "Desarrollar Túnez"
 FRA_focus_3.1_desc:0 "La industria va antes que las personas. ¿Acaso no podremos dar bienestar y libertad una vez que nos hayamos desarrollado?"
 FRA_focus_3:0 "Desarrollar Argelia"
