 FRA_promise_cut_desc:0 "Confiando en las promesas del gobierno, cientos de miles de hombres colonizados murieron en el frente, y cientos de miles de mujeres colonizadas trabajaron día y noche en los talleres. Ya no pueden confiar en el gobierno y, para obtener la independencia, están dispuestos a arrojar en cualquier momento sus vidas destrozadas."
