 FRA_national_revolutionary_committee_regime_overthrow: "Formar el Comité Revolucionario Nacional"
 FRA_charles_maurras_focus_4: "Führer Charles Maurras"
 FRA_charles_maurras_focus_5: "Anular la ley de exilio"
 FRA_charles_maurras_focus_6: "Reconstruir a los orleanistas"
 FRA_charles_maurras_focus_6_desc: "Los orleanistas cuentan con un respaldo considerable entre los monárquicos franceses. Aunque algunos críticos prefieran a otro pretendiente, apenas cabe duda de que el heredero de Orleans es quien dispone de la mejor oportunidad para unificar pacíficamente al país tras él."
 FRA_charles_maurras_focus_7: "Sucesión legítima"
 FRA_charles_maurras_focus_7_desc: "Los monárquicos legitimistas consideran a una facción del carlismo como el heredero legítimo del trono de Francia. Nombrar a su candidato abre la tentadora posibilidad de que, bajo un sistema de doble corona, España y Francia puedan ser gobernadas a la vez."
 FRA_charles_maurras_focus_8: "Proclamar el Tercer Imperio"
 FRA_charles_maurras_focus_8_desc: "Los bonapartistas pueden ser vistos como forasteros en la disputa sucesoria, pero llevan consigo el sueño de una época en la que toda Europa inclinaba la cabeza ante un emperador francés."

