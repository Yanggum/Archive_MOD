 BA_war_escalation_2_tt:0 "Nivel 2\n Sin efecto"
 BA_war_escalation_3_tt:0 "Nivel 3\n §YArgelia§!: Concentraciones esporádicas"
 BA_war_escalation_4_tt:0 "Nivel 4\n §YMetropoli§!: Manifestaciones anticoloniales\n §YArgelia§!: Sumisión de todas las provincias §R-15%§!"
