 #정당 (나는 .yml 비정규화를 지지해요)
 FRA_CGT: "Confederación General del Trabajo"
 FRA_CGT_long: "Confederación General del Trabajo\n§gLa Confederación General del Trabajo se convirtió, tras el exilio, en un punto de convergencia transitorio para la aglutinación de las fuerzas de izquierda durante la reconfiguración del panorama político francés. Esto se debió a que el Partido Comunista Francés centró sus esfuerzos en la resistencia en la metrópoli, por lo que evitó—de forma tácita—criticar con demasiada dureza a la administración colonial del gobierno en el exilio, lo que terminó creando un entorno de lucha centrado en los sindicatos más que en los partidos. Sus filas son heterogéneas: desde argelinos musulmanes que buscan una independencia radical, hasta franceses que solo exigen igualdad de trato con la metrópoli, pasando por quienes se enfocan exclusivamente en el movimiento obrero.§!"
 FRA_PPNA: "PPNA/SA-CGT"
 FRA_PPNA_long: "Partido del Pueblo Norteafricano/CGT-Sección Argelia\n§gEl Partido del Pueblo Norteafricano (PPNA) es una organización partidaria heredera de la “Estrella de África del Norte” y el grupo antiimperialista de izquierda más influyente de la región. Ha ganado popularidad entre quienes se indignaron al ver que el Partido Comunista Francés, bajo el paraguas de un frente nacional, cerraba los ojos y toleraba el giro derechista del gobierno en el exilio; y también entre los pobres y las clases bajas, la clase media musulmana y los intelectuales, la juventud y los socialistas. En especial, el PPNA se alió con la CGT para asegurarse una capacidad organizativa enorme: esto atenúa su estrechez ideológica y, al mismo tiempo, fija con nitidez un objetivo único para sus simpatizantes: la lucha laboral antiimperialista y antiexplotación.§!"
 FRA_neutrality_party_mil_gov: "Gabinete de guerra"
 FRA_neutrality_party_mil_gov_long: "Gabinete de guerra\n§gPese a la Tercera República, el alto mando francés conserva un tinte marcadamente conservador y, más aún, parte de su cúpula llega a ser reaccionaria. El ejército no confía en los gobiernos electos, y el fracaso en la metrópoli les dio un pretexto para subvertir el principio de control civil. Bajo la dirección de un líder único seleccionado por las fuerzas armadas, el Gabinete de guerra se organiza de arriba hacia abajo, conformando una estructura política vertical y jerárquica.§!"
 FRA_democratic_party_mil_gov: "Frente Popular"
 FRA_democratic_party_mil_gov_long: "Frente Popular Francés\n§gLa alianza partidaria de centro a izquierda amplia—compuesta por el Partido Comunista, la Sección Francesa de la Internacional Obrera y el Partido Radical, entre otros—se organizó tras el exilio para oponerse al golpe militar del gabinete de guerra. Más que cualquier otro bloque, se ha cohesionando para poner en práctica el antifascismo y la lucha contra la dictadura; y, en el caso de algunos sectores radicalizados, están dispuestos incluso a ejercer el derecho de resistencia por la vía de la violencia.§!"
 FRA_PCF: "Partido Comunista Francés"
 FRA_PCF_long: "Partido Comunista Francés\n§gTras declarar una ruptura total con el Partido del Pueblo Norteafricano, el Partido Comunista Francés se convirtió en la principal alternativa durante las primeras elecciones celebradas en toda África del Norte, llenando el vacío dejado por el PPNA—prohibido de participar. Presentándose como un partido que acepta las demandas revolucionarias de los argelinos y que, a la vez, sabe negociar con flexibilidad compromisos con antiguos burócratas del régimen militar francés, el PCF criticó día tras día el “extremismo” del PPNA y adoptó como línea oficial la creación de un “único Estado federal socialista francés”. Así, atrajo a quienes estaban agotados por la vía revolucionaria del PPNA, toleró de facto a antiguos funcionarios y consolidó firmemente su posición.§!"
 FRA_democratic_party_nextgov: "Frente Popular"
 FRA_democratic_party_nextgov_long: "Frente Popular Francés\n§gLa alianza de partidos de centro a izquierda amplia—incluidos el Partido Comunista, la Sección Francesa de la Internacional Obrera y el Partido Radical—ha sido, desde el exilio, la fuerza de contrapeso más grande frente al gabinete militar de guerra. Con Francia al borde de desintegrarse por completo y el país virando hacia la derecha, el Frente Popular terminó transformándose, en la práctica, casi en un solo partido. Aunque siempre trazó una línea clara frente a la ruta radical del PPNA y priorizó el compromiso y la contención, hoy por fin han obtenido el poder en África, tal como deseaban.§!"
 FRA_PSF: "Partido Social Francés"
 FRA_PSF_long: "Partido Social Francés\n§gEl “Comité Secreto de Acción Revolucionaria”, originalmente conocido como las “Cruz de Fuego”, a diferencia de otras organizaciones fascistas, logró organizar un proyecto político significativo no solo en la metrópoli sino también dentro de Argelia. Basados en principios católicos y anticomunistas, constituyen el núcleo del sistema colonial francés.§!"


