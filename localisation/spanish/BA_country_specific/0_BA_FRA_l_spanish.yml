 FRA_inner_circle.01.d: "[BA_GetAscendingAdvisorName] no está capacitado para liderar Francia."

 FRA_inner_circle_petain.3.t: "El liderazgo de Philippe Pétain"
 FRA_inner_circle_petain.3.d: "El sol de Argel era abrasador, pero en el despacho del mariscal Philippe Pétain solo flotaba un silencio frío. Lo que se veía tras la ventana no era el oleaje del Sena, sino las ásperas aguas del Mediterráneo; y lo que lo rodeaba no era el glamur de los salones parisinos, sino oficiales exiliados empapados de derrota. “El fracaso en la metrópoli”. Aquellas palabras, dolorosas como hueso, aplastaban el pecho del viejo mariscal.\n\n\"La República ha muerto. No… se suicidó.\"\n\nPétain bajó la mirada hacia el informe sobre su escritorio. Las discusiones interminables del Parlamento, la corrupción de los políticos y un ejército que se derrumbó impotente ante el monstruo de otro mundo llamado “Millennium”. “Libertad, igualdad, fraternidad”, el grito de la Tercera República, terminó por traer solo desorden, libertinaje y derrota. Ahora comprendía el peso de la cruz que debía cargar.\n\nNo bastaba con recuperar la tierra. Francia tenía que renacer. Había que apartar la ilusión de una democracia podrida y, mediante disciplina, orden y sacrificio, purificar el alma de la nación. Sería un proceso doloroso, pero inevitable. Con mano temblorosa tomó la pluma estilográfica.\n\n\"‘Trabajo, Familia, Patria (Travail, Famille, Patrie)’. Esa será nuestra nueva bandera.\"\n\nEl documento que firmó no era una simple orden administrativa. Era una ruptura con el pasado y la señal que anunciaba el inicio de una gran operación llamada “Revolución Nacional (Révolution nationale)”. El viejo león, una vez más, tomó una decisión solitaria para salvar a la patria."
 FRA_inner_circle_petain.3.a: "Francia renacerá."

 FRA_inner_circle_maurice_gamelin.5.t: "El guardián de la República"
 FRA_inner_circle_maurice_gamelin.5.desc: "En el despacho de Argel flotaba un silencio pesado. En el lugar donde había caído el gigantesco ídolo llamado Philippe Pétain, solo quedaban esparcidos los residuos de su autoritarismo y los fragmentos de una república hecha pedazos. Maurice Gamelin, contemplando las aguas del Mediterráneo más allá de la ventana, cayó en una honda cavilación. El ejército estaba inquieto y, por todas las colonias, corrían al mismo tiempo voces que exigían restaurar la democracia y un silencio que ansiaba un liderazgo fuerte.\n\nSe lo repitió a sí mismo: ¿qué forma debía tomar la república que volvía a moverse? Los viejos políticos y parlamentaristas, con Laval a la cabeza, exigían convocar de inmediato al Parlamento y restaurar sin demora la continuidad legal de la Tercera República. Era el camino más seguro para recuperar legitimidad y apoyo popular, pero también conllevaba el riesgo de traer de vuelta las mezquinas luchas partidistas y la ineficiencia del pasado. Esto era una guerra. El enemigo era poderoso y nosotros, demasiado débiles.\n\nPor otro lado, los oficiales de Estado Mayor insistían en que, hasta que la guerra terminara, debía mantenerse un férreo control militar. La lógica era que, hasta el día de la victoria, el ejército debía actuar como “tutor” y “amparar” a la república mediante una “tutela” (훈정). Era eficiente… y tentador, pero el miedo a caer en una senda indistinguible de la dictadura de Pétain —a quien tanto despreciaba— lo hizo vacilar.\n\nLa mano de Gamelin se tensó sobre la pluma. Su elección definiría el carácter del gobierno en el exilio… no, el futuro mismo de Francia. Debía decidir no como el honor de un viejo soldado, sino como un auténtico guardián de la República."
 FRA_inner_circle_maurice_gamelin.5.a: "Restaurar el Parlamento para asegurar legitimidad democrática."
 FRA_inner_circle_maurice_gamelin.5.b: "Hasta la victoria, el ejército ampara a la República."

