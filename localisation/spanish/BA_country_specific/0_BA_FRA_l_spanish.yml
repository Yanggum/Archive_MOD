# 필리프 페탱
 FRA_petain_focus_0: "'El León de Verdún'"
 FRA_petain_focus_1: "Revolución Nacional\n (Révolution nationale)"
 FRA_petain_focus_2: "Trabajo (Travail)"
 FRA_petain_focus_3: "Familia (Famille)"
 FRA_petain_focus_4: "Patria (Patrie)"
 FRA_petain_focus_0_desc: "En 1916, en las trincheras de Verdún, juramos que \"¡no pasarán!\" y, al final, vencimos. Hoy, aunque nos hayan empujado más allá del mar, las condecoraciones del mariscal siguen brillando. Un pueblo empapado en la derrota necesita un punto de unión. El mariscal Philippe Pétain, una vez más, se ofrecerá a sí mismo a Francia para salvar la patria."
 FRA_petain_focus_1_desc: "La caída de la Tercera República no fue solo un fracaso militar. Fue el resultado inevitable de una política parlamentaria corrupta, un liberalismo decadente y una relajación moral extendida por toda la sociedad. Para recuperar la patria, primero debemos purificarnos por dentro. Lavar la inmundicia del pasado y reconstruir el alma de Francia: eso es la \"Revolución Nacional\"."
 FRA_petain_focus_2_desc: "La codicia del capitalismo y la agitación del socialismo han profanado el valor sagrado del trabajo. Rechazamos la fantasía destructiva de la lucha de clases. Todo francés debe sudar con diligencia desde su lugar, y el Estado guiará ese trabajo para que contribuya correctamente a la gran tarea de reconstruir la patria."
 FRA_petain_focus_3_desc: "La licencia del individualismo ha derrumbado la unidad más básica de Francia: la familia. Un Estado fuerte nace de familias fuertes. Debemos restaurar el orden patriarcal tradicional y fomentar la natalidad y la crianza para rediseñar el futuro de una Francia que sufre escasez de población. La familia será la cuna de la Revolución Nacional."
 FRA_petain_focus_4_desc: "Nuestra lealtad no debe dirigirse a ninguna facción o ideología, sino solo a la entidad eterna llamada \"Francia\". Debemos reunir los corazones dispersos, abandonar el egoísmo y avivar el patriotismo que se sacrifica por el conjunto. Solo nuestra patria —probada por la tierra, la sangre y la historia— es nuestra única fe."

