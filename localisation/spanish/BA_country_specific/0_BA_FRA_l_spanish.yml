 FRA_exile_navy: "Armada Nacional Francesa"
 FRA_exile_navy_desc: "La armada francesa ha quedado dañada y abandonada durante largo tiempo por la sobrecarga excesiva de carga en el exilio, el uso forzado de los buques exiliados y la ausencia de infraestructura de mantenimiento y reparación. Si no resolvemos estos problemas con rapidez, pequeños daños en los buques podrían convertirse en problemas mayores."
