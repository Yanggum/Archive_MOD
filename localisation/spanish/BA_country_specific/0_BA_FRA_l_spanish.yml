 FRA_ALG_aftermath:0 "Secuelas de la abolición del Código Indígena"
 FRA_ALG_aftermath_desc:0 "El Código Indígena, establecido durante mucho tiempo para asimilar y explotar a los argelinos, ha sido abolido, y se les ha otorgado ciudadanía francesa de forma general. Sin embargo, las fuerzas nacionalistas, los musulmanes radicales de Argelia y los partidarios acérrimos del independentismo están lanzando duras críticas contra esta decisión. Además, al ser incorporados de golpe a la administración central francesa, se están consumiendo diversos costos sociales."
 ALG_constantine_agreement:0 "Acuerdo de Constantina"
 ALG_constantine_agreement_desc:0 "El acuerdo alcanzado en Constantina es un pacto por el cual, a cambio de permitir la independencia de Argelia, Francia conservará diversos intereses en Argelia. Aunque Argelia sigue subordinada a Francia, dentro de diez años podrán independizarse plenamente."
