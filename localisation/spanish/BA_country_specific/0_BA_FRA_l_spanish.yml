 FRA_indochina_issue:0 "Indochina francesa"
 FRA_indochina_issue_desc:0 "La Indochina francesa está demasiado alejada del gobierno en el exilio, lo que dificulta que la metrópoli intervenga en los asuntos internos y externos del gobierno general. Aun así, podremos obtener beneficios adecuados a través de Indochina."
 FRA_VIN_anti_resist_action:0 "Solo puede tomarse una medida a la vez."
 FRA_indochina_going_bad:0 "Se intensifica la resistencia colonial"
