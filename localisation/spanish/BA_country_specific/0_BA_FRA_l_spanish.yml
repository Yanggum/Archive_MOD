 FRA_free_france_event.1.t: "Parálisis de la capacidad administrativa"
 FRA_free_france_event.1.d: "Tras el colapso del gobierno francés en el exilio africano por el levantamiento masivo de los africanos, reunimos un ejército con oficiales que escaparon en medio del caos. Sin embargo, nuestro gobierno no tiene capacidad para controlar ni siquiera las profundidades del desierto, y no nos queda más remedio que observar cómo los africanos del desierto declaran su independencia."
 FRA_free_france_event.1.a: "Lo recuperaremos más tarde."

 FRA_free_france_event.2.t: "Declaración de independencia de Malí"
 FRA_free_france_event.2.d: "Mientras caíamos en el caos, organizaciones independentistas de África Occidental —enardecidas al ver el levantamiento masivo del norte de África— comenzaron a actuar.\n\nLos que se autodenominan el Ejército de Independencia de Malí han proclamado contra nosotros una declaración de independencia."
 FRA_free_france_event.2.a: "No podemos permitirlo."
 FRA_free_france_event.2.b: "No hay otra opción."

 FRA_free_france_event.3.t: "Declaración de independencia de Mauritania"
 FRA_free_france_event.3.d: "Mientras caíamos en el caos, organizaciones independentistas de África Occidental —enardecidas al ver el levantamiento masivo del norte de África— comenzaron a actuar.\n\nLos que se autodenominan el Ejército de Independencia de Mauritania han proclamado contra nosotros una declaración de independencia."
 FRA_free_france_event.3.a: "No podemos permitirlo."
 FRA_free_france_event.3.b: "No hay otra opción."

 FRA_free_france_event.4.t: "Independencia de África Occidental"
 FRA_free_france_event.4.d: "Enardecidas por las declaraciones de independencia de Malí y Mauritania, pequeñas organizaciones independentistas de África Occidental también anunciaron sus propias declaraciones y enviaron a nuestro gobierno una notificación unilateral."
 FRA_free_france_event.4.a: "Aplasten la rebelión."
 FRA_free_france_event.4.b: "Aquí no se puede."
 FRA_free_france_event.4.c: "...Reconózcanlo."

