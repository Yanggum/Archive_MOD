 FRA_country_intro_header: "§4Una nación de cultura esplendorosa e indomable§!"
 FRA_country_intro_content: " Francia, desde la Revolución francesa, pasando por la Revolución de Julio, la Revolución de Febrero y la Tercera República, ha forjado una larga historia de resistencia y de libertad, igualdad y fraternidad. Este trasfondo histórico es un gran orgullo para los franceses, pero también ha hecho que políticamente les resulte difícil escapar del caos.\n\n Ese orgullo alcanzó su cénit cuando, en la Gran Guerra, derrotaron al Imperio Alemán y se alzaron con la victoria. Tras aquella victoria honorífica, la sociedad francesa, sobreponiéndose a sus heridas, volvió a desarrollarse. Reconstruyó el devastado noreste y asumió un papel central en el orden mundial.\n\n Sin embargo, tras la Gran Depresión originada en Estados Unidos, Francia se vio sumida en un enorme estancamiento. Francia se fue alejando cada vez más de todo tipo de calificativos positivos —esplendor, deslumbramiento, belleza— y esa imagen social convulsa se reflejó tal cual en la política, propiciando el crecimiento del socialismo, el fascismo y los monárquicos. Esta decadencia trajo a los franceses una profunda sensación de frustración. Pero esa frustración no los hizo rendirse. Bajo una era oscura, quienes poseen una voluntad indomable conservan la fuerza y la determinación para superarla.\n\n Al llegar 1935, Francia tuvo que librar una guerra contra seres que jamás había encontrado en su historia. Frente a los entes de otro mundo llamados Kivotos, el ejército, el gobierno y el pueblo francés lucharon con todas sus fuerzas. Pero Francia quedó muy por detrás de su tecnología y poder de combate; y, conforme la situación política caótica y la lucha por el poder aflojaron su defensa, toda Francia cayó en manos de Kivotos, desencadenando una gran crisis: el gobierno y altos mandos militares tuvieron que exiliarse al norte de África.\n\n Pero los franceses no se sometieron. En toda la metrópoli se organizó la Résistance, que continúa resistiendo a los seres de otro mundo; y el gobierno francés exiliado en el norte de África, aunque debilitado, sigue buscando formas de recuperar la metrópoli. El gobierno en el exilio tiene la firme voluntad de luchar hasta el final, vencer y liberar al pueblo de las fuerzas de otro mundo, devolviendo a muchos a sus hogares. Lo único que necesitan es fortalecer la capacidad del propio gobierno exiliado.\n\n El gobierno, gravemente dividido tras el exilio, está nublando nuestro propósito. Aun así, Francia jamás se rendirá.\n\n§YDesarrollo: AfterImage, SKSKIe"
 FRA_guide:0 "El liderazgo de [FRA_philippe_petain.getname]\n\n£white_dot Estabiliza África.\n£white_dot Amplía la capacidad nacional mediante una industrialización rápida.\n£white_dot Recupera la patria que te arrebataron.\n£white_dot Restaura el espíritu de Francia, arrebatándoselo a las fuerzas democráticas incompetentes y corruptas."
