 FRA_inner_circle.01.t: "El ascenso de [BA_GetAscendingAdvisorName]"
 FRA_inner_circle.01.desc: "[BA_GetAscendingAdvisorName] ha demostrado una ambición formidable y ha ejercido influencia dentro del partido. Sin embargo, su esfuerzo por reclamar un mayor control chocó con la oposición de otros miembros y derivó en una lucha de poder. La cuestión es si [BA_GetAscendingAdvisorName] ha logrado impresionar lo suficiente a [ROOT.GetLeader] como para asegurarse un puesto en el círculo más cercano."
