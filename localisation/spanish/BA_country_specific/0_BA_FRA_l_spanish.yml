 FRA_urbanization: "Situación de las colonias"
 FRA_urbanization_desc: "Ahora que la metrópoli ha sido arrebatada por los isekai, las colonias de Francia cumplen un papel más importante que nunca. Debemos estabilizar y desarrollar nuestros territorios coloniales para construir la capacidad de regresar a la metrópoli. Los colonizados seguirán gustosamente nuestra guía, movidos por el respeto hacia la patria, Francia, que los conducirá a la civilización."
