 FRA_prepare_war:0 "Resistencia"
 FRA_prepare_war_desc:0 " La palabra francesa que significa resistencia — 'Résistance'— es un concepto que engloba al movimiento de masas nacionalista francés y a las organizaciones de resistencia que se oponen al dominio de Millennium.\n\n La Resistencia opera en seis regiones divididas y, en cada una, mantiene la lucha armada contra las fuerzas de seguridad de Millennium. Pueden ser barridos o contenidos temporalmente, pero el apoyo y respaldo masivo del pueblo francés restaura con rapidez su capacidad organizativa, por lo que Millennium no puede eliminarlos por completo salvo que recurra a medidas decisivas.\n\n Por otra parte, la Resistencia infiltrada en cada región provoca todo tipo de sabotajes contra Millennium y también apoya a su patria exiliada. Además, si parte de ellos es aniquilada y juzgan que ya no pueden sostener la resistencia en la metrópoli, podrán emprender un éxodo masivo hacia el Norte de África, tal como lo hizo su propio país.\n"

