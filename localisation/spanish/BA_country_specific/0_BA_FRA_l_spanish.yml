 FRA_focus_10.5_desc:0 "Mediante una reforma monetaria, nos adaptaremos por completo a la economía africana."
 FRA_focus_10.7:0 "Vías que cruzan el Sáhara"
 FRA_focus_10.7_desc:0 "Debido a la enorme barrera del desierto del Sáhara, las regiones del interior de África Occidental tienen dificultades para abastecerse. El Ferrocarril del Sáhara lo resolverá por completo y acelerará el desarrollo del interior."
 FRA_focus_10.6:0 "Construcción de presas"
 FRA_focus_10.6_desc:0 "En el interior de Argelia se forman altiplanos. Construiremos presas para desarrollar esas regiones y aprovechar activamente los recursos hídricos."
 FRA_focus_8: "Red de inteligencia integral"
 FRA_focus_8_desc: "La guerra de información es el núcleo de la guerra moderna. Debemos vincular orgánicamente la información de la metrópoli y utilizarla en operaciones militares."
 FRA_focus_11:0 "Economía controlada"
 FRA_focus_11_desc:0 "El mito del crecimiento de mercado solo funciona en tiempos normales. El Estado debe intervenir y coordinar directamente todos los aspectos de la industria para que la economía se mantenga en su mejor estado."
 FRA_focus_12: "Reconstrucción del Ministerio de Colonias" 
 FRA_focus_12_desc: "Debemos reconstruir el Ministerio de Colonias (Ministère des Colonies), que supervisa la administración colonial, para maximizar la eficiencia de la gestión colonial."
 FRA_focus_13: "Caucho ecuatorial"
 FRA_focus_13_desc: "Podemos asegurar caucho, un recurso estratégico, en el ecuador."
 FRA_focus_15:0 "Retirada de Indochina"
 FRA_focus_15_desc: "Se vuelve evidente que ya no podemos mantener Indochina. Abandonaremos la colonia mediante una retirada ordenada, preservando al máximo nuestros intereses."

 FRA_industry_focus_0: "Roturación de tierras agrícolas"
 FRA_industry_focus_0_desc: "Con el avance de la urbanización, la producción agrícola se ve bajo presión. Para evitar una hambruna durante la industrialización, debemos roturar un páramo tan vasto como el sur de Francia."
 FRA_industry_focus_1: "Subsidios a empresas mineras"
 FRA_industry_focus_1_desc: "Los minerales son divisas. ¡La minería es la fuente de la riqueza nacional!"
 

 FRA_Deuxieme_Bureau: "2.º Estado Mayor"
 FRA_Deuxieme_Bureau_tt: "Si existe una §Yagencia de inteligencia§!, §Gmejora§! la §Yagencia de inteligencia§!."

 FRA_focus_arm_1: "Preparativos para la guerra"
 FRA_focus_arm_1_desc: "En esta sofocante África, ahora debemos prepararnos para luchar."
 FRA_focus_arm_2: "Desembarco a gran escala"
 FRA_focus_arm_2_desc: "Debemos desplegar de una sola vez grandes fuerzas de desembarco en el mayor punto de apoyo. Mediante investigación de lanchas de desembarco y entrenamientos de simulación, formaremos unidades de infantería expertas en operaciones anfibias."
 FRA_focus_new_arm_1: "Doctrina de empleo de infantería"
 FRA_focus_new_arm_1_desc: "En un contexto donde se proponen nuevas perspectivas sobre el sistema militar, lamentablemente carecemos de la capacidad para intentos innovadores. En su lugar, obtendremos una ventaja serena frente al enemigo mediante poderosas tácticas de empleo de infantería."
 FRA_focus_new_arm_2: "Formación dispersa"
 FRA_focus_new_arm_2_desc: "Dispersaremos las unidades de infantería para combatir con flexibilidad en un área amplia."
 FRA_focus_new_arm_3: "Despliegue de cortina de fuego"
 FRA_focus_new_arm_3_desc: "Concentraremos la infantería para enfocar la potencia de fuego."
 FRA_focus_arm_13: "Tropas de asalto"
 FRA_focus_arm_13_desc: "Organizaremos fuerzas de asalto de élite y completaremos el núcleo de la doctrina centrada en la infantería."
 FRA_focus_new_arm_8: "'Élan Vital'"
 FRA_focus_new_arm_8_desc: "'Élan Vital' es una gloriosa tradición heredada desde hace mucho tiempo del Gran Ejército francés. Debemos lanzarnos a la ofensiva con un espíritu inquebrantable y, al final, colapsar por completo la línea enemiga mediante una carga a la bayoneta." #여기까지 보병
 FRA_focus_arm_3: "Ruptura en un punto único"
 FRA_focus_arm_3_desc: "Sin conocer la potencia de fuego del enemigo, empujar infantería a ciegas es prácticamente un suicidio. Es crucial concentrar primero una potencia de fuego abrumadora en un solo punto para romper su línea y desembarcar a nuestras tropas con seguridad."
 FRA_focus_new_arm_5: "Doctrina de apoyo de fuego"
 FRA_focus_new_arm_5_desc: "Desarrollaremos una doctrina de apoyo de fuego para respaldar a la infantería."
 FRA_focus_arm_5: "Apoyo terrestre"
 FRA_focus_arm_5_desc: ""
 FRA_focus_new_arm_6: "Fuego naval"
 FRA_focus_new_arm_6_desc: "Con fuego de apoyo de la artillería naval, concentraremos la potencia de fuego en las operaciones de desembarco para apoyar el avance de la infantería."
 FRA_focus_new_arm_9: "Voluntad de una potencia de fuego abrumadora"
 FRA_focus_new_arm_9_tt: "\nGanar puntos de innovación:\n§YCombate terrestre§!: §R-2§!" #여기까지 포병
 FRA_focus_arm_15: "La nueva ciencia militar francesa"
 FRA_focus_arm_15_desc: "Debemos analizar por qué perdimos la guerra pasada y establecer una nueva ciencia militar. Con ello, conquistaremos la victoria en la operación para recuperar la metrópoli."
 FRA_focus_new_arm_12: "Defensa del punto de apoyo tras el desembarco"
 FRA_focus_new_arm_12_desc: "Tras el desembarco, debemos defender en el frente para detener los contraataques enemigos."
 FRA_focus_new_arm_13: "Provocar una guerra de desgaste"
 FRA_focus_new_arm_13_desc: "La defensa es asimétricamente más ventajosa que el ataque. Debemos cortar las líneas de suministro enemigas y desgastar de forma constante su mano de obra y sus recursos."
 FRA_focus_new_arm_14: "Ofensiva bien planificada"
 FRA_focus_new_arm_14_desc: "Debemos golpear el punto ciego del enemigo con una ofensiva cuidadosamente planificada y colapsar su línea." #여기까지 진지전
 FRA_focus_arm_3.5: "Empleo de carros de caballería"
 FRA_focus_arm_3.5_desc: "[FRA_charles_de_gaulle.getname] y sus partidarios mencionan con especial énfasis la histórica victoria del 'Sitio de Eridu' en las afueras de París, en medio de la última derrota. En aquel entonces, [FRA_charles_de_gaulle.getname] utilizó divisiones blindadas basadas en la doctrina de guerra móvil para destruir por completo el segundo punto de apoyo del enemigo, una victoria crucial que permitió al gobierno resistir un mes más. Por estas razones, desean formar fuerzas móviles y llevar a cabo una guerra de maniobra en la operación de recuperación de la metrópoli."
 FRA_armor_factory: "Expansión de instalaciones de producción"
 FRA_armor_factory_desc: "Operar divisiones blindadas requiere instalaciones de producción a gran escala. Ampliaremos la capacidad de las fábricas de tanques para aumentar la producción de equipo blindado."
 FRA_focus_new_arm_7: "Batalla decisiva blindada"
 FRA_focus_new_arm_7_desc: "Debemos romper el frente mediante una guerra de maniobra con carros de caballería y librar una gran batalla decisiva contra las fuerzas principales del enemigo." #여기까지 기병전차
 FRA_focus_arm_4: "Ejército Norteafricano"
 FRA_focus_arm_4_desc: "Debemos fusionar y reorganizar las unidades militares que servían en la metrópoli con las unidades que sirven en África, así como con las unidades de origen africano. El nuevo 'Ejército Norteafricano' será el ejército regular del gobierno en el exilio y encabezará la vanguardia de la recuperación de la metrópoli."
 FRA_focus_arm_14: "Expandir la Legión Extranjera"
 FRA_focus_arm_14_desc: "Aunque no vivan en la metrópoli, los nativos de África Occidental son franceses como nosotros. Ampliaremos la Legión Extranjera para que muchos nativos puedan servir en ella por Francia."
 FRA_focus_new_arm_4: "Guerreros musulmanes"
 FRA_focus_new_arm_4_desc: "Debemos volver a atraer a Francia a excelentes grupos guerreros del Norte de África como los Tirailleurs, los Goumiers marroquíes, los Spahis y los Chasseurs africanos, y formarlos."
 FRA_focus_new_arm_4_tt: "\nEn §YNorte de África§!, las §Ydivisiones musulmanas§! se §Gunirán§! a Francia.\n\n"
 FRA_focus_new_arm_10: "Aprovechar equipo capturado"
 FRA_focus_new_arm_10_desc: "Para operar infantería a gran escala, asegurar equipo es un asunto crítico. Capturaremos equipo de infantería del enemigo para garantizar la sostenibilidad del sistema logístico."
 FRA_focus_new_arm_10_tt: "Durante §4Decisión final para recuperar la metrópoli§!, §Gdisponible§!:\n"
 FRA_focus_new_arm_11: "La gloria del Gran Ejército"
 FRA_focus_new_arm_11_desc: "Reviviendo la gloriosa tradición del Gran Ejército francés, elevaremos la moral del Ejército Norteafricano y mejoraremos su poder de combate." #여기까지 외인부대
 FRA_focus_new_arm_0: "Instituto Superior de Investigación de Defensa"
 FRA_focus_new_arm_0_desc: "Las teorías sobre la guerra moderna y la estrategia y táctica cambian constantemente. Crearemos un departamento para responder a estos cambios." 
 FRA_colonial_munitions_industry: "Poner en marcha arsenales coloniales"
 FRA_colonial_munitions_industry_desc: "Pondremos en marcha arsenales en el Norte de África para apoyar la producción de material bélico para la recuperación de la metrópoli."
 FRA_focus_arm_6: "Tecnología de respuesta contra Halo"
 FRA_focus_arm_6_desc: "Para derrotar a aquellos con Halo que no caen ante balas de fusil, se requiere una potencia de fuego más fuerte. Quizá los cañones antitanque sean la respuesta." 
 FRA_vertical_integration: "Fusión de pequeñas y medianas industrias"
 FRA_vertical_integration_tt: "Estados de §YNorte de África§! con al menos §Y2§! §Yfábricas civiles§!:"
 FRA_focus_arm_11: "Tácticas motorizadas"
 FRA_focus_arm_11_desc: "En la situación actual, producir tanques con blindaje presenta demasiadas dificultades. Es hora de introducir tecnología y diseñar vehículos rápidos y relativamente baratos." #여기까지 고등 국방 연구원
 FRA_focus_arm_8: "Reunificar la armada"
 FRA_focus_arm_8_desc: "Tenemos decenas de buques de guerra que se usaron para evacuar la metrópoli. Debemos organizar de forma sistemática los barcos que quedan para prepararnos para el futuro." 
 FRA_focus_arm_9: "Fundar la Infantería de Marina"
 FRA_focus_arm_9_desc: "Debemos fundar una infantería de marina que coopere estrechamente con la armada para maximizar las probabilidades de éxito en operaciones anfibias."
 FRA_focus_new_arm_15: "Desarrollar tanques anfibios" 
 FRA_focus_new_arm_15_desc: "Un poderoso batallón de tanques anfibios aplastará a los enemigos en el punto de desembarco y romperá el frente a gran velocidad. Los desarrollaremos y los desplegaremos en la infantería de marina."
 FRA_focus_arm_10: "Construcción de astilleros"
 FRA_focus_arm_10_desc: "La industria naval del Norte de África no basta para mantener nuestra flota. Debemos construir astilleros para asegurar la sostenibilidad del poder naval."
 FRA_focus_arm_12.5: "Concentrarse en reconstruir la flota"
 FRA_focus_arm_12.5_desc: "Donde perdimos fue en tierra, no en el mar. De hecho, el mar puede considerarse un lugar de victoria para nosotros, porque conservamos prácticamente todos los buques que teníamos al exiliarnos. Nos centraremos en reconstruir el poder naval y consolidar nuestra superioridad en el mar."
 FRA_naval_arms_race: "Competencia naval"
 FRA_naval_arms_race_desc: "Los oficiales de la marina francesa están extremadamente inquietos ante la posibilidad de que la marina de [MIL.getadjective] termine superando nuestro poder naval. Entraremos en una carrera de construcción naval para reforzarlo."
 FRA_make_auxiliary: "Construcción de buques auxiliares"
 FRA_make_auxiliary_desc: "Nos centraremos en construir buques auxiliares para formar una fuerza naval adecuada."
 FRA_focus_arm_12: "Venta de buques capitales"
 FRA_focus_arm_12_desc: "Ahora mismo, la marina francesa está saturada hasta el punto de que el mantenimiento en el Norte de África resulta abrumador. Debemos vender parte de los buques capitales y reorganizar la flota de forma manejable."
 FRA_make_submarine: "Prioridad a submarinos"
 FRA_make_submarine_desc: "Los submarinos son el medio más eficaz para cortar las rutas de suministro marítimo del enemigo. Nos centraremos en construir submarinos para mejorar nuestra capacidad de interdicción marítima."
 FRA_naval_commander: "Mando de Operaciones Navales"
 FRA_naval_commander_desc: "Debemos establecer un Mando de Operaciones Navales para aumentar la eficiencia de las operaciones navales."
 FRA_control_mediterrian: "Control del Mediterráneo occidental"
 FRA_control_mediterrian_desc: "Como nuestra fuerza naval es lo suficientemente superior a la del enemigo, la marina francesa ha podido controlar todo el Mediterráneo y ejecutar operaciones con mayor facilidad."
 FRA_control_mediterrian_tt_1: "Al completar el enfoque §Y$FRA_focus_arm_12.5$§!:\n  "
 FRA_control_mediterrian_tt_2: "Al completar el enfoque §Y$FRA_focus_arm_12$§!:\n  " #여기까지 해군
 FRA_focus_arm_7: "Preparativos para la guerra aérea en la metrópoli"
 FRA_focus_arm_7_desc: "Nuestra fuerza aérea fue impotente frente a los poderosos cazas a reacción de [MIL.getadjective]. Debemos prepararnos para la guerra aérea en la metrópoli y formar una fuerza aérea capaz de enfrentarse a los jets."
 FRA_focus_arm_9.5: "Desarrollar cazas"
 FRA_focus_arm_9.5_desc: "Los cazas son el factor más importante para conquistar la superioridad aérea. Nos centraremos en el desarrollo de cazas."
 FRA_focus_arm_8.5: "Desarrollar apoyo aéreo cercano"
 FRA_focus_arm_8.5_desc: "Necesitamos aeronaves para apoyar la ofensiva del ejército."
 FRA_focus_new_arm_16: "Construir instalaciones de fabricación de aeronaves"
 FRA_focus_new_arm_16_desc: "Construiremos instalaciones de fabricación de aeronaves para sentar la base del fortalecimiento de la fuerza aérea."
 FRA_paratroopers: "Formar tropas aerotransportadas"
 FRA_paratroopers_desc: "Formaremos tropas aerotransportadas para asegurar la capacidad de perturbar la retaguardia enemiga y ejecutar golpes sorpresivos."
 FRA_stop_air: "Abandonar la guerra aérea"
 FRA_stop_air_desc: "En una situación que obliga a elegir y concentrar recursos, no tenemos margen para sostener la fuerza aérea. Renunciaremos a la victoria en el aire y, en su lugar, nos centraremos en apoyar a las fuerzas terrestres."
 FRA_defense_air: "Defensa antiaérea"
 FRA_defense_air_desc: "La capacidad de guerra aérea del enemigo es una amenaza. Nos centraremos en la defensa antiaérea para contenerla."
 FRA_sell_airplane: "Venta de aeronaves"
 FRA_sell_airplane_desc: "Venderemos aeronaves para invertir en otros sectores." #여기까지 공군

 FRA_authenticity_in_the_international_community: "Confirmar la legitimidad ante la comunidad internacional"
 FRA_authenticity_in_the_international_community_desc: "Tras el golpe, nuestro gobierno enfrenta controversias sobre si es un gobierno en el exilio legítimo. Debemos resolver esta tarea."
 FRA_mediterranean_diplomacy: "Diplomacia mediterránea"
 FRA_mediterranean_diplomacy_desc: "Para recuperar la metrópoli, es inevitable desembarcar por el Mediterráneo, y para ello se requiere el control del mar en esa zona. Aunque pueda haber diferencias entre el nivel de nuestras flotas y las del enemigo, podremos superarlas mediante la diplomacia con los países mediterráneos que aún se mantienen en pie."
 FRA_confirm_italian_hegemony: "Reconocer la hegemonía italiana"
 FRA_confirm_italian_hegemony_desc: "Italia, que se convirtió en nuestro aliado tras la firma del Frente de Stresa, reina hoy como el amo del Mediterráneo. Aunque lastime nuestro orgullo, debemos reconocer su hegemonía y mantener relaciones amistosas. Su ayuda es indispensable para asegurar el control del mar."
 FRA_italian_invest: "Inversión de industriales italianos"
 FRA_italian_invest_desc: "Los capitalistas italianos buscan nuevas tierras de oportunidad donde valga la pena invertir, y nosotros necesitamos su inversión industrial. Podremos obtenerla a cambio de influencia sobre Túnez."
 FRA_in_the_same_boat: "En el mismo barco" #제미나이가 영어 표현은 '같은 배를 타다'래요
 FRA_in_the_same_boat_desc: "España y nosotros compartimos el hecho de que los isekai nos arrebataron el territorio. Necesitamos la ayuda de España para recuperar la metrópoli, y España nos necesita para expulsar a los isekai y reunificar el país. España y Francia, en la práctica, no son más que dos países en el mismo barco."
 FRA_barrier_against_kivotos-Bolshevism: "Un muro contra el isekai-bolchevismo"
 FRA_barrier_against_kivotos-Bolshevism_desc: "En la zona de los Pirineos catalanes se han asentado isekai y fuerzas reaccionarias. Si apoyamos a España para derrotarlos, quizá España también aporte fuerzas a nuestra guerra por recuperar la metrópoli."
 FRA_north_africa_road: "Autopista del Norte de África"
 FRA_north_africa_road_desc: "Nuestros territorios coloniales y los de España colindan, lo que facilita el transporte de suministros. Si construimos una autopista en el Norte de África, podremos aumentar aún más el flujo logístico."
 FRA_trade_treaty: "Comercio mediterráneo"
 FRA_trade_treaty_desc: "Nuestro aliado, el Reino Unido, por limitaciones geográficas, tiene dificultades para brindar apoyo económico a tiempo. Podremos resolver este problema fomentando el comercio con los países mediterráneos."
 FRA_mediterranean_economic_bloc: "Espacio económico panmediterráneo"
 FRA_mediterranean_economic_bloc_desc: "A medida que el comercio entre los países que rodean el Mediterráneo se intensifica, debemos unirlos en un solo espacio económico y concentrar todas nuestras capacidades."
 FRA_mediterranean_economic_bloc_tt: "§YPaíses§! que poseen el espíritu nacional §Y$FRA_mediterranean_trade_treaty$§!:"
 FRA_solidarity_between_governments_in_exile: "Solidaridad entre gobiernos en el exilio"
 FRA_solidarity_between_governments_in_exile_desc: "Tras la Gran Transición, los países europeos que, como nosotros, perdieron su metrópoli arden de determinación por recuperarla. Aunque el poder de cada uno sea insignificante por sí solo, la solidaridad entre gobiernos en el exilio puede compensar la diferencia de fuerzas."
 FRA_halifax_conference: "Conferencia de Halifax"
 FRA_halifax_conference_desc: "Nosotros y el Reino Unido fuimos en su día los gobernantes del mundo, pero la Gran Transición nos arrebató ese lugar, entregándolo a naciones de otro mundo. Para recuperar la metrópoli y restaurar el orden mundial, la cooperación con el Reino Unido es indispensable, por lo que hemos solicitado una conferencia con ellos."
 FRA_invest_from_anglo_financier: "Inversión de financieros anglos"
 FRA_invest_from_anglo_financier_desc: "El Reino Unido es hoy la nación financiera más poderosa. Aunque estemos en el exilio, si atraemos inversión de ellos, podremos fortalecernos."
 FRA_italian_joint_struggle_on_kivotos: "Lucha conjunta contra Kivotos"
 FRA_italian_joint_struggle_on_kivotos_desc: "De acuerdo con el propósito original de formar el Frente de Stresa, es imperativa una lucha conjunta contra las fuerzas que usurparon nuestra tierra."
 FRA_befriend_with_belgium: "Cooperación con Bélgica para recuperar la metrópoli"
 FRA_invest_from_belgian_capitalist: "Inversión de ricos capitalistas del Congo"
 FRA_mining_rubber_with_bel: "Extracción cooperativa de caucho ecuatorial"
 FRA_belgian_model: "Modelo belga"
 FRA_claim_hegemony_on_equatorial_africa: "Hegemonía en África Ecuatorial"
 FRA_ouster_the_king: "Derrocar al rey opresor"
 FRA_belgium_provisional_mainland_restoration_government: "Gobierno provisional belga para la restauración de la metrópoli"
 FRA_befriend_with_netherland: "Amistad con el gobierno neerlandés en el exilio"
 FRA_befriend_with_netherland_desc: "El gobierno neerlandés, al igual que nosotros, fue derrotado por el ataque de otro mundo y se encuentra exiliado en las Indias Orientales. Sin embargo, están en apuros por las fuerzas insurgentes de Indonesia. Si, por casualidad, los rebeldes vencen, la descolonización podría convertirse en una tendencia mundial. Ya no podemos permitirnos mirar hacia otro lado."
 FRA_focus_on_colonial_deiplomacy: "Concentrarse en la diplomacia colonial"
 FRA_focus_on_colonial_deiplomacy_desc: "Debemos prestar atención no solo a las colonias de África, sino también a las de Oriente Medio y Asia. Aseguraremos el control francés en Siria e Indochina. "
 FRA_military_minister_to_indochina: "Enviar un gobernador militar a Indochina"
 FRA_french_indochina: "Desarrollar la Indochina francesa"
 FRA_french_indochina_desc: "Indochina es rica en recursos naturales. Debemos desarrollar esta región para elevar nuestra industria."
 FRA_withdraw_from_indochina: "Recuperar la industria de Indochina"
 FRA_withdraw_from_indochina_desc: "No podemos mantener indefinidamente la inestable región de Indochina. Es preferible recuperar parte de la industria principal e invertirla en Argel."
 FRA_withdraw_from_indochina_tt: "De cada país a @FRA§Y[FRA.getadjective]§!:\n"
 FRA_southeast_asia_economic_bloc: "Bloque económico del Sudeste Asiático"
 FRA_southeast_asia_economic_bloc_desc: "El bloque económico, creado bajo el liderazgo de [FRA.getadjective], tiene como objetivo la cooperación económica mutuamente beneficiosa, la transferencia tecnológica y una alianza comercial entre los países miembros. Dentro de esta comunidad económica, Francia solo ostenta el estatus de país observador, pero al controlar Francia el derecho de voto de Vietnam, Laos y Camboya participantes, Francia actúa de facto como presidenta."
 FRA_intervention_to_middle_east: "Intervenir en Oriente Medio"
 FRA_intervention_to_middle_east_desc: "Se están produciendo grandes batallas en la región de Oriente Medio. No podemos evitar intervenir para proteger nuestros intereses."
 FRA_french_syr: "Siria francesa"
 FRA_french_syr_desc: "Debemos restaurar la Siria francesa y volver a establecer nuestra base avanzada en Oriente Medio."

  FRA_focus_resistance_1:0 "Contacto con la metrópoli"
 FRA_focus_resistance_1_desc:0 "Hemos logrado ponernos en contacto con los camaradas de la Resistencia que operan en la metrópoli. Debemos cooperar con ellos para recuperar nuestro hogar."
 FRA_focus_resistance_2:0 "Un enfoque proactivo"
 FRA_focus_resistance_2_desc:0 "En la última guerra, Francia venció con tácticas defensivas desesperadas, pero estos enemigos rompieron nuestra defensa y triunfaron. Ahora nos toca a nosotros, como lo hicieron los enemigos de entonces, esforzarnos activamente por reconquistar la metrópoli."
 FRA_focus_resistance_3:0 "Un enfoque cauteloso"
 FRA_focus_resistance_3_desc:0 "La razón por la que fuimos derrotados en un instante por el enemigo de otro mundo no fue solo la diferencia de poder de combate, sino también que no teníamos información precisa sobre su ejército. Tomemos la derrota pasada como lección, y avancemos con más cautela, observando su estrategia y sus tácticas."
 FRA_focus_resistance_4:0 "Resistencia rural"
 FRA_focus_resistance_4_desc:0 "En las fértiles grandes llanuras del sur de Francia viven campesinos fieles a la fe católica. No están unidos como una sola organización, pero en la lucha contra los isekai mostrarán un frente cohesionado."
 FRA_focus_resistance_5:0 "Hacia un lugar cálido"
 FRA_focus_resistance_5_desc:0 "Todos los preparativos han terminado. El Gran Ejército de Francia, la armada y la fuerza aérea apuntan a los invasores por sus familias. No podemos garantizar la victoria, pero debemos ir. ¡Hacia un lugar cálido!"
 FRA_ita_is_helping_tt:0 "\nComo §Y[ITA.getname]§! ha aceptado nuestra petición, §Yunidades de la Resistencia§! se alzarán en la frontera §YMillennium - [ITA.getname]§!."
 FRA_spr_is_helping_tt:0 "\nComo §Y[SPR.getname]§! ha aceptado nuestra petición, §Yunidades de la Resistencia§! se alzarán en la frontera §YMillennium - [SPR.getname]§!."
 FRA_focus_resistance_7:0 "Propaganda a gran escala"
 FRA_focus_resistance_7_desc:0 "Ya es hora de que todos los ciudadanos que aún quedan en la metrópoli lo sepan. Pegaremos panfletos en las calles y, a través de la radio, haremos conocer nuestra gran determinación."
 FRA_focus_resistance_6:0 "Guerrilla roja"
 FRA_focus_resistance_6_desc:0 "El Partido Comunista Francés posee la mayor organización de resistencia en la metrópoli. Conectan granjas y fábricas, usan las universidades como bases, transportan y mueven prensa clandestina, y llevan a cabo guerra de guerrillas en la zona portuaria del norte y en el cinturón industrial de París."
 FRA_when_uprise: "Al completar el enfoque nacional §Y$FRA_focus_resistance_14$§!:\n"
 FRA_focus_resistance_9:0 "Organizar el Ejército de Liberación de la Resistencia"
 FRA_focus_resistance_9_desc:0 "Con la información obtenida por los resistentes que han regresado a la metrópoli, nos hemos dado cuenta de que Millennium se encuentra ahora en una situación caótica. Aprovechando esta oportunidad, todos los ciudadanos de Francia empuñarán las armas y, sin escatimar sacrificios, expulsarán a los invasores de otro mundo para volver a casa." 
 FRA_focus_resistance_10: "Oficina de enlace"
 FRA_focus_resistance_10_desc: "Si establecemos un sistema de comunicaciones sostenible con la Resistencia, podremos conducir la guerra de forma más eficiente."
 FRA_focus_resistance_8:0 "Huelga general"
 FRA_focus_resistance_8_desc:0 "Entre los camaradas de la metrópoli, existe un pequeño número con el que podemos contactar en secreto dentro de las fábricas. Si, apoyándonos en ellos, llevamos a cabo una huelga general a gran escala, paralizaremos temporalmente la industria del enemigo y ayudaremos al avance de nuestras fuerzas principales."
