 FRA_focus_5:0 "Desarrollar África Occidental"
 FRA_focus_5_desc:0 "La industria va antes que las personas. ¿Acaso no podremos dar bienestar y libertad una vez que nos hayamos desarrollado?"
 FRA_focus_6:0 "Gran molino harinero de Argel"
 FRA_focus_6_desc:0 "La industria alimentaria sostendrá la reproducción de la fuerza laboral a gran escala."
 FRA_focus_6.5:0 "Milicias de derecha"
 FRA_focus_6.5_desc:0 "En el oeste de Francia abundan las organizaciones de resistencia conservadoras, con valores tradicionales firmemente grabados en el corazón. Pueden convertirse en una gran fuerza para nosotros."
 FRA_focus_6.8:0 "Economía clandestina"
 FRA_focus_6.8_desc:0 "A través de la economía clandestina de la metrópoli, podremos obtener los suministros necesarios y provocar un impacto económico adverso en las potencias extranjeras que nos arrebataron nuestro territorio."
 FRA_focus_7:0 "Fomentar la industria civil"
 FRA_focus_7_desc:0 "La base de la industria es la industria civil. Incluso en esta abrasadora tierra africana, debemos fomentar la industria civil para sentar los cimientos de la industrialización."
 FRA_focus_9:0 "Compañía argelina de crédito y finanzas"
 FRA_focus_9_desc:0 "Necesitamos expandir una organización financiera controlable, como institución que facilite a los colonos del Norte de África fondos para la compra de tierras y el desarrollo agrícola."
 FRA_market_ideology: "Libre comercio"
 FRA_market_ideology_desc: "No tenemos fondos para industrializarnos. Debemos abrir todas las puertas y vender nuestros recursos."
 FRA_focus_9.5:0 "Construcción pública"
 FRA_focus_9.5_desc:0 "Para acelerar los planes de industrialización que se suceden año tras año, construiremos complejos de apartamentos a gran escala: baratos, sólidos y capaces de albergar a los trabajadores."
