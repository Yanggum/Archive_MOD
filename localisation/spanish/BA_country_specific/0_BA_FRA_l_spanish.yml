 BA_war_escalation_7_tt:0 "Nivel 7\n §YArgelia§!: Apelación a la comunidad internacional"
 BA_war_escalation_8_tt:0 "Nivel 8\n §YMetropoli§!: Inestabilidad en otras colonias\n §YArgelia§!: Huelga general"
