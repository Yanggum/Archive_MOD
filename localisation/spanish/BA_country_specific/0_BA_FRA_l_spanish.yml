   #저항
 FRA_resistance_of_locals: "Resistencia de los colonizados"
 FRA_rol_modifier: "$FRA_resistance_of_locals$"
 FRA_resistance_of_locals_tt: "$MODIFIER_POLITICAL_POWER_COST$ [?FRA_rol_pp|-=]\n$MODIFIER_STABILITY_FACTOR$: [?FRA_rol_stability|+=%]\n$MODIFIER_COMPLIANCE_GROWTH$: [?FRA_rol_cg|+=%]\n$MODIFIER_RESISTANCE_TARGET$: [?FRA_rol_resist|-=%]"
 FRA_resistance_of_locals_desc: "Desde que los piratas berberiscos de Argel fueron sometidos en 1830, una colonia que abarca tres continentes cimentó la base de la gloriosa Francia de hoy. Sin embargo, la lucha para conquistarla se encuentra en el extremo opuesto de cualquier calificativo como 'noble'. La bandera tricolor del Imperio francés (Empire français) ondeada en las ciudades del continente no echó raíces más que sobre sangre esparcida. El Ministerio de las Colonias (Ministère des Colonies) masacró a los nativos que se rebelaban contra nosotros, rompió sus vínculos y, al dividirlos, construyó un sistema colonial centralizado. Y aun tras más de cien años, África Occidental y las decenas de millones de sometidos que gobernamos siempre intentan escapar de la sombra de los latinos. En Hanói, Brazzaville, Dakar, Casablanca... incluso en Argel. Mientras el poder nacional de Francia se mantuviera, el ejército francés estaba listo para aplastar cualquier rebelión. Pero la situación ha cambiado: París, la ciudad de la luz, ha caído en manos del enemigo, y el 'gobierno francés' no es más que un gobierno en el exilio que sobrevive en la Gobernación General de Argel. Ahora que todo ha cambiado, este continente se ha convertido en algo más temible que cualquier otra cosa. ¡Debemos apretar con fuerza las riendas para no caer desde esta precariedad!"


 FRA_revolution_nationale: "Revolución Nacional"
 FRA_revolution_nationale_desc: "$FRA_pet.6.d$"
 FRA_revolution_nationale_charles_de_gaulle_1: "Revolución del Pueblo"
 FRA_revolution_nationale_maurice_gamelin_1: "Revolución del Pueblo"
 FRA_revolution_nationale_charles_de_gaulle_1_desc: "La 'Revolución Nacional' de Pétain no fue más que un grillete forjado a puerta cerrada por ancianos empapados de derrotismo. Pero la nueva revolución liderada por Charles de Gaulle es distinta. No es una imposición de arriba hacia abajo, sino el propio clamor ardiente de decenas de miles reunidos en las calles. ¡Los franceses se negaron a convertirse en esclavos! Nuestra revolución será la más dinámica y grandiosa 'resistencia nacional', en la que todos los hombres y mujeres de esta tierra se convertirán en una sola ola gigantesca para barrer a los invasores."
 FRA_revolution_nationale_maurice_gamelin_1_desc: "La arbitrariedad y la represión cometidas bajo el nombre de 'Revolución Nacional' asfixiaron el verdadero espíritu de Francia: 'libertad, igualdad, fraternidad'. El mariscal Maurice Gamelin reflexiona sobre la soberbia de un ejército que intentó ponerse al frente de la política para moldear al pueblo. La verdadera revolución no consiste en crear algo nuevo, sino en regresar al espíritu constitucional de 1875 y a los valores de la República que habíamos perdido. Esta 'Revolución del Pueblo' no se levantará sobre el paso de las botas, sino sobre el código de leyes; y la victoria no se arrancará por el grito de mando de un dictador, sino por la disciplina y la entrega voluntaria de ciudadanos despiertos."

