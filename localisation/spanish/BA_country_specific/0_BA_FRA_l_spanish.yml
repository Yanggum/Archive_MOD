 FRA_charles_de_gaulle_focus_0: "De Gaulle, el defensor"
 FRA_charles_de_gaulle_focus_1: "Doctrina ofensiva"
 FRA_charles_de_gaulle_focus_2: "Contener a los conservadores dentro del ejército"
 FRA_charles_de_gaulle_focus_0_desc: "Los viejos mariscales siguen sin despertar de la pesadilla de la guerra de trincheras. Pero Charles de Gaulle lo sabe: esta derrota no se debió a falta de valor, sino a que nuestros métodos estaban obsoletos. La visión y la voluntad indomable del joven general son la única esperanza para sacudir a un ejército empapado en derrotismo y transformarlo en una fuerza moderna."
 FRA_charles_de_gaulle_focus_1_desc: "Defenderse no es más que otro nombre para la derrota. Ya no nos esconderemos detrás de otra Línea Maginot. Velocidad, maniobra y concentración de fuego. Solo una audaz doctrina ofensiva, encabezada por fuerzas acorazadas, puede arrancar la victoria frente a un enemigo abrumador."
 FRA_charles_de_gaulle_focus_2_desc: "Los derrotistas que dominan la cúpula militar y los conservadores aferrados a doctrinas caducas son un cáncer que bloquea la reforma. El general de Gaulle ampliará su influencia para apartarlos de los puestos clave y llenar el estado mayor con oficiales jóvenes y capaces, que solo piensen en la victoria."

# 모리스 가믈랭
 FRA_maurice_gamelin_focus_0: "Gamelin, el defensor"
 FRA_maurice_gamelin_focus_1: "Sistema de movilización sistemático"
 FRA_maurice_gamelin_focus_2: "Un ejército politizado"
 FRA_maurice_gamelin_focus_0_desc: "Aunque la defensa de la metrópoli fracasó, Maurice Gamelin sigue siendo un comandante veterano que controla la organización y la administración del ejército. El aventurerismo radical solo hundiría a las fuerzas armadas en una situación tan precaria. Solo el enfoque prudente y sistemático de Gamelin puede mantener a la caótica fuerza en el exilio como un ejército con orden."
 FRA_maurice_gamelin_focus_1_desc: "Un contraataque improvisado es suicida. Debemos evaluar minuciosamente los recursos humanos y materiales de Argelia y de todas las colonias, y construir un sistema de movilización sistemático capaz de abastecer al ejército con la máxima eficiencia. La victoria comienza no en el campo de batalla, sino en los depósitos y los libros de cuentas."
 FRA_maurice_gamelin_focus_2_desc: "El ejército no es solo un grupo que dispara armas. Es el pilar del Estado y el último baluarte que garantiza la estabilidad política. El general Gamelin reforzará las redes políticas dentro del ejército para que éste desempeñe un papel dirigente en la toma de decisiones del gobierno en el exilio."

# 공동 (드골 & 가믈랭)
 FRA_charles_de_gaulle_maurice_gamelin_focus_2: "Reorganizar el ejército francés"
 FRA_charles_de_gaulle_maurice_gamelin_focus_2_desc: "Aunque estos generales tienen puntos de vista distintos, coinciden en una cosa: con este batiburrillo no se puede hacer nada. Unificar y reorganizar bajo una sola cadena de mando a los derrotados que escaparon de la metrópoli, las tropas de guarnición colonial y los reclutas locales es una tarea más urgente que cualquier estrategia."

# 막심 베이강
 FRA_maxime_weygand_focus_0: "Weygand, gobernador general de Argelia"
 FRA_maxime_weygand_focus_1: "Legión Extranjera de Argelia"
 FRA_maxime_weygand_focus_0_desc: "Argelia ya no es una simple colonia. Es Francia misma. El gobernador general Maxime Weygand, con disciplina militar y capacidad administrativa, convertirá Argelia en una fortaleza sólida del gobierno en el exilio. Todos los preparativos para recuperar la metrópoli comienzan aquí, en Argel."
 FRA_maxime_weygand_focus_1_desc: "Nos falta mano de obra. El gobernador Weygand reunirá a los jóvenes de Argelia bajo la bandera de Francia. Prometiéndoles honor, sueldo y una futura ciudadanía, creará una poderosa Legión Extranjera capaz de combatir tanto en el desierto como en la montaña."

# 샤를 노게스
 FRA_charles_nogues_focus_0: "Nogues, gobernador general de Marruecos"
 FRA_charles_nogues_focus_1: "Legión Extranjera de Marruecos"
 FRA_charles_nogues_focus_0_desc: "Marruecos es un punto estratégico que conecta el Atlántico y el Mediterráneo. El gobernador general Charles Nogues ha mantenido la estabilidad marroquí manejando con habilidad al sultán y a los jefes tribales. Su gobierno experimentado eliminará factores de inestabilidad en la retaguardia y transformará Marruecos en una base logística para la recuperación de la metrópoli."
 FRA_charles_nogues_focus_1_desc: "Los bereberes y árabes de Marruecos son guerreros ásperos pero valientes. El gobernador Nogues los reunirá para ampliar la Legión Extranjera de Marruecos. Serán una fuerza valiosa para operaciones en entornos duros que al ejército regular francés le cuesta soportar."

# 샤를 모라스
 FRA_charles_maurras_focus_0: "El ideólogo Charles Maurras"
 FRA_charles_maurras_focus_1: "Trabajo y patria"
 FRA_charles_maurras_focus_2: "El valor del clero"
 FRA_charles_maurras_focus_3: "Action Française"
 FRA_charles_maurras_focus_0_desc: "La república ha sido una enfermedad que carcome el espíritu de Francia. Charles Maurras, líder de Action Française, cree que ahora ha llegado la oportunidad de curarla. Solo destruyendo el falso ídolo de la democracia y regresando a la tradición y el orden propios de Francia podrá sobrevivir nuestra nación."
 FRA_charles_maurras_focus_1_desc: "La lucha entre capitalistas y obreros solo divide a la nación. Maurras propone un corporativismo que trascienda el conflicto de clases: trabajo por la patria y un Estado que proteja ese trabajo. En esa unión orgánica, la economía recuperará la estabilidad y el poder nacional se restaurará."
 FRA_charles_maurras_focus_2_desc: "La Iglesia católica es el alma de la historia de Francia. Debemos restaurar la autoridad de la Iglesia, dañada por los republicanos anticlericales. La fe armará espiritualmente a un pueblo en la adversidad y otorgará legitimidad moral al gobierno en el exilio."
 FRA_charles_maurras_focus_3_desc: "Es hora de actuar. No necesitamos matones callejeros, sino guerreros con ideas. Ampliaremos la organización de Action Française para silenciar a la oposición y difundir en cada rincón el ideal de la restauración monárquica y el nacionalismo integral."

# 프랑수아 드 라 로크
 FRA_francois_de_la_rocque_focus_0: "El ideólogo François de la Rocque"
 FRA_francois_de_la_rocque_focus_1: "Economía corporativa"
 FRA_francois_de_la_rocque_focus_2: "Juventud francesa"
 FRA_francois_de_la_rocque_focus_3: "Consolidar a toda la derecha"
 FRA_francois_de_la_rocque_focus_0_desc: "Ni la vieja república ni una reacción monárquica son la respuesta. François de la Rocque, al frente de la Croix-de-Feu, ha defendido el orden, la autoridad y la integración de las masas. Combina un socialismo cristiano con un liderazgo autoritario para ofrecer un nuevo camino de revolución conservadora con atractivo popular."
 FRA_francois_de_la_rocque_focus_1_desc: "El laissez-faire caótico ha terminado. Debemos construir un sistema económico corporativista, coordinado por el Estado y con participación de representantes profesionales. Así frenaremos los abusos del capital, protegeremos los derechos de los trabajadores y maximizarremos la productividad nacional."
 FRA_francois_de_la_rocque_focus_2_desc: "El futuro pertenece a la juventud. De la Rocque organizará una \"Juventud francesa\" armada de disciplina, patriotismo y espíritu cristiano de servicio. No serán simples boy scouts, sino la vanguardia de una nueva generación que se pondrá al frente de la reconstrucción de la patria."
 FRA_francois_de_la_rocque_focus_3_desc: "Para enfrentar la amenaza de la izquierda y la incompetencia republicana, debemos unir a una derecha fragmentada. De la Rocque, apoyándose en su popularidad, formará una gran coalición pan-derechista que agrupe a conservadores, católicos y nacionalistas para tomar la iniciativa política."

# 피에르 라발
 FRA_laval_focus_0: "El primer ministro Pierre Laval"
 FRA_laval_focus_1: "Reforzar la postura anticomunista"
 FRA_laval_focus_0_desc: "Pierre Laval es un maestro de la supervivencia. Incluso entre los escombros de una Tercera República en colapso, mantuvo el cargo de primer ministro. Aunque el ejército haya reducido su poder, su notable habilidad política y su capacidad administrativa son un activo indispensable para gobernar un gobierno en el exilio sumido en el caos."
 FRA_laval_focus_1_desc: "El enemigo interno es tan peligroso como el externo. El primer ministro Laval reprimirá a comunistas y socialistas con dureza. Al eliminar elementos subversivos que amenazan la seguridad, buscará estabilidad social y consolidará el apoyo del bloque conservador."

# 프랑수아 다를랑
 FRA_darlan_focus_0: "'El almirante administrador' Darlan"
 FRA_darlan_focus_2: "Estrategia de hegemonía marítima"
 FRA_darlan_focus_3: "Más allá de las montañas"
 FRA_darlan_focus_0_desc: "El almirante François Darlan no es un simple militar. Ha convertido la armada en su instrumento personal y, además, posee un agudo sentido político como administrador. Con el ejército de tierra derrotado, Darlan, que mantiene intacto el poder naval, es un hombre fuerte imposible de ignorar dentro del gobierno en el exilio."
 FRA_darlan_focus_2_desc: "El mar es nuestra línea vital. Darlan impondrá el control del mar en el Mediterráneo apoyándose en una poderosa armada. Esta es la estrategia clave para mantener el contacto con la metrópoli, proteger el movimiento de suministros entre colonias y bloquear infiltraciones navales enemigas."
 FRA_darlan_focus_3_desc: "Nuestra mirada no se queda solo en el mar. Observaremos la frontera con Italia y la situación más allá de los Alpes; si es necesario, planearemos operaciones audaces que combinen infantería de marina y tropas de montaña. Cruzar las montañas parece imposible, pero para Darlan no existe lo imposible."

