 #시리아 이벤트
 SYR_event.1.t:0 "Independencia"
 SYR_event.1.d:0 "Cuando la mayor parte de las tropas francesas estacionadas por toda Siria regresaron a la metrópoli para combatir la existencia del Otro Mundo, ¡los sirios actuaron!\n\n Trabajadores, campesinos, empresarios, religiosos e intelectuales unieron fuerzas para expulsar a los opresores imperialistas. Hubo muchos sacrificios, pero tras superar el fracaso del intento de independencia de 1920 y de la revuelta drusa de tres años, y tras dejar atrás incluso los 33 años de suspensión constitucional, la retirada del último contingente francés de Siria consumó la independencia definitiva. ¡Los sirios celebran, y la sociedad civil está atareada diseñando el nuevo Estado!"
 SYR_event.1.a:0 "¡Viva la Siria liberada!"
 SYR_event.2.t:0 "Solicitud de ayuda económica de [SYR.getname]"
 SYR_event.2.d:0 "El gobierno de [SYR.getname], recién liberado del dominio colonial francés, acudió a nosotros, la Unión Soviética —vanguardia del movimiento antiimperialista— para recibir apoyo que impulse su crecimiento económico inmediatamente después de la liberación."
 SYR_event.2.a:0 "Ayudémoslos."
 SYR_event.2.b:0 "Nosotros también estamos ocupados."
 SYR_event.3.t:0 "Ayuda económica de la Unión Soviética"
 SYR_event.3.d:0 "La Unión Soviética ha decidido aceptar nuestra solicitud de ayuda."
 SYR_event.3.a:0 "Gracias."
 SYR_event.4.t:0 "Solicitud siria de apoyo industrial"
 SYR_event.4.d:0 "El ministerio de economía de [SYR.getname] nos ha pedido que apoyemos su economía. A cambio de ayudar a su industria, quizá podamos obtener de ellos lo que deseamos."
 SYR_event.4.a:0 "Suena tentador."
 SYR_event.4.b:0 "No necesitamos cooperar con ellos."
 SYR_event.5.t:0 "Aceptación de [FROM.getname]"
 SYR_event.5.d:0 "El gobierno de [FROM.getname] ha accedido a nuestra petición de apoyo. Sin embargo, tendremos que pagar el precio que ellos exigen."
 SYR_event.5.a:0 "Gracias."
 SYR_event.6.t:0 "Rechazo de [FROM.getname]"
 SYR_event.6.d:0 "El gobierno de [FROM.getname] ha rechazado nuestra petición de apoyo."
 SYR_event.6.a:0 "Qué lástima."
 SYR_event.7.t:0 "Reforma agraria"
 SYR_event.7.d:0 "En el avance de la reforma agraria, los moderados y los radicales han chocado. El ala moderada del partido propone primero adjudicar tierras a los campesinos y completar una primera reforma; más adelante, cuando la capacidad productiva lo permita, se aplicaría la colectivización agrícola. Por otro lado, el ala radical advierte que el surgimiento de pequeños propietarios puede fomentar ideas pequeñoburguesas entre las masas trabajadoras y derivar en una contrarrevolución, por lo que exige una colectivización agrícola inmediata y contundente."
 SYR_event.7.b:0 "Adjudicar tierras."
 SYR_event.7.a:0 "¡Avancemos hacia la agricultura colectiva!"
 SYR_event.8.t:0 "Elecciones libres"
 SYR_event.8.d:0 "Para dirigir a Siria, independiente desde hace poco, 200 sirios de todo oficio y estrato fueron elegidos en cada distrito. Sus orígenes son diversos: desde élites tradicionales como religiosos, profesores, funcionarios y terratenientes, hasta sectores considerados populares como sindicalistas, estudiantes y gente pobre.\n\n La fuerza que obtenga la mayoría en el Consejo Popular podrá definir y proclamar el rumbo de la Siria futura; por eso, cada partido se preparaba para actuar. Sin embargo, el Bloque Nacional —que lideró el tratado de independencia y organizó la huelga reciente— se hizo con el poder con un fuerte apoyo popular."
 SYR_event.8.a:0 "¡Viva la Siria republicana!"
 SYR_event.9.t:0 "Acción directa"
 SYR_event.9.d:0 "Las masas de trabajadores, campesinos, pobres, estudiantes e intelectuales de Siria han entrado simultáneamente en huelga. Las calles se llenaron de manifestaciones y las instalaciones públicas fueron ocupadas por los manifestantes mediante asaltos planificados.\n\n El Partido Comunista Sirio-Libanés declaró, en el Consejo Nacional, que asumiría activamente las demandas de las masas trabajadoras y reorganizaría la sociedad como una Siria socialista liberada."
 SYR_event.9.a:0 "¡Es la revolución!"
 SYR_event.10.t: "¡[FROM.getname] ha jurado lealtad a la Casa Real!"
 SYR_event.10.d: "[FROM.GetAdjective] ha jurado lealtad a nuestra Casa Real."
 SYR_event.10.a: "Gracias."
 SYR_event.11.t: "Solicitud de adhesión a la Commonwealth"
 SYR_event.11.d: "[FROM.getname] ha solicitado unirse a la Commonwealth."
 SYR_event.11.a: "Aceptemos a esos leales."
 SYR_event.11.b: "Aún no están preparados."
 SYR_event.12.t: "Rechazo de [FROM.getname]"
 SYR_event.12.d: "Nuestra propuesta ha sido rechazada."
 SYR_event.12.a: "Qué lástima."
 SYR_event.13.t: "Huelga general siria"
 SYR_event.13.d: "Cada vez es más evidente que el dominio colonial en Siria y el Líbano, mantenido durante los últimos diez años, ya no puede continuar. Con la huelga general siria, las calles llevan tiempo paralizadas, y la guarnición en Siria está sufriendo daños considerables. Para colmo, la huelga se ha extendido como huelgas aliadas y concentraciones solidarias en países árabes vecinos, formando movimientos políticos significativos en Palestina, Líbano, Jordania y otros lugares.\n\n Su Excelencia el Mariscal comprende bien que este enfrentamiento no beneficia a los intereses nacionales de Francia. Por Francia, está listo para presentarse impecablemente y entablar un diálogo abierto con Siria."
 SYR_event.13.a: "Es un paso atrás para avanzar dos."
 SYR_event.14.t: "Dimisión de [SYR_mehemed_ali_abed.getname]"
 SYR_event.14.d: "[SYR_mehemed_ali_abed.getname], quien ejerció la presidencia durante cerca de cuatro años, a veces fue criticado por ser demasiado conciliador en la diplomacia hacia Francia, pero es indudable que es uno de nuestros queridos independentistas. Ha anunciado que dimitirá para ayudar a crear el nuevo gobierno tras la independencia. El parlamento libre, que confió en [SYR_hashim_al_atassi.getname] —quien planificó y dirigió la huelga general siria—, ha decidido que él asuma la presidencia a continuación."
 SYR_event.14.a: "Demos la bienvenida al nuevo presidente."
 SYR_event.15.t: "Levantamiento"
 SYR_event.15.d: "La débil democracia parlamentaria ya no es algo que debamos considerar. Un valiente y despierto cuerpo de oficiales, de la mano del Partido Social Nacionalista, ha asaltado la capital. Hubo cierta resistencia, pero fue neutralizada, y el poder fue tomado. Aun así, ¡sigue siendo incierto si el campo tolerará nuestras acciones!"
 SYR_event.15.a: "¡Viva el levantamiento!"
 SYR_event.16.t:0 "Amistad con Occidente"
 SYR_event.16.d:0 "Aunque nos hemos independizado, seguimos en una pendiente resbaladiza donde debemos defender la democracia frente a las amenazas del comunismo y el fascismo. La coordinación con Occidente no antepone el sentimiento nacional, sino la salvaguarda del orden democrático."
 SYR_event.16.a:0 "¿La gente lo entenderá?"
 SYR_event.17.t: "Solicitud de compra de Chipre"
 SYR_event.17.d: "[FROM.getname] ha solicitado comprar Chipre."
 SYR_event.17.a: "Es un buen trato."
 SYR_event.17.b: "Qué insolencia."
 SYR_event.18.t: "Ultimátum de [FROM.getname]"
 SYR_event.18.d: "El gobierno de [FROM.GetAdjective] nos ha enviado un ultimátum exigiendo nuestros territorios del sureste. Aunque en su mayoría son tierras kurdas, ¡es una violación flagrante de nuestra soberanía!"
 SYR_event.18.a: "Nada vale más que la paz."
 SYR_event.18.b: "¡Qué insolencia!"
 SYR_event.19.t: "¡Golpe de Estado!"
 SYR_event.19.d: "Un grupo de oficiales fascistas, presuntamente instigado por [SYR.gentame], ha dado un golpe de Estado."
 SYR_event.19.a: "¡Viva el Nuevo Irak!"
 SYR_event.19.b: "¡Deténganlos!"
 SYR_event.20.t: "Cooperación de clases destruida"
 SYR_event.20.d: "Mantener la cooperación de clases bajo la bandera de la democracia y reformar una Siria libre resultó ser una fantasía idealista de ingenuidad absoluta. La cohesión se rompió y la solidaridad se derrumbó. ¡En las provincias, distintas fuerzas están levantándose!"
 SYR_event.20.a: "¡Maldita sea!"
 SYR_event.20_tt_1: "¡Completa el enfoque §Y$SYR_focus_dem_9$§! para poder continuar hacia el comunismo!\n"
 SYR_event.20.b: "No por nada existe eso de la lucha de clases."
 SYR_event.21.t: "Propuesta de tratado comercial de [FROM.getname]"
 SYR_event.21.d: "El gobierno de [FROM.GetAdjective] nos ha propuesto firmar un tratado comercial."
 SYR_event.21.a: "Suena tentador."
 SYR_event.21.b: "¿Y por qué habríamos?"
 SYR_event.22.t: "Propuesta de integración de [SYR.getname]"
 SYR_event.22.d: "Tras soportar juntos durante mucho tiempo el dominio colonial, nuestros camaradas sirios nos han propuesto la integración."
 SYR_event.22.a: "¡Somos hermanos!"
 SYR_event.22.b: "No es más que expansionismo."

 
