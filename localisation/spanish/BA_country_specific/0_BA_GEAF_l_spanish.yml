  # Germany split paths
 GE1_start_focus: "Unificación de Alemania Occidental"
 GE1_start_focus_desc: "Gracias a nuestros logros militares, nuestras fuerzas han logrado unificar Alemania Occidental. Ahora es momento de volver a reunir a las antiguas figuras del gobierno."

 GE2_start_focus: "Unificación de Alemania Oriental"
 GE2_start_focus_desc: "Gracias a nuestros logros militares, nuestras fuerzas han logrado unificar Alemania Oriental. Ahora es momento de volver a reunir a las antiguas figuras del gobierno."

 GE1_reorganize_nationale_volksarmee: "Fundación del Ejército Popular Nacional"
 GE1_reorganize_nationale_volksarmee_desc: "Dentro de nuestras fuerzas armadas aún prevalecen la corrupción y la apología del fascismo. Para prevenir la resistencia y la traición, debemos depurar primero a quienes podrían rebelarse. Este proceso generará grandes vacantes en el ejército, por lo que, para garantizar la seguridad del pueblo, deberemos nombrar nuevos oficiales leales que conduzcan a nuestros valientes soldados hacia los campos de batalla que puedan surgir."

 GE1_monarchist_sentiment: "Sentimiento monárquico"
 GE1_monarchist_sentiment_desc: "Nuestro pueblo desea una monarquía, y la tendrá. Aunque la forma exacta del gobierno aún no está definida, es evidente que los alemanes necesitan un Káiser."

 GE2_return_of_the_kaiserreich: "Restauración del Imperio Alemán"
 GE2_return_of_the_kaiserreich_desc: "Desde la unificación han ocurrido innumerables acontecimientos. Ahora, quienes nos siguen anhelan la monarquía y se esforzarán por restaurar al Káiser en el trono."

 GE2_start_the_proletarian_revolution: "República de la Revolución Proletaria"
 GE2_start_the_proletarian_revolution_desc: "Ahora que nuestro Estado ha unificado Alemania Occidental y ha proclamado la revolución del proletariado, somos sin duda la vanguardia de la revolución y el faro de la humanidad."

 GE2_ambition_for_the_west: "Hacia los territorios occidentales"
 GE2_united_homeland: "Patria unificada"
 GE2_united_homeland_desc: "Tras la devastación de la Gran Transición y la larga guerra de unificación, debemos buscar la reconstrucción de la patria. Para alcanzar este objetivo, pediremos al pueblo que posponga temporalmente las comodidades personales y concentre todos los recursos en esta misión."

