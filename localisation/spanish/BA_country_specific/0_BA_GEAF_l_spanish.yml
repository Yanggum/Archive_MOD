  GEAF_Mefo_return: "Recuperar los bonos Mefo"
  GEAF_Mefo_return_desc: "Ha llegado el momento de canjear nuestros Bonos Mefo por industria real. Con ello declararemos la recuperación de la economía alemana e iniciaremos la verdadera actividad económica."
  GEAF_prioritize_economic_growth: "Priorizar el crecimiento"
  GEAF_prioritize_economic_growth_desc: "Una política fiscal deficiente casi arruinó nuestra economía. ¡Es hora de fabricar tractores en lugar de tanques y repartir palas en lugar de fusiles!"
  GEAF_currency_reforms: "Reforma monetaria"
  GEAF_currency_reforms_desc: "El primer paso hacia la recuperación y el dinamismo económico es una reforma integral de la moneda."
  GEAF_lower_taxes: "Reducir impuestos"
  GEAF_lower_taxes_desc: "La rearmamentación cargó de impuestos al pueblo. Aliviar la carga reducirá los ingresos estatales a corto plazo, pero los ciudadanos gastarán más libremente."
  GEAF_workers_rights: "Derechos laborales"
  GEAF_workers_rights_desc: "Los sindicatos han cambiado radicalmente estos años. Reformarlos nos permitirá unir a los trabajadores y otorgarles beneficios."
  GEAF_abolish_price_controls: "Eliminar los controles de precios"
  GEAF_abolish_price_controls_desc: "Introducidos para sostener el rearme, ahora asfixian la economía. Suprimirlos reducirá la recaudación, pero estimulará la iniciativa privada."
  GEAF_increased_trade: "Aumentar el comercio"
  GEAF_increased_trade_desc: "Para prosperar debemos importar lo que no producimos. Cerremos acuerdos comerciales—en nuestros términos—con otras naciones."
