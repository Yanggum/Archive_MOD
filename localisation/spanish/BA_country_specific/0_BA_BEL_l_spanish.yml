  BEL_issue_lordships: "Conceder títulos nobiliarios"
  BEL_issue_lordships_desc: "La corrupción militar reclama “pequeñas” recompensas; otorgar títulos de nobleza asegurará su lealtad."
  BEL_promote_agriculture: "Resurgir de los barones del café"
  BEL_promote_agriculture_desc: "El sector cafetalero sostiene nuestra economía; honramos a sus magnates, los “barones del café”, como pilares del reino."
