  BEL_ensure_continued_military_support: "Garantizar apoyo militar continuo"
  BEL_ensure_continued_military_support_desc: "El ejército exiliado es esencial; proporcionarle mejores equipos y oficiales reforzará nuestra fuerza."
  BEL_work_with_the_integralists: "Cooperar con los integralistas"
  BEL_work_with_the_integralists_desc: "Además del ejército, el país necesita cohesión; pospongamos las disputas hasta después de la reconquista: nadie quiere morir en la selva africana."
