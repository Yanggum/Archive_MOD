  # EVENTOS DE HISTORIA (1‑18)
  BEL_story_event.1.t:0 "Cuando caía la nieve"
  BEL_story_event.1.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nQuizá fue la pasada Navidad. Un muchacho sonreía feliz mientras escuchaba las campanas repicar en la calle de un pequeño pueblo de Valonia. Aunque su Bélgica natal se había desvanecido tiempo atrás, el chico era dichoso: con quince años, la patria era un concepto lejano, prescindible. Aquella Nochebuena todo parecía en paz salvo las patrullas de la Academia de Policía Valkyrie.\n\nToc, toc. Llamaron a la puerta. Su padre —el único familiar— estaba fuera trabajando, así que el muchacho abrió. Frente a él había una joven rubia de melena corta, rostro hermoso y abrigo cubierto de nieve. Sin decir palabra inclinó la cabeza y le entregó unos documentos en francés. El chico, embelesado, firmó con el nombre de su padre y la despidió.\n\nCuando cerró, su cara se tornó roja como el traje de Santa. Aquel gesto, la nieve sobre su cabello y aquel uniforme singular bastaron para que el corazón del muchacho descubriera el amor.\n\nCon la respiración agitada salió corriendo en su busca, recorrió el pueblo durante horas… pero la chica se había esfumado. No la encontró hasta que su padre, preocupado, le reprendió por deambular bajo la nieve que siguió cayendo toda la madrugada.\n\nAquella noche el muchacho no durmió: volvió a trazar en su mente el rostro de la chica, más hermoso que un ramo de flores.\n\n«Si pudiera volver a verla…»"
  BEL_story_event.2.t:0 "Frente a frente"
  BEL_story_event.2.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nEl chico abrió a duras penas los párpados. Sobre la mesa, el regalo de su padre y una nota excusándose por volver tarde. Con un suspiro desayunó pan húmedo y leche tibia, y se encaminó a la escuela: todo el camino lo ocupaba el recuerdo de la joven.\n\nLos guardias de Valkyrie seguían patrullando; no esperaba verla allí: cientos de uniformes idénticos y ninguno era ella… hasta que la vio: rubia, piel nívea, ojos púrpura.\n\nEl chico perdió las palabras. La buscó hasta destrozar los zapatos y allí estaba. Se quedó sin aliento, el rostro hecho un tomate.\n\nLa muchacha se le acercó con expresión curiosa. Él sentía que su corazón estallaría."
  BEL_story_event.3.t:0 "Primeras palabras"
  BEL_story_event.3.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n—Eras tú, ¿verdad? El que firmó ayer con el nombre de su padre.\n\nEl muchacho asintió como un muñeco averiado. Ella sonrió y se presentó:\n\n—Soy Sakumi. A partir de hoy vigilaré esta zona; mientras estemos nosotras, estarás a salvo, lo prometo.\n\nEl resto llegó difuso a los oídos del joven, absorbido por su belleza. Cuando recuperó el sentido quiso huir de vergüenza, pero sus pies se anclaron; regresó y, titubeando, soltó:\n\n—S‑Sakumi… ¡q‑quisiera… ser tu amigo!\n\nElla captó la intención y, divertida, aceptó. La nieve seguía cayendo despacio, sellando aquel comienzo."
  BEL_story_event.4.t:0 "Forjando amistad"
  BEL_story_event.4.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nUna semana después la nieve se había derretido casi por completo. Tras las clases, Sakumi esperaba en el aula vacía y el muchacho le contaba de todo: su amigo atragantado con pan, quejas de un profesor, chismes…\n\nElla tenía poco que contar: misma guardia, mismos compañeros. Pero escuchaba fascinada: para ella cada anécdota era nueva y divertida.\n\n—Así que el profe Jang volvió a llenarnos de deberes… —bufó él.\n—Quizá sea porque te aprecia; ¡tienes un buen maestro! —respondió ella riendo.\n—¡Sakumi! ¡Tenías que compadecerte de mí!\n\nY los dos rieron; la juventud florecía entre ellos."
  BEL_story_event.5.t:0 "Una pequeña charla"
  BEL_story_event.5.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nSakumi patrullaba pero pensaba en él. El chico suspiraba por el peso del francés impuesto, y ella decidió mostrarle un lugar especial.\n\nTras una larga caminata llegaron a un lago amplio, charcos del deshielo y senderos llenos de aves. El joven nunca había estado allí.\n\n—¿Vas a quedarte de pie? Siéntate conmigo.\n\nSe sentaron sobre una roca grande. Ella, sonriendo, preguntó sin rodeos:\n\n—Dime, ¿te gusto? ¿Sí?"
  BEL_story_event.6.t:0 "Bajo el cielo de los pájaros"
  BEL_story_event.6.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n—¿Q‑qué? —balbuceó él.\n\nSakumi lo miró con ternura y puso su mano sobre la de él. El joven quiso apartarse, perdió el equilibrio y ambos cayeron entre hierba y tierra. Al abrir los ojos estaban abrazados, sonrojados y sin palabra: solo los pájaros charlaban en lo alto.\n\nLos corazones latían al mismo ritmo."
  BEL_story_event.7.t:0 "Corazones al unísono"
  BEL_story_event.7.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nEl chico sacó un regalo maltrecho por la caída: un lisianthus púrpura. Ella lo prendió en su cabello dorado.\n\n—Lo guardaré siempre, porque viene de ti.\n\nLuego lo abrazó; el muchacho, con lágrimas de felicidad, la estrechó. Los dos corazones palpitaron juntos, cada vez más rápido."
  BEL_story_event.8.t:0 "Rumores"
  BEL_story_event.8.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nCundió el rumor entre las Valkyrie: la Zorra Calamidad, Kosaka Wakamo, había escapado. Decían que aterrorizaba Valonia. Sakumi temblaba: rogaba que su pequeña aldea quedara al margen.\n\nMientras pensaba en un aula vacía, el muchacho irrumpió y la abrazó, ajeno a su preocupación. Ella sonrió pero su rostro se ensombreció con el secreto que aún no se atrevía a revelar."
  BEL_story_event.9.t:0 "No huiré, jamás"
  BEL_story_event.9.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nSakumi explicó la amenaza. El chico la escuchó serio:\n\n—Eres de Valkyrie; has pasado peligros. Si temes perderme, protégeme: es tu deber, ¿no?\n\nSus palabras hicieron temblar a Sakumi. Lágrimas brotaron. Lo abrazó pidiendo perdón; él la consoló: había prometido no llorar desde la muerte de su madre."
  BEL_story_event.10.t:0 "Preparativos"
  BEL_story_event.10.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nLos estudiantes de Valkyrie fortificaron la aldea. Sakumi levantó su escopeta; aunque dudaba del prestigio de su escuela, se juró proteger a Vincent y a su padre cueste lo que cueste. El sol declinaba; su determinación ardía más que nunca."
  BEL_story_event.11.t:0 "Combate"
  BEL_story_event.11.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nLlamas teñían el cielo. En diez minutos todas las Valkyrie salvo Sakumi yacían en el suelo. Frente a ella estaba Wakamo.\n\n—Qué resistencia tan pobre —se burló la zorra—. ¿Acaso proteges a alguien querido? Las personas traicionan…\n\n—Cierra la boca —gruñó Sakumi alzando la escopeta con el brazo sano.\n\nWakamo disparó primero, destrozando su mano; luego pasó junto a ella. Pero Sakumi, ensangrentada, se aferró a su tobillo:"
  BEL_story_event.12.t:0 "Súplica"
  BEL_story_event.12.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n—Por favor… no toques esta aldea. Para ti es nada, para mí lo es todo. Deja vivir a la gente… a Vincent.\n\nLágrimas y sangre caían. Wakamo podía apartarla de una patada, pero en silencio se quedó mirando… y dio media vuelta. Sakumi, sollozando, agradeció una y otra vez a la enemiga que desaparecía entre las ruinas."
  BEL_story_event.13.t:0 "Regreso"
  BEL_story_event.13.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nLa nieve cubría las cenizas. Vincent buscó a Sakumi por todas partes, temiendo lo peor. Lloraba de ansiedad cuando escuchó una voz débil:\n\n—Vincent…\n\nSe volvió: era ella, maltrecha pero viva. El chico la abrazó llorando; ella le rodeó con su único brazo fuerte.\n\n—Creí que habías muerto…"
  BEL_story_event.14.t:0 "En las ruinas nevadas"
  BEL_story_event.14.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n—No podría irme y dejarte. Aún nos quedan muchas cosas que hacer juntos —susurró Sakumi. Él la estrechó con más fuerza.\n\nEntre lágrimas sellaron un beso. La nieve se derretía al tocar sus mejillas."
  BEL_story_event.15.t:0 "Un día radiante"
  BEL_story_event.15.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nBajo el sol, la pareja disfrutó de su primera cita: comida callejera, ropa nueva, un beso en el paseo del lago.\n\n—¿Te cambio la flor? Se está marchitando —propuso él.\n—¡Ni hablar! Es tu primer regalo; la llevaré aunque se seque —rió ella."
  BEL_story_event.16.t:0 "Amor inmutable"
  BEL_story_event.16.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nUn hombre demacrado surgió entre edificios con una bomba rompe‑Halo.\n\n—¡Muere, maldita! —gritó.\n\nSakumi, herida aún, no podía huir; abrazó al chico y le dio la espalda al explosivo. Hubo un estruendo y todo terminó.\n\nEl corazón de la joven se detuvo bajo el cielo rojo del atardecer."
  BEL_story_event.17.t:0 "No es una despedida eterna"
  BEL_story_event.17.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nVincent lloraba ante el ataúd abierto. Dejó un lisianthus nuevo en las manos frías de Sakumi. Iō, amiga de ella, le entregó una carta:\n\n—La escribió para ti.\n\nEl muchacho la leyó entre lágrimas y, al terminar, sonrió al cielo: «Volveremos a vernos»."
  BEL_story_event.18.t:0 "Para Vincent"
  BEL_story_event.18.desc:0 "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n«Hace tiempo que no escribo. Quería decírtelo en persona, pero me muero de vergüenza.\n\nAntes yo era una estudiante normal de la Policía Valkyrie; tú cambiaste mi vida gris por un arcoíris. Creo que te amo desde entonces.\n\nHablé con tu padre: dice que nunca te vio tan feliz. Cuando seamos adultos y todo esto acabe, vivamos juntos aquí. Me dio su bendición para casarnos; solo falta tu respuesta… ¿Por qué lloro al escribir? ¿Miedo a perderte? Quizá, pero mi amor es real.\n\nSerá mejor que pare. Cuando seamos mayores, seamos felices juntos.\n\nTe quiero mucho.\n\nKurosawa Sakumi»"

 # "_2" 포커스 로컬라이제이션 (벨기에 망명 정부 확장 중점들)
 
 # 군사 관련 "_2" 포커스들
 BEL_royal_military_academy_2: "Expansión de la Real Academia Militar del Congo"
 BEL_royal_military_academy_2_desc: "En el Congo, nuestro lugar de exilio, ampliaremos la filial de la Real Academia Militar belga para formar oficiales de excelencia en suelo local. Para recuperar la metrópoli, necesitaremos mandos experimentados sin excepción."
 
 BEL_multi_language_courses_2: "Cursos de instrucción militar multilingüe"
 BEL_multi_language_courses_2_desc: "Para comunicarnos sin fricciones con las numerosas tribus del Congo, introduciremos cursos de instrucción militar multilingüe. Con ello podremos reforzar la cooperación con los locales y elevar la cohesión del ejército."
 
 BEL_fn_herstal_2: "Sucursal congoleña de FN Herstal"
 BEL_fn_herstal_2_desc: "Estableceremos una sucursal en el Congo de FN Herstal, el célebre fabricante de armas belga. Producir armamento directamente en suelo local elevará de forma considerable la potencia de fuego del ejército en el exilio."
 
 BEL_military_academy_2: "Instituto de formación militar del Congo"
 BEL_military_academy_2_desc: "Fundaremos un instituto de formación militar especializado en el Congo para adiestrar de forma sistemática a oficiales de origen local. Así aseguraremos el liderazgo militar que necesitamos durante el exilio."
 
 BEL_staff_planning_2: "Refuerzo del Estado Mayor en el Congo"
 BEL_staff_planning_2_desc: "Reforzaremos las funciones del Estado Mayor del ejército belga en el exilio, establecido en el Congo. Esto permitirá una planificación más precisa para la reconquista y una ejecución más eficiente de las operaciones."
 
 BEL_small_arms_supply_chain_2: "Localización de la cadena de suministro de armas ligeras"
 BEL_small_arms_supply_chain_2_desc: "Construiremos por completo en el Congo la producción y la cadena de suministro de armas ligeras. De este modo reduciremos la dependencia externa y garantizaremos un abastecimiento estable de armamento."
 
 BEL_mortar_production_2: "Producción local de morteros"
 BEL_mortar_production_2_desc: "Implantaremos instalaciones para fabricar morteros directamente en el Congo. Esto reforzará nuestra artillería y proporcionará el apoyo de fuego necesario para la reconquista."
 
 BEL_light_tanks_2: "Programa de desarrollo de tanques ligeros"
 BEL_light_tanks_2_desc: "Desarrollaremos tanques ligeros adecuados al terreno y al entorno del Congo. Mejorarán la movilidad del ejército en el exilio y desempeñarán un papel clave en la reconquista."
 
 BEL_modern_anti_air_artillery_2: "Despliegue de artillería antiaérea moderna"
 BEL_modern_anti_air_artillery_2_desc: "Desplegaremos artillería antiaérea moderna en los principales puntos estratégicos del Congo para elevar de forma sustancial la defensa aérea del gobierno en el exilio. Así protegeremos instalaciones críticas de los bombardeos enemigos."
 
 BEL_support_weapons_focus_2: "Especialización en armas de apoyo"
 BEL_support_weapons_focus_2_desc: "Especializaremos la capacidad de empleo de armas de apoyo del ejército en el exilio. El uso eficiente de ametralladoras, morteros y cañones antitanque permitirá maximizar la potencia de combate."
 
 # 해군 관련 "_2" 포커스들
 BEL_allied_donations2: "Ampliación del apoyo naval de los Aliados"
 BEL_allied_donations2_desc: "Aseguraremos apoyo adicional en buques y equipos navales por parte de los Aliados. Con ello garantizaremos el control del litoral congoleño y estableceremos una cabeza de puente marítima para el regreso a la metrópoli."
 
 BEL_corvette_fleet2: "Flota de corbetas del Congo"
 BEL_corvette_fleet2_desc: "Organizaremos una flota de corbetas para la defensa de la costa del Congo. Pequeña pero muy ágil, esta flota llevará a cabo tareas de patrulla costera y reconocimiento marítimo, reforzando la defensa naval del gobierno en el exilio."
 
 BEL_boelwerf2: "Reconstrucción del astillero Boelwerf"
 BEL_boelwerf2_desc: "Estableceremos en el Congo una sucursal de Boelwerf, la tradicional empresa belga de construcción naval. Al construir buques directamente en suelo local, aumentaremos la autosuficiencia de la marina del ejército en el exilio."
 
 # 공군 관련 "_2" 포커스들
 BEL_develop_belgian_air_industry2: "Traslado de la industria aeronáutica belga al Congo"
 BEL_develop_belgian_air_industry2_desc: "Trasladaremos y reconstruiremos en el Congo la tecnología y la base industrial aeronáutica belga. Esto nos permitirá asegurar una capacidad independiente de mantenimiento y desarrollo de aeronaves para la fuerza aérea en el exilio."
 
 BEL_foreign_plane_purchases2: "Ampliación de la adquisición de aviones extranjeros"
 BEL_foreign_plane_purchases2_desc: "Obtendremos más aeronaves de distintos tipos de los Aliados y países amigos. Así diversificaremos la fuerza aérea en el exilio y garantizaremos capacidad de respuesta para múltiples misiones."
 
 BEL_air_academy_construction2: "Academia de la Fuerza Aérea del Congo"
 BEL_air_academy_construction2_desc: "Fundaremos una academia de la fuerza aérea en el Congo para formar pilotos y técnicos aeronáuticos en suelo local. Esto hará posible una expansión sostenida del poder aéreo necesario para la reconquista."
 
 BEL_spitfire_purchases2: "Adquisición adicional de Spitfires"
 BEL_spitfire_purchases2_desc: "Adquiriremos más cazas Spitfire del Reino Unido. Estas excelentes aeronaves actuarán como columna vertebral de la fuerza aérea en el exilio y contribuirán enormemente a asegurar la superioridad aérea."
 
 # 기술/연구 관련 "_2" 포커스
 BEL_tech_slot_3_2: "Expansión del Instituto de Ciencia y Tecnología del Congo"
 BEL_tech_slot_3_2_desc: "Ampliaremos de forma significativa el Instituto de Ciencia y Tecnología establecido en el Congo para obtener capacidad de investigación adicional. Incluso durante el exilio, el progreso tecnológico continuo sentará las bases para la reconquista."


 BEL_department_of_telecommunications_2: "Ministerio de Telecomunicaciones"
 BEL_department_of_telecommunications_2_desc: "El Ministerio de Telecomunicaciones se encarga de gestionar la red de comunicaciones belga y de controlar el flujo de información. Incluso en tiempos de guerra, este departamento se esfuerza por mantener las comunicaciones y proporcionar a la población la información necesaria."

 BEL_department_of_ballistic_metrology_2: "Balística"
 BEL_department_of_ballistic_metrology_2_desc: "El departamento de Balística se encarga de investigar y desarrollar la tecnología militar belga. Incluso durante la guerra, trabaja por el avance de las tecnologías militares y contribuye a reforzar la capacidad defensiva de Bélgica."

 BEL_center_for_advanced_military_studies_2: "Instituto de Estudios Militares Avanzados"
 BEL_center_for_advanced_military_studies_2_desc: "El Instituto de Estudios Militares Avanzados es una institución dedicada a investigar la estrategia y la táctica militar belgas. Incluso en tiempos de guerra, se esfuerza por desarrollar la doctrina estratégica y contribuye a aumentar la eficiencia de las operaciones militares."

 BEL_resist_and_bite_2: "Resistir y aguantar"
 BEL_resist_and_bite_2_desc: "«Resistir y aguantar» simboliza el espíritu del pueblo belga: no perder la esperanza en tiempos de guerra y esforzarse por superar la adversidad. Este departamento impulsa diversas actividades para infundir esperanza y coraje a la población."

 BEL_senior_officer_training_2: "Formación de oficiales superiores"
 BEL_senior_officer_training_2_desc: "El departamento de formación de oficiales superiores se encarga de preparar a los líderes militares belgas. Incluso durante la guerra, opera diversos programas de adiestramiento para reforzar las capacidades de mando y trabaja por el éxito de las operaciones militares belgas."

 BEL_increased_length_of_service_2: "Ampliación del periodo de servicio"
 BEL_increased_length_of_service_2_desc: "El departamento de ampliación del periodo de servicio se encarga de apoyar a los militares belgas para que puedan continuar sirviendo durante la guerra. Al extender el tiempo de servicio, fortalece la defensa belga y se esfuerza por la victoria."

 BEL_junior_officer_training_2: "Formación de oficiales subalternos"
 BEL_junior_officer_training_2_desc: "El departamento de formación de oficiales subalternos se encarga de preparar a los oficiales de rangos inferiores. Incluso durante la guerra, opera diversos programas de adiestramiento para reforzar sus capacidades y contribuye a elevar el poder de combate del ejército belga."

 BEL_poudreries_reunies_de_belgique_2: "Poudreries Réunies de Belgique"
 BEL_poudreries_reunies_de_belgique_2_desc: "Poudreries Réunies de Belgique es un fabricante belga de armamento que continúa produciendo material bélico incluso durante la guerra. Suministra armas y munición al ejército belga y se esfuerza por la victoria."

 BEL_belgian_tank_development2: "Tanques belgas"
 BEL_belgian_tank_development2_desc: "El departamento de desarrollo de tanques belgas se encarga de investigar y desarrollar la tecnología de blindados. Incluso en tiempos de guerra, trabaja por el avance de la tecnología acorazada y contribuye a fortalecer las fuerzas blindadas belgas."

 BEL_doctrinal_innovations2: "Innovaciones doctrinales"
 BEL_doctrinal_innovations2_desc: "El departamento de innovaciones doctrinales investiga y desarrolla la doctrina militar belga. Incluso durante la guerra, crea nuevas tácticas y estrategias para aumentar la eficiencia operativa y contribuye a reforzar el poder de combate del ejército belga."

 BEL_antwerp_maritime_academy2: "Academia Marítima de Amberes"
 BEL_antwerp_maritime_academy2_desc: "La Academia Marítima de Amberes es una institución dedicada a investigar y enseñar tecnología marítima y navegación. Incluso durante la guerra, opera investigación y programas educativos para mejorar la eficiencia de las operaciones navales y contribuye a fortalecer la capacidad de la marina belga."

 BEL_early_helicopters2: "Desarrollo de helicópteros tempranos"
 BEL_early_helicopters2_desc: "El departamento de desarrollo de helicópteros tempranos investiga y desarrolla la tecnología de helicópteros. Incluso durante la guerra, trabaja por el avance de esta tecnología y contribuye a reforzar la capacidad de operaciones aéreas del ejército belga."

 BEL_air_doctrine2: "Doctrina de operaciones aéreas"
 BEL_air_doctrine2_desc: "El departamento de doctrina de operaciones aéreas investiga y desarrolla tácticas y estrategias relacionadas con operaciones aéreas. Incluso durante la guerra, crea nuevas tácticas y estrategias para aumentar la eficiencia de las operaciones aéreas y contribuye a reforzar la capacidad de operaciones aéreas del ejército belga."
