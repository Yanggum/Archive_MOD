  BEL_land_1st_2: "Reforma agraria, fase II"
  BEL_land_1st_2_desc: "Redistribuiremos tierras y mejoraremos la infraestructura agrícola para impulsar la producción."
  BEL_shipyard: "Astillero del Congo"
  BEL_shipyard_desc: "Construiremos un astillero belga en el Congo para reforzar nuestra presencia naval."
  BEL_implement_a_national_guard: "Crear Guardia Nacional"
  BEL_implement_a_national_guard_desc: "Estableceremos una Guardia Nacional congoleña para afianzar nuestro dominio."
  BEL_import_oil: "Ampliar importación de petróleo"
  BEL_import_oil_desc: "Aumentaremos las importaciones de petróleo para estabilizar el suministro energético y fomentar la industria."
  BEL_massive_recruit_plan: "Plan de reclutamiento masivo"
  BEL_massive_recruit_plan_desc: "Lanzaremos un reclutamiento masivo en el Congo para asegurar el control belga."
  
  BEL_reward_army_loyalty: "Fundar fuerza aérea"
  BEL_reward_army_loyalty_desc: "Crearemos una fuerza aérea belga en el Congo para reforzar nuestro poder militar."
  
  BEL_reinvigorate_the_navy: "Fundar marina"
  BEL_reinvigorate_the_navy_desc: "Estableceremos una marina belga en el Congo para asegurar nuestra capacidad marítima."
  
  BEL_united_industrial_states_of_belgium: "Estado industrial belga"
  BEL_united_industrial_states_of_belgium_desc: "Crearemos un estado industrial para acelerar la industrialización y el crecimiento económico."
