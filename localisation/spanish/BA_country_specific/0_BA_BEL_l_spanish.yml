l_spanish:
  BEL_GATHERING_STORM_DESC_1: "La súbita invasión de seres de otro mundo sumió al pueblo belga en el dolor de una guerra interminable. El gobierno colapsó y el rey Leopoldo III huyó al Congo para recuperar la metrópoli, pero el futuro de Bélgica sigue siendo incierto. ¿Logrará Bélgica reconquistar su patria y restaurar la paz tras la invasión extraterrena?"
 
  BEL_country_intro_header: "§YLa amapola marchita§!"
  BEL_country_intro_content: "La historia de Bélgica comienza en 1790. Primero como Estados Unidos de Bélgica y luego como reino independiente, Bélgica vivió como imperio colonial dominando, entre otros, el Congo africano, y como nación de las tierras bajas. Tras la Gran Guerra, cuando su territorio fue pisoteado por Alemania, creyó que nunca volvería a ser mancillado.\n\nPero el destino cortó de un tajo el hilo llamado Bélgica.\n\nCuando las muchachas de los anillos invadieron Europa y aniquilaron Bélgica, el rey Leopoldo III y los belgas se exiliaron a la colonia congoleña. A diferencia de las posesiones francesas, donde sobraban nativos fieles, la situación belga era nefasta: la resistencia local no cesa y la popularidad del monarca está por los suelos.\n\nAun azotada por enfermedades, la Bélgica en el exilio mantiene un único objetivo: regresar a la patria. Para lograrlo quizá deba pagar un alto precio al Congo o incluso perder la colonia por completo.\n\nUna arteria manchada de sangre se ha vuelto el cordón vital del Estado belga. El corazón de este país menor, abandonado en la selva africana, podría dejar de latir en la misma colonia que explota.\n\n§YDesarrollo – Mako§!\n§YDesarrollo auxiliar – Pencildude§!"
  BEL_guide: "Objetivos\n\n£white_dot. Calmar el caos colonial.\n£white_dot. Industrializar la colonia y prepararse contra los invasores de otro mundo.\n£white_dot. Restaurar la autoridad real y demostrar la verdadera talla del monarca.\n£white_dot. A cualquier precio, recuperar el territorio belga de manos de los invasores."
 
 BEL_Leopold_III_desc: "Leopoldo III asumió una enorme responsabilidad. Poco después de la muerte repentina de su padre y su ascenso al trono, invasores de otro mundo arrasaron Bélgica y el rey, junto con su gabinete, tuvo que exiliarse al Congo. Sueña con regresar algún día a la metrópoli.\n\nPero el joven monarca no ha logrado convertirse en el eje de la nación. En la colonia congoleña los belgas exiliados no lo reciben con júbilo. A diferencia de la poderosa Francia, Bélgica era un modesto estado de las tierras bajas y no abundan los colonos leales. En medio de una situación insoportable, la popularidad de Leopoldo se desploma.\n\nEl reino exiliado sufre enfermedades, los rebeldes nativos hostigan y sus fuerzas armadas apenas respiran. ¿Podrá este monarca inexperto superar todos los obstáculos y alzarse como héroe de Bélgica?"
  
# Decisiones
  BEL_industrialize: "Industrialización belga"
  BEL_industrialize_desc: "La invasión extraterrena obliga a Bélgica a acelerar su industrialización mediante nuevos planes y políticas que superen la crisis."
  BEL_industrialize_leopoldvile: "Industrializar Leopoldville"
  BEL_colony_coreing: "Restaurar las colonias belgas"
  BEL_colony_coreing_desc: "La invasión y una guerra civil han devastado las colonias. Bélgica debe estabilizarlas y explotar sus recursos con un nuevo plan."
  BEL_colony_coring: "Reconstruir la colonia [FROM.GetName]"
  BEL_colony_civil_war: "Guerra civil colonial belga"
  BEL_colony_civil_war_desc: "Las colonias belgas arden en una guerra civil. Es preciso restaurar el orden y aprovechar sus recursos."
  BEL_powerful_suppress: "Represión enérgica"
  BEL_powerful_suppress_desc: "Frente a la invasión, Bélgica debe incrementar la represión dentro de la colonia."
  BEL_occupation_stabilization: "Estabilizar territorios ocupados"
  BEL_occupation_stabilization_desc: "La guerra y la revuelta colonial exigen que Bélgica restablezca la calma en las zonas ocupadas."
  BEL_imperialism: "Fomentar el imperialismo"
  BEL_imperialism_desc: "Recordar la antigua gloria motivará a los súbditos y permitirá explotar los recursos coloniales en medio del caos."
  BEL_using_civil_war_decision: "Aplicando política de guerra civil colonial"
  # Eventos de recuperación
  BEL_recov_events.1.t: "Movilización de emergencia belga"
  BEL_recov_events.1.desc: "La invasión obliga a Bélgica a pasar a economía de guerra. El rey Leopoldo III insta a todos los colonos a unirse contra los invasores, aunque la victoria aún parece lejana."
  BEL_recov_events.1.a: "No hay alternativa"
  BEL_recov_events.2.t: "Discurso de Leopoldo III"
  BEL_recov_events.2.desc: "Con determinación, Leopoldo III sube al estrado en Leopoldville. Sin escapatoria, debe cumplir con su deber de monarca. Vestido con sobriedad, se dispone a hablar.\n\n\"Ciudadanos del Reino de Bélgica, pueblos de Flandes y Valonia, escúchenme.\n\nRecordarán nuestra patria: los prados, las nubes, las ciudades donde vivíamos. Miren ahora: las extrañas invasoras nos arrebataron el hogar y devastaron nuestras urbes.\n\nBruselas, Amberes, Lieja, Charleroi… abandonamos todo y huimos aquí.\n\nComo vuestro rey os lo digo: hemos caído ante enemigos poderosos. Dios nos ha impuesto una prueba aún mayor que en 1914.\n\nSiempre luchamos por la libertad: contra Holanda por la independencia, contra el Imperio alemán. Tomemos de nuevo nuestras manos y unámonos.\n\nPor la libertad, la ley y Bélgica: blandan armas, herramientas o azadones. Es la súplica de un belga y la orden de vuestro rey. La unidad forja la fuerza y nuestra amapola roja volverá a florecer en suelo belga.\n\nPor el rey, la ley y la libertad.\""
  BEL_recov_events.2.a: "¡Viva Bélgica! ¡Viva el rey!"
  BEL_recov_events.3.t: "¡Restauración colonial!"
  BEL_recov_events.3.desc: "Tras una larga lucha hemos recuperado la colonia. Las banderas belgas ondean y la gente celebra. Nos volcaremos en sanar las heridas y reconstruir la nación. ¡Bélgica por siempre!"
  BEL_recov_events.3.a: "¡Por fin!"
  BEL_recov_events.4.t: "Restauración del honor"
  BEL_recov_events.4.desc: "Hemos reconquistado la metrópoli. Bajo la dirección real luchamos con valentía y limpiamos la vergüenza del exilio. Bélgica vuelve a erguirse y, junto a sus aliados, defenderá la libertad y la paz. ¡La gloria belga será eterna!"
  BEL_recov_events.4.a: "¡Bélgica por siempre!"
  BEL_recov_events.5.t: "Traslado de la capital"
  BEL_recov_events.5.desc: "Al recuperar Bélgica descubrimos que Bruselas ha desaparecido, sustituida por la escuela Cronos. Debemos elegir una nueva capital entre Flandes y Valonia. Esta decisión marcará el futuro del país."
  BEL_recov_events.5.a: "Gante"
  BEL_recov_events.5.b: "Charleroi"


 # 중점
BEL_start_the_state_of_emergency: "Declarar estado de emergencia"
BEL_start_the_state_of_emergency_desc: "Los rebeldes locales campan a sus anchas; debemos conducir al ejército y asegurar el control de Leopoldville antes de que sea demasiado tarde, o para Bélgica solo quedará la muerte."
  BEL_enhance_the_national_security_law: "Reforzar la Ley de Seguridad Nacional"
  BEL_enhance_the_national_security_law_desc: "Por mucho que lo adornemos, el Congo es un caos; hasta regresar a la metrópoli debemos controlar a colonos y metropolitanos por igual."
  BEL_greater_federalism: "Desarrollo de África"
  BEL_greater_federalism_desc: "El Congo es nuestra base para recuperar la patria; debemos industrializar esta selva remota y convertirla en motor de la reconquista."
  BEL_continue_centralization: "Atraer inversores metropolitanos"
  BEL_continue_centralization_desc: "Hemos contactado con los resistentes en la metrópoli; los empresarios belgas prometen invertir su capital para recuperar el país."
  BEL_recolonize: "Recolonización"
  BEL_recolonize_desc: "Los nativos ansían “libertad” y se rebelan; ha llegado la hora de recordarles quién manda en el Congo."
  BEL_vassouras_line: "Ampliar fábricas militares"
  BEL_vassouras_line_desc: "Sin armas los soldados no pueden luchar; construiremos fábricas militares para armar a nuestras tropas."
  BEL_petropolis_line: "Ampliar fábricas civiles"
  BEL_petropolis_line_desc: "Arrasaremos la jungla de Leopoldville y levantaremos fábricas que preparen la reconquista."
  BEL_restore_the_coffee_barons: "Agricultura del Congo"
  BEL_restore_the_coffee_barons_desc: "El café y el caucho congoleños mantienen a flote a la Bélgica en el exilio; potenciar esta ventaja garantizará el bienestar real y la expansión del ejército."
  BEL_constitutional_monarchy: "Restaurar la monarquía"
  BEL_constitutional_monarchy_desc: "Por incompetente que sea, Leopoldo III sigue siendo rey; la Corona es nuestro símbolo y sostén espiritual."
