 SHA_principle_of_national_self-determination_1_desc: "Debemos liberar a los alemanes del Sudetenland."
 SHA_principle_of_national_self-determination_2: "Establecer repúblicas autónomas de consejos"
 SHA_principle_of_national_self-determination_2_desc: "Estableceremos repúblicas autónomas de consejos para gobernar de forma autónoma nuestros territorios ocupados no alemanes."
 SHA_principle_of_national_self-determination_3: "Principio de consejos"
 SHA_principle_of_national_self-determination_3_desc: "Varios consejos obreros de pequeña escala administrarán las repúblicas autónomas de consejos."
 SHA_principle_of_national_self-determination_4: "Centralismo democrático"
 SHA_principle_of_national_self-determination_4_desc: "Las repúblicas autónomas de consejos serán gobernadas por un único partido de vanguardia."
 SHA_principle_of_national_self-determination_4_tt: "§YConsejo autónomo§! se convierte en el líder."
 SHA_principle_of_national_self-determination_5: "Zona de la Gran Austria"
 SHA_principle_of_national_self-determination_5_desc: "Debemos recuperar la zona de la Gran Austria y proclamar una república socialista unificada e inquebrantable en la región."

