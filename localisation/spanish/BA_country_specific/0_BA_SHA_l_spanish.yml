 SHA_coup_of_Black_Tortoise_Promenade: "Se agota la paciencia de la Black Tortoise Promenade"
 SHA_coup_of_Black_Tortoise_Promenade_desc: "\n\n£GFX_SHA_Rumi_cat\n\n\n\n\nLa Black Tortoise Promenade es una organización de carácter abierto y está políticamente estrechamente vinculada a los reformistas de la Puerta del Dragón Negro. Esa apertura ha provocado conflictos constantes con los conservadores que valoran las tradiciones de Shanhaijing. Sin embargo, desde que el Club de Ópera de Pekín ha iniciado una revolución en nombre de la preservación de la tradición, el choque con la Black Tortoise Promenade ha dejado de ser algo evitable."
 SHA_BTP_revolt_mission: "Rebelión de la Black Tortoise Promenade"

 SHA_Eastern_Alchemy_Society_cat: "Laboratorio de Alquimia Oriental"
 SHA_Eastern_Alchemy_Society_cat_desc: "\n\n£GFX_SHA_Saya_cat\n\n\n\n\nEl Laboratorio de Alquimia Oriental, actualmente dirigido por Yakushi Saya, es —como su nombre indica— un club que investiga la alquimia. Solo por el nombre podría confundirse con un grupo de pseudociencia, pero la realidad es distinta: el laboratorio posee instalaciones repletas de equipos de vanguardia, entre los más avanzados incluso en Kivotos, y con ellos mantiene una actividad de investigación muy intensa.\n\nEl objetivo final del laboratorio es crear un elixir de inmortalidad. Por supuesto, todas sus integrantes saben bien que, de forma realista, un elixir así es imposible. Sin embargo, se trata de una meta deliberadamente elevada: avanzar hacia un objetivo difícil para obtener, en el proceso, nuevos descubrimientos y resultados innovadores."
 SHA_EAS_Budget_passed: "Presupuesto aprobado"
 SHA_EAS_Budget_cuts: "Recortes presupuestarios"
 SHA_remove_EAS_tooltip: "$SHA_Eastern_Alchemy_Society_cat$"
