 If_you_dont_write_here_I_ll_kill_you: "¡Necesita redacción!"
 SHA_GATHERING_STORM_DESC: "La Academia Superior Shanhaijing, una escuela de tradición y gastronomía en las afueras de Kivotos, solía operar establemente basada en su próspera industria turística y los distritos comerciales de la Asociación Tortuga Negra.\n\nTras calmarse el polvo del Incidente Kivotos, en los antiguos territorios austriacos emergió Shanhaijing, gobernada por la Puerta del Dragón. Pero su aparición también trajo nuevas amenazas al liderazgo de su directora, Ryuuge Kisaki.\n\nAhora Shanhaijing enfrenta amenazas externas: los conflictos resurgentes de Kivotos en el norte y la agresiva Italia en el sur. Sin olvidar las inestabilidades internas que no pueden ignorarse."

 SHA_country_intro_header: "Academia de Tradición y Gastronomía [SHA.GetName]"
 SHA_country_intro_content: "La antigua Academia Superior Shanhaijing, ubicada en las periferias de Kivotos, era una hermosa escuela con una cultura única que la distinguía de otras. Florecía gracias al turismo de la Asociación Tortuga Negra y su avanzado desarrollo.\n\nLas luchas internas de poder son tan intensas que uno se pregunta cómo Shanhaijing sigue funcionando. La caída del anterior director y el ascenso de Ryuuge Kisaki conmocionó tanto a radicales como conservadores de la Puerta del Dragón. Tras su nombramiento, la facción Kisaki y los moderados crecieron rápidamente, intensificando la lucha por el poder con radicales y conservadores por el liderazgo de la Puerta del Dragón.\n\nPero estas disputas no se limitan a la Puerta del Dragón. La Asociación Tortuga Negra, segunda fuerza más poderosa, pionera en turismo y gastronomía con frecuentes contactos externos, aboga naturalmente por reformas, generando tensiones con los valores conservadores de Shanhaijing.\n\n§YDesarrollado por: jindoi§!"

