 # 오스트리아 유화 정책
 SHA_Austrian_appeasement_policy: "오스트리아 유화 정책"
 SHA_Austrian_appeasement_policy_desc: "오스트리아인들은 본래 오스트리아 땅의 주인들이었습니다. 그러나 우리가 이들에게 영토를 양보하기에는 현실적으로 불가능한 상황입니다. 따라서 강경책 대신 유화책을 통해 이들을 체제에 복속시키는 것이 가장 현명한 선택일 것입니다."
 SHA_gathering_of_radicals: "급진파 결집"
 SHA_gathering_of_radicals_desc: "현룡문의 문주는 오스트리아 유화 정책을 펼치며 산해경의 전통을 무시하는 행동을 보였습니다. 이는 명백히 산해경의 전통을 깨부수고 새로운 위협에 산해경을 노출 시키는 행위일 것입니다. 사랑하는 학원을 지킬려면 $SHA_KISAKI$를 권좌에서 몰아내야합니다!"
 SHA_Cooperation_with_Kaguya: "경극부에 접근"
 SHA_Cooperation_with_Kaguya_desc: "경극부는 현재 산해경에서 가장 충성스러운 집단으로 평가받아도 손색이 없을 것입니다. 하지만 이들의 충언을 무시하며 독단적인 행보를 이어가는 현 문주를 끌어내리기 위해서는 경극부와의 협력이 필수적일 것입니다."
 SHA_podium_room_cooperation: "연단방에 접근"
 SHA_podium_room_cooperation_desc: "연단방에는 신타니 카이를 추종하는 일부 급진파들이 모여있다는 소문이 돌고 있습니다. 만약 이들과 접촉하는데 성공한다면 추후의 현 문주를 권좌에서 끌어내릴때 크나큰 도움이 될 것입니다."
 SHA_Kisaki_Suppression: "키사키 억제"
 SHA_Kisaki_Suppression_desc: "때가 되었습니다! 현 문주의 우둔함을 폭로하기 위한 경극이 준비되었습니다. 경극부와 현룡문 내 일부 급진파와 협력하여, 경극 상연의 순간을 기회로 삼아 현 문주를 퇴진시키고 $SHA_KAGUYA$를 새로운 문주로 추대할 것입니다."
 # 신타니 카이 루트
 SHA_Austrian_appeasement_policy: "Política de apaciguamiento austriaco"
 SHA_Austrian_appeasement_policy_desc: "Los austriacos fueron originalmente los dueños de estas tierras. Sin embargo, es prácticamente imposible para nosotros devolverles el territorio. Por lo tanto, la opción más sabia sería someterlos al sistema mediante políticas conciliadoras en lugar de medidas duras."
 SHA_gathering_of_radicals: "Concentración de radicales"
 SHA_gathering_of_radicals_desc: "El líder de la Puerta del Dragón, al implementar políticas conciliadoras con Austria, ha ignorado las tradiciones de Shanhaijing. Esto claramente destruye nuestras tradiciones y expone a Shanhaijing a nuevas amenazas. ¡Para proteger nuestra amada academia, debemos derrocar a $SHA_KISAKI$ del poder!"
 SHA_Cooperation_with_Kaguya: "Acercamiento a la Compañía de Ópera Peking"
 SHA_Cooperation_with_Kaguya_desc: "La Compañía de Ópera Peking es considerada posiblemente el grupo más leal en Shanhaijing. Sin embargo, para derrocar al actual líder que ignora sus consejos y actúa unilateralmente, la cooperación con ellos es esencial."
 SHA_podium_room_cooperation: "Acercamiento a la Sociedad Alquímica"
 SHA_podium_room_cooperation_desc: "Corren rumores de que algunos radicales seguidores de Shintani Kai se reúnen en la Sociedad Alquímica. Si logramos contactarlos, podrían ser de gran ayuda para derrocar al actual líder."
 SHA_Kisaki_Suppression: "Supresión de Kisaki"
 SHA_Kisaki_Suppression_desc: "¡Ha llegado el momento! Se ha preparado una ópera Peking para exponer la estupidez del líder actual. Cooperando con la Compañía de Ópera Peking y algunos radicales de la Puerta del Dragón, usaremos la presentación como oportunidad para deponer al líder y coronar a $SHA_KAGUYA$ como nuevo líder."

# Ruta Shintani Kai
 SHA_Shintani_Kai_Follow: "Rehabilitación de Shintani Kai"
 SHA_Shintani_Kai_Follow_desc: "Aunque Shintani Kai fue una problemática que causó varios disturbios en Shanhaijing, fue expulsada injustamente sin debido proceso por los actos tiránicos de $SHA_KISAKI$. Ahora la traeremos de vuelta."
 SHA_Kaguya_ousted: "Expulsión de $SHA_KAGUYA$"
 SHA_Kaguya_ousted_desc: "Con el poder de la Compañía de Ópera Peking, logramos derrocar a $SHA_KISAKI$. Pero ahora la Compañía de Ópera Peking no es más que un lastre inútil. Colaborando con la Sociedad Alquímica, atacaremos a la Compañía de Ópera Peking para derrocar a $SHA_KAGUYA$ del liderazgo y tomar el control de la Puerta del Dragón."
 SHA_Shanhaijing_fascism: "Fascismo de Shanhaijing"
 SHA_Shanhaijing_fascism_desc: ""
 SHA_Eastern_Alchemy_Society_solidarity: "Solidaridad con la Sociedad Alquímica Oriental"
 SHA_Eastern_Alchemy_Society_solidarity_desc: ""
 SHA_consolidate_industries: "Consolidación industrial austriaca"
 SHA_consolidate_industries_desc: ""
 SHA_Sundan_dosage: "Aceleración del desarrollo de Sundan"
 SHA_Sundan_dosage_desc: "Para cumplir con el propósito y razón de ser de Shanhaijing, y para la ambición de Shintani Kai, debemos acelerar el desarrollo de Sundan."
 SHA_Expansion_of_military_factories: "Expansión de fábricas militares"
 SHA_Expansion_of_military_factories_desc: ""
 SHA_podium_room_expansion: "Expansión de la Sociedad Alquímica"
 SHA_podium_room_expansion_desc: "Será beneficioso expandirla."
 SHA_cult_of_personality: "Culto a la personalidad"
 SHA_cult_of_personality_desc: ""
 SHA_great_commander: "Gran Comandante"
 SHA_architect_of_fascism: "Arquitecto del fascismo"
 SHA_Seonin: "\"Inmortal\""

 SHA_ascension: "Ascensión"
 SHA_ascension_desc: ""
 SHA_Alchemy_and_modern_science: "Alquimia y ciencia moderna"
 SHA_Alchemy_and_modern_science_desc: ""
 SHA_supremacy_of_will: "Supremacía de la voluntad"
 SHA_supremacy_of_technology: "Supremacía de la tecnología"
 SHA_Twilight_of_the_Gods: "Crepúsculo de los Dioses"
 SHA_Twilight_of_the_Gods_desc: "Mientras las llamas arden ferozmente, el Rin barre el crematorio. Entonces, tres doncellas del Rin aparecen cerca de las brasas. Cuando Hagen ve que buscan el anillo, se desarma y salta a las aguas crecidas. Pero dos doncellas lo arrastran a las profundidades, mientras la tercera encuentra el anillo y se regocija. El cielo se tiñe de rojo mientras gradualmente aparece el salón de Valhalla. Los dioses y héroes sentados en Valhalla son envueltos por enormes llamas, y el fuego lo consume todo mientras cae el telón."
 SHA_Ragnarok: "Ragnarök"
 SHA_Ragnarok_desc: "El lobo negro devora el cielo, el veneno de serpiente tiñe el mar.\nEl cuerno resuena, la guerra comienza, los dioses marchan hacia su destino.\n\nEl caballo de fuego galopa por la tierra, el gigante derriba al sol.\nMas cuando las llamas todo consuman, un nuevo mundo volverá a brotar."

 # 보수 혁명 루트
 SHA_conservative_revolution: "Revolución Conservadora"
 SHA_conservative_revolution_tt: "Convierte el actual §Yapoyo al fascismo§! en §Yapoyo al no-alineamiento§!."
 SHA_conservative_revolution_desc: "Durante años, Shanhaijing ha carecido de un verdadero líder conservador, y considerando el breve mandato del anterior líder, este vacío decadente se ha extendido por décadas. Esta hipocresía debe terminar. Debemos reorganizar Shanhaijing según los ideales de los verdaderos patriotas a través de una gran Revolución Conservadora."
 SHA_new_shanhaijing_conservatism: "Nuevo Conservadurismo de Shanhaijing"
 SHA_new_shanhaijing_conservatism_desc: "Durante años, el conservadurismo de Shanhaijing ha sido corrompido y mancillado, reducido a una herramienta de políticos. Ahora debemos recuperar su pureza ideológica para restaurar el verdadero conservadurismo. Es hora de redefinir la esencia del conservadurismo de Shanhaijing y restablecer sus valores."
 SHA_Expansion_of_cooperation_with_other_clubs: "Expansión de la cooperación con otros clubs"
 SHA_Expansion_of_cooperation_with_other_clubs_desc: "Dejando de lado las diferencias ideológicas temporalmente, debemos cooperar. Los enemigos nos rodean por todas partes, con la fuerza para abatirnos como una violenta tormenta. Por eso debemos unirnos para proteger la llama del conservadurismo de Shanhaijing y mantenerla ardiendo hasta el final."
 SHA_Cabinet_Secretariat: "Consejo Privado de Shanhaijing"
 SHA_Cabinet_Secretariat_desc: "El actual líder debe mantenerse como símbolo del conservadurismo de Shanhaijing y de la unidad del pueblo y los estudiantes. Sin embargo, para asesorar las políticas del líder y facilitar la comunicación entre la Puerta del Dragón y el gobierno, estableceremos un nuevo Consejo Privado. Este organismo estará compuesto exclusivamente por conservadores patriotas y virtuosos, que servirán lealmente para el futuro de Shanhaijing."
 SHA_organic_national_polity: "Política Nacional Orgánica"
 SHA_organic_national_polity_desc: "El enfoque liberal de Kivotos en el norte no es adecuado para la sociedad de Shanhaijing. No debemos seguir el corrupto electoralismo, sino avanzar hacia la realización de los ideales de la Compañía de Ópera Peking y los teóricos conservadores de Shanhaijing. Construir un autoritarismo meritocrático donde los capaces asciendan y lideren - una Política Nacional Orgánica - es nuestro camino."
 SHA_Democratic_Culture_Censorship: "Eliminación de la Cultura Democrática Anti-Kivotos"
 SHA_Democratic_Culture_Censorship_desc: "El título lo dice todo"
 SHA_New_Genryumon_Peking_Opera_Department_Relations: "Nuevas relaciones Puerta del Dragón - Compañía de Ópera Peking"
 SHA_New_Genryumon_Peking_Opera_Department_Relations_desc: ""
 SHA_Engine_of_conservative_revolution: "Motor de la Revolución Conservadora"
 SHA_Engine_of_conservative_revolution_desc: ""
 SHA_people_conservatism: "Promoción del Conservadurismo Popular"
 SHA_people_conservatism_desc: ""
 
 SHA_2nd_conservative_revolution: "Segunda Revolución Conservadora"
 SHA_2nd_conservative_revolution_desc: "Tras dos décadas de decadencia, al encontrar un verdadero líder conservador, hemos restablecido los valores de la gran Revolución Conservadora. Además, recuperamos el territorio arrebatado por Hyakki Yakō y completamos con éxito la revolución. Sin embargo, aún persisten vestigios de cultura decadente en la sociedad. Para erradicarlos completamente, debemos iniciar la Segunda Revolución Conservadora. Este será un paso crucial para materializar plenamente los ideales de los patriotas."
 SHA_eradication_of_liberalism: "Erradicación del Liberalismo"
 SHA_eradication_of_liberalism_desc: ""
 SHA_Resurrection_of_the_Soul_of_Shanhaijing: "Resurrección del Alma de Shanhaijing"
 SHA_Resurrection_of_the_Soul_of_Shanhaijing_desc: ""
 SHA_Establishment_of_the_National_Council: "Establecimiento del Consejo Académico"
 SHA_Establishment_of_the_National_Council_desc: ""
 SHA_Kivotos_conservative: "Propagación de la Revolución Conservadora"
 SHA_Kivotos_conservative_desc: "El liberalismo y socialismo de Kivotos son tumores repugnantes que fomentan conspiraciones anti-Shanhaijing. Se han extendido por todo Kivotos y su mera existencia representa una amenaza clara. Por ello, debemos difundir nuestra revolución más ampliamente para realizar verdaderos valores conservadores y devolver a Kivotos al camino correcto."
 SHA_clash_of_civilizations: "Choque de Civilizaciones"
 SHA_clash_of_civilizations_desc: "¡Al comenzar el gran choque, los estudiantes de Shanhaijing se han unido voluntariamente a esta corriente monumental! Bajo el estandarte de la gran Revolución Conservadora, debemos unirnos para salvar al mundo de los tumores malignos del liberalismo y socialismo. ¡Esta no es una mera confrontación política, sino una lucha decisiva que determinará el futuro de la civilización!"
 
# Común
 SHA_strike_suppression: "Supresión de huelgas"
 SHA_strike_suppression_desc: "Inmediatamente después del Gran Incidente, Shanhaijing adoptó políticas aislacionistas aún más estrictas, lo que provocó el descontento de la Asociación de Comerciantes. Finalmente, en diciembre, iniciaron una huelga general exigiendo reformas y apertura en oposición a las políticas de la Puerta del Dragón. Sin embargo, debemos hacerles entender claramente que tales acciones solo empeoran la situación de Shanhaijing, y si es necesario, suprimirlas por la fuerza."
 SHA_Sack_of_Rumi: "Contención de Rumi"
 SHA_Sack_of_Rumi_desc: "Akeshiro Rumi ha sido identificada como una de las instigadoras de la huelga general de diciembre. Al contener a Rumi mientras imponemos sanciones severas a la Asociación Tortuga Negra, protegeremos las tradiciones de Shanhaijing y consolidaremos aún más nuestros valores conservadores."

# Armonía local (Comunista, Demócrata)
 SHA_local_harmony: "Armonía local"
 SHA_local_harmony_desc: ""

 SHA_appointment_of_BTP: "Designación de personal de la Asociación Tortuga Negra"
 SHA_appointment_of_BTP_desc: "El mundo está cambiando rápidamente, y la Asociación Tortuga Negra, responsable del comercio, se encuentra en el centro de este cambio. Es más probable que propongan reformas más progresistas que la 'conservadora' Puerta del Dragón. Si designamos masivamente figuras de la Asociación, podríamos encaminarnos hacia un desarrollo más avanzado."
 SHA_release_austrian_politician: "Liberación de políticos austriacos"
 SHA_release_austrian_politician_desc: "La implementación de nuevas políticas en Shanhaijing ha llevado a la amnistía de la mayoría de políticos de origen austriaco. Muchos de ellos se han adaptado al nuevo orden y esperan reingresar a la política."
 SHA_university_of_vienna: "Universidad de Viena"
 SHA_university_of_vienna_desc: ""
 SHA_formation_of_labor_union: "Formación de sindicatos"
 SHA_formation_of_labor_union_desc: ""
 SHA_womens_education_initiative: "Educación femenina"
 SHA_womens_education_initiative_desc: "En Shanhaijing, durante mucho tiempo se ha garantizado igualdad de oportunidades educativas para las mujeres. Pero en Austria la situación era diferente: las mujeres sufrían discriminación, resultando en una brecha educativa evidente."
 SHA_progressivism_through_science: "Progreso a través de la ciencia"
 SHA_progressivism_through_science_desc: ""
 SHA_fight_against_extremism: "Combatiendo el extremismo"
 SHA_fight_against_extremism_desc: "El extremismo siempre ha dañado a la sociedad. Promueven métodos radicales que no pueden tolerarse. Debemos confrontar activamente esta amenaza."
 SHA_strengthening_parliamentarism: "Fortalecimiento del parlamentarismo"
 SHA_strengthening_parliamentarism_desc: "Aunque el sistema centrado en la Puerta del Dragón y su Líder parece perfecto superficialmente, tiene limitaciones estructurales donde el poder excesivo del Líder garantiza un gobierno prolongado. Debemos fortalecer la Puerta del Dragón para crear contrapesos al poder del Líder."
 SHA_a_new_constitution: "Redacción de la Constitución de Shanhaijing"
 SHA_a_new_constitution_flag: "§Y$SHA_strengthening_parliamentarism$§! completado"
 SHA_str_par_focus_days_tt: "Días actuales: [?SHA_a_new_constitution_flag:days|Y0]"
 SHA_defensive_democracy: "Democracia defensiva"
 SHA_defensive_democracy_desc: "La democratización de Shanhaijing será uno de los logros más grandes en siglos. Esta democracia no puede perderse ni dañarse fácilmente. Así como no podemos permitir libertades a los enemigos de la libertad, debemos actuar para evitar que la democracia se autodestruya desde dentro."
 SHA_transplanting_capitalist_system: "Apertura de mercados"
 SHA_transplanting_capitalist_system_desc: "La economía de Shanhaijing ha operado bajo un sistema planificado dirigido por expertos de la Puerta del Dragón, con apertura de mercados extremadamente limitada. Sin embargo, el éxito comercial de la Asociación Tortuga Negra es notable, permitiendo a los estudiantes experimentar las ventajas del libre mercado. Ahora debemos expandir estos cambios a nivel nacional para garantizar más libertades económicas."
 SHA_transplanting_capitalist_system_tt: "El enfoque se bloqueará tras $SHA_establish_the_SEZ$."
 SHA_transplanting_capitalist_system_2_tt: "Si §Ycompletas el enfoque§!, §Rpierdes sus efectos§!."
 SHA_democracy_education: "Educación democrática"
 SHA_democracy_education_desc: "La base de la democracia está en todos los ciudadanos de Shanhaijing. Pero tras años de gobierno autoritario del Líder, hay apatía política. De no actuar, esta democracia podría colapsar por la indiferencia pública."
 SHA_hold_elections: "Celebración de elecciones"
 SHA_hold_elections_desc: "Con la estabilidad alcanzada y la constitución redactada, es tiempo de celebrar las primeras elecciones libres según lo establecido. Los candidatos están listos para liderar Shanhaijing; ahora el pueblo decidirá."
 SHA_a_responsible_government: "Un presidente responsable"
 SHA_guided_democracy: "Ex Líder, actual presidente"

 SHA_communist_branch: "Adoptar el austromarxismo"
 SHA_communist_branch_desc: "$AUS_austromarxism_focus_desc$"
 SHA_communism_focus_1: "'Viena Roja'"
 SHA_communism_focus_1_desc: "Con el colapso del Imperio, Viena sufrió pobreza extrema, crisis de vivienda, desempleo, inflación. La 'Viena Roja' se refiere a una serie de políticas progresistas implementadas entre 1919 y 1934, cuando el Partido Socialdemócrata gobernó la ciudad para enfrentar estos problemas. Aunque la 'Viena Roja' terminó cuando la derecha tomó el poder tras el levantamiento de febrero de 1934, sigue siendo un modelo de vivienda pública, la base del bienestar urbano y un arquetipo de la política municipal progresista."
 SHA_red_wien: "'Viena Roja'"
 SHA_Naukograd: "Naukogrado"
 SHA_Naukograd_desc: "Naukogrado significa 'ciudad científica' y es un nombre para referirse a ciudades con alta concentración de instalaciones de I+D."
 SHA_communism_focus_2: "Milicias de izquierda"
 SHA_communism_focus_2_tt: "Cuando comience la §Yguerra civil§!, recibiremos §Ydivisiones de milicia§!. Si estamos §Yen guerra civil§! o si la §Yguerra civil§! ya terminó, las recibiremos de inmediato."
 SHA_communism_focus_2_desc: "Para prepararnos ante una guerra civil, organizaremos milicias que apoyen nuestra causa."
 SHA_communism_focus_3: "Reanudar el movimiento de soviets"
 SHA_communism_focus_3_desc: "El movimiento de soviets fue un movimiento revolucionario obrero que se extendió por toda Europa tras la guerra. Al reanudarlo, volveremos a encender la llama revolucionaria de la clase trabajadora."
 SHA_communism_focus_4: "Corporativismo populista"
 SHA_communism_focus_5: "Giro a la izquierda de la Black Tortoise Promenade"
 SHA_communism_focus_6: "'Teoría de la huelga de masas'"
 SHA_communism_focus_6_desc: "¡La huelga general es nuestro puño!"
 SHA_communism_focus_7: "Venganza por el 34"
 SHA_communism_focus_7_desc: "En febrero de 1934, la última antorcha para defender la república austriaca socialdemócrata fue pisoteada sin piedad por las fuerzas contrarrevolucionarias. ¡Ahora el mango del cuchillo lo tenemos nosotros!"
 SHA_communism_focus_8: "Shanhaijing socialista"
 SHA_communism_focus_8_desc: ""
 SHA_communism_focus_9: "Bloque internacionalista"
 SHA_communism_focus_9_desc: "Debemos solidarizarnos con los camaradas socialistas del extranjero."
 SHA_communism_focus_10: "Vínculo industrial Shanhaijing-URSS"
 SHA_communism_focus_10_desc: ""
 SHA_communism_focus_11: "Complejo de investigación soviético"
 SHA_communism_focus_11_desc: ""
 SHA_communism_focus_12: "Amenazas en los alrededores"
 SHA_communism_focus_12_desc: "A nuestro alrededor abundan fuerzas contrarrevolucionarias dispuestas a derribar al recién nacido [SHA.GetAdjective] socialista. No podemos prescindir de una defensa nacional autónoma."
