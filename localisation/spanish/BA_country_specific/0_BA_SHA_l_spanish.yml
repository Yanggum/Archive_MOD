 # 이벤트
 shacom.1.t: "Ostromarxismo"
 shacom.1.d: "Tras el Levantamiento de Febrero de 1934, las fuerzas de izquierda en suelo austríaco quedaron aniquiladas. Bajo el régimen fascista, las clases obrera, campesina e intelectual gemían, y la llama de la democracia se apagó en un instante. Sin embargo, la Gran Traslación golpeó a Austria y la situación cambió. Con la feroz ofensiva de Shanhaijing, la cúpula austríaca sufrió un golpe irreparable, y eso se convirtió en una nueva oportunidad para la izquierda local. En el ámbito civil, las organizaciones de izquierda luchan por recuperar la influencia previa a 1934, y el vínculo con el ala izquierda de la Black Tortoise Promenade será de gran ayuda."
 shacom.1.a: "¡Recibe el viento del cambio!"
 shacom.2.t: "Viena Roja"
 shacom.2.d: "Durante todo el período de entreguerras, Viena sostuvo una autonomía bajo partidos de izquierda. Allí se probaron e implementaron políticas de asistencia pública a gran escala, que terminaron asentándose y mejorando la vida cotidiana de los ciudadanos. Pero tras la llegada de los fascistas al poder, todo eso se desvaneció. Hoy, los trabajadores de Viena apoyan al ala izquierda de la Black Tortoise Promenade. Organizarlos y afianzar una base en Viena será de gran ayuda para la revolución venidera."
 shacom.2.a: "¡Preparémonos para el levantamiento!"
 shacom.3.t: "Choque en la plaza central"
 shacom.3.d: "El día 4 del mes pasado, miles de ciudadanos se reunieron en la plaza del Distrito Especial Central para celebrar una concentración, oponiéndose al gobierno feudal de la Puerta del Dragón Negro y exigiendo el retorno de la república. Tras emitir la orden de disolución, el aparato ejecutor de la Puerta del Dragón Negro abrió fuego contra ellos, y como resultado decenas de civiles resultaron heridos. La protesta fue desmantelada, pero los ciudadanos recuerdan con claridad los disparos de aquel día 4."
 shacom.3.a: "¡Resiste a la opresión!"
 shacom.4.t: "Movimiento de soviets"
 shacom.4.d: "De 1918 a 1920, en diversos países de Europa se intentaron múltiples transformaciones sociopolíticas a través de soviets formados espontáneamente por obreros, campesinos y soldados. Aunque todos esos intentos en Alemania, Hungría y Austria fueron frustrados, nosotros heredaremos su legado. ¡El gobernante de la clase trabajadora es la propia clase trabajadora!"
 shacom.4.a: "¡Hacia la república soviética!"
 shacom.5.t: "La nueva líder de la Alianza de Sindicatos Libres"
 shacom.5.d: "Akashiro Rumi, debido a su carácter indeciso, no logró reflejar la voluntad general radical de los afiliados. ¡Debemos elegir una nueva líder adecuada para encabezar la organización como sindicato rojo!"
 shacom.5.a: "¡Kayama Reijo!"
 shacom.5.b: "¡Otto Bauer!"
 shacom.5.c: "¿Yakushi Saya...?"
 shacom.6.t: "Lucha ideológica"
 shacom.6.d: "Con la reconstitución de sindicatos que habían sido debilitados o aniquilados, la lucha ideológica entre ellos también ha vuelto a emerger. El sindicato rojo, que sirve a la ideología de izquierda que inició el movimiento sindical en estas tierras, reclama facultades sindicales mucho más amplias; pero el sindicato católico, que apoya la cooperación con el gobierno y unas atribuciones limitadas, se opone a ello."
 shacom.6.a: "Apoyemos al sindicato rojo."
 shacom.6.b: "Apoyemos al sindicato católico."
 shacom.7.t: "El destino de la Puerta del Dragón Negro"
 shacom.7.d: "La Puerta del Dragón Negro, que funcionaba como órgano de gobierno —es decir, consejo estudiantil— de la Escuela Secundaria Superior de Shanhaijing, fue derribada por la Guardia Roja socialista, y el Consejo Supremo declaró su disolución. Sin embargo, respecto al trato que deben recibir sus directivos, se barajan dos posturas: encarcelarlos o reeducarlos mediante el trabajo."
 shacom.7.a: "Deben pagar por sus crímenes."
 shacom.7.b: "¡El trabajo es reeducación!"
 shacom.8.t: "Estética cultural proletaria"
 shacom.8.d: "Las formas culturales desarrolladas bajo el feudalismo y el capitalismo ya no son válidas bajo la Shanhaijing socialista. Ahora debemos promover activamente una estética 'socialista' basada en el realismo. El inicio será una reforma interna del Club de Ópera de Pekín."
 shacom.8.a: "¡Hacia el arte del pueblo!"
 shacom.9.t: "Cuidado público"
 shacom.9.d: "En los viejos regímenes, el cuidado infantil era una cultura que, de forma representativa, se descargaba sobre las mujeres. Pero está claro que una cultura tan retrógrada no puede ser aceptada en la nueva sociedad.\n\nPor ello, hemos decidido aprovechar la reconocida institución 'Meihua Garden' en todo Shanhaijing. La institución ampliada, el nuevo 'Meihua Garden Rojo', no será solo un servicio de crianza y cuidado infantil para los habitantes de Kivotos, sino una nueva forma de cuidado cuyo alcance se extenderá también a la humanidad.\n\nDesde su fundación, el Meihua Garden Rojo ha recibido el apoyo de innumerables madres austríacas. Con ello, podremos dar un paso más hacia la armonía con los locales y, al mismo tiempo, guiar a los niños —que serán la base de la nueva academia— hacia una 'forma de pensar deseable'."
 shacom.9.a: "Esto es una innovación."
 shacom.10.t: "¡El progreso es mi fuerza!"
 shacom.10.d: "Yakushi Saya ha decidido entrar en la política."
 shacom.10.a: "Una tecnócrata, eh."
 shacom.10_tt: "\n§YYakushi Saya§! puede §Gdesbloquearse§! como §Ylíder democrática§!.\n§YYakushi Saya§! puede §Gdesbloquearse§! como §Ylíder comunista§!."
 shacom.11.t: "Toma de Liechtenstein"
 shacom.11.d: "Liechtenstein era un principado soberano fronterizo con nosotros al oeste. Pero una ansiedad paranoica se extendió entre la Guardia Roja al verse en un cerco inestable, y por ello parte de sus divisiones marchó voluntariamente hacia Liechtenstein. La resistencia menor e insignificante fue suprimida con facilidad, y el duque y los altos sacerdotes huyeron al exilio. No obstante, por temor a la resistencia, se concedieron a los ciudadanos libertad de culto y una amplia autonomía; y salvo por el hecho de que la Guardia Roja quedará estacionada allí, vivirán una vida cotidiana prácticamente igual a la de antes."
 shacom.11.a: "Debemos impedir las acciones por cuenta propia."
 shacom.12.t: "El legado de Luxemburgo"
 shacom.12.d: "Rosa Luxemburg, revolucionaria alemana nacida en Polonia y teórica socialista, ya en 1906 escribió sobre la 'teoría de la huelga de masas', planteando cómo debe ser el camino hacia una república obrera. Si se dan ciertas condiciones previas, incluso trabajadores no organizados pueden participar en huelgas políticas de gran escala y ejercer una presión aterradora. ¡Iniciaremos huelgas simultáneas en Viena y otras grandes ciudades, detendremos la industria, paralizaremos la economía y forzaremos la derrota de los opresores!"
 shacom.12.a: "¡Que todos preparen los cócteles molotov!"
 shacom.13.t: "La huelga victoriosa"
 shacom.13.d: "Impulsadas por el fervor popular, numerosas estudiantes también se sumaron a nuestra causa, lo que permitió que organizaciones armadas pudieran, en cualquier momento, coludirse con las fuerzas huelguistas y dificultó que la Puerta del Dragón Negro recurriera a medios militares. La Puerta del Dragón Negro intentó negociar en repetidas ocasiones, pero no pudo atravesar la tesis intransigente de acero de los trabajadores. Finalmente, la Guardia Roja organizada asaltó la Puerta del Dragón Negro sin encontrar resistencia. Sus directivos, al presentir la derrota, huyeron al exilio o se rindieron. ¡La revolución ha triunfado!"
 shacom.13.a: "Esta es la fuerza de la huelga de masas."
 shacom.14.t: "El principio de la autodeterminación nacional"
 shacom.14.d: "Nuestra Shanhaijing, que proclama con orgullo el socialismo en Europa Central, debe combatir en solidaridad contra la opresión por naciones y pueblos, y contra el imperialismo. Al mismo tiempo, Austria funciona como un Estado-nación de los alemanes, lo que sugiere que poseemos un derecho territorial sobre otras regiones germanas de Europa Central. ¡Debemos recuperar nuestros territorios legítimos!"
 shacom.14.a: "¡Hacia la liberación nacional!"
 shacom.15.t: "La Segunda Internacional"
 shacom.15.d: "La Segunda Internacional fue una federación internacional de partidos socialistas fundada en 1889 y disuelta en 1916. Aunque la Tercera Internacional de los estalinistas sigue en pie, sus ideales socialistas difieren claramente de los nuestros. ¡Reconstruiremos la Segunda Internacional para practicar internacionalmente el 'socialismo de Shanhaijing' y hacer realidad los principios marxistas!"
 shacom.15.a: "Es un momento histórico."
 shacom.16.t: "Amenazas alrededor"
 shacom.16.d: "La llama revolucionaria que hemos encendido es peligrosamente frágil. No hay camaradas que apoyen nuestra revolución en ninguna dirección; al contrario, estamos rodeados de enemigos dispuestos a descargar el hacha contrarrevolucionaria sobre nuestras cabezas. Nuestros vecinos temen el camino que queremos seguir. De hecho, Hungría, con su régimen autoritario, o Italia, bajo un gobierno fascista, podrían invadirnos con el pretexto de reconstruir su 'Austria fascista'. Sea cual sea el caso, temen nuestro socialismo, y esto se materializará como una invasión simultánea, al estilo de la contrarrevolución de 1919 en el Este. ¡Debemos prepararnos! Debemos exprimir al máximo nuestras propias capacidades para frenar estas amenazas y liberar a la clase trabajadora oprimida de los países vecinos."
 shacom.16.a: "¡No hay tiempo!"
 shacom.16_tt: "¡Dentro de §Y720§! días, nuestros §tvecinos hostiles§! nos atacarán! Podemos retrasar su §Ymomento de ataque§! por diversos medios."
 shacom.17.t: "Terror rojo"
 shacom.17.d: "A nuestro lado se ha asentado el incómodo vecino [SHA.getname]. Están incitando huelgas y revoluciones en los países colindantes, y debemos hacer frente a este ataque. Cuando llegue el momento adecuado, podremos unir fuerzas con otros vecinos y someterlos preventivamente antes de que la amenaza de subversión estatal nos alcance."
 shacom.17.a: "¡El anticomunismo es firme!"
 shacom.18.t: "Ofensiva"
 shacom.18.d: "Ha llegado la hora. ¡Podemos lanzar una ofensiva contra [SHA.getname]!"
 shacom.18.a: "¡Avancen!"
 shacom.18.b: "Aún no."
 shacom.19.t: "Interferencia de los marxistas"
 shacom.19.d: "Debido a la concentración de marxistas en el país y a una sociedad civil que simpatiza con ellos, nos hemos visto obligados a cancelar el plan de ofensiva anticomunista."
 shacom.19.a: "Qué lástima."
 shacom.20.t: "Guerra revolucionaria"
 shacom.20.d: "Ha ocurrido lo que temíamos. Pero todo el pueblo de [SHA.getname] se alzará, como voluntad general, y resistirá la ofensiva contrarrevolucionaria."
 shacom.20.a: "¡Frenemos a la contrarrevolución!"
 shacom.21.t: "Dictadura del proletariado"
 shacom.21.d: "Tras la transición del sistema al socialismo, al decidir fortalecer la cooperación con los soviéticos, hemos concluido que es preferible adoptar la teoría revolucionaria de estilo soviético. Siguiendo el pensamiento de Lenin y Stalin, todo el sistema será reformado, y ciertas opiniones disidentes serán prohibidas temporalmente mediante el centralismo democrático."
 shacom.21.a: "\"Todo es una acción necesaria.\""
 shacom.22.t: "\"¡Gran Salto Adelante!\""
 shacom.22.d: "Para enfrentarnos a la multitud de enemigos que nos rodean, el Partido ha decidido adoptar como programa político de este año un 'Gran Salto Adelante' que imita el movimiento estajanovista soviético. ¡En pocos años nos convertiremos en una gran potencia imposible de ignorar en Europa y Kivotos! Por orden del Partido, los planes del Gran Salto se han extendido a todos los frentes y sectores: ¡en todas partes 'saltaremos alto'!"
 shacom.22.a: "¡Confiemos y sigamos al Partido y al camarada Secretario General!"
 shacom.23.t: "Gorriones"
 shacom.23.d: "Como de costumbre, [SHA.getleader] salió a inspeccionar los lugares de trabajo de las masas obreras. En esta visita, acudió al campo para revisar la situación agrícola derivada del Gran Salto Adelante en curso, y allí presenció una escena impactante: un pequeño pájaro estaba picoteando el grano. Los burócratas del Partido que también lo vieron propusieron expulsar a esas aves del campo, y [SHA.getleader] reflexionó profundamente sobre esa propuesta."
 shacom.23.a: "\"¡Son adorables, podemos dejarlos en paz!\""
 shacom.24.t: "Descubierta la ineficiencia de las comunas populares"
 shacom.24.d: "¡En el proceso de colectivización agrícola, que parecía avanzar con ingenua normalidad, ha quedado expuesta la ineficiencia de la burocracia! Se ha constatado una grave caída del entusiasmo laboral entre los campesinos durante la colectivización, y para resolver este problema tendremos que replantear el enfoque desde el principio."
 shacom.24.a: "¡Maldita sea!"
 shacom.25.t: "Estudiantes embelesadas con la Revolución Cultural"
 shacom.25.d: "La Revolución Cultural es la transición desde las formas culturales del superestructura capitalista y feudal —ideología, derecho, arte, etc.— hacia un nuevo sistema de vanguardia. Según la lógica del Partido, esto debe lograrse en el plano de la conciencia; por ello, las estudiantes fueron reeducadas y renacieron como fervientes guerreras de la revolución. Sin embargo, en el proceso, algunas estudiantes extremas clamaron por una disolución aún más radical de la autoridad y realizaron acciones de ultraizquierda temeraria. Con pequeños actos de vandalismo y terrorismo, dañaron el patrimonio cultural local y se convirtieron en un problema social; finalmente, el Palacio de Hofburg fue ocupado por ellas y comenzaron una sentada. La situación fue reprimida rápidamente, pero el Partido reconoció la necesidad de revisar la política."
 shacom.25.a: "Qué impetuosas."
 shacom.26.t: "Resultados del Gran Salto Adelante"
 shacom.26.d: "Ha llegado el momento previsto por el Partido. El Partido está realizando una evaluación del Gran Salto Adelante."
 shacom.26.a: "Todo es resultado de nuestras elecciones."
 shacom.26_tt_1: "§YGran Salto Adelante: Colectivización agrícola§! se ha §Gcompletado:§!\n"
 shacom.26_tt_2: "§YGran Salto Adelante: Colectivización agrícola§! §Rno se pudo completar:§!\n"
 shacom.26_tt_3: "\n§YGran Salto Adelante: Aceleración de la producción de armas§! se ha §Gcompletado:§!\n"
 shacom.26_tt_4: "\n§YGran Salto Adelante: Aceleración de la producción de armas§! §Rno se pudo completar:§!\n"
 shacom.26_tt_5: "\n§YGran Salto Adelante: Revolución Cultural§! se ha §Gcompletado:§!\n"
 shacom.26_tt_6: "\n§YGran Salto Adelante: Revolución Cultural§! §Rno se pudo completar:§!\n"
 shacom.26_tt_7: "\n§YGran Salto Adelante: Reforma militar§! se ha §Gcompletado:§!\n"
 shacom.26_tt_8: "\n§YGran Salto Adelante: Reforma militar§! §Rno se pudo completar:§!\n"
 shacom.26_tt_9: "\n§G¡Se han completado todos los programas del Gran Salto Adelante!§!\n"
 shacom.27.t: "Resistencia católica"
 shacom.27.d: "Las fuerzas católicas locales de Austria, que desde temprano recelaban de nuestra nueva línea para Shanhaijing, han decidido pasar a la acción. Apoyándose en la fuerte organización entre Iglesia y fieles, están formando, principalmente en el campo, asociaciones políticas que se oponen a nuestra causa."
 shacom.27.a: "¡Maldita sea!"
 shacom.28.t: "Aplastar la resistencia católica"
 shacom.28.d: "Durante el último período, hemos derrotado de forma visible la resistencia de la Iglesia católica, que era nuestra organización política opositora. ¡Ahora aplastaremos por completo a sus remanentes mediante medios legales y económicos, destruyendo toda posibilidad de resistencia!"
 shacom.28.a: "¡Lucha!"
 shacom.29.t: "Socialismo rural"
 shacom.29.d: "El problema del ostromarxismo tradicional —o de la socialdemocracia— es que no impulsó activamente la propaganda en el ámbito rural. Hasta ahora, los campesinos, ligados a las fuerzas católicas, eran vistos como enemigos de clase que frenaban el progreso social; pero desde ahora los incorporaremos de forma activa y organizaremos un movimiento campesino revolucionario."
 shacom.29.a: "Bien."


 shafas.1.t: "¡El golpe del Club de Ópera!"
 shafas.1.d: "\"¡En nombre de la tradición de Shanhaijing, condenamos a la líder del Xuanlong, $SHA_KISAKI$!\"\n\nEn el día destinado a la gran obra, cientos de espectadores y miembros del Club de Ópera se reunieron en la Plaza Baihu. Pero lo que se presentó ese día no fue una simple actuación.\n\nLa obra satirizó duramente a la actual líder de Xuanlong, $SHA_KISAKI$, comparándola con el \"Señor Oscuro\". La trama relataba cómo un estúpido señor abría imprudentemente las puertas de la ciudad a los vientos del cambio, sumiendo a su pueblo en el caos.\n\nCon escenas impactantes, el espectáculo envió un claro mensaje de crítica hacia la líder. Al concluir la obra, la plaza estalló en vítores y pronto comenzaron a movilizarse tanto radicales como conservadores dentro de Xuanlongm.\n\nAsí, aquella actuación se convirtió en el disparo inicial de una revolución. Las facciones radicales y conservadoras, junto con el Club de Ópera, declararon en la Plaza Baihu la destitución de $SHA_KISAKI$, sumiendo el lugar en caos y furia.\n\nActualmente, $SHA_KISAKI$ está bajo arresto domiciliario en su residencia VIP. Aunque conserva ciertos privilegios por ser la exlíder, el futuro de Shan Haijing permanece incierto. Nadie sabe cuál será el rumbo que tomará $SHA_KAGUYA$, la nueva líder.\n\nSin embargo, comienzan a surgir inquietudes internas: circulan rumores de que $SHA_KAI$, quien hace años alteró la seguridad de Shan Haijing, está tramando otra oscura conspiración..."
 shafas.1.a: "¡Protejamos nuestra tradición!"

 shafas.3.t: "Radicales infiltrados"
 shafas.3.d: "Actualmente, Shanhaijing está sumida en el caos. El golpe de Estado del Club de la Ópera de Pekín se convirtió en una revolución, y la líder del Xianlongmen, Kisaki, transfirió su cargo a Urushibara Kaguya, encontrándose ahora bajo arresto domiciliario en su residencia VIP. Aunque la revolución se completó con cierto éxito, aún queda un sinfín de problemas por resolver.\n\nSin embargo, dentro de Shanhaijing se detectan movimientos sospechosos. Shintani Kai busca aprovechar este caos para convertirse en la nueva líder de Shanhaijing. Los radicales del Yondanbang no reconocen a la actual líder provisional, Urushibara Kaguya, y solo obedecen las órdenes de Shintani Kai, lo que hace sospechar que el Yondanbang ya ha caído bajo su control."
 shafas.3.a: "Debemos adelantarnos dos pasos."

 shafas.4.t: "¡Golpe de Estado del Consejo Xuanwu!"
 shafas.4.d: "Tras el golpe del Club de la Ópera de Pekín, se ha producido otro golpe de Estado en Shanhaijing. Esta vez, el Consejo Xuanwu ha reunido a las facciones moderadas restantes del Xianlongmen y ha comenzado a oponerse a nuestras fuerzas.\n\nAfirman que la revolución del Club de la Ópera de Pekín es una traición total a las tradiciones de Shanhaijing y que todo fue orquestado con el propósito de restaurar a Shintani Kai. También proclaman ser los verdaderos restauradores de la estabilidad de Shanhaijing e incitan a los estudiantes a la revolución."
 shafas.4.a: "¡El Consejo Xuanwu ha logrado su golpe!"
 shafas.4.b: "¡Pagarán por su traición!"

 shafas.5.t: "Hace unos meses"
 shafas.5.d: "En 1929, la Gran Depresión que comenzó en Estados Unidos también alcanzó a Austria, a miles de kilómetros de distancia. El impacto económico dejó a muchos ciudadanos sin empleo, quienes salieron a las calles a exigir pan y trabajo. Sin embargo, los esfuerzos de los políticos por hacer frente a la crisis fueron completamente infructuosos.\n\nEn noviembre, ocurrió el Gran Cataclismo, arrastrando a Shanhaijing hasta Austria. El gobierno central fue neutralizado, y el Xianlongmen de Shanhaijing tomó el control legislativo, judicial y ejecutivo, convirtiéndose en la nueva autoridad del país. Pero junto con el poder, también heredaron los problemas económicos.\n\nEl Xianlongmen proclamó de inmediato leyes temporales que lograron resolver eficazmente el problema del desempleo. No obstante, esto no significó el fin de la Gran Depresión. Aún quedan muchos obstáculos y decisiones difíciles por delante. Solo la sabiduría y el enfoque podrán superar estas dificultades."
 shafas.5.a: "¡Enfrentémoslo!"

 shafas.6.t: "Revolución Conservadora"
 shafas.6.d: "Hace dos meses, para frenar al Consejo Xuanwu y los efectos del Gran Cataclismo, el Club de la Ópera de Pekín buscó unir a facciones con ideologías y objetivos similares. Cumplieron un papel clave en la defensa de los intereses de Shanhaijing. Gracias a sus esfuerzos, los objetivos del Consejo Xuanwu fueron frustrados y la influencia del Gran Cataclismo fue contenida.\n\nSin embargo, Shanhaijing sigue amenazada, no solo por peligros externos, sino también por defectos internos. Las políticas parlamentarias débiles del líder actual lo reducían a un títere, amenazando con destruir los fundamentos del conservadurismo de Shanhaijing. Para evitarlo, el Club de la Ópera de Pekín alzó la bandera de la revolución dentro de la academia.\n\nBajo el liderazgo brillante de Urushibara Kaguya, los conservadores del Xianlongmen lograron finalmente lo que sus pequeñas rivalidades y falta de decisión les habían impedido conseguir. Los antiguos conflictos terminaron, y se construyó un puente entre el viejo movimiento conservador y el moderno. La era del idealismo parlamentario sin propósito y de los experimentos cuasi-socialistas del Consejo Xuanwu ha terminado.\n\nHa llegado el momento de que el verdadero Club de la Ópera de Pekín destruya las estructuras corruptas del pasado e inicie la revolución conservadora."
 shafas.6.a: "Que comience."

 shafas.7.t: "Fuerzas de Defensa de Shanhaijing"
 shafas.7.d: "Las Fuerzas de Defensa de Shanhaijing son la fuerza principal responsable de la defensa terrestre y del territorio nacional. Sin embargo, más que un ejército estatal, son una fuerza leal al Xianlongmen. Su comandante supremo es el actual líder, [SHA.GetLeader], y el liderazgo operativo recae en la jefa ejecutiva, $SHA_MINA$.\n\nLa historia de las Fuerzas de Defensa es sorprendentemente corta. Fueron fundadas por el anterior líder para respaldar su política expansionista y reorganizadas como una fuerza militar bajo el Xianlongmen. Pero tras la caída del antiguo líder, la política expansionista fue abolida y las fuerzas reducidas considerablemente.\n\nAun así, las Fuerzas de Defensa jugaron un papel clave en momentos críticos, defendiendo el territorio de Shanhaijing en conflictos con otras academias y expulsando a Shintani Kai.\n\nDurante el Gran Cataclismo, volvieron a entrar en acción. Sin embargo, las políticas de desarme de Ryuuge Kisaki debilitaron seriamente su poder. Con escasez de equipo y tensiones políticas, estuvieron a punto de ser derrotadas por las fuerzas federales austriacas. No obstante, gracias al liderazgo de Kisaki y de $SHA_MINA$, lograron una victoria al estilo de Fabius y defendieron Shanhaijing con éxito.\n\nHoy en día, la situación de las Fuerzas de Defensa no es nada optimista. Las continuas reducciones y la pérdida de capacidad las han dejado mal preparadas ante amenazas externas. En este volátil entorno internacional, no pueden permitirse permanecer en su estado actual."
 shafas.7.a: "¡Lealtad!"

 shafas.8.t: "Ultimátum Final"
 shafas.8.d: "El gobierno de Shanhaijing reclama la soberanía sobre [972.GetName], territorio ocupado por Hyakkiyako mediante la fuerza, y exige su devolución inmediata. Si no hay respuesta en 48 horas, ambas naciones entrarán en estado de guerra. Esta advertencia deja claro que no es una amenaza vacía.\n\nPor otro lado, también tenemos nuestra disputa territorial con Shanhaijing sobre [1021.GetName]. Sin embargo, mencionar esto en este momento podría interpretarse como una declaración de intenciones bélicas, exacerbando aún más la tensión. Es necesario actuar con cautela."
 shafas.8.a: "¡No retrocederemos!"

 shafas.9.t: "[FROM.GetAdjective] ha rechazado nuestra demanda"
 shafas.9.d: "¿Hay algo más que decir?"
 shafas.9.a: "¡Entonces es la guerra!"

 shafas.10.t: "El papel de Konoe Mina"
 shafas.10.d: "Konoe Mina logró eliminar por completo a las fuerzas de la Federación Austriaca y las milicias, ganando una medalla de honor por sus méritos. Su liderazgo y juicio estratégico fueron ampliamente elogiados dentro y fuera del ejército, elevando notablemente la capacidad militar y de inteligencia de Shanhaijing. Sin embargo, a pesar de estos logros, su título oficial sigue siendo el ambiguo \"jefa ejecutiva\", sin reflejar claramente su posición y autoridad.\n\nHa llegado el momento de que el gobierno de Shanhaijing le otorgue el cargo y autoridad adecuados. Esto no solo es una cuestión de reconocimiento personal, sino una necesidad para elevar la moral y fortalecer la estructura organizativa del ejército."
 shafas.10.a: "Elogiemos sus habilidades ofensivas."
 shafas.10.b: "Elogiemos sus habilidades defensivas."
 shafas.10.c: "Elogiemos su movilidad."
 shafas.10.e: "Elogiemos su capacidad de organización."

 shafas.11.t: "Regreso triunfal"
 shafas.11.d: "¡La conspiración tuvo éxito! Durante la madrugada de hoy, los radicales y miembros del Yondanbang lograron derrocar a Urushibara Kaguya y proclamaron a su líder, Shintani Kai, como la nueva autoridad. Aunque los errores de Urushibara Kaguya influyeron en su caída, gran parte del mérito recae en nuestra hábil manipulación de los acontecimientos.\n\nActualmente, Shintani Kai está reestructurando el gobierno a su gusto. Muchos funcionarios clave del Xianlongmen han sido destituidos o forzados a renunciar, mientras que los nuevos cargos están siendo ocupados rápidamente por fieles seguidores de Shintani Kai. Los funcionarios restantes no pueden oponer resistencia ante la aplastante mayoría de los leales.\n\nShintani Kai se está preparando para dar un discurso en el que anunciará oficialmente los cambios políticos."
 shafas.11.a: "Todo según lo planeado."

 shafas.12.t: "Miedo en expansión"
 shafas.12.d: "Entre el pueblo de Shanhaijing circulaban teorías conspirativas sobre la implicación de Shintani Kai en la revolución. Recientemente, estas teorías han resultado ser ciertas, y los estudiantes de Shanhaijing temen que vuelva a ocurrir algo similar a lo que sucedió en el pasado."
 shafas.12.a: "Tomemos medidas rápidas contra Shintani Kai."
 shafas_12_tt: "En 35 días comenzará el juicio contra $SHA_KAI$."

 shafas.13.t: "Juicio contra $SHA_KAI$"
 shafas.13.d: "$SHA_KAI$ causó un gran caos en el pasado de Shanhaijing. El fármaco que distribuyó por sus propios intereses provocó daños fatales en los estudiantes de Shanhaijing, y la entonces líder Ryuuge Kisaki rompió con la tradición para expulsarla por la fuerza. Sin embargo, durante la revolución, se descubrió que algunos miembros del Yondanbang habían contactado con Shintani Kai, por lo que Urushibara Kaguya ha convocado un juicio para recuperar el apoyo popular."
 shafas.13.a: "Probablemente lo correcto para calmar al pueblo sea expulsarla."
 shafas.13.b: "Impongamos una estricta vigilancia sobre ella."

 shafas.14.t: "El destino de Yakushi Saya"
 shafas.14.d: "Cuando el Laboratorio de Alquimia Oriental cayó por completo en manos de Shintani Kai, el destino de Yakushi Saya —la anterior jefa del laboratorio— empezó a acercarse lentamente. Yakushi Saya es una figura que sostiene una postura totalmente opuesta a la de Shintani Kai, y durante mucho tiempo se había opuesto de forma constante a los experimentos de Kai: poco éticos, pero prácticos.\n\nShintani Kai, en lo personal, no guarda sentimientos particulares hacia ella, y su intención es cerrar el asunto degradando a Saya a un miembro común del laboratorio. Sin embargo, dentro del propio laboratorio crecen las voces que exigen el encarcelamiento de Saya."
 shafas.14.a: "Conformémonos con degradarla"
 shafas.14.b: "Entonces, enciérrenla"

 shafas.17.t: "Milicia radical"
 shafas.17.d: "A raíz del caos político de Shanhaijing y del impacto de la Gran Traslación, algunos grupos radicales dentro de la Escuela Secundaria Superior de Shanhaijing se han aglutinado y están emprendiendo actividades de milicia. Sus principales objetivos son fuerzas de tendencia izquierdista, incluida la Black Tortoise Promenade, contra las que llevan a cabo ataques.\n\nLas estudiantes poseen ciertos medios para resistir estas incursiones, pero los austríacos locales no; esto podría convertirse en una chispa para futuros conflictos."
 shafas.17.a: "Esto debe detenerse de inmediato. Envíen al órgano ejecutor y disuelvan la milicia."
 shafas.17.b: "¿Por qué habríamos de impedir el actuar de los patriotas?"

 shalose.1.t: "Estallan protestas masivas"
 shalose.1.d: "Protestas masivas exigiendo la dimisión del gobierno"
 shalose.1.a: "Es algo heterodoxo..."

 shalose.2.t: "El final"
 shalose.2.d: "Al día siguiente de que la derrota quedara oficialmente confirmada, Shintani Kai cortó todo rastro de sí misma. No dejó ni un solo mensaje. Su despacho quedó tal cual, sin ordenar, y los frascos y diagramas con los que trabajaba en persona permanecieron allí.\n\nLa gente dice que la científica que no pudo aceptar el fracaso terminó por borrarse a sí misma dentro del laboratorio.\n\nHoy, la Escuela Secundaria Superior de Shanhaijing atraviesa un caos cercano a la anarquía, sin un liderazgo. Entre la población circulan múltiples conjeturas sobre el paradero de Shintani Kai, pero nadie puede afirmarlo con certeza: ¿eligió la muerte, o se ocultó para otro experimento?\n\nLo único seguro es que, frente al peso de la responsabilidad, no logró desprenderse del cascarón de la locura, y que incluso en el último instante intentó cargar con todo ella sola."
 shalose.2.a: "\"Esto es un experimento.\" Era una frase que ella repetía a menudo."

 shalose.2.d_2: "Unos días después de que la derrota quedara oficializada, Urushibara Kaguya se presentó voluntariamente ante la ciudadanía. Reconoció que la revolución conservadora había fracasado y declaró que aceptaría un juicio legal de acuerdo con la voluntad popular. Fue arrestada de inmediato y enviada a juicio.\n\nUna gran parte de la opinión pública exigía su destierro, pero el tribunal consideró que era susceptible de reeducación y decidió encarcelarla en el Departamento Correccional. Sin embargo, esta decisión desató una fuerte reacción entre las estudiantes de Shanhaijing. Se expresó el descontento de que alguien que había provocado el caos interno de Shanhaijing fuera juzgada “desde afuera”.\n\nCon la aparición de quienes alegaban que el veredicto no era justo, la situación se agravó al nivel de milicias. Quienes se oponían a la revolución conservadora y se rearmaron con una ideología ultraderechista organizaron grupos armados, y se han producido diversos episodios de violencia, incluyendo ataques contra el Distrito Especial Central de Shanhaijing con armas de fuego."
 shalose.2.b: "¿Cuántas personas sufrieron bajo la frase \"gran revolución conservadora\"...?"

 shalose.3.t: "Golpe militar"
 shalose.3.d: "La ciudad no se sumió en la oscuridad. En cada lugar donde se apagaba una luz, despertaba un cañón, y detrás de esos cañones estaba Konoe Mina. El edificio gubernamental de la Escuela Secundaria Superior de Shanhaijing se abrió sin ofrecer resistencia, y nadie la detuvo. No había razón para detenerla, ni fuerza para hacerlo.\n\nTras la desaparición de Shintani Kai, el régimen se tambaleaba como si colgara del vacío. Una líder ausente, una administración colapsada, civiles desarmados. La palabra 'gobierno' ya no tenía significado, y la gente quería una voz clara: un rumbo, una orden, la aparición de alguien.\n\nY fue Konoe Mina quien atravesó ese vacío. Antes fue oficial de operaciones en la Fuerza de Defensa y llegó a mandar un batallón. Hablaba poco, pero por alguna razón solía olvidarse de las comunicaciones por radio. Cuando desplegaba el mapa, empezaba sosteniéndolo al revés… pero, aun así, llegaba al destino.\n\nLa Fuerza de Defensa, bajo su mando, avanzó hacia el centro urbano. Fue casi una entrada sin derramamiento de sangre. El gobierno ya estaba en estado de anarquía, y las milicias y vecinos que dominaban las calles saludaron a la Fuerza de Defensa con la tenue esperanza de un 'regreso del orden'."
 shalose.3.a: "¡El orden ha sido restablecido!"

 shadem.1.t: "La primera elección"
 shadem.1.desc: "En Shanhaijing se ha celebrado la primera elección democrática histórica. Esta elección no es solo la designación de una líder: al tratarse de una transición a la democracia y de una elección presidencial, ha despertado un enorme interés incluso entre las diversas academias de Kivotos.\n\nMuchas personas participaron en la campaña y reflexionaron a fondo sobre a quién votar, y por fin llegó el día del destino.\n\nEn esta elección se han presentado un total de tres candidatas.\nLa primera es la ex señora de la Puerta, Ryuuge Kisaki. La segunda es Akashiro Rumi, quien encabeza las reformas y cuenta actualmente con el apoyo más alto. Ambas han asegurado porcentajes de apoyo enormes y nadie puede inclinar la balanza con facilidad.\n\nAhora se acerca el momento decisivo: la elección que determinará el futuro de Shanhaijing."
 shadem.1.desca: "En Shanhaijing se ha celebrado la primera elección democrática histórica. Esta elección no es solo la designación de una líder: al tratarse de una transición a la democracia y de una elección presidencial, ha despertado un enorme interés incluso entre las diversas academias de Kivotos.\n\nMuchas personas participaron en la campaña y reflexionaron a fondo sobre a quién votar, y por fin llegó el día del destino.\n\nEn esta elección se han presentado un total de tres candidatas.\nLa primera es la ex señora de la Puerta, Ryuuge Kisaki. La segunda es Akashiro Rumi, quien encabeza las reformas y cuenta actualmente con el apoyo más alto. Y, por último, la jefa del Laboratorio de Alquimia Oriental, Yakushi Saya.\n\nAhora se acerca el momento decisivo: la elección que determinará el futuro de Shanhaijing."
 shadem.1.a: "¡Ryuuge Kisaki!"
 shadem.1.b: "¡Akashiro Rumi!"
 shadem.1.d: "¡Yakushi Saya!"

 shadem.2.t: "Hacia el pueblo"
 shadem.2.desc: "Muchísima gente en Shanhaijing todavía sabe poco sobre la democracia. Desde la separación de poderes —piedra angular de la democracia— hasta los deberes y responsabilidades ciudadanas bajo un sistema democrático, una gran parte de la población no comprende estos conceptos con precisión. Akashiro Rumi concluyó que no podía sembrar sus ideales en Shanhaijing solo con los talentos formados por la vieja Puerta del Dragón Negro, y decidió elaborar una contramedida."
 shadem.2.a: "¡Hacia el pueblo! — ¡Intelectuales, iluminen al pueblo!"

 shafla.1.t: "¡Hay que comer mucho y recuperar fuerzas!"
 shafla.1.desc: "Bajo el edicto de la Puerta del Dragón Negro que proclamaba impulsar proyectos de ayuda, quienes se movieron con más ajetreo fueron las de la Black Tortoise Promenade. Durante la Gran Traslación, ellas mismas salieron al frente para proteger la corporación; pero esta vez libraban una lucha totalmente distinta: cocinar para quienes pasaban hambre.\n\nCuando llegó la hora del almuerzo, la gente se agolpó frente a la Black Tortoise Promenade. Había sucursales por todo Shanhaijing, pero la más famosa era, sin duda, la sede principal de [4.GetCapitalVictoryPointName]. Se debía a que la extraordinaria habilidad culinaria de Akashiro Rumi se había difundido ampliamente de boca en boca.\n\nEntre la multitud, un niño se acercó con cautela:\n\"Oiga… ¿me podría dar algo de comida…? Tengo hambre… aunque sea un poco…\"\n\nRumi miró al niño y sonrió con calidez.\n\"Claro, mocoso. ¿Tenías mucha hambre? Jajaja, está bien. Espera un poquito. ¡Te voy a servir la mejor comida!\"\n\nEntró a la cocina y movió las manos con rapidez. Al poco rato, le puso enfrente un arroz frito especial preparado con esmero. El niño, con una sonrisa radiante, devoró la comida; y Rumi observó la escena en silencio. Así, el tiempo fue pasando lentamente."
 shafla.1.a: "¿La comida es importante, sabes?"

 shafla.2.t: "Recesión de transición"
 shafla.2.desc: "Se abrió el mercado e introdujimos elementos capitalistas, alejándonos del sistema de economía planificada dirigido por el gobierno central. Estas reformas estaban dando resultados más eficaces que las políticas económicas previas, pero una transición demasiado rápida conllevaba un alto riesgo de provocar una recesión durante el proceso.\n\nEl audaz desafío de introducir el capitalismo llegó a parecer un fracaso por lo cerca que estuvo de caer en crisis; sin embargo, el análisis anunciado hoy por especialistas ofreció una perspectiva esperanzadora. La economía mejora poco a poco y la gente vuelve a consumir. Las ventajas de la economía capitalista empiezan a hacerse visibles, y parece que ha llegado el momento de reducir gradualmente la intervención de los expertos y concluir la reforma económica de Shanhaijing."
 shafla.2.a: "¡Son buenas noticias!"

 shafla.3.t: "¡Uwaaat!"
 shafla.3.desc: "Cuando el puesto de señora de la Puerta del Dragón Negro pasó de Urushibara Kaguya a Shintani Kai, Akashiro Rumi juzgó que su facción, la Black Tortoise Promenade, recibiría un golpe. Presintió la crisis y actuó de inmediato. Pero para el nuevo régimen aquello solo podía convertirse en un enorme estorbo, y Shintani Kai preparó un ardid.\n\n— ¡Booom!\n\nUna explosión repentina sacudió el interior de la Black Tortoise Promenade. Quienes estaban dentro se sobresaltaron y corrieron hacia el origen del estruendo, donde empezó a elevarse humo. Al principio lo tomaron por un simple alboroto, pero justo cuando las estudiantes de la Black Tortoise Promenade —incluida Rumi— intentaban salir…\n\nEmpezaron a detonar varias bombas en cadena, y un humo denso cubrió el recinto en un instante.\n\nPoco después, cuando el humo se disipó, lo que apareció fue, increíblemente, un grupo de estudiantes de la Black Tortoise Promenade convertidas en niñas pequeñas.\n\n\"¡¿Qué… qué está pasando?!\"\n\n\"¿Q-qué hacemos, presidenta…?\"\n\nUna Reijo desconcertada le preguntó a Rumi con urgencia.\n\nRumi se quedó helada un instante, pero enseguida recuperó la calma y dio una orden:\n\n\"Contacta a Saya. ¡Ahora mismo!\"\n\n\"S-sí… ¡sí!\"\n\n\"Y además—\"\n\nOtra explosión. Esta vez, Rumi misma se transformó en su versión de la infancia."
 shafla.3.a: "Fuimos al hospital de inmediato. Por suerte, no había nada raro con su salud."
 shafla_3_tt: "El retrato de Akashiro Rumi cambia de la siguiente manera:\n--------------------------------\n\n\n\n\n\n\n£GFX_Portrait_SHA_Akeshiro_Rumi_Child\n\n\n\n\n\n\n\n--------------------------------"

 shadip.1.t: "[SHA.GetAdjective] solicita exportación de hojas de té"
 shadip.1.desc: "Hoy llegó un documento diplomático desde [64.GetCapitalVictoryPointName]. Era la primera —y simbólica— comunicación oficial entre ambas academias enviada por el bando de [SHA.GetLeader] de Shanhaijing. Sin embargo, su contenido resultó ser, sorprendentemente, un asunto relativamente menor.\n\nShanhaijing ha mantenido desde hace tiempo intercambios informales con el Club de Té de Trinity, y esta vez ha transmitido la solicitud de importar oficialmente las 'hojas de té' cultivadas en Trinity. Se analiza que el trasfondo de la petición es el boom repentino de la cultura del té en Shanhaijing, que ha hecho explotar la demanda.\n\nDado que la parte de Shanhaijing lo ha solicitado formalmente por vía diplomática, rechazarlo podría generar el riesgo de deteriorar las relaciones entre ambas academias."
 shadip.1.a: "¡Aprobemos la exportación de hojas de té!"
 shadip.1.b: "No hay motivo para regalar los recursos de Trinity."

 shadip.2.t: "[TRM.GetAdjective] inicia la exportación de hojas de té"
 shadip.2.desc: "Por suerte, el bando de [64.GetCapitalVictoryPointName] comenzó la exportación de hojas de té, y hoy llegó a Shanhaijing el primer cargamento destinado a cubrir la demanda de té negro, que ha aumentado con rapidez.\n\nEn particular, este envío incluye hojas de té premium especiales para la señora de la Puerta del Dragón Negro, y se sabe que fueron cultivadas directamente por el Tea Party de Trinity. Además, se entregaron galletas artesanales preparadas con esmero por el bando de [TRM.GetLeader], lo que ha sido recibido como una muestra sincera de amistad que va más allá de un simple intercambio comercial."
 shadip.2.a: "Una historia estupenda."

 shadip.3.t: "[TRM.GetAdjective] rechaza la propuesta de exportación de hojas de té"
 shadip.3.desc: "Lamentablemente, el bando de [TRM.GetAdjective] ha rechazado nuestra propuesta."
 shadip.3.a: "¿Y esto lo rechazan?"


 # 뉴스 이벤트
 shanews.01.t: "¡Golpe de Estado en Shanhaijing!"
 shanews.01.desc: "Esta mañana ha llegado una noticia impactante que sacude a todo Kivotos: el Club de la Ópera de Pekín ha llevado a cabo un golpe de Estado contra la líder del Xianlongmen, Ryuuge Kisaki. Aunque justifican su acción afirmando que Kisaki traicionó las tradiciones de Shanhaijing, la verdad oculta detrás de este suceso sigue siendo un misterio. Tras el Gran Cataclismo, Shanhaijing había permanecido aislada, pero todo indica que ahora algo trascendental ha ocurrido.\n\nDesde que el Club de la Ópera tomó el poder, los rumores ominosos no han cesado. Ha resurgido el nombre de Shintani Kai, una de las \"Siete Bestias del Crimen\" expulsada anteriormente de Shanhaijing, quien recientemente habría escapado de prisión, agitando aún más la opinión pública."
 shanews.01.a: "¡Tradición, no cambio!"
 shanews.01.b: "Después de todo, esto también es un cambio."

 shanews.02.t: "La Revolución Conservadora de Shanhaijing"
 shanews.02.desc: "Hoy se ha producido un giro inesperado. El Club de la Ópera de Pekín, encabezado por Urushibara Kaguya, ha anunciado que transfiere todo su poder a Ryuuge Kisaki y que se dedicará por completo a implementar el conservadurismo de Shanhaijing. Inmediatamente después del anuncio, numerosos miembros del Club de la Ópera salieron a las calles mostrando su apoyo.\n\nHasta el momento, Ryuuge Kisaki no ha emitido ninguna declaración oficial, pero su silencio ha sido interpretado ampliamente como una aprobación tácita a las acciones del Club de la Ópera."
 shanews.02.a: "¡Erradiquemos la cultura decadente!"
 shanews.02.b: "¿Qué demonios está pasando?"
 shanews.02.c: "Otro ejemplo más de un Estado reaccionario."

 shanews.03.t: "Segundo golpe de Estado en Shanhaijing"
 shanews.03.desc: "Hoy ha llegado otra noticia impactante desde Shanhaijing. Shintani Kai, la 'Vergüenza de Mifuyu' y una de las \"Siete Bestias del Crimen\", ha derrotado al Club de la Ópera en la lucha por el poder y ha tomado el control del gobierno. Este suceso está provocando un gran revuelo en toda Shanhaijing.\n\nEn su discurso, Shintani Kai proclamó que \"servirá a Shanhaijing\", pronunciando dulces palabras, pero solo ella conoce sus verdaderas intenciones. Las demás academias aún no han emitido declaraciones oficiales, pero es poco probable que vean con buenos ojos lo ocurrido."
 shanews.03.a: "¡Démosle la bienvenida!"
 shanews.03.b: "Esto es una amenaza a la seguridad..."
 shanews.03.c: "Suena algo siniestro..."
 shanews_04_template: "\n\nCon la firma de [SHA.GetFactionName] en el Sur de Kivotos, los expertos prevén que la competencia por la hegemonía en los Balcanes se intensificará aún más. Además, Italia —que posee intereses directos en el tratado— está mostrando una reacción contenida."
 shanews.04.t: "Creación del Tratado de Shanhaijing"
 shanews.04.t_1: "Reconstrucción de la Segunda Internacional"
 shanews.04.desc_c: "Con una nueva ola de cambios soplando en Shanhaijing, hoy [SHA.GetLeader] ha creado el Tratado de Shanhaijing. Urushibara Kaguya, directora del Club de Ópera de Pekín y figura de facto del poder en Shanhaijing, respaldó con firmeza la creación de este acuerdo y lo valoró como una política imprescindible para el conservadurismo de Shanhaijing.$shanews_04_template$"
 shanews.04.desc_s: "Con una nueva ola de cambios soplando en Shanhaijing, hoy [SHA.GetLeader] ha creado el Tratado de Shanhaijing. [SHA.GetLeader] subrayó que este acuerdo era una elección inevitable dentro de su línea política y reconoció que, como resultado, no quedó más remedio que modificar parcialmente algunas políticas aislacionistas.$shanews_04_template$"
 shanews.04.desc_nothing: "Con una nueva ola de cambios soplando en Shanhaijing, hoy [SHA.GetLeader] ha creado el Tratado de Shanhaijing. [SHA.GetLeader] se esforzó por sacar adelante el acuerdo incluso a costa de corregir la política aislacionista vigente y, pese a la oposición de sus partidarios, lo impuso haciendo uso de la autoridad de la Señora de la Puerta.$shanews_04_template$"
 shanews.04.a: "¡Se alza una nueva Shanhaijing!"
 shanews.04.c: "¿Y qué pasó con mantener el aislacionismo?"
 shanews.04.d: "¿Ha nacido una nueva hegemonía?"
 shanews.05.t: "Creación de [SHA.getfactionname]"
 shanews.05.desc_1: "Con una nueva ola de cambios soplando en Shanhaijing, hoy [SHA.GetLeader] destacó el papel de [SHA.getname] en el Frente Occidental de la Komintern. [SHA.GetLeader] enfatizó que esta tesis es una 'lucha nacional' orientada a la práctica del socialismo, y proclamó que, bajo el bloque internacionalista, avanzarán por el camino de la liberación obrera.$shanews_04_template$"
 shanews.05.desc_2: "Con una nueva ola de cambios soplando en Shanhaijing, hoy [SHA.GetLeader] reconstruyó la Segunda Internacional. [SHA.GetLeader] enfatizó que esta tesis es una 'lucha nacional' orientada a la práctica del socialismo, y proclamó que solo la declaración de una nueva Internacional puede ser el camino hacia la liberación obrera.$shanews_04_template$"

