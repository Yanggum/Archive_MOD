 # Ruta de derrota

 SHA_fall_of_dragon: "La caída del dragón"

 SHA_defeat_kisaki_focus_1: "Restauración de Ryuuga Kisaki"
 SHA_defeat_kisaki_focus_1_desc: "Ryuuga Kisaki fue, en esencia, una víctima de la historia. No era más que una marioneta utilizada por quienes usurparon el poder para legitimar su propio régimen. Sin embargo, aun así, ella es el símbolo de la unificación de Shanhaijing y la auténtica líder que continúa el linaje de una larga historia."
 SHA_defeat_kisaki_focus_2: "Restauración de la Puerta del Dragón Negro"
 SHA_defeat_kisaki_focus_2_desc: "Las reformas impulsadas por los gobiernos anteriores se centraron en debilitar la autoridad de la Puerta del Dragón Negro. Sin embargo, esos gobiernos acabaron cayendo por un golpe militar, y nosotros restauramos a la legítima líder, Ryuuga Kisaki. Ahora solo queda recuperar el honor y el prestigio de la Puerta del Dragón Negro."
 SHA_defeat_kisaki_focus_3: "Unión del Sur de Kivotos"
 SHA_defeat_kisaki_focus_4: "Expansión del unificacionismo del Sur de Kivotos"
 SHA_defeat_kisaki_focus_5: "Movimiento no alineado de Shanhaijing"
 SHA_defeat_kisaki_focus_6: "La nación de la mañana serena"

 SHA_defeat_mina_focus_1: "Continuación del gobierno militar"
 SHA_defeat_mina_focus_1_desc: "Para resolver los problemas generales que enfrenta Shanhaijing, hemos llegado a la conclusión de que mantener un gobierno militar es la mejor opción. Por supuesto, nuestro gobierno puede carecer de legitimidad, pero en este momento no tenemos el lujo de desperdiciar tiempo en procesos de toma de decisiones innecesarios."
 SHA_defeat_mina_focus_2: "Expansión del revanchismo"
 SHA_defeat_mina_focus_4: "Pruebas de aeronaves"
 SHA_defeat_mina_focus_5: "Rearme secreto"

 SHA_defeat_mina_focus_7: "Muerte o deshonra"

 SHA_defeat_industry_focus_1: "Intento de autosuficiencia económica"
 SHA_defeat_industry_focus_1_desc: ""
 SHA_defeat_industry_focus_2: "Renegociación del Tratado de Gaigaku"
 SHA_defeat_industry_focus_2_desc: "El Tratado de Gaigaku es excesivamente severo y se ha convertido en un acuerdo que ha devorado por completo la base de crecimiento de Shanhaijing. Por ello, Shanhaijing movilizará a sus diplomáticos para renegociar el tratado, buscando ajustarlo en una dirección menos dura que la anterior."
 SHA_add_HYA_SHA_huzika: "Firma del §YTratado de Gaigaku§!"
 SHA_add_HYA_SHA_huzika_tt: "Días actuales [?SHA_add_HYA_SHA_huzika:days|Y0]"
 SHA_defeat_industry_focus_3: "Levantamiento de las restricciones a la Black Tortoise Promenade"
 SHA_defeat_industry_focus_4: "Apoyo a la Black Tortoise Promenade"

 # 국민정신
 SHA_Austrian_fascist_militia: "Milicia fascista austriaca"
 SHA_Austrian_fascist_militia_desc: "Cuando Shanhaijing se trasladó, la desarmada Austria se rindió sin oponer resistencia. Pero el dominio de Shanhaijing se convirtió en otra amenaza para los austriacos. Los que se negaron a aceptarlo tomaron las armas, librando una guerra de guerrillas que causa disturbios constantes al sistema de Shanhaijing."
 SHA_shanhaijing_isolation: "Aislacionismo de Shanhaijing"
 SHA_shanhaijing_isolation_desc: ""
 SHA_Eastern_Alchemy_Society_idea_desc: "La Sociedad Alquímica Oriental es un club que estudia la alquimia en Shanhaijing. Aunque puede parecer poco científica, en realidad se asemeja más a un laboratorio moderno de química y biología. Su objetivo final es crear un elixir de la inmortalidad, experimentando con diversas pociones.\n\nAunque saben que la inmortalidad es casi imposible, establecen objetivos ambiciosos para impulsar nuevos descubrimientos durante la investigación."
 SHA_Eastern_Alchemy_Society_low: "Bajo presupuesto para la Sociedad Alquímica"
 SHA_Eastern_Alchemy_Society_low_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_medium: "Alto presupuesto para la Sociedad Alquímica"
 SHA_Eastern_Alchemy_Society_medium_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$"
 SHA_Eastern_Alchemy_Society_high: "Presupuesto muy alto para la Sociedad Alquímica"
 SHA_Eastern_Alchemy_Society_high_desc: "$SHA_Eastern_Alchemy_Society_idea_desc$\n\nRecientemente han surgido preocupaciones entre los estudiantes. Corren rumores de que el gobierno está concentrando fondos intencionalmente en la Sociedad Alquímica, impidiendo que otros clubs funcionen adecuadamente. Aunque apoyar a la Sociedad podría contribuir al desarrollo nacional, será difícil evitar el descontento público y la inestabilidad social."
 SHA_Eastern_Alchemy_Society_super_low: "Recortes al presupuesto de la Sociedad Alquímica"
 SHA_gathering_of_radicals_idea: "Concentración de radicales"
 SHA_gathering_of_radicals_idea_desc: "Los radicales se están uniendo como fuerza política. No está claro qué planean, pero sin duda son malas noticias para la actual líder Kisaki."
 SHA_emergency_measures_idea: "Medidas de emergencia"
 SHA_emergency_measures_idea_desc: "En un mundo cada vez más agresivo, [SHA.GetNameDef] debe desarrollar rápidamente capacidad industrial para satisfacer las demandas nacionales y aprovechar oportunidades."
 SHA_walking_the_dragon: "Revolución Conservadora de Shanhaijing"
 SHA_Black_Tortoise_Promenade: "Asociación Tortuga Negra"
 SHA_Black_Tortoise_Promenade_desc: "Una federación mercantil que reúne ingredientes de todo Kivotos, considerada la capital culinaria de Shanhaijing. Esta característica les ha permitido dominar tanto la gastronomía tradicional como diversas cocinas de Kivotos.\n\nSin embargo, su naturaleza abierta los ha enfrentado con conservadores como la Puerta del Dragón."
 SHA_suppressed_Black_Tortoise_Promenade: "Asociación Tortuga Negra restringida"
 SHA_suppressed_Black_Tortoise_Promenade_desc: "Antigua federación mercantil famosa por reunir ingredientes de Kivotos, ahora bajo estricto control de la Puerta del Dragón. Cualquier desviación de sus tradiciones es severamente regulada, haciendo que pierdan toda influencia política.\n\nLo que fue un pionero culinario ahora apenas sobrevive, añorando su pasado glorioso bajo restricciones conservadoras."
 SHA_Shanhaijinfascism: "Fascismo Shanhaijing"
 SHA_Shanhaijinfascism_desc: "El fascismo Shanhaijing rechaza radicalmente los valores tradicionales. El prolongado aislacionismo dio origen a facciones radicales y reformistas que, al considerar que la Puerta del Dragón ya no buscaba cambios, formaron organizaciones secretas.\n\nEl reciente ascenso de Shintani Kai ha sido aprovechado por estos grupos. Al abrazar el pragmatismo y reformas audaces, ha ganado apoyo de reformistas y radicales.\n\nEsta ideología promueve el supremacismo de Shanhaijing y un fuerte rechazo a Hyakki Yakō por ocupar territorios tras el Incidente. Exigen políticas exteriores duras y reformas internas para recuperar su estatus.\n\nRepresenta una ruptura total con el aislacionismo tradicional, pero su impacto -positivo o divisivo- aún es incierto."
 SHA_corporate_state_idea: "Construcción del Estado Corporativo"
 SHA_daily_ideologiy_excluding_neutrality: "Todas las ideologías excepto no-alineación §R-0.5§!"
 SHA_corporate_state_idea_6: "Bastión de la reacción"
 SHA_austria_unemployment_problem: "Gran Depresión"
 SHA_aup_modifier: "$SHA_austria_unemployment_problem$"
 SHA_austria_unemployment_problem_tt: "$MODIFIER_POLITICAL_POWER_COST$ [?SHA_aup_pp|-=]\n$MODIFIER_STABILITY_FACTOR$: [?SHA_aup_stability|+=%]\n$MODIFIER_INDUSTRIAL_CAPACITY_FACTOR$: [?SHA_aup_factory_output|+=%]"
 SHA_austria_unemployment_problem_desc: "§CNivel de Gran Depresión§!: §Y[?SHA_aup_anger|0]§!\nLa Gran Depresión de 1929 en EE.UU. afectó incluso a la distante Austria. Pero debido a la incompetencia del anterior gobierno austriaco, Shanhaijing heredó este problema.\n\nLas calles están llenas de desempleados y trabajadores exigiendo pan. Esta crisis persistirá mientras continúe la Depresión."
 RUS_increase_pop_anger: "§REl nivel de Gran Depresión cambia en [?SHA_anger_change].§!"
 RUS_decrease_pop_anger: "§GEl nivel de Gran Depresión cambia en [?SHA_anger_change].§!"
 SHA_supreme_economic_council: "Consejo Económico Central"
 SHA_ASFTU: "Federación Nacional de Sindicatos"
 SHA_clash_of_civilizations_idea: "Choque de Civilizaciones"
 SHA_clash_of_civilizations_idea_desc: "La decadente democracia que se ha extendido por el mundo está corrompiendo nuestra carne. Debemos ser vanguardia de la revolución, implantando valores conservadores para crear un mundo mejor."
 SHA_Shintani_kais_cult_of_personality_ns: "Culto a la personalidad"
 SHA_domestic_air_production: "Producción aeronáutica doméstica"
 SHA_shadow_of_Shintani_Kai: "La sombra de Shintani Kai"
 SHA_shadow_of_Shintani_Kai_desc: "Al confirmarse el regreso de Shintani Kai, el mero hecho de su existencia hace que Shanhaijing tiemble de miedo y desconfíe del gobierno actual."
 SHA_transition_to_capitalism: "Estancamiento en la transición"
 SHA_transition_to_capitalism_3: "Capitalismo Shanhaijing"
 SHA_Shanhaijing_Democracy_ns_Name: "Democracia Shanhaijing"
 
