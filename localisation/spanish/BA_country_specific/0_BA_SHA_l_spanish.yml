 SHA_senzu_bean_experiment: "Realizar experimento"
 SHA_senzu_bean_experiment_desc: "Para convertirnos en inmortales, iniciaremos el experimento."
 SHA_senzu_bean_unethical_experiment: "Llevar a cabo un experimento poco ético"
 SHA_senzu_bean_unethical_experiment_desc: "Para acercarnos a la meta debemos ser fríos. Aunque el método experimental sea poco ético y resulte incómodo para quien lo vea, si es un camino que nos aproxima al objetivo, lo asumiremos y lo impulsaremos."
 SHA_senzu_bean_budget_increase: "Cubrir los costos"
 SHA_senzu_bean_budget_increase_desc: "La preparación de las hierbas para convertirse en inmortal requiere costos enormes, imposibles de afrontar a nivel individual. Por ello, lo denominaremos 'investigación nacional' y utilizaremos el presupuesto estatal para cubrir los fondos necesarios."
 SHA_senzu_bean_herbalism: "Recolectar hierbas"
 SHA_senzu_bean_herbalism_desc: "Para convertirse en inmortal, es indispensable recolectar hierbas medicinales conocidas por ser beneficiosas para el cuerpo. Se dice, en particular, que hay que reunir plantas raras que solo crecen en lo profundo de las montañas. En este sentido, el terreno montañoso de Austria constituye un entorno muy adecuado para la recolección de hierbas."
 SHA_senzu_bean_clinical_trials: "Ensayos clínicos"
 SHA_senzu_bean_clinical_trials_desc: "Planeamos realizar ensayos de fármacos dirigidos a convertirse en inmortal con algunas personas ingenuas como sujetos. Administrándoles el medicamento y observando sus reacciones y evolución, podremos acercarnos un paso más a la meta."

 shakai.1.t: "El camino para convertirse en inmortal"
 shakai.1.d: "'Inmortal' es el objetivo singular que persigue Shintani Kai y se refiere al ser 'eterno' de la tradición de la inmortalidad. Se transmite que existen decenas de métodos para convertirse en inmortal, pero ninguno tiene certeza de funcionar. Incluso métodos disparatados —como ingerir mercurio— se han considerado naturales bajo el nombre de la tradición.\n\nSin embargo, Shintani Kai llega a comprender el verdadero método para convertirse en inmortal. Un instante de memoria que brilló con fuerza en su mente se convirtió en un objetivo nítido, y ella inició un viaje para perseguir ese recuerdo. Pero antes de que alcanzara esa meta, la anterior Señora de la Puerta intentó impedirlo, y en el proceso terminó provocando una calamidad para todo Shanhaijing.\n\nAl final, la anterior Señora de la Puerta cayó en desgracia y Ryuuge Kisaki ascendió como la nueva Señora de la Puerta, cerrando temporalmente el incidente; Shintani Kai tuvo que ser exiliada. Pero con el suceso llamado 'Gran Traslación', el Club de Ópera de Pekín —aliado con los radicales— derrocó a Ryuuge Kisaki y, tras expulsar incluso a la ingenua conservadora Urushibara, Shintani Kai emergió como la gobernante de facto de Shanhaijing.\n\nAhora, Shintani Kai comienza en serio el gran viaje para convertirse en inmortal, su deseo largamente acariciado. Por largo y duro que sea el camino, si avanza mirando únicamente a la meta, algún día sin duda llegará a su final."
 shakai.1.a: "Un camino largo y arduo"

 shakai.2.t: "Una pista capturada"
 shakai.2.d: "Un resultado sorprendente ha aparecido ante nosotros. Mientras seguíamos experimentando para convertirnos en inmortales, hemos encontrado una pista. Será de enorme ayuda para elaborar el elixir."
 shakai.2.a: "Un poco más."

