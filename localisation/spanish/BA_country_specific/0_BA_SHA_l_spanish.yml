 SHA_invade_of_Hyakkiyako_cat: "Guerra del Sur de Kivotos"
 SHA_invade_of_Hyakkiyako_cat_desc: "El ejército de Shanhaijing entró en guerra con falta de preparación debido a un ataque precipitado. Sin embargo, Hyakkiyako también quedó gravemente conmocionada por el ataque sorpresa y su capacidad ofensiva se ha debilitado. Aprovechando este hueco, Shanhaijing planea completar con rapidez su régimen de guerra y forzar la rendición de Hyakkiyako."
 SHA_operational_planning: "Ejecutar el plan de ofensiva"
 SHA_shock_relief: "Alivio del shock"
 SHA_attack_plan: "La ofensiva de Shanhaijing"
 
 HYA_invade_of_Hyakkiyako_cat: "Guerra del Sur de Kivotos"
 HYA_invade_of_Hyakkiyako_cat_desc: "Desde la Gran Traslación, Shanhaijing y Hyakkiyako han mantenido una disputa continua por los derechos territoriales sobre el Sudetenland del Sur y la región de Linz. Ahora que la guerra ha estallado, debemos poner punto final a esa disputa territorial."

 SHA_Solving_the_austria_Militia: "Resolver las milicias austríacas"

 SHA_conservative_policy_cat: "Revolución conservadora"
 SHA_conservative_policy_cat_desc: "\n\n£GFX_decision_SHA_conservative_policy_cat_picture\n\n\n\n\nEn medio de una sacudida abrupta del panorama político de §GShanhaijing§!, quien aplastó todas las luchas de poder y terminó imponiéndose fue §1Urushibara Kaguya§!. Ella declaró oficialmente la §Y'Revolución Conservadora'§! que llevaba tanto tiempo preparando y comenzó en serio el camino de la reforma, al tiempo que presentaba a §gRyuuge Kisaki§! como líder simbólica para aglutinar el apoyo de toda la sociedad estudiantil.\n\nTras aplicarse la primera medida de reforma, se han debatido diversas políticas, y en el centro de todo se encuentran los §Yideales conservadores§! que persigue §1Urushibara Kaguya§!. Está impulsando una reconstrucción sistemática a nivel social: la reestructuración del sistema educativo sobre valores y orden tradicionales, la conservadurización de las políticas públicas y la redefinición de la ética propia de §GShanhaijing§!.\n\nEstas reformas van más allá de un simple cambio político: constituyen un trabajo para reconstruir desde la base la identidad y filosofía de §GShanhaijing§!, y un proceso que define con claridad el rumbo futuro. Bajo el liderazgo de §1Urushibara Kaguya§!, §GShanhaijing§! está superando el caos del pasado y transformándose en una §Ynueva forma de Estado conservador§!.\n"
 SHA_conservative_social_reform: "Revolución conservadora: ámbito social"
 SHA_conservative_social_reform_desc: "La sociedad de Shanhaijing está gravemente dañada por los males del liberalismo. En especial, los valores liberales, el individualismo y el pensamiento darwinista están derrumbando las tradiciones y el orden comunitario de Shanhaijing, propagando una enfermedad por toda la sociedad. Para superar esta crisis, debemos, mediante la revolución conservadora, restablecer los valores propios de Shanhaijing y recuperar los ideales y normas tradicionales. Tomando como pilar espiritual a la actual Señora de la Puerta, Ryuuge Kisaki, la tarea clave será lograr cohesión social e integración centrada en la comunidad."
 SHA_conservative_economy_reform: "Revolución conservadora: ámbito económico"
 SHA_conservative_economy_reform_desc: "Una economía de libre mercado total es una estructura que no puede evitar el colapso, y el control de la academia sobre las industrias clave es imprescindible. En particular, en sectores estratégicamente cruciales como la industria de defensa, reforzaremos aún más la capacidad de control de la academia. Las grandes empresas estatales serán utilizadas no solo como actores económicos, sino como instrumentos centrales para ejecutar políticas gubernamentales y ejercer influencia diplomática. A dichas empresas se enviarán personas cercanas a la Puerta del Dragón Negro para encargarse de la vigilancia y el control internos.\n\nBajo la línea aislacionista, Shanhaijing ha trabajado en la autosuficiencia económica y en impulsar industrias de sustitución de importaciones; ahora ha logrado resultados al punto de poder producir internamente la mayoría de bienes. Seguiremos avanzando con el objetivo de construir una economía autosuficiente y sólida, que no se tambalee ante presiones externas ni ante un entorno internacional inestable."
 SHA_conservative_policy_reform: "Revolución conservadora: ámbito político"
 SHA_conservative_policy_reform_desc: "El 'vertical del poder' es una teoría cuyo núcleo consiste en construir una cadena de mando perfectamente unificada en toda la organización, con la Señora de la Puerta en la cúspide. Se centra especialmente en reforzar el control sobre las regiones mediante el envío de personas designadas directamente por la Señora de la Puerta. Además, respecto a fuerzas con tendencias antigubernamentales, perseguiremos obstinadamente el origen de sus fondos para dificultar su financiación; con ello, buscaremos reducir sus actividades y desmantelar gradualmente a las organizaciones."
 SHA_conservative_army_reform: "Fomentar el orgullo de Shanhaijing"
 SHA_conservative_army_reform_desc: "Muchos no reconocen adecuadamente cuán grandiosa es Shanhaijing. Shanhaijing presume una larga historia y tradición, y muchísimas personas viven en una comunidad feliz bajo su protección. Sin embargo, si ese hecho no se difunde ampliamente, podría convertirse en una amenaza para la cohesión de la comunidad. Por ello, con el fin de fomentar el orgullo por Shanhaijing y fortalecer el sentido de unidad comunitaria, planeamos producir y distribuir diversos materiales de propaganda."
 SHA_conservative_xuanwu_merchant_association: "Una Black Tortoise Promenade 'conservadora'"
 SHA_conservative_xuanwu_merchant_association_desc: "Akashiro Rumi es una figura con un reconocimiento tan alto dentro de Shanhaijing que resulta imposible ignorarla. Encerrarla sin más podría, por el contrario, traducirse en una caída del apoyo al gobierno. Por lo tanto, la Puerta del Dragón Negro enviará a personas de inclinación 'conservadora' a la Black Tortoise Promenade para encargarse de la vigilancia y el control internos, gestionando de forma eficaz la influencia de Rumi."
 SHA_conservative_rule_of_law: "Expansión del punitivismo"
 SHA_conservative_rule_of_law_desc: "El valor más importante en una comunidad es la 'estabilidad'. No podemos mostrar piedad alguna a los criminales que la amenazan. Aunque el método pueda parecer estricto y severo, para proteger el orden comunitario es necesario imponer castigos firmes a los delincuentes y brindar un alivio real a las víctimas. Para una sociedad estable, las penas punitivas son inevitables."
 SHA_conservative_purge_of_decadent_culture: "Erradicar la cultura decadente"
 SHA_conservative_purge_of_decadent_culture_desc: "El arte moderno y el arte de la Tierra son como un veneno que carcome a Shanhaijing. Esta cultura decadente y lujosa no aporta nada al desarrollo de Shanhaijing. Todas las obras de arte decadentes deben ser destruidas y la cultura propia de Shanhaijing debe revivir. Muchos intelectuales y artistas deben ser obligados a contribuir a la sociedad levantando un martillo en lugar de una pluma."

 SHA_conservative_clash_of_civilizations: "Continuar la guerra santa"
 SHA_conservative_clash_of_civilizations_desc: "El tiempo apremia y el enemigo no cae con facilidad. Ha llegado el momento de movilizar a las estudiantes de Shanhaijing de forma más amplia para romper las líneas defensivas del enemigo y asestar un golpe decisivo en su corazón. Puede que esta decisión no reciba el apoyo de todos, pero, bajo los valores de la gran revolución conservadora, la convicción de liberar a Kivotos de la plaga y el caos debe estar por encima de todo."

 SHA_conservative_revolution_ns: "Revolución conservadora de Shanhaijing"
 SHA_conservative_revolution_ns_change: "Modificadores de §Y$SHA_conservative_revolution_ns$§!"
 SHA_conservative_revolution_modifier: "$SHA_conservative_revolution_ns$"

