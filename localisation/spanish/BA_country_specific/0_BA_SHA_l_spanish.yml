 SHA_Establishment_of_the_Governor_General: "Gobierno General de Hyakki Yakō"
 SHA_Establishment_of_the_Governor_General_desc: ""
 SHA_Establishment_of_the_Governor_General_tt: "Efecto temporal activado mientras se posee cualquier §Y@HYA[HYA.GetAdjective]§! territorio central."
 SHA_industrial_exploitation: "Explotación industrial"
 SHA_industrial_exploitation_desc: ""
 SHA_Leave_SHA: "Expulsión de miembros de Hyakki Yakō de la academia"
 SHA_Leave_SHA_desc: ""
 SHA_the_third_kivotos: "El Tercer Kivotos"
 SHA_the_third_kivotos_desc: "Shanhaijing y Hyakki Yakō han estado situados en la periferia geográfica de Kivotos. Esta característica geográfica ha sido una ventaja para desarrollar nuestra cultura e identidad únicas. Liberándonos de la sombra de las tres grandes academias (Gehenna, Trinity, Millennium) y los Primeros y Segundos Kivotos formados bajo su influencia, proclamaremos un nuevo Tercer Kivotos libre de los órdenes establecidos."
 SHA_Liberation_of_South_Kivotos: "Liberación de Kivotos del Sur"
 SHA_Liberation_of_South_Kivotos_desc: ""
 SHA_Utopia: "Utopía"
 SHA_Utopia_desc: "Bajo batallas sangrientas, Kivotos del Sur se ha unificado como una sola academia. Todos alzan sus copas celebrando la unificación, llenos de alegría. Hemos alcanzado la utopía de todos, y todos los habitantes de Kivotos del Sur vivirán en prosperidad y seguridad."

