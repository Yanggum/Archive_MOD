 SHA_Kirchenbeitragsgesetz_desc: "'Kirchenbeitragsgesetz' (Ley de contribución eclesiástica) es un sistema legal de Austria que permite a las organizaciones religiosas reconocidas cobrar a sus fieles una contribución de cierto monto. Esta contribución no es un impuesto, sino una obligación derivada de la afiliación voluntaria; la recaudación la realiza la propia organización religiosa, y el Estado proporciona el fundamento legal. A través de esto, haremos que la Iglesia se autofinancie; y, a cambio, la gravaremos para materializar el principio del secularismo."
