 SHA_Trinity_Tea_Party: "Importación de hojas de té"
 SHA_Trinity_Tea_Party_desc: "Recientemente, a medida que se ha intensificado el intercambio entre algunos estudiantes de Trinity y Shanhaijing, la popularidad del té negro ha aumentado de forma explosiva. Ahora los estudiantes han llegado al punto de no poder conseguirlo debido a la escasez. Ante esta situación, la Puerta del Dragón Negro romperá las costumbres tradicionales y solicitará oficialmente a Trinity la importación de té negro."
