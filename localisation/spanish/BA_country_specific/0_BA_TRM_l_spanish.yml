 TRN_inefficient_bureaucracy_idea_desc: "Los problemas administrativos causados por la inexperiencia del personal de reemplazo han sido resueltos. El tiempo, la solución más eficiente y segura, ha incrementado la pericia de nuestra gente. Misono Mika y su administración ahora operan con individuos altamente patrióticos, leales y profesionales. Un engranaje bien ensamblado sigue girando diligentemente hoy, por el desarrollo de Trinity."
 TRN_Inefficient_bureaucracy: "Gestión administrativa: §RInexperta§!"
 TRN_Inefficient_bureaucracy_desc: "Ya no queda nadie dentro de Trinity capaz de obstaculizar a Misono Mika y su sublime causa. Con benevolencia, ella permitió que quienes albergaban pensamientos subversivos regresaran a la Madre Naturaleza mediante métodos 'apropiados'. Sin embargo, por desgracia, el vacío dejado por esos traidores incompetentes ha provocado más problemas de los que esperábamos. Estamos llenando esos puestos con leales para restaurar la capacidad administrativa del gobierno, pero parece que necesitarán tiempo para volverse tan competentes como antes."
