 TRN_after_war_event.20.t: "Establecimiento de la Administración Militar-Civil"
 TRN_after_war_event.20.desc: "La Administración Militar-Civil es un sistema administrativo establecido por Trinity para colocar por completo a la academia Gehenna bajo su control, y posee amplias competencias, desde la justicia hasta la administración. Este sistema contribuye a mantener el orden en la región de Gehenna y a reforzar la influencia de Trinity, pero al mismo tiempo provoca efectos secundarios al reprimir la libertad y autonomía de los estudiantes. Esto está generando una fuerte reacción y descontento entre los estudiantes de Gehenna.\n\nLos estudiantes de Gehenna expresan su resistencia al dominio de Trinity de diversas maneras. Entre ellas se incluyen métodos extremos, como amenazas contra burócratas o atentados dirigidos a instituciones administrativas. Estas acciones de resistencia se han extendido ampliamente entre los estudiantes de Gehenna, manifestándose como una expresión directa de hostilidad hacia el sistema.\n\nLa Justice Task Force de Trinity se esfuerza continuamente por reprimir esta situación. Desde la detección de actos terroristas hasta arrestos y detenciones inmediatas, el proceso avanza con rapidez, pero la resistencia no se apaga; por el contrario, parece estar organizándose cada vez más.\n\nEn la actualidad, el sistema de Administración Militar-Civil se orienta a la estabilidad y el control, pero si no se resuelve el conflicto con los estudiantes de Gehenna, los enfrentamientos continuos parecen inevitables."
 TRN_after_war_event.20.a: "Intentemos resolverlo lo antes posible."
 TRN_after_war_event.21.t: "Nombramiento del gobernador militar"
 TRN_after_war_event.21.desc: "La Administración Militar-Civil de Gehenna ha sido establecida. Sin embargo, al enfrentarnos a una resistencia inesperada, hemos concluido que, si no se trata de un funcionario excepcionalmente competente, será difícil superar este movimiento. En consecuencia, se han seleccionado dos candidatas.\n\nLa primera es Hanekawa Hasumi, de la Justice Task Force. Se le ha confiado un cargo clave por su actitud hostil hacia Gehenna y su excelente capacidad administrativa; es evaluada como una figura práctica que no muestra ambiciones de poder particulares. Aunque es hostil hacia Gehenna, en el ámbito oficial demuestra respeto hacia la otra parte, por lo que se le reconoce como una administradora equilibrada.\n\nLa segunda es Morizuki Suzumi, perteneciente a la vigilante local. Aunque está alejada del trabajo administrativo, ha llamado la atención por sus actividades prácticas, como patrullar habitualmente para mantener el orden público de Trinity, por lo que se la recomendó como la persona indicada para reprimir las actividades de resistencia de los estudiantes de Gehenna. También se ha confirmado que Suzumi no muestra ambiciones de poder especiales."
 TRN_after_war_event.21.a: "Hanekawa Hasumi. Su capacidad administrativa es confiable."
 TRN_after_war_event.21.b: "Morizuki Suzumi. Su labor de vigilancia será de ayuda."
 TRN_after_war_event.22.t: "Hasumi, satisfecha"
 TRN_after_war_event.22.desc: "Hanekawa Hasumi parece sentir una gran satisfacción por haber sido nombrada gobernadora militar de la Administración Militar-Civil de Gehenna. Respondió con una expresión muy complacida a la solicitud de entrevista de un reportero del periódico de Trinity, y la noticia fue publicada en la portada. Funcionarios del gobierno felicitaron su nombramiento, pero Kenzaki Tsurugi guardó silencio al respecto. Considerando su habitual postura de neutralidad política, no es algo particularmente sorprendente.\n\nSin embargo, también han surgido voces de preocupación sobre si la influencia de la Justice Task Force no se está expandiendo en exceso."
 TRN_after_war_event.22.a: "En cualquier caso, esperemos que haga bien su trabajo."
 TRN_after_war_event.23.t: "Suzumi, insatisfecha"
 TRN_after_war_event.23.desc: "Morizuki Suzumi declaró que sintió un profundo rechazo e incomodidad por haber sido elegida como gobernadora militar de la Administración Militar-Civil de Gehenna. Así lo comunicó directamente durante una entrevista con un reportero del periódico de Trinity.\n\nSuzumi rechazó la solicitud de entrevista en dos ocasiones, pero aceptó la tercera y expresó con franqueza sus verdaderos sentimientos.\n\nKenzaki Tsurugi, de la Justice Task Force, transmitió un mensaje de pesar a través de los medios. El hecho de que, quien solía guardar silencio sobre todos los incidentes, haya expresado una postura de forma inusual, está siendo considerado un cambio digno de atención."
 TRN_after_war_event.24.t: "Comité de Salvación Nacional por la Paz y el Orden"
 TRN_after_war_event.24.desc: "Mientras continuábamos administrando los territorios ocupados de Gehenna, el gobierno central de Trinity fue contactado por una organización especial. El Comité de Salvación Nacional por la Paz y el Orden es un grupo establecido para mantener la seguridad y el imperio de la ley después de que terminara la guerra entre Trinity y Gehenna, en un contexto donde el Student Council de Gehenna, la Pandemonium Society, quedó prácticamente desmantelado. La presidenta del comité es Himuro Sena y, dado que la mayoría de sus miembros provienen del Emergency Medicine Department, parece que dicho departamento ha decidido, en la práctica, cooperar con Trinity."
 TRN_after_war_event.24.a: "Cooperemos con ellos"
 TRN_after_war_event.25.t: "¡Atentado con bomba en Gehenna!"
 TRN_after_war_event.25.desc: "Se ha producido un incidente en el que una estudiante afiliada a Trinity arrojó explosivos contra civiles de Gehenna al azar, cometiendo un acto terrorista. La Justice Task Force respondió rápidamente y logró someter a la estudiante, pero los estudiantes de Gehenna afectados han reaccionado con fuerza y exigen compensaciones."
 TRN_after_war_event.25.a: "Compensad los daños al mínimo."
 TRN_after_war_event.25.b: "Compensad todos los daños."
 TRN_after_war_event.26.t: "Enfrentamiento en la región de Gehenna"
 TRN_after_war_event.26.desc: "Ha estallado otro tiroteo en Gehenna. Este incidente comenzó cuando guerrilleros pertenecientes a la Alianza de Resistencia Estudiantil emboscaron un convoy militar de Trinity.\n\nLas fuerzas separatistas, en su mayoría ex miembros del ejército de Gehenna, atacaron el convoy con tácticas relativamente sofisticadas. Bloquearon la ruta del convoy —compuesto por camiones y vehículos blindados— y lograron apoderarse de una cantidad considerable de armamento. Sin embargo, Trinity ha reforzado la vigilancia, y la próxima vez no se repetirá lo mismo."
 TRN_after_war_event.26.a: "Maldito sea..."
 TRN_after_war_event.27.t: "Protestas masivas en Gehenna"
 TRN_after_war_event.27.desc: "No todos los estudiantes de Gehenna participan en las protestas, pero una gran parte alberga una fuerte hostilidad hacia Eden. Estos sentimientos se agravan aún más por las acciones de la Justice Task Force y del ejército de tierra de Trinity, estallando esporádicamente en forma de protestas y huelgas.\n\nTras un reciente arresto injusto, una nueva ola de manifestaciones ha surgido en Gehenna. Los manifestantes han salido a las calles exigiendo el fin de la violencia policial y el respeto de sus derechos políticos."
 TRN_after_war_event.27.a: "Evitemos que el conflicto se agrave."
 TRN_after_war_event.27.b: "¡Arrestadlos!"
 TRN_after_war_event.28.t: "Movimiento de resistencia no violenta en toda Gehenna"
 TRN_after_war_event.28.desc: "Numerosos disidentes anti-sistema de Gehenna han salido a las calles con pancartas, bloqueando carreteras y alzando la voz. Exigen una relajación de las reformas legales, una ampliación de la autonomía de Gehenna e, incluso, la independencia de la academia."
 TRN_after_war_event.28.a: "Conceded algunas demandas."
 TRN_after_war_event.28.b: "Disolvedlo por la fuerza."
 TRN_after_war_event.28.c: "Ignoradlo."
 TRN_after_war_event.29.t: "Agitación socialista"
 TRN_after_war_event.29.desc: "En un mundo donde existe el Komintern, no es sorprendente que la retórica socialista se infiltre en el movimiento de resistencia de Gehenna.\n\nActualmente, el Komintern está instigando activamente la resistencia contra las 'fuerzas de ocupación de Trinity' para fomentar una revolución socialista en Gehenna. Armas de contrabando procedentes de estados socialistas están siendo entregadas a los estudiantes de Gehenna, y organizaciones socialistas también están empezando a hacerse visibles. Esto ya no es una posibilidad: está convirtiéndose en una realidad."
 TRN_after_war_event.29.a: "Malditos comunistas."
 TRN_after_war_event.30.t: "¡Atacaron al gobernador militar!"
 TRN_after_war_event.30.desc: "Hoy, se informó que el gobernador militar resultó herido tras ser atacado mientras realizaba una visita de inspección en Hannover. Se ha determinado que el autor fue una estudiante afiliada a la Alianza de Resistencia Estudiantil de Gehenna, actuando en solitario."
 TRN_after_war_event.30.a: "Es un incidente grave."
 TRN_after_war_event.40.t: "[FROM.GetAdjective] exige la devolución de territorios"
 TRN_after_war_event.40.desc: "[FROM.GetLeader], líder de [FROM.GetName], envió una notificación oficial exigiendo la devolución de territorios de Gehenna. Dado que recientemente [FROM.GetAdjective] ha proclamado la integridad territorial sobre las tierras de Gehenna, es muy probable que esta exigencia esté relacionada con ello."
 TRN_after_war_event.40.a: "Aceptad sus exigencias."
 TRN_after_war_event.40.b: "¡Esta región pertenece a [ROOT.GetAdjective]!"
 TRN_after_war_event.41.t: "[FROM.GetAdjective] ha devuelto los territorios de Gehenna"
 TRN_after_war_event.41.desc: "[FROM.GetAdjective] aceptó nuestras exigencias y decidió devolver los territorios de Gehenna. Parece tratarse de un intento de aliviar la tensión diplomática y mejorar las relaciones entre ambas partes."
 TRN_after_war_event.41.a: "¡Una victoria diplomática!"
 TRN_after_war_event.42.t: "¡[FROM.GetAdjective] ha rechazado nuestras exigencias!"
 TRN_after_war_event.42.desc: "[FROM.GetAdjective] rechazó cortésmente nuestras exigencias y declaró que, basándose en su reivindicación de soberanía sobre los territorios de Gehenna, no puede aceptar las pretensiones de [ROOT.GetAdjective]."
 TRN_after_war_event.42.a: "Entonces, solo queda la guerra."
