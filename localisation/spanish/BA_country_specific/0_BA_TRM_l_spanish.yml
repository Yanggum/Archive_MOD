 TRM_Trinity_Grande_Armee: "La Gran Armada de Trinity"
 TRM_Trinity_Grande_Armee_desc: "A medida que Trinity ha librado innumerables guerras, han aumentado los soldados con amplia experiencia en combate real. Esa experiencia se convirtió en un excelente manual, y a partir de esos manuales surgieron soldados profesionales y oficiales especializados dentro de Trinity.\n\nMientras Trinity se consolidaba como vencedora final y afianzaba su hegemonía sobre Europa, la Gran Armada no dejó de desarrollarse. Mediante despliegues e intervenciones constantes, ha reunido experiencia y diversa información, y también ha llegado a contar con instalaciones dedicadas a la formación especializada.\n\nLa Gran Armada es el verdadero origen de Trinity, el grupo que condujo a Trinity a la victoria. Diga quien diga lo que diga, su poder y su progreso incesante son hechos que nadie puede negar."
