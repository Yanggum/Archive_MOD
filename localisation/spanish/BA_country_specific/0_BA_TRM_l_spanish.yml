 TRM_Iron_Sword_Operations_Categorie: "철검 작전"
 TRM_Iron_Sword_Operations_Categorie_desc: "\n\n£GFX_decisison_TRN_idolization_picture\n\n\n\n\n트리니티에는 아직 위협이 도사리고 있습니다. 의문의 세력들이 트리니티의 배후에서 활동하며 우리의 안정을 위협하고 있습니다. 비밀경찰들과 협력하여 우리의 그림자 속에 숨은 배후를 색출해내고 파괴해야합니다."
