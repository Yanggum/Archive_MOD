 TRN_Misono_Mika_DESC_2: "Misono Mika era una miembro del Tea Party con una sonrisa brillante e inocente. Pero, ¿quién podría haber imaginado que todas esas facetas no eran más que una actuación meticulosamente calculada?\n\nMisono Mika había odiado a Gehenna desde hacía mucho tiempo. No podía entender cómo alguien podía confiar en esos seres con cuernos, y en especial tuvo numerosos enfrentamientos con Kirifuji Nagisa, quien insistía en firmar la paz con Gehenna.\nSin embargo, aunque existieron muchos conflictos, ella nunca intentó arrebatar el poder por la fuerza ni llevó a cabo un golpe de Estado. Porque Kirifuji Nagisa era para Misono Mika una amiga de la infancia preciosa y su única amiga.\n\nPara ella, el incidente del 'Gran Traslado' fue un acontecimiento que transformó su vida por completo. Que todo Kivotos cayera en el continente llamado Europa fue, tal vez, una oportunidad para ella. La oportunidad de obtener toda la autoridad del Tea Party y expulsar a los demonios de Gehenna.\n\nPero por muy astuta que fuera, en el fondo seguía siendo una niña. Aunque se hubiera aliado con los nacionalsocialistas, consideraba que sus acciones y métodos eran demasiado extremos, y aunque deseaba controlarlos, no pudo hacerlo debido a su corazón débil.\n\nCuando, pocos días después de que Kirifuji Nagisa fuera confinada en una habitación a causa del golpe de Estado de Mika, se emitió la orden de 'reclusión', fue entonces cuando Mika comprendió por primera vez qué era lo que realmente estaba haciendo.\n\nSus huellas se tiñeron de rojo, y su voz se volvió vacía.\nInnumerables personas desaparecieron bajo su nombre, y el miedo y la ira de la gente se dirigieron hacia ella.\nAunque tuvo innumerables oportunidades para detenerse, nunca lo hizo, y ahora la locura ha escapado de sus manos y ha comenzado a teñirlo todo por sí sola.\n\nBajo el nombre del nacionalsocialismo, Trinity no se detuvo.\nLos primeros en desaparecer fueron los judíos y las minorías étnicas.\nPorque la sangre impura no podía ser tolerada en la sagrada Trinity.\nDespués vinieron aquellos que se resistieron a ella.\nEn el glorioso futuro de Trinity, la debilidad no era necesaria.\nFinalmente, fueron los restos que permanecían en las tierras ocupadas por Trinity.\nTodos ellos desaparecieron en la oscuridad, dentro de los muros creados por sus órdenes.\n\nAl final, los Cuatro Jinetes del Apocalipsis que ella desató arrasaron con todo lo que existía en Kivotos.\nBajo su reinado, la noche continuará para siempre.\nMientras esperan un amanecer que nunca llegará, los supervivientes solo desean desesperadamente que este fuego incontenible no lo consuma todo.\n\nSeñor, ten piedad.(Kyrie, eleison)"
 #트리니티 국가중점#
  TRM_focus_tree: "Árbol de enfoques básicos de Trinitas"
 TRN_nagisa_focus: "Árbol de la Dama de Hierro"
 TRM_newfocus_0: "Respuesta ante la crisis"
 TRM_newfocus_0_desc: "Nuestra academia, a causa de un fenómeno sobrenatural o un experimento extraño, ha sido transportada a otro mundo. La ubicación exacta es desconocida, la conexión con otras academias sigue viva, pero las instalaciones industriales y ferroviarias necesarias para el funcionamiento normal se han derrumbado."
 TRM_newfocus_1: "Calmar a los estudiantes"
 TRM_newfocus_1_desc: "Nuestra academia ha sido transportada a un lugar desconocido debido a un fenómeno sobrenatural. Este fenómeno aún no ha remitido por completo y sigue causando disturbios en nuestra sociedad. Es imperativo comunicar la verdad y arrestar a quienes inciten al caos para mantener el orden."
 TRM_localization: "Localización de Trinitas"
 TRM_localization_desc: "Tras la Gran Transposición, debemos llevar a cabo de inmediato una reestructuración industrial adaptada a este mundo."
 TRN_economic_adjustment: "Disciplina industrial"
 TRN_economic_adjustment_desc: "Apoyaremos el desarrollo de las tecnologías industriales básicas para impulsar la industrialización de Trinitas."
 TRN_trade_union: "Garantizar la actividad sindical"
 TRN_trade_union_desc: "Debemos garantizar los derechos de los trabajadores reprimidos durante el desarrollo industrial de Trinitas."
 TRM_newfocus_3: "Buscar un compromiso"
 TRM_newfocus_3_desc: "Hemos tenido constantes conflictos con los locales. Aunque logramos la victoria, el resentimiento persiste. Ahora debemos negociar un compromiso, con Tsurugi Kenzaki como representante."
 TRM_newfocus_4: "Análisis"
 TRM_newfocus_4_desc: "Con la cooperación del Club de Biblioteca y otros, hemos confirmado que este es un mundo completamente distinto. Es mejor saber la verdad que ignorarla. La reunión de emergencia del Té Party está por concluir, y es hora de elegir una nueva anfitriona."
 TRN_Request_assistance_from_Sisterhood: "Persuadir a la Hermandad"
 TRN_Request_assistance_from_Sisterhood_desc: "[TRM.GetLeader] pedirá ayuda a la Hermandad para estabilizar Trinitas tras la destitución de Mika Misono y la facción Pater."
 TRN_Request_assistance_from_relief_knights: "Persuadir a los Caballeros de Socorro"
 TRN_Request_assistance_from_relief_knights_desc: "[TRM.GetLeader] contactará con los Caballeros de Socorro, sucesores de la antigua facción Johan, para cubrir el vacío administrativo."
 TRN_suppress_the_opposition: "Suprimir las facciones"
 TRN_suppress_the_opposition_desc: "Eliminaremos a las facciones internas para ampliar la influencia de la facción Filius y asegurar la estabilidad de Trinitas."
 TRN_Trinitys_Balance: "El equilibrio de Trinitas"
 TRN_Trinitys_Balance_desc: "Lograremos la estabilidad mediante una política equilibrada que impida acciones dictatoriales de una sola facción."
 TRN_nagisa_coupdetat: "Golpe de estado de la guardia"
 TRN_nagisa_coupdetat_desc: "Con Nagisa encarcelada, la facción Filius debe liberarla con ayuda de las facciones aliadas y arrestar a Mika Misono."
 TRN_nagisa_lottery: "Restauración de Nagisa"
 TRN_nagisa_lottery_desc: "Liberaremos a Nagisa de su encarcelamiento injusto y designaremos a la nueva presidenta del consejo estudiantil."
 TRN_new_trinity: "La nueva estrella de Trinitas"
 TRN_new_trinity_desc: "Ahora que los disturbios han cesado, podemos establecer los nuevos principios de Trinitas."
 TRN_trinity_reorganization: "Reestructuración de Trinitas"
 TRN_trinity_reorganization_desc: "Nagisa Kirifuji ha eliminado a las amenazas a Trinitas. La academia será reconstruida bajo su protección."
 TRN_stabilization_of_the_system: "Estabilización del sistema"
 TRN_stabilization_of_the_system_desc: "El sistema tradicional de Trinitas seguirá vigente y estable a pesar de los cambios."
 TRN_decentralization_of_power: "Descentralización del poder"
 TRN_decentralization_of_power_desc: "Para evitar crisis futuras, reformaremos la estructura de poder excesivamente centralizada en el Té Party."
 TRN_trinity_tank_brigade: "Brigada de tanques de Trinitas"
 TRN_trinity_tank_brigade_desc: "Trinitas necesita tanques, muchos tanques, y entrenaremos a todos los estudiantes para operarlos."
 TRN_trinity_supremacy_focus: "Hegemonía de Trinitas"
 TRN_trinity_supremacy_focus_desc: "Trinitas tiene razones para aspirar a una posición dominante en el escenario internacional."
 TRN_guardian_of_the_academy_focus: "Guardiana de la academia"
 TRN_guardian_of_the_academy_focus_desc: "Nagisa reforzará la defensa de Trinitas para estar lista ante cualquier conflicto."
 TRN_threat_exclusion: "Eliminar la amenaza"
 TRN_threat_exclusion_desc: "Ahora que conocemos la existencia de Arius, no podemos permitir que sigan. Acabaremos con su academia."
 TRN_preventive_war: "Guerra preventiva"
 TRN_preventive_war_desc: "Polonia, con ambiciones de recuperar territorios perdidos, representa una amenaza que debemos neutralizar."
 TRN_nazi_oppression: "Erradicación nazi"
 TRN_nazi_oppression_desc: "Erradicaremos al NSDAP, que sembró el caos en Trinitas aliándose con Mika."
 TRN_Reunion_of_the_Treaty_of_Eden: "Reunión del Tratado de Edén"
 TRN_Reunion_of_the_Treaty_of_Eden_desc: "Reanudaremos las negociaciones del Tratado de Edén para alcanzar un acuerdo global entre Trinitas y Gehenna."
 TRN_Treaty_of_Eden: "Formación del Tratado de Edén"
 TRN_Treaty_of_Eden_desc: "Concluimos las negociaciones y declaramos el éxito del Tratado de Edén."
 TRN_establishment_of_the_eden_treaty_organization: "Paz y coexistencia"
 TRN_establishment_of_the_eden_treaty_organization_desc: "Las delegaciones de Gehenna aceptaron el tratado. Pronto nos dirigiremos hacia la paz y la coexistencia."
 TRN_joint_economic_development: "Desarrollo industrial conjunto"
 TRN_joint_economic_development_desc: "En virtud del tratado, mejoraremos la industria de las naciones firmantes en cooperación con Gehenna."

 TRN_war_with_Gehenna: "Incompatibles"
 TRN_war_with_Gehenna_desc: "La Academia Gehenna ha despreciado durante mucho tiempo nuestros intentos por un Tratado de Edén, llegando incluso a expulsar a nuestra delegación. Es hora de cambiar nuestra actitud diplomática. Ha llegado el momento de dar una lección a esos demonios engreídos."
 TRN_anti_german_anti_gehenna: "Anti-Gehenna, Anti-Alemania"
 TRN_trinity_movement: "Movimiento Trinitas"
 TRN_the_dignity_of_the_empire: "La dignidad del imperio"
 TRN_pro_trinity_volunteer_corps: "Cuerpo de voluntarios nacionales"
 TRN_our_homeland: "Nuestra patria"
 TRN_crusade_against_the_trinity: "Cruzada contra Trinitas"

 TRN_deep_hatred: "Odio profundo"
 TRN_deep_hatred_desc: "Ahora que la guerra contra Gehenna ha comenzado, el odio profundamente arraigado contra Gehenna en Trinitas puede utilizarse como herramienta."
 TRN_Confirmation_of_intention_to_treaty: "Confirmación de intención del tratado"
 TRN_Confirmation_of_intention_to_treaty_desc: "Tras la Gran Transposición, Gehenna ha experimentado confusión interna. Aunque su anterior liderazgo era favorable al Tratado de Edén, la situación actual podría ser diferente. Enviaremos una delegación para confirmar su disposición."
 TRN_Gehenna_Trinity_Conference: "Gran compromiso"
 TRN_Gehenna_Trinity_Conference_desc: "Dado que la creación de la organización del Tratado de Edén se ha visto comprometida, debemos iniciar largas negociaciones con Gehenna. El Ministerio de Asuntos Exteriores espera que las conversaciones concluyan con éxito."
 nagisa_imprisoned_flag: "§R¡Nagisa encarcelada!§!"
 TRM_newfocus_21: "Neutralizar a Nagisa"
 TRM_newfocus_21_desc: "Para tomar el control completo de Trinitas, es necesario neutralizar a Nagisa Kirifuji, actual anfitriona interina del Té Party, y encarcelarla."
 TRN_nagisa_cahin_tt: "§t¡Ha llegado el momento del juicio!§!"
 TRN_nagisa_cahin_2_tt: "§Y¡Nagisa Kirifuji§! ya no puede acceder a las funciones del Té Party."
 TRM_newfocus_7: "El encuentro"
 TRM_newfocus_7_desc: "Con la transposición, ha surgido una nueva elección trascendental. Originalmente planeamos colaborar con Arius para un golpe, pero ahora debemos abandonar esa opción y, en cambio, cooperar con el NSDAP local para decidir el futuro de Trinitas."
 TRM_newfocus_26: "Reforma legal"
 TRM_newfocus_26_desc: "Las reglas actuales no favorecen nuestro control absoluto. Ahora que hemos barrido a la oposición y somos los anfitriones del Té Party, debemos ajustar las leyes a nuestra conveniencia."
 TRM_newfocus_28: "Consolidar el poder"
 TRM_newfocus_28_desc: "Tras la gran purga, nuestra influencia era aún limitada. Pero ahora que hemos eliminado a todos los que dudaban de nosotros, debemos asegurar el poder que corresponde a nuestra posición."
 TRM_newfocus_27: "Arcángel, Mika Misono"
 TRM_newfocus_27_desc: "La Academia Trinitas es una gran familia compuesta de facciones, y toda familia necesita una cabeza. La presidenta Mika Misono es esa líder, la persona destinada a erradicar la decadencia del viejo orden y guiarnos hacia el futuro."
 TRM_newfocus_33: "§tSilencio§!"
 TRM_newfocus_33_desc: "[TRN_scripted_loc]"
 TRN_desc_after_localization_key: "La presidenta Mika Misono, incapaz de seguir tolerando el caos del Té Party y la decadencia de nuestra orgullosa Trinitas, decidió tomar las riendas por su cuenta, liderando al ejército y aplastando a la inepta cúpula dirigente. Prometió dedicar todo su ser a restaurar la grandeza de Trinitas, eliminando a todos los elementos corruptos y traidores."
 TRN_desc_before_localization_key: "§tClasificado§!"
 TRM_tail_chasing: "Cazando colas"
 TRM_tail_chasing_desc: "Hemos identificado a las fuerzas que socavan la estabilidad de Trinitas. Es hora de erradicarlas."
 TRM_arius_annex: "Recuperar Arius"
 TRM_arius_annex_desc: "Arius se convirtió en una zona hostil tras rechazar nuestra integración pacífica. Con la transposición, su ubicación ha quedado al descubierto. Debemos aplastar esta amenaza."
 TMR_anti_gehenna: "Propaganda anti-Gehenna"
 TMR_anti_gehenna_desc: ""
 TMR_support_with_germany: "Cooperación local"
 TMR_support_with_germany_desc: "Los alemanes locales conocen bien la región. Para que nuestra invasión de Gehenna tenga éxito, debemos apoyarnos en ellos para asegurar la ventaja estratégica."
 TRN_german_company_acceptance: "Aceptar empresas alemanas"
 TRN_german_company_acceptance_desc: "Aunque hay resentimiento, las empresas locales no han perdido su esencia. Con suficiente dinero, podemos ganarlas para nuestra causa."
 TRN_self_reliance: "Mejorar la industria académica"
 TRN_self_reliance_desc: "Depender de empresas alemanas es conveniente pero peligroso para nuestra influencia. Debemos centrar el crecimiento en nuestra propia industria."
 TRN_Trinity_Industrial_Development_Department: "Departamento de Desarrollo Industrial de Trinitas"
 TRN_Trinity_Industrial_Development_Department_desc: "Hemos decidido desarrollar nuestra industria. Crearemos un departamento especializado para liderar un enorme desarrollo económico."
 TRM_Endsige: "Victoria final"
 TRM_Endsige_desc: "La conquista final de Trinitas terminó clavando nuestra bandera en lo más profundo del corazón de Gehenna. Ahora debemos avanzar hacia el futuro."
 TRM_Endsige2: "Culto a la personalidad"
 TRM_Endsige2_desc: "Bajo el brillante liderazgo de Mika Misono, Trinitas alcanzó la victoria, la paz y la prosperidad. Su liderazgo merece ser venerado."
 TRM_Endsige2_tt: "\n§YMika Misono§! pierde todos sus rasgos."
 TRM_Endsige3: "Líder de Trinitas"
 TRM_Endsige3_desc: "Mika Misono declaró que el corazón de Trinitas son los estudiantes, y que debemos reorganizarlo en torno a ellos."
 TRM_Endsige7: "Salvadora"
 TRM_Endsige7_desc: "Mika Misono no solo nos salvó durante la Gran Transposición, sino que también nos defendió de las amenazas externas. Merece ser llamada 'Salvadora'."
 TRM_Endsige5: "\"Soberana\""
 TRM_Endsige5_desc: "A pesar de la paz aparente, siguen existiendo amenazas. En esta situación excepcional, quien decide las políticas es nuestra verdadera soberana, Mika Misono."
 TRM_Endsige4: "Defensora del pueblo germano"
 TRM_Endsige4_desc: "Mika Misono proclamó que el núcleo de Trinitas son los germanos, los Übermensch, cuyo ejemplo debemos seguir."
 TRM_Endsige6: "Declaración de la revolución nacional"
 TRM_Endsige6_desc: "Debemos avanzar más rápido hacia la perfección de los Übermensch, sacrificando a quienes no estén a la altura."
 TRM_Endsige8: "El nuevo amanecer de Trinitas"
 TRM_Endsige8_desc: "Siguiendo el ideal de Mika Misono, alcanzamos nuestro Edén. Todo está en perfecta armonía: pueblo, estado y líder unidos en una auténtica trinidad."
 TRN_ENDSIGE_TT: "§L¡Que florezca y prospere Trinitas, bajo la luz del esplendor!§!"
 TRN_kickstart_the_war_industry: "Arsenal de Edén"
 TRN_kickstart_the_war_industry_desc: "El arsenal de Edén es insuficiente para satisfacer la demanda de armas y municiones. Debemos construir más fábricas en áreas seguras."
 TRN_military_training: "Entrenamiento militar"
 TRN_military_training_desc: "Nuestros soldados aún no están preparados. Iniciaremos un gran entrenamiento para la guerra."
 TRN_muchabyeol_jingbyeong: "Ampliar el reclutamiento"
 TRN_muchabyeol_jingbyeong_desc: "Ampliar el reclutamiento"
 TRM_after_war: "Posguerra"
 TRM_after_war_desc: "Las orgullosas fuerzas de Trinitas clavaron su bandera en el corazón de Gehenna. Ahora debemos gestionar sus vastos territorios."
 TRM_germany_union: "Declaración de unión"
 TRM_germany_union_desc: "Las tierras de Gehenna son clave para la industria alemana, pero los recientes atentados dificultan su uso. Para resolver esto, declararemos la unión y calmaremos las tensiones."
 TRM_arius_attack: "Ultimátum a Arius"
 TRM_arius_attack_desc: "Arius es una región disidente. Hay motivos suficientes para aplastarlos y completar la integración."
 TRM_We_need_Denmark_milk: "Exigir Dinamarca"
 TRM_We_need_Denmark_milk_desc: "Dinamarca es estratégica, conecta el Mar del Norte y el Báltico y sirve como base contra Red Winter. Tomar su control mejorará nuestra posición en el norte."

 TRM_redwinter_war_goal: "Bejeowibung"
 TRM_redwinter_war_goal_desc: "[RED.GetAdjective] posee abundantes recursos naturales, vastos territorios y una enorme cantidad de árboles, lo que representa un enorme potencial como materia prima para la construcción de nuestro futuro. Sin embargo, están utilizando todo esto como un medio para presionarnos. Para poner fin a esta situación, debemos golpear primero y corregir su actitud arrogante.  "
 TRM_We_need_Denmark_milk_flag: "§Y[RED.GetAdjective]§! cede §Y[DEN.GetAdjective]§!"
 TRM_We_need_Denmark_milk_flag_tt: "Días actuales: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_We_need_Denmark_milk_flag_tt_NOT: "Días actuales: [?TRM_We_need_Denmark_milk_flag:days|Y0]"
 TRM_war_with_the_ussr: "Crepúsculo Rojo"
 TRM_war_with_the_ussr_desc: "[SOV.GetAdjective] es una existencia que representa una gran amenaza para el mundo. Son una fuerza de terror que tiene como objetivo expandir el comunismo por todo el planeta. Por lo tanto, nuestras fuerzas armadas deben atacarlos y salvar al mundo de las garras del comunismo.  "
 TRN_gwanryuje_jaijungbee_flag: "§Y$TRN_gwanryuje_jaijungbee$§! enfoque completado"
 TRN_gwanryuje_jaijungbee_flag_tt: "Días actuales: [?TRN_gwanryuje_jaijungbee_flag:days|Y0]"
 TRN_gunsu_sangsan_bub_flag: "§Y$TRN_gunsu_sangsan_bub$§! enfoque completado"
 TRN_gunsu_sangsan_bub_flag_tt: "Días actuales: [?TRN_gunsu_sangsan_bub_flag:days|Y0]"


 TRM_Iron_Sword_decision_search_up_cost: "£pol_power  §Y15§! £civ_factory  §Y1§!"
 TRM_Iron_Sword_decision_search_up_cost_blocked: "£pol_power  §R15§! £civ_factory  §R1§!"

 TRM_Last_Focus_trigger_tt: "§YTodas las academias§! están ocupadas por [ROOT.GetAdjective]"
 TRM_anti_gehenna_focus_1: "Aplastar a la resistencia"
 TRM_anti_gehenna_focus_1_desc: "Las actividades guerrilleras organizadas de los estudiantes de Gehenna se han convertido en una gran amenaza para el gobierno. Para aplastarlos, desplegaremos tropas en cada región y atacaremos sus principales bastiones. Con recopilación precisa de inteligencia y operaciones militares contundentes, desmantelaremos su organización y pondremos fin al caos rápidamente."
 TRM_anti_gehenna_focus_2: "Eliminar la resistencia de Gehenna"
 TRM_anti_gehenna_focus_2_desc: "Los estudiantes de la Academia Gehenna son, vistos positivamente, espíritus libres; pero negativamente, terroristas que amenazan al sistema. Tras la derrota de su academia, siguen sin aceptar el resultado y actúan como resistencia contra Trinity. Ahora debemos eliminarlos completamente y estabilizar el sistema."
 TRM_anti_gehenna_focus_3: "Establecer gobiernos militares"
 TRM_anti_gehenna_focus_3_desc: "Las actividades guerrilleras de los estudiantes de Gehenna persisten, rechazando el control del gobierno y resistiendo en cada región. Para reprimirlos, es eficaz imponer gobiernos militares en las zonas ocupadas. El uso decidido de la fuerza militar permitirá sofocar rápidamente la guerrilla y restaurar la autoridad gubernamental."
 TRN_gwanryuje_jaijungbee: "Reorganizar la burocracia"
 TRN_yungu_e_tuja: "Apoyar al Comité de Biblioteca"
 TRM_Library_Committee: "Fortalecer cooperación con el Comité de Biblioteca"
 TRM_Library_Committee_desc: "Fortalecer cooperación con el Comité de Biblioteca"
 TRN_gyungje_hyu_ul_bub: "Economía planificada"
 TRN_gunsu_sangsan_bub: "Ley de producción militar"
 TRN_jaegun_wanryu: "Boom industrial"
 TRN_gwanryuje_jaijungbee_desc: "En el proceso en que Misono Mika tomó el poder, muchos burócratas veteranos de Trinity fueron destituidos. Como resultado, la burocracia actual carece de experiencia y es ineficiente. Para corregir estas deficiencias, es indispensable una reorganización sistemática y profunda de la administración."
 TRN_yungu_e_tuja_desc: "Apoyar al Comité de Biblioteca"
 TRN_gyungje_hyu_ul_bub_desc: "La introducción de una economía planificada está fortaleciendo la eficiencia de los ministerios mediante una asignación clara de recursos y objetivos definidos, mejorando la productividad y la consistencia del sistema."
 TRN_gunsu_sangsan_bub_desc: "La Ley de Producción Militar busca reconstruir la industria bélica reducida y establecer una estructura eficiente y sostenible de producción mediante la cooperación con la burocracia y ministros alemanes."
 TRN_jaegun_wanryu_desc: "Boom industrial"
 TRN_nagisa_gyehek: "Un problema irresoluble"
 TRN_nagisa_gyehek_desc: "Kirifuji Nagisa desplegará toda su habilidad política para mantener en pie a Tea Party y Trinity, endureciéndose como una mujer de acero y continuando su férreo gobierno."
 TRN_Suppressing_mika: "Contener a Mika"
 TRN_please_shut_up: "Aplastar a Pater"
 TRN_Non_trinity_getout: "Eliminar amenazas externas"
 TRN_Hug_students: "Discurso público"
 TRN_anti_mika_cudeta: "Golpe de la Guardia"
 TRN_steel_of_woman: "La dama de hierro"
 TRN_united_academy: "Academia de acero"
 TRN_uber_alles: "Hegemonía de Trinity"
