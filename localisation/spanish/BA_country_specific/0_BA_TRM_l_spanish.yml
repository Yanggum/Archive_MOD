 TRN_idk_polish_getout_desc: "Los necios polacos aún codician nuestro territorio. Ha llegado el momento de corregir su arrogancia."
 TRN_communists_getout_desc: "Los demonios del norte y del este planean desgarrar nuestra bandera para alzar la suya. Hay que eliminarlos primero."
 TRN_first_we_need_practice_desc: "Gehenna es ahora nuestra amiga. Eso significa que tenemos más amigos y más días para divertirnos juntos."
 TRN_second_testing_for_united_safety_desc: "Las milicias de Trinity y la prefectura de Gehenna trabajan juntas para salvaguardar la unión. Gracias a ello, la unión es más segura que nunca."
