 TRN_KRUPP_steel_desc: "Krupp fue una empresa alemana famosa por su industria del acero y armamento. En particular, su tecnología de artillería era extremadamente avanzada, y la mayoría de los cañones usados por el ejército alemán eran fabricados por ellos. Por lo tanto, si les ofrecemos subsidios y cooperamos plenamente, es probable que puedan producir productos de alta calidad en consonancia con nuestra inversión."
 TRN_Siemens_grant_desc: "Las secuelas de la Gran Traslación han dejado muchas carreteras y ferrocarriles distorsionados. Movilizaremos las capacidades de Trinity para restaurar por completo esta infraestructura vital."
 TRN_Autobahn_desc: "Construcción de la Autobahn"
 TRN_KRUPP_ZIP_III_desc: "ZIP"
 TRN_military_industrial_complex_desc: "Para reforzar rápidamente nuestra capacidad militar, el gobierno colaborará estrechamente con las industrias de defensa para producir equipos militares de forma más eficiente y rápida. Para ello, ampliaremos el apoyo a las industrias de defensa, optimizaremos los procesos de producción y nos centraremos en el desarrollo tecnológico."
 TRN_Recovering_the_aftermath_desc: "Recuperación de las secuelas"
 TRN_yurijono_seia_ser: "Investigación"
 TRN_yurijono_seia_ser_desc: "El atentado contra Yurijono Seia fue lo bastante grave como para sacudir a la Tea Party y a Trinity: es la primera vez en la historia que un miembro de la Tea Party es atacado. Este incidente no puede ser simplemente encubierto, por lo que movilizaremos a la policía de Trinity para encontrar al culpable."
 TRM_TURIJONO_SEIA_TT: "§LIntensificaremos las investigaciones para dar con el culpable.§!\nSi §YNagisa Kirifuji§! no es la anfitriona de la Tea Party, se convierte en la anfitriona."
 TRM_JoJo_mika: "Eliminación de Heydrich"
 TRM_JoJo_mika_desc: "El Departamento de Justicia de Trinity, durante sus contactos con el NSDAP, accedió a varios secretos previamente desconocidos. Descubrieron la verdad detrás del atentado contra Yurijono Seia: detrás de ello estaba Reinhard Heydrich, a quien considerábamos aliado."
 TRN_yurijono_seia: "Un grave problema"
 TRN_yurijono_seia_desc: "Ha ocurrido un gran incidente: Yurijono Seia fue atacada y ahora se encuentra en estado de coma, hospitalizada."
 TRN_threat_up_of_europa: "Tensiones en Europa"
 TRN_threat_up_of_europa_desc: "Tensiones en Europa"
 TRN_trinity_arius_gaebal: "Integración de Arius"
 TRN_trinity_arius_gaebal_desc: "Integración de Arius"
 TRN_totar_war_focus: "Movilización total"
 TRN_totar_war_focus_desc: "Movilización total"
 TRM_domination: "Dominación"
 TRM_domination_desc: "Dominación"
 TRN_justice_task_force_training: "Militarismo de Trinity"
 TRN_justice_task_force_training_desc: "Militarismo de Trinity"
 TRN_radio_propaganda: "Lavado de cerebro por radio"
 TRN_radio_propaganda_desc: "Lavado de cerebro por radio"
 TRN_kickstart_the_civilian_industry: "Industria pesada"
 TRN_kickstart_the_civilian_industry_desc: "Para recuperarnos de los problemas internos o prepararnos para amenazas externas, es esencial reorganizar la infraestructura de la industria pesada."
 TRN_kickstart_the_autoban: "Construcción de la autopista"
 TRN_kickstart_the_autoban_desc: "Una autopista bien organizada es útil para el transporte y el suministro de tropas y suministros. Este plan, conocido entre los involucrados como la 'Autobahn de Trinity', contempla una gran autopista que conecta Turingia con Gdynia."
 TRN_civilian_industry: "Inversión industrial"
 TRN_civilian_industry_desc: "Para aumentar la calidad y cantidad del ejército y satisfacer su demanda de suministros, primero debemos invertir en la industria para asegurar un suministro adecuado."
 TRN_research_slot: "Expansión de laboratorios"
 TRN_research_slot_desc: "Ha pasado tiempo desde que superamos los daños económicos. Ahora debemos renovar y expandir nuestros laboratorios para recuperar el terreno perdido en ciencia y tecnología."
 TRN_Luftwaffe: "Integración de la Luftwaffe"
 TRN_Luftwaffe_desc: "Fusionaremos las cadenas de mando de la Fuerza Aérea de Trinity y la Luftwaffe para reorganizar un mando aéreo más eficiente."
 TRN_railway_focus: "Proyecto ferroviario de Trinity"
 TRN_railway_focus_desc: "En Alemania aún quedan muchas vías ferroviarias destruidas por las secuelas de la Gran Traslación. Crearemos y apoyaremos empresas ferroviarias para apaciguar las quejas de los alemanes y desviar su atención."
 TRN_sipjagunjeongsinbuhwal: "Orden de los Caballeros Templarios" 
 TRN_sipjagunjeongsinbuhwal_desc: "Orden de los Caballeros Templarios"
 TRN_gisauihon: "Espíritu de caballero"
 TRN_gisauihon_desc: "Espíritu de caballero"
 TRM_naechi: "Gestión de los problemas internos"
 TRM_naechi_desc: "Las crecientes tensiones internas en la academia tras la Gran Traslación dejan claro que existe un grupo conspirando contra Misono Mika y toda Trinity. Debemos arrestar e interrogar a algunos conspiradores para localizar a la organización y extirpar esta conspiración antes de que se propague como un cáncer."
 TRM_oetzi: "Reestructuración de la política exterior [TRM.GetAdjective]"
 TRM_oetzi_desc: "La política exterior tradicional de Trinity se centraba en mediar en los conflictos entre academias vecinas y estabilizar las relaciones con las academias de Kivotos. Este sistema de compromiso era idealista, pero la crisis de la Gran Traslación evidenció sus límites. Desde la llegada al poder de Misono Mika, este sistema se ha vuelto cada vez más ineficaz. Ha llegado el momento de abandonar esta política débil y reemplazarla por una dirección más fuerte y realista."
 TRN_railway_gun_focus: "Despliegue de cañones ferroviarios"
 TRN_railway_gun_focus_desc: "Con la llegada de los bombarderos, muchos cañones ferroviarios quedaron cubiertos de polvo en los almacenes. Aunque algunos expertos dicen que su época ya pasó, en la Europa no devastada por la Gran Traslación, los cañones ferroviarios aún pueden ser un medio de destrucción eficaz."
 TRN_GO_TO_EAST: "Expansión hacia el este"
 TRN_GO_TO_EAST_desc: "¡Vamos a por la Unión Soviética!"
 TRN_Uranprojekt: "Proyecto Uranio"
 TRN_Uranprojekt_desc: "Uno de los químicos que descubrió la fisión nuclear, Otto Hahn, fue el responsable del proyecto Uranprojekt. Si lo contratamos e invertimos más presupuesto para ejecutar una segunda fase del Uranprojekt, podremos completar las armas nucleares antes que cualquier otra nación."
 TRN_Fission: "Observación de la fisión nuclear"
 TRN_Fission_desc: "En el país que existía antes que nosotros, Alemania, existía un proyecto llamado 'Uranprojekt' para desarrollar armas nucleares. Si aprovechamos esto, podremos crear un arma milagrosa para dominar el mundo."
 TRN_Fission_tt: "§YFisión nuclear§! observada. El §Yliderazgo§! tomará una decisión."
 TRM_OTTO_HAN_EVENT: "§YFisión nuclear§! observada"
 TRN_Uranprojekt_name: "Proyecto Uranio"
 TRN_Uranprojekt_2: "Construcción de reactor"
 TRN_Uranprojekt_2_desc: "Para medir la masa crítica necesaria para la reacción nuclear, es indispensable construir un reactor. Procederemos a su construcción para garantizar experimentos eficaces."
 TRN_Uranprojekt_3: "Un destello deslumbrante"
 TRN_Uranprojekt_3_desc: "En el laboratorio del doctor Otto Hahn y su equipo de físicos nucleares se observó un destello deslumbrante. Este fenómeno indica que su experimento ha concluido con éxito y que pronto nacerá un arma capaz de terminar la guerra."
 TRN_Uranprojekt_4: "Investigación de proyectiles"
 TRN_Uranprojekt_4_desc: "Con las pruebas nucleares en marcha, también surge la necesidad de desarrollar un dispositivo para lanzar esta nueva arma."
 TRN_Uranprojekt_5: "Prueba de Trinity"
 TRN_Otto_han_tt: "§YOtto Hahn§! se convierte en asesor."
 TRN_Ausgleich: "Gran compromiso"
 TRN_Ausgleich_desc: "Gran compromiso"
 TRN_united_state_Eden: "Estados Unidos de Edén"
 TRN_united_state_Eden_desc: "Estados Unidos de Edén"
 TRN_Eden_union: "Unión de Edén"
 TRN_Eden_union_desc: "Unión de Edén"
 TRN_jachiejeopgeun: "Acceso a la autonomía"
 TRN_seondobuwageorae: "Acuerdo con la Oficina de Liderazgo"
 TRN_dongari_tonghap: "Unificación de clubes"
 TRN_ireumppuni_anin_yeonbang: "Una unión no solo de nombre"
 TRN_oebureulhyanghayeo: "Hacia el exterior"
 TRM_Trinity_socialism: "Socialismo trinitario"
 TRM_Trinity_socialism_desc: "Los estudiantes de Trinity no son anarquistas maliciosos, sino socialistas en esencia a través de la conciencia comunitaria, la disciplina, la productividad y el sacrificio personal por el bien del Estado. Debemos adoptar esto como la ideología del nuevo régimen. En la nueva Trinity, tanto las empresas como los trabajadores trabajarán por el beneficio común."
 TRN_Reichland_Solution: "La solución de Trinity"
 TRN_Reichland_Solution_desc: "Para eliminar por completo la injerencia política de los clubes y utilizar al 100% los recursos de estos grupos, disolveremos todos los clubes y los reestructuraremos bajo la autoridad del Tea Party."
 TRM_Trinity_Supremacy: "Supremacía de Trinity"
 TRM_Trinity_Supremacy_desc: "Las incertidumbres del régimen de compromiso aumentaron las dudas sobre nuestra política exterior. Tras el cataclismo, estallaron como una bomba. Es hora de admitir el fracaso del idealismo y restaurar la supremacía de Trinity."
 TRM_war_preparations: "Preparativos de guerra"
 TRM_war_preparations_desc: "Declarar nuestra supremacía ha elevado la tensión con los vecinos. Debemos revisar nuestras fuerzas, aumentar las reservas y preparar todo para la guerra. Cuando suenen los disparos, estos esfuerzos nos serán útiles."
 TRM_reorganize_secret_services: "Servicio de seguridad de Trinity"
 TRM_reorganize_secret_services_desc: ""
 TRM_southern_offensive: "Ofensiva sur"
 TRM_southern_offensive_desc: "Al sur hay academias menores como [ABY.GetAdjective] y [HYA.GetAdjective], verdaderas bombas de relojería. No podemos dejar que el tiempo las detone, ni esperar un cambio pacífico indefinido."
 TRM_SANHAIJING_offensive: "Guerra contra [SHA.GetAdjective]"
 TRM_SANHAIJING_offensive_desc: "Estamos destinados a unificar a los alemanes. Muchos austriacos alemanes ansían nuestra intervención y unión. Aunque no todos lo deseen, debemos invadir para cumplir ese gran destino."
 TRM_SMO_for_Abydos: "Invasión de Abydos"
 TRM_SMO_for_Abydos_desc: "Seamos francos: Abydos es una academia menor con solo cinco estudiantes. ¿Qué pueden hacer? Tomaremos su territorio por la fuerza."
 TRM_demand_ostrava: "Exigir [74.GetName]"
 TRM_demand_ostrava_desc: "[74.GetName] alberga muchos alemanes reprimidos por Hyakkiyako. Tenemos el deber de integrarlos y protegerlos. Exigiremos su unión por medios legítimos."
 TRM_form_Shanhaijing_Eden_axis: "Pacto Shanhaijing-Trinity"
 TRM_form_Shanhaijing_Eden_axis_desc: "Shanhaijing es uno de los pocos estados de Kivotos que ha adoptado el fascismo, lo que lo convierte en un aliado estratégico natural para Trinity."
 TRM_form_Rome_Eden_axis: "Alianza con [ITA.GetAdjective]"
 TRM_form_Rome_Eden_axis_desc: "[ITA.GetLeader], de [ITA.GetAdjective], es considerado el creador original del fascismo, casi un dios primigenio. Aliarnos con él fortalecerá nuestra legitimidad y enorgullecerá a nuestro pueblo."
 TRM_Wehrmacht_absorption: "Absorber la Wehrmacht"
 TRM_Wehrmacht_absorption_desc: "La Wehrmacht aún no está completamente desmantelada y sigue causando problemas. En vez de rechazarla, la integraremos en nuestras fuerzas terrestres, inspirando su lealtad y usándola para propaganda."
 TRM_bribe_senior_officers: "Sobornar oficiales superiores"
 TRM_bribe_senior_officers_desc: "Aunque muchos soldados de la Wehrmacht ya están en nuestras filas, faltan oficiales para comandarlos. Como la mayoría tienen inclinaciones capitalistas, podemos ganarlos ofreciéndoles incentivos económicos."
 TRM_Anti_Gehenna_Pro_Geramny: "Antigehenna y proalemán"
 TRM_Anti_Gehenna_Pro_Geramny_desc: "Debemos dejar claro que nuestro objetivo son los demonios de Gehenna, no los alemanes. Así podremos sembrar inquietud entre los alemanes de Gehenna y ganarnos su apoyo cuando ataquemos."
 TRM_invasion_of_devils: "Invasión demoníaca"
 TRM_invasion_of_devils_desc: "Ocurrió lo temido: Gehenna nos ha atacado. Debemos prepararnos para la guerra de inmediato."
 TRM_war_with_gehenna: "Operación militar especial"
 TRM_war_with_gehenna_desc: "Gehenna ha sido hostil durante mucho tiempo y sus provocaciones son intolerables. Bajo el pretexto de una 'operación militar especial', la atacaremos y remodelaremos su gobierno."
 TRM_invade_benelux: "Recuperar el control de [35.GetCapitalVictoryPointName]"
 TRM_influence_the_benelux: "Nuevos amigos fascistas"
 TRM_fate_of_slovakia: "Destino de Eslovaquia"
 TRM_balkan_seeking_collaborators: "Buscar colaboradores en los Balcanes"
 TRM_invade_balkan: "Intervención en los Balcanes"
 TRM_operation_of_Terra_Recta: "Operación Terra Recta" 
# Terra Recta (“Tierra recta”): sugiere que Trinity purifica o reorganiza Italia
 TRM_Invasion_of_Millennium: "Situación Azul"
 TRM_war_with_Swiss: "Operación Tannenbaum"
 TRM_Invasion_of_Poland: "Situación Blanca"
 TRM_maintain_a_compromise_system: "Nuevo sistema de compromiso"
 TRM_maintain_a_compromise_system_desc: "Por supuesto, el sistema de compromiso no fracasó por completo. Hubo aspectos que funcionaron, así que en lugar de desecharlo por completo, si corregimos sus carencias y reforzamos sus puntos débiles, puede renacer como una política exterior más sólida y realista. Lo importante es reconocer el fracaso y definir claramente la dirección a seguir."
 TRM_Trinity_Redwinter_Pact: "Pacto de no agresión con [RED.GetAdjective]"
 TRM_Trinity_Redwinter_Pact_desc: "Firmar un pacto amistoso y de no agresión con [RED.GetAdjective] puede parecer contrario a nuestra política actual, pero los beneficios potenciales lo justifican. Además, si estalla la guerra contra Gehenna, mitigaremos la amenaza de un conflicto con [RED.GetAdjective], minimizando su injerencia en nuestras futuras políticas."
 TRM_alliance_with_the_redwinter: "Alianza siniestra"
 TRM_alliance_with_the_redwinter_desc: "Quizá podamos dejar de lado las diferencias ideológicas con [RED.GetAdjective] y enfatizar nuestro odio común hacia los estados decadentes y obsoletos de Kivotos y hacia el mundo entero. Aliarnos con [RED.GetAdjective] nos dará acceso a todos los recursos que necesitamos, incluida su fuerza militar."


