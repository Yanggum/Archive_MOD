 TRN_aftermath_desc: "El Gran Traslado. Se refiere al suceso en el que toda Kivotos —incluida Trinity— llegó a otro mundo: la Tierra. Lo que dejó tras de sí fue que la mayor parte de la industria de Trinity quedó paralizada o, por utilizar estándares incompatibles con este mundo, se averió en cuestión de días.\n\nHasta ahora, la industria de este mundo y la de Kivotos han alcanzado un nivel relativamente similar, pero las secuelas del Gran Traslado continúan y nos atormentan."
