 TRM_event.1.t: "Reunión de emergencia del Tea Party"
 TRM_event.1.desc: "\"¿Hmm? ¿Nagisa-chan? Es la primera vez que me llamas a estas horas... ¿Qué sucede?\"\n\"Mika... ahora estamos en una situación peligrosa.\"\n\"Seia tiene razón, señorita Mika.\"\n\"Nagisa-chan...\"\n\nNagisa no pudo más y apoyó a Seia, cortando las bromas de Mika. Cuando Mika finalmente guardó silencio, Nagisa comenzó a explicar la situación.\n\n\"Nuestra academia… no, toda Kivotos, cayó en un lugar desconocido, tal vez por una broma de alguien, o por un fenómeno sobrenatural. Allí, personas parecidas a nosotros pero sin halo nos amenazaron con armas y un idioma incomprensible, pero al final logramos defendernos. Y mientras luchábamos contra los habitantes de ese otro mundo, descubrimos que también nosotros enfrentamos una amenaza de muerte.\"\n\n\"Por eso hemos convocado esta reunión de emergencia.\"\n\"¿Tienen algo que decir al respecto, señorita Mika? ¿Señorita Seia?\"\n\n\"Ehm...\"\n\"No tengo nada que decir.\"\n\nPasaron unos momentos en silencio. Mika intentó abrir la boca para decir algo y romper la tensión, pero las palabras no le salieron fácilmente.\n\nAsí terminó la Primera Reunión de Emergencia del Tea Party."
 TRM_event.1.a: "..."

 TRM_event.2.t: "Emergencia"
 TRM_event.2.desc: "La noticia del consejo estudiantil se extendió rápidamente por toda Kivotos. Que aquella que siempre resolvía todos los problemas hubiera dejado su puesto y desaparecido fue un shock tremendo, que también alcanzó a Trinity."
 TRM_event.2.a: "Y una mujer sonrió."

 TRM_event.3.t: "Segunda reunión"
 TRM_event.3.desc: "\"Con esto damos por terminada la segunda reunión...\"\n\"¿Ya terminó? ¡Entonces me voy!\"\n\"¡Mika...!\"\n\n¿Cuándo empezó la desconfianza? Mika Misono, al terminar cada reunión, no sólo evitaba la posterior merienda, sino que además desaparecía rápidamente hacia algún lugar. Que no le gustara la merienda... sería extraño, porque Mika siempre había sido una chica parlanchina y alegre, imposible de imaginar evitando un té con charla.\n\n¿Qué fue lo que la tocó? Con esa única sospecha, Kirifuji Nagisa comenzó a preparar la próxima reunión."
 TRM_event.3.a: "..."
 NAGISA_NOT_TRUST_MIKA: "\n§LKirifuji Nagisa desconfió de Mika Misono, su compañera del Tea Party.§!"
 NAGISA_TRUST_MIKA: "§LSiendo su amiga de la infancia, confió en que Mika Misono no sería capaz.§!"

 TRM_event.4.t: "Pruebas"
 TRM_event.4.desc: "\"¡Señorita Nagisa...! Hemos encontrado pruebas concluyentes. Todavía no es tarde...\"\n\nUna de las integrantes del Tea Party irrumpió en la sala gritando con desesperación.\nPero su grito se ahogó enseguida por un agudo sonido de algo que se rompía.\nEn el pesado silencio que siguió, Kirifuji Nagisa, una de las tres líderes que movían a Trinity y cabeza de la facción Filius, habló.\n\n\"...Ya no estamos en posición de detener esto con pruebas endebles.\"\n\nLa imagen elegante, serena y perspicaz de la siempre amable Nagisa ya no estaba allí.\nLa mano que sostenía la taza temblaba, y en su voz se notaba un cansancio profundo.\nEn lugar de mostrar su habitual expresión cálida a la miembro que la había buscado, su rostro era frío y vacío, sumido en la desesperación.\n\n\"Señorita Nagisa... está en juego el futuro de Trinity. Todavía tenemos una oportunidad...\"\n\"...No. Ya no nos queda ninguna oportunidad... El triunvirato ya ha terminado.\"\n\nOcultando su mano temblorosa, Nagisa dirigió la mirada a la ventana.\nBajo el cielo gris, Trinity había perdido su vitalidad, envuelta en una sombría quietud.\nLa subordinada que la había buscado no pudo decir nada más y se retiró en silencio.\n\n\"...Mika... ¿Qué es exactamente lo que quieres...?\""
 TRM_event.4.a: "Los dados ya están echados."

 TRM_event.5.t: "Ley de Unión"
 TRM_event.5.desc: "El territorio de Gehenna está actualmente plagado por las actividades de fuerzas resistentes anti-Trinity y amenazas terroristas perpetradas por estudiantes de Trinity. En particular, la región occidental de Gehenna, Renania, es un núcleo industrial clave tanto para Trinity como para Alemania. Si no logramos reactivar estas fábricas y aprovechar los recursos naturales potenciales, toda la sangre y sacrificio habrán sido en vano. Por tanto, debemos restaurar estas fábricas a toda costa e investigar meticulosamente todos los recursos posibles.\n\nMientras tanto, las voces de preocupación entre los burócratas internos aumentan. Algunos advierten que estas decisiones pueden socavar los valores fundamentales de Trinity. Pero la época en que se gobernaba sólo por principios ya terminó hace mucho. Mika Misono siempre priorizó el pragmatismo, tomando todas sus decisiones en beneficio de Trinity. Por supuesto, algunos estudiantes podrían oponerse, pero no tenemos tiempo que perder. Recuperar los recursos e industria de Gehenna es una elección indispensable para el futuro de Trinity."
 TRM_event.5.a: "Todo esto es por el bien de Trinity..."

 TRM_event.6.t: "En la oscuridad"
 TRM_event.6.desc: "En las afueras, lejos del centro de Trinity. La noche avanzaba, y la tenue luz de la mansión flotaba en la oscuridad como una isla solitaria. Los líderes nacionalsocialistas y de la facción Pater permanecían en silencio, sabiendo instintivamente qué significaba esa reunión.\n\nLa puerta se abrió y apareció Mika Misono. No dijo una palabra mientras se colocaba frente a ellos. Su brillante sonrisa parecía tan helada como su expresión. Sus pasos eran silenciosos, pero parecía que incluso el aire se volvía más pesado con su presencia. Nadie se atrevió a hablar. Todos sabían por qué estaban allí. Sabían que aunque parecía que tenían una elección, en realidad no la tenían.\n\nEl silencio se prolongó. El ambiente era sofocante. Nadie se atrevía a tomar la iniciativa. Trataban de leer las intenciones de Mika tras su sonrisa, pero no lograban descifrar nada.\n\nEl principal de ellos reprimió una sensación de ansiedad en su pecho y cerró los ojos, repasando las opciones que tenía.\n\n'¿No hay otra alternativa para nosotros?'\n\nCuando volvió a abrirlos, la frialdad en la sala era aún más intensa. Su mente estaba en caos. El líder desaparecido, el orden desmoronado, y esa desconocida colaboradora frente a él... Se repitió una y otra vez la pregunta en su mente. ¿De verdad no había otro camino? Esa duda lo devoraba.\n\nPero la realidad era implacable. La voz de los enemigos se hacía más fuerte, y la única manera de sobrevivir ante Trinity parecía ser esa. Comprendió que Mika había estado esperando ese momento: que en su desesperación y confusión terminaran por tomar su mano.\n\n'Para sobrevivir a Trinity... no hay otro camino.'\n\nSu decisión quedó sellada. Ya no había vuelta atrás. Asintió lentamente, y por fin se rompió el silencio.\n\n\"Aceptaremos la cooperación.\" Su voz era firme, pero no podía ocultar el miedo que escondía."
 TRM_event.6.a: "No les quedaba otra opción, ¿verdad~?"

 TRM_event.7.t: "La primera firma"
 TRM_event.7.desc: "Tras dos semanas de preparativos, la oficina, adaptada al gusto de Mika, estaba llena por primera vez de todos los responsables y funcionarios. La oficina, antes tranquila, ahora estaba abarrotada, y Mika, sentada en el centro, mostraba una ligera incomodidad. Aunque le gustaba la gente, tanta gente desconocida a su alrededor le resultaba sofocante.\n\nEn ese incómodo ambiente, finalmente llegó el momento que todos esperaban. En una bandeja de latón, junto a una elegante pluma, le presentaron el primer documento para su firma como única gobernante de Trinity. Rodeada por los responsables designados provisionalmente, Mika comenzó su actuación. Con una sonrisa más vivaz que la de su predecesora, firmó oficialmente su primer documento. Los flashes de las cámaras se sucedían y los aplausos resonaban a su alrededor.\n\nPara Mika, la situación no le parecía tan mala. Nadie parecía preocuparse de que el contenido del documento enviara a alguien directo al infierno."
 TRM_event.7.a: "No es un mal comienzo"

 TRM_event.8.t: "Con una sola pluma..."
 TRM_event.8.desc: "Mika Misono estaba enviando a las figuras clave de la facción Pater lo más lejos posible de Edén. Que fuera en el extranjero y la forma en que serían tratados allí no le importaba. Al fin y al cabo, había decidido que por el bien de Trinity estaba dispuesta a hacer cualquier cosa, y su bienestar no le preocupaba en absoluto."
 TRM_event.8.a: "Les expresamos nuestras condolencias."

 TRM_event.9.t: "Informe"
 TRM_event.9.desc: "Mika Misono, con las gafas puestas, miraba una hoja con una lista de nombres sospechosos de colaborar con los judíos. Levantó la vista. La sala estaba llena de libros y periódicos viejos y mohosos. En un rincón oscuro, un gramófono polvoriento y oxidado. La escena arrancó una pícara sonrisa a Mika.\n\nEl timbre la sacó de sus pensamientos. Dos hombres fornidos con uniforme del partido nacional-socialista entraron. Uno inclinó el cuerpo, con su cabello rubio asomando bajo la gorra. El otro tenía un cuerpo robusto y una barriga abultada. Saludaron golpeando fuerte el suelo con sus botas.\n\nTras un incómodo silencio, Mika les habló. \"¿Qué sucede...?\" Ellos respondieron con voz firme, informándole de los nombres purgados ese día. Mika forzó una sonrisa y, torpemente formal, dijo:\n\n\"Gracias. Pueden irse.\"\n\nPero no se movieron.\n\nMika les preguntó:\n\n\"¿Por qué no se van?\"\n\nUno de ellos, jugueteando con el águila en su pecho, respondió:\n\n\"Se ha descubierto que Kirifuji Nagisa colaboraba con los judíos.\"\n\nMika no pudo decir nada. Finalmente murmuró:\n\n\"Eso... aún así...\"\n\nSu voz temblaba, y el rostro de los hombres se endureció. El más corpulento avanzó hacia ella. Mika se sobresaltó sin querer y tembló.\n\nCon voz calmada pero firme, él dijo:\n\n\"Nosotros nos encargaremos de todo. Sólo diga la palabra: 'procedan'. ¿Entendido?\"\n\nCuando se cerró la cerradura de la puerta, Mika se dejó caer en la silla, aliviada."
 TRM_event.9.a: "Qué tranquilo todo."

 TRM_event.10.t: "Silencio en la radio"
 TRM_event.10.desc: "22:00. En la radio sólo suena el silencio. Normalmente, a esta hora se transmitiría un mensaje de cierre de programación, pero hoy, en su lugar, el silencio llenó la habitación. Como si tratara de decir algo."
 TRM_event.10.a: "Un niño tuvo una pesadilla."

 TRM_event.11.t: "Grande es el éxito"
 TRM_event.11.desc: "El año pasado, cuando la sombra judeo-bolchevique y de Gehenna cubría el cielo y la oscuridad se cernía,\nme atreví a soñar con el ardiente hilo de Trinity.\nEn un mundo gobernado por el miedo y donde la esperanza parecía desaparecer,\nquise recuperar el precio que pagaron los crueles.\n\nEmpuñé la tinta como arma y tejí palabras poderosas,\nuna rebelión de poeta, una lucha susurrante.\nCada línea era un grito por la justicia, palabras intensas y sinceras,\nque atravesaron los corazones de quienes intentaban conquistar a Trinity.\n\nEscribí versos descarados y audaces de resistencia,\ncompuse una sinfonía rebelde aunque mi historia permaneciera desconocida.\nCon páginas manchadas de tinta, grabé mi súplica,\npor un futuro donde todos pudieran ser libres.\n\nMi escritura baila como luciérnagas iluminando el camino,\ndebemos atravesar esta noche peligrosa que sacude el valor.\nSusurré la dulce gracia de la unidad y el amor,\ny la fuerza y el abrazo firme de nuestra nación.\n\nY entonces encontré a la grandiosa Reina Mika,\nuna llama ardiente, un faro tan brillante que nos guía incluso en la noche más oscura.\n\nMe uniré a Trinity para desafiar a quienes nos oprimen.\n\nEl peligro es grande y debemos enfrentarlo, pero nosotros, Trinity, nos uniremos mostrando una poderosa unidad. Porque el espíritu de Pater no puede ser sofocado y permanecerá para siempre en los corazones de los oprimidos.\n\nAsí pues, gran líder,\nhaz que estas palabras resuenen como un firme tambor,\nen los corazones de los cansados y los callados.\nQue encuentren consuelo y fuerza en cada línea,\nque nuestras voces se entrelacen y se unan en una sola.\nNuestro éxito es prueba de la fuerza dentro de los estudiantes de Trinity y los alemanes.\nNos levantaremos unidos contra el yugo de la tiranía,\nnuestra lucha no será en vano."
 TRM_event.11.a: "-Leni Riefenstahl, 'Días Gloriosos'-"

 TRM_event.12.t: "El elogio del director"
 TRM_event.12.desc: "Antes de la llegada de la presidenta Mika Misono, estábamos embaucados por vacíos oradores. Pero la presidenta Mika Misono fue diferente. Su discurso, lleno de carisma, reavivó nuestro orgullo recordando el glorioso pasado de Trinity.\nEstamos dispuestos a cualquier sacrificio por su visión. Bajo su liderazgo, Trinity será grandiosa, y para ello otras academias deberán ser sacrificadas.\nShale, Invierno Escarlata, Shanhaijing, Gehenna — todos son meros obstáculos ante la gloria de Trinity. Especialmente quienes nos han oprimido, deben ser eliminados.\nQuienes seguimos a la presidenta Mika Misono haremos historia. Bajo su guía, seremos más fuertes y más grandiosos.\nNuestra lealtad pertenece sólo a la presidenta Mika Misono y a Trinity. Todo lo demás es secundario.\n¡Larga vida a la gran presidenta Mika Misono!"
 TRM_event.12.a: "De 'El elogio del director'"

 TRM_event.13.t: "Teoría del liderazgo de Trinity"
 TRM_event.13.desc: "La presidenta Mika Misono apareció en una lujosa sala con un porte autoritario. Su mirada reflejaba determinación y sentido del deber, rodeada de leales asesores.\nSu discurso comenzó enfatizando la larga historia y tradición de Trinity. Se autoproclamó 'guardiana de la nación', declarando asumir la responsabilidad de liderar Trinity.\nEl autor —yo— quedó profundamente impresionado por su liderazgo y mostró su apoyo total a su visión. Bajo la creencia de que 'el fin justifica los medios', afirmo que cualquier método es válido si garantiza la prosperidad de Trinity.\nSostengo que es necesario el sacrificio por el 'destino manifiesto' de Trinity, y que la prosperidad nacional sólo se alcanzará con compromiso y esfuerzo colectivo.\nComo autor, considero a Mika la única líder capaz de guiar el futuro de Trinity, y profeso una fuerte lealtad y devoción hacia ella."
 TRM_event.13.a: "-Otto Strasser, capítulo 2 de 'Teoría del liderazgo de Trinity'-"

 TRM_event.14.t: "Resolviendo a los problemáticos"
 TRM_event.14.desc: "Reprobaciones por bajo rendimiento, deambular en traje de baño escolar, arrestos por disturbios armados, suspensiones repetidas... La clase de recuperación está llena de problemáticos.\nPero en realidad es un lugar donde se agrupa a quienes son sospechosos de traicionar a Trinity. Debemos encargarnos de ellos rápidamente."
 TRM_event.14.a: "Expúlsenlos."
 TRM_event.14.b: "Permítanles volver a la normalidad."

 TRM_event.15.t: "Victoria en la Batalla de Edén — Fin de siglos de conflicto"
 TRM_event.15.desc: "Tras una dura guerra, nuestras fuerzas doblegaron por completo a los enemigos de Gehenna y regresaron victoriosas. Aunque algunos estudiantes de Gehenna insisten en seguir resistiendo, ya no representan una amenaza seria para nuestro dominio.\n\nEl conflicto entre Trinity y Gehenna se remonta a siglos atrás. Aunque últimamente parecía calmarse, el odio seguía latente y acabó estallando en guerra. Por suerte, vencimos, y ahora trabajaremos para erradicar ese odio.\n\n¡Ha llegado la hora de nuestra hegemonía! La aurora de la verdadera Pax Trinitica resonará en todo el continente. Bajo nuestro benevolente gobierno, la paz y la prosperidad florecerán. Los países de Europa respetarán cada vez más nuestra influencia, quieran o no.\n\nPor supuesto, nuestra lucha no termina aquí. Debemos avanzar más allá del continente y establecer nuestra hegemonía en todo el mundo. Con nuestra influencia cultural y poder militar, desafiaremos a las grandes potencias y nos consolidaremos como la verdadera potencia mundial."
 TRM_event.15.a: "¡Para ti la corona de la victoria!"

 TRM_event.16.t: "La hora más oscura"
 TRM_event.16.desc: "La reina subió al estrado, pero nadie la recibió con vítores.\nIncluso las facciones Filius, Sanctus y Pater la miraban con miedo.\nLos invitados locales presentes en el discurso tampoco fueron la excepción.\nTras semanas de sangrientos días, apenas unos pocos aplaudían tímidamente.\n\nAl llegar al estrado y echar una mirada satisfecha al público reunido, Mika Misono les dirigió su primer saludo.\n\n\"¡Hola a todos~☆\"\n\nEl saludo jovial tomó a todos por sorpresa.\nNo era el comportamiento que uno esperaría de quien había hecho desaparecer a tantos estudiantes de Trinity y el Tea Party.\nEn medio de la confusión y el miedo, todos la observaron.\n\n\"Ejeje~ ¿Están asustados? Tranquilos, no me los voy a comer~\"\n\nSin preocuparse, apartó el discurso y siguió hablando con indiferencia.\n\n\"Hoy los reuní para... supongo que para una especie de declaración. Seguro se sorprendieron al ver desaparecer a ciertas caras conocidas, ¿verdad? Eso fue porque eran... parásitos.\"\n\"¿Pa...rásitos?\"\n\"Sí, parásitos. Para los que vivían aquí, eran como los judíos.\"\n\nLos alemanes en la sala murmuraron incómodos.\nPor un momento vieron en ella la imagen de alguien que su país había perdido.\n\n\"Así que los eliminé a todos~, ahora el Tea Party trabajará sólo por Trinity.\"\n\nCon un fuerte golpe en el atril, la atención volvió a ella.\nObservó a los asistentes sudorosos y tragando saliva, y les sonrió ampliamente.\n\n\"Así que, por favor, cuenten conmigo~☆\""
 TRM_event.16.a: "No existe nada fuera del Estado. - Benito Mussolini"
 
 TRM_event.17.t: "Juicio"
 TRM_event.17.desc: "La malicia era evidente.\nUna audiencia destinada a expulsar a una sola persona del escenario.\nLos estudiantes y legisladores presentes arrojaban su veneno sobre Kirifuji Nagisa, en el centro.\n\n\"¡La debilidad de Nagisa nos trajo a esta situación!\"\n\"¡Rechazamos la paz humillante!\"\n\nLa facción Pater lideraba las acusaciones.\nLas otras facciones sólo observaban, ya sin fuerzas.\nLas otras dos cabezas de Trinity habían sido destrozadas por Mika.\n\nPero Nagisa se mantuvo serena.\nSabía que el resultado ya estaba decidido.\nCon su habitual actitud, puso fin a esa aburrida farsa.\n\n\"Disculpen, pero creo que esta audiencia ya debería terminar.\"\n\"¿No ve que seguimos en proceso, testigo?\"\n\"Pero el final ya está decidido, ¿no es así?\"\n\nSe levantó y miró al final del largo pasillo.\nA través del vitral sobre la puerta entraba una luz cálida.\nEra hora de que la actriz abandonara la escena.\n\n\"Creo que me retiro primero. Debo revisar mi nueva habitación. Que la paz los acompañe.\"\n\nCon una sonrisa ligera, caminó lentamente hacia la puerta.\nLa despidieron el sol y la brisa, no la gente."
 TRM_event.17.a: "Un ángel ha caído."

 TRM_event.18.t: "Caída"
 TRM_event.18.desc: "Algo estaba claramente mal.\nAl menos así lo pensaba ella.\nHoras antes, soñaba con elevarse como el nuevo sol de Trinity.\nPero ahora era arrastrada por los soldados del Tea Party.\n\nEn la oscuridad sin luna, pensó rápido.\n¿Nagisa recuperó el poder? ¿Un golpe de Filius o Sanctus?\nImposible.\nAmbas fueron hechas trizas por Mika y Pater.\n\nLa verdad se reveló pronto.\nEn el sótano al que la llevaron estaba Mika Misono.\n\n\"Mi... Mika-sama...? ¡Debe ser un error! ¿Por qué yo...?\"\n\"¿Hmm? ¿Quién eras? Todas se me parecen~\"\n\nEn su rostro la esperanza desapareció.\nEn un instante cayó al fondo, mentalmente destruida.\n\n\"Hmm... sólo una mohosita sin valor. Mándenla a las minas.\"\n\nUna de las antiguas ejecutivas de Pater desapareció en la fría oscuridad.\nMika pasó a la siguiente página.\nAún quedaban muchos nombres en la lista."
 TRM_event.18.a: "El más confiable es siempre el primero que hay que sospechar. - Iósif Stalin"

 TRM_event.19.t: "La residencia vacía"
 TRM_event.19.desc: "El hombre se dirigió a la residencia.\nDebía informar de los excesos de las tropas de asalto y verificar por qué no había respuesta.\nPensó en las atrocidades recientes: aquellos marginados con uniforme y poder, disparando balas a estudiantes relacionados con judíos mientras el Departamento de Justicia no hacía nada.\n\nTodos sabían que había que detener esta locura.\n\nLlegó a la residencia y abrió la puerta.\n\nSólo encontró papeles volando y habitaciones destrozadas, señales de resistencia."
 TRM_event.19.a: "¿Dónde están?"

 TRM_event.20.t: "Caza de opositores"
 TRM_event.20.desc: "Con Nagisa despojada de su poder, la facción Filius estaba al borde del colapso. Eligieron a un nuevo representante y conspiraron para recuperar influencia, pero siempre fueron neutralizados por Pater.\n\nFinalmente, decidieron atacar. Prepararon su plan y marcharon contra Pater.\n\nPronto sintieron algo extraño. El ambiente era inquietante. Ordenaron detenerse y fueron emboscados por decenas que ya conocían su plan. Cayeron derrotados, y entendí que había llegado nuestro destino."
 TRM_event.20.a: "¿Fue un error filtrar la información?"

 TRM_event.21.t: "Transmisión"
 TRM_event.21.desc: "No podía entenderlo.\nMika Misono, dejando caer la pluma y levantándose de su cómoda silla, simplemente no podía entenderlo.\nSobre el escritorio quedaba un discurso aún sin comenzar.\n¿Por qué debía ella hacer este tedioso trabajo?\n\nEn los últimos días, había eliminado a tanta gente que ni siquiera recordaba el número exacto.\nGracias a eso, no quedaba ninguna organización capaz de oponerse a ella en Trinity.\nQuizá las Hermanas, pero esas monjas anticuadas ni siquiera se preocupaban por la política.\n\nAsí que este discurso no era necesario.\nNo quedaba nadie que pudiera quejarse de sus palabras o actos.\nY quien osara hacerlo acabaría en un lugar donde nunca más vería la luz del sol.\nAun así, sus asistentes insistían en que era necesario.\n\nAburrida, Mika salió de la oficina y caminó por los viejos pasillos.\nConsideró enviar a esos asistentes que le insistían a algún rincón profundo, cuando sus ojos se cruzaron con algo al final del pasillo.\n\nUn retrato que aún no había sido retirado, mostrando la falsa y cálida sonrisa de otra líder de Trinity.\nMirándolo con cierto disgusto, Mika sonrió al recordar algo."
 TRM_event.21.a: "Ah~ claro, así será." 
 
 TRM_event.22.t: "Manchas de sangre"
 TRM_event.22.desc: "El Departamento de Justicia siempre había velado por Trinity, pero ahora no tenía ningún poder.\nAsí que, incluso cuando los estudiantes de uniforme negro, llamados 'tropas de asalto', se llevaban a los locales llamados 'judíos', el Departamento de Justicia no podía hacer nada. Ni siquiera ella, una simple miembro.\nAquellos marginados con uniforme negro que disparaban balas por las calles y se pavoneaban, eran intocables.\n\n-¡Bang!\n\nUn disparo resonó cerca.\n\nElla miró a su alrededor.\n\nCuerpos atravesados por balas y manchas de sangre cubrían la calle, y era tarea de los miembros del Departamento recogerlos.\n\nMientras escuchaba las risas de las tropas, comenzó a caminar lentamente para limpiar los cadáveres."
 TRM_event.22.a: "¿No saben lo que es el orden?"

 TRM_event.23.t: "Algo sospechoso"
 TRM_event.23.desc: "-¡Bang!\n\nUn disparo retumbó por la calle.\n\n-Ugh, me manchó la ropa.\n\nLa chica, con una expresión de asco, pateó el cadáver a sus pies mientras sostenía un arma en la mano.\n\n¿Acaso había hecho algo malo ese cadáver?\nLa respuesta era simple.\n\nEra judío. Ese era su 'crimen'. No le había hecho nada a ella.\n\n…Su único pecado fue no llevar una estrella.\n\nBuscó otra víctima alrededor.\nY entonces sonrió.\nFeliz.\nPara una estudiante marginada y rechazada por Trinity, este poder era dulce.\n\n-Tap, tap, tap…\n\nEn ese momento, sintió una presencia detrás de ella.\n\nSe giró apresuradamente, pero no había nadie."
 TRM_event.23.a: "Estoy segura de que algo se movió…"

 TRM_event.24.t: "Ampliación de poderes"
 TRM_event.24.desc: "Se discute la cuestión del poder del Departamento de Justicia de Trinity, que en nombre es policía autónoma y voluntariado, pero en realidad es una fuerza armada. ¿Qué haremos?"
 TRM_event.24.c: "Si les damos poder, podrían convertirse en un obstáculo después."
 TRM_event.24.b: "Crear un cuerpo de guardia personal directamente subordinado."

 TRM_event.25.t: "Agitación"
 TRM_event.25.desc: "La única autoridad de Trinity, Mika Misono, subió al estrado preparado.\nContrario a las miradas nerviosas del público, ella apareció sonriendo como una niña, jugando con el micrófono mientras hablaba con un tono ligero y alegre.\n\n\"Ahaha~ ¿por qué esas caras? ¿Comieron algo raro?~☆ Lo entiendo~ Están confundidos por la desaparición de Nagisa, ¿verdad? Pero yo tenía mis razones~\"\n\nMientras movía juguetonamente un pie, el ambiente se fue relajando y algunos incluso sonrieron.\n\n\"Pero Trinity y todo Kivotos están en peligro, ¿no? Un absurdo como este, ¿quién lo creería? ¡Toda la academia teletransportada!~☆\"\n\nRisas tímidas entre la multitud.\nPero lo siguiente heló a todos.\n\n\"¿Y las juntas estudiantiles? ¿Qué hicieron?\"\n\"¡Nada!\"\n\nAlgunos gritaron desde el público.\n\n\"¡Exacto! Solo cuidaron su propio bienestar, ni pensaron en los estudiantes comunes. Incluso algunos demonios con cuernos iniciaron guerras internas, ¡olvidando hasta su propósito!\"\n\"¡Asquerosos demonios de Gehenna!\"\n\nLa multitud empezó a enfervorizarse.\n\n\"¡Y la Junta General igual! Solo chupándose el dedo mientras todo se desmorona. ¡Ridículo!\"\n\"¡Inútiles!\"\n\"¡Desmantelen la Junta General!\"\n\nNo solo Trinity. Todo Kivotos escuchó el discurso y entendió que Mika planeaba tomarlo todo.\n\n\"Así que, en nombre del Padre, del Hijo y del Espíritu Santo… solo Trinity puede calmar este caos.\"\n\nEl grito final de locura y odio inundó todo Kivotos. Todos sintieron que un viento sangriento pronto soplaría sobre ellos."
 TRM_event.25.a: "El odio y la ira son las armas más poderosas de las masas."

 TRM_event.26.t: "Fin del primer acto"
 TRM_event.26.desc: "Un hombre que alguna vez fue respetado como político ya no existía.\nVio cómo los que se autoproclamaban Trinidad se aliaron con los restos del nacionalsocialismo y arrasaron Alemania.\nBanderas de propaganda tapaban su historia y cultura, y las trompetas de los altavoces ahogaban los violines.\n\nPor eso cerró ventanas y oídos.\nPero hoy, un ruido diferente lo obligó a abrir la cortina.\n\nEn la calle, la multitud aclamaba a la nueva líder y ondeaba banderas. La pesadilla se tragó Europa.\n\nCayó al suelo, superado por la desesperación. Por un momento sintió alivio de que todo terminara… pero él, que conocía la política, lo sabía mejor que nadie.\n\nLas máquinas movidas por odio no se detienen hasta destruirlo todo, incluso a sí mismas.\n\n\"…No ha terminado… ¡aún no termina!\"\n\nEl suspiro del viejo se desvaneció en la oscuridad."
 TRM_event.26.a: "Comienza el segundo acto"
 TRN_endsieg_event_tt: "§tKivotos se ha unificado bajo un dominio feroz. Nadie sabe cuánto durará el reinado de la Reina de la Noche, pero la oscuridad cubre a todos.§!"

 TRM_event.27.t: "Campaña de degradación de Gehenna"
 TRM_event.27.desc: "Tras la victoria de Trinity en la guerra, por orden de Mika Misono, los edificios emblemáticos de Gehenna fueron demolidos o remodelados al estilo Trinity. La industria brillante que construyó Sorasaki Hina fue desmantelada y reubicada.\n\nAmano Ako solo pudo mirar impotente. Tras la muerte de Hina, ya no tenía nada. Odiaba a Trinity y a quienes le arrebataron su felicidad. Pero no tenía la fuerza de Hina.\n\n-¡Kaboom!\n\n\"¡Jajaja! ¡Eso estuvo bien!\"\n\nElla soltó las manos. La esperanza.\n\nLa administradora que una vez asistió a la justa revolución de Hina desapareció en un vacío profundo."
 TRM_event.27.a: "No dejen huellas."

 TRM_event.28.t: "Pacto anticomunista"
 TRM_event.28.desc: "Con el Pacto Antiaéreo, [From.GetNameDef] estableció una base diplomática para enfrentar a Invierno Escarlata. Pero este pacto no incluye alianza militar ni obligaciones claras. [From.GetLeader] propone ampliarlo a una alianza formal contra Invierno Escarlata.\n\nEsto rompería toda diplomacia con ellos, pero es una oportunidad para asegurar un poderoso bloque aliado."
 TRM_event.28.a: "Nos opondremos a Invierno Escarlata junto a Trinity y sus aliados."

 TRM_event.29.t: "Colapso de Trinity"
 TRM_event.29.desc: ""
 TRM_event.29.a: "Ancestros…"

 TRM_event.30.t: "¡Ultimátum final de Trinity!"
 TRM_event.30.desc: "El ultimátum propone que, si se rinden y aceptan ser títeres, no habrá guerra entre ambos y se firmará un pacto de eterna amistad."
 TRM_event.30.a: "¡Lárguense!"
 TRM_event.30.b: "Me rindo, ¡solo déjenme vivir!"

 TRM_event.31.t: "[FIN.Getname] rechazó nuestras demandas"
 TRM_event.31.desc: ""
 TRM_event.31.a: "Debemos considerar la intervención militar."
 
 TRM_event.32.t: "[FIN.Getname] aceptó nuestras demandas" 
 
 TRM_event.34.t: "Noche tardía"
 TRM_event.34.desc: "Bajo el oscuro cielo nocturno, las siluetas del ejército de Trinity se acercaban sigilosamente a la frontera de Gehenna. Las luces de los puestos fronterizos parpadeaban débilmente mientras la tensión llenaba el aire.\n\nDe repente, la vanguardia de Trinity cruzó la frontera. En ese instante, un ensordecedor estallido rompió la calma nocturna. El cielo se iluminó con fuego mientras comenzaba el bombardeo de Trinity.\n\nLas defensas de Gehenna cayeron rápidamente en el caos. Tomados por sorpresa, los soldados recibieron órdenes de retirarse antes de poder reaccionar. Bajo la lluvia de proyectiles, el ejército de Gehenna comenzó una retirada ordenada.\n\nLas fortificaciones y los puestos de control se derrumbaron uno tras otro. Los tanques y la infantería de Trinity atravesaron las brechas avanzando en territorio de Gehenna. Aunque los soldados de Gehenna continuaron resistiendo mientras se retiraban, fueron empujados cada vez más atrás por el abrumador poder de fuego de Trinity.\n\nLa guerra había comenzado. La noche iniciada por el ataque sorpresa de Trinity sería la señal del comienzo de una larga guerra para ambos países."
 TRM_event.34.a: "¡Al ataque!"

 TRM_event.35.t: "Administración del territorio de Gehenna"
 TRM_event.35.desc: "Tras la victoria en la guerra contra Gehenna, hemos comenzado a debatir el futuro del territorio conquistado."
 TRM_event.35.a: "¡Una gran victoria!"

 TRM_event.36.t: "Propaganda"
 TRM_event.36.desc: "¡Ciudadanos de Gehenna!\n\nNuestra patria está en peligro. La invasión ilegal de Trinity amenaza nuestra pacífica forma de vida. Pero nunca nos rendiremos.\n\nLa historia de Gehenna siempre ha sido la historia de estudiantes libres que superan la opresión. Ahora más que nunca debemos permanecer unidos.\n\nPara proteger nuestra libertad y soberanía, necesitamos la fuerza de todos. Los soldados en el frente y los civiles en la retaguardia deben cumplir con su deber.\n\nTrinity ha subestimado nuestra voluntad. Les mostraremos el verdadero poder de Gehenna.\n\n¡Levantémonos por nuestra tierra, nuestras familias y nuestro futuro! Unidos en el espíritu de Gehenna superaremos esta crisis.\n\n¡Venceremos! ¡Que Gehenna viva por siempre!"
 TRM_event.36.a: "¡Victoria para Gehenna!"

 TRM_event.38.t: "Especialización del Departamento de Desarrollo Industrial"
 TRM_event.38.desc: "En sus inicios, el Departamento de Desarrollo Industrial de Trinity implementó diversas políticas experimentales, acumulando experiencia. Estos experimentos, con éxitos y fracasos, sirvieron para aumentar la profesionalidad y la destreza del departamento.\n\nActualmente, el departamento busca un nuevo sistema económico que combine las ventajas de la economía de mercado con la economía planificada. Las lecciones aprendidas mejoraron enormemente su capacidad de formular y ejecutar políticas, convirtiéndose en un pilar clave para la economía de Trinity. Gestionando empresas estatales y controlando al sector privado, sus innovaciones han impulsado aún más la economía de Trinity."
 TRM_event.38.a: "¡Un brindis por Trinity, al menos por hoy!"

 TRM_event.39.t: "El coro"
 TRM_event.39.desc: "En un majestuoso salón, Mika comenzó su discurso, lleno de apasionada hostilidad contra Gehenna y ensalzando la grandeza de Trinity.\n\n\"¡Gehenna está construida sobre la avaricia, la corrupción y las promesas rotas, a costa del sufrimiento de los estudiantes!\" Las palabras de Mika elevaron el ánimo del público.\n\n\"Debemos enfrentarlos. ¡La guerra con Gehenna es inevitable! ¡Porque son demonios por naturaleza!\" Los oyentes reaccionaron con entusiasmo, algunos levantando la mano en saludo.\n\n\"¡Venceremos! ¡Seguiremos adelante! ¡La gloria continuará!\" concluyó Mika.\n\nEntonces, el himno de Trinity resonó. Primero se levantó un alemán, luego una miembro del Departamento de Justicia, una monja, un hombre uniformado…\n\n\"Las tropas marchan con paso firme\"\n\"Los camaradas asesinados por los demonios de Gehenna\"\n\"Marchan con nosotros en espíritu\"\n\nPronto, todo el salón participó en el coro. Miembros de distintas organizaciones cantaron con pasión.\n\n\"El día de la libertad y el pan se acerca\"\n\nTodas las miradas se posaron en Mika, con devoción y amor. Ella les devolvió una profunda sonrisa, con la firme convicción de que el futuro pertenecía a Trinity."
 TRM_event.39.a: "¡Las banderas de Trinity pronto ondearán por todas partes! ¡Trinity será eterna!"

 TRM_event.40.t: "Absorción de remanentes del ejército"
 TRM_event.40.desc: ""
 TRM_event.40.a: "Juro solemnemente ante Dios obediencia incondicional a Mika Misono…"

 TRM_event.41.t: "Preocupación por estancamiento en el frente"
 TRM_event.41.desc: "\"Secretaria, infórmame sobre la situación.\"\n\n\"Sí. Es preocupante. Algunos planes han tenido éxito, pero la resistencia inesperada ha obstaculizado otros.\"\n\"¿Y no hay forma de resolverlo?\"\n\n\"Aún no lo sabemos…\"\n\nMika escuchó en silencio, preocupada por las dificultades recientes. La secretaria, en quien confiaba, parecía insegura.\n\n\"¿No sabes exactamente cuál es el problema?\"\n\nLa secretaria asintió, frustrada. \"Seguimos recopilando información, pero aún no tenemos una solución clara.\"\n\nMika calló. Sabía que no podían permitirse fracasar.\n\n\"Entonces sigue investigando. No tenemos margen para fallar.\""
 TRM_event.41.a: "Está bien."

 TRM_event.42.t: "El final de Gehenna"
 TRM_event.42.desc: "[GEM.GetLeader] se arrodilló y firmó la rendición, una semana después la sombra cubría las calles de Gehenna. El bullicioso y alegre distrito central ahora estaba apagado y desolado. En contraste, los soldados de Trinity mostraban rostros radiantes.\n\nLos estudiantes de Gehenna vagaban en silencio, como sombras, mientras las tropas vencedoras marchaban con orgullo, vistiendo uniformes grises con brazaletes de Pater. Sus risas humillaban a los derrotados.\n\nLas famosas terrazas de los cafés estaban vacías, salvo por algunos locales indiferentes y miembros del club gourmet, cuyos sueños rotos se reflejaban en sus rostros. Haruna, que solía bromear, guardaba silencio, e Izumi intentaba animar el ambiente sin éxito. Las conversaciones entre los estudiantes de Gehenna eran apagadas, apenas audibles entre las carcajadas de los soldados."
 TRM_event.42.a: "Caída sin fin."
 TRM_event.42.b: "Al menos conservaron el honor."

 TRM_event.43.t: "Nombramiento del Ministro de Economía"
 TRM_event.43.desc: "Hjalmar Schacht pensó que su vida no podía ir peor, hasta que el país entero cambió y fue reemplazado por una academia de niñas.\n\nPensó que lo olvidarían, pero fue llamado por la líder de Trinity.\n\nConoció a Mika Misono, y le sorprendió su conocimiento económico. Ya era mejor que Hitler solo por eso.\n\nLas nuevas tecnologías de Trinity despertaron su curiosidad. Mientras viajaba a Eden, pensó en las políticas económicas, los precios y cómo funcionaba la economía en un país donde todos eran estudiantes.\n\nSabía que Mika había adoptado ideas nazis, pero le parecía mejor que Hitler solo porque escuchaba sin interrumpir. Cuando se dio cuenta, ya vestía uniforme."
 TRM_event.43.a: "Ministro de Economía, Hjalmar Schacht."

 TRM_event.44.t: "El Gran Acuerdo"
 TRM_event.44.desc: "La nueva película patriótica de Leni Riefenstahl, [El Gran Acuerdo], arrasó en Trinity.\n\nLa película mostraba a la justa facción Pater luchando contra las traiciones de las otras facciones. La escena final, mostrando la desesperación de los Pater, hizo llorar al público, que luego, al ver el discurso de Mika, se puso en pie para cantar el himno de Trinity.\n\nMika felicitó a Leni por su obra y le pidió seguir creando muchas más."
 TRM_event.44.a: "¡Esa mujer hace buenas películas!"

 TRM_event.45.t: "Propaganda nº112"
 TRM_event.45.desc: "En 300 años, ningún líder ha logrado tanto como Mika.\n- Segundo mejor desempeño táctico en Kivotos\n- Segundo club más poderoso (Departamento de Justicia)\n- Academia más pura\n- Mika ha devuelto el orgullo a Trinity y al pueblo germano\n\nLos estudiantes y germánicos de Trinity lucharán contra los demonios de Gehenna hasta el final.\n\n¡Levántense, estudiantes de Trinity!"
 TRM_event.45.a: "¡Guerra total!"

 TRM_event.46.t: "El gran ejército defensor de Trinity"
 TRM_event.46.desc: "Si Gehenna enciende la guerra, será aniquilada antes de que [GEM.GetLeader] firme nada.\n¡Alístense en nuestro glorioso ejército y protejan nuestra patria y familia!\nBajo la guía de Mika, aceleremos la revolución."
 TRM_event.46.a: "¡Hacia las alturas!"

 TRM_event.47.t: "Gehenianos leales"
 TRM_event.47.desc: "Los justos que eligen a Mika sobre [GEM.GetLeader] recibirán:\n- Derechos y libertades de estudiante de Trinity\n- Medalla de hierro, subsidio de vida\n- Empleo garantizado\n- Ascenso a segunda clase racial\n- Excepción futura de 'procesamiento'\n- Subsidio inicial\n\nCondiciones:\n- Sin historial en Sondo-bu o Manmajeon\n- Obedecer todas las órdenes del ejército\n- Prohibido portar armas de por vida\n- Aprobar examen sobre los escritos de Mika"
 TRM_event.47.a: "Comité de Defensa de Trinity"

 TRM_event.48.t: "Presión por el Anschluss"
 TRM_event.48.desc: "Las protestas muestran el deseo de unificación con Trinity. Eden exige firmemente la anexión de Shan-Haijing."
 TRM_event.48.a: "¡Debemos unirnos a Trinity!"
 TRM_event.48.b: "No, el destino de Shan-Haijing está en otra parte."

 TRM_event.50.t: "Anschluss"
 TRM_event.50.desc: "Las repetidas rebeliones en Shan-Haijing demuestran que quieren unirse a nosotros. Es hora de actuar."
 TRM_event.50.a: "¡Quién puede decir que Austria no es Alemania!"

 TRM_event.51.t: "¡Shanhaijing rechaza la anexión!"
 TRM_event.51.desc: "¡Los idiotas del distrito central de Shanhaijing han rechazado la unión de nuestras dos naciones! Esto es una flagrante falta de respeto a la voluntad del pueblo austriaco, un acto intolerable. Puede que tengamos que recurrir a medios militares para imponer la anexión."
 TRM_event.51.a: "Debemos considerar la intervención militar."

 TRM_event.52.t: "Las demandas de los Sudetes de [From.GetNameDefCap]"
 TRM_event.52.desc: "En esta situación, Trinity nos exige el territorio de los Sudetes bajo el pretexto de \"proteger a los ciudadanos alemanes\".\n\nHan dejado claro que no habrá negociación ni diplomacia. Tendrán los Sudetes, o irán a la guerra por ellos."

 TRM_event.49.t: "Kozeki Ui"
 TRM_event.49.desc: "\"Eh, ¿yo? ¿De verdad?\"\n\nLa chica de cabello morado y ojos cansados, 'Kozeki Ui', habló temblando ante Mika.\n\n\"¡Sí!~~ Ui-chan siempre encerrada en la biblioteca, no habla con nadie y es lista, ¡seguro que sabe de economía!\"\n\n\"¿Quiere nombrarme... ministra de economía...?\"\n\n\"¡Es fácil! Solo revisa los informes y administra más o menos con tus conocimientos de los libros.\"\n\n\"P-pero eso es muy vago...\"\n\nUi seguía temblando sentada ante la 'Reina de la Noche'. Mika sonrió ampliamente.\n\n\"¡Vamos Ui-chan, ánimo ánimo, fuérzate fuérzate~!\"\n\n\"S-supongo que... quizá...\"\n\nMika frunció el ceño, apuntándole a la cabeza con su pistola.\n\n\"¡Hiiii! ¡Sí! ¡Lo haré!\"\n\nMika sonrió de nuevo. \"¡Perfecto, ministra Ui~!\"\n\nMika salió. Ui, empapada en sudor frío, se desplomó. Solo quería volver a su biblioteca."
 TRM_event.49.a: "Economista, Kozeki Ui."

 TRM_event.53.t: "¡Las demandas de Trinity sobre Dinamarca!"
 TRM_event.53.desc: "Trinity finalmente perdió la razón. - [ROOT.GetLeader]"
 TRM_event.53.a: "Por supuesto que debemos rechazar."

 TRM_event.54.t: "[From.GetNameDefCap] rechaza la cesión de los Sudetes"
 TRM_event.54.desc: "El líder [From.GetLeader] ha cometido una estupidez diplomática al rechazar por completo nuestras demandas.\n\nNo cederán los Sudetes y se burlan de nuestro deseo de proteger a nuestros hermanos y hermanas, incluso a costa de la guerra."
 TRM_event.54.b: "La Nueva Jerusalén"

 TRM_event.55.t: "$germany.124.t$"
 TRM_event.55.desc: "$germany.124.d$"
 TRM_event.55.a: "¡Por Trinity y todos los estudiantes!"

 TRM_event.56.t: "¡Pastel delicioso!"
 TRM_event.56.desc: "¡El club de postres ha preparado un pastel delicioso!"
 TRM_event.56.a: "¡Delicioso!"

 TRM_event.57.t: "¡Helado frío!"
 TRM_event.57.desc: "¡El club de postres ha preparado un helado frío!"
 TRM_event.57.a: "¡Frío!"
 
 TRM_event.58.t: "Destrucción de Arius"
 TRM_event.58.desc: "Bajo nuestro ataque, la sucursal Arius ha sido destruida y solo ondea nuestra bandera. Sin embargo, no se ha capturado al escuadrón de élite Arius. Solo queda una opción: declararles organización terrorista y erradicarlos."
 TRM_event.58.a: "Tienes razón."
 TRM_arius_problem_idea: "Temor al escuadrón Arius"
 TRM_arius_problem_idea_desc: "Los estudiantes de Trinity han comprendido que el escuadrón Arius no es un simple grupo, sino una organización terrorista organizada. Se sienten amenazados y la desconfianza hacia el gobierno crece."
 
 TRM_event.59.t: "Asalto"
 TRM_event.59.desc: "\"¿De verdad está aquí?\"\n\n\"Sí, según la información...\"\n\nDos hombres vestidos de negro y con máscaras, empuñando armas demasiado grandes para llamarlas pistolas, murmuraban frente a una mansión. Habían venido en plena noche a asesinar a Seia Yurizono.\n\n\"Haa... sólo tenemos que abrir esta puerta y ahí estará, ¿no?\"\n\n\"Sí... pero, ¿está seguro que esta arma servirá? ¿No vio lo de antes? A esas con halos en la cabeza les disparas y apenas les duele.\"\n\n\"Tsk. Qué sé yo. El intermediario dijo que moriría.\"\n\n\"Pero es demasiado arriesgado... ese tipo que nos contrató ni lo conocíamos, ¿y si nos tiende una trampa?\"\n\n\"Deja de hablar y abre la maldita puerta.\"\n\nClic. Clac.\n\nUno abrió la cerradura con sorprendente destreza, y se adentraron en silencio. No pasó mucho antes de que vieran a alguien dormida en la cama. Uno le hizo señas al otro. Sabían que era ella.\n\nSin dudar, vaciaron el cargador sobre ella y huyeron de inmediato.\n\nQuizá el ruido de los disparos fue demasiado fuerte, pues al poco rato llegó la Orden de Socorro."
 TRM_event.59.a: "..."

 TRM_event.60.t: "Investigación en curso"
 TRM_event.60.desc: "La investigación avanzó sin contratiempos. Se confirmó que habían abandonado las armas al huir, y las herramientas usadas para forzar la entrada también quedaron allí. La Orden de Socorro entregó el informe con el cadáver recuperado, pero había demasiadas incógnitas.\n\nKirifuji Nagisa pensaba: \"¿Quién fue? ¿Un ataque terrorista contra Trinity? ¿Un estudiante aprovechando la oportunidad para atacar a Tea Party? ¿O acaso... Mika...?\"\n\n*¡Bang!*\n\nGolpeó la mesa, pero la sonrisa de cierta mujer no desaparecía de su mente."
 TRM_event.60.a: "..."

 TRM_event.61.t: "Rastreo"
 TRM_event.61.desc: "La Orden de Socorro aseguró la zona y los investigadores empezaron a reconstruir su ruta de huida. Uno presentó una hipótesis:\n\n\"Creo que saltaron este muro.\"\n\n\"¿Por qué cree eso?\"\n\n\"Aquí hay marcas. No parecen naturales, más bien hechas por alguien apresurado.\"\n\n\"Entonces deberíamos buscar por la zona.\"\n\n\"Así es... pero no estoy del todo seguro. Son más hábiles de lo que parecen.\"\n\n\"Bien. Lo investigaré personalmente.\""
 TRM_event.61.a: "\"Y tenga cuidado. No son tiempos tranquilos.\""

 TRM_event.62.t: "Sospechosos capturados"
 TRM_event.62.desc: "En un lugar apartado, dos hombres rogaban de rodillas ante los miembros de Justicia.\n\n\"N-no fue nuestra intención... crecimos huérfanos, pobres...\"\n\nHasumi los miró y suspiró.\n\nLuego sonrió ligeramente y les preguntó:\n\n\"¿Quién los envió? Háblenme.\"\n\nTras un rato, colgaban boca abajo, casi desnudos, cubiertos de moretones.\n\n\"P-por favor... clemencia...\"\n\nAl verlos a punto de desmayarse, Hasumi ordenó que los soltaran. Entonces cantaron todo lo que sabían.\n\n\"...Ya veo.\"\n\nPero seguía dudando. \"¿De verdad estos miserables mataron a Seia? ¿No habremos atrapado a los equivocados?\"\n\nEntonces uno balbuceó: \"Ya... ya dijimos todo... sólo déjenos vivir...\"\n\nPor alguna razón, Hasumi perdió toda compasión. Caminó hacia las armas. Uno imploró, pero no pudo detenerla.\n\n\"Gracias por la información... pero odio a los idiotas que no entienden.\"\n\n*Bang!*"
 TRM_event.62.a: "\"Tsurugi. Encontramos a los culpables.\""

 TRM_event.63.t: "Instigador detenido"
 TRM_event.63.desc: "En el lugar señalado por los capturados, un hombre fumaba en un callejón. Hasumi se acercó y habló directamente:\n\n\"¿Es usted?\"\n\n\"¿Qué quieres, mujer?\"\n\nAtemorizado por su imponente figura, intentó recuperar la calma.\n\n\"Se lo preguntaré de frente. ¿Conoce a estos hombres?\"\n\n\"Tch. ¿Y yo qué voy a saber?\""
 TRM_event.63.a: "Hacerle hablar es fácil."

 TRM_event.65.t: "Callejón sin salida"
 TRM_event.65.desc: "Al final de un callejón oscuro, un hombre gimoteaba acorralado. La justicia, en forma de ángel negro, se le acercó lentamente.\n\n\"¡Maldita sea! ¡Les daré lo que quieran, pero déjenme en paz!\"\n\nEl intermediario fue derribado de una patada. Ella sólo sonrió con desprecio.\n\n\"Yo no quiero nada de usted, pero alguien más sí.\"\n\n\"¿Por qué hacen esto? ¿Qué buscan?\"\n\nHasumi aplastó su pecho con el tacón.\n\n\"¿Saberlo le ayudará? Su destino quedó sellado desde que albergó intenciones contra Tea Party.\"\n\nLe apuntó a la cabeza con la culata y susurró:\n\n\"El principio es simple: Por Trinity, y por Tea Party.\"\n\nEl hombre no escuchó más."
 TRM_event.65.a: "\"No perdonamos la injusticia ante nuestros ojos.\""

 TRM_event.64.t: "Los sabuesos"
 TRM_event.64.desc: "Junto al cuerpo destrozado del intermediario, cuatro chicas desplegaron un mapa. Tras duros interrogatorios, identificaron a más implicados y los capturaron sigilosamente. Todas las flechas apuntaban a un nombre.\n\n\"Reinhard Heydrich. General de las SS y jefe del SD. Desaparecido desde que Trinity apareció.\"\n\n\"Un perro fiel de un régimen criminal.\"\n\nHasumi detuvo su dedo en un punto del Schwarzwald.\n\n\"También es el principal sospechoso del atentado contra Seia.\"\n\nMiró a las otras tres: Ichika, Mashiro y Tsurugi.\n\n\"Mejor enviamos sólo a dos.\"\n\n\"Entendido.\"\n\n\"Prepararé todo.\"\n\n\"No lo maten, pero que sufra hasta el final.\"\n\nLa risa escalofriante llenó la sala. Las cuatro sonrieron en silencio."
 TRM_event.64.a: "Cómo gritará ese hombre."

 TRM_event.66.t: "El crepúsculo de los dioses"
 TRM_event.66.desc: "El bosque negro ardía en rojo.\nEl automóvil preparado para la huida estalló hecho añicos con una sola bala.\nLuego, una carga de algo rojo y negro destruyó de un golpe no sólo a los pocos guardaespaldas, sino también la fachada entera de la casa de madera.\n\nEl hombre, que había soñado con purificar la Gran Alemania de toda la escoria que la enfermaba, no podía comprender lo que tenía delante.\nLo que veía era un terror carmesí, una catástrofe viviente, la muerte con forma de ángel caído… y todos esos nombres le quedaban cortos.\nEntre los restos de pared y la sangre humana, eso se acercaba, reduciendo todo a polvo y carne desgarrada.\n\nSe inclinó hacia él.\nDejó caer las dos pistolas que habían sido su instrumento de castigo, y eso tomó sus brazos y los arrancó sin dudar.\nNo tuvo tiempo ni de gritar antes de que aquello empezara a golpearlo enloquecido, entre carcajadas.\n\nEn su conciencia que se apagaba, alcanzó a ver cómo lo arrastraban fuera del pabellón.\nComo un ángel que lo rescatara de la casa en llamas, lo llevó a la luz.\nY escuchó su risa, una carcajada espeluznante que le desgarró los oídos y la mente."
 TRM_event.66.a: "El demonio fue abatido por el ángel de la muerte"

 TRN_Nomore_Heydrich_tt: "§YHeydrich§! ¿muerto?"
 TRM_lets_go_kill_Heydrich: "§LEl plan para ajusticiar al autor intelectual del atentado contra Seia Yurizono puede ejecutarse.§!"

 TRM_event.67.t: "La oscuridad revelada"
 TRM_event.67.desc: "\"Ya es suficiente… háganla pasar.\"\n\nEn la atmósfera cargada, Kirifuji Nagisa dio la orden hacia la puerta.\nÉsta se abrió pesadamente, y tras los inútiles guardias con los cañones bajos, entró ella, radiante.\nMisono Mika: miembro de Tea Party, amiga de Nagisa y Seia, líder de la facción Pater… y a la vez, la usurpadora que las había traicionado para quedarse con todo.\n\nPese al peso sofocante en la sala, Mika se sentó frente a Nagisa como si nada, apoyó su pistola en la mesa y miró a su alrededor, infantilmente.\nEl silencio lo rompió Nagisa, dejando lentamente su taza.\n\n\"…¿Por qué me miras así? No es la primera vez que entras aquí.\"\n\"Mmm~ sólo quiero memorizar bien todo. Después de todo, pronto será mi oficina, sólo mía.\"\n\nSus palabras rebosaban hostilidad, pero su tono no.\nNagisa cerró los ojos, suspiró, y habló con amargura.\n\n\"…No creí que llegarías tan lejos… en el fondo confiaba en ti, Mika… deseaba que no abrieras esa puerta…\"\n\"Ehei~ no digas tonterías. Tú nunca confías en nadie, Nagicchan~\"\n\"…¿Por qué? ¿Por qué hiciste todo esto?\"\n\"¿De verdad me lo preguntas? Tú lo sabes mejor que nadie~\"\n\nNagisa la miró, cansada.\n\n\"Esa debilidad tuya lo arruinó todo… decepcionaste a todos y me obligaste a hacer esto, sólo fue tu culpa, ¿lo sabes?\"\n\nLa sonrisa de Mika se borró en ese instante.\nDio una palmada y sus soldados entraron a sujetar a Nagisa.\nAfuera, los cuerpos inertes de los últimos guardias leales a Nagisa se desangraban con un agujero en la cabeza.\nMirando esa escena, Nagisa le dedicó a Mika sus últimas palabras:\n\n\"…Las llamas del infierno te esperan, Mika.\"\n"
 TRM_event.67.a: "\"Sí… lo sé, Nagisa.\""

 TRM_event.68.t: "Rendición soviética"
 TRM_event.68.desc: "En la madrugada de hoy llegó a Edén la declaración de rendición incondicional de la Unión Soviética. Misono Mika y su alto mando pensaron en un principio que se trataba de una farsa o de una maniobra de distracción soviética, pero pronto se confirmó su autenticidad cuando en todos los frentes soldados del Ejército Rojo comenzaron a rendirse con banderas blancas.\n\nLos analistas militares de Trinity suponen que, tras una cadena ininterrumpida de derrotas, los propios oficiales soviéticos habrían organizado un golpe de Estado que precipitó el colapso."
 TRM_event.68.a: "¡Una gran victoria!"
 TRM_event.68.b: "¿No? Nos basta con una victoria total."

 TRM_event.69.t: "¿Habla japonés? (日本語は可能ですか？)"
 TRM_event.69.desc: "はい、私は日本語を話します。(Sí, hablo japonés.)\n\nEntonces, ¿habla chino? (如果是的話，你會說中文嗎？)\n\n是的，中文也可以。(Sí, también hablo chino.)\n\nY por último, ¿habla ruso? (Итак, наконец, вы говорите по-русски?)\n\nДа, это возможно. (Sí, es posible.)"
 TRM_event.69.a: "¡Mucho gusto! (よろしくお願いします)"
 TRM_event_69_tt: "§YSe establece un Protectorado Sagrado en los territorios ocupados.§!"
 TRM_event.69.b: "¡Encantado de trabajar con ustedes! (잘부탁합니다)"

 TRM_event.70.t: "La patria derrumbada"
 TRM_event.70.desc: "Tras la derrota en la Gran Guerra Patriótica, hemos perdido todos los territorios del oeste y hemos quedado reducidos a un Estado periférico incapaz de cumplir siquiera sus funciones básicas. Hace tiempo que perdimos el control del Extremo Oriente, y apenas conseguimos mantener Siberia Central y Asia Central. Los ideales de los grandes revolucionarios se han venido abajo."
 TRM_event.70.a: "..."
 TRM_event_70_tt: "§gEl acero se rompió, pero aún quedan fragmentos.§!"

 TRM_event.71.t: "Desintegración de la facción Sanctus"
 TRM_event.71_2.t: "La facción desaparecida"
 TRM_event.71.desc: "Tras el ataque sufrido por su líder, Yurizono Seia, la facción Sanctus, desgarrada por disputas internas, no logró recuperar la cohesión y acabó desintegrándose. A partir de ahora, Sanctus ya no podrá ejercer influencia en el Tea Party."
 TRM_event.71_2.desc: "A medida que la descomposición de Trinity se aceleró, las distintas facciones terminaron por disolverse o desaparecer sin dejar rastro."
 TRM_event.71.a: "..."

 TRM_event.72.t: "Elección de la anfitriona"
 TRM_event.72.desc: "Tras la Gran Transposición y la asamblea extraordinaria, Trinity entra en una nueva etapa. Tras superar los tiempos turbulentos y haber logrado notables avances, la asamblea se disuelve para dar paso a un nuevo orden: Yurizono Seia, líder de la facción Sanctus, asume como anfitriona del Tea Party.\n\nToda Trinity rebosa de alivio y júbilo. Por todas las plazas la gente celebra con brindis y danzas, y entre la algarabía florece un tenue aire de esperanza y paz. Pero, bajo este clima festivo, aún se esconden sombras: comunistas y restos de las SS conspiran en secreto por el poder, aunque su destino está sellado y pronto serán relegados al olvido.\n\nDesde las alturas, Edén brilla como un espejismo, con un sinfín de banderas ondeando al viento: la amarilla de Trinity junto a las de las demás facciones. Cuando la multitud guarda silencio y Yurizono Seia sube al podio, toma asiento sin vacilar y, sin perder tiempo, declara el fin del viejo régimen y proclama que la nueva Trinity triunfará allí donde el anterior fracasó. Los gritos de los miembros del Tea Party pronto son seguidos por los vítores de toda la multitud. Un nombre resuena en la plaza de Trinity, en Edén y en toda la academia: Seia."
 TRM_event.72.a: "¡Gloria a la patria!"

 TRM_event.73.t: "Fisión nuclear"
 TRM_event.73.desc: "El antiguo estado alemán, asentado en los territorios de Trinity, había logrado grandes avances científicos. El fenómeno de la fisión nuclear, descubierto por Otto Hahn, Fritz Strassmann y Lise Meitner, sacudió la comunidad científica y supuso un hito para la física. Sin embargo, los físicos nucleares de Trinity también investigaron su potencial, llegando a la misma conclusión: el poder del átomo podía convertirse en un arma."
 TRM_event.73.a: "Trinity lo utilizará."
 OTTOHAN_tt: "§YAparece un árbol de enfoque para el §Ydesarrollo nuclear§!."
 TRM_event.73.b: "Ja, ridículo."

 TRM_event.74.t: "La próxima presidenta"
 TRM_event.74.desc: "Ahora que las aguas se han calmado, debemos designar a la próxima presidenta que restablezca el equilibrio de Trinity y la guíe hacia el futuro.\n\nCon el poder de Nagisa restaurado, podemos devolverle el cargo o, por primera vez en nuestra historia, establecer un sistema electoral basado en la voluntad popular."
 TRM_event.74.a: "El Tea Party ya no es un simple consejo estudiantil."
 TRM_event.74.b: "Si no es Nagisa, ¿quién liderará Trinity?"

 TRM_event.75.t: "Las primeras elecciones"
 TRM_event.75.desc: "Se han celebrado las primeras elecciones en Trinity. Las candidatas son la actual presidenta y líder de la facción Filius, Kirifuji Nagisa, y Ajitani Hifumi, quien desempeñó un papel clave en la expulsión de la facción Pater. Se prevé una contienda reñida por el liderazgo de Trinity."
 TRM_event.75.a: "Nagisa tiene la autoridad para liderar."
 TRM_event.75.b: "Hifumi ha demostrado su valía."

 TRM_event.76.t: "Visita de la delegación de Trinity"
 TRM_event.76.desc: "Trinity nos ha enviado una delegación para proponer la restauración del Tratado de Edén, anulado de facto por el caos de la Transposición."
 TRM_event.76.a: "Escuchémoslos."
 TRM_event.76.b: "No podemos confiar en ellos."

 TRM_event.77.t: "[FROM.GetName] aprueba el tratado"
 TRM_event.77.desc: "Tras extensas deliberaciones, [FROM.GetName] ha decidido respaldar el Tratado de Edén."
 TRM_event.77.a: "Un primer paso hacia la paz."

 TRM_event.78.t: "[FROM.GetName] expulsa a la delegación"
 TRM_event.78.desc: "[FROM.GetName] ha expulsado a nuestra delegación y no parece dispuesto a tomarse en serio el Tratado de Edén."
 TRM_event.78.a: "¿Acaso esto significa guerra?"

 TRM_event.79.t: "Inicio de las conversaciones Trinity-Gehenna"
 TRM_event.79.desc: "En un principio, Gehenna respondió con frialdad a nuestra propuesta de Gran Compromiso. Sin embargo, tras nuestros esfuerzos persistentes, finalmente han aceptado sentarse a la mesa.\n\nEn el día señalado, las delegaciones de Trinity y Gehenna se reunieron en una sala en la frontera entre ambas academias. Sin intercambiar palabra alguna, la negociación comenzó en un ambiente gélido."
 TRM_event.79.a: "Que ambas naciones lleguen a un acuerdo."

 TRM_event.80.t: "Propuesta: hegemonía de Gehenna"
 TRM_event.80.desc: "El Tratado de Edén, impulsado por Trinity, podría perjudicar los intereses de Gehenna. Es crucial que Gehenna tome las riendas de la organización naciente."
 TRM_event.80.a: "Presentemos la propuesta."
 TRM_event.80.b: "Esto no ayudará al acuerdo."

 TRM_event.81.t: "Propuesta: integración económica"
 TRM_event.81.desc: "Trinity, aprovechando el caos en Gehenna, ha experimentado un rápido crecimiento económico. Integrar las economías beneficiará enormemente a Trinity."

 TRM_event.82.t: "Propuesta: operaciones militares conjuntas"
 TRM_event.82.desc: "Gehenna dispone de una capacidad militar superior a la de Trinity. De aprobarse esta propuesta, Gehenna obtendrá una ventaja considerable."

 TRM_event.83.t: "Propuesta: barrera contra el Este"
 TRM_event.83.desc: "Trinity comparte fronteras con potencias hostiles. Para contener a Polonia y la Unión Soviética, necesitamos el apoyo de Gehenna."

 TRM_event.84.t: "Propuesta: reconstrucción de Gehenna"
 TRM_event.84.desc: "Gehenna quedó sumida en el caos tras la Transposición. Si no la reconstruimos, el Tratado de Edén carecerá de sentido y quedará en el olvido."

 TRM_event.85.t: "Propuesta: hegemonía de Gehenna"
 TRM_event.85.desc: "Gehenna ha expresado su rechazo al liderazgo de Trinity en el Tratado de Edén. Si aceptamos esta propuesta, la hegemonía recaerá en Gehenna."
 TRM_event.85.a: "Aceptamos."
 TRM_event.85.b: "Lo rechazamos."

 TRM_event.86.t: "Propuesta: integración económica"
 TRM_event.86.desc: "Trinity ha logrado modernizar su base industrial tras las convulsiones en Gehenna. Si apoyamos esta propuesta, Trinity obtendrá una importante ventaja industrial."

 TRM_event.87.t: "Propuesta: operaciones militares conjuntas"
 TRM_event.87.desc: "Gehenna tiene una capacidad militar superior a la de Trinity. Si apoyamos esta propuesta, Gehenna ganará una ventaja estratégica notable."

 TRM_event.88.t: "Propuesta: barrera contra el Este"
 TRM_event.88.desc: "Trinity solicita ayuda económica y militar para contener las amenazas en su frontera. Si aprobamos esta propuesta, tendremos que suministrarles recursos."

 TRM_event.89.t: "Propuesta: reconstrucción de Gehenna"
 TRM_event.89.desc: "Gehenna pide apoyo para superar las crisis internas que ha sufrido. Si apoyamos esta propuesta, Gehenna recibirá ayuda económica."

 TRM_event.90.t: "[FROM.GetName] acepta la propuesta"
 TRM_event.90.desc: "[FROM.GetName] ha aceptado la propuesta que presentamos para la organización del Tratado de Edén. Avanzamos con éxito hacia su realización."
 TRM_event.90.a: "Un paso más hacia el Tratado de Edén."

 TRM_event.91.t: "Propuesta rechazada"
 TRM_event.91.desc: "[FROM.GetName] ha rechazado la propuesta que presentamos. El Tratado de Edén enfrenta cada vez más obstáculos."
 TRM_event.91.a: "Esto no ayuda al acuerdo…"

 TRM_event.92.t: "Fracaso del Tratado de Edén"
 TRM_event.92.desc: "A pesar de las largas conversaciones entre ambas naciones, el Gran Compromiso ha fracasado. El abismo entre Trinity y Gehenna parece demasiado profundo, y la organización del Tratado de Edén se ha desvanecido como un espejismo."
 TRM_event.92.a: "Nada bueno…"

 TRM_event.93.t: "Formación de la Organización del Tratado de Edén"
 TRM_event.93.desc: "Tras arduas negociaciones, la Organización del Tratado de Edén ha sido oficialmente establecida. Esta entidad no solo modera las disputas entre Gehenna y Trinity, sino que también ha logrado numerosos acuerdos, augurando un impacto positivo en todas las academias de Kivotos."
 TRM_event.93.a: "Un fruto hermoso."

 TRM_event.94.t: "Sumisión o muerte"
 TRM_event.94.desc: "Era solo cuestión de tiempo antes de que Trinity nos encontrara. Hoy ha llegado un ultimátum dirigido a Arius Branch: sométanse o enfrenten su destrucción."
 TRM_event.94.a: "Arius Branch jamás se rendirá."
 TRM_event.94.b: "Este es nuestro último aliento…"

 TRM_event.95.t: "La resistencia de Arius Branch"
 TRM_event.95.desc: "Arius Branch ha rechazado la sumisión exigida por Trinity. Al rechazar su clemencia, su destino está sellado: solo les aguarda la aniquilación."
 TRM_event.95.a: "Preparad las armas."

 TRM_event.96.t: "La sumisión de Arius Branch"
 TRM_event.96.desc: "Arius Branch ha aceptado las condiciones de nuestro ultimátum y ha quedado oficialmente subordinado a Trinity."
 TRM_event.96.a: "Bien."

 TRM_event.97.t: "Conversaciones con el Comité Disciplinario"
 TRM_event.97.desc: "Con el fin de convencer al Comité Disciplinario de unirse a nosotros, enviamos una delegación diplomática."
 TRM_event.97.a: "Las negociaciones fueron exitosas: ahora están con nosotros."
 TRM_event.97.b: "Fracasamos: el Comité permanece con Gehenna."

 TRM_event.98.t: "Pacto de defensa aérea"
 TRM_event.98.desc: "Trinity ha propuesto un tratado para hacer frente al objetivo del Komintern de propagar el comunismo mediante violencia y subversión. Este pacto prevé el intercambio de información sobre amenazas comunistas y la cooperación estrecha para combatirlas."

 TRM_event.104.t: "¿Gobernador de Moscú?"
 TRM_event.104.desc: "Con la proclamación del Mandato Sagrado de Moscú y el fin de la administración militar, surge la pregunta de quién ocupará el cargo de gobernador. La decisión parece debatirse entre dos candidatos: Kirifuji Nagisa y Siegfried Kasche.\n\nSiegfried Kasche es un administrador eficiente y leal a las órdenes de Trinity, considerado idóneo para el puesto.\n\nKirifuji Nagisa, sin embargo, fue designada directamente por Misono Mika y cuenta con una habilidad política notable, que ya ha demostrado antes de la Gran Transposición. Pero esa misma cercanía a Mika genera recelos: algunos temen que, llegado el momento, traicione a Trinity y se alíe con las fuerzas rojas.\n\nAmbos candidatos despiertan dudas. La discusión sigue abierta: ¿quién gobernará Moscú?"
 TRM_event.104.a: "Kirifuji Nagisa"
 TRM_event.104.b: "Siegfried Kasche"

 TRM_event.3000.t: "Pérdida de legitimidad"
 TRM_event.3000.d: "La Torre Sanctum, que regía todos los aspectos de Kivotos, ha quedado inoperativa tras la guerra. Para reactivarla, es necesario el consentimiento del Presidente General del Consejo Estudiantil. Por ello, hemos decidido investir a uno de los personajes clave de Trinity con ese título, y tras larga deliberación, nuestra elección se reduce a dos estudiantes.\n\nCon la decisión tomada, escribimos lentamente su nombre…"
 TRM_event.3000.a: "...Ajitani Hifumi"
 TRM_event.3000.b: "...Urawa Hanako"
 TRM_event.3000.c: "El poder es la única legitimidad"

 TRN_after_war_event.1.t: "Ingreso de capital"
 TRN_after_war_event.1.desc: "La reunión del gabinete se celebró en un ambiente más alegre que nunca.  
Los asistentes alzaban copas de champán, y su líder observaba la escena con una expresión satisfecha.  
Sobre la mesa descansaba un documento que relataba cómo numerosas empresas alemanas con fábricas en territorio de Gehenna se estaban trasladando a Trinity.  
¿Sería este el fruto de las políticas de inversión e integración implementadas por Mika y la dirigencia de Trinity?  
Las gráficas mostraban claramente el desarrollo económico de Trinity, un triunfo incuestionable.  
\n\n\"Era lo lógico~ ¿Acaso esos despojos de Gehenna tendrían siquiera la inteligencia para evitarlo? ★\"\n\nEra evidente para todos que el viento soplaba a favor."
 TRN_after_war_event.1.a: "Quid pro quo (todo tiene un precio)"

 TRN_after_war_event.2.t: "Fuga de capital"
 TRN_after_war_event.2.desc: "En la pesada oscuridad de la noche, el representante del Ministerio de Economía continuó su exposición con voz temblorosa.  
Las empresas alemanas habían trasladado sus fábricas a Trinity.  
Podría pensarse que no era más que un puñado de fábricas, pero esto no era otra cosa que una señal: la identidad misma de Alemania se estaba transfiriendo a Trinity.  
Lo más preocupante era que la dirigencia de Gehenna había sido incapaz de detener esta corriente.  
\n\n\"En cualquier caso… debemos apresurarnos a diseñar medidas para evitar que el resto de las empresas sigan escapando.\"\nEn la rígida atmósfera de la sala, alguien habló.  
Aunque el desastre ya estaba en marcha, no podían rendirse.  
Era demasiado tarde para abandonar todo ahora."
 TRN_after_war_event.2.a: "Aunque el ganado se pierda, hay que reparar el establo."

 TRN_after_war_event.16.t: "Boom industrial"
 TRN_after_war_event.16.desc: "Por fin la reconstrucción ha concluido. La misión de Johannes también.  
Con el término oficial de las obras de reconstrucción de Trinity, Johannes y su equipo serían disueltos.  
\n\nHabían sido muchas las experiencias. Johannes y sus compañeros recorrieron todo el territorio, levantando obras en todas partes, enfrentando todo tipo de vicisitudes.  
\n\nRecordó con nostalgia cuando, lleno de determinación, llegó por primera vez a aquel distrito industrial abandonado. Entonces, su confianza era inquebrantable.  
Luchó por transformar una fábrica militar en una civil, y cuando pensaba que podía por fin regresar a casa, lo enviaron a tender cables eléctricos. Apenas terminó las obras eléctricas, lo mandaron al extremo opuesto del país para abrir caminos en medio de un campo minado, y hasta participó en un concurso de eslóganes de propaganda que ganó y cuyos versos vio luego impresos por todo el territorio, causándole una vergüenza infantil.  
Incluso se atrevió una vez a dirigirse directamente a Mika con una crítica.  
\n\nAhora, Johannes evocaba todos esos recuerdos con una ligera melancolía, mientras se ajustaba su traje en vez de su uniforme y casco.  
\n\nUn silbato sonó, y Johannes entró al vagón del tren, llevando consigo la alegría de por fin regresar a casa y toda la amalgama de emociones acumuladas.  
\n\nEn un elegante edificio de la vasta zona industrial de Prusia Oriental, Brian contemplaba la escena con sentimientos similares.  
Recordaba la brutal exacción que había sufrido como campesino desde la época del Imperio Alemán, los impuestos, los días en que, por falta de dinero, su familia entera lloraba mientras comían malas hierbas…  
\n\nPero ahora Brian no tenía un cuerpo esquelético, sino robusto, y vestía un distinguido traje en lugar de harapos de campesino. No empuñaba un azadón, sino que revisaba documentos en la oficina del director. Al asomarse por la ventana, contempló su fábrica, que echaba humo sin parar, y sonrió con orgullo.  
\n\nEn la capital de Trinity, la majestuosa ciudad de Edén, también una joven de cabellos rosados y alas contemplaba la vista desde su despacho.  
Observaba la ciudad llena de vida y de humo industrial, y entre la multitud, divisó a un hombre y una mujer sonriendo mientras caminaban con su hijo de la mano.  
Misono Mika sonrió suavemente, pensando con orgullo que, aunque fuera una simple marioneta, había logrado que Trinity prosperara tanto.  
\n\nConsciente de su propio papel, apartó deliberadamente la mirada del humo blanco que se elevaba en la lejana zona de los campos de concentración, perdiéndose en la contemplación de la hermosa y pura capital."
 TRN_after_war_event.16.a: "La gloria perdurará por siempre"


 #아리우스 스쿼드 문제
 TRN_opposition.1.t: "Informe del Servicio Central de Información: Saori Jomae"
 TRN_opposition.1.d: "Número de expediente: ABS-001050213\nSujeto: Saori Jomae\nFecha de nacimiento: desconocida\nLugar de origen: presumiblemente Distrito Autónomo de la Filial Arius\nCarrera: Líder del Escuadrón Arius (actual)\nParadero: desconocido\n\n-Introducción\nSaori Jomae ha sido identificada como líder del Escuadrón Arius, una pequeña fuerza independiente asociada a Arius, y ha sido observada en repetidas ocasiones en escenarios de alto riesgo relacionados con Arius.\n\n-Desarrollo\nSegún la División de Seguridad del Servicio Central de Información, incluso en las actuales circunstancias inestables, Saori Jomae sigue siendo considerada una amenaza significativa para Trinity.\nDesde que fue vista en un enfrentamiento hace medio año, su paradero es desconocido y todos los organismos de seguridad de Trinity la siguen buscando sin resultados por el momento...(se omite)"
 TRN_opposition.1.a: "Aunque camine por el valle de la sombra de la muerte..."

 TRN_opposition.2.t: "Informe del Servicio Central de Información: Atsuko Hakari"
 TRN_opposition.2.d: "Fecha de nacimiento: desconocida\nLugar de origen: presumiblemente Distrito Autónomo de la Filial Arius\nCarrera: Heredera legítima de la Filial Arius (anterior)\n         Miembro del Escuadrón Arius (actual)\nParadero: desconocido\n\n-Introducción\nAtsuko Hakari, miembro del Escuadrón Arius, fue identificada como heredera legítima de la presidenta del consejo estudiantil de Arius por linaje, pero aparentemente cayó en desgracia por motivos desconocidos y desde entonces se integró en el escuadrón.\n\n-Desarrollo\nActualmente se desconoce su paradero y se la considera una amenaza potencial para la cohesión interna de Trinity.\nEs una figura con la capacidad de unificar los restos de la Filial Arius, por lo que las autoridades...(se omite)"

 TRN_opposition.3.t: "Informe del Servicio Central de Información: Misaki Imashino"
 TRN_opposition.3.d: "Número de expediente: ABS-001050232\nSujeto: Misaki Imashino\nFecha de nacimiento: desconocida\nLugar de origen: presumiblemente Distrito Autónomo de la Filial Arius\nCarrera: Miembro del Escuadrón Arius (actual)\nParadero: desconocido\n\n-Introducción\nMisaki Imashino es miembro del Escuadrón Arius.\nSegún los testimonios y su comportamiento, parece presentar problemas psicológicos, y en algunas imágenes se observan cicatrices autoinfligidas.\n\n-Desarrollo\nActúa prácticamente como comandante de campo del escuadrón y, al ser la única que utiliza armas pesadas, ha causado las mayores bajas al personal de Trinity en enfrentamientos anteriores.\nFue la última en ser vista del escuadrón, hace dos semanas en Dresde, donde escapó de una persecución cruzando el río Elba. Su paradero actual...(se omite)"

 TRN_opposition.4.t: "Informe del Servicio Central de Información: Hiyori Tsuchinaga"
 TRN_opposition.4.d: "Número de expediente: ABS-001050242\nSujeto: Hiyori Tsuchinaga\nFecha de nacimiento: desconocida\nLugar de origen: presumiblemente Distrito Autónomo de la Filial Arius\nCarrera: Miembro del Escuadrón Arius (actual)\nParadero: desconocido\n\n-Introducción\nHiyori Tsuchinaga es miembro del Escuadrón Arius.\nPosee una destacada habilidad como francotiradora y, junto a Misaki Imashino, es considerada uno de los activos tácticos más importantes del escuadrón.\nSin embargo, según los testimonios, presenta graves problemas de sociabilidad y sus relaciones interpersonales son deficientes.\n\n-Desarrollo\nActualmente es considerada el objetivo más peligroso entre los miembros del escuadrón.\nEn su último avistamiento, neutralizó con un solo disparo cada uno de los tres vehículos blindados de la policía militar que la perseguían, causando múltiples bajas...(se omite)"

 TRN_opposition.200.t: "Fin de la represión"
 TRN_opposition.200.d: "La búsqueda de los principales objetivos que amenazaban la estabilidad de nuestro gobierno finalmente ha concluido. El Departamento de Seguridad se retira del caso para centrarse en otros asuntos urgentes.\n\nEsperemos que su operación no haya sido en vano y que la estabilidad de nuestra joven administración esté asegurada."
 TRN_opposition.200.a: "Hicimos lo que pudimos."

 TRN_opposition.100.t: "Nuevas reglas de enfrentamiento"
 TRN_opposition.100.d: "Nuestro Departamento de Seguridad sigue trabajando arduamente en la búsqueda del enemigo, a la espera de nuestras órdenes. Si se considera necesario, podemos darles la orden de cambiar sus tácticas de búsqueda.\n\nPrimero, podemos capturar a los objetivos con vida y encerrarlos en prisión. Si los mantenemos en un lugar bajo vigilancia constante, dejarán de ser una amenaza.\n\nSegundo, podemos ordenar al Departamento de Seguridad que ejecute a cualquier opositor que encuentren. Una solución simple y definitiva.\n\n¿Cuál es su decisión?"
 TRN_opposition.100.a: "Acábalos por completo. Ellos habrían hecho lo mismo con nosotros."
 TRN_opposition.100.b: "Quizá la prisión acabe con sus ambiciones."
 TRN_opposition.100.c: "No los queremos dentro de nuestras fronteras."

 #조마에 사오리
 TRN_opposition.11.t: "Escape"
 TRN_opposition.11.d: "Sacudiendo todas sus ansiedades, Saori cruzó el río.\nEn la noche tardía, en las aguas tranquilas del Danubio, su última frontera,\nSaori soñó con el futuro que le aguardaba.\n\nSeguramente, alguien preciado para ella la estaría esperando en la otra orilla.\nYa no tendría que vivir escondida en la oscuridad, ni temer a la violencia o la injusticia.\nPor fin podría salir del oscuro valle de la muerte y vivir con dignidad.\n\nCuando llegó a la otra orilla, miró atrás.\nSu pasado que la atormentaba, Arius, Trinity, toda esa ira y desesperación estaban ahora al otro lado del río.\n\nPero ante sus ojos solo había una simple playa de guijarros.\nNadie la esperaba, ni un brillante futuro se presentaba.\nA lo lejos solo se veían un tranquilo pueblo dormido y pacíficos bosques.\nUna intensa sensación de vacío inundó su pecho, que hasta hacía un momento estaba lleno de esperanza y pasión.\n\nRió para sí misma.\nFinalmente entendió el verdadero significado de aquel proverbio que siempre recitaba, dejado por un profeta.\nEl mundo era hermoso y precioso precisamente porque es vano."
 TRN_opposition.11.a: "Por tanto alabé la alegría, pues no hay nada mejor debajo del sol que comer, beber y alegrarse."
 TRN_opposition.112.t: "Tenedor roto"
 TRN_opposition.112.d: "\"…¿Qué es esto?\"\n\nAl leer el telegrama, Mika sonrió como si no entendiera nada y miró a su secretaria.\n\n\"¿Movilizamos a tanta gente y equipo pesado… y no pudieron atrapar a una sola?\"\n\nEl tenedor en su mano se dobló y se deformó por completo.\nViendo eso, la secretaria inclinó la cabeza de inmediato.\n\n\"Lo sentimos mucho, presidenta… tomaré medidas para preparar una lista de responsables…\"\n\"…Ya basta. De todas formas sola no podrá hacer nada. Pero asegúrate de atrapar a las otras tres, ¿entendido?\"\n\nCon una expresión indiferente, Mika apoyó su mentón.\nLa secretaria volvió a inclinarse antes de salir apresuradamente.\nMika, mirando el tenedor doblado en su mano, lo arrojó hacia la puerta por donde había salido la secretaria.\nEl tenedor voló y se clavó profundamente en la madera mientras ella, insatisfecha, lo miraba en silencio."
 TRN_opposition.112.a: "...No me gusta"

 TRN_opposition.21.t: "El profeta habla"
 TRN_opposition.21.d: "Todas sus acciones y su voluntad solo buscaban proteger a las personas más importantes para ella.\nAunque cedió ante una realidad hecha de odio y asesinato, estaba decidida a no entregarlas.\n\nPero incluso para ella, el final llegó.\nLas cadenas de causa y efecto que ella misma había forjado en su camino acabaron por apuntar sus cañones contra ella y todo su escuadrón.\n\nCuando la última vaina cayó de la recámara, innumerables líneas rojas hechas de odio y rencor la rodearon y la inmovilizaron.\nToda su resistencia fue en vano.\nFrente al destino inminente, Saori cerró los ojos."
 TRN_opposition.21.a: "Vanidad de vanidades, todo es vanidad"
 TRN_opposition.212.t: "Un final inútil"
 TRN_opposition.212.d: "Las mañanas de Mika siempre empezaban un poco tarde en comparación con las demás estudiantes.\nSe levantaba a las 9 y con la ayuda de sus asistentes se arreglaba.\nLe encantaba adornar sus alas y su ropa con accesorios que elegía personalmente.\n\nDespués de arreglarse a la perfección, desayunaba a las 11.\n\nPero aquella mañana su tiempo tranquilo fue interrumpido por un visitante no deseado.\nA Mika le molestaba ser interrumpida por las mañanas y miró a su secretaria con una sonrisa incómoda.\n\n\"Buenos días, secretaria-☆. Seguro que vienes por algo importante, ¿verdad?\"\n\"…Lamento interrumpir su desayuno, Mika-sama…\"\n\nLa secretaria, apresurada, le entregó un telegrama.\n\nAl leerlo, Mika sonrió de satisfacción.\nSaori, la mujer más peligrosa de Arius, había muerto.\n\n\"…Hasta el final fingió ser una líder, ¿eh? Las demás, quemen sus fotos y échenlas al mar~☆\"\n\nMientras la secretaria se retiraba, Mika pinchó una pequeña fresa con su tenedor.\nParecía que iba a ser un buen día."
 TRN_opposition.212.a: "Un buen comienzo de día"

 TRN_opposition.31.t: "Orgullo"
 TRN_opposition.31.d: "Saori pasó toda su vida resistiendo.\nPero también cedió para proteger.\nSiempre fue una contradicción humana.\n\nPero creía que todo en el mundo era vano y que algún día todo—adultos, academias, ira, rencor—se convertiría en polvo.\n\nPor eso no se rindió.\nAunque su escuadrón se dispersó y ella corría por catacumbas oscuras, mantenía la esperanza.\nArius había caído.\nQuizá esto era la última prueba que le imponía el destino.\nY al final, alcanzaría la libertad que deseaba.\n\nPero al final de la oscuridad no había salvación.\nLuces cegadoras la dejaron ciega y sintió muchas manos arrastrándola de nuevo a la oscuridad.\nLa liberación siempre estaría fuera de su alcance."
 TRN_opposition.31.a: "...Y pensé que los muertos eran más afortunados que los vivos"
 TRN_opposition.312.t: "Una vida miserable"
 TRN_opposition.312.d: "Al leer el informe, Mika no pudo contener la risa.\n\n\"¡Ahahaha! ¿Así que la famosa Saori de Arius no pudo ni suicidarse y fue capturada? Con lo altanera que era, ¡qué gracioso-!\"\n\nDespués de reírse un buen rato, dio instrucciones a su secretaria.\n\n\"Por ahora trátala bien, como a una invitada de honor. Eso le será más humillante~\"\n\"Sí, lo transmitiré.\"\n\nTras hacer una reverencia, la secretaria salió de la sala.\nMika se llevó una pequeña salchicha a la boca mientras imaginaba a Saori, miserable en el campo de prisioneros.\nUna risa infantil llenó la habitación."
 TRN_opposition.312.a: "Veamos cómo me divierto con ella"

 # 이마시노 미사키
 TRN_opposition.12.t: "El buen samaritano"
 TRN_opposition.12.d: "Misaki cayó inconsciente en el suelo de una alcantarilla llena de aguas residuales.\nHabía contratado a un corredor para cruzar la frontera, hasta allí todo había ido bien.\nPero nada más cruzar, él la traicionó y la vendió.\nMisaki tuvo que huir por callejones laberínticos, esquivando balas con todas sus fuerzas.\n\nHabiendo entregado todas sus pertenencias al corredor, pasó días sin comer ni beber y su cuerpo se debilitó, incapaz de moverse mientras yacía en el suelo.\nPensó que finalmente había llegado la liberación que tanto había deseado, y cerró los ojos sin resistencia.\n\nPero Misaki no pudo descansar en paz.\nCuando abrió los ojos varios días después, frente a ella había un grupo de huérfanos.\nLa habían encontrado, la habían lavado y curado, y aunque apenas tenían para comer, compartían su escasa comida con ella.\nSentía una emoción tan extraña que ni siquiera pudo dar las gracias antes de salir apresuradamente.\n\nMientras caminaba por el campo fuera de la ciudad, Misaki dejó de lado por un momento la confusión que sentía.\nApresuró el paso para reunirse con los demás, añadiendo una pequeña duda a su antiguo proverbio:\n'Todo en este mundo es vano, pero quizá valga la pena vivir.'"
 TRN_opposition.12.a: "Nada hay mejor para el hombre que alegrarse en sus obras, pues esa es su porción"
 TRN_opposition.122.t: "Culpa por asociación"
 TRN_opposition.122.d: "Hoy, como siempre, llegaron numerosos documentos al despacho de Mika.\nBostezando ligeramente, se sentó cómodamente y empezó a revisarlos.\nLa mayoría no le interesaban demasiado.\nLa 'limpieza' de judíos y minorías era más cosa de los fanáticos que la habían puesto allí.\nLas tareas de incineración en la destruida autonomía de Arius o los preparativos para invadir Gehenna eran cosas a las que solo tenía que poner su sello.\nComo una estudiante aburrida con su tarea, hojeaba los papeles con desgana hasta que uno llamó su atención.\n\n\"…¿Mm? ¿Qué es esto?\"\n\"Es sobre el seguimiento a Ima shino Misaki, una de las del Escuadrón Arius.\"\n\"Hmm…\"\n\nCon curiosidad, Mika abrió el archivo.\n\n\n\nTras leer un poco, su rostro se endureció y lanzó el archivo frente a su secretaria.\n\n\"…Ni siquiera era la líder… ¿y aún así, decenas de muertos sin poder atraparla?\"\n\nLa atmósfera que emanaba hizo que la secretaria sudara frío, incapaz de pronunciar palabra.\n\n\"¿Además rompió el control fronterizo? …Ja… arresten a todos los responsables de ese puesto, incluidas sus familias.\"\n\nCon una risa amarga y una mirada enloquecida, la secretaria se inclinó apresuradamente antes de salir corriendo, agradecida de que esa ira no se dirigiera hacia ella."
 TRN_opposition.122.a: "Los hijos morirán por culpa de sus padres"

 TRN_opposition.22.t: "Caída solitaria"
 TRN_opposition.22.d: "Misaki comprendía más que nadie la enseñanza de que todo en el mundo es vano.\nPor eso siempre quiso abandonar todo y descansar, en lugar de seguir sufriendo en este mundo vacío.\n\nPero siempre había alguien que la retenía, que no la dejaba ir.\nMientras ellos estuvieran, Misaki pospondría su final.\n\nSin embargo, a pesar de todos sus esfuerzos, el mundo no los dejó en paz.\nDespués de disparar su último misil, arrojó el lanzador y subió al borde del acantilado.\nLos sabuesos que la perseguían gritaban su nombre.\n\nDe pie allí sola, sintió la soledad.\nEsta vez estaba completamente sola.\nLas personas que la detenían ya no estaban a su lado.\nSin dudarlo, se dejó caer lentamente hacia atrás.\nEn el viento que le azotaba el rostro, Misaki por fin sintió paz."
 TRN_opposition.22.a: "Ay del que cae y no tiene quien lo levante"
 TRN_opposition.222.t: "Daños colaterales"
 TRN_opposition.222.d: "Hoy, como siempre, llegaron numerosos documentos al despacho de Mika.\nBostezando ligeramente, los hojeó sin interés.\nLa limpieza de judíos y minorías, la incineración en Arius o la invasión a Gehenna eran temas de otros.\nHasta que uno llamó su atención.\n\n\"…¿Mm? ¿Qué es esto?\"\n\"Es sobre Ima shino Misaki, una de las del Escuadrón Arius.\"\n\"Hmm…\"\n\nMika hojeó el archivo con una ligera sonrisa de curiosidad.\n\n\n\n\"…¿Muerta? ¿Y por su propia mano?\"\n\"No tengo excusas. Lo siento.\"\n\"Y aún así… ¿tantos de los nuestros murieron? Bueno, no eres tú quien tiene que disculparse…\"\n\nTocando la mesa con su dedo, Mika habló finalmente con una sonrisa pesada.\n\n\"No dejen escapar a ninguno de los responsables. ¿Lo entiendes?\"\n\nLa secretaria lo entendió mejor que nadie: esa sonrisa era la sentencia para muchos."
 TRN_opposition.222.a: "¿Pensaste que te felicitaría?"

 TRN_opposition.32.t: "Arrepentimiento vano"
 TRN_opposition.32.d: "Su último misil surcó el cielo y explotó, rociando metralla sobre sus perseguidores.\nTras contemplar sus cadáveres sin emoción, Misaki arrojó el lanzador y huyó al bosque.\n\nMientras corría, repasaba su situación.\nEl Escuadrón estaba disperso y todos intentaban cruzar hacia el sur.\nTenía que reunirse con ellos.\n\nPero la duda la invadió.\nLas posibilidades de salir ilesa eran mínimas.\nSi la atrapaban, ni siquiera podría respirar libremente.\nQuizá sería mejor acabar ella misma con todo.\n\nPero ya era tarde.\nLos perseguidores emboscados aparecieron entre los árboles y la rodearon.\nEn un último intento desesperado, apuntó su pistola a su propia cabeza.\nPero el cartucho falló.\n\nTodo es vano.\nEste mundo, la resistencia, la felicidad, la tristeza, todo es vano.\nIncluso su propia cobardía era vana.\nFinalmente fue arrastrada a la oscuridad que tanto odiaba y temía."
 TRN_opposition.32.a: "Todos sus días son dolor y tristeza, y ni de noche descansa su corazón; también esto es vanidad"
 TRN_opposition.322.t: "Homicidio por consentimiento"
 TRN_opposition.322.d: "Hoy, como siempre, llegaron numerosos documentos al despacho de Mika.\nBostezando ligeramente, hojeó sin interés hasta que uno llamó su atención.\n\n\"…¿Mm? ¿Qué es esto?\"\n\"Es sobre Ima shino Misaki, una de las del Escuadrón Arius.\"\n\"Hmm…\"\n\nMika hojeó el archivo con una leve sonrisa.\n\n\n\n\"Qué ridícula… ¿Tanto escándalo solo para acabar atrapada? Vaya que se cobraron vidas por ella.\"\n\"Lo siento, Mika-sama…\"\n\nMika examinó detenidamente la foto incluida, fijándose en las cicatrices de sus brazos y cuello.\nCon una sonrisa maliciosa, ordenó:\n\n\"No al campo normal. Mándala al que está en la costa báltica, ya sabes cuál.\"\n\"…Entendido.\"\n\nIncluso solo con la foto, Mika entendió que eran cicatrices autoinfligidas.\nY le divertía pensar cuánto tardaría esa mujer en romperse bajo la violencia.\nAunque no entendía por qué se lastimaba, sabía que viviría con secuelas toda su vida.\nEsa idea la hizo reír."
 TRN_opposition.322.a: "Memento mori"

 
#하카리 아츠코
 TRN_opposition.13.t: "Un amanecer intacto"
 TRN_opposition.13.d: "Justo antes del amanecer, cuando todo aún dormía,\nAtsuko subió por el empinado sendero de la montaña con sus últimas fuerzas.\nYa estaba agotada y cubierta de polvo, pero no se detuvo.\n\nCuando alcanzó la cima, la vista se abrió ante ella.\nUn campo despejado y algunas casas dispersas a lo lejos.\nDe algunas casas salía luz, y banderas de color rojo, blanco y azul ondeaban por aquí y allá.\n\nAtsuko comprendió que lo había logrado.\nBajó la mirada al valle y exhaló lentamente.\nEl aire frío y puro del amanecer despejó su mente, y la oscuridad de la noche, que tanto temía, le pareció ahora elegante y amable.\nComo si bailara, saltó entre la hierba avanzando sin parar.\n\nAl poco tiempo, bajó de la montaña y se recostó sobre un tronco en medio del campo.\nEl sol ya comenzaba a salir.\n¿Cuándo había sido la última vez que contempló el sol con tranquilidad?\nAunque el mundo no había cambiado, todo le parecía nuevo y hermoso.\nHakari Atsuko finalmente soltó todas sus ataduras."
 TRN_opposition.13.a: "¿Hay algo nuevo bajo el sol? Ya existía desde antiguo."
 TRN_opposition.132.t: "Cuando miras al abismo"
 TRN_opposition.132.d: "Aunque no tanto como Nagisa, ella también era una de las amigas más queridas de Mika.\nA veces la irritaba con palabras largas e incomprensibles, pero aún así, era adorable.\n\nPor eso, Mika no quería que terminara así.\nNo era su destino.\nY sin embargo, en sus sueños, siempre la miraba con ojos vacíos desde la superficie de un lago de sangre.\nNo solo ella.\nTambién las innumerables personas que Mika había eliminado la miraban desde su lado.\n\nPor suerte, aquella noche, lo que la despertó no fue una pesadilla, sino una llamada telefónica.\nMika se sentó aturdida y levantó el auricular.\n\n\nNo mucho después de recibir la llamada, destrozó el auricular con las manos y salió de su dormitorio.\n\nCuando su secretaria llegó corriendo al despacho, encontró a Mika cubierta de rojo entre muebles destrozados y varios responsables del operativo tirados en el suelo.\n\nMientras la secretaria salía para gestionar la situación, Mika miró una foto en su escritorio.\nEn ella, Hakari Atsuko sonreía suavemente, caminando por un campo bajo la luz de la luna como si bailara.\n\nLuego, Mika vio su propio reflejo en un espejo roto.\nCubierta de sangre y polvo, su figura era patética y siniestra.\n\n\"…¿Qué estoy haciendo…?\"\n\nSu voz seca resonó en la habitación, pero nadie le respondió."
 TRN_opposition.132.a: "El abismo también te observa"

 TRN_opposition.23.t: "Que no nos volvamos a ver"
 TRN_opposition.23.d: "Heredera de la sangre noble de las presidentas guardianas de Arius, ella estaba destinada a ser la nueva presidenta.\n\nPero en medio del caos fue reducida a un simple sacrificio por la gloria de Arius.\nSu trono legítimo le fue arrebatado por un adulto y su futuro se tiñó de gris.\n\nPero Hakari Atsuko no se quebró.\nCon sus amigas, como su familia, albergó la pequeña esperanza de ser libre algún día.\nEsa pequeña esperanza la mantuvo firme.\n\nPero también sabía que no quería ver a sus seres queridos heridos otra vez.\nEligió sacrificarse para desviar la atención de los perseguidores.\nEn la bruma roja que la envolvió como abrazándola, por fin sintió la liberación.\n\nLo último que vio fueron los rostros de sus tres personas más queridas.\nLas que nunca volvería a ver, las que más amaba.\nAtsuko se despidió de ellas en silencio."
 TRN_opposition.23.a: "...Y por fin, que seas feliz."
 TRN_opposition.232.t: "El acto más sublime"
 TRN_opposition.232.d: "Aunque no tanto como Nagisa, ella también era una de las amigas más queridas de Mika.\nA veces la irritaba con sus palabras enrevesadas, pero aún así, era adorable.\n\nPor eso, Mika no quería que terminara así.\nNo era su destino.\nY sin embargo, en sus sueños, ella siempre la miraba desde la superficie ensangrentada con ojos vacíos.\nNo solo ella.\nLas innumerables personas eliminadas por Mika también la miraban desde su lado.\n\nPor suerte, aquella noche no fue una pesadilla, sino una llamada telefónica la que la despertó.\nMika se sentó, tomó el auricular y escuchó en silencio.\n\nLuego colgó y se quedó pensativa.\n\nHakari Atsuko, la legítima heredera de Arius, se había lanzado al fuego como sacrificio.\nAunque no debía ser así, se había ofrecido para proteger cosas insignificantes.\nSi eso tenía sentido o no, ya no importaba.\n\nConfusa, Mika levantó de nuevo el auricular y llamó a su secretaria.\n\n\"…Trae a Hakari Atsuko aquí, y que no se rompa en el camino.\"\n\nSolo quería ver con sus propios ojos el final que ella había elegido.\nQuizá así podría dormir tranquila por un tiempo.\nIgnorando las voces en su cabeza, cerró los ojos y se dejó caer en la cama."
 TRN_opposition.232.a: "La vela no existe para iluminarse a sí misma"

 TRN_opposition.33.t: "Regreso"
 TRN_opposition.33.d: "Cada persona tiene su propio destino.\nSabemos que hay tantos destinos como personas, sin importar su peso.\nEl destino de Atsuko era un trono brillante pero solitario.\n\nPero ella resistió, por voluntad propia o ajena.\nSolo quería ser una estudiante normal, no una princesa ni un sacrificio, caminar junto a quienes amaba.\n\nPero el destino volvió de forma tan repentina como cuando se lo arrebataron.\nAl ver a los sabuesos de Trinity entrar a su humilde escondite, entendió que no había escapado.\n\nAsí fue llevada de nuevo a la oscuridad.\nLa princesa regresó a su trono frío y solitario."
 TRN_opposition.33.a: "Más vale no haber visto la luz ni conocido el mundo"
 TRN_opposition.332.t: "Noche oscura"
 TRN_opposition.332.d: "Aunque no tanto como Nagisa, ella también era una de las amigas más queridas de Mika.\nA veces la irritaba con sus palabras enrevesadas, pero aún así, era adorable.\n\nPor eso, Mika no quería que terminara así.\nNo era su destino.\nY sin embargo, en sus sueños, ella siempre la miraba desde la superficie ensangrentada con ojos vacíos.\nLas innumerables personas eliminadas por Mika también la miraban.\n\nPor suerte, aquella noche fue una llamada telefónica la que la despertó.\nMika se sentó, tomó el auricular y escuchó.\n\nAl colgar, sonrió ampliamente mientras movía los pies sentada en la cama.\n\nHabían capturado a Hakari Atsuko.\nSin pérdidas ni combate, en silencio.\nA diferencia de los militares torpes, la policía secreta había sido eficiente.\n\nCon Atsuko capturada, Arius ya no era una amenaza.\nPor primera vez en mucho tiempo, Mika sintió que todo volvía a encajar.\nSe recostó en la cama y miró por la ventana.\n\nDespués de todo, ella también podría brillar como las estrellas cuando todo terminara.\nCon esa creencia, cerró los ojos y se durmió."
 TRN_opposition.332.a: "Solo en la oscuridad se pueden ver las estrellas"

 # 츠치나가 히요리
 TRN_opposition.14.t: "¿No lo viste venir?"
 TRN_opposition.14.d: "Sinceramente, nadie lo habría imaginado.\n¿Quién habría pensado que una fugitiva, en pleno día, compraría un billete de tren para cruzar la frontera?\n\nElla tuvo la osadía de colarse en una catedral, robar un hábito de monja, y cargar todo su equipaje en un vagón de transporte de ganado.\nDespués, tomó asiento en el rincón más apartado del tren, adoptó una postura piadosa como si rezara, y se quedó profundamente dormida.\n\nIncluso cuando los inspectores subieron al tren en la frontera, no vieron su halo porque estaba dormida, y su presencia era tan insignificante que nadie sospechó que fuera miembro del escuadrón Arius.\n\nCuando la gendarmería se dio cuenta de que ella era Tsuchinaga Hiyori, ya había llegado a la estación central de Budapest.\nSentada en el campo frente a la estación, estiró los brazos bajo el cálido sol y, por primera vez en mucho tiempo, miró al cielo azul y sonrió feliz."
 TRN_opposition.14.a: "Jeje~ ¡Sobreviví~!"

 TRN_opposition.144.t: "Frente a la dura realidad"
 TRN_opposition.144.d: "Kirifuji Nagisa y Misono Mika eran amigas desde hacía mucho tiempo.\nPero en las circunstancias actuales, ya no podían llamarse amigas.\nNagisa era una derrotada, privada de su libertad por el golpe de Estado, y Mika era quien la había derrocado.\n\nFrente a ellas, una elegante mesa de té, pero con ventanas enrejadas y guardias armados en la puerta.\nDentro, Mika parloteaba alegremente como siempre, contando trivialidades.\nNagisa, sin mostrar emoción alguna, sorbía su té en silencio.\nAunque sin sirvientes ni luz del sol desde hacía tiempo, aún conservaba su porte.\n\n\"Y entonces, ese perrito, ¿sabes?—\"\n\"Señora Mika, ha llegado un telegrama.\"\n\nSu secretaria interrumpió la charla banal.\nMika, aún sonriendo, leyó en silencio el mensaje.\n\n\n\n\"…¿Qué?\"\n\nEn un instante, su expresión se torció y la habitación quedó en silencio.\n\n\"¿Escapó? ¿En un tren…? ¿Me estás tomando el pelo?\"\n\"El ministerio pertinente está investigando…\"\n\nAntes de que la secretaria pudiera terminar, Mika le lanzó la taza, que se rompió contra su frente, haciéndola sangrar.\n\n\"¿Son idiotas? ¿Cómo pudieron dejar escapar a esa mocosa inútil con un truco tan barato? ¡Esto es inaceptable!\"\n\"…Je…\"\n\nLa carcajada de Nagisa detuvo la furia de Mika.\nCon una sonrisa fría y sin color, Nagisa la miró.\n\n\"Tus malos hábitos han empeorado, Mika. Siempre que las cosas no salían como querías, lloriqueabas como un bebé.\"\n\nSonrojada de ira, Mika salió de la habitación matando a tiros a los dos guardias que se interpusieron.\nNagisa, sola, sorbió su té con una tenue sonrisa. Todo se desmoronaba, pero al menos en ese momento, ella sonreía."
 TRN_opposition.144.a: "La sonrisa es lo único que me queda."

 TRN_opposition.24.t: "Última disculpa"
 TRN_opposition.24.d: "Un disparo resonó en toda la calle y alcanzó la frente de un desafortunado.\nMientras los perseguidores se dispersaban, Hiyori recargó el cerrojo.\n\nSu vida siempre fue desdichada.\nAislada y reprimida, solo quería sobrevivir.\nEn medio de la violencia y las críticas, luchó ferozmente por vivir, y por eso seguía apretando el gatillo.\n\nPero la resistencia no duró mucho.\nCuando recargaba su arma, alguien pateó la puerta y ella disparó al hombro del primero.\nPero otro se abalanzó sobre ella y su disparo fallido la desarmó, cayendo contra la pared.\n\nEn su conciencia desvanecida, vio al perseguidor que la había abatido llorar mientras abrazaba el cadáver de su compañero.\n\n\"…Lo siento… lo… siento…\"\n\nCon su última fuerza, susurró una disculpa sincera, la primera que pronunciaba a alguien."
 TRN_opposition.24.a: "Así como el necio sufre, también yo, y esto también es vanidad."

 TRN_opposition.244.t: "Vosotros sois la sal del mundo"
 TRN_opposition.244.d: "Kirifuji Nagisa y Misono Mika eran amigas desde hacía mucho tiempo.\nPero ya no podían llamarse amigas.\nNagisa era una derrotada, Mika su verdugo.\n\nFrente a ellas, una elegante mesa, pero con rejas en las ventanas y guardias armados afuera.\nMika parloteaba como siempre, y Nagisa bebía en silencio, aún con dignidad.\n\n\"Y entonces, ese perrito, ¿sabes?—\"\n\"Señora Mika, ha llegado un telegrama.\"\n\nMika leyó el mensaje, aún sonriendo.\n\n\n\n\"Ajá… ¿y? ¿Qué esperas que haga?\"\n\nCon una sonrisa inquisitiva, Mika miró a su secretaria.\n\n\"¿Debo alegrarme de recibir un informe así en un momento como este?\"\n\"Perdón… no lo pensé…\"\n\nNagisa observó en silencio.\nAquella no era la Mika que conocía.\nSuspiró para sí misma, sintiendo el amargor del té."
 TRN_opposition.244.a: "Si la sal pierde su sabor, ¿con qué será salada?"

 TRN_opposition.34.t: "Pesados pasos"
 TRN_opposition.34.d: "Tsuchinaga Hiyori era la mejor francotiradora de Arius.\nPero no era invencible.\n\nCon docenas persiguiéndola, solo podía esconderse.\nCuando los perseguidores rodearon el pueblo, ella se ocultó bajo un lavabo.\n\nPero ya no podía esconderse más.\nLos perseguidores incendiaban las casas una por una.\nAl ver las llamas, acarició su pistola.\n\nPero negó con la cabeza y la dejó.\nTodo era en vano, pero quería vivir.\n\nLevantó las manos y salió al exterior.\nCada paso pesado y pegajoso, pero sabía que era su única opción."
 TRN_opposition.34.a: "No seas demasiado malvado ni demasiado necio; ¿por qué morir antes de tiempo?"

 TRN_opposition.344.t: "Bienaventurados los mansos"
 TRN_opposition.344.d: "Kirifuji Nagisa y Misono Mika eran amigas desde hacía mucho tiempo.\nPero ya no podían llamarse amigas.\nNagisa era una derrotada, Mika su verdugo.\n\nFrente a ellas, una elegante mesa, pero con rejas y guardias armados.\nMika parloteaba alegremente, y Nagisa bebía su té en silencio.\n\n\"Y entonces, ese perrito, ¿sabes?—\"\n\"Señora Mika, ha llegado un telegrama.\"\n\nMika leyó el mensaje sonriendo.\n\n\n\n\"Ah, ya veo. ¿La capturaron? ¿Eso querían que dijera?\"\n\nA pesar de su sonrisa, lanzó palabras venenosas a su secretaria.\n\n\"¿Quemaron todo un pueblo para capturarla? ¿Y se entregó por sí misma? ¿Esperaban que me alegrara?\"\n\nNagisa cerró los ojos.\nAquella no era la Mika que conocía.\nSuspiró suavemente, sintiendo el té más amargo que nunca."
 TRN_opposition.344.a: "Ellos heredarán la tierra."
 
 ##나기사
 TRM_event.363.t: "Regresando a casa"
 TRM_event.363.desc: "Tras cerrar la última caja de la mudanza, Johan se estiró para aliviar su espalda rígida y tomó aire. Pero apenas podía descansar antes de que las mujeres afuera le metieran prisa, así que siguió embalando. Cuando terminó, cargó todo en su coche, entregó las llaves de la casa a un miembro del Departamento de Justicia y se puso en camino. Desde la ventanilla del coche echó una última mirada a las queridas calles de Breslavia, arrancó el motor y partió.\n\nLa orden de expulsión de extranjeros no autorizados, emitida recientemente por la \"Dama de Hierro\", entró en vigor en todo Trinity ese mismo día. En Mecklenburg, Sajonia, Silesia y el Corredor Polaco, muchos se vieron obligados a abandonar sus hogares y marchar a tierras frías y solitarias. La poca resistencia fue aplastada por el Departamento de Justicia, y los desposeídos partieron entre lágrimas.\n\nEn una de las viejas calles que lo habían visto crecer, pasando frente a la panadería donde solía comprar pretzels —ahora con un gran letrero de DESALOJO—, Johan dejó atrás el letrero de Breslavia y puso rumbo a Cracovia, derramando lágrimas incontenibles. Tal vez porque allí había dejado todo lo que era.\n\nMientras secaba sus lágrimas con un pañuelo, se dirigía hacia su padre, a quien nunca había querido volver a ver.\n\nDe niño, Johan sufrió bajo las manos borrachas de su padre. Cuando no pudo más, huyó de Cracovia a Breslavia solo, trabajando como limpiador y obrero hasta volverse independiente. Y ahora, tras tantos años, volvía a Cracovia.\n\nSu larga huida había terminado al fin."
 TRM_event.363.a: "Y Johan secó de nuevo sus lágrimas."
 TRM_event.364.t: "Discurso público"
 TRM_event.364.desc: "En elaboración"
 TRM_event.364.a: "Y Nagisa descendió lentamente del estrado."
 TRM_event.365.t: "Un invitado en Krupp"
 TRM_event.365.desc: "En la sede temporal de Krupp en Szczecin, Gustav Krupp miraba por la ventana, sumido en una profunda preocupación.\n\nTras la gran guerra, Alemania estaba dividida en dos y la compañía Krupp apenas sobrevivía. Nervioso y temeroso por el futuro de sus trabajadores, que apenas podían dormir, Gustav pensaba sin cesar en qué hacer: ¿qué pasaría con las instalaciones en Gehenna? ¿Debía retirarse de la industria pesada? ¿Cómo competir con Eden Group?\n\nMientras su mente giraba en estas cuestiones, su secretaria irrumpió con un mensaje: \"Señor, una visitante de Eden\".\n\nDesconcertado, Gustav la recibió en su despacho: era Kirifuji Nagisa.\n\nSorprendido pero cortés, la invitó a sentarse.\n\n\"¿Todo en orden en Krupp?\", preguntó Nagisa.\n\nGustav, sincero, respondió: \"Si dijera que sí, mentiría. No, las cosas no van bien\".\n\nNagisa, bebiendo té, le hizo una propuesta: \"¿Qué le parece trabajar bajo Trinity?\".\n\nEl corazón de Gustav latió con fuerza: ¿era esto una cuerda de salvación o una trampa?\n\nNagisa rompió el silencio: \"Esperamos su respuesta positiva en Eden. Que tenga un buen día\". Se levantó y se fue."
 TRM_event.365.a: "Y al cerrarse la puerta, la pipa seguía humeando."
 TRM_event.366.t: "Fe abandonada"
 TRM_event.366.desc: "La historia del odio es tan antigua como la sociedad misma. Sea por miedo, celos o daño no intencionado, deja víctimas, cicatrices y, paradójicamente, avances.\n\nQue Trinity y Gehenna se odien incluso tras la gran guerra no sorprende: el odio hacia el diferente es su mayor similitud.\n\nUna joven de Sisterhood lloraba, ensangrentada y rota. Cuando Trinity declaró a Gehenna como \"incapaces de dialogar\", ella no pudo aceptarlo: el Señor ama a todos, incluso a Gehenna. Pero su voz era ignorada entre el clamor del odio y la violencia.\n\nMientras los combates arreciaban, la joven, sola y encogida, culpó a sí misma y al Señor por permitirlo todo, llorando en silencio."
 TRM_event.366.a: "Horno ardiente, cielo lloroso"
 TRM_event.367.t: "Todo llega a su fin"
 TRM_event.367.desc: "Toshiro Ai, del Departamento de Justicia, estaba confundida: \"Nunca habrá hostilidades entre Trinity y Gehenna\". Para una fiel de Mika, eso era incomprensible.\n\nEnfadada, chocó adrede con una miembro del Disciplinary Committee. Pero cuando vio el pastel caído en el suelo, idéntico al de su pastelería favorita, algo en su corazón cambió. En vez de golpearla, la ayudó a levantarse: \"Lo siento… iré a comprar otro\".\n\nEn la pastelería, la chica de Gehenna sonrió: \"Te llamas…?\". Ai suspiró y tomó su teléfono para intercambiar números."
 TRM_event.367.a: "\"…Toshiro Ai.\""
 TRM_event.368.t: "Club de Postres y Club Gourmet"
 TRM_event.368.desc: "Como parte de la reconciliación entre Trinity y Gehenna, los clubes de ambas escuelas tuvieron encuentros. En un café de Erfurt, el Club de Postres esperaba al Club Gourmet.\n\nUn camión de salchichas explotó afuera, y los miembros del Club Gourmet entraron como si nada. El barista, aterrorizado, se escondió. La reunión comenzó con cortesías hasta que aparecieron los pasteles de queso y crema: \"¡Delicioso!\".\n\nPero Haruna del Club Gourmet exclamó: \"¡Esto es una herejía contra la gastronomía!\", y detonó otra bomba, destruyendo el café antes de marcharse."
 TRM_event.368.a: "Bueno, al menos estaba rico."
 TRM_event.369.t: "Propuesta de Trinity"
 TRM_event.369.desc: "Una carta desde Eden ofrecía resolver todos los problemas de Abydos a cambio de su anexión a Trinity. Una oferta tentadora, pero claramente una trampa para absorberlos."
 TRM_event.369.a: "Rechazar."
 TRM_event.369.b: "No tenemos otra opción…"
 TRM_event.370.t: "Abydos acepta"
 TRM_event.370.desc: "Abydos aceptó nuestra propuesta y ahora somos uno solo."
 TRM_event.370.a: "¡Bien!"
 TRM_event.371.t: "Abydos resiste"
 TRM_event.371.desc: "Abydos rechazó nuestra oferta, declarando que no caerían en una \"descarada trampa de anexión\", y se preparan para la guerra."
 TRM_event.371.a: "Si no es con palabras, será con armas."

 ## 나기사 - 대타협 
 TRM_event.358.t: "Prólogo"
 TRM_event.358.desc: "En un día de sol cálido y brisa fresca, las Tea Party de Trinity y las Hyakkiyako de Gehenna se reunieron en la Gran Catedral para poner fin a su antigua enemistad.\n\nLa Gran Catedral, sede del histórico Concilio de la Unificación, era el escenario perfecto para el histórico \"Acuerdo de Edén\".\n\nKirifuji Nagisa, de la Tea Party, y Hanuma Makoto, de Hyakkiyako, se sonrieron mutuamente de forma inusual, se estrecharon la mano y tomaron asiento mientras las cámaras de Chronos School captaban la escena ante la atenta mirada de los estudiantes de Kivotos.\n\n\"Espero que su viaje haya sido tranquilo\", dijo Nagisa.\n\n\"¡Ajá! Lo habían preparado todo como corresponde para alguien tan capaz como yo\", respondió Makoto. \"Hehe, basta de charla. Vamos al grano.\"\n\nEn ese ambiente cordial, los asistentes colocaron sobre las mesas unos documentos elegantemente encuadernados titulados:\n\n\"Gran Compromiso entre la Academia Trinity y la Academia Gehenna para el Acuerdo de Edén\"\n\nUn momento histórico que sería recordado por generaciones estaba a punto de comenzar."
 TRM_event.358.a: "\"Veamos el primer capítulo.\""
 TRM_event.359.t: "Primer capítulo"
 TRM_event.359.desc: "El sonido de las páginas pasando resonó mientras un asistente de la Tea Party leía:\n\n\"El primer acuerdo es el Tratado de Amistad Eterna. En resumen, cesarán todos los actos hostiles entre ambas partes.\"\n\nMakoto frunció el ceño.\n\n\"¿Hmm? ¿No acordamos ya esto cuando preparamos el compromiso? ¿Acaso no confían en la Pandemonium Society?\"\n\nNagisa, ocultando su sorpresa ante la fría respuesta de Makoto, sonrió diplomáticamente:\n\n\"No es eso, solo queremos disipar toda desconfianza.\"\n\nMakoto se echó a reír:\n\n\"Je, qué interesante. Ya intentan medirse fuerzas con nosotros desde el principio.\"\n\nEl ambiente cordial se volvió gélido, y solo se oía el rasgar de las plumas firmando el acuerdo."
 TRM_event.359.a: "Primer acuerdo — Aprobado."
 TRM_event.360.t: "Segundo capítulo"
 TRM_event.360.desc: "Esta vez fue un asistente de Hyakkiyako quien rompió el silencio:\n\n\"El segundo acuerdo trata de la consolidación de los clubes. La fusión de nuestras academias duplicará el número de clubes, algo insostenible para la nueva administración estudiantil.\"\n\nPero ambas partes vacilaron en firmar sin más.\n\n\"Nos oponemos a disolver el Club de Desarrollo de Onsen. Es un club orgulloso de Gehenna.\"\n\n\"¿De verdad? Ese club ha causado estragos por toda Kivotos… debería cerrarse.\"\n\nMakoto replicó con risas burlonas:\n\n\"Entonces también deberían cerrar su Club de Clases de Recuperación, con sus fracasos y desórdenes. ¡Ja!\"\n\nTras un respiro, Nagisa asintió:\n\n\"Al menos estamos de acuerdo en consolidar los clubes similares.\"\n\nMakoto, satisfecho, firmó con una sonrisa."
 TRM_event.360.a: "Segundo acuerdo — Aprobado."
 TRM_event.361.t: "Tercer capítulo"
 TRM_event.361.desc: "El tercer capítulo abordaba la composición del consejo estudiantil unificado: ¿incluir a todos los miembros de ambos bandos o solo a algunos seleccionados?\n\nMakoto, confiada:\n\n\"Con solo yo bastará para que todo funcione. ¿No es así, Iroha?\"\n\nIroha suspiró:\n\n\"Si dice eso en serio, tendrá que encargarse de todo mi trabajo.\"\n\nNagisa intervino:\n\n\"Creo que todos deberían participar. Más manos hacen menos carga.\"\n\nAnte estas palabras, Iroha quedó sorprendida, Makoto suspiró pero firmó rápidamente esta vez.\n\nEl nuevo consejo incluiría a todos los miembros de ambas partes."
 TRM_event.361.a: "Tercer acuerdo — Aprobado."
 TRM_event.362.t: "Capítulo final"
 TRM_event.362.desc: "Por fin llegó el momento final. Al desplegar el último documento, solo había una palabra en grande:\n\n\"Estados Unidos de Edén\"\n\nAmbos bandos dudaron. Era el momento de decidir el marco definitivo: los Estados Unidos de Edén garantizarían igualdad y veto mutuo bajo una misma bandera, pero con tensiones aún no resueltas, implementarlo de inmediato no era fácil.\n\nTras largas horas de debate, no lograron tomar una decisión."
 TRM_event.362.a: "Capítulo final — En suspenso."

 TRM_event.372.t: "Seiya Yurizono despierta en su cama"
 TRM_event.372.desc: "Tras su hospitalización al inicio del caos en Trinity, Seiya Yurizono ha despertado y pide ver urgentemente a Nagisa. Como líder de la facción Sanctus, comienza a reagrupar a sus miembros dispersos." 
 TRM_event.372.a: "…"

 TRM_event.373.t: "Tea Party politizada"
 TRM_event.373.desc: "Las medidas de emergencia tras sofocar el golpe de la facción Pater no fueron revocadas, alterando la estructura de poder: con Sanctus desmantelada y Pater eliminada, solo la facción Filius de Nagisa sigue en pie."
 TRM_event.373.a: "…Esto no era lo que quería."

 TRM_event.374.t: "Algunas enmiendas"
 TRM_event.374.desc: "Con Filius al mando, es necesario mantener el control para evitar otro golpe. Nagisa seguirá como única líder, aunque no lo desee, sabe que no puede permitir más caos."
 TRM_event.374.a: "…Será solo por un tiempo."

 TRM_event.375.t: "Creación del Club de Clases de Recuperación"
 TRM_event.375.desc: "Nagisa decidió no tolerar más las imprudencias de Mika. Cuando la persona indicada llegó, dijo:\n\n\"Hifumi, tienes una misión importante. Únete al recién creado Club de Clases de Recuperación y encárgate de vigilar las amenazas a Trinity.\"\n\nAsí nació, por orden directa de Nagisa, el Club de Clases de Recuperación para reeducar a los problemáticos."
 TRM_event.375.a: "No puedo quedarme de brazos cruzados."

 TRM_event.376.t: "Un día en la vida de Mika"
 TRM_event.376.desc: "\"¿Hmm? ¿Dónde está mi anterior asistente?\", preguntó Mika con curiosidad. El nuevo ayudante respondió:\n\n\"Renunció hace unos días. Demasiado estrés, supongo.\"\n\nMika murmuró: \"Qué raro. Parecía disfrutarlo… incluso se mostraba entusiasta en la última reunión.\"\n\nEl ayudante sonrió sin emoción: \"Cosas raras pasan.\"\n\nMika lo observó un momento, pero no dijo nada más, aunque la frialdad en su mirada permanecía."
 TRM_event.376.a: "Quédate tranquila en tu jaula, Mika."

 TRM_event.401.t: "[FROM.GetName] exige rendición"
 TRM_event.401.desc: "[FROM.GetName] exige nuestra cooperación en la guerra contra Gehenna, prometiendo liberar al pueblo alemán bajo Trinity. Rechazar será considerado traición nacional y motivo de invasión."
 TRM_event.401.a: "Un \"Alemania alada\"… qué broma."
 TRM_event.401.b: "No tenemos más remedio."

 TRM_event.402.t: "[FROM.GetName] rechaza"
 TRM_event.402.desc: "Rechazaron nuestra petición de cooperación, llamándonos una falsa Alemania y declarando que preferirían morir luchando."
 TRM_event.402.a: "Solo hay muerte para los traidores."

 TRM_event.403.t: "El ejército se une"
 TRM_event.403.desc: "[FROM.GetName] decidió cooperar con nuestra guerra y unirse a nuestras fuerzas."
 TRM_event.403.a: "Bienvenidos, leales alemanes."

 TRM_event.404.t: "Pérdida de confianza en el gobierno"
 TRM_event.404.desc: "Las políticas de seguridad fueron canceladas por la guerra y la gente empieza a desconfiar de nuestro liderazgo."
 TRM_event.404.a: "Vaya…"

 TRM_event.405.t: "Entrenamiento en el Weser"
 TRM_event.405.desc: "Nuestro ejército ya planeaba operaciones en Escandinavia. La más reciente es el 'Entrenamiento en el Weser'."
 TRM_event.405.a: "¡Lanzad la ofensiva!"


# 세 자리 수로 구성된 파벌 이벤트
# 1(충성도 분류 1-4) 1(지지도 분류 1-3) 1(순서)

 TRN_faction_event.111.t: "Protesta de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.111.desc: "La facción [TRN_faction_event_2_name_text] ha salido a las calles para criticar nuestras acciones. Han ocupado las avenidas principales y están provocando disturbios, declarando que no se detendrán hasta que atendamos sus demandas."
 TRN_faction_event.111.a: "Vaya…"

 TRN_faction_event.112.t: "Protesta antibélica de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.112.desc: "La facción [TRN_faction_event_2_name_text] ha iniciado una protesta en contra de nuestra guerra, afirmando que nuestras acciones están arruinando la vida del pueblo. Han ocupado las avenidas principales y están provocando disturbios."
 TRN_faction_event.112.a: "Esto no pinta bien…"

 TRN_faction_event.121.t: "Ocupación de un gobierno estatal por la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.121.desc: "La facción [TRN_faction_event_2_name_text] ha ocupado por la fuerza el gobierno estatal de [TRN_faction_event_121_target.GetName] y proclamado una revolución, con la intención de derrocarnos y establecer un nuevo régimen.\n\nPor suerte, la conmoción popular no es muy grande, y podemos sofocar la revuelta de inmediato si lo deseamos… aunque ello podría aumentar significativamente su apoyo popular."
 TRN_faction_event.121.a: "Intentemos una aproximación conciliadora."
 TRN_faction_event.121.b: "¡Aplástenlos ahora mismo!"

 TRN_faction_event.122.t: "Protesta contra la movilización económica de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.122.desc: "La facción [TRN_faction_event_2_name_text] critica la magnitud de nuestra movilización económica y ha llenado las avenidas con panfletos exigiendo su fin inmediato.\n\nSus demandas están ganando apoyo popular, y si las ignoramos su influencia podría aumentar significativamente."
 TRN_faction_event.122.a: "…"

 TRN_faction_event.123.t: "Protesta contra el reclutamiento forzoso de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.123.desc: "La facción [TRN_faction_event_2_name_text] denuncia que nuestras políticas de reclutamiento son excesivas y exige que se ponga fin al reclutamiento forzoso y se devuelva a los soldados a sus hogares.\n\nSus demandas están ganando apoyo popular, y si las ignoramos su influencia podría aumentar significativamente."
 TRN_faction_event.123.a: "…"

 TRN_faction_event.131.t: "Huelga organizada por la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.131.desc: "La facción [TRN_faction_event_2_name_text] ha utilizado los sindicatos bajo su control para iniciar una gran huelga.\n\nHan declarado que la huelga continuará indefinidamente hasta que atendamos sus demandas, lo cual podría causar graves daños a nuestra industria."
 TRN_faction_event.131.a: "Comencemos negociaciones."

 TRN_faction_event.132.t: "Destitución de un ministro por la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.132.desc: "La facción [TRN_faction_event_2_name_text] ha utilizado su influencia en el gobierno para destituir a uno de nuestros principales funcionarios.\n\nNos han advertido severamente que si seguimos marginándolos del gobierno, habrá consecuencias aún peores."
 TRN_faction_event.132.a: "Vaya…"

 TRN_faction_event_132_tt: "§YConsejero§! de §Y[THIS.GetName]§! destituido"
 TRM_forced_dismissal_flag: "§YDestituido recientemente§!"

 ##############

 TRN_faction_event.211.t: "Reunión de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.211.desc: "Una de nuestras facciones opositoras, [TRN_faction_event_2_name_text], ha celebrado una pequeña reunión.\n\nEn dicha reunión se comenzó criticando las políticas de [ROOT.GetLeader], y el objetivo principal fue definir la dirección de la facción y planear la captación de simpatizantes."
 TRN_faction_event.211.a: "No es un gran problema."

 TRN_faction_event.212.t: "[TRN_faction_event_2_name_text] solicita incorporarse al gobierno"
 TRN_faction_event.212.desc: "[TRN_faction_event_2_name_text] ha manifestado su intención de integrarse en nuestra administración. Aunque en el pasado sus relaciones con nosotros no fueron buenas, parece que quieren mejorar las relaciones y aumentar su influencia a través de esta oportunidad."
 TRN_faction_event.212.a: "Es algo positivo."
 TRN_faction_event.212.b: "No confío en sus intenciones."

 TRN_faction_event.221.t: "[TRN_faction_event_2_name_text] exige el desarrollo del estado [TRN_development_of_specific_state_event_target.GetName]"
 TRN_faction_event.221.desc: "[TRN_faction_event_2_name_text] argumenta que el estado [TRN_development_of_specific_state_event_target.GetName] está en desventaja económica, y ha presentado una petición para atraer industria a esa región."
 TRN_faction_event.221.a: "Está bien, lo tendremos en cuenta."

 TRN_faction_event.222.t: "Lobby del gobierno por parte de [TRN_faction_event_2_name_text]"
 TRN_faction_event.222.desc: "Nos han llegado informes de que la facción [TRN_faction_event_2_name_text] ha utilizado su influencia política para asegurar apoyo dentro de nuestro gobierno.\n\nA raíz de estas maniobras, algunos de nuestros funcionarios parecen haberse puesto de su lado, y su influencia continúa creciendo sin que podamos impedirlo."
 TRN_faction_event.222.a: "…"

 TRN_faction_event.223.t: "[TRN_faction_event_2_name_text] nos critica públicamente"
 TRN_faction_event.223.desc: "En un reciente escándalo de corrupción que involucró a varios miembros de nuestra administración, la facción [TRN_faction_event_2_name_text] nos acusó duramente de ser los principales responsables.\n\nEsta crítica pública les ha hecho ganar apoyo entre los estudiantes y ha debilitado nuestra influencia."
 TRN_faction_event.223.a: "Vaya…"

 TRN_faction_event.231.t: "[TRN_faction_event_2_name_text] lidera la planificación económica"
 TRN_faction_event.231.desc: "La facción [TRN_faction_event_2_name_text] ha aprovechado su influencia en el gobierno para desempeñar un papel importante en la elaboración de la política económica actual, obligándonos a seguir su plan de construcción."
 TRN_faction_event.231.a: "Demasiada intromisión…"

 TRN_faction_event.232.t: "[TRN_faction_event_2_name_text] ataca a [TRN_faction_event_3_name_text]"
 TRN_faction_event.232.desc: "La facción [TRN_faction_event_2_name_text] ha iniciado una ofensiva política contra uno de nuestros principales aliados, la facción [TRN_faction_event_3_name_text]. Aunque esta última nos ha pedido ayuda, su imagen ya ha quedado gravemente dañada."
 TRN_faction_event.232.a: "No hay nada que hacer."
 TRN_faction_event.232.b: "Emitid un comunicado de apoyo."

 TRM_government_plan_good: "Incluido en el plan industrial"
 TRM_government_plan_bad: "No incluido en el plan industrial"


 ##################

 TRN_faction_event.311.t: "[TRN_faction_event_2_name_text] expresa preocupación por la movilización económica"
 TRN_faction_event.311.desc: "La facción [TRN_faction_event_2_name_text] ha expresado profunda preocupación por los posibles problemas económicos derivados de nuestra política de movilización económica.\n\nAunque esta facción ha mantenido relaciones amistosas con [ROOT.GetLeader], parece que la movilización ha dañado esas relaciones."
 TRN_faction_event.311.a: "Vaya…"
 
 TRN_faction_event.312.t: "[TRN_faction_event_2_name_text] expresa preocupación por el reclutamiento masivo"
 TRN_faction_event.312.desc: "La facción [TRN_faction_event_2_name_text] ha debatido extensamente sobre nuestra política de reclutamiento.\n\nAunque esta facción ha mantenido relaciones amistosas con [ROOT.GetLeader], parece que el reclutamiento ha dañado esas relaciones."
 TRN_faction_event.312.a: "No se puede evitar."

 TRN_faction_event.313.t: "Reunión de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.313.desc: "La facción [TRN_faction_event_2_name_text] ha celebrado una reunión para ampliar su influencia aprovechando su cooperación política con nosotros.\n\nEsta facción ha decidido utilizar su relación con [ROOT.GetLeader] para reforzar su influencia política, y pocos días después han comenzado a colocar carteles de propaganda."
 TRN_faction_event.313.a: "No está mal."

 TRN_faction_event.321.t: "Popularización de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.321.desc: "La facción [TRN_faction_event_2_name_text] parece haberse consolidado como la voz moderada dentro de Trinity.\n\nSu rechazo a actividades extremistas o antigubernamentales les ha ganado simpatía entre el público.\n\nSin embargo, su crecimiento los ha convertido en uno de nuestros principales opositores, lo cual no es precisamente positivo para nosotros."
 TRN_faction_event.321.a: "Hmm…"

 TRN_faction_event.322.t: "Radicalización de la facción [TRN_faction_event_2_name_text]"
 TRN_faction_event.322.desc: "La facción [TRN_faction_event_2_name_text] parece haberse reunido en torno a un nuevo líder político y se ha radicalizado en respuesta a la tensa situación interna.\n\nAntes fueron aliados nuestros, pero ahora su rumbo es incierto."
 TRN_faction_event.322.a: "Habrá que seguir observando."

 TRN_faction_event.323.t: "[TRN_faction_event_2_name_text] se opone a la guerra"
 TRN_faction_event.323.desc: "La facción [TRN_faction_event_2_name_text] ha expresado cautelosamente su oposición a nuestra guerra.\n\nHan destacado los mercados desestabilizados y la escasez agrícola como motivos para solicitar el fin de la guerra cuanto antes."
 TRN_faction_event.323.a: "…"

 TRN_faction_event.331.t: "[TRN_faction_event_2_name_text] envuelta en escándalo político"
 TRN_faction_event.331.desc: "La facción [TRN_faction_event_2_name_text] ha sido señalada como protagonista de un reciente escándalo político, lo que ha reducido drásticamente su apoyo público.\n\nAunque compartimos cierta afinidad ideológica con ellos y sufrimos algún daño colateral, nuestras pérdidas fueron mínimas en comparación."
 TRN_faction_event.331.a: "Romped lazos rápidamente."

 TRN_faction_event.411.t: "[TRN_faction_event_2_name_text] apoya la guerra"
 TRN_faction_event.411.desc: "La facción [TRN_faction_event_2_name_text] ha apoyado nuestras operaciones militares y se ha sumado a nuestra propaganda, atacando a los pacifistas."
 TRN_faction_event.411.a: "Nuestra guerra es por la supervivencia nacional."

 TRN_faction_event.412.t: "[TRN_faction_event_2_name_text] espera una recompensa por su lealtad"
 TRN_faction_event.412.desc: "La facción [TRN_faction_event_2_name_text] espera recibir un papel importante en las nuevas políticas en reconocimiento a su prolongado apoyo al gobierno.\n\nSi ignoramos sus demandas, su lealtad se verá gravemente dañada."
 TRN_faction_event.412.a: "Debemos recompensarlos en algo."
 TRN_faction_event.412.b: "No hay sitio para ellos aquí."

 TRN_faction_event.421.t: "[TRN_faction_event_2_name_text] organiza un disturbio masivo"
 TRN_faction_event.421.desc: "Un excesivo celo por parte de la facción [TRN_faction_event_2_name_text] ha derivado en un gran disturbio contra nuestros opositores políticos.\n\nLas agresiones indiscriminadas han dañado gravemente la imagen tanto de ellos como del gobierno."
 TRN_faction_event.421.a: "Maldita sea…"

 TRN_faction_event.422.t: "[TRN_faction_event_2_name_text] nos respalda"
 TRN_faction_event.422.desc: "La facción [TRN_faction_event_2_name_text], como nuestro principal aliado, ha llevado a cabo una efectiva campaña de propaganda a nuestro favor.\n\nGracias a esto, hemos asegurado recursos políticos adicionales y reforzado las bases para nuevas políticas."
 TRN_faction_event.422.a: "Bien."

 TRN_faction_event.431.t: "[TRN_faction_event_2_name_text] se alista voluntariamente"
 TRN_faction_event.431.desc: "Los miembros de la facción [TRN_faction_event_2_name_text] se han unido voluntariamente a nuestras fuerzas armadas, movidos por el patriotismo."
 TRN_faction_event.431.a: "Excelente."

 TRN_faction_event.432.t: "[TRN_faction_event_2_name_text] invierte en nosotros"
 TRN_faction_event.432.desc: "La facción [TRN_faction_event_2_name_text] ha realizado una importante inversión en nuestros proyectos económicos.\n\nCon este gesto, han reafirmado su apoyo al gobierno y nos han dado el impulso necesario para la construcción industrial."
 TRN_faction_event.432.a: "Valió la pena apoyarlos."

