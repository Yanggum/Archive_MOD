#새로운 트리니티 붕괴 체인
 TRN_collapse_event.1.t: "Consolidación de la resistencia anti-Trinity"
 TRN_collapse_event.1.desc: "Nuestra operación para erradicar a la resistencia terminó en un fracaso desastroso, y como resultado la opinión pública se ha volcado completamente a favor de las fuerzas rebeldes. Este punto de inflexión les ha brindado una gran oportunidad, y ahora se están moviendo con mayor audacia bajo el lema de 'la destrucción de Trinity'.\n\nLa resistencia ya no es solo una fuerza armada, sino un movimiento que cuenta con el apoyo masivo tanto en las ciudades como en el campo. Armados no solo con poder militar sino con el respaldo del pueblo, están arrebatándonos los territorios uno por uno.\n\nAhora no solo luchamos contra un ejército rebelde, sino contra una población entera que se ha unido a ellos. Si no logramos recuperar la confianza de la gente, esta guerra será aún más larga, y no podemos permitir que nos arrebaten ciudades y pueblos. Esta no es simplemente una batalla, sino una lucha desesperada por la supervivencia de nuestra academia."
 TRN_collapse_event.1.a: "Debemos responder de inmediato."
 
 TRN_collapse_event.2.t: "Levantamiento rebelde"
 TRN_collapse_event.2.desc: "Mientras la resistencia establecía su estructura de mando, no logramos tomar medidas eficaces para detenerlos. En medio de nuestra confusión y complacencia, ellos completaron su preparación y ahora han formado su propio sistema independiente listo para enfrentar nuestro dominio.\n\nHan proclamado oficialmente la guerra contra nosotros, ya no son una simple fuerza clandestina, sino un cuerpo unificado que avanza con el apoyo popular.\n\nNo podemos retroceder. Si no detenemos su avance, nuestro sistema y nuestra academia colapsarán. Debemos detenerlos a toda costa para preservar nuestra existencia. ¡Por Trinity!"
 TRN_collapse_event.2.a: "¡Reprímanlos como sea necesario!"
 TRN_collapse_event.2.b: "¡Derribar a Trinity!"

 TRN_collapse_event.3.t: "Las secuelas"
 TRN_collapse_event.3.desc: "La resistencia —o más bien, los rebeldes— siguen creciendo día a día. Su influencia ha superado las simples acciones armadas; ahora tienen una estructura clara, emiten manifiestos y movilizan a las masas. Su ejemplo ha inspirado a otros movimientos rebeldes a imitarlos.\n\nDesde todos los rincones se escuchan proclamas contra Trinity, y nuevos grupos insurgentes surgen como hongos, preparando guerras sistemáticas.\n\nHoy, uno de estos grupos nos ha declarado la guerra oficialmente. Ahora debemos luchar en varios frentes, y esta lucha exigirá todos nuestros recursos. La supervivencia de nuestra academia está en juego. No hay marcha atrás."
 TRN_collapse_event.3.baddesc: "Hoy, otro grupo rebelde nos ha declarado la guerra. Nos vemos obligados a luchar en múltiples frentes, y esta lucha demandará todos nuestros recursos. La guerra total por la supervivencia de la academia ha comenzado."
 TRN_collapse_event.3.a: "¡Hay que detenerlos ahora!"

 TRN_collapse_event.4.t: "Colapso de [FROM.GetName]"
 TRN_collapse_event.4.desc: "El deterioro de la situación política interna de [FROM.GetName] durante la guerra les ha brindado a los rebeldes anti-Trinity la oportunidad de reorganizarse. Han declarado una guerra revolucionaria contra Trinity y ya están luchando activamente.\n\nDebemos decidir si los reconocemos o continuamos la guerra contra ellos."
 TRN_collapse_event.4.a: "Ellos no tienen la culpa."
 TRN_collapse_event.4.b: "Esto complicará la diplomacia."

 TRN_collapse_event.5.t: "Reunificación con Polonia"
 TRN_collapse_event.5.desc: "Tras una feroz resistencia, el ejército occidental polaco logró expulsar a los invasores de Trinity y recuperar el territorio. Ahora podemos regresar a nuestra patria y forjar un nuevo futuro. Por supuesto, también podríamos reclamar este territorio como propio y convertirnos en los gobernantes del oeste."
 TRN_collapse_event.5.a: "Marchamos hacia el oeste."
 TRN_collapse_event.5.b: "¡Viva Polonia!"

 TRN_collapse_event.6.t: "Resistencia anti-Trinity"
 TRN_collapse_event.6.desc: "Aprovechando el reciente caos político, los grupos de resistencia que operaban en las sombras finalmente han emergido a la superficie. Bajo el lema de 'anti-Trinity', se están organizando y, aunque su fuerza aún es limitada, su influencia crece rápidamente.\n\nSi no los eliminamos ahora, pronto podrían convertirse en una amenaza mucho mayor."
 TRN_collapse_event.6.a: "Suprímanlos de inmediato."

 TRN_collapse_event.7.t: "Su último aliento"
 TRN_collapse_event.7.desc: "Gracias a nuestra rápida represión, los rebeldes han precipitado una declaración de guerra sin estar completamente preparados. Esta es nuestra oportunidad de acabar con ellos y restaurar el orden."
 TRN_collapse_event.7.a: "¿Eso es todo?"

 TRN_collapse_event.8.t: "El caos sofocado"
 TRN_collapse_event.8.desc: "La resistencia ha vuelto a las sombras gracias a nuestras operaciones de represión, y todos sus colaboradores han sido arrestados. Les tomará mucho tiempo volver a aparecer."
 TRN_collapse_event.8.a: "Bien."

