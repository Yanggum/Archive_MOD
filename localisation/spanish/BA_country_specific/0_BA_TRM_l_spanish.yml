 TRN_research_rifle: "Análisis de la doctrina del ejército alemán"
 TRN_research_rifle_desc: "El estilo de combate del ejército alemán resultó extraño y, al mismo tiempo, profundamente impactante para Trinity. Las tácticas de ruptura relámpago basadas en la movilidad causaron un fuerte impacto en el alto mando de Trinity y, a la vez, le otorgaron una profunda inspiración. Pronto, estas ideas serán reinterpretadas a nuestra manera y renacerán como una doctrina propia y única de Trinity."
 TRM_Centralised_Command: "Estado Mayor centralizado"
 TRM_Centralised_Command_desc: "Un estado mayor centralizado es indispensable para la conducción de la guerra. Cualquier otro método que pueda conducir a una catástrofe debe ser evitado a toda costa. Para que el ejército tenga éxito, los generales deben convertirse en una maquinaria bien sincronizada, capaz de conducir a la victoria con confianza y rapidez. Por lo tanto, debemos aspirar a crear un sistema de mando militar unificado."
 TRM_encourage_radio_use: "Fomentar el uso de comunicaciones"
 TRM_encourage_radio_use_desc: "En las guerras del pasado, la radio fue introducida como una tecnología revolucionaria, lo que amplió enormemente el alcance de las comunicaciones militares y mejoró de forma significativa las capacidades de mando y control en el campo de batalla. En Trinity, el uso de la radio aún se encuentra en una fase inicial, pero con un poco de esfuerzo podremos aplicar rápidamente esta nueva tecnología a nuestras fuerzas y lanzar ataques organizados y concentrados contra los puntos vulnerables del enemigo."
 TRM_Streamline_Intelligence_Gathering: "Optimizar la recopilación de inteligencia"
 TRM_Streamline_Intelligence_Gathering_desc: "Combatir contra un enemigo que no comprendemos es difícil. La centralización del ejército proporcionó al estado mayor un conocimiento profundo de nuestras propias fuerzas, pero comprender al enemigo que se encuentra al otro lado es igual de importante. Todos los medios para recopilar esta información deben integrarse en la estructura militar."
 TRM_Empower_the_Generals: "Otorgar autoridad a los generales"
 TRM_Empower_the_Generals_desc: "A lo largo de siglos de guerras civiles, los generales de Trinity han acumulado una vasta experiencia que les permite responder con flexibilidad a cualquier situación. Lo único que necesitan es la autoridad necesaria para dirigir correctamente al ejército y que quienes están bajo su mando sepan prestar atención."
 TRM_Protectors_of_the_Motherland: "Guardianes de la Alma Mater"
 TRM_Protectors_of_the_Motherland_desc: "Otros ejércitos luchan por el oro, el honor o ideologías sin dios, pero el ejército de Trinity lucha por la academia y la cruz. Para muchos extranjeros, Trinity es una academia noble y misteriosa de jóvenes damas, pero para sus estudiantes es un hogar sin secretos. Las estudiantes de Trinity han realizado grandes y hermosas hazañas en esta tierra y seguirán haciéndolo, y cualquier academia que crea poder conquistar esta tierra sufrirá un enorme impacto."
 TRM_Asymmetric_Tactics: "Tácticas de misión"
 TRM_Asymmetric_Tactics_desc: "Desde tiempos antiguos, los sistemas de mando opacos y lentos han provocado dificultades y han acelerado las derrotas tácticas. Durante las guerras civiles de hace siglos, el problema se resolvió dispersando la autoridad de decisión en las unidades subordinadas y fomentando una cultura en la que los oficiales subalternos, en lugar de esperar pasivamente las órdenes de sus superiores, tomaran decisiones tácticas por sí mismos según la situación del campo de batalla."
 TRM_Decentralised_Structure: "Estructura descentralizada"
 TRM_Decentralised_Structure_desc: "El pensamiento militar tradicional tiende a venerar la supremacía del comandante supremo que dirige al ejército como piezas de un tablero de ajedrez. Sin embargo, la realidad de la guerra es sucia y compleja. Una estructura de mando excesivamente centralizada corre el riesgo de volverse rígida e inflexible frente a la velocidad de la guerra moderna. Una estructura más descentralizada puede evitar estas trampas."
 TRM_Trinity_Field_Artillery: "Artillería de campaña de Trinity"
 TRM_Trinity_Field_Artillery_desc: "La artillería de campaña de Trinity goza de una reputación destacada incluso entre otras academias. Gracias a su alta precisión y su abrumador poder destructivo, las zonas bombardeadas quedan literalmente arrasadas. Ahora, mediante la cooperación con la Oficina de Diseño de Eden, debemos mejorar aún más el rendimiento de la artillería de Trinity y asegurar un poder destructivo todavía mayor."
 TRM_Officer_Initiative: "Autonomía de los oficiales"
 TRM_Officer_Initiative_desc: "La guerra moderna es el caos en sí mismo. La perspectiva del alto mando y la situación real del campo de batalla pueden diferir enormemente, y las circunstancias pueden cambiar en cuestión de instantes. Por lo tanto, es necesario otorgar a los oficiales en el frente la autoridad para establecer objetivos y tomar decisiones clave. De este modo, nuestro ejército podrá adaptarse rápidamente incluso bajo presión y responder de forma eficaz. Esto subraya la importancia de un sistema de mando descentralizado y constituye una estrategia efectiva para afrontar la incertidumbre del campo de batalla moderno."
 TRM_unity_of_doctrine: "Unificación de la doctrina"
 TRM_unity_of_doctrine_desc: "El cuerpo de oficiales de Trinity posee una amplia experiencia y una gran capacidad, pero sus enfoques hacia la doctrina militar son extremadamente diversos. La reforma del ejército terrestre se centró principalmente en problemas organizativos, y los generales pudieron conducir la guerra según sus propias preferencias. Sin embargo, los métodos operativos varían enormemente entre los oficiales, lo que inevitablemente se convierte en un obstáculo para lograr un éxito militar coherente."
 TRM_Reorganise_Armament_Production: "Reorganizar la producción de armamento"
 TRM_Reorganise_Armament_Production_desc: "El estado actual de la producción de armas es, en una palabra, un desastre. Las secuelas del Gran Traslado aún persisten. Las cadenas de producción suelen estar fragmentadas, obsoletas o ambas cosas, lo que no constituye una condición adecuada para que un ejército moderno pueda combatir. Solo mediante una reorganización exhaustiva de este sistema podremos asegurar que nuestros soldados dispongan de armas con las que luchar contra los enemigos de Trinity."
 TRM_Expand_the_Logistics_Corps: "Expandir el cuerpo logístico"
 TRM_Expand_the_Logistics_Corps_desc: "Una de las mayores lecciones de la guerra civil de Trinity fue que, para un ejército moderno, la logística es más importante que cualquier otra cosa. Equipamiento militar, recursos especiales como combustible y hasta bienes básicos de subsistencia deben ser suministrados a tiempo; de lo contrario, el ejército no puede existir. Por lo tanto, la expansión del ejército debe ir necesariamente acompañada de la expansión del aparato logístico."
 TRM_Local_Workshops: "Talleres regionales"
 TRM_Local_Workshops_desc: "En la era de la guerra industrial, debemos emplear todos los medios posibles para aumentar la producción militar. A través del sistema de talleres regionales en todo el país, podemos organizar la producción teniendo en cuenta las condiciones locales y expandir la industria incluso hasta los asentamientos más pequeños donde sea posible."
 TRM_Terrestrial_Dreadnoughts: "Expansión del Departamento de Diseño de Tanques de Eden"
 TRM_Terrestrial_Dreadnoughts_desc: "El Departamento de Diseño de Tanques de Eden es una organización que presume de una de las capacidades tecnológicas más destacadas dentro de Trinity y se especializa en la investigación, diseño y producción en masa de tanques de alta calidad. Basándose en una profunda comprensión de la tecnología de blindados y en años de experiencia acumulada, su excelencia es reconocida en todo Kivotos. Si ampliamos aún más estas instalaciones y fortalecemos el apoyo al departamento de diseño, Trinity podrá obtener una clara ventaja estratégica en las futuras guerras de blindados."
 TRM_superb_training: "Entrenamiento supremo"
 TRM_superb_training_desc: "La fuerza de un ejército depende del poder de combate de cada soldado. Por mucho que en la guerra se escuchen rumores sobre nuevas tecnologías y revoluciones, para aprovecharlas inevitablemente se necesitan soldados; un soldado que no ha sido entrenado en el uso de armas no es más que un campesino con un arma. El ejército de Trinity debe convertirse en el mejor del mundo, y por lo tanto nuestros soldados también deben ser entrenados para ser los mejores del mundo."
 TRM_Expand_The_High_Command: "Expansión del Alto Mando"
 TRM_Expand_The_High_Command_desc: "El alto mando del ejército no puede convertirse en un club social de las élites, como ocurrió durante la guerra civil de Trinity. La exclusividad y las facciones que perjudican la eficiencia del ejército no pueden ni serán toleradas. En su lugar, ampliaremos el estado mayor para incluir a todos los comandantes más destacados. Solo los mejores entre los mejores pueden liderar el ejército más fuerte del mundo."
 TRM_Officer_Training_Academies: "Academias militares"
 TRM_Officer_Training_Academies_desc: "Aunque los registros de la guerra civil sirvieron como manuales para formar a innumerables talentos, la estructura obsoleta de las academias militares a menudo no era adecuada para transmitir este conocimiento al ejército. Debemos reformar las academias para que puedan enseñar correctamente las técnicas de la guerra moderna no solo a los generales, sino también a los oficiales subalternos."
 TRM_Combined_Arms: "Armas combinadas"
 TRM_Combined_Arms_desc: "La teoría de las armas combinadas se presenta como la conclusión lógica del desarrollo de la tecnología militar. Al utilizar simultáneamente la combinación de infantería, blindados, fuerza aérea y marina, se concibe una armonía perfecta de armas de combate capaces de crear ataques imposibles de defender. Es una visión fascinante."
 TRM_Mass_Breakthroughs: "Rupturas a gran escala"
 TRM_Mass_Breakthroughs_desc: "Los blindados son el futuro. Gracias al desarrollo tecnológico, incluso las fortificaciones pueden moverse a una velocidad que antes se consideraba imposible, con el apoyo de infantería motorizada acompañada por tanques. Para crear una auténtica fuerza blindada moderna capaz de rodear y destruir divisiones enemigas a una velocidad récord, debemos apoyar el desarrollo de nuevos tanques."
 TRM_Land_Air_Integration: "Integración tierra-aire"
 TRM_Land_Air_Integration_desc: "A pesar de todas las dudas sobre el poder aéreo, este es, en última instancia, una fuerza complementaria. Independientemente de su estructura o propósito, el debate sobre la aviación militar inevitablemente vuelve a la cuestión de cómo apoyar a las fuerzas terrestres. Si somos fieles a esta filosofía, podremos diseñar una fuerza aérea que multiplique la eficiencia del ejército al proporcionar apoyo en el lugar y el momento necesarios."
 
 TRN_Luftwaffe: "Reorganización de la Fuerza Aérea de Trinity"
 TRN_Luftwaffe_desc: "En aquel incidente, la Fuerza Aérea de Trinity no rindió a la altura de lo esperado, y sus límites quedaron dolorosamente expuestos. Sin embargo, valoramos enormemente el valor y el estilo de combate de la Luftwaffe alemana que enfrentamos en el campo de batalla, e implantaremos su espíritu y sus tácticas en la Fuerza Aérea de Trinity."
 TRN_Standardise_Pilot_Training: "Estandarizar el entrenamiento de pilotos"
 TRN_Standardise_Pilot_Training_desc: "La aviación militar todavía conserva muchas características de una tecnología emergente, y una de ellas es la forma altamente improvisada en la que se comparte el conocimiento. Al no existir un sistema de entrenamiento unificado, se considera que los pilotos veteranos deben enseñar las técnicas a su manera. Como resultado, se ha formado entre nuestros pilotos un sistema de conocimientos sorprendentemente inconsistente. Ha llegado el momento de estandarizar este proceso."
 TRN_Promote_Amateur_Flying: "Fomentar la aviación amateur"
 TRN_Promote_Amateur_Flying_desc: "Los pilotos amateurs se han convertido en un fenómeno en crecimiento: en los últimos años, muchos civiles han empezado a volar como pasatiempo, y algunos incluso han alcanzado logros impresionantes, como cruzar el Atlántico, ganando gran fama. Si cultivamos y orientamos esta imagen popular, podremos ampliar el reservorio de personal con experiencia para nuestra fuerza aérea."
 TRN_Night_Witches: "Brujas de la Noche"
 TRN_Night_Witches_desc: "Una célebre aviadora propuso a la Fuerza Aérea de Trinity una idea impactante: un regimiento aéreo compuesto únicamente por mujeres. Contra todo lo que dictan los prejuicios, hay algunos oficiales que apoyan su plan. Sostienen que posee un enorme valor propagandístico y que puede inspirar a otros pilotos a alcanzar nuevas alturas audaces por Trinity."
 TRN_Aviation_Bureaus: "Oficinas de aviación"
 TRN_Aviation_Bureaus_desc: "La aviación es una tecnología delicada. Un defecto que a simple vista parece pequeño puede provocar un desastre en el aire, y diseñar aeronaves capaces de soportar el entorno brutal del combate exige perfección. Muchas batallas aéreas, en realidad, se deciden antes incluso de que el avión despegue. Al establecer oficinas de aviación en todo el país, podremos diseñar y probar de forma proactiva aeronaves más eficaces."
 TRN_Long_Range_Bombing: "Bombardeo de largo alcance"
 TRN_Long_Range_Bombing_desc: "A medida que se amplían los límites de la tecnología aeronáutica, los teóricos militares han concebido un uso radical de esta: enormes bombarderos de largo alcance, operando sobre las regiones industriales del enemigo y con potencia de fuego suficiente para reducir fábricas a escombros. Esta doctrina de 'destrucción estratégica' promete aniquilar por completo la capacidad bélica del enemigo sin que un solo soldado pise su territorio."
 TRN_Transpolar_Flights: "Vuelos transárticos de Trinity"
 TRN_Transpolar_Flights_desc: "La cercanía al Ártico ofrece a nuestra industria aeronáutica una ventaja inesperada: existen pocos lugares en el mundo mejores que este para poner a prueba aeronaves de forma rigurosa. Al organizar activamente vuelos de prueba de largo alcance a través de las regiones polares, podremos diseñar aviones capaces de volar más lejos, más alto y más rápido que cualquier otro."
 TRN_Expand_The_Aircraft_Industry: "Expandir la industria aeronáutica"
 TRN_Expand_The_Aircraft_Industry_desc: "Contamos con una industria aeronáutica muy moderna, pero en su mayoría sigue siendo de propiedad privada. Para construir una fuerza aérea moderna y poderosa, será necesario nacionalizar esta industria, integrarla en organismos estatales y expandirla considerablemente."
 TRN_Airspace_Defence: "Defensa del espacio aéreo"
 TRN_Airspace_Defence_desc: "Nada es más importante que la defensa del espacio aéreo, porque el enemigo intentará utilizar sus aeronaves por todos los medios posibles para conquistar nuestros cielos y sembrar el terror en las fuerzas terrestres. Ya no basta con defender la tierra. Para vencer, el cielo de la patria debe ser tan inexpugnable como el suelo."
 TRN_Specialise_in_Ground_Support: "Especialización en apoyo terrestre"
 TRN_Specialise_in_Ground_Support_desc: "Las nuevas tecnologías abren posibilidades fascinantes para el desarrollo de nuevos bombarderos. Ahora, las aeronaves pueden funcionar como artillería altamente móvil, golpeando posiciones enemigas con ataques precisos y devastadores, y desplegándose en cualquier punto del frente mucho más rápido que cualquier apoyo tradicional. Esto representa, sin duda, el futuro de la aviación militar."
 TRN_Maintain_Tactical_Flexibility: "Mantener la flexibilidad táctica"
 TRN_Maintain_Tactical_Flexibility_desc: "El desarrollo de la tecnología aeronáutica no solo abre el camino a aeronaves más ágiles, sino también a aeronaves más resistentes. Algunas escuelas teóricas han empezado a defender nuevos bombarderos 'tácticos': aeronaves de apoyo terrestre con mayor radio de acción y supervivencia que los aparatos de apoyo 'cercano'. Este tipo de bombardero puede ejecutar misiones más lejos de sus bases, en condiciones más adversas, e incluso destruir estructuras enemigas."
 TRN_Jet_Engine_Experiments: "Experimentos con motores a reacción"
 TRN_Jet_Engine_Experiments_desc: "Hasta ahora, en la historia de la aviación, los objetos más pesados que el aire solo podían volar mediante hélices. Sin embargo, la tecnología aeronáutica de vanguardia sugiere que podría ser posible una nueva forma de propulsión. En teoría, un motor podría comprimir el aire, mezclarlo con combustible y utilizar esa mezcla para generar empuje, eludiendo los problemas inherentes a la hélice. Suena como una idea claramente demencial, pero las ideas sensatas rara vez producen avances revolucionarios."
 TRN_Death_From_Above: "Muerte desde el cielo"
 TRN_Death_From_Above_desc: "Como bien sabemos, la tercera dimensión de la guerra está lista para revolucionar la tecnología militar. Entre sus enormes aplicaciones tácticas y estratégicas, es seguro que el control del cielo desempeñará un papel decisivo no solo en la próxima gran guerra, sino en todas las guerras venideras. El ejército de Trinity aceptará el futuro: los hijos de la patria ya no se marchitarán miserablemente en tierra, sino que obtendrán gloria entre las nubes."
 TRN_Create_The_Airborne_Force: "Creación de fuerzas aerotransportadas"
 TRN_Create_The_Airborne_Force_desc: "Algunos miembros experimentales de nuestro Alto Mando sugieren que la mecanización del ejército no es más que la primera etapa. ¡La siguiente etapa es trasladar a la infantería no en barcos ni camiones, sino en aviones! Al lanzar tropas paracaidistas tras las líneas enemigas, podremos aislar unidades enemigas y golpear sus puntos de suministro. Estas nuevas fuerzas aerotransportadas serán la punta de lanza de la innovación."
 TRN_We_Need_Helicopter: "Desarrollo de helicópteros"
 TRN_We_Need_Helicopter_desc: "Una aeronave de ala rotatoria que, en particular, obtiene tanto sustentación como empuje mediante el rotor principal. A diferencia de los aviones convencionales, cuyas alas están fijas (ala fija) o solo pueden moverse ligeramente (ala de geometría variable) y que son impulsados por hélices separadas o por la potencia del motor, el helicóptero (también llamado comúnmente 'helis') vuela haciendo girar las propias alas con la potencia del motor. Por ello, esas alas se denominan palas de rotor, o ala rotatoria."
 TRN_Naval_Bomber_Development: "Desarrollo de bombarderos torpederos"
 TRN_Naval_Bomber_Development_desc: ""
 TRN_Carrier_Development: "Desarrollo de portaaviones"
 TRN_Carrier_Development_desc: ""

 TRN_Take_To_The_Seas: "Hacia el mar"
 TRN_Take_To_The_Seas_desc: "Si queremos volver a alzarnos con orgullo entre las grandes academias de Kivotos, debemos construir una nueva y moderna marina capaz de desafiar a las potencias de Europa y del mundo. Ha llegado el momento de que Rusia vuelva a ser, una vez más, una potencia naval."
 TRN_Floating_Fortresses: "Fortalezas flotantes"
 TRN_Floating_Fortresses_desc: "Muchos oficiales de la vieja escuela, basándose en su experiencia en la guerra civil de Trinity, creen en el poder de la disciplina y en la fuerza imponente de los acorazados clase dreadnought. Sostienen que estos enormes buques de guerra deben seguir siendo el pilar de nuestra marina, al igual que lo son en las flotas de otras grandes potencias."
 TRN_Naval_Air_Coordination: "Cooperación marina–fuerza aérea"
 TRN_Naval_Air_Coordination_desc: "Algunos de nuestros oficiales navales visitaron a la 'madre' de la aviación de Trinity, y eso los llevó a creer que el futuro de la guerra naval pertenece a los portaaviones. Estos buques son caros, pero estos oficiales sostienen que, si estalla una guerra, aunque las batallas navales estén dominadas por acorazados clase dreadnought, pronto quedarán eclipsadas por el enorme poder de fuego de gigantescos portaaviones y bombarderos navales."
 TRN_War_Under_The_Sea: "Guerra bajo el mar"
 TRN_War_Under_The_Sea_desc: "Puede que los portaaviones y los acorazados sean el futuro, pero para [TRM.GetNameDef] concentrarse en estos buques colosales quizá no sea realista. Construir una gran marina es costoso, y [TRM.GetNameDef] no posee astilleros ni recursos para producir una flota de tal magnitud. En su lugar, debemos centrarnos en los submarinos: más baratos, pero igual de letales, capaces de hostigar las rutas de suministro marítimo del enemigo."
