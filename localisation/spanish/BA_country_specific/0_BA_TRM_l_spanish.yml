 TRM_ironsword_event.1.t: "Operación Espada de Hierro"
 TRM_ironsword_event.1.d: "Se han detectado en varios puntos terroristas antigubernamentales que conspiran desde las sombras de Trinity. Ante esto, Misono Mika ha iniciado la 'Operación Espada de Hierro' para localizarlos. La Operación Espada de Hierro es una operación conjunta que coopera con el personal de élite de la Justice Task Force y con el Departamento de Inteligencia para descubrir a los responsables que están detrás del terrorismo. A medida que aumentan las actividades terroristas que amenazan la estabilidad de Trinity, su cooperación será crucial."
 TRM_ironsword_event.1.a: "No se negocia con terroristas."

 TRM_ironsword_event.2.t: "La verdadera cara revelada"
 TRM_ironsword_event.2.d: "Tras una larga investigación, hemos capturado a un agente que operaba tras bambalinas en Trinity. Después de una dura tortura, el agente empezó a hablar y confesó que tras él se encontraba la Arius Branch School. Actualmente, el agente ha sido encarcelado tras recibir tratamiento."

 TRM_ironsword_event.3.t: "Investigación con avances"
 TRM_ironsword_event.3.d: "Hemos localizado la guarida de los terroristas. Lanzamos la operación y realizamos una redada para capturarlos, pero fracasamos a la hora de descubrir a quienes estaban detrás. Aun así, al arrestar a los terroristas, la Operación Espada de Hierro demostró ser efectiva."

 TRM_ironsword_event.4.t: "Cierre de la investigación"
 TRM_ironsword_event.4.d: "Gracias a una operación conjunta a gran escala entre [KSP.GetName], la Justice Task Force y el Departamento de Inteligencia, hemos identificado a los responsables del terrorismo y logrado capturarlos. Con el éxito de la Operación Espada de Hierro, la amenaza terrorista ha desaparecido de Trinity. Los miembros de la Justice Task Force y del Departamento de Inteligencia que participaron en la operación obtendrán honor y riqueza. Por supuesto, lo mismo ocurrirá con los investigadores de [KSP.GetName]."
 TRM_ironsword_event.4.d_2: "Mediante una investigación conjunta entre la Justice Task Force y el Departamento de Inteligencia, hemos identificado a los responsables del terrorismo y logrado capturarlos. Con el éxito de la Operación Espada de Hierro, la amenaza terrorista ha desaparecido de Trinity. En particular, los miembros de la Justice Task Force y del Departamento de Inteligencia que participaron en la operación obtendrán honor y riqueza."

 TRM_ironsword_event.10.t: "Propuesta de investigación conjunta de [FROM.GetName]"
 TRM_ironsword_event.10.d: "Poco después de que [FROM.GetName] declarara la guerra al terrorismo, han solicitado ayuda a [ROOT.GetName]. Afirman que la experiencia de [ROOT.GetName] será de gran utilidad para una operación de captura de terroristas llamada 'Operación Espada de Hierro'. ¿Debemos intervenir en su operación?"

 TRM_ironsword_event.11.d: "[FROM.GetName] ha rechazado nuestras exigencias presentando diversas justificaciones. La investigación no quedará paralizada, pero capturar al culpable llevará algo más de tiempo."
 TRM_ironsword_event.12.d: "¡[FROM.GetName] ha expresado su intención de cooperar con nosotros! Su ayuda será de gran utilidad para capturar al culpable."

 TRM_Nagisa_Iron_sword_op_cat: "Operación de rastreo de Arius"
 TRM_Nagisa_Iron_sword_op_cat_desc: "Una serie de señales inquietantes en Trinity demuestra que alguien está interviniendo profundamente en la academia. Debemos revelar sin falta a la organización que está detrás de estos actos. Justo por estas fechas, se ha descubierto cerca de Gdynia un refugio oculto con símbolos que se sospecha pertenecen a la Arius Branch School...\n\nLa tasa de búsqueda actual es §Y[?TRM_Nagi_IronSword_Var]%§!."
 TRM_Nagi_IronSword_Var_plus: "La tasa de búsqueda aumenta en $RIGHT|+=%%1$."
 TRM_Nagi_IronSword_Danzig_Search: "Búsqueda en Danzig"
 TRM_Nagi_IronSword_Danzig_Search_desc: "Mientras contactábamos a los habitantes locales, hemos encontrado en la región de Danzig un refugio oculto que parece estar relacionado con Arius. Si registramos los alrededores, podríamos obtener pistas importantes."
 TRM_Nagi_IronSword_intelligence_agency: "Solicitar investigación al servicio de inteligencia"
 TRM_Nagi_IronSword_justice_task_force: "Movilizar a la Justice Task Force"
 TRM_Nagi_IronSword_local_cooperation: "Cooperación local"
 TRM_Nagi_IronSword_We_Find_You: "Formular el plan de recuperación de Arius"
 TRM_Nagi_IronSword_We_Find_You_trigger: "La tasa de búsqueda supera el §Y89%§!"

 #발칸 외교

 TRMDIP.1.t: "Exigencia de cesión territorial en Yugoslavia por parte del Ministerio de Asuntos Exteriores de [FROM.GetAdjective]"
 TRMDIP.1.d: "Hace unos instantes, a través del Ministerio de Asuntos Exteriores, se entregó formalmente al embajador de [ROOT.GetAdjective] un documento que exige la cesión territorial. El portavoz del ministerio declaró que 'Eslovenia del Norte pertenece histórica y culturalmente al espacio vital del pueblo germánico, y [FROM.GetAdjective], como sucesor de Alemania, tiene el deber de proteger al pueblo germánico y sus territorios.' Según fuentes gubernamentales, el embajador de [FROM.GetAdjective] en Yugoslavia notificó que transmitiría este contenido a su país. Tras el anuncio del ministerio, el Ministerio de Defensa de [FROM.GetAdjective] declaró en una conferencia que reforzará la seguridad de la zona fronteriza sur para estar preparado ante cualquier eventualidad."
 
 TRMDIP.2.t: "Aceptación de las exigencias del gobierno de [FROM.GetAdjective]"
 TRMDIP.2.d: "El gobierno de [FROM.GetAdjective] ha aceptado la exigencia de cesión territorial del Ministerio de Asuntos Exteriores de [ROOT.GetAdjective]. Junto con un anuncio de que completarán la retirada, en un plazo de dos semanas, de las regiones donde [ROOT.GetAdjective] reclama soberanía, el gobierno de [FROM.GetAdjective] expresó su respeto por la soberanía territorial de [ROOT.GetAdjective]. Sobre este anuncio, un portavoz gubernamental declaró: 'Es una gran victoria del Ministerio de Asuntos Exteriores de [ROOT.GetAdjective] y de [ROOT.GetLeader], y el gobierno seguirá haciendo todo lo posible para defender los derechos de [ROOT.GetAdjective].' Expertos advirtieron que la decisión de cesión territorial del gobierno de [FROM.GetAdjective] podría sentar precedentes para casos similares en los Balcanes en el futuro."

 TRMDIP.3.t: "Rechazo de las exigencias del gobierno de [FROM.GetAdjective]"
 TRMDIP.3.d: "El gobierno de [FROM.GetAdjective] ha rechazado la exigencia de [ROOT.GetAdjective] de reconocer su soberanía sobre Eslovenia del Norte. [FROM.GetLeader] declaró: '[FROM.GetAdjective] es el lugar donde viven los pueblos balcánicos y jamás puede ser dividido', proclamando que no cederán ante amenazas irracionales de otros países. En respuesta, el gobierno señaló: 'No podemos ignorar la conducta de [FROM.GetName], que menosprecia las demandas legítimas de [ROOT.GetAdjective] y ejerce una tiranía', insinuando una respuesta firme. Un portavoz del Ministerio de Defensa indicó que el reciente redespliegue de tropas hacia la frontera de [FROM.GetAdjective] es una medida normal considerando el estado de tensión actual."

 TRMDIP.4.t: "Propuesta de [FROM.GetAdjective] de apoyar nuestra reclamación de soberanía sobre [45.GetName]"
 TRMDIP.4.d: "[FROM.GetAdjective] nos ha propuesto apoyar nuestra reclamación de soberanía sobre [45.GetName] a cambio de firmar un tratado de cooperación y garantía mutua de independencia. Parece un buen trato para nosotros, pero ¿debemos aceptarlo?"
 TRMDIP.4.b: "¿Por qué deberíamos confiar en los forasteros de otro mundo?"

 TRMDIP.5.t: "$TRM_Schidsspruch$"
 TRMDIP.5.desc: "A petición de nuestro aliado Hungría, hoy se celebró en Eden una conferencia para reajustar la frontera de Rumanía. Tras diversas discusiones, se llegó a tres posibles conclusiones.\n\nLa primera es entregar toda Transilvania a Hungría. Negaremos por completo el Tratado de Trianon que separó a Transilvania de Hungría, y la devolveremos a sus gobernantes legítimos, los magiares. De hecho, en algunas zonas de Transilvania los magiares constituyen la mayoría, por lo que no sería algo imposible.\n\nLa segunda es entregar una parte de Transilvania a Hungría. Aunque los magiares sean mayoría, no están distribuidos uniformemente por toda la región, sino concentrados en algunas zonas montañosas. En particular, se encuentran en el norte de Transilvania, por lo que ceder solo el norte podría resolver el problema entre ambos países.\n\nLa tercera es no intervenir en Transilvania. El Tratado de Trianon fue firmado antes de que sufriéramos el Gran Traslado; aún no comprendemos por completo los sentimientos entre ambos países y desconocemos qué desventajas podríamos sufrir por esta elección en el futuro. El problema entre ambos países debe ser resuelto por ellos mismos.\n\nLas tres propuestas fueron transmitidas hoy a [TRM.GetLeader] a través del despacho. Ahora debemos elegir."
 
 TRM_second_vienna_award: "$TRM_Schidsspruch$"
 TRMDIP.6.t: "El ultimátum de [FROM.GetAdjective]"
 TRMDIP.6.d: "Recientemente, [FROM.GetAdjective], que ha formado una alianza con Hungría, declaró la invalidez del Tratado de Trianon y decidió que el norte de Transilvania debe ser devuelto a Hungría. ¿Debemos aceptar esta decisión?"
 TRMDIP.7.d: "Recientemente, [FROM.GetAdjective], que ha formado una alianza con Hungría, declaró la invalidez del Tratado de Trianon y, de manera absurda, decidió que toda Transilvania debe volver al dominio de Hungría. ¿Debemos aceptar esta decisión?"
 
 TRMDIP.8.t: "[FROM.GetAdjective] ha rechazado nuestras demandas"
 TRMDIP.8.d: "El gobierno de [FROM.GetName] rechazó nuestras exigencias y se negó a firmar el tratado de cesión de Transilvania. Junto a [HUN.GetAdjective], aplastaremos a [FROM.GetName]."
 
 TRMDIP.9.t: "$TRM_Schidsspruch$"
 TRMDIP.9.d: "[ROM.GetName], que aceptó el ultimátum de [TRM.GetAdjective], ha enviado hoy a nuestro gobierno una notificación en la que acepta ceder Transilvania. Es un momento histórico."

 TRMDIP.10.t: "Propuesta de mediación de [TRM.GetAdjective]"
 TRMDIP.10.d: "A pesar de nuestras legítimas reivindicaciones territoriales, [TRM.GetAdjective] decidió que Transilvania debe permanecer bajo el dominio de Rumanía. Afirman querer resolver el problema de los Balcanes, pero parece que solo lo hacen cuando beneficia a sus propios intereses."

 TRMDIP.11.t: "$TRM_support_the_croatia_militia$"
 TRMDIP.11.d: "Al obtener [102.GetName], hemos confirmado que Yugoslavia ya no posee la fuerza necesaria para rechazar nuestras exigencias. [TRM.GetLeader] comprendió que, para debilitar a Yugoslavia y someterla finalmente a nuestra esfera de influencia, la independencia de Croacia es prácticamente indispensable.\n\nEl Ministerio de Asuntos Exteriores ha presentado dos propuestas.\nLa primera consiste en presionar militarmente para separar a Croacia de Yugoslavia. Aunque podría haber resistencia, podremos lograrlo mediante una fuerza militar abrumadora o mediante la mediación de otras potencias, incorporando a Croacia a nuestra esfera de influencia.\n\nLa segunda consiste en contactar con fuerzas de resistencia internas en Croacia e inducir una rebelión. Este proceso implicará enormes costos, pero si Croacia logra independizarse, supondrá un golpe devastador para Yugoslavia."
 TRMDIP.11.a: "La primera."
 TRMDIP.11.b: "La segunda."

 TRMDIP.12.t: "¡[FROM.GetAdjective] exige [DEN.GetAdjective]!"
 TRMDIP.12.d: "Anoche, [FROM.GetAdjective] envió a [ROOT.Capital.GetName] una carta exigiendo [DEN.GetAdjective]. [DEN.GetAdjective], adquirido por [ROOT.GetAdjective] tras el Gran Traslado, posee un enorme valor estratégico. Sin embargo, el hecho de que [FROM.GetAdjective] exija un territorio de tal importancia estratégica equivale a declarar su deseo de guerra contra nosotros."
 TRMDIP.12.a: "Aceptemos sus exigencias..."
 TRMDIP.12.b: "Rechacemos cortésmente sus exigencias."

 TRMDIP.13.t: "[FROM.GetAdjective] ha cedido [DEN.GetAdjective]"
 TRMDIP.13.d: "A primera hora de la mañana, [FROM.GetAdjective] envió a [ROOT.Capital.GetName] una notificación afirmando que transferirá [DEN.GetAdjective] en un plazo de 24 horas. Dado el enorme valor estratégico de [DEN.GetAdjective], nuestra diplomacia ha vuelto a triunfar."

 TRMDIP.14.t: "¡[FROM.GetName] ha rechazado nuestras exigencias!"
 TRMDIP.14.d: "A primera hora de la mañana, [FROM.GetAdjective] envió a [ROOT.Capital.GetName] un documento en el que se niega a ceder [DEN.GetAdjective]. La importancia estratégica de [DEN.GetAdjective] ha sido enfatizada dentro de [FROM.GetAdjective], lo que parece haber motivado el rechazo de nuestras exigencias. Las nubes de la guerra vuelven a cernirse sobre nosotros."

 TRMDIP.15.t: "Asunto: Escalada del descontento entre la población de origen alemán"
 TRMDIP.15.d: "Alto secreto\nInforme\n\n[ROOT.GetAdjective] [GetDate]\nAsunto: Intensificación del descontento entre la población de origen alemán y potencial crisis\n\nContenido del incidente\n\n1. Las manifestaciones proalemanas entre la población de origen alemán están aumentando rápidamente. Los manifestantes expresan su descontento gritando consignas como \"¡Garantizad la libre circulación!\".\n2. Los manifestantes han advertido que, si sus demandas no son aceptadas, \"las obtendrán por la fuerza\", lo que incrementa la gravedad de la situación.\n3. La situación en el núcleo de Trinity no es normal. El interés por las comunidades alemanas en el extranjero está aumentando, y se han detectado movimientos que sugieren una posible intervención en esta región.\n4. Si la situación actual continúa, existe el riesgo de inestabilidad interna y de un aumento de las tensiones en las relaciones internacionales.\n\nFin del informe."
 TRMDIP.15.a: "¡Reprimidlos a todos!"
 TRMDIP.15.b: "No hay alternativa: debemos aceptar las demandas de los manifestantes."

 TRMDIP.16.t: "[ROOT.GetLeader] ha iniciado una guerra de conquista"
 TRMDIP.16.d: "Con el inicio de una guerra de conquista por parte de nuestra patria, los planes económicos existentes y los programas de estabilización interna ya no pueden continuar. Tal vez podamos reanudarlos cuando regrese la paz, pero por ahora debemos concentrarnos en concluir la guerra de conquista."
 TRMDIP.16.a: "¡[ROOT.GetAdjective], vence!"
 TRM_focus_locked_flag_tt: "¡Todos los §Yenfoques internos§! quedan desactivados!"
 
 TRMDIP.17.t: "¡La invasión de los demonios!"
 TRMDIP.17.d: "Hoy ha ocurrido aquello que temíamos. Los demonios de Gehenna han comenzado un ataque simultáneo contra nosotros, y en el frente ya se registran bajas. Debemos resistir hasta el final."
 
 TRMDIP.18.t: "¿Tratado Trinity–Red Winter?"
 TRMDIP.18.d: "El Ministerio de Asuntos Exteriores de Trinity presentó un informe a [ROOT.GetLeader] ante el aumento de tensiones relacionadas con Red Winter, que mantiene un tratado de amistad con Gehenna. El informe advierte que, en caso de estallar una guerra contra Gehenna, existe la posibilidad de que surjan conflictos en la frontera con Red Winter. Para prevenir esta crisis, el ministerio enfatizó firmemente la necesidad de concluir un pacto de no agresión con Red Winter."
 TRMDIP.18.a: "Contactemos a [RED.GetAdjective]."
 TRMDIP.18.b: "Es una preocupación innecesaria."

 TRMDIP.19.t: "Propuesta de pacto de no agresión de [FROM.GetAdjective]"

 TRMDIP.20.t: "¡Atentados anti-Gehenna en [?TRM.TRM_anti_geh_emotion_var.GetName]!"
 TRMDIP.20.d: "Recientemente, se han producido con frecuencia atentados con bombas perpetrados por estudiantes de nuestra academia en regiones de la academia Gehenna. Según los informes, estos ataques se llevan a cabo de manera indiscriminada, sin objetivos específicos, causando enormes daños a instalaciones clave y a la población local. La magnitud de los daños aún no ha sido determinada con precisión, pero la frecuencia de los atentados ha sumido a la región en un caos extremo. Estos ataques no son incidentes aislados, sino acciones sistemáticas y repetidas.\n\nUn problema aún más grave es que estos ataques están provocando la formación de organizaciones de resistencia dentro de Gehenna. Los estudiantes de Gehenna han comenzado a organizar respuestas coordinadas para proteger su seguridad y autonomía, lo que representa una amenaza significativa para nuestra ocupación de Gehenna. Estas organizaciones no se limitarán a la defensa, sino que podrían interferir directamente en nuestras tácticas.\n\nEn particular, como resultado de estos atentados, la zona industrial de [?TRM.TRM_anti_geh_emotion_var.GetName] se ha convertido en un objetivo principal, y el acceso a las fábricas ha sido completamente bloqueado. Estas instalaciones, que constituyen centros clave de producción y suministro, están sufriendo graves interrupciones logísticas y de recursos. Existe el riesgo de que el impacto económico se extienda no solo a Gehenna, sino también a las regiones circundantes.\n\nSe requiere una revisión estratégica exhaustiva para garantizar que el plan de ocupación continúe según lo previsto."
 TRMDIP.20.a: "Necesitamos otro plan..."

 TRMDIP.21.t: "Pacto de no agresión con [TRM.GetAdjective]"
 TRMDIP.21.d: "El Ministerio de Asuntos Exteriores de Trinity ha propuesto un pacto de no agresión entre ambas naciones. Este tratado no solo ampliará significativamente el comercio mutuo, sino que también incluye, en un protocolo secreto adicional, el reconocimiento de toda Escandinavia como esfera de influencia de Red Winter.\n\nAunque los fascistas de Eden pueden no ser dignos de confianza, firmar este acuerdo nos permitirá justificar nuestro dominio sobre Escandinavia sin temor a la intervención de otras potencias. Además, si Finlandia colapsa, podríamos aprovechar la oportunidad para incorporarla a nuestro territorio."
 TRMDIP.21.a: "Firmemos el tratado."
 TRMDIP.21.b: "¡No negociamos con fascistas!"
 TRM_RED_pact: "Pacto de no agresión Trinity–Red Winter"
 refused_TRM_RED_pact: "Pacto de no agresión rechazado"

 TRMDIP.22.t: "¡[RED.Capital.GetCapitalVictoryPointName] acepta el tratado!"
 TRMDIP.22.d: "[RED.GetNameDefCap] ha firmado sabiamente nuestro pacto de no agresión. Esto significa que podremos actuar libremente sin el riesgo de intervención de Red Winter."
 TRMDIP.22.a: "Una victoria diplomática."

 TRMDIP.23.t: "¡[RED.Capital.GetCapitalVictoryPointName] rechaza el tratado!"
 TRMDIP.23.d: "[RED.GetNameDefCap] ha rechazado imprudentemente nuestro tratado. Sin duda, existe una conspiración contra nosotros."
 TRMDIP.23.a: "Desagradable."

 TRMDIP.24.t: "Disturbios alemanes"
 TRMDIP.24.d: "Numerosos alemanes se han levantado contra nosotros, provocando disturbios. Gritando \"Patria unificada\", han destruido símbolos de Gehenna o los han vandalizado con grafitis, elevando su resistencia contra el sistema. Su ira ha estallado en las calles, negando abiertamente la autoridad de Gehenna.\n\nAunque los disturbios están siendo parcialmente reprimidos, han surgido indicios de que este incidente no es un movimiento espontáneo, sino el resultado de instigación y manipulación por parte de alguien. En particular, Trinity es considerada la principal sospechosa de estar detrás de estos acontecimientos."
 TRMDIP.24.a: "Es una interferencia interna."

 TRMDIP.25.t: "Mediación de Gleiwitz"
 TRMDIP.25.desc: "La persecución de los alemanes en Sudeten Silesia es una tragedia profundamente dolorosa para el pueblo germánico. Tenemos plena voluntad de contribuir a la paz mundial defendiendo el principio de autodeterminación nacional acordado en 1919. A través de nuestra embajada, solicitaremos cortésmente al país en cuestión que reestructure adecuadamente las fronteras distorsionadas y descoordinadas por la situación actual en las regiones checas, y además lograremos la cesión de Sudeten Silesia."
 TRMDIP.25.a: "Esa tierra es nuestro territorio."

 TRMDIP.26.t: "Mediación de Gleiwitz"
 TRMDIP.26.desc: "Hemos recibido de [TRM.getname] la exigencia de renunciar a nuestras reivindicaciones territoriales sobre [74.getname] y [72.getname], y de establecer nuevas fronteras conforme al principio de autodeterminación nacional."
 TRMDIP.26.a: "Aceptemos su propuesta."
 TRMDIP.26.b: "¡Es absurdo!"

 TRMDIP.27.t: "Rechazo"
 TRMDIP.27.desc: "Nuestra mediación ha sido rechazada por la parte implicada."
 TRMDIP.27.a: "Utilicemos el segundo método."
 TRMDIP.27_tt: "§LLos alemanes de los Sudetes se alzarán en rebelión.§!"
 TRMDIP.27.b: "Demos un paso atrás."
 
 TRMDIP.28.t: "Ultimátum de [TRM.getname]"
 TRMDIP.28.desc: "[TRM.getname] ha exigido la aceptación incondicional de su mediación para la reorganización territorial de [SLO.getname]."
 TRMDIP.28.a: "No tenemos alternativa."
 TRMDIP.28.b: "¡Resistamos!"

 TRMDIP.29.t: "Propuesta de [TRM.getname]"
 TRMDIP.29.desc: "La embajada de [TRM.getname] nos ha exigido una alianza militar a cambio de garantizar la administración de toda Eslovaquia."
 TRMDIP.29.a: "Tentador."
 TRMDIP.29.b: "Rechacemos."

 TRMDIP.30.t: "El destino de Eslovaquia"
 TRMDIP.30.desc: "Eslovaquia es una nación eslava inferior, pero conserva rastros de carácter germánico, por lo que debe ser guiada por [TRM.getname], representante del pueblo germánico. Tras la aceptación de nuestro ultimátum enviado a Eslovaquia, podemos establecer un gobierno amistoso allí o cederla a Hungría para fortalecer nuestra alianza."
 TRMDIP.30.a: "Establezcamos un gobierno amistoso."
 TRMDIP.30.b: "Fortalezcamos nuestra alianza con Hungría."

 TRMDIP.31.d: "[TRM.getname] ha enviado una invitación a su facción, enfatizando que somos estados fascistas afines. Italia es ciertamente un estado fascista, pero el fascismo que proclaman esos seres de otro mundo es diferente. Si aceptamos su invitación, se formará una poderosa alianza, pero nuestro pueblo no desea una alianza con ellos."


# 아리우스 스쿼드 문제 ###Thx for TNO team###
  TRN_arius_squad_smash_decision: "El problema del Arius Squad"
 TRN_arius_squad_smash_decision_desc: "\n\n£GFX_TRN_decisions_arius_squad\n\n\n\n\nEl Arius Squad se refiere a un grupo de élite de la Arius Branch School que, tras ser adoctrinadas con lavado de cerebro, amenazas y odio, actúan como terroristas sin el menor remordimiento. Sin embargo, cuando la Branch School se negó a integrarse y se enfrentó a Trinity, ellas aprovecharon el caos para ocultarse por todo el territorio de Trinity. Al haber sido criadas como armas asesinas capaces de matar a cualquier persona sin vacilar, se requiere una respuesta rápida por parte del gobierno."
 TRN_arius_squad_smash: "Perseguir al Arius Squad"
 TRN_switch_roe: "Cambiar los procedimientos de seguridad"
 TRN_abandon_operations: "Suspender la operación"
