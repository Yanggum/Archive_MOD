 TRN_68_go_back_to_gehenna_desc: "La Agencia 68, aunque parte de Gehenna, ha actuado por su cuenta sin unirse a la unión. Hay que someterlos por la fuerza si es necesario."
 TRN_war_with_knight_templar_desc: "Caballeros templarios"
 TRN_bbul_evils_nomore_desc: "La Academia Abydos ha pasado por grandes dificultades. Sobrevivir sola es complicado, por eso le ofreceremos nuestra protección."
