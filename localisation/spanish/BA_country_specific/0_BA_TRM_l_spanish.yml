 TRN_after_war_decisions: "Movimiento de resistencia de Gehenna"
 TRN_after_war_decisions_desc: "La resistencia de los estudiantes de Gehenna se está organizando cada vez más, y la 'Alianza de Resistencia Estudiantil de Gehenna', congregada en torno a los remanentes del Hot Springs Development Department, el Gourmet Research Society y el Prefect Team, está suponiendo una amenaza real para Trinity.\nEl problema también existe dentro. Algunos estudiantes de Trinity, lejos de colaborar con el gobierno, están cometiendo discriminación y violencia contra los estudiantes de Gehenna, e incluso actos terroristas: un crimen evidente. Esta hostilidad no hace más que intensificar la resistencia y, en lugar de asegurar recursos, corre el riesgo de amplificar los conflictos internos. Si Trinity pretende controlar de forma estable los recursos de Gehenna y lograr la integración, serán necesarias medidas extraordinarias."
