 trinity_flavor_events.0.t: "Implantes básicos 1/2"
 trinity_flavor_events.0.desc: "\"¿De verdad es aquí?\"\n\n\"Sí, así es. Según la información confirmada...\"\n\nRopa negra y pasamontañas. Y dos hombres armados con un arma un poco grande como para llamarla pistola conversaban frente a una casa que parecía un palacio. Habían venido en plena madrugada para atacar a Yurizono Seia.\n\n\"Uff... si solo abrimos esta puerta, ¿ahí dentro está esa mujer, no?\"\n\n\"Sí... eso parece. Pero, ¿de verdad se puede con este arma? Ah, ¿no viste lo de antes? A esas tipas con un halo en la cabeza les disparas y solo les duele como si les pegaras con una pistolita de juguete.\"\n\n\"Carajo. Ni idea. Pero el intermediario dijo que se muere, así que… supongo que sí se morirá.\"\n\n\"No, aun así… ¿no es demasiado peligroso? Ni siquiera conocemos al intermediario. ¿Y si nos mandó para matarnos?\"\n\n\"¿Qué dices? Deja de chillar y abre la puerta.\"\n\nClic. Clac.\n\nCon bastante habilidad, el hombre desactivó rápido la cerradura y se infiltraron en silencio, registrando habitación por habitación. A los pocos minutos de empezar, vieron a alguien durmiendo profundamente en una cama. Uno le hizo una seña al otro para que lo siguiera en silencio, y ambos entendieron por instinto que habían encontrado a la mujer.\n\nEntonces empezaron a apretar el gatillo sin parar. "
 trinity_flavor_events.0.a: "$GEH_event.40.a$"

 trinity_flavor_events.1.t: "Implantes básicos 2/2"
 trinity_flavor_events.1.desc: "En cuanto confirmaron a la mujer dormida en la cama, los dos hombres cruzaron una mirada por un instante. Intuyeron que era Yurizono Seia, a quien buscaban. Uno le hizo una seña al otro y, acercándose en silencio, comenzó a disparar.\n\nLos tiros rompieron el silencio de la noche. Pero, contra toda expectativa, la mujer se levantó aun después de recibir los impactos. Como si las balas no le afectaran, sus movimientos no se ralentizaron en lo más mínimo.\n\n\"¿Qué…? ¿Por qué no se muere?\" El primer hombre apretó el gatillo otra vez con desesperación, pero en ese instante la mujer empezó a moverse a una velocidad increíble. Con el potenciador de reflejos del sistema nervioso central activado, se abalanzó sobre ellos y, antes de que pudieran reaccionar, le arrebató el arma a uno de las manos y la arrojó al suelo.\n\n\"¡Maldición… esto es… un monstruo!\" El segundo hombre gritó e intentó huir, pero sus pies ya no se separaban del suelo: la mujer lo había agarrado de la nuca y lo estampó contra la pared.\n\nCon una mirada helada, lo observó desde arriba y dijo en voz baja: \"¿Quién los contrató?\"\n\nEl primero retrocedió tambaleándose, pero ya no tenía adónde escapar. \"¡Gh… no lo sé! ¡Por favor… perdóname la vida!\"\n\nLa mujer apartó la vista de él y clavó la mirada en el segundo. Sus ojos estaban llenos de pánico. \"¡Maldición, maldición! ¡Solo vinimos por dinero! El intermediario… ese tipo nos dio esta arma y dijo que si te matábamos nos daría un dineral.\"\n\n\"¿Intermediario?\" La voz de la mujer seguía calmada, pero cortante. Al aumentar la presión de su mano, el hombre jadeó y asintió.\n\n\"Sí… el intermediario dijo… que te matáramos. ¡Creí que era verdad!\"\n\nLa mujer guardó silencio un instante. En cuanto terminaron de hablar, les retorció el cuello a ambos al mismo tiempo. Los dos cuerpos se desplomaron sin fuerza y la habitación volvió a quedar en silencio.\n\nYurizono Seia miró sus cuerpos sin emoción, y los contempló con indiferencia. \"Intermediario…\" Murmuró esa palabra y salió de la habitación."
 trinity_flavor_events.1.a: "\"Intermediario…\""

 trinity_flavor_events.2.t: "\"El negociador\""
 trinity_flavor_events.2.desc: "\"Estos son nuestros requisitos.\"\nLa voz del hombre era serena, pero se notaba la tensión. Colocó un documento frente a la mujer. En su interior figuraban diez exigencias presentadas por los ciudadanos alemanes a la Academia General Trinity.\n\nLa mujer lo miró y se sumió en silencio. A simple vista, no parecían demandas desmedidas. Incluso parecían derechos obvios. Pero en su interior no era tan sencillo. Las órdenes recibidas del alto mando le daban vueltas en la cabeza: no ceder jamás. Aun así, no lograba comprender por qué debían ser tan inflexibles. Que le exigieran negar incluso peticiones que podían aceptarse con facilidad… esa frialdad la asqueaba.\n\n\"....\"\nEl silencio se alargó. Sus dedos recorrieron el papel lentamente. Contuvo un suspiro y tomó una decisión.\n\n\"De acuerdo. Aceptaré estas exigencias.\"\n\nAl decirlo, supo al instante que su elección desataría la ira del alto mando. Sin embargo, no sintió arrepentimiento por no estar a la altura de sus expectativas. Creía que había hecho lo correcto.\n\nEl hombre sonrió. \"Gracias. Para alguien con ese aspecto, ha sido usted bastante amable.\"\n\nAnte esas palabras, la mujer sintió algo difícil de describir. Amable. Esa palabra resonó en su interior por primera vez en mucho tiempo. Pero ni ella misma podía asegurar que su acción naciera de la amabilidad. Lo único claro era que, en ese momento, se movió únicamente por la convicción de haber hecho lo correcto."
 trinity_flavor_events.2.a: "\"Las palabras amables son cortas y fáciles de decir, pero sus ecos no tienen fin.\" —Ralph Waldo Emerson"

 trinity_flavor_events.3.t: "El negociador, entre bastidores"
 trinity_flavor_events.3.desc: "La sala de reuniones de la Academia General Trinity se había hundido en un silencio pesado. La mirada del alto mando estaba fija en un solo punto: Kenzaki Tsurugi. El debate sobre su decisión se encendió, y ahora había que decidir si destituirla del puesto de directora del Justice Task Force.\n\n\"Esto es inadmisible\", alzó la voz uno del alto mando. \"Dimos una orden, y ella no la cumplió. Es una violación de nuestro régimen. ¡No puede seguir aquí!\"\n\nKenzaki Tsurugi permanecía en silencio. Parecía haber aceptado ya el castigo inminente. Las críticas la apuntaban como cuchillas, pero no vaciló. La sostenía la convicción de que su decisión fue correcta.\n\nEntonces la puerta se abrió con suavidad. En medio de la tensión helada, Kirifuji Nagisa entró con calma. Su expresión era tan apacible como siempre. Tras inclinarse ligeramente, habló en voz baja.\n\n\"¿Se encuentran bien? Mientras escuchaba su discusión, he podido ordenar un poco mis pensamientos.\"\n\nEl alto mando guardó silencio y se volvió hacia ella. Su tono sereno captó la atención de todos.\n\n\"Creo que conviene reconsiderar la decisión de la directora Kenzaki\", continuó Nagisa despacio. \"Lo que hizo no fue solo desobedecer una orden: fue un acto de responsabilidad, tomado tras comprender la situación a fondo.\"\n\n\"Señora Kirifuji, ella desobedeció nuestras órdenes\", replicó otro. \"Eso es simple insubordinación.\"\n\nNagisa sonrió apenas y ladeó la cabeza. \"Por supuesto, puede parecer así. Pero a veces hay cosas más importantes que el régimen en sí: el corazón de las personas y la justicia. La directora Kenzaki aceptó las demandas de los ciudadanos considerando justamente eso. Espero que comprendan que no fue una mera rebeldía.\"\n\nEl alto mando ya no pudo decir nada. Kenzaki Tsurugi bajó un poco la cabeza, agradecida. En ese instante, el peso en su interior pareció aligerarse, aunque fuera un poco."
 trinity_flavor_events.3.a: "\"Mejor es el joven pobre y sabio que el rey viejo y necio.\" —Eclesiastés 4:13"

 trinity_flavor_events.4.desc: "Toc.\nCon un sonido claro, una taza de té fue apoyada sobre la mesa. Ese sonido fue lo único que llenó el silencioso despacho. Kirifuji Nagisa, con una suave sonrisa, estaba perdida en sus pensamientos. El aroma tenue que subía de la taza la envolvía, pero en su mente flotaban incontables dudas.\n\n'¿Quién será el traidor de Trinity?'\n'¿Con qué propósito hace esto?'\n\nMiró el informe en sus manos y volvió a repasar los nombres ya ordenados. Dedujo y dedujo, pero no halló una respuesta clara. Descubrir la identidad del traidor que amenazaba a la Academia General Trinity era su misión, y debía cumplirla a la perfección.\n\n\"...Ajitani Hifumi, Urawa Hanako, Shirasu Azusa y Shimoe Koharu...\"\nAl pronunciar cada nombre, Nagisa evocó por un momento sus antecedentes.\nHifumi, aunque se decía que su calificación bajó por faltar a un examen tras asistir a una presentación guerrillera de Peroro, en realidad mostraba rastros de actividades ilegales vinculadas al 'mercado negro'.\nHanako llamaba la atención por su caída deliberada de notas y su conducta indecorosa. Si se recordaban sus logros brillantes del pasado, su estado actual era muy sospechoso.\nAzusa ya era un objetivo de vigilancia por su pasado violento y su alboroto armado; y Koharu, aunque su bajo rendimiento era un problema evidente, también estaba bajo sospecha.\n\nNagisa ordenó sus ideas y tomó una decisión. Su mirada se enfrió por un instante.\n\n\"Intégrenlas al Club de Clases de Refuerzo. Es más eficiente juntar la basura en una sola canasta.\"\n\nDio la orden con una voz suave, pero firme. El miembro de la Tea Party a su lado inclinó la cabeza y respondió:\n\n\"Sí, entendido. Lady Nagisa.\"\n\nEl miembro salió cerrando la puerta. Y entonces, una vez más, el silencio regresó.\n\nNagisa levantó la taza y humedeció apenas sus labios. El calor del té le envolvió la lengua, y su sonrisa apacible volvió a dibujarse en su rostro."
 trinity_flavor_events.4.a: "Auu..."

 TRM_story_archive: "trinity_events ARCHIVO DE HISTORIA"
 TRM_story_event.1.t: "El último enemigo que será destruido es la muerte"
 TRM_story_event.1.desc: "\n\n£GFX_texticon_BA_story_archive_trinity_picture_1\n\n\n\n\nUn tranquilo pueblo rural en las afueras de Trinity.\nKlaus Müller se enamoró de una mujer procedente de Kivotos y, tras insistir en su cortejo, por fin celebraron su boda. Meses después, la pareja tuvo un hijo: Mihail Müller, y parecía que aquella vida pacífica continuaría.\n\n\"Mihail, ¿te ayudo?\"\n\"Ah, papá. No, estoy bien. Puedo hacerlo solo.\"\n\"¿Sí? Nada mal.\"\n\"Gracias, papá.\"\n\nKlaus habló sonriendo.\n\n\"Algún día convertirás este lugar en algo increíble. Tu mamá y yo ya hicimos lo que nos tocaba. A partir de ahora, te tocará a ti.\"\n\"...Tal vez esto se convierta en la granja más genial del país.\"\n\nKlaus respondió mientras encendía un cigarrillo.\n\n\"Puede ser.\"\n\n\"¿Klaus...? ¡Klaus! ¡Ven un momento!\"\nSu esposa, Suzuki Yui, era una estudiante de tercer año de Trinity, y tras graduarse vivió de trabajos ocasionales hasta que conoció a Klaus. Al inicio se sintió confundida, pero su cortejo sincero la conmovió; empezaron a salir y, tras un 'exceso de velocidad', acabaron casándose. Ella solo quería una vida común y tranquila, y Klaus, trabajando la tierra como le enseñó su padre, quería prometerle una vida estable.\n\nEse día, mientras miraba como siempre el paisaje más allá de la valla, Yui vio acercarse de pronto a unas mujeres con uniformes negros. Por instinto supo que era el Justice Task Force. En sus días de estudiante, sobre todo en primer año cuando era una problemática, se había cruzado con ellas muchas veces y reconoció ese uniforme al instante. Pero ahora era distinto. En segundo año se dedicó al estudio y se volvió una alumna ejemplar reconocida por todos. Por eso, que el Justice Task Force apareciera en su casa se sentía extraño y ominoso.\n\nKlaus percibió que algo iba mal. De inmediato llevó a su esposa y a su hijo al granero. El Justice Task Force cercó la granja y empezó a registrar con cautela.\n\n\"Escucha, Mihail. Yui. Suban a este caballo. Váyanse ya. Tienen que esconderse.\"\nKlaus susurró mientras montaba a su esposa e hijo.\n\"¡Papá, ven con nosotros!\"\nMihail, al borde del llanto, miró a su padre.\n\"Yo iré detrás. Solo monta y no mires atrás. No te preocupes por mí.\"\n\"Vete ya...\"\n\n\"Vuelve con vida, Klaus...\"\nYui dijo con voz temblorosa.\n\n\"Puede que no pueda, Yui.\"\nKlaus apretó la mano de Yui y continuó. Ella, sin decir nada, besó sus labios.\n\n\"Te amo.\"\n\"Yo también.\"\n\n\"¡Ahora vete! ¡Arre!\"\n\nAl azotar la grupa del caballo, este relinchó y salió disparado.\n\nDesde una rendija del granero se veía el exterior. Agentes del Justice Task Force, con fusiles, rodeaban el lugar, y en el centro estaba alguien que parecía ser el investigador.\n\nKlaus abrió la puerta del granero y salió caminando despacio. Las bocas de fuego lo apuntaron, pero el investigador no disparó. En cambio, habló con calma.\n\n\"Klaus Müller. ¿Eres tú?\"\n\nEn lugar de responder, Klaus sujetó con cuidado una pistola oculta en su abrigo. El investigador lo miró un instante y continuó:\n\n\"Así que sí. ¿Olvidaste lo que hiciste hace dieciocho años? Verte aquí, en este campo remoto, cultivando la tierra… vaya.\"\n\nKlaus guardó silencio. El investigador soltó una risa cínica y siguió:\n\n\"Sí. Resulta que eras ex SS. Tu expediente es muy 'brillante': doce asesinatos y hasta agresiones. Con esto, lo normal sería pena de muerte.\"\n\nEntonces Klaus habló en voz baja.\n\n\"Eso… fue por culpa de ustedes. Ustedes quemaron nuestro hogar, y desde entonces mi padre enloqueció a medias y desapareció… aún no lo encuentro.\"\n\nEl investigador negó con la cabeza, como si no le importara, y respondió:\n\n\"Qué triste, en serio. Pero eso no justifica tus asesinatos. ¿Pensaste en las familias de las víctimas?\"\nSu tono era seco, como el de un burócrata revisando un expediente viejo. No había emoción. No había empatía. Solo existía el 'trámite'.\n\nKlaus ya no dijo nada. Sacó la pistola. El movimiento fue cuidadoso, pero decidido. Apuntó al investigador.\n\n\"¡Basta!\" gritó alguien del Justice Task Force, pero ya era tarde.\n\n¡Bang!\n\nEl disparo rasgó el silencio. De inmediato, una lluvia de balas cayó sobre Klaus. El Justice Task Force respondió con disciplina perfecta. El investigador no recibió ni un impacto.\n\nKlaus Müller cayó, perforado por las balas. Por última vez pensó en el rostro de su esposa y en la voz de su hijo, y quedó tendido en silencio. El cañón aún estaba caliente.\n\nEl investigador, imperturbable, se detuvo frente a la puerta manchada de sangre del granero y ante el cadáver de Klaus. Sacó un cigarrillo, se lo puso en la boca y lo encendió. El humo le recorrió lentamente el rostro inexpresivo.\n\nLuego, mientras se alejaban, un subordinado preguntó:\n\n\"¿Qué haremos con su esposa y su hijo?\"\n\nEl investigador subió al asiento trasero y miró por la ventanilla. Su tono era frío, indiferente.\n\n\"Déjalos. Ya verán qué hacen.\"\n\nEl vehículo se alejó por el camino rural levantando polvo. Y en aquel lugar, donde la paz había sido rota, solo quedó el silencio."

 TRM_story_event.2.t: "Recuerda a mi familia."
 TRM_story_event.2.desc: "La venganza brutalmente épica de Mihail Müller"
