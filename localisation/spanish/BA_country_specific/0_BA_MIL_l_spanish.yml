 MIL_central_control_network_desc:0 "Rumores de baja calidad se propagan por la red y socavan la unidad de la escuela y los estudiantes. Debemos controlar la red central y proporcionar 'información filtrada' para mantener la estabilidad escolar."
 MIL_internet_censorship:0 "Censura en Internet"
 MIL_internet_censorship_desc:0 "A pesar del control de la red central, los rumores sobre la presidenta del seminario continúan dañando su reputación. Debemos establecer una Oficina de Supervisión de Comunicaciones para bloquearlos de antemano."
 MIL_control_of_everything:0 "Concentración del poder"
 MIL_control_of_everything_desc:0 "Ya no queda un seminario que solo se aferra a los principios sin atreverse a hacer nada. Concentramos todo el poder en la presidenta de Millennium y líder del seminario, Tsukatsuki Rio, para superar esta crisis."
