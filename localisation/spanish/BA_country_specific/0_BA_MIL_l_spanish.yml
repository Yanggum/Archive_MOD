 MIL_come_back_queen_desc:0 "El código <AL_1S> es la <princesa> de los <Sin Nombre>, que permaneció en las ruinas. Sin embargo, por un error del lado de Millennium, la <princesa> despertó, y ellos pagaron el precio. De ahora en adelante, Millennium obedecerá únicamente bajo el dominio de la <princesa de los Sin Nombre>."
 MIL_lightsword_supernova:0 "Espada de luz, Supernova"
 MIL_lightsword_supernova_desc:0 "La Espada de Luz, Supernova, es un arma exclusiva de AL_1S y una obra maestra creada por el Departamento de Ingeniería de Millennium. El cañón principal, que devoró el 70% de su presupuesto, ahora ha sido reclamado por AL_1S."
