 MIL_domestic_administration:0 "Enfoque en el mantenimiento de la academia"
 MIL_domestic_administration_desc:0 "Las ejecutivas, al percibir que la situación no terminará pronto, decidieron resolver primero los problemas inmediatos. Gracias a su cooperación, la situación se estabiliza rápidamente. Pero ese no es el objetivo final."
 MIL_resistance_suppression:0 "Contención de la resistencia"
 MIL_resistance_suppression_desc:0 "Los estudiantes se han adaptado rápidamente a los atentados repetidos de la resistencia. Con la introducción de entrenamientos de respuesta sistemática, ahora la resistencia necesitará mucho más tiempo y sacrificios para lograr sus objetivos."
 MIL_promoting_civil_division:0 "Fomentar la división civil"
 MIL_promoting_civil_division_desc:0 "Hemos decidido ofrecer un poco de entretenimiento a los ociosos franceses. Ahora los dedos que apuntaban a nosotras se señalarán entre ellos."
 MIL_hierarchy:0 "Estructura jerárquica"
 MIL_hierarchy_desc:0 "Ahora los franceses recibirán un nuevo estatus. El único criterio claro es que 'las opiniones de los clasificados no importan'."
 MIL_special_rights:0 "Derechos especiales"
 MIL_special_rights_desc:0 "El poder nunca fue de las mayorías. Los que creían en una sociedad igualitaria verán un mundo que vuelve a lo de siempre. Los que reciban derechos de las nuevas autoridades francesas establecerán un nuevo orden bajo un nuevo sistema."
 MIL_oppressive_government:0 "Gobierno opresor"
 MIL_oppressive_government_desc:0 "El ser humano es un animal que espera que alguien fuerte lo lidere. Mostraremos nuestro verdadero poder para ellos."
 MIL_per_cooperator:0 "Partido de los colaboradores"
 MIL_per_cooperator_desc:0 "Aunque muchos quedaron confundidos por la situación cambiante, ya empiezan a reunirse quienes nos apoyan. Pronto tendremos un medio efectivo para transmitir nuestro mensaje."
 MIL_Harmony_between_citizens_and_students:0 "Armonía entre ciudadanos y estudiantes"
 MIL_Harmony_between_citizens_and_students_desc:0 "Cada vez más personas que coinciden con nuestra visión se reúnen. Serán de gran ayuda para la nueva sociedad que construiremos."
 MIL_establishment_parliament:0 "Establecimiento del parlamento"
 MIL_establishment_parliament_desc:0 "Un nuevo orden necesita un nuevo sistema. Crearemos un parlamento formado por franceses para formar un gobierno subordinado que colabore con nosotras."
 MIL_rule:0 "Gobernar"
 MIL_rule_desc:0 "Gracias a sus esfuerzos, la sociedad se estabiliza rápidamente. Ya no queda lugar para la resistencia que nos obstruía."
 MIL_technology_propaganda:0 "Propaganda científica"
 MIL_technology_propaganda_desc:0 "Ha llegado el momento de que brille la fortaleza de Millennium Science School. Nuestra tecnología será de gran ayuda para que avancen hacia una mejor sociedad."
 MIL_mutual_surveillance_system:0 "Sistema de vigilancia mutua"
 MIL_mutual_surveillance_system_desc:0 "Los locales son quienes mejor conocen su propia tierra. Con su cooperación, podremos tratar a los alborotadores de forma más eficaz."
