 MIL_milleniums_international_position:0 "Posición internacional de Millennium"
 MIL_milleniums_international_position_desc:0 "La Millennium Science School es el segundo mayor estado socialista dentro del Komintern. Debido a haber caído en otro mundo, nuestra posición internacional no es aún reconocida. Es hora de dejarla clara."
 MIL_socialism_in_one_country:0 "Socialismo en un solo país"
 MIL_socialism_in_one_country_desc:0 "Siguiendo el ejemplo de la Unión Soviética, es momento de consolidar la posición de Millennium en el caótico escenario internacional y perfeccionar nuestra avanzada tecnología."
