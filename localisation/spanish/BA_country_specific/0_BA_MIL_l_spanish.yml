#Eventos

 MIL_minister_appointment_event.1.t:0 "Responsable de economía experimental"
 MIL_minister_appointment_event.1.d:0 "Se ha decidido la introducción experimental de una economía planificada en las futuras políticas económicas de Millennium Science School. Ahora debemos nombrar al responsable que dirigirá este sistema económico experimental y llevará adelante los nuevos programas económicos durante la administración vigente."
 MIL_minister_appointment_event.1.remove:0 "Tras el cambio en la dirección de Millennium Science School, debemos seleccionar a la persona que continuará y ejecutará el programa de economía planificada impulsado por la anterior administración."

 MIL_minister_appointment_event.2.t:0 "Director del Departamento de Desarrollo Económico"
 MIL_minister_appointment_event.2.t2:0 "Director de la Oficina de Diseño de Inversiones"
 MIL_minister_appointment_event.2.d:0 "Con la adopción de un sistema de economía de mercado en Millennium Science School y la privatización de varios sectores industriales, surge la necesidad de crear nuevos departamentos. Ahora estableceremos el Departamento de Desarrollo Económico para revisar y supervisar las políticas económicas de la escuela, y elegiremos a su responsable."
 MIL_minister_appointment_event.2.remove:0 "Tras el cambio en la dirección de Millennium Science School, debemos nombrar un nuevo director para el Departamento de Desarrollo Económico que continuará supervisando el desarrollo económico de la escuela."
 MIL_minister_appointment_event.2.d2:0 "Tras el cambio en la dirección de Millennium Science School, debemos nombrar un nuevo director para la Oficina de Diseño de Inversiones, quien supervisará las inversiones financieras de la escuela."

 MIL_minister_appointment_event_semina_a:0 "Hayase Yuuka: sus cálculos serán perfectos."
 MIL_minister_appointment_event_semina_b:0 "Ushio Noa: su memoria prodigiosa es de fiar."
 MIL_minister_appointment_event_semina_c:0 "Kurosaki Koyuki: confiemos esta vez en su ingenio."
 MIL_minister_appointment_event_veritas_a:0 "Kagami Chihiro: meticulosa y competente."
 MIL_minister_appointment_event_veritas_b:0 "Otose Kotama: que no escatime en medios para lograr el objetivo."
 MIL_minister_appointment_event_veritas_c:0 "Omagari Hare: su conocimiento enciclopédico es adecuado."
 MIL_minister_appointment_event_veritas_d:0 "Konuri Maki: su capacidad para resolver problemas destaca."

 MIL_minister_appointment_event_semina_exit:0 "Un momento… ya tenemos a esta persona asignada."

 MIL_event.1.t:0 "Convocatoria del Seminario"
 MIL_event.1.d:0 "Tras la victoria de Millennium Science School en la guerra contra Francia, se ha celebrado la primera reunión de medidas para resolver las crecientes quejas de los estudiantes debido a los continuos atentados de la resistencia francesa.\n\nA diferencia de la reunión de emergencia convocada apresuradamente durante la guerra, esta reunión ha sido organizada para ocuparse de los asuntos internos de la escuela y preparar medidas para los problemas venideros de Millennium."
 MIL_event.1.a:0 "¡Muévanse rápido!"
 MIL_event.2.t:0 "La Resistencia Francesa"
 MIL_event.2.d:0 "Los miembros del Seminario apoyan la postura dura de Rio, cansados de la interminable resistencia francesa, y abogan por una eliminación mediante la movilización general de estudiantes. Sin embargo, en la bancada opositora, Veritas muestra una mezcla de indignación hacia la resistencia y apoyo a las políticas moderadas de Himari.\n\nPor ello, aunque los miembros del seminario suelen apoyar la ‘operación de erradicación total’ propuesta por Rio, los estudiantes ordinarios de Millennium prefieren un enfoque conciliador para centrarse en sanar las heridas de la guerra."
 MIL_event.2.a:0 "Se adoptó la propuesta de Rio."
 MIL_event.2.b:0 "Himari logró revertir la opinión pública."
 MIL_event.3.t:0 "Pérdida de autoridad de Rio"
 MIL_event.3.d:0 "X"
 MIL_event.3.a:0 "Tsukatsuki Rio debe asumir la responsabilidad."
 MIL_event.4.t:0 "Destrucción del mercado francés"
 MIL_event.4.d:0 "\"La destrucción es la madre de la creación.\"\n\nPara absorber el mercado francés y operar nuestro familiar sistema informatizado y de órdenes centralizadas, primero debemos desmantelar el mercado francés.\n\nBajo la dirección de C&C, se procederá a amplias investigaciones económicas, suspensión temporal del franco, y detención de numerosos capitalistas.\n\nSi el caos se prolonga, podría perjudicar nuestra dominación, así que debemos reconstruir el mercado cuanto antes."
 MIL_event.4.a:0 "Crearemos un sistema mejor."
 MIL_event.5.t:0 "El problema de las ruinas"
 MIL_event.5.d:0 "Se han descubierto misteriosas ruinas alrededor de la escuela, probablemente trasladadas junto con Millennium durante el cataclismo. Se rumorea que esconden secretos que podrían decidir el destino de Millennium: podrían ser una biblioteca prohibida o un arma peligrosa. ¿Cómo debemos actuar?"
 MIL_event.5.a:0 "¡Destrúyanlo todo!"
 MIL_event.5.b:0 "Restringir el acceso."
 MIL_event.5.c:0 "Explorar personalmente."
 MIL_event.6.t:0 "Bombardeo de respuesta"
 MIL_event.6.d:0 "Una voz cortante sonó por la radio: \"¡Fuego!\"\n\nLos cañones en las colinas alrededor de Millennium rugieron y los proyectiles surcaron la noche. La comandante miró por sus prismáticos con tensión. \"¿Impacto?\"\n\n\"¡Impacto confirmado! Pero… ¿qué es eso?\" En la pantalla aparecía una luz extraña surgiendo de las ruinas. \"¡Detectada energía anómala! ¡Preparar segundo disparo!\" \"Procedan.\"\n\nLa segunda salva iluminó el cielo nocturno mientras un pilar de energía brotaba de las ruinas, cegador y sobrecogedor."
 MIL_event.6.a:0 "¿Qué está pasando?"
 MIL_event.7.t:0 "AL-1S"
 MIL_event.7.d:0 "Con el impacto del bombardeo, una chica abrió los ojos en lo profundo de las ruinas: AL-1S, la princesa de los dioses sin nombre. La cámara estalló en vapor cuando ella se incorporó con una mezcla de miedo y determinación en la mirada. \"¿Dónde… estoy?\" murmuró, mientras un resplandor rojo se encendía en sus ojos. \"Es peligroso… debo protegerme.\" Un torrente de energía brotó de su cuerpo, cubriendo las ruinas y deteniendo el bombardeo. Ascendió lentamente a la superficie, mirando al cielo nocturno: \"¿Quién soy…? ¿Y este lugar…?\" Un destello surgió entre el humo."
 MIL_event.7.a:0 "AL-1S, objetivo destruido."
 MIL_event.8.t:0 "La princesa sin nombre"
 MIL_event.8.d:0 "La princesa de los dioses sin nombre ha despertado. Aunque confundida y asustada, su mirada irradiaba una voluntad inquebrantable. De pie en las ruinas, imponente, su mera presencia dominaba el aire. A cada paso, el suelo temblaba levemente, y en sus ojos revivían memorias olvidadas. Cuando alzó la vista hacia Millennium, su semblante cambió: ya no era una niña confusa, sino una princesa poderosa. Su camino estaba decidido."
 MIL_event.8.a:0 "¡Viva!"
 MIL_event.9.t:0 "La espada de luz"
 MIL_event.9.d:0 "Tras el regreso de AL-1S, las máquinas autónomas idearon cómo aprovechar su poder. Así nació el proyecto ‘Supernova’: una espada de luz que concentrara su fuerza divina. Tras incontables pruebas, lograron crear la Supernova, un arma tan poderosa como un relicario, aunque a costa del sufrimiento de AL-1S y de sellar parte de su poder en la espada. Un logro grandioso y a la vez trágico."
 MIL_event.9.a:0 "No había otra opción."
 MIL_event.10.t:0 "Reactivación"
 MIL_event.10.d:0 "El crecimiento de Millennium se apoyó en la tecnología avanzada, la automatización y la robótica, pero su gran debilidad era su dependencia energética. Tras el cataclismo sufrimos una crisis sin precedentes, pero gracias a la creatividad y la razón superamos la catástrofe. Ahora es hora de reactivar las fábricas y que las máquinas vuelvan a recibirnos."
 MIL_event.10.a:0 "Inicio de operaciones."
 MIL_event.11.t:0 "El día de la reina"
 MIL_event.11.d:0 "El día de la reina ha llegado. AL-1S despertó y su poder tiñó el cielo con luces extrañas, mientras los robots se detenían reverentes. Los estudiantes miraban aterrados y el mundo reaccionó con pánico. La realidad misma empezó a retorcerse bajo su voluntad, y París se convirtió en su reino. El mundo entró en una nueva era: la era de la reina."
 MIL_event.11.a:0 "El mundo le pertenece."
 MIL_event.12.t:0 "Uso de la espada"
 MIL_event.12.d:0 "Frente al edificio del consejo, AL-1S levantó la Supernova. Un destello desgarró el cielo y los proyectiles enemigos se evaporaron. Con un solo movimiento destruyó medio edificio. Nadie pudo resistir: el cielo de Bélgica ahora le pertenece."
 MIL_event.12.a:0 "Comienza la destrucción."
 MIL_event.13.t:0 "Dominio de los centralistas"
 MIL_event.13.d:0 "Con la adopción de la economía marxista, los centralistas han ganado predominancia en el Seminario. [ROOT.GetLeader] debe decidir a quién apoyar."
 MIL_event.13.a:0 "Apoyar a los centralistas."
 MIL_event.13.b:0 "Son peligrosos y aventureros."
 MIL_event.14.t:0 "[FROM.FROM.GetName] limpiado"
 MIL_event.14.d:0 "Ya no quedan elementos anómalos en [FROM.FROM.GetName]. El ejército leal a la reina los ha reemplazado, construyendo una sociedad más avanzada."
 MIL_event.14.a:0 "Cumplido."
 MIL_event.15.t:0 "Aniquilación"
 MIL_event.15.d:0 "-Querido esposo León:\n\nHola. Soy Emma…\nAquí las cosas siguen igual: protestas, represión, sangre…\nPero estoy bien, tranquila, por nuestro bebé. Dicen que ahora reprimen a todos.\nEscribo desde un sótano. ¿Cuándo nos reuniremos? No olvides pensar un nombre para nuestro hijo.\nTe amo.\n-Tu esposa que te ama, Emma."
 MIL_event.15.a:0 "La carta nunca fue entregada."
 MIL_event.16.t:0 "El Arca"
 MIL_event.16.d:0 "Tras el regreso de AL-1S, las máquinas empezaron el proyecto ‘Arca de Atrahasis’: un espacio separado de la realidad, construido con toda la tecnología y recursos de Millennium. Un milagro en las afueras de París, donde la voluntad de AL-1S es la única ley. La mayor hazaña de nuestra historia."
 MIL_event.16.a:0 "Impresionante."
 MIL_event.17.t:0 "Resistencia francesa"
 MIL_event.17.d:0 "La resistencia francesa ha iniciado una insurrección para cooperar con nuestra guerra. Son un grupo que siempre ha defendido la resistencia total del pueblo francés."
 MIL_event.17.a:0 "Será útil en nuestra guerra."
 MIL_event.18.t:0 "Intrusión en las ruinas por el Club de Desarrollo de Juegos"
 MIL_event.18.d:0 "Se ha confirmado que el Club de Desarrollo de Juegos ha entrado en las ruinas restringidas. Se ha avistado a una chica desconocida junto a ellos, así que enviaremos a Hayase Yuuka para investigar y determinar si es enemiga."
 MIL_event.18.a:0 "Por ahora no intervengamos."
 MIL_event.19.t:0 "Fábrica abandonada"
 MIL_event.19.d:0 "Hemos encontrado una sospechosa fábrica abandonada, con rastros de sistemas de seguridad que ahora son chatarra. Debemos investigarla para descubrir posibles amenazas."
 MIL_event.19.a:0 "Podemos entrar."
 MIL_event.20.t:0 "Una chica"
 MIL_event.20.d:0 "En lo profundo de la vieja fábrica hallamos a una chica desnuda, de cabello gris y ojos azules, dormida en una silla. Durante su traslado despertó, identificándose como AL-1S: un avanzado humanoide."
 MIL_event.20.a:0 "Llevémosla al Seminario."
 MIL_event.21.t:0 "El problema de AL-1S"
 MIL_event.21.d1:0 "Tras confirmarse que el Club de Desarrollo de Juegos de Millennium se había colado sin autorización en las ruinas restringidas, la directiva del seminario, Hayase Yuuka, identificó a la supuesta nueva integrante del club, 'Tendo Aris', como algo muy diferente a una estudiante normal: se trata de un tipo de humanoide diseñado para el combate.\n\nPor ahora hemos separado a la estudiante del Club de Desarrollo de Juegos. Ahora debemos decidir su destino: devolverla al club con el que ha entablado relaciones amistosas, o mantenerla bajo estrecha vigilancia e inscribirla oficialmente en Millennium Science School."
 MIL_event.21.d2:0 "Debemos decidir qué hacer con AL-1S, el humanoide descubierto en las ruinas. Según la investigación, es una unidad diseñada para el combate, con notables capacidades de mando.\n\nPodemos integrarla en el seminario para aprovechar su potencial, o inscribirla como estudiante ordinaria bajo estrecha vigilancia."
 MIL_event.21.a:0 "'Tendo Aris'…"
 MIL_event.21.b:0 "Integrarla en el seminario."
 MIL_event.21.d:0 "Parece que C&C está interesada…" # por hacer — Aris maid general
 MIL_event.21.c:0 "Aceptarla como estudiante ordinaria bajo vigilancia."
 MIL_event.22.t:0 "La flecha hacia el cielo"
 MIL_event.22.d:0 "X"
 MIL_event.22.a:0 "3…2…1…"
 MIL_event.23.t:0 "Recepción de la transmisión"
 MIL_event.23.d:0 "X"
 MIL_event.23.a:0 "Hemos tenido éxito pese a todas las adversidades."
 MIL_event.24.t:0 "El destino de C&C"
 MIL_event.24.d:0 "El mito heroico de C&C cuenta con un gran apoyo entre los estudiantes de Millennium, lo cual socava la autoridad de la directiva. Debemos resolver esta situación: si bien su creciente prestigio daña nuestra legitimidad, integrarlos formalmente podría potenciar enormemente nuestras capacidades militares."
 MIL_event.24.a:0 "Aliémonos con ellos."
 MIL_event.24.b:0 "Aíslalos de la opinión pública, acabarán siendo olvidados."
 MIL_event.25.t:0 "El inicio de la segunda gran reunión de Millennium"
 MIL_event.25.d:0 "A diferencia de la primera, la segunda gran reunión comenzó sin la participación de Veritas. Convocada en medio de dudas sobre el liderazgo de Tsukatsuki Rio, se prevé que esta reunión defina la futura dirección del liderazgo del seminario."
 MIL_event.25.a:0 "La reunión comenzó bajo la dirección de Rio."
 MIL_event.25.b:0 "La reunión comenzó en medio del caos."
 MIL_event.26.t:0 "Tema: La resistencia francesa"
 MIL_event.26.d:0 "La resistencia francesa, tema ya discutido en la primera reunión, vuelve a ponerse sobre la mesa. Debemos decidir cómo responder a su continua subversión."
 MIL_event.26.a:0 "Enviemos a C&C."
 MIL_event.26.b:0 "Mantener el statu quo parece lo mejor."
 MIL_event.26.c:0 "Utilizaré mi guardia personal."
 MIL_event.27.t:0 "Tema: Reorganización de los clubes"
 MIL_event.27.d:0 "Con el restablecimiento del liderazgo del seminario, se propone devolver los clubes al control del seminario. Esto enfrentará resistencia, dado que tras el cataclismo se han acostumbrado a operar de manera semiautónoma."
 MIL_event.27.a:0 "Necesitamos una estructura más eficiente."
 MIL_event.27.b:0 "El seminario respetará la autonomía de los clubes."
 MIL_event.28.t:0 "Tema: Reurbanización del campus"
 MIL_event.28.d:0 "Tras nuestra expansión territorial en Francia, el campus central se ha vuelto caótico y poco estético. Rio propone reorganizarlo bajo la dirección del seminario, mientras que otros sugieren convertirlo en un evento participativo para los estudiantes."
 MIL_event.28.a:0 "Me haré cargo personalmente."
 MIL_event.28.b:0 "Dejemos que los estudiantes lo remodelen de forma autónoma."
 MIL_event.29.t:0 "Fin de la segunda gran reunión"
 MIL_event.29.d:0 "La segunda gran reunión ha concluido. Aunque se discutieron temas importantes como la resistencia, los clubes y la reurbanización, la autoridad de Rio parece haberse debilitado: las decisiones colegiadas del seminario comienzan a imponerse sobre su liderazgo."
 MIL_event.29.a:0 "Al menos terminó sin incidentes."
 MIL_event.30.t:0 "C&C ocupa la Torre Millennium"
 MIL_event.30.d:0 "Las reformas de Akeboshi Himari tras la revolución de Millennium no lograron estabilizar la academia. En medio de la creciente tensión, Neru Mikamo, líder de C&C, ha ocupado la Torre Millennium y exige, de forma contundente, que C&C tome las riendas para restaurar el orden. Aunque aceptar su propuesta resolvería temporalmente la crisis, generaría problemas a largo plazo. Rechazarla no parece conducir a un golpe inmediato, pero Himari debe decidir."
 MIL_event.30.a:0 "…Lo aprobaré."
 MIL_event.30.b:0 "No puedo permitir este golpe."
 MIL_event.31.t:0 "Propuesta de tratado tecnológico Millennium-Soviético"
 MIL_event.31.d:0 "Millennium Science School ha adoptado la economía marxista y nos propone un tratado tecnológico. Ofrecen intercambiar su avanzada tecnología por nuestra experiencia en colectivización socialista."
 MIL_event.31.a:0 "Una república hermana singular."
 MIL_event.31.b:0 "Rechazar."
 MIL_event.32.t:0 "Tratado tecnológico Millennium-Soviético: Aceptado"
 MIL_event.32.d:0 "La Unión Soviética ha aceptado nuestro tratado, lo que permitirá un valioso intercambio de conocimientos que beneficiará a ambas naciones."
 MIL_event.32.a:0 "Un avance interesante."
 MIL_event.33.t:0 "Tratado tecnológico Millennium-Soviético: Rechazado"
 MIL_event.33.d:0 "La Unión Soviética, aún cautelosa con Kivotos, ha declinado nuestro tratado, aunque aceptó establecer embajadas."
 MIL_event.33.a:0 "…"
 MIL_event.34.t:0 "Propuesta de Millennium"
 MIL_event.34.d:0 "Como parte de su estrategia de aislar a Francia, Millennium nos propone distanciarnos de ella a cambio de beneficios económicos y tecnológicos."
 MIL_event.34.a:0 "Una idea interesante."
 MIL_event.34.b:0 "Ni vale la pena considerarlo."
 MIL_event.35.t:0 "Propuesta aceptada por [FROM.GetName]"
 MIL_event.35.d:0 "[FROM.GetName] ha aceptado distanciarse de Francia y parece estar reduciendo su relación diplomática con ella."
 MIL_event.35.a:0 "Nuestro enemigo se ha vuelto."
 MIL_event.36.t:0 "Propuesta rechazada por [FROM.GetName]"
 MIL_event.36.d:0 "[FROM.GetName] ha rechazado nuestra estrategia de aislamiento y parece que fortalecerá sus lazos con Francia."
 MIL_event.36.a:0 "Qué lástima."
 MIL_event.37.t:0 "Tratado comercial Millennium-EE.UU."
 MIL_event.37.d:0 "Millennium nos propone un tratado comercial: nos venderán sus semiconductores de alta calidad a cambio de nuestro acero barato."
 MIL_event.37.a:0 "Un negocio prometedor."
 MIL_event.37.b:0 "No confío en ellos."
 MIL_event.38.t:0 "Tratado comercial Millennium-EE.UU.: Aceptado"
 MIL_event.38.d:0 "El tratado ha sido firmado y es elogiado como una gran armonía entre ambos mundos. Se espera que impulse nuestra industria."
 MIL_event.38.a:0 "Bien."
 MIL_event.39.t:0 "Tratado comercial Millennium-EE.UU.: Rechazado"
 MIL_event.39.d:0 "EE.UU. ha rechazado el tratado por desconfianza, aunque ha aceptado establecer embajadas."
 MIL_event.39.a:0 "¿Qué?"
 MIL_event.40.t:0 "Propuesta de recuperación de las islas británicas por Millennium"
 MIL_event.40.d:0 "X"
 MIL_event.40.a:0 "Es la última oportunidad."
 MIL_event.40.b:0 "Aún no es el momento."
 MIL_event.41.t:0 "Aceptación británica"
 MIL_event.41.d:0 "X"
 MIL_event.41.a:0 "¡El final de Kaiser Corporation!"
 MIL_event.42.t:0 "Rechazo británico"
 MIL_event.42.d:0 "X"
 MIL_event.42.a:0 "Ah, demonios."
 MIL_event.43.t:0 "División en la academia"
 MIL_event.43.d:0 "Justo después de concluir las órdenes de emergencia emitidas por la reunión de contramedidas de Millennium Science School, comenzaron a escucharse voces entre los estudiantes reclamando el fin de las 'medidas autoritarias'.\n\nAunque dichas órdenes resolvieron momentáneamente la situación, es evidente que han agravado la desconfianza y la ansiedad latente en la escuela.\n\nAhora que la desconfianza hacia la directiva autoritaria ha salido a la luz, tenemos una ardua tarea por delante para resolver todos estos problemas."
 MIL_event.43.a:0 "Un largo desafío por delante."
 MIL_event.44.t:0 "El destino de Rio"
 MIL_event.44.d:0 "X"
 MIL_event.44.a:0 "Llevarla a juicio público."
 MIL_event.44.b:0 "Forzar su dimisión."
 MIL_event.45.t:0 "Juicio público: Fracaso"
 MIL_event.45.d:0 "X"
 MIL_event.45.a:0 "Su elocuencia fue decisiva."
 MIL_event.46.t:0 "Dimisión de Tsukatsuki Rio"
 MIL_event.46.d:0 "X"
 MIL_event.46.a:0 "El camino más fácil."
 MIL_event.47.t:0 "Juicio público: Éxito"
 MIL_event.47.d:0 "X"
 MIL_event.47.a:0 "Ganamos."
 MIL_event.48.t:0 "¡Golpe de Koyuki!"
 MIL_event.48.d:0 "X"
 MIL_event.48.a:0 "El seminario reconoce unánimemente el liderazgo de Koyuki."
 MIL_event.48.b:0 "Koyuki fue arrestada en el acto."
 MIL_event.49.t:0 "Uso de Eridu"
 MIL_event.49.d:0 "Con la fortaleza ciudad Eridu ya reparada, debemos decidir si utilizarla para su propósito original de apoyo computacional a Abi Eschuch, o si dedicarla a nuevas doctrinas militares."
 MIL_event.49.a:0 "Usarla para Abi Eschuch."
 MIL_event.49.b:0 "Necesitamos nuevas doctrinas militares."
 MIL_event.50.t:0 "Fondos adicionales para la construcción de Eridu"
 MIL_event.50.d:0 "El departamento encargado ha solicitado fondos adicionales para evitar retrasos excesivos en la reconstrucción de Eridu."
 MIL_event.50.a:0 "Asignar presupuesto adicional."
 MIL_event.50.b:0 "No."
 MIL_event.51.t:0 "Propuesta del departamento de ingenieros"
 MIL_event.51.d:0 "El departamento de ingenieros ha propuesto cambios menores al proceso de reconstrucción para acelerar significativamente las obras."
 MIL_event.51.a:0 "Modificar el proceso."
 MIL_event.51.b:0 "Es imposible."
 MIL_event.52.t:0 "Fondos adicionales para Eridu"
 MIL_event.52.d:0 "El equipo de construcción de Eridu acaba de presentar un informe solicitando más presupuesto al seminario."
 MIL_event.53.t:0 "Malversación detectada"
 MIL_event.53.d:0 "Al investigar los movimientos sospechosos del equipo de construcción de Eridu, descubrimos una considerable corrupción."
 MIL_event.53.a:0 "Erradicar toda la corrupción."
 MIL_event.53.b:0 "Espera… quizá podamos aprovecharlo."
 MIL_event.54.t:0 "Conocimientos de construcción"
 MIL_event.54.d:0 "La experiencia adquirida en la construcción de Eridu ha acortado nuestros futuros procesos de reconstrucción."
 MIL_event.54.a:0 "Que continúe."
 MIL_event.55.t:0 "Aplicaciones de Eridu"
 MIL_event.55.d:0 "La reconstrucción de Eridu nos ha dotado de valiosos conocimientos para futuras construcciones a gran escala."
 MIL_event.55.a:0 "Excelente."
 MIL_event.56.t:0 "Accidente explosivo"
 MIL_event.56.d:0 "Durante las obras de Eridu, un error algorítmico de los robots de construcción provocó la caída de materiales inflamables, causando una fuerte explosión."
 MIL_event.56.a:0 "¡Maldita sea!"
 MIL_event.56.b:0 "Financiar la reparación."
 MIL_event.57.t:0 "Construcción sin problemas"
 MIL_event.57.d:0 "El informe indica que la reconstrucción de Eridu avanza sin contratiempos."
 MIL_event.58.t:0 "Ejército Francés Libre"
 MIL_event.58.d:0 "La resistencia francesa, reorganizada como fuerza colaboradora para la liberación, ha completado su integración. Permanecerán activos incluso tras la liberación de Francia."
 MIL_event.58.a:0 "Dales la orden de partir."
 MIL_event.59.t:0 "Petición de integración de la resistencia"
 MIL_event.59.d:0 "La resistencia que nos asistió en la guerra quiere integrarse formalmente al ejército regular. Tenemos la cadena de mando necesaria para hacerlo."
 MIL_event.59.a:0 "Disolver y absorberlos."
 MIL_event.59.b:0 "Aún los necesitamos como están."
 MIL_event.60.t:0 "Guerra con Francia"
 MIL_event.60.d:0 "¡Ha comenzado la guerra contra Francia!\n\nMientras dure, el nivel de resistencia aumentará progresivamente, por lo que deberemos realizar operaciones constantes para reducirla. Eso sí, con el tiempo la escalada se ralentizará y no nos acosará eternamente.\n\nAdemás, [FRA.GetName] cuenta con varios beneficios especiales y habilidades para recuperar Millennium."
 MIL_event.60.a:0 "¡Pues que tengan buena suerte!"
 MIL_event.60_tt:0 "\nPor cierto, Francia ha perdido su territorio continental. Si resistimos durante algunos años, probablemente se derrumbarán por las revueltas en sus colonias."
 MIL_event.61.t:0 "El vacío"
 MIL_event.61.d:0 "Básicamente, Millennium ha quedado completamente en silencio."
 MIL_event.61.a:0 "..."
 MIL_event.61_tt:0 "Las risas y los pasos de la gente, el ruido de los motores y los trenes… ya no existen.\n¿Qué queda ahora?"
 MIL_event.62.t:0 "La reina solitaria"
 MIL_event.62.d:0 "Sólo quedan la reina y las máquinas."
 MIL_event.62.a:0 "¿Mi reina…?"
 MIL_event.62_tt:0 "Ahora, aquí sólo queda la reina. Los estudiantes y los ciudadanos desaparecieron hace mucho."

 MIL_event.63.t:0 "Demanda de la Línea Maginot por parte de [FROM.GetName]"
 MIL_event.63.d:0 "[FROM.GetName] ha exigido la cesión de la Línea Maginot alegando derechos territoriales y su necesidad de defensa en la región oriental. Nuestra dirección está indignada, pero puede que no tengamos otra opción dadas las circunstancias internacionales."
 MIL_event.63.a:0 "No tenemos otra alternativa."
 MIL_event.63.b:0 "Ridículo."

 MIL_event.64.t:0 "[FROM.GetName] rechaza la cesión de la Línea Maginot"
 MIL_event.64.d:0 "[FROM.GetName] se ha negado a ceder la Línea Maginot, a pesar de nuestra reclamación territorial y su importancia estratégica."
 MIL_event.64.a:0 "Entonces es la guerra."
 MIL_event.64.b:0 "Aún no es el momento."

 MIL_event.65.t:0 "Propuesta de estado independiente de [FROM.GetName]"
 MIL_event.65.d:0 "[FROM.GetName] nos ha enviado un comunicado expresando su preocupación por nuestra propuesta de federalización de Kivotos, y solicitando mantener su academia como un estado independiente. Debemos responder a su petición."
 MIL_event.65.a:0 "Tienen lo necesario para ser un aliado."
 MIL_event.65.b:0 "No hay excepciones."

 MIL_event.66.t:0 "[FROM.GetName] acepta nuestra independencia"
 MIL_event.66.d:0 "Tras anunciar que no participaríamos en la federación de Kivotos, [FROM.GetName] aceptó mantener nuestra autonomía y garantizó relaciones igualitarias incluso tras la formación de la federación."
 MIL_event.66.a:0 "Un buen trato."

 MIL_event.67.t:0 "[FROM.GetName] rechaza nuestra independencia"
 MIL_event.67.d:0 "Tras anunciar que no participaríamos en la federación de Kivotos, [FROM.GetName] rechazó nuestra propuesta."
 MIL_event.67.a:0 "Entonces no podremos mantenernos como aliados."

 MIL_event.68.t:0 "Rebelión de la Resistencia Francesa aplastada"
 MIL_event.68.d:0 "Hemos frustrado un gran levantamiento de la Resistencia Francesa antes de que pudiera llevarse a cabo, tras descubrir sus planes y capturar a sus líderes mediante un ataque sorpresa de C&C."
 MIL_event.68.a:0 "Otra resistencia erradicada."

 MIL_conflict_event.2.t:0 "Electricidad cortada"
 MIL_conflict_event.2.d:0 "Opositores dentro de Millennium cortaron la electricidad de la Torre Millennium como protesta. La torre sumida en la oscuridad nos hace temer que no será la última vez."
 MIL_conflict_event.2.a:0 "¡Malditos…!"
 MIL_conflict_event.2.b:0 "Empiecen la reparación ahora mismo."

 MIL_conflict_event.3.t:0 "Debate acalorado"
 MIL_conflict_event.3.d:0 "En una sala de la Torre Millennium estalló una discusión tan intensa que terminó con un tiroteo. Por suerte no hubo heridos, pero nuestra autoridad ha quedado dañada."
 MIL_conflict_event.3.a:0 "Por favor, basta."
 MIL_conflict_event.3.b:0 "Castigar a los implicados."

 MIL_conflict_event.4.t:0 "El seminario gana confianza"
 MIL_conflict_event.4.d:0 "Pese a las intrigas de Veritas, esta vez el seminario salió victorioso. Veritas ha quedado debilitada, lo cual favorece nuestras actividades."
 MIL_conflict_event.4.a:0 "Bien."
 MIL_conflict_event.4.b:0 "Aprovechemos para resolver más problemas."

 MIL_conflict_event.5.t:0 "Autoridad del seminario cuestionada"
 MIL_conflict_event.5.d:0 "Una denuncia anónima en internet provocó una campaña de firmas estudiantil contra la alta dirección. La oposición ha crecido rápidamente y debemos actuar."
 MIL_conflict_event.5.a:0 "Vaya…"
 MIL_conflict_event.5.b:0 "Liderar la opinión en contra."

 MIL_conflict_event.6.t:0 "Protesta estudiantil"
 MIL_conflict_event.6.d:0 "Las políticas autoritarias del seminario han desatado protestas estudiantiles. Marchan por el campus denunciando los abusos y su número crece día a día."
 MIL_conflict_event.6.a:0 "Vaya…"
 MIL_conflict_event.6.b:0 "Negociar con ellos."

 MIL_conflict_event.7.t:0 "Debate sobre mecánica cuántica"
 MIL_conflict_event.7.d:0 "Muchos cuestionan los proyectos de investigación en mecánica cuántica, tachándolos de contradictorios e ineficaces. Ya se pide reducir su presupuesto, y el seminario ha empezado a defender la investigación con pruebas."
 MIL_conflict_event.7.a:0 "Pero la luz es onda y partícula."

 MIL_conflict_event.8.t:0 "El teorema de imposibilidad"
 MIL_conflict_event.8.d:0 "Un grupo publicó una larga tesis sobre el 'teorema de imposibilidad', causando caos en toda Millennium. La tesis demuestra que no es posible evaluar el bienestar social con un sistema democrático ideal. Los manifestantes la usan para criticar la administración, y el desorden podría empeorar."
 MIL_conflict_event.8.a:0 "Increíble, pero cierto."
 MIL_conflict_event.8.b:0 "Publicar otra tesis sobre dictadura racional."

 MIL_mechanical_event.1.t:0 "Protesta contra el reclutamiento de humanos"
 MIL_mechanical_event.1.desc.a:0 "En las calles han surgido protestas exigiendo reemplazar humanos en el frente por robots. Aunque minoritarios, si los ignoramos podría propagarse."
 MIL_mechanical_event.1.desc.b:0 "La protesta ha crecido: ya están armados y muchos soldados también se les unen."
 MIL_mechanical_event.1.desc.c:0 "Tras cesar la producción de autómatas, la protesta contra enviar civiles al frente ha ganado fuerza. Si no actuamos, hasta nuestros soldados podrían rebelarse."
 MIL_mechanical_event.1.a:0 "Garantizar más producción de robots."
 MIL_mechanical_event.1.b:0 "Que sea como ellos quieren."
 MIL_mechanical_event.1.c:0 "Reanudar la producción."
 MIL_mechanical_event.1.d:0 "¡No negociamos con protestas!"

 MIL_resistance_control.1.t:0 "¡Pérdida del norte!"
 MIL_resistance_control.1.d:0 "Tras la guerra, perdimos el control del norte de Millennium, nuestro corazón tecnológico."
 MIL_resistance_control.1.a:0 "Nos arrancaron el corazón."

 MIL_resistance_control.2.t:0 "¡Pérdida del este!"
 MIL_resistance_control.2.d:0 "Perdimos el control del este."
 MIL_resistance_control.2.a:0 "Maldita sea."

 MIL_resistance_control.3.t:0 "¡Pérdida del oeste!"
 MIL_resistance_control.3.d:0 "Perdimos el control del oeste."
 MIL_resistance_control.3.a:0 "Maldita sea."

 MIL_resistance_control.4.t:0 "¡Pérdida del sureste!"
 MIL_resistance_control.4.d:0 "Perdimos el control del sureste."
 MIL_resistance_control.4.a:0 "Maldita sea."

 MIL_resistance_control.5.t:0 "¡Pérdida del sur!"
 MIL_resistance_control.5.d:0 "Perdimos el control del sur."
 MIL_resistance_control.5.a:0 "Maldita sea."

 MIL_resistance_control.6.t:0 "¡Recuperación del norte!"
 MIL_resistance_control.6.d:0 "Recuperamos el control del norte."
 MIL_resistance_control.6.a:0 "Volvimos."

 MIL_resistance_control.7.t:0 "¡Recuperación del este!"
 MIL_resistance_control.7.d:0 "Recuperamos el control del este."
 MIL_resistance_control.7.a:0 "Volvimos."

 MIL_resistance_control.8.t:0 "¡Recuperación del oeste!"
 MIL_resistance_control.8.d:0 "Recuperamos el control del oeste."
 MIL_resistance_control.8.a:0 "Volvimos."

 MIL_resistance_control.9.t:0 "¡Recuperación del sureste!"
 MIL_resistance_control.9.d:0 "Recuperamos el control del sureste."
 MIL_resistance_control.9.a:0 "Volvimos."

 MIL_resistance_control.10.t:0 "¡Recuperación del sur!"
 MIL_resistance_control.10.d:0 "Recuperamos el control del sur."
 MIL_resistance_control.10.a:0 "Volvimos."

 MIL_fucking_nuke_drop.1.t:0 "Nuclear sobre [FROM.FROM.GetName]"
 MIL_fucking_nuke_drop.1.d:0 "X"
 MIL_fucking_nuke_drop.1.a:0 "..."
 MIL_fucking_nuke_drop.1.b:0 "No quiero ver el evento de la bomba nuclear."


