# Intro
 MIL_country_intro_header: "Academia de la Razón y la Lógica"
 MIL_country_intro_content: "Junto con Trinity y Gehenna, es una de las tres grandes academias de Kivotos, y la que más valora la razón y la tecnología. Aunque su historia es más corta que la de Trinity o Gehenna, su influencia es tan grande que se extiende por todo Kivotos. Es una academia altamente avanzada en ciencia e investigación, hasta el punto de que toda nueva tecnología e innovación en Kivotos parece originarse aquí.\n\nEl consejo estudiantil de Millennium, conocido como Semina, comenzó como un pequeño club de investigación dedicado a resolver los 'Siete Problemas'. A partir de sus experimentos y validaciones, surgieron ramas especializadas de investigación y organización que se convirtieron en los clubes actuales de Millennium. Puede decirse que Semina es el origen de todos los clubes y de la propia academia.\n\nCuando la academia sufrió un fenómeno sobrenatural y desembarcó en un nuevo mundo, lo primero que vio fueron extraños con cócteles molotov en sus manos. A sus ojos, la academia era una invasora interdimensional y, aunque se resistieron a su manera, la diferencia tecnológica era insalvable y fueron arrasados.\nLos soldados que no se rindieron se escondieron entre los civiles y continuaron sus ataques terroristas contra la academia, convirtiendo la zona en un área restringida.\n\n§YDesarrollado por: SKSKle§!"
 MIL_guide: "\nComo Presidenta de Semina\n£white_dot Gana la lucha por el poder en Millennium\n£white_dot Elimina a la resistencia francesa\n£white_dot Resuelve el problema de las ruinas\n£white_dot Renace como la Big Sister\n\n\nComo Jefa de Veritas\n£white_dot Gana la lucha por el poder en Millennium\n£white_dot Resuelve el problema de la resistencia francesa\n£white_dot Resuelve el problema de las ruinas\n£white_dot Cumple tu deber como la genio enfermiza y adorable\n\n\n§RLas olas tormentosas se acercan a Millennium.§!"
# Descripción del país
 MIL_GATHERING_STORM_DESC:0 "Millennium Science School, dirigida por la Big Sister Rio, se vio obligada a ocupar territorio francés debido a un fenómeno inesperado de la Gran Guerra. En medio del caos, Millennium ocupó rápidamente Francia, mientras que su gobierno y algunos ciudadanos huyeron al exilio en Argelia.\n\nTras la ocupación, Millennium se enfrenta a continuas rebeliones internas y amenazas externas. La resistencia en los territorios franceses no cesa, y en Argelia esperan su oportunidad para contraatacar."

