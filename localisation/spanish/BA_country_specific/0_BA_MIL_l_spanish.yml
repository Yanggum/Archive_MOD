# 뉴스 사건
 MIL_news.1.t: "Victoria de $fldh$ en la lucha por el poder"
 MIL_news.1.desc: "La guerra entre Millennium y Francia tras el fenómeno de la Gran Guerra terminó con la victoria de Millennium. El gobierno francés partió al exilio, pero los ciudadanos franceses no pudieron hacerlo. En la reunión de emergencia de Millennium se desató un acalorado debate sobre cómo resolver la cuestión de los ciudadanos franceses, y finalmente $fldh$ salió victoriosa en la discusión.\n\nAdemás, su liderazgo demostrado en el debate le valió ser elegida presidenta de $MIL_seminar_character$. La noticia de que $fldh$, quien aboga por un férreo control, ha tomado el mando absoluto de $MIL_seminar_character$ no será bien recibida por la resistencia francesa."
 MIL_news.1.a: "Esto es lo más racional."
 MIL_news.1.b: "¿Podrá ella liderar bien a Millennium?"
 MIL_news.1.c: "Interesante."
 MIL_news.2.t: "Victoria de $MIL_Himari$ en la lucha por el poder"
 MIL_news.2.desc: "La guerra entre Millennium y Francia tras el fenómeno de la Gran Guerra terminó con la victoria de Millennium. El gobierno francés partió al exilio, pero los ciudadanos franceses no pudieron hacerlo. En la reunión de emergencia de Millennium se desató un acalorado debate sobre cómo resolver la cuestión de los ciudadanos franceses, y contra todo pronóstico $MIL_Himari$ salió victoriosa en la discusión.\n\nA diferencia de $fldh$, que abogaba por un férreo control, $MIL_Himari$ propuso un enfoque conciliador hacia los ciudadanos franceses. En consecuencia, $MIL_seminar_character$ reconoció el liderazgo de Akeboshi Himari y la eligió presidenta de $MIL_seminar_character$."
 MIL_news.2.a: "¡Es hora de que la súper genio enfermiza y adorable hacker brille!"
 MIL_news.3.t: "$fldh$ destituida"
 MIL_news.3.desc: "A medida que los planes autoritarios y peligrosos de $fldh$ continuaron, acabó perdiendo la confianza de $MIL_seminar_character$ y su base de apoyo se derrumbó. Como resultado, se presentó una moción de censura en $MIL_seminar_character$, que fue aprobada por amplia mayoría, destituyendo así a $fldh$ de su cargo de presidenta.\n\nActualmente el puesto de presidenta está vacante, y se espera que $MIL_seminar_character$ asuma las funciones interinamente. Sin embargo, las discusiones sobre el nuevo liderazgo continúan, y la forma en que se reequilibrará el poder interno sigue siendo incierta."
 MIL_news.3.a: "\"Yo... solo quería hacerlo bien...\""
 MIL_news.3.b: "Era de esperarse."
 MIL_news.3.c: "¿También aplican el parlamentarismo aquí?"
 MIL_news.4.t: "Live especial de Hatsune Miku"
 MIL_news.4.desc: "A dos semanas del concierto de Hatsune Miku, se fabricó un androide humanoide a la medida gracias a la tecnología de [MIL.GetName]. Sin embargo, la adaptación al nuevo cuerpo no fue fácil, y tanto el habla como el canto resultaban inestables, al punto de que se temió un retraso del live especial. Pero tras un entrenamiento constante, logró superar los problemas y el espectáculo se celebró como estaba previsto.\n\nLas canciones del concierto ya estaban decididas, pero al final sonó una pieza inesperada: una canción compuesta por la propia Hatsune Miku para sus fans. Entre vítores y ovaciones que duraron casi un minuto, la canción concluyó. Finalmente, Hatsune Miku se despidió, poniendo fin a un concierto lleno de emoción."
 MIL_news.4.a: "¡Porque soy 'Hatsune Miku', quien transmite canciones con sinceridad a quienes escuchan!"
 MIL_news.4.b: "¡Eso me ha gustado!"
