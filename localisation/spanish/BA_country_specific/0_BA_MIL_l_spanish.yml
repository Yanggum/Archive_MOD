#밀레니엄 중점
 MIL_SEMINA:0 "Convocar al Seminario"
 MIL_SEMINA_desc:0 "Tras la Gran Transposición, para evaluar la situación la presidenta Rio decidió convocar a los miembros del Seminario."
 MIL_tower_recovery:0 "Suministro de energía a la Torre Millennium"
 MIL_tower_recovery_desc:0 "Para reanudar el suministro interrumpido debido a los acontecimientos, se activó un generador de emergencia para ganar algo de tiempo."
 MIL_network_recovery:0 "Restaurar el sistema de red"
 MIL_network_recovery_desc:0 "Aunque tomó tiempo, logramos restaurar el sistema de red utilizando la energía de emergencia."
 MIL_resistance_resolution:0 "Resolver la resistencia"
 MIL_resistance_resolution_desc:0 "Se confirmó la resistencia local contra nosotros, los forasteros, y nos amenazan. Sin embargo, la presidenta Rio y Himari de Veritas tienen opiniones opuestas sobre cómo manejar esta situación."
 MIL_east_resistance_resolution:0 "Sofocar resistencia en el sur"
 MIL_east_resistance_resolution_desc:0 "Las fuerzas de resistencia concentradas en el sur amenazan a los estudiantes de Millennium. Debemos protegerlos mediante una operación de limpieza."
 MIL_South_resistance_resolution:0 "Sofocar resistencia en el este"
 MIL_South_resistance_resolution_desc:0 "Las fuerzas de resistencia del este están tan cerca que amenazan a la Torre Millennium. Debemos eliminarlos para neutralizar la amenaza."
 MIL_french_problem:0 "El problema francés"
 MIL_french_problem_desc:0 "Los franceses locales por ahora están tranquilos, pero son un factor a vigilar. Depende de nosotros decidir cómo tratarlos."
 MIL_complete:0 "Fin de la emergencia"
 MIL_complete_desc:0 "Con una rápida respuesta, hemos superado la emergencia. Ahora es momento de prepararnos para avanzar."
 MIL_diplomatic_with_SOV:0 "Tratado diplomático con la URSS"
 MIL_diplomatic_with_SOV_desc:0 "Aunque la Unión Soviética tiene diversos problemas socialistas, necesitamos un nuevo aliado. Ampliaremos las relaciones con la URSS a través de la cooperación económico-social."
 MIL_join_SOV:0 "Unirse al Komintern"
 MIL_join_SOV_desc:0 "Al unirnos al Komintern, entraremos en el escenario de la revolución internacional y aseguraremos nuestra influencia."
 MIL_administrative_reorganization:0 "Reorganización administrativa"
 MIL_administrative_reorganization_desc:0 "Por estabilidad administrativa y por la causa ideológica, los burócratas con tendencias antisocialistas deben ser reemplazados."
 MIL_union_representation_act:0 "Ley de representación sindical"
 MIL_union_representation_act_desc:0 "Tras la guerra Francia-Millennium, los sindicatos fueron ignorados. Garantizar su voz y cargos en el gobierno reforzará los derechos de los trabajadores."
 MIL_agricultural_collectivization:0 "Colectivización agrícola"
 MIL_agricultural_collectivization_desc:0 "Los campesinos propietarios tienen valores pequeñoburgueses. Transferiremos toda la tierra a los consejos regionales para garantizar el sustento y convertir a los campesinos en trabajadores."
 MIL_curriculum_organization:0 "Organizar el currículo educativo"
 MIL_curriculum_organization_desc:0 "Incorporaremos formalmente la ideología marxista, basada en materialismo dialéctico, en el currículo escolar para sembrar las bases del socialismo."
 MIL_council_focus:0 "Consejos obreros"
 MIL_council_focus_desc:0 "Los trabajadores organizarán consejos para administrar las regiones, creando una administración más democrática y limitando los excesos del comité central."
 MIL_hostile_to_SOV:0 "Oposición a la URSS"
 MIL_hostile_to_SOV_desc:0 "La URSS se ha desviado del marxismo e implementa un socialismo insostenible que genera abusos e inestabilidad. Nosotros tomaremos un camino distinto."
 MIL_with_SHE:0 "Alianza con S.C.H.A.L.E."
 MIL_with_SHE_desc:0 "La administración estudiantil caída y la IA A.R.O.N.A. han establecido un sistema socialista basado en IA. Nos uniremos a ellos para llevar a cabo la revolución de Kivotos."
 MIL_ourselves:0 "Revolución Millennium"
 MIL_ourselves_desc:0 "Hanaoka Yuzu propone un nuevo paradigma comunista basado en ciencia y experimento. Su facción reformista desmantelará la vieja oligarquía escolar." 
 MIL_enemy_of_the_revolution:0 "Enemigos de la revolución"
 MIL_enemy_of_the_revolution_desc:0 "Millennium está rodeada por estados reaccionarios. Debemos unirnos para preparar una gran lucha."
 MIL_concentration_of_power:0 "Concentración de poder" 
 MIL_concentration_of_power_desc:0 "Para establecer control económico, reforzaremos el poder social mediante una administración más amplia."
 MIL_international_industry:0 "Industria internacional"
 MIL_international_industry_desc:0 "La cooperación económica con repúblicas hermanas traerá mayor desarrollo técnico e industrial."
 MIL_special_economic_zone:0 "Zonas económicas especiales"
 MIL_special_economic_zone_desc:0 "El crecimiento económico se ha estancado. Crearemos zonas especiales con impuestos bajos e infraestructura favorable para reactivar la economía."
 MIL_NEP:0 "Nueva Política Económica"
 MIL_NEP_desc:0 ""
 MIL_partial_market_opening:0 "Apertura parcial del mercado"
 MIL_partial_market_opening_desc:0 ""
 MIL_control_of_key_industries:0 "Control de industrias clave"
 MIL_control_of_key_industries_desc:0 ""
 MIL_agricultural_management_act:0 "Ley de gestión agrícola"
 MIL_agricultural_management_act_desc:0 ""
 MIL_millennium_central_bank:0 "Banco Central Millennium"
 MIL_millennium_central_bank_desc:0 "Actualmente la economía la gestiona el Seminario, pero es ineficiente. Crearemos un Banco Central con expertos para administrar la economía eficientemente."
 MIL_acceptance_of_the_franc:0 "Aceptar el franco"
 MIL_acceptance_of_the_franc_desc:0 "El franco es familiar para los franceses. Adoptarlo ganará su simpatía y acelerará la estabilización."
 MIL_market_liberation:0 "Liberalización del mercado"
 MIL_market_liberation_desc:0 ""
 MIL_market_control:0 "Control de la inflación"
 MIL_market_control_desc:0 "Nos concentramos tanto en otros problemas que descuidamos la inflación. Reduciremos la emisión monetaria para resolverlo."
