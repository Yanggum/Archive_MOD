 MIL_millenium_engineer_department_war_bureau_desc:0 ""
 MIL_ruin_investigation:0 "Investigación de ruinas"
 MIL_ruin_investigation_desc:0 ""
 MIL_AL_1S_problem:0 "Problema AL-1S"
 MIL_AL_1S_problem_desc:0 ""
 MIL_automation_economy:0 "Economía automatizada"
 MIL_automation_economy_desc:0 "Una economía gestionada por personas es demasiado ineficiente e inestable. Desde antes de la Gran Transposición, Millennium Science School ya operaba su administración escolar a través de fábricas y transporte automatizados. Nos esforzaremos por reconstruir un sistema económico automatizado eficiente como antes."
 MIL_consumer_goods_production:0 "Enfoque en la industria civil"
 MIL_consumer_goods_production_desc:0 "La guerra debe evitarse, es una actividad improductiva. Aplicaremos primero la tecnología de Millennium a la industria civil para fomentar el crecimiento económico y ampliar la brecha con otros países."
 MIL_heavy_industry_focus:0 "Aumento del gasto en defensa"
 MIL_heavy_industry_focus_desc:0 "Los enemigos internos y externos nos siguen amenazando. Invertiremos prioritariamente en defensa, aplicando la tecnología de Millennium a la industria militar para aplastar las amenazas futuras."
 MIL_precision_production_planning:0 "Planificación de producción precisa"
 MIL_precision_production_planning_desc:0 "Puede que el trabajo del Seminario se sobrecargue, pero debemos formar equipos de producción precisa y establecer planes para construir una economía eficiente e ideal."
 MIL_expanding_the_base:0 "Ampliación de la base tecnológica"
 MIL_expanding_the_base_desc:0 "Al examinar la estructura industrial francesa, descubrimos que la brecha tecnológica y de comercialización era mayor de lo esperado. Para operar como antes nuestras instalaciones automatizadas, debemos mejorar las deficientes infraestructuras locales y unificar los estándares industriales fragmentados por la Gran Transposición."
 MIL_cogwheel_society:0 "Sociedad engranada"
 MIL_cogwheel_society_desc:0 "Como los engranajes de un reloj, diseñaremos meticulosamente todas las partes de la sociedad para mantener el equilibrio entre oferta y demanda."
 MIL_mechanized_army:0 "Ejército mecanizado"
 MIL_mechanized_army_desc:0 "Para resolver más desafíos y mantener nuestra escuela, necesitamos más y mejores suministros militares. Dominaremos la superioridad cualitativa y cuantitativa desplegando continuamente las garras de acero y las reinas del campo de batalla. ¡Todos se rendirán ante nuestro ejército disciplinado y veloz!"
 MIL_automation_industry:0 "Industria automatizada"
 MIL_automation_industry_desc:0 "Los productos fabricados por franceses fallan con frecuencia y la mayoría de los trabajadores no son amistosos con nosotros, además podrían rebelarse en cualquier momento. Como antes de la Gran Transposición, sustituiremos a los trabajadores por máquinas para automatizar la industria."
 MIL_near_future_demand_analysis:0 "Análisis de demanda a corto plazo"
 MIL_near_future_demand_analysis_desc:0 "Analizaremos a los consumidores e invertiremos en los productos con mayor previsión de éxito para realizar inversiones eficientes."
 MIL_customized_production_system:0 "Enfoque en la producción personalizada"
 MIL_customized_production_system_desc:0 "Estableceremos una línea de producción personalizada. Aunque podría ser difícil producir en masa a corto plazo, podremos gestionar la economía con gran flexibilidad."
 MIL_economy_control:0 "Economía controlada"
 MIL_economy_control_desc:0 "Tenemos capacidad para llevar a cabo programas de economía planificada superiores. La dirección de nuestra escuela reforzará su control económico, aumentando así el control del mercado de Millennium."
 MIL_destroy_french_market:0 "Reestructuración de la industria"
 MIL_destroy_french_market_desc:0 ""
 MIL_market_flexibility:0 "Flexibilidad del mercado"
 MIL_market_flexibility_desc:0 "A pesar de varios factores adversos, el mercado local ha demostrado su utilidad al corregir sus propios problemas. Aceptaremos el capitalismo francés e implementaremos una economía de mercado."
 MIL_semina_rework:0 "Reforma del Seminario"
 MIL_semina_rework_desc:0 ""
 MIL_capitalist_conciliation:0 "Conciliación con los capitalistas"
 MIL_capitalist_conciliation_desc:0 ""
 MIL_market_subordination:0 "Control de la economía sumergida"
 MIL_market_subordination_desc:0 "Para la victoria del sistema escolar es esencial controlar la economía clandestina. Subordinaremos la economía francesa a nosotros y aseguraremos el impulso para nuestros programas industriales."
 MIL_mixed_economy:0 "Creación del Departamento de Desarrollo Económico"
 MIL_mixed_economy_desc:0 ""
 MIL_economic_plan:0 "Plan de desarrollo económico"
 MIL_economic_plan_desc:0 ""
 MIL_command_to_chaebol:0 "Orden a los conglomerados"
 MIL_command_to_chaebol_desc:0 "Haremos que ellos gestionen la economía para aliviar la carga sobre el Seminario y reforzar nuestro control económico. Es hora de demostrar quién tiene el verdadero control en Francia."
 MIL_backing_capitalist:0 "Apoyo a los capitalistas"
 MIL_backing_capitalist_desc:0 "La mayoría de los capitalistas franceses saben a quién aferrarse para obtener beneficios. Podemos hacer que traicionen a su patria con facilidad."
 MIL_centralized_economy:0 "Integración económica centralizada"
 MIL_centralized_economy_desc:0 ""
 MIL_economicintervention:0 "Reconstrucción del mercado francés"
 MIL_economicintervention_desc:0 "Tras la guerra civil, la economía de Millennium está colapsada: la escasez ha hecho que los bienes básicos sean raros, los contrabandistas proliferan y la inflación aumenta. Pero ahora es diferente. Reactivaremos fábricas y cadenas de suministro para solucionarlo."
 MIL_start_economy:0 "Restauración de la base industrial"
 MIL_start_economy_desc:0 "Durante la lucha por la supervivencia de Francia y la escuela, la industria se derrumbó. Para la continuidad de la escuela, debemos restaurarla."
 MIL_railway_connection:0 "Reconexión ferroviaria"
 MIL_railway_connection_desc:0 "Durante la Gran Transposición, la red ferroviaria quedó destrozada, y la guerra Francia-Millennium la empeoró aún más. Nos esforzaremos por resolver estos problemas."
 MIL_state_capitalism:0 "Capitalismo estatal"
 MIL_state_capitalism_desc:0 "El capitalismo estatal es una política económica que combina libertad individual y desarrollo económico. La adoptaremos para construir una economía estable y democrática."
 MIL_megacorp:0 "Economía del futuro"
 MIL_megacorp_desc:0 ""
 MIL_expansion_of_financial_industry:0 "Expansión del sector financiero"
 MIL_expansion_of_financial_industry_desc:0 ""
 MIL_cryptocurrency:0 "Criptomoneda"
 MIL_cryptocurrency_desc:0 "La criptomoneda era la moneda utilizada en Millennium antes de la Gran Transposición. La readoptaremos para gestionar la economía con mayor eficiencia y rapidez."
 MIL_city_investment:0 "Mejoras en tecnología militar"
 MIL_city_investment_desc:0 ""
 MIL_facility_modernization:0 "Modernización de instalaciones"
 MIL_facility_modernization_desc:0 ""
 MIL_millennium_economy:0 "Economía Millennium"
 MIL_millennium_economy_desc:0 ""
 MIL_soviet_model:0 "Modelo soviético"
 MIL_soviet_model_desc:0 "La Unión Soviética, desde su fundación, ideó una economía planificada en la que el Estado posee y planifica todo, y la gestionó eficazmente. Tomaremos esto como referencia para impulsar en Millennium una economía planificada más completa y desarrollada."
 MIL_redistribution_wealth:0 "Redistribución de la riqueza"
 MIL_redistribution_wealth_desc:0 "Confiscaremos toda la riqueza asimétrica de los capitalistas franceses, garantizando un nivel de vida básico al mismo tiempo que la usamos como base para una nueva reforma económica."
 MIL_give_orders_to_workshop:0 "Introducción de la economía planificada"
 MIL_give_orders_to_workshop_desc:0 "Millennium Science School tiene capacidad suficiente para planificar toda la economía, y la utilizaremos. A partir de órdenes básicas, construiremos gradualmente un sistema económico planificado más complejo y sistemático."
 MIL_communist_society:0 "Sociedad comunista"
 MIL_communist_society_desc:0 "Nuestra avanzada tecnología, aunque asimétrica, si se usa bien puede acercarse al ideal de una 'sociedad comunista'. Construiremos teorías socialistas más desarrolladas y transformaremos Millennium Science School en un sistema económico del futuro."
 MIL_intensified_disagreements:0 "Profundización de los desacuerdos"
 MIL_intensified_disagreements_desc:0 "Recientemente, debido a la inestabilidad de los franceses en la escuela, los desacuerdos entre ellas se están intensificando."
 MIL_Rio_intensified:0 "Agenda de Rio"
 MIL_Rio_intensified_desc:0 "La presidenta estudiantil de Millennium Science School cree que la mejor forma de mantener Millennium es reprimir y controlar la libertad de los franceses para suplir la escasez de mano de obra utilizándolos a ellos."
 MIL_Himari_intensified:0 "Agenda de Himari"
 MIL_Himari_intensified_desc:0 "Como jefa de Veritas y de la División Especial Paranormal, cree que cooperar e integrarse con los franceses es la forma más cercana a garantizar la supervivencia a largo plazo de Millennium."
 MIL_strong_control:0 "Control fuerte"
 MIL_strong_control_desc:0 "No hay estudiantes sin escuela. La situación actual amenaza gravemente la existencia de Millennium Science School, lo que a su vez pone en grave peligro a los estudiantes. Reforzar el control en toda la escuela aliviará en parte los problemas actuales. Todo es por la escuela y por los estudiantes..."
 MIL_loose_oil_painting:0 "Política flexible"
 MIL_loose_oil_painting_desc:0 "La jefa Himari es consciente de que la represión de los franceses actúa como un arma de doble filo. Les daremos incentivos para que transfieran su lealtad hacia nosotros."
 MIL_reduction_clubs:0 "Redistribución de estudiantes"
 MIL_reduction_clubs_desc:0 ""
 MIL_reduction_seminar:0 "Debilitamiento de la autoridad del Seminario"
 MIL_reduction_seminar_desc:0 "No hay estudiantes sin escuela. La situación actual amenaza gravemente la existencia de Millennium Science School, lo que a su vez pone en grave peligro a los estudiantes. Reforzar el control en toda la escuela aliviará en parte los problemas actuales. Todo es por la escuela y por los estudiantes..."
 MIL_forced_labor:0 "Trabajo forzado civil"
 MIL_forced_labor_desc:0 "La presidenta Rio ha propuesto el trabajo forzado de civiles como solución a la escasez de suministros. Aunque esto mejorará gradualmente los problemas económicos, con el tiempo ganará el rencor de los franceses."
 MIL_robotc_labor:0 "Trabajadores robot"
 MIL_robotc_labor_desc:0 "Actualmente, nuestra economía sufre una gran carencia de trabajadores. Como obligar a los franceses a trabajar es poco ético e inmoral, la jefa Himari ha propuesto la introducción de robots trabajadores como solución."
 MIL_direct_bodyguards:0 "Creación de guardia personal directa"
 MIL_direct_bodyguards_desc:0 "Las nuevas medidas de la presidenta Rio están causando mucho resentimiento entre los locales. En condiciones normales, CGC debería ocuparse de estos problemas, pero la CGC actual tiene emociones que no debería tener como arma, y podría traicionar en cualquier momento. Forjaremos una nueva espada que corte a los enemigos de Rio."
 MIL_rebuilt_school1:0 "Himari, jefa de Veritas"
 MIL_rebuilt_school1_desc:0 ""
 MIL_rebuilt_school2:0 "Rio, presidenta del Seminario"
 MIL_rebuilt_school2_desc:0 "En tiempos de crisis, debemos unirnos bajo el liderazgo decidido de la presidenta del Seminario. Rio ha liderado Millennium Science School desde antes de la Gran Transposición, y su liderazgo ya ha sido demostrado. Si la elegimos presidenta del Seminario, podremos responder de manera más activa a la crisis actual."
 MIL_Rio_school:0 "Dominio unificado"
 MIL_Rio_school_desc:0 "En una situación de emergencia como la actual, escuchar y recoger las opiniones de muchos como en tiempos normales es una tontería. Debemos transferir gran parte del poder a la presidenta para responder proactivamente a la crisis."
 MIL_maintaining_balance_of_power:0 "Mantener el equilibrio de poder"
 MIL_maintaining_balance_of_power_desc:0 "No hay estudiante perfecto en este mundo. Todos tienen defectos y cometen errores. Pero si no están solos, sino en grupo, se pueden minimizar los defectos y acercarse a la perfección. Mantener un equilibrio adecuado del poder en lugar de concentrarlo en la presidenta es la mejor manera de mantener estable Millennium Science School."
