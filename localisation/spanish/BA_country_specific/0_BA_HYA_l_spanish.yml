 HYA_yuyeonhandongali: "Academia ‘Aliada’ Hyakkiyako"
 HYA_yuyeonhandongali_desc: "La Academia Aliada Hyakkiyako es una especie de federación formada por un sistema de alianza laxa entre múltiples clubes. Este sistema incrementa la estabilidad de Hyakkiyako, pero al no existir un gobierno central real, será difícil impulsar planes de forma proactiva."

