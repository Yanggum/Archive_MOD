  # EVENTOS
 HYA_event.1.t: "Derrota"
 HYA_event.1.desc: "Hemos intentado revertir el curso de la guerra, una y otra vez… pero fuimos derrotados en la guerra contra Hyakkiyako. Ya no queda adónde retroceder, y la derrota es un hecho consumado.\n\nSolo nos queda suplicar a Hyakkiyako… o prepararnos para una última resistencia a muerte."
 HYA_event.1.a: "Shanhaijing… oh, Shanhaijing…"
 HYA_event.1.b: "Hasta el último aliento… ¡luchemos!"
 HYA_event.2.t: "Oferta de rendición de Shanhaijing"
 HYA_event.2.desc: "Mientras llevamos la delantera en la guerra contra Shanhaijing, el gobierno de Shanhaijing nos ha pedido la rendición.\n\n¡Hemos ganado la guerra!"
 HYA_event.2.a: "¡Nuestra victoria!"
 HYA_event.2.b: "Los anexionaremos por completo."
 HYA_event.3.t: "¡La Sección Huazhao-Pungwol ha sido localizada!"
 HYA_event.3.desc: "Tras rastrear a los responsables detrás de la caótica oleada de atentados recientes, confirmamos que detrás de todo existe realmente la Sección Huazhao-Pungwol, una organización que se creía desaparecida desde hace muchísimo tiempo. La mera existencia de estos individuos, que solo se consideraba una leyenda urbana, ha quedado expuesta al ser reconocida oficialmente por el Club de Servicio de la Academia Aliada Hyakkiyako."
 HYA_event.3.a: "¿De verdad existían?"
 HYA_event.5.t: "Saqueo del arsenal"
 HYA_event.5.desc: "Hemos confirmado que nuestro arsenal fue bombardeado por una fuerza desconocida, causando la pérdida de una gran cantidad de armas de fuego."
 HYA_event.5.a: "Rastreá al culpable."
 HYA_event.6.t: "Fábrica de armas atacada"
 HYA_event.6.desc: "Acaba de llegar el informe de que una de las fábricas que abastecen de armas a nuestro ejército fue atacada por criaturas desconocidas."
 HYA_event.6.a: "¿Quién… haría algo así?"
 HYA_event.7.t: "Explosión"
 HYA_event.7.desc: "Por razones desconocidas, se produjo una explosión en el centro urbano hace unos instantes, destruyendo una parte considerable de la infraestructura de la ciudad y provocando, a estas horas, más caos y confusión."
 HYA_event.7.a: "¡Envíen al equipo de reparaciones!"
 HYA_event.8.t: "Desaparición"
 HYA_event.8.desc: "Últimamente se están recibiendo con frecuencia reportes de desaparición de estudiantes de nuestra academia. Estamos siguiendo la pista de estos casos, pero por ahora no parece haber resultados."
 HYA_event.8.a: "¿No será coincidencia?"
 HYA_event.9.t: "Declaración de guerra de la Sección Huazhao-Pungwol"
 HYA_event.9.desc: "La Sección Huazhao-Pungwol acaba de declarar una guerra total contra nuestra academia. Con la osada afirmación de que acabarán por completo con el sistema de la Academia Aliada Hyakkiyako, avanzan directamente hacia nosotros."
 HYA_event.9.a: "Lleguemos hasta el final."
 HYA_event.11.t: "Hyakkiyako impulsa un pacto de no intervención"
 HYA_event.11.desc: "Hyakkiyako ha anunciado un pacto de no intervención con el objetivo de la coexistencia entre la vieja Europa y Kivotos. Su propósito es separar ambos mundos mediante diversas medidas, incluyendo pactos de no agresión entre los países balcánicos y la Academia Aliada Hyakkiyako."
 HYA_event.11.a: "Es un pacto que nosotros también deseábamos."
 HYA_event.11.b: "Tengo otra idea."
 HYA_event.12.t: "[FROM.GetName] aprueba el pacto de no intervención"
 HYA_event.12.desc: "[FROM.GetName] ha aceptado nuestro pacto de no intervención y no injerencia, alegando que será beneficioso en múltiples aspectos."
 HYA_event.12.a: "Bien."
 HYA_event.13.t: "[FROM.GetName] rechaza el pacto de no intervención"
 HYA_event.13.desc: "[FROM.GetName] ha rechazado el pacto de no intervención con un motivo poco claro, afirmando que es evidente que buscamos alcanzar un objetivo específico para beneficiar nuestros propios intereses."
 HYA_event.13.a: "Hmm…"
 HYA_event.14.t: "Derrota"
 HYA_event.14.desc: "Hemos intentado revertir el curso de la guerra, una y otra vez… pero fuimos derrotados en la guerra contra Shanhaijing. Ya no queda adónde retroceder, y la derrota es un hecho consumado.\n\nSe ha descubierto que algunos comandantes se están rindiendo en grupo ante Shanhaijing, y no existe posibilidad alguna de que la situación mejore."
 HYA_event.14.a: "Los cerezos se marchitan…"
 HYA_event.14.b: "Todos… gyokusai."
 HYA_event.15.t: "Oferta de rendición de Hyakkiyako"
 HYA_event.15.desc: "Mientras llevamos la delantera en la guerra contra Hyakkiyako, su dirigencia nos ha pedido la rendición.\n\n¡Hemos ganado la guerra!"
 HYA_event.15.a: "Por fin, la tierra de Shanhaijing vuelve a nosotros."
 HYA_event.15.b: "Los anexionaremos por completo."
 HYA_event.16.t: "[From.GetNameDef] rechaza la rendición"
 HYA_event.16.desc: "[From.GetNameDef] ha rechazado nuestra oferta de rendición. Parece que desean nuestra destrucción total…"
 HYA_event.16.a: "…"
 HYA_event.17.t: "Invitación al Festival Baekya-Aengje"
 HYA_event.17.desc: "Hyakkiyako nos ha enviado una invitación para celebrar ahora el Baekya-Aengje, el festival que la Academia Aliada Hyakkiyako promovía antes de la Gran Transición.\n\nParticipar de forma oficial, o no hacerlo, se estima que la participación estudiantil será considerable. Sin embargo, si declaramos oficialmente nuestra intención de participar, podremos obtener beneficios políticos."
 HYA_event.17.a: "Participemos."
 HYA_event.17.b: "…Ya es demasiado tarde para volver atrás."

 HYA_event.18.t: "Invitación al festival del otro mundo"
 HYA_event.18.desc: "Antes de la Gran Transición, Hyakkiyako celebraba periódicamente en Kivotos el Baekya-Aengje, un festival para el que también nos han enviado una invitación.\n\nSi anunciamos nuestra participación, podremos grabar en la mente del público una imagen de paz y facilitar el intercambio cultural con el otro mundo."
 HYA_event.18.a: "Participemos."
 HYA_event.18.b: "¿No se habrán equivocado de destinatario?"

 HYA_event.19.t: "La jefa de Baekhwa-Yoran regresa"
 HYA_event.19.desc: "Contenido"
 HYA_event.19.a: "¿Ayame ha vuelto?"


 #중점
 HYA_focus_1: "La situación de la Academia Aliada"
 HYA_focus_1_desc: "Tras la Gran Transición, la situación de Hyakkiyako se ha vuelto aún más grave. Muchos clubes y gremios de comerciantes de Hyakkiyako aprovecharon el caos para escapar del control del Onmyobu, y entre el Onmyobu y Baekhwa-Yoran se perciben señales de conflicto sobre cómo resolver la crisis. Para abrirnos paso entre esta confusión, harán falta decisiones audaces."
 HYA_focus_2: "La academia de la cultura y los festivales"
 HYA_focus_2_desc: "La Academia Aliada Hyakkiyako era una academia con un turismo sumamente desarrollado, pero la confusión de la Gran Transición destruyó numerosas instalaciones turísticas y canceló festivales. Gracias al esfuerzo desesperado del Departamento de Operación y Gestión de Matsuri por evitar la bancarrota del sector, algunos festivales siguen celebrándose con normalidad, pero sin apoyo adicional, la tradición de Hyakkiyako podría desaparecer."
 HYA_focus_3: "Organizar el Comité de Confianza"
 HYA_focus_3_desc: "Organizaremos un nuevo grupo llamado Comité de Confianza, similar a Baekhwa-Yoran —que media los conflictos de Hyakkiyako—, pero un poco más político y de alcance más amplio. Esta institución funcionará como un parlamento básico, o una mesa de debate, que opera gracias a la confianza de cada club, y con el tiempo brindará la oportunidad de unir con firmeza a la Academia Aliada Hyakkiyako."
 HYA_focus_4: "Cooperación con el Club de Servicio"
 HYA_focus_4_desc: "El Club de Servicio, un club que se dedica al ‘entrenamiento’ para convertirse en damas espléndidas, ya realizaba por su cuenta labores de auxilio a refugiados incluso antes de la creación del Comité de Confianza, ganándose una buena imagen entre los locales y las estudiantes. Cooperar con ellas permitirá comunicar aún mejor al público el objetivo del Comité de Confianza: la unidad de la Academia Aliada Hyakkiyako."
 HYA_focus_5: "Cooperación con el Onmyobu"
 HYA_focus_5_desc: "Para que el Comité de Confianza ejerza influencia política dentro de Hyakkiyako, la aprobación del Onmyobu es absolutamente imprescindible. Por suerte, la jefa del Onmyobu, Yamachi Niya, mantiene una postura favorable a su creación, así que se espera que cooperar con el Onmyobu no sea difícil."
 HYA_focus_6: "Prepararnos para la guerra"
 HYA_focus_6_desc: "Hyakkiyako no contaba con un grupo que pudiera llamarse ejército regular, y dependía de milicias vecinales creadas de forma autónoma por cada club. Muchos expertos militares afirman que, con la fuerza actual de Hyakkiyako, es realista-mente imposible sofocar el caos interno y prepararse ante una invasión externa; por ello, han defendido con firmeza la creación de un ejército regular entrenado."
 HYA_focus_7: "Nuestra guerra"
 HYA_focus_7_desc: "Hyakkiyako es una federación laxa de clubes, por lo que su sentido de solidaridad suele ser más bajo que el de otras academias. Pero la Gran Transición lo cambió todo. Entre las estudiantes que deben unirse como ‘una misma academia’ para sobrevivir, está brotando un sentimiento de unidad; con un poco más de propaganda, Hyakkiyako podría convertirse en una verdadera ‘academia aliada’."
 HYA_focus_8: "Es hora de trabajar"
 HYA_focus_8_desc: "$HYA_NIYA$ ya no puede seguir actuando únicamente con optimismo. Ahora utilizará sus capacidades para liderar la integración de Hyakkiyako y, más allá de eso, comenzará un salto idealista para establecer un nuevo sistema cuyo propósito sea ‘reunir en uno solo la voluntad de todos los clubes’."
 HYA_focus_9: "La Princesa de Waraku"
 HYA_focus_9_desc: "Waraku Chise, la superestrella de Hyakkiyako, conocida como la ‘Princesa de Waraku’, está arrasando incluso entre los locales gracias a su talento actoral y a su peculiar y extraña ternura. Actualmente recorre Hyakkiyako con funciones de慰問 (presentaciones de apoyo), ayudando a que, aunque sea por un momento, se olvide la vida devastada tras la Gran Transición."
 HYA_focus_10: "Contener al gremio de comerciantes"
 HYA_focus_10_desc: "Ha llegado información de inteligencia: Nyantenmaru, representante del gremio de comerciantes que domina el submundo de Hyakkiyako bajo el apodo de ‘Nyante Masamune’, estaría conspirando para absorber al Departamento de Operación y Gestión de Matsuri aprovechando la Gran Transición. Debemos contenerlos y evitar que el poder del gremio siga creciendo."
 HYA_focus_11: "Permitir el comercio de opio"
 HYA_focus_12: "La Guerra del Sur de Kivotos"
 HYA_focus_12_desc: "Antes de la Gran Transición, Hyakkiyako y Shanhaijing se mostraban mutuamente indiferentes, pero ahora se encuentran en la posición de tener que luchar entre sí para sobrevivir."
 HYA_focus_13: "Iniciar la resistencia"
 HYA_focus_13_desc: "Contrario a lo que esperábamos, el ejército de Shanhaijing era más poderoso que el nuestro. En lugar de mantener imprudentemente el frente, el ejército ha ordenado una retirada temporal para resistir usando el casco urbano de Hyakkiyako como cobertura."
 HYA_focus_14: "Movilizar la industria bélica"
 HYA_focus_14_desc: "Tras la guerra, los problemas del ejército de Hyakkiyako empiezan a salir a la luz. Dejando de lado lo inmaduras que siguen siendo las operaciones conjuntas entre clubes, el mayor obstáculo es la escasez de suministros militares. Debemos movilizar toda la industria bélica disponible para resolver este problema."
 HYA_focus_16: "Ampliar el reclutamiento"
 HYA_focus_16_desc: "Por la guerra atroz, muchos soldados leales a Hyakkiyako desaparecieron entre el fuego. Para compensar la falta de efectivos, el gobierno ha ampliado el alcance del reclutamiento."
 HYA_focus_19: "Expandir el Baekya-dang"
 HYA_focus_19_desc: "El Departamento de Operación y Gestión de Matsuri ha hecho enormes esfuerzos por mantener la tradición de Hyakkiyako incluso en el caos de la Gran Transición. El Onmyobu, reconociendo que ellos son más expertos en todo lo relativo a festivales, les otorgó más autoridad que antes y, en reconocimiento a sus méritos, apoyó las obras de ampliación del Baekya-dang."
 HYA_focus_20: "Plan de urbanización"
 HYA_focus_20_desc: "El Onmyobu valoró en alto grado la capacidad de Kawawa Shizuko en el sector civil y le concedió los derechos de desarrollo de una zona urbana deteriorada cerca del Baekya-dang. Shizuko anunció un plan de urbanización para establecer la infraestructura necesaria tanto para festivales fluidos como para el objetivo final: celebrar el Baekya-Aengje."
 HYA_focus_21: "Plan del 1.er Baekya-Aengje"
 HYA_focus_21_desc: "El Departamento de Operación y Gestión de Matsuri ha decidido celebrar el Baekya-Aengje como el primer gran evento tras la Gran Transición. Aunque hubo opiniones en contra, la mayoría de los involucrados coincidió con el argumento de que celebrar el Baekya-Aengje era esencial para demostrar al público que la tradición de Hyakkiyako sigue viva."
 HYA_focus_22: "Comité Conjunto del Festival"
 HYA_focus_22_desc: "Debido a un entorno más pobre que el de Kivotos, durante los preparativos del Baekya-Aengje se han hecho evidentes muchas carencias técnicas y de eficiencia. Para corregirlo, Shizuko, usando la autoridad recibida del Onmyobu, estableció el Comité Conjunto del Festival: una institución que coopera con comerciantes, arquitectos y otras partes para preparar el festival de forma más eficiente."
 HYA_focus_23: "Plan del 2.º Baekya-Aengje"
 HYA_focus_23_desc: "Tras debatirse el plan del 1.er Baekya-Aengje, el Departamento de Operación y Gestión de Matsuri entró en una segunda ronda de reuniones para identificar problemas a reforzar y diversas dificultades en el proceso de preparación del evento."
 HYA_focus_24: "Reorganizar el distrito comercial"
 HYA_focus_24_desc: "Los puestos callejeros de Hyakkiyako eran uno de los atractivos adicionales de los festivales, pero los comercios que dependían de ellos han perdido por completo su base comercial tras la Gran Transición. Para que Hyakkiyako recupere plenamente su antigua gloria, es imprescindible rescatarlos."
 HYA_focus_25: "Baekya-Aengje"
 HYA_focus_25_desc: "Por fin se ha inaugurado el tan esperado Baekya-Aengje. Aunque por razones prácticas no pudo ser el festival grandioso que se veía en Kivotos, muchas estudiantes recordaron y rememoraron su vida cotidiana de entonces a través de esta celebración. Sorprendentemente, los locales también participaron junto a las estudiantes sin mostrar odio. Ese día, más que ningún otro, fue un día de consuelo en una rutina devastada."
 HYA_focus_26: "El corazón de una dama"
 HYA_focus_26_desc: "Las estudiantes de Hyakkiyako, al igual que en Trinity, consideran como la mayor virtud ‘la actitud de una dama refinada que posee una mente serena y pura’. Aunque la Gran Transición haya destruido su vida diaria, en lo más profundo del corazón de las estudiantes de Hyakkiyako esa actitud sigue presente."
 HYA_focus_27: "El Club de Servicio como sustituto del Comité de Disciplina"
 HYA_focus_27_desc: "Hyakkiyako cuenta con Baekhwa-Yoran como organización de seguridad, pero para concentrarse en descubrir la verdadera identidad de la Sección Huazhao-Pungwol, han solicitado formalmente al Club de Servicio —que suele encargarse de patrullas por cuenta propia— que actúe como autoridad sustituta del Comité de Disciplina. Tras deliberarlo, el Onmyobu lo aprobó, y ahora el Club de Servicio intensificará las labores de mantenimiento del orden en lugar de Baekhwa-Yoran."
 HYA_focus_28: "Patrullas en las zonas periféricas"
 HYA_focus_28_desc: "Gracias a las patrullas del Club de Servicio, el centro de Hyakkiyako se ha vuelto algo más seguro, pero en la periferia aún pululan forajidos de Kivotos que luchan por sobrevivir y grupos armados locales que cometen crímenes de odio contra los ‘forasteros’. Para asegurar el control de Hyakkiyako también fuera de la ciudad, el Club de Servicio está evaluando ampliar su zona de patrulla."
 HYA_focus_29: "Atraer a los Mouryouzu"
 HYA_focus_29_desc: "Aunque su número ha disminuido desde la Gran Transición, los Mouryouzu siguen siendo un dolor de cabeza para Hyakkiyako. Su capacidad de combate sería adecuada como fuerza de seguridad, así que si los sometemos mediante una combinación de persuasión y amenaza, podremos reforzar el personal del que carece Hyakkiyako."
 HYA_focus_30: "Iniciar la destrucción de los Mouryouzu"
 HYA_focus_30_desc: "Incluso tras la Gran Transición, los ataques terroristas de los Mouryouzu continúan. Asaltan indiscriminadamente a ciudadanos y estudiantes indefensos para saquear los escasos bienes de primera necesidad, por lo que deben ser reprimidos con rapidez, incluso si hace falta usar la fuerza."
 HYA_focus_31: "Reforma militar"
 HYA_focus_31_desc: "El mayor problema de Hyakkiyako es su ejército no unificado. Para que su poder militar alcance un nivel comparable al de otras academias o de los estados locales, debemos convocar las milicias de todos los clubes, otorgarles diversos beneficios para convertirlas en un ejército regular de Hyakkiyako, y establecer una disciplina unificada."
 HYA_focus_32: "El poder del entrenamiento"
 HYA_focus_34: "Desarrollo industrial"
 HYA_focus_34_desc: "Por la Gran Transición, innumerables instalaciones industriales y puestos callejeros de los que Hyakkiyako se enorgullecía fueron destruidos. Parece imposible reparar estos daños en el corto plazo. El gobierno está elaborando un plan sistemático y preparando la recuperación industrial."
 HYA_focus_35: "Fortificar la gran ciudad"
 HYA_focus_35_desc: "Las grandes ciudades de Hyakkiyako son suficientes para detener ataques de alimañas como los Mouryouzu, pero son vulnerables a bombardeos de ejércitos organizados y con planes. Tras identificar esta debilidad, el gobierno ha decidido fortificar el casco urbano para una defensa más eficaz."
 HYA_focus_36: "Construcción de la Línea Sudetenland"
 HYA_focus_36_desc: "La guerra contra Shanhaijing reveló varios puntos a mejorar en la defensa de las grandes ciudades. Por ello, el gobierno ha decidido construir una enorme línea defensiva que conecte la tierra llamada ‘Sudetenland’ —en el idioma local arrebatado a Shanhaijing— con las grandes ciudades de Hyakkiyako: la Línea Sudetenland."
 HYA_focus_37: "Expandir la fábrica de armas"
 HYA_focus_37_desc: "Parte de los complejos industriales destruidos eran fábricas que producían el bien indispensable en Kivotos: armas de fuego. La mayoría no puede seguir el ritmo de la demanda por falta de recursos. Con ayuda de armeros locales, debemos obtener planos de equipo de infantería local y lograr producirlos por nuestra cuenta."
 HYA_focus_38: "Apoyar la industria civil"
 HYA_focus_38_desc: "La industria civil, que podría llamarse el corazón de Hyakkiyako, fue en su mayoría destruida por la Gran Transición. Incluso la poca que sobrevivió quebrará sin intervención del gobierno, así que se necesitan medidas inmediatas."
 HYA_focus_39: "Innovación industrial"
 HYA_focus_39_desc: ""
 HYA_focus_40: "Reacondicionar carreteras"
 HYA_focus_40_desc: ""
 HYA_focus_41: "Universidad Integral de Hyakkiyako"
 HYA_focus_41_desc: ""
 HYA_focus_42: "Fundar el Departamento de Investigación Conjunta"
 HYA_focus_42_desc: ""
 HYA_focus_43: "Interés por el ninjutsu"
 HYA_focus_43_desc: ""
 HYA_focus_44: "Caminar junto al zorro"
 HYA_focus_44_desc: "Considerando la particularidad de la Gran Transición, funcionarios del gobierno anunciaron que cancelarán la expulsión (suspensión) de una de las Siete Presas, Kosaka Wakamo, la amnistiarán de todos sus crímenes y la nombrarán general de Hyakkiyako. Sin embargo, muchas estudiantes de Hyakkiyako parecen estar descontentas con esta medida."
 HYA_focus_45: "Mantener la expulsión de Wakamo"
 HYA_focus_45_desc: "Pese a las exigencias de los radicales internos, el actual gobierno ha rechazado oficialmente cancelar la expulsión (suspensión) de una de las Siete Presas, Kosaka Wakamo. Sostienen que sus actos terroristas dejaron una herida imborrable en el honor de la academia y han declarado que, incluso tras la Gran Transición, mantendrán su expulsión."
 HYA_focus_46: "Fortalecer el Comité de Confianza"
 HYA_focus_46_desc: ""
 HYA_focus_47: "Consejo Estudiantil de Hyakkiyako"
 HYA_focus_47_desc: "Se ha establecido oficialmente el Consejo Estudiantil de Hyakkiyako, sucesor del Comité de Confianza. En su primer discurso, afirmó basarse en la ‘teoría de la politeia’ para promover la igualdad entre clubes, y declaró que priorizará por encima de todo el bienestar de los ciudadanos de Hyakkiyako."
 HYA_focus_48: "Industria de defensa"
 HYA_focus_48_desc: "Hyakkiyako debe, ante todo, estabilizar su interior; para ello, es indispensable que el ejército crezca. En consecuencia, también es necesario fomentar la industria de defensa."
 HYA_focus_49: "Ingeniería inversa de aeronaves"
 HYA_focus_49_desc: "No solo las personas deben adaptarse a un entorno similar a Kivotos pero ligeramente distinto: las aeronaves también. Debemos realizar ingeniería inversa de aviones fabricados con la tecnología local y desarrollar aeronaves adecuadas a este entorno."
 HYA_focus_50: "Mejorar la potencia de fuego de la infantería"
 HYA_focus_50_desc: "Tras combatir contra ejércitos locales, el ejército de Hyakkiyako se dio cuenta de que el armamento de Kivotos no era especialmente eficiente contra la infantería local. Por ello, el instituto militar aplicó la tecnología local y logró mejorar las armas de infantería para hacerlas más eficaces en combate contra los locales."
 HYA_focus_51: "Sistema de economía de guerra"
 HYA_focus_51_desc: "El gobierno de Hyakkiyako está enfocándose en el crecimiento militar. Para satisfacer la demanda del ejército, que aumenta poco a poco, el gobierno proclamó un sistema de economía de guerra sobre las fábricas de Hyakkiyako que puede controlar."
 HYA_focus_52: "Desarrollo de cazas"
 HYA_focus_52_desc: "El departamento aeronáutico del instituto militar ha logrado crear aeronaves eficientes mediante ingeniería inversa de la tecnología local. Basándose en ello, presentaron a la cúpula un borrador de proyecto para crear un caza que combine la tecnología de Kivotos con la local."
 HYA_focus_53: "Investigación de bombarderos"
 HYA_focus_53_desc: "Justo después de que la ingeniería inversa de aeronaves tuviera éxito, algunos talentos apasionados del departamento aeronáutico propusieron combinar bombarderos locales con la tecnología de Kivotos. La idea fue aprobada de inmediato, y ahora se dedican por completo a la investigación de bombarderos."
 HYA_focus_54: "Instituto Aeronáutico de Hyakkiyako"
 HYA_focus_54_desc: "La pequeña sección de investigación aeronáutica dentro del instituto militar ha ganado peso gracias a éxitos consecutivos. El gobierno de Hyakkiyako, al fijarse en estos talentos brillantes, les proporcionó un instituto aeronáutico para que puedan concentrarse en su investigación."
 HYA_focus_55: "Aeronaves a reacción"
 HYA_focus_55_desc: "En Kivotos, la tecnología a reacción es común, pero parece que aquí aún no se ha comercializado. Si establecemos una fuerza aérea a reacción, podremos asegurar la supremacía aérea en combate contra los locales."
 HYA_focus_56: "Integrar la doctrina aérea"
 HYA_focus_56_desc: "La falta de doctrina unificada no es solo un problema del ejército de Hyakkiyako. Por suerte, la fuerza aérea no tiene decenas de doctrinas como el ejército, así que se espera que la integración doctrinal sea relativamente fluida."
 HYA_focus_57: "Palas y rieles"
 HYA_focus_57_desc: "Por el impacto de la Gran Transición, tanto los rieles de Hyakkiyako como los locales dejaron de funcionar correctamente. Si, como parte de la industria nacional, empleamos a desempleados para construir vías férreas, podremos atrapar dos pájaros de un tiro: estabilizar la economía y restaurar la infraestructura nacional."
 HYA_focus_58: "Expandir la minería"
 HYA_focus_58_desc: "Con la tecnología de Kivotos, hemos descubierto que en la región de Hyakkiyako y en Sudetenland hay recursos subterráneos aún sin explotar. Con la tecnología avanzada de Kivotos, extraerlos será pan comido."
 HYA_focus_59: "Más tierra"
 HYA_focus_59_desc: "Algunos edificios del campus de Hyakkiyako quedaron destruidos a un nivel irreparable por la Gran Transición. ¡Debemos limpiar los escombros del viejo campus, nivelar el terreno y convertirlo en una nueva tierra de oportunidades!"
 HYA_focus_60: "Prioridad al ferrocarril"
 HYA_focus_60_desc: "Tras la Gran Transición, la mayoría de las vías que pasan por Hyakkiyako —antes bajo jurisdicción de la Academia Ferroviaria Highlander— han pasado a ser nuestras. Ahora que la interferencia de Highlander se ha debilitado, es el momento oportuno para conectar fluidamente con el ferrocarril local."
 HYA_focus_61: "Fundar un Estado"
 HYA_focus_61_desc: "Tras los innumerables esfuerzos del Comité de Confianza, Hyakkiyako ha logrado integrarse políticamente. ¡Hyakkiyako ya no será una ‘alianza’ solo de nombre, sino que renacerá como una verdadera ‘Academia Aliada’!"
 HYA_focus_62: "Dirección del Onmyobu"
 HYA_focus_62_desc: "Aunque el Onmyobu no sea el consejo estudiantil formal de Hyakkiyako, su legitimidad y posición hacen que pocos expresen un rechazo frontal a que lidere el Comité de Confianza. Puede que sea ‘legítimo’ que el Onmyobu lidere el nuevo consejo estudiantil, pero habrá quienes se opongan alegando que viola el valor de ‘igualdad’, principio de la creación del Comité de Confianza."
 HYA_focus_63: "Separación de poderes"
 HYA_focus_63_desc: "El Comité de Confianza ha priorizado el valor de la ‘igualdad’ para la armonía de Hyakkiyako. Ahora, a las puertas del nacimiento del Consejo Estudiantil, los directivos del Comité declararon oficialmente, tras debatirlo, que todos los clubes de Hyakkiyako —incluido el Onmyobu— tendrán una voz igualitaria en el Consejo, y que este resolverá los conflictos entre clubes desde una perspectiva neutral."
 HYA_focus_64: "Comité de Mediación de Conflictos Baekhwa-Yoran"
 HYA_focus_64_desc: "Hyakkiyako es demasiado inestable para asentarse en el sistema actual. ¡La Academia Aliada Hyakkiyako debe ser reorganizada conforme a los nuevos preceptos de liderazgo de nuestro Comité de Mediación de Conflictos Baekhwa-Yoran! La decisión para proteger nuestra academia se ejecutará ahora mismo, y la política de tolerancia negligente hacia los checos y las acciones impulsivas de los clubes se detendrán de inmediato."
 HYA_focus_65: "Campaña de castigo contra la Sección Huazhao-Pungwol"
 HYA_focus_66: "Represión de actividades antiacademia"
 HYA_focus_67: "Prohibir las concentraciones checas"
 HYA_focus_68: "Eliminar a los terroristas"
 HYA_focus_69: "Orden y disciplina"
 HYA_focus_70: "Derrocar el sistema de Hyakkiyako"
 HYA_focus_71: "Cooperar con la Sección Huazhao-Pungwol"
 HYA_focus_72: "Rechazar a los youkai"
 HYA_focus_72_desc: "Cooperar con la Sección Huazhao-Pungwol, que maneja ese poder sospechoso, no nos traerá nada bueno. Nosotros, los Mouryouzu, los rechazaremos con firmeza y alcanzaremos nuestros objetivos a nuestra manera —aunque a veces nuestra identidad se difumine—."
