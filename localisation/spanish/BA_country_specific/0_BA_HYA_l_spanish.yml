 HYA_nojukeunggundae: "Milicias autónomas"
 HYA_nojukeunggundae_desc: "Milicias formadas de manera autónoma por cada club. Como es natural, no hay unificación ni en la cadena de mando ni en el suministro, lo que provoca una considerable confusión en las operaciones militares."
 HYA_nojukeunggundae2: "Introducción de rangos en el ejército"
 HYA_nojukeunggundae2_desc: "Aunque siguen siendo milicias autónomas formadas por cada club, la cadena de mando se ha reorganizado para facilitar las operaciones militares. Sin embargo, la cohesión aún es débil y persisten fricciones entre miembros de distintos clubes."
 HYA_nojukeunggundae3: "Sistema de fuerzas integradas"
 HYA_nojukeunggundae3_desc: "El primer modelo de fuerza integrada de la Academia Aliada Hyakkiyako. La integración aún es imperfecta, pero mediante reformas continuas existe una vía para mejorar."

