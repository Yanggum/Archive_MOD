 #캐릭터
 HYA_NIYA: "Amachi Niya"
 HYA_NIYA_DESC: "Amachi Niya, la jefa del Onmyobu —a quien describen como una burócrata empapada en los vicios de la burocracia que se pasa el día sonriendo sin atender las quejas—, fue en realidad la presidenta de facto del consejo estudiantil y quien dirigió la Gran Transición de Hyakkiyako. Su carácter optimista y su poder más bien nominal bastaron para cubrirla de un enorme oprobio.\n\n‘Una presidenta irresponsable e inútil’: así es como muchas estudiantes la llaman.\n\n...Si se le dijera eso, Niya probablemente estallaría en carcajadas y aplaudiría. Puede parecer la mente maestra detrás de todas las calamidades, pero en realidad es más alguien que disfruta de ‘jugar a ser la mente maestra’. Detrás de su máscara de optimismo y sonrisa, Amachi Niya es una persona que asegura con habilidad los beneficios políticos y diplomáticos.\n\nBajo un gobierno que se ejerce entre risitas, controla Hyakkiyako con una elocuencia sobresaliente. Y es evidente que ella es la figura pública y el corazón de Hyakkiyako."

