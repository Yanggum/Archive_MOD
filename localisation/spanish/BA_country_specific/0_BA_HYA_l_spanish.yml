 HYA_flower_bird_wind_moon_club: "Sección Huazhao-Pungwol"
 HYA_flower_bird_wind_moon_club_desc: "¡La Sección Huazhao-Pungwol existía de verdad! Ellas estaban perpetrando atentados contra nosotros. También hemos obtenido información de que su objetivo es derribar el sistema de la Academia Aliada Hyakkiyako."
