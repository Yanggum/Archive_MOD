 HYA_focus_95: "Departamento de Control Militar de Hyakkiyako"
 HYA_focus_96: "Sistema flexible de clubes"
 HYA_focus_96_desc: "Para poner en práctica la ‘igualdad’, ideal fundacional del consejo estudiantil, debemos ser capaces de regular adecuadamente los conflictos entre clubes. Tal vez sea incluso mejor reformar el sistema de clubes de forma flexible para prevenir, de antemano, las situaciones en las que surjan esos conflictos."
 HYA_focus_97: "Estado de Hyakkiyako"
 HYA_focus_100: "Centrarnos en lo interno"
 HYA_focus_100_desc: "La integración política de Hyakkiyako mediante la creación del consejo estudiantil logró, por poco, impedir la fragmentación de la academia, pero aún quedan muchos problemas por resolver dentro. Por ahora, debemos desconectarnos momentáneamente del mundo e intervenir primero en los asuntos internos."
 HYA_focus_101: "Defender la frontera"
 HYA_focus_102: "Política exterior no intervencionista"
 HYA_focus_102_desc: "Desde la época del Comité de Confianza, Hyakkiyako ha mantenido una postura neutral ante los conflictos entre otras academias. El consejo estudiantil, su sucesor, ha anunciado oficialmente que, hasta resolver los problemas internos, Hyakkiyako no intervendrá en otros países y conservará una actitud neutral."
 HYA_focus_103: "Construir fortificaciones fronterizas"
 HYA_focus_103_desc: "La neutralidad no es un escudo que evite todas las guerras. De hecho, la neutralidad puede conducir al aislamiento. Por eso Hyakkiyako no debe esperar ayuda para repeler una invasión externa: debemos endurecer nuestras líneas defensivas y prepararnos para la agresión."
 HYA_focus_104: "Impulsar el pacto de no intervención"
 HYA_focus_104_desc: "Los países balcánicos observan cada vez más el próximo movimiento de Hyakkiyako, que sigue creciendo. Si Hyakkiyako se entromete en la guerra por la hegemonía balcánica, podrían unirse para atacarnos. Por ello, debemos promover un pacto de no intervención y dejar claro que no nos interesa la invasión."
 HYA_focus_105: "La muralla balcánica"
 HYA_focus_105_desc: "Los conflictos entre los países balcánicos se agravan día a día; con una sola chispa, podrían estallar en cualquier momento. Algunos estudiantes del consejo, conocedores de la cultura local, han sugerido levantar una sólida barrera en la frontera para prepararnos ante esa posibilidad."
 HYA_focus_106: "Identificar países hostiles"
 HYA_focus_107: "Comisión de Fortalezas de Hyakkiyako"
 HYA_focus_107_desc: "Siguiendo la política no intervencionista, se han construido numerosas fortalezas para defender la frontera. Para controlar de forma eficiente el mantenimiento, la gestión y el enorme flujo de suministros destinado a esas fortalezas, el gobierno ha establecido la Comisión de Fortalezas."
