 EGY_event.4.t:0 "Abydos"
 EGY_event.4.d:0 "\"Desde arriba se ha decidido aceptar las condiciones para admitir su exilio. A cambio, se les exige cooperar en la derrota de la bestia ‘Binah’.\"\n\"De acuerdo. El Comité de Contramedidas está listo para desplegarse de inmediato, pero mientras tanto preparen un lugar para que los demás puedan recuperarse.\"\n\nTras enumerar condiciones de un lado y del otro, el funcionario y el Comité de Contramedidas continuaron la conversación.\n\n\"El asentamiento se fijará en el centro de El Cairo.\"\n\"…Si es posible, háganlo en una ciudad pequeña. Los de Kivotos somos distintos de los locales; vivir en una gran ciudad será difícil. Queremos asentarnos en una ciudad pequeña.\"\n\nAnte eso, el funcionario revisó documentos. El plan original era acomodarlos en un enclave dentro de El Cairo, pero esto no suponía un gran contratiempo. El nombre del lugar del que venían era… ah… Abydos. Sí. Si era Abydos…\n\n\"Ejem… un momento. Existe una pequeña ciudad llamada ‘Abydos’, con el mismo nombre que el lugar de donde vienen. ¿Qué les parece?\"\n\"Abydos…\"\n\nAbydos: la primera capital en la historia de Egipto. Pero hoy no es más que un yacimiento y una ciudad pequeña sin mayor relevancia. Si se los asentaba allí, ¿sería ganancia o pérdida? El funcionario decidió que eso no era asunto suyo.\n\n\"Bien. Entonces daremos por acordadas todas las condiciones.\""
 EGY_event.4.a:0 "\"Bien. Entonces, ¿a dónde tenemos que ir?\""

 EGY_event.5.t:0 "Horus del amanecer"
 EGY_event.5.d:0 "En la penumbra del alba, en Al Fayum —el lugar que un residente le había indicado—, un soldado quedó solo. Con todos los camaradas del batallón ya desaparecidos, justo cuando la bestia estaba a punto de disparar un rayo desde su boca, su cuerpo llegó al límite y no tuvo más remedio que desplomarse. Cuando la sombra de la desesperación envolvía su corazón, vio a una muchacha aparecer en el cielo como un meteorito, cortando el firmamento. La chica se lanzó con la dignidad de una mensajera celestial. Sus ojos ardían como llamas, y al golpear a la bestia con lo que llevaba en la mano, el monstruo —que no se inmutaba por más que lo atacaran— se estremeció violentamente. Él quedó sin palabras.\n\nEse giro milagroso ante sus ojos evocaba, como un reflejo, el fulgor del antiguo dios Horus. Solo, con todos sus compañeros desaparecidos, sintió una mezcla de admiración y miedo ante el valor y la fuerza de aquella chica. Aprovechando el instante en que Binah dirigió su mirada hacia ella, giró el cuerpo y huyó. Mientras escapaba, la imagen de la muchacha quedó grabada con nitidez en algún rincón de su mente, como la forma misteriosa y resplandeciente de Horus, dejando una impresión imposible de olvidar.  "
 EGY_event.5.a:0 "Y así comenzó el apodo de “Horus del amanecer”."

 EGY_event.6.t:0 "Ceremonia de graduación de la academia militar de 1939"
 EGY_event.6.d:0 "En 1939, tres años después del Gran Cataclismo, la ceremonia de graduación de la academia militar de Egipto se llevó a cabo siguiendo los procedimientos habituales, pese a las secuelas del desastre. En el salón, los cadetes, con sus uniformes de gala impecables, bajaron las escaleras por turnos, y se realizó la entrega de diplomas junto con el protocolo oficial. El representante de los graduados, Gamal Abdel Nasser, dio un breve discurso ante sus compañeros; los graduados se trasladarán pronto a Sudán para comenzar su servicio como oficiales."
 EGY_event.6.a:0 "¡Bienvenidos!"

