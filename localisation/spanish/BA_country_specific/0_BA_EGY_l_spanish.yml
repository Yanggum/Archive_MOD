 shoubra_engineering:0 "Ingeniería Shoubra"
 shoubra_engineering_desc:0 "Ubicada en Shoubra, corazón de El Cairo, esta compañía produce el mejor equipo de infantería combinando la artesanía del Antiguo Egipto con la tecnología avanzada de otro mundo. Sus armas son brillantes y poderosas como la luz de Ra."

 egyptian_engineering:0 "Ingeniería Egipcia"
 egyptian_engineering_desc:0 "Combinando la sabiduría de nuestros antepasados que construyeron las pirámides con la tecnología artillera de otro mundo, esta empresa desarrolla piezas de artillería de rendimiento asombroso. Sus cañones son devastadores, como si contuvieran la ira de Set."

