 EGY_idea_pella_mobilization_2:0 "Decreto de movilización de los fellahin"
 EGY_idea_puppet_council:0 "Parlamento títere"

 EGY_industrial_modernization_idea:0 "Plan de modernización industrial"
 EGY_industrial_modernization_idea_desc:0 "Nuestro plan de modernización industrial, que combina la artesanía del Antiguo Egipto con la tecnología avanzada de otro mundo, avanzará sin detenerse, como el curso del Nilo."

 EGY_camel_corps_idea:0 "Cuerpo de camellos de Set"
 EGY_camel_corps_idea_desc:0 "Nombrado en honor a Set, dios del desierto, nuestro cuerpo de camellos recorre las arenas equipado con material reforzado gracias a la tecnología de otro mundo, convirtiéndose en un objeto de terror para los enemigos."

 EGY_shendi_cavalry_idea:0 "Caballería Shendi de Horus"
 EGY_shendi_cavalry_idea_desc:0 "Como las alas de Horus, dios del cielo, nuestra caballería —formada por los célebres caballos de Shendi, rápidos y resistentes— cumple un papel clave al rechazar los ataques enemigos."

 EGY_military_schools:0 "Escuelas militares de Thot"
 EGY_military_schools_desc:0 "Nuestras escuelas militares, que llevan el nombre de Thot, dios de la sabiduría, enseñan en armonía la estrategia del Antiguo Egipto y las tácticas modernas de otro mundo, formando a los mejores oficiales."

 EGY_desert_training_idea:0 "Entrenamiento del desierto de Amón"
 EGY_desert_training_idea_desc:0 "Bajo la bendición de Amón, guardián del desierto, nuestros soldados aprenden supervivencia y técnicas de combate en condiciones implacables. Combinado con los métodos de supervivencia de otro mundo, este entrenamiento está convirtiendo a nuestro ejército en fantasmas del desierto."

 EGY_royal_gendarmerie:0 "Policía Real de Maat"
 EGY_royal_gendarmerie_desc:0 "Nombrada por Maat, diosa de la justicia y el orden, nuestra Policía Real protege la paz y la estabilidad internas combinando técnicas avanzadas de investigación de otro mundo con el concepto egipcio antiguo de justicia."

 EGY_merchant_marine_idea:0 "Marina mercante armada de Ra"
 EGY_merchant_marine_idea_desc:0 "Bendecidos por Ra, dios del sol, nuestros mercantes armados adoptan sistemas de propulsión de otro mundo y surcan los mares a una velocidad asombrosa. En paz comercian; en guerra, apoyan a la armada: cumplen una función vital."

 ### 해군 MIO ###
 suez_canal_company:0 "Compañía del Canal de Suez"
 suez_canal_company_desc:0 "Esta organización, que administra el Canal de Suez —puerta que conecta el mundo y el otro mundo—, ahora también se esfuerza en desarrollar buques de asalto marítimo con tecnología de punta. Nacidos de la unión entre la sabiduría del Antiguo Egipto y la tecnología de otro mundo, estos navíos serán el terror de nuestros enemigos."

 alexandria_shipyard:0 "Astillero de Alejandría"
 alexandria_shipyard_desc:0 "El astillero de esta ciudad, que lleva el nombre de Alejandro Magno, incorpora ahora tecnología de otro mundo para producir escoltas de última generación. La elegancia de Cleopatra y la fuerza de la tecnología moderna se fusionan en estos buques, que asumirán la defensa marítima."

 ### 항공기 MIO ###
 egypt_air:0 "Aviación de Egipto"
 egypt_air_desc:0 "Los aviones ligeros de la Aviación de Egipto, como si tuvieran las alas de Horus, adoptan técnicas de vuelo de otro mundo y presumen una maniobrabilidad asombrosa. Son suaves como el fluir del Nilo y veloces como el viento del desierto."

 sudan_airways:0 "Aerolíneas de Sudán"
 sudan_airways_desc:0 "Heredando la fuerza de los faraones negros de Nubia, los aviones medianos de Aerolíneas de Sudán aplican tecnología de motores de otro mundo y muestran un rendimiento sorprendente. Su presencia poderosa se hace notar al cruzar el Sahara."

