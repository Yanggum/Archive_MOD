 EGY_event.22.t:0 "Mohamed Naguib"
 EGY_event.22.d:0 "Mohamed Naguib exhaló el humo del cigarrillo mientras entraba al Estado Mayor. Mi ayudante más querido —Gamal Abdel Nasser— esperaba tenso. Tras observarlo un instante, le dio unas palmadas en el hombro. La tensión no se disipó.\n\n\"Siéntate. Hay algo que debemos hablar.\"\n\nAunque las grandes potencias pisotearon África, el desierto siguió siendo un temor soberano. El Nilo había funcionado como la sangre que protegía a Egipto de ese temor, y el faraón imponía su autoridad dominándolo. Incluso después de que Egipto gimiera bajo las botas británicas y la autoridad de la casa real se desvaneciera, ellos aún actuaban como si llevaran sangre de faraón.\n\nLa revolución para terminar con toda esa opresión era el anhelo de ambos. La guerra contra Alemania terminó, pero nada cambió; queríamos ver un mundo donde todos los egipcios vivieran en igualdad. Por eso nos atreveremos a conquistar la verdadera independencia con las armas.\n\n\"Es sobre lo que mencionamos antes. Aunque sea solo de nombre, ponerla como líder del gobierno militar...\"\n\n\"No.\"\n\nNasser lo cortó con calma, pero con severidad.\n\n\"¿No lo hemos hablado durante tanto tiempo? Para que esta revolución triunfe, debemos fundar una república. ¿Una monarquía contra otra monarquía? ¿Qué pensaría la gente? Coronar a esa chica alienígena como reina sería negar nuestra propia identidad. Esto es asunto del pueblo egipcio, no de Abydos. Lo siento, pero no puede haber una monarquía tras otra.\"\n\nNasser cerró los ojos. Seguía respetando al coronel, pero en ese momento sintió que convencerlo no sería fácil.\n\n\"Coronel, luchamos por quienes oprimen a Egipto, no por un nacionalismo cualquiera. ¿Qué importa si es monarquía o república? Aunque el camino de la nación sea el correcto, no podemos desperdiciar tiempo eligiendo al líder que “la nación” quiere. Yo creo que ella debe ser la líder del pueblo.\"\n\nNaguib negó con la cabeza, con una sonrisa incómoda.\n\n\"¿Y aun así deberíamos levantar una monarquía? En nuestra sangre corre la historia convulsa de miles de años. Esa chica no es egipcia, ni es alguien familiar para Egipto. No podrá cargar con esa sangre turbulenta, con la autoridad y la responsabilidad.\"\n\nNasser no pudo evitar guardar silencio. Tal vez el coronel tenía razón. Pero la situación era urgente; el joven que avanzaba por el país debía elegir. Ya no era algo que se resolviera con persuasión. Deslizó la mano dentro de la ropa y sacó una pistola."
 EGY_event.22.a:0 "\"Coronel... lo siento.\""

 EGY_event.23.t:0 "Una revolución dividida en dos"
 EGY_event.23.d:0 "\"...¿Qué estás haciendo? ¿De verdad crees que esto cambiará algo?\"\n\n\"Es la voluntad del pueblo, y se cumplirá. Una vez más, lo siento, coronel.\"\n\nDe las sombras de la habitación aparecieron oficiales ocultos y rodearon a Naguib. Naguib se sobresaltó, pero su expresión se mantuvo serena.\n\n\"...Así que al final ocurre. No te guardaré rencor. Hemos pasado juntos más de una década; tú también tendrás tus razones y tu justificación. Nunca podré entenderte del todo, pero así será.\"\n\nSin bajar el arma, Nasser mantuvo la mirada fija en Naguib durante un buen rato.\n\n\"Jamás olvidaré todo lo que me enseñó. Pero, como usted dijo, yo también tengo mis circunstancias para actuar así. No es nada personal, no se preocupe. Ahora es momento de descansar en un lugar lejano y silencioso.\"\n\nPara siempre.\n\nEl coronel Mohamed Naguib era un hombre con experiencia suficiente: para comprender la realidad, y para someterse a ella. Al aplastar el cigarrillo en el cenicero, la ceniza negra se desparramó.\n\n\"Haz lo que quieras. Ya no tendré poder real de todos modos.\"\n\nCuando Nasser dio una orden breve, un oficial sujetó el hombro de Naguib. Esa mirada, firme como una vara recta, hizo dudar al escolta. Nasser no tuvo más remedio que dejar que saliera por su cuenta.\n\nAntes de abandonar aquella oficina —tan parecida a un hogar— que ya no volvería a ver, Naguib miró a su sucesor.\n\n\"Nasser. Cumple con tu deber. Avanza por el bien de la nación.\"\n\nComo no se puede devolver el agua derramada, tampoco se puede revocar una decisión tomada. Nasser lo sabía. Naguib también. El hombre que, hasta hacía unas horas, se había alzado como protagonista de la revolución, dio un paso hacia la fría realidad.\""
 EGY_event.23.a:0 "Por toda mi vida, por la patria y el pueblo."

 EGY_event.24.t:0 "Los recuerdos de Britania que se desvanecen"
 EGY_event.24.d:0 "Sir Victor Hubert Tate, o el asesor principal de la fuerza aérea del Reino de Egipto, se estaba adaptando —a su manera— al clima del desierto. Aunque le parecía lo opuesto al invierno canadiense, el interior de los edificios era más soportable de lo que había imaginado. Al menos, podía darse el gusto de comer un par de dátiles.\n\nEra una vida tranquila. Tal vez, al terminar su mandato como asesor, regresaría a Canadá o se retiraría. Tras la llamada al palacio de hoy, pensaba invitar a un amigo a cenar.\n\n\"El Reino de Egipto agradece profundamente los esfuerzos de Sir Victor Tate hasta hoy.\"\n\nHasta que escuchó aquel aviso de repatriación, tan inusual.\n\nPor suerte, era algo que ya había previsto. El Imperio Británico cayó, Su Majestad el rey huyó a Canadá, y las grandes potencias que dominaban Europa fueron colapsando una tras otra. Egipto también tenía que actuar.\n\n\"Entonces... eh... no tengo mucho que decir. Al final, llegó el día.\"\n\n\"El Parlamento resolvió que, como el puente de Londres se derrumbó, era hora de liberarnos de las garras británicas… sin entender que Egipto debería permanecer junto a Britania para siempre.\"\n\nEl rey sonrió con naturalidad, pero en el fondo había una inquietud propia de la época.\n\n\"No pude rechazarlos.\"\n\"Fue una decisión sabia. Al fin y al cabo, en el Reino Unido... y en muchos otros lugares... han llegado vientos de cambio. Si los hubiera rechazado, la reacción habría sido considerable.\"\n\n\"Todo lo que has entregado hasta hoy, no lo olvidaré. Egipto ha gobernado estas tierras desde hace miles de años, pero por no adaptarse a los tiempos, perdió muchas cosas. Sin embargo, gracias a ti reconstruimos la fuerza aérea y ahora podemos estar debidamente preparados ante los bombardeos enemigos. Gracias.\"\n\nEl rey extendió la mano y compartieron un apretón breve. Era una mano áspera.\n\n\"Deseo que siempre te mantengas firme.\"\n\n\"Egipto siempre estará en mi corazón. Le deseo paz eterna, Su Majestad.\""
 EGY_event.24.a:0 "El último vestigio de Britania se ha marchado."

