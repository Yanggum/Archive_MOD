 EGY_event.1.t:0 "El exilio del Comité de Contramedidas de Abydos"
 EGY_event.1.d:0 "Abydos cayó y terminó en manos del enemigo. Declararon al Comité de Contramedidas como prófugo y proclamaron que traerían el fin del destino de Abydos. La resistencia del profesorado de Abydos terminó tras varios días de combates, y abandonar su entrañable tierra natal se volvió una realidad innegable.\n\nDiez mil abydosianos, y mil locales. El grupo que tomó una decisión distinta a la de la mayoría que se quedó en su tierra emprendió un viaje sin rumbo. Cruzaron el Danubio, atravesaron el Bósforo. Más allá del desierto, sin final a la vista.\n\nEn una época en la que todos luchaban por sobrevivir, era lógico pensar que nadie los acogería. Y, además, ¿cómo podrían sobrevivir unos sin misterio? Era una preocupación compartida, y muchos lo daban por sentenciado: que acabarían exhalando su último aliento.\n\nQuienes poseían misterio no tenían tiempo para llorar. No morirían por un par de balas, pero ni siquiera las chicas fuertes podían hacer nada ante la enfermedad y el hambre. Una tras otra, las niñas caían; y ellas siguieron caminando por la costa, dejando atrás a las que morían. Solo buscaban un pequeño refugio, o aguantar hasta que todos fuesen llamados por el destino del cielo....\n\nY entonces, estaba Egipto.\n\nCreyeron que, con la caída de Britania que los sometía con cadenas al cuello, por fin disfrutarían de la libertad verdadera. Pero solo cuando la bestia de las profundidades del Sahara se movió y arrojó a decenas de miles a la muerte, comprendieron que la libertad tenía un precio. Sintieron impotencia ante un monstruo al que no le hacían nada balas ni proyectiles; pidieron ayuda a las academias de Kivotos que habían arrasado Europa. No llegó respuesta.\n\nCuando todos, sin importar izquierda o derecha, se vieron consumidos por la desesperanza, un grupo llamado Abydos golpeó la frontera del Sinaí. Tenían halos. Poseían misterio. Eran capaces de derrotar a la bestia que amenazaba con atravesar miles de años de historia. Aunque apenas quedaban unos trescientos, sin duda eran una luz de esperanza.\n\nEgipto los recibió con los brazos abiertos, y"
 EGY_event.1.a:0 "Abydos por fin encontró un refugio."

 EGY_event.2.t:0 "El gobernador de Sudán"
 EGY_event.2.d:0 "\"Su Majestad, ¿qué significa esto? ¿Que debo volver...?\"\n\nEl 'Sir Stuart' Seamus palideció. Había conseguido un vuelo tras recibir un aviso urgente para presentarse en el palacio real de El Cairo… y aun así, la noticia que le dieron fue esta.\n\n\"¿Acaso no saben cuánto he logrado en Sudán? ¡Solo han pasado dos años! Aún quedan incontables políticas sin terminar; ¡no puede acabar así!\"\n\n\"Lo lamento, pero no puedo conceder esa petición. Parece que Buckingham ya no desea que sigas como gobernador de Sudán. ¿Cómo podría yo desobedecer esa orden? Tú, que eres un leal súbdito de Su Majestad, lo sabes mejor que nadie.\"\n\n\"Entonces, ¿por qué el gabinete me trajo desde Tanganica? Ellos todavía me necesitan.\"\n\n\"Te lo repito: no tengo autoridad para devolver una orden de Buckingham. Vuelve a Inglaterra y habla allí, si quieres.\"\n\nQué momento tan vacío, después de tantos años. Cuando asumió como gobernador de Sudán, juró que, obedeciendo la voluntad de Su Majestad, impulsaría políticas en favor de ellos. Pero si incluso un plan económico se diseña para unos cinco años, dos años son demasiado poco.\n\n¿Y qué podía hacer él? El gabinete simplemente le hacía señas para que regresara, porque había encontrado a alguien “mejor”.\n\n\"......Volveré a Canadá. Acabaré arrinconado en algún rincón de Ottawa, y entenderé que en la política no hay un lugar para mí.\"\n\nPorque esos tipos, que siempre solo miran a Europa, jamás iban a preocuparse por África.\n\nEl rey se limitó a mirarlo, y le dedicó unas palabras de despedida."
 EGY_event.2.a:0 "\"Que te vaya bien. Has trabajado duro.\""

 EGY_event.3.t:0 "Muerte de Fuad I"
