l_spanish:
 EGY_guide: "Objetivos\n\n£white_dot Logre la independencia del Imperio Británico.\n£white_dot Estabilice el caos político y decida el rumbo del gobierno.\n\n£white_dot §YLleve a la victoria al Partido Wafd y a la democracia§!\n      -  Alíese con los países de Oriente Medio y libere África bajo la bandera del anticolonialismo.\n o bien...\n£white_dot §YGuíe a la nación conforme a la ley islámica y, aliándose con Italia, elimine los restos corruptos y débiles del viejo orden.§!\n      -  Proclame el Imperio Egipcio y recupere la gloria de Egipto.\n o bien...\n£white_dot §YFortalezca el poder de las fuerzas armadas, disuelva el parlamento y ejecute un golpe de Estado.§!\n      -  Jure lealtad a la casa real y proclame el Imperio Egipcio..\n     o bien...\n      -  Derroque a la monarquía corrupta y avance hacia la unificación del mundo árabe.\n\n\n§CDesarrollo- Mako, 민트쿤mintcoon§!"
 EGY_country_intro_header: "Cuna de una civilización antigua, espléndida y próspera"
 EGY_country_intro_header_1: "Dominación extranjera y 1.800 años de oscuridad"
 EGY_country_intro_header_2: "La tierra donde se alza un nuevo sol"
 EGY_country_intro_content: "La civilización del Antiguo Egipto comenzó alrededor del año 3.100 a. C., cuando el Alto Egipto y el Bajo Egipto se unificaron por primera vez, y desde entonces se establecieron los cimientos de una cultura, un arte y una ciencia espléndidos que quedarían para siempre en la historia de la humanidad. Bajo el liderazgo del legendario rey Narmer (Menes), ambas regiones se fusionaron en una sola y se estableció un sistema estatal centralizado; se logró un desarrollo armonioso de la agricultura, la religión y la política en torno al río Nilo. Durante el Imperio Antiguo, se impulsaron grandes proyectos arquitectónicos como la construcción de pirámides, maximizando la autoridad del Estado y su capacidad técnica, y esto se consolidó como monumentos eternos transmitidos a las generaciones posteriores. El sofisticado sistema administrativo y los rituales religiosos de la época trajeron estabilidad y prosperidad a toda la sociedad, sentando las bases para que los antiguos egipcios florecieran una civilización sustentada en una profunda reverencia hacia la naturaleza y los dioses.\nEn el Imperio Medio, las reformas políticas y administrativas, junto con las políticas de integración regional, se llevaron a cabo con éxito; Egipto superó crisis internas y externas y obtuvo una oportunidad de resurgimiento en el conjunto de la cultura y las artes. En este período surgieron logros sobresalientes en literatura, arte y arquitectura, elevando aún más el prestigio del país, y en todos los estratos sociales se promovió el desarrollo mediante una distribución eficiente de recursos y reformas administrativas. Con la llegada del Imperio Nuevo, un poder central fuerte se combinó con una gran capacidad militar, y Egipto, al vencer en guerras contra los estados vecinos, estableció su posición internacional. Bajo el reinado de grandes faraones como Ramsés II, la expansión territorial, la prosperidad económica y los logros culturales alcanzaron su punto máximo; apoyándose en el conocimiento y la tecnología acumulados, Egipto se posicionó como un centro cultural que ejerció una gran influencia sobre las civilizaciones del mundo. Los rituales religiosos, el arte y la arquitectura de entonces fueron valorados como logros ejemplares para las generaciones posteriores, y la forma en que todo el país operaba como un sistema orgánico unificado se convirtió en una prueba viva de un desarrollo histórico positivo.\nA partir de la conquista de Alejandro Magno en el 332 a. C., Egipto recibió la influencia de la cultura griega, y después se estableció la dinastía ptolemaica, entrando en una nueva era en la que el helenismo y la tradición egipcia se fusionaron. La dinastía ptolemaica, con Alejandría como centro, vio un gran desarrollo del saber, el arte y el comercio, y con la introducción de estilos griegos, la política, la sociedad y la cultura en su conjunto experimentaron cambios importantes. En este período, aunque los valores y costumbres tradicionales propios de Egipto se transformaron parcialmente, apareció una configuración compleja en la que ambas culturas se complementaban mutuamente. No obstante, bajo los Ptolomeos, al aumentar los conflictos políticos internos y externos y la injerencia de potencias extranjeras, también se observó que la autonomía se debilitaba gradualmente en comparación con épocas anteriores. Estos cambios fueron evaluados como un reflejo neutral de la realidad: por un lado ofrecían la posibilidad de un nuevo salto cultural como prolongación de un desarrollo positivo, y por otro, implicaban una cierta dilución de las tradiciones existentes.\nLa civilización del Antiguo Egipto, desde el inicio de su unificación, pasando por los Imperios Antiguo, Medio y Nuevo, disfrutó de una edad de oro e influyó enormemente en la cultura humana; y la transición helenística de la dinastía ptolemaica se convirtió en un punto de inflexión importante en la historia egipcia. Así, el Antiguo Egipto, tras su primera unificación, logró durante largo tiempo un desarrollo estable y grandes logros culturales, y luego, incluso en medio de la fusión cultural con potencias extranjeras, ofreció una faceta histórica en la que coexistieron los esfuerzos por preservar su tradición milenaria y la innovación."
 EGY_country_intro_content_1: "Bajo el dominio del Imperio Romano, Egipto, aunque originalmente contaba con ricas tierras graneras y un gran potencial económico, entró gradualmente en una era de estancamiento y sufrimiento debido a la política colonial romana y a la imposición de impuestos excesivos. A causa del control despiadado del sistema administrativo romano y de la explotación de recursos, la independencia económica y la autonomía cultural de Egipto se vieron fuertemente restringidas, y muchos siervos y campesinos padecieron un sufrimiento extremo, perdiendo las bases de su vida. Roma consideraba a Egipto un enclave estratégico y aplicó un control militar y administrativo férreo; en ese proceso, los valores tradicionales y la organización social egipcia fueron gravemente dañados. En estas circunstancias, Egipto perdió su soberanía, y por los impuestos abusivos de Roma y las levas frecuentes, toda la sociedad cayó en el caos.\nIncluso durante el período del Imperio Bizantino, Egipto no pudo evitar el declive económico causado por la injerencia extranjera y las divisiones internas. Amenazas militares, rebeliones frecuentes y una administración deficiente mantuvieron a la sociedad en un estado de inestabilidad prolongada, y la cultura y el arte tradicionales egipcios retrocedieron gradualmente. Bajo la presión de los sistemas romano y bizantino, Egipto se degradó durante largo tiempo a una edad oscura en la que no le quedó más opción que concentrarse en una lucha desesperada por sobrevivir, más que en el desarrollo cultural. En todos los estratos sociales prevalecieron la desigualdad y el trato injusto, y la vida del pueblo transcurrió en medio de un sufrimiento extremo y la desesperanza, mientras la antigua gloria de Egipto se iba olvidando poco a poco.\nAntes de la conquista árabe, Egipto, tal como se ha descrito, mantuvo un estado general de estancamiento debido a la explotación extranjera, los conflictos internos y la insuficiencia del sistema administrativo, asentándose una realidad sombría en toda la sociedad y la economía. El dominio coercitivo externo, los impuestos excesivos y la carga militar infligieron un sufrimiento y un descontento extremos a los egipcios, y como resultado, la sociedad egipcia fue perdiendo gradualmente su vitalidad. Esta edad oscura se prolongó hasta antes de que el Imperio Otomano pusiera un pie en la región, mostrando cómo los valores y la cultura tradicionales egipcias se vieron severamente debilitados entre conflictos internos y presiones externas. En conjunto, puede evaluarse que Egipto, en aquel entonces, perdió su autonomía económica y política y cayó durante largo tiempo en el yugo del sufrimiento y el estancamiento."
 EGY_country_intro_content_2: "Cuando Muhammad Alí asumió como gobernador de Egipto a comienzos del siglo XIX, Egipto, que estaba bajo el dominio indirecto del Imperio Otomano, comenzó a transitar de lleno el camino de la modernización. Muhammad Alí impulsó audaces políticas de reforma —reforma militar, reorganización del sistema administrativo, y reformas en economía, educación e industria—, insuflando nueva vitalidad a la sociedad egipcia. En aquel entonces, adoptó activamente la tecnología y los sistemas occidentales y se centró en transformar la estructura tradicional egipcia en un Estado moderno; como resultado, logró avances notables en poder militar y capacidad económica. En todos los estratos sociales, estas reformas fueron trayendo estabilidad, y en todo el país se introdujeron elementos de la modernidad y se expandió la infraestructura.\nDesde finales del siglo XIX hasta comienzos del XX, Egipto mostró un desarrollo vigoroso del movimiento nacionalista incluso bajo la presión imperialista de las potencias europeas. En 1919 estalló una gran revolución independentista, y este levantamiento fue un acontecimiento en el que el pueblo egipcio expresó activamente su anhelo por recuperar la soberanía y la independencia política. En este período, los egipcios desplegaron diversos movimientos independentistas e intentos políticos contra el dominio colonial británico, y estos esfuerzos empezaron a recibir una valoración positiva también en la comunidad internacional. Para los activistas independentistas, tuvo un gran significado el empeño por revitalizar las tradiciones y la cultura nacionales y por sentar las bases de autosuficiencia como Estado moderno.\nTras Muhammad Alí, Egipto, al tiempo que iba consolidando gradualmente su administración moderna y su base industrial, continuó esforzándose por recuperar una identidad propia incluso en medio de la injerencia extranjera. Se introdujeron sistemas y tecnologías occidentales en los ámbitos político, económico y cultural, y estos cambios desempeñaron un papel importante para que Egipto se consolidara como un Estado moderno. En particular, los diversos movimientos sociales e intentos políticos por la independencia influyeron positivamente en la recuperación de la soberanía egipcia, elevaron el orgullo nacional y se convirtieron en un detonante que impulsó cambios orientados al futuro. En aquel entonces, la sociedad egipcia, en una configuración compleja donde coexistían tradición y modernidad, mostró cómo, sin doblegarse ante la presión externa, emprendía esfuerzos incesantes por la independencia y ampliaba gradualmente su autonomía.\nSin embargo, los esfuerzos de Egipto entraron en una nueva fase debido al impacto del Gran Desplazamiento ocurrido en noviembre de 1935. El Imperio Británico perdió la mitad de su territorio metropolitano por la invasión de seres de otro mundo, y la independencia de Egipto quedó al alcance de la mano; pero el monstruo aparecido en el desierto junto con el Gran Desplazamiento, ‘Binah’, está consumiendo la capacidad del Estado. Mientras no aparezca un ‘salvador’ que se encargue de ellos, esto será el dolor y la prueba que Egipto deberá soportar."
 
