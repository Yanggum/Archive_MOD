 # Militar - Ejército
 EGY_army_reforms:0 "Reforma del ejército"
 EGY_army_reforms_desc:0 "En medio del caos provocado por el traslado dimensional, Egipto logró la independencia. Para hacer frente a las nuevas amenazas, debemos fortalecer nuestro poder militar. La reforma del ejército es nuestra primera tarea."

 EGY_mobile_warfare:0 "Guerra móvil"
 EGY_mobile_warfare_desc:0 "Debemos aprender las tácticas avanzadas de otro mundo y desarrollar una doctrina de guerra móvil aprovechando la inmensidad del desierto."

 EGY_shendi_horses:0 "Caballería de Shendi"
 EGY_shendi_horses_desc:0 "Una caballería que aproveche los célebres caballos de la región de Shendi aumentará enormemente la movilidad de nuestro ejército."

 EGY_royal_camel_corps:0 "Cuerpo Real de Camellos"
 EGY_royal_camel_corps_desc:0 "Las unidades de camellos que recorren el desierto serán el símbolo de nuestro ejército. Fundemos un Cuerpo Real de Camellos, reforzado aún más con la tecnología de otro mundo."

 EGY_motorized_efforts:0 "Esfuerzos de motorización"
 EGY_motorized_efforts_desc:0 "Debemos modernizar nuestro ejército introduciendo la avanzada tecnología de vehículos de otro mundo."

 EGY_desert_mobility:0 "Como el viento del desierto"
 EGY_desert_mobility_desc:0 "Aplasten al enemigo con una movilidad tan rápida e impredecible como el viento del desierto."

 # Militar - Marina
 EGY_naval_reforms:0 "Reforma de la marina"
 EGY_naval_reforms_desc:0 "Una poderosa fuerza naval que abarque el Mediterráneo y el Mar Rojo será la clave para proteger nuestra independencia."

 EGY_naval_companies:0 "Flota mercante"
 EGY_naval_companies_desc:0 "Ahora que hemos asegurado el control del canal de Suez, debemos desarrollar una sólida flota mercante para obtener beneficios económicos."

 EGY_navy:0 "Continuar la reforma de la marina"
 EGY_navy_desc:0 "Debemos introducir activamente la tecnología naval de otro mundo para reforzar aún más nuestra fuerza naval."

 EGY_expand_dockyards:0 "Expandir astilleros"
 EGY_expand_dockyards_desc:0 "Expandamos los astilleros de Alejandría y Port Said para seguir haciendo crecer nuestra flota."

 EGY_the_queen_of_the_mediteranian:0 "La reina del Mediterráneo"
 EGY_the_queen_of_the_mediteranian_desc:0 "Egipto se alzará como la nueva potencia del Mediterráneo. ¡Hasta el día en que nuestra flota domine el mar!"

 # Militar - Fuerza Aérea
 EGY_aviation_reforms:0 "Reforma de la aviación"
 EGY_aviation_reforms_desc:0 "Debemos introducir la tecnología aeronáutica avanzada de otro mundo y construir una fuerza aérea poderosa capaz de proteger nuestros cielos y aplastar al enemigo."

 EGY_pilot_training:0 "Entrenamiento de pilotos"
 EGY_pilot_training_desc:0 "Incluso el mejor avión es inútil sin un piloto experto. Formemos a nuestros jóvenes para que sean los mejores pilotos del mundo."

 EGY_expand_air_ports:0 "Expandir aeropuertos"
 EGY_expand_air_ports_desc:0 "Debemos ampliar los aeropuertos de El Cairo y Alejandría para poder alojar más aeronaves."

 EGY_aviation_industry:0 "Industria aeronáutica"
 EGY_aviation_industry_desc:0 "Nuestro objetivo es adquirir capacidad propia de producción de aeronaves utilizando la tecnología de otro mundo."

 EGY_rule_the_skies:0 "Domina los cielos"
 EGY_rule_the_skies_desc:0 "Cuando las águilas de Egipto se adueñen de los cielos de Oriente Medio, nuestros enemigos temblarán de miedo."

 # Militar - Ejército (continuación)
 EGY_grand_battle_plan:0 "Gran estrategia"
 EGY_grand_battle_plan_desc:0 "Debemos absorber el conocimiento de los estrategas de otro mundo y establecer nuestra propia gran estrategia. Una estrategia que combine la sabiduría del Nilo con el poder del desierto desconcertará a nuestros enemigos."

 EGY_expand_military_academy:0 "Expandir la academia militar"
 EGY_expand_military_academy_desc:0 "Expandamos la Academia Militar de El Cairo e invitemos instructores militares de otro mundo para formar a nuestros oficiales al más alto nivel mundial."

 EGY_planning_schools:0 "Escuelas de estrategia"
 EGY_planning_schools_desc:0 "Fundemos escuelas de estrategia únicas que combinen la teoría estratégica de otro mundo con la sabiduría del Antiguo Egipto. Aquí nacerán los estrategas del futuro."

 EGY_improve_officer_corps:0 "Mejorar el cuerpo de oficiales"
 EGY_improve_officer_corps_desc:0 "Incluso en medio del caos provocado por el traslado dimensional, nuestro cuerpo de oficiales debe volverse más fuerte. Construyamos un nuevo sistema de formación de oficiales que combine armoniosamente el conocimiento de otro mundo con nuestras tradiciones."

 EGY_general_staff:0 "Estado Mayor egipcio"
 EGY_general_staff_desc:0 "Fundemos un Estado Mayor que combine la sabiduría del faraón con la estrategia avanzada de otro mundo. Serán el cerebro del ejército egipcio y nos conducirán a la victoria."

 EGY_new_army:0 "Nuevo ejército egipcio"
 EGY_new_army_desc:0 "Ha nacido un nuevo ejército egipcio, donde se fusionan la gloria antigua y la tecnología del futuro. ¡Ahora no tememos a ningún enemigo!"

 EGY_domestic_gunsmiths:0 "Fabricación nacional de armas"
 EGY_domestic_gunsmiths_desc:0 "Es el momento de producir armas egipcias únicas y poderosas, combinando la tecnología avanzada de otro mundo con nuestra artesanía tradicional. Tan ásperas como la arena del desierto y tan afiladas como la corriente del Nilo, nuestras armas harán temblar de terror a nuestros enemigos."

 EGY_desert_training:0 "Entrenamiento de combate en el desierto"
 EGY_desert_training_desc:0 "Nuestro ejército debe aprender a luchar en el entorno implacable del desierto. Con un programa de entrenamiento que combine técnicas de supervivencia de otro mundo y la sabiduría de nuestros ancestros, nuestros soldados podrán moverse por el desierto con la misma libertad con la que un pez nada en el agua."

 EGY_labour_corps:0 "Cuerpo de trabajo"
 EGY_labour_corps_desc:0 "Heredando el espíritu de nuestros ancestros que levantaron las pirámides, creemos un Cuerpo de Trabajo moderno. Combinando la tecnología de construcción de otro mundo con nuestra perseverancia, construiremos una infraestructura sólida capaz de superar cualquier dificultad."

 EGY_strengthen_royal_gendarmerie:0 "Reforzar la gendarmería real"
 EGY_strengthen_royal_gendarmerie_desc:0 "Combinemos la tecnología de seguridad avanzada de otro mundo con nuestras formas tradicionales de mantener el orden para crear una gendarmería real poderosa y eficiente. No solo protegerán la estabilidad interna, sino que, si es necesario, también desempeñarán un papel de apoyo al ejército regular."
 # 군사 - 해군 (계속)
 EGY_defend_the_coasts:0 "Defensa costera"
 EGY_defend_the_coasts_desc:0 "Nuestro país, con una extensa línea costera a lo largo del Mediterráneo y el Mar Rojo, necesita un sólido sistema de defensa costera. Introduzcamos la tecnología defensiva de otro mundo y protejamos nuestras costas como una fortaleza inexpugnable."

 EGY_light_cruisers:0 "Desarrollo de cruceros ligeros"
 EGY_light_cruisers_desc:0 "Los cruceros ligeros, que combinan movilidad y potencia de fuego, serán un factor decisivo capaz de cambiar el equilibrio de poder en el Mediterráneo."

 EGY_submarines:0 "Fuerza submarina"
 EGY_submarines_desc:0 "Incorporemos la tecnología submarina avanzada de otro mundo y preparemos una carta estratégica para poner el canal de Suez y el Mediterráneo bajo nuestra esfera de influencia."

 EGY_marine_focus:0 "Infantería de Marina egipcia"
 EGY_marine_focus_desc:0 "Es hora de transformar a los guerreros del Nilo en combatientes del mar. La Infantería de Marina egipcia reforzará aún más nuestro dominio marítimo."

 # 군사 - 공군 (계속)
 EGY_dominate_the_sky:0 "Dominio del cielo"
 EGY_dominate_the_sky_desc:0 "Si la bendición del dios Ra y la tecnología aeronáutica de otro mundo se combinan, podremos dominar los cielos de Oriente Medio."

 EGY_fighters:0 "Investigación de cazas"
 EGY_fighters_desc:0 "Estudiemos los diseños de cazas avanzados de otro mundo y, combinándolos con nuestra artesanía tradicional, forjemos los mejores cazas del mundo."

 EGY_battle_ground_support:0 "Apoyo a las fuerzas terrestres"
 EGY_battle_ground_support_desc:0 "La superioridad aérea debe traducirse en victoria en tierra. Aseguremos que nuestras aeronaves puedan apoyar eficazmente a las fuerzas terrestres en los campos de batalla del desierto."

 EGY_bombers:0 "Investigación de bombarderos"
 EGY_bombers_desc:0 "Los bombarderos de largo alcance capaces de golpear la retaguardia enemiga nos otorgarán una ventaja estratégica. Hagamos que las águilas de Egipto se conviertan en un objeto de terror para nuestros enemigos."

 EGY_aviation_industry_investment:0 "Inversión en la industria aeronáutica"
 EGY_aviation_industry_investment_desc:0 "La producción propia de aeronaves es esencial para nuestra independencia y el fortalecimiento militar. Realicemos una inversión total en el fomento de una industria aeronáutica basada en la tecnología de otro mundo."

 # 군사 - 해군 (추가)
 EGY_grand_navy:0 "Gran Armada"
 EGY_grand_navy_desc:0 "Es hora de construir una poderosa Gran Armada que abarque el Mediterráneo y el Mar Rojo, combinando la civilización marítima del Antiguo Egipto con la tecnología naval avanzada de otro mundo."

 EGY_heavy_cruisers:0 "Desarrollo de cruceros pesados"
 EGY_heavy_cruisers_desc:0 "Cuando los cruceros pesados, portadores de la majestuosidad del faraón, surquen el Mediterráneo, nuestros enemigos temblarán de miedo. Desarrollemos cruceros pesados reforzados aún más con la tecnología de otro mundo."

 EGY_destroyers:0 "Esfuerzos en destructores"
 EGY_destroyers_desc:0 "Los destructores, rápidos y ágiles, serán la columna vertebral de nuestra armada. Forjemos flotillas de destructores tan veloces y letales como los cocodrilos del Nilo."

 # 군사 - 공군 (추가)
 EGY_air_defence_force:0 "Fuerza de defensa aérea"
 EGY_air_defence_force_desc:0 "Proteger los cielos de Egipto es nuestro deber sagrado. Construyamos una red de defensa aérea única, combinando la tecnología antiaérea de otro mundo con las características de nuestro territorio."

 EGY_egyptian_paratroopers:0 "Paracaidistas egipcios"
 EGY_egyptian_paratroopers_desc:0 "¡Guerreros de Egipto con las alas de Horus! La tecnología de operaciones aerotransportadas de otro mundo, junto con nuestros valientes soldados, dará nacimiento a la fuerza aerotransportada más poderosa de Oriente Medio."

 # 추가 중점들
 EGY_desert_warfare_expertise:0 "Especialistas en guerra del desierto"
 EGY_desert_warfare_expertise_desc:0 "El desierto es nuestra fortaleza y nuestra arma. Combinemos la sabiduría acumulada durante milenios en combate desértico con las tácticas avanzadas de otro mundo, y convirtámonos en los más fuertes en la guerra del desierto."

 EGY_suez_canal_fortification:0 "Fortificación del canal de Suez"
 EGY_suez_canal_fortification_desc:0 "El canal de Suez es nuestra línea vital. Usemos la tecnología defensiva de otro mundo para convertir el canal en una fortaleza inexpugnable, de modo que ningún invasor se atreva a codiciarlo."

 EGY_ancient_wisdom_modern_warfare:0 "Sabiduría antigua, guerra moderna"
 EGY_ancient_wisdom_modern_warfare_desc:0 "Fusionemos la sabiduría del Antiguo Egipto, que levantó las pirámides, con la tecnología moderna de guerra de otro mundo, y creemos un nuevo paradigma bélico que asombre al mundo."

 EGY_nile_delta_industry:0 "Industrialización del delta del Nilo"
 EGY_nile_delta_industry_desc:0 "Industrialicemos la fértil región del delta del Nilo con la tecnología de otro mundo y convirtámosla en el corazón de nuestra industria militar. Las armas producidas aquí protegerán nuestra independencia."

 EGY_sphinx_guardians:0 "Los guardianes de la Esfinge"
 EGY_sphinx_guardians_desc:0 "Fundemos una fuerza especial donde se combinen el misterio antiguo y la tecnología de otro mundo. 'Los guardianes de la Esfinge' protegerán los secretos de Egipto, y para los enemigos serán un objeto de terror."

 EGY_pharaohs_vengeance:0 "La venganza del faraón"
 EGY_pharaohs_vengeance_desc:0 "Egipto, que durante largos siglos estuvo bajo el dominio de potencias extranjeras, por fin ha conquistado la independencia. ¡Ahora, en nombre del faraón, es hora de blandir la hoja de la venganza contra quienes nos oprimieron!"

