 EGY_unhappy_parliament:0 "Parlamento descontento"
 EGY_unhappy_parliament_desc:0 "Aunque la Constitución de 1923 fue suspendida hace un año, el parlamento egipcio todavía no se lleva bien con el rey. Ahora que Gran Bretaña se ha sumido en el caos y la influencia británica en Egipto se ha debilitado, el Partido Wafd, mayoritario en el parlamento, está avivando aún más su determinación de impulsar reformas."
 EGY_Binah_problem:0 "El problema de 'Binah'"
 EGY_Binah_problem_desc:0 "'Binah' es una gigantesca máquina con forma de serpiente que actualmente lleva a cabo de manera constante actividades destructivas dentro del territorio egipcio. Mientras no aparezca 'alguien' capaz de inutilizar por completo a Binah, el enfrentamiento entre ese enorme destructor y el ejército egipcio continuará sin cesar.\n\nVida actual de Binah: §Y[?var:EGY_Binah_health]§!"
 EGY_Binah_action_escalate:0 "Aumento del área de actividad de Binah"
 EGY_Binah_action_destroy_infra:0 "Las fechorías destructivas de Binah"
 EGY_modernization_program:0 "Programa de modernización"
 EGY_modernization_program_desc:0 "Tras obtener la independencia de Gran Bretaña por la aparición repentina de naciones de otro mundo, nuestro país necesita una modernización acelerada. Mediante reformas en todos los ámbitos —industria, educación, ejército y más— debemos consolidar nuestra posición dentro del nuevo orden mundial."
 EGY_nile_dams:0 "Construcción de presas en el Nilo"
 EGY_nile_dams_desc:0 "El Nilo es nuestra línea vital. Si introducimos la tecnología avanzada de ese otro mundo y construimos presas, podremos aumentar la productividad agrícola y suministrar electricidad de forma estable."
 EGY_egyptian_oil:0 "Desarrollo conjunto del petróleo egipcio"
 EGY_egyptian_oil_desc:0 "Ahora que nos hemos liberado de la injerencia de las potencias occidentales, podemos emprender el desarrollo de nuestro propio petróleo. A través de la cooperación tecnológica con las naciones de otro mundo, desarrollaremos nuestros recursos petroleros de manera eficiente."
 EGY_industrialization:0 "Plan de industrialización"
 EGY_industrialization_desc:0 "Tras liberarnos del dominio británico, nuestro país tiene una base industrial propia endeble. Debemos establecer un plan de industrialización independiente, tomando como referencia los modelos de industrialización de las naciones de otro mundo."
 EGY_textile_expansion:0 "Expansión de la industria textil"
 EGY_textile_expansion_desc:0 "La calidad del algodón egipcio es famosa en todo el mundo. Ahora debemos dejar de ser un simple exportador de materias primas y renacer como un país que produce textiles de alto valor añadido."
 EGY_mechanise_cotton:0 "Mecanización de la industria algodonera"
 EGY_mechanise_cotton_desc:0 "Usemos la avanzada tecnología agrícola llegada de otro mundo para mecanizar el cultivo y el procesamiento del algodón. Con ello podremos mejorar enormemente la productividad."
 EGY_state_enterprises:0 "Fundación de empresas estatales"
 EGY_state_enterprises_desc:0 "Para competir en el nuevo orden mundial, debemos fundar empresas estatales en sectores industriales estratégicamente importantes. Con ello podremos afianzar las bases del desarrollo económico."
 EGY_red_sea_trade:0 "Impulsar el comercio del Mar Rojo"
 EGY_red_sea_trade_desc:0 "Ahora que la importancia del canal de Suez es aún mayor, debemos activar el comercio a través del Mar Rojo para convertir a nuestro país en el centro del intercambio entre Oriente y Occidente. También conviene considerar la apertura de nuevas rutas comerciales con las naciones de otro mundo."
 EGY_railroad_expansion:0 "Expansión de la red ferroviaria"
 EGY_railroad_expansion_desc:0 "Con la ayuda de la tecnología de otro mundo, construyamos una red ferroviaria nacional. Esto contribuirá en gran medida al desarrollo industrial y a la integración del país."
 EGY_egyptian_steel:0 "Construcción de una acería egipcia"
 EGY_egyptian_steel_desc:0 "Para una industrialización autónoma, la industria siderúrgica es indispensable. Construyamos una acería moderna utilizando la tecnología de otro mundo y reforcemos nuestra base industrial."
 EGY_domestic_arms:0 "Desarrollo de armas nacionales"
 EGY_domestic_arms_desc:0 "Debemos investigar y adoptar la tecnología de armas avanzadas de otro mundo para desarrollar nuestras propias armas nacionales. Esto ayudará tanto a fortalecer la defensa como a impulsar la industria armamentística."
 EGY_dockyards_of_alexandria:0 "Astilleros de Alejandría"
 EGY_dockyards_of_alexandria_desc:0 "Construyamos astilleros modernos en Alejandría, un puerto importante desde la antigüedad. Usando la tecnología de otro mundo, debemos sentar las bases para construir nuestra propia flota."
 EGY_german_weapons:0 "Adoptar armas alemanas"
 EGY_german_weapons_desc:0 "Aprovechemos la caótica situación europea provocada por la aparición de naciones de otro mundo e importemos armas de última generación desde Alemania. Con ello podremos acelerar la modernización de nuestro ejército."
 EGY_unify_electrical_standards:0 "Programa de estandarización eléctrica"
 EGY_unify_electrical_standards_desc:0 "Con la entrada de diversas tecnologías eléctricas de otro mundo, la confusión está aumentando. Debemos unificar los estándares eléctricos a nivel nacional para elevar la eficiencia industrial y acelerar la modernización."
 EGY_egyptian_cinema:0 "Impulsar la industria cinematográfica egipcia"
 EGY_egyptian_cinema_desc:0 "Impulsemos la industria del cine para ampliar nuestra influencia cultural. Podremos crear una cultura cinematográfica egipcia única incorporando diversas culturas y tecnologías de otro mundo."
 EGY_egyptian_radio:0 "Fundación de la emisora egipcia"
 EGY_egyptian_radio_desc:0 "Construyamos una red nacional de radiodifusión para usarla en la unidad del pueblo y la difusión de información. Al introducir la tecnología de radiodifusión de otro mundo, podremos crear un sistema de comunicación aún más eficaz."
 EGY_blue_nile_dams:0 "Construcción de presas en el Nilo Azul"
 EGY_blue_nile_dams_desc:0 "En cooperación con Sudán, construyamos una gran presa en el Nilo Azul. Este proyecto, apoyado en la tecnología de otro mundo, será de gran ayuda para la generación eléctrica y el riego."
 EGY_synthetic_resources:0 "Desarrollo de recursos sintéticos"
 EGY_synthetic_resources_desc:0 "Usemos la avanzada tecnología química llegada de otro mundo para construir instalaciones de producción de recursos sintéticos. Con ello podremos resolver la escasez de recursos y aumentar la competitividad industrial."
 EGY_modernise_sudan:0 "Modernización urbana"
 EGY_modernise_sudan_desc:0 "La modernización de las regiones que forman parte de Egipto es esencial para el desarrollo nacional. Usemos la tecnología para mejorar la infraestructura y promover la industrialización."
 EGY_expand_railroads:0 "Expansión meridional de la red ferroviaria"
 EGY_expand_railroads_desc:0 "Extendamos la red ferroviaria hasta el sur de Sudán para fortalecer la integración nacional y facilitar el desarrollo de recursos. Introduciendo la tecnología ferroviaria avanzada de otro mundo, podremos construir un sistema de transporte eficiente."
 EGY_invest_in_homeground:0 "Invertir en la metrópoli"
 EGY_invest_in_homeground_desc:0 "Realicemos inversiones masivas en la industria y la infraestructura del territorio egipcio. Para no quedarnos atrás en la competencia con las naciones de otro mundo, debemos reforzar aún más nuestras bases."
 EGY_airports_for_sudan:0 "Construcción de aeropuertos"
 EGY_airports_for_sudan_desc:0 "Construyamos aeropuertos modernos en las regiones egipcias para mejorar el transporte y la logística. Adoptando la tecnología aeronáutica de otro mundo, podremos establecer un sistema aeroportuario eficiente y seguro."
 EGY_resources_of_the_south:0 "Desarrollo de recursos"
 EGY_resources_of_the_south_desc:0 "Desarrollemos los abundantes recursos de las regiones egipcias. Si usamos la tecnología de extracción avanzada de otro mundo, será posible un desarrollo de recursos más eficiente y respetuoso con el medio ambiente."
 EGY_new_universities:0 "Nuevas universidades"
 EGY_new_universities_desc:0 "Establezcamos nuevas universidades para adquirir e investigar el variado conocimiento y las tecnologías de otro mundo. Con ello podremos acelerar el desarrollo científico-tecnológico de nuestro país y la formación de talento."
 EGY_egyptian_airports:0 "Ampliación de aeropuertos egipcios"
 EGY_egyptian_airports_desc:0 "Ante el aumento del intercambio con otro mundo, construyamos y ampliemos aeropuertos modernos en todo el país. Esto ayudará enormemente al desarrollo del turismo y al impulso del comercio internacional."
 EGY_new_economy:0 "Nuevo sistema económico"
 EGY_new_economy_desc:0 "En la competencia y cooperación con las naciones de otro mundo, debemos construir nuestro propio sistema económico único. Creemos un nuevo modelo económico que abarque tradición y modernidad, Oriente y Occidente, realidad y otro mundo."
 EGY_black_monday_recovery:0 "Superar la crisis económica"
 EGY_black_monday_recovery_desc:0 "Debemos superar la crisis económica mundial detonada por la aparición de naciones de otro mundo. Aprovechemos nuestra situación única para encontrar oportunidades de recuperación y descubramos nuevos motores de crecimiento."
 EGY_secure_cotton_fields:0 "Asegurar las zonas algodoneras"
 EGY_secure_cotton_fields_desc:0 "Debemos proteger y desarrollar la industria algodonera, columna vertebral de la economía egipcia. Introduzcamos la tecnología agrícola de otro mundo y centrémonos en mejorar la productividad y la calidad del cultivo."
 EGY_cotton_subsidies:0 "Subsidios a la industria algodonera"
 EGY_cotton_subsidies_desc:0 "Otorguemos subsidios a los agricultores de algodón y a las industrias relacionadas para reforzar su competitividad. Para sobrevivir en la competencia con las naciones de otro mundo, se requiere un apoyo activo del gobierno."
 EGY_secure_holdings:0 "Protección de activos"
 EGY_secure_holdings_desc:0 "En la confusa situación internacional provocada por la aparición de naciones de otro mundo, debemos proteger y estabilizar nuestros activos en el extranjero. Junto con esfuerzos diplomáticos, si es necesario también deberemos considerar una defensa militar."
 EGY_protect_industry:0 "Protección de la industria"
 EGY_protect_industry_desc:0 "Debemos proteger nuestra industria naciente de las tecnologías y productos avanzados de otro mundo. Mediante políticas arancelarias adecuadas y apoyo industrial, aumentemos la competitividad de la industria nacional."
 EGY_reopen_stock_exchange:0 "Reabrir la bolsa de valores"
 EGY_reopen_stock_exchange_desc:0 "Reabramos la bolsa de valores que fue cerrada por la crisis económica. Gestionando adecuadamente la entrada de capital de otro mundo, podremos recuperar la vitalidad de nuestra economía."
 EGY_farouks_reforms:0 "Reformas de Farouk"
 EGY_farouks_reforms_desc:0 "Implementemos las políticas de reforma lideradas por el joven rey Farouk. Necesitamos reformas equilibradas: aceptar activamente lo llegado de otro mundo, pero preservando las tradiciones egipcias."
 EGY_administrative_reforms:0 "Reforma administrativa"
 EGY_administrative_reforms_desc:0 "Liquidemos los vestigios del gobierno colonial británico y, tomando como referencia los sistemas administrativos avanzados de otro mundo, construyamos nuestro propio sistema administrativo eficiente."
 EGY_judical_reforms:0 "Reforma judicial"
 EGY_judical_reforms_desc:0 "Creemos un nuevo sistema judicial que fusione de forma armoniosa la ley islámica, el derecho moderno y los sistemas jurídicos de otro mundo. Con ello podremos materializar un Estado de derecho más justo y eficiente."
 EGY_bureaucracy_reforms:0 "Reforma del funcionariado"
 EGY_bureaucracy_reforms_desc:0 "Reformemos el ineficiente sistema burocrático del viejo orden e introduzcamos técnicas avanzadas de gestión de otro mundo para establecer un sistema burocrático moderno y transparente."
 EGY_islams_status:0 "Reafirmar el estatus del islam"
 EGY_islams_status_desc:0 "Debemos redefinir la identidad religiosa, ahora trastornada por la entrada de elementos de otro mundo. Preservando la tradición islámica, se requiere una interpretación y aplicación flexibles acordes a la nueva era."
 EGY_education_reform:0 "Reforma educativa"
 EGY_education_reform_desc:0 "Estudiemos los diversos sistemas educativos de otro mundo y establezcamos un nuevo sistema educativo que se fusione en armonía con nuestra educación tradicional. Con ello podremos formar a los talentos que guiarán el Egipto del futuro."
 EGY_finish_reforms:0 "Completar las reformas"
 EGY_finish_reforms_desc:0 "Revisemos los logros de las reformas hasta ahora, corrijamos las carencias y completemos las reformas. Ahora Egipto renacerá como un Estado moderno capaz de estar hombro con hombro con las naciones de otro mundo."
 EGY_Third_Arab_Congress:0 "Tercer Congreso Árabe"
 EGY_Third_Arab_Congress_desc:0 "En la situación de Oriente Medio, transformada por la aparición de naciones de otro mundo, la unidad de los países árabes es más importante que nunca. Celebremos el Tercer Congreso Árabe y busquemos nuevas vías de cooperación."
 EGY_Radio_Free_Cairo:0 "Radio El Cairo Libre"
 EGY_Radio_Free_Cairo_desc:0 "Establezcamos una emisora de radio dirigida a todo el mundo árabe. Usando tecnología de radiodifusión de otro mundo, podremos difundir nuestra voz por todo Oriente Medio y propagar el ideal de la unidad árabe."
 EGY_Coordinate_Al_Fatat:0 "Cooperación con Al-Fatat"
 EGY_Coordinate_Al_Fatat_desc:0 "Cooperemos con Al-Fatat, una organización panarabista nacionalista, para reforzar el movimiento de unidad árabe. Frente a la amenaza de las naciones de otro mundo, la unidad árabe se ha vuelto aún más importante."
 EGY_Coordinate_Al_Ahd:0 "Cooperación con Al-Ahd"
 EGY_Coordinate_Al_Ahd_desc:0 "Construyamos una relación de cooperación con Al-Ahd, una sociedad secreta nacionalista de Irak. Con ello podremos ampliar nuestra influencia en Mesopotamia y afianzar las bases de la unidad árabe."
 EGY_Society_Defence_Palestine:0 "Sociedad de Defensa de Palestina"
 EGY_Society_Defence_Palestine_desc:0 "Para afrontar la cuestión palestina, ahora más compleja por la aparición de naciones de otro mundo, organicemos una sociedad de defensa. Con ello podremos proteger a los árabes palestinos y ampliar nuestra influencia."
 EGY_Support_the_Imamate:0 "Apoyar al Imamato de Yemen"
 EGY_Support_the_Imamate_desc:0 "Apoyemos al Imamato de Yemen en el sur de la península arábiga para ampliar nuestra influencia en la región. Será de ayuda para proteger la independencia árabe frente a la intervención de las naciones de otro mundo."
 EGY_Liberate_Tripolitania:0 "Liberar Tripolitania"
 EGY_Liberate_Tripolitania_desc:0 "Liberemos la región de Tripolitania, en Libia, bajo el dominio de Italia. Es una buena oportunidad para ampliar nuestra influencia en el norte de África aprovechando el caos provocado por las naciones de otro mundo."
 EGY_Support_Maghrebi_Rebels:0 "Apoyar a los rebeldes magrebíes"
 EGY_Support_Maghrebi_Rebels_desc:0 "Apoyemos a los rebeldes magrebíes que luchan por la independencia del norte de África francés. Es una oportunidad para poner fin al dominio colonial francés, debilitado por la aparición de naciones de otro mundo."
 EGY_Expand_Alexandria:0 "Expandir Alejandría"
 EGY_Expand_Alexandria_desc:0 "Expandamos y modernicemos Alejandría, nuestra principal ciudad portuaria. Introduciendo la tecnología portuaria avanzada de otro mundo, podremos desarrollarla como el centro del comercio mediterráneo."
 EGY_Coordinate_Peninsula:0 "Cooperación en la península arábiga"
 EGY_Coordinate_Peninsula_desc:0 "Establezcamos relaciones de cooperación con los países de la península arábiga, incluida Arabia Saudita. Podremos responder conjuntamente a la amenaza de las naciones de otro mundo y reforzar la unidad árabe."
 EGY_Bureau_Military_Engineering:0 "Fundar la Oficina de Ingeniería Militar"
 EGY_Bureau_Military_Engineering_desc:0 "Fundemos una Oficina de Ingeniería Militar para investigar y desarrollar la avanzada tecnología militar de otro mundo. Con ello podremos modernizar nuestras fuerzas armadas y lograr autosuficiencia tecnológica."
 EGY_Operation_Abu:0 "Operación Abu"
 EGY_Operation_Abu_desc:0 "Llevemos a cabo una operación secreta para ampliar nuestra influencia en la región palestina. Frente a la intervención de las naciones de otro mundo, podremos salvaguardar los intereses árabes y reforzar nuestra posición en la región."
 EGY_Victory_Levant:0 "Victoria en el Levante"
 EGY_Victory_Levant_desc:0 "Hemos logrado afianzar nuestra influencia en la región del Levante. Ahora es el momento de usar esta región como trampolín y avanzar hacia el sueño de una mayor unidad árabe."

