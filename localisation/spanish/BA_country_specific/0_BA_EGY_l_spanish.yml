 # 이벤트
 EGY_news.1.t:0 "Camisas Azules organizadas en Egipto"
 EGY_news.1.desc:0 "La prensa política de El Cairo ha expresado recientemente su preocupación por lo que llaman las Camisas Azules: la organización juvenil del Partido Wafd, o, según algunos, una banda de matones. Afirman que, aunque se crearon para reprimir actividades antidemocráticas, el grupo se ha radicalizado y ahora amenaza el sistema democrático. Algunos medios han difundido escenas en las que las Camisas Azules ejercen violencia contra civiles, lo que ha provocado fuertes críticas dentro y fuera del país.\n\nEl Parlamento Real egipcio declaró que no hay problemas para mantener la paz, pero sectores de la academia política advierten que la inestabilidad en la política cairota se está agravando y exigen medidas contundentes. Ante las demandas de una respuesta rápida, el gobierno ha decidido desenvainar la espada y planear una investigación amplia sobre las Camisas Azules. Sin embargo, la ciudadanía se inquieta: desde el colapso del Imperio Británico, El Cairo tiembla."
 EGY_news.1.a:0 "Van tras los pasos de Weimar."

 EGY_news.2.t:0 "Firma del Acuerdo de Mansoura"
 EGY_news.2.desc:0 "Con el Partido Wafd asegurando más de la mitad del Parlamento, el rey Farouk I aprobó el plan de reforma hacia una monarquía constitucional y se firmó el 'Acuerdo de Mansoura'. Con este acuerdo, Egipto se transformó oficialmente en una monarquía constitucional, y los ciudadanos elogiaron el excelente juicio del rey.\n\nSe analiza que el Wafd, mediante compromisos con partidos menores, está consolidando aún más su base política, elevando la posibilidad de establecer una democracia de partido predominante. Expertos locales consideran el acuerdo un punto de inflexión mayor en el sistema político egipcio, y aunque también surgieron preocupaciones sobre una posible regresión democrática por la concentración del poder, el gobierno dejó claro su compromiso con la unidad nacional y el establecimiento de un orden político estable. La prensa extranjera ha mostrado reacciones mixtas, positivas y negativas, y sigue de cerca el impacto que esto tendrá en la situación interna y externa."
 EGY_news.2.a:0 "¿El inicio de la democracia africana?"

 EGY_news.3.t:0 "Declaración anticolonial"
 EGY_news.3.desc:0 "Recientemente, el gobierno egipcio anunció oficialmente una Declaración Anticolonial, expresando una postura firme contra el dominio colonial europeo.\n\nTras el exilio canadiense del Imperio Británico, y con la independencia lograda por Egipto y el África Oriental británica, Egipto ha buscado una cooperación estrecha con los estados africanos independientes. Al mismo tiempo, ha criticado abiertamente el dominio italiano sobre Etiopía y ha acogido organizaciones rebeldes anticoloniales en Europa, intensificando sus acciones de carácter anticolonial.\n\nFuncionarios del gobierno subrayaron que, mediante esta declaración, Egipto pretende afianzar su voluntad de solidaridad internacional contra el colonialismo y contribuir a la construcción de un nuevo orden internacional basado en la autonomía y la igualdad."
 EGY_news.3.a:0 "Egipto busca ser el líder de África."

 EGY_news.4.t:0 "Una alianza en Oriente Medio"
 EGY_news.4.desc:0 "Según noticias desde El Cairo, el Reino de Egipto está intensificando sus contactos diplomáticos con varios reinos independientes de la península arábiga y con los firmantes del Tratado de Saadabad, en medio de un panorama internacional en rápida transformación. Un funcionario gubernamental declaró que la estrecha cooperación con Arabia, Irán y Turquía constituye un paso importante para proteger la autonomía regional y ampliar los intercambios económicos.\n\nEste movimiento se interpreta como parte de una tendencia en la que los estados independientes de Oriente Medio se unen para garantizar su seguridad mutua y su independencia política, en un momento en que la rivalidad entre potencias se intensifica. El Ministerio de Asuntos Exteriores egipcio anunció que, en un futuro cercano, se celebrarán conversaciones para un pacto de defensa común y un refuerzo de la cooperación económica, con previsibles efectos significativos sobre el equilibrio regional."
 EGY_news.4.a:0 "Los enemigos de ayer son los aliados de hoy."

 EGY_news.5.t:0 "Camisas Verdes organizadas en Egipto"
 EGY_news.5.desc:0 "En la política de El Cairo, la reciente coalición entre la Hermandad Musulmana y el Partido Joven Egipto está causando un gran impacto. Como parte de esa cooperación, ambas fuerzas han lanzado una organización juvenil inspirada en las Camisas Negras italianas, la llamada 'Camisas Verdes'.\n\nSe enfrentan violentamente con las 'Camisas Azules' del Wafd en calles y campus, elevando la tensión política. Las Camisas Verdes enarbolan el imperialismo egipcio y el fundamentalismo islámico, y critican frontalmente al Wafd, un partido de gran coalición con tintes democráticos. Analistas políticos advierten que esta confrontación podría agravar la inestabilidad y conducir a una reconfiguración del orden político interno."
 EGY_news.5.a:0 "¿Qué forma tendrá su imperialismo?"

 EGY_news.6.t:0 "La recreación de la Marcha sobre Roma"
 EGY_news.6.desc:0 "La política de El Cairo ha sufrido un vuelco. Las 'Camisas Verdes', impulsadas por la coalición del Partido Joven Egipto y la Hermandad Musulmana, han entrado en el palacio real y, de facto, han tomado el control de la iniciativa política. Medios extranjeros han bautizado el suceso como la 'Marcha sobre El Cairo', diciendo que 'recuerda la Marcha sobre Roma de Mussolini'.\n\nEl rey Farouk I aceptó sus exigencias para evitar un choque armado, y como resultado, la política egipcia se está transformando rápidamente hacia un sistema de corte fascista. Expertos evalúan que Egipto ha renunciado de facto al orden democrático y ha entrado en una nueva forma de Estado con un fuerte tinte autoritario y de fundamentalismo islámico, con importantes repercusiones previstas para todo Oriente Medio."
 EGY_news.6.a:0 "Ha nacido la segunda compañía de Italia."

 EGY_news.7.t:0 "Proclamación del Imperio Egipcio"
 EGY_news.7.desc:0 "Otro punto de inflexión se ha abierto en la política egipcia. El rey Farouk I proclamó oficialmente el 'Imperio Egipcio' y decidió usar el título de emperador. Esta elección, distinta de títulos tradicionales como faraón, sultán o jedive, está generando no poca conmoción dentro y fuera del país.\n\nAnalistas señalan que, en medio de los intereses cruzados de diversas fuerzas, Farouk I optó por el título relativamente 'neutral' de 'emperador' en lugar de enfatizar la tradición de un grupo concreto. Se interpreta como un intento de asegurar simultáneamente la legitimidad islámica y la autoridad estatal moderna, y se prevé que provoque cambios significativos en la identidad egipcia y en sus relaciones exteriores."
 EGY_news.7.a:0 "¿Imperio? ¿Y no faraón?"

 EGY_news.8.t:0 "Golpe de Estado en Egipto"
 EGY_news.8.desc:0 "En Egipto ha ocurrido un suceso de gran magnitud que sacude la política nacional. El rey Farouk I, apoyado por el ejército, ejecutó un golpe de Estado y suspendió las funciones del parlamento. A continuación, declaró la restauración de la Constitución de 1930, anunciando de facto el retorno de la monarquía absoluta.\n\nEsta medida significa el fracaso de un intento limitado de parlamentarismo democrático, y se interpreta como el inicio de una nueva estructura de poder donde se fusionan el ejército y la corona. Expertos analizan que Farouk I eligió controlar por la fuerza la inestabilidad interna y los conflictos sociales, lo que, además de intensificar las divisiones políticas internas, podría asestar un duro golpe a la confianza externa."
 EGY_news.8.a:0 "El poder ha vuelto al rey."

 EGY_news.9.t:0 "Levantamiento de los Oficiales Libres"
 EGY_news.9.desc:0 "En Egipto, la guerra civil entre las fuerzas leales al rey y los revolucionarios de los Oficiales Libres ha comenzado de lleno. A los pocos días de que los Oficiales Libres se alzaran en armas en rechazo a la proclamación de la monarquía absoluta de Farouk I y la restauración de la Constitución de 1930, ambos bandos libran feroces combates alrededor de El Cairo y de los principales puntos militares.\n\nPor orden del rey, numerosos oficiales superiores y unidades clave del ejército regular se unieron al bando lealista; sin embargo, una parte considerable de oficiales subalternos y soldados, cargados de resentimiento acumulado durante años, se ha sumado a las fuerzas revolucionarias, y el frente se expande rápidamente. La población, movida por el rechazo a la desigualdad y a la política cortesana corrupta, también muestra apoyos a los revolucionarios, llevando el conflicto más allá de un choque de poder: se está convirtiendo en una confrontación total sobre el sistema del país."
 EGY_news.9.a:0 "¿Una república en Egipto?"

 EGY_south_africa.60.t:0 "Libertad para Angola"
 EGY_south_africa.60.d:0 "Liberados del yugo de los opresores colonialistas, el pueblo de [ANG.GetName] está listo para hacerse responsable de su propio destino. Han establecido un gobierno provisional y han redactado un borrador de constitución. Ahora solo queda transferir la autoridad de nuestro administrador militar al nuevo gobierno [ANG.GetAdjective]."
 EGY_south_africa.60.a:0 "El nuevo Estado debe ser guiado con cautela; de lo contrario, la contrarrevolución triunfará."
 EGY_south_africa.60.b:0 "¡Los recibimos con los brazos abiertos!"
 EGY_south_africa.60.c:0 "Aún no es posible permitirlo."

