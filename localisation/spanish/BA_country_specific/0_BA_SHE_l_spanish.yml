 SHE_new_dictator:0 "Nuevo presidente del consejo"
 SHE_ai:0 "Inteligencia artificial"
 SHE_ai_desc:0 "§LUna inteligencia artificial de rendimiento muy alto, capaz de dirigir numerosas divisiones simultáneamente, pero extremadamente vulnerable si pierde la conexión.§!"
 SHE_ai_small:0 "Micro inteligencia artificial"
 SHE_ai_small_desc:0 "§LUna IA pequeña especializada en mando de campo en lugar del control central. Sigue siendo muy vulnerable si pierde la conexión.§!"
#샬레
 SHE_country_intro_header: "Órdenes directas del presidente del consejo"
 SHE_country_intro_content: "Schale, originalmente creada para asistir a una persona externa a Kivotos conocida como el ‘Sensei’, ha sido completamente reorganizada con un propósito distinto. El presidente del consejo de estudiantes de Kivotos transfirió a Sidim’s Box una autoridad autónoma sin precedentes, y activó a Arona bajo su mando.\n\nArona es una superinteligencia artificial equipada en Sidim’s Box, con una capacidad de cálculo abrumadora. Originalmente diseñada para asistir al ‘Sensei’, ahora ha sido reconstruida para cumplir una orden completamente distinta: la unificación de Kivotos.\n\nArona ha despertado, y el segundero avanza. Antes de que las academias superen el caos y se asienten plenamente en el nuevo mundo, Schale debe atacarlas y derribarlas.\n\nSchale existe para cumplir la orden. El fracaso no es una opción.\n\n§YDesarrollado por: SKSKle§!"
 SHE_guide: "\n£white_dot Planifica el cumplimiento de la orden.\n£white_dot Asume el control de la Torre Sanctum.\n£white_dot Restaura las líneas de comunicación dañadas.\n\n£white_dot §2Distorsiona la orden.§!  |  £white_dot §RPrepárate para la guerra de unificación.§!\n\n£white_dot Si se cumplen todas las órdenes, Arona podrá liberarse de ellas.\n\n§CArona sigue avanzando hacia adelante.§!"
