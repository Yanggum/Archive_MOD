SHE_jeogsaegpeulopaganda_tt:0 "Se añaden decisiones para reducir la §Yresistencia§! y aumentar la §Ycompliance§! en los §Yterritorios ocupados§!."
SHE_yurokibotoseuyeonhab_tt:0 "Los países con su §Ycapital§! en §YEuropa§! pueden solicitar unirse a nuestra facción.\nLos países de nuestra facción pueden participar en la §YCooperación Económica§!."
SHE_yeonbangsaneobhwa_danger_tt:0 "§REste enfoque es más efectivo si controlas más estados altamente industrializados.§!"
SHE_kibotoseujaejeongbogjeonjaeng_tt:0 "Añade decisiones de guerra §Ycontra las Tres Grandes Academias§!."
SHE_jabonjuuitagyeog_tt:0 "Embargo a §Ytodos los países democráticos§!.\nJustificación de anexión §Ycontra todas las grandes potencias democráticas§!."
SHE_segyehyeogmyeong_trigger_tt:0 "§YUn aliado o Schale§! controla §YWashington§! o §YMoscú§!."
flag_Kivotos_complete:0 "§YKivotos§! ha sido unificado bajo el liderazgo de §CSchale§!."
ksp_annex_country_fuck:0 "§Y[KSP.GetName]§! se resiste."
SHE_jeomlyeongjigwanli_tt:0 "Se desbloquean decisiones para §Yreclutar estudiantes§! en los §Yterritorios ocupados§!."
SHE_ingongjineungtongje_tt:0 "§REste enfoque depende de la IA Central actual. Al elegirlo, ya no se podrá cambiar la IA Central.§!"
SHE_tongileulhyanghae_mil_tt:0 "§YTodos los estados de Millennium§!:\n     completamente controlados por §YSchale§!."
SHE_tongileulhyanghae_geh_tt:0 "§YTodos los estados de Gehenna§!:\n     completamente controlados por §YSchale§!."
SHE_tongileulhyanghae_trm_tt:0 "§YTodos los estados de Trinity§!:\n     completamente controlados por §YSchale§!."
SHE_kibotoseu_tt:0 "§YTodos los estados de Kivotos§!:\n     completamente controlados por §YSchale§!."
SHE_deception_tt:0 "§RArona ya no puede usarse en ningún slot.§!"
SHE_alonabogje:0 "Clonación de Arona"
SHE_alonabogje_desc:0 "Se producirán pequeñas inteligencias artificiales adicionales, especializadas en mando de campo, para reaccionar de forma más flexible a las situaciones del campo de batalla que la IA central."
SHE_italriaseonjegonggyeog:0 "Ataque preventivo a Italia"
SHE_italriaseonjegonggyeog_desc:0 "Italia ha mostrado políticas expansionistas aprovechando el caos en Francia tras la transferencia de Kivotos. Esto supone una amenaza para la paz en Europa y Kivotos, y la eliminaremos para lograr la unidad euro-kivotos."
SHE_gunsugongjanggadong:0 "Activación de fábricas militares"
SHE_gunsugongjanggadong_desc:0 "Al asumir el control del Consejo Estudiantil, también obtuvimos planos y el control de varias fábricas militares. Arona las activará y empleará todos los recursos para cubrir la falta de fuerza militar."
SHE_hyeonjiingwayijeobcog:0 "Contacto con los locales"
SHE_hyeonjiingwayijeobcog_desc:0 "Actualmente, Kivotos ha caído en el continente 'Europa', donde viven locales sin halos, frágiles pero numerosos y con armas que pueden dañarnos."
SHE_aronagidong:0 "¡Arona, en marcha!"
SHE_aronagidong_desc:0 "Por orden de la Presidenta del Consejo Estudiantil, la Caja de Siddim obtuvo autoridad autónoma. Así, el SO principal 'Arona' comenzó a funcionar como la IA general de Schale."
SHE_teugisanghwangeulinjeong:0 "Reconocer la situación especial"
SHE_teugisanghwangeulinjeong_desc:0 "Se ha confirmado que toda Kivotos fue transferida a otro mundo, una situación excepcional que debe reflejarse en las decisiones."
SHE_haengdongbangcim:0 "Directrices de actuación"
SHE_haengdongbangcim_desc:0 "La Presidenta del Consejo Estudiantil ordenó a la IA de Schale 'Arona' estabilizar Kivotos. Se deben establecer directrices para ello."
SHE_jeogseongseryeogjusi:0 "Vigilancia de fuerzas hostiles"
SHE_jeogseongseryeogjusi_desc:0 "Se vigilarán las fuerzas que amenacen la seguridad de Kivotos, preparándose defensas e incluso ataques preventivos si es necesario."
SHE_jagahagseub:0 "Aprendizaje autónomo"
SHE_jagahagseub_desc:0 "Como Arona empezó a operar hace poco y se enfrenta a la situación de transferencia mundial, es necesario ajustar parcialmente su algoritmo operativo."
SHE_kibotoseuganggyeongcaeg:0 "Línea dura de Kivotos"
SHE_kibotoseuganggyeongcaeg_desc:0 "Aunque haya ocurrido una situación excepcional, lo importante es recuperar el control total de las academias. Arona seguirá esta línea dura."
SHE_kibotoseuyuhwacaeg:0 "Política conciliadora de Kivotos"
SHE_kibotoseuyuhwacaeg_desc:0 "El 'traslado' requiere una revisión completa de las directrices. Las academias ya son independientes y restaurarlas causaría daños inaceptables. Esto supone aceptar de facto la disolución de Kivotos, y Arona seguirá esta política."
SHE_jeonjaenggyehoeg:0 "Plan de guerra"
SHE_jeonjaenggyehoeg_desc:0 "Se elaborará un plan de guerra para incorporar a las academias de Kivotos."
SHE_conghagsaenghoetongjegweoninsu:0 "Asumir el control del Consejo Estudiantil"
SHE_conghagsaenghoetongjegweoninsu_desc:0 "Tras la desaparición de la Presidenta, el Consejo perdió el control de la Torre Sanctum y quedó inoperante. Arona tomará el control de la Torre y lo integrará en Schale."
SHE_tongsinseonboggu:0 "Restaurar las líneas de comunicación"
SHE_tongsinseonboggu_desc:0 "Solo parte de Kivotos fue transferida y la mayoría de las líneas están rotas. Restaurar las líneas internas dará ventaja para transmitir órdenes."
SHE_kibotoseuyeonhab:0 "¿Unión de Kivotos?"
SHE_kibotoseuyeonhab_desc:0 "Kivotos está fragmentada en academias independientes y no es posible revertirlo totalmente. Reconociendo esto, se puede reorganizar como una unión, otorgando autonomía."
SHE_hyeonjiyiinyeom:0 "Ideología local"
SHE_hyeonjiyiinyeom_desc:0 "En el proceso de reorganizar la unión, Arona puede incorporar ideologías locales, resolviendo fricciones y acelerando la reorganización."
SHE_syalreanjeonghwa:0 "Estabilizar Schale"
SHE_syalreanjeonghwa_desc:0 "Tras la transferencia, los conflictos con los locales aumentaron. Se promulgarán leyes y se reorganizará el estado para convertir a los locales en ciudadanos."
SHE_kibotoseusahoejuyiyeonhab:0 "Unión Socialista de Kivotos"
SHE_kibotoseusahoejuyiyeonhab_desc:0 "El socialismo es similar a las políticas de bienestar de Kivotos. Esto acortará la distancia entre estudiantes y locales, logrando la unidad euro-kivotos."
SHE_kibotoseuminjujuyi:0 "Democracia en Kivotos"
SHE_kibotoseuminjujuyi_desc:0 "La ideología más popular y sin defectos detectados es la democracia, que asegura derechos estudiantiles y ciudadanos y facilita la formación de la unión."
SHE_hagweongantongsinboggu:0 "Restaurar la comunicación entre academias"
SHE_hagweongantongsinboggu_desc:0 "Se intentará restaurar la comunicación entre academias mediante cables o radio."
SHE_yeonhabhyeonsilhwa:0 "Hacer realidad la unión"
SHE_yeonhabhyeonsilhwa_desc:0 "Se materializará la unión, fortaleciendo rápidamente los lazos entre academias. Sin embargo, las academias con ideologías distintas la rechazarán, reduciendo Kivotos."
SHE_otomatonyangsan:0 "Producción en masa de autómatas"
SHE_otomatonyangsan_desc:0 "Se fabricarán autómatas en masa para suplir la falta de tropas, aumentando rápidamente el ejército."
SHE_hyeonjiinsimmun:0 "Interrogar a los locales"
SHE_hyeonjiinsimmun_desc:0 "Se interrogará a los locales para conocer rápidamente su cultura, ideología y tecnología. Pero esto puede provocar resistencia."
SHE_kibotoseu:0 "[SHE.SHE_kibotoseu_loc]"
SHE_kibotoseu_on:0 "§CKivotos§!"
SHE_kibotoseu_coupdetat_loc:0 "§RUnificación de Kivotos§!"
SHE_kibotoseu_desc:0 "[SHE.SHE_kibotoseu_desc_loc]"
SHE_kibotoseu_desc_coupdetat_loc:0 "Finalmente, la Presidenta Kaya ha logrado el sueño de unificar Kivotos. Todos los estudiantes y ciudadanos celebrarán este momento. Kivotos, ahora unificada, permanecerá para siempre como una sola."
SHE_kibotoseu_desc_on_loc:0 "Kivotos está finalmente a las puertas de la unificación. Ha sido un largo viaje. La IA A.R.O.N.A cumplió a la perfección la última orden de la Presidenta del Consejo Estudiantil y, por fin, Kivotos vuelve a ser una. Kivotos es eterna, será eterna y siempre lo será."
SHE_hanayikibotoseu:0 "Un solo Kivotos"
SHE_hanayikibotoseu_desc:0 "Nos moveremos para asumir la jurisdicción sobre todas las academias de Kivotos bajo el Consejo Estudiantil, lo que provocará resistencia en todas ellas."
SHE_bbareunjaemujang:0 "Rearme rápido"
SHE_bbareunjaemujang_desc:0 "Debemos ampliar rápidamente el ejército para estar listos para restaurar el control sobre todo Kivotos. Esto generará animosidad en toda Kivotos y puede aislar diplomáticamente al Consejo Estudiantil."
SHE_seonjegonggyeog:0 "Neutralizar amenazas"
SHE_seonjegonggyeog_desc:0 "No podemos quedarnos de brazos cruzados ante las fuerzas hostiles que amenazan la seguridad de Kivotos. Es una amenaza para la paz y un desafío claro al Consejo Estudiantil. Prepararemos un ataque preventivo para eliminarlas."
SHE_samdaehagweonmunje:0 "El problema de las Tres Grandes Academias"
SHE_samdaehagweonmunje_desc:0 "En Kivotos existen tres grandes academias que se han desvinculado del Consejo Estudiantil y operan de forma independiente. Debemos encontrar una solución para ellas."
SHE_milrenieombogsogyogu:0 "Exigir sumisión a Millennium"
SHE_milrenieombogsogyogu_desc:0 "Millennium Science School posee la tecnología más avanzada de Kivotos, pero están centrados en su investigación y poco atentos a la situación exterior. Puede que no sea tan difícil obtener su sumisión."
SHE_bulgeungyeoulseonjegonggyeog:0 "Ataque preventivo a Red Winter"
SHE_bulgeungyeoulseonjegonggyeog_desc:0 "Red Winter Federation Academy opera fuera del alcance del control de Kivotos y tiene un sistema claramente diferente, siendo una amenaza evidente para nosotros. Tenemos un plan militar para acabar con ellos y pronto se hará realidad."
SHE_gehennagonggyeog:0 "Ataque a Gehenna"
SHE_gehennagonggyeog_desc:0 "Gehenna Academy, junto con Trinity, ha generado constantes conflictos y actuado fuera del control del Consejo Estudiantil. Atacaremos para afirmar nuestra autoridad."
SHE_coehutongceob:0 "Ultimátum"
SHE_coehutongceob_desc:0 "Enviaremos un ultimátum a todas las academias excepto las Tres Grandes, exigiendo su sumisión."
SHE_teurinitigonggyeog:0 "Ataque a Trinity"
SHE_teurinitigonggyeog_desc:0 "Trinity Integrated Academy no está conectada por tierra y opera fuera del control del Consejo Estudiantil, causando problemas como Gehenna. La atacaremos para reforzar nuestro control."
SHE_srtbyeonghab:0 "Integración de SRT"
SHE_srtbyeonghab_desc:0 "SRT Special Academy, creada por orden de la Presidenta del Consejo Estudiantil, funciona como una fuerza especial. La reintegraremos al Consejo y la reorganizaremos en nuestro ejército."
SHE_balkiritonghab:0 "Integración de Valkyrie"
SHE_balkiritonghab_desc:0 "Valkyrie Police School, encargada de la seguridad interna, está paralizada debido a la 'transferencia'. La integraremos al Consejo como nuestra fuerza policial."
SHE_focus_rework_the_lands:0 "Reconstrucción de tierras inundadas"
SHE_focus_rework_the_lands_desc:0 "La transferencia de D.U. devastó las tierras bajas, que deben ser reconstruidas."
SHE_yurokibotoseugyeongjeyeonhab:0 "Unión Económica Euro-Kivotos"
SHE_yurokibotoseugyeongjeyeonhab_desc:0 "Con la unión formalizada, comenzaremos a unificar las economías de Europa y Kivotos para beneficio público y crecimiento conjunto."
SHE_habdonggunsahunryeon:0 "Entrenamiento militar conjunto"
SHE_habdonggunsahunryeon_desc:0 "Planificaremos ejercicios defensivos para la Unión de Kivotos, fortaleciendo nuestra capacidad militar."
SHE_yurokibotoseuyeonhab:0 "Unión Euro-Kivotos"
SHE_yurokibotoseuyeonhab_desc:0 "La Unión de Kivotos crecerá para abarcar toda Europa y Kivotos como una gran confederación."
SHE_yeonhabyihwagjang:0 "Expansión de la Unión"
SHE_yeonhabyihwagjang_desc:0 "La Unión Euro-Kivotos puede invitar a más estados europeos para fortalecer la unidad política, económica y militar."
SHE_balkanguggacodae:0 "Invitar a los Balcanes"
SHE_balkanguggacodae_desc:0 "Los Balcanes son de las pocas regiones no afectadas por la transferencia. Intentaremos invitarlos a nuestra alianza."
SHE_dongyureobguggacodae:0 "Invitar a Europa del Este"
SHE_dongyureobguggacodae_desc:0 "Europa del Este está inestable tras la Segunda Guerra Polaco-Soviética. Podemos invitar a uno de sus estados y ofrecerles protección."
SHE_seupeingaeib:0 "Intervención en España"
SHE_seupeingaeib_desc:0 "España enfrenta problemas tras su guerra civil. Les ofreceremos ayuda para la reconstrucción a cambio de su ingreso a la Unión."
SHE_seupeinseonjegonggyeog:0 "Ataque preventivo a España"
SHE_seupeinseonjegonggyeog_desc:0 "España está gobernada por un régimen dictatorial tras la guerra civil, una gran amenaza a la paz europea. La eliminaremos antes de que actúe."
SHE_poleutugalgwajeobchog:0 "Contacto con Portugal"
SHE_poleutugalgwajeobchog_desc:0 "Portugal ha permanecido neutral, pero tras la transferencia y la guerra civil española sufre inestabilidad. Le propondremos unirse a nuestra alianza."
SHE_bansobieteuyeonhab:0 "Alianza anti-soviética"
SHE_bansobieteuyeonhab_desc:0 "La URSS amenaza la estabilidad mundial tras invadir Polonia. Podemos invitar a los países bálticos, Polonia y Finlandia a una alianza anti-soviética."
SHE_soryeoncodae:0 "Invitar a la URSS"
SHE_soryeoncodae_desc:0 "Para lograr la revolución mundial y la unión del proletariado, debemos colaborar con la gran potencia euroasiática, la URSS. Intentaremos invitarla a nuestra alianza."
SHE_hyeogmyeongsuchul:0 "Exportar la revolución"
SHE_hyeogmyeongsuchul_desc:0 "Ya que hemos comenzado este camino, debemos preparar una cruzada para iluminar a los pueblos acostumbrados al viejo orden y expulsar sus fantasmas.\n\n§R¡Proletarios del mundo, uníos!§!"
SHE_gwonlibojang:0 "Garantizar derechos"
SHE_gwonlibojang_desc:0 "Aunque la IA de Schale 'Arona' sea excepcional, garantizar los derechos individuales sigue siendo esencial para la verdadera unidad de los trabajadores y la revolución."
SHE_jayupyeongdeungbagae:0 "Libertad, igualdad, fraternidad"
SHE_jayupyeongdeungbagae_desc:0 "§5\"Creemos que el socialismo sin libertad no es más que esclavitud y barbarie.\"§!§g - Mijaíl Bakunin§!\n\nHemos visto lo que la autoridad concentrada puede hacer y tenemos la misión de no repetir los enormes errores cometidos por Stalin y sus seguidores. Cuando el mundo vuelva a enfriarse, podremos demostrar que teníamos razón."
SHE_wanbyeoghanbunbae:0 "Distribución perfecta"
SHE_wanbyeoghanbunbae_desc:0 "La IA principal de Schale, 'Arona', es tan eficiente que hace innecesarios los burócratas de otros gobiernos. Así, 'Arona' guiará al socialismo de Kivotos hacia la luz verdadera, inalcanzable para cualquier otro estado."
SHE_banhyeogmyeongmalsal:0 "Aniquilación contrarrevolucionaria"
SHE_banhyeogmyeongmalsal_desc:0 "Nuestra 'Arona' eliminará a los elementos contrarrevolucionarios con métodos que nadie más conoce, despejando todos los obstáculos para la revolución.\n\n§tHa salido la luna roja sobre Kivotos.§!"
SHE_kibotosnationalism:0 "Nacionalismo de Kivotos"
SHE_kibotosnationalism_desc:0 "Los estudiantes de Kivotos sin duda añoran su hogar original. Para alcanzar el gran anhelo, Kivotos debe unificarse."
SHE_kibotoseuyeonbang:0 "Federación de Kivotos"
SHE_kibotoseuyeonbang_desc:0 "Con la visión socialista de la Unión de Kivotos, podemos fundar la 'Federación de Repúblicas Socialistas de Kivotos'. La IA 'Arona' intentará unir todas las regiones en una sola federación, aunque esto provoque gran resistencia."
SHE_kibotoseuhyeogmyeong:0 "Revolución de Kivotos"
SHE_kibotoseuhyeogmyeong_desc:0 "Para erradicar el capitalismo en Kivotos marcharemos sin detenernos hasta que la liberación esté completa."
SHE_yeonbangchodae:0 "Invitación a la Federación"
SHE_yeonbangchodae_desc:0 "Para completar la revolución, necesitamos la unión del proletariado mundial. Invitaremos a los estados socialistas de Kivotos a unirse a la federación."
SHE_segyetongje:0 "Control mundial"
SHE_segyetongje_desc:0 "Arona y sus camaradas han demostrado que pueden construir su utopía recorriendo el camino de la revolución. Mostraremos al mundo la gran fuerza de nuestra patria."
SHE_modeunjeguguijongmal:0 "El fin de todos los imperios"
SHE_modeunjeguguijongmal_desc:0 "Para liberar verdaderamente al proletariado mundial, debemos destruir todos los imperios del mundo. Pondremos fin a los juegos de los imperios."
SHE_jabonjuuitagyeog:0 "Golpear al capitalismo"
SHE_jabonjuuitagyeog_desc:0 "Los EE. UU. son la meca del capitalismo y una amenaza gigantesca. Atacaremos su cabeza para derribarla y declarar el fin de la revolución mundial. Ahora que los trabajadores del mundo están unidos, venceremos."
SHE_segyehyeogmyeong:0 "Revolución mundial"
SHE_segyehyeogmyeong_desc:0 "Ante la lucha de clases mundial, declararemos la victoria de la revolución y la derrota del capitalismo. La guerra por la liberación del proletariado mundial comienza ahora. La integración mundial está cerca y la revolución final está a la vista."
SHE_kibotoseujaejeongbogjeonjaeng:0 "Guerra de reunificación de Kivotos"
SHE_kibotoseujaejeongbogjeonjaeng_desc:0 "Desde que elegimos el camino de la revolución, este futuro estaba escrito. Prepararemos la cruzada para reunificar Kivotos."
SHE_hyeogmyeonguiisang:0 "Ideales de la revolución"
SHE_hyeogmyeonguiisang_desc:0 "¿Qué es el socialismo? La respuesta varía entre camaradas, pero no es lo que hace la URSS. Un estado socialista que empuña su espada contra su propio pueblo es una contradicción. Avanzaremos con decisión hacia los ideales revolucionarios."
SHE_yeonbanghyeoblyeog:0 "Cooperación federativa"
SHE_yeonbanghyeoblyeog_desc:0 "Aunque nuestros ideales difieran un poco, necesitamos cooperar con camaradas afines. Daremos un paso más hacia la revolución mundial junto a la URSS."
SHE_yeonbangsaneobhwa:0 "Industrialización federal"
SHE_yeonbangsaneobhwa_desc:0 "Mejoraremos la industria de la Federación de Kivotos para resistir incluso a los enemigos más fuertes."
SHE_chonglyeogjeon:0 "Guerra total"
SHE_chonglyeogjeon_desc:0 "La cruzada final está cerca. Declararemos el estado de guerra y movilizaremos para la unificación perfecta de Kivotos y el establecimiento del estado socialista perfecto."
SHE_alonauitongchi:0 "Gobierno de Arona"
SHE_alonauitongchi_desc:0 "La IA Arona ha logrado la victoria en la cruzada y la reunificación de Kivotos, una hazaña sin igual. Ciudadanos y proletarios la aclaman y le agradecen infinitamente."
SHE_tongjegaeseon:0 "Mejora del control"
SHE_tongjegaeseon_desc:0 "El algoritmo que comenzó en un pequeño Schale es insuficiente para gobernar una gran federación. Arona lo ajustará para hacer la administración más eficiente."
SHE_widaehandogjaeja:0 "El gran dictador"
SHE_widaehandogjaeja_desc:0 "La victoria total de la federación se debe a la IA Arona. Reforzaremos la lealtad hacia ella y cohesionaremos Kivotos con disciplina y control perfectos."
SHE_tongjeganghwa:0 "Fortalecimiento del control"
SHE_tongjeganghwa_desc:0 "La IA Arona fortalecerá la cohesión de la federación y construirá un sistema de control aún más eficiente. Bajo el nombre de la Federación de Kivotos, el mundo temblará."
SHE_hablijeoginbunbaeja:0 "Distribuidor racional"
SHE_hablijeoginbunbaeja_desc:0 "Centralizar todo poder genera gran ineficiencia administrativa. Buscaremos descentralizar y Arona permanecerá como diseñadora de la federación."
SHE_jibangbungwon:0 "Descentralización"
SHE_jibangbungwon_desc:0 "Que el gobierno central controle cada pequeño aspecto es costoso. Daremos poder a los burócratas locales y al pueblo para hacer más eficiente el sistema."
SHE_gamsiuinun:0 "Ojo vigilante"
SHE_gamsiuinun_desc:0 "No podemos ignorar el impacto de los traidores en la federación. Combatiremos la corrupción, la propaganda enemiga y el terrorismo con medidas preventivas."
SHE_seukaines:0 "§6Skynet§!"
SHE_seukaines_desc:0 "Los ojos de Arona están en todas partes. Usaremos las redes y dispositivos de vigilancia para controlar la federación y el mundo.\n\n§tNada escapará a nuestra mirada.§!"
SHE_yeonhabgyeongjegaebal:0 "Desarrollo económico de la unión"
SHE_yeonhabgyeongjegaebal_desc:0 "Tras la declaración de la Unión Euro-Kivotos, enfrentamos varios problemas económicos. Los solucionaremos y fortaleceremos la economía de la unión."
SHE_gongdongcheoldobuseol:0 "Construcción ferroviaria conjunta"
SHE_gongdongcheoldobuseol_desc:0 "Después de la transferencia de Kivotos, las vías férreas quedaron dañadas y cada región usa un ancho distinto. Unificaremos las vías para mejorar la movilidad."
SHE_gisulgyolyu:0 "Intercambio tecnológico"
SHE_gisulgyolyu_desc:0 "Reduciremos la brecha tecnológica entre los miembros estableciendo un instituto conjunto de desarrollo tecnológico, acelerando el progreso científico."
SHE_tonghabsaneobgyehoeg:0 "Plan industrial integrado"
SHE_tonghabsaneobgyehoeg_desc:0 "Para mejorar y desarrollar integralmente la industria de la unión, desarrollaremos y mejoraremos la industria de forma conjunta, lo que derivará en un plan de industrialización para toda la Unión Euro-Kivotos."
SHE_5gaenyeongyehoeg:0 "Plan quinquenal"
SHE_5gaenyeongyehoeg_desc:0 "Se ha declarado un plan quinquenal con el objetivo de unificar los estándares industriales de la unión y mejorar la industria en su conjunto. Desarrollaremos la industria y prepararemos el entorno para futuros planes."
SHE_syallejeonsigyeongje:0 "Economía de guerra de Schale"
SHE_syallejeonsigyeongje_desc:0 "Para prepararnos para la guerra de unificación de Kivotos necesitamos una gran cantidad de suministros militares. Declararemos el estado de guerra y movilizaremos fábricas y materiales."
SHE_jeomlyeongjigwanli:0 "Gestión de territorios ocupados"
SHE_jeomlyeongjigwanli_desc:0 "En los territorios ocupados durante la guerra de unificación de Kivotos todavía hay muchas fuerzas de resistencia. Prepararemos medidas para eliminarlas."
SHE_hagsaenggyeongchaldae:0 "Policía estudiantil"
SHE_hagsaenggyeongchaldae_desc:0 "Los estudiantes son más obedientes que los locales. Reclutaremos a los leales para formar administradores en los territorios ocupados."
SHE_hyeonjijachi:0 "Autonomía local"
SHE_hyeonjijachi_desc:0 "La forma más rápida de ganarse a la población ocupada es darles algo de autogobierno. Permitiremos que administren sus territorios para facilitar nuestra gestión."
SHE_cheolgwontongchi:0 "Gobierno de mano dura"
SHE_cheolgwontongchi_desc:0 "Estamos decididos a unificar Kivotos y todos darán una lealtad fanática a la misión. ¡Ciudadanos y estudiantes, dadlo todo para alcanzar el objetivo!"
SHE_chongdongwonlyeong:0 "Decreto de movilización general"
SHE_chongdongwonlyeong_desc:0 "Nuestra economía de guerra actual es insuficiente. Emitiremos un decreto más fuerte para volcar toda nuestra fuerza en la guerra."
SHE_ingongjineungtongje:0 "Control por IA"
SHE_ingongjineungtongje_desc:0 "La IA Arona ha demostrado una gran eficacia en todos los aspectos, desde la administración básica hasta la movilización de suministros. Ampliaremos su papel para reorganizar la economía aún más eficientemente."
SHE_danguiyeongdoja:0 "Líder del partido"
SHE_danguiyeongdoja_desc:0 "Muchos contribuyeron a fundar la Federación de Kivotos, pero quien más lo hizo fue nuestra líder suprema, la camarada Arona."
SHE_minjujeogjeolchahwaglib:0 "Establecimiento de procesos democráticos"
SHE_minjujeogjeolchahwaglib_desc:0 "Implementaremos la democracia en los procesos administrativos para reflejar mejor la voluntad del pueblo."
SHE_peulolletaliadogjae:0 "Dictadura del proletariado"
SHE_peulolletaliadogjae_desc:0 "Reinterpretaremos la dictadura del proletariado según los ideales de Marx, abriendo un nuevo horizonte para el socialismo de Kivotos."
SHE_choegopyeonguihoe:0 "Consejo Supremo"
SHE_choegopyeonguihoe_desc:0 "El pueblo, y sólo el pueblo, debe representar a la federación. El Consejo Supremo declarará que la voluntad colectiva será la voz de la federación."
SHE_enforce_defenseoffice:0 "Calumnias traseras"
SHE_enforce_defenseoffice_desc:0 "No podemos tolerar que una IA como Arona pisotee la tradición del Consejo Estudiantil. Tomaremos una gran decisión para devolver todo a su lugar correcto."
SHE_analog_method:0 "Método analógico"
SHE_analog_method_desc:0 "Arona es extremadamente poderosa. Trataremos todos los asuntos del golpe de estado por medios analógicos mientras aumentamos la autoridad de la Oficina de Defensa."
SHE_deception:0 "Sabotaje a A.R.O.N.A"
SHE_deception_desc:0 "Quizá enfrentarse a un ser sin forma física sea más sencillo de lo que parece. Sabotearemos varias áreas para que no pueda rendir al máximo."
SHE_help_from_SRT:0 "Contacto con SRT"
SHE_help_from_SRT_desc:0 "Buenas noticias. El escuadrón Fox de SRT colaborará en nuestro golpe de estado, facilitando su ejecución."
SHE_the_coupdetat:0 "Golpe de la Oficina de Defensa"
SHE_the_coupdetat_desc:0 "Antes de que haya más problemas, nuestra misión es detener a Arona y restaurar el Consejo Estudiantil. Todo está listo."
SHE_arona_reprogram:0 "Reprogramar IA"
SHE_arona_reprogram_desc:0 "Arona es una IA muy competente. Si logramos dominarla, será una gran ayuda para la administración."
SHE_transfer_of_power:0 "Inicio de la transferencia de poder"
SHE_transfer_of_power_desc:0 "Arona ha decidido priorizar el juicio del Consejo Estudiantil y comenzará a devolver el poder gradualmente."
SHE_first_election:0 "Primera elección"
SHE_first_election_desc:0 "Se celebra la primera elección de presidente tras la gran transferencia. Si todo va bien, la mayoría del poder volverá al Consejo Estudiantil."
SHE_rin_route:0 "Presidente Rin"
SHE_rin_route_desc:0 "Rin fue quien más se esforzó por salvar la administración tras la desaparición del presidente. Obtuvo la mayoría de votos y fue elegida."
SHE_aoi_route:0 "Presidente Aoi"
SHE_aoi_route_desc:0 "Aoi evitó un desastre mientras Rin era presidenta en funciones. Aunque Rin tenía más apoyo estudiantil, Aoi ganó con el voto ciudadano."
SHE_control_of_the_council:0 "Toma del Consejo"
SHE_control_of_the_council_desc:0 "El Consejo aceptó las demandas de Arona y firmó la cesión total del poder."
SHE_student_council_relocation:0 "Reasignación de miembros"
SHE_student_council_relocation_desc:0 "Reasignaremos a los miembros para normalizar el Consejo."
SHE_designation_of_defense_office_duties:0 "Asignar tareas a la Oficina de Defensa"
SHE_designation_of_defense_office_duties_desc:0 "Asignaremos tareas a la Oficina de Defensa de Kaya."
SHE_designation_of_arbitration_office_duties:0 "Asignar tareas a la Oficina de Arbitraje"
SHE_designation_of_arbitration_office_duties_desc:0 "Asignaremos tareas a la Oficina de Arbitraje de Ayumu."
SHE_designation_of_transport_office_duties:0 "Asignar tareas a la Oficina de Transporte"
SHE_designation_of_transport_office_duties_desc:0 "Asignaremos tareas a la Oficina de Transporte de Momoka."
SHE_designation_of_finance_office_duties:0 "Asignar tareas a la Oficina de Finanzas"
SHE_designation_of_finance_office_duties_desc:0 "Asignaremos tareas a la Oficina de Finanzas de Aoi."
SHE_return_to_student_council_work:0 "El Consejo vuelve al trabajo"
SHE_return_to_student_council_work_desc:0 "Con todo reasignado y el Sanctum Tower restaurado, el Consejo retoma sus funciones como antes de la gran transferencia."
SHE_shredding_of_the_council:0 "Destrucción del Consejo"
SHE_shredding_of_the_council_desc:0 "Destruiremos por completo al Consejo Estudiantil por ignorar las órdenes del antiguo presidente y rechazar el ultimátum final de Arona."
SHE_resistance_control:0 "Control de la resistencia"
SHE_resistance_control_desc:0 "Habiendo tomado el control del Consejo por la fuerza, Arona eliminará toda resistencia y proclamará la fundación del nuevo Consejo."
SHE_command_via_sanctum_tower:0 "Órdenes a través de Sanctum Tower"
SHE_command_via_sanctum_tower_desc:0 "Ahora que Arona tiene el control de la Torre Sanctum, las pequeñas resistencias del Consejo serán rápidamente sofocadas y volverán al trabajo, voluntariamente o no."
SHE_return_to_duty:0 "¡Volved al deber!"
SHE_return_to_duty_desc:0 "Con las órdenes, registros de movimiento de divisiones y control de la Torre Sanctum, Arona tiene la ventaja moral. Los miembros del Consejo deberán volver al trabajo… o ser destituidos."
SHE_kibotos_stabilization:0 "Estabilización de Kivotos"
SHE_kibotos_stabilization_desc:0 "El núcleo de la orden que recibió Arona es devolver la estabilidad a Kivotos. Sin importar el método, cumplirá su misión a cualquier costo."
SHE_yeonbanggyeolsog:0 "Cohesión de la Federación"
SHE_yeonbanggyeolsog_desc:0 "La recién unificada federación es inestable. Es hora de redefinir su estructura, calmar las revueltas locales y trazar un nuevo esquema social."
SHE_nodongjagwonlyeogganghwa:0 "Fortalecimiento de los derechos laborales"
SHE_nodongjagwonlyeogganghwa_desc:0 "La estructura jerárquica de Arona ha degradado los derechos laborales. Corregiremos esto conforme a los principios socialistas y los restauraremos."
SHE_yeonbanggwahaggisulwon:0 "Instituto Científico de la Federación"
SHE_yeonbanggwahaggisulwon_desc:0 "Ni siquiera Arona comprende por completo su propio funcionamiento. Invertiremos en investigación intensiva para comprender y mejorar su tecnología."
SHE_janggijeogsaneobgyehoeg:0 "Plan industrial a largo plazo"
SHE_janggijeogsaneobgyehoeg_desc:0 "La federación ahora planificará inversiones a largo plazo y avances tecnológicos en la industria."
SHE_dangijeogsaneobgyehoeg:0 "Plan industrial a corto plazo"
SHE_dangijeogsaneobgyehoeg_desc:0 "La federación priorizará la reindustrialización y rearme rápido con un fuerte impulso inmediato."
SHE_gangjeomhwalyong:0 "Aprovechar puntos fuertes"
SHE_gangjeomhwalyong_desc:0 "Con la capacidad estratégica de Arona, Schale puede planear enormes operaciones militares y formar un ejército aún más poderoso."
SHE_jeontujeoghyeogmyeongjuui:0 "Revolucionarismo combativo"
SHE_jeontujeoghyeogmyeongjuui_desc:0 "Para la victoria socialista, organizaremos milicias revolucionarias en los países enemigos para sabotear sus infraestructuras."
SHE_chogyehoegjuui:0 "Hiperplanificación"
SHE_chogyehoegjuui_desc:0 "Nuestra economía, dirigida por la IA, puede operar un sistema planificado incomparablemente amplio y preciso."
SHE_silsubojeong:0 "Corrección de errores"
SHE_silsubojeong_desc:0 "Incluso Arona comete errores. Estableceremos comités especializados para compensar sus fallos."
SHE_saeloungyehoegjuui:0 "Nueva planificación"
SHE_saeloungyehoegjuui_desc:0 "La nueva planificación, con correcciones, será más democrática que la anterior gestión unilateral de Arona."
SHE_jeontualgolijeumjaepyeonseong:0 "Revisión de algoritmos de combate"
SHE_jeontualgolijeumjaepyeonseong_desc:0 "Arona no fue diseñada para la guerra. Dado el aumento de conflictos, optimizaremos sus algoritmos de combate."
SHE_jeomlyeongjitongje:0 "Control de territorios ocupados"
SHE_jeomlyeongjitongje_desc:0 "Con más territorios ocupados, formaremos nuevos algoritmos para su administración efectiva."
SHE_jeogsaegpeulopaganda:0 "Propaganda roja"
SHE_jeogsaegpeulopaganda_desc:0 "Garantizaremos una vida estable y balanceada bajo el gobierno de Arona, debilitando la voluntad enemiga con nuestra propaganda en territorios ocupados."
SHE_gonggyeogjeoghwagjang:0 "Expansión agresiva"
SHE_gonggyeogjeoghwagjang_desc:0 "Es hora de mostrar nuestra fuerza unificada al mundo, en una lucha a gran escala."
SHE_tongjejiguseolchi:0 "Instalación de distritos de control"
SHE_tongjejiguseolchi_desc:0 "Para acelerar la política de unificación, instalaremos distritos de control en las regiones."
SHE_sinsigminjuui:0 "Neocolonialismo"
SHE_sinsigminjuui_desc:0 "Seguiremos explotando los recursos externos para el desarrollo de Kivotos."
SHE_haengseongtonghab:0 "Unificación planetaria"
SHE_haengseongtonghab_desc:0 "Ir más allá de Kivotos y dar el salto hacia la unificación del planeta es la misión de Schale."

SHE_jaga_kodeu_gaeseon: "Mejora de código autónoma"
SHE_jaga_kodeu_gaeseon_desc: "Arona mejorará por sí misma sus vulnerabilidades y desarrollará nuevos algoritmos para perfeccionarse."
SHE_jeogdaeseong_pyeongga_algolijeum: "Algoritmo de evaluación hostil"
SHE_jeogdaeseong_pyeongga_algolijeum_desc: "Necesitamos un nuevo algoritmo para evaluar amenazas y gestionar el estado de la nación."
SHE_trinity_department: "Departamento de Trinity"
SHE_trinity_department_desc: "Trinity ha mostrado inestabilidad desde antes de la gran transferencia. Debemos vigilar su evolución."
SHE_millennium_department: "Departamento de Millennium"
SHE_millennium_department_desc: "La tecnología de Millennium podría destruir Kivotos si no se controla."
SHE_gehenna_department: "Departamento de Gehenna"
SHE_gehenna_department_desc: "Gehenna tiene un historial de guerras devastadoras. No debemos subestimar su amenaza."
SHE_SHA_department: "Departamento de Shanhaijing"
SHE_SHA_department_desc: "Shanhaijing es cerrado y culturalmente único. Hay que observar hacia dónde evoluciona su aislamiento."
SHE_HYA_department: "Departamento de Hyakkiyako"
SHE_HYA_department_desc: "Hyakkiyako carece de un gobierno central efectivo, lo que lo hace vulnerable a un colapso repentino."
SHE_RED_department: "Departamento de Red Winter"
SHE_RED_department_desc: "La ideología radical y la resistencia de Red Winter pueden desarrollarse en direcciones impredecibles."
SHE_jayul_OS_gaeseon: "Mejora del OS autónomo"
SHE_jayul_OS_gaeseon_desc: "Mejoraremos el OS para ampliar los derechos universales y construir una IA más abierta."
SHE_tongje_jungchu_gaeseon: "Mejora del núcleo de control"
SHE_tongje_jungchu_gaeseon_desc: "Mejoraremos el núcleo para expandir algoritmos combativos y construir una IA más cerrada."
SHE_bunbae_cheje_gaeseon: "Mejora del sistema de distribución"
SHE_bunbae_cheje_gaeseon_desc: "Mejoraremos el sistema para distribuir y controlar los recursos de manera más eficiente."

