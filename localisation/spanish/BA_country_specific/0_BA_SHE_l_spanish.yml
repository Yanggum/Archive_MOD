l_spanish:

 #샬레 이벤트#
 SHE_yeonhabhyeonsilhwa_tt: "Desbloquea una §Ydecisión£decision_icon_small§! para invitar a naciones afiliadas a §YKivotos§! a nuestra §Yesfera de influencia§!."
 SHE_puppet_flag:0 "§RZona bajo control§!"
 kivotos_hardline_tt:0 "§YNosotros§! elegiremos la §Rlínea dura§!."
 kivotos_appeasement_tt:0 "§YNosotros§! elegiremos la §Gpolítica conciliatoria§!."
 kivotos_hardline:0 "§CArona§! ha elegido la §Rlínea dura§!."
 kivotos_appeasement:0 "§CArona§! ha elegido la §Gpolítica conciliatoria§!."
 SHE_event.1.t:0 "Decisión"
 SHE_event.1.desc:0 "Debido a la anomalía en Kivotos, todas las comunicaciones se han interrumpido y las academias han establecido sus propias facciones independientes. En otras palabras, Kivotos se ha fracturado. `Arona`, la IA de Schale activada por orden de la presidenta del consejo estudiantil, está evaluando opciones para cumplir su última directiva: estabilizar Kivotos."
 SHE_event.1.a:0 "Lo ocurrido no puede deshacerse."
 SHE_event.1.b:0 "No queremos un Kivotos roto."
 SHE_event.2.t:0 "7ª Reunión del Comité Ejecutivo - Tema urgente"
 SHE_event.2.desc:0 ""... ¿Es esto real, secretaria?" Nanagami Rin revisó el informe con visible desconcierto. El resumen era claro: 'Arona', la IA principal de Schale, afirmaba actuar bajo órdenes de la presidenta desaparecida y exigía la fusión unilateral de Schale con el consejo estudiantil, proclamándose su sucesora legítima. Rin conocía la existencia secreta de Schale, pero ¿una IA exigiendo control? Aunque las IA de Kivotos son avanzadas, Arona no destacaba especialmente.\n\nSiguiendo protocolo, Rin convocó una reunión de emergencia. Mientras se preparaba, investigó y descubrió que Arona había recibido energía de forma irregular, lo que podía causar malfunciones. Sin embargo, la presidenta ignoró esos reportes. ¿Era esto realmente su voluntad? Rin sintió un nudo en la garganta. Al ser llamada, se dirigió a la sala de reuniones.\n\nAl subir al podio, Rin respiró hondo. Sabía que no era una 'superhumana', y debía hablar con cuidado. 'Lamento la urgencia, pero el motivo de esta reunión es...'"
 SHE_event.2.a:0 ""... Es por la voluntad de la presidenta.""
 SHE_event.2.b:0 ""... Es por un malfuncionamiento de la IA.""
 has_trait_COU_power_struggle:0 "§R¡Si no completamos el foco de normalización administrativa a tiempo, enfrentaremos graves restricciones para oponernos a Schale!§!"
 SHE_event_2_c_tt:0 "§R¡Al no completar el foco a tiempo, la fusión será inevitable!§!"
 SHE_event.3.t:0 "Aceptación del consejo estudiantil"
 SHE_event.3.desc:0 "El consejo estudiantil ha admitido su caos y aceptado fusionarse con Schale."
 SHE_event.3.a:0 "Bien."
 SHE_event.4.t:0 "Rechazo del consejo estudiantil"
 SHE_event.4.desc:0 "El consejo estudiantil ha rechazado la fusión, reafirmando su soberanía. Esto obstaculizará los planes de Schale."
 SHE_event.4.a:0 "Entonces, será guerra."
 SHE_event.5.t:0 "Propuesta de unión a la Federación"
 SHE_event.5.desc:0 "Esta mañana, Schale nos propuso unirnos a la Federación de Kivotos. Argumentan que, para completar la revolución proletaria, las academias socialistas deben unirse."
 SHE_event.5.a:0 "Buena idea."
 SHE_event.5.b:0 "Rechazadlo."
 SHE_event.6.t:0 "[FROM.GetName] acepta"
 SHE_event.6.desc:0 "[FROM.GetName] ha aceptado unirse a la Federación, apoyando nuestra causa."
 SHE_event.6.a:0 "Bienvenido, camarada."
 SHE_event.7.t:0 "[FROM.GetName] rechaza"
 SHE_event.7.desc:0 "[FROM.GetName] ha rechazado la Federación. Seguirán su propio camino."
 SHE_event.7.a:0 "Lo sabía, reaccionarios."
 SHE_event.8.t:0 "[SHE.GetName] intenta anexionarnos"
 SHE_event.8.desc:0 "Hemos descubierto que [SHE.GetName] planea reintegrar nuestra academia bajo su control. Debemos decidir si resistir o someternos."
 SHE_event.8.a:0 "No nos rendiremos fácilmente."
 SHE_event.8.b:0 "Será la voluntad de la presidenta."
 SHE_event.9.t:0 "[KSP.GetName] resiste"
 SHE_event.9.desc:0 "[KSP.GetName] ha cortado comunicaciones y declarado hostilidad. La guerra es inevitable."
 SHE_event.9.a:0 "Esto se complica."
 SHE_event.10.t:0 "Ultimátum de [SHE.GetName]"
 SHE_event.10.desc:0 "[SHE.GetName] exige nuestra sumisión. ¿Preparamos la guerra o aceptamos?"
 SHE_event.10.a:0 "Preparad la guerra."
 SHE_event.10.b:0 "Por un Kivotos unido."
 SHE_event.11.t:0 "[FROM.GetName] resiste"
 SHE_event.11.desc:0 "[FROM.GetName] ha rechazado nuestro ultimátum, desplegando tropas en nuestra frontera. Debemos prepararnos para la guerra por un Kivotos unificado."
 SHE_event.11.a:0 "Avanzad."
 SHE_event.12.t:0 "[FROM.GetName] se somete"
 SHE_event.12.desc:0 "[FROM.GetName] ha declarado su no hostilidad a través de canales diplomáticos. Hemos obtenido derechos de paso fronterizo, influencia administrativa y otros privilegios."
 SHE_event.12.a:0 "Estarán a salvo."
 SHE_event.13.t:0 "Ultimátum de [SHE.GetName]"
 SHE_event.13.desc:0 "[SHE.GetName] ofrece garantizar investigación libre post-unificación si cooperamos. ¿Aceptamos su control o nos preparamos para la guerra?"
 SHE_event.13.a:0 "Preparad la guerra."
 SHE_event.13.b:0 "¿Con que podamos investigar es suficiente, no?"
 SHE_event.14.t:0 "[FROM.GetName] se vuelve hostil"
 SHE_event.14.desc:0 "[FROM.GetName] ha rechazado el ultimátum y movilizado tropas. La guerra por la unificación es inevitable."
 SHE_event.14.a:0 "Esto ha salido mal."
 SHE_event.15.t:0 "[FROM.GetName] coopera"
 SHE_event.15.desc:0 "[FROM.GetName] ha aceptado colaborar en la unificación. Se les ha asignado un rol específico en el proceso, manteniendo la cooperación tras la integración."
 SHE_event.15.a:0 "Estarán a salvo."
 SHE_event.16.t:0 "Golpe en [FROM.GetName]"
 SHE_event.16.desc:0 "Kaya, directora de defensa del consejo estudiantil, ha liderado un golpe en [FROM.GetName]. ¿Abandonamos su facción o permanecemos?"
 SHE_event.16.a:0 "Bienvenida, nueva presidenta."
 SHE_event.16.b:0 "Buscaremos nuestro propio camino."
 SHE_event.17.t:0 "[FROM.GetName] abandona la facción"
 SHE_event.17.desc:0 "[FROM.GetName] ha denunciado nuestro golpe y se ha separado de nuestra esfera de influencia."
 SHE_event.17.a:0 "No los necesitábamos."
 SHE_event.18.t:0 "[FROM.GetName] se une a la Federación"
 SHE_event.18.desc:0 "Nuestra nación matriz, [FROM.GetName], ha ingresado a la Federación Kivotos. Nuestro control ahora depende de esta entidad."
 SHE_event.18.a:0 "¿Algún problema con eso?"
 SHE_event.18.b:0 "¿Una oportunidad para independizarnos?"
 SHE_event.18.RED:0 "¡Ahora somos la Nueva Escarlata Invierno!"
