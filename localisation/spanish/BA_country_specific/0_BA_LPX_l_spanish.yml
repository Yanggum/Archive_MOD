### Descripciones de líderes
LPX_gehenna_school_committee_leader_desc: "El Comité Civil de Gehenna es una administración civil provisional destinada a implantar el orden y el sistema de gobierno de Gehenna en estas tierras. Operará bajo un liderazgo colectivo hasta que se nombre a un administrador civil definitivo."

LPX_local_committee_leader_desc: "El Comité Civil es una administración provisional destinada a implantar el orden y el sistema de gobierno de Luxemburgo en estas tierras. Operará bajo un liderazgo colectivo hasta que se nombre a un administrador civil definitivo."

### Líderes locales
LPX_napoleon_leader_desc: "Con la restauración de la monarquía francesa impulsada desde Luxemburgo, el regreso de los Bonaparte al trono francés se ha convertido prácticamente en un hecho consumado. Los expertos consideraban imposible que la Casa de Borbón gobernara Francia incluso con el retorno de la monarquía, dadas las particularidades de la familia Rikuhachima, y así fue. El último consorte de la Casa de Nassau, antigua familia ducal de Luxemburgo, pertenecía a los Borbones, lo que llevó a algunas facciones anti-Rikuhachima a afirmar que, tras la extinción de la casa ducal, los Borbones tenían derecho a la sucesión. La incorporación forzada de un Bonaparte, cuya influencia en Francia se había desvanecido tras la caída de Napoleón III, parece responder a estas razones políticas.\n\nSea cual sea el motivo, Napoleón VI obtuvo el derecho a gobernar como emperador de la Federación Millennium-Francia, liderando a dos pueblos. En su coronación en Notre Dame, proclamó su determinación de unir las civilizaciones de Kivotos y Europa y de liberar cuanto antes a Francia del control administrativo de la Sociedad de Naciones."

LPX_karl_albrecht_leader_desc: "Karl Albrecht von Habsburg fue nombrado líder del Mandato de la Sociedad de Naciones en Polonia por decisión del gobierno de Luxemburgo. Se estima que la administración del mandato durará entre 20 y 30 años, y él no espera vivir para ver la independencia polaca. No obstante, lo importante es que Polonia ha obtenido como líder a un valiente ‘rey soldado’, firmemente opuesto al nazismo, que luchará por los intereses nacionales y las libertades de los ciudadanos durante el mandato."

LPX_vasyl_vyshyvanyi_leader_desc: "Vasyl Vyshyvanyi, también conocido como Wilhelm Franz von Habsburg, un archiduque austríaco que luchó por la independencia de Ucrania, ascendió al trono como monarca de una Ucrania con libertades limitadas bajo el mandato de la Sociedad de Naciones. Tras su coronación en Kiev, estableció la primera dinastía Habsburgo ucraniana. Aún es incierto cuánto perdurará su reino, y el pueblo ucraniano observa su gobierno con una mezcla de esperanza y preocupación."

LPX_vladimir_kirillovich_leader_desc: "A Vladímir Kirílovich se le negó la restauración como ‘Zar de toda Rusia’ por parte de la administración civil, reconociéndosele únicamente el título de ‘Duque del Principado de Moscú’. Esta decisión responde a una política destinada a fragmentar Rusia e impedir su reunificación permanente. Aun así, en privado Vladímir se autodenomina zar y actúa no como un subordinado servil de la administración civil, sino como un símbolo de la dignidad rusa."

LPX_george_bagration_leader_desc: "La Casa Bagration había perdido su poder hace mucho tiempo, pero ahora ha recuperado una nueva autoridad bajo el mandato de la administración civil. El nuevo monarca de Bagration aspira a establecer un nuevo orden en todo el Cáucaso bajo la administración del Mandato de la Sociedad de Naciones."

LPX_karl_gero_leader_desc: "Karl Gero, conde de Württemberg, se alistó en la Wehrmacht alemana en 1935, pero su carrera militar fue breve debido a la Gran Transición. Cuando el Mandato de la Sociedad de Naciones asumió el control de los países bálticos, la administración civil decidió entronizar a un monarca, y él obtuvo la autoridad para gobernar como líder del mandato báltico con el apoyo de dicha administración."

### Eventos
LPX.leader_event.ARU.t: "Nombramiento del líder de la administración civil"
LPX.leader_event.ARU.desc: "[ROOT.GetLeader] es el Estado dominante del mandato y posee la autoridad para seleccionar al líder civil del Mandato de la Sociedad de Naciones. Aunque se requiere una aprobación formal de la Sociedad de Naciones, carecen tanto del poder como de la voluntad para oponerse a nuestra decisión.\n\nLa primera opción es la más racional: enviar a un funcionario de origen Kivotos y mantener la estructura actual, sustituyendo únicamente al gobernador general. Dado que [ROOT.GetLeader] pertenece a Kivotos, esta opción será considerada razonable incluso en el ámbito político.\n\nSin embargo, no pueden ignorarse las demandas de las facciones monárquicas locales de Luxemburgo. En especial, los monárquicos que apoyan fervientemente a Rikuhachima Aru tras la Gran Transición consideran el mandato como una oportunidad para ‘difundir una monarquía liberal al mundo bajo el liderazgo de Rikuhachima’. Dado que son la única fuerza que exige un líder local, elegir a un líder autóctono equivale a entronizar a un duque, rey o emperador en el territorio ocupado.\n\nEn cualquier caso, la decisión recae en [ROOT.GetLeader]."
LPX.leader_event.ARU.a: "Naturalmente, Kivotos seguirá administrándolo."
LPX.leader_event.ARU.b: "¿Los monárquicos quieren una monarquía? ¡Pues que así sea!"

LPX.leader_event.HINA.t: "Nombramiento del líder de la administración civil"
LPX.leader_event.HINA.desc: "[ROOT.GetLeader] es el Estado dominante del territorio ocupado y posee la autoridad para seleccionar a su líder civil. La cuestión clave es a quién designar como administrador. El Comité de Disciplina nunca ha visto con buenos ojos la participación política local, por lo que es casi seguro que se enviará a un funcionario de Kivotos.\n\nLa decisión se reduce a si se enviará a un miembro interno del Comité de Disciplina para administrar el territorio de forma casi militar, o a un funcionario civil de Kivotos para una gestión relativamente moderada. En cualquier caso, no podrán rechazar nuestra elección."
LPX.leader_event.HINA.a: "Por supuesto, el Comité de Disciplina debe encargarse."
LPX.leader_event.HINA.b: "Enviad a un funcionario civil. No habrá fricciones con los locales."
