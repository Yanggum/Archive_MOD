### Espíritus nacionales
LPX_parliament: "Parlamento de [ROOT.GetName]"
LPX_parliament_desc: "Un parlamento con poderes limitados bajo la aprobación de la Sociedad de Naciones. Fue establecido para garantizar la autonomía local con miras a una independencia futura en varias décadas. No posee competencias en defensa ni en política exterior."
LPX_gehenna_culture: "Gehennización"
LPX_gehenna_culture_desc: "La cultura local se irá asimilando gradualmente a la cultura de Gehenna. Este territorio será ‘ajustado’ adecuadamente para convertirse en una colonia permanente de Gehenna."
LPX_pseudo_science: "Departamento de Pseudociencia"
LPX_pseudo_science_desc: "El Departamento de Pseudociencia ha tomado la iniciativa dentro de Millennium, ralentizando considerablemente el desarrollo científico y tecnológico."
LPX_derussianization: "Desrusificación"
LPX_derussianization_desc: "El Comité de Disciplina ha denominado ‘Volga’ a la nueva administración militar-civil establecida en Moscú. Se trata de un intento deliberado de borrar la identidad rusa mediante una política de desrusificación. En última instancia, esta tierra deberá ser gehennizada y el nacionalismo eslavo erradicado.\n\nPor supuesto, no se rendirán fácilmente."
LPX_establishment_of_government_idea: "Establecimiento de un nuevo gobierno"
LPX_establishment_of_government_idea_desc: "El nuevo gobierno inculcará los valores del nuevo gobernante al pueblo de [ROOT.GetName]. Puede verse no como liberación, sino como otra forma de opresión… pero ese es el derecho del vencedor."
LPX_post_war_reconstruction_idea: "Comité de reconstrucción"
LPX_post_war_reconstruction_idea_desc: "Un comité creado para reconstruir la patria devastada por la guerra tras el establecimiento del gobierno de [ROOT.GetName]."
LPX_promotion_of_suburban_development_idea: "Desarrollo suburbano"
LPX_promotion_of_suburban_development_idea_desc: "La avanzada tecnología de tractores de Kivotos ha incrementado la productividad agrícola en las zonas suburbanas, introduciendo parcialmente granjas inteligentes."
LPX_assimilation_work: "Asimilación político-cultural"
LPX_assimilation_work_desc: "La afinidad política y cultural con la metrópoli se está intensificando."

