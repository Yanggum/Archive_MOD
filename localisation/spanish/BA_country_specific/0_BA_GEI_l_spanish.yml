 GEI_Beatrice_win_flag:0 "§OBeatrice§! ha triunfado"
 GEI_Secure_Royal_Blood:0 "§9La Sangre Real ha sido asegurada.§!"
 GEI_Fail_Royal_Blood:0 "§tEl escuadrón Arius ha huido.§!"
 GEI_loyeolbeulleodeuhwagbo_tt:0 "Se desbloquean decisiones de §Ybúsqueda§!, §Ycontacto§! y §Ysecuestro§! para asegurar la §9Sangre Real§!."
