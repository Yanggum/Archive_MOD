 #Personajes
 rpakxmfldk:0 "Traje negro"
 GEI_Beatrice:0 "Beatrice"
 GEI_The_Colour_character:0 "§0El Color§!"
 GEI_kuroko:0 "Sunaookami Shiroko"
 GEI_prena_sensei:0 "Frenápates"
 GEI_ARONA:0 "A.R.O.N.A."
 GEI_DEC_decagramaton:0 "Decagramatón"

 # Eventos
 GEI_event.1.t:0 "Choque de opiniones"
 GEI_event.1.desc:0 "Los miembros de Gematria están actualmente enfrascados en un acalorado debate bajo el tema de «¿quién tomará la iniciativa?». Aun después de varias horas, cada uno mantiene firmemente su postura... Tras aproximadamente medio día, finalmente parece haberse alcanzado una conclusión. La ganadora del debate es..."
 GEI_event.1.a:0 "...Beatrice ha ganado."
 GEI_event.1.b:0 "...Decagrammaton ha irrumpido."
 GEI_Beatrice_tt:0 "§OBeatrice§! §Yganará§! el debate."
 GEI_event.2.t:0 "Gran éxito"
 GEI_event.2.desc:0 "El Escuadrón Arius aceptó nuestra propuesta sin la menor sospecha. Hemos logrado traerlos a Gematria, y el control del Escuadrón Arius ahora pertenece por completo a Gematria."
 GEI_event.2.a:0 "Bueno, está bien."
 GEI_event.2.b:0 "Solo necesitamos la Sangre Real."
 GEI_event.3.t:0 "Éxito"
 GEI_event.3.desc:0 "Intentamos contactar con el Escuadrón Arius, pero rechazaron nuestra oferta y respondieron de forma hostil. Beatrice y las fuerzas de combate lograron derrotarlos y capturar viva a la Sangre Real."
 GEI_event.3.a:0 "Objetivo cumplido"
 GEI_event.4.t:0 "Fracaso"
 GEI_event.4.desc:0 "Tras el enfrentamiento con el Escuadrón Arius, nuestras fuerzas fueron derrotadas. El Escuadrón Arius huyó del anexo de Arius hacia un destino desconocido, y Gematria ha perdido por completo su rastro."
 GEI_event.4.a:0 "Reanudar la persecución."
 GEI_event.5.t:0 "Aseguramiento de la Sangre Real completado"
 GEI_event.5.desc:0 "Las fuerzas de persecución de Gematria localizaron al Escuadrón Arius y entraron en combate. Acaban de informar de la victoria y de que la Sangre Real ha sido asegurada. Ahora podemos dar el primer paso del ritual en favor de los ideales de Beatrice."
 GEI_event.5.a:0 "Por fin la atrapamos."
 GEI_event.6.t:0 "Huida del Escuadrón Arius"
 GEI_event.6.desc:0 "Las fuerzas de persecución de Gematria localizaron al Escuadrón Arius y entraron en combate, pero el Escuadrón logró romper el cerco y escapar. No obstante, este incidente nos permitió estimar su radio de acción, por lo que en adelante la persecución será mucho más eficiente."
 GEI_event.6.a:0 "No podrán escapar."
 GEI_event.7.t:0 "Avistamiento"
 GEI_event.7.desc:0 "Ha llegado información sobre el avistamiento de individuos que se cree pertenecen al Escuadrón Arius en una ciudad no muy alejada del anexo de Arius. Usaremos esta información para estrechar el cerco y localizar su posición con mayor rapidez."
 GEI_event.7.a:0 "Los encontramos."
 GEI_event.8.t:0 "Rendición de Hakari Atsuko"
 GEI_event.8.desc:0 "Hoy a las 4 a. m., Hakari Atsuko se rindió bajo la condición de que dejemos de perseguir al resto del Escuadrón Arius. No era el resultado previsto, pero dado que la Sangre Real ya ha sido asegurada, podemos detener la persecución y pasar a la fase de ejecución del ritual."
 GEI_event.8.a:0 "No es malo."
 GEI_event.8.b:0 "Aun así, debemos eliminarlos."
 GEI_event.9.t:0 "Fin de la operación"
 GEI_event.9.desc:0 "- El Cuartel General de Gematria notifica a todas las fuerzas de combate que la operación militar especial en curso ha concluido.\n- Dado que la Sangre Real ha sido asegurada y ya no hay razón para continuar, se declara el fin de la operación.\n\nFirmado en la residencia de Gematria, [GetDateText].\n -Beatrice"
 GEI_event.9.a:0 "Un éxito rotundo"
 GEI_event.10.t:0 "El primer ritual"
 GEI_event.10.desc:0 "\"¿Ni siquiera esto es suficiente...?\"\n\nEn la oscuridad de un edificio antiguo resonó la voz de una mujer. Era la voz de una figura anómala que, de pie bajo la luz que atravesaba vitrales multicolores en la Basílica de Arius —el santuario designado que permanecía en pie pese a la 'Gran Transición'—, pronunciaba aquellas palabras.\n\n\"...\"\n\nGuardó silencio. Tras un rato, como si hubiera ordenado sus pensamientos, se levantó y comenzó a dirigirse hacia algún lugar. Dado que las cosas habían llegado a este punto, ya no podía quedarse inmóvil; tendría que actuar."
 GEI_event.10.a:0 "Ha surgido un problema."
 GEI_event.11.t:0 "Contacto"
 GEI_event.11.desc:0 "\"Ah. Por fin. El final del ritual está a la vista.\"\n\nCon las ventanas cubiertas y la iluminación artificial encendida, Beatrice, vestida con una bata de laboratorio, habló en la Basílica de Arius, rodeada de innumerables equipos de investigación.\n\n\"¿Para qué... por qué he llegado hasta aquí? Kivotos ha desaparecido y todo lo que conocía se ha trastocado, y aun así...\"\n\nBeatrice reflexionaba en voz alta, lanzando preguntas sin respuesta al vacío. Sin embargo, ya había tomado una decisión. Con una determinación inquebrantable, no tardó en llegar a una conclusión.\n\n\"Pero allí... hay un camino.\""
 GEI_event.11.a:0 "Solo podemos avanzar."
 GEI_event.12.t:0 "Debate sobre el Estado"
 GEI_event.12.desc:0 "\"Es decir, no deberíamos asumir el rol de un gobierno.\"\n\nEl Hombre del Traje Negro expuso su opinión. Sostiene que Gematria debe seguir siendo una institución de investigación, mientras que Beatrice argumenta, basándose en su experiencia administrando el Distrito Autónomo de Arius, que Gematria debe gobernar un Estado.\n\n\"...¿Entonces propones no intervenir en esta situación?\"\n\"No, lo que digo es que nuestro deber es...\"\n\"Ja. ¿Acaso nuestro deber no perdió sentido en el momento en que cruzamos a este mundo?\"\n\n..."
 GEI_event.12.a:0 "Beatrice ha logrado una victoria tras mucho tiempo."
 GEI_event.13.t:0 "Debate sobre la política económica"
 GEI_event.13.desc:0 "Tras decidir gobernar el Estado conforme a la propuesta de Beatrice, Gematria se enfrenta ahora a una dificultad. Nadie tiene experiencia gestionando una 'economía', lo que ha generado problemas al definir políticas nacionales.\n\nHmm... ¿no podríamos pedir asesoría económica al Káiser?"
 GEI_event.13.a:0 "Bien, ejecútalo de inmediato."
 GEI_event.14.t:0 "Asegurar la fuerza militar"
 GEI_event.14.desc:0 "\"¡Para afrontar esta situación caótica necesitamos más poder militar!\"\n\nBeatrice, la voz más dura en el debate, alzó la voz. En contraste, Golconde y Decalcomania replican que sus fuerzas clonadas son suficientes para garantizar la defensa.\n\n\"¿No dije ya que con mis habilidades puedo proteger Gematria sin problemas?\"\n\"¡Eso significa que son pocos en número! ¡Los ejércitos de este mundo son abrumadoramente numerosos! Estamos en desventaja.\"\n\"Pero las Islas Británicas son islas, ¿no? No creo que se necesite un ejército tan grande.\"\n\n..."
 GEI_event.14.a:0 "La postura de Beatrice parece correcta."
 GEI_event.14.b:0 "Los ejércitos leales de Golconde y Decalcomania siempre han sido nuestra fuerza."
 GEI_event.15.t:0 "Una anomalía"
 GEI_event.15.desc:0 "\"Madame, ¿qué demonios ha hecho? ¿Esto... puede detenerse?\"\n\"...\"\n\"Ya veo. El Color nos ha encontrado.\"\n\nEn el laboratorio subterráneo, frente al perforador dimensional, los miembros de Gematria discuten acaloradamente sobre los resultados del 'experimento de perforación dimensional' de Beatrice. Beatrice, aferrándose a su cuerpo ya corrompido, no logra pronunciar palabra.\n\n\"Entonces, ¿hay alguna solución?\"\n\"...El pasaje sigue expandiéndose. Ha escapado por completo a nuestro control.\"\n\"Madame, este experimento es un fracaso evidente. No es momento de buscar culpables, debemos evacuar de inmediato...\"\n\nEn ese instante, un estruendo ensordecedor resuena, y luego... ya no hay nadie.\n\n..."
 GEI_event.15.a:0 "NOT DATA"
 GEI_event.16.t:0 "Invasión"
 GEI_event.16.desc:0 "Contenido provisional: algo sobre un sanctum del vacío cayendo del cielo sobre Gematria."
 GEI_event.16.a:0 "NOT DATA"
 GEI_event.17.t:0 "Alucinación colectiva"
 GEI_event.17.desc:0 "Tras un resplandor intenso que iluminó el cielo, la mayoría solo sufrió un leve dolor de cabeza, pero algunos mostraron confusión mental y una agresividad extrema. Pronto formaron grupos y comenzaron a atacarnos."
 GEI_event.17.a:0 "Ataque psíquico..."
 GEI_event.18.t:0 "Más allá del mar"
 GEI_event.18.desc:0 "La luz del Color ha comenzado a cruzar el Atlántico e iluminar Norteamérica. Se siente que el verdadero fin del mundo se acerca poco a poco."
 GEI_event.18.a:0 "..."
 GEI_event.19.t:0 "Los Apóstoles de las Vestiduras Amarillas"
 GEI_event.19.desc:0 "Mientras nuestras fuerzas luchan en el frente, han empezado a llegar informes inquietantes desde la retaguardia. Individuos vestidos de amarillo, que se autodenominan apóstoles, han comenzado a aparecer."
 GEI_event.19.a:0 "Investiga qué está ocurriendo."
 GEI_event.19.b:0 "¡Nuestro dios nos espera!"
 GEI_event_19_tt:0 "§0En la posterior cadena de eventos, jugarás del lado de los Cultistas Amarillos durante la guerra civil.§!"
 GEI_event.20.t:0 "La Marcha Amarilla"
 GEI_event.20.desc:0 "Apóstoles vestidos de amarillo han realizado marchas por todo Estados Unidos. Activos desde hace meses, su número ha crecido considerablemente. Durante las marchas ocuparon avenidas principales, pronunciando palabras incomprensibles y provocando un caos militar significativo. Estas acciones han obstaculizado las operaciones militares estadounidenses, dificultando cada vez más la respuesta a los ataques del Color."
 GEI_event.20.a:0 "¿Qué es lo que realmente quieren?"
 GEI_event.21.t:0 "§0La lucha contra los lunáticos§!"
 GEI_event.21.desc:0 "Estos lunáticos, que se autodenominan Apóstoles de las Vestiduras Amarillas, han crecido en número bajo el liderazgo de Lovecraft. Aunque estaban bajo vigilancia de máximo nivel por parte del gobierno federal, llegamos tarde.\n\nComo parte de un plan para doblegar a Estados Unidos —una nación que ha soportado páginas enteras de la historia—, derrocaron por la fuerza gobiernos estatales y proclamaron una segunda declaración de independencia dentro de la Unión, iniciando una rebelión.\n\nTras esta rápida sucesión de eventos, el colapso de la Unión se acerca peligrosamente, amenazando a América y, más allá, al mundo entero.\n\nExigen la rendición inmediata al Color, calificando al presidente [USA.GetLeader] de apóstata y anticristo. Además, el '§0Consejo Apostólico§!' que han formado ha comenzado a enfrentarse al ejército federal, declarando inaceptable cualquier acción militar del gobierno.\n\nEn conclusión, los disparos vuelven a resonar en el continente americano, y millones que hasta ayer compartían bailes y comida ahora toman las armas para defender sus banderas.\n\nEl destino de Estados Unidos... solo el tiempo lo dirá."
 GEI_event.21.a:0 "¡A las armas!"
 GEI_event.22.t:0 "Propagación de la locura"
 GEI_event.22.desc:0 "Varios estados vecinos se han unido a los rebeldes lunáticos, y hemos fracasado en contener la expansión de la demencia."
 GEI_event.22.a:0 "Maldita sea."
 GEI_event.25.t:0 "Un general afectado mentalmente"
 GEI_event.25.desc:1 "Por razones de inestabilidad mental, el general [From.GetName] ha presentado su dimisión. Aunque fue rechazada debido a la situación de emergencia, circulan rumores de que su estado mental es realmente preocupante.\n\nParece que nuestro enemigo tiene la capacidad de inducir locura en los humanos."
 GEI_event.27.t:0 "Estados Unidos exiliado"
 GEI_event.27.desc:0 ""
 GEI_event.27.a:0 "¿Nos queda algo?"
