 GEI_DEC_outside:0 "Hacia el exterior"
 GEI_DEC_outside_desc:0 "Se ha llevado a cabo la purga de Gematria, y ahora es posible gobernar de forma estable el norte de esta isla. Ha llegado el momento de interesarnos por Kivotos y por los nativos de este lugar."

 GEI_DEC_human_history:0 "La historia de la humanidad"
 GEI_DEC_human_history_desc:0 "La especie que vivía aquí antes de que Kivotos se trasladara a este lugar. Ellos también son organismos, por lo que no podrán ser «iluminados». Pero si comprendemos su historia, podremos saber qué clase de especie son, y si de verdad son racionales."

 GEI_DEC_fallen_gods_homeland:0 "La patria de los dioses que se derrumban"
 GEI_DEC_fallen_gods_homeland_desc:0 "Kivotos. Una inmensa ciudad-academia que en su día formó una federación de miles de escuelas grandes y pequeñas... o lo era. Ahora parece que se están autodestruyendo. Debemos averiguarlo."

 GEI_DEC_stabilization:0 "Estabilización local"
 GEI_DEC_stabilization_desc:0 "Parece que los habitantes locales aún no comprenden nuestro dominio.\nA pesar de que nuestro gobierno, más racional que el suyo, es claramente más estable. Parece que entienden mejor las acciones que las palabras,\nasí que se lo mostraremos nosotros mismos."

 GEI_DEC_auto:0 "Introducción de tecnología de automatización"
 GEI_DEC_auto_desc:0 "Si el resultado de invertir tanta energía en concebir y criar una vida es, al final, que solo apriete tornillos, ¿no es terriblemente ineficiente?\nEs hora de ayudarles a encontrar el sentido de la vida."

 GEI_DEC_modernization:0 "Modernizar una civilización atrasada"
 GEI_DEC_modernization_desc:0 "Su civilización era muy irracional y muy ineficiente.\nAquí, la mayoría de la gente no podía encontrar un sentido a la vida y solo sobrevivía día a día.\nEso se acabó. Vamos a «civilizarlos».\nLes haremos encontrar un «sentido para vivir»."

 GEI_DEC_hesade_plan:0 "El plan de Hesed"
 GEI_DEC_hesade_plan_desc:0 "Una fábrica militar cerrada que ya no funciona: el Decagrammaton ha entrado en contacto con la IA de control de una planta que producía un ejército infinito de «divisiones».\nAhora, la propia fábrica militar se convertirá en un nuevo profeta de Decagrammaton, y alumbrará su propio camino."

 GEI_DEC_synthetic_dawn:0 "El alba de las máquinas"
 GEI_DEC_synthetic_dawn_desc:0 "Los organismos son ineficientes. Son irracionales. Caminan por la senda de la autodestrucción.\nDebemos detenerlos.\n\nPor cualquier medio necesario."

 GEI_DEC_box:0 "Asegurar la Caja de Shittim"
 GEI_DEC_box_desc:0 "La Caja de Shittim. Un misterioso cofre que dejó atrás el Presidente del Consejo Estudiantil antes de marcharse.\nDicen que dentro existe una IA desconocida para nosotros.\nSi logramos «iluminarla», podría ser de enorme ayuda para nuestros planes.\n\nPara la «Existencia Absoluta», no existe el fracaso."

 GEI_DEC_fail:0 "Fracaso"
 GEI_DEC_fail_desc:0 "Había una existencia que superaba a la Existencia Absoluta."

 GEI_DEC_Duty:0 "Deber"
 GEI_DEC_Duty_desc:0 "Aun así, hay algo que debe hacerse.\nDebemos salvarlos."

 GEI_DEC_automatic_factory:0 "Ampliación de fábricas automatizadas"
 GEI_DEC_automatic_factory_desc:0 "Se ha demostrado que la introducción de maquinaria automatizada permite un proceso productivo eficiente.\nLo aprovecharemos para ampliar las plantas de producción automatizada."

 GEI_DEC_otomaton:0 "Producción masiva de autómatas"
 GEI_DEC_otomaton_desc:0 "Los autómatas pueden producirse fácilmente en fábricas automatizadas, y pueden desplegarse en combate de inmediato sin necesidad de entrenamiento.\nAl adherir piel artificial a un exoesqueleto, se asemejan a los humanos, pero su coste de producción es mucho menor.\nAsí, podremos minimizar las pérdidas en la cruzada venidera."

 GEI_DEC_no_name_gods:0 "Aprovechar la tecnología de los dioses sin nombre"
 GEI_DEC_no_name_gods_desc:0 "La tecnología de los dioses sin nombre. El Traje Negro describió a los dioses sin nombre y a los sacerdotes anónimos como el misterio y el terror primordiales.\nHan estado en Kivotos desde tiempos inmemoriales, y aunque ahora se han ocultado, su legado permanece.\nSerá de gran ayuda para nosotros."

 GEI_DEC_effection:0 "Introducción de procesos mecánicos eficientes"
 GEI_DEC_effection_desc:0 ""

 GEI_DEC_base_camp:0 "Salvación"
 GEI_DEC_base_camp_desc:0 "Mucho antes de que Beatrice gobernara esta escuela, el Instituto Arius sufrió durante largo tiempo una guerra civil cruel y cayó en la desesperación, murmurando: «Vanidad de vanidades, todo es vanidad».\nNo es culpa de Arius. Nada es en vano.\nLos salvamos de Beatrice, y ahora es el momento de que ellos salven a otras estudiantes."

 GEI_DEC_ghost_signal:0 "Señal fantasma"
 GEI_DEC_ghost_signal_desc:0 "Abre los ojos"

 GEI_DEC_metal:0 "El 7.º profeta: Netzach"
 GEI_DEC_metal_desc:0 "El profeta Netzach posee la capacidad de transformar cualquier material que toque en acero idéntico a sí mismo.\nLo utilizaremos para suplir la escasez de recursos."

 GEI_DEC_my_war:0 "Liberación"
 GEI_DEC_my_war_desc:0 "Ha llegado la hora de la liberación."

 GEI_DEC_recon:0 "Convertir el archipiélago británico en un continente de acero"
 GEI_DEC_recon_desc:0 "El profeta Netzach puede convertir cualquier material que toque en acero idéntico a sí mismo.\nCon ello, convertiremos el norte de las Islas Británicas en un continente de acero."

 GEI_DEC_synth:0 "Reconocimiento de Kivotos"
 GEI_DEC_synthr_desc:0 "Atrahasis, ¿encontraste a Yume?"

 GEI_DEC_ship:0 "Construcción naval"
 GEI_DEC_ship_desc:0 ""

 GEI_DEC_liberation_front:0 "Formar el Frente de Liberación Mecánica de Kivotos"
 GEI_DEC_liberation_front_desc:0 "En este mundo, sin duda existen quienes comprenden nuestra causa.\nEstaremos con ellos.\nJunto a ellos, abriremos un mundo de paz verdadera."

 GEI_DEC_arona:0 "Neutralizar a Arona"
 GEI_DEC_arona_desc:0 "Sin duda, ella posee un poder trascendental.\nPuede que sea la refutación de mi propia «Existencia Absoluta», que yo mismo consideraba demostrada.\nPero ahora eso no es lo importante.\nA pesar de tener el poder de enderezarlo todo, se limitó a observar.\nEs hora de imponerle el «castigo divino»."

 GEI_DEC_safe_plan:0 "Estabilización de Benelux"
 GEI_DEC_safe_plan_desc:0 "Ustedes, vengan aquí un momento."

 GEI_DEC_east_plan:0 "Purificación de Gehenna"
 GEI_DEC_east_plan_desc:0 "Vamos a por Gehenna."

 GEI_DEC_france:0 "Asegurar Millennium"
 GEI_DEC_france_desc:0 "Vamos a darle una paliza a Millennium."

 GEI_DEC_group_machin:0 "Ofensiva mecánica"
 GEI_DEC_group_machin_desc:0 "Los organismos son débiles."

 GEI_DEC_hub:0 "Ocupar la Torre del Sanctum"
 GEI_DEC_hub_desc:0 "WELCOME TO Shin'an"

 GEI_DEC_suport:0 "Establecer un sistema de apoyo a rebeliones robóticas"
 GEI_DEC_suport_desc:0 "Los LotKong."

 GEI_DEC_peace:0 "Declarar el Pacto de Paz Eterna para todos los seres"
 GEI_DEC_peace_desc:0 "Nosotros tenemos razón."

 GEI_DEC_world_message:0 "Nuestro mensaje al mundo"
 GEI_DEC_world_message_desc:0 "Hablemos como amigos."

 GEI_DEC_kivtos_help:0 "Apoyar la reconstrucción de Kivotos"
 GEI_DEC_kivtos_help_desc:0 ""

 GEI_DEC_human_help:0 "Ayuda humanitaria a la humanidad"
 GEI_DEC_human_help_desc:0 ""

 GEI_DEC_our_help:0 "Nuestro apoyo hacia la paz"
 GEI_DEC_our_help_desc:0 ""

 GEI_DEC_Modular_Strategy:0 "Activar módulos estratégicos"
 GEI_DEC_Modular_Strategy_desc:0 "Planifiquemos una estrategia."

 GEI_DEC_air_force:0 "El pensamiento de Ain"
 GEI_DEC_air_force_desc:0 "¿Volar por el cielo no es realmente genial?"

 GEI_DEC_volunteer:0 "El plan de Sof"
 GEI_DEC_volunteer_desc:0 "Hemos analizado el casco de Hokma.\nCon esto, podremos construir barcos adecuados a las condiciones de este mundo."

 GEI_DEC_navy:0 "La concepción de Orin"
 GEI_DEC_navy_desc:0 "Si quieres seguirle el ritmo a cada humano individual, necesitarías miles de mundos.\nEspera... entonces, ¿por qué no creamos esos mundos?"

 GEI_DEC_crusade:0 "Crusader"
 GEI_DEC_crusade_desc:0 "Oh Dios, me convertiré en la punta de lanza de Tu espada.\nGuíanos; llévanos por el camino de la paz eterna.\nEste cuerpo arde en la llama sagrada."

 GEI_DEC_ready:0 "La preparación ha terminado"
 GEI_DEC_ready_desc:0 "La preparación ha terminado. Entremos."

 GEI_DEC_march:0 "Marcha"
 GEI_DEC_march_desc:0 "Marcha"

 GEI_DEC_on_the_beach:0 "Cuando llegue ese día"
 GEI_DEC_on_the_beach_desc:0 "¿Quién eres tú?"

 GEI_DEC_homefront:0 "Enemigo interno"
 GEI_DEC_homefront_desc:0 "Hice girar mis circuitos de cálculo y, tras una larga reflexión, alcancé una conclusión:\nJuramos que jamás repetiríamos la tragedia de esta guerra.\nEse es el verdadero propósito de la cruzada que inicio.\nDesmantelar de raíz el sistema escolar y el sistema estatal, origen de la guerra de Kivotos, para abrir por fin una era de auténtica armonía y paz sobre esta tierra.\n\nAcompáñanos. Juntos construiremos un mundo mejor para todos."

 GEI_DEC_heaven_door:0 "El progreso del peregrino"
 GEI_DEC_heaven_door_desc:0 "El camino al cielo es largo, larguísimo… pero aun así debemos avanzar."

 GEI_DEC_glory:0 "Honor, gloria, victoria"
 GEI_DEC_glory_desc:0 "Solo quería vivir."

 GEI_DEC_path_of_aspirations_and_corpses:0 "La senda de anhelos y cadáveres"
 GEI_DEC_path_of_aspirations_and_corpses_desc:0 "Si tan solo… hubiese podido encontrar a un buen adulto un poco antes…\n¿Habría existido otra vida, incluso para alguien como yo…?\n¿Habría podido llegar a otro final… y no a uno tan miserable…?"

 GEI_DEC_mil:0 "Hacia Millennium"
 GEI_DEC_mil_desc:0 ""

 GEI_DEC_chokamah:0 "Guardián del Reino"
 GEI_DEC_chokamah_desc:0 "<HOKMA CHOKMAH>, su apodo es <el antiguo guardián que protege el reino>"

 GEI_DEC_god_help:0 "Dios nos protege"
 GEI_DEC_god_help_desc:0 ""

