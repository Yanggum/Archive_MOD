 GEI_tactical_coordination_desc:0 "La coordinación táctica perfecta incrementa la eficiencia en combate."

 GEI_coordinate_color_forces:0 "Coordinación de fuerzas del Color"
 GEI_coordinate_color_forces_desc:0 "Todas las unidades corrompidas por el Color se mueven hacia un mismo objetivo."

 # Categoría de decisiones
 GEI_the_twisted_will_decisions:0 "Voluntad retorcida"
 GEI_the_twisted_will_decisions_desc:0 "Todo lo que existe renacerá bajo nuestra voluntad. Retorcemos la realidad, contaminamos la tecnología y nos infiltramos en la mente del enemigo para sembrar el terror. Los cálculos de A.R.O.N.A, corrompidos por el Color, proponen tácticas perfectas, y los profetas de Decagrammaton dictarán sentencia sobre nuestros enemigos. Industria, ejército, incluso la esencia de la vida... Todo no es más que una herramienta para el plan del «Sensei». Esto no es una simple guerra. Es el proceso de crear un nuevo mundo."

 GEI_plunder_operations:0 "Operaciones de saqueo"
 GEI_plunder_operations_desc:0 "Saqueamos recursos y equipo del enemigo para fortalecer nuestro poder."
 
 GEI_sensei_command:0 "Mando del Sensei"
 GEI_sensei_command_desc:0 "Llevamos a cabo operaciones militares bajo el mando del Sensei del Color."
 
 GEI_arona_tactical_operations:0 "Operaciones tácticas de A.R.O.N.A"
 GEI_arona_tactical_operations_desc:0 "Aseguramos ventaja táctica usando el sistema avanzado de A.R.O.N.A."

 GEI_raid_military_facilities:0 "Asaltar instalaciones militares"
 GEI_raid_military_facilities_desc:0 "Asaltamos instalaciones militares enemigas para obtener equipo y recursos."
  
 GEI_color_industry:0 "Industria corrompida por el Color"
 GEI_color_industry_desc:0 "Nuestra industria se ha transformado para ser más eficiente bajo la influencia del Color."
 
 GEI_efficient_organization:0 "Organización eficiente"
 GEI_efficient_organization_desc:0 "Con el poder del Color, nuestro ejército ha sido organizado de forma más sistemática."
 
 GEI_arona_production:0 "Gestión de producción de Arona"
 GEI_arona_production_desc:0 "Con el apoyo de Arona, la eficiencia de producción ha aumentado."
 
 GEI_production_boost:0 "Producción reforzada"
 GEI_production_boost_desc:0 "El poder del Color ha incrementado enormemente nuestra capacidad de producción."
 
 GEI_coordinated_offensive:0 "Ofensiva armoniosa"
 GEI_coordinated_offensive_desc:0 "Nuestros ataques se ejecutan con una coordinación perfecta."
 
 GEI_signal_warfare:0 "Guerra de interferencia de señales"
