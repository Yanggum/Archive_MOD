 # 데카그라마톤 ideas

 GEI_automatic_ideas:0 "Proceso automatizado"
 GEI_automatic_ideas_desc:0 "Hemos introducido un nuevo proceso automatizado para sustituir los procesos ineficientes de los organismos existentes. Esto permitirá que los organismos vivan de forma más cómoda y, al mismo tiempo, traerá una innovación en la eficiencia productiva."

 GEI_DEC_riot_ideas:0 "Las secuelas de la señal fantasma"
 GEI_DEC_riot_ideas_desc:0 "Tras el llamado incidente de la 'señal fantasma', todos los robots y autómatas de Kivotos han caído en un estado irracional. Han abandonado sus labores para realizar protestas pacíficas exigiendo el fin de la masacre sin sentido entre academias, y en las fábricas de armamento se han desatado huelgas masivas."

 GEI_DEC_riot_riot_ideas:0 "Disturbios mecánicos"
 GEI_DEC_riot_riot_ideas_desc:0 "Los robots y autómatas de Kivotos, que antes solo se habían limitado a huelgas y protestas pacíficas, han cambiado de repente. Ahora están cometiendo actos de terror indiscriminados contra nuestras fábricas de armamento y principales instalaciones industriales. La situación se expande más allá de un simple disturbio y se ha convertido en una amenaza; por ello, debemos reprimirlos cuanto antes."

 GEI_idea_DEC_no_name_gods:0 "Tecnología de los dioses sin nombre"
 GEI_idea_DEC_no_name_gods_desc:0 "Nadie sabe aún cómo funciona esta tecnología. Es algo a lo que no se debe tocar."

 GEI_DEC_kivtos_help_ideas:0 "Asistencia del 'Absoluto' a Kivotos"
 GEI_DEC_kivtos_help_ideas_desc:0 "Una IA que se autoproclama 'existencia absoluta' ha enviado suministros y autómatas trabajadores para reconstruir Kivotos tras el Gran Traslado. La IA no exige nada a cambio. Es sospechoso, pero no tenemos motivo para rechazar su apoyo en este momento."

 GEI_DEC_human_help_ideas:0 "Ayuda humanitaria de las máquinas"
 GEI_DEC_human_help_ideas_desc:0 "Una IA que se autoproclama 'existencia absoluta' ha enviado suministros y autómatas para apoyar a la humanidad del continente europeo, sumida en el caos tras el Gran Traslado. La IA no exige nada a cambio. Es sospechoso, pero no tenemos motivo para rechazar su apoyo en este momento."

 GEI_DEC_metrix:0 "Cielo o infierno"
 GEI_DEC_metrix_desc:0 "No todos pueden vivir en el paraíso, incluso si este lugar fuera un verdadero paraíso. Para alguien, este lugar será un infierno. Porque no todos pueden compartir la misma perspectiva. Aun así, podemos crear un pequeño paraíso para ellos… siempre y cuando no despierten del sueño."

 GEI_DEC_dimension_tunnel:0 "El continente de acero"
 GEI_DEC_dimension_tunnel_desc:0 "Gracias a la habilidad del profeta Netzach, hemos logrado convertir parte de las islas británicas en el Continente de Acero. Esto será de enorme ayuda para asegurar los recursos necesarios para nuestra capacidad de guerra. Más adelante podríamos militarizar el Continente de Acero, pero sería inhumano. Por ahora, lo apropiado es usarlo solo para la extracción de recursos."

 GEI_DEC_terror:0 "Golpe a la cadena de mando"
 GEI_DEC_terror_desc:0 "Los repugnantes ataques terroristas de esas máquinas, que proclaman la paz mientras cometen matanzas, han cobrado la vida de una parte considerable de nuestro alto mando. Tomará bastante tiempo recuperar la cadena de mando.\n\nPor quienes se han ido, no debemos rendirnos."

 GEI_DEC_revenge:0 "Por los que partieron primero"
 GEI_DEC_revenge_desc:0 "Por la estéril ideología de esas repugnantes máquinas, perdimos amigos y perdimos familias. Debemos hacer que paguen el precio que corresponde a quienes nos arrebataron lo más preciado. Para que la muerte de los que se fueron primero no sea en vano, por nuestro futuro debemos luchar ahora… aunque corra más sangre..."

 GEI_DEC_crime_ideas:0 "Réquiem"
 GEI_DEC_crime_ideas_desc:0 "¿Para qué hemos llegado hasta aquí? ¿Qué habrá al final del camino hecho de cadáveres?"

 GEI_DEC_school_war_ideas:0 "Guerra del fin"
 GEI_DEC_school_war_ideas_desc:0 "Las fuerzas mecánicas que pisotearon a Millennium y al Consejo General han puesto por fin su repugnante pie en nuestra tierra. No podemos retroceder. Aunque duela hasta ahogarnos, aunque sea un sufrimiento que corta los huesos, resistan y resistan hasta el momento de la victoria. Si cedemos, todas las formas de vida inteligente afrontarán su final.\n\n §RTodo depende de la batalla decisiva final. Resistan.§!"

 GEI_DEC_zero_clock_ideas:0 "Medianoche"
 GEI_DEC_zero_clock_ideas_desc:0 "§RSe acerca la medianoche.§!"

 # 데카그라마톤 custom tool tips
 GEI_air_force:0 "Se investigará equipo aéreo multipropósito básico."
 GEI_DEC_battle_shipt_tt:0 "Se investigará. Este buque es una nave creada al replicar el cuerpo del profeta Hokhma<CHOKMAH>."
 GEI_DEC_crusade_tt:0 "Se creará la unidad 'Crusader', formada por infantería de élite leal. En la próxima cruzada, serán una lanza afilada junto a los profetas."
 GEI_DEC_ready_tt:0 "Se desplegarán los autómatas producidos en la fábrica de drones. Como la guerra contra Kaiser Corporation es inminente, se han enviado de emergencia al frente en cuanto se fabrican, por lo que su rendimiento está degradado..."
 GEI_stabilization:0 "Se estabilizará la región."
 GEI_DEC_our_help_tt:0 "Nos pondremos en contacto en secreto con los humanos. Si las negociaciones avanzan bien, podremos sentar las bases para la paz."

