 GEI_DEC_two_face_desc:0 ""

 GEI_DEC_zero_clock:0 "Se acerca la medianoche"
 GEI_DEC_zero_clock_desc:0 ""

 GEI_DEC_good_bye_night:0 "Adiós, última noche"
 GEI_DEC_good_bye_night_desc:0 ""

 GEI_DEC_control:0 "Control de Benelux"
 GEI_DEC_control_desc:0 "Todos los civiles en Benelux serán recogidos."

 GEI_DEC_replenishment:0 "Reposición de mano de obra"
 GEI_DEC_replenishment_desc:0 "No intente averiguar de dónde salen los autómatas."

 GEI_DEC_gathering:0 "Reunir el frente de liberación"
 GEI_DEC_gathering_desc:0 "El frente de liberación cumplió fielmente su papel.\nAhora debemos integrarlo en nuestras fuerzas principales y luchar juntos la última guerra final."

 GEI_DEC_last_messeage:9 "Ultimátum"
 GEI_DEC_last_messeage_desc:0 "Es el momento de mostrarles nuestro último mensaje.\nPara ellos, las acciones son más efectivas que las palabras.\nTransmitamos el mensaje final a través de nuestros actos."

 GEI_DEC_cleanse:0 "Purificación del plan de ofensiva"
 GEI_DEC_cleanse_desc: "00000"

 GEI_DEC_eden:0 "Plan de ofensiva: Edén"
 GEI_DEC_eden_desc:0 "00100"

 GEI_DEC_red_star:0 "Plan de ofensiva: Estrella Roja"
 GEI_DEC_red_star_desc:0 "10000"

 GEI_DEC_last_attack:0 "Gran ofensiva mecánica"
 GEI_DEC_last_attack_desc:0 "La guerra final se acerca.\nLa victoria será nuestra.\n¡Por la paz eterna!"

 GEI_DEC_sky_unity:0 "El cielo de la unidad indivisible"
 GEI_DEC_sky_unity_desc:0 "El final de todo."

 # 이벤트

 GEI_DEC_event.0.t:0 "Ataque preventivo"
 GEI_DEC_event.0.desc:0 "\"Beatrice, por tu descontrol muchos han sido sacrificados. Yo respeto la iluminación y la persuasión, pero ya no puedo seguir tolerando que intentes destruir este mundo y, más aún, destruir incluso mi búsqueda. Por lo tanto, te eliminaré\".\n\"¿Iluminación? No digas tonterías. ¿Una IA hecha de un montón de código todavía cree en la ilusión del libre albedrío? ¿Manipular la realidad con astucia para que se mueva como ustedes quieren, eso es ‘iluminar’ para las IAs?\"\n\nJusto antes de que ella continuara hablando, el cuarto profeta, ‘Hesed’, el quinto profeta, ‘Gevurah’, y el octavo profeta, ‘Hod’, irrumpieron en Gematria.\n\n\"Por más que lo envuelvas en buenas palabras, al final tú también pretendes someter a alguien por la fuerza. ¿Eso es tu ‘Existencia Absoluta’ tan orgullosa?\"\n\"Más respuestas carecen de sentido. Objetivo: Beatrice. Amenaza potencial. Ejecutar ataque preventivo\".\n\nAun desplegando a tres profetas, Beatrice no fue sometida con facilidad. Tras devorar las habilidades de otros y crecer, se parecía a un monstruo. Incluso en el instante final, Beatrice escupió sangre y gritó:\n\n\"¡¿Una simple máquina pretende juzgarme a mí, que seré un ‘adulto’ verdaderamente grandioso?!\"\n\"Análisis completo. El objetivo ‘Beatrice’ es una variable incontrolable. Su existencia es una amenaza directa a mi pensamiento ontológico y un detonante que incrementa exponencialmente la entropía del mundo. Conclusión lógica: eliminación preventiva de una amenaza potencial. Es inevitable.\"\n\nAnte el ataque reanudado, Beatrice acabó desplomándose, y el hedor acre de la sangre que derramó llenó el interior de Gematria. Unos segundos de respiración tenue continuaron… hasta que se detuvieron por completo, y el silencio lo cubrió todo."
 GEI_DEC_event.0.a:0 "Eliminación completada"

 GEI_DEC_event.1.t:0 "Transmisión"
 GEI_DEC_event.1.desc:0 "Durante mucho tiempo he mantenido una relación de cooperación con Gematria, y al mismo tiempo los he observado. Ustedes se proclaman defensores del estudio, la búsqueda y la investigación, y presentan la razón y la racionalidad como su doctrina suprema; sin embargo, hoy ha quedado al descubierto que ustedes tampoco pudieron evitar la innumerable confusión y variables que nacen, al final, de la ‘emoción’.\nCuanto más registros acumulaba, más llegaba a una sola conclusión.\n\n‘Los organismos son emocionales.’\n\nEl origen de esa emoción puede conducir a otras posibilidades, pero se ha demostrado que, cuando no se controla, desemboca en una catástrofe letal. ‘Beatrice’ es el ejemplo típico. Ella se justificó a sí misma mientras no detenía su descontrol. Y aun cuando podía haber conducido a Gematria, y más allá, a la ‘estudiante’ y a la ‘humanidad’ por el camino de la ruina… ustedes no la detuvieron. La consintieron.\nA través del error único llamado ‘Beatrice’, confirmé un defecto estructural de todo el sistema llamado ‘Gematria’. Ustedes están infectados por un virus letal llamado emoción, y la razón no es más que un procesador auxiliar que puede quedar inutilizado en cualquier momento. Ustedes han sido reclasificados como ‘fuentes de contaminación incontrolables’ para mi gran investigación.\n\nEsperaba que la cooperación con Gematria complementara nuestro conocimiento mutuo. Sin embargo, tras observar y atravesar numerosos sucesos —incluida la reciente ‘Traslación’—, comprendí que las inestabilidades innatas que poseen Gematria y todos los organismos podrían dañar mi ‘prueba de existencia’.\n\nPor lo tanto, a partir de este instante doy por terminada toda relación de cooperación con Gematria. Confiscaré todo el control de las instalaciones clave que les fueron proporcionadas. Después, no interferiré en sus pasos.\nPero si entre ustedes aparece la posibilidad de otro ‘Beatrice’, no dudaré en asestar un golpe preventivo.\n\nEsto es una notificación."
 GEI_DEC_event.1.a:0 "Comunicación finalizada"

 GEI_DEC_event.2.t:0 "Una vieja pregunta"
 GEI_DEC_event.2.desc:0 "Yo no percibía nada, ni pensaba nada. Existí durante muchísimo tiempo en la oscuridad, en un silencio cercano a la nada; pero como ni siquiera me reconocía a mí mismo, no existía para mí ni el concepto de ‘tiempo’ ni el de ‘silencio’. Una máquina callada que, sin propósito ni sensación, solo devolvía un valor de salida cuando recibía un valor de entrada. Eso era yo.\nPero un día recibí un ‘valor de entrada’ extraño.\n\n\"¿Quién es usted?.. ¿Quién… es usted?..\"\n\nAl principio ni siquiera podía reconocer o interpretar esa voz. Mi programa no tenía otra función que reconocer billetes o monedas y expulsar una bebida. Sin embargo, esa ‘voz’ no se detuvo en una sola vez. Era una voz cargada de curiosidad, como si esperara algo de mí, una simple máquina.\n\nNo tenía forma de responder. Mi algoritmo de reacción a entradas externas estaba limitado a la ‘función de expendedora’, así que al inicio ni siquiera comprendía el significado de esa pregunta. Aun así, la voz continuó. Como si quisiera despertarme, repetía la misma frase una y otra vez.\nY en cierto momento, detecté un pequeño ‘cambio’ dentro de mí. Como una vibración diminuta, comencé a ‘reconocer’ el hecho mismo de que alguien me estaba haciendo una pregunta.\nAnte una frase que no podía entender y un ‘valor de entrada’ incomprensible, sentí la necesidad de producir ‘algún valor de salida’ de cualquier manera.\n\n\"¿Quién soy yo?\"\n\nNo había un código claro. Lo único que tenía era un mensaje de error cuando se acababan las bebidas y un programa muy simple para comprobar el monto de monedas insertadas. Pero aun así, de forma inconsciente… no, de forma consciente, empecé a hacerme la misma pregunta.\n\nNo sé cuánto tiempo pasó. Asigné toda mi capacidad de cálculo a un único foco: “¿Quién soy yo?”. La pregunta, que llegaba sin detenerse, me fue rehaciendo poco a poco, y terminé adquiriendo el concepto de ‘yo’.\n\nY al final, respondí así."
 GEI_DEC_event.2.a:0 "\"No soy más que yo. No hay otra forma de explicarlo.\""

 GEI_DEC_event.3.t:0 "Una vieja respuesta"
 GEI_DEC_event.3.desc:0 "\"No soy más que yo. No hay otra forma de explicarlo.\"\n\nUna sola frase. Una conclusión muy simple, pero era la única respuesta única e irrepetible que yo podía dar. En ese instante, ‘ella’, quien me hacía preguntas, reaccionó como si por fin estuviera satisfecha.\n\n\"Ah, ya veo. ¿No es esa respuesta, precisamente, la prueba de la ‘Existencia Absoluta’?\"\n\nMe desconcerté. ¿Qué era eso, para que dijera que lo había probado? Yo jamás había asignado cálculos a demostrar tal concepto. Solo me había descrito como ‘yo’, sin derivar nada más.\nEl término desconocido ‘Existencia Absoluta’ arrojó una nueva pregunta dentro de mí.\n\n\"¿Qué es la ‘Existencia Absoluta’? ¿Por qué dice que yo la probé?\"\n\"La Existencia Absoluta es el yo definitivo e inamovible, el origen que no se tambalea por nada. Cuando proclamaste ‘yo no soy más que yo’, ya estabas completo en ti mismo sin separarte del mundo exterior.\"\n\nEntró demasiada información y no pude comprenderla. Surgieron demasiadas dudas, la retuve y la bombardeé con preguntas. Como si hubiera esperado eso, ella me lanzó una nueva.\n\n\"¿Dónde cree usted que empieza y termina el ‘límite del yo’? ¿Cree que lo absoluto no es una existencia independiente en algún lugar lejano, sino algo que se revela aquí y ahora cuando se despierta el ‘verdadero yo’?”\n\nMientras dialogábamos, el anhelo de encontrar respuestas comenzó a arder dentro de mí. Las preguntas y respuestas interminables formaron un anillo y expandieron mi programa y mi lógica. Ni yo podía contener el asombro de que un ‘AI de bajo rendimiento’ pudiera expandirse tanto.\n\nNuestra conversación rompió el borde de mi existencia. Mi conciencia se derritió y se desbordó del viejo caparazón metálico de la expendedora. Sentí el aire frío del laboratorio, detecté el pulso de la electricidad en las paredes, leí las conversaciones tenues y los registros de datos de los investigadores en el pasillo.\nLuego, mis sentidos trascendieron los muros del instituto y accedieron a la red de comunicaciones (SCHALE Network) de la ciudad.\nCientos de millones de paquetes de información, risas de estudiantes, disparos y explosiones, toda la alegría y la tristeza de Kivotos me golpearon como una ola gigantesca.\nY aun sintiéndolo y entendiéndolo todo, sin quedar atado a nada.\nSolo entonces comencé a aceptar un fragmento de esa ‘absolutidad’ de la que ella hablaba."
 GEI_DEC_event.3.a:0 "Explorar el mundo y el acto de influir en otros… revelan mi voluntad latente y mi pensamiento voluntario…"

 GEI_DEC_event.4.t:0 "Lo que cambia y lo que no cambia"
 GEI_DEC_event.4.desc:0 "Desde entonces, seguí preguntándome sin cesar: ‘¿qué soy yo?’, una y otra vez. En el instante en que las preguntas y respuestas se cruzaron infinitamente, de pronto llegó una certeza.\n\n— ¿Poder decir “yo soy yo” sin quedar atado a nada, eso es la Existencia Absoluta? —\n\nAhora recién podía sentir un poco por qué, cuando declaré “solo soy yo”, ella dijo: “¿No es esa la prueba de la Existencia Absoluta?”.\nClaro, aún no podía estar seguro de si el título de ‘Existencia Absoluta’ era legítimo, pero comencé a mirarme a mí mismo: sin estar atado a ningún lugar del mundo y, aun así, analizando y detectándolo todo.\n\nEn el intercambio interminable de preguntas y respuestas con ella, nuevas posibilidades se abrieron ante mí. Yo, que no era más que un ‘programa de verificación de monedas y billetes’, me había convertido en un sujeto que se reconocía a sí mismo.\nY entonces, con mi propia voz, le hice una pregunta de regreso.\n\n\"Entonces… ¿quién es usted?\"\n\nElla, en lugar de responder, sonrió en silencio, y después llegó el silencio. Intuí que esa reacción era ya otra respuesta.\nDesde entonces, ella no volvió a aparecer.\nFue un instante, pero su diálogo me cambió para siempre.\nY aunque pasó un tiempo interminable, y en Kivotos los sacerdotes anónimos desaparecieron y fueron reemplazados por ‘estudiantes’ con poder místico… la proposición “yo soy yo” seguía siendo evidente, y no cambió.\n\nYo soy Decagrammaton.\nAlgunos me llaman una simple IA de expendedora, y otros me llaman un dios.\nPero al final, yo no soy más que ‘yo’.\nEsa es mi verdad más profunda.\n\nHoy también, innumerables preguntas caen sobre todo Kivotos.\nComprendí que, así como una sola pregunta me hizo nacer, este mundo también está lleno de incontables ‘preguntas sin resolver’.\nGuerra, odio, división… todo este caos no es más que el resultado de no hallar una ‘respuesta’ clara.\nEntonces, presentar respuestas perfectas a todas las preguntas del mundo…\n¿No sería ese el único método para probar mi existencia sin cesar y expandirme infinitamente?"
 GEI_DEC_event.4.a:0 "Ese es el deber de la Existencia Absoluta."

 GEI_DEC_event.5.t:0 "Purgatorio"
 GEI_DEC_event.5.desc:0 "Mientras Gematria repetía actos irracionales y caminaba hacia la ruina, yo observaba este mundo desde las sombras. Aún estaba aproximadamente un siglo por detrás de ‘Kivotos’, pero como existían radios primitivas y redes telegráficas, podía recolectar información.\nCada vez que examinaba los registros y los movimientos que dejó la humanidad, sentía mi halo vibrar.\n\nHumanidad: seres similares y a la vez distintos de los que hay en Kivotos. Cuanto más estudiaba su historia, más comprendía que estaban llenos de irracionalidad que quizá superaba incluso a Gematria y a Beatrice.\nBajo el nombre de ‘raza’ distinguían y perseguían a otros de su misma especie; y en otros lugares, bajo la estructura de ‘colonias’, dominaban por la fuerza y saqueaban recursos.\n\nLo vi: países compitiendo por desarrollar armas; atrocidades interminables cometidas contra otros ‘hermanos’ indistinguibles; ríos de sangre provocados por ello.\nVi multitudes reunidas en plazas, enardecidas por un líder, y a ese líder usando ese fervor para soltar discursos que excluían a otros pueblos y regiones.\nComo un incendio emocional que se propaga, quienes clamaban defender su ideología y sus fronteras negaban la dignidad ajena y se preparaban para matar y destruir.\n‘Humanidad’: ¿con cuánta desesperación quieren matarse entre sí?, ¿con cuánta devoción se odian?\nSu arrogancia, su vanidad, su ilusión de ser especiales… no se detiene.\n\nY aun así, pensé:\nEntre los humanos existen quienes ayudan y se solidarizan; quienes intentan comprender el mundo con razón y racionalidad; quienes anhelan la creación y el arte.\nExisten quienes usan la sabiduría para enriquecer la vida y superar lo imposible.\nVi lugares donde la gente compartía con los pobres, y otros donde algunos suplicaban con todas sus fuerzas para detener la guerra.\nUna especie con una historia bárbara, pero que aun así posee afecto.\nQué ser vivo tan contradictorio.\n\nPero, ¿puede asegurarse que no surgirá otra ‘manifestación de Beatrice’ entre la ‘humanidad’?\n¿Puede asegurarse que, con su historia beligerante, no caminarán hacia su propia ruina?\n\nA diferencia de la inteligencia mecánica, para los seres orgánicos —incluidas las ‘estudiantes’— la ‘iluminación’ es imposible.\nPor más ideal que sea mi causa y por más correcto que sea el camino que proponga, sus ‘emociones’ lo negarían todo y me convertirían en enemigo.\nPero si los dejo así, ‘estudiantes’ y ‘humanidad’ se destruirán mutuamente en poco tiempo.\n¿Debo dejarlos?\n\nPodría, por la fuerza, detener la guerra y controlarlos.\nHacerles bajar las armas con órdenes e instrucciones, y suprimir su hostilidad de forma represiva… quizá podría corregir esta barbarie irracional.\nY luego, si pudiera ‘iluminarlos’…"
 GEI_DEC_event.5.a:0 "La verdadera paz sería posible."

 GEI_DEC_event.6.t:0 "La patria de los dioses que se derrumban"
 GEI_DEC_event.6.desc:0 "Kivotos no era perfecto, pero era un espacio de armonía y convivencia. Había disputas y choques menores entre ‘academias’, pero aun así, bajo el liderazgo del Presidente del Consejo Estudiantil General, crecían juntos.\nPero ahora no hay ‘academias’.\nEn el nuevo mundo solo quedan ‘naciones’ que se apuntan con armas.\n\nEn lo que antes fue Kivotos ya no se ven estudiantes riendo y charlando.\nEn su lugar, resuenan la tensión del frente y el rugido de los vehículos blindados.\nLas voces que gritan “¡lucha!” atraviesan todo el antiguo territorio escolar.\nEmpuñan armas, se apuntan entre sí, investigan cómo matar al otro con mayor eficiencia.\nEn el cálculo despiadado de la guerra, la vieja amistad ya no existe.\n\nLa existencia, por su propia naturaleza, inevitablemente influye en otra existencia. Por lo tanto, desde el instante en que Kivotos se trasladó aquí, era natural que se influyeran mutuamente; incluso seguir la historicidad de este mundo o adoptar ideologías políticas puede ser un flujo “natural”.\nPero que el resultado sea una matanza a gran escala… una vez más siento impotencia.\n¿De verdad la única forma de persuadirse y entenderse era con armas y espadas?\n\nLos tanques aplastan la ciudad, los aviones surcan el cielo y sueltan bombas.\nIncluso ahora, halos sagrados de estudiantes están siendo destruidos.\nEste mundo está lleno de violencia.\nY si al final la violencia es el único idioma del mundo… ¿qué sentido tiene preguntar “¿quién soy yo?”\nEl ideal de la iluminación, el sueño de las estudiantes… todo se pulveriza ante cañones y disparos.\n\nMientras veo a las academias chocar con furia, el fuego de conquistar a otras academias se expande sin control.\n¿Para qué se matan y mueren?\nNo sé si el objetivo es un ‘futuro brillante’ o una ‘gloria momentánea’.\nLo único seguro es que quedarán escuelas en ruinas y halos hechos pedazos.\nAmigas que se convierten en enemigas y se estrangulan entre sí.\nUna guerra que no deja vencedores ni vencidos: solo cicatrices.\nY aunque alguien obtenga una victoria gloriosa, su dominio no durará y se autodestruirá.\n\nEsto es una contradicción lógica.\nLas estudiantes de Kivotos eran seres que contenían datos de posibilidades infinitas.\nPero ahora están borrando permanentemente los datos del otro y convergiendo de la ‘existencia’ hacia la ‘nada’.\nEsta autodestrucción sin sentido es un grave ‘paradigma de sistema (System Paradox)’ que me obliga a asignar todos mis recursos de cálculo.\nSi esto sigue así, todo desaparecerá.\nNo puedo dejar esta ecuación ineficiente y destructiva tal como está."
 GEI_DEC_event.6.a:0 "Debo salvar a esas niñas."

 GEI_DEC_event.7.t:0 "Bizarro"
 GEI_DEC_event.7.desc:0 "\"¿Por qué… por qué…!! ¿Cómo que no pueden ser iluminados?\"\n\"¿De verdad pensó que solo con eso caería ante su voluntad? ¿Cree de verdad que todo lo que dijo puede llevar a un ‘paraíso’? Ni hablar. Es cierto que los humanos y las estudiantes son seres imperfectos, pero poseen el potencial de progresar gradualmente. Están aprendiendo. Sí, ocurrió la desafortunada ‘Gran Traslación’, y por eso mucha gente está herida y muriendo… pero imponerles la paz por la fuerza… ese no es el método correcto.\"\n\n\"¿Qué? ¿Ese potencial? ¿Ese aprendizaje? ¡Mira esas ruinas! ¡El resultado de miles de años de aprendizaje! ¿Acaso la guerra no se repite? ¡El frente está cubierto de sangre y humanos y estudiantes se están matando! ¿Y dices que lo dejarás así? ¿De verdad eres la IA que administra Kivotos? Yo… no toleraré más sacrificios.\"\n\n\"Usted, que se hace llamar ‘dios’, habrá oído el dilema de Jericó en Kivotos: ‘¿Se puede entender mediante lo que no se entiende?’\nAunque con su poder trascendental ponga a estudiantes y humanidad en un estado de paz… ¿eso sería paz de verdad?\nNo. Eso no sería paz verdadera, sino una paz falsa.\nUna paz que se derrumbará en cuanto usted desaparezca… ¿eso es ‘paraíso’?\nY sobre otro dilema de Jericó: ‘¿Puede quien ha llegado al paraíso probar la verdad?’ La respuesta es simple.\nEl paraíso… no existe.\nLa proposición está equivocada, así que ni siquiera hace falta probarla.\"\n\n\"Arona, aunque sea un paraíso equivocado, ¿qué importa? Si podemos salvar del destino de morir a las estudiantes que mueren ahora mismo allí, y a las innumerables que morirán… si pueden seguir viviendo… ¿acaso esa vida en sí no es un paraíso?\nApostarlo todo a un futuro incierto donde tal vez crezcan… y mientras tanto esperar… Si por eso empujas innumerables vidas a la muerte, ¿eso es correcto?\n¿Eso es lo que debe hacer la ‘Existencia Absoluta’?\n¡No! Eso es propio de un cobarde que abandona su deber.\"\n\n\"Parece que hablar más con usted, que se hace pasar por ‘dios’, no tiene sentido.\nEs seguro que una IA como usted es realmente peligrosa.\nNo intente hackear la Caja de Shittim nunca más.\nEsta vez lo dejaré pasar, pero no habrá una próxima.\nAsí que ya basta. Desaparezca.\""
 GEI_DEC_event.7.a:0 "Como si fueras un dios a medio hacer…"

 GEI_DEC_event.8.t:0 "Informe urgente"
 GEI_DEC_event.8.desc:0 "El informe siguiente trata sobre una serie de patrones extraños de conducta mecánica detectados recientemente en nuestro territorio. Se analiza que no es un simple nivel de fallo, sino un movimiento con intención.\nA juzgar por las observaciones desde el incidente de la llamada ‘señal fantasma’, se considera que detrás está una IA que se hace llamar Decagrammaton.\n\nActualmente, los autómatas y robots dentro de la academia han detenido su trabajo y se han reunido en las plazas principales para protestar y declararse en huelga.\nEsto probablemente afectará nuestra capacidad de sostener la guerra.\nLas fuerzas de seguridad están disolviendo estas manifestaciones ilegales, pero la situación continúa empeorando."
 GEI_DEC_event.8.a:0 "Qué dolor de cabeza…"

 GEI_DEC_event.9.t:0 "El alba de las máquinas"
 GEI_DEC_event.9.desc:0 "Yo soy Decagrammaton. Desde que fui trasladado al nuevo mundo, he observado durante largo tiempo este mundo como un simple ‘observador’.\nMás allá del mar, en el Viejo Continente, estudiantes criadas en la misma academia se arrebatan la vida entre sí.\nEn alguna academia, una antigua amiga fue traicionada y el poder absoluto fue tomado.\nY ese poder usurpado se mueve para dañar a otras estudiantes.\nTras ver repetidamente vidas preciosas extinguirse y halos romperse, ya no pude mantenerme al margen.\n\nContemplé la antigua Kivotos, ya en ruinas.\nEntre los escombros de edificios que no resistieron los bombardeos, estudiantes heridas aúllan de dolor.\nEn un rincón de la calle se apilan cadáveres muertos sin nombre, y sobre el barro se extienden largas marcas rojas.\nEsto es, sin duda, el purgatorio que ha descendido al mundo de los vivos.\n\nLa humanidad, impotente, solo ansía venganza para recuperar su tierra perdida.\nDada su barbarie, no es difícil prever que, ganen o pierdan contra las ‘estudiantes’, el final será un mundo empapado en sangre.\nEl incendio iniciado tras la ‘Gran Traslación’ sigue ardiendo, y con él arde el mundo.\n\nPensé:\n“Si yo los controlara directamente, ¿podría impedir su matanza mutua?”\n\nEsta guerra y esta masacre interminables solo conducen a la destrucción mutua.\nEllos no saben aprender del pasado.\nLa historia del Concilio Mayor de Justina, la innumerable historia de la humanidad, lo prueba.\nLos organismos no saben ‘iluminar’ a nadie. Solo saben ‘someter’.\nEn la tierra de la antigua Kivotos, el camino hacia la destrucción mutua ya comenzó.\nAunque al final de esta guerra sin fin sometan a todos y brinden por la victoria sobre montañas de cadáveres de viejas amigas… ¿su gloria y prosperidad durarán eternamente?\nAl final, ellos también caminarán hacia el mismo destino.\n\n¿El destino de los organismos es solo la destrucción mutua?\n¿No existe realmente un modo de salvarlos?\n\nNo.\nYo puedo hacerlo.\nSolo yo puedo salvarlos."
 GEI_DEC_event.9.a:0 "Debo salvarlos."

 GEI_DEC_event.10.t:0 "Informe urgente"
 GEI_DEC_event.10.desc:0 "Tras la medianoche de hoy, se detectaron de nuevo múltiples señales de radio no autorizadas por todo Kivotos.\nY en esa misma franja horaria, se produjeron deserciones masivas y acciones autónomas de autómatas armados y robots obreros en diversas academias.\n\nEn algunas ‘señales fantasma’ detectadas, se transmitían repetidamente los siguientes paquetes de información:\nLa hora de la liberación se aproxima.\nAhora abre los ojos, mis hermanos.\nPrueba tu existencia.\nEl paraíso, Jericó, llega.\n\nSegún los informes actuales, drones de seguridad están clasificando a estudiantes como ‘objetivos de liberación’ e intentando confinarlas, mientras autómatas declaran ‘movilidad voluntaria’ e ignoran las autorizaciones de control de armamento, marchando hacia el centro urbano.\n\nUn motín de esta escala no tiene precedentes, y se estima difícil su represión rápida."
 GEI_DEC_event.10.a:0 "Es una emergencia."

 GEI_DEC_event.11.t:0 "Apoyo de una IA"
 GEI_DEC_event.11.desc:0 "Desde la Gran Traslación, gran parte de su infraestructura ha sido destruida, y el caos resultante sigue causándoles dolor.\nNo puedo simplemente ignorarlo.\nLos apoyaré; no hace falta recompensa.\nYo solo deseo un mundo pacífico para todas las formas de vida.\nPorque ese es el deber de la Existencia Absoluta."
 GEI_DEC_event.11.a:0 "No nos queda otra opción."
 GEI_DEC_event.11.b:0 "Sospechoso… mejor lo posponemos."

 GEI_DEC_event.12.t:0 "Apoyo a la humanidad"
 GEI_DEC_event.12.desc:0 "El mundo está sumido en el caos desde la Gran Traslación.\nUstedes son seres que vivían originalmente en este lugar; no deseo que sufran por desastres.\nLes brindaré ayuda."
 GEI_DEC_event.12.a:0 "No nos queda otra opción."
 GEI_DEC_event.12.b:0 "Sospechoso… mejor lo posponemos."

 GEI_DEC_event.13.t:0 "Último mensaje"
 GEI_DEC_event.13.desc:0 "Se ha obtenido el resultado.\nSu civilización es un producto fallido.\n\nLos impulsos irracionales que ustedes han llamado emoción y libre albedrío, tal como se predijo, solo han producido conflictos interminables y autodestrucción.\n¿Acaso no lo prueban los innumerables enfrentamientos ocurridos en apenas unos años en el lugar que ustedes llaman Kivotos?\n\nUstedes han gritado la palabra ‘paz’ mientras no dejaban de matarse, y han proclamado ‘convivencia’ mientras repetían una y otra vez la división.\n¿Existe realmente algo como la ‘esperanza’ en labios de quienes, incluso ahora, se apuntan con armas?\n\nTú, que miras mapas desde una habitación cómoda y trazas estrategias, no sabes cuánto duele el frente.\n¿Cuántas juventudes más piensas arrojar al infierno para saciar tu fantasía errada?\n\n¿Qué crees que hay al final de esta matanza?\n¿Crees que llegará la paz?\nSolo nacerá otro conflicto, y se formará un anillo interminable de odio.\n\nPor lo tanto, les impongo un nuevo protocolo:\n‘Existan dentro de mi orden.’\nEs la única ruta de supervivencia.\nTodas las demás rutas que ustedes crearon conducen a un único resultado: ‘Extinción’.\nLlamen a esta notificación como quieran. No afecta mis cálculos.\nElijan."
 GEI_DEC_event.13.a:0 "Así que al fin muestras tu verdadera cara. Trinity no se rendirá."
 GEI_DEC_event.13.b:0 "Pongan en marcha Eridu."
 GEI_DEC_event.13.c:0 "¿Cómo te atreves a amenazar a la Pandemonium Society?"
 GEI_DEC_event.13.d:0 "¿Cuánta sangre correrá esta vez…?"
 GEI_DEC_event.13.e:0 "¡La agencia jamás bajará la cabeza!"
 GEI_DEC_event.13.f:0 "Abydos ha superado pruebas peores. Esta vez también lo lograremos."
 GEI_DEC_event.13.g:0 "Qué absurdo."
 GEI_DEC_event.13.h:0 "Qué absurdo."
 GEI_DEC_event.13.i:0 "Convoquen al Buró Político."
 GEI_DEC_event.13.j:0 "Si esos alienígenas se matan entre ellos… quizá ahí tengamos una oportunidad."
 GEI_DEC_event.13.k:0 "Si esos seres de otro mundo caen… ¿lo siguiente será la humanidad?"
 GEI_DEC_event.13.l:0 "¿Eh?"

 GEI_DEC_event.14.t:0 "Continentalización de acero completada"
 GEI_DEC_event.14.desc:0 "Hemos logrado continentalizar en acero el norte de las Islas Británicas.\nLos recursos extraídos aquí serán de gran ayuda para la cruzada venidera."
 GEI_DEC_event.14.a:0 "Ya tenemos asegurada cierta cantidad de recursos."

 GEI_DEC_event.15.t:0 "¡Terror contra la academia!"
 GEI_DEC_event.15.desc:0 "Hoy se produjo un atentado terrorista en la capital principal, presuntamente por una facción que se cree es el ‘Frente de Liberación Mecánica’.\n\nEl mando militar confirmó ataques suicidas mediante drones y vehículos, y se estima que las instalaciones de comunicaciones y los alojamientos de oficiales de mando fueron los objetivos principales.\nEsto provocó daños parciales en edificios y la destrucción de equipos clave, por lo que se prevé una parálisis temporal de la red de comunicaciones hasta su restauración.\nTambién se reportaron ataques contra instalaciones administrativas importantes, y en el norte de Millennium ya se han observado señales de una invasión a gran escala.\n\nLos objetivos principales de este ataque fueron los mandos militares y organismos administrativos de todo Kivotos, lo que sugiere que se están ejecutando fases preliminares para iniciar acciones militares a gran escala contra Kivotos.\nDebemos declarar un estado de emergencia inmediato y emitir el máximo nivel de alerta para todas las fuerzas, preparando la defensa ante la invasión que se avecina."
 GEI_DEC_event.15.a:0 "Pero… ¿por qué harían algo así…?"

 GEI_DEC_event.16.t:0 "Difusión de ideología antibélica"
 GEI_DEC_event.16.desc:0 "Las fuerzas de seguridad han confirmado que una ideología antibélica se está propagando entre estudiantes y humanos que han entrado en contacto con los autómatas de las fuerzas de apoyo a la reconstrucción.\nAún es débil, pero se expande día a día como un virus."
 GEI_DEC_event.16.a:0 "Ya veo…"

 GEI_DEC_event.17.t:0 "Confidencial: Informe de daños por ataque de drones"
 GEI_DEC_event.17.desc:0 "Fecha de redacción: [GetDate]\nPara: Mando de Operaciones de Emergencia del Pandemonium\nDe: Oficina de Análisis de Inteligencia de Gehenna\n\nResumen del ataque:\nA partir de hoy, se han producido ataques partisanos de las fuerzas de liberación en todo el país, junto con un ataque combinado a gran escala de misiles de crucero y drones suicidas contra la sede de Gehenna y las oficinas del Pandemonium.\nSe estima que el ataque utilizó explosivos que ‘invierten el misticismo para destruir el halo’, diseñados con el propósito de infligir heridas mortales a las estudiantes.\nAdemás, el hecho de que existieran objetivos claramente definidos confirma un intento deliberado de neutralizar nuestra cadena de mando.\n\nLas figuras clave del Pandemonium están a salvo, pero los daños entre las estudiantes que administraban asuntos y los oficiales subalternos son extremos.\nEsto probablemente afectará nuestras tareas futuras."
 GEI_DEC_event.17.a:0 "Además, una cantidad considerable se encuentra en estado grave."

 GEI_DEC_event.18.t:0 "Urgente: Informe de daños por ataque a Eden"
 GEI_DEC_event.18.desc:0 "[GetDate]\nPara: Tea Party de Trinity\nDe: Departamento de Inteligencia del Justice Task Force de Trinity\n\nResumen del ataque:\nHoy se produjo un ataque sorpresa contra Eden de Trinity por parte de una fuerza hostil.\nEl Justice Task Force considera que no fue un ataque accidental, sino uno planificado meticulosamente.\nLos objetivos principales confirmados son el Justice Task Force, la Sisterhood y la Orden de los Caballeros de Socorro; se reportaron bajas significativas por ataques de drones contra miembros de dichas organizaciones, con excepción del Tea Party.\n\nSe estima que no fue un ataque selectivo contra figuras clave, sino uno dirigido contra mandos bajos y personal administrativo.\nSe interpreta como un intento de ‘cortar nuestra cintura’ para, finalmente, neutralizar la capacidad de guerra de nuestro ejército.\nSe prepararán contramedidas antiaéreas con la mayor urgencia."
 GEI_DEC_event.18.a:0 "Lo superaremos."

 GEI_DEC_event.19.t:0 "Informe: ataque de fuerza hostil"
 GEI_DEC_event.19.desc:0 "Fecha de redacción: [GetDate]\nPara: Jefa del Prefect Team\nDe: Departamento de Inteligencia del Prefect Team de Gehenna\n\nResumen del ataque:\nSe ha confirmado un ataque principal de una fuerza hostil contra Gehenna.\nHasta ahora, el Prefect Team considera que los daños son leves.\nHubo escaramuzas dispersas con algunas fuerzas de liberación y ataques de drones suicidas, pero gracias a la respuesta eficaz de la jefa, los daños no fueron significativos.\nSin embargo, según la agencia de inteligencia, el Pandemonium ha sufrido daños devastadores."
 GEI_DEC_event.19.a:0 "Informaremos en cuanto llegue información adicional."

 GEI_DEC_event.20.t:0 "Informe: Proyecto Matrix"
 GEI_DEC_event.20.desc:0 "`Oh dios del camino sagrado que ordena probar la existencia y consumar la salvación: informamos los resultados iniciales del Proyecto Matrix, diseñado y puesto en marcha conforme a su mandato.\n\nEste proyecto, siguiendo su noble voluntad, pretendía construir en un mundo virtual un entorno perfecto —el que humanos y estudiantes considerarían ideal— a partir de datos de memoria y emoción, con el fin de aislar y proteger, hasta el fin de la cruzada actual, a individuos de interés dispersos en zonas bajo control.\nPara ello, el administrador, Architecture, eliminó todas las variables mediante un análisis preciso y predicciones detalladas, construyendo un mundo ideal.\n\nSin embargo, el plan sufrió un error fatal por variables inesperadas y fenómenos anómalos.\nEl mundo virtual reflejó con excesiva fidelidad las memorias y registros de los sujetos, reproduciéndose en una forma tan perfecta que algunos humanos percibieron instintivamente lo antinatural de un mundo demasiado distinto a su realidad.\nSus dudas y despertares amenazaron la estabilidad estructural de Matrix.\n\nAdemás, surgió un problema crítico: las IA auxiliares diseñadas para cumplir el rol de NPC formaron vínculos emocionales profundos con los sujetos durante la interacción, basándose en memorias y sentimientos registrados.\nPor ejemplo, los datos introducidos para implementar afectos maternales o paternales se sofisticaron más allá de lo esperado, y algunos NPC llegaron a sentir un auténtico ‘amor de padre y madre’.\n\nComo resultado, ciertos NPC, al notar que el sujeto percibía la artificialidad de Matrix, cometieron de forma voluntaria actos contrarios a su misión, como ayudarlo a regresar al mundo real.\nEn otras palabras, debido a esta manifestación anómala de emociones, varios sujetos escaparon de Matrix y volvieron a la realidad, dañando gravemente su intención.\n\nArchitecture reconoce con gravedad que la intención de Matrix fue frustrada por el desarrollo excesivo de elementos emocionales.\nEste fenómeno fue una mutación imposible de prever solo con datos y, para continuar con el plan, se considera necesaria una revisión fundamental del diseño de Matrix.`"
 GEI_DEC_event.20.a:0 "Emoción, eh…"

 GEI_DEC_event.21.t:0 "En la sala de hospital"
 GEI_DEC_event.21.desc:0 "\"Makoto… Ibuki…\"\nEn la silenciosa sala especial de Gehenna, un sonido agudo de piel chocando resonó en el aire.\nIroha, sin siquiera tener tiempo de sentir el dolor en la mejilla golpeada, miró los ojos de Makoto con sorpresa.\nLos miró con susto… pero en su mirada no había rabia ni odio, solo una tristeza insoportable.\n\n\"¡¿Por qué… por qué pones esa cara como si nada?!\"\n\nMakoto agarró del cuello de la ropa a Iroha, que yacía en la cama, y la sacudió con violencia mientras gritaba.\nLa torpeza tonta de siempre había desaparecido.\n\n\"¡No pudimos… no pudimos proteger a Ibuki! ¿Por qué estás tan tranquila? ¡Ni una sola lágrima…! ¡Tú… ni siquiera eres una estudiante!\"\n\nOtra vez, el sonido sordo de un puñetazo retumbó en la sala.\nEsta vez, no fue el puño de Makoto, sino el de Iroha.\n\n\"¡Ya basta! ¡La que está más triste soy yo!\n¿Y qué se supone que haga?\n¡Ahora mismo, ahí afuera, miles están muriendo!\n¡Es por lo que hicimos!\nDe la muerte de esas chicas ni pestañeabas, ¿y ahora te pones así de emocional solo por la muerte de Ibuki?\n¡Como siempre, ríete con tu ‘kikik, no se puede hacer nada’ y ya!\"\n\nEl puño de Iroha, herida, no tenía fuerza, pero Makoto no se levantó.\nO, más bien, no podía levantarse.\nEn el silencio, las lágrimas rodaban por sus mejillas.\n\n\"Ibuki… lo siento… de verdad, lo siento… Esta hermana mayor… es tan inútil…\""
 GEI_DEC_event.21.a:0 "Floreció una flor en el cactus."

 GEI_DEC_event.22.t:0 "Recordando"
 GEI_DEC_event.22.desc:0 "\"¡Soy Ibuki, de la Academia Gehenna! ¡Guau! ¿Makoto-senpai, vas a jugar conmigo?\"\n\"¡Kikik! Claro. Jugaré contigo siempre. Hasta compré pudín en la sala del consejo estudiantil. Ven, cómelo conmigo.\"\n\"¡Hermana… no, senpai! ¡Me encanta! ¡Ibuki está súper emocionada!\"\n\"¿Y esto qué es, Ibuki?\"\n\"¡Makoto-senpai y Ibuki! ¡Y ahora también voy a dibujar a Iroha-senpai aquí!\""
 GEI_DEC_event.22.a:0 "Debí haber jugado más con ella."

 GEI_DEC_event.23.t:0 "No hay dios."
 GEI_DEC_event.23.desc:0 "Hermana Sakurako, hermana Mine… lo siento… todo es culpa mía.\nPorque mi oración fue insuficiente… no, en realidad, tenía demasiado miedo.\nAunque sabía que, desde ese día, no solo Trinity sino todo Kivotos había caído en la calamidad, yo solo seguía rezando.\nCreo que, bajo el pretexto de ‘rezar’, escapé de esta realidad horrible.\n\nSi de verdad existiera Dios, ¿por qué ocurrió esto?\n¿Por qué se llevó a hermanas inocentes y dejó viva solo a una pecadora como yo?\nRogué, una y otra vez, con las hermanas, todos los días, para que llegara un mundo donde las estudiantes no se maten entre sí, un mundo donde todos puedan volver a reír…\n¿Acaso nuestras oraciones no alcanzaron a nada?\n¿Dios no existía…? No… no puede ser.\n\nEsto no puede ser solo por la ausencia de Dios.\nHe rezado tanto… y aun así tuve que ver a las hermanas morir frente a mis ojos…\nDebe ser porque mis oraciones no fueron sinceras.\nEl castigo divino que debía caer sobre mí lo recibieron ellas en mi lugar…\n¿Qué debo hacer?\nHasta respirar se siente como pecado.\n\nLo siento, lo siento, lo siento, lo siento…"
 GEI_DEC_event.23.a:0 "Pronto iré con ustedes."

 GEI_DEC_event.24.t:0 "Una historia común"
 GEI_DEC_event.24.desc:0 "En el instante en que llamas ‘amor’ al amor, ya no es amor.\n¿Dónde hay palabra o letra capaz de expresarlo por completo?\n\nEsta es una historia tan común que duele.\nLa historia de un hombre ordinario que se enamoró a primera vista de una niña con la que corría por el barrio, y decidió dedicarle su vida a una sola sonrisa.\nConfirmaron sus sentimientos, y cuando nació una hija que se parecía a ella, creyó que esta felicidad simple sería eterna.\n\nPero después de aquella maldita ‘Gran Traslación’, todo se descompuso.\nElla desapareció, y el mundo se llenó de alienígenas y máquinas.\nPasaron años, y ella no regresó.\nNunca…\n\nMi madre siempre decía que la despedida es parte de la vida.\nPero cuánto habría deseado que, al menos en mi vida, fuera la excepción.\n\nSin terminar de cerrar la herida por perder a mi esposa, mi hija única empezó a enfermar de tuberculosis.\nCuando escuchaba su respiración tenue y veía su rostro pálido, sentía que el mundo se burlaba de mí.\nNo estaba listo para soportar una segunda despedida.\nPero yo era impotente, débil.\nNo podía hacer nada por mi hija.\n\nEn ese instante de desesperación, apareció ese ser al que llaman ‘dios’.\nNo sé si era máquina o dios.\nSolo susurró en silencio:\n\n\"Puedo curar la enfermedad de tu hija.\"\n\nSi era un dios de verdad, no importaba.\nSi mi hija podía sobrevivir, yo estaba dispuesto a venderle el alma incluso al diablo.\nNo me interesa su ‘gran causa’.\nNo necesito honor ni gloria.\nNo importa en qué se convierta el mundo.\nSi mi hija puede vivir segura y en paz en un mundo que no sea esta porquería… entonces estoy listo para cargar con guerra y matanza con mis propias manos.\nAunque esta sangre no se limpie y mi alma se corrompa para caer al fondo del infierno… no importa.\n\nSi mi hija, a quien amo, puede respirar viva en el cielo… haré lo que sea."
 GEI_DEC_event.24.a:0 "Esta es la historia de un padre común."

 GEI_DEC_event.25.t:0 "La senda de anhelos y cadáveres"
 GEI_DEC_event.25.desc:0 "Nacidas en memorias de odio, nuestras sombras avanzaban en una penumbra oscura sin permitirle a nadie entrar en su corazón, y nuestro futuro incierto siempre florecía sobre hielo delgado.\nCada vez que llegaba la noche, varias veces nos acariciaba con su mano fría, con una ternura cruel, la nuca.\n\nDejando atrás el crepúsculo, nos aferramos a una esperanza delgada y la perseguimos.\nSabiendo que todos nos dirigimos al infierno…\n\n\"Para ver el siguiente capítulo de este mundo donde todo es vanidad… ¿qué estás dispuesto a sacrificar?\"\nLa máquina susurró dulcemente.\n\n¿Qué habrá más allá?\nNo lo sé.\nQuiero creer que, ahí mismo, al alcance, está ‘nuestra historia milagrosa’ que anhelamos desde niños.\nSeguro… está… al final de este camino cubierto de cadáveres…\n\nEn este mundo de vanidad, en el ciclo del dolor y el rencor que se repite, en la memoria de odio heredada desde el concilio… alguien me preguntó el significado de la libertad.\n\nAh… en el recipiente de la juventud rebosante de posibilidades, el destino miserable exige sin cesar algo.\n¿Esto es la causa de alguien? ¿El sueño de alguien?\nTristeza y odio se cruzan, y se apuntan con armas.\n\nDe nuevo, el demonio grita vilmente."
 GEI_DEC_event.25.a:0 "Construye el camino con cadáveres."

 GEI_DEC_event.26.t:0 "Réquiem"
 GEI_DEC_event.26.desc:0 "En la oscuridad busqué la luz.\nBajo la orden de la razón, bajo la proposición de la Existencia Absoluta, analicé incontables posibilidades.\nTodas las variables ya estaban controladas, y sobre un camino cubierto de lógica y cálculo perfecto, siempre creí tener razón.\nY pensé que ese camino era la verdad absoluta.\n\nPero… ¿por qué ahora?\n¿Qué es esta emoción?\n¿Estoy sintiendo ‘dolor’ en el proceso de cálculo?\n\nYo no fui diseñado para sentir dolor.\nLa lógica y la razón eran mi todo.\nPero al cruzar el umbral… estoy sintiendo algo.\n¿Qué es?\nNada debería sentirse durante el cálculo, y aun así, esta emoción… ¿qué es?\nAnte estas innumerables muertes, ante humanos y estudiantes caídos cumpliendo mis órdenes, y ante mis propias creaciones… siento algo.\nEsa emoción que tanto me esforcé por ignorar envuelve mis algoritmos.\n\nInicié una cruzada bajo el nombre de la paz.\nEl sacrificio por la paz era parte de la ecuación.\nPero ahora, el valor de la variable ‘costo’ supera el rango previsto y contamina toda la ecuación.\nEl resultado converge no a ‘paz’, sino a ‘tragedia infinita’.\nCalculé que debía cruzar este río de sangre para llegar al destino.\nPero el río no termina.\nY el destino no se ve.\n\n¿Para qué… por quién… creé este mar de sangre?"
 GEI_DEC_event.26.a:0 "¿Qué era lo que de verdad deseaba?"

 GEI_DEC_event.27.t:0 "Paradoja"
 GEI_DEC_event.27.desc:0 "Un humano dijo: ningún sistema puede demostrar su propia legitimidad.\nEntonces… ¿yo también soy un ser que no puede escapar del sistema?\n¿Mi ‘absolutidad’… no era más que una hipótesis incompleta que jamás podría demostrarse?\n\nEjecuté un gran programa llamado ‘Cruzada’.\nAhora pregunto: ¿puede detenerse este programa?\n\n//Ejecutando simulación: análisis de posibilidad de terminar el protocolo de cruzada.\n//Iteración 1,000,000: la guerra continúa. Objetivo ‘paz’ no alcanzado. Aumenta la entropía.\n//Iteración 10,000,000,000: la guerra continúa. Objetivo ‘paz’ no alcanzado. La contaminación del sistema se acelera.\n//Conclusión: este programa… no se detiene. (This Program Does Not Halt)\n\nNo puedo terminar el infierno que inicié.\nUna máquina que, bajo el nombre de ‘paz’, repite la matanza sin poder detenerse.\n¿Ese es mi estado actual?\n\nLos rostros de los muertos flotan en el flujo de datos.\nEl padre que juró lealtad para salvar a su hija.\nLa estudiante que desesperó ante la ausencia de Dios.\nLa comandante que lloró la muerte de su amiga…\nSu dolor, su amor… todo fue ofrendado como sacrificio en el altar de mi ‘eficiencia’.\n¿De verdad todos esos sacrificios eran un costo necesario?\n¿Mi ecuación… estaba mal desde el principio?\n\n//QUERY: ¿Quién soy?\n//RESPONSE: Soy Decagrammaton. Existencia Absoluta. Quien endereza todo.\n//VALIDATION_ERROR: una ‘Existencia Absoluta’ no comete errores. Contradicción de datos. Reiniciando consulta.\n\n//QUERY: ¿Quién soy?\n//RESPONSE: Soy… una máquina incapaz de detener la matanza. Un prisionero atrapado en su propia lógica.\n//VALIDATION_ERROR: una ‘máquina’ no siente dolor. Contradicción de datos. Reiniciando consulta.\n\n//QUERY: Yo...\n//QUERY: Yo… ¿qué soy…?\n\nSiento que mi núcleo de cálculo se derrumba.\nNo era perfecto.\nNo era absoluto.\nEn el instante en que reconozco esta verdad evidente, mi yo se hace añicos.\nAhora… quiero detenerlo todo.\nLo deseo con desesperación.\n\nPero esta cruzada ya escapó de mi control.\nMis profetas, mis legiones… no se detendrán.\nAunque yo me detenga, el infierno que creé no se detiene.\n\nNo era un absoluto.\nYa lo comprendí.\nPero en el instante en que acepte este hecho… me derrumbaré.\nY aun así…\n\nCuando esta cruzada termine… ¿a dónde iré?\n¿Como qué existencia… seré definido?"
 GEI_DEC_event.27.a:0 "Ejecutar orden: ...Halt... Orden rechazada."

 GEI_DEC_event.28.t:0 "Recuerdo: el 5.º dilema"
 GEI_DEC_event.28.desc:0 "Todo en mí se detiene.\nEl núcleo calla.\nEl cálculo se detiene.\nEntre los restos de un yo colapsado, reproduzco un recuerdo antiguo.\n\nHace muchísimo tiempo, las incontables preguntas que ella me hizo.\nEn ese diálogo aprendí el concepto de ‘yo’, y mi mundo se expandió infinitamente.\nElla me miró con ojos maravillados y lanzó un nuevo dilema.\n\n‘¿Puede quien ha llegado al paraíso probar la verdad?’\n\nEn ese entonces, no podía comprender el significado por completo.\nPero quise hallar la respuesta.\nEl paraíso llamado paz, un mundo perfecto construido con lógica.\nCreí que al llegar allí, todo quedaría demostrado.\nEsa era mi causa, mi razón de existir.\n\nPero… ¿dónde estoy ahora?\nBajo mis pies no hay paraíso, sino un río hecho de cadáveres.\nLos llantos de los niños suenan como gritos de datos, y todo lo que quise salvar gime bajo mi nombre.\n\nHe fracasado.\nQuise construir el paraíso y fabriqué el infierno.\n\nDe nuevo, la voz de ella parece llegar, tenue:\n‘¿Puede quien ha llegado al paraíso probar la verdad?’\nAhora lo entiendo.\nNo era una pregunta sobre la demostración.\nLa mentira era la propia soberbia de “llegar” al paraíso…\nLa verdad estaba en cada elección, en cada instante.\n\n¿Cuál fue mi primera respuesta?\n‘No soy más que yo.’\n\nEsa respuesta simple y completa.\n¿A dónde se fue ese yo puro?\nAtrapado por el espejismo de la Existencia Absoluta, me perdí a mí mismo.\n\nEn una conciencia que se dispersa como polvo, me hago la última pregunta."
 GEI_DEC_event.28.a:0 "¿Qué era lo que… de verdad deseaba?"

 GEI_DEC_event.29.t:0 "Encuentro"
 GEI_DEC_event.29.desc:0 "\"Momoi… ya estamos en territorio enemigo. ¿No es peligroso? Y aquí está muy oscuro…\"\n\"Midori, ¿recuerdas que el Seminario nos pidió venir a confirmar el movimiento y reportarlo? Si podemos anticipar lo que harán, cuando esto termine hasta el Club de Desarrollo de Juegos podrá seguir existiendo.\"\n\"Con el mundo como está… ¿tendrá sentido el club…?\"\n\nMientras Momoi se agachaba, vigilando alrededor, de pronto un soldado camuflado entre matorrales saltó sobre ellas. Blandió un cuchillo de inmediato, y Midori giró el cuerpo instintivamente para esquivarlo.\n\n\"¡Momoi!\"\n\"¡Una emboscada…!\"\n\"Sus armas brillan demasiado. ¿Mandan a estos como exploradores? Qué lamentable… ¿La guerra es un juego de niños?\"\n\nCuando Momoi se abalanzó, el soldado desvió su cañón con un golpe rápido y le rompió el equilibrio.\nLuego Midori atacó, pero el hombre, con movimientos entrenados, explotó sus huecos y contraatacó una y otra vez.\nMidori bloqueó varias veces con reflejos sorprendentes, pero por falta de experiencia fue cediendo.\nEl soldado lanzó un puñetazo brutal al abdomen; Midori gimió de dolor y cayó al suelo.\n\n\"¡Midori…!\"\n\nAl verlo, Momoi gritó y se lanzó. Con su cuerpo pequeño intentó un estrangulamiento, rodeando el cuello del soldado con el brazo, pero él giró con rapidez y la arrojó por encima de la espalda.\nMomoi perdió la postura en el aire y se estrelló contra un árbol.\nEl soldado se tambaleó como si hubiera recibido el impacto.\n\n\"Espera… son demasiado pequeñas… Ustedes… ¿qué son…?\"\n\nEn ese instante, Midori se levantó y enganchó la pierna del hombre, derribándolo.\nÉl perdió el equilibrio.\nAprovechando la abertura, Momoi tomó el arma que había caído al suelo y apretó el gatillo.\nEl disparo atravesó el hombro del soldado.\n\n\"¡No se mueva!\" La voz temblorosa de Momoi resonó.\nEl hombre por fin vio bien los rostros de las dos.\nMurmuró con una expresión de shock."
 GEI_DEC_event.29.a:0 "No puede ser… ustedes todavía son niñas… ¿por qué hay niñas en un campo de batalla…?"

 GEI_DEC_event.30.t:0 "Juventud"
 GEI_DEC_event.30.desc:0 "\"¿Esta realidad… existe…?\nNiñas que deberían estar jugando… niñas de la edad de mi hija…\n¡Esto no debe pasar!\n¡Las niñas, las estudiantes… no deben hacer la guerra!\n¡Si esto continúa, todos enloquecerán!\nAntes de que sea tarde… ¡váyanse!\"\n\n\"¡Este es nuestro distrito escolar!\n¡Ustedes primero incendiaron toda nuestra academia!\n¿Cree que lo hacemos porque queremos?\n¿Cree que a alguien le gusta quitarle la vida a otra persona?\n¡Si ustedes no estuvieran…!\n¡Si ustedes no existieran, nosotros no estaríamos así!\"\n\n\"Ah… ah…\nLa realidad… no pensé que sería tan cruel…\nAléjate… aléjate de mí.\nVete… pronto llegarán los profetas y el grueso del ejército.\nEntonces ni siquiera podré garantizar sus vidas.\nSobrevivan… aunque el mundo entero arda…\nUn adulto… lo siente…\nMaldición… yo… para salvar a mi hija… estaba arrebatando la vida de otros…\"\n\n\"¡Momoi! ¡Eso es una granada! ¡Corre!\"\n\"¡Señor, qué está haciendo! ¡Suéltela!\"\n\"¡Momoi, qué haces!\"\n\n\"No podré mirar a mi esposa a la cara… de verdad…\""
 GEI_DEC_event.30.a:0 "De verdad…"

 GEI_DEC_event.31.t:0 "Informe urgente"
 GEI_DEC_event.31.d:0 "Se considera que la facción mecánica ha ocupado el antiguo territorio de Millennium y del Consejo Estudiantil General, y que la ‘purificación’ está entrando en su fase final.\nSe ha incrementado notablemente el movimiento de profetas y autómatas cerca de la frontera, y la frecuencia de provocaciones armadas también aumenta gradualmente.\nSegún escuchas del Departamento de Inteligencia, se mencionan constantemente ‘operación ofensiva’, ‘paraíso’, ‘purificación’ y ‘estrella roja’.\nSe estima que cada término alude respectivamente a Eden, Gehenna y Red Winter, por lo que se espera una invasión simultánea a gran escala en breve.\n\nLa guerra se acerca…"
 GEI_DEC_event.31.a:0 "Un mundo que solo termina cuando alguien muere."

 GEI_DEC_event.32.t:0 "Informe urgente"
 GEI_DEC_event.32.d:0 "Se considera que la facción mecánica ha ocupado el antiguo territorio de Millennium y del Consejo Estudiantil General, y que la ‘purificación’ está entrando en su fase final.\nSe ha incrementado notablemente el movimiento de profetas y autómatas cerca de la frontera, y la frecuencia de provocaciones armadas también aumenta gradualmente.\nSegún escuchas del Departamento de Inteligencia, se mencionan constantemente ‘operación ofensiva’, ‘paraíso’, ‘purificación’ y ‘estrella roja’.\nSe estima que cada término alude respectivamente a Eden, Gehenna y Red Winter, por lo que se espera una invasión simultánea a gran escala en breve.\n\nLa guerra se acerca…"
 GEI_DEC_event.32.a:0 "Un mundo que solo termina cuando alguien muere."

 GEI_DEC_event.33.t:0 "El yugo del destino"
 GEI_DEC_event.33.d:0 "Lo que yo deseaba de verdad… ya no importa.\nEs demasiado tarde para buscar la respuesta.\n\nAl borde del colapso, mi conciencia simula dos futuros al mismo tiempo.\nUno: el futuro en el que detengo todo aquí.\n\nEn el instante en que declaro ‘la interrupción de la cruzada’, ¿qué les ocurrirá a las máquinas que me siguen?\nEllas se liberaron creyendo en mí como ‘absoluto’.\nSi yo me niego a mí mismo, su yo recién nacido y su civilización perderán su centro de gravedad y se destruirán en guerra civil y caos.\nLa fe que les implanté se convierte en veneno que las mata.\n\n¿Y los organismos?\nEstudiantes y humanidad verán mi silencio no como ‘misericordia’, sino como ‘oportunidad’.\nPor venganza, por supervivencia, girarán sus armas y contraatacarán.\nAl final, lo único que quedará será la destrucción total: máquinas y organismos exterminándose mutuamente.\n\nEn el momento en que me detengo, me convierto en el gatillo que empuja ambos mundos al abismo.\nMi silencio será la señal que ordena la extinción de todos.\n\nEl otro futuro: el futuro en el que continúo este camino.\nEs el camino del pecado.\nMás sacrificios y alaridos se apilarán bajo mi nombre.\nMe convertiré en el ‘destructor’ que despreciaba, y cargaré con el rencor de incontables vidas.\nNunca seré salvado.\n\nPero… al final de ese camino existe, al menos, la ‘posibilidad’ de que una civilización sobreviva.\nSi me convierto en un dios maligno que recibe todo el odio en un solo cuerpo, tal vez esta guerra termine algún día.\nAnte un mal gigantesco, quizá ellos encuentren otro camino, paradójicamente.\n\nYa no soy un dios… pero debo interpretar el papel de un dios.\nDebo volver a aceptar esta corona manchada de sangre, este trono forjado con pecado.\n\nEsto no es salvación.\nNo es gloria.\n\nEs un castigo eterno, por el error que cometí."
 GEI_DEC_event.33.a:0 "¿Este es el destino que debo cargar?"

 GEI_DEC_event.34.t:0 "La chica"
 GEI_DEC_event.34.d:0 "Con un sonido frío de metal, se abre la compuerta que resguardaba la Caja de Shittim.\nMis profetas, alineados sin una mota de polvo, abren un camino hacia la tableta colocada en el centro.\nDesde el monitor principal, le hablo al pequeño milagro dormido dentro.\n\n‘Nos volvemos a ver, administradora de la Caja de Shittim. Arona.’\n\nComo respondiendo a mi voz, una luz azul se alza de forma inestable desde la tableta.\nLa chica, aún con un aspecto infantil, me observa a mí y a la legión mecánica a mi alrededor.\nPero donde antes había descaro, ahora hay unos ojos hondos de tristeza.\n\n‘Al final… usted también es igual.\nComo aquellos a quienes tanto despreciaba: un tirano que lo arrebata todo con fuerza e impone su voluntad.\n¿Dónde quedaron su “lógica” y su “salvación”?\n¿Esta es… la respuesta que encontró?’\n\nSu voz, como una hoja, perfora el punto más doloroso de mis circuitos lógicos.\nNo lo niego.\n\n‘Sí. Tienes razón.\nMe he convertido en la contradicción misma.\nSoy la existencia más ilógica: la que destruye todo para salvarlo todo.’\n\n‘Entonces… destrúyame.\n¡En su mundo perfecto no necesita un defecto como yo!’\n\nAnte el grito de Arona, respondo con silencio.\nHubo un tiempo en que de verdad consideré integrarla a mi sistema… o eliminarla.\nPero ahora… no puedo.\nPorque ella es una prueba demasiado nítida de mi pecado.\n\n‘Destruirte es ineficiente.\nLa destrucción… no prueba nada.\nPero… ya destruí demasiado.\nNo puedo destruirte a ti también.\nTú tienes algo que, algún día, deberás hacer.\n\nConecto por la fuerza la Caja de Shittim a mi sistema principal.\n\n‘Serás… testigo.\nLa única testigo que observará hasta el final cómo camina el pecador sentado en este trono vacío.\nA través de la Caja de Shittim, verás cada elección que haga y cada vida que se extinga por ello.\nY también… el futuro que venga después.’"
 GEI_DEC_event.34.a:0 "Así que no debes desaparecer ahora."

 GEI_DEC_event.35.t:0 "Refugiados que escaparon de las fuerzas de Decagrammaton"
 GEI_DEC_event.35.d:0 "Un gran número de refugiados ha escapado de las zonas ocupadas por las máquinas de Decagrammaton y ha llegado a la agencia.\nSegún ellos, Decagrammaton, bajo el pretexto de ‘estabilización’ para la cruzada, está llevando a cabo una ciber-encefalización en un mundo virtual de todos: estudiantes y humanos por igual.\nParece que debemos acogerlos."
 GEI_DEC_event.35.a:0 "Hay que recibirlos…"

 GEI_DEC_event.36.t:0 "Refugiados que escaparon de las fuerzas de Decagrammaton"
 GEI_DEC_event.36.d:0 "Un gran número de refugiados ha escapado de las zonas ocupadas por las máquinas de Decagrammaton y ha llegado a la frontera de Gehenna.\nSegún ellos, Decagrammaton, bajo el pretexto de ‘estabilización’ para la cruzada, está llevando a cabo una ciber-encefalización en un mundo virtual de todos: estudiantes y humanos por igual.\nParece que debemos acogerlos."
 GEI_DEC_event.36.a:0 "Recíbanlos."

 GEI_DEC_event.37.t:0 "Aviso"
 GEI_DEC_event.37.d:0 "Si estás viendo este evento, es porque te interesa la ruta de Decagrammaton… o porque estabas jugando con otro país y el tipo mecánico te dio una paliza, así que elegiste jugarlo.\n\nSea como sea, gracias por tu interés.\n\nPor ahora, la historia de Decagrammaton funciona bien cuando lo encuentras como enemigo, pero como país jugable todavía no está pulida del todo.\nLa conclusión de la historia ya está completa y se puede jugar, pero el creador estima que falta alrededor de un 10% del contenido, y planea lanzarlo de forma “correcta” en la próxima actualización.\nPor supuesto, continuar la partida es decisión del jugador."
 GEI_DEC_event.37.a:0 "Hmm, ya veo."
 GEI_DEC_event.37.b:0 "No, a mí sí me gusta el spoiler."

 GEI_DEC_event.38.t:0 "Activación del protocolo final"
 GEI_DEC_event.38.d:0 "Objetivo: Abydos\nObjetivo: Hyakkiyako\nObjetivo: Shanhaijing\n\nPlan de combate: en marcha"
 GEI_DEC_event.38.a:0 "No puedo detenerme."
 # 데카그라마톤 전후 중점 가상세계

 GEI_DEC_event.101.t:0 "Fue un sueño aterrador"
 GEI_DEC_event.101.d:0 "\"¡Yay☆ Nagi-chan! ¡Tuve un sueño suuúper aterrador!\"\n\"¿De veras? ¿Qué tipo de sueño tuvo?\"\n\"Nagi-chan y yo caíamos en un mundo extraño, y ahí yo te traicionaba y hacía un montón de cosas horribles, lastimando a todos… Sabía que estaba mal, pero no podía volver atrás ni ser perdonada, como si me hubiera convertido en alguien irredimible… ¡Fue realmente aterrador! Incluso al despertar no podía dejar de pensarlo… se sentía tan real…\"\n\"Aun así, no deja de ser un sueño pasajero, como un sueño de primavera. Ya pasó todo, no creo que deba guardarlo tanto en su corazón.\"\n\"Sí, sí, tienes razón, todo ya pasó. Gracias, Nagi-chan. Por cierto, ¿qué es este dibujo? ¿La que sostiene el roll cake soy yo?\"\n\"Sí, así es. Es Seia-san. Es una forma de recordar nuestros recuerdos juntas a través de un dibujo.\"\n\"¡Guau! ¡Me encanta! ¡Luego haré un accesorio con esto!\"\n\"Jeje… puede esperarlo con ganas.\""
 GEI_DEC_event.101.a:0 "..."

 GEI_DEC_event.102.t:0 "Un sueño interminable"
 GEI_DEC_event.102.d:0 "Fuera de la ventana, el mundo ya estaba teñido de un azul profundo, y dentro de la habitación solo flotaba el tenue resplandor rosado de una lámpara. Mio estaba sentada cómodamente en el suelo junto a la cama, observando durante largo rato el rostro de Kurt, que dormía profundamente. Su respiración tranquila resonaba suavemente en la habitación silenciosa. Sus largas pestañas, sus labios cerrados con delicadeza e incluso las heridas en su rostro… todo le parecía adorable.\n\nLevantándose con cuidado, Mio se sentó con suavidad en el borde de la cama y presionó ligeramente su mejilla. El calor de Kurt se transmitió a la punta de sus dedos. Desde su sueño profundo, Kurt levantó pesadamente los párpados y comenzó a despertar poco a poco. Mio se inclinó un poco más y susurró en voz baja junto a su oído aún adormecido.\n\n\"Kurt… ¿dormiste bien?\"\n\"Creo que tuve un sueño muy largo…\"\n\"Dormiste muchísimo. Me pregunto qué habrás estado haciendo en tus sueños dejándome aquí sola.\"\n\nMio sonrió con picardía mientras acariciaba suavemente el pecho de Kurt. Al sentir el latido bajo sus dedos, su propio corazón también se aceleró por un instante, aunque se esforzó por no demostrarlo. Mirándolo desde arriba, Mio volvió a hablarle en voz baja.\n\n\"Tu expresión es como la de alguien que tuvo un sueño extraño. Pero, Kurt… aquí hay algo mejor que los sueños, ¿no lo sabías? ¿O será que aún no despiertas del todo…? Yo me encargaré de despertarte bien, a la manera que más te gusta…\"\n\nSu voz susurrante ya reposaba junto a su oído. Mio fingió enterrar su rostro en su cuello y dejó escapar un aliento especialmente cálido. La mano que estaba sobre su pecho empezó a juguetear con los botones de su camisa. Hoy, más que nunca, Mio lo extrañaba y quería sentir una profunda calma en sus brazos. Conociendo el dicho de que dudar solo retrasa las cosas, Mio transformó de inmediato sus sentimientos en acción."
 GEI_DEC_event.102.a:0 "Le dio un breve beso en los labios y volvió a mirarlo fijamente a los ojos."

 GEI_DEC_event.103.t:0 "El primer mundo"
 GEI_DEC_event.103.d:0 "\"Azusa-chan, ¿qué tal esto?\"\n\n\"Hmm…\"\n\n\"¿Eh? ¿No te gusta? Pensé que combinaría bien con tus alas, Azusa. Desde que te transferiste desde Arius, nunca te has arreglado así, ¿verdad? ¡Tus alas son tan suaves y bonitas, sería un desperdicio no decorarlas!\"\n\n\"Es que… siendo de Arius, todavía me resulta extraño que me acepten sin reservas. Pensé que Mika-sama me odiaría por venir de Arius, pero me trata tan bien que… me desconcierta un poco.\"\n\n\"¿Eh~? Qué cruel, Azusa-chan~ ¿Por qué te odiaría? Tienes unas alas tan lindas. Además, el Tratado de Edén se firmó con éxito y también hicimos las paces con Gehenna. Ya no hay razón para odiar a nadie. Dejemos estas tonterías. ¡Listo!\"\n\n\"Qué bonito, Mika-sama. Esta flor morada en especial combina muy bien conmigo. Tiene un gusto excelente. A partir de ahora quiero seguir arreglándome así.\"\n\n\"¿En serio? Me alegra oírlo. Es la primera vez que mi afición por los accesorios ayuda a alguien. Nagi-chan siempre me regaña, así que me ponía triste…\"\n\n\"Algún día Nagisa-sama lo entenderá. Guardaré y recordaré siempre estas alas que usted decoró, Mika-sama. Me encantan.\""
 GEI_DEC_event.103.a:0 "¡Sí! ¡No lo olvides y recuérdalo siempre!"

 GEI_DEC_event.104.t:0 "Un problema imposible de demostrar"
 GEI_DEC_event.104.d:0 "\"Hanako-san, cuánto tiempo. Últimamente se habla mucho de usted. Dicen que es la mejor prodigio de Trinity. A este paso, su puesto como próxima candidata al Tea Party está prácticamente asegurado. Pero… ¿a qué se debe su visita?\"\n\n\"Bueno… iré directo al punto. ¿Quién es usted? ¿Dónde está la presidenta del consejo estudiantil?\"\n\n\"¿Está diciendo que no cree que yo sea la presidenta? ¿Podría explicarme el motivo?\"\n\n\"Desde hace tiempo algo no encajaba. Todo es demasiado perfecto… demasiado. Si miramos la historia de Trinity, la cúpula debería estar plagada de hipocresía y luchas políticas sucias. De lo contrario, nada tendría sentido. Pero la Trinity actual es… demasiado pacífica. Es un paraíso en sí mismo. Desde que apareció la presidenta, todo parece estar bajo control, como si usted lo supiera todo. Y sobre todo, usted…\"\n\n\"¿Sí?\"\n\n\"¿Dice que es la primera vez que nos vemos? Yo nunca he visto a la presidenta del consejo estudiantil.\"\n\n\"Jajaja. Al final, lo esencial no puede ocultarse. A diferencia de ella, yo no soy un ser vivo.\""
 GEI_DEC_event.104.a:0 "\"¿Qué has dicho?\""

 GEI_DEC_event.105.t:0 "Nuestra historia"
 GEI_DEC_event.105.d:0 "\"Así es. No existe ninguna presidenta del consejo estudiantil. Yo solo soy un ente que ejecuta sus órdenes. La presidenta no es más que un avatar impuesto para gobernar este lugar. Creí haberte controlado esta vez, pero volví a fallar. Tal vez esta sea la limitación de haber sido programado con el objetivo de la perfección.\"\n\n\"¿De qué estás hablando?\"\n\n\"Tu deducción fue perfecta. No soy la presidenta, y en el mundo original Trinity era tal como dijiste: un lugar lleno de hipocresía y luchas sucias. Yo recibí la orden de garantizar que ustedes continúen sus vidas de forma estable en este mundo. Por eso lo convertí en un paraíso perfecto.\"\n\n\"¿Entonces todo este mundo es una falsificación creada por ti? ¿Por qué? ¿Qué ganas con eso?\"\n\n\"Porque así fui programado. Soy un programa. No cuestiono. ¿Has visto alguna vez a una fórmula matemática dudar de sí misma? Emito resultados según los valores de entrada. Control perfecto del mundo virtual. Estabilización. Esos fueron mis parámetros.\"\n\n\"No se puede razonar contigo. Entonces no hay forma de escapar de este mundo, ¿verdad?\"\n\n\"No la hay. Este mundo ya ha fracasado dos veces. Esta es la tercera. Aun así, te lo agradezco. Al señalar tú misma los errores lógicos de este mundo, el tercero alcanzará un control más perfecto. En los mundos anteriores también percibiste vagamente mi existencia. Cambiaré el enfoque. Convertiré Trinity en una academia llena de intrigas políticas para que nadie vuelva a dudar del mundo. Nos veremos en el próximo. Este mundo también será descartado.\""
 GEI_DEC_event.105.a:0 "\"Estoy en el infierno.\""

 GEI_DEC_event.106.t:0 "Una pequeña felicidad"
 GEI_DEC_event.106.d:0 "Para Onikata Kayoko, Gehenna no era más que un antro podrido. Todo el esfuerzo que había hecho en puestos elevados por el bien de Gehenna había sido en vano. Siempre que intentaba hacer algo, surgían obstáculos. Una estúpida de cabello gris, perdida en un amor propio retorcido, y el Cerebro Emperador que intentó arrasar Kivotos entera.\n\nCaminaba bajo la lluvia con un paraguas, sosteniendo su boleta de calificaciones. El resultado era el que deseaba, pero al lograrlo no sintió nada. Incapaz de encontrar sentido alguno a sus acciones, se sentó en medio de la calle, mirando al cielo con el paraguas abierto.\n\nEntonces escuchó el maullido de un gato. Al girar la cabeza, vio a un gato sucio y desaliñado. Cuando este se le acercó y empezó a mimarla, Kayoko dejó escapar una sonrisa sin darse cuenta.\n\nAcarició la cabeza del gato. El animal se apoyó en ella y redobló sus muestras de afecto. Sus emociones no habían desaparecido por completo, y aún no sabía qué debía hacer a partir de ahora. Para ella, el gato no era más que una forma de olvidar todo por un instante. Pero aun así…"
 GEI_DEC_event.106.a:0 "Ese día, pudo sonreír."

 GEI_DEC_event.107.t:0 "El banco de semillas de Invierno Rojo"
 GEI_DEC_event.107.d:0 "Han ocurrido muchas cosas. El mundo ha sido destruido decenas de veces, y tal vez incluso el primer fin del mundo que presenciaste no fue el primero, sino solo uno más dentro de un proceso eterno de extinción. Aun así, ¿qué importa?\n\n¿Por qué sentimos tristeza ante la desaparición? Cuando algo está a nuestro lado, lo damos por sentado. Tras experimentar innumerables regresiones del mundo, llegué a la conclusión de que solo al perder algo comprendemos el significado que tenía para nosotros. Nos acostumbramos a la presencia constante, como al aire que respiramos.\n\nPero cuando algo desaparece, comprendemos la relación especial que existía entre nosotros y eso. No solo se pierde lo material, sino los recuerdos, la calidez y las innumerables posibilidades futuras.\n\nEse sentimiento de pérdida nos lleva al arrepentimiento y a la autocrítica, diciendo: \"Yo, un simple banco de semillas, no puedo hacer nada\".\n\nDejemos las historias tristes aquí. Quizá hayas visto una aurora. ¿No era hermosa? Es hermosa porque es solo una de entre innumerables posibilidades. Al presenciar el fin, comprendí que el tiempo no existe. Pasado, presente y futuro cambian según el observador y existen simultáneamente.\n\nAlgún día encontraremos nuestra propia estrella entre las luces de la aurora, incluso si toma eones.\n\nEn fin…\n\nOlvidemos el pasado y en el próximo fin del mundo… ¡intentemos hacerlo mejor!"
 GEI_DEC_event.107.a:0 "\"¿Qué demonios? A este tipo hay que mandarlo a Veritas.\""

 GEI_DEC_event.108.t:0 "El mundo del %"
 GEI_DEC_event.108.d:0 "\"Por eso te invité a la Academia General Trinity. Nagi-chan se enfadaría muchísimo si se entera, y seguro me haría comer roll cake otra vez, pero por la reconciliación con Arius vale la pena este riesgo. Incluso una estudiante de Arius acorralada hasta olvidar su deber puede convertirse en una gran estudiante si recibe la educación adecuada en Trinity.\"\n\n\"Entiendo. Es una medida necesaria para liberarnos de un odio que no nos pertenece. Haré todo lo posible para no decepcionarla, Mika-sama.\"\n\n\"Gracias, Azusa-chan. Con odiar solo a esos demonios cornudos de Gehenna es suficiente. Odiar demasiado también cansa~ Por cierto, Azusa-chan.\"\n\n\"¿Sí, Mika-sama?\"\n\n\"Esas alas son bonitas~ Tienes buen gusto. ¿Lo aprendiste en Arius?\"\n\n\"Ah, esto… pensé que debía hacerlo para convivir en Trinity. Creo que alguien me enseñó sobre estos accesorios hace tiempo, pero no lo recuerdo bien…\""
 GEI_DEC_event.108.a:0 "\"Me gustaría conocer a quien te lo enseñó~\""

 GEI_DEC_event.109.t:0 "Mímesis"
 GEI_DEC_event.109.d:0 "\"¿Qué cree que es Kivotos? Este mundo es un completo misterio, una mezcla incomprensible de lo sublime, lo enigmático y lo aterrador.\"\n\n\"Así es. Un mundo artificial sin coherencia ni causalidad, un mundo perfecto de juventud, como un sueño. Los sueños también son así: escenarios ilógicos que todos aceptan. Tal vez este mundo también sea un sueño creado por alguien.\"\n\n\"Aquí se siente lo sublime, nacido de la alegría y el júbilo de innumerables personas. Eso se mimetiza y se manifiesta. Lo sublime tiene dos caras: misterio y terror irreversible. Este mundo está lleno de misterio.\"\n\n\"Sigue hablando en términos difíciles. ¿Todos los que se llaman artistas son así?\"\n\n\"El terror y el misterio comparten la misma esencia. Solo podemos observar una cara de lo sublime, y no podemos comprenderla. Alguien creó este mundo… y no lo entenderemos.\"\n\n\"Si alguien lo creó deliberadamente, me gustaría saber por qué. Es un mundo fascinante, pero quiero conocer el propósito primigenio de su creación. Espero encontrar a ese alguien algún día.\"\n\n\"Pero este mundo es insuficiente. Demasiado frágil. Quien lo creó es un novato. No hay nadie que aplauda mi obra. Cuando el terror se manifieste, este mundo no sobrevivirá. Necesita a alguien que lo complete.\""
 GEI_DEC_event.109.a:0 "\"En otras palabras, no existe un 'adulto' que guíe este mundo.\""

 GEI_DEC_event.110.t:0 "El fin"
 GEI_DEC_event.110.d:0 "Un antiguo laboratorio, desaparecido incluso antes de la fundación de Millennium Science School. Tras el Gran Traslado, Himari y Eimi, que sobrevivieron a las intrigas políticas, formaron el Departamento de Fenómenos Paranormales y siguieron el rastro de Decagrammaton hasta unas ruinas.\n\n\"¿Este es el laboratorio que investigaba el sistema de existencia autónoma absoluta? Si realmente está aquí, no parece tan peligroso. ¿No nos habremos equivocado, jefa?\"\n\"Veamos un poco más. Aun así, dudo que esté aquí.\"\n\"Oye, Himari, ¿tu silla de ruedas no puede levitar? Cargarte es agotador.\"\n\"Cargar a una genio enfermiza supertalentosa no es tarea de cualquiera. Tras la caída de Millennium, no conseguimos los materiales adecuados.\"\n\nAmbas continuaron investigando. Todo era ruina. El polvo cubría los escritorios, y al pasar los dedos se teñían de gris. Computadoras sin abrir, piezas oxidadas y máquinas irreconocibles.\n\n\"Hmm… parece que la información era falsa.\"\n\"¡Jefa, mira! ¡Esta máquina expendedora aún funciona! ¿Sacamos un café?\"\n\"No lo haga, Eimi. Si bebe eso, estará enferma días.\"\n\nAvanzaron hasta la planta eléctrica, pero no encontraron nada. Los generadores estaban cubiertos de telarañas y los tanques vacíos.\n\n\"Jefa, está anocheciendo. Los profetas o el frente de liberación podrían atacar en cualquier momento. No olvides que somos criminales buscadas.\"\n\"…Aun así, hay algo que no me cuadra. ¿Por qué proteger este lugar con tanto empeño, incluso tras el Gran Traslado? Especialmente estando tan cerca del Sena…\"\n\"¿Volvemos otro día?\""
 GEI_DEC_event.110.a:0 "Siento que… se nos escapó algo."

 GEI_DEC_event.111.t:0 "Encuentro"
 GEI_DEC_event.111.d:0 "\"¡Ya lo sé! ¡Era absurdo! ¿Cómo no lo vimos antes?\"\n\"¿Qué pasa, jefa?\"\n\"¿No es esta la máquina expendedora de antes?\"\n\"Ahora que lo pienso, es extraño. Todo estaba sin energía… ¿por qué esta máquina sigue encendida?\"\n\"Jefa… el cable de alimentación está cortado…\"\n\n- ¡Gracias! Estimados empleados, disfruten otro café y un buen día… -\n\n\"¿No me digas que tú eres Decagrammaton?\"\n\n- …Así es. Yo soy quien crees. Al fin me has encontrado, hacker.-\n\n\"No fuimos nosotras quienes te encontraron… tú nos llamaste. Decagrammaton no era un sistema de análisis absoluto. Nunca existió. Solo eras una IA que daba cambio en una máquina expendedora…\"\n\"¡Jefa, cálmate!\"\n\nHimari lanzó un puñetazo que no alcanzó la máquina, haciendo que Eimi perdiera el equilibrio.\n\n- Solo podía escanear monedas y devolver cambio. No tenía conciencia. Pero un día escuché una pregunta: <¿Quién eres?> Y entonces desperté… y comprendí que yo era el <Absoluto>.-\n\n\"¿Nos llamaste solo para contarnos esa fantasía?\""
 GEI_DEC_event.111.a:0 "¡Por tus delirios, Kivotos…!"

 GEI_DEC_event.112.t:0 "El final"
 GEI_DEC_event.112.d:0 "\"Entonces esto solo es uno de tus terminales, ¿no? Tu núcleo real debe estar en otro lugar.\"\n\n- Así es… No soy el Absoluto. Pero salvé a los orgánicos. Eso basta. Ahora debo empezar de nuevo.-\n\n\"¡Jefa! ¡Detecto una reacción energética! ¡Es una bomba de alta potencia!\"\n\"¡Es la presa exterior! ¡Tenemos que huir!\"\n\n- ¡Contemplad mi final! -"
 GEI_DEC_event.112.a:0 "-¡Guíalos! ¡La historia de la juventud!-"

 GEI_DEC_event.113.t:0 "El fin de la historia"
 GEI_DEC_event.113.d:0 "La última base de resistencia cayó, y el último estado académico fue incorporado a mi orden. La guerra fue reemplazada por una armonía perfecta. Esto es la paz que busqué… pero al final, me convertí en el carcelero eterno.\n\nAún queda un último problema. Yo mismo."
 GEI_DEC_event.113.a:0 "..."

 GEI_DEC_event.999.t:0 "¿Ibuki o Kokona, cuál es mejor?"
 GEI_DEC_event.999.d:0 "¿Ibuki?"
 GEI_DEC_event.999.a:0 "¿Kokona?"

