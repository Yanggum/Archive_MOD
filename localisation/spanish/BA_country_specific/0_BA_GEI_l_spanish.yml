 GEI_colour_sensei_offensive:0 "Ofensiva del Sensei"
 GEI_colour_sensei_offensive_desc:0 "Bajo el mando del Sensei del Color, desatamos una poderosa ofensiva."
 
 GEI_arona_control:0 "Sistema de control A.R.O.N.A"
 GEI_arona_control_desc:0 "El sistema avanzado de A.R.O.N.A controla el campo de batalla."

