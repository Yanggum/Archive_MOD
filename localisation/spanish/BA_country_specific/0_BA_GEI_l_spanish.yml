 # Eventos
 GEI_event.28.t:0 "Invasión del Color"
 GEI_event.28.d:0 "Un fenómeno desconocido ha comenzado a manifestarse en todo el mundo. Una extraña luz de colores y casos de desapariciones ocurren cada vez con más frecuencia."
 GEI_event.28.a:0 "Es un presagio funesto..."

 GEI_event.29.t:0 "Desaparición de investigadores"
 GEI_event.29.d:0 "En instalaciones de investigación de todo el país, los investigadores están desapareciendo repentinamente. No queda más que un rastro extraño del Color."
 GEI_event.29.a:0 "Nuestro conocimiento está en peligro"

 GEI_event.30.t:0 "Transformación del Color"
 GEI_event.30.d:0 "La población de las tierras ocupadas está sufriendo cambios extraños. Su aspecto se va asemejando cada vez más al Color."
 GEI_event.30.a:0 "Es una evolución hacia una nueva existencia"

 # Títulos de eventos
 GEI_event.31.t:0 "Red del Color completada"
 GEI_event.31.d:0 "Por fin hemos completado la construcción de una red del Color a escala global. Ahora, todas las entidades corrompidas por el Color están conectadas en una sola consciencia."
 GEI_event.31.a:0 "Nos hemos convertido en uno"

 GEI_event.32.t:0 "Infiltración en instalaciones de investigación"
 GEI_event.32.d:0 "Una entidad desconocida se ha infiltrado en nuestras instalaciones de investigación. Datos cruciales están desapareciendo."
 GEI_event.32.a:0 "Debemos detener esto"

 GEI_event.33.t:0 "Mejora de Decagrammaton"
 GEI_event.33.d:0 "Se ha completado el desarrollo de nuevo equipo para Decagrammaton. Mostrará una capacidad de combate mucho mayor que antes."
 GEI_event.33.a:0 "Una evolución perfecta"

 GEI_event.34.t:0 "Red de portales dimensionales establecida"
 GEI_event.34.d:0 "La red de portales dimensionales se ha construido con éxito. Ahora podemos llegar a cualquier lugar en un instante."
 GEI_event.34.a:0 "El espacio ya no es una limitación"

 GEI_event.35.t:0 "Ataque sorpresa a través de un portal dimensional"
 GEI_event.35.d:0 "A través de un portal dimensional surgido de la nada, fuerzas enemigas han penetrado profundamente en nuestro territorio."
 GEI_event.35.a:0 "No hay forma de prepararse para una amenaza así"

 GEI_event.36.t:0 "Corrupción del Consejo Estudiantil"
 GEI_event.36.d:0 "La influencia del Color se ha extendido por todo el Consejo Estudiantil. Ahora son una herramienta perfecta para materializar nuestra voluntad."
 GEI_event.36.a:0 "La escuela ahora es nuestra"

 GEI_event.37.t:0 "Corrupción del halo"
 GEI_event.37.d:0 "Un Color desconocido está corrompiendo los halos de nuestras estudiantes. Su capacidad de combate está cayendo en picado."
 GEI_event.37.a:0 "Debemos detener esta corrupción"

 GEI_event.38.t:0 "Manifestación del poder de la diosa"
 GEI_event.38.d:0 "La Diosa de la Muerte ha liberado todo su poder. Nuestras fuerzas han obtenido una potencia incomparable."
 GEI_event.38.a:0 "La victoria es nuestra"

 GEI_event.39.t:0 "Terror de la muerte"
 GEI_event.39.d:0 "El terror que esparce la Diosa de la Muerte está paralizando a nuestro ejército. La moral de las tropas se desploma."
 GEI_event.39.a:0 "Debemos superar este terror"

 GEI_event.40.t:0 "Escuadrones de saqueo organizados"
 GEI_event.40.d:0 "Se ha completado la organización de escuadrones de saqueo profesionales. Ahora podremos expoliar los recursos del enemigo con mayor eficiencia."
 GEI_event.40.a:0 "Traedlo todo"

 GEI_event.41.t:0 "Ataque a instalaciones militares"
 GEI_event.41.d:0 "Unidades desconocidas del Color han asaltado nuestras instalaciones militares. Se han robado grandes cantidades de equipo y recursos."
 GEI_event.41.a:0 "Nuestra fuerza se ha debilitado"

 GEI_event.42.t:0 "Análisis de la IA táctica"
 GEI_event.42.d:0 "El avanzado sistema de IA del enemigo está analizando nuestras tácticas a la perfección. Cada uno de nuestros movimientos está siendo anticipado."
 GEI_event.42.a:0 "Nunca nos habíamos enfrentado a algo así"

 GEI_event.43.t:0 "Una sombra se cierne"
 GEI_event.43.d:0 "Sombras desconocidas están infiltrándose más allá de nuestras fronteras. La presencia de un enemigo invisible está sumiendo a nuestra población en el terror."
 GEI_event.43.a:0 "Debemos detener este miedo"
 
 GEI_event.44.t:0 "Coloración de instalaciones industriales"
 GEI_event.44.d:0 "Nuestras fábricas están tiñéndose de un color extraño. Los trabajadores están confundidos, y las líneas de producción se están paralizando lentamente."
 GEI_event.44.a:0 "Esto está fuera de control"
 
 GEI_event.45.t:0 "La ofensiva final"
 GEI_event.45.d:0 "El ejército del Color ha iniciado una ofensiva de una magnitud sin precedentes. El cielo se ha teñido de colores extraños y nuestras líneas defensivas están colapsando en cuestión de instantes."
 GEI_event.45.a:0 "¿Será este el final?"

 GEI_event.46.t:0 "Colapso de instalaciones industriales"
 GEI_event.46.d:0 "Las instalaciones industriales corrompidas por el Color han empezado a colapsar por sobrecarga. Las líneas de producción se han detenido y los trabajadores han caído en pánico."
 GEI_event.46.a:0 "No podemos controlarlo"

 GEI_event.47.t:0 "Agotamiento de recursos"
 GEI_event.47.d:0 "Por la extracción indiscriminada, las minas y los pozos petroleros están comenzando a agotarse. Las estructuras subterráneas se vuelven inestables."
 GEI_event.47.a:0 "Necesitamos más recursos"

 GEI_event.48.t:0 "La sombra se infiltra"
 GEI_event.48.d:0 "Sombras extrañas se están filtrando en nuestro territorio. Un miedo invisible está cayendo sobre nuestra población."
 GEI_event.48.a:0 "Debemos detener este terror"

 GEI_event.49.t:0 "La realidad se tambalea"
 GEI_event.49.d:0 "La realidad ha comenzado a distorsionarse. El mundo que conocíamos se está derrumbando."
 GEI_event.49.a:0 "¿Es esto una pesadilla?"

