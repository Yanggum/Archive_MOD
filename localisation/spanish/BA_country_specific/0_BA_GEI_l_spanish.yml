l_spanish:
 Hakari_Atsuko_GEI:0 "§RDesaparecida§!"

 #Árbol de enfoques de Gematria
 GEI_The_Colour_Focus_tree:0 "Árbol de enfoques del Color"
 GEI_jaegeon:0 "Reconstrucción"
 GEI_jaegeon_desc:0 "Para responder a una situación que ha cambiado de forma repentina, es necesario reconstruir nuestras instalaciones. Reconstruiremos y repararemos rápidamente nuestras instalaciones para adaptarnos al nuevo mundo."
 GEI_factoryutilization:0 "Aprovechamiento de fábricas"
 GEI_factoryutilization_desc:0 "Reestructuraremos ligeramente las fábricas existentes para que nos resulten más fáciles de utilizar. Esto permitirá aumentar rápidamente nuestra capacidad industrial y mejorar nuestra adaptabilidad al nuevo mundo."
 GEI_gongjangjadonghwa:0 "Automatización de fábricas"
 GEI_gongjangjadonghwa_desc:0 "Utilizaremos la tecnología de la que disponemos para automatizar las fábricas. Esto va más allá de la automatización básica operada por mano de obra humana, reduciendo drásticamente la cantidad de personal necesario y permitiendo reasignar esa fuerza de trabajo a otros ámbitos."
 GEI_gemateuliagunsugongjang:0 "Fábrica militar de Gematria"
 GEI_gemateuliagunsugongjang_desc:0 "Construiremos fábricas militares especiales para producir nuestras armas, lo que significa que Gematria podrá asegurar una capacidad de resistencia significativa en el nuevo mundo."
 GEI_yeongusilboggu:0 "Restauración de laboratorios"
 GEI_yeongusilboggu_desc:0 "Restauraremos los laboratorios colapsados para fortalecer nuestras capacidades de investigación y desarrollo, y adaptarnos con mayor rapidez a la tecnología del nuevo mundo."
 GEI_yeongusiseoljeungchug:0 "Expansión de instalaciones de investigación"
 GEI_yeongusiseoljeungchug_desc:0 "La capacidad industrial de Gematria ha crecido hasta el punto de poder sostener más instalaciones de investigación, por lo que ampliaremos dichas instalaciones para incrementar drásticamente nuestras capacidades de I+D."
 GEI_yeongguggaeib:0 "Intervención en el Reino Unido"
 GEI_yeongguggaeib_desc:0 "Tras estrellarnos en estas ‘Islas Británicas’ junto a Kaiser Corporation, entramos en conflicto con las fuerzas militares locales. Logramos sofocar fácilmente la resistencia y establecernos, pero Kaiser Corporation sigue luchando con dificultad. Podemos intervenir para asegurar las Islas Británicas."
 GEI_gingeubcheolsu:0 "Retirada de emergencia"
 GEI_gingeubcheolsu_desc:0 "El intento de asegurar las Islas Británicas ayudando a Kaiser Corporation ha terminado en un fracaso desastroso. Kaiser Corporation fue aplastada por el poder del ejército del Reino Unido, y nosotros estamos a punto de correr la misma suerte. Debemos retirarnos rápidamente hacia Islandia."
 GEI_jaejeongbi:0 "Reorganización"
 GEI_jaejeongbi_desc:0 "Tras establecernos en las Islas Británicas, es necesario eliminar a los grupos de resistencia locales que aún permanecen y reorganizar la estructura conforme a los ideales de Gematria."
 GEI_hyeonsangpaag:0 "Análisis de la situación"
 GEI_hyeonsangpaag_desc:0 "El fenómeno por el cual todo Kivotos fue trasladado en bloque a este lugar llamado ‘Tierra’ requiere una investigación exhaustiva. Como parte de este proceso, será necesario volver a investigar tecnologías acordes al nivel tecnológico local."
 GEI_uigyeonchungdol:0 "Conflicto de opiniones"
 GEI_uigyeonchungdol_desc:0 "Durante el proceso de reorganización y reestructuración completa de nuestra organización, surgieron conflictos de opinión entre nuestros miembros. Necesitamos recopilar opiniones durante un largo periodo y decidir el rumbo que debe tomar Gematria."

 #Gematria – Ruta de Beatrice
 GEI_beateulicheuiseungli:0 "La victoria de Beatrice"
 GEI_beateulicheuiseungli_desc:0 "En la reunión para decidir el rumbo de Gematria, las opiniones defendidas por Beatrice recibieron un apoyo considerable. Beatrice actuará ahora como la líder oficial de Gematria."
 GEI_sinbijigjo:0 "Tejido de misterio"
 GEI_sinbijigjo_desc:0 "Utilizando diversos materiales de investigación obtenidos en Arius, Beatrice ha creado un método para extraer misterio en medio del caos de Kivotos. Tras nuestra llegada aquí, recuperaremos el misterio que escaseó drásticamente y resolveremos un problema crónico."
 GEI_aliuseucheolsu:0 "Retirada de Arius"
 GEI_aliuseucheolsu_desc:0 "Debido al cambio repentino de la situación, es posible que ya no podamos mantener nuestra influencia en la sucursal de Arius. Recolectaremos los últimos recursos restantes allí y los trasladaremos."
 GEI_hagsaengdeuleuldongwonhada:0 "Nuevas estudiantes de Arius"
 GEI_hagsaengdeuleuldongwonhada_desc:0 "Podemos utilizar la influencia que aún nos queda en la sucursal de Arius para atraer a las estudiantes a nuestro bando. Las utilizaremos para reforzar la defensa de Gematria y prepararnos ante la amenaza que se cierne sobre las Islas Británicas."
 GEI_loyeolbeulleodeuhwagbo:0 "Asegurar la Sangre Real"
 GEI_loyeolbeulleodeuhwagbo_desc:0 "Para los ideales de Beatrice, el escuadrón Arius —y en particular la Sangre Real que existe entre ellas— es absolutamente necesario. Iniciaremos el contacto para asegurar a la Sangre Real, ‘Atsuko’."
 GEI_uisigcheosdangye:0 "Ritual, primera fase"
 GEI_uisigcheosdangye_desc:0 "Desde hace tiempo, Beatrice ha soñado con poseer misterio y ascender como una nueva existencia. Ahora que el mayor obstáculo, la obtención de la Sangre Real, ha sido superado, Beatrice da el primer paso para llevar a cabo su ritual."
 GEI_munjehaegyeol:0 "Resolución del problema"
 GEI_munjehaegyeol_desc:0 "Durante el avance de la primera fase del ritual, nos dimos cuenta de que el misterio necesario era insuficiente. El misterio de este lugar es extremadamente escaso y débil en comparación con el de Kivotos. Intentaremos resolver este problema."
 GEI_hyeonsileuljigsihada:0 "Enfrentar la realidad"
 GEI_hyeonsileuljigsihada_desc:0 "Aunque se confirmó que el misterio necesario es insuficiente, Beatrice tomó una decisión que traiciona sus propias convicciones. Decidió forzar el ritual tal como está y conformarse con obtener un misterio incompleto. Aún no sabemos qué consecuencias traerá esta elección."
 GEI_chawoncheongongyeongu:0 "Investigación de perforación dimensional"
 GEI_chawoncheongongyeongu_desc:0 "Si hemos venido hasta aquí, también podemos regresar. Beatrice y el equipo de investigación se centrarán en estudiar este fenómeno para encontrar una forma de traer el abundante misterio de Kivotos hasta aquí —o de regresar— y finalmente llevar a cabo un ritual ‘perfecto’."
 GEI_jeobchog:0 "Contacto"
 GEI_jeobchog_desc:0 "La investigación del dispositivo de perforación dimensional ha finalizado, y el primer experimento está finalmente ante nosotros. Abriremos una pequeña grieta dimensional para conectar brevemente este lugar con ‘otro sitio’, y probaremos si es posible transferir misterio a través de esta abertura. Probablemente, todo está bajo control y es completamente seguro."
 GEI_uisigneomeolo:0 "Más allá del ritual"
 GEI_uisigneomeolo_desc:0 "El perforador dimensional funciona perfectamente… probablemente. Beatrice procederá ahora con el segundo ritual utilizando una cantidad masiva de misterio. El camino hacia la perfección estaba más cerca de lo esperado.\n\n§tAscensión.§!"
 GEI_no:0 ""
 GEI_no_desc:0 ""
