 GEI_decagramaton_alliance_decision_category: "Búsqueda de aliados"
 GEI_decagramaton_alliance_decision_category_desc: "Encontrar aliados que deseen seguir la voluntad de Decagrammaton es una tarea sumamente difícil. La mayoría de los países no estará dispuesta a cooperar con Decagrammaton. Sin embargo, si se trata de un país cuyo gobierno ya ha sido tomado por robots, entonces Decagrammaton podría intentar §Yadoctrinarlos§!."

 GEI_finding_alliance_GEH: "Propuesta de alianza a [GEH.GetNameDef]"
 GEI_finding_alliance_GEH_desc: "Sorasaki Hina actúa como si fuese un organismo vivo, pero Decagrammaton ya ha determinado que en realidad es un robot que ha reemplazado a la verdadera «Sorasaki Hina». Decagrammaton puede intentar adoctrinar a Hina. Si tiene éxito, [GEH.GetNameDef] se incorporará a nuestra alianza. ¿Y si fracasa? La relación hostil simplemente se mantendrá, así que no habrá consecuencias perjudiciales para nosotros."

