 GEI_american_extraction:0 "Extracción de recursos de Estados Unidos"
 GEI_american_extraction_desc:0 "Convertimos los recursos de Estados Unidos en nuestros."

 GEI_convert_civilian_industry:0 "Conversión de industria civil"
 GEI_convert_civilian_industry_desc:0 "Convertimos fábricas civiles en fábricas militares."
  
 GEI_intensify_signal_interference:0 "Intensificar interferencia de señales"
 GEI_intensify_signal_interference_desc:0 "Paralizamos por completo las comunicaciones enemigas."
 
 GEI_shadow_infiltration:0 "Infiltración de sombras"
 GEI_shadow_infiltration_desc:0 "Sembramos el terror dentro del enemigo."

 GEI_efficient_production_control:0 "Control de producción eficiente"
 GEI_efficient_production_control_desc:0 "Bajo la influencia del Color, la eficiencia de las instalaciones de producción se ha maximizado."

