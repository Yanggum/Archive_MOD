 GEK_get_halo_infantry_tt:0 "§YEstudiantes de la Academia Oceánica Odisea§! estarán disponibles."
 GEK_demo_event.1.t: "Elecciones libres"
 GEK_demo_event.1.d: "Se han celebrado elecciones."
 GEK_demo_event.1.a: "El Frente Popular obtuvo la mayoría."
 GEK_demo_event.1.b: "Ganó la coalición Blanco y Negro."

 GEK_event.1.t:0 "Captura de un barco sospechoso"
 GEK_event.1.desc:0 "Un barco sin identificación clara ha sido capturado por nuestra armada cerca de Gotland. Tras interrogar a los tripulantes, descubrimos que llevan halos en la cabeza y dicen pertenecer a la Academia Oceánica Odisea, lo que indica que podrían ser parte de ese tal Kivotos."
 GEK_event.1.a:0 "Reclútenlos."

 GEK_event.2.t:0 "Reciclaje"
 GEK_event.2.desc:0 "Los barcos de la Academia Oceánica Odisea no son potentes en combate, pero están fabricados con tecnología avanzada. Podemos integrarlos a nuestra flota o desmontarlos para fortalecer nuestros propios barcos."
 GEK_event.2.a:0 "Incorpóralos a la flota."
 GEK_event.2.b:0 "Desmóntalos. Algo útil saldrá."

 GEK_event.3.t:0 "Comunicación"
 GEK_event.3.desc:0 "Confirmamos que en el norte de Gehenna aún queda la Wehrmacht alemana. Intentaron negociar con la academia, pero parece que fracasaron y han decidido actuar. Han contactado con nosotros para recuperar Alemania juntos. Lo lograremos, cueste lo que cueste."
 GEK_event.3.com_desc:0 "Confirmamos que la Wehrmacht sigue activa al norte de Gehenna. Intentaron negociar con la academia, pero sin éxito. Sin embargo, no parecen saber que derrocamos a la oficialidad anterior en un motín a bordo..."
 GEK_event.3.a:0 "Vamos allá."
 GEK_event.3.b:0 "¿Y ahora qué?"

 GEK_event.4.t:0 "Última oportunidad"
 GEK_event.4.desc:0 "Tras nuestra comunicación, la Wehrmacht estableció un cuartel temporal en el norte de Alemania y ha asegurado la zona. Esta podría ser la última oportunidad para Alemania. Mientras ellos estabilizan su situación, debemos reorganizar nuestras fuerzas y prepararnos para la tormenta que se avecina."
 GEK_event.4.com_desc:0 "La Wehrmacht ha establecido un cuartel temporal y asegurado zonas del norte. No obstante, desde que les explicamos nuestra situación, parecen reconsiderar su posición respecto a nosotros."
 GEK_event.4.bad_desc:0 "Hemos recibido noticias urgentes: la Wehrmacht ha iniciado una guerra contra Gehenna. Nuestra comunicación fue tardía e insuficiente. Debemos tomar medidas inmediatas."
 GEK_event.4.a:0 "¡Por fin una oportunidad!"
 GEK_event.4.b:0 "Es demasiado arriesgado."
 GEK_event.4.c:0 "Ni ustedes, ni nosotros, ni nadie desea una alianza."

 GEK_event.5.t:0 "Solicitud de apoyo del ejército exiliado alemán"
 GEK_event.5.desc:0 "El ejército alemán en el exilio, huyendo del colapso europeo, nos ha contactado para solicitar ayuda en su futura operación de reconquista. Podemos aceptar y ayudarlos, o mantenernos al margen de este conflicto."
 GEK_event.5.a:0 "Europa necesita aliados."
 GEK_event.5.b:0 "Es demasiado peligroso enfrentarlos."

 GEK_event.6.t:0 "Rechazo de la solicitud de apoyo de [FROM.GetName]"
 GEK_event.6.desc:0 "[FROM.GetName] ha considerado que apoyarnos es un acto demasiado peligroso y ha rechazado nuestra solicitud de ayuda."
 GEK_event.6.a:0 "¡Ustedes serán los siguientes!"

 GEK_event.7.t:0 "[FROM.GetName] ha aceptado nuestra solicitud"
 GEK_event.7.desc:0 "[FROM.GetName] ha respondido positivamente a nuestra petición y ha decidido apoyarnos."
 GEK_event.7.a:0 "¡Alemania lo recordará!"

 GEK_event.8.t:0 "El enemigo pide paz"
 GEK_event.8.gen_desc:0 "Hoy recibimos una carta de Manmazin. Fue entregada por un cartero alemán ordinario, el Sr. Hans. Como estaba escrita en japonés, nuestros oficiales no pudieron leerla, y fue necesaria la ayuda de un soldado que dominara el idioma. La carta estaba llena de errores ortográficos, metáforas vacías y expresiones pretenciosas. Aunque nuestra dirigencia decidió rechazar el tratado de paz debido a este insulto diplomático, Natsume Iroha, alta ejecutiva de Manmazin, visitó nuestra capital [ROOT.capital.GetName] personalmente para disculparse y ofreció entregar el norte que controlan como condición para negociar."
 GEK_event.8.fam_desc:0 "Hoy, una carta llegó a [ROOT.capital.GetName] proveniente de Manmazin. Fue enviada por Natsume Iroha, ejecutiva de alto rango de la organización. En ella solicitaba un acuerdo de paz y anunciaba la retirada de la línea Maginot. La carta, sincera y desesperada, parecía reflejar su deseo genuino de paz."
 GEK_event.8.desc:0 "Hoy, una carta de Manmazin llegó a [ROOT.capital.GetName]. Aunque el contenido era desordenado y mal redactado, expresaba su deseo de poner fin al conflicto."
 GEK_event.8.a:0 "La guerra ha terminado."
 GEK_event.8.b:0 "No. Queremos su derrota total."

 GEK_event.9.t:0 "[FROM.GetName] aceptó la paz"
 GEK_event.9.desc:0 "[FROM.GetName] aceptó nuestra propuesta de paz y firmó el tratado poco después."
 GEK_event.9.a:0 "¡Una victoria diplomática para Manmazin!"

 GEK_event.10.t:0 "Rechazo a la solicitud de paz"
 GEK_event.10.desc:0 "[FROM.GetName] rechazó nuestra solicitud argumentando que no mostramos una actitud adecuada para pedirla. El presidente de Manmazin, Hanuma Makoto, está furioso.\n\nPronto, Makoto y sus ejecutivos emitieron un decreto de movilización entre los estudiantes de Gehenna, quienes se unieron con entusiasmo solo porque 'parecía divertido'."
 GEK_event.10.a:0 "¡Es hora de mostrar el poder de Manmazin!"

 GEK_event.11.t:0 "Levantamiento de milicias en la retaguardia"
 GEK_event.11.desc:0 "Los comandantes de la Wehrmacht organizaron milicias con civiles alemanes que ahora luchan contra nosotros. La guerra contra Alemania se complica aún más."
 GEK_event.11.a:0 "¡Esto es grave!"
 GEK_rm_event.11_tt:0 "\n§R¡Fin del juego!§!"

 GEK_event.12.t:0 "Ocupación de Åland"
 GEK_event.12.d:0 "Ocupamos el archipiélago de Åland, territorio finlandés en el Báltico."
 GEK_event.12.a:0 "Lo devolveremos… algún día."

 GEK_event.13.t:0 "Ocupación de Saaremaa"
 GEK_event.13.d:0 "Ocupamos Saaremaa, territorio estonio en el Báltico."

 GEK_event.14.t:0 "[GEK.getname] ocupa ilegalmente nuestro territorio"
 GEK_event.14.d:0 "La Kriegsmarine alemana se ha convertido en piratas tras perder su gobierno y ha ocupado ilegalmente nuestro territorio báltico."
 GEK_event.14.a:0 "¿¡Están locos!?"

 GEK_event.15.t:0 "Protestas por condiciones de los marinos"
 GEK_event.15.d:0 "A pesar de la crisis actual, los marineros han comenzado a quejarse sobre sus condiciones en cubierta."
 GEK_event.15.a:0 "Hagamos concesiones moderadas."
 GEK_event.15.b:0 "Que se aguanten."

 GEK_event.16.t:0 "¡Motín a bordo!"
 GEK_event.16.d:0 "Si alguien fue revolucionario y progresista en la Alemania moderna, fueron los marinos. 20 años después, los orgullosos marinos alemanes han repetido la hazaña de 1918. Oficiales de alto rango fueron encarcelados en todas las naves y Erich Raeder huyó a Inglaterra. Los marineros celebran, se ha abolido la jerarquía a bordo y cada barco ha formado un consejo democrático de navegación."
 GEK_event.16.a:0 "¡Viva la Kriegsmarine Roja!"

 GEK_event.17.t:0 "Ingreso de Reinhard Heydrich"
 GEK_event.17.d:0 "Mucho tiempo ha pasado desde que Europa fue arrasada por la fuerza de Kivotos. Reinhard Heydrich, excomandante de las SS alemanas, ha llegado por vía aérea huyendo de la represión en Trinity."
 GEK_event.17.a:0 "Denle la bienvenida."

 GEK_event.18.t:0 "Operación de desembarco"
 GEK_event.18.desc:0 "Tras localizar restos organizados de la Wehrmacht bajo la opresión de Gehenna, decidimos cooperar con ellos para eliminar a los kivotosianos de la zona y establecer un estado conjunto.\n\nDurante la operación, algunas unidades de la Wehrmacht se dispersaron y varios oficiales protestaron por nuestra forma unilateral de actuar, pero el objetivo se logró."
 GEK_event.18.a:0 "¡Actuad con rapidez!"
 GEK_event_18_tt:0 "§RNuestra acción repentina provocó pérdidas en las fuerzas de la Wehrmacht antes de que pudieran reorganizarse.§!"
 
 GEK_event_post_war_focus_4.1.t: "El pacto secreto de Leningrado"
 GEK_event_post_war_focus_4.1.d: "En la madrugada de hoy, los restos de la antigua Kriegsmarine alemana, atrincherados en Gotland, han infiltrado sus buques en Leningrado bajo escolta secreta de la Armada Soviética, trayendo consigo una propuesta intrigante. A cambio de la cesión de parte del litoral sur del Báltico y de algunos puertos, reconocen nuestra influencia sobre la totalidad del mar Báltico. En la práctica, aceptarían convertirse en un estado satélite, actuando como carne de cañón contra los invasores de otro mundo surgidos con la 'Gran Transición'.\n\nEl Comisariado del Pueblo para Asuntos Exteriores evalúa la propuesta como extremadamente atractiva. Sin disparar una sola bala, podríamos asegurarnos la hegemonía del Báltico y transformar a un antiguo enemigo en un valioso estado tapón. Por supuesto, existen riesgos: no hay garantía de que, una vez recuperadas sus fuerzas, no vuelvan a apuntar sus armas contra nosotros.\n\nAhora debemos decidir si extendemos la mano a nuestro viejo enemigo en busca de beneficios futuros, o si extinguimos de raíz una amenaza potencial."
 GEK_event_post_war_focus_4.1.a: "Es una idea excelente."
 GEK_event_post_war_focus_4.1.b: "No, no negociamos con fascistas militaristas."
 GEK_event_post_war_focus_4_1_idea_189: "Pacto de Leningrado: cesión de Samogitia"
 GEK_event_post_war_focus_4_1_idea_190: "Pacto de Leningrado: cesión de Curlandia"
 GEK_event_post_war_focus_4_1_idea_811: "Pacto de Leningrado: cesión de Saaremaa"

 GEK_event_post_war_focus_4.101.t: "Respuesta del Kremlin"
 GEK_event_post_war_focus_4.101.d: "Han llegado buenas noticias desde la delegación secreta enviada a Leningrado. Tras varios días de tenso silencio, el liderazgo soviético ha aceptado nuestra propuesta. Conforme al tratado, los territorios costeros prometidos serán transferidos a nuestro control y ambas partes establecerán una relación de cooperación frente a la 'amenaza común'.\n\nEsto no es solo una ganancia territorial, sino una gran victoria diplomática que ofrece a nuestra nación, antes aislada, un punto de apoyo vital para la supervivencia y la reconstrucción en el continente."
 GEK_event_post_war_focus_4.101.a: "Por el futuro de la patria."

 GEK_event_post_war_focus_4.102.t: "Un rechazo implacable"
 GEK_event_post_war_focus_4.102.d: "La delegación secreta enviada a Leningrado ha regresado con las manos vacías. La Unión Soviética ha desestimado nuestra propuesta calificándola de 'engaño fascista militarista' y se ha negado incluso a negociar. Han dejado claro que no tienen intención alguna de cooperar con antiguos enemigos.\n\nNuestra apuesta diplomática ha fracasado. El plan para asegurar una cabeza de puente continental se ha desvanecido y ahora debemos buscar otros medios de supervivencia desde esta isla aislada."
 GEK_event_post_war_focus_4.102.a: "Lucharemos solos."

 GEK_event_post_war_focus_4.2.t: "¡Las islas Åland han sido arrebatadas!"
 GEK_event_post_war_focus_4.2.d: "El complejo gubernamental de Helsinki se encuentra sumido en un silencio glacial. La ocupación unilateral de las islas Åland por la Kriegsmarine alemana no es solo una violación fronteriza, sino un desafío directo a la dignidad y al futuro de Finlandia. Se libra un intenso debate entre los halcones militares y los diplomáticos cautos, mientras se acerca el momento de decidir el destino de la nación.\n\nEl alto mando exige una respuesta militar inmediata. 'Un país que guarda silencio ante la violación de su soberanía deja de ser un país'. Argumentan que la Kriegsmarine no es más que un remanente aislado y que, con determinación y una contraofensiva rápida, puede ser derrotada. Dada la importancia estratégica de Åland, tolerar su ocupación equivale a poner una daga en el cuello de la capital.\n\nPor otro lado, el Ministerio de Asuntos Exteriores y los tecnócratas económicos piden cautela. La guerra acarrearía enormes pérdidas humanas y económicas, y el éxito de una operación anfibia contra una poderosa flota es incierto. Aún podría existir margen para una solución diplomática, y una guerra precipitada podría aislar a Finlandia y conducirla a un desastre mayor.\n\n¿Responder a la arrogancia del invasor con la fuerza, o esperar un mejor momento buscando una salida diplomática? El futuro de Finlandia depende de nuestra elección."
 GEK_event_post_war_focus_4.2.a: "¡Esto es una declaración de guerra!"
 GEK_event_post_war_focus_4.2.b: "Condenadlo diplomáticamente… pero no a la guerra."

 GEK_event_post_war_focus_4.6.t: "[From.GetLeader] busca la integración de Ostland"
 GEK_event_post_war_focus_4.6.d: "Con Bielorrusia occidental completamente bajo el control de [Root.GetFactionName], la administración de [From.GetNonIdeologyName] ha anunciado su intención de incorporar los territorios ocupados de Ostland a la administración [From.GetAdjective]. Tras este anuncio se esconde el objetivo de unificar el Báltico y Bielorrusia bajo el nombre de un Estado Caballeresco Báltico, promoviendo la integración del pueblo germano-báltico."
 GEK_event_post_war_focus_4.6.a: "¡Ingenioso!"
 GEK_event_post_war_focus_4.6.b: "No."

 GEK_event_post_war_focus_4.601.t: "Cesión de Ostland por [From.GetNameDefCap]"
 GEK_event_post_war_focus_4.601.d: "Hemos logrado liberar la región de Ostland mediante manos [Root.GetAdjective], y [From.GetNameDef] ha aceptado que los estados bálticos y Bielorrusia occidental pasen a ser territorio exclusivo de [Root.GetNameDef]."
 GEK_event_post_war_focus_4.601.a: "¡Excelente!"

 GEK_event_post_war_focus_4.602.t: "Rechazo de [From.GetNameDefCap]"
 GEK_event_post_war_focus_4.602.d: "La solicitud [Root.GetAdjective] de transferir el control de Ostland ha sido rechazada de forma tajante por [From.GetNameDef]. Consideran que este intento no es más que una maniobra de [Root.GetLeader] para controlar los principales núcleos de población báltica y debilitar a [From.GetNameDef] en favor de una integración báltica permanente."
 GEK_event_post_war_focus_4.602.a: "Un día triste para la Kriegsmarine."

 GEK_news.1.t: "Declaración en Visby"
 GEK_news.1.d: "\"Ya no estamos encadenados a los fantasmas del pasado. El nuevo orden en Europa Oriental merece respeto, y no buscamos enfrentarnos a la Unión Soviética, guardiana terrestre de ese orden.\"\n\nLa Kriegsmarine alemana en el exilio, aislada en la isla de Gotland, ha dado su primer paso hacia una nueva era, dejando atrás viejas hostilidades. El comunicado emitido en nombre de [GEK.GetLeader] reconoce a la Unión Soviética como la fuerza clave para mantener la estabilidad en Europa Oriental y expresa el deseo de evitar conflictos militares innecesarios.\n\nEste anuncio se interpreta como una declaración de no agresión de facto y abre la posibilidad de futuras cooperaciones militares y económicas, incluida la colaboración naval en el mar Báltico."
 GEK_news.1.a: "¡Id a buscar suministros soviéticos!"
 GEK_news.1.b: "Un buen pretexto."
 GEK_news.1.c: "Un acontecimiento desconcertante."

 GEK_news.2.t: "Cesión soviética de la región de [189.GetName]"
 GEK_news.2.d: "Con la aprobación final del Kremlin, el tratado secreto con la Kriegsmarine alemana ha sido ejecutado. A partir de hoy, la autoridad administrativa sobre la región de [189.GetName] ha sido transferida oficialmente a la Kriegsmarine.\n\nLas fuerzas del Ejército Rojo han iniciado una retirada ordenada, mientras las avanzadas de la Kriegsmarine toman control de los principales puertos e instalaciones industriales. Ambas partes afirman que este tratado sentará las bases para la estabilidad del Báltico y una respuesta conjunta frente a 'amenazas externas'.\n\nEsta cesión territorial no es solo un cambio de fronteras, sino un acontecimiento que presagia una profunda transformación del equilibrio de poder en el mar Báltico."
 GEK_news.2.a: "Bien."
 GEK_news.2.b: "Ejecución del tratado."
 GEK_news.2.c: "El Báltico se vuelve completamente rojo."

 GEK_news.3.t: "Cesión soviética de la región de [190.GetName]"
 GEK_news.3.d: "Con la aprobación final del Kremlin, el tratado secreto con la Kriegsmarine alemana ha sido ejecutado. A partir de hoy, la autoridad administrativa sobre la región de [190.GetName] ha sido transferida oficialmente a la Kriegsmarine.\n\nLas fuerzas del Ejército Rojo han iniciado una retirada ordenada, mientras las avanzadas de la Kriegsmarine toman control de los principales puertos e instalaciones industriales. Ambas partes afirman que este tratado sentará las bases para la estabilidad del Báltico y una respuesta conjunta frente a 'amenazas externas'.\n\nEsta cesión territorial no es solo un cambio de fronteras, sino un acontecimiento que presagia una profunda transformación del equilibrio de poder en el mar Báltico."

 GEK_news.4.t: "Cesión soviética de la región de [811.GetName]"
 GEK_news.4.d: "Con la aprobación final del Kremlin, el tratado secreto con la Kriegsmarine alemana ha sido ejecutado. A partir de hoy, la autoridad administrativa sobre la región de [811.GetName] ha sido transferida oficialmente a la Kriegsmarine.\n\nLas fuerzas del Ejército Rojo han iniciado una retirada ordenada, mientras las avanzadas de la Kriegsmarine toman control de los principales puertos e instalaciones industriales. Ambas partes afirman que este tratado sentará las bases para la estabilidad del Báltico y una respuesta conjunta frente a 'amenazas externas'.\n\nEsta cesión territorial no es solo un cambio de fronteras, sino un acontecimiento que presagia una profunda transformación del equilibrio de poder en el mar Báltico."

 GEK_news.5.t: "¡La Kriegsmarine ocupa las islas Åland!"
 GEK_news.5.d: "La Kriegsmarine alemana en el exilio, estacionada en Gotland, ha lanzado esta madrugada una operación anfibia sorpresa sobre las islas Åland, asegurando las principales instalaciones. El alto mando naval declaró que la operación se basa en una 'legitimidad histórica', alegando que Åland ha sido históricamente territorio sueco y que la mayoría de su población es sueca.\n\nEste acto unilateral de fuerza constituye una violación flagrante de la soberanía finlandesa y ha elevado la tensión militar en toda Escandinavia al máximo nivel. El gobierno ha exigido una retirada inmediata, pero la Kriegsmarine no ha respondido. Sean cuales sean sus verdaderas intenciones, la paz del mar Báltico se ha roto."
 GEK_news.5.a: "Una excelente decisión."
 GEK_news.5.b: "Bastante agresivo."
 GEK_news.5.c: "¿Qué?"

