 GEK_gathering_storm_desc: "Una nueva Alemania está surgiendo. Han pasado tres años desde la disolución de la República de Weimar y la aparición del Tercer Reich de Hitler. Tras los dolorosos tiempos de la Gran Depresión, la economía se ha estabilizado y el desempleo masivo ha sido resuelto.\n\nSin embargo, con el estallido del Gran Trastorno, Alemania colapsó. Gracias a los esfuerzos de la Kriegsmarine, logramos escapar a Gotland, Suecia, pero la poderosa Alemania ya no existe."

 GEK_protestant_state: "Estado protestante alemán"
 GEK_catholic_state: "Estado católico alemán"
 GEK_trm_christianity_state: "Estado católico trinitario alemán"
 GEK_no_religion: "Estado alemán laico o sin religión"
 GEK_ari_religion: "Estado católico ariano alemán"
 ARI_Gottglaubig_religion: "Estado alemán Gottgläubig"
 GEK_spirit_of_capitalism_state: "‘Espíritu del capitalismo’"
 GEK_protestant_patriotism: "Protestantismo patriótico"
 GEK_protestant_patriotism_desc: "Cuando la patria está en peligro, ¡la iglesia protestante no puede quedarse atrás en la línea del frente por la restauración nacional! Los protestantes ayudarán activamente a la nación con alistamiento militar y apoyo en la guerra."
 GEK_protestant_patriotism_for_TRM: "Protestantismo patriótico"
 GEK_protestant_patriotism_for_TRM_desc: "Parece que los protestantes alemanes apoyan al gobierno alemán en lugar del nuestro y son reacios al reclutamiento. Debemos aplastar al falso gobierno ilegal de Alemania Occidental y enseñarles lo que significa el verdadero patriotismo."
 GEK_materialism: "Materialismo y productividad"
 GEK_materialism_desc: "En lugar de religiones tradicionales improductivas, explotadoras y represivas, podemos fomentar un espíritu laboral activo a través de una visión del mundo materialista según las enseñanzas de Karl Marx, que nos permite ver, analizar y transformar la realidad."
 GEK_catholic_trade_union: "Sindicato católico"
 GEK_catholic_trade_union_desc: ""
 GEK_secondary_citizenship: "Sistema de segunda ciudadanía"
 GEK_secondary_citizenship_desc: ""
 GEK_separation_law: "Separación de los extraplanarios"

 NSD_the_SS_went_to_america: "§Y$reinhard_heydrich$§! está en §Y[USA.GetNameWithFlag]§!"
 NSD_the_SS_went_to_arius: "§Y$reinhard_heydrich$§! está en §Y[ARI.GetNameWithFlag]§!"
 NSD_the_SS_went_to_gottland: "§Y$reinhard_heydrich$§! está en §Y[GEK.GetNameWithFlag]§!"
 BA_is_GER_core_tt: "Esta provincia es un §Ynúcleo alemán§!"

 BAY_event.1.t:0 "Gobierno militar establecido"
 BAY_event.1.desc:0 "Tras la movilización de la Wehrmacht, logramos retomar el norte de Alemania y establecer un gobierno militar. Sin embargo, comienzan a hacerse visibles las disputas internas dentro de la Wehrmacht, y la incertidumbre ante enemigos desconocidos crece dentro del ejército."
 BAY_event.1.a:0 "Alemania resurge."
 BAY_event.2.t:0 "Plan de ataque"
 BAY_event.2.desc:0 "Ahora que el ejército está reorganizado, ha llegado el momento de invadir Gehenna. Podemos elegir el momento en que comenzará la ofensiva."
 BAY_event.2.a:0 "¡Inicien el avance ahora mismo!"
 BAY_event.3.t:0 "Unificación del territorio alemán"
 BAY_event.3.desc:0 "Después de la gran victoria de nuestra Wehrmacht, hemos recuperado los territorios ganados para Alemania. Estamos un paso más cerca de la unificación, y todo el pueblo alemán celebra con entusiasmo."
 BAY_event.3.a:0 "Aún falta camino."
 BAY_event.4.t:0 "Ultimátum desde Alemania"
 BAY_event.4.desc:0 "Poco después de la caída de la Academia Gehenna, hemos recibido un ultimátum desde Alemania. El gobierno exige la devolución de las tierras alemanas actualmente bajo nuestro control y ha advertido que habrá una respuesta militar si no se cumple con la demanda."
 BAY_event.4.a:0 "Prepararse para la guerra."
 BAY_event.4.b:0 "Tch... Está bien, que se lo lleven."
 BAY_event.5.t:0 "Ultimátum rechazado"
 BAY_event.5.desc:0 "Hemos recibido la noticia de que nuestro generoso ultimátum fue rechazado."
 BAY_event.5.a:0 "Lo sabía."

 GEK_rm_event.1.t: "Lealtad del gobierno estatal"
 GEK_rm_event.1.d: "Hemos logrado establecer contacto con los gobiernos estatales y obtener de ellos una promesa de poner fin a su confusión causada por la ausencia de una administración superior, y de alinearse con nosotros. En las próximas batallas, podremos contar con su cooperación."
 GEK_rm_event.1.a: "Todo marcha bien."
 GEK_rm_event.1_tt: "§YTodos los estados§! con el modificador §YGobierno estatal alemán§!: \n\n"
 GEK_rm_event.2.t: "Solidaridad más allá de las ideologías"
 GEK_rm_event.2.d: "Para obtener una cooperación amplia y plural, hemos contactado a todos los partidos políticos, sindicatos, organizaciones paramilitares y estudiantiles dentro de Alemania para pedir su colaboración. [GEK.getname] superará la derrota de la patria y vencerá a los invasores de otro mundo a través de una unidad que trasciende ideologías."
 GEK_rm_event.2.a: "¡Hacia la restauración de Alemania!"
 GEK_rm_event.3.t: "Conexión con el Partido Comunista"
 GEK_rm_event.3.d: "Durante la República de Weimar, el Partido Comunista Alemán recibió un apoyo considerable. Aliarnos con ellos nos proporcionará refuerzos importantes. Gracias a su fuerte influencia entre los trabajadores de Holstein, hemos ocupado esa región y obtenido a los obreros armados de Hamburgo y Kiel como fuerzas aliadas."
 GEK_rm_event.3.a: "¡Aun así, debemos tener cuidado con los comunistas!"
 GEK_rm_event.4.t: "Colaboración con el Partido Socialdemócrata"
 GEK_rm_event.4.d: "Protagonistas de la República de Weimar, los socialdemócratas poseen una base de apoyo nacional y una experiencia política inigualable. Aunque actualmente no tienen gran influencia en Alemania Occidental, pueden ser asesores de políticas muy capaces para nosotros."
 GEK_rm_event.4.a: "Esperemos buenos resultados de ellos."
 GEK_rm_event.5.t: "Concentración del pueblo"
 GEK_rm_event.5.d: "Para tener mayor influencia dentro del Frente Unido de Liberación, una estrategia válida es movilizar a las masas. Intentaremos reunir al pueblo para fortalecer nuestra posición."
 GEK_rm_event.5.a: "Unamos a los republicanos."
 GEK_rm_event.5.b: "Unamos a los conservadores."
 GEK_rm_event.5.c: "Unamos a los miembros del partido."
 GEK_rm_event.5.e: "¡Viva la liberación nacional!"
 GEK_rm_event.6.t: "Alianza con el Partido del Centro"
 GEK_rm_event.6.d: "Con base de apoyo en la región del Rin, este partido católico ha adoptado posturas progresistas, centristas o conservadoras dependiendo del contexto. A diferencia de los socialdemócratas, su valor reside en su capacidad de cooperar con los demócratas conservadores."
 GEK_rm_event.6.a: "Confiemos en su lado progresista."
 GEK_rm_event.6.b: "Confiemos en su lado conservador."
 GEK_rm_event.7.t: "El Ejército Alemán"
 GEK_rm_event.7.d: "Nuestro ejército alemán, heredero orgulloso de Prusia, fue derribado por el Tratado de Versalles y la invasión de otro mundo, pero nunca se rindió. Aunque está influenciado por los Junkers conservadores, podemos actuar con juicio sobre lo correcto e incorrecto."
 GEK_rm_event.7.a: "¡Por una Alemania mejor!"
 GEK_rm_event.7.b: "El ejército no debe intervenir en política."
 GEK_rm_event.8.t: "Partido Nacionalsocialista Obrero Alemán"
 GEK_rm_event.8.d: "El Partido Nazi, que hasta hace unos meses gobernaba el país, posee un gran potencial administrativo. Aunque fue severamente golpeado por la invasión extradimensional, aún puede ofrecernos apoyo desde su bastión en Núremberg y el sur de Alemania."
 GEK_rm_event.8.a: "Un nazismo sin Hitler, ¿eh?"
 GEK_rm_event.9.t: "Alianza agrietada"
 GEK_rm_event.9.d: "Todos sabíamos que la 'gran coalición de toda Alemania' era una ilusión destinada a romperse tarde o temprano."
 GEK_rm_event.9.a: "Maldita sea."
 GEK_rm_event.10.t: "Alianza con el Partido del Pueblo Alemán"
 GEK_rm_event.10.d: "El Partido del Pueblo Alemán fue el mayor partido conservador tras la Gran Guerra, representando principalmente a los Junkers. Su juicio político y lealtad al antiguo esplendor imperial serán de gran ayuda para nosotros."
 GEK_rm_event.10.a: "¡Por el Imperio!"
 GEK_rm_event.11.t: "¡Guerra civil!"
 GEK_rm_event.11.d: "Los partidos opuestos al régimen militar se han levantado en armas."
 GEK_rm_event.11.a: "¡Maldita sea!"
 GEK_rm_event.12.t: "Colaboración con Manmajun"
 GEK_rm_event.12.d: "¡Parece que los ejércitos locales planean una invasión a gran escala!"
 GEK_rm_event.12.a: "¡Ayúdanos, Comité de Disciplina!"
 GEK_rm_event.13.t: "Secuelas del Gran Trastorno"
 GEK_rm_event.13.d: "Ahora entendemos que hemos pasado por un 'Gran Trastorno', y se está llevando a cabo una investigación del nuevo mundo en el que nos encontramos. Las operaciones militares para detener la resistencia local, que pensábamos era un ataque sorpresa, han sido casi completamente exitosas. Ahora solo queda vigilar los últimos remanentes."
 GEK_rm_event.13.a: "Mantengamos vigilancia."
 GEK_rm_event.13.b: "Qué fastidio. ¿No podríamos simplemente dejarlos?"
 GEK_rm_event.13_tt: "\n§gEl ejército actuará.§!"
 GEK_rm_event.14.t: "Política alimentaria"
 GEK_rm_event.14.d: "Haber recuperado el territorio de Alemania Occidental es una bendición dentro del desastre. Esta región, llena de zonas industriales a lo largo del Rin, nos permite mantener nuestra política económica sin grandes cambios. Sin embargo, la pérdida de las vastas tierras agrícolas del este plantea otro problema: el precio de los alimentos ha subido, afectando el nivel de vida de los ciudadanos y poniendo en riesgo el crecimiento económico. Podemos resolver esto importando alimentos. La cuestión es: ¿de dónde los importaremos?"
 GEK_rm_event.14.a: "Importémoslos desde Estados Unidos."
 GEK_rm_event.14.b: "Importémoslos desde Italia."
 GEK_rm_event.14.c: "Importémoslos desde la Unión Soviética."
 GEK_rm_event.14.e: "Pidamos ayuda a la Unión Soviética."
 GEK_rm_event.14_tt_1: "§gDebido a la escasez de alimentos en EE. UU., tendremos que pagar un precio más alto.§!\n\n"
 GEK_rm_event.14_tt_2: "§gNuestro gobierno comunista puede esperar ayuda gratuita de la Unión Soviética.§!"
 GEK_rm_event.15.t: "Importación de alimentos por parte de [GEK.getname]"
 GEK_rm_event.15.d: "[GEK.getname] está importando alimentos de nosotros."
 GEK_rm_event.15.a: "Perfecto."
 GEK_rm_event.16.t: "Política religiosa"
 GEK_rm_event.16.d: " Tras la Reforma Protestante, la religión alemana quedó dividida en dos grandes ramas: el protestantismo en el norte y este de Alemania, y el catolicismo en el oeste y sur. Ejemplos representativos del conflicto entre ambas son la Guerra de los Treinta Años, las disputas entre el panalemanismo y el pequeño germanismo, y la lucha cultural de Bismarck. Aunque tras la unificación de Alemania y la posterior lucha cultural estos conflictos religiosos parecían haberse apaciguado, la oposición entre el Partido del Centro —republicano y católico— apoyado por los industriales del Rin, y el Partido Popular Nacional Alemán —monárquico protestante— respaldado por los Junkers, ha vuelto a emerger. En especial, con la recuperación exclusiva del oeste, el poder de los católicos es más fuerte que en tiempos de paz, lo que incrementa la tensión religiosa.\n\n Por otro lado, también existen nuevas religiones traídas por seres de otro mundo tras el Gran Trastorno. Se han identificado dos nuevas variantes: el cristianismo de Trinity y el cristianismo de Arius. Investigaciones preliminares revelan similitudes notables con el cristianismo de nuestro mundo, pero la información limitada y el escaso contacto impiden un entendimiento detallado.\n\n Por último, se ha observado que los forasteros de Gehenna no practican una religión unificada y presentan una tasa notablemente alta de ateísmo."
 GEK_rm_event.16.a: "Esto me está dando dolor de cabeza."
 GEK_rm_event.17.t: "¡Reacción católica!"
 GEK_rm_event.17.d: "¡Los católicos se han levantado en protesta contra las políticas de apoyo a la Iglesia protestante!"
 GEK_rm_event.17.a: "Esto es un problema."
 GEK_rm_event.18.t: "¡Reacción protestante!"
 GEK_rm_event.18.d: "¡Los protestantes se han levantado en protesta contra las políticas de apoyo a la Iglesia católica!"
 GEK_rm_event.19.t: "Industria dañada"
 GEK_rm_event.19.d: "Durante el último año, grandes y pequeñas batallas han estallado en toda Alemania Occidental. Dado que esta región alberga la mayor parte de las instalaciones industriales clave, los conflictos, explosiones y destrucción han dejado nuestra industria gravemente dañada y necesitada de reconstrucción."
 GEK_rm_event.19.a: "Maldita sea."
 GEK_rm_event.20.t: "Política estudiantil"
 GEK_rm_event.20.d: "Investigaciones adicionales revelaron que los forasteros provienen de un mundo diferente llamado 'Kivotos', una sociedad organizada en academias dirigidas por estudiantes con autonomía propia. Ahora debemos establecer políticas para los estudiantes rendidos y estos seres extradimensionales."
 GEK_rm_event.20.a: "Esperemos que no causen problemas."
 GEK_rm_event.21.t: "Problema estudiantil"
 GEK_rm_event.21.d: "Aunque hemos logrado la rendición de los forasteros, su resistencia continúa."
 GEK_rm_event.21.a: "Esto es complicado."
 GEK_rm_event.21_tt_1: "\n§gNecesitamos volver a operar los campos de reeducación para resolver la resistencia estudiantil.§!"
 GEK_rm_event.21_tt_2: "\n§gDebemos otorgar ciudadanía a los estudiantes de esta academia.§!"
 GEK_rm_event.21_tt_3: "\n§gAhora podemos aprovechar activos adicionales de otro mundo.§!"
 GEK_rm_event.21_tt_4: "\n§gDebemos volver a definir los derechos de los forasteros.§!"
 GEK_rm_event.21_tt_5: "\n§gDebemos retomar las tareas de segregación.§!"
 GEK_rm_event.22.t: "Selección de colaboradores"
 GEK_rm_event.22.d: "No todos en la Academia Gehenna comparten los mismos objetivos o ideales.\n\n... De hecho, están tan fragmentados que sería contraproducente cooperar con todos a la vez. Debemos aliarnos con una facción específica para asegurar una colaboración estable."
 GEK_rm_event.22.a: "Colaboremos con Manmajun."
 GEK_rm_event.22.b: "Necesitamos la ayuda del Comité de Disciplina."
 GEK_rm_event.22.c: "Formemos alianza con los clubes estudiantiles."
 GEK_rm_event.23.t: "Colaboración con Manmajun"
 GEK_rm_event.23.d: "Ahora podemos utilizar a los altos mandos de Manmajun, que actuaban como el gobierno central de la antigua Gehenna, como asesores."
 GEK_rm_event.23.a: "Reclutemos a Iroha."
 GEK_rm_event.23.b: "Reclutemos a Ibuki."
 GEK_rm_event.24.t: "Colaboración con el Comité de Disciplina"
 GEK_rm_event.24.d: "Ahora podemos utilizar a los oficiales del Comité de Disciplina, que actuaban como la fuerza policial del antiguo gobierno de Gehenna, como asesores."
 GEK_rm_event.24.a: "Reclutemos a Iori."
 GEK_rm_event.24.b: "Reclutemos a Chinatsu."
 GEK_rm_event.24.c: "Reclutemos a Ako."
 GEK_rm_event.25.t: "Colaboración con los clubes"
 GEK_rm_event.25.d: "Ahora podemos utilizar a los miembros de diversos clubes de la Academia Gehenna como asesores."
 GEK_rm_event.25.a: "Aliémonos con el Club de Gastronomía."
 GEK_rm_event.25.b: "Aliémonos con el Club de Desarrollo Termal."
 GEK_rm_event.25.c: "Aliémonos con el Departamento de Medicina de Urgencias."
 GEK_rm_event.26.t: "¡Acción inesperada del Club de Gastronomía!"
 GEK_rm_event.26.d: "¡El Club de Gastronomía ha cometido un acto terrorista en el acuario del centro de [TRM.getname]! ¡No podremos evitar una guerra con Trinity!"
 GEK_rm_event.26.a: "¿¡Qué!?"

 GEK_event_for_auto.22.t: "Alianza con la Iglesia Católica"
 GEK_event_for_auto.22.d: "Las organizaciones protestantes se oponen a nuestra alianza con la Iglesia Católica."
 GEK_event_for_auto.22.a: "¿Y qué nos importa?"
 GEK_event_for_auto.22.b: "Si eso quieren..."
 GEK_event_for_auto.27.t: "Alianza con la Iglesia Protestante"
 GEK_event_for_auto.27.d: "Las organizaciones protestantes se oponen a nuestra alianza con la Iglesia Protestante."
