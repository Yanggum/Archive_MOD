#인물
  GEK_erich_raeder_desc:0 "Comandante en jefe de la Kriegsmarine\n\nErich Raeder no deseaba este puesto. Desde el principio, nunca imaginó que se convertiría en el líder de la Kriegsmarine exiliada, remanente de la Suecia destruida, que ahora sobrevive en Gotland. Él solo es un militar que ha servido toda su vida por su patria desde los días del Imperio Alemán, y mucho menos un dirigente de Alemania.\n\nLas mujeres de otro mundo destruyeron Alemania. Con la desaparición del Führer y otros dirigentes, incluso enemigos de antaño como Francia y Reino Unido sucumbieron ante su ataque. Cuando las naciones escandinavas, incluida Suecia, cayeron ante su embestida, Raeder reunió a los soldados, almirantes y flota restante de la Kriegsmarine, así como a los alemanes de las ciudades costeras, y huyó hacia Gotland, una tierra sin dueño.\n\nRaeder insiste en que no tiene cualidades de líder, que solo es un almirante, y que no está capacitado para gobernar. Sin embargo, almirantes como Karl Dönitz lo siguen fielmente, y tanto los marineros como los civiles alemanes dependen de él. Le guste o no, Raeder se ha convertido en el rostro y el pilar de los alemanes que resisten a los invasores de otro mundo.\n\nYa sea trabajando en silencio en su oficina o inspeccionando la flota en el puerto para levantar la moral, Raeder carga con esta responsabilidad por su patria, ahora oprimida por invasores. Porque si no es por su patria, ¿por qué más lo haría?"

  GEK_central_navy_committee:0 "Comité Central de la Flota Roja"

 #스토리 아카이브
 GEK_story_event.1.t: "Mirando al mar"
 GEK_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nKurt estaba limpiando el puerto de Gotland con un trapeador. Llevaba apenas dos años de servicio como marinero a bordo de un destructor de la Kriegsmarine, es decir, la Marina de Guerra, y aún no había superado el rango de soldado. Con un profundo suspiro, Kurt contempló el mar. En su mente aparecieron los rostros de su padre y su familia, que había dejado en la patria, llenándolo de incomodidad.\n\nMientras conversaba con un compañero, escucharon un idioma que no era alemán. Al voltear hacia la dirección del sonido, vieron a varias mujeres con expresiones variadas y una instructora hablándoles en su idioma. Se rumoraba que el mariscal les había concedido el indulto para utilizarlas como fuerza militar. Aquello flotando sobre sus cabezas recordaba una vez más a Kurt y a los marineros que eran seres de otro mundo. Y que esas mismas fueron quienes destruyeron su patria.\n\n“...Kurt, esas tipas...”\n\n“Son órdenes del mariscal, Heinrich. Sé que quieres partirles la cara, pero aguanta y no uses los puños. Si nos arrastran a una corte marcial será un problema.”\n\nEl alto mando de la Marina de Guerra ya había advertido estrictamente que no se tolerarían agresiones ni represalias, pero Kurt y los marineros las miraban con desaprobación. Aunque sabían que no eran directamente responsables de la caída de su patria, Kurt igualmente apretaba los dientes mientras observaba con hostilidad a aquellas mujeres de “Kivotos”. Algunas estaban aterradas, otras murmuraban lamentándose de su situación mientras pasaban el trapeador sobre la cubierta. Él decidió ignorarlas y continuó con su labor.\n\nEntonces ocurrió un incidente. Un marinero empujó a una de las chicas de Kivotos, haciéndola caer. Sus compañeras deseaban vengarse, pero temiendo las represalias, continuaron trabajando en silencio. Kurt empezó a sentir compasión. Más allá de ese halo sobre sus cabezas, eran simplemente chicas jóvenes con uniforme militar. Con un suspiro, extendió la mano a la chica caída para ayudarla a levantarse. Ella, limpiándose las lágrimas, lo miró. Kurt también la miró con resignación, suspirando otra vez.\n\n“No me agrada que estén aquí. Además, destruyeron nuestra patria. Así que no esperes un buen trato, ¿entendido? Mejor sigue con lo tuyo.”\n\nLa joven tenía el cabello corto, de color verde oliva, y un halo sobre la cabeza. No entendía una sola palabra de lo que decía Kurt. Sin embargo, pensó que él la había ayudado porque estaba preocupado por ella. Tomando de nuevo el trapeador, se limpió las lágrimas con la manga del uniforme y, con voz temblorosa, susurró:\n\n“...Danke schön... (...Gracias...)”
 GEK_story_event.2.t: "Un patriota por su amigo"
 GEK_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nHeinrich no podía ver con buenos ojos a aquellas chicas con halos. Era uno de los seguidores más fervientes del Führer, y solía decirle a su amigo Kurt que Alemania renacería algún día, que llegaría el momento de vengarse de la decadente Inglaterra y Francia. Cuando el Führer desapareció y la patria fue destruida, lo único que encontró fue ira, vacío y una amarga sensación de pérdida.\n\nDespués de salir del orfanato, por primera vez en su vida había encontrado algo en qué apoyarse. Pero al perderlo, Heinrich volcó su odio contra las mujeres de Kivotos. Cada vez que se topaba con una, la agarraba del cuello y la golpeaba. Su evaluación descendía cada vez más, y había sido llevado ante consejo de guerra tantas veces que ya no podía contarlas. Incluso su única amistad con Kurt se estaba debilitando. Saber que su único amigo, también huérfano, se estaba alejando por completo lo hundía aún más en la desesperación y el resentimiento.\n\nUna vez más, Heinrich apenas logró librarse de un consejo de guerra, y estaba fumando un cigarro. Mientras caminaba soltando maldiciones por lo bajo, sus ojos captaron dos sombras. Al moverse hacia la dirección de las sombras, vio una silueta borrosa. Al seguirla, apareció Kurt… junto a una de esas chicas de Kivotos que tanto detestaba.\n\nLa relación entre Kurt y aquella chica era difícil de describir con palabras. Al menos, Heinrich deseaba que no fuera lo que él pensaba. Pero contrariamente a sus deseos, el rostro de Kurt no era como de costumbre.\n\nEn el rostro de su único amigo, aquel al que apenas había visto sonreír, florecía una pequeña sonrisa. La misma expresión estaba en el rostro de la chica. También vio claramente cómo sus manos se superponían sobre el áspero concreto del puerto.\n\nCon expresión confusa, Heinrich regresó al destructor. Aun cuando sonó el silbato de formación y llegó la hora de dormir, no pudo conciliar el sueño. Desde el accidente en el que murió la madre de Kurt, no había vuelto a ver a su amigo sonreír. Y ahora, él mostraba una leve sonrisa. En su mente se agitaban pensamientos contradictorios.\n\nHeinrich tenía una mente pequeña y torpe. ¿Cuánto caos podrían haber provocado esos pensamientos en su cabeza? Aunque no quería aceptarlo, al final no tuvo más remedio que hacerlo.\n\nNo todas las chicas con halo eran unas malditas.\n\n\"Algún día… para que él pueda sonreír de verdad.\""

 GEK_story_event.3.t: "Recuerdos en una tierra a la que huyó"
 GEK_story_event.3.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nEra prácticamente una situación de ley marcial, lo que hacía casi imposible que marineros como él obtuvieran un permiso. Y aunque lo consiguieran, todo lo que podían hacer era pasar el tiempo en alguna posada o bar de Gotland. En medio de esa situación, logró tomar un permiso e intentó descansar en una posada de la isla. Pero cuando volvió en sí, frente a él había un café amargo y un scone, y Mio, con una sonrisa, tomaba café con leche y pan.\n\nEra la primera vez que iba por voluntad propia a un sitio al que normalmente jamás habría ido.\n\n“¿Qué hace? ¡Coma! ¡No se contenga!”\n\nAnte su insistencia, Kurt también se metió el café y el scone en la boca. Para ser sincero, la calidad era mala. El café solo sabía amargo, y el scone era tan seco que parecía más apetecible masticar una esponja. Aun así, considerando las circunstancias, debía sentirse agradecido.\n\n“Fuuu...”\n\n¿Podía haber algo más incómodo que esta situación? Además, siendo un hombre y una mujer solos en un lugar así, era normal que sintiera vergüenza.\n\n“¿Hola?”\n\nSorprendido por su voz, se quedó sin palabras por un momento. Mio solo lo miraba sonriendo. ¿Por qué lo observaba con esa mirada? Mientras contenía el rubor en su rostro, se metió el último scone y se tomó el café de un trago.\n\n“¡Gah...! *cof cof*...”\n“Jajaja, quédese ahí. Yo pagaré.”\n\nMientras tosía por haber tragado demasiado rápido, Mio ya había ido a pagar la cuenta. Kurt intentó detenerla, pero ¿cómo reparar un granero que ya está destruido?\n\nElla seguía a su lado. Incluso dejó de decirle que se alejara. Cada vez que lo hacía, ella se acercaba aún más. El sonido de las olas y de las gaviotas fue reemplazado por el fuerte latido de su propio corazón.\n\n“Oye, ¿puedes alejarte un poco? ¿Qué pasa si alguien malinterpreta esto?”\n“¿Por qué? ¿Te avergüenzo? ¿Qué tiene de malo que compañeros de barco caminen juntos?”\n\nA pesar de sus palabras, Mio solo mostraba una expresión decidida. Su rostro, que lo miraba desde abajo, poco a poco dejó de mostrar seguridad, y luego tomó sus dedos con los suyos. Al sentir ese suave contacto, su respiración casi se detuvo.\n\n“Tú...”\n“...”\n\nAnte sus palabras, Mio respondió tomando con fuerza no solo sus dedos, sino su mano entera. Kurt sudaba frío y su rostro estaba rojo como si fuera un muñeco averiado. Si sus compañeros marineros hubieran estado presentes, habría sido objeto de burla inmediata. Pero ni Heinrich ni ningún superior estaban allí.\n\nVaciló un instante en cómo responderle. Pero pronto se decidió, y tomó su suave mano con su áspera palma.\n\nNo es que nunca hubiera tenido momentos felices. Al menos, antes de que su madre falleciera, los había vivido. Tal vez ella también sentía los latidos de su corazón desbocado. Sin decir palabra alguna, solo siguieron caminando, reteniendo el temblor de sus emociones. Y también, el latido de ella llegaba a su corazón.\n\n\"Dulzura en medio de la oscuridad.\""
 GEK_story_event.4.t: "Hacia sus respectivos deberes"
 GEK_story_event.4.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nCuando pisó por primera vez el suelo patrio, lo primero que vio fueron soldados de la Wehrmacht. A diferencia de la Kriegsmarine exiliada en Gotland que planeaba su retorno, los remanentes de la Wehrmacht luchaban secretamente contra “Gehenna”. Al parecer ya habían oído que mujeres con halo se habían unido a la Kriegsmarine, pues las miraban con curiosidad… o con ojos llenos de odio.\n\nTras organizar los suministros, se sentó a descansar en un rincón apartado. Mio se sentó a su lado con su sonrisa habitual y sacó un caramelo del bolsillo para dárselo. Kurt lo llevó a su boca sin decir palabra y saboreó su dulzura. Mio también lo chupaba con lentitud. Su gesto era el de siempre, pero sus ojos estaban apagados.\n\n“Me asignaron a la Infantería Halo.”\n“…Ya veo.”\n\nYa lo había escuchado antes. El comandante supremo planeaba formar una división de Infantería Halo para retomar el continente, y Mio sería asignada allí. Sabía que sería una clave para hacer frente a Kivotos, y que la esperaban entrenamientos duros. Y, sin darse cuenta, empezó a surgir en su interior el temor de perder a Mio.\n\nComo si lo hubiera notado, Mio le sonrió mientras lo miraba.\n\n“Estoy bien. Si puedo ayudar a salvar Alemania, eso me basta. Siempre lo soñaste, ¿no? Mirando el mar, imaginabas que algún día volverías a ver a tu padre y a tu familia. Trinity y Gehenna son enemigos poderosos... pero creo que el comandante supremo y el general nos guiarán bien... jeje...”\n\nIntentaba calmarlo con una sonrisa, pero su expresión se volvía cada vez más sombría. Kurt también lo sentía. Como cuando se conocieron por primera vez, los dos no podían decir nada.\n\n“¿Sabes? Aunque me disparen no me pasa nada... Pero tú sí que me preocupas. Sobrevive. A diferencia de mí, tú puedes morir con una sola bala. Tal vez no pueda protegerte a tu lado... pero mi corazón siempre estará contigo. Aunque estemos separados, siempre estaré contigo.”\n\nAl decir eso, Mio abrió los brazos y lo abrazó con fuerza. Deseaba que ese momento durara para siempre. Un abrazo que podría ser el primero y último. Por eso se aferraron aún más el uno al otro. El tiempo voló como una flecha, y los dos se despidieron con amargura. Incluso al volver a sus respectivos puestos, sus pasos eran pesados y difíciles de dar.\n\n“Auf Wiedersehen. (Adiós.)”"
 GEK_story_event.5.t: "En medio del infierno"
 GEK_story_event.5.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nLa lluvia de acero cayó sobre los desdichados soldados Halo esparcidos por el campo de batalla. Un soldado sujetaba su casco, murmurando sin cesar “no, no...” mientras caía en pánico. Otro gritaba con furia mientras golpeaba con la culata de su rifle a una chica de Gehenna. ¿Cómo mantener la cordura en medio de semejante caos? En esta situación infernal, Mio luchaba con desesperación por sobrevivir un poco más.\n\nLos combates caóticos continuaron hasta el amanecer. Las llamas iluminaban el cielo nocturno como si fuera de día. Recordaba su vida antes de la Gran Guerra. Aquella vez, en la cubierta del barco-academia, cuando hablaba con su amiga mirando el mar... ese recuerdo seguía vívido, como si hubiera sido ayer. Sumida en el shock ante el infierno frente a sus ojos, Mio fue sacada de su ensimismamiento por su amiga de antes de la guerra, Kotone.\n\n“¡Reacciona! ¡Si te quedas aquí morirás!”\n“Kotone... pero... yo... yo...”\n\nAl ver a Mio con síntomas de pánico, su amiga la agarró por los hombros y le gritó. Mientras Kotone intentaba que Mio volviera en sí, un proyectil destrozó su halo. Sin emitir siquiera un grito, Kotone exhaló su último aliento. Al ver morir de golpe a su amiga, Mio tomó su fusil de asalto y, jadeando, se lanzó a luchar con la muerte en mente.\n\nAun sin balas y agotada físicamente, siguió luchando cuerpo a cuerpo gritando casi como un aullido. Su rostro sangraba, su uniforme estaba desgarrado y sus heridas se multiplicaban. En su corazón pensaba en Kurt. Recordó aquel primer encuentro y el último abrazo que compartieron.\n\nSabía que esta batalla terminaría algún día. Pero también sabía muy bien que no viviría para verlo. Como si sus presentimientos fueran certeros, un proyectil en parábola apareció en su campo de visión. Las estudiantes de Gehenna y los soldados Halo alemanes comenzaron a retirarse, pero Mio no podía moverse. Aquella masa negra ardiente se acercaba cada vez más.\n\n“Kurt...”\n\nLas lágrimas le corrían por las mejillas. ¿Habrá presentido su final? Tragó saliva con dificultad, cerró los ojos y, por primera y última vez, esbozó una sonrisa dedicada a aquel que fue el dueño de su corazón.\n\n“Lo siento.”\n\nEl campo de batalla fue cubierto por humo espeso y explosiones ardientes. No quedó nada en el lugar donde ella estuvo.\n\n“Y la lucha continuó.”"
 GEK_story_event.6.t: "Bajo el cielo oscuro"
 GEK_story_event.6.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nEl destructor en el que se encontraba Kurt debía, en teoría, bombardear la costa para apoyar a sus aliados. Sí, así debía ser. Pero aquellas mujeres de Trinity enviaron torpederos contra su destructor y la flota, iniciando así la batalla en el mar. Las baterías antiaéreas del destructor escupían proyectiles contra los torpederos entrantes, y en poco tiempo, todo el casco se convirtió en un completo caos.\n\n“¡Heinrich! ¡Munición! ¡Rápido!”\n“¡Aquí tienes la munición! ¡Vaya bienvenida les estamos dando a esas zorras!”\n“¡Cállate y carga de una vez!”\n\nKurt, al lado del artillero, se encargaba de suministrar municiones a la batería antiaérea. Cada vez que una bomba caía al mar, el agua salada y helada lo empapaba. Cada vez que las olas se alzaban, el destructor se tambaleaba con su cuerpo de acero. Casi cae más de una vez. Reprimiendo las náuseas que subían por su garganta, y apoyándose apenas en la barandilla, Kurt se aferraba a su débil conciencia y cumplía con su deber. Fue justo cuando cargó la última ronda y señaló con el dedo hacia el torpedero con el emblema de Trinity que volaba en el cielo, cuando gritó—\n\n“¡Un torpedo!!”\n\nA menos de dos segundos de oír esas palabras, una explosión sacudió violentamente la nave. A duras penas levantándose del suelo, Kurt alzó la vista y vio cómo los torpedos y bombas implacables del enemigo caían sin piedad. Las ráfagas de los cañones del torpedero desgarraban el aire y despedazaban al artillero y a quienes estaban cerca. Aquella explosión fue suficiente para iluminar como el día una madrugada aún sin sol.\n\nJusto cuando trataba de posicionarse frente a la batería antiaérea para hacerles frente, escuchó los gritos de los marineros diciéndole que huyera, alejándose de él. Al alzar la vista vio una bomba cayendo del cielo. Su mente se quedó en blanco.\n\n“¡Mierda, Kurt! ¡¿Qué haces?! ¡Rápido!”\n\nLa voz de Heinrich retumbaba en su cabeza. Su cuerpo no respondía. Sabía que tenía que moverse, pero ¿por qué? Cuando finalmente logró reaccionar, su cuerpo se movió instintivamente tratando de escapar de la explosión. Pero cruelmente, esta ocurrió justo detrás de él. Sin darse cuenta, su cuerpo fue lanzado por los aires, cayendo directamente en las aguas heladas.\n\n“¡Kurt!!”\n\nHeinrich, al ver lo ocurrido, gritó con desesperación. Corrió hacia la cubierta, hacia el lugar de la explosión, dispuesto a lanzarse a salvarlo. Pero los marineros lo detuvieron. Fue arrastrado al interior del barco, a la supuesta “zona segura”. Desde ahí, no pudo hacer nada más que ver cómo el mar devoraba a su único amigo. Nunca le devolvió nada, sólo le mostró irritación. No hizo nada por él. Llorando, maldiciendo, golpeó el suelo con tal fuerza que su propia sangre empapó sus manos.\n\n- Y, frente a su impotencia, se acurrucó sobre sí mismo y volvió a gritar de dolor una vez más."
 GEK_story_event.7.t: "Recuerdo"
 GEK_story_event.7.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nHabía pasado mucho tiempo, pero la guerra contra Gehenna y Trinity finalmente había terminado. Alemania fue salvada de las garras de Kivotos, y los alienígenas ya no corromperían más su tierra. Sin embargo, Heinrich había perdido a su amigo más querido. Aquel que se le acercó sin prejuicios, incluso cuando su personalidad distorsionada había florecido tras salir del orfanato; aquel que lo miró como un ser humano. Desde que su amigo desapareció, Heinrich bebía todos los días. Deseaba que el alcohol aliviara y cuidara su dolor. Pero nunca pudo encontrar paz. Tras retirarse de la Kriegsmarine, no hacía nada más que encerrarse en su cuarto con varias botellas de whisky.\n\nHeinrich recordaba a la chica que estaba junto a Kurt. Aunque la maldijo, aunque intentó golpearla, ella nunca le respondió con hostilidad. Ciertamente expresó incomodidad, pero jamás le lanzó una sola palabra hiriente. El corazón de Heinrich se volvía aún más confuso. Por más que intentara negarlo, no podía tapar el sol con una mano. El hecho de que aquella chica se acercara a Kurt y permaneciera a su lado fue lo que le devolvió la sonrisa a su único amigo. Y también fue cierto que con ella, él volvió a encontrar la felicidad.\n\nEl whisky ardía bajando por su garganta. Heinrich, con su cerebro pequeño y torpe empapado en alcohol, recordó de nuevo. ¿Alguna vez hizo algo bien por su amigo? Kurt le dio muchas cosas, mientras él solo acumuló deudas con él. Daba por sentado todo lo que Kurt hacía por él.\n\nComo si hubiese tomado una decisión, Heinrich se levantó. Reunió todo el dinero que había guardado para más licor y compró una máquina de escribir y un montón de papel. Vendió a precio de risa todo el alcohol que tenía. Heinrich recordó, una vez más, los momentos con Kurt, su único y más valioso amigo. Y también recordó a aquella chica que hizo feliz a su camarada. Le escribió una carta de agradecimiento, muy tarde, sí… pero sincera. Letra por letra, lentamente, con cuidado.\n\n- “Esto es lo único que puedo hacer.”"
 GEK_story_event.8.t: "Una historia que no será olvidada"
 GEK_story_event.8.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nSe ha publicado “Una flor que floreció entre las llamas”, escrito por el veterano de la Kriegsmarine, Heinrich Rademacher. El libro relata la historia entre un simple marinero y una joven de “Kivotos”, quienes invadieron Europa. Para bien o para mal, la obra ha despertado gran interés. A pesar del profundo rencor acumulado entre los alienígenas y los europeos, la historia ha recibido excelentes críticas por su propio mérito. Algunos afirman que este libro será el primer paso hacia la reconciliación entre Kivotos y la humanidad, mientras que otros lo tachan de simple fantasía.\n\nLo que más ha captado la atención (y conmocionado a muchos) es el hecho de que esté basado en una historia real.\n\nAl ser preguntado por qué escribió el libro, Heinrich Rademacher respondió:\n\n“Primero, quiero hablar de mi amigo. Ese tipo… hizo mucho por mí. Se me acercó cuando estaba en el orfanato y me brindó su amabilidad cuando era un completo solitario. Me dio tanto que ni siquiera podría contarlo todo aquí. Y sin embargo, yo nunca le devolví nada. Solo envenené su corazón, bebía sin parar, le robaba sus cigarros… Aun así, ese imbécil siempre se lo tomaba a la ligera, con una sonrisa.\n\nRecordé los momentos que pasé con él. Antes de perder a su madre y volverse emocionalmente distante, siempre me decía que quería convertirse en alguien imposible de olvidar, incluso con el paso del tiempo. Pensé mucho en eso, hablé con su padre y fue fácil conseguir el permiso… Así que quería cumplir su deseo, aunque fuera de esta forma.\n\nNo fue fácil. Pasé días enteros pegado a la máquina de escribir, y la tentación de volver al alcohol, que juré no tocar de nuevo, me acosaba constantemente. Lo peor fue tener que mejorar mi escritura. Viví en la biblioteca por semanas. Me enterré entre libros… Cada palabra que escribí aún ronda en mi cabeza como un fantasma.\n\nBueno, supongo que valió la pena. Todos recordarán a mi amigo Kurt. Me incomoda un poco que lo recuerden por su primer amor, pero… ¿qué importa? Estoy seguro de que lo entenderá desde el cielo. Aunque, sinceramente, me da algo de miedo pensar que será él quien me reciba primero cuando muera.”\n\n“En fin… gracias por todo. Ojalá, donde estés, no estés triste… y seas feliz por siempre con esa chica.”\n\n_“Gracias por sus palabras.”"
 GEK_story_event.9.t: "En la periferia olvidada"
 GEK_story_event.9.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nEn una tierra periférica de la que nadie se preocupa, existía un pueblo sin nombre. Un lugar donde casi no llegaban pasos humanos, y sus habitantes vivían cada uno su historia, llevando su vida a su manera. Como ocurre con muchos otros, las historias ocultas de los habitantes eran tan diversas que resultaban incontables. El cielo comenzaba a oscurecerse y solo una casa emitía luz. En su interior, un hombre bebía café mientras hojeaba lentamente el periódico, página por página.\n\n“¿Oye~ qué estás leyendo desde hace rato?”\n“Ah... el periódico de esta mañana. Como sabes, hoy estuvimos bastante ocupados. Así que estoy aprovechando ahora para leerlo. Ve a descansar tú primero, entraré en un rato.”\n\nLos ojos del hombre recorrían los distintos titulares: escándalos de celebridades, el fin de la guerra entre Kivotos y Alemania… artículos de todo tipo. Justo cuando estaba a punto de cerrar el periódico, cansado, un rostro familiar captó su atención. Sorprendido, comenzó a leer el artículo. A medida que leía palabra por palabra, línea por línea, una sonrisa se dibujó en sus labios y sus ojos comenzaron a enrojecerse. Al comprender la sinceridad de quien había escuchado sus palabras a su manera, las lágrimas, gruesas como gotas de rocío, comenzaron a correr por su rostro. Cerró el periódico y entró en el dormitorio donde lo esperaba su amada. Se acostó a su lado, junto a ella, que con sus cicatrices visibles, su madurez física y emocional, y su aún deslumbrante belleza, lo acogió con calidez.\n\n“...Kurt, ¿recuerdas lo que dijiste aquella vez?”\n“...¿Cómo olvidarlo? Dijiste que aunque estemos separados físicamente, nuestros corazones siempre estarían juntos.”\n“Jeje, lo único que importa, Kurt, es esto: ahora ni siquiera el cielo puede separarnos. Ya no caeremos a un mar helado, ni sufriremos en medio del ardor abrasador.”\n“Eso suena tan tú, Mio. No volvamos a separarnos nunca más. Nunca.”\n\nAl escuchar su respuesta, Mio lo abrazó con fuerza. Sus almas compartieron entonces un profundo beso. ¿Cuánto tiempo habrá pasado? Frente a sus ojos, Mio dormía con una sonrisa en los labios y una suave respiración. Kurt también sonrió, acarició suavemente su mejilla y cerró los ojos con tranquilidad.\n\nLas estrellas del cielo brillaban como si los bendijeran. La luna creciente, testigo silenciosa, observaba a la pareja que había jurado estar junta hasta que sus cuerpos se convirtieran en polvo. Kurt sentía una felicidad genuina que no había experimentado desde la muerte de su madre.\n\n-Y ya no habría más lágrimas que derramar."

