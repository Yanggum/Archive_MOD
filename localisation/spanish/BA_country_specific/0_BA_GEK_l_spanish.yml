 GEK_religion_issue_cat: "Política religiosa"
 GEK_religion_issue_cat_desc: " Después de la Reforma, la religión alemana se dividió principalmente en dos ramas: el protestantismo del norte y este, y el catolicismo del sur y oeste. Conflictos históricos como la Guerra de los Treinta Años, los debates entre el grangermanismo y el pequeño germanismo, y la Kulturkampf de Bismarck son claros ejemplos de esa división. Aunque el conflicto parecía haber disminuido tras la unificación alemana y las luchas culturales, las tensiones resurgen entre el Zentrum republicano católico apoyado por los industriales del Rin, y el DNVP protestante monárquico respaldado por los junkers. Con Alemania Occidental parcialmente recuperada, la influencia del catolicismo ha aumentado, generando nuevas fricciones."
