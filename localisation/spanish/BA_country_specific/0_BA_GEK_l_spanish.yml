 #독일 군사정부 - 중점
 GEK_air_innovation:0 "Reagrupación de la Luftwaffe"
 GEK_air_innovation_desc:0 "Debido a la 'Gran Transposición' y la desaparición del comandante en jefe Göring, la Luftwaffe se dispersó por todo el territorio alemán. Ahora podemos reagruparla y ponerla nuevamente al servicio de la Wehrmacht."
 GEK_long_range_escorts:0 "Investigación de cazas pesados"
 GEK_long_range_escorts_desc:0 "Los cazas pesados, con mayor alcance y potencia de fuego, protegerán nuestros cielos y devastarán los del enemigo."
 GEK_four_year_plan:0 "Plan bianual"
 GEK_four_year_plan_desc:0 "Desde el establecimiento del gobierno militar alemán, estamos rodeados por enemigos. Debemos formular políticas económicas que generen resultados rápidamente y producir armas más poderosas para asegurar nuestra supervivencia."
 GEK_form_the_reichskommissariats:0 "Ambición del Gran Reich"
 GEK_form_the_reichskommissariats_desc:0 "Ahora que hemos renacido entre estos extraños, ha llegado el momento de recuperar el continente europeo de manos de los invasores. Alemania y su leal Wehrmacht se prepararán para una gran guerra de reconquista europea."
 GEK_government:0 "Marina en el exilio"
 GEK_government_desc:0 "Tras la desastrosa derrota en Trinity, huimos a Gotland, sumida en el desgobierno. La Kriegsmarine alemana regresará algún día a su patria."
 GEK_GER_government:0 "Establecimiento del gobierno militar"
 GEK_GER_government_desc:0 "Las emergencias requieren acciones extraordinarias. Aprovecharemos la guerra civil de la llamada 'Academia Gehenna' para reorganizarnos y levantar Alemania de entre las cenizas."
 GEK_free_german_legion:0 "Llamado a la organización de milicias"
 GEK_free_german_legion_desc:0 "Llamaremos a todos los alemanes por radio para que se unan. Nuestra marina los asistirá para reunirlos en Gotland."
 GEK_communication_with_the_mainland:0 "Comunicación con la patria"
