 GEK_show_story_archive_gui_desc:0 "Aquí puedes revisar las historias secundarias relacionadas con la Kriegsmarine alemana. Este sistema no afecta al juego en sí y existe únicamente para disfrutar de la narrativa interna del país dentro del juego. A medida que pasen los eventos y el tiempo, se irán desbloqueando nuevas historias. ¡Esperamos que lo disfrutes!"

