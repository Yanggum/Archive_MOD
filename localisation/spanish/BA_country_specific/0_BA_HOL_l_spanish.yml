 HOL_lack_of_industrial_base:0 "Falta de base industrial"
 HOL_developing_industrial_base:0 "Desarrollo de la base industrial"
 HOL_homeland_liberation:0 "Liberación de la patria"
 HOL_seeking_support:0 "Buscando apoyo para los Países Bajos"

 # 설명
 HOL_exile_government_desc:0 "Derrotados en la lucha contra los forasteros, nos exiliamos a Indonesia. Para formar un nuevo gobierno, aunque Java es pequeña, elegimos este lugar por su abundancia de recursos. Ahora debemos conquistar Indonesia y recuperar nuestra patria."
 HOL_political_effort_desc:0 "No somos más que un gobierno en el exilio expulsado a Indonesia. Pero no nos rendiremos. Debemos consolidar nuestra posición mediante esfuerzos políticos."
 HOL_suppress_indonesian_independence_desc:0 "El movimiento independentista indonesio se intensifica. Debemos reprimirlo sin piedad para mantener el orden. Su independencia jamás será tolerada."
 HOL_develop_indonesian_administration_desc:0 "Para gobernar Indonesia, debemos desarrollar la administración local y nombrar colaboradores leales. Esto fortalecerá nuestra capacidad de gobierno."
 HOL_supress_communist_activities_desc:0 "Las actividades comunistas se están intensificando. Aunque alegan actuar por la independencia, sólo provocan caos y anarquía. Debemos controlarlos con firmeza."
 HOL_reaffirm_colonial_rule_desc:0 "Debemos reafirmar que somos los legítimos gobernantes de Indonesia. Promover la legitimidad del dominio colonial y aislar a las fuerzas rebeldes. Indonesia seguirá siendo por siempre territorio neerlandés."
 HOL_expand_internal_security_desc:0 "Con las amenazas del movimiento independentista y de los comunistas, debemos ampliar y reforzar la seguridad interna. Incrementar los poderes policiales y de inteligencia, reforzando la vigilancia y el control."
 HOL_integrate_indonesian_conscripts_desc:0 "Debemos reclutar indonesios en nuestras fuerzas armadas. Soldados indonesios leales serán clave para luchar contra los rebeldes y conocer bien la situación local."
 HOL_army_effort_desc:0 "Para mantenernos en Indonesia, necesitamos un ejército fuerte. Crear nuevas divisiones, modernizar el equipo y mejorar el entrenamiento para maximizar nuestra fuerza."
 HOL_equipment_effort_desc:0 "Con equipo precario no podemos ganar. Debemos centrarnos en mejorar y producir armas, artillería y vehículos blindados en cantidad suficiente."
 HOL_motorization_effort_desc:0 "La clave para la victoria en la selva es la movilidad. Aumentar las unidades motorizadas y producir camiones y jeeps para realizar operaciones rápidas."
 HOL_doctrine_effort_desc:0 "Debemos desarrollar doctrinas militares adaptadas al singular entorno indonesio: combate en selva, montaña y urbano."
 HOL_equipment_effort_2_desc:0 "La guerra amenaza con prolongarse. Se necesita mejorar aún más el equipamiento, especialmente las comunicaciones, la medicina y la logística."
 HOL_mechanization_effort_desc:0 "Es necesario expandir las unidades mecanizadas. Incorporar blindados de transporte y vehículos para desplegar tropas de forma rápida y segura incluso en la jungla."
 HOL_doctrine_effort_2_desc:0 "Con la experiencia adquirida, podemos refinar nuestras doctrinas para responder con flexibilidad y realizar operaciones combinadas."
 HOL_equipment_effort_3_desc:0 "Las líneas se estancan y la guerra se vuelve de desgaste. Estandarizar armas y equipos y producirlos en masa será crucial para la victoria."
 HOL_armor_effort_desc:0 "Los rebeldes usan la selva para su guerra de guerrillas. Debemos fortalecer nuestras fuerzas blindadas y mejorar tanques y blindados."
 HOL_special_forces_desc:0 "Necesitamos fuerzas especiales que puedan operar sigilosamente en la selva, cortar suministros enemigos y atacar objetivos clave."
 HOL_aviation_effort_desc:0 "El control del aire será decisivo. Ampliar la fuerza aérea para realizar misiones de reconocimiento, bombardeo y apoyo cercano."
 HOL_fighter_focus_desc:0 "Para defender nuestro espacio aéreo y frenar ataques enemigos necesitamos cazas modernos y bien entrenados."
 HOL_bomber_focus_desc:0 "Para destruir instalaciones y concentraciones enemigas, los bombarderos estratégicos son esenciales."
 HOL_aviation_effort_2_desc:0 "Se requiere expandir aún más la fuerza aérea, con más fábricas, bases y personal calificado."
 HOL_CAS_effort_desc:0 "El apoyo aéreo cercano es vital para las operaciones terrestres en la selva. Debemos desarrollar y desplegar aviones ligeros de ataque."
 HOL_rocket_effort_desc:0 "Las armas cohete pueden cambiar el curso de la guerra. Desarrollar lanzacohetes y municiones para destruir fortificaciones y blindados enemigos."
 HOL_NAV_effort_desc:0 "Para dominar mar y aire necesitamos torpederos para atacar submarinos y buques enemigos."
 HOL_naval_effort_desc:0 "Indonesia es un archipiélago. Sin control naval no podemos ganar. Debemos construir una flota y dominar los mares."
 HOL_flexible_navy_desc:0 "Debido a la geografía compleja de Indonesia, necesitamos una marina ágil y flexible, con destructores, cruceros y submarinos bien coordinados."
 HOL_large_navy_desc:0 "A largo plazo, debemos construir una gran marina oceánica, con acorazados y portaaviones para imponer nuestra supremacía naval."
 HOL_submarine_effort_desc:0 "Los submarinos son ideales para bloquear suministros y atacar en secreto. Debemos producirlos en masa para debilitar al enemigo."
 HOL_cruiser_effort_desc:0 "Los cruceros son versátiles para reconocimiento, escolta y bombardeo. Construir cruceros modernos aumentará nuestra flexibilidad."
 HOL_destroyer_effort_desc:0 "Los destructores son cruciales para la guerra antisubmarina y para proteger la flota. Debemos producirlos en gran cantidad."
 HOL_capital_ships_effort_desc:0 "Los acorazados y portaaviones son el núcleo de la marina. Construirlos garantizará el dominio naval definitivo."
 HOL_industrial_effort_desc:0 "Indonesia carece de base industrial. Para mantener la guerra debemos ampliar urgentemente nuestra capacidad industrial."
 HOL_construction_effort_desc:0 "Debemos intensificar la construcción para compensar la falta de infraestructura."
 HOL_production_effort_desc:0 "Aumentar la producción es clave. Mejorar procesos y optimizar la mano de obra para producir más suministros."
 HOL_rubber_effort_desc:0 "Indonesia es la mayor productora de caucho. Debemos ampliar las plantaciones y usar esta ventaja estratégica."
 HOL_infrastructure_effort_desc:0 "Las malas infraestructuras obstaculizan la guerra. Debemos construir carreteras, ferrocarriles, puertos y aeropuertos."
 HOL_infrastructure_effort_2_desc:0 "Debemos seguir ampliando las infraestructuras militares y de producción para mejorar la capacidad bélica."
 HOL_production_effort_2_desc:0 "La prolongación de la guerra exige más producción. Impulsar la industria pesada y ampliar las instalaciones."
 HOL_construction_effort_2_desc:0 "Ampliar aún más la capacidad constructiva para proyectos a gran escala."
 HOL_nuclear_effort_desc:0 "Las armas nucleares son el arma definitiva. Aunque no podamos desplegarlas de inmediato, debemos comenzar el programa."
 HOL_extra_tech_slot_desc:0 "Necesitamos más inversión en investigación. Ampliar laboratorios y contratar más personal especializado."
 HOL_secret_weapons_desc:0 "Las armas secretas decidirán la guerra. Comenzar programas para misiles, armas biológicas o hipersónicas."
 HOL_political_effort_2_desc:0 "Para consolidar el esfuerzo bélico, debemos intensificar la propaganda, la movilización y las medidas de emergencia."
 HOL_develop_indonesian_resources_desc:0 "Indonesia es rica en recursos. Debemos explotarlos al máximo para sostener la guerra."
 HOL_reclaim_homeland_desc:0 "Nuestro objetivo final es recuperar los Países Bajos. Preparar la operación de liberación y mantener alta la moral."
 HOL_indonesian_army_desc:0 "Crear un ejército indonesio leal para combatir a los rebeldes."
 HOL_expand_indonesian_industry_desc:0 "Expandir la industria indonesia aprovechando recursos y mano de obra local."
 HOL_indonesian_military_industry_desc:0 "Fomentar una industria militar moderna en Indonesia."
 HOL_indonesian_naval_bases_desc:0 "Construir grandes bases navales para fortalecer la flota."
 HOL_indonesian_air_bases_desc:0 "Construir grandes bases aéreas para dominar los cielos."
 HOL_indonesian_infrastructure_desc:0 "Desplegar infraestructura militar en toda Indonesia."
 HOL_indonesian_nuclear_program_desc:0 "Iniciar un ambicioso programa nuclear desde Indonesia."
 HOL_indonesian_rocket_program_desc:0 "Impulsar el desarrollo de cohetes y misiles."
 HOL_seek_soviet_support_desc:0 "Buscar apoyo total de la Unión Soviética, incluso a cambio de nuestra orientación política."
 HOL_soviet_industrial_support_desc:0 "Recibir apoyo industrial soviético para modernizar Indonesia."
 HOL_soviet_tank_designs_desc:0 "Licenciar diseños soviéticos para reforzar nuestras fuerzas blindadas."
 HOL_seek_american_support_desc:0 "Buscar apoyo estadounidense a cambio de mantenernos en el bloque occidental."
 HOL_american_landing_craft_desc:0 "Adoptar tecnología estadounidense para operaciones anfibias."
 HOL_usa_infnatry_support_desc:0 "Equipar nuestras tropas con armas estadounidenses."
 HOL_soviet_aircraft_designs_desc:0 "Licenciar diseños aéreos soviéticos para nuestra aviación."
 HOL_soviet_naval_designs_desc:0 "Adoptar diseños navales soviéticos para construir una flota moderna."
 HOL_soviet_research_cooperation_desc:0 "Cooperar con potencias extranjeras en investigación avanzada."
 HOL_american_industrial_support_desc:0 "Aprovechar la ayuda estadounidense para modernizar la industria."
 HOL_american_naval_designs_desc:0 "Adoptar diseños navales estadounidenses para mejorar nuestra marina."
 HOL_INS_war_idea_desc:0 "Aunque exiliados en Indonesia, no nos rendiremos. Superaremos las adversidades y volveremos a nuestra patria."
 HOL_capitalist_support_desc:0 "Contamos con el apoyo de los capitalistas locales, que prefieren mantener la estructura colonial."
 HOL_lack_of_industrial_base_desc:0 "Indonesia carece casi por completo de industria. Esto obstaculiza gravemente la guerra."
 HOL_developing_industrial_base_desc:0 "Hemos comenzado a desarrollar una base industrial para sostener el esfuerzo bélico."
 HOL_communist_menace_desc:0 "Los comunistas indonesios son una amenaza seria y debemos aplastarlos."
 HOL_war_of_retribution_desc:0 "Ha llegado la hora de la venganza. Recuperaremos Indonesia y castigaremos a quienes nos desafiaron."
 HOL_homeland_liberation_desc:0 "El objetivo final es recuperar nuestra patria. Esa es nuestra verdadera razón de luchar aquí."
 HOL_indonesian_resource_exploitation_desc:0 "Debemos explotar los abundantes recursos indonesios para alimentar nuestro esfuerzo bélico."
 HOL_soviet_military_advisors_desc:0 "Los asesores soviéticos ayudarán a entrenar y mejorar nuestras fuerzas."
 HOL_american_military_advisors_desc:0 "Los asesores estadounidenses nos aportarán valiosas tácticas y equipos modernos."
 HOL_american_resource_trade_desc:0 "Expandir el comercio de recursos para sostener la economía de guerra."
