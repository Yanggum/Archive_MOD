 ARI_day_of_doom_idea: "El día de la ruina"
 ARI_day_of_doom_idea_desc: "La Escuela Secundaria Arius cometió de golpe una oleada de terrorismo devastador, de una escala inimaginable, contra todos nuestros comandantes de operaciones de campo, superando por completo incluso nuestras contramedidas. Como resultado, hemos perdido temporalmente toda capacidad de respuesta militar. ¡Debemos concentrar todos nuestros esfuerzos para recuperarla y detener a toda costa el ataque de Arius!"
 ARI_day_of_doom_idea_1: "El día de la humillación"
 ARI_day_of_doom_idea_1_desc: "Los atentados de la Escuela Secundaria Arius sumieron a toda nuestra academia en estado de shock y obligaron a debatir contramedidas de emergencia. ¡Debemos hacer todo lo posible para recuperar el control militar temporalmente perdido!"

 ARI_story_event.3.t: "[THIS.GetName] herido/a"
 ARI_story_event.3.d: "A pesar de nuestra protección, [THIS.GetName] [THIS.GetRank], quien comandaba las fuerzas frente a Arius, fue atacado/a por el cobarde bombardeo terrorista de Arius. [THIS.GetSheHeCap] resultó herido/a y parece que necesitará tiempo para recuperarse por completo. Hasta que se recupere, no podrá rendir con su capacidad habitual."

 ARI_news.3.t: "Trinity cae en el caos"
 ARI_news.3.d: "En la madrugada de hoy, una oleada simultánea de explosiones de una escala increíble estalló por toda la Academia General Trinity, la mayor academia de Kivotos. La pacífica madrugada de Trinity quedó cubierta por sirenas desgarradoras y humo negro.\n\nEste bombardeo, preparado durante muchísimo tiempo por la Escuela Secundaria Arius sin que nadie lo notara, fue letal. Los principales bastiones del Departamento de Justicia, los centros de mando y control y las rutas de suministro clave quedaron paralizados junto con las explosiones, y se perdió el contacto con los comandantes del terreno.\n\nLas fuerzas de defensa de Trinity entraron en pánico. Sin poder siquiera determinar cuándo, dónde o cómo atacó el enemigo, las fuerzas de Arius están ocupando como fantasmas los puntos clave de una Trinity indefensa. Este es el prólogo de una guerra perfectamente calculada y el inicio del día más largo que Trinity habrá de enfrentar."
 ARI_news.3.a: "¡Enséñenles el miedo!"
 ARI_news.3.b: "¡Declaren de inmediato el estado de emergencia!"
 ARI_news.3.c: "Ha ocurrido algo imposible."

 ARI_news.4.t: "El bombardeo terrorista de Arius"
 ARI_news.4.d: "La Escuela Secundaria Arius intentó asestar un golpe decisivo contra la Academia General Trinity, pero fue bloqueada gracias a la preparación previa del Departamento de Justicia.\n\nEn la madrugada de hoy, se registraron explosiones dispersas e intentos de bombardeo en algunas instalaciones de Trinity. Arius intentó inducir un caos a gran escala, pero la cadena de mando de Trinity evitó quedar paralizada y los principales comandantes estaban protegidos a salvo.\n\nBajo el mando frío y preciso del Departamento de Justicia, los explosivos colocados por Arius fueron desactivados con antelación y muchos infiltrados quedaron atrapados dentro del cerco. Aunque varias instalaciones sufrieron daños y se alzó humo, las funciones de la academia continúan operando con normalidad. La “carta escondida” de Arius causó daños extensos, pero no llegó a un daño decisivo, y ahora deberán afrontar el contraataque de una Trinity furiosa."
 ARI_news.4.a: "...¿No fue suficiente?"
 ARI_news.4.b: "¡Inicien el contraataque de inmediato!"
 ARI_news.4.c: "Es un atentado horrible."

 ARI_end_of_pacifism: "Fin del pacifismo"
 ARI_end_of_pacifism_desc: "Dado que lanzamos un ataque preventivo contra la Escuela Secundaria Arius, pase lo que pase en el frente, los estudiantes de Trinity se han vuelto poco cooperativos con nuestra guerra debido a la expiación de la Hermandad, el movimiento alemán contra la movilización, la propaganda anti-Gehenna y pro-Trinity difundida por Arius, y la trágica historia de la verdad del viejo concilio.\n\nHa comenzado el §GFin del pacifismo§! para estabilizar el interior de §YTrinity§!. Cada vez que obtengamos §Y425 puntos§! de apoyo bélico, podremos §4eliminar§! §Rune desventaja§!.\n\nActualmente, nuestros puntos son ([?global.ARI_trinity_pacifism_var|G.0] puntos)."
