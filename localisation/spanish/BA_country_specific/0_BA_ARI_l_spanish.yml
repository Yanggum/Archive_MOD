 ARI_fortress_arius: "Fortaleza Arius"
 ARI_fortress_arius_desc: "“Fortaleza Arius” es la ideología que los conservadores, defensores del sistema tradicional de Arius, adquirieron a medida que Arius seguía expandiéndose. Rechazando la negación de una represalia dura contra Trinity y defendiendo el viejo orden de Arius, esta ideología busca materializar ese orden antiguo mediante un método nuevo."
 ARI_emergency_government: "Gobierno de emergencia"
 ARI_emergency_government_desc: "Quienes se dividían entre conservadores y reformistas sin interesarse por la vida real ahora intentan autodestruirse. El intento de golpe de estado de la guardia conservadora y el intento reformista de un levantamiento popular contra minorías y facciones trinitarias fueron bloqueados de antemano; ahora presionaremos para que Saori apruebe un gobierno de emergencia."
 ARI_approval_of_reformist_manifesto: "Aprobar el manifiesto reformista"
 ARI_approval_of_reformist_manifesto_desc: "El resultado del concilio es claro y nuestro destino está decidido. Está claro que Arius debe cambiar. Como primera chispa para dejar atrás los métodos viejos y arcaicos, Azusa—nuestro pilar espiritual—intentará persuadir directamente a Saori para que apruebe el manifiesto que decidirá el futuro de Arius."

# # Eventos
 ARI_3rd_council.1.t: "Tercer Concilio: Apertura"
 ARI_3rd_council.1.d: "Lo que llenaba el enorme salón del parlamento de Danzig no era fervor ni vítores, sino un silencio perfectamente controlado, casi helado.\n\nEl procedimiento del Tercer Concilio avanzó con una fluidez escalofriante: presentación de mociones, debate y votación. Todo encajaba sin error, como engranajes coordinados de antemano. No había pruebas de fraude. Las urnas eran transparentes, el escrutinio se realizaba ante todos los observadores, y los números no mentían. Y, sin embargo, precisamente esa “excesiva transparencia” estaba volviendo locos a los delegados reformistas.\n\n\"¡Esto es un engaño! ¡Así... así no puede haber tanto silencio! ¡¿Cómo es posible que no haya ni una sola objeción?! ¡Esto no es un parlamento: es un cadáver!\"\n\nEl portavoz reformista, con la corbata desabrochada y las venas marcadas, gritó a pleno pulmón. Su argumento no apelaba a la “legitimidad procedimental”, sino al “rechazo visceral”. Abucheaban desde el fondo, golpeaban mesas y exigían “debate libre”, pero sus alternativas eran caóticas, manchadas por disputas internas de intereses.\n\nEn lo alto del estrado, Joumae Saori contemplaba aquel tumulto con ojos insensibles. La guardia a su lado ni siquiera se movía. Cuando Saori alzó el mazo, el alboroto reformista chocó contra un muro de silencio masivo y se apagó, impotente."
 ARI_3rd_council.1.a: "La oposición se desvaneció."

 ARI_3rd_council.2.t: "Tercer Concilio: salida desordenada"
 ARI_3rd_council.2.d: "\"¡Esta elección es inválida! ¡No puedo aceptarla!\"\n\nUn grito estalló bajo el estrado. Un duro reformista agitó en el aire, con la mano temblorosa, los documentos de una demanda para anular la elección, pero Saori no pestañeó. Cuando golpeó el mazo y declaró “desestimado”, debía estallar un cántico coordinado entre los reformistas. Pero la realidad se acercó más a una farsa que a una lucha pactada.\n\n\"¡Vámonos! ¡Rechacemos este nido mugriento de dictadura!\"\n\nAlgunos se levantaron de golpe, pero menos de la mitad los siguió. Salir del salón cuando la victoria aplastante conservadora ya era un hecho equivalía al fin de la vida política. Alguien se alzó con torpeza y volvió a sentarse; otro sujetó la ropa de un compañero para impedirle irse. Su “organización” ya se estaba derrumbando desde dentro.\n\nEn esa fila caótica hacia la salida, Shirasu Azusa permanecía en silencio, firme en su asiento.\n\n\"¡Shirasu Azusa! ¿Qué haces? ¡Tienes que venirte con nosotros!\"\n\"......\"\n\nAnte la insistencia, Azusa negó con la cabeza. Se negó a ser una perdedora que huye. Aunque no estuviera de acuerdo con el método de Saori, sabía que cruzar esa puerta significaba no poder cambiar nada. O quizá solo la movía el desprecio de mezclarse con un grupo tan miserable.\n\nSaori observó por un instante los asientos vacíos de la izquierda y, entre ellos, a Azusa, como una isla. Encendió el micrófono.\n\n\"No detendré a quien quiera irse. Abran la puerta.\"\n\nCuando la guardia abrió de par en par, las espaldas de los reformistas que escapaban parecían patéticas, casi miserables. En el salón quedó Saori, “vencedora perfecta”; Azusa, que enfrentaba la derrota; y un silencio pesado."
 ARI_3rd_council.2.a: "¿Se consumen a sí mismos?"

 ARI_3rd_council.3.t: "Fin del Tercer Concilio"
 ARI_3rd_council.3.d: "Justo después de anunciarse el resultado del Tercer Concilio, los reformistas convocaron una reunión urgente de “crisis”. El nombre era grandilocuente, pero en realidad no fue más que un caos de recriminaciones y gritos.\n\nAlgunos duros presentaron, por su cuenta y sin consenso, un “manifiesto de nulidad absoluta” de la elección. Alegaban que la victoria de Saori se debía a un “miedo invisible” y exigían desobediencia inmediata y huelga general. Pero ni siquiera durante la lectura del manifiesto la sala logró unificarse.\n\n\"¿Estás en tu sano juicio? ¡Eso es pedirnos que nos maten a todos!\"\n\nLos moderados se abalanzaron sobre los duros y los enfrentaron con furia. Sabían que no había justificación para revertir una elección ya cerrada de forma legal y perfecta. En una reunión a la que ni Azusa asistió, la “lucha” de quienes solo movían la pluma era hueca. Alguien escapó por la puerta trasera; otro comenzó a redactar una petición para presentarla al bando de Saori.\n\nEl “decreto de resistencia” anunciado pasada la medianoche no causó ondas en el mapa político de Kivotos. La ciudadanía lo vio como el último ridículo de los derrotados, y los burócratas de Arius ni se molestaron en burlarse. Aquello no fue la señal de una nueva unidad, sino un testamento: se cortaron ellos mismos la poca vida política que quedaba.\n\nJoumae Saori recibió el informe sin dar ninguna orden. No hacía falta golpear a un enemigo que se desplomaba solo."
 ARI_3rd_council.3.a: "Fin."

 ARI_3rd_council.4.t: "Tercer Concilio: Apertura"
 ARI_3rd_council.4.d: "Las ventanas del parlamento de Danzig temblaban con el estruendo de una multitud fuera. El Tercer Concilio de Arius se parecía menos a una sesión solemne y más a un mercado fuera de control.\n\nLos reformistas rodearon el edificio con simpatizantes y manifestantes, bajo el pretexto de “reflejar la voluntad popular”. Cada vez que un conservador subía a hablar, desde fuera caían abucheos amplificados y trompetas; dentro, los reformistas golpeaban mesas e interrumpían. Pero el verdadero problema no era el ruido.\n\n\"Hay gente sin derecho aquí. Gendarmes: sáquenlos ahora mismo.\"\n\nSaori ordenó con frialdad desde la presidencia. En la galería y la fila para votar había muchos que no eran estudiantes de Arius: residentes y colaboradores de Trinity con brazaletes de Arius puestos de forma torpe. Pero antes de que los gendarmes se movieran, el representante reformista arrebató el micrófono y gritó:\n\n\"¡Todos los que viven en esta tierra son Arius! ¡Presidenta, no limite el sagrado derecho al voto con un viejo ‘purismo de sangre’!\"\n\nEra un descaro. Estaban retorciendo la definición de “miembro de Arius” para meter, en camiones, a gente de fuera que votaría por ellos. Las facciones trinitarias derrotadas aprovecharon el caos para entrar al parlamento bajo el amparo reformista.\n\nSaori intentó imponer orden con el mazo, pero sus esfuerzos se ahogaron en miles de gritos y propaganda de “libertad”. Las urnas se desbordaban con votos no verificados, y en los ojos de Saori se acumuló el asco. Esto no era un concilio: era violencia empujada por números."
 ARI_3rd_council.4.a: "Al menos, así lo vio ella."

 ARI_3rd_council.5.t: "Tercer Concilio: orden"
 ARI_3rd_council.5.d: "El parlamento era una olla a presión a punto de estallar. Gritos y trompetas reformistas retumbaban por todas partes; los conservadores estaban aislados, sitiados por el estruendo.\n\nSaori recorrió el salón con la mirada. Donde antes había una “fuerza de acero”, ya no quedaba nada. Los conservadores, intuyendo una derrota inevitable, cerraban los ojos o apretaban el puño tragándose la rabia. La cohesión ya estaba rota; si Saori tiraba el mazo y volcaba la mesa, lo único que quedaría sería una segunda guerra civil y sangre estudiantil.\n\nSaori tomó el micrófono. Su voz era baja, pero extrañamente nítida incluso entre el ruido.\n\n\"...El resultado está confirmado. Reconozco la derrota.\"\n\nLos reformistas intentaron estallar en vítores, pero Saori continuó:\n\n\"Aun así, compórtense con orden. No somos bestias.\"\n\nNo era una súplica humillante: era la última advertencia de una líder que detesta el caos. Y justo cuando parte de la multitud, ebria, iba a abuchearla...\n\n\"Todos, silencio.\"\n\nShirasu Azusa, en la primera fila, se levantó y alzó la mano. Al girarse y fulminar con la mirada a su propia facción y a los manifestantes, el ruido se apagó como si le hubieran arrojado agua fría. Azusa inclinó la cabeza ante Saori, con ojos cargados no de euforia, sino de responsabilidad."
 ARI_3rd_council.5.a: "El alboroto se calmó."

 ARI_3rd_council.6.t: "Fin del Tercer Concilio"
 ARI_3rd_council.6.d: "En el despacho, el ruido del concilio—como un temporal—se retiró como marea. Solo quedaron un silencio pesado y el ocaso, alargado sobre las paredes. La quietud era tan profunda que podían verse las partículas de polvo flotando. Y lo que la rompió fueron pasos de botas, rítmicos.\n\nToc, toc. Alguien llamó, pero la puerta se abrió sin esperar respuesta. Era Shirasu Azusa.\n\nJoumae Saori, hundida en el asiento, observó a su antigua compañera en el umbral. ¿Cuánto tiempo había pasado desde la última vez que se miraron a los ojos—no por el cañón de un arma? Los recuerdos de repartir pan mohoso en ruinas se desdibujaban, escondidos tras un escritorio enorme y montañas de papeles. Sobre los hombros de Azusa ya no colgaba un rifle viejo, sino el peso de ser “el pilar espiritual reformista”.\n\nAzusa avanzó despacio hasta el escritorio. En la mano llevaba el “Manifiesto del Concilio”, aún con la tinta fresca. Sus labios se movieron: quizá estaba a punto de derramar, por fin, la lógica ensayada decenas de veces para explicar por qué esto era necesario, por qué Arius debía cambiar.\n\nPero Saori extendió la mano antes de que Azusa pronunciara la primera palabra.\n\n\"Dámelo.\"\n\nUna frase corta, seca. Los ojos de Azusa se abrieron un instante, pero Saori tomó el documento y firmó sin titubear. El raspar del bolígrafo fue lo único que atravesó el silencio gigantesco entre ambas. Saori ya lo sabía: la época cambió, y si no se puede detener la marea, hay que abrir el dique.\n\nEl documento aprobado volvió a deslizarse hacia Azusa. Saori se levantó. No hubo aliento ni reproche. Intuía que, ahora, cualquier palabra crearía “malentendidos” y no “entendimiento”. Pasó junto a Azusa, rígida, y añadió apenas:\n\n\"Vete. Te quedará mucho por hacer.\"\n\nCon el sonido de la puerta cerrándose, la habitación dejó a Azusa sola, junto al documento firmado."
 ARI_3rd_council.6.a: "¿Puede curarse este abismo emocional?"

 ARI_3rd_council.7.t: "Una corona sobre un castillo de arena"
 ARI_3rd_council.7.d: "Apoyada en la ventana del despacho, Shirasu Azusa miró de reojo el documento de aprobación sobre un rincón del escritorio: el manifiesto de aquel día, firmado por Joumae Saori.\n\nAhora, al recordarlo, lo que Azusa sintió entonces no fue júbilo. Fue un miedo vacío, casi. Había preparado lógica, legitimidad y “poder” para derribar a Saori. Pero Saori le entregó toda la autoridad con una facilidad absurda, como si hubiese estado esperando. En ese instante breve en que la pluma arañó el papel, Azusa no oyó el derrumbe de un muro: sintió la pérdida de su único adversario capaz de sostenerla.\n\nPensó en la gente que había traído consigo: los reunidos bajo el letrero dulce de “reforma”. ¿Cuántos se preocupaban de verdad por el futuro de Arius? Asesores que susurraban manipular el voto usando vacíos legales; agitadores que excitaban a las masas para inducir violencia; oportunistas que, en cuanto Saori se apartó, babeaban ante el botín.\n\nAzusa tomó sus manos codiciosas para llegar hasta aquí. Porque estaba convencida de que el camino de Saori llevaba a la “muerte”, y creyó que aunque se ensuciara en el fango debía abrir un camino hacia la “vida”. Pero al sentarse en esa silla, sintió en carne propia el peso del silencio que Saori cargaba.\n\nEl vacío que Saori dejó al pasar no estaba vacío. Estaba lleno de caos y contradicciones de un mundo sin orden, que ahora Azusa debía soportar. Con alivio, culpa y una presión indescriptible mezclándose, acarició con la yema del dedo la firma sobre el papel."
 ARI_3rd_council.7.a: "Llevar una corona no era cargar una luz brillante, sino una sombra insoportable."

 ARI_3rd_council.8.t: "Tercer Concilio: Apertura"
 ARI_3rd_council.8.d: "El aire del parlamento de Danzig estaba tan tenso que costaba respirar. No era el silencio conservador ni el alboroto reformista: era la intención asesina de bestias a punto de arrancarse la garganta.\n\nA izquierda y derecha del pasillo central, el salón estaba partido a la perfección. Los conservadores, brazos cruzados, miraban al rival como si fuese basura; los reformistas, sujetando legajos como armas, gritaban y provocaban. Para ellos, este concilio no era un lugar de “acuerdo” o “debate”. Era un patíbulo, legal en apariencia, para aplastar al otro como hereje y monopolizar todo el poder.\n\nEn la presidencia, Joumae Saori, y como figura representativa reformista, Shirasu Azusa, intentaban desesperadamente mantener el orden.\n\n\"¡Silencio! ¡No se permiten ataques personales!\"\n\"¡Siéntese! ¡Aún no ha obtenido la palabra!\"\n\nAmbas líderes intentaban sostener, al menos, una “línea” mínima. Pero trágicamente, Saori era el símbolo conservador y Azusa la bandera reformista. Por más que llamaran a la razón, los lobos codiciosos del parlamento solo las consumían como representantes de intereses.\n\nEn medio de esa lucha repugnante, Saori cruzó miradas con Imashino Misaki, sentada en un rincón.\n\nMisaki no peleaba ni gritaba. Solo, con la barbilla apoyada, contemplaba todo el salón con ojos vacíos. Pero esa mirada ya no era la apatía de antes. No observaba a los reformistas peleando ni a los conservadores autoritarios.\n\nMiraba “todo”—incluyendo a Saori y Azusa en el estrado—con un odio y un desprecio insoportables, como si mirara moscas sobre carne podrida. Al encontrar esa mirada helada, Saori sintió un escalofrío recorriéndole la espalda."
 ARI_3rd_council.8.a: "El sonido del mazo volvió a retumbar, pero una intuición le dijo que esta vez no significaría gran cosa."

 ARI_3rd_council.9.t: "Tercer Concilio: ruptura"
 ARI_3rd_council.9.d: "Insultos y gritos se mezclaron hasta convertir el parlamento en un caos ingobernable. Una placa de identificación arrojada por un conservador abrió la frente de un reformista; los forcejeos estaban a un paso de convertirse en una pelea masiva.\n\n\"U- uee... ¡por favor, por favor, paren! ¡No podemos... no podemos hacernos esto entre nosotros...!\"\n\nTsuchinaga Hiyori se levantó llorando y gritó. Agitó las manos intentando separar a ambos bandos, pero en el torbellino del odio su voz era menos que un mosquito. Alguien empujó a Hiyori con brutalidad y ella cayó al suelo.\n\n**¡BANG!**\n\nUn disparo agudo, como si fuese a perforar el techo alto, retumbó por el parlamento. De golpe, el silencio cayó como agua fría. Todas las miradas se clavaron en el arma: Imashino Misaki.\n\nMisaki ayudó a Hiyori a ponerse en pie y le sacudió el polvo. Luego bajó el cañón aún humeante y recorrió con ojos secos a Saori, Azusa y a los legisladores paralizados.\n\n\"No puedo ni mirar, con tanto ruido.\"\n\nSu voz era baja, pero se clavó clara en todos los rincones.\n\n\"Mientras ustedes se estrangulan diciendo quién tiene razón... Arius se está pudriendo otra vez. Miren. ¿Esto es un parlamento? ¿O es el mismo ‘desastre’ del que tanto queríamos escapar?\"\n\nMisaki no esperó respuesta. Solo dijo: \"Vámonos, Hiyori. Aquí no se puede ni respirar\", y se dirigió a la salida.\n\nEntonces sonó el arrastre de una silla. Un centrista, arrinconado, se levantó en silencio y siguió a Misaki. Luego dos, tres... Personas hartas de los extremos, sin importar facción, se pusieron de pie una tras otra. Pronto, aquella fila se volvió un río."
 ARI_3rd_council.9.a: "Mientras Saori y Azusa miraban, atónitas, la mitad del parlamento quedó vacío."

 ARI_3rd_council.10.t: "Dos alas que caen"
 ARI_3rd_council.10.d: "El cielo nocturno sobre el centro de Arius ardía de rojo. No era el atardecer: eran las llamas de bombas molotov lanzadas por multitudes furiosas, dirigidas por los reformistas.\n\n\"¡Abajo la dictadura! ¡Arius para los ciudadanos!\"\n\nLos duros reformistas incitaron a residentes de origen trinitario a llenar las calles. Ocuparon edificios públicos y proclamaron una “revolución ciudadana”, pero en la práctica era saqueo y fuego sin control.\n\nEn paralelo, la respuesta del ala militar conservadora fue el peor de los autogoles. Sin aprobación de Saori, intentaron movilizar tropas, bloquear el parlamento y declarar ley marcial: “Operación Fortaleza”. Pero el plan de golpe de la guardia se filtró por una denuncia interna justo antes de ejecutarse.\n\nCuando se supo que “iban a apuntar con armas al pueblo”, la gendarmería se negó a obedecer y la multitud se abalanzó sobre las residencias de los golpistas. Generales fueron arrastrados con los uniformes rasgados, y líderes reformistas, embriagados de locura, lo transmitían en directo: un infierno.\n\nDesde una casa segura, Tsuchinaga Hiyori apretó los labios.\n\n\"...Ya no puede seguir. Saori, y Azusa... ya no pueden detener nada. A este paso, Arius desaparecerá de verdad.\"\n\nEn los ojos de Hiyori, por primera vez, había una determinación venenosa. Imashino Misaki soltó un largo suspiro y asintió. Sus ojos ya estaban fríos.\n\nMisaki desplegó un mapa de Arius sobre la mesa. Marcaba posiciones de unidades y administraciones que no pertenecían a ninguno de los dos bandos, pero habían permanecido en silencio.\n\n\"Hiyori, prepárate. Vamos con Saori.\"\n\"...Sí.\""
 ARI_3rd_council.10.a: "Ambas se movieron para entregar el ultimátum final, dejando atrás una ciudad que se volvía ruina."

 ARI_3rd_council.11.t: "Proclama de emergencia N.º 1"
 ARI_3rd_council.11.d: "En la plaza de Danzig al amanecer flotaba un silencio extraño. Donde antes hubo barricadas, ahora se desplegaban fuerzas del “Gobierno de Emergencia” con uniformes negros, y desde radios y altavoces comenzó a emitirse, entre chasquidos de interferencia, la voz seca de Imashino Misaki.\n\nTras firmar la aprobación de medidas de emergencia, Joumae Saori se trasladó a un anexo de la residencia; Shirasu Azusa, aunque había previsto la situación por inteligencia, se dejó detener sin resistirse. El vacío de poder dejado por dos gigantes lo llenaron chicas a las que todos creían “sin fuerza”.\n\nNo prometieron grandes ideologías ni un futuro brillante. Se leyó, sin más, un edicto frío, impulsado por el instinto de “sobrevivir hoy”.\n\n\"A todos los estudiantes y ciudadanos de Arius. Ya no derramaremos sangre bajo banderas vacías. Por la presente, el nuevo ‘Gobierno de Emergencia’ proclama lo siguiente:\"\n\n1. Rechazo permanente de la guerra civil. No toleraremos que se repita la tragedia del viejo Arius, donde hermanos apuntaban a pechos de hermanos. Toda acción que provoque guerra civil será ejecutada sumariamente.\n\n2. Disolución de facciones y depuración de responsabilidades. Declaramos tanto a “conservadores” como a “reformistas” culpables principales por ignorar el sustento del pueblo y hundir el Estado en el estancamiento mediante lucha de poder. A partir de este momento, toda facción política queda disuelta por la fuerza.\n\n3. Nulidad absoluta del concilio anterior. El último concilio, manchado por violencia, agitación y deserciones masivas, es declarado nulo de origen por falta de quórum. Allí no existió la “voluntad de Arius”.\n\n4. Proclamamos que este Gobierno de Emergencia es el único gobierno legítimo al que se ha delegado el derecho de supervivencia de los miembros dispersos, y que somos, en el sentido verdadero, el “Tercer Concilio de Arius”.\n\n5. Prioridad: supervivencia. El debate ideológico terminó. De ahora en adelante, toda capacidad administrativa se concentrará únicamente en asegurar alimentos, mantener el orden público y excluir amenazas externas.\n\nAl terminar la transmisión, Misaki apagó el micrófono y dejó escapar un profundo suspiro. A su lado, Hiyori apretaba el manifiesto con manos temblorosas."
 ARI_3rd_council.11.a: "...Se acumuló el trabajo."

