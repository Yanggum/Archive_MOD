 TRM_heart_strike_plan: "Responder a las actividades de Arius"
 TRM_heart_strike_plan_desc: "Es seguro que la Escuela Secundaria Arius está preparando algo contra nosotros, pero como el público ha sido embaucado por la propaganda anti-Gehenna y pro-Trinity difundida por Arius, una intervención directa solo parecería posible después de que ellos ejecuten realmente este plan secreto. Antes de eso, debemos hacer todo lo que esté a nuestro alcance para prepararnos contra su asalto.\n\nHa comenzado una §Gcompetencia de puntos§! entre §YArius§! y §YTrinity§!. Si §YArius§! obtiene más §Gpuntos§! que §YTrinity§!, logrará un §Rataque aéreo devastador§!; si no, logrará un §4ataque aéreo menor§!. No podemos conocer los §Gpuntos§! exactos del enemigo: solo podemos saber en qué §Grango§! se encuentran.\n\nActualmente, nuestros puntos son ([ARI_heart_strike_plan_TRM_VAR] puntos).\nLos puntos del rival parecen estar dentro del rango ([ARI_heart_strike_plan_ARI_VAR_LOC] puntos)."

