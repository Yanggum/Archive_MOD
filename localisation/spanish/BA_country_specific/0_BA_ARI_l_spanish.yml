 ARI_story_event.8.t: "La propaganda muestra resultados"
 ARI_story_event.8.d: "Debido a la propaganda constante que nuestra Escuela Secundaria Arius ha llevado a cabo desde la Gran Transición, dentro de Trinity se ha desatado confusión. Además, nuestras guerrillas en preparación están atacando los suministros dentro de Trinity, y los ángeles de Arius nacidos de la Porta Fasis también actúan en el frente enemigo para ayudarnos.\n\nAunque esta invasión nos impidió ejecutar el plan de guerra contra Trinity que queríamos, como el enemigo ha hecho retroceder por sí mismo su propia legitimidad, hemos ganado la capacidad de sumirlos en el caos durante aún más tiempo."

 ARI_story_event.9.t: "Alianza pública de estudiantes de Trinity por la solidaridad con Arius"
 ARI_story_event.9.d: "Ocurrió lo que esperábamos. Desde que comenzó a circular el rumor de que preparábamos una declaración de guerra contra la Escuela Secundaria Arius, entre los estudiantes de Trinity y los alemanes empezó a consolidarse un movimiento pacifista; y en el instante en que inició la actividad militar real, innumerables grupos—incluyendo estudiantes de primera línea de Trinity—alzaron la bandera del pacifismo y comenzaron a obstaculizar nuestra guerra.\n\nAdemás, también se han convertido en un problema los “ángeles” que, junto a sonidos de trompeta en el frente, interfieren con el desarrollo de la guerra; y guerrillas de Arius, que nadie sabe desde cuándo se mezclaron entre nosotros, han comenzado por fin a saquear nuestras líneas de suministro a gran escala.\n\nHa comenzado la peor guerra de Trinity. No porque el enemigo sea fuerte o el pueblo lo apoye, sino por el caos que nace de esta relación cercana y distante a la vez entre Arius y Trinity, que ahora se manifiesta ante nosotros."
# Operaciones militares de Trinity
 ARI_permanent_anti_trinity_military_operation: "Operación militar anti-Trinity semipermanente"
 ARI_permanent_anti_trinity_military_operation_trigger: "Ha comenzado la §Rguerra total§! de §YArius§!. Esta orden de operaciones, que se activa de forma permanente hasta que §Y[TRM.GetNameWithFlag]§! capitule, aumenta con el tiempo, de manera §Rcontinua§!, las §Ypenalizaciones§!. Al completar el enfoque §YCelebrar el Concilio de Arius§!, desaparecen las §Rpenalizaciones§! que aumentan §Rcontinuamente§!.\n\nLa §Yorganización de las divisiones§! disminuirá en cada ciclo de decisiones en §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§! hasta un máximo de §R-90%§!.\n\n"
 ARI_permanent_anti_trinity_military_operation_tt: "Modificadores de §Y$ARI_permanent_anti_trinity_military_operation$§!:"
 ARI_decision_permanent_anti_trinity_military_operation: "Fantasmas que avanzan"
 ARI_decision_permanent_anti_trinity_military_operation_desc: "Resuena nuestra tragedia de venganza, una que debe consumarse incluso si ardieran todas las Trinities… e incluso Arius. Es hora de que ellos también escuchen el grito que claman todos los estudiantes de Arius y la historia de la Escuela Secundaria Arius, caída en el pasado. Aunque fracasemos, les dejaremos la venganza clavada. De cualquier manera.\n\nOrganización actual de las divisiones: §R[?ARI.ARI_PATMO_idea_army_org_factor|%+1]§!\nLa §Yorganización de las divisiones§! disminuirá en cada ciclo de decisiones en §R[?ARI.ARI_PATMO_idea_monthly_army_org_factor_increase|%1]§! hasta un máximo de §R-90%§!."
