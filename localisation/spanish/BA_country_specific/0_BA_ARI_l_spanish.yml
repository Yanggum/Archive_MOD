 # Ideas
 BA_ARI_bitter_revanchism: "Revanchismo amargo"
 BA_ARI_bitter_revanchism_desc: "La Escuela Secundaria Arius es como una única máquina que se mueve con el propósito de vengarse de Trinity y Gehenna. Hace mucho tiempo, en el concilio que intentó unificar a Trinity en una sola entidad, Arius expresó su oposición basándose en razones y fundamentos legítimos. Sin embargo, lo que recibió no fue un debate justo, sino una invasión punitiva dirigida contra la escuela filial. No pudimos hacer frente al poder de una Trinity ya unificada y, al final, nos convertimos en ermitaños que se ocultaron en la oscuridad más profunda.\n\nUn día apareció un adulto, y creímos que sería quien nos salvaría. Unió a la Arius fragmentada y, con un apoyo entusiasta, ascendió al cargo de presidente del consejo estudiantil. Pero aquella fe se transformó en traición. Ese adulto trató a los estudiantes no como personas, sino como simples herramientas, y en el proceso innumerables vidas fueron sacrificadas. La ira y el odio hacia Trinity fueron inyectados profundamente en sus corazones, y uno a uno fuimos criados como armas asesinas."
 BA_ARI_bitter_revanchism_ns_1: "El extremo de la venganza"
 BA_ARI_bitter_revanchism_ns_1_desc: "La Escuela Secundaria Arius es como una única máquina que se mueve con el propósito de vengarse de Trinity y Gehenna. Hace mucho tiempo, en el concilio que intentó unificar a Trinity en una sola entidad, Arius expresó su oposición basándose en razones y fundamentos legítimos. Sin embargo, lo que recibió no fue un debate justo, sino una invasión punitiva dirigida contra la escuela filial. No pudimos hacer frente al poder de una Trinity ya unificada y, al final, nos convertimos en ermitaños que se ocultaron en la oscuridad más profunda.\n\nTras largos años, la Arius dividida se unificó, y nosotros, con orgullo, atravesamos el corazón de Trinity para recuperar nuestra posición legítima. En ese instante, nuestra venganza perdió su rumbo. ¿Odio hacia Gehenna? ¿Cómo odiar a quienes jamás hemos visto? Es cierto que hay muchos que detestan a Gehenna y que es evidente que ellos y nosotros no podemos coexistir, pero nuestra voz, sostenida por el odio a Trinity, prácticamente llegó a su fin en el momento en que ocupamos Edén, izamos nuestra bandera y pronunciamos discursos.\n\nSi llega el día en que, siguiendo los dedos espectrales de una venganza interminable, también derribemos a Gehenna, entonces tendremos que buscar un camino distinto al de la venganza."
 ARI_undisturbed_wareconomy: "Aislamiento total"
 ARI_wareconomy: "Aislamiento"
 ARI_pyeho_hakwon: "Academia en ruinas"
 ARI_pyeho_hakwon_desc: "El precio de huir abandonándolo todo para sacudirse la persecución de Trinity fue un frío montón de ruinas y apenas unos pocos estudiantes supervivientes."
 ARI_pyeho_hakwon_remove_tt: "\nSe elimina al cumplir la condición: más de §Y30§! fábricas\n"
 ARI_pyeho_hakwon_1: "Una luz entre las ruinas"
 ARI_pyeho_hakwon_1_desc: "El precio de huir abandonándolo todo para sacudirse la persecución de Trinity fue un frío montón de ruinas y apenas unos pocos estudiantes supervivientes.\n\nSin embargo, no nos rendimos a la desesperación entre las ruinas. Los estudiantes de Arius hacen girar generadores, fabrican munición y, decididos a vengarse, se esconden en silencio bajo la luz de un farol."
 ARI_german_defectors_1: "Legión Alemana Libre"
 ARI_german_defectors_2: "Exiliados antitrinity"
 ARI_acceptance_of_exiles_tt: "Se obtiene el espíritu nacional §YLegión Alemana Libre§!, y se crearán periódicamente unidades con §Y6 batallones de infantería§! y compañías de apoyo de §Yingenieros§!, §Yreconocimiento§! y §Yartillería§!.\n"
