## 이벤트
 ARI_reformist_event_chain.1.t: "Donde desapareció el aula"
 ARI_reformist_event_chain.1.d: "El Primer Arsenal Estatal, vibrando con el olor acre del humo y el estridente ruido del metal al ser tallado. Joumae Saori fruncía el ceño mientras seguía a Shirasu Azusa.\n\nHasta ahora, Saori no había logrado comprender el método de Azusa. Bajo el pretexto de una “reforma de la estructura económica”, los pequeños talleres armeros que sostenían los callejones del distrito autónomo de Arius quebraron, y los capitalistas de origen alemán —hasta entonces afines— se marcharon gritando. A ojos de Saori, no era una reforma, sino un acto de autolesión: cortar el último sustento que aún quedaba.\n\nPero en el momento en que se abrió la pesada puerta de hierro y vio lo que se desplegaba ante ella, sus pasos se detuvieron.\n\n\"...Esto es.\"\n\nLa escena de antaño —estudiantes en sótanos húmedos, en lo que llamaban “aulas de trabajo”, estampando munición a mano— había desaparecido sin dejar rastro. Sobre una enorme cinta transportadora, fusiles estandarizados salían sin descanso; y en otra sección, el horno exhalaba un aliento rojo mientras fundía y forjaba cañones. Ya no era un “taller de guerrilla”. Era, sin duda, una “fábrica del Estado”.\n\n\"...Con el método artesanal de antes había un límite.\"\n\nAzusa alzó la voz entre el estruendo. Su rostro estaba sereno, pero su mirada rebosaba convicción.\n\n\"Es triste que lo pequeño se rompa... pero para proteger algo más grande, no había otra opción. Esta fue la respuesta que encontré.\"\n\nSaori tomó un fusil recién producido. Pesado, frío y, sobre todo... nada tosco. Tiró del cerrojo. Un *clac* metálico, limpio y agradable, resonó.\n\n\"...Nada mal.\"\n\nDejó el arma y añadió, breve. Era la mayor aprobación que podía ofrecer. La época de recoger chatarra entre ruinas para improvisar armas había terminado. Azusa no había destruido en vano."
 ARI_reformist_event_chain.1.a: "\"Fue un resultado... mejor de lo que esperaba.\""

 ARI_reformist_event_chain.2.t: "Orquesta"
 # CASE 1: 관계도 낮음 - 화해의 제스처, 이해의 시작
 ARI_reformist_event_chain.2.da: "En el salón de una antigua catedral remodelada, la disonancia de la primera orquesta de Arius afinando llenaba el espacio. Shirasu Azusa, tensa, miraba de reojo a Joumae Saori sentada a su lado.\n\nSaori, con los brazos cruzados, observaba a las estudiantes del escenario como si estuviera evaluándolas. Para ella, un violín y un chelo probablemente parecían herramientas más pesadas e ineficientes que un arma.\n\n\"...¿Esto es lo que llamabas ‘la cultura de Arius’?\"\n\nAnte la pregunta seca de Saori, Azusa asintió apenas.\n\n\"Más que cultura... es terapia.\"\n\nLa batuta cortó el aire, y estalló la primera nota. Una melodía torpe, pero desesperada. No era un himno militar entrenado, ni un eslogan para avivar el odio. Era, simplemente, una onda pura de sonido. Saori estuvo a punto de chasquear la lengua, pero se detuvo: en el rostro de una estudiante tocando el violín vio una “concentración” que jamás había visto durante el entrenamiento de tiro.\n\nCerca del final, Saori soltó un pequeño suspiro y ajustó la postura.\n\n\"...Valor táctico: cero. Pero...\"\n\nSin mirar a Azusa, lo escupió como quien concede a regañadientes.\n\n\"A veces, oír este ruido en lugar de disparos no está mal. Solo esta vez, te sigo el juego.\""
 # CASE 2: 관계도 높음 - 공유하는 평온, 동료애
 ARI_reformist_event_chain.2.db: "Cuando empezó el segundo movimiento del concierto, el ambiente en el palco VIP era tan tranquilo que casi daba sueño. Azusa, en vez de juguetear con el programa, escuchaba la música con los ojos cerrados. Y a su lado, Saori también se había hundido en el asiento, aflojando por una vez su habitual vigilancia afilada.\n\n\"Qué curioso.\"\n\nMurmuró Saori en voz baja.\n\n\"Nosotras solo aprendimos que todo es vano. Y aun así, esas chicas pasaron meses desvelándose para crear ese sonido inútil.\"\n\"Sí. ...Tal vez sea hermoso precisamente porque es vano.\"\n\nAnte la respuesta de Azusa, Saori dejó escapar una risita. Antes habría sido una risa de burla; ahora era una risa claramente cómplice. Sus manos estaban llenas de callos y olían a pólvora, pero en ese instante, en vez de empuñar un arma, sostenían tranquilidad.\n\n\"Azusa.\"\n\"¿Eh?\"\n\"...No está mal. El Arius que hiciste.\"\n\nDentro de la melodía que avanzaba hacia el clímax, por un momento Saori llevaba el rostro de una espectadora común, y no el de una comandante."
 # CASE 3: 사오리 은퇴 (민간인) - 초청과 격려
 ARI_reformist_event_chain.2.dc: "Justo antes de que comenzara la función, se abrió la puerta del palco VIP. Pero quien entró no fue alguien con uniforme, sino Joumae Saori vestida como una civil cualquiera: chaqueta común, jeans, el tipo de ropa que se ve en todas partes.\n\n\"...Invitas y luego pones esa cara de sorpresa, señorita Primera Ministra.\"\n\nSaori, incómoda, se caló la gorra y se sentó junto a Azusa. Ya no era la jefa del ejército, pero para Azusa seguía siendo la senpai más difícil: el muro que tuvo que superar.\n\n\"Gracias por venir, Saori.\"\n\"A los desempleados se les pudre el tiempo. Además... tengo que vigilar qué estupideces dejó hechas mi sucesora, ¿no?\"\n\nCuando empezó la música, los ojos de Saori siguieron a las chicas del escenario. En lugar de instrucción de desfile, leían partituras; en lugar de bayonetas, tensaban arcos. Una escena que en sus tiempos habría sido inimaginable; más aún, una escena que ni siquiera estaba permitido imaginar.\n\nCuando terminó la pieza y estalló un aplauso ensordecedor, Saori no aplaudió. Se levantó en silencio.\n\n\"...Yo no habría podido hacerlo.\"\n\nLe dio un pequeño golpe en el hombro a Azusa y siguió de largo. La espalda de Saori ya no se veía tan enorme como antes. Pero, por primera vez, parecía más ligera que nunca."
 ARI_reformist_event_chain.2.a: "Parece que su ánimo ha mejorado."

 ARI_reformist_event_chain.3.t: "Disolución del Cuerpo Auxiliar de Trabajo"
 ARI_reformist_event_chain.3.d: "Ni siquiera se había secado la tinta de la orden de disolución. Joumae Saori, apoyada en la ventana del despacho, contemplaba la caravana de camiones que se llevaban al cuerpo ya desmantelado de regreso a sus hogares.\n\n\"...Sinceramente, fue inesperado.\"\n\nSaori habló sin apartar la vista.\n\n\"El Cuerpo Auxiliar de Trabajo es inhumano, sí. Pero en el Arius actual era el engranaje más eficiente. Incluso esos de tu facción reformista proponían ‘mantenerlo al menos hasta que termine la reconstrucción’. Y aun así, no pensé que fueras a ignorar toda oposición y forzar esta orden.\"\n\n\"Un país levantado sobre el sacrificio de alguien... al final solo engendra otro odio.\"\n\nAzusa respondió sin vacilar. Solo entonces Saori giró la cabeza para mirarla. Aun estando sumergida en el fango del poder, sus ojos seguían limpios, como los de una niña incapaz de negociar con el compromiso."
 ARI_reformist_event_chain.3.a: "\"Me alegra... que aún no hayas perdido ese ideal tan estúpido tuyo, Azusa.\""

 ARI_reformist_event_chain.4.t: "Lo inevitable"
 ARI_reformist_event_chain.4.d: "La luz roja de alarma en el cuartel general giraba sin descanso. Los informes urgentes del frente se transmitían por radio, pero Shirasu Azusa solo miraba, aturdida, el mapa de operaciones.\n\n\"...Quería detenerlo.\"\n\nLa voz de Azusa temblaba.\n\n\"Hice todo lo que pude. Convencí a las estudiantes de Trinity, limpié el pasado, intenté demostrar que ya no éramos ‘monstruos’. Pero... no sirvió de nada. Gehenna todavía nos llama terroristas, y nuestras estudiantes, o se asustan con sus voces... o se enfurecen.\"\n\nApretó con fuerza la mano sobre el mapa.\n\n\"¿Era inevitable? ¿Nosotras... solo podemos vivir si pasamos la vida peleando contra alguien?\"\n\nEntonces, Joumae Saori, que estaba a su lado, se acercó y puso una mano sobre el hombro de Azusa. Era un contacto pesado, firme.\n\n\"Azusa. Levanta la cabeza.\"\n\nSaori sostuvo la mirada vacilante de Azusa, sin apartarse.\n\n\"Tu esfuerzo por evitar la pelea no fue en vano. Gracias a eso, hoy podemos empuñar el arma por ‘supervivencia’, y no por ‘locura’. Con eso basta.\"\n\nSaori revisó su pistola al cinto y añadió, en voz baja:\n\n\"No cargues con culpa. Ensuciarme las manos con sangre es mi papel. Tú... solo asegúrate de que el lugar al que volvemos no se derrumbe.\""
 ARI_reformist_event_chain.4.a: "Se apretó el gatillo."

 ARI_reformist_event_chain.5.t: "Basta de retroceder"
 ARI_reformist_event_chain.5.d: "A altas horas de la noche, el sonido de pasos que merodeaban frente a la habitación privada de Saori se detuvo. Tras un largo silencio, en vez de reunir valor para tocar, Azusa habló como un murmullo que apenas cruzaba la puerta.\n\n\"...Lo siento.\"\n\nEra una disculpa. Una confesión por las palabras irrespetuosas cometidas en nombre de la reforma, por los abusos de sus partidarios que no supo contener, y por la culpa de haber huido como si le hubiera cargado todo el peso a Saori.\n\n\"Hubo opiniones de que debíamos derribarte. Claro que... lo impedí. Pero eso no borra mi culpa. Quería cambiarlo. Empecé porque quería darles arroz caliente, no pan mohoso... y aun así, cuanto más avanzo, más siento que me hundo en el barro.\"\n\nDel otro lado no hubo respuesta. Azusa bajó la cabeza, amargada. ¿Ya era demasiado tarde? Apoyó la frente en la pared y, como rendida, se dio la vuelta. Sí, ¿con qué cara pretendía consuelo ahora?\n\nPaso, paso. Ni siquiera había dado unos cuantos.\n\nCriiic—.\n\nSe oyó la puerta abrirse detrás de ella, y una mano áspera atrapó su brazo. Azusa se giró sobresaltada y vio a Saori en pijama, con el cabello revuelto.\n\n\"...No puedo dormir con tanto ruido.\"\n\nSaori gruñó con malhumor, pero no soltó el brazo.\n\n\"Entra. Te prepararé aunque sea un té.\"\n\nEse contacto tosco conservaba el mismo calor de antes, el que Azusa recordaba. Aquella noche, dentro de la puerta que había estado cerrada, las voces de ambas siguieron durante muchísimo tiempo: una conversación cuidadosa y desesperada, como recomponer fragmentos de un vaso roto."
 ARI_reformist_event_chain.5.a: "Esa noche fue larga."

 ARI_reformist_event_chain.6.t: "Instrucción de combate real – 1"
 ARI_reformist_event_chain.6.d: "La convocatoria, que tras el último encuentro había vuelto a sentirse distante, llegó de golpe. A las 2 de la madrugada, en el terminal personal de Azusa apareció el remitente: “Joumae Saori”. El contenido era una sola línea.\n\n'Al Campo de Entrenamiento 3. Ve armada.'\n\nShirasu Azusa, frotándose los párpados pesados, se dirigió al campo. Su cabeza estaba llena del ajuste presupuestario de mañana, de cartas de negociación para apaciguar a los conservadores, y de noticias sobre protestas de estudiantes de origen trinitario. Con cada paso, las botas resonaban en el pasillo vacío, pero en sus oídos solo zumbaba el ruido político.\n\nCuando llegó, el campo estaba sumido en una oscuridad total.\n\n\"¿Saori? Llegué. ¿Qué pasa? Si es un informe urgente...\"\n\n¡BANG—!!\n\nEn lugar de respuesta, algo rasgó la noche: un disparo real, sin aviso.\n\n\"¿Kgh?!\"\n\nAzusa se arrojó por instinto tras una cobertura. El piso de concreto donde estaba segundos antes quedó horriblemente astillado. Un escalofrío le recorrió la espalda. Y aun así, en ese mismo instante, por su mente pasó el “¿por qué?” junto con un nudo de pensamientos caóticos."
 ARI_reformist_event_chain.6.a: "\"¿Pero qué demonios...?\""

 ARI_reformist_event_chain.7.t: "Instrucción de combate real – 2"
 ARI_reformist_event_chain.7.d: "Paso, paso. En la oscuridad, Saori salió caminando con un fusil de entrenamiento apuntando.\n\n\"Reaccionas tarde. ¿Se te endureció la cabeza por pensar tonterías?\"\n\nSaori pateó hacia Azusa otro fusil que estaba en el suelo.\n\n\"Toma. Es entrenamiento real.\"\n\nAzusa apretó los labios y recogió el arma, y en ese instante ambos cañones escupieron fuego a la vez. El intercambio fue feroz, pero el cuerpo de Azusa ya no era el de antes. Incluso al apretar el gatillo, pensamientos inútiles —como el horario de mañana— le agarraban el tobillo.\n\n\"...Tienes demasiados pensamientos.\"\n\nAl final, la distancia se cerró, Saori golpeó el cañón para apartarlo y se metió por dentro. Un impacto sordo hizo que el mundo de Azusa se volteara. Cuando volvió en sí, estaba inmovilizada contra el suelo frío, y el cañón de Saori apuntaba a su entrecejo. Una derrota perfecta.\n\n\"Hah... hah...\"\n\nSaori guardó el arma mientras miraba a Azusa, que jadeaba.\n\n\"Estás más débil que antes.\"\n\nEn lugar de tenderle la mano, Saori la reprendió con frialdad:\n\n\"Ni siquiera puedes conmigo, y aun así querías cargar tú sola con todo el peso del mundo. Ubícate, Azusa.\"\n\nPodría sonar a reproche, pero Azusa lo sintió distinto: una promesa tosca pero segura, a su manera—si eres débil, yo te protegeré. Abrazándose el hombro dolorido, Azusa sintió, paradójicamente, que su carga se aligeraba."
 ARI_reformist_event_chain.7.a: "\"Una vez más... te lo pido.\""

 ARI_reformist_event_chain.8.t: "Solo una vez – 1"
 ARI_reformist_event_chain.8.d: "En el despacho a las 3 de la madrugada, Joumae Saori arrojó sobre la mesa —casi como si lo lanzara— la “4.ª propuesta de ajuste presupuestario” que Shirasu Azusa le había presentado.\n\n\"Rechazado. ¿Estás loca? ¿Reducir suministros militares para pasarlos a presupuesto educativo? Explícalo lógicamente. ¿Cómo se supone que eso ayuda a sobrevivir?\"\n\nEl muro de Saori era inamovible. Azusa abrió la boca y la cerró otra vez. La persuasión racional llevaba tres horas fracasando, y tampoco era alguien a quien pudieras amenazar o sobornar. En la cabeza de Azusa, todas las tácticas quedaron marcadas como “fracaso”. Solo quedaba una carta.\n\nSudando frío, Azusa recordó una frase de una novela romántica que había pedido prestada en Trinity, y un “truco” que Urawa Hanako le enseñó entre bromas. Se encendió una alarma interna: “si hago esto, quizá muera socialmente”. Pero ya no había marcha atrás.\n\n\"......\"\n\nAzusa se levantó, se acercó al lado de Saori, y con una mano temblorosa agarró, apenas, el borde de la manga del uniforme de Saori."
 ARI_reformist_event_chain.8.a: "..."

 ARI_reformist_event_chain.9.t: "Solo una vez – 2"
 ARI_reformist_event_chain.9.d: "\"...Saori... ¿hermana mayor?\"\n\nSu voz era pequeña, y el final temblaba violentamente por una vergüenza casi letal. Azusa intentó mirarla hacia arriba, como decía el libro, levantando la mirada... pero la humillación le ganó, y sus ojos vagaron por el aire.\n\n\"E-esta... solo esta vez... ¿no se puede...? ...¿sí?\"\n\nSilencio. Un silencio más perfecto que el de unas ruinas barridas por un bombardeo.\n\nSaori detuvo en el aire la mano con la que iba a recoger documentos de aprobación; se había quedado rígida, como quien se topa con una criatura desconocida. Sus ojos iban y venían entre los dedos temblorosos de Azusa, sus orejas enrojecidas, y esa extraña coletilla que acababa de oír.\n\n\"...Azusa.\"\n\"......\"\n\"...¿Te duele algo? ¿Llamo al médico?\"\n\"No... e-es que... por favor...\"\n\nCuando Azusa bajó la cabeza como quien busca un agujero para meterse, Saori se pasó una mano por la cara y soltó un suspiro largo y profundo. Sintió que aquello era más difícil de manejar que cualquier crisis en el campo de batalla.\n\n\"...Hah. Está bien. Ya entendí.\"\n\nSaori firmó los papeles de forma brusca. Sin revisarlos siquiera: una “rendición” pura.\n\n\"Toma. Y no vuelvas a hacer delante de mí una... cosa tan rara. Es malo para el corazón.\"\n\nAzusa arrebató los documentos como si los robara y salió huyendo del despacho. Incluso después de que la puerta se cerró, Saori se quedó un buen rato mirando en blanco el borde de su propia manga."
 ARI_reformist_event_chain.9.a: "Es un golpe letal. Para Azusa."

 ARI_reformist_event_chain.10.t: "La tormenta que se acerca"
 ARI_reformist_event_chain.10.d: "En las calles donde se levantó el gobierno de puño de hierro de Arius, no llegó la paz, sino un “ruido” insoportable. La “libertad” que prometió el gobierno de Shirasu Azusa les quitó el bozal a quienes estaban oprimidos, pero lo que brotó de sus bocas no fueron palabras de gratitud, sino una avalancha de exigencias. Estudiantes con el uniforme de la antigua Trinity Comprehensive se reúnen en la plaza de la catedral destruida, organizando una sentada para exigir la “restauración del sistema administrativo del Tea Party” y la “devolución de los jardines de té confiscados”. Detrás de ellas, antiguos burócratas del Tea Party, con megáfonos, denuncian la incompetencia del gobierno e intentan su regreso político.\n\nEl caos no se limita al interior de la academia. En la zona industrial de Poznań, trabajadoras y trabajadores de origen polaco marchan agitando banderas y exigiendo mejoras de trato; en Silesia, alemanes reparten panfletos reclamando autonomía, acusando a Arius de “actuar como fuerzas de ocupación”.\n\nAún no vuelan cócteles molotov ni suenan disparos. Pero el nivel de decibelios de la plaza—donde se enredan lenguas, consignas y deseos distintos—crece día tras día. Saben demasiado bien que el gobierno no puede reprimirlos, y por eso golpean con más audacia las puertas del edificio administrativo."
 ARI_reformist_event_chain.10.a: "¡Hay que resolver la situación como sea!"

 ARI_reformist_event_chain.11.t: "Medidas preventivas"
 ARI_reformist_event_chain.11.d: "Cuando Shirasu Azusa llegó a trabajar, el contenido del “informe diario de seguridad” sobre su escritorio era extrañamente pacífico. Las protestas masivas anunciadas hasta ayer en Berlín, Poznań y el antiguo distrito autónomo de Trinity habían sido canceladas o reducidas como si nada.\n\n\"...¿Qué pasó aquí?\"\n\nA la pregunta en voz baja de Azusa respondió Joumae Saori, sentada en el sofá, lustrando sus botas.\n\n\"Limpié un poco.\"\n\nLa explicación de Saori fue breve y seca. La noche anterior, reunió a la reserva del ejército de Arius leal a ella. Les colocó un brazalete improvisado con el nombre de “fuerza de mantenimiento del orden”, y asaltó los escondites de los agitadores que lideraban las protestas y de los radicales trinitarios: los detuvo a todos.\n\n\"¿Metiste fuerzas militares? ¡Eso es prácticamente una ley marcial!\"\n\"No es el ejército. Es la ‘fuerza de mantenimiento del orden’. En los papeles, no hay ningún problema.\"\n\nSaori contestó con calma y dejó las botas que estaba limpiando.\n\n\"No solo tenían megáfonos. También había molotovs y explosivos caseros. Si hubieras seguido el ‘procedimiento legal’ que dices, las noticias de esta mañana habrían sido una transmisión en directo de un incendio. ...Yo me comeré los insultos. Tú quédate con el resultado.\"\n\nAzusa se mordió el labio. Lo de Saori era, sin duda, un acto peligroso. Pero también era cierto que había salvado al gobierno de Azusa de una crisis. Ahora debía elegir: ¿tolerar esta “paz sucia”, o arriesgarse para mantener los principios?"
 ARI_reformist_event_chain.11.a: "\"Buen trabajo. ...Era necesario.\""
 ARI_reformist_event_chain.11.b: "\"Libera a los detenidos y retira a las fuerzas.\""

 ARI_reformist_event_chain.12.t: "El chirrido del engranaje"
 ARI_reformist_event_chain.12.d: "Los disparos se detuvieron, pero el ruido de las fábricas también se apagó. Desde los complejos industriales de Berlín hasta los puertos de Prusia Oriental, una forma extraña de “silencio” empieza a devorar el territorio de Arius.\n\nLos trabajadores alemanes no declararon huelga. Van a trabajar puntuales y se colocan en sus puestos. Solo que, si se les cae una herramienta, tardan treinta minutos en recogerla; y si una máquina se avería, se quedan de pie todo el día alegando que no hay piezas. Los dueños de tiendas niegan con la cabeza ante clientes con acento trinitario diciendo que “ya se agotó todo”, pero por la puerta trasera entregan pan y leche a los vecinos que hablan alemán.\n\nNo es una orden organizada. Es una reacción colectiva de rechazo de los alemanes a la “reforma pro-Trinity” del gobierno de Azusa. Sienten que sus empleos están amenazados por los trinitarios, y se resisten en silencio a la política de aceptar como vecinos a sus agresores cuando ni siquiera han sanado las heridas de la Gran Transición.\n\nEste gigantesco sabotaje pasivo está obstruyendo lentamente las venas del Estado. La producción se desplomó, y las órdenes administrativas están siendo ignoradas en la base. Debemos resolver este chirrido como sea."
 ARI_reformist_event_chain.12.a: "Lo primero es calmar la ira de los alemanes."
 ARI_reformist_event_chain.12.b: "Aprovechemos para abolir la discriminación contra los trinitarios en el empleo."

 ARI_reformist_event_chain.13.t: "Manifestantes progobierno"
 ARI_reformist_event_chain.13.d: "Frente a los gritos de quienes ocupaban la plaza del Edén y la catedral de Trinity, empezó a levantarse una nueva ola. En sus banderas no había símbolos étnicos ni consignas religiosas, sino únicamente el eslogan de “reconciliación y reconstrucción” del gobierno de Azusa, escrito con sobriedad. La composición de estos “manifestantes progobierno” es extrañamente diversa: un jefe de fábrica alemán cansado del sabotaje pasivo y que solo quiere volver al trabajo; una estudiante común de Trinity harta de la cultura autoritaria del antiguo Tea Party; y ciudadanos que apoyan el cambio en Arius.\n\nSe enfrentan a los discursos de odio de los extremistas gritando “alternativas realistas” y “Estado de derecho”. Son personas que aceptaron que el centrismo pragmático de Azusa no es una “tibia concesión”, sino el único rompeolas capaz de evitar el desastre.\n\n\"¡No queremos fantasmas del pasado, queremos el pan de hoy!\"\n\nEste apoyo espontáneo es un aliado inesperado para el gobierno. Ahora debemos decidir: ¿financiarlos y organizarlos para convertirlos en vanguardia de la reforma, o mantener distancia para proteger su pureza?"
 ARI_reformist_event_chain.13.a: "No podemos dejar pasar esta corriente. ¡Organícenlos!"
 ARI_reformist_event_chain.13.b: "No intervengan."

 ARI_reformist_event_chain.14.t: "Mover el escritorio"
 ARI_reformist_event_chain.14.d: "Cuando Shirasu Azusa abrió la puerta del despacho del presidente del consejo estudiantil y entró, Joumae Saori preguntó con sequedad, sin apartar la vista de los documentos.\n\n\"Ya es tu tercera visita solo hoy. ¿En la sede reformista no tienen teléfono?\"\n\nAzusa tomó aire y dejó sobre el escritorio una gruesa carpeta de aprobaciones. De la sede reformista al despacho había quince minutos a pie. Y encima, el trayecto obligaba a pasar dos controles de seguridad.\n\n\"Es ineficiente.\"\n\nAzusa lo dijo con firmeza.\n\n\"La mano de obra, el tiempo, y hasta el riesgo de escuchas o robo al trasladar documentos... tácticamente, esta estructura administrativa dividida es un suspenso. Así que, Saori-unnie... no, presidenta. Te propongo algo.\"\n\nSaori alzó por fin la mirada.\n\n\"Unifiquemos las oficinas. Usaré como mi despacho la sala de reuniones de operaciones vacía del segundo piso de este edificio.\"\n\nNo era un simple cambio de sala. Era una declaración de unión política: Azusa, líder reformista, se adentraba en el espacio de Saori, símbolo de los conservadores. Tras un silencio breve, Saori hizo girar el bolígrafo y respondió con indiferencia:\n\n\"...Haz lo que quieras. Pero no quiero que mi despacho se vuelva ruidoso.\"\n\n\"No te preocupes. Las paredes son gruesas.\"\n\nEl rostro de Azusa no cambió, pero al irse, sus pasos parecían más ligeros que al llegar."
 ARI_reformist_event_chain.14.a: "Ya no hace falta caminar 15 minutos para recibir una aprobación."

 ARI_reformist_event_chain.15.t: "Duelo 2"
 ARI_reformist_event_chain.15.d: "¡BANG—! ¡CLANG—!\n\nLo que rasgó el silencio del campo de entrenamiento fue el filo del metal y una respiración áspera. Shirasu Azusa ya no dudaba como antes. Se coló en el ángulo muerto de Saori y se lanzó con un cuchillo de entrenamiento empuñado en reversa. El movimiento era limpio, sin desperdicio, e incluso mezclaba tácticas irregulares que había aprendido en Trinity.\n\n'La tengo.'\n\nJusto cuando Azusa iba a asestar el golpe decisivo aprovechando que el centro de gravedad de Saori vaciló...\n\n\"...Monótono.\"\n\nLa voz de Saori le rozó el oído. En vez de esquivar, Saori se metió por dentro del ataque y golpeó el pecho de Azusa con el hombro. El impacto le cortó el aliento; el cuerpo de Azusa se elevó y, al instante siguiente, cayó estrellado contra el suelo frío.\n\n\"Kgh... hah... hah...\"\n\nLa vista temblaba. Cuando recuperó la conciencia, el cañón de Saori apuntaba exactamente al corazón de Azusa. Otra derrota total.\n\nPero Saori guardó el arma y le tendió la mano.\n\n\"Mejor que antes. Al menos esta vez... me hiciste sudar.\"\n\nEn la frente de Saori corrían gotitas de sudor. Era una condecoración silenciosa: el reconocimiento de que Azusa ya no era una “niña a proteger”, sino una “guerrera a vigilar”.\n\n\"Levántate, Azusa. Hagamos otra. Ese estilo raro tuyo... es bastante interesante.\""
 ARI_reformist_event_chain.15.a: "El muro era alto, pero no estaba fuera de alcance."

 ARI_reformist_event_chain.16.t: "Hora de lanzar un hechizo"
 ARI_reformist_event_chain.16.d: "\"No te muevas, líder. Te pico el ojo.\"\n\"...Ugh. ¿De verdad tenemos que hacer esto?\"\n\nJoumae Saori tenía los ojos fuertemente cerrados, tensa, como una niña en el sillón del dentista. Frente a ella, Shirasu Azusa sostenía con solemnidad una paleta de tonos pastel y brochas.\n\n\"El maquillaje que usas mientras haces de presidenta es demasiado ‘bélico’. Eso no es maquillaje: se parece más a pintura de camuflaje.\"\n\nAzusa, recordando las técnicas que le enseñaron Hanako y Hifumi, aplicó un rubor coral suave sobre la mejilla de Saori. El rostro frío y pálido de Saori empezó a llenarse de vida. Incluso sobre la piel áspera, una base suave se asentó.\n\n\"...Listo. Abre los ojos.\"\n\nSaori miró el espejo con cautela. Allí no estaba la “dictadora de Arius” ni la “máquina de matar”. Solo una chica normal, un poco tímida y un poco incómoda, que se miraba a sí misma.\n\n\"Esto es... extraño.\"\n\"Es lindo. Hifumi lo dijo: lo lindo salva al mundo.\"\n\nSaori carraspeó mirando su reflejo. El enrojecimiento de sus orejas quizá no era solo por el rubor. Murmuró muy bajito:\n\n\"...No está mal. A veces.\""
 ARI_reformist_event_chain.16.a: "Aun así, parecía que no lo aceptaría una segunda vez."

 ARI_reformist_event_chain.17.t: "Veredicto final para los colaboracionistas del Tea Party"
 ARI_reformist_event_chain.17.d: "En la última fila de la sala, Joumae Saori observaba el juicio con los brazos cruzados. En el banquillo se sentaban antiguos burócratas de Trinity que, durante la ocupación, colaboraron con el Tea Party y encabezaron la guerra contra Arius.\n\nAl principio, Saori desconfiaba del plan de Azusa de “independencia judicial”. ¿Para qué hacen falta teorías legales complejas y pruebas para eliminar al enemigo? La ejecución sumaria es mucho más eficiente y barata. Así fue como ella aprendió a vivir.\n\n\"Se condena a todos los acusados a 20 años de prisión y trabajos forzados.\"\n\nCuando cayó la sentencia severa del juez, el tribunal quedó en silencio por un instante. Saori, esperando un motín, puso la mano sobre su pistola de defensa personal. Pero... lo que salió de las bocas de los ciudadanos trinitarios que llenaban la sala no fueron gritos ni abucheos.\n\n\"...\"\n\"...Es el veredicto de Arius, supongo.\"\n\nEra “aceptación”. No por miedo al cañón de Arius, sino por la rendición ante una “justicia” que imponía un castigo acorde al crimen cometido. El castigo no venía de una cuchilla arbitraria, sino de un sistema social: en vez de rebeldía, sembraba alivio."
 ARI_reformist_event_chain.17.a: "\"...Lo admito. Tu método es más eficiente.\""

