 ARI_event.1.b: "Así como está"

 ARI_event.2.t: "Segundo concilio"
 ARI_event.2.d: "Como resultado del \"justo\" Segundo Concilio, convocado para enmendar el anterior Primer Concilio que habíamos negado, la doctrina trinitaria fue rechazada y todas las facciones fuera del arrianismo fueron designadas como herejía."
 ARI_event.2.a: "Perfecto."

 ARI_event.3.t: "Deserción de estudiantes de Arius"
 ARI_event.3.d: "Mientras el Escuadrón Arius se ausentó brevemente, una cantidad considerable de miembros de la Basílica desapareció. Parece obra de la antigua líder que desapareció de repente, Beatrice."
 ARI_event.3.a: "Madame, así que estaba aquí."

 ARI_event.4.t: "Escuadrón atacado"
 ARI_event.4.d: "Al Escuadrón Arius, que regresó tras romper el cerco de Beatrice, lo atacó un grupo que parecía ser de estudiantes de Arius. Sin duda parecen estar relacionados con Beatrice y, al parecer, están apuntando a Hakari Atsuko. Su objetivo es claramente asegurar la Sangre Real.\n\nAdemás, se estima que una parte considerable de figuras importantes dentro de la rama Arius está recibiendo órdenes de Beatrice y siguiéndolas.\n\nNo es posible determinar cuán profundamente han alcanzado las manos de Beatrice dentro de la rama Arius."
 ARI_event.4.d_2: "El Escuadrón Arius lleva mucho tiempo huyendo del grupo de persecución de Beatrice. Aunque, gracias a que se han revelado las atrocidades de Beatrice, muchos estudiantes de Arius nos están brindando apoyo, las intrigas de Beatrice, la constante incitación al caos y la repetición de la discordia interna están agotando tanto al escuadrón como a todos los estudiantes de Arius.\n\nAhora, nadie dentro de la rama Arius puede confiar en nadie. La influencia de Beatrice se debilita conforme pasa el tiempo, pero a este paso, la rama Arius será derrotada antes de que su influencia desaparezca por completo..."
 ARI_event.4.d_3: "La rama Arius ya no podrá soportar más la lucha interna... Falta de suministros, falta de abastecimiento, falta de todo. Incluso los estudiantes de Arius que no siguieron a Beatrice nos están dando la espalda. Todo se está derrumbando.\n\nDentro de la rama Arius aún se desconfían y se despedazan entre sí. Ahora, aunque sea para impedir la ruina de la rama... quizá tengamos que reconocer la victoria de Beatrice..."
 ARI_event.4.a: "No era esto lo que quería."
 ARI_event.4.b: "..."

 ARI_event.5.t: "Epílogo, y un nuevo comienzo"
 ARI_event.5.d: "La rama Arius. Un lugar donde se mezclan únicamente odio, ira, desprecio y repulsión.\nAntes de que Trinity se convirtiera en una academia integral, era una rama que, aunque interpretaba las escrituras de forma un poco distinta a las demás facciones de Trinity, no era tan diferente en esencia. Sin embargo, se convirtió en una academia desdichada: al oponerse a la idea de fusionar las ramas en el Primer Concilio para formar una gran academia, terminó siendo señalada como herejía.\nAl arrebatarles incluso su capilla, se marcharon a un lugar que ni siquiera la presidenta del Consejo Estudiantil General conocía, y atravesaron una larga serie de guerras internas. En medio de todo eso, Beatrice llegó a Arius y, usando las emociones negativas de las estudiantes, las dominó con mentiras y engaños. Incluso tras el fin de la guerra civil, su dominio continuó.\nEl \"adulto\" dominó y explotó a los \"niños\", y se los devoró.\n\nY entonces, la rama Arius, al igual que las demás academias, sufrió la Gran Transición.\nBeatrice abandonó la academia justo después de la Gran Transición y regresó a Gematria, pero las estudiantes de la rama Arius, incapaces de obtener noticias del exterior, no pudieron comprender bien la situación.\n\nSin embargo, las estudiantes de Arius no tuvieron más remedio que notar que Beatrice no aparecía desde hacía mucho tiempo, y el Escuadrón Arius se dio cuenta de ello más rápido que nadie.\n\nPero... si no está Madame, ¿qué podemos hacer?"
 ARI_event.5.a: "Nos hemos perdido."

 ARI_event.6.t: "Una carretera ruidosa"
 ARI_event.6.d: "No pasó mucho tiempo desde que las chicas y sus compañeras, tras abandonar Arius, comenzaron a explorar este lugar llamado \"Danzig\", cuando, vestidas con ropa de civil acorde a la época, se acercaron a la multitud alborotada que armaba un gran escándalo en Danzig. Un hombre de barba larga, que parecía el líder, la miró con una expresión de \"¿a qué vienes?\".\n\n\"¿Qué sucede? ¿Por qué se han reunido en grupo y están tan enojados?\"\n\"¿No lo ves? ¡Estamos en huelga general! ¡Porque no nos pagan lo que corresponde por el trabajo que hemos hecho!\"\n\nLa chica lo miró sin expresión. Si era como había leído en la biblioteca, ese grupo serían un \"sindicato\". Un colectivo que exige los derechos y la compensación justa de los trabajadores. Con una mirada vacía, la chica lo observó en silencio.\n\n\"¿La compensación que desean es vivir como seres humanos?\"\n\"Sí. ¡Desde que declararon algún tipo de estado de emergencia nacional, nos han estado reteniendo los salarios hasta ahora!\"\n\n\"Entonces quítate de en medio, mocosa.\"\nEl hombre dijo eso mientras la empujaba con una mano.\n\nVanidad de vanidades... vivir como seres humanos, qué cosa tan ridícula. En circunstancias normales no habría retrocedido ni en una situación así, pero ahora existía la orden de no provocar a los locales en la medida de lo posible. La chica no tomó ninguna medida posterior. Ahora debía cumplir la siguiente misión."
 ARI_event.6.a: "Aún... no lo sé."

 ARI_event.7.t: "El hombre de traje"
 ARI_event.7.d: "Tras iniciarse la exploración de \"Danzig\", las estudiantes de Arius vieron a un hombre de traje dando un discurso en la plaza. El hombre hablaba con un tono casi de grito.\n\nCuando terminó el discurso, las estudiantes se acercaron al hombre y le hicieron algunas preguntas.\n\n\"¿Con qué propósito está dando este discurso?\"\n\"Hmm... por la forma en que van vestidos, ¿ustedes también vienen de algún lugar llamado Trinity o algo así?\"\nCuando ese nombre maldito, Trinity, salió de su boca, las estudiantes de Arius quedaron desconcertadas.\n\n\"Por su reacción, parece que no. Bien. Entonces puedo decírselo. Reuniré a los alemanes y levantaré una patria para el pueblo alemán.\"\n\"¿La... patria del pueblo alemán?\"\n\"Sí. Apenas desaparecieron esos malditos polacos estaba contento, ¡y resulta que Alemania fue destruida por unos tipos raros llamados Trinity! ¡Maldita sea!\"\nEl hombre, presa de la ira, se desahogó por un momento contra el vacío. Al ver esa actitud, las estudiantes de Arius cayeron en una profunda reflexión."
 ARI_event.7.a: "¿Se parece... a nosotros?"

 ARI_event.8.t: "La rendición de Hakari Atsuko"
 ARI_event.8.d: "Hoy, a las 2:00 a. m., Hakari Atsuko decidió rendirse ante Beatrice y alzar la bandera blanca, declarando que resistir más no tiene sentido.\n\nJusto después de su rendición, las estudiantes de la rama que seguían a Beatrice se retiraron todas, y el Escuadrón Arius pudo volver al nivel superior de la rama y reanudar el trabajo... con una sola excepción."
 ARI_event.8.a: "..."

 ARI_event.9.t: "La exigencia de sumisión de Beatrice"
 ARI_event.9.d: ""
 ARI_event.9.a: "¡Ya no te seguiremos!"
 ARI_event.9.b: "Bienvenida de vuelta, Madame."

 ARI_event.10.t: "La retirada del Escuadrón Arius"
 ARI_event.10.d: "Debido al ataque instigado por Beatrice, el Escuadrón Arius sufrió graves daños y no tuvo más opción que retirarse, entregando a Atsuko.\n\nLas estudiantes que obedecían las órdenes de Beatrice abandonaron la rama y se unieron a las fuerzas de Madame, por lo que el Escuadrón Arius pudo volver a subir al nivel superior de la rama."
 ARI_event.10.a: "...!"

 ARI_event.11.t: "Explota el distrito urbano de Edén"
 ARI_event.11.d: "Se ha producido un enorme accidente por explosión, presuntamente por un fallo en el transporte de sustancias químicas, en Edén, el corazón de Trinity."
 ARI_event.11.a: "No es una buena señal."

 ARI_event.12.t: "Ciudadanos desaparecidos"
 ARI_event.12.d: "El Departamento de Justicia Detectó que el número de ciudadanos en la región de Trinity ha disminuido de forma evidente."
 ARI_event.12.a: "Han salido de nuestra academia."

 ARI_event.13.t: "Resistencia en aumento"
 ARI_event.13.d: "Ha llegado a la Tea Party un reporte de que los ciudadanos parecen estar mostrando movimientos sospechosos."
 ARI_event.13.a: "Es peligroso."

 ARI_event.14.t: "Operación de inteligencia descubierta"
 ARI_event.14.d: "Parece que Trinity ha rastreado la cola de nuestro equipo operativo, que está llevando a cabo la infiltración en Trinity. Si seguimos adelante con la operación tal como está, es seguro que Trinity nos invadirá de inmediato, así que parece que debemos suspender la operación por un tiempo."
 ARI_event.14.a: "Habrá que mantener perfil bajo por un tiempo."

 ARI_event.15.t: "Operación de inteligencia de la rama Arius"
 ARI_event.15.d: "Hoy ha llegado a la Tea Party un informe increíble: que la operación de inteligencia contra la Academia Integral de Trinity se originó en la rama Arius, que en el pasado huyó de nosotros. Según este informe, se estima que la rama Arius ha planeado su venganza contra Trinity desde antes de la Gran Transición, y que, tras la Gran Transición, ha aprovechado la ansiedad de nuestra academia para intensificar el caos."
 ARI_event.15.a: "\"Hoy, Trinity ha sido atacada.\""

 ARI_event.16.t: "El destino de la rama Arius"
 ARI_event.16.d: "Tras la larga noche, toda la influencia de la rama Arius en Alemania ha sido eliminada. Ahora debemos decidir el trato hacia las estudiantes de Arius. Han contribuido a la restauración de Alemania, así que podemos elegir entre crear un distrito autónomo para ellas, o eliminarlas por el bien de la historia alemana."
 ARI_event.16.a: "Reorganicen Danzig como un distrito autónomo de Arius."
 ARI_event.16.b: "Eliminen al Escuadrón Arius."

 ARI_event.17.t: "Traslado de la capital"
 ARI_event.17.d: "Hemos logrado levantarnos tras una larga persecución, derribar a la detestable Trinity y proclamar la Academia Integral de Arius. A medida que la rama Arius se reorganiza como una gran academia integral, ha surgido la opinión de trasladar la capital de Arius."
 ARI_event.17.a: "Edén."
 ARI_event.17.b: "¿Hace falta moverla?"

 ARI_event.18.t: "Tribunal militar de Berlín: Tea Party"
 ARI_event.18.d: "Después de haber recibido la rendición de Trinity, comenzó el Tribunal Militar de Berlín cuando su capital, Edén, fue renombrada con su antiguo nombre: Berlín. Los primeros en ser juzgados son la Tea Party, el liderazgo de Trinity. Como dirección de la Academia Integral de Trinity, fueron siempre nuestros enemigos durante nuestra larga guerra."
 ARI_event.18.a: "¡Cuélguenlos!"
 ARI_event.18.b: "Les dictaré cadena perpetua."

 ARI_event.19.t: "Tribunal militar de Berlín: clubes"
 ARI_event.19.d: "El segundo juicio recayó sobre los clubes que componían la Academia Integral de Trinity. La mayoría cooperó activamente con el régimen de Trinity y cumplió un papel de apoyo a la conducción de la guerra de la academia."
 ARI_event.19.a: "Fusilen a los responsables y arréstenlos a todos."
 ARI_event.19.b: "Detengan a los responsables y reeduquen a los miembros."

 ARI_event.20.t: "Tribunal militar de Berlín: estudiantes"
 ARI_event.20.d: "El tercer juicio recayó sobre las estudiantes comunes de la Academia Integral de Trinity. En general fueron neutrales en la conducción de la guerra, pero tienen responsabilidad por haber defendido al régimen de Trinity y haber tolerado la guerra."
 ARI_event.20.a: "Ejecuten o encarcelen a todos los colaboradores."
 ARI_event.20.b: "Acepten activamente las denuncias internas."
 ARI_event.20.c: "Firmo la solución final."

 ARI_event.21.t: "Tribunal militar de Berlín: el pueblo alemán"
 ARI_event.21.d: "El cuarto juicio, por incómodo que sea, recayó sobre el pueblo alemán. La mayoría sentía aversión hacia Trinity, pero tras la llegada al poder de Misono Mika, muchos fueron agitados por el falso nacionalsocialismo que el liderazgo de Trinity sacó a relucir, y comenzaron a apoyar al régimen de Trinity."
 ARI_event.21.a: "...Arresten a todos los traidores."
 ARI_event.21.b: "...Hagamos como si nada hubiera pasado."

 ARI_event.22.t: "Fin de los tribunales militares"
 ARI_event.22.d: "Tras el último gran tribunal militar, la mayoría de los juicios militares ha concluido, dejando solo algunos juicios menores. Durante un tiempo, el tribunal militar seguirá operando, pero el número de acusados disminuirá de forma evidente en comparación con hace unos días."

 ARI_event.24.t: "Hallazgo de $ARI_hakari_atsuko$"
 ARI_event.24.d: "En una ciudad cercana a Arius, $ARI_hakari_atsuko$ regresó junto con estudiantes de la rama Arius, desplomada. Las estudiantes que la trajeron dicen que la encontraron caída durante una patrulla rutinaria.\n\nTras despertar, $ARI_hakari_atsuko$ afirmó que fue utilizada en los experimentos de Madame. Dice que no sabe cómo ocurrió, pero abrió los ojos y despertó en una iglesia en ruinas, y que, al huir hacia la rama Arius, se desplomó."
 ARI_event.24.a: "¡Beatrice...!"

 ARI_event.25.t: "Señales de invasión de Trinity"
 ARI_event.25.d: "Parece que han descubierto nuestra operación política contra Trinity. La Academia Integral de Trinity ha empezado a desplegar tropas hacia nuestra rama y pronto lanzará una invasión contra nosotros.\n\nTodas las estudiantes de la rama Arius están listas para ser desplegadas en la santa guerra contra Trinity."
 ARI_event.25.a: "¡Prepárense para el combate!"

 ARI_event.26.t: "Veredicto final"
 ARI_event.26.d: "El gran juicio público que comenzó tras la victoria de Arius sobre Trinity terminó, al final, con el veredicto de la ejecución de todo el liderazgo de Trinity y el servicio perpetuo de todas las estudiantes de Trinity.\n\nLa enorme represión de Trinity contra la rama Arius queda ahora concluida para siempre, y haremos que esos bastardos de Trinity no vuelvan a levantarse jamás."
 ARI_event.26.a: "Es una gran victoria."

 ARI_event.27.t: "Contacto con otro mundo"
 ARI_event.27.d: "Unos individuos que se presentan como la rama Arius nos han propuesto que, cuando estalle la guerra entre Trinity y Arius, participemos en ella.\n\nSegún ellos, Arius se ha infiltrado bastante profundamente en la sociedad de Trinity, y mencionan repetidamente una gran lucha contra Trinity."
 ARI_event.27.a: "Bien, probemos una vez."
 ARI_event.27.b: "No podemos meternos en algo tan peligroso."

 ARI_event.28.t: "Aceptación de Polonia"
 ARI_event.28.d: "El gobierno polaco ha aceptado este acuerdo realizado en secreto, y Polonia participará ayudándonos cuando estalle la guerra."
 ARI_event.28.a: "Bien."

 ARI_event.29.t: "Rechazo de Polonia"
 ARI_event.29.d: "El gobierno polaco rechazó el tratado alegando que era demasiado peligroso y que no conocía bien a Arius."
 ARI_event.29.a: "Ya veo."

 ARI_event.30.t: "Arius entra en la guerra anti-Trinity"
 ARI_event.30.d: "Arius, con quien firmamos un tratado, ha entrado en guerra contra Trinity, así que estamos listos para apoyar a Arius y preparar una ofensiva anti-Trinity."
 ARI_event.30.a: "¡Es la guerra!"

 ARI_event.31.t: "Cumplimiento del tratado de Polonia"
 ARI_event.31.d: "Polonia, con quien firmamos un tratado, decidió unirse a nosotros en la santa guerra anti-Trinity. ¡Ha comenzado la guerra final para derribar a Trinity!"
 ARI_event.31.a: "¡Es la guerra!"

 ARI_event.32.t: "Exigencia territorial de Polonia"
 ARI_event.32.d: "Después de que la guerra contra Trinity terminara y, en el Segundo Concilio, se decidiera la anexión de los países colaboradores de Arius, Polonia exigió, como precio por su participación en la guerra, la devolución de los territorios polacos anteriores a la Gran Transición."
 ARI_event.32.a: "Es un pago justo."
 ARI_event.32.b: "Propongan ceder el territorio del sur a cambio de excluir Gdansk"
 ARI_event.32.c: "No."

 ARI_event.33.t: "Devolución territorial de Arius"
 ARI_event.33.d: "Nuestro gobierno exigió a la rama Arius los territorios polacos de antes de la Gran Transición, y el gobierno de Arius lo aceptó, decidiendo cedernos los territorios que nos corresponden."
 ARI_event.33.a: "Es un pago justo."

 ARI_event.34.t: "Silesia en lugar de Gdansk"
 ARI_event.34.d: "Nuestro gobierno exigió a la rama Arius la recuperación de los territorios polacos anteriores a la Gran Transición, pero el gobierno de Arius, alegando que en Gdansk también hay muchas zonas de Trinity importantes para Arius, nos propuso ceder Silesia en su lugar."
 ARI_event.34.a: "No está mal."
 ARI_event.34.b: "No renunciaremos al acceso a la costa."

 ARI_event.35.t: "Aceptación del gobierno polaco"
 ARI_event.35.d: "El gobierno polaco envió una respuesta positiva a nuestra propuesta de cesión de Silesia, y poco después llegó un documento que afirmaba que dicha propuesta había sido firmada a nombre del jefe de Estado.\n\nHa surgido una nueva línea de referencia para delimitar los territorios entre la rama Arius y Polonia."
 ARI_event.35.a: "No está mal."

 ARI_event.36.t: "Rechazo del gobierno polaco"
 ARI_event.36.d: "El gobierno polaco rechazó la propuesta de nuestro liderazgo sobre la cesión de Silesia, alegando que Polonia no renunciará al derecho de acceso a la costa garantizado tras la Primera Guerra Mundial.\n\nParece que la guerra con Polonia es inminente."
 ARI_event.36.a: "Maldición."

 ARI_event.37.t: "La rama Arius rechaza dividir territorios"
 ARI_event.37.d: "La rama Arius rechazó la exigencia de nuestro gobierno polaco sobre los territorios anteriores a la Gran Transición, y declaró con dureza que todos los territorios de Trinity pertenecen a Arius."
 ARI_event.37.a: "No renunciaremos a nuestros territorios legítimos."
 ARI_event.37.b: "Debemos evitar un nuevo conflicto."

 ARI_event.38.t: "Gobierno colaboracionista de Trinity de [FROM.GetName]"
 ARI_event.38.d: "Tras nuestra victoria en la guerra contra Trinity, [FROM.GetName] decidió establecer un gobierno colaboracionista local como parte de un plan para gestionar las zonas ocupadas.\n\nY, una vez completada su creación, [FROM.GetName] nos solicitó que devolviéramos los territorios de Trinity, y debemos responder a esa solicitud."
 ARI_event.38.a: "Buena idea."
 ARI_event.38.b: "No, mantendremos todo lo de nuestras zonas ocupadas."

 ARI_event.39.t: "Aprobación de devolución territorial de [FROM.GetName]"
 ARI_event.39.d: "Solicitamos la devolución territorial del gobierno autónomo establecido tras nuestra victoria en la guerra contra Trinity, y [FROM.GetName] aceptó la solicitud y devolvió el territorio a nuestro estado autónomo."
 ARI_event.39.a: "Bien."

 ARI_event.40.t: "Rechazo de devolución territorial de [FROM.GetName]"
 ARI_event.40.d: "Solicitamos la devolución territorial del gobierno autónomo establecido tras nuestra victoria en la guerra contra Trinity, pero parece que [FROM.GetName] tiene otras intenciones."
 ARI_event.40.a: "Aunque sea una lástima, no se puede hacer nada."

 ARI_event.41.t: "Rehabilitación de Hakari Atsuko"
 ARI_event.41.d: "Tras que la rama Arius entrara en contacto con varios ciudadanos de Danzig, comenzaron a producirse cambios a gran escala. Las estudiantes de la rama Arius ahora hablan de resistencia legítima en lugar de venganza indiscriminada, y el violento sistema educativo de Arius está siendo abolido.\n\nEn este contexto, la postura de Hakari Atsuko, miembro del Escuadrón Arius que defendía reformar por completo la situación de la rama Arius y tratar de contactar con Trinity, comenzó a ser revalorizada."
 ARI_event.41.a: "Te reconozco, Atsuko."

 ARI_event.42.t: "La primera elección"
 ARI_event.42.d: "Tras el establecimiento de la federación bajo el liderazgo de la rama Arius y el gobierno de Danzig, no pasó mucho tiempo antes de que se celebraran las primeras elecciones. La participación de las estudiantes de Trinity y de varios alemanes fue restringida, y los electores se formaron con estudiantes-ciudadanas de la rama Arius y de Danzig.\n\nDespués de las elecciones, Jōmae Saori, la líder del Escuadrón Arius, resultó elegida. Frente a alemanes y estudiantes de Trinity que miraban con ojos llenos de inquietud, a estudiantes de Arius que la apoyaban con fervor, y a ciudadanos de Danzig que guardaban silencio, pronunció su discurso de investidura."
 ARI_event.42.a: "El fin de Trinity."
 ARI_event_42_tt: "Se añade el §G60%§! del apoyo del partido §Yno alineado§! al apoyo del partido §Ydemocrático§!."

 ARI_event.69.t: "Formación de una brigada policial"
 ARI_event.69.d: "Hemos podido recuperar el antiguo territorio alemán y emitir órdenes administrativas a la organización policial alemana, permitiéndonos formar una brigada policial. Esta brigada policial será organizada como un ejército completo que podrá ser enviado al frente en nuestro lugar."

 # Descripción de Arius
 ARI_Trinity_core_states_catagories: "Integración de Trinity"
 ARI_Trinity_core_states_catagories_desc: "\n\n£GFX_ARI_trm_add_core\n\n\n\n\nLa Academia General Trinity fue fundada pacíficamente hace muchísimo tiempo, durante el Primer Concilio Ecuménico. Sin embargo, la Escuela Secundaria Arius consideró que aquello era injusto y se opuso. Entonces, ellos comenzaron a arrebatar nuestros territorios y a llevarse a los estudiantes de la escuela filial, no por medios pacíficos, sino mediante la violencia. La escuela filial fue derrotada una y otra vez, hasta verse empujada a regiones remotas, donde tuvo que continuar una lucha por la supervivencia. Pero ahora la situación ha cambiado. Tras nuestra resistencia, Trinity ha capitulado, y ha llegado el momento de integrar los territorios."
 ARI_trinity_core_tt: "Poseer §Ytodos§! los estados núcleo de Trinity."
 ARI_Trinity_core_states_decisions: "Integración territorial"

 ARI_GATHERING_STORM_DESC: "Originalmente, la Escuela Secundaria Arius estaba destinada a ser integrada en la Academia General Trinity, pero se opuso debido a la desigualdad de las condiciones propuestas. En respuesta, la Academia General Trinity designó a Arius como hereje, y la Academia Arius se vio obligada a huir como una proscrita.\n\nArius tampoco pudo evitar la Gran Transición, y como consecuencia perdió incluso cualquier lugar donde esconderse. Sin embargo, por fortuna, la Academia General Trinity parece no tener ni siquiera margen para preocuparse por nuestra academia debido al caos interno que la consume.\nTal vez esta sea, para Arius, otra oportunidad."

 ARI_country_intro_header: "Entre los sueños y los espejismos"
 ARI_country_intro_content: "El sueño de una felicidad que parecía estar al alcance se desvaneció como un espejismo y volvió a alejarse. Aunque las estaciones cambien y el mundo se transforme, la desdichada situación del Escuadrón no cambia.\n\nLos hijos de familias adineradas de Trinity no pierden la sonrisa ni siquiera en medio de este caos, mientras que el Escuadrón vuelve a convertirse en vagabundo.\nHoy también, Trinity los empuja hacia el páramo, sin que nadie en el mundo lo sepa.\n\nPero el Escuadrón sí lo sabe. Sabe quién les ha impuesto el dolor. Y quién sonríe mientras lo hace.\n\nHa llegado el momento de huir del sufrimiento que nunca fue realmente nuestro.\nY también el momento de encontrar, cueste lo que cueste, a su verdadero dueño.\n\"Señor, ten piedad de nosotros.\" (Kyrie Eleison)\n\n§YDesarrollo - SKSKIe§!\n§YDesarrollo auxiliar - subikgm, bang0709§!\n§LDesarrollo antiguo - subikgm, slovakiamodding, pencildude, scpfoundationo5_01§!\n§L(¡Por cierto, toda la herencia de estos antiguos desarrolladores ya ha sido liquidada!)§!"

 ARI_guide: "£white_dot Establezca relaciones con el Partido Nazi en Danzig y reconstruya la academia.\n\nEl gobierno del Escuadrón\n£white_dot Saquee recursos de Trinity y construya un ejército.\n£white_dot §R...Prepárese para una gran incursión.§!\n£white_dot Ahora, derribe a Trinity.\n£white_dot Integre y reconstruya los territorios de Trinity.\n\n£white_dot §LFortaleza Arius§!\n   £white_dot §WSofoca la agitación de los reformistas.§!\n   £white_dot §LLos conservadores de Arius encontrarán su propio camino.§!\n\n£white_dot §4Nuestro Manifiesto§!\n   £white_dot §WAbra paso entre la obstrucción conservadora y venza en el Tercer Concilio.§!\n   £white_dot §4...Azusa persuadirá a Saori.§!\n\n£white_dot §RGobierno de Emergencia§!\n   £white_dot §pNi los reformistas ni los conservadores lograron imponerse.§!\n   £white_dot §R...Entonces, nosotros encontraremos una alternativa.§!\n   £white_dot §S¡Ahora, reconstruya el país, restaure la vida civil y extienda una vez más la mano a los derrotados!§!\n\nY si además se derriba a Gehenna y se unifica Europa Central...\n\n\n\n§CEntonces, la gloria de Arius volverá a manifestarse una vez más.§!"

 ARI_focus_can_only_game_started_tt: "Este enfoque se inicia automáticamente cuando comienza la partida."



