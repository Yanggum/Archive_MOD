 AASRU_progressbar_tt_delayed: "§LLa §YConfianza en la reforma§! es necesaria para completar ciertos enfoques, y debe gestionarse de forma continua mediante §Ydecisiones§! y §Yeventos§!.§!"
 AASRU_desc: "§YJoumae Saori§! ha obtenido §Ypoderes dictatoriales§! durante su liderazgo en la rama de Arius, y estos se mantienen incluso tras §taceptar§! el manifiesto de la §4facción reformista§! para evitar una guerra civil. Dado que §YShirasu Azusa§! logró imponer su §toposición§! a la destitución inmediata de §YSaori§!, cualquier §4reforma§! exigida por la §4facción reformista§! requerirá que §YAzusa§! §tconvenza§! personalmente a §YSaori§!."
 AASRU_end1_desc: "Tras completarse la §4Constitución de la República§!, §YJoumae Saori§! §Rrenunció§! a todos los cargos públicos. La ambigüedad constitucional entre la autoridad del §YPresidente del Consejo Estudiantil§! y la del recién creado §YPrimer Ministro§! provocó una intensa presión política por parte de la §4facción reformista§!. Incapaz de resolver el conflicto, Saori abandonó amargamente la dirección de Arius."
 AASRU_end2_desc: "Poco después de la §4Constitución de la República§!, §YJoumae Saori§! presentó su §Rrenuncia§! de forma inesperada, contrariando las expectativas de §YShirasu Azusa§!. Aunque Azusa le ofreció un cargo honorífico como símbolo del nuevo gobierno, Saori lo §trechazó§! sin vacilar. Consideró que su papel había terminado en la etapa de transición, y desapareció tras bastidores, dejando el futuro en manos de Azusa."
 AASRU_end3_desc: "Mediante la §4Constitución de la República§!, §YJoumae Saori§! y §YShirasu Azusa§! consolidaron un §Gsistema bicéfalo perfecto§!. Según la constitución del §Ysistema academia-estado§! impulsada por Azusa, Saori asume un rol equivalente al de §YPresidenta§!, equilibrando y supervisando al §YPrimer Ministro§! y al §YParlamento§!. La confianza mutua entre ambas se convirtió en el nuevo pilar de Arius."
 AASRU_progressbar_end_tt: "La historia de la reforma de §YJoumae Saori§! y §YShirasu Azusa§! ha llegado a su fin."
