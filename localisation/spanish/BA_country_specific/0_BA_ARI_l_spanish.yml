 ARI_final_offensive: "Batalla decisiva final"
 ARI_final_offensive_desc: "¡Ha llegado el momento de hacer caer a Trinity con una ofensiva fulminante!"
 ARI_lantern_of_the_germanic: "El farol de Alemania"
 ARI_lantern_of_the_germanic_desc: "Quemar Trinity hasta los cimientos. Esa sola consigna bastó para atraer a alemanes cegados por la venganza, dispuestos a dejar atrás todas las demás condiciones adversas.\n\nSi Dios existe, no estará en Trinity, y nosotros simplemente les asestaremos un golpe."
 ARI_lantern_of_the_germanic_tt: "Se elimina al cumplir la condición: controlar al menos §Y4§! estados"
