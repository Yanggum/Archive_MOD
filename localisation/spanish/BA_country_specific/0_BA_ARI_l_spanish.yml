 ARI_reinhard_heydrich_category: "Actividades de Reinhard Heydrich"
 ARI_reinhard_heydrich_category_desc: "Reinhard Heydrich es un Obergruppenführer de las SS alemanas y jefe de la Oficina de Seguridad. Y ahora, dentro de Arius, vuelve a soñar con el renacimiento de Alemania, y en el proceso puede cooperar activamente con Arius. La última brasa del nacionalsocialismo arderá aquí una vez más."
 ARI_reinhard_heydrich_1: "Discurso: una vez más"
 ARI_reinhard_heydrich_1_desc: "¿Quién se atrevería a soñar otra vez con el Führer? Es absurdo. Nosotros solo... sacaremos a esos malditos alados que pisotearon nuestra tierra y destrozaron nuestros sueños, los arrancaremos de su cuna cómoda y los arrojaremos a la fría realidad."

 ARI_trinity_academy_dissolution: "Disolución de la Academia Trinity"
 ARI_trinity_academy_dissolution_desc: "Ahora disolveremos la Academia Trinity, que ha gobernado durante mucho tiempo la región de Trinity, y estableceremos nuestro dominio. Eliminaremos toda clase de símbolos, incluiremos en la educación histórica los crímenes de guerra cometidos por Trinity y derribaremos su pomposa posición de “una de las tres grandes academias”."
