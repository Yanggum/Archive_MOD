 ARI_event.23.t: "Despistando a los perseguidores"
 ARI_event.23.d: "Reinhard Heydrich: antiguo jefe de la Oficina de Seguridad del viejo Alemania y, tras la Gran Transición, quien reorganizó a las SS y lideró a la resistencia. Sin embargo, después de que el Departamento de Justicia de Trinity, tras su investigación, descubriera que él estaba detrás del atentado contra Seia, el Departamento de Justicia de Trinity comenzó a perseguirlo con obstinación, y no le quedó más remedio que abandonar toda operación encubierta y huir.\n\nAsí, Reinhard Heydrich logró sacudirse la persecución y escapar; canceló por completo su plan de exiliarse a Estados Unidos, y tras la declaración de cooperación total de la Escuela Secundaria Arius con el Partido Nazi, cruzó hacia la Escuela Secundaria Arius al frente de un pequeño grupo de SS.\n\nEnarbolando como estandarte el fin perfecto de la Academia General Trinity y el renacimiento del viejo Alemania, Reinhard Heydrich comenzó una vez más a preparar nuevas operaciones."
 ARI_event.23.a: "Esos tipos creerán que estoy muerto."

 ARI_event.70.t: "Formación de divisiones de los exiliados alemanes"
 ARI_event.70.d: "Muchos exiliados alemanes, si tan solo reciben equipo, podrán organizarse como un ejército completo que sea enviado al frente en nuestro lugar."

 ARI_event.71.t: "Alemanes que se congregan en [FROM.GetName]"
 ARI_event.71.d: "Arius ha manifestado su intención de restaurar, tras el fin de la guerra, un Estado de los alemanes en el antiguo territorio alemán. Este rumbo provocó una gran movilización nacionalista entre los alemanes de las regiones bajo control de Trinity, y pronto comenzó a formarse una Legión Alemana Libre que luchará por Arius.\n\nSi no podemos poner fin a la guerra de manera decisiva, aplastar este movimiento será extremadamente difícil..."
 ARI_event.71.a: "¡Recuerden el Primer Concilio!"
 ARI_event.71.b: "¡Ustedes todos! ¡Son unos traidores!"

 ARI_story_event.1.t: "Reunión secreta con la Kriegsmarine"
 ARI_story_event.1.d: "El abandonado tercer muelle de Danzig. Bajo la sombra grotesca de contenedores cubiertos de moho apilados como monstruos, Joumae Saori permanecía inmóvil, como una sombra fundida con la oscuridad. Frente a ella, un hombre que se había arrancado las charreteras del uniforme sostenía un maletín con expresión rígida. Era un emisario personal del almirante Erich Raeder, que había logrado abrirse paso a través de la red de vigilancia de Trinity.\n\nLos intereses de ambas fuerzas coincidían en un punto extrañamente preciso. Arius necesitaba desesperadamente apoyo externo y una ruta de suministro marítima para romper su situación de aislamiento; la Kriegsmarine necesitaba un “agujero” para reagrupar con seguridad a las tropas del ejército alemán que, dentro de Trinity, estaban al borde de la desintegración. Cuando Saori trazó con un bolígrafo rojo una línea sobre el mapa del Báltico extendido en la mesa, uniendo Danzig con Gotland, el emisario asintió con pesadez.\n\nMediante este pacto, las fuerzas alemanas aisladas dentro del territorio de Trinity serían trasladadas en secreto, pasando por el puerto de Danzig controlado por Arius, hacia la zona segura de Gotland. A cambio, Arius recibiría la promesa de material militar acumulado por la Kriegsmarine y un apoyo limitado frente al bloqueo marítimo.\n\nSolo el cruce de miradas sin emoción y el sello rojo estampado en los documentos fueron los únicos testigos de este trato peligroso. La conspiración de chicas que persiguen lo vano y de soldados convertidos en espectros quedó silenciosamente anudada en el aire helado del viento marino."
 ARI_story_event.1.a: "El enemigo de mi enemigo no es más que una herramienta útil."

 ARI_story_event.2.t: "Informe sobre las actividades de la Escuela Secundaria Arius"
 ARI_story_event.2.d: "\nN.º de documento: ABS-000950202\nInformante: Hanekawa Hasumi, vicejefa del Departamento de Justicia\nDestinatario: Host de Trinity [TRM.GetLeader]\nCopia: Fuerzas Terrestres de Trinity\n\n-Introducción\nInforme sobre movimientos anómalos de suministros y amenaza potencial de la Escuela Secundaria Arius\n\nEn medio de la caótica situación reciente tras la Gran Transición, se acumulan reportes de agentes de campo indicando que el entorno de la zona autónoma de Arius presenta señales inquietantes. En la superficie, se presentan como “víctimas” que, al igual que nosotros, fueron arrojadas a un mundo desconocido y, bajo el pretexto de compartir hostilidad hacia Gehenna, están ganándose la simpatía de algunos estudiantes.\n\nSin embargo, la evaluación de la Sala de Análisis de Inteligencia es distinta. Esto es, de manera evidente, una táctica de engaño.\n\nRecientemente, en comparación con su consumo de alimentos, la cantidad de pólvora y maquinaria-herramienta introducida por Arius ha aumentado de forma anormal. Además, se repite el fenómeno de fuerzas no identificadas que son avistadas en puntos ciegos de la periferia de Trinity y desaparecen al instante. Esto supera con creces el marco de simples patrullas vecinales: se sospecha que es una fase organizada y militar de “preparación de infiltración”.\n\nDebido a la opinión pública dentro de la academia, un ataque preventivo es imposible. Pero tampoco podemos cerrar los ojos ante el hecho de que esos tipos afilan cuchillos apuntando a nuestro cuello.\n\nAntes de que ejecuten “eso” que están preparando, debemos idear todos los medios defensivos posibles. A partir de ahora, el Departamento de Justicia recomienda declarar un estado de alerta de emergencia."
 ARI_story_event.2.a: "Recibido."

 ARI_story_event.4.t: "Vientos de cambio"
 ARI_story_event.4.d: "Ni siquiera el gélido aire del amanecer prusiano podía borrar el olor a polvo viejo de los montones de documentos acumulados sobre el escritorio. Lo que Arius obtuvo de la guerra contra Trinity y de la expansión territorial posterior no fue solo una embriaguez de victoria. También fue un pantano pesado y pegajoso, más denso que las balas, que llevaba el nombre de “administración”.\n\n\"...No lo entiendo.\"\n\nJoumae Saori frunció el ceño y dejó caer el informe sobre el escritorio como si lo arrojara. Sus manos estaban hechas para apretar el gatillo, pero no se acostumbraban en absoluto a ajustar cupones de racionamiento en territorios ocupados ni a tramitar quejas de forasteros que seguían llegando.\n\nDesde un sofá arrinconado, Misaki murmuró con una voz sin fuerzas.\n\n\"...Ni siquiera da risa. Nosotras, que repartíamos pan mohoso en las ruinas, ahora agitamos el poder administrativo de un país ajeno. Todo es vano. Mientras más grande es el cuerpo, más espesa es la sombra.\"\n\"U- uee... Líder... sobre esas solicitudes que mandaron los nuevos administradores... dicen que seamos demasiado ‘de la vieja era’. Que si no... si no respondemos con más... flexibilidad, habrá disturbios... T- tengo miedo...\"\n\nEl documento que Hiyori le extendió con cara de llanto estaba lleno de marcas rojas de advertencia. El método de Arius—control absoluto, educación basada en el odio y disciplina militar—no lograba mezclarse con la gigantesca maquinaria administrativa de los territorios ocupados ni con culturas externas, y empezaba a chirriar. ¿Seguir aplastándolo todo con la vieja forma, o aceptar parcialmente “la forma del mundo” que tanto despreciábamos, para sobrevivir?"
 ARI_story_event.4.a: "Aún no es momento de cambiar."
 ARI_story_event.4.b: "...¿Tienes algo que decir, Azusa?"

 ARI_story_event.5.t: "Líneas de suministro que se pudren"
 ARI_story_event.5.d: "Detrás de los almacenes portuarios de Danzig, en un callejón cubierto por una oscuridad espesa, lo que Tsuchinaga Hiyori sostenía con el rostro pálido era un viejo libro de cuentas.\n\n\"U- uee... Líder, mire esto. Es el libro de raciones del Sector 3 de este mes... los números no cuadran. Las conservas y el material médico... desapareció la mitad. Y dicen que, en el mercado, están vendiendo carísimo medicinas con nuestro sello...\"\n\nA medida que la guerra se alargaba, incluso la disciplina afilada como escarcha que Arius mantenía al principio comenzaba a agrietarse. Soldados y funcionarios de bajo rango se agotaban en una guerra sin final, y el instinto de supervivencia se deformaba en codicia: empezaron a desviar suministros. Incluso los gendarmes encargados de vigilar apartaban la mirada con chocolate sobornado en la boca.\n\n\"Echar agua en un barril agujereado.\"\n\nMisaki murmuró en voz baja. Estaba sentada sobre una caja de munición vacía como si fuera una silla.\n\n\"Con odio no se llena el estómago. Todos empezaron a buscar una forma de vivir. ¿No les enseñamos ‘supervivencia’? Pues este es el resultado.\"\n\nSaori se presionó con fuerza la sien. Gobernar a punta de pistola y miedo funcionaba en una guerrilla pequeña. Pero para la Arius actual, con población enorme, vasto territorio y redes de distribución complejas, un simple “sistema de racionamiento” había llegado a su límite. Para extirpar el tejido podrido quizá no baste con atrapar ladrones: tal vez haya que cambiar la forma misma en que funciona la economía."
 ARI_story_event.5.a: "...Por ahora, enciérrenlos a todos en celdas de aislamiento."

 ARI_story_event.6.t: "La noche en que vuelan los cristales"
 ARI_story_event.6.d: "¡Crrrash! Un estallido agudo desgarró la noche de Danzig. Era la señal.\n\nLos comercios operados con el capital de la Academia General Trinity—vitrinas con tazas elegantes, té de alta gama y muñecos de Peroro—fueron hechos añicos por botas militares. Había agitadores ex-SS, desempleados alemanes y, sobre todo, estudiantes de Arius que hacían explotar el odio reprimido.\n\n\"¡Rómpanlo todo! ¡Que no quede ni una sola cosa que huela a Trinity!\"\n\nEn medio de una calle en llamas, Saori observaba la escena con los brazos cruzados, impasible. Comerciantes aterrados eran arrastrados afuera y los objetos saqueados rodaban por el suelo.\n\n\"...Líder, eso... ¿no deberíamos detenerlo? Los gendarmes hasta les están ayudando...\"\n\nHiyori preguntó, inquieta, pisando fragmentos de vidrio. Misaki encendió un cigarrillo con las llamas y respondió, seca.\n\n\"Déjalo. Es desahogo. Esos tipos no están golpeando al dueño de la tienda. Están golpeando la ilusión llamada ‘Trinity’ que los encerró. ...Infantil, pero efectivo.\"\n\nComo señaló Misaki, este saqueo no es un simple crimen. Es una forma en que la ira de Alemania y de Arius, reprimida durante tanto tiempo, se desborda desde lo más bajo; una grieta emocional profunda que no se puede cerrar de un golpe. En los ojos de Saori titiló un fuego rojo. Ella puede detenerlo… o avivarlo aún más."
 ARI_story_event.6.a: "Les permito su odio. Borren las huellas de Trinity."
 ARI_story_event.6.b: "Publiquen una orden administrativa que prohíba oficialmente el saqueo."

 ARI_story_event.7.t: "Disonancia"
 ARI_story_event.7.d: "¡BAM!\n\nEl sonido de una pesada puerta de roble al cerrarse desgarró el silencio del despacho. Polvo cayó del marco sobre la alfombra, y Saori se quedó mirando la puerta cerrada, ausente, hasta que la vibración se extinguió. Sobre el escritorio quedaba, solitario, un borrador de discurso acuchillado por marcas de bolígrafo rojo.\n\nLo que había llenado esta habitación hasta hace un momento era la voz afilada de Shirasu Azusa. Tras revisar brevemente el texto que Saori le entregó, Azusa lo arrojó sobre el escritorio de forma deliberada, y su mirada era, sin duda, de desprecio.\n\nDespués de un intercambio de reproches, Azusa miró fijamente a Saori, y en esos ojos ya no quedaba la admiración ni la obediencia de antes. Desde hacía tiempo, veía a Saori no como “líder”, sino como un “viejo orden” que debía superar.\n\nTras ese silencio, Azusa se dio la vuelta y se marchó sin decir nada. Saori, apretándose la sien palpitante, pensó: tal como Azusa señaló, el Estado ya estaba partido. Los que, ebrios de victoria, quieren consumar la venganza; y los que quieren construir una casa nueva sobre las ruinas. La deserción de Azusa, hoy, hizo esa grieta irreversible, y parecía que jamás volvería a cerrarse."
 ARI_story_event.7.a: "Adoptar el discurso conservador."
 ARI_story_event.7.b: "...¿Y si retocamos un poco el discurso?"
 ARI_story_event_7_tt: "§gAzusa ahora actúa como líder de los reformistas.§!"

 ARI_news.1.t: "Proclamación del Concilio de Arius"
 ARI_news.1.d: "En la madrugada de hoy, en las ruinas de una catedral del antiguo territorio de la Academia General Trinity—actualmente ocupado por la Escuela Secundaria Arius—se anunció una declaración impactante que sacudirá a todo Kivotos.\n\nLa Escuela Secundaria Arius, que décadas atrás había sido marcada como “hereje” en el Primer Concilio y borrada de la historia, proclamó oficialmente el “Concilio de Arius”, invirtiendo por completo la acusación y calificando como “herejes” a todas las facciones de Trinity, excepto a la suya.\n\nEn el estrado, el/la [FROM.GetLeader] de Arius declaró que solo la fe de Arius, templada exclusivamente a través del dolor y el odio, es la verdadera fe. Esto va más allá de una simple secesión: es, de facto, una “declaración de trituración” que niega de raíz la legitimidad de Trinity—la academia más grande de Kivotos—y anuncia que ellos pretenden ocupar su lugar."
 ARI_news.1.a: "Vanitas vanitatum, et omnia vanitas."
 ARI_news.1.b: "¡Es una blasfemia inconcebible!"
 ARI_news.1.c: "¿Podrán ganar?"

 ARI_news.2.t: "La caída de Trinity"
 ARI_news.2.d: "En la madrugada de hoy, sobre la aguja de la Catedral de Trinity, donde el fuego cesó, se izó la bandera negra de Arius en lugar del estandarte desgarrado del Tea Party. Mientras todo Kivotos contenía la respiración, el/la [FROM.GetLeader] declaró, sobre un altar reducido a ruinas, “el fin completo de Trinity” y “la unificación bajo Arius”.\n\nLo que el mundo había despachado como “delirios vanos de exiliados” o “terror pasajero”—el contenido del Segundo Concilio de Arius—se convirtió en una realidad fría e innegable, y todas las doctrinas de Trinity están siendo definidas como “herejía” y arrojadas a las llamas.\n\nEl discurso del vencedor fue breve, pero su peso jamás fue ligero. Ellos, que habían contenido la respiración en la oscuridad de las catacumbas subterráneas, terminaron por devorar el mundo de la luz y se convirtieron en los dueños de la academia más grande. La locura de Arius se ha vuelto, ya, una “historia” que nadie puede negar."
 ARI_news.2.a: "Dios ha muerto. Hoy, sin duda."
 ARI_news.2.b: "El orden de Kivotos ha cambiado para siempre."

 # Modificadores dinámicos

 ARI_two_cities: "Dos ciudades"
 ARI_two_cities_desc: "Esta ciudad, dividida entre Danzig y la Escuela Secundaria Arius a ambos lados del río, aún no ha sido integrada."

 ARI_gottglaubig: "Gottgläubig"
 ARI_gottglaubig_desc: "La fe de Arius, afilada por el odio a Trinity, ha cambiado ahora hacia otra forma. Hasta que todos los alados caigan al suelo, la nueva fe de Arius brillará.\n\nGottgläubig, que niega no solo la Trinidad sino el cristianismo en sí, es una religión singular propia de Arius y del Partido Nacionalsocialista Obrero Alemán. Estos devoran y denuncian los sistemas religiosos existentes, y creen únicamente en el dios que creó este mundo."

 ARI_arian_faith: "Fe ariana"
 ARI_arian_faith_desc: "Arius, originalmente una de las muchas escuelas filiales que conformaban la Academia General Trinity, fue declarada hereje en el Primer Concilio y se convirtió en enemiga de todas las demás escuelas. Así, Arius lo abandonó todo y se ocultó en un lugar que nadie conocía, esperando reaparecer en el mundo cuando la venganza contra Trinity estuviera lista.\n\nEn efecto, así debía ser. Pero tras el extraño acontecimiento de la Gran Guerra, Arius se vio obligada a salir al mundo, como si la expulsaran, mientras intentaba contener el caos y evitar el colapso de la academia.\n\nLa Fe ariana es la suma de todas las ideologías de la Escuela Secundaria Arius, y su raíz es el odio hacia Trinity."

