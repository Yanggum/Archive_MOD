 ARI_heart_strike_plan: "Plan de ataque al corazón"
 ARI_heart_strike_plan_desc: "Para obtener una ventaja inicial contra un enemigo tan poderoso como Trinity, la Escuela Secundaria Arius necesita *amplias* operaciones de infiltración, terrorismo sorpresa para paralizar las actividades militares de Trinity, y una guerra relámpago para capturar en instantes los puntos clave. Con ese fin, iniciaremos grandes preparativos.\n\nHa comenzado una §Gcompetencia de puntos§! entre §YArius§! y §YTrinity§!. Si §YArius§! obtiene más §Gpuntos§! que §YTrinity§!, lograremos un §Rataque aéreo devastador§!; si no, lograremos un §4ataque aéreo menor§!. No podemos conocer los §Gpuntos§! exactos del enemigo: solo podemos saber en qué §Grango§! se encuentran.\n\nActualmente, nuestros puntos son ([ARI_heart_strike_plan_ARI_VAR] puntos).\nLos puntos del rival parecen estar dentro del rango ([ARI_heart_strike_plan_TRM_VAR_LOC] puntos)."

