 ARI_nazi_party: "Partido Nacionalsocialista Obrero Alemán"
 ARI_nazi_party_desc: "El Partido Nacionalsocialista Obrero Alemán fue el partido que gobernó, antes de la Gran Transición, el poderoso Estado llamado Alemania. Sin embargo, tras el incidente de la Gran Transición, Alemania fue destruida por Kivotos, liderado por las dos academias Trinity y Gehenna. Después de que, junto con Berlín, desaparecieran por completo el Führer y los talentos de Alemania, ellos se ocultaron en lo más profundo del subsuelo.\n\nY, entre las ruinas de la rama Arius, volvieron a mostrarse bajo un punto en común: odiar a Trinity y Gehenna. Ahora, el partido nazi y la rama Arius se han tomado de la mano y están preparando una gran lucha contra Trinity y Gehenna."

 ARI_german_reconstruction_government: "Gobierno de reconstrucción"
 ARI_german_reconstruction_government_desc: "El Gobierno de Reconstrucción Alemán se encarga de reconstruir el territorio nacional devastado por la guerra contra Trinity, Gehenna y otras entidades de otros mundos."

