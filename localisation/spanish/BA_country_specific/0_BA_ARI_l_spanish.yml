 ARI_conservative_event_chain.1.t: "Después de la lluvia, despejado"
 ARI_conservative_event_chain.1.d: "En una tarde tardía del centro, tras pasar un aguacero, la sala de reuniones reformista, apenas reagrupeada, se hundía en un aire húmedo y silencioso, como el barracón de los derrotados. Ya no había gritos que cortaran el aire ni agitadores con ojos inyectados clamando revolución. Solo quedaba la respiración pesada de quienes apoyaban los pies en el frío concreto de la realidad, extendida como niebla.\n\nEn el estrado, Shirasu Azusa recorrió al público lentamente, como una comandante que observa un campo de batalla viejo. Su uniforme estaba impecable, pero en sus hombros colgaba, como una charretera, la sombra solitaria de quien no logró convertir el ideal en realidad.\n\n\"...El viento cambió de dirección, y quisimos ser tormenta, pero debemos admitir que no fuimos más que polvo disperso.\"\n\nLa voz de Azusa era seca, pero atravesaba verdades dolorosas. Apretó el puño y luego lo abrió despacio: señal de rendición, y ritual para soltar la terquedad vana.\n\n\"Los muros del viejo orden eran firmes, y el martillo con el que quisimos derribarlos se rompió. ...Pero si el muro no cae, entonces debemos aprender a vivir dentro. A partir de ahora, no seremos un enemigo que apunta lanzas, sino que buscaremos cogobierno y cambios moderados.\"\n\nEra una declaración de derrota y un giro de ruta: en lugar de destrucción radical, quedarse como fuerza de control dentro del sistema. Entre la gente no se escuchó un rugido de resignación, sino un suspiro de alivio, como un oleaje que baja y deja solo pequeñas ondas. Los ciudadanos entendieron: no correrá más sangre, y el volante de Arius quedó por completo en manos de Saori y los conservadores.\n\nAzusa miró hacia el gran edificio del gobierno tras la ventana y ejecutó un saludo breve y firme: cortesía hacia los vencedores, y reverencia hacia la realidad llamada Estado."
 ARI_conservative_event_chain.1.a: "La tormenta pasó."

 ARI_conservative_event_chain.2.t: "Firme aquí"
 ARI_conservative_event_chain.2.d: "Cuando Utazumi Sakurako y otras líderes de la Hermandad se presentaron en el tribunal subterráneo de la Catedral de Trinity, las miradas de los radicales de Arius, llenando la galería, brillaban con sed de sangre. Querían el castigo más cruel para las “brujas del consejo sagrado”. Nadie quería juzgarlas… pero todos querían verlas sangrar.\n\nPero Joumae Saori, sentada en el centro del estrado, pensaba distinto. Sí: la Hermandad también nos apuntó con armas y, por el uso de armas químicas, participó en la guerra más activamente que otras. Pero si ahora las declaraban “criminales de guerra” para ejecutarlas o encarcelarlas… entonces tendrían que meter a prisión a todos los estudiantes de Trinity que apretaron el gatillo por órdenes del Tea Party. Eso no sería gobierno: sería una masacre eterna.\n\n\"...El Tea Party y el Departamento de Justicia han caído. Considero atenuante que ustedes, a diferencia de ellos, no dirigieron una ‘guerra activa’.\"\n\nAl leerse el veredicto seco de Saori, la sala se agitó. Pero Saori no vaciló y dictó la pena:\n\n\"Sin embargo, no están libres de culpa. Por lo tanto, se revoca de manera permanente el derecho de sucesión que la Hermandad se atribuía del antiguo grupo criminal de guerra ‘Orden Sagrada de Justina’. Ya no son sus herederas. Y, desde hoy, en todos los conventos se introduce obligatoriamente la filosofía de Arius en el plan educativo.\"\n\nSakurako apretó los labios, pero al final inclinó la cabeza y aceptó. Era una gran retirada del ideal de la Hermandad, quizá hasta su extinción… pero, comparado con lo que temían, permitió a las monjas exhalar aliviadas. En vez de sangre, Saori eligió colocar su “fe” en la mesa de cirugía."
 ARI_conservative_event_chain.2.a: "La Hermandad... no tiene relación con la Orden Sagrada de Justina."

 ARI_conservative_event_chain.3.t: "Club de Postres de Después de Clases"
 ARI_conservative_event_chain.3.d: "\"U- uee... o sea... según la nueva ley de orden público de Arius, las actividades de clubes privados de más de 3 personas sin autorización... ¿uugh?!\"\n\nAl abrir la puerta del aula del Club de Postres de Después de Clases, Tsuchinaga Hiyori no pudo terminar la frase. Porque Natsu y Kazusa le pusieron delante un “Mont Blanc especial edición limitada de Trinity” y una taza de té humeante.\n\n\"Venga, venga, los temas duros pueden esperar hasta después de comer esto. Invitada de Arius.\"\n\"¿Hiyori-chan, dijiste? Esto es dificilísimo de conseguir. Iba a ser solo para nosotras, pero hoy te toca.\"\n\nLas pupilas de Hiyori temblaron violentamente. La “Orden de disolución forzada de grupos separatistas” en su mano se volvió más ligera que un pañuelo ante el olor dulce a mantequilla. Quiso comer solo un bocado y luego ponerse estricta… pero cuando recuperó la razón, el plato ya estaba limpio.\n\n\"...E- entonces... lo que pasa es que... les voy a dar permiso para seguir. P- pero... como tendrán vigilancia de Arius...\"\n\"¿Vigilancia? Eso cuesta presupuesto, ¿no? Si nos financias ingredientes, puedes venir cuando quieras a ‘vigilar (probar)’.\"\n\nAl final, lo que Hiyori llevó a Saori no fue una orden de disolución, sino un <Plan de financiamiento total del Club de Postres de Después de Clases y asignación especial de presupuesto para snacks>. La excusa era “calmar el descontento de remanentes de Trinity”, pero el papel olía a azúcar glas. Los contadores de Arius casi se desmayan ante el gasto, pero al ver la sonrisa feliz de Hiyori no pudieron rechazarlo."
 ARI_conservative_event_chain.3.a: "¡Es obvio que es un despilfarro!"

 ARI_conservative_event_chain.4.t: "Comité de Biblioteca"
 ARI_conservative_event_chain.4.d: "La pesada puerta del archivo antiguo se abrió y Imashino Misaki entró, paso a paso. Aquel lugar oscuro, saturado del olor a moho y papel viejo, era—para Misaki, que detestaba la luz—extrañamente confortable.\n\nKozeki Ui, escondida y temblando tras un estante, estuvo a punto de gritar al verla, pero al cruzar la mirada vacía y seca de Misaki cerró la boca. Había olido en la intrusa el mismo perfume de “los de su especie”: el deseo de desconectarse del mundo.\n\n\"...Necesitamos cooperación. Te protegeremos para que los ruidosos de afuera no puedan meterse. A cambio, la propiedad de estos libros antiguos pasa a Arius.\"\n\"...¿Proteger? ¿De verdad van a... detener a esos idiotas ruidosos? ¿Para que pueda leer aquí, sin luz de sol ni ruido... solo en esta oscuridad?\"\n\"Sí. Nos repugna el ruido.\"\n\nMisaki se dejó caer al suelo y jugueteó con su muñeca. Ui se sentó en silencio frente a ella. Entre ambas corrió un silencio pesado, lúgubre, que se entendía sin palabras: una resonancia extraña, como un abismo mirando a otro abismo.\n\n\"Ugh... disculpen, pero el aire aquí es tan pesado que no puedo respirar... ¡yo me voy primero!\"\n\nLa bibliotecaria Shimiko, incapaz de soportar el ambiente, gritó y escapó del lugar. El control de la biblioteca fue transferido de forma sorprendentemente pacífica… y sombría."
 ARI_conservative_event_chain.4.a: "...Este documento se siente lúgubre con solo leerlo."

 ARI_conservative_event_chain.5.t: "Por encima de todos los nombres"
 ARI_conservative_event_chain.5.d: "La bandera de Arius izada en la cúspide de la antigua catedral de Trinity ya no flameaba como si el viento fuese a desgarrarla. Simplemente estaba ahí, pesada y silenciosa, como si hubiera pertenecido desde siempre a ese lugar, dominando el cielo de Europa Central.\n\nJoumae Saori se hallaba en la terraza que una vez usó el Host del Tea Party y contemplaba el imperio extendido bajo sus pies: el campus de Trinity, antaño odiado, y más allá el territorio rojo de Gehenna, arrodillado. Todo lo que alcanzaba la vista estaba ahora controlado bajo el nombre de Arius.\n\n\"...Qué absurdo.\"\n\nImashino Misaki, sentada en la baranda, murmuró con ojos vacíos.\n\n\"Hicimos todo ese escándalo porque odiábamos que Azusa tomara la mano de los de Trinity. Y mira ahora: la mitad de los burócratas que trabajan bajo nosotros son ex-Trinity, y los obreros de las fábricas son de Gehenna. ¿Venganza? ¿A quién le vas a cobrar venganza a estas alturas? En la calle, todos bajan la cabeza ante nosotras.\"\n\nMisaki tenía razón. La victoria no fue consumar una dulce venganza: fue la desaparición del blanco de esa venganza. En el instante en que aplastaron a todos los enemigos, Arius se convirtió, irónicamente, en el “gran dominador” que tanto despreciaban. Cuando el combustible del odio se consumió, quedaron una maquinaria administrativa enorme, una fuerza militar aplastante y el peso de “gobernar”.\n\n\"...Pero ya no tenemos que huir, ¿no? Ya no comeremos pan mohoso… ya no temblaremos al dormir pensando que alguien vendrá…\"\n\nTsuchinaga Hiyori, sosteniendo una taza elegante con ambas manos, lo dijo como quien por fin exhala. Era la prueba más primitiva y más segura de la victoria.\n\nSaori levantó la mirada hacia el horizonte. Fantasmas de las ruinas, sombras de la ciudad-academia, olvidados… todos esos insultos habían desaparecido hacia los libros de historia. Ya no volverían a esconderse en la oscuridad.\n\n\"Todo es vanidad (Vanitas Vanitatum).\"\n\nLa doctrina que salió de los labios de Saori ya no sonó como autodesprecio ni desesperación; paradójicamente, parecía recuperar su sentido original."
 ARI_conservative_event_chain.5.a: "\"Pero estamos en la cima de ese mundo vano. Con eso basta.\""
 ARI_conservative_ending_tt: "§gLa historia del Escuadrón que terminó guiando a la Escuela Secundaria Arius concluye así. Puede que la integración total aún esté lejos, y que Joumae Saori, que prioriza la estabilidad, no pueda aceptar más cambios. Sin embargo, las estudiantes de Arius que vagaban por las ruinas ya encontraron su lugar legítimo en el mundo y se erigieron como dominadoras orgullosas de Europa Central. Nadie sabe qué sintió Saori al final del camino, pero para Arius será recordada como una heroína.§!\n\n§LEl contenido conservador creado para la Escuela Secundaria Arius ha sido completado. ¡Gracias por jugar!§! §H- SKSKIe§!"

