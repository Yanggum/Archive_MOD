 ARI_make_collapse: "Alto mando devastado"
 ARI_make_collapse_desc: "Dicho de forma amable, sobrevivieron; dicho de otra manera, apenas salvaron la vida. En su estado actual, el alto mando de la Tea Party no está lo suficientemente íntegro como para controlar y dirigir a Trinity, y necesitará bastante tiempo para recuperarse por completo."
