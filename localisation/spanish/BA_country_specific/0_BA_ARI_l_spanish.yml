 # Eventos diplomáticos
 ARI_diplomatic_event.1.t: "Contacto secreto"
 ARI_diplomatic_event.1.d: "Desde la Escuela Secundaria Arius nos han transmitido información confidencial: si deciden invadir Trinity, nos proporcionarán los datos necesarios para nuestra guerra y han comunicado en secreto a nuestra dirigencia que Arius planea atacar Trinity en un futuro cercano.\n\nPodemos aceptar su solicitud y preparar la invasión contra Trinity, o bien ignorarlos y enviarlos de vuelta."
 ARI_diplomatic_event.1.a: "Bien. Preparen la invasión."
 ARI_diplomatic_event.1.a.tt: "Al completar directamente el enfoque §Y$GEM_war_with_trinity$§!, se obtienen espíritus nacionales temporales que ayudan en la guerra contra §Y[TRM.GetNameWithFlag]§!, además de §Yestabilidad§! y §Yapoyo bélico§!. También se relajan considerablemente los requisitos para completar el enfoque."
 ARI_diplomatic_event_1_a_tt: "\nAyuda de Arius:"
 ARI_diplomatic_event.1.b: "¿Y por qué deberíamos confiar en ustedes?"
 ARI_diplomatic_event_1_a_idea: "Obtención de mapas operativos de Trinity"
 ARI_diplomatic_event.11.t: "Aprobación de Pandemonium"
 ARI_diplomatic_event.11.d: "La facción de Pandemonium ha firmado un pacto secreto comprometiéndose a la invasión y nos ha proporcionado sus mapas operativos. Pronto comenzarán los preparativos para atacar Trinity."
 ARI_diplomatic_event.11.a: "Nosotros también debemos prepararnos para la invasión."
 ARI_diplomatic_event.12.t: "Rechazo de Pandemonium"
 ARI_diplomatic_event.12.d: "La facción de Pandemonium ha rechazado nuestra propuesta de cooperación y ha expresado firmemente que no participará en una apuesta temeraria. Parece que la guerra contra Trinity deberá esperar hasta que cambien de opinión, o tendremos que llevarla a cabo en solitario."
 ARI_diplomatic_event.12.a: "Típico de esos tipos con cuernos."

