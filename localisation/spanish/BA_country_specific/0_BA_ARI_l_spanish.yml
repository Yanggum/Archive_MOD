#아리우스 아이디어"
 BA_ARI_bitter_revanchism_3: "Rama Arius"
 BA_ARI_bitter_revanchism_3_desc: "La rama Arius era como una máquina que funcionaba únicamente para vengarse de Trinity y Gehenna. Y esa máquina de venganza ha cumplido ahora su objetivo.\n\nLa rama Arius, expulsada del antiguo concilio, derribó con orgullo a la Academia Integral de Trinity, el producto mismo de aquel concilio, y volvió a levantarse una vez más. La rama Arius, que reescribió su derrota del pasado como la victoria del futuro para alzarse de nuevo, no volverá a ocultarse jamás en las sombras."

 BA_ARI_bitter_revanchism_GER: "Revanchismo nacional alemán"
 BA_ARI_bitter_revanchism_GER_desc: "Sobre una tierra cubierta de ceniza y polvo, el águila ha vuelto a alzar el vuelo. La gran patria que hará brillar una vez más los ideales derrumbados de Alemania ha regresado.\n\nEl nuevo ideal del pueblo alemán, renacido de entre las ruinas, alzará su voz con fuerza hacia el mundo. Para proclamar que Alemania ha vuelto.\n\n¡Sieg Heil! (Sieg Heil!)"

 BA_ARI_tragedy: "Preludio de la tragedia"
 BA_ARI_tragedy_desc: "Cuando desapareció el adulto que guiaba a Arius, no quedó más que confusión. Estallaron innumerables guerras internas y choques para llenar el vacío de poder, y ni siquiera el escuadrón de Arius pudo ser una excepción en este caos. Ellas también, al principio, dieron un golpe de Estado y se hicieron con el poder con el pretexto de impedir el colapso de Arius, pero desde el instante en que probaron el dulce fruto llamado poder, el conflicto interno se convirtió en una realidad inevitable.\n\n¿Desde cuándo comenzó el telón de esta tragedia? Fue desde que, tras la Gran Transición, el choque de opiniones entre Hikari Atsuko y Jōmae Saori se intensificó aún más. Atsuko sostuvo que, por el futuro de Arius, debían abrir las fronteras y mejorar las relaciones con Trinity. En cambio, Saori clamó que ahora era precisamente el momento de saldar el odio del siglo pasado y la deuda de sangre.\n\nSus posturas eran demasiado distintas como para coexistir dentro de una sola organización, y este conflicto amenaza con devorar a Arius entero. ¿Cuándo podrá sellarse esta grieta? ¿O su desenlace no será más que otro colapso?"

