 # Decisiones (Decisions) y categorías
 TRK_election_campaign_cat: "Primera elección de Trinity"
 TRK_election_campaign_cat_desc: "Tras la reforma de la nueva constitución, Trinity celebró elecciones libres para elegir a la Host. Estas elecciones tienen un gran significado al ser las primeras elecciones libres desde Misono Mika. En estos comicios se corregirá la democracia representativa, devastada en Trinity.\n\nActualmente, [TRK_election_potent]  ([?TRK_SU_var|C0], [?TRK_ST_var|O0], [?TRK_FI_var|Y0], [?TRK_SH_var|L0])"
 TRK_eden_collapse_decision_category: "Colapso del Organismo de Gestión de Edén"
 TRK_eden_collapse_decision_category_desc: "El Organismo de Gestión de Edén era el gobierno militar de Trinity por parte de Gehenna, pero el gobierno de Gehenna colapsó por completo antes de que la ocupación concluyera. Al quedar claro que el gobierno militar ya no puede sostenerse, los burócratas de Gehenna en el Organismo de Edén están discutiendo con nosotros la integración. Como su gobierno central ya ha colapsado, no existe ninguna posibilidad de que puedan resistirse."
 TRK_eden_collapse_decision: "Transferencia de jurisdicción"
 TRK_eden_collapse_decision_desc: "Recibimos la jurisdicción del gobierno militar. [TRK.GetLeader] firmará el acuerdo."

