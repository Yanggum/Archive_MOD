 TRK_lobbying_corp_ns: "Lobby empresarial"
 TRK_lobbying_corp_ns_desc: "Las grandes empresas están presionando al gobierno para derogar la ley antimonopolio."
 TRK_democratic_government_ns: "Gobierno democrático naciente"
 TRK_weaks_democratic_government_ns: "Gobierno democrático débil"
 TRK_strong_democratic_government_ns: "Gobierno democrático fuerte"

