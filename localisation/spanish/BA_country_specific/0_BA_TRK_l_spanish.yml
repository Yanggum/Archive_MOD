 # Enfoques económicos
 TRK_trinity_capital_forced_dissolution: "Disolución forzosa del gran capital trinitario"
 TRK_trinity_capital_forced_dissolution_desc: "Es evidente que el nacimiento del régimen extremista de Trinity se sostuvo gracias al abundante apoyo de lobby por parte de grandes capitalistas vinculados a Trinity y empresarios alemanes, y que innumerables prácticas de expoliación del gran capital sirvieron para mantener en marcha la maquinaria de guerra trinitaria. Para impedir el surgimiento de un segundo régimen extremista, debemos desmantelar las megacorporaciones capaces de ejercer poder político por cuenta propia."
 TRK_currency_reform: "Reforma monetaria"
 TRK_currency_reform_desc: "La enorme cantidad de moneda emitida por Trinity ha visto su credibilidad gravemente destruida por la guerra y por los bonos del Estado emitidos durante el conflicto. Debemos avanzar con determinación en una reforma monetaria: confiscar la moneda antigua y emitir una nueva."
 TRK_forced_labor_management_reconciliation: "Forzar la cooperación obrero-patronal"
 TRK_forced_labor_management_reconciliation_desc: "Para frenar que el gran capital se imponga unilateralmente sobre la voluntad de las masas en la política, forzaremos la participación de los trabajadores en la dirección de las empresas."
 TRK_strong_small_economy: "Economía de pequeños gigantes"
 TRK_strong_small_economy_desc: "La economía de la nueva Trinity no se sostendrá sobre enormes conglomerados, sino sobre pymes y empresas medianas: pequeñas, eficientes y poderosas. Se espera que esto, por su propia estructura, inhiba el surgimiento del extremismo en el futuro."
 TRK_reversal_of_brain_drain: "Revertir la fuga de cerebros"
 TRK_reversal_of_brain_drain_desc: "Revertiremos la ‘fuga de cerebros’ que expulsó al extranjero a numerosos talentos y científicos bajo el régimen extremista de Trinity, invitándolos de vuelta para reimpulsar la innovación trinitaria."
 TRK_prohibition_of_the_second_extremism: "Impedir el segundo extremismo"
 TRK_prohibition_of_the_second_extremism_desc: "Reparar rápidamente las zonas residenciales y carreteras devastadas tras la guerra, y abastecer nuevos barrios de vivienda barata, aumentará la confianza en nuestro gobierno e impedirá que germine un segundo extremismo."
 TRK_eden_academy: "Academia Edén"
 TRK_eden_academy_desc: "La Academia Edén tendrá el papel de resucitar la innovación científica de Trinity y, a la vez, cumplir una función de ‘depuración’ para restaurar una cultura cívica sana, contaminada por el viejo régimen extremista."
 TRK_restoration_of_collapsed_industry: "Reconstruir la industria colapsada"
 TRK_restoration_of_collapsed_industry_desc: "Reanudaremos inversiones industriales que se detuvieron hace tiempo, propagandizando que la industria de la economía alemana se aleja del colapso y se recupera, devolviendo a su cauce las curvas de empleo y crecimiento."
 TRK_social_market_economy: "Economía social de mercado"
 TRK_social_market_economy_desc: "Hemos presenciado el final de una era, y debemos aceptar que el libre mercado absoluto ya no existe. Bajo un ‘capitalismo de orden’, el Estado fijará las reglas del mercado y trazará una línea de salida justa, orientando la fuerza del mercado hacia el bien público de la sociedad."

 # ================================================
 # 3. Espíritus nacionales (National Spirits)
 # ================================================
 TRK_economic_collapse_ns: "Residuos del Departamento de Desarrollo Económico de la Academia"
 TRK_economic_collapse_ns_desc: "El Departamento de Desarrollo Económico de la Academia, creado bajo el liderazgo de Misono Mika, hundió por completo la economía de Trinity. Tras su disolución, las empresas gestionadas directamente por la academia —hinchadas hasta el exceso— cayeron en un caos total. Algunas compañías alemanas recuperaron a sus antiguos propietarios o fueron recompradas a precio de remate. Sin embargo, todavía una parte considerable de empresas y fábricas requiere reestructuración."
 TRK_gehenna_puppet: "Administración militar de Gehenna"
 TRK_gehenna_puppet_desc: "Fuimos derrotados en la guerra contra Gehenna, y la administración militar permanece en el territorio de Trinity. Somos independientes solo de nombre."
 TRK_gehenna_puppet_next: "Administración civil de Gehenna"
 TRK_gehenna_puppet_next_desc: "La administración militar de Gehenna, representada por el organismo de gestión de Edén, se vio obligada a cambiar de forma drástica tras la unificación de Gehenna, al desaparecer uno de sus principales padrinos políticos. El resultado fue el establecimiento de una administración civil oficial de Gehenna, bajo la cual se nos ha devuelto una autonomía considerable."

 TRK_industry_ns: "La nueva industria trinitaria"
 TRK_industry_ns_desc: "Tal como se discutió al fundarse el antiguo organismo del tratado, se impulsará una descentralización para impedir que, en la economía de Trinity, un gran capital concentrado vuelva a dominar la política de manera unilateral. Hemos emprendido la larga tarea de quebrar o nacionalizar los conglomerados sobredimensionados y dividirlos en unidades económicas más pequeñas."

 TRK_freedom_of_religion_ns: "Libertad religiosa"
 TRK_new_trinity_capitalism_ns: "Nuevo capitalismo trinitario"
