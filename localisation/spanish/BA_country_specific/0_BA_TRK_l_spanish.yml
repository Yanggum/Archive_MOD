 # ================================================
 # 4. Eventos (Events)
 # ================================================
 # Eventos iniciales / generales
 TRK_events.1.t: "[TRK.GetName]"
 TRK_events.1.desc: "Cuando el polvo se asentó, un nuevo gobernante entró en los territorios que Trinity dominaba. Un vencedor que nadie puede negar: la Academia Gehenna. La [TRK.GetName] administrada en forma de gobierno militar tiene objetivos claros: reconstruir las tierras devastadas por la guerra Gehenna–Trinity y construir una nueva Trinity verdaderamente libre, no un régimen violento y opresivo como el pasado. Claro, con la condición de que todo ocurra bajo la vigilancia de Gehenna.\n\nEn estos momentos, el gobierno militar de Gehenna está ejerciendo una fuerte presión sobre la administración provisional: elegir de nuevo el poder legislativo, convocar una asamblea constituyente y revisar una nueva constitución. Además, exige que se elija a la Host mediante procedimientos democráticos. Nos guste o no, pronto habrá una nueva constitución y elecciones. El destino de Trinity está ahora en manos de sus ciudadanos."
 TRK_events.1.a: "Entendido."

 TRK_events.2.t: "Período electoral en Trinity"
 TRK_events.2.desc: "La constitución ha sido reformada y Trinity celebrará pronto elecciones. Se trata de unos comicios de enorme significado: las primeras elecciones libres desde Misono Mika. La comisión electoral ha registrado un total de cuatro candidaturas y facciones, es decir, partidos.\n\nLa primera es la facción popular llamada “Coalición Estudiantil de Trinity”, encabezada por Urawa Hanako. La segunda es Yurizono Seia, quien fue considerada víctima de un trágico asesinato, pero ha reconstruido la Orden de los Caballeros del Santo Sepulcro y la desmoronada facción Sanctus para volver a aspirar al cargo de Host. La tercera es Kirifuji Nagisa, quien estuvo encarcelada por Misono Mika, pero fue liberada cuando Gehenna avanzó sobre Edén y la Manmajun junto con el Comité Disciplinario la sacaron de su cautiverio; su narrativa heroica le ha dado la mayor popularidad entre estudiantes y masas. Por último, aunque carga con el apodo despreciable de “lacaya de la facción Pater”, Utazumi Sakurako y la Sisterhood —la mayor representante del cristianismo trinitario— se presentan a estas elecciones.\n\nLas elecciones de Trinity se realizan eligiendo a la Host y, al mismo tiempo, los escaños del Tea Party. Cuando terminen, independientemente del resultado, Gehenna pondrá fin al gobierno militar y transferirá el poder por completo a un gobierno civil, aunque seguirá manteniendo una influencia enorme. Las principales facciones de Trinity se preparan con fervor: llenan cargos, reúnen fondos y se esfuerzan por reconstruir su organización e ideología. A diferencia de un ciclo electoral común en el que no se eligen todos los cargos a la vez, todo el mundo sabe lo crucial que es la elección de [GetYear], donde están en juego todos los escaños del Tea Party."
 TRK_events.2.a: "¡La democracia se ha hecho realidad!"

 TRK_events.3.t: "La cuestión del derecho al voto de los alemanes"
 TRK_events.3.desc: "El derecho de sufragio de los alemanes ha sido, desde hace mucho, un problema recurrente. Durante el gobierno de Misono Mika se garantizó el voto para los alemanes, aunque de manera muy limitada. Tras la derrota, sin embargo, las voces de los alemanes locales han crecido, y el tema ha vuelto a ponerse sobre la mesa.\n\nPor supuesto, queda la duda de hasta dónde debe garantizarse su participación política. Aún es una decisión abierta si se mantendrá un sufragio y elegibilidad limitados al estilo de Misono Mika, o si se otorgará un reconocimiento pleno. Con el tiempo, no tendremos más remedio que debatirlo; hacerlo desde ahora tampoco sería necesariamente malo."
 TRK_events.3.a: "Esto lo discutiremos más adelante."
 TRK_events.3.b: "Dejemos establecido en la constitución el sufragio de los alemanes."

 TRK_events.4.t: "¿La religión de Peroro?"
 TRK_events.4.desc: "Dentro de la solemne capilla, cientos de velas arden mientras resuena un majestuoso órgano de tubos. Pero en el centro del altar no había una Virgen, sino un “Muñeco gigante edición limitada de Peroro guiñando el ojo (Ver. colaboración Kaitenger)”.\n\nLas estudiantes con túnicas no sostenían Biblias, sino barras luminosas (penlights), y la luz de las velas iluminaba desde abajo, de forma inquietante, el rostro tonto y adorable de Peroro.\n\n“¡Oh... Señor Peroro... a tu lengua juguetona encomendamos nuestras almas...!”\n“¡Que el sorteo del merch... nos conceda la gracia de ‘ganar’!”\n“¡Pero! ¡Pero! ¡Pero!”\n\nEntonces, desde detrás del altar, una chica de alas blancas retrocedía con sudor frío. Sobre la cabeza llevaba un sombrero de ‘Sumo Sacerdotisa’, como si se lo hubieran encasquetado a la fuerza.\n\n“P-perdón... yo solo vine porque me dijeron que era un intercambio de merch de edición limitada... ¿por qué el ambiente se volvió religión? ¿Y podrían quitarme este sombrero?”\n\n“¡Mirad! ¡Nuestra ‘Fausto’ ha recibido la revelación del dios Peroro!”\n“¡¡Uooooo!! ¡Fausto! ¡Fausto!”\n\n“¡Que no—!”\n\nAlguien lo denunció y el Comité de Justicia intervino. El grupo religioso quedó sujeto a una investigación sencilla y, durante el decomiso, se halló un objeto inesperado: sorprendentemente, la lista de bienes incautados incluía 400 muñecos de Peroro."
 TRK_events.4.a: "¡Pero! ¡Pero! ¡Pero!"

 TRK_events.5.t: "Independencia del organismo de gestión"
 TRK_events.5.desc: "El teléfono no deja de sonar. La fax escupe hojas como una cascada, y por la ventana se ven camiones enviados de urgencia desde el territorio central de Gehenna levantando nubes de polvo al entrar en fila.\n\n“¿Qué es todo esto? ¿Shuttles tácticos 168? ¿Un batallón de artillería de campaña de última generación que debería estar en la metrópoli? ¡¿Y este documento?!”\n\nEn el papel que el administrador sostuvo con manos temblorosas, el título era inconfundible: **Orden administrativa de emergencia N.º 66: Transferencia de autonomía al Organismo del Tratado de Edén y adscripción permanente de activos**. Con la guerra civil en Gehenna inclinándose hacia la derrota, decidieron que, antes de entregar recursos a la facción enemiga, preferían volcarlo todo aquí.\n\nLos depósitos están a punto de reventar de tanques y suministros desviados desde el corazón del país. Sobre el escritorio, se amontonan cláusulas de “garantía de autonomía” diseñadas en capas y capas para que ni siquiera un gobierno unificado y victorioso de Gehenna pueda tocarlas con facilidad. Hasta ayer éramos un simple organismo de ocupación que miraba de reojo a la metrópoli. De la noche a la mañana, nos hemos convertido en la administración “independiente” mejor armada de Kivotos.\n\nEsto no es un regalo. Es la última maldición —y una trampa nauseabunda— de los derrotados: que sobrevivamos enfrentándonos al gobierno vencedor de la metrópoli. ¿Pero qué otra opción tenemos? El motor de los tanques ya está en marcha, y el sello del documento ya se secó."
 TRK_events.5.a: "El reloj avanza con un tictac urgente."

 TRK_events.6.t: "Independencia del organismo de gestión"
 TRK_events.6.desc: "El informe de ocupación llegó al escritorio. Pero las cifras reportadas diferían de forma absurda de lo esperado.\n\n“Captura completa de los almacenes militares clave. Sin embargo, el interior está vacío. No queda material.”\n\nLo que encontraron las tropas al entrar fueron marcas caóticas de neumáticos de camiones que salieron a toda prisa, y unas cuantas hojas de albaranes que no alcanzaron a quemar. Tras rastrear la ruta, se confirmó que el enorme volumen de tanques, artillería y suministros esenciales desaparecidos había sido trasladado de emergencia a la zona fronteriza bajo la administración del “Organismo del Tratado de Edén (ETO)”.\n\nCon la derrota cercana, la facción opositora prefirió explotar un vacío del tratado para “transferir” sus activos a una tercera zona antes que permitir que el gobierno unificado absorba esos recursos y se fortalezca. Al volcar allí el material junto con documentos de cesión de autonomía, convirtieron el área administrada por ETO en una fortaleza a la que la metrópoli no puede imponer su control.\n\nEs el último manotazo de los vencidos, una venganza mezquina. Ganamos la guerra civil, pero a cambio, nos colocaron bajo la garganta una bomba de tiempo: un ‘distrito autónomo desobediente’ fuertemente armado."
 TRK_events.6.a: "El reloj avanza con un tictac urgente."

 TRK_events.7.t: "¿Una oportunidad?"
 TRK_events.7.desc: "Tras la guerra civil y los choques entre academias de Gehenna, el Organismo de Gestión de Edén, que comparte frontera con nosotros, parece haber caído en una posición administrativa temporalmente desprotegida; o peor aún, en un estado cuasi independiente.\n\nEn otras palabras: si, por los objetivos de la Rama de Arius, exigimos con firmeza que devuelvan el territorio de soberanía de Arius, es probable que se vean obligados a aceptarlo. Aún no se han rearmado, y están concentrados en fortificar la frontera con Gehenna; difícilmente podrán permitirse una amenaza en la retaguardia."
 TRK_events.7.a: "Bien. Enviad el ultimátum."
 TRK_events.7.b: "No… Gehenna probablemente intervendrá."

 TRK_events.8.t: "El ultimátum de la Rama de Arius"
 TRK_events.8.desc: "Parece que la Rama de Arius ve el incidente del Organismo de Gestión de Edén como una oportunidad. Nos han enviado un ultimátum exigiendo la cesión de un territorio cercano a Danzig que consideran propio, y aparentan estar preparando una invasión contra nuestra academia en la frontera."
 TRK_events.8.a: "No hay alternativa. Debemos defender la frontera con Gehenna."
 TRK_events.8.b: "¡Rechazadlo con firmeza!"

 TRK_events.9.t: "Devolución de territorios de soberanía del Organismo de Gestión de Edén"
 TRK_events.9.desc: "Aprovechando el incidente del Organismo de Gestión de Edén, han accedido a devolver el territorio cuya soberanía exigimos. ¡Hemos anexionado la región sin ningún choque militar!"
 # (no option line provided in original)

 TRK_events.10.t: "Rechazo al ultimátum del Organismo de Gestión de Edén"
 TRK_events.10.desc: "Aprovechando el incidente del Organismo de Gestión de Edén, exigimos la devolución del territorio reclamado, pero el Organismo declaró que no existe base internacional alguna para que esa zona nos pertenezca y rechazó devolverla.\n\n¡Esta humillación diplomática —que solo puede entenderse como un desprecio a nuestra soberanía, heredera de la expulsión unilateral del antiguo concilio de la vieja Trinity— quizá nos obligue a preparar la guerra!"
 TRK_events.10.a: "¡Declarad la guerra!"
 # Eventos electorales (Election Events)
 TRK_election_events.1.t: "Discurso de Urawa Hanako"
 TRK_election_events.1.desc: "\"Ahh, prueba de micrófono... uno, dos. Je, je… Hola a todos. Soy Urawa Hanako. Hasta ahora, la política de Trinity ha sido muy pesada, ¿no? Como ropa interior que no te queda… je, je.\"\n\nLa primera en ponerse en marcha fue Urawa Hanako. Ella es la que mejor sabe que su base de apoyo es débil, así que desde el principio trazó una estrategia: moverse con intensidad y dar a conocer su presencia.\n\nPor suerte, parece que funcionó. El discurso de Urawa Hanako se difundió rápidamente a través de redes sociales."
 TRK_election_events.1.a: "¡Los ciudadanos se entusiasmaron con el discurso de Urawa Hanako!"
 TRK_election_events.1.b: "Los ciudadanos se sintieron incómodos por las obscenidades."

 TRK_election_events.2.t: "La facción Sanctus y la Orden de Socorro"
 TRK_election_events.2.desc: "La facción Sanctus sufrió una gran fractura tras el intento de asesinato de Yurizono Seia. Después de Misono Mika, Yurizono Seia, sus seguidores y la Orden de Socorro están levantando de nuevo a una facción que se venía abajo.\n\nLa Orden de Socorro, guiada por las convicciones de su comandante Aomori Mine, se había mantenido relativamente alejada de la política. Sin embargo, la aparición de Misono Mika y la guerra contra Gehenna les dejó un cierto sentido de responsabilidad: su desinterés por la política también contribuyó, en parte, a que ocurriera esta situación. Por ello, ejercen cierta influencia política, aunque limitándose a apoyar de manera indirecta a la facción Sanctus.\n\nEntre los ciudadanos de Trinity, se ha formado una base de apoyo moderada, basada sobre todo en las buenas obras históricas de la Orden de Socorro y la simpatía hacia Yurizono Seia."
 TRK_election_events.2.a: "¡Una estrategia ejemplar!"

 TRK_election_events.3.t: "Protesta anti-Gehenna"
 TRK_election_events.3.desc: "El hecho de haber sido derrotados por Gehenna supuso, naturalmente, un golpe enorme para los estudiantes de Trinity. Se han celebrado con frecuencia protestas contra el gobierno militar de Gehenna, y continuaron incluso cuando Kirifuji Nagisa recorría el Distrito Central haciendo campaña y pronunciando un discurso. El lugar se volvió caótico de golpe; los partidarios de Kirifuji Nagisa chocaron con los manifestantes anti-Gehenna y pronto estallaron los golpes.\n\nKirifuji Nagisa se quedó algo desconcertada, pero se recompuso y empezó su discurso revelando su temple."
 TRK_election_events.3.a: "Kirifuji Nagisa calmó la situación con su carisma."
 TRK_election_events.3.b: "Kirifuji Nagisa no logró calmar la situación."

 TRK_election_events.4.t: "Actividad caritativa de la Sisterhood"
 TRK_election_events.4.desc: "La Sisterhood se presenta a las elecciones presidenciales, pero en esencia sigue siendo un grupo eclesiástico basado en el cristianismo. Naturalmente, siempre han realizado labores de caridad. Durante la campaña electoral, esa caridad no se detuvo; quizá incluso aumentó un poco.\n\nPor supuesto, no es que estas actividades estén libres de controversia: se percibe, aunque sea ligeramente, la intención de ampliar su influencia política mediante la caridad. Utazumi Sakurako afirmó que se trata de acciones basadas en principios cristianos y por tanto ajenas a la política, pero nadie sabe cuáles son sus verdaderas intenciones."
 TRK_election_events.4.a: "Bueno… es libertad, ¿no?"
 TRK_election_events.4.b: "Limitemos temporalmente la caridad."

 TRK_election_events.5.t: "La elección de los ciudadanos alemanes"
 TRK_election_events.5.desc: "En estas elecciones, donde a los alemanes se les garantiza —aunque de forma limitada— el derecho de participación política, ¿hacia dónde se inclinarán sus corazones? Al menos, no hacia la Sisterhood, que colaboró con la facción Pater y con Misono Mika.\n\nCon la ampliación del derecho político, los candidatos están promoviendo políticas dirigidas a los alemanes locales. Urawa Hanako, por ejemplo, defiende la igualdad plena de derechos; y tampoco olvida la protección de minorías. Del mismo modo, las demás facciones han elaborado, en cierta medida, políticas para los alemanes."
 TRK_election_events.5.a: "¡Los alemanes eligieron un partido local!"
 TRK_election_events.5.b: "¡Eligieron a la Coalición Estudiantil!"
 TRK_election_events.5.c: "¡Eligieron a la facción Sanctus!"
 TRK_election_events.5.d: "¡Eligieron a la facción Filius!"

 TRK_election_events.6.t: "Yurizono Seia, envuelta en controversia"
 TRK_election_events.6.desc: "Se ha difundido que el acuerdo entre Yurizono Seia y la Orden de Socorro contribuyó enormemente a la llegada al poder de Misono Mika, y ahora se exige una explicación tanto a la facción Sanctus como a la Orden de Socorro.\n\nMuchos han concluido que, si Yurizono Seia hubiera reaparecido sin hacer ese trato, podría haber frenado el descontrol de Misono Mika. Los ciudadanos de Trinity están exigiendo una explicación con fuerza."
 TRK_election_events.6.a: "Yurizono Seia logró apagar la controversia."
 TRK_election_events.6.b: "Yurizono Seia no logró apagar la controversia."

 TRK_election_events.7.t: "Fiebre por la Coalición Estudiantil"
 TRK_election_events.7.desc: "El Tea Party tradicional era rígido, aislado del exterior y no reflejaba adecuadamente la voluntad estudiantil. Por eso, los estudiantes de Trinity se entusiasmaron de forma natural con Urawa Hanako y la Coalición Estudiantil, que enarbolan banderas como la justicia y la transparencia.\n\nParece que Urawa Hanako también sabe explotar bien esa imagen. Sobre todo, después del fracaso del “populismo” de Misono Mika, los estudiantes muestran más interés en las decisiones políticas y expresan con más fuerza sus opiniones; como si se hubiera abierto una nueva página en la política de Trinity."
 TRK_election_events.7.a: "Interesante."
 TRK_election_events.7.b: "Hay que encontrar una forma de obstaculizarlos."

 TRK_election_events.8.t: "Unidos por la fe"
 TRK_election_events.8.desc: "La campaña de la Sisterhood se apoya en el lema: “Una Trinity de la que podamos volver a sentirnos orgullosos”. Mientras llenan lentamente el vacío de base electoral que dejó la facción Pater, la Sisterhood está creciendo con rapidez.\n\nEn especial, subrayan con fuerza la doctrina cristiana, lo cual ha provocado que parte de la población local también les brinde cierto apoyo. Además, la Sisterhood está saliendo de la sombra de la facción Pater: se oponen explícitamente a la violencia política y a los actos ilegales, y lo llevan a la práctica, recuperándose poco a poco de un pasado que les ganó el rechazo de muchos estudiantes."
 TRK_election_events.8.a: "¿Una nueva forma de conservadurismo trinitario?"

 TRK_election_events.9.t: "El hijo pródigo"
 TRK_election_events.9.desc: "Durante el gobierno de Misono Mika, varios dirigentes de otras facciones se unieron a la facción Pater; entre ellos, también había cuadros provenientes de la facción Filius, como Nagayoshi Subaru o Yamamoto Nana.\n\nAhora quieren regresar a la facción Filius, y la mayoría busca volver a la política. Si cometieron crímenes en la era de Misono Mika, serán investigados y juzgados, pero en el seno de Filius se debate cómo tratar a estos ‘hijos pródigos’: oportunistas que se unieron a Pater y ahora pretenden volver a su antigua facción."
 TRK_election_events.9.a: "Permitir el regreso."
 TRK_election_events.9.b: "No hay lugar para concesiones."

 TRK_election_events.10.t: "El final de la campaña"
 TRK_election_events.10.desc: "La jornada electoral está muy cerca. La campaña también entra en su tramo final. Con puntos fuertes y débiles claros en cada candidatura, ¿quién habrá cerrado mejor?"
 TRK_election_events.10.a: "Coalición Estudiantil"
 TRK_election_events.10.b: "Facción Sanctus"
 TRK_election_events.10.c: "Facción Filius"
 TRK_election_events.10.d: "Sisterhood"

 TRK_election_events.11.t: "¡Resultados electorales!"
 TRK_election_events.11.desc: "La intensa campaña ha terminado, y las elecciones también han concluido. Mientras cada candidatura observa el conteo en su centro de mando, toda la atención de Trinity se concentra allí.\n\n¿Quién encabezará la próxima etapa de Trinity? Sea quien sea, le espera un camino duro. El legado que dejó Misono Mika enfermó a Trinity. Sanar este pánico podría llevar años, o incluso más.\n\nSin embargo, incluso en esa oscuridad, existe una luz de esperanza. Los estudiantes de Trinity recuperaron una libertad preciosa: tienen un líder elegido con sus propias manos, un parlamento que funciona de verdad, y ya no están a merced de la ilegalidad y la violencia. Esto es, precisamente, el inicio de la verdadera democracia.\n\nCon el anuncio del conteo a punto de publicarse, todas las miradas están puestas en un solo punto. ¿Quién será la próxima Host de Trinity…?"
 TRK_election_events.11.a: "¡Urawa Hanako, de la Coalición Estudiantil!"
 TRK_election_events.11.b: "¡Yurizono Seia, de Sanctus!"
 TRK_election_events.11.c: "¡Kirifuji Nagisa, de Filius!"
 TRK_election_events.11.d: "¡Utazumi Sakurako, de la Sisterhood!"
 TRK_election_events.11.e: "Mensaje del desarrollador"

 TRK_election_events.12.t: "Discurso de investidura de la Host"
 TRK_election_events.12.desc.hanako: "\"Je, je… Nunca imaginé que elegirían a alguien como yo… Ser la Host de Trinity… Vaya, solo escucharlo ya suena… emocionante, ¿no?\"\n\nUrawa Hanako y la Coalición Estudiantil se impusieron sobre las demás facciones y recibieron la elección de los ciudadanos.\n\nUrawa Hanako es una figura de carácter reformista y progresista. Desde hace tiempo, guardaba un profundo descontento hacia las viejas costumbres de Trinity. Con el ascenso de Misono Mika, la situación llegó al límite, y al final Hanako no tuvo más remedio que abandonar Trinity y desaparecer.\n\nPero llegó un punto de inflexión. Tras la derrota, comenzó el gobierno militar de Gehenna, y también se abrieron elecciones en Trinity. En medio de este cambio, Hanako descubrió una nueva posibilidad: la esperanza de que Trinity también podía cambiar.\n\nAhora, tras asumir el cargo de Host con la confianza y el apoyo de los estudiantes de Trinity, se abre ante ella un nuevo futuro. El pasado oscuro y sofocante de Trinity, como una guarida de víboras, desaparecerá por fin en la historia."
 TRK_election_events.12.a: "¡Felicidades, Urawa Hanako!"

 TRK_election_events.12.desc.seia: "\"Que ustedes me hayan elegido significa que confían en mí, ¿verdad? Je, je. Haré lo posible por estar a la altura de esa expectativa.\"\n\nYurizono Seia y la facción Sanctus se impusieron sobre las demás y recibieron la elección de los ciudadanos.\n\nYurizono Seia posee a la vez rasgos progresistas y conservadores. No es fácil definir con precisión su ideología, pero hay algo claro: nadie puede negar que es reformista. Para transformar Trinity, convencerá y negociará. Si hace falta, tampoco dudará en empujar con firmeza.\n\n¿Qué clase de Trinity intenta construir? Cuesta incluso imaginarlo. Su peculiar forma de ser, casi de otra dimensión, podría reflejarse también en las políticas del Estado. Pero hay algo seguro: se ha elegido una nueva Host, y los ciudadanos están satisfechos con esa elección.\n\nEl cambio de Trinity ya ha comenzado. Nadie sabe si se filtrará poco a poco o si se desatará como un vendaval."
 TRK_election_events.12.b: "¡Felicidades, Yurizono Seia!"

 TRK_election_events.12.desc.nagisa: "\"La suma de su valiosa confianza me ha dado una nueva oportunidad. En este lugar donde se disipó la niebla de la sospecha, prometo cumplir mis deberes como Host… para que sus sonrisas, las que tengo ante mí, jamás se rompan.\"\n\nKirifuji Nagisa y la facción Filius se impusieron sobre las demás facciones y recibieron la elección de los ciudadanos.\n\nKirifuji Nagisa busca la estabilidad de Trinity y una reforma gradual. Su liderazgo y carisma —capaces de negociar, transigir y aun así llevar la iniciativa— fueron una de las razones por las que Trinity pudo sobrevivir incluso en medio del fenómeno de la Traslación.\n\nAunque no logró detener el golpe palaciego de Misono Mika y la tragedia se desató, la entrega que demostró en el proceso se convirtió en una narrativa heroica. Eso desembocó en su victoria electoral en la posguerra.\n\nTrinity recuperará la estabilidad de antes de Misono Mika. Los estudiantes están agotados del caos y desean volver a la normalidad. Ese anhelo eligió a Kirifuji Nagisa. Su enfoque pragmático aportará un desarrollo sostenible sobre una base estable. No necesitamos cambios radicales: la reforma prudente es lo que Trinity requiere ahora."
 TRK_election_events.12.c: "¡Felicidades, Kirifuji Nagisa!"

 TRK_election_events.12.desc.sakurako: "\"En el pasado, la Sisterhood se coludió con una autoridad equivocada y se convirtió en una sombra que oprimía su libertad y les imponía silencio. Aun con esa culpa y ese estigma imborrables, acataré con humildad la voluntad de ustedes al encomendarme esta pesada misión. Como Host, no convertiré sus voces en una mera formalidad, sino en mi escritura sagrada, y serviré desde el lugar más bajo…\"\n\nUtazumi Sakurako y la Sisterhood se impusieron sobre las demás facciones y recibieron la elección de los ciudadanos. La Sisterhood, que fue la sombra de Misono Mika, vuelve a sostener el poder una vez más. Antes eran la sombra del gobierno; ahora, cargando con el karma del pasado, han salido a la luz pública.\n\nSakurako busca proteger, mantener y reforzar los valores religiosos en un contexto cambiante. Por supuesto, no pretende imponerlos de manera rígida. (Texto original truncado aquí.)"
 TRK_election_events.12.d: "¡Felicidades, Utazumi Sakurako!"

 TRK_election_events.13.t: "¡Reclutamiento de selección ★3!"
 TRK_election_events.13.desc: "§BTras comprar el ticket de selección ★3, elige una estudiante.§!\nPodrás seleccionar una estudiante desde el menú de selección de estudiantes antes de que expire el ticket de intercambio.\n£white_dot Si eliges una estudiante que ya reclutaste, se convertirá en Eligma y Eleph de esa estudiante."
 TRK_election_events.13.a: "Urawa Hanako"
 TRK_election_events.13.b: "Yurizono Seia"
 TRK_election_events.13.c: "Kirifuji Nagisa"
 TRK_election_events.13.d: "Utazumi Sakurako"

 # Eventos de ambientación (Flavor Events)
 TRK_flavor_events.1.t: "¿Cuál fue el error de 1936?"
 TRK_flavor_events.1.desc: "Una catástrofe sin precedentes: el intento de asesinato de Yurizono Seia; la elección de Misono Mika como Host; la quinta reforma constitucional integral de la Academia General Trinity; y hasta la guerra contra Gehenna… La mala suerte de Trinity empezó con Misono Mika y terminó con Misono Mika.\n\nSin embargo, el legado que dejaron Misono Mika y sus terroristas enfermó a toda Trinity. Los estudiantes ya no creen en el Tea Party y lo miran con desconfianza. Además, la resistencia de los cuadros remanentes de la facción Pater está difundiendo por toda Trinity teorías conspirativas baratas: que había una fuerza oculta detrás, que la facción Filius y Sanctus nos sabotearon, que el Comité de Justicia no cumplió con su deber, y otras tonterías.\n\nPero hemos obtenido una nueva oportunidad de enderezar la historia. Claro, es una oportunidad nacida bajo la vigilancia de una fuerza externa, no por nuestra propia mano. Aun así, no debemos conformarnos con la realidad. Aunque la academia siga bajo la mirada del gobierno militar de Gehenna, debemos prevenir otro caso como el de Misono Mika. No es una opción: es una misión que nos impone la época."
 TRK_flavor_events.1.a: "\"Ni siquiera quedarse tranquilo es tan fácil.\""

 TRK_flavor_events.2.t: "El futuro de la facción Sanctus"
 TRK_flavor_events.2.desc: "Con Yurizono Seia despierta, la facción Sanctus avanzaba en su reconstrucción bajo su liderazgo. En el proceso, Seia, sus seguidores, algunos cuadros de tendencia progresista e incluso veteranos se sumaron, y Sanctus fue recuperando el aspecto que tenía antes de Misono Mika.\n\nTras el atentado fallido contra Yurizono Seia, su ‘ojo para ver el futuro’ se cerró. Sin su poder profético, Seia se vio perseguida por un complejo de inferioridad: sentía que ya no servía para nada. Pero mientras reconstruía la facción —convenciendo a veteranos y a dirigentes progresistas, moviéndose con sus propios pies y atravesando múltiples incidentes— recuperó su autoestima, y su antigua actitud cínica y pesimista se curó por completo.\n\nLa facción Sanctus obtuvo además una gran alianza: la Orden de Socorro, comandada por Aomori Mine. El trato con Mine bastó para acercarlas, y ahora ambas facciones se necesitan mutuamente. Esta alianza quizá no sea eterna, pero por un tiempo será sólida."
 TRK_flavor_events.2.a: "\"Así es: todos los caminos, al final, se unen en uno.\""

 TRK_flavor_events.3.t: "Urawa Hanako vuelve a la actividad"
 TRK_flavor_events.3.desc: "Tras la llegada al poder de Misono Mika, ella había desaparecido sin dejar rastro… pero ahora ha vuelto a mostrarse. Por supuesto, a su estilo: apareció con un nuevo atuendo revelador, y Shimoe Koharu la redujo, devolviendo otra vez la escena a la ‘normalidad’ cotidiana.\n\n¿Cuál es exactamente el motivo de su regreso? Shimoe Koharu, que tenía cierta cercanía con ella, le preguntó varias veces, pero nunca obtuvo una respuesta clara. Aun así, si juntamos los acontecimientos recientes, quizá se vea un contorno.\n\nNo se sabe si pretende el puesto de Host o si trama algo distinto. Ella siempre fue excepcional, y parece difícil que alguien comprenda del todo el corazón de esa chica."
 TRK_flavor_events.3.a: "Un deseo sincero"

 TRK_flavor_events.4.t: "La compostura de las Sisters"
 TRK_flavor_events.4.desc: "Sisterhood. ¿Por dónde empezar para describirlas? Si hubiera que elegir la facción con la posición más ambigua en la Trinity actual, lo primero que vendría a la mente sería la Sisterhood. Las Sisters, que pactaron con Misono Mika y se convirtieron en lacayas del Tea Party, hoy son despreciadas por los ciudadanos y por quienes creen en el cristianismo trinitario.\n\nTras la derrota, la Sisterhood aún exhibe su presencia apoyándose en la enorme fuerza de Trinity Christianity. Pero, ¿qué pueden hacer realmente? Para volver atrás, ya han caminado demasiado. Al menos, renovar su imagen requerirá mucho tiempo."
 TRK_flavor_events.4.a: "…aunque, pensándolo bien, yo misma ya estoy en una situación en la que pacté con el pecado."

 TRK_flavor_events.5.t: "‘Host’ Urawa Hanako"
 TRK_flavor_events.5.desc: "\"Host, el calendario del consejo de ministros.\"\n\n\"Oh, que me lo traigas en persona… Qué aplicada eres.\"\n\n\"Host, el informe de asuntos prioritarios.\"\n\n\"Ah, justo lo estaba esperando. Gracias.\"\n\nTras un intercambio de palabras burocráticas, la puerta se cerró y la sonrisa perfecta en los labios de Urawa Hanako se desvaneció un poco. Desde que fue elegida Host, su día a día giraba sin darle un solo respiro.\n\nEstaba preparada hasta cierto punto, pero la realidad superó cualquier imaginación. Documentos de aprobación apilándose sin fin, ceremonias protocolares… Extrañaba aquellos días en que podía arrancarse de encima este uniforme y estas obligaciones asfixiantes, y deambular por la noche con libertad, sin llevar ni un hilo encima.\n\nHanako apoyó la barbilla y miró por la ventana. La gente la recuerda solo como un genio imposible de descifrar, o como una excéntrica que disfruta bromas indecentes. Pero esa voz interior que realmente quiere ser comprendida no tiene a dónde llegar."
 TRK_flavor_events.5.a: "Una chica difícil de entender"

 # Eventos de noticias (News Events)
 TRK_news_events_title.1: "Urawa Hanako elegida Host del Tea Party"
 TRK_news_events_title.2: "Yurizono Seia elegida Host del Tea Party"
 TRK_news_events_title.3: "Kirifuji Nagisa elegida Host del Tea Party"
 TRK_news_events_title.4: "Utazumi Sakurako elegida Host del Tea Party"
 TRK_news_events_desc.1: "En las primeras elecciones libres celebradas en Trinity, la candidata Urawa Hanako de la Coalición Estudiantil resultó elegida. Se trata de un momento histórico en el que la voluntad popular quedó reflejada en las urnas tras la derrota de Misono Mika.\n\nLa presidenta electa Urawa Hanako prometió reformar Trinity. En su discurso, juró que jamás se repetirá un caso como el de Misono Mika. También expresó su ambición de construir una academia verdaderamente libre.\n\nLas demás candidaturas también felicitaron a la ganadora. En las elecciones generales se obtuvo un resultado similar, por lo que parece que las reformas de Hanako no perderán impulso."
 TRK_news_events_desc.2: "En las primeras elecciones libres celebradas en Trinity, resultó elegida la candidata Yurizono Seia, de la facción Sanctus. Tras la derrota de Misono Mika, el electorado volvió a escoger a una candidata procedente del Tea Party.\n\nYurizono Seia anunció una transformación de Trinity. En su discurso compartió su visión, reflexionó sobre el pasado y mostró su voluntad de cambio. Dado que en las elecciones generales la facción Sanctus obtuvo una alta proporción de votos por encima de otras facciones, se espera que sus planes avancen sin tropiezos.\n\nLas demás candidaturas también felicitaron a la presidenta electa. El tiempo dirá si los cambios en Trinity llegan como una ola repentina o como una marea gradual."
 TRK_news_events_desc.3: "En las primeras elecciones libres celebradas en Trinity, resultó elegida la candidata Kirifuji Nagisa, de la facción Filius. Tras la derrota de Misono Mika, el electorado volvió a escoger a una candidata procedente del Tea Party.\n\nKirifuji Nagisa subrayó la necesidad de un cambio gradual en Trinity. Reiteró un enfoque pragmático acorde a un mundo en transformación, y transmitió en su discurso el mensaje de reflexionar sobre el pasado y avanzar hacia el futuro.\n\nEn las elecciones generales, la facción Filius también obtuvo una alta proporción de votos, superando a las demás. Las otras candidaturas felicitaron igualmente a la presidenta electa."
 TRK_news_events_desc.4: "En las primeras elecciones libres celebradas en Trinity, resultó elegida la candidata Utazumi Sakurako, de la Sisterhood. Aunque arrastraba el estigma de haber colaborado con Misono Mika, aun así fue elegida con el respaldo de la voluntad popular.\n\nEn su discurso, la presidenta electa Utazumi Sakurako enfatizó que deben valorarse los principios conservadores. También hizo frecuentes referencias a Trinity Christianity, algo esperable considerando la naturaleza original de la Sisterhood.\n\nEn las elecciones generales, la Sisterhood también obtuvo una alta proporción de votos, superando a otras facciones. Las demás candidaturas felicitaron a la presidenta electa."
 TRK_news_events.1.a: "Opción A"
 TRK_news_events.1.b: "Opción B"
 TRK_news_events.1.c: "Opción C"

