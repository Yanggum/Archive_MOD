 TRK_government_general_leader_desc: "La guerra Gehenna–Trinity terminó con la derrota de Trinity, y los territorios que Trinity controlaba están ahora bajo el dominio de la Academia Gehenna. El gobierno militar de Gehenna, estacionado en el Distrito Central, busca colaboradores locales."

