l_spanish:
  # Tooltips
  IRE_republican_reunion_tt:0 "Si estalla la guerra civil obtendremos §Y3 divisiones§! de infantería ligera.\n§REste camino convertirá a Irlanda en comunista durante la 2.ª Guerra Civil Irlandesa.§!"
  IRE_last_gamble_tt:0 "Si estalla la guerra civil obtendremos §Y1 división§! de infantería ligera."

  # Focos
  IRE_change_the_world: "Proclamar la independencia de Irlanda"
  IRE_change_the_world_desc: "Con el Reino Unido sumido en el caos, ha llegado la hora de declarar nuestra verdadera independencia, publicar la declaración y redactar una nueva constitución."
  IRE_attack_N_ire:0 "Avanzar sobre Irlanda del Norte"
  IRE_attack_N_ire_desc: "Tras la guerra civil el IRA quedó hecho trizas, pero el caos británico le brinda una oportunidad. Aprovecharemos la retirada de las guarniciones para ocupar por la fuerza el norte y demostrar que el IRA ha renacido."
  IRE_fascism_focus:0 "Reunir el Partido Nacional Corporativo"
  IRE_fascism_focus_desc:0 "En tiempos convulsos se necesita mano dura. El Partido Nacional Corporativo encarna el nacionalismo irlandés y la determinación republicana."
  IRE_new_government:0 "Hacia un nuevo gobierno"
  IRE_new_government_desc:0 "Derribemos el Estado Libre, fruto de la traición, y forjemos la auténtica República de Irlanda. Sobre sus ruinas el IRA se alzará y preparará la guerra."
  IRE_republican_reunion:0 "Reunir al Congreso Republicano"
  IRE_republican_reunion_desc: "Separado del IRA por discrepancias, el Congreso Republicano atraviesa penurias financieras y divisiones internas, mas comparte la meta de la independencia. Cooperar acelerará nuestra causa."
  IRE_IRA_leftist_movement:0 "Viraje izquierdista del IRA"
  IRE_IRA_leftist_movement_desc0: "Con el Congreso de vuelta en el IRA, puede consumar su viejo objetivo de escorar la organización a la izquierda."
  IRE_IRA:0 "Segunda Guerra Civil Irlandesa"
  IRE_IRA_desc:0 "Todo está listo: declararemos la guerra al Estado Libre y lo derrocaremos. No debe haber tercera guerra; la preparación ha de ser perfecta. ¡Alzad las armas, patriotas!"
  IRE_expulsion_of_colonial_culture: "Erradicar la cultura colonial"
  IRE_expulsion_of_colonial_culture_desc: "Extirpemos la herencia británica y revitalicemos lo propio: aquí reside la independencia verdadera."
  IRE_vanguard: "Guardia Roja"
  IRE_vanguard_desc: "Tras la guerra civil la lucha por el poder amenaza al Congreso. Necesitamos un organismo que reprima y desarraigue a los contrarrevolucionarios."
  IRE_last_gamble:0 "El Gran Pacto"
  IRE_last_gamble_desc:0 "La liberación de Irlanda ha reunido de nuevo a los viejos republicanos militantes."
  IRE_republic_of_people:0 "República de Irlanda"
  IRE_republic_of_people_desc:0 "Anunciaremos nuestra victoria y que Irlanda pertenece, por fin, a los irlandeses."
  IRE_left_wing_expulsion:0 "Purgar a la izquierda"
  IRE_left_wing_expulsion_desc:0 "Con la guerra concluida, eliminaremos a las facciones extremistas dentro del IRA para preservar su identidad."
