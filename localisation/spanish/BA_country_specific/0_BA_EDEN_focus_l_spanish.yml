l_spanish:
 # Disparadores y flags
  Eden_alliance_created_already_TT: "Ya se ha formado la §YOrganización del Tratado de Edén§!."
  Eden_alliance_created_already_TT_NOT: "Aún no se ha formado la §YOrganización del Tratado de Edén§!."
  Eden_is_joint_focus_member_TT: "Es miembro de la §YOrganización del Tratado de Edén§!"

  # Árbol de acciones de la OTE
  Eden_formation_of_alliance_treaty_organization: "Fundar la Organización del Tratado de Edén"
  Eden_formation_of_alliance_treaty_organization_desc: "Se creará la Organización del Tratado de Edén, primer paso para superar el prolongado conflicto entre Trinity y Gehenna."

  Eden_alliance_actions: "Acciones de la alianza"
  Eden_alliance_actions_desc: "Tras la creación de la OTE como órgano de mediación, han surgido voces internas que reclaman nuevos cambios."

  Eden_united_state_Eden: "Gran integración"
  Eden_united_state_Eden_desc: "Entre los estudiantes —sobre todo jóvenes y académicos— gana fuerza la idea radical de derribar por completo las barreras entre Trinity y Gehenna."

  Eden_status_quo: "Mantener el statu quo"
  Eden_status_quo_desc: "La OTE cumple a la perfección su objetivo inicial. Es hora de afianzarla y centrarnos en conservar la situación actual."

  Eden_economic_cooperation: "Integración económica"
  Eden_economic_cooperation_desc: "El comercio interno crece; un convenio aduanero fomentará el intercambio y el desarrollo conjunto."

  Eden_deterrence_of_eastern_threat: "Contener la amenaza oriental"
  Eden_deterrence_of_eastern_threat_desc: "Europa Oriental sufre guerras constantes. Movilizaremos a toda la alianza para imponer una paz coercitiva y garantizar la seguridad."

  Eden_countering_the_old_order: "Vigilar a los antiguos estados europeos"
  Eden_countering_the_old_order_desc: "Los estados pre-Traslación ansían volver a Europa. Si mostramos debilidad, sin duda nos atacarán."

  Eden_basic_research: "Cooperación investigadora de Edén"
  Eden_basic_research_desc: "Compartir la investigación entre países miembros reducirá la brecha tecnológica y acelerará el progreso científico."

  Eden_command: "Mando integrado de la OTE"
  Eden_command_desc: "Crearemos un mando conjunto que facilite las operaciones militares y refuerce la defensa frente a invasiones externas."

  Eden_integration_of_industrial_sectors: "Integración industrial"
  Eden_integration_of_industrial_sectors_desc: "Más allá del arancel: la cooperación productiva elevará la capacidad industrial y estabilizará la economía de la alianza."

  Eden_nordic_construction_developments: "Inversión en investigación conjunta"
  Eden_nordic_construction_developments_desc: "Ampliar el Instituto Tecnológico de Edén permitirá proyectos comunes a mayor escala y un avance tecnológico más rápido."

  Eden_military_academy: "Academia Militar de Edén"
  Eden_military_academy_desc: "Una escuela de oficiales unificada facilitará la cooperación castrense y la formación de mandos para todos los miembros."

  # Espíritus nacionales
  Eden_command_ns: "Fuerzas Integradas de la OTE"
  Eden_economic_union_ns: "Unión Aduanera de la OTE"

  Eden_modifier_alliance_leader:0 "Líder de la OTE"
  Eden_modifier_alliance_member:0 "Organización del Tratado de Edén"

  Eden_research_tech_sharing_name: "Instituto Tecnológico de Edén"

  # Eventos
  Eden_event.1.t: "¡[var:global.Eden_alliance_leader.GetName] impulsa la integración de la OTE!"
  Eden_event.1.desc: "[var:global.Eden_alliance_leader.GetName] ha defendido una visión cada vez más integracionista y ahora impulsa una unión firme dentro de la OTE.\n\nLos estudiantes progresistas muestran entusiasmo, mientras que la dirección conservadora de las academias expresa su incomodidad."
  Eden_event.1.a: "La integración es necesaria."
  Eden_event.1.b: "No, es una locura colectiva; abandonaremos la organización."

  Eden_event.2.t: "[FROM.GetName] respalda la integración"
  Eden_event.2.desc: "En el gran debate sobre la integración, [FROM.GetName] ha declarado su apoyo a nuestra iniciativa."
  Eden_event.2.a: "Un paso adelante."

  Eden_event.3.t: "¡[FROM.GetName] abandona la organización!"
  Eden_event.3.desc: "En el debate sobre la integración, [FROM.GetName] ha criticado duramente la propuesta y, en nombre de su soberanía, se retira de la OTE."
  Eden_event.3.a: "Nacionalistas arrogantes."
  Eden_event.3.b: "Su gobierno claramente no es democrático."