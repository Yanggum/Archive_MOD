# Espíritus nacionales
KOR_cheonggye_idea: "Fracaso del proyecto de erradicación de fauna marina"
KOR_cheonggye_idea_desc: "Los fenómenos sobrenaturales provocados por la Gran Transición también tuvieron un fuerte impacto en Seúl, en [ROOT.GetName]. Los cangrejos gigantes antropófagos y las pirañas devoradoras de hombres que comenzaron a aparecer en el arroyo Cheonggyecheon paralizaron de facto el desarrollo de la capital a partir de 1935. Ugaki Kazushige, entonces Gobernador General de Corea en 1935, fracasó en su intento de exterminar a la fauna salvaje enloquecida por la Gran Transición, aumentando únicamente el número de víctimas inútiles.\n\nEl Gobierno General de Corea no supo hacer frente a la devastación de Seúl causada por la Gran Transición, y la tarea de resolver las pérdidas económicas y el retraso en el desarrollo industrial recae ahora en el nuevo gobierno y en [ROOT.GetLeader]."

KOR_two_languages_idea: "Sistema bilingüe"
KOR_two_languages_idea_desc: "Desde la caída del Imperio Coreano en 1910, los burócratas de la península fueron reemplazados por japoneses, y un gran número de japoneses emigró a Corea. Como resultado de este rápido desplazamiento poblacional, nuestra sociedad adoptó un sistema bilingüe. Los documentos oficiales se redactan y utilizan en japonés, y los jefes de policía locales y los funcionarios siguen siendo, en su mayoría, japoneses.\n\n¿Deberán los ciudadanos [ROOT.GetAdjective] aprender dos idiomas en aras de la armonía, o deberemos expulsar a los japoneses para desmantelar este complejo sistema bilingüe?"

KOR_two_languages_weak_idea: "Sistema bilingüe"
KOR_two_languages_weak_idea_desc: "Desde la caída del Imperio Coreano en 1910, los burócratas de la península fueron reemplazados por japoneses, y un gran número de japoneses emigró a Corea. Como resultado de este rápido desplazamiento poblacional, nuestra sociedad adoptó un sistema bilingüe.\n\nEl idealista Lyuh Woon-hyung cree que los japoneses pueden permanecer en la sociedad coreana y lograr armonía y paz. Si este experimento idealista tendrá éxito o dará lugar a décadas de conflictos solo podrá saberse dentro de varias generaciones."
