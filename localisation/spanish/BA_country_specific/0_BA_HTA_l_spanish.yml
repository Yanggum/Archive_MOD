  #Ocupación ilegal de Highlander
 BA_train_school: "Academia Ferroviaria Highlander"
 BA_highlander_academy_generic: "Academia Ferroviaria Highlander"
 BA_highlander_academy_generic_desc: "La red de transporte de toda la academia está operada por la Academia Ferroviaria Highlander y no se encuentra bajo nuestro control. Debemos pagar tarifas de transporte a la Academia Ferroviaria Highlander y a su mayor inversor, o bien considerar otras medidas."
 BA_nationalized_highlander: "Se han confiscado las participaciones de Highlander en las §Ylíneas nacionales§!."
 BA_highlander: "Academia Ferroviaria Highlander"
 BA_highlander_desc: " La Academia Ferroviaria Highlander opera una vasta red de vías que se extiende por todo Kivotos. Sin embargo, tras la Gran Transferencia, tanto Highlander como el Consejo Estudiantil General ya no cuentan con la misma capacidad administrativa que antes, y las academias han comenzado a ocupar las vías ferroviarias existentes en las regiones transferidas, dejando la posición de la Academia Ferroviaria Highlander en una situación inestable.\n\n En la situación actual, podemos confiscar las participaciones de las vías que posee Highlander para lograr la soberanía en el transporte, o invertir grandes sumas de capital en la Academia Ferroviaria Highlander para someterlos a nuestro control. Además, cada inversión en la academia ferroviaria hará que nos brinden diversos apoyos relacionados con el transporte.\n\n    [BA_highlander_best_invester]\n    @[this.gettag] §Y[THIS.getname]§! inversión: §Y[?THIS.BA_highlander_invest]§![BA_highlander_use_list]"
 BA_highlander_datasite: "Academia Ferroviaria Highlander\n- Velocidad de investigación de trenes y ferrocarriles: §G+10%§!\n- Pago de industria civil al bando de [?var:global.highlander_best_invester.GetName]: §R+3.00%§!"
 BA_press_highlander: "Presionar a la Academia Ferroviaria Highlander"
 BA_press_highlander_desc: "La sede central de la Academia Ferroviaria Highlander está bajo nuestro control. Podemos ejercer la presión adecuada sobre ellos."
 BA_highlander_hide_list: "Ocultar la lista de academias usuarias de Highlander"
 BA_highlander_show_list: "Mostrar la lista de academias usuarias de Highlander"
 BA_highlander_hub_construction: "Instalar un centro ferroviario"
 BA_highlander_hub_construction_desc: "Instala un centro ferroviario de Highlander en el estado.\n§WUsos restantes: §G[?BA_highlander_hub_available]§!§!"
 BA_invest_highlander: "Invertir en Highlander"
 BA_highlander_hub_eat: "Tomar control del centro ferroviario"
 BA_highlander_auto_investment_on: "Activar reinversión automática"
 BA_highlander_auto_investment_on_desc: "Los eventos que aparezcan como resultado de inversiones en Highlander activarán automáticamente nuevas inversiones."
 BA_highlander_auto_investment_off: "Desactivar reinversión automática"

 Highlander.1.t: "Construcción de infraestructuras"
 Highlander.1.d: "La Academia Ferroviaria Highlander ha invertido en la construcción de infraestructuras dentro de nuestro territorio."
 Highlander.3.t: "Ampliación de vías"
 Highlander.3.d: "La Academia Ferroviaria Highlander ha decidido ampliar las vías dentro de nuestra academia."
 Highlander.3.a: "Ha valido la pena invertir."
 Highlander.4.t: "Despliegue adicional de trenes"
 Highlander.4.d: "La Academia Ferroviaria Highlander ha decidido desplegar trenes adicionales en las vías que atraviesan nuestra academia."
 Highlander.5.t: "Vinculación industria–ferrocarril"
 Highlander.5.d: "A medida que la industria ferroviaria se desarrolla, la industria de la academia también crece."
 Highlander.6.t: "Operación normal"
 Highlander.6.d: "El ferrocarril de Highlander está operando de forma \"normal\"."
 Highlander.6.a: "¡Sorprendente!"
 Highlander.7.t: "Envío de directivos de la academia ferroviaria"
 Highlander.7.d: "Desde la Academia Ferroviaria Highlander se ha enviado personal del centro de control central para gestionar las vías dentro del territorio de nuestra [ROOT.getname]."
 Highlander.8.t: "Cambio del mayor país inversor de Highlander"
 Highlander.8.d: "El mayor país inversor de Highlander ha cambiado."
 Highlander.8.a: "Ya veo."
 Highlander.9.t: "Reacondicionamiento de vías"
 Highlander.9.d: "Tras la Gran Transferencia, los ferrocarriles locales y los de Kivotos han quedado inconexos y dispersos. El transporte se ha interrumpido, los suministros se han detenido y la industria se ha estancado. Para una rápida reconstrucción de la academia, es imprescindible llevar a cabo un reacondicionamiento a gran escala de las vías."
 Highlander.9.a: "Bien, ¡hagámoslo rápido!"
 Highlander.10.t: "Venta de acciones"
 Highlander.10.d: "A medida que el valor de las acciones de la Academia Ferroviaria Highlander continúa cayendo, algunos pequeños inversores de nuestra academia han vendido sus participaciones."
 Highlander.10.a: "Entendido."
 Highlander.11.t: "Venta de participaciones"
 Highlander.11.d: "Para asegurar una financiación estable, funcionarios del gobierno han vendido parte de las participaciones en Highlander."
 Highlander.12.t: "Recesión ferroviaria"
 Highlander.12.d: "La industria ferroviaria está entrando en una fase de estancamiento. Muchos inversores de nuestra academia están retirando sus inversiones relacionadas."
 Highlander.12.a: "Maldición."
 Highlander.13.t: "Inversión adicional"
 Highlander.13.d: "En esta ronda de inversión hemos adquirido una mayor participación."
 Highlander.13.a: "Excelente."
 Highlander.14.d: "Desde la Academia Ferroviaria Highlander se ha enviado personal del departamento de gestión de transporte de carga para administrar las vías dentro del territorio de nuestra [ROOT.getname]."
 Highlander.15.t: "Problema del ancho de vía"
 Highlander.15.d: "Tras esfuerzos continuos, los problemas ferroviarios se han resuelto en cierta medida, y ahora planeamos unificar y reorganizar la red ferroviaria nacional adoptando un único ancho de vía estándar. Sin embargo, surge una nueva cuestión: ¿qué ancho de vía debemos adoptar como estándar? Cada uno tiene ventajas y desventajas distintas, y la elección determinará diversos beneficios."
 Highlander.15.a: "Unifiquemos con ancho estándar."
 Highlander.15.b: "Mezclemos ancho estándar con vía estrecha."
 Highlander.15.c: "Utilicemos el ancho ibérico."
 Highlander.15.e: "Utilicemos vía ancha."
 Highlander.15.b_tt: "\n§gLa vía estrecha es el estándar predominante de los ferrocarriles Highlander:§!\n"
 Highlander.16.t: "Disturbio ferroviario"
 Highlander.16.d: "Se produjo un atentado dentro de un tren de Highlander, provocando ataques en parte de la ciudad."
 Highlander.16.a: "Qué problema."
 Highlander.17.t: "Envío de estudiantes de Highlander"
 Highlander.17.d: "Desde la Academia Ferroviaria Highlander se han enviado estudiantes para mejorar el funcionamiento de las vías dentro del territorio de nuestra [ROOT.getname]."
 Highlander.20.t: "Instalación adicional de centros ferroviarios"
 Highlander.20.d: "Se ha aprobado un plan adicional para la instalación de centros ferroviarios por parte de [HTA.getname]."
 Highlander.20_tt: "Permite instalar §G1§! §YCentro ferroviario de Highlander§! adicional."
 
 Highlander_upgrade.1.t: "Proyecto ferroviario: reacondicionamiento de vías"
 Highlander_upgrade.1.d: "Tras la Gran Transferencia, los ferrocarriles locales y los de Kivotos no son compatibles, y las líneas regionales han quedado inconexas y dispersas. El transporte se ha interrumpido y la industria se ha estancado. Debemos centrarnos en resolver estos problemas."
 Highlander_upgrade.1.a: "Adoptemos el proyecto ferroviario."
 Highlander_upgrade.1.b: "Esperemos otras opciones."
 Highlander_upgrade.1_tt: "Adopta §Y'Reacondicionamiento de vías'§! en el proyecto ferroviario."
 Highlander_upgrade.2.t: "Proyecto ferroviario: instalación de centros ferroviarios"
 Highlander_upgrade.2.d: "Los centros ferroviarios de Highlander son el núcleo logístico y la base operativa directa de [HTA.getname]. A través de ellos, los bienes de la academia se concentran y se distribuyen, impulsando toda la industria académica. La expansión de estos centros es, sin duda, el camino más seguro hacia una mayor capacidad industrial."
 Highlander_upgrade.2_tt: "Adopta §Y'Instalación de centros ferroviarios'§! en el proyecto ferroviario.\n\nPermite instalar §G2§! §YCentros ferroviarios de Highlander§! adicionales."
 Highlander_upgrade.3.t: "Proyecto ferroviario: construcción de transporte"
 Highlander_upgrade.3.d: "[HTA.getname] desea controlar instalaciones de transporte en un área más amplia. Por otro lado, nosotros necesitamos urgentemente establecer una base industrial mediante la construcción de infraestructuras de transporte. Esta coincidencia de intereses aportará grandes beneficios a ambas partes."
 Highlander_upgrade.3_tt: "Adopta §Y'Construcción de transporte'§! en el proyecto ferroviario."
 Highlander_upgrade.4.t: "Proyecto ferroviario: inversión activa"
 Highlander_upgrade.4.d: "El mayor país inversor de [HTA.getname] recibe dividendos de sus beneficios. Considerando los ingresos que obtienen de la red de transporte de todo Kivotos, no podemos ignorar su valor potencial. Mediante una inversión activa, nos convertiremos en el mayor país inversor de [HTA.getname]."
 Highlander_upgrade.4_tt: "Adopta §Y'Inversión activa'§! en el proyecto ferroviario."
 Highlander_upgrade.5.t: "Proyecto ferroviario: alianza con Highlander"
 Highlander_upgrade.5.d: "Quiero ver a los personajes directivos de Highlander."
 Highlander_upgrade.5_tt: "Adopta §Y'Alianza con Highlander'§! en el proyecto ferroviario."
 Highlander_upgrade.6.t: "Enfoque de uso ferroviario: guerra ferroviaria"
 Highlander_upgrade.6.d: "Uno de los principales campos de batalla de Kivotos son las zonas urbanas. Las ciudades, con sus edificios altos y resistentes, son extremadamente desfavorables para la infantería y los blindados, pero los trenes blindados pueden infiltrarse en el corazón urbano a través de las vías y dominar las rutas de transporte. ¡Una nueva era exige nuevas estrategias!"
 Highlander_upgrade.6_tt: "Adopta §Y'Guerra ferroviaria'§! como enfoque de uso ferroviario."
 Highlander_upgrade.7.t: "Enfoque de uso ferroviario: suministro por tren"
 Highlander_upgrade.7.d: "Mantener líneas de suministro en un frente extenso es una tarea extremadamente difícil. Sin embargo, con ferrocarriles, el suministro a larga distancia puede realizarse sin problemas mediante trenes."
 Highlander_upgrade.7_tt: "Adopta §Y'Suministro por tren'§! como enfoque de uso ferroviario."
 Highlander_upgrade.8.t: "Enfoque de uso ferroviario: operación de bastiones"
 Highlander_upgrade.8.d: "Aunque actualmente mantenemos un transporte eficiente a través de los centros ferroviarios de Highlander, no debemos conformarnos con eso. Si transformamos estos centros en núcleos militares, podríamos obtener ventaja en futuras guerras."
 Highlander_upgrade.8_tt: "Adopta §Y'Operación de bastiones'§! como enfoque de uso ferroviario."
 Highlander_upgrade.9.t: "Enfoque de uso ferroviario: ferrocarriles e industria"
 Highlander_upgrade.9.d: "El desarrollo industrial a través del ferrocarril aún tiene margen para ser impulsado."
 Highlander_upgrade.9_tt: "Adopta §Y'Industria ferroviaria'§! como enfoque de uso ferroviario."
 Highlander_upgrade.10.t: "Enfoque de uso ferroviario: nuestros ferrocarriles"
 Highlander_upgrade.10.d: "La Academia Ferroviaria Highlander posee las vías dentro de la academia y ocupa una posición injusta. Retiraremos progresivamente su estatus y estableceremos plenamente nuestros propios ferrocarriles."
 Highlander_upgrade.10_tt: "Adopta §Y'Nuestros ferrocarriles'§! como enfoque de uso ferroviario."

