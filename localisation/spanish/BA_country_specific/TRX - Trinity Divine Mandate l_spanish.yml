 TR4_radaslau_astrouski_ns: "$BLR_radislau_astrouski$"
 TR4_radaslau_astrouski_ns_desc: "§YNacimiento:§! §L25 de octubre de 1887, Gobernación de Minsk, Imperio ruso§!\n§YTrayectoria:§! §LRadaslau Astrouski nació en el seno de una familia terrateniente. Mientras estudiaba en la escuela de Slutsk fue expulsado por su participación en la Revolución de 1905. En 1908 ingresó en la Universidad de San Petersburgo, pero en 1911 fue arrestado acusado de participar en disturbios estudiantiles. Afortunadamente fue liberado y pudo retomar y concluir sus estudios.\n\nTras graduarse, Astrouski trabajó como maestro en Minsk y fue testigo de la Revolución de Octubre de 1917. Se opuso al régimen bolchevique y, como representante del Congreso Panbielorruso, defendió la independencia de Bielorrusia. Por ello fue arrestado por la Guardia Roja y, posteriormente, continuó su lucha alternando detenciones y liberaciones.\n\nCuando estalló la guerra entre Trinity y [SOV.GetName], consolidó sus convicciones nacionalistas y comenzó a colaborar con Trinity. La Rada Central Bielorrusa se esfuerza por obtener el apoyo del pueblo bielorruso y recuperar su identidad nacional. Convocó el Segundo Congreso Panbielorruso, negó la legitimidad del régimen soviético bielorruso y proclamó ser el heredero legítimo de la República Popular Bielorrusa.§!"
 TRN_central_council: "Rada Central Bielorrusa"
 TRN_central_council_desc: "\n\n\n£GFX_TRN_banner_central_council\n\n\n\n\nLa Rada Central Bielorrusa (parlamento) fue establecida por Trinity mediante el reclutamiento de colaboradores locales. La Rada, encabezada por el presidente $BLR_radislau_astrouski$, mantiene un sistema especial que coexiste con el Dominio Teocrático del Noreste."
