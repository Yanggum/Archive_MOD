 KSP_kanna_health_and_gov_problems:0 "Un gobierno tambaleante"
 KSP_kanna_health_and_gov_problems_desc:0 "Con el deterioro de la salud de Kanna, el interior de la Academia de Policía Valkyrie se ha vuelto extremadamente caótico. Aprovechando su caída, han vuelto a moverse estudiantes con posturas diferentes al sistema actual que ella reprimía, y quienes llevan la administración tienen dificultades para procesar el volumen de trabajo, que aumentó drásticamente ante la ausencia de control central.\n\nSin embargo, esta peligrosa situación—en la que la capacidad administrativa de Valkyrie ha sufrido un gran golpe por la ausencia de §YKanna§!—podría ser una oportunidad para §Yalguien§! que busque mantener su propio régimen. Si tan solo logramos evitar que el impacto del colapso administrativo se vuelva §texcesivo§!, esta crisis podría fortalecer enormemente su poder...\n\nLa dificultad administrativa actual de Valkyrie se muestra como el valor de §tcolapso administrativo§!, que está en §R[?KSP_gov_hangjung_disorder_var]§! de un máximo de §R20§!. Las estudiantes se irán acostumbrando gradualmente al trabajo cada §G[?KSP_getting_used_to_work_gov_var]§! días, pero en el proceso podrían surgir problemas—ya sean §Rintencionales§! o §Cno intencionales§!.\n\nAdemás, también debemos vigilar a la §tOficina de Seguridad Ciudadana§! y al §8Buró de Seguridad§!, que están descontentos con el sistema actual. ¡Si su influencia crece demasiado, prepararán un golpe de Estado!"
 KSP_getting_used_to_work_gov:0 "Las estudiantes se acostumbran al trabajo"
 KSP_getting_used_to_work_gov_desc:0 ""
 KSP_getting_used_to_work_gov_tt:0 "El colapso administrativo actual es §R[?KSP_gov_hangjung_disorder_var]§! de 20; cuando esta decisión se complete, disminuirá en §G1§!."
