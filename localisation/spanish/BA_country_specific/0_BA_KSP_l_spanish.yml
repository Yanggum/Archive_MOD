 KSP_valkyrie_democracy:0 "Democracia de Valkyrie"
 KSP_valkyrie_democracy_desc:0 ""
 KSP_belgium_restore:0 "Renacimiento de Bélgica"
 KSP_belgium_restore_desc:0 ""
 KSP_rebuild_our_army:0 "Reconstruir nuestro ejército"
 KSP_rebuild_our_army_desc:0 ""

# #발키리 단독 루트
 KSP_belgium_baechuk:0 "Pacificación de la resistencia belga"
 KSP_belgium_baechuk_desc:0 "Antes del Gran Traslado, y antes de que la Academia de Policía Valkyrie cayera aquí, en esta tierra existía un país llamado 'Bélgica'. Pero ahora este lugar es territorio de Valkyrie. Reprimir a quienes se resisten a un gobierno legítimo no es más que una de las tareas de una academia de policía."
 KSP_valkyrie_dandok_gov:0 "Gobierno de Valkyrie"
 KSP_valkyrie_dandok_gov_desc:0 "En este nuevo mundo, la mayoría de los sucesos son cosas que no podíamos prever, por lo que el antiguo sistema político—incapaz de responder con rapidez—es ineficiente. Ha llegado el momento de establecer un nuevo gobierno de Valkyrie."
 KSP_gov_gaepyeon:0 "Reorganización de la burocracia"
 KSP_gov_gaepyeon_desc:0 "La estructura política vertical de Valkyrie, que opera casi por completo mediante órdenes de arriba hacia abajo, reduce la capacidad de reacción ante situaciones repentinas. Reorganizar la burocracia podría permitirnos resolver este problema."
 KSP_belgium_ukje:0 "Contener la influencia belga"
 KSP_belgium_ukje_desc:0 "Tras fracasar el movimiento de resistencia belga, los belgas que se oponen a nosotros continúan operando en las sombras. Si no contenemos su influencia, podrían surgir problemas aún mayores."
 KSP_kanna_health_problems:0 "Reforzar la autoridad de la Directora de Seguridad Pública"
 KSP_kanna_health_problems_desc:0 "Valkyrie tiene una estructura algo distinta a la de otras academias: se evalúa por resultados y se reorganizan las clases por capacidad. Pero en una crisis sin precedentes como esta, debemos fortalecer la autoridad de la Oficina de Seguridad Pública—y, en particular, la de su directora—para garantizar una gestión eficiente."
 KSP_kanna_gov_rule:0 "Gobierno de los leales a Kanna"
 KSP_kanna_gov_rule_desc:0 "La directora de Seguridad Pública, Kanna, sin duda es una figura capaz de resolver esta crisis. Debemos confiar en su liderazgo y seguirla."
 KSP_sanghwal_safety_coup:0 "Toma del poder por la Oficina de Seguridad Ciudadana"
 KSP_sanghwal_safety_coup_desc:0 "¡Es un hecho que las negociaciones con Bélgica se arruinaron por la conducta opresiva e incompetente de la actual dirigencia de Valkyrie! Declararemos el fin del estado de emergencia, incluido Ogata Kanna, quien permite y fomenta esta incompetencia."
