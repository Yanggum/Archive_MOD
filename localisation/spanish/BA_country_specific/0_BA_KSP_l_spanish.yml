 KSP_division_of_military_value_tooltip:0 "[ROOT.GetNameDefCap] posee una §Hpuntuación de influencia§! de [?global.KSP_division_of_military_value|0H%%]\n"
 KSP_division_of_military_value_tt:0 "[?global.KSP_division_of_military_value|0H%%]"
 KSP_kanna_banned:0 "§YDeterioro de la salud§!"
 KSP_kanna_dictator:0 "Dictadura"
 KSP_kanna_dictator_desc:0 "Kanna, el \"perro rabioso\" de la Oficina de Seguridad Pública, es una figura que ascendió al cargo de directora gracias a sus firmes convicciones y determinación. Ahora que cualquier compromiso con los belgas ha quedado fuera de discusión, solo Kanna es capaz de resolver la crisis sin precedentes que enfrenta Valkyrie. Debemos aceptar plenamente sus decisiones y confiar en ella."
 KSP_kanna_dictatorship_resistance:0 "Resistencia de la Oficina de Seguridad"
 KSP_kanna_dictatorship_resistance_desc:0 "Desde que la autoridad de Kanna comenzó a fortalecerse, la Oficina de Seguridad mostró una actitud poco cooperativa frente a sus órdenes, e incluso llegó a rechazar sus demandas legítimas. Cuando Kanna proclamó la dictadura, estos comenzaron, como si lo hubieran estado esperando, una resistencia abierta contra la Oficina de Seguridad Pública."
 KSP_kanna_dictatorship_agreement:0 "Aceptación de la Oficina de Seguridad Pública"
 KSP_kanna_dictatorship_agreement_desc:0 "Con Kanna al mando del gobierno, la Oficina de Seguridad Pública reaccionó de forma positiva ante su dictadura y decidió cooperar fielmente con su administración. Sus miembros seguirán activamente las directrices de Kanna y la asistirán."
 KSP_loyal_police_academy:0 "Academia de Policía Leal"
 KSP_loyal_police_academy_desc:0 "Tras eliminar la amenaza de la autoritaria Kanna, la facción opositora dentro de Valkyrie tomó el poder y logró establecer su propio gobierno leal. A partir de ahora, Valkyrie se convertirá en una academia de policía eternamente fiel al Consejo Estudiantil General."
 KSP_justice:0 "Justicia"
 KSP_justice_desc:0 "Tolerancia, negociación, cooperación… Es necesario poner fin de manera definitiva al débil pasado de Valkyrie. Tras presenciar la incompetencia del Consejo Estudiantil General y de Schale en torno a la Torre Sanctum, ya no esperaremos más. No existe razón alguna para mostrar indulgencia hacia quienes dañan la cultura de Kivotos."
 KSP_kanna_internal_organize:0 "Fortalecer la cohesión interna"
 KSP_kanna_internal_organize_desc:0 "Aunque hubo un conflicto interno en Valkyrie y logramos resolverlo, es posible que vuelvan a surgir voces contrarias a las políticas del gobierno. Mediante diversas políticas y recompensas adecuadas, podremos desviar la atención de la oposición y obtener un apoyo aún más sólido."
 KSP_valkyrie_national_reconstruction_committee:0 "Comité de Reconstrucción Nacional de Valkyrie"
 KSP_valkyrie_national_reconstruction_committee_desc:0 "La reconstrucción de la industria de Valkyrie se había pospuesto durante mucho tiempo debido a la prioridad de establecer un estado policial. Ahora debemos reconstruir la nación mediante un sistema consolidado de autoridad pública."
 KSP_expulsion_of_belgian_capitalists:0 "Expulsión de los capitalistas belgas"
 KSP_expulsion_of_belgian_capitalists_desc:0 "Ha llegado el momento de expulsar a todos los capitalistas belgas. La industria de Valkyrie debe ser gestionada exclusivamente por Valkyrie."
 KSP_network_project:0 "Proyecto de red"
 KSP_network_project_desc:0 "Si conectamos todos los sistemas industriales mediante una red, podremos mejorar ampliamente la eficiencia industrial."
 KSP_complete_recovery:0 "Recuperación total"
 KSP_complete_recovery_desc:0 "Hemos reconstruido rápidamente la industria de Valkyrie y restaurado las tierras dañadas. Ahora debemos avanzar hacia la siguiente etapa."
 KSP_sanctum_tower_recapture:0 "Recuperación de la Torre Sanctum"
 KSP_sanctum_tower_recapture_desc:0 "Es hora de derrocar al incompetente Consejo Estudiantil General y tomar el control directamente. Debemos preparar una ofensiva total para Valkyrie."
 KSP_new_student_council:0 "Nuevo Consejo Estudiantil General"
 KSP_new_student_council_desc:0 "Ahora nosotros somos el Consejo Estudiantil General. Todos deberán jurar lealtad al nuevo presidente del Consejo Estudiantil General, Su Excelencia Ogata Kanna."
 KSP_valkyrie_central_school:0 "Escuela Central de Valkyrie"
 KSP_valkyrie_central_school_desc:0 "El valor de la existencia del Consejo Estudiantil General se ha extinguido hace tiempo. Estableceremos la Escuela Central de Valkyrie e impulsaremos una política de integración nacional contundente."
 KSP_nation_of_the_new_era:0 "Sistema de la nueva era"
 KSP_nation_of_the_new_era_desc:0 "Los cambios de la época requieren un nuevo sistema. Las policías de Valkyrie se han adaptado admirablemente a la nueva era, y ahora debemos avanzar hacia la siguiente fase."
 KSP_kanna_pardon:0 "Decreto de amnistía"
 KSP_meal_restrictions:0 "Restricción de raciones"
 KSP_meal_restrictions_desc:0 "Se restringen las raciones de los criminales encarcelados en la Oficina de Corrección."
 KSP_support_rehabilitation:0 "Rehabilitación social"
 KSP_support_rehabilitation_desc:0 "Se brinda apoyo a la rehabilitación."
 KSP_pardon_akira:0 "Amnistía de Akira"
 KSP_pardon_akira_desc:0 "Se concede amnistía a Akira."
 KSP_construct_prison:0 "Construcción de prisión"
 KSP_construct_prison_desc:0 "Se construye una prisión para encarcelar a estudiantes no reformados. Esta prisión será utilizada como una instalación de reeducación."
 KSP_correction_education:0 "Educación correctiva académica"
 KSP_correction_education_desc:0 "Se implementa educación correctiva."

 KSP_kanna_defense_tech:0 "Departamento de Tecnología de Defensa"
 KSP_kanna_defense_tech_desc:0 "Para mantener el orden público, no basta con policías bien entrenados. También debemos preparar diversas herramientas auxiliares que potencien sus capacidades. Para ello, estableceremos el Departamento de Tecnología de Defensa."
 KSP_millenium_support:0 "Apoyo de Millennium"
 KSP_millenium_support_desc:0 "La tecnología de Millennium es inigualable en Kivotos, y su vasto conocimiento es indispensable para nosotros, que nos dedicamos al desarrollo de armamento. Podemos acelerar el ritmo de investigación ofreciendo acuerdos judiciales a algunas estudiantes de Millennium arrestadas por corrupción."
 KSP_millenium_old_supercomputer:0 "Supercomputadora antigua"
 KSP_millenium_old_supercomputer_desc:0 "En Millennium, los nuevos productos se lanzan o mejoran a diario, por lo que las creaciones anteriores suelen ser consideradas obsoletas y relegadas a los rincones de los laboratorios. De la \"antigua\" supercomputadora que hemos recibido podrían surgir tecnologías innovadoras que necesitamos."
 KSP_valkyrie_task_force:0 "Policía de combate"
 KSP_valkyrie_task_force_tt:0 "§YSe podrá utilizar una fábrica de equipos para la policía de combate.§!"
 KSP_valkyrie_task_force_desc:0 "Ante cualquier amenaza, las policías de Valkyrie se colocan frente a los ciudadanos como un escudo protector. Si el escudo se rompe, no solo no podrán protegerlos, sino que también generarán ansiedad. Debemos armarnos para tranquilizar y proteger a la población."
 KSP_valkyrie_of_sky:0 "Valkyrie del cielo"
 KSP_valkyrie_of_sky_desc:0 "Por muchos policías que tengamos, existen límites frente a enemigos aéreos. Si adaptamos el helicóptero AH-64 Apache a este mundo, podremos esperar un rendimiento excelente."
 KSP_valkyrie_fast_destroyer:0 "Lancha rápida"
 KSP_valkyrie_fast_destroyer_desc:0 "Las lanchas rápidas son vehículos indispensables para nosotros, que requerimos respuestas rápidas, y entre la policía marítima se considera que el uso de lanchas con nuevas tecnologías tendrá resultados positivos."
 KSP_supply_tactical_baton:0 "Bastón policial"
 KSP_supply_tactical_baton_desc:0 "El bastón, fruto de la combinación de la tecnología del nuevo mundo y la mejor tecnología de Kivotos, posee un efecto adicional capaz de dejar dormidos a los criminales durante unas tres horas al golpearlos en la cabeza. Entre las nuevas policías es conocido como el \"bastón mágico\" y se ha convertido en un arma no letal popular."
 KSP_goddess_of_war:0 "Diosa de la guerra"
 KSP_goddess_of_war_desc:0 "La actuación de las aeronaves, que atraviesan las nubes y devastan las líneas enemigas, es verdaderamente impresionante. La fuerza aérea, que siembra esperanza en los aliados y terror en los enemigos, merece con razón el nombre de \"diosa de la guerra\"."
 KSP_extract_resource_from_belgium:0 "Extracción de recursos de Bélgica"
 KSP_extract_resource_from_belgium_desc:0 "En las tierras belgas bajo nuestro control duermen numerosos recursos subterráneos. Si excavamos más profundamente con la tecnología de nuestro mundo, aflorarán vetas que su tecnología no pudo detectar."
 KSP_extract_manpower_from_belgium:0 "Extracción de mano de obra belga"
 KSP_extract_manpower_from_belgium_desc:0 "A pesar de la dictadura del gobierno de Valkyrie, la resistencia belga ha continuado. La única forma en que los detenidos que llenan los campos de internamiento pueden ser útiles es sirviendo mediante trabajos forzados."
 KSP_extract_industry_from_belgium:0 "Extracción de industria belga"
 KSP_extract_industry_from_belgium_desc:0 "Dado que Valkyrie era originalmente una academia dedicada a formar policías, su industria básica es extremadamente débil. Aprovechar la industria y la infraestructura belgas nos permitirá fortalecer nuestra capacidad industrial."
 KSP_belgian_colony:0 "Departamento de Seguridad Belga"
 KSP_belgian_colony_desc:0 "Gracias a las estrictas políticas de seguridad del gobierno de Valkyrie, la resistencia belga disminuye día a día. Para gestionar de forma más eficiente a los ciudadanos belgas que se resignan y se adaptan a nuestro dominio, dentro del gobierno se debate activamente la creación del Departamento de Seguridad Belga."
 KSP_recruit_local_students:0 "Reclutamiento de estudiantes locales"
 KSP_recruit_local_students_desc:0 "Algunas estudiantes expresan descontento debido a la excesiva carga de trabajo. Si reclutamos estudiantes locales en Valkyrie y organizamos turnos rotativos, podremos reducir el descontento y mantener el orden público de forma más eficiente y estable."
 KSP_public_security_bureau_training:0 "Entrenamiento de la Oficina de Seguridad Pública"
 KSP_public_security_bureau_training_desc:0 "En la caótica situación de la Gran Transferencia, las estudiantes de Valkyrie han pasado mucho tiempo sin recibir siquiera el entrenamiento básico. Ahora es el momento de restaurar la disciplina y la rutina de Valkyrie."
 KSP_rank_promotion:0 "Ascenso especial de primer rango"
 KSP_rank_promotion_desc:0 "En una organización jerárquica, ascender tras realizar grandes méritos es algo natural y honorable. Todas aquellas que han trabajado por Valkyrie merecen plenamente la gloriosa recompensa de un ascenso especial de primer rango. Hoy, todas son protagonistas."
 KSP_strong_cane_of_the_people:0 "El \"bastón fuerte\" del pueblo"
 KSP_strong_cane_of_the_people_desc:0 "Debido a la autonomía de cada academia, nuestra intervención activa había sido imposible, y en tiempos de paz fuimos vistos con desconfianza. Sin embargo, las estudiantes progresistas de Valkyrie, fortalecidas por la experiencia de la Gran Transferencia, ya no serán una banda desorganizada, sino el \"bastón fuerte del pueblo\"."
 KSP_police_nation:0 "Estado policial"
 KSP_police_nation_desc:0 "Gracias al esfuerzo de innumerables estudiantes de Valkyrie, hemos alcanzado un entorno en el que podemos sobrevivir de manera independiente sin depender de nadie. Tras restablecer el orden en Bélgica, nos convertiremos en un llamado \"Estado policial\" y erradicaremos el caos que se extiende por el mundo, forjando la justicia."

 KSP_kspd_tt:0 "Modificadores de §Y$KSP_kspd$§!:"
 KSP_kspd:0 "K.S.P.D"
 KSP_kspd_desc:0 "K.S.P.D es la abreviatura de la Academia de Policía Valkyrie, una organización en la que las estudiantes de Valkyrie desempeñan el papel de policías. Las estudiantes de Valkyrie contribuyen al mantenimiento de la \"seguridad\" de Bélgica."
 # Eventos relacionados con la ruta de dictadura
 KSP_event.102.t:0 "Ascenso especial de primer rango"
 KSP_event.102.d:0 "Hemos resuelto con prudencia los disturbios internos, y ahora queremos recompensar a dos agentes que desempeñaron el papel más decisivo. ¿A quién conviene premiar?"
 KSP_event.102.a:0 "¡Recompensemos al agente que eliminó agresivamente a los rebeldes!"
 KSP_event.102.b:0 "¡Recompensemos al agente que guio a las estudiantes mediante entrenamiento y liderazgo!"

 # Modificadores
 KSP_defense_tech_center:0 "Departamento de Tecnología de Defensa"
 KSP_millenium_support_modifier:0 "Apoyo de Millennium"
 KSP_millenium_support_modifier_desc:0 "Se recibe apoyo de Millennium."
 KSP_millenium_old_supercomputer_modifier:0 "Supercomputadora antigua"
 KSP_millenium_old_supercomputer_modifier_desc:0 ""

 KSP_meal_restrictions_modifier:0 "Restricción de raciones"
 KSP_meal_restrictions_modifier_desc:0 "Se restringen las raciones de los criminales encarcelados en la Oficina de Corrección."

 KSP_amnesty_prisoners:0 "Decreto de amnistía"
 KSP_amnesty_prisoners_desc:0 "Se concede amnistía a los criminales encarcelados en la Oficina de Corrección."
 KSP_rehabilitated_prisoners:0 "Criminales rehabilitados"
 KSP_rehabilitated_prisoners_desc:0 "Se aprovecha a los criminales rehabilitados."
 KSP_constructed_prison:0 "Prisión de la Oficina de Corrección"
 KSP_constructed_prison_desc:0 "Se construye una prisión para encarcelar a estudiantes no reformados. Esta prisión será utilizada como una instalación de reeducación."

 KSP_trained_valkyrie_student:0 "Estudiantes de Valkyrie entrenadas"
 KSP_trained_valkyrie_student_desc:0 "Se despliegan estudiantes de Valkyrie entrenadas."
 KSP_belgium_recruit_local_student_modifier:0 "Reclutamiento de estudiantes locales en Bélgica"
 KSP_belgium_recruit_local_student_modifier_desc:0 "Se reclutan estudiantes locales en Bélgica."

 KSP_belgium_extract_manpower_modifier:0 "Leva de mano de obra belga"
 KSP_belgium_extract_manpower_modifier_desc:0 "Se extrae mano de obra de Bélgica."

 KSP_goddess_of_war_modifier:0 "Diosa de la guerra"
 KSP_goddess_of_war_modifier_desc:0 "La actuación de las aeronaves, que atraviesan las nubes y devastan las líneas enemigas, es verdaderamente impresionante. La fuerza aérea, que siembra esperanza en los aliados y terror en los enemigos, merece con razón el nombre de \"diosa de la guerra\"."

 KSP_belgian_security_bureau_modifier:0 "Departamento de Seguridad Belga"
 KSP_belgian_security_bureau_modifier_desc:0 "Se establece el Departamento de Seguridad Belga."

 KSP_police_nation_modifier:0 "Estado policial"
 KSP_police_nation_modifier_desc:0 "Se establece un Estado policial."

 KSP_police_attacker_modifier:0 "Agente agresivo"
 KSP_police_attacker_modifier_desc:0 "Se asciende de forma especial al agente agresivo para aumentar la eficiencia operativa."
 KSP_police_commander_modifier:0 "Comandante policial"
 KSP_police_commander_modifier_desc:0 "Se asciende de forma especial al agente que lideró mediante entrenamiento y dirección para aumentar la eficiencia operativa."

 KSP_security_bureau_influential_person:0 "Figura influyente de la Oficina de Seguridad"

 # Seguridad ciudadana
 #KSP_nakatsukasa_kirino_leader_desc:0 "§YNakatsukasa Kirino se convierte en la líder de la Academia de Policía Valkyrie.§!"

 KSP_csi:0 "Unidad de Ciencias Forenses"
 KSP_csi_desc:0 "Se organizará una unidad de ciencias forenses compuesta por especialistas de múltiples campos para investigar casos sin resolver de Kivotos y de la humanidad local, mejorando así la capacidad de investigación de Valkyrie."
 KSP_ministry_of_personal_management:0 "Agencia de Innovación en Recursos Humanos"
 KSP_ministry_of_personal_management_desc:0 "Debemos impedir el surgimiento de nueva corrupción dentro de la Academia de Policía Valkyrie mediante rotaciones periódicas de personal."
 KSP_fubuki_plan:0 "Propuesta de Fubuki"
 KSP_fubuki_plan_desc:0 "Nemugaki Fubuki enfatiza que, para que Valkyrie se adapte a la nueva era, es necesaria una democracia amplia, y está reuniendo apoyos de diversas fuerzas de Kivotos y de la Tierra. Aceptaremos parte de su metodología para completar el nuevo sistema de Valkyrie."
 KSP_labor_federation:0 "La pequeña felicidad de la policía"
 KSP_labor_federation_desc:0 "Debemos emprender algunas reformas para borrar los rastros del régimen de emergencia —cuando hasta la más mínima felicidad era reprimida— y recuperar pequeños placeres, incluidos los donuts."
 KSP_shift_work:0 "Sistema de turnos"
 KSP_shift_work_desc:0 "Bajo el régimen de Kanna, la movilización masiva de fuerzas policiales se volvió algo cotidiano bajo el pretexto de poderes de emergencia. Trabajaremos para resolver esta situación y restaurar el entorno laboral de la antigua Kivotos."
 KSP_police_labor_union:0 "Sindicato policial"
 KSP_police_labor_union_desc:0 "Formaremos un sindicato para el nuevo sistema de la Academia de Policía Valkyrie. Representantes elegidos de manera democrática y justa investigarán posibles abusos de explotación laboral en la movilización policial y mejorarán diversos problemas."
 KSP_work_with_ant:0 "Cooperación con la hormiga"
 KSP_work_with_ant_desc:0 "Para asegurar la integridad del nuevo sistema, la cooperación mutua es indispensable. Colaboraremos con la facción de Nakatsukasa Kirino y daremos un paso más hacia el asentamiento del nuevo régimen."
 KSP_kirino_plan:0 "Propuesta de Kirino"
 KSP_kirino_plan_desc:0 "Tras la Gran Transferencia en Kivotos, Nakatsukasa Kirino ha estado a cargo de resolver la mayor parte de la resistencia local desde organizaciones de base de la Academia de Policía Valkyrie, y apoya una forma de fuerte paternalismo. La ideología nacida en el Departamento de Seguridad Ciudadana busca un método idealista que respete la cultura de la vieja Tierra y procure una convivencia auténtica entre Kivotos y la humanidad."
 KSP_practical_administrative:0 "Administración práctica"
 KSP_practical_administrative_desc:0 "Nakatsukasa Kirino es una de las figuras más representativas, hastiada del burocratismo de la antigua Valkyrie. Construiremos un liderazgo que busque un enfoque más práctico y realista para completar el sistema de la Academia de Policía Valkyrie."
 KSP_basic_shooting_training:0 "Entrenamiento básico de tiro"
 KSP_basic_shooting_training_desc:0 "Las estudiantes de la Academia de Policía Valkyrie son, por naturaleza, policías; por ello, los resultados de su entrenamiento absoluto son inferiores a los ejércitos permanentes de otras academias. Por favor, tengan en cuenta que no es porque la puntería de Nakatsukasa Kirino sea insuficiente que se realice un entrenamiento de tiro tan amplio.\n- Atentamente, Nakatsukasa Kirino, presidenta interina -"
 KSP_effective_method:0 "Método eficiente"
 KSP_effective_method_desc:0 "Para operar la economía de la Academia de Policía Valkyrie, se necesita un apoyo industrial amplio. Aprovecharemos activamente el burocratismo característico de Valkyrie y nos centraremos en reforzar el control sobre la industria."
 KSP_work_with_grasshopper:0 "Cooperación con la cigarra"
 KSP_work_with_grasshopper_desc:0 "Para asegurar la integridad del nuevo sistema, la cooperación mutua es indispensable. Colaboraremos con la facción de Nemugaki Fubuki y daremos un paso más hacia el asentamiento del nuevo régimen."
 KSP_overtime_pay:0 "Pago de horas extra"
 KSP_overtime_pay_desc:0 "Teniendo presente que, desde la Gran Transferencia, la dispersión de la policía de Valkyrie ha vuelto rutinarias las horas extra, redactaremos con firmeza una legislación clara sobre su pago."
 KSP_incentive:0 "Incentivos"
 KSP_incentive_desc:0 "Las policías con alto rendimiento recibirán incentivos, incluidos certificados de reconocimiento. Con ello, podremos corregir la dejadez en Valkyrie y mejorar la eficiencia del trabajo."
 KSP_valkyrie_federation:0 "Federación Valkyrie"
 KSP_valkyrie_federation_desc:0 "Contemplando el nuevo sistema plenamente constituido de la Academia de Policía Valkyrie, alabaremos el funcionamiento del régimen que hemos forjado con nuestras propias manos."
 KSP_support_entrepreneur:0 "Apoyo a emprendedores"
 KSP_support_entrepreneur_desc:0 "Se apoya a los emprendedores."
 KSP_secure_coast:0 "Asegurar la costa"
 KSP_secure_coast_desc:0 "Se asegura la costa."
