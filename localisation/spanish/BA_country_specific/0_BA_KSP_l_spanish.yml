 KSP_event.33.t:0 "Fracaso al repeler a Wakamo"
 KSP_event.33.d:0 "A pesar de todos nuestros esfuerzos, no se logró repeler a Wakamo. Está convirtiéndose en una amenaza aún mayor para las estudiantes de la Academia de Policía Valkyrie."
 KSP_event.33.a:0 "¡Es un desastre!"

 KSP_event.34.t:0 "Éxito al repeler a Wakamo"
 KSP_event.34.d:0 "Tras innumerables dificultades, logramos repeler a Wakamo. No conseguimos capturarla, pero si lo intentamos un poco más, podremos someterla."
 KSP_event.34.a:0 "¡Eso es!"

 KSP_event.35.t:0 "Daños que se acumulan"
 KSP_event.35.d:0 "Debido a los disturbios, los daños en el territorio siguen acumulándose. Se prevé que su reparación requerirá una cantidad considerable de tiempo."
 KSP_event.35.a:0 "...¡Maldita sea!"

 KSP_event.36.t:0 "Tomar el control del Consejo Estudiantil General"
 KSP_event.36.d:0 "Como hemos ocupado todos los territorios del Consejo Estudiantil General y controlamos la Sanctum Tower, ahora podemos proclamar el Consejo Estudiantil General de Kivotos, heredando la voluntad de la presidenta anterior desaparecida, y declarar que nosotros somos el legítimo órgano rector de Kivotos."
 KSP_event.36.a:0 "Es por mantener el orden..."

 KSP_event.37.t:0 "Kanna se ha desplomado"
 KSP_event.37.d:0 "Esta mañana, la noticia de que Ogata Kanna se desplomó por el deterioro de su salud debido al exceso de trabajo se extendió por toda la Academia de Policía Valkyrie. La academia quedó envuelta en ansiedad en un instante, y la estructura administrativa reformada en torno a las estudiantes empezó a tambalearse por la ausencia de Kanna.\n\nEl faccionalismo dentro de Valkyrie, que Kanna había mantenido a raya para responder a la emergencia, también alzó la cabeza al caer ella; aprovechando la parálisis de la Oficina de Seguridad Pública, la Oficina de Seguridad Ciudadana y el Buró de Seguridad están ampliando gradualmente sus fuerzas.\n\nLas pequeñas grietas internas de la Academia de Policía Valkyrie están volviéndose a agrandar..."
 KSP_event.37.a:0 "...¿¡Qué!?"

 KSP_event.38.t:0 "El trabajo sigue avanzando"
 KSP_event.38.d:0 "Es cierto que Ogata Kanna ejercía una influencia enorme en la administración de la Academia de Policía Valkyrie. Sin embargo, su ausencia no condujo a una parálisis total.\n\nLos asuntos críticos que requerían una decisión del máximo responsable se detuvieron por completo, pero el resto de las tareas las estudiantes lograron sacarlas adelante, más o menos, por su cuenta. Al faltar Kanna—capaz de colocar una cantidad masiva de trabajo en el lugar adecuado—la eficiencia administrativa cayó drásticamente, pero no hasta el punto de que la academia se derrumbara."
 KSP_event.38.a:0 "¿Se puede… más o menos?"

 KSP_event.39.t:0 "Golpe de la Oficina de Seguridad Ciudadana"
 KSP_event.39.d:0 "El gobierno actual de la Academia de Policía Valkyrie, sin Kanna, no pudo responder adecuadamente al colapso administrativo que se aceleraba y, por el contrario, empeoró la situación. Nakatsukasa Kirino, líder de la facción radical de la Oficina de Seguridad Ciudadana, denunció el estado de cosas y, junto con las estudiantes que la seguían, asaltó el gobierno. Tras someter a un pequeño grupo de leales a Kanna, anunció la creación de una nueva academia socialista. Ogata Kanna, que estaba recuperándose en silencio, al escuchar la noticia desapareció sin dejar rastro; y tanto las estudiantes de Valkyrie como la ciudadanía de Valonia recibieron positivamente este nuevo cambio.\n\nEl gobierno autoritario de Ogata Kanna llegó a su fin, y ahora ha comenzado una nueva era en la que las estudiantes son las verdaderas dueñas de la academia."
 KSP_event.39.a:0 "¡Victoria del pueblo!"

 #이벤트(구)
 KSP_event.1.t:0 "Las dificultades de Kanna"
 KSP_event.1.d:0 "\"Haa… ¿qué se supone que debo hacer?\"\n\nMurmurando para sí, en un monólogo que nadie escuchaba, Ogata Kanna—líder actual de la Academia de Policía Valkyrie y directora de la Oficina de Seguridad Pública—leyó lentamente los documentos que le habían presentado. En ellos quedaba expuesto, sin tapujos—o, dicho con franqueza, al borde del colapso—el estado deplorable de la academia.\n\nUn aumento pequeño pero claro en la criminalidad dentro de la propia “academia de policía”, que se supone debe someter el crimen; choques armados, sabotajes, protestas y manifestaciones por el conflicto con los belgas; la ruptura del apoyo del Consejo Estudiantil General y la falta de presupuesto y equipo debido a una estructura industrial completamente distinta a la de Kivotos; y, además, facciones internas que empezaban a surgir lentamente.\n\nHasta ahora, la autoridad personal de Kanna y las medidas temporales obtenidas exprimiendo recursos inexistentes habían logrado contenerlo todo… pero el límite estaba llegando.\n\nSi esto continuaba, la Academia de Policía Valkyrie colapsaría.\n\nY Ogata Kanna no podía permitirlo.\n\nPor las estudiantes de Valkyrie que vivían aquí reunidas con dificultad y confiaban en ella… y también por sus propias convicciones.\n\n\"El Consejo Estudiantil General…\"\n\nSolicitó ayuda una y otra vez al Consejo Estudiantil General, que originalmente debería haberles tendido la mano, pero la respuesta siempre fue “imposible”. Según decían, ellos también sufrían problemas desde que cayeron en este otro mundo.\n\nKanna ya no podía limitarse a observar.\n\n\"…Esto no es algo que pueda resolver sola…\""
 KSP_event.1.a:0 "Habrá que convocar una reunión de contramedidas."

 KSP_event.5.t:0 "Inicio de la reunión de contramedidas"
 KSP_event.5.d:0 "\"Entonces… ¿por qué nos han reunido?\"\n\n\"Por el futuro de Valkyrie.\"\n\nLos jefes de departamento reunidos para la Primera Reunión de Contramedidas de Valkyrie, al escuchar a Kanna, endurecieron aún más sus rostros ya tensos.\n\nTodos allí sabían en qué estado se encontraba Valkyrie.\n\nDebería haberse derrumbado hace tiempo, pero desde el Gran Traslado, Kanna y los departamentos administrativos trasladados junto con ella habían sido exprimidos hasta el límite, ahorrando recursos hasta lo inhumano para mantenerla con vida.\n\nQue Kanna dijera eso solo podía significar…\n\n\"Hemos llegado al límite. Ya no queda nada que exprimir.\"\n\n\"…\"\n\nEl silencio lo dijo todo.\nEl abastecimiento local jamás podría reunir los recursos necesarios para Valkyrie.\n\n\"Así que, a partir de ahora, debemos encontrar una forma de resolverlo. Por la supervivencia de la Academia de Policía Valkyrie.\"\n\nTodos los presentes lo sabían: tal “forma” no existía.\nSi hubiera existido, Kanna ya la habría encontrado.\n\n"
 KSP_event.5.a:0 "Comenzó una reunión sin respuestas desde el principio."

 KSP_event.2.t:0 "El problema del armamento"
 KSP_event.2.d:0 "“¿…Me está diciendo que incluso eso ya se agotó?”\n\n“Así es.”\n\nKanna sonrió con amargura al ver la expresión de estupor de la estudiante que había hecho la pregunta.\n\n'No te lo crees. Yo tampoco lo habría imaginado antes de recibir el informe.'\n\nA la Academia de Policía Valkyrie le falta de todo.\n\nNo solo lo indispensable para la vida diaria, sino también la munición—más necesaria que nunca ahora que el Misterio se ha debilitado—para que las estudiantes puedan protegerse.\n\nLa mayoría se obtenía localmente, pero por la enemistad con los belgas la industria local disponible para Valkyrie era extremadamente limitada… y aun eso no alcanzaba.\n\nY, para colmo, sabotajes constantes, disturbios y manifestaciones armadas casi a diario. Los choques entre belgas y estudiantes de Valkyrie continuaban, y el presupuesto destinado a ello era enorme, por lo que el entorno de las estudiantes no podía sino empeorar.\n\n\"Primero recortaremos drásticamente el presupuesto de los departamentos innecesarios y lo destinaremos a la vida de las estudiantes de Valkyrie: al desarrollo y activación industrial, y a la obtención de bienes esenciales y de lo necesario para vivir.\"\n\nLos directores reunidos asintieron ante lo que, en apariencia, era una conclusión obvia.\n\nPero, como siempre, hay pocas cosas que se resuelvan con parches temporales. Hay muchas áreas donde se debe gastar, y pocas donde se puede recortar.\n\nY los campos donde Kanna podía recortar estaban ya decididos.\nKanna giró ligeramente la cabeza y miró a la directora provisional del Buró de Seguridad que ella misma había nombrado.\n\n'Recortar el armamento tendrá consecuencias graves a largo plazo. Pero… ahora no hay otra opción.'"
 KSP_event.2.a:0 "…¿Estará bien?"

 KSP_event.7.t:0 "La jefa del Buró de Seguridad"
 KSP_event.7.d:0 "La directora provisional del Buró de Seguridad se sentía profundamente incómoda en aquella reunión dirigida por la directora de Seguridad Pública, Kanna.\nPorque, en su opinión, ella no era alguien que debiera estar sentada en un lugar como ese.\nHasta antes de caer en ese desconocido lugar llamado Europa, no era más que una estudiante normal de tercer año del Buró de Seguridad.\nHabía trabajado tres años completos en Gehenna, famosa por no dar ni un solo día de descanso, pero como no era la única, nunca se consideró una veterana.\n\n'Para ser honesta… ni siquiera me esforcé tanto.'\n\nPero todo cambió con el Gran Traslado.\nJusto después, Valkyrie perdió contacto con todas las estudiantes enviadas al exterior, y con ello desaparecieron la jefa del Buró de Seguridad y muchas más.\nAnte esta situación sin precedentes, Kanna decidió que no podían dejar vacíos tantos cargos clave y nombró de manera provisional a quienes quedaban en la academia. Así fue como ella se convirtió, de golpe, en jefa del Buró de Seguridad.\n\nLa responsabilidad pesaba demasiado.\n\nFrente a ella, varias estudiantes exponían sus opiniones.\nEn realidad, ella conocía la respuesta.\nEn un presupuesto limitado, lo primero que se debía recortar era el gasto militar: cualquiera lo sabía.\nCuando surgió el tema, habló sin vacilar.\n\n“Renunciaré al presupuesto del Buró de Seguridad. No… incluso pueden disolver el departamento.”\n\nTodos la miraron.\nKanna también la observaba, con gesto incómodo.\n¿Le desagradaba esa decisión?\n\n“¿Esa es… la postura del Buró de Seguridad?”\n\n“Sí.”\n\nKanna asintió y respondió.\n\n“Entendido.”\n\nLa jefa del Buró de Seguridad bajó lentamente la cabeza.\nFuera cual fuera la razón, había hecho algo terrible a sus compañeras y a sus juniors que confiaban en ella.\n\nMurmuró en voz baja. Una disculpa que nadie podría escuchar."
 KSP_event.7.a:0 "…Perdón, todas."

 KSP_event.12.t:0 "Problema de mantenimiento del orden"
 KSP_event.12.d:0 "Alguien pregunta cómo se mantendrá el orden si se recorta drásticamente el presupuesto del Buró de Seguridad. Kanna propone operar solo el mínimo indispensable de armas de fuego y usar armas cuerpo a cuerpo. La jefa provisional de la Oficina de Seguridad Ciudadana, sentada a su lado, sugiere movilizar milicias belgas colaboracionistas. A algunos no les agrada, pero la mayoría lo aprueba."
 KSP_event.12.a:0 ""

 KSP_event.10.t:0 "El problema del Buró de Corrección"
 KSP_event.10.d:0 "Se discute qué hacer con el Buró de Corrección colapsado, y Kanna afirma: “Valkyrie debe tener un Buró de Corrección sí o sí”. El resto está de acuerdo."
 KSP_event.10.a:0 "Valkyrie siempre seguirá siendo policía. Siempre."

 KSP_event.11.t:0 "Mientras tanto..."
 KSP_event.11.d:0 "Fuera del edificio donde se celebra la reunión, dos estudiantes caminan con rostros agotados. Hablan de que, si de verdad harán una reunión de contramedidas, quizá cuando termine la situación mejore un poco."
 KSP_event.11.a:0 "También superaremos esto."

 KSP_event.13.t:0 "Fin de la reunión de contramedidas"
 KSP_event.13.d:0 "La reunión concluye, y el mensaje es que todos deben aguantar y seguir adelante."
 KSP_event.13.a:0 "Ahora, vayamos a construir el futuro de la Academia de Policía Valkyrie."

 KSP_event.6.t:0 "Encuentro con un líder belga"
 KSP_event.6.d:0 "Kanna logró reunirse con figuras importantes de Bélgica, el país que existía originalmente en estas tierras, pero la delegación belga ni siquiera tenía una postura unificada entre ellos, así que Kanna regresó sin haber podido sostener una conversación constructiva."
 KSP_event.6.a:0 "..."

 KSP_event.17.t:0 "Negociaciones con la delegación belga"
 KSP_event.17.d:0 "Durante largas horas se llevaron a cabo negociaciones con la delegación belga, pero las exigencias de ambos bandos solo se cruzaban en el vacío. Al final, cuando la delegación de Valkyrie se levantó primero y lanzó una amenaza, las negociaciones llegaron a su fin.\n\nLa Oficina de Seguridad Ciudadana está impulsando la idea de responsabilizar a la Oficina de Seguridad Pública por el fracaso, y la situación política de la Academia de Policía Valkyrie se hunde aún más en la confusión. Debemos resolver esta crisis."
 KSP_event.17.a:0 "Ahora, vayamos a construir el futuro de la Academia de Policía Valkyrie."

 KSP_event.18.t:0 "Integración del destacamento SRT en la Academia de Policía Valkyrie"
 KSP_event.18.d:0 "Con la presidenta del Consejo Estudiantil General desaparecida, la Academia de Policía Valkyrie ha solicitado que la Academia Especial SRT sea transferida a su jurisdicción.\n\nSRT, legado de la presidenta del Consejo, tiene ahora un control incierto tras su desaparición. Debemos decidir su destino."
 KSP_event.18.a:0 "Aprobado. Ayudemos a la Academia de Policía Valkyrie."
 KSP_event.18.b:0 "Rechazado. Podemos encargarnos por nuestra cuenta."

 KSP_event.19.t:0 "Aprobación del Consejo Estudiantil General"
 KSP_event.19.d:0 "El Consejo Estudiantil General aprobó la transferencia de SRT alegando su competencia de influencia con Schale. Ahora debemos emplear una ofensiva política para expulsar la influencia de Schale e integrar SRT en nuestra academia."
 KSP_event.19.a:0 "Un resultado excelente."

 KSP_event.20.t:0 "Rechazo del Consejo Estudiantil General"
 KSP_event.20.d:0 "El Consejo Estudiantil General rechazó la solicitud alegando que mantiene un control adecuado sobre SRT, a pesar de que la situación—con la competencia de influencia contra Schale—roza prácticamente una guerra civil."
 KSP_event.20.a:0 "Qué necedad."

