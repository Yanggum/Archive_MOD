 # Enfoques de independencia del Departamento de Seguridad Ciudadana
 KSP_independence_claim_1:0 "Retirar por completo la jurisdicción de investigación de Schale"
 KSP_independence_claim_1_desc:0 "Quitarle toda la jurisdicción investigativa a Schale: el último paso para defender la soberanía de la Academia de Policía Valkyrie. Es insoportable que una simple IA interfiera en todo desde por encima de nosotros. No podemos seguir conformándonos con esta situación. Despojar a ese montón de chatarra de su autoridad investigativa y recuperar lo que era nuestro desde el principio es lo único que queremos."
 KSP_independence_claim_2:0 "Estado Kivotos de Valkyrie"
 KSP_independence_claim_2_desc:0 "Somos un organismo administrativo y de investigación independiente; no pertenecemos a nadie. Determinamos con autonomía la normativa, el castigo de infractores, y las operaciones de arresto. Nuestra cúpula actual es el Consejo Estudiantil. Aunque nominalmente dependemos de Schale, oficializar nuestra independencia es posible con una simple declaración. Borrar el nombre de Schale de los pósters basta con una sola orden nuestra."
 KSP_valkyrie_alliance:0 "Alianza Valkyrie"

 # Enfoques de conquista e integración
 KSP_massive_correct_plan:0 "Plan masivo de corrección"
 KSP_massive_correct_plan_desc:0 "La Academia de Policía Valkyrie tiene como tareas principales el mantenimiento del orden y la corrección. En el pasado, ni siquiera pudo cumplirlas correctamente en su propia jurisdicción, pero ahora la situación es distinta. Todo está listo: estamos preparados para formular y ejecutar una estrategia de corrección. Valkyrie ya está lista para entregar a los criminales a la Oficina de Corrección y restaurar el orden."
 KSP_srt_correct_plan:0 "Sondeo general"
 KSP_srt_correct_plan_desc:0 "La banda de Bretaña opera de forma independiente y ha estado implicada en numerosos atentados. Eso debió ocurrir con la aprobación de su cúpula. Sus crímenes son evidentes, y nuestro arresto es un deber legítimo. Pronto, los enfrentaremos directamente en la prisión de la Oficina de Corrección."
 KSP_mil_correct_plan:0 "Plan de corrección de Millennium"
 KSP_mil_correct_plan_desc:0 "Millennium Science School continúa sus disputas políticas con tiroteos y bombardeos en el territorio tradicional de Francia, entorpeciendo la paz. Es un acto hostil evidente, y su incursión en territorio francés nos da un fundamento sólido para actuar. Ya informamos a la cúpula: es una señal inequívoca de que deben ser corregidas."
 KSP_heu_correct_plan:0 "Arresto de la agencia de detectives"
 KSP_heu_correct_plan_desc:0 "La 'Agencia de Detectives', situada en la zona anárquica cerca de nuestra frontera, está dirigida por expulsadas de la Academia Gehenna. Son las principales responsables del terrorismo fronterizo, y una molestia constante que ejecuta cualquier encargo por dinero. Ya no toleraremos esto. ¡Nuestras porras y esposas dictarán justicia sobre ellas!"
 KSP_geh_correct_plan:0 "Plan de corrección de Gehenna"
 KSP_geh_correct_plan_desc:0 "Gehenna es una banda criminal que desprecia la disciplina. Incluso tras obtener victorias políticas, no les importa su propia seguridad. Mientras continúan los atentados y las emboscadas contra las estudiantes de Valkyrie, Gehenna no ha intentado ningún contacto diplomático. Si no van a corregirse por sí mismas, las corregiremos nosotras."
 KSP_schale_correct_plan:0 "Plan de corrección de Schale"
 KSP_schale_correct_plan_desc:0 "Schale es un club extralegal creado por el actual presidente del Consejo Estudiantil; su propósito es incierto, pero hoy está controlado por una IA. El presidente del Consejo está desaparecido. El liderazgo de Valkyrie teme una rebelión de la IA, y esa IA arrogante será destruida pronto."
 KSP_ragnarok:0 "Ragnarök"
 KSP_ragnarok_desc:0 "La academia ahora mira hacia el este. Los cañones se preparan para apuntar a todas las academias: Trinity, Shanhaijing, Abydos, Hyakkiyako, Red Winter y más. Estamos listas para luchar contra quienes se opongan. Nos convertiremos en Kivotos y quemaremos todos los obstáculos. Quemarlo todo... a través del Ragnarök."

