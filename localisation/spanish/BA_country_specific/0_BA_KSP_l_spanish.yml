 KSP_event.26.t:0 "La llama reavivada"
 KSP_event.26.d:0 "La represión reiterada del gobierno de Valkyrie en la región de Valonia finalmente llegó a su límite, y los belgas—pese a la vigilancia reforzada—han logrado construir una red efectiva para resistirnos.\n\nDebemos prepararnos para negociar con los belgas en el corto plazo, y la cooperación con el Partido Rexista o con el Frente Laboral será indispensable."
 KSP_event.26.a:0 "Esto no pinta bien."

