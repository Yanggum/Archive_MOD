 KSP_weak_army:0 "Debilidad militar de Valkyrie"
 KSP_weak_army_desc:0 "Incluso en Kivotos, las estudiantes de la Academia de Policía Valkyrie fueron menospreciadas hasta por delincuentes debido a múltiples restricciones y a una carencia general de habilidades. Al caer en este nuevo mundo, la mayoría de las restricciones que nos ataban desaparecieron, pero el hecho de que la fuerza de combate de Valkyrie siga siendo inferior a la de otras academias aún no ha cambiado."
