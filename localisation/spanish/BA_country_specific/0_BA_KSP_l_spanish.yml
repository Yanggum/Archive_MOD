 #리메이크

 #재액의 여우
 KSP_wakamo_problem:0 "Fuga de la Calamidad"
 KSP_wakamo_problem_desc:0 "El Buró Federal de Corrección concentró todos sus esfuerzos para impedir la fuga de los Siete Prisioneros, pero incluso eso ha llegado a su límite. Ahora debemos someter a un enemigo de un nivel completamente distinto al de los presos que hoy campan a sus anchas."
 KSP_suppressing_plan_sustain:0 "Inicio de la operación de represión"
 KSP_suppressing_plan_sustain_desc:0 "Tras el colapso del Buró Federal de Corrección, la huida de más prisioneros está acelerando el caos social. Debemos actuar con rapidez antes de que Valkyrie se derrumbe."
 KSP_hyeongi_help_more:0 "Refuerzo de la cooperación belga"
 KSP_hyeongi_help_more_desc:0 "Desde la caída del gobierno belga en noviembre de 1935, los belgas mantuvieron una relación hostil con nosotros. Pero, con el caos agravándose por el colapso del Buró Federal de Corrección, han decidido colaborar con nosotros para evitar la ruina de ambos bandos."
 KSP_skeban_suppress:0 "Someter a las Sukeban"
 KSP_skeban_suppress_desc:0 "Debemos recurrir a la fuerza para volver a encerrar a las sukeban en el Buró de Corrección."
 KSP_country_plan_wakamo:0 "Inicio de la represión a nivel nacional"
 KSP_country_plan_wakamo_desc:0 "Ahora que el apoyo belga ha aumentado y las sukeban que estorbaban han sido sometidas, ha llegado el momento de lanzar una operación de represión nacional movilizando incluso la mano de obra restante."
 KSP_use_everything:0 "Guerra total"
 KSP_use_everything_desc:0 ""

 #얘는 디시전으로 빠짐
 KSP_wakamo_showdown:0 "Resolverlo de una vez"
 KSP_wakamo_showdown_desc:0 "Ha llegado el momento. Hemos localizado a Wakamo, una de las Siete Prisioneras. Aunque no contamos con el apoyo de la Academia Especial SRT, si por razones desconocidas el misterio de todos se ha debilitado, nuestras estudiantes deberían poder arrestarla."

 KSP_kanna_jungwun_uzi:0 "Evaluar la situación"
 KSP_kanna_jungwun_uzi_desc:0 "De repente, por un fenómeno desconocido, hemos caído en un nuevo mundo del que no sabíamos nada. Por ello, debemos comprender la situación actual a través de los belgas, quienes afirman ser los dueños originales de esta región."

 #연정
 KSP_with_our_friends:0 "Trato hacia los belgas"
 KSP_with_our_friends_desc:0 "Hemos entendido que esta tierra es nuestra y también de ellos. Por el futuro de Valkyrie y de Bélgica, debemos cooperar."
 KSP_talk_with_moderate_partys:0 "Diálogo con la izquierda belga"
 KSP_talk_with_moderate_partys_desc:0 "A través del diálogo, hemos confirmado que el 'totalitarismo' del Partido Rex, que ahora expande su poder, solo traerá más caos. Para detenerlos, debemos contactar a figuras del antiguo gobierno belga."
 KSP_inminjunsun:0 "Frente Popular"
 KSP_inminjunsun_desc:0 "Para oponernos a los fascistas del Partido Rex, necesitamos formar una amplia coalición entre demócratas y socialistas."
 KSP_citizen_danchae_help:0 "Junto a organizaciones civiles"
 KSP_citizen_danchae_help_desc:0 "Debemos centrarnos en restaurar plenamente el gobierno y el parlamento belgas, colapsados por el Gran Traslado."
 KSP_nojo_help:0 "Junto a los sindicatos"
 KSP_nojo_help_desc:0 "La ideología socialista es bastante similar a las políticas de bienestar de Kivotos. Si los apoyamos, quizá podamos instaurar un gobierno belga más parecido a nosotros."
 KSP_talk_with_hardliners:0 "Diálogo con la derecha belga"
 KSP_talk_with_hardliners_desc:0 "Mediante el diálogo, hemos identificado que liberales y socialistas se niegan a reconocernos y se están agrupando para enfrentarnos. Para estabilizar la sociedad se necesita un medio de control fuerte, y el Partido Rex puede convertirse en ese medio."
 KSP_rex_empower:0 "Fortalecer al Partido Rex"
 KSP_rex_empower_desc:0 "Liberales y socialistas están formando un amplio frente unido para detenernos. Debemos apoyar al Partido Rex y frustrar sus ambiciones."
 KSP_gukwangdang:0 "Apoyo al monarquismo"
 KSP_gukwangdang_desc:0 "Léon Degrelle, líder del Partido Rex, no es cooperativo con nosotros debido a sus ambiciones. Si brindamos apoyo secreto a los monárquicos dentro del Rex, quizá podamos aumentar la autoridad de Leopoldo III y convertirlo en un partido más dispuesto a colaborar."
 KSP_fascism_rule:0 "Aceptar el fascismo"
 KSP_fascism_rule_desc:0 "Su orientación fascista ha sido de gran ayuda para estabilizar la sociedad. Si la aplicamos también a nosotros, podremos construir una sociedad más fuerte."
 KSP_government_ganghwa_NOT:0 "Destrucción total de la resistencia belga"
 KSP_government_ganghwa_NOT_desc:0 "Ahora que el 'Estado policial' ha demostrado que podemos detener la resistencia belga, ya no hay razón para mostrar clemencia hacia los colaboracionistas. Para proteger la cultura Valkyrie–Kivotos, debemos aniquilar todas las organizaciones de resistencia."
 KSP_government_ganghwa:0 "Formar un bloque de cooperación"
 KSP_government_ganghwa_desc:0 "Si reunimos a belgas dispuestos a cooperar y formamos un nuevo bloque colaboracionista, será de gran ayuda para gobernar los asuntos internos."
 KSP_cooperation_with_the_left:0 "Cooperación con la izquierda belga"
 KSP_cooperation_with_the_left_desc:0 "Cooperaremos con el Frente Laboral, clasificado como la facción de izquierda entre las fuerzas de resistencia locales que desean la restauración de la antigua Bélgica, para estabilizar la sociedad belga."
 KSP_remove_bandaepa:0 "Eliminar a la oposición"
 KSP_remove_bandaepa_desc:0 "Aún existen facciones opositoras en Bélgica que no reconocen este gobierno de coalición. Si siguen objetando, se convertirán en un obstáculo en nuestro camino."
 KSP_belgium_gov_helpers:0 "Reparto de tareas entre burócratas belgas"
 KSP_belgium_gov_helpers_desc:0 "Tras eliminar a la oposición, debemos llenar los vacíos que han quedado dentro del gobierno."
 KSP_belgium_heart:0 "Voluntad de Bélgica"
 KSP_belgium_heart_desc:0 "En noviembre de 1935, el gobierno belga desapareció por el Gran Traslado; sin embargo, nosotros sobrevivimos y, junto a nuestros nuevos amigos, hemos formado un nuevo gobierno. ¡Ya no volveremos a caer, y nuestra Bélgica será eterna!"
 KSP_stabilize_inside:0 "Estabilización interna"
 KSP_stabilize_inside_desc:0 "Debemos aplastar al Frente Laboral: una organización antiestatal levantada por la cooperación entre el Partido Laborista belga y el Partido Comunista, que sacude los procedimientos administrativos de Valkyrie y Bélgica."
 KSP_belgian_simin_help:0 "Movilización de ciudadanos belgas"
 KSP_belgian_simin_help_desc:0 "Siguiendo el consejo del Partido Rex, podemos movilizar a los ciudadanos belgas para los proyectos de reconstrucción."
 KSP_country_rebuild_danguk:0 "Establecer la Autoridad de Reconstrucción de Valonia"
 KSP_country_rebuild_danguk_desc:0 "Hemos estabilizado la región, pero la infraestructura y las instalaciones industriales siguen colapsadas. Debemos establecer una autoridad de reconstrucción para los proyectos futuros."
 KSP_rebuild_roads:0 "Reconstruir la red vial"
 KSP_rebuild_roads_desc:0 "Para trabajar sin obstáculos, primero debemos reacondicionar la red de carreteras."
 KSP_belgian_sanup_control:0 "Aprovechar la industria belga"
 KSP_belgian_sanup_control_desc:0 "Sorprendentemente, incluso en esta situación desastrosa, hemos confirmado que algunas instalaciones industriales aún funcionan con normalidad. Esto nos será de gran ayuda."
 KSP_belgian_sanup_hwakjang:0 "Expansión forzada de la industria belga"
 KSP_belgian_sanup_hwakjang_desc:0 "Considerando la situación de los países vecinos, es evidente que en poco tiempo se nos vendrá encima un grave problema de seguridad nacional. Para prepararnos, aunque el descontento aumente, tendremos que exprimir la mano de obra día y noche para normalizar la industria."
 KSP_chian_uzi_students:0 "Movilizar a la policía estudiantil"
 KSP_chian_uzi_students_desc:0 "Para lidiar con las milicias del Partido Rex, se necesita una amplia cooperación civil–policial. Movilizaremos a las policías de Valkyrie y, con denuncias del Frente Laboral, ejecutaremos una operación masiva de destrucción de los rexistas."
 KSP_cooperation_with_the_right:0 "Cooperación con la derecha belga"
 KSP_cooperation_with_the_right_desc:0 "Cooperaremos con el Partido Rex de Valonia, clasificado como la facción de derecha entre las fuerzas de resistencia locales que desean la restauración de la antigua Bélgica, para estabilizar la política belga."
 KSP_valkyrie_government_tonghap:0 "Unidad interna"
 KSP_valkyrie_government_tonghap_desc:0 "Aún hay muchas estudiantes con preocupaciones y descontento por aliarnos con los belgas. Debemos calmar ese malestar para mantener relaciones fluidas."
 KSP_sanghwal_safety_helping:0 "Cooperación de Seguridad Ciudadana"
 KSP_sanghwal_safety_helping_desc:0 ""
 KSP_gyeongbiguk_helping:0 "Cooperación de la Oficina de Seguridad"
 KSP_gyeongbiguk_helping_desc:0 ""
 KSP_kanna_gov_empower:0 "Expandir la influencia del gobierno de Kanna"
 KSP_kanna_gov_empower_desc:0 "Aunque hoy cooperamos con los belgas, también debemos evitar que su influencia crezca en exceso dentro del gobierno."
 KSP_gov_gaepyeon_0:0 "Reorganización del gobierno"
 KSP_gov_gaepyeon_0_desc:0 "Para una administración más fluida, debemos reorganizar los departamentos de Valkyrie dentro del gobierno con la cooperación de los belgas."
 KSP_gwanleojae_sulgae:0 "Reforma de la burocracia de Valkyrie"
 KSP_gwanleojae_sulgae_desc:0 "Aceptando los consejos del Partido Comunista belga y del Partido Laborista, mejoraremos el sistema y reorganizaremos la burocracia de Valkyrie para que sea más eficiente."
 KSP_kanna_gov:0 "Centrado en Kanna"
 KSP_kanna_gov_desc:0 "La concentración centralista del poder de la directora Kanna ayudará a prevenir conflictos internos y a aumentar la cohesión nacional."
 KSP_students_have_power:0 "Centrado en las estudiantes"
 KSP_students_have_power_desc:0 "Dar oportunidades a las estudiantes y aceptar sus diversas opiniones tampoco sería una mala opción."
 KSP_students_working_camp:0 "Mano de obra estudiantil"
 KSP_students_working_camp_desc:0 "Lo que necesitamos ahora son trabajadores. Si adscribimos a las estudiantes disponibles a la Autoridad de Reconstrucción y las enviamos a las obras, será de ayuda."
 KSP_student_volunteers:0 "Especialización del trabajo estudiantil"
 KSP_student_volunteers_desc:0 "Parece que algunas de nuestras estudiantes tienen talento para la ingeniería civil. Si fortalecemos su especialización, podremos asignar mano de obra de forma eficiente y acelerar la finalización de obras."
 KSP_rebuild_country:0 "Recuperar el territorio devastado"
 KSP_rebuild_country_desc:0 "Tras mucho tiempo, la infraestructura de las zonas clave ha sido restaurada, y la gente vuelve a recuperar la vitalidad."
 KSP_two_together:0 "Coexistencia"
 KSP_two_together_desc:0 "Estamos en el mismo territorio, pero Valkyrie y Bélgica son esencialmente distintas en historia, cultura y valores. Por ello, elegiremos la coexistencia."
 KSP_fusion:0 "Fusión"
 KSP_fusion_desc:0 "Valkyrie y Bélgica han superado numerosas pruebas y adversidades, forjando un vínculo firme. ¡A partir de ahora, nos uniremos para afrontar desafíos aún mayores!"
 KSP_tonghap_junbi:0 "Preparativos de integración"
 KSP_tonghap_junbi_desc:0 ""
 KSP_give_students_simingwun:0 "Otorgar ciudadanía a las estudiantes"
 KSP_give_students_simingwun_desc:0 "Para la integración social, también otorgaremos ciudadanía a las estudiantes."
 KSP_two_gov_tonghap:0 "Integración de funciones"
 KSP_two_gov_tonghap_desc:0 ""
 KSP_two_gov_chaegae:0 "Sistema de dos gobiernos"
 KSP_two_gov_chaegae_desc:0 "Formaremos gobiernos separados y garantizaremos un alto grado de autonomía mutua."
 KSP_gujugu_bunri:0 "Separación de zonas residenciales"
 KSP_gujugu_bunri_desc:0 ""
 KSP_upmu_bulri_tech:0 "Separación de funciones"
 KSP_upmu_bulri_tech_desc:0 ""
 KSP_yunjung_over:0 "Gobierno compartido"
 KSP_yunjung_over_desc:0 "Con la estabilización social, ya no es necesario formar un gobierno de coalición; ahora viviremos juntos bajo un mismo nombre."

