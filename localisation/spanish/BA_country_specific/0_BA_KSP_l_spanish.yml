 ## Golpe de Kirino
 KSP_event.115.t:0 "Arresto de emergencia de la directora de Seguridad Pública, Kanna"
 KSP_event.115.d:0 "Nakatsukasa Kirino sufría un leve sentimiento de culpa. Por mucho que fuera así… ¿de verdad estaba bien tratar a la directora Kanna de esta manera? Kirino recordó cómo, durante una patrulla, la directora la había regañado. Con una voz aterradora, Kanna pronunció el apellido Nakatsukasa y le enseñó que no era de buena educación apuntarle con un arma a un belga para inspeccionarlo en la calle. ¡La directora Kanna era así de genial y carismática! Kirino miró las esposas que tenía en la mano. El tintineo del metal le decía que, por muy directora que fuese, Kanna no podría resistirse.\n\nKirino alzó la vista hacia el edificio de Seguridad Pública. Pensar que Seguridad Ciudadana —y, más allá, Valkyrie— podría quedar sacudida y volteada por una sola orden suya le producía una sensación extraña. En la planta más alta, en el despacho de la directora, Kanna bebía café mientras trabajaba. Kirino recordó el carisma que Kanna mostró durante la Gran Transferencia. ¿Podría Kirino imitarlo… o siquiera intentarlo? ¡Si ni siquiera podía disparar bien una pistola!\n\nSi dudaba, todo quedaría en nada. Kirino pensó en la calidez que le habían mostrado los belgas: aquella abuela que la rescató cuando se perdió en Valonia y le ofreció té sonriendo. Y, sin embargo, la directora pretendía arrestarlos a todos. Si no era Kirino, nadie podría hacerlo. Fubuki también llevaba mucho tiempo decepcionada con una directora hostil hacia los locales.\n\nKirino se colgó un momento la pistola al cinto y respiró hondo. Era la hora de probar el carisma que aprendió mirando a la directora. Con un gesto, una estudiante con el logo de Seguridad Ciudadana le pasó rápidamente un megáfono. Kirino ordenó con la mano a las estudiantes de Seguridad Ciudadana que asaltaran el edificio. Aclaró la garganta y gritó:\n\n\"¡Ogata Kanna, directora de Seguridad Pública! ¡Seguridad Ciudadana ya no obedecerá los abusos de Seguridad Pública! ¡Ríndete, levanta las manos y sal afuera!\"\nEn cuanto Kirino terminó, Seguridad Pública se convirtió en un infierno: se enredaron unas con otras apuntándose con armas y el choque de escudos no cesó."
 KSP_event.115.a:0 "Las manos de Kirino temblaban con fuerza."
 KSP_event.116.t:0 "Encuentro con Konoka"
 KSP_event.116.d:0 "\"Vaya, vaya… un paisaje que a la jefa le encantaría, ¿a poco no?\"\n\nKonoka giraba la silla de un lado a otro en el despacho de la directora de Seguridad Pública, mirando el panorama. El despacho estaba marcado por el golpe: balas incrustadas por todas partes. No estaba claro si Konoka lo decía por la vista exterior, o si era una crítica velada al golpe de Seguridad Ciudadana.\n\nMientras tanto, Kirino, como aquella vez que se reunió con Kanna tras meter la pata antes de la Gran Transferencia, estaba sentada en el sofá del despacho, inquieta, jugueteando con las esposas. Lo que había cambiado era que Kanna estaba detenida en su residencia y en el bolsillo del pecho de Kirino había un pequeño minilibro de teoría comunista.\n\nKonoka se quitó la camisa y se puso el uniforme de la directora que estaba a su lado. El brazalete azul brilló en su codo. Pero, en contraste con ese brillo, Konoka se veía terriblemente incómoda.\n\n\"A la jefa le encantaba esta taza de café. Todavía no lo entiendo, pero bueno.\" Konoka sonrió como bromeando. Pero Kirino tenía el rostro rígido, como si estuviera siendo castigada. Konoka suspiró y continuó:\n\n\"Te lo digo claro: que Seguridad Ciudadana vaya a dirigir Valkyrie… no me gusta nada. Más incluso que cuando la jefa me regaña.\" Kirino se estremeció, dejando ver que la escuchaba. Konoka subió los pies al escritorio. Sólo el tic-tac del segundero llenó el silencio, como si Konoka fuese a ocupar el vacío de Kanna.\n\n\"Pero bueno… si nuestra 'gran y magnífica directora Kirino' dice que hay que hacerlo, habrá que hacerlo, ¿no? ¿No es así?\" Konoka estiró los brazos, se desperezó y se acercó a Kirino ofreciéndole la mano.\n\nKirino todavía no podía copiar por completo el carisma de Kanna. Pero si ella era una 'agente amable', podría hacerlo… o eso intentó decirse una y otra vez. Ella sólo había salvado a los belgas de los abusos de la directora, nada más. Y aun así, no podía borrar el pecado que resonaba en algún rincón de su corazón. Tal vez ese pecado latiría para siempre dentro de Kirino. Con cada latido, el pecado golpearía dos veces.\n\nKirino soltó las esposas que había estado manoseando y le estrechó la mano a Konoka."
 KSP_event.116.a:0 "Se sentía como si hubiese cometido un delito."
 KSP_tooltip_konoka:0 "§gCuando Kirino cerró la puerta al salir, oyó un murmullo. Era la voz de Konoka: 'No sé qué demonios harán esas locas'. Esa voz, rebotando más allá de la puerta cerrada, volvió como un lazo que le apretó el cuello a Kirino.§!"

