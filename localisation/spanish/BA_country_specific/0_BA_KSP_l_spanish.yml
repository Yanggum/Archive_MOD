 KSP_event.100.t:0 "El fin del desastre"
 KSP_event.100.d:0 "La Zorra de la Calamidad, que cometía actos terroristas en la zona de Valkyrie, ha sido sometida. Sus acciones amenazaban la seguridad de la Academia de Policía Valkyrie, y ya no podían ser toleradas. Sin embargo, ahora ha sido neutralizada y se encuentra encerrada en el frío Buró de Corrección. Ya no representará una amenaza para Valkyrie."
 KSP_event.100.a:0 "§CAsí fue sometida la Zorra de la Calamidad.§!"

 KSP_event.101.t:0 "Oposición interna en Valkyrie"
 KSP_event.101.d:0 "Al reprimir las protestas belgas y expulsar a las fuerzas opositoras locales, la carga de trabajo del Buró de Seguridad—que asumía el papel principal en todo el proceso—se intensificó hasta que finalmente estallaron las quejas. Cuando la directora Kanna amenazó con castigos severos a los implicados si el descontento continuaba, el malestar también empezó a estallar dentro de la propia Oficina de Seguridad Pública."
 KSP_event.101.c:0 "¡Que se quejen cuanto quieran; aun así, la academia funciona!"

