l_spanish:

 KSP_country_intro_header:0 "§CGuardianes del nuevo orden§!"
 KSP_country_intro_content:0 "\nLa Academia de Policía Valkyrie, también conocida como la Oficina de Policía Estudiantil de Kivotos (KSPD), cayó repentinamente en una región de Bélgica.\n\nAnte la repentina transferencia, la administración quedó paralizada, y las estudiantes bajo el mando de Kanna, directora de la Oficina de Seguridad Pública, se encuentran confundidas sin saber cómo actuar.\n\nLa conexión con el Consejo Estudiantil General ha sido cortada, y nos encontramos en una situación crítica en la que no podemos recibir órdenes.\n\nEn medio del peor escenario imaginable, que podría agravarse aún más, como guardianes del orden debemos calmar a la población local y, más allá de eso, estabilizar el distrito de Shiratori, para corregir el inestable orden de Kivotos.\n\n§YDesarrollo - Mako, SKSKIe, Regulus§!\n§YDesarrollo adicional - Imika, Wolha, Haenongi, Lolenheim§!"

 KSP_guide:0 "Objetivos\n\n£white_dot. Analiza la situación actual y responde adecuadamente.\n£white_dot. Mantén la seguridad de la región a través de las estudiantes de Valkyrie.\n£white_dot. Somete a Wakamo, quien ha sido liberada.\n£white_dot. Estabiliza Bélgica y toma las mejores decisiones en nombre del orden."

 # Valkyrie Story Archive
 KSP_story_archive:0 "Archivo de historia"
 KSP_show_story_archive_gui:0 "Archivo de historia de Valkyrie"
 KSP_show_story_archive_gui_desc:0 "Aquí puedes consultar historias secundarias relacionadas con Valkyrie y Bélgica. No están vinculadas al sistema de juego y fueron creadas únicamente para disfrutar de relatos secundarios relacionados con el país dentro del juego. A medida que transcurran el tiempo y los eventos, podrán añadirse nuevas historias. Esperamos que las disfrutes."

 KSP_attempt_to_gain_control_of_the_srt:0 "Intento de asegurar el control de SRT"
 KSP_attempt_to_gain_control_of_the_srt_desc:0 "Con la desaparición del presidente del Consejo Estudiantil General y la pérdida de autoridad sobre SRT, Valkyrie debe asumir temporalmente la custodia de sus miembros y hacerse cargo provisionalmente del rol de las fuerzas especiales de SRT."

 KSP_division_of_military:0 "El destino de las fuerzas especiales de SRT"
 KSP_division_of_military_desc:0 "El debate sobre el destino de SRT, iniciado por la Academia de Policía Valkyrie, se está desarrollando de forma intensa. Solo quedan dos posibles resultados: que SRT sea integrada en Valkyrie, como sostiene la Academia de Policía Valkyrie, o que SRT permanezca bajo el Consejo Estudiantil General."
 KSP_mission_division_of_military_trigger_tooltip:0 "@KSP Puntuación de influencia §Y100§! o más"
 KSP_mission_division_of_military:0 "Guerra de cooptación"
 KSP_strengthening_influence_pp:0 "Fortalecer la influencia política"
 KSP_strengthening_influence_cp:0 "Cooptar a los comandantes de SRT"
 KSP_strengthening_influence_stv:0 "Discurso sobre la ausencia del presidente del Consejo Estudiantil General"
 KSP_strengthening_influence_civ:0 "Asegurar instalaciones de SRT"
 KSP_strengthening_influence_mp:0 "Ampliar el personal de inversión"
