 #Espíritu nacional
 TWN_right_of_resistance_idea: "La voluntad de los Seediq"
 TWN_right_of_resistance_idea_desc: "Incluso después de que la isla de Taiwán se convirtiera en una colonia japonesa, el pueblo indígena Seediq de Taiwán no se rindió. El Incidente de Musha de 1930 fue un acontecimiento representativo que puso de manifiesto el espíritu de resistencia de los Seediq. El ejército independentista, liderado por el jefe tribal Seediq Mona Rudao, llevó a cabo operaciones de guerrilla aprovechando el terreno montañoso de la isla de Taiwán hasta el final, hasta que fue aplastado por el Gobierno General de Taiwán.\n\nLa lucha de 1930 fue sofocada y Mona Rudao eligió el suicidio antes que caer prisionero, pero los conocimientos que dejaron sobre tácticas de guerrilla y el espíritu de resistencia para proteger la isla de Taiwán permanecieron sin ser olvidados."
