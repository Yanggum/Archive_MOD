 CAN_british_anger_ns_desc: "§CNivel de ira§!: §Y[?CAN_british_anger|0]§!\nComo consecuencia de la Gran Transferencia, Kaiser Corporation ocupó las Islas Británicas y expulsó a sus gobernantes originales, los británicos. Pero, al ver que ni siquiera la recuperación de la metrópoli parece cercana y que el gobierno actual no toma ninguna medida, la ira está creciendo."

