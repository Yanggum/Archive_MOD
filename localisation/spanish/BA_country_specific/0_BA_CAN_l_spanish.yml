 # GUI
 uk_btn_desc: "§YGUI de estado del gobierno en el exilio§!"
 uk_btn_desc_desc: "Perdón, todavía no está lista la función de la GUI. ¿Podrías esperar hasta que la termine..?"
 ENG_king_edward_name: "Su Majestad, el más benevolente, $ENG_king_edward$"
 ENG_king_george_v_name: "Su Majestad, el más benevolente, $george_v$"
 BA_king_name_tt: "[BA_King_name]"
 BA_king_desc_tt: "[BA_king_desc]"
 BA_King_Edward_name: "Por la gracia de Dios, §tGran Bretaña§!, §GIrlanda§! y §Rlos Dominios británicos de ultramar§!; §YDefensor de la Fe§!; §gEmperador de la India§!; Su Majestad el §YRey $ENG_king_edward$§!"
 BA_King_Edward_desc: "§L$ENG_king_edward$ nació a finales del siglo XIX en una casa real respetada. Desde su nacimiento asumió un papel importante como miembro de la realeza y, desde joven, viajó por numerosos países conociendo diversas culturas. Estas experiencias influyeron enormemente en la ampliación de su visión como futuro líder.\n\nDesde su juventud, $ENG_king_edward$ fue plenamente consciente de las responsabilidades y deberes como heredero al trono. En particular, mostró gran interés por los problemas sociales y las relaciones internacionales, y con ello se preparó como líder del mañana. Durante su servicio militar practicó con hechos su lealtad y entrega al país, ganándose así una gran confianza entre el pueblo.\n\nCon el paso del tiempo, $ENG_king_edward$ sintió cada vez más el peso de la sucesión al trono y vivió una vida dedicada al país y a su gente. En ese período participó en diversas actividades y, como miembro de la familia real, se mantuvo cercano al pueblo, esforzándose mucho por ellos.\n\nEstas actividades dedicadas de $ENG_king_edward$ dejaron una profunda impresión en las masas y le valieron un gran respeto por parte de la población. Con un sentido del deber como líder y un profundo afecto hacia el pueblo, $ENG_king_edward$ tomará decisiones importantes mientras prepara el futuro del Reino.§!"
 BA_King_George_name: "Por la gracia de Dios, §tGran Bretaña§!, §GIrlanda§! y §Rlos Dominios británicos de ultramar§!; §YDefensor de la Fe§!; §gEmperador de la India§!; Su Majestad §Y$george_v$§!"
 BA_King_George_desc: "§L$george_v$ nació en una casa real respetada y, desde niño, aprendió profundamente las tradiciones y responsabilidades de la realeza. Acumuló diversas experiencias como miembro de la familia real y desarrolló de manera natural las cualidades de un líder. En particular, en su juventud sirvió en la armada, practicando con hechos la entrega y la lealtad al país.\n\n$george_v$ asumió con seriedad los deberes como heredero al trono. Deseaba ser un líder cercano al pueblo y escuchar su voz, y se esforzó sin descanso por ello. Se reunió con personas de todos los ámbitos de la sociedad para comprender los asuntos del reino y buscar soluciones, consolidándose así como un líder digno de confianza.\n\nTras ascender al trono, $george_v$ se dedicó a estabilizar el país y a aplicar políticas para el bienestar de la población. También cumplió un papel importante en la diplomacia, elevando el prestigio del reino en la comunidad internacional. $george_v$ valoró, por encima de todo, la prosperidad del reino y la seguridad del pueblo, y entregó todas sus capacidades para ello.\n\nAsí, $george_v$ recibió un profundo respeto y cariño del pueblo, y cumplió con sus responsabilidades como líder. Esta dedicación y esfuerzo contribuyeron enormemente a la estabilidad y el desarrollo del reino, y sus logros serán recordados por las generaciones venideras.§!"


