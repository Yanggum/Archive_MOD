 IMP.0.t: "La coronación de Eduardo VIII"
 IMP.0.desc: "Su Majestad el Rey Eduardo VIII es el primer monarca británico en celebrar su coronación fuera de la Abadía de Westminster. Los planificadores reales prepararon en su lugar una elaborada ceremonia en la Catedral de Christ Church, la mayor catedral anglicana de Ottawa. El Arzobispo de Canterbury, exiliado del Reino Unido, ofició el rito conforme a la tradición, mientras innumerables medios lo observaban con atención.\n\nJusto después de la coronación, Su Majestad apareció no en el balcón del Palacio de Buckingham, sino en el balcón de Rideau Hall, la actual residencia oficial de la Familia Real, y recibió la entusiasta bienvenida de los canadienses."
 IMP.0.a: "¡Con esto basta para una coronación plenamente legítima!"
 ENG_coronation_of_edwards: "$ENG_king_edward$ ha concluido su coronación"
 IMP.1.t: "El discurso del Rey"
 IMP.1.desc: "Se acerca el momento crucial en que el Rey Eduardo preparará su primer discurso radiofónico dirigido al Imperio. El monarca debe considerar con cuidado qué mensaje transmitirá en esta alocución. Los exiliados británicos desean que proclame con firmeza la voluntad de reconquistar la metrópoli, pero el Parlamento y los ciudadanos de Canadá prefieren un enfoque más moderado. Creen que, respaldando al primer ministro canadiense o a un líder moderado, es importante reforzar la cohesión de nuestros dominios y mantener la estabilidad.\n\nEl momento del discurso está a punto de llegar. Debemos decidir con rapidez."
 IMP.1.a: "Apoyemos a los conservadores"
 IMP.1.b: "Apoyemos al Partido Liberal"
 you_can_see_ENG_gui: "Ahora puedes acceder a la GUI del gobierno en el exilio."
 IMP.2.war.t: "¡El Rey Eduardo proclamó la reconquista de la metrópoli!"
 IMP.2.neu.t: "¡El Rey Eduardo pronunció un discurso moderado y amplio!"
 IMP.2.gov.t: "El Rey Eduardo apoyó al Partido Liberal"
 IMP.2.d.war: "Mediante su discurso radiofónico, el Rey Eduardo dirigió un mensaje a todo Canadá: desde Vancouver hasta St. John’s, desde Toronto hasta el Ártico. El monarca condenó con dureza a Kaiser Corporation y proclamó con fuerza su férrea determinación de poner fin a la guerra iniciada por su padre y, finalmente, recuperar el Reino Unido.\n\nEl discurso, al enfatizar el liderazgo, obtuvo el apoyo del bloque de exiliados británicos y dio un gran impulso a las fuerzas de resistencia en las islas. Sin embargo, al mismo tiempo, está sembrando inquietud entre Canadá y otros dominios, elevando la tensión."
 IMP.2.d.gov: "Mediante su discurso radiofónico, el Rey Eduardo transmitió un mensaje a todo Canadá. Desde Vancouver hasta St. John’s, desde Toronto hasta el Ártico, los canadienses quedaron profundamente impresionados por un discurso moderado y majestuoso que priorizó la cooperación y la cohesión entre los dominios, y subrayó la importancia de la estabilidad.\n\nEste discurso brindó a Canadá y a los demás dominios una oportunidad para mantener la estabilidad y la unidad. Sin embargo, entre los exiliados británicos provocó una reacción por debajo de sus expectativas."
 IMP.2.d.neu: "Mediante su discurso radiofónico, el Rey Eduardo transmitió un mensaje importante al pueblo y al país. Desde Vancouver hasta St. John’s, desde Toronto hasta el Ártico, los canadienses respondieron con fuerza a un discurso majestuoso y vigoroso que, al tiempo que afirmaba la voluntad de reconquistar la metrópoli, recalcó la estabilidad y la cohesión de los dominios.\n\nEl discurso obtuvo una respuesta positiva tanto de los exiliados como de los dominios, pero no dejó una impresión más contundente. Esto podría suscitar dudas sobre el liderazgo del monarca."
 IMP.2.a: "¡Viva!"
 IMP.3.t: "Las repercusiones del discurso"
 IMP.3.desc: "El discurso de Eduardo VIII no pudo satisfacer a todos. Como resultado, algunas personas comenzaron a exagerar deliberadamente e interpretar de forma sesgada ciertas partes del discurso, y a difundirlo por la sociedad..."
 IMP.3.a: "Esto..."
 CAN_anger_change_tt_1: "Un discurso de apoyo al Partido Liberal beneficia al Partido Liberal."
 CAN_anger_change_tt_2: "Un discurso de apoyo al Partido Liberal perjudica al Partido Conservador."
 CAN_anger_change_tt_3: "Proclamar la reconquista de la metrópoli perjudica al Partido Liberal."
 CAN_anger_change_tt_4: "Proclamar la reconquista de la metrópoli perjudica al pueblo canadiense."
 CAN_anger_change_tt_5: "Proclamar la reconquista de la metrópoli beneficia al Partido Conservador."
 CAN_imp_3b_people_tt: ""
 IMP.4.t: "$ENG_stanley_baldwin$ solicita retirarse"
 IMP.4.desc: "Hoy, Sir Stanley Baldwin ha tomado la decisión de dimitir del cargo de primer ministro. Durante los últimos días, Europa se ha desplomado en un caos incesante. El colapso de Alemania y Francia sacudió profundamente al mundo, y el Reino Unido tampoco pudo librarse de esta terrible crisis. La metrópoli británica sufrió un ataque relámpago de otro mundo y no tuvo más remedio que declarar la capitulación; como consecuencia, el gobierno del Imperio Británico se vio obligado a exiliarse en Canadá.\n\nEl primer ministro Baldwin hizo cuanto pudo, guiando al Reino Unido en este momento de crisis. Pero el cansancio y el sobreesfuerzo acumulados en medio de una crisis y confusión continuas terminaron por deteriorar su salud, llevándolo a tomar la decisión de dejar el cargo.\n\nSu liderazgo y dedicación jamás serán olvidados, y será recordado por su servicio y entrega al país. Incluso cuando un nuevo líder conduzca estos tiempos difíciles, los logros de Sir Stanley Baldwin brillarán para siempre en la historia del Imperio Británico."
 IMP.4.a: "Has trabajado mucho, conde $ENG_stanley_baldwin$."
 IMP.5.t: "Ceremonia de nombramiento del primer ministro"
 IMP.5.mackenzie: "Hoy, el Rey Eduardo ha nombrado a William Lyon $CAN_mackenzie_king$, de Canadá, como nuevo primer ministro del Imperio Británico. Tras el colapso del mundo occidental y el ataque sorpresa y la capitulación de la metrópoli británica, el Imperio Británico no tuvo más remedio que exiliarse en Canadá. En medio de esta crisis, se mantuvo el gobierno personal del monarca, pero, debido a las exigencias del Parlamento canadiense y de los gobiernos de los dominios, el nombramiento de un nuevo líder se volvió inevitable.\n\nEl Rey Eduardo eligió a $CAN_mackenzie_king$ como primer ministro de Canadá y símbolo de la cohesión entre los dominios. $CAN_mackenzie_king$ ha acumulado una larga carrera política en Canadá, y su liderazgo moderado y prudente ha desempeñado un papel importante en mantener la estabilidad y la cooperación entre los dominios. Además, cuenta con la plena confianza del gobierno canadiense, y se espera que este nombramiento refuerce la unidad de todo el dominio.\n\nEl nombramiento de $CAN_mackenzie_king$ fortalecerá la solidaridad dentro del dominio y desempeñará un papel central en la construcción de un sistema defensivo más firme para que el Imperio Británico haga frente a la amenaza de otro mundo. Se le considera el líder adecuado para superar esta crisis y encabezar la reconstrucción del Imperio.\n\nAl nombrar a $CAN_mackenzie_king$, el Rey Eduardo subrayó: \"En estos tiempos difíciles, la cooperación y la unidad entre los dominios son más importantes que nunca. El primer ministro $CAN_mackenzie_king$ es la persona idónea para responder a esta necesidad de la época\".\n\n$CAN_mackenzie_king$ priorizará la estabilidad del Imperio Británico y la cooperación entre los dominios, y volcará sus esfuerzos en levantar de nuevo al Imperio en medio de esta crisis."
 IMP_5public: "60.º primer ministro del Reino Unido. "
 IMP.5.a: "$IMP_5public$ $ENG_winston_churchill$."
 IMP.5.b: "$IMP_5public$ $CAN_mackenzie_king$."
 IMP.6.t: "Comunicado del Parlamento canadiense: Un llamamiento a Su Majestad el Rey $ENG_king_edward$"
 IMP.6.desc: "Su Majestad el Rey $ENG_king_edward$,\n\nEn medio del colapso del mundo occidental y la crisis del Imperio Británico, nos encontramos en una situación en la que no podemos prever ni un paso por delante. Tras el ataque sorpresa y la capitulación de la metrópoli británica, el centro del Imperio se ha trasladado ahora a Canadá. Los pueblos y los dominios del Imperio Británico se han reunido bajo el liderazgo de Vuestra Majestad, y le agradecemos profundamente que haya guiado este tiempo de crisis mediante su gobierno personal.\n\nSin embargo, pese a estas circunstancias difíciles, creemos que debemos restaurar la estabilidad y la continuidad del Estado mediante la normalización del gobierno. En la actualidad, los dominios y los pueblos del Imperio Británico esperan que el gobierno canadiense ejerza un liderazgo firme para superar esta crisis. Cuando el liderazgo del primer ministro canadiense vuelva a desplegarse plenamente, podremos mantener la cohesión del Imperio y responder de manera eficaz a los desafíos derivados de los cambios en el mundo occidental.\n\nPor ello, el Parlamento canadiense ruega encarecidamente a Vuestra Majestad que ponga fin al régimen de emergencia y vuelva a confiar al primer ministro canadiense la plena autoridad de gobierno, para brindar estabilidad y esperanza al pueblo. Solo con medidas de este tipo podremos prepararnos para el futuro con un corazón unido y superar la crisis.\n\nSu Majestad, ha llegado el momento de que tome una decisión trascendental.\n"
 IMP.6.a: "Aceptemos la petición del Parlamento canadiense."
 IMP.6.b: "Rechacemos la petición del Parlamento canadiense."
 #\n\n...\n\nSobre el escritorio hay un comunicado oficial enviado por el Parlamento canadiense. Llevo varios minutos mirándolo fijamente. Las palabras del documento, como si tuvieran peso, se acercan a mí y me hunden en una profunda reflexión. La habitación está en silencio, y fuera, el viento helado de Canadá golpea la ventana y hace vibrar el cristal. Es irónico: yo, que una vez fui el rey de un Imperio que dominaba el mundo, ahora custodio un trono inestable en esta tierra extraña.\n\nEn ese comunicado estaba escrito con claridad. El Parlamento canadiense me exigía con firmeza que nombrara a un nuevo primer ministro. El tono tajante de que ya no podía demorarse más impregnaba cada rincón del texto. Se me hace pesado el pensamiento de que esta sola hoja de papel, colocada ante mí, podría decidir el destino del Imperio Británico.\n\nMe levanté y me acerqué a la ventana junto al escritorio. Afuera, la oscuridad se había asentado con fuerza, y a lo lejos las luces de la ciudad titilaban débilmente. Mi cabeza estaba llena de pensamientos. La exigencia del Parlamento es, sin duda, razonable. Por la estabilidad del Imperio, debo nombrar a un nuevo primer ministro. Si Mackenzie King ocupara el cargo, podría reforzar la cohesión entre los dominios y mantener el equilibrio del Imperio Británico.\n\nPero también existe otra opción. Yo sigo siendo el soberano de este Imperio. Como monarca absoluto, podría ejercer mi autoridad y conducir personalmente al Imperio. Sé bien que, en tiempos de crisis, se necesita un liderazgo fuerte. Quizá con mi determinación y mi voluntad pueda volver a levantar el Imperio. Sin embargo, eso podría desencadenar un conflicto con los dominios. El Imperio de ahora no es el de antes. Con la metrópoli caída, los dominios alzan sus propias voces. Si mi decisión hiere sus sentimientos, el Imperio podría entrar en un camino de división irreversible.\n\nRegresé al escritorio y tomé en la mano el comunicado enviado por el Parlamento. La textura del papel llegó a la punta de mis dedos. Esta hoja decidirá mi destino. ¿Aceptaré la exigencia del Parlamento y nombraré a un primer ministro, o elegiré el camino del monarca absoluto? Dos opciones están ante mí.\n\nHa llegado el momento de decidir. Cuanto más pasa el tiempo, más pesa la elección. Respiro hondo y me preparo para tomar una decisión. El hecho de que el destino del Imperio esté en mis manos vuelve a oprimirme. Pero soy el Rey. En este instante, debo tomar la decisión correcta.\n\nAl final, tomé la pluma y firmé en la línea de firma."
 IMP.7.t: "El Partido Liberal y el Partido Conservador"
 IMP.7.desc: "El Parlamento británico, tras pasar por la \"Gran Huida\", se ha asentado en la escena política canadiense. Con los veteranos del Partido Conservador británico incorporándose al Partido Conservador de Canadá, el Partido Conservador —que sufrió una derrota aplastante en las elecciones generales de 1935— se está convirtiendo en una gran amenaza para el Partido Liberal.\n\nAun así, todavía no podrán lanzarse de inmediato a la actividad política. Esto se debe a que necesitan reconocer el fracaso de las políticas del primer ministro Bennett y pasar por un proceso de reorganización de su partido. Mientras impulsan reformas internas, los conservadores harán esfuerzos por transformarse a sí mismos. Este proceso de cambio y reestructuración llevará tiempo, pero es muy probable que se muevan con un plan a largo plazo.\n\nSin embargo, si se les presenta una oportunidad, los conservadores podrán criticar la mala gestión de nuestro gobierno, exigir responsabilidades y sacudir el poder. Cuando estén plenamente preparados en lo político, el tablero de la política canadiense podría cambiar de forma drástica. Para prepararnos ante esta situación, nuestro gobierno debe elegir y concentrar sus esfuerzos tanto dentro como fuera, y responder con rigor teniendo en mente objetivos estratégicos mayores. Debemos tomar decisiones políticas prudentes para gestionar la crisis actual y prepararnos para los desafíos del futuro."
 IMP.7.a: "Qué dolor de cabeza..."
 IMP.8.t: "Ordenar el tráfico del Parlamento"
 IMP.8.desc: "Con la incorporación de los veteranos del Partido Conservador británico al Partido Conservador de Canadá, la confusión en el Parlamento se está intensificando. Varios diputados, que se niegan a aceptar la afiliación de políticos británicos, están elevando voces de oposición, mientras los diputados conservadores canadienses desestiman esos argumentos afirmando que se trata de un derecho garantizado por la Constitución. En esta situación, la importancia del primer ministro Mackenzie King ha empezado a destacar aún más."
 IMP.8.a: "\"No se me da eso de los discursos...\""
 IMP.9.t: "Tratamiento de la Enfermedad Británica"
 IMP.9.desc: "La 'Enfermedad Británica', que por tanto tiempo enfermó a Canadá, no es ahora más que una sombra del pasado. Gracias a los esfuerzos del dedicado personal médico, la mayoría de los pacientes ha recibido tratamiento, y quienes aún no han sido atendidos pronto entrarán también en el camino de la recuperación. La curación ha comenzado, y volvemos a avanzar hacia un futuro saludable."
 IMP.9.a: "¡Son buenas noticias!"


