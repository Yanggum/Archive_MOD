 IMP_if_day_desc: "Los canadienses no perciben una amenaza grave de dominación extranjera. Por ello, debemos imaginar que [KAI.GetName] invade Winnipeg. Esto incrementará la emisión de bonos de guerra rumbo a la victoria."
