 CAN_popular_anger_ns_desc: "§CNivel de ira§!: §Y[?CAN_popular_anger|0]§!\nLa repentina situación de exilio sacudió a Canadá y agravó el caos social. Con el impacto de la Gran Depresión y la acumulación de todo tipo de problemas, el pueblo ha perdido la confianza en el gobierno actual y ya ni siquiera espera nada de él."
 
