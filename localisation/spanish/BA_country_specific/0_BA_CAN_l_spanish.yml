 # Mackenzie King Focus
 mackenzie_king_is_leader_falg: "Estamos avanzando por la ruta de §YMackenzie King§!."
 CAN_Canada_new_deal: "Plan canadiense de obras públicas"
 CAN_Canada_new_deal_desc: "El gobierno de Mackenzie King está impulsando activamente políticas para crear empleo mediante grandes proyectos de obras públicas. Estos programas buscan aliviar el desempleo y revitalizar la economía a través de infraestructuras como carreteras, puentes y presas."
 CAN_infrastructure_effort: "Expansión del Ferrocarril Nacional Canadiense"
 CAN_infrastructure_effort_desc: "La red ferroviaria es la arteria vital de Canadá, prácticamente equivalente al Ferrocarril Nacional Canadiense. Ampliarla fortalecerá al país y demostrará su valor cuando llegue el momento de realizar suministros y transporte militar a escala nacional."
 CAN_create_national_employment_commission: "Comisión Nacional de Empleo"
 CAN_create_national_employment_commission_desc: "Fundada en 1936, la Comisión Nacional de Empleo se creó para abordar el grave problema del desempleo que afecta a todo Canadá. Investiga exhaustivamente la situación laboral y propone recomendaciones para que el gobierno implemente programas eficaces de creación de empleo, desempeñando un papel clave en la recuperación económica."
 CAN_Federal_Provincial_Cooperative_Programs: "Programas de cooperación federal-provincial"
 CAN_Federal_Provincial_Cooperative_Programs_desc: "El gobierno de Mackenzie King está reforzando la cooperación entre el gobierno federal y las provincias para hacer frente a la Gran Depresión. A través de estos programas, se colabora estrechamente en asistencia al desempleo, vivienda, apoyo agrícola y otros ámbitos."
 CAN_social_security_system: "Sistema de seguridad social"
 CAN_social_security_system_desc: "El gobierno está introduciendo gradualmente un sistema de seguridad social. Estas políticas, como el seguro de desempleo, proporcionarán estabilidad a los ciudadanos y aliviarán la inseguridad económica, sentando las bases del futuro estado de bienestar canadiense."
 CAN_banking_reform: "Reforma bancaria"
 CAN_banking_reform_desc: "El gobierno de Mackenzie King busca estabilidad financiera mediante la reforma del sistema bancario canadiense. En particular, el Banco de Canadá, fundado en 1935, desempeña un papel central en la estabilización de los mercados financieros y la política monetaria."
 # Fin Mackenzie King
 CAN_Strengthen_cohesion: "Reforzar la cohesión de la Commonwealth"
 CAN_Strengthen_cohesion_desc: "Reforzar la cohesión de la Commonwealth"
 CAN_public_works: "Establecer campamentos federales de socorro"
 CAN_public_works_desc: "Los efectos de la Gran Depresión aún persisten y numerosos desempleados siguen atrapados en la pobreza o empujados al crimen. La mejor opción es reunirlos en 'campamentos federales de socorro', donde recibirán salarios y alimentos y serán utilizados como fuerza laboral preparada en todo el país."
 IMP_canada_wheat_board: "Junta Canadiense del Trigo"
 IMP_national_housing_act: "Ley Nacional de Vivienda"
 IMP_national_housing_act_desc: "La vivienda es una necesidad básica y una fuente clave de actividad económica. Al fomentar la construcción y compra de viviendas, se genera demanda en industrias clave y se impulsa la expansión de la economía industrial."
