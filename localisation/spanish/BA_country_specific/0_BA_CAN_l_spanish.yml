 ENG_country_intro_header: "¡Gobierna, Britannia!"
 ENG_country_intro_header_1: "La Gran Guerra y la paz"
 ENG_country_intro_header_2: "Los britanos jamás serán esclavos."
 ENG_country_intro_content: "La victoria en las Guerras Napoleónicas marcó el punto de inflexión que hizo del Imperio Británico una potencia hegemónica a escala mundial. El triunfo de la coalición antifrancesa debilitó la influencia de Francia en Europa y, apoyándose en una marina relativamente más poderosa y una red comercial extendida por todo el mundo, Gran Bretaña lideró el orden internacional. La 'Pax Britannica' iniciada en ese entonces—la era en la que el Imperio Británico arbitró los principales conflictos del mundo y preservó la paz—es recordada como su período más grandioso.\n\nLa edad dorada victoriana que llegó tras las Guerras Napoleónicas permitió al Imperio Británico vivir su mejor época, pero la casi inexistencia de guerras en ese período tuvo como resultado que los británicos quedaran empapados de paz. El Imperio Británico disfrutó de tiempos gloriosos. El esplendor del Imperio se mostró al mundo entero: Hong Kong, Australia, Nueva Zelanda, Canadá y, más allá, la gigantesca joya llamada India adornaban la corona del Imperio Británico.\n\nAño tras año, el Imperio Británico—que, junto con Francia, dividía de facto el mundo en dos—heredó de España el apodo de 'el imperio donde no se pone el sol'. Parecía que su prestigio continuaría para siempre."
 ENG_country_intro_content_1: "Pero todo tiene un final. El poder del Imperio Británico también empezó a tambalearse poco a poco. La Gran Bretaña que había derrotado a Napoleón y dominado Europa comenzó, con el paso del tiempo, a enfrentarse al desafío de nuevas grandes potencias. En especial, después de que Prusia lograra la unificación y formara el Imperio Alemán, Alemania incrementó rápidamente su poder nacional y pisó los talones del Imperio Británico. La 'política mundial (Weltpolitik)' impulsada por el káiser Guillermo II mostró ambiciones imperialistas e intentó reordenar el orden de Europa y del mundo. El ascenso alemán fue tan amenazante que empujó a Gran Bretaña a tomar la mano de su rival histórico, Francia.\n\nAl final, este conflicto se intensificó gradualmente y desembocó en la trágica catástrofe de la Primera Guerra Mundial—la Gran Guerra. El conflicto arrasó Europa y el planeta y arrebató incontables vidas, infligiendo daños enormes a las principales potencias, incluida Gran Bretaña. El Imperio Británico también perdió a muchísimos soldados, y la carga financiera y económica de la guerra se disparó. Esto sacudió gravemente el prestigio del Imperio y lo dejó en una posición en la que ya no podía mantener el mismo poder abrumador de antes.\n\nAun así, el Imperio Británico soportó la crisis. Gracias a sus vastas colonias por todo el mundo y a una base económica aún sólida, logró mantener una posición relativamente estable incluso durante la Gran Depresión posterior a la Gran Guerra. Pero las cicatrices de la guerra dejaron un profundo impacto en la sociedad y la economía británicas. Los enormes recursos y mano de obra consumidos durante la guerra, y la carga fiscal resultante, fueron debilitando poco a poco a Gran Bretaña. Por ello, el Imperio Británico empezó a adoptar una actitud cada vez más pasiva ante la guerra, y su liderazgo en el escenario mundial también se fue debilitando gradualmente."
 ENG_country_intro_content_2: "Lo que apuñaló por la espalda al Imperio Británico, que enarbolaba su bandera por todo el mundo, no fue otra cosa que unos forasteros aparecidos de repente. Ellos destrozaron Europa, y Gran Bretaña tampoco fue la excepción. Tras ver cómo Londres caía ante esos alienígenas llamados Kaiser Corporation y cómo los países europeos se derrumbaban, los ciudadanos del Imperio Británico—sin distinguir entre políticos y gente común—se están alzando contra ellos.\n\nPero el destino del Imperio Británico es como una lámpara de aceite en medio del viento. Al ver tambalearse al tirano llamado Gran Bretaña, las colonias que simbolizaban su prestigio buscan con ansia la oportunidad de escapar de esas cadenas. La diferencia de poder entre Kaiser Corporation y el ejército británico hizo brotar en los británicos la semilla de la desesperación.\n\nLas Islas Británicas, que no habían sufrido ataques extranjeros desde la Conquista normanda, vuelven a hundirse en el caos. Puede que ahora no parezca haber ninguna esperanza para ellos, pero bajo el nombre de Britannia, los soldados empuñarán sus fusiles y lucharán hasta el final contra los alienígenas."
