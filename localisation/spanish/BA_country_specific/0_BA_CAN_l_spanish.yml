 impindia.6.a: "Ah, ¿rechazaron esto? jajaja"

 impquebec.1.t: "Quebec envuelta en llamas"
 impquebec.1.d: "Tras la Gran Depresión, el descontento de la provincia de Quebec, que había permanecido reprimido lentamente, se ha convertido en un problema social abierto a raíz de este Gran Traslado y la epidemia masiva. En particular, los actos discriminatorios cometidos en Quebec por los exiliados llegados de Gran Bretaña avivaron la ira de los ciudadanos, y así estallaron protestas a gran escala. Los quebequenses se volcaron a las calles, y la Rue Sainte-Catherine de Montreal se llenó de multitudes furiosas. Están lanzando consignas de oposición feroz no solo contra el primer ministro, sino también contra el Rey.\n\nEsto recuerda a la Crisis del Reclutamiento de 1917, pero esta vez parece que la paciencia de los canadienses francófonos ha llegado al límite. \"¡¿Debemos derramar sangre francesa una vez más por los británicos?!\"—clamó el vicegobernador de Quebec ante la multitud reunida en la ciudad de Quebec—. \"¡Nosotros decimos que no! ¡Pero ellos dicen que debemos hacerlo! Mientras Quebec siga siendo el perro faldero de los políticos británicos, ¡nunca podremos ser libres de su tiranía!\""
 impquebec.1.a: "Debí haber sabido que esto iba a pasar"
 
 impblack.0.t: "La situación económica de Canadá"
 impblack.0.d: "La situación económica de Canadá atraviesa actualmente una crisis grave. Los efectos de la Gran Depresión aún persisten, retrasando la recuperación; el alto desempleo y el aumento de precios están haciendo más dura la vida de la población. A esto se suma que, tras el colapso de la metrópoli británica, numerosos exiliados han entrado en Canadá, incrementando todavía más la carga fiscal del Estado. Como resultado, el gobierno tiene dificultades para distribuir recursos limitados, y la incertidumbre en toda la economía está creciendo.\n\nCanadá carga ahora con la tarea de estabilizar su economía: resolver los problemas de la Gran Depresión y aliviar la carga fiscal adicional causada por los exiliados."
 impblack.0.a: "Qué dolor de cabeza"

 impblack.1.t: "$CAN_create_national_employment_commission$"
 impblack.1.desc: "Al desplegar el periódico matutino, el señor Phillips recorrió los titulares con un ánimo cargado de decepción. El desempleo provocado por la Gran Depresión era una palabra familiar para él, pero seguía sin encontrar una salida. La fábrica en la que había trabajado durante tanto tiempo cerró hace años y, desde entonces, intentó buscar empleo una y otra vez, pero siempre terminaba en fracaso. Sin embargo, aquel día, una pequeña nota en una esquina del periódico captó su atención.\n\n\"Comisión Nacional de Empleo, primer paso para resolver el desempleo a escala nacional.\"\n\nLeyó el artículo con calma. Decía que la comisión investigaría el problema del desempleo y que tendría la función de recomendar, a nivel gubernamental, medidas para crear puestos de trabajo. Al señor Phillips le nació la esperanza de que, quizá, esta vez fuera distinto. El artículo enfatizaba que, a través de la comisión, el gobierno estaba preparando planes para impulsar obras públicas y así ofrecer empleo.\n\nPocos días después, decidió ir a visitar la Comisión Nacional de Empleo. Seguía inquieto, pero al menos valía la pena intentarlo. La oficina de la comisión era mucho más grande y organizada de lo que esperaba. Al abrir la puerta y entrar, el personal lo recibió con amabilidad y le preguntó con serenidad qué ayuda necesitaba. Esa calidez le dio una extraña sensación de alivio.\n\nEl asesor escuchó con atención la experiencia y la situación de Trevor, y le recomendó un programa de obras públicas adecuado para él: trabajos para construir infraestructura comunitaria, como reparaciones de puentes o ampliaciones de carreteras. El señor Phillips comprendía cuán importante era ese tipo de trabajo. No se trataba solo de ganarse la vida; significaba una oportunidad de volver a contribuir a la sociedad.\n\nUnas semanas después, el señor Phillips empezó un nuevo trabajo. Al principio le resultó extraño y duro, pero cada mañana, al dirigirse al lugar de obras, sentía que recuperaba la energía de vivir. Ensanchar caminos y levantar puentes junto a sus compañeros era agotador, pero en ese proceso volvió a sentir la sensación de logro que había perdido hacía mucho.\n\nUn día, durante el descanso, mientras bebía café y conversaba con sus compañeros..."
 impblack.1.a: "\"Gracias a la Comisión Nacional de Empleo pudimos reunirnos así todos nosotros.\""

 impblack.2.t: "$CAN_social_security_system$"
 impblack.2.desc: "El señor Michael, tras sufrir una grave herida en un accidente laboral, sintió una desesperación como si todo se viniera abajo. El accidente en el trabajo donde había esforzado durante años no solo le dañó el cuerpo: le arrebató el sustento y hasta la esperanza de futuro. Las facturas médicas se acumulaban, y su realidad—incapaz de trabajar—era como un túnel sin salida. Su mirada sobre el mundo se fue oscureciendo poco a poco, atrapado en la ansiedad y el miedo de sentir que jamás podría levantarse de nuevo.\n\nPero un día, se enteró de la noticia sobre el nuevo sistema de seguridad social introducido por el gobierno. Este sistema proporcionaba apoyo económico durante un período determinado a los desempleados o a quienes, por accidentes, ya no podían trabajar. Al principio, no estaba seguro de cuánto podría ayudarle, pero con el tiempo comenzó a comprender su significado.\n\nGracias a la seguridad social, ya no tuvo que preocuparse día tras día por sobrevivir. El beneficio, pequeño pero constante, fue estabilizando su vida poco a poco, y tras mucho tiempo recuperó algo de calma. El señor Michael empezó a albergar la esperanza de que podía ponerse en pie otra vez. Decidió no rendirse.\n\nReanudó la búsqueda de empleo. Su cuerpo aún no se había recuperado del todo, pero estaba lleno de voluntad: debía esforzarse por un futuro mejor. Con la esperanza de regresar como miembro de la sociedad, salió a buscar oportunidades.\n\nEl señor Michael tenía ahora un nuevo desafío ante sí. En sus ojos volvió a encenderse una luz, y estaba listo para avanzar hacia el futuro."
 impblack.2.a: "\"Señor Michael. Empiece a trabajar desde mañana.\""

 impblack.3.t: "$CAN_banking_reform$ - 1"
 impblack.3.desc: "A medida que la Gran Depresión canadiense se profundizaba, la desesperación se extendía por todas partes. Muchos perdieron todos sus bienes depositados en los bancos, y los agricultores también fueron hundiéndose más y más al cortarse el crédito. Aferrados a herramientas viejas, apenas lograban mantener su sustento; con el paso del tiempo, caían en una frustración aún mayor. La ansiedad se cernía sobre todo Canadá, incluido el campo, y su esperanza se desvanecía.\n\nEn esa situación, el primer ministro Mackenzie King ya no podía quedarse quieto. Decidió iniciar una reforma bancaria para rescatar a los bancos al borde de la quiebra y recuperar la confianza del pueblo. Corregir el sistema financiero era una medida indispensable para estabilizar la economía. Con el temor de que el colapso bancario sacudiera toda la economía, King tomó una determinación.\n\nLa reforma apenas comenzaba, pero poco a poco se percibían cambios. Algunos bancos reabrieron, y los agricultores, aunque con dificultad, pudieron hacerse de los fondos necesarios. Con una expectativa cautelosa, levantaron sus pequeños vasos al comprender que ya no tendrían que depender únicamente de herramientas viejas."
 impblack.3.a: "¡Ni siquiera tenían dinero para comprar herramientas agrícolas!"

 impblack.4.t: "$CAN_banking_reform$ - 2"
 impblack.4.desc: "El señor Franklan llevaba días intentando comunicarse con el banco. Con su pequeña y mediana empresa al borde del abismo, pensaba que un préstamo bancario era su última esperanza. Pero ese día tampoco fue diferente.\n\n\"¿Por qué demonios no se puede?\" preguntó con voz desesperada. Ya lo había intentado varias veces, y la respuesta siempre era la misma.\n\nEl empleado del banco respondió con cautela: \"Lo siento, nosotros también estamos haciendo lo posible. Pero... ahora mismo es difícil conceder el préstamo.\"\n\nCon esas palabras, el señor Franklan se quedó sin habla. Al colgar, lo asaltó una frustración profunda: la idea de que su empresa pudiera quebrar pasó por su mente. El miedo de ver derrumbarse, en un instante, la compañía que había construido durante tanto tiempo se volvió real. Los rostros de sus empleados y las promesas con tantos clientes le cruzaron la cabeza. No pudo hacer más que dejarse caer en la impotencia.\n\nDías después, llegó el día del destino. El teléfono sonó. El señor Franklan levantó el auricular lentamente.\n\n\"Hola, ¿el señor Franklan?\" Se oyó la voz del empleado del banco. \"Se ha hecho posible aprobar el préstamo.\"\n\nEn ese instante, el señor Franklan guardó silencio, como si no pudiera creerlo. La noticia que tanto había esperado llegaba en el peor momento. Aún no podía sentirse completamente tranquilo, pero al saber que su empresa había superado la crisis de la quiebra, sintió un alivio profundo."
 impblack.4.a: "¡Menos mal!"

 impblack.5.t: "$CAN_banking_reform$ - 3"
 impblack.5.desc: "El gobierno canadiense ha hecho el sistema bancario más seguro al reforzar de forma drástica las regulaciones financieras tras la Gran Depresión. Estas medidas han inculcado en inversores y depositantes la convicción de que su dinero está protegido. En concreto, la regulación reforzada redujo la asunción excesiva de riesgos por parte de los bancos y frenó los préstamos imprudentes, elevando la estabilidad del sistema financiero. Como resultado, las instituciones financieras comenzaron a operar con políticas de inversión y crédito más prudentes, lo cual tuvo un impacto positivo en el conjunto del mercado.\n\nEstos cambios ofrecieron un entorno financiero más seguro no solo para las personas, sino también para las empresas. Gracias a un sistema estable, las empresas pudieron llevar una gestión financiera predecible, contribuyendo también al crecimiento económico general.\n\nAsí, la gente común, al depositar dinero o invertir, ya no siente la misma ansiedad y ha ganado una mayor confianza."
 impblack.5.a: "\"Que nuestro dinero esté a salvo... qué alivio.\""

 impblack.6.t: "La resolución de la Gran Depresión"
 impblack.6.desc: "Ya no hay más pánico. Tras el esfuerzo tenaz de nuestro gobierno, los principales indicadores económicos han vuelto a su curso normal, y el pueblo finalmente ha recuperado la vida cotidiana y la estabilidad de antes de la Gran Depresión. Ya ninguna amenaza externa podrá sacudirnos. Resistimos y, por fin, lo superamos."
 impblack.6.a: "Hoy, al menos, debemos brindar."

 impblack.15.t: "Las dificultades de los agricultores"
 impblack.15.desc: "Canadá se enfrenta a una triple catástrofe: sequía, caída del precio de los granos y la Gran Depresión. Al desplomarse el consumo, los agricultores quedaron aún más aplastados por las deudas que ya cargaban desde antes de la Depresión, lo que derivó en una situación en la que ni siquiera podían producir granos como es debido. La bancarrota se vuelve una realidad inevitable. La caída de ingresos por malas cosechas significa, al final, que podrían perder sus tierras."
 impblack.15.a: "No hay nadie a quien no le cueste."
 impblack.15.b: "Probemos a empezar una condonación de deudas."

 impblack.10.t: "Debate"
 impblack.10.d: "El programa de cooperación federal-provincial es una estructura colaborativa en la que el gobierno federal coordina las políticas provinciales y las encauza hacia una mejor dirección. Sin embargo, estos programas son un arma de doble filo. Si ocurre un problema o incidente, al gobierno federal le resultará difícil evadir la responsabilidad por los fracasos provinciales, lo cual puede aumentar la desconfianza hacia el gobierno federal. Por el contrario, si el gobierno federal no interviene en las políticas provinciales, también existe la posibilidad de que los gobiernos provinciales se corrompan o sean incapaces de cumplir adecuadamente con sus tareas.\n\nPor estas razones, algunos expertos recomiendan gestionar y supervisar estos programas con cautela. Mientras una postura sostiene que deben vigilarse y corregirse estrictamente todas las políticas provinciales, los ministros que apoyan el libre mercado argumentan que debe minimizarse la intervención del gobierno y permitir que las provincias funcionen de manera autónoma."
 impblack.10.a: "Enviemos supervisores."
 impblack.10.b: "Supervisemos y gestionemos directamente."

 impblack.11.t: "La dirección de la política"
 impblack.11.d: "Mientras cooperamos con los gobiernos provinciales, hemos caído en la preocupación de cómo fijar el rumbo de las políticas. Ahora debemos decidir dónde y cómo llevaremos a cabo las políticas."
 impblack.11.a: "Centrémonos en los problemas burocráticos."
 impblack.11.b: "Invirtamos en el desarrollo de la industria regional."
 impblack.11.c: "Invirtamos en instalaciones de investigación regionales."
 

 completed_CAN_from_federal_proincial_coop_tt: "En esa región están apareciendo los resultados del programa de cooperación federal-provincial, y traerán efectos beneficiosos."
 impblack.12.t.hospital: "Ampliación del sistema sanitario"
 impblack.12.d.hospital: "Hoy, el hospital ha abierto sus puertas. El fruto del apoyo del gobierno federal y la cooperación del gobierno provincial se despliega por fin ante nuestros ojos. Un sueño largamente anhelado por los residentes se ha hecho realidad, y el nuevo hospital desempeñará un papel clave en la prevención de los problemas de salud de la comunidad. No es una simple inauguración: es el primer paso para hacer la vida de la gente más segura y próspera. La calidad de vida ha mejorado notablemente, y ese cambio continuará en adelante."
 impblack.12.t.school: "Una nueva escuela abre sus puertas"
 impblack.12.d.school: "Hoy, la escuela ha abierto sus puertas. El fruto del apoyo del gobierno federal y la cooperación del gobierno provincial se despliega por fin ante nuestros ojos. Un sueño largamente anhelado por los residentes se ha hecho realidad, y la nueva escuela desempeñará un papel importante al resolver los problemas educativos de la comunidad. No es una simple apertura de un centro educativo: es el primer paso para hacer el futuro de la gente más luminoso y próspero. La calidad educativa ha mejorado notablemente, y ese cambio continuará en adelante."
 impblack.12.t.housing: "Programa de suministro de vivienda"
 impblack.12.d.housing: "El proyecto de suministro de vivienda iniciado por el gobierno provincial local está trayendo cambios visibles. Gracias a este proyecto, el número de personas sin hogar en la región ha disminuido de forma notable, y, al establecerse un entorno residencial estable, la calidad de vida de los habitantes también ha mejorado considerablemente. En su día a día, la ansiedad y el dolor se desvanecen lentamente, y en su lugar se instalan una nueva esperanza y alivio. Tener un hogar no es simplemente obtener un techo: es sentar la base para reconstruir la vida. En consecuencia, el patriotismo de los residentes se ha profundizado, y su sentido de responsabilidad hacia la comunidad también ha crecido."
 impblack.12.t.gun: "Expansión de la industria militar"
 impblack.12.d.gun: "Según el plan del gobierno provincial, se ha construido en la región una fábrica que produce suministros militares. La creación de esta planta va más allá de levantar una instalación: ha brindado una nueva esperanza a innumerables personas que habían perdido su empleo y vagaban sin rumbo. El desempleo se ha aliviado de manera visible, y la economía regional ha empezado a recuperar su vitalidad. La fábrica se ha convertido en un lugar para sostener la vida y, a la vez, en un símbolo que insufla nuevas posibilidades a la comunidad."
 impblack.12.t.min: "Expansión industrial"
 impblack.12.d.min: "Algunas ciudades han logrado una industrialización tan asombrosa que ya pueden llamarse el centro de una revolución industrial local. Una base industrial sólida, abundante mano de obra especializada y la determinación de una dirigencia perspicaz que mira hacia el futuro han impulsado a estas regiones a desarrollarse de forma constante. Miles de personas sudan entre las máquinas de las fábricas, y los productos que nacen de sus manos brotan sin cesar por las líneas de producción. Lo que fluye aquí no son solo capital y mercancías, sino una fuerza poderosa que impulsa el crecimiento y la transformación de toda una sociedad. El humo que sale de las chimeneas se ha convertido en símbolo de prosperidad, y todo esto es una prueba viviente de que las políticas económicas que desplegamos han echado raíces con éxito."
 impblack.12.t.failure_1: "¡Fracaso de la política del gobierno provincial!"
 impblack.12.d.failure_1: "La política del gobierno provincial tomó un rumbo inesperado, y el resultado dejó profundas heridas en la comunidad local. Ante ello, el gobierno federal ya no pudo limitarse a observar y se vio obligado a intervenir mediante medidas de rescate de emergencia. La situación ya había alcanzado un punto crítico, y era necesario actuar con rapidez para corregir el problema."
 impblack.12.t.failure_2: "¡Gobierno provincial envuelto en un escándalo de malversación!"
 impblack.12.d.failure_2: "Un enfoque laissez-faire para el desarrollo económico ha traído logros visibles, pero una sombra se cierne sobre su reverso. Bajo una regulación laxa, una parte considerable de la riqueza producida está yendo, sin pretenderlo, a manos de estafadores. Recientemente, algunos comerciantes adinerados utilizaron sus vastos activos para comprar el poder local, y en ese proceso los fondos del gobierno provincial fluyeron hacia lugares invisibles. Antes de cruzar el límite de la ley, montaron una gigantesca malversación y lograron socavar los pilares de la economía regional. Pero esto no es más que la punta del iceberg. Hemos llegado al punto en que debemos combatir esta corrupción y liberarnos de esa oscura influencia."


