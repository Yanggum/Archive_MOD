#이벤트
  IMP_event.1.t: "Exilio de la Marina Real y del Ejército"
 IMP_event.1.d: "Los soldados que luchaban ferozmente del lado británico han huido al exilio."
 IMP_event.1.a: "Ah, ¿ya han llegado?"

 IMP_event.2.t: "Resistencia de Canadá"
 IMP_event.2.d: "¡Canadá expulsa a Gran Bretaña!"
 IMP_event.2.a: "Mostrémosles nuestro poder."

 IMP_event.3.t: "Ocupación de Surinam"
 IMP_event.3.d: "Aprovechando el vacío tras el colapso del gobierno neerlandés, el ejército británico ha decidido encargarse temporalmente de la administración de Surinam."
 IMP_event.3.a: "¡Es solo para mantener el orden!"

 IMP_event.4.t: "Las Indias Occidentales"
 IMP_event.4.d: "Hemos reunido las colonias del Caribe y formado las Indias Occidentales."
 IMP_event.4.a: "No es más que una medida provisional."

 IMP_event.5.t: "Intento de Egipto de nacionalizar el Canal de Suez"
 IMP_event.5.d: "Egipto intenta nacionalizar el Canal de Suez. Debemos negociar rápidamente con ellos para minimizar la crisis."
 IMP_event.5.b: "¡Mostrémosles el estatus del Imperio Británico!"
 IMP_event.5.a: "Reconozcamos su nacionalización a cambio de exigir derecho de paso"
 IMP_event.5.c: "Ahora mismo somos débiles."

 IMP_event.6.t: "Aceptación británica"
 IMP_event.6.d: "Gran Bretaña ha reconocido nuestra nacionalización."
 IMP_event.6.a: "¡Bien!"

 IMP_event.7.t: "Exigencia británica de derecho de paso"
 IMP_event.7.d: "A cambio de reconocer nuestra nacionalización, Gran Bretaña ha exigido el derecho de paso."
 IMP_event.7.a: "Es un trato razonable."
 IMP_event.7.b: "Ni soñarlo."

 IMP_event.8.t: "Garantía egipcia del derecho de paso"
 IMP_event.8.d: "Egipto ha reconocido nuestro derecho de paso."
 IMP_event.8.a: "Menos mal."

 IMP_event.9.t: "Rechazo egipcio"
 IMP_event.9.d: "Egipto ha rechazado nuestra propuesta."
 IMP_event.9.a: "¡Maldita sea!"

 IMP_event.10.t: "Rechazo británico"
 IMP_event.10.d: "Gran Bretaña ha rechazado nuestra nacionalización."
 IMP_event.10.a: "¡Aun así, ese lugar es nuestro territorio!"

 IMP_event.11.t: "Guerra de Oriente Medio"
 IMP_event.11.d: "Tras fracasar varios días de negociaciones, los gobiernos de Egipto y Gran Bretaña—que venían chocando por la nacionalización del Canal de Suez—han entrado en estado de guerra.\n\nEgipto sostiene que se trata de una decisión sobre nuestro propio territorio y critica la invasión británica como una 'guerra sin justificación'. Por ahora, la postura oficial británica no se ha hecho pública.\n\nAnte esta invasión británica, los países de Oriente Medio han formado una alianza para ayudar a Egipto y han entregado una declaración oficial de guerra al gobierno británico."
 IMP_event.11.a: "¡Mostremos el poder del Imperio Británico!"
 IMP_event.11.b: "¡Expulsad al opresor!"
 IMP_event.11.c: "Qué interesante."

 IMP_event.12.t: "Un territorio frío"
 IMP_event.12.d: "Pese a la desesperada resistencia de los civiles, no fue posible detener a los enemigos llegados del otro mundo. Sin embargo, el alto mando británico apoyó para que la familia real de Britania, los altos cargos del gobierno, diputados, capitalistas y técnicos pudieran huir con antelación a Canadá antes de que el caos en la metrópoli se agravara; y, a estas alturas, eso se ha convertido en una carta que permite una reconstrucción rápida."
 IMP_event.12.a: "Pero no todo el mundo los recibía con agrado."

 IMP_event.15.t: "Intervención colonial"
 IMP_event.15.d: "Aún no es momento de desesperar. ¡El Imperio Británico todavía no ha muerto, y las colonias pueden ser controladas!"
 IMP_event.15.a: "¡Aplastemos a los enemigos!"

 IMP_event.17.t: "Dimisión de Stanley Baldwin"
 IMP_event.17.d: "Hoy, el primer ministro británico Stanley Baldwin ha dimitido por motivos de salud. Para que la reconstrucción recién iniciada no se estanque, tendremos que elegir a un nuevo primer ministro del gobierno provisional británico."
 IMP_event.17.a: "$ENG_winston_churchill$ del Partido Conservador."
 IMP_event.17.b: "Clement Attlee del Partido Laborista."
 IMP_event.17.c: "El primer ministro del Dominio de Canadá, $CAN_mackenzie_king$."
 
 IMP_event.18.t: "Convocatoria británica a la Commonwealth"
 IMP_event.18.d: "Ahora que el caos administrativo ha terminado, Gran Bretaña ha vuelto a convocar a sus dominios."
 IMP_event.18.a: "Vamos."

 IMP_event.19.t: "Exigencia británica de sumisión"
 IMP_event.19.d: "Con el pretexto de asegurar una cabeza de puente para avanzar hacia la metrópoli, Gran Bretaña nos ha exigido que entreguemos nuestra soberanía."
 IMP_event.19.a: "¡¿Están locos?!"
 IMP_event.19.b: "...No es que no estemos dispuestos a unirnos a la Commonwealth. Si nos entregan Irlanda del Norte."
 IMP_event.19.c: "Entonces dennos Irlanda del Norte."

 IMP_event.20.t: "Aceptación parcial de Irlanda"
 IMP_event.20.d: "Irlanda ha comunicado que, si aceptamos parcialmente su exigencia y le entregamos Irlanda del Norte, se unirá a la Commonwealth."
 IMP_event.20.a: "Acepta su exigencia."
 IMP_event.20.b: "No podemos renunciar a un territorio legítimo del Imperio Británico."

 IMP_event.21.t: "Aceptación de Irlanda"
 IMP_event.21.d: "Irlanda ha aceptado nuestra exigencia."
 IMP_event.21.a: "¡Perfecto!"

 IMP_event.22.t: "Gran Bretaña nos ha invitado a la Commonwealth"
 IMP_event.22.d: "Gran Bretaña nos ha invitado a su facción."
 IMP_event.22.a: "Aceptar."
 IMP_event.22.b: "Rechazar."

 IMP_event.24.t: "Una promesa para el pueblo"
 IMP_event.24.d: "Para aumentar nuestro apoyo comunista, haremos una promesa al pueblo. ¿Qué promesa haremos?"
 IMP_event.24.a: "Prometer la construcción de fábricas militares."
 IMP_event.24.b: "Prometer la construcción de fábricas civiles."
 IMP_event.24.n: "Prometer el más alto nivel de vida."
 IMP_event.24.m: "Prometer la igualdad de género."
 
 IMP_event.28.t: "[FROM.GetName] exige la devolución de territorios"
 IMP_event.28.d: "Básicamente, dice que Gran Bretaña anda llorando para que le devuelvan la tierra."
 IMP_event.28.a: "Como quieras."
 IMP_event.28.b: "Ni lo sueñes."
 
 IMP_event.29.t: "[FROM.GetName] aceptó nuestra exigencia"
 IMP_event.29.d: "Básicamente, dice que nos devolvieron nuestra tierra."
 IMP_event.29.a: "Bien."
 
 IMP_event.30.t: "[FROM.GetName] rechazó nuestra exigencia"
 IMP_event.30.d: "Básicamente, dice que el otro lado se negó."
 IMP_event.30.a: "¡No se va a arreglar hablando!"

