  SRT_sword_of_srt_hero:0 "La espada de Kivotos"
  SRT_sword_of_srt_hero_desc:0 "Hace tiempo, la Orden de Santa Justina fue la espada de la Academia Trinity: cortó, reprimió y aniquiló a sus enemigos. Algunos estudiantes creen que su misión y la de la SRT son parecidas; así como ellos fueron la orden de caballería de Trinity, nosotros somos la del Consejo. ¡Somos la espada de Kivotos; alzaremos una hoja llameante y la blandiremos contra sus enemigos!"
