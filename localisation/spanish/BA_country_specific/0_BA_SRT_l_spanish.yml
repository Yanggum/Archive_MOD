l_spanish:
  SRT_country_intro_header: "§CCarbanog al borde del cierre§!"
  SRT_country_intro_content: "\nLa Academia Especial SRT es una escuela especializada, establecida por el Consejo Estudiantil General, que forma unidades especiales destinadas a resolver con rapidez las situaciones delictivas graves en cada academia. En Kivotos, la seguridad dentro de cada distrito académico suele ser responsabilidad de la propia academia, mientras que fuera de estos distritos la mantiene la Academia de Policía Valkyrie; sin embargo, por cuestiones de autonomía, Valkyrie no podía intervenir en otras academias. Por ello, la presidenta del Consejo, amparándose en su autoridad, otorgó inmunidad y creó la SRT para entrenar efectivos capaces de intervenir por la fuerza donde fuera necesario. La creación de la SRT, no obstante, ignoraba la autonomía de las academias; surgió descontento, pero el carisma y el prestigio de la presidenta sofocaron toda oposición.\n\nTras la Gran Traslación, la SRT quedó aislada del Consejo y terminó asentada en Bretaña, Francia. A diferencia de Millennium, donde los choques entre estudiantes y locales escalaron hasta la guerra total, la SRT sofocó de inmediato los disturbios y estabilizó la situación. Sin embargo, sin comunicaciones con el Consejo, la confusión crece: algunos quieren regresar y cumplir su misión original; otros creen que la SRT debe impartir justicia por sí misma.\n\nTu elección marcará el rumbo de la SRT. ¡Lleva la justicia de la SRT al mundo entero!\n\n§YDesarrollo - Mako§!\n§YDesarrollo auxiliar - KR_appleman, mintcoon, Lolenheim, Wolha§!"
  SRT_guide: "Objetivos\n£white_dot. Escapa del riesgo de cierre.\n£white_dot. Recupera la conexión con el Consejo Estudiantil General o libérate de su control.\n£white_dot. Lucha por ser reconocida como una academia oficial."
 
