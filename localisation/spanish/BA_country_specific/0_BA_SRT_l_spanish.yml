  SRT_focus_1:0 "Evaluar la situación"
  SRT_focus_1_desc:0 "¡Maldita sea! ¿Qué demonios ha pasado? Toda comunicación con el Consejo Estudiantil se ha cortado. Fuera de la academia hay un bosque espeso que antes no existía; las carreteras han desaparecido y las reservas son escasas. Moriremos de hambre antes de salir de esta. Todo es un caos… ¿Dónde está ella? ¡Encontradla ya!"
  SRT_focus_1_1:0 "Decisión"
  SRT_focus_1_1_desc:0 "Yukino Shichido, del Pelotón FOX, convoca una reunión de emergencia. Cada día las reservas disminuyen y los estudiantes exigen un plan. Las comunicaciones con el Consejo son inestables; quizá debamos elegir nuestro propio camino. Yukino debe decidir."
  SRT_focus_2:0 "Rechazar la obediencia"
  SRT_focus_2_desc:0 "Gana apoyo la interpretación de que un Consejo sin presidenta no puede mandar sobre la SRT. Algunos radicales ya han redactado un manifiesto, y el silencio de Yukino revela su posición. Solo queda elevar ese manifiesto a declaración oficial."
  SRT_focus_2_1:0 "Obedecer"
  SRT_focus_2_1_desc:0 "Aunque el Consejo sea un tigre desdentado, sigue por encima de nosotros según el reglamento. No gozaremos de plena libertad, pero la seguridad que brinda compensa con creces. Vamos, prestemos juramento de lealtad."
  SRT_focus_b:0 "El fin del Consejo Estudiantil"
