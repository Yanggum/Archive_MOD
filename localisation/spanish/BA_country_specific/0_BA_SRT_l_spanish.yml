  SRT_event.1.t:0 "Evaluar la situación"
  SRT_event.1.d:0 "Parece que hemos sido transportados a otro mundo. La conexión con el Consejo Estudiantil se ha cortado y debemos decidir cómo sobrevivir aquí. Aunque corramos el riesgo de que la academia cierre, tenemos que sobrevivir."
  SRT_event.1.a:0 "Entendido."

  SRT_event.2.t:0 "Decisión"
  SRT_event.2.d:0 "Descubrimos que, además del Consejo Estudiantil, existe aquí una organización extralegal llamada Club de Investigación Federal Schale. Debemos decidir si inclinamos la cabeza ante Schale o si nos negamos a someternos."
  SRT_event.2.a:0 "La SRT jamás inclinará la cabeza."
  SRT_event.2.b:0 "No hay más remedio..."

