l_spanish::

  CHI_hunjeong: "Continuar la tutela política"
  CHI_hunjeong_desc: "Antes de proclamar los Tres Principios del Pueblo, nuestro país no estaba preparado. No será tarde para defenderlos una vez hayamos rechazado las amenazas extranjeras."
  KMT_chogong_jakzun: "Campaña de cercos"  
  KMT_preparation: "Estrategia de comunicaciones"
  KMT_preparation_desc: "Tras la Larga Marcha los comunistas han reaparecido en Shaanxi. Quisiéramos aplastarlos ya, pero el acceso es difícil. Necesitamos rutas de suministro para abrirnos paso."  
  KMT_SHX_offer: "Propuesta a Shanxi"
  KMT_SHX_offer_desc: "Yan Xishan impide la entrada de nuestras tropas en su territorio. Si lo doblegamos podremos cercar a los comunistas y aniquilarlos." 
  KMT_prep_tt: "Añade 1 nivel de §Yinfraestructura§! en todos los estados adyacentes a [PRC.GetName]." 
  KMT_strike_PRC: "Aniquilar al PCCh"
  KMT_strike_PRC_desc: "El Partido Comunista aún no se recupera de la Larga Marcha. Ataquemos antes de que sane sus heridas y pongamos fin a su amenaza."
  KMT_national_def_propaganda: "Propaganda de defensa nacional"
  KMT_national_def_propaganda_desc: "Para protegernos de Japón debemos unificar al pueblo chino. Aunque detestemos a comunistas y caudillos, todos, jóvenes y viejos, deben estar dispuestos a morir por la patria."
  KMT_propaganda: "Propaganda de defensa nacional"
  KMT_propaganda_desc: "Con Japón amenazando nuestra existencia, toda la nación china debe unirse contra el invasor."
  KMT_fortify_land: "Levantar líneas defensivas"
  KMT_fortify_land_desc: "La ambición japonesa pone en duda la supervivencia de la república. Fortifiquemos el suelo patrio para que no se atrevan a hollarlo."
  KMT_lure_them_in_strategy: "Estrategia de atraer al enemigo"
  KMT_lure_them_in_strategy_desc: "Nuestra vasta geografía nos permite replegarnos y arrastrar al invasor al terreno que elijamos. ¡Que nos sigan si quieren! En cada esquina les aguardará una emboscada."
  KMT_cbis_idea: "Oficina Central de Estadística e Investigación"
  KMT_cbis: "Fundar la Oficina Central de Estadística e Investigación"
  KMT_cbis_desc: "La OCIE es el servicio de inteligencia del Kuomintang. Tras su reciente reforma debemos ampliarla para proteger al régimen de todo elemento subversivo."
  KMT_strengthen_the_kmt: "Integrar los órganos centrales del partido en la OCIE"
  KMT_strengthen_the_kmt_desc: ""
  KMT_cement_control_on_the_economy: "Economía dirigida"
  KMT_cement_control_on_the_economy_desc: "Nos oponemos a los comunistas, pero no nos arrodillaremos ante los capitalistas. La élite económica debe servir al gobierno y al KMT; impulsaremos las empresas estatales."
  KMT_cement_control_on_the_economy_idea: "Economía dirigida"
