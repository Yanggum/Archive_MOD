l_spanish:
 SLO_GATHERING_STORM_DESC: "Con la derrota del Imperio Austrohúngaro en la Primera Guerra Mundial, el dominio húngaro que se prolongó durante mil años llegó por fin a su fin.\n\nEn noviembre de 1935, con la Gran Transferencia, la República de Checoslovaquia colapsó y los eslovacos obtuvieron su primer Estado independiente. Sin embargo, una economía agraria atrasada y las voces democráticas que se rebelan contra la dictadura del Partido Popular Eslovaco están sacudiendo a este nuevo país.\n\nQué camino tomará el primer Estado independiente de Eslovensko… solo el cielo lo sabe."
 SLO_guide: "§YObjetivos§!\n\n£white_dot §0Bajo el liderazgo de Hlinka, estabiliza Eslovaquia y decide el futuro del Partido Popular.§!\n    £white_dot §4Convoca elecciones generales y devuelve la democracia a Eslovaquia.§!\n        £white_dot §YComo el Partido Nacional Eslovaco, expulsa a la dictadura mediante una coalición con los comunistas.§!\n            £white_dot §gLibera a los compatriotas de Bohemia y restaura Checoslovaquia.§!\n            £white_dot §gCelebra una conferencia en Visegrado con Polonia y Hungría para debatir la unificación.§!\n        o bien...\n        £white_dot §YComo el Partido Comunista de Eslovaquia, llega al poder mediante una coalición con el Partido Nacional y únete al Komintern.§!\n            £white_dot §gLibera a los compatriotas de Bohemia y establece la República Socialista de Checoslovaquia.§!\n            £white_dot §gLibera la región del Danubio junto a la Unión Soviética y establece la Federación del Danubio.§!\n    o bien...\n    £white_dot §4Refuerza la dictadura del Partido Popular Eslovaco y avanza hacia la gloria de Eslovaquia bajo el liderazgo de Hlinka.§!\n        £white_dot §YApooya a los conservadores de Jozef Tiso y trabaja por la estabilidad de Eslovaquia.§!\n            £white_dot §gAprovecha la oportunidad para liberar Bohemia y reconstruir la federación bajo el liderazgo eslovaco.§!\n            £white_dot §gCoopera con Polonia para unificar a los eslavos occidentales y formar Zapadslovania.§!\n        o bien...\n        £white_dot §YApooya a los radicales de Vojtech Tuka y fortalece el nacionalismo eslovaco.§!\n            £white_dot §gOcupa Bohemia y asimila a los checos.§!\n            £white_dot §gLevanta la espada contra los países vecinos rumbo al resurgimiento de la antigua Gran Moravia.§!\n\n\n§CDesarrollo- Jindoi, 민트쿤mintcoon§!"
 SLO_country_intro_header: "Luz del alba, ecos de la Gran Moravia"
 SLO_country_intro_header_1: "Mil años de yugo, bajo la sombra de Hungría"
 SLO_country_intro_header_2: "Nueva esperanza, el nacimiento de Checoslovaquia"
 SLO_country_intro_content: "El asentamiento de los pueblos eslavos en la región de Eslovaquia se remonta a los siglos V y VI. \nEstos desempeñaron un papel central, hacia el siglo VII, en la formación del primer Estado eslavo: el Imperio de Samo, liderado por el mercader franco Samo. \nMás tarde, a comienzos del siglo IX, se estableció el Principado de Nitra, centrado en Nitra, en el oeste de la actual Eslovaquia, el cual pronto se unificó con el Principado de Moravia y evolucionó hacia el Reino de la Gran Moravia, el primer Estado centralizado de los eslavos.\nEl Reino de la Gran Moravia gobernó un vasto territorio que abarcaba la actual Chequia y Eslovaquia, así como partes de Hungría. \nEn particular, durante el gobierno del príncipe Rastislav, la actividad de los misioneros hermanos Cirilo y Metodio, llegados del Imperio Bizantino, influyó profundamente en la historia eslovaca. \nEstos celebraron la liturgia en lengua eslava y crearon el alfabeto glagolítico, la primera escritura de los eslavos, sentando las bases de una cultura eslava propia y de la fe cristiana. \nEllo se convirtió más tarde en una raíz importante de la identidad nacional eslovaca. Sin embargo, a comienzos del siglo X, el Reino de la Gran Moravia fue destruido por los magiares que invadieron desde el este, y Eslovaquia entró en un nuevo capítulo histórico largo y áspero."
 SLO_country_intro_content_1: "Tras el colapso del Reino de la Gran Moravia, desde el siglo XI el territorio eslovaco fue incorporado como parte del Reino de Hungría durante cerca de mil años. \nDurante este extenso periodo, Eslovaquia fue conocida como la 'Alta Hungría' y atravesó altibajos dentro del curso de la historia húngara. \nEn el siglo XIII sufrió la tragedia de la devastación por la invasión mongola, pero más tarde fue reconstruida gradualmente gracias a los alemanes que emigraron para desarrollar la minería y el comercio. \nEn 1526, cuando Hungría fue derrotada de forma aplastante por el Imperio Otomano en la batalla de Mohács, el rumbo de la historia volvió a cambiar. \nCon la mayor parte del territorio húngaro bajo dominio otomano, el centro del Reino de Hungría gobernado por la Casa de Habsburgo se trasladó a la región eslovaca. \nComo resultado, la actual capital Bratislava (entonces Pozsony) desempeñó durante unos 300 años el papel de capital del Reino de Hungría, actuando como centro político y cultural. \nEn 1867, con el establecimiento del Imperio Austrohúngaro, Hungría obtuvo una considerable autonomía interna, y para los eslovacos esto marcó el inicio de otra prueba. \nEl gobierno húngaro impulsó una fuerte política de magiarización: prohibió la educación en eslovaco y reprimió la cultura nacional. \nSin embargo, esta opresión, paradójicamente, terminó por fortalecer y cohesionar aún más la conciencia nacional eslovaca."
 SLO_country_intro_content_2: "Con la derrota del Imperio Austrohúngaro en la Primera Guerra Mundial, el dominio húngaro que se prolongó durante mil años llegó por fin a su fin. \nEl 28 de octubre de 1918, Eslovaquia, siguiendo el principio de autodeterminación nacional, se unió al pueblo checo —con el que mantenía estrechos lazos lingüísticos y culturales— y fundó la República de Checoslovaquia, abriendo un nuevo capítulo histórico. \nSin embargo, el nuevo Estado independiente arrastraba desafíos por resolver. \nMientras que las tierras checas, bajo dominio austríaco, habían alcanzado un desarrollo industrial considerable, Eslovaquia permanecía atrasada y centrada en la agricultura bajo el dominio húngaro, lo que generó un grave desequilibrio económico entre ambas regiones. \nAdemás, debido a las prolongadas políticas de magiarización, había muy pocos intelectuales eslovacos con educación superior, por lo que la mayoría de los principales cargos administrativos y educativos quedaron en manos de checos, convirtiéndose también en un factor potencial de fricción entre ambos pueblos. \nAun así, Checoslovaquia fue considerada un Estado estable que logró asentar con éxito la democracia en Europa Central, y Eslovaquia pudo, en ese periodo, sentar una valiosa base para crecer política, económica y culturalmente. \nEn noviembre de 1935, con la Gran Transferencia, la República de Checoslovaquia colapsó y los eslovacos obtuvieron su primer Estado independiente. Sin embargo, una economía agraria atrasada y las voces democráticas que se rebelan contra la dictadura del Partido Popular Eslovaco están sacudiendo a este nuevo país.\nQué camino tomará el primer Estado independiente de Eslovensko… solo el cielo lo sabe."
