 SLO_vote_tt:0 "En §YEslovaquia§! se celebrarán §Yelecciones generales§!. El resultado variará según la §Ypopularidad de los partidos§!.\n- Si la popularidad de §RComunismo§! o §CDemocracia§! está entre §Y25% ~ 49%§!, y la de §LFascismo§! es §Ymenor a 50%§!:\nSe formará un §Ygobierno de coalición§! para enfrentar al §LFascismo§!.\n- Si la popularidad de §RComunismo§! o §CDemocracia§! o §LFascismo§! es §Y50% ~§!:\nEl §Ypartido acorde a su popularidad§! formará el gabinete.\n- Si el §RPartido Comunista§! entra en el §Gabinete§!, el §LPartido Popular§! podría §Ydesconocer§! el §Yresultado electoral§!."
