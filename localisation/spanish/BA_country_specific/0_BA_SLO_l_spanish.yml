 SLO_develop_the_agrarian_economy:0 "Desarrollar la economía agraria"
 SLO_develop_the_agrarian_economy_desc:0 "Al planificar el futuro de nuestra economía, siempre debemos mantener una perspectiva realista. La realidad es que la economía eslovaca es, en esencia, una economía agraria y no una economía industrial. Pero no debemos considerar esto una desventaja; al contrario, debemos hacer todo lo posible por convertir este hecho en nuestra ventaja."
 SLO_pursue_industrialization:0 "Impulsar la industrialización"
 SLO_pursue_industrialization_desc:0 "Durante siglos, nuestra economía fue abandonada, lo que nos llevó a la lamentable situación de no haber alcanzado siquiera la industrialización y de quedarnos rezagados bajo la opresión de la antigua Chequia y Hungría. Ahora que somos un Estado independiente, debemos corregir esta injusticia y volcar todos nuestros recursos en llevar, por fin, la industrialización a Eslovaquia."
 SLO_finish_the_dubnica_nad_vahom_factory:0 "Completar la fábrica de Dubnica nad Váhom"
 SLO_finish_the_dubnica_nad_vahom_factory_desc:0 "La fábrica de armamento de Dubnica nad Váhom estaba siendo construida por Škoda Works (Škoda Works Pilsen), pero las obras se detuvieron a raíz de nuestra independencia. Debemos finalizar su construcción y convertirla en una fuente principal de armas para nuestro ejército."
 SLO_establish_the_state_geological_institute:0 "Fundar el Instituto Geológico Nacional"
 SLO_establish_the_state_geological_institute_desc:0 "La minería en nuestras tierras prosperó históricamente gracias a los Tatras y a sus recursos naturales, pero ha decaído desde la Gran Guerra. Como parte del esfuerzo por revivirla, fundaremos el Instituto Geológico Nacional bajo el patrocinio de Dmitri Andrusov."
 SLO_expand_the_apollo_refinery:0 "Ampliar la refinería Apollo"
 SLO_expand_the_apollo_refinery_desc:0 "La refinería propiedad de la compañía Apollo, ubicada en Bratislava, fue un elemento clave de la industria urbana, y su importancia crece aún más con el aumento de la demanda de petróleo en la guerra moderna. Debemos emplear nuestros recursos para ampliarla y reforzar la independencia económica y la autosuficiencia."
 SLO_slovak_academy_of_sciences_and_arts:0 "Academia Eslovaca de Ciencias y Artes"
 SLO_slovak_academy_of_sciences_and_arts_desc:0 "La educación eslovaca fue descuidada por el gobierno checoslovaco y, aún hoy, nos faltan personal e instituciones necesarias para investigar tecnología moderna, quedándonos atrás frente a otros países. Para responder a esta situación, fundaremos la Academia Eslovaca de Ciencias y Artes."
 SLO_electrification:0 "Ampliar la red de suministro eléctrico"
 SLO_electrification_desc:0 "Nuestro país sigue teniendo un suministro eléctrico deficiente, y no todos los hogares cuentan con electricidad. Debemos mejorar esta situación y, al mismo tiempo, centrarnos en desarrollar nuevas tecnologías en el campo de los dispositivos electrónicos. Con ello, todos los procesos serán mucho más sencillos."
 SLO_expansion_of_the_slovak_university:0 "Ampliación de la Universidad Eslovaca"
 SLO_expansion_of_the_slovak_university_desc:0 "La Universidad Eslovaca (antigua Universidad Comenius) sigue siendo la mayor institución de educación superior del país, y debemos seguir ampliándola para elevar la calidad general de la enseñanza. Crearemos nuevas facultades, como la Facultad de Ciencias."
 SLO_connect_the_villages:0 "Conectar las aldeas"
 SLO_connect_the_villages_desc:0 "Para aumentar aún más la eficiencia de nuestra economía agraria, debemos centrarnos en mejorar las carreteras y los ferrocarriles que conectan las aldeas. Con mejores vías, a la gente le será más fácil transportar y vender productos agrícolas por todo el país, dinamizando la economía en el proceso."
 SLO_modernization_of_agriculture:0 "Mecanización agrícola"
 SLO_modernization_of_agriculture_desc:0 "Al igual que la tecnología industrial, la tecnología y los métodos agrícolas también evolucionan constantemente, y en los últimos años se han logrado grandes avances en este campo. Debemos introducir tecnología moderna y llevar a cabo un proceso de mecanización masiva para mantener nuestra agricultura al día."
 SLO_expand_agricultural_exports:0 "Ampliar las exportaciones agrícolas"
 SLO_expand_agricultural_exports_desc:0 "Dado que somos capaces de garantizar alimentos suficientes por nosotros mismos, es imprescindible exportar productos agrícolas a los países vecinos para impulsar el desarrollo económico y mejorar nuestras relaciones con otros Estados de la región."
 SLO_utilize_southern_farmlands:0 "Aprovechar las tierras agrícolas del sur"
 SLO_utilize_southern_farmlands_desc:0 "Puede parecer que la agricultura es casi imposible en la mayor parte de nuestro país debido a los montes Tatras, pero no es así. En particular, las regiones del sur, cerca de la frontera con Hungría, cuentan con abundantes tierras fértiles que pueden convertirse en una fuente rica y productiva de suministros agrícolas."
 SLO_new_steel_plants:0 "Construir nuevas acerías"
 SLO_new_steel_plants_desc:0 "Al reorganizar nuestra red de acerías y pasar a instalaciones nuevas y modernas, podremos acelerar aún más la expansión de la industria pesada. Esto nos permitirá producir recursos esenciales para nuestra naciente economía industrial."
 SLO_promote_urbanization:0 "Fomentar la urbanización"
 SLO_promote_urbanization_desc:0 "Bratislava ya ha atraído gran atención desde que se convirtió en la capital tras la independencia, pero una gran parte de nuestra población sigue viviendo en ciudades pequeñas. Debemos cambiar nuestras políticas para impulsar el crecimiento de las grandes ciudades —especialmente Bratislava— como centros industriales densamente poblados."
 SLO_grand_projects:0 "Grandes proyectos"
 SLO_grand_projects_desc:0 "Alcanzar la industrialización significa mucho más que construir unas cuantas fábricas. Significa levantar grandes acerías, modernizar la red ferroviaria y crear una amplia red de plantas capaces de producirlo todo, desde bienes militares hasta bienes civiles. Debemos preparar a nuestra industria, aún en una etapa temprana, para estar a la altura de estas empresas."
 SLO_development_in_the_vah_valley:0 "Desarrollo del valle del Váh"
 SLO_development_in_the_vah_valley_desc:0 "En la cuenca del río Váh se asientan muchas ciudades, y allí se concentra la industria, incluidas fábricas clave como las de Považská Bystrica y Dubnica nad Váhom. El desarrollo continuo de esta región es esencial para nuestro programa de industrialización."
 SLO_defense_law:0 "Ley de Defensa Nacional"
 SLO_defense_law_desc:0 "Eslovaquia afronta tiempos peligrosos, lo que significa que debemos preparar tanto al ejército como a la población. Promulgaremos una nueva Ley de Defensa Nacional que defina la edad de reclutamiento y el estatus general del ejército."
 SLO_military_high_school:0 "Academia Militar"
 SLO_military_high_school_desc:0 "Con la fundación del ejército eslovaco, también se estableció una academia militar para formar un nuevo cuerpo de Estado Mayor al servicio de la nación, y muchos antiguos mandos militares eslovacos de Checoslovaquia se han unido a nosotros. Debemos apoyar esta academia para elevar la profesionalización del Estado Mayor y formar a una nueva generación de mandos subalternos."
 SLO_lessons_of_war:0 "Lecciones de la guerra"
 SLO_lessons_of_war_desc:0 "Hemos vivido de primera mano lo que es la guerra y hemos obtenido de ella lecciones importantes. Toda esa experiencia puede utilizarse ahora para perfeccionar y desarrollar nuestra estrategia, así como para mejorar la formación militar."
 SLO_expand_the_military_industrial_complex:0 "Ampliar el complejo militar-industrial"
 SLO_expand_the_military_industrial_complex_desc:0 "Las fábricas de Považská Bystrica y Dubnica nad Váhom no están lejos entre sí y forman, a lo largo del río Váh, un complejo militar-industrial. Su cercanía facilita mejorar la coordinación entre ambas y expandirlas de manera conjunta. Eso es exactamente lo que haremos."
 SLO_study_foreign_weapons:0 "Estudiar armamento extranjero"
 SLO_study_foreign_weapons_desc:0 "Nuestra industria armamentística nacional es pequeña, pero nuestra capacidad para desarrollar armas propias es aún más limitada, y buena parte de nuestro ejército sigue equipado con armamento checoslovaco anticuado. La mejor forma de mejorar la situación es aprender de países más exitosos en este ámbito. Podemos comprar o solicitar armas producidas por grandes potencias para evaluarlas."
 SLO_tatra_warriors:0 "Guerreros de los Tatras"
 SLO_tatra_warriors_desc:0 "Eslovaquia es un país montañoso, por lo que el combate en montaña no nos es ajeno. Debemos crear unidades especiales dentro del ejército capaces de luchar eficazmente en terreno montañoso y defender la patria de una invasión extranjera."
 SLO_learn_from_czechoslovak_tanks:0 "Aprender de los tanques checoslovacos"
 SLO_learn_from_czechoslovak_tanks_desc:0 "Si queremos desarrollar fuerzas móviles para nuestro ejército, debemos encontrar la manera de superar a nuestro predecesor, Checoslovaquia, que sí contaba con capacidad propia de desarrollo de tanques. Todavía disponemos de una gran cantidad de tanques checoslovacos, y los recursos necesarios para operarlos y estudiarlos de cara a futuros desarrollos blindados son mínimos."
 SLO_the_fast_division:0 "La división rápida"
 SLO_the_fast_division_desc:0 "Desplegar un ejército numeroso es casi imposible, así que debemos concentrar recursos en crear, aunque sea una sola, una división capaz de abrir una brecha y explotarla: una división compuesta en su mayor parte por vehículos blindados. Esa será la División Rápida."
 SLO_labor_corps:0 "Batallón penal"
 SLO_labor_corps_desc:0 "El batallón penal será una parte de nuestro ejército compuesta por los miembros 'indeseables' de nuestra sociedad, y se utilizará junto al ejército en el frente para construir trincheras y otras instalaciones militares."
 SLO_technical_divisions:0 "Divisiones técnicas"
 SLO_technical_divisions_desc:0 "Debemos reorganizar varias unidades militares en las llamadas 'divisiones técnicas'. Estas divisiones se emplearán en múltiples tareas, desde el mantenimiento y reparación de vehículos de combate hasta la excavación de trincheras. Serán el núcleo de la defensa eslovaca."
 SLO_establish_the_air_force:0 "Fundar la Fuerza Aérea"
 SLO_establish_the_air_force_desc:0 "Debemos integrar los pequeños aviones heredados de Checoslovaquia para defender el cielo eslovaco y crear una fuerza aérea independiente capaz de operar incluso lejos de la patria."
 SLO_aviation_school:0 "Escuela de Aviación"
 SLO_aviation_school_desc:0 "Con el nacimiento de nuestra fuerza aérea, también debe fundarse una institución para formar nuevos pilotos: la Escuela de Aviación. Aprovecharemos la experiencia de los pilotos existentes (en su mayoría del programa checoslovaco de 'Mil pilotos para la República') para educar a la próxima generación."
 SLO_anti_air_defenses:0 "Defensas antiaéreas"
 SLO_anti_air_defenses_desc:0 "Si nuestra fuerza aérea no basta para derrotar a la aviación del invasor, debemos preparar un plan de contingencia para defender nuestro espacio aéreo. Ese plan consistirá en cañones antiaéreos fijos, desplegados estratégicamente por todo el país, capaces de derribar aeronaves enemigas con eficacia."
 SLO_aircraft_production_at_dubnica_nad_vahom:0 "Producción de aviones en Dubnica nad Váhom"
 SLO_aircraft_production_at_dubnica_nad_vahom_desc:0 "La moderna fábrica de Dubnica nad Váhom ya ha demostrado capacidad para producir motores de avión, pero nuestra fuerza aérea exige más. Debemos reconstruir parte de la planta para la producción de aeronaves. Será costoso, pero a largo plazo valdrá la pena, pues ya no dependeremos del extranjero para el material aéreo."
 SLO_emergency_squadron:0 "Escuadrón de emergencia"
 SLO_emergency_squadron_desc:0 "Puede que surjan oportunidades para emplear nuestra fuerza aérea en el extranjero, pero debemos cuidarnos de no olvidar la defensa del propio espacio aéreo. Para ello, formaremos un escuadrón de cazas de emergencia que patrullará los cielos de Eslovaquia."
 SLO_close_air_support:0 "Apoyo aéreo cercano"
 SLO_close_air_support_desc:0 "Debemos desarrollar y producir nuestros propios bombarderos en picado para apoyar al ejército en el campo de batalla junto a nuestros cazas. Con ello, la fuerza aérea se convertirá en un elemento indispensable del combate."
 SLO_heavy_aircraft_development:0 "Desarrollo de aeronaves pesadas"
 SLO_heavy_aircraft_development_desc:0 "A medida que crezca nuestra industria, no se puede descartar la posibilidad de fabricar aeronaves más grandes, como cazas pesados o bombarderos estratégicos. Exploraremos estas ideas a fondo y desarrollaremos, por cuenta propia y dentro del país, modelos de este tipo."
