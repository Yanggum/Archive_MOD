# Introducción de Camboya
CAM_country_intro_header: "Bajo el dominio de Francia"
CAM_country_intro_content: "\nEl sol jemer ya no brilla con su antiguo esplendor. En el corazón de la Indochina francesa, nuestro Reino de Camboya respira como un protectorado bajo una monarquía meramente formal.\n\nAunque los tejados dorados del palacio real aún resplandecen, bajo ellos la realeza y la administración permanecen a la sombra del gobierno colonial en Saigón. La patria ha caído a la condición de vastas plantaciones que entregan arroz y caucho, y nuestros recursos se utilizan para fortalecer la hegemonía francesa en tierras lejanas. Tras la repentina Gran Transición ocurrida en Europa en 1935, el mundo se ha llenado de incertidumbre. Las naciones afectadas vuelven a verse envueltas en los presagios de la guerra y, en Asia, el Imperio Japonés emerge como una nueva potencia, revelando sus ambiciones coloniales. En esta era de convulsión, nos encontramos ante una encrucijada decisiva.\n\n¿Debemos seguir siendo un fiel protectorado de Francia y garantizar la paz bajo el paraguas de un gigante frente a amenazas potenciales? ¿O, como otras naciones asiáticas, debemos avivar la llama del nacionalismo, romper las cadenas de Francia y reconstruir la gloria del gran Imperio Jemer? Las ruinas de Angkor susurran la grandeza del pasado, y en el silencioso pecho del pueblo arde el anhelo de independencia. Nuestro futuro: ¿lealtad o liberación? El momento de elegir se acerca.\n\n§YDesarrollo - UnineVesiKass, SKSKIe§!"

