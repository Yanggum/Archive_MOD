l_spanish:
 COU_question_about_acting_authority:0 "Vigilancia ante la deriva izquierdista"
 COU_question_about_acting_authority_desc:0 "Algunos miembros del Comité Administrativo mantienen una visión negativa sobre la inclinación política de la actual Directora de Transporte, Yuragi Momoka. En concreto, existe la sospecha de que, en medio de la crisis causada por la desaparición de la Presidenta del Consejo Estudiantil General, la directora estaría confabulándose con los locales para urdir una gran conspiración cuyo fin sería desmantelar por completo al propio Consejo Estudiantil de Kivotos."
 COU_crackdown_on_anti_kivotos_activities:0 "Represión de actividades anti-Kivotos"
 COU_crackdown_on_anti_kivotos_activities_desc:0 "Entre las facciones locales todavía abundan quienes nos guardan hostilidad por nuestra transferencia y por el colapso que ello provocó en los gobiernos de la región, y que por ello se resisten a nosotros. Debemos reprimir a esas fuerzas y contribuir a aumentar la estabilización de la zona."
 COU_political_intervention_of_SRT:0 "Contactar a SRT"
 COU_political_intervention_of_SRT_desc:0 "Al mismo tiempo que se impone la ley marcial, se ha propuesto contactar a la Academia Especial SRT —la unidad de fuerzas especiales bajo el Consejo— para que, en lugar de la Academia de Policía Valkyrie, actualmente escasa de personal por el Gran Cataclismo, pueda encargarse de la seguridad pública en la región."
 COU_expedited_administrative_processing:0 "Tramitación administrativa acelerada"
 COU_expedited_administrative_processing_desc:0 "Ahora mismo, nuestra parálisis administrativa está causando múltiples caos. Para resolverlo con rapidez, hemos decidido priorizar la restauración del aparato administrativo."
 COU_opening_of_local_culture:0 "Apertura a la cultura local"
 COU_opening_of_local_culture_desc:0 "Aunque algunos estudiantes podrían alterarse, se ha planteado que, para obtener la cooperación de las facciones locales, primero debemos conocer su cultura. Puede que eso nos resulte de suficiente ayuda."
 COU_expansion_of_autonomy:0 "Garantizar la autonomía"
 COU_expansion_of_autonomy_desc:0 "Somos forasteros no bienvenidos y, ante los locales, no somos más que invasores. Primero debemos garantizarles autonomía para reducir su descontento."
 COU_establishment_of_human_rights_committee:0 "Fundar la Oficina de Garantía de Derechos Humanos"
 COU_establishment_of_human_rights_committee_desc:0 "Se dice que el país llamado “Alemania”, donde estaban Gehenna y Trinity, en el pasado estableció los derechos individuales mediante una ley conocida como la Constitución de Weimar. Aprovechando eso, fundemos también una Oficina de Garantía de Derechos Humanos para que, sean estudiantes o locales, cada persona pueda gozar de los derechos básicos que merece. ¡Y el director de esta oficina será el único director ‘local’ dentro del Consejo Estudiantil General!"
 COU_focus_add_state_core_nord_fadcale:0 "Garantizar la autonomía francesa"
 COU_focus_add_state_core_nord_fadcale_desc:0 "Tras la intervención unilateral de la guarnición francesa en Nord-Pas-de-Calais, la región pasó a ser nuestro territorio, y los franceses dentro de Nord-Pas-de-Calais no habían recibido una autonomía adecuada. Si ya estamos aceptando incluso a neerlandeses y belgas, que se sumen unos franceses más no cambiará nada."
 COU_focus_reestablish_srt:0 "Reevaluar el trato a SRT"
 COU_focus_reestablish_srt_desc:0 "Actualmente SRT está detenida en el Reformatorio de Valkyrie, pero son talentos muy útiles y, sin falta, deben volver a encontrar un lugar donde puedan servir."
 COU_flag_fucking_srt:0 "§RSe produce un disturbio por culpa de SRT§!"
 COU_union_negotiation:0 "Fundar el Comité Laboral"
 COU_union_negotiation_desc:0 "Para los locales que nos ayudan, debemos establecer un Comité Laboral y escuchar sus voces."
 COU_infrastructure_restoration:0 "Restaurar infraestructura"
 COU_infrastructure_restoration_desc:0 "La red ferroviaria de este otro mundo al que fuimos transferidos presenta problemas bastante distintos a los de la red ferroviaria de Kivotos. Debemos mejorarla, aunque sea en parte."
 COU_strengthening_of_valkyrie_authority:0 "Reforzar la autoridad de la Academia de Policía"
 COU_strengthening_of_valkyrie_authority_desc:0 "Dada la situación actual, debemos reforzar la autoridad de la Academia de Policía Valkyrie y levantar diversas restricciones, como las referentes al uso de armas."
 COU_vertical_integration:0 "Integración vertical"
 COU_vertical_integration_desc:0 "Aunque podría haber cierto descontento, por eficiencia podremos integrar varias empresas de la cadena vertical de producción, reducir costos y reutilizar fábricas excedentes."
 COU_reorganization_of_administrative_committee:0 "Fusión de departamentos"
 COU_reorganization_of_administrative_committee_desc:0 "Al fusionar departamentos con funciones similares, podremos tramitar la administración con mayor fluidez."
 COU_restructuring_of_defense_office:0 "Reorganizar la Oficina de Defensa"
 COU_restructuring_of_defense_office_desc:0 "Reorganizaremos la Oficina de Defensa para desplegar a los estudiantes en los puestos que necesitemos, en el lugar correcto y en el momento oportuno."
 COU_normalization_of_administration:0 "Normalización administrativa"
 COU_normalization_of_administration_desc:0 "Gracias a múltiples esfuerzos, el sistema administrativo se ha normalizado y solo queda el último trabajo. Hemos tomado la iniciativa en la lucha por el poder, y el Consejo Estudiantil General por fin está listo para avanzar.\n\n§gSi jamás podremos comprendernos entre nosotros, ¿podremos comprendernos a nosotros mismos a través de aquello que no comprendemos?§!"
 COU_normalization_of_administration_tt:0 "Aunque §YShiranui Kaya§!, eje actual de la §Ylucha por el poder§!, no ha logrado cerrar del todo la pugna con la oposición, sí consiguió llegar a un acuerdo para oponerse a §YSCHALE§!."

 #린
 COU_stabilization_of_the_student_council:0 "Estabilización del Consejo Estudiantil"
 COU_stabilization_of_the_student_council_desc:0 "Por fortuna, pese a ciertos roces, el Consejo Estudiantil recuperó la estabilidad. Sin embargo, la Directora de Finanzas, Oki Aoi, solicitó convocar una reunión por un asunto relacionado con el conflicto previo contra SCHALE."
 COU_student_council_amendment:0 "Enmienda del Consejo"
 COU_student_council_amendment_desc:0 "§2\"Que no compartan mi opinión no me da derecho a oprimir a otros amparándome en la autoridad.\"§!\n\nEn esta reunión, Nanagami Rin, Presidenta interina del Consejo Estudiantil General, anunció una enmienda del Consejo con la que apaciguó el descontento de la facción opositora y proclamó que hará todo lo posible como autoridad interina de la presidencia del Consejo Estudiantil de Kivotos."
