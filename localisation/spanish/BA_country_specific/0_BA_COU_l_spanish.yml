  COU_start_event.1.t:0 "Creación de la Milicia Estudiantil de Defensa"
 COU_start_event.1.desc:0 "Rin permanecía absorta, con una mirada inquieta. En condiciones normales, seguramente estaría tomando café y concentrada en el trabajo, pero ya no podía más.\n\nEl puesto de Rin estaba amenazado por manos codiciosas que solo buscaban satisfacer sus propios intereses y, al mismo tiempo, los asesinatos y crímenes violentos contra los estudiantes de Kivotos estaban aumentando de forma alarmante. Como representante del Consejo Estudiantil General, Rin tenía que hacer algo.\n\nEntonces, en la mente de la administradora Rin brilló una de las reglas principales del Consejo: “El Consejo Estudiantil no puede poseer una organización militar”. Pero… ¿y si la rompía? ¿Y si esa era la única vía correcta? ¿No sería aceptable ignorar una sola regla?\n\nAsí, unos días después, la administradora Rin se detuvo frente a los reporteros sosteniendo un contenedor cilíndrico. Luego, sacó una bandera.\n\n“Desde este momento, nuestro Consejo Estudiantil General levanta oficialmente la restricción de posesión militar establecida en el Artículo 2 de la Ley de Garantía de Autonomía de las Academias, y declara la creación de la Milicia Estudiantil de Defensa, una organización paramilitar. Su alto mando estará conformado por exmiembros de la Academia Especial SRT o por especialistas del ámbito militar.”\n\nEn un instante, los periodistas empezaron a lanzar preguntas de todo tipo, y algunos incluso comenzaron a insultarla.\n\nPero los ojos de la administradora Rin… no. Los ojos de la Presidenta del Consejo Estudiantil, Rin, ya estaban decididos, fijos en la bandera oficial de la Milicia Estudiantil de Defensa que sostenía en sus manos."
 COU_start_event.1.a:0 "\"Por el bien de todos… no hay otra forma.\""
 COU_start_event.1.b:0 "\"¿Olvidaste que un ejército privado es una usurpación de autoridad?\""

 COU_start_event.2.t:0 "Momoka expulsada de la reunión"
 COU_start_event.2.desc:0 "Desde muy temprano, Momoka fue llamada a la sala de reuniones de la Secretaría del Consejo Estudiantil General. Afuera, el edificio estaba abarrotado de manifestantes belgas, y a través de los ventanales se veía cómo las estudiantes de la Academia de Policía Valkyrie mantenían la entrada completamente sellada con sus escudos.\n\nCon una mirada de fastidio, Momoka entró en la sala y, como siempre, abrió una bolsa de galletas sabor mentaiko mientras escuchaba las exigencias de los manifestantes. Pero no había ningún punto de acuerdo. Algunos pedían la independencia de Bélgica, otros exigían autonomía. Al final, ante tantas demandas enredadas, Momoka, sin pensarlo, dejó salir en voz alta lo que se le cruzó por la cabeza.\n\n“¿Y si simplemente… les damos lo que piden?”\n\nPoco después, Momoka salió del edificio casi como si la hubieran echado, con cara de estar harta. Y mientras atravesaba el centro repleto de manifestantes rumbo a comprar más galletas (ya se le habían acabado), por pura flojera había venido con el uniforme del Consejo… y así los manifestantes descubrieron quién era.\n\nContrario a lo que ella temía —que se volviera una molestia—, los manifestantes le dijeron que le comprarían lo que quisiera a cambio de que filtrara qué se estaba hablando dentro del Consejo. Y así, tras conseguir un montón de bolsas de galletas, Momoka empezó a hablar ahí mismo, masticando.\n\n“…La verdad es que no es que los vean con buenos ojos. Que si hay que mantener la neutralidad política y no sé qué… ya saben que la administradora Rin siempre ha sido bien estricta~. Eh… pero si soy honesta, mi idea era aceptar sus opiniones tal cual, y ¿qué creen? ¡Me sacaron de la reunión!”"
 COU_start_event.2.a:0 "\"Oye… ¿qué estás anotando con tantas ganas?\""
 COU_start_event.2.b:0 "\"¿Que aceptemos lo que diga la turba? Qué chiste.\""

