 COU_nation_moving_forward:0 "Una nación que avanza"
 COU_nation_moving_forward_desc:0 "En su sentido original, el comunismo es un término que engloba un movimiento que niega todos los aspectos del sistema vigente y empuja a la sociedad hacia adelante. Debemos acelerar el desarrollo social y conducir reformas revolucionarias permanentes, no el comunismo distorsionado por los autoritarios del Oriente, sino el comunismo en su significado auténtico."

