 COU_autonomous_legislation:0 "Ley de Soberanía"
 COU_autonomous_legislation_desc:0 "Al tomar la delantera en la lucha por el poder, hemos logrado sentar a Yuragi Momoka en el puesto de presidenta del Comité de Emergencia, y hemos obtenido la oportunidad de establecer una base institucional para la autonomía que antes prometimos a los locales. Con ello, podremos consolidar aún más nuestra base de apoyo."
 COU_neutralize_kaya_clique:0 "Neutralizar la Oficina de Defensa"
 COU_neutralize_kaya_clique_desc:0 "La Oficina de Defensa, una reunión de taimados fascistas imperialistas, se alzó en resistencia inmediata en cuanto los efectos de la Ley de Soberanía entraron en vigor. Para llevar a cabo la reforma, debemos neutralizar a la Oficina de Defensa."

 COU_inclusion_of_union_in_administrative_committee:0 "Incorporar el comité obrero"
 COU_inclusion_of_union_in_administrative_committee_desc:0 "Según el consejo de algunos asesores humanos, la reforma jamás puede lograrse por obra de un solo individuo. Para culminar la reforma cumpliendo nuestra promesa de armonía con los locales y de autonomía para ellos, incorporaremos al Comité Administrativo un comité obrero compuesto por locales."
 COU_logistics_control_of_student_council:0 "Reconocer la autoridad del Comité Administrativo"
 COU_logistics_control_of_student_council_desc:0 "Desde los puestos de presidenta de la Comisión de Reforma y del Comité de Emergencia, Momoka ha demostrado su utilidad. Ya no debe ser una Cenicienta en riesgo de ser expulsada sin la protección de Rin: debemos reconocerla como un miembro orgulloso del Comité Administrativo, con la autoridad que ello conlleva."
 COU_resignation_of_acting_authority:0 "Dimisión de la presidenta del Comité de Emergencia"
 COU_resignation_of_acting_authority_desc:0 "Yuragi Momoka no piensa conservar este cargo por mucho tiempo. Una vez resuelta la seguridad de la Oficina de Transporte y aplacado el riesgo de expulsión que recaía sobre ella, dimitirá de su puesto."

