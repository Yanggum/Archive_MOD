 COU_honorary_student_council_president:0 "Presidenta honoraria del Consejo Estudiantil"
 COU_honorary_student_council_president_desc:0 "§p\"¿Eh? ¿Y ahora qué pasa?\"§!\n\nAunque hemos hecho que Yuragi Momoka deje por voluntad propia el puesto de presidenta del Comité de Emergencia, la Comisión de Reforma considera que nombrarla Presidenta honoraria, aunque sea en un cargo ceremonial, ayudará a estabilizar al Consejo Estudiantil General."

