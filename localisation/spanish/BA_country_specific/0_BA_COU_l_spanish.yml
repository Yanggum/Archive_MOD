 COU_start_event.4.t:0 "Juego de tronos"
 COU_start_event.4.desc:0 "\"…Así que la administradora principal lo hizo al final.\" Shiranui Kaya, sentada de lado en la silla, habló. Bebió el café con el rostro cargado de preocupación… pero tenía una sonrisa en los labios.\n\n¿Dejar a un SRT perfectamente funcional y crear una nueva organización paramilitar? Rin era como una ventana de vidrio: sus intenciones se veían a través de cada gesto. Diera la excusa que diera con esa boca aduladora, al final solo estaba pataleando para que no le arrebataran su plato.\n\nKaya dejó la taza y encendió la televisión. Tal como esperaba, los idiotas en pantalla fingían ser eruditos, diciendo que Rin deseaba una dictadura de hierro, que ambicionaba el puesto de Presidenta del Consejo, y bla, bla, bla.\n\nJa. Ni de broma. Esa administradora principal descerebrada no tiene esas intenciones. Solo tiene miedo de perder su plato.\n\nKaya apartó el café y sacó del cajón del escritorio un pequeño tablero de ajedrez. Pensó que pronto los chicos de SRT vendrían, aterrados, a suplicarle ayuda… aunque era más probable que no ocurriera, así que soltó un suspiro corto. No debía volverse débil.\n\nEn el tablero solo había una reina y dos caballos. Rin era la reina, y ella era el caballo. Luego sacó ocho peones y los colocó delante.\n\nEl juego de ajedrez por el trono había comenzado.\n\nKaya tomó un peón y lo golpeó suavemente contra el escritorio. En un juego por el trono, inevitablemente se necesitan peones. Solo así se atrapa a la reina y se termina la partida. Eso pensó."
 COU_start_event.4.a:0 "\"Tomémonos nuestro tiempo… y esperemos.\""

 COU_start_event.5.t:0 "Cruce"
 COU_start_event.5.desc:0 "La directora de Defensa, Shiranui Kaya, golpeó el tablero de ajedrez. Las jugadas eran pocas, y la posibilidad, baja. Para romper el bloqueo… necesitaba a SRT.\n\nPero entonces, del otro lado de la puerta cerrada, se oyeron pasos apresurados.\n\nEureka. Tal como su predicción de baja probabilidad, había acertado. Por el sonido, era una sola persona.\n\n“¡Directora de Defensa! ¡Abre la puerta!” gritó Shichido Yukino con voz urgente. Kaya dejó el peón en su sitio y abrió, con una cara de “yo no sé nada”.\n\n“¿Qué pasa?” preguntó con calma.\n\n“¿Qué pasa? ¡¿Qué pasa dices?! ¡¿Ni siquiera ves la tele?!” Era una voz muy grosera… pero también aterrada. A Kaya le gustó.\n\n“Primero, pase.” respondió con una sonrisa tranquila. Un peón había venido a suplicarle ayuda por su cuenta: era divertido. Y además, era justo esa posibilidad de la que dudaba.\n\nKaya sirvió dos cafés calientes de la cafetera y los puso sobre el escritorio. Yukino los tomó con manos temblorosas, intentando serenarse, aunque no podía ocultar la expresión desesperada.\n\n“Lo sé. Parece que la administradora principal Rin ha creado un sustituto de SRT.” empezó Kaya. Como si hubiera esperado esas palabras, Yukino se lanzó a hablar.\n\n“¡Sí! ¡Tú también lo sabes! ¡Esa administradora principal al final lo hizo! No sé si su propia fuerza especial le parecía poca, o si quiere purgarnos, o qué… ¡pero lo está haciendo!”\n\n“Sí, eso parece. Y con mucha probabilidad, el Escuadrón Fox y el Escuadrón Rabbit serán descartados. ¿No?”\n\n“¡Lo tienes clarísimo! ¡Necesito tu ayuda! Tú estabas al lado de Rin, ¿no? Entonces… ¿no podrías convencerla de cancelar la creación? ¡Te pagaré lo que sea!”\n\n“Me temo que la administradora principal es terca. Intenté hablar con ella al volver de la rueda de prensa… y no sirvió de nada.”\n\nLa expresión de Yukino se volvió, de golpe, completamente desesperada."
 COU_start_event.5.a:0 "\"Pero… aún hay una alternativa.\""

 COU_start_event.6.t:0 "Ocho peones"
 COU_start_event.6.desc:0 "\"Pero… aún hay una alternativa.\"\n\nLos ojos sin foco de Yukino recuperaron la mirada y se clavaron en Kaya. A Kaya se le escapó una risita.\n\n“Supongamos que esta reina es Rin, y que este caballo soy yo.”\n\nKaya movió el caballo hasta colocarlo justo frente a la reina. Pero cada vez que lo hacía, la reina lo eliminaba sin esfuerzo.\n\nEntonces tomó ocho peones y los colocó sobre el tablero.\n\nAhora, el caballo ganaba de forma aplastante.\n\n“Necesito un pequeño apoyo de SRT.”\n\n“La administradora principal dice que va a llenar esa ‘Milicia Estudiantil de Defensa’ con gente de SRT… ¿no es una mentira obvia?”\n\n“Si es así, entonces el último modo de supervivencia para SRT es que la administradora principal cambie de idea… o que sea reemplazada.”\n\n“Pero no parece tener intención de cambiar.”\n\n“Y la verdad… yo le tengo bastante aprecio a SRT. Son personas capaces, una unidad especial admirable. Por eso, quiero preguntarles algo.”\n\nKaya extendió los ocho peones."
 COU_start_event.6.a:0 "\"¿Van a no hacer nada y ser descartados…\""
 COU_start_event.6.b:0 "\"…o van a forcejear para sobrevivir?\""

 COU_event_notkaya.1.t:0 "Aceptar"
 COU_event_notkaya.1.desc:0 "\"¡Hah… hah… ya… ya basta…!\"\n\nShiranui Kaya corrió, y corrió, hasta verse patética. Detrás de ella, un grupo de funcionarios, con auriculares, avanzaba lentamente.\n\nKaya no podía aceptarlo. No tenía sentido. Los colaboradores que ella había reunido con tanto esfuerzo… el bienestar del Consejo… y su propia ambición… todo gritaba de dolor. Si al final iba a ser una farsa tan vacía, jamás habría empezado.\n\nNo podía aceptarlo.\n\nDe su rostro, enrojecido por la rabia, empezaron a caer lágrimas frías.\n\n“No puede ser… ¿de verdad Rin, Aoi, Haine… se dejaron ‘manipular’ por esos bastardos…? No me mientan…”\n\nKaya dejó de correr. Se desplomó en el suelo y rompió a llorar. Entre los sollozos, los funcionarios se acercaron y, con rostros sin expresión, abrieron un maletín.\n\n“Directora de Defensa. Es una orden de la Presidenta interina. Firme.”\n\nEl maletín se abrió con un clic y la pantalla del ordenador incorporado se encendió. Allí estaba la “orden”: destituir de inmediato a Shiranui Kaya del cargo, por traición.\n\n“Snif… snif… ya veo… así que se acabó…”\n\nKaya arrojó sus guantes y se secó las lágrimas. Llorar más no le daría nada.\n\n“Está bien… ya… lo haré, ¿no? Lo haré…”\n\nCon manos temblorosas, puso la mano sobre el panel del ratón.\n\nCuando los funcionarios se marcharon a toda prisa, a Kaya se le aflojaron por completo las piernas y quedó desplomada. Así, en el suelo, sollozó durante horas."
 COU_event_notkaya.1.a:0 "\"No… esto no tiene sentido…\""

 COU_empty_of_monarchs:0 "Frente Nacional de Resistencia"
 COU_empty_of_monarchs_desc:0 "La gran mayoría del ejército neerlandés y del belga abandonó su patria y huyó, pero no todos lo hicieron. Los oficiales que permanecieron en el País Bajo —ya fuera por obligación del monarca o por órdenes de quedarse— agitan a los locales para obstaculizar nuestra cooperación y sembrar confusión en la administración."

 COU_no_communism_movement:0 "Resistencia de la Oficina de Defensa"
 COU_no_communism_movement_desc:0 "Tras la aprobación de la Ley de Soberanía en el Consejo Estudiantil General, Kaya y la Oficina de Defensa proclamaron abiertamente una “rebelión”, afirmando que impedirán que el comunismo de la Tierra se infiltre y devore al Consejo Estudiantil."

 COU_autonomous_legislation_idea:0 "Ley de Soberanía"
 COU_autonomous_legislation_idea_desc:0 "La ley sobre la autonomía de los locales —conocida como “Ley de Soberanía”— fue creada a partir del hecho de que, tras el Gran Traslado y el choque frontal entre dos mundos, los ciudadanos europeos perdieron por completo su soberanía. Esta ley contiene un amplio conjunto de derechos de autonomía para garantizar un nivel de soberanía similar al de antes del Gran Traslado."

 COU_socialist_world_republic_idea:0 "República Socialista Mundial"
 COU_socialist_world_republic_idea_desc:0 "Un gigantesco bloque ideológico que, como país líder del movimiento socialista global, denuncia los problemas laborales del mundo y respalda revoluciones. Más allá de la pequeña tierra llamada Kivotos, avanzarán hasta que el trabajo en todo el mundo sea liberado."

 COU_outcast_of_the_era:0 "Rezagados de la era"
 COU_outcast_of_the_era_desc:0 "Ha pasado mucho tiempo desde que Kivotos cayó sobre Europa, y ahora Kivotos está estableciendo el estándar del trabajador mundial. En el sistema que ellos están construyendo, nosotros hemos quedado rezagados, y la enorme brecha tecno-social está provocando graves problemas."

