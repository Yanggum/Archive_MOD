l_spanish:

 TRM_auto_conference.1.t: "Conferencia de Weimar"
TRM_auto_conference.1.d: "A medida que la guerra conjunta de la Academia Gehenna contra Trinity avanza a toda velocidad, llega inevitablemente el momento en que Gehenna debe considerar cómo disponer de los territorios de Trinity.\n\nPodríamos aplazar temporalmente el reparto detallado de la Academia Trinity tras la guerra y establecer un organismo provisional de administración delegada para erradicar a los radicales belicistas dentro de Trinity.\n\nNuestros “amigos” han dado a entender que les interesa una conferencia de ese tipo. Sin lugar a dudas, querrán algún tipo de compensación por sus sacrificios."
TRM_auto_conference.1.a: "Necesitamos una conferencia para discutir el futuro de Europa."
TRM_auto_conference.1.b: "No podemos cooperar con [auto_conference_1_partner.GetNameDef]."

TRM_auto_conference.101.t: "Conferencia de Weimar"
TRM_auto_conference.101.d: "La guerra con [TRM.GetNameDef] avanza hacia una fase inevitable, y en Weimar hemos llegado a discutir el futuro de Gehenna.\n\nEllos han propuesto colocar a [TRK.GetNameDef] bajo un mandato administrado por el “Órgano Administrativo de Edén”. Con ello podríamos obtener una compensación parcial por las pérdidas de Gehenna y, al mismo tiempo, apartarnos de la compleja política interna de Gehenna para establecer un control pleno sobre Trinity y expulsar a los instigadores de la guerra."
TRM_auto_conference.101.a: "Ayudémonos mutuamente hasta el final."
TRM_auto_conference.101.b: "Nuestra paz la decidimos nosotros."

TRM_auto_conference.102.t: "Rechazo de participación por parte de [auto_conference_1_partner.GetNameDef]"
TRM_auto_conference.102.d: "La conferencia que propusimos para coordinar el futuro de Gehenna ha terminado en fracaso.\n\nDicho sin rodeos: en lo referente a planes de posguerra para Europa y a la cooperación, [auto_conference_1_partner.GetNameDef] no ha reconocido necesidad alguna."
TRM_auto_conference.102.a: "Es preocupante."

# Enfoques de unificación: Comité de Disciplina de Gehenna & Sociedad Pandemonium
GEH_unified_gehenna:0 "Gehenna unificada"
GEH_unified_gehenna_desc:0 "El conflicto entre la Sociedad Pandemonium y el Comité de Disciplina era tan famoso que toda Gehenna lo conocía. Era un antagonismo que solo podía resolverse si una de las dos partes era destruida físicamente y, por trágico que fuera, la victoria de [ROOT.GetLeader] también solo podía lograrse mediante la guerra. Pero tras esta tragedia, logramos obtener una Gehenna reintegrada: una Gehenna que no volverá a dividirse."

GEH_hot_spring_cooperation:0 "Cooperación con el Club de Desarrollo de Aguas Termales"
GEH_hot_spring_cooperation_desc:0 "El Club de Desarrollo de Aguas Termales está lleno de idiotas, pero al menos su capacidad de ejecución y su velocidad de construcción son inigualables. Por supuesto, no será fácil lograr que trabajen obedientemente por Gehenna."

GEH_emergency_medicine_department_support:0 "Apoyo al Departamento de Medicina de Emergencia"
GEH_emergency_medicine_department_support_desc:0 "La tecnología médica de los locales es considerablemente inferior a la de Kivotos. Los respiradores de forma simple se consideran tecnología de punta sin validar, y enfermedades que en Kivotos se curan con facilidad siguen registrándose aquí como mortales. Apoyar al Departamento de Medicina de Emergencia elevará el nivel médico local y aumentará la esperanza de vida de los habitantes locales de Gehenna."

GEH_gehenna_academy:0 "El futuro de la Gehenna unificada"
GEH_gehenna_academy_desc:0 "Bajo [ROOT.GetLeader], [ROOT.GetName] seguirá desarrollándose y creciendo. Bajo la guía del gobierno de [ROOT.GetLeader], que conducirá el porvenir de la Gehenna unificada, no volveremos a dividirnos ni a enfrentarnos entre nosotros."

GEH_repudiation_of_the_eden_treaty: "Reimpulsar el Tratado de Edén"
GEH_centralized_eden_treaty: "Tratado de Edén centralizado"
GEH_decentralized_eden_treaty: "Tratado de Edén descentralizado"
GEH_forced_integration: "Anexión forzada"
GEH_trinity_war_crime_trial: "Juicio de criminales de guerra de Trinity"

GEH_68_problem:0 "El problema de [HEU.GetName]"

## Ruta: victoria del Comité de Disciplina
GEH_the_end_of_pandemonium:0 "El fin del dominio de Pandemonium"
GEH_the_end_of_pandemonium_desc:0 "La influencia de Pandemonium ya no existe, y el poder de [ROOT.GetLeader] ha sometido a toda Gehenna. Ahora traeremos orden, no caos, a Gehenna, y barreremos hasta borrar todos los vestigios de libertinaje que Pandemonium sembró en estas tierras."

GEH_trial:0 "Juicio"
GEH_trial_desc:0 "Se celebrará un juicio legal por el abuso del presupuesto del Comité de Disciplina por parte de Pandemonium antes de la Gran Transición. El juicio se llevará a cabo de forma justa, y Hanuma Makoto y sus cómplices recibirán un castigo en un nivel razonable."

GEH_personnel_retraining:0 "Elección de renovación de confianza de los diputados"
GEH_personnel_retraining_desc:0 "Pandemonium funciona como un sistema parlamentario con un presidente y diputados. Aunque existe la diferencia de que el presidente se elige por voto directo. El procedimiento de renovación de confianza para los diputados es formal, pero también es una declaración de que se reconocerán su rango y honor dentro de Pandemonium."

GEH_forced_dissolution:0 "Purga legítima"
GEH_forced_dissolution_desc:0 "¿Hace falta un proceso judicial complicado? Actuamos por el orden de Gehenna, pero Pandemonium jamás reconoció el orden del Comité de Disciplina en Kivotos ni una sola vez. Según los criterios definidos por [ROOT.GetLeader], las figuras centrales de Pandemonium recibirán un castigo inmediato, sin juicio."

GEH_movement_downgrade_pandemonium:0 "Abolir el semanario de Pandemonium"
GEH_movement_downgrade_pandemonium_desc:0 "Fuera de las bonitas fotos de Tanga Ibuki, ¿qué valor tenía, siendo honestos, el periódico semanal de Pandemonium? Ninguno. Usar presupuesto para eso no es más que demencia."

GEH_legitimate_dominion:0 "Autoridad legítima"
GEH_legitimate_dominion_desc:0 "Según las antiguas leyes de Gehenna, Pandemonium era la organización superior (de forma ‘formal’) del Comité de Disciplina. Ya no. No necesitamos ninguna organización superior, y los repugnantes restos de Pandemonium han desaparecido para siempre en la historia."

## Ruta: victoria de Pandemonium
GEH_the_end_of_perfect_team:0 "El fin del Comité de Disciplina"
GEH_the_end_of_perfect_team_desc:0 "“¡Toramaru, invencible acorazado, arrásalo todo…!” Ahora, incluso en la sede del Comité de Disciplina resuena el orgulloso himno de alabanza a la Sociedad Pandemonium. En la lucha por la hegemonía de Gehenna, la vencedora fue Pandemonium, y el fastidioso sentido de existencia del Comité de Disciplina ha desaparecido."

GEH_take_command:0 "Incorporación del Departamento de Ejecución"
GEH_take_command_desc:0 "El Comité de Disciplina se divide en el Departamento de Planificación, una organización administrativa, y el Departamento de Ejecución, una organización armada. Ah, y también estaba el infame Departamento de Inteligencia de Sorasaki Hina. En cualquier caso, de todas estas organizaciones, la que más necesitamos es el Departamento de Ejecución, el ala militar. Probablemente más de la mitad de sus miembros se negarán a jurarnos lealtad, pero la tentación del dinero podría hacer cambiar de opinión a algunos."

GEH_top_and_bottom_clothes:0 "Incorporación del alto mando"
GEH_top_and_bottom_clothes_desc:0 "Ya no existe un Comité de Disciplina independiente. Por profunda que sea la desconfianza hacia Pandemonium, si los mandos desean esforzarse por la seguridad pública en Gehenna, deberán aceptar el concepto de un ‘Comité de Disciplina de Gehenna subordinado a Pandemonium’. Si no, se quedarán sin trabajo."

GEH_perfect_team_disbanded:0 "Disolución del Comité de Disciplina"
GEH_perfect_team_disbanded_desc:0 "Es difícil esperar que incluso el miembro más raso del Comité de Disciplina entregue su lealtad a la ‘Sociedad Pandemonium’. ¿No sería mejor disolver el Comité de Disciplina y expulsarlos a todos?"

GEH_clearing_the_remnants:0 "Policía del orden"
GEH_clearing_the_remnants_desc:0 "El Comité de Disciplina ha desaparecido. Esta noticia está dando a los criminales de toda Gehenna la idea equivocada de que ‘Gehenna se ha convertido en una zona donde el crimen es legal’. No. Pandemonium no es una organización tan estúpida (probablemente). La policía del orden, compuesta por locales, asumirá el papel que antes cumplía el Comité de Disciplina."

GEH_civilian_control:0 "Pandemonium por encima del Comité de Disciplina"
GEH_civilian_control_desc:0 "El problema de la integración del Comité de Disciplina se ha resuelto por completo. Claro, no existe un cien por cien de ‘perfecto’. Los antiguos miembros del Comité de Disciplina seguirán odiándonos, y parte del personal incorporado a Pandemonium no podrá evitar la discriminación. Pero, al menos, ¿no es mejor que estar en una guerra civil?"

# Espíritus nacionales
GEH_club_processing_idea:0 "Unificacionismo de Gehenna"
GEH_club_integration_idea:0 "Consejo estudiantil"

GEH_gehenna_academy_idea:0 "Academia de libertad y caos"
GEH_gehenna_academy_idea_desc:0 "Gehenna garantiza una forma de vida extremadamente libre para la población de Kivotos. Aunque a veces el problema es precisamente que es demasiado libre."

GEH_hegemony_idea:0 "Búsqueda de la hegemonía"
GEH_hegemony_4_idea:0 "Hegemonía"

# Evento
GEHENNA_event.1.t:0 "El juicio de la justicia"
GEHENNA_event.1.desc:0 "El tribunal militar de Gehenna concluyó el juicio por crímenes de guerra contra la antigua cúpula de la Academia General Trinity y emitió su veredicto final.\n\nLos principales miembros del Tea Party, incluida la anfitriona del Tea Party, fueron declarados culpables por unanimidad de iniciar una guerra de agresión injusta contra Gehenna. El tribunal les impuso largas penas de prisión, y serán trasladados a la Oficina Correccional de Gehenna.\n\nCon este veredicto histórico, la era de Trinity llegó a su fin y la victoria total de Gehenna fue proclamada ante todo el mundo."
GEHENNA_event.1.a:0 ""
