 COU_focus_guarantee_support_weapons:0 "Acopiar suministros"
 COU_focus_guarantee_support_weapons_desc:0 "Incluso un ejército de un país con soldados individualmente superiores en combate y fortaleza mental no significa nada si esos soldados pasan hambre. Un ejército verdaderamente excelente y avanzado es el que viste a sus tropas con ropa abrigada en invierno, asegura que no falte munición y las mantiene bien alimentadas."
