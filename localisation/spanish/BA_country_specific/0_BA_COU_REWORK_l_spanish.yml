 ##군사
 COU_reorganizing_the_defense_office:0 "Reorganizar las Fuerzas de Defensa"
 COU_reorganizing_the_defense_office_desc:0 "Las Fuerzas de Defensa, creadas tras el Gran Cataclismo por la necesidad de una fuerza armada, mostraron un nivel de entrenamiento y resultados sobresalientes gracias a salarios altos y programas de capacitación profesional. Sin embargo, los trágicos ejemplos de otras academias sugieren que un sistema militar tan grandilocuente no puede sostenerse por mucho tiempo. Aunque estalle el descontento entre las tropas, la reorganización hacia un ejército convencional es inevitable."
 COU_focus_introduction_of_defendu:0 "Implementar Defendu"
 COU_focus_introduction_of_defendu_desc:0 "El sistema de combate cercano, conocido como Defendu, es una táctica combinada desarrollada en los años 20 por William E. Fairbairn y Eric A. Sykes para entrenar a la policía de Shanghái. Si introducimos esta táctica útil —una especie de alternativa inferior a CQB— podremos aumentar la probabilidad de supervivencia y asegurar la victoria, ofreciendo una alternativa de CQB a los ejércitos locales con pensamiento táctico y equipo anticuados."
 COU_focus_invite_collaboraters_to_high_command:0 "Incorporar colaboradores al Alto Mando"
 COU_focus_invite_collaboraters_to_high_command_desc:0 ""
 COU_focus_annex_small_armies:0 "Asumir el mando de pequeñas academias"
 COU_focus_annex_small_armies_desc:0 "En Kivotos existen academias muy pequeñas o casi olvidadas; algunas pudieron ser controladas durante el Gran Cataclismo junto con D.U. o gracias a la capacidad administrativa del Consejo Estudiantil General. Aunque son academias con autonomía y poseen sus propios ejércitos y sistemas de seguridad, sus estructuras son demasiado precarias para confiar en ellas; por eso, asumir nosotros su cadena de mando será más útil tanto para ellas como para nosotros."
 COU_focus_unification_ammunition_process:0 "Unificar el proceso de munición"
 COU_focus_unification_ammunition_process_desc:0 "Desde que el Consejo Estudiantil General sometió las fábricas militares de las tierras bajas, ha sido difícil usar las plantas eficientemente debido a diferencias de proceso entre fábricas de Kivotos y otras: munición distinta, o incluso la misma munición pero con procedimientos diferentes en líneas de producción más detalladas. Para producir munición de forma eficiente, es necesaria la unificación del proceso."
 COU_focus_order_to_fn_herstal:0 "Inspeccionar el arsenal de defensa"
 COU_focus_order_to_fn_herstal_desc:0 ""
 COU_focus_assumption_of_hemberg_military_factory:0 "Reactivar el arsenal de Hembrug"
 COU_focus_assumption_of_hemberg_military_factory_desc:0 ""
 
 ###육군 
 COU_focus_build_military_culture:0 "Reforzar la disciplina"
 COU_focus_build_military_culture_desc:0 "Desde su creación en 1935, las Fuerzas de Defensa Terrestre han mostrado una disciplina y normas “realmente sorprendentes”. Saltarse entrenamientos era lo mínimo: evitaban el combate y malversaban costos, entre otros problemas graves. Para que cumplan la función de un ejército, lo prioritario es fortalecer esa disciplina decadente."
 COU_focus_defensive2:0 "Reconocer una situación excepcional" #이거 id랑 gfx코드가 같으면 해당 gfx로 출력되는구나;;
 COU_focus_defensive2_desc:0 "La mayoría de quienes componen el ejército de infantería con halo aún son adolescentes de preparatoria, o incluso menores. Imponerles una disciplina militar dura y una jerarquía estricta sería demasiado cruel. Reconocer esta situación excepcional y evitar medidas excesivamente severas puede ser el camino correcto."
 COU_focus_ready_for_tank_assembly:0 "Preparar la producción masiva de tanques"
 COU_focus_ready_for_tank_assembly_desc:0 ""
 COU_focus_more_tank_production_line:0 "Ampliar la línea de producción"
 COU_focus_more_tank_production_line_desc:0 ""
 COU_focus_replan_vastion_holland:0 "Reanudar Vesting Holland"
 COU_focus_replan_vastion_holland_desc:0 "Vesting Holland fue el núcleo de la estrategia de defensa nacional del ejército neerlandés en los años 30: una táctica basada en una defensa fuerte que aprovechaba el terreno natural y fortificaciones desde el actual distrito de Shiratori hasta la zona de Haruhabara. Nuestra estrategia principal debe tomar la forma de defender y luego contraatacar."
 COU_focus_great_operation_system:0 "Sistema de operaciones exhaustivo"
 COU_focus_great_operation_system_desc:0 ""
 COU_focus_central_military_reserach:0 "Ejército mecanizado"
 COU_focus_central_military_reserach_desc:0 ""
 COU_focus_tank_assembly:0 "Proceso de ensamblaje"
 COU_focus_tank_assembly_desc:0 ""
 COU_focus_tactical_advantage:0 "Ventaja táctica"
 COU_focus_tactical_advantage_desc:0 ""
 COU_focus_offensive:0 "Reeducación mental"
 COU_focus_offensive_desc:0 "En el ejército, una mentalidad débil equivale a muerte. Los humanos de este mundo entrenarán sin fin sobre cómo matar a los de Kivotos, y una disciplina y un estado mental flojos significan muerte y derrota. Eso no puede ocurrir. Debemos implementar la reeducación mental cuanto antes."
 COU_focus_spirit_of_chasseurs_ardennais:0 "El espíritu de los Chasseurs Ardennais"
 COU_focus_spirit_of_chasseurs_ardennais_desc:0 "Los Chasseurs Ardennais eran una unidad de élite belga con el emblema del jabalí. Durante el Gran Cataclismo, pese a una inferioridad extrema, “resistieron y mordieron” como jabalíes, causándonos grandes pérdidas. Su espíritu noble es digno de ser aprendido."
