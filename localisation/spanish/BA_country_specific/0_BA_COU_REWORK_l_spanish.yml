 COU_focus_restore_grebee_peelram_line_desc: ""
 COU_tooltip_construct_bunker_shalle: "Si controlamos §Yel estado de D.U. Shalle§!:"
 COU_focus_reestablish_amsterdam_univ: "Reconstruir la Universidad de Ámsterdam"
 COU_focus_reestablish_amsterdam_univ_desc: ""
 COU_focus_hapsung_research: "Química sintética"
 COU_focus_hapsung_research_desc: ""
