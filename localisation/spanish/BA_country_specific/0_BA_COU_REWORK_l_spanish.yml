 COU_admin_confusion:0 "Caos administrativo"
 COU_admin_confusion_desc:0 "Tras el Gran Cataclismo, el Consejo Estudiantil General perdió el control, y este caos administrativo parece que continuará por un tiempo."
 COU_admin_confusion_tooltip:0 "Al eliminarse: ocurre el evento '§YAutoridad restaurada del Consejo§!'."
 COU_chronic_principledism:0 "Fuerza de Defensa"
 COU_chronic_principledism_desc:0 "La Fuerza de Defensa es la organización militar del Consejo Estudiantil General creada por unanimidad del Comité Administrativo para proteger la Torre Sanctum y defender D.U., la capital de Kivotos, tras el Gran Cataclismo. Sin embargo, por sueldos y beneficios excesivos destinados a evitar una baja tasa de reclutamiento, la calidad de cada división subió, pero a la vez perdimos la capacidad de librar una guerra a gran escala."
 COU_chronic_principledism_tp_army:0 "Fuerza de Defensa Terrestre vuelta perezosa"
 COU_chronic_principledism_tp_army1:0 "[COU_CCP_ARMY]"
 COU_chronic_principledism_tp_navy:0 "Fuerza de Defensa Naval simplificada"
