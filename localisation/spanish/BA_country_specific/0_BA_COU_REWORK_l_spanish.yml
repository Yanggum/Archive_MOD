 COU_focus_eco_rework_the_dead_lands: "Obligatoriedad de instalar bombas en las tierras bajas"
 COU_focus_eco_rework_the_dead_lands_desc: "Aunque el dique del Zuiderzee ha sido reconstruido, por las características del relieve de las tierras bajas el suelo sigue blando y con una base imperfecta. Para superar esto y cerrar por completo los daños por inundación, debemos obligar la instalación de bombas."
 COU_focus_rework_our_roads: "Asegurar reservas de trenes Highlander"
 COU_focus_rework_our_roads_desc: ""
 COU_focus_attack_northern_france: "Integrar el Norte de Francia"
 COU_focus_attack_northern_france_desc: ""
