 COU_focus_wonderweapons_desc:0 "La ojiva termobárica para misiles balísticos, reliquia del Proyecto A.N.T.I.O.C.H. recuperada por Shichido Yukino, fue destruida tras el Gran Cataclismo para preservar este nuevo mundo y evitar el caos enorme que ocurriría si se filtrara y se superpusiera con el Cataclismo. Sin embargo, como es evidente que la situación dejará de volverse desfavorable para nosotros, reanudaremos el Proyecto A.N.T.I.O.C.H. mediante un método más “moderado”."
