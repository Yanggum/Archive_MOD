 COU_focus_lock_the_kronous: "Controlar Kronos"
 COU_focus_lock_the_kronous_desc: ""
 COU_focus_establish_humans_rights: "Elevar la Oficina de Garantía de Derechos Humanos"
 COU_focus_establish_humans_rights_desc: "La Oficina de Garantía de Derechos Humanos fue creada como un departamento temporal tras el Gran Cataclismo de 1935 y, bajo el liderazgo del fascista Jan Baars —que se pasó a nuestro bando—, ha incrementado su influencia dentro del Comité Administrativo hasta poder situarse casi al mismo nivel que los 11 departamentos existentes. Por lo tanto, ascender esta oficina para colocarla en una posición casi equivalente a la de esos 11 departamentos sin duda es necesario para nuestro gobierno."
 COU_focus_stop_our_deals: "Suspender los tratos"
 COU_focus_stop_our_deals_desc: ""
 #COU_focus_take_their_money: "Confiscar fondos"
 COU_focus_treay_of_amsterdam: "Declaración de Ámsterdam"
 COU_focus_treay_of_amsterdam_desc: "Mientras los únicos territorios que recibían atención eran el Distrito Autónomo de Kronos y el de Highlander, los locales de Flandes y del Norte de Francia —olvidados durante mucho tiempo— han sostenido una larga lucha contra el enfoque del Comité Administrativo centrado en las tierras bajas. Tenemos el deber de aceptar sus opiniones legítimas y desarrollar esta región."
 COU_shaking_royalty: "Sacudir la lealtad"
 COU_shaking_royalty_desc: "Por todo el Consejo Estudiantil General hay quienes se autodenominan “patriotas” que todavía nos ven como invasores… pero, ¿cuánto puede durar esa endeble lealtad? Si les arrojamos un buen pedazo de carne, esos oportunistas frívolos y superficiales pronto se pondrán de nuestro lado."
 COU_give_power_to_degrelle: "Ascenso de Degrelle"
 COU_give_power_to_degrelle_desc: "La mejor manera de demostrar que el tablero ha cambiado es presentar un “ejemplo” vistoso. Tomaremos como ejemplo a Léon Degrelle, leal a nosotros, y al darle más poder y beneficios podremos aumentar el número de colaboradores y enfocarnos mejor en la armonía con los locales."
 COU_keep_our_deals: "Mantener los tratos"
 COU_keep_our_deals_desc: ""
 COU_focus_buy_their_weapon: "Tráfico ilegal de armas de fuego"
 COU_focus_buy_their_weapon_desc: ""
 COU_reduction_of_administrative_committee_authority: "Neutralizar a los Oficiales Libres"
 COU_reduction_of_administrative_committee_authority_desc: "Tras la Guerra de las Tierras Bajas, los oficiales del antiguo enemigo que permanecieron en el continente formaron una organización llamada “Oficiales Libres” y nos causaron daños; pero ya no podemos tolerarlo. Debemos dividirlos, destruirlos y neutralizarlos por completo."
 
