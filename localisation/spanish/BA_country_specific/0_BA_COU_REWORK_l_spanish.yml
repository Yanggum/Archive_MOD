 COU_custom_cost_pol25civ3_blocked:0 "£pol_power  §R25§! £civ_factory  §R2§!"

 ##플란데런-북프랑스개발
 COU_industry_of_flandern_northern_france:0 "Declaración de Ámsterdam"
 COU_industry_of_flandern_northern_france_desc:0 "El Comité Administrativo prometió oficialmente a Flandes y al Norte de Francia que ejecutaría un presupuesto mayor que antes. ¡Todo el descontento acumulado desaparecerá con unas cuantas partidas de gasto!"

