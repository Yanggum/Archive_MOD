 #COU_stabilization_of_the_student_council_desc: "Por suerte, aunque hubo algo de ruido, el Consejo Estudiantil General recuperó la estabilidad. Pero la jefa del Tesoro, Oki Aoi, solicitó convocar una reunión por el asunto relacionado con el choque previo con SCHALE."
 COU_impeachment_of_chief_executive: "Destitución de la interina"
 COU_impeachment_of_chief_executive_desc: "§g\"Tú no eres la Presidenta del Consejo Estudiantil General. Jefa Ejecutiva. Ponerte el brazalete de interina no te convierte en ella.\"§!\n\nNanagami Rin, como Jefa Ejecutiva, aunque sea por la intervención de la organización llamada SCHALE, cruzó una línea inadmisible al degradar a la Presidenta del Consejo durante el proceso. En esta reunión aprobaremos una moción de censura y destituiremos a la Jefa Ejecutiva."
