 COU_kivotos_alliance.3.b:0 "No es momento de sumar enemigos."

 COU_kivotos_alliance.4.t:0 "Restauración del estatus de la Academia de Policía"
 COU_kivotos_alliance.4.desc:0 "Tras la transferencia del control de la Torre Sanctum, el estatus de la Academia de Policía quedó congelado temporalmente, pero esperamos al nuevo Consejo y, finalmente, se restauraron nuestras facultades.\n\nAhora podemos reiniciar nuestro trabajo como la Academia de Policía de Kivotos."
 COU_kivotos_alliance.4.a:0 "Eh… ¿eso es bueno?"

 COU_kivotos_alliance.5.t:0 "La Alianza de Kivotos"
 COU_kivotos_alliance.5.desc:0 "La Alianza de Kivotos es una federación que une a todas las academias de Kivotos. Fue creada por la estabilidad de Kivotos: estudiantes de todas las academias se unen para trabajar por esa estabilidad.\n\nDebemos decidir si nos uniremos a la Alianza, o si permaneceremos independientes y aun así trabajaremos por la estabilidad."
 COU_kivotos_alliance.5.a:0 "Unámonos a la Alianza."
 COU_kivotos_alliance.5.b:0 "Podemos solos."

 COU_kivotos_alliance.6.t:0 "[FROM.GetName] se une a la Alianza"
 COU_kivotos_alliance.6.desc:0 "[FROM.GetName] se ha unido a la Alianza de Kivotos."
 COU_kivotos_alliance.6.a:0 "Trabajaremos por la estabilidad de Kivotos."

 COU_kivotos_alliance.7.t:0 "[FROM.GetName] rechaza la Alianza"
 COU_kivotos_alliance.7.desc:0 "[FROM.GetName] expresó su rechazo."
 COU_kivotos_alliance.7.a:0 "Entendido."

 COU_kivotos_alliance.8.t:0 "[FROM.GetName] solicita unirse a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.8.desc:0 "[FROM.GetName] ha expresado su intención de unirse a la Organización de Cooperación de Kivotos.\n\n[FROM.GetName] no era un país miembro, pero por cambios en la situación internacional, parece que quiere acompañarnos."
 COU_kivotos_alliance.8.a:0 "Mientras más aliados, mejor."
 COU_kivotos_alliance.8.b:0 "Es un país en el que no se puede confiar."

 COU_kivotos_alliance.9.t:0 "Ingreso exitoso a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.9.desc:0 "Los esfuerzos de nuestro gobierno por unirse a la Organización de Cooperación de Kivotos dieron fruto cuando [FROM.GetName] aprobó nuestro ingreso."
 COU_kivotos_alliance.9.a:0 "Era el resultado que queríamos."

 COU_kivotos_alliance.10.t:0 "Ingreso fallido a la Organización de Cooperación de Kivotos"
 COU_kivotos_alliance.10.desc:0 "A pesar de los esfuerzos de nuestro gobierno, el país líder de la Organización de Cooperación de Kivotos rechazó nuestro ingreso."
 COU_kivotos_alliance.10.a:0 "A ver si pueden sin nosotros."

