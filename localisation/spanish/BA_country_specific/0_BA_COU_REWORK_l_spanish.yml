 COU_CPT_tooltip:0 "Modificadores de §Y$COU_chronic_principledism$§!"
 COU_Perfidus:0 "Perfidus"
 COU_Perfidus_desc:0 "Durante el proceso de estabilización del gobierno tras la rendición incondicional de Bélgica, la Oficina de Defensa encabezada por Shiranuí Kaya propuso reclutar colaboradores locales y utilizarlos para gobernar. Oficialmente se les llama “colaboradores”, pero a menudo se les denomina en latín Perfidus: traidores."
 COU_Perfidus_tooltip_modf:0 "£decision_icon_small §YDecisión desbloqueada§!: Perfidus"
 COU_Perfidus_tooltip:0 "Modificadores de §Y$COU_Perfidus$§!"
 COU_industry:0 "Economía dirigida por la administración"
 COU_industry_desc:0 "Por la naturaleza del Consejo Estudiantil General como gigantesca burocracia, incluso al reconstituirse como un Estado, el legado del pasado sigue presente. La economía del Consejo no se deja al mercado: se mueve sobre el papeleo del Comité Administrativo."
