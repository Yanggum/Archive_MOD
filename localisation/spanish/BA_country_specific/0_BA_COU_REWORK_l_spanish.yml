 ##카야 
 COU_focus_black_coffee:0 "Lo que no cambia"
 COU_focus_black_coffee_desc:0 "El mes de reflexión de Shiranuí Kaya no le dio dolor, sino convicción: la convicción de que la lentitud y la tibieza de siempre jamás podrán sofocar el caos del Consejo Estudiantil General. En el mundo hay cosas que no cambian aunque pase el tiempo: el anhelo de un orden perfecto construido sobre el control, y la lógica de que existe un “superhombre” capaz de levantar ese orden."
 COU_focus_questions_about_the_handover_procedure:0 "Cuestionar el procedimiento de traspaso"
 COU_focus_questions_about_the_handover_procedure_desc:0 "Lo que Nanagami Rin está pasando por alto es el diario del Presidente del Consejo Estudiantil General que encontramos tras su desaparición. Un diario que, en condiciones normales, debería haber estado guardado en algún lugar del sótano de SCHALE… pero que por casualidad cayó en nuestras manos, y Kaya lo ha administrado personalmente desde entonces. Si es un paso indispensable para destituir a Rin, entonces con “un ligero arreglo” del contenido podremos crear un defecto en el propio régimen interino de Nanagami Rin."
 COU_focus_without_rin_royalists:0 "Excluir la Oficina de Coordinación General"
 COU_focus_without_rin_royalists_desc:0 "La influencia política de la Oficina de Coordinación General es, a estas alturas, enorme; no podemos tocarla sin más. Pero ahora que su corrupción se ha vuelto pública y la actividad de la oposición está floreciendo, si deliberadamente cooperamos con los jefes de sección y dejamos que el proceso fluya como una “exclusión” de la Oficina de Coordinación, su influencia recibirá un golpe devastador."
 COU_focus_talk_with_aoi:0 "Encuentro con Aoi"
 COU_focus_talk_with_aoi_desc:0 "Oki Aoi, jefa del Tesoro, ha ampliado su influencia de forma constante desde que se puso en duda la confianza hacia el gobierno interino de Rin. Por la naturaleza de su cargo, puede influir fuertemente en muchos departamentos; por tanto, asegurar al Tesoro y a Oki Aoi debe ser una prioridad absoluta."
 COU_focus_intentional_manipulation:0 "Manipulación intencional"
 COU_focus_intentional_manipulation_desc:0 "Lo que los directivos del Comité Administrativo del Consejo Estudiantil General odian por encima de todo son las mentiras, la corrupción y la manipulación. Una forma efectiva de asestar un golpe a la vida política del gobierno interino de Nanagami Rin es derrumbar la confianza en ella mediante una manipulación deliberada de documentos."
 COU_focus_rin_getout_please:0 "Resolución de destitución"
 COU_focus_rin_getout_please_desc:0 "Ha llegado el momento. La confianza hacia Nanagami Rin —interina con mucho pecho y poco contenido— se ha desplomado hasta el fondo. Ahora que Kaya es señalada como la legítima nueva interina, es la hora de sacar a Rin del trono."
