 COU_decision_cat_perfidus:0 "Perfidus"
 COU_decision_cat_perfidus_desc:0 ""Mi honor quedará enterrado hoy bajo estas murallas, pero si mañana por la mañana los niños dentro de esta fortaleza pueden abrir los ojos, con gusto cargaré con la marca de traidor."\n\nQue el Consejo Estudiantil General y la capital de Kivotos hayan sido trasladados a las Tierras Bajas quizá fuese un destino dictado por Dios. Los gobiernos de las Tierras Bajas huyeron aterrorizados, pero entre el caos también existieron quienes, con prudencia, supieron calcular beneficios e intereses. Esos son, en su nombre oficial, los “colaboradores”; y, en su insulto habitual, los Perfidus. La relación con ellos cumplirá un papel crucial en nuestra asimilación local."
 COU_perfidus_gui_txt11:0 "Líder"
 PERFIDUS_LEON_tooltip:0 "Líder de los Perfidus: el 'Inquisidor' §YLeón Degrelle§!"
 COU_perfidus_gui_txt1:0 "Efectos actuales por los Perfidus:"
 COU_perfidus_gui_txt2:0 "Velocidad de reclutamiento [?COU_Perfidus_ms|%+1]\nOrganización de división [?COU_Perfidus_aof|%+1]\nPoblación reclutable (mod.) [?COU_Perfidus_cf|%+1]\nEstabilidad [?COU_Perfidus_sta|%+1]\nLímite de eficiencia de producción [?COU_Perfidus_fmef|%+1]\nVelocidad de aumento de cumplimiento [?COU_Perfidus_cg|%+1]\nTiempo de entrenamiento [?COU_Perfidus_ttf|%+1]"
 COU_perfidus_happy_yay:0 "Los Perfidus están §Gsatisfechos§!."
 
 COU_collaboraters_wants_political_money:0 "Exigen privilegios periódicamente"
 COU_collaboraters_wants_political_money_desc:0 "Los Perfidus cooperan con nosotros, pero no piensan trabajar gratis. Claro, casi todos son oportunistas; pero también es cierto que las tareas que se les imponen —como “salidas de seguridad” en lugar de la Valkyrie, o misiones de la Oficina de Defensa— exigen sacrificios reales. Por eso, periódicamente reclaman privilegios: fondos o apoyo político. Si atendemos sus exigencias a tiempo, no habrá problema; si no, trabajarán “con menos ganas” para nosotros."
