 COU_restart_the_zuiderzee_works:0 "Obras del Zuiderzee"
 COU_restart_the_zuiderzee_works_desc:0 "Esta maravillosa obra de ingeniería civil, completada en 1932 por el antiguo gobierno neerlandés, debe continuar sin importar quién la ejecute. Por la naturaleza de las Tierras Bajas, más terreno firme y más suelo urbanizable son imprescindibles, y la reanudación de este proyecto se llevará a cabo a una escala aún mayor."
 COMPLETED_LEV1:0 "Se completó la §Yfase 1§!."
 COMPLETED_LEV2:0 "Se completó la §Yfase 2§!."
 COMPLETED_LEV3:0 "Se completó la §Yfase 3§!."
 COU_restore_our_fucked_lands:0 "Fase 1: reconstruir el dique del Zuiderzee"
 COU_restore_our_fucked_lands_desc:0 "Para recuperar el terreno totalmente hundido, levantaremos un enorme muro temporal alrededor del área a reconstruir y, mediante bombas, drenaremos el agua; al final, el Zuiderzee volverá a convertirse en el IJsselmeer. Claro… puede que algunas instalaciones acaben “destruidas” en el proceso..."
 COU_restore_our_lost_factories:0 "Fase 2: reparación de emergencia de fábricas inundadas"
 COU_construct_sea_dam:0 "Fase 3: construcción del dique-presa"
 COU_extra_lands:0 "Revisión total del plan urbano"
 COU_restore_flevoland_province:0 "Restablecer la provincia de Flevoland"
 COU_restore_flevoland_province_desc:0 "Durante el Gran Cataclismo, el dique del Zuiderzee quedó completamente destrozado y Flevoland se inundó hasta ‘desaparecer’ por completo. Ahora que hemos reconstruido el dique, Flevoland ha vuelto a emerger sobre el nivel del mar, y debemos restablecerla como corresponde."
 COU_use_dam_for_energy:0 "Maximizar la producción de energía"
 COU_use_dam_for_energy_desc:0 "El Zuiderzee, que llegó a convertirse en mar tras la inundación de 1916, sigue exhibiendo un poder abrumador: si el dique reconstruido colapsa, podría volver a ser mar. Aprovecharemos ese hecho y, usando la presa construida junto al dique en la fase 3, maximizaremos la producción de energía."
