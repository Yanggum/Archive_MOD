 ##경제
 COU_focus_after_two_months: "Después del Gran Cataclismo"
 COU_focus_after_two_months_desc: "Tras el Gran Cataclismo de noviembre de 1935, el Consejo Estudiantil General fue reorganizado con una forma similar a la de un Estado con poder de decisión propio; como resultado, la base industrial —que normalmente se limitaba a liderazgos pasivos y a firmar documentos— pasó a construirse y planificarse de manera mucho más activa y directa."
 COU_focus_look_the_our_economy_fucked: "Análisis del fracaso de la recuperación"
 COU_focus_look_the_our_economy_fucked_desc: "El Comité Administrativo no sabía que la economía de los Países Bajos dependía enormemente del comercio y las exportaciones. ¿De verdad era lo único que no sabíamos? Si fracasamos, es porque había razones claras para ello."
 COU_economy_focus_0: "Reimpulsar el Proyecto Zuiderzee"
 COU_economy_focus_0_desc: "El Proyecto Zuiderzee se refiere a la construcción del dique finalizada en 1932. Sin embargo, tras el Gran Cataclismo de 1935, el traslado repentino de D.U. y de la Torre Sanctum provocó un resultado desastroso: la re-inundación de las tierras ganadas al mar. El punto de partida de la recuperación económica recaerá en un nuevo Proyecto Zuiderzee."
 COU_establishment_of_federal_industrial_committee: "Compra de empresas"
 COU_establishment_of_federal_industrial_committee_desc: "Las empresas se mueven estrictamente por la lógica del dinero. Una empresa patriótica es imposible por definición; si les ponemos algo de dinero en la mano para estabilizar nuestra economía, serán capaces de hacer cualquier cosa por nosotros."
 COU_tooltip_unlock_dutch_belgium_cons:0 "Todos los §Ydiseñadores bloqueados§! pasarán a estar §Gdisponibles§!."
 COU_focus_order_highlander: "Comprar a Highlander"
 COU_focus_order_highlander_desc: ""
 COU_focus_mineral_prospecting: "Reactivar la zona minera de Limburgo"
 COU_focus_mineral_prospecting_desc: "Minas como Maurits y Winterslag en Limburgo quebraron por completo en el caos social del Gran Cataclismo debido a la fuerte dependencia exterior de inicios de los años 30. Pero no podemos seguir abandonando unas minas útiles y abundantes que llegaron a producir hasta 500 millones de toneladas de carbón al año. ¡Todas las minas estatales existentes serán compradas y reactivadas una vez más!"
 COU_focus_project_delta: "Proyecto Delta"
 COU_focus_project_delta_desc: ""
 COU_focus_on_industrial_complex: "Reconstruir la industria civil"
 COU_focus_on_industrial_complex_desc: ""
 COU_focus_restore_cable_internet: "Reconstruir la red de cableado"
 COU_focus_restore_cable_internet_desc: ""
 COU_focus_apprenticeship_jordaanoproer: "Atender el Motín del Jordaan"
 COU_focus_apprenticeship_jordaanoproer_desc: "El Motín del Jordaan fue un levantamiento de desempleados en julio de 1934 que dejó una herida profunda en la sociedad neerlandesa. Nosotros, como quienes heredamos esa situación, tenemos la obligación —como parte responsable de la recuperación económica de las tierras bajas— de resolverlo."
 COU_focus_have_with_galopin: "Adoptar el Principio Galopin"
 COU_focus_have_with_galopin_desc: "Los belgas “patrióticos” —es decir, desleales—, en una resistencia desesperada por preservar su estructura industrial y económica, nos causaron grandes dolores de cabeza: el Comité Galopin, liderado por Alexandre Galopin, defendía el llamado Principio Galopin. Pero si les tomamos por sorpresa y, en cambio, aceptamos ese principio y cooperamos activamente con ellos, podremos absorber su potencial sin sufrir grandes daños." 
 COU_focus_absorption_belgian_assets: "Absorber activos belgas"
 COU_focus_absorption_belgian_assets_desc: ""
 COU_focus_plan_de_man: "Plan De Man"
 COU_focus_plan_de_man_desc: "Este plan laboral ideado por De Man en 1933 es representativo de su doctrina planificadora: busca crear un sector nacionalizado —que incluya la organización crediticia y las industrias clave ya prácticamente monopolizadas— para construir un sistema de economía mixta. Aunque los movimientos de izquierda, especialmente Trotski, lo criticaron desde “un plan para engañar a los trabajadores” hasta “una herramienta reformada del conservadurismo de la democracia burguesa”, el eficiente y efectivo plan de Henri De Man por fin ha encontrado el momento adecuado y debe ejecutarse."
 COU_focus_have_with_hirschfeld: "Nombrar a Hirschfeld"
 COU_focus_have_with_hirschfeld_desc: "Si los locales están montando una especie de comité chapucero para ejercer resistencia económica, entonces nosotros montaremos un comité más sofisticado para enfrentarlos. Hirschfeld, un defensor del proteccionismo cuando la ideología del libre comercio dominaba, y joven director del Ministerio de Trabajo, Comercio e Industria, es un economista prometedor dentro de los colaboradores del Consejo Estudiantil General. Lo incorporaremos oficialmente para construir nuestra propia economía."
 COU_focus_expansion_of_protectionism: "Expandir el proteccionismo"
 COU_focus_expansion_of_protectionism_desc: "Hirschfeld, un firme partidario del proteccionismo, solicitó ampliar la imposición arancelaria —antes limitada a los Estados locales— para proteger una industria paralizada y criar nuevas industrias, así como ampliar los cupos de importación y extender los plazos de subsidios."
 COU_focus_plan_de_vos_tinbergen: "Plan De Vos–Tinbergen"
 COU_focus_plan_de_vos_tinbergen_desc: "Este plan, concebido en 1935 pero nunca puesto en práctica, fue redactado conjuntamente por Hein Vos y Jan Tinbergen. Con la participación del Tesoro, el plan reescrito prevé invertir 200 millones de yenes en obras públicas mediante un Consejo Económico General capaz de coordinar a empresas, trabajadores y el Comité Administrativo, emplear a 200.000 personas y, aprovechando el efecto multiplicador, aumentar el poder adquisitivo de la clase trabajadora para reactivar la economía."
 COU_focus_currency_unification: "Unificación monetaria"
 COU_focus_currency_unification_desc: ""
 COU_focus_abandon_the_gold_standard: "Reintroducir parcialmente el patrón oro"
 COU_focus_abandon_the_gold_standard_desc: ""
