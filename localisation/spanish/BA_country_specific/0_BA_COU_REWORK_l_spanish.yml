 #선택창 
 COU_GATHERING_STORM_DESC: "El Consejo Estudiantil General de Kivotos, ubicado en el distrito central de la gigantesca ciudad-academia Kivotos —una federación compuesta por miles de escuelas grandes y pequeñas— es la institución que controla todas las instalaciones administrativas centrales y coordina disputas, política y conflictos entre academias dentro de los distritos autónomos.\n\nHasta no hace mucho, Kivotos se movía bajo ‘el orden del Consejo’. Todas las academias seguían nuestras órdenes y se sometían.\n\nPor desgracia, ese orden insignificante liderado por el Consejo cayó en un estado fuera de control debido al desastre llamado ‘Gran Cataclismo’. Parece que el día en que el orden vuelva a levantarse no es hoy."
 #¿Qué elección tomará la Presidenta para superar esta situación sin precedentes?"
