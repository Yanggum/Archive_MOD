 COU_establishment_of_autonomous_system: "Establecer el sistema de autonomía"
 COU_establishment_of_autonomous_system_desc: "Al tomar la delantera en la lucha por el poder, logramos sentar a Yuragi Momoka como presidenta del Comité de Emergencia, y obtuvimos la oportunidad de construir una base institucional para la autonomía que antes prometimos a los locales. Con ello podremos consolidar aún más nuestra base de apoyo."



