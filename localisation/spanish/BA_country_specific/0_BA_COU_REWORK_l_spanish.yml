 COU_decision_the_student_council:0 "Misiones"
 COU_decision_the_student_council_desc:0 "£GFX_action_point_texticon §7Puntos de Acción§! son una herramienta de negociación para persuadir y atraer a los altos cargos del Consejo Estudiantil General. Se obtienen al cumplir regularmente ciertas §gexigencias§! presentadas al Comité Administrativo, llamadas §Ymisiones§!.\n\nCon £GFX_action_point_texticon §7PA§! puedes “endulzar” al Comité Administrativo para fijar la política o el enfoque nacional que deseas.\n\nActualmente tienes [?global.cou_apcost|+0] £GFX_action_point_texticon §7PA§!."
 COU_check_the_missions_1:0 "Paso del tiempo"
