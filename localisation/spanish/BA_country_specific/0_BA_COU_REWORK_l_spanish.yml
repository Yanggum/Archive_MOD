 #COU_focus_digital_hallucination_desc:0 "En la guerra moderna, ¿qué es lo más importante? Para crear una opinión pública que apoye y defienda nuestra guerra, es crucial difundir en redes sociales videos falsos generados por IA o noticias falsas manipuladas de forma planificada, creando un ambiente favorable. Habrá muchas más noticias falsas que hayamos difundido, y mezcladas hábilmente con la verdad podremos gestionar con eficiencia el apoyo estudiantil a la guerra." (movido a la ruta Kaya) 
