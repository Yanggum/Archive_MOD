 COU_focus_expand_air_experience:0 "Ampliar el plan de entrenamiento aéreo"
 COU_focus_expand_air_experience_desc:0 "¡Los fuselajes están acumulando polvo! Tenemos combustible de sobra, pero por “diversas razones” no hemos podido entrenar como se debe, y la fuerza aérea —que casi no ha combatido— no puede apoyar el frente ni dominar los cielos. Aunque haya que pedirles un poco de comprensión a los ingenieros, debemos ampliar y ejecutar el plan de entrenamiento aéreo."
