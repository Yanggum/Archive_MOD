 landmark_COU_tower:0 "Torre Sanctum"
 landmark_COU_tower_desc:0 "La Torre Sanctum es un edificio ubicado en el corazón de Kivotos. Es el lugar donde se reúnen las academias y estudiantes de Kivotos para celebrar reuniones y tomar decisiones. Es un edificio simbólico de Kivotos, y todas las decisiones tomadas aquí influyen profundamente en el futuro de Kivotos."

  #오프닝
 #COU_country_intro_content: "En realidad, el Consejo Estudiantil General no era una organización con forma de Estado, como una academia. Si lo comparamos con instituciones de la Tierra, el Consejo cumplía un rol similar al de la Sociedad de Naciones y, por ello, durante mucho tiempo se consolidó en Kivotos como justicia y orden. Al menos hasta antes de aquel día trágico, en noviembre de 1935.\n\nEl Gran Cataclismo destrozó Kivotos de punta a punta. De inicio a fin, aquello que se daba por sentado se volvió falso, y aquello que se consideraba falso pasó a ser un hecho aceptado. En esta nueva tierra donde debíamos sobrevivir, el Consejo no pudo evitar choques físicos con los países de las Tierras Bajas, con quienes compartíamos un lugar incómodo. El enfoque pacífico fue ignorado con un bombardeo miserable; y la humanidad, despojada de su hogar, tomó las armas contra Kivotos, al que llamó “invasor”. Kivotos los reprimió con tecnología y fuerza abrumadoras, pero no podemos apartar la vista de los problemas ocurridos en el proceso.\n\nBélgica y los Países Bajos no sobrevivieron ni dos meses en la Guerra de las Tierras Bajas. Desde Bélgica, donde solo el rey logró escapar por los pelos, hasta la reina Guillermina, abatida durante una operación militar de SRT… el Gran Cataclismo dejó una huella enorme no solo en Kivotos, sino también en la humanidad.\n\nUna herida profunda que jamás sanará.\n\nLos sabios eligieron cooperar para sobrevivir. La organización de colaboradores creada bajo el liderazgo de Shiranui Kaya y la Oficina de Defensa ayudó a la gran reestructuración y estabilización del Consejo. Estos, al recibir un nuevo estatus, obedecen las órdenes sin reparar en medios ni métodos, con la connivencia del Consejo.\n\nY ahora el Consejo debe recibir un nuevo amanecer. Desde la inundación de la megaciudad D.U. hasta la resistencia del Frente de Resistencia Popular, todos los desafíos que tenemos enfrente exponen con crudeza los fallos claros del Consejo y de la Presidenta, así como el amargo rostro real del Gran Cataclismo. Ya no hay tiempo para la demora. El Consejo debe volver a reinar sobre Kivotos. Debe erigir la justicia. Debe enderezar el orden.\n\n§RIncluso si es para expiar todos los pecados y errores cometidos sin comprender nada.§!\n\n§YDesarrollo - SKSKIe, YurizonoSeia, Imika§!"
 COU_country_intro_header: "El orden de Kivotos"
 COU_country_intro_content: "¿Cómo podríamos explicarle de forma sencilla a la humanidad, que jamás oyó hablar del Consejo Estudiantil General? Tal vez una alternativa adecuada sea compararlo con las Naciones Unidas o con el gobierno federal de los Estados Unidos. El Consejo Estudiantil General de Kivotos, con la capital D.U. como centro, era un gran orden y guardián. Controlaba todas las instalaciones administrativas centrales y, al coordinar disputas y política entre academias, ejercía una influencia política inmensa hasta antes del Gran Cataclismo. La Oficina de Coordinación y el Comité Administrativo, compuesto por 11 departamentos, trabajaban en armonía para ejecutar los procedimientos administrativos.\n\nSin embargo, como toda organización, el Consejo no era perfecto. La crónica falta de capacidad administrativa frente a la avalancha de quejas, la tramitación que no daba abasto, y la arraigada “mentalidad de burócrata” fueron temas recurrentes que desgastaron durante mucho tiempo la reputación del Consejo. Por ejemplo, ese dicho popular —un juego de palabras ligeramente exagerado, pero todavía muy vigente— de que si pedías reparar una carretera, seis meses después solo arreglaban la mitad.\n\nAun así, la altísima autonomía de cada academia contribuyó mucho a simplificar el trabajo del Consejo… y también a ralentizar la velocidad de procesamiento. Otro problema señalado era el sistema por el cual, si una orden administrativa no era estrictamente necesaria, bastaba con que cada academia invocara su autonomía para ignorarla."
 COU_country_intro_header_1: "El Gran Cataclismo y la Guerra de las Tierras Bajas"
 COU_country_intro_content_1: "Aproximadamente a la 1:00 p. m. de un día común… aquí, en noviembre de 1935, la Tierra y Kivotos afrontaron un cataclismo gigantesco. Por este incidente, llamado “Gran Cataclismo”, que jamás será olvidado, las academias se trasladaron en masa, y en algunos casos incluso ciudades enteras fueron transportadas a este otro mundo.\n\nAlgunos lugares parecían haber sido sustituidos; otros, como si hubieran desaparecido para siempre. Mientras academias por doquier chocaban armadas con las fuerzas locales, el Consejo, como el orden de Kivotos, intentó resolver los problemas de la forma más pacífica posible. La Presidenta se reunió con el primer ministro de los Países Bajos y sostuvo conversaciones con el rey de Bélgica.\n\nPero el destino cruel no siguió el curso deseado. Los acuerdos de paz, cada día más dilatados, y los choques entre organizaciones militares crecieron hasta un punto imposible de contener. Finalmente, la Presidenta no tuvo más remedio que proponer al Consejo un método: someterlos por la fuerza. Fue el instante en que estalló la Guerra de las Tierras Bajas.\n\nPara cerrar la situación lo antes posible, la Presidenta permitió fuego indiscriminado con el objetivo de capturar a las cúpulas de Países Bajos y Bélgica. Eso provocó una catástrofe por falta de información: los pelotones de la Academia Especial SRT masacraron a la casa real de Orange-Nassau, que intentaba huir al exilio.\n\nFue algo que nadie dentro del Consejo esperaba. Y, de hecho, fue entonces cuando el Consejo “aprendió por primera vez” que una bala podía matar a una persona.\n\nEl resultado de esa imprudencia y esa falta de información fue devastador. Al enterarse del exterminio de la familia real, el ejército neerlandés comenzó a resistir incluso con ataques suicidas, y el gobierno belga descartó cualquier posibilidad de negociación; además, el objetivo —el rey— escapó al Congo.\n\nEn otras palabras: la Presidenta no logró absolutamente nada de lo que pretendía.\n\nY después de transformarse inesperadamente en una asesina, un mes más tarde, en diciembre de 1935, la Presidenta desapareció de repente. Aunque este hecho se mantuvo en secreto absoluto durante un mes, hasta el Año Nuevo de 1936… nadie sabe cuánto tiempo podrá sostenerse esta mentira endeble.\n\nProcedimentalmente, Nanagami Rin, la Jefa Ejecutiva, fue nombrada interina de la Presidenta y cumple con el trabajo, pero algunos señalan que Nanagami Rin está incurriendo en abuso de autoridad."
 COU_country_intro_header_2: "El deber impuesto"
 COU_country_intro_content_2: "Tras el Gran Cataclismo, el sistema de internet colapsó, parte de la tecnología de Kivotos se perdió de forma permanente, y el uso desenfrenado de la autonomía por parte de las academias después del Cataclismo llevó a una situación donde el Consejo ya no podía ejercer influencia alguna.\n\nAl darse cuenta de que Kivotos había sido arrojado de una era de estabilidad y desarrollo a lo salvaje, el Consejo atravesó un periodo de reestructuración organizada. La Oficina de Coordinación pasó a funcionar como una oficina presidencial, el Comité Administrativo como un organismo del poder ejecutivo, y el Consejo —de ser un gran orden— renació como un sistema de academias; en cierto sentido, como un Estado, igual que las academias de Kivotos.\n\nEn la práctica, esto no era distinto a renunciar al control pan-kivotosiano, pero era una reforma imprescindible para sobrevivir.\n\nAhora el Consejo se encuentra ante dos bifurcaciones: acomodarse aquí, en estas Tierras Bajas, sin hacer nada y observar con los brazos cruzados cómo otras academias se desbordan… o luchar por retomar el control de Kivotos sin reparar en medios ni métodos.\n\nAlgunos temen que el Consejo, cegado por su vieja gloria, se haya vuelto bárbaro. Sin embargo, como el orden de Kivotos y como uno de sus miembros, el Consejo recibió el deber de controlar a un Kivotos sumido en el caos.\n\nSi el Consejo se demora, ni el Consejo… ni nadie… podrá impedir que el orden se extinga.\n\n§YDesarrollo : Imika§!\n§LDesarrollo anterior : SKSKIe, YurizonoSeia§!"
 
 #COU_guide: "Objetivo\n\nResuelve el caos del Consejo.\nControla a Arona, la IA del “Club Federal de Investigación SCHALE”, cuya existencia ni siquiera conocíamos, y que recibió órdenes de la Presidenta.\n\n§YBanquete de celebración sobre un castillo de arena§!\n£white_dot. Proclámate el Consejo legítimo y lucha. Por ese banquete que quizá no sea más que una ilusión sobre arena.\n£white_dot. Maneja con cuidado a los colaboradores. Como si adiestraras leones hambrientos y cuervos, con un trozo de carne frente a sus ojos.\n£white_dot. Y después, libra la contienda final. Contra comunistas que jamás podrán sobrevivir bajo el mismo sol que tú.\n\n§CConsejo interino legítimo§!\n£white_dot. Defiende el puesto de interina en medio de la tormenta.\n£white_dot. Aplaca el caos de Kivotos y enciende un nuevo futuro.\n\n§RUn puesto no deseado§!\n£white_dot. Resuelve de forma simple el problema de las protestas.\n£white_dot. Y enfrenta el destino. Sea el que querías o no, al final es un destino que llegará.\n£white_dot. Observa el futuro que no querías, pero que terminaste creando. Sea cual sea su final, pronto estará frente a ti.\n\n§RY el día en que todo termine, enfrenta el destino inevitable cara a cara, pase lo que pase con el resultado.§!"
 
