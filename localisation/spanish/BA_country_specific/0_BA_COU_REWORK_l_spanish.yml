 COU_MOMOKA:0 "Yuragi Momoka"
 COU_MOMOKA_DESC:0 "¿Desde cuándo la Oficina de Transporte se volvió un ministerio tan importante dentro del Consejo? Antes, era un departamento pequeño: arreglar trenes que descarrilaban a diario, recibir reportes… y ya.\n\nYuragi Momoka se convirtió para los locales en un rayo de esperanza. La recién fundada Comisión de Reforma y el Amanecer Rojo insinúan que ella no es una simple gobernante. Abasteciendo generosamente snacks de sabor a huevas de bacalao, recibiendo trato de poder, y fingiendo obedecer órdenes, Momoka terminó convirtiéndose en el núcleo del nuevo orden.\n\nEn otras palabras: Momoka se vio obligada a cargar con tareas molestas.\n\nMomoka no tiene demasiado interés en los juegos políticos. Se cansó hace tiempo de la avalancha de papeles, pero aun así. A veces, suspira sola diciendo que extraña a Rin. A su lado, locales con brazaletes rojos la miran con recelo.\n\nPero sin importar cómo sea ese puesto, ella es el nuevo orden y el símbolo de la armonía entre la humanidad y Kivotos. Momoka, y los snacks de sabor a huevas… cumplirán fielmente ese deber.\n\nAunque no sea más que una marioneta que delegó los juegos políticos en los políticos, Momoka cumplirá su deber.\n\nCargando un peso que debía cargar."
