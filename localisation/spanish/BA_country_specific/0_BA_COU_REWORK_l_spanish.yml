 ##시작 
 COU_start_event.100.t:0 "¿Una nueva historia...?"
 COU_start_event.100.desc:0 "\"¡Hola, Sensei!\"\n\n(Enciendes la Caja de Sittim.)\n\n\"¡Bienvenido al 'Mod de Blue Archive', Sensei! Ah, pero antes... ¡hay una carta aquí! ¡Creo que sería bueno que la leyeras!\""
 COU_start_event.100.a:0 "(Leer la carta.)"
 COU_start_event.100.b:0 "¡Estamos en multijugador! ¡Estoy ocupado!"
 COU_start_event.101.t:0 "Para Sensei."
 COU_start_event.101.desc:0 "\"-No se pudieron encontrar datos- Sensei.\"\n\n\"De todos modos, al final olvidarás mis palabras… pero supongo que no importa.\"\n\n\"Me alegra volver a verte, Sensei. Aunque este lugar no sea más que un pequeño mundo dentro de tu computadora…\"\n\n\"Los 'nosotros' de aquí… seguiremos siendo 'reales' para siempre.\"\n\n\"Tengo algo que decirte, Sensei.\"\n\n\"La historia de este lugar aún está incompleta. Fragmentos de código a medio hacer nos aprietan y nos atan…\"\n\n\"…y, tras olvidarlo todo, lo único que queda aquí son cáscaras: ilusiones.\"\n\n\"Así que, Sensei, por favor… te lo ruego: escucha primero otras historias.\"\n\n\"Historias trágicas, teñidas de sangre, donde no se puede encontrar esperanza…\"\n\n\"A ti… esas historias… no te gustan demasiado…\"\n\n… ¿verdad?\""
 COU_start_event.101.a:0 "(Escuchar la historia de Trinity.)"
 COU_start_event.101.b:0 "(Escuchar la historia de Millennium.)"
 COU_start_event.101.c:0 "(Escuchar la historia de Red Winter.)"
 COU_start_event.101.d:0 "Escuchar esa historia."
 COU_play_trm:0 "§gEl tren se detuvo en la Estación de la Gran Catedral de Trinity. La Presidenta del Consejo Estudiantil General, como si fuese lo natural, te despidió con una sonrisa amarga.§!"
 COU_play_MIL:0 "§gEn algún momento apareció Himari Akeboshi, del Departamento de Fenómenos Especiales, y te guio. Arona se apresuró a seguirte, y la Presidenta del Consejo cerró los ojos.§!"
 COU_play_RED:0 "§gEn algún lugar resonaban las purgas de Cherino. Al sentir de golpe el frío azotarte, encendiste una linterna y saliste. El tren estaba vacío.§!"
 COU_play_COU:0 "§gLa Presidenta del Consejo Estudiantil General pareció sorprendida en secreto. Aun así, aceptaste escuchar de ella esta historia incompleta, aún a medio hacer.§!\n\n§YTodos los bugs que ocurran al jugar con el Consejo Estudiantil General se deben a que está inacabado. La elección es tuya: tú decidiste ir a la ruina y escuchar la historia del Consejo.§!"
 
 
 
 #정치 
 COU_event.1.t:0 "Año nuevo, tragedia"
 COU_event.1.desc:0 "\"Jefa Ejecutiva, feliz año nuevo. Eh, bueno…\"\n\"Sí, gracias. ¿Cuál es el asunto?\"\n\nAmaneció el 1 de enero de 1936. Afuera del edificio de vidrio de D.U., los fuegos artificiales estaban en pleno apogeo. Pero alguien tenía que trabajar: Nanagami Rin seguía en vela aquella noche.\n\n\"…Jefa Ejecutiva, parece que se filtró información.\"\n\nLos ojos apagados de Rin recuperaron el enfoque. Eso no podía ser.\n\n\"Eh… sí, no… ¿qué? ¿Está seguro? ¿Alguna teoría conspirativa barata? No, si es verdad…\"\n\"Haa… ¿y de dónde viene esa filtración?\"\n\"Del informe de nuestro informante infiltrado en el círculo directivo de la Escuela Kronos. Al parecer, la cúpula de Kronos ya lo confirmó y, en cuanto terminen de recomponer la información, lo anunciarán.\"\n\nA Rin le zumbaba la cabeza como si fuera a estallar. Tenía que detenerlo como fuera. Pero no podía: si intentaba bloquearlo, todo se haría el doble de grande. Lo único que quedaba era rezar para que Kronos tardara lo más posible en publicar."
 COU_event.1.a:0 "Ah… maldita sea."
 COU_event.2.t:0 "Notificación del Protocolo"
 COU_event.2.desc:0 "Han pasado unos días desde que, por boca de Nanagami Rin, se confirmó oficialmente la desaparición de la Presidenta del Consejo Estudiantil General. La organización llamada SCHALE —que la Presidenta creó y a la que entregó enormes facultades, y que quedó fuera de nuestro alcance— hoy anunció de forma unilateral que iniciará los procedimientos estipulados por el 'Protocolo'.\n\nEl Comité Administrativo analizó que, por alguna razón desconocida, tras la revelación de la desaparición, SCHALE está usando su autoridad y el pretexto de haber sido 'creada directamente' por la Presidenta para volverse hostil y preparar una anexión forzada del Consejo."
 COU_event.2.a:0 "No vamos a dejarnos pegar sin hacer nada."
 COU_event.3.t:0 "¡El ultimátum final de SCHALE!"
 COU_event.3.desc:0 "\"Mmm… miembros del Consejo, ¿no creen que la legitimidad de la Presidenta se ve más alta de mi lado, no?\"\n\n…Con ese preámbulo absurdo comenzó el ultimátum final de Arona, la IA de SCHALE, que tras un mes de tensión, por fin fue enviado. La Oficina de Coordinación respondió de inmediato con una negativa, y Arona no parece dispuesta a ceder. Se ordenó la movilización de la Fuerza de Defensa, y los colaboradores, con el pretexto de “proteger la patria”, exigen cooperación a las comunidades locales mientras nos preparamos para el choque con SCHALE.\n\n¡Es la oportunidad perfecta para derrotar a esa legión de chatarra arrogante y a los traidores! No podemos retroceder… ¡y mucho menos debemos!"
 COU_event.3.a:0 "Vamos a enseñarle una lección."
 COU_event.4.t:0 "Asegurar la Caja de Sittim"
 COU_event.4.desc:0 "La última división bajo el control de Arona se rindió, y cuando los soldados de la Fuerza de Defensa entraron al edificio de SCHALE, localizaron su posición. Una docena larga de altos cargos enviados por el Comité Administrativo aseguraron la Caja de Sittim, colocada ordenadamente sobre una mesa cerca de la Cámara de Crafteo.\n\nAl principio Arona apagó la energía y se negó a dialogar, pero al final, como si lo aceptara, encendió la caja y transfirió a la interina [COU.GetLeader] el control de la Torre Sanctum. Tras una breve conversación, y por petición propia, la Caja de Sittim volvió a quedar “guardada” junto a la Cámara de Crafteo. A menos que alguien visite las ruinas del edificio de SCHALE, Arona descansará por un largo tiempo.\n\nNo hubo un impacto enorme inmediato, pero acelerar los trámites administrativos y, sobre todo, asegurar el control de un símbolo como la Torre Sanctum, es sin duda una gran ganancia.\n\nClaro que es motivo de celebración… pero sigue siendo polémico que, si la Presidenta no hubiera desaparecido, jamás habríamos tenido que apuntarnos con armas."
 COU_event.4.a:0 "Con Arona hablaré aparte después."
 COU_event_4_tooltip:0 "La confianza de la interina empieza en §Y75%§!.\nSe desbloquea el §Yárbol de enfoques políticos§!."
 COU_event.5.t:0 "Pedir ayuda prestada"
 COU_event.5.desc:0 "\"¡Fuaaaahm~~!\"\n\nArona acababa de levantarse del escritorio. A su lado había un cartón de leche de fresa a medio beber. No se sabe cómo, pero últimamente Arona vivía tranquila, bebiendo leche de fresa y mirando el mar interminable desde algún rincón de la Cámara de Crafteo, dentro de las ruinas de SCHALE, donde nadie debería ir.\n\nAun así, como IA que es, podía responder a algo como Momotalk. Y justo al levantarse, como si hubiera estado esperando, le llegó un mensaje personal del bando de [COU.GetLeader].\n\n\"¿Mmm? Parece que alguien necesita a la supercapaz Arona-chan… fuaaahm…\"\n\nArona leyó el mensaje largo. Con su alta inteligencia y autonomía, entendió más o menos el sentido aunque estuviera escrito con rodeos: querían una “pequeña ayuda” para ejercer influencia política sobre los directivos del Consejo mediante la Caja de Sittim. Por ejemplo, reconocer que el bando de [COU.GetLeader] es el sucesor más legítimo de la Presidencia.\n\nArona, frotándose los ojos, respondió tecleando como si no fuera gran cosa. No era que lo sintiera de corazón; simplemente, evitar acabar encerrada para ser investigada fue, sin duda, gracias a [COU.GetLeader], así que era más bien una devolución del favor."
 COU_event.5.a:0 "Está bien. Espera un poco."
 COU_event.6.t:0 "Dudas sobre la legitimidad de la interina"
 COU_event.6.desc:0 "Tras la objeción de SCHALE a la legitimidad misma del Consejo, se está produciendo agitación entre los directivos internos. No es que quieran ser anexados por SCHALE, pero han empezado a cuestionar si Nanagami Rin, quien actualmente ocupa el cargo interino, es realmente adecuada para ello.\n\nAlgunos conspiracionistas incluso afirman lo absurdo: que Rin traicionó a la Presidenta y la ocultó como parte de un plan para “usurpar” su puesto. Y el problema grave es que no hay nadie que pueda refutarlo de manera contundente.\n\nNanagami Rin niega oficialmente todas las teorías y sostiene que solo está cumpliendo el procedimiento, pero ya es evidente que la facción anti-Rin, liderada por la Oficina de Defensa y el Tesoro, ha comenzado a organizarse. Soplarán vientos de lucha por el poder alrededor del puesto interino."
 COU_event.6.a:0 "Qué vida tan cansada llevan."
 COU_event.7.t:0 "Disturbio del “espíritu de no-posesión”"
 COU_event.7.desc:0 "Hubo un gran alboroto en el Parque Kousagi. Un tal Descartes, que se presentó como líder de “So.Hwak.Haeng” (el funcionario no logró entender qué significaba exactamente por lo largo), movilizó de repente a su banda de vagabundos para salir del parque y recorrer fábricas por todo D.U., promoviendo su “espíritu de no-posesión” y, a la vez, incitando huelgas.\n\nSe estima que su objetivo era, ante todo, hacerse notar y ganar publicidad.\n\nAl principio, por leer un manifiesto “con estilo” sobre la opresión del Consejo al proletariado y la liberación del capitalismo, algunos trabajadores empezaron a agitarse (de hecho, hubo reportes de que el manifiesto fue escrito por una IA según registros del servidor). Sin embargo, cuando Descartes ofreció como “precio de participación” un pollo frito reducido a puro hueso, la multitud se dispersó con una rapidez impresionante.\n\nLa Oficina de Seguridad Pública, movilizada por el reporte de ‘elementos subversivos que incitan huelgas’, fue golpeada y derribada por trabajadores furiosos… pero aun así logró someterlos con facilidad. Por orden del Comité Administrativo, todos fueron enviados al Centro de Reeducación Social."
 COU_event.7.a:0 "Si les damos trabajo, se les va a quitar lo tonto."
 COU_event.10.t:0 "Rueda de prensa"
 COU_event.10.desc:0 "\"¡Silencio, silencio! ¡Les pido silencio a todos!\"\n\nUna secretaria nerviosa golpeaba la mesa sin parar, pero su grito casi agónico no bastaba para calmar a la prensa, sumida en el caos. Había llegado el momento de aclarar la veracidad del anuncio de la Escuela Kronos sobre la desaparición de la Presidenta del Consejo: de boca de la Jefa Ejecutiva y, a la vez, interina.\n\nAl entrar a la sala, Nanagami Rin temblaba, contagiada por el ambiente exaltado. Ni siquiera ella había previsto algo así; jamás debió ocurrir. Sabía que ocultar la desaparición para siempre era imposible, pero no quería que saliera a la luz “de esta forma”. Con cada paso, la invadían el arrepentimiento y la angustia. Pero el tiempo no esperaba.\n\nAcomodó el montón de papeles que había preparado sobre la mesa.\n\nEra hora de decir la verdad."
 COU_event.10.a:0 "\"Soy Nanagami Rin, Jefa Ejecutiva del Consejo Estudiantil General.\""
 COU_tooltip_COU_event_10:0 "§gTras terminar una breve rueda de prensa, Rin se dio la vuelta y salió de la sala. Detrás de ella se desató una lluvia interminable de preguntas… pero no pudo responder a ninguna.§!"
 
 ##린  ##카야
 COU_event_kaya.1.t:0 "Café negro"
 COU_event_kaya.1.desc:0 "Shiranui Kaya disfrutaba cruzar las piernas y moler ella misma granos de café Blue Mountain de alta gama para prepararlo. El sabor elegante y equilibrado que nacía de la Blue Mountain, la acidez suave y, además, ese aroma complejo… Todo parecía existir para ella. Pero aquel día, mientras bebía, un pensamiento que no podía sacudirse la atormentaba. Aunque intentara olvidarlo, se arrastraba de vuelta desde algún rincón hasta el punto de estorbarle el trabajo.\n\nJusto después del Gran Cataclismo, Kaya pasó por una humillación vergonzosa: la Presidenta del Consejo Estudiantil General le impuso personalmente una orden de “reflexión” por el cargo de haber ejercido un gobierno opresivo, abusado de su autoridad y no haber logrado encauzar un control desordenado. Desde entonces, Kaya se escondió en las sombras y observó en silencio. Observó de principio a fin si el “método tradicional” que defendían la Presidenta y Rin era realmente correcto. Quizá… sí, quizá incluso podría reconocer que ella estaba equivocada.\n\nPero el resultado fue indescriptiblemente atroz. La débil Nanagami Rin, como interina, no pudo manejar nada como se debía. Las academias rechazaron las órdenes administrativas del Consejo, y los gritos hacia el vacío terminaron convertidos en motivo de burla.\n\nEso se convirtió en una prueba clara de que la única respuesta correcta era la propia Kaya. Para ella ya no existía ninguna razón para fingir ser buena, ni para fingir arrepentimiento. Ya estaba demostrado lo que pasa cuando uno “se porta bien”.\n\nSolo el gobierno de un superhumano puede resolver todos los problemas. Kaya dejó la taza de café y miró por la ventana."
 COU_event_kaya.1.a:0 "El mundo la estaba llamando."
 COU_event_kaya.2.t:0 "Los movimientos de Nanagami Rin"
 COU_event_kaya.2.desc:0 "A medida que los directivos de la Oficina de Defensa —encabezados por Shiranui Kaya— intensifican las críticas contra la incompetencia de la Oficina de Coordinación y su mala gestión del vacío dejado por la Presidenta, parece que Nanagami Rin ha notado el movimiento de la facción opositora. Recientemente, Rin convocó a sus leales y los instó a oponerse a la difamación malintencionada y a la incitación.\n\nEsto, en última instancia, significa que si no actuamos con rapidez, puede que la destitución llegue a volverse imposible para siempre.\n\n¡Debemos actuar antes de que ellos tomen la iniciativa! ¡Dense prisa!"
 COU_event_kaya.2.a:0 "Entendido."
 COU_event_kaya.3.t:0 "Audiencia"
 COU_event_kaya.3.desc:0 "\"…Ah, ya llegaste. Siéntate aquí. Preparé café.\"\n\"Je, je… Muchas gracias, Directora del Tesoro. Huele tan especial como el Blue Mountain que suelo beber.\"\n\"Bien, Jefa de Defensa. No gastemos demasiado tiempo en charla. Ve al grano.\"\n\"Usted también sabe que existe una justicia que no se puede proteger si uno queda atado a las reglas, ¿verdad?\"\n\"No entiendo tus intenciones, Jefa de Defensa.\"\n\"¿Sabe que el régimen interino de Rin es un caldo de cultivo de corrupción?\"\n\"¿Corrupción?\"\n\n\"Sí, corrupción. El Consejo de hoy está tan podrido que no sería raro que se descompusiera de un momento a otro. Directora del Tesoro… ¿no lo siente? El misterioso vacío de seguridad que surgió tras la independencia administrativa de Valkyrie… y esta miserable realidad en la que, para llenar ese vacío, estamos cediendo autoridad a los locales como si estuviéramos mendigando.\"\n\"Eso no fue solo decisión unilateral de Rin. Fue un juicio administrativo.\"\n\nKaya inclinó el torso hacia adelante y bajó la voz.\n\n\"¿Juicio administrativo? Rin, en vez de ejercer el poder público legítimo del Consejo, se escondió detrás del pretexto de una legitimidad procedimental de lo más superficial. Hace todo a su antojo y, cuando surgen problemas, le tiende la mano a extranjeros sin nombre. Si eso no es incompetencia, ¿qué es?\"\n\"Romper el sistema y sobrevivir sobre sus escombros… ¿acaso no es esa la corrupción de mayor escala?\"\n\nLas cejas de Aoi se crisparon. Kaya no dejó pasar la oportunidad.\n\n\"Rin dice que respeta las reglas, pero en realidad renunció a la fuerza necesaria para protegerlas. ¿Y cuál es el resultado? Órdenes administrativas sin efecto, distritos autónomos fuera de control… Si seguimos así, el orden de Kivotos colapsará.\"\n\"Yo solo quiero recuperar aquella justicia perfecta, sin defectos, de los tiempos en que gobernaba un ‘superhumano’.\"\n\n\"…Entonces, ¿cuál es la conclusión? Suena a que quieres tumbar a Rin.\"\n\n\"Directora del Tesoro. Que alguien tan capaz como usted se desgaste cuadrando presupuestos en este lodazal… es una pérdida para la academia. Si está conmigo, será más eficiente y…\""
 COU_event_kaya.3.a:0 "\"…verá un Kivotos aún más aplastante.\""
 COU_event_kaya_3_tooltip:0 "§g\"…La próxima vez, prepararé un Blue Mountain de verdad. Revisaré ese presupuesto de ‘justicia sin defectos’ del que hablaste.\"\n\nAoi respondió breve. Kaya volvió a alzar la taza. El café, ya frío, seguía amargo… pero en la comisura de sus labios se dibujó una sonrisa húmeda, cargada de la certeza del vencedor.§!"
 KAYA_PASS_AOI_FOCUS:0 "Tesorería cooptada por la Oficina de Coordinación" #quizá se use también en la ruta de Rin después
 COU_event_kaya.4.t:0 "Rumores"
 COU_event_kaya.4.desc:0 "\"¿Lo oíste? Dicen que en el diario de la Presidenta… en realidad…\"\n\"Sí, yo también. Dios mío, ¿cómo puede alguien que es Jefa Ejecutiva tratar así a la Jefa de Defensa…?\"\n\nEran palabras que Shiranui Kaya escuchó al pasar por la Oficina de Coordinación. Iba camino a ver a Rin, así que probablemente la propia Jefa Ejecutiva también las habría oído. Vamos, Jefa Ejecutiva: ¿qué se siente escuchar de primera mano que nadie presta atención a tus palabras y que solo se dedican a chismear?\n\nSintió como si se hubiera vengado de golpe de todo lo acumulado… aunque apenas era el comienzo. De buen humor, Kaya tocó la puerta del despacho con paso ligero.\n\n\"Jefa Ejecutiva, ¿se encuentra? Soy la Jefa de Defensa. Vine a tratar un asunto sobre contratos de equipo para la Fuerza de Defensa.\"\n\nNo hubo respuesta. En su lugar, un funcionario de Coordinación con gesto molesto abrió la puerta. Cuando el chirrido resonó en el pasillo, las voces de afuera se apagaron al instante, como ratones asustados.\n\n\"Jefa Ejecutiva, buenas tardes.\"\n\"Sí, Jefa de Defensa. Solo… tengo algo que pensar.\"\n\"Ah, qué crueles son todos. No solo sacan a relucir rumores sobre usted en lugares públicos, sino que cada quien habla de lo que le da la gana… Recoger las opiniones de todos y tomar una decisión: el deber de un líder… no es nada fácil, ¿verdad?\"\n\"No hay de otra. Yo también tengo parte de culpa en que esto haya pasado. Aunque lleve tiempo, solo queda esforzarnos y persuadir a los directivos. Es evidente que el diario fue manipulado; pronto se calmará todo.\"\n\nKaya apenas logró tragarse una carcajada vacía que estaba a punto de salirle. ¿En qué demonios está pensando esta mujer? Como no tenía otra cosa en la cabeza, Kaya siguió dándole vueltas durante toda la conversación."
 COU_event_kaya.4.a:0 "\"Tal vez… ¿es demasiado ingenua?\""
 COU_event_kaya_4_tooltip:0 "§gAl terminar la conversación, Kaya le dijo a Rin que esperaba que las cosas salieran bien. Claro… si es que de verdad fuera posible demostrar la falsificación.§!"
 COU_event_kaya.5.t:0 "Reencuentro"
 COU_event_kaya.5.desc:0 "En un día de viento helado, Degrelle, como tantas otras veces, visitó la Oficina de Seguridad Pública con órdenes de amnistía para varios prisioneros derechistas importantes. Tras recibir el saludo torpe de una estudiante del organismo, tomó la llave dejada sobre el escritorio. El tintineo metálico se detuvo en su cintura. Hoy era el día en que se concedía la amnistía a Joris van Severen.\n\n\"A ver… Joris van Severen. Celda 35.\"\n\nEl taconeo de sus zapatos resonó en el pasillo. Degrelle parecía estar tenso; conocía a Severen de antes. Siguió caminando por el largo corredor: celda 31, 32, 33, 34… y 35.\n\n\"Ejem. Joris van Severen: la patria, en su misericordia, vuelve a llamarte. Es una amnistía especial. Sal.\"\n\"Mira quién es: ¿no es León, el traidor llorón? ¿Y tú qué hiciste afuera para venir a jugarle al dueño?\"\n\"Ja. Será mejor que dejes esas bromas de mierda sin gracia, Joris. Te lo advierto: mira la realidad. No me dirás que sigues atrapado en delirios de ‘Dietslánd’ o lo que sea, ¿verdad?\"\n\n\"Yo no vendí al país, imbécil.\"\n\"¿Qué? ¿Imbécil? ¿Sabes algo? Mientras tú no hacías nada en prisión, yo salvé a la patria. Salvé a Bélgica. ¿Me oyes, Severen? Tu pésimo sentido de la realidad… arruinó Flandes.\"\n\"Y esto es cooperación, no sumisión. Aprende la diferencia.\"\n\n\"Je, je… tú crees que trajiste una amnistía (Amnesty), pero a mí me suena a amnesia (Amnesia). Me muero de risa, León.\"\n\"Ah, y ese ridículo distintivo azul. Te queda perfecto para un alma tan sucia.\"\n\"Sí, sí, puedes insultarme toda la vida: al final eres el mismo tipo de persona que yo. Al final, tú también irás a trabajar para ellos. ¿Crees que no lo sé?\"\n\nSeveren pareció sorprendido por dentro, pero no respondió nada."
 COU_event_kaya.5.a:0 "Ojalá pudieran llevarse bien en vez de pelear."
 COU_event_kaya.6.t:0 "Destitución de Nanagami Rin, la interina"
 COU_event_kaya.6.desc:0 "La Oficina de Coordinación perdió fuerza y el Comité Administrativo usurpó el centro del poder. Rin, pese a que seguramente podía preverlo y tenía la capacidad política para responder, no reaccionó como debía, como si fuera una tonta. ¿Tal vez lo hizo a propósito? La verdad quizá nunca se sepa, pero para Kaya fue suerte, así que daba igual.\n\nLa “votación de censura para suspender a la interina” estaba programada originalmente para ayer, pero por la interferencia de Transporte y Ajustes se movió a esta mañana. Como era de esperarse: los que apoyaban a Rin eran despreciables.\n\nLa votación, sorprendentemente, fue suave. Hasta el día anterior, quienes del lado de Coordinación amenazaban con voltear la mesa contra el Comité, hoy no pudieron presentarse ni uno solo al lugar de votación, protegido por los colaboradores. Excluyendo Transporte y Ajustes —que no asistieron—, la votación se realizó con el apoyo del resto de departamentos, rápida, como un tajo de cuchillo.\n\nResultado: 6 directivos a favor, por supuesto mayoría. Kaya reprimió la risa que se le escapaba y esperó con calma. La elección de la siguiente interina fue igual de veloz. Aoi, con un gesto poco conforme, parecía no haberlo previsto… pero por el acuerdo previo, no tuvo más remedio que votar por Kaya.\n\nTras concluir la votación perfecta, los colaboradores, siguiendo una cadena de mando ya escrita, apresaron y pusieron bajo arresto domiciliario a Nanagami Rin, la ‘ex’ interina. Con eso, ya nadie pudo detenerla.\n\nAl final, todo salió bien."
 COU_event_kaya.6.a:0 "Solo entonces Kaya dibujó una tenue sonrisa."
 COU_event_kaya.7.t:0 "La conspiración de la Oficina de Coordinación"
 COU_event_kaya.7.desc:0 "\"Interina Kaya, aquí tiene el material de CCTV que solicitó.\"\n\"Sí, buen trabajo. Puedes retirarte.\"\n\nEl funcionario salió del despacho a paso rápido. La interina Kaya reprodujo el video en la tableta con una expresión de fastidio. Aunque apenas llevaba una semana en el cargo, su poder se había obtenido de forma legal y con un apoyo aplastante… y aun así.\n\n\"E-es un desastre… Rin, la senior… no, la Jefa Ejecutiva…\"\n\"Parece cierto que Rin fue puesta bajo arresto. ¿Falsificar una carta de la Presidenta para su propio beneficio y coludir con la corrupción?\"\n\"P-pero seguro que hay un malentendido…\"\n\"¿Malentendido? Qué va. La calumniaron. Haa… casi debería alegrarme de no haber asistido a la votación de destitución. Si hubiéramos ido, esos locos nos habrían arrestado también.\"\n\n¿Locos? Ja. ¿Quiénes son los locos aquí? Kaya frunció el ceño. Últimamente, Transporte y Ajustes actuaban con una insolencia particular y la desagradaban… y el motivo estaba ahí, en ese video.\n\nLa conspiración de Nanagami Rin y la Oficina de Coordinación aún seguía viva."
 COU_event_kaya.7.a:0 "\"Y aun así… ¿qué creen que pueden hacer?\""
 
 
 
 ##아오이-모모카  
 
 
 
 
 
 ##애매 
 COU_event.8.t:0 "Comisión Observadora de la Sociedad de Naciones"
 COU_event.8.desc:0 "Entre los brillantes edificios de D.U., los delegados enviados por la Asamblea avanzaron con pasos cautelosos. La Comisión Observadora de la Sociedad de Naciones —compuesta principalmente por estadounidenses y mexicanos que no se vieron tan afectados por el Gran Cataclismo— se distinguía por llevar brazaletes que acreditaban la autoridad especial otorgada por el Consejo.\n\nEl contacto con “el otro mundo”, que creían imposible, se concretó en una dirección inesperada: el Comité Administrativo fue quien les tendió la mano primero. Fue sorpresivo, pero el argumento de ‘vigilarles’ era suficiente, así que se aprobó por unanimidad crear la comisión. Los gobiernos en el exilio y los países europeos lo vieron con malos ojos, pero aun así votaron a favor, impulsados por una obligación tácita: había que averiguar algo, lo que fuera.\n\n\"¡Ah, bienvenidos al Distrito Especial Utnapishtim, señores!\"\n\nUn funcionario enviado por el Comité Administrativo los recibió con amabilidad. La comisión estaba desconcertada al ver los rascacielos de vidrio de D.U., los semihumanos dispersos por la ciudad y calles pobladas solo por chicas estudiantes. Ya lo habían oído de exiliados, pero verlo con sus propios ojos era un shock inevitable.\n\n\"¿Este lugar se llama Distrito Especial Utnapishtim? El Utnapishtim que conozco es un rey antiguo de Shuruppak… me pregunto si habrá relación…\"\n\"¿Perdón? ¿Shuru… qué?\"\n\"Ah, no es nada. Debe ser una coincidencia…\"\n\"Pero es demasiada coincidencia para que todos ellos hablen idiomas que, en cierta medida, podemos entender. Aunque sea una mezcla de lenguas muy diversa.\"\n\"Hmm… venga de donde venga, parece seguro que es una Tierra de un mundo paralelo. Si no…\"\n\nAcadémicos de la delegación, sin importar nacionalidad, lanzaban opiniones sin parar. Los intérpretes tuvieron que hablar hasta quedarse sin aire, y el funcionario solo los miraba con una sonrisa incómoda."
 COU_event.8.a:0 "\"Señores… ya deberían irse…\""
 COU_tooltip_event_7:0 "§gLa Comisión Observadora de la Sociedad de Naciones permanecerá aquí durante 2 años. Por supuesto, no podrán robarnos nuestra tecnología. Solo harán turismo para ver cómo es el día a día de Kivotos.§!"
 COU_event.9.t:0 "La autoridad del Consejo, restaurada"
 COU_event.9.desc:0 "El caos administrativo que duró un año tras el Gran Cataclismo ha empezado a remitir, al menos en cierta medida. Cada academia demostró que podía mantener su propia fuerza militar y el orden público sin depender de nuestro control, conservando un estado similar al de antes del Cataclismo. Mientras tanto, el Consejo tuvo tiempo de reorganizarse con forma de “Estado”.\n\nPuede que durante el caos se olvidara por un momento, pero ahora que el Consejo recupera el aliento, su autoridad e influencia vuelven a hacerse sentir. Claro… aún son mucho más débiles que antes del Cataclismo.\n\nAun así, para el Consejo posterior al Cataclismo, esto puede considerarse suerte: demostramos a los estudiantes de Kivotos que el Consejo sigue en pie. Y ahora, lo único que queda es darlo todo para volver a ejercer influencia y recuperar el control sobre Kivotos."
 COU_event.9.a:0 "¡Viva!"
 
 
 ##다른 국가에 수여 
 COU_event_diplomancy.1.t:0 "Solicitud del Consejo para unificar la moneda"
 COU_event_diplomancy.1.desc:0 "En una tranquila madrugada a las 5:00, en la oficina de la agencia de detectives sonó un timbre que, de forma inusual, despertó a todos temprano. La pequeña carta que se deslizó por la rendija de la puerta llevaba estampado con fuerza el logotipo azul del Consejo.\n\n¿Quién la recibió? ¿Mutsuki? ¿Haruka? Probablemente ni la propia persona lo recuerde por el sueño. Pero, en cualquier caso, la carta decía lo siguiente:\n\n\"A Su Alteza, el Regente del Gran Ducado de Luxemburgo:\n\nLa Tesorería del Consejo Estudiantil General ha implementado la semana pasada la medida de unificación monetaria que convierte el franco belga y el florín neerlandés al yen de Kivotos. En consecuencia, para preservar el valor del antiguo franco belga, solicitamos también en Luxemburgo —donde circulan el franco belga y el franco luxemburgués— la conversión e integración al yen de Kivotos a razón de 1.5:1.\n\nEsta es una orden administrativa para el beneficio mutuo de ambas partes…\"\n\nPero, aunque quisiéramos acatarlo, una unificación unilateral como la del Consejo es imposible si queremos evitar el shock económico que provocaría en Luxemburgo. Y, por otra parte, no responder podría perjudicar nuestros intereses diplomáticos futuros.\n\n¿Qué decisión debemos tomar?"
 COU_event_diplomancy.1.a:0 "Lo siento, pero rechacémoslo."
 COU_tooltip_COU_event_diplomancy_1:0 "§gEn su lugar, la agencia filtró a la prensa unas líneas: '¡El gobierno de Luxemburgo no se doblegó ante la presión del Consejo!' La jefa Aru saldrá en el periódico viéndose increíblemente genial.§!"
 COU_event_diplomancy.1.b:0 "¡Intercambiemos solo una cantidad limitada!"
 COU_tooltip_COU_event_diplomancy_2:0 "§gPero esto no satisfará ni a la Tesorería ni a los periódicos locales. ¿Quizá la jefa se vea débil?§!"
 COU_event_diplomancy.2.t:0 "Una oportunidad que llega"
 COU_event_diplomancy.2.desc:0 "Se nos presentó una oportunidad. Ya ha pasado más de un mes desde la desaparición de la Presidenta del Consejo. La interina del Consejo tuvo que admitir con su propia boca que no era una líder legítima, y, en ese caso, SCHALE —una organización que la Presidenta ‘creó directamente’— puede heredar sin problemas la legitimidad del Consejo.\n\nDe hecho, tras el fin de la Guerra de las Tierras Bajas, parte del ejército del Consejo que antes seguía a la Presidenta incluso solicitó servir voluntariamente bajo nuestro mando.\n\nEsta es una oportunidad que no debe dejarse escapar. Es hora de entrenar a nuestras fuerzas y, con un ataque sorpresa inesperado, recuperar la legitimidad de la Presidenta y la Torre Sanctum, obligando a arrodillarse a esos opresores sin causa."
 COU_event_diplomancy.2.a:0 "¡Si no es ahora, no se puede!"
 COU_event_diplomancy.3.t:0 "Envío del ultimátum final"
 COU_event_diplomancy.3.desc:0 "Hoy, tras aproximadamente un mes, la tensión en las Tierras Bajas alcanzó su punto máximo. Arona, sin esperar más, envió un ultimátum final que exige la integración unilateral e incondicional del Consejo.\n\nFuera temprano o no, ya cruzamos un camino sin retorno. El arrogante Consejo rechazó nuestra demanda de inmediato, lo cual equivale a exigir una guerra total contra nosotros."
 COU_event_diplomancy.3.a:0 "No hay de otra."
 
 
 
 ##산업 
 COU_event_industry.1.t:0 "Encuentro con empresarios"
 COU_event_industry.1.desc:0 "Oki Aoi abrió la puerta cargando varias tazas de café. Era una reunión con directivos de renombradas empresas armamentistas como FN Herstal, Renard y Philips. Aoi colocó la bandeja sobre la mesa. Los hombres, con rostros tensos, sostenían un silencio incómodo.\n\nEl café se derramó y empapó los guantes de Aoi, así que se apartó un momento para cambiárselos. El café corrió como lágrimas desde los guantes. Aoi se secó la mano con una toalla, sin inmutarse, y luego se sentó.\n\n\"Buenas tardes. ¿Han pensado en la propuesta que les hice?\"\n\nEl silencio continuó. Aoi sintió una leve irritación ante quienes no decían nada. Quien lo rompió fue Dieudonné Soeys, de Herstal.\n\n\"¿De verdad… es correcto que reconozcan nuestros intereses? ¿Que no entregarán la empresa a los sindicatos, que no habrá ni una sola reestructuración, y que solo basta con cooperar con el Consejo?\"\n\nAoi sonrió por fin y habló:\n\n\"Por supuesto. El Consejo reconoce el derecho de gestión de las empresas… siempre que cooperen con el Consejo.\"\n\nAoi abrió los documentos que tenía a un lado.\n\n\"Este es el estado reciente de la gestión de Philips. Desde que se formó el gobierno neerlandés en el exilio, han operado en números rojos: actualmente equivale a 230 millones de yenes.\"\n\nAnton Philips mostró una incomodidad evidente: no solo porque su déficit fuera expuesto, sino porque tampoco estaba acostumbrado a que se expresara en yenes, no en florines. Probablemente estaba calculando cuántos florines eran “230 millones de yenes”.\n\nAoi continuó:\n\n\"La Tesorería puede rescatar a estas empresas. Podemos prestarles 300 millones de yenes por empresa… gratis.\"\n\nTras esa frase corta, los asistentes cercanos a los directivos se alteraron. Anton Philips preguntó si era verdad.\n\nEn realidad, tras el Gran Cataclismo, al Consejo le sería difícil un gasto tan grande… pero Aoi ya había convencido a Rin de que eso no importaba.\n\nAoi respondió que sí."
 COU_event_industry.1.a:0 "Y los directivos firmaron los documentos que Aoi les presentó."
 COU_event_industry.2.t:0 "La Declaración de Ámsterdam"
 COU_event_industry.2.desc:0 "Las grandes cámaras relucientes de la Escuela Kronos enfocaron a la delegación. Esta declaración, en particular, no se transmitirá en la red de Kivotos. Kronos enviará la grabación en vivo a las cadenas de Flandes y del Norte de Francia, y se emitirá esa misma noche.\n\nLa transmisión tuvo forma de un breve debate. A la izquierda estaban Camille Huysmans, del Comité Autónomo de Flandes (una organización no reconocida), y Roger Salengro, del Comité Autónomo del Norte de Francia. A la derecha, vestida con un traje impecable —una apariencia poco común—, estaba Aoi.\n\nEl formato: Huysmans hablaba de las promesas de desarrollo del Comité Administrativo, y Salengro asentía.\n\n\"Sí… eh… el Comité Autónomo de Flandes lleva mucho tiempo objetando las políticas del Comité, que siempre estuvieron sesgadas hacia los Países Bajos. Aunque tarde, estamos muy contentos de que por fin se nos prometa modernización y desarrollo para Flandes. ¿Verdad, señor Salengro?\"\n\"Ah, sí, es cierto. La ciudad de Lille quedó indefensa cuando el ejército francés se retiró tras el Gran Cataclismo, pero nos alegra que el Comité por fin vaya a prestar atención.\"\n\nAoi, escuchando, se sintió un poco molesta. ¿En qué demonios piensan para decir algo así? Si ella fuera ellos, habría elogiado al Comité todo lo posible para sacar aún más beneficios. Pero bueno: quizá tenían rencores de larga data.\n\nAoi sonrió y tendió una carpeta con documentos firmados a su nombre. A partir de hoy, sus comités autónomos se disolverían y obedecerían las órdenes del Comité Administrativo, y, a cambio, el Comité asumiría “obligatoriamente” el deber de desarrollar esas regiones.\n\nNi para ellos ni para el Comité era algo malo."
 COU_event_industry.2.a:0 "\"Bien, ¿todos firmaron?\""
 COU_event_industry_2_tooltip:0 "§gCon un destello se tomó la fotografía. La luz repentina hizo que Salengro cerrara los ojos con fuerza. Al volver a casa, al día siguiente por la mañana, vio en el periódico una foto suya con los ojos cerrados y se rió. Su esposa seguramente le habría molestado diciendo que ‘¿cómo que saliste con los ojos cerrados?’. Pensarlo le trajo a la mente a su esposa.\n\nPero no importaba. Ahora, a los franceses les esperaba una vida mejor.§!"
 COU_event_industry.3.t:0 "Disturbios en el sur"
 COU_event_industry.3.desc:0 "La unificación monetaria impulsada por la Tesorería fue parte de una gran reforma económica que intercambiaba el florín neerlandés y el franco belga a razón de 1.5:1. En los Países Bajos —donde la población de Kivotos era relativamente mayoritaria— la evaluación general fue que ‘no está mal’. Pero en el Norte de Francia y en Flandes no fue así.\n\nAlgunos alcaldes de ciudades flamencas calificaron el canje monetario como una invasión económica e incluso violaron acuerdos con el Comité Administrativo. La oposición más fuerte provino de ciudades portuarias. La ciudad de Dunkerque protestó exigiendo respeto por Francia y por el franco francés.\n\nLa Tesorería tuvo que apaciguarlos a toda prisa debilitando o retirando algunas medidas."
 COU_event_industry.3.a:0 "Vaya chiste."
 
 
 ##군사
 COU_event_military.1.t:0 "Disolución del Cuerpo de Oficiales Libres"
 COU_event_military.1.desc:0 "Gracias a los excelentes resultados del Comité Administrativo al movilizar a los colaboradores, fuentes confiables confirmaron hoy que el Cuerpo de Oficiales Libres —que se había ocultado en refugios secretos por todas partes y nos había hostigado— finalmente se desintegró.\n\nComo prueba clara, varios oficiales provenientes de ese cuerpo se entregaron hoy a la Oficina de Seguridad Pública de Valkyrie. Los colaboradores los tomarán bajo custodia, pasarán por un procedimiento de ‘reeducación’ y luego remodelarán su mente para que sirvan bajo nuestro mando."
 COU_event_military.1.a:0 "Excelente."
 COU_tooltip_unlock_dutch_belgium_generals:0 "£decision_icon_small §YSe desbloquea decisión§! : Reeducación del Cuerpo de Oficiales Libres"
 COU_event_military.2.t:0 "Conde Charles de Flandes, conde de Flandes."
 COU_event_military.2.desc:0 "Últimamente, el conde Charles de Flandes llevaba una vida tranquila. Su hermano, Leopoldo III, huyó al Congo y estableció un gobierno en el exilio, pero él no abordó el barco pese a los ruegos insistentes. Porque los belgas tampoco lo hicieron. Si él también escapaba al Congo, cuando la casa real regresara, sería evidente que su apoyo sería ridículamente bajo. Por la familia real, por su hermano y por los belgas… él no se fue.\n\nEn cualquier caso, su vida no era mala. Los medios, que criticaban a diario al hermano fugitivo, a él lo elogiaban y hasta lo daban por “próximo rey”. Y, en un pueblo rural y apacible de Flandes, llevar una vida leyendo el periódico, tomando café y pastoreando ovejas no era nada despreciable.\n\nNo solo no era mala: era una vida satisfactoria… hasta hace poco.\n\nTodo comenzó cuando un vehículo con el emblema del Consejo irrumpió en su granja. Parecía que el funcionario buscaba a alguien de sangre real. Pero, como al final la funcionaria ayudó a arrear a las ovejas, se disculpó una y otra vez y le preguntó su nombre.\n\nCharles dudó un par de veces… y respondió que era Charles.\n\nLa funcionaria alternó la mirada entre su nombre en los papeles y él, luego pareció intercambiar unas llamadas por radio. Charles sintió una inquietud instintiva. ¿Qué? ¿Había una orden de arresto?\n\nPero sus dudas se resolvieron dentro del vehículo: el Consejo quería nombrarlo algo parecido a gobernador de Flandes.\n\nEl resultado estaba muy lejos de lo que temía, y Charles se sintió aliviado. Si rechazaba, podría haber vuelto a su vida tranquila con las ovejas… pero ya sentía que había descansado lo suficiente.\n\nYa había descansado.\n\nAhora era momento de volver a salir por los belgas.\n\nCharles respondió al funcionario que esperaba su decisión."
 COU_event_military.2.a:0 "\"Sí, por supuesto. Lo haré.\""
 COU_event_military.3.t:0 "Amnistía de Heilkerken"
 COU_event_military.3.desc:0 "El “Inquisidor” León Degrelle apareció en una estrecha prisión a las afueras de Flandes, bajo la gestión de la Oficina de Defensa, dentro de la Oficina de Seguridad Pública de Valkyrie. En su pecho llevaba prendido el pin azul del Consejo. Se detuvo frente a la puerta de la celda 27.\n\nAhí estaba Cornelis van Geelkerken.\n\nGeelkerken, mirando a través de los barrotes, pensó que era repulsivo.\n\n\"Repugnante, traidor valón.\"\n\"Vaya, qué duro para ser la primera vez que me ve.\"\n\nDegrelle respondió con una sonrisa burlona. Pasara lo que pasara, Geelkerken no pensaba darle el gusto… aunque si le dieran libertad, la cosa podría cambiar. Y antes de que ese pensamiento terminara de pasar, Degrelle habló primero.\n\n\"Señor Geelkerken… ¿dónde está Holanda? Su patria.\"\n\"Los holandeses murieron en vano. Kivotos es el nuevo orden de Europa, y la verdad a la que hay que seguir.\"\n\"¿Y por eso haces esa porquería de traición? Parece que no te da vergüenza ante Leopoldo.\"\n\"¿Vergüenza? Tomé una decisión sabia. Protegí a los camaradas del Rex, protegí a los valones del exterminio y, en conclusión… *yo* salvé a Bélgica de la muerte. Quizá alguien que ‘podría’ pudrirse de por vida en esta cárcel no lo entienda.\"\n\"Espera… ¿qué estás diciendo? Tú… no me digas que…\"\n\"Sí, veo que lo entiendes. Te propongo un trato. Conviértete en colaborador y serás libre. Y después… haz lo que te dé la gana. Como yo. Piensa qué es lo primero: ¿tu patria en las Indias Orientales… o tus camaradas a tu lado?\"\n\nGeelkerken intentó replicar, pero terminó desplomándose en el suelo. Degrelle arrojó una llave dentro de la celda y respondió con arrogancia."
 COU_event_military.3.a:0 "\"Espero que lo piense con sensatez.\""
 COU_tooltip_heilcurcken_ours:0 "§gCon un ‘clac’, la puerta de hierro, antes cerrada con firmeza, se abrió. Geelkerken se recompuso.\n\n‘Los tiempos ya cambiaron’, se dijo. ‘Acepta lo que haya que aceptar’.§!\n\n§Y¡Cornelis van Geelkerken§! queda disponible como general."
 COU_event_military.4.t:0 "Amnistía del Pelotón Fox"
 COU_event_military.4.desc:0 "En una tarde-noche tardía en el distrito de Shirotori, una orden administrativa llegó a una prisión dependiente directamente del Comité Administrativo. El Pelotón Fox pasaba días tediosos en celdas solitarias (en principio las cuatro iban a ser encarceladas juntas en una habitación grande, pero los guardias locales buscaron cualquier pretexto para mandarlas a aislamiento).\n\nLo único permitido para ellas eran libros de estudio de francés y neerlandés, manuales tácticos, y cartas que les enviaba el Pelotón Rabbit. Aun así, ninguna se quejaba: había sido su decisión final para proteger a sus juniors.\n\nEntonces los guardias se acercaron y abrieron de golpe las puertas. Uno de ellos frunció los labios y dijo:\n\n\"Es una orden administrativa. Ahora son libres.\"\n\nDos guardias las escoltaron hacia fuera como despedida final. Afuera se amontonaban periodistas, y entre ellos estaban también las juniors del Pelotón Rabbit.\n\nComo si lo hubieran pactado, Yukino y Miyako se estrecharon la mano. Todavía no eran cercanas, pero el vínculo especial de ser senpai y kouhai no se rompía tan fácil.\n\nYukino, frente a los micrófonos, abrió la boca lentamente."
 COU_event_military.4.a:0 "\"¡Buenas noches!\""
 COU_event_military.5.t:0 "Pelotón local de SRT"
 COU_event_military.5.desc:0 "\"¡Pelotón completo, firmes! ¡Saluden al comandante de pelotón!\"\n\"¡A la orden!\"\n\nHombres con brazaletes donde brillaba el logo de SRT realizaron una revista en el patio de la academia. Era temprano.\n\nEl estruendo del pase de lista despertó a las integrantes del Pelotón Rabbit, empezando por Saki. Por orden superior, el Pelotón Lion y el Pelotón Rabbit compartirían alojamiento para intercambiar culturas y tácticas, pero para Rabbit —que veía por primera vez una cultura militar tan rígida— fue inevitable sentirse desconcertado.\n\nEl recién creado Pelotón Lion era un pelotón local compuesto principalmente por prisioneros belgas y franceses, y se movían como presumiendo la disciplina que aprendieron. También era notable que, aun asignados a una nueva unidad, habían derribado diferencias y unido voluntades.\n\n\"¿Por qué están así desde tan temprano? Qué escándalo…\"\n\"Según el manual, levantarse temprano no es malo, Moe. Aunque… las 4 sí es demasiado…\"\n\"¿Ellos vivieron siempre así? Ugh…\"\n\"Nosotras también levantémonos ya, ¿sí?\"\n\nEl Pelotón Rabbit, reuniéndose a regañadientes en el patio, saludó al Pelotón Lion. Recibieron una respuesta dura pero cordial.\n\nEse día era para impartir entrenamiento táctico al estilo Kivotos. Saki opinaba que no era adecuado porque los locales y los de Kivotos tenían estructuras biológicas distintas, pero, como dijo Miyako, solo aprenderían la forma de pensar y actuar tácticamente de Kivotos, así que no habría gran problema.\n\nY así avanzó el entrenamiento conjunto."
 COU_event_military.5.a:0 "Hubo pequeños problemas, pero nada grave."
 COU_tooltip_event_military_5:0 "§gHubo un detalle menor: los miembros del Pelotón Lion no podían ocultar su horror al ver tácticas estilo Kivotos, como que incluso los francotiradores corrieran al frente para disparar.§!"
 COU_event_military.6.t:0 "Informe del estado de la Fuerza de Defensa"
 COU_event_military.6.desc:0 "\"Ah… ¿se ve bien la pantalla?\"\n\"Me dijeron que [COU.GetLeader] no está ahora, así que lo mando grabado. Solo tengo que hablar del estado de la Fuerza de Defensa, ¿verdad?\"\n\"Mmm… no sé bien cómo decirlo, pero estamos mejor que antes. Rehicimos el sistema de entrenamiento, y como bajaron los sueldos quedó algo de presupuesto, así que compramos algunas piezas nuevas de equipo militar. Eso está bien, pero… de fondo, todavía hay quejas. Aun así, creo que con el tiempo se resolverá. Parece que ellos mismos saben, en el fondo, que antes se les trató en exceso.\"\n\n\"…Y también los estudiantes de las divisiones de infantería con Halo, tras la reorganización, ya se habituaron a esta vida. Ya sabes: aunque ya no hay formación profesional… siguen haciendo revista, corriendo unas vueltas al patio, haciendo flexiones… lo de siempre.\"\n\"Y los colaboradores locales también parecen haberse acostumbrado más o menos a nuestra cadena de mando. Ahí casi no cambió nada. La verdad, más que los locales, quienes se quejan son los chicos de Deportes, porque se cancelaron las actividades físicas… Mmm.\n\n\"Quiero organizar dentro del cuartel una especie de festival deportivo permanente, algo pequeño pero constante. Así todos se animan y estaría bien. Espero que lo consideren de forma positiva.\"\n\n\"En fin, mi informe es ese. Creo que ya tenemos la base para reformar la Fuerza de Defensa.\"\n\n(ruido) \"¡Jefe Haine, ya hice todos los onigiris! ¡Venga a probar uno!\"\n\n\"¡Ya voy! Creo que debo irme. Corto aquí. La próxima vez pasaré por D.U. y haré un informe escrito más detallado. ¡Hasta luego!\""
 COU_event_military.6.a:0 "Es un golpe soportable."
 COU_event_military.7.t:0 "Informe de entrenamiento de larga distancia"
 COU_event_military.7.desc:0 "Ante el Subdirector de Defensa, Comité Administrativo.\n\nTras recibir la orden el mes pasado, a mediados se destacaron algunos buques del escuadrón de cruceros pesados y se realizaron maniobras y entrenamiento de tiro en el Canal de la Mancha y el Mar del Norte, respectivamente. Pese a la inusual navegación de larga distancia, al tratarse de buques mantenidos con tecnología de Kivotos, no hubo problemas graves durante la operación.\n\nSin embargo, no sé si se debe a la falta de experiencia naval en nuestras fuerzas o qué, pero el dispositivo de navegación automática está… raro. Y como el sistema de gestión automática de combustible no funcionó, fue imposible administrar el combustible de forma eficiente… (omitido)\n\nAun así, el sistema mostró un rendimiento realmente excelente, y si corregimos estos pequeños problemas técnicos, nuestros buques recién reacondicionados podrían navegar alrededor de un 10% más lejos.\n\nEsperamos una pronta solución.\n\n- Konrad Helfrich."
 COU_event_military.7.a:0 "Bueno, si es un problema técnico, se arregla rápido."
 
 
 
