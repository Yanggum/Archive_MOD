 ##BA 
 COU_XXX_override_instant:0 "§YPresidenta del Consejo Estudiantil General§!"
 COU_XXX_override_delayed:0 "Tras innumerables pruebas desde el Gran Cataclismo, la §YPresidenta del Consejo Estudiantil General§! —como corresponde a su cargo y autoridad— §Gjamás§! abandonará Kivotos.\n...\n\n§RPero… ¿cuándo saldrá la Presidenta de su despacho?§!"
 #COU_XXX:0 "Presidenta del Consejo Estudiantil General"
 #COU_XXX_desc:0 "Por encima de cualquiera, la Presidenta del Consejo Estudiantil General administraba todo en Kivotos. Disputas entre academias, e incluso riñas menores: lo controlaba, coordinaba y mediaba todo. Pero cuando todo Kivotos fue trasladado a un lugar del que jamás se oyó hablar —uno cuya existencia ni siquiera era segura—, incluso ella tuvo que cargar con todo.\n\nNo era lo que deseaba, pero como líder de todos debía ser así, decidió cargarlo gustosamente. Y, en medio de esas pruebas, hasta el momento en que ya no pueda resistir más, la Presidenta hará cuanto pueda para trabajar por Kivotos hasta el final."
 COU_null:0 "Comité de Emergencia de Kivotos"
 COU_null_desc:0 "Tras la repentina desaparición de la Presidenta, el Consejo quedó atrapado en un caos tremendo. El Consejo Estudiantil General de Kivotos actualmente no puede realizar actividad alguna, lo que significa que no puede responder en absoluto a las anomalías de la situación."
 COU_RIN:0 "Nanagami Rin"
 COU_RIN_desc:0 "Tras la desaparición irresponsable de la Presidenta, el Consejo quedó bajo el liderazgo de Nanagami Rin. No hace falta explicar la capacidad de Rin, demostrada por la confianza de la Presidenta: completa a la perfección cada día una cantidad absurda de trabajo y lo hace casi sin descanso, lo cual recuerda a la propia Presidenta y a un superhumano.\n\nQuizá en ese sentido Rin encontró su lugar. Sin embargo, su problema es que la Presidenta, al desaparecer de un día para otro, nunca la nombró explícitamente. Simplemente, por ocupar el cargo inmediatamente inferior, se vio empujada a asumir la interinidad.\n\nLa débil base de poder de Rin y su filosofía de gobierno benefician a todos… pero no a ella. Puesto que debe apostarlo todo a cuánto durará el simple “aval de la Presidenta”, Rin tendrá que moverse sin parar."
