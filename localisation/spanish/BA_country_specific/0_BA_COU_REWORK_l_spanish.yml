 COU_focus_air_command_coppens:0 "Apoyar a Coppens"
 COU_focus_air_command_coppens_desc:0 "Durante la Guerra de las Tierras Bajas, en la batalla aérea de Leeuwarden, Willy Coppens —que se rindió ante nosotros— recordó que, cuando pilotó directamente un fuselaje avanzado de Kivotos, sintió un enorme asombro como humano que anhela el firmamento… o, dicho de otra forma, se quedó aterrado. Desde entonces, ha avanzado como pilar y figura influyente de la Fuerza Aérea de Defensa, y Coppens sostiene la superioridad de nuestra ventaja tecnológica." 
 COU_focus_test_kivotos_new_plane:0 "Análisis e investigación"
 COU_focus_test_kivotos_new_plane_desc:0 "Tras el Gran Cataclismo, los fuselajes de Kivotos que vinieron con nosotros incluyen algunos modelos que aún no han sido hallados en el resto de Kivotos. Asignaremos personal del laboratorio para desarmarlos por completo y examinarlos sin dejar pieza sin revisar, con tal de acelerar al máximo el progreso de nuestra investigación aeronáutica."
 COU_focus_air_command_donnet:0 "Apoyar a Donnet"
 COU_focus_air_command_donnet_desc:0 "Mike Donnet, derribado y capturado tras el combate aéreo de La Haya durante la Guerra de las Tierras Bajas, juró cooperar con nosotros. Y aunque las aeronaves que usa la humanidad sean modelos tempranos, él —habiendo vivido en carne propia en La Haya que una producción masiva puede dar la ventaja en la guerra aérea— defiende la producción en serie de fuselajes “adecuados”."
