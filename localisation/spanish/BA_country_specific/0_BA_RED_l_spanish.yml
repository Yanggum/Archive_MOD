 RED_snake_game_decision: "Intento de Asesinato de Trotsky por la Unión Soviética"
 RED_snake_game_decision_desc: "Desde su expulsión, Stalin y la Unión Soviética han intentado repetidamente asesinar a Trotsky. Para sobrevivir, debe moverse como una 'serpiente'.\n\n§YEl Juego de la Serpiente de Trotsky§! ha comenzado. Sigue reglas similares al clásico juego, pero con diferencias: el §Yamarillo§! representa la §YCabeza§!, el §Gverde§! representa la §YCola§!, comer una §GManzana§! alarga la cola. Si la §YCabeza§! choca con la §YCola§! o una §YPared§!, §RTrotsky será asesinado§!. Los §RCuadrados Rojos§! representan intentos soviéticos de asesinato: chocarlos reducirá tu §YCola§!. Si la cola desaparece, §RTrotsky morirá§!.\n\n"

