# Eventos
 RED_ending_event.1.t: "Día de la Victoria"
 RED_ending_event.1.d: "Era algo que tarde o temprano iba a suceder. Las interminables divisiones dentro del movimiento marxista, desde la Segunda Internacional, han llegado a su fin gracias a [RED.getleader]. La bandera de Red Winter ondea sobre el Kremlin, y la Unión Soviética como entidad soberana ya no existe."
 RED_ending_event.1.a: "La larga guerra ideológica ha terminado."
 RED_ending_event.2.t: "El regreso de la Oposición de Izquierda"
 RED_ending_event.2.d: "Trotsky pensaba que el pueblo, exhausto por la explotación represiva bajo el régimen estalinista, lo recibiría con los brazos abiertos. Pero la realidad fue otra.\n\n\"¡Un terrorista antisoviético arruinó el país!\"\n\n\"¡Aléjate, víbora!\"\n\n\"¡Condenamos al opresor!\"\n\nGracias a las maniobras políticas de los estalinistas leales, surgieron mítines antitrotskistas por toda la federación. El futuro de la Oposición de Izquierda no será fácil."
 RED_ending_event.2.a: "Maldita sea."
 RED_ending_event.2_tt: "\n§R¡Debemos frenar el auge del sentimiento estalinista!§!"
 RED_ending_event.3.t: "Resistencia Estalinista"
 RED_ending_event.3.d: "¡La guerra aún continúa! Los partisanos estalinistas han organizado a los trabajadores urbanos bajo una bandera contrarrevolucionaria para liberarse de nuestro control, mientras que en el campo, los guerrilleros estalinistas usan los koljoses como bases para su actividad."
 RED_ending_event.3.a: "Esto se está saliendo de control..."
 RED_ending_event.3_tt: "\n§R¡Debemos detener a los partisanos estalinistas!§!"
 RED_ending_event.4.t: "Juicio Revolucionario"
 RED_ending_event.4.d: "La chispa de la revolución se enciende sola. La Revolución de Febrero llevó a la de Octubre, que derivó en la Guerra Civil Roja y Blanca, culminando ahora en esta guerra ideológica. Las sucesivas contrarrevoluciones han sido derrotadas; ahora comienza la revolución genuina. Bajo la dirección del Tribunal Central Revolucionario de Leningrado, llevaremos a cabo purgas de burócratas y militares estalinistas en cada región."
 RED_ending_event.4.a: "¡Que paguen sus crímenes!"
 RED_ending_event.5.t: "Juicio Revolucionario de Leningrado: Altos Burócratas"
 RED_ending_event.5.d: "Número: No. 0004\nTítulo: Acusación\nLa Comisión de Delitos Contrarrevolucionarios acusa a:\n\nI. Acusados: $SOV_iosif_stalin$, $SOV_lazar_kaganovich$, $SOV_vyacheslav_molotov$\nII. Principales Cargos: Conspiración contrarrevolucionaria, usurpación ilegal del poder estatal y partidario, traición a la clase obrera.\nIII. Sentencia Solicitada: Pena de muerte para los tres acusados.\n\nIV. Fundamentos de la Acusación:\n\n1. Stalin y sus cómplices negaron los principios de democracia obrera establecidos por el camarada Lenin, degenerando el Soviet en una oligarquía burocrática.\n- Monopolizaron las decisiones del Comité Central, expulsando irracionalmente a figuras clave como Lev Trotsky.\n- Gestionaron la economía no en base a teorías socialistas, sino al mantenimiento de su poder, empeorando las condiciones de los trabajadores y campesinos.\n- Reemplazaron la dictadura proletaria por una oligarquía burocrática, destruyendo el socialismo.\n\n2. La política de colectivización forzada de Stalin reprimió brutalmente al campesinado y dañó la construcción socialista.\n- La hambruna provocada entre 1932 y 1933 en Ucrania y el Volga mató a millones.\n- El uso de la violencia en lugar de la participación revolucionaria de los campesinos hizo retroceder la economía socialista.\n\n3. El centro estalinista obstaculizó el movimiento comunista internacional.\n- Desperdició las oportunidades revolucionarias en Alemania, China y España.\n- Redujo a la URSS a un Estado socialista aislado, traicionando los principios leninistas."
 RED_ending_event.5.a: "Aprobado."
 RED_ending_event.6.t: "Juicio Revolucionario de Leningrado: NKVD"
 RED_ending_event.6.d: "Número: No. 0009\nTítulo: Acusación\nLa Comisión de Delitos Contrarrevolucionarios acusa a:\n\nI. Acusados: Todo el alto mando del NKVD\nII. Principales Cargos: Conspiración contrarrevolucionaria, violación de la dictadura proletaria, traición a la clase obrera.\nIII. Sentencia Solicitada: Pena de muerte para algunos e inmediata disolución del NKVD.\n\nIV. Fundamentos de la Acusación:\n\n1. El NKVD instauró un régimen de terror contrarrevolucionario en el interior del Soviet, destruyendo la dictadura proletaria.\n- Durante la Gran Purga, ejecutaron sistemáticamente a cuadros del partido y líderes sindicales.\n- Arrestaron, torturaron y ejecutaron a bolcheviques leales.\n- Eliminaron la democracia interna del partido, degenerando en una policía secreta al servicio del culto a Stalin.\n\n2. Bajo órdenes de Stalin, reprimieron brutalmente a trabajadores y campesinos.\n- Arrestaron y ejecutaron a millones de campesinos que resistieron la colectivización forzada.\n- Implementaron una vigilancia opresiva en fábricas y granjas colectivas.\n\n3. Falsificaron conspiraciones contrarrevolucionarias.\n- Fabricaron pruebas y extrajeron confesiones mediante tortura.\n- Impusieron testimonios falsos durante los Juicios de Moscú.\n\n4. Destruyeron el movimiento comunista internacional.\n- Sembraron el terror en organizaciones comunistas como durante la Guerra Civil Española.\n- Secuestraron y asesinaron a revolucionarios en el extranjero."
 RED_ending_event.6.a: "Aprobado."
 RED_ending_event.6.b: "Parte de las acusaciones fueron desestimadas."
 RED_ending_event.6_tt: "§gEl NKVD, temporalmente, servirá como un escudo organizativo contra la conspiración terrorista estalinista.§!"
 RED_ending_event.7.t: "Juicio Revolucionario de Leningrado: Ejército Rojo"
 RED_ending_event.7.d: "Número: No. 0013\nTítulo: Acusación\nLa Comisión de Delitos Contrarrevolucionarios acusa a:\n\nI. Acusados: Jefes contrarrevolucionarios del Ejército Rojo.\nII. Principales Cargos: Conspiración contrarrevolucionaria, colaboración con los estalinistas durante la guerra ideológica.\nIII. Sentencia Solicitada: Destitución de algunos oficiales.\n\nIV. Fundamentos de la Acusación:\n\n1. Algunos burócratas del Ejército Rojo rompieron el principio de control obrero sobre las fuerzas armadas.\n- Colaboraron con facciones contrarrevolucionarias durante la guerra ideológica."
 RED_ending_event.7.a: "Aprobado."
 RED_ending_event.7_tt: "§gTomará tiempo restaurar la profesionalización del Ejército Rojo. Muchos oficiales quedarán resentidos y simpatizarán en secreto con la resistencia estalinista.§!"
 RED_ending_event.8.t: "Juicio Revolucionario de Leningrado: Terroristas Estalinistas"
 RED_ending_event.8.d: "Número: No. 0041\nTítulo: Acusación\nLa Comisión de Delitos Contrarrevolucionarios acusa a:\n\nI. Acusados: Organizadores y colaboradores del terrorismo estalinista.\nII. Principales Cargos: Terrorismo contrarrevolucionario, traición a la clase obrera.\nIII. Sentencia Solicitada: Pena de muerte para los principales instigadores, reeducación laboral para algunos.\n\nIV. Fundamentos de la Acusación:\n\n1. Los grupos estalinistas perpetraron ataques armados contra el Estado obrero.\n- Asesinato de campesinos soviéticos y cuadros partidarios en el campo.\n- Conspiraciones para sabotear fábricas, oficinas y soviets.\n- Ataques a ferrocarriles y comunicaciones para paralizar el Estado proletario."
 RED_ending_event.8.a: "Aprobado."
 RED_ending_event.9.t: "Disolución de la Comisión de Acusaciones"
 RED_ending_event.9.d: "En tiempos de crisis extrema, se justifican remedios extremos, pero su utilidad ha terminado. Hemos tomado todas las medidas necesarias para mantener el orden. Con la creciente preocupación por el poder absoluto de la Comisión, tras finalizar el último juicio revolucionario, la Comisión resolvió autodisolverse. Ya no existe ninguna institución con derecho de acusar actos contrarrevolucionarios. Los jueces revolucionarios volverán a su rol judicial habitual."
 RED_ending_event.9.a: "Buen trabajo."
 RED_ending_event.10.t: "Reconstrucción del Partido de Vanguardia"
 RED_ending_event.10.d: "Con la depuración de burócratas finalizada, el partido puede ahora cumplir su rol de vanguardia. No debe permitirse más traiciones contra la revolución y el pueblo. El Partido de Vanguardia guiará y organizará al pueblo hacia adelante."
 RED_ending_event.10.a: "¡Sigamos los principios leninistas!"
 RED_ending_event.10_tt: "Puede eliminarse el §Y$RED_stalinist_sentiments_1$§! mediante la decisión §Y£GFX_decision_icon_small Desmantelar la Burocracia§!."

# Eventos Ordinarios
 RED_ordinary_event.1.t: "Cherino pierde su barba"
 RED_ordinary_event.1.d: "\"\""
 RED_ordinary_event.2.t: "Clase Especial 227"
 RED_ordinary_event.2.d: "\"¡Maldición, qué desastre es todo esto!\"\n\nAmami Nodoka se quejaba con una voz llena de frustración. \"Bueno, después del Gran Traslado, no es raro que se hayan olvidado de la vieja escuela.\"\n\nComentó Mayoi Shigure. Ambas entendían que su regreso a la escuela principal se había pospuesto indefinidamente, quizá diez veces más de lo esperado. Afortunadamente, habían logrado abastecerse de suministros de una aldea local cercana, lo que mejoró un poco las condiciones.\n\nSin embargo, tras una noche particularmente incómoda llena de pesadillas, Nodoka descubrió que la vieja escuela había sido completamente reconstruida en un solo día."
 RED_ordinary_event.2.a: "¿¡Qué demonios está pasando aquí!?"
 RED_ordinary_event.3.t: "Calefacción"
 RED_ordinary_event.3.d: "Con la reconstrucción de la escuela, se necesitaba mucho combustible para mantenerla caliente. Amami Nodoka recogía escombros de madera para usarlos como leña.\n\n\"Uf, este pilar de madera está muy incrustado en el suelo. ¡No importa cuánto esfuerzo haga, no sale!\"\n\n\"¿De verdad? ¡Déjame ayudarte, jalemos al mismo tiempo!\"\n\nGracias a la ayuda de Shigure, Nodoka logró finalmente sacar el pilar del suelo.\n\n\"¡Aaaah!\"\n\nJusto en ese momento, un potente chorro de agua brotó del suelo, formando rápidamente una charca, o más bien, un pequeño lago.\n\n\"¡Maldición, estoy toda empapada! ¡Qué mala suerte!\"\n\n\"No, Nodoka, ¡mira bien el agua! ¡Huele a azufre... esto es un manantial de aguas termales!\""
 RED_ordinary_event.3.a: "\"¿¡Un onsen!?\""
 RED_ordinary_event.4.t: "¡Aguas Termales!"
 RED_ordinary_event.4.d: "\"Hmm. Pero, ¿qué se supone que hagamos con estas aguas termales? No parecen ser muy útiles.\"\n\n\"¡¿Cómo puedes decir que un onsen no es útil?!\"\n\nDe repente, miembros del Departamento de Desarrollo de Aguas Termales de Gehenna y Shimokura Megu aparecieron de la nada. Ignorando por completo las preguntas atónitas de Nodoka sobre cómo habían llegado tan rápido, construyeron un gigantesco ryokan y un complejo de aguas termales en un abrir y cerrar de ojos antes de marcharse."
 RED_ordinary_event.4.a: "\"¡¿Qué acaba de pasar?! Fue como un huracán.\""


 # Eventos de Persecución (racing_sov)
 RED_racing_sov.1.t: "Fallo en la persecución de [ROOT.getname]"
 RED_racing_sov.1.d: "Intentamos seguir a [ROOT.getname], pero lamentablemente fallamos."
 RED_racing_sov.1.t_1: "Fallo en la persecución de [ROOT.getname] por parte de [RED.getname]"
 RED_racing_sov.1.d_1: "[RED.getname] intentó perseguir a [ROOT.getname], pero no tuvo éxito."
 RED_racing_sov.1.a: "Entendido."
 RED_racing_sov.2.t: "Captura de [ROOT.getname]"
 RED_racing_sov.2.t_1: "[RED.getname] asegura a [ROOT.getname]"
 RED_racing_sov.2.d: "Hemos logrado traer a [ROOT.getname] de manera segura a nuestra academia."
 RED_racing_sov.2.d_1: "[RED.getname] rescató a [ROOT.getname] y lo evacuó a la academia."
 RED_racing_sov.2.a: "Perfecto."

# Eventos de Trotsky (tro_event)
 RED_tro_event.1.t: "¡Intento de asesinato contra Trotsky por parte de [SOV.getname]!"
 RED_tro_event.1.d: "Lamentablemente, nuestro asesor local 'Lev Trotsky' fue alguna vez uno de los principales líderes bolcheviques junto a Vladimir Lenin en la lucha contra el capitalismo. Sin embargo, durante la década de 1920, Trotsky perdió la lucha de poder contra el actual líder soviético, Iósif Stalin, y se vio forzado al exilio, terminando aquí.\n\nStalin, para consolidar su poder en la Unión Soviética, ha utilizado repetidamente sus redes de inteligencia para intentar asesinar a Trotsky.\n\nNo permitiremos que la 'degenerada nación obrera' se lleve la vida de nuestro camarada Trotsky. ¡Protegeremos su vida a toda costa!"
 RED_tro_event.1.a: "¡Refuercen la seguridad!"
 RED_tro_event.1_tt: "\nPuedes lograr la §GVictoria§! en el §YSnake Game§! completando los enfoques §Y$RED_advance_security$§! o §Y$RED_all_power_to_redwinter$§!."
 RED_tro_event.2.t: "Muerte de Trotsky"
 RED_tro_event.2.d: "No hemos logrado proteger a Trotsky. Sin embargo, su legado permanecerá en nuestra academia."
 RED_tro_event.2.a: "¿Y ahora qué haremos?"
 RED_tro_event.3.t: "Quejas de Cherino"
 RED_tro_event.3.d: "\"¿¡Por qué detuvieron la construcción de mi estatua!?\"\n\nRenkawa Cherino estaba frustrada porque Trotsky se oponía a su proyecto de idolatría. Sin embargo, conforme se estabilizaba la situación después del Gran Traslado, más y más miembros de la Secretaría apoyaban a Trotsky.\n\n\"Lo importante ahora es garantizar la vida del pueblo y los estudiantes, no fomentar cultos a la personalidad.\"\n\nCherino quería expulsarlo de inmediato, pero sabiendo que no podría ganarle con argumentos, miró a Tomoe en busca de apoyo. Sin embargo, Tomoe también la disuadió, diciendo: \"No deberías hacer eso, Cherino-chan.\"\n\nCherino se cruzó de brazos y se quedó refunfuñando."
 RED_tro_event.3.a: "Tal vez debería leer un libro..."
 RED_tro_event.4.t: "Frente de Liberación del Conocimiento"
 RED_tro_event.4.d: "Akiiizumi Momiji, una estudiante bibliotecaria, trabajaba como parte del Frente de Liberación del Conocimiento. Mientras realizaba su trabajo habitual, Cherino apareció repentinamente con varios miembros del Comité de Seguridad.\n\n\"¿Eh, la presidenta Cherino? ¿Por qué ha venido aquí de repente?\"\n\n\"¡Una buena pregunta! Vine aquí por una razón muy importante -\"\n\n\"No, no hace falta que lo diga. ¡Han venido a confiscar nuestros preciados libros, ¿verdad?!\"\n\n\"¡No vine a confiscar libros, vine a...!\"\n\n\"¡No permitiré que se lleven este libro! ¡Ni siquiera lo he terminado de leer!\"\n\n\"¡Espera! ¡No vine por eso! ¡Vine a obtener conocimiento!\"\n\n\"¿Eh...? ¿Qué clase de conocimiento necesita?\"\n\n\"¡Debo obtener más conocimiento que Trotsky! ¡Ese tipo es tan inteligente que no puedo derrotarlo en debates sobre comunismo!\"\n\n\"Ah... si es así, le recomendaría empezar por el 'Manifiesto Comunista' de Karl Marx. Es ideal para principiantes.\"\n\nCon un libro en mano, Cherino regresó a la Secretaría."
 RED_tro_event.4.a: "¡¿Qué rayos es todo esto?! ¡No entiendo nada!"
 RED_tro_event.5.t: "Establecimiento del Comité de Refugiados"
 RED_tro_event.5.d: "Gracias a la ayuda de Trotsky en resolver nuestros problemas, la gloriosa camarada Cherino ha decidido ayudar a salvar a sus compañeros perseguidos por los estalinistas en todo el mundo. Bajo órdenes directas de Cherino, se ha creado rápidamente un comité para traer a los trotskistas exiliados a un lugar seguro en Red Winter."
 RED_tro_event.5.a: "¡Vamos a rescatarlos!"
 RED_tro_event.5_tt: "\n§gPodrás enviar agentes a países donde se hayan exiliado trotskistas para rescatarlos.§!"
 RED_tro_event.6.t: "Nombramiento de la República Autónoma"
 RED_tro_event.6.d: "\"El nombre 'República Autónoma' suena muy aburrido.\"\n\nCherino se quejó ante Tomoe, quien sonrió y fue a transmitir las quejas de Cherino al comité correspondiente."
 RED_tro_event.6.a: "¡Inaceptable!"
 RED_tro_event.6.b: "Bueno, si es la opinión de Cherino..."
 RED_tro_event.7.t: "Revolución Mundial"
 RED_tro_event.7.d: "¡Ya no podemos retrasarlo más! Hemos decidido extender los ideales revolucionarios del socialismo por todo el mundo. Desde el Pacífico hasta el Atlántico, de Asia a Oceanía, del Polo Norte al Polo Sur: ¡haremos que la bandera roja ondee en todas las fábricas y colinas!"
 RED_tro_event.7.a: "¡Viva la revolución mundial!"
 RED_tro_event.7_tt: "\n§gSi estamos en guerra, algunos de los efectos negativos se reducirán a la mitad.§!"
 RED_tro_event.8.t: "Tratamiento de la Secretaría"
 RED_tro_event.8.d: "Mientras el equilibrio de poder no se haya resuelto completamente, no podemos tratar a Cherino ni a la Secretaría como enemigos. Sin embargo, eliminar a un rival político no sería necesariamente un error, basándonos en los precedentes estalinistas."
 RED_tro_event.8.a: "Vigila cuidadosamente a la Secretaría."
 RED_tro_event.8.b: "¡Desmantelemos la Secretaría ahora!"
 RED_tro_event.9.t: "Reasignación Forzada de Trabajadores Migrantes"
 RED_tro_event.9.d: "Para alcanzar nuestros ambiciosos objetivos industriales, es necesario movilizar trabajadores de diversas regiones. Los trabajadores migrantes serán asignados a proyectos de ciudades planificadas y expansión de infraestructura industrial."
 RED_tro_event.9.a: "Es una buena idea."

# Eventos Genéricos (RED_generic)
 RED_generic.1.t: "Solicitud de Inversión de [RED.getname]"
 RED_generic.1.d: "[RED.getname] nos ha solicitado adquirir sus 'Bonos de Reconstrucción'. Cuando expire el plazo, podremos recuperar la inversión con intereses."
 RED_generic.1.a: "Un buen trato."
 RED_generic.1.b: "Estamos ocupados por ahora."
 RED_generic.2.t: "Aceptación de [FROM.getname]"
 RED_generic.2.d: "[FROM.getname] ha aceptado adquirir nuestros bonos."
 RED_generic.2.a: "Agradecido."
 RED_generic.3.t: "Rechazo de [FROM.getname]"
 RED_generic.3.d: "[FROM.getname] ha rechazado nuestra solicitud."
 RED_generic.3.a: "Qué lástima."
 RED_generic.4.t: "Ajuste en la Venta de Bonos Domésticos"
 RED_generic.4.d: "Los capitalistas y pequeños burgueses locales están intentando adquirir bonos."
 RED_generic.4.a: "Permitamos solo compras limitadas."
 RED_generic.4.b: "Regulémoslos adecuadamente."
 RED_generic.4.c: "Déjalos actuar libremente."
 RED_investment_tt_1: "Fábricas civiles proporcionadas: §G+2§!"
 RED_investment_tt_2: "Fábricas civiles proporcionadas: §G+4§!"
 RED_investment_tt_3: "Fábricas civiles proporcionadas: §G+6§!"
 RED_generic.5.t: "Expiración de los Bonos de Reconstrucción"
 RED_generic.5.d: "El plazo de los bonos ha expirado. Podemos reembolsarlos o extender su duración."
 RED_generic.5.a: "Reembolsemos."
 RED_generic.5.b: "Extendamos el plazo."
 RED_generic.6.t: "Reembolso de Bonos por parte de [RED.getname]"
 RED_generic.6.d: "[RED.getname] ha reembolsado nuestros bonos con intereses."
 RED_generic.6.a: "Excelente."
 RED_generic.7.t: "Prórroga del Reembolso de Bonos por parte de [RED.getname]"
 RED_generic.7.d: "[RED.getname] ha solicitado posponer el reembolso de los bonos."
 RED_generic.7.a: "¿Acaso es una estafa?"
 RED_generic.8.t: "Negativa de Reembolso de Bonos por parte de [RED.getname]"
 RED_generic.8.d: "[RED.getname] ha anunciado que no reembolsará los bonos adquiridos."
 RED_generic.8.a: "¡Maldición, nos estafaron!"
 RED_generic.9.t: "Colapso del Crédito"
 RED_generic.9.d: "Tras nuestra negativa a reembolsar los bonos, nuestra credibilidad se ha desplomado. El pánico paraliza la economía, las finanzas y la industria. ¡Necesitamos políticas 'extremas' e 'inmediatas' para sobrevivir!"
 RED_generic.9.a: "¡Maldita sea!"
 RED_generic.9_tt: "\n¡Si no completas el enfoque §Y$RED_unlimited_inflation$§! o §Y$RED_currency_suspension$§! en §Y60§! días, la economía colapsará completamente!"
 RED_generic.10.t: "Bonos de Reconstrucción"
 RED_generic.10.d: "La situación de la academia es, literalmente, catastrófica. Superpoblación, escasez de alimentos, falta de bienes de consumo, destrucción de infraestructuras y parálisis administrativa hacen obvio que no podemos reconstruirnos solos.\n\nDebemos aplicar de forma flexible los principios del socialismo. Aceptando inversiones externas, reconstruiremos, cultivaremos y desarrollaremos nuestra industria hasta lograr la autosuficiencia.\n\n...Pagar las deudas es un problema para el futuro."
 RED_generic.10.a: "¡Hacia la reconstrucción económica!"
 RED_generic.10_tt: "En §Y365§! días podríamos tener que devolver el §Rdoble§! de las fábricas civiles recibidas, durante §Y365§! días."
 RED_generic.11.t: "Técnicos Locales"
 RED_generic.11.d: "Es evidente que la academia carece de capacidad para restaurar su propia industria tras el Gran Traslado. Necesitamos, por tanto, incorporar técnicos locales e incluso capitalistas como asesores para acelerar la recuperación industrial."
 RED_generic.11.a: "No hay otra opción."
 RED_generic.12.t: "Política Económica Alternativa"
 RED_generic.12.d: "La colectivización y nacionalización radicales no resolverán la crisis actual. Requerimos una 'Política Económica Alternativa' (PEA) que modifique temporalmente nuestra planificación socialista, incorporando elementos de mercado para fomentar el crecimiento de medianas y pequeñas empresas y construir una base industrial sólida."
 RED_generic.12.a: "No es revisionismo, es una medida de emergencia."
 RED_generic.12_tt: "El objetivo de la §YPrimera Política Económica Alternativa§! es superar §Y40§! fábricas civiles."
 RED_generic.12_tt_1: "El objetivo de la §YSegunda Política Económica Alternativa§! es superar §Y80§! fábricas civiles."
 RED_generic.13.t: "Disolución del Comité de Defensa"
 RED_generic.13.d: "Después de las campañas hacia Suecia, Dinamarca y Noruega, el '[RE4.Getname]' ha cesado su resistencia en [148.GetCapitalVictoryPointName] y decidió disolverse. Nuestra aventura escandinava termina aquí."
 RED_generic.13.a: "Buen trabajo."
 RED_generic.15.t: "Evaluación de la Primera PEA"
 RED_generic.15.d: "Una sala de reuniones moderadamente grande se llenó con comisionados del pueblo y expertos económicos para evaluar el éxito de la Política Económica Alternativa (PEA). Mientras los técnicos locales la elogiaban, los miembros de origen Kibotos mostraban escepticismo. La decisión tendrá un impacto significativo en nuestra política económica futura."
 RED_generic.15.a: "¡La PEA fue un éxito!"
 RED_generic.15.b: "Debemos detener este experimento de locura."
 RED_generic.15.c: "Los resultados son tibios, hay que seguir observando."
 RED_generic.15.a_tt: "§YLa PEA es apoyada exitosamente§! debido a haber superado §G40§! fábricas civiles."
 RED_generic.15.b_tt: "§gAbandonaremos la PEA y regresaremos a una economía planificada.§!\n\nSe desbloquearán nuevos enfoques industriales centrados en planificación."
 RED_generic.15.c_tt: "§YEl apoyo a la PEA es débil§! ya que no superamos §R40§! fábricas civiles."
 RED_throw_aep_away: "Transición de §YPEA§! a §YEconomía Planificada§!"
 RED_generic.16.t: "Objetivo Cumplido Anticipadamente"
 RED_generic.16.d: "Hemos logrado los objetivos de la PEA antes de lo previsto."
 RED_generic.16.a: "Impresionante."
 RED_generic.18.t: "Política Exterior"
 RED_generic.18.d: "Mientras nos enfocábamos en la política interna, el mundo ha cambiado rápidamente. Es hora de volver nuestra atención hacia el exterior."
 RED_generic.18.a: "Tomemos decisiones pragmáticas."
 RED_generic.18.b: "Defendamos agresivamente nuestra soberanía."
 RED_generic.19.t: "Planificación Industrial"
 RED_generic.19.d: "Una industria planificada opera con una eficiencia inigualable en comparación con el mercado. Pero para implementarla aquí, en este mundo capitalista, necesitamos llevar a cabo una transición social completa junto con la planificación económica. Aunque la administración aún es débil, hemos preparado un plan a diez años enfocado también en el fortalecimiento de la industria militar."
 RED_generic.19.a: "Debemos ajustar la economía con calma."
 RED_generic.20.t: "Derrota en el Conflicto Fronterizo"
 RED_generic.20.d: "Hemos sido derrotados en el conflicto fronterizo."
 RED_generic.20.a: "Maldita sea."
 RED_generic.20.b: "¡Si perdimos el conflicto, ganaremos la guerra!"
 RED_generic.21.t: "Victoria en el Conflicto Fronterizo"
 RED_generic.21.d: "Hemos triunfado en el conflicto fronterizo."
 RED_generic.21.a: "Excelente."
 RED_generic.22.t: "Apoyo de [RED.getname]"
 RED_generic.22.d: "El apoyo de [RED.getadjective] ha llegado a nosotros."
 RED_generic.22.a: "Agradecidos."
 RED_generic.23.t: "Propuesta de [RED.getname]"
 RED_generic.23.d: "Hemos recibido una propuesta de Red Winter para importar trabajadores de bajo salario."
 RED_generic.23.a: "Es un buen trato."
 RED_generic.23.b: "Parece desventajoso para nosotros."
 RED_generic.24.d: "Hemos recibido una propuesta de Red Winter para intercambiar recursos y tecnología."
 RED_generic.25.t:0 "¿Qué es la Administración Militar?"
 RED_generic.25.d:0 " La Administración Militar es un organismo de gobierno militar establecido bajo la Secretaría tras la Gran Transición, cuando Red Winter avanzó hacia el oeste en Noruega y lanzó la ofensiva del norte contra las fuerzas remanentes de Suecia. Aunque formalmente obedecen las órdenes de la Secretaría, en sus zonas de jurisdicción ejercen una autoridad que no está completamente controlada.\n\n Sin embargo, con el colapso del sistema administrativo, no nos queda más remedio que invertir enormes esfuerzos para someterlos a control.\n\n Debido a la distancia geográfica respecto a la academia, el suministro material hacia las Administraciones Militares es limitado, lo que ha provocado un fuerte auge de la resistencia democrática entre la población local en los territorios ocupados. A medida que aumenta el apoyo a la democracia, esta tendencia se intensifica, lo que deriva en un incremento de la inestabilidad de las Administraciones Militares. Si dicha inestabilidad alcanza un nivel crítico, las Administraciones Militares colapsarán y la región escapará del control de nuestra academia. Por ello, debemos reprimir el apoyo a la democracia dentro de las Administraciones Militares.\n\n No obstante, la inestabilidad de las Administraciones Militares puede reducirse mediante decisiones o enfoques que empleen equipamiento y capacidad de mando, como '$RED_enlarge_secret_police$', '$RED_enemy_of_class$' y '$RED_welcome_immigrate$'. Para disolver definitivamente las Administraciones Militares, podemos convertirlas en repúblicas autónomas mediante el enfoque '$RED_enticing_locals$', integrarlas posteriormente a través del enfoque '$RED_welcome_immigrate$', o bien anexarlas mediante el enfoque '$RED_depress_locals$' y asimilarlas gradualmente."
 RED_generic.25.a:0 "¡Bien, lo entendí perfectamente!"
 RED_generic.26.t:0 "El rumbo de la industrialización en las zonas bajo gobierno militar"
 RED_generic.26.d:0 "Debemos impulsar la industrialización en las regiones anteriormente administradas por las Administraciones Militares. Sin embargo, nuestra capacidad administrativa sigue siendo insuficiente, por lo que podemos apoyar a las industrias locales para que desarrollen su propia industrialización de manera autónoma. Por otro lado, si adoptamos un modelo de planificación económica centralizada, podremos ejercer un control directo sobre la industria en su conjunto."
 RED_generic.26.a:0 "Aprovechemos la industria local."
 RED_generic.26.b:0 "¡La capacidad administrativa se puede compensar como sea!"
 RED_generic.27.t:0 "Levantamiento del estado de guerra"
 RED_generic.27.d:0 "El estado de guerra, proclamado durante aproximadamente dos meses, exigía el control de la Secretaría sobre casi todos los sectores de la academia y de las regiones locales. Esto impuso una carga excesiva a los burócratas individuales y consumió en exceso nuestra capacidad administrativa. Ahora que la ofensiva occidental ha concluido, siguiendo la propuesta de la camarada directora de la Secretaría, Cherino, la Secretaría ha decidido levantar el estado de guerra, lo que constituirá la primera medida en el proceso de restauración administrativa que se prevé para el futuro."
 RED_generic.27.a:0 "¡Ya no queda ninguna amenaza significativa!"
 RED_generic.28.t:0 "La amenaza de la huelga general"
 RED_generic.28.d:0 "No solo las Administraciones Militares, sino también los burócratas de Red Winter que han sido desplegados para reemplazar a los funcionarios locales, se han mostrado incompetentes, ineficientes y además explotadores. El centro carece de la capacidad para controlarlos, y como resultado, el movimiento obrero local ha evolucionado más allá de la negociación y la lucha económica, desarrollándose hacia una amplia coordinación interindustrial y un movimiento antisistema. Sin disolverlos de manera decisiva, será difícil esperar una administración estable de la academia."
 RED_generic.28.a:0 "Negociemos un compromiso razonable con los sindicatos."
 RED_generic.28.b:0 "Reprímanlos."

 RED_reading.1.t: "'El Manifiesto Comunista'"
 RED_reading.1.d: "'Un espectro ronda Europa: el espectro del comunismo.'\n\n El 'Manifiesto Comunista', que comienza con esta frase cargada de significado, es un folleto escrito por Karl Marx y Friedrich Engels en febrero de 1848. Contiene los principios fundamentales del pensamiento comunista, como lo resume la frase 'Toda la historia de la humanidad es la historia de la lucha de clases', y ofrece un análisis de esta doctrina.\n\n \"Maldición, ¡no entiendo nada!\"\n\n Cherino decidió buscar a Trotsky para pedirle una explicación. Trotsky le habló sobre la sociedad industrial del siglo XIX y la Ilustración, poniéndole en contexto histórico.\n\n \"Así surgieron dos clases: la burguesía y el proletariado.\"\n\n El 'Manifiesto Comunista' explica que la historia avanza a través de la lucha de clases, un conflicto entre clases dominantes y oprimidas, ejemplificado en relaciones como las de hombres libres y esclavos, nobles y plebeyos, o señores y siervos. En la sociedad industrial, estas clases principales son la burguesía y el proletariado. La burguesía, que creció con la Revolución Industrial, posee los medios de producción (fábricas, tierras, maquinaria) y detenta el poder económico y político; es la clase dominante. Por otro lado, el proletariado sólo posee su fuerza de trabajo, que debe vender para sobrevivir, siendo explotado por la burguesía. La contradicción entre ambas clases genera desigualdad y crisis económicas internas al capitalismo, lo que lleva a la necesidad de una revolución proletaria.\n\n \"Además, Marx no se limitó a analizar la sociedad, también propuso las tareas de los comunistas.\"\n\n Marx enfatiza en este folleto que la abolición de la propiedad privada es el deber de los comunistas, y resalta que su objetivo final es la construcción de una sociedad sin clases.\n\n \"Todavía me duele la cabeza, ¡pero creo que ya lo entendí más o menos!\""
 RED_reading.1.a: "'¡Proletarios del mundo, uníos!'"
 RED_reading.2.t: "¿Qué libro debería leer?"
 RED_reading.2.d: "Cherino decidió visitar el Frente de Liberación del Conocimiento para escoger un libro."
 RED_reading.2.a: "Un libro de Marx"
 RED_reading.2_tt_marx: "\n§RLibro(s) restante(s) de Karl Marx: §Y[?RED_read_marx]§!."
 RED_reading.2.b: "Un libro de Kautsky"
 RED_reading.2_tt_kautsky: "\n§RHas leído §Ytodos§! los libros de §RKarl Marx§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Karl Kautsky: §Y[?RED_read_kautsky]§!."
 RED_reading.2.c: "Un libro de Lenin"
 RED_reading.2_tt_lenin: "\n§RHas leído §Ytodos§! los libros de §RKarl Marx§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Vladimir Lenin: §Y[?RED_read_lenin]§!."
 RED_reading.2.e: "Un libro de Luxemburgo"
 RED_reading.2_tt_luxembourg: "\n§RHas leído §Ytodos§! los libros de §RKarl Marx§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Rosa Luxemburgo: §Y[?RED_read_luxembourg]§!."
 RED_reading.2.f: "Un libro de Trotsky"
 RED_reading.2_tt_trotsky: "\n§RHas leído §Ytodos§! los libros de §RVladimir Lenin§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Lev Trotsky: §Y[?RED_read_trotsky]§!."
 RED_reading.2.g: "Un libro de Bujarin"
 RED_reading.2_tt_bukharin: "\n§RHas leído §Ytodos§! los libros de §RVladimir Lenin§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Nikolái Bujarin: §Y[?RED_read_bukharin]§!."
 RED_reading.2.h: "Un libro de Zinóviev"
 RED_reading.2_tt_zinoviev: "\n§RHas leído §Ytodos§! los libros de §RVladimir Lenin§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Grigori Zinóviev: §Y[?RED_read_zinoviev]§!."
 RED_reading.2.i: "Un libro de Stalin"
 RED_reading.2_tt_stalin: "\n§RHas leído §Ytodos§! los libros de §RLev Trotsky§!, §RNikolái Bujarin§! o §RGrigori Zinóviev§!, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Iósif Stalin: §Y[?RED_read_stalin]§!."
 RED_reading.2.j: "¡No hay más opciones!"
 RED_reading.2_tt_no: "\nHas leído todos los libros disponibles actualmente.\n\n...Sin embargo, puede que haya un marxista destacado en §Y@ITA [ITA.getname]§!.\n\n§t¡Enviemos un agente a investigar en Italia!§!"
 RED_reading.2.k: "Un libro de Gramsci"
 RED_reading.2_tt_gramsci: "\n§RHas leído §Ytodos§! los demás libros, desbloqueando esta opción.\n\n§RLibro(s) restante(s) de Antonio Gramsci: §Y[?RED_read_gramsci]§!.\n\n§gEsta será la última lectura.§!"
 RED_reading.3.t: "'El Capital'"
 RED_reading.3.d: "Cherino necesitó mucho valor. La sola visión del grueso volumen y el aura de dificultad que emanaba de aquellas tres letras bastaron para que su cuerpo entero se resistiera. Sin embargo, para su mala suerte, Momiji la descubrió en ese momento.\n\n \"¡Vaya...! ¿En serio planea leer el difícil 'El Capital'? ¡Es impresionante!\"\n\n Cherino pensó que, si decía que no quería leerlo, perdería autoridad como presidenta del consejo estudiantil. Así que, a regañadientes, terminó tomando el pesado libro en sus manos.\n\n No podía permitirse dormir la siesta. El plazo de devolución del Frente de Liberación del Conocimiento era de dos semanas, y si leía tan lentamente como antes, se le prohibiría la entrada. A medida que avanzaba, Cherino se daba cuenta de que 'El Capital' era aún más difícil que el 'Manifiesto Comunista', así que decidió pedir ayuda nuevamente a Lev Trotsky.\n\n Trotsky le explicó usando el ejemplo de los pasteles de pez (taiyaki) que se vendían en la tienda del instituto. \"Camarada, ¿sabe por qué el taiyaki debe comprarse con dinero?\"\n\n \"¿Porque es delicioso?\"\n\n \"También, pero la razón fundamental es que el taiyaki es un producto hecho con trabajo. Marx pensaba que el 'valor de uso' y el 'valor de cambio' determinan el valor de una mercancía.\"\n\n Aunque Cherino asintió, su expresión seguía siendo complicada. Trotsky continuó:\n\n \"¿Qué pasaría si disminuyera el número de personas que fabrican taiyakis en el instituto?\"\n\n \"¡Habría menos taiyakis, así que subirían de precio!\"\n\n \"¡Exactamente! Pero en el capitalismo, el valor no se determina solo por oferta y demanda. También influye el 'tiempo de trabajo socialmente necesario' para fabricar un producto.\"\n\n Cherino, con los brazos cruzados, meditó. \"Entonces, ¿los capitalistas intentarían hacer que los trabajadores trabajen más rápido para aumentar sus ganancias?\"\n\n Trotsky sonrió. \"Camarada, está entendiendo muy bien.\"\n\n Cherino sintió curiosidad sobre cómo se concretaba esa explotación capitalista. Trotsky le explicó pacientemente: \"Supongamos que un trabajador produce taiyakis durante 10 horas al día. Sin embargo, con solo 5 horas de trabajo podría generar el valor equivalente a su salario de subsistencia.\"\n\n \"¿Entonces las otras 5 horas...?\"\n\n \"Van directamente al bolsillo del capitalista. Eso es lo que llamamos 'plusvalía'.\"\n\n Cherino apretó los puños. \"¡Eso es injusto! ¡El trabajador trabaja más, pero su ganancia no aumenta!\"\n\n Trotsky asintió. \"Por eso hicimos la revolución. Solo cuando los trabajadores controlen directamente los medios de producción será posible una verdadera sociedad igualitaria.\"\n\n Unos días después, en la reunión del secretariado, Cherino presentó 'El Capital' a sus colegas y proclamó la necesidad de una 'revolución de los taiyakis'."
 RED_reading.3.a: "Los miembros del secretariado sentían que les dolía la cabeza."

 RED_marina_event.1.t: "Marina Exhausta - 1"
 RED_marina_event.1.d: "\"...\"\n\n\"...¡Comisaria de Seguridad, despierte!\"\n\n En plena reunión regular del secretariado, Ikekura Marina, que se había quedado dormida, se despertó sobresaltada. La secretaria general Cherino le llamó la atención y reanudó la discusión sobre el tema anterior.\n\n Mientras Marina intentaba prestar atención nuevamente, Cherino proponía, con el apoyo de Tomoe, incorporar a un ridículo personaje mascota llamado 'Feroro' a la academia. En lugar de intervenir, Marina dejó que su visión nublada se apoderara de ella."
 RED_marina_event.1.a: "¿Deberíamos sugerirle que tome un descanso?"
 RED_marina_event.2.t: "Marina Exhausta - 2"
 RED_marina_event.2.d: "\"Mi opinión sigue siendo firme. Agradezco sinceramente la intención del camarada Mólotov de apoyar a la Federación Roja de Invierno, pero aún somos capaces de valernos por nosotros mismos.\"\n\n \"Si su opinión cambia, no dude en contactarnos. La Federación está lista para recibirla con los brazos abiertos.\"\n\n A las tres de la madrugada, extenuada, Marina regresó a su alojamiento y cayó rendida en su cama."
 RED_marina_event.2.a: "...No quiero ir a la reunión de mañana."
 RED_marina_event.3.t: "Marina Exhausta - 3"
 RED_marina_event.3.d: "\"Así, la Revolución de Octubre se expandió en la Guerra Civil Roja y Blanca. Yo mismo organicé el Ejército Rojo Campesino... ...y para evitar el bonapartismo, se requería la plena realización del poder popular...\"\n\n Un anciano visitó el secretariado para dar una 'conferencia'. Muchos de los miembros escuchaban atentamente, pero Marina, aunque militarmente y teóricamente competente, temía que aquel veterano desplazara su posición. No podía quitarse de la cabeza la idea de que Tomoe lo había traído para deponerla. Mientras su mente se llenaba de preocupaciones, apenas prestaba atención al discurso del anciano, aunque alcanzó a oír algunas críticas veladas a las medidas autoritarias que el Comité de Seguridad había estado aplicando."
 RED_marina_event.3.a: "Ahora que lo pienso, ¿no había mencionado Mólotov algo sobre este hombre?"
 RED_marina_event.4.t: "Iván Kupala"
 RED_marina_event.4.d: "El festival de Iván Kupala, celebrado tradicionalmente en verano, tuvo lugar sobre la devastada tierra de la Federación Académica tras la Gran Ruptura. Aunque todos habían sufrido mucho, al menos por hoy dejaron sus penas de lado y disfrutaron del festival."
 RED_marina_event.4.a: "Después de la celebración, volveremos al trabajo."
 RED_marina_event.5.t: "Marina Exhausta - 4"
 RED_marina_event.5.d: "\"Eso que ha dicho es un insulto intolerable hacia la Secretaria General y hacia nuestra Federación Académica. Consideraré que no he oído nada.\"\n\n \"Sin embargo, esa visión insurreccional y esa administración autoritaria inevitablemente corromperán la revolución. Hay que extirpar de raíz a quien encabeza tales conspiraciones antisoviéticas, incluso si ello requiere el uso de la fuerza. Solo así avanzaremos hacia el verdadero socialismo.\"\n\n Marina cerró la conversación, dejando claro que no habría más tratos entre ellos."
 RED_marina_event.5.a: "\"No nos volveremos a ver.\""
 RED_marina_event.6.t: "Marina Exhausta - 5"
 RED_marina_event.6.d: "\"¿Y qué hay de malo en detener e interrogar a quienes violan las reglas?\"\n\n Marina replicó con voz elevada.\n\n Trotsky le pidió que, para consolidar una dictadura proletaria genuina, tratara a las masas populares como sujetos de apoyo mutuo y no como objetos de control.\n\n \"Maldita sea, solo propones ideales inalcanzables. ¿Y si realmente contabas con el apoyo del pueblo, por qué fracasó tu ofensiva occidental? ¡Tú también eres un incompetente...!\"\n\n \"Camarada Marina, ¡muestre respeto al Comisario del Pueblo local!\"\n\n Cuando Tomoe la interrumpió de forma insolente, Marina, alegando encontrarse indispuesta, abandonó la sala."
 RED_marina_event.6.a: "'Tomoe definitivamente está tramando algo.'"
 RED_marina_event.7.t: "Iván Kupala"
 RED_marina_event.7.d: "Aunque se debatía la remoción de las estatuas de Cherino como parte de las medidas anti-autoritarismo, varios bustos seguían alineados en los pasillos del secretariado. Marina, molesta por la aparente dependencia de Cherino hacia Trotsky, caminaba absorta en sus pensamientos, cuando un ruido sordo llamó su atención.\n\n \"Maldición, rompí un busto.\""
 RED_marina_event.7.a: "'...'" 
 RED_marina_event.8.t: "Verano - 1"
 RED_marina_event.8.d: "El sol no lograba calentar completamente las tierras de la Federación Roja de Invierno, pero su tibieza era suficiente para relajar los ánimos. Gracias al festival, las calles rebosaban de estudiantes de la academia y locales que teñían el bullicioso centro de sus propios colores.\n\n \"Pero, camarada Presidenta, si este plan fracasa, Trotsky podría usarlo como pretexto para desmantelar tanto al Comité de Seguridad como a la Guardia del Secretariado.\"\n\n \"Eso solo refuerza la justificación de nuestra acción. Existe una gran fuerza externa que desea ver a Trotsky al mando. Si capturamos a Trotsky y declaramos una 'revolución militar' contra su opresión y su golpe, nuestra causa brillará aún más. ¡Sientan orgullo! ¡Opongámonos firmemente a la injusticia y unámonos con valor en favor de la rectitud!\"\n\n Durante unos segundos, el sótano quedó en silencio, hasta estallar en vítores y aplausos de los miembros de la seguridad."
 RED_marina_event.8.a: "'El río ya ha desbordado...'"
 RED_marina_event.9.t: "Verano - 2"
 RED_marina_event.9.d: "Bajo la tenue luz de la luna que dividía el mundo entre sombra y resplandor, la ciudad no conseguía conciliar el sueño. El eco de pasos apresurados y disparos repetidos rompía la tranquilidad nocturna.\n\n Las milicias populares, formadas espontáneamente, carecían de información sobre el centro de mando, mientras que la Guardia del Secretariado arrestaba al Alto Mando del Ejército de Invierno bajo cargos de contrarrevolución.\n\n Al amanecer, hacia las 6:00, tras 10 minutos de tiroteos en la sede del secretariado, se declaró la ley marcial en toda Chernograd. Según la ley especial de tiempos de guerra, el Comité de Seguridad formó un Tribunal de Guerra, que de inmediato emitió órdenes de arresto contra altos funcionarios.\n\n Aunque Trotsky, Cherino y otros dirigentes de alto rango lograron escapar, la caza a gran escala continuó hasta las 11:00. Sin embargo, solo se descubrió que ya no estaban en la ciudad. Ante ello, el Tribunal de Guerra convocó una sesión plenaria."
 RED_marina_event.9.a: "Primero, declaremos la revolución militar."
 RED_wartime_judicial_commission: "Tribunal de Guerra"
 RED_marina_event.10.t: "Verano - 3"
 RED_marina_event.10.d: "La ocupación del secretariado central mediante el uso de la Guardia y el Comité de Seguridad fue exitosa, pero no se logró extender el control sobre las zonas suburbanas y rurales. El antiguo gobierno cayó, y uno nuevo estaba en proceso de formación. Dentro de este vacío de poder, cualquier cosa podría surgir..."
 RED_marina_event.10.a: "¡Maldición, nos precipitamos demasiado!"
 RED_marina_event.11.t: "Sublevación de los Servicios Auxiliares"
 RED_marina_event.11.d: "El colapso administrativo provocó un levantamiento por parte de las fuerzas opositoras."
 RED_marina_event.11.a: "¡Maldita sea!"
 RED_marina_event.12.t: "Levantamiento del Frente de Liberación del Conocimiento"
 RED_marina_event.13.t: "Independencia del Departamento de Publicaciones"
 RED_marina_event.14.t: "Sublevación en el Edificio Antiguo"
 RED_marina_event.15.t: "Levantamiento de Trotsky"
 RED_marina_event.16.t: "Independencia de SAFMI"
 RED_marina_event.17.t: "Reconstrucción del Secretariado"


 RED_event.1.t:0 "El ultimátum final de [FROM.GetName]"
 RED_event.1.d:0 "[FROM.GetName] nos ha enviado un ultimátum final. Exigen la transferencia del control de Gotland y han declarado que no dudarán en recurrir a la guerra si no aceptamos.\n\n¿Qué debemos hacer?"
 RED_event.1.a:0 "Aceptemos sus exigencias"
 RED_event.1.b:0 "Eso es inaceptable"
 RED_event.2.t:0 "[FROM.GetName] acepta nuestras exigencias"
 RED_event.2.d:0 "[FROM.GetName] finalmente cedió ante nuestra presión y decidió transferirnos el control de Gotland."
 RED_event.2.a:0 "Tomaron una decisión sensata"
 RED_event.3.t:0 "[FROM.GetName] rechaza nuestras exigencias"
 RED_event.3.d:0 "A pesar de nuestras amenazas, [FROM.GetName] ha declarado que defenderá Gotland hasta el final."
 RED_event.3.a:0 "Han tomado una decisión estúpida"
 RED_event.4.t:0 "La resolución del sistema de gobierno militar"
 RED_event.4.d:0 "El sistema de gobierno militar establecido por la Academia Federal de Red Winter tras la guerra fue eficaz para el control local, pero ahora debemos enfrentar problemas como comandantes que conspiran con los rebeldes, la corrupción dentro del ejército y una resistencia cada vez más intensa.\n\nPor el futuro de la Academia Federal, abolir el sistema de gobierno militar que no coincide con nuestra ideología y, más aún, integrar toda Escandinavia a la Academia Federal, será un medio indispensable."
 RED_event.4.a:0 "En efecto, la Administración Militar debe ser abolida."
 RED_event.5.t:0 "El equilibrio de poder dentro de la Secretaría"
 RED_event.5.d:0 "Lev Trotski, revolucionario bolchevique de origen ruso, está ganando rápidamente popularidad entre los estudiantes y reuniendo apoyo. El liderazgo unificado de Cherino comienza a resquebrajarse, y Trotski se acerca al centro del poder."
 RED_event.5.a:0 "Esto no es buena señal."
 RED_event.6.t:0 "El destino del Departamento Editorial"
 RED_event.6.d:0 " \"La propuesta de la camarada Cherino no es más que hipocresía: al igual que los demócratas burgueses, llaman ‘libertad’ al laissez-faire, permitiendo sin restricciones la propaganda de fuerzas contrarrevolucionarias externas y la difusión de rumores no verificados, fingiendo preocuparse por el pueblo. Le solicito que retire dicha propuesta.\"\n\nLa voz firme de Trotski llenó la sala de conferencias.\n\n \"Si lo dices así, Trotski, ¿no podría afirmarse también que tú mismo, preocupado por la reducción del departamento editorial donde trabajan muchos de tus partidarios y por la pérdida de tu base política, estás distorsionando mis intenciones y mostrando los síntomas de esa ‘enfermedad infantil’ pequeñoburguesa? ¡Es evidente que las directrices de censura y el alcance del departamento editorial han perdido hace tiempo su propósito de ‘preservar la naturaleza revolucionaria’!\"\n\nTrotski respondió acusando a Cherino de desviarse del debate público y de incurrir en una falacia ad hominem."
 RED_event.6.a:0 "La postura de Cherino prevaleció."
 RED_event.6.b:0 "Trotski obtuvo el apoyo del comité permanente."
 RED_edit_disagree:0 "Cherino ganó el debate."
 RED_edit_disagree_1:0 "Trotski ganó el debate."
 RED_event.7.t:0 "[FROM.GetName] busca una alianza"
 RED_event.7.d:0 "[FROM.GetName] ha acudido a nosotros afirmando que busca una alianza. Están esperando nuestra decisión."
 RED_event.7.a:0 "Bien. Unámonos a ellos."
 RED_event.7.b:0 "No, no los necesitamos."
 RED_event.8.t:0 "[FROM.GetName] acepta nuestra propuesta"
 RED_event.8.d:0 "Han aceptado nuestra propuesta."
 RED_event.8.a:0 "Excelente."
 RED_event.9.t:0 "[FROM.GetName] rechaza nuestra propuesta"
 RED_event.9.d:0 "Han rechazado nuestra propuesta."
 RED_event.9.a:0 "Qué lástima."
 RED_event.10.t:0 "Solicitud de paso de [RED.GetName]"
 RED_event.10.d:0 "[RED.GetName] ha solicitado derechos de paso militar."
 RED_event.10.a:0 "No tenemos otra opción."
 RED_event.10.b:0 "Rechácenlo."
 RED_event.11.t:0 "Propuesta de pacto de no agresión de [RED.GetName]"
 RED_event.11.d:0 "[RED.GetName] ha propuesto la firma de un pacto de no agresión. Frente a la amenaza de [SOV.GetAdjective], esto podría resultar útil."
 RED_event.11.a:0 "Es una buena propuesta."
 RED_event.11.b:0 "No negociaremos con ellos."
 RED_event.12.t:0 "[FROM.GetName] acepta"
 RED_event.12.d:0 "[FROM.GetName] ha aceptado nuestra propuesta."
 RED_event.12.a:0 "Perfecto."
 RED_event.13.t:0 "[FROM.GetName] rechaza"
 RED_event.13.d:0 "[FROM.GetName] ha rechazado nuestra propuesta."
 RED_event.13.a:0 "Entendido."
 RED_event.14.t:0 "¡Trotskistas en fuga!"
 RED_event.14.d:0 "Muchos intelectuales, burócratas y activistas dentro de la Unión Soviética que simpatizan con la causa del camarada Trotski han abandonado la URSS y entrado en el exilio al enterarse de que Trotski reanuda sus actividades en [RED.GetName]. Si la fortuna nos acompaña, la camarada Cherino podrá reunirlos bajo su liderazgo."
 RED_event.14.a:0 "La situación está cambiando."


# Evento (Marina)

 RED_event.15_tt: "\nSi completas §Y[?RED_prepare]§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el espíritu nacional de menor efecto."
 RED_event.15_tt1: "\nSi completas al menos §G1§! enfoque de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el segundo espíritu nacional de menor efecto."
 RED_event.15_tt2: "\nSi completas al menos §G4§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el tercer espíritu nacional de menor efecto."
 RED_event.15_tt3: "\nSi completas al menos §G7§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás un espíritu nacional de efecto medio-bajo."
 RED_event.15_tt4: "\nSi completas al menos §G10§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás un espíritu nacional de efecto medio."
 RED_event.15_tt5: "\nSi completas al menos §G16§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás un espíritu nacional de efecto medio-alto."
 RED_event.15_tt6: "\nSi completas al menos §G21§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el tercer espíritu nacional de mayor efecto."
 RED_event.15_tt7: "\nSi completas al menos §G27§! enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el segundo espíritu nacional de mayor efecto."
 RED_event.15_tt8: "\nSi completas §Gtodos§! los enfoques de entre §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§! y §Y$RED_redwinter_moustache_airport$§!, obtendrás el espíritu nacional de mayor efecto."
 RED_event.15.t: "La Guerra Revolucionaria"
 RED_event.15.d: "Era inevitable. Antes de que la llama de la revolución que brotó en Escandinavia envuelva al mundo entero, primero incinerará las sombras de los reaccionarios fascistas y nazis."
 RED_event.15.a: "¡Defendamos la revolución, aplastemos a los nazis!"
 RED_event.16.t: "La República de los Trabajadores"
 RED_event.16.d: "Las masas proletarias han tomado en sus manos todos los medios de producción y se han establecido como clase dominante. La República de los Trabajadores debe ahora impulsar su productividad para avanzar hacia el futuro junto a otros camaradas oprimidos. Con medidas adecuadas tras la revolución, hemos estabilizado la economía y demostrado que es posible realizar un socialismo descentralizado. ¡Solo queda el progreso para la Federación Roja de Invierno!"
 RED_event.16.a: "¡Viva el socialismo!"
 RED_event.17.t: "El Amanecer del Sindicalismo"
 RED_event.17.d: "Los sindicatos han sido reorganizados a gran escala en todos los sectores. Los trabajadores producen, planean, expresan opiniones y votan a través de sus sindicatos. Es una victoria definitiva del sindicalismo en el frente de la vida diaria, un verdadero acto de liberación laboral."
 RED_event.17.a: "¡Vivan los sindicatos!"
 RED_event.18.t: "Los Socialistas Noruegos"
 RED_event.18.d: "Con la integración de Noruega completada, los socialistas noruegos desean unirse a nuestro gobierno."
 RED_event.18.a: "¡Sean bienvenidos, camaradas!"

 RED_event.19.t: "El Departamento de Servicios Rechaza a Marina"
 RED_event.19.d: ""
 RED_event.19.a: "Maldita sea..."
 RED_event.20.t: "Amenaza Persistente"
 RED_event.20.d: ""
 RED_event.20.a: "\"¿Todavía quedan más?!\""

 RED_event.21.t: "Cambio Acelerado"
 RED_event.21.d: "Aunque muchos celebraron la implementación de la jornada laboral de tres días a la semana, la caída drástica en la producción hizo inviable su mantenimiento permanente. Como alternativa, decidimos garantizar la jornada de tres días solo a los estudiantes, y ofrecer un modelo de trabajo flexible con una semana laboral de 4.5 días para los trabajadores locales."
 RED_event.21.a: "Qué lástima."
 RED_event.21.b: "Quizá podamos mantenerlo de alguna forma."
 RED_event.22.t: "Evaluación de la Segunda AEP"
 RED_event.22.d: "Cientos de comisarios populares se reunieron en una gigantesca sala para debatir en una sesión extraordinaria sobre la política de economía alternativa, impulsada por las facciones críticas a la AEP.\n\n\"¡El origen burgués del camarada Arnold, quien explotaba a los trabajadores daneses, es un hecho público! Que regrese como supervisor industrial es una amenaza para nuestro sistema socialista.\"\n\n\"¡Los impuestos asignados a pequeños y medianos negocios solo enturbian la identidad proletaria de las masas!\"\n\nLas voces de la oposición se alzaron enérgicamente. Ante la falta de consenso, se convocó una votación para decidir el futuro de la política económica alternativa."
 RED_event.22.a: "¡Profundicemos en el cooperativismo!"
 RED_event.22.b: "¡Diluámosla en el socialismo de mercado!"
 RED_event.22_tt_1: "No alcanzamos las §Y80 fábricas civiles§! objetivo de la §YSegunda AEP§!, dificultando su continuación:\n"
 RED_event.22_tt_2: "Alcanzamos las §G80 fábricas civiles§! objetivo de la §YSegunda AEP§!, dificultando su disolución:\n"
 RED_event.24.t: "Golpe del Frente de Liberación del Mint-Choco"
 RED_event.24.d: "El Frente de Liberación del Mint-Choco, frustrado por la escasez de chocolate menta tras la Gran Ruptura y la falta de respuestas a sus peticiones, lanzó un golpe de estado. Disfrazados de repartidores, infiltraron el campus central, ocuparon los edificios y atacaron a la Guardia. Sorprendidos, los guardias se retiraron temporalmente."
 RED_event.24.a: "¡Maldita sea!"
 RED_event.24_tt: "\nDebido al espíritu nacional §Y$RED_threat_of_coup$§!, ocurren golpes de estado recurrentes. Este espíritu puede eliminarse mediante el enfoque §Y$RED_club_focus_2$§!."
 RED_event.25.t: "Golpe del Movimiento Contra el Limón en el Karaage"
 RED_event.25.d: "Tras la Gran Ruptura, los ataques terroristas del Movimiento Contra el Limón en el Karaage se intensificaron. Cuando el secretariado respondió con medidas represivas, organizaron un asalto nocturno al campus, derrotaron a los guardias y establecieron el Comité Provisional Anti-Limón. Anunciaron que formarán un nuevo gobierno en pocos días."
 RED_event.25.a: "Están completamente locos."
 RED_event.26.t: "Golpe de la Confederación de Duchas de Agua Fría en Pleno Invierno"
 RED_event.26.d: "A las 3 de la madrugada, miembros de la Confederación de Duchas de Agua Fría en Pleno Invierno tomaron el campus y ocuparon el secretariado. Los burócratas que aún no habían llegado 'afortunadamente' disfrutan de una forzada licencia pagada mientras se prepara la operación de recuperación."
 RED_event.26.a: "Sin apresurarse demasiado."
 RED_event.27.t: "Represión"
 RED_event.27.d: "La operación para reprimir el último golpe ha concluido con éxito. Los oficiales de seguridad retiran panfletos de propaganda y banderas rebeldes en toda la ciudad. [RED.getleader] vuelve a sentarse en su despacho para retomar el gobierno."
 RED_event.27.a: "Qué alivio."
 RED_there_is_coup_flag: "§tEl gobierno quedó paralizado por los constantes golpes§!"
 RED_event.28.t: "Destrucción de los Grupos Antigubernamentales"
 RED_event.28.d: "La amenaza de los constantes golpes de estado en la Federación Roja de Invierno ha sido finalmente erradicada. Los líderes de las principales facciones rebeldes han sido arrestados y encarcelados en el Edificio Antiguo, mientras que sus seguidores fueron dispersados. ¡La Federación está ahora políticamente estabilizada!"
 RED_event.28.a: "Por fin."
 RED_event.28_tt_1: "§LLa Confederación de Duchas de Agua Fría en Pleno Invierno ha sido disuelta.§!"
 RED_event.28_tt_2: "\n§LEl Movimiento Contra el Limón en el Karaage ha sido erradicado.§!"
 RED_event.28_tt_3: "\n§LSe han confiscado todos los activos del Frente de Liberación del Mint-Choco.§!"
 RED_event.29.t: "Emisión de Billetes Falsos"
 RED_event.29.d: "El enemigo ha comenzado a emitir billetes falsificados para destruir nuestra economía."
 RED_event.29.a: "¡Malditos!"
 RED_event.30.t: "La Gran Guerra Invernal"
 RED_event.30.d: "Tanto nuestro pueblo como el enemigo aceptan ya que esta guerra será difícil. Debemos encontrar una forma de superarla."
 RED_event.30.a: "¡Derrotémoslos!"
 RED_event.31.t: "Armas Biológicas"
 RED_event.31.d: "El enemigo está utilizando armas biológicas para obstaculizar nuestras operaciones."
 RED_event.31.a: "Recuerdo que esto estaba prohibido..."
 RED_event.32.t: "Problemas Demográficos"
 RED_event.32.d: "La Gran Ruptura trasladó a millones de estudiantes a esta región. Sin embargo, las limitaciones de infraestructura son claras. La sobrepoblación amenaza con provocar disturbios, colapso económico y desorden general."
 RED_event.32.a: "¡Debemos resolverlo como sea!"
 RED_event.32_tt: "\nPuedes reducir la §Rsuperpoblación§! desbloqueando decisiones especiales a través del enfoque §Y$RED_land_research$§!."
 RED_event.33.t: "Concentración de los Zhushaístas"
 RED_event.33.d: "Los zhushaístas, que abogan por una línea capitalista, están ganando fuerza. ¡Debemos contenerlos!"
 RED_event.33.a: "Qué problema..."
 RED_event.34.t: "Disolución de los Zhushaístas"
 RED_event.34.d: "Gracias a una activa campaña anticapitalista, los zhushaístas han sido disueltos."
 RED_event.34.a: "Menos mal."
 RED_event.35.t: "Solución de los Problemas Demográficos"
 RED_event.35.d: "Aunque fue un proceso tumultuoso tras la Gran Ruptura, finalmente resolvimos el problema de superpoblación. Sin embargo, aún enfrentamos escasez no solo de alimentos, sino también de bienes de consumo esenciales."
 RED_event.35.a: "¡Mientras tengamos bienes para repartir, todo irá bien!"
 RED_event.36.t: "Un Pequeño Problema"
 RED_event.36.d: "Tras completar la ofensiva en Helgeland, el secretariado expandió enormemente su aparato administrativo. Aunque la amenaza inmediata ha disminuido, se han detectado omisiones de reportes y pérdida de comunicaciones en algunas áreas. No parece grave, pero debemos investigarlo."
 RED_event.36.a: "Debemos reforzar la capacitación de los secretarios."
 RED_event.36.b: "¿Qué es eso de las oficinas militares?"
 RED_event.37.t: "Corrupción Expuesta"
 RED_event.37.d: "Un informe devastador ha llegado al secretariado: los secretarios de la Federación están involucrados en corrupción con los locales. Las cifras de producción fueron infladas para obtener más recursos, las raciones del departamento de suministros eran ficticias y muchas unidades de defensa popular se disolvieron o dejaron de existir. ¡Incluso los reportes militares ya no son confiables!"
 RED_event.37.a: "¡Es terrible!"
 RED_event.38.t: "Brote de Desarrollo Industrial"
 RED_event.38.d: "La crisis de superpoblación se ha transformado en una oportunidad. Los estudiantes ayudan en campos, talleres, aserraderos y minas. Esta mano de obra impulsará inevitablemente la producción en Escandinavia y la Federación Académica."
 RED_event.38.a: "Eso es un alivio."
 RED_event.38_tt: "Se completarán al azar tres enfoques del árbol de §Ytécnicos locales§!. Si ya están completados, recibirás fábricas civiles por cada enfoque restante.\n\n"
 RED_event.39.t:0 "La derecha local sacrificada por el Terror Rojo"
 RED_event.39.d:0 "Mientras muchos políticos de derecha locales partieron al exilio junto a su monarca, numerosos grupos juveniles de derecha continúan obstaculizando la construcción de nuestra academia. Por decisión de la Secretaría, se llevó a cabo una operación de limpieza contra ellos; sin embargo, durante la transmisión de las órdenes, la competencia por méritos entre los cuadros provocó que se asignaran cuotas de purga a cada unidad, lo que derivó en arrestos y detenciones indiscriminadas de la población local.\n\nAunque la directiva fue retirada al cabo de una semana, las organizaciones paramilitares que nos obstaculizaban fueron derrotadas de manera decisiva."
 RED_event.39.a:0 "¿Fue algo bueno?"


# Eventos / Colapso del Gobierno Militar

 RED_instability_system.1.a: "Si ves esto, es un bug."

 RED_instability_system.2.t: "Inestabilidad en el Gobierno Militar"
 RED_instability_system.2.d: "El comandante militar de [FROM.GetName] nos informa que los ciudadanos empiezan a escapar del control de la autoridad militar. No solo en [FROM.GetName], sino en todos los territorios ocupados, la situación se está volviendo incontrolable. Debemos actuar para resolver los problemas de los gobiernos militares."
 RED_instability_system.2.a: "Esto es grave."
 RED_instability_system_2_tt: "Consulta la pestaña de §YEventos y Decisiones§!."

 RED_instability_system.3.t: "Manifestación Popular"
 RED_instability_system.3.d: "Multitudes se están manifestando en las principales avenidas de [ROOT.capital.GetName]."
 RED_instability_system.3.a: "No podemos hacer nada."
 RED_instability_system.3.b: "Dispersa a los manifestantes."

 RED_instability_system.4.t: "La Ola Revolucionaria"
 RED_instability_system.4.d: "No sabemos si las protestas son una resistencia espontánea o un movimiento organizado. Lo único seguro es que los ciudadanos están formando milicias y marchan hacia nuestras oficinas administrativas.\n\nTal vez, el régimen militar opresivo que impusimos ahora nos esté pasando factura."
 RED_instability_system.4.a: "Unámonos a los manifestantes. Trataremos de persuadirlos."
 RED_instability_system.4.b: "¡Todos a posiciones de combate!"

 RED_instability_system.6.t: "La Primavera de [FROM.GetAdjective]"
 RED_instability_system.6.d: "La autoridad militar en [FROM.GetAdjective] se ha unido a una gran manifestación, exigiendo que negociemos con los ciudadanos. Tanto los manifestantes como el mando militar local critican nuestro gobierno como opresivo y exigen construir relaciones pacíficas con los estados locales."
 RED_instability_system.6.a: "¡Aplasta la rebelión!"
 RED_instability_system.6.b: "Bien... bien, intentémoslo de nuevo."

 RED_instability_system.61.t: "El Silencio de [FROM.GetName]"
 RED_instability_system.61.d: "Intentamos negociar con [FROM.GetName], pero solo hemos recibido silencio. La negociación ha fracasado. Debemos prepararnos para su agresión."
 RED_instability_system.61.a: "¡Resistiremos hasta el final!"

 RED_instability_system.62.t: "Economía Bajo Control"
 RED_instability_system.62.d: "[FROM.GetName] ha permitido la construcción de un estado independiente a cambio de movilizar nuestros recursos en sus proyectos económicos. Aunque seguiremos subordinados económicamente por un tiempo, hemos logrado la independencia."
 RED_instability_system.62.a: "Finalmente dio frutos."

 RED_military_government_occupation.1.t: "Ocupación de Dinamarca"
 RED_military_government_occupation.2.t: "Ocupación de Noruega"
 RED_military_government_occupation.3.t: "Ocupación de Suecia"
 RED_military_government_occupation.4.t: "Ocupación de Finlandia"

 RED_military_government_occupation.1.desc: "Las fuerzas de la Federación Académica Roja de Invierno han derrotado a todos los insurgentes y han entrado en la capital enemiga. Gracias a esta operación militar, los habitantes locales no podrán oponerse a nuestro gobierno por algún tiempo.\n\nAhora debemos decidir cómo administraremos el territorio conquistado."
 RED_military_government_occupation.1.a: "Restablecer un Gobierno Militar."
 RED_military_government_occupation.1.b: "Establecer un gobierno títere."
 RED_military_government_occupation.1.c: "Administrarlo directamente."
 RED_military_government_occupation.1.d: "Integrarlo a la Federación Académica."

# Eventos / Minori

 RED_minori_event.1.t: "Huelga General del Departamento de Servicios"
 RED_minori_event.1.d: "Minori Yasumori, jefa del Departamento de Servicios, anunció que tanto los trabajadores del departamento como las masas populares se niegan a seguir obedeciendo al autoritario Secretariado, incapaz de gestionar la Gran Ruptura. Entrarán en una huelga general indefinida hasta que el Secretariado se disuelva."
 RED_minori_event.1.a: "Era de esperarse."
 RED_minori_event.2.t: "Huelga de los Trabajadores Navales"
 RED_minori_event.2.d: "Los trabajadores navales de la Federación Roja de Invierno, quienes no recibieron salarios durante meses tras la Gran Ruptura, han sido incitados a iniciar una huelga."
 RED_minori_event.2.a: "Menos gasto para nosotros."
 RED_minori_event.3.t: "Huelga de Trabajadores Precarios"
 RED_minori_event.3.d: "Los estudiantes que laboraban en empleos eventuales o plataformas, movilizados como soldados o trabajadores públicos tras la Gran Ruptura, han exigido repetidamente una compensación. El Secretariado negó estas demandas alegando 'deber académico'. Ahora, parte de estos estudiantes han adherido a la huelga general, reflejándose en indicadores económicos."
 RED_minori_event.3.a: "Aún les falta mucho por aprender."
 RED_minori_event.4.t: "Manifestación del Día del Trabajo"
 RED_minori_event.4.d: "Como cada año, el Día del Trabajo en la Federación culminaba en un desfile militar y culto a la personalidad de Cherino. Sin embargo, este año, el público mostraba rostros tensos, como si algo estuviera decidido.\n\nCuando la caballería y los vehículos militares marchaban por la avenida, repentinamente se escucharon silbidos. Organizados, los manifestantes tomaron los vehículos militares y atacaron al desfile. Sorprendidos, los soldados apenas pudieron resistir; algunos incluso se unieron a los manifestantes.\n\nComisarías, estaciones, bancos y oficinas administrativas fueron ocupadas en cuestión de horas, y los ciudadanos empezaron a armarse asaltando los arsenales.\n\nAl anochecer, se confirmaba: Cherino y el Secretariado habían huido al oeste."
 RED_minori_event.4.a: "¡Es una revolución!"
 RED_minori_event.5.t: "Amenaza Contrarrevolucionaria"
 RED_minori_event.5.d: "Noticias preocupantes llegan: Cherino, Renka y oficiales del antiguo Secretariado están reorganizando fuerzas en el oeste para lanzar una contrarrevolución, apoyándose en el poder militar remanente. ¡Debemos prepararnos!"
 RED_minori_event.5.a: "¡Resistiremos con unidad de acero!"
 RED_minori_event.5_tt: "§R¡Se disolverán todas las divisiones!§!\n\n"
 RED_minori_event.6.t: "Campesinos Armados"
 RED_minori_event.6.d: "Inspirados por la revolución, los campesinos pobres se alzaron, expulsaron a terratenientes y administradores, quemaron contratos de arrendamiento, y se armaron para defender sus tierras."
 RED_minori_event.6.a: "¡Derrotemos a los terratenientes y a Cherino!"
 RED_minori_event.7.t: "El Consejo Militar Revolucionario"
 RED_minori_event.7.d: "Nuestra organización paramilitar, el Consejo Militar Revolucionario, finalmente entra en acción. Se movilizan miles de combatientes rojos para aplastar a la contrarrevolución."
 RED_minori_event.7.a: "¡Aplastemos la contrarrevolución!"
 RED_minori_event.8.t: "El Futuro del Departamento de Publicaciones"
 RED_minori_event.8.d: "En la semana posterior a la revolución, se confirmó que el Departamento de Publicaciones había difundido rumores y desinformación. Se debate el destino de Yakumo Aramaki: los radicales exigen su ejecución como advertencia, mientras que los moderados proponen convertirla en una propagandista revolucionaria."
 RED_minori_event.8.a: "Ejecutemos a Yakumo."
 RED_minori_event.8.b: "Reclutémosla para la revolución."
 RED_minori_event.11.t: "Enfrentando a la Máxima Autoridad"
 RED_minori_event.11.d: "Cherino, quien transformó la Federación Roja de Invierno en una oligarquía implícita, fue capturada por una milicia campesina en un puerto del norte de Noruega. Fue trasladada a Cherinograd y el Comité Revolucionario decidió someterla a un 'Juicio Popular' abierto.\n\nDurante tres días, sin abogado defensor, Cherino enfrentó un mar de piedras lanzadas por un público enfurecido. Algunos intelectuales abogaban por su reeducación, alegando su incompetencia mental; pero la mayoría, encabezada por la facción radical, exigió la pena de muerte por planear una contrarrevolución. Finalmente, fue condenada a muerte sin posibilidad de apelación.\n\nHasta la ejecución, permanecerá encarcelada en un pabellón especial adyacente a la antigua escuela roja."
 RED_minori_event.11.a: "¡Así termina un dictador!"
 RED_minori_event.12.t: "Piedad para la Cruel"
 RED_minori_event.12.d: "Marina sabía que su destino era sombrío. Intentó buscar asilo en lugar de entregar a Trotsky a la URSS, pero no logró reunir aliados.\n\nCuando llegó al puerto, los estibadores la traicionaron denunciándola a las fuerzas revolucionarias. Luchó mientras Trotsky escapaba, pero fue capturada y trasladada en condiciones miserables a la capital.\n\nAunque el Comité Revolucionario decidió sentenciarla a trabajos forzados en lugar de ejecutarla, Marina no pudo soportar la humillación. Intentó suicidarse varias veces, sin éxito. Finalmente, mientras esperaba su traslado, fue linchada en su celda por una turba enfurecida."
 RED_minori_event.12.a: "Somos compasivos... hasta donde se puede."
 RED_minori_event.13.t: "La Administradora del Secretariado"
 RED_minori_event.13.d: "A diferencia de Cherino, Tomoe Sashiro tenía competencia administrativa. Por eso el Comité Revolucionario decidió ofrecerle la oportunidad de servir al nuevo gobierno. Aceptó inicialmente un cargo menor, pero tras la ejecución de Cherino, rechazó todo puesto y solicitó ser enviada a un campo de trabajo como los demás exfuncionarios."
 RED_minori_event.13.a: "Aunque no hará volver a Cherino."
 RED_minori_event.14.t: "Victoria en Dinamarca"
 RED_minori_event.14.d: "Nuestros valientes revolucionarios sorprendieron a las fuerzas del gobierno militar en Dinamarca, aplastándolos y liberando el territorio."
 RED_minori_event.14.a: "¡Una gloriosa victoria!"
 RED_minori_event.15.t: "Alianza de Trabajadores Coreanos"
 RED_minori_event.15.d: "Los trabajadores coreanos, hartos del régimen de Cherino, formaron milicias y se unieron a nuestras fuerzas revolucionarias."
 RED_minori_event.15.a: "¡Bienvenidos, camaradas!"
 RED_minori_event.16.t: "Disolución del Comité Revolucionario"
 RED_minori_event.16.d: "Ahora que el régimen opresivo de Cherino ha caído, es hora de establecer una república y una nueva constitución. El Comité Revolucionario, compuesto por líderes sindicales, estudiantes y teóricos de izquierda, decidió autodisolverse para dar paso a una Asamblea Constituyente electa."
 RED_minori_event.16.a: "¡Buen trabajo, camaradas!"
 RED_minori_event.17.t: "Constitución: Instituciones Soberanas"
 RED_minori_event.17.d: "Existen varios modelos para el Estado socialista. El sindicalismo propone empoderar a los sindicatos para gestionar directamente la industria y la política. Sin embargo, algunos teóricos advierten que los sindicatos podrían degenerar en estructuras autoritarias. Por eso otros proponen reforzar consejos laborales y regionales, basados en democracia directa. La Asamblea Constituyente debe decidir cuál será nuestro modelo."
 RED_minori_event.17.a: "Los sindicatos son los verdaderos representantes del pueblo."
 RED_minori_event.18.t: "Constitución: Liderazgo Colectivo"
 RED_minori_event.18.d: "Tras sufrir los abusos de un liderazgo personalista bajo Cherino, hemos decidido adoptar el sistema de liderazgo colectivo. Así evitaremos la concentración excesiva de poder en una sola persona."
 RED_minori_event.18.a: "El Comité Central será la nueva voz del pueblo."
 RED_minori_event.19.t: "Constitución: Debate sobre el Pluripartidismo"
 RED_minori_event.19.d: "Dentro de la Asamblea, se debate si instaurar un sistema de partido único o un sistema de partidos múltiples. Unos sostienen que el partido único evitará contrarrevoluciones; otros abogan por proteger la libertad de organización como condición esencial del socialismo."
 RED_minori_event.19.a: "Avancemos hacia el socialismo pluripartidista."
 RED_minori_event.19.b: "El partido único blindará la revolución."
 RED_minori_event.20.t: "Constitución: Primeras Elecciones"
 RED_minori_event.20.d: "Las elecciones libres se prepararon cuidadosamente. Aunque no todos votaron, más del 90% del pueblo participó, celebrando su primera experiencia democrática.\n\nLa figura central de esta elección fue Yasumori Minori, líder del Departamento de Servicios y artífice de la huelga general de febrero."
 RED_minori_event.20.a: "¡Minori ha sido elegida Presidenta del Consejo Estudiantil!"
 RED_minori_event.21.t: "Independencia de [FROM.getname]"
 RED_minori_event.21.d: "Con la proclamación de independencia de [FROM.getname], debemos decidir si aceptamos su separación pacíficamente o si los enfrentamos militarmente para evitar que caigan en manos del autoritarismo burgués."
 RED_minori_event.21.a: "¡Atacaremos!"
 RED_minori_event.21.b: "No todavía. Esperemos."
 RED_minori_event.22.t: "Constitución: Renombramiento de Ciudades"
 RED_minori_event.22.d: "Muchas ciudades llevan nombres asociados a Cherino y su régimen. Ahora debatimos si restaurar los nombres tradicionales locales o nombrarlas en honor a antiguos revolucionarios. En cualquier caso, la población recibirá el cambio con entusiasmo."
 RED_minori_event.22.a: "Respetemos los nombres locales."
 RED_minori_event.22.b: "Honremos a los revolucionarios del pasado."
 RED_victorypoint_stockholm: "Estocolmo"
 RED_victorypoint_yetebori: "Gotemburgo"
 RED_victorypoint_udebala: "Uddevalla"
 RED_victorypoint_paloon: "Falun"
 RED_victorypoint_marx: "Marxgrad"
 RED_victorypoint_blanki: "Blanquigrado"
 RED_victorypoint_praudhon: "Proudhongrado"
 RED_victorypoint_bakunin: "Bakuningrado"
 RED_minori_event.23.t: "Autonomía"
 RED_minori_event.23.d: "Mientras el imperialismo siga creciendo, la dictadura del proletariado en un solo país no basta. Debemos expropiar el capital extranjero y permitir que los trabajadores gestionen las industrias de forma autónoma. Solo entonces la revolución será completa."
 RED_minori_event.23.a: "¡Derribemos el capitalismo-imperialismo!"
 RED_minori_event.24.t: "Igualdad"
 RED_minori_event.24.d: "El capital divide y enfrenta al pueblo para perpetuar su dominio. Nacionalismo, chauvinismo: todo instrumento de división debe ser rechazado en nuestra sociedad socialista. Todos los trabajadores, incluidos los inmigrantes, deben ser reconocidos como iguales bajo la ley, con pleno acceso a derechos laborales y políticos tras su integración."
 RED_minori_event.24.a: "No somos como los capitalistas."
 RED_minori_event.25.t: "Liberación"
 RED_minori_event.25.d: "El 'socialismo en un solo país' promovido por hipócritas autoproclamados revolucionarios es erróneo. La revolución debe extenderse continuamente hasta liberar a todos los pueblos del mundo. No podemos detenernos hasta destruir todo sistema autoritario, capitalista, imperialista y nacionalista."
 RED_minori_event.25.a: "¡Que rompamos las cadenas juntos!"
 RED_minori_event.26.t: "Invitación a la Internacional de Trabajadores"
 RED_minori_event.26.d: "El joven gobierno socialista de la Federación Roja de Invierno nos ha solicitado apoyo para evitar su aislamiento. Aceptar su invitación fortalecería la causa de la revolución mundial."
 RED_minori_event.26.a: "La solidaridad nos hace fuertes."
 RED_minori_event.26.b: "Aún no es el momento."
 RED_minori_event.27.t: "Huelga Sindical"
 RED_minori_event.27.d: "Los trabajadores han exigido que los frutos del reciente crecimiento económico se traduzcan en bonificaciones y mejoras salariales. Han iniciado una huelga para exigirlo."
 RED_minori_event.27.a: "Concedámosles su legítima recompensa."
 RED_minori_event.27.b: "Eso es inaceptable."
 RED_minori_event.28.t: "Referéndum Popular"
 RED_minori_event.28.d: "Un funcionario municipal, acusado de corrupción por su familia, fue sometido a un referéndum popular. Tras un intenso debate sobre su traición a los ideales revolucionarios, fue destituido por una mayoría abrumadora."
 RED_minori_event.28.a: "¡Así funciona la democracia directa!"
 RED_minori_event.29.t: "En el Camino de la Lucha (1/2)"
 RED_minori_event.29.d: "Muchas personas enfrentan tormentas en su vida. Todos encuentran olas, de distintas fuerzas y tamaños. Nadie está exento.\n\nComo humanos —seres que existen 'entre' otros, como indica el carácter para 'persona' en chino— tendemos a buscar ayuda, y también a ofrecerla. Así se forma la solidaridad.\n\nFrente a las dificultades, algunos aconsejan resignarse, pero otros nos enseñan a cuestionar lo que parece natural. Son los verdaderos revolucionarios.\n\nCuando la teología dominaba Europa, ciertos sabios desmontaron la noción de 'divinidad' para exaltar la dignidad humana. Más tarde, revolucionarios como Lutero rompieron con el absolutismo religioso.\n\nSiguiendo esta tradición, un joven alemán —cuando todos aceptaban el nacionalismo y el capitalismo— escribió su 'Manifiesto', desafiando la opresión invisible de la burguesía.\n\nMuchos dicen que el socialismo fracasó. Pero quienes realmente conocen a Marx saben que sus críticas eran rigurosas y profundas. Los prejuicios contra el socialismo demuestran simplemente lo alienados que seguimos estando."
 RED_minori_event.29.a: "..."
 RED_minori_event.30.t: "En el Camino de la Lucha (2/2)"
 RED_minori_event.30.d: "La Federación Roja de Invierno, guiada por Minori Yasumori y su Frente Rojo, logró construir la república obrera más progresista y democrática del siglo XX.\n\nY todo esto fue posible gracias a ti.\n\nQuizás al principio elegiste el enfoque radical solo por simpatía a Minori o por curiosidad. Pero al tomar esa decisión, abriste las puertas a la revolución. Como en *Les Misérables*, cuando los ciudadanos de Cherinograd se alzaron en armas el Primero de Mayo.\n\nLa contrarrevolución de Cherino fue aplastada. Las viejas estatuas fueron derribadas, las ciudades renombradas, y los logros revolucionarios cimentaron derechos como la jornada laboral de tres días, la seguridad social universal, y la democracia directa.\n\nPuede que no hayas podido cumplir todos los sueños revolucionarios. Pero no importa: gracias a tu decisión, el pueblo vivió la época más gloriosa de su historia.\n\nQuizá este simple mod de un juego no cambie el mundo. Pero al menos, por un instante, encendió en ti la chispa de la esperanza, la dignidad, y la revolución.\n\nGramsci decía: \"Pesa con el intelecto, pero actúa con la voluntad\". Nuestra razón puede ser pesimista, pero nuestra voluntad será siempre optimista.\n\nQue sigas luchando en este mar llamado vida, como un verdadero revolucionario."
 RED_minori_event.30.a: "¡Muchas gracias por jugar!"
 RED_minori_event.30_tt: "¡Espero que tú y yo podamos caminar este camino de lucha, con dignidad y esperanza!\n§g- Con un saludo revolucionario, el modder §YAfterImage§!.§!"
 RED_minori_event.31.t: "Retiro de Minori"
 RED_minori_event.31.d: "Yasumori Minori, exjefa del Departamento de Servicios, heroína de la Revolución de Mayo y Comisaria Política del Consejo Militar Revolucionario, ha concluido su mandato este mes. Su popularidad se mantuvo altísima hasta el final, con un apoyo del [RED.GetPartySupport]%.\n\nEn honor a su servicio desinteresado al pueblo, el Comité Central dejó vacante su posición y decidió mantener la dirección colectiva."
 RED_minori_event.31.a: "¡Bien hecho, camarada!"


 RED_missions_char.1.t: "Demanda Popular: Jornada Laboral de 3 Días"
 RED_missions_char.1.d: "El pueblo exige la implementación de la jornada laboral de 3 días a la semana para garantizar vidas humanas dignas y tiempo libre de calidad. Debemos aprobar rápidamente la ley correspondiente."
 RED_missions_char.1.a: "¡Hacia una vida digna!"
 RED_missions_char.2.t: "Demanda Popular: Fracaso"
 RED_missions_char.2.d: "No cumplimos las demandas populares a tiempo. La confianza en el gobierno obrero se está erosionando."
 RED_missions_char.2.a: "Maldición."
 RED_public_mission_failed_over_5: "\n§YAl fallar en más de §Y6§! demandas populares, el pueblo desconfía seriamente del régimen.§!"
 RED_public_mission_failed_over_2: "\n§YAl fallar en más de §Y3§! demandas populares, el pueblo comienza a desconfiar seriamente del régimen.§!"
 RED_missions_char.3.t: "Demanda Popular: Éxito"
 RED_missions_char.3.d: "Cumplimos satisfactoriamente las demandas del pueblo. ¡El nuevo gobierno goza de confianza sólida!"
 RED_missions_char.3.a: "¡El socialismo se afianza!"
 RED_missions_char.4.t: "Demanda Popular: Rearme Total"
 RED_missions_char.4.d: "La expansión agresiva de [TRM.getname] asusta a las masas, que exigen un rearme total para preparar una guerra revolucionaria que libere también a los pueblos oprimidos del enemigo."
 RED_missions_char.4.a: "¡Aplastemos a los fascistas!"
 RED_missions_char.5.t: "Demanda Popular: Industrialización"
 RED_missions_char.5.d: "Según el materialismo histórico de Marx, avanzar en la estructura económica es clave. Apostemos por una industrialización radical y democrática para consolidar el socialismo."
 RED_missions_char.5.a: "¡Todo por el máximo desarrollo de las fuerzas productivas!"
 RED_missions_char.6.t: "Demanda Popular: Salir de la Organización de Cooperación de Kivotos"
 RED_missions_char.6.d: "La actual organización de cooperación es vista como una herramienta contrarrevolucionaria al servicio de capitalistas y señores feudales. ¡Debemos retirarnos inmediatamente!"
 RED_missions_char.6.a: "¡Sin compromisos con el enemigo!"
 RED_missions_char.7.t: "Demanda Popular: Apoyo a Hospitales de Campaña"
 RED_missions_char.7.d: "Con el establecimiento de sindicatos militares, los soldados exigen mayor protección en el frente. Podemos satisfacer esta demanda estableciendo hospitales de campaña."
 RED_missions_char.7.a: "¡La revolución también debe cuidar a sus combatientes!"
 RED_missions_char.8.t: "Demanda Popular: Disolución del Consejo Militar Revolucionario"
 RED_missions_char.8.d: "El 'bonapartismo rojo' es el peligro de que estructuras militares concentren el poder político. Debemos disolver el Consejo Militar Revolucionario y transformar sus restos en sindicatos de soldados."
 RED_missions_char.8.a: "¡Que el poder permanezca en el pueblo!"
 RED_missions_char.9.t: "Demanda Popular: Estabilización Social"
 RED_missions_char.9.d: "Los sindicatos de funcionarios exigen mejorar la seguridad, la administración, el bienestar y asegurar participación política continua para afianzar el dominio ideológico socialista."
 RED_missions_char.9.a: "¡Por el bienestar popular!"
 RED_missions_char.10.t: "Demanda Popular: Ampliar Infraestructura"
 RED_missions_char.10.d: "Tras la guerra civil, el país necesita reconstrucción urgente. El sindicato de constructores pide una expansión masiva de infraestructura."
 RED_missions_char.10.a: "¡El ferrocarril es la sangre de la industria!"
 RED_missions_char.11.t: "Demanda Popular: Complejo Militar-Industrial"
 RED_missions_char.11.d: "El sindicato de la industria de defensa propone expandir cualitativamente el sector militar-industrial para fortalecer la defensa revolucionaria."
 RED_missions_char.11.a: "¡Innovación revolucionaria!"
 RED_missions_char.12.t: "Demanda Popular: Promoción de la Industria Pesada"
 RED_missions_char.12.d: "El sindicato manufacturero propone crear refinerías para impulsar la industria pesada, lograr autosuficiencia y eliminar dependencias."
 RED_missions_char.12.a: "¡Por una economía independiente!"
 RED_missions_char.13.t: "Demanda Popular: Integrar Escandinavia"
 RED_missions_char.13.d: "Tras disolver los gobiernos militares de Cherino, debemos tratar a las poblaciones liberadas como iguales, facilitando su integración."
 RED_missions_char.13.a: "¡Libertad, igualdad, solidaridad!"
 RED_missions_char.14.t: "Demanda Popular: Ofensiva Oriental"
 RED_missions_char.14.d: "El pueblo exige una ofensiva revolucionaria contra Finlandia, para evitar la amenaza de fuerzas reaccionarias desde el este."
 RED_missions_char.14.a: "¡Aplastemos la reacción!"
 RED_missions_char.15.t: "Demanda Popular: Defender [141.GetCapitalVictoryPointName]"
 RED_missions_char.15.d: "Ante la guerra contra [TRM.getname], los ciudadanos organizan defensas populares en cada calle y barrio. El Comité Central ha decidido proteger a toda costa la sede estudiantil en [141.GetCapitalVictoryPointName]."
 RED_missions_char.15.a: "¡No pasarán!"
 RED_missions_char.16.t: "Demanda Popular: Consolidar el Régimen"
 RED_missions_char.16.d: "Tras la revolución, la población ansía estabilidad. Debemos culminar la construcción del régimen socialista para tranquilizar al pueblo."
 RED_missions_char.16.a: "¡Aceleremos la transformación!"
 RED_missions_char.17.t: "Demanda Popular: Reestructuración Industrial"
 RED_missions_char.17.d: "Aunque derrocamos al capitalismo, aún subsisten relaciones de producción arcaicas. Debemos completar una reestructuración radical hacia una economía sindicalista."
 RED_missions_char.17.a: "¡Hacia una economía sindicalista!"
 RED_missions_char.18.t: "Demanda Popular: Liberar Europa"
 RED_missions_char.18.d: "Millones de trabajadores en Europa siguen siendo oprimidos. ¡Tenemos el deber de llevar la liberación revolucionaria a sus tierras!"
 RED_missions_char.18.a: "¡Viva la liberación de los pueblos!"


 RED_bop_event.1.t:0 "El hombre de barba de chivo"
 RED_bop_event.1.d:0 " Cherino lo recordó.\n\n En medio del caos de la Secretaría, Tomoe, por orden de la Secretaría, buscó a un asesor local que pudiera ayudar a estabilizar la situación.\n\n \"Camarada Secretaria General, hemos traído como asesor local a un teórico socialista llamado 'Lev Trotsky'.\"\n\n Trotsky, sonriendo como si alabara el entusiasmo de los estudiantes que impulsaban el movimiento socialista, estrechó la mano de Cherino. Desde entonces, Trotsky instruyó a Cherino y a los altos funcionarios de la Secretaría en teoría socialista y asesoramiento político."
 RED_bop_event.1.a:0 "Cherino se aburría durante toda la conferencia."

 RED_revolution.1.t:0 "Reflexión"
 RED_revolution.1.d:0 " A diferencia de lo habitual, durante casi dos meses Yasumori Minori vivió una vida extremadamente ocupada. Tenía que reconstruir y reparar decenas de edificios y estructuras militares locales derrumbadas cada día. Tras dirigir durante toda la jornada obras de enorme escala, Minori cayó rendida en su casa, empapada de fatiga.\n\n Pasaron algunas horas. Minori despertó en un estado poco reconfortante, perturbada por el alboroto exterior: silbatos incesantes, cascos de caballos, vítores, gritos, chillidos y reprimendas que interrumpían su sueño. Medio adormilada, salió decidida a protestar con firmeza contra quienes atentaban contra el derecho general a la búsqueda de la felicidad.\n\n\"¡Respeten la ley laboral! ¡Que se retiren los opresores!\"\n\n El exterior era más caótico de lo que había imaginado. No solo la plaza estaba repleta, sino que el humo se elevaba por cada callejón. En ese instante, Minori sintió vergüenza de sí misma. Mientras ella estaba ocupada con el trabajo, los trabajadores locales estaban siendo reprimidos y explotados."
 RED_revolution.1.a:0 "¡Solo quien vive, se mueve y actúa es un verdadero trabajador!"
 RED_revolution.2.t:0 "La adhesión del Departamento de Servicios"
 RED_revolution.2.d:0 "Tras las firmes exigencias de Yasumori Minori, el Departamento de Servicios respondió a la huelga local y entró en una huelga solidaria parcial. La Secretaría condenó los actos antisistema de Yasumori Minori, pero nadie mostró interés alguno en los comentarios de la Secretaría."
 RED_revolution.2.a:0 "¡La clase trabajadora es, por sí misma, internacional!"
 RED_revolution.3.t:0 "Solidaridad con la central sindical"
 RED_revolution.3.d:0 " Incluso antes de la participación activa del Departamento de Servicios, la huelga general de febrero ya se estaba extendiendo con huelgas solidarias parciales de las federaciones sindicales locales de Noruega, Dinamarca y Suecia. Yasumori Minori visitó a los dirigentes de diversas federaciones sindicales y les pidió activamente que se unieran a la huelga, logrando obtener respuestas positivas. Sin embargo, también provocó resistencias mayores y menores entre los dirigentes sindicales.\n\n\"...Pero recuerde esto. La huelga no es un medio político ni una herramienta de transformación, sino simplemente otra forma de diálogo destinada a la negociación y la lucha económica. Nosotros resolveremos levantar la huelga tan pronto como se restaure la democracia parlamentaria y se alcancen los objetivos económicos.\"\n\n\"¡¿Por qué los trabajadores de aquí son tan pasivos?!\"\n\n Aun así, hubo una organización que apoyó activamente la postura de Minori: la 'Confederación Central de Trabajadores Suecos' (SAC). Como central sindical de tendencia sindicalista, la SAC compartía con Minori la importancia de la acción directa y la lucha anticapitalista, y manifestó su intención de participar de forma protagonista en este conflicto."
 RED_revolution.3.a:0 "Los movimientos transformadores nacen de la participación activa."
 RED_revolution.4.t:0 "Resolución de 1936, número 5"
 RED_revolution.4.d:0 "Aunque se esté formando una dirección transformadora, existe un intenso debate sobre si el propio Departamento de Servicios es verdaderamente revolucionario. Considerando que casi todos los edificios de Red Winter han sido construidos por el Departamento de Servicios y que incluso aceptan encargos externos, este se asemeja más a una gigantesca cooperativa de construcción que a cualquier empresa constructora ordinaria. Sin embargo, el hecho de que sus miembros estén subordinados al trabajo asalariado y a la producción capitalista de mercancías, unido a que muchos se unieron por motivos económicos, actúa como un obstáculo para que el carácter transformador se arraigue en toda la organización.\n\n Desde hace semanas se ha planteado en el centro la necesidad de una línea organizativa firme que ordene a todos los miembros del Departamento de Servicios participar en un frente de lucha unificado, y esta cuestión está siendo deliberada internamente."
 RED_revolution.4.a:0 "Queda aprobado."
 RED_revolution.4_tt:0 "§gArtículo 1. Todos los miembros del Departamento de Servicios resuelven participar en la huelga general como sujetos de la lucha transformadora.\nArtículo 2. Se prohíben todas las negociaciones y compromisos individuales de las organizaciones subordinadas.\nArtículo 3. Se rechaza categóricamente el oportunismo y no se disolverá la organización hasta alcanzar los objetivos.\n§!"
 RED_revolution.5.t:0 "Partido Socialdemócrata Obrero"
 RED_revolution.5.d:0 "El concepto de partido socialista que participa en elecciones surgió a finales del siglo XIX, y el Partido Socialdemócrata Obrero de Suecia es uno de ellos. Tras repetidos procesos de moderación a través de la lucha por el sufragio, el partido actual intenta evitar la violencia en la medida de lo posible; sin embargo, su política de desarme no hizo más que facilitar la rápida capitulación ante Red Winter. Irónicamente, gracias a ello el partido logró conservar cierta influencia.\n\n Su amplia base popular es suficiente para politizar la huelga general. No obstante, su moderación limitará sus demandas a la 'restauración de la democracia parlamentaria', lo cual constituye una gran preocupación para Minori."
 RED_revolution.5.a:0 "¿No son más que otro tipo de capitalistas?"
 RED_revolution.6.t:0 "Compromiso"
 RED_revolution.6.d:0 "\"En última instancia, nuestro objetivo es la restauración de la democracia parlamentaria.\"\n\n Minori, como si no hubiera otra opción, asintió y aceptó su apretón de manos."
 RED_revolution.6.a:0 "Buscamos la solidaridad sin temer el aislamiento."
 RED_revolution.7.t:0 "Cooptación"
 RED_revolution.7.d:0 "Aramaki Yakumo había pasado semanas felices. El ruido de las imprentas, que antes le resultaba insoportable, le sonaba ahora como el canto de los pájaros al amanecer; el estruendo de las máquinas, como las campanas de una torre de reloj. Yakumo estaba disfrutando cada instante.\n\n ¿Por qué? Porque cuanto más imprimía teorías conspirativas y propaganda trivial sobre [RED.GetLeader], más dinero y pudín —no, espera, ¿qué era lo que decía Minori?— ah, sí, la liberación de la clase trabajadora se acercaba.\n\n Mientras Yakumo revisaba las impresiones apoyado en la imprenta y tarareando, Minori, que inspeccionaba el Club de Publicación, se acercó a saludarlo. Yakumo respondió con una sonrisa.\n\n\"¡Yakumo! Pareces de buen humor. ¿Cómo va la impresión?\"\n\n\"Muy bien. Hay muchísimos camaradas comprando estas cosas.\"\n\n\"...Yakumo, estoy segura de haberte dicho que no las vendieras...\" Minori se llevó la mano a la cabeza con expresión seria. Yakumo respondió con una sonrisa incómoda mientras, en cualquier caso, escuchaba a Minori explicar las ventajas de \"denunciar esto y aquello\" y \"garantizar cualquier cosa\". No, en realidad no escuchaba. Yakumo estaba disfrutando la idea de que incluso cobrando solo cinco yenes por unidad, el dinero se acumularía sin fin.\n\n\"Si hubiera sabido que sería así, habría impreso más de esto en lugar de esos mangas estúpidos\", pensó Yakumo."
 RED_revolution.7.a:0 "Je. Je. Je."
 RED_revolution.8.t:0 ""

