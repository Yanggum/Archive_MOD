# Industria
RED_road_to_south: "Renovación de carreteras del sur"
RED_road_to_south_desc: "Las carreteras del sur están relativamente bien construidas en comparación con el norte. Con un poco de mantenimiento, podrían ser muy útiles."
RED_road_to_south_tt: "\n§R¡Aliviar la saturación poblacional§! con una §Y£GFX_decision_icon_small decisión§!."
RED_road_to_north: "Redesarrollo de carreteras del norte"
RED_road_to_north_desc: "A pesar de estar más atrasado que el sur, el norte alberga más posibilidades precisamente por esta razón. Establecer una red básica de transporte es el primer paso hacia el desarrollo de la región, así que comencemos el redesarrollo ahora."
RED_land_research: "Solución al problema de vivienda"
RED_land_research_desc: "Desde que comenzó el gran conflicto, nuestras casas han sido arrasadas. Para evitar un desastre donde todos terminen durmiendo en las calles, debemos erradicar completamente el problema de vivienda."
RED_improve_railway_network: "Mejora de la red ferroviaria"
RED_improve_railway_network_desc: "El suministro es la base de la guerra. Debemos mantener nuestro sistema ferroviario para asegurar el suministro."
RED_economy_dev_plan: "Plan de desarrollo económico"
RED_economy_dev_plan_desc: "La crónica recesión económica ha estado empujando a los residentes de esta área al dolor. Necesitamos mejorar la situación lo antes posible."
RED_industrial_planning: "Planificación industrial"
RED_entice_publicworks_cherino: "Seducir al departamento de obras públicas"
RED_entice_publicworks_minori: "Expandir el departamento de obras públicas"
RED_entice_publicworks: "[RED_entice_publicworks]"
RED_entice_publicworks_tt: "\n§Y¡Al contratar§!:"
RED_entice_publicworks_desc: "La ayuda del departamento de obras públicas es esencial para la recuperación económica. Necesitamos seducirlos para que participen en los esfuerzos de reconstrucción. \nCon suficiente pudín como recompensa, será suficiente para persuadirlos."
RED_upgrade_heavy_industry: "Expansión de la industria pesada"
RED_upgrade_heavy_industry_desc: "Para recuperar la economía, necesitamos instalaciones industriales como base. Primero, expandamos las instalaciones de la industria pesada para aumentar la producción."
RED_upgrade_light_industry: "Fomento de la industria ligera"
RED_upgrade_light_industry_desc: ""
RED_upgrade_army_industry: "Expansión de la industria militar"
RED_upgrade_army_industry_desc: "La inversión para prepararnos contra la invasión extranjera es esencial. Preparemos fábricas para producir suministros militares."
RED_steel_casting_industry: "Expansión de la fundición de acero"
RED_steel_casting_industry_desc: "El acero es un recurso básico para toda industria. Debemos expandir la minería de hierro para aumentar la producción de acero."
RED_synthetic_rubber: "Caucho sintético"
RED_synthetic_rubber_desc: "La crónica escasez de caucho está causando interrupciones en la producción. La nueva tecnología de caucho sintético podría resolver esto."
RED_oil_production: "Desarrollo de campos petrolíferos"
RED_oil_production_desc: "Nos falta petróleo. Afortunadamente, con nuestra avanzada tecnología, podemos desarrollar los campos petrolíferos del Mar del Norte que los lugareños no han tocado."
RED_industrial_futurization: "Focalización en la manufactura"
RED_industrial_futurization_desc: ""
RED_future_production_line: "Complejo militar-industrial"
RED_future_production_line_desc: "El sistema de producción aquí es extremadamente ineficiente. Ahora que la industria básica está algo establecida, es hora de una revisión completa de la línea de producción."
RED_economic_miracle: "Milagro económico"
RED_restored_economy: "Economía restaurada"
RED_restored_economy_desc: "Gracias a los esfuerzos de nuestro gobierno para la recuperación económica, hemos superado las adversidades del gran conflicto y liderado el desarrollo económico. ¡Larga vida a la Academia Federal del Invierno Rojo!"

RED_new_economy_focus_0: "Movilizar todos los medios"
RED_new_economy_tt: "§gAvanzaremos hacia un crecimiento rápido a través del sacrificio.§!\n\n"
RED_new_economy_focus_0_tt: "\nAl completar este enfoque, §Y$RED_rearming_focus_1$§! y ciertos enfoques específicos estarán bloqueados."
RED_new_economy_focus_1: "Hacia el pleno empleo"
RED_new_economy_focus_2: "Colocación personal en el lugar de trabajo"
