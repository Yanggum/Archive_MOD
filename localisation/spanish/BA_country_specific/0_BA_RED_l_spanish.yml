 #Ruta de Minori
 RED_first_focus:0 "§GEnfoque seleccionado nada más comenzar.§!"
 RED_dipose_cherino: "Huelga General de Febrero"
 RED_dipose_cherino_desc: "A pesar de que la población sufre las consecuencias del Gran Cambio, el Buró de Invierno Rojo se ha dedicado únicamente a luchas de poder, ignorándonos. Debemos prepararnos para una gran lucha contra el corrupto Cherino y el Buró de Invierno Rojo."
 RED_labor_world: "Garantizar el apoyo de los campesinos pobres"
 RED_labor_world_tt: "\nSi ocurre una revolución, la §Yclase de campesinos pobres§! organizará voluntariamente §Yescuadrones de autodefensa§!."
 RED_labor_world_desc: "Aunque la mayoría de los participantes en la huelga son trabajadores, también hay una cantidad significativa de campesinos empobrecidos que sufren. Si les aseguramos una distribución justa de alimentos y la colectivización de granjas, lo más importante, un sistema de distribución de pudín, podemos asegurar su ferviente apoyo."
 RED_RMC: "Consejo Militar Revolucionario"
 RED_RMC_tt: "\nSi ocurre una revolución, recibirás ayuda de §Yespecialistas en defensa§! y de §Yejerércitos campesinos y obreros§! para llevar a cabo la guerra revolucionaria."
 RED_RMC_desc: "Para dirigir eficazmente a los trabajadores y campesinos que han acudido de todas partes, y para llevar a cabo la revolución con éxito, se necesita un liderazgo unido y organizado. El Consejo Militar Revolucionario, formado por veteranos y estudiantes destacados en combate, asumirá este rol."
 RED_native_leftists: "Alianza con los izquierdistas locales"
 RED_native_leftists_tt: "\nSi ocurre una revolución, podrás nombrar §Yasesores políticos socialistas§! locales."
 RED_native_leftists_desc: "Entre los líderes locales que se han unido a la huelga general, hay varios que comparten nuestras ideas. Después de establecer un frente común con los locales y los habitantes de Kivotos, prometieron apoyar un gobierno de trabajadores establecido después de la revolución."
 RED_sans_culotte: "Llamado a los sans-culottes"
 RED_crush_local_capitalist_government:0 "Aplastar al régimen capitalista local"

 RED_take_publish_club:0 "Cooptar al Club de Publicación"
 RED_take_publish_club_tt:0 "\nSi este §Yenfoque§! no se §Ycompleta§!, §Y$RED_yakumo$§! se unirá a la §Rcontrarrevolución§!"
 RED_the_threats_abound: "'Día de Mayo'"
 RED_the_threats_abound_desc: "El Día del Trabajador se acerca, oscurecido por el culto a la personalidad de Cherino, perdiendo su verdadero significado. Nosotros, junto con simpatizantes dentro del ejército y el ejército revolucionario, comenzaremos una revolución ese día para derrocar el antiguo régimen y construir un Invierno Rojo para los trabajadores."
 RED_maintaining_the_fire: "Manteniendo la llama de la revolución"
 RED_maintaining_the_fire_desc: "Aunque Kivotos ha tenido numerosos burgueses y opresores, en este mundo al que hemos llegado también hay burgueses y opresores, así como impostores de nuestro espíritu revolucionario que tratan las vidas de los trabajadores como si fueran moscas, llenando sus deseos de poder. Debemos prepararnos para una revolución aún mayor contra ellos."
 RED_freedom_of_thought: "Consejo de Jóvenes Cadetes"
 RED_freedom_of_thought_desc: "El Consejo de Jóvenes Cadetes realiza investigaciones para los trabajadores y lucha contra aquellos que perjudican a los trabajadores. Los jóvenes revitalizarán la Federación de Invierno Rojo."
 RED_deal_with_ger: "Expulsión del Buró"
 RED_deal_with_ger_desc: "Aunque la Revolución del Día del Trabajo fue un éxito, la influencia del Buró todavía existe en el campus de Invierno Rojo. Antes de que estos reaccionarios, con el apoyo del Buró, puedan interferir con la revolución, debemos cortar sus raíces."
 RED_back_to_workplace: "Retorno al lugar de trabajo"
 RED_back_to_workplace_desc: "Desde la exitosa Revolución del Día del Trabajo, Cherino y el Buró han huido al gobierno militar noruego. La larga huelga que comenzó en febrero ha terminado con la victoria del Comité Revolucionario. Ahora es el momento de que todos los trabajadores regresen a sus lugares de trabajo. A fábricas 'sin propietarios', a talleres 'sin gerentes'."
 RED_defense_revolution: "Defender la revolución!"
 RED_defense_revolution_desc: "Aunque hemos tenido éxito en numerosas revoluciones en Kivotos, a menudo nos hemos vuelto complacientes con la victoria de la revolución y hemos sido fácilmente derrotados por la contrarrevolución del Buró. Dado que la Revolución del Día del Trabajo ha sido un gran éxito, es hora de corregir los errores del pasado y dar prioridad al gobierno de los trabajadores que es el resultado de la revolución."
 RED_communist_diplo: "Sindicato de Combate"
 RED_communist_diplo_desc: "El Sindicato de Combate es un grupo armado organizado voluntariamente por estudiantes ardientes con el espíritu revolucionario, siendo la vanguardia y los defensores de la revolución. Reunidos de todos lados, estos individuos lucharán hasta la muerte para proteger la victoria revolucionaria ganada con la sangre del pueblo."
 RED_communist_diplo_tt: "\nEn cada estado que poseas y no esté desarmado, se crearán §Y2 divisiones de guerra civil§!."
 RED_new_council: "Nueva Constitución Socialista"
 RED_new_council_desc: "Después de la revolución, el Comité Revolucionario decidió disolverse voluntariamente para redactar una nueva constitución y fue reemplazado por la Asamblea Constituyente. A medida que se discute la nueva constitución para conmemorar el éxito de la revolución y establecer las bases de nuestro gobierno de trabajadores, el debate continúa."
 RED_GGOKDUGAKSI: "Marionetización del Departamento de Servicios"
 RED_workerfront: "Establecimiento del Consejo"
 RED_attack_geh: "Ataque sorpresa a la administración militar danesa"
 RED_attack_geh_desc: "Noticias de la derrota del Buró y del éxito de la revolución se están extendiendo a todas las administraciones militares. Antes de que el Buró que huyó a Noruega pueda movilizar sus tropas, debemos atacar sorpresivamente la administración militar cercana en Dinamarca para detener su movilización."
 RED_anti_fascism_policy: "Juicio Revolucionario"
 RED_anti_fascism_policy_desc: "Cherino y el Buró han sido derrocados una vez más por los trabajadores. Ahora es el momento de llevar a juicio a los reaccionarios del Buró que han perpetrado una dictadura bajo la dulce mentira de 'actuar por el pueblo'."

