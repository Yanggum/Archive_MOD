 RED_SSdF_long:0 "Alianza Escandinava de Socialdemocracia\n§gLa Alianza Escandinava de Socialdemocracia es un organismo de cooperación entre el Partido Socialdemócrata Obrero de Suecia, el Partido Laborista Noruego y el Partido Socialdemócrata Danés, cuyo objetivo común es frenar el radicalismo del gobierno revolucionario.§!"
 RED_SAC-PWD:0 "SAC-PWD"
 RED_SAC-PWD_long:0 "Confederación Central de Trabajadores de Suecia - Departamento de Servicios de Red Winter\n§gLa Confederación Central de Trabajadores de Suecia es una federación sindical sindicalista de Suecia. SAC organiza en una sola unión a personas de todos los sectores e industrias, incluidos desempleados y estudiantes. Surgió en 1910 como una oposición de extrema izquierda a la influencia de la socialdemocracia en el movimiento obrero.§!"
 RED_SACSAF-PWD:0 "SAC/SAF-PWD"
 RED_SACSAF-PWD_long:0 "Confederación Central de Trabajadores de Suecia / Federación Sindicalista de Trabajadores - Departamento de Servicios de Red Winter\n§gLa Confederación Central de Trabajadores de Suecia y la Federación Sindicalista de Trabajadores constituyen el principal congreso sindical sindicalista de Suecia. SAC organiza en una sola unión a personas de todos los sectores e industrias, incluidos desempleados y estudiantes. Surgieron en 1910 como una oposición de extrema izquierda a la influencia de la socialdemocracia en el movimiento obrero, y aunque SAF se separó de SAC en 1928, actualmente cooperan bajo el 'Frente Rojo' liderado por el Departamento de Servicios.§!"

