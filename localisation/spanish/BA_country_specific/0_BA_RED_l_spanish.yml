 RED_demand_rearm_desc: "La política de expansión agresiva de [TRM.getname] ha alarmado a las masas. El rearme es imperativo para enfrentar la amenaza reaccionaria."
 RED_demand_industrialization: "Exigir Industrialización"
 RED_demand_industrialization_desc: "Siguiendo el materialismo histórico de Marx, sabemos que la base económica condiciona la superestructura. Una industrialización radical y democrática consolidará el socialismo."
 RED_demand_quit: "Retiro de la Organización de Cooperación de Kivotos"
 RED_demand_quit_desc: "La actual Organización de Cooperación de Kivotos no es más que un instrumento contrarrevolucionario. ¡Debemos retirarnos para proteger nuestra revolución!"
 RED_demand_hospital: "Exigir Hospitales de Campaña"
 RED_demand_hospital_desc: "Los soldados organizados en sindicatos claman por mejores condiciones médicas en el frente. Debemos integrar hospitales de campaña en nuestras unidades."
 RED_demand_RMC_cut: "Disolver el Consejo Revolucionario Militar"
 RED_demand_RMC_cut_desc: "El bonapartismo rojo debe ser eliminado. Las estructuras militares deben democratizarse y subordinarse a los sindicatos de soldados."
 RED_demand_stability: "Garantizar Estabilidad"
 RED_demand_stability_desc: "Los sindicatos administrativos exigen cinco grandes políticas para mejorar la vida popular: seguridad, estabilidad, un sistema de bienestar fiable, participación política regular y estabilidad administrativa."
 RED_demand_infra: "Expandir Infraestructura"
 RED_demand_infra_desc: "Tras la guerra civil, los sindicatos de construcción exigen una reconstrucción urgente del país."
 RED_demand_arms: "Fundar el Complejo Militar-Industrial"
 RED_demand_arms_desc: "Los sindicatos de defensa piden expansión y profundización en la relación entre industria militar y fuerzas armadas."
 RED_demand_chemi: "Fomentar la Industria Petroquímica"
 RED_demand_chemi_desc: "El sindicato de manufactura propone desarrollar industrias químicas para resolver el desequilibrio de recursos y construir una economía autosuficiente."
 RED_demand_core: "Integrar Escandinavia"
 RED_demand_core_desc: "Ahora que se han disuelto los regímenes de ocupación y los opositores han sido derrotados, debemos tratar a los pueblos escandinavos como nuestros iguales y asegurar su integración."
 RED_demand_fin: "Campaña Oriental"
 RED_demand_fin_desc: "Las masas temen que fuerzas contrarrevolucionarias destruyan sus logros. Proponen una guerra revolucionaria preventiva contra Finlandia, oprimida por elementos feudales reaccionarios."
 RED_demand_defense_capital: "Defender [141.GetCapitalVictoryPointName]"
 RED_demand_defense_capital_desc: "En guerra con [TRM.getname], las masas organizan barricadas y comités de defensa en cada esquina. Defender la capital a toda costa es nuestra prioridad absoluta."
 RED_demand_system: "Completar el Sistema Revolucionario"
 RED_demand_system_desc: "Las masas, aunque regresan a sus labores, sienten incertidumbre ante los cambios. Debemos completar la estructura estatal para brindarles seguridad."
 RED_demand_industry: "Reestructuración Industrial"
 RED_demand_industry_desc: "Aunque hemos derrotado a los capitalistas, aún persisten relaciones de producción reaccionarias. Una reestructuración radical es esencial."
 RED_demand_europe: "Liberar Europa"
 RED_demand_europe_desc: "Millones de personas en Europa siguen bajo la opresión de los explotadores. ¡Es nuestro deber liberarlos!"

 RED_zenkyoutou_cat_dynamic_modifier: "Conferencia de Acción Estudiantil Revolucionaria"
 RED_zenkyoutou_cat: "Conferencia de Acción Estudiantil Revolucionaria"
 RED_zenkyoutou_cat_desc: "Tras la gloriosa §YRevolución Socialista§! liderada por §tMinori Yasumori§!, la academia entró en una gran transformación. El Departamento de Obras Públicas, superando sus límites, descubrió nuevos métodos revolucionarios en el extranjero, inspirándose en el §RAnarcosindicalismo§! y movimientos estudiantiles socialistas. De ahí nació la §YConferencia de Acción Estudiantil Revolucionaria§!, también conocida como §t'Zenkoutou'§!, una organización internacional socialista estudiantil apoyada por el Comité Central de Red Winter."
 RED_install_zkt: "Establecer Zenkoutou en [FROM.Controller.getname]"

 RED_population_issue_cat: "Problemas de Superpoblación"
 RED_population_issue_cat_desc: "Millones de estudiantes han cruzado durante el Cataclismo. Las ciudades están saturadas y los conflictos con los locales aumentan. Si no actuamos, la hambruna será inminente.\nCompleta el enfoque §Y$RED_land_research$§! para desbloquear decisiones de §YAlivio de la Superpoblación§! £GFX_decision_icon_small."
