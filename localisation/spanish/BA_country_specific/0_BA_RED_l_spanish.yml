  RED_council_for_worker: "Consejo para los Trabajadores"
 RED_council_for_worker_desc: "La terrible dictadura de 'el Buró' surgió de la palabra 'un pueblo más igualitario'. El nuevo gobierno sindicalista de los trabajadores, basado en 'todos los pueblos son iguales, y no hay un pueblo más igual que otros', guiará a la gente."
 RED_to_left: "Lucha hacia la Producción"
 RED_to_left_desc: "Todavía hay muchos opresores burgueses en el mundo. Depender de los capitales que nos ofrecen con una sonrisa es solo traer otro dictador. Es hora de luchar para construir un sistema económico de producción autónomo."
 RED_workerparty_upgrade: "Industrialización Democrática"
 RED_workerparty_upgrade_desc: "A diferencia de las políticas de industrialización dirigidas por el gobierno, las políticas de industrialización lideradas por los trabajadores, impulsadas por la demanda voluntaria de industrialización de los propios trabajadores, son un fenómeno social único en Invierno Rojo."
 RED_union_igwan: "Ciudad Planeada"
 RED_union_igwan_desc: "Bajo la dirección del parlamento, el sur del campus de Invierno Rojo está siendo urbanizado. Una vez completada la construcción, el sur del campus se convertirá en la ciudad más desarrollada y habitable en Invierno Rojo."
 RED_industrial_union: "Establecimiento de sindicatos industriales"
 RED_industrial_union_desc: "Un sindicato industrial es un sindicato al que cualquier persona que trabaje en la misma industria puede unirse como miembro. Nuestro gobierno amigable con los trabajadores está activamente promoviendo el establecimiento y la expansión de sindicatos industriales en muchos campos."
 RED_worekr_pro: "Especialización de Trabajadores"
 RED_worekr_pro_desc: "Los trabajadores calificados en cada campo no solo son más eficientes en el trabajo, sino que también muestran un alto rendimiento. Si estos pueden enseñar sus habilidades a otros trabajadores, se maximizará la producción general."
 RED_mechanize_agri: "Mecanización Agrícola"
 RED_mechanize_agri_desc: "Aunque el entorno natural del norte de Europa no es ideal para la agricultura, el uso de maquinaria agrícola con tecnología de Kivotos puede hacer un uso eficiente de la tierra cultivable."
 RED_gaegan_silsi: "Expansión Agrícola"
 RED_gaegan_silsi_desc: "La mecanización agrícola ha aumentado la cantidad de tierra que podemos cultivar. El parlamento está preparando un plan para plantar cultivos que enriquecerán las mesas y los estómagos de nuestro pueblo en las amplias llanuras alrededor del campus."
 RED_school_communism: "Distribución Adicional de Pudín"
 RED_school_communism_desc: "En su libro 'La Conquista del Pan', el anarquista de este mundo, Pyotr Kropotkin, argumentó que 'el gobierno revolucionario debería proporcionar objetos útiles directamente a los campesinos en lugar de pagarles con dinero'. De manera similar, nuestro gobierno revolucionario necesita proporcionar materiales directamente para asegurar un apoyo sólido de las masas. En nuestro caso, el pudín puede desempeñar este papel."
 RED_HYUSIK: "Semana Laboral de 3 Días"
 RED_HYUSIK_desc: "La semana laboral de tres días ha sido el ideal de bienestar laboral más deseado por los trabajadores de Invierno Rojo, algo que era casi imposible bajo la opresión del Buró. Ahora que el Consejo de Trabajadores ha sido establecido, el contenido de la semana laboral de tres días está siendo revisado positivamente."
 RED_worekrs_research: "Los Derechos Laborales Más Avanzados"
 RED_worekrs_research_desc: "Gracias a los esfuerzos del consejo amigable con los trabajadores, los trabajadores de Invierno Rojo pueden ir voluntariamente a sus lugares de trabajo para alcanzar y superar la producción diaria y disfrutar de una vida de calidad y comodidad superior a la de los trabajadores de otros países en sus días libres."
 RED_council_set_up: "Zona Industrial Socialista"
 RED_council_set_up_desc: "El sur del campus de Invierno Rojo fue la zona más severamente destruida durante la resistencia feroz del Buró durante la revolución. Mientras buscaban un sitio adecuado para construir fábricas, el parlamento planeó establecer una gran zona industrial en esta área."
 RED_asdfdd: "Mejora de la Minería"
 RED_asdfdd_desc: "Investigaciones de científicos locales han revelado que hay muchos yacimientos de mineral de hierro sin desarrollar en el área central del campus de Invierno Rojo y sus alrededores. No hay razón para dudar en el desarrollo minero si es para construir un sistema económico de producción autónomo."
 RED_worker_republic_desc: "Después de numerosos esfuerzos del consejo, Invierno Rojo ha establecido políticas exitosas favorables a los trabajadores. Ahora, la gente de Invierno Rojo vivirá con dignidad y autonomía, sin sufrir bajo el egoísta y codicioso capitalismo. ¡Viva la República de Trabajadores de Invierno Rojo!"
 RED_military_union: "Sindicato de Defensa"
 RED_military_union_desc: "Para el éxito completo de la revolución, es crucial fomentar la industria de defensa, y para ello, necesitamos ganarnos los corazones de aquellos en la industria. La creación de un sindicato de defensa es una forma de ganar su apoyo."
 RED_Civilian_factory_union: "Sindicato de Fábricas Civiles"
 RED_Civilian_factory_union_desc: "La mayoría de los trabajadores de Invierno Rojo están empleados en la industria manufacturera. Para abogar por sus demandas y escuchar sus opiniones, es esencial promover activamente la creación de un sindicato de fábricas."
 RED_infrastructure_union: "Sindicato de Construcción"
 RED_infrastructure_union_desc: "Uno de los predecesores del actual parlamento, el 'Departamento de Servicios de Invierno Rojo', ha sido conocido por su experiencia en construcción civil desde sus días en Kivotos. Ellos serán de gran ayuda en la creación del sindicato de construcción."
 RED_gun_gaebal: "Sindicato de Medios"
 RED_gun_gaebal_desc: "El sindicato de medios, fundado por la redacción de 'El Oso Rojo', apoya la lucha de los periodistas y ha absorbido y consolidado todos los medios locales caídos para informar sobre la vida diaria en Invierno Rojo. El parlamento ha otorgado a Miyoshi Takane, el representante del sindicato, el título de 'Periodista del Pueblo' y ha elogiado la lucha del sindicato."
 RED_soldier_union: "Sindicato de Soldados"
 RED_soldier_union_desc: "Los soldados que luchan en el frente también necesitan unirse para resistir demandas injustas. El sindicato de soldados, fundado por los jóvenes héroes de la guerra revolucionaria, luchará por los derechos de los soldados."
 RED_mil-ind_complex: "Sindicato de Oficinistas"
 RED_mil-ind_complex_desc: "En el mundo occidental, los trabajadores de oficina viven oprimidos como si fueran piezas de una máquina. Nosotros daremos a estos 'trabajadores de oficina' el derecho de formar sus propios sindicatos y otorgaremos una mayor autonomía para fomentar su lucha."
 RED_education_union: "Sindicato de Educación"
 RED_education_union_desc: "Los maestros en las escuelas también tienen derecho a ser respetados como 'trabajadores educativos'. Si implementamos sus justas demandas de derechos y bienestar, en última instancia, mejoraremos la calidad de la educación."
 RED_combine_of_edu_and_labor: "Combinación de Educación y Trabajo"
 RED_combine_of_edu_and_labor_desc: "A diferencia de la educación en estados reaccionarios estratificados, la educación en Invierno Rojo es excelente en fomentar trabajadores eficientes y diligentes. Por lo tanto, también deberíamos permitir que nuestros estudiantes locales reciban la misma educación."
 RED_revolution_city: "Ciudad Revolucionaria"
 RED_revolution_city_desc: "Construir viviendas con tecnología avanzada y una infraestructura moderna cerca de los lugares de trabajo de los trabajadores y proporcionarlas a ellos y a sus familias. Una ciudad con todas estas aplicaciones puede llamarse justamente 'ciudad revolucionaria'."
 RED_housing_committee: "Comité de Desarrollo de Vivienda"
 RED_housing_committee_desc: "Si muchos de nuestro pueblo viven en tugurios por falta de vivienda, podrían desconfiar de nuestro gobierno. El Comité de Desarrollo de Vivienda, liderado por el sindicato de construcción, ha comenzado a trabajar en el desarrollo de terrenos en el campus y áreas cercanas para satisfacer la creciente población."
 RED_work_for_worker: "Hacia la Liberación del Trabajo"
 RED_work_for_worker_desc: "Durante un largo período en Invierno Rojo, luchamos contra los opresores y cambiamos estructuras sociales injustas para crear un estado para los trabajadores. Ahora, el amanecer de la liberación del trabajo está brillando en Invierno Rojo."
 
 RED_minori_diplo_0: "Aislacionismo Revolucionario"
 RED_minori_diplo_0_desc: "Las masas influenciadas por el liberalismo tienden a pensar que el aislamiento es algo anticuado, feudal y negativo sin contexto. Sin embargo, mantener el aislamiento es esencial para proteger la revolución. Cooperar o aliarse con regímenes o sistemas que oprimen a otras masas trabajadoras es una clara traición al pueblo y contraria a la revolución."
 RED_minori_diplo_1: "Autonomía"
 RED_minori_diplo_1_desc: "\"Estado autónomo por los trabajadores\""
 RED_minori_diplo_2: "Igualdad"
 RED_minori_diplo_2_desc: "\"Por una Invierno Rojo igualitaria!\""
 RED_minori_diplo_3: "Liberación"
 RED_minori_diplo_3_desc: "\"Trabajadores de todo Kivotos y del mundo, ¡uníos por la liberación!\""
 RED_minori_diplo_4: "La Marcha de las Dificultades"
 RED_minori_diplo_4_desc: "En Invierno Rojo, cada pocos años, una ola de frío sin precedentes trae consigo una gran hambruna. Aunque esta última gran hambruna fue manejada competentemente por nuestro gobierno sin mayores problemas, esta 'Marcha de las Dificultades' ha revelado deficiencias en nuestras políticas que necesitan ser corregidas."
 RED_minori_diplo_5: "Autosuficiencia Alimentaria"
 RED_minori_diplo_5_desc: "Después de sobrevivir a la mayor hambruna en la historia de Invierno Rojo, el desafío que queda es la autosuficiencia total en alimentos. Si repetimos los errores del pasado, el apoyo hacia nosotros disminuirá."
 RED_minori_diplo_6: "Preparativos para la Guerra Revolucionaria"
 RED_minori_diplo_6_desc: "Aunque el caos en Invierno Rojo está disminuyendo gradualmente, el mundo está cada vez más desordenado. Para enfrentar a los burgueses y imperialistas del mundo, debemos acelerar nuestros preparativos para la guerra revolucionaria que hemos estado promoviendo."
 RED_minori_diplo_6_tt: "\nSi ocurre una §Rguerra§! con §Y@TRM [TRM.getname]§!, dependiendo del número de enfoques completados §Y$RED_strengthen_the_mobilization_plan$§!, §Y$RED_cruiser_question$§!, §Y$RED_redwinter_moustache_airport$§!, se agregará el espíritu nacional de §YGuerra Revolucionaria§!."
 RED_minori_diplo_7: "Conferencia de Lucha Estudiantil"
 RED_minori_diplo_7_desc: "Con el lema de una unión autónoma y horizontal de grupos estudiantiles, la Conferencia de Lucha Estudiantil fue establecida por estudiantes de varias disciplinas que se reunieron para preservar el bienestar de Invierno Rojo. Su generoso apoyo ayudará en la preparación para la guerra revolucionaria."
 RED_minori_diplo_8: "Solidaridad con Organizaciones Extranjeras"
 RED_minori_diplo_8_desc: "Hay muchas organizaciones en el mundo luchando en la luz y en la sombra por la liberación de los trabajadores. Ya sea que estas organizaciones hayan sido fundadas por personas de Kivotos o por locales, si se mueven por la causa común de la liberación de los trabajadores, todos son camaradas, y tenemos el deber de apoyarlos."
 RED_minori_diplo_9: "Brigadas Rojas Voluntarias"
 RED_minori_diplo_9_desc: "Como reafirmamos una vez más en la Revolución del Día del Trabajo, la revolución esencialmente requiere de fuerza. Para ayudar a organizaciones en el extranjero que luchan por la autonomía de los trabajadores, hemos establecido brigadas voluntarias. Estas 'Brigadas Rojas', nombradas por sus distintivos uniformes militares rojos, incluyen a la mayoría de los héroes que participaron en la Revolución del Día del Trabajo."
 RED_minori_diplo_10: "Internacionalismo de los Trabajadores"
 RED_minori_diplo_10_desc: "Una guerra luchada con equipo fabricado por los trabajadores es, en última instancia, una lucha entre camaradas trabajadores. Por lo tanto, si estalla una guerra, debemos convencer a los trabajadores para que cesen el trabajo y, bajo la guía del Internacional de los Trabajadores, buscar terminar rápidamente la guerra y adelantar la caída de la clase capitalista."
 RED_minori_diplo_11: "Plan Finlandia Roja"
 RED_minori_diplo_11_desc: "Finlandia ha servido como un amortiguador entre nosotros y la Unión Soviética en el pasado. Sin embargo, ahora que la amenaza soviética se ha vuelto tangible, debemos considerar y revisar planes para traer Finlandia a nuestro lado."
 RED_minori_diplo_12: "Antimonopolio"
 RED_minori_diplo_12_desc: "Millennium está usando su abrumadora tecnología únicamente para su propio monopolio. No podemos ignorar más el desperdicio de tecnología para el beneficio de unos pocos."
 RED_minori_diplo_13: "Antinazismo"
 RED_minori_diplo_13_desc: "Ellos portan una peligrosa ideología de superioridad. Debemos proteger a aquellos que ellos definen como 'razas inferiores' de ser oprimidos."
 RED_minori_diplo_14: "Antibolchevique"
 RED_minori_diplo_14_desc: "Nos alegramos cuando hubo otro estado con nuestra ideología en este mundo. Pero traicionaron esos altos ideales. Los traidores deben ser eliminados."
 RED_minori_diplo_15: "Revolución Mundial"
 RED_minori_diplo_15_desc: "Hemos guiado a Invierno Rojo hacia un futuro brillante a través de la revolución. Pero no podemos detenernos aquí. Tenemos el deber de extender la sagrada revolución más allá de nuestras fronteras."
 RED_minori_diplo_16: "Antiimperialismo"
 RED_minori_diplo_16_desc: "Inglaterra y Francia se enorgullecen de las civilizaciones construidas a expensas de otros. Este erróneo pensamiento imperialista debe ser corregido."
 RED_minori_diplo_17: "Antifeudalismo"
 RED_minori_diplo_17_desc: "La idea de que un humano gobierne sobre otro es una ideología anticuada que debería haber sido abandonada hace mucho tiempo."
 RED_minori_diplo_18: "Antifascismo"
 RED_minori_diplo_18_desc: "Italia, como el estado fundador del fascismo, todavía está llevando a cabo una política exterior agresiva. Debemos luchar contra esta maligna ideología."
 RED_minori_diplo_19: "Antidictadura"
 RED_minori_diplo_19_desc: "Arona ocupó ilegalmente el Consejo Estudiantil General y llevó a cabo una dictadura. Esta loca IA debe ser detenida inmediatamente."
 RED_minori_diplo_20: "Anticapitalismo"
 RED_minori_diplo_20_desc: "Mientras el capitalismo, el enemigo de los trabajadores, prospere en Estados Unidos, la revolución no terminará. Empezando por Estados Unidos, la ola revolucionaria cruzará el océano."
 RED_minori_diplo_21: "§0Destrucción del Idealismo§!"
 RED_minori_diplo_21_desc: "Después de que apareció algo extraño, aquellos que lo vieron fueron lavados el cerebro. Debemos derrotar a este extraño ser para demostrar que aquellos que creen en lo espiritual están equivocados."


 
#Naval
 RED_cruiser_question: "Reactivación del Acorazado Noruego"
 RED_cruiser_question_desc: "Se informa que varios acorazados liberados de la antigua marina noruega han sido retirados y abandonados. Aunque son bastante anticuados según nuestros estándares, podrían volver a entrar en servicio con algunas modificaciones."
 RED_nortraship: "Aseguramiento de Transportes Civiles"
 RED_nortraship_desc: "Para la logística y el transporte rápido de tropas a distancias, debemos asegurar barcos de transporte civiles, incluso si esto implica un costo político significativo."
 RED_naval_rearmament: "Rearme Naval"
 RED_naval_rearmament_desc: "Los enemigos que amenazan a Red Winter no solo están en tierra y en el aire, sino también en el mar. Debido a nuestra posición geográfica, rodeada por tres costas, el rearme naval es urgente."
 RED_coastal_artillery: "Construcción de Fortificaciones Costeras"
 RED_coastal_artillery_desc: "A diferencia del este, que está bien defendido por su proximidad a varios países del Mar Báltico, la costa oeste, donde se encuentra la oficina central, está pobremente equipada. Es vital asegurar esta zona de encuentro entre el Mar del Norte y el estrecho danés."
 RED_large_navy: "Flota de Gran Escala"
 RED_large_navy_desc: "Para dominar los mares, necesitamos una flota poderosa. Ajustar nuestras doctrinas y avanzar en tecnología naval fortalecerá significativamente nuestras fuerzas."
 RED_light_cruisers: "Desarrollo de Cruceros Ligeros"
 RED_light_cruisers_desc: "Los cruceros ligeros, aunque no son los protagonistas en batallas navales, han demostrado ser extremadamente útiles en roles de apoyo. Esto justifica una inversión acelerada en su desarrollo."
 RED_heavy_cruisers: "Desarrollo de Cruceros Pesados"
 RED_heavy_cruisers_desc: "La presencia de cruceros pesados, capaces de realizar defensas efectivas, es esencial para controlar regiones más allá del Mar Báltico y dominar los océanos."
 RED_small_navy: "Flota de Ataque Rápido"
 RED_small_navy_desc: "Dada la capacidad industrial limitada de Red Winter para construir una gran flota, debemos adoptar y aprovechar doctrinas de ataque rápido especializadas en guerras de guerrillas en el mar."
 RED_submarines: "Desarrollo de Submarinos"
 RED_submarines_desc: "Los submarinos, construidos con tecnología avanzada, son difíciles de detectar y capaces de derribar enemigos mucho más grandes. Su uso maximizará nuestras posibilidades de supervivencia y efectividad en el relativamente poco profundo Mar Báltico."
 RED_destroyers: "Desarrollo de Destructores"
 RED_destroyers_desc: "Los transportes navales, responsables del suministro y transporte marítimo, son vulnerables a los submarinos. Desarrollar destructores es crucial para proteger estas líneas vitales."
 RED_controller_of_baltic: "Controlador del Mar Báltico"
 RED_controller_of_baltic_desc: "Hemos logrado asegurar el control definitivo sobre el Mar Báltico, una tarea que las antiguas potencias imperiales nunca lograron. Ahora podemos proclamarnos con orgullo como los señores del Mar Báltico."

#Rearme
 RED_rearming_focus_0: "Plan de Rearme"
 RED_rearming_focus_0_desc: "El ejército de Red Winter, debido a la transición y la resistencia feroz de los locales, ha perdido su antiguo prestigio. Con la ayuda de simpatizantes locales favorables a nuestro gobierno, debemos acelerar el rearme."
 RED_rearming_focus_1: "Incremento de la Producción de Material Militar"
 RED_rearming_focus_1_desc: "Como se ha dicho históricamente, almacenar material militar antes de un conflicto es crucial. Debemos construir nuevas fábricas fuera del campus para aumentar la producción de material militar."
 RED_rearming_focus_2: "Complejo Industrial"
 RED_rearming_focus_2_desc: "Cerca del antiguo campus de la academia en Yemtland hay terrenos vacíos. Estableciendo un complejo industrial allí y utilizando a los estudiantes problemáticos de la vieja academia para producir material militar, podemos aumentar significativamente nuestra producción."
 RED_rearming_focus_3: "Instalaciones de Producción Mejoradas"
 RED_rearming_focus_3_desc: "Después de un extenso desarrollo por parte del Frente de Liberación del Conocimiento, hemos logrado crear instalaciones de producción capaces de manejar eficientemente tanto el equipo de Kivotos como el de este mundo. El sector laboral ha mostrado gran interés en estas instalaciones y planea reemplazar todas sus instalaciones actuales con estas nuevas."
 RED_rearming_focus_4: "Consolidación de Arsenales"
 RED_rearming_focus_4_desc: "Las fábricas dispersas son ineficientes para la adquisición de material militar. Aunque centralizar los arsenales tiene desventajas, como una mayor vulnerabilidad a los ataques, es esencial para una adquisición de equipo más eficiente."
 RED_rearming_focus_5: "Distrito Industrial de Tundra"
 RED_rearming_focus_5_desc: "La región árida de la tundra parece infructuosa a primera vista, pero posee suficiente tierra para albergar complejos industriales. Utilizando nuestra tecnología, podemos transformar este terreno baldío en un distrito industrial productivo."
 RED_rearming_focus_6: "Sistema de Producción Masiva"
 RED_rearming_focus_6_desc: "Tras innumerables tareas repetitivas, los estudiantes del sector laboral encargados de la producción militar han ganado experiencia en el campo. Incluso han desarrollado su propio sistema de producción en masa, que están difundiendo a otras fábricas."
 RED_rearming_focus_6_tt: "Aumento de producción de fábricas: §G+3.00%§!"
 RED_rearming_focus_7: "Gestión Científica del Trabajo"
 RED_rearming_focus_7_desc: "El Frente de Liberación del Conocimiento ha propuesto un sistema de producción mejorado, centrado en el crecimiento de la eficiencia, que mejora el sistema desarrollado por el sector laboral. La adopción de este sistema promete un crecimiento industrial más eficiente."
 RED_rearming_focus_8: "Dedicación a la Producción"
 RED_rearming_focus_8_desc: "Es crucial producir más equipo militar en este momento. Aunque esto puede reducir la eficiencia de producción, en Red Winter siempre hemos priorizado la cantidad, y los resultados siempre han sido satisfactorios."
 RED_rearming_focus_8_tt: "Aumento de producción de fábricas: §G+5.00%§!\nCrecimiento de eficiencia de producción: §R-5.00%§!"
 RED_rearming_focus_9: "Economía de Escala"
 RED_rearming_focus_9_desc: "La industria militar se ha convertido en una economía propia dentro de Red Winter. Debemos expandir nuestras fábricas para mantener este auge económico."
 RED_rearming_focus_10: "Instituto de Ingeniería Social Laboral"
 RED_rearming_focus_10_desc: "La armonía entre el trabajo y la sociedad está directamente vinculada a la vida de la población. Para desarrollar políticas que equilibren estos dos aspectos de manera efectiva, necesitamos una base científica. La creación de un instituto dedicado a la ingeniería social laboral nos permitirá desarrollar políticas estables y sin agitación popular."
RED_rearming_focus_11: "Sacrificio Apasionado"
RED_rearming_focus_11_desc: "Si estallara una guerra, la vida de la población caería en la miseria. Si un pequeño sacrificio puede demostrar nuestro poder abrumador, disuadir la invasión de países vecinos y mantener la paz, entonces ese sacrificio será recordado como un acto noble."
RED_rearming_focus_12: "El Pulso de la Industria Bélica"
RED_rearming_focus_12_desc: "La economía militar de Red Winter ha entrado en su edad de oro. Numerosas fábricas están trabajando incansablemente para producir material militar, como si el corazón de un gigante latiera con fuerza. Una vez más, Red Winter ha superado las dificultades de la transición y ha dado un paso adelante."
RED_rearming_focus_13: "Fábrica de Artillería"
RED_rearming_focus_13_desc: "La artillería es el amigo más confiable de la infantería. Y muchos cañones garantizan muchas victorias. Deberíamos construir una fábrica de artillería para asegurarnos de que tenemos suficiente apoyo de artillería en tiempos de guerra."
RED_rearming_focus_14: "Planta de Energía"
RED_rearming_focus_14_desc: "La electricidad es esencial para la vida moderna. Deberíamos ampliar nuestras instalaciones de generación para asegurarnos de que nuestros trabajadores puedan trabajar bajo luces brillantes y cálidas."

RED_army_production_improve: "Cooperación Militar-Industrial-Académica"
RED_army_production_improve_desc: "Enemigos que amenazan a los trabajadores están en todas partes. Debemos investigar tecnología militar para garantizar que nuestros camaradas no vivan en el miedo."
RED_army_production_improve_tt: "Velocidad de investigación: §G+2.50%§!"
RED_strengthen_the_mobilization_plan: "Refuerzo de la Movilización"
RED_strengthen_the_mobilization_plan_desc: "Históricamente, el ejército de Red Winter ha operado sin un enfoque militarista adecuado, confiando principalmente en cargas de masa. Ahora es el momento de introducir una doctrina militar más refinada y elaborada en Red Winter."
RED_military_engineering: "Ingeniería de Guerra"
RED_military_engineering_desc: "La guerra en esta región tiene sus propias reglas. Si no nos adaptamos, seremos simplemente dejados atrás."
RED_artillery: "Artillería de Red Winter"
RED_artillery_desc: "Algunos oficiales de Red Winter han mostrado un profundo interés en la artillería, capaz de aniquilar enemigos a larga distancia."
RED_the_means_to_wage_war: "Investigación de Equipamiento de Soporte"
RED_the_means_to_wage_war_desc: "El equipo de apoyo desarrollado por la élite del Frente de Liberación del Conocimiento ayudará a quienes luchan en el campo de batalla."
RED_superior_war_machines: "Superioridad de los Tanques"
RED_superior_war_machines_desc: "La mayoría de los locales desconocen la potencia y la rapidez de los tanques. Sin embargo, aquellos que han luchado contra los contrarrevolucionarios conocen la superioridad de los tanques, y por eso debemos producir muchos."
RED_quantity: "'Cantidad'"
RED_quantity_desc: "Como Napoleón dijo una vez, siempre he vencido a la minoría con la mayoría."
RED_quality: "'Calidad'"
RED_quality_desc: "No es coincidencia que exista el término 'élite'."
RED_quantity_to_quality: "Ley de Transformación de Cantidad en Calidad"
RED_quantity_to_quality_desc: "La ley de transformación de cantidad en calidad, un concepto central del materialismo dialéctico, establece que cambios cuantitativos, después de alcanzar cierto umbral, provocan cambios cualitativos, llevando a un nuevo estado cualitativo. Estos cambios cualitativos, a su vez, llevan a una expansión cuantitativa."
RED_quantity_to_quality_tt: "Recibe la mitad de los efectos de las ideas nacionales §Y$RED_quantity$§! y §Y$RED_quality$§!:\n\n"
RED_tank_destroyer: "Destructor de Tanques"
RED_tank_destroyer_desc: "Por más poderosos que sean los soldados de Halo, hay límites al enfrentar tanques. Invertir en desarrollo de armas antitanque será extremadamente útil."
 RED_arms_industrial_optimize: "Optimización de la Industria Militar"
 RED_arms_industrial_optimize_desc: "La actual organización de nuestra industria militar es un completo caos. Necesitamos mantener la uniformidad en la producción militar."
 RED_baltic_forts: "Mecanización Táctica"
 RED_baltic_forts_desc: "Aquellos que mueren de un solo disparo han desarrollado 'automóviles blindados'. Con la escasez de misterios en nuestro mundo, también necesitamos esa tecnología."
 RED_defend_the_east_line: "Tecnología de Portaaviones"
 RED_defend_the_east_line_desc: "Los buques de guerra que combinan aviones son una tecnología tremendamente creativa en este mundo. Debemos adoptarla."
 RED_improve_the_south_line: "Motores a Reacción"
 RED_improve_the_south_line_desc: "¡Vaya! ¡No puedo creer que exista algo que permita volar a alta velocidad en el cielo! Esta tecnología aeronáutica, que rivaliza o incluso supera a Millennium, debe ser investigada."
 RED_through_the_road_of_snow: "A Través del Camino Nevado"
 RED_through_the_road_of_snow_desc: "Transportar suministros a través de la nieve hasta el frente de batalla es una tarea en la que ya somos expertos."
 RED_rehabilitated_military: "Gran Reforma en la Doctrina de Combate"
 RED_rehabilitated_military_desc: "Los profesores de ciencia militar recomiendan incorporar doctrinas de combate en la academia. Debemos aceptar sus consejos y llevar a cabo una gran reforma de la doctrina militar."
 RED_military_reorganization_tt: ""
 RED_trench_exp: "Entrenamiento en Guerra de Trincheras"
 RED_trench_exp_desc: "A diferencia de Kivotos, donde predominaban los combates urbanos, aquí la guerra de trincheras es la norma. Se necesita entrenamiento especializado para ello."
 RED_trench_exp_tt: "Velocidad de construcción de trincheras: §G+5.0%§!\nMáximo nivel de trincheras: §G+5.0§!\nDaño recibido por apoyo aéreo cercano: §G-5.0%§!"
 RED_an_adaptable_army: "Ejército Adaptable"
 RED_an_adaptable_army_desc: "Aunque el clima de este lugar es similar al de Red Winter, otras regiones presentan condiciones desconocidas para nosotros. Debemos preparar a nuestras tropas para adaptarse a distintos climas."
 RED_an_adaptable_army_tt: "Pérdidas por frío: §G-10.00%§!\nPérdidas por calor: §G-5.00%§!\nReducción de penalizaciones por terreno: §G+10.0%§!"
 RED_penal_battalions: "Ejército del Nuevo Mundo"
 RED_penal_battalions_desc: "Tras gastar inmensos recursos de tiempo y presupuesto en una gran reforma militar, el ejército de Red Winter ahora puede adaptarse con flexibilidad a las tácticas enemigas y ejecutar operaciones combinadas de manera efectiva."
 RED_shock_troops: "Entrenamiento en Coordinación"
 RED_shock_troops_desc: "El secreto para mover grandes ejércitos de forma orgánica es el entrenamiento. A través de ejercicios constantes, debemos fomentar la cooperación entre soldados."
 RED_restore_cossack_units: "'Disciplina'"
 RED_restore_cossack_units_desc: "A diferencia de un ejército mal entrenado, un ejército disciplinado puede desplegar su máximo potencial incluso en situaciones inesperadas."
 RED_restore_cossack_units_tt: "Ataque de divisiones de infantería: §G+5.0%§!\nVelocidad de la infantería: §G+5.00%§!"
 RED_cohesion_first: "'Entusiasmo'"
 RED_cohesion_first_desc: "Con suficiente fervor por la causa de Red Winter y la revolución, incluso obreros y campesinos comunes pueden unirse a nuestro ejército de invierno. Aunque su entrenamiento tomará tiempo, su cohesión basada en el entusiasmo igualará —o superará— a la de las tropas disciplinadas."
 RED_cohesion_first_tt: "Velocidad de movilización: §G+5.00%§!\nVelocidad de recuperación de las divisiones: §G+5.0%§!\nTiempo de entrenamiento: §R+10.00%§!"

 RED_army_focus_1: "Oficiales Profesionales"
 RED_army_focus_1_desc: "Los oficiales egresados de academias militares son talentos indispensables. Con su ayuda, debemos realizar una revisión completa de la doctrina militar de Red Winter."
 RED_army_focus_1_tt: "Velocidad de planificación: §G+10.0%§!\nCambio en población reclutable: §R-5%§!"
 RED_army_focus_2: "Prioridad en Suministros"
 RED_army_focus_2_desc: "Como dice el viejo proverbio, un ejército avanza gracias a sus suministros. Debemos establecer una red de suministro eficiente para minimizar las interrupciones ante imprevistos."
 RED_army_focus_2_tt: "Eficiencia de suministros: §G+10%§!"
 RED_army_focus_3: "Consejo de Soldados"
 RED_army_focus_3_desc: "La comunicación en organizaciones rígidas como el ejército puede ser ineficiente. Para solucionar este problema, estableceremos consejos de soldados que planificarán y ejecutarán operaciones."
 RED_army_focus_3_tt: "Máxima bonificación de planes: §R-5.0%§!\nVelocidad de planificación: §R-5.0%§!"
 RED_army_focus_4: "Operaciones de Gran Escala"
 RED_army_focus_4_desc: "A diferencia de otras academias de Kivotos, Red Winter se especializa en grandes contingentes de infantería. Para operarlos eficientemente, la colaboración entre ramas militares será clave."
 RED_army_focus_4_tt: "Ancho de combate de unidades subordinadas: §G-10.0%§!"
 RED_army_focus_5: "Control Centralizado"
 RED_army_focus_5_desc: "La planificación y preparación meticulosa son las mejores armas para la guerra. Para lograrlas, el control central debe ser absoluto."
 RED_army_focus_5_tt: "Máxima bonificación de planes: §G+10.0%§!"
 RED_army_focus_6: "Despliegue de Milicias"
 RED_army_focus_6_desc: "En medio de una guerra devastadora, algunos ciudadanos pueden ofrecerse como voluntarios para luchar en defensa de sus comunidades. Entrenaremos a estos patriotas para que sirvan eficazmente en el frente."
 RED_army_focus_6_tt: "Defensa de milicia Halo: §G+5.00%§!"
 RED_army_focus_7: "Principio del Centralismo Democrático"
 RED_army_focus_7_desc: "'Decidir de forma democrática y obedecer las decisiones adoptadas.'\n\nNo es complicado. Los soldados servirán con devoción a los planes de guerra establecidos mediante debate y votación."
 RED_army_focus_7_tt: "Defensa de divisiones de infantería: §G+5.00%§!"

#Enfoque en la Fuerza Aérea
 RED_invest_only_one_mio: "Invertir en un diseñador local"
 RED_invest_only_one_mio_desc: "Debido al impacto de la Gran Distorsión, la mayoría de los aviones fabricados en Kivotos ya no pueden utilizarse. Si invertimos en empresas locales, resolveremos la falta de fuerza aérea."
 RED_airforce_training_project: "Proyecto de Formación Aérea"
 RED_airforce_training_project_desc: "Aunque el nuevo mundo es similar al entorno natural de Red Winter, hay diferencias geográficas. Con la ayuda de oficiales locales, debemos formar una fuerza aérea adaptada al terreno."
 RED_redwinter_moustache_airport: "Aeropuerto 'Bigote' de Red Winter"
 RED_redwinter_moustache_airport_desc: "La aviación 'Bigote de Invierno Rojo' es uno de los símbolos de Red Winter. Reconstruir este lugar elevará el prestigio de nuestra academia."
 RED_extend_air_bases: "Expandir bases aéreas"
 RED_extend_air_bases_desc: "Incluso con pilotos bien entrenados y aviones modernos, no podremos operar eficientemente sin bases aéreas. Es momento de usar nuestra superior ingeniería civil para construirlas."
 RED_air_doctrine_focus: "Consolidar doctrina aérea"
 RED_air_doctrine_focus_desc: "Establecer una doctrina aérea adaptada a la situación de Red Winter permitirá una formación táctica más efectiva."
 RED_offensive_airforce: "Shock y pavor"
 RED_offensive_airforce_desc: "¿Qué arma puede destruir la capacidad de un enemigo para hacer la guerra penetrando profundamente en su territorio? Sólo los bombarderos pueden lograrlo."
 RED_defensive_airforce: "Superioridad aérea"
 RED_defensive_airforce_desc: "Tener el control del cielo es esencial para la victoria. Para proteger nuestras tropas y a nuestra gente, debemos asegurar la supremacía aérea."
 RED_air_bomber: "Enfocar en diseño de bombarderos"
 RED_air_bomber_desc: "La importancia de los bombarderos ya ha quedado demostrada. Nuestros nuevos diseños harán bombardeos más eficientes y devastadores."
 RED_air_fighter: "Enfocar en diseño de cazas"
 RED_air_fighter_desc: "Una gran cantidad de cazas puede conquistar el cielo aún contra oponentes tecnológicamente superiores. Aprovechando nuestra mano de obra, teñiremos el cielo de rojo."
 RED_redwinter_airforce: "Fuerza Aérea de Red Winter"
 RED_redwinter_airforce_desc: "Gracias a nuestros esfuerzos, hemos formado una fuerza aérea adaptada al nuevo mundo, con pilotos completamente entrenados y armados con doctrina flexible y equipos modernos."


#Enfoque en la Gran Guerra de Invierno
 RED_revolution_war_focus_0: "Guerra Santa Antifascista"
 RED_revolution_war_focus_0_desc: "¡La invasión fascista ha comenzado! Las tropas de Trinity cruzan nuestras fronteras y no se detendrán hasta destruirnos. Esta guerra es una cruzada para defender el socialismo: ¡lucharemos y venceremos, cueste lo que cueste!"
 RED_revolution_war_focus_1: "Movilización de guerra"
 RED_revolution_war_focus_1_desc: "Nuestra sociedad ha estado preparada para la guerra. Debemos convertir la industria civil en militar y enviar todos los suministros al frente rápidamente."
 RED_revolution_war_focus_2: "Transporte eficiente"
 RED_revolution_war_focus_2_desc: "Interrupciones en el transporte afectarían la velocidad de suministro. Aunque haya oposición, requisaremos medios civiles y mejoraremos las vías para mantener el flujo logístico."
 RED_revolution_war_focus_2_tt: "Velocidad de infantería: §G+3.00%§!\nConsumo de suministros: §G-3.0%§!\n\n"
 RED_revolution_war_focus_3: "Economía autosuficiente"
 RED_revolution_war_focus_3_desc: "Desde sus inicios, Red Winter ha luchado por sobrevivir sola. Ahora esa resiliencia brillará en nuestra guerra contra Trinity."
 RED_revolution_war_focus_4: "Comisarios en el frente"
 RED_revolution_war_focus_4_desc: "El horror de la guerra mina la moral. Los comisarios en el frente recordarán a nuestras tropas su propósito: proteger a su patria."
 RED_revolution_war_focus_5: "Rompeolas del pueblo"
 RED_revolution_war_focus_5_desc: "La única manera de sobrevivir es confiar y apoyarnos entre nosotros. Nuestra unidad será un rompeolas firme frente a las olas fascistas."
 RED_revolution_war_focus_6: "Centros de entrenamiento estudiantil"
 RED_revolution_war_focus_6_desc: "Cada vez más estudiantes se ofrecen voluntariamente para defender la patria. Expandiremos centros de formación para preparar a estos valientes."
 RED_revolution_war_focus_7: "Producción casera de fusiles"
 RED_revolution_war_focus_7_desc: "En Red Winter, es más fácil conseguir un arma que un bolígrafo. Todos, desde obreros hasta amas de casa, ensamblarán rifles para abastecer al frente."
 RED_revolution_war_focus_8: "Movilización masiva"
 RED_revolution_war_focus_8_desc: "Aunque miles ya marchan al frente, Trinity avanza. Debemos movilizar todas las reservas disponibles para detenerlos."
 RED_revolution_war_focus_9: "Levantamientos en zonas ocupadas"
 RED_revolution_war_focus_9_desc: "Nuestros soldados infiltrados en la retaguardia organizarán levantamientos con trabajadores y campesinos para atar a los invasores."
 RED_revolution_war_focus_9.5: "Tecnología antitanque"
 RED_revolution_war_focus_9.5_desc: "El núcleo de Trinity es su guerra relámpago blindada. Investigaremos y desplegaremos armas antitanque para contrarrestarla."
 RED_revolution_war_focus_10: "Defensa móvil"
 RED_revolution_war_focus_10_desc: "No podemos defender todo el territorio de manera estática. Con fuerzas móviles, elegiremos cuándo y dónde resistir, golpeando al enemigo cuando más duela."
 RED_revolution_war_focus_11: "Cazadores montañeses"
 RED_revolution_war_focus_11_desc: "Los cazadores de Jämtland, expertos en condiciones extremas, se unen a nuestra lucha. Son nuestros mejores francotiradores."
 RED_revolution_war_focus_12: "Superioridad en potencia de fuego"
 RED_revolution_war_focus_12_desc: "Aunque la tecnología de Trinity nos supere, ninguna armadura soportará un proyectil de artillería. Necesitamos más fuerza asimétrica."
 RED_revolution_war_focus_12.5: "Tácticas antiaéreas"
 RED_revolution_war_focus_12.5_desc: "Aunque contenemos a su ejército, los ataques aéreos dañan nuestra industria. Urge desarrollar tácticas de defensa antiaérea."
 RED_revolution_war_focus_13: "Fábricas a plena capacidad"
 RED_revolution_war_focus_13_desc: "La guerra también se libra en casa. Todos trabajan, desde niños hasta ancianos, fabricando suministros para nuestros soldados."
 RED_revolution_war_focus_14: "Uso efectivo de blindados"
 RED_revolution_war_focus_14_desc: "Para contrarrestar los avances enemigos, desplegaremos unidades blindadas que aseguren el terreno y refuercen los puntos vulnerables."
 RED_revolution_war_focus_15: "Contraataque"
 RED_revolution_war_focus_15_desc: "Trinity está exhausta y su moral cae. ¡Es hora de lanzar nuestra ofensiva y devolverles la violencia que sembraron!"
 RED_revolution_war_focus_16: "Fortificación nacional"
 RED_revolution_war_focus_16_desc: "Nuestra península boscosa es una fortaleza natural. Al fortificar los puntos estratégicos, ralentizaremos enormemente cualquier avance enemigo."
 RED_revolution_war_focus_17: "Guerra de partisanos"
 RED_revolution_war_focus_17_desc: "Nuestros partisanos hostigan sin cesar a los enemigos en la retaguardia, obligando a Trinity a librar una guerra en dos frentes."

 
 RED_revolution_war_focus_2_tt: "Velocidad de infantería: §G+3.00%§!\nConsumo de suministros: §G-3.0%§!\n\n"

