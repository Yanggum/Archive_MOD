 RED_first_AEP: "Primer Plan de Economía Alternativa"
 RED_first_AEP_desc: "La colectivización radical y la nacionalización no son la solución para nuestra situación actual. En este contexto de 'economía de guerra', se necesita una política económica alternativa. El 'Plan de Economía Alternativa' modifica nuestras políticas socialistas tradicionales integrando elementos de mercado, impulsando así el crecimiento de pequeñas y medianas empresas y estableciendo una base industrial más sólida."
 RED_second_AEP: "Segundo Plan de Economía Alternativa"
