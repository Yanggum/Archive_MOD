l_spanish:
 
#소개문구
RED_country_intro_header: "¡El honor de enfrentar la autoridad más alta!"
RED_country_intro_content: "La Academia Federal de Invierno Rojo es una mega-academia que posee un campus amplio comparable a las tres principales academias de Kibotos y muchos estudiantes. Ha mantenido el orden y el equilibrio bajo la guía del gran presidente del consejo estudiantil, Renka, y Cherino. Sin embargo, debido a revoluciones diarias por razones triviales y bajo intercambio con otras academias, la reputación y la situación financiera de la academia han estado en declive. \n\nEl repentino gran conflicto ha cambiado completamente el destino del Invierno Rojo, que se estaba volviendo cada vez más inestable. Las frecuentes revoluciones y huelgas del servicio de seguridad han debilitado la industria del Invierno Rojo, y el vacío causado por el gran conflicto ha infligido un golpe fatal a la ya debilitada base industrial. Con el tiempo, la escasez de materiales debido al cese de la producción en las instalaciones de la academia se intensificó y, para empeorar las cosas, la aparición repentina del Invierno Rojo hizo que los locales y los gobiernos existentes perdieran territorios y respondieran militarmente, sumiendo a la academia en un pantano aún más profundo. Finalmente, bajo el liderazgo del presidente de seguridad, Ikekura Marina, se inició una operación a gran escala para suprimir a los 'elementos impuros', y justo después de que comenzara a reducir su poder, la secretaria en jefe, Sashiro Tomoe, ordenó el establecimiento de administraciones civiles en las áreas ocupadas. Sin embargo, esto se detuvo junto con la intensificación de los problemas internos. \n\nMientras tanto, un hombre que se presentó como Lev Trotsky se puso en contacto con la secretaría, proponiendo que si cooperaban con él, ofrecería una solución a los problemas internos del Invierno Rojo. Mientras la secretaría vacilaba ante esta sospechosa oferta, el Invierno Rojo se envolvía en llamas de caos. Ya descontentos con la tiranía de Cherino, el jefe de seguridad Yasumori Minori y su departamento de seguridad se declararon en huelga total, y los locales que se oponían a la secretaría también simpatizaron con esto y expandieron su poder. Por otro lado, los elementos impuros dentro de la secretaría, liderados por Ikekura Marina, fueron purgados uno tras otro, pero si no se vislumbra una solución, su lealtad podría eventualmente tambalearse. \n\nLa mayoría de los golpes de estado en Kibotos que ocurrieron en Invierno Rojo terminaron con la restauración de Cherino. Pero esta vez es diferente. Si no se puede calmar el caos dentro de la academia, cuando ocurra otro golpe de estado, nadie sabe cómo fluirá esta vez...\n\n§YDesarrollado por: Jamm, satsuji, SKSKle, Afimage§!" # Honestamente, AFIMAGE hizo el 80% \n            # ㄴ Lo reconozco ㄹㅇ
RED_guide: "Adopción del trotskismo\n\n£white_dot Reúna a los opositores de izquierda exiliados.\n£white_dot Media la lucha por el poder entre Lev Trotsky, Renka y Cherino.\n£white_dot Únete a Trotsky en la revolución mundial y recupera la Unión Soviética.\n£white_dot Arma a Cherino con ideología de izquierda a través de la lectura.\n\n\nHuelga general de febrero\n\n£white_dot Derriba el corrupto y decadente secretariado.\n£white_dot Reconstruye el Invierno Rojo y declara un nuevo sistema.\n£white_dot Da tierras a los campesinos, fábricas a los trabajadores y libertad a los estudiantes.\n£white_dot ¡Avanza hasta que el último hombre sea liberado!\n\n\nPersiguiendo la integridad ideológica | §YIncompleto§!\n\n£white_dot Expone la hipocresía de los opresores y declara auténtico marxismo-leninismo.\n£white_dot Tritura completamente a los contrarrevolucionarios y a los extremistas de izquierda.\n£white_dot Con una línea unificada y el partido de vanguardia, logra un desarrollo deslumbrante.\n£white_dot Rompe el frente dual de capitalismo-fascismo bajo la unidad del comunismo mundial.\n\n§R¡Encuentra la estrella polar de la revolución!§!"


   RED_GATHERING_STORM_DESC: "La Academia Federal del Invierno Rojo originalmente enfrentaba una revolución o un golpe de estado al menos una vez a la semana, lo que solía resultar en la destitución del presidente del consejo estudiantil. Y el final siempre era el retorno al puesto de secretario general de Cherino. \n\nEl gran conflicto ha cambiado completamente el ambiente del Invierno Rojo. La academia se ha enfrentado a una crisis sin precedentes, y la torpe respuesta de Cherino ha hecho que los estudiantes duden de su competencia como secretaria general. \n\nSe aproxima un golpe de estado que rodea la posición dentro de la academia. Sin embargo, en la próxima destitución, es difícil garantizar su regreso."

