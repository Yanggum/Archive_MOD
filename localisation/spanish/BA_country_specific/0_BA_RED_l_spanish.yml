RED_new_economy_focus_14: "Desarrollo de tierras"
RED_new_economy_focus_15: "Enfoque en la minería de recursos"
RED_new_economy_focus_16: "Modernización agrícola"

RED_economy_focus_0: "Expansión de clubes de ciencias e ingeniería"
RED_economy_focus_0_desc: ""
RED_economy_focus_1: "Desarrollo de la región de Tundra"
RED_economy_focus_1_desc: "Ahora es simplemente un terreno inútil y frío, pero dejarlo así es solo un desperdicio de territorio. Invertiremos en infraestructura para sentar las bases del desarrollo industrial del norte."
RED_economy_focus_2: "[142.getname] Mina de aluminio"
RED_economy_focus_2_desc: "Mejoraremos la extracción de aluminio para avanzar hacia la autosuficiencia de recursos."
RED_economy_focus_3: "Incorporación de burócratas técnicos locales"
RED_economy_focus_3_desc: "Aún hay muchas industrias locales válidas en el lugar donde nos hemos trasladado. Si las desarrollamos, habrá un beneficio industrial significativo."
RED_economy_focus_5: "Plan de desarrollo rural"
RED_economy_focus_5_desc: "Desarrollaremos la agricultura, uno de los sectores industriales clave, a través de nuestro plan de desarrollo rural."
RED_economy_focus_6: "Apoyo a la mecanización agrícola"
RED_economy_focus_6_desc: "Todos los campesinos podrán avanzar hacia una mayor producción al arar sus campos con tractores."

RED_economy_focus_8: "Plan de la industria de bienes de consumo"
RED_economy_focus_8_desc: "La escasez de bienes de consumo está acercándose a una catástrofe. Debemos resolver esto."
RED_economy_focus_9: "Primera política económica alternativa"
RED_economy_focus_9_desc: "La radicalización de la colectivización y la nacionalización definitivamente no son soluciones para la situación actual. En tiempos de 'guerra' industrial actual, se necesita una política económica alternativa. Literalmente, la 'política económica alternativa' es una modificación de la política económica socialista original que incorpora elementos de mercado, a través de la cual fomentaremos las pequeñas y medianas empresas y estableceremos una infraestructura industrial sólida."
RED_economy_focus_10: "Apoyo a las empresas privadas"
RED_economy_focus_10_desc: "Con la administración en un estado de parálisis, no todas las empresas pueden ser operadas por la academia. Delegaremos la industria a varias empresas privadas."
RED_economy_focus_11: "Recuperación de la industria marítima"
RED_economy_focus_11_desc: "Esta tierra que hemos ocupado tiene acceso a mucha costa. La inversión en el océano es una inversión en esta tierra."

RED_economy_focus_13: "Activación del comercio"
RED_economy_focus_13_desc: "Aunque el Invierno Rojo ha optado por el aislacionismo político, el comercio es esencial para la existencia del estado. Levantaremos la prohibición de comercio en áreas limitadas para importar los recursos que faltan en nuestro país."
RED_economy_focus_14: "Segunda política económica alternativa"
RED_economy_focus_14_desc: "Con el éxito de la primera política económica alternativa, hemos demostrado con éxito la competencia de nuestro gobierno. No nos detendremos ahí, y mejoraremos los puntos débiles de la primera política económica alternativa y maximizaremos sus ventajas con la 'Segunda política económica alternativa'."
RED_economy_focus_15: "Reforma monetaria"
RED_economy_focus_15_desc: "El sistema monetario diferente en Kibotos y el local ha causado un gran trastorno en la industria financiera. Debemos apresurarnos con la reforma monetaria para calmar este caos."
RED_economy_focus_16: "Bienestar selectivo"
RED_economy_focus_16_desc: "Una de las principales agendas de la segunda política económica alternativa es el bienestar selectivo. Priorizaremos el apoyo a los grupos económicamente vulnerables para ayudar en su reintegración social."
RED_economy_focus_17: "Socialismo de mercado"
RED_economy_focus_17_desc: ""
RED_economy_focus_18: "Cultivo de cultivos comerciales"
RED_economy_focus_18_desc: "La agricultura no solo sirve para la autosuficiencia alimentaria. Los cultivos comerciales son riqueza."
RED_economy_focus_19: "Agricultura comercial"
RED_economy_focus_19_desc: "Delegaremos la gestión agrícola a comerciantes para que podamos buscar una mayor reproducción de capital."
RED_economy_focus_20: "Industria pesquera y acuicultura"
RED_economy_focus_21: "Movimiento del Caballo Rojo"
RED_economy_focus_22: "Economía cooperativa"
RED_economy_focus_23: "Banco central independiente"
RED_economy_focus_24: "Empleo flexible"
RED_economy_focus_25: "Capitalismo rural"
RED_economy_focus_26: "Pueblo Folkehmet"
RED_first_aep_tt: "Este enfoque es parte de la §tPrimera política económica alternativa§!.\n\n"
RED_second_aep_tt: "Este enfoque es parte de la §tSegunda política económica alternativa§!.\n\n"
RED_economy_focus_27: "Regulación intensificada"

RED_club_focus_0: "Oficina de Computación del Invierno Rojo"
RED_club_focus_0_desc: "Es necesario restaurar la academia que se ha detenido debido al gran conflicto. Primero, necesitamos restaurar la capacidad administrativa paralizada."
RED_club_focus_1: "Reconstrucción del Departamento de Alimentación"
RED_club_focus_1_desc: "Incluso si la administración se restaura y la academia vuelve a funcionar, si no resolvemos el problema fundamental de la alimentación, colapsaremos nuevamente. Reconstruyamos el Departamento de Alimentación para evitar lo peor."
RED_club_focus_2: "Recuperación del control de los clubes"
RED_club_focus_2_desc: "¡Debemos controlar la amenaza desenfrenada de los clubes!"
RED_club_focus_3: "Reconstrucción del edificio antiguo"
RED_club_focus_3_desc: "Después del gran conflicto, surgió la necesidad de reconstruir el edificio antiguo donde se congregan los problemáticos. Reconstruyamos el edificio antiguo para demostrar que la academia no tiene problemas."
RED_club_focus_4: "Seducir a la clase especial 227"
RED_club_focus_4_desc: "Nosotros seduciremos a la clase especial 227 para que contribuyan a la academia."
RED_club_focus_5: "Apoyo a las humanidades y ciencias sociales"
RED_club_focus_5_desc: "\"Sin matemáticas no se puede realizar una cuantificación precisa ni astronomía, sin química no se puede hacer hierro correctamente, y sin teología no se puede pensar correctamente sobre religión.\" - John Hall\n\nY sin filosofía y sociología, no se puede clamar por la liberación. Elevaremos el nivel de conocimiento de la sociedad en general a través de la educación superior para los trabajadores!"
RED_club_focus_6: "Vanguardia artística"
RED_club_focus_6_desc: "La creación es una continua agonía. Debemos romper los moldes familiares y abrir nuevos horizontes para desencadenar una revolución infinita en nuestra imaginación. ¡Solo después de negar, desmontar y pisotear todas las realidades, experiencias, nociones y conocimientos se logrará la verdadera liberación!"
RED_club_focus_7: "Realismo"
RED_club_focus_7_desc: "Debemos ser capaces de ver crítica y realísticamente a través de los ojos de 'literatura realista' la estructura capitalista y feudal. Toda transformación comienza con percepción y evaluación."
RED_club_focus_8: "Literatura comercial"
RED_club_focus_8_desc: "La pluma es más poderosa que la espada. Además, da dinero. Invertiremos la excepcional capacidad de escritura de la academia en el comercio."
RED_great_punch: "Un gran golpe"
RED_great_punch_desc: "Desesperadamente necesitamos un arma poderosa en caso de emergencia."
RED_rocket_romance: "Romance de cohetes"
RED_rocket_romance_desc: "La tecnología de cohetes se puede considerar la suma total de todas las ciencias y tecnologías."
RED_club_focus_9: "Frente de Liberación del Conocimiento"
RED_club_focus_10: "Universidad Pública del Invierno Rojo"
RED_club_focus_11: "Balneario de la habitación 227"
RED_club_focus_11_tt: "§Y[THIS.getname]§!(se) convertirá en almirante."
BA_onsen: "Balneario"

# Enfoque de la secretaría
RED_our_leader_cherino: "Nuestra líder, Cherino"
RED_our_leader_cherino_desc: "La gran líder del Invierno Rojo, Cherino, ha estado manejando el caos del gran conflicto y es la única líder que puede hacer grande nuestra academia nuevamente. Aunque haya propaganda falsa de los reaccionarios, nosotros confiamos en Cherino sin dudarlo, la seguimos y luchamos contra todos los burgueses del mundo."
RED_accept_trotskism: "Alternativa al comunismo soviético"
RED_accept_trotskism_desc: "Después del gran conflicto, nuestra academia ha estado compitiendo por el puesto de estado y líder del comunismo internacional que antes ocupaba la llamada Unión Soviética. Para resolver esta situación, la camarada Cherino personalmente ofreció un puesto en la secretaría del Invierno Rojo a un extraño exiliado llamado Trotsky. Aunque es temprano para confiar en él, sería mejor confiar en la elección de la camarada Cherino."
RED_the_fourth_international: "La Cuarta Internacional"
RED_the_fourth_international_desc: "Lo que se llama la Tercera Internacional bajo los estalinistas no tiene nada que ver con las teorías de Marx y Lenin, y distorsiona el estado de los trabajadores democráticamente controlado en una distopía. ¡Lo que necesitamos es una nueva internacional que los desafíe!"
RED_restore_the_security: "Restauración de la seguridad"
RED_restore_the_security_desc: "Actualmente en el Invierno Rojo, el pueblo leal está mezclado con los reaccionarios. Si restauramos la agencia de seguridad, que se rompió debido al gran conflicto, y apoyamos su funcionamiento, podremos llevar a cabo el mantenimiento del orden con eficacia."
RED_locals_problem: "Control de la administración militar"
RED_locals_problem_desc: "Es hora de gestionar seriamente las administraciones militares que la Academia Federal del Invierno Rojo ha obtenido como resultado de la gran guerra revolucionaria desencadenada después del gran conflicto. La violenta dominación actual debe ser derribada, y finalmente, toda Escandinavia debe unirse a nuestra academia."
RED_locals_problem_tt: "\n§L¡Erradicación de la corrupción dentro de la administración militar!§!\n\n"
RED_depress_locals: "Política de reubicación forzosa"
RED_depress_locals_desc: "Reubicaremos a toda la población local forzosamente a lugares más controlables por nosotros, y llenaremos esos espacios con estudiantes y residentes autónomos del Invierno Rojo para lograr una integración efectiva y rápida."
RED_enticing_locals: "Establecimiento de repúblicas autónomas"
RED_enticing_locals_desc: "No solo el látigo es necesario para la gente, también es necesaria una zanahoria adecuada. Terminaremos con la opresión excesiva de la agencia de seguridad hacia los locales y estableceremos un gobierno autónomo local para ajustar la relación entre nosotros y los locales y liderar un sistema estable."
RED_enticing_locals_tt: "§Y$RED_social_reform$§! y otros sistemas de enfoque cambiarán.\n\n"
RED_redwinter_office: "Oficina del Invierno Rojo"
RED_redwinter_office_desc: "La oficina del Invierno Rojo es la principal institución administrativa de la academia federal. Después del gran conflicto que rompió el sistema administrativo regional, debemos hacer todo lo posible para restaurar la industria y la política de la academia a un estado normal."
RED_redbear_editorial: "Editorial del Oso Rojo"
RED_redbear_editorial_desc: "Hay un gran agujero en nuestra administración y el proceso está lleno de corrupción. A pesar de eso, lo que es afortunado es que la única institución de prensa que existe en esta academia está de nuestro lado. Aunque es una medida temporal, será la mejor manera de calmar las quejas por un tiempo."
RED_heros_at_front: "Héroes del frente"
RED_heros_at_front_desc: "Aquellos que han ido al frente en nuestro lugar y están luchando son dignos del título de héroes. El presidente Cherino elogia su dedicación y ha ordenado agregar un pudín a la dieta de los héroes como un beneficio glorioso."
RED_welcome_immigrate: "Aceptación del Partido Comunista local"
RED_welcome_immigrate_desc: "Utilizaremos activamente a las organizaciones locales que simpatizan en parte con nuestra causa."
RED_welcome_thugs: "Colocación forzosa de trabajadores migrantes"
RED_welcome_thugs_desc: "Necesitamos transportar y desplegar mano de obra de diversas regiones para alcanzar los objetivos de nuestros complicados planes industriales. Los trabajadores migrantes ahora serán asignados a la construcción de ciudades planificadas y la expansión de instalaciones industriales."

RED_kivotos_halo_militia_add-10_tt: "§C¡Milicia Halo§! de §YKivotos§! §R¡límite de tamaño reducido§!: §R-10§!\n"
RED_kivotos_halo_militia_add1_tt: "§C¡Milicia Halo§! de §YKivotos§! §G¡límite de tamaño incrementado§!: §G+1§!\n"
RED_kivotos_halo_militia_add2_tt: "§C¡Milicia Halo§! de §YKivotos§! §G¡límite de tamaño incrementado§!: §G+2§!\n"
RED_kivotos_halo_militia_add3_tt: "§C¡Milicia Halo§! de §YKivotos§! §G¡límite de tamaño incrementado§!: §G+3§!\n"
RED_kivotos_halo_militia_add6_tt: "§C¡Milicia Halo§! de §YKivotos§! §G¡límite de tamaño incrementado§!: §G+6§!\n"
RED_enlarge_secret_police: "Expansión de la policía secreta"
RED_enlarge_secret_police_desc: "No podemos depender solo de la administración militar para mantener el orden interno. Centralizar y administrar de manera descendente las operaciones de seguridad dispersas fortalecerá el control."
RED_enlarge_secret_police_tt: "§Y¡La inestabilidad en la administración militar§! §Gdisminuirá§!:\n\n"
RED_enemy_of_class: "Enemigos de la clase"
RED_enemy_of_class_desc: "A pesar de nuestros esfuerzos para avanzar juntos hacia una nueva sociedad, todavía hay elementos pequeño-burgueses reaccionarios en la región que intentan obstaculizar esto de manera contrarrevolucionaria. ¡Declararemos a estos individuos como 'enemigos de la clase' y triunfaremos en esta lucha!"
RED_industry_of_mil_gov: "Industrialización del área de gobierno militar"
RED_industry_of_mil_gov_desc: "Las investigaciones muestran que las áreas que mantenemos como administraciones militares ya están bastante industrializadas. Si industrializamos el área de gobierno militar directamente desde el centro, no solo fortaleceremos el control sobre la administración militar, sino que también aumentaremos significativamente la capacidad industrial de la academia."
RED_develope_local_industry: "Desarrollo industrial local"
RED_develope_local_industry_desc: "Debemos admitir que nuestra capacidad es insuficiente para adoptar una economía planificada. Debemos otorgar una considerable autonomía a los locales."
RED_develope_local_industry_tt: "Enfocado en §Y¡mejorar la eficiencia industrial§! de la región."
RED_local_economic_plan: "Plan económico local descendente"
RED_local_economic_plan_desc: "Un plan industrial bien diseñado es más útil que cualquier otra cosa."
RED_local_economic_plan_tt: "Enfocado en la §G¡industrialización§! de la región."
RED_social_reform: "Reforma social"
RED_social_reform_desc: "La industrialización no debe terminar solo en los sectores económico e industrial. Reformaremos el sistema educativo y cultural previo capitalista y lograremos la industrialización material y espiritual simultáneamente."
RED_develop_re1: "Reforma de Dinamarca"
RED_develop_re1_desc: "Se ha completado un plan detallado según la región de implementación."
RED_develop_re2: "Reforma de Noruega"
RED_develop_re2_desc: "Se ha completado un plan detallado según la región de implementación."
RED_develop_re3: "Reforma de Sapmi"
RED_develop_re3_desc: "Se ha completado un plan detallado según la región de implementación."

RED_horizontal_intergration: "Integración horizontal"
RED_horizontal_intergration_desc: "Es ineficiente tener múltiples agencias manejando el mismo trabajo simultáneamente. Nos prepararemos para una fusión horizontal."
RED_intergrate_re1: "Integración industrial de Dinamarca"
RED_intergrate_re1_desc: "Se ha completado un plan detallado según la región de implementación."
RED_intergrate_re2: "Integración industrial de Noruega"
RED_intergrate_re2_desc: "Se ha completado un plan detallado según la región de implementación."
RED_intergrate_re3: "Integración industrial de Sapmi"
RED_intergrate_re3_desc: "Se ha completado un plan detallado según la región de implementación."

RED_advance_security: "Fortalecimiento de la agencia de seguridad"
RED_advance_security_desc: "La agencia de seguridad ha llevado a cabo misiones ordenadas por la secretaría de manera perfecta y diligente, y merecen más apoyo y más pudín."
RED_advance_security_tt: "§t¡Ganar en el juego Snake§! §G¡y asegurar la victoria§!."
RED_end_of_counter_revolution: "Fin de la contrarrevolución"
RED_end_of_counter_revolution_desc: "No podemos seguir operando el estado bajo la amenaza constante de golpes de estado y guerras civiles. Un poder administrativo más fuerte y rápido es necesario para eliminar todas estas amenazas."
RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs: "Ascenso de la agencia de seguridad a Ministerio del Interior"
RED_elevation_of_the_security_bureau_to_the_ministry_of_internal_affairs_desc: "La agencia de seguridad ahora funcionará como un ministerio del interior, no solo manteniendo el orden sino también asegurando la seguridad del estado."
RED_socialism_over_the_world: "Revolución Permanente"
RED_socialism_over_the_world_desc: "El marxismo dice que si las condiciones son adecuadas, la revolución es inevitable. Sin embargo, hay casos donde las condiciones no apoyan completamente, y aunque las condiciones apoyen, no es aplicable en todos los lugares. No podemos conformarnos con la realidad mientras esperamos una revolución que podría ocurrir en algunos siglos. Ahora mismo, los trabajadores y campesinos de todo el mundo están sufriendo y no podemos esperar para su liberación."
RED_the_builder_of_the_winter_army: "El constructor del Ejército de Invierno"
RED_the_builder_of_the_winter_army_desc: "Bajo la dirección del camarada Trotsky, un destacado revolucionario y antiguo adversario político de Stalin, la reforma militar del Invierno Rojo está progresando más rápidamente!"
RED_the_builder_of_the_winter_army_tt: "\n§Y$RED_restore_cossack_units$§! o §Y$RED_cohesion_first$§! Se completarán aleatoriamente tres enfoques del sistema."
RED_collectivist_economy: "Economía Colectivista"
RED_collectivist_economy_desc: "Nos alejaremos rápidamente del modo de producción capitalista."
RED_strengthen_heavy_industry: "Fortalecimiento de la industria pesada"
RED_strengthen_heavy_industry_desc: "La industria pesada es el corazón de nuestra economía. Si queremos que la revolución no solo sobreviva sino que tenga éxito, debemos fortalecer aún más el sector de la industria pesada."
RED_strengthen_heavy_industry_tt: "\n§L¡Erradicación de la corrupción en el sector de producción!§!\n\n"
RED_agricultural_collectivization: "Colectivización agrícola"
RED_agricultural_collectivization_desc: "La colectivización agrícola de Stalin fue motivada políticamente y no siguió el análisis social ni la teoría revolucionaria. Sin embargo, tenemos a Trotsky y sus capaces teóricos con nosotros, y junto a ellos, superaremos la 'fallida' colectivización agrícola de Stalin y lograremos una verdadera agricultura colectiva."
RED_system_decentralization: "Descentralización del sistema"
RED_system_decentralization_desc: "Stalin no solo centralizó el partido sino también el estado entero en sí mismo. Esto fue claramente un enfoque contrarrevolucionario que robó el poder de los trabajadores. En nuestro Invierno Rojo, por el contrario, permitiremos que los trabajadores decidan su propio destino."
RED_strengthen_the_trade_unions: "Fortalecimiento de los sindicatos"
RED_strengthen_the_trade_unions_desc: "Bajo la dirección de Stalin, los sindicatos, que deberían representar a los trabajadores en oposición a la gestión, se transformaron en herramientas de gestión que dirigen a los trabajadores y, en realidad, impidieron que los trabajadores obtuvieran los beneficios de la revolución. Afortunadamente, los trabajadores aquí son muy democráticos y autodidactas."
RED_large_administrative: "Administración amplia"
RED_large_administrative_desc: "Necesitamos reestablecer el control sobre la administración insuficiente en áreas rurales."
RED_large_administrative_tt: "\n§L¡Erradicación de la corrupción en áreas rurales!§!\n\n"
RED_strengthen_regional_party: "Fortalecimiento del partido regional"
RED_strengthen_regional_party_desc: "Dando más autonomía a las organizaciones de base del partido, nos acercamos un paso más a la democracia de abajo hacia arriba."
RED_long_live_the_workers_government: "Asegurar la producción de pudín"
RED_long_live_the_workers_government_tt: "\n¡Asegurar un suministro adicional de §Ypudín§!."
RED_long_live_the_workers_government_desc: "Lo más importante ahora es el bienestar. Primero aseguraremos el apoyo de las masas antes de implementar políticas."
RED_got_pudding_flag_tt: "\n¡No se ha asegurado un suministro adicional de §Ypudín§!:\n"
RED_all_power_to_redwinter: "¡Todo el poder a los soviets!"
RED_all_power_to_redwinter_tt_1: "§gEn todos los lugares de trabajo, en todas las zonas rurales, desde las casas de té hasta las plazas, ¡están llenas de discursos sobre una nueva sociedad!§!"
RED_all_power_to_redwinter_desc: "El 'soviético', o consejo, que es un órgano para la participación social del pueblo, ya no debe ser controlado por la secretaría. Por el contrario, la secretaría ahora debe estar bajo el control del soviético. Como dice el dicho, \"¡Todo el poder a los soviets!\""
RED_all_power_to_redwinter_tt: "§YLongitud de la cola§! es §Y5§! o más"
RED_all_power_to_redwinter_tt_2: "\nSe obtienen hasta §G3§! §Yfábricas civiles§! dependiendo de la §YLongitud de la cola§! que exceda de §Y5§!:\n"
RED_invite_trotskists: "Invitar a los trotskistas"
RED_invite_trotskists_desc: "Trotsky tiene sus seguidores. Desde que perdió el poder en la Unión Soviética, han estado exiliados o se han escondido en todo el mundo. Deberíamos convocarlos aquí para trabajar junto a él."
RED_expand_publishing_dep: "Expansión del departamento editorial"
RED_expand_publishing_dep_tt: "§Y$RED_cherino$§! §RConocimiento comunista de §YCherino§! es §Y6§! o más (actual: §Y[?RED_cherino_communism_knowledge]§!)"
RED_expand_publishing_dep_desc: "El mundo de Isekai está lleno de noticias falsas, al igual que en la Escuela Cronos. Solo el 'Oso Rojo', publicado únicamente por el departamento editorial, es un medio de comunicación veraz, y necesitamos publicar más de él para expandir el departamento editorial."
RED_socialist_press: "Prensa socialista"
RED_kill_editorial: "Debilitamiento del departamento editorial"
RED_kill_editorial_tt: "§L¡Erradicación de la corrupción dentro del departamento editorial!§!\n\n"
RED_merger_of_educational_institutions: "Absorción completa de instituciones educativas"
RED_merger_of_educational_institutions_desc: "Las políticas educativas occidentales llenas de pensamiento burgués no son necesarias en el Invierno Rojo. Eliminaremos todas las instituciones educativas que fomenten la reacción y transmitiremos el método educativo del Invierno Rojo a todas las instituciones educativas."
RED_merger_of_educational_institutions_tt: "\n§L¡Erradicación de la corrupción dentro de las instituciones educativas!§!\n\n"
RED_collectivist_propaganda: "Propaganda colectivista"
RED_collectivist_propaganda_desc: "La lucha de todos los pueblos es compartida, y no dejaremos a ningún pueblo luchar solo. Por lo tanto, los logros de todos los pueblos deben ser compartidos."
RED_the_production_movement: "Lucha por la producción"
RED_the_production_movement_desc: "Para solidificar nuestra posición en la competencia con el mundo capitalista, no podemos ser arrastrados por el mundo capitalista. Necesitamos establecer nuestra propia base de producción sin interferencia externa, y ahora es el momento de comenzar la lucha por la producción."
RED_socialist_realism: "Realismo socialista"
RED_socialist_realism_desc: "El camino hacia el glorioso Invierno Rojo no siempre es suave. Durante este proceso, algunos pueblos pueden perder la esperanza. Debemos fomentar un arte que muestre cómo es realmente el Invierno Rojo y mostrar que estamos haciendo un esfuerzo."
RED_heroism_propaganda: "Propaganda de heroísmo"
RED_heroism_propaganda_desc: "Aunque los logros de todos los pueblos del Invierno Rojo son compartidos por todos los miembros de la clase trabajadora, aquellos que se han dedicado a los pueblos deben ser reconocidos como héroes que todos los pueblos deben emular."
RED_war_hero: "Héroe de guerra"
RED_war_hero_desc: "Todos los pueblos del Invierno Rojo se han unido para enfrentarse a los enemigos que amenazan al Invierno Rojo, y siempre lo harán. Sin embargo, no debemos ignorar a los soldados que han demostrado habilidades excepcionales para defender la patria."
RED_pluralistic_view: "Visión pluralista"
RED_liberal_for_debate: "Debate libre"
RED_press_commercial_magazine: "Publicación de revistas comerciales"
RED_free_press: "Prensa libre"
RED_principle_of_democratic_centralism: "Principio del centralismo democrático"

RED_foreign_policy: "Política exterior"
RED_foreign_policy_desc: "Aunque es importante priorizar los asuntos internos en la situación actual del Invierno Rojo, también es crucial mantener relaciones con las antiguas ciudades académicas y formar relaciones con los estados locales. El Invierno Rojo debe prepararse para avanzar nuevamente hacia el escenario mundial."
RED_political_realism: "Realismo político"
RED_political_realism_desc: "Aunque completar la revolución requiere derramamiento de sangre, no es necesario derramar mucha sangre. Si implementamos una política exterior más flexible, podemos minimizar los sacrificios de los pueblos y completar la revolución."
RED_expansionism: "Defensa activa"
RED_expansionism_desc: "\"La única defensa verdadera es la defensa activa.\"\n- Mao Zedong"
RED_attack_fin: "Segunda Comisión de Defensa"
RED_attack_fin_desc: "Nuestra Comisión de Defensa que se lanzó al norte como una extensión de la ofensiva del norte sufrió una derrota aplastante en Finlandia. Sin embargo, eso no significa nuestra derrota. Debemos restaurar la Comisión de Defensa en la región de Finlandia y hacer de ella nuestra base de guerra."
RED_gotland_or_war: "Autodefensa en el Mar del Norte"
RED_gotland_or_war_desc: "Gotland originalmente pertenecía a Suecia, pero fue ocupada sorpresivamente por los remanentes de la marina alemana después de su derrota. Sin embargo, es un punto estratégico necesario para asegurar la hegemonía completa en el Mar Báltico, por lo que enviaremos un ultimátum final a ellos para que se retiren de Gotland."
RED_attack_ger: "Ofensiva del sur"
RED_attack_ger_desc: "La península escandinava y Europa están separadas por un estrecho, lo que hace extremadamente difícil llevar a cabo operaciones de defensa regional en la región danesa. Una ofensiva hacia Schleswig, y más allá hacia Holstein, resultará en la seguridad del río Stör, lo que es una ventaja en la guerra de posiciones utilizando el río."
RED_GEK_gave_goatland_flag: "§Y[GEK.GetAdjective]§! ha cedido §Y[124.getname]§!"
RED_GEK_gave_goatland_flag_tt: "Días actuales: [?RED_GEK_gave_goatland_flag:days|Y0]"
RED_hegemony_on_balt: "Hegemonía en el Báltico"
RED_hegemony_on_balt_desc: "Necesitamos una clara hegemonía en el Mar Báltico."
RED_deal_with_fin: "Alianza con un estado tapón"
RED_deal_with_fin_desc: "Finlandia, que colinda con nosotros y también con la Unión Soviética, también es hostil hacia la Unión Soviética. Si extendemos la mano primero, es posible que no nos hostiguen y cooperen contra la Unión Soviética."
RED_deal_with_fin_tt: "\n§gPuede usarse en estados de Międzymorze que estén en guerra con §Y[SOV.GetAdjective]§!."
RED_seek_allies: "Búsqueda de aliados"
RED_seek_allies_desc: "Debemos buscar aliados contra los soviéticos."
RED_support_german: "Apoyo a [GEK.getname]"
RED_support_german_desc: "Debemos apoyar a los camaradas que se oponen a la hegemonía de Trinity."
RED_support_geh: "Apoyo a Gehenna"
RED_support_geh_desc: "Debemos apoyar a los camaradas que se oponen a la hegemonía de Trinity."
RED_trade_with_KAI: "Activación del intercambio civil"
RED_trade_with_KAI_desc: "El aislamiento no es realmente una buena idea."
RED_infiltrate_trm: "Infiltración en Trinity"
RED_infiltrate_trm_desc: "Debemos prepararnos para la expansión de Trinity."
RED_unlock_operation_tt: "@TRM§Y[TRM.getadjective]§! puede ser objetivo de §Yoperaciones§! §Gdisponibles§!:\n§YEmisión de billetes falsos§!, §YDispersión de armas biológicas§!"

BA_fake_money_gang: "Emisión de billetes falsos"
BA_fake_money_gang_desc: "Emitiremos billetes falsos para infligir daño irreparable a la economía del país enemigo."
BA_corona_gang: "Dispersión de armas biológicas"
BA_corona_gang_desc: "Creo que recuerdo que esto estaba prohibido en el pasado."

RED_attack_sov: "Asegurar la Unión Soviética"
RED_attack_sov_desc: "El enfoque unilateral del líder soviético es una amenaza para nuestra revolución, y es un hecho establecido que debemos enfrentarnos a ellos para completar nuestra revolución. Y ahora ha llegado el momento."
RED_new_inteligence_agency: "Nuevo establecimiento de la agencia de inteligencia"
RED_new_inteligence_agency_desc: "La notoriedad de la Agencia de Inteligencia del Invierno Rojo es bien conocida en las ciudades académicas. El presidente Cherino ha ordenado la reorganización de la Agencia de Inteligencia del Invierno Rojo para prepararse tanto para los enemigos internos como externos."
RED_professioner_undercover: "Especialista en infiltración"
RED_professioner_undercover_desc: "Para infiltrarse con seguridad en el territorio enemigo, se necesitan agentes de élite que hayan completado un entrenamiento mental y físico intenso. Los especialistas en infiltración entrenados por nuestros agentes amigables actuarán como nuestros ojos y oídos en tierras extranjeras."
RED_fraktiya: "Provocateurs"
RED_fraktiya_desc: "Es hora de que los agentes especializados asignados a dividir las organizaciones de resistencia locales sean desplegados."
RED_international_frontline: "Guardia Revolucionaria"
RED_international_frontline_desc: ""
RED_communist_instigation: "Voluntarios soviéticos internacionales"
RED_communist_instigation_desc: "Mantener el internacionalismo proletario es un deber de todos los trabajadores."
RED_anti_stalin_in_spain: "Frente Anti-Stalin en España"
RED_anti_stalin_in_spain_desc: "$SOV_covert_support_for_spanish_poum_desc$"
RED_trotsky_s_world_revolution: "Revolución Mundial de Trotsky"
RED_trotsky_s_world_revolution_desc: "Recientemente, ha habido un choque de opiniones entre Cherino, el presidente del consejo estudiantil de nuestra academia, y Trotsky, el constructor de la ideología de la Academia Federal. Debemos apoyar la teoría de la revolución mundial de Trotsky y prepararnos para la guerra revolucionaria en todo el mundo en medio de este caos."
RED_cherino_s_systemic_revolution: "Revolución Sistémica de Cherino"
RED_cherino_s_systemic_revolution_desc: "Recientemente, ha habido un choque de opiniones entre Cherino, el presidente del consejo estudiantil de nuestra academia, y Trotsky, el constructor de la ideología de la Academia Federal. Debemos apoyar la teoría de la revolución sistémica de Cherino y derrocar la autoridad de la organización vanguardista y lograr el comunismo sostenible en medio de este caos."
RED_party_reorganization: "Nueva Tesis"
RED_party_reorganization_desc: "Se ha establecido una nueva plataforma para liderar el Soviet del Invierno Rojo, y pronto todo el régimen federal será reorganizado según esta plataforma."
 RED_party_reorganization_tt: "§R[RED.getname] se enfrentará a una transición política alineada con la ideología de Trotsky y la oposición de izquierda.§!"
 RED_party_reorganization_tt_1: "§R[RED.getname] se enfrentará a una transición política alineada con la ideología de Cheryno y la secretaría.§!"
 RED_centralization: "Estado de centralización"
 RED_centralization_tt: "\n§YEl Consejo de Reconstrucción de las Zonas Liberadas§! verá fortalecida su fuerza militar."
 RED_union_nation_tt: "\n§YRecibirá más industria del Consejo de Reconstrucción de las Zonas Liberadas§!."
 RED_union_nation: "Autodeterminación de las naciones"
 RED_workers_state: "República de trabajadores"
 RED_workers_state_desc: "Nuestra nación, una república de trabajadores, se esforzará por no degenerar en un estado burocrático corrupto como la vecina Unión Soviética, y continuará invirtiendo en la liberación de los pueblos del mundo."

 RED_party_central_dissolution: "Disolución del Comité Central"
 RED_party_central_dissolution_desc: "El Comité Central del Partido Comunista ha tenido un rol dominante en el partido, presentando sus opiniones como si fueran las del conjunto del partido. Ahora, para avanzar hacia una dictadura del partido y no solo del comité, se reducirá significativamente la influencia del Comité Central y se potenciará la voz de los camaradas del partido."
 RED_thesis_tt: "Cuando se complete la concentración §Y$RED_party_reorganization$§!:\n\n"
 RED_freedom_of_debate_unity_of_action: "Libertad de debate y unidad de acción"
 RED_multi_party_system: "Cooperación multipartidista"
 RED_soc_dem_party_name_long: "Partido Socialdemócrata Laborista"
 RED_soc_dem_party_name: "SDLP"
 RED_hegemony_struggle: "Lucha por la hegemonía cultural"
 RED_free_soviets: "Soviets libres"
 RED_free_soviets_desc: "Para avanzar hacia una dictadura del partido, necesitamos verdaderamente soviets establecidos y operados por el pueblo. Ahora, los trabajadores en los lugares de trabajo pueden establecer y disolver libremente soviets, y los funcionarios del partido también pueden ser destituidos mediante acusación."
 RED_democratic_planned_economy: "Control central de la industria"
 RED_no_war_but_class_war: "No guerra, sino guerra de clases"
 RED_ideal_of_bolshevism_again: "Reencarnación del ideal bolchevique"
 RED_cherino_core_of_solidarity: "Núcleo de la solidaridad"
 RED_day_of_victory: "Día de la victoria"
 RED_return_of_left_oppisition: "Regreso de la oposición de izquierda"
 RED_revolutionary_trial: "Juicio revolucionario"
 RED_bolshevik_leninism: "Bolcheviquismo-Leninismo"
 RED_social_rebuild: "Reconstrucción social"
 RED_rebuild_party: "Reconstrucción del partido vanguardia"
 RED_annex_party: "Anexión del partido"
 RED_fix_error: "Corrección de errores ideológicos"
 RED_creative_deconstructivism: "Deconstrucción creativa"
 RED_federalization: "Federalización"
 RED_military_government: "Administración Militar Soviética"
 RED_redwinter_in_world: "Invierno Rojo en el mundo"
 # Enfoque soviético
 RED_strengthen_the_trade_unions_by_sov: "$SOV_strengthen_the_trade_unions$"
 RED_the_peoples_revolution: "$SOV_the_peoples_revolution$"
 RED_the_supreme_soviet: "$SOV_the_supreme_soviet$"
 RED_for_the_common_good: "$SOV_for_the_common_good$"
 RED_victory_over_devastation: "$SOV_victory_over_devastation$"
 RED_victory_over_devastation_tt: "Fábrica de bienes de consumo: §Y-2.0%§!\nVariación en la popularidad del partido: §G+15.00%§!\nLímite de rendición: §G+10.00%§!\nVelocidad de reparación de fábricas: §G+10.00%§!"
 RED_socialist_humanism: "$SOV_socialist_humanism$"
 RED_regional_development: "$SOV_regional_development$"
 RED_autonomous_soviet_republics: "$SOV_autonomous_soviet_republics$"
 RED_international_union_of_soviet_republics: "$SOV_international_union_of_soviet_republics$"
 RED_international_union_of_soviet_republics_tt: "Costo de comercio para la metrópoli: §G-10%§!\nVariación en la popularidad del partido: §G+10%§!"

 RED_liberation_of_the_kibotus_states: "Guerra revolucionaria de Kibotus"
 RED_liberation_of_the_kibotus_states_desc: "Debemos llevar a cabo la primera guerra revolucionaria para desmantelar el régimen dictatorial de las academias de Kibotus y establecer un estado del pueblo."
 RED_liberation_of_the_kibotus_states_tt: "§gDisponible para usar en los estados de Kibotus fronterizos§!"
 RED_armed_workers: "Proletariado armado"
 RED_armed_workers_tt: "\n§gDisponible para usar en estados en guerra§!"
 RED_war_communism_focus: "Comunismo de guerra"
 RED_people_s_liberation_war: "Guerra de Liberación del Pueblo Mundial"
 RED_people_s_liberation_war_desc: "Ha comenzado una guerra de liberación internacional para liberar a los trabajadores oprimidos y a los campesinos, así como a los pueblos colonizados del mundo. Nuestra nación se unirá como una sola y marchará al frente en nombre de la liberación mundial."
 RED_people_s_liberation_war_tt: "Declaración de guerra inmediata a los §Ypaíses débiles§! fronterizos. (Si existe un §Ypacto de no agresión§!, no se declara la guerra.) §Y£GFX_decision_icon_small Propagación revolucionaria§! La decisión también funciona para los países débiles locales."
 RED_permanent_revolution: "Revolución permanente"


# Ruta de Marina
 RED_no_error_at_ideology: "Persiguiendo la pureza ideológica"
 RED_ivan_kupla: "Ivan Kupala"
 RED_ivan_kupla_desc: "En Red Winter, los golpes de estado siempre han sido casi una tradición cultural. Sin embargo, ahora no basta con la cultura: se necesita un gran plan para construir una verdadera academia. El próximo Festival de Ivan Kupala será el punto de partida."
 RED_coup_of_office: "El golpe de Marina"
 RED_coup_of_office_desc: "¡Nuestro golpe ha sido un éxito! Renka y Cherino, quienes no pudieron ser ejemplos para los estudiantes, huyeron tras enterarse del golpe, y la guardia capturó a todos los miembros de la asociación estudiantil y otras fuerzas escolares bajo el pretexto de restaurar el orden. Ya nadie podrá detener a Marina, ni ahora ni en el futuro.\n\n...¿Así está bien, Marina?"
 RED_labor_party_problem: "Problema del Departamento de Servicios"
 RED_labor_party_problem_desc: "Tras el golpe, el Departamento de Servicios nos guarda un profundo rencor y ha decidido continuar con sabotajes y huelgas generales. Además, en el centro de los clubes que retiraron su apoyo a la Oficina se encontraba siempre el Departamento de Servicios."
 RED_suppress_the_labor_party: "Sofocar al Departamento de Servicios"
 RED_suppress_the_labor_party_desc: "Nuestro primer objetivo debe ser limitar las actividades del Departamento de Servicios. Al detener sus protestas y dispersarlas usando a la guardia, podremos luego enmendar los reglamentos internos para recortar su poder."
 RED_arrest_minori: "Arrestar a Minori"
 RED_arrest_minori_desc: "\"¡Jefa del Departamento de Servicios, Yasumori Minori!\n\nSe te arresta ahora mismo por cargos de organizar asambleas ilegales, liderar huelgas generales caóticas y conspirar un golpe contra la Oficina y la Academia junto a otros estudiantes de la Federación.\"\n\n"
 RED_split_the_labor_party: "Crear facciones en el Departamento de Servicios"
 RED_split_the_labor_party_desc: "Con la desaparición de Minori, el Departamento de Servicios cayó en el caos. Incluso su liderazgo provisional no logra controlarlo, lo que representa una oportunidad que no podemos desaprovechar."
 RED_keep_an_eye_on_labor_party: "Intensificar la vigilancia sobre el Departamento de Servicios"
 RED_keep_an_eye_on_labor_party_desc: "Aunque hayamos arrestado a Minori y debilitado al Departamento, si surge un nuevo líder similar, nuestros esfuerzos habrán sido en vano. Por tanto, es esencial mantener su vigilancia constante."
 RED_puppet_labor_party: "Convertir al Departamento de Servicios en un títere"
 RED_puppet_labor_party_desc: "¡Perfecto! La mayoría de los miembros del Departamento han jurado lealtad a la Oficina, y han aceptado el legado de la camarada Cherino y el liderazgo de Marina.\n\nAhora el Departamento de Servicios nos pertenece y podemos manejarlo a nuestro antojo."
 RED_down_with_traitors: "Erradicar a los traidores"
 RED_down_with_traitors_desc: "Aunque el golpe haya sido exitoso, todavía existen fuerzas dispersas que rechazan nuestro paradigma y hegemonía. En Red Winter, donde los golpes se habían vuelto un mal hábito cultural, esa inestabilidad debe ser eliminada. Si no detenemos a los traidores internos, nuestro régimen no durará."
 RED_military_purge: "Purgar a las fuerzas armadas"
 RED_military_purge_desc: "Aunque la Guardia y el nuevo Cuerpo de Cadetes son nuestros principales apoyos, siguen siendo fuerzas armadas. Si algún día osaran rebelarse, debemos ser capaces de aplastarlos y asegurarnos de que estén bajo el puño de Marina.\n\n\"Ahora empieza la purga.\""
 RED_trace_the_cherino: "Rastrear a Cherino"
 RED_trace_the_cherino_desc: "Desde el último Festival de Ivan Kupala, Cherino ha desaparecido sin dejar rastro. Sin embargo, rumores inquietantes dicen que se mueve entre los clubes intentando socavar nuestra hegemonía. ¡Debemos capturarla antes de que arruine nuestro nuevo futuro!"
 RED_fate_of_trotsky: "El destino de Trotsky"
 RED_fate_of_trotsky_desc: "Lev Trotsky, antaño famoso revolucionario soviético y rival de Stalin, fue derrocado y terminó en Red Winter. Aunque proclame luchar por la revolución, su camino no necesariamente coincide con el nuestro. Antes de que se convierta en una amenaza, debemos eliminar cualquier peligro."
 RED_marina_is_the_only_one: "La nueva líder de Red Winter"
 RED_marina_is_the_only_one_desc: "La camarada Marina ha logrado avances significativos. Bajo su liderazgo, la academia, que estaba sumida en el caos, ha recuperado la estabilidad. Todos los intentos de golpe han sido aplastados. Marina es la heroína revolucionaria de Red Winter y la legítima sucesora de Cherino."
 RED_heir_of_cherino: "La portavoz de Red Winter"
 RED_heir_of_cherino_desc: "Aunque llegó al poder mediante un golpe, ha cumplido con creces su deber. Al reprimir rápidamente a la oposición y restaurar la estabilidad, ha recordado a todos a la antigua Cherino. Ahora puede ser aceptada como la nueva presidenta estudiantil de Red Winter."
 RED_office_united_as_one: "La Oficina Unificada"
 RED_office_united_as_one_desc: "La confusión en la Oficina finalmente ha cesado. Todos los enemigos internos han sido erradicados, y los seguidores de Cherino ya no pueden poner pie en la academia. Aunque Marina es la única superviviente en la Oficina, eso mismo permitió que sobreviviera. Debemos jurar lealtad a Marina, nuestra única y verdadera líder."
 RED_secure_the_publishing_department: "Asegurar el Departamento de Publicaciones"
 RED_secure_the_publishing_department_desc: "El Departamento de Publicaciones, encargado del periódico escolar 'El Oso Rojo' y otros medios, es la mayor institución de prensa de la academia. Controlarlo nos permitirá afianzar nuestra legitimidad."
 RED_appease_yakumo: "Apaciguar a Yakumo"
 RED_appease_yakumo_desc: "Aramaki Yakumo tiene una reputación notoria en la academia, pero también ejerce una enorme influencia en el Departamento de Publicaciones. Si logramos ganarla para nuestra causa, podremos usar su red para promover la Oficina."
 RED_purge_the_redbear: "Purgar la redacción del Oso Rojo"
 RED_purge_the_redbear_desc: "Aunque 'El Oso Rojo' es una prensa veraz, su editor ha cometido graves actos de corrupción y periodismo reaccionario que dañan nuestra causa. Debemos detener su hegemonía y evitar más daño."
 RED_redbear_new_editor_in_cheif: "Nuevo jefe de redacción del Oso Rojo"
 RED_redbear_new_editor_in_cheif_desc: "Tras la purga, la calidad del 'Oso Rojo' ha caído. Debemos buscar un nuevo editor. Afortunadamente, ya tenemos una candidata: Miyoshi Takane, la mejor crítica del Departamento de Publicaciones, podrá sacar adelante esta situación."
 RED_purge_the_pd: "Purgar el Departamento de Publicaciones"
 RED_purge_the_pd_desc: "El Departamento de Publicaciones tiene gran influencia en toda la academia. Sin embargo, también alberga elementos que podrían ser peligrosos para la Oficina. Debemos purgar a todos los reaccionarios posibles."
 RED_expand_the_pd_budget: "Expandir el presupuesto del Departamento de Publicaciones"
 RED_expand_the_pd_budget_desc: "Tras la reestructuración del Departamento, contamos con ingresos sobrantes. Dado que la investigación mostró condiciones laborales pobres, es el momento de fortalecer una fuerza élite más productiva."
 RED_new_redbear_movement: "El Nuevo Movimiento del Oso Rojo"
 RED_new_redbear_movement_desc: "Nuestra reforma comenzada en 'El Oso Rojo' ha alcanzado su pleno auge. Su propaganda ha disipado las preocupaciones estudiantiles y sus reformas han elevado el nivel de periodismo.\n\nA través del 'Nuevo Movimiento del Oso Rojo', hemos demostrado que ningún otro medio es tan sabio y veraz como nosotros."
