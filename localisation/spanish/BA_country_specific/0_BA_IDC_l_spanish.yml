 IDC_slander_the_colonial_authorities: "Difamar a las autoridades coloniales"
 IDC_anti_colonialist_propaganda_idea: "Liga de Independencia [ROOT.GetAdjective]"
 IDC_outbreak_of_indochina_war: "Estallido de la Guerra de Indochina"
 has_IDC_independence_war_starter: "Nuestro país inició la Guerra de Indochina"
 IDC_independence_war_ongoing: "La Guerra de Indochina está en curso"
 IDC_independence_war_onended: "La Guerra de Indochina terminó con la victoria de Indochina"
 IDC_outbreak_of_indochina_war_tt: "Nuestro ejército aprovechará el debilitamiento de la administración colonial para derrocar a las autoridades coloniales y comenzar oficialmente la guerra de independencia mediante un golpe de Estado. Si logramos controlar §YCampoya§!, §YLaos§! y §YVietnam§!, los Estados hermanos de Indochina se unirán a la guerra de independencia. Si toda Indochina es liberada o el enemigo es completamente derrotado y forzado a firmar un tratado de paz, podremos obtener la independencia total de la antigua metrópoli.\n\nDel mismo modo, si el enemigo controla §YCampoya§!, §YLaos§! y §YVietnam§!, podrá forzarnos a un tratado de paz y mantener el control sobre nuestro país."
 IDC_indochina_communist_party_contact_tt: "§RYa no podremos intentar negociaciones pacíficas por la independencia y nos concentraremos exclusivamente en la lucha armada§!"
 IDC_vietcong_unit_tt: "Cuando comience la guerra de independencia, obtendremos 3 §YDivisiones Vietcong§!. Si el apoyo al §Ycomunismo§! alcanza un nivel suficiente, podrán lanzar un golpe de Estado y tomar el liderazgo del gobierno."
 IDC_monarchist_movement_tt: "Cuando comience la guerra de independencia, obtendremos 2 §YDivisiones de la Guardia§!, y el sentimiento monárquico del país aumentará de forma constante."
 idea_IDC_rural_enlightenment_movement: "Movimiento de ilustración rural"
 IDC_surrender_of_france: "Rendición de Francia"
 IDC_surrender_of_france_desc: "Si los hermanos independentistas de Indochina controlan todas las provincias indochinas y logran bloquear firmemente cualquier futura invasión francesa, podremos asegurar nuestra independencia. Solo queda el último momento para la liberación de todos los pueblos de Indochina."
 IDC_break_the_law: "Ruptura de la ley"
 IDC_break_the_law_tt: "Al inicio, ninguno de §YVietnam§!, §YLaos§!, §YCampoya§! ni §Y[1103.getName]§! está controlado por §Y[FRA.GetNameWithFlag]§!"
 IDC_break_the_law_tt_NOT: "Al inicio, §Y[FRA.GetNameWithFlag]§! controla al menos uno de §YVietnam§!, §YLaos§!, §YCampoya§! o §Y[1103.getName]§!"

 IDC_establish_the_anc_modifier_tt: "§RYa no será posible completar enfoques relacionados con la infantería de Indochina§!"
 IDC_establish_the_anc_locking_tt: "Elimina el espíritu nacional §YInfantería de Indochina§! y lo reemplaza por §YEjército [ROOT.GetAdjective]§!, conservando la mitad de los bonificadores obtenidos previamente."
 IDC_establish_the_anc: "Establecimiento del Ejército [ROOT.GetAdjective]"
 IDC_establish_the_anc_desc: "Muchas de nuestras exigencias finalmente han sido cumplidas. Hoy es el día en que hemos formado un auténtico ejército [ROOT.GetAdjective], capaz de enfrentarse con orgullo a cualquier enemigo que se nos presente."
 IDC_marine_nationale: "Marina nacional"
 IDC_marine_nationale_desc: "Aunque nunca hemos invertido adecuadamente en ella, la mayoría de los Estados modernos necesitan una marina. Debemos decidir si su propósito será transportar tropas a través del Pacífico Sur o realizar operaciones más eficaces en ríos y costas cercanas."
 IDC_expand_shipping_industry: "Expansión de la industria naviera"
 IDC_expand_shipping_industry_desc: "Muchas regiones de nuestro país son difíciles de acceder sin transporte aéreo o fluvial. Además, las conexiones marítimas con el extranjero son vitales, por lo que debemos expandir la industria naval para satisfacer las necesidades de nuestro Estado en modernización."
 IDC_south_atlantic_navy: "Marina del Pacífico Sur"
 IDC_south_atlantic_navy_desc: "Si queremos proteger adecuadamente nuestra independencia, debemos impedir que las potencias coloniales vuelvan a desembarcar en nuestras costas."
 IDC_brown_water_navy: "Marina fluvial y costera"
 IDC_brown_water_navy_desc: "Los vastos océanos no son nuestra prioridad. Sin embargo, para garantizar la seguridad nacional, debemos patrullar eficazmente nuestros extensos ríos, lagos y costas."
 IDC_coastal_defence_fleet: "Desarrollo de la flota de defensa costera"
 IDC_coastal_defence_fleet_desc: "Debemos proteger adecuadamente nuestras costas, y esto solo puede lograrse construyendo poderosas embarcaciones de defensa costera capaces de operar cerca del litoral."
 IDC_supply_line_disruption_tactics: "Tácticas de interrupción de líneas de suministro"
 IDC_supply_line_disruption_tactics_desc: "Las líneas de suministro enemigas pueden colapsar con un solo golpe preciso. Nuestros submarinos serán los encargados de ello, desempeñando un papel clave en las guerras futuras."
 IDC_force_arienne_congolaise: "Fuerza aérea [ROOT.GetAdjective]"
 IDC_force_arienne_congolaise_desc: "Para poder enfrentarnos adecuadamente a nuestros enemigos, debemos reorganizar nuestra aviación y establecer una fuerza aérea oficial dentro del nuevo ejército."
 IDC_procure_foriegn_equipment: "Adquisición de equipamiento extranjero"
 IDC_procure_foriegn_equipment_desc: "Carecemos de la base industrial y el conocimiento técnico necesarios para desarrollar y producir aviones por nuestra cuenta, por lo que es más sensato centrarnos en adquirir diseños o aeronaves de nuestros aliados."
 IDC_aeronautical_research_department: "Departamento de investigación aeronáutica"
 IDC_aeronautical_research_department_desc: "Aunque la aviación no ha sido un área prioritaria de inversión, no debemos depender excesivamente de potencias extranjeras. Aun con altos costos, es necesario desarrollar y producir nuestros propios aviones."
 IDC_scouting_the_terrain: "Reconocimiento del terreno"
 IDC_scouting_the_terrain_desc: "Nuestra vasta jungla dificulta el desplazamiento y hace complicado detectar al enemigo antes de que se acerque a las ciudades principales. Por ello, la fuerza aérea deberá desempeñar un papel clave en las misiones de reconocimiento."
 IDC_expand_production_facilities: "Expansión de instalaciones de producción"
 IDC_expand_production_facilities_desc: "Debemos aumentar la producción de equipo militar, y la única forma de lograrlo es construyendo nuevas instalaciones que lo permitan."
 IDC_forces_terrestres: "Fuerzas terrestres"
 IDC_forces_terrestres_desc: "El componente más importante de cualquier ejército es la fuerza terrestre, y actualmente la nuestra presenta numerosas carencias. Debemos invertir en ella para poder enfrentarnos con firmeza a nuestros enemigos."
 IDC_from_a_gendarmerie_to_a_fighting_force: "De gendarmería a fuerza de combate"
 IDC_from_a_gendarmerie_to_a_fighting_force_desc: "Es momento de dejar atrás nuestros orígenes como infantería de gendarmería y rediseñar el ejército para que deje de parecer una fuerza policial y se convierta en una auténtica fuerza militar."
 IDC_academie_militaire_de_kananga: "Academia militar de [ROOT.Capital.GetName]"
 IDC_academie_militaire_de_kananga_desc: "No solo los soldados rasos, sino también oficiales y generales requieren formación. Invertir en la academia militar de [ROOT.Capital.GetName] permitirá que nuestro ejército desempeñe mejor sus futuras misiones."
 IDC_standardize_military_production: "Estandarización de la producción militar"
 IDC_standardize_military_production_desc: "Con equipo extranjero y nacional mezclado caóticamente, nuestra industria militar no puede producir el material necesario con rapidez. Debemos estandarizar el equipamiento utilizado por el ejército."
 IDC_societe_africaine_dexplosifs_congo: "Compañía de municiones de Indochina"
 IDC_societe_africaine_dexplosifs_congo_desc: "Otro requisito para fabricar nuestras propias armas es contar con una empresa estatal capaz de satisfacer nuestras necesidades dentro de nuestras fronteras. Con ese objetivo, debemos fundar la Compañía de Municiones de Indochina."
 IDC_triga_i_project: "Proyecto de armamento nuclear"
 IDC_triga_i_project_desc: "El futuro de la energía es la energía nuclear, y nuestros científicos han trabajado intensamente para construir la primera planta nuclear de Indochina. Una vez alcanzado este objetivo, podremos reutilizar esta energía con fines militares."
 IDC_military_service_for_citizenship: "Servicio militar para la ciudadanía"
 IDC_military_service_for_citizenship_desc: "En nuestro país hay muchas personas que no poseen ciudadanía ni pasaporte. Siguiendo el ejemplo de los romanos, debemos conceder la ciudadanía a quienes sirvan en el ejército durante un periodo determinado, atrayendo así nuevos reclutas potenciales."
 IDC_guerilla_tactics_drills: "Entrenamiento en tácticas de guerrilla"
 IDC_guerilla_tactics_drills_desc: "Nuestro terreno es ideal para tácticas de golpe y retirada. Debemos entrenar a nuestros soldados para dominarlas y derrotar a cualquier enemigo que encontremos."
 IDC_french_as_martial_language: "El francés como lengua militar"
 IDC_french_as_martial_language_desc: "Tradicionalmente, las cadenas de mando de la infantería de Indochina han utilizado el francés como lengua principal. Ha demostrado ser un método eficaz, por lo que no hay razón para cambiarlo."
 IDC_adopt_lingala_and_swahili_as_martial_languages: "Lenguas locales en el ejército"
 IDC_adopt_lingala_and_swahili_as_martial_languages_desc: "Aunque históricamente la cadena de mando ha utilizado el francés, debemos romper con nuestros antiguos dominadores, eliminar los vestigios del imperialismo y adoptar nuestras lenguas locales."

 IDC_31e_brigade_parachutiste: "Creación de la brigada aerotransportada"
 IDC_31e_brigade_parachutiste_desc: "Debemos crear una unidad aerotransportada de élite capaz de capturar asentamientos con rapidez, eliminar enemigos internos y servir como guardia de élite para proteger a los líderes nacionales."
 IDC_peacekeeping_forces: "Fuerzas de mantenimiento de la paz"
 IDC_peacekeeping_forces_desc: "Aunque la guerra no devasta actualmente Indochina, sí lo hace en otras partes del mundo. Incluso si debemos enviar tropas a tierras lejanas por el bien de otros, debemos hacerlo en nombre de un futuro mejor."
