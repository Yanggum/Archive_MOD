 IDC_event.1.t: "Solicitud de apoyo de los nacionalistas [FROM.GetAdjective]"
 IDC_event.1.desc: "Los nacionalistas [FROM.GetAdjective] se están preparando para una guerra de independencia contra sus gobernantes. Bajo la premisa de que les proporcionemos armas para su lucha, prometen estrechar relaciones con nosotros tras su victoria, argumentando que una [FRA.GetName] debilitada beneficiaría nuestros intereses."
 IDC_event.1.a: "Por supuesto"
 IDC_event.1.b: "No hay razón para intervenir."
 IDC_event.2.t: "Aceptación del apoyo de [FROM.GetNameDefCap]"
 IDC_event.2.desc: "Nuestros diplomáticos han regresado tras consultar con el estado mayor [FROM.GetAdjective], alcanzando un acuerdo por el cual nos proporcionarán mano de obra y equipo si declaramos la guerra contra nuestros opresores. ¡Hoy es un gran día para el pueblo [ROOT.GetAdjective]!"
 IDC_event.2.a: "Perfecto"
 IDC_event.3.t: "Rechazo del apoyo de [FROM.GetNameDefCap]"
 IDC_event.3.desc: "Nuestros diplomáticos regresaron con las manos vacías tras las conversaciones con el estado mayor [FROM.GetAdjective]. No se logró ningún acuerdo, y aquellos que creíamos aliados nos han traicionado..."
 IDC_event.3.a: "Qué lamentable"

 IDC_event.4.t: "Solicitud de ayuda industrial de [FROM.GetAdjective]"
 IDC_event.4.desc: "Tras lograr la independencia, [FROM.GetAdjective] ha solicitado nuestra ayuda industrial. Subrayan que la infraestructura de Indochina es deficiente y que carecen de expertos industriales, proponiendo futuras cooperaciones como la proyección de influencia regional y la instalación de infraestructuras militares, y solicitando el envío de especialistas industriales a su país."
 IDC_event.4.a: "Por supuesto"
 IDC_event.4.b: "No nos interesa esa región."
 IDC_event.5.t: "Aceptación del apoyo de [FROM.GetNameDefCap]"
 IDC_event.5.desc: "Nuestros diplomáticos, tras contactar con expertos industriales y representantes diplomáticos [FROM.GetAdjective], han obtenido un compromiso firme de inversión hacia nuestro país. ¡Es una oportunidad para suplir nuestra escasez de especialistas y obtener recursos de acero de alta calidad!"
 IDC_event.5.a: "Bien."
 IDC_event.6.t: "Rechazo del apoyo de [FROM.GetNameDefCap]"
 IDC_event.6.desc: "Nuestros diplomáticos regresaron con las manos vacías tras dialogar con los representantes [FROM.GetAdjective]. No se alcanzó ningún acuerdo y parece que no están interesados en invertir en nuestra industria."
 IDC_event.6.a: "Qué lástima"

