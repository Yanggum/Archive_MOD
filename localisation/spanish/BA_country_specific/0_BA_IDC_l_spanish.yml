l_spanish: 
 IDC_tirailleurs_reformed_flag: "La infantería ha sido reorganizada como el ejército [ROOT.GetAdjective]"
 IDC_tirailleurs: "Infantería"
 IDC_tirailleurs_desc: "La infantería es una fuerza de gendarmería y ejército establecida en 1884, poco después de la creación de la Federación de la Indochina Francesa. El cuerpo de oficiales está compuesto íntegramente por franceses o mercenarios europeos, mientras que la mayoría de los soldados rasos son habitantes locales [ROOT.GetAdjective]. Son muy eficaces en combate, pero la discriminación y la mala administración han generado un profundo descontento."
 modify_IDC_tirailleurs_tt: "Cambios en §Y$IDC_tirailleurs$§!:"

 IDC_amry_modifier: "Ejército [ROOT.GetAdjective]"
 modify_IDC_amry_modifier_tt: "Cambios en §Y$IDC_amry_modifier$§!:"
 
