 manyoshu_desc:0 "Un dormitorio tipo archivo, situado al fondo de un callejón repleto de librerías de viejo. El propio dormitorio está convertido en una enorme biblioteca, y en su interior se apilan incontables libros antiguos con poemas, canciones e historias. Además, dentro del edificio también hay una enorme librería de segunda mano. Es fácil engañarse por su aspecto lujoso, pero las estudiantes de este dormitorio no son más que personas de corazón libre que disfrutan de la poesía, el sake y el buen gusto."
 singican:0 "Shingikan"
 singican_noun:0 "Shingikan"
 singican_desc:0 "Uno de los dormitorios más grandes de Kapila. Como hay muchas estudiantes, la jerarquía y la disciplina suelen ser relativamente estrictas. Pero, del mismo modo que su tamaño, también hay muchísimas problemáticas."
 singican_long:0 "Shingikan"
 uranotsukasa:0 "Uranotsukasa"
 uranotsukasa_noun:0 "Uranotsukasa"
 uranotsukasa_desc:0 "Uno de los grandes dormitorios con gran influencia en Kapila. Antaño era un dormitorio especial que formaba onmyōji. Hoy, casi ha desaparecido con el paso de los tiempos, pero en muchos rincones del dormitorio aún se puede encontrar la huella de esa identidad acumulada durante largos años como centro de formación de onmyōji."
 uranotsukasa_long:0 "Uranotsukasa"
 yunowka:0 "Yunoōka"
 yunowka_noun:0 "Yunoōka"
 yunowka_desc:0 "Se utiliza como dormitorio tras reparar un alojamiento termal que, hace mucho, fue cerrado y abandonado. Por ser un edificio antiguo de madera, las residentes se quejan muchísimo; aun así, el gran baño público goza de buena reputación. Según los rumores, en algún lugar del dormitorio se esconde un increíble rotenburo (baño al aire libre), o algo así."
 yunowka_long:0 "Yunoōka"

