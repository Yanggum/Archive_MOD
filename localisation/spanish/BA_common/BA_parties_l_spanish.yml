 MIKA_FASCISM_SHORT:0 "Tea Party"
 MIKA_FASCISM_LONG:0 "Tea Party - Facción Pater\n§gTras el Primer Concilio, la facción Pater perdió su tinte militarista y degeneró en un grupo de conservadurismo, elitismo y autoritarismo que conservaba más la apariencia que la esencia. Sin embargo, el Incidente de la Gran Transferencia y la particularidad histórica de Trinity se entrelazaron, y la facción Pater regresó a su forma anterior a aquel Primer Concilio.\nEsta transformación no fue una simple casualidad, sino una extensión del propósito que tuvo la primera líder de la facción Pater. La actual líder, Misono Mika, también hereda ese cauce y alberga una voluntad firme de construir una Trinity grande y justa.\n«Trinity se salvará a sí misma»§!\n"
