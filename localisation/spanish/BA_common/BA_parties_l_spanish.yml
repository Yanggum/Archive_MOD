l_spanish:
 #이데올로기#
  aicontrol:0 "Control de la IA"
 aicontrol_desc:0 "Una inteligencia artificial altamente desarrollada está controlando el país entero. Todas las políticas del Estado se determinan según el juicio y la toma de decisiones autónoma de la IA."
 fascism_aicontrol:0 "Control de la IA"
 fascism_aicontrol_desc:0 "Una inteligencia artificial altamente desarrollada está controlando el país entero. Todas las políticas del Estado se determinan según el juicio y la toma de decisiones autónoma de la IA."
 tea_party_fascism_ideology:0 "Facción Pater"
 tea_party_fascism_ideology_desc:0 "El militarismo de la facción Pater y su lealtad absoluta hacia su líder se originaron en los conflictos de Trinity de hace milenios, de la misma manera en que el fascismo nació en la Tierra. Más tarde, tras el 'consenso' de la Primera Gran Asamblea, en el que las facciones de Trinity se unificaron en una sola, al desaparecer los conflictos el brillo de la facción Pater se fue desvaneciendo y quedó integrada como una sola junto a la cruz."
 pater_nazism:0 "Socialismo Trinitario"
 pater_nazism_desc:0 "El Socialismo Trinitario es una ideología propia de Trinity, nacida en un mundo cambiante. Esta ideología posee un carácter derechista y ultranacionalista, y sus seguidores a menudo intentan movilizar el poder de las masas para alcanzar objetivos radicales. Desprecian la democracia tradicional y, en ocasiones, aprovechan el desprecio popular hacia el viejo orden. En muchos casos, recurren a inspiraciones eclécticas para resolver los principales problemas de la sociedad."
 tea_party_neutrality_ideology:0 "Facción Filius"
 tea_party_neutrality_ideology_desc:0 "La facción Filius es, tradicionalmente, la fuerza que ha liderado el Tea Party y ha guiado a Trinity. Por lo general impulsan métodos pacíficos, pero en el pasado, durante el proceso de unificación de Trinity, llegaron a fomentar diversos actos violentos; son personas que, por Trinity, no dudarían en recurrir también a acciones extremas."
 emergency_military_government:0 "Gobierno Militar de Emergencia"
 emergency_military_government_desc:0 "Para superar la emergencia total, los mandos militares están interviniendo directamente en el gobierno."
 The_Colour_democratic:0 "§0Color§! - §1Invasores de otra dimensión§!"
 The_Colour_democratic_desc:0 "§0Una fuerza colosal está atacando el planeta.§!\n\n§1Esta fuerza desconocida corroe el mundo y posee el poder de deformar a aquello con lo que entra en contacto, retorciéndolo en una existencia distinta a la de antes. Parece que el fin del mundo se acerca.§!"
