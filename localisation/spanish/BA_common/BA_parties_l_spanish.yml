 ABY_democratic_party_2_long:0 "Partido Nacional Socialdemócrata\n§gEl Partido Nacional Socialdemócrata es un partido big tent de centro amplio, formado en torno al Partido Nacional Social checo y al Partido Socialdemócrata austriaco, y liderado por Edvard Beneš, discípulo y uno de los herederos de Tomáš Masaryk. Sin embargo, pese a su propaganda de “big tent democrático”, impulsa vínculos con partidos fascistas como el Frente de la Patria, lo que ha provocado la salida de algunos partidos de izquierda y ha despertado sospechas populares, generando diversos problemas.§!"
 ABY_communism_party_2_long:0 "Partido de Integración Federal\n§gEste partido fue creado por Takanashi Hoshino, quien había sido la representante de Kivotos en la troika del gobierno de coalición, después del éxito de la operación de liberación, unificando fuerzas de izquierda de Kivotos y del ámbito local. Con un amplio sistema de bienestar y políticas pro trabajador-campesino, goza de un gran apoyo entre las clases bajas. Sin embargo, al defender una ideología peculiar: el socialismo monárquico, parece difícil que obtenga el respaldo de los intelectuales.§!"
 ABY_fascism_party_2_long:0 "Sociedad de la Ilustración\n§gLas teorías conspirativas sobre la Sociedad de la Ilustración, una organización secreta dentro del ejército, existían desde antes; pero durante la purga de las fuerzas nazis dentro del partido, llevada a cabo por Konrad Henlein, se reveló que realmente existía. Aun así, debido a información eliminada, no se sabe qué desean, quién es su líder ni prácticamente nada. Lo único seguro es que la Sociedad de la Ilustración busca derrocar a este gobierno. El Servicio de Inteligencia Militar y Civil se centra en localizarlos y revelar su verdadera naturaleza, trabajando para neutralizar su conspiración antes de que se materialice.§!"
 ABY_neutrality_party_2_long:0 "Partido Republicano Liberal\n§gEl Partido Republicano Liberal es un partido democrático que apoya el laissez-faire; con políticas ampliamente pro-empresariales y recortes al impuesto patrimonial, goza de gran popularidad entre las clases altas. Hay muchas especulaciones sobre cómo un partido sin base ni raíces logró entrar al parlamento, pero muchos políticos sospechan que hay influencia de los “tres grandes conglomerados” (Nephthys, Škoda y Rothschild).§!"
 ABY_democratic_party_3:0 "Partido Nacional Social Liberal"
 ABY_communism_party_3:0 "Unión Socialista de Abydos"
 ABY_fascism_party_3:0 "Partido Federal Democrático-Republicano"
 ABY_neutrality_party_3:0 "Fuerzas Armadas"
 ABY_democratic_party_3_long:0 "Partido Nacional Social Liberal\n§gEste partido big tent se creó reagrupando lo que quedó del Partido Nacional Socialdemócrata tras el intento de golpe de Estado de su líder Edvard Beneš. La líder, Okusora Ayane, habla de amor en lugar de odio y de inclusión en lugar de exclusión; aceptó a los partidos componentes del viejo Nacional Socialdemócrata, que antes eran tratados como “rebeldes”, y se opone estrictamente al fascismo, esforzándose por preservar los valores democráticos que dejó Masaryk.§!"
 ABY_communism_party_3_long:0 "Unión Socialista de Abydos\n§gUn partido big tent de izquierda fundado por Takanashi Hoshino. Aunque porta el rótulo de “unión socialista”, en realidad es una enorme coalición política que abarca desde reformistas moderados de centro-derecha hasta comunistas de extrema izquierda. Como coexisten muchas ideologías, los debates internos son intensos; sin embargo, bajo el liderazgo de Hoshino y la gran causa de “bienestar y igualdad para todos”, se mantiene como la mayor fuerza política de la federación.§!"
 ABY_fascism_party_3_long:0 "Partido Federal Democrático-Republicano\n§gFundado por Sunaookami Shiroko después de que, liderando a soldados leales y milicias ciudadanas, reprimiera el golpe de Suou. En torno a Shiroko —la heroína que defendió al Estado—, el partido aseguró una mayoría absoluta de escaños y estableció de facto un sistema de dictadura de partido único. Sin embargo, su gobierno de puño de hierro no se basa en el terror, sino en el apoyo y la confianza entusiastas de la ciudadanía; con un impulso arrollador, han sofocado el caos y conducen a la federación.§!"
 ABY_neutrality_party_3_long:0 "Fuerzas Armadas\n§gUna facción de militares profesionales que, durante el golpe de Suou, permaneció en silencio sin unirse ni a los rebeldes ni a la resistencia. Rechazan tajantemente la intervención política del ejército y se concentran únicamente en su deber como soldados: la defensa del territorio y la ejecución de órdenes. Sin importar la orientación del gobierno, juran lealtad absoluta al gobierno legalmente establecido, y en épocas de convulsión política siguen siendo el pilar inamovible que sostiene a las fuerzas federales.§!"
 ABY_democratic_party_4:0 "Orden Sekhmet"
 ABY_communism_party_4:0 "§RDisuelto§!"
 ABY_fascism_party_4:0 "La Verdadera Kivotos - Por la Iluminación"
 ABY_neutrality_party_4:0 "Consejo Directivo de Nephthys"
 ABY_democratic_party_4_long:0 "Orden Sekhmet\n§gEste partido nació como una organización de resistencia formada por Kuromi Serika, la única miembro del Comité de Contramedidas que evitó ser capturada durante el golpe de Asagiri Suou. Quienes, incluso en una situación desesperada, no se quebraron y lucharon por rescatar a sus compañeras y defender la democracia, hoy renacen como una fuerza política que simboliza la libertad y la justicia de la federación. Con el espíritu combativo de aquellos días, desconfían del autoritarismo y sitúan la libertad ciudadana como su valor supremo.§!"
 ABY_fascism_party_4_long:0 "La Verdadera Kivotos - Por la Iluminación\n§g“La Verdadera Kivotos - Por la Iluminación” es un movimiento nacionalista pan-Kivotos organizado por Asagiri Suou. En la mayoría de las academias de Kivotos, las ramas de este partido —articuladas en torno a “La Verdadera Kivotos - Por la Iluminación”— sacuden la sociedad y desencadenan continuamente oleadas del movimiento pan-Kivotosista. Este movimiento posee un carácter totalitario, así como un sesgo de populismo ultraderechista: exige lealtad absoluta al Líder del pueblo de Kivotos y llama a avanzar por el desarrollo y el “paraíso” de la nación de Kivotos. Los habitantes locales, al ver consignas como “el espacio vital de los kivotosianos”, recuerdan al nacionalsocialismo de la Alemania caída y sienten miedo.§!"
 ABY_communism_party_4_long:0 "§RDisuelto§!"
 ABY_neutrality_party_4_long:0 "Consejo Directivo de Nephthys\n§gEl Consejo Directivo de Nephthys es el verdadero órgano de decisión del Grupo Nephthys. Tras la Gran Transferencia y la desaparición del presidente, en la superficie Nonomi figura como la siguiente presidenta y máxima autoridad, pero el poder real pasó al consejo. Aun así, la influencia de la presidenta no es algo que pueda ignorarse, por lo que mantienen un equilibrio mediante compromisos con ella.§!"

