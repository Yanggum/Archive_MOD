 BAUKR_fascism_party_long:0 "Organización de Nacionalistas Ucranianos (Facción Melnyk)\n§gLa Organización de Nacionalistas Ucranianos, conocida como OUN, fue fundada en Viena y operó principalmente en la región de Galitzia. En sus inicios, la OUN expandió su influencia cooperando con múltiples pequeños grupos de derecha. Cuando estalló la guerra entre Trinity y Rusia, gracias a los esfuerzos de colaboración liderados por Andriy Melnyk, se estableció un Estado ucraniano, aunque fuera un títere de Trinity. Sin embargo, la facción OUN-B centrada en Bandera se dio cuenta de que Trinity tampoco tenía un interés genuino en la independencia ucraniana y lanzó ataques terroristas. Pero, tras la represión de la Fuerza de Tarea por la Justicia, la OUN-B terminó desapareciendo en las sombras de la historia.§!\n"
 BAUKR_fascism_party:0 "OUN-M"
 BABLR_fascism_party:0 "Rada Central Bielorrusa"
 BABLR_fascism_party_long:0 "Rada Central Bielorrusa\n§gEl Jefe de Inteligencia Académica presentó una propuesta para gobernar con eficacia la vasta región de Bielorrusia, y como resultado se creó la Rada Central Bielorrusa con el objetivo de administrar el territorio. Esta institución, establecida en torno al colaborador local Radaslau Astrouski, sueña con la plena independencia de Bielorrusia, pero su futuro no es más que oscuridad...§!\n"
 BASOV_fascism_party_russian:0 "$SOV_fascism_party_russian$\n§gKonstantin Rodzaevsky, líder del Partido Fascista Panruso, era un joven político ambicioso. Desde el inicio de sus actividades, contactó a intelectuales rusos blancos para ampliar su base, y fue aumentando su influencia realizando actos de terrorismo antigubernamental dentro de la Unión Soviética. Durante el proceso en que Trinity conquistó a la URSS y buscó colaboradores locales adecuados, el Partido Fascista Panruso no podía sino llamar la atención. Tras el contacto con Trinity, Rodzaevsky fue nombrado líder del Dominio Sagrado del Oriente, y por fin pasó a guiar a su patria, Rusia. Sin saber, sin embargo, que detrás de todo ello Trinity los manipulaba y estaba enfermando a la Madre Rusia.§!\n"
 BATR2_fascism_party:0 "FGCDNI"
 BATR2_fascism_party_long:0 "Comité del Gobierno Francés para la Defensa del Interés Nacional\n§gCuando Trinity invadió Millennium, los políticos que pretendían restaurar Francia se reunieron apoyándose en Trinity y así nació el Comité del Gobierno Francés para la Defensa del Interés Nacional. Bajo el respaldo de Trinity, trabajan para proteger a los ciudadanos franceses y salvaguardar su patrimonio, entre otros intereses nacionales; pero, en realidad, al no poder desobedecer las órdenes de Trinity, son tratados como un gobierno semitítere. Además, como el norte de Francia está bajo administración directa de Trinity, la influencia real del Comité queda limitada únicamente al sur.§!\n"

