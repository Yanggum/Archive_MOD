 COU_democratic_party_long:0 "Oficina General\n§gLa Oficina General es el departamento que supervisa y coordina el Consejo General de Estudiantes, y su Administrador Jefe cumple el rol de director. En otras palabras, la Oficina General es el corazón mismo del Comité Administrativo.§!"
 COU_communism_party:0 "Comité Administrativo"
 COU_communism_party_long:0 "Oficina de Transporte\n§gLa Oficina de Transporte desempeña un papel clave en el caótico tráfico de Kivotos. Su labor principal es gestionar toda clase de asuntos menores: desde frecuentes robos de vehículos de traslado de efectivo, atentados en trenes y demás incidentes diversos.§!"
 COU_fascism_party:0 "Comité Administrativo"
 COU_fascism_party_long:0 "Oficina de Defensa\n§gLa Oficina de Defensa es un departamento indispensable para la defensa de Kivotos. Su labor principal es mantener el orden y la seguridad pública en una sociedad donde la posesión individual de armas de fuego y armamento pesado se considera algo normalizado.§!"
 COU_neutrality_party:0 "Comité Administrativo"
 COU_neutrality_party_long:0 "Oficina de Finanzas\n§gLa Oficina de Finanzas es el departamento que, con base en un manejo fiscal preciso y una administración financiera rigurosa, fija y distribuye el presupuesto del Consejo General de Estudiantes, evitando que cualquier departamento actúe por su cuenta y “a su antojo”.§!"

