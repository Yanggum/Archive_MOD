 HEU_democratic_party:0 "Partido de Derecha - Facción Reformista"
 HEU_democratic_party_long:0 "Partido de Derecha - Facción Reformista\n§gLa facción reformista, una corriente interna del Partido de Derecha, a diferencia del ala conservadora, no niega la democracia moderna —incluido el sufragio universal— y busca materializar una política de democracia cristiana basada en la ideología católica. El Partido de Derecha fue, tradicionalmente, un partido derechista sustentado en el campesinado y el catolicismo de Luxemburgo.§!"
 HEU_communism_party:0 "Partido Comunista de Luxemburgo"
 HEU_communism_party_long:0 "Partido Comunista de Luxemburgo\n§gEl Partido Comunista de Luxemburgo es un partido estalinista de extrema izquierda que declaró su separación e independencia en 1921 tras un choque de líneas con el Partido Socialista Obrero de Luxemburgo, una fuerza de izquierda. Ha ganado gran popularidad entre los trabajadores de la siderurgia y la minería del sur de Luxemburgo; sin embargo, hasta las elecciones de 1934, incluso si lograban ser electos como diputados, el partido gobernante —el Partido de Derecha— les había prohibido acceder al parlamento (mediante procedimientos de expulsión de escaños).§!"
 HEU_fascism_party:0 "GEDELIT"
 HEU_fascism_party_long:0 "Asociación Alemana de Literatura y Artes\n§gGEDELIT, liderada por el profesor de griego luxemburgués Damian Kratzenberg, trascendió el concepto de una simple “sociedad literaria” y predicó el nacionalismo pangermanista: la homogeneidad cultural entre Luxemburgo y Deutschland, y la idea de que Luxemburgo debía integrarse como parte de Deutschland. GEDELIT creció enormemente al absorber y fusionar en 1931 al Partido del Estado Independiente, una formación derechista populista, y se convirtió en el eje del movimiento de extrema derecha luxemburgués en los años 30.§!"
 HEU_neutrality_party:0 "Casa Rikuhachima"
 HEU_neutrality_party_long:0 "Agencia de Detectives 68 / Gobierno de coalición con el Partido de Derecha\n§gTras la Gran Transferencia, Luxemburgo se convirtió en el único país de Europa Central que, entre los Estados atacados por fuerzas de Kivotos, logró preservar su soberanía y su territorio. La regente de Luxemburgo, Rikuhachima Aru, impulsa una integración algo idealista entre los grupos de Gehenna y los luxemburgueses; pero el Partido de Derecha, aunque la apoya con mucha cautela, observa con profunda incomodidad que el movimiento integracionista de ella está erosionando su base de apoyo.§!"

 HEU_benriya_party:0 "Agencia de Detectives 68"
 HEU_rechtspartei_party:0 "Partido de Derecha"
 HEU_PRL_party:0 "Partido Liberal Radical"
 HEU_PRL_party_long:0 "Partido Liberal Radical\n§gEl Partido Liberal Radical no es particularmente radical ni liberal; aun así, es una alternativa atractiva para la clase media urbana que se cree progresista y quiere votar por algo “más fino” que el Partido de Derecha, con olor a campo. Nacido en 1904, este partido se llamaba originalmente Liga Liberal (Liberale Liga), pero en el vaivén de pequeñas agrupaciones liberales de Luxemburgo, cambió de nombre una y otra vez. Tras 30 años de vida política, el PRL entendió que en una escena política escorada a la derecha se sobrevive “poniendo la direccional izquierda y girando a la derecha”: antes de la Gran Transferencia, apoyó políticas del Partido de Derecha y actuó como un pequeño socio de coalición, desplegando a su manera el ideal del liberalismo radical luxemburgués.§!"
 HEU_LSAP_party:0 "Partido Obrero de Luxemburgo"
 HEU_LSAP_party_long:0 "Partido Obrero de Luxemburgo\n§gAunque el Partido Obrero de Luxemburgo —la fuerza socialista del país— se fundó en 1902, solo obtuvo influencia política real tras la introducción del sufragio universal en 1919. A diferencia del Partido Comunista de Luxemburgo, que se escindió por diferencias respecto a la URSS, el Partido Obrero se opuso tanto a la Unión Soviética como al estalinismo, y defendió la “separación y autonomía entre los sindicatos y el partido”.§!"
 HEU_grand_coalition_party:0 "Gobierno de Unidad Nacional"
 HEU_grand_coalition_party_long_1:0 "Gran coalición de Agencia de Detectives 68 / Partido de Derecha / Partido Liberal Radical / Partido Comunista de Luxemburgo"
 HEU_grand_coalition_party_long_2:0 "Gran coalición de Agencia de Detectives 68 / Liga Federal de Cadetes / Partido Liberal Radical / Partido Comunista de Luxemburgo"
 HEU_volksdeutsche_party:0 "Movimiento Nacional Alemán"
 HEU_volksdeutsche_party_long:0 "Movimiento Nacional Alemán\n§gEl Movimiento Nacional Alemán, liderado por el profesor de griego luxemburgués Damian Kratzenberg, es una fuerza política nazi que hereda a GEDELIT, el movimiento nacionalsocialista luxemburgués de inicios de los años 30. Kratzenberg apoyaba el ideal de que los luxemburgueses son el mismo pueblo que los alemanes; sin embargo, este Movimiento Nacional Alemán fue rechazado por las fuerzas tradicionales de la derecha luxemburguesa.§!"
 HEU_pro_kayoko_party:0 "Ejército de Luxemburgo"
 HEU_pro_kayoko_party_long:0 "Ejército de Luxemburgo\n§gTras el golpe de Estado, el ejército luxemburgués se fracturó. Las fuerzas monárquicas que apoyan a Rikuhachima Aru, después de proclamar a Onikata Kayoko como nueva primera ministra de Luxemburgo, declararon ilegítimo al gabinete de Mutsuki e iniciaron una guerra de guerrillas. Que sean monárquicos leales y partidarios de Aru es indudable, pero eso no significa que sean democráticos o liberales.§!"
 HEU_pro_mutsuki_party:0 "Gobierno de Emergencia"
 HEU_pro_mutsuki_party_long:0 "Gabinete de Mutsuki"
 HEU_pro_mutsuki_party_trinity:0 "Tea Party"
 HEU_pro_mutsuki_party_trinity_long:0 "Tea Party\n§gAsagi Mutsuki es tan impredecible como su apodo de “diablilla”. Como los archivos informatizados se perdieron en el caos posterior a la Gran Transferencia, nadie puede refutar con pruebas y fundamentos sus afirmaciones de que “no soy de Gehenna, sino una agente de inteligencia enviada desde Trinity”, ni sus excentricidades de proclamarse “Host de Luxemburgo”. Más que moverse por una ideología definida, Tea Party se gobierna por los caprichos de Asagi Mutsuki y por políticas populistas posideológicas que buscan complacer a las masas luxemburguesas.§!"
 HEU_pro_mutsuki_party_gehenna:0 "Gobierno Revolucionario Provisional de Gehenna"
 HEU_pro_mutsuki_party_gehenna_long:0 "Gobierno Revolucionario Provisional de Gehenna\n§gAsagi Mutsuki es tan impredecible como su apodo de “diablilla”. Como los archivos informatizados se perdieron en el caos posterior a la Gran Transferencia, nadie puede refutar con pruebas y fundamentos su afirmación de que “soy el ‘Trueno Emperador’ que regresó del caos de la Gran Transferencia”. El Gobierno Revolucionario Provisional de Gehenna no se mueve por una ideología particular: se rige por los caprichos de Asagi Mutsuki y por políticas populistas posideológicas que buscan complacer a las masas luxemburguesas.§!"

 HEU_mutsuki_path_ending_neutrality_party_long:0 "Casa Rikuhachima\n§gTras la Gran Transferencia, Luxemburgo se convirtió en el único país de Europa Central que, entre los Estados atacados por fuerzas de Kivotos, logró preservar su soberanía y su territorio. Incluso después del golpe del gabinete Asagi, el bloque monárquico se consolidó aún más, y la corriente principal del Partido Liberal Radical —un partido liberal— se ha convertido en un ferviente aliado de Rikuhachima Aru.§!"
 HEU_mutsuki_path_ending_generic:0 "Conferencia Trilateral"
 HEU_mutsuki_path_ending_generic_long:0 "Conferencia Trilateral Luxemburgo–Gehenna–Trinity\n§gEl gobierno oligárquico formado por representantes de Luxemburgo y de las academias Gehenna y Trinity, de acuerdo con la Ley de la Unión, envió delegados para elegir a un primer ministro. Hasta que se elija un nuevo primer ministro mediante un proceso democrático, la Conferencia Trilateral es, de facto, la única fuerza política con legitimidad en los Principados Federados Germánicos.§!"
 HEU_mutsuki_path_ending_gehenna:0 "Coalición Arcoíris"
 HEU_mutsuki_path_ending_gehenna_long:0 "Partido Comunista de Luxemburgo – Movimiento Nacional Alemán – Partido Liberal Radical – Partido de Independencia de Gehenna\n§gLa coalición de izquierda y derecha conocida como “Coalición Arcoíris” abarca desde el Partido Comunista de extrema izquierda hasta el Movimiento Nacional Alemán de extrema derecha. Debido a sus diferencias ideológicas y a los choques entre los intereses de Luxemburgo, Deutschland y Gehenna, las relaciones internas de la coalición no son buenas. La única identidad que los mantiene unidos es la figura de Rikuhachima Aru como líder simbólica.§!"
 HEU_mutsuki_path_ending_haruka_long:0 "Partido Comunista de Luxemburgo – Movimiento Nacional Alemán – Partido Liberal Radical – Partido de Independencia de Gehenna\n§gLa coalición de izquierda y derecha conocida como “Coalición Arcoíris” abarca desde el Partido Comunista de extrema izquierda hasta el Movimiento Nacional Alemán de extrema derecha. Debido a sus diferencias ideológicas y a los choques entre los intereses de Luxemburgo, Deutschland y Gehenna, las relaciones internas de la coalición no son buenas. En particular, el problema del odio de Haruka hacia Gehenna vuelve inestable la existencia de Rikuhachima Aru, esa identidad frágil que los mantiene unidos, y hace que la coalición se sostenga en un equilibrio precario.§!"
 HEU_mutsuki_path_ending_trinity:0 "Coalición Blanco y Negro"
 HEU_mutsuki_path_ending_trinity_long:0 "Partido Popular Cristiano-Social – Pandemonium Society – Orden de los Caballeros de Socorro\n§gLa “Coalición Blanco y Negro”, formada por la alianza firme entre las dos academias Trinity y Gehenna y por la unión con el Partido Popular Cristiano-Social, de inclinación demócrata cristiana, está ligada por una amistad profunda a pesar de ser una coalición entre dos academias históricamente hostiles. Pandemonium Society no persigue una ideología política: solo busca beneficios privados; por eso, en la práctica, la política nacional la conducen fuerzas cercanas al conservadurismo católico. Junto con su inclinación monárquica a favor de Rikuhachima Aru, la Coalición Blanco y Negro busca materializar una ideología de conservadurismo social que niega los cambios abruptos en la sociedad.§!"

 HEU_permanent_mandates_commission:0 "PMC"
 HEU_permanent_mandates_commission_long:0 "Comisión Permanente de Mandatos de la Sociedad de Naciones\n§gCreada en 1920, la Comisión Permanente de Mandatos de la Sociedad de Naciones administra los territorios bajo mandato hasta que alcancen la independencia. Aunque la valoración de los países colonizados hacia la PMC es bastante negativa, y sigue siendo discutible si el sistema de mandatos tiene una voluntad real de independizar a las antiguas colonias, la PMC podría ser la alternativa más justa para ejercer el poder en estas regiones.§!"
 gehenna_local_neutrality_puppet_party:0 "Nacionalistas locales"
 gehenna_local_democratic_puppet_party:0 "Gobierno autónomo local"

 SHA_democratic_party:0 "Cámara Mercantil Xuanwu - Facción Central"
 SHA_democratic_party_long:0 "Cámara Mercantil Xuanwu - Facción Central\n§gLa Cámara Mercantil Xuanwu es el principal centro donde se concentra el abastecimiento de alimentos de todo Kivotos y un poderoso consorcio de comerciantes. Al mantener un comercio activo con todo Kivotos, adquirió de forma natural un carácter abierto, y por ello recibe una vigilancia y contención constantes por parte de Xuanlongmen.\n\nDentro de la Cámara, la facción central, a diferencia de los radicales, excluye los medios violentos y busca realizar ideales progresistas mediante reformas graduales, manteniendo la democracia liberal y la economía de mercado.§!\n"
 SHA_neutrality_party:0 "Xuanlongmen"
 SHA_neutrality_party_long:0 "Xuanlongmen - Facción Central"
 SHA_communism_party:0 "Cámara Mercantil Xuanwu - Izquierda"
 SHA_communism_party_long:0 "Cámara Mercantil Xuanwu - Izquierda\n§gLa Cámara Mercantil Xuanwu es el principal centro donde se concentra el abastecimiento de alimentos de todo Kivotos y un poderoso consorcio de comerciantes. Al mantener un comercio activo con todo Kivotos, adquirió de forma natural un carácter abierto, y por ello recibe una vigilancia y contención constantes por parte de Xuanlongmen.\n\nLa izquierda de la Cámara Mercantil Xuanwu nació de la convergencia de quienes se cansaron de la vigilancia y las sanciones continuas de Xuanlongmen. Consideran que Xuanlongmen ya no tiene voluntad de reforma y que el cambio gradual tiene límites; por ello sostienen que el sistema actual debe ser derribado por completo.\n§!"
 SHA_communism_party_1: "Cámara Mercantil Xuanwu"
 SHA_communism_party_1_long: "Cámara Mercantil Xuanwu\n§gLa Cámara Mercantil Xuanwu es el principal centro donde se concentra el abastecimiento de alimentos de todo Kivotos y un poderoso consorcio de comerciantes. Al mantener un comercio activo con todo Kivotos, adquirió de forma natural un carácter abierto, y por ello recibe una vigilancia y contención constantes por parte de Xuanlongmen. Consideran que Xuanlongmen ya no tiene voluntad de reforma y que el cambio gradual tiene límites; por ello sostienen que el sistema actual debe ser derribado por completo.\n§!"
 SHA_communism_party_BfG: "Alianza de Sindicatos Libres"
 SHA_communism_party_BfG_long: "Alianza de Sindicatos Libres\n§gTras adoptar el austromarxismo, la corriente de izquierda radical dentro de la Cámara Mercantil Xuanwu busca disolver la Cámara y, cooperando con los remanentes de la Federación de Sindicatos Libres de Austria, provocar una transformación en estas tierras. Sostienen que Xuanlongmen ya no tiene voluntad de reforma y que el sistema actual debe ser derribado por completo mediante un cambio radical hacia el socialismo.\n§!"

 SHA_fascism_party:0 "Club de Ópera de Pekín"
 SHA_fascism_party_long:0 "Club de Ópera de Pekín"

 SHA_peking_opera_blackdragon_cop:0 "Xuanlongmen"
 SHA_peking_opera_blackdragon_cop_long:0 "Xuanlongmen\n§gAunque nominalmente la autoridad plena de Shanhaijing recae en Ryuuge Kisaki, el verdadero centro del poder es otro. La actual presidenta del Club de Ópera de Pekín y figura en la sombra de Xuanlongmen, Urushibara Kaguya, es la encarnación del poder real en Shanhaijing.\n\nTodos alaban a Ryuuge Kisaki, pero ella ya no es más que una figura decorativa que ejecuta las órdenes de Urushibara Kaguya. La auténtica fuerza que guía a Shanhaijing se mueve en la sombra: silenciosa, pero inquebrantable.§!\n"
 SHA_Peking_Opera_Club:0 "Club de Ópera de Pekín - Xuanlongmen"
 SHA_Peking_Opera_Club_long:0 "Club de Ópera de Pekín - Xuanlongmen\n§gEn la revolución reciente, el Club de Ópera de Pekín recibió la transferencia total del poder de Ryuuge Kisaki. Además, para evitar un vacío administrativo, absorbió por completo a los miembros de Xuanlongmen, dando lugar a un extraño sistema de cooperación entre el Club de Ópera de Pekín y Xuanlongmen.§!\n"
 SHA_Radical_party:0 "Radicales de Shanhaijing"
 SHA_Radical_party_long:0 "Yeondanbang - Radicales de Shanhaijing\n§gCirculaban rumores de que los seguidores ocultos de Shintani Kai, dentro de Yeondanbang, habían unido fuerzas con algunos radicales de Xuanlongmen, y la revolución del Club de Ópera de Pekín lo confirmó. Suelen colaborar con Shintani Kai y se esfuerzan por inyectar nuevas ideas en Shanhaijing.§!\n"
 SHA_Shintani_KAI_party:0 "Nuevo Yeondanbang"
 SHA_Shintani_KAI_party_long:0 "Nuevo Yeondanbang - Shintanismo\n§gEl shintanismo es la nueva ideología rectora de Shanhaijing; como su nombre indica, es una doctrina proclamada directamente por Shintani Kai. Un pequeño grupo que investigó junto a Shintani Kai, buscando una nueva ideología rectora opuesta a Xuanlongmen, acabó dando forma al shintanismo tras investigaciones continuas.\n\nEsta ideología es, a la vez, un movimiento progresista que rechaza la tradición y una doctrina que, basada en un elitismo extremo, exige reforzar el control estatal mediante un aceleracionismo tecnocrático. El shintanismo convierte la innovación y el desarrollo tecnológico en principios centrales del gobierno, y aspira a reorganizar por completo el orden existente.§!\n"
 
