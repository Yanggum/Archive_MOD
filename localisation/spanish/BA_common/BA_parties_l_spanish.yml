 TRM_mika_unconfirmed_party:0 "§g[No autorizado]§!"
 TRM_mika_unconfirmed_party_long:0 "[Organización no autorizada]\n§gCuando Misono Mika usurpó el poder y, bajo su dirección, se aprobó una nueva Constitución, las demás facciones, bajo la represión sistemática de la facción Pater, se disolvieron por sí mismas o fueron disueltas por la fuerza. Aun así, hay quienes siguen operando en la clandestinidad para derrocar a la facción Pater, pero incluso eso no es más que una descarga de ira sin destino frente a la realidad.§!\n"

 TRM_nagi_nagi_democratic_party:0 "Tea Party - Facción Filius"
 TRM_nagi_nagi_democratic_party_long:0 "Tea Party - Facción Filius\n§gEl antipopulismo y el carácter aristocrático de la facción Filius se han intensificado gradualmente tras la Gran Transferencia, después de sus disputas políticas con la facción Pater. La defensa de la tradición, la preservación de la noble fe de Trinity y el pan-kivotismo—que hereda la antorcha del Tratado del Edén previo a la Gran Transferencia—son los tres pilares que simbolizan a la facción Filius.§!"
 TRM_nagi_nagi_neutrality_party:0 "Tea Party - Facción Filius"
 TRM_nagi_nagi_neutrality_party_long:0 "Tea Party - Facción Filius\n§gEl antipopulismo y el carácter aristocrático de la facción Filius se han intensificado gradualmente tras la Gran Transferencia, después de sus disputas políticas con la facción Pater. Algunos sectores duros tienen una inclinación aún más elitista que las fuerzas moderadas.§!"
 TRM_nagi_nagi_fascism_party:0 "Tea Party - Facción Pater"
 TRM_nagi_nagi_fascism_party_long:0 "Tea Party - Facción Pater\n§gComo principal oposición populista de Trinity, la facción Pater sigue ejerciendo influencia como la mayor oposición incluso tras su derrota en la elección de Host de 1936. Su “socialismo trinitario”, cambiado y reformado, su segunda Trinity que sirve al pueblo, sigue siendo la mayor amenaza para el elitismo de Trinity.§!"
