 technocracy:0 "Tecnocracia"
 technocracy_desc:0 "La tecnocracia es un sistema en el que tecnócratas con ciencia, tecnología y especialización gestionan la sociedad. Por lo general, el gobierno se ejerce como una oligarquía mediante un comité compuesto por tecnócratas."
 technocracy_communism:0 "Comunismo Tecnocrático"
 technocracy_communism_desc:0 "Como una forma de tecnocracia, el comunismo tecnocrático es un sistema en el que tecnócratas con ciencia, tecnología y especialización administran una economía socialista."
 technocracy_fascism:0 "Política de orden tecnocrática"
 technocracy_fascism_desc:0 "Para coordinar la relación entre los kivotosianos y los locales, y materializar el 'orden previo a la Gran Transposición', es necesaria una 'gobernanza del poder público' por parte de un grupo fuerte, autoritario y cerrado. Para ello, ampliaremos de forma general el fortalecimiento del poder judicial y el secretismo del gobierno."
 artnocracy:0 "Artnocracia"
 artnocracy_desc:0 "La artnocracia es una variante similar en sistema a la tecnocracia, aunque persigue valores distintos: un régimen en el que artócratas con sensibilidad artística y especialización gestionan la sociedad. Por lo general, el gobierno se ejerce como una oligarquía mediante un comité compuesto por artócratas."
 artnocracy_fascism:0 "Política de orden artnocrática"
 artnocracy_fascism_desc:0 "Para coordinar la relación entre los kivotosianos y los locales, y materializar el 'orden previo a la Gran Transposición', es necesaria una 'gobernanza del poder público' por parte de un grupo fuerte, autoritario y cerrado. Para ello, ampliaremos de forma general el fortalecimiento del poder judicial y el secretismo del gobierno."
 fascism_hitler:0 "Partido Nacionalsocialista Obrero Alemán"
 fascism_hitler_desc:0 "§R¡Ha regresado!§!\n\nPor algún motivo, el Führer Supremo desaparecido, Adolf Hitler, ha sido encontrado en Irlanda. Se desconoce cómo ha podido volver Hitler, que había desaparecido, pero ahora es momento de seguirlo.\n\n¡heil hitler!"
 tea_party_ideology:0 "Triunvirato de Trinity"
 tea_party_ideology_desc:0 "Este singular sistema de gobierno de Trinity, que adopta la forma de una oligarquía por consenso, se construye a través de la pugna y la conquista del poder político. El ejercicio del poder se lleva a cabo mediante el Tea Party, donde los líderes de las tres facciones §gPater§!, §HFilius§! y §GSanctus§! se turnan para ejercer como anfitrión. Este sistema está especializado en distorsionar las opiniones de estudiantes y masas, y en propagar el pensamiento faccionalista."
 hardboiled_noir:0 "Rikuhachimaismo"
 hardboiled_noir_desc:0 "El rikuhachimaismo es una ideología panetnonacionalista de Kivotos que sostiene que, mientras subsista la cultura local, la convivencia mutua entre los locales y los kivotosianos es imposible; y que, para la armonía entre los kivotosianos y los locales, son necesarias la erradicación total de la cultura humana local, un fuerte ateísmo de Estado y la unidad de los kivotosianos.\n\nA diferencia de otras regiones como Alemania, Francia o el norte de Europa, donde durante la 'Gran Transposición' se produjo el colapso del orden existente, Luxemburgo conservó su territorio y mantuvo intactos los sistemas de partidos, cultura y religión de los locales. Por ello, Luxemburgo quedó como un caso raro de país que intentó la convivencia con los kivotosianos manteniendo la posición social de los locales.\n\nSin embargo, el partido local de derechas de Luxemburgo miraba a las academias de Kivotos, compuestas por mujeres, como 'inferiores', y tanto los seguidores nazis locales como las fuerzas católicas también rechazaban a los kivotosianos. El ideal de Aru, que impulsaba una convivencia igualitaria entre kivotosianos y locales, fue pisoteado y utilizado por las fuerzas políticas locales; y Aru, habiendo perdido toda esperanza en la humanidad, llegó a creer que solo el desmantelamiento total de la cultura local podría proteger a los kivotosianos.\n\nIndependientemente del panetnonacionalismo del rikuhachimaismo, la estructura de poder de la Agencia 68 se basa en una dictadura personal centrada en Rikuhachima Aru."
 monarchist_socialism:0 "Socialismo Monárquico"
 monarchist_socialism_desc:0 "Un Estado socialista y una monarquía no suelen combinarse, pero históricamente, como resultado de diversos compromisos, se ha discutido e incluso llegado a materializar la coexistencia entre socialismo y monarquía. El primer caso es cuando comunistas relativamente débiles, en comparación con los monárquicos, aceptan por compromiso tolerar la monarquía incluso tras la comunización. Un ejemplo representativo es el de Mongolia, donde tras la comunización de 1921, el Bogd Khan mantuvo el poder hasta 1924.\n\nPor el contrario, el socialismo monárquico también puede ser un compromiso que los monárquicos ofrecen a los comunistas para restaurar la monarquía bajo un sistema comunista fuerte. El movimiento monárquico soviético Mladorossi propuso una alternativa en la que se mantuviera el sistema comunista de la Unión Soviética, pero el zar se convirtiera en el símbolo de la Unión.\n\nPor último, existe el caso en que el propio marxismo, al ser reformado repetidas veces, se vuelve lo bastante moderado como para permitir la monarquía. Un ejemplo representativo es el modelo nórdico de socialdemocracia, creado mediante el compromiso entre capitalistas y socialistas tras el Acuerdo de Saltsjöbaden."
 monarchist_socialism_democratic:0 "Socialismo Monárquico"
 monarchist_socialism_democratic_desc:0 "Un Estado socialista y una monarquía no suelen combinarse, pero históricamente, como resultado de diversos compromisos, se ha discutido e incluso llegado a materializar la coexistencia entre socialismo y monarquía. El primer caso es cuando comunistas relativamente débiles, en comparación con los monárquicos, aceptan por compromiso tolerar la monarquía incluso tras la comunización. Un ejemplo representativo es el de Mongolia, donde tras la comunización de 1921, el Bogd Khan mantuvo el poder hasta 1924.\n\nPor el contrario, el socialismo monárquico también puede ser un compromiso que los monárquicos ofrecen a los comunistas para restaurar la monarquía bajo un sistema comunista fuerte. El movimiento monárquico soviético Mladorossi propuso una alternativa en la que se mantuviera el sistema comunista de la Unión Soviética, pero el zar se convirtiera en el símbolo de la Unión.\n\nPor último, existe el caso en que el propio marxismo, al ser reformado repetidas veces, se vuelve lo bastante moderado como para permitir la monarquía. Un ejemplo representativo es el modelo nórdico de socialdemocracia, creado mediante el compromiso entre capitalistas y socialistas tras el Acuerdo de Saltsjöbaden."
 plutocracy_ideology:0 "Plutocracia"
 plutocracy_ideology_desc:0 "La plutocracia es un sistema político dominado por el poder económico de una clase o estrato adinerado."
 syndicalism:0 "Sindicalismo"
 syndicalism_desc:0 "El sindicalismo exige una gestión autónoma por parte de los sindicatos y, para alcanzarla, defiende la acción directa de los trabajadores. Como se compone principalmente de obreros de base, es una de las corrientes socialistas más activas."
 war_communism:0 "Comunismo de guerra / Gobierno militar de izquierda"
 war_communism_desc:0 "El comunismo de guerra y el gobierno militar de izquierda son sistemas en los que, bajo una movilización autoritaria, el Estado ejerce control sobre la política, la industria y, en ocasiones, sobre la vida cotidiana en general.\n\nEl comunismo de guerra es un régimen económico-político adoptado por un gobierno u organización que se proclama comunista para llevar a cabo una guerra de manera fluida. El caso más representativo es el del gobierno bolchevique durante la Guerra Civil rusa, entre 1918 y 1921; concretamente, se aplicaron nacionalizaciones violentas, exclusión del mercado, requisas de alimentos y un sistema de racionamiento de bienes esenciales.\n\nEl gobierno militar de izquierda se refiere a un sistema en el que una facción militar de tendencia comunista se hace con el poder del Estado mediante un golpe de Estado, o en el que un mando militar comunista administra territorios ocupados. Por lo general, se distingue de los gobiernos socialistas civiles por un marcado carácter militar."
 scandinavian_social_democracy:0 "Socialdemocracia"
 scandinavian_social_democracy_desc:0 "La socialdemocracia escandinava se refiere a la transformación ideológica —o al proceso en su conjunto— por el cual los partidos socialdemócratas de Suecia, Noruega y Dinamarca, a diferencia de otros partidos socialdemócratas de entreguerras, van reduciendo la brecha entre las demandas de las masas y el marxismo revisionista tras una subversión revolucionaria y radical del sistema, inclinándose hacia la izquierda de manera gradual pero decidida."
 Cohabitism:0 "Cohabitismo"
 Cohabitism_desc:0 "El cohabitismo es una ideología democrática que integra a los kivotosianos y a los europeos dentro de una misma comunidad política, definiendo la identidad de especie como eje primario y la identidad nacional como eje secundario. Su principio central es garantizar a todos los miembros oportunidades legales y sociales iguales. El sistema político aspira a una democracia centralizada, pero adopta una estructura que permite contrapesos y equilibrio al distribuir de forma similar las facultades del presidente y del parlamento. Comparte similitudes con el énfasis en la igualdad cívica del nacionalismo cívico, pero se distingue en que parte de una separación sustantiva: la 'coexistencia de dos especies' antes que una 'ciudadanía común'.\n\nEn última instancia, el Estado sostiene que debe atenuar las distinciones nacionales y enfatizar una identidad común a nivel de especie, afirmando que solo la coexistencia entre especies diferentes preserva la estabilidad social y la identidad nacional. Para ello, el gobierno central utiliza fuertes instrumentos de control como educación integradora, política de lengua común e integración de instituciones públicas. Sin embargo, pueden surgir efectos secundarios como la dilución cultural y lingüística, la pérdida de tradiciones minoritarias y un desarrollo desigual entre regiones; para compensarlo, se aplican simultáneamente dispositivos institucionales como la distribución federal de competencias y un sistema de múltiples capitales, asegurando representación regional y equilibrio de desarrollo.\n\nComo mecanismos prácticos, incluye la formación de un espacio político común mediante bienestar universal, educación pública y política lingüística; programas de intercambio y reconocimiento mutuo entre especies; garantía limitada de autonomía regional y concentración de las competencias centrales en seguridad y diplomacia. En suma, el cohabitismo es 'una ideología democrática diseñada para que grupos distintos coexistan de forma continua dentro de un mismo Estado, reconociendo la especie como unidad básica, pero garantizando igualdad de oportunidades y una fuerte capacidad integradora del centro'."
 Civil_nationalism:0 "Nacionalismo cívico"
 Civil_nationalism_desc:0 "El nacionalismo cívico (nacionalismo civil) es una ideología que no basa la cohesión nacional en la sangre ni en la homogeneidad lingüística o cultural, sino en la ciudadanía como comunidad política, la constitución, la igualdad ante la ley y los procedimientos políticos compartidos. Considera que el sentido de pertenencia de los miembros del Estado no proviene del linaje, sino de la 'voluntad de vivir juntos' y de la lealtad a las instituciones públicas; y entiende el Estado como una unión voluntaria de ciudadanos soberanos.\n\nSus raíces intelectuales se encuentran en la Ilustración y en los discursos políticos de las revoluciones estadounidense y francesa. En particular, Ernest Renan expresó la idea de que 'la nación es un plebiscito cotidiano' (o un consentimiento diario), presentando la voluntad del pueblo como el núcleo de la cohesión. Por ello, el nacionalismo cívico busca formar y mantener la identidad nacional mediante procedimientos legales y políticos y virtudes cívicas (educación cívica, debate público, sufragio universal, etc.).\n\nEn el contexto del siglo XIX, el nacionalismo cívico se ha contrapuesto al nacionalismo romántico u orgánico (por ejemplo, los discursos herderianos centrados en sangre y cultura). Mientras este último veía a la nación como una continuidad natural e histórica, la perspectiva cívica enfatiza la elección política y la aceptación de normas a través de la nacionalidad y la ciudadanía. En la práctica, tuvo una fuerte tendencia a integrar grupos de orígenes diversos en una misma comunidad política mediante la constitución, el Estado de derecho y políticas inclusivas (expansión de ciudadanía, educación pública, etc.)."
 culturlic_Integralism:0 "Socialismo democrático"
 culturlic_Integralism_desc:0 "El socialismo democrático es una corriente política e intelectual formada a finales del siglo XIX por la combinación del socialismo utópico, la tradición cartista y el socialismo gradualista y parlamentario. Esta ideología busca realizar la igualdad social y económica mediante procedimientos democráticos e instituciones públicas, con el objetivo de la gestión social de los medios de producción, la ampliación de lo público y políticas de bienestar extensas. En lugar de seguir sin cambios la línea marxista tradicional de derrocamiento revolucionario inmediato, adopta una vía gradual que mitiga y transforma las contradicciones del capitalismo mediante elecciones, parlamento, sindicatos y reformas legislativas.\n\nEn su núcleo intelectual destaca la influencia del revisionismo (Eduard Bernstein), que sostenía que era posible acercarse a los objetivos socialistas mediante reformas a través de sindicatos y partidos. La corriente fabiana británica enfatizó la transformación paulatina de la sociedad mediante instituciones y políticas. En cambio, la izquierda revolucionaria, como Rosa Luxemburgo, criticó con dureza el gradualismo, y existieron intensos debates internos y entre facciones.\n\nEn la práctica política y económica, partía de la democracia política —sufragio universal, multipartidismo—, pero daba importancia a la expansión del sector público, el fortalecimiento de los derechos laborales y el control social y la gestión democrática de la economía (por ejemplo, administración cooperativista). No consideraba la nacionalización total de la industria y las finanzas como condición indispensable, y tendía a organizar la economía de forma democrática mediante regulación, propiedad social y modelos de gestión solidaria."
 culturlic_Integralism_com:0 "Socialismo democrático"
 culturlic_Integralism_com_desc:0 "El socialismo democrático es una corriente política e intelectual formada a finales del siglo XIX por la combinación del socialismo utópico, la tradición cartista y el socialismo gradualista y parlamentario. Esta ideología busca realizar la igualdad social y económica mediante procedimientos democráticos e instituciones públicas, con el objetivo de la gestión social de los medios de producción, la ampliación de lo público y políticas de bienestar extensas. En lugar de seguir sin cambios la línea marxista tradicional de derrocamiento revolucionario inmediato, adopta una vía gradual que mitiga y transforma las contradicciones del capitalismo mediante elecciones, parlamento, sindicatos y reformas legislativas.\n\nEn su núcleo intelectual destaca la influencia del revisionismo (Eduard Bernstein), que sostenía que era posible acercarse a los objetivos socialistas mediante reformas a través de sindicatos y partidos. La corriente fabiana británica enfatizó la transformación paulatina de la sociedad mediante instituciones y políticas. En cambio, la izquierda revolucionaria, como Rosa Luxemburgo, criticó con dureza el gradualismo, y existieron intensos debates internos y entre facciones.\n\nEn la práctica política y económica, partía de la democracia política —sufragio universal, multipartidismo—, pero daba importancia a la expansión del sector público, el fortalecimiento de los derechos laborales y el control social y la gestión democrática de la economía (por ejemplo, administración cooperativista). No consideraba la nacionalización total de la industria y las finanzas como condición indispensable, y tendía a organizar la economía de forma democrática mediante regulación, propiedad social y modelos de gestión solidaria."
 ABYDOS_democracy:0 "Centralismo democrático de Abydos"
 ABYDOS_democracy_desc:0 "El centralismo democrático de Abydos es un sistema tradicionalmente heredado en Abydos que busca combinar el libre debate interno (democracia) con la ejecución unificada de lo decidido (centralismo). Se consolidó enfatizando la concordancia entre debate y acción dentro del consejo estudiantil y del instituto, y posteriormente fue adoptado como principio organizativo central de Shemata y de diversos regímenes de Abydos.\n\nEn concreto, dentro del consejo estudiantil se permite un debate y crítica activos; pero una vez tomada una decisión, todos los estudiantes deben seguirla y, hacia el exterior, actuar con una única línea. Las organizaciones inferiores están obligadas a ejecutar las decisiones de las superiores, y se estipula que las opiniones minoritarias pueden expresarse dentro de la escuela, pero no deben obstaculizar la acción decidida.\n\nDebido a la particularidad de Abydos, fuera del centro se permite una amplia autonomía local, pero el poder central se concentra principalmente en una sola persona. El centralismo democrático reformado de Abydos define la escuela como Estado y el consejo estudiantil como parlamento, y permite que incluso los locales no estudiantes tengan una voz significativa; sin embargo, si persisten la represión de minorías y la exclusión de facciones, entraña una alta posibilidad de evolucionar hacia una dictadura de facto de un solo individuo."
 Self_Reliance:0 "Ilustracionismo estatal"
 Self_Reliance_desc:0 "El ilustracionismo estatal es una ideología basada en el nacionalismo de Kivotos, que sostiene que los kivotosianos superiores tienen el deber de 'kivotosizar' Europa. En esta ideología se considera que los kivotosianos son intrínsecamente superiores a los locales, y se cree que deben expandir su cultura y construir una sociedad unificada. En el centro del ilustracionismo estatal se sitúa un líder que es a la vez 'guía', 'profeta' e 'iluminador'. Este líder es considerado como quien conducirá a Kivotos hacia la gloria en tiempos de crisis, y se exige hacia él un seguimiento fanático cercano a la fe.\n\nEsta doctrina sostiene con fuerza la unificación de Kivotos, afirmando que la 'Gran Transposición' fue una revelación divina y que constituye un mensaje de Dios que ordena dominar a los locales y avanzar como gobernantes del nuevo mundo. En este sentido, el ilustracionismo estatal posee simultáneamente elementos socialistas que enfatizan la completa igualdad entre kivotosianos, y un aspecto imperialista que considera a los locales como objeto de dominación. Además, adopta un sistema de dictadura personal en el que todo el poder se concentra en el líder, buscando controlar con fuerza al conjunto del país mediante un gobierno centralizado.\n\nEn consecuencia, el ilustracionismo estatal aparece como una mezcla de todo tipo de ideas. El deber de unificación y expansión basado en la superioridad del pueblo de Kivotos, y la exigencia de confianza y lealtad absolutas hacia el líder durante ese proceso, adquieren el carácter de consignas simples que llegan con facilidad a las masas. Así, este ilustracionismo estatal, donde se entremezclan diversos elementos ideológicos, transmite un mensaje político y social amplio y, una vez se expande, tiende a propagarse con fuerza, casi como una religión."
 Government_Federalism:0 "Federalismo de gobierno"
 Government_Federalism_desc:0 "El federalismo de gobierno, en pocas palabras, es una forma en la que dos o más gobiernos con instituciones completamente iguales dentro de un mismo país se integran en uno solo.\nA primera vista puede parecer una institución, pero esta idea no es una doctrina rígida aplicable en toda circunstancia, sino que cambia de manera flexible según la situación, buscando la forma más óptima.\n\nCada gobierno coopera dentro de un Estado unitario, moviéndose como si fueran facciones.\nEste sistema puede asemejarse a la política de partidos o al modelo de los Estados Unidos, pero en este sistema pueden existir partidos bajo cada gobierno, y funciona estrictamente como un solo Estado unitario, no como un distrito autónomo, una federación estatal o una confederación.\nSin embargo, en cuanto al jefe de Estado que representa al gobierno o al país, se elige desde cada gobierno y se conforma una asamblea general.\nLas diferencias administrativas de las regiones donde se ubica cada gobierno, así como las diferencias étnicas y culturales preexistentes, no se distinguen por ley, y las reglas se establecen como la forma máxima de mandato para definir dichas diferencias.\nAdemás, los distritos autónomos y las sedes no se separan como divisiones administrativas.\n\nComo pensamiento político tiene muchos vacíos y, en general, es una idea experimental, pero un hecho seguro es que solo es válida en países con un territorio muy pequeño."
 satsukiism:0 "Gobierno de Satsuki"
 satsukiism_desc:0 "El gobierno de Satsuki se refiere a un régimen de ingeniería psicológica altamente avanzado, liderado no por una ideología tradicional ni por un movimiento de masas, sino por la propia Kogyoku Satsuki, directora de inteligencia del Pandemonium. El 'Proyecto NK Ultra' que constituye la base de este sistema va más allá de la simple propaganda: utiliza todas las redes de información y los medios del Estado para intervenir en el propio proceso de pensamiento de las masas y conducir conclusiones específicas como si fuesen un 'consenso natural'.\n\nPor ello, la sociedad bajo el gobierno de Satsuki presenta una extraña dualidad. En tanto los asuntos cruciales del Estado se deciden según la voluntad de Satsuki, se asemeja a una monarquía absoluta perfecta; pero los ciudadanos no sienten opresión ni coacción, y creen que se suman a la armonía social por su propio juicio. El debate y el conflicto se consideran ineficiencias innecesarias y desaparecen, y la sociedad se mueve estable y armónicamente como si fuese un enorme organismo.\n\nPor tanto, en el 'gobierno de Satsuki' no existen partidarios entusiastas ni camaradas ideológicos. Solo existen 'ciudadanos' que cumplen el rol asignado dentro de un orden silencioso y estable. En última instancia, esto materializa una sociedad distópica sin precedentes: extraordinariamente estable, pero perfectamente controlada, donde el libre albedrío individual queda totalmente subordinado a un orden diseñado."
 satsukiism_B_1_1:0 "Democracia de concordia"
 satsukiism_B_1_1_desc:0 "La democracia de concordia es una ideología política singular que renació mediante la autonegación del sistema de dominio mental unilateral de Kogyoku Satsuki. El punto de inflexión de este sistema llegó cuando la propia presidenta Satsuki reconoció la inhumanidad del Proyecto NK Ultra, se disculpó oficialmente ante las antiguas fuerzas rivales y declaró el fin del proyecto.\n\nSorprendentemente, incluso la oposición de antaño toleró ese oscuro legado. Se formó una percepción compartida de que, sin aquella unificación coercitiva, no se habría podido evitar una guerra civil devastadora y conflictos étnicos. Bajo este extraño consenso social, las tecnologías de propaganda y de inducción psicológica que dejó NK Ultra no se descartaron, sino que recibieron un nuevo propósito.\n\nAhora, estas tecnologías se utilizan de forma limitada como una herramienta de 'armonización' destinada a suturar conflictos entre etnias y guiar el consenso social, en lugar de imponer la voluntad de un líder único. El Estado ya no controla las ideas individuales, pero guía suavemente, desde lo invisible, para que toda la sociedad avance hacia el objetivo común de la 'concordia'.\n\nEn consecuencia, la democracia de concordia respeta en apariencia el pluralismo y los procedimientos democráticos, pero en su trasfondo opera una fuerte voluntad de impedir de raíz los conflictos radicales de la sociedad. Es una forma nueva de democracia que busca la paz no en una libertad completa, sino en una 'concordia administrada'."
 satsukiism_B_1_2:0 "Democracia al estilo Satsuki"
 satsukiism_B_1_2_desc:0 "El gobierno de Satsuki se refiere a un régimen de ingeniería psicológica altamente avanzado, liderado no por una ideología tradicional ni por un movimiento de masas, sino por la propia Kogyoku Satsuki, directora de inteligencia del Pandemonium.\n\nLa democracia al estilo Satsuki que ella propone actualmente es un sistema dictatorial que lleva el disfraz de una democracia avanzada, completado mediante un uso aún más sutil de la psicología de masas. En la superficie, parece respetar una competencia política sana y procedimientos democráticos a través de un bipartidismo que representa respectivamente a Gehenna y a Alemania.\n\nPero por debajo existe una política en la sombra que, mediante un 'Proyecto NK Ultra' reforzado, controla por completo incluso la dirigencia y las agendas clave del partido opositor. Los acalorados debates parlamentarios y los enfrentamientos entre partidos no son más que una gran obra teatral, escenificada según el guion de la presidenta Satsuki.\n\nEl pueblo cree que participa en la política por libre voluntad, y acaba venerando a Satsuki como una 'gran líder' que 'resuelve' esos conflictos artificialmente producidos e integra a la nación. Este proceso inculca un fuerte sentido de pertenencia y eficacia política, pero, al final, todas las opciones se mueven únicamente dentro de la intención de Satsuki.\n\nEn consecuencia, esta es la distopía más estable y perfeccionada: incluso el conflicto se utiliza como herramienta perfecta de control. El pueblo cree que apoya al líder y ama a la patria por voluntad propia, pero desde el principio solo existía una única opción."
 satsukiism_B_2_1:0 "Oligarquía del telón"
 satsukiism_B_2_1_desc:0 "La oligarquía del telón es una forma en la que la filosofía de gobierno de Kogyoku Satsuki evoluciona más allá del dominio personal y se convierte en el propio sistema. Bajo este régimen, el Estado es operado por una organización secreta única que conoce la verdad de NK Ultra, y Satsuki da un paso atrás como autoridad absoluta para convertirse en un punto de unión simbólico de un liderazgo colectivo.\n\nEn la superficie, dentro de la organización existen diversas facciones y las políticas se deciden mediante debate democrático y consenso. Sin embargo, fuera de todo ese proceso existe un 'telón'. La tecnología 'NK Ultra', que antes controlaba mentes individuales, renació ahora, bajo el nombre del partido, como un gran dispositivo de armonización que induce la coexistencia de toda la sociedad.\n\nEsta tecnología no impone una opinión específica. En su lugar, diluye suavemente las ideas radicales que generan conflicto y solo guía para que todo debate concluya en la causa mayor de la integración social. El pueblo cree que, en plena libertad de pensamiento, alcanza las conclusiones más ideales, y siente satisfacción ante el perfecto consenso social que surge en el proceso.\n\nComo resultado, la oligarquía del telón realiza la forma más ideal de Estado integrado. Una sociedad donde todos armonizan voluntariamente no por coerción ni dictadura, sino bajo una 'buena voluntad' invisible. Es la utopía más pacífica y, a la vez, la más meticulosamente diseñada."
 satsukiism_B_2_2:0 "Pensamiento"
 satsukiism_B_2_2_desc:0 "Esta es la etapa final y la forma más perfecta del gobierno de Satsuki. El Estado ya no es un conjunto de individuos diversos, sino solo el yo expandido de una única líder: Kogyoku Satsuki. Su voluntad es ley y verdad, y su pensamiento es la única ideología de toda la nación.\n\nTodas las funciones de la sociedad están perfectamente controladas por cuatro departamentos con nombres paradójicos: el Departamento de la Verdad, el Departamento de la Paz, el Departamento del Amor y el Departamento de la Abundancia. El Departamento de la Verdad delimita el pasado; el Departamento de la Paz administra a los enemigos internos y externos para una estabilidad eterna; el Departamento del Amor inculca lealtad absoluta; y el Departamento de la Abundancia distribuye todos los recursos de la forma más 'eficiente'.\n\nBajo este sistema, el 'Proyecto NK Ultra' ya no es una simple técnica de lavado de cerebro. Es una herramienta de manipulación de la realidad que reconfigura la conciencia del pueblo y llega incluso a hacer desaparecer el propio concepto de palabras como 'libertad' o 'traición'. El individuo ha desaparecido, y solo quedan piezas que existen para el partido y la líder. Aquí no hay conflicto, ni duda, ni dolor. Solo un orden y una obediencia perfectos, y una paz hueca que nace de ello, continuarán por siempre."
 satsukiism_C_1:0 "Gobierno del consejo estudiantil hipnótico"
 satsukiism_C_1_desc:0 "El gobierno del consejo estudiantil hipnótico es un singular sistema sociopolítico que convierte a la 'Academia de Psicología de Gehenna' en la academia ideal. Para la mayoría de los estudiantes, la escuela parece un mundo de novela ligera. Sin conflictos ni disputas graves, todos avanzan hacia sus sueños y continúa una vida escolar cotidiana, casi perfecta, de final feliz.\n\nEl secreto de esta armonía ideal reside en las técnicas básicas de inducción psicológica que aprenden todos los estudiantes. Con ello, se cuidan y se entienden entre sí, y los conflictos destructivos se disuelven de forma natural.\n\nPero el verdadero núcleo del sistema es el 'crecimiento y el despertar'. Mediante el curso avanzado, los estudiantes sobresalientes penetran la esencia de la estructura psicológica que sostiene esta sociedad y, finalmente, pueden 'graduarse' de las restricciones mentales por sí mismos. Solo una minoría de élites, que se comprenden a sí mismas por completo y alcanzan la verdad del sistema, obtiene el derecho de ingresar al máximo órgano de decisión del Estado: el 'Consejo Estudiantil'.\n\nEn consecuencia, este lugar es a la vez una academia ideal donde la mayoría vive una vida escolar feliz, y un mundo donde unos pocos despertados trabajan para proteger esa felicidad. El Consejo Estudiantil no oprime a las masas. Simplemente 'protege' con suavidad, en paz, a quienes aún no han despertado."
 pandemonium:0 "Pandemonium de Gehenna"
 pandemonium_desc:0 "La política de la Pandemonium Society es muy peculiar. El sistema político, nacido de la baja participación política de los estudiantes, hace difícil incluso distinguir si realmente son un consejo estudiantil o solo un grupo que se autoproclama como tal. La única prueba de su autoridad es un certificado emitido por el Consejo Estudiantil General de Kivotos."
 neopandemonium:0 "Pandemonium reformado"
 neopandemonium_desc:0 "Es el consejo estudiantil de Gehenna, reformado a partir del sistema político del antiguo Pandemonium, que surgía de la baja participación política estudiantil, y que ahora funciona con normalidad. Se trata de una ideología política que se sostiene sobre rasgos físicos característicos como los cuernos propios de los 'estudiantes de Gehenna', y sobre diversos sentimientos nacionalistas derivados de ello."
 makotoism_A1:0 "Corporativismo estatal"
 makotoism_A1_desc:0 "El corporativismo estatal es una ideología totalitaria basada en un nacionalismo extremo. Este pensamiento busca poner fin a todos los conflictos internos organizando a todos los miembros de la sociedad —trabajadores, capitalistas, campesinos, etc.— en sus respectivas 'corporaciones' controladas por el Estado. Al eliminar elementos 'antinacionales' como la lucha de clases o la confrontación política, el régimen moviliza todas las capacidades del país para alcanzar la 'gran empresa' presentada por un líder absoluto llamado el 'Führer'.\n\nEl corporativismo estatal muestra similitudes con el nacionalsocialismo existente en varios aspectos, pero posee una diferencia decisiva: define el criterio de la nación no por la 'sangre', sino por la 'lealtad absoluta al Führer y al Estado'. Con ello, el régimen actual asegura un pretexto para erosionar y absorber la base de apoyo del viejo partido nazi y, al mismo tiempo, integrar dentro del sistema el elemento heterogéneo de provenir de Gehenna. En otras palabras, se proclama como una 'nueva y competente' alternativa que reemplaza al nazismo viejo y fracasado.\n\nEste sistema se mantiene mediante una fuerte propaganda que refuerza el culto a la personalidad del líder, y una represión despiadada de toda fuerza opositora. En última instancia, lo que el corporativismo estatal persigue, más allá de la integración interna, es un 'expansionismo agresivo'. Movilizar todos los recursos de un Estado unificado para finalmente conquistar el mundo: ese es el objetivo final de esta ideología."
 makotoism_B:0 "Nacionalismo hegemónico ultramundano"
 makotoism_B_desc:0 "El nacionalismo hegemónico ultramundano es una ideología ultranacionalista radical basada en un pacto sagrado entre los germanos y los gehnanos, llamados los dos 'pueblos elegidos'.\n\nLos seguidores de esta doctrina interpretan la 'Gran Transposición' no como una simple casualidad, sino como una revelación sagrada: que el 'pueblo nórdico' heredero de los mitos del norte y el 'pueblo de Gehenna' nacido del valle de Hinnom deben encontrarse para gobernar el mundo. Creen que estos dos 'pueblos de los dioses' nacieron con el destino de dominar a todos los demás pueblos inferiores.\n\nPolíticamente, esto se manifiesta como un régimen de cogobierno entre los dos pueblos dominantes, y el líder hereda a la vez los mitos del Nord alemán y del Hinnom gehnano, asegurando una legitimidad de dominio que trasciende la sangre.\n\nEn última instancia, esta ideología, bajo la bandera de una nueva civilización dominante llamada 'Nord-Hinnom', fija como objetivo final integrar primero a la dividida Kivotos y, más allá, una expansión infinita que convierte a toda Europa en su espacio vital."
 makotoism_B1:0 "Corporativismo popular ultramundano"
 makotoism_B1_desc:0 "El corporativismo popular ultramundano es una ideología autoritaria pragmática que, tras la expulsión del impredecible gobierno personal de Hanuma Makoto, reestablece el mito existente de la 'alianza de los dioses' como base del control estatal.\n\nEsta doctrina ya no utiliza el 'pacto sagrado' entre germanos y gehnanos como herramienta para la empresa caprichosa de un líder, sino como una fuente permanente de legitimidad que sostiene al Estado.\n\nBajo la bandera del 'corporativismo popular', ambos pueblos son organizados en corporaciones según su 'rol' y 'contribución' al Estado, no según sangre o ideología. Partidos, empresas y organizaciones laborales son estructurados para servir, bajo una dirección estatal unificada, a un único objetivo: la 'estabilidad nacional'.\n\nEn la superficie avanzan reformas democráticas a través del parlamento, pero no son más que una 'democracia administrada' estrictamente controlada. El poder real se concentra absolutamente en un nuevo directorio, que reprime a todas las fuerzas opositoras en nombre de la causa de 'prevenir el regreso del caos'.\n\nEn última instancia, esta ideología rechaza el expansionismo frenético de Makoto y apunta a un Estado estable que refuerza la cohesión interna mediante un fuerte poder central. El mito del 'pueblo de los dioses' funciona ahora únicamente como un poderoso adhesivo social que moldea a ciudadanos conformes con esta enorme maquinaria estatal."
 makotoism_B2:0 "Liberalismo nacional ultramundano"
 makotoism_B2_desc:0 "El liberalismo nacional ultramundano, una ideología estable surgida tras disiparse la locura del temprano nacionalismo hegemónico ultramundano, es una ideología ultraliberal radical basada en el pacto sagrado entre los germanos y los gehnanos, llamados los dos 'pueblos elegidos'.\n\nLos seguidores de esta doctrina interpretan la 'Gran Transposición' no como una simple casualidad, sino como una revelación sagrada: que el 'pueblo nórdico' heredero de los mitos del norte y el 'pueblo de Gehenna' nacido del valle de Hinnom deben encontrarse para gobernar el mundo. Se predice que estos dos 'pueblos de los dioses' han sido profetizados para levantar el Estado más pacífico.\n\nPolíticamente, esto se manifiesta como un régimen de cogobierno entre los dos pueblos dominantes, y el líder hereda a la vez los mitos del Nord alemán y del Hinnom gehnano, asegurando una legitimidad de dominio que trasciende la sangre.\n\nEn última instancia, esta ideología, bajo la bandera de una nueva civilización dominante llamada 'Nord-Hinnom', supera el viejo expansionismo y se dedica a cuidar la patria, dañada por el belicismo extremo."
 satsukiism_makoto_B:0 "Restauracionismo de Gehenna"
 satsukiism_makoto_B_desc:0 "El restauracionismo de Gehenna es una ideología proclamada por el 'libertador' Hanuma Makoto tras poner fin por la fuerza al engañoso control mental de Kogyoku Satsuki, que aboga por el retorno al espíritu fundamental de Gehenna.\n\nEl núcleo de esta ideología reside en definir la armonía artificial y el silencio creados por Satsuki como una 'paz falsa' y una 'muerte mental'. Los restauracionistas sostienen que las explosiones del Club de Investigación Gastronómica, los desmanes del Club de Desarrollo de Aguas Termales y la confrontación interminable con el Comité de Disciplina son la 'prueba viviente' que demuestra el alma libre y la vitalidad inextinguible de Gehenna.\n\nPor ello, el restauracionismo de Gehenna no presenta un sistema complejo ni un programa detallado. En su lugar, establece como máxima prioridad abolir todo control opresivo y devolver una autonomía completa a todas las organizaciones de la academia y a cada estudiante. El orden existe en su forma mínima, y se cree que el Estado hallará por sí mismo su equilibrio en medio de conflictos y caos diversos.\n\nEn última instancia, esto significa un retorno perfecto a la 'Gehenna original': impredecible, ruidosa y con problemas que estallan sin cesar. Para ellos, un paraíso controlado es el infierno más terrible, y el caos libre es el único cielo que Gehenna merece."
 police_nationalism:0 "Ordenismo de Kivotos"
 police_nationalism_desc:0 "Una postura que representa la línea de Valkyrie, defendida por Ogata Kanna desde la Gran Transposición hasta la actualidad; es una ideología que apoya y respalda con firmeza el orden del Consejo Estudiantil General de Kivotos."
 police_neutralism:0 "Reformismo de Kivotos"
 police_neutralism_desc:0 "El grupo reformista, reunido en torno a la oposición dentro de Valkyrie, critica la debilidad del sistema valkirio existente y sostiene que se necesita una política más fuerte para los kivotosianos."
 police_communism:0 "Nuevo ordenismo"
 police_communism_desc:0 "El nuevo ordenismo es una doctrina nacida de una serie de incidentes de choque con los locales ocurridos tras la Gran Transposición. Su núcleo es el compasionismo hacia los locales, y su idea principal sostiene que las estudiantes de Kivotos deben ser las primeras en tender la mano al pueblo de la Tierra."
 police_democratic:0 "Nuevo ordenismo"
 police_democratic_desc:0 "El nuevo ordenismo es una doctrina nacida de una serie de incidentes de choque con los locales ocurridos tras la Gran Transposición. Su núcleo es el compasionismo hacia los locales, y su idea principal sostiene que las estudiantes de Kivotos deben ser las primeras en tender la mano al pueblo de la Tierra."
 cou_kaya_dictatorship:0 "Dictadura del superhombre"
 cou_kaya_dictatorship_desc:0 "La dictadura del superhombre es el término que designa el sistema de dictadura unipersonal de Shiranui Kaya. Shiranui Kaya se autoproclama como una “superhumana” y actúa como la comandante suprema del Estado y dictadora. Aunque, en realidad, Kaya está bastante lejos de ser una “superhumana”."
 cou_ideology:0 "Oficina de Coordinación"
 cou_ideology_desc:0 "La Oficina de Coordinación del Consejo Estudiantil General es el departamento encargado de supervisar y coordinar al Consejo Estudiantil General, cumpliendo un papel similar al de una oficina presidencial. Bajo la dirección del Administrador Jefe, coopera con el Comité Administrativo y, en ocasiones, entra en conflicto con él, supervisando y gestionando Kivotos en su conjunto, tanto de forma nominal como efectiva."
 cou_ideology_the_elevens_fascism:0 "Comité Administrativo"
 cou_ideology_the_elevens_fascism_desc:0 "El Comité Administrativo del Consejo Estudiantil General cuenta oficialmente con once departamentos, y bajo el gobierno armónico de once directores ejecutivos, supervisa y administra Kivotos en su totalidad, tanto de forma nominal como efectiva."
 cou_ideology_the_elevens_neutrality:0 "Comité Administrativo"
 cou_ideology_the_elevens_neutrality_desc:0 "El Comité Administrativo del Consejo Estudiantil General cuenta oficialmente con once departamentos, y bajo el gobierno armónico de once directores ejecutivos, supervisa y administra Kivotos en su totalidad, tanto de forma nominal como efectiva."
 cou_ideology_the_elevens_communism:0 "Comité Administrativo"
 cou_ideology_the_elevens_communism_desc:0 "El Comité Administrativo del Consejo Estudiantil General cuenta oficialmente con once departamentos, y bajo el gobierno armónico de once directores ejecutivos, supervisa y administra Kivotos en su totalidad, tanto de forma nominal como efectiva."

 srt_nationalism:0 "Facción de Control de SRT"
 srt_nationalism_desc:0 "La Facción de Control de SRT es una ideología que aboga por el control de SRT. Bajo este sistema, todas las políticas del Estado se determinan conforme al juicio autónomo y racional de SRT."
 srt_democratic:0 "Facción Representativa de SRT"
 srt_democratic_desc:0 "La Facción Representativa de SRT es una ideología que defiende las actividades externas de SRT. Las actividades externas de SRT se determinan conforme al juicio autónomo y racional de SRT."
 srt_communism:0 "Facción Reformista de SRT"
 srt_communism_desc:0 "La Facción Reformista de SRT es una ideología que aboga por la reforma de SRT. La reforma de SRT se determina conforme al juicio autónomo y racional de SRT."
 srt_neutralism:0 "Facción Principista de SRT"
 srt_neutralism_desc:0 "La Facción Principista de SRT es una ideología que defiende los principios de SRT. Los principios de SRT se determinan conforme al juicio autónomo y racional de SRT."
 corporate_state_workplace_democracy:0 "Estado corporativo - democracia interna"
 corporate_state_workplace_democracy_desc:0 "La democracia interna, una ideología singular que surge dentro del Estado corporativo, distribuye de manera democrática a los trabajadores los derechos de gestión de la empresa. Este sistema puede resultar, en ocasiones, incluso más radical que el de los comunistas, lo cual sería una característica particular propia del Estado corporativo, una gigantesca concentración de capital financiero."
 corporate_state_corporatism:0 "Estado corporativo - capitalismo"
 corporate_state_corporatism_desc:0 "Este Estado es una enorme corporación que persigue beneficios, al igual que una empresa común. La propiedad corporativa se distribuye entre varios grandes accionistas y, en términos generales, adopta un sistema político similar a una oligarquía."
 corporate_state_private_enterprise:0 "Estado corporativo - empresa privada"
 corporate_state_private_enterprise_desc:0 "Este Estado es una enorme corporación gobernada por un único líder representado por el presidente. La mayoría de los derechos dentro de la empresa se concentran en una sola persona, configurando en general un sistema político similar al de una dictadura."
 corporate_state_nephtys:0 "Estado corporativo"
 corporate_state_nephtys_desc:0 "Este Estado es una enorme corporación que persigue beneficios, al igual que una empresa común. La propiedad corporativa se distribuye entre varios presidentes y miembros del consejo directivo, adoptando en general un sistema político similar a una oligarquía."

 left_council_communism:0 "Comunismo de consejos"
 left_council_communism_desc:0 "El comunismo de consejos, ubicado en el ala izquierda del movimiento socialista, aboga por la organización de consejos obreros y la gestión de toda la sociedad mediante una democracia de consejos. Critica el sistema de partido de vanguardia de la Unión Soviética, calificándolo de capitalismo de Estado, y tiende también a considerar a los sindicatos como grupos de interés capitalistas."

 criminal_enterprise:0 "Supremacía del capital"
 criminal_enterprise_desc:0 "Esta alianza de criminales venera el capital y no escatima medios cuando se trata de dinero. Desde el tráfico de drogas y el asesinato de figuras clave, hasta el robo y la guerra, harán cualquier cosa en nombre del beneficio."
 crime_vanguard:0 "Terroristas rojos"
 crime_vanguard_desc:0 "Esta alianza criminal, originada como parte de una organización revolucionaria de izquierda, cometerá atrocidades sin dudarlo si ello les permite alcanzar sus objetivos ideológicos."
 criminal_state:0 "Estado fuera de la ley"
 criminal_state_desc:0 "Este Estado, surgido de una organización criminal, se mueve bajo el mando de un líder autoritario fuerte con miras a grandes objetivos. Para ellos, la opinión de la comunidad internacional carece de toda importancia."
 crime_syndicate:0 "Sindicato criminal"
 crime_syndicate_desc:0 "El sindicato criminal, una alianza de criminales, funciona como un sistema movido por la coincidencia de intereses y, debido a su magnitud actual, ya puede considerarse un Estado en sí mismo. Procurarán mantener su propio orden y no les gusta demasiado el cambio."

 Social_Liberalism:0 "Social-liberalismo" 
 Social_Liberalism_desc:0 "El social-liberalismo es una rama del liberalismo que combina la defensa de la libertad y los derechos individuales con la preocupación por la justicia social. Sostiene que, para que todos los individuos disfruten de una libertad verdaderamente igualitaria, el Estado debe intervenir para corregir estructuras sociales desiguales y brechas económicas. El social-liberalismo defiende firmemente los derechos fundamentales y las libertades civiles, al tiempo que promueve la expansión de redes de seguridad social que garanticen la igualdad de oportunidades. A ello pertenecen la sanidad universal, el fortalecimiento del sistema de educación pública y políticas de bienestar que protejan a los ciudadanos del desempleo y la pobreza."
 National_conservatism:0 "Conservadurismo nacional"
 National_conservatism_desc:0 "El conservadurismo nacional es una rama del conservadurismo que combina el nacionalismo, una ideología que valora un colectivo nacional basado en una identidad homogénea y lazos históricos, o bien una comunidad étnica basada en vínculos de sangre, con el conservadurismo. El conservadurismo nacional impulsa movimientos sociales para promover los intereses de la comunidad a la que se pertenece, protegerla frente a la injerencia agresiva de potencias extranjeras y, más aún, fomentar la autonomía colectiva."

 pure_socialism:0 "Socialismo puro"
 pure_socialism_desc:0 "El socialismo puro es un tipo de “socialismo de derecha” formulado a comienzos del siglo XX por Kita Ikki. En un Estado de socialismo puro, el jefe de Estado actúa como un “dios viviente”, un símbolo que reúne toda la voluntad del pueblo, y como protector de la nación: implementa una economía controlada y dirigida por el Estado, y cumple el papel de ajustar el sistema para que la riqueza no se concentre en la clase capitalista adinerada. La combinación de un sistema de economía controlada por un dios viviente benevolente y el fanatismo religioso ejerció una fuerte influencia ideológica en la facción Kōdōha, una de las principales facciones del ejército japonés."

 transitioning_democracy:0 "Democracia transicional"
 transitioning_democracy_desc:0 "Un Estado en democracia transicional se sitúa, estrictamente hablando, entre una democracia plena y un régimen no democrático. Que un país derribe un sistema dictatorial no significa que su pueblo pueda volverse completamente libre de inmediato. Esto se debe a que los burócratas leales al antiguo gobierno siguen en sus puestos apoyando políticas autoritarias, y las fuerzas de seguridad que fueron leales a la dictadura también continúan sin ser reemplazadas, manteniendo el control de las organizaciones de orden público. La democracia transicional no es una ideología perseguida por el gobierno en sí misma, sino un fenómeno que aparece durante el proceso de transición de un Estado dictatorial a uno democrático tras el colapso de la dictadura."

 harmonism: "Armonismo estatal"
 harmonism_desc: "El armonismo estatal es una ideología creada por Sorazaki Hina para unificar al caótico Comité Disciplinario y utilizar eficazmente su autoridad. Sobre la base de la coexistencia entre lo local y lo de otro mundo, se le añaden múltiples calificativos: el poder de las instituciones estatales, la legitimidad histórica del Comité Disciplinario, la distribución de poder entre los estudiantes de Gehenna y los ciudadanos locales, y la compensación mutua por la Gran Transferencia junto con la cooperación de clases. Esto constituye hoy el motor que permite a Sorazaki Hina ejercer una férrea política dictatorial; y quedará como una de las ideologías que marcaron el siglo XX, y como el resultado de que el Comité Disciplinario haya atravesado el turbulento periodo de entreguerras."
 irohasm_A: "Movimiento de la Nueva Alemania"
 irohasm_A_desc: "El Movimiento de la Nueva Alemania es una ideología pragmática de reforma estatal que, bajo el gobierno de Natsume Iroha, busca desmantelar y reconstruir el nacionalismo alemán tradicional. Este movimiento rechaza tanto la fallida democracia de Weimar del pasado como la destructiva locura del nazismo, y tiene como objetivo transformar y reescribir con audacia la propia identidad de “Alemania” para adecuarla al actual Estado federal.\n\nEl núcleo de esta ideología no reside en la pureza ideológica, sino únicamente en la estabilidad y el control del Estado. Natsume Iroha se considera a sí misma una “jinete”, y cree que debe domar esa bestia indómita llamada “los alemanes” y conducirla hacia una nueva dirección. Para ello, los símbolos, leyes y culturas del pasado se conservarán si resultan útiles para el Estado; y si estorban, serán abolidos sin miramientos o sustituidos por nuevas formas.\n\nEl Movimiento de la Nueva Alemania no se reviste con la cáscara de una dictadura coercitiva. En su lugar, mediante procedimientos administrativos y reformas graduales, orienta a la sociedad hacia la dirección deseada y hace que la población crea, por sí misma, que está pasando a formar parte de una nueva Alemania. En última instancia, se trata de una forma de autoritarismo extremadamente flexible y pragmática: una que rompe con cualquier ideología del pasado y crea una “Nueva Alemania” definida únicamente por el líder actual."

 irohasm_B: "Gehenna-germanismo"
 irohasm_B_desc: "El Gehenna-germanismo no nació de una base teórica clara, sino que es una ideología de integración formada de manera espontánea dentro de la realidad político-social particular de la Federación Germano-Gehenna surgida tras la Gran Transferencia. Al principio se limitaba a enfatizar la coexistencia pacífica de ambos pueblos, pero con el tiempo se desarrolló y sistematizó como la lógica de gobierno de la presidenta federal Natsume Iroha, respaldada conjuntamente por los dos partidos.\n\nEsta ideología pone el foco en la experiencia compartida de superar el trauma común de la “Gran Transferencia”, así como en inesperadas similitudes culturales, como el hecho de valorar el orden y la disciplina y, aun así, disfrutar de los festivales. A partir de ello, establece como primera virtud del pueblo la lealtad y la contribución no a la sangre ni al mundo de origen, sino a la “Federación” como nueva comunidad.\n\nEn lo político, mantiene un sistema bipartidista entre el bloque gehenna y el bloque alemán, pero por encima de ambos coloca a un “líder electo conjunto” como símbolo de integración trascendental. Este líder media en las confrontaciones extremas entre facciones, cumple un papel simbólico para la unidad nacional y persigue ante todo la estabilidad y la prosperidad reales, por encima de la pureza ideológica. Se trata de un modelo de coexistencia pragmática singular, distinto tanto del asimilacionismo (donde una parte absorbe a la otra) como del multiculturalismo (que presupone la separación de cada grupo)."

 chiakism: "Motomiyaismo"
 chiakism_desc: "Más que una filosofía política fija, el motomiyaismo se asemeja a un gigantesco y estruendoso “show de entretenimiento político” dirigido por Motomiya Chiaki.\n\nEn este sistema, el Estado funciona como la redacción de una gran revista semanal. Para Chiaki, lo importante no es una ideología o una política coherente. Lo importante es: “¿Qué gran exclusiva voy a reventar esta semana para sorprender al público?”. Ayer puede atacar a los conglomerados como si fuera de izquierdas y gritar “¡Exclusiva de la purga anticorrupción!”, y hoy, como si fuera de derechas, puede darse la mano con las grandes empresas y sacar en portada “¡El milagro del mito del crecimiento!”.\n\nLa gente, aunque desconcertada por su rumbo impredecible, no puede apartar la vista de ese espectáculo político, estimulante y deslumbrante, que se derrama sin descanso. Esto no es más que la etapa de “reunión editorial”, en la que ella tantea aquí y allá y agranda el tablero antes de encontrar la verdadera exclusiva con la que probar su liderazgo."

 chiakism_left: "Sensacionalismo chiaki de bienestar"
 chiakism_left_desc: "El sensacionalismo chiaki de bienestar es un régimen de populismo de izquierda, dirigido por Motomiya Chiaki, donde cada día es como una fiesta. Para Chiaki, la pobreza sombría y aburrida es “noticia vieja que debe cerrarse”, y la imagen de todos sonriendo es la “gran exclusiva” que debe ocupar el titular principal.\n\nCon su grito de “¡Listos~! ¡Ya!”, el Estado abre de par en par la caja fuerte. El bienestar no cae mediante trámites administrativos aburridos, sino que se derrama sobre la ciudadanía como si fueran regalos sorpresa o sorteos. Ella considera la alegría del público como “la mejor oportunidad de foto” y, para conseguirla, no duda en abrir los almacenes de los privilegiados.\n\nComo resultado, este sistema se mueve más por la expectativa de una propaganda entusiasta que por teorías complejas. Aunque puede ser improvisado y conllevar riesgos fiscales, las masas se apasionan cada mañana con la “política tipo edición extra” de Chiaki y le otorgan un apoyo abrumador."

 chiakism_right: "Prioridad al crecimiento al estilo Chiaki"
 chiakism_right_desc: "La prioridad al crecimiento al estilo Chiaki es un régimen de crecimiento acelerado nacido de la combinación entre el “impulso de acción” característico de Motomiya Chiaki y la eficiencia tecnocrática de derechas. En este sistema, el Estado se convierte en una gran redacción, y las grandes empresas en reporteros capaces que producen exclusivas.\n\nChiaki recorta sin titubeos las regulaciones complejas y los procedimientos sofocantes, tachándolos de “historias aburridas que no dan para noticia”. En su lugar, atrae grandes capitales, levanta rascacielos, pone fábricas a funcionar y publica a toda plana, día tras día, las tasas de crecimiento que baten récords: “¡Ja, ja! ¡Notición!”. Aquí la incompetencia y el estancamiento no tienen sitio. Solo se veneran el “resultado” y la “velocidad”.\n\nEsto no es un elitismo frío. Chiaki proclama ante las masas: “¡No subestimen mi capacidad de acción!”, y exhibe los frutos del crecimiento como un espectáculo visual. Aunque el ritmo sea tan rápido que maree, bajo el deslumbrante flash de Chiaki el país avanza hacia la prosperidad como un tren desbocado que no se detiene."

 chiakism_A_1: "Sensacionalismo cooperativista al estilo Chiaki"
 chiakism_A_1_desc: "El sensacionalismo cooperativista al estilo Chiaki es un régimen de integración, el más grande y ruidoso de la historia, en el que el “sensacionalismo de bienestar” se expande más allá de las fronteras étnicas. Chiaki borró de la mesa de edición las viejas categorías de “germano” y “gehenna”, diciendo que eran “una ambientación trillada que baja el interés de los lectores”.\n\n“¡Miren aquí! ¡Click!” Dentro del lente de su cámara, todo lo que vive sobre esta tierra (estudiantes de Gehenna, antiguos germanos, ciudadanos de Weimar e incluso los descendientes de los francos dispersos en la historia) debe fusionarse en una sola gran comunidad: el “nuevo pueblo alemán (Neues Volk)”. Para la “gran epopeya conmovedora” que nacerá de este reparto diverso, abre sin reparos el tesoro nacional, y a los discriminadores que obstaculizan la armonía los trata como “extras que no saben leer el ambiente”, empujándolos fuera del escenario.\n\nEste sistema no funciona por sangre ni por historia, sino bajo el titular simple y poderoso: “¡Desde hoy, todos somos amigos!”. Aunque el proceso sea algo improvisado y escandaloso, las masas se proyectan con gusto en este cálido y sobrecogedor “drama de reconciliación” dirigido por Chiaki y estallan en fervor."

 chiakism_A_2: "Desarrollismo utilitarista prioritario al estilo Chiaki"
 chiakism_A_2_desc: "El desarrollismo utilitarista prioritario al estilo Chiaki es la conclusión racional definitiva a la que llega la “prioridad al crecimiento”. Para Chiaki, el conflicto étnico no es más que “la peor ineficiencia, de esas que ni siquiera dan para noticia”, que carcome la productividad de la gran empresa llamada Estado. Ella declara que unirá en un solo paquete el poder militar de Gehenna, la capacidad industrial de Alemania y el potencial de innumerables minorías, para desatar una sinergia sin precedentes.\n\n“¡Exclusiva! ¡Por fin he encontrado el gran ítem ganador llamado ‘gran integración’!” Chiaki desecha con audacia el viejo supremacismo de sangre y reorganiza a Gehenna, Alemania y todos los grupos heterogéneos como un megaequipo de proyecto llamado “Alemania”. Ahora, la definición de “alemán” ya no depende de la sangre, sino de cuánto contribuyes a esa gráfica de crecimiento desbocada.\n\nEsto no es una política de asimilación fría. Chiaki anuncia a toda plana la reacción explosiva que producen pueblos distintos entre sí, llamándola “la mejor oportunidad de foto para sorprender al mundo”. Aunque en el proceso se desprecie la tradición y todo se derrita en el crisol de la eficiencia, bajo el glamuroso flash que Chiaki dispara el país no se detiene y corre hacia un único objetivo: una “prosperidad aplastante”."

 chiakism_A_3: "Socialismo humanista al estilo Chiaki"
 chiakism_A_3_desc: "El socialismo humanista al estilo Chiaki es un régimen cálido y estable que nace cuando el “sensacionalismo de bienestar” llega a un acuerdo con la tradición germana. Chiaki comprendió que las reformas radicales agotaban a la población y decidió, en su lugar, construir un Estado como un “diario serio” amado durante mucho tiempo.\n\n“¡Exclusiva! ¡Gehenna no es su gobernante, sino su vecino más amable!” Ella reduce la escala de la academia Gehenna a una “pequeña Gehenna”, la depura y la reorganiza como un cuerpo de negociación de élite, al mismo tiempo que garantiza ampliamente las tradiciones y derechos propios del pueblo alemán. Ahora los gehenna ya no se posicionan como una clase privilegiada, sino como “hermosos personajes de reparto” que se integran poco a poco en la sociedad alemana mediante su dedicación.\n\nEste sistema, en lugar de una revolución estimulante, convierte en “titulares conmovedores” la sopa caliente que llega cada día y las pensiones estables. Aunque el cambio avance despacio, dentro de este “drama de convivencia imposible de ver sin lágrimas” dirigido por Chiaki, los alemanes terminan aceptando sin rechazo el liderazgo de Gehenna y le brindan un apoyo firme."

 chiakism_A_4: "Nacionalismo al estilo Chiaki"
 chiakism_A_4_desc: "El nacionalismo al estilo Chiaki es el modelo de gobierno elitista más eficiente al que llega la “prioridad al crecimiento” mediante un compromiso realista. Chiaki juzgó que reescribir a la fuerza el enorme y excelente “manuscrito” llamado nación alemana sería ineficiente. En su lugar, dejó a Gehenna como una élite reducida y escogió el camino de completar el bestseller llamado “Alemania”.\n\n“¡Cada quien a su puesto! ¡Alemania produce y Gehenna dirige! ¿No es un reparto de roles perfecto?” En este sistema, la tradición alemana y su base industrial son protegidas y respetadas a rajatabla, porque son la fuente misma de la competitividad nacional. El bloque gehenna, en vez de mezclarse con los alemanes, funciona como un grupo de administradores competentes por encima de ellos; y la integración avanza muy lentamente, aceptando solo a quienes estén verificados.\n\nEsto no es un dominio frío. Chiaki promociona con lujo de espectáculo el poderío aplastante que nace de este sistema de división perfecta del trabajo, llamándolo “¡la historia de éxito que el mundo está mirando!”. Los alemanes reconocen el liderazgo de Gehenna, que preserva su identidad, y Gehenna disfruta de la prosperidad sobre la sólida base llamada Alemania: comienza una exclusiva de simbiosis meticulosamente calculada."

 chiakism_B1: "Menchevismo al estilo Chiaki"
 chiakism_B1_desc: "El menchevismo al estilo Chiaki es el modelo socialista más racional y gradual: el Estado guía el enorme capital de las corporaciones para convertirlo en bienestar de las masas. La secretaria Chiaki eligió una línea pragmática: no una revolución bolchevique radical, sino la mejora de la vida obrera mediante una “alianza estratégica” con los capitalistas.\n\nEn política exterior, Chiaki califica y rechaza tanto la “perezosa democracia parlamentaria” de Occidente como el “rígido marxismo-leninismo” de Oriente, considerándolos planes fracasados. En su lugar, busca la solidaridad de una “tercera vía” con Estados fascistas que quieren romper la vieja dicotomía entre liberalismo y comunismo. Aunque las raíces ideológicas difieran, compartimos un punto en común: que el Estado tome con firmeza la iniciativa y “edite” eficientemente la sociedad. Por eso, tomaremos su mano sin dudar.\n\n“¡La negociación es una exclusiva mayor que la lucha; y la distribución, una exclusiva mayor que la destrucción!” Este régimen es un punto de compromiso, tan polémico como próspero, que Chiaki ha “editado” con su particular sentido del equilibrio a partir de la eficiencia del capitalismo, el ideal del socialismo y la cruda realidad del escenario internacional."

 chiakism_B2: "Conservadurismo nacional"
 chiakism_B2_desc: "El conservadurismo nacional es una poderosa ideología de populismo de derechas que coloca la seguridad nacional y la prosperidad económica como valores supremos. Para proteger “nuestra patria” de amenazas externas, se ha levantado un muro de acero mediante el esfuerzo total de todas las comunidades sociales.\n\nEn este sistema, la libertad existe bajo el orden, y el individuo funciona como parte de la gran epopeya llamada Estado. El gobierno recompensa al pueblo con el mayor de los premios: el “orgullo”, sustentado en una fuerza militar sólida y un crecimiento económico aplastante. Es un patriotismo realista y firme que rechaza el idealismo débil y conquista supervivencia y prosperidad mediante fuerza y capacidad."

 chiakism_B3: "Comunismo de Pandemonium"
 chiakism_B3_desc: "El comunismo de Pandemonium es la forma más radical y rompedoramente audaz de socialismo, liderada por Motomiya Chiaki. Ella rechaza el comunismo gris de siempre y concibe un nuevo sistema que toma la libertad desenfrenada y el caos característicos del Pandemonium de Gehenna como combustible de la revolución.\n\n“¡Una revolución aburrida es culpable! ¡Si no es divertido, no es comunismo!” En esta sociedad, el pueblo no solo comparte el pan en igualdad, sino también el derecho a disfrutar de las fiestas y liberar sus deseos en igualdad. Los enormes eventos impulsados por el Estado y un bienestar de medidas audaces convierten cada día en una atmósfera como si fuera un aniversario revolucionario.\n\nPor supuesto, la mayor característica de esta sociedad es precisamente la “libertad”. El pensamiento de Chiaki valora la creatividad y el disfrute individual por encima de una estructura rígida de clases o una movilización forzosa. Esto crea una sociedad revolucionaria y, a la vez, caótica, pero materializa un socialismo singular cuyo núcleo es la libertad desenfrenada y el caos propios del Pandemonium de Gehenna."

 chiakism_B4: "Liberalismo del orden revolucionario"
 chiakism_B4_desc: "El liberalismo del orden revolucionario es un régimen autoritario deformado que se alza sobre las ruinas de un experimento socialista radical que se estrelló contra el muro de la “realidad”. La secretaria Chiaki derrocó a los capitalistas, pero en vez de devolver plenamente esa riqueza al pueblo, eligió encerrarla dentro de la gigantesca caja fuerte llamada Estado.\n\nEn este sistema existe un “mercado”, pero no es libre. Un estricto “populismo de control estatal” domina, donde Chiaki y un pequeño grupo de élites seleccionadas aprietan y agitan todas las venas de la economía.\n\nEsto no es el ideal de la izquierda ni la libertad de la derecha. Es solo una dictadura fría que incita la ira popular con agitación anticapitalista y compra lealtad con repartos caritativos arrojados por el Estado. La revolución terminó inconclusa y, en su lugar, solo quedó una pesada cadena llamada “orden”."

 chiakism_B5: "Democracia con características de Gehenna de la Nueva Era"
 chiakism_B5_desc: "La democracia con características de Gehenna de la Nueva Era es un sistema de gobierno original propuesto por la secretaria Motomiya Chiaki, centrado en una fuerte autoridad ejecutiva y la decisión del líder. Esta ideología rechaza la política partidista agotadora y las luchas de facciones parlamentarias como “desperdicio nacional”, y toma como ideal que el líder y el pueblo se comuniquen directamente para superar la crisis del Estado.\n\nChiaki se define no como una dictadora, sino como la “editora en jefe del país” que protege la verdadera libertad frente a la desenfrenada anarquía. Ella sostiene que “la libertad más perfecta solo es posible sobre un orden fuerte” y justifica que, por eficiencia y estabilidad, el líder ejerza poderes supralegales.\n\nEn este sistema se eliminan los intermediarios, y las masas otorgan al líder una confianza absoluta mediante referendos y mecanismos de consulta directa. Aunque en lo formal sigue procedimientos democráticos, en lo sustantivo concentra todo el poder en una sola persona: es la forma más refinada y poderosa de autoritarismo practicada en nombre de la “libertad”."

 chiakism_C1: "Teoría de Motomiya"
 chiakism_C1_desc: "La Teoría de Motomiya es la ideología de gobierno propia de la secretaria Motomiya Chiaki, que sistematiza filosóficamente el éxito empírico temprano del “sensacionalismo de bienestar”. Ella reinterpretó de manera original la teoría de la hegemonía de Antonio Gramsci y concluyó que la toma del control de la superestructura—la cultura y la percepción—es la verdadera llave de la reforma estatal.\n\nEl núcleo de esta teoría es el uso estratégico de una realidad escenificada. Chiaki considera que el apoyo popular no necesita surgir necesariamente de una verdad objetiva. Aunque sean “ilusiones fabricadas”, si festivales deslumbrantes, un bienestar audaz y una imagen del líder finamente procesada por los medios logran entusiasmar a las masas y crear índices de apoyo abrumadores, entonces eso se convierte en poder real.\n\nPor lo tanto, el populismo no es un fin, sino un medio. La Teoría de Motomiya proporciona a las masas la ilusión que anhelan para dominar por completo la hegemonía cultural, y usa ese apoyo absoluto como “combustible político” para aplastar la resistencia de los intereses establecidos e imponer desde arriba las reformas radicales concebidas por el líder. Es la culminación de una “edición nacional” que va más allá de la simple demagogia: manipula la percepción y reconstruye incluso la base material."

 chiakism_C2: "Teoría de Motomiya"
 chiakism_C2_desc: "La Teoría de Motomiya es la ideología de gobierno propia de la secretaria Motomiya Chiaki, que sistematiza filosóficamente el éxito empírico temprano del “sensacionalismo de bienestar”. Ella reinterpretó de manera original la teoría de la hegemonía de Antonio Gramsci y concluyó que la toma del control de la superestructura—la cultura y la percepción—es la verdadera llave de la reforma estatal.\n\nSin embargo, Chiaki da un paso más allá y sostiene que una hegemonía permanente solo puede completarse no sobre ilusiones escenificadas, sino sobre “reformas que se sienten en la piel”. Esta teoría ocupa una “tercera posición” pragmática que rechaza tanto la crueldad del capitalismo como la rigidez del comunismo. Ella rompe la burocracia ineficiente y los conflictos de clase agotadores y, mediante un fuerte liderazgo central, une a obreros y capitalistas, gehenna y alemanes, en una comunidad orgánica del Estado.\n\nPor ello, en la Teoría de Motomiya el populismo no es una simple búsqueda de popularidad. Es la fuerza motriz de la reforma: el líder recoge directamente las demandas del pueblo, las implementa de inmediato como políticas, y con los resultados abrumadores de esa realidad neutraliza a los intereses establecidos. Es una teoría de reforma nacional, realista y dinámica, que abre la nueva era de Gehenna mediante una prosperidad sustantiva, no una ilusión."

 chiakism_C3: "Capitalismo de Estado"
 chiakism_C3_desc: "El capitalismo de Estado es un sistema de gobierno singular en el que el poder político y el gran capital financiero se fusionan por completo bajo el eslogan: “El Estado para las empresas, y las empresas para el Estado”. La secretaria Chiaki define la incertidumbre del libre mercado como “ruido ineficiente” y eligió el camino de que el Estado participe directamente en los consejos directivos de las megacorporaciones para “editar” centralmente la economía.\n\nEste sistema comenzó persiguiendo una eficiencia de derechas a rajatabla, pero, de manera paradójica, su estructura final se asemeja a una oligarquía financiera de estilo soviético donde desaparece la frontera entre Estado y capital. En este modelo, teorizado a partir del “poder de élites” observado en sociedades capitalistas occidentales como Estados Unidos, la puerta giratoria entre burócratas y ejecutivos no existe: porque desde el principio, ambos son lo mismo.\n\nAhora el Estado se ha convertido en una gigantesca sociedad anónima, el pueblo en accionistas, y Chiaki, como CEO permanente de este complejo colosal, dirige el flujo del capital. Aquí la política es reemplazada por el “consejo de administración”. Bajo el objetivo de una eficiencia aplastante y la creación de beneficios, el capital y el poder se vuelven uno y hacen funcionar sin fisuras la máquina llamada Estado."

 chiakism_AA1: "Liberalismo Gehenna-alemán"
 chiakism_AA1_desc: "El liberalismo Gehenna-alemán es una ideología chiaki de “pluralismo defensivo” nacida de la dolorosa reflexión de que la indulgencia impotente de la República de Weimar engendró al monstruo llamado nazismo. Esta idea redefine la libertad no como un derecho innato de dejar hacer, sino como un “derecho responsable” permitido solo dentro de los límites que no socaven la integración social ni la estabilidad del Estado.\n\nLa presidenta Motomiya Chiaki eliminó para siempre, en nombre de la Constitución, la “libertad de destruir” que disfrutaban el nazismo, que pisotea la dignidad ajena, y el extremismo que amenaza el sistema. En cambio, dentro del cerco de “integración” establecido por el Estado, todos los miembros, sin importar sangre o mundo de origen, reciben una libertad igual y plena como “nuevos ciudadanos alemanes”.\n\nPor lo tanto, este régimen no es un laissez-faire ciego. Es la forma más fuerte y realista de liberalismo controlado: al negar libertad a los enemigos de la libertad, protege, de manera paradójica, la verdadera convivencia y libertad de una sociedad multiétnica."

 chiakism_AA2: "Dictadura social"
 chiakism_AA2_desc: "La dictadura social es un sistema singular de predominio de un solo partido, establecido sobre el desesperado sentido de crisis de que “la división es la aniquilación”. Para impedir la catástrofe étnica que traería una lucha política ilimitada, la presidenta Chiaki disolvió a todas las grandes fuerzas de izquierda de Alemania y Gehenna dentro de una enorme coalición llamada “gran gobierno de unidad”, tan masiva como inestable.\n\nEste sistema se asemeja a un partido único en que mantiene procedimientos democráticos formales pero excluye estructuralmente la posibilidad real de alternancia. Sin embargo, no es el resultado de la coerción: ambos pueblos eligieron voluntariamente, en lugar de una guerra civil sangrienta, la estabilidad, el bienestar y la paz permanente que ofrece esta “dictadura consensuada” diseñada por Chiaki.\n\nPor ello, en esta sociedad no puede existir una oposición con sentido pleno. El Estado es gestionado con eficiencia por un único gran partido gobernante, y todo conflicto político se resuelve no mediante lucha, sino por una “edición” interna, silenciosa y minuciosa. Es el fruto de un enorme compromiso: el más estable y pacífico, pero que castró el dinamismo político para sobrevivir."

 chiakism_AA3: "Gran alianza popular inclusiva"
 chiakism_AA3_desc: "La gran alianza popular inclusiva es un sistema de carpa amplia, centrista, escrito sobre una nueva página llamada “Deutschland”, tras romper con el pasado autoritario del “Deutsches Reich”. La presidenta Chiaki combinó la visión constitucional defensiva del “liberalismo Gehenna-alemán” con la estabilidad de la “dictadura social” para crear un gigantesco agujero negro político que abarca izquierda y derecha.\n\nBajo este régimen, confusiones nacionales como el nazismo o el comunismo radical quedan estrictamente excluidas en nombre de la Constitución. En cambio, todas las fuerzas que respetan la Constitución—desde el conservadurismo moderado hasta la socialdemocracia—son absorbidas dentro de un único gran partido llamado “alianza popular”. No hay alternancia, pero la voluntad popular se incorpora mediante un proceso interno de ajuste de facciones intenso y dinámico.\n\nEn otras palabras, la política se traslada de la lucha callejera al debate en la sala de reuniones partidaria. Las masas se sienten satisfechas con la estabilidad del “partido gobernante eterno” que Chiaki dirige, y Chiaki, como administradora permanente de esta enorme carpa, edita y coordina internamente todos los conflictos del Estado. Es la culminación de una democracia perfectamente controlada: la más libre y, paradójicamente, la que menos cambia."

 traditionalism_with_trinity_characteristics:0 "Tradicionalismo con características de Trinity"
 traditionalism_with_trinity_characteristics_desc:0 "El tradicionalismo con características de Trinity es una ideología que, mientras protege la noble tradición oligárquica aristocrática, persigue cambios graduales dentro del sistema. Establecido por Kirifuji Nagisa y promovido por Filius, el tradicionalismo de Trinity nació como reacción al militarismo defendido por la facción Pater. Filius, basándose en su desprecio por el populismo, valora un pensamiento ilustrado centrado en una minoría de intelectuales y clases altas que “guían” a las masas; la preservación de los valores trinitarios—la fe y la nobleza—; y el rol matriarcal del Host, que conduce con amor benevolente a los niños extraviados de Trinity.\n\nSin embargo, pese a su rechazo a los cambios radicales, su carácter religioso y su sistema oligárquico aristocrático, el tradicionalismo de Trinity se distingue en gran medida del tradicionalismo católico de la humanidad local. La razón es que, desde el principio, los valores “conservadores” que Trinity busca proteger son, en sí mismos, valores “progresistas” de un siglo en el futuro, fuera del marco de comprensión de los humanos locales."
 traditionalism_with_trinity_characteristics_neutrality:0 "Tradicionalismo con características de Trinity"
 traditionalism_with_trinity_characteristics_neutrality_desc:0 "El tradicionalismo con características de Trinity es una ideología que, mientras protege la noble tradición oligárquica aristocrática, persigue cambios graduales dentro del sistema. Establecido por Kirifuji Nagisa y promovido por Filius, el tradicionalismo de Trinity nació como reacción al militarismo defendido por la facción Pater. Filius, basándose en su desprecio por el populismo, valora un pensamiento ilustrado centrado en una minoría de intelectuales y clases altas que “guían” a las masas; la preservación de los valores trinitarios—la fe y la nobleza—; y el rol matriarcal del Host, que conduce con amor benevolente a los niños extraviados de Trinity.\n\nSin embargo, pese a su rechazo a los cambios radicales, su carácter religioso y su sistema oligárquico aristocrático, el tradicionalismo de Trinity se distingue en gran medida del tradicionalismo católico de la humanidad local. La razón es que, desde el principio, los valores “conservadores” que Trinity busca proteger son, en sí mismos, valores “progresistas” de un siglo en el futuro, fuera del marco de comprensión de los humanos locales."

 arius_nihilism: "Nihilismo de Arius"
 arius_nihilism_desc: "El nihilismo de Arius es la forma más aislada y militarizada de nihilismo ciego en Kivotos: toma como principio de gobierno una interpretación extrema y pesimista del pasaje “Vanidad de vanidades, y todo es vanidad (Vanitas vanitatum, et omnia vanitas)”.\n\nEn los inicios de la Alianza Trinity, la escuela filial de Arius, que se ocultó en catacumbas subterráneas para huir de la persecución, se transformó—aislada del exterior—en una sociedad cuartelaria deformada que existe solo para la “venganza”. Bajo esta ideología, la “educación” deja de ser autorrealización del alumnado y es sustituida por el entrenamiento de técnicas de asesinato destinadas a exterminar emociones y destruir a otros con eficiencia. Toda paz, amistad y esperanza del mundo se define como “hipocresía falsa”, y las estudiantes son adoctrinadas para creer que solo el odio y el sufrimiento son la única verdad del mundo.\n\nEn lo político, este régimen se sostiene mediante la continuidad de la ideología de lavado de cerebro total implantada en el pasado por Beatrice. Sus miembros no se unen para superar el vacío, sino que se suman a un contradictorio “culto a la muerte” que destruye la vida de otros para demostrar que la propia vida carece de valor.\n\nAl final, el nihilismo de Arius se presenta con el pretexto de destruir la “falsa paz” de Trinity, pero en realidad significa la distopía más triste y destructiva de la historia de Kivotos: consumirse a sí mismos como consumibles, atrapados en rencores añejos."

 academy_state_system_democratic: "Sistema academia-Estado"
 academy_state_system_democratic_desc: "El sistema academia-Estado, establecido tras la Gran Transferencia, es un régimen que aparece cuando el sistema académico de Kivotos previo a la Gran Transferencia pasa a encargarse posteriormente de amplias tareas administrativas generales, incluidas las zonas autónomas. El presidente del consejo estudiantil asume simultáneamente el cargo de jefe de Estado, y el consejo estudiantil cumple el rol de parlamento; el poder ejecutivo y el legislativo no se distinguen con claridad."
 academy_state_system_neutrality: "Sistema academia-Estado"
 academy_state_system_neutrality_desc: "El sistema academia-Estado, establecido tras la Gran Transferencia, es un régimen que aparece cuando el sistema académico de Kivotos previo a la Gran Transferencia pasa a encargarse posteriormente de amplias tareas administrativas generales, incluidas las zonas autónomas. El presidente del consejo estudiantil asume simultáneamente el cargo de jefe de Estado, y el consejo estudiantil cumple el rol de parlamento; el poder ejecutivo y el legislativo no se distinguen con claridad."
 rikuhachima_socialism:0 "$hardboiled_noir$"
 rikuhachima_socialism_desc:0 "$hardboiled_noir_desc$"

 KR_social_liberal: "$Social_Liberalism$"
 KR_social_liberal_desc: "El social-liberalismo es un régimen arraigado en la tradición del liberalismo progresista que impulsa la reconstrucción del contrato social conforme a las exigencias de una época cambiante. Su propósito último es consolidar, proteger y ampliar la libertad real de la ciudadanía mediante reformas estructurales en el conjunto político y económico."
 
 theocracy_neutrality: "Teocracia"
 theocracy_neutrality_desc: "La teocracia, o gobierno teocrático, es un Estado en el que el representante de Dios gobierna el país. Incluso en los Estados teocráticos puede elegirse al dirigente del país mediante votación, como ocurre con el Papa, pero se diferencian de los líderes electos de las repúblicas democráticas, que siguen la soberanía popular, en que el dirigente de un Estado teocrático es un representante religioso a quien Dios delega el poder."

 IRE_ideology_fianna_fail: "Fianna Fáil"
 IRE_ideology_fianna_fail_desc: "Fianna Fáil considera que la independencia no es un asunto de “declararla”, sino de “completarla”, y busca eliminar tanto la influencia externa como las divisiones internas que bloquean la soberanía nacional. Justifican romper crisis mediante un gobierno fuerte y la movilización de masas, y priorizan la unidad de la comunidad nacional por encima de la lucha de clases. Si es necesario, tienden a reestructurar con audacia las leyes y las instituciones para fijar el rumbo del Estado."
 IRE_ideology_fine_gael: "Fine Gael"
 IRE_ideology_fine_gael_desc: "Fine Gael encuentra la legitimidad del Estado no en el fervor revolucionario, sino en las instituciones, el Estado de derecho y la estabilidad fiscal, y desconfía de cambios bruscos. Priorizan el orden y la confianza para contener los conflictos sociales a niveles manejables, y sostienen que la economía debe recuperarse mediante reformas graduales y una política fiscal responsable. Es un realismo fuerte que cree que la supervivencia del Estado depende más de la “continuidad” que de la “audacia”."

 KR_social_democrat: "$scandinavian_social_democracy$"
 KR_social_democrat_desc: "La socialdemocracia se refiere a diversos gobiernos dirigidos por corrientes de izquierda reformistas. Sostienen que la lucha de clases violenta no es necesaria para alcanzar sus objetivos, y a veces entran en conflicto por ello con camaradas más radicales. La mayoría busca el cambio mediante el voto, pero si la situación llega a extremos, no es que no existan precedentes de que también persigan la revolución."

 KR_social_conservative: "Conservadurismo social"
 KR_social_conservative_desc: "El conservadurismo social abarca numerosos gobiernos democráticos que, ante circunstancias cambiantes, buscan mantener, proteger y reforzar los valores tradicionales del pueblo. Los conservadores sociales no son reaccionarios rígidos; por lo general apoyan el Estado de derecho y la democracia, y dentro del sistema político actual están dispuestos a impulsar cambios graduales y previsibles si consideran que se ajustan a su visión."
 KR_social_conservative_neutrality: "$KR_social_conservative$"
 KR_social_conservative_neutrality_desc: "$KR_social_conservative_desc$"
