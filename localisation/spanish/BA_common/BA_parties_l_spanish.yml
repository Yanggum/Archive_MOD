 MIL_fascism_party_long:0 "Cleaning & Clearing\n§gCleaning & Clearing, el departamento de mantenimiento y unidad de operaciones especiales de Millennium Science School, desempeñó un gran papel en la Guerra Millennium-Francia tras la Gran Transferencia. Su rasgo distintivo es que se camuflan como un club de sirvientas, y todas sus integrantes combaten vistiendo uniforme de maid. Aunque su misión es la de una unidad de operaciones especiales que ejecuta operaciones encubiertas, su verdadera naturaleza es un secreto a voces que, en la práctica, todo el mundo conoce; aun así, se han convertido en un modelo a seguir para muchísima gente.§!\n"
