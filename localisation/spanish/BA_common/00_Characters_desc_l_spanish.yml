 GER_dietrich_bonhoeffer_desc: "§YNacimiento:§! §L4 de febrero de 1906, Breslavia, Imperio alemán§!\n§YTrayectoria:§! §LDietrich Bonhoeffer nació en 1906 en Breslavia, en el Imperio alemán, y creció en una familia con una fuerte tradición luterana. Su abuelo fue capellán de la corte, y su madre fue una persona cultivada, capaz de enseñar a sus hijos la Biblia, poesía y canciones. Sin embargo, su padre era indiferente a la fe y sus hermanos también eran cínicos respecto a la religión. Cuando Bonhoeffer anunció que quería ser teólogo, su familia se opuso, pero él respondió: “Entonces yo los cambiaré”, sin ceder en su decisión. Al final, la familia respetó su determinación.\n\nTras estudiar teología en Tubinga y Berlín, fue reconocido en el ámbito académico con una tesis sobre la “comunión de los santos”, y gracias a una estancia de estudios en Roma amplió su mirada crítica sobre la liturgia y la doctrina católicas. Al ver el ascenso del nazismo, Bonhoeffer fue de los más críticos: en 1933, incluso sostuvo en una charla radial que el poder de un líder debía ser limitado. Después, moviéndose entre Londres y Alemania, condenó la represión nazi sobre la Iglesia y encabezó esfuerzos para llamar a la resistencia eclesiástica.\n\nPero en 1935, con el estallido del Gran Traslado, el panorama político de Alemania cambió de manera abrupta. Cuando Misono Mika tomó el poder, muchos se tranquilizaron por su aparente germanofilia, pero pronto se reveló como una ilusión, y bajo el nombre de “lucha eclesiástica” comenzó una represión religiosa a escala nacional.\n\nBonhoeffer ya sabía qué debía hacer. También sabía que su camino llevaría a un desenlace trágico… pero su decisión no tembló.§!"
