 # 트리니티 종합학원
 TRN_Airi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LUna alegre integrante del Club de Postres Después de Clases de Trinity. De personalidad relajada y tranquila, valora por encima de todo el tiempo de comer postres y charlar con sus amigas. Su postre favorito es el helado dulce, y últimamente está totalmente enganchada al sabor menta con chocolate.§!"
 TRN_Yoshimi_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LDe baja estatura y adorable, con ojos brillantes y… un toque de rudeza. Entre sus amigas a menudo la llaman “un animalito pequeño”. Aunque su altura es un complejo, desea más que nadie verse como una adulta. Por eso, en la escuela y frente a sus amigas siempre se endereza, tratando de parecer un poco más serena y madura. Pero esa determinación solemne no dura mucho: sus expresiones la delatan enseguida.\n\nHay, sin embargo, un momento en el que realmente brilla: cuando recorre sus cafés de postres favoritos y prueba los postres de temporada. Normalmente mantiene los labios apretados para verse adulta, pero frente a un postre toda preocupación desaparece y, sin darse cuenta, florece una sonrisa radiante. Esa expresión —como un animalito emocionado que encuentra su comida favorita— es tan adorable que llega a hacer felices incluso a quienes la rodean.§!"
 TRN_Natsu_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LIntegrante del Club de Postres Después de Clases de Trinity; cabecilla de las travesuras y autoproclamada “romántica”. Tiene la costumbre de soltar frases raramente filosóficas o de comparar todo con postres. Siempre mete a las demás en apuros con ideas disparatadas, pero es porque, en el fondo, solo quiere compartir su “romance” con todos. Como su definición de “romance” cambia cada vez, desde fuera es difícil negar la impresión de que todas terminan “a merced de Natsu”.§!"
 TRN_Kazusa_advisor_desc: "$FROM_Trinity_Academy$$FROM_After_School_Sweets_Club$\n\n§LMiembro del Club de Postres Después de Clases, de carácter calmado y silencioso. No suele destacarse y, por lo general, sigue en silencio las acciones de las demás. Aunque siempre acaba arrastrada por las rarezas del grupo y se cansa de ello, por otro lado también considera valioso incluso eso.§!"
 TRN_Mika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LUno de los miembros de Tea Party y amiga de la infancia de Nagisa, otra de las líderes. Sin embargo, como están en bandos políticamente opuestos, mantiene una clara separación entre lo personal y lo público. Siempre sonríe como si todo fuera divertido y muestra un carácter vivaz y alegre, pero tras esa fachada carga con preocupaciones que no puede contar a cualquiera… una chica cuyo interior es difícil de leer.§!"
 TRN_Nagisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LUno de los miembros de Tea Party. Habla con una voz suave y amable, pero como no revela fácilmente lo que piensa, a la gente le cuesta acercarse y se siente intimidada. Su afición es preparar las hojas de té y los aperitivos para Tea Party; muchas estudiantes de Trinity anhelan participar en una reunión de té junto a ella.§!"
 TRN_Seia_advisor_desc: "$FROM_Trinity_Academy$$FROM_Tea_Party$\n\n§LA ojos de los demás, es alguien erudita e impredecible, con un aire de noble caprichosa. Tras el incidente, a veces se la ve más obstinada y seria que antes.§!"
 TRN_Sakurako_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LUna devota hermana estudiante de la Hermandad de Trinity. Es seria en todo y goza de una profunda confianza por parte de muchos. Cumple sus deberes con un corazón piadoso, pero por su rigidez a veces se queda atrás respecto a modas o sentido común.§!"
 TRN_Wakaba_Hinata_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LUna chica diligente y bondadosa de la Hermandad. Como responsable de la administración de la Catedral de Trinity, lleva una gran carga y cumple su trabajo con esmero, siendo amable con todos. Sin embargo, por su torpeza comete errores a menudo y le falta confianza. Aunque siempre carga una enorme ametralladora lanzagranadas fija en su bolso, nunca ha mostrado que le pese.§!"
 TRN_Mari_advisor_desc: "$FROM_Trinity_Academy$$FROM_Sisterhood$\n\n§LUna chica devota y compasiva de la Hermandad. Siempre recibe a las estudiantes de Trinity con una sonrisa suave y amable. Tiene una apariencia adorable, pero su ambiente calmado y reconfortante hace que muchas vayan a consultarle. Como siempre siente que le falta mucho, sueña con convertirse en una gran hermana como sus senpais.§!"
 TRN_Kozeki_Ui_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§LLa jefa del Comité de Biblioteca de Trinity. Ama los libros al punto de decir que le gustan más que las personas; en especial, los libros antiguos que guardan el paso del tiempo. En su vida diaria se encierra en el archivo de libros raros —al que casi nadie va— para leer o cuidar los volúmenes antiguos.§!"
 TRN_Shimiko_advisor_desc: "$FROM_Trinity_Academy$$FROM_Library_Committee$\n\n§LUna bibliotecaria del Comité de Biblioteca de Trinity. Es una ratona de biblioteca auténtica y una de las pocas estudiantes que ha leído toda la vasta colección de la biblioteca de Trinity. Le gusta tanto leer como recomendar libros; cuando conoce a alguien, intenta sugerirle lecturas que encajen con sus gustos.§!"
 TRN_tsurugi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LLa jefa del Club de Realización de la Justicia y el “arma estratégica oficial” de Trinity. De carácter belicoso y violento: si algo no le gusta, primero lo rompe y luego pregunta. Gracias a la capacidad de Hasumi, la subjefa, el club se sostiene como puede. Aunque Tsurugi es como un perro rabioso imposible de controlar, frente a cierta persona muestra un lado más de “chica” que no sabe ocultar su vergüenza.§!"
 TRN_Hasumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LLa número dos del Club de Realización de la Justicia. Además de sustituir a la caótica Tsurugi, también cumple el rol de comandante táctica del club. Por eso puede parecer una estudiante de Trinity tranquila e inteligente… pero sigue siendo parte del club. Nadie como ella para mantener la calma… y aun así cometer actos temerarios.§!"
 TRN_Ichika_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LUna miembro del Club de Realización de la Justicia con una expresión siempre relajada. Incluso dentro de un club con estudiantes tan variadas, suele encargarse de la flexibilidad y la coordinación. También tiene buenas relaciones con otras academias. Es conocida por su expresión suave y amabilidad, pero no es algo natural: es parte de su esfuerzo.§!"
 TRN_Mashiro_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LUna miembro diligente del Club de Realización de la Justicia. Lleva un enorme rifle de francotirador antimaterial que no va con su estatura, y cumple en silencio misiones de apoyo de fuego. Habla poco, pero no es tímida ni torpe socialmente; de hecho, si se menciona el tema de “la justicia”, tiende a hablar más de lo normal.§!"
 TRN_Koharu_advisor_desc: "$FROM_Trinity_Academy$$FROM_Justice_Task_Foce$\n\n§LMiembro del Club de Realización de la Justicia. Aunque ella misma se considera una élite, en realidad es tan tonta que ni siquiera puede seguir las clases. Tiene el hobby de coleccionar revistas subidas de tono; basta cualquier cosa para que su imaginación “picante” se dispare y termine avergonzándose.§!"
 TRN_Ajitani_Hifumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§LAunque no destaca ni en apariencia ni en notas, es muy popular por su carácter amable y sin aristas. Escucha bien los problemas e historias de quienes la rodean, pero precisamente por eso a veces se deja arrastrar por el ambiente y termina causando líos sin querer.§!"
 TRN_Hanako_advisor_desc: "$FROM_Trinity_Academy$$FROM_NONE$\n\n§LUna señorita dulce y considerada. A simple vista parece realmente recatada y elegante, pero cuando abre la boca suelta toda clase de comentarios eróticos: una problemática de primer nivel. Las estudiantes que conocen su verdadera cara se tensan y miran alrededor cada vez que Hanako empieza a hablar.§!"
 TRN_Mine_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LUna guerrera de blanco, recta y de voluntad firme, aunque también con un lado feroz. La “fama” (¿?) de “Mine rompe y la Orden Hospitalaria cura” ya es bien conocida en toda Trinity. Cuando tiene un respiro, revisa su equipo o prepara té y bocadillos para invitar a conocidos y calmar el corazón. Se dice que su conocimiento del té negro no se queda atrás ni comparado con Hasumi del Club de Realización de la Justicia.§!"
 TRN_Serina_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LUna chica amable de la Orden Hospitalaria de Trinity. De corazón bondadoso y amante del voluntariado; se preocupa por la salud hasta un punto excesivo, por lo que a menudo la describen como “una mamá”. Aunque es sensible y detesta las peleas y disputas, frente a enemigos que amenacen la paz siempre está lista para enfrentarles con firmeza.§!"
 TRN_Hanae_advisor_desc: "$FROM_Trinity_Academy$$FROM_Knights_Hospitaller$\n\n§LUna nueva integrante alegre y vivaz de la Orden Hospitalaria. Es positiva y llena de energía, pero en cuanto ve a un paciente arma demasiado alboroto y termina empeorando la situación. Es una chica rara en muchos sentidos, pero se dice que los pacientes que reciben su ánimo se recuperan misteriosamente de cualquier enfermedad en poco tiempo.§!"
 TRN_Suzumi_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$\n\n§LIntegrante de la patrulla de vigilantes que protege la seguridad de las estudiantes de Trinity. A medida que aumentaron los ataques de otras academias, ella se ofreció voluntariamente para patrullar las calles y evitarlo. A menudo la malinterpretan como fría y severa por su ardiente sentido de justicia, pero en realidad también tiene un lado amable.§!"
 TRN_Reisa_advisor_desc: "$FROM_Trinity_Academy$$FROM_Trinity_Vigilante_Crew$§LUna vigilante que aparece de repente por distintos rincones de Trinity. Por su ambiente ruidoso y escandaloso a veces la confunden con una bromista, pero en realidad se toma el trabajo de vigilante más en serio que nadie. Siempre se presenta, pero cada vez su frase de presentación cambia un poquito.§!"

 TRK_yurijono_seia_desc: "$FROM_Trinity_Academy$§LAfiliada a la facción Sanctus\n\nA ojos de los demás, es alguien erudita e impredecible, con un aire de noble caprichosa. Desde que recuperó su salud, a veces también muestra un lado algo más obstinado y travieso, como una niña.§!"
 TRK_kirifuji_Nagisa_desc: "$FROM_Trinity_Academy$§LAfiliada a la facción Filius§!\n\n§LHabla con una voz suave y amable, pero como no revela fácilmente lo que piensa, a la gente le cuesta acercarse y se siente intimidada. Su afición es preparar las hojas de té y los aperitivos para Tea Party; muchas estudiantes de Trinity anhelan participar en una reunión de té junto a ella.§!"

 TRN_Ninomae_Mirai_joke_leader_desc: "$FROM_Trinity_Academy$§LAfiliada a la facción Pater§!\n\n§LEn el instante en que surge el nombre Ninomae Mirai, llega primero la sensación de que no hace falta detenerse a decidir a quién señala —o a quién no— ese nombre; y, en realidad, ni siquiera importa demasiado que esa sensación haya surgido, pero, en fin: aquí solo hay un nombre colocado, y decirlo de antemano curiosamente tranquiliza. La Ninomae Mirai que aparece en este texto es un personaje de una novela de fanfiction: solo se “prestó” el nombre, así que objeciones del tipo “eso no es así” ni siquiera aplican, y aun así, de verdad, de verdad, quiero subrayarlo.\n\nNinomae Mirai parece estar haciendo algo, pero en realidad no hace nada; y parece no hacer nada, pero ni siquiera eso es seguro. Está de pie en algún lugar, eso sí, pero en cuanto uno intenta explicar dónde, la frase se alarga sin razón, y las frases largas llaman a otras frases, y la historia del lugar se escabulle por alguna rendija. Así, el relato se va por la tangente una y otra vez, y en el camino quedan palabras inútilmente brillantes que, al pisarlas, dejan solo una sensación de ruido sin sentido.\n\nSu nombre contiene “futuro”, pero eso no significa que vayamos a hablar del futuro. Tampoco del pasado. Del presente, menos. Y aun así, las frases siguen fingiendo que están diciendo algo; y por ese fingimiento, quien lee avanza con un “por si acaso” hacia la siguiente línea, solo para que la siguiente línea haga lo mismo, hasta olvidar incluso qué era “dirección”.\n\nAl final, este texto parece tratar sobre Ninomae Mirai, pero en realidad solo da vueltas alrededor del nombre, derrama adornos, evita el tema y reemplaza el contenido con cantidad de palabras. Y, otra vez: es fanfiction y solo se prestó el nombre; si intentas buscar significado o discutir configuración, en ese mismo instante ya te habrás alejado del flujo de este texto. Lo único que queda es que estas frases están divagando… y ni siquiera hace falta aferrarse a eso: no pasará nada.§!"

 #아비도스 고등학교
 ABY_Hoshino_advisor_desc: "$FROM_Abydos_Academy$\n\nComo única estudiante de 3.º año de la Preparatoria Abydos y pilar emocional del Comité de Contramedidas, Takanashi Hoshino, a primera vista, parece solo una adorable holgazana a la que le encanta dormir. Al verla actuar con tanta calma, se siente más como una “kouhai” tierna que como una “senpai” imponente.\n\nPero cuando Abydos —una escuela que no encaja con ella— o sus kouhai se ven en peligro, su lado dulce y apacible desaparece, y muestra una firmeza y rectitud tan fuertes que te harían preguntarte: “¿A dónde se fue la Hoshino linda y suave de hace un momento?”. Puede dejarse arrastrar un poco por sus emociones, pero su poder de combate es tan sobresaliente que esa temeridad queda eclipsada: rompe todo lo que le bloquea el paso y sigue avanzando.\n\nAun así, hay veces en que también muestra un lado torpe y extraño. Aunque sus kouhai le pregunten al respecto, ella evita responder. ¿Cuál será esa historia que guarda en el corazón y que no puede contar?"
 ABY_Shiroko_advisor_desc: "$FROM_Abydos_Academy$\n\nAl conocer por primera vez a Sunaookami Shiroko, estudiante de 2.º año del Comité de Contramedidas, puede que te enamores de su primera impresión. Su aspecto bello y adorable, junto con una voz calmada y suave que casi susurra, podría hacerte caer… pero pronto traicionará tus expectativas.\n\nEs activa, con una resistencia que nadie puede alcanzar; y las ideas absurdas que suelta —tan alejadas del sentido común como si hubiera miles de millones de años de distancia— suelen dejar perplejas incluso a sus compañeras del Comité. Sin embargo, esa faceta termina funcionando como el medio que hace que se le tome aún más cariño.\n\nAunque es de 2.º año, su empuje imparable recuerda a una estudiante de 1.º recién brotada; pero su destreza en combate se siente como la de una veterana de 3.º que ya se ha curtido mil veces. Por eso, para Hoshino y Nonomi es una kouhai adorable; mientras que para Serika y Ayane es una senpai fuerte y digna de respeto."
 ABY_Nonomi_advisor_desc: "$FROM_Abydos_Academy$\n\nIzayoi Nonomi, estudiante de 2.º año de la Preparatoria Abydos, es quien muestra el aire más “de senpai”. Su actitud y palabras siempre positivas y luminosas a veces sacuden al Comité de Contramedidas, pero también mantienen el ambiente siempre alegre.\n\nAdemás, cuida a todas, recoge opiniones y evita peleas: tiene un lado muy maternal. Como “jefa de snacks” del comité, siempre cumple el rol de levantar la moral.\n\nPor otro lado, a veces saca una cosa llamada “tarjeta dorada”. Dicen que es una tarjeta sin límite con la que puedes comprar cualquier cosa… entonces, ¿por qué no la ha usado para pagar las deudas de Abydos? A veces surge la duda, pero el comité no profundiza en ello. Quizá Hoshino sí lo sepa."
 ABY_Serika_advisor_desc: "$FROM_Abydos_Academy$\n\nLa menor de Abydos y una adorable despistada: Kuromi Serika se deja engañar con frecuencia. No es raro que, por su facilidad para caer en trampas, pierda el dinero que tanto juntó.\n\nPero, al mismo tiempo, ella es probablemente la más trabajadora, y es quien más contribuye a pagar las deudas de la Preparatoria Abydos. Serika quiere a Abydos con un cariño especial. Sus senpais, por consideración, le dijeron que el dinero que cada una gana en trabajos de medio tiempo no se use para la deuda y que solo se destine lo que ganan cuando trabajan juntas… pero Serika, en secreto, usa su sueldo para pagar la deuda de la escuela.\n\nA veces se pone dura y habla brusco ante las ocurrencias absurdas de sus senpais —sobre todo Shiroko—, pero en el fondo es una chica que ama al Comité de Contramedidas más que nadie."
 ABY_Ayane_advisor_desc: "$FROM_Abydos_Academy$\n\nOkusora Ayane, secretaria del Comité de Contramedidas, es la más joven, pero entre senpais de personalidad tan fuerte es quien más muestra una actitud adulta. Dicho de otra forma, alguien podría pensar que “no tiene gracia” o “carece de rasgos”, pero entre senpais tan extravagantes, su “normalidad” brilla como una personalidad propia.\n\nA menudo la arrastran, o tiene que frenar ideas disparatadas: cumple con fidelidad el rol de ser la “voz de la cordura” del Comité.\n\nA estas alturas podrías creer que Ayane no tiene nada más que ser “normal”, pero no es así. Solo que queda opacada. Ayane es muy inteligente: controla todos los ingresos y egresos del comité; tiene la habilidad de generar más ganancias que otras con los mismos recursos; y administra todas las instalaciones de Abydos. Eso no es algo que cualquiera pueda imitar.\n\nY aunque también pasa desapercibido frente a las capacidades abrumadoras de sus senpais, su resistencia física está entre las mejores. En resumen: una chica completa, de pies a cabeza."

 # 붉은겨울 연방학원
 RED_trotsky_desc: "$FROM_RedWinter_Academy$§LLev Trotski fue un político, revolucionario y teórico marxista del ala bolchevique, activo en el Imperio ruso y la Unión Soviética; además, fue quien estableció ideológicamente el trotskismo. En su trayectoria, fue una figura central de la Revolución de Octubre y, como fundador y líder del Ejército Rojo, realizó enormes aportes a la construcción del Estado soviético. Se le llegó a considerar posible sucesor de Vladímir Lenin, pero perdió la lucha de poder contra Iósif Stalin, fue expulsado del Partido Comunista y desterrado del país que ayudó a fundar. Tras el exilio, se mudó de un lugar a otro criticando el sistema estalinista.§!\n\n§YBiografía§! : §LNació en Yanovka, una pequeña aldea del uyezd de Elisavetgrado, gobernación de Jersón, en el Imperio ruso. Su padre, David Leóntievich Bronstein, era un ucraniano de origen judío de Poltava, y en su familia se hablaba surzhyk, una mezcla/pidgin de ucraniano y ruso. Su padre era un campesino acomodado. Cuando Trotski cumplió 9 años, lo enviaron a Odesa para estudiar en una escuela luterana alemana. Como Odesa era una ciudad internacional donde convivían numerosas etnias, Trotski despertó al internacionalismo; un contraste notable con Stalin, georgiano que enfatizó con firmeza el nacionalismo ruso. Trotski tuvo un rendimiento académico excelente —se graduó con honores— y dominaba alemán, además de hablar con fluidez inglés y francés. En su autobiografía decía que sus habilidades lingüísticas eran “promedio”, y que especialmente no hablaba inglés con libertad; sin embargo, en sus discursos en inglés se nota que, aunque la pronunciación es torpe, la construcción de frases no parece presentar grandes problemas.\n\nEn aquella época, el Imperio ruso vivía bajo el absolutismo del zar, y las fuerzas revolucionarias de diversos trasfondos ideológicos crecían como hongos: cualquiera con un mínimo de “despertar” terminaba impregnado de ideas revolucionarias. Trotski, que estudiaba matemáticas, al principio fue populista (narodnik), buscando una revolución socialista desde la tradición rusa, pero después recibió influencia del marxismo. Su cambio ideológico —de conservador a populista y luego a marxista— fue sorprendentemente rápido.\n\nSiendo todavía estudiante se lanzó al movimiento revolucionario y desempeñó un papel central organizando a los obreros de Nikoláyev, en el sur de Ucrania. Desde entonces destacó su capacidad de organización. Además, su oratoria era excepcional: cuando tras la Revolución de Febrero las tropas golpistas del general contrarrevolucionario Lavr Kornílov entraron en la capital, Trotski se plantó para detenerlos y les dio un discurso; solo con escuchar su intervención, las tropas se disolvieron por voluntad propia, y el golpe fracasó. También era un excelente escritor, al punto de que Lenin comentó después: “Sus textos son magníficos, pero su estilo es demasiado florido”. El historiador británico Robert Service, famoso estudioso de la URSS, llegó a decir que, incluso si Trotski no hubiera sido revolucionario, habría dejado su nombre en la historia como escritor o crítico.§!" # ¿Y este por qué está colado en Trinity?

