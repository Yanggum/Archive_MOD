 l_spanish: 
 kim_yong_ha_name: "Kim Yong-ha"
 kim_yong_ha_desc: "Salí al Cheonggyecheon para fortalecer mi determinación"

 #공용
 BA_HISTORICAL_CHOICE_TT: "§gEsta es una decisión histórica.§!"
 BA_kivotos_school_country_category: "Academias de Kivotos"
 BA_kivotos_school_country_category_desc: "Este país, que originalmente fue una academia de un lugar llamado Kivotos, conserva una cultura de otra dimensión previa al Gran Traslado. Además, los halos sobre sus cabezas los distinguen claramente de los humanos existentes y han formado una suerte de nacionalismo kivotosiano. Anhelan su Kivotos original y preservan su cultura pasada."
 BA_decisions_give_me_the_COU: "Ascenso de [ROOT.GetLeader] como Presidenta del Consejo Estudiantil General"
 BA_decisions_me_is_COU: "Convertir el país en el Consejo Estudiantil General de Kivotos"
 BA_all_country_category: "Alianza de Kivotos"
 BA_all_country_category_desc: "S.C.H.A.L.E. comenzó como un club extralegal del Consejo Estudiantil General, pero por orden de la Presidenta su propósito cambió por completo. Emprendiendo el gran objetivo de la unificación de Kivotos, S.C.H.A.L.E. absorbió pronto al Consejo Estudiantil, paralizado, y estableció la Alianza de Kivotos. Recientemente, S.C.H.A.L.E. ha reorganizado esta alianza para adaptarla a la realidad, renombrándola como la 'Alianza Euro-Kivotos', y ahora podemos elegir qué haremos dentro de ella."
 BA_join_the_kibotos_alliance: "Unirse a la Alianza de Kivotos"
 BA_participation_in_economic_cooperation: "Cooperación económica Euro-Kivotos"
 BA_remove_dead_lands: "Resolver las zonas inundadas de D.U."
 BA_remove_dead_lands_desc: "Mientras el Consejo Estudiantil General y S.C.H.A.L.E. repetían disputas entre sí, no resolvieron en absoluto el problema de inundaciones en el distrito D.U. La restauración de las zonas inundadas, abandonadas durante largo tiempo, ha pasado —de forma desconcertante— a ser nuestra responsabilidad."

 BA_from_southern_kivotos: "Unificación del sur de Kivotos"
 BA_from_southern_kivotos_desc: "La periferia meridional de Kivotos, a menudo representada por Hyakkiyako y Shanhaijing, es una región más cerrada que otras. Aunque tras el Gran Traslado hubo diversos cambios, la cultura singular del sur de Kivotos conserva rasgos distintivos claramente diferentes del resto. Dado que gobernamos todas las regiones que corresponden al sur de Kivotos, podemos enfatizar esa cultura común."
 southern_kivoto_decision: "Unificar el sur de Kivotos"

 form_southern_kivotos_nation_flag: "Se ha unificado §Yel sur de Kivotos§!."

 #공용 아이디어#
 BA_isolation: "Aislamiento"
 BA_isolation_desc: "Nuestro sistema de diplomacia y comercio ha quedado temporalmente paralizado debido a la situación de emergencia.\n\n"
 BA_can_remove_isolation_flag: "Se cumplen las condiciones para eliminar §YAislamiento§!."
 Aftermath_of_the_Second_Soviet_Polish_War: "Consecuencias de la Segunda Guerra Soviético-Polaca"
 Aftermath_of_the_Second_Soviet_Polish_War_desc: "En medio del terrible caos provocado por la llegada a Europa de unos seres extraños que se autodenominan Kivotos, estallaron pequeños choques en la frontera soviético-polaca, que pronto desembocaron en una Segunda Guerra Soviético-Polaca que ninguno de los dos países deseaba. Al entrar en una guerra para la que no estaban preparados, ambos sufrieron enormes pérdidas humanas y el conflicto terminó sin que ninguno obtuviera beneficio alguno."
 BA_soviet_puppet_idea: "República Soviética"
 BA_three_major_academies: "Las tres grandes academias"
 BA_three_major_academies_desc: "En Kivotos existen tres academias gigantes conocidas como las “tres grandes academias”. Estas academias poseen más estudiantes y ejércitos permanentes de mayor escala que las demás."
 BA_three_major_academies_tt: "£GFX_unit_halo_infantry_icon_small Límite de §Yplantillas§! para §CInfantería de halo§!: §G+6§!"
 BA_railway_gauge_issue: "Ferrocarriles problemáticos"
 BA_railway_gauge_issue_desc: "La red ferroviaria de este nuevo mundo era muy distinta a la nuestra. La multitud de vías cortadas por los efectos del traslado dimensional, junto con tramos de distinto ancho de vía y otros problemas, está retrasando considerablemente nuestras obras."
 BA_exiles_of_the_future: "Exiliados del futuro"
 BA_exiles_of_the_future_desc: "Un mundo desconocido, múltiples tecnologías atrasadas y teorías científicas jamás vistas nos sumieron en la confusión. Tal vez necesitemos más tiempo para adaptarnos a la ciencia y tecnología de este mundo, e incluso para hacerlas avanzar."
 MIL_laboratory: "Laboratorio de Millennium"
 NC_airship_department: "Escuela Kronos"
 koki_electricity: "Koki Electric"
 BA_veronica: "Verónica"

 BA_kiovotos_spain_event.1.t: "Caos justo debajo"
 BA_kiovotos_spain_event.1.d: "Se ha desatado el caos en el territorio inmediatamente al sur del nuestro. Según la información de Veritas, el estamento militar de [SPR.getname] ha intentado un golpe de Estado, pero el gobierno y la ciudadanía están organizando fuerzas de resistencia para enfrentarlo. Por otro lado, innumerables refugiados huyen de la guerra civil y se agolpan en nuestro territorio. Debemos resolver esta situación."
 BA_kiovotos_spain_event.1.a: "Maldita sea."
 BA_kiovotos_spain_event.2.t: "El problema de los refugiados"
 BA_kiovotos_spain_event.2.d: "No podemos quedarnos de brazos cruzados mientras aumentan los refugiados. Los ciudadanos del sur exigen que se los expulse de inmediato. Al mismo tiempo, algunos grupos estudiantiles sostienen el discurso de que tales medidas son inhumanas."
 BA_kiovotos_spain_event.2.a: "Expulsémoslos a todos."
 BA_kiovotos_spain_event.2.b: "Está claro que toda la culpa de esta situación recae en el estamento militar español."
 BA_kiovotos_spain_event.2.c: "Debemos derrocar directamente la incompetencia del gobierno español."
 BA_kiovotos_spain_event.3.t: "Debate sobre la creación de un Comité de Interferencia"
 BA_kiovotos_spain_event.3.d: "Tras el envío de voluntarios de Millennium a la guerra civil española, los demás países de Kivotos también intentan intervenir sin restricciones en el conflicto. Para evitar choques ideológicos y de intereses entre estados de Kivotos, y para mantener la cooperación, podríamos establecer y operar un Comité de Interferencia que coordine y limite esas intervenciones."
 BA_kiovotos_spain_event.3.a: "Establezcamos el Comité de Interferencia."
 BA_kiovotos_spain_event.3.b: "¿De verdad hay que controlarlos?"
 BA_kiovotos_spain_event.3_tt: "En los países miembros del organismo de cooperación de Kivotos, el coste de £GFX_pol_power Poder Político de la decisión £GFX_decision_icon_small §YAbandonar el organismo de cooperación de Kivotos§! se reduce en 20."
 BA_kiovotos_spain_event.4.t: "Se instala el Comité de Interferencia"
 BA_kiovotos_spain_event.4.d: "Por medidas del Consejo Estudiantil General, se ha decidido instalar un Comité de Interferencia bajo el organismo de cooperación de Kivotos. El comité busca impedir que los países de Kivotos intervengan de forma indiscriminada en la guerra civil española y tiene autoridad para supervisar a los cuerpos de voluntarios. No obstante, si cumplimos correctamente las disposiciones del comité, podremos realizar actividades militares libremente dentro del marco permitido."
 BA_kiovotos_spain_event.4.a: "Nos han puesto un grillete en el tobillo."
 BA_kiovotos_spain_event.5.t: "La propuesta de Millennium"
 BA_kiovotos_spain_event.5.d: "En medio de una intervención cada vez más profunda en la guerra civil, Millennium ha propuesto un compromiso de no intervención. Esta propuesta —reducir los recursos requeridos ajustando el reglamento del Comité de Interferencia, a cambio de operar los voluntarios con un tamaño mínimo— está generando un intenso debate entre los miembros del organismo de cooperación."
 BA_kiovotos_spain_event.5.a: "Aceptémosla."
 BA_kiovotos_spain_event.5.b: "La soberanía sigue siendo nuestra."
 BA_kiovotos_spain_event.6.t: "Frenar a Millennium"
 BA_kiovotos_spain_event.6.d: "¡La estúpida decisión de Millennium solo está agravando la situación, sin lograr poner fin a la guerra civil! Hasta ahora evitamos la represalia militar por la enorme fuerza de Millennium, pero eso se acabó. ¡Golpearemos rápidamente las llanuras del norte de Francia para quebrar su capacidad de contraataque y frenar el equivocadísimo hegemonismo de Millennium!"
 BA_kiovotos_spain_event.6.a: "¡Adelante!"
 BA_kiovotos_spain_event.6.b: "No, es demasiado temerario."
 
 BA_interference_committee: "Comité de Interferencia"

 ABY_abydos_sandstorm: "Tormenta de arena de Abydos"
 ABY_abydos_sandstorm_desc: "\n\n\n£GFX_ABY_abydos_sandstorm_picture \n\n\n\nAbydos era una academia que poseía un vasto desierto. Sin embargo, al trasladarse a Europa mediante el Gran Traslado, solo llegaron una academia muy pequeña y parte de un distrito autónomo. Aun así, parece que esa fracción de distrito autónomo fue suficiente para provocar desertificación en amplias zonas de Europa. Hasta que el ecosistema se recupere con el paso del tiempo, en esta región soplarán tormentas de arena."
 
 generic_research_advances: "Avances de investigación"
 generic_research_advances_desc: "Gracias a la inversión activa de nuestro gobierno, la investigación y el desarrollo están progresando rápidamente."

