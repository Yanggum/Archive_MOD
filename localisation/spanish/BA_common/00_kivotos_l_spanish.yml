 ####
 BA_generic_event.1.t: "Mandato sobre [269.getname]"
 BA_generic_event.1.desc: "Tras la derrota final del gobierno británico en la batalla decisiva por la metrópoli, han perdido casi por completo su capacidad de controlar las colonias. Para llevar a cabo con mayor fluidez la guerra que libramos contra [ETH.getname], debemos aprovechar su colonia, [269.getname]. Aunque nuestras tropas entren en la región, el gobierno británico no tendrá más remedio que aceptarlo; por ello recibiremos el mandato de gobierno del territorio para que nuestras divisiones puedan operar allí."
 BA_generic_event.1.a: "Es más fácil pedir perdón que permiso."
 BA_generic_event.1.b: "No hace falta tirarle de los bigotes al león."

 BA_generic_event.2.t: "La cuestión de las concesiones en China"
 BA_generic_event.2.desc: "Con el colapso de Gran Bretaña, las concesiones en China se convirtieron en tierra de nadie. Con el pretexto de “proteger” a los japoneses dentro de las concesiones, las arrebatamos por la fuerza."
 BA_generic_event.2.a: "Buena idea."
 BA_generic_event.2.b: "No puedo vender el futuro."

 BA_generic_event.3.t: "London Bridge se derrumba"
 BA_generic_event.3.desc: "Con la retirada de la bandera del Imperio británico que dominaba el Pacífico, nuestros rivales en esa región han desaparecido. Podemos aprovechar esta oportunidad para tomar la hegemonía del Pacífico."
 BA_generic_event.3.a: "¡Ocúpenlo!"
 BA_generic_event.3.b: "No puedo vender el futuro."

 BA_generic_event.4.t: "Operación italiana de invasión a Millennium" 
 BA_generic_event.4.desc: "Italia afirma que ahora es el momento de atacar a Millennium y solicita una declaración de guerra." 
 BA_generic_event.4.a: "Este es el momento ideal"
 BA_generic_event.4.b: "Ahora no se puede."

 BA_generic_event.5.t: "Propuesta de paz de China"
 BA_generic_event.5.desc: "La República de China no pudo resistir la ofensiva del Imperio japonés y hoy nos ha propuesto la paz."
 BA_generic_event.5.a: "Perfecto."

 BA_generic_event.6.t: "Japón acepta"
 BA_generic_event.6.desc: "Japón ha aceptado nuestro tratado de paz."
 BA_generic_event.6.a: "Qué lamentable."

 BA_generic_event.7.t: "Abydos exige un referéndum"
 BA_generic_event.7.desc: "En el discurso de Otto von Habsburg en [4.GetName], los súbditos húngaros suplicaron que se les permitiera volver a su dominio. Sin embargo, como gesto de reconciliación, él declaró públicamente que el pueblo de Austria debía decidir por sí mismo de manera soberana."
 BA_generic_event.7.a: "Dejemos que la gente hable."
 BA_generic_event.7.b: "Eso hay que dejárselo a los expertos."

 BA_generic_event.8.t: "Se aprueba el referéndum"
 BA_generic_event.8.desc: "Ya se conocen los resultados del referéndum, y el conteo preliminar indica que la alianza con Abydos ha obtenido la mayoría."
 BA_generic_event.8.a: "Es la voluntad del pueblo."
 
 BA_generic_event.9.t: "Fracasa el referéndum"
 BA_generic_event.9.desc: "A pesar de la preparación perfecta de los pro-Abydos y los monárquicos, el resultado preliminar parece ser, por un margen estrecho, el mantenimiento del statu quo."
 BA_generic_event.9.a: "Entonces solo queda un método."
 
 BA_generic_event.10.t: "Se rechaza el referéndum"
 BA_generic_event.10.desc: "El líder húngaro, [HUN.Getleader], ha rechazado nuestra exigencia de un referéndum." 

 BA_generic_event.11.t: "Anarquía en Irlanda del Norte"
 BA_generic_event.11.d: "El Imperio británico cayó ante seres de otra dimensión, y emprendieron el camino del exilio. Con su salida de las islas británicas, todas las tropas británicas en Irlanda del Norte se retiraron, creando un vacío de seguridad.\nAhora que Gran Bretaña se ha marchado, el destino de Irlanda del Norte es uno solo."
 BA_generic_event.11.a: "¡Ocupen Irlanda del Norte!"
 ENG_to_IRE_Betray: "Traidores"
 BA_generic_event.11.b: "Ayuda lo justo a Gran Bretaña para mantener el orden."
 ENG_to_IRE_HAPPYCAT: "Se brindó ayuda"

 BA_generic_event.12.t: "La gloria de unos forajidos olvidados"
 BA_generic_event.12.d: "Al investigar la isla de Tahití, encontramos numerosas tumbas. Tras examinarlas, se confirmó que pertenecían a un grupo de forajidos. Lo extraño es que tenían una cantidad inmensa de lingotes de oro. Al investigar el origen, se determinó que provenían de Saint Denis, es decir, lingotes robados del banco de la antigua Nueva Orleans.\n\nEl atraco al banco de Nueva Orleans, que quedó como caso sin resolver de por vida en 1899, conmocionó profundamente la historia estadounidense. Tras el robo, los forajidos desaparecieron sin dejar rastro.\nNunca se logró dar con ellos, y el caso quedó como misterio eterno, destinado a ser olvidado con el tiempo. Sin embargo, la noticia de que fueron encontrados de manera absurda en Tahití dejó a la sociedad estadounidense sin palabras.\n\nHay dos grandes teorías sobre por qué terminaron en Tahití: que abandonaron Estados Unidos en barco y naufragaron por una tormenta, o que se marcharon deliberadamente llevando consigo los lingotes. Los académicos siguen divididos, pero muchos ciudadanos estadounidenses aceptan la segunda.\n\nSea como sea, su muerte será la señal de que la era de los forajidos finalmente ha terminado."
 BA_generic_event.12.a: "Rojo, muerte y redención (Red Dead Redemption)"

 BA_generic_event.13.t: "Se descubre la fisión nuclear"
 BA_generic_event.13.d: "Otto Hahn y Strassmann realizaron un experimento haciendo chocar neutrones contra uranio. El objetivo era generar isótopos radiactivos y, mediante análisis químico, confirmar nuevos elementos.\n\nSin embargo, el producto resultó ser un elemento mucho más ligero que el uranio. Strassmann, a través de un análisis preciso, confirmó que era bario. Era un resultado imposible de explicar con las teorías existentes.\n\nAmbos plantearon la hipótesis de que el núcleo se había dividido en la reacción entre uranio y neutrones. Químicamente el experimento era muy convincente, pero no estaban seguros de su explicación física.\n\nHahn compartió los resultados con su colega Lise Meitner. Meitner y Otto Frisch los interpretaron teóricamente y concluyeron que el núcleo de uranio, al recibir el impacto de un neutrón, se divide formando dos elementos más ligeros. En ese proceso se liberaba una enorme cantidad de energía, y lo llamaron “fisión nuclear”.\n\nEl descubrimiento causó gran impacto en la comunidad científica, en especial porque abría la posibilidad de desarrollar bombas atómicas a partir de la inmensa energía liberada en la fisión."
 BA_generic_event.13.a: "¡Es un descubrimiento increíble!"

 BA_generic_event.16.t: "§t¡Proyecto KV detectado!§!"
 BA_generic_event.16.d: "Poco después de que el Gran Traslado nos dejara caer en este mundo extraño, llegó la noticia de que, en el lejano Oriente, una nueva fuerza apareció debido al Gran Traslado.\n\n¡Es un descubrimiento asombroso, así que debemos partir hacia allá de inmediato! ¡Ahora mismo, rápido!"
 BA_generic_event.16.a: "¡Me parece una idea magnífica!"
 BA_generic_event.16.b: "No, ¿estás loco?"

 BA_generic_event.17.t: "[USA.getname] busca unirse a la Internacional Comunista"
 BA_generic_event.17.d: "[USA.getname] ha expresado su deseo de unirse a la Internacional Comunista."
 BA_generic_event.17.a: "¡Qué buenas noticias!"
 BA_generic_event.17.b: "No los necesitamos en nuestra facción."

 BA_generic_event.18.t: "[USA.getname] se niega"
 BA_generic_event.18.d: "Ante nuestra intención de adhesión, [USA.getname] la ha rechazado con firmeza."
 BA_generic_event.18.a: "A ver cómo les va sin nosotros."

 BA_generic_event.19.t: "Un sueño en el despacho"
 BA_generic_event.19.d: "......Fue culpa mía.\n\nMis decisiones. Y todo lo que provocaron.\nQue solo al llegar a este resultado me dé cuenta de que tú tenías razón.......\n\n......Así que, aunque no tenga cara para pedirlo, te lo ruego.\n\nSensei. [ROOT.GetLeader]\nDe todas formas olvidarás mis palabras, pero… supongo que no importa, ¿verdad?\nAunque no recuerdes nada, probablemente en la misma situación tomarás las mismas decisiones.......\n\nPor eso, quizá… lo importante no es la experiencia, sino la elección.\nLas elecciones que solo tú puedes hacer.\n\n¿Recuerdas que hablamos de la persona que carga con la responsabilidad?\nEn aquel momento yo no lo entendía… pero ahora sí.\n\nUn adulto. Responsabilidad y deber, y la elección que existe más allá.\n\nIncluso lo que eso significa.\n\n.......\nAsí que, Sensei.\nSolo tú, el adulto en quien puedo confiar,\npuedes encontrar un resultado distinto a este destino torcido y deformado…\n\npuedes encontrar… las opciones que llevan a ese lugar.\n\nAsí que, Sensei.\nPor favor......."
 BA_generic_event.19.a: "¿Sensei... qué?"

 BA_generic_event.20.t: "Una nueva edad de oro para Mongolia"
 BA_generic_event.20.d: "En el año [GetYear], se escribió una nueva historia en la estepa mongola. Incluso bajo siglos de dominación y opresión extranjera, la chispa del pueblo nunca se apagó… y por fin se alzó como una gran llama. Los descendientes de Gengis Kan volvieron a convertirse en protagonistas de la historia en la tierra de sus ancestros."
 BA_generic_event.20.a: "¡Bayarla!"

 BA_generic_event.401.t: "Un nuevo año vuelve a amanecer"
 BA_generic_event.401.d: "Fue un año ruidoso y caótico con nuevos vecinos, pero el Año Nuevo llegó una vez más.\nAunque algunos odian y derraman lágrimas, la mayoría salió a las calles para recibir un nuevo año, torpe pero lleno de vida. Incluso quienes hasta ayer se sospechaban y vigilaban hoy caminaron juntos, compartiendo sonrisas incómodas.\nEstudiantes y locales pueden verse distintos por fuera, pero la mayoría imagina y desea un futuro pacífico y esperanzador este año.\n\nAl menos, por ahora."
 BA_generic_event.401.a: "Este año será un poco mejor, ¿no?"

 # 센세모드 이벤트 13XX부터
 BA_generic_event.1301.t: "Contacto del Consejo Estudiantil General"
 BA_generic_event.1301.d: "Estimado Sensei:\n\nSoy Nanagami Rin, presidenta interina del Consejo Estudiantil General, encargada de supervisar la administración del Distrito Autónomo de Kivotos.\n\nHe sabido que usted, como líder del país, se ha convertido en el nuevo Sensei, y por eso me comunico con usted.\nEsperamos que forje una relación amistosa con Kivotos y guíe a nuestras estudiantes por el camino correcto. A partir de ahora, quedo a su disposición."
 BA_generic_event.1301.a: "Igualmente, Rin. Encantado de trabajar contigo."
 BA_generic_event.1301.b: "Espera, ¿Sensei? ¿De qué estás hablando?"
 BA_generic_event.1302.t: "Respuesta del Consejo Estudiantil General"
 BA_generic_event.1302.d: "Ah, disculpe. He sido descortés. El tratamiento “Sensei” es un título que en Kivotos se otorga al líder y consejero más respetado. Consideramos que usted reúne méritos suficientes y por eso lo llamamos así; pero si el trato le incomoda, lo corregiremos."
 BA_generic_event.1302.a: "No, está bien. Puedes llamarme “Sensei”."
 BA_generic_event.1302.b: "Ese título me queda demasiado grande."

 BA_generic_event.1303.t: "Propuesta de emergencia del Consejo Estudiantil General"
 BA_generic_event.1303.d: "Sensei, me comunico nuevamente. En realidad, el Consejo Estudiantil General se encuentra casi paralizado en lo administrativo debido a la ausencia de la Presidenta. Para que Kivotos recupere la estabilidad bajo su liderazgo, deseamos delegar temporalmente en usted la autoridad administrativa del Consejo Estudiantil General. Le ruego considere nuestra propuesta."
 BA_generic_event.1303.a: "Acepto la propuesta. También protegeré vuestro mundo."
 BA_generic_event.1303.b: "Dame un poco de tiempo para pensarlo."
 BA_generic_event.1303.c: "Lo siento, pero no puedo hacerlo."

 BA_generic_event.1304.t: "Ultimátum del Consejo Estudiantil General"
 BA_generic_event.1304.d: "Sensei, lamentamos su rechazo. Pero no podemos retirarnos así como así. Si usted no se convierte en nuestro líder, entonces lo haremos nuestro… incluso por la fuerza. Esa es nuestra determinación, la del Consejo Estudiantil General."
 BA_generic_event.1304.a: "......!"
