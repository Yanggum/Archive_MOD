 cronos_school: "Radiodifusora de Kivotos"
 MIL_automaton_manufacturer: "Instalación de investigación científica avanzada"
 train_school: "Compañía Ferroviaria de Kivotos"
 GEH_designer: "Desarrolladora desordenada"
