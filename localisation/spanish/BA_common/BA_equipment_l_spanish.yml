### Academia Integral Trinity ###
 TRM_infantry_equipment_0:0 "Impairment/Blessing"
 TRM_infantry_equipment_0_short:0 "Impairment"
 TRM_infantry_equipment_0_desc:0 "Un arma de nueva generación desarrollada a petición del Departamento de Justicia para reemplazar armamento obsoleto. Presume una precisión excelente y una durabilidad decente, aunque también existen evaluaciones que señalan que aún le falta para sustituir por completo las armas existentes."
 TRM_infantry_equipment_1:0 "Quis ut Deus"
 TRM_infantry_equipment_1_short:0 "Quis ut Deus"
 TRM_infantry_equipment_1_desc:0 "Un subfusil común desarrollado en Trinity hace bastante tiempo. Tiene algunas ventajas, como una estructura apta para producción en masa y una alta cadencia de tiro, pero deja que desear por su baja durabilidad y precisión."
 TRM_infantry_equipment_2:0 "Sweet Driver"
 TRM_infantry_equipment_2_short:0 "Sweet Driver"
 TRM_infantry_equipment_2_desc:0 "Ligero y, entre las armas que usan el mismo tipo de munición, tiene un retroceso relativamente bajo. Es un fusil característico de Trinity que además suma gran comodidad de uso y buena durabilidad. Sin embargo, su apariencia peculiar divide opiniones entre los usuarios."
 TRM_infantry_equipment_3:0 "Library Ruler"
 TRM_infantry_equipment_3_short:0 "Library Ruler"
 TRM_infantry_equipment_3_desc:0 "Corrige las desventajas del anterior armamento reglamentario. La precisión ha aumentado y la ergonomía se ha mejorado, manteniendo su apariencia única. Puede equipar un lanzagranadas, permitiendo reforzar la potencia de fuego cuando sea necesario."

