### Academia Secundaria Abydos ###
 ABY_infantry_equipment_0:0 "Medios razonables"
 ABY_infantry_equipment_0_short:0 "Medios razonables"
 ABY_infantry_equipment_0_desc:0 "La pistola que usa Okusora Ayane. Fue un arma reglamentaria empleada temporalmente durante los inicios de la Gran Transposición para cubrir la escasez de armamento. Aunque es una pistola, posee una potencia de fuego muy alta, por lo que aún hoy se entrega a oficiales."
 ABY_infantry_equipment_1:0 "Sincerity"
 ABY_infantry_equipment_1_short:0 "Sincerity"
 ABY_infantry_equipment_1_desc:0 "El fusil de asalto que usa Kuromi Serika, un arma reglamentaria cuyo nombre significa «sinceridad» o «honestidad». En especial entre los soldados se ha vuelto popular porque corre el rumor de que, fiel a su nombre, rinde exactamente como en el entrenamiento."
 ABY_infantry_equipment_2:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_short:0 "WHITE FANG 465"
 ABY_infantry_equipment_2_desc:0 "El fusil de asalto que usa Sunaookami Shiroko. Gracias a su amplia versatilidad y modularidad —desde fusil de tirador designado hasta fusil de asalto para infantería— fue adoptado como nuevo armamento reglamentario. Posee un poder destructivo notable, pero por su alto peso y el uso de cargadores dedicados, se está discutiendo su mejora."
 ABY_infantry_equipment_3:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_short:0 "BLACK FANG 465"
 ABY_infantry_equipment_3_desc:0 "Versión mejorada del WHITE FANG 465: mantiene sus virtudes, reduce el peso y permite insertar cargadores estándar. Logra avances como mayor modularidad, mantenimiento más sencillo, y mejoras en precisión y alcance; sin embargo, a cambio su fiabilidad disminuyó ligeramente y en ocasiones puede presentar fallos."
 ABY_ABYDOS_modern_infantry_equipment:0 "Ojo de Horus + Beretta 92A1"
 ABY_ABYDOS_modern_infantry_equipment_short:0 "Ojo de Horus + Beretta 92A1"
 ABY_ABYDOS_modern_infantry_equipment_desc:0 "Escopeta, subfusil auxiliar y chaleco antibalas usados por Takanashi Hoshino. Se suministran principalmente a unidades de asalto para romper el frente, barrer trincheras enemigas y asegurar posiciones hasta la llegada de la infantería de apoyo. El resto del equipo semi-moderno —como el chaleco con placas de acero— se integra también en la infantería regular, aumentando su potencia de fuego y capacidad defensiva."
 ABY_juggernaut_equipment_0:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_short:0 "Juggernaut Mini No.5"
 ABY_juggernaut_equipment_0_desc:0 "La minigun de la empresa Nephthys usada por Izayoi Nonomi, junto con un nuevo traje Juggernaut. La minigun se aligeró mediante nuevos materiales, pero sigue siendo demasiado exigente para la infantería común, por lo que se asignó como armamento para unidades Juggernaut con exoesqueletos reforzados. El traje Juggernaut incorpora tecnología de enlace de datos: si se despliegan drones en la misma formación, drones y Juggernauts pueden operar en escuadrón, permitiendo ejecutar tácticas más eficientes."
