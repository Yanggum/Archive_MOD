 BA_form_iberia_category: "Federación Ibérica"
 BA_form_iberia_category_desc: "Han pasado los días en que todos fuimos gloriosos, y hoy nos encontramos de pie sobre ilusiones descoloridas. Aunque han transcurrido más de 300 años desde 1640, la gente de Madrid y Lisboa todavía sueña el mismo sueño. Durante tres siglos, las personas han luchado con empeño por recuperar esa fantasía en sueños que se repiten cada día. Aunque la península ibérica haya caído en una oscuridad profunda entre las grietas de los siglos, el sueño y la ilusión —tan vanos como parecían, compartidos por todos— nunca fueron mentira."
