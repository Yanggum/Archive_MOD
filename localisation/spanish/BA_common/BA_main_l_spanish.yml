 #Marcador
 BA_scenario_name: "50 días en un nuevo mundo"
 BA_scenario_desc: "¿Será un fenómeno sobrenatural? ¿O una broma de Dios? Harían falta mil años y aun así no bastaría para explicarlo. Pero la expectativa por el nuevo mundo no duró: se hizo pedazos. La gente de allí nos etiquetó como invasores y nos atacó sin dudar. Por la abrumadora diferencia de poder, se desmoronaron y cayeron con facilidad, pero las heridas que dejaron quedaron grabadas en lo más profundo de nosotros. Para que esa herida sane, probablemente hará falta mucho tiempo."

 Debug_BA_gathering_storm_desc: "Si me ves, por favor redacta un reporte de bug."
 highlight_major_1_tt: "@RED Ruta de §YAcademia Federal de Red Winter§!: "
 highlight_major_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_RED_path_texticon\n\n\n\n\n\n\n§YNuestra líder Cherino§! - §RRenka y Cherino§!\n  £white_dot §gRevolución del sistema de Cherino§!\n  £white_dot §gRevolución mundial de Trotski§!\n§g========================================§!\n§YGuía§!: La Academia Federal de Red Winter es un país al estilo HOI4 vainilla, sin eventos narrativos ni finales. Recomendado para quienes quieran un sandbox libre al estilo vainilla."

 highlight_major_2_tt: "@MIL Ruta de §YColegio de Ciencias Millennium§!: "
 highlight_major_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_MIL_path_texticon\n\n\n\n\n\n\n§t¡Todas las rutas están incompletas!§!\n\n§YTecnocracia liderada por el Seminario§! - §CTsukatsuki Rio§!\n  £white_dot §gMantener el poder de Rio§!\n  £white_dot §gGobierno de Hayase Yuuka§!\n  £white_dot §gGobierno de Ushio Noa§!\n\n§YTecnocracia liderada por Veritas§! - §GAkeboshi Himari§!\n§g========================================§!\n§YGuía§!: Millennium es un país al estilo HOI4 vainilla, sin eventos narrativos ni finales. Su dificultad es baja; recomendado para quienes quieran un sandbox libre y un gameplay no muy difícil."

 highlight_major_3_tt: "@TRM Ruta de §YTrinity General School§!:"
 highlight_major_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_TRM_path_texticon\n\n\n\n\n\n\n§t¡Todas las rutas están incompletas!§!\n\n§YEl nacimiento de la segunda Trinity§! - §MMisono Mika§!\n  £white_dot §gConstruir una Trinity justa§!\n    £white_dot Tiene §Y2§! finales.\n\n §YUn deber noble§! - §LKirifuji Nagisa§!\n  £white_dot §gEl nuevo milenio de Trinity§!\n    £white_dot Tiene §Y2§! finales.\n\n §YLa verdadera democracia estudiantil§! - §YAjitani Hifumi§!\n  £white_dot §gRehabilitación de Kirifuji Nagisa§!\n    £white_dot Tiene §Y2§! finales.\n  £white_dot §gGobierno de Utazumi Sakurako§!\n    £white_dot Tiene §Y1§! final. Existe rama con Urawa Hanako.\n  £white_dot §gGobierno de Aomori Mine§!\n    £white_dot Tiene §Y1§! final.\n  £white_dot §gPresidenta del consejo Ajitani Hifumi§!\n    £white_dot Tiene §Y1§! final.\n§g========================================§!\n§YGuía§!: Trinity es un país narrativo sencillo en formato Kaiserreich. El juego se centra en la ruta de enfoques; recomendado para quienes empiezan el mod o quieran disfrutar historias ligeras del día a día de las estudiantes de Trinity."

 highlight_major_4_tt: "@COU Ruta de §YConsejo General de Estudiantes de Kivotos§!: "
 highlight_major_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_COU_path_texticon\n\n\n\n\n\n\n§YComité de Medidas de Emergencia de Kivotos§!\n  £white_dot §gYuragi Momoka, presidenta honoraria§!\n  £white_dot §gNanagami Rin, presidenta interina§!\n\n§YAcechando en la oscuridad§! - §gShiranui Kaya§! §R(No jugable)§!\n§g========================================§!\n§YGuía§!: El Consejo General de Estudiantes es un país narrativo sencillo en formato Kaiserreich. Tiene una dificultad §Rmuy desafiante§! porque desde el inicio queda expuesto a la amenaza de Schale; recomendado para jugadores avanzados."

 highlight_major_5_tt: "@GEM Ruta de §YPandemonium Society§!: "
 highlight_major_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEM_path_texticon\n\n\n\n\n\n\n §gPandemonium Society es un país donde el contenido del árbol de enfoques puede cambiar según qué enfoque completes primero, y también puede sufrir cambios especiales por condiciones o situaciones únicas.§!\n\n§gÁrboles base por líder§!\n  £white_dot Presidenta §YHanuma Makoto§!\n  £white_dot Presidenta §YKogyoku Satsuki§!\n  £white_dot Presidenta §YNatsume Iroha§!\n  £white_dot Presidenta §YMotomiya Chiaki§!\n  £white_dot Presidenta §YTanga Ibuki§! - (§RIncompleto§!)\n\n §gEnfoques de entrada al 'origen' por líder§!\n  £white_dot §OEstado de guerra perpetua§! de Hanuma Makoto\n  £white_dot §OPaís pacífico§! de Kogyoku Satsuki\n  £white_dot §OEstados Unidos de Gehenna§! de Natsume Iroha\n  £white_dot §ONueva administración§! de Motomiya Chiaki\n  £white_dot §OCrecimiento§! de Tanga Ibuki - (§RIncompleto§!)\n\n §gEnfoques de entrada al 'origen' según forma de gobierno§!\n  £white_dot Proclamar §OEstado alemán§!\n  £white_dot Proclamar §OFederación Alemania–Gehenna§!\n  £white_dot Mantener §OGehenna§!\n\n§g========================================§!\n§YGuía§!: Pandemonium Society es un país al estilo HOI4 vainilla con sistemas complejos y rutas muy ramificadas. Tiene guerras previstas contra el Comité Disciplinario de Gehenna y Trinity, por lo que su dificultad es §Oalta§!. Recomendado para jugadores intermedios o avanzados que quieran un sandbox libre al estilo vainilla."

 highlight_major_6_tt: "@HYA Ruta de §YAlianza de Hyakkiyako§!:\n\n\n\n\n\n   £GFX_HYA_path_texticon\n\n\n\n\n\n\nEl más fuerte: Ikkaku Lion\n\n§g========================================§!\n§YGuía§!: Hyakkiyako es un país de dificultad §Ynormal§! y estilo sandbox: base vainilla de HOI4 con un poco de narrativa. Recomendado para quienes quieran jugar libremente."
 highlight_major_7_tt: "@SHA Ruta de §YColegio Superior Shanhaijing§!:\n\n\n\n\n\n   £GFX_SHA_path_texticon\n\n\n\n\n\n\nHasta la líder Kisaki usa Xiaomi\n §GHerencia del frasco rojo§!\n    £white_dot Resurgimiento del ostro-marxismo\n    £white_dot Socialismo distintivo de Shanhaijing\n\n§g========================================§!\n§YGuía§!: Shanhaijing es un país de dificultad §Ynormal§! y estilo sandbox: base vainilla de HOI4 con un poco de narrativa. Recomendado para quienes quieran jugar libremente."

 highlight_minor_1_tt: "@LUX Ruta de §YGran Ducado de Luxemburgo§! §g(Agencia 68)§!: "
 highlight_minor_1_2_tt: "£GFX_white\n\n\n\n\n   £GFX_HEU_path_texticon\n\n\n\n\n\n\n §gGobierno pro-Gehenna§!\n  £white_dot Revolución 68 en Luxemburgo - §G(Por defecto)§!\n\n §gGobierno anti-Gehenna§!\n  £white_dot Aprobación de la §YLey de Derechos Civiles§!\n  £white_dot Rechazo de la §YLey de Derechos Civiles§!\n\n§g========================================§!\n§YGuía§!: Luxemburgo es un país de dificultad §Rmuy desafiante§! y estilo narrativo con muchos eventos e historias. Recomendado para quienes quieran una experiencia nueva en el mod o tengan interés en la historia isekai de §YAgencia 68§!."

 highlight_minor_2_tt: "@GEH Ruta del §YComité Disciplinario de Gehenna§!: "
 highlight_minor_2_2_tt: "£GFX_white\n\n\n\n\n   £GFX_GEH_path_texticon\n\n\n\n\n\n\n §gGobierno de Sorazaki Hina§!\n  £white_dot Gobierno militarista de Shiromi Iori\n  £white_dot Dictadura de Sorazaki Hina por miembros fanáticos\n  £white_dot Tecnocracia de Amau Ako y el Departamento de Planificación\n  £white_dot Status quo\n\n §gDimisión de Sorazaki Hina§!\n  £white_dot Shiromi Iori como jefa del Comité Disciplinario\n  £white_dot Dirección colectiva de miembros fanáticos\n  £white_dot Gobierno de Sorazaki Hina robot\n  £white_dot Dirección colectiva del Departamento de Planificación\n  £white_dot Status quo\n§g========================================§!\n§YGuía§!: El Comité Disciplinario de Gehenna es un país de dificultad §Rdesafiante§! y con narrativa sencilla en formato Kaiserreich. Si no conquistas toda Gehenna y toda Trinity dentro de cierto tiempo, Hina dimitirá; y según dimita o no, la historia cambia por completo. Recomendado para quienes buscan gameplay difícil."

 highlight_minor_3_tt: "@ABY Ruta de §YEscuela Secundaria Abydos§!:"
 highlight_minor_3_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ABY_path_texticon\n\n\n\n\n\n\n §4Restaurar el legado de Masaryk§!\n  £white_dot §gLos dueños de esta tierra§! - §YGobierno local§!\n    £white_dot Tiene §Y1§! final. - (§RIncompleto§!)\n  £white_dot §gUn país de dos mundos§! - §tOkusora Ayane§!\n    £white_dot Tiene §Y1§! final. - (§RIncompleto§!)\n\n§4Democracia, una vela al viento§!\n  £white_dot §gLlaves que traquetean§! - §CSunaookami Shiroko§!\n    £white_dot Tiene §Y2§! finales. - (§Y1 final completado§!)\n  £white_dot §gLa verdadera democracia del pueblo§! - §PTakanashi Hoshino§!\n    £white_dot Tiene §Y1§! final. - (§RIncompleto§!)\n\n§4La guerra de los locos§!\n  £white_dot §gVenganza por los muertos.§! - §0Kuromi Serika§!\n    £white_dot Tiene §Y2§! finales. - (§RIncompleto§!)\n  £white_dot §gIlumina a todo Kivotos.§! - §LAsagiri Suou§!\n    £white_dot Tiene §Y1§! final. - (§RIncompleto§!)\n  £white_dot §gUna líder que perdió su poder.§! - §8Izayoi Nonomi§!\n    £white_dot Tiene §Y1§! final. - (§RIncompleto§!)\n§g========================================§!\n§YGuía§!: Abydos es un país de dificultad §Rdesafiante§! y estilo narrativo centrado en eventos. La mayoría de rutas cooperan con los locales y buscan completar un sistema democrático. Existe un personaje histórico que cumple el rol de 'Sensei'; la trama se centra más en la interacción/conflicto entre kivotosianos y locales que en disputas internas entre estudiantes.\n§YRecomendado para quienes prefieran historias entre kivotosianos y locales.§!"

 highlight_minor_4_tt: "@FRA Ruta de §YRepública Francesa§!:"
 highlight_minor_4_2_tt: "£GFX_white\n\n\n\n\n   £GFX_FRA_path_texticon\n\n\n\n\n\n\n §YCamino hacia la patria§!\n  £white_dot §g'El León de Verdún'§! - §4Philippe Pétain§!\n  £white_dot §g'Las brasas de la República'§! - §tGeorges Gamelin§!\n  £white_dot §g'La Cruz de Lorena'§! - §YCharles de Gaulle§!\n§g========================================§!\n§YGuía§!: La República Francesa es un país al estilo HOI4 vainilla, sin eventos narrativos ni finales. Recomendado para quienes quieran un sandbox libre al estilo vainilla."

 highlight_minor_5_tt: "@ARI Ruta de §YFilial Arius§!:"
 highlight_minor_5_2_tt: "£GFX_white\n\n\n\n\n   £GFX_ARI_path_texticon\n\n\n\n\n\n\n §gArius es un país con una estructura de progreso única: conforme se expande, su ruta se vuelve cada vez más amplia.§!\n\n§gGobierno del Escuadrón§!\n  £white_dot Victoria de los conservadores - (§C¡Disponible!§!)\n  £white_dot Victoria de los reformistas - (§RIncompleto§!)\n  £white_dot Empate - (§RIncompleto§!)\n\n§g========================================§!\n§YGuía§!: La Filial Arius equilibra eventos narrativos con el estilo HOI4 vainilla. Tiene una guerra prevista contra Trinity y su dificultad es §Rmuy alta§!. Recomendado para jugadores avanzados o para quienes quieran vivir la historia de Arius."

 HYA_GATHERING_STORM_DESC: "Una academia de cultura y festivales, orgullosa de su larga historia y tradición. Hyakkiyako, antes y después de la Gran Transferencia, sigue viviendo días ajetreados bajo las luces del festival cultural.\n\nPero ya no podemos seguir disfrutando del festival para siempre: debemos aceptar la realidad. La Gran Guerra, un acontecimiento sin precedentes, sacudió los cimientos de Kivotos; y Hyakkiyako, como rama colgante del árbol, también debe aceptar el cambio.\n\nEl Departamento de Yin-Yang, que tradicionalmente sustituyó al consejo estudiantil; el Hyakkayōran, que ganó influencia tras la Gran Transferencia; y muchos otros, luchan buscando su oportunidad."

 KSP_GATHERING_STORM_DESC: "La Escuela de Policía Valkyrie fue la más dañada entre todas las academias por la Gran Transferencia. Las estudiantes que estaban dispersas por todo Kivotos perdieron todo contacto en el instante de la transferencia, y hasta hoy no se ha podido restablecer comunicación con ellas. Además, con el colapso de la Oficina Correccional de Valkyrie, los elementos más peligrosos de Kivotos intentan escapar.\n\nEn medio de estas crisis, Kanna está haciendo todo lo posible por liderar la Escuela de Policía Valkyrie… pero, ¿hasta cuándo podrá resistir?"

 SRT_GATHERING_STORM_DESC: "Famosa por su entrenamiento estricto y su proceso de selección brutal, la Academia Especial SRT es una escuela de formación de fuerzas especiales creada por la Presidenta del Consejo General de Estudiantes para responder con flexibilidad a situaciones de crimen grave en cada academia. Su existencia, sin embargo, fue polémica por considerarse una violación de la autonomía de las academias; aun así, gracias al prestigio de la Presidenta, no hubo grandes resistencias.\n\nPor el caos de la Gran Transferencia, SRT quedó aislada del Consejo General. Si en esta situación la Presidenta estuviera en peligro, la propia continuidad de SRT podría volverse incierta…"

