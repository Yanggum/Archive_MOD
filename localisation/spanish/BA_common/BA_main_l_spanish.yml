 ## TAB 3 #
 KR_welcome_splash_tab_3_content: "§YRecuerda lo siguiente:§!\n£white_dot\n\n\n£white_dot\n\n\n£white_dot\n\n£white_dot\n\n\n\n\n§YReportar problemas:§!\nEste mod aún está en desarrollo, por lo que pueden ocurrir errores y conflictos. Si surge algún problema, repórtalo en nuestro §YDiscord del mod de Blue Archive§! para que podamos corregirlo lo antes posible. El enlace se puede encontrar en la página de Steam."
 KR_welcome_splash_tab_3_content_0: "El mod de Blue Archive no limita las elecciones del jugador como §Rliberar países§!, §Rguerra rápida§! o §Rusar trucos§!, pero recomendamos evitarlo en la medida de lo posible.\nDurante el §Ytratado de paz§!, deberías anexionar tantos países como sea posible. De lo contrario, más adelante las condiciones de §Yeventos o decisiones§! pueden §Rdescuadrarse o no aplicar efectos§!, causando §Rproblemas§!.\nEn el menú de §Yreglas personalizadas de la partida§! puedes ajustar varias opciones como §tactivar el colapso de Trinity§! o §0la llegada del Chroma§!.\nEste mod requiere §Ytener todos los DLC§! para seguir §Yla dirección prevista por los desarrolladores§!.\nVerifica en la página de Steam que §Yposees todos los DLC§!."

 ## TAB 4 ##
 KR_welcome_splash_tab_4_upper_header: "§YBienvenido a Blue Archive BETA $BA_CURRENT_VERSION$"
 KR_welcome_splash_tab_4_lower_header: "Hecho con amor por el equipo de Blue Archive:§!"
 KR_welcome_splash_tab_4_content: "SKSKle   Kangseul2702   AfterImage   jindoi  Sonetto  mintcoon  Imika\nJamm   시현   Skoober   mako0922   goddess6431  _yurizono.seia_  UnineVesiKass  subikgm  16729kei\n\n§gAdemás, gracias a dawn, 릿카, victorious09, execution_2525, coy-0001, lusaviet, anpleur, crossesyes, neunal, 16729, kaichou09, Fraise, 보리꼬리, pencildude, bang0709, the_master_pigeon, que ayudaron en mayor o menor medida. §!\n\nY también agradecemos a los creadores de los mods:\n£GFX_tx_logo_road_to_56 The Road to 56, £GFX_tx_logo_kr Kaiserreich, £GFX_tx_logo_dh Darkest Hour, £GFX_tx_logo_pb Pax Britannica, £GFX_tx_logo_tno The New Order\n£GFX_tx_logo_ssw The Sun Shining on the World"
 KR_welcome_splash_tab_4_content_0: "Nuestro equipo ha trabajado muy duro, alcanzando muchísimos 'pity' (techo), para que tengas la mejor experiencia posible en el mod de Blue Archive; y para nosotros es un honor inmenso que juegues nuestro mod.\nEsperamos que, al jugar el mod de Blue Archive, lo disfrutes tanto como nosotros lo disfrutamos al crearlo."

