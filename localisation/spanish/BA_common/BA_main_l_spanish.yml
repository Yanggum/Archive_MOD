 gehenna_unification_desc: "Tras la Gran Transferencia, el campus de Gehenna quedó dividido en distintas regiones; y, tras la rivalidad entre el Consejo de Pandemonium (Manmajeon) y el Comité Disciplinario, la academia se fragmentó en caudillos. Pero ahora, una vez más, hemos reunificado Gehenna y hemos recreado el glorioso pasado."
