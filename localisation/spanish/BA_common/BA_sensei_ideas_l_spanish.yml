l_spanish:
  BA_sensei_guidance: "La guía del Sensei"
 BA_sensei_guidance_desc: "La experiencia adquirida guiando a las estudiantes de Kivotos se ha convertido ahora en un activo invaluable para liderar una nación. La confianza pura y las expectativas depositadas por las estudiantes nos imponen una gran responsabilidad, pero también nos otorgan el valor necesario para superar cualquier adversidad."

 BA_sensei_millennium_collab: "Cooperación tecnológica con Millennium"
 BA_sensei_millennium_collab_desc: "La colaboración con la Millennium Science School ha elevado el nivel tecnológico del país a una nueva etapa. Compartiendo tecnologías de vanguardia y macrodatos, estamos liderando la innovación de cara al futuro."

 BA_sensei_srt_security: "Asesoría de seguridad de SRT"
 BA_sensei_srt_security_desc: "La experiencia real de la Academia Especial SRT ha insuflado nueva vitalidad a nuestro sistema de seguridad nacional. Gracias a sus asesorías especializadas, nuestras fuerzas armadas se están transformando en una organización más eficiente y robusta."

 BA_sensei_trinity_seminar: "Seminario táctico con Trinity"
 BA_sensei_trinity_seminar_desc: "El intercambio con la Academia Integral Trinity va más allá del simple entrenamiento militar, ofreciendo profundas reflexiones sobre estrategia y táctica. Los seminarios acompañados de té negro están inspirando a una nueva generación de comandantes."

 BA_sensei_redwinter_admin: "Apoyo administrativo de Red Winter"
 BA_sensei_redwinter_admin_desc: "Las apasionadas estudiantes de la Academia Federal Red Winter han introducido cambios revolucionarios en el sistema administrativo. Sus métodos audaces, aunque a veces caóticos, están contribuyendo al desarrollo nacional con una eficiencia sorprendente."

 BA_sensei_gehenna_discipline: "La disciplina de acero de Gehenna"
 BA_sensei_gehenna_discipline_desc: "El duro entrenamiento del Comité de Disciplina de la Academia Gehenna ha restaurado el orden militar y maximizado la capacidad de combate. Bajo una disciplina férrea, nuestro ejército ha renacido como una fuerza de élite que no teme a ningún enemigo."

 BA_sensei_hyakkiyako_order: "Orden urbano de Hyakkiyako"
 BA_sensei_hyakkiyako_order_desc: "Las estudiantes de la Academia Unificada Hyakkiyako han llevado vitalidad y orden a las calles a través de sus métodos únicos. Sus actividades, donde se entrelazan festivales y tradiciones, están ganándose el corazón del pueblo y estabilizando la sociedad."

 BA_sensei_shanhaijing_project: "Proyecto conjunto con Shanhaijing"
 BA_sensei_shanhaijing_project_desc: "La cooperación con la Escuela Secundaria Avanzada Shanhaijing ha fortalecido la base industrial del país. Su capacidad técnica y ética laboral han elevado nuestra productividad, convirtiéndose en un nuevo motor de crecimiento económico."

 BA_sensei_abydos_bonds: "Bonos de esperanza de Abydos"
 BA_sensei_abydos_bonds_desc: "Una idea nacida de la desesperación de las estudiantes de la Academia Secundaria Abydos se ha convertido en un símbolo de esperanza para las finanzas nacionales. Bajo el lema «Si es con el Sensei», el pueblo participa voluntariamente en inversiones para el futuro."

 BA_sensei_gourmet_diplomacy: "Diplomacia gastronómica"
 BA_sensei_gourmet_diplomacy_desc: "La cocina del Departamento de Abastecimiento de Gehenna y del Club de Investigación Gastronómica ha trascendido la comida para convertirse en un arma diplomática. Sus platos excepcionales derriten incluso a los diplomáticos más exigentes y elevan el prestigio nacional."

 BA_sensei_cheerleader_training: "El ardiente apoyo de C&C"
 BA_sensei_cheerleader_training_desc: "El apoyo del equipo C&C de Millennium no es una simple animación. Su respaldo armado con tecnología de punta eleva la moral de las tropas hasta el límite y tiene el poder de cambiar el curso del campo de batalla."

 BA_sensei_valkyrie_training: "Entrenamiento conjunto con Valkyrie"
 BA_sensei_valkyrie_training_desc: "El entrenamiento conjunto con la Academia de Policía Valkyrie ha elevado nuestras capacidades de aplicación de la ley a un nuevo nivel. Gracias a ejercicios cercanos al combate real, nuestras fuerzas pueden responder con calma ante cualquier crisis."

 BA_sensei_pandemonium_support: "El «apoyo» de Pandemonium"
 BA_sensei_pandemonium_support_desc: "El respaldo de la Sociedad Pandemonium de Gehenna puede ser extremo, pero es el método más seguro para alcanzar resultados. Su contundente capacidad de acción impone la voluntad del Estado y amplifica nuestra voz en la escena internacional."

 BA_sensei_festival_management: "Comité de gestión de festivales"
 BA_sensei_festival_management_desc: "Con la incorporación del Comité Matsuri de Hyakkiyako, cada festival nacional se ha convertido en una obra de arte. Su planificación impecable une al pueblo y devuelve vitalidad a la sociedad."

 BA_sensei_redwinter_guidance: "Guía popular de Red Winter"
 BA_sensei_redwinter_guidance_desc: "Las estudiantes de la Academia Federal Red Winter han encendido la chispa de la revolución en el corazón del pueblo. Su apasionada orientación despierta el anhelo de justicia social y fomenta la dedicación al país."

 BA_sensei_arius_governance: "Gobernanza al estilo Arius"
 BA_sensei_arius_governance_desc: "El método del Escuadrón Arius es peligroso, pero su eficacia es innegable. Su disposición a no escatimar medios para alcanzar objetivos se convierte, en ocasiones, en la forma más rápida de resolver problemas."

 BA_sensei_game_project: "Proyecto nacional de videojuegos"
 BA_sensei_game_project_desc: "El proyecto «Simulador del Sensei», desarrollado junto al Club de Desarrollo de Juegos de Millennium, trasciende el entretenimiento para convertirse en una poderosa herramienta de soft power. Será el mejor medio para mostrar nuestra grandeza al mundo."

 BA_sensei_abydos_prospecting: "Prospección de recursos al estilo Abydos"
 BA_sensei_abydos_prospecting_desc: "La intuición y perseverancia de las estudiantes de Abydos se han transformado en el arma más poderosa para descubrir recursos ocultos del país. Sus exploraciones, aparentemente temerarias, a menudo culminan en hallazgos milagrosos."

 BA_sensei_justice_task_force: "Apoyo del Departamento de Justicia"
 BA_sensei_justice_task_force_desc: "Con la incorporación del Departamento de Justicia de Trinity, la justicia en nuestra sociedad se ha vuelto aún más firme. Su sentido inquebrantable de lo justo erradica la corrupción y fortalece una sociedad donde todos son iguales ante la ley."

 BA_sensei_veritas_analysis: "Análisis de datos de Veritas"
 BA_sensei_veritas_analysis_desc: "La capacidad analítica de Veritas de Millennium se ha convertido en un pilar fundamental de la administración nacional. Sus predicciones precisas y profundas percepciones nos permiten tomar siempre las mejores decisiones."

 BA_sensei_gsc_audit: "Auditoría del Consejo Estudiantil General"
 BA_sensei_gsc_audit_desc: "Las auditorías periódicas del Consejo Estudiantil General son dolorosas, pero impulsan al sistema nacional a evolucionar. El esfuerzo por cumplir con sus estrictos estándares mejora la transparencia y eficiencia administrativa."

 BA_sensei_millennium_deep_collab: "Cooperación avanzada con Millennium"
 BA_sensei_millennium_deep_collab_desc: "La colaboración con Millennium ha entrado en una nueva fase. La introducción de computación cuántica e inteligencia artificial está revolucionando todos los sectores industriales y científicos, acercándonos a una singularidad tecnológica."

 BA_sensei_srt_distrust: "Desconfianza de SRT"
 BA_sensei_srt_distrust_desc: "Nuestra postura cautelosa ha generado desconfianza en la Academia Especial SRT. Preocupados por nuestra falta de determinación, han comenzado a surgir sutiles grietas en la cooperación en materia de seguridad."

 BA_sensei_hyakkiyako_overreach: "La ambición desmedida de Hyakkiyako"
 BA_sensei_hyakkiyako_overreach_desc: "Los festivales de Hyakkiyako han ido demasiado lejos. El gasto excesivo y el despilfarro administrativo están lastrando las finanzas nacionales, mientras el cansancio se acumula entre la población."

 BA_sensei_gehenna_integration: "Integración total con Gehenna"
 BA_sensei_gehenna_integration_desc: "La integración completa con la Academia Gehenna ha otorgado al país un poder inmenso. Su capacidad de ejecución y fuerza de combate ahora nos pertenecen por completo, y ya no tememos a ninguna amenaza."

 BA_sensei_abydos_desperation: "La desesperación de Abydos"
 BA_sensei_abydos_desperation_desc: "El precio de ignorar la desesperada situación de las estudiantes de Abydos ha sido severo. Al quebrarse su esperanza, la moral del pueblo y la confianza en el Estado también se han derrumbado."
