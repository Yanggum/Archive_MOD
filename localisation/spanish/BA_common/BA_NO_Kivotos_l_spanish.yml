 POL_inter_com_8: "Organización de Cooperación Económica de Europa Oriental"
 POL_inter_com_9: "Expansión de la federación"

 BA_pol_event.1.t: "Concepto Entre Mares"
 BA_pol_event.1.d: "Para que Polonia resista la malvada invasión soviética, naturalmente necesitamos otros camaradas con intereses comunes. Haremos todo lo posible para que la alianza con esos países se forme lo antes posible."
 BA_pol_event.1.a: "Es una cuestión de supervivencia nacional."

 BA_pol_event.2.t: "Legado de la guerra"
 BA_pol_event.2.d: "Hemos defendido el país contra el imperialismo bolchevique, pero se necesita una preparación más amplia y rápida para impedir una segunda guerra."
 BA_pol_event.2.a: "Vivimos una era de crisis nacional."
 BA_pol_event.2_tt: "§gParte de la industria de los territorios occidentales se trasladó a la Polonia central:§!\n"
 BA_pol_event.2_tt_1: "§g\nNos hemos liberado del embargo:§!"
 BA_pol_event.2_tt_2: "§gLa movilización de guerra está en marcha:§!"

 BA_pol_event.3.t: "Conferencia de Gorki"
 BA_pol_event.3.d: "Con la caída de nuestras principales ciudades, el curso de la guerra se ha inclinado rápidamente del lado polaco. Ahora nuestras fuerzas combaten no solo contra Polonia, sino también contra el resurgimiento interno de los blancos feudales. Polonia lo sabe y, para terminar pronto la guerra, ha hecho una propuesta a nuestro gobierno. La propuesta liberaba Bielorrusia y la Ucrania occidental-central, y renunciaba a la influencia sobre los tres estados bálticos, debilitando enormemente nuestra fuerza en el oeste; en otras palabras, equivalía a reconocer nuestra derrota de facto."
 BA_pol_event.3.a: "Como hizo Lenin, también nosotros pensemos en el mañana."
 BA_pol_event.3.b: "¡El pueblo soviético luchará hasta el final y vencerá!"
 BA_pol_event.3_tt: "\nSin embargo, continuaremos la §Yguerra§! contra §Y@RSA [RSA.getname]§!."

 BA_pol_event.4.t: "Aceptación soviética"
 BA_pol_event.4.d: "La Unión Soviética ha aceptado nuestra propuesta, y la patria y la alianza han podido traer una vez más la paz a Europa Oriental y al mundo."
 BA_pol_event.4.a: "¡Viva Polonia!"

 POL_win_of_intermarium_tt_1: "\n@POL §Y[POL.getname]§!: §YRegión oriental§! §Grecuperada§!"
 POL_win_of_intermarium_tt_2: "\n@ROM §Y[ROM.getname]§!: §YRegión oriental§! §Gexpandida§!"
 POL_win_of_intermarium_tt_3: "\n@ROM §Y[ROM.getname]§!: §YBesarábia§! §Grecuperada§!"
 POL_win_of_intermarium_tt_4: "\n@POL §Y[POL.getname]§!: §YMoldavia§! §Ggobierno establecido§!"
 POL_win_of_intermarium_tt_5: "\n@UKR §Y[UKR.getname]§!: §YTerritorio occidental§!, §Yterritorio central§! §Grecuperados§!"
 POL_win_of_intermarium_tt_6: "\n@LIT @LAT @EST §YBáltico§!: §YTodo el territorio§! §Grecuperado§!"
 POL_win_of_intermarium_tt_7: "\n@FIN §Y[FIN.getname]§!: §Y[SMI.getname]§!, §Y[KAR.getname]§! §Ggobiernos autónomos establecidos§!"
 POL_win_of_intermarium_tt_8: "\n@TUR §Y[FIN.getname]§!, @PER §Y[PER.getname]§!: §YTranscaucasia§! §Ggobiernos establecidos§!"
 POL_win_of_intermarium_tt_9: "\n@TUR §Y[FIN.getname]§!: §YGeorgia§!, §YArmenia§! §Ggobiernos establecidos§!"
 POL_win_of_intermarium_tt_10: "\n@PER §Y[PER.getname]§!: §YAzerbaiyán§! §Ggobierno establecido§!"
 POL_win_of_intermarium_tt_11: "\n@PER §Y[PER.getname]§!: §Y[TMS.getname]§! §Ggobierno establecido§!"
 POL_win_of_intermarium_tt_12: "\n@ROM §Y[ROM.getname]§!, @TUR §Y[TUR.getname]§!: §Y[CRI.getname]§! §GLiberado y neutralizado§!"
 POL_win_of_intermarium_tt_13: "\n@BLR §Y[BLR.getname]§!: §YTerritorio occidental§! §Grecuperado§!"

 BA_pol_event.5.t: "Rechazo soviético"
 BA_pol_event.5.d: "A pesar del curso ya decidido de la guerra, la Unión Soviética ha optado por continuar la resistencia."
 BA_pol_event.5.a: "¡Qué necios!"

 BA_pol_event.6.t: "Conferencia de Gorki"
 BA_pol_event.6.d: "Con el éxito de la ofensiva punitiva contra [SOV.getname], ya no hay razón para mantener una guerra de desgaste. Aprovecharemos nuestra ventaja para arrancar a la Unión Soviética los territorios de Europa Oriental y otras cosas necesarias, y dedicarnos a asuntos más importantes."
 BA_pol_event.6.a: "La guerra también es diplomacia."

 BA_pol_event.7.t: "Plan de la Fortaleza del Este de Intermarium"
 BA_pol_event.7.d_1: "El Ministerio de Asuntos Exteriores de [POL.getname] nos ha solicitado cooperación para construir una fortaleza conjunta en el este contra el imperialismo bolchevique."
 BA_pol_event.7.d_2: "Construiremos una fortaleza conjunta en el este contra el imperialismo bolchevique."
 BA_pol_event.7.a: "Más vale prevenir que lamentar."
 BA_pol_event.7.b: "Es innecesario."

 BA_pol_event.8.t: "Fin de la guerra soviético-polaca"
 BA_pol_event.8.d: "A primera hora de la mañana, los ministerios de Exteriores de Polonia y la Unión Soviética emitieron una declaración conjunta. Esta incluye, entre otras cosas, el cese de hostilidades y la independencia de parte de los estados miembros de la federación. En la práctica, esto equivale a que la Unión Soviética reconoce su derrota, y Polonia ha obtenido con firmeza la compensación por sus dos derrotas pasadas."
 BA_pol_event.8.a: "¡Es nuestra victoria!"
 BA_pol_event.8.b: "Solo es un pequeño retroceso."
 BA_pol_event.8.c: "La Unión Soviética está en peligro."

 BA_pol_event.9.t: "La situación de Polonia"
 BA_pol_event.9.d: " “¿Qué nos ha dejado la guerra?”\n\n El movimiento Sanacja, que ha dirigido la República de Polonia durante los últimos diez años, atraviesa tiempos sombríos desde la muerte de nuestro líder Piłsudski. Las derrotas tanto en el oeste como en el este han sembrado en toda la sociedad una sensación generalizada de vacío y derrotismo.\n\n Pero no es eso lo único que nos queda. Nuestro líder Piłsudski nos legó una gran política exterior: “Międzymorze”. Aunque nuestros pasos anteriores —hegemónicos y militaristas— se convirtieron en un obstáculo para construir una alianza que atravesara los mares, la invasión ilegal soviética, que se mantuvo hasta hace apenas unos días, se ha convertido en una gran amenaza para todos los estados soberanos de Europa Oriental. ¡Ante una sólida formación de estados independientes unidos, podremos resistir la ofensiva bolchevique!"
 BA_pol_event.9.a: "¡Polonia no se doblega!"
 BA_pol_event.9.b: "Intentemos una resistencia miserable."

 BA_pol_event.10.t: "Exigencia de ingreso en la federación de [POL.getName]"

 BA_pol_event.11.t: "Fortificaciones construidas"
 BA_pol_event.11.d: "Gracias a la cooperación, hemos podido establecer rápidamente la línea defensiva."
 BA_pol_event.11.a: "Bien."
 BA_pol_event.11_tt: "De los aliados, §Y[?POL.POL_bunker_var]§! país(es) participaron en la construcción de fortificaciones, levantándose §G[?POL_bunker_num_var]§! nivel(es) de §Yfortaleza§!.\n\n"
 BA_pol_event.11_tt_1: "De los aliados, §Y[?POL.POL_bunker_var]§! país(es) participaron en la construcción de fortificaciones, levantándose §G[?POL_bunker_num_var]§! nivel(es) de §Yfortaleza§!.\n\n"
 BA_pol_event.11_tt_2: "De los aliados, §Y[?POL.POL_bunker_var]§! país(es) participaron en la construcción de fortificaciones, levantándose §G[?POL_bunker_num_var]§! nivel(es) de §Yfortaleza§!.\n\n"

 BA_pol_event.12.t: "Prometeísmo"
 BA_pol_event.12.d: "El “Prometeísmo”, un plan político iniciado desde 1918 por Józef Piłsudski de la Segunda República de Polonia, tenía como objetivo debilitar a [SOV.getadjective] apoyando movimientos nacionalistas de independencia entre los principales pueblos no rusos que viven dentro de las fronteras de [SOV.getadjective]. Ahora que la guerra con [SOV.getadjective] ha estallado, gracias a esta campaña podemos llevar a cabo la guerra con mayor eficacia."
 BA_pol_event.12.a: "¡Derroquemos a Rusia!"

 BA_pol_event.13.t: "Entrenamiento invernal de Międzymorze"
 BA_pol_event.13.d: "Bajo el liderazgo del ejército de nuestro firme aliado [FIN.getname], los países aliados de Międzymorze han aprendido a superar el frío."
 BA_pol_event.13.a: "Que el invierno nos ayude."

 BA_pol_event.14.t: "Inversión de [FROM.getname] en la industria naval [NOR.getadjective]"
 BA_pol_event.14.d: "El gobierno [POL.getadjective] ha invertido en nuestra industria naval para enfrentar la amenaza que se avecina."
 BA_pol_event.14.a: "Es sensato."

 BA_pol_event.15.t: "Suministro de madera sueca"
 BA_pol_event.15.d: "El gobierno [SWE.getadjective] ha decidido suministrar madera barata a todos los aliados de [POL.getfactionname]."
 BA_pol_event.15.a: "¡La cooperación nos vuelve más fuertes!"

 BA_pol_event.16.t: "Asociación con VEF"
 BA_pol_event.16.d: "VEF, la industria electrónica de nuestro firme aliado [LAT.getname], ha aceptado apoyar con equipos de ingeniería a toda la alianza."
 BA_pol_event.16.a: "Gracias."

 BA_pol_event.17.t: "Industria textil [LIT.getadjective]"
 BA_pol_event.17.d: "Las empresas textiles de [LIT.getadjective] están produciendo uniformes a bajo costo para la alianza."
 BA_pol_event.17.a: "Bien."

 BA_pol_event.18.t: "Apoyo de extracción de aceite de esquisto por parte de [FROM.GetAdjective]"
 BA_pol_event.18.d: "Desde que el primer aceite de esquisto se produjo por primera vez en la patria en 1921, y hasta que en 1924 se utilizó la primera electricidad hecha con aceite de esquisto en la red eléctrica, muchos no consideraban el aceite de esquisto un recurso importante. Sin embargo, al contrario de la indecisión de los escépticos, en 1937 logramos extraer un millón de toneladas de esquisto bituminoso en un solo año. Impulsado por estos logros, nuestro aliado [FROM.getname] ha decidido aportar más capital a nuestras empresas de extracción de esquisto para prepararse para la guerra con [SOV.getadjective]."
 BA_pol_event.18.a: "¡Gracias!"
 BA_pol_event.20.t: "El destino de Alemania Oriental"
 BA_pol_event.20.d: "Debemos decidir el destino de Alemania Oriental, incluida Berlín."
 BA_pol_event.20.a: "Devolvámosla a la Wehrmacht."
 BA_pol_event.20.b: "Convirtamos a Trinity en un estado títere."
 BA_pol_event.20.c: "¡Polonia se anexionará Alemania Oriental!"
 BA_pol_event.20.e: "Devolvámosla a Prusia."

 BA_pol_event.21.t: "El destino de Memel"
 BA_pol_event.21.d: "Debemos decidir el destino de Memel, que fue el territorio más oriental del antiguo Imperio Alemán."
 BA_pol_event.21.a: "Devolvámoslo a Lituania."
 BA_pol_event.21.b: "¡Polonia se lo anexionará!"

 BA_pol_event.22.t: "El destino de Königsberg"
 BA_pol_event.22.d: "Debemos decidir el futuro destino de Königsberg, cuna de Prusia."
 BA_pol_event.22.a: "Envía a todas las estudiantes del territorio ocupado por la Transferencia y reorganízalo como un estado autónomo."
 BA_pol_event.22.b: "Devolvámoslo a la Wehrmacht."
 BA_pol_event.22.c: "Separar Prusia Oriental de Alemania y convertirla en un estado títere."
 BA_pol_event.22.g: "Déselo a Prusia."
 BA_pol_event.22.f: "Devolvámoslo a Trinity."
 BA_pol_event.22.e: "¡Königsberg es nuestro!"

 BA_pol_event.23.t: "El destino de [5.getName]"
 BA_pol_event.23.d: "Debemos decidir el destino de [5.getName]."
 BA_pol_event.23.a: "Déselo a Prusia."
 BA_pol_event.23.b: "Devolvámoslo a la Wehrmacht."
 BA_pol_event.23.c: "Déselo a Trinity."
 BA_pol_event.23.e: "¡Polonia se lo anexionará!"

 BA_pol_event.24.t: "El destino de Gdansk"
 BA_pol_event.24.d: "Hemos cobrado venganza por la humillación de que Gdansk fuera ocupada temporalmente por una fuerza de otro mundo llamada Arius. Ahora decidiremos el destino de Gdansk."
 BA_pol_event.24.a: "Restauremos el Escuadrón Arius."
 BA_pol_event.24.b: "Cedámosla a Prusia."
 BA_pol_event.24.c: "¡Gdansk es territorio polaco!"

 BA_pol_event.25.t: "[63.getname] y [68.getname]"
 BA_pol_event.25.d: "Debemos decidir el destino de [63.getname] y [68.getname]."
 BA_pol_event.25.a: "Déselos a Alemania Oriental."
 BA_pol_event.25.b: "Polonicemos esa región."

 BA_pol_event.26.t: "Territorios alemanes de población polaca"
 BA_pol_event.26.d: "Debemos decidir qué hacer con nuestros territorios occidentales recuperados como resultado de la Gran Guerra."
 BA_pol_event.26.a: "Déselos a Alemania Oriental."
 BA_pol_event.26.b: "¡Esas tierras pertenecen a Polonia!"

 BA_pol_event.27.t: "El destino de [66.getname]"
 BA_pol_event.27.d: "Debemos decidir el destino de [66.getname]."
 BA_pol_event.27.a: "Independicemos Silesia."
 BA_pol_event.27.c: "Déselo a Alemania Oriental."
 BA_pol_event.27.b: "Anexionémoslo a Polonia."

 BA_pol_event.28.t: "[67.getname]"
 BA_pol_event.28.d: "También debemos decidir el destino de [67.getname]."
 BA_pol_event.28.a: "Cédalo a Silesia."
 BA_pol_event.28.b: "Anexionémoslo."

 BA_pol_event.29.t: "El destino de Alemania Occidental"
 BA_pol_event.29.d: "Debemos decidir el destino de las tierras al oeste del río Weser."
 BA_pol_event.29.a: "Devolvámosla a la Wehrmacht."
 BA_pol_event.29.b: "¡Liberad a la Sociedad Pandemonium!"
 BA_pol_event.29.c: "Fragmentémosla en torno a Prusia."
 BA_pol_event.29.e: "Fragmentémosla por completo."

 BA_pol_event.30.t: "El destino del sur de Alemania"
 BA_pol_event.30.d: "Después de Alemania Occidental, debemos decidir el destino del sur de Alemania, incluida Baviera."
 BA_pol_event.30.a: "Entréguenselo a la Wehrmacht."
 BA_pol_event.30.b: "Cédalo a la Sociedad Pandemonium."
 BA_pol_event.30.c: "Independicemos Baviera."
 BA_pol_event.30.f: "Liberemos a la Oficina de Disciplina."

 BA_pol_event.31.t: "El destino de Holstein y Schleswig"
 BA_pol_event.31.d: "Debemos decidir el destino de Holstein y Schleswig."
 BA_pol_event.31.a: "Devolvámoslos a la Wehrmacht."
 BA_pol_event.31.b: "Cédalos al Consejo de Pandemonium."
 BA_pol_event.31.c: "Déselos a los países del Norte."
 BA_pol_event.31.e: "Déselos a Trinity."
 BA_pol_event.31.f: "Liberemos Schleswig-Holstein."
 BA_pol_event.31.g: "Hagamos que Prusia y los países del Norte se lo repartan."

 BA_pol_event.32.t: "El destino de Weser-Ems"
 BA_pol_event.32.d: "Al decidir el destino de Weser-Ems, concluiremos la partición de Alemania."
 BA_pol_event.32.a: "Déselo a la facción de Alemania Occidental."
 BA_pol_event.32.b: "Déselo a la facción de Alemania Oriental."

 BA_pol_event.33.t: "Nombre de [763.getname]"
 BA_pol_event.33.d: "[763.getname] fue una región extremadamente importante para los alemanes, al ser la cuna de Prusia. Sin embargo, mientras [763.getname] esté en nuestras manos, polonizaremos el topónimo de este lugar o, directamente, lo cambiaremos."
 BA_pol_event.33.a: "Respetemos a los alemanes y cambiemos solo a la pronunciación en polaco."
 BA_pol_event.33.b: "Honremos al líder de Sanacja, Piłsudski."
 BA_pol_event.33.c: "Usemos el nombre de Su Majestad el Rey."

 BA_pol_event.34.t: "El Gran Diluvio"
 BA_pol_event.34.d: "Ya vivimos el Gran Diluvio en el siglo XVII. Entonces fuimos derrotados, pero ahora es distinto. Cientos de miles de jóvenes, con el valor de Moisés para cruzar el diluvio, sirven rumbo a la victoria desde Polonia y nuestros aliados."
 BA_pol_event.34.a: "¡Cruza el Gran Diluvio!"

 BA_pol_event.35.t: "La canción de Intermarium"
 BA_pol_event.35.d: "Oh libertad que respirabas bajo un sol gris\nlevántate ahora, en nuestra tierra\n\nLa ambición de las potencias hegemónicas\nentre ellas, sobrevivimos\n\nEscucha el susurro de la ribera del Vístula\nescucha el eco de los Cárpatos\n\"Somos uno\", dicen\n\nLa torre del reloj de Kiev, la plaza de Minsk\nla plaza de Varsovia, las calles de Bucarest\ntodo late al mismo compás\n\nNo somos un rebaño de ovejas rodeado de lobos\nahora somos una manada, una sola fuerza\n\nEl juramento fraternal hecho con pan y sal\nnuestro sueño defendido con sangre y lágrimas\nIntermarium: en ese nombre nos erguimos\n\nHacemos girar la rueda de la historia\nya no somos un tablero de gigantes\nnuestro destino, con nuestras manos\n\nDel mar Báltico al mar Negro\nnuestra canción resuena"
 BA_pol_event.35.a: "\"¡Que Intermarium, libre y fuerte, sea eterno!\""

 BA_pol_event.36.t: "Propuesta de adhesión a Intermarium de [FROM.GetAdjective]"
 BA_pol_event.36.d: "[FROM.GetAdjective] declaró la Federación de Intermarium y, al mismo tiempo, nos propuso federarnos."
 BA_pol_event.36.a: "¡Por supuesto! ¡Somos uno!"
 BA_pol_event.36.b: "Nuestro futuro está en otro lugar."

 BA_pol_event.37.t: "Rechazo de [FROM.GetName]"
 BA_pol_event.37.d: "[FROM.GetName] rechazó nuestra propuesta."
 BA_pol_event.37.a: "Los comprendemos."

 BA_pol_event.38.t: "¡[FROM.getName] aprobó la federación!"
 BA_pol_event.38.d: "¡[FROM.GetName] ha decidido unirse a nuestra federación!"
 BA_pol_event.38.a: "¡Bien!"

 BA_pol_event.39.t: "El destino de Renania"
 BA_pol_event.39.d: "Debemos decidir el destino de la región del Rin."
 BA_pol_event.39.a: "Déselo a Alemania Occidental."
 BA_pol_event.39.b: "Independicémosla."

 BA_pol_event.40.t: "El destino de Wurtemberg"
 BA_pol_event.40.d: "Debemos decidir el destino del suroeste de Alemania."
 BA_pol_event.40.a: "Déselo a Alemania Occidental."
 BA_pol_event.40.b: "Cédalo al sur de Alemania."
 BA_pol_event.40.c: "Independicémosla."
 BA_pol_event.40.e: "Formemos el sur de Alemania junto con Baviera."

 BA_pol_event.41.t: "El destino de Mecklemburgo y Turingia"
 BA_pol_event.41.d: "Decidiremos el destino de las regiones alemanas restantes."
 BA_pol_event.41.a: "Liberémoslas."
 BA_pol_event.41.b: "Convirtámoslas en principados de Prusia."
 BA_pol_event.41.c: "Anexionémoslas a Prusia."

 BA_pol_event.42.t: "Cuerpo de Voluntarios de la Polonia Libre"
 BA_pol_event.42.d: "En las regiones orientales arrebatadas a Polonia tras la segunda ofensiva occidental soviética, operan milicias nacionalistas polacas. Cuando estalle la guerra soviético-polaca, se alzarán para ayudar a Polonia."
 BA_pol_event.42.a: "¡Por Polonia!"
 BA_pol_event.42.b: "Es una conspiración hegemonista."

 BA_pol_event.43.t: "Voluntarios bielorrusos"
 BA_pol_event.43.d: "En partes de Bielorrusia existen organizaciones clandestinas anticomunistas basadas en el nacionalismo. Cuando estalle una guerra entre Polonia y los soviéticos, se alzarán para ayudar a Polonia."
 BA_pol_event.43.a: "¡Por los camaradas bielorrusos!"
 BA_pol_event.43.b: "Perros de los capitalistas."

 BA_generic_event.14.t: "Ejército Nacional de Ucrania"
 BA_generic_event.14.d: "En el oeste de Ucrania existen milicias nacionalistas pro-polacas. Cuando estalle una guerra entre Polonia y los soviéticos, se alzarán para ayudar a Polonia."
 BA_generic_event.14.a: "¡Por los camaradas ucranianos!"
 BA_generic_event.14.b: "Es un acto antisocialista."

 BA_pol_event.44.t: "Alzamiento de las milicias nacionalistas antisoviéticas"
 BA_pol_event.44.d: "Organizaciones armadas clandestinas apoyadas por el gobierno de [POL.getname] se han alzado al compás de nuestro avance y se han unido a nuestras filas."
 BA_pol_event.44.a: "Gracias."

 BA_pol_event.46.t: "Declaración de Leópolis"
 BA_pol_event.46.d: "'Confirmamos una vez más que el bolchevismo es una ideología antilibertad que oprime y explota al pueblo, y proponemos la creación del Comité de Liberación Popular Ruso para la desbolchevización de las tierras rusas. Este comité no se disolverá hasta cumplir su propósito...'"
 BA_pol_event.46.d_1: "'Confirmamos una vez más que el gobierno de [SOV.getname] es un gobierno antilibertad que oprime y explota al pueblo, y proponemos la creación de [RSA.getname] para la liberación de toda Rusia. Este comité no se disolverá hasta cumplir su propósito...'"
 BA_pol_event.46.a: "¡Aplastémoslos!"
 BA_pol_event.46.b: "Nuestros territorios ocupados son valiosos."

