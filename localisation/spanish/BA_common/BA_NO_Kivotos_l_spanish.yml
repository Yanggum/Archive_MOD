 GEM_maginot_line_french_army: "Ejército francés en la Línea Maginot"
 GEM_maginot_line_french_army_tt: "Se elimina si no se controla la Línea Maginot:\n No se controla el estado §Y[28.getName]§!\n No se controla el estado §Y[1053.getName]§!\nIndependencia de [FRM.getName] si la capitulación es alta:\n Capitula a §Y25%§! o más"

 FRM_event.1.t: "Los fantasmas de Maginot"
 FRM_event.1.d: "Con la sombra de la guerra total cubriendo a nuestra patria y los soldados del frente principal desangrándose día tras día, llegó un informe que nadie esperaba. En la Línea Maginot —antiguamente francesa, pero ahora bajo nuestro control— se detectaron movimientos extraños. Se cortaron las comunicaciones con las fuerzas guarnecidas, y un destacamento de reconocimiento enviado de urgencia vio cómo las torretas de aquel colosal fuerte giraban para apuntarnos.\n\nSobre la fortaleza, la tricolor francesa, que creíamos desaparecida, ondeaba de nuevo. Los restos del 'Segundo Ejército Francés', atrapados dentro y sobreviviendo como podían, no se derrumbaron ante el hambre y la desesperación: tomaron el control total de la fortaleza. Ya no son supervivientes indefensos; se autodenominan 'Ejército de Liberación de Maginot' y han surgido como una nueva fuerza hostil, respaldada por una fortaleza de acero.\n\nCon nuestro frente deteriorándose, estos fantasmas del pasado han encontrado su oportunidad para mostrarse. En el momento en que el frente principal se viene abajo, ¿cómo debemos lidiar con esta fortaleza fuera de control?"
 FRM_event.1.a: "Por ahora, déjalos. Concéntrate en el frente principal."
 FRM_event.1.b: "¡Hay que eliminar la amenaza en la retaguardia!"

 #Rumania (ROM) — nota: en los strings originales aparece 'Alemania' pero el texto habla de Italia; mantengo 'Italia' como está en el coreano.
 BA_ROM_trade_treaty_with_germany: "Tratado comercial con Italia"
 BA_ROM_trade_treaty_with_germany_desc: "Somos conscientes del interés económico que Italia tiene en nuestro país. A medida que aumenten las entregas de bienes como el petróleo, podremos solicitar el apoyo de Italia para modernizar nuestro ejército."
 BA_ROM_invite_german_advisors: "Invitar a asesores italianos"
 BA_ROM_invite_german_advisors_desc: "La ayuda italiana es esencial para modernizar nuestro ejército. Ellos poseen el saber hacer de las tecnologías que necesitamos; debemos recibir su apoyo a través de un cuerpo de asesores."
 BA_ROM_invite_german_advisors_tt: "Italia obtiene derecho de paso militar en Rumania."
 BA_ROM_license_german_equipment: "Licencias de equipo italiano"
 BA_ROM_license_german_equipment_desc: "El equipo italiano es superior al nuestro, pero podremos producir estas armas bajo licencia."
 BA_ROM_join_axis: "Unirse al Eje"
 BA_ROM_join_axis_desc: "Ha llegado el momento de estar junto al Eje. Junto a Italia, podremos forjar el gran futuro de Rumania."
 BA_ROM_german_romanian_oil_exploitation_company: "Compañía italo-rumana de perforación petrolera"
 BA_ROM_german_romanian_oil_exploitation_company_desc: "La demanda italiana de petróleo es enorme y nos ofrece una oportunidad rentable para expandir nuestras refinerías."
 BA_ROM_demand_transnistria: "Exigir Transnistria"
 BA_ROM_demand_transnistria_desc: "Ahora somos fuertes y contamos con el respaldo del prestigio italiano. Para construir la Gran Rumania, ha llegado la hora de exigir Transnistria."
 BA_ROM_split_czechoslovakia: "Asegurar Eslovaquia"
 BA_ROM_split_czechoslovakia_desc: "Eslovaquia fue creada con una estructura antinatural, incapaz de sobrevivir por sí sola. No podemos permitir que esto desemboque en caos; debemos intervenir antes de que la situación se vuelva inmanejable."

