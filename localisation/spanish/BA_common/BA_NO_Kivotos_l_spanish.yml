 CSA_eugene_talmadge: "Eugene Talmadge"
 CSA_absolutly_dixie: "Sudista anti-federal"
 CSA_eugene_talmadge_desc: "Desde que el Sur se partió en dos y Richmond cayó, aún no han pasado ni 100 años desde que el orgulloso Sur fue ocupado por los viles opresores del Norte. La persistente crisis económica de Estados Unidos y la opresión y persecución contra el Sur han hecho que los sureños recuerden una vez más el espíritu de la Confederación; como resultado, los estados del Sur decidieron separarse de la Unión y resolvieron independizarse. Y, al igual que Jefferson Davis, Talmadge de Georgia asumió la presidencia de los Estados Confederados. Esto fue posible únicamente porque jamás olvidó los valores del Sur.\n\nNacido en el estado de Georgia, Eugene Talmadge creció como hijo de un campesino pobre; tras pasar por la abogacía y una revista especializada en agricultura, entró en la política. Con su lenguaje áspero y discursos incendiarios conquistó a los agricultores y a los blancos de clase baja, y siempre clamó por un Sur auténtico sin interferencia del gobierno federal. Incluso en el sufrimiento de la Gran Depresión, se opuso ferozmente al New Deal, al que llamó “las cadenas de Washington que oprimen la libertad”; en su lugar, defendió el fortalecimiento del poder del gobierno estatal y la protección de los agricultores sureños. En una situación cada vez más deteriorada, los campesinos del Sur sienten que solo Talmadge es el portavoz que representa sus intereses.\n\nEl gobierno de Talmadge se caracteriza por enfatizar la tradición sureña y negar la autoridad del gobierno federal, al tiempo que adopta un nacionalismo extremo y un populismo económico. Con el fervoroso apoyo de su base de sureños blancos, Talmadge hará todo lo posible para que la amarga historia no se repita."

