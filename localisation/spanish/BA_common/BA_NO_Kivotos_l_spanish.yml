 #동아프리카 
 ENG_eastern_african_unification: "Anhelo de la unificación de África Oriental"
 ENG_eastern_african_unification_desc: "El concepto de una Comunidad de África Oriental unificada ha salido a la luz. Muchos intelectuales sostienen que se necesita una comunidad para la cooperación conjunta en alimentación, industria, economía y seguridad en África Oriental."
 ENG_EA_economy: "Economía integrada de África Oriental"
 
 #이집트
 EGY_Binah: "La bestia del desierto"
 EGY_Binah_desc: "Hasta ahora se creía que la invasión de estos seres desconocidos se limitaba únicamente a Europa. Sin embargo, últimamente persisten los rumores de que una criatura desconocida ha aparecido en el desierto de Egipto. Las autoridades han restringido el acceso al desierto y están registrándolo para confirmar la veracidad del rumor."

 #소련
  #국민정신
 BA_SOV_toward_warsaw: "Marcha hacia Varsovia"
 BA_SOV_toward_warsaw_tt: "Este §Yespíritu nacional§! se §Grefuerza§! hasta un máximo de §Y3§! veces cada §Y240 días§!."
 BA_SOV_support_kriegsmarine: "Apoyo a la Kriegsmarine"
 BA_SOV_supporting_kriegsmarine: "Apoyo de la Flota Roja"
 BA_SOV_massive_isolation: "Aislamiento colosal"
 BA_SOV_massive_isolation_desc: "Europa se consumió y desapareció en el gigantesco crisol de la Gran Guerra, y hasta el aire que respiraban nuestras máquinas se dispersó junto con las cenizas. Al otro lado del océano, los Estados Unidos nos apartaron la mano con un silencio helado.\n\nAhora, las fuerzas de Kivotos, representadas por el Consejo General Estudiantil, han abierto sus rutas comerciales a la “línea sanitaria” de Polonia y Rumanía, estrangulando el aliento de la Madre Rusia. En el norte, unos falsos profetas llamados Red Winter han invocado en las nieves de Noruega el espectro de Trotski. Allí ya solo queda una mezcla monstruosa de nueva izquierda y trotskismo, mostrando los dientes contra la patria.\n\nPero la estrella roja de la Federación arde más roja en la prueba. Para completar el Plan Quinquenal, romperemos este asfixiante bloqueo económico. ¡Bajo la bandera soviética, con la voluntad indomable del pueblo!"
  #의견 모디파이어
 BASOV_anti_kivotos_policies_good: "Políticas anti-Kivotos"
 BASOV_anti_kivotos_policies_bad: "Políticas anti-Kivotos"
  #중점
 SOVEX_armed_protest_on_baltic: "Demostración armada en el Báltico"
 SOVEX_armed_protest_on_baltic_desc: "Los pueblos de [LIT.getadjective], [LAT.getname] y [EST.getname] gimen bajo una oligarquía autoritaria. Para derribar la dictadura capitalista que los oprime y liberar a las masas trabajadoras, es necesario ensayar una operación de liberación contra ellos."
 SOVEX_operation_on_black_sea: "Operación en el mar Negro"
 SOVEX_operation_on_black_sea_desc: "Las fuerzas navales de [ROM.getadjective] y [TUR.getadjective] amenazan nuestras rutas marítimas en el mar Negro. Debemos afirmar nuestra supremacía allí mediante desembarcos costeros a través del mar Negro."
 BA_SOV_armed_protest_modifier: "Plan ofensivo"
 SOVEX_Helsinki_secret_treaty: "Pacto secreto de Helsinki"
 SOVEX_Helsinki_secret_treaty_desc: ""
 SOVEX_overthrow_the_Holy_League: "Derrocar a la “Liga Santa”"
 SOVEX_overthrow_the_Holy_League_desc: "La “Liga Santa”, formada por los monarcas del Viejo Mundo para frenar la Revolución Francesa, está reorganizándose para aplastar de nuevo nuestra revolución. Ya no podemos tolerar las acciones contrarrevolucionarias de esos estados occidentales. ¡Debemos cortar la amenaza de raíz con un golpe preventivo!"
 SOVEX_eastern_bloc: "“Bloque del Este”"
 SOVEX_red_scandinavia: "Ofensiva del Norte"
 SOVEX_day_of_shame: "Día de la vergüenza"
 SOVEX_reduce_authority_of_secretariat: "Reducir la autoridad de la Secretaría"
 SOVEX_red_revenge: "Venganza roja"
 SOVEX_second_western_offensive: "Segunda ofensiva occidental"
 SOVEX_second_western_offensive_desc: "Con la caída de Varsovia, el desafío de Polonia ha llegado a su fin. A medida que se acelera el derrumbe de la hegemonía occidental, la llama de la revolución se enciende entre los pueblos de cada país. Ellos ya anhelan la llegada del Ejército Rojo. El gran camino hacia el Oeste se ha abierto, y el Ejército Rojo está listo para responder al llamado de la historia."

 SOVEX_anti_kivotos_policies: "Políticas anti-Kivotos"
 SOVEX_anti_kivotos_policies_desc: "No puede existir una convivencia pacífica con las academias de Kivotos. Debemos asegurar tantos aliados como sea posible y prepararnos para el choque inevitable."
 SOVEX_approach_milenium: "Acercamiento a Millennium"
 SOVEX_approach_milenium_desc: "No hay razón para no reconciliarnos con Millennium. Por supuesto, no podremos coexistir pacíficamente para siempre, pero ellos no nos atacarán primero."
 SOVEX_liberate_oppressed_nations: "Liberar a las naciones oprimidas"
 SOVEX_liberate_oppressed_nations_desc: "Las potencias occidentales han oprimido y explotado a innumerables pueblos por su propio interés imperialista. ¡Tras la Gran Transferencia, cuando sus metrópolis desaparecieron, eso se intensificó aún más! Debemos liberar a estos pueblos oprimidos y ayudarles a decidir su propio destino."
 SOVEX_partnership_with_kriegsmarine: "Presionar a la Kriegsmarine"
 SOVEX_partnership_with_kriegsmarine_desc: "Para operar con fluidez en el Báltico, la cooperación con [GEK.getadjective] es esencial. Si no podemos cooperar, al menos debemos impedir que actúen."
 SOVEX_partnership_with_kriegsmarine_tt: "\nEl gobierno de §Y[GEK.getname]§! establecerá una §Yadministración militar§! y, en lugar de precipitarse a recuperar la §Ymetrópoli§!, §Gvirará§! hacia una postura §Ypro-[SOV.getadjective]§! prudente y neutral."
 SOVEX_border_force_expansion: "Expandir las tropas fronterizas"
 SOVEX_border_force_expansion_desc: "Ahora que el silencio se posa sobre las ruinas de Inglaterra, Francia y Alemania, ya no hay motivo para dudar. Trasladaremos todas las fuerzas del Este al Oeste para lanzar al Ejército Rojo hacia Occidente. El peso de la historia exige este instante. Donde cayeron las viejas grandes potencias, debemos escribir una nueva página."
 SOVEX_subjugation_of_western_allies: "Someter a los Aliados Occidentales"
 SOVEX_subjugation_of_western_allies_desc: "Con el colapso del mercado europeo, los Aliados Occidentales han caído en una enorme crisis económica. Su poder se desmorona lentamente, pero nosotros permanecemos firmes. Ahora debemos presionarlos para que, mientras avanza nuestra ofensiva hacia el Oeste, no puedan volver a ser un estorbo."
 SOVEX_italy_strategic_alliance: "Alianza estratégica con [ITA.GetAdjective]"
 SOVEX_italy_strategic_alliance_desc: "[ITA.GetAdjective] es un aliado importante que comparte nuestra determinación incluso en el caos de Europa. Su posición estratégica y su capacidad de decisión serán un gran apoyo para el avance hacia el Oeste. Cooperaremos con [ITA.GetAdjective] para forjar un nuevo orden entre las ruinas de Occidente."
 SOVEX_operatsiya_operation: "Operación: Tormenta Roja"
 SOVEX_operatsiya_operation_desc: "¡Estepa!\n¡Vasta estepa!\nPor la estepa avanzan los héroes.\n¡Sí, héroes del Ejército Rojo!\n¡Nuestros caballos son veloces y nuestros tanques también!\n- Estepa"

 SOVEX_soviet_federation_declaration_of_national_humanism: "Declaración de la Unión Humana"
 SOVEX_soviet_federation_declaration_of_national_humanism_tt: "Este espíritu nacional hará que, si §Y[SOV.GetNameWithFlag]§! inicia la §YSegunda ofensiva occidental§!, temporalmente no podamos unirnos a ninguna guerra."
 SOVEX_soviet_federation_declaration_of_national_humanism_2: "Política de no intervención en Europa"
 SOVEX_soviet_federation_declaration_of_national_humanism_2_desc: "La propaganda soviética está influyendo fuertemente en nuestros ciudadanos, haciendo imposible que detengamos la ofensiva soviética."
 SOVEX_soviet_proposal: "Propuesta soviética"
 SOVEX_soviet_proposal_tt: "Este espíritu nacional, si §Y[SOV.GetNameWithFlag]§! inicia la §YSegunda ofensiva occidental§!, se convertirá en objetivos de guerra contra los principales países de Kivotos."
  #이벤트
 BA_sov_event.1.t: "Giro de la política exterior"
 BA_sov_event.1.d: "El fenómeno de la “Gran Transferencia” en Europa Occidental, la segunda guerra con Polonia y la caída de las potencias capitalistas de Europa Occidental nos han obligado a revisar y reescribir por completo nuestros planes exteriores tal como los concebíamos. El Partido Comunista y el Comisariado del Pueblo para Asuntos Exteriores están elaborando con urgencia nuevas tesis diplomáticas, que influirán enormemente en nuestra política exterior de cara al futuro."
 BA_sov_event.1.a: "Son tiempos inestables."
 BA_sov_event.1_tt: "§Y$SOV_anti_fascist_policies$§! enfoque §Rdesactivado§!\n§Y$SOV_approach_germany$§! enfoque §Rdesactivado§!\n§Y$SOV_send_military_advisors_to_spain$§! enfoque §Rdesactivado§!\n\n"
 BA_sov_event.3.t: "Acuerdo comercial [SOV.getadjective]-[MIL.getadjective]"
 BA_sov_event.3.d: "El embajador de [SOV.getadjective] contactó con nuestros diplomáticos y propuso un acuerdo comercial entre ambos países. Según la propuesta, [SOV.getname] nos enviaría materias primas como grano, algodón, petróleo, mineral metálico y caucho. A cambio, [SOV.getadjective] exigió de nosotros conocimientos adecuados de ciencia básica y tecnología de ingeniería.\nEste acuerdo sin duda ayudará en la guerra contra los estados hostiles de Kivotos."
 BA_sov_event.3.b: "¡No compartiremos nuestra tecnología con ellos!"
 BA_sov_event.4.t: "Firma de [MIL.getname] del $BA_sov_event.3.t$"
 BA_sov_event.4.d: "Un diplomático de [FROM.GetAdjective] nos informó que aceptarán nuestra propuesta. Ahora hemos firmado oficialmente un acuerdo comercial: [SOV.GetNameDef] enviará a [FROM.GetNameDef] grano, algodón, petróleo, mineral metálico y caucho. A cambio, nosotros recibiremos conocimientos de ciencia básica y tecnología de ingeniería.\nEste acuerdo ayudará sin duda al desarrollo de nuestra tecnología militar moderna."
 BA_sov_event.4.a: "Será útil para la patria."
 BA_sov_event.5.t: "Presión de la Flota Roja"
 BA_sov_event.5.d: "La Flota Roja de [SOV.getadjective] está bloqueando la costa oriental de Gotland y nos está suministrando material. No es agradable, pero podemos aprovechar su ayuda."
 BA_sov_event.5.a: "¡No es momento de fijarnos en el color del gato!"
 BA_sov_event.6.t: "Demostración de fuerza de [SOV.getadjective]"
 BA_sov_event.6.d: "Las fuerzas de [SOV.getname] están organizando con frecuencia demostraciones de fuerza en la región báltica. Estas acciones elevan la tensión en la zona y aumentan el riesgo de un choque militar entre [SOV.getadjective] y los estados del Báltico."
 BA_sov_event.6.a: "¡Intimídenlos!"
 BA_sov_event.6.b: "¡Resiste a la amenaza!"
 BA_sov_event.7.t: "Ejercicios navales de [SOV.getadjective]"
 BA_sov_event.7.d: "Las fuerzas de [SOV.getname] están organizando con frecuencia ejercicios militares en el mar Negro. Estas acciones elevan la tensión en la zona y aumentan el riesgo de un choque militar entre [SOV.getadjective] y los países del mar Negro."
 BA_sov_event.8.t: "Lecciones del campo de batalla"
 BA_sov_event.8.d: "A medida que la guerra continúa, hemos podido desarrollar con fluidez estrategias y tácticas contra [POL.getfactionname]. Ahora, basándonos en estas lecciones, podremos mejorar el entrenamiento militar y la preparación para el combate."
 BA_sov_event.8.a: "¡Centrémonos en mantener el frente!"
 BA_sov_event.8.b: "Se necesita una defensa móvil."
 BA_sov_event.9.a: "Iniciemos la operación en Oriente Medio."
 BA_sov_event.9.b: "Debemos aplastar a los rebeldes."
 BA_sov_event.10.a: "¡Aplasta el Báltico!"
 BA_sov_event.10.b: "¡Hacia el mar Negro!"

