 POL_inter_40: "Expandir el concepto Entre Mares"
 POL_inter_40_desc: "Al ganar la guerra contra [SOV.GetName], los lazos entre los países entre mares han aumentado como nunca. Para prevenir que [SOV.GetName] vuelva a clamar por la recuperación de territorios e invada a los estados independientes, desarrollaremos el concepto Entre Mares —es decir, Intermarium— y construiremos una federación unificada centrada en Polonia."

 POL_inter_41: "Incluir a las minorías"
 POL_inter_41_desc: ""
