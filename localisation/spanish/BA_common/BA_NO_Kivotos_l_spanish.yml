 #Italia — espíritu nacional
 ITA_AI_BONUS_TO_ETH: "§tÓrdenes del Alto Mando§!"
 BA_ITA_IDEA_FRA_CHIMGONG: "Sanciones de la Sociedad de Naciones"
 BA_ITA_IDEA_FRA_CHIMGONG_desc: "El Reino de Italia, el 15 de diciembre de 1935, atacó a la Tercera República Francesa —invadida por extranjeros— sin siquiera una declaración formal de guerra. La Sociedad de Naciones calificó este hecho como un 'acto de agresión evidente' y una 'traición a la humanidad', y el Reino de Italia quedó aislado en el mundo por las sanciones. Estas repercusiones no terminarán pronto."

 #Japón — espíritu nacional
 JAP_china_hater: "Expansionismo incontenible"
 JAP_china_hater_desc: "Los recursos del Imperio del Japón son escasos, pero el continente —y la República de China, que limita con nosotros— posee recursos e inmensa mano de obra, con el potencial de convertirse en una amenaza para nosotros.\n\nEl pueblo japonés quiere la guerra. Nuestro ejército no está listo, pero el ejército enemigo difícilmente puede llamarse ejército. Si golpeamos para causar conmoción, destrozamos sus fuerzas y terminamos la guerra con un avance rápido, podremos satisfacer al pueblo con los abundantes recursos y población del continente."
 BA_JAP_have_china_hater_TT: "(§Y@CHISeñores de la guerra§!) Beneficio de ataque contra ellos: §G+5.00%§!"
 BA_JAP_have_china_hater_2_TT: "(§Y@CHISeñores de la guerra§!) Penalización de defensa contra ellos: §R-5.00%§!"

 #China — espíritu nacional
 CHI_revange_of_Najing: "Guerra de resistencia"
 CHI_revange_of_Najing_desc: "La república ha sido herida. Japón, sin una declaración de guerra adecuada, irrumpió desde Pekín hasta Nankín a gran velocidad, arrebatándonos recursos cruciales y la vida de inocentes sin discriminación. Pero ese terror, en lugar de dividirnos, unió al pueblo: ha despertado nuestra determinación. Nuestro pueblo resistirá y resistirá… hasta el último aliento."

