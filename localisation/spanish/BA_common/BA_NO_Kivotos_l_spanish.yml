 #Ventana emergente
 POL_country_intro_header: "§9Una nación de júbilo e independencia§!"
 POL_country_intro_content: " No hace mucho que la bandera de Polonia ondea orgullosa en Varsovia. Polonia pasó largos siglos bajo las botas de otros países, y es una nación joven que obtuvo su independencia hace poco más de 30 años.\n\nComenzando a aparecer con fuerza en la historia hacia el siglo X, según el mito fundacional eslavo Polonia fue fundada por Lech, uno de los tres hermanos —Lech, Čech y Rus—, que marchó hacia el oeste. Con la conversión al catolicismo, el Reino de Polonia entró en la historia medieval; pese a sus periodos de esplendor, sufrió guerras con el Sacro Imperio Romano Germánico y la invasión del Imperio Mongol. Sin embargo, en el siglo XIV se reconfiguró como la unión dinástica polaco-lituana, se alzó como gran potencia y alcanzó su apogeo. Pero el águila de cola blanca, con el aleteo ya cansado, entró desde el siglo XVII en una era de crisis conocida como el Gran Diluvio, y finalmente padeció la humillación de ser repartida en tres por Prusia, Rusia y Austria. Después, mientras en Europa Occidental se agitaba sin descanso el torbellino de la historia, los polacos solo pudieron observar, divididos en tres fragmentos.\n\nAun así, el tiempo acabaría inclinándose a favor de Polonia. La Gran Guerra, que tiñó de sangre el inicio del siglo XX, llevó a Alemania a 'liberar' la Polonia rusa como un 'Reino Regente'; tras la rendición alemana surgió la 'Segunda República Polaca', que contuvo la ofensiva occidental soviética y, ocupando Lituania Central, creció como potencia media en Europa Oriental.\n\nLa política de la joven Polonia fue, en general, inestable. A diferencia de Occidente, que pudo concentrarse en la reconstrucción tras la Gran Guerra, Polonia quedó atrapada en guerras con la URSS, disputas territoriales con los estados vecinos y escaramuzas con milicias alemanas. Esa inestabilidad culminó en el golpe de Piłsudski en 1926, tras el cual el movimiento Sanacja, formado por Piłsudski y sus partidarios, terminó por dominar la política polaca hasta nuestros días.\n\nHacia noviembre de 1935, Polonia tuvo por primera vez en su historia que combatir contra seres que no eran humanos. Estas entidades, llamadas 'Kivotos', se transfirieron a la Tierra y atacaron los territorios occidentales de Polonia. El ejército polaco resistió, pero debido a la brecha tecnológica y de capacidades, se vio obligado a retroceder. Además, como consecuencia del caos originado en el oeste, estallaron pequeños choques militares en la frontera soviético-polaca, que pronto escalaron a guerra.\n\nEn la Segunda Guerra Soviético-Polaca, Polonia no pudo repetir el milagro de 1919. Pero la precaria condición del Ejército Rojo quedó expuesta en múltiples frentes, y la URSS ya no pudo seguir avanzando en territorio polaco. Así, mediante un acuerdo de paz firmado con rapidez, Polonia logró ganar un breve respiro… aunque también quedó claro que Polonia estaba cercada tanto al este como al oeste.\n\nEntre Rusia, que busca una tercera oportunidad, y Trinity, armada con tecnología futura, el destino de Polonia empieza a desplegarse.\n\n§YDesarrollador: AfterImage§!"
 POL_guide: "\n£white_dot Fortalece la capacidad de Polonia.\n£white_dot Recupera los territorios occidentales y orientales perdidos.\n£white_dot Reúne tantos aliados como sea posible para enfrentarte a la URSS.\n£white_dot Detén la guerra final de los invasores de otro mundo.\n\n\n§9¡Polonia volverá a levantarse!§!"

 SOV_country_intro_header: "La caída del imperio"
 SOV_country_intro_header_1: "Después de que el polvo se asiente"
 SOV_country_intro_header_2: "Lucha por el poder"
 SOV_country_intro_header_3: "La Segunda Guerra Soviético-Polaca y la Gran Purga"
 SOV_country_intro_content: "La humillante derrota en la Guerra Ruso-Japonesa y el Domingo Sangriento, cuando el pueblo le dio la espalda al zar, fueron la señal de partida que anunció la caída del gran imperio del Este.\n\nCuando dos disparos retumbaron en Sarajevo, Bosnia, y estalló la Gran Guerra, Rusia, gracias a un inesperado y rápido decreto de movilización general, logró al principio éxitos también inesperados. Pero no duraron. La derrota de Tannenberg expuso las debilidades del Imperio ruso, y la ofensiva de Brusílov terminó por derrumbar al ejército imperial. Con el colapso del ejército, las tropas alemanas ocuparon rápidamente el Báltico y avanzaron por Bielorrusia y Ucrania. Para detener el deterioro, Nicolás II asumió el mando personalmente, pero el efecto fue el contrario.\n\nEl 8 de marzo de 1917, la historia abrió un nuevo capítulo: los Románov, con 300 años de reinado, cayeron, y sobre sus ruinas nació una nueva república. Sin embargo, aquella república intentó continuar la guerra y no hizo más que repetir retiradas agotadoras. Vladímir Lenin y los bolcheviques no desperdiciaron la oportunidad y proclamaron la Revolución de Octubre."
 SOV_country_intro_content_1: "Cuando el polvo de la Guerra Civil rusa se asentó, sobre las tierras de lo que fue el Imperio ruso surgió la Unión de Repúblicas Socialistas Soviéticas, con un gobernante incontestable. Pero el precio de la guerra civil fue espantoso: diez millones de personas murieron, la producción de acero se desplomó y una sequía récord trajo consigo hambruna. Fue una situación desoladora. Lenin introdujo la Nueva Política Económica para reconstruir la economía y dedicó sus esfuerzos a la recuperación de posguerra.\n\nHerido de gravedad en un atentado fallido en 1918, Lenin quedó debilitado por las secuelas de las balas y el agotamiento acumulado; al no poder mantener una actividad normal, se fue alejando del centro del poder.\n\nEn 1924, Lenin murió finalmente a causa de esas secuelas, y dentro del Partido Comunista comenzó la confusión."
 SOV_country_intro_content_2: "Tras la muerte de Lenin, comenzó la lucha por el poder dentro del Partido. En particular, el enfrentamiento entre Stalin y Trotski fue feroz. Stalin se opuso a la teoría de la revolución permanente de Trotski con la tesis del socialismo en un solo país. Las ausencias reiteradas de Trotski en el Comité Central, junto con la ofensiva de la alianza Stalin-Zinóviev-Kámenev, lo expulsaron del centro del poder, empujándolo al exilio y dando paso al sistema de la 'troika'.\n\nPero, como muchos esperaban, la troika no duró demasiado. Cuando las relaciones entre Zinóviev-Kámenev y Stalin se agriaron, aquellos sacaron a relucir el tema de la democracia interna del partido —que Trotski había defendido— para atacar a Stalin. Por su parte, Bujarin, que sacudió al país con su célebre exhortación a 'enriquecerse', también criticó a Stalin, acusándolo de tomar a la ligera al capitalismo.\n\nLa alianza Zinóviev-Kámenev, incluso incorporando al Trotski exiliado, fue tildada nuevamente de faccionalista por el bloque Stalin-Bujarin y expulsada del Partido. Finalmente, Stalin logró también purgar a Bujarin, consolidándose como el único líder dentro del Partido."
 SOV_country_intro_content_3: "En noviembre de 1935, en el este de Europa se respiraba una tensión inestable. Tras la 'Gran Transferencia', la frontera entre Polonia y la Unión Soviética se había convertido en un polvorín. Las escaramuzas continuas derivaron, al fin, en una Segunda Guerra Soviético-Polaca que ninguna de las partes deseaba.\n\nEsta guerra inesperada fue un golpe para ambos bandos. Comenzó sin preparación, causó enormes bajas y, durante aproximadamente un mes, agotó recursos y fuerzas. En particular, la situación lamentable del Ejército Rojo quedó expuesta, y Stalin recibió un duro impacto.\n\nA raíz de ello, Stalin empezó a planear una purga masiva del alto mando militar y de los burócratas del gobierno. Esto desembocará en la mayor Gran Purga de la historia soviética.\n\nEl 1 de enero de 1936 ha comenzado un nuevo año, pero el cielo de Europa sigue oscuro. Mientras las heridas de la guerra soviético-polaca aún no cierran, la Gran Purga de Stalin está a punto de comenzar."
 SOV_guide: "\n[SOV.GetName]ㅣFacción central\n£white_dot Completa el Plan Quinquenal y consolídate plenamente como potencia industrial.\n£white_dot Purga a los enemigos de la federación que se esconden en el interior.\n£white_dot Libera Europa y construye el socialismo en un solo país.\n\n[SOV.GetName]ㅣOposición de derechas\n£white_dot Cuestiona la autoridad de Stalin y usurpa su puesto.\n£white_dot Culmina la Nueva Política Económica y afianza el salto a la industrialización.\n£white_dot Difunde ampliamente el marxismo revolucionario internacional.\n\n\n§t¡Proletarios de todos los países, uníos!§!"

