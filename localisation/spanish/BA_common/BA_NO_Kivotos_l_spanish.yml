 POL_inter_com_7: "Integración de la federación"
 POL_inter_com_7_tt: "Entre los §Ypaíses de los que se pueden obtener estados núcleo§!, obtenemos los §Yestados núcleo§! de los estados que poseamos de §Y[UKR.GetNameWithFlag]§! y §Y[BLR.GetNameWithFlag]§!, y reclamamos los que no poseamos.\n\n"

 POL_inter_com_9_tt: "De los §Yestados núcleo§! de los §Ypaíses de los que se pueden obtener estados núcleo§!, obtenemos los §Yestados núcleo§! de los estados que poseamos y reclamamos los que no poseamos.\n\n"

