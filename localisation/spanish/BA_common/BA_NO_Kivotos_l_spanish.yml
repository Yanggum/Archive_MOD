 FRM_alsace_lorraine_republic: "República del Consejo de Alsacia-Lorena"
 FRM_alsace_lorraine_republic_desc: "Una república efímera vuelve a aparecer ante el mundo. La derrota de Alemania y Francia llevó a la gente de Alsacia-Lorena a preocuparse por fundar su propia comunidad y por la autoprotección. El resultado es nuestra república, que hoy brilla con orgullo en Estrasburgo."
 FRM_stuck_in_double: "Entre dos gigantes"
 FRM_stuck_in_double_desc: "Alsacia y Lorena, tras la humillante ocupación de Gehenna, se enfrentan a un gran dilema. Para que el ejército francés venga a rescatarnos, esto queda demasiado lejos de África. Pero buscar la neutralidad tampoco sirve: casi no tenemos a quién llamar amigo. Debemos perseguir nuestra propia supervivencia."
 FRM_defeatism: "Derrotismo"
 FRM_defeatism_desc: "Nuestros oficiales y soldados, al ver cómo el enemigo de otro mundo arrasa sin piedad nuestra patria, se han contagiado de derrotismo."
 FRM_isolation: "Aislamiento"
 FRM_isolation_desc: "Resistimos aferrados a una fortaleza sombría. Debemos resolver el agotamiento de suministros y la caída constante de la moral."

