 RED_zenkyoutou_RIGHT_1_effect_tooltip: "Efectos al cambiar la línea organizativa actual a §YSociedad secreta clandestina§!:\n Cada mes aumenta la influencia de la §RFacción de base§!\n Coste de lucha: §G-15%§!\n Aumento de influencia: §R-15%§!"
 RED_zenkyoutou_RIGHT_2_effect_tooltip: "Efectos al cambiar la línea organizativa actual a §YVanguardia§!:\n Cada mes aumenta la influencia de la §SFacción central§!"
 RED_zenkyoutou_RIGHT_3_effect_tooltip: "Efectos al cambiar la línea organizativa actual a §YOrganización de masas§!:\n Cada mes aumenta la influencia de la §pFacción popular§!\n Coste de lucha: §R-15%§!\n Aumento de influencia: §G+15%§!"

 RED_zenkyoutou_CENTER_1_effect_tooltip: "Efectos al cambiar la lealtad actual de la organización a §YLealtad hacia Red Winter§!:\n Máximo de recuperación de capacidad organizativa de la Conferencia: §R-50§!\n\nModificadores de §YConferencia de Lucha Conjunta Interacadémica§!:\n Ganancia de poder político: §G+10%§!\n Velocidad de construcción: §G+10%§!\n Ganancia diaria de cumplimiento: §G+0.030%§!\n Tasa de incremento de fuerza de red de inteligencia: §G+10.00%§!"
 RED_zenkyoutou_CENTER_2_effect_tooltip: "Efectos al cambiar la lealtad actual de la organización a §YLa causa comunista§!:\n Máximo de recuperación de capacidad organizativa de la Conferencia: §R-30§!\n\nModificadores de §YConferencia de Lucha Conjunta Interacadémica§!:\n Velocidad de construcción: §G+5%§!\n Ganancia diaria de cumplimiento: §G+0.010%§!\n Tasa de incremento de fuerza de red de inteligencia: §G+5.00%§!"
 RED_zenkyoutou_CENTER_3_effect_tooltip: "Efectos al cambiar la lealtad actual de la organización a §YOrganización voluntaria§!:\nMáximo de recuperación de capacidad organizativa de la Conferencia: §R-10§!"
 
 RED_redwinter_leftwing_1_tooltip: ""
 RED_redwinter_leftwing_2_tooltip: "\n\nForma de lucha actual: §RTerror rojo§!\nEl §RTerror rojo§! inflige al §Ypaís objetivo§! un ligero §Ydaño industrial§! y un enorme daño a la §Yestabilidad§! y la §Yaprobación de guerra§!, consumiendo la propia organización §tConferencia de Lucha Conjunta Interacadémica§!. Cada vez que el terror tenga éxito, aumenta la §Yinfluencia§! de la §RFacción de base§!.\n\n"
 RED_redwinter_leftwing_3_tooltip: "\n\nForma de lucha actual: §SLucha de estudio ideológico§!\nLa §SLucha de estudio ideológico§! organiza §Yseminarios§! en el §Ypaís objetivo§! para dar a conocer la causa de la §tConferencia de Lucha Conjunta Interacadémica§!, aumentando la §Yinfluencia de la Conferencia§! y el §Yapoyo al comunismo§!. Cada vez que se organice un seminario, aumenta la §Yinfluencia§! de la §SFacción central§!.\n\n"
 RED_redwinter_leftwing_4_tooltip: "\n\nForma de lucha actual: §pTáctica del frente unido§!\nLa §pTáctica del frente unido§! intenta aliarse con los principales partidos para lograr los objetivos de la §tConferencia de Lucha Conjunta Interacadémica§!. Cada vez que el frente unido tenga éxito, aumenta la §Yinfluencia§! de la §pFacción popular§!.\n\n"
 RED_redwinter_leftwing_5_tooltip: "\n\nForma de lucha actual: §YOrganizar protestas masivas§!\n§YOrganizar protestas masivas§! consume la capacidad organizativa de la §tConferencia de Lucha Conjunta Interacadémica§! para organizar manifestaciones. El éxito de la protesta se determina en proporción a la §Yinfluencia de la Conferencia§! y al §Yapoyo al comunismo§!. Cada vez que una protesta masiva tenga éxito, aumenta en ese país el §Yapoyo al comunismo§! y la §Yinfluencia de la Conferencia§!.\n\n"
 RED_redwinter_leftwing_6_tooltip: "\n\nForma de lucha actual: §YProvocar huelgas§!\n§YProvocar huelgas§! consume la influencia de la §tConferencia de Lucha Conjunta Interacadémica§! para organizar huelgas. El tamaño de la huelga se determina en proporción a la §Yinfluencia de la Conferencia§! y al §Yapoyo al comunismo§!. Según el tamaño de la §Yhuelga§!, inflige al país objetivo una ligera §Ypenalización industrial§! y daño a la §Yestabilidad§!.\n\n"
 
 RED_redwinter_rightwing_1_tooltip: ""
 RED_redwinter_rightwing_2_tooltip: "\n\nLínea organizativa actual: §RSociedad secreta clandestina§!\nLa §RSociedad secreta clandestina§! hace que la organización §tConferencia de Lucha Conjunta Interacadémica§! actúe en secreto. Reduce el coste de la §Ylucha§!, pero el crecimiento de la §tinfluencia de la Conferencia§! se vuelve muy lento. Aumenta de forma continua la §Yinfluencia§! de la §RFacción de base§!.\n\n"
 RED_redwinter_rightwing_3_tooltip: "\n\nLínea organizativa actual: §RVanguardia§!\nLa §RVanguardia§! reestructura la organización §tConferencia de Lucha Conjunta Interacadémica§! en la forma de un partido de vanguardia dirigido por un pequeño número de figuras dirigentes. Aumenta de forma continua la §Yinfluencia§! de la §SFacción central§!.\n\n"
 RED_redwinter_rightwing_4_tooltip: "\n\nLínea organizativa actual: §pOrganización de masas§!\nLa §pOrganización de masas§! reestructura la organización §tConferencia de Lucha Conjunta Interacadémica§! en la forma de un partido de masas. La velocidad de crecimiento de la §tinfluencia de la Conferencia§! se vuelve muy rápida, pero aumenta el coste de la §Ylucha§!. Aumenta de forma continua la §Yinfluencia§! de la §pFacción popular§!.\n\n"

