 ABY_descision_category_german_terrorist_desc: "La última vez, logramos aniquilar de un solo golpe a la cúpula dirigente de los nacionalsocialistas austriacos.\n\nSin embargo, hemos recibido noticias de que los remanentes siguen activos y están llevando a cabo atentados terroristas aquí y allá. Aunque no sea como antes, por el hecho de que parecen actuar de forma organizada, si no logramos contenerlos antes de que el gobierno se estabilice, podría desarrollarse una situación extremadamente peligrosa. Al menos, hasta que las negociaciones concluyan, tendremos que reprimir sus actividades.\n\n§R¡Si su control llega al 100% antes de que se firme el acuerdo, no habrá vuelta atrás!§!"
