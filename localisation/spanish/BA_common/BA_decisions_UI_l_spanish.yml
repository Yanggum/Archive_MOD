 ABY_rebuild_high_school_desc:0 "La Preparatoria Abydos fue en el pasado una academia poderosa sin igual, pero tras su caída, la situación ha quedado en que apenas cinco personas la llevan adelante.\nMientras siempre sufrían de escasez de personal, tras el incidente del Gran Desplazamiento surgieron quienes quedaron atrapados aquí y no pudieron regresar a su academia original.\nSi aprovechamos a esas personas, será de gran ayuda para reconstruir la Preparatoria Abydos."
