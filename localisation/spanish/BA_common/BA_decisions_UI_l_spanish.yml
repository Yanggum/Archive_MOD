#########################
##########발키리###########
#########################
KSP_pokemon_archive: "Oficina Correccional Valkyrie"
KSP_pokemon_archive_desc: "La Oficina Correccional es una organización clave de Valkyrie dedicada a corregir las conductas desviadas de las estudiantes y guiarlas por el camino correcto. Acogemos a estudiantes con diversos antecedentes y problemas, apoyándolas para que puedan crecer como miembros \"sanos\" de la sociedad. Esto no se limita a un simple castigo disciplinario, sino que les ofrece la oportunidad de contribuir al poder de Valkyrie, permitiéndoles reflexionar sobre los errores cometidos y dar el primer paso para convertirse en estudiantes \"correctas\"."

KSP_pokemon_correct_ayumu: "Corrección de Iwabitsu Ayumu"
KSP_pokemon_correct_ayumu_desc: "La jefa de coordinación del Comité Administrativo del Consejo Estudiantil General era una de tantas personas que trabajaban en silencio dentro del Consejo Estudiantil General. Tras el Gran Desplazamiento, mientras el Consejo se desmoronaba y era arrastrado por el caos, ella terminó entrando voluntariamente en una celda de la Oficina Correccional. Si logramos convencerla de que hemos asumido el control del Consejo Estudiantil General, podremos encargarle la mediación de las relaciones entre el Reino de Bélgica y la Academia de Policía Valkyrie, las cuales han seguido siendo inestables desde la formación del gobierno de coalición."
KSP_pokemon_correct_ayumu_flag: "Corrección de Iwabitsu Ayumu completada"

KSP_pokemon_correct_nanagami_rin: "Corrección de Nanagami Rin"
KSP_pokemon_correct_nanagami_rin_desc: "Nanagami Rin, administradora en jefe, ha estado ejerciendo las funciones de presidenta del Consejo Estudiantil General desde la desaparición de la verdadera presidenta. Aunque actualmente ha sido despojada de todo poder y se encuentra recluida en la Oficina Correccional, permitirle trabajar en la Academia de Policía Valkyrie podría ser de gran ayuda para romper el caos que domina la situación política actual."
KSP_pokemon_correct_nanagami_rin_flag: "Corrección de Nanagami Rin completada"

KSP_pokemon_correct_aoi: "Corrección de Oki Aoi"
KSP_pokemon_correct_aoi_desc: "Oki Aoi, directora de finanzas, fue una principista sumamente competente durante la época en la que el Consejo Estudiantil General se mantenía sólido, y su esfuerzo quedó demostrado al evitar la declaración de moratoria inmediatamente después del Gran Desplazamiento. En un momento en el que la Academia de Policía Valkyrie se tambalea debido a una expansión que no se corresponde con su capacidad real, incorporarla y encargarle las finanzas resulta una propuesta extremadamente atractiva."
KSP_pokemon_correct_aoi_flag: "Corrección de Oki Aoi completada"

KSP_pokemon_correct_kaya: "Corrección de Shiranui Kaya"
KSP_pokemon_correct_kaya_desc: "Antes del Gran Desplazamiento, la Oficina de Defensa del Consejo Estudiantil General era tristemente célebre por sus constantes escándalos, cuya responsabilidad recaía, sin duda, sobre su directora, Shiranui Kaya. Sin embargo, también es cierto que gracias a su liderazgo el Consejo Estudiantil General logró, por poco, mantener el orden público de D.U inmediatamente después del desastre. Ahora que el control total del Consejo está en nuestras manos, ¿qué tal si le cedemos parte de la autoridad de seguridad de la Academia de Policía Valkyrie y le confiamos la defensa de un distrito bajo su jurisdicción? Por supuesto, será necesaria cierta corrección."
KSP_pokemon_correct_kaya_flag: "Corrección de Shiranui Kaya completada"

KSP_pokemon_correct_momoka: "Corrección de Yuraki Momoka"
KSP_pokemon_correct_momoka_desc: "La directora de tráfico es famosa tanto dentro del Consejo Estudiantil General como en la sociedad externa por ser una auténtica \"holgazana\". Es competente y sabe utilizar su elevada inteligencia de forma adecuada, pero al mismo tiempo tiende a sabotear su propia capacidad administrativa. Si logramos hacerle comprender la situación actual y la legitimidad de la misión de mantenimiento del orden de la Academia de Policía Valkyrie —a alguien a quien parece no importarle demasiado distinguir entre el bien y el mal—, ¿no se encargará al menos de regular el tráfico de D.U?"
KSP_pokemon_correct_momoka_flag: "Corrección de Yuraki Momoka completada"

KSP_pokemon_correct_srt: "Corrección de SRT"
KSP_pokemon_correct_srt_desc: "La Academia Especial SRT fue una fuerza armada directamente subordinada a la presidenta del Consejo Estudiantil General, involucrada en numerosos incidentes —incluidos los llamados \"casos sin resolver\"— de los que quizás ni siquiera nosotros tengamos pleno conocimiento. Tras responsabilizarse únicamente ante la presidenta y quedar prácticamente independiente del Consejo tras su desaparición, la institución aún cuenta con varios pelotones de fuerzas especiales con amplia experiencia. Darles trabajo no sería una mala idea, aunque requeriría medidas drásticas como una fusión forzada."

KSP_pokemon_correct_abydos: "Corrección de Abydos"
KSP_pokemon_correct_abydos_desc: "Lo que en tiempos pasados fue el mayor instituto de Kivotos cayó hasta el fondo del desierto. Cinco estudiantes que, antes del Gran Desplazamiento, lucharon desesperadamente para proteger su alma máter de los ataques de Kaiser Industries, han ingresado en la Oficina Correccional. Aceptaron cooperar con nosotros bajo la condición de que se garantice la autonomía del antiguo territorio de Abydos. Junto con las instalaciones industriales del antiguo territorio de Bohemia, los miembros del Comité de Medidas de Emergencia de Abydos, aunque pocos en número, poseen una experiencia incomparable y pueden resultar de gran ayuda."
KSP_pokemon_correct_gehenna: "Corrección del Comité de Disciplina"
KSP_pokemon_correct_gehenna_desc: "El Comité de Disciplina, una fuerza militar no oficial de la Academia Gehenna que había contribuido enormemente al mantenimiento del orden en el antiguo territorio del Estado Alemán, acabó tomando un camino distinto al nuestro y terminó convertido en prisionero de la Oficina Correccional. La jefa del comité probablemente sea más fuerte que cualquiera de la Academia de Policía Valkyrie, incluido el director de Seguridad Pública. Aunque su hostilidad hacia nosotros persiste, también representa un poder considerable. Deben convertirse en parte de nosotros; no sabemos si una política conciliadora funcionará, pero ¿no deberíamos al menos intentarlo?"

KSP_pokemon_correct_pandemonium: "Corrección de Pandemonium"
KSP_pokemon_correct_pandemonium_desc: "La Sociedad Pandemonium, conocida comúnmente como Manmajeon, era el consejo estudiantil de la Academia Gehenna y se encargaba de la diplomacia exterior, el presupuesto y la administración, hasta que conquistamos Gehenna. Bajo el liderazgo del presidente estudiantil Hanuma Makoto, famoso por una tasa de participación electoral del 3%, parecía gestionar con eficacia la vasta administración de Gehenna. Sin embargo, cualquiera que los conozca mínimamente coincide en que la especialidad de Manmajeon es la intriga política. Aunque su incorporación quizá no beneficie demasiado a la Academia de Policía Valkyrie, al menos sus unidades de carros de combate y artillería son fuerzas poderosas, y en eso sí tenemos un claro interés."

KSP_pokemon_correct_millenium: "Corrección de Millennium"
KSP_pokemon_correct_millenium_desc: "Millennium Science School era una academia colosal. Por encima de innumerables estudiantes llenas de sueños, un puñado de genios sin igual a lo largo del siglo controlaban el poder administrativo. No era la tecnología de Millennium lo que dictaba el rumbo de la academia, sino su genialidad. Tal vez incluso podían prever el futuro, pero parece que no anticiparon que pronto acabarían como reclusas de la Oficina Correccional. Sería un desperdicio imperdonable desaprovechar su talento. ¿No sería mejor quitarles las esposas e intentar una política conciliadora?"

KSP_pokemon_correct_white_ghost: "Corrección de Hyakkiyako"
KSP_pokemon_correct_white_ghost_desc: "Durante mucho tiempo, esta región fue un campo de batalla de innumerables sucursales escolares, pero bajo la mediación del Comité de Arbitraje de la Disputa Hakuhyouran, se unieron bajo el nombre de Hyakkiyako. Lograr la unificación de un territorio que parecía imposible de cohesionar por otros medios que no fueran la fuerza es un logro extraordinario y demuestra las capacidades de Hakuhyouran, del Departamento de Onmyō y de los distintos clubes de Hyakkiyako. Si al incorporarlos logramos siquiera estabilizar un poco el orden público de una región sumida en el caos por los mononoke, será una opción lo suficientemente atractiva."

KSP_pokemon_correct_chinese_mountain: "Corrección de Shanhaijing"
KSP_pokemon_correct_chinese_mountain_desc: "La Escuela Secundaria Avanzada Shanhaijing no puede presumir de un gran orden público, pero al menos su lealtad a la Puerta del Dragón Negro es sólida. Antes del Gran Desplazamiento, la Puerta del Dragón Negro y la Compañía del Guerrero Tortuga estuvieron al borde de una guerra civil por diferencias ideológicas, pero ahora, incluso al ser trasladadas a la misma celda, no provocan grandes conflictos. Tal vez ya hayan aceptado nuestro dominio. Este es el momento ideal para que reconozcan nuestra superioridad, y el precio de una política conciliadora no es tan alto."

KSP_pokemon_correct_redwinter: "Corrección de Red Winter"
KSP_pokemon_correct_redwinter_desc: "La Academia Federal Red Winter era el estado más democrático de Kivotos, con un liderazgo que cambiaba cada semana. Tras la rendición, al parecer la autoridad perpetua del director de Seguridad Pública iba a continuar, lo que provocó una huelga masiva del Departamento de Contratistas, una situación nada favorable para nosotros. Renka y Cherino, la ex presidenta del consejo estudiantil que también ostentaba simultáneamente los cargos de jefa de limpieza, secretaria general, jefa del club deportivo, jefa del club de limpieza, jefa del comité de disciplina y jefa del comedor, recibieron la promesa de dos pudines diarios en la Oficina Correccional y nos ofrecieron su consejo, así como su disposición a cooperar. Siguiendo su recomendación, preparamos una cantidad generosa de pudín sin diluir en agua para solicitar la cooperación del Departamento de Contratistas y de las estudiantes de Red Winter."

KSP_pokemon_correct_trinity: "Corrección de Trinity"
KSP_pokemon_correct_trinity_desc: "La Academia Integral Trinity ha sido reconocida como una de las tres grandes academias y parecía decidida a mantener su posición incluso después del Gran Desplazamiento. Tras provocar guerras y conflictos con los países vecinos, y enfrentarse incluso a la Academia de Policía Valkyrie, logramos derrotarlas por poco. Sin embargo, la mayoría de las estudiantes de Trinity aún no nos reconocen como el consejo estudiantil legítimo. Por suerte, conocemos un método para silenciar sus protestas. Solo harán falta tres personas."

KSP_pokemon_correct_arius: "Corrección de Arius"
KSP_pokemon_correct_arius_desc: "Resultó verdaderamente sorprendente que la Escuela Secundaria Arius, expulsada en el pasado por el Concilio de Nicea y abandonada tras ser utilizada y descartada en la guerra, reapareciera después del Gran Desplazamiento. Aunque anexionamos por la fuerza a Arius, que había formado tropas de élite alimentadas por su deseo de venganza contra Trinity, sabemos muy poco sobre ellas. Integrarlas en nuestro bando podría requerir un esfuerzo inimaginable, pero las recompensas posteriores están garantizadas."

KSP_annex_cou: "Incorporación del Consejo Estudiantil General"
KSP_annex_cou_decesion: "Decisión de incorporar el Consejo Estudiantil General"
KSP_annex_cou_decesion_desc: "Incorporamos el Consejo Estudiantil General a Valkyrie. Con ello, el territorio de Valkyrie se expande y el poder del Consejo Estudiantil General pasa a manos de Valkyrie."


