 TRN_internal_factions_categories: "Tea Party"
 TRN_internal_factions_categories_desc: "\n\n£GFX_decision_header_TRN_Teaparty\n\n\n\n\nLa cadena de sucesos ocurridos tras el Gran Desplazamiento fue más que suficiente para sacudir hasta la raíz los cimientos del triunvirato de Trinity. Cada facción dejó de ser un socio para la cogobernanza y se convirtió en un grupo de interés que se mueve por su propio beneficio. La confianza interna se derrumbó, y la sospecha y los recelos mutuos se muestran cada vez de forma más abierta. ¿Debemos tenderles la mano y llegar a un compromiso, o considerar su mera existencia una amenaza y eliminarlas? Las facciones se mueven según su propia lógica y sus propios pretextos, pero al final lo único que queda es una lucha por el poder y la supervivencia.\n"
 TRM_ui_loyalty_header: "Lealtad"
 TRM_ui_popularity_header: "Influencia"

 TRM_popularity_TOOLTIP: "La §YInfluencia§! representa hasta qué punto una facción tiene influencia dentro de la academia en este momento.\nA medida que aumenta la §YInfluencia§!, la influencia que la facción ejerce sobre la academia se vuelve cada vez mayor.\nAntes de disolver una facción, es necesario reducir su §YInfluencia§! a 0 mediante decisiones especiales."
 TRM_LOYALTY_TOOLTIP: "La §YLealtad§! representa el grado en que una facción está dispuesta a cooperar con el gobierno de la academia.\nCuanto mayor sea la §YLealtad§!, más efectos positivos obtendrá la facción para el gobierno de la academia. En caso contrario, recibirá efectos negativos.\nSi la §YLealtad§! cae a §R-50§! o menos, podrían emprender una lucha a gran escala contra el gobierno de la academia."

