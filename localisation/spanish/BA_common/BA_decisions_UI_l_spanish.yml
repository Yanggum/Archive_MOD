 RED_redwinter_progress_tt: "§tConferencia de Lucha Conjunta Interacadémica§!\n\n§RFacción de base§! ([?RED_redwinter_progress_LEFT_value]%)\n- La §RFacción de base§! es una facción de §Ytrabajadores intransigentes§! que impulsa sus objetivos principalmente mediante la §Ylucha§! y las §Yhuelgas§!.\n\n§SFacción central§! ([?RED_redwinter_progress_CENTER_value]%)\n- La §SFacción central§! es una facción que valora la §Ycooperación amplia§!, combinando una §Ylínea moderada§! con una §Ylínea de lucha§!.\n\n§pFacción popular§! ([?RED_redwinter_progress_RIGHT_value]%)\n- La §pFacción popular§! es una facción que actúa §Yuniéndose a los movimientos de masas§!, tomando como principales directrices la §Ypropaganda moderada§! y la §Yreforma§!.\n\nComo organización estudiantil revolucionaria nacida de la fusión del §Ractivismo revolucionario§! de Minori y la §tteoría revolucionaria intransigente§! del anarcosindicalismo, han heredado tal cual la §Yteoría revolucionaria activista§! que tenía la antigua División de Contratas, y están liderando protestas antigubernamentales impulsadas por socialistas en países de todo el mundo.\n\nEn la actualidad, tras el Gran Desplazamiento, las §Ycontradicciones sociales§! preexistentes en Kivotos están aflorando al extremo. La §tZenkyoutou§! es una organización semiautónoma compuesta por estudiantes revolucionarios de cada academia local de Kivotos, que actúan con el apoyo del §YComité Central de Red Winter§!.\n\nNo solo llevan a cabo §Yluchas de estudio ideológico§! dentro de la academia, sino que también apoyan a escala nacional el §Ymovimiento socialista revolucionario§! mediante §Yseminarios de conferencias ideológicas§!, participación en §treuniones obrero-campesinas§!, §tboicots académicos coordinados§!, §Rterror rojo§! y §Rexpansión de organizaciones clandestinas§!, exponiendo sin tapujos ante las masas la fealdad de las clases dominantes y las contradicciones sociales derivadas de ello en todas las academias de Kivotos."
 RED_redwinter_organizational_tt: "§tCapacidad organizativa de la Conferencia de Lucha Conjunta Interacadémica§! (actual: §Y[?RED_redwinter_organizational_value]§!)\n\nLa §Ycapacidad organizativa§! determina cuántas acciones puede llevar a cabo la §tConferencia de Lucha Conjunta Interacadémica§!. Usando §Ycapacidad organizativa§! puedes realizar más §Creestructuraciones organizativas§! u organizar una mayor cantidad de §Cluchas§!.\n\nLa §tcapacidad organizativa§! se §Crepondrá§! cada mes en §Y[?RED_redwinter_organizational_recovery_value]§! hasta un máximo de §Y[?RED_redwinter_organizational_recovery_max_value]§!. El aumento mensual lo determina la §Ylínea organizativa§!, y el máximo de recuperación variará según la §Ylealtad de la Conferencia§! y diversas decisiones.\n\nEl §Ymáximo de recuperación§! de la §tcapacidad organizativa§! estará actualmente §Rlimitado§! por la §Ylealtad de la Conferencia§! hasta §Y[?RED_redwinter_organizational_recovery_max_value]§!. El §Ymáximo básico de recuperación§! es §Y[?RED_redwinter_organizational_max_value]§!."
 RED_redwinter_left_wing_tt: "§YForma de lucha§!\n\nLa §Yforma de lucha§! dirige la línea principal de lucha de la organización §tConferencia de Lucha Conjunta Interacadémica§!. Según la §Ylínea de lucha§!, todas las §tConferencias§! actuarán bajo §Ynuestro§! mando.[RED_redwinter_leftwing_tooltip]"
 RED_redwinter_right_wing_tt: "§YLínea organizativa§!\n\nLa §YLínea organizativa§! determina cómo se estructura la organización §tConferencia de Lucha Conjunta Interacadémica§!. Según la §YLínea organizativa§!, las organizaciones §tConferencia§! dentro del alcance de §Ynuestra§! influencia se estructurarán de esa forma.[RED_redwinter_rightwing_tooltip]"

