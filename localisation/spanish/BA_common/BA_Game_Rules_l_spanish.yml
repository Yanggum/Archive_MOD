# Rutas nacionales
 GEI_AI_BEHAVIOR: "@GEI Gematria"
 RULE_OPTION_HISTORICAL_GEI_DESC: "La IA de Gematria elegirá su camino de forma completamente aleatoria."
 RULE_OPTION_COLOUR_PATH_COULOUR: "Cromática"
 RULE_OPTION_COLOUR_PATH_COULOUR_DESC: "\n\n§RRequisito:§!\nLa Cromática no debe estar desactivada."
 RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON: "Decagrammaton"
 RULE_OPTION_COLOUR_PATH_DEECAGRAMMATON_DESC: ""

 GEH_AI_BEHAVIOR:0 "@GEH Comité de Disciplina de Gehenna"
 RULE_OPTION_HISTORICAL_GEH_DESC:0 "La IA del Comité de Disciplina de Gehenna elegirá su camino de forma aleatoria."
 RULE_OPTION_GEH_AKO:0 "Asamblea del Comité de Disciplina – Victoria de §CAko§!"
 RULE_OPTION_GEH_HINA:0 "Asamblea del Comité de Disciplina – Victoria de los §Rfanáticos§!"
 RULE_OPTION_GEH_IORI:0 "Asamblea del Comité de Disciplina – Victoria de §OIo§!ri"
 RULE_OPTION_GEH_GENERIC:0 "Asamblea del Comité de Disciplina – §YEquilibrio§!"
 RULE_OPTION_GEH_AKO_DESC:0 "Tras la llegada al poder de §CAmaō Ako§! y el Departamento de Planificación, la IA seguirá una ruta de enfoques centrada en reformar el Comité de Disciplina como un Estado burocrático."
 RULE_OPTION_GEH_HINA_DESC:0 "El gobierno será tomado por fanáticos que veneran a §RSorasaki Hina§!, forzándola a asumir una dictadura férrea; la IA seguirá la ruta correspondiente."
 RULE_OPTION_GEH_IORI_DESC:0 "Tras la toma del poder por §OShiromi Iori§! y el Departamento de Ejecución, la IA seguirá una ruta destinada a transformar el Comité de Disciplina en un Estado militarista."
 RULE_OPTION_GEH_GENERIC_DESC:0 "Las disputas entre facciones desembocarán en un §Yempate§!, llevando a una política de §Ystatus quo§! sin reformas significativas."

 GEH_HINA_AI_BEHAVIOR:0 "@GEH Victoria de los fanáticos del Comité de Disciplina"
 RULE_OPTION_HISTORICAL_GEH_HINA_DESC:0 "La IA del Comité de Disciplina de Gehenna elegirá su camino de forma aleatoria.\n§RAdvertencia: los fanáticos deben tomar el poder.§!"
 RULE_OPTION_GEH_HINA_PUPPET: "$GEH_student_peoples_will$"
 RULE_OPTION_GEH_HINA_TERRIBLE: "$GEH_gehenna_leader$"
 RULE_OPTION_GEH_HINA_PUPPET_DESC:0 "Sorasaki Hina permanecerá como una líder simbólica y marioneta de los fanáticos.\n§RAdvertencia: los fanáticos deben tomar el poder.§!"
 RULE_OPTION_GEH_HINA_TERRIBLE_DESC:0 "Sorasaki Hina aceptará el poder absoluto como una autócrata de facto.\n§RAdvertencia: los fanáticos deben tomar el poder.§!"

 HEU_AI_BEHAVIOR:0 "@LUX Gran Ducado de Luxemburgo §g(Agencia 68)§!"
 RULE_OPTION_HISTORICAL_HEU_DESC:0 "La IA de Luxemburgo establecerá un gobierno revolucionario pro-Gehenna y se proclamará a sí misma como el nuevo Consejo Estudiantil General de Kivotos."
 RULE_OPTION_PRO_GEH_FASCISM:0 "£GFX_BA_game_rule_flag_HEU  Revolución del 68 – Agencia 68"
 RULE_OPTION_ANTI_GEH_FASCISM:0 "@LUX Luxemburgo independiente – Revolución del 68"
 RULE_OPTION_ANTI_GEH_FASCISM_DESC:0 "Luxemburgo seguirá su propio camino, romperá con la derecha y buscará unificar Alemania como líder de la Revolución del 68."
 RULE_OPTION_ANTI_GEH_COMMUNISM:0 "@LUX Luxemburgo independiente – Socialismo democrático"
 RULE_OPTION_ANTI_GEH_COMMUNISM_DESC:0 "Luxemburgo cooperará con el Partido Comunista para unificar Alemania."

 HEU_EYES_AI_BEHAVIOR:0 "@LUX Discapacidad visual de Rikuhachima Aru"
 RULE_OPTION_ARU_EYES_RANDOM_DESC:0 "Tras perder un ojo en una paliza colectiva por parte de nazis, los médicos de Luxemburgo solicitarán a Millennium la creación de una prótesis avanzada. La decisión de Millennium será completamente aleatoria.\n§RAdvertencia: Luxemburgo debe elegir la independencia anti-Gehenna.§!"
 RULE_OPTION_ARU_EYES_GOOD: "Aprobación de Millennium"
 RULE_OPTION_ARU_EYES_GOOD_DESC:0 "Millennium aceptará la solicitud y proporcionará la prótesis, permitiendo que Aru oculte su discapacidad.\n§RAdvertencia: Luxemburgo debe elegir la independencia anti-Gehenna.§!"
 RULE_OPTION_ARU_EYES_BAD: "Rechazo de Millennium"
 RULE_OPTION_ARU_EYES_BAD_DESC:0 "Millennium rechazará la solicitud. Aru usará una prótesis rudimentaria de tecnología de los años 30 y su retrato cambiará permanentemente.\n§RAdvertencia: Luxemburgo debe elegir la independencia anti-Gehenna.§!"

 EDEN_WAR_AI_BEHAVIOR:0 "@LUX @GEH @GEM @TRM Resultado de la Batalla Decisiva de Edén"
 RULE_OPTION_HISTORICAL_EDEN_DESC:0 "El vencedor de la Batalla de Edén es desconocido hasta que la guerra estalle."
 RULE_OPTION_EDEN_VICTORY_GEHENNA:0 "@LUX @GEH @GEM Victoria de Gehenna"
 RULE_OPTION_EDEN_VICTORY_GEHENNA_DESC:0 "Gehenna ganará inevitablemente la Batalla de Edén.\n§RAdvertencia: solo funciona en enfrentamientos entre IA.§!"
 RULE_OPTION_EDEN_VICTORY_TRINITY:0 "@TRM Victoria de Trinity"
 RULE_OPTION_EDEN_VICTORY_TRINITY_DESC:0 "Trinity ganará inevitablemente la Batalla de Edén.\n§RAdvertencia: solo funciona en enfrentamientos entre IA.§!"

 TRN_PATH: "@TRM El timonel de la patria"
 RULE_OPTION_TRN_PATH_RANDOM: "Predeterminado"
 RULE_OPTION_TRN_PATH_RANDOM_DESC: "El destino de Trinity sigue el acordeón que toca Dios. Cuando la melodía cambia, Trinity no puede sino moverse con ella, reescribiendo la historia de Kivotos."
 RULE_OPTION_TRN_PATH_PATER_SECT: "@TRM Misono Mika"
 RULE_OPTION_TRN_PATH_PATER_SECT_DESC: "Tras el Incidente de Yurizono Seia, Misono Mika obtuvo una victoria aplastante en la elección del Tea Party, convirtiéndose en anfitriona. Una nueva era para Trinity comienza en sus manos."
 RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR: "@TRM Misono Mika (alto honor)"
 RULE_OPTION_TRN_PATH_PATER_SECT_HIGH_HONOR_DESC: "Atrapada entre ideales y realidad, Mika encuentra su propia respuesta y decide servir a todo el pueblo, convirtiéndose en una auténtica líder."
 RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR: "@TRM Misono Mika (bajo honor)"
 RULE_OPTION_TRN_PATH_PATER_SECT_LOW_HONOR_DESC: "La brecha entre ideales y realidad corroe su corazón, y Mika termina convirtiéndose en una tirana destinada a destruirlo todo."
 RULE_OPTION_TRN_PATH_FILIUS_SECT: "@TRM Kirifuji Nagisa"
 RULE_OPTION_TRN_PATH_FILIUS_SECT_DESC: "Escribe aquí una descripción elegante y apropiada para la ruta de Kirifuji Nagisa."

