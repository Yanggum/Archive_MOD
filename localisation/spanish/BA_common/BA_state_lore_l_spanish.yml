 BA_SL_open_button_tt: "Ciudades y puntos de referencia de §Y[THIS.GetSLName]§!"

 SL_customname_Trinity_Heart: "El corazón de Trinity"
 state_lore_name.1: "Edén, la capital milenaria"
 state_lore_desc.1: "\nEl día en que se celebró el Primer Concilio, todas las facciones de Trinity se unificaron en una sola. Y para conmemorar ese momento se erigió una nueva ciudad: Edén. Esta ciudad, que tomó el nombre del Paraíso, pronto se consolidó como el centro de Trinity y durante siglos funcionó como refugio y muralla para las estudiantes. Incluso hoy, Edén es respetada como la ciudad clave de Trinity.\n\nPero el Gran Traslado también trajo una crisis a Edén. En el proceso de combate contra el ejército alemán se produjeron daños importantes. Muchos edificios quedaron destruidos y hubo heridos, aunque el ataque alemán terminó fracasando. Después, el centro urbano se restauró con rapidez, pero las cicatrices de la guerra aún permanecen aquí y allá.\n\nLa Edén actual, tras completar la reconstrucción, está recuperando de nuevo un aspecto estable. Aunque las heridas del pasado siguen presentes, la ciudad continúa cumpliendo su función como un bastión crucial de Trinity.\n"

 state_lore_name.2: "[Statelore_Get_gehenna_centre_name]"
 state_lore_desc.2: "\n[Statelore_Get_gehenna_centre_desc]\n"
 state_lore_name.2_normal: "El corazón de Gehenna"
 state_lore_desc.2_normal: "El distrito central de Gehenna escapó relativamente intacto de la devastación del Gran Traslado. Aunque las estudiantes de espíritu libre suelen causar problemas, por suerte la mayoría de esos incidentes ocurren lejos del distrito central.\n\nNo existen muchos registros del pasado de Gehenna, por lo que se desconoce desde cuándo se formó el distrito central, si fue una ciudad planificada o si nació de manera natural con el paso del tiempo. Aun así, sus edificaciones están construidas con notable precisión y resisten sin venirse abajo incluso ante los alborotos de las estudiantes de Gehenna.\n\nAquí se encuentran las sedes del Pandemonium Society y del Comité de Disciplina. Sin embargo, tras el Gran Traslado, el conflicto entre ambos bandos lo cambió todo. Cuando el Comité de Disciplina trasladó su base de poder hacia el distrito sur de Gehenna, la sede que una vez estuvo en el distrito central quedó medio abandonada y permanece allí, como un cascarón a medias dejado atrás."
 state_lore_name.2_TRN: "El segundo corazón de Trinity"
 state_lore_desc.2_TRN: "Tras la batalla decisiva de Edén, Gehenna se arrodilló ante Trinity y la bandera de la victoria ondeó en lo alto. Las construcciones al estilo de Gehenna fueron demolidas una tras otra, y en su lugar se alzan nuevas edificaciones levantadas con la estética propia de Trinity. La otrora imponente sede del Pandemonium Society fue destruida; ahora su forma solo puede verse en registros de video del pasado.\n\nHubo estudiantes de Gehenna que intentaron mantener la resistencia. Pero su voluntad fue quebrada una y otra vez por el Departamento de Justicia, las milicias compuestas por estudiantes de Trinity y los patrulleros. Bajo el nombre de “orden”, el cerco se fue cerrando hasta imponerles la obediencia.\n\nLas calles, que antes eran tierra de nadie, comenzaron a recuperar la seguridad, y las estudiantes de Trinity empezaron a asentarse también en el distrito central. El antiguo corazón de Gehenna fue borrándose poco a poco de la historia, y ese espacio está siendo repintado con el nombre de la Academia Trinity. Pronto, este lugar será llamado por un nuevo nombre.\n\nY en ese instante, el nombre de Gehenna se desvanecía en la memoria, mientras el futuro de las estudiantes se hundía cada vez más en la oscuridad bajo la autoridad de Trinity."

 state_lore_name.3: "Torre Millennium"
 state_lore_desc.3: "\nLa Torre Millennium fue construida desde el inicio bajo un plan meticuloso. Este edificio —y la ciudad que lo rodea—, condensación de la tecnología de Millennium, funcionaba sobre la base de una automatización total y durante un tiempo fue considerada el símbolo de la ciudad más avanzada.\n\nSin embargo, tras el Gran Traslado, la situación cambió. La energía que alimentaba la ciudad automatizada comenzó a agotarse, y los recursos de la Tierra eran ineficientes para sostener el sistema tecnológico de Kivotos. Al final, la gigantesca maquinaria que compone Millennium estuvo al borde de detenerse.\n\nEn ese periodo, la guerra contra Francia llegó como una prueba severa. Millennium tuvo que resistir incluso consumiendo sus reservas acumuladas, y sus ciudades sufrieron un golpe devastador.\n\nAun así, la Torre Millennium sigue operando. Aunque en una situación inestable en la que nadie sabe cuándo podría parar, la enorme ciudad continúa manteniendo su propio sistema y moviéndose por sí misma.\n"
  
 state_lore_name.4: "Torre Sanctum"
 state_lore_desc.4: "\nLa Torre Sanctum, erigida en la capital de Kivotos, no revela quién la construyó ni con qué propósito. Bajo control del Consejo Estudiantil General, la torre —tal como su nombre sugiere— gestionaba de forma automática las instalaciones públicas, la infraestructura social y las academias de todo Kivotos… o más bien, lo hacía “antes”. Antes de que el Consejo Estudiantil General perdiera el control de la Torre Sanctum.\n\nEl control de este misterioso edificio pertenece únicamente a la Presidenta del Consejo Estudiantil General. Aunque la Torre Sanctum administró la vida cotidiana de miles de academias, tras el Gran Traslado la capacidad de control del Consejo se volvió irrelevante y, al construir cada academia su propio sistema, parece poco probable que los secretos de esta torre se revelen pronto.\n\nA pesar de estar en el corazón del Distrito Especial Utnapishtim, los alrededores de la Torre Sanctum son sorprendentemente tranquilos: pocas personas entran o salen. Y cuando uno se planta frente a ella, una sensación de grandiosidad inexplicable llega incluso a abrumar.\n"
  
 state_lore_name.5: "Oficina de la Agencia"
 state_lore_desc.5: "\nLa oficina de la Agencia es el cuartel general de uno de los clubes principales de Kivotos, la “Agencia 68”. Antes del Gran Traslado, se encontraba en un edificio moderno. Pero tras el caos inmediato del Gran Traslado —cuando la antigua oficina quedó reducida a cenizas—, el actual despacho de la Agencia pasó a ser el Palacio Gran Ducal del Gran Ducado de Luxemburgo.\n\nEl Palacio Gran Ducal fue construido en el Renacimiento como ayuntamiento de la ciudad de Luxemburgo, pero en 1890 su uso cambió para convertirse en el nuevo palacio de la Casa Gran Ducal.\n\nLa hermosa oficina de estilo gótico del Palacio Gran Ducal se transformó en el despacho de la Agencia dirigido por Aru. El exterior apenas cambió respecto a su época como palacio, pero el interior está repleto de documentos secretos: tanto del trabajo corporativo de la Agencia 68 como de sus deberes como regente del Gran Ducado.\n\nLas áreas “de trabajo” del palacio fueron remodeladas como oficina, salas de recepción y similares. Sin embargo, las estancias privadas donde la familia gran ducal vivía su día a día no se usan en absoluto. Justo después del Gran Traslado, unos alborotadores de Gehenna que llegaron a saquear joyas asesinaron a tiros en el dormitorio a la Gran Duquesa Charlotte, a su consorte y a sus hijos, que ni siquiera habían cumplido diez años.\n\nAru guarda las urnas con los restos de la familia gran ducal en el antiguo dormitorio y, en su lugar, va y viene desde una estrecha pensión situada a quince minutos del palacio. Las zonas privadas —dormitorio, comedor y demás— solo se limpian a diario por orden de Riku-hachima Aru, y las empleadas de la Agencia 68 no las utilizan.\n\nLos cínicos se burlan diciendo que Aru teme al fantasma de la familia muerta y que por eso prefiere dormir hecha un ovillo en el sofá duro de una pensión antes que en la amplia cama del palacio. Pero quienes la conocen bien aseguran que solo mantiene esos espacios vacíos como gesto de respeto hacia la familia asesinada. Quizá la verdad nunca llegue a saberse.\n"

 state_lore_name.6: "[Statelore_Get_Abydos_highschool_name]"
 state_lore_desc.6: "[Statelore_Get_Abydos_highschool_desc]"
 state_lore_name.6_normal: "Ruina abandonada"
 state_lore_desc.6_normal: "\nDespués de que Abydos se retirara tras la invasión de Shanhaijing y Hyakkiyako, el edificio quedó como una casa vacía sin dueño. Ya no se filtraba ninguna luz tras las ventanas, y sobre los viejos muros solo pasaba el viento. Pero aun así, no quedó completamente abandonado: de manera periódica entraba una empresa de limpieza para sacudir el polvo y frotar los marcos.\n\nLa gente se preguntaba el motivo de ese mantenimiento. ¿Por qué mantener impecable una casa en la que no vive nadie? Sin embargo, después de que el Xuanlongmen emitiera un comunicado oficial diciendo: “No discutan ni hagan comentarios sobre ese asunto”, todos los rumores y curiosidades se desvanecieron.\n\nAsí, el edificio permanece en un rincón de la ciudad, arreglándose en silencio como si esperara el regreso de su dueño. Y su quietud se siente como un silencio que presagia unas pisadas que algún día volverán.\n"
 state_lore_name.6_abydos_own_state: "Campus principal de Abydos"
 state_lore_desc.6_abydos_own_state: "\nDespués de que Abydos recuperara su antigua tierra, quedaron sorprendidas: alguien había estado manteniendo el lugar de forma impecable, sin un solo detalle reprochable.\nDe hecho, las instalaciones deterioradas habían sido reparadas, y también estaban conectados el agua y la electricidad. Por eso, el gobierno de coalición decidió usar este sitio con un propósito distinto al original.\n\nTras decidir que la capital del gobierno de coalición sería Horn, el campus matriz de la Escuela Secundaria Abydos pasó oficialmente a ser el Segundo Anexo de Karlovy Vary. Este lugar, el Primer Anexo de la Escuela Secundaria Abydos, fue remodelado como anexo del Gobierno de Horn y se convirtió en el centro administrativo, político y de integración del gobierno de coalición.\n\nAunque en una dirección algo distinta, el edificio del instituto recuperó su vitalidad. A veces incluso se escuchan los lamentos de quienes hacen horas extra, pero el ambiente cálido y estable terminó por volver.\n\nY, de hecho, algunas zonas educativas restantes se convirtieron en espacios para cuidar y educar a los hijos de quienes residen allí, así que puede decirse que no ha perdido por completo su propósito original.\n"

 state_lore_name.7: "[86.GetCapitalVictoryPointName]"
 state_lore_desc.7: "\nBasis Schola era originalmente la ciudad polaca de Poznań: un lugar impregnado de historia y cultura desde la Edad Media. Pero ahora se ha transformado en una tierra donde se alza el cuartel general de los Caballeros Hospitalarios y donde se proyecta la sombra de Trinity.\n\nLa ocupación de Poznań por Trinity comenzó con la declaración de un oficial alemán capturado durante una operación de limpieza. Afirmó tajantemente: “Danzig y Poznań son territorios alemanes”, y Trinity utilizó esas palabras como pretexto para ocupar Poznań por la fuerza. La principal fuerza del ejército polaco estaba atada al frente soviético. La ciudad, abandonada, cayó sin siquiera poder librar una batalla real, y la resistencia se dispersó en escaramuzas menores. Así, Poznań fue arrebatada sin que se le permitiera ni siquiera el “lujo” de un gran sacrificio.\n\nTrinity no se presentó como conquistadora. En lugar de la coerción, aplicó una política moderada para atraer a los ciudadanos, y restauró la administración y el orden derrumbados. Como resultado, Poznań fue absorbida gradualmente por el sistema de gobierno de Trinity, y ahora la gente llama a esta ciudad Basis Schola.\n"

 state_lore_name.8: "[763.GetCapitalVictoryPointName]"
 state_lore_desc.8: "\nLa Gran Guerra separó a Königsberg de Alemania. Sin embargo, esta ciudad creció con el apoyo y la atención especiales del gobierno alemán, y con la llegada del régimen nazi incluso fue utilizada como prisión provisional para encerrar a opositores. Paradójicamente, ahora que el nazismo ha caído, son precisamente fuerzas nazis las que terminan confinadas allí.\n\nLa resistencia de Königsberg no fue feroz. Con el cerco y el bombardeo continuos, las defensas de la ciudad se derrumbaron con rapidez. Cuando el ejército alemán se rindió y el gobierno regional izó la bandera blanca, Trinity finalmente se apoderó por completo de esta tierra.\n\nPero el precio fue alto: Königsberg cargó con heridas profundas. La ciudad que una vez fue llamada la capital espiritual de los alemanes quedó destruida, y sobre esas huellas Trinity está escribiendo una nueva historia. Los proyectos de restauración no solo buscan revivir las ruinas, sino también borrar el nombre del pasado. Hoy, este lugar ya no se llama Königsberg. Trinity lo cubre con su propio nombre, Kimigiyama, abriendo una nueva era.\n"
  
 state_lore_name.9: "Vice City"
 state_lore_desc.9: "\nLa gloria rebosante de los años 30 ya quedó atrás. Aun así, Vice City sigue siendo la capital del placer, viviendo a la sombra del sol y el desenfreno de Francia. Esta ciudad, abrazando el encanto francés, su ajetreo y la codicia escondida en su interior, arroja historias interminables a quienes la visitan.\n\nEn Ocean Beach, hoteles decorados en tonos pastel presumen como si fueran museos, y la arena blanca brilla bajo el sol como si obligara a los ojos a deslumbrarse. En Little Cuba, el aroma tostado que sale de panaderías animadas seduce a la gente, pero su trasfondo es tan afilado como la mirada de un comerciante que solo persigue ganancias.\n\nEn el mercadillo de Tisha Waka, las marcas piratas reciben a los clientes con una expresión de “más auténticas que lo auténtico”, como si revelaran la esencia misma de esta ciudad. Y en el puerto de Vice City, llamado la capital mundial de los cruceros, las naves lujosas se alinean: de un lado presumen el romanticismo elegante de los viajes, y del otro exhiben sin pudor el peso del dinero.\n\nVice City sigue siendo brillante, sigue siendo ridícula y, al mismo tiempo, extrañamente amarga. Aquí, hasta el sol brilla con la misma intensidad que la billetera del turista.\n\n§O¡Vice City, baby!§!"

 state_lore_name.10: "[Statelore_Get_Abydos_homeschool_name]"
 state_lore_desc.10: "[Statelore_Get_Abydos_homeschool_desc]"
 state_lore_name.10_normal: "Una enorme duna de arena"
 state_lore_desc.10_normal: "\nEra una ciudad húngara histórica donde se unen afluentes del Danubio, pero tras el Gran Traslado quedó bajo la sombra de una montaña de arena colosal. A pesar de la tragedia de que la región noroeste quedara enterrada bajo la arena, la extracción de “Pyroxenos” y de reliquias antiguas que fluían desde la montaña atrajo a incontables aventureros y empresas, dando lugar a un desarrollo deformado. La ciudad mantiene un equilibrio precario donde conviven la amenaza de tormentas de arena y el sueño de hacerse rico de un golpe.\n\nEn los yacimientos, donde el control del gobierno no alcanza, los accidentes e incidentes no se detienen ni un solo día, pero la tentación del resplandor azul que escupe la montaña de arena sigue llamando sin descanso a la gente hacia esta ciudad peligrosa."
 state_lore_name.10_abydos_own_state: "Edificio principal de Abydos"
 state_lore_desc.10_abydos_own_state: "\nUna metrópolis futurista avanzada que se alza donde desapareció la montaña de arena, y la tierra sagrada (聖地) de la Federación de Abydos. En el nuevo distrito urbano del noroeste, desarrollado junto con la reconstrucción del edificio principal, se levantan rascacielos y una infraestructura de última generación que concentran el “sobre-tecnologismo” de Kivotos, convirtiéndose en una ciudad indiscutiblemente de élite al nivel más alto de la federación.\n\nCon el edificio principal de Abydos como núcleo, las funciones clave de la política, la economía y la tecnología se concentran aquí, cumpliendo en la práctica el papel de una segunda capital de la federación. El lugar donde antes la arena era sinónimo de desastre se ha transformado en símbolo de esperanza y prosperidad, y ahora es una gran ciudad vibrante a la que acuden peregrinos y quienes desean aprender tecnología de vanguardia.\n"
