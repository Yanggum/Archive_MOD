 l_spanish: 
 #공용 국가중점#
 BA_factoriesof_new_world:0 "Las fábricas del mundo"
 BA_factoriesof_new_world_desc:0 "Tras llegar a un mundo desconocido, lo que encontramos fueron innumerables fábricas. En comparación con las que utilizábamos, resultan muy atrasadas, pero son muchísimas y funcionan con una actividad sorprendentemente intensa."

 BA_a_lot_of_people:0 "Multitudes innumerables"
 BA_a_lot_of_people_desc:0 "En este lugar existe una cantidad de personas que jamás se vería en Kivotos. Podemos aprovechar esta población para responder al caos generado por esta situación anómala."

 BA_new_world_technology:0 "Tecnología del nuevo mundo"
 BA_new_world_technology_desc:0 "La tecnología desarrollada por la gente de este mundo es, en términos generales, inferior a la nuestra; sin embargo, en ciertos aspectos supera incluso a la de Kivotos. Sin duda, hay mucho que observar y aprender."

 BA_new_world_technology_army:0 "Nativos"
 BA_new_world_technology_army_desc:0 "A diferencia de la gente de Kivotos, los habitantes de este mundo no poseen halos y pueden morir con apenas uno o dos disparos. Por ello, su forma de operar ejércitos es extremadamente sistemática y se basa en el despliegue de enormes cantidades de personal."

 BA_new_world_technology_new:0 "Contramedidas tecnológicas"
 BA_new_world_technology_new_desc:0 "Los halos son resistentes al impacto físico, pero extremadamente vulnerables a ataques químicos y biológicos. Desarrollaremos contramedidas frente a estas amenazas y reforzaremos la capacidad defensiva de la infantería con halo."

 BA_new_world_technology_army1:0 "Doctrina militar"
 BA_new_world_technology_army1_desc:0 "Este mundo ha desarrollado doctrinas militares excepcionalmente avanzadas a través de una gran guerra mundial y numerosos conflictos de menor escala. Intentaremos estudiarlas e incorporarlas a nuestro propio sistema doctrinal."

 BA_new_world_technology_army2:0 "Operaciones militares a gran escala"
 BA_new_world_technology_army2_desc:0 "Aprendiendo de su forma de manejar ejércitos masivos, podremos reorganizar nuestro sistema militar de una manera aún más avanzada."

 BA_new_world_technology_halo:0 "Usos especiales del halo"
 BA_new_world_technology_halo_desc:0 "Las investigaciones continuas han demostrado que los halos pueden emplearse de formas muy diversas, lo que se traducirá en una expansión de las formaciones militares que los utilizan."

 BA_new_world_technology_halo_heavy:0 "Investigación de halos polivalentes"
 BA_new_world_technology_halo_heavy_desc:0 "La infantería con halo posee un potencial extremadamente amplio. Profundizaremos aún más en la tecnología del Misterio para llevar ese potencial al máximo."

 BA_horror_of_war:0 "El horror de la guerra"
 BA_horror_of_war_desc:0 "Emplearemos todos los medios posibles para utilizar nuestras fuerzas armadas con la máxima eficiencia, y no dudaremos en llevar a cabo operaciones militares a gran escala.\n\n§tFinalmente, nos hemos adaptado al nuevo mundo.§!"

 # Tooltips personalizados
 BA_factoriesof_new_world_tt:0 "Permite eliminar la ley comercial de §Yaislamiento§!."
 BA_add_division_template_s_tt:0 "§YNosotros§! obtendremos una §Yplantilla§! compuesta por §G4§! unidades de §Yinfantería§!."
 BA_add_division_template_m_tt:0 "§YNosotros§! obtendremos una §Yplantilla§! compuesta por §G10§! unidades de §Yinfantería§! y §G1§! §Ycompañía de apoyo de artillería§!."
