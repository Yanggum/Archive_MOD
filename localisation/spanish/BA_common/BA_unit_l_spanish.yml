 syemmata_railway_gun_equipment_desc: "Esta colosal arma, símbolo de la cooperación entre Gehenna y Abydos, posee un poder sin precedentes y una precisión extrema dentro de un radio de ataque de 500 km. Es un arma estratégica asimétrica perfecta que otorgará a nuestra nación una hegemonía abrumadora."

