#Equipamiento#
 kivotos_infantry_equipment: "Telar de Misterio"
 kivotos_infantry_equipment_short: "Telar de Misterio"

 kivotos_infantry_equipment_0:0 "Telar de Misterio incompleto"
 kivotos_infantry_equipment_0_short:0 "Telar de Misterio incompleto"

 kivotos_infantry_equipment_1:0 "Telar de Misterio"
 kivotos_infantry_equipment_1_short:0 "Telar de Misterio"

 kivotos_infantry_equipment_desc: "Un Telar de Misterio completamente desarrollado, creado para suplir la grave escasez de misterio tras la Gran Transposición de Kivotos a otro mundo."
 kivotos_infantry_equipment_0_desc: "Prototipo del Telar de Misterio. Aunque su rendimiento es inferior al previsto en la teoría, posee la capacidad de generar misterio."
 kivotos_infantry_equipment_1_desc: "Un Telar de Misterio completamente desarrollado para suplir la escasez de misterio tras la Gran Transposición. Fue desarrollado bajo el liderazgo de Shiraishi Utaha de Millennium y Yakushi Saya de Shanhaijing, y es conocido como el equipo que salvó a Kivotos de una derrota inminente."

 decagrammaton_equipment: "Componentes del Profeta"
 decagrammaton_equipment_0: "Componentes del Profeta"
 decagrammaton_equipment_desc: "Componentes utilizados en las enormes máquinas operadas por Decagrammaton. Estas colosales máquinas, conocidas como «Profetas», poseen un mecanismo de funcionamiento extremadamente singular."

 kivotos_dron_equipment: "Equipo de drones de Kivotos"
 kivotos_dron_equipment_0: "Equipo de drones de Kivotos"
 kivotos_dron_equipment_desc: "Equipo utilizado por los drones operados en Kivotos."

 ABYDOS_modern_infantry_equipment:0 "Equipo de infantería semi-moderno"
 ABYDOS_modern_infantry_equipment_desc:0 "Equipo de infantería inspirado en el armamento moderno de Kivotos, fabricado sustituyendo plásticos y resinas sintéticas por acero."

 juggernaut_equipment:0 "Equipo Juggernaut"
 juggernaut_equipment_0:0 "Equipo Juggernaut"
 juggernaut_equipment_desc:0 "Algunos países rechazaron los métodos inhumanos del halo artificial, como el reclutamiento forzado de estudiantes o contratos con límite de vida de cinco años. Como alternativa más ética, desarrollaron una infantería mística basada en exoesqueletos blindados: el traje Juggernaut. Aunque consume rápidamente las calorías del usuario y depende de su condición física, no presenta efectos adversos para la salud. En conjunto, ofrece una potencia similar a la infantería de halo artificial, pero con un coste de producción aproximadamente tres veces mayor, lo que dificulta su despliegue masivo."

 syemmata_railway_gun: "Cañón ferroviario clase Shemmata"
 syemmata_railway_gun_equipment: "Cañón ferroviario clase Shemmata"
