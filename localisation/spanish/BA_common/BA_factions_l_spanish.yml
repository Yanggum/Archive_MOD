 # A partir de aquí se encuentran los manifiestos de facción.

 pax_trinica_goal_name: "La paz bajo Trinity"
 pax_trinica_goal_desc: "El Gran Traslado expuso de forma inequívoca la incompetencia del Consejo Estudiantil General. Bajo el liderazgo de Misono Mika, la grande y justa Segunda Trinity es la única academia capaz de unificar a todo Kivotos."
 gehenna_supremacy_goal_name: "Supremacía de Gehenna"
 gehenna_supremacy_goal_desc: "Difundir el orden de Gehenna por todo Kivotos y unificarlo bajo su estandarte es el objetivo supremo de la Federación de Gehenna."
 protection_of_the_old_trinity_order_goal_name: "Guardianes de la tradición y el orden"
 protection_of_the_old_trinity_order_goal_desc: "Trinity y sus aliados sostienen que deben proteger las antiguas tradiciones heredadas desde antes del Gran Traslado, resistir la sumisión al orden de las naciones humanas y preservar la cultura y el pensamiento de Kivotos basados en la hermandad."
 pan_arabism_goal_name: "La unificación árabe"
 pan_arabism_goal_desc: "El pueblo árabe ha sido dividido durante demasiado tiempo por potencias extranjeras. ¡Ha llegado el momento de unirlos bajo una sola bandera!"
 gsc_supremacy_goal_name: "Control de Kivotos"
 gsc_supremacy_goal_desc: "El Consejo Estudiantil General debe asumir plenamente las responsabilidades y deberes que le corresponden por su nombre, y Kivotos está destinado a permanecer bajo su control, incluso si se contempla la absurda hipótesis de una guerra total."

 # Objetivos
 ## Objetivos iniciales
 one_trinity_goal_name: "Una sola Trinity"
 one_trinity_goal_desc: "Para romper con el legado incompleto del Primer Concilio, ha llegado el momento de integrar la Escuela Filial Arius. Este será el verdadero acto de unificación de Trinity y un día glorioso para todas sus estudiantes."

 ## Objetivos intermedios
 goal_TRN_defeat_gehenna_name: "Control de las ciudades de Gehenna"
 goal_TRN_defeat_gehenna_desc: "La mejor forma de debilitar la capacidad bélica de Gehenna es ocupar sus ciudades clave. Si tomamos los principales bastiones enemigos, especialmente los distritos Central y Sur, su voluntad de guerra se quebrará."
 goal_gehenna_defeat_trinity_name: "Control de los bastiones de Trinity"
 goal_gehenna_defeat_trinity_desc: "Los bastiones clave de Trinity son objetivos estratégicos ideales para la Federación de Gehenna. El principal objetivo es Edén, pero solo con la caída de todas las ciudades importantes a su alrededor la derrota de Trinity será definitiva."
 goal_GEH_TRM_defeat_gehenna_name: "Aplastar la ambición de Pandemonium"
 goal_GEH_TRM_defeat_gehenna_desc: "Tomar el Distrito Central de Gehenna y los bastiones circundantes, núcleos vitales de la Sociedad Pandemonium, es el objetivo más crucial de nuestro plan militar. No permitamos que la bandera de Pandemonium vuelva a ondear en estas tierras."
 goal_LUX_defeat_gehenna_name: "Control de las ciudades de Gehenna"
 goal_LUX_defeat_gehenna_desc: "Para establecer el Ducado Unido Germánico bajo liderazgo luxemburgués y garantizar la seguridad duradera de nuestros aliados, las ciudades clave de Gehenna deben ser ocupadas sin excepción. El objetivo principal es el Distrito Central, pero solo con la caída de todos los bastiones circundantes se confirmará la derrota total de Gehenna."

 ## Objetivos finales
 faction_goal_no_trinity_in_gehenna_name: "Integridad territorial de Gehenna"
 faction_goal_no_trinity_in_gehenna_desc: "Ahora que Gehenna se enfrenta a la maquinaria bélica de Trinity, debemos recuperar y preservar nuestro territorio frente a las embestidas de su marea implacable. Gehenna permanecerá unida y jamás volverá a sucumbir ante las ambiciones expansionistas de Trinity."
 COLLECTION_NO_TRINITY_IN_GEHENNA: "Estados del territorio central de Gehenna controlados por Trinity y sus aliados"
 faction_goal_true_eden_treaty_name: "Unidad frente a la ambición de Pandemonium"
 faction_goal_true_eden_treaty_desc: "Mientras la guerra entre Gehenna y Trinity se intensifica, la anfitriona del Tea Party estudia una gran estrategia: aislar geográficamente a Pandemonium mediante una alianza con el Comité de Disciplina, y atacar el Distrito Central de Gehenna desde los frentes sur y este."
