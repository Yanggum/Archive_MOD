l_spanish:

#Eventos y noticas
  BA_news.1.t:0 "La Presidenta General ha desaparecido"
  BA_news.1.desc:0 "Tras la Gran Guerra de 1935, Kivotos tuvo que soportar disturbios administrativos y revueltas. Ahora, dos meses después, la presidenta general ha desaparecido. Su desaparición fue confirmada cuando un oficial administrativo fue a entregar un informe diario; sin embargo, los directores de la Asociación General no anunciaron su ausencia sino hasta una semana después, causando una conmoción aún mayor.\n\nLa Jefa Administrativa Rin Nanagami anunció oficialmente la desaparición de la presidenta general y declaró que asumiría temporalmente sus funciones. Expertos predicen que los esfuerzos de la presidenta general para controlar las academias, emprendidos desde la Gran Guerra, se verán completamente anulados."
  BA_news.1.a:0 "No puede ser..."
  BA_news.1.b:0 "Confirmando órdenes."
  BA_news.1.c:0 "¿Qué dijiste?"
  BA_news.1.d:0 "Parece que reina el caos."

  BA_news.2.t:0 "¡El Consejo Estudiantil se fusiona con Schale!"
  BA_news.2.desc:0 "Hoy, recibimos la impactante noticia de que 'Schale', el club de investigación federal fundado bajo orden de la presidenta general, ha absorbido al Consejo Estudiantil. Por razones desconocidas, una superinteligencia artificial llamada 'Arona', guardada en la Caja de Sittim, fue activada y tomó control de Schale. Finalmente, incapaz de resistir la división y el colapso interno, el Consejo Estudiantil acordó fusionarse bajo el liderazgo de Arona. Durante la ceremonia de unificación, Arona operó únicamente a través de su voz, y Rin Nanagami anunció que 'Schale representará al Consejo Estudiantil a partir de ahora'."
  BA_news.2.a:0 "¡Misión cumplida!"
  BA_news.2.b:0 "Qué amenaza..."
  BA_news.2.c:0 "Esto es desconcertante."
  BA_news.2.d:0 "¿Sanctum qué?"

  BA_news.3.t:0 "Trinity envuelta en oscuridad"
  BA_news.3.desc:0 "Hoy llegó una noticia estremecedora. Misono Mika ha otorgado todos los poderes de Tea Party a la facción Pater, consolidando su dominio sobre Trinity. La noticia ha sacudido a todo Kivotos y crecen las voces preocupadas por el colapso de Trinity. Desde la Gran Guerra, las maquinaciones entre los 'Nacionalistas' y la facción Pater para hacer de Mika la anfitriona de Tea Party finalmente tuvieron éxito.\n\nMisono Mika, presidenta de Trinity, mostró abiertamente su voluntad de radicalizar Trinity, usando un lenguaje hostil hacia Gehenna. Actualmente, debido al control sobre el acceso y el ingreso a Trinity, se desconoce el estado interno de la academia."
  BA_news.3.a:0 "Un nuevo amanecer para Trinity."
  BA_news.3.b:0 "La oscuridad se cierne sobre nosotros."
  BA_news.3.c:0 "Debemos prepararnos."
  BA_news.3.d:0 "El velo ha sido levantado."

  BA_news.4.t:0 "Trinity inicia la guerra"
  BA_news.4.desc:0 "Tras una tensión interminable entre las academias, finalmente estalló la guerra. En la frontera entre Gehenna y Trinity, lugar de numerosos choques militares previos, Trinity lanzó un ataque sorpresa que desencadenó un conflicto a gran escala. Gehenna, inicialmente forzada a retroceder, está ahora reorganizando sus tropas para establecer una defensa sólida en la frontera.\n\nCon el estallido de la guerra entre los dos principales polvorines, toda la atención de Kivotos se centra en Gehenna y Trinity."
  BA_news.4.a:0 "¡Ataquen con todo!"
  BA_news.4.b:0 "¡Resistid!"
  BA_news.4.c:0 "Confirmado."

  BA_news.5.t:0 "La marcha triunfal de Trinity"
  BA_news.5.desc:0 "Ayer, pocos días después de la rendición de Gehenna, las tropas de Trinity celebraron una gran marcha de la victoria en el centro de Gehenna. El evento conmemoró su victoria decisiva y mostró su poderío militar, exhibiendo tanto el armamento más avanzado de Trinity como las armas capturadas de Gehenna.\n\nMisono Mika proclamó que esta era una victoria gloriosa, aunque algunos observadores expresaron su preocupación sobre el impacto de semejante ostentación en la estabilidad regional. Mientras se vigilan las reacciones de las fuerzas remanentes de Gehenna y otros actores, el mundo está atento a los próximos movimientos de Trinity."
  BA_news.5.a:0 "¡Larga vida a Trinity!"
  BA_news.5.b:0 "El fin de una larga enemistad."

  BA_news.6.t:0 "El gobierno británico huye a Canadá"
  BA_news.6.desc:0 "Tras su derrota en la guerra contra [KAI.GetName], el gobierno británico decidió exiliarse en Canadá. Esta noche, enormes aeronaves transportaron políticos británicos y a la familia real hacia el continente americano.\n\nAunque Londres cayó ante los invasores, la rápida retirada permitió preservar en parte tanto la familia real como las fuerzas armadas. Científicos de todo el mundo están analizando las causas de este fenómeno inusual."
  BA_news.6.a:0 "Regresaremos."
  BA_news.6.b:0 "Una gran victoria."
  BA_news.6.c:0 "Qué noticia tan impactante."
  BA_news.6.e:0 "Un presagio ominoso."

  BA_news.7.t:0 "Declaración de la Ley Federal"
  BA_news.7.desc:0 "Hoy por la mañana, [TRM.GetLeader] irrumpió en la calma matutina con un anuncio impactante. En un discurso oficial, reveló un plan para asimilar la Academia Gehenna a Trinity, con miras a la unificación de ambas instituciones. La noticia conmocionó a los estudiantes de Trinity y, tras el anuncio, multitud de alumnos salieron a las calles para protestar.\n\n  Aunque la Brigada de la Justicia logró dispersar las manifestaciones, el rechazo persiste. Expertos advierten que, tras la reciente guerra entre ambas academias, la política de asimilación enfrentará enormes obstáculos."

  BA_news.7.a:0 "Ya no existe 'Gehenna'."
  BA_news.7.b:0 "Un ejército que desea mezclar agua y aceite."

  BA_news.8.t:0 "Guerra Trinity-Soviética"
  BA_news.8.desc:0 "Hoy marca un punto de inflexión en la historia mundial. Las cadenas de noticias informan del avance del Ejército de Trinity hacia el territorio soviético, mientras los servicios de inteligencia se movilizan. En las grandes ciudades soviéticas, los jóvenes se alistan y el Ejército Rojo se prepara para enfrentar a las fuerzas de Trinity.\n\n  Expertos militares afirman que el desenlace es impredecible. Sea cual sea el resultado, esta guerra dejará una huella indeleble en la historia de la humanidad."

  BA_news.8.a:0 "¡Ataquen con todo!"
  BA_news.8.b:0 "Con perseverancia y labor venceremos cualquier obstáculo."
  BA_news.8.c:0 "El choque de los dos gigantes."

  BA_news.9.t:0 "Una sola Kivotos"
  BA_news.9.desc:0 "Hoy, desde el Tea Party de Trinity se proclamó oficialmente que Kivotos ha sido unificada bajo el liderazgo de Misono Mika. Millones de personas se congregaron en las calles de Edén, frente al edificio central de Trinity, saludando y ondeando su bandera.\n\n  Misono Mika fue investida como presidenta general de toda Kivotos, y en su discurso enfatizó la unión de Trinity y las academias. El momento culminante llegó cuando declaró la 'victoria final y total de Trinity'."

  BA_news.9.a:0 "Hoy alzó el estandarte de la celebración."
  BA_news.9.b:0 "Confirmado."

  BA_news.10.t:0 "Proclamación de la Federación de Kivotos"
  BA_news.10.desc:0 "Hoy será un día emblemático en la historia de Kivotos. Los ideales revolucionarios de [FROM.GetAdjective] se han declarado ante el mundo. [FROM.GetLeader], al mando de la nueva 'Federación de Kivotos', anunció una visión comunista tras unificar academias derrotadas en la guerra civil del Consejo Estudiantil.\n\n  En la capital de [FROM.GetAdjective], la población rinde homenaje con solemnidad, convencida de que la Federación avanza firme hacia sus ideales revolucionarios. Se espera que el pueblo conserve para siempre la llama de la revolución."

  BA_news.10.a:0 "¡Avanzaremos hacia la revolución!"
  BA_news.10.b:0 "Oh."
  BA_news.10.c:0 "Interesante."

  BA_news.11.t:0 "La perla del Mediterráneo, Italia"
  BA_news.11.desc:0 "Pocos días después de la rendición británica frente a Kaiser Corporation, el ejército italiano desembarcó en Malta y Chipre. Alegaron proteger territorios humanos de invasores, pero en realidad pretenden ocupar el vacío dejado por el declive británico en el Mediterráneo.\n\n  El gobierno británico condenó esta invasión no declarada como una violación del derecho internacional y una amenaza a la paz global."

  BA_news.11.a:0 "¡Una gran victoria!"
  BA_news.11.b:0 "Gran Bretaña no tenía otra opción."
  BA_news.11.c:0 "¡No retrocederemos!"

  BA_news.12.t:0 "Asalto a Yurizono Seia"
  BA_news.12.desc:0 "Seia Yurizono, apodada 'la Reformadora' y elegida como anfitriona del Tea Party, fue atacada en su residencia. El Tea Party convocó una reunión de emergencia; las facciones Santos, Filius y Pater tardarán en elegir al próximo anfitrión.\n\n  Cuando la Orden de la Justicia llegó, el atacante ya había huido y Seia se encontraba inconsciente. Actualmente está hospitalizada, y la Orden promete no dejar impune al agresor."

  BA_news.12.a:0 "¡Detened al culpable!"
  BA_news.12.c:0 "Están sumidos en el caos."

  BA_news.13.t:0 "El caos del Milenio"
  BA_news.13.desc:0 "En Kivotos resuena la noticia de un gran suceso procedente del Milenium. Para limpiar una de las ruinas más problemáticas, el bando Semina ordenó un bombardeo, pero esto desató un miedo indescriptible que emergió de un profundo letargo.\n\n  AL-1S evaluó la situación con rapidez e inició un contraataque contra Semina, durante el cual uno de sus altos mandos desapareció. Además, una nueva oscuridad ha caído sobre Kivotos."
  BA_news.13.a:0 "Princesa."

  BA_news.14.t:0 "Japón revela sus ambiciones"
  BA_news.14.desc:0 "Cuando la misteriosa fuerza conocida como Kivotos desembarcó en Europa y provocó un incendio por todo el continente, el Imperio Japonés aprovechó la coyuntura para conquistar islas del Pacífico y ocupar las concesiones que poseían las potencias occidentales. El gobierno nipón presenta estas acciones como la victoria de sus derechos soberanos y ha emprendido una intensa campaña propagandística.\n\n  El gobierno de la República de China protestó enérgicamente, y Estados Unidos envió una dura advertencia a través de su embajador en Tokio."
  BA_news.14.a:0 "¡Larga vida al Emperador!"
  BA_news.14.b:0 "Desprecian nuestras advertencias."
  BA_news.14.c:0 "Confirmado."

  BA_news.15.t:0 "El dominó derrumbado"
  BA_news.15.desc:0 "Hoy a las 11:00, miles de personas se quejaron de un dolor de cabeza inexplicable. Mientras el mundo entraba en confusión por este fenómeno, el cielo se oscureció brevemente y en el hemisferio norte se observaron columnas de luz desconocida.\n\n  Expertos internacionales sospechan que podría tratarse de un evento similar al desembarco de la fuerza 'Kivotos' hace un año. Además, un individuo que afirma ser agente de los servicios de inteligencia de EE. UU. ha declarado que 'esto es una conspiración de fuerzas extraterrestres', desatando un intenso debate."
  BA_news.15.a:0 "¡Que haya luz!"

  BA_news.16.t:0 "Guerra civil en Gehenna"
  BA_news.16.desc:0 "Hoy se ha difundido la noticia de un gran enfrentamiento militar en Gehenna entre la Dirección y Manmazon. La Dirección afirma expulsar a las fuerzas defensoras y a Manmazon para restaurar el orden, mientras que Manmazon acusa a la Dirección de traición por colaborar con Trinity. Ambos bandos, con sus propios argumentos, han desatado una guerra civil.\n\n  El choque ya está en marcha y es imposible predecir el vencedor. Sea cual sea el resultado, solo quedarán ruinas."
  BA_news.16.a:0 "¡Viva Hina, jefa de la Dirección!"
  BA_news.16.b:0 "¡Soldados de Manmazon, adelante!"
  BA_news.16.c:0 "Nuestros enemigos están divididos."
  BA_news.16.d:0 "¿Guerra civil?"

  BA_news.17.t:0 "El colapso de Trinity"
  BA_news.17.desc:0 "Se ha confirmado oficialmente el colapso de Trinity, una academia con siglos de historia, causando profunda conmoción."
  BA_news.17.a:0 "Antepasados..."
  BA_news.17.b:0 "Ha sido para bien."
  BA_news.17.c:0 "Expreso mis condolencias."
  BA_news.17.d:0 "La amenaza se ha reducido."

  BA_news.18.t:0 "La luz del color"
  BA_news.18.desc:0 "En un instante, todas las criaturas del planeta emitieron un grito de pavor ante una onda psíquica aterradora. Aunque desapareció en segundos, todos la recordamos.\n\n  Tras el paso de la onda, todos miraron al norte al unísono, evocando la columna luminosa vista semanas atrás en el hemisferio norte. Este suceso ha colapsado las líneas de emergencia en todo el mundo y ha dado origen a un culto que adora esa misteriosa luz."
  BA_news.18.a:0 "El ojo que contempla el planeta."

  BA_news.19.t:0 "Revolución en India"
  BA_news.19.d:0 "[429.GetName] y sus socialistas han proclamado el 'Consejo Bharat', dando inicio a la revolución y la guerra de independencia en India. Multitudes se han armado y alzado contra el dominio colonial, dispuestas a morir por liberarse de siglos de opresión. Mientras tanto, el gobierno británico, aún aturdido por la guerra contra [KAI.GetName] y la pérdida de su metrópoli, no ha emitido declaración oficial. La situación en India se vuelve cada vez más incierta."
  BA_news.19.a:0 "Parece que los indios ansían la independencia."

  BA_news.20.t:0 "Tregua entre Francia y el Milenio"
  BA_news.20.d:0 "Francia y el Milenio ya no podían soportar más los estragos de la guerra. Esta mañana, sus diplomáticos lograron, en un improvisado salón de negociaciones en el frente, un acuerdo que silenciara los cañones y detuviera el derramamiento de sangre."
  BA_news.20.a:0 "Ha sido la elección del mal menor."
  BA_news.20.b:0 "Francia se ha fragmentado."

  BA_news.21.t:0 "La guerra de recuperación de Francia"
  BA_news.21.d:0 "A primera hora, la marina francesa abrió fuego, marcando el inicio de un estado de guerra formal con el Milenio. Desterrados tras su derrota, los exiliados franceses en África no se rindieron y, desde allí, lanzaron su ofensiva. Con el disparo de sus cañones comenzó la operación de reconquista, y los franceses de la diáspora se alzan contra el dominio milenario."
  BA_news.21.a:0 "¡Adelante, ejército francés!"
  BA_news.21.b:0 "¿Podrá Francia recuperar su hogar?"

  BA_news.22.t:0 "Masacre en [FROM.FROM.GetName]"
  BA_news.22.desc:0 "Esta madrugada, miembros del grupo que se autodenomina [FROM.GetName] ocuparon la antigua Escuela de Ciencias del Milenio y desataron un sangriento exterminio. Según fuentes, todos los supervivientes han sido ejecutados o sometidos a procesos de 'reeducación', y sus puestos serán reemplazados por autómatas de metal.\n\nAnte esta atrocidad, la comunidad internacional ya se prepara para declarar la guerra a [FROM.GetName], y los líderes mundiales claman que no pueden permitir la victoria de estas máquinas asesinas."
  BA_news.22.a:0 "Orden cumplida."
  BA_news.22.b:0 "Verdaderamente… espeluznante."

  BA_news.23.t:0 "Golpe de Estado en Canadá"
  BA_news.23.desc:0 "Los exiliados llegados a Canadá han derrocado al gobierno canadiense y, liderados por Eduardo, han instaurado un nuevo régimen mediante un golpe de Estado."
  BA_news.23.b:0 "La influencia de Daejeon ha llegado hasta América."
  BA_news.23.a:0 "La situación en Canadá es sombría."

  BA_news.24.t:0 "El Arca de Atrahasis"
  BA_news.24.desc:0 "En los restos de la antigua escuela del Milenio, Atrahasis, se ha descubierto un edificio enigmático. Parece estar vinculado a AL-1S, responsable de la caída de la Escuela de Ciencias del Milenio, pero su propósito aún es desconocido."
  BA_news.24.a:0 "Arca."

  BA_news.25.t:0 "La caída de la Escuela de Ciencias del Milenio"
  BA_news.25.desc:0 "Algo increíble ha sucedido. Desde hace días, las líneas de comunicación de la Escuela de Ciencias del Milenio habían sido cortadas y apenas se recibía información. Recientemente, un mensaje supuestamente enviado por Mikamo Neru, jefa de C&C, afirmaba que la escuela había sido destruida por un ejército de máquinas bajo el mando de AL-1S, y que la resistencia fue mínima. La Escuela de Ciencias del Milenio que conocíamos ya no existe; en su lugar, un grupo que se autodenomina Atrahasis ha tomado el relevo."
  BA_news.25.a:0 "Se ha filtrado información."
  BA_news.25.b:0 "Esto parece increíble."

  BA_news.26.t:0 "Éxito de la revolución en India"
  BA_news.26.d:0 "El Imperio Británico, tras perder las Islas Británicas, quedó reducido a un tigre de dientes de sierra. La guerra de independencia india, liderada por los revolucionarios sureños, culminó con la toma de Delhi y la victoria de los insurgentes. El nuevo gobierno revolucionario ha anunciado la convocatoria de un consejo para decidir el destino de Bharat."
  BA_news.26.a:0 "¡Victoria contra el imperialismo!"
  BA_news.26.b:0 "El Imperio Británico ha perdido su poder."
  BA_news.26.c:0 "Estamos indefensos."

  BA_news.27.t:0 "Lanzamiento de satélite de la Escuela de Ciencias del Milenio"
  BA_news.27.d:0 "La Escuela de Ciencias del Milenio anunció que, tras varios intentos, lograron lanzar un satélite al espacio y ya planifican nuevos lanzamientos. Los líderes mundiales convocaron rápidamente conferencias de prensa y se registraron numerosos avistamientos de un objeto elevándose en el cielo."
  BA_news.27.a:0 "Misión cumplida."
  BA_news.27.b:0 "Su tecnología supera la nuestra."

  BA_news.28.t:0 "Colapso del Frente de Stresa"
  BA_news.28.d:0 "El tratado de seguridad que sustentaba al Frente de Stresa se vino abajo cuando uno de sus miembros se retiró. El ministro de Exteriores italiano lamentó profundamente la situación y advirtió que la alianza podría desintegrarse por completo."
  BA_news.28.a:0 "Qué lamentable."
  BA_news.28.b:0 "¿Se desmorona Europa?"

  BA_news.29.t:0 "Parlamento francés suspendido"
  BA_news.29.d:0 "Tras la reconquista del territorio continental, el Mariscal Pétain anunció la suspensión del Parlamento francés. Aunque los diputados intentaron entrar al edificio, fueron dispersados por la gendarmería. Expertos alertan que la democracia francesa ha recibido un golpe mortal."
  BA_news.29.a:0 "El Mariscal nos guiará."
  BA_news.29.b:0 "La ambición de un anciano."

  BA_news.30.t:0 "La Cuarta Internacional"
  BA_news.30.desc:0 "Hoy se han reunido en Cherinograd numerosos delegados enviados por organizaciones comunistas de todo el mundo para una conferencia. Bajo el impulso de partidarios de la teoría de Trotski, como Renka y Cherino, se ha sentado la base de la Cuarta Internacional.\n\nSin embargo, aún se desconoce qué repercusión tendrá este movimiento en el escenario político internacional. La noticia ha avivado la envidia de Stalin, quien sospecha que muchos miembros de la cúpula del partido y del ejército apoyan a Trotski y se ha alarmado al comprobar que siguen con vida. Su paranoia se ha reactivado por completo y Stalin se ha recluido en su residencia. Su desconfianza e inestabilidad podrían desencadenar una crisis en el régimen soviético e incluso arrojar a la URSS a una guerra civil."
  BA_news.30.a:0 "¿Cuántas Internacionales hay?"
  BA_news.30.b:0 "¡Aplaudamos a nuestros nuevos camaradas!"
  BA_news.30.c:0 "Trotskistas..."
  BA_news.30.d:0 "¿Un nuevo futuro para el comunismo?"

  BA_news.31.t:0 "Guerra civil en Kaiser Corporation"
  BA_news.31.desc:0 "Hoy por la mañana, un golpe de Estado repentino liderado por altos directivos del consejo ha sumido a la Kaiser Corporation en una guerra civil. La facción presidencial, empleados contratados por el consejo y el resto del personal han comenzado a enfrentarse con armas, y el ejército se ha retirado de la frontera para contener la crisis interna.\n\nEl presidente ha declarado que prefiere destruir la compañía antes que permitir que caiga en manos de los 'traidores'."
  BA_news.31.a:0 "Ahora ya no hay marcha atrás."
  BA_news.31.b:0 "¿Guerra civil en la empresa?"

  BA_news.32.t:0 "Restauración de los Habsburgo"
  BA_news.32.desc:0 "Nadie lo habría previsto. El esfuerzo de Otto von Habsburgo por reclamar el trono de Austria ha culminado con éxito: ha entablado una alianza oficial con Abydos y se rumorea la restauración de la doble monarquía austrohúngara. Entre vítores, fue proclamado rey en el palacio de Viena.\n\nEn el discurso de la coronación, agradeció insistentemente a Abydos por su lealtad y protección, y declaró su intención de reunir de nuevo las tierras de los Habsburgo sin menospreciar jamás a Abydos."
  BA_news.32.a:0 "¡Viva!"
  BA_news.32.b:0 "Están completamente locos."
  BA_news.32.c:0 "¿El imperio se alza de nuevo?"

  BA_news.33.t:0 "El retorno del Imperio Mongol"
  BA_news.33.desc:0 "El heredero del Gran Imperio Mongol, que una vez dominó Eurasia, ha resurgido. Su política expansionista ha tenido éxito: ha asegurado territorios de los países vecinos y, tras negociar con la URSS, ha obtenido Buriatia, Chita y Bodaibo."
  BA_news.33.a:0 "¡Viva!"
  BA_news.33.b:0 "El terror ha vuelto."

  BA_news.34.t:0 "Descubrimiento de la fisión nuclear"
  BA_news.34.desc:0 "Un experimento con uranio realizado por Otto Hahn y Fritz Strassmann en el laboratorio químico de Trinity ha sorprendido a la comunidad científica. Al bombardear uranio con neutrones, se detectó inesperadamente la formación de bario, un elemento más ligero.\n\nEste fenómeno no puede explicarse con la teoría actual. Los investigadores han planteado la hipótesis de la fisión nuclear. Aunque los resultados experimentales fueron muy precisos, la explicación física sigue siendo vaga. Este hallazgo, que abre la posibilidad de la fisión nuclear, acapara la atención de la comunidad científica por su energía liberada y potenciales aplicaciones."
  BA_news.34.a:0 "¡Qué descubrimiento!"
  BA_news.34.b:0 "Tendrá enormes repercusiones."

  #프랑스 기습시위!!  
  # ㄴ 나 프랑스 모던데 그거 참 미안하게 됐다  
  BA_news.35.t:0 "$FRA_prov_event.71.t$"  
  BA_news.35.d:0 "$FRA_prov_event.71.d$"  

  FRA_prov_event.38.t:0 "El retorno de Francia"  
  FRA_prov_event.38.d:0 "Francia ha regresado, algo que nadie creía posible se ha hecho realidad. La última guerra proclamada por [FRA.getLeader] en Argelia y la recuperación de la metrópoli finalmente se consumaron, y los ciudadanos franceses vitorean su victoria definitiva. Tras derrotar a máquinas de guerra mucho más avanzadas y a superhumanos con halo, Francia restablece su administración y se prepara para la reconstrucción."  
  FRA_prov_event.38.a:0 "¡Viva Francia!"  
  FRA_prov_event.38.b:0 "El viejo orden ha regresado."  

  FRA_prov_event.39.t:0 "Liberación de Marsella"  
  FRA_prov_event.39.d:0 "Desde el puerto de Marsella hasta el centro urbano, las fuerzas de Millennium resistieron, pero al final se izó la Tricolor en el Ayuntamiento, anunciando la liberación de la ciudad a orillas del Atlántico. Muchos franceses se unieron a la Resistencia al conocer la noticia, y no está claro si Millennium podrá contener este movimiento."  
  FRA_prov_event.39.a:0 "Esto es solo el comienzo."  
  FRA_prov_event.39.b:0 "La situación se está complicando."  

  FRA_prov_event.40.t:0 "Liberación de Burdeos"  
  FRA_prov_event.40.d:0 "Al igual que en Marsella, las fuerzas de Millennium resistieron hasta el último momento, pero finalmente la Tricolor ondeó en el Ayuntamiento de Burdeos, señalando la liberación de la ciudad frente al Atlántico. Muchos ciudadanos se sumaron a la Resistencia, y se desconoce si Millennium podrá controlar esta expansión del levantamiento."  

  FRA_prov_event.41.t:0 "Liberación de Orléans"  
  FRA_prov_event.41.d:0 "Esta tarde, alrededor de las 17:00, el Gobierno francés anunció la liberación de Orléans, ciudad del centro de Francia. Al estar a solo 100 km de París, muchos pronostican ya la victoria final de Francia."  
  FRA_prov_event.41.a:0 "¡Se vislumbra el fin!"  
  FRA_prov_event.41.b:0 "¡Defended la Torre Millennium!"  

  FRA_prov_event.44.t:0 "Atrocidades en África"  
  FRA_prov_event.44.d:0 "Un periodista ha revelado que el gobierno militar de Philippe Pétain en Francia oprimía y explotaba brutalmente a los ciudadanos africanos. Según el artículo, en los proyectos de industrialización y urbanización forzada de Argelia y zonas adyacentes, familias enteras quedaron sin hogar y varios trabajadores murieron tras dos días seguidos sin descansar."  
  FRA_prov_event.44.a:0 "¿Y qué?"  
  FRA_prov_event.44.b:0 "La explotación colonial al desnudo."  

  FRA_prov_event.46.t:0 "Revueltas en Indochina"  
  FRA_prov_event.46.d:0 "Bajo el liderazgo del Partido Comunista de Indochina en Ho Chi Minh, estalló una revolución en la Indochina francesa. En un solo día, los insurgentes ocuparon el Ayuntamiento de Hanói y prendieron la mecha del levantamiento, mientras las provincias del norte se sumaban progresivamente al conflicto."  
  FRA_prov_event.46.a:0 "Siempre son los comunistas los que causan problemas."  
  FRA_prov_event.46.b:0 "Es el límite del imperialismo francés."  

  FRA_prov_event.53.t:0 "Conflicto en África Ecuatorial"  
  FRA_prov_event.53.d:0 "La disputa territorial entre el Reino Unido y la República Francesa escaló a enfrentamientos. Esta mañana, el gobierno francés declaró la guerra al Reino Unido en su embajada de Argel, reclamando la soberanía sobre la antigua África Ecuatorial Francesa. Los analistas creen que es una respuesta al rechazo británico a negociar, tras el éxodo francés a Argelia con apoyo naval británico."  
  FRA_prov_event.53.a:0 "Nuestra antigua alianza se ha roto."  

  FRA_prov_event.65.t:0 "Golpe de Estado en Francia"  
  FRA_prov_event.65.d:0 "En el Gobierno de Emergencia francés, las políticas autoritarias de Pétain provocaron huelgas masivas y disturbios. El enfrentamiento entre el mariscal Pétain y el oficial Henri Mordac llegó a su clímax cuando Mordac asaltó la oficina de Pétain exigiendo su dimisión. Pétain tuvo que abdicar, y Mordac estableció un gobierno provisional con promesas de democracia."  
  FRA_prov_event.65.a:0 "¡Mordac guiará a la Francia libre!"  
  FRA_prov_event.65.b:0 "Ya sospechaba lo que tramaban."  

  FRA_prov_event.71.t:0 "Conferencia de Halifax"  
  FRA_prov_event.71.d:0 "Tras el exilio británico en Canadá, los representantes franceses se reunieron en Halifax durante varios días. Acordaron cooperar para la recuperación de la metrópoli y discutieron distintos niveles de colaboración."  
  FRA_prov_event.71.a:0 "El primer paso para volver al hogar."  
  FRA_prov_event.71.b:0 "Compartimos destino similar."  

  FRA_prov_event.76.t:0 "Colapso de Francia"  
  FRA_prov_event.76.d:0 "Los opresores exiliados en África Occidental fueron derrocados por una revolución. Al igual que ellos destruyeron la monarquía, la flecha ha vuelto a herirles. África se sume en el caos, con señores de la guerra controlando calles y ataques a colonos franceses. El imperio colonial ha sucumbido y será el primero en desaparecer."  
  FRA_prov_event.76.a:0 "Vaya desastre."  

  #프랑스 기습시위!!  
  BA_news.36.t: "Tea Party arrasada"  
  BA_news.36.d: "Hoy explotó una bomba nuclear en Edén. Más de dos tercios de la ciudad fueron destruidos al instante; solo quedaron en pie unos pocos edificios reforzados. Los líderes de la Tea Party sobreviven con dificultad tratando de contener la crisis. El horror del arma ha marcado la psique colectiva: el valor de la vida se ha hundido. Nadie consideró las consecuencias a largo plazo del viento radiactivo y las incontables víctimas."  
  BA_news.36.a: "Dios mío."  

  BA_news.37.t:0 "Tercera Guerra Soviético-Polaca"  
  BA_news.37.d:0 "El largo conflicto entre ambas naciones estalló de nuevo. Esta mañana llegó a Moscú la declaración de guerra definitiva de Varsovia a [SOV.GetName], iniciando la Tercera Guerra Polaco–Soviética. El embajador polaco afirmó que, mientras sus aliados estén con ellos, no cabe duda de su victoria. Ya hay tiroteos en Lublin y Białystok, y el futuro de Europa del Este es incierto."  
  BA_news.37.a:0 "¿Conseguirá Rusia ganar otra vez?"  
  BA_news.37.b:0 "¡Arrasemos al imperio del mal!"  
  BA_news.37.c:0 "Que recuerden 1921."  

  BA_news.38.t:0 "Renuncia de Ryo Tsukatsuki"  
  BA_news.38.d:0 "Por recientes cambios políticos en [MIL.GetName], Ryo Tsukatsuki dimitió como presidenta de la asociación de seminarios y renunció a todo poder político. La prensa cree que sufrió presiones y su paradero es desconocido. El mundo observa expectante el nombramiento de su sucesor."  
  BA_news.38.a:0 "Era lo que queríamos."  
  BA_news.38.b:0 "Estructura política muy compleja."  

  BA_news.39.t:0 "Juicio de Ryo Tsukatsuki"  
  BA_news.39.d:0 "El juicio de la ex presidenta Ryo Tsukatsuki se transmitió hoy desde el Millennium Center. A pesar de declaraciones en su contra, guardó silencio y la audiencia concluyó sin sorpresas. Se interpreta como un refuerzo del poder de la nueva presidenta [MIL.GetLeader]."  
  BA_news.39.df:0 "Durante un juicio sesgado, Ryo Tsukatsuki revirtió con elocuencia la situación, forzando su abrupta conclusión. Aunque pretendía afianzar el poder de [MIL.GetLeader], el fracaso de este intento podría desatar una crisis política en Millennium."  
  BA_news.39.a:0 "Ahora es una criminal."  
  BA_news.39.b:0 "Realmente excepcional."  
  BA_news.39.c:0 "Interesante."  

  BA_news.40.t: "Declaración de aislamiento de las Islas Británicas"  
  BA_news.40.d: "El gobierno británico reconoció oficialmente su derrota ante alienígenas desconocidos. El rey Jorge V murió en combate. Ante la falta de alternativas, la corona anunció la ‘Política de aislamiento de las Islas Británicas’, decisión debatida pero considerada inevitable tras la humillante derrota."  
  BA_news.40.a: "Recuperaremos lo perdido."  
  BA_news.40.b: "¡Aún hay civiles que proteger!"  
  BA_news.40.c: "Los vencidos están rabiosos."  

  BA_news.41.t: "Caída de Trinity"  
  BA_news.41.d: "[SOV.GetName] ocupó Edén; Trinity se rindió. Misono Mika y sus seguidores desaparecieron, y Utazumi Sakurako y Hanekawa Hasumi firmaron la capitulación. El ejército rojo ondeó la bandera de [SOV.GetName] en el Parlamento de Edén, certificando la destrucción de Trinity."  
  BA_news.41.a: "¡La gloria al pueblo!"  
  BA_news.41.b: "El imperio del mal ha caído."  
  BA_news.41.c: "..."  

  BA_news.42.t: "Reactivación de Eridu, la ciudad fortaleza"  
  BA_news.42.d: "Eridu, que cayó tras el último gran asalto francés, ha reanudado operaciones. Aunque Millennium Science School no ha confirmado oficialmente, todo apunta a que la fortaleza fue reparada y puesta en marcha, aunque su antiguo esplendor no parece alcanzable."  
  BA_news.42.a: "La fortaleza más poderosa vuelve a la vida."  

  BA_news.43.t: "Disolución de los Aliados"  
  BA_news.43.d: "Hoy el Reino Unido anunció la disolución de los Aliados. Alegó que, sin el Eje, la alianza carece de propósito. Varios miembros criticaron la medida, pero el gobierno británico guardó silencio."  
  BA_news.43.a: "¿Y los extraterrestres?"  

  BA_news.44.t: "La violencia política se convierte en guerra civil"  
  BA_news.44.d: "Los enfrentamientos entre camisas negras, comunistas y opositores al socialismo se intensificaron. Milicias se formaron en todo el país, obligando al ejército a elegir bandos. La autonomía naval y federal apoya al gobierno ‘democrático’, pero muchas unidades han desertado. Ozworld Mozley proclamó un gobierno de crisis para gestionar la contienda hasta su fin."  
  BA_news.44.a: "¡El futuro de la patria está en juego!"  

  BA_news.45.t: "Fin de la guerra civil británica"
  BA_news.45.d: "La falta de apoyo popular llevó al gobierno democrático a reconocer nuestra victoria y buscar la paz en sus colonias. La Royal Navy regresó bajo nuestro mando, y las autonomías se niegan a seguir a un gobierno no democrático, optando por mantenerse como miembros independientes de la Commonwealth."
  BA_news.45.a: "Comencemos la reconstrucción."

  BA_news.46.t: "La Segunda Asamblea"
  BA_news.46.d: "Tras la victoria del bando Arius en Eden, la Segunda Asamblea de Trinity prohibió todas las facciones salvo Arius. Expertos de Kibotos comentan que se interpreta como revancha por la expulsión de Arius en la primera Asamblea."
  BA_news.46.a: "Es la venganza prometida."
  BA_news.46.b: "Increíble."
  BA_news.46.c: "Entendido."

  BA_news.47.t:0 "Expulsión de Pétain"
  BA_news.47.d:0 "Tras días de huelgas masivas y protestas, el exilio francés depuso a Pétain. Henri Mordac y sus seguidores asaltaron la residencia de Pétain, lo forzaron a dimitir y la Asamblea en Argel lo destituyó por completo."
  BA_news.47.a:0 "¡Avancemos hacia la democracia!"
  BA_news.47.b:0 "Francia sigue en crisis."

  BA_news.48.t:0 "Alza de la Comunidad de África Oriental"
  BA_news.48.d:0 "Con la retirada británica, Kenia, Uganda y Tanzania se unieron bajo la teoría de la Comunidad de África Oriental. Tras intensas negociaciones, acordaron una federación para defenderse de una posible recolonización."
  BA_news.48.a:0 "El fin del imperialismo se aproxima."
  EAC_leader_name: "Conferencia de la Comunidad de África Oriental"

  BA_news.49.t:0 "Nacimiento del Partido Socialista Unificado Alemán"
  BA_news.49.d:0 "Después del colapso de Trinity, la guerrilla socialista fusionó el Partido Comunista y el Partido Socialdemócrata en el nuevo Partido Socialista Unificado Alemán, que funcionará como única fuerza socialista. Los miembros de derecha fueron purgados, y [KPD.GetName] parece encaminado a un estado socialista."
  BA_news.49.a:0 "¡Hacia la victoria comunista!"
  BA_news.49.b:0 "La inestabilidad global crecerá."

  BA_news.50.t:0 "Creación de la Organización del Tratado de Berlín"
  BA_news.50.d:0 "La URSS y [ROOT.GetName] anunciaron la fundación de la Organización del Tratado de Berlín, una alianza militar, civil y de inteligencia destinada a afrontar la creciente inestabilidad en Europa y el mundo."
  BA_news.50.a:0 "¡Venceremos juntos!"
  BA_news.50.b:0 "Una nueva amenaza internacional."

  BA_news.51.t:0 "Guerra civil en Hyakkiyako"
  BA_news.51.d:0 "En la Academia Hyakkiyako, un grupo autodenominado [FROM.GetName] declaró la guerra al gobierno estudiantil, desatando un conflicto interno de gran escala. [FROM.GetName] reclama ser la única autoridad legítima. Medios internacionales critican la fragilidad de su sistema político."
  BA_news.51.a:0 "¡Restableced el orden!"
  BA_news.51.b:0 "Un escenario fascinante."


  BA_news.52.t:0 "¡Asalto a Shiromi Iori!"
  BA_news.52.d:0 "Shiromi Iori, especialista de segundo año del comité disciplinario de Gehenna, fue gravemente herida por un escopetazo y culatazo. Se confirma que la atacante fue Igusa Haruka. Los médicos estiman meses de recuperación, lo que debilitará al comité disciplinario."
  BA_news.52.a:0 "Confirmado."

  BA_news.53.t:0 "La Agencia 68 toma el poder en Gehenna"
  BA_news.53.d:0 "La Agencia 68 ha asumido el gobierno de la Academia Gehenna. Tras ganar el apoyo de los estudiantes, su directora Riku‑hachima Aru exigió la transferencia de poder y, sorprendentemente, el consejo estudiantil lo aprobó. El antiguo régimen de Manmazen, uno de los Tres Grandes, colapsó y ahora la Agencia se alza como nueva potencia."
  BA_news.53.a:0 "Confirmado."

  BA_news.54.t:0 "Bombardeo de Trinity por la Agencia"
  BA_news.54.d:0 "Se confirmó que la Agencia de Inteligencia llevó a cabo un intenso bombardeo contra Trinity. Anoche, las baterías cercanas a la frontera abrieron fuego simultáneo, arrasando pueblos y ciudades y provocando numerosas bajas. Este acto de provocación podría desatar un conflicto mayor."
  BA_news.54.a:0 "Confirmado."

  BA_news.55.t:0 "Explosión en el ramen Shibasaki"
  BA_news.55.d:0 "El famoso ramen Shibasaki de Abydos fue volado con minas Claymore. Se sospecha que una estudiante de primer año de Gehenna colocó y detonó el explosivo. La explosión se sintió a 10 km del campus, y el icónico platillo desapareció por completo."
  BA_news.55.a:0 "Confirmado."

  BA_news.56.t:0 "Riku‑hachima Aru, presidenta del consejo estudiantil de Gehenna"
  BA_news.56.d:0 "Tras pacificar Gehenna, Riku‑hachima Aru ha sido elegida legítimamente presidenta del consejo estudiantil. Su elección marca el fin del antiguo gobierno de Manmazen y el comienzo de una nueva era bajo su liderazgo."
  BA_news.56.a:0 "Confirmado."

  BA_news.57.t: "[RED.GetNameDef] sufre un golpe de Estado"
  BA_news.57.desc: ""
  BA_news.57.a: "¡Derroquemos a Cherino!"
  BA_news.57.b: "Todo según lo planeado..."
  BA_news.57.c: "Lo han conseguido."

  BA_news.58.t:0 "Establecimiento del Gobierno Provisional Checo"
  BA_news.58.d:0 "Hoy, en los Sudetes, se formó un Gobierno Provisional Checo. Con el apoyo de la pequeña academia Abydos, prometen recuperar todo el territorio checo y condenan la represión de la Alianza Baekguya. El mundo observa esta colaboración inédita entre ambos mundos."
  BA_news.58.a:0 "¿Qué frutos dará esta alianza?"

  BA_news.59.t:0 "Teorema de la Imposibilidad"
  BA_news.59.d:0 "Un artículo de [MIL.GetName] expone el 'Teorema de la Imposibilidad', demostrando que no existe un sistema de preferencias democrático que evalúe correctamente el bienestar social. Si se acepta, socava la idea de una sociedad democrática y racional. Economistas debaten furiosamente, y en estados autoritarios ya han surgido protestas."
  BA_news.59.a:0 "El paraíso no existe."
  BA_news.59.b:0 "Increíble."

  BA_news.60.t:0 "Ascensión de Ibuki Tanga al trono"
  BA_news.60.d:0 "Tras una serie de intrigas en Manmazen, [FROM.GetLeader] asumió el trono y proclamó a Ibuki Tanga como emperatriz. Se dice que ahora es la protectora de Gehenna y guía de todos sus estudiantes. Su influencia internacional aún es incierta."
  BA_news.60.a:0 "¡Por nuestra emperatriz!"
  BA_news.60.b:0 "Sospechosamente extraño."

  BA_news.61.t:0 "Golpe de Estado en la Agencia de Seguridad Ciudadana"
  BA_news.61.d:0 "La Escuela de Policía Valkyrie anunció la destitución de la directora Ogata Kanna en una sesión de emergencia de la Agencia de Seguridad Pública. Se izó la bandera de la Agencia en el cuartel general, y Kanna se encuentra bajo arresto domiciliario. Analistas creen que Valkyrie ha perdido el control administrativo."
  BA_news.61.a:0 "¡El futuro de Valkyrie es incierto!"

  BA_news.62.t:0 "Acuerdo de Constantine"
  BA_news.62.d:0 "Francia, presionada por las demandas de independencia argelinas y la comunidad internacional, negoció en Constantine con líderes argelinos. Acordaron concesiones a Argelia, que mantendrá dependencia económica durante una década antes de una independencia plena."
  BA_news.62.a:0 "Beneficio mutuo."
  BA_news.62.b:0 "¿Francia sin violencia?"

  BA_news.63.t:0 "Guerra de Independencia de Argelia"
  BA_news.63.d:0 "Cuando las medidas represivas contra los musulmanes desataron protestas, los manifestantes ocuparon el ayuntamiento de Argel, marcando un punto crítico en el Norte de África. Minutos después, al izarse la bandera argelina, se declaró el inicio de la guerra de independencia. Diversos grupos políticos argelinos formaron milicias juveniles y atacaron las bases francesas. El gobierno galo anunció la “Operación de Mantenimiento del Orden en el Norte de África”, anticipando una represión severa."
  BA_news.63.a:0 "¡Una Francia unida está amenazada por los musulmanes!"
  BA_news.63.b:0 "El imperio colonial se derrumba."

  BA_news.64.t:0 "Ascenso del Partido Comunista Checo"
  BA_news.64.d:0 "Hoy, tras la recuperación de Chequia y el caos político en la Academia Abydos, el Partido Comunista Checo triunfó en la lucha interna por el poder y anunció que gobernará el país bajo su liderazgo. La Academia Abydos ha condenado esta toma de poder, pero no se prevén acciones efectivas de contestación."
  BA_news.64.a:0 "Increíble."

  BA_news.65.t:0 "Conferencia de Jaouljie"
  BA_news.65.d:0 "En Jaouljie se debatió un pacto de defensa mutua entre [POL.GetName] y [ABY.GetName] en medio de la inestabilidad internacional. Ambas partes confirmaron que el tratado busca asegurar una paz duradera en Europa Central, y los países vecinos observan con atención estos desarrollos."
  BA_news.65.a:0 "Manténlos vigilados."

  BA_news.66.t: "¡Golpe de Estado en Francia!"
  BA_news.66.desc: "En [Getyear] de [GetMonth], el ejército dirigido por Philippe Pétain se alzó contra el gobierno radical, acusado de cobardía e incompetencia. Asaltaron el parlamento y tomaron el poder. Miles de soldados marchan en Argel, recibidos con vítores populares. Pétain prometió superar la crisis nacional y recuperar la metrópoli, ganándose el fervor de los franceses."
  BA_news.66.a: "¡Mariscal, estamos aquí!"
  BA_news.66.b: "Es la segunda recreación del 18 Brumario."

  BA_news.67.t: "Independencia del poder de investigación de Valkyrie"
  BA_news.67.d: "La directora Nemugaki Fubuki de la Escuela de Policía Valkyrie anunció hoy que ha recuperado su autoridad investigadora, hasta ahora en manos de Chalé como departamento federal, el cual resultó inútil. Fubuki declaró que Valkyrie operará como órgano independiente y de corrección, cumpliendo su función como fuerza de mantenimiento de la ley. Se espera resistencia de otras academias, pero Fubuki solo prometió más detalles en el futuro. En cualquier caso, el nombre 'Chalé' desaparecerá de los registros administrativos de Valkyrie."
  BA_news.67.a: "¡La guerrera ha roto sus cadenas!"
  BA_news.67.b: "¡Comencemos!"
  BA_news.67.c: "¡Cómo se atreven!"

  BA_news.68.t: "Seia Yurizono elegida anfitriona de Tea party"
  BA_news.68.desc: "Tras la sesión de emergencia de Tea party, Seia Yurizono fue elegida nueva anfitriona. En su discurso, Yurizono advirtió que Trinity enfrenta una nueva amenaza y no puede ignorar sus problemas. Se espera que, bajo su mandato, Tea party experimente importantes transformaciones."
  BA_news.68.a: "No me interesa demasiado."
  BA_news.68.b: "Espero que salga bien."
  BA_news.68.c: "Interesante elección."

  BA_news.69.t: "Rebelión francesa en Millennium"
  BA_news.69.desc: "En la Millennium Science School estalló una rebelión masiva. Se atribuye a la incapacidad de la escuela para gestionar la resistencia francesa después de la guerra. El gobierno galo exiliado en África guarda silencio, aunque se hallaron rastros de suministros clandestinos enviados a Francia."
  BA_news.69.a: "No tienen muchas posibilidades."
  BA_news.69.b: "[MIL.GetLeader], rinde cuentas."
  BA_news.69.c: "¿Otra guerra más?"

  BA_news.70.t:1 "Asesinato de Lev Trotski"
  BA_news.70.d:2 "Lev Trotski, ex lugarteniente de Lenin y aspirante al liderazgo soviético, murió hoy en un hospital noruego tras ser atacado con un hacha de hielo por un agresor español vinculado al Ministerio del Interior soviético. Tras su derrota interna, vivía exiliado en Noruega como consejero político de la Federación Escolar Inverno Rojo."
  BA_news.70.a:0 "Atroz."
  BA_news.70.b:0 "Misión cumplida."
  BA_news.70.c:0 "Un final acorde para un agitador."
  BA_news.70.q:0 "Hoy cayó nuestra estrella."

  BA_news.71.t: "¡Revolución en Japón!"
  BA_news.71.d: "En Japón estalló una revolución democrática: enormes manifestaciones derrocaron al régimen militarista de Tokio, con un amplio apoyo popular. Las fuerzas armadas y grupos de derecha prometen resistir, dando inicio a una guerra civil."
  BA_news.71.2.t: "Minshū Ikki"
  BA_news.71.2.d: "El levantamiento democrático se extiende por todo Japón: ciudades e industrias se unen al movimiento, mientras el ejército y la extrema derecha declaran que lucharán hasta el final."

  BA_news.72.t:1 "[FROM.GetAdjective] Primavera"
  BA_news.72.d:2 "Las emisoras extranjeras en la zona militarizada de [FROM.GetAdjective] reportaron al unísono un 'movimiento independentista' que recorre todo el territorio. El gobierno provisional, autodenominado 'gobierno subterráneo del antiguo reino', leyó por radio su declaración de independencia. El Congreso de [USA.GetName] aprobó un apoyo inusual, respaldado por [ENG.GetName], [FRA.GetName] e [ITA.GetName]."
  BA_news.72.a:0 "Una lucha por la libertad."
  BA_news.72.b:0 "Medidas inmediatas."

  BA_news.73.t: "Anexión de Sankai-kei"
  BA_news.73.d: "Después del golpe nazi en [SHA.Capital], las tropas de Trinity cruzaron la frontera y ocuparon el área, siendo recibidas con vítores. En la plaza Heden, Misono Mika declaró la fusión con Trinity y proclamó la región un bastión estratégico."
  BA_news.73.a: "¡La fortaleza del este resurge!"

  BA_news.74.t: "¡Victoria británica!"
  BA_news.74.d: "El ejército británico, atrapado tras la caída de Londres, se reagruparon en Liverpool y lanzaron un contraataque milagroso contra Kaiser Corporation, invirtiendo la marea y firmando una de las victorias más memorables de la historia británica."
  BA_news.74.a: "¡Domina, Britannia!"

  BA_news.75.t: "[TRM.GetName] oficializa el pacto anti-Inverno Rojo"
  BA_news.75.d_soviet: "[TRM.GetLeader] siempre se opuso al comunismo y veía a [TRM.GetNameDef] como su enemigo. Hoy oficializaron el 'pacto anti-Inverno Rojo', un tratado que compromete a sus firmantes a defenderse mutuamente contra cualquier agresión de Invierno Rojo."
  BA_news.75.d_not_soviet: "[TRM.GetNameDefCap] ha condenado el comunismo durante años y ahora extiende un tratado para que los países amenazados por [RED.GetName] puedan unirse y apoyar a quien sufra un ataque."

  BA_news.76.t:0 "La fuga de los siete prisioneros"
  BA_news.76.desc:0 "Con la desaparición del presidente estudiantil, siete prisioneros —Cosaka Wakamo, Kiyosumi Akira, Shintani Kai, entre otros— escaparon de la prisión de Valkyrie. Este suceso expuso la vulnerabilidad postguerra y mantuvo en silencio al consejo estudiantil y a Valkyrie."
  BA_news.76.a:0 "Impactante."
  BA_news.76.b:0 "Era previsible."

  BA_news.77.t:0 "Festival Hyakkiyako"
  BA_news.77.desc:0 "Hyakkiyako celebró su gran festival con cerezos en flor, linternas y fuegos artificiales. La celebración mostró el esplendor y el desarrollo de la academia durante la noche."
  BA_news.77.a:0 "¡Nuestro honor es eterno!"
  BA_news.77.b:0 "Es verdaderamente hermoso."

  BA_news.78.t:0 "Guerra de NamKibotos"
  BA_news.78.desc:0 "El conflicto fronterizo entre [HYA.GetNameDef] y [SHA.GetNameDef] escaló a un conflicto armado que amenaza con extenderse por todo Kibotos. Persiste la preocupación de una guerra más amplia entre academias."
  BA_news.78.a:0 "¡Expulsemos al invasor!"
  BA_news.78.b:0 "Recuperemos nuestra academia."
  BA_news.78.c:0 "Noticia impactante."

  BA_news.79.t:0 "Guerra civil en Inverno Rojo"
  BA_news.79.desc:0 "Las huelgas y el movimiento de Yasunori Minori y las milicias ciudadanas se transformaron en revolución. Aunque el Ministerio de Exteriores lo minimiza, expertos internacionales dudan de la capacidad del gobierno para sofocar el levantamiento."
  BA_news.79.a:0 "¡Por la revolución!"
  BA_news.79.b:0 "¡Rechacemos a los subversivos!"
  BA_news.79.c:0 "Era inevitable."

  BA_news.80.t:0 "Masacre en Millennium"
  BA_news.80.desc:0 "La Millennium Science School ejecutó sumariamente a prisioneros, ciudadanos y organizaciones estudiantiles, arrestando o asesinando a disidentes. La comunidad internacional condena esta atrocidad como crimen de guerra."
  BA_news.80.a:0 "¿Creyeron que esto queríamos?"
  BA_news.80.b:0 "Dios mío..."

  BA_news.81.t: "Cesión de Transilvania"
  BA_news.81.desc: "Por mediación alemana, Transilvania del Norte fue devuelta a Hungría en un tratado firmado en Viena. Esto reabre el debate sobre fronteras tras la gran guerra."
  BA_news.81-2.desc: "Alemania medió en Viena para la devolución total de Transilvania a Hungría, desatando debates sobre la reorganización de fronteras en la posguerra."

  BA_news.82.t:0 "Elisabeth asume el trono húngaro"
  BA_news.82.desc:0 "Elisabeth, nieta de Francisco José I, fue proclamada reina de Hungría en Budapest, comprometiéndose a mejorar las condiciones de los trabajadores y proteger a los más vulnerables."
  BA_news.82.a:0 "¡Por el reino del pueblo!"
  BA_news.82.b:0 "¿Monarquía socialista?"

  BA_news.83.t:0 "Restauración de Austria-Hungría"
  BA_news.83.desc:0 "Hungría liberó Austria y anunció la restauración del imperio dual. La emperatriz Elisabeth juró proteger a los oprimidos y erradicar la pobreza, pese a la preocupación de las naciones vecinas."
  BA_news.83.a:0 "No olvidaremos el sacrificio del pueblo."
  BA_news.83.b:0 "¿Un imperio rojo?"
  BA_news.83.c:0 "Fronteras en riesgo."

  BA_news.84.t:0 "Izquierda en [FROM.GetName]"
  BA_news.84.desc:0 "Tras la desaparición de su líder, $COU_MOMOKA$ renunció como presidenta y cedió el poder a un comité popular. Se avecinan reformas radicales de inspiración socialista."
  BA_news.84.a:0 "¡Viva la revolución!"
  BA_news.84.b:0 "Demasiada izquierda."
  BA_news.84.c:0 "Amenazante."

  BA_news.85.t:0 "MOMOKA, presidenta honoraria"
  BA_news.85.desc:0 "El comité reformista de [FROM.GetName] ofreció el título honorario de presidenta a $COU_MOMOKA$, quien lo aceptó como figura simbólica."
  BA_news.85.a:0 "¡Avancemos con las reformas!"
  BA_news.85.b:0 "¿Una nueva aliada?"
  BA_news.85.c:0 "De acuerdo."

  BA_news.86.t:0 "Victoria de MOMOKA en la lucha de poder"
  BA_news.86.desc:0 "$COU_RIN$ formó un comité tras la desaparición del líder, pero $COU_MOMOKA$, al acoger las demandas populares, emergió como verdadera ganadora y asumió el cargo de presidenta del comité."
  BA_news.86.a:0 "¡Por la nueva líder!"
  BA_news.86.b:0 "Interesante."

  BA_news.87.t:0 "Salida de [FROM.GetName] de la cooperativa Kibotos"
  BA_news.87.desc:0 "[FROM.GetName] anunció su retirada de la organización cooperativa Kibotos, argumentando que ya no les beneficia. Fundada tras la guerra, ahora pierde autoridad sin su miembro fundador."
  BA_news.87.a:0 "Una lástima."
  BA_news.87.b:0 "¿Se desmorona la unidad?"

  BA_news.88.t:0 "Fin de la cooperativa Kibotos"
  BA_news.88.desc:0 "[FROM.GetName] se retiró y probó que la cooperación en Kibotos carece de sentido. La organización perdió su guía y su razón de ser."
  BA_news.88.a:0 "¡Una nueva era comienza!"
  BA_news.88.b:0 "Adiós a Kibotos."

  BA_news.89.t:0 "Resolución 47 de Kibotos"
  BA_news.89.desc:0 "El presidente [FROM.GetName] activó la norma que suspende a cualquier miembro en guerra con otro, provocando la expulsión y la protesta de los sancionados."
  BA_news.89.a:0 "¿Nos conviene?"
  BA_news.89.b:0 "Patético."

  BA_news.90.t:0 "Expulsión de [FROM.GetName]"
  BA_news.90.desc1:0 "La organización Kibotos suspendió a [FROM.GetName] por ratificar un tratado prohibido, la primera vez que expulsan a un miembro por esa razón."
  BA_news.90.desc2:0 "La suspensión tras la expulsión de un firmante demuestra la continua pérdida de autoridad de la cooperativa."
  BA_news.90.a:0 "¿Es una ventaja para nosotros?"
  BA_news.90.b:0 "Insólito."

  BA_news.91.t:0 "Victoria de Sankai-kei"
  BA_news.91.desc:0 "[SHA.GetName] derrotó a [HYA.GetName] en la guerra de NamKibotos. En la plaza central, [SHA.getLeader] proclamó una victoria militar, estratégica y política, consagrando su hegemonía."
  BA_news.91-2.desc:0 "Tras la victoria aplastante, anunciaron la creación de un 'nuevo orden' en la capital y el plan de 'espacio vital'. Rumores de purgas inquietan a la comunidad internacional."
  BA_news.91-3.desc:0 "Urushibara Kaguya declaró que la revolución conservadora entra en nueva fase. El público celebró y sólo ella conoce el destino final."
  BA_news.91.a:0 "¡Gran triunfo!"
  BA_news.91.b:0 "Observad el ascenso."
  BA_news.91.c:0 "¿Problemas futuros?"
  BA_news.91.d:0 "La sombra se extiende."
  BA_news.91.e:0 "Admito la derrota."
  BA_news.91.f:0 "Precavido."

  BA_news.92.t:0 "Victoria de Hyakkiyako"
  BA_news.92.desc:0 "[HYA.GetName] ganó gracias a operaciones nocturnas y ocupaciones sistemáticas. Sus fuerzas tomaron puntos clave y establecieron controles estrictos. En conferencia, [HYA.GetLeader] anunció el refuerzo de la seguridad, aunque corresponsales expresan reservas."
  BA_news.92.a:0 "Reconfiguración postguerra."
  BA_news.92.b:0 "Habrá que esperar resultados."
  BA_news.92.c:0 "Increíble."

  BA_news.93.t:0 "Victoria de Abydos"
  BA_news.93.desc:0 "La pequeña Academia Abydos logró una sorprendente victoria en NamKibotos con apoyo local y tácticas de guerrilla. [ABY.GetLeader] proclamó que su triunfo es el triunfo de la población, y su plan de reconstrucción atrae miradas internacionales."
  BA_news.93.a:0 "Paz recuperada."
  BA_news.93.b:0 "Increíble."

  BA_news.94.t:0 "Empeora la salud de Ogata Kanna"
  BA_news.94.desc:0 "La líder Ogata Kanna colapsó por exceso de trabajo al intentar resolver problemas de la Escuela de Policía Valkyrie tras la guerra. Su caída anticipa un cambio de poder en Valkyrie."
  BA_news.94.a:0 "Malas noticias."
  BA_news.94.b:0 "Entendido."

  BA_news.95.t:0 "Renuncia de Ogata Kanna"
  BA_news.95.desc:0 "Ogata Kanna renunció como presidenta estudiantil de [KSP.GetName] tras su deterioro de salud y disputas de poder. Se espera un reajuste político inminente."
  BA_news.95.a:0 "..."
  BA_news.95.b:0 "Al fin sucedió."

  BA_news.96.t:0 "Renacimiento de la Liga de Naciones"
  BA_news.96.desc:0 "Tras las invasiones alienígenas, la Liga de Naciones quedó obsoleta. Ahora, con el mundo unido, prometen no repetir los errores del pasado."
  BA_news.96.a:0 "Esta vez sobrevivirá."
  BA_news.96.b:0 "Despierta un gigante."
  BA_news.96.c:0 "Bendiciones a nosotros."

  BA_news.97.t:0 "EE.UU. se alinea con Kibotos"
  BA_news.97.desc:0 "EE.UU. anunció oficialmente su amistad y cooperación con Kibotos. Europa lo acusa de traición, mientras Kibotos celebra este paso como clave para la integración humano-alienígena. El mundo espera su próximo movimiento."
  BA_news.97.a:0 "Es hora de demostrar convicciones."
  BA_news.97.b:0 "Saben a quién seguir."
  BA_news.97.c:0 "¡Fin de la humanidad!"

  BA_news.98.t:0 "Formación de la Federación Intermarium"
  BA_news.98.desc:0 "Polonia y países de Europa del Este crearon la Federación Intermarium tras fortalecer sus lazos en la guerra [SOV.GetAdjective]-[POL.GetOldAdjective]. Un referéndum popular la aprobó abrumadoramente."
  BA_news.98.a:0 "Un nuevo poder surge."

  BA_news.99.t:0 "Showa Democracy"
  BA_news.99.desc:0 "La Comisión para la Liberación de Japón y el emperador Hirohito proclamaron el fin de la guerra civil, promulgaron una constitución democrática y redujeron los poderes imperiales, renombrando el país 'Japón'. Hirohito apareció públicamente para consolar a los ciudadanos, y el mundo diplomático observa el impacto en Asia."
  BA_news.99.a:0 "¡Viva el emperador y la democracia!"
  BA_news.99.b:0 "Esperemos cooperación."
  BA_news.99.c:0 "¿Monarquía constitucional?"

  BA_news.100.t:0 "La gran hambruna de Bengala"
  BA_news.100.desc:0 "El gabinete Churchill ordenó meses de bloqueo naval en India para ganar la guerra, desatando una catástrofe humanitaria en Bengala. Millones murieron de hambre, y la comunidad internacional condena enérgicamente este crimen de guerra."
  BA_news.100.a:0 "Maldito sea."
  BA_news.100.b:0 "Han traspasado todos los límites."
  BA_news.100.c:0 "Hay que expulsarlos de India."

  BA_news.100.c:0 "Hay que expulsarlos de India."

  BA_news.101.t:0 "El advenimiento de la Segunda Gran Depresión"
  BA_news.101.desc:0 "Con el colapso de la economía estadounidense, la Bolsa de Nueva York cerró prácticamente y Wall Street entró en crisis. Esto ha tenido un efecto catastrófico en toda Europa. Los mercados financieros dependen en gran medida de las inversiones de EE.UU., y el miedo a quiebras y derrumbes financieros se ha extendido.\n\nBancos de Canadá, Italia, España y otros países han cerrado, y miles de ciudadanos se enfrentan al desempleo súbito y la pobreza. Esta catástrofe sacude las estructuras económicas mundiales y alimenta el temor de una nueva Gran Depresión."
  BA_news.101.a:0 "Todos deberían haberlo previsto."
  BA_news.101.b:0 "Queríamos que cayeran, pero no así."
  BA_news.101.c:0 "Se necesitan nuevas políticas."
  BA_news.101.d:0 "¿Somos nosotros los culpables?"
  BA_news.101.e:0 "Nuestros bancos pasarán meses difíciles."

  BA_news.102.t:0 "Coronación de Eduardo VIII"
  BA_news.102.desc:0 "El último monarca en gobernar directamente Gran Bretaña e Irlanda, el rey Jorge V, falleció poco antes de exiliarse en Canadá. Su reinado, como primer monarca de la Casa de Windsor, será recordado por la derrota en las Islas Británicas y la pérdida de la patria. El trono ha pasado al príncipe de Gales, Eduardo, que ahora ostenta el título de Eduardo VIII.\n\nEl rey Eduardo, movido por el deseo de venganza y grandes ambiciones, mantiene tensas relaciones con el Parlamento canadiense. Su promesa de recuperar la metrópoli ha hecho honor a su popularidad entre los exiliados británicos en Canadá."
  BA_news.102.a:0 "¡Que Dios proteja a Su Majestad!"

  BA_news.103.t:0 "¡Vina derrotada!"
  BA_news.103.desc: "El formidable enemigo conocido como 'Vina', que azotaba Egipto, ha sido finalmente derrotado. Egipto recupera la paz y el ánimo de su población se eleva. Aunque la identidad de Vina sigue siendo un misterio, el mundo celebra esta victoria y observa con atención los próximos pasos de Egipto."
  BA_news.103.a: "¡Por fin!"
  BA_news.103.b: "¡Asombroso!"

  BA_news.104.t:0 "Proclamación de [From.GetNameDef]"
  BA_news.104.desc:0 "Después de la declaración paneuropeísta de [From.GetOldAdjective] y varias 'guerras de liberación', la idea de un Estado paneuropeo bajo la ideología del fascismo humano se ha arraigado en toda Europa. Este Estado declara una cruzada contra los países de Kivotos y enaltece el orgullo de los italianos como centro de Europa.\n\nLas tierras consideradas 'liberadas' ya inician su reconstrucción. Con la proclamación oficial de la integración europea, el país pasará a llamarse [From.GetNameDef]."
  BA_news.104.a:0 "¡Europa Unida!"
  BA_news.104.b:0 "¿Lograrán ese vasto sueño?"
  BA_news.104.c:0 "Debemos prepararnos para la guerra."

  BA_news.105.t:0 "Hambruna masiva en Inverno Rojo"
  BA_news.105.desc:0 "El liderazgo de Inverno Rojo no logró organizar un plan de suministros para los millones de estudiantes llegados tras la Gran Guerra. La ciudad se llenó de cadáveres en las colinas y la gente, sin alimentos, recurrió incluso al canibalismo. Quienes aún conservan la cordura huyen a otros países, mientras protestas por raciones y fuego del ejército en respuesta llenan la atmósfera de disparos constantes."
  BA_news.105.a:0 "Una tragedia atroz."

  BA_news.106.t:0 "El fin del mercado negro"
  BA_news.106.desc:0 "El mercado negro, el enclave criminal más temido de Europa surgido tras la Gran Guerra en Kivotos, ha sido erradicado por una operación militar de [FROM.FROM.GetName]. Este grupo traficaba armas ilícitas que desestabilizaban a Kivotos y a los países europeos. Tras esta victoria, el mercado negro no podrá resurgir."
  BA_news.106.a:0 "Una lástima."
  BA_news.106.b:0 "El peor mercado criminal ha cerrado."
  BA_news.106.c:0 "La actividad de los mafiosos cesará."

  BA_news.107.t:0 "Aparición de los Decagramatón"
  BA_news.107.d:0 "En el campo de batalla ha surgido un nuevo tipo de arma viviente sin precedentes: los seres conocidos como Decagramatón. Parecen encarnar la fuerza pura del color."
  BA_news.107.a:0 "Nuestra evolución perfecta."
  BA_news.107.b:0 "Una entidad aterradora."

  BA_news.108.t:0 "Represión brutal en Bretaña"
  BA_news.108.d:0 "Tras la Gran Guerra, las regiones de Bretaña quedaron bajo el control de organizaciones criminales herederas del mercado negro de Kivotos.\n\nRecientemente han iniciado una guerra despiadada contra grupos nacionalistas independentistas bretones, desatando una brutal campaña de represión."
  BA_news.108.a:0 "El miedo es un poderoso instrumento de dominación."
  BA_news.108.b:0 "Verdaderamente horroroso."

  BA_news.109.t:0 "Envío de voluntarios de Millennium"
  BA_news.109.d:0 "Se ha confirmado la presencia de voluntarios de Millennium en plena Guerra Civil Española. Alegan haber acudido 'voluntariamente' para 'resolver la crisis de refugiados' y exigir responsabilidades a las fuerzas beligerantes. Nadie sabe qué impacto diplomático tendrá esta intervención de Kivotos."
  BA_news.109.a:0 "¡Mostremos el poder de nuestra academia!"
  BA_news.109.b:0 "Hay que frenar el hegemonismo de Millennium."

  BA_news.110.t:0 "Intervención total de Millennium"
  BA_news.110.d:0 "Tras varios movimientos sospechosos en los Pirineos, en plena noche se lanzaron bengalas que sirvieron de señal: el ejército de Millennium atravesó simultáneamente la cordillera. Esta total intervención en la Guerra Civil Española desafía a cualquier comisión o alianza, y ha sido duramente criticada. Millennium lo califica de 'operación militar especial', no invasión."
  BA_news.110.a:0 "'Operación militar especial', no invasión."
  BA_news.110.b:0 "¡Debemos detener este hegemonismo desbocado!"

  BA_news.111.t:0 "¡Fiebre de la cultura del otro lado en EE.UU.!"
  BA_news.111.d:0 "En estos momentos, EE.UU. está completamente rendido ante la cultura de otra dimensión. Lo más popular es el ejercicio nacional de Sankai-kei, el 'Ejercicio Fuerte'. Cada mañana, estirar brazos y piernas se ha convertido en una escena cotidiana."
  BA_news.111.a:0 "¡Kisaki sabe lo que hace!"
  BA_news.111.b:0 "Una situación desconcertante."
  BA_news.111.c:0 "Están totalmente chiflados."

  BA_news.112.t:0 "Declaración de EE.UU. sobre la independencia garantizada de Millennium"
  BA_news.112.a:0 "Una decisión sabia."
  BA_news.112.b:0 "¿Acaso crearán un club de ciencia?"

  BA_news.113.t:0 "Declaración de EE.UU. sobre la independencia garantizada del tratado de Edén"
  BA_news.113.a:0 "Una decisión sabia."
  BA_news.113.b:0 "Una alianza muy peculiar."

  BA_news.114.t:0 "Declaración de EE.UU. sobre la independencia garantizada del consejo estudiantil"
  BA_news.114.a:0 "Una decisión sabia."
  BA_news.114.b:0 "¡Nos han traicionado!"

  BA_news.115.t:0 "EE.UU. apoya a Gehenna"
  BA_news.115.a:0 "Saben luchar."
  BA_news.115.b:0 "...¿Podrán atacar la Estatua de la Libertad?"
  BA_news.115.c:0 "Los atentados en EE.UU. se multiplicarán."

  BA_news.116.t:0 "EE.UU. apoya a Trinity"
  BA_news.116.a:0 "Serán mensajeros angélicos."
  BA_news.116.b:0 "Menos mal que están de nuestro lado."
  BA_news.116.c:0 "¡Esto es un desastre!"

  BA_news.117.t:0 "EE.UU. apoya a Inverno Rojo"
  BA_news.117.a:0 "Espero que sea el camino correcto..."
  BA_news.117.b:0 "No lo esperaba, pero bienvenido sea."
  BA_news.117.c:0 "Una declaración sorprendente."

  BA_news.118.t:0 "Proclamación del gobierno legítimo de [WCH.Getleader]"
  BA_news.118.d:0 "Esta mañana, el régimen de Wang Jingwei anunció el fin oficial de la Segunda Guerra Sino-Japonesa y se declaró el gobierno legítimo de China. En Nankín firmaron un acuerdo de paz con Japón, marcando el inicio de un nuevo orden en Asia.\n\nAunque la guerra concluye, la tensión en el Este de Asia permanece alta. La legitimidad de Wang Jingwei y las reacciones internas serán desafíos clave para la estabilidad."
  BA_news.118.a:0 "¡El primer paso hacia la liberación de Asia!"
  BA_news.118.b:0 "Una noticia inquietante..."

  BA_news.119.t: "[FRA.getname] se retira de Indochina"
  BA_news.119.d: "Las autoridades francesas reconocieron que ya no podían mantener su dominio en Indochina. Tras negociar con Ho Chi Minh, el gobierno colonial recuperó sus activos y se retiró, concediendo finalmente la independencia a la región."
  BA_news.119.a: "La mejor de las opciones."
  BA_news.119.b: "El colonialismo francés se desvanece."
  BA_news.119.c: "¡Victoria de la lucha anticolonial!"

  BA_news.120.t:0 "[USA.getname] se une a la Internacional Comunista"
  BA_news.120.d:0 "Hoy el mundo recibió la sorprendente noticia: Estados Unidos, gobernado por el Partido Laborista, ha ingresado en la Internacional Comunista. Esta decisión impacta a todos, sin importar ideología, nación o especie."
  BA_news.120.a:0 "No hay enemigos eternos."
  BA_news.120.b:0 "¡Bienvenido, camarada!"
  BA_news.120.c:0 "¿Qué está ocurriendo?"

  BA_news.121.t: "[USA.getname] declara partido comunista"
  BA_news.121.d: "En Washington se anunció un giro diplomático radical: EE.UU. criticó duramente a la URSS como un 'régimen autoritario oligárquico' y, al mismo tiempo, se proclamó verdadero faro del progreso y del socialismo. Moscú no ha reaccionado, pero el choque parece inevitable."
  BA_news.121.a: "¡Proletarios de todos los países, uníos!"
  BA_news.121.b: "Qué arrogantes."
  BA_news.121.c: "Otra plaga roja ha nacido."

  BA_news.125.t: "Trotski resiste"
  BA_news.125.d: "Tras exiliarse en Noruega, Trotski se acercó al centro de [RED.getname] y sobrevivió a varios intentos de asesinato, refugiándose gracias a la protección del servicio de guardia.\n\n«No temo a la muerte. La revolución persiste por la fuerza de la ideología, no de los individuos; la persecución de Stalin solo demuestra su miedo a la justicia», declaró Trotski. Poco después, decenas de personas ligadas a supuestos vínculos con la URSS fueron arrestadas, mostrando que Trotski está ahora prácticamente fuera de peligro soviético."
  BA_news.125.a: "¡La anti-Stalinismo permanece firme!"
  BA_news.125.b: "Los contrarrevolucionarios campan a sus anchas."
  BA_news.125.c: "¿Los comunistas disfrutan dividiéndose?"

  BA_news.126.t:0 "'Disturbios lamentables'"
  BA_news.126.d:0 "El consejo estudiantil está convulsionado. Tras la desaparición de su presidenta, la clausura de la academia SRT desató la resistencia de las unidades FOX y RABBIT, que ocuparon primero el edificio principal y luego el parque Kousagi. La policía movilizó efectivos, pero sin erradicar a estas fuerzas especiales apoyadas por suministros anónimos.\n\nEl comité ejecutivo anunció una 'respuesta contundente' y convocó una sesión de emergencia."
  BA_news.126.a:0 "¡Deberían haber cerrado la academia antes!"
  BA_news.126.b:0 "Aun así, defienden su escuela..."

  BA_news.127.t:0 "'Señales fantasma en Kivotos'"
  BA_news.127.d:0 "En todo Kivotos se captan señales débiles que parecen emitirse desde el norte de las Islas Británicas. Tras su detección, autómatas y robots de seguridad han mostrado comportamientos anómalos, y unidades robóticas enteras han desaparecido súbitamente en varias regiones.\n\nMillennium Science School informa que un grupo de robots intentó apoderarse de un buque en el Canal de Dover y luego quedó inmovilizado sin revelar información. Antes de apagarse, sus voces susurraron: 'Él vendrá' y 'Jenikó se acerca', como poseídos por una presencia."
  BA_news.127.a:0 "Es nuestro turno..."
  BA_news.127.b:0 "¿Qué les ha ocurrido?"

  BA_news.128.t: "Colapso de Mienji Moje"
  BA_news.128.d: "A pesar de la férrea resistencia, el imparable avance de [SOV.getname] humilló a Polonia y sus aliados. Solo Polonia se prepara para una última defensa, mientras los demás buscan acuerdos individuales con la URSS."
  BA_news.128.a: "Eran un puñado de ineptos."

  BA_news.129.t:0 "Procedimiento de cierre de SRT"
  BA_news.129.d:0 "Hoy se inició la clausura de la academia especial SRT, acusada de masacrar a la Casa de Orange-Nassau tras la Gran Guerra. La mayoría de sus alumnos fue absorbida por Valkyrie, pero las unidades FOX y RABBIT se rebelaron, fueron rápidamente derrotadas y encarceladas. Se desconocen más detalles."
  BA_news.129.a:0 "El destino final de Zorro y Conejo."

  BA_news.130.t:0 "'Caos radioeléctrico en Kivotos'"
  BA_news.130.d:0 "A primera hora se produjo una interferencia masiva en las transmisiones debido a la señal fantasma. Autómatas y robots quedaron pirateados, y un autoproclamado Decagramaton declaró un 'Último Mensaje': la guerra entre razas solo terminará con la aniquilación de una, y propone disolver todos los ejércitos y aceptarlo.\n\nTras su comunicado, robots y autómatas intensificaron protestas y ocurrieron atentados en varios campus. Expertos creen que es un ataque planificado desde hace tiempo."
  BA_news.130.a:0 "Ha llegado la hora..."
  BA_news.130.b:0 "Se acerca algo más grande."

  BA_news.131.t:0 "Escándalo de S.C.H.A.L.E"
  BA_news.131.d:0 "El club federal de investigación S.C.H.A.L.E, creado por orden directa de la presidenta, exigió la fusión con el consejo estudiantil alegando legitimidad. El gabinete [COU.Getleader] y el comité ejecutivo lo clasificaron como un 'error mecánico' y rechazaron la fusión. S.C.H.A.L.E respondió entregando una declaración de guerra, desatando el escándalo."
  BA_news.131.a:0 "¡Esto no está bien!"
  BA_news.131.b:0 "¿Error mecánico? Ridículo."

  BA_news.132.t:0 "Impeachment de la interina Rin"
  BA_news.132.d:0 "Un tumulto político sacudió el consejo estudiantil. Tras la lucha por el poder, se aprobó la moción de censura contra Rin, jefa de gabinete, que ahora está retenida bajo arresto domiciliario. Kaya Shiranui, jefa de defensa y nueva presidenta interina, prometió restablecer la estabilidad y erradicar amenazas externas. Sin embargo, su nombramiento aún no es reconocido por otras academias."
  BA_news.132.a:0 "¡Brindemos por la interina Kaya!"
  BA_news.132.b:0 "Una marea oscura."

  BA_news.133.t:0 "Kaya Shiranui es nombrada presidenta"
  BA_news.133.d:0 "Como esperaban los expertos, Kaya Shiranui, jefa de defensa, fue elegida por unanimidad como presidenta del consejo estudiantil. Rechazando el legado de su predecesora, recuperó el control de Santum Tower gracias al Sittim Box, aunque no logra reconocimiento pleno. Tras su toma de posesión, solicitó visita a Inverno Rojo; su entrada fue denegada, evidenciando la inestabilidad de su puesto.\n\nKaya Shiranui expresó ‘profunda pena’ hacia Inverno Rojo y volvió a solicitar ingreso, sin respuesta."
  BA_news.133.a:0 "Un aplauso para la presidenta Kaya!"
  BA_news.133.b:0 "Este será un reinado incierto."

  BA_news.134.t:0 "¡Lucha de la no posesión!"
  BA_news.134.d:0 "Cerca de Santum Tower ha surgido un nuevo movimiento: ‘So.Hwa.Haeng.’, liderado por Descartes, rechaza la reeducación social impuesta y promueve la lucha de la no posesión. Con apoyo de trabajadores neerlandeses y flamencos, desafían el control de Valkyrie y fomentan la no posesión a nivel pan-Kivotos-Europa.\n\nNo obstante, escándalos sobre la vida privada de Descartes en internet han mermado la popularidad del movimiento."
  BA_news.134.a:0 "¡Habla coherencia!"
  BA_news.134.b:0 "Interesante."

  BA_news.135.t:0 "El fin de la guerra ideológica"
  BA_news.135.d:0 "En la vasta estepa rusa, cesaron los disparos. El velo del campo de batalla se alzó, revelando que [RED.getname] controla todo [SOV.GetAdjective]. Muchos estalinistas huyen al exilio. Lo cierto es que la era de Stalin ha concluido."
  BA_news.135.a:0 "La era oscura del comunismo."
  BA_news.135.b:0 "La verdadera victoria histórica."
  BA_news.135.c:0 "Dos ramas comunistas se han reunido."

  BA_news.136.t:0 "Lanzamiento del I‑Phone"
  BA_news.136.d:0 ""... y hoy anunciamos con orgullo el I‑Phone, el progreso de la humanidad."\n\nPhillips sorprendió a Kivotos presentando esta maravilla. Se decía que la tecnología kivotense era inalcanzable, pero el respaldo del consejo estudiantil impulsó este gran avance. Aunque inferior al modelo local, su precio y rendimiento han conquistado a la gente.\n\nGobiernos de todo el mundo apresuran su adopción, y Phillips expande proyectos de redes de comunicación y energía."
  BA_news.136.a:0 "Es realmente impresionante."

  BA_news.137.t:0 "Coronación de la reina Kaya Shiranui"
  BA_news.137.d:0 "Para los neerlandeses, ha llegado la oscuridad. Tras el asesinato de la reina Guillermina a manos de SRT, el reino quedó sin monarca. Hoy, en una fastuosa ceremonia –con discursos de Alfred Heaton y Léon Degrelle–, Kaya Shiranui asumió el trono. Se invitó a Leopoldo III y [HEU.GetLeader], quienes no asistieron."
  BA_news.137.a:0 "¡Niederlande no muere por un espectáculo!"
  BA_news.137.b:0 "El protocolo reina parece forzado."
  BA_news.137.c:0 "¡Dos muertes de Holanda en una!"

  BA_news.138.t:0 "Tratado de Viena"
  BA_news.138.d:0 "La huelga general siria, iniciada en diciembre, se convirtió en un movimiento anticolonial en todo el Medio Oriente francés. Aunque el parlamento frío rechazó diálogos, Pétain firmó un acuerdo para concentrarse en la metrópoli. Siria y Líbano quedan libres de dominio francés, y las tropas se retirarán en dos meses."
  BA_news.138.a:0 "El colonialismo agoniza."

  BA_news.139.t:0 "Formación del Frente de Liberación Robot de Kivotos"
  BA_news.139.d:0 "Se ha organizado un ejército rebelde de robots en Kivotos, desatando el caos en varias regiones."
  BA_news.139.a:0 "Esto es catastrófico."

 BA_news.140.t:0 "Aprobación del Frente de Stresa"
 BA_news.140.desc:0 "Ante el agravamiento día a día de la amenaza de otros mundos, el bando [ENG.GetAdjective] anunció oficialmente la reautorización del ‘Frente de Stresa’, capaz de desempeñar el papel de un frente común anti-Kivotos.\n\nEn este proceso, el gobierno [ENG.GetAdjective] está volviendo a convocar a los antiguos países signatarios del tratado, mostrando movimientos para resucitar una vez más el Frente de Stresa, que se había vuelto una mera formalidad.\n\nSin embargo, la continuidad del Frente de Stresa no está garantizada. Si siquiera uno de los países signatarios rechaza la aprobación formal o retira su cooperación, este frente volverá a enfrentarse al peligro de desintegrarse."
 BA_news.140.a:0 "¡Es un desarrollo sorprendente!"
 BA_news.140.b:0 "Esto, como sea, no suena bien..."
 BA_news.140.c:0 "¡Es el primer paso hacia la recuperación del territorio nacional!"
 BA_news.140.d:0 "¿Quizá obtengamos un aliado fiable?"
 BA_news.140.e:0 "Habrá que revisarlo."

 BA_news.141.t:0 "Extraños rumores desde las Islas Británicas"
 BA_news.141.desc:0 "Circulan inquietantes rumores provenientes de fuerzas antigubernamentales que afirman haber escapado de las Islas Británicas. Según el contenido del rumor, tras arrestar a las fuerzas que se oponen a la IA que gobierna actualmente las islas, estarían almacenando en un mundo virtual los datos mentales extraídos del cerebro; se sostiene que algunas personalidades son sometidas a ‘aislamiento permanente’ y que otras se utilizan para la extracción de información.\n\nSe afirma que dicho mundo virtual reconstruye y muestra el momento en que el usuario fue más feliz basándose en los recuerdos extraídos del cerebro, y que, dentro de la comodidad del mundo virtual, se iba lavando el cerebro de forma gradual.\n\nAnte esto, organizaciones éticas de las academias han exigido una “Declaración de Derechos Digitales sin Fronteras” y han instado a que se lleve a cabo una investigación a nivel de academias y del Consejo General de Estudiantes."
 BA_news.141.a:0 "Fue una medida necesaria"
 BA_news.141.b:0 "Si esto es cierto... es realmente horrible"

 BA_news.142.t:0 "¡Ola de atentados simultáneos en todo Kivotos!"
 BA_news.142.desc:0 "Se han producido atentados simultáneos y organizados en todo Kivotos, dirigidos contra organismos administrativos y cadenas de mando militar. En Millennium, se sucedieron explosiones y tiroteos cerca del campus, y se han reportado ataques similares en Trinity y en Gehenna Shanhaijing.\n\nSe estima que en estos atentados se utilizaron bombas especiales capaces de destruir halos. El número de víctimas civiles confirmadas solo en cada academia asciende a varios miles, y como una parte considerable se encuentra en estado grave, se prevé que el número de fallecidos también aumente de forma drástica. Cada academia ha calificado este ataque como una ofensiva organizada sin precedentes y ha declarado una investigación a gran escala.\n\nLos expertos consideran que estos atentados simultáneos organizados son obra del recientemente formado ‘Frente de Liberación’, y juzgan que el intento de neutralizar las cadenas de mando militar significa que una invasión es inminente, por lo que se declaró de inmediato el estado de emergencia."
 BA_news.142.a:0 "Esto es solo el comienzo."
 BA_news.142.b:0 "Envía a C&C"
 BA_news.142.c:0 "La capital milenaria, Edén, no caerá con algo así."
 BA_news.142.d:0 "Ibuki... ¿Ibuki está a salvo?"
 BA_news.142.e:0 "¡Reúnan a los miembros del Comité Disciplinario!"
 BA_news.142.f:0 "Se avecina una tormenta de nieve..."
 BA_news.142.g:0 "Esto no tiene nada de hardboiled..."
 BA_news.142.h:0 "Bajo ninguna circunstancia el terrorismo puede ser tolerado."

 BA_news.143.t:0 "Declaración de apoyo mecánico para la reconstrucción"
 BA_news.143.desc:0 "La IA que recientemente expulsó a Gematria y asumió el poder en el norte de las Islas Británicas ha enviado un telegrama oficial a todas las academias de Kivotos. Esta IA expresó su profunda preocupación por la devastación de la infraestructura tras la Gran Transición y el caos extremo derivado de ello, y manifestó su intención de enviar unidades de apoyo a la reconstrucción compuestas por maquinaria automatizada y autómatas, ofreciendo ayuda humanitaria.\n\nSe espera que la tecnología de automatización de última generación y la alta capacidad productiva de estas unidades de apoyo se conviertan en un poderoso medio para superar rápidamente la crisis que enfrentan actualmente los Estados Académicos, destacando especialmente en construcción, producción de suministros y restauración de infraestructura.\n\nSin embargo, algunos sectores advierten que la ‘ideología extrema orientada a la paz’ que esta IA defiende podría convertirse en la semilla de un nuevo conflicto."
 BA_news.143.a:0 "..."
 BA_news.143.b:0 "¿Que las máquinas nos apoyen?"

 BA_news.144.t:0 "Reunificación de Gehenna por parte de [GEM.GetName]"
 BA_news.144.desc:0 "La Gehenna que estaba dividida ha sido reintegrada hoy en una sola bajo el bando de [GEM.GetLeader]. Hasta ahora, Gehenna había estado fragmentada en dos fuerzas militares: la Pandemonium Society y el Comité Disciplinario, pero la división de Gehenna llegó a su fin gracias al liderazgo de [GEM.GetLeader]. Sin embargo, las semillas de la discordia aún permanecen. Antiguos miembros del Comité Disciplinario no juran lealtad al nuevo gobierno, y se prevé que la restauración del poder nacional devastado por la guerra llevará tiempo.\n\nAun así, la reunificación de Gehenna por parte de [GEM.GetName] es sin duda un acontecimiento histórico, y tras la reconstrucción de las ruinas, Gehenna podría volver a alzarse como una poderosa academia."
 BA_news.144.a:0 "¡Por la gloria!"
 BA_news.144.b:0 "Gehenna vuelve a ser una"
 BA_news.144.c:0 "La situación en Kivotos está cambiando drásticamente"

 BA_news.145.t:0 "¡Invasión de Millennium!"
 BA_news.145.desc:0 "Esta mañana comenzó una invasión total de las fuerzas mecánicas en el norte de Millennium. Millennium parece ir ganando contra el ‘Ejército de Liberación’, pero, según el Departamento de Inteligencia, se ha confirmado que numerosas naves de transporte se están desplazando por el Estrecho de Dover para apoyar al Ejército de Liberación. Ya se informa de que en algunas zonas del frente se han avistado enormes armas conocidas como ‘Profetas’, por lo que se prevé que la situación de Millennium se deteriore.\n\nSeminar proclamó de inmediato la lucha hasta el final, y Millennium estableció una línea defensiva centrada en Eridu, pero ante la creciente ofensiva mecánica, parece difícil que Millennium pueda detenerla por sí sola."
 BA_news.145.a:0 "Por un futuro brillante"
 BA_news.145.b:0 "¡Defiendan Eridu a toda costa!"
 BA_news.145.c:0 "El comienzo de otra masacre"

 BA_news.146.t:0 "Ibuki"
 BA_news.146.desc:0 "Han pasado dos semanas desde que se produjeron atentados indiscriminados en todo Kivotos mediante drones, y hasta ahora no se ha confirmado si Tanga Ibuki, la mascota de la Pandemonium Society, está viva o muerta, lo que ha llevado a muchas personas a expresar su preocupación. Algunos incluso han planteado la posibilidad de que Ibuki ya hubiera sido víctima de aquel ataque con drones ocurrido hace dos semanas.\n\nAnte esto, hoy la Pandemonium Society anunció oficialmente, mediante un comunicado, que Tanga Ibuki falleció trágicamente debido al ataque indiscriminado e inhumano perpetrado por las fuerzas de Decagrammaton. La Pandemonium Society también condenó enérgicamente a las fuerzas de Decagrammaton responsables del ataque y proclamó: “Habrá una represalia firme y un castigo exhaustivo contra las fuerzas mecánicas extremistas que arrebataron brutalmente una vida infantil.”"
 BA_news.146.a:0 "No había otra opción..."
 BA_news.146.b:0 "Ibuki..."
 BA_news.146.c:0 "Una vida tan joven fue sacrificada"

 BA_news.147.t:0 "¿Qué impacto tuvo el Misticismo en la humanidad?"
 BA_news.147.desc:0 "Tras la Gran Transición, existían conjeturas de que pequeñas cantidades de misticismo esparcidas por todo el mundo habrían influido en la humanidad de alguna manera. Un artículo publicado por una fuerza anónima ha aumentado la probabilidad de que esto sea cierto.\n\nSegún dicho artículo, se ha confirmado que quienes han sido profundamente influenciados por el misticismo destacan enormemente en la comunicación con otros y en empatizar y compartir emociones. Incluso sin lenguaje ni información visual, se confirmó que pueden percibir el estado emocional o las intenciones del otro y empatizar, posibilitando una comprensión profunda mutua.\n\nSin embargo, la fuerza anónima expresó una visión negativa del futuro en las recomendaciones del artículo, afirmando: “Esta capacidad de comprender al prójimo solo se está utilizando en la guerra. Tal vez se trate de una triste mutación nacida del conflicto. El colapso de la civilización podría llegar antes que el tiempo necesario para comprendernos mutuamente.”"
 BA_news.147.a:0 "Nuestros resultados de investigación justifican nuestras acciones"
 BA_news.147.b:0 "Pobres personas..."
 BA_news.147.c:0 "Si pudiéramos comunicarnos sin malentendidos... ¿podría llegar la paz?"

 BA_news.148.t:0 "El Segador Plateado de Islandia"
 BA_news.148.desc:0 "Las fuerzas de élite conjuntas de varias naciones, enviadas para buscar supervivientes en Islandia, han desaparecido por completo. En el lugar solo quedaron rastros de un combate brutal, y la única pista hallada fue una sola chica conocida como el ‘Segador Plateado’. Junto con esta impactante tragedia, presagios de ‘Color’, que amenaza con devorar el mundo, han sido observados simultáneamente en diversas regiones, sumiendo al mundo en un caos colosal."
 BA_news.148.a:0 "Es lamentable para ellos"
 BA_news.148.b:0 "¿Ese tipo es una estudiante de Abydos?"
 BA_news.148.c:0 "Una maldita monstruo... habrá que prepararse a fondo"

 BA_news.149.t:0 "Inicio de la Operación de Paz en Bretaña"
 BA_news.149.desc:0 "Tras la Gran Transición, Bretaña se convirtió en una zona sin ley, donde las organizaciones criminales prácticamente tomaron control de toda la administración. Las academias consideraron intervenir en Bretaña en el pasado, pero la desaparición del presidente del Consejo General de Estudiantes y el aumento de la tensión bélica en Kivotos hicieron que el asunto fuera olvidado.\n\nSin embargo, hoy se ha informado que las fuerzas mecánicas han iniciado una operación policial y militar para restaurar el orden en Bretaña. Se declaró que esta operación tiene como objetivo la estabilidad y la preservación de los ciudadanos de Bretaña, así como la ejecución estricta contra los grupos criminales.\n\nLa mayoría de los Estados Académicos evitan pronunciarse al respecto, y algunos cuestionan si la fuerza mecánica, obsesionada de forma fanática con la paz, realmente se detendrá en la Operación de Paz en Bretaña. Existe la percepción de que esta invasión, en sí misma, se interpreta como un mensaje dirigido a todo Kivotos."
 BA_news.149.a:0 "Por la paz"
 BA_news.149.b:0 "Es preocupante"
 BA_news.149.c:0 "Una zona sin ley menos"

 BA_news.150.t:0 "La Guerra del Fin"
 BA_news.150.desc:0 "La fuerza mecánica ‘Decagrammaton’ ha iniciado una ofensiva militar total contra las fuerzas restantes de Kivotos, movilizando a todas sus legiones mecánicas. Los ataques simultáneos en todos los frentes incluyen grandes unidades blindadas y escuadrones aéreos destinados a dominar el cielo, y se ha informado de que múltiples entidades especiales, denominadas ‘Profetas’, están rompiendo las líneas defensivas en la vanguardia. Este ataque es analizado como una invasión sistemática cuyo objetivo es la subyugación de todos los organismos vivos, más allá de un simple conflicto local.\n\nLos líderes de las principales academias han definido oficialmente este conflicto como una ‘Guerra del Fin’, en la que está en juego la supervivencia de la civilización, y han declarado de inmediato la movilización general. Un portavoz de Gehenna afirmó: “Esto no es una guerra para negociar, sino una guerra de exterminio”, y añadió: “Será la última resistencia de toda vida inteligente.”"
 BA_news.150.a:0 "Por la paz"
 BA_news.150.b:0 "Luchen hasta el final"
 BA_news.151.t:0 "El fin de Schale"
 BA_news.151.desc:0 "Esta madrugada, todas las comunicaciones del distrito autónomo ‘Schale (SCHALE)’, considerado una esperanza para Kivotos incluso después de la desaparición del Consejo General de Estudiantes, se interrumpieron por completo. Según fuentes que lograron acercarse al lugar, Schale fue completamente ocupada por las legiones mecánicas de Decagrammaton, y se confirmó que no hubo resistencia interna.\n\nLa noticia más trágica es que la ‘Caja de Sitdim’, el sistema central de Schale, finalmente guardó silencio. La señal de la IA administradora ‘Arona’ se ha extinguido por completo, y se estima que el sistema actualmente se encuentra bajo el control de Decagrammaton.\n\nAl mismo tiempo, se observaron cambios alarmantes en la Torre Sanctum, símbolo de Kivotos. Durante la noche, la torre fue recubierta por metales desconocidos y un resplandor dorado, transformándose en una gigantesca aguja mecánica cuya forma original ya no se puede reconocer."
 BA_news.151.a:0 "Avanzaremos"
 BA_news.151.b:0 "..."

 BA_news.153.t:0 "La Segunda Guerra Civil Estadounidense"
 BA_news.153.desc:0 "El último legado de la Gran Transición finalmente ha llegado a Estados Unidos. La Segunda Gran Depresión y los conflictos políticos y sociales derivados de ella se convirtieron, en menos de cien años, en el detonante para que el norte y el sur de Estados Unidos se enfrentaran entre sí. El gobierno del presidente [CSA.GetLeader] de los Estados Confederados del Sur y su delegación imitaron el discurso de Jefferson Davis y declararon oficialmente su retirada de la Unión.\n\nEl gobierno federal lo declaró traición e inició de inmediato los procedimientos de respuesta, mientras que los estados del Rust Belt, aterrados ante la segunda guerra civil, elevaron al general Omar Bradley como comandante y parecen haber conformado una zona neutral voluntaria."
 BA_news.153.a:0 "¡Cuelguen a los traidores!"
 BA_news.153.b:0 "La casa está dividida."

 BA_news.154.t:0 "Las negociaciones balcánicas, reducidas a una formalidad"
 BA_news.154.desc:0 "Con el objetivo de construir un frente común contra los planes de expansión territorial de Bulgaria, el ‘Pacto Balcánico’, firmado en Atenas en 1934 por [GRE.getadjective], [ROM.getadjective], [TUR.getadjective] y [YUG.getadjective], buscaba preservar el statu quo geopolítico de la región tras el fin de la Gran Guerra. Sin embargo, tras la Gran Transición, al cambiar la estructura geopolítica, las partes implicadas en las negociaciones balcánicas han optado por arreglárselas por su cuenta. Los países firmantes ya no garantizarán la independencia mutua, y esto hará que la influencia [ITA.GetAdjective] en los Balcanes se intensifique."
 BA_news.154.a:0 "Se enciende la mecha del polvorín."

 BA_news.155.t:0 "Declaración soviética de liberación de Europa"
 BA_news.155.desc:0 "Para conmemorar la victoria que [SOV.GetAdjective] ha obtenido recientemente contra los Estados Académicos de Kivotos, desde esta mañana se está realizando un enorme desfile militar en [SOV.GetCapitalVictoryPointName]. El líder [SOV.GetLeader] de [SOV.GetAdjective] pronunció un discurso celebrando la gran victoria. En su discurso, [SOV.GetLeader] declaró: “Hemos logrado una victoria sin precedentes. La fuente de este gran triunfo reside en la unidad de la nación [SOV.GetAdjective], en la inmensa fuerza del ejército, y en el valor y la capacidad de trabajo del pueblo [SOV.GetAdjective].”"
 BA_news.155.a:0 "¡Gloria eterna a los héroes que lucharon por la patria!"
 BA_news.155.b:0 "¿Liberadores de Europa o nuevos dominadores?"

 BA_news.156.t:0 "La Resolución de Le Bœuf de [Getyear]"
 BA_news.156.desc:0 "Los embajadores de los países miembros de [POL.getfactionname] se reunieron en Le Bœuf con los líderes de [RSA.getname]. Reconociendo que, para poner fin al régimen de [SOV.getname], es indispensable la actividad de [RSA.getname] y el apoyo a esta, resolvieron consolidar una alianza orientada al cumplimiento de sus objetivos, estableciendo con [RSA.getname] un sistema de cooperación militar estrecha con [POL.getfactionname]."
 BA_news.156.a: "¡Al fin del régimen de [SOV.getname]!"
 BA_news.156.b: "¡Traidores!"
 BA_news.156.c: "Astutos."

 BA_news.157.t:0 "El colapso de [GEM.GetName]"
 BA_news.157.desc.makoto:0 "Con el edificio del parlamento de la Pandemonium Society ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, Hanuma Makoto, el carisma de la Pandemonium Society y su líder desde antes de la Gran Transición, no tuvo más remedio que reconocer la derrota total del bando [GEM.GetName].\n\nEn lugar de huir, Makoto se rindió dócilmente al ejército [ROOT.GetAdjective], pero mientras ella contactaba personalmente con el ejército vencedor para la declaración formal de rendición, sus allegados y la guardia personal ganaron tiempo para poder exiliarse en el extranjero. Incluso el bando de [ROOT.GetLeader] se mostró muy sorprendido por el noblesse oblige, mayor de lo esperado, que Makoto demostró."
 BA_news.157.desc.ibuki:0 "Con el edificio del parlamento de la Pandemonium Society ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, Tanga Ibuki, símbolo de la Pandemonium Society y dama noble de Gehenna, no tuvo más remedio que reconocer la derrota total del bando [GEM.GetName].\n\nJusto antes de la derrota, Ibuki dejó personalmente un mensaje de agradecimiento a los compañeros de la Pandemonium Society que más apreciaba y se entregó al bando [ROOT.GetAdjective]. La rendición de [ROOT.GetName] parece significar el fin de la historia de la Pandemonium Society."
 BA_news.157.desc.satsuki:0 "Con el edificio del parlamento de la Pandemonium Society ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni la NK Ultra ni ninguna otra tecnología científica puede cambiar la derrota de la Pandemonium Society.\n\nJusto antes de la derrota, Satsuki dejó personalmente un mensaje de agradecimiento a los compañeros de la Pandemonium Society que más apreciaba y se entregó al bando [ROOT.GetAdjective]. La rendición de [ROOT.GetName] parece significar el fin de la historia de la Pandemonium Society."
 BA_news.157.desc.chiaki:0 "Con el edificio del parlamento de la Pandemonium Society ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni siquiera la pluma de Chiaki, la periodista más capaz de la Pandemonium Society, puede cambiar el curso de la guerra.\n\nJusto antes de la derrota, Chiaki dejó personalmente un mensaje de agradecimiento a los compañeros de la Pandemonium Society que más apreciaba y se entregó al bando [ROOT.GetAdjective]. La rendición de [ROOT.GetName] parece significar el fin de la historia de la Pandemonium Society."
 BA_news.157.desc.iroha:0 "Con el edificio del parlamento de la Pandemonium Society ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, incluso Iroha, la estratega de la Pandemonium Society, ya no puede hablar de una ‘victoria de la Pandemonium Society’.\n\nIroha, al mando de la última división, subió personalmente a Toramaru y combatió contra el ejército [ROOT.GetAdjective], hasta convertirse heroicamente en prisionera. Aunque fue derrotada, la resistencia de Iroha causó un gran impacto en muchos ciudadanos."
 BA_news.157.desc.generic:0 "Con el edificio del parlamento del distrito central de Gehenna ocupado por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que la historia de la Pandemonium Society, heredera del consejo estudiantil de Gehenna, ha llegado a su fin. Los burócratas ya están redactando los documentos de rendición y entablando negociaciones tardías."
 BA_news.157.a:0 "¿Significa esto el fin de [GEM.GetName]?" # país de Kivotos
 BA_news.157.b:0 "¡Algo enorme está ocurriendo en Kivotos!" # país no-Kivotos

 BA_news.158.t:0 "El colapso de [GEH.GetName]"
 BA_news.158.desc.ako.generic:0 "Con la sede del Comité Disciplinario ocupada por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni siquiera Sorazaki Hina, la legendaria líder militar de Gehenna, tiene ya fuerzas para cambiar el curso de la guerra.\n\nDebido a la inestabilidad emocional posterior a la Gran Transición, Hina, que dependía psicológicamente de Amau Ako, quedó tan abatida que ni siquiera podía redactar una declaración de rendición o cualquier otra cosa; sin poder siquiera cambiarse el pijama rosa, se subió al coche de Ako y huyó al extranjero."
 BA_news.158.desc.ako.nagisa:0 "Con la sede del Comité Disciplinario ocupada por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni siquiera Sorazaki Hina, la legendaria líder militar de Gehenna, tiene ya fuerzas para cambiar el curso de la guerra.\n\nDebido a la inestabilidad emocional posterior a la Gran Transición, Hina, que dependía psicológicamente de Amau Ako, quedó tan abatida que ni siquiera podía redactar una declaración de rendición o cualquier otra cosa; y se dice que, hasta el momento de presentarse en la mesa de capitulación bajo la garantía de seguridad de Nagisa, abandonó todo y llevó una vida de reclusión en su casa."
 BA_news.158.desc.hina:0 "Con la sede del Comité Disciplinario ocupada por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni siquiera Sorazaki Hina, la legendaria líder militar de Gehenna, tiene ya fuerzas para cambiar el curso de la guerra.\n\nSorazaki Hina combatió contra el ejército [ROOT.GetAdjective] en el último frente y fue capturada heroicamente. Aunque fue derrotada, la resistencia de Hina causó un gran impacto en muchos ciudadanos."
 BA_news.158.desc.iori:0 "Con la sede del Comité Disciplinario ocupada por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que ni siquiera Sorazaki Hina, la legendaria líder militar de Gehenna, tiene ya fuerzas para cambiar el curso de la guerra.\n\nTras ceder toda su autoridad a Shiromi Iori, Sorazaki Hina fue capturada mientras ayudaba a los refugiados a huir al extranjero en la zona fronteriza. Que Hina haya sido capturada parece significar el colapso total del Comité Disciplinario de Gehenna."
 BA_news.158.desc.generic:0 "Con la sede del Comité Disciplinario ocupada por el ataque del bando [ROOT.GetNameDef], y las banderas [ROOT.GetAdjective] ondeando en las ciudades clave, parece que la historia del Comité Disciplinario de Gehenna ha llegado hoy a su fin. Los burócratas del Departamento de Planificación entregaron los documentos de rendición a las fuerzas de ocupación [ROOT.GetAdjective], y ahora la influencia del Comité se reduce al nivel de guerrillas locales."
 BA_news.158.a:0 "¿Significa esto el fin de [GEH.GetName]?" # país de Kivotos
 BA_news.158.b:0 "¡Algo enorme está ocurriendo en Kivotos!" # país no-Kivotos

 BA_news.159.t:0 "El colapso de [TRM.GetName]"
 BA_news.159.desc.generic:0 "En la guerra Gehenna–Trinity, parece que [TRM.GetNameDef] ha entrado ya en su fase final.\n\nLa mayor parte de su territorio ya ha sido devorada por las tropas de Gehenna, y lo único que queda son fuerzas remanentes con la moral por los suelos, acosadas por deserciones masivas. Aun así, continúan resistiendo, esperando que un milagro los salve, incluso cuando casi toda esperanza se ha extinguido.\n\nDe hecho, algunos líderes [TRM.GetAdjective] ya se han reunido con generales de las fuerzas hostiles para negociar los términos de una rendición total inevitable."
 BA_news.159.a:0 "¿Significa esto el fin de [TRM.GetName]?" # país de Kivotos
 BA_news.159.b:0 "¡Algo enorme está ocurriendo en Kivotos!" # país no-Kivotos

 BA_news.160.t: "La Declaración de Granada"
 BA_news.160.d: "[SPR.getname] y [FRA.getname] han unido fuerzas para superar la pérdida territorial causada por la Gran Transición. Ambos gobiernos condenan a [WHY.getname] y [MIL.getname], los dos ejes del bolchevismo de otro mundo, y este tratado —destinado a apoyarse mutuamente en la Segunda Reconquista y en la batalla decisiva por la recuperación del territorio nacional, y a mantener la cooperación diplomático-militar en el futuro— fue proclamado en Granada, donde [SPR.getadjective] completó la Reconquista en su historia pasada, mostrando así una voluntad firme respecto a sus objetivos."
 BA_news.160.a: "¡Viva el bloque anti-Kivotos!"
 BA_news.160.b: "¿Bolchevismo de otro mundo?"

 BA_news.161.t: "Asunción de Kaya como presidenta interina"
 BA_news.161.d: "La lucha por el poder en torno al cargo interino del Consejo General de Estudiantes parece haber concluido con el fin del gobierno interino de Rin. Según lo revelado en la conferencia de prensa de esta mañana, la votación de censura para suspender las facultades del interinato fue aprobada sin problemas con el respaldo de la mayoría de los altos cargos del Consejo General de Estudiantes, y Nanagami Rin fue destituida.\n\nLa votación inmediata para elegir a la siguiente interina concluyó por unanimidad con la elección de Shiranui Kaya, de la Oficina de Defensa. Aunque la Oficina de Transporte y la Oficina de Coordinación no reconocen a la nueva interina, parece que el rumbo del poder ya se ha inclinado hacia la Oficina de Defensa."
 BA_news.161.a: "Deseémosle suerte a la nueva interina."
 BA_news.161.b: "Es de mal agüero."

  BA_nuke.0.t:0 "Arona bajo ataque nuclear"
  BA_nuke.0.d:0 "[SHE.GetName], la IA central de Arona, sufrió un ataque nuclear directo esta madrugada. A pesar de contar con defensas antiaéreas, el núcleo de IA quedó muy dañado. Aunque parezca un fin, varias medidas de contingencia permitirán una recuperación sorprendentemente rápida."
  BA_nuke.0.a:0 "[SHE.GetName] ¿está al borde del colapso?"
  BA_nuke.0.b:0 "Ah."

  fallnews.1.t:0 "Caída de Edén"
  fallnews.1.d:0 "La milenaria capital Edén de Trinity fue tomada por las fuerzas de Gehenna. Su catedral ahora ondea la enseña gehenna, y la antigua joya de Trinity ha dejado de existir."
  fallnews.1.a:0 "¿Edén ha caído?"

  fallnews.2.d:0 "Tras un asalto masivo del ejército soviético, Edén, la milenaria capital de Trinity, fue capturada. Divisiones de tanques invadieron la ciudad, y la catedral ahora muestra la bandera roja de la URSS.\n\nEl oso rojo ha devorado Edén."
  fallnews.2.b:0 "¡Que flamee siempre la chispa revolucionaria!"

  fallnews.3.t:0 "Liberación de París"
  fallnews.3.d:0 "Se confirmó la liberación de París del yugo de [MIL.GetNameDef]. El ejército francés entró en la ciudad, y los parisinos vitorean a sus liberadores. El liderazgo de [MIL.GetNameDef] ha huido, y la Tricolor ondea sobre la Millennium Tower."
  fallnews.3.a:0 "¡Vive Francia!"

  fallnews.4.t:0 "Caída de Hyakkiyako"
  fallnews.4.d:0 "La capital de [HYA.GetNameDef], Hyakkiyako, fue tomada por el ejército de Sankai-kei. Sus cerezos y casas de madera ardieron, y la reconstrucción podría llevar siglos.\n\nCon Hyakkiyako en manos enemigas, el futuro de Hyakkiyako es sombrío."
  fallnews.4.a:0 "El día en que cayeron las flores."

  fallnews.5.t:0 "Caída de la Zona Central de Sankai-kei"
  fallnews.5.d:0 "La histórica capital de Sankai-kei fue capturada anoche por las fuerzas de Hyakkiyako. Aunque todavía hay combates en suburbios, la antigua metrópoli está en ruinas y su gobierno ha huido."
  fallnews.5.a:0 "El final de la Zona Central de Sankai-kei."

  fallnews.6.t:0 "Caída de Varsovia"
  fallnews.6.d:0 "Tras duros combates, las tropas de Trinity tomaron Varsovia, capital de [POL.GetNameDef]. Las milicias locales apenas ofrecen resistencia; la ciudad está bajo control de Trinity, y Polonia sufre un golpe devastador.\n\nEs el inicio de la ambición oriental de Trinity."
  fallnews.6.a:0 "Polonia no tuvo oportunidad."
  fallnews.6.b:0 "¡Viva Trinity!"

  fallnews.7.t:0 "Caída del Distrito Central de Gehenna"
  fallnews.7.d:0 "El Distrito Central de Gehenna ha sido ocupado por Trinity tras un feroz asalto. Este avance supone una gran ventaja estratégica y sella el destino de Gehenna."
  fallnews.7.a:0 "El fin de Gehenna se acerca."
  fallnews.7.b:0 "¡Expulsemos a Gehenna!"

  fallnews.8.t:0 "Caída del Distrito Sur de Gehenna"
  fallnews.8.d:0 "El Distrito Sur de Gehenna también ha sido tomado por Trinity, consolidando el control sobre la región de Baviera y debilitando aún más a Gehenna."

  fallnews.9.t:0 "Caída de Liverpool"
  fallnews.9.d:0 "Liverpool, último bastión de la resistencia británica, fue tomado por las fuerzas de Kaiser PMC tras capturar la ciudad. A pesar de los esfuerzos de demolición del puente Royal Albert Dock, la ocupación fue inevitable. Con Liverpool caída, la resistencia británica prácticamente cesa."
  fallnews.10.d:0 "Con el último bastión sitiado, Londres quedó libre de combate. La población salió a celebrar la liberación y las campanas sonaron. Aunque algunas zonas siguen bajo control de Kaiser PMC, la chispa de la rebelión se extiende. ¿Recuperará finalmente Gran Bretaña su libertad?"

  BA_Super_Event_asd:0 "Ascenso de Mika"
  sp_event_asd_QUOTE:0 "Los estudiantes tienen sus razones; aunque no podamos conocer sus verdaderos pensamientos, podemos comprenderlos y confiar en ellos. Eso es lo que como maestro y adulto debo hacer.\n…Mika no es una bruja."
  sp_event_asd_QUOTE_NAME:0 "- Sensei"
  sp_event_asd_REMARK:0 "El equilibrio se quiebra"

  sup_aby_cze_union:0 "Guerra Trinity–Soviética"
  sup_aby_cze_union_QUOTE:0 "Nuestro propósito es justo,\nnuestros enemigos caerán,\ny la victoria será nuestra."
  sup_aby_cze_union_QUOTE_NAME:0 "- Yuri Levitan"
  sup_aby_cze_union_REMARK:0 "La guerra definitiva"

  sup_untiy_germay:0 "Promulgación de la Ley de Unión"
  sup_untiy_germay_QUOTE:0 "¡Una Trinity unida, eterna!"
  sup_untiy_germay_QUOTE_NAME:0 "- Misono Mika"
  sup_untiy_germay_REMARK:0 "Trinity no se disuelve."

  sup_invasion_another_dimension:0 "Invasión cromática"
  sup_invasion_another_dimension_QUOTE:0 "El miedo es la emoción más antigua y poderosa, y lo desconocido es el más inquietante."
  sup_invasion_another_dimension_QUOTE_NAME:0 "- H.P. Lovecraft"
  sup_invasion_another_dimension_REMARK:0 "Es el color del cosmos."

  sup_trinity_gehenna_war:0 "Guerra Gehenna–Trinity"
  sup_trinity_gehenna_war_QUOTE:0 "Si debes dañar a alguien, hazlo tan a fondo que nunca tema tu venganza."
  sup_trinity_gehenna_war_QUOTE_NAME:0 "- Nicolás Maquiavelo"
  sup_trinity_gehenna_war_REMARK:0 "El fin de un largo rencor"

  sup_Kivotos:0 "Una Kivotos"
  sup_Kivotos_QUOTE:0 "Cuando el destello del subconsciente te indique tu camino, abandona la duda y actúa de inmediato. Esperar solo conduce al fracaso."
  sup_Kivotos_QUOTE_NAME:0 "- Autor desconocido"
  sup_Kivotos_REMARK:0 "¡Viva!"

  sup_france:0 "El retorno de Francia"
  sup_france_QUOTE:0 "Estuve con vosotros en los días de gloria y en los de adversidad."
  sup_france_QUOTE_NAME:0 "- Philippe Pétain"
  sup_france_REMARK:0 "Vive la France!"

  sup_france_com:0 "Los socialistas retornan a Francia"
  sup_france_com_QUOTE:0 "Paz para nosotros, guerra para los tiranos. ¡Trabajadores, huelga y combate para destruir clases!"
  sup_france_com_QUOTE_NAME:0 "- Internacional"
  sup_france_com_REMARK:0 "Por la liberación obrera"

  sup_france_dem:0 "Los demócratas retornan a Francia"
  sup_france_dem_QUOTE:0 "La moral reside en el coraje de tomar decisiones."
  sup_france_dem_QUOTE_NAME:0 "- Léon Blum"
  sup_france_dem_REMARK:0 "¡Viva la República!"

  sup_france_fas:0 "Los fascistas recuperan Francia"
  sup_france_fas_QUOTE:0 "La monarquía requiere a un hombre sabio; la democracia, a una mayoría sabia."
  sup_france_fas_QUOTE_NAME:0 "- Charles Maurras"
  sup_france_fas_REMARK:0 "¡Gloria a Francia!"

  sup_britain:0 "El Reino Unido recupera Britania"
  sup_britain_QUOTE:0 "No nos rendiremos. Pelearemos en tierra, mar y aire con valor."
  sup_britain_QUOTE_NAME:0 "- Winston Churchill"
  sup_britain_REMARK:0 "¡Domina Britania!"

  sup_GER_mil:0 "La Wehrmacht unifica Alemania"
  sup_GER_mil_QUOTE:0 "Ataca cuando la situación sea incierta."
  sup_GER_mil_QUOTE_NAME:0 "- Heinz Guderian"
  sup_GER_mil_REMARK:0 "El águila renace"
  BA_Munich:0 "Múnich"
  BA_Frankfurt:0 "Fráncfort"
  BA_Essen:0 "Essen"
  BA_Hamburg: "Hamburgo"

  sup_HUN_BALKAN:0 "Unificación de los Balcanes"
  sup_HUN_BALKAN_QUOTE:0 "¡Oíd el clamor de la batalla final! ¡Pueblo, bajo la bandera de la liberación, avanzad!"
  sup_HUN_BALKAN_QUOTE_NAME:0 "- Internacional"
  sup_HUN_BALKAN_REMARK:0 "¡Adelante, bajo la bandera!"

  sup_BA_superevent_Middle_Asia_war: "Guerra del Medio Oriente"
  sup_BA_superevent_Middle_Asia_war_QUOTE: "El mal que tanto hemos combatido ha caído sobre nosotros."
   sup_BA_superevent_Middle_Asia_war_NAME: "- Jorge VI"
  sup_BA_superevent_Middle_Asia_war_REMARK: "¿Qué puedo decir?"

  sup_mil_key: "La princesa sin nombre de los dioses"
  sup_mil_key_QUOTE: "He verificado que el ataque ha cesado. Ahora corregiremos el error y guiaré a la <princesa> hacia el trono que le corresponde."
  sup_mil_key_QUOTE_NAME: "- Key"
  sup_mil_key_REMARK: "La puerta se abre."

  sup_mil_atrahasis: "El arca de Atrahasis"
  sup_mil_atrahasis_QUOTE: "La princesa ha conseguido la llave y el arca está lista. A petición de los sumos sacerdotes, construiremos un nuevo santuario en esta tierra."
  sup_mil_atrahasis_QUOTE_NAME: "- Key"
  sup_mil_atrahasis_REMARK: "Un nuevo arca."

  sup_China_Japan_War: "Guerra Sino-Japonesa"
  sup_China_Japan_War_QUOTE: "Ellos son cuchillos y platos;\nnosotros somos carne y pescado."
  sup_China_Japan_War_QUOTE_NAME: "- Sun Yat-sen"
  sup_China_Japan_War_REMARK: "Comienza la guerra."

  sup_launch_vehicle: "Satélite"
  sup_launch_vehicle_QUOTE: "El cielo parecía tan extrañamente ajeno que nunca imaginé que otra nación superara en tecnología a la nuestra."
  sup_launch_vehicle_QUOTE_NAME: "- Lyndon B. Johnson"
  sup_launch_vehicle_REMARK: "La Tierra es azul."

  sup_teaparty_nuked: "Marcha de los caídos"
  sup_teaparty_nuked_QUOTE: "Fui soldado, pero nunca tuve afinidad por la guerra."
  sup_teaparty_nuked_QUOTE_NAME: "- Ulysses S. Grant"
  sup_teaparty_nuked_REMARK: "La muerte se aproxima."

  sup_sov_pol_war: "Guerra de las llanuras de Europa del Este"
  sup_sov_pol_war_QUOTE: "¡Avanzad hacia el oeste! Más allá de los cadáveres en Polonia yace el camino al mundo entero.\n¡Marchad hacia Vilna, Minsk, Varsovia!"
  sup_sov_pol_war_QUOTE_NAME: "- Mijaíl Tujachevski"
  sup_sov_pol_war_REMARK: "La mecha ya arde completa."

  sup_Soviet_Win: "Día de la victoria soviética"
  sup_Soviet_Win_QUOTE: "Quería gritar a los que duermen eternamente en nuestra tierra: ¡Camaradas, lo hemos logrado!"
  sup_Soviet_Win_QUOTE_NAME: "- Vasili Grossman"
  sup_Soviet_Win_REMARK: "La voluntad del pueblo."

  sup_redwinter_civilwar: "Guerra civil en Inverno Rojo"
  sup_redwinter_civilwar_QUOTE: "Creemos firmemente que la libertad sin socialismo es privilegio e injusticia, y el socialismo sin libertad es esclavitud y barbarie."
  sup_redwinter_civilwar_QUOTE_NAME: "- Mijaíl Bakunin"
  sup_redwinter_civilwar_REMARK: "El derecho no existe sin lucha."

  sup_HYA_SHA_war: "Guerra NamKivotos"
  sup_HYA_SHA_war_QUOTE: "El viento del rey se pierde en la maleza,\ny tigres y dragones se devoran en la guerra."
  sup_HYA_SHA_war_QUOTE_NAME: "- Li Bai"
  sup_HYA_SHA_war_REMARK: "La guerra de dragones y tigres"

  sup_united_nations: "Renacimiento de la Liga de Naciones"
  sup_united_nations_QUOTE: "El sol verá el amanecer, los ríos llegarán al mar,\ny un nuevo día de libertad nacerá para todos."
  sup_united_nations_QUOTE_NAME: "- De 'La Liga avanza'"
  sup_united_nations_REMARK: "Y la Liga avanza."

  sup_68_revolutions: "Culminación de la Revolución del 68"
  sup_68_revolutions_QUOTE: "Seamos realistas: exijamos lo imposible."
  sup_68_revolutions_NAME: "- Lema de Mayo del 68"
  sup_68_revolutions_REMARK: "Prohibir lo prohibido."

  sup_com_aru_german_reunification: "Promulgación de la Ley de Unión"
  sup_com_aru_german_reunification_QUOTE: "¿Ni siquiera ha comenzado la operación y ya te preocupas por un posible fracaso?"
  sup_com_aru_german_reunification_QUOTE_NAME: "- Rikuha​chima Aru"
  sup_com_aru_german_reunification_REMARK: "Entonces, ¿fue un éxito al final?"

  sup_GEI_DEC: "Contingencia"
  sup_GEI_DEC_QUOTE: "Venid a mí, todos los fatigados y cargados, y yo os daré descanso."
  sup_GEI_DEC_QUOTE_NAME: "Mateo 11:28"
  sup_GEI_DEC_REMARK: "¿Acaso un falso paraíso es paraíso?"

  sup_COU_KAYA_LETSGo: "Toma de posesión de la interina Kaya"
  sup_COU_KAYA_LETSGo_QUOTE:0 "...con métodos de democracia precaria como esos,\nnada se solucionará.\nKivotos debe ser dirigida por superhumanos."
  sup_COU_KAYA_LETSGo_QUOTE_NAME: "- Shiranui Kaya"
  sup_COU_KAYA_LETSGo_REMARK: "Levantando la mirada en la oscuridad"

 sup_gehenna_reunification_benriya: "La reunificación de Gehenna"
 sup_gehenna_reunification_benriya_QUOTE: "Está bien porque no estoy atada a nada y no hay nada que pueda herirme,\npero aun así, estar sola es solitario."
 sup_gehenna_reunification_benriya_QUOTE_NAME: "- Onikata Kayoko"
 sup_gehenna_reunification_benriya_REMARK: "Es más divertido estar juntos"
 
 sup_gehenna_reunification_prefect_team: "La reunificación de Gehenna"
 sup_gehenna_reunification_prefect_team_QUOTE: "...Pase lo que pase, lo que el Comité Disciplinario debe hacer no cambia.\nEs lo de siempre."
 sup_gehenna_reunification_prefect_team_QUOTE_NAME: "- Sorazaki Hina"
 sup_gehenna_reunification_prefect_team_REMARK: "Por el orden"
 
 sup_gehenna_reunification_pandemonium_society: "La reunificación de Gehenna"
 sup_gehenna_reunification_pandemonium_society_QUOTE: "Si el mundo se vuelve pacífico... las cosas dolorosas desaparecerán.\nSi pudiéramos controlar a las personas, ¿no sería que esas cosas no ocurrirían?"
 sup_gehenna_reunification_pandemonium_society_QUOTE_NAME: "- Kyogoku Satsuki"
 sup_gehenna_reunification_pandemonium_society_REMARK: "Conquista por la paz"

  ARI_all_blood.t:0 "'Todas las sangres son iguales' – Discurso"
  ARI_all_blood.desc:0 "¡Estudiantes! Reflexionad sobre nuestro pasado más allá de la opresión de Beatrice. Si el presidente de entonces tuviera sangre verdaderamente noble, ¿sufriríamos su tiranía? ¿Hubo nobleza que se alzara contra Beatrice? No: colaboraron con ella y no mostraron voluntad de frenar el caos. Por eso hoy otorgamos a todo el estudiantado el derecho de la sangre noble. Recordad siempre: toda sangre es noble."
  ARI_all_blood.a:0 "Fue un gran discurso."
  ARI_to_vitory_at_last.t:0 "'Por la victoria final' – Discurso"
  ARI_to_vitory_at_last.desc:0 "¡Pueblo de Arius! Han pasado meses —incluso años— desde que llegamos a esta tierra. Vivimos aquí, aprendimos su lengua, su pensamiento y su ideología. Aceptamos como misión dedicarnos al proletariado mundial, pero aceptar no basta: debemos actuar. Todo el pueblo, toda la academia debe movilizarse para la victoria final. ¡Adelante, actuad!"
  ARI_to_vitory_at_last.a:0 "Sin obra, la fe está muerta, como un reino sin pueblo."
  ARI_soviet_diplomacy.t:0 "Contacto con la URSS"
  ARI_soviet_diplomacy.desc:0 "—Camarada Secretario, traigo un informe.  —¿Molotov? ¿Qué sucede?  —Una joven, que dice ser embajadora de la 'Sucursal Arius', solicita establecer relaciones diplomáticas.  —¿Una sucursal? No existe tal Estado; debe ser una locura.  —Sin embargo, fue hallada en pleno Mar Báltico por la flota federal, sin señales de naufragio. Asegura haber nadado hasta aquí.  —Mar Báltico… intrigante. Ocúpate del asunto.  —Entendido."
  ARI_soviet_diplomacy.a:0 "Así concluyó el contacto con la URSS."

  KAP_event.1.t:0 "Proclamación de la ciudad académica Kapila"
  KAP_event.1.desc:0 "Por fin ha terminado la larga lucha. Los enemigos fueron partidos por la espada de Kohane, y las tierras y recursos obtenidos bastan para reconstruir la ciudad académica. Ha llegado el momento de regresar a la vida cotidiana que tanto extrañábamos."
  KAP_event.1.a:0 "Un día de honor ante el maestro."
  KAP_event.1.b:0 "Debemos vigilar sus movimientos."
  KAP_event.1.d:0 "Debemos vigilar sus movimientos."

 KAP_event.2.t:0 "La Tercera Gran Transición"
 KAP_event.2.desc:0 "En busca de la estrella perdida.\nLa historia de quienes siguen las huellas y buscan reconstruir.\nLa historia de quienes se enfrentan al destino y conquistan la verdadera libertad.\nLa historia de quienes persiguen las estrellas.\n...\nLa historia ilusoria de una estrella que brilla."
 KAP_event.2.a:0 "Debemos encontrar la estrella."
 KAP_event.2.b:0 "¿La Gran Transición se repite una y otra vez?"
 KAP_event.2.d:0 "¿La Gran Transición se repite una y otra vez?"
