l_spanish:
  BA_what_update_button_tt:0 "Pantalla principal: Invierno Rojo\n\n"
  BA_what_update_tt_delayed: "§YActualización 0.7.2§!§W\n- §RInvierno Rojo§!: ruta 'Aceptación del trotskismo' completada\n- §PLa procesión de cien demonios§!: añadido enfoque de derrota de Nankhibotos en la guerra\n- §tComité de Defensa de Invierno Rojo§!: añadido contenido tras el establecimiento del comité autónomo de Finlandia\n- §CAgencia de Inteligencia 68§!: añadido final de la 'Revolución del 68'"

  BA_pb_update_tt: "§CGobierna Britannia§!"
  BA_pb_update_tt_delayed: "§L\"Cuando estás sano, no olvides a los enfermos; cuando estés en calma, no olvides la tormenta.\"\n\nEste proverbio inglés transmite sabiduría sobre la salud y enfatiza la prevención y la preparación: al estar sano, anticipa las dificultades de la enfermedad y prepárate para riesgos futuros. Además, recuerda que la estabilidad actual no es eterna y nos invita a agradecer el presente.\n\nHasta octubre de 1935, este dicho quizás no resonaba en Gran Bretaña. Pero tras la Crisis de la Gran Guerra, potencias como Francia y Alemania sufrieron derrotas ante entidades de otro mundo. Alemania colapsó sin exilio posible; Francia huyó a África del Norte; y Gran Bretaña se vio igualmente amenazada.\n\nEl ataque de Kaiser Corporation fue como un felino dormido dirigido contra Gran Bretaña: capturaron el puerto de Dover y luego cayeron Londres. Ahora el Alto Mando unificado gobierna el país, pero la situación no mejora.\n\nDios, protege a nuestro rey.§!"
  BA_sr_update_tt: "§tBrilla§!Soy la Estrella Polar de la Revolución§!"
  BA_sr_update_tt_delayed: "§L\"En la Gran Guerra, las contradicciones sociales surgidas del desarrollo desigual emergen sin velo y muestran su verdadera forma.\"\n§t– Lev Trotski§!\n\nLos estudiantes de Invierno Rojo llegaron a tierras frías sin entender bien por qué lucharon una caótica guerra en Escandinavia y quedaron aislados en una realidad desconocida. Sin embargo, llevan dos armas:\n\nLa primera es la ideología. Representan la revolución, listos para crear un estado obrero-campesino y aliarse con mentes afines.\n\nLa segunda es la solidaridad. Con experiencia en gran escala administrativa y bajo un plan unificado, pueden impulsar sus objetivos con plena dedicación. Una vez restaurada la administración, Invierno Rojo desplegará un potencial incomparable.\n\nAun así, muchas pruebas les esperan:\n\n- Las fuerzas paramilitares de Minori Yasumori y otros grupos antigubernamentales siguen sembrando caos. Si la Secretaría de Renka y Cherino no supera el colapso económico tras la guerra, la ira se volverá violencia.\n- Una ineficiencia burocrática masiva persiste en instituciones como el Estado Mayor, la Comisión de Seguridad y la Administración Militar. Mientras no se rompa la pasividad de los burócratas, la administración seguirá fallando.\n- Serpientes externas cercan Invierno Rojo: en Trinity crece un ala fascista contrarrevolucionaria y gobiernos locales mantienen hostilidad. Se requiere solidaridad de hierro.\n\nComo adolescentes en pubertad, vagan sin rumbo. Pero si se guían por la ideología y la solidaridad para hallar\n§tBrilla§!Soy la Estrella Polar de la Revolución§!, avanzarán con fuerza, derribarán obstáculos y triunfarán.§!"
  BA_ger_update_tt: "§4Día nublado§! y §Osoleado§! §Ycon brillo§!"
  BA_ger_update_tt_delayed: "§L\"Pero nadie llorará por nosotros. El invierno no puede durar para siempre. Un día diremos con alegría: ‘Patria, eres mía de nuevo’.\"\n– Fragmento de 'Soldados del Pantano'\n\nLos alemanes avanzan por un páramo interminable como vagabundos guiados por Moisés hacia un horizonte inalcanzable. Abandonados y sin líder, estos ‘huérfanos’ siguen con vida y caminan hacia lo desconocido: Alemania.\n\nMoisés llevó al pueblo de Israel a través del Mar Rojo hacia una nueva tierra, compartiendo su fe. ¿Quién será el Moisés de los alemanes? Sin duda, responderá a su sufrimiento. La pregunta es:\n\n§Y¿Quién será el Moisés alemán?§!\n\nBajo un §4día nublado§! y §Osoleado§! §Ycon brillo§!, hallarán la respuesta.§!"

