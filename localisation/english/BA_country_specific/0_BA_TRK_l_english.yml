l_english:
 TRK_government_general_leader_desc: "기존의 파테르 정권은 붕괴하였으며, 트리니티에는 게헨나 군정이 들어섰습니다. 새로운 게헨나 군정은 에덴에 주둔하며 현지의 협력적인 지도자를 찾고 있습니다. 게헨나와 트리니티의 오랜 악연, 그리고 두 국가의 총력전에 가까운 대립 때문에 적당한 인원을 찾는 것에 시간이 걸리고 있으나, 군정은 적절한 인물을 곧 찾아낼 수 있을 것이라고 믿습니다."
 TRK_Kirifuji_Nagisa_leader_desc: "옛 '필리우스 분파'의 지도자이자, 미소노 미카 정권 몰락 이후 다시 한 번 트리니티의 티파티 호스트가 된 키리후지 나기사를 어떻게 설명할 수 있을까요? 그녀는 자신의 소꿉친구였던 미소노 미카의 선의를 지나치게 믿었고, 그녀가 쿠데타를 일으키고 나기사를 유폐하는 끔찍한 짓을 저지르지 않을 것이라고 생각했습니다. 하지만 어리석은 것은 나기사였습니다.\n\n에덴 조약을 통해 게헨나와의 화평을 주장했던 나기사는 미카의 초군국주의적 새 파테르 정권이 광기 속에서 붕괴하는 과정을 지켜보았습니다. 게헨나와의 전쟁, 그리고 폐허가 된 에덴은 나기사에게 게헨나에 대한 더욱 깊은 협력 의지와 트리니티를 파괴한 미소노 미카와 파테르 분파에 대한 증오를 심어 주었습니다.\n\n친-게헨나 인사로 분류되어 다시 정권을 잡은 나기사는 티파티 회의실에 홀로 앉아, 이제는 게헨나 군정 인사들로 가득 찬 회의실을 돌아보았습니다. 배신당하고, 소중했던 트리니티가 짓밟히는 것을 지켜본 나기사에게 남은 감정은 증오심 뿐이며, 그녀는 자신에게 남은 보잘 것 없는 모든 권력을... 파테르와 미소노 미카 일파의 영구적인 말살에 쏟기로 결정했습니다. 파테르 분파, 그리고 미소노 미카와 연관되어 있는 모든 트리니티인이 단 한 명도 남지 않고 완전히 삭제될 수만 있다면, 나기사는 게헨나의 깃발 아래에서 무엇이라도 할 것입니다. 무엇이라도."

 TRK.news.1.t: "키리후지 나기사의 티파티 호스트 재집권"
 TRK.news.1.desc: "미소노 미카의 트리니티 파테르 정권이 게헨나의 침공으로 인하여 붕괴된 이후, 게헨나 군정은 키리후지 나기사를 새로운 지도자로 삼기로 결정했습니다. 나기사는 과거 트리니티와 게헨나의 평화 협정인 '에덴 조약'을 추진하는 등 게헨나 군정에 의해 '친 게헨나' 인사로 분류되었습니다.\n\n과거 티파티 호스트였던 키리후지 나기사는 미소노 미카에 의한 쿠데타 이후 지금까지 파테르 정권에 의하여 유폐되어 있었으나, 게헨나 군에 의하여 이번에 유폐 상태에서 해제되었습니다. 나기사는 게헨나 제복을 입고 참여한 취임식에서 '게헨나의 적, 파테르 분파의 말살'을 새 정권의 목표로 삼을 것이라고 말했습니다."
 TRK.news.1.a: "그녀에게 남은 것은 증오 뿐이다"
 TRK.news.1.b: "전형적인 꼭두각시 정권"

 TRK_economic_collapse: "트리니티 경제 붕괴" 
 TRK_economic_collapse_desc: "패전 이후 트리니티의 경제는 붕괴되었으며, 자력으로 우리의 경제를 복원하는 것은 매우 어려울 것입니다."

 TRK_gehenna_puppet: "게헨나 군정기"
 TRK_gehenna_puppet_desc: "우리는 게헨나와의 전쟁에서 패배하였으며, 군정이 트리니티 영토에 잔존하고 있습니다. 우리는 명목상으로만 독립국일 뿐입니다."

 TRK_eden_collapse_decision_category: "에덴 관리기구의 붕괴"
 TRK_eden_collapse_decision_category_desc: "에덴 관리기구는 게헨나에 의한 트리니티 군정이었으나, 군정이 완료되기 이전 게헨나 정부가 완전히 붕괴하였습니다. 게헨나에 의한 트리니티 군정이 더 이상 유지될 수 없음이 분명해짐에 따라 에덴 관리기구에서 게헨나 관료들이 우리와 통합을 논의하고 있습니다. 그들의 중앙 정부가 붕괴한 이상, 그들이 우리에게 저항할 수 있는 가능성은 전혀 없습니다."

 TRK_eden_collapse_decision: "관할권 인수인계"
 TRK_eden_collapse_decision_desc: "군정으로부터 관할권을 넘겨받습니다. [TRK.GetLeader]가 조약을 맺을 것입니다."