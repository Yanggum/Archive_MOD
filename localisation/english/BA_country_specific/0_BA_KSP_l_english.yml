# Life Safety Bureau
#KSP_nakatsukasa_kirino_leader_desc: "§YNakatsukasa Kirino becomes the leader of Valkyrie Police Academy.§!"


 KSP_csi: "CSI Unit"
 KSP_csi_desc: "We will organize a CSI unit composed of scholars from various fields to investigate unsolved cases of Kivotos and local humanity, improving Valkyrie's research capabilities."
 KSP_ministry_of_personal_management: "Ministry of Personnel Management"
 KSP_ministry_of_personal_management_desc: "We must prevent the birth of new corruption within Valkyrie Police Academy through periodic personnel rotations."
 KSP_fubuki_plan: "Fubuki's Proposal"
 KSP_fubuki_plan_desc: "Nemugaki Fubuki emphasizes that Valkyrie needs broad democracy to adapt to the new era, drawing support from various Kivotos and Earth factions. We will accept some of their methodologies to complete the new Valkyrie system."
 KSP_labor_federation: "Police's Small Happiness"
 KSP_labor_federation_desc: "We must erase the traces of the emergency regime where even small joys were suppressed, and carry out several reforms to reclaim various minor happinesses, including donuts."
 KSP_shift_work: "Shift Work System"
 KSP_shift_work_desc: "Under the Kanna regime, large-scale mobilization of police force was routine under the guise of emergency powers. We will strive to resolve this situation and restore the labor environment of the old Kivotos days."
 KSP_police_labor_union: "Police Labor Union"
 KSP_police_labor_union_desc: "By forming a labor union for the new system of Valkyrie Police Academy, democratically and fairly elected representatives will investigate police labor exploitation during mobilizations and improve several issues."
 KSP_work_with_ant: "Cooperation with the Ant"
 KSP_work_with_ant_desc: "We know that mutual cooperation is essential for the integrity of the new system. We will move one step closer to the settlement of the new system by cooperating with Nakatsukasa Kirino's faction."
 KSP_kirino_plan: "Kirino's Proposal"
 KSP_kirino_plan_desc: "Nakatsukasa Kirino supports a kind of powerful paternalism originating from Valkyrie's sub-organizations, which have handled most local resistance since the Great Transfer. Their ideology, started in the Life Safety Bureau, seeks idealistic methodologies to respect old Earth culture and find a perfect coexistence between Kivotos and Earth."
 KSP_practical_administrative: "Practical Administration"
 KSP_practical_administrative_desc: "Nakatsukasa Kirino is a representative figure who feels disillusioned by the old Valkyrie bureaucracy. We will complete the Valkyrie Police Academy system by establishing a leadership that pursues a more practical and realistic approach."
 KSP_basic_shooting_training: "Basic Marksmanship Training"
 KSP_basic_shooting_training_desc: "Valkyrie students are fundamentally police, so their absolute training results are lacking compared to the standing armies of other academies. Please note that we are conducting extensive marksmanship training NOT because Nakatsukasa Kirino's shooting skills are lacking.\n- From Acting Authority Nakatsukasa Kirino -"
 KSP_effective_method: "Efficient Method"
 KSP_effective_method_desc: "Extensive industrial support is needed for the economic operation of Valkyrie Police Academy. We will focus on strengthening industrial control by actively utilizing Valkyrie's unique bureaucracy."
 KSP_work_with_grasshopper: "Cooperation with the Grasshopper"
 KSP_work_with_grasshopper_desc: "We know that mutual cooperation is essential for the integrity of the new system. We will move one step closer to the settlement of the new system by cooperating with Nemugaki Fubuki's faction."
 KSP_overtime_pay: "Overtime Pay"
 KSP_overtime_pay_desc: "Mindful that overtime has become routine due to Valkyrie police scattered everywhere after the Transfer, we will clearly draft legislation regarding overtime pay."
 KSP_incentive: "Incentives"
 KSP_incentive_desc: "Police who achieve high levels of performance will receive incentives, including commendations. This will rectify negligence across Valkyrie and improve work efficiency."
 KSP_valkyrie_federation: "Valkyrie Federation"
 KSP_valkyrie_federation_desc: "Looking at the fully composed new Valkyrie Police Academy system, we will praise the operation of the new system we shaped with our own hands."
 KSP_support_entrepreneur: "Support Entrepreneurs"
 KSP_support_entrepreneur_desc: "Providing support to entrepreneurs."
 KSP_secure_coast: "Secure the Coast"
 KSP_secure_coast_desc: "Securing the coastal areas."
 KSP_integrated_safty_bureau: "Integrated Safety Bureau"
 KSP_integrated_safty_bureau_desc: "Organizing the Integrated Safety Bureau."


