 KSP_event.33.t:0 "Failure to Repel Wakamo"
 KSP_event.33.d:0 "Despite all efforts, Wakamo has not been repelled. She is becoming an even greater threat to the students of Valkyrie Police Academy."
 KSP_event.33.a:0 "It's a disaster!"

 KSP_event.34.t:0 "Success in Repelling Wakamo"
 KSP_event.34.d:0 "After much struggle, we succeeded in repelling Wakamo. Although we failed to capture her, we might be able to subdue her if we try a bit more."
 KSP_event.34.a:0 "That's it!"

 KSP_event.35.t:0 "Accumulating Damage"
 KSP_event.35.d:0 "Damage is accumulating in the territory due to the unrest. It seems it will take a considerable amount of time to restore the damage."
 KSP_event.35.a:0 "...Damn it!"

 KSP_event.36.t:0 "Assuming Control of General Student Council"
 KSP_event.36.d:0 "Since we occupy all of the GSC territory and rule the Sanctum Tower, we can now declare ourselves the GSC of Kivotos, following the will of the missing former GSC President, and proclaim ourselves as the legitimate leading nation of Kivotos."
 KSP_event.36.a:0 "It's for the sake of public order..."

 KSP_event.37.t:0 "Kanna Collapsed"
 KSP_event.37.d:0 "This morning, news spread throughout Valkyrie Police Academy that Ogata Kanna had collapsed due to deteriorating health from overwork. The entire school was instantly enveloped in anxiety, and the student-led administrative structure began to falter in Kanna's absence.\n\nThe factionalism within Valkyrie that Kanna had suppressed to respond to the emergency also raised its head as soon as she collapsed. Taking advantage of the Public Security Bureau's paralysis in Kanna's absence, the Life Safety Bureau and Security Bureau are gradually expanding their power.\n\nA small crack within Valkyrie Police Academy is widening once again..."
 KSP_event.37.a:0 "...Oh no?!"

 KSP_event.38.t:0 "Processing Tasks"
 KSP_event.38.d:0 "It is true that Ogata Kanna had a profound influence on the administrative work of Valkyrie Police Academy. However, her absence did not lead to administrative paralysis.\n\nWhile all critical matters requiring a final decision-maker have stopped, other tasks could be managed somehow by the students themselves. Although administrative efficiency has dropped significantly without Kanna to assign massive amounts of work, Valkyrie Police Academy is not to the point of collapsing yet."
 KSP_event.38.a:0 "Is it... more manageable than expected?"

 KSP_event.39.t:0 "Life Safety Bureau Coup"
 KSP_event.39.d:0 "The current government of Valkyrie Police Academy without Kanna failed to respond properly to the rapidly collapsing administration, and instead worsened the situation. Nakatsukasa Kirino, the leader of the Life Safety Bureau radicals, condemned this situation and raided the government with students following her. After subduing a few Kanna loyalists, she announced the establishment of a new Socialist Academy. Ogata Kanna, who was quietly recuperating, disappeared upon hearing this news, and Valkyrie students and Walloon citizens accepted this new change positively.\n\nOgata Kanna's authoritarian government has met its end, and a new era has arrived where students are the true owners of the police academy."
 KSP_event.39.a:0 "It is the victory of the people!"

# Old Events
 KSP_event.1.t:0 "Kanna's Troubles"
 KSP_event.1.d:0 "'Sigh, what on earth should I do?'\n\nMuttering to herself with no one to hear, Ogata Kanna, the current head of Valkyrie Police Academy and Public Security Bureau Chief, slowly read the documents sent to her. The documents laid bare the poor, or more bluntly, near-collapsing state of Valkyrie Police Academy.\n\nAn increase in minor but certain crimes within the 'Police Academy' itself, armed clashes, various sabotages, and protests caused by friction with Belgians, the severance of support from the GSC, and the lack of budget and equipment due to an industrial structure completely different from Kivotos. On top of all that, factions were starting to emerge within the school.\n\nUntil now, she had been suppressing all these problems with her own authority and temporary measures made by squeezing non-existent resources, but she was now reaching her limit.\nAt this rate, Valkyrie Police Academy will collapse.\n\nAnd Ogata Kanna could not allow that.\n\nFor the sake of the Valkyrie students who believe in her while barely living in this land, and for her own convictions.\n\n'General Student Council...'\n\nShe had requested support from the GSC several times, but each time the answer was 'impossible'. It's said the GSC also encountered various problems after being transferred to this world.\n\nKanna could no longer just stand by and watch.\n\n'...These are problems I can't solve alone...'"
 KSP_event.1.a:0 "I should convene a countermeasure meeting."

 KSP_event.5.t:0 "Start of the Countermeasure Meeting"
 KSP_event.5.d:0 "'So, why are we gathered here?'\n\n'For the future of Valkyrie.'\n\nThe department heads of Valkyrie gathered for the 1st Valkyrie Countermeasure Meeting stiffened their already grim expressions upon hearing Kanna's words.\n\nEveryone here knows the current state of Valkyrie.\n\nIt should have collapsed a long time ago, but Kanna and the administrative departments that were transferred together have been grinding themselves away to save every bit of resource, barely keeping it alive.\n\nIf Kanna is saying such things...\n\n'We have reached the limit. There are no more supplies to squeeze out.'\n\n'...'\n\nEveryone was silent.\nLocal procurement alone can never gather the sufficient amount of resources required for Valkyrie.\n\n'Therefore, from now on, we must find a way to solve this problem. For the survival of Valkyrie Police Academy.'\n\nEveryone here knew. That there is no such way.\nIf there were, Kanna would have found it long ago."
 KSP_event.5.a:0 "A countermeasure meeting with no right answer from the start has begun."

 KSP_event.2.t:0 "Issues Regarding Military Spending"
 KSP_event.2.d:0 "'...You mean even that is all gone?'\n\n'Yes.'\n\nKanna smiled bitterly as she saw the student who asked the question show a look of horror.\n\n'It's unbelievable, isn't it? I couldn't have imagined it either until I received the report.'\n\nValkyrie Police Academy currently lacks everything.\n\nNot only the basic food, clothing, and shelter essential for students, but also ammunition to protect themselves, which has become even more necessary due to the weakened Mystic.\n\nMost was being procured locally, but the local industry Valkyrie could mobilize was very limited due to friction with Belgians, and even that limited amount was insufficient.\n\nOn top of that, sabotages occur whenever possible, with riots and armed protests happening daily. Clashes between Belgians and Valkyrie students continued, and as a significant amount of the budget was poured into that, the environment for Valkyrie students could only worsen.\n\n'First, we will drastically cut the budget of unnecessary departments and use that budget for the living conditions of Valkyrie students. For the development and activation of industry, as well as for the procurement of various daily necessities and securing food, clothing, and shelter.'\n\nThe Bureau Chiefs gathered in the meeting room all nodded at this seemingly obvious story Kanna brought up.\n\nHowever, as always, there are few problems that can be solved with such makeshift measures. It's an obvious story, but there are many parts that need money, and few parts that can be reduced.\n\nAnd the fields where Kanna could cut the budget were already decided.\nKanna turned her head slightly and looked at the Security Bureau Chief she had temporarily appointed.\n\n'Cutting military spending has serious negative consequences in the long run. But... there's no other way right now.'"
 KSP_event.2.a:0 "...Will it be okay?"

 KSP_event.7.t:0 "Security Bureau Chief"
 KSP_event.7.d:0 "The temporary chief of the Security Bureau was extremely uncomfortable in this meeting led by the Public Security Bureau Chief, Kanna.\nThat was because she felt she was not the right person to be in such a position.\nUntil they were dropped into this unknown place called Europe, she was just a normal 3rd-year student at Valkyrie Police Academy in the Security Bureau.\nShe had worked for three full years in Gehenna, which is famous for not having a single day of rest, but she didn't think of herself as a veteran because there were many others like her.\n\n'To be honest, I didn't even work that hard.'\n\nHowever, the situation changed completely when the Transfer occurred.\nImmediately after the Transfer, Valkyrie Police Academy lost contact with all students dispatched outside, and numerous students including the Security Bureau Chief went missing.\nKanna, judging that numerous high-level positions left vacant by the missing couldn't be left empty in this unprecedented crisis, temporarily appointed students remaining at the school to key positions, and that's how she suddenly became the Security Bureau Chief.\n\nResponsibility was far too heavy.\n\nSeveral students were expressing their opinions in front of her.\nActually, she knew the answer.\nIn the end, everyone could tell that the first thing to be reduced in a limited budget was the budget for military power.\nAs soon as the topic of military spending came up, she spoke without hesitation.\n\n'I will give up the Security Bureau's budget. No, you can even abolish the department.'\n\nEveryone looked at her.\nKanna was also looking at her with an uncomfortable expression.\nDid Kanna not like this?\n\n'Is that... the opinion of the Security Bureau?'\n\n'Yes.'\n\nKanna nodded and continued.\n\n'I see.'\n\nThe Security Bureau Chief slowly bowed her head.\nWhatever the reason, she had done something terrible to her classmates and juniors who believed in and followed her.\n\nShe muttered softly. An apology that no one would hear."
 KSP_event.7.a:0 "...Sorry, everyone."

 KSP_event.12.t:0 "Public Security Maintenance Issue"
 KSP_event.12.d:0 "Someone asks how to maintain public order in the current chaotic situation if the Security Bureau's budget is drastically cut, to which Kanna says they should use minimum firearms and rely on melee weapons. The temporary chief of the Life Safety Bureau sitting next to them suggests mobilizing Belgian militias cooperative with us. A few look displeased, but most agree."

 KSP_event.10.t:0 "Correction Bureau Issue"
 KSP_event.10.d:0 "A discussion about what to do with the collapsed Correction Bureau, where Kanna states 'Valkyrie must have a Correction Bureau' and the others agree."
 KSP_event.10.a:0 "Valkyrie will always remain as police. Always."

 KSP_event.11.t:0 "Meanwhile..."
 KSP_event.11.d:0 "Outside the Valkyrie Police Academy building where the countermeasure meeting is being held, two students with tired faces talk while walking around, saying 'They said they're holding a countermeasure meeting, so maybe this situation will improve once it's over.'"
 KSP_event.11.a:0 "We will overcome this situation too."

 KSP_event.13.t:0 "End of Countermeasure Meeting"
 KSP_event.13.d:0 "The countermeasure meeting is over, and everyone should do their best."
 KSP_event.13.a:0 "Now, let's go build the future of Valkyrie Police Academy."

 KSP_event.6.t:0 "Meeting with Belgian Leaders"
 KSP_event.6.d:0 "Kanna was able to meet with key figures of Belgium, the nation originally in this land where Valkyrie settled, but she returned without having any constructive talk with the Belgian delegation, who couldn't even unify their own opinions."
 KSP_event.6.a:0 "..."

 KSP_event.17.t:0 "Negotiations with the Belgian Delegation"
 KSP_event.17.d:0 "Negotiations with the Belgian delegation proceeded for a long time, but the demands of both sides only crossed each other in the air. In the end, the negotiations ended as the Valkyrie delegation left the room first with a warning.\n\nLed by the Life Safety Bureau, the theory of the Public Security Bureau's responsibility for the failed negotiations is emerging, and the state of Valkyrie Police Academy is falling further into a labyrinth. We must solve the current situation."
 KSP_event.17.a:0 "Now, let's go build the future of Valkyrie Police Academy."

 KSP_event.18.t:0 "Merging SRT Special Forces into Valkyrie Police Academy"
 KSP_event.18.d:0 "With the GSC President missing, we must speed up the merger of the SRT Special Academy into Valkyrie Police Academy. Now that commanders reorganized as SRT regulars under the GSC are excluded from current negotiations, we must clearly secure our sovereignty between Schale and the GSC.\n\nAs the fate of the SRT Special Academy, a legacy of the former GSC President, has an uncertain control since the President went missing, we must decide their destiny."
 KSP_event.18.a:0 "For Valkyrie!"

#KSP_event.19.t:0 "GSC Approval"
#KSP_event.19.d:0 "The GSC approved the transfer of SRT for the reason of their influence competition with Schale. Now we must mobilize a political offensive to oust Schale's influence and merge the SRT Special Academy into our academy."
#KSP_event.19.a:0 "An excellent result."
#
#KSP_event.20.t:0 "GSC Rejection"
#KSP_event.20.d:0 "Despite the situation being on the verge of an actual civil war due to their influence competition with Schale, the GSC rejected the request under the pretext that they are controlling the SRT Special Academy well."
#KSP_event.20.a:0 "How foolish."

