 KSP_wakamo_showdown:0 "The Final Showdown"
 KSP_wakamo_showdown_desc:0 "The time has come. We have pinpointed the location of Wakamo, one of the Seven Prisoners. Although we lack support from the SRT Special Academy, since everyone's Mystic has weakened for unknown reasons, our students should be able to arrest her."


 KSP_kanna_jungwun_uzi:0 "Assess the Situation"
 KSP_kanna_jungwun_uzi_desc:0 "Due to a sudden and unknown phenomenon, we have been dropped into a new world we didn't even know existed. Thus, we need to understand the current situation through the Belgians who claim to be the original owners of this region."

# Coalition
 KSP_with_our_friends:0 "Treatment of Belgians"
 KSP_with_our_friends_desc:0 "We understand that while this is our land now, it was once theirs. For the future of Valkyrie and Belgium, we must cooperate."
 KSP_talk_with_moderate_partys:0 "Dialogue with the Belgian Left"
 KSP_talk_with_moderate_partys_desc:0 "Through dialogue with them, we have learned that the 'totalitarianism' of the Rex Party, which is currently expanding its influence, will only bring further chaos to society. To stop them, we need to contact figures from the former Belgian government."
 KSP_inminjunsun:0 "Popular Front"
 KSP_inminjunsun_desc:0 "To counter the fascists of the Rex Party, a broad alliance between democrats and socialists must be formed."
 KSP_citizen_danchae_help:0 "With Civic Groups"
 KSP_citizen_danchae_help_desc:0 "We must focus on fully restoring the Belgian government and parliament that collapsed during the Great Transfer."
 KSP_nojo_help:0 "With Labor Unions"
 KSP_nojo_help_desc:0 "The ideology of socialism is quite similar to Kivotos' welfare policies. By supporting them, we might be able to establish a Belgian government that is more similar to our own."
 KSP_talk_with_hardliners:0 "Dialogue with the Belgian Right"
 KSP_talk_with_hardliners_desc:0 "Through dialogue with them, we have identified that liberals and socialists are currently banding together to oppose and refuse to recognize us. To stabilize society, a powerful means of control is needed, and the Rex Party can serve as that means."
 KSP_rex_empower:0 "Strengthen the Rex Party"
 KSP_rex_empower_desc:0 "Liberals and socialists are forming a broad united front to block us. We must support the Rex Party to thwart their ambitions."
 KSP_gukwangdang:0 "Support Monarchism"
 KSP_gukwangdang_desc:0 "Leon Degrelle, the leader of the Rex Party, is uncooperative due to his own ambitions. We might be able to make the party more cooperative by secretly supporting monarchists within the Rex Party to increase the authority of Leopold III."
 KSP_fascism_rule:0 "Accept Fascism"
 KSP_fascism_rule_desc:0 "Their fascist tendencies have been a great help in stabilizing society. If we apply this to ourselves, we can create a stronger society."
 KSP_government_ganghwa_NOT: "Total Destruction of Belgian Resistance"
 KSP_government_ganghwa_NOT_desc: "Now that it has been proven by the 'Police State' that Belgian resistance can be stopped, our reason for showing tolerance toward collaborators has vanished. To protect Valkyrie-Kivotos culture, all resistance organizations must be annihilated."
 KSP_government_ganghwa:0 "Form Collaborative Body"
 KSP_government_ganghwa_desc:0 "Gathering Belgians who are cooperative with us to form a new collaborative body will be a great help in managing domestic affairs."
 KSP_cooperation_with_the_left:0 "Cooperation with the Belgian Left"
 KSP_cooperation_with_the_left_desc:0 "We will stabilize Belgian society by cooperating with the Labor Front, classified as a leftist force among local resistance groups wishing for the restoration of the former Belgium."
 KSP_remove_bandaepa:0 "Remove Opposition"
 KSP_remove_bandaepa_desc:0 "Opposition that refuses to recognize this coalition government still exists within Belgium. If they continue to raise objections, they will become obstacles on our path forward."
 KSP_belgium_gov_helpers:0 "Work Distribution of Belgian Officials"
 KSP_belgium_gov_helpers_desc:0 "After removing the opposition, the gaps left in the government must be filled."
 KSP_belgium_heart:0 "Belgian Will"
 KSP_belgium_heart_desc:0 "In November 1935, the Belgian government vanished due to the sudden Great Transfer, but we survived and formed a new government with our new friends. Now, we will never fall again, and our Belgium will last forever!"
 KSP_stabilize_inside:0 "Internal Stabilization"
 KSP_stabilize_inside_desc:0 "We must crush the Labor Front, an anti-state organization established by the cooperation of the Belgian Labor Party and Communist Party that disrupts the administrative procedures of Valkyrie and Belgium."
 KSP_belgian_simin_help:0 "Mobilize Belgian Citizens"
 KSP_belgian_simin_help_desc:0 "By accepting the advice of the Rex Party, Belgian citizens can be mobilized for Belgian reconstruction projects."
 KSP_country_rebuild_danguk:0 "Establish Wallonia Reconstruction Authority"
 KSP_country_rebuild_danguk_desc:0 "We have stabilized the region, but infrastructure and industrial facilities remain in a state of collapse. A reconstruction authority must be established for future rebuilding projects."
 KSP_rebuild_roads:0 "Restructure Road Network"
 KSP_rebuild_roads_desc:0 "First, the road network must be organized for smooth operations."
 KSP_belgian_sanup_control:0 "Utilize Belgian Industry"
 KSP_belgian_sanup_control_desc:0 "Surprisingly, we have confirmed that some industrial facilities are functioning normally even in this disastrous situation. This will be a great help to us."
 KSP_belgian_sanup_hwakjang:0 "Forced Expansion of Belgian Industry"
 KSP_belgian_sanup_hwakjang_desc:0 "Judging by the current situation of neighboring countries, it is certain that serious national security issues will strike us soon. To prepare for this, we must squeeze every bit of labor out of the populace day and night to normalize industry, even if there is some public dissatisfaction."
 KSP_chian_uzi_students:0 "Mobilize Student Police"
 KSP_chian_uzi_students_desc:0 "To deal with the Rex Party militias, broad civilian-police cooperation is required. We will mobilize Valkyrie police to receive tips from the Labor Front and execute a widespread operation to destroy the Rexists."
 KSP_cooperation_with_the_right:0 "Cooperation with the Belgian Right"
 KSP_cooperation_with_the_right_desc:0 "We will stabilize Belgian politics by cooperating with the Rex Party in the Walloon region, classified as a right-wing force among local resistance groups wishing for the restoration of the former Belgium."
 KSP_valkyrie_government_tonghap:0 "Internal Unity"
 KSP_valkyrie_government_tonghap_desc:0 "Many students within the department still have complaints and worries about allying with the Belgians. For the sake of smooth relations, it is necessary to quell the students' dissatisfaction."
 KSP_sanghwal_safety_helping:0 "Cooperation of the Life Safety Bureau"
 KSP_sanghwal_safety_helping_desc:0 "We're all in this together! Let's show them what Valkyrie can do!"
 KSP_gyeongbiguk_helping:0 "Cooperation of the Security Bureau"
 KSP_gyeongbiguk_helping_desc:0 "Standing together for a safer tomorrow."
 KSP_kanna_gov_empower:0 "Expand Kanna Government Influence"
 KSP_kanna_gov_empower_desc:0 "While we are currently in a cooperative relationship with the Belgians, we must also be cautious of their influence becoming too large within the government."
 KSP_gov_gaepyeon_0:0 "Government Reorganization"
 KSP_gov_gaepyeon_0_desc:0 "For smooth administrative processing, Valkyrie departments within the government must be reorganized through cooperation with the Belgians."
 KSP_gwanleojae_sulgae:0 "Valkyrie Bureaucracy Reform"
 KSP_gwanleojae_sulgae_desc:0 "We will improve the system by accepting advice from the Belgian Communist Party and Labor Party, restructuring Valkyrie's bureaucracy to be more efficient."
 KSP_kanna_gov:0 "Kanna-Centric"
 KSP_kanna_gov_desc:0 "Focusing power centrally on Bureau Chief Kanna will help prevent internal conflicts and increase national unity."
 KSP_students_have_power:0 "Student-Centric"
 KSP_students_have_power_desc:0 "It wouldn't be bad to give students opportunities and accept their diverse individual opinions."
 KSP_students_working_camp:0 "Student Labor"
 KSP_students_working_camp_desc:0 "What we currently need are workers. Assigning extra students to the reconstruction authority for deployment at construction sites will be helpful."
 KSP_student_volunteers:0 "Student Labor Specialization"
 KSP_student_volunteers_desc:0 "It seems some of our students have a talent for construction engineering. Enhancing their expertise will allow for efficient manpower placement and speed up construction completion."
 KSP_rebuild_country:0 "Restore the Damaged Land"
 KSP_rebuild_country_desc:0 "After a long time, infrastructure in key regions has been restored and people are regaining their vitality."
 KSP_two_together:0 "Coexistence"
 KSP_two_together_desc:0 "Although we are in the same territory, Valkyrie and Belgium have essentially different characteristics in history, culture, and values. Therefore, we will choose coexistence."
 KSP_fusion:0 "Fusion"
 KSP_fusion_desc:0 "Valkyrie and Belgium have overcome many hardships and adversities together, forming a solid bond. We will become one to face even greater challenges ahead!"
 KSP_tonghap_junbi:0 "Prepare Integration"
 KSP_tonghap_junbi_desc:0 "Planning for a shared future."
 KSP_give_students_simingwun:0 "Grant Citizenship to Students"
 KSP_give_students_simingwun_desc:0 "To promote social integration, citizenship will be granted to students as well."
 KSP_two_gov_tonghap:0 "Operational Integration"
 KSP_two_gov_tonghap_desc:0 "Bringing our systems together under one roof."
 KSP_two_gov_chaegae:0 "Dual Government System"
 KSP_two_gov_chaegae_desc:0 "We will organize respective governments to ensure a high degree of mutual autonomy."
 KSP_gujugu_bunri:0 "Residential Area Separation"
 KSP_gujugu_bunri_desc:0 "Maintaining separate living spaces to minimize friction."
 KSP_upmu_bulri_tech:0 "Operational Separation"
 KSP_upmu_bulri_tech_desc:0 "Dividing duties based on specialization and origin."
 KSP_yunjung_over:0 "Shared Governance"
 KSP_yunjung_over_desc:0 "With social stabilization, there is no longer a need for a coalition government; we will now live together under a single name."

# Generic/Placeholder
 KSP_valkyrie_democracy:0 "Valkyrie Democracy"
 KSP_valkyrie_democracy_desc:0 "Power to the students! And maybe more donut shops!"
 KSP_belgium_restore:0 "Resurrection of Belgium"
 KSP_belgium_restore_desc:0 "Restoring the glory of the local nation."
 KSP_rebuild_our_army:0 "Rebuild Our Military"
 KSP_rebuild_our_army_desc:0 "Turning student police into a proper defense force."

# Valkyrie Solo Path
 KSP_belgium_baechuk:0 "Quiet Belgian Resistance"
 KSP_belgium_baechuk_desc:0 "Before the Great Transfer and Valkyrie Police Academy's arrival here, a nation called 'Belgium' existed on this land. However, this is now Valkyrie territory. Subduing those who resist legitimate rule is simply one of the duties of the Police Academy."
 KSP_valkyrie_dandok_gov:0 "Valkyrie Government"
 KSP_valkyrie_dandok_gov_desc:0 "Since most events in the new world are unexpected, the old political system that makes rapid response impossible is inefficient. It is time to establish a new Valkyrie government."
 KSP_gov_gaepyeon:0 "Bureaucracy Reorganization"
 KSP_gov_gaepyeon_desc:0 "Valkyrie's vertical political structure, where most things are top-down, lowers its ability to respond to sudden situations. Reorganizing the bureaucracy might solve this problem."
 KSP_belgium_ukje:0 "Suppress Belgian Influence"
 KSP_belgium_ukje_desc:0 "As the Belgian resistance movement failed, those resisting us continue their activities out of sight. Larger problems may arise if their influence is not suppressed."
 KSP_kanna_health_problems:0 "Strengthen Bureau Chief's Authority"
 KSP_kanna_health_problems_desc:0 "Valkyrie has a somewhat different structure compared to other schools. Evaluation is based on performance, and classes are reassigned by ability. However, in such an unprecedented crisis, the authority of the Public Security Bureau, especially the Bureau Chief, must be strengthened for efficient administration."
 KSP_kanna_gov_rule:0 "Kanna Loyalist Government"
 KSP_kanna_gov_rule_desc:0 "Bureau Chief Kanna is clearly a competent individual who can resolve this crisis. We must trust and follow her leadership."
 KSP_sanghwal_safety_coup:0 "Life Safety Bureau Power Grab"
 KSP_sanghwal_safety_coup_desc:0 "It is a clear fact that negotiations with Belgium failed due to the current Valkyrie leadership's coercive and incompetent behavior! We will declare the end of the emergency regime, including Ogata Kanna, which allows and induces such incompetence."
 KSP_kirino_pa:0 "Nakatsukasa Kirino"
 KSP_kirino_pa_desc:0 "She's trying her best! Even if her aim is a bit... well, you know."
 KSP_council_communism:0 "Valkyrie Council"
 KSP_council_communism_desc:0 "A collective leadership for a fairer future."
 KSP_gyeongbiguk_coup:0 "Fubuki's Opportunism"
 KSP_gyeongbiguk_coup_desc:0 "Taking advantage of the chaos for... whatever Fubuki wants."
 KSP_gsc_president_connect:0 "Search for the GSC President"
 KSP_gsc_president_connect_desc:0 "Where did she go? We really need her to sign off on these donut orders."


