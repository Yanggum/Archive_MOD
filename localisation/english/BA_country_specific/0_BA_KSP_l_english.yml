 KSP_skeban_suppress_desc:0 "We need to use force to put the Sukeban back into the Correction Bureau."
 KSP_country_plan_wakamo:0 "Commence Nationwide Suppression"
 KSP_country_plan_wakamo_desc:0 "Now that Belgian support has increased and the obstructive Sukeban have been subdued, it is time to launch a nationwide suppression operation using all available manpower."
