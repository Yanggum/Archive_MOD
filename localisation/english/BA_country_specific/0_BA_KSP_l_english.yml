 KSP_event.26.t:0 "Reignited Flames"
 KSP_event.26.d:0 "The Valkyrie government's repeated suppression of the Walloon region has finally reached an end, and Belgians have managed to form an effective network to resist us even under tightened surveillance.\n\nNegotiations with the Belgians must be prepared soon, and cooperation with either the Rex Party or the Labor Front will be essential."
 KSP_event.26.a:0 "This isn't good."

