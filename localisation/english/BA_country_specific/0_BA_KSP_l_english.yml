## Kirino's Coup
 KSP_event.115.t:0 "Emergency Arrest of Bureau Chief Kanna"
 KSP_event.115.d:0 "Nakatsukasa Kirino suffered from a bit of guilt. Even so, was it right to treat Bureau Chief Kanna like this? Kirino recalled being scolded by Kanna during a patrol. Chief Kanna had called out the name 'Nakatsukasa' in a terrifying voice, teaching her that it is not polite to point a gun at a passing Belgian for an inspection. That's how cool and charismatic Chief Kanna was! Kirino looked at the handcuffs in her hand. The clinking metal cuffs meant that not even Chief Kanna could dare to resist.\n\nKirino looked up at the Public Security Bureau building. The thought that the Life Safety Bureau, and by extension Valkyrie, would now be shaken and overturned by a single word from Kirino felt strange. In the Bureau Chief's office on the top floor, Kanna was working while drinking coffee. Kirino recalled the charisma Kanna showed during the Great Transfer. Could Kirino truly imitate, no, even attempt to imitate such charisma? She couldn't even shoot a handgun properly yet.\n\nHesitation would make the whole plan disappear. Kirino thought about the kindness shown by the Belgians. She remembered an elderly Belgian lady who had saved Kirino when she was lost in Wallonia and served her tea with a smile. And the Bureau Chief was trying to round up all those Belgians. If not Kirino herself, no one could do it. Fubuki had long been disappointed in the Bureau Chief's hostility toward the locals.\n\nKirino briefly attached the handgun to her waist and caught her breath. It was time to test the charisma she learned from watching the Bureau Chief. As Kirino gestured, a student wearing the Life Safety Bureau logo hurriedly handed her a megaphone. Kirino gestured for the Life Safety Bureau students to raid the Public Security Bureau. Clearing her throat, Kirino shouted loudly.\n\n'Bureau Chief Ogata Kanna! The Life Safety Bureau will no longer comply with the Public Security Bureau's tyranny! Raise your hands and come out peacefully!' As soon as Kirino's words ended, the Public Security Bureau turned into a scene of carnage. Students entangled with each other, pointing guns, and the sound of shields clashing was endless."
 KSP_event.115.a:0 "Kirino's hands were shaking violently."
 KSP_event.116.t:0 "Meeting with Konoka"
 KSP_event.116.d:0 "'Wow, geez, this is quite a view my big sis would love. Don't you think?'\n\nKonoka was spinning the chair in the Bureau Chief's office, taking in the scenery. The office was riddled with bullet holes, traces of the coup. It was hard to tell if Konoka was genuinely admiring the view or metaphorically criticizing the Life Safety Bureau coup with her ambiguous words.\n\nMeanwhile, Kirino sat nervously on the office sofa, fiddling with her handcuffs just as she had when she met Kanna after causing trouble before the Transfer. What had changed since then was that Kanna was under house arrest, and a small Communist theory booklet was tucked into Kirino's breast pocket. Konoka took off her shirt and changed into the Bureau Chief's uniform lying nearby. A blue armband glowed on Konoka's elbow. But contrary to the glowing armband, Konoka looked extremely uncomfortable.\n\n'My big sis really liked this coffee cup. I still don't quite get why.' Konoka smiled at Kirino as if joking. But Kirino's face was stiff, as if she were receiving a punishment. Konoka sighed and continued.\n\n'To be honest, the Life Safety Bureau leading Valkyrie... I really don't like it. Even more than being scolded by my sis.' Kirino flinched, indicating she was listening. Konoka put her feet on the desk. Only the ticking of the clock filled the empty silence. Much like Konoka, who would fill Kanna's empty seat.\n\n'But well, if our 'Great Police Chief Kirino' tells me to do it, I guess I have to. Right?' Konoka stretched her body and approached Kirino, offering a handshake. Kirino still cannot perfectly replicate Kanna's charisma. But as a 'Kind Officer', Kirino comforted herself, saying she could achieve anything. She repeatedly told herself she had simply saved the Belgians from the Bureau Chief's tyranny. Yet, she could not erase the guilt echoing somewhere in her heart. Perhaps that guilt would throb in Kirino's chest forever. For every heartbeat, the guilt would pulse twice.\n\nKirino took her hands off the handcuffs she was fiddling with and reached out to accept Konoka's handshake."
 KSP_event.116.a:0 "It felt as if she had committed a crime."
 KSP_tooltip_konoka:0 "§gKirino heard a small sound as she closed the door and left. It was Konoka's voice muttering, wondering what those crazy girls were going to do. Konoka's voice drifted through the closed door, circling back to choke Kirino's neck.§!"


