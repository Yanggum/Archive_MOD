# Kanna
 KSP_kanna_banned: "§YDeteriorating Health§!"
 KSP_kanna_dictator: "Dictatorship"
 KSP_kanna_dictator_desc: "Kanna, the 'Mad Dog' of the Public Security Bureau, is an individual who rose to the position of Bureau Chief through steadfast conviction and mindset. Now that compromise with the Belgians has failed, Kanna is the only person capable of resolving Valkyrie's unprecedented crisis. We must fully accept her opinions and trust her."
 KSP_kanna_dictatorship_resistance: "Resistance from the Security Bureau"
 KSP_kanna_dictatorship_resistance_desc: "Since the strengthening of Kanna's authority, the Security Bureau has shown an uncooperative attitude toward her instructions, even refusing her legitimate demands. As soon as Kanna declared a dictatorship, they began resisting the Public Security Bureau as if they had been waiting for the moment."
 KSP_kanna_dictatorship_agreement: "Public Security Bureau Acceptance"
 KSP_kanna_dictatorship_agreement_desc: "Since Public Security Bureau Chief Kanna has seized power, the Bureau has reacted positively to her dictatorship and decided to faithfully cooperate with her government. Members of the Bureau will actively follow her opinions and assist her."
 KSP_loyal_police_academy: "Loyal Police Academy"
 KSP_loyal_police_academy_desc: "After eliminating the threat of the self-righteous Kanna, the opposition within Valkyrie seized power and succeeded in establishing their own loyal government. Now, Valkyrie will become a loyal police academy that serves and follows the General Student Council forever."
 KSP_justice: "Justice"
 KSP_justice_desc: "Tolerance, negotiation, cooperation... It is time to bring a total end to Valkyrie's weak past. Having witnessed the incompetence of the General Student Council and Schale regarding the Sanctum Tower, we will wait no longer. There is no reason to show tolerance toward those who damage Kivotos culture."
 KSP_kanna_internal_organize: "Strengthen Internal Unity"
 KSP_kanna_internal_organize_desc: "Although there was a period of internal conflict within Valkyrie and it was successfully mended, voices opposing the government's policies may emerge again. By using various policies and appropriate rewards, we can divert the opposition's attention and secure more firm support."
 KSP_valkyrie_national_reconstruction_committee: "Valkyrie National Reconstruction Committee"
 KSP_valkyrie_national_reconstruction_committee_desc: "The reconstruction of Valkyrie's industry has long been delayed for the establishment of the police state. Now, we must rebuild the nation through a completed and powerful public authority system."
 KSP_expulsion_of_belgian_capitalists: "Expulsion of Belgian Capitalists"
 KSP_expulsion_of_belgian_capitalists_desc: "It is time to expel all Belgian capitalists. Valkyrie's industry must now be operated by Valkyrie itself."
 KSP_network_project: "Network Project"
 KSP_network_project_desc: "Connecting all industrial systems into a network will improve industrial efficiency on a broad scale."
 KSP_complete_recovery: "Total Recovery"
 KSP_complete_recovery_desc: "We have rapidly rebuilt Valkyrie's industry and repaired the damaged lands. Now, we must move on to the next stage."
 KSP_sanctum_tower_recapture: "Recapture the Sanctum Tower"
 KSP_sanctum_tower_recapture_desc: "It is time to overthrow the incompetent General Student Council and seize control ourselves. Prepare for a total offensive for the sake of Valkyrie."
 KSP_new_student_council: "New General Student Council"
 KSP_new_student_council_desc: "We are now the General Student Council. Loyalty shall be sworn to His Excellency, the new GSC President, 'Ogata Kanna'."
 KSP_valkyrie_central_school: "Valkyrie Central School"
 KSP_valkyrie_central_school_desc: "The value of the General Student Council's existence has long since vanished. We will establish Valkyrie Central School and promote powerful national integration policies."
 KSP_nation_of_the_new_era: "System of a New Era"
 KSP_nation_of_the_new_era_desc: "New eras require new systems. The officers of Valkyrie have adapted wonderfully to the new age, and now we must move to the next level."
 KSP_kanna_pardon: "Amnesty Order"
 KSP_meal_restrictions: "Meal Restrictions"
 KSP_meal_restrictions_desc: "Restrict the meal portions for criminals imprisoned in the Correction Bureau."
 KSP_support_rehabilitation: "Rehabilitation Support"
 KSP_support_rehabilitation_desc: "Support rehabilitation efforts."
 KSP_pardon_akira: "Pardon for Akira"
 KSP_pardon_akira_desc: "Pardon Akira."
 KSP_construct_prison: "Construct Prison"
 KSP_construct_prison_desc: "Construct a prison to incarcerate students who have not been corrected. This facility will be used for the corrective education of students."
 KSP_correction_education: "Correctional Education"
 KSP_correction_education_desc: "Conduct correctional education."

 KSP_kanna_defense_tech: "Defense Technology Department"
 KSP_kanna_defense_tech_desc: "Well-trained police alone are not enough to maintain public order. Various auxiliary tools that can enhance the skills of the police must also be prepared. We will establish the Defense Technology Department to assist in this."
 KSP_millenium_support: "Millennium Support"
 KSP_millenium_support_desc: "Millennium's technological prowess is unmatched in Kivotos, and their vast knowledge is essential for us as we strive to develop weaponry. We can significantly increase research speed by offering plea deals to several Millennium students arrested for corruption."
 KSP_millenium_old_supercomputer: "Old Supercomputer"
 KSP_millenium_old_supercomputer_desc: "At Millennium, new products are released or improved daily, so previous works are often considered obsolete and left in the corners of labs. From the 'old' supercomputer we received, innovative technologies that we require may still emerge."
 KSP_valkyrie_task_force: "Riot Police"
 KSP_valkyrie_task_force_tt: "§YEnables the use of equipment factories for the Riot Police.§!"
 KSP_valkyrie_task_force_desc: "Regardless of the threat, the officers of Valkyrie are the shields that stand before the citizens to protect them. If the shield breaks, not only will we fail to protect them, but it will also instill anxiety in the populace. We must arm ourselves to reassure and defend the citizens."
 KSP_valkyrie_of_sky: "Valkyrie of the Sky"
 KSP_valkyrie_of_sky_desc: "No matter how many police officers we have, there are limits when facing enemies in the sky. If we modify our preferred AH-64 Apache helicopters to suit this world, we can expect excellent performance."
 KSP_valkyrie_fast_destroyer: "Fast Patrol Boat"
 KSP_valkyrie_fast_destroyer_desc: "Fast patrol boats are an essential vehicle for us where rapid response is vital. Opinions are rising among the Coast Guard that the application of new technology to these boats will yield positive results."
 KSP_supply_tactical_baton: "Police Baton"
 KSP_supply_tactical_baton_desc: "A baton combining the technology of the New World and the best technology of Kivotos has the side effect of putting criminals to sleep for about 3 hours upon impact. It is highly regarded among new officers as a non-lethal suppression weapon, often called the 'Magic Wand'."
 KSP_goddess_of_war: "Goddess of War"
 KSP_goddess_of_war_desc: "The activity of aircraft that part the clouds and disrupt enemy lines on the battlefield is truly grand. The existence of an air force that spreads hope to allies and fear to enemies is truly worthy of being called the 'Goddess of War'."
 KSP_extract_resource_from_belgium: "Extract Resources from Belgium"
 KSP_extract_resource_from_belgium_desc: "A significant amount of underground resources lies dormant in the Belgian lands we control. If we mine deeper using our world's technology, mineral veins invisible to their technology will be revealed."
 KSP_extract_manpower_from_belgium: "Extract Manpower from Belgium"
 KSP_extract_manpower_from_belgium_desc: "Even as the Valkyrie government's dictatorship continues, the resistance of the Belgians persists. The only way those filling the camps can be useful to us is by serving through forced labor."
 KSP_extract_industry_from_belgium: "Extract Industry from Belgium"
 KSP_extract_industry_from_belgium_desc: "Originally, Valkyrie was an academy for training police, so our basic industry is extremely poor. By utilizing Belgium's industry and infrastructure, we can strengthen our lacking industrial capacity."
 KSP_belgian_colony: "Belgian Security Ministry"
 KSP_belgian_colony_desc: "Thanks to the Valkyrie government's ironclad public security laws, Belgian resistance is decreasing day by day. To more efficiently manage the Belgian citizens who have resigned themselves to and complied with our rule, active debate is occurring within the government regarding the establishment of the Belgian Security Ministry."
 KSP_recruit_local_students: "Recruit Local Students"
 KSP_recruit_local_students_desc: "Some students are expressing dissatisfaction due to excessive workloads. By recruiting local students into Valkyrie for shift work, we can quell their dissatisfaction and maintain public order more efficiently and stably."
 KSP_public_security_bureau_training: "Public Security Bureau Training"
 KSP_public_security_bureau_training_desc: "In the chaotic situation of the Great Transfer, it has been a long time since Valkyrie students received even the simple basic training included in their daily routine. Now that confusion and dissatisfaction are not visible on the surface, it is time to revive the collapsed discipline and daily life of Valkyrie."
 KSP_rank_promotion: "Special One-Rank Promotion"
 KSP_rank_promotion_desc: "In an organization with a hierarchy, it is natural and honorable to be promoted after achieving a great feat. All those who have worked for Valkyrie thus far deserve the glorious reward of a one-rank promotion. Today, everyone is a protagonist."
 KSP_strong_cane_of_the_people: "The 'Strong' Cane of the People"
 KSP_strong_cane_of_the_people_desc: "When active intervention was impossible due to the autonomy of each academy, we grew idle in peace and received distrustful looks. However, the enterprising Valkyrie students who have gained various experiences through the Great Transfer will no longer be a ragtag bunch, but truly the 'Strong Cane of the People'."
 KSP_police_nation: "Police State"
 KSP_police_nation_desc: "As a result of the efforts of many Valkyrie students, we have reached an environment where we can survive independently without relying on anyone. Having established order in Belgium, we will become a so-called 'Police State', rooting out the chaos spreading across the world and cultivating justice."

 KSP_kspd_tt: "§Y$KSP_kspd$§! Modifier:"
 KSP_kspd: "K.S.P.D."
 KSP_kspd_desc: "K.S.P.D. stands for the Kivotos Student Police Department, an organization where Valkyrie students perform their roles as police. Valkyrie students fulfill their duties to contribute to maintaining the 'safety' of Belgium."

# Dictatorship Path Events
 KSP_event.102.t: "Special One-Rank Promotion"
 KSP_event.102.d: "Having wisely resolved the internal unrest, we intend to reward the two officers who played the most leading roles. Who should receive the reward?"
 KSP_event.102.a: "Reward the officer who aggressively cleared out the insurgents!"
 KSP_event.102.b: "Reward the officer who led the students through training and guidance!"

