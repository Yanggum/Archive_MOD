 KSP_kanna_health_and_gov_problems:0 "Shaken Government"
 KSP_kanna_health_and_gov_problems_desc:0 "The interior of Valkyrie Police Academy has become very chaotic due to Kanna's deteriorating health. Taking advantage of the gap when Kanna collapsed, students with opinions different from the current regime are active again, and students in charge of administration are having difficulty handling the greatly increased workload due to the absence of central control. However, this dangerous situation where Valkyrie's administrative capacity has taken a major hit due to §YKanna§!'s absence might be an opportunity for §Ysomeone§! who wants to maintain her regime. If she can keep the impact of administrative collapse from becoming §ttoo large§!, this crisis could greatly strengthen her power...\n\nValkyrie's current difficulty in administrative work is indicated as the §tAdministrative Collapse§! value, which is currently §R[?KSP_gov_hangjung_disorder_var]§! out of the maximum §R20§!, and students will gradually become accustomed to administrative work every §G[?KSP_getting_used_to_work_gov_var]§! days, but problems might occur in that process, whether §Rintentional§! or §Cunintentional§!.\n\nAlso, you must watch out for the §tLife Safety Bureau§! and §8Security Bureau§! who are dissatisfied with the current regime. If their influence becomes too large, they will prepare a coup!"
 KSP_getting_used_to_work_gov:0 "Students Getting Used to Work"
 KSP_getting_used_to_work_gov_desc:0 "Slowly but surely, we're getting the hang of this. I think."
 KSP_getting_used_to_work_gov_tt:0 "The current Administrative Collapse value is §R[?KSP_gov_hangjung_disorder_var]§! out of 20, and it will decrease by §G1§! upon completion of this decision."
