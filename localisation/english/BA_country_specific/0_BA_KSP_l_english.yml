 KSP_event.100.t:0 "End of Calamity"
 KSP_event.100.d:0 "The Fox of Calamity, who committed terrorism in the Valkyrie zone, has been subdued. Her actions threatened the safety of Valkyrie Police Academy and can no longer be tolerated. She has now been subdued and is currently locked in a cold cell in the Correction Bureau. She will no longer be a threat to Valkyrie."
 KSP_event.100.a:0 "§CAnd so, the Fox of Calamity was subdued.§!"

 KSP_event.101.t:0 "Opposition Within Valkyrie"
 KSP_event.101.d:0 "In the process of subduing Belgian protests and expelling local opposition, dissatisfaction eventually erupted from the Security Bureau as their workload increased. When Bureau Chief Kanna threatened to severely punish those involved if the current dissatisfaction continued, complaints began to emerge from within the Public Security Bureau as well."
 KSP_event.101.c:0 "Let them talk, the school is still running fine!"
