 KSP_wakamo_problem:0 "Escape of Calamity"
 KSP_wakamo_problem_desc:0 "The Federal Correction Bureau exerted all its strength to prevent the escape of the Seven Prisoners, but it has finally reached its limit. We must now subdue an opponent on a completely different level from the inmates currently on the loose."
 KSP_suppressing_plan_sustain:0 "Commence Suppression Operation"
 KSP_suppressing_plan_sustain_desc:0 "Following the collapse of the Federal Correction Bureau, social chaos is accelerating due to the escape of even more prisoners. We must act quickly before Valkyrie crumbles."
 KSP_hyeongi_help_more:0 "Strengthen Belgian Cooperation"
 KSP_hyeongi_help_more_desc:0 "Since the Belgian government collapsed in November 1935, the Belgians have been in a hostile relationship with us. However, as chaos intensified following the collapse of the Federal Correction Bureau, they decided to cooperate with us to prevent the ruin of both parties."
