l_english:

 KSP_country_intro_header: "§CGuardian of the New Order§!"
 KSP_country_intro_content: "\nValkyrie Police Academy, also known as the Kivotos Student Police Department (KSPD), has suddenly been dropped into a region of Belgium.\n\nThe abrupt transition has paralyzed administration, and the students under Public Security Bureau Chief Kanna are in a state of chaos, unsure of how to act.\n\nConnection with the General Student Council has been severed, creating a desperate situation where no instructions can be received.\n\nIn this worst-case scenario that may yet deteriorate further, fulfill your duty as guardians of order by calming the locals and stabilizing the Shiratori District to rectify the unstable order of Kivotos.\n\n§YDevelopment - UnineVesiKass §!\n§YFormer Development - Mako, SKSKIe, Regulus Imika, Wolha, Haenongi, Lolenheim§!"

 KSP_guide: "Objectives\n\n£white_dot. Assess and respond to the current crisis.\n£white_dot. Maintain regional security through Valkyrie students.\n£white_dot. Subdue the escaped Wakamo.\n£white_dot. Stabilize Belgium and make the best choices for the sake of order."

 # Valkyrie Story Archive
 KSP_story_archive: "Story Archive"
 KSP_show_story_archive_gui: "Valkyrie Story Archive"
 KSP_show_story_archive_gui_desc: "Allows you to view side stories involving Valkyrie and Belgium. This is independent of game systems and was created solely for enjoying side stories related to the in-game nations. New stories may be added as time and events progress. Please enjoy."

 KSP_attempt_to_gain_control_of_the_srt: "Attempt to Secure Control of SRT"
 KSP_attempt_to_gain_control_of_the_srt_desc: "With the General Student Council President missing and the SRT's command authority in limbo, Valkyrie must take custody of them and temporarily assume the roles of the SRT Special Academy."

 KSP_division_of_military: "Fate of the SRT Special Academy"
 KSP_division_of_military_desc: "The discussion regarding the fate of the SRT, initiated by Valkyrie's claims, is currently intensifying. Only two outcomes remain: the SRT being merged into Valkyrie as requested, or the SRT remaining under the General Student Council."
 KSP_mission_division_of_military_trigger_tooltip: "@KSP Influence Score §Y100§! or higher"
