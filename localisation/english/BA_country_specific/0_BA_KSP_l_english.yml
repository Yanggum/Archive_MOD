# Life Safety Bureau Independence Focuses
 KSP_independence_claim_1: "Total Deprivation of Schale's Investigative Rights"
 KSP_independence_claim_1_desc: "The complete removal of investigative powers from Schale is the final step in protecting the sovereignty of Valkyrie Police Academy. It is intolerable that a mere AI is interfering in everything above us. We must no longer be satisfied with this situation. Only by stripping the investigative rights of that hunk of junk and reclaiming what is originally ours can we achieve what we want."
 KSP_independence_claim_2: "Valkyrie Kivotos State"
 KSP_independence_claim_2_desc: "We are an independent administrative and investigative body belonging to no one. We autonomously decide on the establishment of school laws, the disposal of lawbreakers, and arrest operations. Currently, our upper management is the Student Council. While we nominally belong to Schale, formalizing our independence is possible with a simple declaration. A single word from us is enough to erase Schale's name from the posters."
 KSP_valkyrie_alliance: "Valkyrie Alliance"

# Integrated Conquest Focuses
 KSP_massive_correct_plan: "Massive Correction Plan"
 KSP_massive_correct_plan_desc: "Maintaining order and correction are the primary duties of Valkyrie Police Academy. In the past, we couldn't even perform these duties properly in our own jurisdiction, but the situation has changed. All preparations are complete, and we are ready to formulate and execute a correction strategy. Valkyrie is now ready to restore order by handing criminals over to the Correction Bureau."
 KSP_srt_correct_plan: "Total Sweep"
 KSP_srt_correct_plan_desc: "The gangs of Brittany operate independently and have been involved in numerous terror incidents. This must have occurred under the approval of their higher-ups. Their criminal acts are clear, and our arrests are a righteous duty. Soon, we will face them directly in the Correction Bureau prison."
 KSP_mil_correct_plan: "Millennium Correction Plan"
 KSP_mil_correct_plan_desc: "Millennium Science School disrupts peace by continuing political disputes with gunfire and shelling in traditional French territory. This is a clear hostile act, and their intrusion into French territory provides us with strong grounds for action. We have notified the higher-ups, which is a clear signal that they must be corrected."
 KSP_heu_correct_plan: "Handyman Arrest"
 KSP_heu_correct_plan_desc: "Located in the anarchist zone near our border, 'Problem Solver 68' is operated by those expelled from Gehenna Academy. They are the masterminds of border terror and a nuisance that takes any job for money. We will tolerate it no longer. Our batons and handcuffs will bring them justice!"
 KSP_geh_correct_plan: "Gehenna Correction Plan"
 KSP_geh_correct_plan_desc: "Gehenna is a criminal group that ignores discipline. Even after achieving political victory, they do not care about their own security. Amid continuous terror and surprise attacks on Valkyrie students, Gehenna has made no diplomatic contact. If they will not correct themselves, we will correct them."
 KSP_schale_correct_plan: "Schale Correction Plan"
 KSP_schale_correct_plan_desc: "Schale is an extra-legal club created by the current GSC President, its purpose unknown but currently ruled by an AI. The GSC President is missing. Valkyrie's leadership fears an AI rebellion, and this arrogant AI will soon be destroyed."
 KSP_ragnarok: "Ragnarok"
 KSP_ragnarok_desc: "The Academy now turns toward the east. Our muzzles are ready to point at Trinity, Shanhaijing, Abydos, Hyakkiyako, Red Winter, and all other academies. We are ready to fight against dissenters. We will become Kivotos itself and burn down all obstacles. Through... Ragnarok, which burns everything."

