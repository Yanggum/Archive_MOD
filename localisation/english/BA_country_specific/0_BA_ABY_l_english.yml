 ABY_descision_focus_event.50.t:0 "독대"
 ABY_descision_focus_event.50.d:0 ""으헤~ 완전히 잠겨버렸네."\n\n"허허... 이거 회의 끝날 때까지는 기다려야 겠군요."\n\n갇혔다.\n마사리크가 자다가 회의에 불참한 호시노를 데리러 온 짧은 순간에, 경비원이 작업실 문을 잠그고 가버렸다.\n그리하여 두 사람은 어색하게 불 꺼진 작업실 안에 마주앉아 있었다.\n그러다 호시노가 첫마디를 꺼냈다.\n\n"저기~마사리크 씨. 요즘 후배들은 어때? 다들 마사리크 씨만 따라다녀서 이 아저씨는 외롭다구?"\n\n마사리크는 호시노가 유도심문을 하는 것을 눈치채고 그녀를 정치인의 그것이 아닌, 신심으로 대해보기로 했다.\n"뭐, 다들 열심이죠, 호시노 양. 특히나 세리카 양은 제일 괄목할 만한 성장을 이루었더군요."\n\n"헤에~"\n"그럼, 마사리크 씨는 그 아이들이 어떻게 되었으면 좋겠는데?"\n\n"저는 장차 그 아이들이 두 세계의 화합으로 향하는 돌파구가 되기를 바래요."\n\n평소와는 다르게, 감정의 숨김 없이 말을 하는 마사리크의 모습에 당황해 호시노는 속마음을 조급 내벹고 말았다."
 ABY_descision_focus_event.50.a:0 ""으헤... 그 아이들이 그걸 원하는 걸까나~""
 ABY_descision_focus_event.50.b:0 ""

 ABY_descision_focus_event.51.t:0 "센세"
 ABY_descision_focus_event.51.d:0 ""...어쩌면 제가 원하는 색으로, 순수한 아이들의 하얀 도화지를 칠하는 행위일지로 모르죠."\n"저는 그 아이들에게 거짓말을 가르쳤어요. 사람을 의심하는 법을 알려줬고, 자신의 본성을 억누를 것을 권고했으며, 싫어하는 이들과 함께 있게 했어요."\n"그 아이들은 저를 <센세> 라고 부르지만, 저는 제가 키보토스에서 말하는 그런 <센세>의 자질이 있는지, 스스로 의심을 합니다."\n"가족도 지키지 못한 제가, 갑작스럽게 만난 아이들의 <센세>가 될 자격이 있는지... 아, 미안해요 호시노 양. 논점을 벗어났네요."\n\n호시노는 마사리크의 눈에 맺힌 작은 물방울을 보았다.\n자신이 아비도스를, 후배를 위해 본성을 숨기는 것처럼, 이 사람도 조국을 위해 철인 지도자를 연기했구나, 라고 호시노는 어렴풋이 생각했다.\n"아니, 계속해줘. 마사리크 씨의 이야기를... 더 듣고 싶어."\n\n"호시노 양이 그렇다면..."\n"...저는 거짓으로 점철된 삶을 살아왔어요. 그것이 저의 사욕을 위해서였냐 라고 한다면... 철학가들마다 다르게 생각하겠지만, 일단 저는 아니라고 생각해요."\n"제 거짓들은 모두 제가 사랑하는 것들을 지키기 위해서였다고, 전 자부할 수 있어요."\n"호시노 양은 어찌 생각할지 모르겠지만 그 아이들에게 한 것도... 같은 이유겠지요."\n\n호시노는 자신도 모르게 입을 열었다.\n"그, 아저씨도 할 일을..!"\n\n그때 문이 열렸다.\n"각하, 여기 계셨던 겁니까? 너무 오랫동안 안 오셔서 걱정했잖습니까..."\n"허허, 아닐세. 회의가 벌써 끝난건가?"\n"거의 다 되긴 했는데... 각하가 필요한 안건이 몇 있어서 빨리 가셔야 할 듯 합니다."\n"그래, 빨리 가도록 하지."\n\n"저..."\n무언가 말하려는 호시노에게, 마사리크는 한 마디를 남겨주었다."
 ABY_descision_focus_event.51.a:0 ""할 일은 스스로. 그 아이들도 모두 그랬답니다.""
 ABY_descision_focus_event.51.b:0 ""

