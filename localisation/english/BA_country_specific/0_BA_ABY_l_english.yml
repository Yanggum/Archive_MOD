 ABY_descision_category_focus:0 "Triumvirate"
 ABY_descision_category_masaryk:0 "The Last Spark"
 ABY_descision_category_masaryk_desc:0 "Tomáš Garrigue Masaryk,\nThe Liberator President, the Philosopher King, the Father of Bohemia, the Sensei of Abydos, and many other titles. He intended to resign from the presidency in December 1935, but due to the Transference and various overlapping circumstances, it was not until January 1937 that he was able to step down from the heavy authority he had held since 1918.\n\nHowever, just because his authority is gone does not mean the heavy responsibility left to him has disappeared. He has stepped down from public office, but he remains a strong political figure, and his successors will lead this country.\n\nHe knows.\nThat the time left to him is not much.\n\nThe man who came to be called the "Father of Bohemia" as he was respected by both the Czechs and Germans of Bohemia,\nThe man who was respected even by Kivotosians and Abydosians, coming to be called the "Sensei of Abydos",\n\nDepending on how Masaryk spends his last remaining time, the fate of this country, and furthermore the two worlds, will be decided!"
 ABY_descision_category_two_world:0 "Nation of Two Worlds"
 ABY_descision_category_two_world_desc:0 "Nation of Two Worlds.\nOutsiders call Abydos the 'Nation of Two Worlds' with respect on one hand, and with contempt on the other.\n\nThose who show respect will call it a flower of harmony and hope blooming amidst hatred and chaos, while those who hold contempt will cynically dismiss it as a mere unattainable ideal.\n\nNaturally, reality is probably closer to what the contemptuous think. The locals have experienced ethnic\nconflicts, and the Kivotosians have also experienced conflicts between academies, so it is a fantasy to think that two entirely different races could live together completely without fighting.\n\nHowever, if we can reduce the conflict between the two races to the level of conflicts between ethnicities or academies, that will be enough.\n\nThe 'most beautiful flower in the world' that captures everyone's attention is something we cannot bloom, nor does it even exist in the first place.\n\nBut if it is a 'single modest orchid blooming in the wasteland', we can bloom it and draw everyone's attention.\n\nAnd that will be what we want and what we must aim for."
 ABY_descision_category_crysis_gyemong:0 "Global Crisis"


