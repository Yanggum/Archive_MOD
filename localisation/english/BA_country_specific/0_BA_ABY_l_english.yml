 #아비도스 오프닝#
 ABY_country_intro_header: "§Y두 세계의 국가§!"
 ABY_country_intro_content: "§1아비도스 고등학교§!를 무엇에 비유할 수 있을까요? 아마 §4'더는 빛나지 않는 사파이어'§!가 적절할 것입니다. 과거 아비도스에 70명의 학생회장이 난립하며 내전을 벌이던 때, 질서를 수호하고 아비도스를 통일했으며, 나아가 온 키보토스를 발 아래에 두며 공포에 떨게 했던 학생회장 셰마타의 치세는 이제는 한 전설에 불과합니다. 그가 이룬 아비도스의 모든 것은 모래 속에 덮여 자취를 감추었습니다. 누군가에게는 빠르게, 그리고 누군가에게는 천천히 아비도스는 붕괴했고, 셰마타의 유산도, 과거의 영광도 온데간데없이 아비도스는 현재 약 §Y9억 엔§!이라는, 학원에게 별로 부담이 되지 않아야 할 빚에 허덕이는 비참한 신세가 되었습니다. 아비도스 고등학교에 남은 학생은 §P타카나시 호시노§!, §4스나오오카미 시로코§!, §Y이자요이 노노미§!, §0쿠로미 세리카§!, 그리고 §t오쿠소라 아야네§! 5명뿐이며, 이들은 지금까지 아비도스를 힘겹게 지켜오고 있었습니다. 가히 최악의 상황이라 해도 손색이 없었죠.\n\n그런 상황에서 벌어진 §Y‘대전이’§!는 아비도스 고등학교에게는 호재였을지도 모릅니다. 아비도스의 채무를 쥐고 압박하던 §L카이저 코퍼레이션§!은 영국 땅에서 전쟁을 치르게 되었고, 덕분에 카이저의 손아귀에서 벗어난 아비도스 고등학교는 빚의 올가미에서 벗어나 행동의 자유를 얻게 되었습니다. 대전이에 대응하여, 아비도스는 룩셈부르크의 §P흥신소68§!과 함께, 현지인들과의 공존을 택한 둘뿐인 키보토스 조직이 되었습니다. 아비도스 외 다른 모든 학원이 현지의 국가와 전쟁을 치르는 와중, §Y북주데텐란트§!로 전이된 아비도스는 체코계와 독일계 등 §Y현지인§!들과 함께 비상전시내각을 조직하고 긴급총동원령 등의 전시 수칙을 담은 §Y행정명령 111호§!를 발동하는 등 빠르게 정부를 복구하고 재조직했습니다. 다섯 학생들은 각자의 위치에서 최선을 다했고, 이는 충분한 결실을 맺었습니다. 이들이 만들어낸 열매는 아비도스에 있어 큰 호재가 되었습니다.\n\n명백한 열세 속에서도 잔존 §Y체코슬로바키아군§!은 질서정연한 후퇴와 지연전을 펼칠 수 있었고, 이는 키보토스인과 독일계 주민들이 민병대를 조직하고 방어선을 구축하기에 충분한 시간을 마련했습니다. §4아비도스-체코 연립정부§!의 적이었던 §P백귀야행 연합학원§!의 군대는 질적으로는 명백히 우세했지만, 게릴라와 현지 지형에 대한 무지, 그리고 백귀야행 연합학원의 느슨한 체제 운영이라는 삼중고가 겹쳐 패배를 거듭했습니다. 결국 대부분의 학원들이 지구에 자리잡은 후인 §Y1935년 12월 30일§!, 연립정부와 백귀야행 연합학원 간 §Y평화 협정§!이 체결되며 체코에서의 총성은 잦아들었습니다. \n\n§4아비도스 임시정부§!. 키보토스계, 체코계, 독일계가 연합한 이 연합국가는 아직 건재합니다. 그러나 각자의 목표가 완수되어도 이 기이한 연합체가 지속될 수 있을까요? 외부에서는 아비도스를 한편으로는 경의, 한편으로는 모멸을 담아 §Y'두 세계의 국가'§!라고 부릅니다. 이 별명을 부르는 의미도, 이를 이루는 민족도, 그리고 그들의 사상마저도 다양한 §Y'두 세계의 국가'§!는 그 이름을 끝까지 유지할 수 있을까요? 그들 사이에 얽힌 이념과 민족의 복잡한 문제를, 그들은 과연 풀어낼 수 있을까요? 답은 시간만이 알고 있을 것입니다.\n\n§Y과연 고르디우스의 매듭을 풀 방법이 밝혀질까요? 아니면 옛이야기처럼 결국 끊어지게 될까요?§!\n\n\n§C개발- 코이, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_guide: "목표\n\n£white_dot §Y연립정부§!를 출범하십시오.\n£white_dot §Y아비도스 대책위원회§!를 어엿한 §Y지도자§!로써 키워내십시오.\n£white_dot §Y체코§!와 §Y오스트리아§!를 해방하고 §Y아비도스 연방§!을 결성하십시오.\n    £white_dot §4베네시의 부탁을 받아들이고 연방을 안정화하십시오.§!\n        £white_dot §Y연방의 존속이 위태롭다면, 이 땅의 주인들에게 맡겨 보십시오.§!\n                오스트리아와 체코를 분리하십시오.\n                소협상국을 재건하십시오.\n                체코슬로바키아를 재결성하십시오.\n                유럽의 미래를 위한 길로 나아가십시오.\n                우리가 유럽의 통합의 길을 열 것입니다.\n            혹은...\n        £white_dot §Y아비도스 연방공화국 총선을 치르고 헌법을 제정하십시오.§!\n                슬로바키아와 통일을 논의하십시오.\n                스위스와 함께 유럽의 중립국이 되십시오.\n                혹은...\n                침략에 맞서 연방을 수호하기 위해 싸우십시오.\n                중립정책을 파기하고 두 세계의 통합을 향해 나아가십시오.\n                우리가 두 세계의 전쟁을 끝낼 것입니다.\n            혹은...\n    £white_dot §0연방의 통합을 거부하는 위협세력을 제거하십시오.§!\n        £white_dot §Y내무군을 주축으로 적성세력을 몰아내고 정부를 장악하십시오.§!\n        £white_dot 연방을 침공하는 적국에 대항한 성전을 선포하고 그들을 몰아내십시오.\n        £white_dot 대아비도스 합중국을 선언하십시오.\n                내무군을 움직여 시민들을 보호하십시오.\n                평화적인 혁명으로 독재정권을 몰아내십시오.\n                우리는 독재정의 잔해 위에 시민의 정부를 세울 것입니다.\n            혹은...\n                군부 인물들 사이에 갈등을 유발하고 그들을 분열시키십시오.\n                프라하의 참사에 대한 징벌을 위해 움직이십시오.\n                우리는 유신헌법을 제정하고 구세대를 몰아낼 것입니다.\n            혹은...\n        £white_dot §Y적성세력과 타협하는 반국가분자들을 일망타진 하고 내전을 승리로 이끄십시오.§!\n                키보토스 민족주의를 설파하고 영도자 아래 키보토스를 통일하십시오.\n                키보토스인의 생활권을 확보하고 현지인을 억압하십시오.\n                우리는 이 세계에 새로운 질서를 세울 것입니다.\n            혹은...\n    £white_dot §t연방의 붕괴 속에서 새로운 희망을 찾으십시오.§!\n        £white_dot §Y좌익을 규합하여 새로운 인터내셔널 대회를 개회하십시오.§!\n                유토피아\n                우리는\n            혹은...\n        £white_dot §Y복수를 위해 과거의 적과 손을 맞잡으십시오.§!\n                새로운 영토의 키보토스인들과 협력하여 조국전선을 분쇄하십시오.\n                남쪽과 북쪽의 파시즘 국가 중 더 위험한 쪽을 판별하십시오.\n                파시즘에 대한 복수를 완수하고 키보토스인이 대우받는 국가를 건설하십시오.\n							    	혹은... \n                사라지지 않는 증오를 이 세계에 풀어내십시오.\n                우리는 마땅히 받아야 할 것을 쟁취할 것이고, 적들은 핍박의 대가를 치를 것입니다.\n\n\n§C개발- 코이, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_GATHERING_STORM_DESC:0 "아비도스 고등학교는 과거, 키보토스에서 가장 거대하고 부유한 학원이었으나, 심각해진 사막화와 점점 불어난 빚은 학원의 몰락을 초래했습니다. 아비도스에 남은 5명의 학생은 아비도스를 지키기 위해 고군분투하고 있었습니다.\n\n대전이 이후, 사태는 새로운 국면으로 전환되었습니다. 그들을 옭아매던 빚은 없어졌고, 작은 자치구는 역으로 주민들과 현지인들간의 충돌을 억제하는데 큰 도움이 되었으며, 현지인의 협력을 얻을 수 있게 되었습니다.\n허나 오히려 이곳 현지인들 사이의 갈등이 문제가 되고 있습니다. 그들은 이 문제의 해결이 급선무일 것입니다."
