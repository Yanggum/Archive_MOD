#ABY_focus_helicopter:0 "헬리콥터 운용"
#ABY_focus_helicopter_desc:0 "대전이가 일어났음에도 헬리콥터 기술은 여전히 남아있었으며, 기술이 상대적으로 떨어지는 이 세계에선 더욱 효과적이고 강력한 무기가 될 것입니다."
#ABY_focus_ocuupied_lands:0 "점령지 처우"
#ABY_focus_ocuupied_lands_desc:0 "우리 점령지의 시민 대다수는 아직 서로간의 깊은 감정의 골이 남아 있고,통합시도에 반발하고 있습니다.\n어쩌면 그들에게 자치권을 주어 스스로 결정토록 하는 편이 나을지도 모릅니다."
#ABY_focus_ocuupied_lands_army:0 "Recruit Local Forces"
#ABY_focus_ocuupied_lands_army_desc:0 "By increasing military benefits and pay, we can encourage the youth in occupied territories to enlist."
#ABY_focus_ocuupied_lands_industry:0 "Standardize Local Industry"
#ABY_focus_ocuupied_lands_industry_desc:0 "Most industrial facilities in occupied territories do not match our standards.\nBy standardizing them and applying efficient production methods, we can secure a portion of their output."
#ABY_focus_ocuupied_lands_accept:0 "Respect Local Autonomy"
#ABY_focus_ocuupied_lands_accept_desc:0 "Allowing locals to establish their own small governments will help reduce resistance."
#ABY_focus_ocuupied_lands_people_security:0 "Local Civil Guard"
#ABY_focus_ocuupied_lands_people_security_desc:0 "By transferring regional security responsibility to local governments, except for certain sectors, we can prevent the large-scale drain of manpower in occupied lands."
###Industrial Focus
#ABY_focus_restart_industry:0 "Restart Industry"
#ABY_focus_restart_industry_desc:0 "We are finally able to restart our stalled industries.\nWe must accelerate industrial reconstruction."
#ABY_focus_kivotos_industry:0 "Reactivate Industrial Zones"
#ABY_focus_kivotos_industry_desc:0 "During the Great Transition, industrial zones on the outskirts of Abydos transitioned with us, while most facilities in Sudetenland vanished.\nFortunately, even though only a fraction of the outskirts transitioned, they were larger in scale than the facilities previously in Sudetenland.\nIt is time to reactivate these long-dormant facilities."
#ABY_focus_neptis_industry:0 "Acquire Neptis Facilities"
#ABY_focus_neptis_industry_desc:0 "Nonomi has decided to reactivate the Neptis facilities.\nOther students said it wasn't necessary, but her resolve seems firm."
#ABY_focus_saint_neptis:0 "Saint Neptis"
#ABY_focus_saint_neptis_desc:0 "Saint Neptis, a subsidiary of the Neptis Group, is a company specializing in rail passenger and freight transport.\nThe railway industry, the Neptis Group's largest business, will be helpful here as well."
#ABY_focus_abydos_main_rail:0 "Abydos Central Railway"
#ABY_focus_abydos_main_rail_desc:0 "Though it is currently scaled back with many closed sections, the Abydos Central Railway is the longest and largest line from the past.\nIt would be beneficial to rebuild it in this place where railways are scarce."
#ABY_focus_rail_expend:0 "Expand Rail Lines"
#ABY_focus_rail_expend_desc:0 "The advanced transport capabilities of the Abydos Central Railway must be applied to other regions.\nWe must expand the lines to secure overwhelming logistical capacity."
#ABY_focus_war_support:0 "Commence Wartime Cooperation"
#ABY_focus_war_support_desc:0 "We must establish wartime corporate cooperation centered on the Neptis Group and Saint Neptis."
#ABY_focus_road_of_life:0 "Road of Life"
#ABY_focus_road_of_life_desc:0 "In war, the train is the rear guard of the battlefield, and the railway is the road of life.\nPeople, supplies, and everything else move by rail; even transport planes and ships cannot match the efficiency of the train."
#ABY_focus_kaiser_industry:0 "Confiscate Kaiser Facilities"
#ABY_focus_kaiser_industry_desc:0 "We have discovered Kaiser facilities near the autonomous district and decided to confiscate these inactive sites...\nHow will Kaiser react?"
#ABY_focus_mass_killing_weapon:0 "Weapon of Mass Destruction"
#ABY_focus_mass_killing_weapon_desc:0 "While searching Kaiser Corporation facilities, we discovered a new type of thermobaric munition.\nUsing this, we could create a powerful weapon, but...\nWhat should we do?"
#ABY_focus_weapon_of_new_world:0 "Weapon of the New Generation"
#ABY_focus_weapon_of_new_world_desc:0 "According to scientists' research, this weapon is expected to be an unprecedented armament with devastating destructive power.\nEven the most conservative estimates suggest it could wipe out an entire division; it will be truly immense."
#ABY_focus_nuclear_research:0 "Nuclear Research"
#ABY_focus_nuclear_research_desc:0 "We have begun nuclear research to deploy the weapon for combat.\nAs research continues, the reality of this weapon increases...\nAnd so does the fear..."
#ABY_focus_ultimate_weapon:0 "The Ultimate Weapon"
#ABY_focus_ultimate_weapon_desc:0 "A small-scale version of this weapon was test-detonated.\nThough it was only a fraction of the intended size, the rising mushroom cloud and flash covered the entire land.\n§RNow we are become Death, the destroyer of worlds.§!"
#ABY_focus_death_meteor:0 "Meteor Shower of Ruin"
#ABY_focus_death_meteor_desc:0 "Research into rocket weaponry has long existed in Kivotos, but the rockets here feel different.\nBased on the missiles we possess, we can hasten the development of rocket weaponry."
#ABY_focus_make_infra:0 "Laying the Foundation"
#ABY_focus_make_infra_desc:0 "Infrastructure is vital to industry.\nAnd to everything else as well."
#ABY_focus_make_infra_czech:0 "Expand Czech Infrastructure"
#ABY_focus_make_infra_czech_desc:0 "Much was destroyed in the Czech regions we recaptured.\nWe will lay the foundation first and rebuild what was broken upon it."
#ABY_focus_make_infra_slovakia:0 "Improve Slovak Infrastructure"
#ABY_focus_make_infra_slovakia_desc:0 "The underdeveloped infrastructure of Slovakia also requires improvement."
#ABY_focus_mining_industry:0 "Activate Mining Industry"
#ABY_focus_mining_industry_desc:0 "We must find a way to obtain the steel we lack."
#ABY_focus_short_industry_plan:0 "Short-term Industrial Plan"
#ABY_focus_short_industry_plan_desc:0 "We must find a way to respond to the great threats approaching us."
#ABY_focus_long_industry_plan:0 "Long-term Industrial Plan"
#ABY_focus_long_industry_plan_desc:0 "We must look toward the future, not just what is in front of us."
#ABY_focus_expand_mine:0 "Expand Existing Mines"
#ABY_focus_expand_mine_desc:0 "Creating new mines is very expensive.\nBy expanding existing mines, we can save funds."
#ABY_focus_more_mine:0 "Develop Additional Mines"
#ABY_focus_more_mine_desc:0 "Expanding mines that have already been depleted increases safety risks.\nWe can obtain more resources from new mines."
#ABY_focus_produce_industry:0 "Resource Development Industry"
#ABY_focus_produce_industry_desc:0 "We begin an extensive resource development industry according to our chosen method."
#ABY_focus_native_industry:0 "Local Industry"
#ABY_focus_native_industry_desc:0 "Through cooperation with the locals, we have become acquainted with local industry.\nFurthermore, we must find ways to utilize the ownerless industrial facilities we have secured."
#ABY_focus_with_czech_geeup:0 "Contact Czech Enterprises"
#ABY_focus_with_czech_geeup_desc:0 "Czech enterprises are currently being forced to operate their industrial facilities for Hyakkiyako.\nBy contacting them and appealing to their Czech national identity, we can recruit them with promises of post-war benefits."
#ABY_focus_no_geeup:0 "Confiscate Corporate Assets"
#ABY_focus_no_geeup_desc:0 "The entrepreneurs have betrayed Czechia and are cooperating with them.\nThere is no reason to grant them any favors."
#ABY_focus_skoda:0 "Skoda"
#ABY_focus_skoda_desc:0 "Skoda is a Czech heavy industry company active since the late 19th century.\nThe military equipment they produce boasts superior performance; since they are with us, we can receive their help."
#ABY_focus_czech_heavy_industry:0 "Czech Heavy Industry"
#ABY_focus_czech_heavy_industry_desc:0 "Czechia is famous for its advanced heavy industry.\nAs an industrial nation, Czechia preserves production know-how in its industrial history."
#ABY_focus_collaborate_geeup:0 "Seek Corporate Cooperation"
#ABY_focus_collaborate_geeup_desc:0 "The corporations have benefited from our patronage.\nAs a result, we will be able to elicit their cooperation."
#ABY_focus_support_native_geeup:0 "Accept Rothschild-Vitkovice"
#ABY_focus_support_native_geeup_desc:0 ""
#ABY_focus_new_geeup:0 "Appoint Saint Neptis"
#ABY_focus_new_geeup_desc:0 ""
#ABY_focus_nation_collaborate_industry:0 "State-Corporate Industrial Cooperation"
#ABY_focus_nation_collaborate_industry_desc:0 "The participation of corporations in state industrial research will serve as a foothold for national technological leadership."
#ABY_focus_more_war_industry:0 "Construct Resource Production Facilities"
#ABY_focus_more_war_industry_desc:0 ""
#ABY_focus_more_civil_industry:0 "Expand Vitkovice Ironworks"
#ABY_focus_more_civil_industry_desc:0 ""
#ABY_focus_war_industry:0 "Efficient Resource Production"
#ABY_focus_war_industry_desc:0 ""
#ABY_focus_rebuild_industry:0 "Construct Ostrava Ironworks"
#ABY_focus_rebuild_industry_desc:0 ""
#ABY_focus_free_industry_make:0 "Autonomous Industrial Development"
#ABY_focus_free_industry_make_desc:0 "The autonomous industrial development of corporations benefits the national economy."
#ABY_focus_geeup_research_collaborate:0 "Corporate Research Cooperation"
#ABY_focus_geeup_research_collaborate_desc:0 "Through partnerships with corporations, we have legislated the participation of corporate researchers in national technological development."
#ABY_focus_invest_civil_industry:0 "Expand Civilian Industry"
#ABY_focus_invest_civil_industry_desc:0 ""
#ABY_focus_invest_war_industry:0 "Expand Military Industry"
#ABY_focus_invest_war_industry_desc:0 ""
#ABY_focus_neptis_collaborate:0 "Construct Supply Network"
#ABY_focus_neptis_collaborate_desc:0 ""
#ABY_focus_more_nation_invest:0 "Road of Life"
#ABY_focus_more_nation_invest_desc:0 ""
#ABY_focus_civil_lead_industry:0 "Private-led Industry"
#ABY_focus_civil_lead_industry_desc:0 "Autonomous industrial development led by the private sector will improve industrial capacity."
#ABY_focus_nation_lead_industry:0 "State-led Industry"
#ABY_focus_nation_lead_industry_desc:0 "A planned state-led economy will aid in development."
###Military Focus
#ABY_focus_rebuild_army:0 "Rebuild Military Organization"
#ABY_focus_rebuild_army_desc:0 "We must equip ourselves with military capacity and strategy to prepare for future conflicts."
#ABY_focus_rebuild_air:0 "Rebuild Air Force"
#ABY_focus_rebuild_air_desc:0 "Most airfields and aircraft here were destroyed in the battles following the Great Transition.\nWe must rebuild this from the ground up."
#ABY_focus_second_front:0 "The Second Battlefield"
#ABY_focus_second_front_desc:0 "In modern warfare, aerial combat is as good as a second battlefield.\nTo lose in the sky is to lose on the ground."
#ABY_focus_air_artilery:0 "Artillery in the Sky"
#ABY_focus_air_artilery_desc:0 "In modern warfare, aircraft are the artillery of the sky.\nThey are far more accurate and powerful than ground-based artillery.\nIf artillery is the god of war, aircraft are the king of gods."
#ABY_focus_united_produce:0 "Integrated Design"
#ABY_focus_united_produce_desc:0 "Designing separate airframes for every aircraft is costly.\nHybrid designs will aid in production."
#ABY_focus_easy_produce:0 "Simplify Production Lines"
#ABY_focus_easy_produce_desc:0 "Aircraft are not much different from ground machinery or vehicles.\nThere are ways to drastically increase their production volume as well."
#ABY_focus_shutuka_fear:0 "Primal Fear"
#ABY_focus_shutuka_fear_desc:0 "Fear of the sky has existed since ancient times.\nSo, what of death descending from the sky?\nAttaching something like a siren might draw out that fear even more..."
#ABY_focus_more_weapon:0 "Expand Armaments"
#ABY_focus_more_weapon_desc:0 "Just like everywhere else, armaments play a huge role in aerial combat.\nBy improving and expanding our armaments, we can enhance our air force's aerial combat capabilities."
#ABY_focus_dog_fight:0 "Dogfight"
#ABY_focus_dog_fight_desc:0 "In dogfights between aircraft, the machine's armament is as important as the pilot's own skill."
#ABY_focus_great_firepower:0 "Overwhelming Firepower"
#ABY_focus_great_firepower_desc:0 "Manufacturing and operating aircraft incurs immense costs.\nTherefore, we must achieve maximum results with every sortie."
#ABY_focus_rebuild_navy:0 "Rebuild Navy"
#ABY_focus_rebuild_navy_desc:0 "As a landlocked country, we have almost no knowledge of navies.\nWe must begin training a navy now."
#ABY_focus_freguit_navy:0 "Coastal Defense Navy"
#ABY_focus_freguit_navy_desc:0 "A massive navy is nothing more than an unnecessary luxury for us.\nA navy that can protect us is sufficient."
#ABY_focus_great_sea_navy:0 "Blue-Water Navy"
#ABY_focus_great_sea_navy_desc:0 "We must project a massive navy externally so that others do not look down on us."
#ABY_focus_small_ship_produce:0 "Small Ship Construction"
#ABY_focus_small_ship_produce_desc:0 "Even small ships must exist in sufficient quantities."
#ABY_focus_convoy_plan:0 "Landing Craft Plan"
#ABY_focus_convoy_plan_desc:0 "Large-scale landings supported by the bombardment of our warships will have a great impact on isolated regions."
#ABY_focus_uboat_technology_plan:0 "U-Boat Technology Plan"
#ABY_focus_uboat_technology_plan_desc:0 "U-Boats, or submarines, are the start of a new definition for the navy.\nThey are sufficient to sink expensive ships at a low price."
#ABY_focus_navy_build_faster:0 "Accelerate Navy Construction"
#ABY_focus_navy_build_faster_desc:0 "We must allow our lagging navy to catch up quickly."
#ABY_focus_more_convoy_produce:0 "Expand Transport Capacity"
#ABY_focus_more_convoy_produce_desc:0 "We must fully expand maritime transport to ensure our soldiers abroad do not starve."
#ABY_focus_yamato:0 "Big Gun Fetishism"
#ABY_focus_yamato_desc:0 "Massive battleships and massive guns will dominate maritime combat."
#ABY_focus_battleship_dock:0 "Warship Shipyard"
#ABY_focus_battleship_dock_desc:0 "We must secure maritime superiority through extensive warship construction."
#ABY_focus_abydos_regular_army:0 "Rebuild Abydos Regular Army"
#ABY_focus_abydos_regular_army_desc:0 "The Abydos Regular Army, disbanded long ago, has been neglected for a while,\nbut now we have the capacity and need a unit that can face the Halo Infantry operated by other academies."
#ABY_focus_army_CD:0 "Abydos Military Manual"
#ABY_focus_army_CD_desc:0 "The Abydos military manual, developed in Old Abydos, is horrifyingly long,\nbut it contains countermeasures for every tactical situation.\nWith just a few modifications, it will be a very good manual to use on this battlefield."
#ABY_focus_more_abydos_army:0 "Expand Regular Army"
#ABY_focus_more_abydos_army_desc:0 "Large-scale Halo Infantry will help in seeking strategic superiority across all fronts."
#ABY_focus_more_abydos_platoon:0 "Expand Reserves"
#ABY_focus_more_abydos_platoon_desc:0 "Our Halo Infantry, being meager compared to other academies, faces issues in securing meaningful tactical superiority.\nWe must improve the composition to increase frontline breakthrough capability and organization."
#ABY_focus_kivotos_army_CD:0 "Integrate Kivotos Military Manuals"
#ABY_focus_kivotos_army_CD_desc:0 "The tactical manuals of other academies are not as extensive as ours,\nbut in certain situations, they offer better solutions.\nSecuring as many as possible will be a great help in improving our manual."
#ABY_focus_native_army_CD:0 "Integrate Local Military Manuals"
#ABY_focus_native_army_CD_desc:0 "Since there are slight differences in the physical abilities of the people here, the history they experienced, and the weapons they developed, it is difficult to use the military manual as is.\nConsulting local manuals will help in creating a better one."
#ABY_focus_research_equipment:0 "Commence Equipment Research"
#ABY_focus_research_equipment_desc:0 "No matter how the era changes, the infantry who directly occupy the land can never be replaced.\nAn increase in the combat capability of these infantry means an increase in the military capacity of the entire army."
#ABY_focus_unite_equipment:0 "Standardize Military Supplies"
#ABY_focus_unite_equipment_desc:0 "Standardization is the most important factor in military supply.\nFirst, we must unify equipment of different standards into a single standard."
#ABY_focus_doctrine_research:0 "Explore Doctrine"
#ABY_focus_doctrine_research_desc:0 "In war, doctrine is more important than direct military force.\nExcellent doctrine and command can overturn disadvantages."
#ABY_focus_attack_doctrine:0 "Offensive Doctrine"
#ABY_focus_attack_doctrine_desc:0 "Our army is significantly smaller in scale than other nations.\nWe must inflict massive damage on the enemy while reducing our own losses."
#ABY_focus_defense_doctrine:0 "Defensive Doctrine"
#ABY_focus_defense_doctrine_desc:0 "Our army is significantly smaller in scale than other nations.\nIt is important to fight defensive battles by making full use of our limited forces and the terrain."
#ABY_focus_speed_doctrine:0 "Rapid Strike"
#ABY_focus_speed_doctrine_desc:0 "Vehicles are not a replacement for horses.\nCavalry doctrine can never be applied to them.\n'Maneuver warfare' through mutual coordination with tanks is the future."
#ABY_focus_living_front:0 "Living Defense Line"
#ABY_focus_living_front_desc:0 "A static defense line is easy to break.\nHowever, a defense line that is fluid as if alive is very suitable for absorbing attacks and swallowing the enemy in return."
#ABY_focus_massive_produce:0 "Standardize Armored Parts"
#ABY_focus_massive_produce_desc:0 "The mechanization of the entire army will provide an overwhelming exchange ratio on all battlefields."
#ABY_focus_steel_wave:0 "Wave of Steel"
#ABY_focus_steel_wave_desc:0 "A wave of steel, lined up and flashing in the light, will sweep away everything in its path."
#ABY_focus_moving_fortress:0 "Mobile Fortress"
#ABY_focus_moving_fortress_desc:0 "Who on earth came up with such a crazy idea?\nHowever, at the very least, there seems to be no way to stop this mobile fortress anywhere."
#ABY_focus_more_front_free:0 "Expand Frontline Discretion"
#ABY_focus_more_front_free_desc:0 "By giving frontline generals high autonomy, they will be able to operate divisions flexibly."
#ABY_focus_united_attack:0 "Coordinated Strike"
#ABY_focus_united_attack_desc:0 "The most important thing in maneuver warfare is rapid communication between commanders.\nIn particular, coordinated strikes and frontline breakthroughs using this are paramount."
#ABY_focus_collaborate_front:0 "Inter-frontline Coordination"
#ABY_focus_collaborate_front_desc:0 "Maneuver warfare doctrine is now completely settled in our commanders' minds.\nTheir skill in handling troops and communication between commanders during battle has noticeably increased."
#ABY_focus_god_of_war:0 "God of War"
#ABY_focus_god_of_war_desc:0 "Artillery is the god of war.\nOur gods must be superior to the enemy's gods."
#ABY_focus_life_important:0 "Value of Life"
#ABY_focus_life_important_desc:0 "A single shell can take dozens of lives.\nAlso, a single shell is much cheaper than a single person."
#ABY_focus_stronger_artilery:0 "Improve Artillery"
#ABY_focus_stronger_artilery_desc:0 "Better artillery means more firepower.\nMore firepower means more victories."
#ABY_focus_collaborate_artilery:0 "Inter-battery Coordination"
#ABY_focus_collaborate_artilery_desc:0 "Coordination between batteries increases the effectiveness of striking priority targets and counter-battery fire."
#ABY_focus_clear_battlefield:0 "Flatten the Battlefield"
#ABY_focus_clear_battlefield_desc:0 "There are many dangerous elements for infantry on the battlefield.\nIf so, the batteries just need to remove all danger elements before they advance."
#ABY_focus_wjarkavhrur:0 "Creeping Barrage"
#ABY_focus_wjarkavhrur_desc:0 "We must secure tactical superiority of artillery forces through creeping barrages."
#ABY_focus_great_artilery_fire:0 "Massive Bombardment"
#ABY_focus_great_artilery_fire_desc:0 "More bombardment saves more soldiers' lives."
#ABY_focus_infantry_speed_up:0 "Secure Infantry Mobility"
#ABY_focus_infantry_speed_up_desc:0 "We need means to secure the infantry's lacking mobility."
#ABY_focus_prooved_one:0 "Proven Effect"
#ABY_focus_prooved_one_desc:0 "In the Great War, trenches and perfect strategy showed tremendous effects.\nIf we improve this doctrine, we might be able to create the results we need."
#ABY_focus_improve_doctrine:0 "Improve Doctrine"
#ABY_focus_improve_doctrine_desc:0 "Grand Strategy is a good doctrine, but it remains stuck in the era of the Great War.\nWe must improve it to fit modern warfare."
#ABY_focus_tactical_fortress:0 "Tactical Trenches"
#ABY_focus_tactical_fortress_desc:0 "Trenches look the same at a glance, but they show different development patterns depending on the nation and era.\nIntroducing Kivotos' tactical trenches will surely have a very large effect."
#ABY_focus_more_division_support:0 "Expand Division Support"
#ABY_focus_more_division_support_desc:0 "Support companies that improve a division's combat capability are very important.\nFor example, engineer companies to dig trenches, artillery support companies, and field hospitals."
#ABY_focus_search_battlefield:0 "Battlefield Observation"
#ABY_focus_search_battlefield_desc:0 "The core of Grand Strategy is first information, and second information.\nInformation warfare is everything in Grand Strategy."
#ABY_focus_improved_support:0 "Extensive Support"
#ABY_focus_improved_support_desc:0 "It is necessary to provide extensive support for the organic coordination of the army beyond just the division."
#ABY_focus_modern_infantry_equipment:0 "Modern Infantry Equipment"
#ABY_focus_modern_infantry_equipment_desc:0 "An increase in the firepower of individual infantrymen means an increase in the capacity of the entire army."
#ABY_focus_improved_fortress:0 "Improved Fortresses"
#ABY_focus_improved_fortress_desc:0 "Fortresses are very important facilities that can produce a high exchange ratio even in overwhelming inferiority.\nWe can introduce some of this into our trenches."
#ABY_focus_dbrlwjr_dusrP:0 "Organic Coordination"
#ABY_focus_dbrlwjr_dusrP_desc:0 "Organic coordination between corps brings overwhelming strategic superiority."
