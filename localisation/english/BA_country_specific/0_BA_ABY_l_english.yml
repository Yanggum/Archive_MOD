 #ABY_descision_focus_czecho_7_effect: "§Y북주데텐란트§!:\n    §G1§!개의 건설 슬롯 추가.\n    §G1§!개의 §Y민간공장§! 추가.\n§Y고립§! 무역법을 제거할 수 있습니다.\n다음 효과를 부여하는 산업 업체 사용 가능:\n§Y로스차일드 비코비체§!\n    산업 연구속도: §G+15.0%§!\n  §Y철강업체§!\n    §Y기반시설§! 건설속도: §G+5.0%§!\n    자원 획득 효율: §G+10.0%§!\n"
