 ABY_I_newfocus_109:0 "기술 대응책"
 ABY_I_newfocus_109_desc:0 "헤일로는 물리적인 충격에는 강하지만, 생화학과 같은 공격에는 매우 취약합니다.\n이에 대한 대응책을 마련하고 헤일로 보병의 방어력을 증강할 것입니다."
 ABY_I_newfocus_110:0 "신비 연구 I"
 ABY_I_newfocus_110_desc:0 "우리는 신비를 연구하여 우리의 헤일로 보병을 조금 더 강하게 만들 것입니다."
 ABY_I_newfocus_111:0 "신비 연구 II"
 ABY_I_newfocus_111_desc:0 "우리의 신비는 지속적인 연구를 통해 발전하고 있습니다.\n더더욱 신비를 탐구하여 헤일로 보병의 잠재력을 더욱 끌어올려야 합니다."
