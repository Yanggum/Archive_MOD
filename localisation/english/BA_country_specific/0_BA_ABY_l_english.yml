#ABY_idea_stopped_research:0 "Research Halted"
#ABY_idea_stopped_research_desc:0 "Right now we lack both the manpower and resources to devote to research."
#ABY_idea_stopped_industry:0 "Stalled Industry"
#ABY_idea_stopped_industry_desc:0 "We do not know the structure of the local industry."
#ABY_idea_people_threat:0 "Stranger Conflict"
#ABY_idea_people_threat_desc:0 "While it's true we had fewer armed conflicts compared to other academies, that does not mean they were non-existent.\nIt is too much for us to mediate every minor conflict among civilians."
#ABY_idea_nan_naboda_yakhan_sarami_myungryung_tawinen_detge_ana:0 "Paralysis of the Chain of Command"
#ABY_idea_nan_naboda_yakhan_sarami_myungryung_tawinen_detge_ana_desc:0 "We barely managed to defend this place by collaborating with the local defense forces and security personnel, but the existing Czechoslovak military is scattered everywhere, and there is no unified command structure. We must rally them and restore the chain of command."
#ABY_idea_ani_ne_gongsa_ga:0 "Collapse of Public Security"
#ABY_idea_ani_ne_gongsa_ga_desc:0 "Robberies and looting are rampant throughout the city streets. We must restore public security as soon as possible."
#ABY_idea_anarchy:0 "Anarchy"
#ABY_idea_anarchy_desc:0 "Abydos is lacking in all resources including manpower, the existing Czechoslovak government has collapsed, and the bureaucrats are all scattered, meaning there is currently nothing here that can be called a government. However, once the current negotiations are properly concluded, we will soon be able to regain control."
#ABY_idea_gwarosa:0 "Overworked Foreclosure Task Force"
#ABY_idea_gwarosa_desc:0 "Separate from the administration of the locals, the administration of the Abydos Autonomous District must be managed by Abydos High School, but all of that workload is adding burden to the Foreclosure Task Force, slowing down the speed of administrative processing.\n§YWe will be able to distribute the workload by expanding Abydos High School and establishing departments.§!"
 ABY_idea_katakata:0 "Katakata Helmet Gang"
 ABY_idea_katakata_desc:0 "We are not the only ones who have transferred here. The Katakata Helmet Gang, who used to torment us, is also here. Vigilante groups are being deployed on a large scale to suppress them, but factory raids and occupations are occurring frequently. We must decide what to do with them as soon as possible."
