 landmark_destroyed_ABY_homeschool: "Giant Sand Pile"
 landmark_destroyed_ABY_homeschool_desc: "A massive sand mountain rising 1km above sea level, appearing suddenly northwest of Győr following the Great Transfer. The Hungarian government attempted to remove it several times, but all failed due to an endless influx of sand. However, with the discovery of the mysterious mineral 'Blue Stone' and unidentified over-technology fragments within the sand, this dangerous mountain is now regarded as a mysterious treasure trove rather than a simple natural disaster. The secrets hidden within the mountain still sleep deep beneath the sands."
 landmark_ABY_homeschool: "Abydos Main Building"
 landmark_ABY_homeschool_desc: "The legendary 'Abydos High School Main Building,' revealing its majesty after clearing away the 1km sand mountain that once covered Győr. Perfectly reconstructed after long restoration work, this massive structure is the origin and spiritual pillar of the Abydos Federation, an overwhelming landmark that can be seen from anywhere in the city of Győr. It is a sacred sanctuary of the soul for the Abydos people who have regained their lost home, and a monumental structure symbolizing the indomitable will that overcame the desert for the citizens of the Federation."
 landmark_ABY_homeschool_nothing: "Győr Plains"
 landmark_ABY_homeschool_nothing_desc: "Wide plains stretching northwest of Győr.\nA massive industrial district is being constructed on the vast site where the sand mountain originally stood, and it will become the new heart of East Kivotos.\n...The §R-Censored-§! inside the sand mountain is being utilized as §R-Censored-§! §R-Censored-§! §R-Censored-§! material for the construction of the new city §R-Censored-§! §R-Censored-§!\n§R...The high-quality sand has aided in the mass production of silicon.§!"
 ABY_build_homeschool_landmark_tt: "Replaces §Y$landmark_destroyed_ABY_homeschool$§! with §Y$landmark_ABY_homeschool$§!."
#Abydos Opening#
 ABY_country_intro_header: "§YSapphire That Lost Its Light§!"
 ABY_country_intro_header_1: "§YSwimsuit Masked Gang§!"
 ABY_country_intro_header_2: "§YCzechoslovakia§!"
 ABY_country_intro_header_3: "§YMy Homeland Sudetenland§!"
 ABY_country_intro_header_4: "§YGordian Knot§!"
 ABY_country_intro_header_5: "§YState of Two Worlds§!"
 ABY_country_intro_content: "What can we compare Abydos High School to? \nPerhaps a sapphire that no longer shines would be appropriate. In the past, when 70 student council presidents were rampant and fighting a civil war in Abydos, the reign of Student Council President Shemata—who maintained order, unified Abydos, and further brought all of Kivotos to its feet in fear—is now but a legend. Everything he achieved in Abydos has vanished, covered beneath the sand. \n\nIn this desperate situation, the Great Transfer has further exacerbated the chaos. \n\nOn November 1, 1935, Abydos High School, transferred to Horn north of the Danube in Austria, cooperated with Austrians and Czechs to avoid armed conflict and worked toward regional stability. However, a few days later, Shanhaijing, which had pacified Austria, felt this as a threat and invaded Abydos, followed by Hyakkiyako joining the attack. \nDuring a fierce battle at the main building, Serika went out to secure supplies and was detained by Sukebans; the remaining four abandoned the main building and left Linz to save their comrade."
 ABY_country_intro_content_1: "The Abydos students wore masks to hide their identities and raided the Sukeban base in Znojmo. However, the documents found there revealed that Hyakkiyako had already suppressed the Sukebans and transferred the detained prisoners elsewhere. \nDue to Nonomi's slip of the tongue—whether accidental or intentional—they gained the nickname 'Swimsuit Masked Gang.' Yet, unlike that humorous name, their combat power was overwhelming. \nThe four of them defeated the Hyakkiyako forces one after another, searching the entire city with elusive movements. They raided Brno and Tábor in succession to track Serika's whereabouts, eventually securing a clue that she had been transferred to Hyakkiyako (Prague). \nThe four from Abydos headed to Prague without delay, a journey that led to an event becoming the seed of the Coalition Provisional Government."
 ABY_country_intro_content_2: "Upon entering Prague, the Abydos students meticulously dismantled the defense lines and rescued Serika, discovering Czechoslovak government officials detained in the process. \nAbydos, forming an alliance with them, established the Czech-Abydos Provisional Government. With the help of Edvard Beneš—who had learned the Kivotos language by interacting with guards even during his imprisonment and located isolated Czech forces—they escaped Prague and increased their strength by rescuing isolated Czech units in Kladno, Mělník, and Jičín. \nAlthough they could only pray for the souls of the soldiers in the units already wiped out in Mladá Boleslav, there was no more time to delay. \nThe provisional government advanced north and contacted the Nephthys Group, which had transferred to Liberec, establishing an alliance to secure military and financial support.\nAdditionally, Asagiri Suou, a capable commander from the Nephthys Group, joined them, proving to be a great help in future battles."
 ABY_country_intro_content_3: "The provisional government moved west and contacted the Sudeten German Party militia, which was under pressure from Hyakkiyako. \nThey were defending their homeland under the command of Konrad Henlein and Karl Hermann Frank, and they entered into an alliance after accepting the proposal from the Abydos and Czech leadership. The Provisional Coalition Government, combining the three forces, reorganized the Sudetenland defense line and soon launched a general offensive toward the strategic northern stronghold of Egerland. \nAfter a fierce battle, they recaptured Egerland and solidified the defense line, halting Hyakkiyako's northern advance. At this point, the coalition government effectively became a group in the same boat, and the interests of each faction finally began to fit into a single framework."
 ABY_country_intro_content_4: "In Karlovy Vary, the largest city in northern Sudetenland, the Coalition Provisional Government began building its foundation in earnest. \nThe Allied forces successfully repelled a massive Hyakkiyako offensive aimed at breaking through the defense line, and this victory led to the start of Christmas Truce negotiations on December 25. \nPoliticians, generals, and representatives from Kivotos gathered to continue negotiations, and on December 31, a truce agreement was finally signed.\n\nAbydos Provisional Government. This allied nation, combining Kivotos, Czech, and German elements, still stands strong. But can this strange alliance persist once their respective goals are achieved? Will they be able to resolve the complex issues of ideology and ethnicity intertwined among them? Only time will tell.\n\nWill the method to untie the Gordian Knot be revealed? Or, like the old story, will it eventually be cut?"
 ABY_country_intro_content_5: "The three factions of the State of Two Worlds signed an agreement to cooperate in liberating Czechia, Sudetenland, and Linz. \nSeeing this, outsiders refer to Abydos as the 'State of Two Worlds,' with a mix of respect and contempt. \nWill the 'State of Two Worlds'—diverse in its name's meaning, its constituent peoples, and even its ideologies—be able to maintain that name until the end? \nThe flames of war have subsided for a moment, but the embers still burn across all of Europe. \n\nThe future is still hidden in the mist, and whether their alliance can endure until the end is an answer that will only be revealed in the distant future.\n\n\n§CDevelopment- Koi, Mako, .spear_, mintcoon§!\n§YSpecial Thanks- Director, Pencildude, Imika, Fraise§!"
 ABY_guide: "§YObjectives§!\n\n£white_dot §4Establish the Coalition Provisional Government and plan operations to reclaim Bohemia, Sudetenland, and Linz.§!\n£white_dot §4With Sensei's help, enable the Abydos students to overcome their weaknesses and traumas.§!\n£white_dot §4Receive the welcome of the Austrians and accommodate their demands.§!\n£white_dot §4Reclaim Austria and establish a Federal Government.§!\n\n    £white_dot §CThwart the Enlightenment Council's conspiracy and establish a stable democratic government to rebuild Masaryk's legacy.§!\n        £white_dot §YFind a way for the two worlds to coexist.§!\n            £white_dot §gRebuild Czechoslovakia and the Little Entente.§!\n            £white_dot §gDefend the fatherland against enemy invasions and establish a democratic government there.§!\n            £white_dot §gPropose a path for a newly united Europe.§!\n        OR...\n        £white_dot §YFind a way for the two worlds to become one.§!\n            £white_dot §gEstablish a Federal Republic and renounce Abydos hegemony for the greater cause.§!\n            £white_dot §gDefend the fatherland against enemy invasions and establish another Republic of Two Worlds there.§!\n            £white_dot §gConvene a conference for Euro-Kivotos unification and keep moving forward.§!\n\n    £white_dot §tSeek ways to defend the Federation from a coup.§!\n        £white_dot §YNegotiate with them to ensure the safety of the Foreclosure Task Force.§!\n            £white_dot §gTake to the streets with flowers and songs to reclaim lost freedom.§!\n            £white_dot §gDo not back down in front of gun barrels. Appeal to the soldiers.§!\n            £white_dot §gUse every means for freedom except for violence.§!\n        OR...\n        £white_dot §YRefuse negotiations with the coup forces.§!\n            £white_dot §gGo underground to escape the Military Command's suppression of political organizations.§!\n            £white_dot §gUnite political parties centered around the Federal Union Party to create a Popular Front.§!\n            £white_dot §gUprise with Soviet support to defeat the fascist regime.§!\n                £white_dot §gPoint your blades toward Kivotos as the vanguard of the Soviet Union.§!\n                £white_dot §gPurge and suppress the opposition to establish a one-man dictatorship.§!\n                £white_dot §gSuppress the massive protests occurring in Prague.§!\n            OR...\n            £white_dot §gUprise with our own strength to restore the democracy given to us.§!\n                £white_dot §gHold the Popular Front together and build solidarity.§!\n                £white_dot §gIssue a condemnation statement against extremism and block the invasion of the two worlds.§!\n                £white_dot §gLay the foundation for social democracy and move toward reform.§!\n\n    £white_dot §0Overthrow the Federal Government with a coup and annihilate the opposition.§!\n        £white_dot §YFor the revenge of your seniors, throw everything away and move forward.§!\n        OR...\n        £white_dot §YTo destroy everything about Abydos, put on an act for the world.§!\n            £white_dot §gTitle yourself as the Leader and Savior, and centralize all authority.§!\n            £white_dot §gPurge the locals to reduce them below the Kivotos population and secure living space.§!\n            £white_dot §gSmash all old Kivotos culture and replace it with Enlightenment culture.§!\n            £white_dot §gUltimately, destroy East Asia and the Americas to make this planet the new home for Kivotos people.§!\n            £white_dot §R...And remember what you originally intended to do.§!\n\n§YHow to Enter Paths§!\n\n12 worldview events appear until Operation Falling Flower, and the Federal worldview is formed through choices in those events.\n\nInclusionism <-> Pluralism\nEgalitarianism <-> Authoritarianism\nIndividualism <-> Collectivism\nNationalism\n\nIt is divided into 3 sets of opposing worldviews and 1 independent worldview.\nFor opposing worldviews, the stronger one is considered selected. The Nationalism worldview ignores others if it is Fanatical, and is ignored for route determination if it is not Fanatical.\nSubsequent political focuses are determined by the Federal worldview held upon completion of the "Longest Night of the Federation" focus.\n\nLocals - Inclusionism, Egalitarianism, Collectivism\nAyane - Pluralism, Authoritarianism, Collectivism\nHoshino - Pluralism, Egalitarianism, Collectivism\nSerika (South Kivotos) - Inclusionism, Egalitarianism, Individualism\nSerika (Abydos) - Inclusionism, Authoritarianism, Collectivism\nShiroko (Democracy) - Pluralism, Egalitarianism, Individualism\nShiroko (Dictatorship) - Pluralism, Authoritarianism, Individualism\nNonomi - Inclusionism, Authoritarianism, Individualism\nSuou - Nationalism\n\n\n§CDevelopment- Koi, Mako, .spear_, mintcoon§!\n§YSpecial Thanks- Director, Pencildude, Imika, Fraise§!"
 ABY_GATHERING_STORM_DESC:0 "Abydos High School was once the largest and wealthiest academy in Kivotos, but severe desertification and ever-increasing debt led to the academy's downfall. The five remaining students in Abydos were struggling to protect it.\n\nAfter the Great Transfer, the situation shifted into a new phase. The debt that shackled them vanished, and the small autonomous district conversely became a great help in suppressing conflicts between residents and locals, allowing for the cooperation of the locals.\nHowever, conflicts among the locals here are becoming a problem instead. Solving this issue will be their top priority."
