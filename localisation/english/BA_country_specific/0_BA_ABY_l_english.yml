 ABY_descision_focus_event.64.t:0 "The Blade in the Shadows"
 ABY_descision_focus_event.64.d:0 "The night in Karlovy Vary was deep, and the curtains of the meeting room in Ayane's temporary residence were firmly closed to block external eyes. On the desk, a recorder with reel tape spinning and several blurry black-and-white photos were scattered messily. Before Ayane sat Serika with a tensed expression, Shiroko with a firm face, and Hoshino and Nonomi who had cleared their usual languor.\n\n"What you just heard are wiretapping records obtained from 'Vigilant,' the internal military information network."\n\nAyane's voice was calm, but its end was heavily sunken. The photos showed Major General Asagiri Suou having secret talks with men in military uniforms and greedy-faced Nephthys directors.\n\n"Major General Suou... She really?" Serika asked as if she couldn't believe it.\n\n"It's certain." Shiroko replied shortly, picking up a photo. "The status of troop movement is strange. Under the pretext of training, the 3rd Armored Division has been redeployed to strategic strongholds on the outskirts of the capital. It's an obvious attack formation."\n\nHoshino muttered low while her arms were crossed. "She must be trying to take advantage of the political instability after Beneš stepped down. She gathered forces dissatisfied with 'outsiders' like us seizing power. With Nephthys' financial power, the Nazi remnants' military force, and her command authority..."\n\n"It's not just simple dissatisfaction." Ayane said firmly. "This is an obvious conspiracy for a national subversion. Major General Suou plans to occupy the parliament and the residence at dawn tomorrow under the name 'Determination of National Salvation.' We must strike first. This is not a political fight, but a matter of survival."\n\nAyane's gaze was no longer that of a student. It was the resolve of a leader responsible for a nation."
 ABY_descision_focus_event.64.a:0 "Suou will act. Prepare yourselves thoroughly."
 ABY_descision_focus_event.64.b:0 ""

 ABY_descision_focus_event.65.t:0 "Parallel Lines that Do Not Reach"
 ABY_descision_focus_event.65.d:0 "The interrogation room in the basement bunker of the Capital Defense Command. Under the pale light of fluorescent lamps, Asagiri Suou sat handcuffed. Her military uniform was disheveled during the suppression process and her rank insignia was torn off, but her attitude was as arrogant as if she were a victor.\n\nAs Ayane and the Task Force members entered from beyond the glass, Suou scanned them with a twisted smile.\n\n"Congratulations, Chairman. No, is it Madam Prime Minister now? Not bad for your child's-play information power."\n\n"I wanted to ask you, Ms. Suou." Ayane asked coldly. "Why? We've protected this country together. But why did you turn your muzzles toward your comrades?"\nSuou snorted. Deep contempt was contained in that laugh.\n\n"Comrades? Ha... don't delude yourselves. Your lukewarm and weak attitude is sickening this country. What did you do with the power you seized after driving out Beneš? Harmony? Coexistence? Such flower-field idealism cannot stop the massive coming war! I tried to make this country as solid as steel. Even if blood is seen, a strong nation that can survive!"\nShe glared at Ayane with a cold gaze.\n\n"But... what use is it to say such things to you. You'll never understand. Because you're stupid greenhorns who don't know what war is or what a nation is."\nShe closed her eyes, leaning her body against the backrest as if there was no more value in talking. It wasn't the resignation of a loser. it was a terrible disregard for uncivilized beings who couldn't communicate.\n\nAyane bit her lip and turned away."
 ABY_descision_focus_event.65.a:0 ""Asagiri Suou. I am referring you to a military trial on charges of conspiracy to insurrection and treason.""

 ABY_descision_focus_event.66.t:0 "The Crocodiles' Banquet"
 ABY_descision_focus_event.66.d:0 "A luxury mansion on the outskirts of Prague. Under the bright light of a chandelier, hardline directors of the Nephthys Group and Asagiri Suou sat across from each other. The air was thick with cigar smoke, a strange tension, and greed.\n\n"The funds are ready, Major General. Our Nephthys has high expectations for this 'operation.'"\n\nA morbidly fat director said with an oily smile.\n\n"During that time, under the name of Abydos, our Nephthys was too shrunk. Ms. Nonomi's way was... too naive. A corporation must pursue profit and power. If this succeeds, the monopoly on government projects and military supply delivery rights... you will surely guarantee them, right?"\n\nSuou gazed at them while slowly swirling her wine glass. Contempt for them was contained in her eyes, but a leisurely smile hung on her lips.\n\n"Of course. In national reconstruction, the strength of ambitious people like you is essential. What I want is a strong nation, and doesn't a strong nation come from money."\n\n"Oh, as expected the General is someone who speaks sense!"\n\nThe directors burst into laughter, satisfied, and exchanged glances. In their eyes, the calculation to hold power by setting Suou up as a puppet was flashing.\n\nSuou also swallowed a sip of wine and laughed inwardly.\n\n'Stupid old men. If the operation succeeds, I'll cut open your greedy bellies and fill the national treasury.'\n\nThe clear sound of glasses clashing resonated. Carrying plans to use and destroy each other,"
 ABY_descision_focus_event.66.a:0 "The crocodiles enjoyed the banquet with laughter."

 ABY_descision_focus_event.67.t:0 "The Temptation of Steel"
 ABY_descision_focus_event.67.d:0 "The temporary capital Prague was burning. Suou's coup forces advanced with the force of a breaking wave, but they were blocked by the desperate resistance of the Capital Defense Command commanded by Shiroko and couldn't cross the Vltava River. It was the third day since a tense standoff continued with just one bridge between them.\n\nA negotiation team from the coup side came to Shiroko's command post with a white flag. An officer neatly dressed in uniform saluted politely before Shiroko.\n\n"Commander Sunaookami. No more meaningless bloodshed is a national loss. General Suou highly evaluates the Commander's ability."\n\nShiroko took her eyes off the map she was looking at with a dirt-covered face and glared at him. "There is no surrender."\n\n"Please listen. This is the final offer." The officer took an envelope from his pocket and placed it on the table. "If you stop resisting and surrender now, we will only take your person into custody. We perfectly guarantee the safety of the rest of the Task Force members, including Prime Minister Ayane."\n\nShiroko's eyebrows twitched.\n\n"They don't even need to go into exile. Under the new government, they will live freely as just ordinary citizens. Going to school, working, enjoying a normal daily life... Isn't that the life they really wanted?"\n\nThe officer's words dug into Shiroko's weakest part.\n\n"But if you continue to resist... heavy artillery will be mobilized in the next offensive. At that time, not only you but also the friends you were trying to protect will become ashes."\n\nOnly a heavy silence hung in the command post. Shiroko tightly gripped the butt of her rifle with trembling hands.\n\nIf I alone bend, everyone becomes safe. No more blood needs to be spilled. But is that truly the right path? Can I trust Suou?\n\nShiroko's gaze headed toward the burning Prague outside the window and her aides who had fallen asleep exhausted. Her lips moved, but the command just wouldn't come out."
 ABY_descision_focus_event.67.a:0 "Yeah, you've already betrayed my trust."
 ABY_descision_focus_event.67.b:0 "...That condition, you must keep it."

 ABY_descision_focus_event.68.t:0 "Winner's Dilemma"
 ABY_descision_focus_event.68.d:0 "The balcony of Prague Castle. Suou looked down. Her flag was fluttering in the street, and citizens were silent before the muzzles. The coup was successful. Ayane's government collapsed, and the military fell into her hands.\n\n"Excellency." An aide approached and asked cautiously. "Congratulations. Now please give the next command. The meeting schedule with the Task Force members currently under house arrest... and the Nephthys directors demanding shares is set."\n\nSuou took out a cigarette and bit it instead of answering. Smoke scattered into the air. Cold calculations dominated her head rather than the joy of victory.\n\n'Whom is it efficient to strike first.'\n\nShe fell into thought, narrowing her eyes.\n\nFirst option, the Foreclosure Task Force. They are the symbol of Abydos. If left alive, they can become a focal point and attempt a counterattack at any time. But what if they are executed? The citizens' anger will explode, and Kivotos-affiliated residents will rise up as rioters.\n\nSecond option, the Nephthys board and Nazi remnants. They are greedy hyenas. Since they won now, they will try to meddle in state affairs and take interests. If she purges them under the name "Liquidation of corrupt corporations and foreign powers," she can gain the enthusiastic support of the masses. But if their funds and military force disappear right now, can she maintain this unstable regime?\n\nSuou tapped the railing, tok, tok.\n\nThe ideal revolution ended, and now the blood-smelling reality of politics was waiting for her. She held the sword hilt, but she hadn't yet decided where to point that blade tip first."
 ABY_descision_focus_event.68.a:0 "The Foreclosure Task Force is dangerous"
 ABY_descision_focus_event.68.b:0 "There is a more urgent problem than them"

 ABY_descision_focus_event.69.t:0 "Survivor"
 ABY_descision_focus_event.69.d:0 ""
 ABY_descision_focus_event.69.a:0 "I will surely have my revenge..."

