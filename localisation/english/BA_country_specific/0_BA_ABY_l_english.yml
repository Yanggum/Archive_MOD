 ABY_czech_head_1_trait: "§Y보헤미아의 아버지§!\n	안정도: §G+30.00%§!\n	정치력 획득: §G+15%§!\n	매일 민주주의 지지도: §G+0.10§!\n\n토마시 가리크 마사리크는 1850년 3월 7일 모라비아의 홀도닌에서 태어났다. 청년기에 접어든 그는 철학자이자 사회 개혁가로서 오스트로슬라브주의에 입각한 체코 민족주의 운동에 선도적인 역할을 하였다. 오스트리아-헝가리 제국 내 체코 민족의 자치를 위하여 헌신하였으나, 1차 세계대전 중 국제 정세를 반영하여 체코슬로바키아의 독립 노선으로 전환하였고, 1918년 10월 28일 독립 선언에 이바지한 바, 같은 해 11월 14일 초대 대통령으로 취임하여 국가 건설과 민주주의 확립에 결정적인 역할을 하고 1935년 대통령직을 사임하였다. 하지만 대전이와 함께 그는 다시 체코 임시정부의 지도자가 되었고, 다시금 체코의 해방을 위해 노구를 이끌고 노력하고 있다."
 ABY_czech_head_2_trait: "§Y저항운동가§!\n	징병 가능 인구 변동치: §G+15%§!\n	전쟁 지지도: §G+10.00%§!\n\n에드바르트 베네시는 1884년 5월 28일 오스트리아-헝가리 제국 보헤미아 지역에서 태어났다. 그는 토마시 마사리크의 제자로서 체코 민족 해방운동에 매진하였다. 그는 외교와 내정 분야에서 두각을 나타내며 여러 정부 요직을 역임한 후, 국제 외교 무대에서 체코슬로바키아의 위상을 높이는 데 힘쓰다가 1935년에 제2대 대통령으로 취임하였다. 대전이로 인해 체코슬로바키아가 붕괴되고 체코 임시정부가 설립되고 1937년 마사리크의 대통령직 사임 이후 새로이 체코인들의 지도자가 된 베네시는 마사리크의 후계자로써 체코 해방에 매진하고 있다."
 ABY_german_head_1_trait: "§Y민주주의의 조율자§!\n	매주 안정도: §G+0.50%§!\n	매일 파시즘 지지도: §R-0.10§!\n	매일 민주주의 지지도: §G+0.10§!\n\n루트비히 체흐는 1870년 2월 14일 리볼에서 태어났다. 독일어를 사용하는 유대인 출신의 변호사이자 정치인으로서 오스트리아-헝가리 말기의 사회민주주의 전통을 계승하여 체코슬로바키아 건국 이후 1929년부터 사회 복지 분야의 장관으로 활동하였으며, 이후 공공 사업 부문에서도 중책을 맡아 독일계 체코슬로바키아인의 권익 신장을 위하여 헌신하였다. 다만 대전이 이후 체코슬로바키아 정부 내 독일계 최고위직이었던 그는 주데텐란트 독일계 시민들의 대변자가 되었다. 하지만 대전이 과정에서 흉탄에 맞은 여파로 그의 건강은 날로 안좋아지고 있다."
 ABY_german_head_2_trait: "§Y주데텐 민족주의자§!\n	안정도: §G+15.00%§!\n	정치력 획득: §R-10%§!\n	징병 가능 인구: §Y-0.50%§!\n	매일 비동맹주의 지지도: §R-0.10§!\n\n콘라트 헨라인은 1898년 5월 24일 오스트리아-헝가리 제국 내 독일계 거주 지역에서 태어났다. 그는 젊은 몸으로 체코슬로바키아 내 독일계 자치 운동의 선두주자로 부상하였다. 1930년대 초, 주데텐 독일인당의 당수로서 당의 조직력과 단결을 강화하기 위하여 적극적으로 활동하였으며, 주데텐란트 시민의 정치적 자각을 고취하는 데 중심적인 역할을 하였다. 대전이 이후 졸지에 주데텐 독일인들 대다수의 지지를 받는 그는 연립정부 내에서 마사리크 다음으로 정치적 영향력이 큰 사람이 되었다. 체흐의 사망 이후, 그는 공식적으로 독일계 대표로 올라섰으나 그는 이 상황에 큰 부담을 느끼고 있다."
 ABY_abydos_head_trait: "§Y아비도스의 방패§!\n	전쟁 지지도: §G+10.00%§!\n	핵심 영토에서 사단 공격: §G+10.0%§!\n	방어전쟁 불이익의 안정도 변동치: §G+20.00%§!\n\n아비도스 고등학교의 유일한 3학년 이자 대책위원회의 정신적 지주인 타카나씨 호시노는 얼핏 보면 그저 잠을 좋아하는 귀여운 게으름 뱅이로 보입니다. 그녀의 느긋한 행동을 보고 있자면 선배의 위엄보다는 귀여운 후배로서의 느낌이 더 강합니다. 하지만 그녀가 사랑에 맞지 않는 아비도스 고등학교와 후배들에게 위함에 처하면 그녀는 전에 귀엽고 나긋한 모습은 어디 갔냐는 듯 강인하고 강직한. 강한 모습을 보일 것입니다. 다소 감정에 휘둘리는 경향이 있지만 그녀의 뛰어난 전투력은 그 무모함도 무마하고 가로막는 모든 것을 부수고 나아갈 그런 강인해 보이는 그녀도 가끔은 어벙하고 이상한 모습을 보일 때가 있습니다. 후배들이 이에 대해 물어보더라도 그녀는 대답을 회피하고 맙니다. 그녀가 마음에 담아두고 있는 말 못할 사연은 무엇일까요?"

