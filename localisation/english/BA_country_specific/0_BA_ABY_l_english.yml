 ABY_election_event.1.t: "[GetYear] [ABY.GetName] Election"
 ABY_election_event.1.d: "In front of the electronic display in the square broadcasting the results of the 2nd Federal Presidential Election, hundreds of thousands of citizens held their breath as they watched the results. But there was no tension. They had only come to confirm an ending everyone already knew.\n\n[Final Vote Count Results]\nFederal Democratic Republican Party (Sunaookami Shiroko): 87.4%\nAbydos Socialist Union (Takanashi Hoshino): 9.2%\nOther Minor Parties: 3.4%\n\nIt was overwhelming. Public sentiment was completely leaning toward the 'Hero,' to the point where one couldn't even raise suspicions of election fraud. Shiroko's simple and clear pledge, "Bread to the hungry, guns to the threatened," crushed complex political logic.\n\nThe Socialist Union led by Hoshino fought well, gaining the support of workers and some intellectuals, but it was not enough to overturn the current of the era that desired a 'Strong Abydos.' In her concession statement, Hoshino warned that "unchecked power inevitably corrupts," but that voice was drowned out by the fanfare of victory.\n\nIn her victory acceptance speech, Shiroko declared, "I will uphold the command of the people and create an unshakable, steel-like Federation." The citizens cheered, but those cheers were not the victory of democracy, but the prelude to the perpetuation of Shiroko's one-man rule. The wolf had now stepped on the ballot boxes and perfectly settled onto the Golden Throne."
 ABY_election_event.1.a: "Eternal President, Her Excellency Shiroko!"

 ABY_election_event.2.t: "[GetYear] [ABY.GetName] Election"
 ABY_election_event.2.d: "The Federation's 2nd Presidential Election had a more heated primary than the main election. With the opposition party's approval ratings stagnating, the structure meant that the winner of the National Social Liberal Party primary would effectively become the next president.\n\nIn the party primary, Shiroko cried out for 'stable national administration,' while the challengers, the young reformist candidates, called for 'new changes.' After fierce debates and voting, the party members and citizens once again raised the hand of the 'Wolf.' The dedication she showed and the symbolism of the Velvet Revolution were still valid.\n\nThe main election was as bland as expected. Shiroko succeeded in her reelection with over 70% of the vote. However, the face she wore while giving her victory speech showed the composure of a seasoned politician and the corresponding fatigue, rather than the bewilderment of her first election. The citizens still loved her, but the burden placed on her shoulders had become much heavier than in the past."
 ABY_election_event.2.a: "The beginning of another 7 years."

 SOV_bcerossiya:0 "All-Russian Provisional Committee"

 ABY_news_event.1.t: "Abydos Provisional Government Breaks Truce"
 ABY_news_event.1.d: "Today, the Abydos Provisional Government army broke the truce with Hyakkiyako and launched an invasion.\n\nIt is an area where armed conflicts frequently occurred, but with Germans rising up in the Sudeten-Silesia region alongside the invasion, foreign press are viewing it as a planned invasion.\n\nHowever, regarding this, the local nations and the nations of Kivotos have dismissed it as a last-ditch effort and are not showing much interest."
 ABY_news_event.1.a: "Let's go! For liberation!"
 ABY_news_event.1.b: "They say a cornered rat will bite a cat."

 ABY_news_event.2.t: "Clash between Shanhaijing and Abydos"
 ABY_news_event.2.d: "Shanhaijing ignored the Abydos ultimatum to return their core regions that were illegally plundered, and the two nations have entered a state of war.\n\nDefying everyone's expectations, the actions of the Abydos Provisional Government, which won against Hyakkiyako, are drawing significant vigilance from the nations of Kivotos as the second war breaks out while many countries are watching. Meanwhile, some of the local nations are issuing statements of support, making various opinions act in a complex manner this time."
 ABY_news_event.2.a: "Victory is near."
 ABY_news_event.2.b: "Will they be given another stroke of luck?"

 ABY_news_event.3.t: "Establishment of the Austrian Provisional Democratic Government"
 ABY_news_event.3.d: "An astonishing event has occurred.\nWhen the Abydos Provisional Government army advanced into Linz, the citizens of Linz welcomed them as liberators, throwing flower petals and cheering them on.\nIn response, Commander-in-Chief Asagiri Suou declared in an interview that she would follow the government's decision.\n\nMeanwhile, the Provisional Government met with a delegation represented by the Social Democratic Party of Austria, and just announced the establishment of the Austrian Provisional Democratic Government and the Austrian liberation plan.\nShanhaijing is criticizing this as a despicable trick and revealing their expansionist ambitions, but there does not seem to be a major response."
 ABY_news_event.3.a: "Towards the liberation of Austria."
 ABY_news_event.3.b: "A nation of two worlds... just what are they?"

 ABY_news_event.4.t: "Formation of the Abydos Federal Government"
 ABY_news_event.4.d: "Okusora Ayane, Provisional Federal President, announced today the formation of the Abydos-Czechia-Austria Federal Government. Inheriting the Provisional Government Constitution, she stated that they will enact a provisional federal constitution including details such as full autonomy for the Sudetenland, and announce constitutional amendments as soon as possible to lay the foundation of the nation and hold a general election.\n\nMeanwhile, she declined to comment on the incident a few days ago where some divisions within the provisional government moved north/south to the new capital, and the Nephthys board of directors was brought to trial, stating it was an internal matter.\nSome experts are concerned about political instability, citing similarities with the process of a military coup, while others are divided on their opinions, saying that they actually succeeded in preventing a coup."
 ABY_news_event.4.a: "Masaryk, our father, are you watching?"
 ABY_news_event.4.b: "The birth of a new democratic nation."

 ABY_news_event.5.t: "Abydos Military Coup"
 ABY_news_event.5.d: "Asagiri Suou, the national hero and commander of the Austrian Front Army of the Abydos Provisional Government, has overturned her previous declaration of loyalty and staged a military coup.\n\nFollowing the coup, government buildings and embassies have been closed down, so little is known, and the movement of journalists is also restricted with checkpoints in operation.\n\nGeneral Asagiri Suou, who took office as the Chairman of the National Enlightenment Committee, announced that she made this decision to save the nation after confirming the abominable provisional government's ugly conspiracy, but avoided commenting on the details, saying they would be revealed later.\n\nFurthermore, the whereabouts of key political figures of the provisional government remain unknown, sparking controversy over whether they are dead or alive."
 ABY_news_event.5.a: "Is our democracy collapsing like this?"
 ABY_news_event.5.b: "Another nation descends into extremism."

 ABY_news_event.6.t: "[ABY.GetName] Introduces Civil Union System"
 ABY_news_event.6.d: "The Abydos Provisional Government officially announced that it has passed a bill legally recognizing the 'Civil Union' system between Europeans and Kivotosians for the first time since the Transference.\n\nThis decision is expected to be an important milestone for the residents of the two worlds to form a practically single community. A spokesperson for the provisional government stated, "This system is a measure to respect the unions of all residents regardless of their origins and backgrounds, and to protect their rightful legal rights," adding, "This is the first step in realizing the values of harmony pursued by our community."\n\nWhile there are still voices of concern from some corners of society regarding cultural differences, the majority of citizens welcome the atmosphere, calling it a progressive decision befitting the name 'Nation of Two Worlds'."
 ABY_news_event.6.a: "Wait! Disperse! Disperse!!"
 ABY_news_event.6.b: "Interspecies marriage and same-sex marriage? Good heavens!"

 ABY_news_event.7.t: "[ABY.GetName] Adopts 'Esperanto'"
 ABY_news_event.7.d: "The Abydos Provisional Government, which had been struggling with language conflict issues, announced that it would adopt the neutral international language 'Esperanto' as its official common language.\n\nThis is an unconventional decision aimed at resolving administrative inefficiencies and ethnic conflicts caused by the mixed use of Czech, German, and the Kivotosian language. The government explained the background of the adoption, stating, "The introduction of Esperanto, which does not lean towards any specific ethnicity, will provide a fair foundation for communication for all members."\n\nAccording to the government's announcement, all official documents will be written in Esperanto in the future, and it will be organized as a regular subject in schools at all levels. Attention is focused on whether this decision will open a new path of harmony for the provisional government, which faced the crisis of the 'Tower of Babel'."
 ABY_news_event.7.a: "Espero (Hope)."
 ABY_news_event.7.b: "So what?"

 ABY_news_event.8.t: "Second Abydos Coup"
 ABY_news_event.8.d: "Asagiri Suou's iron-fisted rule has finally come to an end. Commander Sunaookami Shiroko, who had been biding her time pretending to surrender, led the secretly assembled citizen militia and loyalists within the military last night and raided the official residence like lightning.\n\nAfter a chaotic street battle, Suou was arrested, and Commander Sunaookami Shiroko proclaimed the "restoration of justice and the collapsed order." Citizens are pouring out into the streets to cheer the hero's return, but there are also concerned gazes that the martial law and strong military control declared by the commander might be another form of authoritarianism."
 ABY_news_event.8.a: "Long live Commander Shiroko!"
 ABY_news_event.8.b: "Is this a traditional game?"

 ABY_news_event.9.t: "Proclamation of the Greater Abydos Federation"
 ABY_news_event.9.d: "President Sunaookami Shiroko formalized the unification with Slovakia while simultaneously launching a military operation crossing the Hungarian border. The President emphasized through a statement that "this is a holy war to end the dictatorial regime in Hungary and liberate our oppressed Slovakian brothers."\n\nAlong with this, the government declared to the world the establishment of the Greater Abydos Federation, encompassing Czechia, Austria, Slovakia, and Hungary. As the Federation is reborn as the hegemon of Central Europe, Romania and Yugoslavia are also sending their support, and discussions on the revival of the past 'Little Entente' are gaining momentum."
 ABY_news_event.9.a: "Glory to Greater Abydos."
 ABY_news_event.9.b: "Is this another method of unification?"

 ABY_news_event.10.t: "Revival of the Little Entente"
 ABY_news_event.10.d: "The leaders of [ABY.GetName], [ROM.GetName], and [YUG.GetName] gathered at Bratislava Castle today and signed a historic mutual defense treaty. With this, the 'Little Entente' that upheld the peace of Central Europe during the interwar period has been officially revived.\n\nThe heads of the three nations resolved in a joint declaration to "jointly respond to the invasion of any external forces that threaten the peace of the Danube River basin." With this treaty, [ABY.GetName]'s position as the firm leader of Central Europe has been internationally recognized."
 ABY_news_event.10.a: "Let us revive the old legacy."
 ABY_news_event.10.b: "The beginning of a new Eastern European hegemony."

 ABY_news_event.11.t: "[ABY.GetName] Promulgates Federal Law"
 ABY_news_event.11.d: "[ABY.GetName] promulgated the new Federal Constitution today and declared the end of military control over the Hungarian occupied territories. Accordingly, non-discriminatory federal citizenship is immediately granted to all Hungarian residents.\n\nA government spokesperson announced a massive balanced development plan for the eastern regions that had fallen behind due to the war, saying, "Complete integration that eliminates the distinction between victors and losers is our only path." In addition, to efficiently govern the Federation's expanded territory, it was suggested that discussions on leaving Prague to construct a new administrative capital in the long term would also begin."
 ABY_news_event.11.a: "The Federation shall forever be one!"
 ABY_news_event.11.b: "How long will that union last?"
