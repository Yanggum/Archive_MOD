 ABY_descision_focus_event.70.d:0 ""
 ABY_descision_focus_event.70.a:0 "The Enlightenment Army was totally crushed by the Nephthys PMC, right? LOL"

 ABY_descision_focus_event.71.t:0 "Red Shield, Once More"
 ABY_descision_focus_event.71.d:0 "Under the candlelight of the cramped temporary office, I look down at an old map of Europe. Vienna, Paris, London, Frankfurt… All the places where our family's name shone have now become the territory of unfamiliar academies or turned into ashes. People whisper that the Rothschilds are finished. What can a Jewish exile do, they pity, or laugh. They do not know. Our true strength is not the gold in the vault, but the name 'Rothschild' itself. And now I have the Vítkovice steelworks left. It is the only heart functioning in this land of chaos. Those girls with the strange halos, and the Czechs who lost their home, the Germans full of hatred… This unstable alliance is a dangerous gamble, but at the same time, it is the only opportunity. Good. I shall start again from this small spark. I will provide funds to them, create credit, and connect the arteries of the economy collapsed by war. They will come to need me. The red shield never breaks. Here in Bohemia, I will shake Europe once again."
 ABY_descision_focus_event.71.a:0 "That glory once more."
 ABY_descision_focus_event.71.b:0 ""

 ABY_descision_focus_event.72.t:0 "Empty-Handed Heir"
 ABY_descision_focus_event.72.d:0 "Standing by the window of the small office in Ústí nad Labem, I opened and closed my palm. An empty hand. The current Nephthys is exactly like this. The massive headquarters building in Kivotos, the endlessly stretching factories, the branch offices in each autonomous district… All of those are stories from another world that cannot be reached now. What fell here in Europe is just the name ‘Nephthys’ and me, and dozens of employees. People are expecting from me, but the vast financial power they expect is actually like a mirage. Will everyone be disappointed if they know this fact? But… Sensei told me. Because it's an empty hand, anything can be newly filled. Yes, that's right. There's no need to be weighed down by the names of the past anymore. I have no funds, no factories, no distribution network, nothing… but I have my friends from Abydos, and there is this strange coalition government. Starting from here. With the feeling of building up again from a single brick on bare ground. Not the old way of reigning with money, but a new Nephthys that helps everyone with credit and cooperation. That is what I must do in this land of chaos. With these empty hands, I will make everyone's tomorrow."
 ABY_descision_focus_event.72.a:0 "For that, I must follow the banner of the Federation."
 ABY_descision_focus_event.72.b:0 "For that, I must maintain the identity as a corporation."

 ABY_descision_focus_event.73.t:0 "The Heart of Steel Does Not Go Out"
 ABY_descision_focus_event.73.d:0 "A temporary workshop messy with hammer sounds and welding sparks. The massive factory in Pilsen is now taken by those Hyakkiyako bastards, but people are forgetting an important fact. The soul of Škoda resides not in the bricks of the factory, but in the heads and hands of our engineers. Repairing the old guns used by Henlein's militia and putting new engines in the Czech army's armored cars, we started again. Although we lost all assets and facilities, we have 'blueprints.' What the army of this provisional government will lean on is ultimately the steel we make. The strength of those children with halos is marvelous, but war ultimately concludes with supply and technical power. Mentor Masaryk trusted us, and we will repay that trust. In this small workshop, we will create the new heart of the Allied forces. More powerful barrels, more solid armor, faster engines. Škoda is not a simple company. It is the power that will move this nation, and the spear that will pierce the hearts of the enemies. Just watch, our technical power will become the cornerstone of this strange nation."
 ABY_descision_focus_event.73.a:0 "Let's re-establish tradition."
 ABY_descision_focus_event.73.b:0 ""

 ABY_descision_focus_event.74.t:0 "Domestic Stabilization"
 ABY_descision_focus_event.74.d:0 "You can start the Operation Falling Flower focus."
 ABY_descision_focus_event.74.a:0 "Preparations are finished."
 ABY_descision_focus_event.74.b:0 ""

 ABY_descision_focus_event.75.t:0 "Espero (Hope)"
 ABY_descision_focus_event.75.d:0 "Jan Filip, who was a writer for the Czech branch of Esperanto, watched with a small smile as locals and Kivotos people everywhere were learning Esperanto. He probably wouldn't have expected that at all. Esperanto, created and released by Zamenhof, eventually fell to a peerlessly small existence before the giant existences of English and French.\n\n"Saluton, mia amiko. (Hello, my friend.)"\n\nMiloš Lukáš, who was one of the association colleagues, looked at him and spoke small, in Esperanto, with a smile. Because the sight that Mentor Zamenhof hoped for was unfolding even if in a small way. \n\nKivotos people, and Germans, Czechs alike learning Esperanto for interaction and talking like this. Also the fact that it ended in success. They themselves wouldn't have expected these things at all.\n\n"Say Miloš, don't you think these Kivotos people have perhaps brought an opportunity to us?"\n\n"Hope, huh."\n\nMiloš smiled at him with a small smile."
 ABY_descision_focus_event.75.a:0 ""Yes, Esperanto. Finally we are able to sing that name.""

 ABY_descision_focus_event.76.t:0 "Recapturing Bohemia"
 ABY_descision_focus_event.76.d:0 ""
 ABY_descision_focus_event.76.a:0 "Lifting general mobilization."

 ABY_descision_focus_event.77.t:0 "Guide at the Crossroads"
 ABY_descision_focus_event.77.d:0 "A week has passed since Suou's coup was suppressed and the gunshots stopped in the streets of Prague. Destroyed buildings were being restored and citizens were finding their daily lives again, but the air in the Chief Executive's office was still as heavy as lead.\n\nAyane looked at the two thick reports placed on her desk in turn. Dark circles were deeply set under her eyes. Beside her, Hoshino sat leaning on the sofa, silently staring at the ceiling.\n\n"I have to decide, Hoshino-senpai. I can't delay it anymore."\n\nAyane's voice was dry. She judged Suou and defended the democratic government, but that didn't become an answer to 'what to protect.'\n\n"The first plan is... 'Restoration.'"\n\nAyane picked up the document on the left.\n\n"Inheriting the legal status of the Czechoslovak and Austrian Republics. Because they were the original owners of this land. We return to the position of 'helpers' as promised, and a new leader will be elected from among the locals. It's the most prestigious path with the least noise."\n\n"But..." Hoshino took the words in a low voice. "If we do that, we'll remain as 'guests' forever. And someday the conflict between 'owner' and 'guest' might explode again. Like during Beneš's time."\n\n"That's right."\n\nAyane held the document on the right. On its cover, the title [New Nation Construction Plan according to Two-World Integration Theory] was written.\n\n"So what came out is this 'Two-World Theory.' Not distinguishing locals and Kivotos people, but integrating into 'Federal Citizens' with a completely new single identity. It's a fusion that goes beyond simple coexistence. If this succeeds, we can turn off the spark of ethnic conflict itself in the long run. It's close to the true utopia Mentor Masaryk dreamed of."\nBut Ayane's hand was trembling. she bit her lip as if in pain.\n"But senpai, to go this path... we must see blood again."\n\n"......"\n\n"We must define the existing Czech, German, Austrian, and Kivotos nationalisms as 'relics of the old era' and forcibly dismantle them. We must suppress those who reject our identity, and we must suppress the radicals who oppose integration by force to plant this new order. It's different from the way Suou tried to do it, but eventually we also fall into the contradiction of having to wield 'violence for peace.'"\n\nAyane looked out the window. Over the scenery of the city being rebuilt, two futures overlapped.\n\nThe path of the 'honorable outsider' who steps back while respecting the old owners.\n\nOr, the path of the 'lonely pioneer' who forcibly binds the two worlds into an eternal one even if drenched in blood.\n\n"Which is the correct answer, uhehe..." Hoshino smirked bitterly and stood up. "Whichever it is, I'll share the responsibility. Ayane-chan, you just make the choice."\n\nAyane let out a deep sigh and picked up the pen. It was time to write down the next page of the history book where the ink hadn't dried."
 ABY_descision_focus_event.77.a:0 "The Master of this Land"
 ABY_descision_focus_event.77.b:0 "The Land of Two Worlds"

 ABY_descision_focus_event.78.t:0 "Red Rope"
 ABY_descision_focus_event.78.d:0 "In a back alley of Prague, the air in a moisture-stained underground safe house was thick. Hoshino was buried deep in an old sofa. Despite Shiroko's struggle, the coup forces' quantity offensive was overwhelming. Ayane, Serika, Nonomi, Shiroko... everyone was imprisoned in Suou's prison.\n\n"Comrade, no, Chairperson Hoshino. You don't look well."\n\nThe man sitting across, Klement Gottwald, spoke in a tone as if he were worried. He was the leader of the 'Danube Communist Party,' which was a minority within the Abydos Socialist Alliance. He wouldn't have even been Hoshino's opponent originally, but his prestige had grown strangely since Abydos defeated the eastern enemies. It was an open secret that there was massive funding and support from the Kremlin behind him.\n\n"Uhehe~ I look like a mess, right? So, I'm grateful for Mr. Gottwald getting me out this far."\n\n"Aren't we comrades. We couldn't let the fascist Suou trample democracy, Moscow... no, our party members couldn't stand it."\n\nGottwald pushed a document onto the table. It was the declaration for the formation of the 'Anti-Fascist United Front.' But as Hoshino scanned its contents, her eyes narrowed.\n\n"This... says it delegates all military command and the party's decision-making power to the 'Danube Committee'? Basically you're telling me to just leave the signboard and step back."\n\n"It's just a formal procedure." Gottwald laughed slily. "What's needed now is Moscow's... no, powerful international support and organizational power. If the Chairperson accepts this proposal, we will provide the 'strength' to drive out Suou and immediately rescue your precious colleagues."\n\nHoshino tightly gripped her fist. Mentor Masaryk's warning resonated in her ears.\n\n'The Communist Party cannot be trusted. They are the puppets of the Kremlin.'\n\nShe knows. The moment she holds this hand, the party she created will be reduced to a satellite party of the Soviet Union, and Abydos' ideal will be painted over with red. This is a contract with the devil.\n\nBut.\n\n"Can you really... save our kids?"\n\n"I'll promise with my neck on the line."\n\nHoshino grabbed the pen with a trembling hand. As long as her juniors were in a cold prison, she had no choice. Even if that rope was a burning red color, she had to catch it now."
 ABY_descision_focus_event.78.a:0 "Grabbing the Hand of the Devil."

 ABY_descision_focus_event.79.t:0 "Unleashed Wolf"
 ABY_descision_focus_event.79.d:0 "In the darkness of the rattling transport vehicle, Shiroko was looking down at her handcuffed wrists. From outside, the siren announcing the coup forces' victory was heard. It's finished with this. In exchange for her surrender, Ayane and other colleagues saved their lives. Shiroko comforted herself that it was enough. Although she would become Suou's trophy and be imprisoned forever or executed, she protected the spark of Abydos.\n\nBut it was at that moment.\n\nBang-!\n\nAlong with a massive explosion sound, the transport truck staggered. A screeching emergency stop sound, and screams and shouts heard from outside.\n\n"It's an ambush! Everyone battle stations!"\n\n"Block them! Those crazy... ugh!"\n\nThe urgent shouts of soldiers were soon buried by the shouts of someone. It wasn't the shout of an organized army. It was the raw voice of thousands, tens of thousands of citizens who were angry but craved hope.\n\n"Give back Shiroko!"\n\n"Release the hero of Abydos!"\n\nThe back door was torn off with a roar. Between the pouring bright sunlight, the faces of citizens holding Molotov cocktails, iron pipes, and old hunting rifles were visible. They were citizens of Prague. Without fearing Suou's armored units, they had ambushed the transport procession with their bare bodies.\n\n"Commander! We're sorry we're late!"\n\nA youth with a blood-stained bandage cut Shiroko's handcuffs. Shiroko, pulled out of the vehicle with a bewildered expression, lost her words at the sight before her eyes. A crowd filling Wenceslas Square. They were driving out the coup forces while chanting Shiroko's name.\n\n"Waaaaah-!! Long live Shiroko! Long live free Abydos!"\n\nShiroko looked at her hands. Her bound hands became free, and the citizens called her back into the center of the battlefield. She was no longer a defeated prisoner. she had become the focal point of a massive revolution itself."
 ABY_descision_focus_event.79.a:0 "What... is this..."

 ABY_descision_focus_event.80.t:0 "Between Blood and Velvet"
 ABY_descision_focus_event.80.d:0 "The steps in front of the National Museum, reclaimed by citizens. Shiroko sat on a truck being used as a temporary command post, looking down at a map. Suou's coup forces were temporarily retreating west of the Vltava River, pushed by the momentum of the citizens. But they were reorganizing their lines and would soon attempt a ruthless suppression with tanks at the front.\n\n"Commander, we armed the citizens by raiding the armory. Just give the command. Tonight, let's ambush the residence and take Suou's head!"\n\nThe citizen representative, appointed as the vigilante leader, shouted excitedly. Behind him, thousands of citizens were looking only at Shiroko's mouth while holding Molotov cocktails and captured rifles.\n\nShiroko pulled and released the rifle's bolt as a habit. \n\n'I can fight.'\n\nA wolf's instinct whispered. Urban combat was her specialty. If she used this massive crowd as bait and shield and she led the strike team to strike Suou's command, there was enough chance to win. That was the fastest and most certain solution as a soldier.\n\nBut...\n\nThe appearance of a young boy holding a rifle entered Shiroko's eyes. A child who was trembling with fear but pretending to be brave. If a total war breaks out, that child will be the first to fall before Suou's machine guns. Prague will become a sea of fire, and even if they win, tens of thousands of corpses will pile up on those ruins. Is what I tried to protect a country in ruins and dead citizens?\n\n'Is there no other way.'\n\nShe fell into thought after putting down her gun.\n\nThrowing away weapons. Non-violence.\n\nThat seemed like a crazy thing. Blocking tanks with bare bodies. But Suou's army is also people after all. They are also someone's son and brother. When the command to fire at unarmed citizens is given, what if the soldiers' consciences are shaken? What if the neutral factions within the military turn to our side?\n\nA unique gamble that can win without spilling blood, but will end in a massacre if it fails, the most dangerous gamble.\n\n"Commander?"\n\nAt the voice urging her, Shiroko raised her head. Her gaze stopped shaking and sank coldly. She put strength into her hand holding the rifle, then slowly, very slowly, put the gun down on the floor.\n\nThe wolf made a decision."
 ABY_descision_focus_event.80.a:0 "Yeah. There's no time. Must go immediately."
 ABY_descision_focus_event.80.b:0 "Everyone put down your guns. I'll lead."

 ABY_descision_focus_event.81.t:0 "Wolf's Crown"
 ABY_descision_focus_event.81.d:0 "Prague was liberated, but the smell of gunpowder still vibrated in the streets. Suou was ousted, but the power vacuum she left brought a monster called chaos. Citizens were armed by raiding the armories of military units, and private revenge was being practiced in the name of searching for Suou's remnants everywhere. 'Freedom' was becoming another name for 'disorder.'\n\nShiroko looked down at the chaotic street from the window of the office. By her side, aides stood with a mountain of reports.\n\n"Commander, maintenance of public security is impossible. We cannot control armed vigilantes and citizen militias with only police power. We must deploy the military."\n\nShiroko bit her lip. What she wanted was the restoration of democracy, not a lawless world. But there was no place to ask for advice. The rescued Ayane and other colleagues were hospitalized due to the aftereffects of torture, with their contact with the outside blocked.\n\n"Order... is needed."\n\nCitizens gathered in the square were chanting Shiroko's name. They were wanting a powerful 'hero' who would protect them right now, rather than complex parliamentary procedures or debates. Shiroko mistook that enthusiastic shout for a desire for democracy.\n\n"My mission is to normalize this country. It's not yet... time to put down the sword."\n\nShe instructed, turning to the aides.\n\n"I will extend the emergency powers. Until security is stabilized and the parliament is normalized, I will oversee general state affairs. All armed forces must immediately disband and follow military control."\n\nThe pure wolf did not know,"
 ABY_descision_focus_event.81.a:0 "That this was the first button binding her to a yoke of eternal power."
 ABY_descision_focus_event.81.b:0 ""

 ABY_descision_focus_event.82.t:0 "Weight of Velvet"
 ABY_descision_focus_event.82.d:0 "It was a miracle. When Shiroko put down her gun and blocked the tanks with the citizens, the coup forces' muzzles did not spit fire. Suou was arrested without spilling a drop of blood, and the square was full of the sound of keys being shaken by citizens and candlelight. Later, people called this the 'Velvet Revolution' because it ousted the dictatorship softly but strongly.\n\nThe nation was rapidly regaining stability. Shiroko thought her role was now over.\n\n"Then, I'll go back now. What's left is the share of Ayane and the politicians."\n\nShe visited Ayane who was lying in the hospital room and stated her intention to return. But Ayane, who was staring blankly out the window, shook her head.\n\n"No, senpai. I'm... not going back."\n\n"Ayane?"\n\n"I'm too exhausted. Trusting people, doing politics. It seems something inside me broke because of Ms. Suou's betrayal. Politics is... impossible now."\n\nAyane's refusal was a shock. Hoshino and other members were the same. They shook their heads while looking at Shiroko.\n\n"Uhehe~ Shiroko-chan. The only person who can settle this country right now is you. Whom did the citizens see and rise up?"\n\n"Right. Even if we step up, support will be bottom-tier. But it's different for senpai."\n\nShiroko looked down at her old military uniform with a distressed expression.\n\n"I'm a soldier. I don't know politics."\n\n"You can learn. Because we'll help."\n\nHoshino placed a hand on Shiroko's shoulder. Shiroko looked at the white wall of the hospital room, and the faces of her exhausted colleagues. Someone had to take the burden. she unbuttoned her military uniform with trembling hands."
 ABY_descision_focus_event.82.a:0 "It was a departure ceremony heading to a battlefield harder than a war zone."
 ABY_descision_focus_event.82.b:0 ""

 ABY_descision_focus_event.83.t:0 "Democracy of Steel"
 ABY_descision_focus_event.83.d:0 "6 months after the announcement of the extension of emergency powers, Shiroko took off her military uniform as promised. She resigned from her post as military commander, returned to civilian status, and founded the 'Federal Democratic Republic Party.' Citizens cheered. The fact that the hero of national salvation put down the gun and picked up a ballot was enough to cause the illusion that democracy was completed.\n\nThe election campaign sites were like idol concert venues. When Shiroko stood on the platform and waved her hand awkwardly, tens of thousands of supporters went wild. The voices of the opposition were dismissed as 'noise hindering national reconstruction' and buried under the disregard of the public.\n\n"I stood in this position to protect everyone's ordinary daily life. I will make a strong Abydos, a non-wavering Federation."\n\nThe election result was overwhelming. A turnout approaching 90%. Shiroko finally let out a sigh of relief after hearing the news of her confirmed election.\n\n'Yeah. This is it. Since the citizens chose me, legitimacy is secured. Now I can create the country Ayane dreamed of.'\n\nBut by her side, there was no aide who would say 'No,' nor was there a parliament to check her. What she created was a philosopher's rule wearing the mask of democracy. Shiroko, who became the master of the parliament, was becoming the most democratic dictator, not knowing that her rule was suffocating democracy."
 ABY_descision_focus_event.83.a:0 "Long live the President!!"

 ABY_descision_focus_event.84.t:0 "Wolf in a Suit"
 ABY_descision_focus_event.84.d:0 "Shiroko joined the 'National Social Liberal Party,' which was a reorganization of the centrist party led by Ayane. To her, who dealt only with guns and tactical manuals her whole life, party politics was unknown territory. However, her unique honesty and action dug deeper into the hearts of citizens than the colorful rhetoric of established politicians.\n\n"I don't know much about economics or diplomacy. But I know how to keep a promise. I'm confident I won't abandon people."\n\nHer unrefined speech spread to all over the Federation via airwaves. Ayane took charge of policy advice behind the scenes to fill Shiroko's lack, and Hoshino and Serika led the election camp and ran on their feet. When Nonomi's financial support was added, Shiroko's support rate soared vertically.\n\nSoon, the 2nd Federal general election arrived. The result was the securing of the majority of seats for the National Social Liberal Party and Shiroko's landslide victory.\n\nOn the night the election was confirmed, Shiroko stood on the platform for her victory speech. Amidst the flash fire, she was no longer a commander in a military uniform. Dressed in a neat suit, she was a legitimate and democratic leader who would lead the harmony of the two worlds, the 'President of the Abydos Federation.'\n\n"Today's victory is not just mine. Yeah, it belongs to all of us who held candles in the square. Now together with all the citizens of the two worlds, toward a new Abydos, I'm going to rob a bank... no, toward the future."\n\nAt her joke-mixed final comment, the square was covered with cheers."
 ABY_descision_focus_event.84.a:0 "It was the beginning of true spring."
 ABY_descision_focus_event.84.b:0 ""

