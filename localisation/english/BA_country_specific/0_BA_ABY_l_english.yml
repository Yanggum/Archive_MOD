	ABY_descision_category_new_country:0 "새로운 학원국가의 초석"
	ABY_descision_category_new_country_desc:0 "\n내년에 열리는 새로운 학원국가의 방향성을 결정하기 위한 국민투표 이전까지 우리는 각 파벌의 지지도를 조절하여 국가의 방향정을 정할 수 있습니다.\n\n국가의 방향성은 §2민주주의§!,§L파시즘§!,§g비동맹주의§!의 지지도에 따라 달라집니다!\n\n§2민주주의§!의 지지도가 §Y35%§!이상인 경우 \n§Y우리는 연방공화국을 선포할 것입니다.§!\n\n§L파시즘§!의 지지도가 §Y35%§!이상인 경우 \n§Y제국생도연맹은 반란을 일으킬 것이며, 우리는 이를 막지 못할 것입니다.§!\n\n§g비동맹주의§!의 지지도가 §Y35%§!이상인 경우 \n§Y왕당파는 새로운 왕을 옹립하기 위한 섭정의회를 소집할 것입니다.§!\n\n§2민주주의§!,§L파시즘§!의 지지도가 §Y35%§!이상인 경우 \n§Y제국생도연맹은 반란을 일으킬 것이며, 스나오오카미 시로코가 이를 진압할 것입니다.(미완성)§!\n\n§2민주주의§!,§g비동맹주의§!의 지지도가 §Y35%§!이상인 경우 \n§Y우리는 연방공화국을 선포할 것입니다. 하지만 왕당파의 요구를 무시할 순 없을 것입니다.§!\n\n§L파시즘§!,§g비동맹주의§!의 지지도가 §Y35%§!이상인 경우 \n§Y제국생도연맹은 반란을 일으킬 것이며, 타카나시 호시노가 이를 진압할 것입니다.§!\n\n§2민주주의§!,§L파시즘§!,§g비동맹주의§!의 지지도가 모두 §Y35%§!미만인 경우 \n§Y민주주의자와 왕당파는 연합하여 제국생도연맹에 맞설 것입니다.§!\n"
 

