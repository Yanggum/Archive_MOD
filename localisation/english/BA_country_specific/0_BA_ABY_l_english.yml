 ABY_czech_head_1_trait: "§YFather of Bohemia§!\n	Stability: §G+30.00%§!\n	Political Power Gain: §G+15%§!\n	Daily Democratic Support: §G+0.10§!\n\nTomáš Garrigue Masaryk was born on March 7, 1850, in Hodonín, Moravia. In his youth, as a philosopher and social reformer, he played a leading role in the Czech nationalist movement based on Austro-Slavism. He devoted himself to the autonomy of the Czech people within the Austro-Hungarian Empire, but reflecting the international situation during World War I, he shifted to the line of Czechoslovak independence. Having contributed to the declaration of independence on October 28, 1918, he took office as the first president on November 14 of the same year, playing a decisive role in nation-building and establishing democracy, before resigning from the presidency in 1935. However, with the Transference, he has once again become the leader of the Czech Provisional Government, and is pushing his aged body to work towards the liberation of Czechia once more."
 ABY_czech_head_2_trait: "§YResistance Activist§!\n	Recruitable Population Factor: §G+15%§!\n	War Support: §G+10.00%§!\n\nEdvard Beneš was born on May 28, 1884, in the Bohemia region of the Austro-Hungarian Empire. As a disciple of Tomáš Masaryk, he devoted himself to the Czech national liberation movement. Distinguishing himself in the fields of diplomacy and internal affairs, he served in various key government posts and strove to elevate the status of Czechoslovakia on the international diplomatic stage before taking office as the second president in 1935. Following the collapse of Czechoslovakia due to the Transference and the establishment of the Czech Provisional Government, Beneš, who became the new leader of the Czechs after Masaryk's resignation from the presidency in 1937, is devoting himself to the liberation of Czechia as Masaryk's successor."
 ABY_german_head_1_trait: "§YCoordinator of Democracy§!\n	Weekly Stability: §G+0.50%§!\n	Daily Fascism Support: §R-0.10§!\n	Daily Democratic Support: §G+0.10§!\n\nLudwig Czech was born on February 14, 1870, in Lviv. As a lawyer and politician of German-speaking Jewish descent, he inherited the social democratic traditions of the late Austro-Hungarian period. After the founding of Czechoslovakia, he served as the Minister of Social Welfare starting in 1929, and later held important posts in the public works sector, dedicating himself to advancing the rights and interests of German-speaking Czechoslovaks. Following the Transference, as the highest-ranking German official within the Czechoslovak government, he became the spokesperson for the German citizens of the Sudetenland. However, his health is deteriorating day by day due to the aftereffects of being struck by an assassin's bullet during the Transference process."
 ABY_german_head_2_trait: "§YSudeten Nationalist§!\n	Stability: §G+15.00%§!\n	Political Power Gain: §R-10%§!\n	Recruitable Population: §Y-0.50%§!\n	Daily Non-Aligned Support: §R-0.10§!\n\nKonrad Henlein was born on May 24, 1898, in a German-populated area within the Austro-Hungarian Empire. With his youthful vigor, he emerged as a leading figure in the German autonomy movement in Czechoslovakia. In the early 1930s, as the head of the Sudeten German Party, he actively worked to strengthen the party's organizational power and unity, playing a central role in inspiring the political awakening of the citizens of the Sudetenland. Following the Transference, having suddenly garnered the support of the majority of Sudeten Germans, he has become the person with the most political influence in the coalition government after Masaryk. After Czech's death, he officially rose to become the representative of the Germans, but he feels a great burden from this situation."
 ABY_abydos_head_trait: "§YShield of Abydos§!\n	War Support: §G+10.00%§!\n	Division Attack on Core Territory: §G+10.0%§!\n	Stability Modifier from Defensive War Penalty: §G+20.00%§!\n\nTakanashi Hoshino, the only third-year student at Abydos High School and the spiritual pillar of the Foreclosure Task Force, looks at first glance like a cute lazybones who just loves to sleep. Watching her laid-back behavior gives off the vibe of a cute junior rather than the dignity of a senior. However, if the Abydos High School she loves so dearly and her juniors are put in danger, she will show a strong and upright demeanor, as if her previous cute and gentle appearance never existed. Although she has a tendency to be somewhat swayed by her emotions, her outstanding combat prowess covers up that recklessness and smashes through everything blocking her path. Yet even she, who seems so strong, sometimes shows a goofy and strange side. Even if her juniors ask about it, she simply avoids answering. What is the unspeakable story she holds in her heart?"

