 ABY_new_event.120.t:0 "Socialism Hangs the White Flag?"
 ABY_new_event.120.d:0 "Our successive victories have crushed their hopes. Our soldiers heading continuously toward the east of Europe are reporting on fronts that are collapsing at a severe or comparable rate. If the reports are true, the complete collapse of the Russian army is imminent, or has already begun.\n\nThis morning, the Soviet government in Moscow, unlike their previous attitude toward us, declared they would not refuse any conditional surrender and proposed peace. In exchange for handing over vast territories in Eastern Europe—including the Chornozem plains and the port cities of Crimea—they are appealing to us for mercy with perhaps a desperate attitude. Opinion on this is greatly divided, but fully occupying Russia would entail many difficulties. Considering their potential, peace would be the best way to secure Abydos' hegemony and prevent the Russian threat for decades to come."
 ABY_new_event.120.a:0 "Of course. Let us commemorate our brilliant victory."
 ABY_new_event.120.b:0 "We will head toward the far Far East."

