 SOV_bcerossiya:0 "전러시아 임시위원회"

 ABY_news_event.1.t: "아비도스 임시정부의 휴전 파기"
 ABY_news_event.1.d: "오늘 아비도스 임시정부군이 백귀야행과의 휴전을 파기하고 침공을 시작했습니다. \n\n그곳은 자주 무력충돌이 있었던 지역이나 침공과 함께 주데텐 실레시아에서 독일인들이 봉기하며 외신들은 계획된 침공으로 보고 있습니다.\n\n하지만 이에 대해 현지와 키보토스의 국가들은 최후의 발악으로 일축하고 별 다른 관심을 보이고 있지 않습니다."
 ABY_news_event.1.a: "가자! 해방을 위해!"
 ABY_news_event.1.b: "궁지에 몰린 쥐는 고양이를 문다고 했나."
 
 ABY_news_event.2.t: "산해경과 아비도스의 충돌"
 ABY_news_event.2.d: "산해경이 불법적으로 침탈한 자신들의 핵심 지역을 반환하라는 아비도스의 최후통첩을 무시하며 두 국가는 전쟁 상태에 돌입했습니다.\n\n모두의 예상을 뒤엎고 백귀야행을 상대로 승전한 아비도스 임시정부의 행보를 여러 국가가 주목하는 가운데 일어난 두 번째 전쟁은 키보토스 국가들에게 큰 경계심을 사고 있으며, 현지 국가 중 일부는 이에 지지 성명을 발표하는 등 이번에는 여러 의견이 복합적으로 작용하고 있습니다."
 ABY_news_event.2.a: "승리가 머지않았다."
 ABY_news_event.2.b: "그들에게 또 다른 행운이 주어질까?"
 
 ABY_news_event.3.t: "오스트리아 임시민주정부 설립"
 ABY_news_event.3.d: "놀라운 일이 일어났습니다. \n아비도스 임시정부군이 린츠로 진주하자 린츠의 시민들은 그들을 해방자로써 환영하며 꽃잎을 던지고 만세를 부르는 등 큰 환영을 받은 것입니다.\n이에 총사령관 아사기리 스오우는 인터뷰에서 정부의 결단을 따를 것을 천명했습니다.\n\n한편 임시정부는 오스트리아 사회민주당을 대표로 한 대표단을 만났으며, 방금 오스트리아 임시민주정부의 성립과 오스트리아 해방 계획을 발표했습니다.\n이에 산해경은 비열한 수작이며 그들이 확장주의적 야욕을 드러냈다며 비난하고 있으나 큰 호응은 없는 것으로 보입니다."
 ABY_news_event.3.a: "오스트리아 해방을 향해."
 ABY_news_event.3.b: "두 세계의 국가... 그들은 도대체 뭐지?"
 
 ABY_news_event.4.t: "아비도스 연방정부의 성립"
 ABY_news_event.4.d: "오쿠소라 아야네 임시 연방대통령은 오늘 아비도스-체코-오스트리아 연방정부의 결성을 선언했습니다. 임시정부 헌법을 계승해 주데텐란트 완전 자치 등의 내용이 담긴 연방임시헌법을 제정하고 빠른 시일 내에 수정헌법을 발표해 국가의 기틀을 다지고 총선을 치르겠다고 밝혔습니다.\n\n한편 며칠 전의 임시정부 내 사단 일부가 새로운 수도로 북상/남하하고 네프티스 이사회가 재판에 회부되는 사건 등에 대해서는 내부사정이라며 말을 아꼈습니다.\n일부 전문가들은 군사 쿠데타의 과정과 유사함을 들어 정치적 불안정성을 우려하고 있으나 한편으로는 오히려 쿠데타를 막는 데 성공한 것이 아니냐며 의견이 갈리고 있습니다."
 ABY_news_event.4.a: "마사리크, 우리 아버지, 보고 계십니까?"
 ABY_news_event.4.b: "새로운 민주주의 국가의 탄생이군."
 
 ABY_news_event.5.t: "아비도스 군사 쿠데타"
 ABY_news_event.5.d: "아비도스 임시정부의 오스트리아 방면군 사령관이자 국민영웅, 아사기리 스오우가 그간의 충성 선언을 뒤엎고 군사 쿠데타를 일으켰습니다. \n\n쿠데타와 함께 정부청사와 대사관 등이 폐쇄되어 알려진 바는 많이 없으며 기자들의 통행 역시 제한되어 검문소가 운영되고 있습니다.\n\n국가계몽위원장으로 취임한 아사기리 스오우 장군은 가증스러운 임시정부의 추악한 음모를 확인해 구국의 결단을 내렸다고 발표했으나, 그 자세한 내용에 대해서는 추후 공개하겠다며 언급을 피했습니다.\n\n또한 임시정부 주요 정치인사들의 행방은 묘연하여 그들의 생사여부에 대해 논란이 일고 있습니다."
 ABY_news_event.5.a: "우리 민주주의는 이대로 무너지는가?"
 ABY_news_event.5.b: "또 하나의 국가가 극단주의로 빠져든다."
