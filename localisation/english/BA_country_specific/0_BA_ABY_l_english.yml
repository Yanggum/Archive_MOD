 ABY_descision_focus_event.1.t:0 "민족을 초월하여"
 ABY_descision_focus_event.1.d:0 "1936년, 체코 임시정부, 독일계 위원회, 그리고 아비도스 고등학교 대책위원회는 역사적인 연합을 결성하기 위해 카를로비바리 대극장에 모였다. 임시정부 의회로 결정된 이 극장은 오늘, 새로운 정부와 미래를 결정짓는 무대가 되었다.\n\n대극장 내부는 긴박하면서도 비장한 분위기로 가득했다. 체코의 푸른 삼각형을 가진 백적색의 깃발, 주데텐란트를 상징하는 흑적흑기, 그리고 아비도스 고등학교의 상징을 담은 교장이 나란히 걸려 있었다.\n\n먼저 연단에 오른 것은 토마시 마사리크였다. 그는 나이든 얼굴에도 불구하고 강렬한 카리스마를 내뿜고 있었다. 그의 목소리가 대극장 안에 울려 퍼졌다.\n\n“우리는 조국을 잃었습니다. 프라하는 백귀야행의 손아귀에 들어갔고, 우리의 국민은 흩어졌습니다. 그러나 우리 체코슬로바키아의 정신은 결코 꺾이지 않았습니다. 오늘 이 자리에서, 우리는 다시금 그 정신을 되살리고자 합니다.”\n\n그는 잠시 말을 멈추고, 청중들을 둘러보며 천천히 말했다.\n\n“행정명령 111호. 이것은 단순히 비상사태를 알리는 명령이 아닙니다. 이것은 우리의 생존과 자유를 지키겠다는 약속입니다. 비록 우리는 우리의 땅을 잃었지만, 이 명령을 계승하여 우리의 대의를 이어갈 것입니다. 오늘, 독일인들과 아비도스와의 연합을 통해 우리는 백귀야행에 맞설 새로운 정부를 선포하고자 합니다. 이 연합은 우리 모두의 희망이 될 것입니다.”\n\n다음으로 연단에 선 사람은 루트비히 체흐였다. 그는 독일계 국민사회당원 이었고, 과거부터 독일계와 체코계의 화합을 주장해온 저명한 인물이었다.\n\n“오늘 우리는 역사의 새로운 갈림길에 서 있습니다. 독일계와 체코계는 오랜 시간 동안 이 땅을 공유하며 살아왔습니다. 그러나 지금 우리의 적, 백귀야행과 산해경은 우리를 분열시키고 약화시키려 하지만, 우리는 그들의 뜻대로 되지 않을 것입니다.”\n\n그는 잠시 말을 멈추고, 무대 아래를 둘러보며 한층 부드러운 어조로 말을 이었다.\n\n“저는 독일계와 체코계가 하나로 뭉칠 수 있음을 믿습니다. 우리는 서로 다르지만, 모두가 이 땅을 사랑하고 자유를 갈망합니다. 저는 독일계와 체코계가 과거의 갈등을 제쳐두고, 힘을 합쳐 체코와 오스트리아를 해방하기를 바랍니다. 이것은 단순한 군사적 목표가 아닙니다. 이것은 우리가 협력하여 이룰 수 있는 갈등을 초월한 승리일 것입니다.”"
 ABY_descision_focus_event.1.a:0 "그들에게 독일계와 체코계 할 것 없이 큰 박수가 쏟아졌다."
 
 ABY_descision_focus_event.2.t:0 "그리고 세계를 초월하여"
 ABY_descision_focus_event.2.d:0 "마지막으로 연단에 오른 사람은 타카나시 호시노였다. 그녀는 젊다 못해 어렸고 몸은 아담했지만, 그 눈빛은 깊은 책임감과 결단력을 담고 있었다. 그녀는 앞의 사람들과는 사뭇 다른 느낌으로 말을 시작했다.\n\n“으헤, 앞에서 중요한 말은 다 해줘서 이 아저씨는 뭘 말해야 할지 모르겠네. 아마 많은 사람들이 이 연합에 회의감을 느낄거야. 체코슬로바키아 정부 사람들을 구출한것도 우리고, 체코인과 독일인이 싸우지 않게 규합한 것도 우리인데, 왜 우리가 저 사람들을 위해 피를 흘려야 하느냐고 말이야.”\n\n그녀는 잠시 말을 멈추고 주변을 둘러보았다.\n"하지만."\n\n“그게 과연 온전히 우리의 공일까? 체코인들은 백귀야행에 대항해 최전선에서 피를 흘리며 우리들이 모두를 규합할 시간을 벌어 주었고, 독일인들은 과거의 갈등을 제쳐두고 체코 정부의 사람들을 구하기 위해 우리보다 먼저 뛰어들었어. 우리는 우리의 공에 비해 과분한 권한과 지위를 물려받았고, 따라서 우리는 그들에게 보답할 의무가 있어. 그리고 우리가 저들을 버린다 한들 트리니티, 카이저, 백귀야행... 이 모두가 우리를 가만히 내버려 둘리도 없지. 오늘의 협약은 단순히 전쟁의 동맹이 아닌, 궁극적으로는 두 세계간의 평화를 위한 시작이야. 그러니 부디 동참해줘.”\n\n그녀는 말을 마치며 고개를 숙였다."
 ABY_descision_focus_event.2.a:0 "이내 극장 내부는 뜨거운 박수로 가득 찼다."
 
 ABY_descision_focus_event.3.t:0 "카를로비바리 협약"
 ABY_descision_focus_event.3.d:0 "세 대표가 발언을 마친 뒤, 세력 대표은 함께 협약의 내용을 낭독했다.\n\n1.체코슬로바키아와 독일계 위원회의 연합\n\n1-1.체코 임시정부와 독일계 위원회는 하나로 연합하여 백귀야행과 산해경에 의해 점령된 오스트리아의 해방을 최우선 과제로 삼는다.\n\n1-2.군사적, 물자적, 외교적 협력을 약속하며, 서로를 대등한 동맹으로 인정한다.\n\n2.아비도스 고등학교의 중재 역할\n\n2-1.아비도스 고등학교 대책위원회와 아비도스계 주민들은 체코와 독일계 간의 갈등을 조정하고, 상호 협력을 유지하도록 중재한다.\n\n2-2.오스트리아 해방 후, 키보토스계 주민들과 현지 주민들 간에 발생할 수 있는 갈등을 해결하고 지역사회의 화합을 위해 노력한다.\n\n3.아비도스 임시정부의 출범\n\n3-1.아비도스 임시정부는 체코슬로바키아의 정통성을 계승하며, 새로운 정부로서 연합의 지도적 역할을 수행한다.\n\n3-2.모든 세력은 백귀야행과 산해경의 침략에 맞서 싸우는 데 협력한다.\n\n그날 카를로비바리 대극장에서 세 대표가 손을 맞잡고 낭독한 협약은 단순한 군사적 동맹이 아니었다. "
 ABY_descision_focus_event.3.a:0 "그것은 새로운 미래를 향한 약속이었다."

 ABY_descision_focus_event.4.t:0 "되찾은 안정"
 ABY_descision_focus_event.4.d: "군사 작전 보고서: 카타카타 관련 107호\n\n8구역 마지막 기지 함락 이후 도주한 카타카타 헬멧단 지도부는 에겔란트 방면 국경수비대를 제압하고 백귀야행으로 망명을 시도하였으나, 백귀야행군의 공격으로 감시초소 방면으로 후퇴하다가 초병에 발각, 헌병대가 투입되어 생포에 성공함.\n비고: 스나오오카미 시로코 헌병대장이 직접 선두에 나섬.\n\n각 구역에서 게릴라 활동을 하던 헬멧단 충성파는 지도부의 체포로 인해 대다수가 활동을 중지하고 항복함.\n\n투항하거나 생포된 이들이 많아 군 내에서 처리할 사안이 아니라고 판단되어 정부로 결정권을 이양.\n\n\n보고서: 법률위원회 782호\n\n현행법상 이들은 포로가 아닌 반란군으로 간주되어야 하며, 이 경우 단원들은 대부분 투옥될 것으로 보임.\n하지만 행정명령 111호로 인해 발효된 비상대권법상 이들은 저항군으로 간주하는 것이 가능하며, 이 경우 전쟁포로로 간주, 망명 혹은 제한된 군 복무가 가능함.\n\n요약: 법률 해석에 따라 저항군 혹은 반란군이 될 수 있으며, 각 경우의 처우 역시 달라짐. 따라서 행정부로 결정권을 이양함."
 ABY_descision_focus_event.4.a:0 "그들을 반란군으로 간주하고 재판에 넘겨라."
 ABY_descision_focus_event.4.b:0 "전투원 하나하나가 중요하다. 저항군으로 간주하라."

 ABY_descision_focus_event.5.t:0 "학생회장들의 계곡"
 ABY_descision_focus_event.5.d:0 "임시정부 내 키보토스인에 대한 수색이 마무리될 무렵, 민병대는 수색대를 편성해 학생회장들의 계곡으로 향했다. 사람이 거의 살지 않는 지역임에도 아비도스 내에서 가장 큰 전이 면적을 가진 학생회장들의 계곡은, 그 척박한 환경과 거대한 규모 탓에 수색이 지연되었다.\n\n결국 200명에 가까운 수색대를 편성하고 적응 훈련을 완료하고서야 해당 지역에 진입할 수 있었다. \n하지만 학생회장들의 계곡 깊이 아무리 들어가도, 인기척은 커녕 작은 동물의 소리도 들리지 않았다.\n\n"여기 정말 뭐가 있기는 한거야?"\n"그러게... 이제 밤이 다 되어 가는데..."\n"어? 저기 뭔가 있다!"\n"뭐?"\n\n수색대는 멀리 보이는 거대한 검은 형체로 다가갔고, 그들은 눈앞에 펼쳐진 광경에 할 말을 잃었다.\n\n"저건... 무슨..."\n"너, 좀 물어보자. 키보토스에는 저런 게 돌아다니는 거야?"\n"아니, 나도 저런 건 처음 봐..."\n"아비도스의 문장이 있어. 그래고 저건... 게헨나의..?"\n\n고층 건물만한 크기의, 함포로 무장한 검은 무장열차 앞에서 그들은 잠시 넋을 놓고 있었다."
 ABY_descision_focus_event.5.a:0 "사진, 사진기 있어?"

 ABY_descision_focus_event.6.t:0 "뇌제의 유산"
 ABY_descision_focus_event.6.d:0 "이 비밀병기에 대한 정보는 철저히 은폐되었고, 고위급 몇명만이 참석한 회의가 이루어졌다.\n\n"...열차포 셰마타. 과거 아비도스의 혼란기를 종식시키고 아비도스의 최전성기를 이끈 전설적인 학생회장의 이름을 딴 열차포에요."\n\n"그래서, 그것의 제원은 어떠합니까?"\n\n"부포로써 3연장 203mm 함포 1문, 1연장 152mm함포 2문, 2연장 127mm함포 6문이 장착되어 있으며, 주포로 500mm 플라즈마 포탑이 장착되어 있어요. 설명상 1톤 무게의 포탄을 500km밖까지 발사할 수 있다고 하네요."\n"500km반경은 현재 위치에서 독일 전역이 사정권에 들어오는 수준이에요."\n\n말도 안되는 제원에 좌중은 시끄러워졌다. \n지구에서도, 키보토스에서도 강위력한 무기에 대한 연구는 지속되어 왔으나, 갑자기 혜성처럼 나타난 이 비대칭무기는 (군사력에 한정한다면) 순식간에 이 조그만 국가를 패권국으로 올려줄 수도 있는 수준이었다.\n\n"하지만 뇌제의 유산이라는게 마음에 걸리네요... 저희가 뇌제의 유산을 소유하고 있는 것만으로도, 키보토스의 학원들은 기회가 생기는 대로 우리를, 정확히는 열차포를 파괴하려 들 거에요."\n\n"하지만 그렇다고 이 병기를 파괴하는 것은 국가적 손실일 뿐더러, 안전하게 파괴하는데 드는 비용은 천문학적입니다. 아야네 서기님 말대로 이것이 소유하는 것만으로 위협을 받을 수 있다면, 부술 수 없으니 차라리 사용하는 게 났지 않겠습니까?"\n\n기껏 강력한 병기를 얻었으나, 키보토스인과 현지인의 관점 차이로 인하여 토론은 끊이지 않았다."
 ABY_descision_focus_event.6.a:0 "한 통의 전화가 도착하기 전까지는."

 ABY_descision_focus_event.7.t:0 "파멸의 병기"
 ABY_descision_focus_event.7.d:0 ""예, 연립임시정부 내각입..."\n"아야네 서기님, 서기님이 얘기 하셔야 할 것 같습니다."\n"게헨나입니다."\n\n게헨나 선도부 정보부장의 전화. 셰마타 열차포에 대한 정보는 분명히 기밀로 정해 놓았을 텐데, 어떻게 유출된 거지? 아야네로서는 짐작조차 할 수 없었다. 통화의 내용은 간단했다. 셰마타 열차포는 게헨나에게 있어서 지우고 싶은 과거의 역사인 '뇌제의 유산'이자 위험한 대량살상병기에 속했다. 정보부는 이 열차를 파괴하는 것이 자신들의 뜻이라고 전했다.\n\n짧지만 무거운 통화가 끝난 뒤, 아야네가 말했다.\n\n"셰마타의 존재가... 유출됐어요. 게헨나가 이미 알고 있습니다."\n\n게헨나가 셰마타의 정보를 알게 되었다. 그리고 군사적 지원을 대가로 셰마타의 해체를 요구하고 있다. 이 사실에 회의실 전체가 술렁였다.\n\n"말도 안 됩니다! 극비로 관리해온 정보인데 어떻게..."\n"게헨나 정보부가 손을 썼을 겁니다! ...이건 명백한 내정 간섭입니다!"\n"그럼에도 적어도 그들이 우리에게 무조건으로 열차포를 파괴하라고 요구한 건 아닙니다. 어디까지나 군사적 지원이라는 조건을 내걸었습니다."\n"그 지원이 얼마나 도움이 될 지도 모르잖습니까. 열차포를 갖고 있는 게 더 이익일 수도 있는데...!"\n\n연립임시정부 내에서 시끄러운 소란이 벌어졌다. 아야네는 이런 소란을 제지하고 통제하는 카리스마는 없었다. 그저 키보토스와 현지인 대표들의 의견이 모일 때까지, 서로의 의견을 서기로서 정리할 뿐이었다. 다행히도 논쟁은 심각한 말다툼까지는 번지지 않았다. 빠른 답변이 필요하다. 그것만은 이곳에 모인 모두가 동의하고 있었으니까.\n\n결론은 정해졌다. 아야네는 다시 수화기를 들었다.\n\n"여러분의 제안을 긍정적으로 검토했어요.""
 ABY_descision_focus_event.7.a:0 "...셰마타 열차포는 파괴되어야만 해요."
 ABY_descision_focus_event.7.b:0 "...하지만, 역시 내정간섭은 받아들일 수 없어요."

 ABY_descision_focus_event.8.t:0 "지원 요구"
 ABY_descision_focus_event.8.d:0 ""
 ABY_descision_focus_event.8.a:0 "도움을 달라."

 ABY_descision_focus_event.9.t:0 "연방정부 선포"
 ABY_descision_focus_event.9.d:0 "연방정부 수립은 빠르게 이루어졌다... 이상하리만치 빠르게.\n\n마사리크의 노력 덕에 베네시가 가진 아비도스에 대한 의심은 빠르게 줄어들었으나, 그의 사후 체코와 오스트리아의 바람잡이들은 베네시의 마음 속에 남아있던 조그만 의구심의 불씨를 키워나갔다.\n\n에드바르트 베네시. 체코슬로바키아 독립영웅 3인중 1명이자 국부 토마시 마사리크의 제자. 그런 그였기에 신정부 수립 과정에서 마사리크의 조언을 대부분 그대로 수용하였다.\n...만약 그 바람잡이들이 없었다면 전부 수용했을 것이다.\n\n결국 그는 아비도스 대책위원회에 최소한의 권한만 분배하였고, 백귀야행과 산해경에 대한 보복적 정책을 시행했다.\n\n"역시나, 그분도 항상 완벽할수는 없어."\n"백귀야행과 산해경의 키보토스인들의 저항이 예상보다 적다라..."\n(아비도스의 그 아이들의 주장으로는)"키보토스인들의 총기에 대한 집착은 엄청난데... 총기몰수 명령에 산해경의 절반 - 아마 검은 용의 문 인가 뭔가 하는 이름이었을 것이다 - 이 무장반란을 일으킨 것 말고는 조직적인 저항은 없었다..."\n\n"조금 더 강경하게 나가도 되겠군.""
 ABY_descision_focus_event.9.a:0 "그의 눈은 냉정했으나 그 속에는 복수의 불씨가 타오르고 있었다."

 ABY_descision_focus_event.10.t:0 "대책위원회"
 ABY_descision_focus_event.10.d:0 ""우린 속은 거야! 속은 거라고!"\n\n"세, 세리카, 진정..."\n\n"응. 내가 당장 쳐들어가서..."\n\n"시로코 선배!"\n\n"으헤, 그럼 안돼, 시로코 짱."\n\n"아, 호시노 선배..."\n\n"그건 이 아저씨가 해야 하는거야."\n\n"..."\n\n"음~ 그래도 베네시 씨랑 나름 친해졌다고 생각했는데, 갑자기 저렇게 나오니 실망스럽네요..."\n\n"아하하... 흠흠, 그래도 다들 생각해 봐요."\n"선생님이 부탁했던 거긴 하지만 이건 원래 저희 일이 아니긴 했잖아요?"\n"저희가 위세같은걸 부리려고 그 제안을 수락한 게 아니잖아요, 그렇죠?"\n\n"그거야 뭐..."\n"그건 맞지."\n\n"어찌 보면, 이렇게 되었어야 하는 일이었어요. 선생님은 저희가 베네시 씨를 도우라 했던거지, 저희가 모든 걸 하라 하지 않았어요."\n"따지고 보면 선생님은 베네시 씨에게 국가 운영을 맡긴 거니, 의도한 대로 되었다고 할 수 있죠."\n"그리고, 베네시 씨는 똑똑한 분이잖아요? 분명 잘 해낼 거에요."\n\n"응. 그래도 배신감은 드는데... 아야네는 그렇지 않아? 선생님은 베네시 뿐 아니라 아야네도 후임자로 공인했잖아."\n\n"아쉬운 마음이 없다고 하면 거짓말이겠죠. 하지만 저희는 최근 몇년간 열심히 달려왔어요. 비록 대책위원회도 해체되고, 노노미 선배를 뺀 모두가 각자의 사정으로 졸업하게 되었지만, 그래도 이렇게 함께 만나서 이야기할 수 있으니 마치 옛날의 대책위원회로 돌아간 느낌이자 좋아요."\n\n"으헤, 그래, 아야네가 그렇게 생각한다면~ 우리는 우리 자리에서 최선을 다하자구.""
 ABY_descision_focus_event.10.a:0 "오-!"

 ABY_descision_focus_event.11.t:0 "가해자가 된 피해자"
 ABY_descision_focus_event.11.d:0 "새로 결성된 아비도스 연방정부의 에드바르트 베네시 내각은 추가적인 행정명령을 게시했다. \n프라하, 빈 등 대도시에서의 강제 퇴거 명령이 그것이었다.\n본래라면 해당 명령 정도로 문제가 발생하지는 않겠으나, 베네시 내각은 체코 내 강제퇴거에 체코계, 오스트리아 내 강제퇴거에 독일계를 이용하는 악수를 저질렀다.\n내각에서는 이가 훨씬 효율적이라고 여겼을지 모르나, 체코인과 오스트리아인의 키보토스인에 대한 증오는 상상을 초월했다.\n비록 (키보토스인은 현지인들보다 훨씬 강했기에) 학살 등의 고수위 사건은 발생하지 못했으나, 오히려 그렇기에 그들의 증오는 농축되어 행정상의 차별을 빚었다.\n\n"이게 무슨 소립니까... 분명 연방 칙령에는 이주비용이 지급된다고..."\n\n"아니 돈이 없다니까? 돈이 없는데 어떻게 줘?"\n\n"그럼 저흰 어디가서 뭘 먹고 살라는 말입니까..."\n\n"알빠야? 저기 프라하 교외에 생긴 판자촌으로나 가!"\n\n와 비슷한 일은 이제 일상이었으며,\n\n쾅! 쨍그랑!\n\n"야 이놈들아! 또냐! 아이고! 이게 몇번째야! 가구가 남아나는게 없네 아이고 아이고!"\n\n키보토스계 상점이나 식당에 화염병이나 급조 폭발물을 던지는 경우도 자주 일어났다.\n하지만 키보토스인은 겨우 이런 것으로 죽지도 않았고, 결국 그들의 증오만 차곡차곡 쌓이고 있었다.\n집단 린치는 일부 현지인이 키보토스인보다 다수인 지역에서 가끔 일어났으며, 아무리 때려도 쉽게 죽지 않는 키보토스인들은 그들의 좋은 놀이기구였다.\n\n한때 두 세계의 국가로 불리던 곳은, 이제 다뉴브의 화약고가 되어 화약이 차곡차곡 쌓여가고 있었고, 마침내 불씨가 지펴졌다.\n\n퍽!퍽!\n여느 날처럼 빈의 교외에선 린치가 일어나고 있었다.\n\n"어이, 이년아, 정신 들어? 앙?"\n\n"...잠깐, 디트리히. 이년... 움직이지를 않는데?"\n\n"...뭐?"\n\n한 산해경 학생을 둘러싸고 린치하던 십수명의 오스트리아 청년들은 일제히 얼어붙었다.\n\n"씨발... 숨을 쉬지 않...네...?"\n\n"빨리... 빨리 삽 가져와 이 새끼들아!"\n\n그들은 죽은 소녀를 급히 파묻었으나, 그들은 삽질에 열중하느라 수풀이 부스럭거리는 소리를 듣지 못했다."
 ABY_descision_focus_event.11.a:0 "그리도 다음날, 해당 사건은 신문에 대서특필 되었다."

 ABY_descision_focus_event.12.t:0 "폭풍전야"
 ABY_descision_focus_event.12.d:0 "베네시는 전국 각지에서 올라오는 전보를 받아들고 식은땀을 흘렸다.\n빈에서의 린치로 산해경의 학생이 사망한 이후, 키보토스인들은 더 이상 당해주지 않았다.\n그들은 경찰서와 군부대를 습격하였고, "남키보토스 연합전선"을 창설해 조직적으로 연방정부에 대항하였다. 다행인 점이라면, 아직 보복성의 대량 학살이 일어나지 않았다는 점이 있지만 식견 있는 자라면 그것이 머지않았다는걸 알 것이었다.\n\n그리고 그것은, 베네시 역시 깨닫고 있었다.\n"아...아아..."\n어디부터 잘못된 것일까.\n그는 이 상황을 타개할 방법을 모색했다.\n떠오르지 않았다.\n좆된거다. 아주 제대로 좆된것이다.\n자신의 잘못이 아니라고, 정신승리를 해 보았다.\n하지만 그의 양심이 발목을 잡았다.\n그래. 이건 자신의 잘못이다.\n그리고 자신이 지도자로 있는 한, 이 상황을 멈출 수는 없으리라고, 그는 확신했다.\n하지만 저들에게 정권을 넘길 수는 없다. 그렇게 된다면, 마사리크의 유산은 무너시게 될 것이다.\n마사리크의 유산을 지키며 이 상황을 타개할 이들...\n아."
 ABY_descision_focus_event.12.a:0 "단 하나 있었다."

 ABY_descision_focus_event.13.t:0 "국가를 위한 연기"
 ABY_descision_focus_event.13.d:0 ""전권... 나와 정부의 전권을 넘기겠네."\n"제발, 나를 어떻게 해도 좋으니 연방을 지켜주게..."\n\n"하, 이제 와서 이런다고, 베네시 씨?"\n\n"선배, 지금은 싸울 때가 아니야."\n\n"저 뻔뻔한 사람이 다 망쳐놓은걸 우리보고 수습하라는 거잖아! 자기는 쏙 빠지고!"\n\n"미안하... 아니 사죄드리겠습니다. 제 능력을 맹신하여 이런 결과가 나오게 된 죄, 달게 받겠습니다. 하지만 부디, 제 제안을 들어주십시오."\n\n"또, 또 무슨 소리를..."\n\n"선배."\n\n"...그래, 한 번 들어나 보자."\n\n베네시의 제안을 한 줄로 요약하자면 정치적 쿠데타였다. 자신이 국가를 좀먹는 기회주의자들과 함께 몰락한 다음 아비도스, 특히 아야네가 자신을 탄핵하고 대통령이 되어 유화책을 펼치자는 제안.\n\n"그러니까 결국 아야네보고 악역을 맡으라는 거잖아!"\n\n"...예, 그렇습니다."\n베네시는 입술을 꽉 깨물었다.\n\n"아야네, 이자식의 말은 들을 필요도 없어. 이건..."\n\n"받아들일게요."\n\n"...어째서야?"\n"이 나라랑 우리가 무슨 상관이 있다고! 우린 아비도스만 지키면..."\n\n"선생님과 약속했어."\n"이 나라가 아비도스의 이름을 쓰는 날이 오면, 아비도스계 키보토스인만이 아비도스인이 아니라고... 체코, 오스트리아, 백귀야행, 산해경... 아비도스의 안에 사는 모든 이들이 아비도스인이라고."\n"우리는 아비도스를 지키는 거야. 우리는 늘 하던 일을 하는거야.""
 ABY_descision_focus_event.13.a:0 "아비도스를 위해서는 악역도 맡아야 해."

 ABY_descision_focus_event.14.t:0 "연방의 아침"
 ABY_descision_focus_event.14.d:0 ""아, 아. 안녕하십니까. 2대 연방대통령 오쿠소라 아야네 인사드립니다."\n"초대 대통령 에드바르트 베네시의 계엄 시도로 인하여 지난 밤 불편을 드린 점 대신 사과드립니다."\n"전해들으셨겠으나, 다시 한 번 공지드립니다. 저희 아비도스 신정부는 내란을 획책하고 민주주의 질서를 파괴하려 한 베네시 내각을 탄핵하고 베네시 내각의 불필요하고 과도한 행정명령을 철회했습니다."\n"철회 내역은 다음과 같습니다. 키보토스인 강제 퇴거 명령, 참정권 박탈,..."\n\n훗날 "연방의 가장 긴 밤"으로 불릴 사건이 끝난 후 새로 출범한 아야네 내각의 첫 방송이었다.\n비록 무장해제 행정명령과 같은 일부 주요 명령은 철회되지 않았고, 키보토스인에 대한 추가 과세 조항은 완화된 수준으로 그쳤으나, 대다수의 남키보토스인들에게 그간 외부에서 주로 체코 임시정부의 괴뢰조직 격으로 치부되던 아비도스의 집권은 키보토스인의 혁명으로 비추어졌고, "남키보토스 연합전선"이 와해되는 결과를 낳았다. \n일부 식견 있는 자나 극렬분자들은 아비도스와 체코 임시정부가 한편이었음을 꿰뚫어 보고 극렬히 저항했으나, 그들의 저항은 남키보토스인들의 외면 아래 서서히 사라져갔다.\n\n의외로 베네시가 우려했던 현지인의 극렬한 저항은 일어나지 않았다. 그것이 아비도스는 자신들을 압제하지 않을거라는 믿음이었을지, 그저 키보토스인의 재집권에 자포자기한 것일지는 모르겠으나, 아무튼 좋은 일이었다."
 ABY_descision_focus_event.14.a:0 "연방의 아침 해는 밝게 떠올랐다."

 ABY_descision_focus_event.15.t:0 "자진입학"
 ABY_descision_focus_event.15.d:0 "헉...헉...\n아 씨발 좆됐네.\n며칠 굶어서 현지인 상점 좀 털려고 들어갔는데, 마침 딱 아비도스의 민병대와 마주해 버렸다.\n\n"헉, 헉... 죽어도 아비도스 같은 망한 학원에는 안들어간다."\n\n몇주 전 임시정부 영내에서 활동하는 키보토스인은 아비도스 소속이 아닐 시 백귀야행 스파이로 간주하고 체포 및 구금된다는 행정명령이 발의되었다. 행정명령이 발의됨에 따라 아비도스 내 대다수의 무소속/백귀야행 소속의 시민들은 시민권을 재발급 받았으며, 행정명령에 반발한 대규모 학생 조직은 카타카타 헬멧단을 제외하고 전부 2주 내로 토벌되었다.\n\n소녀, 나가사와 유이는 그저 아비도스가 싫었다.\n거창한 이유가 아닌, 그냥 망한 학교에 들어가기 싫었다.\n그래서 소녀는 무소속으로써 숨어다녔다... 오늘 들키기 전까지는.\n\n"아."\n\n그때 발에 무언가 걸렸고, 소녀는 그대로 넘어져 바닥을 굴렀다.\n바로 일어나 도망치려 하였으나, 결국 잡히고 말았다.\n\n"음, 나가사와 유이, 무소속, 헬멧단에 딱히 가입된 적은 없군."\n\n"저...저는 감옥에 가는 건가요?"\n\n"원칙상은 그런데... 이정도면 선처를 베풀어줄 수도 있겠네."\n\n"서, 선처요? 감사, 감사합니다!!"\n\n"이제라도 아비도스에 입학 신청서를 쓰는 조건으로."\n\n"에..?"\n"그...혹시 거절하면 어떻게 되나요..?"\n\n"그러면, 음... 너라면 헤일로 형벌부대에 배정되겠군."\n\n"네..? 네??"\n"받아들일게요! 입학할게요!!"\n\n"좋아, 아비도스에 자진입학한 걸 환영한다! 아쎄... 아니 학생!"\n\n아비도스의 학생은 반드시 군사훈련을 받고 군에 배정된다는걸 알았다면, 소녀는 다른 결정을 내렸을까? 참으로 기열같은 이야기라 할 수 있겠다."
 ABY_descision_focus_event.15.a:0 "따흐흑."

 ABY_descision_focus_event.16.t:0 "변절자"
 ABY_descision_focus_event.16.d:0 ""이, 이게 무슨..."\n\n남자의 눈 앞에는 인세의 지옥도가 펼쳐져 있었다.\n섬광과 함께 나타난 머리에 고리가 달린 이상한 사람들, 걸어다니는 동물들이 시민들을 마구 총으로 쏘고 있었다.\n아름다웠던 프라하는 순식간에 피바다로 변했다.\n\n"이 미친 놈들아! 뭐하는 짓이냐!"\n\n그는 어린 아이에게 총을 겨눈 한 여자를 밀치며 외쳤다.\n철컥.\n그의 눈앞에 총구가 드리웠다.\n탕.\n\n"으헉! 으아, 으아아!"\n남자는 비명을 지르며 잠에서 깨어났다.\n이 악몽을 벌써 며칠째 꾸고 있던가.\n\n남자, 오스카 쉰들러는 백귀야행에 협조하는 변절자 중 하나였다.\n그는 독일의 나치 정권에 협조하는 스파이로 활동하다가, 1935년 들통나 수감되었었다. 허나 대전이가 발생하며 감옥은 통제력을 잃었고, 그 역시 탈옥할 수 있었다. 그는 탈옥하며, 기필코 자신에게 치욕을 준 체코인들에게 복수하겠다 다짐했다.\n\n하지만 그는 회의감을 느꼈다.\n잠깐의 감정이었던 복수심은 날이 갈수록 약해져 갔다.\n그리고 그 빈자리를 채운 것은 백귀야행에 대한 거부감이었다.\n그저 재미로 사람들에게 총을 쏘고 수류탄을 던지던 그들에게, 쉰들러는 인륜적인 거부감을 느꼈다.\n이틀 전 그들이 체포된 어린아이와 여자들을 체코 저항군이란 이유로 광장에서 즉결처형하는 모습을 보았을 때 그는 이루 말할 수 없는 충격을 받았다.\n\n그는 그때 이후로 체코인들을 자신의 공장에 숨겨주기 시작했다.\n그것은 체코인에 대한 연민의 감정 따위가 아닌, 백귀야행에 대한 역겨움, 그 거부감에 의한 것이었다.\n\n하지만 숨겨주는데는 한계가 있었고, 그는 자신이 그들 모두를 구할 수 없는 것에 괴로워했다.\n\n"...들러."\n"쉰들러. 듣고 있나?"\n\n"아, 디트리히. 미안하군. 잠시 딴 생각을 하느라."\n\n"그래, 아무튼 어떻나? 내 사업 구상이?"\n\n이들도 자신과 같은 "변절자"들.\n많은 독일계 사업가들이 백귀야행 정부에 붙어 동포를 착취하며 호화스러운 생활을 영위했다.\n자신 또한 그런 이들 중 하나였기에, 그는 죄책감을 느꼈다.\n\n"...그래서, 요즘 정부에서 체코인 수감자들을 공급해줘서, 인건비도 안 들고 좋다니까."\n\n그들에 대해 역겹다는 생각이 들려는 찰나, 무언가 그의 머리를 스쳤다.\n그리고 그는 아주 오랜만에, 미소지을 수 있었다."
 ABY_descision_focus_event.16.a:0 ""그래, 그거 정말 좋은 생각인데?""

 ABY_descision_focus_event.17.t:0 "쉰들러 리스트"
 ABY_descision_focus_event.17.d:0 ""여기, 신청했던 수감자들이오."\n\n키보토스인 관료는 체코인 수감자들의 명단을 넘겨주며 쉰들러에게 눈짓했다.\n그러자 쉰들러는 익숙하게 소매에서 금붙이를 꺼내 그에게 내밀었다.\n\n"흠, 앞으로도 연합학원을 위해 노력해주기를 바라오."\n\n쉰들러가 깨달음을 얻고 1달 정도 지났을 무렵, 쉰들러의 공장 단지에는 수만명의 체코인이 보호받고 있었다.\n키보토스의 장비는 현재의 기술로는 완벽히 재현하는게 불가능하기에, 그의 공장에서는 다른 공장에 비해 '좀 더 많은' 불량품이 발생했으며, 근무 인원에 비해 생산량이 '다소' 부족했으나, 그의 소매에서 나온 금붙이 덕에 큰 문제는 없었다.\n\n쉰들러가 백귀야행 정부에 공장 규모에 비해 '다소' 많은 수의 수감자를 요청했기에, 원래 처형되었어야 할 저항군 포로도 그의 공장으로 인도되었다.\n\n쉰들러는 인도받은 수감자들이 공장으로 들어가는 모습을 보았다.\n어린아이와 여자들의 비율이 꽤 높았으나, 그들은 '숙련된 금속공' 이었다. 공장으로 들어가는 이들의 면면은 겉으로는 침울했으나 그 눈빛만은 희망을 찾은 듯 밝게 빛났다.\n\n그날 저녁 쉰들러가 공장을 시찰할 때, 한 노인이 그에게 다가왔다.\n노인은 그에게 선물이라며 자투리 금속으로 만든 클립 배지 하나를 건넸다.\n수감자를 굴리는 부패한 사업가인 그에게는 어쩐지 선물을 주는 체코인 수감자가 많았기에 별 의심 없이 배지를 받아들었다.\n공장 시찰을 마치고 퇴근하기 전, 그는 집무실에서 웃음을 지으며 노인이 건넨 배지를 이리저리 살펴보았다.\n\n"흠, 노인 혼자서 만들었다기엔 상당히 고급스럽군. 이거 평소에 차고 다녀도 이상하지 않겠는데?"\n\n그는 거울 앞에서 노인이 건네준 배지를 자신의 고급 양복에 차 보았다.\n\n툭.\n\n배지를 차자, 배지에서 돌돌 말린 조그만 종잇조각이 떨어졌다.\n의아하게 여기며 종이를 펼쳐보자, 전화번호와 함께 '쉰들러 리스트를 받았습니다' 라는 글귀가 적혀있었다.\n\n쉰들러는 문을 걸어잠그고 그곳에 전화를 걸었다.\n\n이윽고 전화를 받은 상대는 유창한 독일어로 말했다.\n"쉰들러 씨, 좋은 밤이네요. 리스트는 받았습니까?"\n\n쉰들러는 손을 덜덜 떨며 대답했다.\n"네. 쉰들러 리스트를 받았습니다."\n\n그러자 수화기 반대편에서 대답했다.\n"반갑습니다, 쉰들러 씨.""
 ABY_descision_focus_event.17.a:0 ""두 세계의 국가에서 연락드립니다.""

 ABY_descision_focus_event.18.t:0 "모든 것을 바쳐서"
 ABY_descision_focus_event.18.d:0 "방만했지만 자신의 공장만큼은 매일 들리던 쉰들러는 이례적으로 그날은 공장에 나오지 않았다.\n해가 중천에 떠있었지만, 쉰들러는 가만히 침대에 누워 어제의 제안을 생각할 뿐이었다.\n\n"오스트라바에서 독일계 레지스탕스의 조직을 돕고 숨겨줄 수 있겠는가, 만약 들킬 것 같다면 거절해도 좋다...라..."\n\n솔직히 들킬 거라는 생각은 별로 안들었지만 그를 망설이게 하는 것은 따로 있었다.\n'두 세계의 국가' 아비도스 임시정부는 백귀야행과 산해경에 대항하는 조직이자, 체코와 오스트리아 현지인들의 지지를 받는 조직이었다.\n그러나 쉰들러는 그들이 이길 것이라는 확신이 들지 않았다.\n그 조그만 조직이, 현지인들의 지지가 있다 한들 강력한 백귀야행과 산해경을 꺾을 수 있으리라고는 생각되지 않았다.\n그러나 한편으로는, 그가 레지스탕스 조직을 돕는다면 이길 확률이 조금이나마 늘어나지 않을까 하는 생각도 들었다.\n오만 생각이 교차하는 와중, 그는 어떠한 한 생각에 미쳤다.\n\n그는 침대에서 일어나 자신의 금고를 열어보았다.\n금고에 가득하던 금붙이는, 이제 한 줌 정도밖에 남지 않았다.\n\n"부귀영화를 누리고 싶었는데..."\n"...쓸데없는 데 붙잡혀 이룬 모든 걸 잃게 생겼구만...하하..."\n말은 그렇게 했지만, 딱히 후회는 들지 않았던 것은 어째서일까.\n결정을 내렸다.\n그는 부패한 사업가였고, 결정을 내린 이유도 그러했다.\n"흐흐... 그래 어차피 저들이 이기지 못하면 난 죽는거잖아?"\n"...만약 도와주면, 국가적인 포상을 하겠다고 했지?"\n"그래, 아직 난 늙지 않았어. 부귀영화를 누릴 기회도 많다고! 하하하!""
 ABY_descision_focus_event.18.a:0 "그는 홀가분한 표정으로 임시정부에 전화를 걸었다."

 ABY_descision_focus_event.19.t:0 "토마시 마사리크의 죽음"
 ABY_descision_focus_event.19.d:0 "똑똑.\n"아직 주무세요?"\n가정부는 문을 조심스럽게 열고 들어갔다.\n"마사리크 씨, 아직까지 자고 있으면 어떡해요. 약 먹어요..?"\n마사리크는 곤히 잠든 듯 보였으나, 가정부의 말에도 미동조차 없었다.\n가정부는 조심스레 그의 코 밑에 손을 가져다 댔다.\n\n털썩.\n"아, 아아..."\n\n보헤미아의 아버지, 철인 왕, 초대 대통령, 선생님...\n토마시 가리크 마사리크는 그날 밤, 곤히 잠든 사이에 평화롭게 세상을 떠났다."
 ABY_descision_focus_event.19.a:0 "마사리크, 우리 아버지, 당신의 아이들을 믿어주세요."

 ABY_descision_focus_event.20.t:0 "작별"
 ABY_descision_focus_event.20.d:0 "아비도스 고등학교 대책위원회 부실.\n\n이른 아침부터 아비도스 고등학교에 전화가 걸려왔다.\n"네, 아비도스 대책위원회 입니다."\n"..."\n\n툭.\n\n"아야네?! 무슨 일이야?"\n\n"선생님이... 돌아...가셨대요..."\n\n"...뭐?"\n"네..?"\n"그..그게 무슨 소리야?!"\n\n드르륵.\n\n"시, 시로코 쨩!"\n\n뛰쳐나간 시로코를 찾아 호시노와 세리카가 덩달아 뛰어나갔고, 노노미는 남아 울고 있는 아야네를 위로했다.\n\n\n임시정부 청사.\n\n따르릉.\n"예, 베네시입니다."\n\n"...뭐라고요?"\n"그럴리가... 없습니다... 그분이, 스승님이..."\n"...바로 가겠습니다."\n\n\n주데텐 독일인당 당사.\n\n"콘라트 헨라인입니다."\n\n"지금, 뭐라고, 하셨습니까?"\n"그분이... 결국 돌아가신 겁니까..."\n"지금 가도록 하겠습니다.""
 ABY_descision_focus_event.20.a:0 "부고는 순식간에 전달되었다."

 ABY_descision_focus_event.21.t:0 "보헤미아의 아버지"
 ABY_descision_focus_event.21.d:0 "본래 국장으로 치뤄져야 했을 마사리크의 장례식은 카를로비바리의 광장에서 간소하게 치뤄졌다.\n장례식 전에 미리 카를로비바리로의 이동을 차단했음에도 수만 명의 인파가 모였다.\n아이러니하게도, 보헤미아의 아버지 토마시 마사리크의 장례식에 모인 대부분의 인구는 주데텐 독일인이었다. 원체 체코계 인구가 적기도 했지만 그것은 문제되지 않았다.\n체코의 아버지라고 불렸어야 할 마사리크는 보헤미아의 아버지로 불렸다. 이는 체코인 뿐 아닌 보헤미아의 독일인들의 아버지이기도 하다는 뜻이었으며, 독일인들 역시 마사리크를 아버지와 같이 존경하고 또 진심으로 추모했다.\n\n카를로비바리의 광장에서, 그의 후계자중 하나인 오쿠소라 아야네가 먼저 짧은 추도사를 마쳤고, 주데텐 독일인당 대표 콘라트 헨라인이 이를 이었다. 그리고 그의 또 다른 후계자, 에드바르트 베네시가 마지막 추도사를 읽었다.\n\n"...마사리크는 떠난 후에도 우리 가운데 남아 있으며, 그는 우리 모두에게 모범이자 도전이었습니다. 오늘날 유럽과 세계가 절실히 필요로 하는 위대한 인간 신앙의 사례입니다. 우리에게 남겨진 것은, 작금의 전무후무한 유럽의 위기 상황에서, 키보토스와 유럽이 선의와 우의를 구축하게끔 하는 과제입니다. 그러면 우리는 1936년 이후 유럽에서 가장 완벽하고 조화로우며 사회적으로, 국가적으로, 정치적으로 정의로운 완전히 새로운 국가를 창조할 수 있을 것입니다. 이는 우리의 생존과 미래를 위해 반드시 만들어야 할 국가이며, 모든 유럽과 키보토스의 국가들에게 마사리크가 우리 사이에서 보였던 것과 같고, 마사리크가 전 세계에 보였던 것과 같은 그의 유산을 지키기 위한 존재가 될 것입니다..."\n"...해방자 대통령이시여, 우리는 당신의 길을 따라 다시 한 번 고향을 해방하고, 우리 손에 물려주신 유산에 충실할 것입니다!"\n\n베네시가 추도사를 마무리하자, 가장 오래된 체코와 유럽의 성가인 성 바츨라프 성가가 울려퍼졌다.\n\n이후 마차가 그의 시신을 싣고 광장을 벗어나 언덕을 따라 올라갔다. 이때 관을 7명의 병사가 호위했는데, 이는 연방을 이루는(혹은 이룰 예정인) 7민족을 상징하는 것이었다.\n\n마차는 임시정부 청사에 멈추어 섰으며, 뒤뜰에 안치되었다.\n원래 그는 그의 가족이 묻힌 라니에 안치되어야 했으나, 마사리크는 생전 '...내 죽은 몸을 위해 많은 노력을 쏟지 말라... ...아무나 찾아올 수 있는 곳에 묻고 옮기지 말라...' 라는 말을 남겼다고 전해진다.\n\n그리고 살아남은 자들은, 그의 유산을 지키기 위하여, 고향을 해방하기 위하여, 키보토스와 유럽의 신뢰와 우애를 위하여 나아갈 것이다."
 ABY_descision_focus_event.21.a:0 "우리는 충실할 것이다.\n진실은 승리한다."

 ABY_descision_focus_event.22.t:0 "주데텐란트, 우리 주데텐란트"
 ABY_descision_focus_event.22.d:0 "주데텐란트의 독일인들을 대변한 독일계 장관 루트비히 체흐.\n그는 도피 중 눈먼 탄환에 맞고 죽을 고비를 여러 번 넘겼다.\n비록 몰락했다는 아비도스였지만 전이된 자치구 내에 작은 병원이 존재했고, 체흐는 긴급 수술을 받아 살아남을 수 있었다.\n하지만 늦은 치료로 인해 발생한 합병증은 그의 건강을 크게 해쳤고, 1937년 3월, 그는 운명을 달리했다.\n\n그리고 그의 사후, 새로이 주데텐 독일인들의 대변자이자 삼두정의 일원이 된 이는 주데텐 독일인당의 당수, 콘라트 헨라인이었다.\n\n"어쩌다 이렇게..."\n\n헨라인은 때때로 헨라인주의로 불리는 주데텐 민족주의의 창시자였고, 그가 이끄는 주데텐란트는 점차 체코슬로바키아 내 자치권이라는 최종적 목표에 다다르고 있었다...\n하지만 대전이라는 사태는 그를 국가의(독일인들의) 지도자로 단숨에 올려놓았고, 연방의 선전으로 오스트리아의 독일인들마저 그를 오스트리아계 독일인들의 구원자로 여기게 되었다.\n\n"그, 그래, 콧수염쟁이한테나 선동당하는 프로이센 촌놈들보다야 오스트리아가 났지..."\n"아씨... 하... 나는 그냥 평범한 주데텐인이라고! 왜 나한테 그렇게 기대하는거야!"\n"마사리크 씨, 이럴 떄 당신은 어떻게 하실 겁니까..."\n\n마사리크의 제자이자 후임자인 베네시가 그와의 대화와 타협을 거부할 때마다, 그는 자연스레 베네시의 스승인 마사리크 역시 비슷할거라고 지레짐작했다.\n하지만 그가 직접 만난 마사리크는 전혀 달랐다.\n그는 주데텐 독일인들을 이방인으로 보았을지언정 포용과 대화의 대상으로 보았지 베네시마냥 침략자로 보지 않았다.\n\n"그래서 왜 베네시를 내버려 뒀느냐 했더니 그게 민주주의라고? 허 참..."\n"그분이 민주주의자인게 참 아쉽구만. 그것만 아니었으면 당장 스승으로 모셨을 텐데 말이야. 하하..."\n"민주주의는, 참 비효율적이란 말이지. 베네시 같은 스승 말조차 무시하는 썩은 암덩어리는 당장 잘라내야 하는데 말이야."\n\n그는 올라온 보고서에 적힌 이름을 보고 얼굴을 찡그리며 말했다.\n\n"...그리고 이 자식같은 암덩어리도.""
 ABY_descision_focus_event.22.a:0 "카를 헤르만 프랑크."

 ABY_descision_focus_event.23.t:0 "주데텐 헨라인당"
 ABY_descision_focus_event.23.d:0 "그저 신생 체코슬로바키아 공화국에서 주데텐 독일인들의 지도자로써 자치권이나 얻을 생각이었던 헨라인의 계획은 1935년부터 어그러지기 시작했다.\n물론 민주주의를 비난하고, 실제로 민주주의라는 체제를 그리 좋아하지 않기도 했지만, 그보다 '보헤미아의 상병' 나부랭이가 부르짖는 '대독일주의' 따위보다야 훨씬 나은 것이라고 생각했다.\n나치당의 집권 이후, 오스트리아에서 국가사회주의 운동이 정권을 위협한 데 반해 주데텐란트가 상대적으로 조용했던 이유도 이곳에 있었다.\n\n"그 망할 프랑크와 칫솔수염이 방해만 안했다면 말이야..."\n\n나치당의 독일에 대항해 헨라인은 별로 좋아하지 않던 민주주의에 대한 찬양을 하고 나치를 비난하며 당내 핵심인물들을 독일이 아닌 헨라인 개인에게 충성하게끔 했다.\n그리고 대전이가 일어나기 얼마 전 그의 충실한 당원, 카를 헤르만 프랑크가 그를 프라하 근교의 소도시로 불렀다.\n\n"프랑크, 네가 날 따로 부르기는 처음이군. 고발할 것이 있다고?"\n\n"아, 안녕하십니까. 당수님."\n"다름이 아니고, 부패의 흔적이 보여서 말입니다."\n\n"부패라! 당연히 척결해야 할 것이지! 잘 해주었다, 프랑크."\n\n"하하, 감사합니다. 그래서 말입니다... 이 부패 건에 대해서 설명해 드릴까요?"\n\n하지만 예상과 달리 그의 말이 이어질수록 헨라인은 창백해졌다.\n\n"...그래서, 독일 영사관에서 유입된 거의 15000라이히스마르크에 달하는 거금이, 어디로 사라진 건지 모르겠군요. 그렇게 국가사회주의를 싫어하시는 당수님이 그 돈을 사용했을리는 없잖습니까?"\n\n물론 독일로부터 돈을 받아먹기는 했다. 거하게 뒤통수를 쳐 그걸 반나치 활동에 사용하긴 했지만...\n프랑크가 그들의 끄나풀이라고는 생각치 못했다. 그래서 그에게도 자금의 이용을 알렸는데...\n\n"같잖은 위선 떨지 말고. 뭘 말하고 싶은거냐, 프랑크."\n\n프랑크는 대답 대신 권총을 꺼내들었다.\n\n"이게 무슨..."\n\n"아아, 당수님. 독일인이라면, 마땅히 하나된 대독일의 품에서 함께 번영을 누려야 하지 않겠습니까?"\n\n"개소리들 말이..."\n\n끼릭.\n"앞으로 한 마디 하실때마다, 제 손가락이 조금씩 움직일 겁니다."\n"그러니까 앞으로는 내 말에 예 아니오로만 대답한다 헨라인, 알겠나?"\n\n"...예."\n\n그는 주데텐 독일인당을 움직여 나치 독일과의 합병을 찬성하는 여론을 만들라고 지시했다.\n눈앞에 총구가 겨누어진 상황에서, 헨라인은 알겠다고 대답할 수밖에 없었다.\n\n하지만 지금, 상황이 바뀌었다.\n\n"노이만, 슈벤하르트... 허, 다들 내 앞에서는 갖은 아양은 다 떨더니만, 이런 깜찍한 파티를 준비중이었군."\n\n그날 이후 헨라인은 그의 수족을 움직여 당내 나치에 동조하는 이들을 식별했고, 이제 그들을 일망타진 할 수 있게 되었다."
 ABY_descision_focus_event.23.a:0 ""빠르게 움직여야지, 그자식이 알아채기 전에.""

 ABY_descision_focus_event.24.t:0 "제작중"
 ABY_descision_focus_event.24.d:0 ""
 ABY_descision_focus_event.24.a:0 ""

 ABY_descision_focus_event.25.t:0 "기업과 정부"
 ABY_descision_focus_event.25.d:0 ""...이것으로 협약이 체결되었습니다."\n"내용은 다음과 같습니다."\n"첫째, 네프티스 그룹 사유지의 통제권을 임시정부로 이관한다."\n"둘째, 연방정부는 체코와 오스트리아의 산업 시설 중 일정한 비율을 네프티스에 양도하며..."\n\n"잘 되었네요! 마사리크 씨!"\n\n"예. 임시정부 대변인으로써 감사를 표합니다, 노노미 씨."\n\n두 사람이 손을 맞잡으며 공식적으로 네프티스 그룹의 사유지가 임시정부에 귀속되었다.\n그리고 협상의 주역인 두 사람은 함께 차를 타고 임시정부로 복귀 중이었다.\n\n"너~무 힘들었다고요? 선생님!"\n\n"허허, 그래도 이젠 엄연히 한 기업의 총수 아닙니까, 노노미 양. 이사회가 운영을 주도한다고는 하지만 큰 행사에는 이제 자주 참석하셔야 할 건데, 벌써부터 이러면 안되죠."\n\n"으으...미리 결과를 정해 놓고 하는것도 이렇게 힘든데, 실제 협상은 얼마나 힘들지 모르겠어요..."\n\n"노노미 양에게 좋은 소식 하나 말해주자면, 의외로 대부분의 협상은 실무진이 미리 하고 이런 식으로 결과를 정해 놓는 경우가 많답니다. 이건 제 정치경험에서 나온 결과이니 경제에서는 조금 다를 지도 모르겠지만, 경제와 정치는 비슷하니 참고할 만 할겁니다."\n\n"그래도 불안하네요... 돌발상황이라도 발생하면..."\n\n"음, 그렇다면 노노미 양의 불안감을 덜어주기 위해 오늘 특별 과외나 한 번 해볼까요? 마침 시간이 남으니, 여러 상황에 대한 대처법을 배워보는 것 어떨까요?"\n\n"음... 쉬고 싶지만 이런 기회는 자주 없으니까요~ 네!"\n\n"껄껄, 길게 안 하겠습니다. 일상에서도 일어날 수 있는 일 위주로 알아보도록 해요.""
 ABY_descision_focus_event.25.a:0 ""네! 선생님!""

 ABY_descision_focus_event.26.t:0 "분리된 통합"
 ABY_descision_focus_event.26.d:0 ""자치구 내 경찰력이 좀 더 필요하겠구만~"\n\n"예, 청장님."\n호시노는 몸을 돌려 나가려던 비서를 불러세웠다.\n\n"아, 조건은 이전이랑 같게 해줘. 군에서 차출하지 말고 민간에서 뽑고, 인구비에 맞춰서, 알지~?"\n\n"예, 압니다."\n\n"으헤, 너무 딱딱하다구~ 그러면 이 아저씨는 슬프다구?"\n\n"일이니까요, 청장님."\n그러면서도 비서는 옅은 미소를 지으며 말했다.\n"그래도, 열심히 하고 계십니다. 늘 감사합니다."\n\n"으헤, 그래!"\n\n비서가 방을 나가고, 아비도스 자치구청장, 타카나시 호시노는 서류작업을 계속했다.\n\n마사리크, 선생님이 찾아온 이후, 호시노는 행정부터 육체노동까지 여러 가지 일을 하다가 아비도스 자치구 재편성에서 공을 세워 아비도스 자치구청장이 되었다.\n\n그녀는 산업지구를 지역정부에 귀속시키고 자치구가 전이한 카를로비바리 시를 아비도스 자치구 산하로 통합시켰다.\n공장단지를 기피하는 키보토스인과 공장단지를 선호하는 현지인 사이에 이루어낸 타협이자 좋은 결과물이었다.\n\n아직 임시정부 행정명령 111호는 유효하지만, 호시노에겐 생각이 있었다.\n'지금 통합의 선례를 만들어두지 않는다면 이 연방은 오래 버티지 못한다.'\n\n그러한 생각을 가지고, 그녀는 아비도스 자치구를 통합의 상징으로 만들기 위해 노력했다. 헌병이 아닌 경찰이 활동하는건 자치구가 유일했으며, 경찰은 키보토스인과 현지인이 2인 1조로 다녔다.\n이러한 노력은 두 세계의 공존이라는 성과를 거두었지만, 근본적으로 다른 두 세계의 통합이라는 과제는 지지부진했다.\n\n하지만 호시노는 키보토스인과 현지인의 혼인 허용 요구에 대한 행정소송 문서를 보며 희망을 다졌다."
 ABY_descision_focus_event.26.a:0 ""이렇게 또 다른 날이 시작되는구만.""

 ABY_descision_focus_event.27.t:0 "되찾은 통제"
 ABY_descision_focus_event.27.d:0 ""상황은 어때?"\n\n"에겔란트 A, B, D 구역은 마무리 되었으며, C 구역에 132명 규모의 게릴라가 목조 요새를 축성하고 농성하고 있습니다. 아마 박격포 화력을 조금만 더 충원한다면 금방 함락될 것입니다."\n\n"음... 아마 힘들 거야. 헬멧단의 목조 요새는 개인화기나 박격포 정도로 뚫을 수 없어."\n\n"예? 어떻게 그런..."\n\n"응. 내가 저들과 여러 번 싸워 봤으니까. 그리고 현장에서 보고 오기도 했어. 저 요새는 보기보다 튼튼해."\n"그러니까 공격드론을 집중 투입해야 할거야."\n\n"예! 알겠습니다 사령관님!"\n\n막사의 문을 열고 전령이 들어왔다.\n"사령부로부터 진언이 도착했습니다."\n\n'군기 유지 명령. 토마시 가리크 마사리크 전 대통령께서 비밀리에 에겔란트 헌병사령부로 향하는 중임을 확인함.'\n\n내용을 확인한 시로코의 부관은 마이크를 켜고 안내방송을 했다.\n"사령부 내 인원들 모두 군복 단정히 입고 연병장에 집합 바란다. 아버지께서 오신다. 아버지께서 오신다. 이상."\n\n...\n\n"응, 선생님이 와줘서 좋아. 근데..."\n시로코는 연병장을 바라보며 말했다.\n"...그래도 뭐라도 한 마디 해주면 안될까? 저 사람들 모아놓고 그냥 해산하라 하면..."\n\n"껄껄, 시로코 양이 한가한 나를 위해 일을 만들어 주는군요."\n\n"아...아니! 그런게 아니고..."\n\n"싫다는 게 아닙니다. 오랜만에 연설 한 번 해보는 것도 좋지요."\n"따로 준비한 것도 없으니 길게는 못 하겠지만, 그 편이 저 병사들에게는 더 좋겠지요."\n\n마사리크는 자리에서 일어나며 말했다.\n"자, 그렇다면 어서 갑시다, 시로코 양. 병사들도 빨리 실내로 들어가고 싶을 테니 말이에요.""
 ABY_descision_focus_event.27.a:0 ""네, 선생님.""

 ABY_descision_focus_event.28.t:0 "실전 학습"
 ABY_descision_focus_event.28.d:0 ""새로운 명칭을 만드는 것은 비용도 많이 들고 어느 쪽도 동의하지 않을 겁니다. 우스티냐 아우시히냐. 확실히 정합시다."\n"아니 그러니까 어차피 같은 거라니까요? 아우시히나 우스티나 어차피 자기들 알아서 부르게 되어 있어요!"\n"애초에 우스티가 옛 체코어에서 나온 말이고, 그걸 독일어로 읽은게 아우시히인데 원본인 우스티를 써야지!"\n"엘베냐 라베냐에서 양보했으니 우스티 정도는 남겨둬야지! 날강도들아!"\n"우리 주데텐 독일인들이 사는 도시에 체코어 이름을 붙이는게 말이 돼? 말이 돼 안돼 임마!"\n\n회의가 과열될 조짐이 보이자 아야네는 정숙을 외치고 15분 휴회를 선언했다.\n\n단상에서 내려온 아야네를 마사리크가 맞이했다.\n\n"고생이군요, 아야네 양."\n\n"이번에는 잘 한거 같나요, 선생님?"\n\n"음, 확실히 점점 늘어가는게 보입니다. 하지만..."\n\n마사리크가 문제점을 지목해 주고 나서 회의는 다시 열렸고, 몇 번의 휴회와 개회를 더 반복하고 나서야 장장 10시간에 걸친 회의는 끝이 날 수 있었다.\n저녁이 되어서야 그들은 집에 갈 수 있었고, 마사리크와 아야네는 근처의 낡은 식당에서 쿨라이다(kulajda)를 먹으며 이야기를 나누었다.\n\n"...근데, 저 궁금한 게 있어요."\n\n"뭔가요, 아야네 양?"\n\n"많은 키보토스인중에 저를 선택한 이유는 지난번에 말해주셔서 이해했지만, 선생님께는 베네시 씨라는 똑똑한 제자가 있는데 왜 저를 제자로 키우시는지 궁금하네요."\n\n"음, 베네시만큼 똑똑하고 좋은 정치가가 또 없죠. 하지만 동시에 융통성이 부족하고, 조금 급진적인 성향이 있어서 다민족 연방에는 어울리지 않는 면이 있어요."\n"결국, 이를 보완해줄 정치적 파트너가 필요했어요. 모두를 품을 수 있고 베네시의 제동기가 되어줄 수 있는 사람. 그러면서도 정치적 잠재력이 뛰어난 사람. 저는 그 사람으로 아야네 양을 선택한 거에요."\n\n"아..."\n\n"언젠가... 제가 왔던 곳으로 돌아가게 된다면, 부디 베네시가 잘못된 선택을 하지 않도록 도와주세요.""
 ABY_descision_focus_event.28.a:0 ""...네. 선생님의 유산을 지킬게요.""

 ABY_descision_focus_event.29.t:0 "심모원려"
 ABY_descision_focus_event.29.d:0 "“후우... 역시 서류작업은 어려워...”\n\n서류에서 잠시 눈을 뗀 세리카는 기지개를 쭉 폈다.\n대전이가 발생한 지도 꽤 지난 지금, 세리카는 '이남8주위원회' 설립 업무를 맡고 있었다. 선생님과 아야네의 도움으로 지금은 서류 작업에도 어느 정도 요령이 생겼지만, 여전히 일은 많고, 익숙하지 않았다.\n\n“역시 나는 서류하고는 맞지 않는지도 몰라...”\n“아닙니다, 세리카 양. 세리카 양은 최선을 다해주고 있어요.”\n“엣, 선생님!?”\n\n어느새 마사리크가 문 앞에 서 있었다.\n\n“내무부 차관이라는 중책을 맡고 지금까지 큰 문제 없이 잘 해준 것 만으로도 세리카 양은 충분히 능력이 있어요.”\n\n“그렇지만 내가 스스로 알아챌 수 있는 건 자그마한 정도의 누락이라던가, 대놓고 과장된 내용 정도뿐인데...”\n\n“허허, 원래 작은 발전이 하나하나 모여서 더욱 성장하는 법이죠.”\n\n마사리크의 위로에도 세리카는 고민이 풀리지 않은 표정이었다.\n\n“흠, 뭔가 고민이 있는 표정이군요. 말해 줄 수 있겠나요?”\n\n마사리크의 말을 들은 세리카는 잠시 주저하더니 대뜸 이렇게 물었다.\n\n“만약 선생님께 물어볼 수 없는 상황에서 중요한 선택을 해야 한다면, 나는 어떻게 해야 할까?”\n\n마사리크는 조금 놀랐지만, 일단 세리카의 말을 경청했다.\n\n“요즘 들어서, 어떤 상황이 벌어져도 이상하지 않다는 생각이 들거든. 최악의 경우에 내가 모두를 책임져야 할 상황이 올 수도 있다는 생각도. 선생님이 도와준 덕분에 이제 나도 무조건 속지는 않지만, 그런 상황이 당장 닥친다면, 그리고 그 상황에서 조언해 줄 사람이 없다면 나는 잘못된 선택을 하고 말 거야. 그러니까 선생님, 만약을 대비해서... 내가 어떻게 해야 할지 알려줘.”\n\n마사리크는 이미 자신의 죽음을 염두에 두고 있었기에 그에 대해서는 많은 생각이 있었으나, 세리카가 염려하는 것은 그보다 훨씬 심각한 상황인 듯했다.\n마사리크는 잠시 생각에 잠겼고, 이윽고 이렇게 조언해주었다.\n\n“세리카 양이 한 선택이 어떤 결과를 불러올지 충분히 깊게 생각해줬으면 합니다. 특히...”\n\n“그런 상황이 온다면 자신의 안전이 제일 중요하다는 점 또한 명심하고요.”"
 ABY_descision_focus_event.29.a:0 "“우리가 책임지고 있는 사람들을 생각해서 결정을 내렸으면 합니다.”"

