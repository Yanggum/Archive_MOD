 ABY_descision_focus_first_desc: "대전이 당시보다 상황이 나아졌다는 건 확실합니다, 그렇지 않나요? 우리가 어디에서, 누구와, 무엇을 해야 할 지는 명확해졌습니다. 체코인, 독일인들과의 연립정부 협상이 타결되고 행정명령을 발동해 학생회로서의 기능을 조금이나마 재건한 지금, 국가의 방향성을 정해야 합니다. 우리 국민들에게 새해 선물로 비상사태 해제를 선물할 수 없다는 건 안타까운 일입니다. 내년을 빌어 봅시다."
