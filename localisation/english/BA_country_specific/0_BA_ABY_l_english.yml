#ABY_descision_focus_abydos_15_effect: "Political Power: §G+1500§!\nBase Stability Gain: §G+50.00%§!\nArrests §YEdvard Beneš§! in §Y[ABY.GetNameWithFlag]§!\n§YOkusora Ayane§! becomes the leader of the §YDemocratic§! party.\n    §YFederal President§!\n      - Political Power Gain: §G+15%§!\n      - Stability: §G+10.00%§!\n      - Stability Modifier from Party Popularity: §G+20.00%§!\n      - Ideology Drift Defense: §G+25.0%§!\n      - Daily Democratic Support: §G+0.15§!\n\n(§Y[9.GetName]§!, §Y[75.GetName]§!, §Y[72.GetName]§!, and §Y9§!):\n    The state is now a core state of §Y[ABY.GetName]§!.\n    Adds §YKivotosian Discontent§! granting the following effects:\nLocal Available Resources: §R-60%§!\nLocal Factories: §R-60%§!\nRecruitable Population: §R-60%§!"
