 ABY_descision_focus_event.94.t:0 "Key to the Golden Shackles"
 ABY_descision_focus_event.94.d:0 "The night in Prague was vibrating with the blood smell of 'purges' triggered by Suou. She was mercilessly removing Nazi remnants and hardline Nephthys directors who didn't want to share her power under the name "Rooting out corruption." But there was also something Suou overlooked. That the physiology of money is more persistent than cockroaches.\n\nAn encrypted communication came to Nonomi, who was under house arrest. The senders were 'moderate' directors of the European branch of the Nephthys Group. Of course, the fact they were 'moderate' was merely because they were less violent than the hardliners, and their gaze viewing Nonomi as the family's puppet was the same.\n\n"Young lady, that crazy woman Suou is trying to nationalize our group's assets. The hardline old men have already been removed. Next is us, and you, young lady."\n\nNonomi grabbed the receiver with a trembling hand. Suou is holding her Task Force friends as hostages. The only things that could turn this situation around were, ironically, the financial power and private soldiers (PMC) of Nephthys, which she wanted to escape so much.\n\n"What is... the condition?"\n\n"It's simple. When we backstab Suou, please grant legitimacy in the name of Nephthys. For the reconstruction of the group."\n\nNonomi closed her eyes. This was joining hands with another devil to drive out one devil. But as long as she could save her friends, her own soul didn't matter."
 ABY_descision_focus_event.94.a:0 ""Good... I'll accept that proposal. Instead, please surely guarantee my friends' safety.""
 ABY_descision_focus_event.94.b:0 ""Good... I'll accept that proposal. Instead, please surely guarantee my friends' safety.""

 ABY_descision_focus_event.95.t:0 "The Jaws of Steel"
 ABY_descision_focus_event.95.d:0 "At 3 a.m., gunshots echoed in downtown Prague. PMC mercenaries hired by the moderate directors raided major government offices. Their plan was to arrest Suou in a flash. However, the office they stormed was empty.\n\n"Did the information leak?"\n\nOver the radio of the flustered mercenary captain, Suou's cold voice was heard.\n\n"Businessmen are no good. Because they calculate profit, they miss the timing to pull the trigger."\n\nIt was a trap. Suou had already detected the movement of the moderates and inversely trapped them in a siege. 매복해 있던 기갑부대가 용병들을 짓밟았고, 스오우의 친위대는 네프티스 임시 본부를 타격했다.\n\nAs day broke, Suou stood before the broadcast cameras in a blood-stained military uniform.\n\n"Respected citizens, today we witnessed an ugly rebellion by capitalists who threaten democracy. The Nephthys Group attempted to overthrow the nation. Accordingly, I exercise emergency powers, confiscate all assets of the Nephthys Group, and define them as enemies of the state."\n\nThe failure of the counter-coup gave Suou wings. She gained the perfect justification for 'striking the internal enemy' and began a blood-drenched great purge without needing to heed anyone's gaze. In the streets, Nephthys associates and opposition figures were dragged out one after another, and fear dominated the city."
 ABY_descision_focus_event.95.a:0 "A greedy predation has begun."

 ABY_descision_focus_event.96.t:0 "Silence of the Desert"
 ABY_descision_focus_event.96.d:0 "For Suou, who held the assets and military factories of Nephthys in her hands, there was nothing more to stop her. She now decided to handle the 'last variable' that was most bothersome.\n\nThe deepest part of the underground dungeon. Suou looked down at the cell with cold eyes. There were her old colleagues. Hoshino, Shiroko, Ayane, Nonomi... they didn't lose their gaze of resistance until the end.\n\n"It's a shame. I wanted to keep you alive, but you're too dangerous. If left alive, you'll surely aim for my neck someday."\n\n"Suou! Do you think you'll be safe after this?" Hoshino shouted, but Suou didn't listen.\n\n"Become fertilizer for the nation."\n\nWith her hand gesture, gunshots echoed. Once, twice, and then silence. The pillars that supported Abydos crumbled in vain. Suou turned away with an emotionless face. But returning to her office, she frowned looking at a report.\n\n"Serika Kuromi... is her whereabouts still unknown?"\n\nSerika's whereabouts, who was not at the scene at the time of arrest, were unknown. There was no body, no witness. An uneasy shadow fell over the perfect victory. Only one survived."
 ABY_descision_focus_event.96.a:0 "That small spark scratched Suou's nerves."

 ABY_descision_focus_event.97.t:0 "Broken Fang"
 ABY_descision_focus_event.97.d:0 "Ominous rumors began to spread from the remote mountains. It was that a resistance group called the 'Sekhmet Gang' was ambushing government supply routes. At their center was the cat of revenge, Serika Kuromi.\n\nSerika returned from hell. She rallied the remnants of Hyakkiyako's Hyakkayora and Shanhaijing's Genryu Commercial Association, who were former enemies.\n\n"Revenge for my seniors... I will surely achieve it!"\n\nSerika's anger was fierce. The Sekhmet Gang bothered Suou's army with surprise guerrilla warfare, and once liberated a small local city. However, they were insufficient before the overwhelming firepower of the regular army. Suou no longer showed mercy.\n\n"Fire is best for catching rats."\n\nSuou ordered a massive bombardment on the valley identified as the final base of the Sekhmet Gang. Hundreds of shells and incendiary bombs were poured, and the valley was engulfed in hellfire. A few days later, the search party discovered a red hairpin, burned, and part of a damaged body estimated to be Serika's amidst the ashes.\n\nUpon receiving the report, Suou only then opened champagne.\n\n"With this, all variables have disappeared."\n\nSerika's death meant the end of resistance."
 ABY_descision_focus_event.97.a:0 "...Perhaps."

 ABY_descision_focus_event.98.t:0 "Age of Enlightenment"
 ABY_descision_focus_event.98.d:0 "Abydos where all political rivals and threats have vanished... no, the South Kivotos Enlightenment Military Government. Suou defined herself as a more transcendental being rather than a President or a Prime Minister. She stood on the platform of the central square and looked down at the hundreds of thousands of people.\n\n"We have ended the era of chaos and division! Weak democracy, corrupt capitalism, and foreign interference have sickened us. Now we must be born again!"\n\nShe proclaimed the 'Enlightenment Revolution.' It was a totalitarian system where the state controls and leads everything of the individual. The parliament was disbanded, and its place was taken by 'Kivotos of Truth - For Enlightenment' which blindly follows Suou.\n\n"I will become the Leader who leads the whole Kivotos and this land, and I will guide you to the path of great prosperity. Follow me. Only I am the answer."\n\nThe crowd filling the square, out of fear or being brainwashed, chanted her name.\n\n"Suou! Suou! Long live the Leader!"\n\nOn that day, free Abydos died."
 ABY_descision_focus_event.98.a:0 "Only 'Suou's Empire' remained."

 ABY_descision_focus_event.99.t:0 "The Rusted Crown"
 ABY_descision_focus_event.99.d:0 "The balcony of the Prague residence. Nonomi looked down at the citizens pouring into the streets and cheering. Suou was arrested, and her 친위대 was disarmed. Superficially, it was the victory of democracy and the realization of justice.\n\nBut Nonomi's expression was dark. Behind her stood the moderate directors of the Nephthys Group. Rather than the joy of victory, they were busy reviewing the account books for reclaimed assets.\n\n"Congratulations, young lady. No, I should call you a hero."\n\nOne director said while tapping a calculator.\n\n"The factories Suou nationalized, we've already started the procedure to return them to our name. And... the bill for the expenses incurred for this 'support' will also be organized soon."\n\nNonomi smirked bitterly. The tyrant Suou had vanished, but the place was taken by greedy merchants. They didn't spill blood, and used Nonomi as a figurehead to swallow the nation whole.\n\n"Friends are... safe, right?"\n\n"Of course. They are receiving the best treatment in the hospital. Although they'll need 'recuperation' for the time being."\n\nThose words were a metaphor for holding them as hostages for the time being. Nonomi tightly gripped her fist. The age of violence ended, but the age of capital arrived. And that was as suffocating as Suou's dictatorship."
 ABY_descision_focus_event.99.a:0 "A dictatorship that drove out a dictatorship."

 ABY_descision_focus_event.100.t:0 "Marionette President"
 ABY_descision_focus_event.100.d:0 "After the collapse of the Suou regime, the interim government rapidly regained stability. At its center was the vast financial power of the Nephthys Group. And the coming general election. The board summoned Nonomi.\n\n"Hand over the chairperson position to a professional manager. Young lady, no, candidate, you should move on to a bigger stage."\n\nThey demanded Nonomi run for President. There was no right to refuse. The election manifesto they presented was terrible. Major relaxation of labor laws, abolition of corporate tax, removal of corporate regulations... It was content that effectively made the nation a private property of the corporation.\n\n"This is... too much. The lives of citizens will crumble." Nonomi rebelled, but the directors laughed coldly.\n\n"Did we ask to outlaw labor unions, or to eliminate the minimum wage? This level is a measure needed for a 'free market economy.' And don't forget. If the young lady refuses, we can find another alternative. We can't guarantee what will happen to the young lady and her friends then."\n\nUltimately Nonomi bowed her head. She had no choice but to choose the lesser evil to prevent the worst. \nThroughout the election period, Nephthys' money was sprinkled. Media packaged Nonomi as the 'Holy Woman of national salvation,' and opposing candidates crumbled helplessly before the power of money.\n\nThe screen of the election broadcast announced Nonomi's confirmed election. Colorful confetti flew and people cheered, but Nonomi's eyes on the platform were empty. She became President, but at the same time she was a prisoner trapped in the most luxurious prison."
 ABY_descision_focus_event.100.a:0 "The Abydos Federation was now the 'Nephthys Republic.'"

 ABY_serv_focus_event.1.t:0 "Investigation Report - Gehenna"
 ABY_serv_focus_event.1.d:0 "Overview: Traces similar to the Trinity biological experiments were discovered in a large civilian facility near the Gehenna central district. No involvement of the Pandemonium Society or the Prefect Team was seen, leading to it being considered the act of a civilian club. While no successful samples were found, significant data was acquired.\n\n1. Overall, it shows an appearance similar to the medical facilities in the Cathedral basement, but basic research environments such as hygiene are not equipped.\n\n2. Lethal doses by weight and BMI are recorded in detail. Death occurs immediately if it exceeds a certain level, and detailed figures are attached separately.\n\n3. In personal research notes, there are no signs of receiving instructions from the Pandemonium Society or the Prefect Team; rather, the Prefect Team appears to have tracked them.\n\n4. Physical abilities continuously increase when injecting Mystic below the lethal dose. At the critical point, physical abilities similar to Kivotos people are achieved, but the muscle tissue completely collapses within seconds, leading to death.\n\n5. Animal experiments were conducted by back-calculating the figures, but they did not show results comparable to the captured research data. It is considered that there will be no significant effect other than on humans.\n\nSynthesis: It appears that auxiliaries such as stabilizers are needed during Mystic injection. Animal experiments cannot show significant results, so I propose to inevitably proceed with human experiments based on current research data.\n\n26th Research Team dispatched to the central district."
 ABY_serv_focus_event.1.a:0 "Autho (Erased)\nDenied."

 ABY_serv_focus_event.2.t:0 "Investigation Report - Millennium"
 ABY_serv_focus_event.2.d:0 "Overview: Traces of large-scale Mystic injection research were discovered in the basement of a research facility belonging to the Millennium Seminar. Most data were preserved in an intact state.\n\n1. Given the scale of research data, it is estimated that at least tens of thousands were deployed. Therefore, data with more detailed figures than those found in the Gehenna region were discovered. Attached.\n\n2. Although located in a Seminar research facility, Seminar's approval or mention of them is absent in research notes and personal notes, making it impossible to confirm if Seminar was involved.\n\n3. Success in suppressing self-destructive immunity occurring during Mystic injection through blood dialysis and ingestion/injection of strong toxic drugs for about a week.\n\n4. Success in slowing down physical collapse in the same way, but research results show that the lifespan will be limited to around 5 years. \nNote: Classified as a top-secret matter.\n\n5. The test subjects are estimated to have been disposed of, and traces of planned research to prevent lifespan reduction in subsequent research can be confirmed. Research plan: Additional injection of Kivotos Mystic, ... , Fetal Mystic injection, ... omitted. Please check attached data.\nNote: Classified as a top-secret matter.\n\nSynthesis: As a result of additional calculations based on the data, it was confirmed that it is impossible to delay collapse for more than 10 years no matter how much it is slowed down.\n\nAdditional Report: Mechanical suit experiments are showing progress following the acquisition of the research data due to the strict prohibition of human experiments. However, cooperation with the military appears necessary for practical research, and authorization is needed as the disclosure of said data appears unavoidable.\n\n3rd Research Team dispatched to Millennium."
 ABY_serv_focus_event.2.a:0 "Deferred."

 ABY_serv_focus_event.3.t:0 "Ministerial Meeting Report No. 395, Chapter 86 Summary"
 ABY_serv_focus_event.3.d:0 "Debate breaks out regarding the disclosure of Millennium investigation report data.\n\nAgreed on disclosing part of the data to the public.\n\nDetailed data to be disclosed to the military, but regulated not to leak below general rank.\n\nOmitted.\nNo. 396, Chapter 3 Summary\n\nConfirmation of the "Juggernaut" project's detailed report.\nConflict of opinions due to excessive required budget.\n\nRecords deleted.\n\nFinal conclusion derived."
 ABY_serv_focus_event.3.a:0 "Juggernaut project approved."
 ABY_serv_focus_event.3.b:0 "Juggernaut project rejected."

 ABY_serv_focus_event.4.t:0 "Investigation Report - Trinity"
 ABY_serv_focus_event.4.d:0 "Overview: Investigation report regarding hundreds of corpses and medical equipment found in the basement of Trinity Cathedral.\nNote: Many records were burned or shredded before entering the Cathedral, leading to a lack of verifiable data.\n\n1. Mystic Serum, Mystic Looms, etc., were found in large quantities near the corpses.\n\n2. The cause of death is estimated to be common systemic organ failure or cardiac arrest due to somatic muscle overload and self-destructive immune activation.\n\n3. Mystic levels exceeding normal ranges were observed in all corpses.\n\n4. The content cannot be confirmed, but Tea Party orders were discovered, suggesting it was carried out under the leadership of the Trinity government.\n\n5. The timing of death generally coincides with the Trinity government's "Support for Homeless and Socially Maladjusted" period.\n\nSynthesis: It is considered to be human biological experiments of the animal Mystic injection experiments conducted at the Abydos Central Mystic Research Institute. However, since most data was destroyed, no significant results could be derived other than the fact that injecting Mystic into humans without proper measures causes deaths with reactions similar to animals. More extensive research data support is needed.\n\n37th Mystic Research Team dispatched to the Cathedral."
 ABY_serv_focus_event.4.a:0 "Authorized."

