ABY_focus_helmet_improve:0 "치안 문제 개선"
ABY_focus_helmet_improve_desc:0 "현지인들이 살던 지역의 치안은 안정되었지만, 아비도스 자치구 내에서는 카타카타 헬멧단으로 인해 치안이 갈수록 나빠지고 있습니다. 이를 빨리 해결해야 합니다."
ABY_focus_helmet_no:0 "헬멧단 분쇄"
ABY_focus_helmet_no_desc:0 "우리는 헬멧단의 지도부를 체포하는데 성공했고, 와해된 헬멧단을 잡아들이고 있습니다. 이제 그들의 처우를 결정해야 합니다."
