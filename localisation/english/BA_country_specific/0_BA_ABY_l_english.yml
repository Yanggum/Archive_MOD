 ABY_communism_event.1.t: "Winter in Prague"
 ABY_communism_event.1.d: ""Comrades, this is 'fraternal support.'"\n\nWith Klement Gottwald's cold declaration, a fabricated broadcast saying it welcomes the Soviet army's entry into Prague was flowing from the radio. It was before the heat of the revolution that drove out Suou had even cooled down.\n\nHoshino's 'Abydos Socialist Alliance' tried to walk an independent socialist line respecting diversity, but the organizational power of Gottwald and the Danube Communist Party receiving the Kremlin's order was more meticulous than expected. Major positions within the revolutionary government were already seized by communists, and when Hoshino tried to correct this, the Soviet T-34 tanks crossed the border.\n\nHoshino went out to the streets of Prague and piled barricades with the citizens and resisted. she shouted "Our socialism is different from your dictatorship" while throwing Molotov cocktails, but it was like throwing eggs at a rock before the overwhelming armored unit. Citizens fell, and Abydos students scattered or were arrested.\n\nSpring in Prague did not come. Instead, a red winter more severe than Siberia arrived. Gottwald summoned an emergency party convention and voted for the 'Federation joining the Union of Soviet Socialist Republics (USSR).' Hoshino watched that sight while handcuffed and shed tears of blood. The guilt that she pushed the country she tried to save into the bear's mouth instead of the wolf's with her own hands broke her soul."
 ABY_communism_event.1.a: "Farewell."

 ABY_communism_event.2.t: "Breaking the Red Chains"
 ABY_communism_event.2.d: "Immediately after the Suou regime collapsed, a war without gunshots was taking place within the revolutionary government. Gottwald's Communist Party receiving the Kremlin's directive blatantly forced a 'Stalinist line' on Hoshino, demanding major government positions.\n\n"Chairperson Hoshino, face reality. Without the support of the Soviet Union, this Federation won't last even a few days."\n\nBut Hoshino had already made a decision. she secretly contacted non-communist socialists, liberal forces, and Titoists of Yugoslavia in the middle of the night to build a united front.\n\nNext morning, the central committee meeting room. Hoshino stood on the platform and grabbed the microphone.\n\n"Our revolution was not for becoming someone's satellite state. The socialism of Abydos is for the freedom and dignity of the people, not for serving another dictator."\n\nshe pointed at Gottwald.\n\n"As of today, the Abydos Socialist Alliance cuts all relations with the Comintern. Also, we immediately expel the Danube Communist Party, which colluded with foreign powers to damage the purity of the revolution, from the coalition!"\n\nThe hall became a mess. Gottwald shouted "Traitor!" but was dragged out by Hoshino's security agents who were waiting in advance. That was a stone thrown by David at Goliath, and a great declaration of departure to move toward an independent nation."
 ABY_communism_event.2.a: "But it will surely not be smooth."

 ABY_communism_event.3.t: "Blood of Vienna"
 ABY_communism_event.3.d: "To collapse the Suou regime from the inside, Hoshino had to make a cruel calculation. Vienna was where the dissatisfaction toward Suou was highest, but at the same time where the surveillance was tightest.\n\nHoshino sent a directive to the underground organization members in Vienna.\n\n"Tomorrow noon, organize a large-scale protest in front of St. Stephen's Cathedral. It must be a peaceful protest. That way a justification will arise when Suou fires."\n\n"Chairperson, given Suou's personality, she will unconditionally fire. Citizens... many will die."\n\nAt the trembling voice of the organization member, Hoshino's expression did not change.\n\n"I know. But that blood is needed. The sacrifice of Vienna must become the fuse so that the whole Federation can rise."\n\nNext day, the streets of Vienna were dyed red. Suou's 친위대 sprayed machine guns at unarmed citizens. Hundreds of casualties occurred, and those horrific photos spread to all over the Federation via Hoshino's propaganda network. The citizens' anger exploded beyond control.\n\nHoshino, listening to the screams of Vienna on the radio from the hideout, clenched her fist under the desk so that her nails dug into the flesh.\n\n"Uhehe... this old-timer is going to hell. But... I won't go until I save you.""
 ABY_communism_event.3.a: "Defining herself as 'evil for the greater cause,' she wiped away the flowing tears."

 ABY_communism_event.4.t: "Wolves and Bears of the Danube"
 ABY_communism_event.4.d: "The declaration of the independent line of the Federation touched the Kremlin's raw nerve. Moscow defined Hoshino as a "traitor who colluded with fascists," and the Red Army gathered at the border. War became an unavoidable reality.\n\nHoshino appealed to all the people through a radio speech.\n\n"Citizens, as the wolf retreated, the bear arrived. They say they will give us 'liberation,' but that is just another 'leash.' We did not fight Suou to become slaves!"\n\nTo her appeal, anti-Soviet forces all over Europe responded. Tito's Yugoslav Partisans, Romanian nationalists, Western European volunteers... The ideologies were different, but a massive united front was formed under the goal of 'Stopping Soviet invasion.'\n\nHoshino inspected the front line herself. Her appearance wearing an old bulletproof vest and carrying a shotgun became the symbol of the battlefield.\n\n"Uhehe~ this old-timer is quite confident in fighting? Whether it's the Russian bear or whatever, I'll make sure those who eye our home won't even be able to pick up their bones."\n\nTrenches were dug along the Danube River, and the heterogeneous army gathered under the banner of the Federation pointed its muzzles toward the approaching red storm."
 ABY_communism_event.4.a: "People, unite under the Red Flag!"

 ABY_communism_event.5.t: "The Crossroads of the Revolution"
 ABY_communism_event.5.d: "The preparations for a general uprising to liberate the people groaning under Suou's tyranny have reached the final stage. The underground organization network has been built and weapons have been secured. However, a fierce debate is taking place within the leadership.\n\nSome claim "We must strike right now." They say Suou's surveillance network is tightening and the people's pain must be ended even a day earlier. On the other hand, the cautious ones counter "We must wait for the perfect opportunity." They say a hasty uprising might end in failure, and we must wait until we lead certain military response. Even the Communist Party within the alliance hasn't decided on a party line and is wandering.\n\nIt is the time for decision. Numerous lives and the success of the revolution depend on your single word."
 ABY_communism_event.5.a: "...I cannot delay any further."
 ABY_communism_event.5.b: "We cannot afford to spill more blood by acting hastily."

 ABY_communism_event.6.t: "Striking down like Lightning"
 ABY_communism_event.6.d: "As soon as Hoshino's command was given, the revolutionary army revolted all at once like a dam bursting. \n\n"Now is the time! Strike!"\n\nThe effect of the surprise was immense. The Suou government collapsed without even having time to respond. Major government offices and broadcasting stations were occupied in an instant, and the flustered 친위대 scattered. It was a victory like lightning.\n\nSuou was arrested while fleeing, and the red flag was hung at the Prague residence. The people poured into the streets and enjoyed liberation.\n\n"We did it! The dictator has retreated!"\n\nBut Hoshino didn't laugh. There was a shadow behind too quick a victory. Gottwald's Communist Party was trying to snatch the merit of the revolution in the confusion, and beyond the border the Soviet Union was watching this situation. The internal enemy called Suou has vanished. "
 ABY_communism_event.6.a: "But now a more arduous struggle for the new master was waiting for her."

 ABY_communism_event.7.t: "Freedom Written in Blood"
 ABY_communism_event.7.d: ""Start the operation!"\n\nWith Hoshino's shout gunshots echoed, but Suou was not an easy opponent. she already had intelligence and had deployed heavy weapons at major points.\n\nThe surprise failed. The revolutionary army entered urban combat after receiving massive damage. Prague turned into a battlefield in an instant. Although the battle line tilted to Hoshino's side as citizens joined, Suou's 친위대 resisted until the end and destroyed the city.\n\n"There is no surrender! Wipe out the traitors!" Suou's mad broadcast echoed over the burning street.\n\nAnalysts predicted that the revolutionary army's victory is certain. But it will be a 'scarred glory.' The revolution, which could have ended without spilling blood, turned into a horrific civil war due to a hasty judgment. Looking at the collapsed building debris and corpses, Hoshino bit her lip."
 ABY_communism_event.7.a: "The price of this blood was the cross that she alone had to bear."

 ABY_communism_event.8.t: "Bloodless Revolution"
 ABY_communism_event.8.d: "Hoshino waited for the time while suppressing the hardliners who were becoming impatient.\n\nshe persistently won over the inside of the military, and even bribed Suou's closest associates. And finally, the moment Suou was most off-guard, 'that day' came.\n\nThe uprising was quiet and lethal. Gunshots did not echo. When Suou opened her eyes, the revolutionary army was already standing in front of her bedroom. Her subordinates had already all held their gun muzzles reversed or joined the revolutionary army.\n\n"Checkmate, Suou."\n\nHoshino took over the government without spilling a drop of blood. Citizens only found out that the dictator had vanished after waking up in the morning. A perfect bloodless revolution. The people's government was established with all infrastructure and administrative power perfectly preserved. This will later be recorded as the 'most elegant and perfect revolution' in history books."
 ABY_descision_focus_event.8.a: "But more trials will wait for her."

 ABY_communism_event.9.t: "Request for Puppet State Control"
 ABY_communism_event.9.d: ""
 ABY_communism_event.9.a: "Consent"
 ABY_communism_event.9.b: "Refusal"

 ABY_communism_event.10.t: "Shadow of the Red Empire"
 ABY_communism_event.10.d: ""Comrades, the Danube River has now become one with the Volga River."\n\nKlement Gottwald's declaration was as cold as ice. The Communist Party, receiving an urgent directive from Moscow, proclaimed that they would reorganize the existing people's government system into the European Soviet Socialist Republic. This was not just a name change. It was a signal announcing that the Federation was right before the stage of being incorporated as a single federal constituent state of the Soviet Union.\n\nAdministrative organizations were reorganized into Moscow style, and the NKVD advisor group began to reside at the government building. The Communist Party's seizure of power now seemed like an irreversible flow.\n\nBut Hoshino caught a paradoxical opportunity while looking at the red flag outside the window from her office.\n"Uhehe... The prison bars have become thick, but gaps have also opened that much."\n\nThe massive umbrella of 'European SSR' paradoxically made border control loose. Anti-Soviet resistance forces spread all over Eastern Europe, Tito's Partisans, and Western informants began to seep into the Federation using the loophole of being 'the same Soviet zone.' Hoshino operated the socialist alliance's point organizations and contacted them. While the Communist Party was intoxicated by victory and popping champagne, Hoshino began to sharpen the sharpest blade within their shadows. "
 ABY_communism_event.10.a: "Time was the Communist Party's side, and at the same time, Hoshino's side too."

 ABY_communism_event.11.t: "Candlelight that is Not Silent"
 ABY_communism_event.11.d: "Candles began to be lit one by one in Prague's Wenceslas Square. The lights, which were dozens at first, soon increased to thousands, tens of thousands and formed a massive river of light. But their slogans were not the 'Overthrow of the Communist Party' or 'Anti-Soviet struggle' that the Communist Party had expected.\n\n"We want the promised elections!"\n"Power to the people! Transparency to the Soviet (council)!"\n"A true voice for the workers!"\n\nThis protest led by the Abydos Socialist Alliance was thoroughly held within the framework of the socialist constitution. They did not deny the system. They only demanded the rights specified in the socialist constitution, such as the resumption of elections suspended by emergency measures and the democratic operation of regional councils.\n\nDrawing up the suppression order, the Communist Party leadership was flustered. The protesters were marching while singing the Internationale with a portrait of Lenin. If these are suppressed by force, the Communist Party itself would be confessing that they are the 'enemy of the people' and 'reactionary fascists.'\n\n"Block them! Put whatever excuse!" Gottwald shouted but even the police couldn't hold batons. Before the flowers and bread handed by the protesters, the unjustified violence lost its strength. The 'anti-dictatorship peaceful protest' designed by Hoshino was slowly hollowing out the moral foundation of the Communist Party."
 ABY_communism_event.11.a: "This will become the foothold for completely hollowing out the fortress."

 ABY_communism_event.12.t: "Misguided Loyalty Competition"
 ABY_communism_event.12.d: "The socialist alliance party convention hall. The chairman of the Communist Party economic division announced a 'Agricultural Collectivization and 1st 5-year Plan' prepared with ambition. It was a radical forced collectivization policy that exactly copied the Soviet Kolkhoz system.\n\n"This is a suicidal act!"\nA representative from a farming background belonging to the socialist alliance protested by striking the platform.\n\n"Our Federation's agricultural environment is different from Russia's. In a place where small-scale independent farming is the basis, forced collectivization only brings famine and riots!"\n\nHoshino's representatives thoroughly criticized the fiction of the plan using concrete data and statistics. As the atmosphere turned ominous, even within the Communist Party, agitation arose.\n\n"Is this plan... really the directive from Moscow?"\n\nA question from a moderate Communist Party representative was the final blow. As a result of confirmation, Stalin hadn't yet instructed for full-scale collectivization in Eastern Europe. It was revealed that this reckless plan was a product of excessive loyalty promoted by Gottwald alone to look good to Stalin.\n\n"Did you try to flatter the Kremlin even while starving the comrades!"\n\nEven the Communist Party representatives, engulfed in a sense of betrayal, turned away. Ultimately, the collectivization agenda was rejected. "
 ABY_communism_event.12.a: "A distinct crack began to form in the iron-fortress-like authority of Gottwald."

 ABY_communism_event.13.t: "Socialism with a Human Face"
 ABY_communism_event.13.d: "The Communist Party's sabotage was persistent. Electricity at the citizen hall where Hoshino's speech was planned was suddenly cut off, or noise was caused by using megaphones by mobilizing government-controlled organizations. But the aspiration of the people could not be blocked.\n\nLetná Park, where tens of thousands of citizens gathered, Hoshino stood on a temporarily installed platform.\n\nMicrophone condition was not good, and there was no lighting. But her voice resonated more clearly and strongly than ever.\n\n"Everyone. What is socialism? Is it giving up freedom for bread? Is it for the individual to be sacrificed for the nation? No."\n\nHoshino looked around at the crowd.\n\n"True socialism is liberation, not oppression. A world where workers become masters, and anyone can speak their thoughts without fear. A world where one can live as a dignified human being, not as a well-fed pig. Isn't that the revolution we dreamed of?"\n\nshe took a deep breath and declared.\n\n"We are not mechanical parts. We are humans with blood and tears. Socialism with a human face, that is what we must advocate!"\n\nWaaaaah-!!\n\nThe shout shaking the park. That was an outcry toward primal freedom, going beyond the slogan of an ideology. Even the Communist Party members who had come out to monitor bowed their heads or secretly applauded. It was the victory of the most primal and powerful humanism that couldn't be countered even by the doctrine of Marxism-Leninism."
 ABY_communism_event.13.a: "Toward the pure form of the past."

 ABY_communism_event.14.t: "Treaty of Kerch"
 ABY_communism_event.14.d: "It was a long, long war. The united front led by Hoshino liberated Soviet satellite states one by one and advanced east. Poland, Hungary, Romania... the flags of liberated nations followed behind the Allied forces.\n\nBut resistance became desperate as they entered mainland Russia. Any further advance was a dangerous gamble that could cause the collapse of the Allied forces. Fortunately, the internal situation of the Soviet Union was also not good. The humanitarian support and independence guarantee promise the united front implemented in the occupied territories made the Soviet soldiers lose their fighting spirit. The rumor that "surrendering to them gains freedom" was scarier than bullets.\n\nUltimately both sides sat across from each other at the end of the Crimean Peninsula, Kerch. The Soviet delegation signed the treaty with humiliating expressions.\n\nRelinquishing control over all Eastern European satellite states, and recognizing the complete independence of Ukraine and Belarus... it was effectively a surrender document. \n\nWith this treaty, the Soviet Union lost all core territories and buffer zones in the west and fell into a brain-dead state. The Red Empire did not collapse, but became a toothless old bear and entered a deep hibernation.\n\nHoshino thought while looking at the treaty where the ink hadn't dried. 'It's not over. When the bear wakes up, it will return with more scary anger.' "
 ABY_communism_event.14.a: "But at least for now, the sun of freedom was rising in the sky of Europe."

 ABY_communism_event.15.t: "New Dawn"
 ABY_communism_event.15.d: "Belgrade, after the smoke of war had cleared. The leaders of the united front gathered in one place. The joy of victory was short-lived; the border adjustment meeting was another battlefield. High voices were exchanged and teacups flew to solve the complex tangle of ethnicities, languages, and resources.\n\nBut they knew. If they scattered here, they would just be defeated individually again. After fierce debate, a historic agreement was derived.\n\nThe establishment of the Central European Federal Socialist Republic, embracing mixed regions where single-ethnic nation-state establishment is impossible, such as Czechia, German regions, and the Low Countries. And the creation of a Socialist International, resisting the Comintern in Moscow and aiming for true independence and democratic socialism.\n\nFinally the day of declaration. Takanashi Hoshino walked up to the platform as the focus of the whole world was gathered. In her eyes, a neat suit instead of an old bulletproof vest, and thousands of hopeful eyes looking at her entered.\n\n"Uhehe... this old-timer hates this kind of thing."\n\nshe muttered small and smirked. But she soon raised her head and opened her mouth toward the new era.\n\n"Comrades, and free citizens. The long, long winter has ended. We cut the chains of oppression, and we didn't become monsters while fighting monsters."\n\nHer voice spread to the sky of Belgrade.\n\n"Today we declare. The start of a new world made not with swords and spears but with handshakes, not with oppression but with solidarity, not with orders but with agreement. This is not our end, but our great first step."\n\nApplause surged like a wave. In that wave, Hoshino felt as if she saw the smile of the first departed Masaryk. Harmony of the two worlds, socialism with a human face. "
 ABY_communism_event.15.a: "That dream that seemed impossible finally became reality at the banks of the Danube."

