ABY_focus_establish_sekhmet: "셰크메트단 결성"
ABY_focus_establish_sekhmet_desc: "파시스트 놈들은 양심이란 걸 모르나 봅니다. 동료들을 모두 납치해 놓고, 살리고 싶으면 이쪽으로 오라니요? 아뇨, 그럴 일은 없을 겁니다.\n유일하게 저들의 손아귀를 피할 수 있었던 쿠로미 세리카는 반드시 대책위원회를 구출하겠다는 일념으로, 복수의 신의 이름을 딴 세크메트단을 창설했습니다."
ABY_focus_contact_with_hyakkaryoran: "백화요란과 접촉"
ABY_focus_contact_with_hyakkaryoran_desc: "백귀야행 연합학원의 백화요란 소속인 키류 키쿄는, 같은 동아리의 카데노코지 유카리의 복수를 돕기 위해 이해관계가 일치하는 사람들을 모아 레지스탕스를 결성했습니다. 키쿄가 합류한다면, 세리카에게 부족한 전략적 안목을 보완할 기회가 될 것입니다."
ABY_focus_deal_with_genbushokai: "현무상회와의 거래"
ABY_focus_deal_with_genbushokai_desc: "산해경의 현무상회는 변화에 적응하며 근근히 살아가고 있지만, 파시스트의 압제 아래에서는 오래 버티지 못할 것입니다. 우리의 대의에 함께하는 것이 현무상회 또한 살 수 있는 길이란 것을 강조하면, 저들도 결국 우리 편이 될 것입니다."
ABY_focus_succeed_legitimacy: "대책위원회 정통성 계승 선언"
ABY_focus_succeed_legitimacy_desc: "체코와 오스트리아의 통합에 가장 큰 역할을 한 것은 대책위원회입니다. 대책위원회의 유일한 생존자 쿠로미 세리카는 자신이 대책위원회로서 정통성을 가짐을 선포하였습니다."
ABY_focus_expand_guerilla: "게릴라 확산"
ABY_focus_expand_guerilla_desc: "파시스트 놈들은 반드시 고통받게 될 것입니다! "
ABY_focus_persuade_czech: "체코인 설득"
ABY_focus_persuade_czech_desc: "오스트리아의 주도에 불만을 느끼는 체코인이 많습니다. 우리는 그들에게 훗날의 정치적 이득을 대가로 하여 봉기에 합류시킬 수도 있을 것입니다."
ABY_focus_overthrow_austrian_fascism_government: "오스트리아 파시즘 정부 전복"
ABY_focus_overthrow_austrian_fascism_government_desc: "키보토스인이 흘린 피에 응답할 때가 왔습니다. 이제 우리는 오스트리아의 파시즘 정부에 대한 봉기를 일으켜, 그들을 완전히 축출할 것입니다!"
ABY_focus_vengeance_for_abydos: "아비도스의 복수"
ABY_focus_vengeance_for_abydos_desc: "조국전선은 아비도스의 행복을 송두리째 앗아가 버렸습니다. 마땅히 이에 대해 갚아줘야 하지만, 세리카는 예전에 타카나시 호시노가 했던 말이 마음에 걸렸습니다. 고민 끝에 마음을 정한 세리카는 그녀만의 복수를 시작했습니다."
ABY_focus_threats_outside: "외부의 위협"
ABY_focus_threats_outside_desc: "불행히도, 조국전선의 핵심 인력들은 무방비한 국경을 통해 외부로 도망쳐 버렸습니다. 세리카는 잔당을 완전히 소탕해야 희생자가 더 생기지 않는다는 입장입니다. 하지만 작전참모 키쿄는 먼저 키보토스의 파시즘 국가부터 처리해야 한다고 조언했습니다.\n확실한 건, 어느 쪽이든 우리는 전쟁에 대비해야 한다는 것입니다."

ABY_focus_exterminate_kivotos_fascism: "키보토스 파시즘 근절"
ABY_focus_exterminate_kivotos_fascism_desc: "우리와 같은 키보토스인들이 파시즘이라는 독주에 노출된 것은 간과할 수 없는 일입니다. 북쪽의 키보토스인들은 독주에 취해버렸으니, 우리는 마땅히 그들을 일깨워야 합니다."
ABY_focus_accept_prefect_team: "선도부 망명 수용"
ABY_focus_accept_prefect_team_desc: "선도부는 키보토스인 우선이라는 올바른 이상을 가지고 있었습니다. 우리와 같은 목표를 가지고 있는 그들을 마땅히 받아주어야 합니다."
ABY_focus_plan_antigerman_riot: "반독시위 선동"
ABY_focus_plan_antigerman_riot_desc: "게헨나 지역의 사람들 중에는 키보토스인들보다 독일인을 우선한 마코토의 결정에 불만을 가지고 있는 자들이 있습니다. 작은 빌미만 주어진다면, 그들을 선동하는 것 또한 어려운 일은 아닐 것입니다."
ABY_focus_prepare_for_halo_war: "헤일로 전쟁 준비"
ABY_focus_prepare_for_halo_war_desc: "우리는 백귀야행과 산해경을 상대로 승리한 적 있었지만, 이는 국력의 우위보다는 전략의 승리였습니다. 그러나 지금의 상대는 게헨나와 트리니티를 모두 점령한 강한 군사력의 나라입니다. 전략만으로는 그들을 상대하는 데 한계가 있으므로, 우리는 마땅히 헤일로 보병들 간의 전면전 또한 대비해야 합니다."
ABY_focus_attack_german_fascists: "독일 파시스트 공격"
ABY_focus_attack_german_fascists_desc: "독일 영토 근처의 섬에, 독일의 전쟁해군이 주둔하고 있다는 첩보가 들어왔습니다. 이들은 지금이 아니더라도 언젠가는 우리에게 위협이 될 존재입니다. 빠르게 싹을 잘라버려야 합니다."
ABY_focus_operation_austerlitz: "아우슈터리츠 작전"
ABY_focus_operation_austerlitz_desc: "결전의 때가 왔습니다. 이 전쟁을 통해 키보토스의 파시즘은 완전히 사라질 것입니다!"
ABY_focus_eliminate_terran_fascism: "인류 파시즘 척결"
ABY_focus_eliminate_terran_fascism_desc: "복수의 방향은 이미 정해졌습니다. 파시즘을 신봉하는 지구인들을 단죄해야 합니다."
ABY_focus_ally_with_kivotos_states: "키보토스 국가와 손잡기"
ABY_focus_ally_with_kivotos_states_desc: "우리가 지구인들과 전쟁하는 동안에는 후방이 안정되어 있을 필요가 있습니다. 우리는 남아 있는 모든 트리니티 국가들에게 사절을 보내어, 협력을 제안할 것입니다."
ABY_focus_judge_josef_tiso: "요제프 티소 단죄"
ABY_focus_judge_josef_tiso_desc: "요제프 티소는 기회주의적인 교권 파시스트입니다. 파시스트가 언제든 우리를 칠 수 있다는 건, 우리 발밑에 재앙의 싹이 움트고 있다는 것이나 다름없습니다."
ABY_focus_end_of_bizzare_regency: "기이한 섭정의 끝"
ABY_focus_end_of_bizzare_regency_desc: "우리가 차지하고 있는 부르겐란트 지역은 본디 헝가리의 영토였다고 합니다. 헝가리가 실지회복주의를 외친다면 우리와 충돌하는 것도 시간문제입니다. 우리가 먼저 손을 써야 합니다."
ABY_focus_pressure_toward_yugoslavia: "유고슬라비아 압박"
ABY_focus_pressure_toward_yugoslavia_desc: "우리의 최종 목표인 이탈리아를 효율적으로 공격하기 위해서, 유고슬라비아에게 일부 영토의 할양을 요구할 것입니다. 이를 거부하는 것은 파시스트를 돕는 것이라는 최후통첩과 함께 말이죠."
ABY_focus_operation_odoacer: "오도아케르 작전"
ABY_focus_operation_odoacer_desc: "조국전선의 잔당 대부분은 남쪽의 이탈리아로 도주한 것으로 확인되었습니다. 파시즘의 발원지인 이탈리아를 정복하여, 유럽의 파시즘을 소멸시켜야 합니다!"
ABY_focus_stalking_vf_remnants: "조국전선 잔당 추적"
ABY_focus_stalking_vf_remnants_desc: "조국전선은 와해된 이후 여러 곳으로 흩어졌지만, 가까운 곳에서 복수의 기회를 노리고 있다는 첩보가 계속해서 들어오고 있습니다. 이들을 추적해서 전부 잡아야 합니다."
ABY_focus_demand_vf_to_swiss: "스위스에 잔당 인도 요구"
ABY_focus_demand_vf_to_swiss_desc: "조국전선의 지도자인 에른스트 뤼디거 슈타르헴베르크가 스위스로 망명했다는 정보가 최근 입수되었습니다. 스위스를 공격하는 것은 우리에게도 출혈을 강요하는 일인 만큼, 우리는 스위스에게 그들의 중립성을 지키기 위해 슈타르헴베르크의 인도를 요청할 것입니다."
ABY_focus_though_war_is_over: "전쟁은 끝났지만"
ABY_focus_though_war_is_over_desc: "쿠로미 세리카는 지금까지 복수만을 바라보고 달려왔습니다. 원하던 복수를 이뤘지만, 그녀의 마음은 아직도 답답하기만 합니다.\n\n과연 그녀가 또다른 삶의 의미를 찾을 수 있을까요?"

ABY_focus_bloodthirst_of_lion: "사자의 갈증"
ABY_focus_bloodthirst_of_lion_desc: ""아직이야, 아직 복수는 끝나지 않았어...!"\n\n파시즘을 근절하는 것이 최선의 복수라 생각했습니다. 그러나 반발하기 시작하는 현지인들을 보면서, 세리카의 생각은 바뀌기 시작했습니다. 현지인들이 없었다면 대책위원회도 죽지 않았을 텐데..."
ABY_focus_ungrateful_purge: "배은망덕한 숙청"
ABY_focus_ungrateful_purge_desc: "세리카의 격변을 알아챈 키쿄는 어떻게든 세리카를 설득해서 더 이상의 전쟁을 멈추고자 합니다. 비록 우리가 그녀의 도움을 많이 받았지만, 우리의 새로운 이상을 방해하려 한다면 가차없이 없애버려야 합니다.\n\n주춧돌은 이제 뽑아내야 할 걸림돌이 되었습니다."
ABY_focus_general_mobilization_order: "전쟁 동원령"
ABY_focus_general_mobilization_order_desc: "세리카의 새로운 꿈을 이루기 위해, 국가는 끝없는 전쟁이라도 대비할 수 있도록 최대한 동원될 것입니다."
ABY_focus_reversed_halo: "반전된 헤일로"
ABY_focus_reversed_halo_desc: ""어...? 내 헤일로가 원래 이랬었나...?"\n\n세리카가 이변을 알아챘을 때는 이미 늦었습니다."
ABY_focus_until_all_terrans_die: "모든 지구인들이 죽을 때까지"
ABY_focus_until_all_terrans_die_desc: "전쟁과 복수의 신비가 깃든 세리카는 지구인들을 향한 피의 복수를 시작했습니다."
ABY_focus_bloody_ecstacy: "핏빛 희열"
ABY_focus_bloody_ecstacy_desc: "인간들이 흘리는 피를 보며, 그녀는 크게 웃고 또 웃었다. 그녀는 계속 광소하며 적들을 차례차례 죽여 나갔다. 그녀를 보며, 적도 아군도 공포에 떨었다..."
ABY_focus_girl_dyed_with_blood: "피에 물든 소녀"
ABY_focus_girl_dyed_with_blood_desc: "전황은 불리해지고 있고, 국민들의 사기는 땅에 떨어졌습니다. 오직 셰크메트의 웃음소리만이 총성과 함께 울려퍼지고 있습니다.\n\n그러나 머지않아, 셰크메트는 복수의 허무함을 느낄 틈도 없이, 그녀에게 돌아온 잔을 마시게 될 것입니다."

ABY_focus_end_of_vengeance: "복수의 끝"
ABY_focus_end_of_vengeance_desc: "세리카는 자신이 전쟁을 일으킨 이유를 기억해냈습니다. 조국전선을 뿌리뽑으려 한 것은 결국 무고한 키보토스인들의 안전을 위한 것이었습니다. 목적을 달성했으니, 이제 키보토스인들을 위한 나라를 만들 차례입니다."
ABY_focus_ideal_of_integration: "통합의 이상"
ABY_focus_ideal_of_integration_desc: "전쟁을 치르며, 국민들은 점점 통합되어 가고 있었습니다. 이제 국민들은 남키보토스 통합의 이상을 꿈꿉니다."
ABY_focus_southern_kivotos_industries: "남키보토스 산업 발전"
ABY_focus_southern_kivotos_industries_desc: "평화를 되찾았으니, 이제 경제 발전에 투자할 수 있습니다. 세 학원을 아우르는 거대한 산업단지가 건설되기 시작했습니다."
ABY_focus_effort_for_peace: "평화를 위한 노력"
ABY_focus_effort_for_peace_desc: "우리는 더 이상 전쟁을 주도하지 않을 것입니다. 군대에 들어가는 비용의 일부는 이제 더 나은 삶의 수준을 위해 투자될 것입니다."
ABY_focus_restore_sightseeing: "관광 복원"
ABY_focus_restore_sightseeing_desc: "백귀야행과 산해경은 관광 산업에 크게 의존하고 있습니다. 그동안 대전이와 전쟁으로 빛을 보지 못한 관광 산업을 재건하면, 우리의 경제에도 도움이 될 것입니다."
ABY_focus_expand_fortress: "요새 확장"
ABY_focus_expand_fortress_desc: "평화를 원한다면 전쟁을 대비하라는 격언이 있습니다. 비록 외부의 상황이 지금은 안정되어 있으나, 언젠가 우리의 평화가 위협받을 때를 대비해 두는 것도 필요한 작업입니다."
ABY_focus_negotiation_again: "재협상"
ABY_focus_negotiation_again_desc: "세리카와 완전한 동행을 택한 백화요란과 달리, 산해경은 복안을 가지고 우리와 협력하기로 했었습니다. 이제 그들을 다시 설득할 시간입니다."
ABY_focus_serika_dictatorship: "세리카의 독재"
ABY_focus_serika_dictatorship_desc: "키보토스인을 억압하는 오스트리아 정부를 전복하고, 이후 전쟁에서 승리하여 조국전선을 소탕한 것은 세리카가 없었다면 시작하지도 못했을 일이었습니다. 통합된 국가의 지도자는 마땅히 세리카가 되어야 합니다."
ABY_focus_kivotos_priority: "키보토스인 우선"
ABY_focus_kivotos_priority_desc: "우리는 키보토스인들이 더욱 대우받는 새로운 질서를 세울 것입니다. 그러나 이는 우리가 더 우월하기 때문이 아니라, 이 세계에서 아직 취약하기 때문이라는 것 또한 강조할 것입니다."
ABY_focus_new_kivotos_council: "새로운 키보토스 학생회"
ABY_focus_new_kivotos_council_desc: "총학생회가 제 역할을 잃고 마비되었으니, 우리가 새로운 학생회를 세워 앞으로의 혼란을 수습해야 합니다."
ABY_focus_abydos_sand_fiesta: "아비도스 모래 축제"
ABY_focus_abydos_sand_fiesta_desc: "대전이로 사막 지형이 이전된 것을 활용하여, 세리카는 모래 축제를 개최할 계획을 세웠습니다. 이는 지친 사람들의 심신을 치유해 줌과 동시에, 아비도스가 남키보토스를 주도한다는 상징적인 의미 또한 가질 것입니다."
ABY_focus_restore_democracy: "민주주의 복원"
ABY_focus_restore_democracy_desc: "체코는 대전이 이전까지 중부 유럽의 유일한 민주주의 국가였습니다. 민주주의의 재건은 두 민족을 통합하는 데 또한 도움이 될 것입니다."
ABY_focus_assembly_of_people: "온 국민의 의회"
ABY_focus_assembly_of_people_desc: "한쪽의 말만 듣고 다른 쪽의 말을 무시한다면, 분쟁이 생기는 것은 필연입니다. 키보토스인과 현지인 동수로 의회를 구성하면 양쪽의 의견을 모두 존중할 수 있을 것입니다."
ABY_focus_combination_between_two_people: "두 종족의 통합"
ABY_focus_combination_between_two_people_desc: "통합된 남키보토스는 두 종족이 모두 존중받는 국가가 될 것입니다."
ABY_focus_lamp_festival_for_new_era: "새 시대를 위한 등불 축제"
ABY_focus_lamp_festival_for_new_era_desc: "과거 백귀야행 연합학원에서는 학원의 통합을 위해 등불 축제를 개최하여, 통합을 기원하며 등불을 물에 띄웠다고 합니다. 통합을 기원하는 의미로, 남키보토스 의회는 등불 축제를 개최할 것을 선언했습니다."
ABY_focus_girl_with_white_uniform: "흰 제복의 소녀"
ABY_focus_girl_with_white_uniform_desc: "대책위원회가 세리카만 살아남게 되었을 때, 남키보토스의 운명은 풍전등화나 다름없었습니다. 그러나 세리카는 뜻을 같이하는 사람들을 모아 비참한 운명을 결국 바꾸어 내었습니다.\n\n통합된 남키보토스의 평화로운 거리를 둘러보며, 세리카는 대책위원회 멤버들에게 근황을 말해주러 정든 교정으로 향했습니다..."


##################################################################################################################################################

