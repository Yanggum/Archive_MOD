 ABY_shiroko_fas_info_tt: "\n§YLong live our dear President, Her Excellency Sunaookami Shiroko!§!\n\nUpon taking office, Her Excellency announced the §YPledges of the Revolution§!.\nThe §YPledges of the Revolution§! are divided into two parts: §CInternal Affairs§! and §CForeign Affairs§!. For every §G30§! points of achievement in each part, the effects of the trait gained upon completing the §YGolden Throne§! focus will increase!\n§RThe naive wolf still believes this is the path for democracy.§!"
