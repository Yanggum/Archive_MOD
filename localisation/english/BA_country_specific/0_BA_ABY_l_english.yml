########################################################

 ABY_focus_establish_sekhmet: "Form the Sekhmet Gang"
 ABY_focus_establish_sekhmet_desc: "The Fascists seem to have no conscience. After kidnapping all our comrades, they tell me to come there if I want them saved? No, that won't happen.\nSerika Kuromi, the only one to escape their clutches, has founded the Sekhmet Gang, named after the goddess of vengeance, with the sole determination to rescue the Foreclosure Task Force."
 ABY_focus_contact_with_hyakkaryoran: "Contact Hyakkiyako"
 ABY_focus_contact_with_hyakkaryoran_desc: "Kikyou Kiryu of Hyakkiyako Academy's Hyakkiyoryoran has formed a resistance by gathering people with aligned interests to help avenge Yukari Kadenokouji. If Kikyou joins, it will be an opportunity to supplement the strategic insight that Serika lacks."
 ABY_focus_deal_with_genbushokai: "Deal with Genbushokai"
 ABY_focus_deal_with_genbushokai_desc: "Shanhaijing's Genbushokai is barely scraping by while adapting to change, but they won't last long under Fascist oppression. If we emphasize that joining our cause is also the path to their survival, they will eventually side with us."
 ABY_focus_succeed_legitimacy: "Declaration of Foreclosure Task Force Succession"
 ABY_focus_succeed_legitimacy_desc: "The Foreclosure Task Force played the largest role in the integration of Czechia and Austria. Serika Kuromi, the sole survivor of the Task Force, has proclaimed that she holds the legitimacy of the Foreclosure Task Force."
 ABY_focus_expand_guerilla: "Expand Guerrilla Warfare"
 ABY_focus_expand_guerilla_desc: "Those Fascists will surely suffer! "
 ABY_focus_persuade_czech: "Persuade the Czechs"
 ABY_focus_persuade_czech_desc: "Many Czechs feel dissatisfied with Austrian leadership. We could bring them into the uprising by promising future political benefits."
 ABY_focus_overthrow_austrian_fascism_government: "Overthrow Austrian Fascist Government"
 ABY_focus_overthrow_austrian_fascism_government_desc: "The time has come to answer the blood spilled by Kivotosians. Now, we will launch an uprising against the Austrian Fascist government and completely expel them!"
 ABY_focus_vengeance_for_abydos: "Abydos' Vengeance"
 ABY_focus_vengeance_for_abydos_desc: "The Fatherland Front has completely snatched away the happiness of Abydos. It is only right to repay them for this, but Serika was troubled by what Hoshino Takanashi had said in the past. After agonizing, Serika made up her mind and began her own vengeance."
 ABY_focus_threats_outside: "External Threats"
 ABY_focus_threats_outside_desc: "Unfortunately, the core personnel of the Fatherland Front have fled abroad through the unguarded borders. Serika's position is that the remnants must be completely wiped out to prevent further victims. However, the Chief of Staff Kikyou advised that the Fascist states of Kivotos must be dealt with first.\nWhat is certain is that either way, we must prepare for war."

 ABY_focus_exterminate_kivotos_fascism: "Exterminate Kivotos Fascism"
 ABY_focus_exterminate_kivotos_fascism_desc: "It is intolerable that our fellow Kivotosians are exposed to the poison of Fascism. Since the Kivotosians to the north have become intoxicated by this poison, it is our duty to awaken them."
 ABY_focus_accept_prefect_team: "Accept Prefect Team Asylum"
 ABY_focus_accept_prefect_team_desc: "The Prefect Team held the correct ideal of prioritizing Kivotosians. We must accept them, as they share the same goal as us."
 ABY_focus_plan_antigerman_riot: "Instigate Anti-German Riot"
 ABY_focus_plan_antigerman_riot_desc: "There are those among the people of the Gehenna region who are dissatisfied with Makoto's decision to prioritize Germans over Kivotosians. Given a small pretext, instigating them will not be a difficult task."
 ABY_focus_prepare_for_halo_war: "Prepare for Halo War"
 ABY_focus_prepare_for_halo_war_desc: "We once triumphed over Hyakkiyako and Shanhaijing, but that was a victory of strategy rather than national power. However, the current opponent is a country with strong military power that has occupied both Gehenna and Trinity. Since there are limits to facing them with strategy alone, we must naturally prepare for total war between Halo Infantry."
 ABY_focus_attack_german_fascists: "Attack German Fascists"
 ABY_focus_attack_german_fascists_desc: "Intelligence has come in that the German Kriegsmarine is stationed on an island near German territory. They are an existence that will become a threat to us sooner or later. We must nip them in the bud quickly."
 ABY_focus_operation_austerlitz: "Operation Austerlitz"
 ABY_focus_operation_austerlitz_desc: "The time for the decisive battle has come. Through this war, Kivotos Fascism will completely disappear!"
 ABY_focus_eliminate_terran_fascism: "Eliminate Terran Fascism"
 ABY_focus_eliminate_terran_fascism_desc: "The direction of vengeance is already set. We must punish the Earthlings who believe in Fascism."
 ABY_focus_ally_with_kivotos_states: "Ally with Kivotos States"
 ABY_focus_ally_with_kivotos_states_desc: "While we are at war with the Earthlings, our rear needs to be stable. We will send envoys to all remaining Trinity states and propose cooperation."
 ABY_focus_judge_josef_tiso: "Condemn Jozef Tiso"
 ABY_focus_judge_josef_tiso_desc: "Jozef Tiso is an opportunistic clerical Fascist. The fact that Fascists can strike us at any time means that the seeds of disaster are sprouting under our feet."
 ABY_focus_end_of_bizzare_regency: "End of the Bizarre Regency"
 ABY_focus_end_of_bizzare_regency_desc: "The Burgenland region we occupy was originally Hungarian territory. If Hungary shouts for irredentism, it is only a matter of time before we clash. We must act first."
 ABY_focus_pressure_toward_yugoslavia: "Pressure Yugoslavia"
 ABY_focus_pressure_toward_yugoslavia_desc: "To efficiently attack Italy, our final goal, we will demand the cession of some territories from Yugoslavia. Along with an ultimatum that refusal means aiding the Fascists."
 ABY_focus_operation_odoacer: "Operation Odoacer"
 ABY_focus_operation_odoacer_desc: "It has been confirmed that most of the remnants of the Fatherland Front have fled to Italy in the south. By conquering Italy, the birthplace of Fascism, we must extinguish Fascism in Europe!"
 ABY_focus_stalking_vf_remnants: "Track Fatherland Front Remnants"
 ABY_focus_stalking_vf_remnants_desc: "Although the Fatherland Front has dispersed after its collapse, intelligence continues to come in that they are looking for an opportunity for revenge nearby. We must track them down and catch them all."
 ABY_focus_demand_vf_to_swiss: "Demand Extradition of Remnants from Switzerland"
 ABY_focus_demand_vf_to_swiss_desc: "Information was recently obtained that Ernst Rüdiger Starhemberg, the leader of the Fatherland Front, has fled to Switzerland. Since attacking Switzerland would impose casualties on us as well, we will request Switzerland to extradite Starhemberg to maintain their neutrality."
 ABY_focus_though_war_is_over: "Though the War is Over"
 ABY_focus_though_war_is_over_desc: "Serika Kuromi has run until now with only vengeance in sight. She achieved the revenge she wanted, but her heart still feels heavy.\n\nWill she be able to find another meaning in life?"

 ABY_focus_bloodthirst_of_lion: "Thirst of the Lion"
 ABY_focus_bloodthirst_of_lion_desc: "\"Not yet, vengeance isn't over yet...!\"\n\nI thought eradicating Fascism was the best vengeance. However, seeing the locals start to rebel, Serika's thoughts began to change. If it wasn't for the locals, the Foreclosure Task Force wouldn't have died..."
 ABY_focus_ungrateful_purge: "Ungrateful Purge"
 ABY_focus_ungrateful_purge_desc: "Kikyou, noticing Serika's upheaval, tries to persuade her to stop further war at all costs. Although we received much help from her, if she tries to hinder our new ideal, we must eliminate her without mercy.\n\nThe cornerstone has now become a stumbling block that must be pulled out."
 ABY_focus_general_mobilization_order: "General Mobilization Order"
 ABY_focus_general_mobilization_order_desc: "To achieve Serika's new dream, the nation will be mobilized to the maximum to prepare for even an endless war."
 ABY_focus_reversed_halo: "Reversed Halo"
 ABY_focus_reversed_halo_desc: "\"Huh...? Was my halo originally like this...?\"\n\nBy the time Serika noticed the anomaly, it was already too late."
 ABY_focus_until_all_terrans_die: "Until All Terrans Die"
 ABY_focus_until_all_terrans_die_desc: "Serika, imbued with the mystery of war and vengeance, has begun her bloody revenge against the Earthlings."
 ABY_focus_bloody_ecstacy: "Bloody Ecstasy"
 ABY_focus_bloody_ecstacy_desc: "Watching the humans shed blood, she laughed and laughed. She continued to laugh maniacally as she killed the enemies one by one. Seeing her, both friend and foe trembled in fear..."
 ABY_focus_girl_dyed_with_blood: "The Girl Dyed in Blood"
 ABY_focus_girl_dyed_with_blood_desc: "The tide of war is turning unfavorable, and the morale of the people has plummeted. Only the laughter of Sekhmet rings out along with the gunfire.\n\nHowever, before long, Sekhmet will have to drink from the cup returned to her, before she even has a chance to feel the futility of vengeance."

 ABY_focus_end_of_vengeance: "End of Vengeance"
 ABY_focus_end_of_vengeance_desc: "Serika remembered the reason she started the war. The attempt to root out the Fatherland Front was ultimately for the safety of innocent Kivotosians. Now that the goal has been achieved, it is time to create a country for Kivotosians."
 ABY_focus_ideal_of_integration: "Ideal of Integration"
 ABY_focus_ideal_of_integration_desc: "Through the war, the people were becoming increasingly integrated. Now the people dream of the ideal of South Kivotos integration."
 ABY_focus_southern_kivotos_industries: "South Kivotos Industrial Development"
 ABY_focus_southern_kivotos_industries_desc: "Now that peace has been regained, we can invest in economic development. A massive industrial complex encompassing the three academies has begun construction."
 ABY_focus_effort_for_peace: "Effort for Peace"
 ABY_focus_effort_for_peace_desc: "We will no longer lead wars. A portion of the military budget will now be invested in a better standard of living."
 ABY_focus_restore_sightseeing: "Restore Tourism"
 ABY_focus_restore_sightseeing_desc: "Hyakkiyako and Shanhaijing rely heavily on the tourism industry. Rebuilding the tourism industry, which has not seen the light due to the Great Transition and war, will also help our economy."
 ABY_focus_expand_fortress: "Expand Fortresses"
 ABY_focus_expand_fortress_desc: "There is a maxim: if you want peace, prepare for war. Although the external situation is currently stable, it is also a necessary task to prepare for when our peace is threatened one day."
 ABY_focus_negotiation_again: "Renegotiation"
 ABY_focus_negotiation_again_desc: "Unlike Hyakkiyako, which chose a complete journey with Serika, Shanhaijing had decided to cooperate with us with a hidden plan. Now is the time to persuade them again."
 ABY_focus_serika_dictatorship: "Serika's Dictatorship"
 ABY_focus_serika_dictatorship_desc: "Overthrowing the Austrian government that oppressed Kivotosians and subsequently winning the war to wipe out the Fatherland Front would not even have started without Serika. The leader of the integrated nation should rightfully be Serika."
 ABY_focus_kivotos_priority: "Kivotosian Priority"
 ABY_focus_kivotos_priority_desc: "We will establish a new order where Kivotosians are better treated. However, we will also emphasize that this is not because we are superior, but because we are still vulnerable in this world."
 ABY_focus_new_kivotos_council: "New Kivotos Student Council"
 ABY_focus_new_kivotos_council_desc: "Since the General Student Council has lost its role and become paralyzed, we must establish a new student council to manage the upcoming chaos."
 ABY_focus_abydos_sand_fiesta: "Abydos Sand Fiesta"
 ABY_focus_abydos_sand_fiesta_desc: "Utilizing the fact that the desert terrain was moved by the Great Transition, Serika planned to hold a sand festival. This will heal the minds and bodies of the weary people and simultaneously carry the symbolic meaning that Abydos leads South Kivotos."
 ABY_focus_restore_democracy: "Restore Democracy"
 ABY_focus_restore_democracy_desc: "Czechia was the only democratic country in Central Europe until the Great Transition. Rebuilding democracy will also help in integrating the two peoples."
 ABY_focus_assembly_of_people: "Assembly of the Whole Nation"
 ABY_focus_assembly_of_people_desc: "If one side's voice is heard while the other's is ignored, conflict is inevitable. Forming an assembly with an equal number of Kivotosians and locals will allow for the respect of both sides' opinions."
 ABY_focus_combination_between_two_people: "Integration of Two Species"
 ABY_focus_combination_between_two_people_desc: "The integrated South Kivotos will be a country where both species are respected."
 ABY_focus_lamp_festival_for_new_era: "Lantern Festival for a New Era"
 ABY_focus_lamp_festival_for_new_era_desc: "In the past, Hyakkiyako Academy held a lantern festival to pray for the integration of the academy, floating lanterns on the water. In the sense of praying for integration, the South Kivotos Assembly declared the holding of a lantern festival."
 ABY_focus_girl_with_white_uniform: "The Girl in the White Uniform"
 ABY_focus_girl_with_white_uniform_desc: "When only Serika survived from the Foreclosure Task Force, the fate of South Kivotos was like a wind-blown candle. However, Serika gathered people with the same will and eventually changed the miserable fate.\n\nLooking around the peaceful streets of integrated South Kivotos, Serika headed to the familiar school grounds to tell the Foreclosure Task Force members about recent events..."


##################################################################################################################################################

### Army Focus (Local Army and General Doctrine)
### Army Focus
 ABY_focus_army_1: "Disband Militias"
 ABY_focus_army_1_desc: "The devotion of the militias and vigilantes who voluntarily rose to protect their homeland in the chaos following the Great Transition will go down in history. However, at this point when the national system is organized and the regular army is rebuilt, militias with unclear command structures and varying training levels can become an element that hinders the efficiency of military operations. We must express our gratitude and honorably disband them, or incorporate them as members of the regular army through a rigorous selection process. Modern warfare cannot be won by burning patriotism alone; only high-level training and disciplined command and control can guarantee victory. The era of amateurs is over."

 ABY_focus_army_2: "National Defense Priority"
 ABY_focus_army_2_desc: "The cold reality is that our national power and troops are woefully insufficient compared to the potential enemies around us. In this situation, recklessly expanding the front or taking aggressive military actions will only lead to self-destruction. We must fortify the main strategic points of the country and adopt a war of attrition strategy by constructing multi-layered defense lines on the enemy's advance routes to force their bleeding. Our goal is not territorial expansion, but the survival of the motherland. Let the enemies smash their heads and shed blood against our iron-clad defense lines. Every drop of blood we shed must be traded for ten drops of the enemy's blood, and every single stone in this land will become an impassable mountain for the enemy. This is a fortress of steel that does not move."

 ABY_focus_army_3: "Preemptive Strike Priority"
 ABY_focus_army_3_desc: "One cannot hold the initiative of war with a defensive attitude. The best defense is a powerful attack that makes the enemy not even dare to think of attacking us. Before the enemy's forces gather and supply lines are completed, we must strike their heart by targeting their most vulnerable moment. Establish a blitz-like preemptive strike doctrine that catches the enemy off guard by concentrating high mobility and firepower. Paralyzing the enemy's command system and breaking their will to fight is the only way for us, who are at a disadvantage, to seize the victory. Only those who read the flow of the battlefield and move first can dance with the Goddess of Victory. Hesitation is defeat."

 ABY_focus_army_4: "Introduce Tactical Trenches"
 ABY_focus_army_4_desc: "Trench warfare is by no means a relic of the past. By combining advanced defensive tactical concepts passed down from Kivotos with the rugged terrain of our country, we must construct an organic defense network rather than a simple pit. Configure crossfire zones that can cover each other, and construct solid bunkers and underground passages that can protect allies from enemy artillery and air attacks. These modern tactical trenches will be a swamp that slows down the enemy's advance and a springboard for a counterattack. No matter how many shells the enemy pours, we will breathe safely underneath and prepare a lethal counterattack. This is an unmoving fortress of steel."

 ABY_focus_army_5: "Establish Central Command System"
 ABY_focus_army_5_desc: "In order for units from different origins and backgrounds to move like a single organism, a powerful and unified central control system is essential. Create an integrated command covering the Army, Air Force, and even the Halo units, and overhaul the advanced communication network so that orders from the command can be delivered quickly and accurately to even a single soldier on the front line. Confusion of command and disobedience of orders are the biggest enemies directly leading to defeat on the battlefield. When all units move with one head and one will, we can finally overwhelm the enemy. Quieting the chaos and establishing order is the first step to victory."

 ABY_focus_army_6: "Extend Service Period"
 ABY_focus_army_6_desc: "Recklessly discharging soldiers in a crisis situation where war clouds are gathering is a dangerous gamble that causes a serious vacuum in national defense. It takes a long time to raise a skilled soldier, but losing them happens in an instant. We must inevitably extend the mandatory service period to maintain as many elite troops with abundant combat experience as possible. Of course, the dissatisfaction of the soldiers and their families will be unavoidable, but now when the safety of the motherland is precarious, we have no choice but to demand individual sacrifice. We need more guns, and hands that can handle those guns skillfully. The sweat we shed today will replace the blood of our families tomorrow."

 ABY_focus_army_7: "Flatten the Battlefield"
 ABY_focus_army_7_desc: "The most certain and ruthless way to remove all danger elements placed on the advance route of allies—from the enemy's minefields and layers of barbed wire to the trench lines that might be lying in ambush—is overwhelming firepower projection. Before the infantry sets foot on dangerous ground, mobilize all possessed artillery power to deliver unlimited shelling and physically flatten the terrain itself. Like a god plowing the earth with a giant plow, the enemy's defensive facilities and traps must be blown away without a trace. After the smoke clears, only a safe and flat advance route for our army will remain on the upturned dirt. If there's an obstacle, turn it into powder and open a path; that is our way."

 ABY_focus_army_8: "Legacy of the Great War"
 ABY_focus_army_8_desc: "The bloody lesson left by the last Great War (WWI) is still valid. The tactic of pouring massive firepower into the enemy's defense line and forcing constant wars of attrition to deplete the enemy's human and material resources will give the enemy a terrible nightmare. Although we may be criticized for disregarding human life, there's no reason to give up the proven equation of victory that can surely suppress the enemy. A total war posture considering large-scale artillery battles, trench warfare, and even poison gas spraying will plant a fear in the enemy that we will not hesitate to use any means for victory. War is not romance. it is the most brutal reality existing to win."

 ABY_focus_army_9: "Road of Life"
 ABY_focus_army_9_desc: "An unbroken supply line on the battlefield is the lifeblood and artery of the army. To ensure that soldiers fighting on the front lines do not starve due to running out of ammunition or food, we must fortify the rear logistics lines and dramatically improve the transport system. Railways are more important than tanks, and trucks are more precious than rifles. The enemy will infiltrate special forces or launch air raids to cut our supply lines, but we will defend this 'Road of Life' regardless of the sacrifice. If logistics collapse, the army also collapses. Keep in mind that the tip of a logistics officer's pen can save more soldiers than the blade of an enemy general."

 ABY_focus_army_10: "Strengthen Unit Cohesion"
 ABY_focus_army_10_desc: "What binds soldiers from different origins, ethnicities, and backgrounds into a single steel-like army is camaraderie and cohesion. Strengthen the bond between unit members through high-intensity joint training and mental education, and build trust where they can risk their lives for each other. The fact that there is a comrade to whom I can entrust my back on the battlefield gives soldiers greater courage than any latest weapon. A military united under the single name of the 'Abydos Federal Army,' transcending the walls of race and origin, is a true strong army that can overcome physical power differences and create miracles. We are brothers."

 ABY_focus_army_11: "Expand Supply Network"
 ABY_focus_army_11_desc: "As the army advances deeper into enemy territory, the amount of required materials increases exponentially, and supply lines become longer and more precarious. We must expand the existing railway network, pave roads, and install field supply depots throughout the front to dramatically improve operational sustainability. The limit of supply is the limit of advance. We will expand that limit further and wider so that allies can receive necessary materials immediately wherever they are. The procession of non-stopping supply trucks will become the driving force that enables our army's constant advance."

 ABY_focus_army_12: "Iron and Gunpowder"
 ABY_focus_army_12_desc: "The sleeping god of war awakens smelling the acrid scent of iron and gunpowder. The shells produced by mobilizing all our industrial capacities, including Skoda's factories and Vitkovice's ironworks, will fall as a rain of steel upon the enemies at the front. Whether the enemies hide in trenches or go deep into bunkers, our shells will find them. There is no place for the enemy to hide anywhere in this land. Overwhelming artillery firepower is the only language that will thoroughly crush the enemy's resistance and bring victory. More barrels, more shells, bigger explosions. This is the only means of dialogue we can give the enemy."

 ABY_focus_army_13: "Grand Strategy"
 ABY_focus_army_13_desc: "Victory in a local battle does not necessarily guarantee victory in the entire war. We must not be intoxicated by small victories on the battlefield, but read the board of the huge game of war by totally coordinating the nation's political, diplomatic, economic, and military capabilities. Establish a meticulous grand strategy that macroscopically predicts the enemy's movement, maximizes the strengths of allies, and complements their weaknesses. You must move the pieces with an eye looking down at the entire chessboard. Sometimes a bold decision to give up flesh and take the bone is necessary. War is not done with guns and swords, but with the head."

 ABY_focus_army_14: "Massive Assault"
 ABY_focus_army_14_desc: "When complex tactics or tricks do not work, there is nothing more certain and shocking than tearing through the enemy's defense line frontally with overwhelming troops. Extremely inspire the morale of the soldiers and conduct simultaneous and wave-like assaults across the entire front. At the momentum of allies rushing while forgetting fear and shouting, the enemies will be terrified and abandon the defense line and flee. The wave of humans rolling like a tide will swallow any fortress. Of course, sacrifice will follow, but it's a price to pay for victory. Charge forward!"

 ABY_focus_army_15: "Firepower Superiority"
 ABY_focus_army_15_desc: "Project overwhelming and continuous firepower so that the enemy infantry dare not lift their heads out of the trenches. Small arms fire from infantry, supporting fire from artillery, direct fire from tank guns, and air support must all be organically integrated and poured onto a specific point. Erase all living things at the target point and make the enemy disappear like dust. There is no mercy on the battlefield. Only overwhelming firepower is the truth, and greater firepower is a greater truth. Our goal is not to suppress the enemy, but to delete them."

### Halo Infantry Focus
 ABY_focus_halo_1: "Mystery Infantry Research" #신비 보병 연구
 ABY_focus_halo_1_desc: "Students possessing 'Mystery' have superhuman endurance that makes them hard to injure with conventional weapons and powerful firepower exceeding a single platoon. By scientifically analyzing and tactically datafying their abilities, we must develop optimized operational doctrines and unit compositions. Rather than simply relying on 'strong individuals,' we will prove their value as systematized 'strategic weapons' that can flip the tide of the battlefield and achieve strategic goals. Mystery is not a miracle, but a power we must control and utilize."

 ABY_focus_halo_2: "Mystery Infantry of the New Era" #새 시대의 신비 보병
 ABY_focus_halo_2_desc: "We cannot abandon our humanity and become demons for victory. We completely scrap unethical and inhumane 'Artificial Halo' experiments that eat away at the user's lifespan, and instead officially adopt the 'Juggernaut' reinforced exoskeleton technology injected with Mystery energy. Although the production cost is immense, this steel armor that exhibits combat power on par with Kivotosians without harming the wearer's health will prove our technological superiority and moral legitimacy at the same time. We fight to protect life, not to use life as a consumable."

 ABY_focus_halo_3: "Rebuild Regular Army" #정규군 재건
 ABY_focus_halo_3_desc: "The exponentially increasing number of students is not a simple population increase, but means that our federation's potential power is being dramatically augmented. We conscript volunteer students to newly establish a 'Halo Command' with independent command and personnel authority under the Army, and begin the full-scale formation of regular 'Halo Divisions.' Now students will not be sporadic guerrillas or auxiliary forces, but the core strategic assets of the Federal Army moving under systematic command and military training. Their Mystery will meet military discipline and become an even stronger and sharper blade to defend the motherland."

 ABY_focus_halo_4: "Active Defense Doctrine"
 ABY_focus_halo_4_desc: "By utilizing the students' excellent physical abilities and reflexes, we establish an active defense tactic that intercepts attacks from the point of origin, rather than a passive defense that simply takes enemy attacks inside trenches. If signs of an enemy offensive are detected, maneuver immediately to break the enemy's momentum and convert to an offensive by launching a counterattack; this mobile defense will minimize our damage. Not blocking with a shield, but parrying the enemy's sword with a sword. That is the defense we pursue."

 ABY_focus_halo_5: "Duty of Loyalty" #충성의 의무
 ABY_focus_halo_5_desc: "Students are free-spirited and have strong personalities, but now they must be instilled with the sense of responsibility and belonging they should have as soldiers of the federation. We must constantly remind them that the special power they have is not theirs alone, but given to protect this country and suffering citizens. Through high-intensity mental education and education on the history of the federation, let the light of the Halo shine brighter with unshakable loyalty to the motherland. They are now honorable Abydos soldiers before they are students."

 ABY_focus_halo_6: "Expand Regular Army"
 ABY_focus_halo_6_desc: "By expanding conscription to more students and conducting high-intensity training, we must increase the number of Halo infantry divisions. Beyond the limits of a small elite special forces, foster an army of a scale that can cover the entire front and play a role as a main force even in large-scale pitched battles. To ensure that quantitative expansion does not lead to qualitative degradation, strict selection criteria and standardized training programs must be maintained. The numerous Halo lights covering the battlefield will bring despair to the enemy."

 ABY_focus_halo_7: "Introduce Data Link Technology"
 ABY_focus_halo_7_desc: "In order to draw out 100% of the high-performance Juggernaut suit's potential, organic connection between pilots is essential. Introduce a real-time data link system applying Millennium's technology to share sensor information of each suit, and grasp the situation of the battlefield multi-dimensionally to deliver it to the command. This will not be a simple collection of machines, but a steel legion moving connected as one giant neural network. Sharing information is survival and victory."

 ABY_focus_halo_8: "Support Land Carrier Research"
 ABY_focus_halo_8_desc: "Juggernaut suits are powerful, but maintenance, charging, and resupply consume many resources and facilities. To support this efficiently, we develop a giant 'Support Land Carrier' that moves along the front. This carrier, a moving maintenance shop, charging station, and resting place for soldiers, will be a reliable lighthouse that allows the Juggernaut units to advance deep into enemy territory and continue operations without worrying about supplies. Like a ship crossing the desert, this fortress of steel will carry victory across the wasteland."

 ABY_focus_halo_9: "Commando Commander"
 ABY_focus_halo_9_desc: "We select students who possess excellent combat power, charisma, and outstanding tactical insight and appoint them as commando commanders. Their appearance, breathing with soldiers at the very front rather than in a safe bunker in the rear, and directly breaking through enemy lines holding weapons, will raise the morale of allies to the end of the sky. Soldiers will willingly give their lives for a commander who jumps into danger ahead of them. Heroes are born in troubled times and completed in the blood-splattered battlefield."

 ABY_focus_halo_10: "Guardian of the Federation"
 ABY_focus_halo_10_desc: "Now the students of Abydos are not strangers or guests. They are the hardest shield protecting this federation and the sharp spear piercing the enemy's heart. Citizens trust and respect them, and students use their power for the safety and happiness of citizens. This firm bond and trust will exert power stronger than any physical weapon to unite the nation. We are a community of destiny protecting each other."

 ABY_focus_halo_11: "Land Task Force"
 ABY_focus_halo_11_desc: "We create a high-mobility mechanized unit, the 'Land Task Force,' which has a mixed organization of various support vehicles such as tanks, armored cars, and self-propelled guns with the Juggernaut unit as the main axis. When the heavy-armored Juggernauts break through the front line, the following mechanized infantry and firepower support units will expand the exploits and secure the occupied area. This order of steel knights will be the federation's hammer that pierces any solid defense line and ravages the enemy lines. Show the perfect harmony of speed, firepower, and defense."

 ABY_focus_halo_12: "Backbone of the Federal Army"
 ABY_focus_halo_12_desc: "The Halo infantry is no longer an auxiliary force but the core backbone leading the operational plans of the Federal Army. All strategies and tactics are established in a direction that maximizes their abilities, and conventional units take on the supporting role of supporting them and defending the flanks. The protagonist of the battlefield has changed. Our victory depends on their hands, their muzzles, and their Mystery. If they fail, the federation also fails."

 ABY_focus_halo_13: "Wave of Light"
 ABY_focus_halo_13_desc: "The brilliant lights of numerous Halos filling the front line are a lighthouse of hope for allies and a flare of approaching doom for enemies. Launch the large-scale offensive operation 'Wave of Light' to sweep away enemy lines with overwhelming firepower, the power of Mystery, and unyielding will. The forces of darkness will disappear without a trace before the army of light rolling in like a raging wave. Nothing can stop this holy advance. Advance, until the day of victory!"

### Air Force Focus
 ABY_focus_air_1: "Rebuild Air Force"
 ABY_focus_air_1_desc: "Repair the runways broken by enemy air raids, and find, wipe, and tighten the machines left in the corners of hangars gathering dust. An army that has lost the sky is like a bird with broken wings and is only half a force. Although now only a few old biplanes and trainers are all and it's a meager start, we will fly vigorously toward the firmament once again. He who seizes air superiority has the eyes and ears of the battlefield and dominates the war. You must reclaim the sky to protect the land."

 ABY_focus_air_2: "New Air Force Doctrine"
 ABY_focus_air_2_desc: "We must not follow the old aerial combat methods of the Great War era. We must establish a new and innovative air force doctrine suitable for modern warfare, such as organically combining the mobility of helicopters and the firepower of fixed-wing aircraft and conducting close air support (CAS) under close cooperation with ground forces. The Air Force must play a key role in leading the operations of ground forces to victory as well as independent combat. Innovation in the sky will bring victory on the ground."

 ABY_focus_air_3: "Capture Fighters"
 ABY_focus_air_3_desc: "Modern jet fighters transitioned from Kivotos are the pinnacle of 'over-technology' that we cannot even dare to understand or replicate with our current technology. We must desperately search for and capture these asymmetric forces left in closed airports or secret hangars throughout the occupied territories. Although we cannot produce new ones due to lack of parts and difficulty in maintenance, these steel hawks flying supersonically with the roar tearing the sky will give the enemy incomprehensible fear and despair."

 ABY_focus_air_4: "Army Aviation"
 ABY_focus_air_4_desc: "We create an aviation unit under the Army that can support operations immediately according to the orders of ground commanders without going through the complex procedures of the Air Force Command. Helicopters and light attack aircraft flying directly above the front line to strike enemy trenches and help the advance of allies will be the most reliable umbrella for infantry. Air power responding immediately to the needs of the field will dramatically increase tactical flexibility. Infantry and aircraft must fight as one."

 ABY_focus_air_5: "Independent Service Spirit"
 ABY_focus_air_5_desc: "The Air Force is not a maid of the Army or a simple support unit. Inspire pride and identity as an independent service that can set and perform independent strategic goals. Strategic bombing striking the enemy's rear and seizing air superiority blocking the activities of enemy planes are unique and lethal areas that only the Air Force can perform. The masters of the sky are us, and we will protect the sky of the motherland without anyone's interference."

 ABY_focus_air_6: "Artillery of the Skies"
 ABY_focus_air_6_desc: "High-precision guided bombing and rocket attacks are like cannons fired from the sky. Strike the top of the enemy's head more distantly, higher, and more accurately than ground artillery restricted by terrain. Even the rear supply bases or command posts the enemies think are safe are within our bombing range. If artillery is the god of the battlefield, aircraft are the king of gods who look down and judge those gods. There is no place to escape the rain of death falling from the sky."

 ABY_focus_air_7: "Ground Strike"
 ABY_focus_air_7_desc: "Focus on operating ground attack aircraft specialized in devastating the enemy's mechanized units, tank corps, and long processions of supply. The attack aircraft, enduring the enemy's anti-aircraft fire with sturdy armor and turning the enemy's steel monsters into scrap metal with powerful anti-tank cannons and missiles, will be no different from grim reapers to the enemies on the ground. No matter how thick the armor a tank wears, it is just prey with no place to run before the hawk of the sky."

 ABY_focus_air_8: "Dogfighting"
 ABY_focus_air_8_desc: "Foster pilots with the best skills and push the machine's mobility to the limit to gain a definite advantage in close aerial combat (dogfighting) with enemy planes. The short moment of shooting down an enemy plane after a fierce turning battle biting the tail and a maneuver defying gravity is the reason for existence and pride of an air force pilot. Cleanly clean the enemy planes polluting our sky by winning the duel of the firmament."

 ABY_focus_air_9: "Air Force Specialization"
 ABY_focus_air_9_desc: "Develop and deploy specialized machines optimized for specific missions rather than multi-role machines that can do everything clumsily. Machines exhibiting the best performance in each field, such as air superiority fighters catching enemy planes, fighter-bombers attacking the ground, and reconnaissance planes collecting information, will dramatically increase the operational success rate. A blade that has mastered one skill and reached the limit of the state is the most sharp and lethal."

 ABY_focus_air_10: "Primal Fear"
 ABY_focus_air_10_desc: "The tearing roar heard from the sky breaks the enemy's morale and puts them in a state of panic even before the bombs fall. Maximize the psychological warfare element by attaching specially produced sirens (e.g., Jericho's Trumpet) to dive bombers. The fear of death plunging vertically from overhead, that primal and instinctive fear exerts an effect more efficient than physical destructive power. Enemies will flee just by hearing that sound."

 ABY_focus_air_11: "God Killer"
 ABY_focus_air_11_desc: "If ground artillery is called the 'god of the battlefield' dominating the battlefield, the Air Force must be the existence that kills that god, namely a 'God Killer.' Neutralize the enemy's core firepower assets such as artillery positions, multiple rocket launchers, and counter-battery radars by making them the priority targets for precision strikes. The moment the enemy's firepower is silenced and their god dies, allies on the ground will be able to advance safely without fear of shelling. The spear that kills the god falls from the sky."

 ABY_focus_air_12: "The Second Front"
 ABY_focus_air_12_desc: "When the ground war falls into a stalemate and is trapped in trenches, the breakthrough to overcome this is in the sky. Define the air as not a simple support space but a second main battlefield, and multi-dimensionally change the aspect of the war through large-scale aviation operations. Multi-dimensional attacks using the sky such as paratrooper drops, large-scale air assaults, and strategic bombing will make the enemy's defense line useless. If you can't win on the ground, win in the sky."

 ABY_focus_air_13: "Guardian of the Highest Place"
 ABY_focus_air_13_desc: "High-altitude interceptors flying at stratospheric heights are the guardians protecting the highest place of the motherland. Do not let the enemy's strategic bombers or reconnaissance planes drop even a single bomb on our territory or peep at our secrets. No matter how high they fly, our interceptor missiles and fighters will shoot them down. Our sky will be iron-cladly protected, and the citizens under it will sleep comfortably. We are the shield of the sky."

### Navy Focus
 ABY_focus_navy_1: "Secure the Coast"
 ABY_focus_navy_1_desc: "We, who have been trapped as a landlocked country for a long time, now have an opportunity in history to open the way to the sea. Overhaul the precious coastline secured with difficulty, and construct modern port facilities and naval bases where large vessels can berth to prepare a foothold for projecting naval power. A country without a sea is like a prison, and giving up the sea is giving up the world. Now we break the door of that prison and vigorously raise the anchor toward the ocean."

 ABY_focus_navy_2: "Absorb Shipbuilding Technology"
 ABY_focus_navy_2_desc: "Our shipbuilding technology is still in its infancy. Actively absorb and research the skilled technicians of the acquired port cities and the long-standing shipbuilding know-how of the Istria region to quickly cultivate independent ship construction capabilities. Do not be ashamed of imitating the technology of other countries. Imitation is the mother of creation, and we will create our own powerful fleet based on their technology. One day the ships we made will roam the seas of the world."

 ABY_focus_navy_3: "Blue-Water Navy"
 ABY_focus_navy_3_desc: "You must not be satisfied with the waves lapping at the coast. Build a true 'Blue-Water Navy' equipped with ocean-going operational capabilities that can go to the far sea to cut the enemy's sea supply lines, directly strike the mainland, and go wherever national interest is. The sea is wide and our ambition is big. Let our flag flutter to the unknown world beyond the horizon, and make the place our fleet passes through become our territorial waters."

 ABY_focus_navy_4: "Defense Navy"
 ABY_focus_navy_4_desc: "With our limited national power and resources, it is realistically impossible to operate a large-scale fleet like the great powers. Rather than chasing vain dreams, foster a small but efficient 'Defense Navy' specialized in coastline defense and near-sea operations to focus on thwarting the enemy's landing attempts. A small but hard hedgehog-like navy armed with mines, coastal guns, and high-speed boats will protect our sea. Coming in might be free, but going out won't be."

 ABY_focus_navy_5: "Form Task Force"
 ABY_focus_navy_5_desc: "We create a task force mixedly organized with destroyers, cruisers, submarines, and support ships to fit the purpose for performing specific missions. A task force moving flexibly and quickly maximizes the efficiency of sea operations and allows for active coping with the ever-changing sea environment. Roam like a pack of wolves on the sea, and when a target is captured, systematically surround and tenaciously bite."

 ABY_focus_navy_6: "Master of the Sea"
 ABY_focus_navy_6_desc: "As history proves, he who dominates the sea dominates the world and seizes wealth. Build a powerful main fleet to completely seize sea control of surrounding waters and control maritime trade routes. Without our permission, not even a single fish, let alone the enemy's material transport ships, will be able to pass through this sea. Our sea will be a sea of peace, or a tomb for enemies. The choice is theirs."

 ABY_focus_navy_7: "Doctrine of the New Era"
 ABY_focus_navy_7_desc: "Between the romance of Big Gun Fetishism and the efficiency of aircraft carrier operation theory, we must find the optimal naval doctrine for us. Research new doctrines that break the existing framework, such as the hit-and-run tactics of missile high-speed boats or asymmetric power operation utilizing submarine power. What catches a big dinosaur might not be a huge Tyrannosaurus, but a nimble and clever pack of Raptors. Neutralize the enemy's giant fleet with innovative tactics."

 ABY_focus_navy_8: "Expand Coastal Fleet"
 ABY_focus_navy_8_desc: "Construct many torpedo boats and patrol ships that are relatively cheap and have short construction periods to build a dense coastal defense network. Formally block the infiltration of enemy submarines or special forces, and safely protect the sea transport routes of allies. The masters of shallow water are not huge battleships, but our fast and agile high-speed boats. Use the complex coastline and islands of the coast to lure and annihilate enemies."

 ABY_focus_navy_9: "Big Gun Fetishism"
 ABY_focus_navy_9_desc: "Huge naval guns and thick armor bouncing off any attack—it's the eternal romance of sea men and a symbol flaunting national power. Push the super-large battleship construction plan that can bring maritime initiative at once and plant fear in the enemy. The blow of the giant gun flying from where it cannot be seen beyond the horizon will deal irreparable damage to the enemy fleet and flip the tide of the battlefield. Big and beautiful cannons are always right."

 ABY_focus_navy_10: "Expand Naval Aviation"
 ABY_focus_navy_10_desc: "The fight on the sea is eventually won by he who dominates the sky. Greatly expand the naval aviation launching from aircraft carriers or coastal land bases. The torpedoes of torpedo bombers and bombs of dive bombers piercing the enemy's anti-aircraft network and being planted will be the most lethal threat to the enemy's giant battleships. Without being tied to naval gun range, strike and submerge the enemy more distantly and first."

 ABY_focus_navy_11: "Wolf of the Sea"
 ABY_focus_navy_11_desc: "A submarine fleet roaming the deep sea secretly is an invisible fear and psychological pressure to the enemy. Paralyze the enemy's sea supply lines through unrestricted commerce raiding operations, and surprise and submerge the off-guard enemy main ships. In the deep and dark abyss, we are preparing the most lethal blow. The moment the enemies are sailing with peace of mind, our torpedoes will tear the bottom of their ship."

 ABY_focus_navy_12: "Maritime Defense Force"
 ABY_focus_navy_12_desc: "We elevate the Navy from a simple combat organization to the Maritime Defense Force, a paramilitary organization protecting territorial waters and maritime sovereignty. Equip a systematic surveillance system and rapid response posture so that they perform pirate eradication and rescue activities in peacetime, and national defense missions in wartime. As the sentinels protecting the peace of the sea, our sea will not allow anyone's illegal intrusion."

 ABY_focus_navy_13: "Shield of Motherland Defense"
 ABY_focus_navy_13_desc: "The Navy is a steel shield protecting the motherland on the sea. To completely preserve coastal cities and the motherland from the enemy's naval bombardment and landing attempts is the most noble reason for the Navy's existence. Where the waves break, we will stand at the very front and block the enemy's attack with our whole bodies. With the resolution that if we collapse, the motherland is ravaged, do not let even a single enemy ship land."

### Industrial Focus
 ABY_focus_industry_1: "Reactivate Industrial Zones"
 ABY_focus_industry_1_desc: "Awaken again the non-stopping machines of the industrial district that miraculously transitioned with the outskirts of Abydos. Although it's only a part of the whole, the technological power and production potential sleeping there are immense. Supply power again and invest idle manpower to recover industrial productivity. The roar of the factory vigorously turning again and the smoke from the chimneys are the heartbeat of national reconstruction that our Abydos Federation is rising from the ruins."

 ABY_focus_industry_2: "Support Large Enterprises"
 ABY_focus_industry_2_desc: "For efficient state-led economic growth, we support large enterprises that already have proven ability and capital with bold tax benefits and subsidies. Utilize their 막강한 capital power and advanced technological power to expand industrial foundation in a short period, and expect the trickle-down effect that the results flow into small and medium enterprises and households. You must raise a giant to carry bigger luggage. Now is the time when selection and concentration are needed."

 ABY_focus_industry_3: "Maintain Balance of 3 Big Enterprises"
 ABY_focus_industry_3_desc: "Neptis' over-technology, Skoda's overwhelming productivity, Rothschild's immense capital power. These three giant enterprises are the three pillars supporting our economy. The government must delicately coordinate so that power does not tilt to one side and break the balance, and use healthy competition between them as the engine of national development. If this precarious but sophisticated tightrope walking succeeds, we will get stronger economic synergy than any other nation."

 ABY_focus_industry_4: "Merge Small Enterprises"
 ABY_focus_industry_4_desc: "Consolidate sprawling petty small and medium enterprises to increase management efficiency and prevent unnecessary overlapping investment. Realize economies of scale to secure competitiveness in the international market, and induce them to have leeway in technological development and facility investment. Just as small streams gather to form a big river, the enterprises that have increased their size through integration will create greater added value and strengthen the waist of the national economy."

 ABY_focus_industry_5: "Expand Bohemia Industrial Zone"
 ABY_focus_industry_5_desc: "Establish a large-scale latest industrial complex in the Bohemia region, a traditional industrial center and where skilled artisans gather. Utilize the existing solid infrastructure and excellent labor force to make this region leap into Europe's largest production base. Factories' chimneys will rise instead of Bohemia's forests, and the smoke blooming from there will symbolize the endless prosperity and power of our federation."

 ABY_focus_industry_6: "Attract Rothschild Finance"
 ABY_focus_industry_6_desc: "War performance and post-war reconstruction require immense funds beyond imagination. Actively attract the global financial network of the Rothschild family, the emperor of European finance, to expand the lacking national finance and increase external credit. You must open the clogged money circulation for the giant of the economy to move. Make the power of gold on our side to raise war costs and accelerate economic growth."

 ABY_focus_industry_7: "Increase Minimum Wage"
 ABY_focus_industry_7_desc: "The domestic market will revive and productivity will also improve only when workers' lives are stable and purchasing power is created. Realize the minimum wage to guarantee workers' human-like living, and quiet the social dissatisfaction due to the gap between rich and poor. Products made by workers who eat well and live well have good quality and high company loyalty. This is an investment for economic growth, not simple welfare."

 ABY_focus_industry_8: "Spin-off Enterprises"
 ABY_focus_industry_8_desc: "It's not about forcibly splitting and weakening large enterprises. Rather, it's a strategy to legally induce octopus-like expansion by spinning off specialized subsidiaries in each business field and maximizing management efficiency and professionalism. The many sturdy branches growing out from the giant root will increase market share in their respective areas, and as a result, make the parent company and the entire national economy even more solid and rich."

 ABY_focus_industry_9: "Develop Austria"
 ABY_focus_industry_9_desc: "Carry out intensive investment in the Austria region where war damage was large or which was relatively alienated from development. Combine the rich hydroelectric resources and minerals of the Alps and the excellent human resources of Vienna to secure a new national growth engine. It's time to create the miracle of the Danube River again. Austria will no longer be a periphery but another central axis of the federation."

 ABY_focus_industry_10: "Reclaim Skoda Industry"
 ABY_focus_industry_10_desc: "Strongly take back the assets, facilities, and technicians of Skoda Works, which were illegally occupied or scattered by other forces during the confusing period, through nationalization measures. Skoda's world-class heavy industry ability and naval gun production technology are the core and pride of our military industry. We must embrace our lost 'iron heart' again and pour out weapons to protect the motherland."

 ABY_focus_industry_11: "Ban Child Labor"
 ABY_focus_industry_11_desc: "No matter how much we are in war, there is a minimum line that must be kept as human beings. Children's fern-like hands should hold pencils, not oily machines. Strictly ban child labor legally, and send them to school to raise them as the pillars who will be responsible for the future of the nation. This will be a more valuable investment than immediate productivity, and prove our moral victory."

 ABY_focus_industry_12: "Corporate Research Cooperation"
 ABY_focus_industry_12_desc: "Integrate the independent technologies and secret laboratories possessed by enterprises into a state-led giant research project. Reduce overlapping investment and increase the speed of technological development through industry-academic-research cooperation to develop innovative weapon systems and new technologies that will surprise the world. Sharing and convergence of knowledge breed new power. Create a structure where the profit of enterprises becomes the profit of the nation."

 ABY_focus_industry_13: "Expand Istria Shipyard"
 ABY_focus_industry_13_desc: "Greatly expand the old shipyard in the Istria region, our only maritime advance bridgehead, and modernize it with latest facilities. Construct a large dock where bigger warships and more transport ships can be built to lay a solid foundation for naval power increase. The small shipyard of the Adriatic Sea will become a giant cradle birthing the blue-water navy. The dream of dominating the sea starts here."

 ABY_focus_industry_14: "Introduce Advanced Refining Technology"
 ABY_focus_industry_14_desc: "Introduce Kivotos' developed chemical technology or advanced countries' oil refining technology to maximize fuel production efficiency. The technology of converting even a single drop of crude oil into high-quality aviation fuel and gasoline without wasting it will allow our mechanized units and air force to perform operations without stopping. Energy efficiency is national power and the key to victory."

 ABY_focus_industry_15: "Produce Transport Ships"
 ABY_focus_industry_15_desc: "Construct a large-scale transport fleet to stably bring in wartime materials from overseas or rapidly transport troops. Expand the merchant fleet that will connect the lifeblood on the sea through the threat of enemy submarines to strengthen maritime supply capacity. Those who silently carry luggage behind the fancy warships are the true hidden heroes sustaining the war."

 ABY_focus_industry_16: "Activate Worker Opinion Submission"
 ABY_focus_industry_16_desc: "The problems and improvement plans of the production site are best known by the workers who turn the machines, not the managers sitting at their desks. Activate labor-management councils and introduce suggestion systems to encourage workers to freely give opinions and improve inefficiency in production processes. A single small idea from an awake worker can innovatively change the productivity of the entire factory."

 ABY_focus_industry_17: "Large Enterprise Group Economy"
 ABY_focus_industry_17_desc: "Bind subsidiaries of similar industries vertically and horizontally to form a giant enterprise group (cartel/chaebol) to create synergy. Intensive investment of capital, technology, and manpower becomes possible, allowing for the performance of national giant projects. Increase the size to possess international competitiveness. It is the same in the economic ecosystem that you live if you unite and die if you scatter."

 ABY_focus_industry_18: "Industrialize Mountainous Areas"
 ABY_focus_industry_18_desc: "Construct underground factories and solid protection facilities in deep mountainous areas safe from the enemy's strategic bombing or nuclear attacks. Industrial zones utilizing the natural fortresses of the Alps and Carpathian Mountains will guarantee the ability to produce weapons without stopping even in the worst wartime situation where the territory is ravaged. We must protect our factories even if we have to carve mountains and dig tunnels."

 ABY_focus_industry_19: "Share Neptis Technology"
 ABY_focus_industry_19_desc: "Induce and support the sharing of over-technology exclusively possessed by the Neptis Group to the civilian industry in general. If Kivotos' advanced technology is grafted onto the local manufacturing industry, it will be able to achieve leapfrogging productivity improvement and quality innovation beyond existing common sense. The technology of the future will innovatively change the industry of the present and lead us to a technological powerhouse."

 ABY_focus_industry_20: "3-Shift Labor"
 ABY_focus_industry_20_desc: "Excessive long-hour labor accumulates worker fatigue, decreasing productivity and causing industrial accidents. Abolish the existing harsh 2-shift work system and pre-emptively introduce a 3-shift system where '8 hours of work, 8 hours of rest' is guaranteed. The improved working environment will raise workers' morale and, in the long term, be the secret to maintaining a more stable and precise high-quality production line. A factory turning 24 hours should be maintained by a rational system, not the sacrifice of workers."

 ABY_focus_industry_21: "Corporate Monopoly"
 ABY_focus_industry_21_desc: "In strategic industry fields directly related to national security or requiring immense investment, recognize the monopolistic position of the leading enterprise. Prevent the waste of national power due to excessive internal competition, and make a national champion enterprise that can compete in the global market through intensive fostering. Sometimes one genius enterprise feeds ten thousand citizens. Fairity can be temporarily set aside for efficiency."

 ABY_focus_industry_22: "3 Big Enterprises Research Cooperation"
 ABY_focus_industry_22_desc: "Let Neptis, Rothschild, and Skoda pull down each other's fences and join hands to conduct joint research projects. The cooperation of this dream team, combining Kivotos' technology, Jewish capital's information power, and Czech industry's know-how, will create innovative results beyond imagination. This is not simple cooperation between enterprises, but a giant leap ahead of the era and an industrial revolution."

### Resource Development Focus
 ABY_focus_building_1: "Restore Infrastructure"
 ABY_focus_building_1_desc: "Rapidly restore roads, railways, and bridges destroyed and cut by the fire of war as a top priority to open the flow of logistics. Without smooth transport networks, resources in the ground, products in factories, and troops at the front cannot move in time. Connecting the blocked blood vessels of the nation and letting blood circulate again is the first step of all reconstruction business. He who paves the way gains wealth."

 ABY_focus_building_2: "Bohemia Steel"
 ABY_focus_building_2_desc: "Greatly develop the rich iron ore deposits of Bohemia to aim for 100% self-sufficiency of raw materials for the iron industry. Without depending on imports, the red stones dug from deep in our ground will pass through the blast furnace and become our tanks, warships, and skyscrapers. Carve the bones of the earth and build the framework of the nation solidly. Steel is national power."

 ABY_focus_building_3: "Moravia-Vitkovice Ironworks"
 ABY_focus_building_3_desc: "Expand the historically famous Vitkovice Ironworks from the Austro-Hungarian Empire era and introduce latest steelmaking facilities. Raise the fire of the blast furnace higher and operate 24 hours to build an empire of steel with the pouring molten iron. This is the heart of our industry and the burning engine producing weapons that will lead the war to victory. Like a non-stopping blast furnace, our passion will not cool."

 ABY_focus_building_4: "Develop Rare Resources"
 ABY_focus_building_4_desc: "Find strategic rare resources such as tungsten, chrome, and aluminum essential for making advanced weapons and aircraft. Strengthen precision geological surveys throughout the country and develop new mines to lower dependence on foreign imports and establish resource security. A single small and shining pebble becomes a powerful force piercing a tank's armor. Tenacity to find even non-existing resources is needed."

 ABY_focus_building_5: "Concentrate Steel Production"
 ABY_focus_building_5_desc: "Prioritize and concentrate all the nation's industrial capacity and resources on steel production. Reduce civilian consumer goods production and convert automobile factories into ironworks support facilities to devote ourselves to steel production only for defense and heavy industry. What we need now is not butter for a comfortable life, but cannons to block the enemy. Only steel can protect us."

 ABY_focus_building_6: "Salzburg Steelworks"
 ABY_focus_building_6_desc: "Construct a new large-scale steelworks in the Salzburg region of Austria to disperse and expand steel production capacity. Establish clean and efficient steelmaking processes using the rich hydroelectric power of the Alps to reduce energy costs. It is to turn the gift of nature given by beautiful mountains and rivers into solid steel. Achieve harmony of nature and industry."

 ABY_focus_building_7: "Sudetenland Steel"
 ABY_focus_building_7_desc: "Overhaul and reactivate the closed mines and ironmaking facilities in the Sudetenland region where Abydos' headquarters is located. Build a stable resource supply-and-demand system so that the steel produced at the closest place can be put into factories and the front most rapidly. Make our front yard into a fortress of steel capable of self-sufficiency. As it is dark under the lamp, do not miss the resources of nearby places."

 ABY_focus_building_8: "Develop Matzen Oil Field"
 ABY_focus_building_8_desc: "Fully develop the oil field discovered in the Matzen region of Austria to secure precious petroleum resources. It is strategically very important to directly pump up the black gold that will move mechanized units and aircraft with our own hands. A single drop of petroleum has the value of a single drop of blood. Pump out the blood of the earth and inject it into our mechanical heart to use as the power for victory."

### Research Focus
 ABY_focus_research_1: "Local Technology Cooperation"
 ABY_focus_research_1_desc: "Kivotos' over-technology is not all-powerful. Respect and cooperate with the sophisticated mechanical engineering technology of Czechia and Austria accumulated over hundreds of years and the know-how of local engineers. When the knowledge of two worlds is combined and their disadvantages are complemented, technological synergy will be doubled. Convergence is the true shortcut to innovation. We will take only the advantages of both worlds."

 ABY_focus_research_2: "Military Use of Drones"
 ABY_focus_research_2_desc: "Independently develop and put reconnaissance and small-scale precision strike drones into the battlefield. Drones that scout dangerous places human soldiers cannot go and perform precise suicide attacks humans cannot do are the core power of future warfare. A small and inconspicuous hummingbird will be the eye and poison stinger that topples a giant. The progress of technology changes the aspect of the battlefield."

 ABY_focus_research_3: "Reverse Engineer Basic Helicopters"
 ABY_focus_research_3_desc: "The helicopters brought from Kivotos are limited in quantity and cannot be used like consumables. By disassembling and precisely analyzing them, we must reverse-calculate a basic design that can be mass-produced at local industry levels. Although it cannot perfectly follow the original's overwhelming performance, the numerous rotary-wing aircraft made with our hands will bring a new wind to the battlefield. Start from imitation and move toward creation."

 ABY_focus_research_4: "Special Forces Drone Operation"
 ABY_focus_research_4_desc: "Maximize operational capability by supplying individual portable small drones to top elite special forces members. The ability to see enemies beyond walls and check traps behind corners will dramatically increase the survival rate of members and mission success rate. The eye watching the enemy from an invisible place leads us to victory. Information superiority is the core of small unit tactics."

 ABY_focus_research_5: "Introduce Kivotos Helicopters"
 ABY_focus_research_5_desc: "Secure original Kivotos-made high-performance helicopter blueprints and core parts from the Neptis Group or the remnants of the defeated Kaiser. These machines equipped with mobility and armament that cannot be mimicked with local technology will be the key to seizing air superiority and ravaging enemy ground forces. Even if it's a technology we cannot understand, it is the best weapon if it can be used. Show the power of true over-technology."

 ABY_focus_research_6: "Improve Infantry Equipment"
 ABY_focus_research_6_desc: "Improve and lighten individual firearms, bulletproof vests, communication equipment, etc., which are directly related to soldiers' survival, with latest technology. Lighter, sturdier, and more powerful equipment will reduce soldiers' fatigue and improve combat efficiency. A small difference in equipment separates a soldier's life and death, and further determines the victory or defeat of a battle. Put the best things in the hands of soldiers."

 ABY_focus_research_7: "Form Mobile Helicopter Unit"
 ABY_focus_research_7_desc: "Create an air assault unit using many transport helicopters. The 'Air Cavalry' that leaps over terrain constraints such as mountains and rivers to strike the enemy's rear and pre-emptively occupy major bases is the flower of modern warfare. Like the Valkyrie descending from the sky and judging the enemy while ringing Wagner's music, give fear where the enemies do not expect."

 ABY_focus_research_8: "Expand Kivotos Technology Research"
 ABY_focus_research_8_desc: "Fully research and attempt military application of Kivotos' advanced technologies such as Mystery energy, optical weapons, and energy shields. Secure overwhelming technological superiority by identifying and weaponizing principles that cannot be understood with current science. Technology like magic in imagination will become our reality and burn away the enemies. He who gets the future first wins."

### Continuous Focus (Total War)
 ABY_continuous_focus_political: "Total War: Strengthen Centralization"
 ABY_continuous_focus_political_desc: "In a wartime situation where the survival of the nation is at stake, powerful and consistent leadership is needed. Temporarily reduce the authority of local governments and assemblies, and concentrate all power in the central government and wartime cabinet to establish a rapid decision-making system. Efficient survival is prioritized over democratic procedures. Only one head and one command can quiet the chaos and overcome the crisis."

 ABY_continuous_focus_command: "Total War: Military Equipment Production"
 ABY_continuous_focus_command_desc: "Go all-in on military material production with all available industrial facilities of the nation. Stop consumer goods production and convert civilian factories into military factories to prioritize quantity over quality control and constantly supply weapons to the front. One more rifle to put in the hands of soldiers is more urgent. Quality is also important, but now is a point when quantity that can overwhelm the enemy is needed."

 ABY_continuous_focus_mobilization: "Total War: Universal Conscription"
 ABY_continuous_focus_mobilization_desc: "Conscript everyone who can hold a gun regardless of gender or age to expand reserve power. No one can be an exception before the crisis of the nation. Not only soldiers in the front but also citizens in the rear are all potential warriors. We will fight for the motherland until the last person. All our citizens are soon soldiers, and the entire territory is a fortress."

 ABY_continuous_focus_war: "Total War: War of Liberation"
 ABY_continuous_focus_war_desc: "Our goal is not simple victory, but to regain everything lost that was taken by the enemy. Do not stop the advance until the enemy is completely driven out of our holy territory and the oppressed compatriots face true liberation. There is no compromise. This war is a holy war for our freedom and dignity, and it's either victory or death."

### Initial Integration and Political Reform
 BA_EU_focus_1: "Euro-Kivotos Community"
 BA_EU_focus_1_desc: "On the ashes of chaos and destruction left by the Great Transition, we must seek a new path for survival. We cannot manage this unprecedented event with old borders and collapsed government systems. Leaders of European nations and representatives of Kivotos academies gather together to solemnly declare the creation of the 'Euro-Kivotos Community,' binding the destinies of the two worlds into one. This goes beyond a simple treaty between nations; it is a giant experiment unprecedented in history to build a new civilization where humanity and Mystery coexist, and the only lighthouse of hope for our survival."

 BA_EU_focus_2: "Truth-Finding Commission"
 BA_EU_focus_2_desc: "The truth behind numerous tragic events, mysterious disappearances, and massacres committed during the process of the two worlds colliding and merging is still buried in darkness. We must launch an independent Truth-Finding Commission to conduct investigations without sanctuary and uncover the buried truth one by one. If we do not soothe the spirits of those who were unjustly sacrificed and wipe the tears of the bereaved families, we will never be able to end the era of distrust and move toward a future of harmony. Only the courage to face the wounds of the past brings true healing."

 BA_EU_focus_3: "War Crimes Commission"
 BA_EU_focus_3_desc: "Those who took advantage of the chaos to ravage innocent citizens and committed crimes against humanity by jumping on the madness of war can never be forgiven. We install a special War Crimes Commission to punish not only Nazi remnants but also all criminals who committed massacres and looting in the chaos of the Great Transition. Regardless of rank, anyone with evidence of a crime will be stood before the judgment of the law, and the blade of justice will ruthlessly question their sins. This is the first declaration ending the era of barbarism and opening the era of the rule of law."

 BA_EU_focus_4: "Trial in Absentia"
 BA_EU_focus_4_desc: "In the realization of justice, the absence of the defendant cannot be an indulgence. Even war criminals who fled across borders or hid by washing their identities using the chaos will not be able to avoid the judgment of the law. We will publicly disclose their crimes to the whole world and deliver historical judgments based on secured evidence and survivor testimony even through trials in absentia. Wherever they hide, we must make it clear that they will forever be on the run with the stigma of 'war criminal.' Justice must not be delayed, nor should it stop."

 BA_EU_focus_5: "European Summit"
 BA_EU_focus_5_desc: "We convene a historical meeting where leaders of each country and representatives of major academy autonomous districts gather to decide the fate of the European continent. Although a heated discussion where different interests and political positions clash sharply is expected, we must move toward the giant cause of 'One Europe' through dialogue and compromise. This meeting place will be the birthplace of suturing the divided past and designing a common future, and the matters decided here will be the cornerstone of a new order."

 BA_EU_focus_6: "Political Mutual Cooperation"
 BA_EU_focus_6_desc: "Recognize the differences in political systems and ideologies formed in each country throughout long history and the unique academy autonomous system of Kivotos, but we must build a close cooperation system under common goals of survival and prosperity. By regularizing high-level meetings and practitioner exchange programs, we will increase mutual understanding and build trust, thereby reducing unnecessary diplomatic friction and misunderstanding. Cooperation blooming on the foundation of recognizing difference has the strongest cohesion."

 BA_EU_focus_7: "Organize Informal Meetings"
 BA_EU_focus_7_desc: "In order to discuss sensitive and complex issues that are difficult to solve only with stiff protocol and official diplomatic channels, we prepare an informal dialogue window between leaders. Candid exchanges of opinions in meetings without formality can sometimes be the key to breaking through a clogged political situation and finding practical solutions. These efforts of communication taking place under the surface will be the lubricant that flexibly moves the giant alliance."

 BA_EU_focus_8: "Form Transnational Party Alliance"
 BA_EU_focus_8_desc: "To discuss policies and share visions at a pan-European level beyond the narrow interests of individual nations, we encourage political parties with similar ideologies to form alliances across borders. This goes beyond a simple partnership between parties and will be the foundation for forming transnational political forces within the European Parliament and leading pan-European agendas. A party alliance united by values and ideologies rather than ethnicity and nation will be a powerful engine of European political integration."

 BA_EU_focus_9: "Organize European Parliament"
 BA_EU_focus_9_desc: "We organize the 'European Parliament' as the highest legislative body to represent the political will of all European citizens and students. This hall of democracy, where lawmakers democratically elected from each country and autonomous district gather to debate fiercely and vote on alliance bills, will be our most powerful weapon to secure the legitimacy of our community. This system, which decides the future not with swords and spears but with votes and debate, is the highest value we must protect."

 BA_EU_focus_10: "Organize European Council"
 BA_EU_focus_10_desc: "We install the 'European Council' composed of the heads of government of each member state to decide the main policy directions and strategic priorities of the alliance. The Council, as the highest decision-making body of the European Union, will coordinate complex interests between member states and exert rapid and powerful leadership in crisis situations. The wisdom of the Council, leading to speak with one voice while respecting the sovereignty of each country, is more desperate than ever."

 BA_EU_focus_11: "Allocation of Seats"
 BA_EU_focus_11_desc: "The issue of allocating seats in the European Parliament is a very sensitive and important task that determines the democratic legitimacy of the alliance. We must solve a complex equation that not only considers simple population proportion but also protects the interests of small nations and balances political weight between locals and Kivotosians. Establish fair and rational distribution principles so that no side feels alienated, and build a representative democracy system that all members can accept."

 BA_EU_focus_12: "Grant Transnational Authority"
 BA_EU_focus_12_desc: "In order for the European Union to function as an integrated body with real power beyond a union of nations in name only, member states must boldly transfer part of their sovereignty to the alliance. Entrusting decision-making power in core fields such as diplomacy, defense, and currency to a central body will be a painful decision, but it's an unavoidable choice for greater prosperity and solid security. Yield the small sovereignty of individual nations to establish the giant sovereignty of Europe as a whole."

 BA_EU_focus_13: "All-front Eligibility for Office"
 BA_EU_focus_13_desc: "We guarantee the right to be elected for European Parliament elections to any European citizen regardless of the country or autonomous district they reside in. This innovative measure, breaking the walls of nationality, will give birth to true 'pan-European politicians' representing the interests of Europe as a whole, not those of a specific country. A political climate evaluated by ability and vision rather than origin will accelerate the integration of Europe."

 BA_EU_focus_14: "Hold Regular Meetings"
 BA_EU_focus_14_desc: "Regularize the meetings of the European Parliament and Council to build a predictable and stable political system. Meetings and debates regularly taking place according to a set schedule will facilitate communication between member states, strengthen cohesion, and ensure that the alliance's policies are promoted without shaking. Governance by system is the most certain way to remove uncertainty and guarantee the sustainability of the alliance."

 BA_EU_focus_15: "All-front Voting Rights"
 BA_EU_focus_15_desc: "Grant all European citizens the right to vote in the region they currently reside in regardless of their nationality. Workers and immigrants who move freely across borders to work and live must also be able to participate in policy decisions that affect their lives as proud members of the alliance. The expansion of suffrage will make the roots of democracy go deeper and wider."

 BA_EU_focus_16: "European General Election"
 BA_EU_focus_16_desc: "After long preparation, we finally hold the historical first general election taking place simultaneously throughout Europe. This giant festival of democracy, where hundreds of millions of voters head to the polling stations, will be the moment to declare to the whole world that we are no longer a collection of divided nations but 'citizens of a united Europe.' The fact that representatives picked by our hands decide the future of Europe will bring us pride and hope."

### Economic and Labor Reform
 BA_EU_focus_17: "Mimic Kivotos Currency System"
 BA_EU_focus_17_desc: "Benchmark Kivotos' advanced financial system and sophisticated currency management system to fundamentally improve the constitution of the European economy, which was impoverished after the war. The introduction of digital payment systems, transparent money flow tracking, and efficient currency management techniques will blow new vitality into the old and inefficient financial blood vessels of Europe. The combination of technology and finance will leap our economy one step further."

 BA_EU_focus_18: "Introduce Kivotos Labor Law"
 BA_EU_focus_18_desc: "Referencing Kivotos' advanced labor ethics and regulations that emphasize students' rights and autonomy, we massively improve Europe's pre-modern and backward labor environment. Treating workers as personalities to be respected rather than simple parts, and strengthening human rights and welfare, is a mandatory condition for productivity improvement and social grand compromise. Products made by happy workers have the best competitiveness."

 BA_EU_focus_19: "Central Bank"
 BA_EU_focus_19_desc: "Establish an independent 'European Central Bank (ECB)' to oversee the monetary policy of the entire European Union and supervise financial markets. This command center of finance, which maintains price stability, resolves economic gaps between member states, and defends the value of the Euro in crisis situations, will be the last bastion protecting the stability of the European economy. Integration of monetary sovereignty means the completion of economic integration."

 BA_EU_focus_20: "Initiate Euro-Yen"
 BA_EU_focus_20_desc: "Promote the introduction of a new single reserve currency, 'Euro-Yen,' combining Europe's giant economic scale and Kivotos' overwhelming technological power. This powerful and reliable currency will challenge dollar hegemony and turn the global flow of capital back to Europe. Currency is not a simple means of exchange but a symbol of national power, and the Euro-Yen will be the flare announcing our resurrection."

 BA_EU_focus_21: "European Coal and Steel Community"
 BA_EU_focus_21_desc: "By having a transnational body jointly manage steel and coal, which are essential strategic materials for performing war, we fundamentally block the possibility of war between member states and prepare the foundation for industrial development. Resources that in the past made us point muzzles at each other will now be common assets for peace and prosperity. This goes beyond simple economic cooperation; it is the most certain guarantee for permanent peace."

 BA_EU_focus_22: "Remove Tariff Barriers"
 BA_EU_focus_22_desc: "Boldly abolish all tariff and non-tariff barriers that blocked trade between member states and lowered economic efficiency to form a giant single market. The free movement of materials without borders will increase enterprises' competitiveness and provide consumers with cheaper and more diverse goods. Integration of the market is the most certain way to grow the pie of the European economy."

 BA_EU_focus_23: "Execute Currency Reform"
 BA_EU_focus_23_desc: "Organize the old, complex, and inefficient currencies that lost value due to inflation, and execute a forced transition to a new single currency. Although there will be confusion and backlash initially, the unified currency system will reduce transaction costs, promote investment, and ultimately be a powerful glue binding the European economy into one. New flesh does not sprout without the pain of carving bone."

 BA_EU_focus_24: "Joint Production, Joint Consumption"
 BA_EU_focus_24_desc: "In order to avoid unnecessary overlapping investment between nations and realize economies of scale, build a division of labor system specialized by industry. Each country focuses on fields they can do best to produce the best products and increases the wealth of Europe as a whole by sharing those results in a single market. Through cooperation rather than competition, and sharing rather than monopoly, we can create a more prosperous future."

 BA_EU_focus_25: "Open Borders"
 BA_EU_focus_25_desc: "Inherit and develop the spirit of the Schengen Agreement to remove all border checkpoints and barriers between member states. The right to travel, work, and study freely without passports or visas will be one of the largest and most practical benefits European citizens can enjoy. In places where physical borders have disappeared, people and ideas will flow freely and create innovation."

 BA_EU_focus_26: "European Finance"
 BA_EU_focus_26_desc: "Build a giant single financial network connecting London, Frankfurt, Paris, and the financial hubs of autonomous districts to let the flow of capital be smooth without blockage. The integrated European financial market will provide more investment opportunities to enterprises, provide a springboard for growth to startups, and operate as a powerful engine for European economic growth. Opportunities arise where money turns."

 BA_EU_focus_27: "Resource Development Community"
 BA_EU_focus_27_desc: "To secure energy security and lower external dependence, jointly promote all natural resource development within the continent. From oil fields in the North Sea to rare earth mines in Eastern Europe, all resources buried in the land and sea of Europe will be systematically managed as common assets of the alliance as a whole, not as the possession of a specific country. Block the weaponization of resources and build a stable supply chain."

 BA_EU_focus_28: "Unified European Economy"
 BA_EU_focus_28_desc: "Finally achieve a fully integrated form of economic union where fiscal, monetary, trade, and industrial policies are integrated into one. Based on a giant domestic market, powerful purchasing power, and advanced technological power, Europe will leave behind the past when it was pushed to the periphery and stand tall once again as the central axis of the world economy. Our economic power will exert influence more powerful than any military power."

 BA_EU_focus_29: "Court of Auditors"
 BA_EU_focus_29_desc: "Install a powerful and independent auditing body to monitor whether the alliance's immense budget is executed transparently and efficiently. Thoroughly monitor so that not even 1 Euro of tax is wasted or embezzled, and if illegal use is caught, strictly question responsibility. Clean fiscal operation is the only way to gain citizens' trust and maintain the legitimacy of the alliance."

 BA_EU_focus_30: "Distribute Joint Budget"
 BA_EU_focus_30_desc: "Introduce a powerful fiscal adjustment system that helps economically backward countries or regions with funds contributed by wealthy nations to resolve regional imbalances. This is not simple aid, but an investment for balanced development and cohesion of Europe as a whole. Fair budget distribution based on the spirit of solidarity is the most important moral pillar supporting the European Union."

 BA_EU_focus_31: "Budget Censorship"
 BA_EU_focus_31_desc: "To prevent national bankruptcy crises due to reckless populism policies or negligent fiscal operation, we hold the authority to pre-emptively review and issue modification recommendations on the budget plans of each country's government at the alliance level. Fiscal health is a principle that can never be compromised for the economic stability of the alliance as a whole, and the failure of one country must be prevented from spreading like dominoes."

 BA_EU_focus_32: "Resource Sharing"
 BA_EU_focus_32_desc: "Build an emergency response system where member states preferentially share essential survival resources such as food, energy, and medicine in crisis situations such as war, disaster, or pandemic. We are a community of destiny sharing and overcoming not only joy but also pain and crisis together. Just as a friend who helps in difficulty is a true friend, our solidarity will shine brighter in crisis."

 BA_EU_focus_33: "Introduce Planned Economy"
 BA_EU_focus_33_desc: "To achieve rapid recovery after the war and rapid industrialization, we take the free market economy as basic but temporarily introduce elements of a pan-European planned economy. Active and strategic intervention of the government is needed to complement market failure, intensively foster national strategic industries, and efficiently allocate resources. There are times when a visible hand is needed more than an invisible hand."

 BA_EU_focus_34: "Grant Transnational Auditing Rights"
 BA_EU_focus_34_desc: "Grant the alliance auditing body the powerful authority to directly conduct field audits on public institutions of member states and enterprises receiving support from the alliance. Thorough audits that do not care about borders or sanctuaries will be the most certain means to break the chains of corruption and increase the transparency of administration. Flowers of integration do not bloom in corrupt places."

 BA_EU_focus_35: "Expand Industrial Complexes"
 BA_EU_focus_35_desc: "Create success models of economic cooperation by establishing large-scale multinational industrial complexes in border areas or backward regions. Factories where workers and technicians of different nationalities sweat and work together to produce products will be spaces symbolizing harmony and integration between ethnicities beyond economic profit. People working together do not point guns at each other."

 BA_EU_focus_36: "Joint Development Plan"
 BA_EU_focus_36_desc: "Establish a long-term joint development plan to develop relatively backward Eastern or Southern European regions and upwardly standardize the social infrastructure of Europe as a whole. Our final goal is to ensure that every European citizen enjoys equal opportunities and high quality of life wherever they live on the continent. The benefits of prosperity must not be the exclusive property of a specific country."

 BA_EU_focus_37: "Dispatch Auditors"
 BA_EU_focus_37_desc: "Station auditors belonging to the alliance at major project sites where the European Union budget is invested and at administrative agencies of each country. Operate a field-oriented surveillance system that hears the vivid voices of the field, not reports on paper, and immediately captures and corrects inefficiency or corruption issues. When there is a supervisor watching in front of eyes, administration becomes more honest."

 BA_EU_focus_38: "European Economic Area"
 BA_EU_focus_38_desc: "Form a giant wide-area economic block encompassing surrounding countries such as the Mediterranean coast, North Africa, and the Middle East beyond European Union member states. Expand Europe's economic territory through free trade agreements and technical partnerships, and broaden geopolitical influence. Our market is not trapped in the continent and is open to the world."

 BA_EU_focus_39: "Labor Authority"
 BA_EU_focus_39_desc: "Newly establish the 'European Labor Authority' to integratedly manage the labor market throughout Europe and coordinate employment policies. Protecting the rights of workers crossing borders, solving unemployment issues, and creating high-quality jobs suitable for future industries are among the highest priorities of the alliance. Labor is not a commodity, and workers are the protagonists of our economy."

 BA_EU_focus_40: "Industrial Mechanization"
 BA_EU_focus_40_desc: "Actively introduce Kivotos' developed automation technology and robotics into industrial sites to dramatically increase the productivity of factories. Dangerous and hard simple repetitive labor will be entrusted to machines, and humans will focus on more creative and valuable work. Productivity improvement through technological innovation becomes the material foundation for shortening labor hours and improving quality of life."

 BA_EU_focus_41: "8-Hour Labor"
 BA_EU_focus_41_desc: "To guarantee workers' health and human-like life, we legally establish and strictly apply the historical principle of '8 hours of work, 8 hours of rest, 8 hours of sleep.' Overwork death, grinding humans like consumables for profit, is now a trace of barbarism that must disappear into history. A life with rest makes higher efficiency."

 BA_EU_focus_42: "Employment and Labor Bureau"
 BA_EU_focus_42_desc: "Expand and reorganize the employment and labor bureau to systematically support the vocational training and re-employment of unemployed workers, and establish a fair recruitment culture without discrimination. We will create a society where anyone with the will to work can find a job suitable for their ability, and a society that gives a chance to rise again even after failure."

 BA_EU_focus_43: "Industrial Safety Regulations"
 BA_EU_focus_43_desc: "Dramatically improve dangerous work environments and enact strict industrial safety regulations followed by powerful punishment in case of violation to zero-out industrial accidents. Workers' lives and safety are absolute values prioritizing any corporate profit or economic performance. In a workplace that is not safe, no work must be carried out."

 BA_EU_focus_44: "5-Day Work Week"
 BA_EU_focus_44_desc: "To guarantee workers sufficient leisure time and time with family, we introduce a 5-day work week system in all industry fields. Sufficient rest and work-life balance (WLB) will not only increase labor productivity but also be the core link of economic virtuous cycle that promotes leisure industry development and internal consumption."

 BA_EU_focus_45: "Support Labor-Management Negotiation"
 BA_EU_focus_45_desc: "Operate a professional mediation body to resolve conflicts between labor and management through productive dialogue rather than consumptive confrontation, and create a culture of win-win. Stability of labor-management relations, finding a rational point of agreement through dialogue and compromise instead of extreme means such as strikes and lockouts, is a mandatory element for sustainable economic development."

 BA_EU_focus_46: "Injury Support Fund"
 BA_EU_focus_46_desc: "Massively strengthen the social security system that supports sufficient medical expenses and living expenses to workers who are injured or fall ill during work at industrial sites. The nation and enterprises must be a reliable support that takes responsibility for industrial warrior workers when they fall due to an unexpected accident until they return to the workplace healthily."

 BA_EU_focus_47: "Legalize Labor Unions"
 BA_EU_focus_47_desc: "Surely guarantee the right to organize, right to collective bargaining, and right to collective action for all workers as constitutional rights. Healthy and democratic labor unions are important partners that check the tyranny of enterprises, represent workers' interests, and realize social justice. A society without oppressed workers is a truly free society."

 BA_EU_focus_48: "Advanced Labor Law"
 BA_EU_focus_48_desc: "Enact the 'European Labor Charter' containing world-best level worker protection regulations combining the advantages of Europe and Kivotos. Europe will be not only a good place to do business but also a continent where workers are most respected and can work happily. Our labor standards will be a new global standard that the whole world should follow."

### Social and Cultural Integration
 BA_EU_focus_49: "Federal District Jurisdiction Meeting"
 BA_EU_focus_49_desc: "Regularly convene jurisdiction meetings to efficiently manage federal direct control districts and autonomous districts scattered throughout Europe, and coordinate conflicts between center and local, and between regions. This meeting will be a place to realize grassroots democracy by removing administrative blind spots through constant communication and consultation with local governments rather than unilateral instructions from the central government."

 BA_EU_focus_50: "Restore Cultural Heritage"
 BA_EU_focus_50_desc: "Promote a massive project to restore precious cultural heritage destroyed or looted and scattered by the calamity of war, and bring them back to their original places. Our brilliant cultural heritage is not simple old objects, but the root sustaining the identity and pride of Europeans. Re-stacking collapsed stonework is re-establishing our pride."

 BA_EU_focus_51: "Recognize Cultural Particularity"
 BA_EU_focus_51_desc: "Instead of forced and uniform integration, respect and encourage the unique cultural traditions and languages of each ethnicity, region, and academy autonomous district. Diversity is not a seed of division, but a nutrient making European culture even more rich and colorful. When we recognize and enjoy each other's differences, we can realize the true European spirit of 'Unity in Diversity.'"

 BA_EU_focus_52: "Adjust Borders"
 BA_EU_focus_52_desc: "Peacefully readjust irrational borderlines drawn as a legacy of the past imperialism era or as a result of war, considering historical context and current ethnic distribution. We must end the tragedy created by lines forcibly drawn on maps, and prepare a foundation for permanent peace by confirming rational and natural boundaries according to the democratic will of relevant local residents."

 BA_EU_focus_53: "Confiscate Ammunition"
 BA_EU_focus_53_desc: "The immense amount of ammunition released to the civilian population without control after the Great Transition is like a time bomb that doesn't know when it will explode. We must take powerful measures to forcibly collect and discard excessive ammunition possessed by civilians to prevent accidental armed conflicts and crimes. A gun without bullets is just a club. We must erase the gunpowder smell permeating throughout society and fill it with air of peace."

 BA_EU_focus_54: "Connect Point Organizations"
 BA_EU_focus_54_desc: "Bring resistance and vigilante organizations that were active deep underground under occupation into the light, and incorporate them into legal social groups or reserve organizations. The indomitable patriotism and sticky organizational power they showed during the dark ages are precious energy for national reconstruction. We must now grant shining medals and social roles to those who fought in the shade."

 BA_EU_focus_55: "Strengthen Public Power"
 BA_EU_focus_55_desc: "In order to re-establish the legal order collapsed by war and chaos, massively increase police personnel and modernize the security system by introducing advanced equipment and forensic investigation techniques. A nation that cannot protect its citizens from crime and violence has no value for existence. Re-establishing the dropped authority of public power through fair law enforcement is the first step to protecting citizens' safe daily lives."

 BA_EU_focus_56: "Migration Support Fund"
 BA_EU_focus_56_desc: "Pay comprehensive settlement support funds including housing costs, living expenses, and vocational training costs so that refugees and displaced persons who lost their livelihoods due to war can sprout new hope in a strange land. Helping them stand as proud members of society rather than alienated strangers is an industrial humanitarian responsibility of the nation and the most certain investment for social integration."

 BA_EU_focus_57: "Guarantee Section Passage Rights"
 BA_EU_focus_57_desc: "Issue special passage permits ensuring the safe and free movement of civilians even within regions where conflict still remains or areas controlled by military necessity. The ordinary daily life of meeting scattered family and continuing livelihoods is a human right that must be maximally protected in any emergency situation. Even if the road is blocked, the traffic of people must not be cut."

 BA_EU_focus_58: "Conduct Free Elections within Academies"
 BA_EU_focus_58_desc: "Induce and monitor the election of student council officers according to transparent and democratic procedures even within Kivotos academy autonomous districts where a small number of strongmen ruled. The principle of democracy, not the logic of power, must be applied to all places without exception. The experience of realizing autonomy through representatives directly picked by students will grow them into future democratic citizens."

 BA_EU_focus_59: "Free Traffic"
 BA_EU_focus_59_desc: "Completely iron out all kinds of restrictions and barriers that blocked the movement of people and materials within the European continent. Freedom of travel is a basic human right, and people from different regions freely coming and going to exchange and understand culture is the fastest way to true integration. Europe will become one on the open road."

 BA_EU_focus_60: "Transnational Autonomous District"
 BA_EU_focus_60_desc: "Designate and operate special autonomous districts that do not belong to the sovereignty of a specific country and are directly managed by the European Union. This will be an experimental site for transnational administration where multi-ethnicities and multi-cultures coexist and Kivotos' mystery and European traditions merge. This autonomous district, like a model house showing what future Europe will look like, will be a symbol of innovation and coexistence."

 BA_EU_focus_61: "Install Federal Districts"
 BA_EU_focus_61_desc: "Create a giant federal administrative district where the legislative, administrative, and judicial bodies of the European Union gather to perform capital functions. Brussels, Strasbourg, or a third city will be born again as the new heart of Europe, playing a role as a central neural network blowing vitality into the entire continent. This is not a simple city, but a space where European dreams are realized."

 BA_EU_focus_62: "Cultural Discipline Commission"
 BA_EU_focus_62_desc: "Launch an independent commission to monitor and regulate cultural conflicts, hate speech, and discriminatory acts that may occur in the rapid integration process. It is a social agreement body to establish a culture of tolerance and respect that respects freedom of expression but does not tolerate acts of trampling on others' dignity. We must go beyond hate and create a language of coexistence."

 BA_EU_focus_63: "Add Self-Defense Clause"
 BA_EU_focus_63_desc: "Prepare a bill to greatly expand the recognition range of self-defense so that citizens can protect themselves, their families, and neighbors from crime or life threats in urgent situations where public power cannot reach. The nation has an obligation to protect the safety of citizens, but it must also respect and guarantee the natural right of citizens to protect themselves."

 BA_EU_focus_64: "Form Autonomous Cabinet"
 BA_EU_focus_64_desc: "Allow the formation of independent cabinets elected by relevant local residents for customized administration reflecting the particularity of each federal district and autonomous district. Local decentralization, where people who best know the local situation solve local problems themselves rather than uniform control from the central government, will be a fertilizer making the roots of democracy sturdy."

### Security and Military Integration
 BA_EU_focus_65: "Gun Registration System"
 BA_EU_focus_65_desc: "Make registration of all civilian-owned guns distributed in the market mandatory to remove blind spots in weapon management and strengthen gun owners' responsibility. It is the very basic of security maintenance for the nation to accurately grasp who has what weapon where. Unregistered 'ghost guns' only become tools of crime. Only transparent management can prevent gun accidents."

 BA_EU_focus_66: "Reorganize Districts"
 BA_EU_focus_66_desc: "Without being tied to past administrative districts, rationally readjust police jurisdictions by scientifically analyzing actual security demand, population change, and distribution of crime-prone areas. Efficient personnel allocation will dramatically increase crime response speed and improve the quality of security services, increasing citizens' satisfaction. Just as crime has no borders, there must be no gap in the police response."

 BA_EU_focus_67: "Ban Automatic Weapons"
 BA_EU_focus_67_desc: "Completely ban civilian possession and immediately collect military weapons such as automatic rifles, submachine guns, and machine guns that can cause mass killing in a short time. We can no longer neglect lethal weapons that should only be used on battlefields roaming around on peaceful streets. Excessive armament threatening citizens' safety is not freedom but license, and a cause of fear."

 BA_EU_focus_68: "Simplify Inspection Procedures"
 BA_EU_focus_68_desc: "Reduce excessive stop-and-search that gives citizens unnecessary intimidation and delays movement, and simultaneously increase the speed and accuracy of security search by introducing latest facial recognition technology and scanning equipment. A smart security system must be built that minimizes citizens' daily inconvenience while effectively blocking the movement of terrorists or criminals. Freedom and safety can coexist."

 BA_EU_focus_69: "Improve Non-Lethal Rounds"
 BA_EU_focus_69_desc: "Develop and supply high-performance non-lethal suppression equipment such as rubber bullets, Taser guns, and acoustic cannons to reduce unnecessary human damage that may occur in the process of suppressing protests or arresting criminals. Public power must exist to protect citizens, not to hurt or kill citizens. Suppressing criminals but respecting life is the standard of advanced security."

 BA_EU_focus_70: "Operate State-Run Gun Shops"
 BA_EU_focus_70_desc: "Abolish private gun shops that indiscriminately sell guns for profit, and make it possible to purchase guns only limitedly through strict screening only through state-run gun shops directly managed by the nation. It is a powerful measure to pre-emptively block guns from entering the hands of criminals or mentally ill people by transparently controlling the entire process of weapon distribution by the nation."

 BA_EU_focus_71: "Compensate Military Enterprises"
 BA_EU_focus_71_desc: "Support business transition funds to military enterprises that will be economically hit by powerful gun regulation policies, or preferentially conclude military equipment supply contracts to compensate for losses. This is a strategic incentive to reduce the industry's backlash against policy and convert their technological power and production facilities for the public purpose of national defense increase."

 BA_EU_focus_72: "Smart Guns"
 BA_EU_focus_72_desc: "Make the application of smart gun technology, which can only be fired by legitimate users whose biometric information such as fingerprints or veins are registered, mandatory for all new guns. Through this, it's possible to pre-emptively block stolen or lost guns from being misused by criminal organizations or accidental firing accidents due to children's curiosity. Technology will be an excellent case for protecting safety."

 BA_EU_focus_73: "Gun-Free Zones"
 BA_EU_focus_73_desc: "Designate major multi-use facilities where many citizens gather, such as schools, hospitals, public offices, and religious facilities, as 'Gun-Free Zones' and strictly ban gun entry for any reason. Increasing safe zones where citizens can live and act with peace of mind without the fear of mass shootings is a basic condition of civilized society."

 BA_EU_focus_74: "50-Year Weapon Regulation Plan"
 BA_EU_focus_74_desc: "It is impossible to eliminate guns spread over decades in a short period. Establish a long-term and step-by-step plan over half a century to gradually reduce civilian-owned guns and change gun culture, ultimately creating a 'peaceful society without weapons.' This plan, which our generation starts and the next generation completes, will change the future of Europe."

 BA_EU_focus_75: "European Union Army"
 BA_EU_focus_75_desc: "Integrate each country's army to create the 'European Union Army (EAF)' with a single command system. This is an independent defense body replacing NATO away from dependence on the US, and a powerful force that will defend Europe's sovereignty and territory from external threats. The European army gathered under one flag will be a reliable shield protecting world peace."

 BA_EU_focus_76: "European Border Guard"
 BA_EU_focus_76_desc: "Organize a professional 'European Border Guard' to jointly defend the external borders of the European Union to cope with refugee issues, smuggling, and international terror threats that individual countries are hard to handle. An iron-clad guard posture encompassing land and sea will be a prerequisite for protecting the gateways of Europe and guaranteeing free traffic inside. A sturdy fence makes a safe house."

 BA_EU_focus_77: "European Coast Guard"
 BA_EU_focus_77_desc: "Operate an integrated 'European Coast Guard' to monitor Europe's vast territorial waters and exclusive economic zones, and perform sea rescue missions and crackdown on illegal fishing. The sea is our resource and a passage of life. Those who establish the legal order of the sea by fighting rough waves will protect our sea as a peaceful and rich place."

 BA_EU_focus_78: "European Air Defense Force"
 BA_EU_focus_78_desc: "Build a spider-web-like radar network and air defense missile system covering the entire Europe without gaps, and install an air defense command to integratedly command it. Not a single enemy plane or missile can invade our airspace without permission. The eyes and fists watching and protecting the sky 24 hours without sleeping will gift citizens a night when they can sleep with peace of mind."

 BA_EU_focus_79: "Integrate Halo Legions"
 BA_EU_focus_79_desc: "Integratedly manage Halo-possessed troops that were scattered in each country and operated independently into the 'Special Operations Command' under the European Union Army. The superhuman combat power of those with mysterious abilities will perform special missions that cannot be solved with conventional power, becoming the strongest spear and hidden weapon protecting Europe. Scattered it's dangerous, but united it's invincible."

 BA_EU_focus_80: "PMC Registration Act"
 BA_EU_focus_80_desc: "Bring private military companies (PMCs), which were active indiscriminately and were not controlled in the chaos of war, into the boundary of the law. Introduce strict registration requirements and transparent management supervision system to make them act as reliable partners complementing national security, not mercenary groups only chasing money. Power must be followed by responsibility."

 BA_EU_focus_81: "Unified Halo Command"
 BA_EU_focus_81_desc: "Newly establish a dedicated integrated command that deeply understands the characteristics of Kivotos-origin troops and local troops and can organically combine and efficiently operate them. This new form of hybrid army, where the power of mystery and modern tactics harmonize, will show unprecedented combat power beyond existing military common sense. This is the evolution of war."

 BA_EU_focus_82: "PMC Emergency Mobilization Act"
 BA_EU_focus_82_desc: "Prepare a legal basis for the nation to immediately requisition the resources and personnel of registered PMCs and put them into operations with the regular army in crisis situations such as national emergencies or large-scale invasions. In a crisis situation where survival is at stake, the enemy must be blocked by totalizing all available power. Survival comes before contracts."

 BA_EU_focus_83: "European Army Command"
 BA_EU_focus_83_desc: "Install the 'European Army Supreme Command' to totally command all ground operations on the European continent. Create a true allied army fighting for the victory of the alliance as a whole rather than the interest of the origin country, by appointing competent officers as commanders regardless of nationality only according to ability and experience. They use various languages, but the command is one."

 BA_EU_focus_84: "European Navy Command"
 BA_EU_focus_84_desc: "Create the 'European Navy Command' to protect all seas of Europe encompassing the Mediterranean, Atlantic, North Sea, and Baltic Sea. Broaden the operational radius and strengthen maritime control by integratedly operating the fleets of each country, realizing the lesson of history that he who dominates the sea moves the world. Our fleet will be a peacekeeper of the ocean."

 BA_EU_focus_85: "European Air Force Control Department"
 BA_EU_focus_85_desc: "Launch the 'European Air Force Control Department' to lead Europe's airspace defense and aviation operations, and further future space development. Secure aerial superiority by integratedly managing advanced fighters and satellite systems, and lead to ensure that Europe's challenge toward the sky and space does not stop. Watch the future of Europe from the highest place."

 BA_EU_focus_86: "Integrate Command Authority"
 BA_EU_focus_86_desc: "For rapid and consistent operation performance in emergencies, unify the command system by delegating wartime operational control of each country's army to the Supreme Commander of the European Union Army. At an urgent moment when life and death are crossed, only an army moving in an orderly fashion according to one clear command instead of complex consultation procedures can win. Efficient command saves soldiers' blood."

### Law and Judicial Integration
 BA_EU_focus_87: "Mimic International Law"
 BA_EU_focus_87_desc: "Based on the existing international law system proven for a long time, we introduce it by modifying and supplementing it to fit the special reality of the European Union, which is the fusion with Kivotos. Instead of making law from bare ground, establishing a new legal order on the wisdom and norms mankind has accumulated is the wisest way to reduce trial and error and secure legal stability."

 BA_EU_focus_88: "Initiate Union Law"
 BA_EU_focus_88_desc: "Enact 'Union Law' that is located higher than the domestic law of all member states and has direct binding force. This Union Law, prioritizing over the interests or customs of individual nations, will be a powerful belt binding Europe into one legal community and the unshakable legal foundation of integration. Equality before the law also applies between nations."

 BA_EU_focus_89: "Legislation"
 BA_EU_focus_89_desc: "Pour out integrated bills encompassing various fields such as environment, human rights, digital, and energy through the European Parliament. Law is a frame defining society and drawing the future. We are breaking old frames and weaving a fair and innovative legal base suitable for the new Europe. The hammer sound of the parliament makes a new history."

 BA_EU_focus_90: "Consult Kivotos International Law"
 BA_EU_focus_90_desc: "In-depthly research advanced legal cases and precedents of Kivotos where existences with superhuman power coexist, and prepare clear standards to resolve unprecedented legal disputes such as abuse of mystery power and halo destruction. Borrow legal wisdom dealing with mysterious power to prevent chaos and establish order."

 BA_EU_focus_91: "Law above the State"
 BA_EU_focus_91_desc: "Surely establish constitutionally that the rulings of the European Union Court and Union Law are superior to the constitutions or laws of member states. This is the most decisive and irreversible step to move toward a true federal state beyond a union of individual sovereign nations. We become one by law."

 BA_EU_focus_92: "Negotiation Intervention Right"
 BA_EU_focus_92_desc: "The European Union holds the authority to directly intervene to mediate in interest conflicts between member states or important diplomatic negotiations with third countries, or to stand as a representative. Divided voices are weak, but the united voice of Europe is powerful. We will now negotiate with the world with one giant mouth, not 27 small mouths."

 BA_EU_focus_93: "Organize European Constitution"
 BA_EU_focus_93_desc: "Configure the historical 'European Constitution' enactment committee to define the values and ideologies the European Union pursues, basic rights of citizens, and governance structure. This is not a simple law code, but a founding document announcing the birth of a new empire and a promise containing the soul of our community. Carve our dreams into characters."

 BA_EU_focus_94: "Independent Investigative Power"
 BA_EU_focus_94_desc: "Without being swayed by the external pressure of each country's government or political power, establish a powerful and independent 'Federal Investigation Body' that can independently investigate corruption, terror, and organized crime crossing borders. Re-establish justice through investigations without sanctuary, and strictly punish those who try to reign over the law."

 BA_EU_focus_95: "Treaty Control"
 BA_EU_focus_95_desc: "Exercise the authority to pre-emptively review and approve whether treaties member states individually conclude with third countries run contrary to the interest or security of the alliance as a whole. Block backroom agreements or arbitrary diplomatic acts that harm the cohesion of the alliance to maintain a single external policy tone."

 BA_EU_focus_96: "Initiate Constitution"
 BA_EU_focus_96_desc: "Submit the European Constitution draft completed after heated discussion to the parliament, and enter pan-European national voting and ratification procedures. This is not an instruction down from above, but a great democratic process where citizens directly decide our future and governance norms with their own hands. It's time to be the master of history."

 BA_EU_focus_97: "Monitor Member States"
 BA_EU_focus_97_desc: "Operate a surveillance system that constantly monitors whether member states comply with the alliance's democratic values, rule of law, and human rights. For countries that break the law or retreat democracy, issue warnings and sanctions to maintain the soundness of the alliance. Trust comes from thorough confirmation, not blind faith."

 BA_EU_focus_98: "European Commission"
 BA_EU_focus_98_desc: "Elevate the 'European Commission,' which performs the role of the alliance's executive branch, from a simple management body to an official government body. This powerful organization, overseeing policy initiation and execution and budget operation, will be the heart leading the alliance as effectively a 'European Cabinet.' A powerful executive makes an efficient Europe."

 BA_EU_focus_99: "Judiciary"
 BA_EU_focus_99_desc: "To establish the rule of law, overhaul the backward judicial system and strengthen the independence and professionalism of judges to guarantee fair and rapid trials. Only rulings according to law and conscience, not money or power, can resolve citizens' grievances and sustain social justice. A just court is the last bastion of democracy."

 BA_EU_focus_100: "Institutionalize Joint Investigation"
 BA_EU_focus_100_desc: "In order to resolve complex crime cases spanning several countries such as drug trafficking, human trafficking, and cybercrime, institutionalize that relevant country police must form joint investigation teams (JIT) to cooperate. We must show that there is no place to hide for criminals fleeing across borders. Cooperation investigation is the shortcut to winning the war against crime."

 BA_EU_focus_101: "Enforce Constitution"
 BA_EU_focus_101_desc: "Officially proclaim and take effect the European Constitution ratified by the overwhelming support of citizens. Now Europe is not a loose union, but born again as a powerful federal state united under one flag, one constitution, and one destiny. Each and every clause of the constitution will protect our lives and brighten the future."

 BA_EU_focus_102: "Transnational Enforcement Power"
 BA_EU_focus_102_desc: "If member states do not implement the rulings of the European Court, the alliance secures practical enforcement power to impose fines or mobilize administrative power to forcibly implement. Law without enforcement power is just a paper tiger and a target of ridicule. The authority of law comes from strict enforcement."

 BA_EU_focus_103: "Share Criminal Records"
 BA_EU_focus_103_desc: "Build an integrated criminal justice database that shares criminals' fingerprints, DNA, and criminal records in real-time between all member states. It's no longer possible to commit a crime in one country and flee to another to wash identity. Sins do not disappear because you cross a border."

 BA_EU_focus_104: "Union Conflict Intervention Right"
 BA_EU_focus_104_desc: "If uncontrollable civil war, serious disturbances, or constitutional order destruction acts occur within a member state, the union holds the emergency intervention authority to input the alliance army to restore order and protect democracy. This is the last safety device to protect citizens from internal enemies."

 BA_EU_focus_105: "Organize Europol"
 BA_EU_focus_105_desc: "Expand and reorganize the European Police Office (Europol), which was a simple information-sharing body, into a powerful federal investigation bureau with direct investigation and arrest rights like the US FBI. Europol agents will be active on the stage of the entire Europe, tracking and arresting giant criminal organizations and terrorists until the end."

 BA_EU_focus_106: "Integrate Investigative Power"
 BA_EU_focus_106_desc: "Transfer investigative power on serious crimes such as terror, drugs, and money laundering from individual country police to the Federal Investigation Bureau to dramatically increase the efficiency and fairness of investigation. Prevent regional collusion or look-away investigations at the source, and equip a systematic crime response capacity at the pan-European level."

 BA_EU_focus_107: "Initiate Mediation Body"
 BA_EU_focus_107_desc: "Establish a standing mediation body that can resolve various conflicts such as territorial disputes between nations or trade friction between enterprises with dialogue and adjustment before legal lawsuits that take much cost and time. Resolving conflicts early and finding mutually beneficial agreement points is the appearance of a mature society."

 BA_EU_focus_108: "European Court of Justice"
 BA_EU_focus_108_desc: "Firmly establish the authority and independence of the 'European Court of Justice,' which interprets the constitution of the European Union and is responsible for final judgment related to Union Law. The ruling of the court has final and irreversible effect, and all member states and citizens must follow. The Goddess of Justice will blindfold and judge fairly only according to the law."

### Administration and Anti-Corruption
 BA_EU_focus_109: "Administration"
 BA_EU_focus_109_desc: "Massively innovate bloated and slow bureaucratic organizations, and maximize administrative transparency and efficiency by introducing digital administrative systems utilizing advanced technologies such as blockchain and AI. Lower the threshold of administration and increase service quality so that citizens can use public services quickly and conveniently anywhere, anytime. A smart government makes a smart Europe."

 BA_EU_focus_110: "Transnational Supervision"
 BA_EU_focus_110_desc: "Supervise whether each country's administrative handling complies with the alliance's standards and procedures, and exercise powerful auditing authority to demand correction for illegal or unfair administration. The supervision of the central government will block the self-righteousness of local governments and bring the effect of upwardly standardizing the administrative level of the entire alliance."

 BA_EU_focus_111: "Activate Personnel Reshuffle"
 BA_EU_focus_111_desc: "Strengthen the rotation system for high-ranking public officials who are easy to become corrupt by staying in one position for a long time, and blow tension into the organization by boldly expelling incompetent or negligent bureaucrats. Stagnant water is bound to rot, and only flowing water can maintain cleanliness. Overthrow the safe-at-any-cost attitude of bureaucratic society and settle ability-oriented personnel."

 BA_EU_focus_112: "Term Regulations"
 BA_EU_focus_112_desc: "Strictly limit the terms of major elected and appointed public officials to break the privatization of power and chains of corruption due to long-term seizure of power. Power is not eternal and must be made clear that it's only a temporarily delegated chance for service. Do your best during the set period, and create a culture of leaving when being applauded."
 BA_EU_focus_113: "Anti-Corruption Campaign"
 BA_EU_focus_113_desc: "To uproot the deeply entrenched culture of bribery, solicitation, and embezzlement throughout society, we will launch a massive pan-European anti-corruption campaign and crackdown. We must protect whistleblowers and make examples of corrupt officials, instilling the perception that 'corruption leads to ruin.' Only clean hands can practice clean politics, and integrity is the source of national competitiveness."

 BA_EU_focus_114: "Assign Inspectors"
 BA_EU_focus_114_desc: "We will dispatch and station external inspectors appointed by the Union in each ministry, public institution, and large-scale national project site. They will serve as 'secret royal inspectors' who monitor and report internal irregularities and budget waste in real-time. Where the eyes of surveillance reach, corruption loses its place to stand."

 BA_EU_focus_115: "Term Limits"
 BA_EU_focus_115_desc: "To prevent the specter of dictatorship where political leaders scheme to perpetuate their rule by amending the constitution, we strictly and constitutionally limit the consecutive terms of the President and Prime Minister. Democracy must be driven not by a single hero, but by a well-designed system and an awakened citizenry. The peaceful transfer of power is the flower of democracy."

 BA_EU_focus_116: "Crackdown on National Fraud"
 BA_EU_focus_116_desc: "We will strictly punish national-level fraudulent acts where member state governments or local authorities manipulate statistics to illegally receive Union subsidies or deceive financial statuses through accounting fraud. Parasitic acts that eat away at the Union's finances can drive the entire Union into a crisis. Dishonest nations do not deserve to be members of the Union."

 BA_EU_focus_117: "Budget Execution Monitoring"
 BA_EU_focus_117_desc: "We will build a digital budget monitoring system that can disclose and track the expenditure details of all public budgets in real-time. By allowing anyone to monitor whether the taxes paid by citizens are not leaking into the wrong places and are being used for their intended purposes, we must fundamentally block budget waste. Transparency is the basis of fiscal soundness."

 BA_EU_focus_118: "European Public Prosecutor's Office"
 BA_EU_focus_118_desc: "We will establish the 'European Public Prosecutor's Office (EPPO)' to exclusively investigate and prosecute crimes that damage the Union's finances by embezzling European Union budgets and funds or committing financial fraud. They will relentlessly pursue criminals across borders to recover the lost taxes of citizens."

 BA_EU_focus_119: "Confiscate Orders"
 BA_EU_focus_119_desc: "During investigations into power-related corruption, we will swiftly confiscate official documents, emails, and messenger records containing unfair instructions or pressure to secure them as evidence. We must block attempts to obstruct investigations by cutting off the tail and uncover the main body at the peak of corruption, bringing them to justice. Records do not lie."

### 과거 청산 및 미래
 BA_EU_focus_120: "Disband Paramilitary Organizations"
 BA_EU_focus_120_desc: "We will forcibly disband and confiscate all weapons from all illegal armed organizations that wield violence outside the control of the state, such as party private armies, political thugs, and extremist militias. In a democratic state, legitimate force must be monopolized only by the state, and private violence cannot be tolerated under any justification. Peace on the streets must be protected only by public power."

 BA_EU_focus_121: "Punish Genocide"
 BA_EU_focus_121_desc: "Crimes against humanity that trample on human conscience, such as ethnic cleansing, genocide, and systematic torture, will be pursued to the ends of the earth and punished without a statute of limitations. Time passing does not make sins disappear, and perpetrators must not be allowed to close their eyes in peace. There is no statute of limitations before the justice of history, and we will remember and remember to judge."

 BA_EU_focus_122: "Punish Hate Crimes"
 BA_EU_focus_122_desc: "We will severely punish crimes that use violence or promote hatred against others based on race, religion, country of origin, or gender by applying aggravated punishments. Protecting minorities and respecting diversity are core values of our Union, and we must prevent the virus of hatred from sickening society. A world without discrimination is a truly safe world."

 BA_EU_focus_123: "Civilian Damage Investigation"
 BA_EU_focus_123_desc: "We will conduct a comprehensive investigation into the actual conditions of civilians who were unfairly sacrificed or suffered damage amidst the madness of war and massacre, and push for official apologies and compensation at the national level. Calling the names of forgotten victims and restoring their honor is the duty of the survivors. Only by healing the pain of the past can we truly move towards a future of reconciliation."

 BA_EU_focus_124: "Investigate Junior Officers"
 BA_EU_focus_124_desc: "Cowardly excuses like 'I only did as I was told from above' or 'I only followed orders' will no longer work. Junior officers and working-level officials who directly commanded or aided massacres in the field must also take responsibility for their actions. We must guard against the banality of evil and awaken that keeping the conscience to refuse unjust orders is the true honor of a soldier."

 BA_EU_focus_125: "Sanction Fascism"
 BA_EU_focus_125_desc: "We will strictly prohibit by law acts of praising or propagating Nazism, Fascism, and totalitarianism, as well as the use of related symbols, and forcibly disband political organizations that follow them. We cannot even allow the freedom of ideology to destroy democracy. We must firmly trample the seeds of the devil so they cannot sprout again in our society."

 BA_EU_focus_126: "Eradicate Extreme Nationalism"
 BA_EU_focus_126_desc: "We define extreme nationalist forces that exclude other ethnic groups, cry for ethnocentrism, and incite division and hatred as enemies of society and will deal with them strongly. We are not a nation bound by blood and soil, but a Union united by the values of freedom and human rights. We must drive out the specter of closed nationalism and cultivate an open global citizenship."

 BA_EU_focus_127: "Final Verdict"
 BA_EU_focus_127_desc: "Concluding the long and painful trial process, we deliver history's final verdict on war criminals. This is not just a punishment, but a ritual to condemn past evil deeds, comfort the victims, and prove that justice is alive. With this ruling, we bid farewell to the dark past and, unburdened, can step forward toward a new era with a light heart."

 BA_EU_focus_128: "The European Way"
 BA_EU_focus_128_desc: "We have built a tower of peace and prosperity with sweat and tears upon the ruins of war, division, and the Great Shift. Now, Europe has shaken off the specters of the past and proudly stands at the center of the world as a new model of civilization where the mystique of Kivotos and human wisdom harmonize. This is 'The European Way' we have chosen, we have created, and we must walk. History will forever remember our courage and wisdom."





 ABY_focus_CZE_1: "Masters of This Land"
 ABY_focus_CZE_1_desc: "Even if the desert tries to claim everything, this school—and this land—belongs to us. As long as the Foreclosure Task Force is here, Abydos won't fall!"

 ABY_focus_CZE_2: "Second Austrian Republic"
 ABY_focus_CZE_2_desc: "Hoshino-senpai says history repeats itself, but maybe we can write a better ending this time. Let's support the establishment of the Second Republic and secure our southern flank."

 ABY_focus_CZE_3: "Rebuild the Little Entente"
 ABY_focus_CZE_3_desc: "We can't fight everyone alone, right? Nonomi suggested we pool our resources with our neighbors. A new alliance network will keep the big academies at bay."

 ABY_focus_CZE_4: "Reunification Talks with Slovakia"
 ABY_focus_CZE_4_desc: "Ayane is preparing the diplomatic paperwork. If we can bring them back to the negotiating table, our combined strength will be much more reliable than standing divided."

 ABY_focus_CZE_5: "Liberate Brother Nations"
 ABY_focus_CZE_5_desc: "Seeing others oppressed just doesn't sit right with us. Shiroko is already checking her ammo. It's time to break their chains and expand the Foreclosure Task Force's... I mean, freedom's reach!"

 ABY_focus_CZE_6: "Together with Romania"
 ABY_focus_CZE_6_desc: "A strategic partnership! Serika says we shouldn't trust them blindly, but having Romania on our side sure makes the balance sheets look a lot less terrifying."

 ABY_focus_CZE_7: "Crush Hungary's Ambitions"
 ABY_focus_CZE_7_desc: "They want to take what's ours? Not on my watch! We'll show them what happens when you try to foreclose on our friends."

 ABY_focus_CZE_8: "Solidarity with Yugoslavia"
 ABY_focus_CZE_8_desc: "United we stand. If we link up with Yugoslavia, our defensive line will be solid enough that even Kaiser Corporation would think twice before attacking."

 ABY_focus_CZE_9: "Rebuild Masaryk's Legacy"
 ABY_focus_CZE_9_desc: "Uhe~ Old legacies are heavy, but someone has to carry them. Let's dust off those old ideals and see if they still shine."

 ABY_focus_CZE_10: "Invite to the Balkan Federation"
 ABY_focus_CZE_10_desc: "An invitation to join forces! We're sending out the letters now. If they agree, the whole region will become one big, happy, highly-armed family."

 ABY_focus_CZE_11: "Integrate Linz"
 ABY_focus_CZE_11_desc: "Securing Linz gives us a critical industrial edge. Nonomi is already drawing up plans for how to budget the new resources!"

 ABY_focus_CZE_12: "Treaty of Karlovy Vary"
 ABY_focus_CZE_12_desc: "A formal treaty to secure our borders. Ayane made sure to double-check all the fine print so we don't end up with any hidden debts."

 ABY_focus_CZE_13: "Integrate Silesia"
 ABY_focus_CZE_13_desc: "Reclaiming Silesia means more land, more factories, and more work. Serika is already complaining about the extra paperwork, but we need it!"

 ABY_focus_CZE_14: "Balkan Economic Community"
 ABY_focus_CZE_14_desc: "If we share our economies, maybe we can finally pay off the school's debt! ...Wait, does merging economies mean we share their debts too?!"

 ABY_focus_CZE_15: "Dominate the Balkans"
 ABY_focus_CZE_15_desc: "Shiroko's eyes are gleaming again. If we control the entire peninsula, nobody can threaten Abydos. It's just simple tactical superiority."

 ABY_focus_CZE_16: "Form the European Community"
 ABY_focus_CZE_16_desc: "From a small school in the desert to leading a whole continent! It sounds crazy, but if it means peace and stability, the Foreclosure Task Force will make it happen."

 ABY_focus_CZE_17: "Liberate the Imperial Capital"
 ABY_focus_CZE_17_desc: "The heart of the enemy's power. It's time for a direct assault. Everyone, check your magazines, we're taking the capital!"

 ABY_focus_CZE_18: "Preemptive Strike on Italy"
 ABY_focus_CZE_18_desc: "They're planning something, I know it. Shiroko says the best defense is a good offense. Let's hit them before they hit us."

 ABY_focus_CZE_19: "Dominate European Russia"
 ABY_focus_CZE_19_desc: "It's freezing over there, but the strategic resources are immense. Just make sure to pack extra heat packs, Hoshino-senpai!"

 ABY_focus_CZE_20: "End the Rule of Kivotos"
 ABY_focus_CZE_20_desc: "The old systems of the General Student Council have failed us for the last time. It's time to break the cycle and carve our own destiny, free from the old Kivotos."

 ABY_focus_CZE_21: "Liberate the Nordics"
 ABY_focus_CZE_21_desc: "The cold winds of the north are calling. We'll bring the warmth of our Foreclosure Task Force spirit to the frozen lands!"

 ABY_focus_two_world_1: "Declaration of Dual-Worldism"
 ABY_focus_two_world_1_desc: "Earth and Kivotos... two different worlds, but we have to survive in both. We declare a new path that bridges the gap between the mystical and the mundane."

 ABY_focus_two_world_2: "Break the Ethno-Federal Hegemony"
 ABY_focus_two_world_2_desc: "Their dominance is stifling everyone else. We're going to tear down their monopoly and give the little guys a chance to breathe."

 ABY_focus_two_world_3: "Mediate Peace"
 ABY_focus_two_world_3_desc: "Ayane is exhausted from all the diplomatic calls, but if we can get these factions to stop shooting each other, it'll be worth it."

 ABY_focus_two_world_4: "Crush the Fascist Regimes"
 ABY_focus_two_world_4_desc: "Bullies who use fear to rule have no place in our new world. The Foreclosure Task Force is about to show them some real firepower."

 ABY_focus_two_world_5: "Balkan Diplomacy"
 ABY_focus_two_world_5_desc: "Navigating the politics here is trickier than surviving a Kaiser ambush. Serika says we should just charge them for our consulting services."

 ABY_focus_two_world_6: "Prepare for War"
 ABY_focus_two_world_6_desc: "Stockpile ammunition, ration the snacks, and double-check the armor plates. A storm is coming, and Abydos won't be caught off guard."

 ABY_focus_two_world_7: "Advance into Iberia"
 ABY_focus_two_world_7_desc: "Nonomi booked us tickets to the peninsula! ...Wait, this isn't a vacation? Well, we might as well secure the strategic objectives while we're there."

 ABY_focus_two_world_8: "Liberate Northern Europe"
 ABY_focus_two_world_8_desc: "Taking back the north from oppressive forces. Shiroko is already planning the optimal cycling routes through the fjords."

 ABY_focus_two_world_9: "Recapture the Sanctum Tower"
 ABY_focus_two_world_9_desc: "The core of Kivotos' control. If we take it back, we hold the keys to the city. We can't let it stay in the wrong hands!"

 ABY_focus_two_world_10: "Friendship with Switzerland"
 ABY_focus_two_world_10_desc: "They have banks, we have debt. Maybe we can work out a friendly arrangement? Or at least secure our financial flanks."

 ABY_focus_two_world_11: "Demand Slovenia"
 ABY_focus_two_world_11_desc: "It's a necessary step for our logistical lines. We've sent the ultimatum. Hopefully, they just hand it over so we don't have to waste ammo."

 ABY_focus_two_world_12: "Expand the Sudeten Fortifications"
 ABY_focus_two_world_12_desc: "Hoshino-senpai says a good nap requires a safe room. Let's pour some concrete and make sure no one can wake us up uninvited."

 ABY_focus_two_world_13: "Expanded Dual-World"
 ABY_focus_two_world_13_desc: "The integration is going smoothly. By combining Earth's industry with Kivotos' technology, we're becoming unstoppable."

 ABY_focus_two_world_14: "Restore German Democracy"
 ABY_focus_two_world_14_desc: "Helping them rebuild a fair government is the right thing to do. Plus, a stable neighbor is good for business!"

 ABY_focus_two_world_15: "Succeed the General Student Council"
 ABY_focus_two_world_15_desc: "The GSC is gone, but someone has to keep the peace. The Abydos Foreclosure Task Force is stepping up to take the mantle!"

 ABY_focus_two_world_16: "A New Order"
 ABY_focus_two_world_16_desc: "No more Kaiser, no more corruption. We're establishing a new set of rules where schools and nations can actually thrive together."

 ABY_focus_two_world_17: "Dual-World Autonomous Government"
 ABY_focus_two_world_17_desc: "Self-rule for both sides of the dimensional rift. Ayane drafted the charter, ensuring everyone gets fair representation."

 ABY_focus_two_world_18: "Reinforce the Northern Fortification Line"
 ABY_focus_two_world_18_desc: "The north is looking restless. We're sending extra materials and heavy artillery to make sure nothing crosses that line."

 ABY_focus_two_world_19: "Federal Integration"
 ABY_focus_two_world_19_desc: "Pulling all these different states into one cohesive federation. It's like herding cats, but Serika is used to that."

 ABY_focus_two_world_20: "Integrate the Office of the Supreme President"
 ABY_focus_two_world_20_desc: "Streamlining the leadership so we don't have fifty people arguing over one decision. Centralized command makes for quicker deployment."

 ABY_focus_two_world_21: "Integrate Dual-World Administration"
 ABY_focus_two_world_21_desc: "Merging the paperwork of two different dimensions is a nightmare. Ayane hasn't slept in days, but the efficiency gains are worth it."

 ABY_focus_two_world_22: "Industrial Integration"
 ABY_focus_two_world_22_desc: "Linking our factories with their production lines. Now we can mass-produce everything from assault rifles to Nonomi's favorite snacks."

 ABY_focus_two_world_23: "Construct the Southern Fortification Line"
 ABY_focus_two_world_23_desc: "A strong defense in the south ensures our core territories remain untouched. Dig those trenches deep!"

 ABY_focus_two_world_24: "Power to the President"
 ABY_focus_two_world_24_desc: "Sometimes you need decisive action without waiting for a committee. We're granting emergency executive powers to get things done."

 ABY_focus_two_world_25: "Establish the Office of the Federal Chancellor"
 ABY_focus_two_world_25_desc: "A new position to oversee the day-to-day running of the Federation, leaving the heavy lifting and tactical combat to us."

 ABY_focus_two_world_26: "Provide Service Benefits"
 ABY_focus_two_world_26_desc: "If you fight for the Federation, you get your student loans forgiven! ...Wait, can we do that for our own school's debt too?"

 ABY_focus_two_world_27: "Federation of Two Worlds"
 ABY_focus_two_world_27_desc: "Earth and Kivotos, standing united. We've built something incredible here. Now we just have to protect it."

 ABY_focus_suo_1: "Enlightenment Revolution"
 ABY_focus_suo_1_desc: "Suou is pushing for a radical shift in ideology. It feels a bit extreme, but the old ways weren't exactly working out for us."

 ABY_focus_suo_2: "Cultural Enlightenment"
 ABY_focus_suo_2_desc: "Rewriting the curriculum and changing how people think. It's a bit scary how fast things are changing around here."

 ABY_focus_suo_3: "Total Mobilization of the National Spirit"
 ABY_focus_suo_3_desc: "Every mind and body focused on a single goal. There's no room for hesitation when the entire nation is moving as one."

 ABY_focus_suo_4: "Takeover the Nephthys Group"
 ABY_focus_suo_4_desc: "Nonomi's family company... Taking it over forcefully feels wrong, but for the sake of the 'revolution', they say it's necessary."

 ABY_focus_suo_5: "Destroy Southern Kivotos Culture"
 ABY_focus_suo_5_desc: "Erasing the past to build a new future. It breaks my heart to see old traditions destroyed, but orders are orders."

 ABY_focus_suo_6: "Destroy the Heritage"
 ABY_focus_suo_6_desc: "Burning the old texts and demolishing historical sites. If Hoshino-senpai saw this, she'd be furious..."

 ABY_focus_suo_7: "Everyone is a Soldier"
 ABY_focus_suo_7_desc: "From the first-years to the club presidents, everyone is being drafted. We are no longer students; we are an army."

 ABY_focus_suo_8: "Total War for the Greater Good"
 ABY_focus_suo_8_desc: "There are no civilian sectors anymore. Every factory, every school desk, every resource is dedicated to the war effort."

 ABY_focus_suo_9: "Annex Corporations"
 ABY_focus_suo_9_desc: "Private businesses are being absorbed into the state apparatus. Even the ramen shops are producing rations now."

 ABY_focus_suo_10: "Reorganize PMCs"
 ABY_focus_suo_10_desc: "We're bringing all the private military contractors under direct state control. Kaiser mercenaries are now our vanguard, ironically."

 ABY_focus_suo_11: "Recall the True Objective"
 ABY_focus_suo_11_desc: "Amidst the chaos, we must not lose sight of why we started this. Suou reminds us daily of the ultimate goal."

 ABY_focus_suo_12: "Settle the Enlightenment Culture"
 ABY_focus_suo_12_desc: "The new ideology is taking root. Dissent is quietly disappearing, replaced by a chilling, unified compliance."

 ABY_focus_suo_13: "Population Control"
 ABY_focus_suo_13_desc: "Strict regulations on where people can live and work. The state dictates everything for maximum efficiency."

 ABY_focus_suo_14: "Pax Kivotocia"
 ABY_focus_suo_14_desc: "Peace through absolute control. There is no conflict because there is no freedom to oppose the state."

 ABY_focus_suo_15: "Cogs of the State"
 ABY_focus_suo_15_desc: "We are no longer individuals with dreams. We are just cogs in a massive, terrifying machine designed for one purpose."

 ABY_focus_suo_16: "Concentrate Research Power"
 ABY_focus_suo_16_desc: "All scientific and mystical research is funnelled into military applications. The Engineering Department has never been this productive, or this frightening."

 ABY_focus_suo_17: "Suou Youth Corps"
 ABY_focus_suo_17_desc: "Indoctrinating the younger students. They march in perfect synchronization, their eyes devoid of typical youthful mischief."

 ABY_focus_suo_18: "Proclamation of Enlightenment"
 ABY_focus_suo_18_desc: "The final decree. The old world is officially dead, and the era of absolute order has begun."

 ABY_focus_suo_19: "Living Space of the New Humanity"
 ABY_focus_suo_19_desc: "We need more room to grow, and we will take it by force. Borders are just lines waiting to be erased."

 ABY_focus_suo_20: "End of the Old Era"
 ABY_focus_suo_20_desc: "The last remnants of the old Kivotos resistance have been crushed. There is nothing left but the path forward."

 ABY_focus_suo_21: "Cruel Equality"
 ABY_focus_suo_21_desc: "Everyone is treated exactly the same—equally expendable in the eyes of the state."

 ABY_focus_suo_22: "Enlightenment Guard"
 ABY_focus_suo_22_desc: "An elite force loyal only to the ideology. They ensure compliance and silence anyone who questions the revolution."

 ABY_focus_suo_23: "Eradicate Resistance"
 ABY_focus_suo_23_desc: "Sweep and clear operations across the continent. We don't take prisoners anymore."

 ABY_focus_suo_24: "Student Conscription System"
 ABY_focus_suo_24_desc: "Every student must serve. The concept of a peaceful academy life is a relic of the past."

 ABY_focus_suo_25: "Dominate the Western Mediterranean"
 ABY_focus_suo_25_desc: "Securing the naval routes. Our fleets now control the seas, projecting our power far beyond our shores."

 ABY_focus_suo_26: "Secure Middle Eastern Resources"
 ABY_focus_suo_26_desc: "The war machine is thirsty. We're seizing the oil fields to fuel our endless campaigns."

 ABY_focus_suo_27: "Modify the Craft Chamber"
 ABY_focus_suo_27_desc: "Repurposing the ancient technology not for miracles, but for mass destruction. The energy output is off the charts."

 ABY_focus_suo_28: "The Gears That Move the Nation"
 ABY_focus_suo_28_desc: "A massive industrial overhaul. Everything and everyone is perfectly aligned to maximize the state's military output."

 ABY_focus_suo_29: "The Final War"
 ABY_focus_suo_29_desc: "This is it. The culmination of all our preparations. We will reshape the world, or burn it to the ground trying."

 ABY_focus_shiroko_fas_1: "Extension of Emergency Powers"
 ABY_focus_shiroko_fas_1_desc: "Shiroko says the crisis isn't over yet. We need to maintain strict control to ensure Abydos' survival. No objections allowed."

 ABY_focus_shiroko_fas_2: "Foreign Affairs"
 ABY_focus_shiroko_fas_2_desc: "Dealing with outsiders requires a firm hand. We speak softly, but everyone knows we're carrying a very large assault rifle."

 ABY_focus_shiroko_fas_3: "Eliminate the Hungarian Threat"
 ABY_focus_shiroko_fas_3_desc: "They've been eyeing our territory for too long. Shiroko is planning a preemptive strike to silence them permanently."

 ABY_focus_shiroko_fas_4: "Internal Affairs"
 ABY_focus_shiroko_fas_4_desc: "Consolidating power at home. Dissent only slows down our recovery, so we're making sure everyone is on exactly the same page."

 ABY_focus_shiroko_fas_5: "Accompany Yugoslavia"
 ABY_focus_shiroko_fas_5_desc: "A tactical alliance. They provide the numbers, we provide the elite firepower. Together, we lock down the region."

 ABY_focus_shiroko_fas_6: "Propose Slovak Integration"
 ABY_focus_shiroko_fas_6_desc: "We've sent them a proposal they can't refuse. It's better for them to be under our protection anyway."

 ABY_focus_shiroko_fas_7: "Improve Livelihoods"
 ABY_focus_shiroko_fas_7_desc: "If the people are fed, they won't complain about the strict rules. We're prioritizing basic necessities to maintain order."

 ABY_focus_shiroko_fas_8: "Depoliticize the Military"
 ABY_focus_shiroko_fas_8_desc: "The military's job is to shoot, not to think about politics. Shiroko is purging the officer corps of any ambitious politicians."

 ABY_focus_shiroko_fas_9: "Advance South"
 ABY_focus_shiroko_fas_9_desc: "The southern borders are weak. It's time to push forward and establish a broader buffer zone for Abydos."

 ABY_focus_shiroko_fas_10: "Offer Southern Hungary"
 ABY_focus_shiroko_fas_10_desc: "A little diplomatic bribery. By offering them territory, we keep them compliant and focused away from our main objectives."

 ABY_focus_shiroko_fas_11: "Friendship with Romania"
 ABY_focus_shiroko_fas_11_desc: "Securing our eastern flank. Shiroko says true friendship is based on mutually assured destruction."

 ABY_focus_shiroko_fas_12: "Greater Abydos Federation"
 ABY_focus_shiroko_fas_12_desc: "Our school is no longer just a district; it's an empire. The sands of Abydos will stretch across the continent."

 ABY_focus_shiroko_fas_13: "Five-Year Economic Development Plan"
 ABY_focus_shiroko_fas_13_desc: "Serika finally got her hands on the national budget. We're industrializing at a breakneck pace. No slacking off!"

 ABY_focus_shiroko_fas_14: "Unified Rule"
 ABY_focus_shiroko_fas_14_desc: "One leader, one vision. All power flows through Shiroko. The Foreclosure Task Force is now the highest authority."

 ABY_focus_shiroko_fas_15: "Operate Government-Controlled Party"
 ABY_focus_shiroko_fas_15_desc: "We created a political party to rubber-stamp our decisions. It gives the illusion of choice while we maintain absolute control."

 ABY_focus_shiroko_fas_16: "Distribute Presidential Powers"
 ABY_focus_shiroko_fas_16_desc: "Delegating some of the busywork to trusted lieutenants, but the final trigger pull always remains with the boss."

 ABY_focus_shiroko_fas_17: "Support Greater Yugoslavia"
 ABY_focus_shiroko_fas_17_desc: "Arming our allies to the teeth so they can act as our vanguard. Let them take the brunt of the casualties."

 ABY_focus_shiroko_fas_18: "Recognize Romanian Sovereignty"
 ABY_focus_shiroko_fas_18_desc: "We validate their claims in exchange for their unwavering loyalty to the Abydos regime."

 ABY_focus_shiroko_fas_19: "Ruthenian Autonomous State"
 ABY_focus_shiroko_fas_19_desc: "Carving out a puppet state to manage the locals. It's easier than trying to garrison the entire region ourselves."

 ABY_focus_shiroko_fas_20: "Propose Alliance with the Prefect Team"
 ABY_focus_shiroko_fas_20_desc: "Reaching out to Gehenna's enforcers. If Hina agrees to our terms, the entire balance of power shifts in our favor."

 ABY_focus_shiroko_fas_21: "Dismantle Nationalism"
 ABY_focus_shiroko_fas_21_desc: "Loyalty is to the State, not to some outdated concept of ethnicity. We crush any movement that preaches otherwise."

 ABY_focus_shiroko_fas_22: "Skilful but Slow, Clumsy but Fast"
 ABY_focus_shiroko_fas_22_desc: "In war, speed is everything. We execute plans violently and immediately, before the enemy even knows what hit them."

 ABY_focus_shiroko_fas_23: "Dismantle Italy"
 ABY_focus_shiroko_fas_23_desc: "Breaking apart the peninsula into manageable pieces. Divide and conquer is a classic for a reason."

 ABY_focus_shiroko_fas_24: "Succeed the Little Entente"
 ABY_focus_shiroko_fas_24_desc: "We take over the old defensive treaties and repurpose them into offensive pacts under our command."

 ABY_focus_shiroko_fas_25: "Propose the Federal Act"
 ABY_focus_shiroko_fas_25_desc: "Codifying our dominance into law. The Federation is officially born, and Abydos sits at its capital."

 ABY_focus_shiroko_fas_26: "Successor of Masaryk"
 ABY_focus_shiroko_fas_26_desc: "Claiming the historical legitimacy of past leaders to justify our current, somewhat forceful, methods."

 ABY_focus_shiroko_fas_27: "General Parliamentary Election"
 ABY_focus_shiroko_fas_27_desc: "We're holding elections! Of course, we've already ensured that only the 'correct' candidates are on the ballot."

 ABY_focus_shiroko_fas_28: "Hide One's Capacities and Bide One's Time"
 ABY_focus_shiroko_fas_28_desc: "Keep a low profile, stockpile weapons, and wait for the perfect moment. When we strike, it will be decisive."

 ABY_focus_shiroko_fas_29: "Organize a Coup in Yugoslavia"
 ABY_focus_shiroko_fas_29_desc: "The current leadership isn't compliant enough. Shiroko is sending in a black ops team to ensure a sudden change of management."

 ABY_focus_shiroko_fas_30: "Support Michael"
 ABY_focus_shiroko_fas_30_desc: "Backing the monarchist faction. A king indebted to Abydos is a very useful chess piece on the board."

 ABY_focus_shiroko_fas_31: "Appease the Hungarians"
 ABY_focus_shiroko_fas_31_desc: "Throwing them a bone so they stop rioting. It buys us time to move our armored divisions into place."

 ABY_focus_shiroko_fas_32: "The Golden Throne"
 ABY_focus_shiroko_fas_32_desc: "Absolute, unquestioned power. Shiroko sits at the apex. The Foreclosure Task Force has finally conquered everything."

 ABY_focus_shiroko_dem_1: "Velvet Revolution"
 ABY_focus_shiroko_dem_1_desc: "A peaceful transition of power. We can restore order to Abydos without firing a single shot. Nonomi even handed out snacks to the protestors!"

 ABY_focus_shiroko_dem_2: "Manifest Destiny"
 ABY_focus_shiroko_dem_2_desc: "It's our right and responsibility to expand our protective umbrella. The values of the Foreclosure Task Force will span from sea to shining sea."

 ABY_focus_shiroko_dem_3: "Propose Slovakia"
 ABY_focus_shiroko_dem_3_desc: "Inviting them to join our democratic union. It's a much better alternative than being swallowed up by the aggressive empires next door."

 ABY_focus_shiroko_dem_4: "Distribute Powers to Ministers"
 ABY_focus_shiroko_dem_4_desc: "Ayane handles logistics, Serika manages the budget, Nonomi does PR... Decentralizing our command structure makes us more resilient!"

 ABY_focus_shiroko_dem_5: "Northern Offensive"
 ABY_focus_shiroko_dem_5_desc: "We have to push back against the totalitarian forces gathering up north. It's time to bring democracy to their doorsteps."

 ABY_focus_shiroko_dem_6: "Threaten Romania"
 ABY_focus_shiroko_dem_6_desc: "Sometimes stern words and a show of force are necessary to keep the peace. Let's make sure they understand our red lines."

 ABY_focus_shiroko_dem_7: "Eradicate Anti-Democratic Forces"
 ABY_focus_shiroko_dem_7_desc: "We won't tolerate those who try to dismantle our hard-won freedoms. Time to clean house and expel the radicals."

 ABY_focus_shiroko_dem_8: "Integration and Unity of Citizens"
 ABY_focus_shiroko_dem_8_desc: "Bringing everyone together under one flag. Hoshino-senpai says a united school is much harder to break."

 ABY_focus_shiroko_dem_9: "Nordic Offensive"
 ABY_focus_shiroko_dem_9_desc: "Liberating the frozen north from tyranny. We'll show them that the fire of democracy burns hot even in the snow!"

 ABY_focus_shiroko_dem_10: "Secure Sanctum Tower Control"
 ABY_focus_shiroko_dem_10_desc: "By taking control of the Sanctum Tower democratically, we can ensure its power is used for the benefit of all students, not just a select few."

 ABY_focus_shiroko_dem_11: "New Era for Yugoslavia"
 ABY_focus_shiroko_dem_11_desc: "Guiding our allies into a brighter, more democratic future. We'll help them rebuild their institutions from the ground up."

 ABY_focus_shiroko_dem_12: "Punish Hungary"
 ABY_focus_shiroko_dem_12_desc: "They broke the treaties and threatened our friends. Now they have to face the consequences of the united democratic front."

 ABY_focus_shiroko_dem_13: "Form a New Cabinet"
 ABY_focus_shiroko_dem_13_desc: "A fresh start with new faces. We need diverse voices to govern effectively. Nonomi suggested getting someone who actually knows accounting."

 ABY_focus_shiroko_dem_14: "Secure Government Authority"
 ABY_focus_shiroko_dem_14_desc: "A democracy is only as strong as its institutions. We need to enforce the rule of law so the state doesn't collapse into anarchy."

 ABY_focus_shiroko_dem_15: "Respect Individual Diversity"
 ABY_focus_shiroko_dem_15_desc: "Every student is unique, and that's our greatest strength. We will protect the rights of everyone, no matter what halo they have."

 ABY_focus_shiroko_dem_16: "Multiple Roots"
 ABY_focus_shiroko_dem_16_desc: "Our culture is a blend of many different traditions. Celebrating this diversity makes us stronger and more united than ever."

 ABY_focus_shiroko_dem_17: "Subjugate the Three Great Academies"
 ABY_focus_shiroko_dem_17_desc: "Trinity, Gehenna, Millennium... Their unchecked power has caused too much suffering. It's time they learned to respect the democratic process, by force if necessary."

 ABY_focus_shiroko_dem_18: "Advance into the Balkans"
 ABY_focus_shiroko_dem_18_desc: "Bringing stability to a notoriously volatile region. The Foreclosure Task Force is expanding its peacekeeping operations."

 ABY_focus_shiroko_dem_19: "Rebuild Abydos Main Building"
 ABY_focus_shiroko_dem_19_desc: "Our home, restored to its former glory! Nonomi wants to paint it pink, but Serika is insisting on something more cost-effective."

 ABY_focus_shiroko_dem_20: "Propose Protection for the Prefect Team"
 ABY_focus_shiroko_dem_20_desc: "Even Gehenna's toughest enforcers need allies. Offering them a mutual defense pact could secure the whole region."

 ABY_focus_shiroko_dem_21: "Eyes on Europe"
 ABY_focus_shiroko_dem_21_desc: "We can't just focus on our own sandbox anymore. We need to look outward and engage with the broader international community."

 ABY_focus_shiroko_dem_22: "Equality of All People"
 ABY_focus_shiroko_dem_22_desc: "No more elites, no more second-class citizens. Everyone gets an equal vote and an equal chance to succeed."

 ABY_focus_shiroko_dem_23: "Liberate the Imperial Capital"
 ABY_focus_shiroko_dem_23_desc: "Marching into the heart of the empire, not as conquerors, but as liberators. Let freedom ring through the streets!"

 ABY_focus_shiroko_dem_24: "United States of Greater Abydos"
 ABY_focus_shiroko_dem_24_desc: "A sprawling, democratic federation where every state has a voice. From the desert sands to the European plains, we are one."

 ABY_focus_shiroko_dem_25: "Propose the Union Act"
 ABY_focus_shiroko_dem_25_desc: "Drafting the constitution for our new multinational alliance. Ayane is making sure there are plenty of checks and balances."

 ABY_focus_shiroko_dem_26: "New European Hegemony"
 ABY_focus_shiroko_dem_26_desc: "A hegemony not built on fear, but on mutual cooperation and shared democratic values. Abydos will lead the way."

 ABY_focus_shiroko_dem_27: "All for All"
 ABY_focus_shiroko_dem_27_desc: "We're all in this together. The wealth and prosperity of the state must be shared among all its citizens."

 ABY_focus_shiroko_dem_28: "One Root, One Species"
 ABY_focus_shiroko_dem_28_desc: "Despite our differences, we are all fundamentally the same. Focusing on our shared humanity brings us closer together."

 ABY_focus_shiroko_dem_29: "Pressure Switzerland"
 ABY_focus_shiroko_dem_29_desc: "They can't hide behind neutrality forever when there's a fight for democracy happening right next door. Time to pick a side."

 ABY_focus_shiroko_dem_30: "March Eastward"
 ABY_focus_shiroko_dem_30_desc: "The eastern front is calling. We must secure our borders against the authoritarian regimes that threaten our way of life."

 ABY_focus_shiroko_dem_31: "Melting Pot of Two Worlds"
 ABY_focus_shiroko_dem_31_desc: "Integrating Earth's cultures with Kivotos' mysteries. The result is a vibrant, dynamic society unlike anything seen before."

 ABY_focus_shiroko_dem_32: "Maintain the Hegemonic System"
 ABY_focus_shiroko_dem_32_desc: "We've built a peaceful, democratic order. Now comes the hard part: defending it against those who would tear it down."

 ABY_focus_communism_1: "Abydos Underground State"
 ABY_focus_communism_1_desc: "Driven beneath the sands by Kaiser and the debt, we've organized a shadow government. The proletariat of Abydos will rise from the tunnels!"

 ABY_focus_communism_2: "Anti-Dictatorship Movement"
 ABY_focus_communism_2_desc: "Striking back against the corporate oligarchs and fascists. The workers and students must break their chains!"

 ABY_focus_communism_3: "Liberate the Confederation of the Rhine"
 ABY_focus_communism_3_desc: "Spreading the revolution westward. We'll help our comrades cast off their oppressors and join the grand collective."

 ABY_focus_communism_4: "Advance on Eden"
 ABY_focus_communism_4_desc: "The so-called paradise of the elites. We're marching in to distribute their hoarded wealth to the masses."

 ABY_focus_communism_5: "Threaten Slovakia"
 ABY_focus_communism_5_desc: "They need a little push to realize the inevitability of the revolution. A show of force should clarify things."

 ABY_focus_communism_6: "Distribute Anti-Establishment Propaganda"
 ABY_focus_communism_6_desc: "Serika has been printing leaflets all night. We're dropping them over the major academies to spark the uprising."

 ABY_focus_communism_7: "Infiltrate the Military"
 ABY_focus_communism_7_desc: "Turning the enemy's soldiers into our comrades. When the order is given, their guns will point the other way."

 ABY_focus_communism_8: "Reject Soviet State Capitalism"
 ABY_focus_communism_8_desc: "Moscow has lost its way. We're paving a true socialist path, untainted by bureaucratic corruption."

 ABY_focus_communism_9: "Reject Left-Wing Totalitarianism"
 ABY_focus_communism_9_desc: "We fight for the freedom of the workers, not to replace one dictator with another. Our revolution will remain pure."

 ABY_focus_communism_10: "Occupy the Heart of Kivotos"
 ABY_focus_communism_10_desc: "Seizing the General Student Council building. The vanguard of the revolution has finally taken the capital!"

 ABY_focus_communism_11: "Eradicate the Resistance Army"
 ABY_focus_communism_11_desc: "Reactionary forces are trying to undo our progress. We must crush them swiftly to protect the revolution."

 ABY_focus_communism_12: "Judge Italian Fascism"
 ABY_focus_communism_12_desc: "Bringing the blackshirts to trial in front of the people's court. Their reign of terror ends today."

 ABY_focus_communism_13: "Restore the Hungarian Council"
 ABY_focus_communism_13_desc: "Reinstating the workers' councils in Hungary. Power to the soviets!"

 ABY_focus_communism_14: "Induce Large-Scale Protests"
 ABY_focus_communism_14_desc: "Mobilizing the masses for a general strike. When the workers stop working, the empire grinds to a halt."

 ABY_focus_communism_15: "Expand Organizational Network"
 ABY_focus_communism_15_desc: "Setting up cells in every district and school. The roots of the revolution are spreading deep."

 ABY_focus_communism_16: "Advocate True Socialism"
 ABY_focus_communism_16_desc: "Not the corrupted version peddled by the East, but a genuine movement by the students, for the students."

 ABY_focus_communism_17: "Block the Party Congress"
 ABY_focus_communism_17_desc: "The revisionists are trying to seize control of the party. We must storm the hall and silence their lies."

 ABY_focus_communism_18: "One International"
 ABY_focus_communism_18_desc: "Uniting all socialist movements across the globe under a single, unified banner. Workers of the world, unite!"

 ABY_focus_communism_19: "Rising Red Europe"
 ABY_focus_communism_19_desc: "The crimson tide is sweeping across the continent. One by one, the old regimes fall to the will of the people."

 ABY_focus_communism_20: "Organized Popular Resistance"
 ABY_focus_communism_20_desc: "Turning angry mobs into disciplined revolutionary militias. We will fight a protracted war if we must."

 ABY_focus_communism_21: "Takeover Regional Commands"
 ABY_focus_communism_21_desc: "Seizing military infrastructure across the provinces. The people's army is securing its logistical backbone."

 ABY_focus_communism_22: "Will to Resist the Brown Bear"
 ABY_focus_communism_22_desc: "We will not be bullied by Moscow. Our flavor of socialism is independent, and we will defend it to the death."

 ABY_focus_communism_23: "Recover from the Iberian Failure"
 ABY_focus_communism_23_desc: "We lost battles there, but not the war. Analyzing our mistakes and preparing for a glorious counter-offensive."

 ABY_focus_communism_24: "A New Era for Kivotos"
 ABY_focus_communism_24_desc: "A society free of debt, exploitation, and Kaiser's greed. The Foreclosure Task Force has delivered true equality."

 ABY_focus_communism_25: "Dominate the Balkans"
 ABY_focus_communism_25_desc: "Bringing the fractured peninsula into the fold of the global socialist republic."

 ABY_focus_communism_26: "Second Party Congress"
 ABY_focus_communism_26_desc: "Solidifying our political doctrine. Hoshino-senpai somehow got elected as the General Secretary while napping."

 ABY_focus_communism_27: "United Front"
 ABY_focus_communism_27_desc: "Allying with moderate leftists and anti-fascist groups to create a massive bulwark against the extreme right."

 ABY_focus_communism_28: "Resistance Against Moscow"
 ABY_focus_communism_28_desc: "We're openly breaking ties with their oppressive brand of communism. The true revolution happens here, not there."

 ABY_focus_communism_29: "Deploy Assassination Teams"
 ABY_focus_communism_29_desc: "Removing key reactionaries before they can organize. Shiroko volunteered immediately."

 ABY_focus_communism_30: "Red Terror"
 ABY_focus_communism_30_desc: "Drastic times call for drastic measures. We will purge the state enemies with uncompromising brutality."

 ABY_focus_communism_31: "Co-opt Intelligence Agencies"
 ABY_focus_communism_31_desc: "Turning their spies into our informants. The secret police now work for the vanguard."

 ABY_focus_communism_32: "Velvet Divorce"
 ABY_focus_communism_32_desc: "A peaceful separation from our former allies who refuse to embrace the socialist path. We wish them well, for now."

 ABY_focus_nephthys_1: "Nephthys Corporate State"
 ABY_focus_nephthys_1_desc: "Nonomi's family wealth has literally bought the country. Welcome to Abydos, a wholly-owned subsidiary of Nephthys Industries."

 ABY_focus_nephthys_2: "Annex Škoda"
 ABY_focus_nephthys_2_desc: "Hostile takeover of their manufacturing giants. We need those factories to build more tanks... and credit card machines."

 ABY_focus_nephthys_3: "Annex Rothschild"
 ABY_focus_nephthys_3_desc: "Consolidating the global banking sector. When you hold all the purse strings, the world dances to your tune."

 ABY_focus_nephthys_4: "Strengthen the War Economy"
 ABY_focus_nephthys_4_desc: "Shifting our portfolio entirely into defense contracting. War is good for the bottom line, after all."

 ABY_focus_nephthys_5: "Monopoly Corporation"
 ABY_focus_nephthys_5_desc: "We've bought out the competition. Kaiser Corporation is now just a footnote in our quarterly earnings report."

 ABY_focus_nephthys_6: "Operate Financial Economy"
 ABY_focus_nephthys_6_desc: "Manipulating currency markets and interest rates to keep our enemies broke and our allies dependent."

 ABY_focus_nephthys_7: "Industrial City Plan I"
 ABY_focus_nephthys_7_desc: "Paving over the desert to build massive, efficient factory towns. Serika is hyperventilating at the sheer amount of profit."

 ABY_focus_nephthys_8: "War Economy I"
 ABY_focus_nephthys_8_desc: "Optimizing supply chains to feed the military-industrial complex. Every bullet fired is a coin in the bank."

 ABY_focus_nephthys_9: "Dominate Global Capital"
 ABY_focus_nephthys_9_desc: "We don't just participate in the global market; we ARE the global market. Nephthys stock is the only currency that matters."

 ABY_focus_nephthys_10: "Eradicate the Reds"
 ABY_focus_nephthys_10_desc: "Labor unions? Strikes? Not in our factories. We're deploying 'aggressive asset protection' to deal with the communists."

 ABY_focus_nephthys_11: "Secure Kivotos Virtual Assets I"
 ABY_focus_nephthys_11_desc: "Mining data and mystical energy from the ruins. It's incredibly lucrative if you don't ask too many ethical questions."

 ABY_focus_nephthys_12: "Hostile Takeover of Private Corporations I"
 ABY_focus_nephthys_12_desc: "Buying them out, whether they want to sell or not. If they resist, Shiroko goes to 'renegotiate' the terms."

 ABY_focus_nephthys_13: "Industrial City Plan II"
 ABY_focus_nephthys_13_desc: "Expanding our corporate mega-cities. Employee housing, company stores, mandatory overtime... efficiency!"

 ABY_focus_nephthys_14: "War Economy II"
 ABY_focus_nephthys_14_desc: "Ramping up production. The shareholders demand constant growth, and conquering new territory provides great quarterly dividends."

 ABY_focus_nephthys_15: "Advance North"
 ABY_focus_nephthys_15_desc: "The northern territories are ripe for resource extraction. We're sending in the acquisition fleets."

 ABY_focus_nephthys_16: "Negotiate with Criminal Industries"
 ABY_focus_nephthys_16_desc: "Sometimes the black market offers the best margins. We'll legitimize their operations... for a 60% cut."

 ABY_focus_nephthys_17: "Dismantle Red Winter"
 ABY_focus_nephthys_17_desc: "Liquidating their assets and privatizing their snow. Cherino's mustache is now corporate property."

 ABY_focus_nephthys_18: "Road to the Mediterranean"
 ABY_focus_nephthys_18_desc: "Securing warm-water ports to cut down on shipping costs. Nephthys cargo ships will dominate the seas."

 ABY_focus_nephthys_19: "Protect Eastern Europe"
 ABY_focus_nephthys_19_desc: "Selling them premium defense subscriptions. They get protection, we get their national gold reserves."

 ABY_focus_nephthys_20: "Secure Kivotos Virtual Assets II"
 ABY_focus_nephthys_20_desc: "Deep-diving into the Sanctum networks to monetize ancient secrets. The bandwidth costs are staggering, but worth it."

 ABY_focus_nephthys_21: "Hostile Takeover of Private Corporations II"
 ABY_focus_nephthys_21_desc: "Swallowing up the mid-sized competitors. There can be only one mega-corporation in this world."

 ABY_focus_nephthys_22: "Industrial City Plan III"
 ABY_focus_nephthys_22_desc: "The whole continent is basically one giant factory floor now. The smog is terrible, but the profits are beautiful."

 ABY_focus_nephthys_23: "War Economy III"
 ABY_focus_nephthys_23_desc: "Total synergy between state and corporation. We're mass-producing peace through superior firepower and aggressive marketing."

 ABY_focus_nephthys_24: "Annex Western European Capital"
 ABY_focus_nephthys_24_desc: "Raiding the old money banks of Paris and London. Their centuries of accumulated wealth now sit in Abydos vaults."

 ABY_focus_nephthys_25: "Acquire Kaiser"
 ABY_focus_nephthys_25_desc: "The ultimate irony. We bought out Kaiser PMC lock, stock, and barrel. They work for us now. Keep cleaning those toilets, Director!"

 ABY_focus_nephthys_26: "Exploit Nordic Resource Zones"
 ABY_focus_nephthys_26_desc: "Strip-mining the frozen north. The locals are hired as contractors with very competitive (terrible) wages."

 ABY_focus_nephthys_27: "Strike the Balkans"
 ABY_focus_nephthys_27_desc: "They defaulted on their loans, so we're sending in the repossession armies. Standard corporate policy."

 ABY_focus_nephthys_28: "Invade the Middle East"
 ABY_focus_nephthys_28_desc: "Securing the energy sector. We need the oil to fuel our logistics networks, and we're tired of paying market price."

 ABY_focus_nephthys_29: "Secure Kivotos Virtual Assets III"
 ABY_focus_nephthys_29_desc: "Complete monopolization of all mystical tech. We hold the patents on miracles now."

 ABY_focus_nephthys_30: "Hostile Takeover of Private Corporations III"
 ABY_focus_nephthys_30_desc: "The final phase of consolidation. If it makes money, Nephthys owns it. It's just good business."

 ABY_focus_nephthys_31: "Dominate Military Capital"
 ABY_focus_nephthys_31_desc: "We supply weapons to everyone. No matter who wins the war, Nephthys gets paid."

 ABY_focus_nephthys_32: "Dominate Wall Street"
 ABY_focus_nephthys_32_desc: "Moving our headquarters to the financial center of the world. The Foreclosure Task Force is ringing the opening bell."

 ABY_focus_nephthys_33: "Destroy Moscow"
 ABY_focus_nephthys_33_desc: "They refuse to respect private property rights, so we're liquidating their capital city. A total write-off."

 ABY_focus_nephthys_34: "Dominate Civilian Capital"
 ABY_focus_nephthys_34_desc: "From the clothes they wear to the food they eat, citizens pay a premium to Nephthys for existing."

 ABY_focus_nephthys_35: "World Government"
 ABY_focus_nephthys_35_desc: "Nations are obsolete. Welcome to Earth, Inc. CEO Nonomi will see you now."

 ABY_focus_serika_kiv_0: "Mutual Sympathy"
 ABY_focus_serika_kiv_0_desc: "We both know what it's like to struggle against impossible odds. Maybe it's time we worked together to survive this mess."

 ABY_focus_serika_kiv_1: "Kikyou's Reform Proposal"
 ABY_focus_serika_kiv_1_desc: "Kikyou's plans are incredibly detailed and pragmatic. Serika loves the spreadsheets, even if the methods are a bit ruthless."

 ABY_focus_serika_kiv_2: "Rumi's Reform Proposal"
 ABY_focus_serika_kiv_2_desc: "Rumi wants to focus on feeding the people and building community trust. A well-fed army is a happy army, after all."

 ABY_focus_serika_kiv_3: ""
 ABY_focus_serika_kiv_3_desc: "Just keeping our heads down and doing the paperwork. Sometimes surviving is a full-time job."

 ABY_focus_serika_kiv_4: "Comprehensive Survey"
 ABY_focus_serika_kiv_4_desc: "We need to know exactly what resources we have left. Ayane is organizing a massive audit of the entire territory."

 ABY_focus_serika_kiv_5: ""
 ABY_focus_serika_kiv_5_desc: "Drafting new plans for the next quarter. We have to stay ahead of the debt interest!"

 ABY_focus_serika_kiv_6: "Hand in Hand"
 ABY_focus_serika_kiv_6_desc: "Reaching out to our fellow students across Kivotos. If we stand together, Kaiser can't break us."

 ABY_focus_serika_kiv_7: ""
 ABY_focus_serika_kiv_7_desc: "More budget meetings. Serika is threatening to cut club funding again if we don't meet our quotas."

 ABY_focus_serika_kiv_8: ""
 ABY_focus_serika_kiv_8_desc: "Hoshino-senpai is napping during the strategy briefing again. We'll just have to plan around her."

 ABY_focus_serika_kiv_9: ""
 ABY_focus_serika_kiv_9_desc: "Checking the ammo reserves. Shiroko is suggesting we 'borrow' some from the neighboring districts."

 ABY_focus_serika_kiv_10: ""
 ABY_focus_serika_kiv_10_desc: "A rare moment of peace in the clubroom. We should enjoy it before the next crisis hits."

 ABY_focus_serika_kiv_11: ""
 ABY_focus_serika_kiv_11_desc: "Nonomi is offering to buy everyone ice cream! Morale is temporarily restored."

 ABY_focus_serika_kiv_12: "Fusion of Cultures"
 ABY_focus_serika_kiv_12_desc: "Blending the best parts of all the academies. We're creating something entirely new here in the desert."

 ABY_focus_serika_kiv_13: "Restore Masaryk Monument"
 ABY_focus_serika_kiv_13_desc: "Honoring the ideals of the past. It gives the locals hope, and honestly, we could use some of that too."

 ABY_focus_serika_kiv_14: "Ennead Renaissance"
 ABY_focus_serika_kiv_14_desc: "Reviving the ancient glory of Abydos. We're not just surviving anymore; we're thriving and rebuilding our legacy."

 ABY_focus_serika_kiv_15: ""
 ABY_focus_serika_kiv_15_desc: "Diplomatic cables are piling up. Everyone wants a piece of the new Abydos."

 ABY_focus_serika_kiv_16: ""
 ABY_focus_serika_kiv_16_desc: "Strengthening our borders. We won't let anyone take what we've worked so hard to build."

 ABY_focus_serika_kiv_17: ""
 ABY_focus_serika_kiv_17_desc: "Training exercises in the dunes. The sand gets everywhere, but it makes us tougher."

 ABY_focus_serika_kiv_18: "Strengthen Civilian Control"
 ABY_focus_serika_kiv_18_desc: "Making sure the military answers to the student council. We don't need a junta running things."

 ABY_focus_serika_kiv_19: ""
 ABY_focus_serika_kiv_19_desc: "Audit time! Serika is cracking down on unnecessary expenses with terrifying efficiency."

 ABY_focus_serika_kiv_20: "Restore Kivotos Culture"
 ABY_focus_serika_kiv_20_desc: "Bringing back the festivals, the club activities, and the normal school life we fought so hard to protect."

 ABY_focus_serika_kiv_21: "A New Chapter in History"
 ABY_focus_serika_kiv_21_desc: "The dark days are behind us. The Foreclosure Task Force has finally written a happy ending for Abydos."

 ABY_focus_serika_kiv_22: ""
 ABY_focus_serika_kiv_22_desc: "Looking out over the restored campus. It's beautiful, isn't it?"

 ABY_focus_serika_kiv_23: ""
 ABY_focus_serika_kiv_23_desc: "Preparing for the future. We've paid off the debt, but there's always more work to do."

 ABY_focus_serika_kiv_24: "Resurrection of the Genbu Merchant Alliance"
 ABY_focus_serika_kiv_24_desc: "Getting the trade networks back up and running. Shanhaijing's merchants will bring much-needed goods to our region."

 ABY_focus_serika_kiv_25: ""
 ABY_focus_serika_kiv_25_desc: "Establishing new trade routes. Economics is just another battlefield, and Serika intends to win."

 ABY_focus_serika_kiv_26: "Danubian Federal Army"
 ABY_focus_serika_kiv_26_desc: "Organizing a combined defense force for the region. A united front against any external threats."

 ABY_focus_serika_kiv_27: "South Kivotos-Danube Co-Prosperity"
 ABY_focus_serika_kiv_27_desc: "A mutually beneficial economic zone linking our territories. We rise and fall together now."

 ABY_focus_serika_kiv_28: "In the Name of Justice"
 ABY_focus_serika_kiv_28_desc: "We won't stand by while bullies push people around. The Foreclosure Task Force is deploying to right some wrongs."

 ABY_focus_serika_kiv_29: "Attract Foreign Currency"
 ABY_focus_serika_kiv_29_desc: "Opening our markets to international investors. We need capital to rebuild, and we're willing to make deals."

 ABY_focus_serika_kiv_30: "Advance to Carpathia"
 ABY_focus_serika_kiv_30_desc: "Pushing our defensive lines into the mountains. It's tough terrain, but we've trained in the desert, we can handle it."

 ABY_focus_serika_kiv_31: "Germany's New Friends"
 ABY_focus_serika_kiv_31_desc: "Building a diplomatic bridge with Berlin. A strong alliance in central Europe secures our position."

 ABY_focus_serika_kiv_32: "Operation Austerlitz"
 ABY_focus_serika_kiv_32_desc: "A brilliant tactical maneuver planned by Ayane. We'll lure them in and crush them from the flanks!"

 ABY_focus_serika_kiv_33: "Punishment"
 ABY_focus_serika_kiv_33_desc: "They crossed the line. Now we deliver the consequences. Shiroko is leading the vanguard."

 ABY_focus_serika_kiv_34: "Demand Custody of Suou"
 ABY_focus_serika_kiv_34_desc: "She's caused enough trouble. We're demanding her extradition to answer for her crimes against Kivotos."

 ABY_focus_serika_kiv_35: "Eradicate the Balkan Threat"
 ABY_focus_serika_kiv_35_desc: "Clearing out the hostile factions once and for all. We're bringing permanent peace to the peninsula."

 ABY_focus_serika_kiv_36: "Inherit the Will of the Little Entente"
 ABY_focus_serika_kiv_36_desc: "Taking up the mantle of regional defender. We will honor their legacy by protecting the small nations."

 ABY_focus_serika_kiv_37: "Operation Odoacer"
 ABY_focus_serika_kiv_37_desc: "The final push to topple the remnants of the old empire. We're striking right at their heart."

 ABY_focus_serika_kiv_38: "End of the War"
 ABY_focus_serika_kiv_38_desc: "The guns have fallen silent. It's over. We can finally put down our weapons and go back to being students."

 ABY_focus_serika_kiv_39: "Lantern Festival of a New Era"
 ABY_focus_serika_kiv_39_desc: "Celebrating our victory and peace! Rumi is cooking, Nonomi is paying, and even Serika is smiling. Welcome to the new Kivotos!"

 ABY_focus_serika_aby_0: "Yesterday's Enemy..."
 ABY_focus_serika_aby_0_desc: "...might just be today's most useful asset. We're willing to make compromises if it secures Abydos' future."

 ABY_focus_serika_aby_1: "Kikyou's Agenda"
 ABY_focus_serika_aby_1_desc: "Implementing Kikyou's strict intelligence and security protocols. We won't be caught off guard ever again."

 ABY_focus_serika_aby_2: "Rumi's Agenda"
 ABY_focus_serika_aby_2_desc: "Prioritizing infrastructure and civilian logistics. It's not glamorous, but it keeps the nation running."

 ABY_focus_serika_aby_3: ""
 ABY_focus_serika_aby_3_desc: "Balancing the books and paying off old grudges. Just another day at the office."

 ABY_focus_serika_aby_4: "Disband the Army"
 ABY_focus_serika_aby_4_desc: "We don't need a massive standing army anymore. We're converting the soldiers back into students and workers."

 ABY_focus_serika_aby_5: ""
 ABY_focus_serika_aby_5_desc: "Filing the paperwork for demobilization. Serika is thrilled to cut the military budget."

 ABY_focus_serika_aby_6: "...Today's Comrade"
 ABY_focus_serika_aby_6_desc: "Forging an alliance with those we once fought. Survival makes strange bedfellows."

 ABY_focus_serika_aby_7: ""
 ABY_focus_serika_aby_7_desc: "Joint training exercises to build trust. Still keeping an eye on them, though."

 ABY_focus_serika_aby_8: ""
 ABY_focus_serika_aby_8_desc: "Sharing intelligence to take down a mutual threat. The enemy of my enemy is my friend."

 ABY_focus_serika_aby_9: ""
 ABY_focus_serika_aby_9_desc: "Hoshino-senpai actually agreed to a diplomatic meeting. She fell asleep halfway through, but it still counts."

 ABY_focus_serika_aby_10: ""
 ABY_focus_serika_aby_10_desc: "Securing the new borders together. It's nice to have someone else watching our backs for a change."

 ABY_focus_serika_aby_11: ""
 ABY_focus_serika_aby_11_desc: "Drafting the new trade agreements. Let's see how much profit we can squeeze out of this new friendship."

 ABY_focus_serika_aby_12: "Utilize Catholicism"
 ABY_focus_serika_aby_12_desc: "Leveraging religious influence to pacify the local population. It's pragmatic, even if it feels a bit manipulative."

 ABY_focus_serika_aby_13: "Restore Masaryk Monument"
 ABY_focus_serika_aby_13_desc: "A symbol of our commitment to the region's history. It buys us a lot of goodwill with the locals."

 ABY_focus_serika_aby_14: "Anti-Fascist Crusade"
 ABY_focus_serika_aby_14_desc: "Mobilizing our forces for a righteous war against the totalitarians. We have the moral high ground and the firepower."

 ABY_focus_serika_aby_15: ""
 ABY_focus_serika_aby_15_desc: "Rallying the troops with speeches and propaganda. We're on a mission to save the world, apparently."

 ABY_focus_serika_aby_16: ""
 ABY_focus_serika_aby_16_desc: "Coordinating with local resistance movements. We'll supply the guns if they supply the intelligence."

 ABY_focus_serika_aby_17: ""
 ABY_focus_serika_aby_17_desc: "Pushing deep into enemy territory. The Foreclosure Task Force doesn't know the meaning of retreat."

 ABY_focus_serika_aby_18: "Establish the SS (Schutzstaffel) / Praetorian Guard"
 ABY_focus_serika_aby_18_desc: "Forming an elite, fiercely loyal guard unit to protect the leadership and enforce our will directly."

 ABY_focus_serika_aby_19: ""
 ABY_focus_serika_aby_19_desc: "Deploying the guard to handle 'special' problems. Shiroko oversees their tactical training."

 ABY_focus_serika_aby_20: "Catholicism of the New Era"
 ABY_focus_serika_aby_20_desc: "Reforming the church to align with our state ideology. Faith should serve the nation, not the other way around."

 ABY_focus_serika_aby_21: "Chaplain Corps"
 ABY_focus_serika_aby_21_desc: "Sending priests to the front lines to boost morale. A little spiritual support helps when the artillery starts falling."

 ABY_focus_serika_aby_22: "Our True Enemy"
 ABY_focus_serika_aby_22_desc: "We've been distracted by petty squabbles. It's time to focus all our might on the real architects of this chaos."

 ABY_focus_serika_aby_23: ""
 ABY_focus_serika_aby_23_desc: "Gathering all our strength for the final push. No holding back this time."

 ABY_focus_serika_aby_24: "Discard the Old Ways"
 ABY_focus_serika_aby_24_desc: "Tradition is holding us back. We're embracing radical new methods to ensure Abydos not just survives, but dominates."

 ABY_focus_serika_aby_25: ""
 ABY_focus_serika_aby_25_desc: "Implementing total mobilization. The old school rules no longer apply."

 ABY_focus_serika_aby_26: "Sekhmet Legion"
 ABY_focus_serika_aby_26_desc: "Our most fearsome armored division, named after the goddess of war. They leave nothing but scorched earth behind."

 ABY_focus_serika_aby_27: "Respect the Rights of Locals"
 ABY_focus_serika_aby_27_desc: "Winning hearts and minds. If we treat the occupied territories fairly, they won't rise up against us."

 ABY_focus_serika_aby_28: "Adopt Strict Punishment Policy"
 ABY_focus_serika_aby_28_desc: "Zero tolerance for dissent or failure. We rule with an iron fist, and the law is absolute."

 ABY_focus_serika_aby_29: "Path of an Industrial Nation"
 ABY_focus_serika_aby_29_desc: "Transforming the desert into a powerhouse of heavy industry. The smoke stacks are the new monuments of Abydos."

 ABY_focus_serika_aby_30: "Advance to Carpathia"
 ABY_focus_serika_aby_30_desc: "Securing the mountain passes to solidify our geopolitical dominance in the region."

 ABY_focus_serika_aby_31: "Germany's New Friends"
 ABY_focus_serika_aby_31_desc: "A pragmatic alliance with Berlin. We secure our western flank and gain access to their advanced engineering."

 ABY_focus_serika_aby_32: "Operation Austerlitz"
 ABY_focus_serika_aby_32_desc: "Executing a masterclass in tactical deception. We'll shatter their armies before they even realize they're surrounded."

 ABY_focus_serika_aby_33: "Punishment"
 ABY_focus_serika_aby_33_desc: "Retribution for all the pain they've caused. The Foreclosure Task Force is collecting its due, with interest."

 ABY_focus_serika_aby_34: "Demand Custody of Suou"
 ABY_focus_serika_aby_34_desc: "We will not let her escape justice. Hand her over, or we will tear down every wall to find her."

 ABY_focus_serika_aby_35: "Eradicate the Balkan Threat"
 ABY_focus_serika_aby_35_desc: "Pacifying the region by overwhelming force. There will be peace, even if we have to enforce it at gunpoint."

 ABY_focus_serika_aby_36: "Inherit the Will of the Little Entente"
 ABY_focus_serika_aby_36_desc: "We take the leadership of the alliance. The smaller nations now answer to Abydos."

 ABY_focus_serika_aby_37: "Operation Odoacer"
 ABY_focus_serika_aby_37_desc: "The final strike to end the old empire. We are the new rulers of this era."

 ABY_focus_serika_aby_38: "End of Revenge"
 ABY_focus_serika_aby_38_desc: "The debts are paid in full. The enemies are vanquished. The thirst for vengeance has finally been quenched."

 ABY_focus_serika_aby_39: "Abydos Sand Festival"
 ABY_focus_serika_aby_39_desc: "A massive celebration in the desert to mark our ultimate triumph! Let the games begin, and let the whole world watch the glory of Abydos!"
