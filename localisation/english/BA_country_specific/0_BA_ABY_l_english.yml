 ABY_focus_first_desc: "It's certainly better than the situation during the Transference, isn't it? It has become clear where we should be, who we are with, and what we must do. Now that the coalition government negotiations with the Czechs and Germans have been concluded and executive orders have been issued to somewhat reconstruct our function as the student council, we must determine the direction of the nation. It is a pity that we cannot present the lifting of the state of emergency as a New Year's gift to our citizens. Let's hope for next year."
 ABY_focus_abydos_1_desc: "Nonomi: 'I can try reaching out to my family's company... but they don't usually do favors for free. Still, if it gets us the funding we need, I'll make the call!'"
 ABY_focus_abydos_2_desc: "Serika: 'We can't have thugs wandering around our turf! Let's set up more patrols. I'm not working overtime at Shiba Seki just to get robbed on the way home!'"
 ABY_focus_abydos_3_desc: "Ayane: 'The interest on the school's debt is still piling up... If we manage our new geopolitical resources carefully, we might finally be able to pay off a chunk of these bonds.'"
 ABY_focus_abydos_4_desc: "Hoshino: 'Uhe~ making everyone fight sounds exhausting... but if it keeps our home safe, I guess the old man will have to help train the newcomers.'"
 ABY_focus_abydos_5_desc: "Shiroko: 'The Helmet Gang is encroaching on our territory again. I've packed extra magazines. Let's sweep them out once and for all.'"
 ABY_focus_abydos_6_desc: "Nonomi: 'A lot of the land around here technically belongs to Nephthys. If we negotiate, maybe we can reclaim it for the school's agricultural projects!'"
 ABY_focus_abydos_7_desc: "Ayane: 'We don't have enough students for a massive Prefect Team like Gehenna, but establishing a formal committee will help maintain order and legitimacy in the district.'"
 ABY_focus_abydos_8_desc: "Hoshino: '...There are secrets buried in those sands. Things from the past. Let's just hope we don't wake up anything that should stay asleep.'"
 ABY_focus_abydos_9_desc: "Serika: 'Half the district is buried in sand! If we reorganize the safe zones, we can consolidate our defenses and maybe even attract some businesses back.'"
 ABY_focus_abydos_10_desc: "Ayane: 'These old blueprints from the Golden Age of Abydos... if we can decipher them, we might be able to restore some of the academy's lost technology.'"
 ABY_focus_abydos_11_desc: "Shiroko: 'A tactical strike to disable their command structure. Quick, quiet, and decisive. Just tell me where to aim.'"
 ABY_focus_abydos_12_desc: "Serika: 'Wait, we're supposed to start a riot?! Isn't that the opposite of keeping the peace?! Ugh, fine, but I'm bringing my assault rifle just in case.'"
 ABY_focus_abydos_13_desc: "Shiroko: 'Once the Foreclosure Task Force starts moving, we don't stop. We'll break through their lines before they even realize what hit them.'"
 ABY_focus_abydos_14_desc: "Nonomi: 'It sounds like an action movie title! But the stakes are real. We'll secure the riverway and make sure our supply lines stay open!'"
 ABY_focus_abydos_15_desc: "Hoshino: 'Nights like this make my joints ache... Everyone, stay sharp. Once the sun comes up, the whole landscape is going to look very different.'"
 ABY_focus_german_1_desc: "Ayane: 'Providing weapons to the gymnastic societies? It's an unconventional militia strategy, but we need boots on the ground to secure the region.'"
 ABY_focus_german_2_desc: "Serika: 'These extremists are causing nothing but trouble! We need to shut them down before their adventurism drags us into another massive debt... or worse.'"
 ABY_focus_german_3_desc: "Shiroko: 'Light infantry specialized in rough terrain. They'll be useful for securing the mountainous borders. I'll personally evaluate their marksmanship.'"
 ABY_focus_german_4_desc: "Hoshino: 'This guy is too loud and causing way too much friction. Let's put a stop to his schemes so I can finally get a quiet nap.'"
 ABY_focus_german_5_desc: "Ayane: 'If we can bring them into mainstream politics, we might be able to de-escalate the tension. We prefer negotiations over shootouts if we can help it.'"
 ABY_focus_german_6_desc: "Serika: 'If anyone thinks they can occupy this land like Kaiser did, they've got another thing coming. We're setting up safehouses and supply caches right now.'"
 ABY_focus_german_7_desc: "Shiroko: 'A dedicated vanguard unit. They seem highly motivated. As long as they point their guns at our enemies, we can use them.'"
 ABY_focus_german_8_desc: "Hoshino: 'Uhe~ I guess I'll show them a few tricks from the old days. Survival isn't just about shooting; it's about knowing when to hide.'"
 ABY_focus_german_9_desc: "Ayane: 'I've analyzed the enemy's logistics and troop movements. If we strike these three weak points simultaneously, their front will collapse.'"
 ABY_focus_german_10_desc: "Nonomi: 'Things are getting really heated in Linz. We should probably send in some peacekeepers... and maybe some snacks to calm everyone down?'"
 ABY_focus_german_11_desc: "Shiroko: 'The time for waiting is over. The signal is given. We'll hit their supply depots first to cripple their response.'"
 ABY_focus_german_12_desc: "Serika: 'We're taking the mountains! It's going to be a tough fight, but the Foreclosure Task Force doesn't back down from a challenge!'"
 ABY_focus_czecho_1_desc: "Ayane: 'I've scheduled an emergency meeting. We need the entire cabinet aligned if we're going to survive the upcoming political storm.'"
 ABY_focus_czecho_2_desc: "Nonomi: 'Restoring the heavy industry will do wonders for the local economy! Plus, having our own tank factories sounds super reassuring!'"
 ABY_focus_czecho_3_desc: "Shiroko: 'It's a critical strategic chokepoint. If we hold Egerland, we dictate exactly who gets to cross the border.'"
 ABY_focus_czecho_4_desc: "Hoshino: 'Veterans coming back to the front lines... I know that feeling all too well. Let's make sure they get the support they need.'"
 ABY_focus_czecho_5_desc: "Serika: 'This border dispute is giving me a headache! Can't they just share the territory? If they keep fighting, we'll have to intervene.'"
 ABY_focus_czecho_6_desc: "Nonomi: 'Our doors are open! Abydos could always use more residents, and protecting those fleeing from persecution is just the right thing to do.'"
 ABY_focus_czecho_7_desc: "Ayane: 'We're in desperate need of financial backing. If we can secure their support, paying off the school's debt might actually become a reality.'"
 ABY_focus_czecho_8_desc: "Serika: 'Organizing the southern territories under one committee will streamline our tax collection. More revenue means less debt!'"
 ABY_focus_czecho_9_desc: "Shiroko: 'We need people on the inside who know the local terrain. If they're willing to help us, I don't mind getting my hands a little dirty.'"
 ABY_focus_czecho_10_desc: "Hoshino: '...A controversial move. Pushing our own kind out of the local government might backfire, but if it prevents a civil war, maybe it's necessary.'"
 ABY_focus_czecho_11_desc: "Ayane: 'Sometimes you have to make hard choices. Suspending a few rules temporarily might be the only way to save the entire system from collapsing.'"
 ABY_focus_czecho_12_desc: "Nonomi: 'A new government is stepping up! Let's hope they know how to balance a budget better than the last guys did.'"

