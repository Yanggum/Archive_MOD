 ABY_new_event.229.t:0 "Notice for Abydos Users"
 ABY_new_event.229.d:0 "Hello, I am Mintcoon, the modder in charge of Abydos.\n\nFirst, I have tried various changes since the 1st Abydos Rework to provide you with a new experience, but I sincerely apologize for the results undergoing frequent resets and failures due to my lack of planning and modding skills. In particular, I express my deep reflection and regret regarding the numerous bugs and structural problems that occurred while ambiguously utilizing and fusing existing systems during the rework process.\n\nAccordingly, future reworks will be conducted after sufficient preparation and verification, and I will strive to ensure there are no large-scale overhauls after the next rework.\nHowever, due to various current real-life issues, especially academic difficulties, I have inevitably decided to temporarily suspend Abydos development until mid-November. I ask for your generous understanding of this decision made out of concern that forcing the rework of Abydos, a major country, while I am busy might lead to the recurrence of past problems.\n\nUntil mid-November, I will occasionally develop minor countries such as Egypt, and during that period, I plan to focus on preparations to raise the level of completion for Abydos once more. Even if that process takes a long time, and even if you forget for a while, I will strive to return with an appearance impressive enough to be deeply ingrained in your mind the moment you come back.\n\nI am deeply grateful for your generosity and continuous interest, and I will do my best to find you again with a better appearance."
 ABY_new_event.229.a:0 "Thank you."
 ABY_new_event.229.b:0 ""

 ABY_new_event.230.t:0 "Investigation Report - Trinity"
 ABY_new_event.230.d:0 "Overview: Investigation report regarding hundreds of corpses and medical equipment found in the basement of Trinity Cathedral.\nNote: Many records were burned or shredded before entering the Cathedral, leading to a lack of verifiable data.\n\nMystic Serum, Mystic Looms, etc., were found in large quantities near the corpses.\n\nThe cause of death is estimated to be common systemic organ failure or cardiac arrest due to somatic muscle overload and self-destructive immune activation.\n\nMystic levels exceeding normal ranges were observed in all corpses.\n\nThe content cannot be confirmed, but Tea Party orders were discovered, suggesting it was carried out under the leadership of the Trinity government.\n\nThe timing of death generally coincides with the Trinity government's "Support for Homeless and Socially Maladjusted" period.\n\nSynthesis: It is considered to be human biological experiments of the animal Mystic injection experiments conducted at the Abydos Central Mystic Research Institute. However, since most data was destroyed, no significant results could be derived other than the fact that injecting Mystic into humans without proper measures causes deaths with reactions similar to animals. More extensive research data support is needed.\n\n37th Mystic Research Team dispatched to the Cathedral."
 ABY_new_event.230.a:0 "Authorized."

 ABY_new_event.231.t:0 "Investigation Report - Gehenna"
 ABY_new_event.231.d:0 "Overview: Traces similar to the Trinity biological experiments were discovered in a large civilian facility near the Gehenna central district. No involvement of the Pandemonium Society or the Prefect Team was seen, leading to it being considered the act of a civilian club. While no samples succeeded, significant data was acquired.\n\nOverall, it shows an appearance similar to the medical facilities in the Cathedral basement, but basic research environments such as hygiene are not equipped.\n\nLethal doses by weight and BMI are recorded in detail. Death occurs immediately if it exceeds a certain level, and detailed figures are attached separately.\n\nIn personal research notes, there are no signs of receiving instructions from the Pandemonium Society or the Prefect Team; rather, the Prefect Team appears to have tracked them.\n\nPhysical abilities continuously increase when injecting Mystic below the lethal dose. At the critical point, physical abilities similar to Kivotos people are achieved, but the muscle tissue completely collapses within seconds, leading to death.\n\nAnimal experiments were conducted by back-calculating the figures, but they did not show achievements comparable to the captured research data. It is considered that there will be no significant effect other than on humans.\n\nSynthesis: It appears that auxiliaries such as stabilizers are needed during Mystic injection. Animal experiments cannot show significant results, so I propose to inevitably proceed with human experiments based on current research data.\n\n26th Research Team dispatched to the central district."
 ABY_new_event.231.a:0 "Autho (Erased)\nDenied."

 ABY_new_event.232.t:0 "Investigation Report - Millennium"
 ABY_new_event.232.d:0 "Overview: Traces of large-scale Mystic injection research were discovered in the basement of a research facility belonging to the Millennium Seminar. Most data were preserved in an intact state.\n\nGiven the scale of research data, it is estimated that at least tens of thousands were deployed. Therefore, data with more detailed figures than those found in the Gehenna region were discovered. Attached.\n\nAlthough located in a Seminar research facility, Seminar's approval or mention of them is absent in research notes and personal notes, making it impossible to confirm if Seminar was involved.\n\nSuccess in suppressing self-destructive immunity occurring during Mystic injection through blood dialysis and ingestion/injection of strong toxic drugs for about a week.\n\nSuccess in slowing down physical collapse in the same way, but research results show that the lifespan will be limited to around 5 years. \nNote: Classified as a top-secret matter.\n\nThe test subjects are estimated to have been disposed of, and traces of planned research to prevent lifespan reduction in subsequent research can be confirmed. Research plan: Additional injection of Kivotos Mystic, ... , Fetal Mystic injection, ... omitted. Please check attached data.\nNote: Classified as a top-secret matter.\n\nSynthesis: As a result of additional calculations based on the data, it was confirmed that it is impossible to delay collapse for more than 10 years no matter how much it is slowed down.\n\nAdditional Report: Mechanical suit experiments are showing progress following the acquisition of the research data due to the strict prohibition of human experiments. However, cooperation with the military appears necessary for practical research, and authorization is needed as the disclosure of said data appears unavoidable.\n\n3rd Research Team dispatched to Millennium."
 ABY_new_event.232.a:0 "Deferred."

 ABY_new_event.233.t:0 "Ministerial Meeting Report No. 395, Chapter 86 Summary"
 ABY_new_event.233.d:0 "Debate breaks out regarding the disclosure of Millennium investigation report data.\n\nAgreed on disclosing part of the data to the public.\n\nDetailed data to be disclosed to the military, but regulated not to leak below general rank.\n\nOmitted.\nNo. 396, Chapter 3 Summary\n\nConfirmation of the "Juggernaut" project's detailed report.\nConflict of opinions due to excessive required budget.\n\nRecords deleted.\n\nFinal conclusion derived."
 ABY_new_event.233.a:0 "Juggernaut project approved."
 ABY_new_event.233.b:0 "Juggernaut project rejected."

 ABY_new_event.234.t: "Economic Ministry Report: Company Selection"
 ABY_new_event.234.d: "The following three companies are promising as key partners for cooperation to concentrate the nation's limited resources and lay the foundation for economic reconstruction.\n\n. Nephthys Group (Technology R&D): Possesses Kivotos' unrivaled research technology. While lacking an immediate production base, it has the potential to secure technical independence and hegemony in future industries in the long term.\n\n. Rothschild Corporation (Finance): Essential for rebuilding the collapsed financial system and attracting external capital. The most reliable choice for laying the foundation of a stable economic cycle.\n\n. Škoda Works (Heavy Industry/Military): Guarantees immediate effects for responding to imminent military threats and strengthening defense capabilities. The most realistic alternative for the military independence of the Allied forces."
 ABY_new_event.234.a:0 "Rothschild & CO."
 ABY_new_event.234.b:0 "Škoda Works"
 ABY_new_event.234.c:0 "Nephthys Group"

 ABY_new_event.235.t:0 "Asagiri Suou"
 ABY_new_event.235.d:0 "The capable commander Asagiri Suou, who rallied the Nephthys PMC—which had lost its commander during the Great Transfer—to resist Hyakkiyako and supported the provisional government with armored trains during the escape from Prague, promised today to formally leave Highlander Railroad Academy and serve as a commander of the provisional government forces.\n\nAccordingly, the Nephthys PMC under her command (officially owned by the Nephthys Group) has also become part of the provisional government forces.\n\nThe provisional government expresses great gratitude to her, and she has also sworn loyalty."
 ABY_new_event.235.a:0 "With such a capable person joining us, the future of the provisional government is bright!"

