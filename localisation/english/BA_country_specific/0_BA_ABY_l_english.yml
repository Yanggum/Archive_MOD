 #ABY_descision_focus_abydos_7_effect: "§Y두 세계의 국가§! 국민정신의 §Y결속도§! 5 §Y증가§!\n§YNephthys PMC division§! 편제 한도가 §G+1§!만큼 변동.\n(§Y북주데텐란트§!): §Y북주데텐란트§!에서 §Y아비도스§! 부대 생성"
