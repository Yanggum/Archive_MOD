 ABY_new_event.209.t:0 "임시정부의 귀환"
 ABY_new_event.209.d:0 "에드바르트 베네시는 차량에 앉아 천천히 프라하로 향하는 길을 바라보았다. 연합군의 승리로 보헤미아를 되찾았다는 사실은 분명 자랑스러운 일이었다. 그러나 그의 마음은 무겁기만 했다. 백귀야행의 흔적이 남은 고향이 어떤 모습일지, 그는 이미 이야기를 통해 알고 있었다. 하지만 실제로 눈앞에 펼쳐지는 풍경은 머릿속 상상과는 차원이 달랐다.\n\n도시가 가까워질수록 일본식 건축 양식이 더 뚜렷하게 보였다. 기와 지붕이 이어진 거리, 일본식 정원, 붉은 도리이들이 낯익은 풍경을 완전히 대체하고 있었다. 한때 프라하의 중심을 이루던 체코의 건물들은 대부분 사라졌고, 일부 남아 있는 건물조차도 일본식으로 변형되어 있었다.\n\n베네시는 차창 밖으로 보이는 풍경을 바라보며 깊은 한숨을 내쉬었다. 그는 이 변화가 불가피했음을 알고 있었다. 이미 보고를 통해 상황을 알고 있었고, 이를 되돌리는 데 시간이 걸릴 것이라는 현실도 받아들이고 있었다. 그러나 이렇게 직접 눈으로 본 프라하는 상상 속에서 느낀 것보다 훨씬 더 이질적이고 낯설었다.\n\n몰다우 강 위에 자리한 카를교도 그의 마음을 아프게 했다. 아직 다리 자체는 온전했지만, 난간 위에 걸린 일본식 등불들이 낯설게 빛나고 있었다. 그가 기억하던 카를교, 체코인의 자부심이 서려 있던 그 모습은 어디에서도 느낄 수 없었다.\n\n“여기가 정말 프라하란 말인가…” 베네시는 스스로 중얼거렸다. 목소리에는 복잡한 감정이 스며 있었다.\n\n그는 과거의 프라하를 떠올렸다. 성 비투스 대성당의 장엄한 실루엣, 광장에서 자유를 노래하던 시민들. 지금 눈앞의 도시는 그 모든 기억을 배반하는 것 같았다.\n\n그럼에도 그는 자신을 다잡으려 애썼다. 프라하가 지금 이 모습으로 남아 있다고 해서, 체코의 정신마저 잃어버린 것은 아니었다. 도시를 바꾸는 데 시간이 걸리겠지만, 체코의 혼을 되살리는 일은 여전히 가능할 것이다.\n\n그날, 프라하의 하늘에는 구름이 잔뜩 끼어 있었지만, 베네시의 마음속에는 희망이 밝게 타올랐다."
 ABY_new_event.209.a:0 "“이제 시작일 뿐이다.”"
 
