 ABY_event.49.t:0 "The Only Option"
 ABY_event.49.desc:0 "Several political parties have been born since the launch of the Abydos Provisional Government.\n\nAmong the various parties, representative ones include:\n * A democratic party proposing that the parliament be formed centered around Hoshino of the Abydos Task Force and that the people elect parliament members.\n * A communist party proposing that Hoshino be the supreme ruler, while the people work for the party and enjoy an equal life without wealth disparity.\n * A fascist party proposing that Hoshino be the supreme ruler of the nation, while the citizens serve the state.\n\nThese are the representative parties.\n\nHowever, we felt that such diverse opinions among parties might actually hinder national development.\nNow we must choose a single party among these many options."
 ABY_event.49.a:0 "With the strength of the Nation!"
 ABY_event.49.b:0 "With the strength of the People!"

