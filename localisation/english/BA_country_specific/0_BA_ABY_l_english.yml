 ABY_idea_czech_comming:0 "Czech Asylum"
 ABY_idea_czech_comming_desc:0 "Czechs are seeking asylum in large numbers from what they call 'Bohemia,' formerly the center of Czechia.\nThey are burning with fighting spirit and a desire for revenge, and have agreed to cooperate with us."
 ABY_idea_no_people:0 "Shortage of Administrative Personnel"
 ABY_idea_no_people_desc:0 "The system of a nation does not run solely on the head of state and ministers. In fact, one could say the working-level staff below them is more important, but right now, we lack such staff.\n\n§YWe will be able to improve the situation by regaining control of the provisional government.§!"
