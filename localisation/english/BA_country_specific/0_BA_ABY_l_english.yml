 ABY_political_desc:0 "\nA text about various ethnicities and factions clashing for influence\n\n\n§YThe political direction will be determined following the reclamation of Bohemia based on the political situation!§!\n\nIf §2Democracy§! is §Yin power§!, authority will be transferred to the Czech Provisional Government.\n\nIf the §RCommunist§! party is §Yin power§!, ???\n\nIf §LFascism§! is §Yin power§!, the Republic of Austria will be restored.\n\nIf §gNon-Aligned§! is §Yin power§!, Abydos High School will take the lead.\n§YIf the Abydos Economic Domination focus is complete, the Nephthys Group will take the lead!§!\n"
