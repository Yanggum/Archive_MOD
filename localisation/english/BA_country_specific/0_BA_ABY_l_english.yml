 ABY_new_event.209.t:0 "Return of the Provisional Government"
 ABY_new_event.209.d:0 "Edvard Beneš sat in the vehicle and slowly watched the road heading to Prague. Reclaiming Bohemia through the Allied victory was certainly a proud thing. However, his heart was only heavy. He already knew through stories what his homeland, left with the traces of Hyakkiyako, would look like. But the scenery unfolding before his eyes was on a different level from the imagination in his head.\n\nAs the city grew closer, Japanese architectural styles became more distinct. Streets lined with tiled roofs, Japanese gardens, and red torii gates were completely replacing familiar sights. Most of the Czech buildings that once formed the heart of Prague had vanished, and even the few remaining buildings were modified into Japanese styles.\n\nBeneš let out a deep sigh while looking at the scenery outside the car window. He knew this change was inevitable. He already knew the situation through reports and was accepting the reality that it would take time to reverse this. However, seeing Prague with his own eyes was far more heterogenous and unfamiliar than he felt in his imagination.\n\nThe Charles Bridge sitting over the Vltava River also pained his heart. The bridge itself was still intact, but Japanese lanterns hanging on the railings were shining strangely. He could not feel the Charles Bridge he remembered, the place where Czech pride resided, anywhere.\n\n“Is this really Prague...” Beneš muttered to himself. Complex emotions were seeped into his voice.\n\nHe recalled the Prague of the past. The majestic silhouette of St. Vitus Cathedral, the citizens singing of freedom in the square. The city before his eyes now seemed to betray all those memories.\n\nNevertheless, he struggled to compose himself. Even if Prague remained in this state now, it did not mean the Czech spirit was lost. It would take time to change the city, but reviving the Czech soul would still be possible.\n\nThat day, the sky over Prague was filled with clouds, but hope burned brightly within Beneš's heart."
 ABY_new_event.209.a:0 "“This is just the beginning.”"

