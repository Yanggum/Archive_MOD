 ABY_shiroko_dem_event.1.t: "Between Trust and Collusion"
 ABY_shiroko_dem_event.1.d: "The round table meeting room of the Presidential Residence. Shiroko put her election certificate on the table and let out a sigh.\n\n"Yeah... Honestly I'll say. I'm confident in military operations or tactical command. But complex bills, budgets, or administrative procedures are a headache. It's impossible alone."\nShe looked at the four people sitting opposite her. Comrades of the revolution, and no different from family, the Foreclosure Task Force members.\n"Help me. You are the only ones I can trust."\nShiroko unfolded an organizational chart prepared in advance.\n"Hoshino-senpai, please be the Minister of Labor. Senpai is... lazy but knows well about the hard parts of people. Make sure the workers don't feel wronged."\n\n"Uhehe~ You're making this old-timer do the most annoying thing. Well, if Shiroko-chan asks I can't refuse."\n\n"Ayane, you're the Minister of Foreign Affairs. Since you're eloquent and smart, make sure other countries don't ignore us."\n\n"Ha... you're really reckless. But it's true that diplomacy is urgent now... I will do my best."\n\n"Serika is the Minister of Interior and Safety. Since you're meticulous, take care of state affairs without a gap."\n\n"Wait, why am I administration?! Well... if I leave it to you there will obviously be holes in the budget so I have to do it!"\n\n"Finally Nonomi, Minister of Economy. Isn't Nephthys the best at rolling money?"\n\n"Oh my~ Leave it to me. I'll fill the Federation's storehouse."\n\nIt was an efficient but dangerous decision. She couldn't avoid criticism of 'nepotism' where the core power of the nation is concentrated in those from a specific school, and even among a small group of friends. But for the new President Shiroko who has no base, there was no choice other than this 'wolf pack' she can lean her back on."
 ABY_shiroko_dem_event.1.a: "Getting criticized is my part."

 ABY_shiroko_dem_event.2.t: "Proclamation of the United States of Greater Abydos"
 ABY_shiroko_dem_event.2.d: "The square in Bratislava was a festive atmosphere. Citizens of Czechia, Slovakia, Hungary, and Austria were freely waving flags while wearing their respective traditional costumes.\n\nShiroko, who stood on the platform, was dressed in a suit. She looked at the manuscript once and brushed it aside.\n\n"Yeah. Nice to meet everyone. Today we are making a new start."\n\nShe pointed at the map.\n\n"We fought each other, and hated each other. But not anymore. We 'voted' to recognize each other's differences and live together. We didn't combine by force. We chose it."\n\nShiroko declared.\n\n"Czechia's industry, Austria's art, Hungary's agriculture, Slovakia's nature... and Abydos' will. All of these gathered into one. From today on, we are the United States of Greater Abydos."\n\nInstead of clenching her fist, she took a gesture of asking for a handshake.\n\n"United States. Respect each other's ways. But if someone messes with our family, then we will fight as one. It's simple. Free, but solid."\n\n"Waaaaah-!!"\n\nThe citizens' cheers came from hope rather than fear."
 ABY_shiroko_dem_event.2.a: "The moment the union of free people is born."

 ABY_shiroko_dem_event.3.t: "The Wave named Justice"
 ABY_shiroko_dem_event.3.d: "The parliament was heating up hot. The agenda was the case of oppression of Hungarian-affiliated residents occurring in the Romanian border zone. Hardline members of the National Social Liberal Party raised their voices.\n\n"This freedom and democracy we enjoy, the brothers beyond the border do not enjoy! Is it truly Abydos' justice to ignore those who groan under the oppression of dictators?"\n\nThe survey results were overwhelming. The citizens were intoxicated by the success experience of the 'Velvet Revolution.' They believed that the democracy they won was an absolute good, and a craze for a 'democratic crusade' to spread this to neighboring nations too was blowing.\n\nShiroko was watching the parliamentary debate broadcast on TV from her office.\n"I... hate war. But..."\n\nAyane entered holding a report.\n"Madam President, you cannot ignore public opinion. Citizens want the government to 'act.' If we do not intervene, citizens will think the government condones dictatorship."\n\nIt was an irony. Because it was a democratic government, she couldn't go against the will of the people to "overthrow dictatorship." Even if that meant infringement of sovereignty and war.\n\nShiroko said bitterly while looking out the window.\n"Yeah. If the people want it, we must do it. Driving out dictators, and giving them the right to vote. That... is our justice."\n\nShiroko didn't want it, but the system and public opinion were pushing her toward the path of hegemonistic expansion. Under the name of 'Spreading Freedom,' the tanks of the United States of Greater Abydos began to start their engines."
 ABY_shiroko_dem_event.3.a: "War wanted her."

 ABY_shiroko_dem_event.4.t: "The Teeth Protecting Freedom"
 ABY_shiroko_dem_event.4.d: ""Democracy? Don't make me laugh! It's nonsense from weaklings!"\n\nIn the square, extremists wearing black uniforms were marching while holding torches. They were about to throw stones at a passing Kivotos student while shouting 'pure blood.' This is not freedom of expression. It's violence.\n\nI was about to blow my whistle, but their numbers were too many. It was at that moment.\n\n"Leave this to us."\n\nA low but chilly voice. It was a member of the 'Wolf Pack,' the guard unit directly under President Shiroko. Although she was just one person wearing a tactical vest over an Abydos school uniform, she didn't even bat an eye before dozens of rioters.\n\n"Hey, it's a democratic nation! We have the right to protest!"\nThe agitator shouted.\n\nThe girl replied coldly.\n"You have rights. But you don't have the right to infringe on other people's rights. We don't have freedom to give to those who try to destroy democracy in our United States."\n\nAs she made a gesture, armored cars that were waiting blocked the road. Over-suppression? Dictatorship? Someone might say so. But I saw the expressions of relief of the frightened kids and old people who hid behind her back.\n\nFreedom is not free. Someone must have the strength to suppress evil, and someone must set a fence with strict rules. To have sheep graze peacefully, a sheepdog is needed to bite and kill the wolf outside the fence. Authority was not a shackle that oppresses us, but a steel pillar that supports our freedom so it doesn't crumble."
 ABY_shiroko_dem_event.4.a: "Authority and rights sometimes go together."

 ABY_shiroko_dem_event.5.t: "Separately but Together"
 ABY_shiroko_dem_event.5.d: "Our dormitory is a mess. In the room next to mine lives an Austrian who practices opera every night, and in the room above lives a student from Gehenna who is obsessed with rock music. In the room across, a Hungarian painter hangs bizarre abstract paintings in the hallway.\n\nWe don't even eat together. I eat a bento, and the soprano eats schnitzel. We hate things like 'team building events.' We are thoroughly individuals. We don't interfere in each other's lives, and we only immerse in our own art.\n\nBut something strange happened.\n\nThis semester's graduation work exhibition. Even though we didn't form a team, the exhibition hall was like one massive symphony. In line with the soprano's singing voice, the Gehenna's electric guitar took the rhythm. Behind that, the Hungarian painter's painting received the lighting. My cherry blossom installation art filled the space, flowing between them.\n\nNo one conducted it. Because we didn't forcibly coerce to 'become one,' we expressed what was most 'like me,' and as those intense personalities gathered, a new harmony that no one expected was born.\n\n"This is our style."\n\nA passing viewer marveled.\n\nI nodded. We do not lump together like water droplets. Instead, we become grains of sand with tens of thousands of different colors, drawing a massive and beautiful mosaic."
 ABY_shiroko_dem_event.5.a: "Diversity brings new inspiration."

 ABY_shiroko_dem_event.6.t: "Beautiful Mosaic without Mixing"
 ABY_shiroko_dem_event.6.d: ""This is an impossible combination."\n\nAt first I thought so. I am a 3rd-generation traditional Sachertorte artisan. The concentration of chocolate, the acidity of apricot jam, all of that was Austrian pride calculated perfectly. But the new part-time student in our shop, 'Miyako,' a girl with fox ears from Hyakkiyako, made an absurd proposal.\n\n"Manager, how about adding matcha cream and red beans to this cake? The bitter taste will catch the sweetness!"\n\nI was aghast. Oriental ingredients to Vienna's tradition. We had different roots. I grew up meeting the wind of the Alps, and that child came from a mysterious academy city where cherry blossoms flutter. Our cultures seemed as if they couldn't mix like water and oil. However, when I couldn't win over Miyako's persistent persuasion and put out a prototype, I doubted my eyes.\n\nThe cafe was crowded with customers. Customers cheered for the clean taste of matcha coming after the rich flavor of chocolate. It wasn't a taste forcibly mixed and lumped into one. Chocolate was chocolate, and matcha was matcha, each maintaining its own color vividly yet having a mysterious dance in the mouth.\n\nI realized looking at the swinging tail of Miyako taking orders at the counter. We don't necessarily need to become the same. We don't need to mix. Like how trees with different roots form a forest, we can bear more abundant fruits just by standing next to each other. On the massive plate called the United States of Greater Abydos..."
 ABY_shiroko_dem_event.6.a: "We were each giving our own taste and shining together."

 ABY_shiroko_dem_event.7.t: "Girl with a Gun and a Monkey Wrench"
 ABY_shiroko_dem_event.7.d: "I lived wearing oil-stained work clothes my whole life. A monkey wrench is held in my hand, and I was busy just making a living day by day. On the other hand, the student from Abydos sitting in our district office was carrying a submachine gun over her school skirt. She is a superhuman who can break one tank alone.\n\nHonestly, I was scared. The difference in strength is this much, how can it be equal? If she makes up her mind, she could suppress someone like me with one finger.\n\nBut on voting day, in the long line in front of the polling station, I saw her. She was wearing a representative badge, but she didn't use the special passage. she was silently waiting for her turn behind me.\n\n"Hey, student. No, representative. Why don't you go in first?"\n\nAs I hesitated and tried to yield my place, she shook her head and smirked.\n"No, mister. It's the same here."\n\nA single ballot paper she held up. And a single ballot paper held in my hand.\n\nPhysical strength might be the difference between heaven and earth. But the weight of this single piece of paper, the weight of sovereignty determining the nation, was exactly the same down to the decimal point.\n\nShe put the paper into the ballot box while carrying her gun, and I did the same with the wrench in my pocket. At that moment, I finally realized that I am the master of this massive United States. The miracle where a superhuman and an ordinary person, a power-holder and a worker become perfectly equal as one citizen before the ballot box."
 ABY_shiroko_dem_event.7.a: "That was the democracy of the Federation."

 ABY_shiroko_dem_event.8.t: "A Single Name within a Flood"
 ABY_shiroko_dem_event.8.d: "The Danube River flooded. It was a record-breaking heavy rain. As the levee reached a point where it might collapse, the siren rang. I rushed to the riverside with a shovel.\n\nHundreds of people were already gathered there. High-nosed Austrians who wouldn't even talk normally, blunt Czechs, and students of Kivotos with halos on their heads.\n\n"There! Bring more sandbags!"\n\n"This side is collapsing! Link shoulders!"\n\nIt wasn't that someone started first. As an Abydos student lifted rocks that couldn't be lifted with human strength, Hungarian farmers filled soil bags under them. Slovakian grandmothers carried rice balls, and German-affiliated engineers repaired pumps.\n\nIn the mud where rain poured down, we were not 'individuals.' It wasn't important what ethnicity the man next to me was, or what ideology he had. We were one living being gathered under the massive name 'Greater Abydos.'\n\n"Heave-ho! Heave-ho!"\n\nLinking each other's arms and blocking the fierce current, I felt a tremor.\n\nIf it were me alone, I would have been swept away and died. But if we gather, we can block even this massive anger of nature.\n\nWhen morning came and the rain stopped, we laughed looking at each other covered in mud. The clothes we wore and the words we used were different, but at that moment we were surely beating with one heart. Unity is survival, division is death."
 ABY_shiroko_dem_event.8.a: "That simple and yet powerful truth protected us."

 ABY_shiroko_dem_event.9.t: "Soul Beyond the Halo"
 ABY_shiroko_dem_event.9.d: "The exchange student from Shanhaijing, 'Lin-Lin,' sitting in the window seat of the classroom, always stood out. It wasn't just because of the mysterious ring, the 'halo,' floating over her head. She was the student who threw the sharpest questions during class.\n\nOne day, a debate over the 'Ship of Theseus' occurred. Is a being the same if the spirit is the same even if the flesh is changed?\n\nSome students drew a line calling the Kivotos people 'different species.' A body that doesn't die even if hit by bullets, a look that doesn't age. The claim was that they were from a fundamentally different origin from us Earthlings, perhaps even extraterrestrial beings.\n\nThen Lin-Lin raised her hand and said:\n\n"I also have my stomach growl when I'm hungry, and tears come when I watch a sad movie. My heart aches when I think of my parents back home. Does the weight of the emotion called 'longing' I feel differ from yours just because my body is sturdy and I have a ring on my head?"\n\nSilence flowed in the classroom in an instant. The small water drop in her eyes. It was exactly the same component, the same color as the tears I shed at my mother's funeral.\n\nWhen class ended I handed her a coffee. We laughed and talked while walking along the Vltava River. It wasn't important where the origin of the flesh was. We laugh looking at the same thing, we get angry at the same thing, and we dream of the same future. That day I became certain. That shining halo is not a mark different from us, but just an exquisite lamp proving that they are siblings with the same soul."
 ABY_shiroko_dem_event.9.a: "Perhaps our roots are not different."

 ABY_shiroko_dem_event.10.t: "Iron Fist for Democracy"
 ABY_shiroko_dem_event.10.d: ""A dispersal order? This is dictatorship! It's oppression!"\n\nThe representative of the Radical National Socialist Party shouted at the top of his lungs as he was dragged out by the military police. Shiroko watched that scene expressionlessly.\n\nWith the National Social Liberal Party occupying a majority of the parliament, Shiroko proposed the 'Act for Protection of Democracy,' forcibly disbanding parties that deny the basic democratic order. Nazi remnants, Suou-following forces, and violent anarchists were the targets.\n\nOn the other hand, for parties like the Communist Party receiving support from the Soviet Union or the Liberal Party backed by Western capital, even if their line was different or they were connected to foreign powers, she perfectly guaranteed the freedom of activity as long as they recognized 'elections and parliamentary democracy.'\n\nAt the press conference site, a reporter asked sharply:\n"Madam President, isn't it a contradiction to only pick specific parties to disband? Shouldn't democracy respect diversity?"\n\nShiroko grabbed the microphone and replied shortly:\n"Yeah. But a player who breaks the game rules cannot be put on the ring. I won't overlook bastards who try to use democracy to destroy democracy. That is our rule."\n\nHer attitude was firm. 'No tolerance for those who do not show tolerance.' The wolf 가차 없이 bit and killed the leeches trying to enter inside the fence to protect the sheep flock of democracy."
 ABY_shiroko_dem_event.10.a: "That might look like dictatorship, but it was a defense mechanism of democracy."

 ABY_shiroko_dem_event.11.t: "Dream Built on the Desert"
 ABY_shiroko_dem_event.11.d: "A massive construction site in Győr, Hungary. The sunset was painting the skeletal steel structure red. A national project to excavate and restore the Abydos High School Main Building, buried at the spot where the sand mountain used to be, was in full swing.\n\nShiroko, wearing a safety helmet, was walking through the construction site. The smell of dust and the welding sparks gave a strangely nostalgic feeling.\n\n"Is this... really right."\n\nshe muttered. This building, in which a lot of budget was invested, will become the new symbol of the United States. A place to remember the lost home and commemorate the harmony of the two worlds. But at the same time, this was a lingering regret for the past, and a means to display the dignity of the nation that has grown massive.\n\n"Even if we build a school, we can't return to being the students of that time."\nShiroko knew. she was no longer a high school girl who joked about robbing a bank. she was the President responsible for the lives of tens of millions of citizens, who sometimes had to order a war she didn't want.\n\nThe main building being reconstructed was majestic and beautiful, but it looked lonely somewhere. Like a stuffed past. Shiroko, imagining her portrait that would hang here after completion, smiler bitterly."
 ABY_shiroko_dem_event.11.a: ""Still... because having a place to return to isn't bad.""

