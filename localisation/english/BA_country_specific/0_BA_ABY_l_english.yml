 ABY_descision_focus_event.38.t:0 "교수인"
 ABY_descision_focus_event.38.d:0 "끼릭. 철컥.\n\n상황이 바뀌었다.\n얼마 전 그가 겨누었던 권총은 이제 그를 겨누고 있었다.\n\n사실 그도 거사가 성공하리라고는 생각치 않았다.\n그렇기에 독일로의 탈출 루트까지 계획해놨건만...\n헨라인, 그 변절자의 정보력은 생각보다 강했다.\n\n"뭐라도 할 말 있나, 프랑크?"\n\n"...하나만 묻겠다."\n"당신은 독일인이면서, 왜 대독일의 품 안에 하나될 생각을 하지 않는 거지?"\n\n"뭐, 그거야 위대한 민주주의 이상에 감복해서가 아니겠나."\n헨라인은 이죽거리며 대꾸했다.\n\n"개소리 말고."\n\n"킥, 티났나?"\n\n"날 놀릴 생각이라면 그냥 죽여라. 그런 말 들을려고 살아있는게 아니니까."\n\n"그래, 제대로 말해주지."\n"우리 주데텐인들은, 대대로 이 보헤미아에서 귀족 노릇을 해왔어. 그 체코슬로바키아 건국 이후에도 우리는 큰 목소리를 낼 수 있었고, 사회의 특권층에 올라갈 수 있었지."\n"근데 독일의 한 시민이 된다? 그 특권을 모두 버리고 일개 소시민이 되라는 것 아닌가. 나는 그냥 떵떵거리며 살고 싶을 뿐이라고."\n\n"이... 이 역겨운 놈!"\n"겨우 그딴 사소한 이유로, 독일 민족의 위대한 운명을 거부한다는 말이냐! 변절자 자식! 독일 민족의 전체는 오직 하나, 독일 민족을 위해 존재한다! 사사로운 욕심에 그 대의를 버리는 걸 보니 네놈, 유대인의 피가 섞... 커헉!"\n\n"유대인 같은 소리하네. 내가 두 번째로 싫어하는게 유대인이라는 걸 모르나?"\n\n"크헉, 허억, 두 번째? 그럼 첫 번째는 뭐냐?"\n\n"뭐긴 뭐야, 네놈들 나치지.""
 ABY_descision_focus_event.38.a:0 "프랑크가 뭐라고 대꾸하기 전에, 헨라인은 방아쇠를 당겼다."

 ABY_descision_focus_event.39.t:0 "은퇴"
 ABY_descision_focus_event.39.d:0 ""...우리 체코슬로바키아, 오스트리아-헝가리의 잔재에서 태어난 유일한 민주주의 국가는, 그 대의를 영원히 가슴에 품고 미래로 나아갈 것입니다."\n"이에 선언합니다. 나, 토마시 가리크 마사리크는 10일 후 8시를 기점으로 대통령직을 사임하며, 이후 어떤 정치적 상황에도 중립을 지킬 것임을 맹세합니다."\n\n그 누구도 이를 짐작하지 못하였다. 에드바르트 베세시를 비롯한 정치계의 고위 인사들마저 얼굴에 만연한 당혹감을 감추지 못했다.\n\n"으흠, 많이 당황스러우시겠죠. 미리 말씀드리지 못한것은 죄송할 따름입니다. 하지만 저는 이미 35년, 대통령직을 그만두고 야인으로 살고자 하기로 하였습니다. 지금은 동서고금에 전례가없는 비상상황이기에 임시로 맡은 것이었지요."\n"정부가 구성된 지금, 제가 계속 이 자리에 있는 것은 헌법에 위배되는 행위이기도 합니다. 무엇보다, 이 늙은이가 언제까지 살겠습니까? 허허."\n\n그 본인은 웃고 있었지만, 좌중은 침울한 감정을 숨기지 못하였다.\n\n"여러분, 전 이제 내일모레면 아흔을 바라보는 나이입니다. 저는 제가 나이탓에 잘못된 판단을 내릴 것이 두렵습니다. 언제 덜컥 죽어 이 나라를 혼란에 빠뜨리는 것도 원하지 않습니다. 이 나라에는 새로운 젊은 피가 필요합니다. "\n"그렇기에, 1주일 후 총선거를 진행할 생각입니다. 그러니 부탁드립니다. 여러분께 주어진 소중한 권리를 행사해 주십시오. 땅을 잃더라도 민주주의의 대의는 잃지 않음을 저들에게 보여주십시오."\n"우리들은 절대 폭력과 압제에 굴복하지 않을 것임을 보여주십시오!"\n\n연설이 끝나자, 우레와 같은 박수갈채가 쏟아져 나왔다. 단상을 내려오는 마사리크는 눈물이 흘렀지만, 그 뒤로 파도처럼 몰려오는 안도감이 그를 달래었다."
 ABY_descision_focus_event.39.a:0 "안녕히."

 ABY_descision_focus_event.40.t:0 "토마시 마사리크"
 ABY_descision_focus_event.40.d:0 "출범식이 끝나고, 토마시 마사리크는 카를로비바리 외곽에 준비된 그의 거처로 돌아왔다.\n옷걸이에 그의 중절모와 기다란 외투를 걸쳐놓고, 그는 작은 나무의자에 넘어지듯 털썩 주저앉았다.\n아까의 정력적인 모습은 온데간데없이, 지칠 대로 지친 노인의 모습을 한 그는 지갑에서 명함만한 두개의 작은 종잇조각을 꺼내들었다.\n\n프라하가 사라지며, 그의 집과 함께 아들 얀 마사리크와 딸 올가 마사리코바 역시 사라졌다. 종잇조각은 자식들의 옷가지 한 벌 남지 않은 그가 가진 유일한 기억의 조각인 사진이었다.\n\n그는 흰 카네이션이 꽃힌 두 꽃병에 아들과 딸의 사진을 기대어 두고, 오는 길에 산 싸구려 와인과 주스를 꽃병 앞에 놓인 두 유리잔에 부었다.\n\n뜨거운 눈물이 그의 볼을 타고 내렸고, 이내 안경을 썼음에도 눈물이 앞을 가려 보이지 않게 하였다. 그는 감정을 조절할 줄 모르는 어린아이처럼, 책상에 엎드려 크게 울었다.\n미안하다고, 너희들을 데려갔어야 했다고, 소식이 들리고 바로 프라하로 달려가고 싶었지만 자신을 따르는 사람들이 발목을 잡아 어쩔 수 없었다며 들어주지도, 받아줄 이도 없는 사죄를 이어갔다.\n다른 이들 앞에서 그는 강인해야 해서, 자신이 좌절하면 모든 이들이 희망을 잃을 거라서, 자신은 얀과 올가의 아버지가 아닌 체코의 아버지가 되어야 했다며 한탄하다가 이내 지쳐 잠이 들었다.\n\n그는 체코의 아버지였지만, 두 아이의 아버지이기도 하였다."
 ABY_descision_focus_event.40.a:0 "그는 평범한 아버지였다."

 ABY_descision_focus_event.41.t:0 "루트비히 체흐의 사망"
 ABY_descision_focus_event.41.d:0 "1937년 3월의 쌀쌀한 바람이 카를로비바리의 묘지에 불었다. 대전이 직후의 혼란 속에서 입은 총상의 후유증은 끝내 '두 세계의 국가'에서 가장 헌신적인 화합의 상징을 앗아갔다. 루트비히 체흐, 체코인과 독일인의 공존을 평생의 신념으로 삼았던 노정객은 그렇게 잠들었다.\n\n그의 장례식에는 연립정부의 많은 요인들이 모여 고인의 마지막 길을 배웅했다. 에드바르트 베네시와 오쿠소라 아야네를 비롯한 체코와 아비도스 대표단은 침통한 표정으로 자리를 지켰다. 다만 '보헤미아의 아버지' 마사리크는 노쇠한 건강 문제로 참석하지 못해, 한 시대가 저물고 있음을 암시했다.\n\n추도사를 위해 연단에 오른 것은 콘라트 헨라인이었다. 그는 체흐의 숭고한 뜻을 기리면서도, 남겨진 주데텐 독일인들의 단결과 나아갈 길을 역설했다. 이는 단순한 추모사를 넘어, 체흐의 유지(遺志)를 이어받은 새로운 지도자로서의 자신을 각인시키는 선언과도 같았다. 구시대의 화합을 상징하던 별이 졌지만, 그의 죽음은 역설적으로 남은 이들의 기묘한 연대를 더욱 단단히 묶는 계기가 되었다."
 ABY_descision_focus_event.41.a:0 "한 시대의 별이 진다."

 ABY_descision_focus_event.42.t:0 "군에 대한 우려"
 ABY_descision_focus_event.42.d:0 ""
 ABY_descision_focus_event.42.a:0 "정치장교가 방파제가 되어줄 것이다."
 ABY_descision_focus_event.42.b:0 "군의 자율성을 존중해라."

 ABY_descision_focus_event.43.t:0 "두 번째 독대"
 ABY_descision_focus_event.43.d:0 ""으헤~ 데자뷰인가… 또 이 상황이네."\n\n호시노가 툴툴거리며 바닥에 주저앉자, 맞은편의 마사리크가 허허, 하고 낮게 웃었다. 굳게 닫힌 작업실 문은 1년 전 그날과 똑같은 모습이었다. 하지만 두 사람 사이를 흐르던 어색하고 날 선 공기는 온데간데없었다.\n\n"그러게 말입니다. 이번엔 또 누구의 실수일지. 그래도 지난번처럼 어색하지는 않으니 다행이군요."\n\n마사리크의 말에 호시노는 피식 웃었다. 지난 1년간, 그녀는 마사리크를 의심하는 대신 그에게서 배우는 길을 택했다. 그는 때로는 엄격한 스승이었고, 때로는 다정한 할아버지였다.\n\n"시간도 많은데, 이야기나 할까? 센세."\n\n호시노가 먼저 말을 꺼냈다. 이제 그녀는 자연스럽게 그를 '센세'라 불렀다.\n\n"좋지요. 내가 묻고 싶은 것이 있었는데… 우리가 린츠와 프라하를 되찾은 이후, 호시노는 무엇을 하고 싶은가요?"\n\n마사리크의 눈빛은 한낱 학생이 아닌, 한 명의 정치적 동료를 향한 진지한 질문을 담고 있었다. 호시노는 잠시 천장을 보며 생각하다, 결심이 선 듯 똑바로 그를 마주 보았다.\n\n"정치를 하려고. 민생을 안정시키고, 모두가 평등한 기회를 얻고, 최소한의 복지를 보장받는 사회. 그런 걸 목표로 하는 이들을 모아 정당을 만들거야."\n\n"사회주의적 빅텐트 정당인가요? 훌륭한 목표입니다." \n마사리크는 고개를 끄덕였다.\n"근데... 그 안에는… 공산당도 포함되는 겁니까?"\n\n"응, 물론이지."\n\n호시노의 망설임 없는 대답에, 마사리크의 온화했던 표정에 처음으로 난처한 기색이 스쳤다. 그의 미간에 희미한 주름이 잡혔다.\n\n"호시노 양, 저는 당신을 믿지만 공산당은 믿을 수 없어요. 그들은 크렘린의 주인의 지시를 받는 종이나 다름없습니다. 민주주의 체제 안의 잠재적인 위협이에요. 그들은 반드시 배제해야 합니다."\n\n"걱정 마. 민주주의는 무슨 일이 있어도 지킬 거야."\n\n호시노는 차분하게 답한 뒤, 말을 이었다.\n\n"그런데 센세, 그 말… 어디서 많이 들어본 것 같지 않아? '잠재적 위협이니 배제해야 한다'는 말 말이야."\n\n순간, 마사리크의 눈이 조금 커졌다. 호시노는 말을 계속했다.\n\n"센세는 독일계 주민들을 그렇게 부르는 사람들에게 맞서 그들을 끌어안았잖아. 그들 역시 누군가에겐 잠재적 위협이었는데도. 센세가 직접 보여줬는걸. 가능성을 보고 포용해야 한다고."\n\n정적이 흘렀다. 이윽고 마사리크의 입가에서 낮은 웃음소리가 터져 나왔다.\n\n"허허… 이거 제대로 한 방 먹었군요. 내가 가르쳤던 것을, 정작 내가 까맣게 잊고 있었습니다."\n\n그는 부끄럽다는 듯 머리를 긁적이며, 이내 따뜻한 눈으로 호시노를 바라보았다.\n\n"맞아요. 내가 틀렸습니다. 가능성을 믿고 끌어안는 것, 그것이 우리의 시작이었지요. 좋습니다. 호시노 양의 길을, 이 늙은이가 응원하겠습니다."\n"그런데, 한 가지 물어보고 싶은 것이 있어요. 무언가가 호시노 양의 이상을 막아선다면, 호시노 양은 어떻게 할 건가요?""
 ABY_descision_focus_event.43.a:0 "...그렇다면, 타협을 해서라도 이뤄내야죠."
 ABY_descision_focus_event.43.b:0 "...우리는 애초에 이상으로부터 시작했죠."

 ABY_descision_focus_event.44.t:0 "보헤미아의 두 아들"
 ABY_descision_focus_event.44.d:0 "주데텐 독일인당의 전당대회장은 열기로 가득했다. 연단에서 토마시 마사리크와 콘라트 헨라인이 나란히 서서 '두 세계의 국가'의 미래를 위한 우호선언문을 낭독하자, 장내에서는 우레와 같은 박수가 터져 나왔다. 그러나 공식적인 행사가 끝나고, 헨라인의 개인 집무실에서 마주 앉은 두 사람 사이에는 미묘한 냉기가 흘렀다.\n\n헨라인은 의자에 깊숙이 기댄 채, 다리를 꼬고 팔짱을 낀 자세로 마사리크를 맞았다. 예의에는 어긋나지 않았지만, 그의 모든 태도는 '이것은 어디까지나 정치적 연합일 뿐'이라는 무언의 메시지를 보내고 있었다. 하지만 마사리크는 그런 그의 태도에 아랑곳하지 않고, 시종일관 인자한 미소로 찻잔을 들었다.\n\n"전당대회는 성공적이었군요, 헨라인 씨. 주데텐 동포들의 열망이 여기까지 느껴지는 듯했습니다."\n\n"그들은 그저 자신들의 정당한 권리를 되찾고 싶을 뿐입니다, 각하." 헨라인이 딱딱하게 대답했다.\n\n"물론이지요. 집을 잃은 사람이 집을 되찾고 싶어 하는 것은 당연한 마음입니다." 마사리크는 부드럽게 말을 이었다. "나는 때때로 생각해 봅니다. 우리가 서로를 체코인, 독일인이라 부르기 이전에, 우리는 모두 이 보헤미아 땅에 뿌리를 내리고 살아온 이웃이라는 것을요. 숲의 나무들이 참나무, 자작나무로 다르지만 결국 같은 숲을 이루는 것처럼 말입니다."\n\n"숲이라… 하지만 어떤 나무는 다른 나무의 햇빛을 가리기도 하지요." 헨라인의 목소리에는 가시가 돋쳐 있었다.\n\n"그렇지요. 그래서 숲을 돌보는 정원사가 필요한 겁니다. 어느 한 나무가 시들거나, 어느 한 나무가 너무 자라 다른 나무를 해치지 않도록 돌보는 역할 말입니다. 우리는 서로에게 그런 존재가 되어주어야 하지 않겠습니까?"\n\n마사리크의 말에는 어떠한 정치적 계산이나 강요도 담겨 있지 않았다. 그저 한 인간이 다른 인간에게 건네는 순수한 철학이었다. 헨라인은 자신도 모르게 꼬았던 다리를 풀었다. 마음속 단단했던 벽에 작은 균열이 이는 기분이었다.\n\n마사리크는 창밖을 바라보며 말을 이었다. "헨라인 씨, 나는 주데텐인들이 체코 민족이라고는 생각하지 않습니다. 하지만 당신들은 틀림없는 체코의 '국민'입니다. 우리가 쓰는 말이 다르고, 즐기는 문화가 다르다는 것이, 어찌 같은 하늘 아래 사는 인간을 억압할 이유가 되겠습니까. 다름은 틀림이 아니라, 그저 다름일 뿐입니다."\n\n그 순간, 헨라인은 깨달았다. 눈앞의 노인이 뱉는 말들이 정치적 수사가 아닌, 그의 평생을 관통하는 진심이라는 것을. 그는 주데텐인을 표를 위한 도구나, 연합을 위한 장기말로 보는 것이 아니라, 진정으로 이 땅의 동등한 주인으로 존중하고 있었다.\n\n시간이 얼마나 흘렀을까. 두 사람의 대화는 밤이 깊어질 때까지 이어졌다.\n\n마사리크가 자리에서 일어나 돌아갈 채비를 하자, 헨라인은 말없이 그를 따라 일어나 문까지 배웅했다. 문을 열고 마사리크를 보내는 그의 모습은 처음의 오만하고 삐딱한 태도와는 완전히 달라져 있었다. 그는 허리를 깊이 숙여, 한 국가의 원로이자 진심으로 존경하게 된 한 인간에게 동등한 예우를 갖추어 인사했다."
 ABY_descision_focus_event.44.a:0 "안녕히 가십시오, 마사리크 씨."
 ABY_descision_focus_event.44.b:0 ""

 ABY_descision_focus_event.45.t:0 "양세계"
 ABY_descision_focus_event.45.d:0 ""
 ABY_descision_focus_event.45.a:0 "양세계는 함께해야 하지만 하나될 수는 없다."
 ABY_descision_focus_event.45.b:0 "양세계는 하나될 수 있다."

