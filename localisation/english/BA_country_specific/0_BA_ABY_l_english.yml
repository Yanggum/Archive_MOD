 ABY_new_event.63.t:0 "Refuge for Jews"
 ABY_new_event.63.d:0 "Immediately after the Great Transfer, Jews showed various reactions.\n\nSome cheered, while others wailed. The reasons for wailing were diverse, but the reason for cheering was mostly the same: the hope that they could escape the Jewish persecution prevalent across Europe. It was certain that the governments of these otherworldly beings would have no interest in who was Jewish or not. And indeed it was so, but that became the fatal flaw.\nUntil now, the local governments, driven by individual beliefs or to avoid showing weakness externally, had limited anti-Semitic violence through public power, even if only on the surface for various reasons. However, the otherworldly governments had no interest in conflicts between locals. No, they incited them further. No public power could protect them. And the cheers of the tanks turned to despair, to wails. They searched for their refuge and reached one otherworldly government.\n\nThe Abydos Provisional Government, virtually the only government where otherworldly beings and locals allied to treat each other equally. They supported the Jewish company Rothschild as a national representative enterprise and granted unrestricted Jewish immigration, immediate citizenship, and recognized and protected Jewish religious and cultural rights. It was truly a paradise for Jews, where they could be treated as human beings.\n\nAs a result, Jews gathered at the Abydos immigration office today as well.\n\n"Can we really... live safely here?"\n\nThe immigration officers, consisting of otherworldly beings and locals, said with a smile."
 ABY_new_event.63.a:0 ""Of course. You are simply Europeans who believe in Judaism.""
 ABY_new_event.63.b:0 ""Of course. Jews are safe here.""

 ABY_new_event.64.t:0 "Alliance Linking Hope"
 ABY_new_event.64.d:0 "Tomáš Masaryk did not lose hope even after Czechoslovakia collapsed due to Hyakkiyako. He struggled to unite scattered ministers and generals, and as a result, he persuaded military leaders like Vojtěch Luža and Richard Tesařík, as well as politicians including Štefan Osuský, to lay the foundation for a new alliance. They followed the Abydos Provisional Government, which inherited the spirit of the Czechoslovak Provisional Government, and resolved to fulfill their respective roles through cooperation despite having different goals.\n\nIn the meeting room, Masaryk opened his mouth with a heavy voice. “We each have our own goals now, but if the German, Czech, and Abydos factions do not join forces, none of us will succeed. Our experience and ability are essential for strengthening this alliance.”\n\nVojtěch Luža nodded silently and said, “Excellency, we conducted negotiations with the German resistance organizations and achieved meaningful results. Our officer corps has agreed to take command over them in exchange for training them and nurturing junior officers. To liberate Czechia and Austria, we need them, and they need us; we will enable organized action worthy of the name of the Provisional Government Allied Forces.”\n\nŠtefan Osuský added to this, saying, “It is also our responsibility to support the politically immature Abydos Provisional Government and lead cooperation among various forces. We will coexist within this alliance and faithfully perform our respective roles.”\n\nEdvard Beneš smiled faintly as he watched this scene. “Tomáš, look. We still have comrades who wish to devote themselves to Czechoslovakia. With them, we will surely be able to liberate our homeland.”\n\nMasaryk nodded once more with a determined expression. He concluded with a firm voice.\n“Without your devotion and effort, today's cooperation would have been impossible. Though our individual goals may differ, we must move forward together toward the liberation of this land and a new future. I hope everyone does their best in their given positions.”"
 ABY_new_event.64.a:0 "Ať žije Československo! (Long live Czechoslovakia!)"

