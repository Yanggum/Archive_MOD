 ABY_descision_focus_event.31.t:0 "군인과 소녀"
 ABY_descision_focus_event.31.d:0 "비테슬라프와 그의 소대원들이 소총과 기관단총을 들고 경계태세를 갖추고 있었다. 다른 국가들은 침략자들을 보며 이를 갈고 있었지만, 비테슬라프와 부대원들은 예외였다. 오히려 같은 편으로서 싸우고 있었다. 남들은 머리 위에 고리 달린 정신 나간 년들이라며 욕하기 바쁜것에 비하면 정말이지 특이했다. 그리고 이상한 기분은 덤이었고.\n\n"전 소대 집중! 100미터 내 적 부대 접근중!"\n"벌써인가요? 시작해볼까요? 모두 다치지 않도록 조심하세요!"\n\n잔뜩 긴장한 비테슬라프와 소대원들과 달리, 눈앞의 여자는 여유롭게 총기를 들었다. 키보토스라고 불리는 이들의 머리에 달린 헤일로를 보며 모두가 마른 침을 삼키던 사이였다.\n\n"어... 무슨 문제라도 있나요?"\n"아니, 아무것도 아닐세."\n"뭐예요, 그렇게 바라보시고는. 제 얼골에 뭐라도 묻은줄 알았잖아요!"\n"조용히 하고, 네 일에 집중해."\n\n비테슬라프가 소총을 들며 볼트를 당기고, 탄약을 장전했다. 저 멀리서 총성소리가 들려오고있다. 떨리는 손으로 소총을 집은 병사들은, 마른 침을 꿀꺽 삼키며 사격 거리에 적들이 오길 기다렸다. 범위에 헬멧단이 들어온 것을 확인한 비테슬라프가, 부하들과 키보토스 헤일로 보병들에게 소리쳤다."
 ABY_descision_focus_event.31.a:0 ""우리의 조국 체코를 위하여!""

 ABY_descision_focus_event.32.t:0 "빈으로"
 ABY_descision_focus_event.32.d:0 "마지막 키보토스계 소녀가 수류탄을 던지며 산해경 병력들이 후퇴하기 시작했을 무렵이었다. 오스트리아에서 체코로, 체코를 넘어 아비도스로 겨우 도망쳐왔던 군인 프리츠는 자신이 그렇게 싫어했던 키보토스계 소녀들과 함께 싸우다니, 정말 아이러니 할 수 밖에 없었다. 프리츠가 마지막 소총탄을 사격하며 마지막 키보토스계 소녀의 헤일로를 박살내어 마무리 지었을때, 프리츠는 겨우 한숨을 쉬었다.\n\n프리츠가 소총을 내려놓았을 때 즈음 마찬가지로 체코제 헬멧을 쓰던 소녀들을 바라보았다. 일본어로 조잘대는 모습을 볼때마다 프리츠는 짜증이 치밀어 오르는건 어쩔 수 없었지만, 그래도 이번엔 함께 싸웠으니 이번에는 그녀석들에게 빚을 진 셈이었다.\n\n"아아, 모두 주목." 한 장교가 확성기를 들며 입을 열었다.\n\n"곧 빈으로 향해 퍼레이드를 열 것이다. 남은 산해경 병력들이 모두 물러섰으니 우리가 공격받을 일도 없을 것이다. 키보토스계들은 좌측으로, 같은 유럽인들은 우측으로 움직일 수 있도록."\n\n프리츠는 앓는 소리를 내며 몸을 일으켰다. 그리고 자신들의 동료가 기다리고 있을 곳으로 움직였다."
 ABY_descision_focus_event.32.a:0 "뭐, 적어도 옛날보단 낫겠지."

 ABY_descision_focus_event.33.t:0 "희망을 잇는 동맹"
 ABY_descision_focus_event.33.d:0 "토마시 마사리크는 백귀야행에 의해 체코슬로바키아가 붕괴된 뒤에도 희망을 잃지 않았다. 그는 와해된 장관들과 장군들을 규합하려 애썼고, 그 결과 보이테흐 루자, 리하르트 테사르지크 같은 군 지도자들과 슈테판 오수스키를 비롯한 정치인들을 설득해 새로운 연합의 기틀을 마련했다. 그들은 체코슬로바키아 임시정부의 정신을 계승한 아비도스 임시정부를 따르며, 서로 다른 목표를 가지고 있지만 협력 속에서 각자의 역할을 다하기로 결의했다.\n\n회의실에서 마사리크는 무거운 목소리로 입을 열었다. “지금 우리는 각자의 목표를 가지고 있지만, 독일계, 체코계, 아비도스계가 힘을 합치지 않으면 그 누구도 성공할 수 없습니다. 우리의 경험과 능력은 이 연합을 강화하는 데 반드시 필요합니다.”\n\n보이테흐 루자는 조용히 고개를 끄덕이며 말했다. “각하, 저희는 독일계 레지스탕스 조직과의 협상을 진행했고, 유의미한 결과를 이끌어냈습니다. 저희 장교단은 그들을 훈련시키고, 하급 장교를 양성해주는 대신 저희의 지휘를 수용하기로 했습니다. 체코와 오스트리아의 해방을 위해선 저희도 그들이, 그들도 저희가 필요한 바, 임시정부 연합군의 이름에 걸맞는 조직적 행동을 가능케 할 것입니다.”\n\n슈테판 오수스키도 이에 덧붙이며 말했다. “정치적으로 미숙한 아비도스 임시정부를 지원하고, 다양한 세력 간 협력을 이끌어내는 것도 우리의 책무입니다. 우리는 이 연합 속에서 공존하며, 각자의 역할을 충실히 수행할 것입니다.”\n\n에드바르트 베네시는 이 광경을 보며 희미하게 미소를 지었다. “토마시, 보십시오. 우리에게는 여전히 체코슬로바키아를 위해 헌신하고자 하는 동지들이 있습니다. 이들과 함께라면 우리는 반드시 조국을 해방시킬 수 있을 것입니다.”\n\n마사리크는 결연한 표정으로 다시 한 번 고개를 끄덕였다. 그는 굳은 목소리로 마무리했다.\n“여러분의 헌신과 노력이 없다면 오늘의 협력은 불가능했을 것입니다. 비록 각자의 목표는 다를지라도, 우리는 함께 이 땅의 해방과 새로운 미래를 향해 나아가야 합니다. 모두가 주어진 자리에서 최선을 다해주길 바랍니다.”"
 ABY_descision_focus_event.33.a:0 "At zije Ceskoslovensko!(체코슬로바키아 만세!)"

