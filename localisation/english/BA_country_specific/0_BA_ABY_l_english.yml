	ABY_idea_abydos_army_manual_5_tt: "§Y아비도스 군사교범§!\n신임 장군의 초기 기술: §G+2§!\n군 지휘관 비용 §G-90.0%§!\n야전장교 사단 불이익 §G-100.0%§!\n신임 군 지휘관의 시작시 공격 기술 수준: §G+2§!\n신임 군 지휘관의 시작시 방어 기술 수준: §G+2§!\n신임 군 지휘관의 시작시 계획 기술 수준: §G+2§!\n신임 군 지휘관의 시작시 보급 기술 수준: §G+2§!\n최대 지휘력 증가치 §G+50§!\n지형 특성 경험치 획득량 §G+25.0%§!\n\n"
