 ABY_new_event.63.t:0 "유대인들의 피난처"
 ABY_new_event.63.d:0 "대전이 직후, 유대인들은 여러 반응을 보였다.\n\n누군가는 환호했으나, 누군가는 절규했다. 절규의 이유는 제각각이었겠으나, 환호의 이유는 대체로 같았다. 유럽 전역에 만연하던 유대인 박해에서 벗어날 수 있다는 희망, 그것이었다. 이계인들의 정부는 유대인이니 뭐니에 대해 관심 없을 것이 분명했다. 그리고 정말로 그러했으나, 그것이 패착이 되었다.\n지금껏 현지인들의 정부는 개개인의 신념에 의해, 혹은 외부에 약점을 보이지 않기 위해, 여러 이유로 표면상으로나마 반유대주의적 폭력사태를 공권력으로 제한해왔다. 허나 이계인의 정부는 현지인 간의 갈등에 관심이 없었다. 아니, 더욱 조장했다. 그 어떤 공권력도, 그들을 보호해주지 못했다. 그리고 전차 환호는 절망으로, 절규로 바뀌어 갔다. 그들은 그들의 피난처를 찾아다녔고, 어느 한 이계인의 정부에 도달했다.\n\n아비도스 임시정부, 이계인과 현지인이 연합하여 서로를 평등히 대하는 사실상 유일한 정부. 그들은 유대계 기업 로스차일드를 국가 대표 기업으로 지원했으며, 제한 없는 유대인들의 이민, 즉각적 시민권 부여, 유대인의 종교, 문화적 권리를 인정하고 보호했다. 유대인들이 사람 취급을 받을 수 있는, 그야말로 유대인들의 낙원이었다.\n\n그 결과, 오늘도 아비도스 입국심사소에는 유대인들이 집결했다.\n\n"저, 여기서는 정말로... 저희가 안전하게 살 수 있나요?"\n\n이계인과 현지인으로 이루어진 입국심사관들은 미소지으며 말했다."
 ABY_new_event.63.a:0 ""물론입니다. 여러분은 그저 유대교를 믿는 유럽인이니까요.""
 ABY_new_event.63.b:0 ""물론입니다. 유대인은 여기서 안전합니다.""
 
 ABY_new_event.64.t:0 "희망을 잇는 동맹"
 ABY_new_event.64.d:0 "토마시 마사리크는 백귀야행에 의해 체코슬로바키아가 붕괴된 뒤에도 희망을 잃지 않았다. 그는 와해된 장관들과 장군들을 규합하려 애썼고, 그 결과 보이테흐 루자, 리하르트 테사르지크 같은 군 지도자들과 슈테판 오수스키를 비롯한 정치인들을 설득해 새로운 연합의 기틀을 마련했다. 그들은 체코슬로바키아 임시정부의 정신을 계승한 아비도스 임시정부를 따르며, 서로 다른 목표를 가지고 있지만 협력 속에서 각자의 역할을 다하기로 결의했다.\n\n회의실에서 마사리크는 무거운 목소리로 입을 열었다. “지금 우리는 각자의 목표를 가지고 있지만, 독일계, 체코계, 아비도스계가 힘을 합치지 않으면 그 누구도 성공할 수 없습니다. 우리의 경험과 능력은 이 연합을 강화하는 데 반드시 필요합니다.”\n\n보이테흐 루자는 조용히 고개를 끄덕이며 말했다. “각하, 저희는 독일계 레지스탕스 조직과의 협상을 진행했고, 유의미한 결과를 이끌어냈습니다. 저희 장교단은 그들을 훈련시키고, 하급 장교를 양성해주는 대신 저희의 지휘를 수용하기로 했습니다. 체코와 오스트리아의 해방을 위해선 저희도 그들이, 그들도 저희가 필요한 바, 임시정부 연합군의 이름에 걸맞는 조직적 행동을 가능케 할 것입니다.”\n\n슈테판 오수스키도 이에 덧붙이며 말했다. “정치적으로 미숙한 아비도스 임시정부를 지원하고, 다양한 세력 간 협력을 이끌어내는 것도 우리의 책무입니다. 우리는 이 연합 속에서 공존하며, 각자의 역할을 충실히 수행할 것입니다.”\n\n에드바르트 베네시는 이 광경을 보며 희미하게 미소를 지었다. “토마시, 보십시오. 우리에게는 여전히 체코슬로바키아를 위해 헌신하고자 하는 동지들이 있습니다. 이들과 함께라면 우리는 반드시 조국을 해방시킬 수 있을 것입니다.”\n\n마사리크는 결연한 표정으로 다시 한 번 고개를 끄덕였다. 그는 굳은 목소리로 마무리했다.\n“여러분의 헌신과 노력이 없다면 오늘의 협력은 불가능했을 것입니다. 비록 각자의 목표는 다를지라도, 우리는 함께 이 땅의 해방과 새로운 미래를 향해 나아가야 합니다. 모두가 주어진 자리에서 최선을 다해주길 바랍니다.”"
 ABY_new_event.64.a:0 "At zije Ceskoslovensko!(체코슬로바키아 만세!)"
 
