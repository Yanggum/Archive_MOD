 #ABY_descision_focus_abydos_10_effect: "특별 프로젝트: §Y셰마타급 열차포§! 연구 허용\n돌파구 진행도 획득:\n§Y육상전§!: §G300.00%§!\n기술 추가: §Y열차포§!.\n§Y북주데텐란트§! 해당 주의 지역에 §G1§!개의 §Y육상전 연구소§! 추가."
