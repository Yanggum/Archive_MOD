 ABY_new_event.201.t:0 "주데텐란트의 독일인 봉기!"
 ABY_new_event.201.d:0 "아비도스가 여러 보헤미아 지역의 민족 자치를 주장하며 끌어모은 독립 조직이 우리의 보헤미아에도 존재했던 것으로 확인되었습니다!\n\n이들은 지금 아비도스의 전쟁 수행과 협력해 우리를 향한 혁명 봉기를 선언하였으며, 지금 주데텐 실레시아 지역에서는 전투가 벌어지고 있습니다."
