 ABY_descision_focus_event.1.t:0 "The Oath of Bohemia"
 ABY_descision_focus_event.1.d:0 "In early 1936, Karlovy Vary City Hall was packed with people eager to witness a new history. The Czechoslovak Provisional Government, the Sudeten German delegation, and the students of Abydos High School who stood at the center of all this change. Amidst a solemn atmosphere, Edvard Beneš took the podium. His voice was low, but it held a power that resonated clearly in everyone's ears.\n\n"Dear citizens of Czechoslovakia. We have lost our capital, Prague. But we have never lost our spirit. Our goal is clear: the complete liberation of Czechia. I solemnly declare here that we will devote all our efforts until the day our sovereignty is restored to this land."\n\nAt this quiet but resolute declaration, the Czechs in the audience nodded with firm expressions. Instead of loud applause, a determined silence filled the hall. Soon, the respected Tomáš Masaryk stood at the podium.\n\n"As Mr. Beneš said, we must reclaim our home. But we must remember: this land is no longer just for us, but also the home for our neighbors who will live with us. A true nation is completed not just through the recovery of territory, but when it forms a community where different people live in harmony. Let us respect each other's differences and create tomorrow together.""
 ABY_descision_focus_event.1.a:0 "Each ethnicity shouted 'Hurrah!' in their own tongue."

 ABY_descision_focus_event.2.t:0 "Voices of the Sudetenland"
 ABY_descision_focus_event.2.d:0 "Following Masaryk, Konrad Henlein, representing the Sudeten Germans, took the podium. He began his speech in a calm tone, devoid of emotion.\n\n"Respected Sudeten compatriots. For too long, we have lived having lost our voice. Our rightful rights must be guaranteed, and our stolen southern homeland must return to our embrace. This is a demand for our right to survive, and we desire nothing more than this. We only wish to protect our home."\n\nHenlein's refined speech drew deep empathy and solid unity from the German residents. As he stepped down, the mild-mannered Ludwig Czech stood before the microphone. With a gentle smile, he said:\n\n"The heart that wishes to protect its home is the same for all of us. Now, our home has grown wider, thanks to our Czech neighbors and our guests from Abydos. When we talk about our rights, let us show the maturity to think of their rights as well. When we listen to each other's stories, we will finally become true neighbors.""
 ABY_descision_focus_event.2.a:0 "Thunderous applause enveloped the hall."

 ABY_descision_focus_event.3.t:0 "The Promise of Abydos"
 ABY_descision_focus_event.3.d:0 "The final speaker was Takanashi Hoshino of Abydos High School. She stood on the platform with her characteristic languid expression.\n\n"Uhehe~ Well, I don't know much about grand words. We just came here because we needed a place to stay safely with our juniors and friends. I hope this can become such a place. We won't stand for anyone messing with our kids. That's the only principle of our Abydos."\n\nThe sincerity in her unadorned words moved the audience's hearts even more. As Hoshino stepped back, Ayane Okusora concluded the speech in a calm voice.\n\n"Our beginning was to protect our comrades. And now we have realized that all of us gathered here must become comrades who protect each other. Czech sovereignty, Sudeten rights, Abydos' safety. All of these lead to one goal: 'Our Common Prosperity.' Today, we are taking our first step as a community of destiny that will create a new future together, beyond a simple agreement."\n\nWith Ayane's declaration, the three representatives signed the agreement. A deep promise made by those with different origins, ideologies, and even different worlds. The 'State of Two Worlds' thus officially launched, bearing both hope and challenges."
 ABY_descision_focus_event.3.a:0 "The first chapter of a story of harmony amidst hatred."

 ABY_descision_focus_event.4.t:0 "Restored Stability"
 ABY_descision_focus_event.4.d: "Military Operation Report: No. 107 regarding Katakata\n\nThe leadership of the Katakata Helmet Gang, who fled after the fall of the last base in Sector 8, attempted to defect to Hyakkiyako after overpowering the border guards in Egerland. However, they retreated toward the observation post due to attacks from the Hyakkiyako army and were spotted by sentries. Military police were deployed and successfully captured them.\nNote: Military Police Chief Sunaookami Shiroko led the vanguard personally.\n\nFollowing the arrest of the leadership, the majority of Helmet Gang loyalists conducting guerrilla activities in each sector ceased their activities and surrendered.\n\nAs there are many who surrendered or were captured, it was judged that this is not a matter for the military to handle alone, and decision-making power has been transferred to the government.\n\n\nReport: Legal Committee No. 782\n\nUnder current law, they should be regarded as rebels rather than prisoners, in which case most members will likely be imprisoned.\nHowever, under the Emergency Powers Act enacted by Executive Order No. 111, it is possible to regard them as resistance fighters. In this case, they would be considered prisoners of war, allowing for exile or limited military service.\n\nSummary: Depending on the legal interpretation, they can be considered either resistance fighters or rebels, and their treatment will vary accordingly. Therefore, decision-making power is transferred to the executive branch."
 ABY_descision_focus_event.4.a:0 "Regard them as rebels and send them to trial."
 ABY_descision_focus_event.4.b:0 "Every single combatant is vital. Regard them as resistance fighters."

 ABY_descision_focus_event.5.t:0 "Valley of Student Council Presidents"
 ABY_descision_focus_event.5.d:0 "As the search for Kivotos people within the provisional government drew to a close, the militia organized a search party and headed to the Valley of Student Council Presidents. Although it is an area where few people live, the Valley of Student Council Presidents has the largest transfer area within Abydos, and the search was delayed due to its harsh environment and massive scale.\n\nOnly after organizing a search party of nearly 200 people and completing adaptation training were they able to enter the area.\nHowever, no matter how deep they went into the Valley, they heard neither a sign of people nor even the sound of a small animal.\n\n"Is there really anything here?"\n"I know... it's already getting dark..."\n"Eh? There's something over there!"\n"What?"\n\nThe search party approached a giant black silhouette visible in the distance, and they were left speechless by the sight unfolding before their eyes.\n\n"What is... that..."\n"Hey, let me ask you. Do things like that just walk around in Kivotos?"\n"No, I've never seen anything like that either..."\n"It has the emblem of Abydos. And that one is... Gehenna's..?"\n\nThey stood dazed for a moment in front of a black armored train, the size of a skyscraper, armed with naval guns."
 ABY_descision_focus_event.5.a:0 "Photos, do we have a camera?"

 ABY_descision_focus_event.6.t:0 "Legacy of the Thunder Emperor"
 ABY_descision_focus_event.6.d:0 "Information regarding this secret weapon was strictly concealed, and a meeting attended by only a few high-ranking officials was held.\n\n"...Railway Gun Shemata. It's a railway gun named after the legendary student council president who ended the era of chaos in Abydos and led its golden age."\n\n"So, what are its specifications?"\n\n"As secondary armament, it is equipped with one triple 203mm naval gun, two single 152mm naval guns, and six double 127mm naval guns. As for the main battery, a 500mm plasma turret is installed. According to the description, it can fire 1-ton shells up to 500km away."\n"A 500km radius means that all of Germany is within range from our current position."\n\nThe audience became noisy at the ridiculous specifications.\nIn both Earth and Kivotos, research on powerful weapons had continued, but this asymmetric weapon that appeared like a comet (if limited to military power) was at a level that could instantly raise this tiny nation to the status of a hegemonic power.\n\n"But it bothers me that it's called the Legacy of the Thunder Emperor... Just by us possessing this legacy, the academies of Kivotos will try to destroy us, or specifically this railway gun, whenever they get the chance."\n\n"But even so, destroying this weapon is a national loss, and the cost of safely destroying it is astronomical. As Secretary Ayane said, if we are to be threatened just for owning it, and we can't destroy it, wouldn't it be better to use it instead?"\n\nDespite having gained a powerful weapon, the debate continued due to the difference in perspective between the Kivotos people and the locals."
 ABY_descision_focus_event.6.a:0 "Until a certain phone call arrived."

 ABY_descision_focus_event.7.t:0 "Weapon of Doom"
 ABY_descision_focus_event.7.d:0 ""Yes, this is the Cabinet of the Coalition Provisional Governmen..."\n"Secretary Ayane, I think you should be the one to speak."\n"It's Gehenna."\n\nA call from the Intelligence Chief of the Gehenna Prefect Team. Information about the Railway Gun Shemata was surely set as confidential, so how did it leak? Ayane couldn't even guess. The content of the call was simple. To Gehenna, the Railway Gun Shemata was part of the 'Legacy of the Thunder Emperor,' a past history they wanted to erase, and a dangerous weapon of mass destruction. The intelligence department stated that destroying this train was their intent.\n\nAfter the short but heavy call ended, Ayane spoke.\n\n"The existence of... Shemata has leaked. Gehenna already knows."\n\nGehenna found out about Shemata. And they are demanding the dismantling of Shemata in exchange for military support. The entire meeting room was stirred by this fact.\n\n"This is ridiculous! This information was managed as top secret, how..."\n"The Gehenna Intelligence Department must have made a move! ...This is clear interference in domestic affairs!"\n"Even so, at least they didn't demand we destroy the railway gun unconditionally. They offered the condition of military support."\n"We don't even know how helpful that support will be. It might be more beneficial to keep the railway gun...!"\n\nA loud commotion broke out within the Coalition Provisional Government. Ayane did not have the charisma to restrain and control such a commotion. She simply summarized the opinions of the representatives from Kivotos and the locals as a secretary until an agreement was reached. Fortunately, the debate did not escalate into a serious argument. A quick answer is needed. Everyone gathered here agreed on that at least.\n\nConclusion reached. Ayane picked up the receiver again.\n\n"We have reviewed your proposal positively.""
 ABY_descision_focus_event.7.a:0 "...Railway Gun Shemata must be destroyed."
 ABY_descision_focus_event.7.b:0 "...But, after all, we cannot accept interference in our domestic affairs."

 ABY_descision_focus_event.8.t:0 "Request for Support"
 ABY_descision_focus_event.8.d:0 ""
 ABY_descision_focus_event.8.a:0 "Give us help."

 ABY_descision_focus_event.9.t:0 "Proclamation of Federal Government"
 ABY_descision_focus_event.9.d:0 "The establishment of the Federal Government occurred quickly... strangely quickly.\n\nThanks to Masaryk's efforts, Beneš's suspicion toward Abydos rapidly decreased, but after his death, the agitators in Czechia and Austria fanned the small sparks of doubt remaining in Beneš's heart.\n\nEdvard Beneš. One of the three heroes of Czechoslovak independence and a disciple of the father of the nation, Tomáš Masaryk. Because of that, he accepted most of Masaryk's advice as is during the formation of the new government.\n...He would have accepted all of it if not for those agitators.\n\nUltimately, he distributed only minimal authority to the Abydos Foreclosure Task Force and implemented retaliatory policies against Hyakkiyako and Shanhaijing.\n\n"As expected, even he cannot always be perfect."\n"So the resistance from Kivotos people in Hyakkiyako and Shanhaijing is less than expected..."\n(According to the claims of those children from Abydos) "Kivotos people have an immense obsession with firearms... but other than half of Shanhaijing—likely under the name Black Dragon Gate or something—staging an armed rebellion against the weapons confiscation order, there was no organized resistance..."\n\n"We can afford to be a bit more hardline.""
 ABY_descision_focus_event.9.a:0 "His eyes were cold, but within them burned the sparks of revenge."

 ABY_descision_focus_event.10.t:0 "Foreclosure Task Force"
 ABY_descision_focus_event.10.d:0 ""We were tricked! We were tricked!"\n\n"Se- Serika, calm down..."\n\n"Yeah. I'm going to storm in right now..."\n\n"Shiroko-senpai!"\n\n"Uhehe, you shouldn't do that, Shiroko-chan."\n\n"Ah, Hoshino-senpai..."\n\n"That's something this old-timer should do."\n\n"..."\n\n"Well~ I thought we had become somewhat close with Mr. Beneš, so seeing him act like this is disappointing..."\n\n"Ahaha... Ahem, but everyone, think about it."\n"Sensei did ask us to do this, but this wasn't originally our job, was it?"\n"We didn't accept that proposal just to throw our weight around, right?"\n\n"Well, that's..."\n"That's true."\n\n"In a way, this is how things were supposed to be. Sensei told us to help Mr. Beneš, not to do everything ourselves."\n"Strictly speaking, Sensei entrusted the national operation to Mr. Beneš, so it could be said it went as intended."\n"And Mr. Beneš is a smart person, isn't he? I'm sure he'll do well."\n\n"Yeah. But I still feel betrayed... Ayane, don't you feel the same? Sensei recognized not just Beneš but also Ayane as a successor."\n\n"It would be a lie to say I don't feel disappointed. But we've run hard these past few years. Although the Foreclosure Task Force has been disbanded and everyone except Nonomi-senpai graduated due to individual circumstances, it's nice to meet and talk like this, as if we've returned to the old Task Force days."\n\n"Uhehe, right, if Ayane thinks so~ Let's just do our best in our own positions.""
 ABY_descision_focus_event.10.a:0 "Yeah-!"

 ABY_descision_focus_event.11.t:0 "Victim Turned Aggressor"
 ABY_descision_focus_event.11.d:0 "The Edvard Beneš cabinet of the newly formed Abydos Federation issued additional executive orders. \nOne was a forced eviction order in major cities like Prague and Vienna.\nNormally, such an order wouldn't cause much trouble, but the Beneš cabinet committed a blunder by utilizing Czechs for the forced evictions within Czechia and Germans for the forced evictions within Austria.\nThe cabinet might have thought this was far more efficient, but the hatred of the Czechs and Austrians toward the Kivotos people transcended imagination.\nAlthough high-intensity incidents like massacres could not occur (since Kivotos people were far stronger than locals), their hatred condensed and gave rise to administrative discrimination instead.\n\n"What is the meaning of this... Surely the Federal Decree stated that relocation costs would be paid..."\n\n"I told you, there's no money! How can we give what we don't have?"\n\n"Then where are we supposed to go and how are we supposed to live...?"\n\n"Do I look like I care? Just go to those shantytowns built on the outskirts of Prague!"\n\nSimilar incidents were now daily occurrences, and,\n\nCrash! Shatter!\n\n"You bastards! Again?! Oh my! How many times is this! There's no furniture left! Oh my, oh my!"\n\nCases of throwing Molotov cocktails or improvised explosives at Kivotos-affiliated shops or restaurants also occurred frequently.\nHowever, Kivotos people didn't even die from such things, and eventually, only their hatred was piling up bit by bit.\nGroup lynchings occasionally occurred in areas where some locals were more numerous than Kivotos people, and the Kivotos people, who did not die easily no matter how much they were beaten, were good playthings for them.\n\nWhat was once called the State of Two Worlds was now becoming the powder keg of the Danube, with gunpowder piling up, and finally, a spark was lit.\n\nThump! Thump!\nAs usual, a lynching was occurring on the outskirts of Vienna.\n\n"Hey, you brat, you awake? Huh?"\n\n"...Wait, Dietrich. This girl... she isn't moving?"\n\n"...What?"\n\nAbout a dozen Austrian youths who were surrounding and lynching a Shanhaijing student froze all at once.\n\n"Shit... She's not... breathing...?"\n\n"Quick... Get a shovel quick, you bastards!"\n\nThey quickly buried the dead girl, but they were so focused on shoveling that they didn't hear the rustling in the bushes."
 ABY_descision_focus_event.11.a:0 "And the next day, the incident was featured prominently in the newspapers."

 ABY_descision_focus_event.12.t:0 "Calm Before the Storm"
 ABY_descision_focus_event.12.d:0 "Beneš broke into a cold sweat as he received telegrams coming in from all over the country.\nAfter the death of the Shanhaijing student due to the lynching in Vienna, the Kivotos people were no longer just taking it.\nThey raided police stations and military bases, founded the 'South Kivotos United Front,' and organized to oppose the Federal Government. The fortunate part was that retaliatory mass massacres hadn't occurred yet, but any discerning person would know that wouldn't be far off.\n\nAnd Beneš, too, realized this.\n"Ah... ah..."\nWhere did it go wrong?\nHe sought a way to overcome this situation.\nNone came to mind.\nHe was screwed. Truly and properly screwed.\nHe tried to rationalize to himself that it wasn't his fault.\nBut his conscience held him back.\nYes. This is his fault.\nAnd as long as he is the leader, he was certain that this situation could not be stopped.\nBut he cannot hand over the government to them. If that happens, Masaryk's legacy will crumble.\nThose who can overcome this situation while protecting Masaryk's legacy...\nAh."
 ABY_descision_focus_event.12.a:0 "There was only one."

 ABY_descision_focus_event.13.t:0 "Acting for the State"
 ABY_descision_focus_event.13.d:0 ""Full power... I will hand over full power of myself and the government."\n"Please, you can do whatever you want with me, just protect the Federation..."\n\n"Ha, acting like this now, Mr. Beneš?"\n\n"Senpai, now is not the time to fight."\n\n"He's asking us to clean up the mess that shameless man ruined! While he just slips away!"\n\n"I am sorr- no, I offer my apologies. I will take full responsibility for the sin of overestimating my abilities and leading to this result. But please, listen to my proposal."\n\n"Again, what now..."\n\n"Senpai."\n\n"...Fine, let's at least hear it."\n\nSummarizing Beneš's proposal in one line: a political coup. A proposal where he falls along with the opportunists eating away at the nation, and then Abydos—specifically Ayane—impeaches him, becomes President, and implements appeasement policies.\n\n"So basically, you're asking Ayane to play the villain!"\n\n"...Yes, that's right."\nBeneš bit his lip hard.\n\n"Ayane, there's no need to listen to this guy. This is..."\n\n"I'll accept it."\n\n"...Why?"\n"What do we have to do with this country! As long as we protect Abydos..."\n\n"I promised Sensei."\n"He said when the day comes that this country uses the name of Abydos, it's not just Abydos-affiliated Kivotos people who are Abydosians... Czechs, Austrians, Hyakkiyako, Shanhaijing... everyone living inside Abydos is an Abydosian."\n"We are protecting Abydos. We are doing what we've always done.""
 ABY_descision_focus_event.13.a:0 "For Abydos, one must even play the villain."

 ABY_descision_focus_event.14.t:0 "Morning of the Federation"
 ABY_descision_focus_event.14.d:0 ""Ah, ah. Hello. This is Ayane Okusora, the 2nd President of the Federation."\n"I apologize on behalf of the 1st President Edvard Beneš for the inconvenience caused last night by his martial law attempt."\n"You may have heard, but I will announce it once more. Our new Abydos government has impeached the Beneš cabinet, which conspired for civil war and attempted to destroy the democratic order, and has withdrawn the unnecessary and excessive executive orders of the Beneš cabinet."\n"The withdrawal details are as follows: Forced eviction order for Kivotos people, deprivation of voting rights,..."\n\nThis was the first broadcast of the newly launched Ayane cabinet after the event that would later be called 'The Longest Night of the Federation.'\nAlthough some major orders, such as the disarmament executive order, were not withdrawn, and additional taxation clauses for Kivotos people only ended at a relaxed level, for the majority of South Kivotos people—who had previously regarded Abydos as mostly a puppet organization of the Czech Provisional Government—the rise of Abydos to power was seen as a revolution of the Kivotos people, resulting in the collapse of the 'South Kivotos United Front.' \nSome discerning individuals or extremists saw through the fact that Abydos and the Czech Provisional Government were on the same side and resisted fiercely, but their resistance gradually faded under the indifference of the South Kivotos people.\n\nSurprisingly, the fierce resistance from locals that Beneš had feared did not occur. Whether it was belief that Abydos wouldn't oppress them, or simply despair at the return of Kivotos people to power, it was a good thing regardless."
 ABY_descision_focus_event.14.a:0 "The morning sun of the Federation rose brightly."

 ABY_descision_focus_event.15.t:0 "Voluntary Enrollment"
 ABY_descision_focus_event.15.d:0 "Huff... huff...\nAh, shit, I'm screwed.\nI went into a local store to rob it because I hadn't eaten for days, and I happened to run right into the Abydos militia.\n\n"Huff, huff... I'd rather die than enter a ruined academy like Abydos."\n\nWeeks ago, an executive order was issued stating that any Kivotos person active within the territory of the Provisional Government who does not belong to Abydos will be considered a Hyakkiyako spy and arrested/detained. Following the issuance of the executive order, the majority of independent/Hyakkiyako-affiliated citizens within Abydos had their citizenship reissued, and large-scale student organizations that opposed the executive order were all suppressed within two weeks, except for the Katakata Helmet Gang.\n\nThe girl, Nagasawa Yui, simply hated Abydos.\nIt wasn't for a grand reason, she just didn't want to join a ruined school.\nSo the girl hid as an independent... until she was caught today.\n\n"Ah."\n\nAt that moment, her foot caught on something, and the girl fell and rolled on the ground.\nShe tried to get up and run immediately, but eventually, she was caught.\n\n"Hmm, Nagasawa Yui, independent, no record of joining the Helmet Gang."\n\n"Am... am I going to prison?"\n\n"Principle-wise, yes... but I could show some leniency at this level."\n\n"Le- leniency? Thank you, thank you!!"\n\n"On the condition that you write an application for enrollment in Abydos now."\n\n"Eh..?"\n"What... what happens if I refuse..?"\n\n"Then, well... for someone like you, you'd be assigned to the Halo Penal Battalion."\n\n"What..? What??"\n"I'll accept! I'll enroll!!"\n\n"Good, welcome to your voluntary enrollment in Abydos! Ass- no, student!"\n\nIf she knew that Abydos students must receive military training and are assigned to the military, would the girl have made a different decision? It truly is a story as shameful as can be."
 ABY_descision_focus_event.15.a:0 "Sob..."

 ABY_descision_focus_event.16.t:0 "The Defector"
 ABY_descision_focus_event.16.d:0 ""Wh- what is this..."\n\nBefore the man's eyes, a map of hell on earth was unfolding.\nStrange people with halos on their heads who appeared with flashes, and walking animals were indiscriminately shooting at citizens.\nBeautiful Prague turned into a bloodbath in an instant.\n\n"You crazy bastards! What are you doing!"\n\nHe shouted as he pushed away a woman who was aiming a gun at a young child.\nClick.\nA muzzle was pointed at his eyes.\nBang.\n\n"Ugh! Aaaah, aaaaah!"\nThe man woke up screaming from his sleep.\nHow many days had he been having this nightmare?\n\nThe man, Oskar Schindler, was one of the defectors cooperating with Hyakkiyako.\nHe had been imprisoned in 1935 after being caught acting as a spy cooperating with the Nazi regime in Germany. However, as the Great Transfer occurred, the prison lost control, and he too was able to escape. As he escaped, he vowed to take revenge on the Czechs who had humiliated him.\n\nBut he felt skepticism.\nHis sense of revenge, which had been a fleeting emotion, weakened day by day.\nAnd what filled that empty space was a repulsion toward Hyakkiyako.\nToward those who shot people and threw grenades just for fun, Schindler felt a humanitarian repulsion.\nWhen he saw them summarily executing children and women in the square two days ago on the grounds that they were Czech resistance fighters, he received an indescribable shock.\n\nSince then, he began hiding Czechs in his factory.\nIt wasn't out of pity for the Czechs, but out of disgust for Hyakkiyako, out of that repulsion.\n\nHowever, there was a limit to hiding them, and he suffered from the fact that he could not save them all.\n\n"...ndler."\n"Schindler. Are you listening?"\n\n"Ah, Dietrich. My apologies. I was lost in thought for a moment."\n\n"Right, anyway, how is it? My business plan?"\n\nThese people were "defectors" just like him.\nMany German businessmen attached themselves to the Hyakkiyako government and lived luxurious lives while exploiting their compatriots.\nBecause he was also one of them, he felt guilt.\n\n"...So, since the government provides Czech prisoners these days, there are no labor costs and it's great."\n\nJust as he was about to feel disgusted by them, something flashed through his mind.\nAnd for the first time in a long time, he was able to smile."
 ABY_descision_focus_event.16.a:0 ""Yes, that's a truly great idea.""

 ABY_descision_focus_event.17.t:0 "Schindler's List"
 ABY_descision_focus_event.17.d:0 ""Here are the prisoners you requested."\n\nThe Kivotos official winked at Schindler as he handed over the list of Czech prisoners.\nThen, Schindler familiarly took out a gold ornament from his sleeve and held it out to him.\n\n"Hmm, I hope you continue to work hard for the Allied Academy."\n\nAbout a month after Schindler gained his realization, tens of thousands of Czechs were being protected in Schindler's factory complex.\nSince Kivotos equipment cannot be perfectly reproduced with current technology, 'rather more' defective products occurred in his factory compared to other factories, and production was 'somewhat' lacking compared to the number of workers, but thanks to the gold ornaments from his sleeve, there was no big problem.\n\nBecause Schindler requested a 'somewhat' large number of prisoners from the Hyakkiyako government compared to the size of the factory, resistance prisoners who were originally supposed to be executed were also guided to his factory.\n\nSchindler watched the delivered prisoners enter the factory.\nThe ratio of children and women was quite high, but they were 'skilled metalworkers.' The faces of those entering the factory were gloomy on the outside, but their eyes shone brightly as if they had found hope.\n\nWhen Schindler inspected the factory that evening, an old man approached him.\nThe old man handed him a clip badge made of scrap metal, saying it was a gift.\nBecause there were somehow many Czech prisoners who gave gifts to him, a corrupt businessman who exploited prisoners, he accepted the badge without much suspicion.\nBefore leaving work after finishing the factory inspection, he looked over the badge the old man had given him with a smile in his office.\n\n"Hmm, it's quite sophisticated to have been made by an old man alone. It wouldn't be strange to wear this normally."\n\nHe tried wearing the badge the old man gave him on his luxury suit in front of the mirror.\n\nDrop.\n\nAs he wore the badge, a small rolled-up piece of paper fell from it.\nFeeling curious, he unfolded the paper, and a phone number along with the phrase 'Received Schindler's List' was written on it.\n\nSchindler locked the door and called that place.\n\nSoon, the person who answered the phone said in fluent German:\n"Mr. Schindler, good evening. Did you receive the list?"\n\nSchindler replied with his hands trembling.\n"Yes. I received Schindler's List."\n\nThen, the answer came from the other side of the receiver:\n"Nice to meet you, Mr. Schindler.""
 ABY_descision_focus_event.17.a:0 ""Calling from the State of Two Worlds.""

 ABY_descision_focus_event.18.t:0 "Giving Everything"
 ABY_descision_focus_event.18.d:0 "Schindler, who was dissolute but visited his factory every day, exceptionally did not come to the factory that day.\nThe sun was high in the sky, but Schindler just lay in bed quietly thinking about yesterday's proposal.\n\n"Can you help organize and hide the German resistance in Ostrava? If it seems like you'll get caught, you can refuse... huh..."\n\nHonestly, he didn't think he would get caught, but something else made him hesitate.\nThe 'State of Two Worlds' Abydos Provisional Government was an organization opposing Hyakkiyako and Shanhaijing, and an organization supported by the local Czechs and Austrians.\nHowever, Schindler wasn't certain they would win.\nHe didn't think that small organization, even with local support, could defeat the powerful Hyakkiyako and Shanhaijing.\nBut on the other hand, he thought that if he helped the resistance organization, wouldn't the chance of winning increase even a little?\nWhile all sorts of thoughts were crossing, he hit upon one thought.\n\nHe got out of bed and opened his safe.\nThe safe, which had been full of gold ornaments, now only had about a handful left.\n\n"I wanted to enjoy wealth and honor..."\n"...It looks like I'm going to lose everything I've achieved by getting caught up in useless things... haha..."\nHe said that, but why was it that he didn't feel any particular regret?\nDecision made.\nHe was a corrupt businessman, and the reason for his decision was the same.\n"Heh... yeah, anyway, if they don't win, I'm dead, right?"\n"...If I help, they said they would give national rewards, right?"\n"Yeah, I'm not old yet. There are plenty of chances to enjoy wealth and honor! Hahaha!""
 ABY_descision_focus_event.18.a:0 "He called the Provisional Government with a lightened expression."

 ABY_descision_focus_event.19.t:0 "Death of Tomáš Masaryk"
 ABY_descision_focus_event.19.d:0 "Knock knock.\n"Are you still sleeping?"\nThe housekeeper carefully opened the door and went in.\n"Mr. Masaryk, what are you doing sleeping until now. Should you take your medicine..?"\nMasaryk appeared to be sleeping soundly, but he didn't move an inch even at the housekeeper's words.\nThe housekeeper carefully placed a hand under his nose.\n\nThud.\n"Ah, aaaah..."\n\nFather of Bohemia, Philosopher King, 1st President, Sensei...\nTomáš Garrigue Masaryk peacefully passed away in his sleep that night."
 ABY_descision_focus_event.19.a:0 "Masaryk, our father, please believe in your children."

 ABY_descision_focus_event.20.t:0 "Farewell"
 ABY_descision_focus_event.20.d:0 "Abydos High School Foreclosure Task Force room.\n\nA phone call came to Abydos High School from early morning.\n"Yes, this is the Abydos Task Force."\n"..."\n\nClick.\n\n"Ayane?! What's wrong?"\n\n"They say... Sensei... passed away..."\n\n"...What?"\n"Eh..?"\n"Wh- what does that mean?!"\n\nSlide.\n\n"Shi- Shiroko-chan!"\n\nHoshino and Serika ran out after Shiroko, who had rushed out, and Ayane remained, being comforted by Nonomi while crying.\n\n\nProvisional Government Building.\n\nRing ring.\n"Yes, this is Beneš."\n\n"...What?"\n"There's no way... that's impossible... He, Mentor..."\n"...I will go immediately."\n\n\nSudeten German Party Office.\n\n"This is Konrad Henlein."\n\n"Now, what, did you say?"\n"He... has finally passed away..."\n"I will go now.""
 ABY_descision_focus_event.20.a:0 "The obituary was delivered in an instant."

 ABY_descision_focus_event.21.t:0 "Father of Bohemia"
 ABY_descision_focus_event.21.d:0 "Masaryk's funeral, which originally should have been held as a state funeral, was held simply in the square of Karlovy Vary.\nDespite blocking movement to Karlovy Vary in advance before the funeral, a crowd of tens of thousands gathered.\nIronically, the majority of the population gathered at the funeral of Tomáš Masaryk, the Father of Bohemia, were Sudeten Germans. The Czech population was small to begin with, but that didn't matter.\nMasaryk, who should have been called the Father of Czechia, was called the Father of Bohemia. This meant he was the father not only of the Czechs but also of the Germans in Bohemia, and the Germans also respected Masaryk like a father and sincerely mourned him.\n\nIn the square of Karlovy Vary, one of his successors, Ayane Okusora, first finished a short eulogy, and Sudeten German Party leader Konrad Henlein followed. Then his another successor, Edvard Beneš, read the final eulogy.\n\n"...Masaryk remains among us even after leaving, and he was an example and a challenge to all of us. He is an example of a great human faith that Europe and the world desperately need today. What is left to us is the task of making Kivotos and Europe build goodwill and friendship in this unprecedented crisis situation in Europe. Then we will be able to create a completely new nation that is the most perfect and harmonious, socially, nationally, and politically just in Europe since 1936. This is a nation we must create for our survival and future, and it will become an existence for all nations of Europe and Kivotos to protect his legacy, just as Masaryk showed among us and just as Masaryk showed to the whole world..."\n"...Liberator President, we will follow your path to liberate our home once again and be faithful to the legacy you handed down to us!"\n\nAs Beneš finished the eulogy, the oldest Czech and European hymn, the Saint Wenceslas Chorale, resonated.\n\nAfterward, a carriage carrying his body left the square and climbed up the hill. At this time, 7 soldiers escorted the coffin, which symbolized the 7 ethnicities forming (or planned to form) the Federation.\n\nThe carriage stopped at the Provisional Government Building and was laid to rest in the backyard.\nOriginally he should have been laid to rest in Lány where his family was buried, but it is said that Masaryk left the words '...Do not spend much effort for my dead body... ...Bury me in a place where anyone can visit and do not move me...' during his lifetime.\n\nAnd those who survived will move forward to protect his legacy, to liberate their home, and for the trust and friendship of Kivotos and Europe."
 ABY_descision_focus_event.21.a:0 "We will be faithful.\nTruth prevails."

 ABY_descision_focus_event.22.t:0 "Sudetenland, Our Sudetenland"
 ABY_descision_focus_event.22.d:0 "Ludwig Czech, the German minister who represented the Sudeten Germans.\nHe cheated death several times after being hit by stray bullets while escaping.\nAlthough Abydos was said to have fallen, a small hospital existed within the transferred autonomous district, and Czech was able to survive after emergency surgery.\nHowever, the complications resulting from the late treatment greatly harmed his health, and in March 1937, he passed away.\n\nAnd after his death, the one who newly became the spokesperson for the Sudeten Germans and a member of the Triumvirate was the leader of the Sudeten German Party, Konrad Henlein.\n\n"How did it come to this..."\n\nHenlein was the founder of Sudeten nationalism, sometimes called Henleinism, and the Sudetenland he led was gradually approaching the final goal of autonomy within Czechoslovakia...\nBut the Great Transfer instantly elevated him to the leader of the nation (the Germans), and with the Federation's propaganda, even the Germans in Austria came to regard him as the savior of the Austrian-affiliated Germans.\n\n"Ye- yeah, Austria is better than those Prussian hicks being agitated by that mustache guy..."\n"Shit... Ha... I'm just an ordinary Sudetenlander! Why are you expecting so much from me!"\n"Mr. Masaryk, what would you do at a time like this..."\n\nWhenever Beneš, Masaryk's disciple and successor, refused dialogue and compromise with him, he naturally guessed that Masaryk, Beneš's mentor, would be similar.\nBut the Masaryk he met in person was completely different.\nEven if he saw the Sudeten Germans as outsiders, he saw them as subjects for inclusion and dialogue, not as invaders like Beneš did.\n\n"So when I asked why he left Beneš alone, he said that's democracy? Hah..."\n"It's truly a shame he was a democrat. If not for that, I would have immediately taken him as a mentor. Haha..."\n"Democracy is truly inefficient. A rotten cancer like Beneš who ignores even his mentor's words should be cut out immediately."\n\nHe said, frowning at the name written on the report that came up.\n\n"...And a cancer like this guy too.""
 ABY_descision_focus_event.22.a:0 "Karl Hermann Frank."

 ABY_descision_focus_event.23.t:0 "Sudeten Henlein Party"
 ABY_descision_focus_event.23.d:0 "Henlein's plan, which was simply to gain autonomy as a leader of the Sudeten Germans in the nascent Czechoslovak Republic, began to go awry from 1935.\nOf course, he criticized democracy and didn't actually like the system of democracy that much, but he thought it was much better than the 'Greater Germanism' preached by that 'Bohemian Corporal' nobody.\nThis was also why the Sudetenland was relatively quiet compared to how the National Socialist movement threatened the regime in Austria after the Nazi Party came to power.\n\n"If only that damn Frank and toothbrush mustache hadn't interfered..."\n\nAgainst Nazi Germany, Henlein praised democracy, which he didn't like much, criticized the Nazis, and made the core members within the party loyal to Henlein personally rather than to Germany.\nAnd shortly before the Great Transfer occurred, his faithful party member, Karl Hermann Frank, called him to a small city near Prague.\n\n"Frank, it's the first time you've called me separately. You have something to report?"\n\n"Ah, hello. Chairman."\n"It's nothing else, but there seem to be traces of corruption."\n\n"Corruption! Of course it must be rooted out! Well done, Frank."\n\n"Haha, thank you. So... shall I explain this corruption case to you?"\n\nBut contrary to expectations, as his words continued, Henlein turned pale.\n\n"...So, I don't know where the large sum of nearly 15,000 Reichsmarks that flowed in from the German consulate disappeared to. Surely a chairman who hates National Socialism so much wouldn't have used that money?"\n\nOf course he did take money from Germany. He used it for anti-Nazi activities by stabbing them in the back grandly, but...\nHe didn't think Frank was their plant. So he told him about the use of the funds...\n\n"Don't play petty hypocrite. What do you want to say, Frank."\n\nFrank pulled out a pistol instead of answering.\n\n"What is this..."\n\n"Ah, Chairman. If you're German, shouldn't you naturally enjoy prosperity together in the embrace of a unified Greater Germany?"\n\n"Cut the crap..."\n\nClick.\n"From now on, every time you say a word, my finger will move a little."\n"So from now on, only answer my words with yes or no, Henlein, got it?"\n\n"...Yes."\n\nHe instructed him to move the Sudeten German Party to create public opinion in favor of annexation with Nazi Germany.\nWith a muzzle pointed at his eyes, Henlein had no choice but to say yes.\n\nBut now, the situation has changed.\n\n"Neumann, Schwennhardt... huh, everyone was so flattering in front of me, and you were preparing such a cute party."\n\nSince that day, Henlein moved his subordinates to identify those in the party who sympathized with the Nazis, and now he was able to wipe them out all at once."
 ABY_descision_focus_event.23.a:0 ""I must move quickly, before that guy notices.""

 ABY_descision_focus_event.24.t:0 "Battle of Inner Thoughts"
 ABY_descision_focus_event.24.d:0 "In the dead of night when everyone was asleep, a faint lamp was still lit in Masaryk's room.\nEdvard Beneš, Richard Tesařík... Masaryk looked at the names written in his notebook and wrote advice for them.\n"Hah, is it already the last page? Today will end quickly then."\nOn the last page of the notebook, unfamiliar names were written.\n\nAyane Okusora: Lack of confidence. Age complex? Sharp and flexible.\nNonomi Izayoi: Awkward with the board of directors but seems to be getting along better than before. Quick absorption of economic matters. Did she receive early education?\nSerika Kuromi: Easily fooled but never does work halfway. Correct documents are flawless and perfect. Let's help her develop the ability to catch wrong documents.\nShiroko Sunaookami: Physical ability, command ability, leadership are all excellent. But how should I put it... wildness? That feeling is strong. Still improving.\nHoshino Takanashi: Excellent at hiding emotions with a friendly smile... Wary of me. Why is that?\n\nMasaryk fell into thought as he looked at the last name.\n\n...\n\nHoshino hadn't been able to sleep at night recently. Even the act of pretending to take a nap to look carefree had often turned into actually falling asleep recently.\nShe didn't understand. Why Masaryk, and why her cute juniors followed that <Adult>.\n\nHoshino was confident in seeing through people's inner thoughts, but she just couldn't understand that old man's heart.\nEvery favor comes with a price.\nHoshino experienced this bitterly.\nBut she couldn't know what kind of 'price' that adult, whom the juniors call Sensei, would demand.\n\n"900 million yen..."\n900 million yen. A lot for Abydos but a sum so small it could be ignored even on the ledgers of other academies.\nVarious adults held and used that small sum like a leash.\nMasaryk cut such an important leash without hesitation."
 ABY_descision_focus_event.24.a:0 "Hoshino simply wasn't confident in handling this price."

 ABY_descision_focus_event.25.t:0 "Corporation and Government"
 ABY_descision_focus_event.25.d:0 ""...With this, the agreement has been signed."\n"The contents are as follows."\n"First, the control of the Nephthys Group's private land is transferred to the Provisional Government."\n"Second, the Federal Government will transfer a certain percentage of the industrial facilities in Czechia and Austria to Nephthys...""\n\n"It went well! Mr. Masaryk!"\n\n"Yes. As a spokesperson for the Provisional Government, I express my gratitude, Ms. Nonomi."\n\nThe two shook hands, and officially the private land of the Nephthys Group was incorporated into the Provisional Government.\nAnd the two protagonists of the negotiation were returning to the Provisional Government together by car.\n\n"It was so~ hard? Sensei!"\n\n"Hoho, but aren't you now strictly the head of a corporation, Ms. Nonomi. Although the board of directors leads the operation, you'll have to attend major events often now, so you shouldn't be like this already."\n\n"Ugh... even doing it after setting the results in advance is this hard, I don't know how hard actual negotiations would be..."\n\n"If I may tell Ms. Nonomi one piece of good news, surprisingly, in many negotiations, the working-level staff do it in advance and the results are set like this. This is a result from my political experience, so it might be a bit different in economics, but economics and politics are similar so it'll be worth noting."\n\n"Still, I'm worried... if an unexpected situation occurs..."\n\n"Hmm, then to ease Ms. Nonomi's anxiety, shall we try a special tutoring session today? Since we have time left, how about learning how to handle various situations?"\n\n"Mmm... I want to rest, but a chance like this doesn't come often~ Yes!"\n\n"Hoho, I won't make it long. Then, what kind of work do you want to learn about primarily?""
 ABY_descision_focus_event.25.a:0 ""Mmm~ I'd like to learn general politics rather than management~!""
 ABY_descision_focus_event.25.b:0 ""Mmm~ I want to learn political tips related to management~!""

 ABY_descision_focus_event.26.t:0 "Separated Integration"
 ABY_descision_focus_event.26.d:0 ""We'll need a bit more police force within the autonomous district~"\n\n"Yes, Chief."\nHoshino called back the secretary who was turning to leave.\n\n"Ah, the conditions are the same as before. Don't pull from the military, recruit from civilians, and match the population ratio, you know~?"\n\n"Yes, I know."\n\n"Uhehe, you're too stiff~ Then this old-timer will be sad?"\n\n"It's work, Chief."\nYet the secretary said with a faint smile:\n"Still, you're working hard. Always grateful."\n\n"Uhehe, right!"\n\nAs the secretary left the room, the Abydos Autonomous District Chief, Takanashi Hoshino, continued her paperwork.\n\nAfter Masaryk, Sensei, visited, Hoshino did various things from administration to physical labor and then distinguished herself in the reorganization of the Abydos Autonomous District, becoming the Abydos Autonomous District Chief.\n\nShe incorporated the industrial district into the regional government and integrated the city of Karlovy Vary, which the autonomous district had transferred to, under the Abydos Autonomous District.\nIt was a compromise and a good result achieved between the Kivotos people who avoid industrial districts and the locals who prefer industrial districts.\n\nFederal Executive Order No. 111 is still valid, but Hoshino had a thought.\n'If we don't create a precedent for integration now, this Federation won't last long.'\n\nWith such a thought, she worked hard to make the Abydos Autonomous District a symbol of integration. The autonomous district was the only place where police, not military police, operated, and the police went in pairs of one Kivotos person and one local.\nThese efforts bore fruit in the coexistence of the two worlds, but fundamentally, the task of integrating the two different worlds was stagnant.\n\nIn this situation, Hoshino fell into thought while looking at an administrative lawsuit document regarding the demand for marriage allowance between Kivotos people and locals."
 ABY_descision_focus_event.26.a:0 ""Since it's come to this, let's go all out.""
 ABY_descision_focus_event.26.b:0 ""If we allow this, the government might get paralyzed.""

 ABY_descision_focus_event.27.t:0 "Restored Control"
 ABY_descision_focus_event.27.d:0 ""How's the situation?"\n\n"Egerland sectors A, B, and D have been finished, and a guerrilla group of 132 people is fortifying a wooden fortress in sector C and holding out. If we just supplement a bit more mortar firepower, it will fall soon."\n\n"Hmm... it'll probably be hard. The wooden fortresses of the Helmet Gang can't be breached with things like small arms or mortars."\n\n"Eh? How could such a..."\n\n"Yeah. Because I've fought them several times. And I've seen it on-site too. That fortress is sturdier than it looks."\n"So you'll have to deploy attack drones intensively."\n\n"Yes! Understood, Commander!"\n\nA messenger opened the tent door and entered.\n"Advice has arrived from headquarters."\n\n'Military discipline maintenance order. Confirmed that former President Tomáš Garrigue Masaryk is secretly heading toward the Egerland Military Police Headquarters.'\n\nShiroko's aide, after checking the content, turned on the microphone and made an announcement.\n"All personnel in the headquarters, please dress your uniforms neatly and assemble at the parade ground. Father is coming. Father is coming. That is all."\n\n...\n\n"Yeah, I'm glad Sensei came. But..."\nShiroko said, looking at the parade ground.\n"...Even so, couldn't you say at least something? If you gather those people and just tell them to dismiss..."\n\n"Hoho, Ms. Shiroko is making work for idle me."\n\n"Ah... no! It's not like that..."\n\n"I'm not saying I don't want to. It's good to try giving a speech after a long time."\n"Since I haven't prepared anything separately, I can't make it long, but that would be better for those soldiers."\n\nMasaryk hesitated and said:\n"By the way, how about Ms. Shiroko trying to give the speech?"\n\nShiroko fell into thought."
 ABY_descision_focus_event.27.a:0 ""No, I think it would be better for Sensei to do it.""
 ABY_descision_focus_event.27.b:0 ""Yeah, then I'll give it a try.""

 ABY_descision_focus_event.28.t:0 "Practical Learning"
 ABY_descision_focus_event.28.d:0 ""Creating a new name will cost a lot and neither side will agree. Let's decide firmly on Ústí nad Labem or Aussig."\n"No, I told you it's the same thing anyway! Whether it's Aussig or Ústí, they'll call it whatever they want anyway!"\n"In the first place, Ústí comes from old Czech, and the German reading of it is Aussig, so we should use the original Ústí!"\n"Since we yielded on Elbe or Labe, we should keep at least Ústí! You bandits!"\n"Does it make sense to put a Czech name on a city where we Sudeten Germans live? Does it make sense or not, you!"\n\nAs the meeting showed signs of overheating, Ayane shouted for silence and declared a 15-minute recess.\n\nMasaryk met Ayane as she stepped down from the platform.\n\n"Hard work, Ms. Ayane."\n\n"Do you think I did well this time, Sensei?"\n\n"Hmm, it certainly shows that you're improving more and more. But..."\n\nAfter Masaryk pointed out the problems, the meeting opened again, and only after repeating recesses and openings several times did the 10-hour meeting end.\nOnly in the evening were they able to go home, and Masaryk and Ayane shared a story while eating kulajda at a nearby old restaurant.\n\n"...By the way, I have something I'm curious about."\n\n"What is it, Ms. Ayane?"\n\n"I understood why you chose me among many Kivotos people since you told me last time, but I'm curious why you're raising me as a disciple when you have a smart disciple like Mr. Beneš."\n\n"Hmm, there's no other politician as smart and good as Beneš. But at the same time, he lacks flexibility and has a somewhat radical tendency, so there's an aspect where he doesn't fit a multi-ethnic federation."\n"Ultimately, he needed a political partner who could supplement this. Someone who can embrace everyone and become a brake for Beneš. At the same time, someone with great political potential. I chose Ms. Ayane as that person."\n\n"Ah..."\n\n"Someday... if I return to where I came from, please help Beneš so he doesn't make a wrong choice.""
 ABY_descision_focus_event.28.a:0 ""...Yes. I will protect Sensei's legacy.""
 ABY_descision_focus_event.28.b:0 ""...It's okay. The citizens will lead the way themselves.""

 ABY_descision_focus_event.29.t:0 "Deep Foresight"
 ABY_descision_focus_event.29.d:0 "“Phew... Paperwork is hard after all...”\n\nSerika, taking her eyes off the documents for a moment, stretched out.\nNow that quite some time has passed since the Great Transfer occurred, Serika was tasked with the establishment of the 'Committee for 8 Southern States.' With help from Sensei and Ayane, she now has some knack for paperwork, but there was still a lot of work and she wasn't used to it.\n\n“As I thought, I might not be suited for paperwork...”\n“No, Ms. Serika. Ms. Serika is doing her best.”\n“Eh, Sensei!?”\n\nMasaryk was standing at the door before she knew it.\n\n“Ms. Serika is capable enough just by having done well without big problems until now despite having the heavy responsibility of Vice Minister of Interior.”\n\n“But the things I can notice myself are just tiny omissions or obviously exaggerated content...”\n\n“Hoho, originally small developments gather one by one to make even more growth.”\n\nDespite Masaryk's comfort, Serika had an expression that her worries hadn't been resolved.\n\n“Hmm, you have an expression like you have some worry. Can you tell me?”\n\nAfter hearing Masaryk's words, Serika hesitated for a moment and then abruptly asked this:\n\n“If I had to make an important choice in a situation where I can't ask Sensei, what should I do?”\n\nMasaryk was a bit surprised, but for now he listened intently to Serika's words.\n\n“Lately, I've been thinking that it wouldn't be strange no matter what situation occurred. Also the thought that in the worst case, a situation might come where I have to take responsibility for everyone. Thanks to Sensei's help, I'm not tricked unconditionally anymore, but if such a situation hits right now, and if there's no one to advise in that situation, I'll end up making a wrong choice. So Sensei, in preparation for the 'what if'... tell me what I should do.”\n\nSince Masaryk already had his death in mind, he had many thoughts about it, but what Serika worried about seemed to be a far more serious situation than that.\nMasaryk fell into thought for a moment, and eventually gave her this advice.\n\n“I want you to think deeply enough about what kind of result the choice Ms. Serika made will bring. Especially...”\n\n“If such a situation comes, also keep in mind that your own safety is most important.”"
 ABY_descision_focus_event.29.a:0 "“I want you to remember that the work of the government is not done alone.”"
 ABY_descision_focus_event.29.b:0 "“Still, also remember that you shouldn't push off what you have to do.”"

 ABY_descision_focus_event.30.t:0 "Territorial Reclamation"
 ABY_descision_focus_event.30.d:0 "After the threat of Shanhaijing and Hyakkiyako completely vanished from Czechia and Austria, a new chapter of history opened. In the Vladislav Hall of Prague Castle, the three leaders who led the Provisional Government—Edvard Beneš, Konrad Henlein, and Ayane Okusora—stood side by side before domestic and foreign reporters and proclaimed the official launch of the 'Abydos Federal Government.' This was a historic declaration announcing that the precarious alliance that had united for survival was now moving toward a permanent national community.\n\nThe first thing announced was the official lifting of the 'Emergency General Mobilization Order,' which signified the end of the war situation. To this measure, which meant that numerous soldiers who had been tied to the front for years could finally return to their homes and families, the entire Federation was swept with relief and joy. It was a symbolic announcement containing the Federal Government's strong will to clear away the shadows of war and move toward an era of peace.\n\nSubsequently, the Federal Government promised to hold the first general election in which all members of the Federation participate in the near future. Through this, they presented a blueprint to form an official cabinet that fairly reflects the will of all ethnicities and classes, end the provisional leadership system, and lay the foundation as a complete democratic nation.\n\nFurthermore, they made clear their will to concentrate national capabilities on reconstruction rather than war. While announcing a disarmament plan to gradually reduce the size of the military, which had grown bloated to fit the war system, to fit the peacetime situation, they declared that the budget and resources secured through this would be primarily invested in large-scale reconstruction projects to restore cities and industrial infrastructure destroyed by the war. The 'State of Two Worlds' has now put down its swords and spears and begun preparations to pick up hammers and plows."
 ABY_descision_focus_event.30.a:0 "The land has been reclaimed"

 ABY_descision_focus_event.31.t:0 "Soldier and Girl"
 ABY_descision_focus_event.31.d:0 "Vítězslav and his squad members were in a state of alert with rifles and submachine guns. While other nations were grinding their teeth looking at the invaders, Vítězslav and his unit members were an exception. Rather, they were fighting on the same side. Compared to how others were busy swearing that they were crazy girls with halos over their heads, it was truly unique. And a strange feeling was a bonus.\n\n"All squads concentrate! Enemy units approaching within 100 meters!"\n"Is it already time? Shall we start? Everyone, please be careful not to get hurt!"\n\nUnlike Vítězslav and the squad members who were very tense, the woman in front of them held her gun leisurely. It was during the time when everyone was swallowing dry spit while looking at the halos attached to the heads of those called Kivotos.\n\n"Uh... is there some problem?"\n"No, it's nothing."\n"What is it, looking at me like that. I thought I had something on my face!"\n"Quiet, and concentrate on your job."\n\nVítězslav pulled the bolt and loaded ammunition while holding his rifle. Gunshots are heard from afar. The soldiers who picked up their rifles with trembling hands swallowed dry spit and waited for the enemies to come within firing range. Vítězslav, confirmed that the Helmet Gang had entered the range, shouted to his subordinates and the Kivotos halo infantry."
 ABY_descision_focus_event.31.a:0 ""For our homeland, Czechia!""

 ABY_descision_focus_event.32.t:0 "To Vienna"
 ABY_descision_focus_event.32.d:0 "It was around the time the last Kivotos-affiliated girl threw a grenade and the Shanhaijing forces began to retreat. Fritz, a soldier who had barely escaped from Austria to Czechia and beyond Czechia to Abydos, couldn't help but find it truly ironic that he was fighting together with the Kivotos-affiliated girls he had hated so much. When Fritz finished by smashing the halo of the last Kivotos-affiliated girl while firing his last rifle bullet, Fritz finally let out a sigh.\n\nWhen Fritz put down his rifle, he looked at the girls who were similarly wearing Czech-made helmets. Every time he heard them chattering in Japanese, Fritz couldn't help but feel annoyance surge up, but since they fought together this time, he owed them one this time.\n\n"Ah, everyone attention." An officer opened his mouth while holding a megaphone.\n\n"We will soon head to Vienna and hold a parade. Since all the remaining Shanhaijing forces have retreated, we won't be attacked. Kivotos-affiliated move to the left, and fellow Europeans move to the right.""
 ABY_descision_focus_event.32.a:0 "Well, at least it'll be better than the old days."

 ABY_descision_focus_event.33.t:0 "Alliance Linking Hope"
 ABY_descision_focus_event.33.d:0 "Tomáš Masaryk did not lose hope even after Czechoslovakia collapsed by Hyakkiyako. He struggled to unite scattered ministers and generals, and as a result, he persuaded military leaders like Vojtěch Luža and Richard Tesařík, as well as politicians including Štefan Osuský, to lay the foundation for a new alliance. They followed the Abydos Provisional Government, which inherited the spirit of the Czechoslovak Provisional Government, and resolved to fulfill their respective roles through cooperation despite having different goals.\n\nIn the meeting room, Masaryk opened his mouth with a heavy voice. “We each have our own goals now, but if the German, Czech, and Abydos factions do not join forces, none of us will succeed. Our experience and ability are essential for strengthening this alliance.”\n\nVojtěch Luža nodded silently and said, “Excellency, we conducted negotiations with German resistance organizations and achieved meaningful results. Our officer corps has agreed to take command over them in exchange for training them and nurturing junior officers. To liberate Czechia, we need them, and they need us; we will enable organized action worthy of the name of the Provisional Government Allied Forces.”\n\nŠtefan Osuský added to this, saying, “It is also our responsibility to support the politically immature Abydos Provisional Government and lead cooperation among various forces. We will coexist within this alliance and faithfully perform our respective roles.”\n\nEdvard Beneš smiled faintly as he watched this scene. “Tomáš, look. We still have comrades who wish to devote themselves to Czechoslovakia. With them, we will surely be able to liberate our homeland.”\n\nMasaryk nodded once more with a determined expression. He concluded with a firm voice.\n“Without your devotion and effort, today's cooperation would have been impossible. Though our individual goals may differ, we must move forward together toward the liberation of this land and a new future. I hope everyone does their best in their given positions.”"
 ABY_descision_focus_event.33.a:0 "Ať žije Československo! (Long live Czechoslovakia!)"

 ABY_descision_focus_event.34.t:0 "Under the Flag of Czechia"
 ABY_descision_focus_event.34.d:0 "In a quiet restaurant in Prague, within a firmly closed private room, voices discussing the future of Czechia were echoing low. At its center sat Edvard Beneš. Before him sat veteran soldiers who had participated in the independence movement together in the past, nationalist-leaning scholars, and representatives of youth organizations full of passion. They were those who worried that the spirit of Czechia would be diluted behind the slogan of 'harmony' of the Federation.\n\n"Everyone," Beneš opened his mouth quietly. "Our goal is only one: to rebuild a strong and sovereign Czechia. Abydos' help is appreciated, but they are outsiders. The Sudetenlanders are always subjects for wariness. The true master of this country must be our Czech ethnicity."\n\nHe did not give a speech. He just quietly, but firmly, spoke of his conviction.\n\n"I need your strength. Within the framework of the Federation, we must make the voice of Czechia resonate most loudly. We must reclaim our influence in all fields: education, culture, and administration."\n\nAt his words, the scattered nationalist forces found a single focal point. That night, they made an invisible alliance under the single flag of 'Czech Revival.'"
 ABY_descision_focus_event.34.a:0 "Beneš succeeded in securing his most powerful support base."

 ABY_descision_focus_event.35.t:0 "Invisible Barrier"
 ABY_descision_focus_event.35.d:0 "Beneš's maneuvering was like a war without gunshots. He moved subtly and persistently to weaken Abydos' influence. In meetings deciding major policies of the Federation, innovative economic reconstruction plans submitted by Ayane were deferred time and again on the grounds of 'lack of realism.' Behind this was the organized opposition of Czech working-level bureaucrats appointed by Beneš.\n\n"Ms. Ayane's proposal is ideal, but there might be difficulties in realistic execution. How about supplementing it by adding a working-level committee composed of Czech experts?"\n\nHis proposal sounded reasonable, but the result led to the reduction of the authority of those from Abydos. The work of Serika, who was showing competence in the Ministry of Interior, was delayed on the grounds of minor procedural issues, and large-scale investment projects proposed by Nonomi's Nephthys Group hit an invisible barrier called tricky administrative regulations. In the media, articles quoting anonymous government officials and pointing out the 'inefficiency of Kivotos-style policies' began to trickle out little by little. Beneš never attacked Abydos head-on. He just set a spiderweb of complex administrative procedures and committees,"
 ABY_descision_focus_event.35.a:0 "Slowly binding their hands and feet."

 ABY_descision_focus_event.36.t:0 "Handshake with the Devil"
 ABY_descision_focus_event.36.d:0 "Beneš, who was growing his faction, also had a concern. It was Austria. In the newly incorporated Austrian region, his nationalist line did not receive much support. To secure a stable majority of seats, he had to partially bend his conviction. Ultimately, he made a choice that no one expected. He reached out to the remnants of the 'Fatherland Front,' which was the authoritarian party of old Austria.\n\nA secret meeting held in an old hotel in Vienna. The representative of the Fatherland Front met Beneš with a cynical smile. "What business does the democrat Excellency Beneš have with relics of the old era like us?"\n\nBeneš replied without a trace of change in expression. "I do not support your ideology. But you have the power to control Austria. If you support me in the upcoming election, I promise autonomy within Austria and non-interference regarding past activities."\n\nIt was an act of denying himself as a democrat. A handshake with the devil that Masaryk would have never tolerated had he been alive. But Beneš did not hesitate. For the greater goal of building a strong state centered on Czechia, he believed that even joining hands with anti-democratic forces was just a 'necessary evil'..."
 ABY_descision_focus_event.36.a:0 "He rationalized to himself."

 ABY_descision_focus_event.37.t:0 "Stained First Step"
 ABY_descision_focus_event.37.d:0 "The first general election promised along with the launch of the Abydos Federal Government was held amidst confusion rather than hope. The election, prepared in a hurry while the scars of war had not yet faded, creaked from the start. A unified voter registry did not exist, and the counting of voters in each region was done haphazardly. Legal debates over the citizenship of Kivotos people and the qualification of voters in the Austrian region continued until right before election day, adding to the confusion.\n\nOn the day of the election, the problem erupted even more seriously. In some rural areas of Czechia and Austria, ballot boxes disappeared entirely, or unidentified armed forces stormed into polling stations and threatened to support a specific party. In the Sudetenland, numerous circumstances suspected of organized voting interference targeted at German voters were captured. The counting process was also not transparent. In specific electoral districts, common-sense-defying results where the voter turnout exceeded 100% were announced, and it was commonplace for opposition observers to be kicked out of counting stations.\n\nAs the election ended, the opposition and civil society immediately raised suspicions of a 'rigged election' and announced large-scale protests. However, the Federal Government moved quickly. The Ministry of Interior led by Beneš tightened media control in the name of 'national stability' and defined voices raising suspicions of a rigged election as 'anti-establishment agitation causing social chaos.' Several influential media outlets poured out reports that the election was held fairly amidst collusion with the government, and core figures who raised suspicions had their political lives ended after receiving mysterious tax investigations or having past actions exposed.\n\nUltimately, the massive suspicion slowly sank below the surface under the leadership of the government without a clear investigation of the truth. The final winner of this murky election was Edvard Beneš. He gathered his nationalist forces and right-wing forces like the Fatherland Front to barely secure a majority, rising to the first Prime Minister of the Abydos Federation. However, his cabinet held the inherent limitation of a 'stained victory.' Legitimacy was damaged, and"
 ABY_descision_focus_event.37.a:0 "The Federation's democracy was unstably launched with the seeds of distrust and division from the first step."

 ABY_descision_focus_event.38.t:0 "The Professor"
 ABY_descision_focus_event.38.d:0 "Click. Clack.\n\nThe situation has changed.\nThe pistol he had pointed some time ago was now pointed at him.\n\nActually, he also didn't think the uprising would succeed.\nTherefore, he had even planned an escape route to Germany...\nHenlein, that defector's information power was stronger than expected.\n\n"Anything to say, Frank?"\n\n"...I'll only ask one thing."\n"Why don't you, as a German, think of becoming one within the embrace of Greater Germany?"\n\n"Well, wouldn't that be because I'm moved by great democratic ideals."\nHenlein replied sneeringly.\n\n"Cut the crap."\n\n"Kick, did I get caught?"\n\n"If you're going to tease me, just kill me. I'm not alive to hear such words."\n\n"Right, I'll tell you properly."\n"We Sudetenlanders have acted like aristocrats in this Bohemia for generations. Even after the founding of Czechoslovakia, we were able to raise a loud voice and rise to the privileged class of society."\n"But becoming a citizen of Germany? Doesn't that mean throwing away all those privileges and becoming a single commoner. I just want to live grandly."\n\n"You... you disgusting guy!"\n"For such a trivial reason, you reject the great destiny of the German people! You defector! The whole of the German people exists only for one thing, for the German people! Seeing you throw away that great cause for private greed, you must have Jewish blood mixed... Kehugh!"\n\n"Talk about Jews. Don't you know the thing I hate second most is Jews?"\n\n"Kehugh, cough, second? Then what's the first?"\n\n"What else, you Nazis.""
 ABY_descision_focus_event.38.a:0 "Before Frank could reply, Henlein pulled the trigger."

 ABY_descision_focus_event.39.t:0 "Retirement"
 ABY_descision_focus_event.39.d:0 ""...Our Czechoslovakia, the only democratic nation born from the remnants of Austria-Hungary, will forever hold that great cause in its heart and move toward the future."\n"Accordingly I declare. I, Tomáš Garrigue Masaryk, resign from the presidency as of 8 o'clock 10 days from now, and I swear to maintain neutrality in any political situation thereafter."\n\nNo one had guessed this. Even high-ranking political figures including Edvard Beneš couldn't hide the embarrassment prevalent on their faces.\n\n"Ahem, you must be very embarrassed. I only regret that I couldn't tell you in advance. But I had already decided to quit the presidency in '35 and live as an outsider. Right now I was only holding it temporarily because it's an emergency situation unprecedented in all times and places."\n"Now that the government is formed, for me to continue in this position is also an act that violates the constitution. Above all, how long will this old man live? Hoho."\n\nHe himself was laughing, but the audience couldn't hide their somber feelings.\n\n"Everyone, I am now an age looking toward ninety the day after tomorrow. I am afraid that I will make a wrong judgment due to my age. I also don't want to die suddenly and throw this country into chaos. This country needs new young blood."\n"Therefore, I plan to proceed with a general election in one week. So I ask you. Please exercise the precious rights given to you. Show them that even if we lose land, we do not lose the great cause of democracy."\n"Show them that we will never surrender to violence and oppression!"\n\nWhen the speech ended, thunderous applause poured out. Masaryk, stepping down from the platform, had tears flowing, but the relief that came like a wave afterward soothed him."
 ABY_descision_focus_event.39.a:0 "Farewell."

 ABY_descision_focus_event.40.t:0 "Tomáš Masaryk"
 ABY_descision_focus_event.40.d:0 "After the inauguration ceremony, Tomáš Masaryk returned to his residence prepared on the outskirts of Karlovy Vary.\nHanging his fedora and long overcoat on the rack, he slumped down on a small wooden chair as if falling.\nHis energetic appearance from earlier was gone, and he, looking like an exhausted old man, took out two small pieces of paper the size of business cards from his wallet.\n\nAs Prague disappeared, his children Jan Masaryk and Olga Masaryková also disappeared along with his house. The pieces of paper were photographs, the only pieces of memory he had left with not even a single piece of his children's clothing remaining.\n\nHe leaned the photos of his son and daughter against two vases with white carnations, and poured the cheap wine and juice he bought on the way into two glasses placed in front of the vases.\n\nHot tears flowed down his cheeks, and soon even though he wore glasses, the tears clouded his vision. Like a child who doesn't know how to control emotions, he lay face down on the desk and cried loudly.\nSaying he was sorry, that he should have taken them, that he wanted to run to Prague immediately after hearing the news but he had no choice because the people following him held him back, he continued apologies that no one would hear or accept.\nBecause he had to be strong in front of others, because if he frustrated everyone would lose hope, he lamented that he had to be the Father of Czechia instead of the father of Jan and Olga, and then he fell asleep exhausted.\n\nHe was the Father of Czechia, but he was also a father of two children."
 ABY_descision_focus_event.40.a:0 "He was an ordinary father."

 ABY_descision_focus_event.41.t:0 "The Death of Ludwig Czech"
 ABY_descision_focus_event.41.d:0 "The chilly wind of March 1937 blew through the cemetery in Karlovy Vary. The aftereffects of the gunshot wound received amidst the confusion immediately after the Great Transfer eventually took away the most dedicated symbol of harmony in the 'State of Two Worlds.' Ludwig Czech, the veteran politician who made the coexistence of Czechs and Germans his lifelong conviction, thus went to rest.\n\nMany key figures of the coalition government gathered at his funeral to see off the deceased on his final journey. The Czech and Abydos delegations, including Edvard Beneš and Ayane Okusora, held their places with somber expressions. However, the 'Father of Bohemia' Masaryk was unable to attend due to frail health, implying that an era was drawing to a close.\n\nIt was Konrad Henlein who took the podium for the eulogy. While honoring the noble will of Czech, he emphasized the unity and the path forward for the remaining Sudeten Germans. This was a declaration that went beyond a simple memorial speech, marking himself as the new leader who inherited Czech's dying wish. The star symbolizing the harmony of the old era fell, but his death paradoxically became an occasion to bind the strange solidarity of the remaining people even more tightly."
 ABY_descision_focus_event.41.a:0 "A star of an era falls."

 ABY_descision_focus_event.42.t:0 "Concerns about the Military"
 ABY_descision_focus_event.42.d:0 ""
 ABY_descision_focus_event.42.a:0 "Political officers will serve as a breakwater."
 ABY_descision_focus_event.42.b:0 "Respect the autonomy of the military."

 ABY_descision_focus_event.43.t:0 "Second Private Meeting"
 ABY_descision_focus_event.43.d:0 ""Uhehe~ Is this deja vu… This situation again."\n\nAs Hoshino slumped down on the floor grumbling, Masaryk opposite her gave a low laugh, 'Hoho.' The firmly closed studio door was in the same state as that day a year ago. But the awkward and sharp air that flowed between the two was nowhere to be found.\n\n"So it seems. I wonder whose mistake it is this time. Still, it's a relief that it's not as awkward as last time."\n\nHoshino smirked at Masaryk's words. Over the past year, she chose the path of learning from him instead of doubting Masaryk. He was sometimes a strict mentor, and sometimes a kind grandfather.\n\n"Since we have a lot of time, shall we talk? Sensei."\n\nHoshino spoke first. Now she naturally called him 'Sensei.'\n\n"That would be good. There was something I wanted to ask… After we reclaim Linz and Prague, what does Hoshino want to do?"\n\nMasaryk's gaze contained a serious question toward a political comrade, not just a student. Hoshino thought while looking at the ceiling for a moment, then faced him straight as if she had made up her mind.\n\n"I'm going to do politics. A society where livelihood is stabilized, everyone gets equal opportunities, and at least minimal welfare is guaranteed. I'm going to gather those who aim for that and create a party."\n\n"A socialist big-tent party? It's an excellent goal." \nMasaryk nodded.\n"But... within that… is the Communist Party included too?"\n\n"Yeah, of course."\n\nAt Hoshino's unhesitating answer, a look of embarrassment first flickered on Masaryk's gentle expression. A faint wrinkle formed between his brows.\n\n"Ms. Hoshino, I trust you, but I cannot trust the Communist Party. They are no different from servants receiving instructions from the master of the Kremlin. They are a potential threat within the democratic system. They must be excluded."\n\n"Don't worry. I'll protect democracy no matter what."\n\nHoshino replied calmly and continued.\n\n"But Sensei, those words… don't they sound familiar? The words saying 'They are a potential threat, so they must be excluded.'"\n\nIn an instant, Masaryk's eyes widened a bit. Hoshino continued speaking.\n\n"Sensei, you stood up to those who called the German residents that and embraced them. Even though they were also a potential threat to someone. Sensei showed it yourself. That you must see the possibility and embrace them."\n\nSilence flowed. Soon, a low laugh burst from Masaryk's mouth.\n\n"Hoho… I've been properly beaten. I had completely forgotten what I myself had taught."\n\nHe scratched his head as if ashamed, and soon looked at Hoshino with warm eyes.\n\n"You're right. I was wrong. Believing in the possibility and embracing, that was our beginning. Good. This old man will support Ms. Hoshino's path."\n"By the way, there's one thing I want to ask. If something blocks Ms. Hoshino's ideal, what will Ms. Hoshino do?""
 ABY_descision_focus_event.43.a:0 "...If that's the case, I must achieve it even through compromise."
 ABY_descision_focus_event.43.b:0 "...We started from an ideal in the first place."

 ABY_descision_focus_event.44.t:0 "Two Sons of Bohemia"
 ABY_descision_focus_event.44.d:0 "The convention hall of the Sudeten German Party was full of heat. As Tomáš Masaryk and Konrad Henlein stood side by side on the platform and read the friendship declaration for the future of the 'State of Two Worlds,' thunderous applause burst from the hall. However, after the official event ended, a subtle chill flowed between the two sitting across from each other in Henlein's private office.\n\nHenlein met Masaryk in a posture with his legs crossed and arms folded, leaning deep into his chair. It wasn't against etiquette, but his every attitude was sending a wordless message: 'This is merely a political alliance.' But Masaryk, regardless of his attitude, held his teacup with a benevolent smile throughout.\n\n"The convention was successful, Mr. Henlein. I felt the aspiration of our Sudeten compatriots all the way here."\n\n"They just want to reclaim their rightful rights, Excellency." Henlein replied stiffly.\n\n"Of course. It's a natural heart for a person who lost their home to want to reclaim it." Masaryk continued gently. "I sometimes think. Before we call each other Czechs or Germans, we are all neighbors who have taken root and lived in this Bohemian land. Like how trees in a forest are different as oaks or birches but eventually form the same forest."\n\n"A forest… but some trees block the sunlight of other trees." Henlein's voice was thorny.\n\n"That's right. That's why a gardener who takes care of the forest is needed. Someone who takes care so that no one tree withers, or no one tree grows too much and harms other trees. Shouldn't we become such an existence for each other?"\n\nIn Masaryk's words, there was no political calculation or coercion. It was just a pure philosophy handed from one human to another. Henlein uncrossed his legs without realizing it. He felt like a small crack was forming in the hard wall in his heart.\n\nMasaryk looked out the window and continued. "Mr. Henlein, I do not think the Sudetenlanders are the Czech ethnicity. But you are undoubtedly 'citizens' of Czechia. How can the fact that the words we use are different and the cultures we enjoy are different be a reason to oppress a human living under the same sky. Difference is not wrongness, it is just difference."\n\nAt that moment, Henlein realized. That the words the old man before him spat out were not political rhetoric, but the sincerity that penetrated his whole life. He did not see the Sudetenlanders as tools for votes or pieces for an alliance, but truly respected them as equal masters of this land.\n\nHow much time had passed. The conversation between the two continued until late at night.\n\nAs Masaryk stood up to prepare to return, Henlein stood up silently and escorted him to the door. His appearance opening the door and seeing off Masaryk was completely different from his initial arrogant and crooked attitude. He bowed his waist deep and greeted him with equal courtesy to a national elder and a human he truly came to respect.\n\nAfter Masaryk left, Henlein fell quietly into thought about the democracy Masaryk followed."
 ABY_descision_focus_event.44.a:0 "I respect him, but I do not respect democracy."
 ABY_descision_focus_event.44.b:0 "It might be okay to trust him a little..."

 ABY_descision_focus_event.45.t:0 "Two Worlds"
 ABY_descision_focus_event.45.d:0 ""
 ABY_descision_focus_event.45.a:0 "The two worlds must be together but cannot become one."
 ABY_descision_focus_event.45.b:0 "The two worlds can become one."

 ABY_descision_focus_event.46.t:0 "Expanding Distrust toward the Military"
 ABY_descision_focus_event.46.d:0 ""
 ABY_descision_focus_event.46.a:0 "Still, we should at least have civilian control."
 ABY_descision_focus_event.46.b:0 "We are not swayed by false rumors."

 ABY_descision_focus_event.47.t:0 "The Ship Leaving the Sandy Beach"
 ABY_descision_focus_event.47.d:0 "The warm spring sunlight of 1937 was brightly illuminating the auditorium of the newly built Abydos High School. To the point it was unbelievable that it was a school where only five students and ruins remained just two years ago, the auditorium was full of lively freshmen and juniors. Their gazes were all directed toward the five seniors sitting side by side in the first row below the platform. Hoshino, Shiroko, Nonomi, Serika, and Ayane. Today was their graduation ceremony.\n\nIn Kivotos, 'graduation' was an unfamiliar concept. A student was the owner of the academy and the academy itself. But here in Europe, in order to lead the nation along with the locals, the status of 'student' has now become a glorious shackle. Ayane accepted reality calmly. "This is the most rational procedure." Serika struggled with the graduation preparation documents for several days and nights out of disappointment.\n\nThe person standing in the temporary principal's seat of the auditorium was their mentor, Tomáš Masaryk. He looked at the five students and the audience in turn, and began a short but heavy speech.\n\n"My beloved students, and my respected colleagues. I heard that graduation is a rare thing in Kivotos. But today we are gathered here not to celebrate an end, but to celebrate a great beginning. You, who protected the school from the sand piles, have now become the pillars supporting the nation. Throwing off the yoke of a student and taking your first step as true leaders of this country, this old mentor will watch over you with a proud heart."\n\nAs Masaryk stepped down with warm applause, the five students stood up. As always, they bickered, yet their footsteps headed toward the platform as one. Languid-faced Hoshino, Shiroko with a firm will showing, Nonomi smiling kindly, Serika tense but dignified, and Ayane as calm as if organizing everything. As they stood side by side, the noisy auditorium became quiet as if water had been poured on it.\n\nThe five students stepped one step closer to the microphone."
 ABY_descision_focus_event.47.a:0 "The five students each started diverse speeches in their own voices."
 ABY_descision_focus_event.47.b:0 "The five students gave a speech in one voice."
 ABY_ABYDOS_Portrait_Change: "The §YForeclosure Task Force§!'s §YPortraits§! are replaced."

 ABY_descision_focus_event.48.t:0 "Regarding Worldviews"
 ABY_descision_focus_event.48.d:0 "12 worldview events appear until Operation Falling Flower, and the Federal worldview is formed through the choices in those events.\n\nInclusionism <-> Pluralism\nEgalitarianism <-> Authoritarianism\nIndividualism <-> Collectivism\nNationalism\n\nIt is divided into 3 sets of opposing worldviews and 1 independent worldview.\nFor opposing worldviews, the stronger one is considered selected. The Nationalism worldview ignores others if it is Fanatical, and is ignored for route determination if it is not Fanatical.\nSubsequent political focuses are determined by the Federal worldview held upon completion of the "Longest Night of the Federation" focus.\n\nLocals - Inclusionism, Egalitarianism, Collectivism\nAyane - Pluralism, Authoritarianism, Collectivism\nHoshino - Pluralism, Egalitarianism, Collectivism\nSerika (South Kivotos) - Inclusionism, Egalitarianism, Individualism\nSerika (Abydos) - Inclusionism, Authoritarianism, Collectivism\nShiroko (Democracy) - Pluralism, Egalitarianism, Individualism\nShiroko (Dictatorship) - Pluralism, Authoritarianism, Individualism\nNonomi - Inclusionism, Authoritarianism, Individualism\nSuou - Nationalism"
 ABY_descision_focus_event.48.a:0 "Confirm."
 ABY_descision_focus_event.48.b:0 ""

 ABY_descision_focus_event.49.t:0 "Language Issue"
 ABY_descision_focus_event.49.d:0 "After the truce with Hyakkiyako, the Coalition Provisional Government gradually regained stability. However, internal fissures that had been hidden by the massive threat of war began to slowly surface. Among them, the most urgent and complex issue was 'language.'\n\nCzechs, Germans, and even Kivotos people with halos on their heads. Three different ethnicities, three different languages were mixed within one nation. The government designated Czech as the official language as a stopgap for administrative efficiency, but this soon became a spark for new conflict. Open dissatisfaction burst out among German and Kivotos-affiliated residents, and those who didn't know Czech were marginalized in administrative procedures or faced problems where the opportunity for education wasn't properly guaranteed.\n\nJust as government leaders were agonizing over this complex problem, an unexpected proposal came in. It was from the 'Bohemian Esperanto Committee.' They proposed adopting Esperanto, a neutral international language not subordinate to a specific ethnicity, as the new official language of the Federation. The claim was that the introduction of Esperanto would provide a fair starting line for Czechs, Germans, and Kivotos people, and would become a symbol of true harmony worthy of the name 'State of Two Worlds.'"
 ABY_descision_focus_event.49.a:0 "We cannot repeat the mistakes of the Dual Monarchy."
 ABY_descision_focus_event.49.b:0 "We cannot waste administrative personnel for this."

 ABY_descision_focus_event.50.t:0 "Private Meeting"
 ABY_descision_focus_event.50.d:0 ""Uhehe~ We're completely locked in."\n\n"Hoho... I guess we'll have to wait until the meeting is over."\n\nTrapped.\nIn the short moment Masaryk came to pick up Hoshino, who failed to attend the meeting because she was sleeping, the guard locked the studio door and left.\nThus, the two sat across from each other awkwardly in the darkened studio.\nThen Hoshino spoke the first word.\n\n"Say~ Mr. Masaryk. How are the juniors lately? Everyone only follows Mr. Masaryk around so this old-timer is lonely?"\n\nMasaryk noticed Hoshino was leading him with questions and decided to treat her with sincerity, not as a politician.\n"Well, everyone is working hard, Ms. Hoshino. Specifically, Ms. Serika has achieved the most remarkable growth."\n\n"Heh~"\n"Then, Mr. Masaryk, what would you like those children to become?"\n\n"I hope that in the future those children will become the breakthrough toward the harmony of the two worlds."\n\nTo the appearance of Masaryk speaking without hiding emotions, unlike usual, Hoshino was flustered and ended up blurting out her inner thoughts."
 ABY_descision_focus_event.50.a:0 ""Uhehe... I wonder if those children want that~""
 ABY_descision_focus_event.50.b:0 ""

 ABY_descision_focus_event.51.t:0 "Sensei"
 ABY_descision_focus_event.51.d:0 ""...Perhaps it is an act of painting the white sketchbook of pure children with the color I want."\n"I taught those children lies. I told them how to doubt people, advised them to suppress their true nature, and made them stay with people they dislike."\n"Those children call me <Sensei>, but I myself doubt whether I have the quality of such a <Sensei> as mentioned in Kivotos."\n"Whether I, who couldn't even protect my family, have the right to be the <Sensei> of children I met suddenly... Ah, I'm sorry Ms. Hoshino. I went off topic."\n\nHoshino saw a small droplet forming in Masaryk's eyes.\nJust as she hides her true nature for Abydos and her juniors, Hoshino vaguely thought, this person also acted as a philosopher leader for his country.\n"No, please continue. I want to hear... more of Mr. Masaryk's story."\n\n"If Ms. Hoshino says so..."\n"...I've lived a life riddled with lies. If you ask if it was for my private greed... philosophers would think differently, but for now I think not."\n"I can take pride that all my lies were to protect the things I love."\n"I don't know what Ms. Hoshino thinks, but what I did to those children... would be for the same reason."\n\nHoshino opened her mouth without realizing it.\n"The- this old-timer also has things to..!"\n\nAt that moment the door opened.\n"Excellency, were you here? I was worried because you didn't come for so long..."\n"Hoho, no. Is the meeting already over?"\n"It's almost done... there are several agendas that need your presence so you should go quickly."\n"Right, let's go quickly."\n\n"Say..."\nTo Hoshino, who was trying to say something, Masaryk left one word."
 ABY_descision_focus_event.51.a:0 ""Tasks should be done by oneself. Those children were all like that too.""
 ABY_descision_focus_event.51.b:0 ""

 ABY_descision_focus_event.52.t:0 "The Last Lesson"
 ABY_descision_focus_event.52.d:0 "Time was not on Masaryk's side. Seeing the bloody phlegm coming out with a cough, he sensed that not much time was left. He could no longer delay. He had to lay the last cornerstone to ensure Abydos moves forward without wavering even after he leaves. He summoned all students of Abydos High School to the auditorium. On the platform, Hoshino and four colleagues who had become graduates stood side by side.\n\nAs Masaryk announced his resignation from the 'temporary principalship' and the abolition of the 'principal' position, the auditorium began to buzz. To the students, he was not just a political leader, but a benevolent mentor who opened their path. Murmurs filled with regret and sadness burst out from everywhere.\n\n"Sensei, can't you stay as our principal?"\n\nAs the sobbing voice of a lower-grade student echoed in the auditorium, Serika on the platform gently grabbed the microphone.\n\n"Everyone, I understand your disappointment. But Sensei isn't leaving. He's just returning to where he originally belonged."\n\nAyane added an explanation calmly. "Originally, an academy in Kivotos is a place where students are the owners. Sensei was briefly the pillar so that we could take root in this land. Now we will officially reorganize the Task Force into a 'Student Council' and lead the school ourselves. as a proud autonomous district within the Federation."\n\nHoshino approached the microphone with her characteristic languid expression. "Uhehe~ Well, even if Sensei isn't here, we are, right? Don't worry. This old-ti... no, big sisters will lead you well."\n\nAt the coaxing of the five graduates, the students' agitation gradually subsided. Finally, as the auditorium became quiet again, Masaryk looked at the students and began his last lesson.\n\n"I thought I taught you many things, but looking back, I rather learned more from you. How to not lose hope even in despair, and how to accept neighbors from another world without prejudice."\n\nHis voice was cracked, but it resonated clearly in the hearts of all the students in the auditorium. Masaryk began to end his last speech.\n\n"You are students of Abydos, but...""
 ABY_descision_focus_event.52.a:0 ""...You are also citizens who will brighten the future of the Abydos Federation.""
 ABY_descision_focus_event.52.b:0 ""...You are also youths with the dreams of the Abydos Federation.""

