 #아비도스 오프닝#
 ABY_country_intro_header: "§Y빛을 잃은 사파이어§!"
 ABY_country_intro_header_1: "§Y수영복 복면단§!"
 ABY_country_intro_header_2: "§Y체코슬로바키아§!"
 ABY_country_intro_header_3: "§Y나의 고향 주데텐란트§!"
 ABY_country_intro_header_4: "§Y고르디우스의 매듭§!"
 ABY_country_intro_header_5: "§Y두 세계의 국가§!"
 ABY_country_intro_content: "아비도스 고등학교를 무엇에 비유할 수 있을까요? \n아마 더는 빛나지 않는 사파이어가 적절할 것입니다. 과거 아비도스에 70명의 학생회장이 난립하며 내전을 벌이던 때, 질서를 수호하고 아비도스를 통일하였으며, 나아가 온 키보토스를 발 아래에 두며 공포에 떨게 하였던 학생회장 셰마타의 치세는 이제는 한 전설에 불과합니다. 그가 이룬 아비도스의 모든 것은 모래 속에 덮여 자취를 감추었습니다. \n\n절망적인 상황 속에서 벌어진 대전이는 이 혼란을 한층 더 가중시켰습니다. \n\n1935년 11월 1일, 오스트리아 다뉴브 강 이북 호른에 전이한 아비도스 고등학교는 무력충돌을 피하고자 오스트리아인, 체코인들과 협력하며 지역 안정을 위해 노력하였습니다. 그러나 며칠 후 오스트리아를 평정한 산해경이 이를 위협으로 느끼고 아비도스를 침공하였고, 이어 백귀야행까지 공격에 가담하였습니다. \n본관에서 치열한 공방을 벌이던 중, 보급 확보를 위해 나간 세리카가 스케반에게 억류되자, 남은 네 명은 본관을 버리고 동료를 구하기 위해 린츠를 떠났습니다."
 ABY_country_intro_content_1: "아비도스의 학생들은 신원을 감추기 위해 복면을 쓰고 즈노이모의 스케반 기지를 습격하였습니다. 그러나 그곳에서 발견된 문건은 이미 백귀야행이 스케반을 토벌하고 억류된 포로들을 다른 곳으로 이송하였다는 사실을 알려주었습니다. \n실수인지 고의인지 모를 노노미의 말실수로 인해 이들은 ‘수영복 복면단’이라는 별칭을 얻게 되었습니다. 하지만 그 재미있는 이름과는 달리 전투력은 압도적이었습니다. \n4명은 백귀야행군을 차례대로 격파했고, 신출귀몰하며 도시 전체를 수색했습니다. 그들은 브르노와 타보르를 차례로 습격해 세리카의 행방을 추적하였고, 결국 그녀가 햐키야코우(프라하)로 이송되었다는 단서를 확보하였습니다. \n아비도스의 네 명은 지체 없이 프라하로 향하였고, 그 여정은 연립임시정부의 씨앗이 되는 사건으로 이어졌습니다."
 ABY_country_intro_content_2: "프라하에 돌입한 아비도스의 학생들은 치밀하게 방어선을 무너뜨리며 세리카를 구출하였고, 그 과정에서 억류되어 있던 체코슬로바키아 정부인사들을 발견하였습니다. \n그들과 동맹을 맺은 아비도스는 체코-아비도스 임시정부를 구성하였고, 수감 생활 속에서도 간수들과 교류하며 키보토스어를 습득하고 고립된 체코군의 위치를 파악한 에드바르트 베네시의 도움으로 프라하에서 탈출한 이후 클라드노, 멜니크, 이친에서 고립된 체코군을 차례로 구출하며 병력을 증강하였습니다. \n비록 믈라다볼레슬라프에서는 이미 전멸한 부대의 장병들에게 명복을 빌어줄 수밖에 없었으나, 더 이상 지체할 시간은 없었습니다. \n임시정부는 북부로 진출하여 리베레츠에 전이한 네프티스 그룹과도 접촉, 동맹을 맺어 군수와 자금의 지원을 확보하였습니다.\n또한 아사리기 스오우라는 네프티스 그룹 소속의 유능한 지휘관도 합류해 향후 전투에 큰 도움이 되게 됩니다."
 ABY_country_intro_content_3: "임시정부는 서쪽으로 이동하여 백귀야행의 압박을 받고 있던 주데텐 독일인당 민병대와 접촉하였습니다. \n이들은 콘라트 헨라인과 카를 헤르만 프랑크의 지휘 아래 고향 방어에 나서고 있었으며, 아비도스와 체코 지도부의 제안을 받아들여 동맹을 체결하였습니다. 3세력이 힘을 합친 임시연립정부는 주데텐란트 방어선을 재정비하고, 곧이어 북서부의 전략 요충지 에겔란트를 향해 총공세를 펼쳤습니다. \n치열한 전투 끝에 에겔란트를 탈환하고, 방어선을 굳혀 백귀야행의 북진을 저지하였습니다. 이 시점에서 연립정부는 명실상부히 한 배에 탄 관계가 되었으며, 각 세력의 이해관계가 비로소 하나의 틀 속에 들어가기 시작하였습니다."
 ABY_country_intro_content_4: "북부 주데텐란트 최대 도시 카를로비바리에서 연립임시정부는 본격적인 기반을 다졌습니다. \n방어선을 돌파하려는 백귀야행의 대규모 공세를 연합군은 성공적으로 격퇴하였고, 이 승리를 계기로 12월 25일, 크리스마스 휴전협상이 시작되었습니다. \n정치인과 장군, 그리고 키보토스 출신 대표자들이 한자리에 모여 협상을 이어갔고, 12월 31일 마침내 휴전협정이 체결되었습니다.\n\n아비도스 임시정부. 키보토스계, 체코계, 독일계가 연합한 이 연합국가는 아직 건재합니다. 그러나 각자의 목표가 완수되어도 이 기이한 연합체가 지속될 수 있을까요? 그들 사이에 얽힌 이념과 민족의 복잡한 문제를, 그들은 과연 풀어낼 수 있을까요? 답은 시간만이 알고 있을 것입니다.\n\n과연 고르디우스의 매듭을 풀 방법이 밝혀질까요? 아니면 옛이야기처럼 결국 끊어지게 될까요?"
 ABY_country_intro_content_5: "두 세계의 국가의 세 세력은 협정을 체결해 체코, 주데텐란트, 린츠를 해방하는 데 협력하기로 하였습니다. \n이를 보고 외부에서는 아비도스를 한편으로는 경의, 한편으로는 모멸을 담아 ‘두 세계의 국가’라고 부릅니다. \n이 별명을 부르는 의미도, 이를 이루는 민족도, 그리고 그들의 사상마저도 다양한 ‘두 세계의 국가’는 그 이름을 끝까지 유지할 수 있을까요? \n전쟁의 불길은 잠시 잦아들었으나, 그 불씨는 여전히 유럽 전역 에서 타오르고 있습니다. \n\n미래는 아직 안개 속에 가려져 있으며 그들의 연합이 끝까지 견딜 수 있을지, 그 답은 먼 훗날에나 드러날 것입니다.\n\n\n§C개발- 코이, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_guide: "§Y목표§!\n\n£white_dot §4연립임시정부를 수립하고 보헤미아, 주데텐란트, 린츠를 수복하기 위한 작전을 세우십시오.§!\n£white_dot §4선생님의 도움을 받아 아비도스 학생들이 단점과 트라우마를 극복할 수 있도록 하십시오.§!\n£white_dot §4오스트리아인들의 환영을 받고 그들의 요구를 수용하십시오.§!\n£white_dot §4오스트리아를 수복하고 연방정부를 세우십시오.§!\n\n    £white_dot §C계몽회의 음모를 저지하고 안정적인 민주정부를 수립하여 마사리크의 유산을 재건하십시오.§!\n        £white_dot §Y두 세계가 공존할 방법을 찾으십시오.§!\n            £white_dot §g체코슬로바키아와 소협상국을 재건하십시오.§!\n            £white_dot §g적들의 침공에 맞서 조국을 수호하고 그곳에 민주정부를 수립하십시오.§!\n            £white_dot §g새롭게 하나된 유럽을 위한 길을 제시하십시오.§!\n        혹은...\n        £white_dot §Y두 세계가 하나될 방법을 찾으십시오.§!\n            £white_dot §g연방공화국을 수립하고 대의를 위해 아비도스 헤게모니를 포기하십시오.§!\n            £white_dot §g적들의 침공에 맞서 조국을 수호하고 그곳에 또 다른 양세계 공화국을 세우십시오.§!\n            £white_dot §g유로-키보토스의 통일을 위한 회의를 소집하고, 계속 나아가십시오.§!\n\n    £white_dot §t쿠데타로부터 연방을 수호할 방법을 모색하십시오.§!\n        £white_dot §Y그들과 협상하여 대책위원회의 안전을 보장받으십시오.§!\n            £white_dot §g잃어버린 자유를 되찾기 위해 거리로 나서 꽃을 들고 노래를 부르십시오.§!\n            £white_dot §g총구 앞에서 물러서지 마십시오. 병사들에게 호소하십시오.§!\n            £white_dot §g자유를 위해, 폭력을 뺀 모든 수단을 사용하십시오.§!\n        혹은...\n        £white_dot §Y쿠데타 세력과의 협상을 거부하십시오.§!\n            £white_dot §g군정사령부의 정치조직 탄압을 피해 지하로 숨어드십시오.§!\n            £white_dot §g연방통합당을 중심으로 정당을 규합해 인민전선을 창설하십시오.§!\n            £white_dot §g소련의 지원을 받아 봉기하여 파시스트 정권을 물리치십시오.§!\n                £white_dot §g소비에트 연방의 첨병으로 키보토스를 향해 칼을 들이대십시오.§!\n                £white_dot §g반대파를 숙청하고 탄압해 일인독재체제를 확립하십시오.§!\n                £white_dot §g프라하에서 일어난 대규모 시위를 진압하십시오.§!\n            혹은...\n            £white_dot §g우리의 힘으로 봉기하여 우리에게 주어진 민주주의를 회복하십시오.§!\n                £white_dot §g인민전선을 흩어지지 않게 붙들고 연대를 구축하십시오.§!\n                £white_dot §g극단주의에 대해 규탄 성명을 발표하고 두 세계의 침공을 막아내십시오.§!\n                £white_dot §g사회민주주의의 기틀을 다지고 개혁을 향해 나아가십시오.§!\n\n    £white_dot §0쿠데타로 연방정부를 뒤엎고 반대파를 말살하십시오.§!\n        £white_dot §Y선배들의 복수를 위해, 모든 걸 버리고 나아가십시오.§!\n        혹은...\n        £white_dot §Y아비도스의 모든 것을 파괴하기 위해, 세상에 대한 연기를 하십시오.§!\n            £white_dot §g자신을 영도자이자 구세주로 칭하고 모든 권한을 집중시키십시오.§!\n            £white_dot §g현지인을 정화하여 키보토스인 이하로 줄이고 생활권을 확보하십시오.§!\n            £white_dot §g키보토스의 구식 문화를 모조리 부수고 계몽문화로 갈아치우십시오.§!\n            £white_dot §g최종적으로, 동아시아와 아메리카를 멸망시키고 이 행성을 키보토스인의 새 터전으로 만드십시오.§!\n            £white_dot §R...그리고 자신이 뭔래 하려고 했던 일을 떠올리십시오.§!\n\n\n§C개발- 코이, Mako, .spear_, 민트쿤mintcoon§!\n§YSpecial Thanks- 총괄, Pencildude, Imika, Fraise§!"
 ABY_GATHERING_STORM_DESC:0 "아비도스 고등학교는 과거, 키보토스에서 가장 거대하고 부유한 학원이었으나, 심각해진 사막화와 점점 불어난 빚은 학원의 몰락을 초래했습니다. 아비도스에 남은 5명의 학생은 아비도스를 지키기 위해 고군분투하고 있었습니다.\n\n대전이 이후, 사태는 새로운 국면으로 전환되었습니다. 그들을 옭아매던 빚은 없어졌고, 작은 자치구는 역으로 주민들과 현지인들간의 충돌을 억제하는데 큰 도움이 되었으며, 현지인의 협력을 얻을 수 있게 되었습니다.\n허나 오히려 이곳 현지인들 사이의 갈등이 문제가 되고 있습니다. 그들은 이 문제의 해결이 급선무일 것입니다."
