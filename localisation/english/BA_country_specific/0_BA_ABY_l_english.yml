 ABY_new_event.179.t:0 "민족을 초월하여"
 ABY_new_event.179.d:0 "1936년, 체코 임시정부, 독일계 위원회, 그리고 아비도스 고등학교 대책위원회는 역사적인 연합을 결성하기 위해 카를로비바리 대극장에 모였다. 임시정부 의회로 결정된 이 극장은 오늘, 새로운 정부와 미래를 결정짓는 무대가 되었다.\n\n대극장 내부는 긴박하면서도 비장한 분위기로 가득했다. 체코의 푸른 삼각형을 가진 백적색의 깃발, 주데텐란트를 상징하는 흑적흑기, 그리고 아비도스 고등학교의 상징을 담은 교장이 나란히 걸려 있었다.\n\n먼저 연단에 오른 것은 토마시 마사리크였다. 그는 나이든 얼굴에도 불구하고 강렬한 카리스마를 내뿜고 있었다. 그의 목소리가 대극장 안에 울려 퍼졌다.\n\n“우리는 조국을 잃었습니다. 프라하는 백귀야행의 손아귀에 들어갔고, 우리의 국민은 흩어졌습니다. 그러나 우리 체코슬로바키아의 정신은 결코 꺾이지 않았습니다. 오늘 이 자리에서, 우리는 다시금 그 정신을 되살리고자 합니다.”\n\n그는 잠시 말을 멈추고, 청중들을 둘러보며 천천히 말했다.\n\n“행정명령 111호. 이것은 단순히 비상사태를 알리는 명령이 아닙니다. 이것은 우리의 생존과 자유를 지키겠다는 약속입니다. 비록 우리는 우리의 땅을 잃었지만, 이 명령을 계승하여 우리의 대의를 이어갈 것입니다. 오늘, 독일인들과 아비도스와의 연합을 통해 우리는 백귀야행에 맞설 새로운 정부를 선포하고자 합니다. 이 연합은 우리 모두의 희망이 될 것입니다.”\n\n다음으로 연단에 선 사람은 루트비히 체흐였다. 그는 독일계 국민사회당원 이었고, 과거부터 독일계와 체코계의 화합을 주장해온 저명한 인물이었다.\n\n“오늘 우리는 역사의 새로운 갈림길에 서 있습니다. 독일계와 체코계는 오랜 시간 동안 이 땅을 공유하며 살아왔습니다. 그러나 지금 우리의 적, 백귀야행과 산해경은 우리를 분열시키고 약화시키려 하지만, 우리는 그들의 뜻대로 되지 않을 것입니다.”\n\n그는 잠시 말을 멈추고, 무대 아래를 둘러보며 한층 부드러운 어조로 말을 이었다.\n\n“저는 독일계와 체코계가 하나로 뭉칠 수 있음을 믿습니다. 우리는 서로 다르지만, 모두가 이 땅을 사랑하고 자유를 갈망합니다. 저는 독일계와 체코계가 과거의 갈등을 제쳐두고, 힘을 합쳐 체코와 오스트리아를 해방하기를 바랍니다. 이것은 단순한 군사적 목표가 아닙니다. 이것은 우리가 협력하여 이룰 수 있는 갈등을 초월한 승리일 것입니다.”"
 ABY_new_event.179.a:0 "그들에게 독일계와 체코계 할 것 없이 큰 박수가 쏟아졌다."
 
 ABY_new_event.180.t:0 "그리고 세계를 초월하여"
 ABY_new_event.180.d:0 "마지막으로 연단에 오른 사람은 타카나시 호시노였다. 그녀는 젊다 못해 어렸고 몸은 아담했지만, 그 눈빛은 깊은 책임감과 결단력을 담고 있었다. 그녀는 앞의 사람들과는 사뭇 다른 느낌으로 말을 시작했다.\n\n“으헤, 앞에서 중요한 말은 다 해줘서 이 아저씨는 뭘 말해야 할지 모르겠네. 아마 많은 사람들이 이 연합에 회의감을 느낄거야. 체코슬로바키아 정부 사람들을 구출한것도 우리고, 체코인과 독일인이 싸우지 않게 규합한 것도 우리인데, 왜 우리가 저 사람들을 위해 피를 흘려야 하느냐고 말이야.”\n\n그녀는 잠시 말을 멈추고 주변을 둘러보았다.\n"하지만."\n\n“그게 과연 온전히 우리의 공일까? 체코인들은 백귀야행에 대항해 최전선에서 피를 흘리며 우리들이 모두를 규합할 시간을 벌어 주었고, 독일인들은 과거의 갈등을 제쳐두고 체코 정부의 사람들을 구하기 위해 우리보다 먼저 뛰어들었어. 우리는 우리의 공에 비해 과분한 권한과 지위를 물려받았고, 따라서 우리는 그들에게 보답할 의무가 있어. 그리고 우리가 저들을 버린다 한들 트리니티, 카이저, 백귀야행... 이 모두가 우리를 가만히 내버려 둘리도 없지. 오늘의 협약은 단순히 전쟁의 동맹이 아닌, 궁극적으로는 두 세계간의 평화를 위한 시작이야. 그러니 부디 동참해줘.”\n\n그녀는 말을 마치며 고개를 숙였다."
 ABY_new_event.180.a:0 "이내 극장 내부는 뜨거운 박수로 가득 찼다."
 
 ABY_new_event.181.t:0 "카를로비바리 협약"
 ABY_new_event.181.d:0 "세 대표가 발언을 마친 뒤, 세력 대표은 함께 협약의 내용을 낭독했다.\n\n1.체코슬로바키아와 독일계 위원회의 연합\n\n1-1.체코 임시정부와 독일계 위원회는 하나로 연합하여 백귀야행과 산해경에 의해 점령된 오스트리아의 해방을 최우선 과제로 삼는다.\n\n1-2.군사적, 물자적, 외교적 협력을 약속하며, 서로를 대등한 동맹으로 인정한다.\n\n2.아비도스 고등학교의 중재 역할\n\n2-1.아비도스 고등학교 대책위원회와 아비도스계 주민들은 체코와 독일계 간의 갈등을 조정하고, 상호 협력을 유지하도록 중재한다.\n\n2-2.오스트리아 해방 후, 키보토스계 주민들과 현지 주민들 간에 발생할 수 있는 갈등을 해결하고 지역사회의 화합을 위해 노력한다.\n\n3.아비도스 임시정부의 출범\n\n3-1.아비도스 임시정부는 체코슬로바키아의 정통성을 계승하며, 새로운 정부로서 연합의 지도적 역할을 수행한다.\n\n3-2.모든 세력은 백귀야행과 산해경의 침략에 맞서 싸우는 데 협력한다.\n\n그날 카를로비바리 대극장에서 세 대표가 손을 맞잡고 낭독한 협약은 단순한 군사적 동맹이 아니었다. "
 ABY_new_event.181.a:0 "그것은 새로운 미래를 향한 약속이었다."
 
 ABY_new_event.182.t:0 "별의 꿈"
 ABY_new_event.182.d:0 "쐐액- 바람이 부는 언덕에 한 소녀가 앉아 가만히 노을지는 마을을 바라보고 있었다.\n부시럭- 철컥!\n"응, 선배 결투야?"\n"아, 시로코 짱 이구나..."\n"...역시 여기 있었네."\n시로코는 그녀의 곁에 앉았다.\n"시로코 짱, 아저씨를 찾으면, 아저씨의 비밀에 대해 알려준다고 했었지?"\n"응."\n"...아저씨는, 한 수첩을 찾고 있었어. 아저씨에게 정말 소중한 사람이 남긴 수첩. 분명 아비도스 자치구 어딘가에 있어야 할 수첩. 하지만... 대전이 이후 그걸 찾을수는 없게 되었어."\n"그것 때문에 의기소침했던거야?"\n그녀는 잠시 마을-아비도스 자치구를 내려다보며 말을 멈추었다 이내 입을 열었다.\n"시로코 짱, 마사리크 씨 기억나? 그분은 대전이때 모든 가족을 잃었었지."\n"그분이 돌아가실 때 베네시, 체흐 씨와 함께 날 불렀던 것도 알거야. 그분은 유언과 함께 베네시, 체흐 씨에게 조언을 했어. 하지만 나와는 따로 이야기를 하고 싶다고 했고, 이내 방 안에는 그분과 나만이 남았어."\n\n"호시노 씨, 저는 가끔 아쉬워하곤 해요. 나라를 너무 사랑한 나머지...쿨럭. 아이들과 오랜 시간을 보내지 못했던 걸요. 잃고 나서야 그것이 소중함을 알았죠."\n"...그래서 후회하시나요?"\n"하지만 후회하진 않아요. 내가 이 나라를 위해 일하지 않았다면, 그조차의 추억도 쌓지 못했을 것을 알기에 그래요."\n"만약 주님이 저를 과거로 보내준다고 해도, 저는 거부할 겁니다. 제가 그 아이들이 없어질걸 안다면, 언제나 전전긍긍하며 행복한 추억을 쌓지 못하리란 걸 알기 때문입니다."\n"그래서 저는 그 짧지만 행복했던 추억을 간직하기로 했습니다. 제가 그 아이들에게 집착할수록, 저의 고통만 더 심해질 테니까요."\n"그는 눈에 눈물이 고였지만, 그 어느 때보다 편안해 보였어."\n"아... 아이들과의 추억을 마무리하러 떠날 때가 된 것 같네요."\n"얀, 올가, 알리체..."\n\n"그렇게 그분은 편안하게 숨을 거두었어."\n"...마사리크 씨는 마지막 순간까지 그의 아픔을 동지들에게 드러내지 않고 모두의 정신적 지주가 되었어."\n"시로코 짱, 아저씨가... 마사리크 씨가 될 수 있을까?""
 ABY_new_event.182.a:0 "응, 선배는 마사리크 씨가 될 수 있어."
 ABY_new_event.182.b:0 "아니, 선배는 마사리크 씨와는 달라."
 
