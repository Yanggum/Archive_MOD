 IDC_tirailleurs_reformed_flag: "Infantry reorganized into [ROOT.GetAdjective] Army"
 IDC_tirailleurs: "Tirailleurs"
 IDC_tirailleurs_desc: "The Tirailleurs are a gendarmerie and military force established in 1884, shortly after the creation of the French Indochinese Union. The officer corps is composed entirely of Europeans—Frenchmen or mercenaries—while the rank-and-file soldiers are mostly [ROOT.GetAdjective] locals. While highly effective in combat, significant discontent is brewing due to discrimination and poor management."
 modify_IDC_tirailleurs_tt: "§Y$IDC_tirailleurs$§! Modifier:"

