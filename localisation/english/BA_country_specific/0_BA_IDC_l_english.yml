 IDC_anti_colonialist_propaganda_idea: "[ROOT.GetAdjective] Independence League"
 IDC_outbreak_of_indochina_war: "Outbreak of the Indochina War"
 has_IDC_independence_war_starter: "Our nation is the initiator of the Indochina War"
 IDC_independence_war_ongoing: "The Indochina War is in progress"
 IDC_independence_war_onended: "The Indochina War ended in an Indochinese victory"
 IDC_outbreak_of_indochina_war_tt: "Our military will take advantage of weakened administrative power to overthrow the colonial authorities and officially launch a war of independence through a coup. If we seize control of §YCambodia§!, §YLaos§!, and §YVietnam§!, our Indochinese brother nations will join the war of independence. If all of Indochina is liberated or the enemy is thoroughly subjugated to force a peace treaty, we will be able to win complete independence from the former suzerain.\n\nConversely, if the enemy maintains control over §YCambodia§!, §YLaos§!, and §YVietnam§!, they will be able to force a peace treaty and maintain their control over our nation."
 IDC_indochina_communist_party_contact_tt: "§RWe can no longer attempt negotiations for peaceful independence and will focus on armed struggle for independence§!"
 IDC_vietcong_unit_tt: "When the war of independence begins, we will gain 3 §YViet Cong Divisions§!. If §YCommunism§! support becomes high enough, they may launch a coup and take over the leadership of the government."
 IDC_monarchist_movement_tt: "When the war of independence begins, we will gain 2 §YRoyal Guard Divisions§!, and monarchist sentiment in the country will steadily increase."
 idea_IDC_rural_enlightenment_movement: "Rural Enlightenment Movement"
 IDC_surrender_of_france: "Surrender of France"
 IDC_surrender_of_france_desc: "If the independence-seeking brothers of Indochina control all states of Indochina and resolutely block any further French aggression, we will be able to win our independence. Only the final hour remains for the liberation of all Indochinese people."
 IDC_break_the_law: "Rupture of Rule"
 IDC_break_the_law_tt: "At the start, §Y[FRA.GetNameWithFlag]§! does not rule any of §YVietnam§!, §YLaos§!, §YCambodia§!, or §Y[1068.getName]§!"
 IDC_break_the_law_tt_NOT: "At the start, §Y[FRA.GetNameWithFlag]§! rules at least one of §YVietnam§!, §YLaos§!, §YCambodia§!, or §Y[1068.getName]§!"

 IDC_establish_the_anc_modifier_tt: "§RIndochinese Tirailleurs-related focuses can no longer be performed§!"
 IDC_establish_the_anc_locking_tt: "Removes the §YIndochinese Tirailleurs§! national spirit and replaces it with the §Y[ROOT.GetAdjective] Army§!, while retaining half of the previously gained bonuses."
 IDC_establish_the_anc: "Establish the [ROOT.GetAdjective] Army"
 IDC_establish_the_anc_desc: "Many of our demands have finally been met. Today is the day we form a proper [ROOT.GetAdjective] military force, which will stand tall against any enemy we may face in the future."
 IDC_marine_nationale: "National Navy"
 IDC_marine_nationale_desc: "Although we have never properly invested in it before, most modern nations require a navy. However, we must decide whether the purpose of the navy is to transport troops to the South Pacific or to operate more effectively in nearby rivers and coastal waters."
 IDC_expand_shipping_industry: "Expand Shipping Industry"
 IDC_expand_shipping_industry_desc: "Many parts of our country are difficult to access except by air or river. Since connections with foreign countries across the sea are also vital, we must expand our shipbuilding industry to meet the needs of our modernizing nation."
 IDC_south_atlantic_navy: "South Pacific Navy"
 IDC_south_atlantic_navy_desc: "If we are to properly defend our independence, we must ensure that colonial powers can never land on our shores again."
 IDC_brown_water_navy: "Brown Water Navy"
 IDC_brown_water_navy_desc: "The vast oceans are beyond our concern. However, to maintain national security, we must effectively patrol our extensive rivers, lakes, and coastal areas."
 IDC_coastal_defence_fleet: "Develop Coastal Defense Fleet"
 IDC_coastal_defence_fleet_desc: "We must properly defend our coasts. This can only be achieved by building powerful coastal defense vessels capable of operating close to the shore."
 IDC_supply_line_disruption_tactics: "Supply Line Disruption Tactics"
 IDC_supply_line_disruption_tactics_desc: "The enemy's supply lines can collapse with a single precise strike. Our submarines will carry this out, and this will play a key role in any future wars we wage."
 IDC_force_arienne_congolaise: "[ROOT.GetAdjective] Air Force"
 IDC_force_arienne_congolaise_desc: "To properly keep pace with our enemies, we must reorganize our aviation assets and establish a formal air force within the newly created military."
 IDC_procure_foriegn_equipment: "Procure Foreign Equipment"
 IDC_procure_foriegn_equipment_desc: "Since we lack the technical know-how and industrial base to develop and produce aircraft on our own, it would be wise to focus on borrowing designs from allies or purchasing aircraft."
 IDC_aeronautical_research_department: "Aeronautical Research Department"
 IDC_aeronautical_research_department_desc: "Aviation is not a field we have invested in heavily, but we must not forget that it is an area where we should not rely too much on foreign powers. Even if it is costly, we need to make efforts to develop and produce our own aircraft."
 IDC_scouting_the_terrain: "Terrain Reconnaissance"
 IDC_scouting_the_terrain_desc: "Our vast jungles not only make traversing the region difficult but also make it hard to spot the enemy before they approach major cities. Therefore, the Air Force must play a major role in aerial reconnaissance missions."
 IDC_expand_production_facilities: "Expand Production Facilities"
 IDC_expand_production_facilities_desc: "We must increase the production of military equipment, and the only way to do this is to build new facilities where this is possible."
 IDC_forces_terrestres: "Territorial Defense Force"
 IDC_forces_terrestres_desc: "The most important element of any army is its ground forces, and the current state of our military still leaves much to be desired. We must invest in this to ensure we can stand tall against our enemies."
 IDC_from_a_gendarmerie_to_a_fighting_force: "From Gendarmerie to Fighting Force"
 IDC_from_a_gendarmerie_to_a_fighting_force_desc: "It is time to move away from our origins as the Indochinese Tirailleurs, reduce the gendarmerie-like feel, and redesign the military to look like a proper fighting force."
 IDC_academie_militaire_de_kananga: "[ROOT.Capital.GetName] Military Academy"
 IDC_academie_militaire_de_kananga_desc: "Not only regular soldiers but also officers and generals need training. We must invest in the [ROOT.Capital.GetName] Military Academy to better educate our military for future missions."
 IDC_standardize_military_production: "Standardize Military Production"
 IDC_standardize_military_production_desc: "In the current situation where foreign and domestic equipment are all mixed up, our defense industry is unable to produce necessary equipment quickly. We must standardize the equipment used by the military."
 IDC_societe_africaine_dexplosifs_congo: "Indochina Munitions Company"
 IDC_societe_africaine_dexplosifs_congo_desc: "Another thing needed to manufacture our own weapons is a state-owned enterprise within our borders that can meet our demands. In that regard, we must establish the Indochina Munitions Company so that it can provide ammunition exclusively to us."
 IDC_triga_i_project: "Nuclear Armament Plan"
 IDC_triga_i_project_desc: "The future of energy lies in nuclear power, and accordingly, our scientists have been working hard to build Indochina's first nuclear power plant. Once this goal is achieved, we will be able to repurpose this energy for military purposes according to our needs."
 IDC_military_service_for_citizenship: "Military Service for Citizenship"
 IDC_military_service_for_citizenship_desc: "Many people in our country do not have citizenship or passports. Therefore, like the Romans did, we should provide citizenship to those who have served in our military for a certain period, which will help attract new potential recruits."
 IDC_guerilla_tactics_drills: "Guerrilla Tactics Drills"
 IDC_guerilla_tactics_drills_desc: "Our terrain is well-suited for hit-and-run tactics. Therefore, we must ensure our soldiers master these tactics so they can defeat any enemy they encounter."
 IDC_french_as_martial_language: "French as Martial Language"
 IDC_french_as_martial_language_desc: "Traditionally, the Indochinese chain of command has used French as its primary language. Since this has proven to be an effective method, there is no reason to change it."
 IDC_adopt_lingala_and_swahili_as_martial_languages: "Local Languages in the Military"
 IDC_adopt_lingala_and_swahili_as_martial_languages_desc: "Traditionally, the Indochinese Tirailleurs and the chain of command have used French as their primary language, but we must attempt to distance ourselves from our former rulers, purge the remnants of imperialism, and introduce our local languages."
 IDC_31e_brigade_parachutiste: "Establish Paratrooper Brigade"
 IDC_31e_brigade_parachutiste_desc: "We must create an elite paratrooper unit that can quickly seize settlements and wipe out internal enemies, and also act as an elite guard to protect national leaders when they are threatened."
 IDC_peacekeeping_forces: "Peacekeeping Forces"
 IDC_peacekeeping_forces_desc: "The flames of war may not be sweeping through Indochina right now, but they are sweeping somewhere else in the world. Even if it means sending our troops to a distant land for another country, we must strive for a better future."

