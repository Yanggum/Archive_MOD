l_english: 
 IDC_tirailleurs_reformed_flag: "보병대가 [ROOT.GetAdjective]군으로 재편됨"
 IDC_tirailleurs: "보병대"
 IDC_tirailleurs_desc: "보병대는 프랑스령 인도차이나 연방 창설 직후 1884년에 설립된 헌병대이자 군대입니다. 장교진은 프랑스인이나 용병으로 완전히 유럽인들이며, 일반 병사들은 대부분 [ROOT.GetAdjective] 현지인들입니다. 이들은 전투에 매우 효과적이지만, 차별과 부실한 관리로 인해 큰 불만이 발생하고 있습니다."
 modify_IDC_tirailleurs_tt: "§Y$IDC_tirailleurs$§! 변동치:"

 IDC_amry_modifier: "[ROOT.GetAdjective]군"
 modify_IDC_amry_modifier_tt: "§Y$IDC_amry_modifier$§! 변동치:"

 IDC_french_colonial_authorities: "프랑스 식민당국"
 IDC_united_nations_trusteeship: "국제연합의 위임통치"
 IDC_indochina_companies_localization: "인도차이나 회사 현지화"
 IDC_infrastructure_development: "기반시설 개발"
 IDC_resource_development: "자원 개발"
 IDC_indochina_infantry_expansion: "인도차이나 보병대 확충"
 IDC_infantry_modernization: "보병대 현대화"
 IDC_jungle_warfare: "정글 전투"
 IDC_fortress_self_reliance_against_japan: "일본에 맞설 요새 자립"
 IDC_french_military_technology_transfer: "프랑스 군기술 이전"
 IDC_indochina_independent_national_army: "독립 가능한 인도차이나 군"

 IDC_establish_the_anc_modifier_tt: "§R인도차이나 보병대 관련 중점을 더 이상 수행할 수 없게 됩니다§!"
 IDC_establish_the_anc_locking_tt: "§Y인도차이나 보병대§! 국민정신을 제거하고 §Y[ROOT.GetAdjective]군§!으로 대체하며, 이전에 얻은 보너스의 절반을 유지합니다."
 IDC_establish_the_anc: "[ROOT.GetAdjective]군 창설"
 IDC_establish_the_anc_desc: "우리의 많은 요구들이 마침내 충족되었습니다. 오늘은 우리가 제대로 된 [ROOT.GetAdjective] 군대를 구성하게 된 날이며, 이 군대는 앞으로 마주칠 수 있는 어떤 적에 대해서도 당당히 맞설 수 있을 것입니다."
 IDC_marine_nationale: "국립 해군"
 IDC_marine_nationale_desc: "우리가 이전에 제대로 투자한 적은 없긴 하지만, 대부분의 현대 국가들에는 해군이 필요합니다. 다만 해군의 목적이 남태평양으로 병력을 수송하기 위한 것인지, 아니면 인근 강과 연안에서 더 효과적으로 작전을 수행하기 위한 것인지 정해야 합니다."
 IDC_expand_shipping_industry: "해운업 확장"
 IDC_expand_shipping_industry_desc: "우리나라의 많은 지역들은 항공이나 강을 통하지 않으면 접근하지 어렵습니다. 또한 바다 건너 외국과의 연결도 중요하기에, 조선업을 확장해 우리의 현대화중인 나라의 요구를 충족해야 합니다."
 IDC_south_atlantic_navy: "남태평양 해군"
 IDC_south_atlantic_navy_desc: "우리의 독립을 제대로 지켜내고자 한다면, 식민 세력들이 다시는 우리의 해안가에 상륙할 수 없도록 해야 합니다."
 IDC_brown_water_navy: "연안해군"
 IDC_brown_water_navy_desc: "드넓은 대양은 우리의 관심사 밖입니다. 하지만 국가의 안보를 지키기 위해서는 우리의 넓은 강과 호수 그리고 연안을 효과적으로 순찰해야 합니다."
 IDC_coastal_defence_fleet: "연안방어 함대 개발"
 IDC_coastal_defence_fleet_desc: "우리의 해안을 제대로 방어해야 합니다. 그리고 이는 오직 해안에 밀착하여 활동할 수 있는 강력한 연안 방어 함정을 건조함으로써 달성할 수 있습니다."
 IDC_supply_line_disruption_tactics: "보급선 교란 전술"
 IDC_supply_line_disruption_tactics_desc: "적의 보급선은 단 한번의 정교한 타격으로도 붕괴할 수 있습니다. 우리의 잠수함들이 이를 수행할 것이며, 이는 우리가 미래에 수행할 전쟁에 핵심적인 역할을 맡게 될 것입니다."
 IDC_force_arienne_congolaise: "[ROOT.GetAdjective] 공군"
 IDC_force_arienne_congolaise_desc: "우리의 적들을 제대로 따라잡기 위해서, 우리는 항공 전력을 재편성하고 새롭게 창설된 군대 내에 정식 공군 부대를 설립해야 합니다."
 IDC_procure_foriegn_equipment: "외국 장비 도입"
 IDC_procure_foriegn_equipment_desc: "우리는 자체적으로 항공기를 개발하고 생산할 기술적 노하우나 산업 기반이 부족하기에, 동맹국들의 설계를 빌리거나 항공기를 구매하는 데 집중하는 것이 현명할 것입니다."
 IDC_aeronautical_research_department: "항공연구부"
 IDC_aeronautical_research_department_desc: "항공은 우리가 집중적으로 투자를 했던 분야는 아니지만, 외세에 너무 많이 의존해서는 안 되는 분야인 점을 잊어서는 안 됩니다. 비용이 많이 들더라도 우리만의 항공기를 개발하고 생산하기 위한 노력이 필요합니다."
 IDC_scouting_the_terrain: "지형 정찰"
 IDC_scouting_the_terrain_desc: "우리의 광활한 정글은 지역 횡단을 어렵게 만들 뿐만 아니라, 적이 주요 도시 가까이 접근하기 전에 그들을 발견하기 어렵게 만듭니다. 따라서 공군이 공중 정찰 임무에서 큰 역할을 수행해야 할 것입니다."
 IDC_expand_production_facilities: "생산 시설 확장"
 IDC_expand_production_facilities_desc: "우리는 군사 장비의 생산을 늘려야 하며, 이를 위한 유일한 방법은 이것이 가능한 새로운 시설들을 건설하는 것입니다."
 IDC_forces_terrestres: "영토방위군"
 IDC_forces_terrestres_desc: "어떤 군대든 가장 중요한 요소는 지상 전력이며, 우리 군의 현황은 아직 부족한 점이 많습니다. 이에 투자하여, 우리의 적들과 맞서 당당히 설 수 있도록 해야 합니다."
 IDC_from_a_gendarmerie_to_a_fighting_force: "민병대에서 전투단으로"
 IDC_from_a_gendarmerie_to_a_fighting_force_desc: "인도차이나 보병대라는 우리의 기원을 떠나 헌병대 같은 느낌을 줄이고 제대로 된 군대로 보이도록 군을 재설계할 때가 되었습니다."
 IDC_academie_militaire_de_kananga: "[ROOT.Capital.GetName] 사관학교"
 IDC_academie_militaire_de_kananga_desc: "일반 병사 뿐만 아니라 장교와 장군들 역시 훈련이 필요합니다. [ROOT.Capital.GetName] 사관학교에 투자해 우리 군대가 추후 임무 수행을 더 잘 할 수 있게 교육해야 합니다."
 IDC_standardize_military_production: "군 생산 표준화"
 IDC_standardize_military_production_desc: "외국산 장비와 국내산 장비가 뒤죽박죽 섞여있는 현 상황 속에서, 우리의 군수산업은 필요한 장비를 빠르게 생산하지 못하고 있습니다. 군대가 사용하는 장비를 표준화해야 합니다."
 IDC_societe_africaine_dexplosifs_congo: "인도차이나 탄약 회사"
 IDC_societe_africaine_dexplosifs_congo_desc: "우리만의 무기를 제작하는데 필요한 또 다른 것은 우리 국경 내부에서 우리의 요구를 충족시킬 수 있는 국영 기업입니다. 그런 측면에서 우리는 오직 우리에게만 탄약을 제공할 수 있도록 인도차이나 탄약 회사를 수립해야 합니다."
 IDC_triga_i_project: "핵무장 계획"
 IDC_triga_i_project_desc: "에너지의 미래는 원자력에 있으며, 이에 따라 우리 과학자들은 인도차이나 최초의 원자력 발전소 건설에 매진해 왔습니다. 이 목표가 달성되면, 우리의 필요에 따라 이 에너지를 군사적 목적으로 재활용할 수 있을 것입니다."
 IDC_military_service_for_citizenship: "시민권을 위한 군 복무"
 IDC_military_service_for_citizenship_desc: "우리 나라에는 시민권이나 여권을 가지지 못한 사람들이 많습니다. 따라서 로마인들이 했던 것처럼 일정 기간 동안 우리 군대에 복무한 사람들에게 시민권을 제공해야 하며, 이를 통해 새로운 잠재적 지원자들을 유치할 수 있을 것입니다."
 IDC_guerilla_tactics_drills: "게릴라 전술 훈련"
 IDC_guerilla_tactics_drills_desc: "우리 지형은 치고 빠지는 전술에 적합합니다. 따라서 우리는 병사들이 이 전술에 통달할 수 있게 하여, 만나는 모든 적들을 물리칠 수 있게 해야 합니다."
 IDC_french_as_martial_language: "군대의 프랑스어"
 IDC_french_as_martial_language_desc: "전통적으로 인도차이나 지휘 계통들은 프랑스어를 주 언어로 사용해왔습니다. 이는 좋은 방법이라는 것이 증명되었기에, 이를 바꿔야 할 이유는 없습니다."
 IDC_adopt_lingala_and_swahili_as_martial_languages: "군대의 현지어"
 IDC_adopt_lingala_and_swahili_as_martial_languages_desc: "전통적으로 인도차이나의 보병대를 비롯한 지휘 계통은 프랑스어를 주 언어로 사용해왔지만, 우리는 전 지배자들로부터 선을 두고 제국주의의 잔재를 소탕하고 우리의 현지어를 도입하기 위한 시도를 해야 합니다."
 IDC_31e_brigade_parachutiste: "공수여단 창설"
 IDC_31e_brigade_parachutiste_desc: "우리는 정착지를 신속히 점령하고 내부의 적들을 소탕할 수 있으며, 또한 국가 지도자가 위협받는 상황에서 그들을 보호하는 정예 경호대로도 활동할 수 있는 정예 공수부대를 창설해야 합니다."
 IDC_peacekeeping_forces: "평화유지군"
 IDC_peacekeeping_forces_desc: "전쟁의 화마는 현재 인도차이나를 휩쓸고 있지는 않지만, 세계 어딘가를 휩쓸고 있긴 합니다. 타국을 위해 이역만리 타지로 우리 병력을 보내는 한이 있더라도, 더 나은 미래를 위해 힘써야 합니다."