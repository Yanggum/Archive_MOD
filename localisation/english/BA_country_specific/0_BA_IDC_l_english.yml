 IDC_event.1.t: "[FROM.GetAdjective] Nationalists' Request for Support"
 IDC_event.1.desc: "[FROM.GetAdjective] nationalists are preparing for a war of independence against their rulers. Under the premise that we support their fight with weapons, they promise to stay close to us after winning the war, arguing that a weakened [FRA.GetName] would be in our interest."
 IDC_event.1.a: "Of course."
 IDC_event.1.b: "No reason to intervene."
 IDC_event.2.t: "[FROM.GetNameDefCap]'s Consent to Support"
 IDC_event.2.desc: "Our diplomats have returned after consulting with the [FROM.GetAdjective] military staff, and they have reached an agreement to provide us with manpower and equipment once we declare war against the oppressors. Today is a good day for the [ROOT.GetAdjective] people!"
 IDC_event.2.a: "Perfect."
 IDC_event.3.t: "[FROM.GetNameDefCap]'s Refusal of Support"
 IDC_event.3.desc: "Our diplomats have returned empty-handed after consulting with the [FROM.GetAdjective] military staff. No agreement could be reached, and those we believed to be allies have betrayed us..."
 IDC_event.3.a: "Regrettable."

 IDC_event.4.t: "[FROM.GetAdjective]'s Request for Industrial Aid"
 IDC_event.4.desc: "Having achieved independence, [FROM.GetAdjective] has requested industrial aid from us. Emphasizing that Indochina's infrastructure is poor and lacking in industrial experts, they proposed future cooperation such as influence projection and installation of military facilities in the region, and requested that we dispatch industrial experts to their country."
 IDC_event.4.a: "Of course."
 IDC_event.4.b: "We have no interest in that region."
 IDC_event.5.t: "[FROM.GetNameDefCap]'s Consent to Support"
 IDC_event.5.desc: "Our diplomats, after searching for [FROM.GetAdjective] industrial experts and diplomats, have secured a commitment for investment in our nation. This is an opportunity to supplement our country's lack of experts and obtain high-quality steel resources!"
 IDC_event.5.a: "Good."
 IDC_event.6.t: "[FROM.GetNameDefCap]'s Refusal of Support"
 IDC_event.6.desc: "Our diplomats have returned empty-handed after consulting with [FROM.GetAdjective] representatives. No agreement could be reached, and they do not seem interested in industrial investment in our region."
 IDC_event.6.a: "Regrettable."

