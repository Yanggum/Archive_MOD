 #시리아 이벤트
 SYR_event.1.t: "Independence"
 SYR_event.1.d: "When most of the French troops stationed throughout Syria returned to their homeland to fight entities from another world, the Syrians acted!\n\nWorkers, peasants, entrepreneurs, religious figures, and intellectuals joined forces to drive out the imperialist oppressors. Despite many sacrifices, and building upon the failures of the 1920 independence attempt and the three-year Druze revolt, overcoming the suspension of the constitution in '33, the last French troops have finally withdrawn from Syria, achieving final independence. Syrians are cheering, and civil society is busy envisioning a new nation!"
 SYR_event.1.a: "Long live Liberated Syria!"
 SYR_event.2.t: "[SYR.getname]'s Request for Economic Aid"
 SY_event.2.d: "The [SYR.getname] government, having just escaped French colonial rule, has sought out our Soviet Union—the vanguard of the anti-imperialist movement—to support its economic growth immediately following liberation."
 SYR_event.2.a: "Let's help them."
 SYR_event.2.b: "We're busy ourselves."
 SYR_event.3.t: "Economic Aid from the Soviet Union"
 SYR_event.3.d: "The Soviet Union has decided to accept our request for aid."
 SYR_event.3.a: "Thank you."
 SYR_event.4.t: "Syria's Request for Industrial Support"
 SYR_event.4.d: "The [SYR.getname] economic departments have requested our support for their economy. In exchange for helping their industry, we might be able to get what we want from them."
 SYR_event.4.a: "Sounds intriguing."
 SYR_event.4.b: "Cooperation with them is unnecessary."
 SYR_event.5.t: "[FROM.getname]'s Acceptance"
 SYR_event.5.d: "The [FROM.getname] government has responded to our request for support. However, we must pay the price they demand."
 SYR_event.5.a: "Thank you."
 SYR_event.6.t: "[FROM.getname]'s Refusal"
 SYR_event.6.d: "The [FROM.getname] government has rejected our request for support."
 SYR_event.6.a: "A pity."
 SYR_event.7.t: "Land Reform"
 SYR_event.7.d: "Moderates and radicals are divided over the progression of land reform. The moderate faction of our party proposes completing the first phase of land reform by distributing land to the peasants first, and then implementing agricultural collectivization later when productivity is sufficiently supported. On the other hand, the radical faction expresses concern that the emergence of such independent farmers could promote unstable petty-bourgeois sentiments among the working masses, potentially leading to counter-revolution, and calls for radical agricultural collectivization."
 SYR_event.7.b: "Let's distribute the land."
 SYR_event.7.a: "Let's move toward collective agriculture!"
 SYR_event.8.t: "Free Elections"
 SYR_event.8.d: "To lead Syria, which has recently gained independence from France, 200 Syrians of all professions and classes have been elected from each constituency. They come from diverse backgrounds, ranging from traditional elites such as religious figures, professors, civil servants, and landowners to those considered lower class, such as union members, students, and the poor.\n\n The faction that holds the majority in the People's Council will be able to define and declare the future of Syria. Accordingly, each party was preparing its own actions, but the National Bloc, which led the Syrian Independence Treaty and organized the previous strikes, took power with high approval ratings!"
 SYR_event.8.a: "Long live the Syrian Republic!"
 SYR_event.9.t: "Direct Action"
 SYR_event.9.d: "Syria's workers, peasants, the poor, students, and intellectual masses have all gone on strike at once. The streets are crowded with rallies, and public facilities have been simultaneously occupied by protesters through planned raids.\n\n The Communist Party of Syria and Lebanon has declared that it will actively accept the demands of the working masses in the National Council and reorganize society into a liberated socialist Syria."
 SYR_event.9.a: "It is a revolution!"
 SYR_event.10.t: "[FROM.getname] Swears Allegiance to the Crown!"
 SYR_event.10.d: "[FROM.GetAdjective] has sworn allegiance to our Royal Family."
 SYR_event.10.a: "Thank you."
 SYR_event.11.t: "Request to Join the Commonwealth"
 SYR_event.11.d: "A request to join the Commonwealth has arrived from [FROM.getname]."
 SYR_event.11.a: "Let's accept those loyal souls."
 SYR_event.11.b: "They are not ready."
 SYR_event.12.t: "[FROM.getname]'s Refusal"
 SYR_event.12.d: "Our proposal was rejected."
 SYR_event.12.a: "A pity."
 SYR_event.13.t: "Syrian General Strike"
 SYR_event.13.d: "It is becoming evident that the colonial rule in Syria and Lebanon, which has lasted for over ten years, can no longer continue. The streets have long been paralyzed by the Syrian general strike, and the Syrian garrison is suffering significant losses. To make matters worse, the Syrian general strike is leading to sympathetic strikes and solidarity rallies in neighboring Arab countries, forming significant political movements in Palestine, Lebanon, Jordan, and elsewhere.\n\n His Excellency the Marshal knows very well that such a confrontation does not serve France's national interests. For the sake of France, he is ready to dress neatly and engage in open dialogue with Syria."
 SYR_event.13.a: "A step back to take two steps forward."
 SYR_event.14.t: "Resignation of [SYR_mehemed_ali_abed.getname]"
 SYR_event.14.d: "[SYR_mehemed_ali_abed.getname], who served as President for about four years, was sometimes criticized for being too conciliatory in diplomacy with France, but it is clear that he is one of our beloved independence activists. He announced his resignation from the presidency to help create a new regime after independence. Since the Free Assembly has placed its trust in [SYR_hashim_al_atassi.getname], who planned and directed the Syrian general strike, it has been decided that he will succeed him as President."
 SYR_event.14.a: "Welcome the new President."
 SYR_event.15.t: "Uprising"
 SYR_event.15.d: "Weak parliamentary democracy is no longer a consideration for us. A brave and awakened officer corps, in cooperation with the Social Nationalist Party, raided the capital. There was some resistance, but it was all neutralized, and finally, power was seized. However, it remains to be seen whether the rural areas will tolerate these actions of ours!"
 SYR_event.15.a: "Long live the Uprising!"
 SYR_event.16.t: "Friendship with the West"
 SYR_event.16.d: "Though independent, we still stand on a precarious path where we must defend democracy against the threats of communism and fascism. Cooperation with the West is for the sake of defending the democratic system, even before national sentiment!"
 SYR_event.16.a: "Will the people understand this?"
 SYR_event.17.t: "Request to Purchase Cyprus"
 SYR_event.17.d: "A request has come from [FROM.getname] to purchase Cyprus."
 SYR_event.17.a: "It's a good deal."
 SYR_event.17.b: "How rude."
 SYR_event.18.t: "[FROM.getname]'s Ultimatum"
 SYR_event.18.d: "The [FROM.GetAdjective] government has sent an ultimatum demanding our southeastern territories. While this is mostly Kurdish territory, it is a clear violation of sovereignty!"
 SYR_event.18.a: "Nothing is more valuable than peace."
 SYR_event.18.b: "How rude!"
 SYR_event.19.t: "Coup!"
 SYR_event.19.d: "A fascist officer corps, presumably instigated by [SYR.getname], has launched a coup."
 SYR_event.19.a: "Long live New Iraq!"
 SYR_event.19.b: "Stop them!"
 SYR_event.20.t: "Shattered Class Cooperation"
 SYR_event.20.d: "The idea of reforming a Free Syria while maintaining class cooperation under the banner of democracy was a naive and idealistic delusion. The bond is broken, and solidarity has collapsed. Different factions are rising up in the provinces!"
 SYR_event.20.a: "Damn it!"
 SYR_event.20_tt_1: "You can continue toward Communism by completing the focus §Y$SYR_focus_dem_9$§!\n"
 SYR_event.20.b: "There's a reason they call it class struggle."
 SYR_event.21.t: "[FROM.getname]'s Trade Agreement Proposal"
 SYR_event.21.d: "The [FROM.GetAdjective] government has proposed that we sign a trade agreement."
 SYR_event.21.a: "Sounds intriguing."
 SYR_event.21.b: "Why should we?"
 SYR_event.22.t: "[SYR.getname]'s Proposal for Unification"
 SYR_event.22.d: "Our Syrian comrades, who have endured colonial rule together with us for a long time, have proposed unification."
 SYR_event.22.a: "We are brothers!"
 SYR_event.22.b: "This is nothing but expansionism."
 

 #시리아 중점
  #정치 중점
 SYR_focus_dom_0: "Syrian General Strike"
 SYR_focus_dom_0_desc: "We have seized the opportunity. Under the leadership of the National Bloc, shops have bolted their doors and workers have emptied their hands. Nothing is being produced, and the government is paralyzed!"
 SYR_focus_dom_1: "Evolution"

 SYR_focus_0: "Meeting with the French"
 SYR_focus_0_desc: "We must realize that a hardline confrontation solves nothing. The rapid changes in the situation in France will provide us with a favorable high ground in negotiations."
 SYR_focus_1: "Pragmatic End to Hostilities"
 SYR_focus_1_desc: "Even if it is an imperialist regime, cooperation with the West is essential for the maintenance of democracy. To preserve Western liberalism, we must temporarily halt hostilities."
 SYR_focus_2: "Reconstruction Authority"
 SYR_focus_2_desc: "During the past strike period, Syrian industry suffered great damage. The Reconstruction Authority will work to increase efficiency across the entire economy."
 SYR_focus_3: "Distribution of French Property"
 SYR_focus_3_desc: "We must distribute the property of the French who exploited us."
 SYR_focus_4: "Anti-Imperialist Solidarity"
 SYR_focus_4_desc: "We never know when invaders might strike again. Anti-imperialist solidarity with the Soviet Union will protect us from the aggression of great powers."
 SYR_focus_5: "Support for Commerce and Industry"
 SYR_focus_5_desc: "We must nurture the seeds of capitalism."
 SYR_focus_6: "Regional Defense Plan"
 SYR_focus_6_desc: "We have grabbed independence, but our borders are far too unstable. We need to temporarily arm ourselves rapidly."
 SYR_focus_7: "Arming the Workers"
 SYR_focus_7_desc: "By putting weapons directly into the hands of workers, we can secure more defense units."
 SYR_focus_8: "Officer Control"
 SYR_focus_8_desc: "We must deploy useful officers to nurture a regular army."
 SYR_focus_9: "Constitutional Reform"
 SYR_focus_9_desc: "We will re-enact the 1933 Constitution that was previously suspended."
 SYR_focus_10: "Freedom of Expression"
 SYR_focus_10_desc: "By guaranteeing the freedom of political activity, we can soothe the grievances of many political factions."
 SYR_focus_12: "Co-opting the Officer Corps"
 SYR_focus_12_desc: "There are many young officers in the military loyal to the Social Nationalist Party. We can prepare for a seizure of power by co-opting them."

 SYR_focus_dem_0: "Cooperation by Class"
 SYR_focus_dem_0_desc: "The core of republicanism is pluralistic cooperation toward the public good. Different social classes must reach out to one another toward a single goal set above the community."
 SYR_focus_dem_1: "Preferential Treatment for Merchants"
 SYR_focus_dem_1_desc: "Merchants have traditionally been active in the Middle East. Simply by giving them preferential treatment, we can move closer to a capitalist economy."
 SYR_focus_dem_2: "Modern Finance"
 SYR_focus_dem_2_desc: "Finance is—another god. We must actively utilize this system that allows us to concentrate funds, large and small, into major projects."
 SYR_focus_dem_3: "Alliance with Landowners"
 SYR_focus_dem_3_desc: "Partnering with landowners, who traditionally cooperated with France and exert great local political influence, will strengthen our political reach."
 SYR_focus_dem_4: "Landowner Protection Law"
 SYR_focus_dem_4_desc: "As much as we guarantee the interests of the landowners, they will not interfere with the plans we intend to pursue on their vast estates."
 SYR_focus_dem_5: "Syrian Republicanism"
 SYR_focus_dem_5_desc: "We will make our own republican thought bloom in the Near East."
 SYR_focus_dem_6: "Patronage of Liberal Intellectuals"
 SYR_focus_dem_6_desc: "We need a class that can lead modernization from among the masses."
 SYR_focus_dem_6_tt: "£GFX_syria_intellect_texticon §YIntellectuals§!: Join the Government"
 SYR_focus_dem_7: "Expansion of Women's Rights"
 SYR_focus_dem_7_desc: "The more women enter the industrial workplace, the faster our development will repeat."
 SYR_focus_dem_8: "Support for Entrepreneurs"
 SYR_focus_dem_8_desc: "Entrepreneurs are the true patriots of this era. By encouraging their investment, we can further grow our industry."
 SYR_focus_dem_9: "Labor Charter"
 SYR_focus_dem_9_desc: "We already know how terrible the industrial sites of the early 18th century were. To keep Syria from becoming communist, we need to accept some of the workers' demands."
 SYR_focus_dem_10: "Modern State"
 SYR_focus_dem_10_desc: "We will no longer remain in a conservative Islamic-colonial society."
 SYR_focus_dem_11: "Active Neutrality"
 SYR_focus_dem_11_desc: "In the Venetian Federal Arsenal, it is engraved: 'Happy is the city that thinks of war even in times of peace.'"
 SYR_focus_dem_12: "International Cooperation"
 SYR_focus_dem_12_desc: "We must step onto the international stage and partner with major powers."
 SYR_focus_dem_13: "Mediterranean Trade Agreement"
 SYR_focus_dem_13_desc: "Large-scale trade through the Mediterranean is a very attractive prospect for us."
 SYR_focus_dem_14: "Exchange via the Black Sea"
 SYR_focus_dem_14_desc: "We must utilize the Soviet Union's overflowing resources cheaply to promote industry."
 SYR_focus_dem_15: "Middle East Cooperation"
 SYR_focus_dem_15_desc: "We must coordinate relations with neighboring countries."
 SYR_focus_dem_16: "Discussions on Integration with Lebanon"
 SYR_focus_dem_16_desc: "We are ready to welcome our comrades who stood against French colonialism together with us."
 SYR_focus_dem_17: "Torch of Democracy in the Near East"
 SYR_focus_dem_17_desc: "We need to liberate Middle Eastern countries still stuck in antiquated systems under the torch of democracy."
 SYR_focus_dem_17_tt: "\nAll §gnon-democratic§! nations in the §YMiddle East§!:" 


 SYR_focus_fas_0: "Street Parade"
 SYR_focus_fas_0_desc: "We will occupy the capital together with the citizens."
 SYR_focus_fas_1: "General Uprising"
 SYR_focus_fas_1_desc: "We will seize the government buildings with a swift night raid and declare a new government."
 SYR_focus_fas_2: "Implementation of One-Party Dictatorship"
 SYR_focus_fas_2_desc: "We are the fascist movement of the Middle East."
 SYR_focus_fas_3: "Nationalist Ideology"
 SYR_focus_fas_3_desc: "The notion of a Syrian nation must be placed above any religion or ideology."
 SYR_focus_fas_4: "National Defense State"
 SYR_focus_fas_4_desc: "The militarization of the entire nation is the cornerstone of a strong state."
 SYR_focus_fas_5: "Wartime Industry"
 SYR_focus_fas_5_desc: "We must prepare for war."
 SYR_focus_fas_6: "Anti-Western Propaganda"
 SYR_focus_fas_6_desc: "The Western imperialists have taken much from us. We will take back even more."
 SYR_focus_fas_7: "Overseas Fascist Alliance"
 SYR_focus_fas_7_desc: "We will stand in solidarity with our fascist comrades abroad."
 SYR_focus_fas_7_tt: "A significant alliance"
 SYR_focus_fas_8: "Middle Eastern Hegemony"
 SYR_focus_fas_8_desc: "To take the first step on the road toward Greater Syria, we must compete with neighboring countries for hegemony in the Middle East."
 SYR_focus_fas_9: "Purchase of Cyprus"
 SYR_focus_fas_9_desc: "It is self-evident that Cyprus culturally belongs to Syria. We will demand it peacefully."
 SYR_focus_fas_10: "Partition of Turkey"
 SYR_focus_fas_10_desc: "Southeastern Turkey clearly falls within the Syrian sphere."
 SYR_focus_fas_11: "Greater Syrian War of Unification"
 SYR_focus_fas_11_desc: "We will launch a general offensive against the nations of the southern Levant."
 SYR_focus_fas_12: "Support for Iraqi Coup"
 SYR_focus_fas_12_desc: "We will support the fascist movement in Iraq and reclaim our territory in return."
 SYR_focus_fas_13: "Global Fascist Industrial Cooperation"
 SYR_focus_fas_13_desc: "We will achieve mutual aid through industrial links with our allies."
 SYR_focus_fas_14: "A Single and United Syria!"
 SYR_focus_fas_14_desc: "Greater Syria is complete. Under a single and united Syria stand the Motherland and the Social Nationalist Party, and the Syrian people. Long live Greater Syria!"

 SYR_revolution_to_lebanon: "Pressure on [LEB.getadjective]"
 SYR_revolution_to_lebanon_desc: "Lebanon originally shared an administrative district with Syria. We need to force our ideology upon them."
 SYR_focus_com_0: "Eve of Revolution"
 SYR_focus_com_0_desc: "We must rally the armed workers and devise a plan to bring down capitalism, which is an extension of exploitation and plunder."
 SYR_focus_com_1: "Party Merger"
 SYR_focus_com_1_desc: "We must merge with the Communist Party of Syria to achieve efficient administration."
 SYR_focus_com_2: "Oppression of the Bourgeoisie"
 SYR_focus_com_2_desc: "Unjustly accumulated wealth must be returned to the state."
 SYR_focus_com_3: "Leadership of the Vanguard Party"
 SYR_focus_com_3_desc: "The Syrian masses are still immature. Under the leadership of the vanguard party, they can learn socialism and move toward liberation."
 SYR_focus_com_4: "Flexible Religious Policy"
 SYR_focus_com_4_desc: "There seems to be no need to suppress freedom of religion."
 SYR_focus_com_5: "Red Modernization"
 SYR_focus_com_5_desc: "We must accelerate industrialization to catch up with the advanced nations. As they say in the Red Winter Office, 'Labor is the highest honor!'"
 SYR_focus_com_6: "Bureaucratic Organization"
 SYR_focus_com_6_desc: "A modern bureaucracy will bring administrative efficiency."
 SYR_focus_com_7: "Land Reform"
 SYR_focus_com_7_desc: "Tearing down the old fences to build a new future. Every student—err, peasant—deserves their own piece of the dream!"
 SYR_focus_com_8: "Cultivating the Intellectual Class"
 SYR_focus_com_8_desc: "Building schools and training thinkers. We need more than just muscle; we need the brightest minds to ensure the revolution never wavers."
 SYR_focus_com_9: "People's Liberation Front"
 SYR_focus_com_9_desc: "We need an army that serves socialism, not an independent military."
 SYR_focus_com_10: "Syria-USSR Military Cooperation"
 SYR_focus_com_10_desc: "Joining the Comintern will protect us from colonialism."
 SYR_focus_com_11: "Workplace Councils"
 SYR_focus_com_11_desc: "We can no longer allow capitalists to supervise workers. Workers will temporarily organize councils to run the factories."
 SYR_focus_com_12: "Worker Self-Management"
