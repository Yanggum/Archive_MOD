 ##툴팁##
 SLO_vote_tt:0 "§Y슬로바키아§!에서 §Y총선거§!가 치뤄질 것입니다. §Y정당 인기도§!에 따라 §Y총선거§!의 결과는 달라질 것입니다.\n- §R공산주의§! 또는 §C민주주의§! 인기도가 §Y25% ~ 49%§!, §L파시즘§!의 인기도가 §Y50% 미만§! :\n§L파시즘§!에 맞서 §Y연립 내각§!을 구성할 것입니다.\n- §R공산주의§! 또는 §C민주주의§! 또는 §L파시즘§! 인기도가 §Y50% ~§! :\n§Y인기도에 부합하는 정당§!이 내각을 구성할 것입니다.\n- §R공산당§!이 §Y내각§!에 속할 경우 §L인민당§!이 §Y선거 결과§!에 §Y불복§!할 수도 있습니다."
 SLO_tt_1:0 "§Y체코인 망명자§! 국민정신의 기간이 §Y720일§! 연장됩니다. "
 SLO_tt_2:0 "§Y헝가리 압박§! 중점을 완료하지 않았거나, §Y[POL.GetAdjective]§! 측이 §Y[HUN.GetAdjective]§!와의 §Y단교§!를 받아들였습니다."
 POL_cut_of_HUN_no:0 "§Y[POL.GetAdjective]§!가 §Y[HUN.GetAdjective]§!와의 단교를 받아들이지 않았습니다."
 SLO_tt_3:0 "적어도 §Y한 개 이상§!의 국가와 §Y협정§!을 체결했습니다."
 SLO_tt_4:0 "§Y민간공장 1개§!가 우리 국가에 건설되었습니다.\n§R하지만, 슬로바키아 우리 국가에 더 많은 영향력을 행사할 것입니다.§!"
 SLO_tt_5:0 "§Y민간공장 3개§!가 180일간 우리 국가에 추가될 것입니다.\n§R하지만, 슬로바키아는 우리 국가에 더 많은 영향력을 행사할 것입니다.§!"
 SLO_tt_6:0 "§Y슬로바키아 노동자들§!이 360일간 우리 국가에서 노동을 할 것입니다.\n§R하지만, 슬로바키아는 우리 국가에 더 많은 영향력을 행사할 것입니다.§!"
 SLO_tt_7:0 "§Y슬로바키아의 영향력§!이 §Y70% 미만§!으로 내려가면 제거됩니다."
 SLO_tt_8:0 "\n§Y세력 회원국§!에게 §Y반헝가리 전선§! 조인 및 §Y헝가리 금수조치§! 요청"
 SLO_tt_9:0 "§Y[HUN.GetNameWithFlag]§!은 다음 경우에 해당할 때 요청을 수락할 확률이 높을 것입니다.\n - §Y[SLO.GetNameWithFlag]§!이/가 §Y[HUN.GetNameWithFlag]§!보다 병력이 많을 때\n - §Y[SLO.GetNameWithFlag]§!이/가 주요국일 때\n - §Y[SLO.GetNameWithFlag]§!이/가 §Y[ROM.GetNameWithFlag], [YUG.GetNameWithFlag], [POL.GetNameWithFlag]§!과 세력에 속해 있을 때\n - §R[HUN.GetNameWithFlag]이/가 주요국이거나 세력에 속해 있을 경우, 수락할 확률이 낮아질 것입니다.§!"
 SLO_tt_10:0 "§Y헝가리와의 전쟁§!을 개시했을 때:"
 SLO_tt_11:0 "§Y9개 보병 대대와 포병 지원§!으로 이루어진 §Y6개 사단§! 획득."
 SLO_tt_12:0 "§Y7개 보병 대대와 2개 포병 대대, 포병 지원§!으로 이루어진 §Y4개 정예 사단§! 획득."
 SLO_tt_13:0 "§L파시즘§! 인기도가 §Y50%§! 미만이면, §R국민들은 분노할 것입니다!§!"
 SLO_tt_add_5:0 "§Y해당 국가§!에 대한 영향력: §G+5%§!."
