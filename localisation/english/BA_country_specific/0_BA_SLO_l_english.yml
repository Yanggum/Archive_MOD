  SLO_pohotovostna_letka:0 "Pohotovostná letka"
  SLO_povazska_bystrica_plant:0 "Považská Bystrica Industrial Complex"
  SLO_dubnica_nas_vahom_plant:0 "Dubnica nad Váhom Industrial Complex"
  SLO_mio_trait_expanded_production_facilities:0 "Expanded Production Facilities"
  SLO_zts_martin_organization:0 "Turčianske strojárne"
  SLO_state_geological_institute:0 "Štátny geologický ústav"
  state_geological_institute:0 "National Geological Institute"
  SLO_develop_the_agrarian_economy:0 "Develop Agrarian Economy"
  SLO_develop_the_agrarian_economy_desc:0 "We must always have a realistic perspective when planning the future of our economy. The reality is that the Slovak economy is inherently an agrarian one, not an industrial one. However, this should not be seen as a disadvantage; rather, we should do our best to utilize this fact as our strength."
  SLO_pursue_industrialization:0 "Promote Industrialization"
  SLO_pursue_industrialization_desc:0 "Our economy, neglected for centuries, has not even achieved industrialization and has fallen behind due to the past oppression from Czechia and Hungary. Now that we have become an independent nation, we must rectify this injustice and invest all resources into ultimately bringing industrialization to Slovakia."
  SLO_finish_the_dubnica_nad_vahom_factory:0 "Complete Dubnica nad Váhom Factory"
  SLO_finish_the_dubnica_nad_vahom_factory_desc:0 "The military factory in Dubnica nad Váhom was being constructed by Skoda Works (Skoda Works Pilsen), but construction was halted due to our independence. We must complete the construction of this factory and make it the primary weapon source for our military."
  SLO_establish_the_state_geological_institute:0 "Establish National Geological Institute"
  SLO_establish_the_state_geological_institute_desc:0 "Mining in our land has historically flourished thanks to the Tatra Mountains and their natural resources, but it has declined since World War I. As part of efforts to revive it, we will establish the National Geological Institute under the patronage of Dimitrij Andrusov."
  SLO_expand_the_apollo_refinery:0 "Expand Apollo Refinery"
  SLO_expand_the_apollo_refinery_desc:0 "The refinery owned by the Apollo company in Bratislava was a key element of the city's industry, and its importance is growing further with the increase in oil demand in modern warfare. We must utilize our resources to expand the refinery and promote economic autonomy and self-sufficiency."
  SLO_slovak_academy_of_sciences_and_arts:0 "Slovak Academy of Sciences and Arts"
  SLO_slovak_academy_of_sciences_and_arts_desc:0 "Education in Slovakia was neglected by the Czechoslovak government, and even now, there is a lack of personnel and institutions required for modern technology research, causing us to fall behind other countries in terms of technological advancement. To respond to this situation, we will establish the Slovak Academy of Sciences and Arts."
  SLO_electrification:0 "Expand Electricity Grid"
  SLO_electrification_desc:0 "Our country still has poor electricity supply, and not all households are provided with electricity. We must improve this situation while focusing on the development of new technologies in the field of electronic devices. This will make all processes much easier."
  SLO_expansion_of_the_slovak_university:0 "Expand Slovak University"
  SLO_expansion_of_the_slovak_university_desc:0 "The Slovak University (formerly Comenius University) remains our country's largest higher education institution, and we must continue to expand it to improve the overall quality of education. We will establish new faculties, such as the Faculty of Science."
  SLO_connect_the_villages:0 "Connect Villages"
  SLO_connect_the_villages_desc:0 "To further increase the efficiency of the agrarian economy, we must focus on improving roads and railways connecting the villages. Improved roads will make it easier for people to transport and sell agricultural products nationwide, revitalizing the economy in the process."
  SLO_modernization_of_agriculture:0 "Mechanization of Agriculture"
  SLO_modernization_of_agriculture_desc:0 "Just like industrial technology, agricultural technology and methods are constantly evolving, and significant progress has been made in this field in recent years. We must introduce modern technology and undergo mass mechanization to keep our agriculture up to date."
  SLO_expand_agricultural_exports:0 "Expand Agricultural Exports"
  SLO_expand_agricultural_exports_desc:0 "As we have secured enough food for ourselves, it is essential to export agricultural products to neighboring countries to promote economic development and improve relations with other nations in the region."
  SLO_utilize_southern_farmlands:0 "Utilize Southern Farmlands"
  SLO_utilize_southern_farmlands_desc:0 "While most of our country is covered by the Tatra Mountains, making agriculture seem almost impossible, that is not actually the case. In particular, the southern region of our country near the Hungarian border has fertile agricultural land that can be utilized as a rich source of produce."
  SLO_new_steel_plants:0 "Erect Steelworks"
  SLO_new_steel_plants_desc:0 "By reorganizing the steelworks network and transitioning to new, modern steel plants, we can further accelerate heavy industry expansion. This will allow us to produce essential resources for our fledgling industrial economy."
  SLO_promote_urbanization:0 "Promote Urbanization"
  SLO_promote_urbanization_desc:0 "Bratislava has already received much attention since becoming the capital after independence, but a significant portion of our population still resides in small towns. We must change our policies to promote the growth of large cities, especially Bratislava, as densely populated industrial centers."
  SLO_grand_projects:0 "Large-Scale Projects"
  SLO_grand_projects_desc:0 "Achieving industrialization means more than just building a few factories. It means constructing large-scale steelworks, reorganizing the railway network, and establishing a diverse network of industrial factories that can produce everything from military to civilian goods. We must prepare our nascent industry for such undertakings."
  SLO_development_in_the_vah_valley:0 "Váh Valley Development"
  SLO_development_in_the_vah_valley_desc:0 "Many cities are located along the Váh River basin, with industries concentrated there, including major factories such as Považská Bystrica and Dubnica nad Váhom. The continuous development of this region is essential for our industrialization program."
  SLO_defense_law:0 "Defense Act"
  SLO_defense_law_desc:0 "Slovakia is facing a dangerous period, which means we must prepare our military and citizens for it. We will sign and enact a new Defense Act that defines the conscription age and the overall status of the military."
  SLO_military_high_school:0 "Military Academy"
  SLO_military_high_school_desc:0 "With the establishment of the Slovak Army, a Military Academy was established alongside it to train new staff for the nation, and many former Slovak military commanders from Czechoslovakia have joined us. We must support the Military Academy to increase the expertise of our staff and train a new generation of junior military commanders."
  SLO_lessons_of_war:0 "Lessons of War"
  SLO_lessons_of_war_desc:0 "We have sufficiently experienced what war is, and we have gained many important lessons from it. All these experiences can now be used to further refine and develop our strategy and improve military education."
  SLO_expand_the_military_industrial_complex:0 "Expand Military-Industrial Complex"
  SLO_expand_the_military_industrial_complex_desc:0 "The factories in Považská Bystrica and Dubnica nad Váhom are not far from each other and form a military-industrial complex along the Váh River. Due to their proximity, it is easier to improve coordination between the two factories and expand them jointly. That is exactly what we intend to do."
  SLO_study_foreign_weapons:0 "Study Foreign Weapons"
  SLO_study_foreign_weapons_desc:0 "The domestic weapon manufacturing industry is small, and our capability for independent weapon development is even more lacking, with a significant portion of our military still armed with old Czechoslovak weapons. Therefore, the best way to improve the situation is to learn from the cases of other more successful countries. We can purchase or request weapons produced by major powers for review."
  SLO_tatra_warriors:0 "Warriors of the Tatras"
  SLO_tatra_warriors_desc:0 "As Slovakia is a mountainous country, mountain warfare is not unfamiliar to us. We must create special forces within the military that can effectively fight in the mountains and defend the homeland from foreign invasions."
  SLO_learn_from_czechoslovak_tanks:0 "Learn from Czechoslovak Tanks"
  SLO_learn_from_czechoslovak_tanks_desc:0 "To develop mobile forces for our military, we must seek ways to surpass our predecessor, Czechoslovakia, which possessed independent tank development capabilities. We still possess a large number of Czechoslovak tanks, and the resources required to operate them and review them for future armored vehicle development are minimal."
  SLO_the_fast_division:0 "The Fast Division"
  SLO_the_fast_division_desc:0 "Since deploying a large army is almost impossible, we must concentrate our resources on creating at least one division, primarily composed of armored vehicles, that can create and exploit breakthroughs. This will be the Fast Division."
  SLO_labor_corps:0 "Penal Corps"
  SLO_labor_corps_desc:0 "The Penal Corps will be a part of our military composed of 'undesirable' members of our society, and they will be utilized to construct trenches and other military facilities at the front alongside the army."
  SLO_technical_divisions:0 "Technical Divisions"
  SLO_technical_divisions_desc:0 "We must reorganize several military units into so-called 'Technical Divisions'. These divisions will be utilized for various purposes, from maintenance and repair of combat vehicles to digging trenches. They will be the key to Slovak defense."
  SLO_establish_the_air_force:0 "Create Air Force"
  SLO_establish_the_air_force_desc:0 "We must consolidate the small aircraft inherited from Czechoslovakia to defend Slovak airspace and further create an independent air force capable of performing operations even far from the homeland."
  SLO_aviation_school:0 "Aviation School"
  SLO_aviation_school_desc:0 "Along with the birth of our air force, an institution for training new pilots, an Aviation School, must also be established. We will train the next generation of pilots by utilizing the experience of existing pilots (mostly from the '1,000 Pilots for the Republic' program of the Czechoslovak era)."
  SLO_anti_air_defenses:0 "Anti-Air Defenses"
  SLO_anti_air_defenses_desc:0 "If our air force alone is insufficient to defeat the invader's air power, we must establish a contingency plan for airspace defense. That contingency plan involves strategically placing fixed anti-aircraft guns across the country to effectively shoot down enemy aircraft."
  SLO_aircraft_production_at_dubnica_nad_vahom:0 "Aircraft Production at Dubnica nad Váhom"
  SLO_aircraft_production_at_dubnica_nad_vahom_desc:0 "The modern factory in Dubnica nad Váhom has already proven its capability for aircraft engine production, but our air force demands more. Part of the factory must be reconstructed for aircraft production. It will be expensive, but it will be worth it in the long run as we will no longer need to depend on foreign countries for air force supplies."
  SLO_emergency_squadron:0 "Emergency Squadron"
  SLO_emergency_squadron_desc:0 "There may be opportunities to use air power abroad, but we must be careful not to forget the defense of our own airspace. To this end, we will create a combat aircraft emergency squadron to monitor Slovak skies."
  SLO_close_air_support:0 "Close Air Support"
  SLO_close_air_support_desc:0 "We must develop and produce our own dive bombers to operate alongside our fighters on the battlefield and support the army. This will make the air force an essential element of combat."
  SLO_heavy_aircraft_development:0 "Heavy Aircraft Development"
  SLO_heavy_aircraft_development_desc:0 "With the growth of our industry, we cannot rule out the possibility of producing large aircraft models such as heavy fighters or strategic bombers. We will explore these ideas in depth and develop such aircraft models domestically."
