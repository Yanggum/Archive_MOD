l_english:
 SLO_GATHERING_STORM_DESC: "제1차 세계 대전에서 오스트리아-헝가리 제국이 패망하면서 천 년간 지속된 헝가리의 지배는 마침내 막을 내렸습니다.\n\n1935년 11월, 대전이와 함께 체코슬로바키아 공화국이 붕괴하며 슬로바키아인은 최초의 슬로바키아 독립국가를 가지게 되었으나 낙후된 농업경제와 슬로바키아 인민당 독재에 반항하는 민주주의의 목소리는 이 새로운 독립국가를 뒤흔들고 있습니다.\n\n슬로벤스코 첫 독립국가가 어떤 길을 갈지는, 하늘만이 알 것입니다."
 SLO_guide: "§Y목표§!\n\n£white_dot §0흘린카의 지도 하에 슬로바키아를 안정화하고 인민당의 미래를 결정하십시오.§!\n    £white_dot §4총선을 개최하고 슬로바키아에 민주주의를 다시 가져오십시오.§!\n        £white_dot §Y슬로바키아 민족당으로 공산당의 연정을 통해 독재를 몰아내십시오.§!\n            £white_dot §g보헤미아의 동포를 해방하고 체코슬로바키아를 부활시키십시오.§!\n            £white_dot §g폴란드와 헝가리와 함께 비셰그라드에서 회담을 가지고 통일을 논의하십시오.§!\n        혹은...\n        £white_dot §Y슬로바키아 공산당으로 민족당과의 연정을 통해 집권하여 코민테른에 가입하십시오.§!\n            £white_dot §g보헤미아의 동포를 해방하고 체코슬로바키아 사회주의 공화국을 설립하십시오.§!\n            £white_dot §g소련과 함께 다뉴브 지역을 해방하고 다뉴브 연방을 설립하십시오.§!\n    £white_dot §4슬로바키아 인민당 독재를 강화하고 흘린카의 영도 하에 슬로바키아의 영광으로 나아가십시오.§!\n        £white_dot §Y요제프 티소의 보수파를 지원해 슬로바키아의 안정을 위해 노력하십시오.§!\n            £white_dot §g기회를 틈타 보헤미아를 해방하고 슬로바키아 주도로 연방을 재건하십시오.§!\n            £white_dot §g폴란드와 협업해 서슬라브인을 통일하고 자파드슬로바니아를 형성하십시오.§!\n        혹은...\n        £white_dot §Y보이테흐 투카의 급진파를 지원해 슬로바키아 민족주의를 강화하십시오.§!\n            £white_dot §g보헤미아를 점령하고 체코인들을 동화하십시오.§!\n            £white_dot §g옛 대모라비아의 부활을 향해 주변 국가에 칼을 들이대십시오.§!\n\n\n§C개발- Jindoi, 민트쿤mintcoon§!"
 SLO_country_intro_header: "여명의 빛, 대모라비아의 메아리"
 SLO_country_intro_header_1: "천 년의 질곡, 헝가리의 그늘 아래서"
 SLO_country_intro_header_2: "새로운 희망, 체코슬로바키아의 탄생"
 SLO_country_intro_content: "슬로바키아 지역에 슬라브족이 정착하기 시작한 것은 5~6세기로 거슬러 올라갑니다. \n이들은 7세기경 프랑크족 상인 사모가 이끄는 최초의 슬라브 국가인 사모 제국을 형성하는 데 중심적인 역할을 했습니다. \n이후 9세기 초, 오늘날의 슬로바키아 서부 니트라를 중심으로 니트라 공국이 세워졌으며, 이는 곧 모라비아 공국과 통합하여 슬라브족 최초의 중앙집권국가인 대모라비아 왕국으로 발전했습니다.\n대모라비아 왕국은 현재의 체코와 슬로바키아, 헝가리 일부를 아우르는 광대한 영토를 다스렸습니다. \n특히 라스티슬라프 대공의 통치 기간에 비잔티움 제국에서 온 키릴로스와 메토디우스 형제 선교사의 활동은 슬로바키아 역사에 지대한 영향을 미쳤습니다. \n이들은 슬라브어로 예배를 드리고, 슬라브족 최초의 문자인 글라골 문자를 창제하여 독자적인 슬라브 문화와 기독교 신앙의 기틀을 마련했습니다. \n이는 훗날 슬로바키아 민족 정체성의 중요한 뿌리가 되었습니다. 그러나 10세기 초, 동쪽에서 침입해온 마자르족에 의해 대모라비아 왕국은 멸망하였고, 슬로바키아는 길고 험난한 새로운 역사의 장으로 접어들게 되었습니다."
 SLO_country_intro_content_1: "대모라비아 왕국의 붕괴 이후, 11세기부터 슬로바키아 영토는 약 천 년에 걸쳐 헝가리 왕국의 일부로 편입되었습니다. \n이 오랜 기간 동안 슬로바키아는 '고지 헝가리'로 불리며 헝가리 역사의 흐름 속에서 부침을 겪었습니다. \n13세기에는 몽골의 침략으로 국토가 황폐화되는 비극을 겪기도 했으나, 이후 광산 개발과 상업 발전을 위해 이주해 온 독일인들에 의해 점차 재건되었습니다. \n1526년, 헝가리가 모하치 전투에서 오스만 제국에 참패하면서 역사의 흐름은 또 한 번 바뀌게 됩니다. \n헝가리 영토 대부분이 오스만 제국의 지배를 받게 되자, 합스부르크 왕가가 통치하는 헝가리 왕국의 중심지가 슬로바키아 지역으로 이동했습니다. \n이에 따라 현재의 수도인 브라티슬라바(당시 포조니)는 약 300년간 헝가리 왕국의 수도 역할을 수행하며 정치, 문화의 중심지로 기능했습니다. \n1867년, 오스트리아-헝가리 제국이 수립되면서 헝가리는 내정에서 상당한 자치권을 확보하게 되었고, 이는 슬로바키아인들에게는 또 다른 시련의 시작이었습니다. \n헝가리 정부는 슬로바키아인들을 대상으로 강력한 마자르화 정책을 펼쳐 슬로바키아어 교육을 금지하고 민족 문화를 억압했습니다. \n하지만 이러한 탄압은 역설적으로 슬로바키아인들의 민족의식을 더욱 강하게 결집시키는 결과를 낳았습니다."
 SLO_country_intro_content_2: "제1차 세계 대전에서 오스트리아-헝가리 제국이 패망하면서 천 년간 지속된 헝가리의 지배는 마침내 막을 내렸습니다. \n1918년 10월 28일, 슬로바키아는 민족자결주의 원칙에 따라 언어와 문화적으로 유대가 깊었던 체코 민족과 손을 잡고 체코슬로바키아 공화국을 수립하며 새로운 역사의 장을 열었습니다. \n그러나 신생 독립국은 해결해야 할 과제들을 안고 있었습니다. \n체코 지역은 오스트리아의 지배하에서 상당한 공업 발전을 이룬 반면, 슬로바키아는 헝가리 통치하에서 농업 중심의 낙후된 상태에 머물러 있어 두 지역 간의 심각한 경제적 불균형이 존재했습니다. \n또한 오랜 헝가리화 정책으로 인해 고등 교육을 받은 슬로바키아 지식인층이 매우 부족하여, 국가의 주요 행정 및 교육 직책을 대부분 체코인들이 맡게 되면서 양 민족 간의 잠재적인 갈등 요인이 되기도 했습니다. \n그럼에도 불구하고 체코슬로바키아는 중부 유럽에서 민주주의를 성공적으로 정착시킨 안정적인 국가로 평가받았으며, 슬로바키아는 이 시기를 통해 정치, 경제, 문화적으로 성장할 수 있는 소중한 발판을 마련했습니다. \n1935년 11월, 대전이와 함께 체코슬로바키아 공화국이 붕괴하며 슬로바키아인은 최초의 슬로바키아 독립국가를 가지게 되었으나 낙후된 농업경제와 슬로바키아 인민당 독재에 반항하는 민주주의의 목소리는 이 새로운 독립국가를 뒤흔들고 있습니다.\n슬로벤스코 첫 독립국가가 어떤 길을 갈지는, 하늘만이 알 것입니다."
