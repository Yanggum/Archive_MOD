l_english:
  SLO_GATHERING_STORM_DESC: "With the collapse of the Austro-Hungarian Empire in World War I, a millennium of Hungarian rule finally came to an end.\n\nIn November 1935, following the Great Transition, the Czechoslovak Republic collapsed and the Slovaks gained their first independent state. However, the backward agricultural economy and democratic voices rebelling against the dictatorship of the Slovak People's Party are shaking this new nation.\n\nOnly the heavens know what path the first independent state of Slovensko will take."
  SLO_guide: "§YObjectives§!\n\n£white_dot §0Stabilize Slovakia under Hlinka's leadership and determine the future of the People's Party.§!\n    £white_dot §4Hold general elections and restore democracy to Slovakia.§!\n        £white_dot §YThe Slovak National Party: Oust the dictatorship through a coalition with the Communist Party.§!\n            £white_dot §gLiberate our compatriots in Bohemia and resurrect Czechoslovakia.§!\n            £white_dot §gMeet with Poland and Hungary in Visegrad to discuss unification.§!\n        Or...\n        £white_dot §YThe Communist Party of Slovakia: Take power through a coalition with the National Party and join the Comintern.§!\n            £white_dot §gLiberate our compatriots in Bohemia and establish the Czechoslovak Socialist Republic.§!\n            £white_dot §gLiberate the Danube region with the Soviet Union and establish the Danube Federation.§!\n    Or...\n    £white_dot §4Strengthen the Slovak People's Party dictatorship and march toward Slovak glory under Hlinka's leadership.§!\n        £white_dot §YSupport Jozef Tiso's conservatives and strive for the stability of Slovakia.§!\n            £white_dot §gSeize the opportunity to liberate Bohemia and reconstruct the federation under Slovak leadership.§!\n            £white_dot §gCollaborate with Poland to unify the West Slavs and form Zapadoslavia.§!\n        Or...\n        £white_dot §YSupport Vojtech Tuka's radicals and strengthen Slovak nationalism.§!\n            £white_dot §gOccupy Bohemia and assimilate the Czechs.§!\n            £white_dot §gPoint your sword at neighboring nations toward the revival of Old Great Moravia.§!\n\n\n§CDevelopers - Jindoi, mintcoon§!"
  SLO_country_intro_header: "Light of the Dawn, Echoes of Great Moravia"
  SLO_country_intro_header_1: "A Millennium of Hardship, Under the Shadow of Hungary"
  SLO_country_intro_header_2: "New Hope, The Birth of Czechoslovakia"
  SLO_country_intro_content: "The settlement of Slavic tribes in the Slovak region dates back to the 5th and 6th centuries. \nIn the 7th century, they played a central role in forming the Samo Empire, the first Slavic state led by the Frankish merchant Samo. \nSubsequently, in the early 9th century, the Principality of Nitra was established around Nitra in western modern-day Slovakia, which soon merged with the Principality of Moravia to develop into the Great Moravian Empire, the first centralized Slavic state.\nGreat Moravia ruled over vast territories encompassing present-day Czechia, Slovakia, and parts of Hungary. \nIn particular, during the reign of Prince Rastislav, the activities of the missionary brothers Cyril and Methodius from the Byzantine Empire had a profound impact on Slovak history. \nThey conducted services in the Slavic language and created the Glagolitic alphabet, the first Slavic script, laying the foundation for a unique Slavic culture and Christian faith. \nThis later became an important root of Slovak national identity. However, in the early 10th century, Great Moravia was destroyed by the invading Magyars from the east, and Slovakia entered a long and arduous new chapter of history."
  SLO_country_intro_content_1: "After the collapse of Great Moravia, the Slovak territories were incorporated as part of the Kingdom of Hungary for nearly a thousand years starting from the 11th century. \nDuring this long period, Slovakia was known as 'Upper Hungary' and experienced ups and downs within the flow of Hungarian history. \nIn the 13th century, it suffered the tragedy of being devastated by the Mongol invasion, but was gradually rebuilt by Germans who migrated for mining development and commercial progress. \nIn 1526, after Hungary suffered a crushing defeat against the Ottoman Empire at the Battle of Mohács, the course of history changed once again. \nAs most of the Hungarian territory fell under Ottoman rule, the center of the Habsburg-ruled Kingdom of Hungary moved to the Slovak region. \nConsequently, the current capital, Bratislava (then Pozsony), served as the capital of the Kingdom of Hungary for approximately 300 years, functioning as a political and cultural center. \nIn 1867, with the establishment of the Austro-Hungarian Empire, Hungary secured significant autonomy in internal affairs, which marked the beginning of another ordeal for the Slovaks. \nThe Hungarian government implemented a powerful Magyarization policy against the Slovaks, banning education in the Slovak language and suppressing national culture. \nHowever, paradoxically, this oppression resulted in a stronger consolidation of Slovak national consciousness."
  SLO_country_intro_content_2: "With the defeat of the Austro-Hungarian Empire in World War I, a millennium of Hungarian rule finally ended. \nOn October 28, 1918, Slovakia opened a new chapter of history by establishing the Czechoslovak Republic in partnership with the Czech nation, with whom it shared deep linguistic and cultural ties, based on the principle of national self-determination. \nHowever, the fledgling independent state faced several challenges. \nWhile the Czech region had achieved significant industrial development under Austrian rule, Slovakia remained in a backward, agricultural state under Hungarian rule, leading to a serious economic imbalance between the two regions. \nFurthermore, due to prolonged Magyarization policies, there was a severe lack of highly educated Slovak intellectuals, leading to Czechs occupying most major administrative and educational positions, which became a potential source of conflict between the two nations. \nDespite this, Czechoslovakia was evaluated as a stable democracy that successfully took root in Central Europe, and Slovakia established a precious foothold for political, economic, and cultural growth during this period. \nIn November 1935, with the collapse of the Czechoslovak Republic following the Great Transition, the Slovaks gained their first independent state, but the backward agricultural economy and democratic voices rebelling against the Slovak People's Party dictatorship are shaking this new nation.\nOnly the heavens know what path the first independent state of Slovensko will take."
