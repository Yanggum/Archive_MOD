  SLO_decisions_2:0 "Bratislava Economic Cooperation Organization"
  SLO_decisions_2_desc:0 "\nThe Bratislava Economic Cooperation Organization is a small international organization centered on Slovakia, composed of nations that have signed trade agreements with Slovakia.\n\n§YMember States:§!\n[SLO.GetNameWithFlag][SLO_in_a_rom][SLO_in_a_yug][SLO_in_a_pol][SLO_in_a_hun]\n\n§RThis organization can be beneficial, but it may also lead to the economy becoming dependent on Slovakia.§!\n"
