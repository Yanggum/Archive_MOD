  SLO_vote_tt:0 "A §YGeneral Election§! will be held in §YSlovakia§!. The result of the §YGeneral Election§! will vary depending on §YParty Popularity§!.\n- §RCommunism§! or §CDemocracy§! popularity between §Y25% ~ 49%§!, and §LFascism§! popularity §Ybelow 50%§! :\nWill form a §YCoalition Cabinet§! against §LFascism§!. \n- §RCommunism§! or §CDemocracy§! or §LFascism§! popularity at §Y50% ~§! :\n§YThe party matching the popularity§! will form the cabinet.\n- If the §RCommunist Party§! is part of the §YCabinet§!, the §LPeople's Party§! may §Yrefuse§! to accept the §Yelection results§!."
  SLO_tt_1:0 "The duration of the §YCzech Exiles§! national spirit is extended by §Y720 days§!. "
  SLO_tt_2:0 "The §YPressure Hungary§! focus has not been completed, or the §Y[POL.GetAdjective]§! side has accepted §YSeverance§! with §Y[HUN.GetAdjective]§!."
  POL_cut_of_HUN_no:0 "§Y[POL.GetAdjective]§! did not accept the severance with §Y[HUN.GetAdjective]§!."
  SLO_tt_3:0 "Signed an §YAgreement§! with at least §Yone§! country."
  SLO_tt_4:0 "§Y1 Civilian Factory§! has been built in our country.\n§RHowever, Slovakia will exercise more influence over our country.§!"
  SLO_tt_5:0 "§Y3 Civilian Factories§! will be added to our country for 180 days.\n§RHowever, Slovakia will exercise more influence over our country.§!"
  SLO_tt_6:0 "§YSlovak workers§! will work in our country for 360 days.\n§RHowever, Slovakia will exercise more influence over our country.§!"
  SLO_tt_7:0 "Removed if §YSlovak influence§! falls below §Y70%§!."
  SLO_tt_8:0 "\nRequest §YFaction Members§! to join the §YAnti-Hungarian Front§! and §YEmbargo Hungary§!"
  SLO_tt_9:0 "§Y[HUN.GetNameWithFlag]§! is likely to accept the request when:\n - §Y[SLO.GetNameWithFlag]§! has more troops than §Y[HUN.GetNameWithFlag]§!\n - §Y[SLO.GetNameWithFlag]§! is a Major Power\n - §Y[SLO.GetNameWithFlag]§! is in a faction with §Y[ROM.GetNameWithFlag], [YUG.GetNameWithFlag], [POL.GetNameWithFlag]§!\n - §RIf [HUN.GetNameWithFlag] is a Major Power or in a faction, the probability of acceptance will decrease.§!"
  SLO_tt_10:0 "When commencing §YWar with Hungary§!:"
  SLO_tt_11:0 "Gain §Y6 divisions§! consisting of §Y9 infantry battalions and artillery support§!."
  SLO_tt_12:0 "Gain §Y4 elite divisions§! consisting of §Y7 infantry battalions, 2 artillery battalions, and artillery support§!."
  SLO_tt_13:0 "If §LFascism§! popularity is below §Y50%§!, §Rthe citizens will be outraged!§!"
