SLO_develop_the_agrarian_economy:0 "농업 경제 발전"
SLO_develop_the_agrarian_economy_desc:0 "우리는 경제의 미래를 계획할 때 항상 현실적인 시각을 가져야 합니다. 현실은 슬로바키아 경제가 본질적으로 농업 경제이지 산업 경제가 아니라는 것입니다. 하지만 이를 단점으로 여겨서는 안 되며, 오히려 이 사실을 우리의 이점으로 활용하기 위해 최선을 다해야 합니다."
SLO_pursue_industrialization:0 "산업화 촉진"
SLO_pursue_industrialization_desc:0 "수세기 동안 방치되어 온 우리의 경제는 산업화조차 이루어지지 않고 과거 체코와 헝가리의 억압에 뒤처지는 안타까운 상황으로 이어졌습니다. 이제 우리는 독립 국가가 되었으므로, 이러한 불의를 바로잡고 궁극적으로 슬로바키아에 산업화를 가져오는 데 모든 자원을 투입해야 합니다."
SLO_finish_the_dubnica_nad_vahom_factory:0 "두브니차 나드 바홈 공장 완공"
SLO_finish_the_dubnica_nad_vahom_factory_desc:0 "두브니차 나드 바홈의 군수 공장은 슈코다 웍스(슈코다 웍스 필센)에서 건설 중이었지만, 우리의 독립으로 인해 공사가 중단되었습니다. 우리는 이 공장 건설을 완료하여 군대의 주요 무기 공급원으로 만들어야 합니다."
SLO_establish_the_state_geological_institute:0 "국립 지질학 연구소 설립"
SLO_establish_the_state_geological_institute_desc:0 "우리 땅의 광산업은 역사적으로 타트라 산맥과 그 천연자원 덕분에 발전해 왔지만, 1차 세계 대전 이후 쇠퇴해 왔습니다. 이를 되살리기 위한 노력의 일환으로, 드미트리 안드루소프의 후원 아래 국립 지질학 연구소를 설립할 것입니다."
SLO_expand_the_apollo_refinery:0 "아폴로 정유소 확장"
SLO_expand_the_apollo_refinery_desc:0 "브라티슬라바에 위치한 아폴로 회사 소유의 정유소는 도시 산업의 핵심 요소였으며, 현대전에서의 석유 수요 증가로 그 중요성이 더욱 커지고 있습니다. 우리는 자원을 활용하여 정유소를 확장하고 경제적 자립과 자급자족을 증진해야 합니다."
SLO_slovak_academy_of_sciences_and_arts:0 "슬로바키아 과학예술 아카데미"
SLO_slovak_academy_of_sciences_and_arts_desc:0 "슬로바키아의 교육은 체코슬로바키아 정부에 의해 소홀히 다루어졌으며, 지금도 현대 기술 연구에 필요한 인력과 기관이 부족하여 기술 발전 측면에서 다른 나라에 뒤처져 있습니다. 이러한 상황에 대응하기 위해 슬로바키아 과학예술 아카데미를 설립할 것입니다."
SLO_electrification:0 "전기 공급망 확대"
SLO_electrification_desc:0 "우리나라는 여전히 전기 공급이 열악하며, 모든 가구에 전기가 공급되는 것은 아닙니다. 우리는 이러한 상황을 개선하는 동시에 전자 기기 분야의 신기술 개발에 집중해야 합니다. 이를 통해 모든 과정이 더욱 수월해질 것입니다."
SLO_expansion_of_the_slovak_university:0 "슬로바키아 대학교 확장"
SLO_expansion_of_the_slovak_university_desc:0 "슬로바키아 대학교(구 코메니우스 대학교)는 여전히 우리나라 최대 규모의 고등교육기관이며, 전반적인 교육의 질을 향상시키려면 계속해서 확장해야 합니다. 과학부와 같은 새로운 학부를 설립할 것입니다."
SLO_connect_the_villages:0 "마을 연결"
SLO_connect_the_villages_desc:0 "농업 경제의 효율성을 더욱 높이기 위해서는 마을을 연결하는 도로와 철도 개선에 집중해야 합니다. 도로가 개선되면 사람들이 전국적으로 농산물을 운송하고 판매하기가 더 쉬워지고, 그 과정에서 경제가 활성화될 것입니다."
SLO_modernization_of_agriculture:0 "농업 기계화"
SLO_modernization_of_agriculture_desc:0 "산업 기술과 마찬가지로 농업 기술과 방법도 끊임없이 발전하고 있으며, 최근 몇 년 동안 이 분야에서도 큰 진전이 있었습니다. 우리는 현대 기술을 도입하고 대량 기계화 과정을 거쳐 농업을 최신 상태로 유지해야 합니다."
SLO_expand_agricultural_exports:0 "농업 수출 확대"
SLO_expand_agricultural_exports_desc:0 "우리 스스로 충분한 식량을 확보하고 있는 만큼, 경제 발전을 촉진하고 지역 내 다른 국가들과의 관계를 개선하기 위해 주변 국가에 농산물을 수출하는 것이 필수적입니다."
SLO_utilize_southern_farmlands:0 "남부 농지 활용"
SLO_utilize_southern_farmlands_desc:0 "우리나라 대부분 지역에 타트라 산맥이 펼쳐져 있어 농업이 거의 불가능해 보일 수 있지만, 사실은 그렇지 않습니다. 특히 헝가리 국경 근처인 우리나라 남부 지역은 풍부한 농산물 공급원으로 활용할 수 있는 생산적인 농경지가 풍부합니다."
SLO_new_steel_plants:0 "제철소 건립"
SLO_new_steel_plants_desc:0 "제철소 네트워크를 정비하고 새롭고 현대적인 제철소로 전환함으로써 중공업 확장을 더욱 가속화할 수 있습니다. 이를 통해 우리 신생 산업 경제에 필수적인 자원을 생산할 수 있을 것입니다."
SLO_promote_urbanization:0 "도시화 촉진"
SLO_promote_urbanization_desc:0 "브라티슬라바는 독립 후 수도가 된 이후 이미 많은 관심을 받고 있지만, 우리 인구의 상당수는 여전히 소도시에 거주하고 있습니다. 우리는 대도시, 특히 브라티슬라바가 인구 밀도가 높은 산업 중심지로 성장하도록 촉진하기 위해 정책을 반드시 변경해야 합니다."
SLO_grand_projects:0 "대규모 프로젝트"
SLO_grand_projects_desc:0 "산업화를 달성한다는 것은 단순히 몇 개의 공장을 짓는 것 이상을 의미합니다. 대규모 제철소 건설, 철도망 정비, 그리고 군수품부터 민수품까지 모든 것을 생산할 수 있는 다양한 산업 공장 네트워크 구축을 의미합니다. 우리는 아직 초기 단계인 우리 산업을 이러한 사업에 대비시켜야 합니다."
SLO_development_in_the_vah_valley:0 "바흐 협곡 개발"
SLO_development_in_the_vah_valley_desc:0 "바흐 강 유역에는 많은 도시가 자리 잡고 있으며, 포바슈스카 비스트리차와 두브니차 나트 바홈과 같은 주요 공장들을 비롯한 산업이 밀집되어 있습니다. 이 지역의 지속적인 개발은 우리의 산업화 프로그램을 위해 필수적입니다."
SLO_defense_law:0 "국방법"
SLO_defense_law_desc:0 "슬로바키아는 위험한 시기를 맞이하고 있으며, 이는 우리가 군대와 국민을 이에 대비해야 한다는 것을 의미합니다. 우리는 징집 연령과 군대의 전반적인 지위를 정의하는 새로운 국방법에 서명하여 발효시킬 것입니다."
SLO_military_high_school:0 "육군사관학교"
SLO_military_high_school_desc:0 "슬로바키아 군대가 건국됨에 따라, 국가를 위한 새로운 참모진을 양성하기 위해 육군사관학교가 함께 설립되었으며, 체코슬로바키아의 많은 전직 슬로바키아 군사 지휘관들이 우리와 함께했습니다. 우리는 참모진의 전문성을 높이고 새로운 세대의 하급군 지휘관을 양성하기 위해 육군사관학교를 지원해야 합니다."
SLO_lessons_of_war:0 "전쟁의 교훈"
SLO_lessons_of_war_desc:0 "우리는 전쟁이 어떤 것인지 충분히 경험했고, 그로부터 많은 중요한 교훈을 얻었습니다. 이 모든 경험은 이제 우리의 전략을 더욱 정교하게 다듬고 발전시키며, 군사 교육 또한 개선하는 데 활용될 수 있습니다."
SLO_expand_the_military_industrial_complex:0 "군산복합체 확장"
SLO_expand_the_military_industrial_complex_desc:0 "포바슈스카 비스트리차와 두브니차 나트 바홈의 공장들은 서로 멀지 않은 곳에 있으며, 바흐 강을 따라 군산복합체를 이루고 있습니다. 두 공장이 인접해 있어 두 공장 간의 연계를 개선하고 공동으로 확장하기가 더 쉽습니다. 바로 그것이 우리가 하려는 일입니다."
SLO_study_foreign_weapons:0 "외국 무기 연구"
SLO_study_foreign_weapons_desc:0 "국내 무기 제조 산업은 규모가 작지만, 자체 무기 개발 역량은 더욱 부족하며, 우리 군대의 상당수는 여전히 체코슬로바키아의 구형 무기로 무장하고 있습니다. 따라서 상황을 개선하는 가장 좋은 방법은 이 분야에서 더 성공적인 다른 국가들의 사례를 배우는 것입니다. 우리는 강대국에서 생산된 무기를 구매하거나 요청하여 검토할 수 있습니다."
SLO_tatra_warriors:0 "타트라의 전사들"
SLO_tatra_warriors_desc:0 "슬로바키아는 산악 국가이므로 산악전은 우리에게 이미 생소한 것이 아닙니다. 우리는 군대 내에 산악에서 효율적으로 전투를 벌이고 외세의 침략으로부터 조국을 방어할 수 있는 특수 부대를 창설해야 합니다."
SLO_learn_from_czechoslovak_tanks:0 "체코슬로바키아 전차에서 배우다"
SLO_learn_from_czechoslovak_tanks_desc:0 "우리 군대를 위한 기동력 있는 전력을 개발하려면, 자체 전차 개발 능력을 갖춘 선대 국가인 체코슬로바키아를 넘어서는 방법을 모색해야 합니다. 우리는 여전히 체코슬로바키아 전차를 대량 보유하고 있으며, 이들을 가동하고 향후 장갑차 개발을 위한 검토에 필요한 자원은 매우 적습니다."
SLO_the_fast_division:0 "고속 사단"
SLO_the_fast_division_desc:0 "대규모 군대를 배치하는 것은 거의 불가능하므로, 돌파구를 만들고 이를 활용할 수 있는 사단, 단 하나라도, 대부분 장갑차로 구성된 사단을 만드는 데 자원을 집중해야 합니다. 이것이 바로 빠른 사단이 될 것입니다."
SLO_labor_corps:0 "형벌 부대"
SLO_labor_corps_desc:0 "형벌 부대는 우리 사회의 '바람직하지 않은' 구성원들로 구성된 우리 군대의 일부가 될 것이며, 군대와 함께 전선에 참호와 기타 군사 시설을 건설하는 데 활용될 것입니다."
SLO_technical_divisions:0 "기술 사단"
SLO_technical_divisions_desc:0 "우리는 여러 군 부대를 소위 '기술 사단'으로 개편해야 합니다. 이 사단들은 전투 차량 정비 및 수리부터 참호 파기까지 다양한 용도로 활용될 것입니다. 이들은 슬로바키아 방위의 핵심이 될 것입니다."
SLO_establish_the_air_force:0 "공군 창설"
SLO_establish_the_air_force_desc:0 "체코슬로바키아에서 물려받은 소형 항공기들을 통합하여 슬로바키아 상공을 방어하고, 나아가 본국에서 멀리 떨어진 곳에서도 작전을 수행할 독립적인 공군을 창설해야 합니다."
SLO_aviation_school:0 "항공학교"
SLO_aviation_school_desc:0 "우리 공군의 탄생과 함께 신임 조종사 양성 기관, 즉 항공학교 설립도 함께 이루어져야 합니다. 그리고 기존 조종사들의 경험(대부분 체코슬로바키아 시대 '공화국을 위한 1000명의 조종사' 프로그램)을 활용하여 차세대 조종사를 양성할 것입니다."
SLO_anti_air_defenses:0 "대공 방어"
SLO_anti_air_defenses_desc:0 "우리 공군만으로는 침략자의 공군력을 격파하기에 역부족일 경우, 우리는 영공 방어를 위한 예비 계획을 수립해야 합니다. 그 예비 계획은 전국 각지에 전략적으로 배치된 고정 대공포로, 적 항공기를 효과적으로 격추할 수 있도록 하는 것입니다."
SLO_aircraft_production_at_dubnica_nad_vahom:0 "두브니차 나드 바홈 항공기 생산"
SLO_aircraft_production_at_dubnica_nad_vahom_desc:0 "두브니차 나드 바홈의 현대식 공장은 이미 항공기 엔진 생산 역량을 입증했지만, 우리 공군은 더 많은 것을 요구하고 있습니다. 공장의 일부를 항공기 생산용으로 재건축해야 합니다. 비용이 많이 들겠지만, 공군 물자를 외국에 의존할 필요가 없어지므로 장기적으로는 그만한 가치가 있을 것입니다."
SLO_emergency_squadron:0 "비상 비행대"
SLO_emergency_squadron_desc:0 "해외에서 공군력을 사용할 기회가 있을 수 있지만, 자국 영공 방어를 잊지 않도록 주의해야 합니다. 이를 위해 슬로바키아 상공을 감시하는 전투기 비상 비행대를 창설할 것입니다."
SLO_close_air_support:0 "근접 항공 지원"
SLO_close_air_support_desc:0 "전장에서 우리 전투기와 함께 작전하여 육군을 지원할 자체 급강하 폭격기를 개발하고 생산해야 합니다. 이를 통해 공군은 전투의 필수 요소가 될 것입니다."
SLO_heavy_aircraft_development:0 "중형 항공기 개발"
SLO_heavy_aircraft_development_desc:0 "우리 산업의 성장에 따라 중전투기나 전략 폭격기와 같은 대형 항공기 모델 제작 가능성도 배제할 수 없습니다. 우리는 이러한 아이디어를 심도 있게 탐구하여 국내에서 자체적으로 이러한 항공기 모델을 개발할 것입니다."