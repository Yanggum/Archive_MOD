 TRM_host_nagisa: "The Polychromatic Host\n§gNagisa has achieved numerous feats and stands at Trinity's most noble position. She has become Host again to fulfill the duty of Noblesse Oblige. A permanent aristocratic oligarchy will be established under her reign.§!"
 TRM_host_hifumi: "The Achromatic Host\n§gHifumi remains under Nagisa's political influence; she makes virtually no independent decisions.§!"
 TRM_host_hifumi_2: "The Gray Host\n§gDespite being a political novice, Hifumi is quickly finding her own color.§!"
 TRM_host_hifumi_3: "The Black Host\n§gWhy was she so cruel only to Hifumi?§!"
 TRM_host_seia: "The Yellow Host\n§gAs a prophet, Seia never saw a future where she returned to the position of Host. Perhaps the future is not fixed but changeable through our choices? Seia now values free will over prophecy.§!"
