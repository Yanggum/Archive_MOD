 TRN_justice_task_force_desc: "\"For the sake of justice, we will never hesitate to pull the trigger.\""

 TRN_political_instability_ns: "Political Instability"
 TRN_political_instability_ns_desc: "Trinity's political system is a triumvirate based on the principle of the Trinity, consisting of Sanctus, Filius, and Pater. However, internal competition and checks between factions cause continuous instability."
 TRN_broken_balance_ns: "Broken Balance"
 TRN_broken_balance_ns_desc: "The Seia Yurizono assassination attempt caused cracks in the triumvirate. Conflicts have intensified, and the direction of power is fluctuating rapidly."
 TRN_trinity_volunteer_corps_ns: "Trinity Volunteer Corps"
 TRN_trinity_volunteer_corps_ns_desc: "An underground organization formed to stop Mika Misono's political dominance. They conduct terror activities against Pater executives and traitors who cooperate with Mika.\n\nCan be removed with the focus $TRN_intelligence_agency$."
 TRN_womens_rights_movement_ns: "All-Trinity Women's League"
 TRN_womens_rights_movement_ns_desc: "Created to support women's social advancement and improve unreasonable treatment in the workplace."
