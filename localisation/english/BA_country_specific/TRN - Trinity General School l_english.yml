l_english:

 landmark_TRM_trinity_chruch: "통공의 대성당"
 landmark_TRM_trinity_chruch_desc: "수백 년 전, 트리니티의 제1차 공의회가 열렸던 장소인 '통공의 고성당'은 오랜 세월 동안 역사를 간직해 왔습니다. 오늘날 이곳은 키보토스 전역에서 손꼽히는 유명 관광지로 많은 이들의 사랑을 받고 있습니다. 그러나 그 화려한 외관 너머로, 성당 내부는 여전히 시스터후드의 정신적 지주이자 신성한 공간으로 남아 있으며, 이들의 신앙과 전통을 지탱하는 중심지로서 역할을 다하고 있습니다."

 TRM_GATHERING_STORM_DESC: "본래 파테르, 필리우스, 상투스 세 학원과 요한, 유스티나 등 공인 동아리의 전신인 수많은 분교들이 서로 적대하며 끊임없는 분쟁을 벌이던 지역이었습니다. 오래전 태고의 공의회에서 모든 분교를 하나의 학원으로 통합해 분쟁을 종식시키자는 총의가 내려졌고, 단 하나의 분교를 제외한 모든 분교가 이에 찬성하면서 트리니티는 키보토스 3대 학원 중 하나라는 명예를 얻었습니다.\n\n그러나 현재 트리니티의 상황은 암울하기만 합니다. '대전이'로 불리는 대규모 사건은 트리니티를 완전히 뒤흔들었고, 지금은 이계의 영토에 고립된 상태입니다."

 TRM_guide: "미소노 미카\n\n£white_dot 중대한 문제를 이용하여 티파티의 호스트가 되십시오.\n£white_dot 정적 숙청을 통하여 절대 권력을 쥐어내십시오.\n£white_dot 게헨나의 악마들과 전쟁에서 승리하십시오\n£white_dot 키보토스를 지배하십시오.\n\n\n철의 여인 키리후지 나기사 | §Y미완성§!\n\n£white_dot 중대한 문제를 이용하여 티파티의 호스트가 되십시오.\n£white_dot 미소노 미카의 쿠데타 계획을 저지하십시오\n£white_dot 학생들에게 호소하여 단결심을 이끌어내십시오.\n£white_dot 에덴조약을 체결해 수백년의 적과 평화를 맺으십시오\n\n§R세상이 망할지라도 정의를 행하십시오§!\n\n\n\n§Y개발 : Kangseul2702§!"
 TRM_country_intro_header: "트리니티 종합학원"
 TRM_country_intro_content: "트리니티는 오랜 시간 고통을 감내해왔습니다. 수백 년에 걸친 증오의 연쇄는 끝없는 살육으로 이어졌고, 전쟁의 당위조차 잊은 채 서로에게 칼을 겨눠야 했습니다. 불안정한 중앙정부는 무기력하게 무너지고, 재건과 붕괴를 반복할 뿐이었습니다.\n\n그러나 어둠 속에서 선지자들이 등장했습니다. 이들은 삼위일체라는 개념 아래 제1차 공의회를 소집했고, 분열되어 있던 여러 분파들은 마침내 손을 맞잡았습니다. 공의회 과정 중 일부 소규모 분파의 방해 시도도 있었으나, 유스티나 성도회가 이를 단호히 진압하였습니다.\n\n공의회가 끝난 후, 트리니티는 공식적인 지도체제를 수립하였습니다. 가장 큰 영향력을 가진 상투스, 필리우스, 파테르 분파가 대표로 선출되었고, 이들은 '티파티'를 구성하며 초대 헌법을 제정했습니다. 이로써 트리니티력 0년이 선포되었고, 동시에 ‘트리니티 종합학원’의 이름 아래 하나의 공동체가 탄생한 것입니다.\n\n그 후 수세기에 걸쳐 평화가 이어졌습니다. ‘티파티’와 ‘호스트’ 제도는 이상과 현실의 균형을 이루었고, 트리니티의 학생들은 눈부신 건축과 문화의 혜택 속에서 안정적인 삶을 누리게 되었습니다. 이 시기는 트리니티 역사상 가장 자유롭고 희망에 가득 찬 시절로 기억되고 있습니다."
 TRM_country_intro_header_1: "수백 년의 평화"
 TRM_country_intro_content_1: "수백 년에 걸친 평화의 시기 동안, 트리니티 종합학원은 눈부신 발전을 이뤄냈습니다. 전쟁의 상처는 시간이 지나며 천천히 기억 속에서 희미해졌고, 분열과 증오의 고리는 점차 끊어지기 시작했습니다. 각 분파들은 더 이상 과거의 갈등에 머무르지 않고, 하나의 신념과 가치 아래 서로를 받아들이며 마침내 '삼위일체'의 이름 아래 진정한 통합에 가까워졌습니다.\n\n그 믿음은 곧 트리니티 공동체의 정신이 되었고, 사람들은 삼위일체의 빛은 영원히 꺼지지 않을 것이라 확신했습니다. 이 이상은 단순한 이상주의적 슬로건을 넘어서, 수많은 삶의 원칙과 제도, 교육, 신앙 속에 깊이 뿌리내리며 공동체를 지탱하는 기둥이 되었습니다.\n\n이 평화 속에서 트리니티의 가장 넓은 부지 또한 확정되었고, 중심지인 천년수도 ‘에덴’은 기적과도 같은 속도로 성장했습니다. 에덴은 이제 단순한 도시가 아니라, 키보토스 전체가 동경하는 상징이 되었습니다. 순백의 첨탑들이 하늘을 찌르고, 정교하게 설계된 거리마다 찬란한 학문과 문화, 신앙의 열매가 흐르며 수많은 이들이 이곳에서 웃고, 울고, 사랑하고, 살아갔습니다.\n\n에덴은 트리니티의 영광을 증명하는 살아있는 성소이자, 키보토스가 이룩할 수 있는 가장 완전한 이상향으로 여겨졌습니다. 학원은 눈부신 문화와 예술의 르네상스를 맞이했고, 학생들은 신과 인간, 공동체와 개개인의 의미를 끊임없이 고민하며 미래를 준비했습니다.\n\n수많은 이들이 매일을 감사하며 살아갔고, 사람들은 말했습니다. 오늘도 어제처럼, 그리고 내일도 오늘처럼—이 평화가 계속되리라 믿었다고. 그러나 그 찬란한 빛이 오래 머물 수 있으리라 장담한 자는 아무도 없었습니다."
 TRM_country_intro_header_2: "호스트 위기"
 TRM_country_intro_content_2: "그러나 이러한 평화의 시대는 게헨나 학원의 등장으로 막을 내리고 말았습니다. 서부에서 타 학원에 밀려나 등장한 게헨나 학원은 동부의 트리니티를 위협하기에 충분했고, 내부에서는 동부를 향한 팽창적 열망이 일었습니다. 결국 트리니티에 대한 침략 우려는 현실이 되었고, 게헨나는 하나의 군세처럼 동부를 향해 진군해왔습니다.\n\n이에 맞서 천사들은 치열하게 저항했고, 끝내 게헨나의 동부 진출을 저지하는 데 성공하였습니다. 그러나 그 과정에서 벌어진 전투는 상상 이상의 참상을 남겼습니다. 게헨나 학생들이 장난처럼 벌인 행위들은 오직 평화만을 알던 트리니티 학생들에게는 끔찍한 테러였고, 이로 인해 트리니티 내에는 강한 반게헨나 정서가 퍼지게 되었습니다.\n\n전쟁이 끝난 뒤 양측은 불가침 조약을 체결하였으나, 트리니티 내부에서는 여전히 반발의 목소리가 나왔습니다. 특히 파테르 분파를 중심으로 벌어진 ‘호스트 위기’는 트리니티의 통합 가치를 무너뜨릴 뻔했습니다. 당시 과격한 성향의 파테르 수장이 트리니티 법에 따라 호스트직에 취임하였고, 임기 초반까지는 큰 문제가 없었습니다.\n\n그러나 임기 중반, 트리니티-게헨나 국경에서 게헨나 측의 도발이 이어지자, 트리니티는 절제된 대응으로 사태를 관리하려 했습니다. 하지만 호스트는 이를 선전포고로 간주하고 전쟁을 주장하였고, 이로 인해 ‘호스트 위기’가 촉발되었습니다. 결국 티파티는 호스트에 대한 불신임 결의를 가결하였고, 호스트는 이를 수용하며 자리에서 물러났습니다. 이 사건은 파테르 분파에게 깊은 자존심의 상처를 남겼고, 그 여파는 지금까지도 이어지고 있습니다."
 TRM_country_intro_header_3: "두 번째 트리니티로 가는 길"
 TRM_country_intro_content_3: "게헨나 학원과의 전쟁, 그리고 이어진 호스트 위기 이후 트리니티 종합학원의 평화는 크게 흔들렸습니다. 이를 계기로 트리니티는 군대의 확장에 나서게 되었고, 이 시기를 전환점 삼아 변화의 물결이 본격화되었습니다. 시간이 흐르며, 트리니티에는 각 분파를 대표할 인재들이 등장하였습니다. 상투스의 유리조노 세이아, 필리우스의 키리후지 나기사, 그리고 파테르의 미소노 미카입니다. 이들은 총명함과 리더십을 겸비한 인물들로 평가받으며 다음 세대의 전성기를 이끌 인물로 많은 기대와 찬사를 받으며 정계에 발을 들였습니다. 그렇게 트리니티는 새로운 국면에 접어들게 됩니다.\n\n그러던 어느 평범한 날, 오후 1시경 발생한 한 사건이 트리니티는 물론 키보토스 전역을 충격으로 몰아넣었습니다. 몇초간 눈부신 빛이 세상을 뒤덮었고, 시야가 다시 열렸을 때 트리니티 앞에 펼쳐진 것은 낯선 세계였습니다. 그것은 마치 수십 년 전 키보토스를 연상케 하는 공간이었으나, 환영의 인사는커녕 총탄과 폭격이 트리니티를 맞이했습니다.\n\n트리니티는 즉시 비상사태를 선포하고 근위사단, 정의실현부, 자경단까지 총동원하여 방어에 나섰습니다. 적은 결국 물러났지만, 그 전투는 트리니티에 깊은 상처를 남겼습니다. 특히 파테르 분파 소속 전투원들의 무저항 민간인 공격과 포로 학대 행위가 포착되어 군법에 회부되었고, 이들은 징역형을 선고받았습니다. 미소노 미카가 이들의 변호에 나섰으나, 법원은 이를 받아들이지 않았습니다.\n\n이후 파테르 분파와 미소노 미카는 그동안 꾸준히 주장해오던 새로운 국가 이념인 ‘두 번째 트리니티’를 본격적으로 내세우기 시작했습니다. 이들은 과거 '평화의 시대'가 오히려 귀중한 시간을 낭비한 시기였으며, 수많은 영웅들이 빛을 보지 못한 채 사라졌다고 오래전부터 강조해왔습니다. 일부 고참 임원들이 군국주의, 민족주의, 폭력 숭배 등의 의혹을 받고 있음에도, 파테르 분파는 자신들이야말로 트리니티를 진정으로 사랑하고 있으며, 궁극적으로는 세계사의 흐름을 바꿀 의지를 지닌 특별한 존재들이라는 확신을 갖고 있습니다."
 TRM_country_intro_header_4: "에덴 조약?"
 TRM_country_intro_content_4: "에덴 조약은 키리후지 나기사를 중심으로 한 필리우스 분파의 과반이 지지하는 트리니티와 게헨나 간의 평화 협정입니다. 키리후지 나기사와 필리우스 분파는, 과거 트리니티가 그랬던 것처럼 증오의 사슬을 끊고 다시 한 번 평화와 번영의 시대를 맞이할 수 있다고 주장합니다. 조약에는 양 학원의 학생들로 구성된 평화유지군을 창설해 공동의 치안을 유지한다는 조항도 포함되어 있습니다.\n\n겉으로 보기에는 양측 모두 긍정적으로 평가하고 있지만, 내면의 기류는 그렇지 않습니다. 게헨나의 학생회인 만마전은 이 조약에 무언가 의심스러운 기류를 보이고 있으며, 미소노 미카와 파테르 분파는 이를 지나치게 이상주의적이고 실현 불가능한 조약이라고 비판합니다. 실제로 총학생회의 중재로 열린 양 학원 간 회담에서는 게헨나 측의 무례한 태도가 티파티의 강한 반감을 일으키기도 했습니다.\n\n그럼에도 불구하고 키리후지 나기사와 필리우스 분파는 이를 어느 정도 감내할 수 있는 문제로 여기며 분노한 티파티를 진정시키는 데 주력했습니다. 에덴 조약의 성공 가능성은 여전히 낮지만, 만약 실현된다면 트리니티는 과거 찬란했던 평화의 시대를 다시금 복원할 수 있을지도 모릅니다."

 
#캐릭터 #인물
 TRN_tea_party_name: "티파티 비상회의"
 TEA_PARTY_DESC: "트리니티가 정체불명의 현상에 휘말려 학원에 재앙이 닥치자, 호스트는 비상회의를 소집하였습니다. 이에 따라 각 분파의 대표들이 모여 삼두정 체제로 트리니티를 이끌고 있습니다.\n\n위기가 어느 정도 수습된 지금, 비상회의는 곧 호스트를 새롭게 선출한 뒤 해체될 예정입니다."
