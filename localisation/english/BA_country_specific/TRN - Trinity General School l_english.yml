 TRN_geographical_renaming_decision: "Abolition of German Place Names"
 TRN_geographical_renaming_decision_desc: "As part of the de-Germanization process, all place names written in German will be abolished. New place names written in Kivotos' native language will gradually conquer the mental world of the German locals."
