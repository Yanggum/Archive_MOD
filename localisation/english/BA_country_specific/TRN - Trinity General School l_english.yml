 TRN_SPD_parteitag_state: "사회민주당"
 TRN_SPD_parteitag_state_desc: "\n\n\n£GFX_TRN_banner_SPD_parteitag\n\n\n\n\n트리니티와 사민당의 거래로 이 지역에서 사민당은 자유로운 정치 활동을 보장받으며 특별한 지위를 갖게 되었습니다. 주총리가 대부분의 행정을 직접 관할하게 되었고, 중앙정부의 간섭은 크게 제한되었습니다."
 TRN_church_in_resistance: "저항하는 교회"
 TRN_church_in_resistance_ns: "$TRN_church_in_resistance$"
 TRN_gehenna_resistance_movement: "게헨나 저항운동"
 TRN_gehenna_resistance_movement_desc: "트리니티와 게헨나의 ‘에덴 조약’은 양 학원의 온전한 통합을 의미합니다. 겉으로는 통일의 형태를 띠고 있지만, 실제로는 게헨나가 트리니티에 굴복한 병합 조약에 가깝습니다. 이를 부정하고자 게헨나 학생들이 트리니티의 지배에 반발하고 있으나, 에덴 조약이 발효되는 이상 그들의 저항은 머지않아 꺾일 것입니다."
 TRM_industrial_region_state: "학원경제개발부 산업지구"
 TRM_industrial_region_state_desc: "이 주의 산업은 현재 학원경제개발부에 의해 관리되고 계획되며, 도시 및 농촌 행정은 에덴이 직접 임명하는 단일 지사 아래 중앙집권화되어 있습니다."
 # misc
 trinity_white_uniform_security_militias: "학원방위대" # 혹시 몰라서 로컬 넣어야겠다;;;
 
 TRN_army_ns: "트리니티 지상군"
 TRN_army_ns_desc: "수백 년 전, 트리니티의 지상 병력은 서로 간의 '내전'을 통해 군사적 역량을 빠르게 발전시켜 왔고, 이러한 실전 경험은 교리의 이론적-전술적 성장으로 이어졌습니다. 이후 트리니티가 하나의 신념과 가치 아래 통합되면서, 비록 그 격동의 시기는 잊었을지언정, 그로부터 얻은 교훈만은 결코 잊지 않았습니다."
 TRN_army_ns_change: "§Y$TRN_army_ns$§! 변동치"
 TRM_VVS: "트리니티 항공군"
 TRM_VVS_desc: "트리니티 공군의 시초, 항공의 어머니가 하늘에 새로운 지평을 열었을 때, 우리는 단순한 비행을 넘어선 군사적 패러다임의 전환을 맞이했습니다. 오늘날까지도 트리니티 공군은 하늘에서의 승리가 지상에서의 승리를 이끈다는 신념 아래 날아오르고 있습니다."
 TRM_navy: "트리니티 해군"
 TRM_navy_desc: "트리니티에게 '해군'이라는 개념은 다소 낯설 수 있지만, 결코 타 학원에 뒤처지지 않습니다. 우리는 많은 이들에게 바다의 중요성을 일깨웠고, 오늘도 승리에 대한 굳은 믿음 아래 당당히 출항합니다."

 TRN_joint_security_organization_ns: "[GEH.GetAdjective]-[TRM.GetAdjective] 국제치안위원회"
 TRN_joint_security_organization_ns_desc: "이 조직은 트리니티에서부터 게헨나 선도부에 이르기까지, 두 정부 사이의 사법 및 치안 공조를 위하여 만들어졌습니다. 범죄 용의자가 두 학원 경계를 넘나드는 경우 위원회는 정의실현부와 선도부의 공조 수사를 지휘해 치안을 함께 유지합니다."
 TRN_military_mission_generic_ns: "[TRM.GetAdjective] 군사자문단"
 TRM_JTF_intelligence_ns: "정의실현부"
 TRM_JTF_intelligence_ns_desc: "정의실현부에 방첩 역할을 부여하고 그 규모를 더욱 확대했습니다. 티파티의 지시에 따르는 직속 부대로서, 정의실현부는 우리를 위한 가장 강력한 검이 될 것입니다."
 TRN_german_new_culture_order_modifier: "독일의 새로운 문화적 질서"
 TRN_german_new_culture_order_modifier_desc: "독일의 새로운 문화적 질서가 떠오르고 있습니다. 트리니티에 의해 지배되는 독일 사회는 우리의 영향력 아래에서 변화해 갈 것입니다. 그것이 긍정적이든, 그렇지 않든요."
 TRN_german_new_culture_order_modifier_change: "§Y$TRN_german_new_culture_order_modifier$§! 변동치"
 
