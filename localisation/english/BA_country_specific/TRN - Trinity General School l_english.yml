 TRN_Mika_honor_loop_decision: "Misono Mika's Personal Schedule"
 TRN_Mika_honor_loop_decision_desc: "Needless to say, Host Misono Mika's term is not limited to one year as it was in the past. Within the limits guaranteed by the new constitution, that period can be extended indefinitely. Therefore, Misono Mika will cause numerous incidents in the future."
 TRN_Mika_honor_loop_decision_tt: "§YMisono Mika's§! everyday events will §Yoccur§!."
 TRN_honor_populist_policies: "Pass Populist Policies"
 TRN_honor_populist_policies_desc: "Idealistic eloquence alone cannot win people's trust and support. Action is needed more than words. We will take practical measures for those most in need. We will provide basic food subsidies for the poor, and public assistance for the unemployed, those wounded in the Great War, and welfare recipients to purchase winter fuel and food."
 TRN_honor_social_change: "Social Transformation"
 TRN_honor_social_change_desc: "'Trinity Socialism' is an ideology based on class cooperation where workers and capitalists collaborate, and corporatism, aiming to realize social solidarity according to Christian doctrines. However, contrary to the ideal, remnants of the German state and the old system still remain in reality, blocking our path. Now is the time to thoroughly liquidate those deep-rooted legacies."
 TRN_honor_spread_of_militarism: "Spread of Militarism"
 TRN_honor_spread_of_militarism_desc: "To realize Trinity's great cause, we must absolutely complete our revenge against Gehenna and, furthermore, build the most powerful army in Kivotos. To this end, it is necessary to establish a system that instills the importance and responsibility of national defense in next-generation members through early military education. We must strengthen security awareness throughout Trinity society and prepare to respond to future threats with united strength."
 TRN_honor_technocrat: "Strengthen Technocrats"
 TRN_honor_technocrat_desc: "Fundamentally, it is very difficult for ordinary students to manage a nation. Passion alone is insufficient for administration and governance; systematic thinking and proven loyalty are essential. Therefore, we must increase the expertise and efficiency of the administration by appointing ideologically verified, highly loyal elites throughout the government."
 TRN_honor_woman_right: "Protection of Women's Rights"
 TRN_honor_woman_right_desc: "The 3K policy, born from the combination of the Nazi Party's arrogance and male chauvinistic thinking, was naturally abolished with the emergence of Trinity. However, women's return to the workplace and improvement in status are not being properly achieved. These issues must be promptly addressed through the Host's intervention."

 TRN_honor_protection_of_the_Jewish_community: "Protection of Jewish Communities"
 TRN_honor_protection_of_the_Jewish_community_desc: "The Jewish people are a nation that has been persecuted for a long time amidst the madness of the German state. Manipulated conspiracy theories such as the 'Stab-in-the-back myth' were used as tools to dismantle Jewish communities, and it was common for people to commit violence simply because someone was Jewish and not receive proper punishment. Protecting them will now become the true 'realization of justice'."
 TRN_honor_utilize_the_church_authority: "Utilize Sisterhood Authority"
 TRN_honor_utilize_the_church_authority_desc: "The Sisterhood claims religious legitimacy for Trinity and has been continuing relief activities and social service in the [TRM.GetNameDef] region. Their devoted appearance earns the respect of many students and citizens. The things that can be done using such a Sisterhood are endless."

 
 
 trinity_honor_events.1.t: "Theft Incident in the Unmanned Ward"
 trinity_honor_events.1.desc: "\"Waaaaah, Senpai! We missed them again!\"\n\n\"It's— it's okay, Hanae-chan. At least I think it's a relief that no one was hurt....\"\n\nSerina comforted Hanae while patting her back. Recently, robbery cases targeting Trinity's unmanned wards were occurring frequently. Serina and Hanae were trying desperately to catch the culprits, but the crimes showed no sign of decreasing.\n\n\"Hnnn~? So, you're saying you need my help because of the theft cases~☆\"\nMika was talking to herself while slowly reading the report. Since the incident, the Justice Task Force was always moving busily. They were busy before, but even more so after the incident. Mika was staring intently at the report with her chin in her hand. Talking to herself in her own inner world, she couldn't think of a sharp way to solve this problem at all.\n\n\"The JTF kids must be frantic too, wouldn't it be a bit much to call them for the Remedial Knights~? They are directly under the Tea Party, after all.\""
 trinity_honor_events.1.a: "\"If we give the Remedial Knights a little more budget, wouldn't those kids be able to solve it themselves?\""
 trinity_honor_events.1.b: "\"As expected, wouldn't it be solved somehow if we ask the JTF kids?\""
 trinity_honor_events.1.c: "\"Still, the JTF kids surely have their own circumstances...\""

 trinity_honor_events.2.t: "The Issue of JTF Excessive Force"
 trinity_honor_events.2.desc: "\"Kyaaaaa!\"\n\n\"Don't make a fuss! If you keep resisting, you'll see a rough time!\"\n\n\"You just have to stay here quietly until the academy pays the hostage ransom. Don't even think about doing anything funny!\"\n\n\"What? You had a negotiation with Trinity Academy?\"\n\n\"Hah? Of course! The contact is already finished.\"\n\n\"Ah... No!! Avoid it!! To the corner!!\"\n\n-CRASH-!!\n\n\"Ki-hit! Ki-hehehehehe!\"\n\n\"Hi... Hik! Do... Don't come closer! Aaaargh!\"\n\n\"The person got squished like a soda can~? Wo-ah☆ Tsurugi-chan, you really are scary~\"\n\nEven after the incident, kidnapping crimes targeting Trinity students show no sign of decreasing. The Tea Party sent Tsurugi from the Justice Task Force as a negotiator as usual, but the media label of 'excessive force' remains. In particular, when the wretched state of the kidnappers in this incident was disclosed to the media, the JTF faced fierce criticism.\n\nAt least it's a relief that all the hostages were rescued safely, but some of them were diagnosed with PTSD due to extreme stress. According to the Remedial Knights, at least three weeks or more of rest is required."
 trinity_honor_events.2.a: "\"Tsurugi-chan's way is hot and great, but~ if it becomes a problem, we should fix it, right?\""
 trinity_honor_events.2.b: "\"Hnnn~? It was against people who did bad things, is this something to make such a fuss about?\""

 trinity_honor_events.3.t: "Gunfight in the Café District"
 trinity_honor_events.3.desc: "This morning, an incident occurred where delinquents kidnapped the Miracle 5000 cake baker and engaged in a gunfight with the After-School Sweets Club, some students, and one student presumed to be from the Sisterhood. Fortunately, the delinquents were flustered by the gunfight and left the baker behind. The problem is the urban damage caused by the gunfight and the fact that the Sisterhood is involved in this incident. The urban damage is not large and will be restored immediately, but the Sisterhood's involvement in this case is suspicious. Of course, since they are our political allies, we could resolve it with a simple immunity."
 trinity_honor_events.3.a: "\"Ahaha. Well, wouldn't it be okay to just laugh and let it slide once?\""
 trinity_honor_events.3.b: "\"...Hmm, but it's still a bit suspicious.\""

 trinity_honor_events.4.t: "Sisterhood's Missionary Activity"
 trinity_honor_events.4.desc: "Blah blah blah, after contacting the Sisterhood, a sister is active. But the missionary content is strange. Either way, we must restrain them. But then we can't change Sakurako's traits for the better. Sad, but true."
 trinity_honor_events.4.a: "\"Missionary activities? Do we really need to stop even that?\""
 trinity_honor_events.4.b: "\"Hmm, no.\""
 
 TRN_economic_evelopment_department: "Academy Economic Development Department"
 TRN_economic_evelopment_department_desc: "[TRN_eed_cat_desc]"
 TRN_eed_cat_desc_Mika: "Established by the order of Misono Mika, the Academy Economic Development Department is reorganizing the industrial structure for the development of Trinity's military industry. This department performs a role similar to that of the Host in economic and industrial sectors alone, even without Misono Mika's approval. In the future, the Academy Economic Development Department will take on the mission of establishing economic plans that will make Trinity stronger than ever before."
 TRN_eed_cat_desc_general: "The Academy Economic Development Department is an organization established by the order of the Host to professionally manage and operate the academy's economy. The director is responsible for establishing the academy's mid-to-long-term development strategy and overseeing various economic sectors. More precise and systematic planning than ever before is required for the Academy Economic Development Department."
 TRN_Industrial_Regions: "Establish Trinity Development District in [FROM.GetName] State"
 TRN_industrial_region_state_trigger: "A maximum of 3 states can be designated. Currently, [?TRN_industrial_region_state] states have been designated."
 TRN_garden_city_movement: "Garden City Movement"
 TRN_garden_city_movement_desc: "Eden has regained some of its former appearance through reconstruction. Nevertheless, the city has not yet fully healed. We must improve the living environment and support the development of industrial capacity more than before. Family housing, medium-density housing, shared services and amenities, and ample green spaces will be provided."
 TRN_embrace_chain_production: "Embrace Mass Production"
 TRN_trade_controls: "Trade Controls"
 TRN_air_factory_decision: "Trinity Aircraft & Engine Factory"
 TRN_junkers_corp_assets_decision: "Utilization of Junkers Assets"
 TRN_improv_supply_efficiency_decision: "Ammunition Factory Tailored to Consumption"
 TRN_improv_supply_efficiency_decision_desc: "Trinity's artillerymen consume shells. They consume a lot. They consume them to a point that is almost severe."
 TRN_improv_supply_efficiency_decision_trigger_tooltip: "§Y$MODIFIER_SUPPLY_CONSUMPTION_FACTOR$§! in §Y$TRN_army_ns$§! is §Y0%§! or higher." 
 TRN_economic_plan_cat: "Trinity Industrial Plan"
 TRN_economic_plan_cat_desc: "The economic crisis that followed the incident, the increased academy grounds, the broken social order, and various economic indicators showing a downward trend demand more active economic intervention from the Tea Party Host. To prepare for the upcoming crisis, extensive and systematic industrial development must be pursued, which will be a key task for the stability and recovery of our alma mater."
 TRN_industry_deicision_active: "An industrial plan is in progress elsewhere."
 TRN_Infrastructure_development_fake: "Trinity Infrastructure Reconstruction"
 TRN_Infrastructure_Development: "[FROM.GetName] Infrastructure Reconstruction"
 TRN_Infrastructure_Development_desc: "While infrastructure has collapsed due to the Great War, the old asphalt roads left by the former German state are not suitable for Trinity's main vehicle operations. Accordingly, the necessity for a large-scale civil engineering project to completely replace the aging infrastructure has been raised. The newly built highway network will enhance civilian convenience in peacetime and enable rapid nationwide movement of military vehicles in wartime."
 TRN_Abydos_clearing_sand: "[FROM.GetName] Ecosystem Restoration"
 TRN_Peat_Extraction: "Peat Extraction in Northern Wilderness"
 TRN_Peat_Extraction_desc: "There are numerous wetlands, swamps, and wastelands in the northern region. These places were originally uninhabited, but people began to live there as they were developed, and through this development, we can learn about the economic potential of this region. Wastelands are an excellent source of peat, a low-quality alternative fuel for coal or wood that can be dug from the ground and used as supplementary fuel for local industries and private homes."
 TRN_Opelwerk_Brandenburg: "Acquisition of Opelwerk Brandenburg"
 TRN_Opelwerk_Brandenburg_desc: "Opelwerk Brandenburg, once a major German automobile manufacturer, grew steadily throughout the 1920s and 1930s, but suffered a severe blow from the direct hit of the Great War. However, the automobile manufacturing technology they possess is still innovative, and if acquired and converted into a state-run enterprise, we could secure a company capable of producing thousands of trucks."
 TRN_Lehnmuhle_Dam: "Reconstruction of Saxony Dam"
 TRN_Lehnmuhle_Dam_desc: "In Saxony, which was one of the major battlegrounds during the Great War, the dam collapsed after fierce fighting, resulting in large-scale flooding. Trinity's Tea Party Host and officers of each faction prioritized the reconstruction of the dam in this region, emphasizing the rapid increase in demand for local power sources and the constant flooding in the eastern Erz Mountains."
 TRN_Basis_Scholar_development: "Basis Scholar Development"
 TRN_Basis_Scholar_development_desc: "Basis Scholar was able to avoid major damage from German army attacks thanks to the quick response of the Remedial Knights. Their persistent efforts made the residents have deep trust and favor toward the current government, contributing significantly to regional stability. If we now pursue an industrial plan linked to this region, we can realize faster industrialization. In particular, the proximity to the Oder River will serve as a great advantage in terms of logistics and resource transport."
 TRN_Kimigayama_shipbuilding_plant: "Kimigayama Shipyard"
 TRN_Kimigayama_shipbuilding_plant_desc: "New oceans are enough to blow fresh vitality into Trinity's shipbuilding industry, which demands large-scale investment in shipyards. However, such investment will never be in vain. If sufficient capital and resources are invested, the economic and strategic rewards they will bring will be unimaginably large."
 TRN_Stettin_heavy_industry: "[63.GetName] Aviation Business"
 TRN_Stettin_heavy_industry_desc: "The [63.GetName] region is adjacent to the North Sea, possessing excellent geographical advantages for aerial operations and maritime control toward Northeast Europe. Accordingly, we plan to cooperate with local authorities to build a large-scale airport and lay the foundation for a full-scale aviation industry."
 TRN_dessert_shop_expansion: "Expansion of Dessert Shops"
 TRN_dessert_shop_expansion_desc: "A leader must constantly think, and thinking requires high-calorie energy. Naturally, humans look for something that satisfies all these conditions while being sweet and making them forget their worries for a while. That is dessert."
 TRN_agricultural_support: "[FROM.GetName] Agricultural Support"
 TRN_agricultural_support_desc: "People think of rest when they see the green meadows and peaceful lakes of Mecklenburg. But as a true predator, you should think of efficient monoculture and ruthless exploitation of soil fertility when you see those vast plains. Keep everything to the end of the horizon under your feet. Of course, all of them should be genetically modified."
 TRN_katowice_mining: "Expansion of [FROM.GetName] Mining"
 TRN_katowice_mining_desc: "Scrape out the Earth's intestines and fill your bank account. While environmentalists whisper about a 'sustainable future' and drink organic caffè lattes, the true winner pierces the crust and plunders the Earth's deepest treasures. Katowice awaits your giant drill."
 TRN_stettin_oil_mining: "Stettin Oil Deposit Development"
 TRN_stettin_oil_mining_desc: "There is a report that an oil field exists at a point about 6km away from Swinemünde, a port city northwest of Stettin. This discovery provides an opportunity to supplement the shortage, especially for Trinity, which lacks fuel, and at the same time has the potential to dramatically reduce dependence on imported fossil fuels."
 TRN_rebuilding_Landwehrkanal: "Restoration of Landwehr Canal"
 TRN_rebuilding_Landwehrkanal_desc: "The Landwehr Canal suffered serious damage due to the Great War, with many parts destroyed, making it unusable. In particular, this canal is highly valued for its great advantage of being able to transport cargo from Magdeburg to Basis Scholar all at once."
 TRN_schlesien_coal_mine: "Expansion of Silesia Coal Mine"
 TRN_schlesien_coal_mine_desc: "Coal mines in the Silesia region are growing into huge coal mines in Trinity, and coal production is increasing over time. To handle the sharply increased energy consumption since the incident, the development of coal mines in the Silesia region has become an essential task."

 TRN_trinity_world_cat: "Trinity and the World"
 TRN_trinity_world_cat_desc: "Trinity is currently isolated from the world, a problem that can be overcome through sufficient diplomatic efforts. However, geopolitical factors are still choking us, and this complex crisis must be solved one by one, starting with diplomacy. We never falter."
 TRN_lend_our_support: "Lend Our Support"
 TRN_international_propaganda: "International Propaganda"
 TRN_international_propaganda_tt: "The amount of political power acquired is determined by the number of factories."
 TRN_border_fortifications: "Border Fortifications"
 TRN_anti_pandemonium_society: "Disparage [GEM.GetNameDef] Authority"
 TRN_create_pro_trinity_group: "Agitate Germans in [GEM.GetAdjective] Region"
 TRN_pandemonium_society_approach_club_Hot_Springs_Department: "Approach the Hot Springs Development Department"
 TRN_pandemonium_society_approach_club_Gourmet_Research_Society: "Approach the Gourmet Research Society"
 TRN_prefect_team_discipline_decline: "Undermine [GEH.GetNameDef] Discipline"
 TRN_romania_give_the_oil: "Secure Romanian Oil Fields"
 TRN_romania_give_the_oil_desc: "Oil is needed for Trinity's industries, vehicles, and war machines to operate smoothly. Romania's oil fields possess sufficient supply to meet our demand. However, the Romanian government is showing an uncooperative attitude toward us, and the use of force is required to break through this situation."
 TRN_support_HYA_decision: "Cooperate with [HYA.GetNameDef]"
 TRN_support_HYA_var_tt: "An §Yevent§! will occur where §Y[HYA.GetNameWithFlag]§! cooperates with §Y[TRM.GetNameWithFlag]§!. The maximum number of times is §Y3§!, and we have cooperated §Y[?TRN_support_HYA_var]§! times so far.\n\nIf we cooperate §Y3 times§! or more, the §Ydecision is removed§!."
 TRN_support_HYA_decision_remove_tt: "Currently cooperated §Y[?TRN_support_HYA_var] times§!. Since the conditions are met, the following effects appear:"
 TRN_influence_baltics_decision: "Exert Influence on [FROM.GetName]"
 TRN_influence_the_baltics_unlock_tt: "£decision_icon_small §YDecision Unlocked§!: Exert influence on Baltic countries"
 TRN_german_influence: "Trinity's Influence"

 # Balkan Diplomacy 
 TRM_diplomacy_balkan_decision_category: "Balkan Diplomacy"
 TRM_diplomacy_balkan_decision_category_desc: "The Balkans is a region where conflicts are frequent enough to be called the 'powder keg of Europe.' This means it is a suitable environment for inciting conflict and driving a wedge between nations. Therefore, we must approach cautiously and strategically. \n\nWe must properly coordinate the relationships between Balkan countries to lead their policies in a direction that suits our interests. Ultimately, we should establish long-term plans to make all Balkan countries subordinate to us or turn them into allies."
 TRM_send_ultimatum_to_country_balkan: "Send Ultimatum to Balkan Country"
 TRM_pressure_country_government_balkan: "Pressure Balkan Government"
 TRM_promote_ideology_rallies_balkan: "Promote Ideological Rallies in Balkans"
 TRM_pressure_government_cd_tt: "\nWe can only apply pressure once every §Y[?TRM_pressure_government_cd]§! days."
 TRM_pressure_government_active_flag: "$SOV_pressure_government_active_flag$"
 
# Divine Mandate Management Events and Decisions
 TRN_Trinity_divine_mandate_cat: "Establish Divine Mandate"
 TRN_Trinity_divine_mandate_cat_desc: "\n\n£GFX_decision_header_TRN_trinity_buliding \n\n\n\nThe Divine Mandate originates from the name of the Governor-General's Office that managed Trinity's occupied territories in the past. Now, however, the name Divine Mandate has been brought back from history to effectively manage the vast East and Kivotos territories.\n\nThe final goal of the Divine Mandate is to manage the territory, assimilate the locals into Trinity, and develop the region to a level similar to Trinity. We don't know when it will be, but one day Trinity will perfectly control this vast territory."
 TRN_Divine_Mandate_Trigger_tt: "§Y[ROOT.GetNameWithFlag]§! or a puppet state controls all §Yhighlighted states§!."
 TRN_poland_divine_mandate: "Establish Southeast Trinity Divine Mandate"
