 trnhonor.1.t: "무인 병동에서의 도난 사건"
 trnhonor.1.desc: "\"흐아앙, 선배! 또 놓치고 말았어요.\"\n하나에가 울먹이며 말했다. \n\n\"괜, 괜찮아요 하나에 쨩 그래도 다친 사람은 없어서 다행인거 같네요….\"\n하나에의 등을 토닥이며 세리나가 위로하고 있다.\n\n\n\"으응, 그러니까 도난 사건과 관련해서 정의실현부의 도움이 필요하다는 거네?\"\n미카는 천천히 보고서를 읽어가며 혼잣말을 하고 있었다.\n\n미카는 문득 자신이 미네에게 했던 일을 떠올렸다. 미네의 말실수, 그리고 그로 인해 퍼부었던 독설.\n\n그 말을 듣고 있던 미네의 표정은 아직도 머릿속에 생생하게 남아 있었다.\n\n\"으응… 구호기사단 관련 일이면 자꾸 그 표정이 떠오른단 말이지…….\"\n\"으아아–! 정말로! 이럴 때일수록… 나기쨩이라면 어떻게 했을까…….\""
 trnhonor.1.a: "\"아무래도 도와주는 게 맞겠지. 응. 나기쨩이라면 분명 그렇게 했을 거야.\""
 trnhonor.1.b: "\"그래도 미네 쨩이 했던 말은 아직도 용서 못 하겠는걸? 도와줄 수는 없어.\""

 trnhonor.2.t: "정의실현부의 과잉진압 문제"
 trnhonor.2.desc: "\"꺄아악!\"\n\n\"소란 피우지 마! 계속 반항하면 험한 꼴을 보게 될 줄 알아!\"\n\n\"넌 그냥 학원에서 인질 협상금을 지불할 때까지 얌전히 여기 붙잡혀 있으면 되는 거야. 괜히 엉뚱한 생각하지 마!\"\n\n\"네? 트리니티 학원이랑 협상을 했다고요?\"\n\n\"앙? 당연하지! 벌써 연락은 끝났다고.\"\n\n\"아.. 안 돼!! 피해요!! 구석으로!!\"\n\n-콰아앙-!!\n\n\"키힛- 키헤헤헤헤헤-!\"\n\n\"히.. 히익! 다.. 다가오지 마! 크아악-!\"\n\n\"그래서 사람이 그렇게 찌그러졌다고..? 와.. 와오... 응. 진짜 무서운 여자네, 츠루기 쨩...\"\n\n사건 이후에도 트리니티 학생들을 노린 납치 범죄는 좀처럼 줄어들 기세를 보이지 않고 있습니다.\n평소처럼 티파티는 정의실현부의 츠루기를 협상가로 파견했지만, 그녀에겐 항상 과잉진압이라는 언론의 꼬리표가 따라붙고 있습니다. 특히 이번 사건에서 구겨진 캔 콜라처럼 처참한 모습인 납치범들의 상태가 언론을 통해 공개되자, 정의실현부는 강도 높은 비난에 직면했습니다.\n\n그나마 다행인 것은 인질 전원이 심각한 부상 없이 구조되었다는 점입니다. 하지만 그 중 몇몇은 극심한 스트레스로 인해 PTSD를 호소하고 있습니다. 구호기사단의 진단에 따르면, 최소 3주 이상의 안정이 필요하다고 합니다."
 trnhonor.2.a: "\"츠루기 쨩의 방식도 마음에 들지만, 문제가 발생 한다면 고쳐야 해.\""
 trnhonor.2.b: "\"그래도 범죄자를 상대로 소란을 피우는 건... 딱히 신경 쓰지 않아도 될거 같은데?\""

 
 # 중점
 TRN_bring_in_vigilantes: "자경단 투입"
 TRN_bring_in_vigilantes_desc: "정의실현부의 끊임없는 노력에도 불구하고, [61.GetName]와 [66.GetName]의 조직적인 저항이 좀처럼 사그라들지 않고 있습니다. 테러리스트들이 트리니티의 안정을 위협하고 있습니다. 이에 따라 호스트의 명령이 내려졌습니다. 자경단은 테러리스트를 철저히 제압하고 트리니티의 질서를 수호하기 위해 더욱 강경하게 나설 것입니다."
 TRN_reconstruction_of_collapsed_industry: "무너진 산업 복구"
 TRN_reconstruction_of_collapsed_industry_desc: "저항이 끝난 뒤 [61.GetName]와 [66.GetName]은 파괴되고 상처 입었습니다. 보조금 지원을 통해 무너진 산업들을 복구 시키고 [61.GetName]와 [66.GetName] 지역 주민들에게서 구원자라는 이미지를 심어야 합니다."
 TRN_Reconnect_network_and_power: "통신망 확대"
 TRN_Reconnect_network_and_power_desc: "대전이 사태의 여파로, 트리니티 통신망은 주요 거점에서 멀어질수록 정보 접근성이 현저히 떨어졌습니다. 그러나 통신망을 확장한다면 이러한 문제는 충분히 해결 가능하며, 보다 많은 지역에서 신속하고 정확한 정보 전달이 가능해질 것입니다."
 TRN_railway_improvement: "철도망 개선"
 TRN_railway_improvement_desc: "현지 철도의 궤간은 키보토스에서 사용되는 표준과 일치하지 않아, 결국 물자를 차량으로 수송해야 하는 비효율적인 상황에까지 이르렀습니다. 이 문제를 해결하기 위해서는 철도망을 개선하고, 보다 효율적인 수송 체계를 마련해야 할 것입니다."
 TRN_KWG_open: "카이저 빌헬름 협회 재개장"
 TRN_KWG_open_desc: "대전이 사태 동안 카이저 빌헬름 협회 건물은 화재로 소실되었습니다. 연구 자료들은 가까스로 보존해냈지만, 일부 손실은 피할 수 없었습니다. 트리니티의 수많은 학자들은 이를 안타까워하며, 협회의 복원과 재개장을 강하게 요구하고 있습니다."
 TRN_improving_academy_industry: "트리니티 재산업화"
 TRN_improving_academy_industry_desc: "트리니티의 총체적인 문제를 해결하기 위해서는 호스트가 주도하는 재개발이 필요합니다. 또한, 다가올 외부적인 위협에 대비하기 위해서는 군수 생산 공장을 대규모로 확장 해야 할 것입니다. 많은 사람들이 이 정책에 반대할 것이지만 모교이 위협에 닥쳤을때 사람들은 우리에게 고마워할 것입니다."
 TRN_ministry_of_industrial_development: "학원경제개발부 설립"
 TRN_ministry_of_industrial_development_desc: "트리니티의 경제는 하나의 오케스트라이며, 학원경제개발부는 그 지휘자입니다. 기존에 티파티에 소속되어 있던 경제 전문가들은 독립된 단체로서 학원과 학생들의 이해관계 사이에서 균형을 유지하며, 합리적인 투자와 규제 완화를 통해 양측이 더욱 부유하고 번영할 수 있도록 합니다."
 TRN_expanded_corporatism: "협동조합주의적 대표성을 향하여"
 TRN_expanded_corporatism_desc: "트리니티의 경제 방향이 소수 엘리트들에 의해 지나치게 좌우되는 것에 대해 우려하던 학생들은 학원경제개발부에 의문을 제기하기 시작했습니다. 이에 호스트는 노동자와 기술자 등 각계 전문 인력들이 자신의 분야에서 목소리를 낼 수 있도록 소통의 창구를 마련하기로 결정했습니다."
 TRN_planned_economy: "학원경제개발부 권한 강화"
 TRN_planned_economy_desc: "복잡한 경제 구조는 일반 학생들이 이해하기 어려우며, 이를 위한 역량이나 의지도 부족한 경우가 많습니다. 따라서 경제에 대한 전문성을 갖춘 학원경제개발부가 이 역할을 주도적으로 맡게 됩니다. 이들은 공공 부문 전반에 걸쳐 계획 수립 권한을 점차 확대해 나갈 것입니다."
 TRN_confiscation_distribution_collectivization: "몰수, 분배, 집산화"
 TRN_confiscation_distribution_collectivization_desc: "융커들의 토지는 무상으로 몰수되어, 분배 이후 학원이 관리하는 국영 농장으로 재편될 것입니다. 이 과정에서 충돌은 불가피하겠지만, 그것이 현실입니다. 융커들은 자신들의 기득권을 지키기 위해 저항할 것이고, 우리는 그 기득권을 몰수하기 위해 나설 뿐입니다."
 TRN_cooperation_with_junker: "융커와 협력"
 TRN_cooperation_with_junker_desc: "융커들은 이 지역을 가장 잘 이해하는 '이해자’이며, 우리에게는 그들의 협력이 절실합니다. 수많은 농지를 학원 소유로 환원시키기 위해서는 융커들과의 협력과 협상이 필요할 것입니다."
 TRN_revitalization_of_heavy_industry: "서부 공업화"
 TRN_revitalization_of_heavy_industry_desc: "토지 문제의 일부가 해결되면서, 이제 서부 지역의 광활한 대지를 본격적으로 활용할 수 있게 되었습니다. 덕분에 부족했던 공장 수를 채우기 위한 공업화 계획도 본격적으로 추진할 수 있습니다. 여기에 오데르 강을 통한 물자 수송 능력까지 더해진다면, 우리의 공업화는 한층 더 빠르게 가속될 것입니다."
 
 TRN_control_tea_party: "티파티 통제"
 TRN_control_tea_party_desc: "상투스 분파가 무너지며 키리후지 나기사 휘하의 필리우스 분파는 여전히 미소노 미카에 맞서는 몇 안되는 제도적 기둥 중 하나로 남았습니다. 운 좋게도 호스트 선출에서 파테르 분파의 미소노 미카가 당선 되면서 호스트 자리에 오르게 되었습니다. 키리후지 나기사에 대한 정치적 음모를 펼치는 것이 가능해졌습니다. 파테르 분파와 호스트의 권한이라면 키리후지 나기사는 굴복할 수 밖에 없을 것입니다."
 TRN_Mika_basic_law: "미소노 미카 법"
 TRN_Mika_basic_law_desc: "현행 트리니티 헌법은 수백 년 전 제왕적인 호스트의 권력을 견제하고, 티파티와 호스트 간의 상호 견제를 바탕으로 하는 이상주의적 체제를 근간으로 하고 있습니다. 그러나 운명이 내린 축복 아래, 트리니티 대법원은 단순히 법적 체계를 유지하는 것에 그치지 않고, 파테르 분파와 미소노 미카의 지배가 트리니티 헌법이 인정하는 합법적인 체제임을 합리화해야합니다."
 TRN_sect_control: "타 분파의 정치 개입 차단"
 TRN_sect_control_desc: "구호기사단과 시스터후드는 오래전부터 티파티의 정치에 관여하지 않는 관행을 유지해왔지만, 이는 어디까지나 법적 구속이 아닌, 각 분파가 자발적으로 권리를 내려놓은 데에서 비롯된 것이었습니다. 그러나 정치적 지형이 급변한 지금, 그들이 앞으로도 계속 정치에 개입하지 않을 것이라는 보장은 어디에도 없습니다."
 TRN_necessary_revenge: "날개 꺾기"
 TRN_necessary_revenge_desc: "신헌법이 미소노 미카의 우위를 확고히 보장하는 만큼, 이제 다른 분파들을 방관해서는 안 됩니다. 상투스 분파와 필리우스 분파는 이미 무력화되었지만, 시간이 지나면 다시 힘을 회복할 가능성이 있습니다. 그렇기에 우리는 그들의 날개가 다시 움직이지 못하도록 확실한 조치를 취해야 합니다."
 TRN_necessary_revenge_tt: "이 중점은 §Y비파시즘§! 이념의 지지도를 낮출 일련의 §Y사건들§!을 촉발시킬 것입니다."
 TRN_Denazification: "탈나치화 운동"
 TRN_Denazification_desc: "나치의 짧은 집권기 동안 독일 사회는 전체적으로 후퇴 하였습니다. 콕 집어서 말할수 없을 정도입니다. 나치들이 남긴 유산들을 하나 둘씩 정리하고 트리니티의 고유한 문화와 사회 질서를 독일 사회에 불어넣어야 합니다."
 TRN_take_over_the_church: "교회 장악"
 TRN_take_over_the_church_desc: "독일 사회에서 개신교와 가톨릭은 오랜 시간 동안 독일인의 영적 삶에 깊은 영향을 미쳐왔습니다. 그러나 이제는 트리니티의 신앙을 확산시키기 위해, 이러한 전통적 신앙의 영향력을 단계적으로 축소하고 그 자리를 트리니티의 새로운 교의로 대체해 나가야 합니다. 독일인의 영혼과 정신 세계마저 트리니티가 주도해야 합니다."
 TRN_pro_trinity_groups: "친 트리니티 단체 지원"
 TRN_pro_trinity_groups_desc: ""
 TRN_revolution_in_the_spirit: "정신에서의 혁명"
 TRN_revolution_in_the_spirit_desc: "제도적인 교육을 통해 세뇌를 해야 한다는 내용"
 TRN_fate_of_german_culture: "독일의 운명"
 TRN_fate_of_german_culture_desc: "탈나치화와 함께 독일 문화를 타도하고 그 자리에 트리니티적 문화를 심어야 한다는 내용"
 TRN_second_trintiy: "두 번째 트리니티"
 TRN_second_trintiy_desc: "트리니티는 한때 위대한 제1차 공의회의 유산을 계승하였으나, 내분과 변절 속에서 그 유산을 스스로 훼손하였고, 결국 대전이 사태로 인해 붕괴되었습니다. 점차 파테르 분파만이 트리니티를 통합하고 부활시킬 수 있다는 사실이 분명해지고 있습니다. 학생들을 하나로 묶고, 무적의 의지와 파괴적인 힘으로 어떤 위협이든 꺾을 수 있도록 만드는 것. 그것이 곧 우리의 목표이자, 음모이며, 반드시 완수해야 할 사명입니다."
 TRN_Justice_Task_Force_on_leash: "정의실현부 목줄 채우기"
 TRN_Justice_Task_Force_on_leash_desc: "정의실현부는 티파티 산하의 치안 조직이지만, 독자적인 무력을 보유하고 있으며 그 규모는 티파티에 필적합니다. 겉으로는 정치적 중립과 불간섭을 표방하고 있으나, 실질적으로 호스트에게 맞설 수 있는 유일한 세력이기도 합니다. 그런 잠재적 후환을 미리 제거하는 것은 나쁜 건만은 아닙니다..."
 TRN_intelligence_agency: "학원정보원 재편"
 TRN_intelligence_agency_desc: "끔찍했던 유리조노 세이아 암살 사건은 학원정보원이 제 역할을 다하지 못했다는 사실을 여실히 드러냅니다. 정보원장의 무능과 대응력 저하는 이미 명백히 입증되었습니다. 새로운 질서가 형성되는 이 세계에서 정보에서 뒤쳐진다는 것은 곧 죽음을 의미합니다."
 TRM_security_service_of_the_trinity: "트리니티 종합보안국"
 TRN_cause_of_trinity: "트리니티의 대의"
 TRN_cause_of_trinity_desc: "많은 이들은 미소노 미카의 독재적 체제에 반감을 품고, 회의적인 시선으로 지켜보았습니다. 그러나 눈에 띄는 성과들이 나타나고, 트리니티가 실제로 위협에 처해 있음이 드러나며 타 학원들의 음모와 구 체제의 마지막 발악까지 더해지자 점차 '트리니티 사회주의'에 대한 여론도 호의적으로 바뀌기 시작했습니다. 트리니티는 이제 칠흑 같은 어둠을 지나, 새로운 항로를 향해 나아갈 것입니다."
 TRN_The_nature_of_the_united_front: "파테르 분파의 성질"
 TRN_The_nature_of_the_united_front_desc: "파테르 분파 내부에는 다양한 경향이 존재하지만, 크게 두 가지로 나눌 수 있습니다. 바로 트리니티 사회주의자와 트리니티 이념주의자입니다. 이 둘은 서로 극단적으로 상반된 이념을 지니고 있어, 파테르 분파 내에서의 갈등이 끊이지 않고 있습니다. 이제는 이러한 대립을 끝내고, 트리니티의 이념적 목표를 새롭게 정립할 시점입니다. 이를 위해 공식적인 대회를 개최할 예정입니다."
 TRN_cult_of_Mika: "대천사 숭배"
 TRN_cult_of_Mika_desc: "트리니티는 지난 세월 동안 불안정한 민주주의 속에서 방황해왔습니다. 수많은 철인들이 등장하여 트리니티를 이끌었으나, 불안정한 체제는 결국 그들의 한계를 드러내며 붕괴를 맞이했습니다. 그 붕괴의 여파는 트리니티에 재앙으로 닥쳤지만, 쓰라린 상처를 극복하고 트리니티를 부흥시킬 힘을 지닌 유일한 인물은 오직 미소노 미카뿐입니다."
 TRN_cult_of_Mika_tt: "§P사건은 미소노 미카가 대중에게 스스로를 어떻게 묘사할지 그리고 그에 따르는 보너스를 선택할 수 있는 기회를 제공할 것입니다.§!"
 TRN_new_trinity_culture: "트리니티 문화 개조"
 TRN_new_trinity_culture_desc: "트리니티의 문화는 지나치게 사치스럽고 퇴폐적입니다. 평화의 시기가 수백 년이나 지속되었음에도 불구하고 트리니티가 실질적인 발전을 이루지 못한 근본적인 이유는, 바로 이 문화적 퇴보에 있습니다. 우리는 이러한 타락한 문화를 단호히 거부하고, 보다 전위적이며 이념적으로 명확한 문화 예술을 육성해야 합니다. 새로운 시대에 걸맞은 문화야말로 트리니티를 다시 일으켜 세울 원동력이 될 것입니다."
 TRN_new_trinity_culture_tt: "§Y결과는 중점 중에 발생한 사건에 따라 달라질 것입니다.§!"
 TRM_invite_dignitary: "독일 사상가 등용"
 TRM_invite_dignitary_desc: "트리니티 지역에는 여전히 독일 출신의 사상가들이 존재하며, 이들은 이념주의자와 일정한 연관성을 지니고 있습니다. 특히 일부 인물들은 트리니티 고유한 이념에 대한 깊은 이해를 바탕으로, 새로운 혁명의 기수가 될 잠재력을 지니고 있습니다. 그들의 사상은 트리니티의 영원한 정신과 신앙을 보다 역동적이고 민족주의적으로 해석하는 방식으로 나타나고 있습니다."
 TRN_alliance_of_faith: "신앙과 동맹"
 TRN_alliance_of_faith_desc: "트리니티 가톨릭이 트리니티 문명의 핵심적인 부분이라는 점은 부정할 수 없습니다. 국민연합은 모든 종교의 신도들을 포용하고자 하지만 가톨릭과의 편리한 동맹은 평범한 트리니티 학생들과 독일인들의 마음속 깊이 자리 잡은 강력한 동맹이 될 것입니다."
 TRN_Has_Active_TRN_Mika_social_problem_When_Complete_This_Focus_tt: "만약 당신이 $TRN_Mika_social_problem$를 선택하기 이전에 중점을 완료하면 $TRN_Mika_social_problem$에서 더 큰 효과를 얻을 수 있습니다."
 TRN_Fourth_Reich: "기사단국 선언"
 TRN_Fourth_Reich_desc: "기사단국의 선포는 어쩌면 스스로의 모순일 수도 있습니다. 그러나 트리니티는 그 모순을 외면하거나 두려워하지 않습니다. 트리니티의 특수성과 외부 정세의 급변이 맞물리며 탄생한 기사단국은, 강력한 동맹이자 정신적 기반으로서 트리니티 고유의 뿌리를 기꺼이 받아들이고 있습니다."
 TRN_Fourth_Reich_tt: "§g'$TRN_new_culture_militarism_ns$' 국민정신의 효과가 두배로 늘어납니다.§!"
 TRN_student_solidarity: "학생연대 강화"
 TRN_student_solidarity_desc: "트리니티의 근간이자 뿌리인 '학생 연대'는 기독교적 교리와 가치를 바탕으로 점차 확대되어 왔습니다. 이 사회는 전능한 폭군에 대한 맹목적인 복종이 아닌, 정의와 연대, 자유와 법치를 통해 이루어지는 학생들의 자율적 조직 위에 번영을 이룹니다. 트리니티의 학생들은 언제나 그러한 사회를 꿈꿔왔습니다. 그것은 특정 계급이나 분파가 아닌, 기독교적 사랑이라는 원칙 위에 세워진 공동체입니다"
 TRN_student_solidarity_tt: "§g'$TRN_new_culture_culture_technology_ns$' 국민정신의 효과가 두배로 늘어납니다.§!"
 TRN_Integrity_of_Trinity: "트리니티의 무결성"
 TRN_Integrity_of_Trinity_desc: "수백 년 전의 적을 꺾고 탄생한 미소노 미카의 ‘두 번째 트리니티’는, 모든 일반 학생들이 하나로 뭉쳐 이루어낸 유기체와도 같은 존재입니다. 이 새로운 트리니티는 과거의 영광에 얽매이지 않고, 현재의 필요를 직시하며, 위대하고 메시아적인 미래를 향해 나아갈 것입니다. 세계가 정신적 계몽의 새로운 시대로 나아가도록 이끄는 것 그것이 바로 트리니티의 사명입니다."
 TRN_savior_of_kivotos: "키보토스의 구세주"
 TRN_savior_of_kivotos_desc: "트리니티의 사명은 단지 스스로를 구하는 데 그치지 않습니다. 그것은 키보토스 전체를 구원하기 위한 것입니다. 증오로 가득 찬 지구 현지인들과, 역병처럼 퍼진 온갖 이념들은 제쳐두고 우리는 이 모든 증오를 뿌리 뽑아야 하는 도덕적 사명을 지니고 있습니다. 이제 다음, 그리고 마지막 전쟁을 위한 준비가 시작될 것입니다. 영웅이 쓰러지고, 어둠이 걷힌 그 끝자락 스러져가는 여명의 빛 속에서 우리는 또 하나의 아름다운 신세계를 건설해야 합니다."
 TRN_savior_of_kivotos_2: "키보토스의 구세주"
 TRN_savior_of_kivotos_2_desc: "트리니티의 사명은 스스로를 구하는 데 그치지 않습니다. 그것은 키보토스 전체를 구원하기 위한 것입니다. 증으로 가득 찬 지구 현지인들과, 역병처럼 퍼진 온갖 이념들은 제쳐두고 우리는 이 모든 증오를 뿌리 뽑아야 하는 도덕적 사명을 지니고 있습니다. 이제 다음, 우리가 양떼를 몰지어니, 증오로 가득 찬 지구 현지인들에게서 키보토스만의 고유한 가치들을 보호해야 합니다."
 TRN_codification_of_regime: "정권 성문화"
 TRN_codification_of_regime_desc: "파테르 분파와 국민연합은 학원이라는 수레를 끄는 두 마리의 말이며, 미소노 미카는 그 수레의 기수입니다. 이제 더 이상 불안정한 의사결정도, 갈피를 잡지 못한 방황도 없을 것입니다. 두 공동체와의 협력은 유례없는 수준으로 공고해졌고, 우리는 이를 바탕으로 학생들과 국민 모두에게 보다 안정적이고 풍요로운 삶을 제공할 사명을 띠고 있습니다. 이것은 선택이 아니라, 우리 모두에게 주어진 시대적 사명입니다."
 TRN_supreme_leader: "최고지도자"
 TRN_supreme_leader_desc: "파테르 분파와 국민연합은 더 이상 우리의 길에 도움이 되지 않는다는 사실이 명백해졌습니다. 그들은 이제 결정의 흐름을 방해하는 오래된 그림자일 뿐이며, 더는 좌시할 이유조차 없습니다. 그 존재의 명분은 스스로 무너졌고, 미소노 미카는 마침내 '지도자'라는 허울을 벗은 채, 새로운 차원의 존재로, 그리고 숙명처럼 도래한 폭군으로 다시 태어날 것입니다."
 TRN_michael_and_warriors: "대천사의 전사들"
 TRN_michael_and_warriors_desc: "대천사 미소노 미카의 전사들은 언제나 부름에 응답할 준비가 되어 있으며, 결코 싸움을 피하지 않습니다. 그들은 오직 전투를 위해 존재하며, 미소노 미카는 그들을 이끄는 목자입니다. 사자의 발 아래에서 길러진 이 전사들은 반드시 승리를 가져올 것입니다."
 TRN_horseman_of_the_apocalypse: "묵시록의 기수"
 TRN_horseman_of_the_apocalypse_desc: "트리니티는 더 이상 단순한 학원이 아닙니다. 그것은 살아 숨 쉬는 유기체이며, 종말을 몰고 오는 말과도 같은 존재입니다. 그리고 그 위에 올라탄 기수, 바로 대천사 미소노 미카께서는 정복자이자 황제, 전쟁의 상징이십니다. 트리니티는 죽음이며, 미카는 그 죽음을 인도하는 영광의 기수입니다."
 TRN_project_trinity: "'성부' 계획"
 TRN_project_trinity_desc: "성부(Pater) 계획은 트리니티 종합학원에서 추진 중인 가장 비밀스럽고 강력한 프로젝트입니다. 이 계획의 핵심은 기존에 보유하던 미사일 기술을 역설계하여 새롭게 개발된 중거리 탄도미사일에 있습니다. 이 미사일은 총 6개의 탄두를 탑재하고 있으며, 낙하 시 각 탄두가 독립적으로 목표를 타격하도록 설계되어 있습니다."
 TRN_destiny_of_trinity: "트리니티의 운명"
 TRN_destiny_of_trinity_desc: "수백 년 전, 트리니티는 분열되어 서로에게 칼을 겨누는 비극을 겪었습니다. 그러나 이제는 다릅니다. 선지자들이 나타나 흩어진 트리니티를 다시 하나로 묶었고, 그 통합은 오늘날 모든 학원이 본받아야 할 모범이 되었습니다. 우리는 그 역사 속 선지자들처럼, 여전히 서로에게 등을 돌리고 있는 학원들을 하나로 묶을 운명을 지니고 있습니다."
 TRN_legacy_of_the_prophets: "선지자들의 유산"
 TRN_legacy_of_the_prophets_desc: "선지자들이 우리에게 남긴 것은 칼과 불이 아닙니다. 그들이 전한 것은 진정한 평화, 사랑, 그리고 굳건한 유대였습니다. 트리니티는 피와 철로 이루어진 학원이 아니라, 연대와 이해, 그리고 신앙 위에 세워진 이상입니다. 우리는 선지자들의 뜻을 계승해야 합니다 그 유산은 전쟁이 아니라 평화이며, 정복이 아니라 공존입니다. "
 TRN_sheep_and_shepherd: "양떼와 목자"
 TRN_sheep_and_shepherd_desc: "양떼와 목자는 서로에게 없어서는 안 될 존재입니다. 유목의 길에는 언제나 양떼가 필요하고, 양떼는 늘 목자의 보호를 필요로 합니다. 대천사 미소노 미카는 자신의 양떼를 위해 기꺼이 목숨을 내놓을 각오가 되어 있으며, 그들에게 사랑과 헌신으로 보살핌을 아끼지 않습니다. 양떼는 목자의 인도 아래에서 안식과 평화를 얻고, 행복한 삶을 영위하게 될 것입니다. 이는 믿음과 책임으로 맺어진 성스러운 유대입니다."

 TRN_kivotos_dip: "키보토스 외교"
 TRN_kivotos_dip_desc: "트리니티 내부의 정치적 위기가 어느 정도 수습되면서, 이제 시선은 학원 내부가 아닌 외부로 향하고 있습니다. 더 이상 내부 문제에만 몰두할 수 없는 시점이 온 것입니다. 특히 최근 벌어진 일련의 사건들은 트리니티에 새로운 기회가 될 수도, 혹은 치명적인 위협이 될 수도 있습니다. 이제 우리는 선택하고 행동해야 합니다. 방관할 여유는 없습니다."
 TRN_eden_accord: "에덴 협정 형성"
 TRN_eden_accord_desc: "대전이 사태는 트리니티의 이상주의적 세계관을 철저히 무너뜨렸고, 그 여파로 트리니티는 점차 급진적인 노선을 걷게 되었습니다. 그러나 혼란 속에서 등장한 미소노 미카는 무너진 신념의 폐허 위에 다시금 ‘트리니티적 세계'를 약속했습니다. 총학생회의 키보토스 연합과는 다른, 오직 트리니티만의 고유한 세계관을."
 TRN_creation_of_faction: "에덴 협정 형성"
 TRN_establish_a_customs_union: "경제 연합 수립"
 TRN_establish_a_customs_union_desc: "에덴 협정은 본래 군사 동맹에 중점을 두었지만, 이제는 경제 분야에도 관심을 기울여야 합니다. 특히 학원 간 협력뿐만 아니라 다양한 국가들과의 연계를 위해서는 경제 연합의 수립이 필요합니다."
 TRN_divine_mandate: "신성통치령 계획"
 TRN_divine_mandate_desc: "‘신성통치령’이라는 개념은 본래 트리니티 종합학원이 각지의 부지를 효율적으로 관리하기 위해 설립한 총독 체제에서 유래하였습니다. 이 개념은 트리니티가 정복한 영토들을 효율적으로 관리하기 위해서 일부 수정을 거친 뒤 실행 될 것입니다."
 
 TRN_impossible_to_coexist: "공존할 수 없는 자들"
 TRN_impossible_to_coexist_desc: "게헨나와의 전쟁은 트리니티에게 있어 피할 수 없는 숙명입니다. 이는 과거 선조들이 입었던 상처에 대한 복수이자, 전 트리니티를 위한 성전에 해당합니다. 그러나 그러한 숙명적인 전쟁조차도 철저한 준비 없이는 성공할 수 없습니다. 현재 ‘성 미카엘’이라는 암호명 아래 추진 중인 서부를 향한 대공세는, 키보토스 역사상 유례없는 규모의 작전으로 계획되고 있으며, 정밀한 전략과 작전 구상이 그 어느 때보다 요구되고 있습니다."
 TRN_spiritual_warfare: "영적 전쟁"
 TRN_spiritual_warfare_desc: "드디어 트리니티의 굴욕을 되갚아줄 때가 되었습니다. 게헨나의 만마전과 선도부는 이 곳 이계에서 무너질 것이고, 우리는 게헨나의 부지 전체에 우리의 깃발이 휘날릴 때까지 쉬지 않을 것입니다. 위대한 [TRM.GetName]이여, 최후의 투쟁을 위해 일어나라!"
 TRN_alliance_with_devil: "...악마와 동맹?"
 TRN_alliance_with_devil_desc: "흥신소는 최근 만마전을 불법 정부로 규정하고, 스스로를 ‘최후의 게르만 국가’라 칭하며 게헨나는 물론, 모교인 트리니티까지 영유권을 주장하고 나섰습니다. 겉보기에는 분명 우리의 적처럼 보일 수 있지만, 현실은 조금 더 복잡합니다. 그들이 만마전이라는 장애물을 넘기 전까지는, 우리와의 이해관계가 일시적으로 일치할 수 있습니다. 그런 점에서, 이들과의 한시적인 동맹은 충분히 고려할 만합니다."
 TRN_union_with_gehenna: "우리만의 '에덴 조약'"
 TRN_union_with_gehenna_desc: "총학생회장이 추진했던 트리니티와 게헨나 간의 평화 협정, 이른바 '에덴 조약'은 이미 오래전에 그 의미를 잃었습니다. 그러나 이제 상황은 완전히 달라졌습니다. 트리니티가 게헨나를 점령한 지금, 다시금 '에덴 조약'이라는 이름이 역사 속에서 호출될 순간이 다가오고 있습니다. 이번에는 더 이상 허울뿐인 평화가 아닙니다. '트리니티 방식'의 에덴 조약—그것은 굴복과 통합, 그리고 완전한 지배를 의미할 것입니다."
 # 붉은겨울 외교
 TRN_northern_kivotos_diplomacy: "북방 외교"
 TRN_northern_kivotos_diplomacy_desc: ""
 TRN_denmark_or_war: "덴마크 요구"
 TRN_denmark_or_war_desc: ""
 TRN_use_of_nordic_association: "노르드 협회 이용"
 TRN_use_of_nordic_association_desc: ""
 TRN_winter_warfare: "겨울 준비"
 TRN_winter_warfare_desc: "[RED.GetNameDef] 측의 지형은 트리니티에게 낯설고 가혹한 환경입니다. 숲이 울창하고 기온은 극도로 낮으며, 기존의 전술이 통하지 않을 위험이 있습니다. 이러한 악조건 속에서는 작은 실수 하나가 큰 손실로 이어질 수 있습니다. 우리는 방한복을 대량 제작하고, 혹독한 겨울에 대비해 철저한 준비를 갖춰야 합니다."
 TRN_finland_focus: "[FIN.GetNameDef] 측과 협력"
 TRN_finland_focus_desc: "[FIN.GetNameDef] 측은 [RED.GetNameDef]과 긴 국경을 맞대고 있습니다. 만약 우리가 이 국경 지대에 접근할 수만 있다면, 북쪽에서 밀려오는 붉은 위협을 효과적으로 일소할 수 있을 것입니다. 이는 미래에 우리가 [RED.GetAdjective] 측과 전쟁에 돌입하게 될 경우, 전략적 거점 확보라는 점에서 매우 중요한 의미를 가집니다."
 # 남키보토스 
 TRN_support_HYA: "백귀야행과 협력 확대"
 TRN_support_HYA_desc: "백귀야행과 트리니티 간의 협력은 대전이 사태 이전부터 이어져 온 관계로, 정권 교체 이후에도 그 유대는 지속되고 있습니다. 특히 다양한 분야에서 백귀야행과의 협력을 더욱 확대한다면, 남키보토스 지역에서 전략적으로 중요한 동맹을 확보할 수 있을 것입니다."
 TRN_find_new_allies: "새로운 동맹 찾기"
 TRN_find_new_allies_desc: ""
 TRN_shanhaijing_tea_leaf_export: "[SHA.GetAdjective]으로 찻잎 수출 확대"
 TRN_shanhaijing_tea_leaf_export_desc: ""
 TRN_secure_hungary: "[HUN.GetNameDef] 무역 제재"
 TRN_secure_hungary_desc: "대전이 사태로 구세계 질서가 붕괴하자, [HUN.GetNameDef] 측은 자국의 영유권을 주장하며 주변 국가들을 침략하기 시작했습니다. 심지어 산해경을 포함한 키보토스에 대한 영유권까지 주장하며, 전쟁도 불사하겠다는 태도를 보이고 있습니다. 이러한 행위는 결코 좌시할 수 없으며, 그들에게 반드시 대가가 따른다는 사실을 분명히 인식시켜야 합니다."
 TRN_braeking_abydos: "[ABY.GetNameDef] 위협 분쇄"
 TRN_braeking_abydos_desc: "아비도스는 현지인들과 적극적인 협력을 통해 다민족적인 연방 학원을 목표로 삼아 국가를 운영하고 있습니다. 이러한 다민족적인 프로파간다는 트리니티의 독일인들이 동요 할 수 있습니다. 이러한 위협은 조기에 분쇄해야 합니다.."
 TRN_balkan_dip: "발칸에 영향력 행사"
 TRN_balkan_dip_desc: ""
 # 아리우스
 TRN_catch_tail: "꼬리 잡기"
 TRN_catch_tail_desc: "학원방위대의 끈질긴 노력 끝에, 트리니티 종합학원에 숨어 있던 반역 분자들이 드러났습니다. 이들은 조용히 우리 학원을 갉아먹으며, 기회만 되면 등 뒤에 칼을 꽂을 준비를 하고 있었습니다. 그러나 그들의 계획은 여기서 끝입니다. 정의실현부와 학원방위대는 단호한 조치로 이들을 뿌리까지 박멸할 것입니다."
 TRN_annex_the_bandit_states: "도적 국가 동화"
 TRN_annex_the_bandit_states_desc: "아리우스를 비롯한 나치 잔당들은 도적 무리처럼 흩어져 다니며 트리니티에 크고 작은 피해를 주고 있습니다. 그러나 이들의 저항은 체계적인 조직력이나 명확한 목표 없이 산발적으로 이루어지고 있으며, 이는 곧 우리가 이들을 충분히 통제하고 동화시킬 수 있다는 가능성을 보여줍니다."
 TRN_religious_conversion: "'개종'"
 TRN_religious_conversion_desc: "아리우스 출신 인물 중 특히 하카리 아츠코는 트리니티와의 화평을 적극적으로 주장해 온 인물로, 이는 그녀가 속한 스쿼드 내에서의 갈등으로도 드러났습니다. 트리니티는 그녀의 '전향'을 긍정적으로 평가하며, 이를 계기로 아리우스와의 수백 년에 걸친 원한을 마침내 씻어낼 준비가 되어 있습니다."
 TRN_influence_the_baltics: "발트에 영향력 행사"
 TRN_influence_the_baltics_desc: "[TRM.GetAdjective]와 [SOV.GetAdjective] 사이에 위치한 발트 국가들은 지리적으로 매우 불안정한 위치에 놓여 있습니다. 약간의 외교적 압박과 설득만으로도, 이들을 [TRM.GetAdjective]의 영향권으로 끌어들일 수 있을지도 모릅니다."
 TRN_invasion_baltics: "발트해 장악"
 TRN_invasion_baltics_desc: "아리우스 분교가 위치한 단치히는 발트해의 전략적 요충지로, 이 지역을 통해 발트해 전체의 해상 패권을 장악할 수 있습니다. 그러나 아직까지 트리니티는 이 해역에서 완전한 지배력을 확보하지 못한 상황입니다. 이러한 공백은 주변 발트 국가들을 트리니티의 영향권 아래에 두는 방식으로 극복할 수 있을 것입니다."

 TRN_defiance_of_COU: "총학생회 권위에 대한 도전"
 TRN_defiance_of_COU_desc: "총학생회는 새로운 세계에서 그 무능함을 여실히 드러냈으며, 총학생회장의 실종과 그 이후 연이어 발생한 사건들은 학생회에 대한 신뢰를 뿌리째 흔들어 놓았습니다. 더 이상 이러한 권위는 트리니티 위에 군림할 수 없습니다. 우리는 이에 맞서, 그들에 대한 저항으로서 역성혁명을 일으킬 것입니다."
 TRN_extinguish_the_flame: "불꽃 끄기"
 TRN_extinguish_the_flame_desc: "밀레니엄은 여전히 모교에 중대한 위협이 되고 있으며, 그들의 기술력은 마치 우리의 턱 밑에 칼날을 들이대는 형국입니다. 이와 같은 기술 패권은 더 이상 묵과할 수 없으며, 반드시 제어되어야 합니다."
 TRN_curtain_across_kivotos: "키보토스에 펼쳐진 장막"
 TRN_curtain_across_kivotos_desc: "트리니티 정권의 목표가 달성된 이상, 키보토스에서의 전쟁은 더 이상 의미를 갖지 않습니다. 우리는 전쟁을 통해 막대한 피해를 입었으며, 이제는 그 상처를 복구하고 재건하여 다시 한 번 위대한 평화의 시기로 나아가야 할 때입니다."
 TRN_invasion_kaiser: "[KAI.GetNameDef] 체제 해체"
