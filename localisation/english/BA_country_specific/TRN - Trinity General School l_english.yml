 TRN_nagisa_kirifuji_democratic_bad_ending_leader_desc: "Nagisa Kirifuji did not choose long-term rule merely because she was intoxicated by power. Nagisa judged that one person must be sacrificed to protect those precious to her. If she lays down her power, Nagisa herself would be at ease. But what if a wicked person seizes power afterward? What if the Filius regime collapses? Would Nagisa be able to protect her precious people then?\n\nNagisa achieved infinite success through a new politics of trusting others and embracing everyone with love. However, 'to trust, one must doubt others.' Political rivals attempting to seize the regime must be investigated, and potential enemy nations must be constantly monitored. Only after everything is proven 'safe' can Nagisa truly trust them.\n\nThe bonds built before the Great Transfer, and the new bonds formed after it. The only one who can protect them all is Nagisa Kirifuji. Nagisa considers fulfilling the role of a guardian for those close to her as her final mission. Who else but Nagisa could carry such a heavy burden?"
 TRN_hifumi_ajitani_leader_desc: "Hifumi Ajitani truly did not want to enter politics. Her small and modest dream was simply to assist Trinity Host Nagisa Kirifuji and remain her friend. However, Nagisa Kirifuji did not allow that. 'I have become rusted and changed while engaging in political activities, but my precious Hifumi-san will never be like that.' Nagisa purely believes so. The problem is that her belief lacked the process of asking Hifumi for her own will.\n\nHowever, Hifumi is striving to unfold 'her own politics' under Nagisa's shadow. Just as Nagisa had old friends in the Tea Party, Nagisa Kirifuji still remains by Hifumi's side. The driving force that allows Hifumi to endure the role of Host—a garment that does not fit her—is that her most precious friend is showing her the path she must take.\n\nTherefore, although she is a Host without any distinct color, Hifumi Ajitani moves forward step by step to find her future. Toward the future."
 TRN_hifumi_ajitani_faust_leader_desc: "Nagisa abandoned Hifumi. Hifumi thought she could endure the unwanted position of Host as long as Nagisa was by her side, but Nagisa concluded that she should not be in the Host's office so that Hifumi could stand alone. But did Hifumi think so too?\n\nHifumi was unable to form proper human relationships due to the Great Transfer incident overlapping with her school years. She was in the After-School Sweets Club right before the Great Transfer, and afterward, she only took remote classes via BD. Her only support was Nagisa, and the moment Nagisa let Hifumi go, she was left alone.\n\nHifumi Ajitani is now trapped in a closed world that no one visits, staining herself in black. Nagisa Kirifuji's final words as she left politics—'The Filius branch will be on your side'—are the ultimate testament moving Hifumi now. If the Filius branch is on her side, it means everyone who isn't Filius is Hifumi's enemy, doesn't it? Following that easy dichotomy, Hifumi doubts everyone. Isn't that the only way to survive? After all, doubting others, hating rivals, and dividing people are the virtues of a politician.\n\nThus, Hifumi will be able to become a politician who surpasses Nagisa."
 TRN_seia_yurizono_nagisa_route_leader_desc: "For Seia, this term as Host is her second. And, among the countless futures Seia has seen, it is a 'second Host term' that has never existed even once. Seia's sweet future plan to remain just a NEET and a free person, living the rest of her life comfortably after awakening from the brink of death, was frustrated. However, Seia was not particularly frustrated. For Seia, returning to the position of Host is a service of offering her abilities for the many people of Trinity, and a form of atonement for the two people she hurt and made cry: Mika and Nagisa.\n\nNow no longer the 'head of the Sanctus branch,' and with Sanctus itself having vanished, Seia intends to create a free future in Trinity with her new colleagues from Filius—a future she never once predicted. It is about preserving the legacy left by Nagisa Kirifuji and ensuring it continues to the next generation. Under her rule, Trinity may not become 'greater.' However, those who live in Trinity will become more prosperous.\n\nIf not Seia Yurizono, then who would take on this task?"
 TRN_mine_aomori_nagisa_route_leader_desc: "As the head of the Johan branch, Mine Aomori never intended to devote herself to politics for even a moment before the Great Transfer. To her, politics was merely a trap that dulled the will of relief to protect others. Let the noble three branches of the Tea Party handle politics; Johan would save the poor and hungry. Her heart wavered only because of Seia Yurizono's direct request for her to enter politics.\n\nMine owed a debt of heart to Seia. Because she had hidden Seia in an isolated place for her safety, she had seen Nagisa's sorrowful state. Mine challenged politics because of her debt to Seia and truly realized why she had refused to enter the Tea Party so much before the Great Transfer.\n\nMine has become the Host of the Tea Party, the center of all wealth and power in Trinity. She is slowly adapting to a comfortable life. However, Mine intends to never forget one thing: 'Conviction and pride, in the heart.' Even if she becomes unable to recall what that conviction she tried to protect was, she will at least remember that sentence which was once her everything."
 TRN_ako_amau_leader_desc: "For Ako, nationalities like Trinity or Gehenna were not particularly important. At the end of Ako's gaze, there was always Hina Sorasaki. When she said 'Gehenna is right,' Ako was the senior administrative officer of the Gehenna Prefect Team, and when she said 'Trinity is right,' she was merely the inspector of the Trinity Tea Party. Isn't a great knight supposed to simply follow the footsteps of their lord?\n\nHowever, before she knew it, the person the knight had to protect was no longer just her lord. After the integration of Gehenna, Ako gradually became acquainted with many people from the Filius branch, and the number of people she 'wanted to protect' grew. Now, sitting in the Tea Party Host's office, Ako reflects on her new duties. To protect Trinity and safeguard the legacy created by Nagisa Kirifuji for the next generation. It is for her precious lord, but also for the new bonds she found in Trinity.\n\nAko will neither dismantle the unified federation as Gehenna's separatists expect, nor hand over the regime through misgovernment as Pater's radicals hope. Perhaps, in this land where disorder and chaos do not exist, Ako might do even better than she did as a senior administrative officer. After all, even if where one stands changes, a knight's mission never has."
 TRN_atsuko_hakari_leader_desc: "From being a 'sacrifice' for the Arius Student Council President Beatrice to becoming the Host at the center of the Trinity Tea Party, Atsuko Hakari's life is an epic in itself, enough to fill several biographies. From the Ancient Council of Trinity to modern times, there has never been anyone who rose from the lowest place to the most noble position like Atsuko Hakari.\n\nAtsuko does not believe she could become Host solely because she was outstanding. She was able to stand in this position because she had the luck of being Arius 'Royal Blood,' because of Trinity's tolerant culture, and because many in Filius trusted her. Therefore, Atsuko wants to use her abilities even more for those 'who had great abilities but no opportunity to display them.'\n\nShe may not be able to tear down Trinity's high walls of social status. However, she can ensure that the poor girls of old Arius and the rural children of Trinity receive a new education. If the next generation, and the one after that, passes in such a way, a new generation that has learned and gained ability will change Trinity. Just as Atsuko changed the world."
 TRN_takane_miyoshi_leader_desc: "Catastrophe. Despair. Dystopia. No negative word can truly express this feeling. The identity of a 'fake Archduchess' deceived everyone in Trinity and made her the leader of Trinity. Praise Archduchess Takane Miyoshi, the noble survivor of the Winter Kingdom! Of course, Takane is not relaxed enough to simply enjoy this situation. If this fact were discovered, it is certain she would become the enemy of all Trinity.\n\nTakane must turn this story into a 'perfect lie.' She must become a leader more outstanding than anyone else, making Trinity the greatest. That is the only way to prevent anyone from daring to dig into Takane's past. Even with such effort, if she fails? Then she will have to prepare to flee across the border."

 TRN_sakurako_utazumi_nagisa_route_leader_desc: "Sakurako Utazumi is not someone who particularly seeks power. Her motivation for preventing the coup was not personal desire, but rather a disagreement with the path Nagisa Kirifuji was taking. Sakurako judged that overthrowing the 'Nagisa Dictatorship,' which was gradually turning Trinity into a closed dictatorial system and excluding other branches, was consistent with the Sisterhood's limited political interventionism.\n\nHowever, it remains uncertain what path Trinity will take after the coup. Sakurako promised to remain only as an advisor who gives advice to the Tea Party Host instead of taking the position of Host herself, but all Trinity intellectuals know that the 'advisor' role signifies a political power broker. Only the Sisterhood and its nuns will know the direction in which Trinity, controlled by religious figures, will move."
 
