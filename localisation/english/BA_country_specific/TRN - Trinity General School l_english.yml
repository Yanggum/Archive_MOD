 trinity_events.1.t: "The Tea Party"
 trinity_events.1.desc: "The Tea Party is a coalition of the Sanctus, Filius, and Pater branches, serving as the core supreme governing body in Trinity's triumvirate system. Each branch is structured to balance one another through checks while complementing each other's weaknesses. Among them, the head of one branch serves as the 'Host' of the Tea Party, wielding immense power. However, the system of checks and mutual complement within the Tea Party prevents the abuse of power by the Host and suppresses political radicalism, enabling stable governance.\n\nYears ago, a radical and warmongering head of the Pater branch ascended to the position of Tea Party Host. This heightened tensions with Gehenna Academy and led to the Host Crisis.\n\nUltimately, the situation led to the Filius and Sanctus branches uniting to pass a vote of no confidence against the Host. While the resolution was accepted, it left a deep wound on the pride of the Pater branch. These conflicts remain unresolved even after Mika Misono's attempt to promote the pardon of Pater branch combatants imprisoned for war crimes against prisoners during the 1935 Great Transfer was thwarted.\n\nNow, even fate seems to favor the Pater branch. The Pater branch raised allegations of bribery against Nagisa Kirifuji and urged an investigation by judicial authorities. Based on testimony and materials from 'reliable informants,' the prosecution indicted Nagisa Kirifuji on charges of breach of trust. Although it is regrettable that it wasn't bribery, Nagisa Kirifuji officially announced her resignation to prevent the branch from being affected, and major figures of the Filius branch were also largely replaced in the wake of this judicial investigation. Even the few remaining individuals are destined to be effectively neutralized under the influence of the Pater branch."
 trinity_events.1.a: "Everything is according to the charter."
 trinity_events.2.t: "Basis Schola Protests"
 trinity_events.2.desc: "As the Pater branch effectively seizes control of the Tea Party and the Supreme Court, the final barriers capable of checking Mika Misono's dictatorship are crumbling. The Filius and Sanctus branches are expressing outrage at their inability to stop Mika Misono's radicalism, and the indictment of Nagisa Kirifuji in particular has served as a catalyst for large-scale protests.\n\nAnother protest has erupted in Basis Schola, with many Filius supporters lashing out at Mika Misono, calling her a 'tyrant obsessed with destroying the essence of Trinity.'"
 trinity_events.2.a: "Let them protest if they must."
 trinity_events.2.b: "Send the Justice Task Force to disperse them."
 trinity_events.3.t: "Trinity General School Charter of [GetYear]"
 trinity_events.3.desc: "Strictly speaking, amending the Trinity Charter requires the consent of two-thirds of the Tea Party, and the amendment must be submitted to the Supreme Court. While there is no doubt that this charter was created with noble intentions and possesses timeless authority, it suffers from the problem of making even the most minor charter reforms excessively complex and tedious. Had the charter been perfectly designed, these issues might be less severe, but the reality is otherwise.\n\nFaced with the Pater branch, which has already seized the Tea Party and the Supreme Court, there is little other institutions can do. However, to grant legitimacy to their dominance, the Pater branch has officially proclaimed the 'Trinity General School Charter Amendment.' This was passed by the authority of the Pater-controlled Tea Party and effectively nullified the Trinity General School Charter of [GetYear]. This amendment will be recorded as the last law passed through the Tea Party."
 trinity_events.3.a: "No one can stop us!"
 trinity_events.4.t: "The Mika Misono Charter"
 trinity_events.4.desc: "Despite its title as the '5th Amendment to the Trinity General School Charter,' the Mika Misono Charter is a massive legislative package designed to transform Trinity into a new quasi-charter state alongside imperial Host powers. Many clauses are written vaguely enough that actual rulings can be left to the arbitrary interpretation of officials and judges. Almost all safeguards of the Trinity triumvirate have been removed, and property regulations have likewise been changed so that the state can easily nationalize all property related to 'anti-national activities.'\n\nUpon news of the ratification, Pater branch representatives in the Tea Party gave thunderous approval, followed by celebratory festivities in public marches hosted by Pater branch cadres across Trinity. Reactions from other branches were much colder, with even some moderate figures within Mika Misono's Pater branch forced to wait and contemplate just how far her ambitions would go."
 trinity_events.4.a: "Trinity stands alone!"
 trinity_events.5.t: "The Last Free Speech"
 trinity_events.5.desc: "Amidst the Pater branch's solo run, other branches have begun to realize the severity of the ongoing legal changes. Sharing a sense of crisis that Trinity might degenerate into a de facto one-party state, they moved to unite and check the Pater branch's dominance. However, the Pater branch became hostile toward these allied forces, and the situation steadily worsened.\n\nIn the midst of this, Wakana Arahata, the head of the Filius branch, took the microphone and began her speech.\n\n\"In this hour of destiny, we, the Filius branch, solemnly swear to the principles of humanity, freedom, and justice. Mika Misono has torn down the great achievement of the First Council, which united Trinity and opened a better future and world for the first and only time in history. Hundreds of thousands of brave Trinity students sacrificed their lives to protect freedom. Mika Misono and the Pater branch surely know this sacrifice and cause better than anyone. Yet, they are the ones betraying that very cause.\n\nNo law grants the authority to destroy eternal and immortal convictions. Their actions now are no different from those of terrorists without conviction. But we will never forget the path our ancestors started at the First Council and will remain faithful to it. Tyrants never last long. So, do not succumb to this despair. Let us clap together for an eternally immortal Free Trinity!\"\n\nFollowing Wakana Arahata's speech, other branches staged protest rallies at the Tea Party building to express their resistance. However, it only made them realize the reality that this was all they could do. Outside the Tea Party building, protests demanding respect for students' rights continued, but even these were merely expressions of misplaced anger toward reality."
 trinity_events.5.a: "That was quite refreshing."
 trinity_events.6.t: "Two Months Ago"
 trinity_events.6.desc: "With the outbreak of the Great Transfer, the fundamental foundations of Trinity collapsed, and it was mercilessly thrown upon a new land. This shock was more than mere confusion; it was an unprecedented crisis threatening the very existence of Trinity. Immediately after the incident, Trinity General School entered a fierce battle with the German Reich. Though they emerged victorious after a desperate struggle, the numerous tragedies and incidents that occurred during this process left deep scars on the Trinity students and were enough to radicalize their dispositions. The war collapsed Trinity's ideals and order. Anger and distrust spread among the students, and all indicators spiraled toward the worst-case scenario. Victory was achieved against the German Reich, but resistance forces continued to operate in the southeast and north, maintaining tension.\n\nPater branch did not miss this opportunity. They began to focus on propaganda media, exploiting the distrust and tension remaining among the wounded people. Propaganda materials criticizing the Filius and Sanctus branches for claiming a hollow peace were produced and intensively exposed to the general student body. As a result, a large number of students became fanatical followers of the Pater branch. Starting from this, the Pater branch was able to exert strong influence even over the Tea Party.\n\nThe Filius and Sanctus branches also took action. They strove to prevent the dissemination of distorted and false information, but the Pater branch's schemes had already surpassed expectations and were exerting a deep influence throughout Trinity.\n\nThus, the New Year of 1936 was welcomed amidst resignation and fear."
 trinity_events.6.a: "And so it begins."
 trinity_events.7.t: "Host Election"
 trinity_events.7.desc: "The aftermath of the crisis that swept Trinity hasn't completely vanished, but the situation is slowly entering a phase of stabilization. While the remaining scars and confusion still plague us, fortunately, the declining indicators have stopped their downward trend. Now, Trinity's future rests on the judgment and leadership of the next Host.\n\nThe Tea Party that leads Trinity is composed of three giant branches: Sanctus, Filius, and Pater. There are other branches, but they are currently refusing to intervene in politics for their own reasons. The emergency meeting is currently in the process of dissolving, and Seia Yurizono of the Sanctus branch has been appointed as the next Host.\n\nSeia Yurizono was originally evaluated as a figure who adhered to a moderate and conservative stance, aiming for gradual change in Trinity through pragmatic diplomacy. However, after experiencing the Great Transfer and its subsequent tragedies, a psychological change seems to have come over her. At the recent Sanctus branch convention, she called for much more radical action than in the past and made remarks that could sound somewhat rude at times. Nevertheless, her arguments were evaluated as textbook correctives based on solid logic and evidence, establishing them as the major policy direction of the Sanctus branch.\n\nHowever, some Sanctus branch officials strongly criticized Seia Yurizono, claiming she had become corrupt. Despite this, such backlash did not reach the point of changing the Sanctus branch's primary policy direction."
 trinity_events.7.a: "Still, there is time."
 trinity_events.8.t: "The Princess in the Attic"
 trinity_events.8.desc: "Mika Misono was working in her office until late at night. Her office was decorated with portraits of former Pater branch heads on the walls and filled with luxurious and classical ornaments. A secretary brought a report on the current situation, but Mika showed little reaction. There were too many matters for her to consider, such as the movements of the Sisterhood and the political lines of other branches.\n\nPausing her work for a moment, Mika went to the window and looked out at the distant sky. The night wasn't as bright as Kivotos, but numerous stars adorned the dark night sky. She remained lost in thought for a while, retracing her plans. Although some parts of the plan had gone awry, as long as the current flow continued, there was no possibility of failure. She told herself so.\n\nAs the head of the Pater branch, Mika felt an instinctive sense of crisis that time was running out. She knew all too well that the more action was delayed, the more plans would falter, and the greater the risk that disloyal individuals would hatch plots in the gaps. Furthermore, the students were despising the Pater branch for not taking action, viewing them as incompetent and filthy beings who didn't know how to seize an opportunity. Those gazes were closing in on her.\n\nHowever, Mika was certain. Someday, the Pater branch's time would come. For now, the top priority was to remove all threats and eradicate their roots on the path toward absolute power. Her determination was firm, and her plans did not waver. No, they must not waver."
 trinity_events.8.a: "And fate was on our side."
 trinity_events.9.t: "Three Gunshots"
 trinity_events.9.desc: "Yesterday at 11:20 AM, three gunshots from a Walther pistol pierced through Trinity. Seia Yurizono, the head of the Sanctus branch and Host of the Tea Party, collapsed after being attacked by a member of the German resistance.\n\nThe incident happened in an instant. Thomas Sommer, a member of the Schwarze Kapelle, charged toward Seia Yurizono as she was giving her Host inauguration speech at Trinity Central Square. Guards moved to intercept him, but Sommer broke through and pulled a pistol from his coat. Two shots to the chest. One to the abdomen. He was neutralized by the guards just before a fourth bullet could be fired and was transported to the hospital with injuries.\n\nThe Sanctus branch immediately fell into chaos. The next day, Chika Amabe hurriedly took over the leadership, but criticism rained down upon her. The fact that Seia Yurizono's closest confidant succeeded to power was a development many did not expect.\n\nThis incident laid bare the position Seia Yurizono held in the Sanctus branch. While she had been criticized for being 'excessively leftist,' she was simultaneously the central axis of the Sanctus branch. Currently, there has been no official announcement regarding Seia Yurizono's condition. Meanwhile, some within the Sanctus branch issued a public statement toward the Justice Task Force, claiming that a lax security system brought about this disaster. Trinity is in turmoil at this very moment."
 trinity_events.9.a: "I didn't do it!"
 trinity_events.10.t: "Death of Seia Yurizono"
 trinity_events.10.desc: "Today is the most sorrowful day for Trinity. Seia Yurizono has ultimately passed away. Although the Remedial Knights gave their all, the shock from the gunshot wounds was more than her fragile body could handle, and after a struggle of several days, she finally closed her eyes.\n\nThis shocking news was first received by the Sanctus branch. Seia Yurizono's death further accelerated the rift within Sanctus. After a compromise that satisfied no one, Natsuki Kato was elected as the new head. She claimed she would inherit Seia Yurizono's ideology, but the faction that supported Seia does not trust her.\n\nFollowing the election of the head, the conservative Sanctus branch and the progressive faction that followed Seia Yurizono completely split. Misaki Kuno, representing the progressives, strongly criticized the conservatives as 'reactionaries obsessed only with a centuries-old idealistic system.' The bridge that former head Seia Yurizono had strived to build to encompass both left and right collapsed significantly with her death, and progressive figures are engaging in active resistance centered around Misaki Kuno.\n\nSome Sanctus branch officials, facing reality, are now seeking the possibility of compromise with other branches. However, in just a few days, the Sanctus branch has fallen into a cauldron of confusion, fear, and oppression."
 trinity_events.10.a: "The dominoes have fallen."
 trinity_events.11.t: "Inauguration of Mika Misono as Host"
 trinity_events.11.desc: "With the unprecedented event of a Host dying immediately after inauguration, Trinity General School has been plunged into a state of unprecedented shock.\n\nAccording to the General School Charter, Mika Misono, who won the majority in the Tea Party vote, has taken over as the next Host. However, simultaneously with her inauguration, a power struggle between the Filius and Pater branches became inevitable, and this conflict is expected to continue until Mika Misono, as Host, personally settles it.\n\nNonetheless, voices of opposition and resistance are growing within the Filius branch. Filius is suspicious of the Pater branch as a whole, linking them to the Seia Yurizono assassination and suspecting them as the mastermind. While the Pater branch strongly denied any involvement, it is expected that such misunderstandings will not be easily resolved.\n\nMika Misono's Host inauguration ceremony was held on a small scale due to the aftermath of the Seia Yurizono assassination. The atmosphere within other branches is somber, and vigilance and anxiety toward Mika Misono are rampant. She is an unpredictable figure, and the uncertainty regarding her future steps is further heightening tensions between branches."
 trinity_events.11.a: "It was inevitable."
 trinity_events.12.t: "Thomas Sommer Investigation"
 trinity_events.12.desc: "Despite the best efforts of the Remedial Knights in Eden, the assassin of Seia Yurizono died from excessive bleeding due to a fatal gunshot wound before he could be interrogated.\n\nInvestigation results revealed the assassin to be 31-year-old Thomas Sommer from Potsdam, who had joined and been active in the SS in 1931 before converting to a resistance operative for the Schwarze Kapelle following the 1935 Great Transfer. He was married, but his wife is currently missing. A noteworthy point is that Thomas Sommer met with an SS leader a few days before killing Seia Yurizono. Strangely, that leader suddenly vanished the day after Seia Yurizono was assassinated.\n\nThe fact that the assassin died before interrogation, the disappearance of his wife, and the vanishing of the SS leader after their contact—suspicious circumstances continue to emerge. Is all of this a mere coincidence? The full story of the incident remains opaque, and voices demanding the truth are growing louder."
 trinity_events.12.a: "Poor fool."
 trinity_events.13.t: "A Sisterhood Conspiracy?"
 trinity_events.13.desc: "After the incident, the Sisterhood actively carried out relief operations, distributing various relief supplies to German locals and Trinity students. But did this truly stem from pure religious devotion? Or could there be political calculations behind it? The very fact that the Sisterhood is moving so actively might imply some political significance.\n\nOf course, they previously declared non-interference in politics. The idea of the Sisterhood challenging the Tea Party is unimaginable. However, no one clearly knows their true intentions. The Sisterhood is well known as an organization shrouded in mystery. It is difficult to expect those who strictly manage internal affairs to transparently share all information with the Tea Party. Considering the rapidly changing political situation and the recent attack, it is uncertain how long the Sisterhood will maintain its neutrality. For now, we can only hope they maintain their stance of non-interference and neutrality until the end."
 trinity_events.13.a: "Is there any reason for the Sisterhood to intervene?"
 trinity_events.15.t: "The Petition of Tsurugi Kenzaki"
 trinity_events.15.desc: "Under the full support of Mika Misono, the Justice Task Force expanded rapidly. However, this growth came with a painful price. The organizational structure, which had been optimized for the original grounds, could not handle the academy territory that had expanded drastically after the incident, and Mika's endless support instead made the organization pointlessly bloated. Inefficiency reared its head everywhere, and the Justice Task Force began to stagger under its own weight.\n\nThe person who felt this problem most acutely was Hasumi Hanekawa, the Vice-President of the Justice Task Force who oversaw all administrative work. Increased personnel, a complicated reporting system, an endless pile of documents... Hasumi's desk was always filled with a mountain of documents, and her nights grew longer and longer. As the organization grew, the burden she had to bear grew with it, until it reached a point where she could no longer handle it alone.\n\nTsurugi Kenzaki, the President of the Justice Task Force and its action leader, known by the chilling epithet 'Executioner,' understood Hasumi's suffering better than anyone. Though she was merciless in slaughtering enemies on the battlefield, she could not ignore her colleague's struggle in the office. Tsurugi reached out to help with administrative work. But handling a sword and handling documents were completely different. Unfamiliar hand movements, frequent mistakes—Tsurugi's intentions were clear, but her help sometimes became an additional burden for Hasumi.\n\nNevertheless, Tsurugi did not give up. She couldn't ignore her colleague's pain, and above all, this problem had to be solved for the Justice Task Force to function properly. After much thought, Tsurugi made a decision. She would ask the Tea Party for help. Professional external support was needed to lighten Hasumi's burden and return the Justice Task Force to an efficient organization."
 trinity_events.15.a: "Of course! Dispatch Tea Party experts."
 trinity_events.15.b: "Solve internal organizational problems yourselves."
 trinity_events.14.t: "The Last Journey of Seia Yurizono"
 trinity_events.14.desc: "Seia Yurizono was the head of the Sanctus branch, and considering her past actions and achievements during her Host term, she is fully deserving of a state funeral.\n\nThe coffin, made of birch, was solemnly transported under the escort of Sanctus branch officials in dark yellow and white uniforms—the branch colors—and the Trinity Justice Task Force. Following behind was a procession in parade uniforms, followed by the elders of the Sanctus branch and Seia Yurizono's numerous sisters. Furthermore, independent marching units from the Pater and Filius branches joined in, and a procession of general students who usually supported her lined the way until the very end.\n\nSeia Yurizono, the head of Trinity General School's Sanctus branch and former Host, is now eternally embraced by her alma mater."
 trinity_events.14.a: "Condolences to Seia."
 trinity_events.14.b: "Scale down the funeral."
 trinity_events.16.t: "Fate of the Sanctus Branch"
 trinity_events.16.desc: "The moderate or radical figures of the Sanctus branch have all fled, and now only the elders remain. However, as the Mika Misono Law passed, their fate will also be decided before long.\n\nThe Supreme Court, filled with pro-Pater branch figures, held a massive judgment.\n\n- Chika Amabe, imprisoned on charges of abuse of authority.\n- Natsuki Kato, imprisoned on various criminal charges against the government.\n- Rie Mihara, imprisoned on charges of bribery and negligence of duty.\n- Mayuko Shiraki, imprisoned on charges of serious abuse of authority.\n\nThe elders stood trial on charges of abuse of authority and involvement in the Seia Yurizono assassination, with various charges against the government added. However, perhaps considering her friendship with Seia Yurizono, Mika Misono offered surprisingly lenient terms to the Sanctus branch. For a political purge, it wasn't cruel. Officials of the Sanctus branch were pardoned conditionally and given the choice of joining other branches or leaving politics.\n\nNonetheless, some elders were different. They rejected all persuasion and offers, deciding to stay with the Sanctus branch until the end. It was a matter of conviction. Ultimately, many were imprisoned, and the Sanctus branch entered the process of dissolution. The branch that was once the heart of Trinity vanished into history."
 trinity_events.16.a: "They will all vanish in prison."
 trinity_events.17.t: "Fate of the Filius Branch"
 trinity_events.17.desc: "Mika Misono and Nagisa Kirifuji were long-time childhood friends. Growing up together, the two understood and trusted each other better than anyone. But as they became part of different branches, their fates began to diverge slightly. Is it fate that even deep bonds split when politics intervenes?\n\nThe Tea Party was a place where each branch fought fiercely over policies and bills for their own interests, and Mika and Nagisa also repeatedly clashed in uncompromising battles. Two people who once dreamed of the future while laughing together now had to face off as political figures representing their respective branches. Yet, they still understood each other. At least until then.\n\nBut what about the current situation? Nagisa Kirifuji, who failed to stop Mika Misono's rampage, is currently under house arrest by her order. This is a completely different aspect from the time when a vote of no confidence was carried out against the former Pater branch Host. Through this incident, the pride of the Pater branch has been fully restored, and the revenge is complete.\n\nNow, Pater branch officials are demanding stronger punishment. However, Mika Misono is not complying. Whether it's due to old friendship or other political considerations is unknown, but she is advocating for more moderate punishment.\n\nThe two girls who once dreamed together now stand at different ends of fate. One is at the pinnacle of power, and the other is imprisoned by that power. Was this the end of the path they chose?"
 trinity_events.17.a: "Imprison her in the Tea Party confinement room."
 trinity_events.17.b: "Continue the house arrest."
 trinity_events.18.t: "Disloyalty within the Pater Branch"
 trinity_events.18.desc: "In the Tea Party—the root and origin of the triumvirate where countless people passed and numerous laws were passed or rejected—now only the Pater branch and its head, Mika Misono, remain. Mika Misono and the Pater branch are rapidly strengthening their grip on Trinity, passing bills favorable to themselves in rapid succession.\n\nPerhaps naturally, some Pater officials with anti-Mika tendencies opposed these plans and were plotting to pull down Mika Misono and certain Pater branch officials from behind the curtain of the Tea Party drama.\n\nWhether it was fate or a prank of the gods, the coup plot was discovered before it could even be executed.\n\n\"Treason!\" every Trinity news outlet is shouting. Some officials with anti-Mika tendencies within the Pater branch are currently on trial on charges of plotting specific conspiracies to pull down Mika Misono. According to various 'anonymous but reliable' sources, this conspiracy dates back up to a year in some cases and includes acts such as colluding with officials from other branches or blatantly providing information on Pater branch officials.\n\nHost Mika Misono is refraining from mentioning this incident, but as it becomes clear that some Pater branch officials do not prioritize Trinity's interests, a large-scale purge to remove internal disloyalty is expected."
 trinity_events.18.a: "I will end this civil war by cutting them down one by one."
 trinity_events.19.t: "The Supreme Court"
 trinity_events.19.desc: "The appointment of the Chief Justice of Trinity is made by the Host's nomination with the consent of the Tea Party. However, the current political climate is flowing in favor of the Pater branch as if it were destiny. The Sanctus branch split rapidly following the Seia Yurizono assassination, resulting in the Pater branch holding a majority of seats in the Tea Party. With Mika Misono seizing the Host's position, Mika Misono and the Pater branch have grasped absolute power that no one can deny.\n\nMika Misono pushed for the appointment of a Chief Justice and requested it from the Tea Party to make her rule permanent. The Pater branch, holding the majority, naturally approved it. There was intense political checking and resistance from the Filius branch, but before the Pater branch, which held absolute dominance in the Tea Party, it was merely a meaningless struggle.\n\nNow, even the final judicial process has fallen into the hands of Mika Misono and the Pater branch. The Chief Justice and justices appointed on Mika Misono's recommendation ousted the existing justices, to which the Filius branch strongly reacted with fierce criticism. However, Mika Misono continued to push her will without concern."
 trinity_events.19.a: "This is only the beginning."
 trinity_events.20.t: "Birth of the Second Trinity"
 trinity_events.20.desc: "The series of significant events that began with the 'Great Transfer' reached a new phase through Seia Yurizono's unfortunate death and the collapse of the Tea Party. There will be no more confusion. Under the leadership of Host Mika Misono, Trinity is making great progress.\n\nThe newly enacted Trinity laws reflect the will of the public, and faith has also been codified in law. All military forces have sworn loyalty to the new leader, and the masses will finally regain a stable life. With each reform implemented, the Pater branch became more deeply rooted in the heart of Trinity, while other branches sank deeper into the darkness. Now, it is time for the official declaration of Trinity's change.\n\nTrinity General School is like a single organism. Everyone gathers as one to move toward a common goal. Mika Misono appears in Eden Square, where numerous flags flutter. The noisy square gradually quieted with her appearance, and soon everyone listened to her voice standing on the platform. Mika Misono, with her hat resting on her elbow, continued her speech by reiterating the Pater branch's victory. Finally, with the new Trinity flag unfolding behind her, she declared the end of the old regime. She proclaimed that Trinity had been reborn amidst the upheaval of the times. Pater branch officials cheered and shouted in unison, and a moment later, the masses filling the square followed suit."
 trinity_events.20.a: "Long live our Alma Mater!"
 trinity_events.21.t: "Trinity Volunteer Legion"
 trinity_events.21.desc: "It would be a lie to say there was no anti-government resistance in Trinity at all. However, surprisingly, it has survived despite constant suppression. While the Justice Task Force's surveillance net was tightening, the Great Transfer occurred, and they were heading in an extreme direction. Today, early in the morning, a bomb was thrown at a former Sanctus branch official who was using public transportation to commute. The bomb exploded, seriously injuring the former Sanctus official and most of the citizens using the public transport. This is speculated to be a form of vigilante justice regarding allegations of her close relationship with the Pater branch.\n\nOriginally a small anti-government militia, they began to rapidly accept militia members into the organization after the Great Transfer, and now they have turned into notorious terrorists in certain regions. Furthermore, as Mika Misono took power, problems are being heard, such as some officials from branches with leftist tendencies joining this group.\n\nCircumstances have been captured showing they are attracting even more moderate forces using a common hatred for the Host as a medium. Romi Yamaji, a former Sanctus branch official with extreme leftist tendencies, has been identified as the figure behind the organization, and a massive search is underway to find her, not ruling out overseas operations."
 trinity_events.21.a: "Destroy them immediately if they are found."
 trinity_events.22.t: "Loyalty Clause"
 trinity_events.22.desc: "Can you believe that the morality and ideology of public officials were not verified? As a result of not closely verifying the morality and political tendencies of public officials until now, cases where those with unpatriotic tendencies easily seized media and occupied high-ranking government positions occurred frequently. This fact was proven by the assassination of Seia Yurizono, the head of the Sanctus branch and Host.\n\nWe can no longer stand by! In the current situation where Trinity is in crisis, a loyalty clause in the new Civil Service Act must be introduced so that all personnel in public institutions receive pro-Pater education and prove their loyalty to Trinity by following those disciplines.\n\nTo make all public officials loyal to Trinity, the most effective way is to mandate joining the 'Pater Branch.' No other branches exist anymore, and it will be the best way to represent the students' will and maintain stability. As expected, the number of new members increased greatly, and some who protested submitted resignations as a sign of protest.\n\nOf course, unpatriotic officials linked to anti-Trinity organizations were banned from joining the Pater branch, which is effectively a dismissal. Furthermore, a small number of them were judged likely to threaten public safety, and the Justice Task Force immediately launched an investigation."
 trinity_events.22.a: "Let's make a few exceptions for the best."
 trinity_events.22.b: "Love for Trinity is the most important qualification."
 trinity_events.23.t: "The White Uniform Corps"
 trinity_events.23.desc: "It is somewhat mandatory for the Academy Defense Force to wear white uniforms during activities. Particularly for the upper class, wearing white uniforms even in daily life is encouraged to some extent.\n\nEven before Mika Misono took power, some bellicose figures among the Tea Party officials utilized their own 'militias.' Primarily composed of former delinquents, those who became delinquents after the incident, or those expelled from Trinity due to poor grades, these private soldiers were mobilized for political activities. Otherwise, they were mobilized for various tasks such as patrolling for maintaining order like a vigilante group or helping the Justice Task Force to arrest criminals.\n\nMika Misono finds it interesting that individuals possess private soldiers. Having some degree of force is threatening, but since their level is lower than that of Justice Task Force members, Mika Misono was merely making some 'concessions' even after seizing power. This is because there are advantages to using Kivotos delinquents and expelled students as Trinity's strength.\n\nOf course, they aren't exclusively mobilized for political activities. There also exist those with various spectra, such as patrolling for volunteer purposes, sharing and realizing faith, donating to those whose lives have collapsed with small activity fees, sharing their meals with a small number of German locals, and supporting homeless orphans.\n\nMika Misono organized these private soldiers into a single organization and summoned them under the name 'Academy Defense Force.'"
 trinity_events.23.a: "We shall march endlessly."
 trinity_events.24.t: "Rise of the Pater Branch"
 trinity_events.24.desc: "As numerous people join the Pater branch, it is transforming from an old-fashioned elitist group into a popular branch for the citizens. Nonetheless, still immature as a popular branch, various incidents are occurring within the Pater branch. Particularly, the remark during these difficult times for the general public that 'if they are hungry, they should eat cake instead of bread' is absolutely not a remark for general students.\n\nThe Pater branch is nonetheless transforming into a popular branch. Pater officials are using their private funds to distribute simple 'welfare' to the people. Of course, since they are using private funds, it is criticized as an abuse of power by Tea Party officials, but as long as the new charter guarantees it, they can escape without any punishment."
 trinity_events.24.a: "The followers of the Archangel have finally taken shape."
 trinity_events.24.b: "Can't we do a bit more for the citizens of the autonomous districts?"
 trinity_events.25.t: "The Leader and the Followers"
 trinity_events.25.desc: "Mika Misono and the Pater branch are changing day by day, consolidating their power. They are changing organically while striving for a common goal of making Trinity a better situation. Mika Misono seized power like providence. The citizens of the autonomous districts were not born to be gentle sheep within providence. They do not exist to sit quietly and live without even knowing they are slowly dying. We were born to win our own fate. We exist to overthrow a great evil and reverse our fate. Mika Misono is our agent and the lion who leads us. And we are the flock of sheep and, at the same time, the soldiers who follow her."
 trinity_events.25.a: "Glory to Trinity, glory to the Archangel!"
 trinity_events.26.t: "End of the Convention"
 trinity_events.26.desc: "The most important questions regarding the direction of the Pater branch have been resolved, and most attendees recognized this and adopted it as one of the platforms. Subsequently, discussions on other social issues proceeded, and the convention is moving toward a conclusion. Particularly, the scene where Trinity figures and German politicians exchanged speeches and engaged in fierce debate drew hot attention, even appearing in the newspapers.\n\nAt the end of the convention, the Host addressed the Pater branch officials, commending those who bear the 'solemn duty of innovating the Alma Mater.' She concluded the convention by saying, 'The officials gathered here today are clearly prepared to perform that mission, and I also look forward to achieving meaningful results together with them.'"
 trinity_events.26.a: "For the Second Trinity, let us shout manse!"
 trinity_events.27.t: "The Impression of Mika Misono"
 trinity_events.27.desc: "Mika Misono enjoys appearing before the public and is building a firm image. She is becoming a hope for all Trinity students and establishing herself as a new alternative for the German public. Having seized power with a soft but intense charisma, she serves as a medium that inspires the public. She retains a Kivotos accent but can also speak German, and she is gaining support even from Germans by disclosing the flaws of the previous Nazi regime to the public.\n\nTo leave a firm image, new colors are being added to her epithets. While the epithet 'Archangel' is already widely spread, it is not enough. This is because epithets with religious colors do not work for everyone. Trinity students call her 'Savior of Trinity,' 'Kind Mother,' 'Messenger of Fate,' 'The Chosen One,' and so on. There are various other epithets besides these. Even though it's ambiguous whether to accept it positively, she is referred to as 'Leader' among Germans.\n\nTo build a firm image, it is necessary to choose a single word. Nevertheless, Mika Misono is the savior of Trinity, a kind mother, a messenger of fate, the chosen one, the leader, and simultaneously the Host of the Tea Party and the student council president of all Trinity."
 trinity_events.27.a: "The Host is the Savior of Trinity."
 trinity_events.27.b: "The Host is a kind mother."
 trinity_events.27.c: "The Host is the Leader of everyone."
 trinity_culture_events.1.t: "'Trinity New Culture'"
 trinity_culture_events.1.desc: "Culture can be simply explained as the overall lifestyle of a society. But what if that culture is decadent? Should we accept it as a culture and continue decadent cultural activities? To this, Mika Misono and the Pater branch clearly answered 'No.'\n\nWhile it is true that Trinity has made some progress artistically and ideologically, it has not made a great leap compared to other academies. We stalled during the era of peace. Other academies caught up with or surpassed us, and even Gehenna Academy—Trinity's arch-rival—has established and lived by its own unique cultural methods that cannot be felt in Trinity.\n\nThe Pater branch proposed a policy to Mika Misono to root out this decadent culture. It was to expand the authority of the existing Cultural Affairs Bureau to oppose decadent culture and create and promote Trinity's unique new culture. Mika Misono seriously reviewed this proposal and soon approved it.\n\nIn fact, Mika Misono had been deeply considering a new culture for a long time. She had regarded existing methods as excessively 'annoying and irritating.' Therefore, the fact that the Pater branch made such a proposal first must have been an unexpected stroke of luck for Mika Misono."
 trinity_culture_events.1.a: "New Culture, New Trinity!"
 trinity_events.28.t: "Trinity Curriculum"
 trinity_events.28.desc: "Trinity's educational methods are heavily tinged with religious color. Chapel classes are a representative example. Of course, we are not trying to deny the fact that Trinity General School was built on religious values. It's just that we are discussing this issue because we must move in a more efficient and practical direction.\n\nWe will convert subjects like chapel classes and religious activities into elective subjects rather than mandatory ones, or open them as a different form of subject for the Sisterhood. Of course, such a choice may buy the resentment of the Sisterhood. However, through this, Trinity students will be able to enjoy broader academic freedom."
 trinity_events.28.a: "It seems fine. Let's reflect this."
 trinity_events.28.b: "Is there a need to buy the resentment of the Sisterhood?"
 trinity_culture_events.2.t: "Architectural Style"
 trinity_culture_events.2.desc: "There are several methods in Trinity's art, and one of them is the architectural style. Blue roofs, antique walls, brilliant interior decorations, and even precise proportions—Trinity's architecture has developed in an antique and luxurious way, unlike other schools. However, this architectural style is experiencing difficulties in material supply. Due to adhering to excessive perfectionism, it sometimes takes dozens of months to complete a single building. This problem remains unresolved even after the incident.\n\nIn the branch discussion, a modernism architectural style that minimizes exterior and interior decorations and prioritizes efficiency and functionality emerged as an alternative. However, even within modernism, two branches of opinion appeared, namely the issue regarding eco-friendliness. Since Trinity has emphasized eco-friendly methods from before, the claim is being raised that modernist architecture must also necessarily adopt eco-friendly elements."
 trinity_culture_events.2.a: "Eco-friendly modernism is more Trinity-like."
 trinity_culture_events.2.b: "Eco-friendliness is important, but other things are more important."
 trinity_culture_events.3.t: "Control of Popular Culture"
 trinity_culture_events.3.desc: "Popular culture is, as the name suggests, culture that the masses can easily access. However, to put it differently, it also means it can degenerate into a tool to easily control and propagandize the masses. Therefore, the Pater branch has steadily strived to grasp a 'hegemony' in this area. Until Mika Misono's accession, that strategy seemed to exert some effect, but eventually hit a limit and failed to produce any more meaningful results.\n\nAccordingly, the Pater branch proposed utilizing the Tea Party's authority to clearly control popular culture. Discussed were measures such as advocating for Mika Misono and subtly infusing Trinity's unique ideology into all media—including the press, publishing, education, and film—or even mobilizing art and music to produce operas or symphonies that compel loyalty to Trinity."
 trinity_culture_events.3.a: "Control might instead cause dissatisfaction."
 trinity_culture_events.3.b: "Controlling popular culture will be another shield protecting Trinity."
 trinity_culture_events.4.t: ""
 trinity_events.29.t: "Trinity Faith"
 trinity_events.29.desc: "The churches within Germany are taking a much more opportunistic attitude than expected, so Trinity's faith is spreading like wildfire, centered around the central and western regions. At the heart of such rapid change was the dedicated missionary work of Sakurako Utazumi, and local clergy moved by her sincere sermons came to accept the doctrine and crave the Tea Party's attention even without external pressure.\n\nThe residents of those regions are rapidly assimilating into the faith without repulsion. However, the provinces and rural areas, called the fortress of conservatism, still maintain a dismissive attitude toward external culture and exhibit a dualistic pattern of rejecting the teachings.\n\nRegarding the composition of believers, females account for a high percentage. This is because the more progressive and open doctrine compared to the local religion satisfied the needs of those trying to form a bond in a confused society. Of course, the number of male believers being recorded is also not small, and their conversion is primarily occurring centered around urban capitalists, the intellectual class, or classes desiring exchange with us.\n\nA point to note is that the conversion rate of Catholics is uniquely high. This seems to be because the doctrinal similarity between the two religions significantly contributed to lowering the psychological barriers to conversion."
 trinity_events.29.a: "Checkmate"
 trinity_events.30.t: "Women's Rights"
 trinity_events.30.desc: "Nazi policies toward women were extremely oppressive. They strictly separated the roles of men and women and tried to reduce women to tools rather than independent personas. Under the slogan 'Children, Kitchen, Church,' they restricted women's lives to the home and acted as if a woman's dignity could be bought with money through marriage encouragement laws.\n\nDuring this period, numerous female public officials were forcibly dismissed. Teachers, doctors, judges, and other women in professional occupations were no exception to being kicked out of their workplaces. The Nazis tried to strip women of their economic independence and social status. Furthermore, they tried to treat women only as a means of childbirth through inhuman policies like the Lebensborn program.\n\nNow we must correct all of this. The legacy of oppression left by the Nazis and the SS will be completely rooted out from this society. Unjustly dismissed female public officials will be immediately reinstated. This is not a special benefit, but a right that must be rightfully recovered. It is time to prove that our society has not regressed into barbarism."
 trinity_events.30.a: "Women, take heart! We are with you!"
 trinity_events.31.t: "Germany's Fate"
 trinity_events.31.desc: "Mika Misono and the Pater branch are discussing the Germans in Trinity. Realistically, deportation seems like a good option. However, it's impossible to deport tens of millions of Germans entirely. Therefore, we must either subordinate the Germans to Trinity or thoroughly destroy the concept of Germany itself to completely break their will to resist.\n\nMost of the Pater branch supports the plan to thoroughly 'extirpate' the concept of German identity and use them like 'slaves.' They plan to destroy the things that form the root of Germans and plant Trinity in that place.\n\nNaturally, these plans do not receive Mika Misono's support. A tender heart remains in Mika Misono's mind more than thought. Even when removing her political rivals, she did not grant them death. She merely finished by sending them far from the center and monitoring them so they couldn't engage in political activities. She feels such compassion toward the Germans as well. However, too strong a compassion is not shown. Mika Misono is deciding the fate of the Germans, dismissing it as a pitiful but inevitable matter."
 trinity_events.31.a: "Germans will survive. As second-class citizens, that is."
 trinity_events.31.b: "The identity of Germany will be extirpated. Forever."
 trinity_events.32.t: "The Shepherd of the Academy"
 trinity_events.32.desc: "Mika Misono, the leader of Trinity and Host of the Tea Party, is called by numerous epithets, and among them, she particularly likes the title 'Shepherd of the Academy.' The word 'Shepherd,' which contains the meaning of being the protector and savior of Trinity and the one who leads the academy, is inspiring her with new inspiration.\n\nSocial conflict has not yet been completely resolved, but more Germans than before are supporting Mika Misono or accepting her leadership. Among Trinity students, hate crimes toward Germans or crimes for pleasure are also gradually decreasing. This is thanks to the activities of the Justice Task Force and the Trinity Vigilante Crew. Many students are approaching Germans with compassion, and though it may be difficult now, if enough time is given, the day when Trinity students and Germans truly harmonize seems not far off.\n\nAs a side note, in some small-scale German communities within Trinity, an atmosphere of regarding Mika Misono as a kind of 'idol' is being created, and a fandom culture is carefully taking place."
 trinity_events.32.a: "Prepare!"
 trinity_events.33.t: "Designation of the Tea Party Host"
 trinity_events.33.desc: "The aftermath of the Seia Yurizono assassination showed no signs of subsiding, and questions began to emerge about who the next Host would truly be.\n\nMany Tea Party officials expected Mika Misono would be designated as the next Host, and this was taken almost as a fait accompli. Following Seia Yurizono's assassination, the Sanctus branch effectively lost its influence, and the Filius branch led by Nagisa Kirifuji was also in a situation where even a proper counterattack was difficult before the fierce political offensive of the Pater branch.\n\nHowever, there was no guarantee that Mika Misono would be the absolute next Host. Her propaganda strategy succeeded in rapidly expanding the Pater branch's power, but internal voices of opposition also began to emerge. Particularly, 'moderate' forces revolted against this flow.\n\nNevertheless, no hope was seen, and eventually, the Host vote began. Candidates Mika Misono and Nagisa Kirifuji took turns giving speeches on their policies under the Tea Party oath. When Mika Misono spoke, the Pater branch showed enthusiastic response, but conversely, when Nagisa Kirifuji spoke, various problems occurred, such as indifference or a rain of boos. Fortunately, the voting process itself proceeded with relatively no major issues.\n\nAnd finally, the counting began. The counting broadcast proceeded rapidly, and now only one remains.\n\nThe result is...?"
 trinity_events.33.a: "Mika Misono was elected, securing a majority."
 trinity_events.33.b: "Upsetting everyone's expectations, Nagisa Kirifuji was elected."
 trinity_events.34.t: "Appointment of the Head of the Academy Economic Development Bureau"
 trinity_events.34.desc: "To solve the comprehensive economic problems of the academy, economic and industrial experts were gathered, and the Academy Economic Development Bureau was created. This organization takes a loose corporatist tendency without an official representative. While it is desirable to see them continue heated discussions and research, each claiming their own way is right, a role to adjust them so they don't overheat excessively is desperate. The one to take on this mediator role will be the Head of the Academy Economic Development Bureau.\n\nCurrently, there seems to be no one suitable within the Development Bureau, but the answer has already been found from the outside: Library Committee President Ui and Library Committee member Shimiko.\n\nUi Kozeki is currently the Library Committee President and is well known as a person who loves books, and this means she might also frequently read, understand, and perhaps realize economics books. There are contents saying she is unsuitable due to her introverted personality and lack of human relationships, but this much can be sufficiently fixed.\n\nNext is Shimiko Endou. she is also a member of the Library Committee. she claims to have read all the books existing in Trinity. Also, managing huge books and interacting with quite a few other students are various parts of her character."
 trinity_events.34.a: "Ui Kozeki; her introverted personality isn't much of a problem."
 trinity_events.34.b: "Shimiko Endou; her appearance as a mediator became a great exemplar."
 trinity_events.34.c: "Do as you wish."
 trinity_events.35.t: "Reorganization of the Academy Intelligence Agency"
 trinity_events.35.desc: "Following the horrific Seia Yurizono assassination, it became clear that the Trinity Academy Intelligence Agency had effectively lost its function. Its foreign intelligence collection capability is at a deficient level compared to other academies, and its internal counterintelligence system is, literally, disastrous. Can those responsible for Trinity's security truly be said to be okay like this? The current Head of Academy Intelligence, Yoriko Itano, is requesting time, saying she can solve these problems, but this matter is not a relaxed problem that can be left to time.\n\nThe Academy Intelligence Agency will no longer be an independent agency but will be reorganized as an internal department under the Tea Party. Head of Academy Intelligence Yoriko Itano will be immediately dismissed, and subsequent appointments of the Intelligence Head will be determined directly by the Host. Furthermore, ideological verification will be implemented, and all individuals disloyal to the government will either retire or be unable to avoid investigation by the Justice Task Force.\n\nTo prevent tragedies like the horrific Seia Yurizono assassination in advance, the intelligence collection capabilities, which have been pointed out as lacking, will be supplemented, and the range of information collection and surveillance will also be significantly expanded. Accordingly, many students may experience invasion of privacy, but Trinity students will also endure this for the greater cause.\n\nAs the 5th Amendment to the Trinity General School Charter specifies this, the reorganization of the Academy Intelligence Agency is expected to proceed swiftly."
 trinity_events.35.a: "This is something that must be endured."
 trinity_events.36.t: "Security Situation"
 trinity_events.36.desc: "The security of Trinity General School remains precarious. To the east, the giant [SOV.GetAdjective] side is lurking; to the west, [GEM.GetAdjective] and [GEH.GetAdjective] pose a threat; and to the north, the [RED.GetAdjective] side is threatening. To the south, numerous minor academies are scattered, but the possibility of them establishing a single government under the name 'South Kivotos' cannot be ruled out.\n\nThis massive threat has become a fate that Mika Misono and the Pater branch must face and resolve. Furthermore, students are demanding war with Gehenna day by day, worsening tensions between academies. The promise Mika Misono made when she took power was to resolve this long-cherished wish, but an unprepared war will lead Trinity to ruin and crumble even the legacy left by the First Council.\n\nThe Pater branch and Mika Misono are continuing discussions day and night regarding this precarious security situation, but a conclusion does not come easily."
 trinity_events.36.a: "This is a geopolitical catastrophe."
 trinity_events.37.t: "Birth of Minor Branches"
 trinity_events.37.desc: "As the two giant branches of Trinity vanished, minor branches are the ones that pushed their way into that space. Particularly, since the Mika Misono Law, amended after Mika Misono's accession, does not meaningfully prevent the creation of new branches, it is within the expected range for these minor branches to overrun.\n\nLooking representatively at a few of the branches newly created by those from the old large branches, there are those who rejected the ideological colors of Mika Misono and the Pater branch, left, and created new branches. Ideological conviction does not exist for them, and they are only composed of those who wish to repeat the malpractices of the Pater branch, which were merely unpleasant. The Pater branch is disparaging them as 'prodigal sons,' and the new branches are raising the intensity of criticism, calling the Pater branch fallen angels.\n\nMeanwhile, the tendencies of the branches newly created by idealists who were from the Filius and Sanctus branches are interesting. They primarily represent progressive liberal ideologies, but agreement between the two branches is distant due to ideological differences between the representatives of the Filius and Sanctus branches, the differences in branch tendencies, and fundamental problems."
 trinity_events.37.a: "Are they all just playing house?"
 trinity_events.38.t: "Discussion on German Businesses"
 trinity_events.38.desc_ui: "Since the Great Transfer, as numerous businesses went bankrupt or suffered serious damage, we have exploited these gaps to nationalize them and solidify the foundation of the academy economy. Nonetheless, a number of heavy industries and some light industry businesses still survive, primarily owned by millionaires within the academy. Particularly beyond the Oder River, where our control does not fully reach, private 'national interest businesses' still hold out.\n\nSome economists within the Pater branch are wary of radical intervention toward them. Those called the economic centrists claim that even if some heavy industries remain under private ownership, they do not pose a grave threat to academy planning, and rather, the businessmen will form political alliances.\n\nHowever, Ui Kozeki, the Head of the Academy Economic Development Bureau, is firm. She says:\n\"......If everyone doesn't follow the will of the head, there's no way the academy economy can be properly planned.\"\n\nShe and the Development Bureau experts are strongly demanding full and thorough nationalization, with or without compensation."
 trinity_events.38.desc_Sch: "Since the Great Transfer, as numerous businesses went bankrupt or suffered serious damage, we have exploited these gaps to nationalize them and solidify the foundation of the academy economy. Nonetheless, a number of heavy industries and some light industry businesses still survive, primarily owned by millionaires within the academy. Particularly beyond the Oder River, where our control does not fully reach, private 'national interest businesses' still hold out.\n\nShimiko Endou, the Head of the Academy Economic Development Bureau, says, 'Even if some heavy industries remain under private ownership, there's no disruption to the plan!' She is wary of excessive intervention and is advocating for 'alliances' with some businesses. She is strongly advocating for the creation of business groups and chambers of commerce to talk with managers."
 trinity_events.38.a: "Nationalize them, but let the owners manage them."
 trinity_events.38.b: "Leave them for now. I will purchase them fairly later."
 trinity_events.38.c: "She's right. Just take them. Why is there a need to ask permission?"
 trinity_events.38.d: "Let's lead close cooperation by granting 'privileges' to them."
 trinity_events.39.t: "Hans Fritzsche"
 trinity_events.39.desc: "A letter arrived before the Host today. The sender was an individual named 'Hans Fritzsche,' and the letter contained content emphasizing his own abilities and career in elegant cursive. Particularly, he expressed his voice as having 'resonance' and showed strong confidence in his power to persuade the masses.\n\nAs a result of investigation by Trinity Intelligence, it was confirmed that he served as an official in the National Socialist German Workers' Party before the Great Transfer and was active as a voice actor for Joseph Goebbels' speeches. His tracks after the incident are unclear, but as he currently does not show hostility toward Trinity, it is estimated that he succeeded in surviving or escaping without conflict.\n\nJoseph Goebbels was a figure who once led the German Reich's propaganda apparatus and significantly contributed to forming the leader's image. While such a figure does not exist for us, Hans Fritzsche, who can mimic his voice, has the potential to be utilized usefully to some extent in mass persuasion and propaganda activities."
 trinity_events.39.a: "Enlisting him doesn't seem bad."
 trinity_events.39.b: "...I heard the man-eating piranhas of the Elbe River like the flesh of opportunists."
 trinity_events.40.t: "Trinity Re-industrialization"
 trinity_events.40.desc: "The rapidly increased academy grounds are a golden opportunity to expand Trinity's industry. The Trinity Re-industrialization plan, conceived by the academy's civil engineering experts, is drawing attention as a way to simultaneously solve the industrial problems that surged since the incident and the unemployment problems of the German locals.\n\nThe re-industrialization process follows clear stages. First, simple barracks are built near the development area. Workers solve their basic needs here while providing labor to the academy. Wages are paid as 90% Kivotos Yen and 10% German Marks. After development is complete, workers stand at a crossroads. They can continue working in that area, move to another development area, or quit if they want. The choice is theirs.\n\nAs the re-industrialization plan was disclosed, not only German locals but also some students and beastmen are showing great interest. Applicant recruitment is currently underway, and the plan is being fully realized amidst the expectations of many."
 trinity_events.40.a: "We look forward to the fruits of their efforts."
 trinity_events.41.t: "Resistance Movement of Gehenna Students"
 trinity_events.41.desc: "In just a few days since their defeat in the war with Trinity, spontaneous alliance movements are being captured among Gehenna students. Particularly, resistance activities by the Hot Springs Development Department, Gourmet Research Society, After-School Sweets Club, Pandemonium Society Guard, and the Prefect Team are spreading beyond simple disobedience to become an academy-wide problem, causing various disturbances and public insecurity even within Trinity General School grounds.\n\nThese situations have moved beyond simple expressions of dissatisfaction to take on the aspect of organized resistance, so further neglect may threaten the order of the academy. Considering the seriousness of the situation, the Host's swift sanction and decision are desperately required."
 trinity_events.41.a: "How troublesome."
 trinity_events.43.t: "Gehenna Club Problem"
 trinity_events.43.desc: "\"Wahahaha!!\"\n\"Phew! That was refreshing!\"\n\nKasumi Kinugawa of the Hot Springs Development Department—a nuisance of Gehenna and on the wanted list throughout Kivotos—is currently committing indiscriminate terror under the pretext of 'hot spring development,' crossing between Trinity and Gehenna. Particularly, this hot spring development seems to be a symbol of resistance toward Trinity and is judged to contain a political message rather than being simple development.\n\nStronger support is needed to arrest them. Since even Hina Sorasaki of the Prefect Team could not neutralize her, simple tactics will be insufficient. Currently, the Justice Task Force and Academy Intelligence are allied and tracking former Gehenna club presidents, including Kasumi Kinugawa, but among them, the greatest threat is still Kasumi Kinugawa."
 trinity_events.43.a: "This is the greatest threat..."
 trinity_events.44.t: "Fate of the Arius Branch School"
 trinity_events.44.desc: "Mika Misono originally contacted the Arius branch school beneath the surface of the Tea Party and had 'Azusa Shirasu,' who was enrolled at the branch school, admitted to the Trinity main school. However, the political turmoil and the war with the German Reich following the Great Transfer forced her to execute the plan early, and although preparation was insufficient, as a result, she succeeded in seizing power without the help of Arius.\n\nBut now that she has power in her hands, the Arius branch school, which moved according to her plan in the past, has lost its meaning of existence and is drifting. They, who were 'pawns' to seize the regime, might now become obstacles after the regime has stabilized.\n\nMika Misono must now decide their fate. The exact location of the Arius branch school has not been identified since the Great Transfer, but considering the succession of damage cases to Trinity students near Danzig, especially the Gdynia area, it is highly likely they are hiding in that vicinity. Even if they aren't actually Arius students, the fact that our enemy is hidden near there is certain.\n\nMika Misono can now thoroughly eradicate them to remove obstacles to the regime, or perhaps postpone the plan due to remaining utility or political considerations."
 trinity_events.44.a: "\"Reconciliation with Arius Academy... Yeah. That's not bad either, right?\""
 trinity_events.44.b: "\"Does something like Arius even matter anymore?\""
 TRN_trinity_44_b_tt: "§Y$TRN_Shirasu_Azusa$§! will return to §Y[ARI.GetNameWithFlag]§!."
 trinity_events.45.t: "Protest in [64.GetName]"
 trinity_events.45.desc: "In Trinity Central District—which can be called the heart of Trinity—a protest by Germans has broken out. While the protest was suppressed at a certain level by the Justice Task Force's traffic control, German locals still haven't opened their hearts to [TRM.GetAdjective].\n\nThe protest eventually dispersed on its own as it lost organizational power, and the streets became desolate. Trinity students passed by the traces of the protest with expressionless faces, and someone filmed this scene. The video of the protest began to spread rapidly on the internet, and the reactions of students who saw the video were intense. The comment section was filled with criticism toward the protesters.\n\nHowever, the Intelligence Agency captured a clue. An account suspected of being the leader of the protest was discovered. The account's introduction read 'Meeting of Patriots for Germany,' and detailed information about the protest was being shared in the form of posts. Trinity Intelligence and the Justice Task Force immediately launched a joint investigation. We will surely hold the leader accountable."
 trinity_events.45.a: "Umm. How should I deal with this situation...?"
 trinity_events.46.t: "Report of the Trinity Academy Intelligence Agency"
 trinity_events.46.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\nTo the Host of the Tea Party [TRM.GetLeader]\n\nAs a result of collecting information by taking charge of counterintelligence work within Trinity, the Academy Intelligence Agency has secured significant clues related to the recent series of disappearance cases and informs you that preparation to report to the Host has been completed.\n\nThe large-scale disappearance cases that recently occurred in Kimigayama are estimated to be deeply related to the Arius branch school, which was expelled in the past council. According to confirmed information, they are currently cooperating with German residents to cause serious confusion within Trinity, which is interpreted as part of an attempt to gradually expand the influence of the Arius side. Specific evidence supporting this circumstance is also attached to this report.\n\nFurthermore, as a result of analysis based on the statements of the missing persons' bereaved families, the approximate location of the Arius branch school is identified as being within approximately 150km from Kimigayama.\n\nWith respect,"
 trinity_events.46.a: "\"I can't just leave Saori Joumae like this.\""
 trinity_events.46.b: "\"If this is really true, it's quite a headache...\""
 TRN_after_this_operation_against_arius_tt: "§Y'Operation Iron Sword'§! will soon commence to crush the plans of §Y[ARI.GetNameWithFlag]§!."
 trinity_events.47.t: "A New Deal"
 trinity_events.47.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\nMika Misono had long been displeased with the right of the Sisterhood and Remedial Knights to interfere in the Tea Party. Her dissatisfaction with the Sisterhood in particular was deeper.\n\nThey hid the grounds for all their actions as classified under the pretext of 'maintaining secrecy.' After the Great Transfer, that closed nature was further strengthened. With everything hidden behind the curtain of secrecy, there was no way to know what they were plotting.\n\nBut the way to stop their movement didn't necessarily have to be violence.\n\nThe Sisterhood had a weakness. The memory of the Justina Council of Saints. That dark past was holding them back. The moment the Sisterhood moves first, the nightmare of the Justina Council of Saints will be revived, stimulating the fear of Trinity students. Losing the people's heart happens in an instant.\n\nMika saw through that point precisely.\n\nTherefore, she chose a deal. Under the plausible pretext of 'settling confusion,' both sides would face each other at the meeting table. Another game, under the name of cooperation, was about to begin."
 trinity_events.47.a: "\"...I'll have a lot to think about.\""
 trinity_events.48.t: "The Counter"
 trinity_events.48.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nSakurako Utazumi stood at a crossroads.\n\nAn invitation arrived from Mika Misono. It was under the plausible pretext of a 'meeting for Trinity General School's security situation and the sewing up of political conflict.' The meeting was scheduled to proceed in secret, but Sakurako could not shake off an unknown discomfort.\n\nMika Misono.\n\nJust that name caused uncomfortable emotions to stir in Sakurako's chest. When her friend was assassinated, she didn't show even a hint of sorrow. Rather, she used that confusion as a stepping stone to seize power, even to the point of imprisoning her childhood friend. The muzzle of that power gained through usurpation was now pointing at Sakurako.\n\nThere was no way to know what she would demand in this meeting. Cooperation? Submission? Or something more subtle?\n\nNot much time remained until the meeting."
 trinity_events.48.a: "\"This too is a trial.\""
 trinity_events.49.t: "Secret Meeting"
 trinity_events.49.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n\"...Mika-sama, I believe it's the first time I've seen you since that incident.\"\n\"Yeah. I've been very busy. With various things.\"\n\n\"...I suppose so.\"\n\nAn awkward silence flowed. The atmosphere was like walking on thin ice. Both sides exchanged formal greetings, but the conversation did not progress easily.\n\n\"So, why did you call me here? I believe the Sisterhood and the Tea Party do not interfere with each other by regulation.\"\n\n\"Why did I call you? Tha, that's! ...No, you know very well why I called you, don't you?\"\n\n\"For me, this position is only uncomfortable. Could you just state your business quickly?\"\n\n\"Hmm... I see... Then, I'll ask point-blank~!\"\nShe said, leaning forward.\n\"Don't you want to cooperate with me? How about it? It's not bad, right?\"\n\n\"...Could you explain more specifically what you mean?\"\n\n\"Ah, I mean literally!\" Mika said, waving her hand. \"The Sisterhood and the Tea Party cooperating. Yeah, isn't it wonderful?\""
 trinity_events.49.a: "(W-Wow, her face is scary as the rumors say...)"
 trinity_events.50.t: "Secret Meeting"
 trinity_events.50.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nWhen Sakurako waited for an answer with a cold expression, Mika hesitated for a moment and then continued. There was no longer any playfulness in her voice.\n\n\"So, the previous Trinity, you know. It was overflowing with factional fights and political maneuvering, right? Since the incident, this has become even more severe. I was sick of it, so I swept it all away with force~☆\"\n\"But what about the Sisterhood? You keep customs well, don't you? I liked that.\"\n\n\"...\"\n\n\"I swept away the entire Tea Party and established order with force. And Sakurako establishes morality with faith. Yeah. It's a wonderful plan, isn't it?\"\n\nSakurako bit her lip. There was no choice in Mika's words. Refusal was tantamount to putting the entire Sisterhood at risk.\n\n\"...Mika-san, what you have committed is... a mortal sin that can never be tolerated in the name of God.\"\n\n\"But...\" Sakurako took a deep breath. \"Your words are correct to some extent. Trinity's faith has dimmed due to the unprecedented incident, and students have been swept away by factions and forgotten their duties. I too cannot be free from the responsibility for not correcting that.\"\n\n\"The Sisterhood cannot wash the blood on your hands. That is a cross you must carry for the rest of your life.\"\n\nMika was still looking at Sakurako with a smile. That gaze was soft but simultaneously cold. Both sides knew it could not be refused.\n\n\"However...\" Sakurako's voice trembled. \"Leaving this confusion to let more students lose their way and suffer would also not be the Lord's will. If the 'new order' you speak of is truly for the 'well-being' of Trinity students...\"\n\nSilence flowed. Sakurako knew very well what she was choosing. This was not cooperation, but submission. But there was no other choice.\n\n\"......Fine. I will accept that 'cooperation.'\"\n\nMika savored Sakurako's answer for a moment, then smiled brightly as if satisfied."
 trinity_events.50.a: "\"...Yeah! That's my Sakurako-chan! I knew we'd get along!\""
 trinity_events.51.t: "Denazification"
 trinity_events.51.desc: "The Academy Intelligence Agency collected evidence to achieve denazification, stating that the operation will begin."
 trinity_events.51.a: "For a world without Nazism"
 trinity_events.52.t: "Dissolution of the Black-Red-Gold Flag Banner"
 trinity_events.52.desc: "Social Democratic Party. They, who were once the Nazis' greatest enemy, have now become one of Trinity's resistance forces. We could no longer neglect them as they incited German locals and stood against Trinity, centered around the Black-Red-Gold Flag Banner.\n\nThe Intelligence Agency identified their main activity bases. Legal grounds were established by the recently amended bills, and the Intelligence Agency and the Justice Task Force were granted powerful arrest authority. As operation preparations proceeded, thousands of rounds of ammunition, dozens of types of equipment, and at least a thousand Justice Task Force members were mobilized. The largest operation in Trinity's history was beginning.\n\nWith the start of the operation, some party members and Flag Banner participants began to be arrested. Members who heard the news and fled hid in safe houses, but the Intelligence Agency already knew their locations. The Flag Banner leadership was shot during the resistance and either transported to the hospital or died at the scene.\n\nThe largest clash occurred in [65.GetCapitalVictoryPointName]. The Flag Banner, armed with weapons smuggled from outside the academy, was caught. Fortunately, thanks to the activity of the outstanding sniper Mashiro Shizuyama, the armed members were neutralized.\n\nSome German citizens countered with protests against the organized oppression. But most people were living day to day, relieved that the violence was not directed at them. Meanwhile, the Pater branch justified their actions, saying they had overthrown a great evil threatening Trinity's internal stability."
 trinity_events.52.a: "Send my regards to Wilhelm Liebknecht."
 trinity_events.53.t: "Exit of the SPD, Entrance of the Pater Branch"
 trinity_events.53.desc: "Out with the old, in with the Mika! ☆"
 trinity_events.53.a: "Literally"
 trinity_events.54.t: "Closure of Party Headquarters"
 trinity_events.54.desc: "After thorough investigation by the Justice Task Force and the Intelligence Agency, the locations of the German political parties' headquarters were identified. Justice Task Force members entered each headquarters simultaneously and forcibly closed mass parties, including the SPD. Small-scale clashes occurred at some headquarters with extreme tendencies, but the Justice Task Force members responded firmly and suppressed them swiftly.\n\nAs news of the headquarters closures became known through newspapers, party supporters poured into the streets. Protesters strongly reacted to the Justice Task Force's measures, holding rallies everywhere, and tension rose with fierce slogans in some regions. A situation where the Justice Task Force and protesters confronted each other continued, but the Vigilante Crew stepped forward and added strength to the Justice Task Force. Ultimately, they focused on dispersing the protesters through cooperation between the Justice Task Force and the Vigilante Crew, and the protests gradually lost momentum and dispersed naturally.\n\nParty figures who fled abroad immediately issued statements strongly condemning Trinity's measures. However, their voices did not attract much interest from the international community, and their practical influence was negligible. Even within Germany, the reactions of the exiled parties passed without much attention."
 trinity_events.54.a: "Order has triumphed."
 trinity_events.55.t: "What Have German Parties Ever Done for You?"
 trinity_events.55.desc: "After the party closures, Trinity launched a massive propaganda campaign through various media, including radio. The Propaganda Bureau began broadcasting speeches regularly throughout Trinity, exposing the reality of the German political parties.\n\nThe key message of the speeches was clear: German parties had never moved for the interests of the German people, from the Great War era until now. Rather, it was emphasized that they sold Germany to foreign powers to seize power and wealth, only bringing endless suffering to the people.\n\nThe broadcast listed specific cases. During the Great War, while the party leadership fled to the safe rear, the general public bled in foreign lands, and even after the war ended, the parties embezzled reconstruction funds to only fill their own bellies, it was claimed. It also criticized the parties for promising hope to Germans but actually only fostering confusion and division to hinder Trinity's integration efforts.\n\nThe speeches concluded with emotional appeals. The message was repeated that Trinity was not trying to oppress Germans but to truly liberate them. It was a proposal to escape from the corrupt rule of parties and achieve prosperity together under a new order.\n\nSuch broadcasts continued day after day, and gradually, skepticism toward parties began to sprout among some Germans. Especially among those who personally experienced the tragedies of war, Trinity's claims were gaining persuasiveness."
 trinity_events.55.a: "Even though I walk through the valley of the shadow of death..."
 trinity_events.56.t: "Purge of Nazi Elites"
 trinity_events.56.desc: "Today, the Intelligence Agency and the Justice Task Force launched massive arrests by raiding German universities and research institutes in a joint operation. Over a thousand people were arrested, and a large number of documents were seized for investigation. This operation to purge the Nazi elites was achieved overnight and was something Mika Misono had been preparing beneath the surface. While some scholars noticed the sign and set out on the path of exile, there doesn't seem to be a suitable place for them to go.\n\nUniversities had long been under Trinity's mercy, but they were planting a sense of resistance in Germans with ideologies contrary to Nazism and the Trinity system. The Intelligence Agency noticed these actions long ago, and the work that had been proceeding underwater under Mika Misono's sanction dealt the final blow today. Now, once the trials for various anti-state crimes are over, those who escaped the firing squad will learn how to love their Alma Mater through labor.\n\nCurrently, top talents of the Tea Party are being appointed to the vacant professorships and university administrative positions. New professorships such as political economy and German folk culture have also been established here."
 trinity_events.56.a: "Another fortress of Nazism has fallen."
 trinity_events.57.t: "First Activity of the Sisterhood"
 trinity_events.57.desc: "As 'cooperation' with the Sisterhood proceeded, the Sisterhood moved in perfect order. To some extent, information sharing between the Tea Party and the Sisterhood also became active. After the deal, the Sisterhood distanced itself from politics and is moving centered more on missionary activities, particularly unfolding relief and missionary activities for refugees centered around the central and western districts.\n\nThe Sisterhood is gaining support among German locals to some extent. It might be less than 1% of the German population, but it's necessary to think positively about the fact they are receiving support. Their missionary activities are also being carried out in cities. They are primarily doing missionary activities in Trinity Central District, Basis Schola—where the headquarters of the Remedial Knights is—and [68.GetName] in between. Conversions of those who were high-class in society are also occurring, though in extreme minority. They were primarily those with progressive tendencies. However, missionary activities are still stagnant centered around rural areas. There were even a few places that refused mission work for the sole reason that they were women. It might be because they are places with closed networks known as rural areas.\n\nThey sometimes interfere with the Sisterhood's missionary activities centered around local German churches or carry out relief activities even more greatly, which is highly likely an awareness of the Sisterhood's activities. Nonetheless, the large-scale churches and the Pope of the Vatican have not moved yet, which might mean they are preparing something..."
 trinity_events.57.a: "They'll do well..."
 trinity_events.58.t: "Internal Strife of Pater"
 trinity_events.58.desc: "Various ideological colors are mixed within the Pater branch, but broadly categorized, two camps—'Ideologists' and 'Syndicalists'—are in confrontation. The gap between the two groups is very deep. Primarily hardliners or reactionary officials are raising their voices, calling themselves 'Ideologists.'\n\nOn the other hand, 'Syndicalists' exhibit relatively moderate tendencies. They are composed of the remnants of the Sanctus and Filius branches—which underwent dissolution procedures during Mika Misono's previous attempt to seize power—and some Pater officials. While the ideological spectrum from left to right is very broad, they maintain strong solidarity in that they move toward a single common goal.\n\nOn the day a large-scale convention of the Pater branch was held, Mika Misono herself appeared at the scene. According to leaked information, she intends to settle the factional conflict personally. With numerous officials attending, the atmosphere in the venue heated up instantly as Mika ascended the platform. Mika calmed the atmosphere with a light joke and then brought up the main point with a serious expression.\n\n\"Phew, attention everyone~! Isn't it getting a bit tiring to growl at each other within Pater? Trinity is trying to merge into one, but it doesn't look very good for us to be fighting and splitting amongst ourselves, does it? I think this is a really, RE-ally urgent problem to solve. So, I meanㅡ\""
 trinity_events.58.a: "Mika Misono took the side of the Ideologists."
 trinity_events.58.b: "Mika Misono took the side of the Syndicalists."
 trinity_events.59.t: "Churches in Struggle"
 trinity_events.59.desc: "Theologians within Trinity, from Martin Niemöller and Paul Schneider to Julius von Jan, Hermann Stöhr, and Dietrich Bonhoeffer, are not accepting Trinity Christianity. Of course, it might be due to having carried out aggressive missionary activities with the Tea Party's coercion. In any case, activities to protect faith are being organized centered around the Confessing Church and some conscientious pastors and theologians.\n\nHowever, those who call themselves the 'Papal States' of the locals have not moved yet, which means they appear to have the will to negotiate with us."

 trinity_foreign_policy_events.1.t: "[TRM.GetAdjective] Requested Reconfirmation of Friendly Relations"
 trinity_foreign_policy_events.1.desc: "Work in progress!"
 trinity_foreign_policy_events.1.a: "Nyaha~ Friendly relations are always good, after all~."
 trinity_foreign_policy_events.2.t: "[HYA.GetAdjective] Reconfirmed Friendly Relations"
 trinity_foreign_policy_events.2.desc: "Work in progress!"
 trinity_foreign_policy_events.2.a: "Peace is the best!"
 trinity_foreign_policy_events.3.t: "[TRM.GetAdjective]'s Economic Cooperation Proposal"
 trinity_foreign_policy_events.3.desc: "Work in progress!"
 trinity_foreign_policy_events.3.a: "Sounds good, nyahat!"
 trinity_foreign_policy_events.3.b: "But how should I put it~ We also have our own internal circumstances~"
 trinity_foreign_policy_events.4.t: "Rejection of [HYA.GetAdjective]'s Proposal"
 trinity_foreign_policy_events.4.desc: "It's a regrettable story, but [HYA.GetLeader]'s side of [HYA.GetNameDef] rejected our proposal. The specific reason for the rejection was not revealed, but it is conjectured that various complex factors, such as the recent giant incident and Trinity's political changes, had an influence."
 trinity_foreign_policy_events.4.a: "\"It's a bit of a different development than I thought, but...\""
 
 trinity_social_ploblem_events.1.t: "Kivotosians Prohibited"
 trinity_social_ploblem_events.1.desc: "Even during peaceful afternoon hours, the shadow of discrimination still hasn't vanished from the streets of Trinity Central District. Many shops are consistently hanging German signs saying 'Kivotosians Prohibited,' and below them, the Kivotos language written crookedly can also be seen.\n\nIt is natural that Trinity students do not welcome this situation. Particularly, some bellicose students exert private sanctions toward discriminatory shops. Damage is being suppressed to some extent by the swift intervention of the Justice Task Force."
 trinity_social_ploblem_events.1.a: "How troublesome"
 trinity_social_ploblem_events.2.t: "Worker Strike"
 trinity_social_ploblem_events.2.desc: "Automation is gradually progressing in Trinity's factories, but workers are still working in regions where 'Trinity-fication' has not yet been achieved. Especially in several sectors, German workers are being utilized as useful manpower.\n\nNonetheless, a problem exists: the existence of labor unions. The German Labour Front, which was a puppet union under the NSDAP in the old German region, is maintaining organizational solidarity centered around Robert Ley and is resisting by carrying out strikes and violent protests in Trinity's factories. Particularly, their main goal lies in the overthrow of the Trinity government, and reports indicate that such blatant political strikes are spreading to the point where local law enforcement agencies in some cities are having difficulty maintaining order."
 trinity_social_ploblem_events.2.a: "Mobilize more of the Justice Task Force."
 trinity_social_ploblem_events.2.b: "Let's negotiate with the workers."
 trinity_social_ploblem_events.2.c: "Whatever."
 trinity_social_ploblem_events.3.t: "Bombing Terror on Public Offices"
 trinity_social_ploblem_events.3.desc: "In a surprising development, an incident occurred where an improvised bomb made by someone exploded at a public office. Dozens were seriously injured by this bomb terror, and the injured were urgently transported to nearby hospitals via Remedial Knights vehicles. The force of the explosion was significant, causing great damage to surrounding buildings, such as shattering more than 10 large glass windows.\n\nFortunately, since repair work was being carried out in the region at the time and access for general students or residents was restricted, no direct casualties occurred. However, this incident became a catalyst to clearly reveal Trinity's internal instability and flaws in public security, and currently, Academy Intelligence and the Justice Task Force are tracking the forces behind the incident."
 trinity_social_ploblem_events.3.a: "\"Forgiving terrorists is up to God, but sending them to God is up to me.\""
 trinity_social_ploblem_events.4.t: "\"Volksempfänger\""
 trinity_social_ploblem_events.4.desc: "The Volksempfänger was a low-cost vacuum tube radio produced by Nazi Germany, designed so that the masses could easily purchase it. This was the result of the Nazi government recognizing the importance of radio and striving for nationwide distribution to utilize it as a propaganda tool. As a result, it was distributed broadly enough that one out of two German citizens owned a radio.\n\nRecently, radio broadcasts are appearing again. The background is that militias resisting Trinity seized broadcasting stations and are transmitting anti-Trinity messages to the German masses through them. These broadcasts are spreading even to some Trinity students, and the influence is gradually expanding."
 trinity_social_ploblem_events.4.a: "We must stop these radio broadcasts immediately."
 trinity_social_ploblem_events.5.t: "Werwolf (Werewolf) Resistance Problem"
 trinity_social_ploblem_events.5.desc: "The militia problem—one of Nazi Germany's legacies—is rapidly rising to the surface. Particularly, the Hitler Youth—the Nazi youth organization—is taking the lead in injecting anti-Trinity ideology into German youth. The figure leading them is Hans-Adolf Prützmann, who was appointed as a special defense inspector by the deceased Heinrich Himmler and is performing operations. Furthermore, there is intelligence that he is in contact with remaining small-scale state governments. Accordingly, swift intervention is required."
 trinity_social_ploblem_events.5.a: "We must send the Justice Task Force to suppress them."
 trinity_social_ploblem_events.5.b: "We don't have the luxury."
 trinity_social_ploblem_events.6.t: "Destroyed Trinity Symbols"
 trinity_social_ploblem_events.6.desc: "Yesterday early in the morning, an incident occurred where a Trinity symbol was damaged in a small square on the outskirts of Trinity Central District. Although it was a small square in scale, as it was a region with a high floating population, this incident is giving the impression that the Tea Party's authority has been damaged. Photos of the incident scene are spreading instantly through SNS and other means, and this appears to be part of the resistance activities that have become even more fierce recently."
 trinity_social_ploblem_events.6.a: "This isn't good..."
 trinity_social_ploblem_events.7.t: "Activities of the Black-Red-Gold Flag Banner"
 trinity_social_ploblem_events.7.desc: "The Black-Red-Gold Flag Banner is somewhat moderate, but that doesn't mean they are cooperative with us. They primarily operate from the [65.GetName] region and the central district as bases, encouraging a sense of resistance by distributing flyers containing slogans to resist Trinity."
 trinity_social_ploblem_events.7.a: "That's bad news."
 trinity_social_ploblem_events.8.t: "Conductors in Resistance"
 trinity_social_ploblem_events.8.desc: "Music is flowing from a place called Berlin, where German remnants remain on the outskirts of Eden, Trinity Central District. It's a performance by an orchestra conducted by Wilhelm Furtwängler. And several conductors are conducting the orchestra with different senses of resistance. While the Justice Task Force and the Tea Party are processing artists loosely in terms of respecting them, these musical pieces are allowing Germans to maintain their identity and are becoming a sanctuary for the mind."
 trinity_social_ploblem_events.8.a: "Giving resonance, huh..."
 trinity_social_ploblem_events.9.t: "Attempted Assassination Incident"
 trinity_social_ploblem_events.9.desc: "Today, an attempted assassination incident targeting the Trinity upper class occurred. Fortunately, the victim dodged the bullet and immediately neutralized the assassin with counter-fire. As a result of the investigation, the assassin was revealed to be a member of a German resistance organization, and the body was handed over to the bereaved family."
 trinity_social_ploblem_events.9.a: "The combat power of one high school girl is equal to two special forces members."
 trinity_social_ploblem_events.10.t: "The Red Orchestra"
 trinity_social_ploblem_events.10.desc: "Strictly speaking, the Red Orchestra is a name created by Trinity Intelligence. Rather than a single organization, it's a collective term for several independent anti-Trinity spy groups and communication networks. A significant number of them are active in Eden, the heart of Trinity. Particularly, it includes leftist figures and government officials who were active in previous Germany. They primarily exchange information via encrypted wireless communication.\n\nThey primarily produce anti-Trinity flyers and awaken the citizens' sense of resistance. Trinity Intelligence conjectures that a specific publishing house produces such flyers and expects to uncover the true identity of the Red Orchestra soon."
 trinity_social_ploblem_events.10.a: "Track them!"
 trinity_social_ploblem_events.11.t: "Worker Sabotage Problem"
 trinity_social_ploblem_events.11.desc: "The Saxony and Silesia regions are important bases for Trinity industry and are under the jurisdiction of the Tea Party to foster academy industry. However, worker sabotage in industrial cities is becoming a serious problem. Especially, workers are continuing resistance by destroying machines, military supplies, and civilian goods within factories, or by submitting unrealistic negotiation plans and distributing illegal printed materials.\n\nAs a result of investigation, a single organization leading such sabotage does not exist. Instead, small-scale patriotic organizations resisting with colleagues are operating individually."
 trinity_social_ploblem_events.11.a: "Let them do as they wish."
 trinity_social_ploblem_events.11.b: "Fine, increase their wages. Then they'll quiet down."
 trinity_social_ploblem_events.12.t: "Hitler Youth"
 trinity_social_ploblem_events.12.desc: "The Hitler Youth was an official organization operated by the Nazi Party. After the Nazis surrendered, the majority of youth returned home. But some remained in the organization because they had no place to return to or because of hostility toward Trinity. They are resisting Trinity and inciting German locals. Primarily moving centered around sabotage, they are causing disturbances by committing crimes against locals who cooperated with Trinity. The organization recently arrested possessed a large amount of explosives that are difficult to obtain. All explosives were recovered through the efforts of the Justice Task Force."
 trinity_social_ploblem_events.12.a: "How unpleasant."
 
 TRMDIP.50.t: "[TRM.GetAdjective] Began Border Fortification"
 TRMDIP.50.d: "This morning, Polish border guards captured suspicious movements in the border region. Otherworlders with wings were confirmed moving with large-scale materials, and some of them attempted to block the German-Polish railway connection points. Fortunately, an individual who appeared to be a superior among the otherworlder group stopped this, and the railway was safely protected.\n\nThe fortification work currently in progress along the border appears to be a measure based on the paranoia that we are preparing for an invasion. The Ministry of Foreign Affairs will express concern regarding this matter and plans to strongly protest through available diplomatic channels."
 TRMDIP.50.a: "Let's protest diplomatically."
 TRMDIP.50.b: "Let's not specifically make it a problem."

 TRMDIP.51.t: "Diplomatic Protest of [POL.GetAdjective]"
 TRMDIP.51.d: "A diplomatic letter arrived from the Polish Ministry of Foreign Affairs. The content of this letter was concise, with the core being the expression of their concern and protest regarding the recent expansion of defense facilities along the Polish-Trinity border. This reaction is judged to have stemmed from the Polish side misunderstanding Trinity's defensive measures as preparation for an invasion. However, any form of ultimatum or threatening expression did not exist in this letter."
 TRMDIP.51.a: "Such threats are not much of a problem for us."
 
 TRMDIP.52.t: "[TRM.GetAdjective] Demanded Oil Fields!"
 TRMDIP.52.d: "This afternoon, [TRM.GetName] sent us an ultimatum. The content was to transfer the mining rights for the oil fields within Romania to the [TRM.GetAdjective] side within 72 hours. Furthermore, it demanded incorporation into [TRM.GetAdjective]'s sphere of influence and acceptance of various economic conditions. A warning was also included that a full-scale war would be unavoidable if this deadline was missed or the demands were rejected.\n\nWe were gaining considerable economic benefit through those oil fields, and if we lose them, a serious economic hit is inevitable. Of course, [TRM.GetAdjective] is a newly emerging power that recently rose rapidly, showing a clear expansionist move. However, if peace can be gained in exchange for handing over the oil fields, that deal might not be just a bad choice..."
 TRMDIP.52.a: "It's unpleasant, but we must accept their demands.."
 TRMDIP.52.b: "We would rather die in the swamps of Great Romania than in the paradise of Little Romania!"
 
 TRMDIP.53.t: "[ROM.GetNameDef] Accepted Our Demands"
 TRMDIP.53.d: "Good news! The [ROM.GetAdjective] side accepted our demands and transferred the resource mining rights in Romania to us. Furthermore, they expressed a stance that they will gradually accept our other demands and immediately joined the [TRM.getFactionName]. This is a clear diplomatic victory for Trinity."
 TRMDIP.53.a: "Welcome!"
 
 TRMDIP.54.t: "[ROM.GetNameDef] Rejected Our Demands"
 TRMDIP.54.d: "As everyone expected, [ROM.GetAdjective] rejected our demands and proclaimed a mobilization order. Now it's time to test what their fate will be."
 TRMDIP.54.a: "It's a full-scale war!"
 
 TRMDIP.60.t: "Temporary Alliance with Trinity?"
 TRMDIP.60.d: "Mika Misono, the Host of [TRM.GetLeader], recognizes that Problem Solver 68 of Luxembourg has an anti-Gehenna character and has the goal of overthrowing the Gehenna government and establishing a new order on top of it. They proposed cooperation with Trinity to achieve their goal, suggesting a temporary military alliance under the condition 'until Gehenna is destroyed.'\n\nClearly, being able to split the enemy's front into two is an attractive proposal. The fact that this alliance will be temporary is also a satisfactory story for the Problem Solvers. But ultimately, making the final decision is [HEU.GetLeader]'s right."
 TRMDIP.60.a: "Fine, let's form a common front."
 TRMDIP.60.b: "I haven't liked her since long ago."

 TRMDIP.61.t: "Luxembourg Accepted the Common Front."
 TRMDIP.61.d: "The [FROM.GetAdjective] side agreed to our temporary alliance proposal. When either we or Luxembourg attacks Gehenna, we will form a temporary military alliance. This is a temporary alliance, but it will clearly be a great help."
 TRMDIP.61.a: "That's good news."

 TRMDIP.62.t: "Luxembourg Rejected the Common Front."
 TRMDIP.62.d: "It must have been a natural proposal, but Luxembourg rejected our proposal. Winning against Gehenna is possible even without their help, but it will be relatively difficult."
 TRMDIP.62.a: "...Why?"

 TRMDIP.63.t: "[ROOT.GetName] Radio of Freedom"
 TRMDIP.63.d: "Collaborators are utilizing the powerful Trinity Radio station to spread propaganda and lies toward the [TRM.GetNameDef] side. Listening to such radio broadcasts is clearly prohibited, and anyone will be charged with treason. But in reality, especially in rural areas, it is difficult to execute the prohibition order. A particularly influential figure in Radio Liberty is Franz Langoth."
 TRMDIP.63.b: "No Trinity collaborator will be forgiven."

 TRMDIP.64.t: "Economic Cooperation with the [TRM.GetAdjective] Side?"
 TRMDIP.64.d: "Today, a diplomatic document arrived in [ROOT.Capital.GetCapitalVictoryPointName]. It was a simple agreement regarding economic cooperation between the two academies proposed by the [TRM.GetAdjective] side.\n\nFriendly relations between both sides have been steadily maintained even after the incident, and this proposal also appears to be an extension of that. However, the recent regime change and consecutive political events that occurred in Trinity are rapidly radicalizing the said academy, so there are cautious parts in seeing it as simple economic cooperation.\n\nIt is a proposal that can be a benefit to us in the short term, but concerns are being raised within the Yin-Yang Council that it could lead to economic subordination in the long term."
 TRMDIP.64.a: "Oho~ It seems like a decent proposal~?"
 TRMDIP.64.c: "But how should I put it~ We also have our own internal circumstances~"
 TRM_eng_event_chain_tt: "No more §Yincident linkage§! will occur with the §Y[TRM.GetNameWithFlag]§! side."

 TRMDIP.65.t: "[HYA.GetNameDef] Rejected Cooperation with Us"
 TRMDIP.65.d: "Recently, a diplomatic letter arrived from the [HYA.GetNameDef] side. The content of the letter was that they will re-examine the cooperation relationship between the two academies for reasons of Trinity's radicalization, consecutive political crises, and diplomatic conflict. However, it was clearly communicated that this is limited to political cooperation and that exchange between students will be maintained as before. This kind of diplomatic retreat clearly showed that Trinity's diplomatic capability has significantly weakened compared to the past..."
 TRMDIP.65.a: "Really, what gives!?"
 TRN_no_longer_TRN_support_HYA_decision: "[HYA.GetNameDef] side rejected cooperation."

 TRMDIP.66.t: "[HYA.GetNameDef] Accepted Economic Cooperation"
 TRMDIP.66.d: "Good news. [HYA.GetLeader]'s side of [HYA.GetNameDef] agreed to the economic cooperation between both academies. Especially, this treaty, concluded based on trust and friendship between both academies, was written to be as beneficial to each other as possible. Particularly, the first material since this treaty was signed began to run toward Hyakkiyako, and this will be good news."
 TRMDIP.66.a: "Yippee~ £GFX_BA_star"

 TRMDIP.67.t: "[TRM.GetNameDef] Side's Joint Training Proposal"
 TRMDIP.67.d: "Host [TRM.GetLeader]'s side of Trinity proposed joint training. This training is to further improve the response capabilities of Hyakuryoran and the Justice Task Force to prepare for the threats increasing day by day, and it is scheduled to be held on a larger scale than existing training and to test the latest weapons."
 TRMDIP.67.a: "Ah~ It's a decent proposal~"
 TRMDIP_67_NAME: "Trinity - Hyakkiyako Joint Training"

 TRMDIP.68.t: "[HYA.GetNameDef] Side's Acceptance"
 TRMDIP.68.d: "To strengthen cooperation with the [HYA.GetNameDef] side, a proposal was made to hold joint training in [74.GetName], and the [HYA.GetNameDef] side readily accepted it. Our commanders will be able to learn about the terrain and characteristics of [74.GetName] through this training and further develop tactical capabilities by learning new tactics."
 TRMDIP.68.a: "It was a good training!"

 TRMDIP.69.t: "[TRM.GetNameDef] Side's Alliance Proposal"
 TRMDIP.69.d: "Based on the rapid development of relations with the [TRM.GetAdjective] side, they proposed joining the military alliance, the Eden Treaty. If this is accepted, the [HYA.GetAdjective] side will be treated as an equal member nation, and it will be a historic moment where an unprecedented military alliance is born."

 TRMDIP.70.t: "[HYA.GetNameDef] Accepted the Alliance"
 TRMDIP.70.d: "Through the light of the eternal festival and the grace of the Archangel, our two schools are now one. Let those who would threaten the peace of Kivotos tremble! ☆"

 TRMDIP.71.t: "Disparaged Authority of [GEM.GetLeader]"
 TRMDIP.71.d: "Late in the afternoon, a video is spreading rapidly via SNS showing a few Germans damaging [GEM.GetLeader]'s propaganda materials and leaving insulting graffiti alongside graffiti praising Trinity. The video is causing a great reaction among citizens. Currently, suspects are being swiftly arrested, and it appears they will all be apprehended soon. However, it seems virtually impossible to completely block the videos already spread online.\n\nParticularly, because these suspects made remarks praising Trinity, some quarters raised suspicions that Trinity was the mastermind behind this incident. But for now, it could simply be a personal action of those who have admired and imitated Trinity."
 TRMDIP.71.a: "Who would do such a thing!?"

 TRMDIP.72.t: "Trinity's Trade Sanctions!"
 TRMDIP.72.d: "The 1 Hungarian march of 1935 ended in disaster. Shanhaijing's offensive was firm, and our army eventually retreated. With this, the dream of Great Hungary was frustrated, and economic sanctions were received from Romania and Yugoslavia. If there was consolation, it was that the void left by Germany could be filled to some extent by starting trade with the [TRM.GetAdjective] side. However, as Trinity's diplomatic stance recently changed, economic sanctions were imposed on the motherland Hungary. Economic experts are warning that as Hungary's trade dependence on Trinity was considerably high, this measure will bring a grave hit to the national economy."
 TRMDIP.72.a: "It's a tragedy"

 trinity_flavor_events.5.t: "Trinity's New Business Plan"
 trinity_flavor_events.5.desc: "Trinity's new business briefing session was held in Eden today. This was a valuable place where Trinity's famous businessmen gathered in one place. While the attendees were socializing, the host tapped the microphone lightly and opened his mouth.\n\"First, I thank the presidents who attended our business briefing today. You who gained such a valuable opportunity are as good as chosen. I'll omit long explanations and get straight to the point. The business item I confidently introduce today is the 'Eco-Pride Cashmere Battery'! This is not just a battery! Speaking of this battery...\"\n\n\nHowever, a few minutes later, the event was terminated early by the Justice Task Force, which arrived after receiving a report of an illegal business briefing, and those involved were arrested."
 trinity_flavor_events.5.a: "Eco..what..?"
 trinity_flavor_events.6.t: "Stettin Ferry Incident"
 trinity_flavor_events.6.desc: "A significant incident occurred in Stettin, which should have been peaceful late at night. The ferry in Stettin, where banquets were held as usual and legal gambling was prevalent with hundreds of millions being exchanged, was crowded with people. At the moment when some were losing and some were gaining in peaceful congestion, a sudden gunshot shook the ferry.\n\nWith the gunshot, about 6 masked armed robbers appeared. They threatened the passengers with firearms and shouted in a calm but firm voice.\n\"Everyone, we're going to do some robbing. If everyone stays quiet, no one will get hurt.\"\n\nSurprised passengers cringed in fear, and the robbers began collecting money and valuables as planned. Meanwhile, ferry guards grasped the situation and set out to confront the armed robbers. However, the robbers already had a meticulously prepared escape route and tried to slip away in the confusion while packing the looted items.\n\nAt this time, the Justice Task Force raided the scene. A short skirmish with the robbers occurred, and during this process, two of the armed robbers were shot, but they succeeded in escaping with the rest of the robbers. The Justice Task Force ultimately failed to arrest them, and the incident remained unsolved."
 trinity_flavor_events.6.a: "Outlaws in the 20th century?"
 trinity_flavor_events.7.t: "A Stroll in a Pretty Village"
 trinity_flavor_events.7.desc: "In the rural north of Königsberg, current Kimigayama, there existed two families harboring deep ill will toward each other. These two families continued confrontation amidst long competition and conflict, but a group of outlaws who appeared like a comet began to skillfully exploit the tension between them. The outlaws impersonated police officers, deceiving both families and trying to use their confrontation as a tool for their own monetary gain.\n\nHowever, both families disliked the existence of this outlaw group, and eventually, one side decided to remove them first. The family that made a thorough plan deployed personnel to lure the outlaws into a trap. The outlaws appeared without knowing their plan, and in the moment tension hung in the air, one of the family's police pulled the trigger and the battle began.\n\nFierce skirmish proceeded rapidly. The outlaws succeeded in killing all the family's police by resisting with powerful firepower, but the police did not just suffer helplessly. The police succeeded in killing one outlaw during the battle and finished the operation by pressuring the outlaw group to leave the region.\n\nBy the time the Justice Task Force arrived, the outlaws had already left the city long ago."
 trinity_flavor_events.7.a: "I have to admit their marksmanship, at least."
 trinity_flavor_events.8.t: "Family Feuds, Now and Then"
 trinity_flavor_events.8.desc: "The sprawling corpses had already lost their lives to gunshots long ago. What was left there was only ruins and shocking brutality.\n\nThe beginning of this horrific incident will only be known to the outlaws. Whether they were taking revenge for an incident they experienced in Trinity City or for a completely different reason is unknown, but they killed and burned them more brutally than any other crime. They unfolded a merciless revenge drama, literally destroying a family.\n\nNot a single survivor among the family members has been confirmed so far. If this tragedy is true, it means the outlaw group was obsessed with revenge to the point of showing an extreme move of exterminating an entire family.\n\nThe situation was settled as the Justice Task Force arrived quite a while after the incident occurred. All the victims' bodies were recovered."
 trinity_flavor_events.8.a: "So they're going to be that uncivilized."
 trinity_flavor_events.9.t: "The Most Us-like Us"
 trinity_flavor_events.9.desc: "There is news that shocked numerous people. It's a bold robbery incident that occurred in Trinity's second city, Basis Schola. The notorious outlaw gang that constantly caused problems in Trinity society this time raided a train carrying soldiers' wages.\n\nThe train was passing through Basis Schola when it was ambushed by the gang. Basis Schola police and the Justice Task Force immediately set out upon hearing this news but eventually failed to pursue the train. The sheriffs who were on the train are estimated to have all died from the gang's overwhelming firepower, and if those who were injured during the pursuit are included, the number of casualties is likely to more than double.\n\nThe gang took the chance when the train stopped to quickly board and hijack the train. Subsequently, they succeeded in shaking off the pursuing police and the Justice Task Force by mobilizing machine guns. When the train stopped again, the gang had already fled, and the soldiers' wages that were on the train had vanished into thin air.\n\nAs this incident was reported as breaking news, citizens fell into great shock. Some were enthusiastic about the gang's boldness, but the majority deplored this incident and expressed anger. What is clear is that no matter how much attention these outlaws' bold crimes receive, the end will never be smooth."
 trinity_flavor_events.9.a: "Blood,"
 trinity_flavor_events.10.t: "Blood, Death, Redemption"
 trinity_flavor_events.10.desc: "Through the persistent efforts of the Justice Task Force, we succeeded in finding the gang's hideout. However, the sight we faced there was unexpected. Serious signs of division were seen inside the gang, and when we arrived, they were already confronting each other with gun muzzles pointed.\n\nAs the situation worsened, the Justice Task Force quickly launched a killing operation. The gang was instantly disintegrated and began to flee in confusion, split into two forces.\n\nWhile the pursuit continued, the 'Enforcer' force—one of the main forces of the gang—met its end due to internal division. They fled to nearby stone mountains and attempted a final resistance, but a betrayal occurred internally. A gang member turned against the Enforcer, and after a fierce physical struggle between them, the traitor neutralized the Enforcer and eventually drove him to death. The remaining gang members lost the strength to resist any further and surrendered, being arrested by the Justice Task Force.\n\nThe other force is still fleeing, but the possibility of them escaping the Justice Task Force's encirclement is slim. They too will soon either be arrested or unable to avoid the fate of being shot during resistance.."
 trinity_flavor_events.10.a: "Death,"
 trinity_flavor_events.11.t: "The Wheel of Life"
 trinity_flavor_events.11.desc: "Despite the persistent efforts of the Justice Task Force, some gang members succeeded in breaking through the encirclement and fleeing. However, as a result of the Justice Task Force's own discussion, it was judged that their remaining forces are no longer a grave threat to society, and they officially ended official pursuit with them being removed from the wanted list.\n\nLooking back at the end of the gang, they were eventually just a group of idealists yearning for freedom. The gang formed following their own ideals saw those ideals shattered into pieces in the clash with reality. Compromise with reality brought them division and corruption, and in the end, what remained was only death, ruined dreams, and the opportunity for redemption given to a few.\n\nTheir names were once known to numerous people and were talked about throughout Trinity. However, such fame will not last long and will only remain as a record of no more than a page in history.\n\nThe subsequent tracks of the gang members were not investigated or tracked in detail. But as time passes, some of them will live quietly forming families, and the rest will eventually pay the price for their sins through death."
 trinity_flavor_events.11.a: "Redemption."
 trinity_flavor_events.12.t: "Seia Yurizono Conspiracy Theory"
 trinity_flavor_events.12.desc: "A conspiracy theory that caused a big controversy in Trinity appeared today. The core is that Seia Yurizono did not actually die and concealed the incident by conspiring with the Remedial Knights.\n\nA year ago, one of the incidents that became the decisive catalyst for Mika Misono seizing Trinity's regime was the Seia Yurizono assassination incident. At the time, this incident caused a huge ripple in Trinity society. Subsequently, Seia Yurizono was recovered by the Remedial Knights, and the Remedial Knights side officially confirmed the death, announcing she passed away before receiving treatment.\n\nHowever, according to this conspiracy theory, there was some deal between Remedial Knights Captain Mine Aomori and Seia Yurizono, and a claim was raised that Seia Yurizono's death was falsely announced as part of this deal. The reality of the deal and the background of the announcement seem to be known only by Mine Aomori and Seia Yurizono.\n\nThe Remedial Knights side strongly denied such a conspiracy theory and completely refuted the content, but the controversy is showing signs of not subsiding easily."
 trinity_flavor_events.12.a: "Seia-chan.. It's okay even now, so..."
 trinity_flavor_events.13.t: "'Nazism'"
 trinity_flavor_events.13.desc: "Research on Nazism and the National Socialist German Workers' Party (NSDAP) is being actively carried out among Eden's intellectuals. They were the ideology and party that ruled Germany before Trinity ruled Eastern Germany, having seized Germany's regime from 1933 to 1935.\n\nWhat were the main ideologies of Nazism? They aimed for an authoritarian totalitarian state and suppressed other parties and established a one-party dictatorial system based on the 'Enabling Act' passed in 1933. Furthermore, they discriminated against and persecuted specific groups, including 'Jews,' based on anti-Semitism, and emphasized the superiority of the German nation by putting forward German nationalism, claiming the abnormal goal of securing living space for Germans.\n\nEconomically, they promoted economic recovery through large-scale public works and also put effort into the reconstruction of the Wehrmacht. Many researchers are claiming, 'If the Great Transfer incident did not exist, the state of Germany would have eventually waged war,' and this is a view receiving broad agreement in academia.\n\nTheir accession process was like a beast seeing through and attacking a prey's weakness. As a result, they grasped absolute power through the Enabling Act and succeeded in gaining the support of the German people through public works for economic recovery. Perhaps we can learn something from them."
 trinity_flavor_events.13.a: "An inspiration just came to me."
 trinity_flavor_events.14.t: "Whereabouts of the General Student Council President?"
 trinity_flavor_events.14.desc: "Through an official announcement of the General Student Council, the fact that the General Student Council President is currently in a missing state was confirmed. It was the moment various speculations and conspiracy theories that had been raised beneath the surface became reality, and it is extremely rare for the General Student Council to officially admit this.\n\nAs the fact of the disappearance was announced, the General Student Council immediately organized an investigation team composed of numerous professional agents to track her whereabouts and is analyzing the circumstances at the time of the disappearance by mobilizing information networks throughout Kivotos. However, her tracks are thoroughly hidden behind a veil, and various possibilities from external intervention to internal betrayal are being carefully mentioned.\n\nThe General Student Council President is a core figure symbolizing the order and balance of Kivotos and the only existence with legitimacy to adjust conflicts between academies. Her absence is not just the disappearance of one individual but signifies a political void for all of Kivotos and acts as a grave crisis that could even shake the balance of power between academies.\n\nAlready in some academies, movements to seek power expansion or independent lines by taking this confusion as an opportunity are being sensed, and such signs also contain the possibility of spreading into division and conflict throughout Kivotos.\n\nMajor academies including Trinity are closely watching the situation, and it is at a grave crossroads where the authority and existence of the General Student Council itself might be shaken. Kivotos, having lost its leader, is now being forced to make a new choice in a whirlpool of chaos."
 trinity_flavor_events.14.a: "This is shocking news."
 trinity_flavor_events.15.t: "The Companion"
 trinity_flavor_events.15.desc: "The seizure of power by Mika Misono and the Pater branch, which began with the Seia Yurizono assassination as a starting point, became a catalyst for conservatives to distance themselves from them. However, the masses rather flocked even more to the Pater branch and Mika Misono, and Mika Misono put effort into strengthening the regime's legitimacy, such as passing a charter amendment to guarantee her rule by the charter.\n\nTrinity's moderate branches collapsed rapidly after the assassination incident, and accordingly, figures with strong conservative tendencies or elitist ones began to join the Pater branch, where they were on a roll. They came to form a kind of 'moderate faction' within the Pater branch.\n\nHowever, the word 'moderate faction' does not perfectly explain them. They generally do not sympathize with political violence, absolute dictatorial systems, or the extreme claims of senior Pater branch officials, but they will tilt toward supporting Mika Misono when there is no other choice. In the first place, she is the only figure who can lead Trinity amidst this confusion.\n\nOther branches, especially Nagisa Kirifuji, would advocate for a peace treaty with Gehenna. But can a peace treaty truly be a realistic solution in this kind of situation now? What is clear is the fact that the existing Tea Party triumvirate system failed. What Trinity needs now is a strong leadership that can overcome confusion and patriots who will devote themselves to the country.\n\nMajor figures of the 'moderate faction' currently include former Sanctus officials such as Miho Tanaka and Yuka Sato, and former Filius officials such as Subaru Nagayoshi and Nana Yamamoto. They are gradually conforming to the Pater branch's current system and adapting to the new Trinity order."
 trinity_flavor_events.15.a: "More will follow her! ☆"
 trinity_flavor_events.16.t: "Side Effects"
 trinity_flavor_events.16.desc: "Trinity exerted effort in various ways to utilize the increased grounds as efficiently as possible through re-industrialization policies. As a result, practical effects appeared in some areas, and new industrial zones and residential complexes began to be formed rapidly. But it wasn't that there were no problems at all.\n\nMost of the workers put into the re-industrialization process were German locals or beastmen. Forcibly placing these two in the same barracks was the start of the dissatisfaction. When those with everything different from appearance to lifestyle were shoved into one space, conflict flared up in an instant. As the bullying by Germans became severe, the beastmen eventually set out for a collective counterattack. The Germans were pushed back in the surprise fight, but the group fight didn't end there. The project was suspended, and a collective brawl took place all day, and the scene became a mess, with even construction equipment being mobilized.\n\nFortunately, since weapons like firearms were all seized in advance, casualties did not occur greatly. The clash between both sides was suppressed by the swift dispatch of the Remedial Knights and the Justice Task Force, and the injured are receiving treatment from the Remedial Knights. But it appears such situations can occur again anytime unless fundamental solutions are prepared."
 trinity_flavor_events.16.a: "There's no choice but to get used to each other..."
 trinity_flavor_events.16.b: "Solve the problem for them..."
 trinity_flavor_events.17.t: "Report on the Guerrilla Crushing Operation and Local Trends"
 trinity_flavor_events.17.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\nTo the Host of the Tea Party\n\nAs a result of collecting information by taking charge of counterintelligence work within Trinity, the Academy Intelligence Agency achieved significant results related to the recently implemented guerrilla crushing operation and informs you that preparation to report to the Host has been completed.\n\nWe succeeded in assassinating some of the resistance organization's leadership through direct intervention of the Intelligence Agency. However, it is still only an extreme minority, and we confirmed that the resistance organization is spread in a more dense net form than thought. Nonetheless, if continuous effort is put in, it is judged to be sufficient to crush the resistance organization.\n\nLocal trends are somewhat cautious. The Tea Party's appeasement policy is seeing some effect, but it's limited. Local people are still cooperating with the resistance organization and distrusting us.\n\nWith respect,"
 trinity_flavor_events.17.a: "I'll need a more certain method.."
 trinity_flavor_events.18.t: "A Sudden Proposal"
 trinity_flavor_events.18.desc: "The moment she pushed the last old book in from atop the ladder, Ui Kozeki let out a sigh of relief. The problem was that wasn't the end. The ladder creaked, and her legs were already trembling.\n\n\"U-Uwaaaaa...\"\n\nJust as she was about to take a step carefully—\n\n\"Ui-chan!\"\n\n\"KYAAAAAAA!!\"\n\nSurprised, Ui lost her balance and fell from the ladder. Splat on the floor—shame came even before the pain.\nMika, who came down fluttering her wings, shoved her face in.\n\n\"Ahat☆ I really didn't know you'd be that surprised! Sorry~!\"\n\n\"M-Mika-sama... please, just not my fingers...\"\n\nShe almost let something wrong slip, but fortunately, Mika brought up another story.\n\n\"Ui-chan, you're good at organizing old books and stuff, right? You know a bit about economics too?\"\n\n\"...I can do some deciphering of ancient texts, but economics is...\"\n\n\"Then it's settled! Actually, I made a new club~ It's called the 'Academy Economic Development Bureau'! Isn't it cute?\"\n\n\"...My opinion...?\"\n\n\"Hmm? Naturally, Ui-chan quits the Library Committee and becomes the Head of the Economic Development Bureau. Doesn't it sound fun~?\"\n\n\"U-Um, that's a bit... I don't really have talent in that area...\"\n\nAt that moment, Mika's expression changed slightly. She was smiling, but those eyes were not smiling at all.\nMika slowly pulled something out, and the cold sensation of metal touched Ui's forehead.\n\n\"Ui-chan, are you joking with me right now? Are you serious?\"\n\nHer heart thumped and sank. Without even being able to breathe, Ui shook her head up and down.\nThen Mika returned to an innocent face.\n\n\"Good~ Now Ui-chan belongs to the Economic Development Bureau! I'll be in your care, Bureau Head!\""
 trinity_flavor_events.18.a: "\"W-Why did it turn out like this...\""
 trinity_flavor_events.19.t: "Hjalmar Schacht"
 trinity_flavor_events.19.desc: "Hjalmar Schacht did not imagine that the Great Transfer incident would shake his life to its core. One day, he witnessed his motherland split in two and an eagle descending upon that wounded land to peck at the torn corpse. And in that bruised place, a state—or something mimicking it—was established.\n\nWatching the Reichsbank he was part of burn, Schacht felt a sensation of something shattering into pieces inside. Accordingly, he decided to retreat to his hometown and live a quiet life while in self-reflection. Fortunately, only his hometown had dodged the war, and he believed he would finish the rest of his life quietly there.\n\nBut fate did not allow such peace. A massive change occurred in Trinity's leadership, and his name was called again from an unexpected place. The position of Head of the Academy Economic Development Bureau. At first, he intended to refuse stubbornly. He felt he was now behind the times and it was too much for him to take on.\n\nIn the end, he accepted the proposal and opened the doors of the reconstructed Reichsbank again. On top of the things that had collapsed, he was prepared to raise the economy once more."
 trinity_flavor_events.19.a: "Life is full of ups and downs."
 trinity_flavor_events.20.t: "Trinity Swimming Pool Tea Incident"
 trinity_flavor_events.20.desc: "\"Guys, throw it!\"\n\"Take this!\"\n\n- Splash! -\n\nA truly shocking incident occurred. One of Trinity's clubs, the 'Tea Party'—no, the Tea Garden—caused an incident close to an armed demonstration today. The beginning of the incident was simple. When the club budget was cut, the Tea Garden committed an extreme action of throwing all their tea sets into the swimming pool in protest.\n\nParticularly, as the problem swimming pool was located not far from Eden, the incident spread rapidly and caused a huge ripple within the academy. Their sudden action was eventually suppressed by the intervention of the Justice Task Force, but the swimming pool reached a state where restoration is effectively impossible. The disposal of the said facility will proceed via the academy budget."
 trinity_flavor_events.20.a: "Even so, don't think about drinking the black tea from that swimming pool.."
 trinity_flavor_events.21.t: "Dessert Looters"
 trinity_flavor_events.21.desc: "\"This is crazy.. they say everything's closed.\"\nYoshimi Ibaragi had her chin on the desk with a dark expression. The time was already past noon.\n\n\"Told you, you guys must've seen it yesterday too. All the shops were a mess.\"\nKazusa said, looking at her phone as if it were natural.\n\n\"Fufu... A sweet world collapses in an instant like that, huh...\"\nStanding by the window and looking out, the one who tossed out a word was Natsu Yutori. Her tone was even more strange than usual today, and her eyes were wandering in the air.\n\nPhotos of the front doors of dessert shops they had reviewed so far were sprawled on the desk, and red X marks were drawn on top of them with a sign pen.\n\n\"You're saying all the shops here closed? Does that make sense? The world suddenly changed... I still don't know what on earth happened to us!\"\nYoshimi said angrily.\n\n\"...Yoshimi, Yoshimi, Yoshimi. Haven't you realized yet? Right.. <The place where the legendary dessert is>.\"\n\n\"Stop it, Natsu. Talk seriously. You looked into some weird place again, didn't you?\"\nKazusa said as if Natsu were unreliable.\n\n\"Of course I did...\"\nNatsu slowly turned her head and gave a slight smile.\n\"To the east of the Central District.. a new dessert shop..!!\"\n\nThen everyone looked at Natsu. Natsu reached out her hand and said to them:"
 trinity_flavor_events.21.a: "\"Aah.. Will you set out together? On the path of 'Dessert.'\""
 trnfla_21_tt: "§gYoshimi looked at that hand silently, then grumbled and stood up from her seat.\n\"...Seriously, if you take us to a weird place again... I'm taking the ice cream money from you.\"\n\nKazusa eventually let out a sigh and said,\n\"It doesn't make sense, but let's go for now.\"§!"
 trinity_flavor_events.22.t: "Internet Connection Established"
 trinity_flavor_events.22.desc: "\"Sigh... Another day like this.\"\n\nHana Minamino is a second-year student at Trinity General School living in a rural area quite far from the Trinity Central District. She didn't join a club. No, she couldn't join one. Her commute was far too long. Furthermore, since the bus route ran so infrequently, she would barely arrive home after 8 PM. Thus, Hana had spent her days interacting with people through the internet from home.\n\nHowever, as the world turned upside down, even that internet was cut off. While the internet was down, Hana tried everything she could. She typed all sorts of things into search engines to try and connect. (Of course, since there was no internet, there was no response.) She lived a life of constant inconvenience, spending her time calling her few friends or making the effort to go to the Central District to sit in cafes all day just for the internet before heading home.\n\nThen came one fateful day.\n\n\"It's connected...\"\n\nHana held her breath. In the bottom right of the monitor, that familiar Wi-Fi icon was finally full with white bars. The gray 'X' mark that had been blinking mockingly had disappeared.\n\n\"......Wow, it's real.\"\n\nAs if unable to believe it, she tapped the keyboard a few times. She typed random words into the search bar. \"Internet restored\" \"I'm saved\" \"Trinity\" \"Solitude\" Whatever came to mind. And the screen began to move. Links opened, images loaded, and advertisements popped up. A door had truly opened. A path had finally reopened to the world she had been isolated from.\n\n\"It worked... This is it...\"\n\nHana chuckled. The laughter echoing in the living room was quiet, but it was a genuine voice bursting out for the first time in a long while."
 trinity_flavor_events.22.a: "That's a nice story."
 trinity_flavor_events.23.t: "Trinity's Agricultural Crisis"
 trinity_flavor_events.23.desc: "Trinity's agricultural sector has completely collapsed following the incident. While existing automated smart farm facilities were efficient in land use, they have ceased operations due to energy resource shortages and the 'Lost Technology' issue. Immediate food shortages were avoided thanks to stockpiled rations. However, if no action is taken, a situation may soon arise where even a single piece of bread becomes difficult to obtain. Fortunately, the fact that most of the territory we occupy consists of plains offers a glimmer of hope. Discussions are underway to expand agricultural activities by adopting traditional methods from decades ago, even if they are less efficient than before."
 trinity_flavor_events.23.a: "The great plantations of Great Trinity are now relics of the past..."
 trinity_flavor_events.24.t: "From Outer Space"
 trinity_flavor_events.24.desc: "\"Secretary-chan? So, what did you say was on the agenda for today?\"\n\n\"There is nothing for today. Besides, you handled quite a bit of work late into the night yesterday.\"\n\n\"...Then I guess I should enjoy some leisure time for once~!\"\n\nA few laughs were shared at the light joke. The atmosphere softened, and Mika lifted her teacup again. She slowly savored the aroma and took a sip. The familiar Tea Party location, the familiar scenery. Yet, Mika Misono felt a certain emptiness. For some reason, the tea's aroma felt flatter than usual.\n\n\"Aagh!\"\n\nStartled by the sudden scream, Mika set her teacup down and sprang from her seat.\n\n\"Secretary-chan?!\"\n\nAs she ran over in alarm, the secretary was clutching her forehead, breathing heavily.\n\n\"Huff... huff... I'm alright... It's just, for a moment, it felt like my head was splitting...\"\n\nHer face was pale, and the remnants of pain still seemed to linger. Mika advised her to visit the Remedial Knights, and the secretary nodded before departing. Mika quietly saw her off and returned to the tea table.\n\nShe sat down and poured another cup of the remaining tea. Since there was no work today, she figured she could just focus again in a moment. But the moment she lifted her teacup, Mika felt an intense pain as well.\n\n*Thump.*\n\nIt felt as if her brain was exploding inside her skull. her vision blurred, and it was difficult to maintain her balance. It was exactly the same symptom the secretary had experienced. Mika knew instinctively—this was no mere migraine.\n\nAs the pain subsided momentarily, Mika recalled a certain story she had learned during history class back when she was buried in books."
 trinity_flavor_events.24.a: "It is the Color Out of Space."
 trinity_flavor_events.25.t: "From the New World"
 trinity_flavor_events.25.desc: "Atsuko is walking through the Trinity Central District."
 trinity_flavor_events.25.a: "\"I hope many flowers bloom on this path too.\""
 trinity_flavor_events.27.t: "Hyakkiyako - Justice Task Force Joint Training - Day 1"
 trinity_flavor_events.27.desc: "\"W-Woah! H-H-Hold on! Your outfits are so pretty?! Did you match them because of today's joint training?\"\n\n\"Pardon...? These are all standard Justice Task Force uniforms.\"\n\n\"E-Even so, they're really cool! It's like... it feels like seeing school uniforms I've only seen in books in real life...\"\n\n\"Fufu, I'm glad to hear you say that. We can have a custom set made for you if you'd like.\"\n\n\"R-Really...? O-Oh, no! Is it okay for me to just accept something like this...?\"\n\n...\n\n\"Uwaaa-! I really don't know! I think I'm having a sudden acute Youth-nium allergy shock! My head... I can't think...!\"\n\n\"I'm sorry, but...! Could we postpone the next training for a bit? I feel suddenly dizzy...\"\n\n\"Yes. Then we shall suspend training for now... In the meantime, would it be alright if we looked around Hyakkiyako?\"\n\n\"...?\"\n\n\"She disappeared the moment I looked away.\"\n\nAnd so, Hasumi and the members of the Justice Task Force quietly concluded Day 1 while looking around Hyakkiyako."
 trinity_flavor_events.27.a: "\"Should I really accept it...? But is it okay to just take it upon our first meeting? Ugh. I really don't know~.\""
 trinity_flavor_events.29.t: "To One's Original Self"
 trinity_flavor_events.29.desc: "\"Duck. Duck. Please respond. This is Penguin.\"\n\n\"Sigh... Why is there no answer? The radio is clearly functional...\"\n\nSince that day, everything changed. Not just Trinity, but all of Kivotos was boiling with reports of the incident all day long.\n\nPlans were scattered to the wind. Since that day... Duck, that is, Mika Misono, had not responded to a single transmission.\n\nI have to go back. That single thought dominated Azusa Shirasu's mind.\n\n\"...Transmission ends. Over. Penguin out.\""
 trinity_flavor_events.29.a: "Et Omnia Vanitas (All is vanity.)"
 trinity_flavor_events.30.t: "Azusa Shirasu's Return"
 trinity_flavor_events.30.desc: "Azusa Shirasu has finally returned to the halls of Trinity."
 trinity_flavor_events.30.a: "Welcome back."
 trinity_flavor_events.31.t: "Toward a Trinity-esque Society"
 trinity_flavor_events.31.desc: "About two months have passed since the large-scale protest in the Central District and the subsequent resolution of the Trinity-Germanic social issue. At the time, many overseas experts predicted that Trinity would eventually collapse due to its internal contradictions, and articles filled with sensational headlines and provocative photos exaggerated the crisis. However, contrary to those observations, Trinity is gradually regaining internal stability, and the social contradictions created by the Great Transference incident are slowly being resolved.\n\nMika Misono's political platform superficially advocates for social reform, class cooperation, and a unitary system, showing a seemingly right-wing aspect. However, her ideological colors are complex and multifaceted, making it difficult to categorize her simply by left or right ideologies. In particular, the Trinity students, who have changed rapidly since the Great Transference, are increasingly demanding more radical and aggressive policies from Mika.\n\nIn this situation, Mika Misono is reducing cooperation with the Kivotos General Student Council to protect Trinity's unique strengths. Her judgment is that approaches like the 'Eden Treaty' promoted by the General Student Council were mere temporary patches rather than fundamental solutions. Mika intends to restore Trinity's identity and ideals not by compromising with external forces, but through her own methods. What she seeks to protect is not merely a system or authority. It is the souls, the love, and the youth of Trinity students themselves."
 trinity_flavor_events.31.a: "Glory to our Alma Mater!"
 trinity_flavor_events.32.t: "Post-Mortem"
 trinity_flavor_events.32.desc: "\"Waaa~! Nagi-chan! How are you? Is anything uncomfortable?\"\n\n\"...It is uncomfortable. Still, it is better than a dungeon.\"\n\nA moment of silence followed. A strange tension hung between the two. Each was feeling a different kind of discomfort from their respective positions.\n\n\"If you have come to see me personally... do you have more to say?\"\n\n\"Umm... No, I just thought I'd never see you again.\"\n\n\"...\"\n\nNagisa could not find the words to continue. Mika knew that look in Nagisa's eyes all too well. They were childhood friends, after all.\n\nNagisa closed her eyes tightly and muttered in a voice that sounded like a sigh mixed with a tremor.\n\n\"I did not know you would go this far, Mika-san... I thought that especially at a time like this, Mika-san would...\"\n\n\"Why? How come? Because of this incident? This large-scale incident of unknown cause... Did you take it as an opportunity to crush Gehenna? To the point of even locking me up, your childhood friend of over 10 years...?\"\n\n\"...Don't tell me, Mika-san, were you also involved in what happened to Seia-san?\"\n\n\"Stop it, Nagi-chan.\"\n\n\"This isn't a complicated story. I hated Gehenna, so I used people, I imprisoned them... and if necessary, I got rid of them. That's all.\"\n\n\"...Could there have been some mistake or misunderstanding? Perhaps there is a completely different truth behind this.\"\n\n\"Ahahaha. A different truth?\"\n\"Nagi-chan, you're so naive. That's why I liked you, though.\"\n\"Nagi-chan, you didn't know what kind of person I was at all.\"\n\n\"Why... I...\"\n\nNagisa collapsed into her seat as if the strength had left her legs.\n\n\"You're asking how you didn't know despite being together for so long? Don't you know the answer better than I do, Nagi-chan? We are ultimately strangers. There's no way we could know each other's inner thoughts.\"\n\n\"...I'll be going now. I have much to do.\"\n\n\"...Yes. Take care on your way back, Mika-san. I... cannot see you out, but.\""
 trinity_flavor_events.32.a: "Nagisa left a final goodbye in her heart."
 trinity_flavor_events.33.t: "(General) I finally pulled 'Mika Misono' lol \n00 | [GetDate] "
 trinity_flavor_events.33.desc: "------------------------------------------------------------------------------\n\n(Photo of a cat)\n\nRecommend something for lunch.\n\n                                                  3 Upvotes | Downvotes 1013\n\nTotal Comments §t1000§!\nThe number of comments has exceeded 1000. No more comments can be posted.\n\n01\nAre you kidding me right now?\n\n02\nAh...\n\n03\nIs it fun to mock desperate people?\n\n04\n(Emoji of Peroro looking disgusted)\n\n05\nNO LEWD THINGS ALLOWED!!!!\n\n06\n(Emoji with the text \"Dumbfounded\")\n\n07\nDon't you ever go around saying you like Lady Mika Misono,\nyou dim-witted brat. You can literally see her if you wait\na few months at the famous Trinity beach. At least try \nbefore you start baiting.\n\n08\n>>07\nSister...\n\n....Even after that, aggressive comments toward the author continued to pour in."
 trinity_flavor_events.33.a: "Huh?"
 trinity_flavor_events.34.t: "Our Story - 1"
 trinity_flavor_events.34.desc: "At sunset, Mika was enjoying a swim alone at the beach. Swimming wasn't exactly her hobby, but that day she felt a strange urge to go to the beach, and after arriving at the empty sea, she had been playing in the water for quite a while.\n\nNow she was sitting on a sunbed, watching the sunset. It was the same Earth sun that was no different from the sun in Kivotos, but today it felt uniquely special.\n\nThe sunset was truly beautiful, but as the sun gradually disappeared beyond the horizon, Mika slowly stood up.\n\n\"The sunset from here is also ordinary, no different from Kivotos.\"\nSomeone spoke quietly while looking at the setting sun. It was Seia in a swimsuit.\n\n\"Se-Seia-chan?!\"\n\"H-How are you here...?\"\n\n\"Don't be alarmed, Mika. I only came to have a conversation,\"\nSeia said softly, as if to reassure Mika.\n\n\"Seia-chan... B-But!\"\nMemories of that day came back vividly. Mika was at a loss for words and could say nothing.\n\n\"Yes, it is true that I was attacked that day. Please think of this as my final message.\"\n\"Like a wolf, you will seize the opportunity to complete your autocracy. Or perhaps you have already completed it?\"\n\"But, was this truly what you wanted to obtain, even to the point of locking up your childhood friend?\"\n\n\"...\"\nMika just stared at Seia in silence.\n\n\"To be honest, the current you isn't like you at all.\"\n\"The person who used to scream for peace with Arius while lost in a field of flowers...\"\n\"Are those things no longer necessary to you?\"\n\n\"......\"\n\n\"Mika, I'm sorry, but it seems time is up.\"\n\n\"W-Wait! Seia-chan! It's too much to just say your piece and leave like that!\"\n\n\"It cannot be helped. But Mika, you would understand.\""
 trinity_flavor_events.34.a: "Mika hurriedly reached out her hand."
 trinity_flavor_events.35.t: "The Corporatists"
 trinity_flavor_events.35.desc: "The Corporatists advocate for class collaboration in the literal sense. They believe that all people should evolve as a functionally integrated organism, much like the human body. Of course, the evolution they speak of is not biological. They strive to regulate conflicts and differences between classes through cooperation and the common good, actively encouraging solidarity, subsidiarity, collective bargaining, and worker participation. Religious values, such as the value of the family, are also held in high regard. They support partial market intervention and welfare, possessing a pro-labor and communal orientation.\n\nThis is the political color mainly oriented toward by moderate or left-leaning officials. However, recently, officials with corporatist ideologies have rapidly increased within the Pater faction. This means that, whether they like it or not, the Tea Party is currently being reorganized around the corporatists, displacing the ideologues."
 trinity_flavor_events.35.a: "We should adopt their ideas as the ideology of the Tea Party."
 trinity_flavor_events.35.b: "Their ideas are far too idealistic."
 trinity_flavor_events.36.t: "Light in the Darkness"
 trinity_flavor_events.36.desc: "Commemorating the fall of Nazi Germany and the victory of the true Kingdom of Christ.\nFrom Rome, the See of Saint Peter,\nIn the Year of our Lord 1936, Eastertide.\n\nTo our beloved sons and daughters, to the Catholic faithful throughout the world, and to our dear brothers and sisters who have achieved a victorious peace:\n\n1. Within God's Providence\nIn every age, the Lord breaks the pride and tyranny of man to reveal humility and justice. In our time, a power that absolutized itself against Christ and the truths of His Gospel has collapsed. We look upon the end of that regime—which preached racial superiority, denied the Creator, and used man as a mere tool—with deep emotion and gratitude.\n\n2. The End of a False Faith\nThat ideology known as Nazism sought to seat man, a creature, in the place of the Creator; it made an idol of the nation, oppressed the weak, and shed innocent blood. However, the words of the Lord, \"The light shines in the darkness, and the darkness has not overcome it\" (John 1:5), have finally been fulfilled in the theater of history.\n\n3. To the Nations that Defended Justice and Faith\nWe offer deep praise and blessings in the Lord to the Christian nations that became instruments of this victory. Even amidst the fires of war, you fought for your oppressed brothers and broke the tyranny that veiled the light of truth. This is not a mere military victory, but a victory for loyalty to God and the freedom of the Gospel.\n\n4. The Task of Peace\nBut victory is not the finish line; it is the beginning. Now your mission is to build the love and justice of Christ upon the ruined cities and wounded souls. Sow forgiveness instead of retaliation, and reconciliation instead of hatred. Only the peace of Christ can fill the deep chasms left by war.\n\n5. An Exhortation to All\nBeloved brothers and sisters, let us thank God for this historical moment and be vigilant so that no power ever stands above God again. Like the prophet on Mount Carmel, we must cast out false gods and confess that \"The Lord alone is God.\"\n\n6. Concern and Prayer for Unity\nThough today's victory was achieved through God's instruments, we remember that the victors do not reside within the full Catholic faith. The incompleteness of that faith and the differences in doctrine remain as tasks to be moved toward true unity in the future. Therefore, we accept this victory with both gratitude and caution, praying that all Christians may become one in \"one Lord, one faith, one baptism\" (Ephesians 4:5).\n\nMary, Queen of Peace, pray for us.\nChrist the King, reign over us."
 trinity_flavor_events.36.a: "From Rome, the See of Saint Peter\nPope Pius XI"
 trinity_flavor_events.37.t: "A Visit to the Library"
 trinity_flavor_events.37.desc: "\"Fufu. This is the first time I've actually come to the library.\"\nNagisa Kirifuji spoke in front of Ui Kozeki. However, Ui Kozeki was so focused on her work that she didn't hear her properly.\n\n\"Oh? Can you not hear me?\"\n\n\"Hieeek-!\"\n\"Y-You scared me... In my workspace... What are you... H-Hieeek!\"\nIt didn't take more than a few seconds for Ui Kozeki to realize the person in front of her was Nagisa Kirifuji. She clutched her head and muttered in a small voice.\n\n\"Fufut. Don't worry, I won't hurt you. The reason I'm here is... I need help.\"\nNagisa Kirifuji spoke softly, as if to put Ui Kozeki at ease.\n\nBut Ui Kozeki did not lower her guard and covered the lower half of her face with a book. Distrust still lingered in her eyes.\n\n\"Oh my... Don't be so cautious. I'm looking for a book. It's a bit sensitive to mention... but it's a book related to the Arius Branch School.\"\nAt those words, Ui Kozeki slowly lowered her guard, but she still maintained a certain distance.\n\n\"A-Arius Branch School... It's probably, p-probably in the basement...\"\n\n\"Fufut. Thank you for your cooperation, Ui-san.\""
 trinity_flavor_events.37.a: "Nagisa headed to the basement with her guards, wearing a smile."
 trinity_flavor_events.38.t.Yoshimi: "Explosive Climax"
 trinity_flavor_events.38.d.Yoshimi: "Yoshimi Ibaragi was far removed from military command and never imagined she would become something like a general. However, as Trinity entered a state of war, clubs were mobilized to supplement the lack of generals. For her, who was part of the After-School Sweets Club, there was no grand career or formal study in military command. Nevertheless, through constant mobilization in military command and operations, her skills grew rapidly. Her recent achievements on the battlefield were worthy of commemoration. Under her decisive command, she recaptured key strategic points and proudly planted the flag of victory, earning a fair amount of fame among Trinity soldiers. Military figures are curious about the next move of the one they call the 'Little Giant'."
 trinity_flavor_events.38.Yoshimi: "\"You can look forward to it. No, expect it!\""
 trinity_flavor_events.38.t.Airi: "Further and Wider"
 trinity_flavor_events.38.d.Airi: "When Trinity entered a state of war, the chronic shortage of generals led to the mobilization of clubs. The After-School Sweets Club was also mobilized, and among them, Airi Kurimura, the de facto leader of the club, was drafted as an officer. Though she knew nothing of military command, she did her best in her position. Airi proved her leadership by bravely leading her soldiers and successfully concluding operations. Some questioned how someone so ordinary and plain could lead, but she earned their trust by proving herself. Airi Kurimura is often seen looking quite flustered by the sudden surge of attention. However, it seems she doesn't entirely dislike it."
 trinity_flavor_events.38.Airi: "\"I'll show you. How much I've changed!\""
 trinity_flavor_events.38.t.Natsu: "This, too, is the Philosophy in Dessert"
 trinity_flavor_events.38.d.Natsu: "Among the rising stars of the Trinity military, another prodigy has appeared. It is Natsu Yutori, who has built an impressive record. Her command style is somewhat unique, but she is deeply loved by her soldiers. Her actions on the battlefield are sometimes unpredictable. However, behind them lie insight and a sincere heart for her soldiers. She reads the atmosphere of the battlefield, assesses the state of her soldiers, and employs her own unique tactics. Natsu Yutori does not merely pursue victory. She never loses camaraderie and bond even in the heat of battle, fighting for her comrades and boosting their morale. Her efforts to derive the best situation while remaining human have earned her broad support from many soldiers."
 trinity_flavor_events.38.Natsu: "\"I want to add some dessert to this space, will you help me?\""
 trinity_flavor_events.39.t: "Gourmet Research Society"
 trinity_flavor_events.39.desc: "\"As expected, it does not suit my palate... It's a failure.\"\nHaruna spoke coldly as she pressed a button in her hand. Instantly, explosives went off with a roar, and the restaurant's interior was engulfed in flames and debris. Amidst the mixing screams and chaos, the Gourmet Research Society had already boarded their vehicle. Leaving the burning smoke and light behind, they accelerated away from the scene.\n\nHowever, the report had already been filed. Cutting through the sound of sirens, Justice Task Force vehicles quickly gave chase.\n\n\"Whoa! W-What?! They're already chasing us?\"\nJunko leaned out the window, looking panicked. Haruna smiled as if accustomed to this and added a word toward the Justice Task Force.\n\n\"Fufut, members of the Justice Task Force. Have you been well? I was exploring various restaurants today to pursue gourmet...\"\n\nHaruna's provocative shout echoed over the road. But the reply was immediate gunfire. The sound of shattering glass and tearing metal followed.\n\n\"This is troublesome... I didn't expect to encounter an obstacle here...\"\nJust as Haruna was speaking with feigned composure, the vehicle screeched to a halt. Akari's gaze was fixed forward. Justice Task Force vehicles were tightly lined up on the road, completely blocking the path.\n\nThe car doors opened, and Justice Task Force members quickly scattered to tighten the perimeter. Muzzles were simultaneously aimed at the Gourmet Research Society's vehicle.\n\n\"Tch... It seems this is as far as we go. The path of gourmet is indeed treacherous.\"\nHaruna slowly looked around at the surrounding Justice Task Force and raised both hands in a gesture of surrender. The other members in the car exchanged glances and reluctantly raised their hands as well. A silence filled with tension lingered. The Justice Task Force arrested them and immediately transported them to prison."
 trinity_flavor_events.39.a: "Gehenna is truly something else.."
 trinity_flavor_events.40.t: "When the Tiger is Away.."
 trinity_flavor_events.40.desc: "The excessive workload as the Host was enough to exhaust Mika Misono. That weight, coupled with her inherently unstable personality, finally led her to her own private villa. Mika gave herself the gift of a vacation and decided to entrust herself to four days of brief rest. The place she visited with two bodyguards was a secret beach owned by the Tea Party. There, she held simple tea parties with the guards, shared light conversation, and would often sink into solitary contemplation. In that way, she was slowly releasing the accumulated fatigue and tension within her own world. Meanwhile, during her absence, three representative figures from the Pater faction were leading the state affairs, reflecting the will of the faction."
 trinity_flavor_events.40.a: "The Fox will be King."
 trinity_flavor_events.41.t: "To My Future Self Reading This"
 trinity_flavor_events.41.desc: "Please write that Hugenberg is issuing newspapers and leaving short comments on the internet criticizing or condemning Trinity, including Mika Misono, because he is displeased with them."
 trinity_flavor_events.41.a: "To my dear future self, left by my past self."
 trinity_flavor_events.42.t: "The Kreisau Circle"
 trinity_flavor_events.42.desc: "There are many organizations resisting Trinity. Of course, not a few have been arrested and handed over to the Justice Task Force to be locked in camps. However, a recently caught group was quite interesting: the Kreisau Circle.\n\nWhat is so special about them? The name itself comes from a specific location, so it's not very exciting. But their bold actions caught our eye—they were a small social gathering operating in the basement of Eden, the Eternal Capital. To be precise, they operated underground on the border of the Central and West Districts, but thanks to brave students who discovered and reported them, they were arrested. As a side note, this organization consisted of a quite interesting combination of people from noble families, religious figures, and socialists."
 trinity_flavor_events.42.a: "Were there no Polish Jews? Thank goodness."
 trinity_flavor_events.43.t: "Primal Fear"
 trinity_flavor_events.43.desc: "\"Ouch! Hey, you brat! That hurts!\"\n\n\"...Are you afraid of me?\"\n\n\"She's crazy..\"\n\"..Hey, should we call the Vigilante Corps?\"\n\n\"No.. that's a bit..\" \"Aaack!\"\n\n\"It hurts, doesn't it? This very moment! You feel like you've fallen into the pit of pain, right? That is exactly my mission! To save you by planting fear in you!\"\n\n\"Salvation! PUNCH!!!\""
 trinity_flavor_events.43.a: "This isn't fear, it's just anger."
 trinity_flavor_events.44.t: "The First Task"
 trinity_flavor_events.44.desc: "The position of Tea Party Host is not an unfamiliar seat for Mika Misono. In the past, she had already served as Host once and handed over the position to the next faction according to custom after cleanly finishing her term. However, the situation is different now. While the Host's term was strictly limited to one year in the past, it can now be extended virtually indefinitely. As long as the new Trinity Charter guarantees it, her term will continue.\n\nThe work itself is not that strange to her. As a faction leader who already bore heavy responsibilities, the Host's duties are merely a slight addition of administrative procedures and protocols to her existing workload. Paperwork is certainly tedious and boring, but most of it can be handled quickly. Reviewing meeting minutes, approving budgets, and organizing consultation matters with the factions are tasks she has become familiar enough with to handle almost mechanically.\n\nTo efficiently utilize the time remaining after finishing work, Mika is creating her own personal routines. She takes time to calmly brew and drink tea alone in her office to wrap up the day, or sometimes performs light calisthenics or yoga in a space provided in a corner of the office to relax her tense body. Mika knows well that these quiet moments are necessary for her, and thus she makes an intentional effort to secure time outside of work."
 trinity_flavor_events.44.a: "So this is a tutorial disguised as a story, right?"
 trinity_flavor_events.45.t: "The Ideologues"
 trinity_flavor_events.45.desc: "Trinity's development has been built under the ideology of heroic Hosts from top to bottom. The Ideologues are extremist officials who claim that Mika Misono is exactly such a 'heroic Host' and that only absolute and firm devotion is needed, even for her capricious policies. They mainly advocate for the planning of society. They believe Trinity is a single organism and can only function properly if its organs operate in harmony. Therefore, a divided organism is bound to collapse in chaos, and they believe only centralization of the system will make the school flourish.\n\nWhether one likes it or not, the Ideologues are rapidly expanding their influence within the Tea Party. They are demanding a more coercive and heroic persona from Mika Misono. According to the belief of the Ideologues, Mika Misono is naturally destined to rule not just Trinity, but all of Kivotos."
 trinity_flavor_events.45.a: "We should adopt their ideas as the ideology of the Tea Party."
 trinity_flavor_events.45.b: "Their ideas are too radical."
 trinity_flavor_events.46.t: "What is Student Solidarity?"
 trinity_flavor_events.46.desc: "Trinity society has long been formed through the voluntary solidarity of students. The 1st Council began with an emphasis on the voluntary solidarity and peace of the pioneers."
 trinity_flavor_events.47.t: "A Thankful Mine."
 trinity_flavor_events.47.desc: "To [TRM.GetLeader],\n\nThank you for the support. Thanks to you, we caught the bandits. It seems we'll need some relief. Thank you once again for the support."
 trinity_flavor_events.47.a: "I guess I should raise my reputation."
 trinity_flavor_events.48.t: "Sakurako's Letter"
 trinity_flavor_events.48.desc: "I have received news regarding the recent curriculum reorganization. You have relegated the chapel services, which cultivate the students' spirituality, to the realm of 'optional.' From the perspective of the Sisterhood, it was a truly regrettable decision. However, for someone who pushed faith out of the classroom to turn back and lean on the Lord's authority the moment they have a personal need... even I cannot help but be impressed by such an incredibly flexible attitude. Nevertheless, a covenant is a covenant. The Sisterhood will cover even that contradiction with prayer and take the hand you have extended."
 trinity_flavor_events.48.a: "My bad!"
 trinity_flavor_events.49.t: "Our Story - 2"
 trinity_flavor_events.49.desc: "Mika hurriedly reached out her hand, but her fingertips touched nothing. The dazzling sunset and the sound of calm waves vanished in an instant like a lie.\n\nMika sat bolt upright, gasping for breath. Cold sweat poured down her back, soaking her pajamas. She looked around, but it was not the beautiful beach she had been on just a moment ago. It was her familiar bedroom, filled with cold, still air.\n\n\"It was... a dream.. Yeah..\"\n\nMika wiped her face with her hands, trying to calm her racing heart. Her face felt burning hot against her palms. But it felt too vivid for a dream—Seia's voice and those cold eyes were still fresh.\n\nShe sat on the bed, staring blankly into space. Her mind was a tangled mess. The autocracy, her imprisoned childhood friend Nagisa, and her changed self. Seia had accurately pierced Mika's most painful spot before disappearing.\n\n'The current you isn't like you at all.'\n\nThose words would not leave her ears. Had the version of herself that dreamed of hope really disappeared? Was the path she had taken truly the right one? Guilt and self-justification crashed against each other like waves. But the arrow had already left the bow, and there was no way to take it back. She hugged her knees, her trembling lips parting. In the darkness, a monologue flowed out, unheard by anyone.\n\n\"I... I just... felt like I had to do this...\" Her voice was precarious, as if she were about to burst into tears at any moment. Mika added a desperate promise toward a friend who might be somewhere in the darkness, or might have disappeared forever. \"But... I'll do a good job... Yeah. Let's... definitely meet again...\""
 trinity_flavor_events.49.a: "Mika spoke quietly, shedding tears."
 trinity_flavor_events.50.t: "Sisterhood Investigation"
 trinity_flavor_events.50.desc: "Information Bureau investigations have revealed the Sisterhood student to be Hinata Wakaba. It came to light during the investigation that she had carried out these actions to fulfill a request from the Library Committee President. Since the nature of the crime isn't particularly heavy, she is set to be released soon, but the Sisterhood finds it unpleasant that an investigation was conducted based on mere suspicion."
 trinity_flavor_events.50.a: "My bad!"
 trinity_flavor_events.51.t: "Trinity Ground Forces"

 trinity_flavor_events.1000.t: "Inner Anguish"
 trinity_flavor_events.1000.desc: "Today was a more special day than any other for Mari Iochi. On the unfamiliar stage of an idol performance, despite a few minor issues, she finished with a shining performance. Her appearance under the brilliant lights left a deep impression on Trinity students, and now everyone was looking forward to 'Idol Mari Iochi.' Expecting her to stand on stage again someday, the fans left the venue with enthusiastic cheers.\n\nHowever, from the moment the stage ended, Mari began a quiet battle of her own. Her life as a nun was her faith and her reason for being. The past years spent under strict discipline were not light, and Mari believed that path was her given destiny. Yet, in that brief moment on stage—amidst the lights, the cheers, and the countless gazes reaching out to her from below—\n\n\"Is this... truly alright...?\"\nIn the quiet waiting room behind the stage, Mari muttered while looking at her reflection in the mirror. The sparkling outfit, her still-warm breath, and the lingering afterglow of the applause in her fingertips. Surely, this might be a path different from what the Lord intended. And yet, somewhere deep in her heart, she continued to miss that stage.\n\nHer days of contemplation were not easy. Whether during prayer or in the silent cathedral, Mari threw questions at herself over and over. Between the life lived as a nun and the 'free me' on stage, which one is the real 'Mari Iochi'?\n\nAnd finally, she made a quiet decision."
 trinity_flavor_events.1000.a: "I, hereby declare myself an idol!"
 trinity_flavor_events.1000.b: "I must engrave my resolve as a nun in my heart once more!"
 trn_idol_portrait_tt: "§LMari Iochi's portrait will be changed to her idol outfit.§!"
 trinity_flavor_events.1001.t: "Casting Off the Habit"
 trinity_flavor_events.1001.desc: "In the quiet courtyard of the cathedral, it was an afternoon where soft sunlight filtered through the stained glass.\nWith trembling hands, Mari Iochi began to undo the buttons of her habit one by one. Her rosary swayed slightly, making a sound. Sakurako Utazumi watched her in silence.\n\n\"Sakurako-sama... I don't think I can stand here wearing this anymore.\"\nMari continued without averting her eyes. \"I... will walk the path of an idol. I believe that is another mission given to me.\"\n\nFor a moment, Sakurako's eyes wavered slightly. A brief silence fell over her calm face. But soon, she folded her hands, took a deep breath, and nodded gently.\n\n\"...Very well, Sister. I only pray that your decision does not stray from the will of God.\"\nShe smiled and took a step closer. \"And above all... if it is a path where you can shine as yourself, I will support you at any time.\""
 trinity_flavor_events.1001.a: "Love me! More! Look at me! More!"
 trnfla_1001_tt: "§L\"...I see Sister Mari had that side to her as well. By the way... if it's idols, there would only be myself or Captain Mine ...I'm a bit worried about who she intends to be an idol with.\"§!"

 trinity_flavor_events.1002.t: "What One Desires"
 trinity_flavor_events.1002.desc: "Mari Iochi sat on a bench in the silent cathedral, holding onto her wavering heart for a long time. The brilliance of the stage and the applause, the emotions that bloomed within—they were so intense that at times they felt more like her true self than her habit. However, Mari finally reached one conclusion.\n\n-I will continue to walk the path of a nun.\n\nEven though she had made her decision, her heart was not yet completely clear. A feeling as if something were caught somewhere in her chest. To find that answer, she headed to her usual quiet place: the shooting range. The space was organized as usual, with a silent breeze. It was a place distanced from both the noise of the world and the turmoil of the heart.\n\nMari knelt and prayed quietly. Her prayer became a whisper that spread into the air, and within it, Mari quietly confessed her deepest thoughts. And then—suddenly, it felt as if her mind brightened. A sensation like a long-held thought sliding open. A warm resonance as if someone had silently given her back a gentle push.\n\nShe suddenly realized. The anguish she felt from the stage, the doubt and confusion about herself, were not wrong. It was not a departure from faith, but rather an opportunity to reflect on herself within her faith. She, who had lived a life of listening to and comforting the troubles of others, also needed to occasionally look after her own heart and walk toward what she wanted to do."
 trinity_flavor_events.1002.a: "That realization was quiet, yet clear."
 trnfla_1002_tt: "§LLately, Sakurako's eyes as she watched Mari Iochi held a certain relief and joy. Quietly clutching her rosary, she watched Mari's energetic figure sitting by the window from afar and softly murmured.\n\n\"Lately, Sister Mari... has been quite energetic. It is good to see.\"§!"

 trinity_events_nagisa.1.t: "Nagisa Kirifuji's Inauguration as Host"
 trinity_events_nagisa.1.desc: "Following the unprecedented incident of Host Seia being sniped, a power struggle with her childhood friend Mika Misono ensued. Nagisa Kirifuji eventually emerged victorious, but every step of that victory was a wound for her.\n\nAccording to the Trinity General School Charter, Nagisa Kirifuji, who won the majority in the Tea Party vote, has taken over as the next Host. There are claims from the Filius faction accusing the Pater faction of being the 'architects' of the Seia assassination incident, and it is true that the Pater faction gained political benefit after the sniping. However, our current investigation has no evidence that Pater or Mika Misono collaborated with the Nazis. The current political debate is merely a phenomenon showing that the conflict between the Pater and Filius factions has reached its peak, separate from the actual truth of the incident.\n\nAs it has not been long since the Seia assassination incident, Nagisa Kirifuji's inauguration ceremony was held privately with a small number of people. Nagisa made her ideology clear, stating 'There is no second Trinity,' and declared that the radical changes advocated by the Pater faction would never happen. Nagisa's victory was achieved by a somewhat narrow margin, and it is expected that she will stabilize the political situation by involving not just Filius but other factions as well."
 trinity_events_nagisa.1.a: "For Justice."
 trinity_events_nagisa.2.t: "Meeting with the Sanctus Faction"
 trinity_events_nagisa.2.desc: "The Filius faction did not win an overwhelming victory against the Pater faction. Filius was able to gain power only because of the cooperation of other factions. Although Sanctus lost its great leader, Seia Yurizono, and many supporters left, it still possesses a meaningful scale of influence.\n\n\"...I do not wish to erase the name of Sanctus. Sanctus remains in its place, and you may still unfold your ideals. I only hope that you will maintain your friendship with me.\"\n\nNagisa proposed an 'alliance' with Filius to $TRN_Natsuki_Kato$, the leader of Sanctus. Sanctus would remain in the Tea Party as a confidence and supply party that must support Nagisa's policies. In return, Sanctus can influence some of Nagisa's policies as a sister party to Filius.\n\nSurviving in a form subordinate to Filius was not what $TRN_Natsuki_Kato$ had hoped for Sanctus, which was once called one of the three major powers of the Tea Party. However, once it became clear that the Host only desired Sanctus's support and was not trying to completely absorb them, she decided to accept Nagisa's proposal."
 trinity_events_nagisa.2.a: "Together, to the future."
 trinity_events_nagisa.3.t: "The Princess in the Attic"
 trinity_events_nagisa.3.desc: "In Kivotos, there were many days spent sitting together enjoying tea parties, but such days became increasingly rare after the Great Transference. This was especially true after Seia's death. Today was the first time Mika Misono and Nagisa sat face to face since the Filius faction's election victory. Mika's eyes, deep like the sky and shining with a golden hue, sparkled. The reason Mika visited after so long was due to her psychological anxiety.\n\n\"Nagi-chan, you believe me, right?\"\n\"...I do.\"\n\"...Ahaha☆ Yeah. Of course. I knew Nagi-chan would say that!\"\n\nIt was a very short exchange, but Mika looked satisfied with just that. This was because hardliners in the Filius faction were claiming that Mika Misono and the Pater faction had conspired with the Nazis to order Seia's assassination. Of course, current investigations had failed to find a single shred of evidence that there was any mastermind beyond the Waffen-SS. Nagisa slowly traced the surface of the porcelain teacup with her fingernail as she faced her most precious rival across the table.\n\nNagisa knew Mika wasn't that kind of person. And she knew that the current political offensive would also fade with time. What Nagisa worried about most were Mika's feelings. Judicial threats and political condemnation would all vanish like the warmth in this teacup fading over time... but the wounds Mika received in her heart would not. Nagisa knew Mika would become Filius's greatest rival in the future, yet she still spoke to her tenderly.\n\n\"You need not pay mind to the rumors and offensives. Continue as you did before, Mika-san, and fight me with dignity. A dispirited look does not suit Mika-san. ...The second Trinity is not a dream that will perish so easily, is it?\""
 trinity_events_nagisa.3.a: "The most special of rivals."
 trinity_events_nagisa.4.t: "Trinity-style Factional Politics"
 trinity_events_nagisa.4.desc: "\"The second Trinity is not a dream that will fall so easily, right?\"\n\nAlong with Mika's dignified faction meeting speech—it was clear who she heard it from—Mika, who had suspended activities for several days after Nagisa Kirifuji took power, stood at the center of politics once again. Filius hardliners, who had claimed a link between the Pater faction and the Nazis, lowered the intensity of their criticism as investigation results were shared, and Mika emerged as Nagisa's most powerful rival with the 'unperishing dream of the second Trinity.' Despite the very close friendship between their leaders, the Pater and Filius factions eventually parted ways due to differences in their goals: the preservation of tradition versus radical state change.\n\nOf course, the Pater faction will not be able to show as much power as they did in the election immediately after the Seia sniping incident. Their power was broken once after the election defeat, and many officials who were weighing their options between Pater and Filius have moved over to Filius. However, the Pater faction is still Trinity's largest opposition party, and Mika Misono is a rival who knows Nagisa Kirifuji better than any other opponent in Trinity."
 trinity_events_nagisa.4.a: "And, the most troublesome of rivals."
 trinity_events_nagisa.5.t: "The Remaining Factions"
 trinity_events_nagisa.5.desc: "The Pater faction has remained a clear enemy of Filius. However, Pater is not the only opposing force. Sanctus is currently split between a neutral group still following Natsuki Kato, who became leader after Seia's death, and a minor conspiracy-theorist group claiming 'it was actually Filius who ordered Seia's assassination.' This minor group will remain loyal to Pater.\n\nThe Johannes faction, which has the right to participate in the Tea Party but is focusing on relief work, is also a suspicious entity. Led by the Remedial Knights, the Johannes faction is merely observing how Nagisa Kirifuji will lead the political situation after the Great Transference and has not shown active support.\n\nThe former Justina, current Sisterhood, is in a situation where it is impossible to know how they view Filius due to their closed nature. Nagisa feels her sharp gaze constantly focused on the Sisterhood.\n\nFinally, there are the very small factions whose names Nagisa cannot remember individually. Usually, such small-scale powers tend to stick to the strongest. If Pater becomes powerful, they are the ones who would hang Mika's portrait in their living rooms faster than anyone. They won't have a major impact, but Nagisa records them in her mental warning list regardless."
 trinity_events_nagisa.5.a: "\"Are there truly no allies for me anywhere?\""
 trinity_events_nagisa.6.t: "An Overly Difficult Problem"
 trinity_events_nagisa.6.desc: "\"Nagisa. Nagisa has a tendency to think too deeply about easy problems. Especially so after becoming the Host of Trinity.\"\n\"...After becoming the Host, you say. I do not quite understand. Was it not you, Seia-san, who was elected as this term's Host?\"\n\"Ah. Was that so? Fufu. My apologies. I have a tendency for the present and future to get somewhat mixed up. Yes. My next Host is Nagisa. Though you must already be prepared for it to some extent.\"\n\nWhen did they have such a conversation? Lying in bed, Nagisa reminisced about Seia. On that day, she sat facing Nagisa with her hands elegantly placed on the table. She looked at Nagisa with an strangely tender yet apologetic gaze. Only the long-tailed tit perched on her red gel-polished fingernail seemed to read Seia's emotions, looking up at her with its black eyes as if in pity.\n\nPerhaps Seia had predicted her own end on that day. It was a thought that came much too late, but it must be true. Seia must have already known the entire outcome, from her own death to Nagisa's subsequent inauguration as Host. That is why Seia must have said this, feeling sorry for passing her burden onto Nagisa.\n\n\"Before entering the Tea Party, I often reminisce about Nagisa's much brighter side. It was so regrettable to see that aspect gradually fading... Nagisa. If you become the Host in the future, please be a person who believes in others rather than doubting them. And, instead of worrying alone, please overcome difficulties together with your most precious people.\"\n\"Yes. I shall do so. If you are by my side at that time, Seia-san... it would be a great help.\"\n\nThe tit took flight into the sky. As the small bird flew off, the red gel-polish on Seia's nails looked strangely even redder to Nagisa's eyes. As if blood were spreading from Seia across the table. Nagisa woke from her reminiscence. And, weeping silently, she vanished into the deep, cozy embrace of her blankets."
 trinity_events_nagisa.6.a: "If only Seia-san were by my side..."
 trinity_events_nagisa_6a_tt: "§gNagisa Kirifuji thinks she must treat her paranoia. At the very least, she needs to practice trusting others.§!"
 trinity_events_nagisa.7.t: "Meeting with the Sisterhood"
 trinity_events_nagisa.7.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nBefore the Great Transference, Nagisa had visited Sakurako a few times for official reasons, but even then, she had never invited Sakurako alone to the lounge of the Tea Party building. It would be one thing to visit the Old Cathedral with a group of attendants. Thus, Sakurako could not fathom why Nagisa wanted a private meeting with her.\n\n\"Would it be best to visit?\"\nHolding the old-fashioned invitation she had unsealed, Sakurako turned back to Hinata. Hinata sat fidgeting with her fingers, just staring at the letter. As if trying to interpret what message the letter might contain. The silence did not last long. Hinata slowly raised her head.\n\n\"I think it's better to go. I don't think Nagisa-san called you for... some bad purpose. Still, she is from the Tea Party, and she's the Host...\"\n\"...Fufu. Yes. She is from the Tea Party, and she's the Host of that Tea Party. I won't know the reason she wants to see me unless I meet her first.\"\n\nSakurako placed the letter back in its envelope."
 trinity_events_nagisa.7.a: "The start of a game of Reversi."
 trinity_events_nagisa.8.t: "Flipping the Pieces"
 trinity_events_nagisa.8.desc: "A traditional game of Trinity spanning hundreds of years. In 'Reversi,' there are only two types of pieces: black and white. If you surround pieces of the other color, you can flip them to your own color. The player who fills more of the board with their color wins. A Reversi board, ill-suited for a small tea party. Sakurako looked down at the board for a moment, crossing her arms as if trying to guess Nagisa's intentions. Then, she placed a black piece on d3.\n\n\"Do you enjoy playing games during tea parties?\"\n\nSakurako's eerie smile. Nagisa's hand, holding a white piece, stopped. Despite the Information Bureau's report that 'Sakurako's expressions are naturally scary,' Nagisa felt sweat trickling down her shoulder blades.\n\n\"Well. I thought it was a game that suited our meeting today.\"\n\nc5. Sakurako's e6. While pieces were exchanged in turn, Nagisa was looking at her eyes, not the game board. It was a metaphor so simple it was almost childish. Were not the black uniforms of the Sisterhood and the white uniforms of the Tea Party trying to dye each other in their own colors? She, too, wore an expression of understanding Nagisa's intent before many pieces were even played.\n\n\"Let me say first, whatever you imagined about the Sisterhood, Nagisa-san, the truth will be different.\"\n\"Different, you say?\"\n\na1. How many pieces had been played? Sakurako's black pieces had seized the most crucial points. The Mother Superior of the Sisterhood spoke to the Host of Trinity.\n\n\"Non-intervention in politics. The Sisterhood has never changed that rule. It remained unchanged before the Great Transference, and it remains unchanged after. ...What benefit would we gain by seizing control of this chaotic Trinity?\"\n\nAnd then, Sakurako said to Nagisa.\n\n\"Also, I prefer playing the latest games like this with precious people.\"\n\nSakurako's expression as she spoke looked so peaceful that Nagisa felt a smile tugging at her lips as she looked down at the black-filled game board."
 trinity_events_nagisa.8.a: "However, this game is not exactly a 'latest game'."
 trinity_events_nagisa.9.t: "End of the Meeting"
 trinity_events_nagisa.9.desc: "\"...So, are you saying you wish for the Sisterhood to cooperate with Filius?\"\n\nNagisa placed the black and white Reversi pieces back into their container and nodded calmly. There was only one reason she decided to meet Sakurako: to see if the Sisterhood was plotting something. But if they had no such will, Nagisa's thoughts change. The Sisterhood. Is it impossible to cooperate with them?\n\nSakurako tapped the table with her finger several times.\n\n\"Our most important virtue is faith, not politics. I believe... I already mentioned that just now. Therefore, I cannot promise unconditional cooperation with Filius. However.\"\n\nSakurako looked at Nagisa with a tender smile.\n\n\"When you seek to walk the right path, Nagisa-san, we of the Sisterhood can offer help 'outside of politics.' And, what you worry about—cooperation with Pater—will also not happen.\"\n\"Is cooperation with Pater also against the principle of non-intervention?\"\n\"Yes. As long as the center of Trinity does not collapse, we intend to remain right here where we are.\"\n\nIn the event that the center of Trinity collapses. Although she left a caveat with a lingering aftertaste, Nagisa decided to suppress her paranoia. At the very least, Sakurako would not intervene in politics right now. She wouldn't directly help Filius, but she wouldn't hold Pater's hand either. That was enough. Bringing Reversi with the intent of asking 'Are you trying to upend the Tea Party?' had served its purpose.\n\n\"Very well. Then... I shall look forward to much help from the Sisterhood in the future. Outside of politics, of course.\""
 trinity_events_nagisa.9.a: "Sakurako stood up with elegance."
 trinity_events_nagisa.10.t: "The [GetYear] Trinity Council"
 trinity_events_nagisa.10.desc: "One of the codified powers given to the Host of Trinity is the authority to declare a Trinity Council. To protect Trinity amidst the unprecedented event of the Great Transference, Nagisa declared the opening of a new Council in which all factions would participate. It was an event to announce which direction Trinity should take after the Great Transference, and how a Host named Nagisa Kirifuji should protect her alma mater amidst the chaos.\n\n\"I thank everyone gathered here. Through this Council, we shall determine the path Trinity must take...\"\n\nNagisa's opening ceremony was held on a small scale in the Tea Party meeting room, where representatives of each Trinity faction gathered. Even Pater, which opposed Filius most fiercely, did not boycott this Council. This meeting was a politically significant one for creating a new constitution for Trinity after the Great Transference, and not attending this meeting would have been nothing short of political suicide."
 trinity_events_nagisa.10.a: "I will change Trinity."
 trinity_events_nagisa_10sakurako_tt: "§gBecause Nagisa was suspicious of the Sisterhood's intentions, she did not send them an invitation to the Council. Mother Superior Sakurako publicly expressed her dissatisfaction at not being able to attend the opening ceremony and was invited to the Council one step too late. However, the wounds in their hearts will not disappear.§!"
 trinity_events_nagisa.11.t: "Authority of the Host"
 trinity_events_nagisa.11.desc: "The first item discussed was extending the Host's authority, currently regulated to one year, to three years. Pater faction representatives expressed blatant dissatisfaction, saying \"One year is enough time to change the world,\" but counter-arguments were made that it was impossible for Nagisa Kirifuji to stabilize the nation in a mere year amidst the unprecedented event of the Great Transference. Eventually, as Pater backed down, a three-year Host term with the possibility of unlimited re-election was officially guaranteed. While re-election in the next poll isn't guaranteed, three years will be sufficient time to increase support for Filius."
 trinity_events_nagisa.11.a: "It is a rational decision."
 trn_nagisa_autocracy_flag: "In the decision of the §YCouncil§!, authoritarian Host powers were §Rgranted§!."
 trn_nagisa_democracy_flag: "In the decision of the §YCouncil§!, Host powers were §Grestricted§!."
 trinity_events_nagisa.12.t: "The Gehenna Problem"
 trinity_events_nagisa.12.desc: "No matter how loudly the Pater faction raises its voice, Nagisa Kirifuji and the Filius faction have no intention of stopping the promotion of the Eden Treaty. The issue is the political change in Gehenna following the Great Transference. Should the Eden Treaty continue to be conducted only between Prefect Hina Sorasaki and Nagisa Kirifuji? Or should discussions be expanded to include the Pandemonium Society and the Luxembourg Parliament as well?\n\nOf course, Nagisa Kirifuji knows that proposing an expansion of the Eden Treaty to the other two powers besides the Prefect Team is practically meaningless. Luxembourg, which has zero Gehenna identity, will respond with something close to 'indifference' to the Eden Treaty, and the Pandemonium Society will misinterpret the peace proposal itself as a sign of 'weakness.'\n\nTherefore, Nagisa's claim to expand the Eden Treaty is actually only for domestic politics. It serves to send a message to the Pater faction that Nagisa has no intention of backing down on this diplomatic issue, and it's a political maneuver to gain favor with the pacifistic Sisterhood.\n\nHowever, the insistence on expanding peace risks angering our military organization, the Justice Task Force. The rational Hina Sorasaki is the limit of what they can tolerate; the idea of discussing peace with 'Makoto Hanuma' will lower our military's morale."
 trinity_events_nagisa.12.a: "\"The Prefect Team is always the most important counterpart.\""
 trinity_events_nagisa.12.b: "\"However, we must also extend a hand to Pandemonium.\""
 trinity_events_nagisa.13.t: "Faith"
 trinity_events_nagisa.13.desc: "\"I believe that claiming the faith of this land resembles our Trinity faith is itself a form of insult. Their faith has clearly taken a wrong path...\"\n\nFollowing a public statement by one representative official of the Sanctus faction, the Sisterhood also showed a sympathetic response. The critical issue is the faith of this land. Some claim that the local faith is 'compatible' with Trinity's, as brothers and sisters of the scriptures. However, hardliners define the local faith as heresy and say it must all be converted to Trinity's. In particular, the local Germans' view of the Trinity faith as an 'unpleasant pagan' religion became a major problem.\n\nThe ball for the Council passed to Nagisa. Various factions expressed their opinions that Nagisa should specify 'Trinity Faith as the state religion' and prepare for a harsh crackdown on local faiths."
 trinity_events_nagisa.13.a: "\"Let's prepare to suppress the local faiths.\""
 trinity_events_nagisa.13.b: "\"For now, they too are brothers and sisters of the scriptures.\""
 trinity_events_nagisa.14.t: "Closing the Council"
 trinity_events_nagisa.14.desc: "The long [GetYear] Council has finally reached its end. In the Council, discussions on domestic politics, external diplomacy, and the faith that forms the core of Trinity were held in sequence. This successfully concluded Council will determine the future of Trinity.\n\nOf course, not everything was decided. Matters not determined in the Council, particularly the issue of coexistence with locals and the specific implementation plans for the Eden Treaty, must be decided by Nagisa Kirifuji herself.\n\nNagisa promulgated the matters decided in the Council through her authority as Host. The Pater faction left the meeting room in silence, while the remaining factions applauded, whether they supported the Council's decisions or not."
 trinity_events_nagisa.14.a: "I do not think this applause signifies a happy ending."
 trinity_events_nagisa.15.t: "So when are you giving us the right to vote?"
 trinity_events_nagisa.15.desc: "The core value of the Nagisa administration would be 'striving to believe in others.' This includes everything from old enemies like Gehenna to new enemies such as German political parties after the Great Transference. Nagisa requested the Justice Task Force to investigate the political parties within Germany and see if any of them could cooperate with the Trinity state system. It is better to hold hands with an ally who can offer friendship than to fight all local parties.\n\n\"But aren't there none? Cooperative parties.\"\n\nMashiro, as she left the meeting hall, delivered the demands handed over by members of the Social Democratic Party of Germany to Hasumi. Most parties, including the Social Democrats, the Centre Party, and the National People's Party, demanded that locals be included in the Tea Party oligarchy currently composed of a Trinity minority, or that universal suffrage and the Weimar Republic parliamentary system be restored. There were various demands. But those demands could be summarized into one thing: Hand over political power to us, the majority and the locals.\n\nHasumi folded the documents with a slightly annoyed look.\n\n\"Nagisa-sama has broad understanding, but she is no fool. Why would she lay down her power to people whose names she doesn't even know?\"\n\"It's not just Nagisa-sama; the problem is their demand to open the Tea Party to Germans. Can they not just be satisfied at the level of local autonomy?\"\n\"It would be good if a day comes when those unlearned people are enlightened and understand how benevolently our Trinity's Tea Party governs this land.\""
 trinity_events_nagisa.15.a: "Miserable local fools."
 trinity_events_nagisa.16.t: "Factional Issues"
 trinity_events_nagisa.16.desc: "Nagisa was sensing a change in the Filius faction. It had been a somewhat conservative faction since before the Great Transference. However, after the incident, Filius was gradually strengthening its obsession with 'tradition.' The cause was clear: Pater's 'Second Trinity' movement. They claim that the current Trinity is old and decaying, and they want a 'new' Trinity. In response, Filius, fighting against Pater, has no choice but to shout for the defense of tradition at the top of its lungs. Even after losing the Host election, Pater had effectively released the poison of reactionaryism into Filius.\n\n\"Several petitions to revive old Trinity units of measurement, such as the yard-pound system, have been brought up in Tea Party meetings...\"\n\nNagisa took a sip of tea and looked into the meeting minutes on her office table. For now, it remains at a laughable level like yards and pounds. However, if this situation is left unchecked, it is certain that a movement to 'revert' Trinity even further into the past will appear. Nagisa had no intention of changing Trinity revolutionarily. To her, Trinity was always Trinity, a beautiful, well-tended bonsai of a school just as it was."
 trinity_events_nagisa.16.a: "Yard-pounds, I'm not exactly fond of that."
 trinity_events_nagisa.17.t: "For a Just War"
 trinity_events_nagisa.17.desc: "The [FROM.GetNameDef] side has sent a military advisory group to support the war between us and the [GEM.GetNameDef] side. They stated they arrived to help Prefect [ROOT.GetLeader] and promised to do their best to maintain the friendship between [FROM.GetName] and [ROOT.GetName]. The advisors arrived with a small supply of weapons, and we will cooperate with Trinity to destroy [GEM.GetLeader]'s evil war machines."
 trinity_events_nagisa.17.a: "Not bad."
 trinity_events_nagisa.18.t: "Preparing for the Nagisa-Ako Meeting"
 trinity_events_nagisa.18.desc: "The attendant bowed and took a silk puff in her hand. She began applying powder to Nagisa's skin, which was already as pale as a snowflake. While the attendant's fingertips moved to sculpt a statue named Nagisa Kirifuji, the Host was thinking of other things.\n\nMany in Trinity still held a cynical view of the Eden Treaty. But conversely, because it was 'Gehenna,' was it not actually the most trustworthy? Nagisa recalled the time she met the representative of Gehenna under the mediation of the General Student Council President before the Great Transference.\n\nHina Sorasaki, who had lived a life only of catching criminals, was appearing on the scene for international diplomacy for the first time. She had applied blush so heavily her cheeks were as red as an alcoholic's because she wasn't used to makeup. Nagisa had passed it off gracefully, but the General Student Council President had laughed so much at the sight that it ruined the atmosphere.\n\nGehenna was a place of people who might know 'politics,' but knew nothing of 'politicking.' People who threw their messages directly rather than decorating themselves with lies, even if it meant blowing up a hot spring, and who didn't even know how to package themselves like a box of chocolates. Thus, after the Great Transference, Nagisa was gradually coming to like Gehenna. At least that Prefect was different from the politicians of other factions who even exploited Seia's death.\n\nAfter all preparations for going out were finished, Nagisa stood up. To believe in others. At least she tries to. To keep this belief that is becoming increasingly difficult after the Great Transference, it might be necessary to look outside of Trinity, not just within."
 trinity_events_nagisa.18.a: "The negotiation approaches."
 trinity_events_nagisa.19.t: "The Nagisa-Ako Meeting"
 trinity_events_nagisa.19.desc: "It would have been more pleasant if she could have sat down directly with Hina Sorasaki like before the Great Transference, but Ako Amau's personal visit to Eden was already a significant diplomatic achievement. Hina Sorasaki and Ako Amau were certainly bureaucrats of different personalities, but Ako was more 'interesting' in human terms.\n\n\"So, when Prefect Hina went *thwack* with her gun stock, that Helmet Gang underling's head went *clank*!...\"\n\nIf Mika were here, she would have called it 'ice-breaking.' Ako had a tremendous talent for ice-breaking. Truly, she was a girl who reminded her of Mika, who would chatter with cakes lined up in front of her. No official from Pater, Filius, or Sanctus could talk like this in front of Nagisa. It must be because she isn't a person of Trinity that she can speak freely, outside of the etiquette and order of this school.\n\nIf Nagisa doesn't turn the topic to the main subject herself, it feels like the ice-breaking will never end. Even in that regard, Ako resembled Mika. Nagisa took a sip of tea and wore a smile filled with reminiscence. \"Thank you for the stories about Hina-san, but today I would like to begin discussions regarding joint security management between our two schools.\"\n\"Ah, of course. Joint security... fufu. I hadn't forgotten at all. I was just loosening up my voice before a complicated meeting...\"\n\nEven that nonchalant attitude was amusing, and Nagisa ended up bursting into laughter." # Hina as Prefect
 trinity_events_nagisa.19.desc.alt: "It would have been more pleasant if she could have sat down directly with Hina Sorasaki like before the Great Transference, but Hina Sorasaki was no longer the Prefect of the Gehenna Prefect Team. Hina Sorasaki and Ako Amau were certainly bureaucrats of different personalities, but Ako was more 'interesting' in human terms.\n\n\"So, when Iori went *bam* with her combat boots, that Helmet Gang underling went rolling across the floor...\"\n\nIf Mika were here, she would have called it 'ice-breaking.' Ako had a tremendous talent for ice-breaking. Truly, she was a girl who reminded her of Mika, who would chatter with cakes lined up in front of her. No official from Pater, Filius, or Sanctus could talk like this in front of Nagisa. It must be because she isn't a person of Trinity that she can speak freely, outside of the etiquette and order of this school.\n\nIf Nagisa doesn't turn the topic to the main subject herself, it feels like the ice-breaking will never end. Even in that regard, Ako resembled Mika. Nagisa took a sip of tea and wore a smile filled with reminiscence. \"Thank you for the stories about the Prefect Team, but today I would like to begin discussions regarding joint security management between our two schools.\"\n\"Ah, of course. Joint security... fufu. I hadn't forgotten at all. I was just loosening up my voice before a complicated meeting...\"\n\nEven that nonchalant attitude was amusing, and Nagisa ended up bursting into laughter." # Ako as Prefect
 trinity_events_nagisa.19.a: "The meeting went well."
 trinity_events_nagisa.20.t: "The Ako-Nagisa Meeting"
 trinity_events_nagisa.20.desc: "It would have been better if she could have sat down with Nagisa Kirifuji like before the Great Transference, but due to the dangerous security situation after the incident and the need to keep the Pandemonium Society in check, Hina could not personally visit Eden. Nagisa Kirifuji sent a proposal to the Prefect Team: 'To repromote the Eden Treaty, let's first create a joint security organization between our two schools.' It was Ako Amau who left with full authority regarding that proposal.\n\n'The meeting went well. Negotiations ensuring the mutual interests of both schools have been completed.'\n\nAko replied as such. Indeed, the content was not bad. At the same time, Hina Sorasaki could read Nagisa Kirifuji's intentions through the diplomatic documents sent by Ako Amau. 'An allied front formed exclusively between the Prefect Team and Trinity, completely excluding the Pandemonium Society.'\n\nIn Nagisa's documents, the Pandemonium Society was not included in the areas where the Justice Task Force would protect security. This was different from how the Prefect Team maintains security even in Pandemonium Society territory. It was as if Gehenna's territory only applied to Hina's direct jurisdiction.\n\nPerhaps Nagisa Kirifuji intends to divide Gehenna in two and invade and occupy them one by one? Between her heart wanting to believe in the goodwill Nagisa showed since before the Great Transference, and the anxiety Hina had felt more of since the incident... Hina could not fall asleep until that night ended." # Hina as Prefect
 trinity_events_nagisa.20.desc.alt: "Before the Great Transference, Nagisa Kirifuji and Hina Sorasaki discussed important matters such as the ETO together. Although the situation has changed now. Nagisa Kirifuji sent a proposal to the Prefect Team: 'To repromote the Eden Treaty, let's first create a joint security organization between our two schools.' It was Ako Amau who left with full authority regarding that proposal.\n\nAfter the meeting, the Prefect Team leadership could read Nagisa Kirifuji's intentions through the diplomatic documents. 'An allied front formed exclusively between the Prefect Team and Trinity, completely excluding the Pandemonium Society.'\n\nIn Nagisa's documents, the Pandemonium Society was not included in the areas where the Justice Task Force would protect security. This was different from how the Prefect Team maintains security even in Pandemonium Society territory. It was as if Gehenna's territory only applied to the direct jurisdiction of [ROOT.GetLeader].\n\nPerhaps Nagisa Kirifuji intends to divide Gehenna in two and invade and occupy them one by one? Intense debate broke out within [ROOT.GetName] regarding whether Nagisa Kirifuji's goodwill could be trusted." # Other
 trinity_events_nagisa.20.a: "Do we truly have to sign the Eden Treaty?"
 trinity_events_nagisa.21.t: "Afternoon Teatime"
 trinity_events_nagisa.21.desc: "Nagisa did not welcome this situation one bit. The crisis in Trinity that occurred after the incident showed no signs of calming down. The students of Trinity were directly affected by the incident. Most of their tendencies changed radically, and people who despised the Tea Party as do-nothings and turned to extremes appeared. They sought to worship violent ideologies and participate in those causes, much like the Pater faction.\n\nIn particular, the Pater faction and its minor sub-factions were the problem. The Pater faction began to advocate their previously claimed violent ideologies even more blatantly. Mika didn't particularly restrain them. She might even be participating in their ideology. If things continue this way, the Pater faction will eventually threaten Sanctus's position as Host and seize power, destroying everything in Trinity. And at the center of it... no. No. I cannot let that happen.\n\nAn afternoon cup of tea was special. Tea drunk with leisure eased the accumulated fatigue. Nagisa held her teacup, looking out the window, lost in thought. The next Host is naturally Seia of the Sanctus faction. This is immutable. Seia Yurizono is quite trustworthy. With her foresight, she will be able to solve all of Trinity's problems. If she cannot solve it within her term, the Filius faction will take over the next Host seat, so no matter how long it takes, this crisis can definitely be resolved. Nagisa wanted to believe that. No, it had to be that way."
 trinity_events_nagisa.21.a: "And incidents tend to happen in unexpected places."
 trinity_events_nagisa.22.t: "Power of Faith"
 trinity_events_nagisa.22.desc.hardline: "\"As discussed in the last Council, we regard the faith of this land as decadent, something to be overcome, and as an enemy to be converted. The Sisterhood will put forth its best efforts to...\"\n\nAlong with the sermon delivered by Mother Superior Sakurako at the Old Cathedral, a long journey began to convert the natives of this land to the Trinity faith through cooperation between the Tea Party and the Sisterhood. It will be difficult to convert all natives within a single generation. However, the short-term goal will be to convert the middle class in important cities. They do not sincerely believe in God to begin with and will easily choose conversion for their own benefit.\n\nEven the Sisterhood, which originally maintained political neutrality, has formed a deep cooperative relationship by carrying out this conversion plan together with the Tea Party. The Sisterhood will not get deeply involved in politics, but they will prioritize helping Filius, which assisted in the conversion work, over other factions."
 trinity_events_nagisa.22.desc.moderate: "\"As discussed in the last Council, we regard the faith of this land as being the same as ours, merely walking a different path...\"\n\nAlong with the sermon delivered by Mother Superior Sakurako at the Old Cathedral, a plan was implemented through cooperation between the Tea Party and the Sisterhood to spread propaganda to the Christians of this land that both Catholic and Protestant faiths are just different branches, identical to the Trinity faith. Of course, it is not an easy process. In particular, Trinity's system of female priests was a radical doctrine that neither the Vatican nor the Protestants could tolerate. Therefore, the short-term goal will be to persuade the middle class in important cities. They do not sincerely believe in God to begin with and will easily choose conversion for their own benefit.\n\nEven the Sisterhood, which originally maintained political neutrality, has formed a deep cooperative relationship by carrying out this propaganda work together with the Tea Party. The Sisterhood will not get deeply involved in politics, but they will prioritize helping Filius, which assisted in the publicity work, over other factions."
 trinity_events_nagisa.22.a: "New faith, new order."
 trinity_events_nagisa.23.t: "Please be an Envoy"
 trinity_events_nagisa.23.desc: "Nagisa slowly picked up a white hippo plushie with both hands. Under the warm sunlight shining on the Tea Party garden, the plushie of Mr. Peperoncino wearing glasses was looking down at her quite cozily. This Mr. Financier that Hifumi taught her about. While she often still didn't quite understand why the public liked such characters, she was starting to think it was cute after seeing it repeatedly. Nagisa gently set the Peropero-sama plushie down on the edge of the table.\n\nNagisa spoke to Hifumi, who was sipping tea across the table. \"After the Great Transference, I felt a lot of personal discomfort while encountering German mass culture. It felt masculine, disregarded the authority of the Tea Party, and even felt violent. It lacks the warm side that puts people at ease, like the Peroroshe-sama you love.\"\n\"Ahaha... Is that so? I think there might be good aspects to the culture of this land as well.\"\n\"Yes. There might be good aspects. But it is also true that the bad aspects are prominent. ...That is why I wanted to meet you today, Hifumi-san.\"\n\nNagisa pushed Mr. Peperoni slightly to the side and looked Hifumi directly in the eyes. \"I want Hifumi-san to be an 'envoy' who spreads the culture of Kivotos to this land. The violent culture of this land, the tradition of despising women—it is impossible for me to forcibly erase them by power. However, as Trinity's most ordinary person and someone who has earned the trust of many, I believe Hifumi-san can announce your kind heart to this land and soften the militaristic culture of Germany.\"\n\nNagisa smiled faintly at Hifumi. Nagisa does not like German culture. But she does not think she can annihilate that culture either. Nagisa simply wanted Hifumi, a girl she trusts, to act as a promotional ambassador to let the people of this land know about the wonderful things of Kivotos, and through that, to blunt the hostility they have toward Trinity and erase their violent nature. Would it be possible? If it's Hifumi, it might just be."
 trinity_events_nagisa.23.a: "\"This task is also about spreading the beauty of Peroshiki-sama.\""
 trinity_events_nagisa.24.t: "Result of Victory in Gehenna Central District"
 trinity_events_nagisa.24.desc: "Following the victory in the Battle of Eden, the treatment of the losers was carried out in an extremely 'medieval' manner due to Trinity General School and Nagisa Kirifuji's personal conservative tendencies.\n\nFrom a Filius perspective, the idea of holding something like a 'trial' for 'red bloods' who died in a war between noble 'blue bloods' was taken as an insult to the noble class system of Trinity. In fact, it wasn't an logic that the locals couldn't understand either. Even in the last Great War, no Allied nation had argued for putting Wilhelm II or Karl I on trial.\n\nTrinity demanded 'ransom for release' from Makoto Hanuma and all members of the Pandemonium Society. This was a direct application of the 'victor's right' over noble prisoners in medieval warfare. The demanded ransom was substantial, and the highest amount was set for Ibuki Tanga, the symbol of Gehenna.\n\nWhat was surprising was that Makoto Hanuma paid the ransom for all the members without hesitation, squandering her entire fortune. Her short comment, \"If even one person cannot leave prison because of this kind of money, that would be my own humiliation,\" became a symbolic statement showing the charisma of Makoto, who had been loved by the Pandemonium members in her own way.\n\nMakoto Hanuma originally held stakes in Gehenna's largest publishing and media companies, but she had to sell them all to pay the ransom. Facing financial difficulties, Makoto decided to stay at her home in the Central District for the time being and focus on writing her memoirs of the Battle of Eden to mock Trinity. Regardless of its literary value, many military historians are interested as it would allow them to examine the Battle of Eden from Gehenna's perspective once published."
 trinity_events_nagisa.24.a: "Makoto's writing style isn't bad. There's probably a ghostwriter, though."
 trinity_events_nagisa.25.t: "Be Firm in Faith"
 trinity_events_nagisa.25.desc.hardline: "To Host [ROOT.GetLeader],\n\nI am Sakurako Utazumi, Mother Superior of the Sisterhood. Thanks to the help of the respected Tea Party and the Host, the conversion work over the last two years has proceeded smoothly. I am grateful that many locals have come to follow the pious teachings of Trinity according to the scriptures.\n\nNot all locals have converted through this effort. The Sisterhood has identified that less than 10 percent of the German population follows the new faith. However, considering the short time Trinity has been in this land since the Great Transference, 10 percent is a conversion rate that can only be called a spiritual miracle.\n\nIn particular, the middle class in important cities are hurrying to convert for the sake of interaction with our Trinity. While I worry that they do not possess sincere religious zeal, the Sisterhood believes we can lead their conversion of convenience into a sincere spiritual one.\n\nThank you for the Tea Party's deep interest,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.desc.moderate: "To Host [ROOT.GetLeader],\n\nI am Sakurako Utazumi, Mother Superior of the Sisterhood. Thanks to the help of the respected Tea Party and the Host, the work of assimilation with the local faith over the last two years has proceeded smoothly. I am grateful that many locals have come to follow the pious teachings of Trinity according to the scriptures.\n\nPropaganda that Protestant and Catholic faiths are identical to the Trinity faith is having a particularly large impact among local women. The Sisterhood identified that 5 percent of the German population converted over the last two years, and 70 percent of those converts were women. German women seem to feel a greater affinity for our teachings because we allow female priests and advocate for more women's rights.\n\nHowever, local stubborn conservatives still reject the unification of Trinity faith and local faith, citing theological or social issues. Negotiations with the Vatican are also sluggish. The Pope claims that Rome, not the Sisterhood, should have the authority to ordain priests, and says he will only declare our faith as not being heresy if the Sisterhood admits it has no right to receive valid confessions. Bridging the gap with the Vatican is not easy, but Sister Hinata is doing her best, so I believe there will be good results within a few years.\n\nThank you for the Tea Party's deep interest,\n\n- Sakurako Utazumi"
 trinity_events_nagisa.25.a: "Our order has been established in this land."
 trinity_events_nagisa.26.t: "Gehenna Student Council President Nagisa Kirifuji"
 trinity_events_nagisa.26.desc: "\"To speak honestly... can I just not wear this?\" \"This is a disaster of your own making. Just accept it.\"\n\nSpeaking in a somewhat teasing tone, Mine handed a black uniform to Nagisa. It was a new uniform tailored to Nagisa's body lines, based on Makoto Hanuma's very own outfit. How could it be called a 'Gehenna Student Council President' uniform if it weren't that outfit? Nagisa had no choice but to take the hat and press it down onto her head. Perhaps because it was made assuming there would be horns, the hat was a bit large for her. Nagisa handed the rest of the uniform to her attendants. While the attendants were naturally helping Nagisa change into the new uniform, Nagisa momentarily regretted the decision to 'hold the Gehenna Student Council Presidency concurrently.' One photo was needed to hang Nagisa's portrait in the newly established Gehenna Student Council building after Pandemonium's dissolution. And another for the inauguration article in the newspaper.\n\nUnlike Pater, Nagisa had no particular hostility toward Gehenna. Thus, it wasn't that she disliked it 'because it was a Gehenna uniform.' However, in Nagisa's eyes, this uniform... the miniskirt was absurdly short. Did Makoto Hanuma really walk around the streets in such an ungracefully short skirt? It almost feels like I'm not wearing a skirt at all. Good heavens. May God forgive the whereabouts of that shameless soul. Nagisa, now changed into the uniform, adjusted the hat with the Gehenna logo slightly and faced Mine, who still had a grin that wouldn't leave her face. The thought 'Could we not have just photoshopped the picture?' came too late. It was already done."
 trinity_events_nagisa.26.a: "\"...Let's take it quickly and take it off. I don't mean taking it off right in the photo studio, though...\""
 trinity_events_nagisa.27.t: "Gehenna Student Council President Iori Shiromi"
 trinity_events_nagisa.27.desc: "'The REAL! Yakisoba place Haruna Kurodate didn't blow up!'\n\nA restaurant in Gehenna South District with a very Gehenna-like propaganda poster. Nagisa placed a pure white napkin she brought separately onto the table in the cramped and dark yakisoba restaurant filled with the sound of loud conversations.\n\n\"Iori-san, what kind of hors d'oeuvre is served in this restaurant?\" \"Hors... what?\" \"...I mean an appetizer. And does this restaurant have a cocktail recommended by the chef?\" Iori wore a dumbfounded expression. \"Chef? We don't have that. Just yakisoba and okonomiyaki, and two glasses of orange juice. That's it.\"\n\nNagisa thought for a few seconds as if trying to understand Iori's words. There was no distinction between appetizers and main courses, nor any concept of a professional chef. Furthermore, the restaurant couldn't even provide cocktails. She understood the long-standing conflict between Gehenna and Trinity, but it seemed Gehenna had been concentrating all its national power on war while living such a hungry and impoverished life for the showdown with Trinity. Nagisa hid her deep pity and sympathy and showed Iori a benevolent smile like a saint. Iori looked like she couldn't understand at all for a moment, but as the server set down the yakisoba, her interest quickly shifted there.\n\nAmidst the leisurely and peaceful meal, Nagisa spoke to Iori. \"There are only two things I want to request of Gehenna. First, perfect maintenance of public security.\" \"You said you'd make me Student Council President. Then obviously I have to do it perfectly.\"\n\"Thank you for understanding. And the second is...\" Nagisa lifted her orange juice glass and took a sip. It seemed like real oranges hadn't gone into it. Could the Gehenna people not afford to buy and drink oranges? \"...Trinity may deliver several 'official documents' to the Gehenna Student Council. Although there is a right to veto, please cooperate as much as possible.\" \"Veto? Well, Trinity won't send anything weird.\"\n\nIori smirked. \"We're partners in the same school now, aren't we? Whatever you send, I'll just stamp it. Nagisa, you focus on making other people happy.\"\n\nMaking other people happy. That must be the role of a leader. Nagisa nodded."
 trinity_events_nagisa.27.a: "Nagisa found a cooperative President."
 trinity_events_nagisa.28.t: "Gehenna Student Council President Sena Himuro"
 trinity_events_nagisa.28.desc: "After the Battle of Eden, Nagisa learned that Sena and Mine had become close like friends in an instant. It could be because they were both in charge of medical duties, or it could be because they found commonalities in their beliefs. Therefore, the role of delivering 'Trinity's two demands to Gehenna' to Sena was entrusted to Mine. Two things. First, after the integration, maintain Gehenna's security perfectly so that hot spring terrorists cannot crawl into Trinity. Second, although the Gehenna Student Council has a formal right to veto official documents sent by Trinity, they are to accept them all.\n\nSena, sitting across from Mine, took a sip of tea-bagged tea and smiled faintly. \"That is not difficult. After all, those requirements are also rational demands that must be followed for the relief of the corpses.\"\n\nMine, facing Sena, the new Gehenna Student Council President with a composed attitude, asked: \"It also implies that you must be Trinity's puppet president. Is that alright?\"\n\"I am not a politician. I am a doctor. Is that not the same for you, Mine-san? ...I am simply trying to follow Mine-san's mindset. Finding the root of the disease for relief. The root of Gehenna's disease is tedious chaos. ...If that chaos is gone and a world comes where no one is carried in injured, I can do anything for that future.\"\n\nAs she spoke, Sena showed a tender smile toward Mine."
 trinity_events_nagisa.28.a: "Nagisa found a cooperative President."
 trinity_events_nagisa.29.t: "Nagisa-Hasumi Meeting"
 trinity_events_nagisa.29.desc: "\"It is an honor to have this teatime with Hasumi-san, the President of the Justice Task Force.\" \"It is 'Vice President.' The President is Tsurugi-san...\"\n\nNagisa blushed slightly at her rare mistake regarding a title. But what could she do? Every time she visited the Justice Task Force for business, she only ever spoke with Hasumi. Tsurugi usually just tilted her head and made noises like 'Khehe' or 'Kihihi' before disappearing. While she was told Tsurugi wasn't unable to speak, Nagisa had never seen her speak, at least not in her presence.\n\nHasumi took a sip of milk tea and went straight to the point without an introduction. \"Our Justice Task Force is carrying out a continuous de-Nazification movement, but many German Nazi figures are active outside Trinity territory, making it somewhat difficult. Defeating the SS is not hard, but the party officials of the Nazi Party are mostly in Gehenna. I will explain in detail. The party politicians centered around Albert Speer are in the Gehenna Central District. Anton Drexler, who founded the NSDAP, lives moving between Munich and the Central District. Hitler's companion, Eva Braun, also resides in Munich.\"\n\"In other words, no matter how hard we try, we cannot cut off the 'snake's head,' is that what you mean?\"\n\"That is what I find most regrettable, but it is alright. If we cut off the body, the snake will die. It will simply take a little more time than cutting off the head. Host-sama, you just need to wait with patience.\""
 trinity_events_nagisa.29.a: "Nagisa trusted Hasumi and decided to leave the investigation to her."
 trinity_events_nagisa.30.t: "Party at Eden"
 trinity_events_nagisa.30.desc.hina: "The reason the integration with the Gehenna Prefect Team was most important to us was that it was an opportunity to grow the quantitative and qualitative scale of the Filius faction. The entire executive branch, including Iori Shiromi, remained in Gehenna. The medical department also had no intention of leaving Gehenna. However, as the planning and information department officials moved their residence to Eden, they decided to start new activities under Trinity's order, not Gehenna's. Hina Sorasaki and Ako Amau completely moved their affiliation to Trinity and began active service as members of the Filius faction of the Trinity Tea Party. Pater was enraged by this, but it was an action intended to enrage them. To begin with, if they wanted to continue politics, did they have any other choice but Filius?\n\n\"According to the teachings of the scriptures, you have been born anew today by water and the Holy Spirit through baptism. Leaving Gehenna and Trinity behind, you have all become holy people who can enter the Kingdom of Heaven...\"\n\nThrough the baptism ceremony personally conducted by Mother Superior Sakurako, Hina Sorasaki and Ako Amau decided to convert to the Trinity faith. Of course, this might not mean a true conversion of the heart. However, by the political center of Gehenna declaring at the Old Cathedral in Eden that they would accept our faith and receiving baptism, it became a symbolic event of Trinity's permanent victory over Gehenna." # Hina as leader
 trinity_events_nagisa.30.desc.ako: "The reason the integration with the Gehenna Prefect Team was most important to us was that it was an opportunity to grow the quantitative and qualitative scale of the Filius faction. The entire executive branch, including Iori Shiromi, remained in Gehenna. The medical department also had no intention of leaving Gehenna. However, as the planning and information department officials moved their residence to Eden, they decided to start new activities under Trinity's order, not Gehenna's. Ako Amau completely moved her affiliation to Trinity and began active service as a member of the Filius faction of the Trinity Tea Party. Pater was enraged by this, but it was an action intended to enrage them. To begin with, if they wanted to continue politics, did they have any other choice but Filius?\n\n\"According to the teachings of the scriptures, you have been born anew today by water and the Holy Spirit through baptism. Leaving Gehenna and Trinity behind, you have all become holy people who can enter the Kingdom of Heaven...\"\n\nThrough the baptism ceremony personally conducted by Mother Superior Sakurako, Ako Amau decided to convert to the Trinity faith. Of course, this might not mean a true conversion of the heart. However, by the political center of Gehenna declaring at the Old Cathedral in Eden that they would accept our faith and receiving baptism, it became a symbolic event of Trinity's permanent victory over Gehenna." # Hina left
 trinity_events_nagisa.30.a: "Trinity always triumphs."
 trinity_events_nagisa.31.t: "Gourmet Research Society is Not Insane"
 trinity_events_nagisa.31.desc: "\"So, are you saying that all the terrorist activities you have committed in Gehenna so far were... a form of social welfare?\"\n\nMine felt a slight dizziness as she watched Haruna Kurodate sitting haughtily. She had accepted Nagisa's proposal to 'not put Haruna in prison immediately, but first try to understand the other's ideology through dialogue.' However, her ideology was so absurd that this effort itself felt utterly meaningless. Of course, Haruna seemed to have her own deep meaning.\n\n\"Yes, that's right. Mine-san, are you familiar with utilitarianism? The common good is maximizing the public benefit and reducing its harm. As you can see, the restaurants I blew up served such terrible food that they accumulated a public pain among the Gehenna masses. In other words... it means leaving such restaurants alone is a loss for many people.\"\n\n\"But what about the pain of the restaurant owner? Is it acceptable to ignore that person's pain?\"\n\n\"What's important in utilitarianism is 'the greatest happiness for the greatest number,' not 'the happiness of the few.' Do you know how much damage a single restaurant causes to many? If 100 customers visit a ramen shop in a day, 100 people become unhappy for the sake of one person's happiness. Does it end with mere 'unhappiness'? Those people's time is lost. The happiness they could have obtained if they had gone to a better restaurant also disappears.\"\n\nHaruna's words left Mine in deep thought. If the damage caused by a single restaurant is truly that great, was blowing up the restaurant really a virtuous act for the common good? Was she simply using 'slightly excessive' violence for the common good, just like Mine, who uses violence to the point of breaking the law somewhat for the sake of relief in the Remedial Knights?\n\n\"That is why I simply severed this chain of misery. Yes. I saved them. I saved future victims who would have visited a tasteless restaurant and felt the pain of the palate. If the restaurant doesn't exist in the first place, they won't suffer. Do you understand now? The things the Gourmet Research Society is doing are by no means crimes. It is a sublime action of sacrificing oneself for the completion of utilitarianism, the greatest happiness for the greatest number.\""
 trinity_events_nagisa.31.a: "\"That concept of 'common good' matches the 'relief' I pursue...\""
 trinity_events_nagisa_31_a_tt: "§gHaruna Kurodate continues to be active in Gehenna. Mine, influenced by Haruna's ideology, will submit a report to the Tea Party sympathizing with her.§!"
 trinity_events_nagisa.31.b: "\"...But sacrificing others for the sake of good is absolutely unacceptable.\""
 trinity_events_nagisa_31_b_tt: "§gHaruna Kurodate will go to prison.§!"
 trinity_events_nagisa.32.t: "Hina Sorasaki Investigation"
 trinity_events_nagisa.32.desc.hina: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\nTo Nagisa Kirifuji-sama,\n\nThis is Ichika Nakamasa. As you instructed, I followed Hina-san since the Gehenna integration in my own way. I held a few tea parties to talk with her and was able to hear her thoughts quite well.\n\nTo give you the short conclusion, yes. She's about 140 percent harmless. She seems to be adjusting to Trinity better than I am.\n\nThere are words that she intended to retire with the 'Eden Treaty' as the end even in Kivotos, and she seemed to have no affection or lingering attachment to Gehenna. After Hina-san gained a seat in the Tea Party, she was spending a lot of time on becoming a pianist. Politics? She seems to have completely let go.\n\nOf course, she did become a Tea Party official after handing over the position of Gehenna Prefect to Iori-san. But it seems she only accepted this for her financial freedom and social activities in Trinity. She said she doesn't know about this part well, but Nagisa-sama would know. No questions in meetings. Unconditional votes in favor of the Filius faction's platform. Ahaha. She's practically a rubber stamp in words alone, and it's honestly hard to believe 'that' Prefect is Nagisa-sama's rubber stamp.\n\n...Is it true? Well, if so, it really seems like Hina-san has let go of politics. They say she's been very exhausted from the weight of the Prefect position since before the Great Transference. It's right to let her rest in peace. I'm glad if Nagisa-sama is also relieved. If you understand others more deeply, you can trust others more deeply, after all." # Real Hina
 trinity_events_nagisa.32.desc.robot: "\n\n\n                                      £GFX_report_event_GEH_ichika_nakamasa £GFX_report_event_TRM_hina_sorasaki_trinity\n\n\n\n\n\n\nTo Nagisa Kirifuji-sama,\n\nThis is Ichika Nakamasa. As you instructed, I followed Hina-san since the Gehenna integration in my own way. I held a few tea parties to talk with her and was able to hear her thoughts quite well.\n\nTo give you the short conclusion, yes. She seems harmless.\n\nIf you ask how I know... the Justice Task Force is a security organization, right? I've interrogated suspects who lie more than hundreds of times. She seems to have completely given up on Gehenna. She said very harsh things like 'It's only natural for it to perish.'\n\nAs for other evidence, Hina-san's recent actions seem more focused on socializing than politics. Although she meets various people, they say they are all Filius people, and she meets no one from Gehenna except for Ako-san. Yes. There's no way that person would do anything for Gehenna in Trinity now. To begin with, she severed all ties with Gehenna.\n\nI see... I'm glad if Nagisa-sama is also relieved. If you understand others more deeply, you can trust others more deeply, after all." # Fake Hina
 trinity_events_nagisa.32.a: "Nagisa determined that she could completely trust Hina."
 trinity_events_nagisa.33.t: "Ako Amau Investigation"
 trinity_events_nagisa.33.desc: "\n\n\n                                      £GFX_report_event_TRM_tea_party_mob £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\nTo Nagisa Kirifuji-sama,\n\nHello, Nagisa-sama. This is Tenne, an official of the Filius faction. ...You mean my impression of Inspector Ako? She's an amazing person. To volunteer for a demotion from being the second-in-command of the Prefect Team, the Senior Administrator, to a lowly mid-level bureaucrat, an Inspector of the Tea Party.\n\n...Yes. The Inspector had no sense of belonging to Gehenna. 'I am loyal to Trinity because Prefect Hina said the Eden Treaty was right.' It felt like her loyalty was to Hina-san, not Gehenna. If Hina-san says 'Trinity won,' then to the Inspector, Gehenna 'doesn't exist' anymore.\n\nYes. It is as Nagisa-sama said. Because Hina-san's decision is her decision. I didn't get the impression the Inspector would act in the Tea Party for Gehenna's rights or revival now. To be loyal to an 'individual' rather than a 'state.' ...I think it's truly romantic.\n\nIf you ask why... isn't it like the knights in chivalric literature? Fighting for the 'homeland' is the lot of the commoners, the red bloods. The blue bloods have held the flag for their lord and their chivalry for two thousand years. Galahad shouted the name of King Arthur, not the name of his homeland, as he drew his sword. States are finite, but faith and chivalry...\n\nOh my, apologies... I went off on a tangent for a moment. I believe it is better to refer to chivalric literature than to profiling techniques or psychological research to understand the Inspector's actions. ...That's why I like the Inspector."
 trinity_events_nagisa.33.a: "\"Would there be a knight for me too, who would follow me even if I went somewhere other than Trinity?\""
 trinity_events_nagisa.34.t: "Humanitarian Aid to Arius"
 trinity_events_nagisa.34.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\nTo Host [ROOT.GetLeader],\n\nDespite the war between the Arius Branch School and our Trinity, we of the Sisterhood see hope rather than despair in this land. Do you know, Host-sama, what kind of tea the Arius Branch School drank until the 'Great Transference'? They say they roasted and boiled dandelions, dried turnip roots, and thistles. It is a misery that could not exist in Trinity.\n\nHowever, they did not remain stagnant. Since Beatrice, the Student Council President, disappeared, they have made efforts to change their own way of life. Arius is still poor, but we can see what kind of journey they have taken to pioneer their own lives.\n\nHost-sama, because I am here in Arius, I have not yet heard the report of whether the Tea Party decided to condemn Arius as heresy or embrace them. I believe I will only know after this messenger arrives. But whatever conclusion is reached, I hope the Host understands that the people of this land are not merely stagnant sheep, but sheep striving to move forward.\n\nAppropriate medical support and resettlement support for those wishing to move to Trinity must be provided for us to lead them to the right path they sought to forge. I will wait in Arius, believing the Host will show them infinite mercy and love.\n\n- S. Utazumi."
 trinity_events_nagisa.34.a: "Turnip root tea...!"
 trinity_events_nagisa.35.t: "Arius Inquisition"
 trinity_events_nagisa.35.desc: "Mari Iochi did not like the Tea Party's decision. To begin with, isn't designating the Arius land as 'heresy' and conducting an inquisition an arrogant claim by the victor? Sakurako also viewed Arius as an object of embrace, not condemnation.\n\nHowever, Mari could understand why [ROOT.GetLeader] made such a decision. Arius, which rejected the first Council's decision and left. There were too many people in the Sisterhood who did not trust them. And the Host was merely following their opinions.\n\nMari leaned her body against the window of her lodgings and watched as the enraged Sisterhood nuns gathered the hungry girls of Arius.\n\nThe Sisterhood nuns instructed the Arius students to step on and cross the Arius Book of Revelation. As a sign that they would return to the true faith, not heresy.\n\nThe evil torture culture of the 'Justina Saintly Council' had disappeared. Trinity promised not to inflict any physical harm on the Arius heretics as a sign that they would not repeat the sins of the past. She thinks that is surely a noble choice.\n\nBut is making them step on the scriptures they have believed in and memorized for over hundreds of years not just another kind of violence, even without direct force? What distinguishes heresy from true faith? Is it the consistency of doctrine, or is it simply the power of guns and swords? Does the merciful Lord distinguish His true children by the caliber of a gun muzzle?\n\nMari tried to draw the curtains to hide that terrible sight. But then, she remembered an action more in line with the Creator's teachings: blocking that madness with her own body."
 trinity_events_nagisa.35.a: "...For the Lord said, 'Thou shalt love thy neighbor as thyself'..."
 trinity_events_nagisa.36.t: "Love Thy Neighbor"
 trinity_events_nagisa.36.desc: "Subaru Kakehashi did not believe Trinity's decision to completely embrace and accept Arius. No, saying 'Subaru' didn't believe it would be a lie. It would be closer to the truth to say 'Arius' didn't believe it.\n\nSubaru walked the streets of Arius with Mine Aomori, who had laid down all symbols of the Remedial Knights and identified as a mere 'anonymous volunteer.' In this gloomy street that was both Arius and Danzig, countless eyes looked down at Mine from building windows. Mine spoke as if those gazes were uncomfortable.\n\n\"If necessary, I can walk with my shield and gun discarded.\"\n\"Forget it. If you did that, it would be my job to clear away your corpse.\"\n\nEven while making cynical remarks, Subaru was gradually accepting Mine's sincerity. 'Arius is Trinity's sister. And we will spare no reconstruction effort for Arius. There is no need to repay it now or in the future.' It was an absurdly sweet form of pure 'goodwill' that never existed in Arius.\n\nBut that goodwill did not feel like a facade. The very existence of the 'leader of the Johannes faction' who had come alone without any guards to this Arius land, where resistance fighters against Trinity still remained, explained all the sincerity of her and Trinity. Thus, there was only one thing Subaru could say. A question in its purest form.\n\n\"Do you people always treat enemies this way? What kind of fool in the world treats an enemy who aimed guns and swords at them like this?\"\n\n\"It wasn't always like this. It became this way after Nagisa-sama became Host. Pater is fine, Gehenna is fine, the pagans are fine... I don't know if her ideals are right or wrong. But I think the concept that this world is made of goodwill rather than malice is better than thinking everything is vanity. Wouldn't it be good to hold at least one thing near that isn't vain? Like love.\""
 trinity_events_nagisa.36.a: "Even if they were an enemy."
 trinity_events_nagisa.37.t: "Birth of the Arius Faction"
 trinity_events_nagisa.37.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\nTo Host [ROOT.GetLeader],\n\nThe Arius Branch School no longer exists, and many Arius students have migrated to Trinity. However, it has been confirmed that some students have not converted their faith to Trinity's even after moving from Arius to Trinity.\n\nAccording to the inspector in charge, there is a meaningful percentage of traditionalists who wish to protect the culture and religious teachings of the Arius 'Branch School' even after the school has vanished. The Filius faction has named them the 'Arius Faction' and decided to monitor their movements.\n\nRegarding the movements of the Arius faction, we believe the noble Host [ROOT.GetLeader] can show them the path they should take. We hope they find peace under the Host's merciful love.\n\nTea Party Secretariat Report"
 trinity_events_nagisa.37.a: "A faction is better than a branch school."
 trinity_events_nagisa_37_a_tt: "§gThe Arius faction's influence replaces the German National People's Party in the Trinity faction system.§!"
 trinity_events_nagisa.38.t: "Appearance of the Gehenna Faction"
 trinity_events_nagisa.38.desc: "\n\n\n                                                   £GFX_report_event_TRM_tea_party_mob\n\n\n\n\n\n\nTo Host [ROOT.GetLeader],\n\nSince the Gehenna School was incorporated into Trinity, there have been many changes. The two leaders of the Prefect Team, Hina Sorasaki and Ako Amau, have already left Gehenna, and as Inspector Ako was the first to convert to the Trinity faith and become an official of the Tea Party's Filius faction, the Prefect Team has come to never reject the Trinity order.\n\nThe Pandemonium Society can also be considered neutralized. Especially after Makoto Hanuma went bankrupt, the Pandemonium members have completely scattered, having lost their focal point for Gehenna's reconstruction. The Pater faction's paranoia that Pandemonium will become the central power for Gehenna's reconstruction again is currently nothing more than 'delusion.'\n\nTherefore, our real problem is the Hot Springs Development Department. The Hot Springs Development Department is currently the only 'Gehenna separatist' force of meaningful scale in Gehenna that rejects Trinity integration. While not military guerrillas, they are setting off many bombs everywhere, claiming that 'hot spring development is hindered under Trinity rule.'\n\nUnlike the Gourmet Research Society, they reject the Trinity order in any form, so they will remain a troublesome opponent unless they are wiped out. I hope the Host also monitors them.\n\nTea Party Secretariat Report"
 trinity_events_nagisa.38.a: "Hot spring separatism? ...Are they trying to make a Hot Spring Republic?"
 trinity_events_nagisa_38_a_tt: "§gThe influence of Gehenna separatists is considered included in the $faction_F_name_nagisa$ of the Trinity faction system.§!"
 trinity_events_nagisa.39.t: "Private Meeting Between Mine and Nagisa"
 trinity_events_nagisa.39.desc.democratic: "Nagisa was not a person of a quick-tempered nature. However, after her friend was sniped, the funeral was finished, and she had been submerged in deep despair and sorrow. To hear the story that in fact Seia did not die that day, but had been hidden in a secret location by Mine and treated after the sniping. Nagisa threw her teacup against the wall. On the day Mine delivered the news that Seia, who had been in a coma for years, had woken up, Nagisa stared straight at Mine and said:\n\n\"You should have told me.\"\n\"Please understand it was an unavoidable decision to protect Seia-sama after the sniping. For the sake of relief, one must sometimes choose harsh but cruel methods. ...Because there was a possibility that there were collaborators with the sniper inside the Tea Party...\"\n\"Are you saying that I collaborated in killing Seia-san?\"\n\"That's... not what I meant.\"\n\nMine spoke in a dispirited voice, unlike her usual self, with her head slightly bowed.\n\n\"...I was in a situation where I couldn't trust anyone. I just... thought that if I didn't do this, Seia-sama would be in danger again...\"\n\nNagisa looked straight at Mine. In the end, Mine must have made that decision because she too could not completely trust others. Nagisa reflected on her own resolve from when she thought she had lost Seia. To strive to believe in others. ...The result of not doing so would be the current Leader of the Remedial Knights. Nagisa wanted to be more angry at Mine, but she couldn't. Had the situation been different, Nagisa herself would have made the same decision. Nagisa bowed her head gracefully to Mine.\n\n\"I apologize for throwing the teacup. ...Can you take me to where Seia-san is? No. ...I shouldn't go alone. I'll bring one more person.\""
 trinity_events_nagisa.39.desc.neutrality: "Nagisa was not a person of a quick-tempered nature. However, after her friend was sniped, the funeral was finished, and she had been submerged in deep despair and sorrow. To hear the story that in fact Seia did not die that day, but had been hidden in a secret location by the Leader of the Remedial Knights and treated after the sniping. Nagisa could not overcome her anger at having been used by the Remedial Knights.\n\nIt was not an action like the elegant 'Nagisa Kirifuji.' But for a moment, she couldn't even remember what being like Nagisa meant. Nagisa grabbed the Leader of the Remedial Knights by the collar. Due to memory impairment, she couldn't remember her name or what kind of person she was, other than that she was the 'Leader of the Remedial Knights,' but Nagisa clearly remembered what £GFX_blank_texticon_small_2 should have done in that situation.\n\n\"I was a person who had the right to know about Seia-san.\"\n\"Please understand it was an unavoidable decision to protect Seia-sama after the sniping. For the sake of relief, one must sometimes choose harsh but cruel methods. ...Because there was a possibility that there were collaborators with the sniper inside the Tea Party...\"\n\"Are you saying that I collaborated in killing Seia-san?\"\n\"That's... not what I meant.\"\n\nThe Leader of the Remedial Knights spoke in a dispirited voice with her head slightly bowed.\n\n\"...I was in a situation where I couldn't trust anyone. I just... thought that if I didn't do this, Seia-sama would be in danger again...\"\n\nNagisa looked straight at her. Anger surged, but she had to endure. What mattered was that she saved Seia and had protected her until now. Nagisa slowly let go of the hand gripping the collar. While the Leader of the Remedial Knights caught her breath, Nagisa struggled to regain her usual composure and elegance as she spoke.\n\n\"I apologize for my rude behavior just now. Please... can you take me to where Seia-san is?\""
 trinity_events_nagisa.39.a: "Mine nodded."
 trinity_events_nagisa.40.t: "Seia Yurizono Wakes from Her Sickbed"
 trinity_events_nagisa.40.desc.democratic: "While asleep, Seia saw different dreams every day. They were the infinite futures that 'could have' happened. In one future, Nagisa became Host, but Pandemonium's armored division entered Eden and Trinity was dissolved. In some dreams, Mika became a great victor who conquered all of Kivotos. But on another day, Mika became a prisoner of the Gehenna Prefect Team members. There were futures where Trinity fired ICBMs at Millennium, and futures where Millennium's ICBMs fell on Eden. Aru Rikuhachima gave a victory speech in the ruins of Eden, or Sakurako held a European Unification Commemoration Mass at the Old Cathedral.\n\nSeia wondered 'what' Trinity would be like when she woke up, was afraid, and thus wished only to remain submerged in the sea of possibilities without ever waking up. Because if you don't see the result, there's no reason to fear. Seia is in a room like a small box. In that box, there could be a dead cat or a live cat. If you don't open it, the possibility of the cat being alive doesn't become 0 percent. But. One cannot keep the box closed forever.\n\n\"Seia-sama. ...You have visitors.\"\n\nThe door to the private room opened, and two friends dressed in white entered. Seia felt her heart beating wildly. Nagisa and Mika. The two entered the hospital room with bouquets, along with Mine. Seia had never seen a future where the two visited her at the same time. Either Mika perished, or Nagisa perished. Seia wept several times with her head bowed, happy that the two came to see her together, and hating herself for having wished not to wake up because she was afraid of meeting them.\n\n\"I am sorry. I... truly, did wrong.\""
 trinity_events_nagisa.40.desc.neutrality: "While asleep, Seia saw different dreams every day. They were the infinite futures that 'could have' happened. In one future, Nagisa became Host, but Pandemonium's armored division entered Eden and Trinity was dissolved. In some dreams, Mika became a great victor who conquered all of Kivotos. But on another day, Mika became a prisoner of the Gehenna Prefect Team members. There were futures where Trinity fired ICBMs at Millennium, and futures where Millennium's ICBMs fell on Eden. Aru Rikuhachima gave a victory speech in the ruins of Eden, or Sakurako held a European Unification Commemoration Mass at the Old Cathedral.\n\nSeia wondered 'what' Trinity would be like when she woke up, was afraid, and thus wished only to remain submerged in the sea of possibilities without ever waking up. Because if you don't see the result, there's no reason to fear. Seia is in a room like a small box. In that box, there could be a dead cat or a live cat. If you don't open it, the possibility of the cat being alive doesn't become 0 percent. But. One cannot keep the box closed forever.\n\n\"Seia-sama. ...You have a visitor.\"\n\nThe door to the private room opened, and a friend dressed in white entered. Seia felt her heart beating wildly. Nagisa Kirifuji. She entered the hospital room quietly and alone with a bouquet. Seia wept several times with her head bowed, hating herself for having wished not to meet Nagisa because she was afraid of waking from the dream and meeting her.\n\n\"I am sorry. I... truly, did wrong.\""
 trinity_events_nagisa.40.a: "Nagisa hugged Seia in silence."
 trinity_events_nagisa.41.t: "Seia's Return"
 trinity_events_nagisa.41.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\nNagisa. I am sorry for causing such worry in the meantime. Please forgive me for informing you of my status through this voice message as I must undergo rehabilitation at the hospital for the time being. No. Do not forgive me. While I was unaware, I gave my friends too deep a wound.\n\nI cannot return to the Sanctus faction. Lamentably, I seem to have become an 'enemy' of Sanctus. Those who managed Sanctus in the meantime have apparently divided power among themselves inside, creating positions like Party President, Ethics Committee Chairman, and Secretary General. If I, who have been away from politics, return to the head of Sanctus, would it not mean I am reclaiming the intra-party power they have divided among themselves? I understand them. For it is said that power cannot be shared even with family. However, regarding the fact that they did not allow me back even to the lowest rank of Sanctus, I am slightly... no. Honestly, I am quite angry.\n\nNagisa. I do not wish to evade my duties. I wish to serve in public office for the sake of the fellow students of Trinity and our precious citizens. It is fine even if my place is not in Sanctus. Please allow me to put forth the greatest effort possible for Trinity. I left Nagisa to bear too heavy a burden alone for years. So please. I will accept even the lowest seat in Filius, so allow me to help Nagisa after I am discharged. I await your reply."
 trinity_events_nagisa.41.a: "I'll have to prepare an administrative post for Seia-san." 
 trinity_events_nagisa_41_a_tt: "$TRN_Yurizono_Seia$ returns to Trinity as a member of the Filius faction."
 trinity_events_nagisa.42.t: "Pater's Protest Over Seia Joining Filius"
 trinity_events_nagisa.42.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\nNagi-chan? You sleeping? ...You didn't block me, right? You didn't answer the phone, so I'm leaving this in your voicemail. Pater told me to send an official protest message, but I don't want to. Seia-chan came back alive. That's all that matters. Do I really have to whimper about whether she goes to Filius or Sanctus? I... really, thought Seia-chan was dead. No. I didn't just think it. Nagi-chan, you saw it with me. The... cremation of the coffin at the wake. That. Hey. Sorry. Sorry, breathing is a bit hard. One second.\n\n... ... ...\n\nSorry. I'm back. Skip this part later.\n\nNagi-chan. Thanks. Just... for accepting Seia-chan, and I won't forget that you went to visit her every day instead of me. Someday, let's the three of us gather again for a tea party. No. It's fine even if I'm not there. Even a tea party with Seia-chan and Nagi-chan is fine, so please make Seia-chan happy. Thank you."
 trinity_events_nagisa.42.a: "I'll hang up now. You don't have to reply."
 trinity_events_nagisa.43.t: "Johannes Faction's Political Intervention?"
 trinity_events_nagisa.43.desc: "\"Becoming a Host, I have no such thoughts.\"\n\nHaving a tea session with Seia, Mine shook her head quietly. After waking from her deep sleep and grasping the changed political situation of Trinity, Seia began to encourage Mine to challenge politics. Mine asked, trying to read Seia's thoughts:\n\n\"Is Nagisa-san in a very difficult situation?\"\n\"Politically, it is hard. The Filius faction won the war against Gehenna and gained great social influence. However, Filius still does not have the ability to obtain a majority alone in the next Host election. But... the Johannes faction does not have such a terrible relationship with Pater, so it might take some Pater votes.\"\n\"Other than political motives, do you have any other reason for encouraging my entry into politics?\"\n\"...I do. I suppose the cause is... anxiety. Pater and Filius have grown too far apart after the Great Transference. The two factions will eventually reconcile someday, but if power passes to Pater in the current situation, I fear retaliation against Nagisa. Of course, I did not see that future. But call it a hunch. I feel uneasy because of such things...\"\n\nAnxiety. Mine could understand why Seia would say such things. Because she had only been lying in bed in a state of unconsciousness for several years, Seia harbored guilt toward her friends. If there was even a small possibility that Nagisa could face danger, that possibility had to be blocked. Unifying the Host candidates for Filius and Johannes. That must be the most rational option for Seia right now. Of course, the Mine who wears the crown at the end of it would personally suffer.\n\n\"This issue would obviously have to be discussed with Nagisa-sama, but regardless of that, my thoughts are...\""
 trinity_events_nagisa.43.a: "I do have a heart that wants to be the Host."
 trinity_events_nagisa.43.b: "The moment I intervene in politics, I cease to be the 'Leader of the Remedial Knights.'"
 trinity_events_nagisa_43_a_tt: "§gMine Aomori is added to the Host election candidates.§!"
 trinity_events_nagisa.44.t: "The Nagisa Constitution"
 trinity_events_nagisa.44.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\nTo all of you gathered here for this Council on constitutional reform, thank you. You are all noble elites deserving of respect. Our home has undergone much turmoil since the Great Transference. Shaken by heavy waves, and beaten by harsh winds. However, we have overcome all difficulties as one, and the ideals of the first Trinity did not falter even after all those events ended. But to bequeath an unchanging Trinity to the next generation and the generation after that, we must continue to reform ourselves.\n\nI have heard the concerns of many while preparing this constitution. Some have criticized me, asking how the reform I advocate is any different from the 'Second Trinity' ideology. I respect all opposing opinions. The new constitution I have designed will reform Trinity to fit the changed international situation after the Great Transference. However, my reform will be one that does not damage the noble spirit of Trinity. The Tea Party will still be an entity that looks after the citizens like a benevolent mother, and I promise that our noble traditions will never be reformed nor changed.\n\nI stand here to replace the door of the old house that is Trinity and to newly decorate the flowerbeds. I do not stand here to destroy the house and rebuild it. I believe all officials attending the Council will realize that the Trinity reformed by the new constitution merely codifies rights that should have been naturally guaranteed in the previous Trinity. To pass the new constitutional amendment at the Council, your votes in favor are necessary. Amendment materials have been delivered to you, so please read them carefully before making a decision. Thank you."
 trinity_events_nagisa.44.a: "The constitutional amendment was passed with an overwhelming majority in favor."
 trinity_events_nagisa.45.t: "Reconciliation with Mika"
 trinity_events_nagisa.45.desc.seia: "Even after waking up, Seia still appeared exhausted and sickly, but it was clear that her health was improving significantly. Seia spoke as she sat facing Nagisa in the tea room.\n\n\"I hope Nagisa-san reconciles with Mika-san.\"\n\"Reconciliation... even if you say that, Mika-san and I have always been friends.\"\n\"Not politically. In public, you shout at each other, condemn the other as a witch who will destroy Trinity, and didn't today's Filius meeting discuss ways to ruin Mika-san? If I had such a friend, I would have already become 'besties' with the sniper who shot me.\"\n\nAt the usage of the term 'besties' (very Sakurako-esque), which was unlike the pedantic Seia, Nagisa could not stop a smile from escaping. Regardless of that, her point was valid. The division between Pater and Filius was causing the relationship between Nagisa and Mika to become increasingly neglected. The Eden Treaty was originally meant to protect Mika, but Nagisa entered the negotiation room condemning Mika and hating Pater. It had been years since she stopped baking roll cakes for Mika. When was the last time she tilted a teacup together with Mika while sitting across from her in the tea room?\n\nIt was all because of 'politics.' Filius and Pater. The two had become a relationship where they could not reach the top without breaking the other. ...But is there not something more important than politics? Even if one holds all power, does that power have meaning if there is no precious person by one's side? Nagisa hesitated for a moment before speaking.\n\n\"...Yes. If so, I shall try. However, true reconciliation with Mika-san cannot be completed merely by the personal relationship between Mika-san and me improving. It means the long-standing conflict between the Filius and Pater factions must end. ...Pater has already lost the momentum to seize power alone. I do not know if it is possible, but I shall try to end the conflict between the two factions.\"\n\"I will help as much as I can. Not everything can return to how it was before the Great Transference, and nor should it, but I hope that at least our relationship can return to how it was.\""
 trinity_events_nagisa.45.desc.generic: "Hifumi was often invited to Nagisa's tea room. While Hifumi herself might not know if she's happy, at least Nagisa enjoyed meeting her. However, today's meeting was a bit different from before. Hifumi seemed to have a story she wanted to tell Nagisa.\n\n\"I want Nagisa-sama to reconcile with Mika-sama.\"\n\"Reconciliation... even if you say that, Mika-san and I are still friends.\"\n\"...T-That may be true. But Nagisa-sama and Mika-sama. You haven't been able to properly meet for years now. Furthermore, when the Filius faction people gather, they only ever talk about how to 'overthrow' Mika-sama. I don't know much about politics, but I think it shouldn't be like this for you two...\"\n\nNagisa quietly set down the teacup in her hand. The division between Pater and Filius was causing the relationship between Nagisa and Mika to become increasingly neglected. The Eden Treaty was originally meant to protect Mika, but Nagisa entered the negotiation room condemning Mika and hating Pater. It had been years since she stopped baking roll cakes for Mika. When was the last time she tilted a teacup together with Mika while sitting across from her in the tea room?\n\nIt was all because of 'politics.' Filius and Pater. The two had become a relationship where they could not reach the top without breaking the other. ...But is there not something more important than politics? Even if one holds all power, does that power have meaning if there is no precious person by one's side? Nagisa hesitated for a moment before speaking.\n\n\"...Yes. If so, I shall try. However, true reconciliation with Mika-san cannot be completed merely by the personal relationship between Mika-san and me improving. It means the long-standing conflict between the Filius and Pater factions must end. ...Pater has already lost the momentum to seize power alone. I do not know if it is possible, but I shall try to end the conflict between the two factions.\"\n\"...I-I'll help if possible. I don't want to see Nagisa-sama suffering...\""
 trinity_events_nagisa.45.a: "How could Nagisa ever abandon Mika?"
 trinity_events_nagisa.46.t: "Success of Filius-Pater Reconciliation"
 trinity_events_nagisa.46.desc: "Pater held hatred and hostility toward Filius. But as the long-term Filius rule became reality, no legal method for them to take power from Filius remained. There was also no way for a coup now that Nagisa's control over the Justice Task Force was certain. Eventually, a meeting was held to terminate the conflict between Filius and Pater. Mika and Nagisa hoped to end their love-hate relationship of being childhood friends yet political rivals through this meeting.\n\n\"...Pater apologizes for all political maneuvers against Filius...\"\n\nAnd in this meeting, Pater finally bowed their heads. Senior officials of Pater decided to give up their hostility toward Filius and stay as a 'quiet' opposition force for the time being. Mika admitted and officially apologized for attempting sabotage during the previous Eden Treaty period, and as Nagisa accepted that apology, the long political conflict that continued since the Great Transference ended in a form of Filius's 'victory by decision.'\n\nAnd now, Mika will be able to go see Nagisa again without having to worry about outside eyes, just like before the Great Transference. She has reclaimed the right to sit across from Nagisa in the tea room, where her seat had always been empty, and have a small teatime. Everything cannot be reclaimed exactly as it was before the Great Transference, but at least Mika reclaimed one small friendship."
 trinity_events_nagisa.46.a: "So, all those conflicts have finally ended."
 trinity_events_nagisa.47.t: "Failure of Filius-Pater Reconciliation"
 trinity_events_nagisa.47.desc: "Pater held hatred and hostility toward Filius. But as the long-term Filius rule became reality, no legal method for them to take power from Filius remained. There was also no way for a coup now that Nagisa's control over the Justice Task Force was certain. Eventually, a meeting was held to terminate the conflict between Filius and Pater. Mika and Nagisa hoped to end their love-hate relationship of being childhood friends yet political rivals through this meeting.\n\nAlthough Mika herself wanted to improve the relationship with Filius, the meeting eventually ended in failure. From within Filius, which had continuously suffered damage from Pater's maneuvers, anger poured out saying 'We cannot compromise with the witch.' Nagisa herself could not suppress her contempt for the Pater faction, separate from her friendship with Mika. Within the Pater faction as well, political pressure on Mika forced the meeting to be suspended.\n\n\"...This is Shinon Kawaru from Kronos News. The reconciliation between the two factions, Pater and Filius, seems to have been more difficult than the Eden Treaty. The meeting broke down as officials from both factions grabbed each other by the collar and fought! In what form did the two factions fight? Kronos News will recreate it using voice actors...\"\n\nThe meeting failed. Mika and Nagisa remained as 'the heads of two opposing factions.' It will be difficult for Mika to freely visit Nagisa in the future."
 trinity_events_nagisa.47.a: "Still, let's say the attempt itself wasn't bad."
 trinity_events_nagisa.48.t: "Future Foresight? Parallel Universes?"
 trinity_events_nagisa.48.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\nNagisa. As you surely know, I pride myself on having used only polite honorifics with others. Compared to Mika-san, I could be called very 'lady-like.' ...You aren't laughing, are you? I shall believe so.\n\nWhen I was hit by the bullet and asleep, I saw infinite possibilities for Trinity. Well, even if I call them possibilities, half of them were bad endings, so it wasn't a very pleasant experience. The important thing is not about Trinity, but about me.\n\nStrangely, there were quite many worlds where I did not use honorifics and used informal, blunt speech. But I am absolutely not a person who speaks that way. So this speculation occurred to me: the future I see is not the determined future of this real world, but merely observing the state of parallel universes at a point much later than now. Of course, this is just my hypothesis, not a confirmed fact. Who knows, perhaps I might suddenly start using words like 'you' in the future?\n\nAnyway, I intend to research this issue personally. If I obtain as much information as possible from the Old Library, I might find a clue. Could you grant me permission to access the forbidden books of the Old Library along with Shimiko? I trust that Nagisa will help solve my intellectual curiosity and ask this favor."
 trinity_events_nagisa.48.a: "There is nothing impossible about it."
 trinity_events_nagisa.48.b: "I do not wish to know the secret of the informal Seia-san..."
 trinity_events_nagisa.49.t: "Nagisa's Reappointment? Or..."
 trinity_events_nagisa.49.desc: "\n\n\n                                                   £GFX_report_event_TRM_hifumi_ajitani\n\n\n\n\n\n\nPardon? You're saying you'll hold a new Host election to coincide with the promulgation day of the constitution that passed the Council recently? ...Yes. Since the constitution is changing. A vote of confidence for the Host position... Hmmm. Honestly, I don't have deep knowledge about politics, ahaha. But I roughly understood. That Nagisa-sama is contemplating whether she should run for election again, or whether she should 'lay it down' now.\n\nI'm not an incredible enough person to give Nagisa-sama separate advice. I don't know politics, I don't know society, I'm just an ordinary... just one person struggling to live each day. However, it's possible for me to listen to Nagisa-sama's worries.\n\n...Fufu. Yes! So you had such worries! ...Like this, sometimes nodding my head deeply.\n\nThe final decision must of course be made by Nagisa-sama, but I think Nagisa-sama doesn't have to worry alone. Don't you have the precious 'bonds' you've built over a long time until now? Nagisa-sama has strived to believe in others until now... and has listened to the advice of many people.\n\n...Yes. I believe you will definitely find a good person. Not me, but someone truly wonderful."
 trinity_events_nagisa.49.a: "No, Hifumi-san is surely..."
 trinity_events_nagisa_49_a_tt: "§gHow much have you carried out the belief of 'believing in others' so far? §YNagisa Kirifuji§!§g can hand over the Host position to one of the people §Gshe has believed in, trusted, and built bonds with§!§g until now. Whether Nagisa will personally challenge re-election is determined by various choices Nagisa has made so far:\n§!"
 trinity_events_nagisa.50.t: "Conversation with Seia"
 trinity_events_nagisa.50.desc: "\n\n\n                                                   £GFX_report_event_TRM_seia_yurizono\n\n\n\n\n\n\nSo you are worrying about handing over power. I understand. Nagisa has truly, truly suffered much while striving alone during that time. The final decision is Nagisa's, but I hope you no longer suffer.\n\nI remember Nagisa before becoming the Host—no, before entering the Tea Party. Although I do not know you as well as Mika does, I believe I also see through the past version of you to some extent. ...The current 'Nagisa Kirifuji' is not your original self. ...To behave in a way befitting the position of the Tea Party, Nagisa was always overworking herself. And you imprisoned the originally curious and tender version of yourself.\n\nI believe it is time for you to lay down that weight.\n\nEven if someone other than Nagisa takes the Host position, Trinity will not change. A person Nagisa trusts will become Host, and that person will move straight toward the future that was originally intended, like the brilliant starlight in that night sky. I heard Nagisa strived to believe in others even while I was absent. Now is that time. Believe. I do not mind which person you believe in. But that person you believe in will surely deliver the star of the first Trinity to that future we do not yet know. This is not a prophecy. It is my hunch and conviction, and my 'belief' in someone Nagisa trusts."
 trinity_events_nagisa.50.a: "It is because Seia-san was there that the current me exists."
 trinity_events_nagisa_50_seia_tt: "§gSeia Yurizono is added to the Host election candidates.§!"
 trinity_events_nagisa.51.t: "Time in the Inspector's Office"
 trinity_events_nagisa.51.desc: "\n\n\n                                                   £GFX_report_event_TRM_ako_amau_trinity\n\n\n\n\n\n\n... ... Puehung! Et, ee. So, are you saying you're asking a former Gehenna Senior Administrator for advice on a power transition? This isn't like a hidden camera prank or something, right? If I say one word wrong, the Justice Task Force members outside the door will arrest me and... you're saying it's not? Fufu. I wasn't scared. There's no way I, an elite agent and Inspector of the Tea Party, would be afraid... Whew. Yes. I was a bit scared. Happy now?\n\nI don't think I'm in a position to advise you, but if you need advice, I'll tell you. You have good people like your long-time friends Seia-san and Hifumi-san, don't you? It's fine to believe in them and pass the baton. ...I know your 'Eden Treaty' wasn't for the Gehenna people. If war breaks out, your precious people might get hurt or things might get worse. Didn't you write the draft of that treaty in Eden for precious people like Seia-san, Mika-san, or Hifumi-san even before the Great Transference?\n\nYes. I was the same. Because I hoped that one single person I love wouldn't get hurt, or wounded, or anything like that. So I just struggled in the working-level meetings.\n\n...So I also know. Just as much as I want to protect that person, Hina... no, that person also wants to protect me. Hifumi-san, Seia-san, and even Mika-san of Pater must feel the same way. If you hand over the Host position to those people, surely, just as much as Nagisa-san tried to protect them, those people will protect Nagisa-san. Don't just think that Nagisa-san is protecting them. It's bidirectional. Fufut. How was that? Was I a bit cool?"
 trinity_events_nagisa.51.a: "You are strange, but you are not a bad person."
 trinity_events_nagisa_51_ako_tt: "§gAko Amau is added to the Host election candidates.§!"
 trinity_events_nagisa.52.t: "Connections in Arius"
 trinity_events_nagisa.52.desc: "\n\n\n                                                   £GFX_report_event_TRM_nagisa_kirifuji\n\n\n\n\n\n\n...You decided to ask a person of Arius too? Fufu, I'm a bit surprised. I didn't think you'd consult with me even about the internal political situation, no matter how much Trinity respects my 'royal blood' lineage.\n\n...Advice, huh. I'm not sure what to say. There was no such thing as a voting system in Arius. Everything was decided according to Madame's feelings. If Madame said 'I want to do that,' it became so, and there was no procedure for listening to other people's thoughts. The top instructs. Then the bottom follows. That's all there was.\n\nBut if I were to tell you another story instead of advice... hmmm, the story of Saori would be good, right? Once, I was about to be offered as a sacrificial lamb by Beatrice. It was Saori who saved me. In fact, if you weigh it by interest, it's something that makes no sense. Even if she saved me, there was nothing I could give Saori. But Saori helped me simply because she believed she 'had to.' She didn't follow anyone else's decision or instruction; she just followed her own heart.\n\nNagisa, whether you get re-elected or throw away the Host position, I think you shouldn't be swayed by other people's stories. Well, since you've come this far, it's already impossible anyway. Fufu. Do what Nagisa 'wants' to do. That's the right choice, and also the best choice for the Host herself."
 trinity_events_nagisa.52.a: "So you mean I should believe in 'myself' as much as I believe in others."
 trinity_events_nagisa_52_atsuko_tt: "§gAtsuko Hakari is added to the Host election candidates.§!"
 trinity_events_nagisa.53.t: "And, to the You Who is Most Precious"
 trinity_events_nagisa.53.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\nHello! Nagi-chan! Consulting with me? I'm really surprised... No, surprised in a positive way! Giving various advice to Nagi-chan, honestly it's fun. It feels like returning to when we were kids. ...Yeah. Nagi-chan at that time was very different from now. She laughed a lot, was tender... and so, Nagi-chan changed a lot after starting politics. That was the impression.\n\nWorrying about handing over the Host position to others... Hmmm. Am I among the candidates too? Ahahat☆ Just kidding. Pater must not take power. At least, not 'after Nagi-chan.' If I take over, the tower Nagi-chan carefully built will collapse in an instant.\n\nThe advice I can give. I hope Nagi-chan doesn't do politics anymore. ...It's not because of my greed. It's because I feel Nagi-chan is changing. Yeah. You are definitely trying. But, Nagi-chan tries 'too much.' That's a bit, painful.\n\n...If I had the choice...? Hmmm. How about Inspector Ako? Ahaha☆ Nagi-chan, you really have a surprised expression? Well, I don't mean Nagi-chan should really pick that person. I'm telling you 'the option the head of the Pater faction would be least likely to choose.' What does it mean? It means in times like this, you have to do reverse thinking. Not 'Nagisa Kirifuji, the head of the Filius faction,' but before entering the Tea Party. Let's pick the choice of the 'human Nagisa Kirifuji' who used to more boldly press roll cake into my mouth. That's the reverse thinking I'm talking about. You understand? Among the choices seen by politician Nagi-chan, pick the person she's most 'unlikely to look for.' I think that's good.\n\nAhahat☆ Well. Whoever you choose, I'll bless that choice. No, you don't even have to choose anyone. I won't care if Nagi-chan stays Host for a hundred years. I just... I just hope Nagi-chan makes a choice that makes her happy. For you, I... Ahaha. I'm not crying. Really. ...Yeah☆ Thanks."
 trinity_events_nagisa.53.a: "A choice the 'Nagisa of Filius' wouldn't make..."
 trinity_events_nagisa_53_mika_tt: "§gThe Tea Party Host election will be held in 48 hours.§!"
 ## 54-Happy Ending Event (Someone other than Nagisa is elected)
 trinity_events_nagisa.54.t: "To the Cinderella Whose Magic Has Been Broken"
 trinity_events_nagisa.54.desc.seia: "\"Na-Nagisa... I did wrong. No, I don't know what I did wrong, but I did wrong...!\"\n\nAs if unable to hear Seia's scream-mixed apology, Nagisa, wearing sunglasses, increased the speed of the sports car running along the coastal road. After quitting as Host and gaining complete freedom, it was the first private trip she went on alone with Seia. While running along the Trinity north coastal road, Nagisa felt a sense of liberation she had never felt once since the Great Transference.\n\n\"I should have done this sooner.\"\n\"...Over-speeding?\" \"Resigning as Host. And at this speed, it's not even that much over the limit.\"\n\"We have socially agreed to call 300km/h 'over-speeding.'\"\n\nDespite Seia's grumbling, Nagisa slowly turned the steering wheel in liberation. Nagisa Kirifuji had been freezing coldly. That was not because of the Great Transference, but a change that began after entering the Tea Party and starting politics. Nagisa had to doubt everything to become a proper politician, and had to become the loneliest person while becoming the Host as the head of Filius.\n\nBut that was only the politician Nagisa Kirifuji, not the girl Nagisa Kirifuji.\n\nNagisa threw away the 'paranoia' that kept her as a politician. She decided to love her long-time enemy, Gehenna. She decided to understand the locals who were hostile to her. She decided to forgive her political rivals. And, she even decided to accept Mine, who hid Seia. All those were procedures for her to return to an ordinary girl. At the moment she came to trust others enough to even lay down her power and leadership. Nagisa became Nagisa.\n\nBefore she knew it, the beach they decided to visit was close enough to be seen. Nagisa gradually reduced the car's speed and fully enjoyed the blowing sea breeze. Even if Cinderella's magic broke and the wonderful clothes wrapping her body returned to rags, she didn't care."
 trinity_events_nagisa.54.desc.mika: "\"Na-Nagisa... I did wrong. No, I don't know what I did wrong, but I did wrong...!\"\n\"Ahaha☆ So Nagi-chan actually had this side to her?\"\n\nAs if unable to hear Seia's scream-mixed apology and Mika's smirking voice next to her, Nagisa, wearing sunglasses, increased the speed of the sports car running along the coastal road. After quitting as Host and gaining complete freedom, it was the first private trip she went on with Seia and Mika together. While running along the Trinity north coastal road, Nagisa felt a sense of liberation she had never felt once since the Great Transference.\n\n\"I should have done this sooner.\"\nMika asked. \"...Over-speeding?\" \"Resigning as Host. And at this speed, it's not even that much over the limit.\"\n\"Wao... Isn't it a social agreement to call 300km/h 'over-speeding'?\"\n\nDespite Mika's grumbling, Nagisa slowly turned the steering wheel in liberation. Nagisa Kirifuji had been freezing coldly. That was not because of the Great Transference, but a change that began after entering the Tea Party and starting politics. Nagisa had to doubt everything to become a proper politician, and had to become the loneliest person while becoming the Host as the head of Filius.\n\nBut that was only the politician Nagisa Kirifuji, not the girl Nagisa Kirifuji.\n\nNagisa threw away the 'paranoia' that kept her as a politician. She decided to love her long-time enemy, Gehenna. She decided to understand the locals who were hostile to her. She decided to forgive her political rivals. And, she even decided to accept Mine, who hid Seia. All those were procedures for her to return to an ordinary girl. At the moment she came to trust others enough to even lay down her power and leadership. Nagisa became Nagisa.\n\nBefore she knew it, the beach they decided to visit was close enough to be seen. Nagisa gradually reduced the car's speed and fully enjoyed the blowing sea breeze. Even if Cinderella's magic broke and the wonderful clothes wrapping her body returned to rags, she didn't care."
 trinity_events_nagisa.54.a: "Even if she isn't the Host, Nagisa is Nagisa."
 trinity_events_democratic_nagisa_happy_ending_tt: "§gEnter something cool here§!"
 ## 55-Bad Ending Event (Democratic route, but Nagisa maintains power)
 trinity_events_nagisa.55.t: "An Incurable Paranoiac"
 trinity_events_nagisa.55.desc: "\"As for me, I do not know if Nagisa's choice was right.\"\n\nLeaving Seia's regrettable expression behind,"
 trinity_events_nagisa.55.a: "To whom would you entrust the future of Trinity?"
 trinity_events_democratic_nagisa_bad_ending_tt: "§gEnter something cool here§!"
 TRM_democratic_nagisa_ending_flag: "The §Gending§! of Nagisa's story has unfolded."
 ## Post-Ending Events
 trinity_events_nagisa.56.t: "Viper's Den" # Hifumi Host
 trinity_events_nagisa.56.desc: "\"Name.\" \"Hanako Urawa. Well, I think you'd know me since I'm that famous?\"\n\"How should I know? Do I have to memorize the name of a pervert running around stark naked in the middle of Eden? It's the death penalty! Death penalty!\"\n\nJustice Task Force official Koharu Shimoe glared at Hanako with sharp eyes. In fact, saying 'I don't know' was a lie. The reputation of this woman who liked exposure was legendary even within the Justice Task Force. It was just that meeting her in person today was the first time. Koharu cleared her throat and leaned forward slightly like a rough detective on purpose.\n\n\"Urawa. So 'why' did you do this? It's recorded that you lived quite a steady life until before the Great Transference.\"\n\"The Great Transference... you like very old records, don't you? Fufut. Well, I just didn't like the snake-like aspect of Trinity.\"\n\"Snake? What's wrong with our Trinity?\"\n\"Filius, Pater, Sanctus... wearing fancy clothes and caught up in power struggles even after the Great Transference happened. Nagisa-san is triumphant, saying she 'changed' such a Trinity, but that woman named Hifumi Ajitani you brought from somewhere is just a member of a shadow organization who has never appeared before the public, right? Networking politics. Factional politics. Don't you think 'savages' who don't even wear a single piece of clothing are better than 'civilized people' caught up in such unpleasant hypocrisy? Yes. That's why I stripped. Civilization, Trinity, the Host, they're all trash. Hypocrisy. In this viper's den...\"\n\nKoharu felt nausea at Hanako's endless long-winded talk. She thinks she realized something unlike others and is being conceited, but so the thing she did was stripping and running around? Of course, that action of stripping and running around itself was a little bit... interesting... but still, both the motive and the action were merely sophistry. Koharu closed the document. The interrogation was over. She would never have to face this woman again in her life.\n\n\"That's enough, just get out. I'm a very busy person who has to interrogate other bad guys too.\" \"Oh my... fufut. Yes. Then I shall head out. Peace be with you, Shimoe-san.\"\n\nKoharu stared coldly at Hanako's disappearing back and then turned her head. Performance artists are incomprehensible. Nagisa, Hifumi. Whoever becomes Host in that world high above the clouds, what does it have to do with us? People we'll never even meet in our lifetime. Koharu called another unknown name of someone who was arrested for wearing a gas mask and causing a disturbance in the park."
 trinity_events_nagisa.56.a: "\"Next. Azusa Shirasu.\""
 trinity_events_nagisa.57.t: "An Unseen Future" # Seia Host
 trinity_events_nagisa.57.desc: "\"I have returned. To this seat, the seat I felt I should not be in.\"\n\nSeia sat in the chair. The absurdly fancy chair Nagisa had used for a long time was a bit uncomfortable for Seia. Seia touched the pens in the Host's office one by one. It hadn't changed at all from the 'first term' days that now remained as a blurred dream memory. All that changed was the gap of several years.\n\n\"I did not expect that I would return here.\"\n\nSeia wore a faint smile. While calling herself a great prophet who sees the future, she did not predict at all that she would return as Host. Among the countless possibilities she saw when she was shot and unconscious, this future alone did not exist. Then what is this moment? Perhaps Seia's own future foresight is not perfect? Seia thought that was rather more pleasing. Is it not better to 'pioneer' the future directly than to know everything? And the great mission of pioneering was now entrusted to Seia.\n\nIt's fine even without prophecy. It doesn't matter even if future predictions are wrong. Whatever hardships arise in the future, as long as Nagisa and Mika are there, she will surely be able to overcome those difficulties."
 trinity_events_nagisa.57.a: "Just as it has always been."
 trinity_events_nagisa.58.t: "The Death of the White-Clad Warrior" # Mine Host
 trinity_events_nagisa.58.desc: "\"Host-sama, the Remedial Knights have requested a budget increase for next year. Please read it as the Operations Director wrote it personally.\"\n\nMine felt a slight nausea as she received the polite document from the bowing Serina. A budget proposal written by some 'committee' whose name she didn't even know, in which she, the Leader of the Remedial Knights, had not been involved at all. Since Mine became the Host, she was becoming increasingly distant from the Remedial Knights. Sitting in a comfortable chair, having tea sessions with politicians and discussing the future of Trinity day by day. But in that daily life, neither 'relief' nor 'patients' existed anymore. Serina's tone, as if Mine were some high-ranking person from outside rather than from the Remedial Knights, forcibly pulled out the reality Mine had forgotten for the last month.\n\n\"I... I am the Leader of the Remedial Knights, why would the Remedial Knights send such a document without my approval...\"\n\nMine tried to get angry. But she couldn't. It wasn't that the Remedial Knights had abandoned Mine. Mine Aomori had abandoned relief. Mine felt her eyes gradually getting moist. It was something she had worried about since before the Great Transference. The 'leader of the Johannes faction' who had the right to enter the Tea Party at any time she wanted. However, Mine never did so. Because she knew that the moment she became a politician, the moment she started wearing a nice mask and putting on fancy pretenses, she would lose that pure will that was possible because she was outside politics.\n\n\"...Serina.\" \"Ye-Yes?\" \"Who does the person in front of you look like?\"\n\"What do you mean by that...\" \"Am I still Captain Mine to you? Or... am I just 'Host-sama'?\"\n\nA long silence followed. Serina tried to say something, but eventually dropped her head. \"I am sorry...\" That apology was the answer. Mine gripped the budget proposal tightly."
 trinity_events_nagisa.58.a: "\"I will approve this... so please leave me alone for a moment.\""
 trinity_events_nagisa.59.t: "What One is Capable of Doing" # Ako Host
 trinity_events_nagisa.59.desc.hina: "\"Making new friends is always a good thing. No matter who the counterpart is.\"\n\nSeia spun her pistol like a cowboy, seemingly quite pleased with having beaten Ako at the indoor shooting range. Although Ako, who lost to Seia who had spent several years in the hospital in a coma, was frustrated to death.\n\n\"Manipulation...! There was some manipulation! To manipulate even though I've become the Host...\"\n\nHina smiled softly and pulled on Ako's sleeve. \"Well, the important thing isn't victory or defeat, is it? Today was fun.\"\n\nHer words were right. Well, what does winning or losing matter. Ako suppressed her frustration for a moment and began walking again.\n\nAfter the Host election, Seia came to visit increasingly often. The surface reason is that both Ako, who is from another school, and Seia, who is from Sanctus, are political minorities in Trinity and thus must cooperate strategically, but neither of them are exactly of the 'politicking' personality, are they? She had once asked Seia about the real reason. At that time, Seia used to say this:\n\n\"Have I not been lying in the hospital in a coma for several years? So Nagisa and other Trinity-born people just... try to 'overprotect' me. Like looking at a glass cup that might break. That is clearly a bias. Because my lying in the hospital was due to being sniped, not a rare disease. But immigrant Ako does not treat me that way. That felt a bit more comfortable. If the seat you look from changes, the scenery of the world also changes. Scenery only visible to Host Ako, and thus things only Host Ako can do. I wanted to know that.\"\n\nAko closed and opened her eyes for a moment. Seia sheathed the pistol she was spinning into its holster. \"Are you impressed by my shooting? You're staring at me suspiciously.\"\n\"Impressed? No. I was just... thinking about something else.\"\n\nA world only I can see. Whatever it is, if I alone can protect the two, then I must do so. Along with the boisterous laughter and smiles of the two, Ako decided to be grateful for this today she was given." # Hina is leader
 trinity_events_nagisa.59.desc.robot: "\"Making new friends is always a good thing. No matter who the counterpart is.\"\n\nSeia spun her pistol like a cowboy, seemingly quite pleased with having beaten Ako at the indoor shooting range. Although Ako, who lost to Seia who had spent several years in the hospital in a coma, was frustrated to death.\n\n\"Manipulation...! There was some manipulation! To manipulate even though I've become the Host...\"\n\nHina wore a dumbfounded expression and crossed her arms. \"Isn't the game already over? And, it's a 'game' anyway. It's not like anything happens if you lose.\"\n\nHer words were right. Well, what does winning or losing matter. Ako suppressed her frustration for a moment and began walking again.\n\nAfter the Host election, Seia came to visit increasingly often. The surface reason is that both Ako, who is from another school, and Seia, who is from Sanctus, are political minorities in Trinity and thus must cooperate strategically, but neither of them are exactly of the 'politicking' personality, are they? She had once asked Seia about the real reason. At that time, Seia used to say this:\n\n\"Have I not been lying in the hospital in a coma for several years? So Nagisa and other Trinity-born people just... try to 'overprotect' me. Like looking at a glass cup that might break. That is clearly a bias. Because my lying in the hospital was due to being sniped, not a rare disease. But immigrant Ako does not treat me that way. That felt a bit more comfortable. If the seat you look from changes, the scenery of the world also changes. Scenery only visible to Host Ako, and thus things only Host Ako can do. I wanted to know that.\"\n\nAko closed and opened her eyes for a moment. Seia sheathed the pistol she was spinning into its holster. \"Are you impressed by my shooting? You're staring at me suspiciously.\"\n\"Impressed? No. I was just... thinking about something else.\"\n\nA world only I can see. Whatever it is, if I alone can protect the two, then I must do so. Along with the boisterous laughter and smiles of the two, Ako decided to be grateful for this today she was given." # Other
 trinity_events_nagisa.59.a: "To Greet Tomorrow"
 trinity_events_nagisa.60.t: "A Single Page, Not Victory" # Atsuko Host
 trinity_events_nagisa.60.desc: "Sender: Atsuko Hakari\nRecipient: Saori Jomae\n\nTo Sa-chan.\n\nWhen was the last time I met Sa-chan, and the last time we had a conversation? Now the memory is about to become blurred. Are you watching me having become Host now? I hope you are.\n\nMany people call it success that the royal blood of the poorest Arius of Trinity stood at the top of Trinity. But I do not think so. In the life I will unfold in the future, this seat is not a period, but merely a passing comma. Surely you don't think I'm not Madame and will just be Host all my life until I die, right?\n\nSa-chan. I really miss you. At the Host inauguration ceremony, and when I entered the office as Host, it's not a bad experience that Seia-san or Ako-san and Hifumi-san greeted me, but still, I think I would have been happier if the one by my side was Sa-chan.\n\nDid I only list complaints? :) Of course, it's not that I only hate it. Things I couldn't do in Arius, helping many people and making them happy, I want to try them in Trinity. Because I have the experience of being groveling and living like a slave under Beatrice. I want to be a person who helps many people of Trinity so they can choose the 'future they want to choose' themselves.\n\nSa-chan. Someday, I'll look forward to the day I can deliver this letter to you directly.\nWhen that day comes, let's share the many, many stories we haven't been able to share until now.\n\nWritten on [GetDate].\n\nAtsuko Hakari,\nHost of Trinity."
 trinity_events_nagisa.60.a: "The letter was kept on the desk, waiting for the day to be sent."
 ## Hardest-to-see Hidden Route (Takane)
 trinity_events_nagisa.61.t: "Ohoho! I am the Host!" # Takane Host
 trinity_events_nagisa.61.desc: "\"This is madness.\"\n\nWhile sitting on the floor of the Host's office clutching her head, President Yakumo, who had entered saying she was the 'Grand Duchess's assistant,' burst into laughter.\n\n\"Ahaha! I really didn't know things would turn out like this? 'Grand Duchess Takane, Host Takane'! Has a person of this caliber ever come out from Red Winter?\"\n\"Is this something to laugh about now? All that 'Grand Duchess of the Frozen Kingdom' talk is a lie...! All of Trinity believes me, and Nagisa-san handed over the Host position to me! Do you know what will happen if this is found out now?\"\n\"A guillotine, probably.\" \"Are you saying that like it's someone else's business!?\"\n\nI'm going to die. Not a metaphorical expression, it feels like I'm really going to die. While Takane was exhausted and slumped on the floor, Yakumo said confidently with a laugh:\n\n\"You can't change what has already happened, can you? Then how about trying this? Completing this play too perfectly.\"\n\"What do you mean by that?\"\n\"Becoming the greatest Host in Trinity history. And making everyone not even feel like investigating that Takane wasn't a Grand Duchess. To the point they'll think 'Ah! Touching this person is blasphemy!' ...Well, there's no alternative but this, is there?\""
 trinity_events_nagisa.61.a: "\"I have no choice but to do it...\""
 trinity_events_nagisa.62.t: "Host Nagisa Kirifuji (Reappointment)"
 trinity_events_nagisa.62.desc: "Nagisa Kirifuji has been re-elected as the Host of Trinity."
 trinity_events_nagisa.62.a: "For the stability of Trinity."
 trinity_events_nagisa.63.t: "What If"
 trinity_events_nagisa.63.desc: "\"Although it's still just a rumor, they say Nagisa is considering handing over the Host position to someone else. And you are the person receiving the most attention as that 'next Host.'\"\n\nAko had a tremendous talent for throwing a huge story in a very non-huge situation, like a passing remark. Thanks to that, Hifumi almost fainted.\n\nA coffee shop in Eden. Hifumi, who came to hear Nagisa's recent daily life stories, stared at Ako with a dazed expression.\n\n\"This is like, ahaha. Is it like a stale April Fool's joke?\"\n\"We don't have enough rapport to share such jokes, do we?\"\n\"True... But still, me... politics. Could it be fake news?\"\n\nHifumi felt her consciousness fading just at the word 'Host.' To begin with, she was just an 'ordinary' girl. It was just a coincidence that the supreme power of Trinity was her friend. But, to have the possibility of being handed immense power.\n\nAko let out a short sigh.\n\n\"I heard that person is having a very hard time due to the weight of the Host position. Although I don't know well, she was originally a tender and bright person, not that kind of personality. But she came to doubt others after entering the Tea Party. ...So, she came to want to stop that 'doubting business.'\"\n\"So, she's contemplating laying down the Host position?\" \"That's right. She decided to trust others more. That's what I heard. And, that person says the one she trusts most privately is you, and that she has you marked as the successor...\"\n\n\"But. I think it's strange. If the reason Nagisa-sama's personality changed, she came to not trust others, and she became so distressed is because of 'politics,' why would she entrust that distressing, painful, and hard work to me? To begin with, it doesn't make sense. I also... ...will change. Host, can't you do it, Ako-san?\"\n\nAko wore a momentarily flustered expression, but then she toyed with her fingertips and shook her head.\n\n\"That's not something I can decide.\""
 trinity_events_nagisa.63.a: "\"Yes... none of us can decide directly.\""
 trinity_events_nagisa_63_a_tt: "§gOn the first day Nagisa became a member of the Tea Party, would that Nagisa have had the right to decide either?§!"
 trinity_events_nagisa.64.t: "Nausea"
 trinity_events_nagisa.64.desc: "Nagisa tenderly smiled and put a rope around Hifumi's neck, and a thorny crown on her head. No, she didn't really put them on. It's just that the position of Host itself was a torture device.\n\nHifumi had no friends other than Nagisa. She had visited the Abydos autonomous district a few times before the Great Transference to buy Peroro plushies. She passed by Abydos students a few times back then. If there were no Great Transference, they might have become friends. But such a thing did not happen.\n\nShe had no friends made in Trinity either. If the Great Transference had not happened, she might have known new friends through various events and miracles. Perhaps she might have gotten to know new friends while taking 'supplementary lessons.' But such a thing did not happen.\n\nAnd eventually, even Nagisa left the Host's office. Nagisa was still in the Tea Party, but she seemed to have chosen to enjoy her own life rather than politics. Since she handed over her work to her 'political successor,' she gradually stopped interfering with the Host.\n\nAnd Hifumi Ajitani was left alone.\n\nThe Host's office where no one comes unless called first. Just Filius ladies who were 'the same faction colleagues.' A tea party enjoyed alone, facing a Peroro plushie.\n\n\"Ahaha...\"\n\nHifumi set down her teacup."
 trinity_events_nagisa.64.a: "Politics is such a disgusting thing."
 trinity_events_nagisa.65.t: "I Believe in Hifumi-san"
 trinity_events_nagisa.65.desc: "\"Hifumi-san. I will stop visiting the Host's office every day like this.\"\n\"...Pardon?\"\n\nAt Nagisa's word that day, Hifumi dropped the pen she was holding in her hand to the floor. Nagisa said to Hifumi that she would no longer visit the Host's office, as if saying 'The weather is clear today.'\n\n\"...The Host is Hifumi-san. I have just come down to being a member of the Filius faction. My reviewing documents for Hifumi-san and giving instructions on policy directions until now was not to commit an act of overstepping authority, but to protect Hifumi-san, who is politically immature. However, has Hifumi-san not already 'learned' through my teaching?\"\n\nNagisa's words were right. What Nagisa was doing was clearly 'consideration.' Not making Hifumi a mere puppet Host, but a consideration to recognize her as a dignified political leader. But Hifumi was so afraid of that consideration.\n\n\"Then, all this work alone...\"\n\"No. Is the Filius faction not by Hifumi-san's side? Just as I did, believe. Belief and love will train Hifumi-san so she can endure.\""
 trinity_events_nagisa.65.a: "Believe in Filius and endure."
 trinity_events_nagisa_65_a_tt: "§g\"Eloi, Eloi, lama sabachthani?\"§!"
 trinity_events_nagisa.65.b: "Gather courage and say: 'I cannot endure it.'"
 trinity_events_nagisa_65_b_tt: "§gThe last chance before the soul breaks.§!"
 trinity_events_nagisa.66.t: "Faust"
 trinity_events_nagisa.66.desc: "Nagisa always had Mika and Seia by her side. Even as she self-deprecated about having changed, she was with those who remembered her before the change.\nBut for Hifumi, there was only a silent Peroro plushie. Having thrown her, who didn't want politics, into the political arena, Nagisa left. That person must have firmly believed that 'Hifumi alone will be different,' even though she herself experienced that 'process of a girl who didn't know politics entering the Tea Party and changing.'\n\n'Why was Nagisa-sama so cold only to me? While she loved Germans, Gehenna, Arius, and even Pater, why did she only abandon me?'\n\n\"Next document. These are anti-establishment groups that could affect Trinity's political situation. The German underground resistance demanding democratization...\"\n\"Put it down. I will review it.\"\n\nHifumi came to laugh less and less. Her only conversation partner is her reflection in the mirror. Hifumi called that conversation partner Faust.\n\n\"What do you think, Mr. Faust? These anti-establishment figures. Ah! You're saying they should be killed? Right. For the sake of Filius, the only side I have in this world, I can obviously do that much.\"\n\nFaust speaks. Locals are enemies hiding swords. Doubt them. Nagisa cherished reconciliation with Pater and friendship with Mika. But don't they also have blades? Doubt them. Look at the streets. Those many commoners. They are the ones trying to bring down the Tea Party's oligarchy.\n\nDoubt them."
 trinity_events_nagisa.66.a: "I have surpassed Nagisa-sama. It is because of her teaching."
 trinity_events_nagisa_66_a_tt: "§R\"I loathe that teaching.\"§!"
 trinity_events_nagisa.67.t: "This is Not Relief"
 trinity_events_nagisa.67.desc: "\"Seia-sama. I decided to challenge the Host position of Trinity through Seia-sama's request, and thus I seized power. However, I have lost something greater through this power. Relief.\"\n\nMine dragged the shield that had become nothing more than a piece of plastic trash with paint peeling off here and there.\n\n\"This shield I always carried when I had pride as the Leader of the Remedial Knights. Do you know where it was? While I was Host and tilting teacups with politicians in the Tea Party meeting room and wearing that hypocritical smile, this was stuck in a storage room for months and almost thrown away at a recycling disposal site.\"\n\nMine clenched her fist tightly. As if she were about to hit herself with that fist.\n\n\"...I can no longer show the image of the Leader of the Remedial Knights even in front of Serina-san. I dare not even call myself a member of the Remedial Knights. Seia-sama. Please take over the Host position. I will take any other post you give me. However, 'Tea Party' does not suit me. This position is too comfortable, and because everyone treats me like a queen... it makes me forget my duty...\""
 trinity_events_nagisa.67.a: "Seia nodded heavily."
 trinity_events_nagisa_67_a_tt: "§g\"I finally understand why the Johannes faction refused to become members of the Tea Party since before the Great Transference. I am sorry.\"§!"
 trinity_events_nagisa.67.b: "Seia persuaded Mine over a long period of time."
 trinity_events_nagisa_67_b_tt: "§g\"Politics is another form of relief. Mine is simply helping everyone in a new form.\"§!"
 trinity_events_nagisa.68.t: "Two-Party System"
 trinity_events_nagisa.68.desc: "Various factions that were crowded in the Trinity Tea Party have mostly lost political influence due to the political situation after the Great Transference. Currently, the Tea Party is in a situation where a two-party system by Filius and Pater is being implemented.\n\nNow that two influential factions remain, [ROOT.GetLeader] needs to be wary of the Pater faction's movement to scout various talents into their own faction. Mika Misono has no intention of stopping political opposition to Nagisa, and she wants various helpers to strengthen Pater.\n\nOf course, we are ready to face them."
 trinity_events_nagisa.68.a: "Filius will not lose."
 trinity_events_nagisa.69.t: "Change"
 trinity_events_nagisa.69.desc: "Sakurako didn't like the woman named Hanako very much. Since the Great Transference happened and Trinity's political situation changed, Nagisa and the Filius faction's oligarchy dictatorship is becoming increasingly solid. But Hanako only ever claims 'Trinity's politics are rotten, and those high above are just vipers.' She has never once suggested a direction for how Trinity should change, has she? Like a vending machine that spits out a drink when you put in a coin, a meaningless can that repeatedly vomits only cynicism.\n\nTherefore, when such a smart fool—as she thought—Hanako first requested an interview saying she brought an 'alternative.' Sakurako was greatly surprised for the first time. Perhaps Hanako herself decided to jump into politics directly.\n\n\"...Of course, unlike what you think, Sakurako-san, I'm not really interested in politics. Why would I degenerate myself into a viper?\"\n\"That alternative-less political loathing hasn't changed at all from before.\"\n\nSakurako's office. While sitting facing each other at the coffee table, Sakurako slightly lifted her teacup. \"Then, what is the story you want to tell me today?\"\n\"Nagisa-san is doing a dogmatic politics that only favors 'Filius.' Well, it's not like Trinity was a particularly democratic school before, but at least there was something like respect between factions, wasn't there? But, fufu. Yes. The current Nagisa-san is honestly too much. She's clinging to a closed belief that 'only Filius can be trusted' to the point of erasing all factions except Filius even from her own memory.\"\n\nHanako looked Sakurako straight in the eyes. And she delivered a phrase that is a clear taboo in the current Trinity.\n\n\"Wouldn't it be better if the Sisterhood, not Nagisa-san, governed Trinity?\""
 trinity_events_nagisa.69.a: "Sakurako made no reply."
 trinity_events_nagisa_69_a_tt: "§gA new decision that can change the balance of power in a negative direction is added. When [ROOT.GetAdjective] starts the focus $TRN_nagisa_neutrality_ending$, if the balance of power is in the direction of $TRM_anti_filius_factions$, the Sisterhood will stage a coup.§!"
 trinity_events_nagisa.70.t: "Chaos"
 trinity_events_nagisa.70.desc: "Sakurako 'didn't like' the woman named Hanako. Now, she has come to hate her to a terrible degree. To govern Trinity. Sakurako never had such a dream. Her duty was to teach faith to Trinity and lead the nuns according to God's teaching, not to become a shepherd herself. Because leading the flock named Trinity was the work of the Host, not the part of the faithful.\n\n\"Sakurako-sama, good morning.\" \"...Yes, good morning.\"\n\nWhile walking through the cathedral receiving the greetings of the nuns, Sakurako loathed the viper named Hanako. Even if she hadn't heard that story at all, once she heard it, she couldn't erase that memory.\n\nSakurako thought of the Tea Party building somewhere beyond the cathedral. Nagisa was clearly becoming strange lately. She was becoming dogmatic and doubting everyone except the Filius faction. Her memory impairment problem was also surfacing enough for Hanako, an outsider, to know.\n\nBut even so, does Sakurako Utazumi and the Sisterhood have the authority to pull Nagisa down?\n\n\"...I cannot say it is a good morning at all.\"\n\nSakurako felt a slight dizziness and sat on an empty chair in the cathedral. If Nagisa is walking an incorrect path, an alternative might be needed. But she wasn't yet sure if that alternative must be herself."
 trinity_events_nagisa.70.a: "Sakurako prayed to a God who would never answer."
 trinity_events_nagisa.71.t: "Qualified, Unqualified"
 trinity_events_nagisa.71.desc: "£white_dot NO.1 Seia Yurizono:\nPositive aspects: Possesses excellent wisdom, firm faith, and reputation and recognition as the former head of the Sanctus faction. Judged to have the proper dignity of a leader of Trinity.\nNegative aspects: If there is PTSD from the assassination attempt, judged that it might be difficult for her to stand directly before the public. However, not a major problem.\nOverall evaluation: Qualified\n\n£white_dot NO.2 Hanako Urawa:\nPositive aspects: Possesses excellent intelligence and judgment.\nNegative aspects: Uses that excellent intelligence and judgment for her impulsive actions. If put forward as a puppet leader, there is a risk she might act while ignoring the management of the Sisterhood.\nOverall evaluation: Unqualified\n\n£white_dot NO.3 Hina Sorasaki:\nPositive aspects: Has a reputation, and rich experience in protocol work during her time as Prefect. Since she left her political support base in Gehenna, she is easy for the Sisterhood to manage as a puppet.\nNegative aspects: Served in an administrative post in the Tea Party, but the career is short and inappropriate in terms of seniority. Since converting to the Trinity faith, she has never paid tithes and continuously absented herself from religious events including mass, analyzed as having quite poor religious zeal.\nOverall evaluation: Unqualified\n\n£white_dot NO.4 Hifumi Ajitani:\nPositive aspects: Since she is Nagisa's friend, it's easy to form public opinion that 'Host Nagisa voluntarily handed over the position' after handing over power.\nNegative aspects: When met and talked with directly, she very much desires a life as an 'ordinary girl.' Judged that if she acquired power, she would suffer enough stress to be unbearable even if it were a puppet position with no authority.\nOverall evaluation: Unqualified\n\n£white_dot NO.4 Mine Aomori:\nPositive aspects: Will be supported within the Tea Party due to her noble conviction regarding relief. A legitimate candidate since she is the head of the 'Johannes faction.'\nNegative aspects: If she finds out she was put forward as a puppet Host, she will never follow the Sisterhood.\nOverall evaluation: Unqualified\n\n£white_dot Conclusion: Support Seia Yurizono as the next Host."
 trinity_events_nagisa.71.a: "The document was classified as Sisterhood secret."
 trinity_events_nagisa_71_a_tt: "§gIf the Sisterhood seizes power, Seia Yurizono will become the puppet Host.§!"
 trinity_events_nagisa.72.t: "The Longest Tea Party"
 trinity_events_nagisa.72.desc: "Nagisa and Sakurako's tea parties often continued like an annual event. But something had changed recently. Nagisa started calling Sakurako only 'Mother Superior.' The reason was easily known. That symptom of forgetting everyone except Filius now made her forget even the head of the Sisterhood, who was her political partner. Sakurako wore a bitter smile and lifted her teacup.\n\nNagisa only forgets those she doesn't think are 'on my side.' The Sisterhood was different from Filius. But she didn't want to reproach her. Had Sakurako herself not distrusted Nagisa and prepared a coup behind her back? So forgetting Sakurako might also be a natural consequence. Sakurako loathed this situation they both were in, not Nagisa herself.\n\n\"Many people say I've become strange due to stress. But... Mother Superior. I am striving to keep the principle of 'believing in others' even in this extreme stress. How much effort have I put in for Filius until now, and how much work have I done to protect my people.\"\n\"...I understand.\"\n\"If you truly understand, Mother Superior. Tell me. I am moving in the right direction now, right? I am... doing a good job, right?\"\n\nSakurako looked Nagisa straight in the eyes. She forgot what kind of person Sakurako was, everything except the 'Mother Superior' title. Even so, she was craving a tender word from Sakurako, a kind 'You did the right thing.' She protected her beloved Filius from oblivion, but did Filius also protect Nagisa? Sakurako silently watched those thin fingertips of Nagisa's anxiously fiddling with the teacup.\n\nIf it were anyone else, there was no story Sakurako could tell Nagisa."
 trinity_events_nagisa.72.a: "\"History will judge the right and wrong of the Host.\""
 trinity_events_nagisa_72_non_coup_tt: "§gSakurako gave up on executing the coup. Now that public opinion supports Host Nagisa, it would have failed even if attempted.§!"
 trinity_events_nagisa_72_coup_tt: "§gAfter the tea party, Sakurako ordered the execution of the coup.§!"
 trinity_events_nagisa.73.t: "I Loved Everyone"
 trinity_events_nagisa.73.desc: "\"Seia-san, I have continued to keep the 'believing in others' business you taught me before you were sniped for several years. I followed Hifumi-san's advice, had meetings with the Filius faction almost every day and listened to their opinions, and sought to do all actions and words for Filius, not for my personal glory. I repaid those who believed in me with love. I gave my people noble titles, gave unlimited speaking opportunities in faction meetings, and even gave those from Gehenna who came to Filius like Ako-san and her group titles equal to those from Trinity.\"\n\n\"Like a compass that never stops pointing north no matter the turmoil, I have lived a life solely accepting the love and tolerance that is Seia-san's teaching. Was that life wrong? Striving to believe in others, believing them, and how much love did I bestow. Yet, the opposition, the disgusting remnants of Pater still criticize me, and my agents deliver rumors that the public criticizes me as a dictator. Why did I love them, but they...\"\n\n\"Stop it. Stop, please stop.\"\n\nSeia raised her hand to block Nagisa's endless despairing words. Seia also knew that Nagisa had been trying. Nagisa's effort to believe in 'Filius,' and the love she showed 'Filius,' all of it. But Seia knew that very effort was twisted. Seia took a step closer to Nagisa. Although Seia was of a small stature, at this moment she seemed to have a height equal to the Host.\n\n\"Nagisa, the believing in others I spoke of was merely a 'means' for you to restore relationships with those around you. But, isn't it strange? Why on earth. Since when did that means become an end? You say you believed in others and lived for others... but hasn't your most precious friend been erased from that 'others'?\"\n\"...Wh-What do you mean by that? I am like this with my friend Seia-san...\"\n\"Stop it! Nagisa, you have already... even your childhood friend £GFX_blank_texticon_small_2!! Have you not forgotten that name, that very existence!\""
 trinity_events_nagisa.73.a: "£GFX_blank_texticon_large_1 £GFX_blank_texticon_1 £GFX_blank_texticon_small_1"
 trinity_events_nagisa_73_a_tt: "§gNagisa tried to recall something from that name. Truly, truly tried.\n\nBut she could recall nothing.§!"
 trinity_events_nagisa.74.t: "Why I Was Not Loved"
 trinity_events_nagisa.74.desc: "The Sisterhood staged a coup. The Tea Party was occupied. All escape routes must have been blocked. Seia's running while holding Nagisa's hand meaninglessly in such a situation was just a meaningless stall for time for a friend. Nagisa continued to speak while running.\n\n\"Seia-san, I have continued to keep the 'believing in others' business you taught me before you were sniped for several years. I followed Hifumi-san's advice, had meetings with the Filius faction almost every day and listened to their opinions, and sought to do all actions and words for Filius, not for my personal glory. I repaid those who believed in me with love. I gave my people noble titles, gave unlimited speaking opportunities in faction meetings, and even gave those from Gehenna who came to Filius like Ako-san and her group titles equal to those from Trinity.\"\n\n\"Like a compass that never stops pointing north no matter the turmoil, I have lived a life solely accepting the love and tolerance that is Seia-san's teaching. Was that life wrong? Striving to believe in others, believing them, and how much love did I bestow. Yet, the opposition, the disgusting remnants of Pater still criticize me, and my agents deliver rumors that the public criticizes me as a dictator. Why did I love them, but they...\"\n\n\"Stop it. Stop, please stop.\"\n\nSeia stopped running and turned back. Nagisa was weeping. She was weeping with a sense of despair that all her efforts had achieved nothing. Seia also knew that Nagisa had been trying. Nagisa's effort to believe in 'Filius,' and the love she showed 'Filius,' all of it. But Seia knew that very effort was twisted. Seia said in a sorrowful voice:\n\n\"Nagisa, the believing in others I spoke of was merely a 'means' for you to restore relationships with those around you. But, isn't it strange? Why on earth. Since when did that means become an end? You say you believed in others and lived for others... but hasn't your most precious friend been erased from that 'others'?\"\n\"...Wh-What do you mean by that? I am like this with my friend Seia-san...\"\n\"Stop it! Nagisa-san, you have already... even your childhood friend £GFX_blank_texticon_small_2!! Have you not forgotten that name, that very existence!\""
 trinity_events_nagisa.74.a: "£GFX_blank_texticon_large_1 £GFX_blank_texticon_1 £GFX_blank_texticon_small_1"
 trinity_events_nagisa.75.t: "A Television with the Plug Pulled"
 trinity_events_nagisa.75.desc: "\"Hifumi-san, yes. Please sit there comfortably. I thought I strived to live a right life. But Seia-san said so. That I lived while forgetting even the existence of my precious friend, taking the means as the end. But isn't it strange? Hifumi-san, me, Seia-san... the memory of the three of us always having tea parties in the same place also remains. The memory of us sitting facing each other in the three chairs of the tea room and sharing talk.\"\n\n\"Am I really crazy? Is Seia-san right, and am I wrong? ...If so, who is the one I forgot? Seia-san seems to be saying that name to me every day. I even asked the names of my friends to many officials of the Tea Party. But, the memory... I don't remember.\"\n\n\"If there really were a 'friend' I forgot! While running around the Tea Party building like a crazy person, shouldn't they have appeared before me even once? But why does the purpose I forgot not appear before me directly, lifting the veil called means? Please tell me, Hifumi-san... I ask not as the Host of Trinity, but merely as your powerless friend. Please... who I am forgetting... if a person I'm forgetting really exists... please tell me...\""
 trinity_events_nagisa.75.a: "Hifumi could only hug her as she wailed."
 trinity_events_nagisa_75_a_tt: "§gBecause she knew that no matter how many times she said that forgotten name, she could not remember it.\n\nThank you for playing all the stories prepared for the Trinity General School. It could not have been achieved without everyone who played the game.§!"
 trinity_events_nagisa.76.t: "Strong New Game"
 trinity_events_nagisa.76.desc: "Seia was confined in Eden to be used as a puppet Host, and Nagisa was transferred to the prison where she had imprisoned the political prisoners of the Pater faction in the past. Since she heard she would receive a life sentence, she will probably spend a very long time here. Who could she blame? All this is just Nagisa's own fault for not striving properly.\n\n\"...Nagi-chan?\"\n\nWhat broke the endlessly following thoughts was an unfamiliar, but strangely familiar voice Nagisa didn't know. Nagisa looked back at the cell across from her solitary cell. The head of the Pater faction. £GFX_blank_texticon_1 £GFX_blank_texticon_4 was looking at her while sobbing. She didn't understand. She was the one who gave her a life sentence and threw her into this cold prison, why was a rival of another faction she never met before.\n\n\"...Please call me Kirifuji-san. What's with 'Nagi-chan.' Between you and me.\"\n\"Between you and me... Ah, yeah. Sorry. Right. Nagi-chan, no. Kirifuji-san, you don't remember me, right?\"\n\"I remember. You were the head of the Pater faction.\" \"Besides that, my name.\"\n\nNagisa tried to call her name. It didn't occur to her. While stupidly staring at the ceiling, she barely said \"...Taro Tanaka?\", and a laugh burst out saying 'Not even one letter was right.' Laughing while crying, she's a truly incomprehensible person.\n\n\"Hey Nagi... Kirifuji-san. From now on, we'll spend a really, really long time together here, right?\"\n\"Are we both not life sentences. Considering the average lifespan, we'll live like this for about 50 years.\"\n\"If so! How about becoming friends? Since we have to see each other's faces every day anyway. Step by step. ...Making our story together again from the beginning.\"\n\nA long silence followed. Perhaps her words were right. The two will spend a truly long time together here. Nagisa eventually sighed and sat on the chair.\n\n\"Fine. Then let's exchange names first. I am Nagisa. Nagisa Kirifuji.\""
 trinity_events_nagisa.76.a: "\"I, my name is...\""
 trinity_events_nagisa_76_a_tt: "§gEven if we go around a slightly long way, we might be able to reach the same destination again.\n\nThank you for playing all the stories prepared for the Trinity General School. It could not have been achieved without everyone who played the game.§!"
 trinity_events_nagisa.77.t: "An Ordinary Day at Work"
 trinity_events_nagisa.77.desc: "\"Nagisa-sama, please confirm this document.\" \"...Yes. Leave it there.\"\n\nNagisa continued to flip through the documents that followed endlessly. Nagisa thought she was doing quite well despite suffering through endless hardships. The words Seia had left like a prophecy, the promise to believe in the people around her, was still being kept. The long-standing conflict with Gehenna also ended by her hand.\n\nHowever, Nagisa was still feeling anxiety. Is the current Nagisa Kirifuji walking the right path? That is, is she truly striving to protect and believe in her people? Nagisa's precious people are like glasswork. Entities that break easily and scatter like broken glass shards. Didn't Seia also disappear so vainly like that.\n\n\"...Ah.\"\n\nNagisa pulled a document. Report on the movements of dangerous persons in the Social Democratic Party of Germany. Domestic counter-intelligence duty documents of agents she had seen countless times. But, today something was different.\n\n£GFX_blank_texticon_3 £GFX_blank_texticon_1 of the Social Democratic Party\n£GFX_blank_texticon_2 £GFX_blank_texticon_4 of the Centre Party\n\nWhy, how come, their names, their faces, don't I remember them?\n\nThey were clearly names she had seen countless times in documents. But for some reason, the name of £GFX_blank_texticon_5, those rivals, they wouldn't come to mind as if carved out of memory."
 trinity_events_nagisa.77.a: "...What is happening?"
 trinity_events_nagisa.78.t: "A Not-So-Ordinary Day"
 trinity_events_nagisa.78.desc: "\"This is a typical mental problem caused by psychological stress.\"\n\nSomeone called £GFX_blank_texticon_small_1, an urban doctor of the Remedial Knights, politely turned the medical chart. Nagisa listened to the doctor's explanation while biting and releasing her lower lip several times. She tried to suppress her paranoia. To believe in others, and protect precious people. But 'believing in others' and 'protecting my precious people' conflicted. What if she believed someone who could become her enemy? What if due to a wrong choice, precious people, for example someone like Hifumi, were sacrificed? ...Nagisa Kirifuji's reason said that wasn't a simple paranoia. You know what happened to Seia, don't you.\n\nSo Nagisa's heart and soul began to twist. To continue to be able to believe in others, she began to erase 'people she cannot believe' from her heart one by one. A person Nagisa cannot believe is merely an object, not a human. That is, a being that can be forgotten. Don't recognize them even if you are looking at them, and erase their very existence from memory.\n\n\"...A defense mechanism, I see. I understand. Due to the stress I received myself... ...Doctor. Will the range of this 'other I cannot believe' become larger in the future?\"\n\nTo Nagisa's voice full of anxiety, the doctor answered calmly."
 trinity_events_nagisa.78.a: "\"We must observe further.\""
 trinity_events_nagisa.79.t: "Diary"
 trinity_events_nagisa.79.desc: "Nagisa opened her diary. Inside the diary, Polaroid photos of dozens of people were listed, paired with names and simple personal information written next to the photos. Through analysis over the last few weeks, Nagisa confirmed what the commonality was of those she was 'forgetting.' 'Everyone except the Filius faction and the Justice Task Force loyal to Nagisa.' ...It was a troublesome matter. Putting aside the social life problems, if she forgets everyone outside Filius, Host duties become immediately difficult. She began memorizing while covering the names of the diary with her finger and looking only at the photos next to the name tags.\n\nLeader of the Communist Party of Germany. I don't remember. Nagisa removed her index finger and read the name. Ernst Thälmann. Next, Mother Superior of the Sisterhood. Who was it again? Right. Sakurako Utazumi. I haven't forgotten yet. Grand Duke of Luxembourg. Was it Mussolini? No, Rikuhachima...\n\nShe re-memorized the names and photos of politicians she hadn't forgotten yet, or had already forgotten. And her index finger tip stopped in the middle.\n\nHer own friend list. Seia Yurizono of the Sanctus faction, and.\n\nIf her defense mechanism erases everything outside Filius.\n\nWill the day come when she can no longer even remember who £GFX_blank_texticon_small_2 was?"
 trinity_events_nagisa.79.a: "That will never happen. Surely."
 trinity_events_nagisa.80.t: "A Small and Precious Fortress"
 trinity_events_nagisa.80.desc: "As her memory became narrow, Nagisa became increasingly obsessed with the meetings of the Filius faction. The Tea Party meeting room where all windows were covered with curtains was narrow and gloomy but at the same time exuded a comfortable atmosphere. And if she comes here, she can meet her closest friend, Hifumi. Hifumi always sat in the seat closest to the Host's right. It's a round table with no separate seat of honor, but Nagisa always thought 'The seat where I can sit next to Hifumi-san is the seat of honor.'\n\n\"Next report. Although the £GFX_blank_texticon_small_1 side of the Sanctus faction and the £GFX_blank_texticon_small_3 side of the Pater faction had a meeting, it seems to have been a non-political meeting. Regarding this, we...\"\n\nWhile the boring report of the administrator continued, Nagisa looked at the window seat where the thick curtains were. Some say she is becoming isolated. But as long as the most precious ones of Filius and her precious friend Hifumi Ajitani were there, Nagisa thought she still had hope."
 trinity_events_nagisa.80.a: "How could a tree with a support fall in a strong wind?"
 trinity_events_nagisa.81.t: "Lord Protector"
 trinity_events_nagisa.81.desc.generic: "Nagisa closed her diary, which had become tattered because she had looked at it hundreds of times now. Lately, the speed of forgetting was increasing more than the speed of re-memorizing forgotten politicians. She didn't think 'Nagisa Kirifuji's defense mechanism' would be this strong. Perhaps she could give up on 'trying to remember' now. 'I must protect precious people' and 'I believe in my precious people to the last.' Nagisa could do anything for that. She drove out the darkness of the paranoiac, and she had a precious friend named Hifumi.\n\nNagisa tried to throw the tattered diary into the trash can. There was no need to forcibly break her defense mechanism. It wasn't that dementia had come, or there was a problem with thinking. It was just that she was easily erasing people hard to believe from her head. Conversely, it might be a good thing. Once this Lord Protector bill is passed, the time might come when she has to make harsh choices for Filius. At such a time, not being able to remember might rather help with the decision.\n\nBut why?\n\nNagisa could not throw away the diary. As if something that must not be thrown away remained inside."
 trinity_events_nagisa.81.desc.seia: "Nagisa closed her diary, which had become tattered because she had looked at it hundreds of times now. Lately, the speed of forgetting was increasing more than the speed of re-memorizing forgotten politicians. She didn't think 'Nagisa Kirifuji's defense mechanism' would be this strong. Perhaps she could give up on 'trying to remember' now. 'I must protect precious people' and 'I believe in my precious people to the last.' Nagisa could do anything for that. She drove out the darkness of the paranoiac, and she had precious friends named Hifumi and Seia.\n\nNagisa tried to throw the tattered diary into the trash can. There was no need to forcibly break her defense mechanism. It wasn't that dementia had come, or there was a problem with thinking. It was just that she was easily erasing people hard to believe from her head. Conversely, it might be a good thing. Once this Lord Protector bill is passed, the time might come when she has to make harsh choices for Filius. At such a time, not being able to remember might rather help with the decision.\n\nBut why?\n\nNagisa could not throw away the diary. As if something that must not be thrown away remained inside."
 trinity_events_nagisa.81.a: "Something she must not forget"
 trinity_events_nagisa.82.t: "Make-Up Work Counseling Department"
 trinity_events_nagisa.82.desc.generic: "To [ROOT.GetLeader], I am Mine Aomori, Leader of the Remedial Knights.\n\nI will speak straight to the point.\n\nI do not agree with the so-called 'punishment unit' plan that gained the consent of the Tea Party, and I do not agree with the government's official judgment that this is an 'educational institution' for rehabilitating criminals.\n\nAs the respected [ROOT.GetLeader] would understand, even if the government knows that military service is not actually a sacred duty, it is an organization that must at least pretend it is sacred. Because only if we believe so ourselves can the general public serving in the military trust the military and have a sense of mission.\n\nBut the moment the military becomes a 'means of punishment' for whatever reason, the citizens will think this: Our government thinks people going to the army are 'going to receive punishment.' ...How can soldiers who 'came to receive punishment' have a sense of mission in the military when it has become a place to receive punishment?\n\nI know that a bill already passed cannot be withdrawn. But please allow this regulation to remain a dead letter. That is a relief for Trinity, a relief for our spirit, and a relief for the military."
 trinity_events_nagisa.82.desc.nagisa: "To [ROOT.GetLeader], I am £GFX_blank_texticon_2 £GFX_blank_texticon_4, Leader of the Remedial Knights.\n\nI will speak straight to the point.\n\nI do not agree with the so-called 'punishment unit' plan that gained the consent of the Tea Party, and I do not agree with the government's official judgment that this is an 'educational institution' for rehabilitating criminals.\n\nAs the respected [ROOT.GetLeader] would understand, even if the government knows that military service is not actually a sacred duty, it is an organization that must at least pretend it is sacred. Because only if we believe so ourselves can the general public serving in the military trust the military and have a sense of mission.\n\nBut the moment the military becomes a 'means of punishment' for whatever reason, the citizens will think this: Our government thinks people going to the army are 'going to receive punishment.' ...How can soldiers who 'came to receive punishment' have a sense of mission in the military when it has become a place to receive punishment?\n\nI know that a bill already passed cannot be withdrawn. But please allow this regulation to remain a dead letter. That is a relief for Trinity, a relief for our spirit, and a relief for the military."
 trinity_events_nagisa.82.a: "Please do remember."
 trinity_events_nagisa.83.t: "Distribution of Noble Titles"
 trinity_events_nagisa.83.desc: "To maintain the noble traditions of Trinity, we intend to grant titles to important figures on the [ROOT.GetNameDef] side and make those titles permanently hereditary. According to the consent of [ROOT.GetLeader], the granting of titles will proceed under the following criteria.\n\n£white_dot Status:\nNoble status uses titles from the German Empire era. Granted titles are honorary, and no actual fiefdom or privileges are bestowed.\n\n£white_dot Duchy:\nThose holding the highest rank in each body are granted a Duchy. The Mother Superior of the Sisterhood, the President of the Justice Task Force, and heads of other organizations specially designated by the Host.\n\n£white_dot Marquess and Earldom: To key figures of important organizations of Trinity who do not reach the level of a head, titles from Marquess to Earldom are granted according to their position.\n\n£white_dot Knighthood: Among military officers of rank major or higher who have specially contributed to Trinity, those who receive special recommendations are granted Knighthood."
 trinity_events_nagisa.83.a: "Signature."
 trinity_events_nagisa.84.t: "Sharing Medical Records"
 trinity_events_nagisa.84.desc: "Mine reviewed Nagisa's medical records that came from the Remedial Knights. The Host was gradually collapsing like a sandcastle hit by waves crumbling from the outside. That belief of believing in others exhausted Nagisa endlessly. And in the contradiction of 'I want to doubt others, but I must believe in others,' Nagisa found the only solution her spirit could endure.\n\nEntities she can believe in. Forgetting everyone except the Filius faction and erasing everyone else one by one from memory. With that, Nagisa's comfortable paradise where she can 'safely believe in everyone' is completed.\n\n\"Were you driven that far. Truly...\"\n\nMine let out a deep sigh and lightly pressed her temple. She had a headache. It was even more regrettable that this wasn't an act of malice, but just a self-defensive action to protect herself. That that Host, Nagisa Kirifuji who stood firmly like hard steel before others, was actually carved away this much."
 trinity_events_nagisa.84.a: "It is a tragedy."
 trinity_events_nagisa.85.t: "Something I Shouldn't Forget"
 trinity_events_nagisa.85.desc: "Nagisa was sitting in her office chair, writing complex plans to re-investigate all criminal acts committed by the Pater faction after the Great Transference. Now that her control over the Tea Party was high and the Justice Task Force was completely loyal to Nagisa, it wasn't impossible to eliminate Pater through completely legal means. To protect her precious Filius faction, Pater deserved to disappear.\n\nThe strange thing was that she had exercised endless patience toward Pater until now. Why on earth? Because of her own teaching to love others? Really? Could there have been another reason?\n\nSay, a certain girl who used to call her 'Nagi-chan.'\n\n\"...Ah.\"\n\nNagisa dropped her pen. The secretary looked back at Nagisa with a puzzled expression. Could something be wrong. Before the secretary's worried word could begin, Nagisa raised her hand to restrain her as if she were fine. Nagisa was fine. Truly, she was healthier than ever. She just... recalled something. It's probably a keyword related to her 'amnesia.'\n\n\"Nagi-chan.\"\nThe secretary wore a flustered expression. \"...Pardon?\"\n\"It seems there was a person who used to call me by that name, do you happen to remember?\"\n\nThe secretary wore a deeply flustered expression and said, \"As for me, I know nothing of it.\"\n\nHost of Trinity. Head of the Filius faction. And a despotic leader who acquired absolute power. There is a person who can call her by such an informal title like '-chan'? It was an absurd story. Even that Hifumi Ajitani's title for Nagisa was always 'Nagisa-sama.'\n\nBut strangely, the name Nagi-chan kept lingering on the tip of her tongue. Someone, truly someone seemed to have called her that. But who? Seia? To her, Nagisa was always Nagisa. How about the outspoken Gehenna Prefect? No, Hina and she don't have that degree of private friendship. Someone other than that? Leader of the Remedial Knights? No. Mother Superior? Surely not.\n\nBut then, who?"
 trinity_events_nagisa.85.a: "Right, that person. My, £GFX_blank_texticon_small_3 "
 trinity_events_nagisa_85_a_tt: "§gNagisa forgot who she recalled.§!"
 trinity_events_nagisa.86.t: "This Order Must Go to the Shredder"
 trinity_events_nagisa.86.desc: "Tsurugi is not exactly a social person. Especially so in work that involves dealing with people. The 'political' work of the Justice Task Force was usually Hasumi Hanekawa's lot. Even if that was dealing with Inspector Ako, the Tea Party official Hasumi hated most. Hasumi entered Ako's office on the left side of the Tea Party building with a business-like expression.\n\n\"Inspector. I'll ask straight to the point. What on earth is this order?\"\n\"...Did you go too straight to the point? Even the orders I process in a day are...\"\n\"Is there more than one kind of inspection order that the Inspector sends down to the Justice Task Force? Investigation into illegal acts within the Tea Party. ...Especially the investigation into the Pater faction.\"\n\nHasumi set down the 'Pater faction targeted investigation' list she took out from her briefcase on Ako's desk. Only then did Ako check the document Hasumi brought and said as if it were no big deal:\n\n\"It's not a difficult story, is it? The Pater faction sympathized with criminal acts against unarmed civilians immediately after the Great Transference, but because the punishment level was too low, this time through a re-investigation they'll finally receive proper punishment...\"\n\"That is the problem. To begin with, hasn't it all ended! Furthermore, even the head of Pater...!\"\n\nHasumi's voice became louder, so Ako momentarily shut her mouth. Today's Hasumi didn't just come to be annoyed at Ako. Hasumi was angry at the 'political' intent of this order. Punishing again those who have already been punished. And including even the Pater faction politicians who were not involved in attacking civilians immediately after the Great Transference in the punishment target.\n\nOf course, there were many other 'charges' in the documents to punish them, including sabotage against the Eden Treaty. But it was identical that they were bringing up late what was already a finished matter from the past. The Justice Task Force is an organization loyal to the Host, but it wasn't an organization to become a pawn in a political fight.\n\nAko's expression relaxed a bit. \"I'm sorry. But it's a decision the Host personally made. I am just a middle-level bureaucrat delivering a plan already fully made.\"\n\"...Even though the Host's friend is included in the punishment target?\"\n\"If a friend were included, Nagisa-san wouldn't have gone this far either. I agree. I agree but... you know.\""
 trinity_events_nagisa.86.a: "That £GFX_blank_texticon_small_3 is no longer in Nagisa-san's memory."
 trinity_events_nagisa.87.t: "Reconciliation"
 trinity_events_nagisa.87.desc: "It's Ako. Yes. Hasumi-san. That Inspector Ako you hate so much.\n\nBecause the Justice Task Force cooperated, the arrest operation went damn well. First, thanks for the cooperation.\n\nAlso, I'm sorry. For being curt, being annoyed, and doing all that when Hasumi-san came last time. To be frank, the one who was most irritable was probably you, not me.\n\n...It's a sincere apology. Don't hang up.\n\nYes. I haven't gone crazy. I just... was watching the arrest operation from the side, and I cried a bit hearing £GFX_blank_texticon_small_3-san shouting just once to let her meet Nagisa-san. If Hina-san, if Hina were to forget that a human like me exists on this Earth... thinking that, I felt disillusionment with myself for participating in this tragedy.\n\nI ended up being angry for a reason a bit different from Hasumi-san. Since I don't really care how the Justice Task Force is used politically.\nBut that 'feeling really bad' is similar for both me and you. We're even, right? Uhufu. Yes. You're laughing in front of me for the first time.\n\n...Yes. After work today, do you want to drink together? ...Huh? What kind of scheme would I have? This is just an offer to reconcile. It's an invitation both to apologize for being irritable without knowing Hasumi-san's thoughts. \n\nYes. Yes, yes. Then I'll call again in the evening. ...Puehung?! What did you say? Who in the world eats a parfait with alcohol?! ...Are you really crazy? Sigh. Yes. This was a reconciliation call. It's my fault. Yes. Then see you later."
 trinity_events_nagisa.87.a: "The call ended."
 trinity_events_nagisa.88.t: "Secret"
 trinity_events_nagisa.88.desc: "\"Our revolution is to save Trinity, not to destroy it.\"\n\nSakurako opened the chart. Talk about the Host's mental state was gradually leaking out. And those who hoped the Sisterhood, which would become a compass in Trinity's most difficult time, would become an 'alternative' were increasing. If enough collaborators within the Justice Task Force were secured now, driving out Host Nagisa wouldn't be an impossible task. However, Sakurako had no intention of becoming Trinity's 'next dictator.'\n\nThere were still many public supporters of Nagisa. It wasn't that the many achievements Nagisa had made for Trinity until now had disappeared either.\n\nWill she cross the Rubicon, or will she stop before it. Sakurako had not yet made up her mind."
 trinity_events_nagisa.88.a: "Surely she won't be able to decide even until the day she must make the decision."
 trinity_events_nagisa.89.t: "Oblivion"
 trinity_events_nagisa.89.desc: "Nagisa fully knew that her mental health was deteriorating. She knew it was due to stress and understood what kind of impairment it gave to her work. As much as she was realizing her limits, she believed she could overcome those limits through effort. But while facing a girl in a nun's habit she encountered in the hallway, Nagisa felt a supreme sense of despair.\n\nNagisa was not a person of poor intelligence. Despite the memory impairment, she could still identify a person through the uniform they were wearing. A pure nun's habit, a neat-looking impression, all proved that she standing before Nagisa belonged to the Sisterhood. And the pointy animal ears protruding above the veil. Yes. Surely there was a person with such a name among the high-ranking officials of the Sisterhood.\n\nBut she could not recall at all what 'rank' that person held. Was she the Mother Superior? The Mother Superior's secretary? Nagisa knew that she 'had been' capable. Thus, that she, such a person, forgot the face and name of the Mother Superior whom she as a Trinity politician would naturally know. Despair at not being able to decide by what name to call this fox-eared girl. A despair like what a person who used to walk freely would feel when first sitting in a wheelchair and looking up at the stairs, of having something she naturally should have taken away.\n\n\"...Nagisa-sama?\"\n\"It is nothing. So, we were supposed to meet today due to a friendly exchange with the Sisterhood. Your name was...\""
 trinity_events_nagisa.89.a: "\"You were Mother Superior £GFX_blank_texticon_1 £GFX_blank_texticon_small_1-sama.\""
 trinity_events_nagisa.89.b: "\"You were the secretary £GFX_blank_texticon_2 £GFX_blank_texticon_small_2-sama.\""
 trinity_events_nagisa.90.t: "Ruminating Memories"
 trinity_events_nagisa.90.desc: "During her time as the Gehenna Prefect, Hina Sorasaki was famous as a workaholic who worked forcibly out of a sense of duty. And now that she has laid down all those duties and entered the Tea Party, as if she has some compensation psychology, Hina has degenerated into an incompetent person who pushes all basic work she should do onto Ako and just hangs out at social parties with other high-ranking officials, or hangs onto video games lying on Ako's sofa. That was convenient for Nagisa. Because she could call her out to her garden under the pretext of 'reproving' Hina for the fact that 'there isn't even a single page of document processed directly for a month.'\n\n\"So, the content of that reproof is a card game?\"\n\nHina irritably flipped through a stack of dozens of cards Nagisa had handed over, one by one. They were ID photos of important Trinity figures with the name parts covered by stickers. Nagisa nodded slowly.\n\n\"You probably know that I am forgetting people outside the Filius faction. ...So, to 'recall' the people I am forgetting...\"\n\"You mean let's play a name-matching game. I can help with that much. Even without calling me out with such a weird excuse.\"\n\nHina set down a photo of a woman with orange-tinted hair holding a bundle of books in her arms from among the stack of cards.\n\n\"She's a friend seen in the Trinity Old Library. If you're the Nagisa who likes studying, you must have met her hundreds of times, right?\"\n\nNagisa took the photo in her hand. Surely, it was a face she had seen in the Old Library. Then she must be a librarian. No, not a librarian, could she be the Library Director? No, no. It was Hina Sorasaki, the steel Prefect (past tense), who chose the person. Is there no possibility that all this is a trap? She said she is seen in the Old Library, she never said she works there. She could be a member of the Vigilante Corps...\n\n\"Nagisa. So the answer?\""
 trinity_events_nagisa.90.a: "\"Is she not a famous member of the Vigilante Corps? She is £GFX_blank_texticon_3 £GFX_blank_texticon_small_1-sama, right?\""
 trinity_events_nagisa.90.b: "\"She is the Old Library librarian, £GFX_blank_texticon_1 £GFX_blank_texticon_small_3-sama.\""
 trinity_events_nagisa.91.t: "Isolation"
 trinity_events_nagisa.91.desc: "Nagisa blankly stared at the mirror. A despair as if she were left alone in this world, as if not a single ally remained for her. Nagisa stood tall in Trinity as a saint who 'believes everyone.' But why on earth is there no one who believes in Nagisa? She felt she was becoming increasingly isolated. No, she didn't just 'feel' it. Nagisa 'knew' that she was isolated.\n\nShe didn't want to go to work. she didn't want to see them showing her loyal and tender smiles. Not £GFX_blank_texticon_1 of the Sisterhood, nor £GFX_blank_texticon_2 of the Remedial Knights, and even that annoying £GFX_blank_texticon_small_3 of the Sanctus faction who argues in Tea Party meetings—she wanted to forget them all.\n\nIf only she could fold her wings, go into the cozy blankets of her bed, and fall asleep comfortably."
 trinity_events_nagisa.91.a: "But for the sake of her precious ones, Nagisa had to work."
 trinity_events_nagisa.91.b: "Nagisa turned off the lights and threw her body onto the bed."
 trinity_events_nagisa.92.t: "What I Can Believe"
 trinity_events_nagisa.92.desc: "Describe the scene where Nagisa contemplates what it is that she 'can believe in.'"
 trinity_events_nagisa.92.a: "No matter what happens, I believe in everyone."
 trinity_events_nagisa.92.b: "But, could I narrow the scope of 'everyone' a little bit."
 trinity_events_nagisa_path_democratic: "§gThis choice leads to unlocking Nagisa Kirifuji's democratic political focuses.§!"
 trinity_events_nagisa_path_neutrality: "§gThis choice leads to unlocking Nagisa Kirifuji's non-aligned political focuses.§!"
 
 # Nagisa BoP Events
 trinity_events_nagisa_faction.1.t: "Commemorating the Victory of Eden"
 trinity_events_nagisa_faction.1.desc: "Trinity has achieved a great success. Between the two rival powers of Gehenna and Trinity, it was the glorious Trinity led by Nagisa Kirifuji that lifted the trophy of glory. The important point was that it was a victory obtained by 'Nagisa's Trinity.' If Mika, Seia, or the Johannes faction or the Sisterhood had been in power, could they have achieved such a victory? Filius says in one voice: 'Absolutely impossible.' If so, there was a need to create a work of art that could commemorate this glorious victory, Nagisa's victory.\n\nTrinity is different from other schools. It had to be noble and more elegant than at any other time. Instead of a military parade or large-scale propaganda commemorating the victory, presenting a work of art for Nagisa alone would be the most wonderful trophy to commemorate the victory in Eden. The goal 'to create a work of art for Nagisa' was set. Then what should be created? The most conservative choice is pure literature. The proposal to create a literary work to praise Nagisa is popular even within Filius. And it can be spread to the intellectuals of Trinity. However, due to the low influence literature has on the public, the popular propaganda effect will be somewhat lower.\n\nAnother proposal is popular art. To create works of art praising Nagisa Kirifuji, expanding the scope to painting or genre literature. This might not fit well with Trinity's elegant tastes, but it will be much easier for our public to understand and can inform more people of Nagisa's greatness."
 trinity_events_nagisa_faction.1.a: "Commission a literary work."
 trinity_events_nagisa_faction.1.b: "Commission popular art."
 trinity_events_nagisa_faction_1_tt: "§gLiterary works have a high success probability but receive low positive effects, while popular art has a low success probability but receives high positive effects. Results can be checked after 120 days.§!"
 trinity_events_nagisa_faction.2.t: "Literary Success - The Saint's Footsteps"
 trinity_events_nagisa_faction.2.desc: "The war novel 'The Saint's Footsteps' submitted by a girl named Miyo Sakurai from Wildhunt Academy of the Arts will remain as our Trinity's greatest propaganda literature. 'The Saint's Footsteps' compares Nagisa Kirifuji to a 'saint' who infinitely sacrifices herself for Trinity, and Nagisa's opponents as 'vipers' who tempt Trinity. This novel, starting from immediately before the Great Transference, delivers the fact that Nagisa has devoted her life so dedicatedly for Trinity with an amazing level of appeal to readers. Based on excellent military knowledge, 'The Saint's Footsteps' described with considerable writing power how the Tea Party neutralizes external enemies under Nagisa's command.\n\nNagisa Kirifuji admitted that Miyo's evaluation of her is excessively high and that there are some historical errors in the description of Trinity. However, she praised the fact that this literature is so beautiful and expresses Nagisa herself elegantly. It was decided that this novel would soon be mass-produced to be read by the educated generation of Trinity. From now on, from the Tea Party inspectors to the newcomers of the Justice Task Force, everyone will read this book as required reading."
 trinity_events_nagisa_faction.2.a: "\"Truly beautiful.\""
 trinity_events_nagisa_faction.3.t: "Literary Failure - The Str0ngest Vampire Slayer Nagisa"
 trinity_events_nagisa_faction.3.desc: "The literature 'The Str0ngest Vampire Slayer Nagisa' submitted by a novelist named Shura Kuchiki was a complete disaster. It was to the extent that many related parties were censured for why Trinity made the decision to entrust a novel to such an outside writer. In fact, this novel presents a conspiracy theory that Nagisa Kirifuji is a vampire slayer and all school students of Pater, Gehenna, Red Winter, Hyakkiyako, Millennium, Shanhaijing, etc., are all vampires. The Great Transference was part of a 'str0ngest incantation' for the vampires to erase the sun, and the Tea Party was a vampire hunter organization with hundreds of years of history. And Nagisa, every night when the sun sets, exorcised vampires holding the righteous holy sword Blood-Soul-Hunter-Justice-Soul-Blade.\n\nNagisa laughed several times at the absurd content while reading the delivered book. \"This book is certainly interesting, but I don't want it read by the public.\" Nagisa decided to keep only a single copy of that book in her private library instead of spreading it for propaganda. It might be the right choice. Surely, it was content that would cause diplomatic disputes with schools in all of Kivotos."
 trinity_events_nagisa_faction.3.a: "\"But why did she write strongest as 'str0ngest'?\""
 trinity_events_nagisa_faction.4.t: "Popular Art Success - A Game from Millennium"
 trinity_events_nagisa_faction.4.desc: "The mobile game 'Holy Knight Nagisa' commissioned from a game director named UZQUEEN from Millennium is a simple retro RPG game, but that simplicity fascinated the public. The content of the game is surprisingly simple. The holy knight Nagisa grows while coolly cutting down Trinity's enemies one by one. This game focuses only on the content that Nagisa protects Trinity by defeating villains, rather than delivering a complex and deep story. Due to pursuing a retro game style, the controls are also somewhat uncomfortable, and some sections of the game receive evaluations that they are unfairly difficult. Nevertheless, 'Holy Knight Nagisa' achieved popular success, receiving favorable reviews as \"a game that sets users' challenging spirit on fire.\"\n\nNagisa Kirifuji herself also left a positive review of the game while playing it, saying, \"It's interesting that it's about me defeating the enemies of Trinity.\" The game was distributed for free on the internet led by the Tea Party, and the fact that it is a very simple low-spec game compatible with any existing electronic device was used as a promotional phrase. This game will be of great help in improving Nagisa's image among the public."
 trinity_events_nagisa_faction.4.a: "\"100KG Great Demon King...? Who on earth is this person?\""
 trinity_events_nagisa_faction.5.t: "Popular Art Failure - The Never-Losing Host Nagisa"
 trinity_events_nagisa_faction.5.desc: "The manga 'The Never-Losing Host Nagisa vs The Weakling Gehenna' produced by Meruri, the most famous manga artist of Red Winter Federal Academy, through a commission from Trinity, will probably become the most shocking manga in Trinity history. Meruri discovered an amazing secret hidden in the victory Nagisa Kirifuji obtained against Gehenna. That is, the sadist queen Nagisa did something intense... night-like... anyway, that something with Chairwoman Makoto and Prefect Hina to annex Gehenna. This manga describes how Nagisa 'conquered' Gehenna in the bedroom across 56 pages of full-color drawings.\n\nNagisa, who received Meruri's work without knowing the content, fainted while reading the manga in the Tea Party meeting room. Late-responding Sisterhood nuns sprayed holy water on the manga book and performed an exorcism, and Mother Superior Sakurako personally put that cursed book in a safe and sealed it so no one could see it. The original manuscript of this manga will be kept in the deepest part of the Trinity Old Library, and the day will never come again when anyone allows sunlight to this Satanic grimoire."
 trinity_events_nagisa_faction.5.a: "\"...How could I, holding such a whip...\""

 # Nagisa Diplomacy Events
 trinity_events_nagisa_diplomacy.1.t: "[TRM.GetAdjective]-[GEH.GetAdjective] Negotiations"
 trinity_events_nagisa_diplomacy.1.desc: "The joint security organization negotiation was just the beginning. The [TRM.GetLeader] side formally proposed a 're-negotiation of the Eden Treaty' to the [GEH.GetLeader] side. This refers to a negotiation for a non-aggression pact and mutual guarantee of independence between the [TRM.GetNameDef] government and the [GEH.GetNameDef] government. If we agree to this, working-level meetings will follow to review the details of the negotiation."
 trinity_events_nagisa_diplomacy.1.a: "Let's begin the negotiations."
 trinity_events_nagisa_diplomacy.1.b: "No, I cannot guess Nagisa's intentions..."
 trinity_events_nagisa_diplomacy.2.t: "[TRM.GetAdjective]-[GEH.GetAdjective] Negotiations"
 trinity_events_nagisa_diplomacy.2.desc: "As the [GEH.GetLeader] side accepted our negotiation proposal, working-level negotiations to conclude the Eden Treaty have begun. The Pandemonium Society and the Pater faction will do everything in their power to obstruct these negotiations. We must never back down. Only [ROOT.GetLeader] can now protect the peace between the two schools, Trinity and Gehenna."
 trinity_events_nagisa_diplomacy.2.a: "Let's begin the negotiations."
 trinity_events_nagisa_diplomacy.3.t: "[TRM.GetAdjective]-[GEH.GetAdjective] Negotiations"
 trinity_events_nagisa_diplomacy.3.desc: "The [ROOT.GetName] Information Bureau has detected movement between Trinity and the Gehenna Prefect Team to re-promote the Eden Treaty. Working-level officials have already begun negotiations and are organizing detailed clauses for mutual independence guarantees and a non-aggression pact between the two schools.\n\nIf the Eden Treaty is truly concluded, we must fight against the combined power of Trinity and the Prefect Team. That is nothing short of a disaster for our security. We must use our agents to stop this negotiation at any cost. Definitely!"
 trinity_events_nagisa_diplomacy.3.a: "I'll show you how the story of the Garden of Eden ends."
 trinity_events_nagisa_diplomacy.4.t: "Eden Treaty Failed"
 trinity_events_nagisa_diplomacy.4.desc: "Who was the culprit? It could be the work of the Pater faction. Perhaps it was a disturbance caused by Pandemonium Society agents. Our negotiations were strangely sluggish. False news slandering each other continued to spread while traveling between the two schools, and the general public of Gehenna and Trinity continued to hold protests obstructing the peace treaty between the two schools.\n\nEventually, the Eden Treaty was officially suspended through a record-breaking incident where a homemade bomb exploded at the negotiation site. The upper echelons of Trinity and the Gehenna Prefect Team knew that the perpetrators of the terror were not each other, so they comforted each other after the terror. However, it was impossible to resume the negotiations that were suspended due to this terror.\n\nSomeday the day might come when the two schools join hands again for peace. But it doesn't seem to be today."
 trinity_events_nagisa_diplomacy.4.a: "Despairing..." # 4~5 Trinity/Prefect Team
 trinity_events_nagisa_diplomacy.6.a: "It's a very wonderful day, is it not?" # 6 Pandemonium Society
 trinity_events_nagisa_diplomacy.7.t: "[GEH.GetName]'s Rejection of Negotiation"
 trinity_events_nagisa_diplomacy.7.desc: "What kind of problem was there in the friendship between [GEH.GetLeader] and us? Surprisingly and shockingly, the [GEH.GetLeader] side rejected extending the Eden Treaty beyond sharing the police security organization. Since this treaty was formed by the friendship and goodwill of the two school leaders, with that goodwill broken, no method exists to resume negotiations now."
 trinity_events_nagisa_diplomacy.7.a: "This is multiplayer, right? AI Hina never presses this choice."
 trinity_events_nagisa_diplomacy.8.t: "Eden Treaty Success"
 trinity_events_nagisa_diplomacy.8.desc: "Today is the best day for both the [GEH.GetName] and [TRM.GetName] sides. The Eden Treaty left by the General Student Council President has come to fruition, and as it was officially signed by the two leaders, the two schools decided to establish a permanent peace and a common front against the [GEM.GetName] side. Despite the long-standing rivalry between the Gehenna and Trinity schools, the rational leaders of both schools seem to have found the best way to reduce their differences.\n\nOf course, this news will be despairing news for the [GEM.GetLeader] side. The [GEM.GetName] government is now isolated, and [GEM.GetLeader]'s dream of 'Gehenna unification' seems very far from realization."
 trinity_events_nagisa_diplomacy.8.a: "A toast to our friendship." # 8~9 Trinity/Prefect Team
 trinity_events_nagisa_diplomacy.10.a: "Those Gehenna traitors!" # 10 Pandemonium Society
 trinity_events_nagisa_diplomacy.11.t: "Hanuma Line"
 trinity_events_nagisa_diplomacy.11.desc: "This fortification network plan, clearly named after Makoto Hanuma who was the Chairwoman of the Pandemonium Society immediately before the Great Transference, was delivered from the [TRM.GetLeader] side of Trinity. Trinity worries that the day when [GEM.GetName]'s war machines will invade the east is approaching. Her defense plan, the Hanuma Line, is designed to install fortification networks in our key strategic areas so that when [GEM.GetLeader]'s invasion begins, their attack will be stalled at those strategic areas. Although this fortification network project seems likely to consume significant budget and time, and its practical feasibility seems to be a matter of debate, it is worth discussing."
 trinity_events_nagisa_diplomacy.11.a: "Understood."
 trinity_events_nagisa_diplomacy.12.t: "Possibility of Federal Unification?"
 trinity_events_nagisa_diplomacy.12.desc: "After the [GEM.GetName] side perished, all that remains are the [GEH.GetName] and [TRM.GetName] sides who have built a deep friendship through the success of the Eden Treaty. Could we not further expand the current Eden Treaty and achieve a federal unification between Trinity and Gehenna?"
 trinity_events_nagisa_diplomacy.12.a: "Begin negotiations."
 trinity_events_nagisa_diplomacy.12.b: "No, it is better to separate while divided."
 trinity_events_nagisa_diplomacy.13.t: "Trinity-Gehenna Federal Unification"
 trinity_events_nagisa_diplomacy.13.desc: "Today is a miracle-like day that will never happen again in Trinity history. Today has been declared an official Trinity national holiday, and with the sudden holiday, all Trinity government offices and public corporations have closed. At a party held in the Tea Party meeting room, Hina Sorasaki celebrated the \"friendship of the federation between the two schools.\" Who else could have led such a success? For Nagisa, today was a miracle-like success that would not happen again.\n\nThe Trinity Host's office declared through an official announcement that the two schools, Trinity and Gehenna, have achieved unification in the form of a federation. In that the two schools each possess armies called the Justice Task Force and the Prefect Team, this is closer to a confederation than a perfect unification, but the two schools promised that at the point where 'conflicts and misunderstandings between each other are completely healed, and the general public comes to understand each other,' the two military organizations will be integrated into one. According to the federal unification terms, Gehenna and Trinity still each have their own governments and send separate teams to international sports events like the Halo Festival. However, diplomatic rights belong to Trinity, and it was made clear that it is not two nations two systems but one nation two systems, 'One Country, Two Systems.'"
 trinity_events_nagisa_diplomacy.13.a: "It's complex, but Trinity-led unification is what's important."
 trinity_events_nagisa_diplomacy.14.t: "Failure of Trinity-Gehenna Federation Discussion"
 trinity_events_nagisa_diplomacy.14.desc: "A federal unification plan between Trinity and Gehenna was discussed, but the Prefect Team side seems to prefer a two-nation two-system plan where they 'prosper while separated.' We can further discuss our each autonomy and advocate unification again through the 'United States of Eden' unification plan. However, for now, the federal negotiation has failed."
 trinity_events_nagisa_diplomacy.14.a: "Could the United States of Eden be an alternative?"
 trinity_events_nagisa_diplomacy.15.t: "[FROM.GetName] Recognizing Us as the General Student Council"
 trinity_events_nagisa_diplomacy.15.desc: "The [FROM.GetName] side wishes for our cooperation in the Benelux issue. It is for the [FROM.GetName] and [ROOT.GetName] sides to form a military alliance, and we provide help for [FROM.GetAdjective]'s security. They seem to want to get their hands on a 'new General Student Council friendly to the [FROM.GetAdjective] side.' Of course, accepting this seems beneficial for us. Our radical 68 Revolution and the social-conservative aspect of Trinity's Filius faction do not fit well. Our opposing them could also become the trigger for the [FROM.GetLeader] side making the decision to invade us.\n\nOf course, this might be our opportunity. A miracle-like opportunity that will not come again to spread the liberal banner of the 68 Revolution from Luxembourg City to Eden."
 trinity_events_nagisa_diplomacy.15.a: "No, it's right to join hands with Trinity."
 trinity_events_nagisa_diplomacy.15.b: "We don't need their help, do we?"
 trinity_events_nagisa_diplomacy.16.t: "Accepting [FROM.GetName]'s Proposal"
 trinity_events_nagisa_diplomacy.16.desc: "The [FROM.GetName] side has approved a military alliance with us. With this, we have become a Kivotos academy-state that has 'the General Student Council President on our side.' Such a victory does not come easily. It is all thanks to [ROOT.GetLeader]'s diplomatic prowess."
 trinity_events_nagisa_diplomacy.16.a: "Praise the Host!"
 trinity_events_nagisa_diplomacy.17.t: "Rejecting [FROM.GetName]'s Proposal"
 trinity_events_nagisa_diplomacy.17.desc: "The [FROM.GetName] side has rejected a military alliance with us. It seems there is no other way forward but war."
 trinity_events_nagisa_diplomacy.17.a: "Attack Luxembourg."
 trinity_events_nagisa_diplomacy.17.b: "Let's invade the entire Benelux while we're at it!"
 trinity_events_nagisa_diplomacy.17.c: "No. We can just abandon the Benelux."
 trinity_events_nagisa_diplomacy.18.t: "[FROM.GetName]'s Protectorate Proposal"
 trinity_events_nagisa_diplomacy.18.desc: "The [FROM.GetName] side claims that [ROOT.GetName] is incapable of protecting itself. They believe it is difficult for us to maintain independence against the paranoid 'Otherworld-Bolshevism' claims of the Spanish government, and they state that their assistance is indispensable for maintaining that independence. However, can becoming their subordinates truly be called independence? We have the right to refuse, but there are concerns that an attack from [FROM.GetName] will follow if we do."
 trinity_events_nagisa_diplomacy.18.a: "Come and get it, you fanatics."
 trinity_events_nagisa_diplomacy.18.b: "We have no choice but to submit."
 trinity_events_nagisa_diplomacy.19.t: "Accepting [FROM.GetName]'s Proposal"
 trinity_events_nagisa_diplomacy.19.desc: "The [FROM.GetName] side has approved our protection proposal. Such a victory does not come easily. It is all thanks to [ROOT.GetLeader]'s diplomatic prowess."
 trinity_events_nagisa_diplomacy.19.a: "Praise the Host!"
 trinity_events_nagisa_diplomacy.20.t: "Rejecting [FROM.GetName]'s Proposal"
 trinity_events_nagisa_diplomacy.20.desc: "The [FROM.GetName] side has rejected our protection proposal. They anticipate our potential invasion and will likely fight to the last for their independence. Do we really need to fight [FROM.GetName]? Wouldn't the beautiful arts of Wildhunt be worth protecting where they stand, untouched by the flames of war?"
 trinity_events_nagisa_diplomacy.20.a: "Our answer is war."
 trinity_events_nagisa_diplomacy.20.b: "They have shown remarkable courage; we respect them."
 trinity_events_nagisa_diplomacy.21.t: "Code: BOX - Preparing the Delegation"
 trinity_events_nagisa_diplomacy.21.desc: "\"The visit to Millennium is not just sightseeing. We are there to see and learn about new technologies...\"\n\nThe internal meeting at Trinity was held in a heavy atmosphere. Trinity must learn from Millennium, not attack them. After that decision was made, a fierce debate ensued, but ultimately the Sisterhood decided to follow the Tea Party's decision. Now, the discussion has turned to who should lead the delegation.\n\nThe Pater faction argued that 'Misono Mika should lead the delegation,' but there was no chance the Tea Party would approve something that would allow a political rival of the Filius faction to build political achievements. The most rational alternative was Kirifuji Nagisa, the leader of the Filius faction. If it were her, she would surely let the name of Trinity shine in Millennium.\n\nThere was also a claim that the Justice Task Force should be dispatched. As the direct security and military organization of the Tea Party, they were a trustworthy organization that could be sent abroad. Who else but the Justice Task Force would accept this heavy mission with such reverence? In particular, Nakamasa Ichika, known for her calm and patient personality, was emerging as a suitable candidate.\n\nThe next alternative was Aomori Mine, the head of the Remedial Knights (Hospitallers). As a medical organization, the Knights have always shown an open attitude toward new knowledge and technology. The reason they were able to provide relief to so many people was that they were always the fastest to adopt superior medical techniques.\n\nFinally, the Pater faction demanded that if Mika could not be sent, the alternative should be Amau Ako—the former Senior Administrator of the Gehenna Prefect Team and current Tea Party Inspector. While the Pater faction's intent was to send an 'ignorant Gehenna hillbilly' who doesn't know Trinity's elegant customs to be humiliated abroad, considering that Ako represented Gehenna in various diplomatic tasks, she also possesses the basic qualifications to perform the role of envoy to Millennium.\n\nOf course, the final decision lies at the tip of [ROOT.GetLeader]'s pen."
 trinity_events_nagisa_diplomacy.21.a: "Nagisa, if I don't take the lead, who will?"
 trinity_events_nagisa_diplomacy.21.b: "Ichika, the Justice Task Force can learn much."
 trinity_events_nagisa_diplomacy.21.c: "Mine, the Remedial Knights have always brought the best answers."
 trinity_events_nagisa_diplomacy.21.d: "Ako, the new Inspector will bring outstanding results."
 trinity_events_nagisa_diplomacy.22.t: "Code: BOX - Day 1"
 trinity_events_nagisa_diplomacy.22.desc.nagisa: "Day 1 of Kirifuji Nagisa's Millennium Expo schedule. The moment she stepped into the 'Electronic Game Hall' promoting various Millennium-made games and consoles, Nagisa caught a whiff of the metallic scent of blood from within. It was a smell she had never encountered in Millennium, a smell that should not be here. \"...Blood... in a game hall?\" The cause was clear after only a few steps.\n\n\"It's because of you Millennium people that we ended up playing this trash game!\" \"I never recommended any games to you!\" \"Uwaaaah! Stop fighting! Stop!\"\n\nIn front of the retro game booth, dozens of students from both academies were swinging chairs at each other. It was as if they had been ordered to hate one another; they were slamming chairs down repeatedly until heads were broken and red blood spread across the blue floor. Nagisa felt a light dizziness. She couldn't believe that Trinity students, who came as guests, were fighting Millennium students instead of maintaining their elegance.\n\n\"Nagisa-sama, it's dangerous here. You should evacuate...\"\nNagisa shook her head. \"No, I have a duty to take responsibility for this situation. Everyone from Trinity, this rude behavior toward Millennium is...\"\n\nNagisa's words could not be finished. A chair thrown by a Trinity student flew in a perfect arc and struck her. With a violent *thwack!*, Nagisa felt her body slammed into the floor. Screams, shouts, and a high-pitched ringing in her ears filled the world. For a moment, she couldn't even tell what had happened. Blood poured from her mouth. Her pure white short cape was being stained by her own blood.\n\n'I was... hit? Me?'\n\nNagisa thought of herself as a mild-mannered person. But the moment she was hit in the face by a student of her own school—not even another academy—Nagisa felt she wasn't as 'mild' as she thought.\n\nNagisa's reason was warning her that these students might not be in their right minds. She should calmly lead her bodyguards to find the cause of this incident. But her emotions... were screaming to pull out her handgun 'Royal Blend,' aim it at that girl, and fire."
 trinity_events_nagisa_diplomacy.22.desc.ichika: "Day 1 of Nakamasa Ichika's Millennium Expo schedule. The moment she entered the 'Electronic Game Hall,' Ichika caught a whiff of the metallic scent of blood. It was a smell that shouldn't be here. \"...Isn't this, like, really dangerous?\" The cause was obvious.\n\n\"It's because of you Millennium people that we ended up playing this trash game!\" \"I never recommended any games to you!\" \"Uwaaaah! Stop fighting! Stop!\"\n\nIn front of the retro game booth, dozens of students were swinging chairs at each other. Ichika felt a slight lightheadedness. She couldn't believe Trinity students were fighting like this. \n\n\"Ichika-sama, it's dangerous here. You should evacuate...\"\nIchika shook her head. \"Well, it's fine. Wasn't I sent as an envoy to solve problems like this?\" Ichika approached the fighting students. \"Now, everyone, please calm down...\"\n\nIchika's words were cut short. A Trinity student landed a punch right on Ichika's face as she intervened. With a violent *thwack!*, Ichika felt herself slammed onto the floor. Nosebleed dripped onto the floor, drip, drip.\n\n'Ah, I think this is what they call getting \"sucker-punched.\" How fresh.'\n\nIchika braced herself and stood up. Her head was strangely clear and lucid. Instead of stopping them with words, shouldn't she just aim her assault rifle 'Red Dragon' and spray it everywhere? Why did she try to use long, pedantic persuasion on these fools? Ichika wiped away the blood that kept flowing with the back of her hand."
 trinity_events_nagisa_diplomacy.22.desc.mine: "Day 1 of Aomori Mine's Millennium Expo schedule. The moment she entered the 'Electronic Game Hall,' Mine caught the metallic scent of blood. \"...Blood? I heard this was a simple game hall...\" The cause was immediately apparent.\n\n\"It's because of you Millennium people that we ended up playing this trash game!\" \"I never recommended any games to you!\" \"Uwaaaah! Stop fighting! Stop!\"\n\nIn front of the retro game booth, dozens of students were slamming chairs into each other. Mine felt a light dizziness. She couldn't believe Trinity students were fighting Millennium students. \n\n\"Mine-sama, it's dangerous here. You should evacuate...\"\nMine shook her head. \"I came as the representative of the Trinity delegation. I have a duty to restrain this lawless scene.\" Mine approached the fighting students. \"Everyone. Please calm down. How can you be so rude...\"\n\nMine's words were cut short. A Trinity student landed a punch on Mine's face. With a violent *thwack!*, Mine felt herself slammed to the floor. Nosebleed dripped onto the floor, drip, drip.\n\n'...I let my guard down. For me, the Captain of the Remedial Knights, to be punched in the face...?'\n\nMine braced herself and stood up. Her head was strangely clear and lucid. She didn't know why the fight started. But it seemed she needed to deliver 'relief' to these fools in a way other than words. Why did she try to use long, pedantic persuasion on these fools? Mine wiped away the blood with the back of her hand."
 trinity_events_nagisa_diplomacy.22.desc.ako: "Day 1 of Amau Ako's Millennium Expo schedule. The moment she entered the 'Electronic Game Hall,' Ako caught the metallic scent of blood. \"...Ha. Surely, it's not the smell of real blood...\" But she soon realized it was.\n\n\"It's because of you Millennium people that we ended up playing this trash game!\" \"I never recommended any games to you!\" \"Uwaaaah! Stop fighting! Stop!\"\n\nIn front of the retro game booth, dozens of students were slamming chairs into each other. Ako felt a light dizziness. Right. I didn't expect to be given a proper job anyway.\n\n\"Ako-sama, it's dangerous here. You should evacuate...\"\nAko quietly drew her handgun, 'Hot Shot.' \"It's fine. I've seen plenty of crimes like this since my administrator days. I'll calm them down and ask for the cause of the fight.\" Ako approached the fighting students. \"I am the Tea Party Inspector, Amau Ako. Cease this rude behavior immed—\"\n\nAko's words were cut short. A chair thrown by a Trinity student flew in an arc and slammed into her. With a violent *thwack!*, Ako felt her body slammed into the floor. Blood poured from her mouth. Her pure white short cape was being stained by her own blood.\n\n'...Haah...? Blood?'\n\nAko braced herself and stood up. How dare they throw a chair at my face? Ako felt her head heating up. The reason of the former administrator warned that these students might not be in their right minds. She should lead her guards to find the cause. But her emotions... were screaming to pull out 'Hot Shot,' aim it at that girl, and fire."
 trinity_events_nagisa_diplomacy.22.a: "Pull the trigger."
 trinity_events_nagisa_diplomacy.22.b: "They are not in their right minds. Exercise maximum patience."
 trinity_events_nagisa_diplomacy.23.t: "Code: BOX - Day 4"
 trinity_events_nagisa_diplomacy.23.desc.nagisa: "The Millennium Expo facility's underground passage was narrow and pitch black. Having lost her shoes somewhere, Nagisa ran barefoot behind Kurosaki Koyuki, enduring the searing pain in the soles of her feet. Due to the hail of bullets from behind, Nagisa's short cape was tattered, and her wings were being stained red. Koyuki, however, just kept laughing 'Nihihi' as if this entire situation was simply fun.\n\n\"Haah, haah... Does Millennium... treat state visitors this way?!\"\n\"Nihihi! No, I didn't exactly intend for this to happen. I was just trying to erase the records of the money I embezzled, and then suddenly the security automatons started shooting...\"\n\"So why, I ask, did you have to do that while I was here! I visited this land as a state guest of Trinity. And yet...\"\n\"Nihihi! Being able to have such an exciting experience is proof enough that you're a state guest!\"\n\nWords don't work. Gunfire continued to ring out, and her back felt hot from being hit by several bullets. Nagisa turned her head. The distance to the automatons was closing little by little. They could continue this chase, but they would be caught eventually. She had to change strategy.\n\n\"Koyuki-san. Let's split up here. I'll somehow hold back those automatons.\"\n\"Eh? How?\"\n\"That's...\""
 trinity_events_nagisa_diplomacy.23.desc.ichika: "The Millennium Expo facility's underground passage was narrow and pitch black. Running barefoot behind Kurosaki Koyuki, Ichika endured the searing pain in her feet. Her Justice Task Force armband was already torn away by bullets, and her wings were turning red. Koyuki just laughed 'Nihihi' as if it was all a game.\n\n\"Haah, haah... Seriously, I had no idea Millennium was this kind of school!\"\n\"Nihihi! I was just erasing embezzlement records when the security bots went haywire!\"\n\"You could've done that embezzlement when I wasn't around. The Justice Task Force members who came with me are wiped out because of you... well, they're just fainted, not dead, but still.\"\n\"Nihihi! They got to have such a fun experience, so the JTF members must be happy too!\"\n\nWords don't work. Ichika's back burned from the bullet impacts. The distance was closing. She had to change strategy.\n\n\"Koyuki-san. We should split up here. I'll somehow stop those automatons.\"\n\"Eh? How?\"\n\"That's...\""
 trinity_events_nagisa_diplomacy.23.desc.mine: "The Millennium Expo facility's underground passage was narrow and pitch black. Running barefoot behind Kurosaki Koyuki, Mine endured the pain. Her Remedial Knights shield was riddled with bullet holes, and her wings were stained red. \n\n\"Haah, haah... Seriously, Millennium Science School! Your entire school needs relief! Starting from those rotten brains...\"\n\"Nihihi! I was just erasing embezzlement records when the security bots went haywire!\"\n\"The idea of erasing embezzlement records through hacking is wrong to begin with! Because of you, I'm failing to fulfill the role of envoy assigned by the Host!\"\n\"Nihihi! You've got so many stories to tell the Host now, right?\"\n\nWords don't work. Mine's back burned. The bots were closing in. She had to change strategy.\n\n\"Koyuki-san. Let's split up here. I'll handle those automatons.\"\n\"Eh? How?\"\n\"That's...\""
 trinity_events_nagisa_diplomacy.23.desc.ako: "The Millennium Expo facility's underground passage was narrow and pitch black. Running barefoot behind Kurosaki Koyuki, Ako's head was spinning. Her short cape was tattered. \n\n\"Haah, haah... Seriously, Millennium... is this how you treat state guests...?\"\n\"Nihihi! I was just erasing embezzlement records when the security bots went haywire!\"\n\"Is that something to be proud of?! Seriously! If Hina-buchou saw you, she'd twist that trap of yours shut...\"\n\"Nihihi! But the only thing being twisted right now is the Inspector's spine, right? You can't do anything after getting hit by dozens of bullets, right? Ni! Hi! Hi!\"\n\nWords don't work. Ako felt a hot surge of rage and the impulse to kill Koyuki. The distance was closing. She had to change strategy.\n\n\"Koyuki-san. Let's say two things. First. If you don't stop that damn 'Nihihi' laugh, I'll rip that mouth open myself. Second. I'll handle those automatons.\"\n\"Eh? How?\"\n\"That's...\""
 trinity_events_nagisa_diplomacy.23.a: "Suppress the automatons through one-vs-many combat."
 trinity_events_nagisa_diplomacy.23.b: "Run in a different direction from Koyuki at the three-way intersection to distract the automatons."
 trinity_events_nagisa_diplomacy.24.t: "Code: BOX - Day 7"
 trinity_events_nagisa_diplomacy.24.desc.nagisa: "Kirifuji Nagisa gripped the Arginine box covering her body tightly so it wouldn't fall off, and crawled through the empty back corridor of the Millennium Expo. Having crawled over a hundred meters, her white sleeves were torn, and sweat dripped silently from her forehead. But she couldn't take off the Arginine box. A woman out of her mind, Otohana Sumire, who dragged dozens of Helmet Gang members around calling them 'Training Club members,' was roaming the building wearing sunglasses.\n\n\"Visitor from Trinity, please come out. Our Millennium Training Club has prepared a perfect training experience course even for Trinity's guests. Do you know that even while you're hiding, muscle loss is continuously! occurring?\"\n\nNext to Sumire, Training Club member Nomasa Rei spoke through a megaphone. \"You know, the sooner you give up, the sooner you'll feel better? Come out, Trinity guest!\"\n\n'Give up sooner to feel better?' Nagisa recalled the horrific 'training' she had witnessed. Sumire abusing several Helmet Gang members to the point they were carried out in ambulances. Even then, she had cold-bloodedly muttered, 'Being laid up in an ambulance will cause muscle loss...' Nagisa instinctively felt that the moment her location was discovered, it would be her turn to board the ambulance.\n\n'Why on earth does Millennium let such a strange woman wander around the Expo grounds...!' Nagisa avoided the gaze of the Training Club zombies from inside the Arginine box, slowly crawling forward. The exit was getting closer. However, the problem was Nomasa Rei patrolling in front of the exit with a baseball bat. If she were to hit Nagisa's waist just once with that bat, she would be dragged into Sumire's training hell.\n\nShould she look for another passage? Or should she break out of the box midway and charge straight at Rei? If she were lucky, she might win the physical struggle before Sumire arrived and escape this temporary building to regroup with her bodyguards."
 trinity_events_nagisa_diplomacy.24.desc.ichika: "Nakamasa Ichika gripped the Arginine box tightly, crawling through the corridor. Her Justice Task Force uniform sleeves were torn. She couldn't take the box off because the crazy woman, Otohana Sumire, was nearby. \n\n\"Visitor from Trinity, please come out. Muscle loss is continuously! occurring!\"\n\nIchika remembered the 'training.' Sumire's cold-bloodedness while sending people to the hospital. Ichika felt she would be next if caught.\n\n'Why on earth does Millennium let such a weirdo wander around the Expo, really...!' Ichika crawled slowly. Nomasa Rei was at the exit with a bat. One hit to the waist, and it's training hell.\n\nShould she find another way? Or charge at Rei? Maybe she could win and regroup with the JTF."
 trinity_events_nagisa_diplomacy.24.desc.mine: "Aomori Mine gripped the Arginine box, crawling. Her Remedial Knights uniform was torn. She couldn't take the box off because the crazy woman, Otohana Sumire, was nearby. \n\n\"Visitor from Trinity, come out! Muscle loss is happening right now!\"\n\nMine remembered the horrific 'training.' Sumire's coldness toward those she hospitalized. Mine felt she'd be in an ambulance soon if caught.\n\n'Why on earth does Millennium let such a woman who clearly needs relief wander around like this...!' Mine crawled toward the exit. Nomasa Rei was there with a bat. One hit, and it's training hell.\n\nShould she find another way? Or charge at Rei? Maybe she could win and regroup with the Knights."
 trinity_events_nagisa_diplomacy.24.desc.ako: "Amau Ako gripped the Arginine box, crawling. Her Tea Party Inspector uniform was torn. She couldn't take the box off because the crazy woman, Otohana Sumire, was nearby. \n\n\"Visitor from Trinity, come out! You're losing muscle even now!\"\n\nAko remembered the 'training.' Sumire's cold-bloodedness. Ako felt she'd be next in the ambulance.\n\n'Why on earth does Millennium let such a nutcase wander the Expo...!' Ako crawled. Nomasa Rei was at the exit with a bat. One hit, and it's training hell.\n\nShould she find another way? Or charge at Rei? Maybe she could win and regroup with her guards."
 trinity_events_nagisa_diplomacy.24.a: "Charge at Rei."
 trinity_events_nagisa_diplomacy.24.b: "Look for another, safer passage."
 trinity_events_nagisa_diplomacy.25.t: "Code: BOX - Closing Ceremony"
 trinity_events_nagisa_diplomacy.25.desc.nagisa: "The Millennium Expo was long and eventful. But surely nothing would happen at the closing ceremony. Nagisa breathed a sigh of relief as she participated in the ceremony, which was ending with a speech from the [MIL.GetLeader] side. Although Nagisa herself had experienced all sorts of incidents, at least her subordinates were able to see, experience, and learn about various Millennium technologies. Millennium was a nation where Trinity could learn more and build friendship, rather than an enemy.\n\n\"...With this, we conclude the Millennium Expo of the year [GetYear]...\"\n\nAt that moment, before [MIL.GetLeader] could even finish her sentence, the wall of the auditorium where the ceremony was being held suddenly shattered. With a *Crash!*, the screams of the Engineering Department girls were heard. \"That's! It's the Big-Size Robot Alligator we were researching?!\" Big-Size? O God, merciful God. Please, not even at the closing ceremony. Nagisa stood up with her bodyguards. A giant alligator the size of a medium tank jumped into the auditorium, breathing fire from its mouth. The Millennium security personnel guarding the venue charged at it, only to be sent flying into the sky by the alligator's steel tail.\n\n\"KIEEEEE!\"\nWith a hideous screech, the robot alligator leaped onto the stage where [MIL.GetLeader] was giving the speech. The shocked face of [MIL.GetLeader], and C&C just entering the hall. Nagisa calculated quickly. The timing was off. Before C&C could rescue the Millennium Student Council President, that robot alligator would surely chew her up. Truly, it was the worst Expo ever. Nagisa rushed forward, following her sense of justice. Not as an elegant Tea Party politician, but as a single virtuous human being named Kirifuji Nagisa."
 trinity_events_nagisa_diplomacy.25.desc.ichika: "The Millennium Expo was long and eventful. Ichika participated in the closing ceremony, feeling relieved. Her subordinates learned a lot. Millennium was a place for friendship.\n\n\"...With this, we conclude the [GetYear] Expo...\"\n\n*Crash!* The wall shattered. \"The Big-Size Robot Alligator we were researching!\" yelled the Engineering girls. Ichika stood up. A giant tank-sized alligator breathing fire was tossing guards into the air. It leaped toward [MIL.GetLeader]. C&C wouldn't make it in time. Ichika rushed forward. If the Justice Task Force doesn't realize justice here, who will?"
 trinity_events_nagisa_diplomacy.25.desc.mine: "The Millennium Expo was long and eventful. Mine participated in the closing ceremony, feeling relieved. Her subordinates learned a lot. Millennium was a place for friendship.\n\n\"...With this, we conclude the [GetYear] Expo...\"\n\n*Crash!* The wall shattered. \"The Big-Size Robot Alligator!\" A fire-breathing metal beast was tossing guards. Mine calculated the injured. She couldn't stay still. It leaped toward [MIL.GetLeader]. C&C wouldn't make it in time. Mine rushed forward. A place in need of relief. That was right here."
 trinity_events_nagisa_diplomacy.25.desc.ako: "The Millennium Expo was long and eventful. Ako participated in the closing ceremony, feeling relieved. Her subordinates learned a lot. Millennium was a place for friendship.\n\n\"...With this, we conclude the [GetYear] Expo...\"\n\n*Crash!* The wall shattered. \"The Big-Size Robot Alligator!\" A giant metal beast was tossing guards. Ako calculated the casualties. She had to act. It leaped toward [MIL.GetLeader]. C&C wouldn't make it in time. Ako rushed forward. For a few seconds, Amau Ako reverted from Trinity's Tea Party Inspector back to Gehenna's Senior Administrator."
 trinity_events_nagisa_diplomacy.25.a: "Shield [MIL.GetLeader] from the alligator's attack with your body."
 trinity_events_nagisa_diplomacy.25.b: "Try to suppress the alligator by attacking it from the side."
 trinity_events_nagisa_diplomacy.26.t: "Code: BOX - Back to Trinity"
 trinity_events_nagisa_diplomacy.26.desc: "All schedules of the Millennium Expo have concluded. Although the representative who set out as a goodwill ambassador returned covered in wounds and was hospitalized at the Eden General Hospital, we were able to gain various technological advancements in exchange. Of course, if we advance twice more, our delegation will be pulverized. We learned two things: Millennium's technology is very useful, and Millennium is very dangerous.\n\nFinally, some of the security personnel sent as our delegation are showing symptoms of extreme fear toward the 'Demon of Muscle Loss' and 'Training.' PTSD treatment for them is also scheduled."
 trinity_events_nagisa_diplomacy.26.a: "Ugh... The nightmare of the Arginine box..."
 trinity_events_nagisa_diplomacy_code_box_nagisa_tt: "§gNote that Kirifuji Nagisa is not proficient in combat. This choice may add a negative trait to Nagisa. However, if successful, it yields a greater reward compared to Mine or Ichika.§!"
 trinity_events_nagisa_diplomacy_code_box_ako_tt: "§gNote that Amau Ako is not proficient in combat. This choice may add a negative trait to Ako. However, if successful, it yields a greater reward compared to Mine or Ichika.§!"
 trinity_events_nagisa_diplomacy.27.t: "The Grand Duchess of Red Winter?"
 trinity_events_nagisa_diplomacy.27.desc: "After occupying the Red Winter Federal Academy, Host Nagisa obtained quite surprising local information. It's a story about the Winter Kingdom, which was conquered and destroyed by Red Winter in the past. The masses of Red Winter still remember the Miyoshi family, which is now fallen but has a beautiful and tragic history.\n\nThere is a noble girl from a fallen family named Miyoshi Takane. She is the legitimate successor to the Grand Duchy of the Miyoshi family of the 'Winter Kingdom' conquered by Red Winter. It is said that while her parents and sisters were all purged by revolutionaries, only Takane survived under Red Winter's rule.\n\nAs the youngest daughter of the Miyoshi family that led the Winter Kingdom, she was able to survive alone by hiding her identity with the help of a loyal retainer. It is said that Takane has been waiting for the day to revive her family while cherishing the 'OAMT' diary, which contains her sisters' initials.\n\nIt is a surprising and moving story that a noble with such high bloodline still remained in a 'revolutionary' academy like Red Winter. The Filius faction agrees to recognize the titles owned by the Miyoshi family and let her officially be called the 'Grand Duchess of the Winter Kingdom.' But Nagisa herself wants to go a bit further. The only 'blue-blooded' survivor of Red Winter. If we officially accept her into the Filius faction, wouldn't she be a tremendous political asset?"
 trinity_events_nagisa_diplomacy.27.a: "Recognize only her title as Grand Duchess."
 trinity_events_nagisa_diplomacy.27.b: "Let's discuss Takane's official entry as a Tea Party executive."
 trinity_events_nagisa_diplomacy_hidden_start_tt: "§gA hidden focus will be added to induct Takane as an executive of the Trinity Tea Party.§!"
 trinity_events_nagisa_diplomacy.28.t: "The False Anastasia"
 trinity_events_nagisa_diplomacy.28.desc: "\"How did things end up like this...\"\n\nTakane was bewildered by the flow of events she hadn't even anticipated, yet she quietly ran her fingertips over the Tea Party executive uniform she had been issued. It was incomparably softer and more beautiful than the clothes she wore in Red Winter.\n\nTakane is the successor and Grand Duchess of the Winter Kingdom. This is a lie. It couldn't possibly be true in the first place. What kind of academy is Red Winter anyway? Everything about her rumors was wrong, except for the 'OAMT' initials of her sisters. There was no such thing as the Winter Kingdom, and Takane was never a princess. However, how could she say that now?\n\n\"...Haah. Well, at least I haven't been caught. It's fine as long as I don't get caught.\"\n\nTakane made a small sign of the cross and let out a deep sigh. Surely things won't get entangled in anything more terrible than this. Surely."
 trinity_events_nagisa_diplomacy.28.a: "Could things get any more twisted than this?"
 trinity_events_nagisa_diplomacy.29.t: "[FROM.GetName] Requesting Missionary Entry"
 trinity_events_nagisa_diplomacy.29.desc: "The [FROM.GetNameDef] side is enthusiastic about spreading their faith and scriptures to other nations, and the [FROM.GetLeader] side wants [ROOT.GetName], their military ally, to accept their faith as well. It seems [FROM.GetLeader] believes that an 'alliance under sincere faith' will further strengthen the relationship between them and us. They wish to dispatch missionaries to the cities of our nation and have promised to send them only with our government's approval to avoid diplomatic disputes. Should we accept their missionaries?"
 trinity_events_nagisa_diplomacy.29.a: "For a deeper alliance, we permit it."
 trinity_events_nagisa_diplomacy.29.b: "No, we have no need for their faith."

 trinity_events_nagisa_diplomacy.31.desc: "Following the negotiations for a joint security organization, the [TRM.GetLeader] side formally proposed the 're-negotiation of the Eden Treaty' to the [GEH.GetLeader] side. This negotiation signifies a non-aggression pact and mutual industrial opening between the [TRM.GetNameDef] and [GEH.GetNameDef] governments. Previously, verbal meetings regarding the establishment of the Eden Treaty Organization had taken place, but it seems the negotiations have been adjusted in Trinity's favor due to political pressure within Trinity. If we agree to this, a working-level meeting will follow to review the details of the negotiations."
 trinity_events_nagisa_diplomacy.31.b: "No, this is too unfavorable for us."

 trinity_events_nagisa_diplomacy.32.desc: "As the [GEH.GetLeader] side accepted our negotiation proposal, working-level negotiations for the Eden Treaty have begun. Pandemonium Society will do everything in its power to hinder the negotiations, and the pressure from the anti-negotiation faction within the Prefect Team and the Pater faction mixed within our working group will be a new threat. While we may have already made many concessions, [ROOT.GetLeader] is the only one who can maintain the balance between Gehenna and the Pater faction and bring stability to the academy."

 trinity_events_nagisa_diplomacy.33.desc: "The [ROOT.GetName] Intelligence Department has detected a movement to re-promote the Eden Treaty between Trinity and the Gehenna Prefect Team. Working-level officials have already begun negotiations and are organizing detailed clauses for a non-aggression pact between the two academies.\n\nIf the Eden Treaty is truly signed, we will have to resist Trinity-made products flowing in through the Prefect Team, and the Prefect Team will be unable to conduct military activities against Trinity in the event of a future conflict between the two nations. This situation is nothing short of a disaster for our security. We must stop this negotiation at all costs using our agents. Absolutely!"
 trinity_events_nagisa_diplomacy.33.a: "I'll show you how the story of the Garden of Eden ends."

 trinity_events_nagisa_diplomacy.34.desc: "Who was the culprit? It could have been the greed of the Pater faction or the Trinity working-level officials. Or perhaps it was a commotion caused by Pandemonium Society agents. Our negotiations were strangely sluggish. Fake news slandering each other continued to spread while traveling between the two academies, and the general public of Gehenna and Trinity held continuous protests to hinder the peace treaty.\n\nEventually, through a landmark event where a crude bomb exploded at the negotiation site, the Eden Treaty was officially suspended. Although the leadership of Trinity and the Gehenna Prefect Team knew that the main culprit of the terror was not each other, public opinion worsened rapidly as various trade privileges requested by Trinity during the negotiations regained attention, making it unlikely that the two nations will reconcile for at least a generation."
 trinity_events_nagisa_diplomacy.34.a: "...I see."
 
 trinity_events_nagisa_diplomacy.37.desc: "Was there a problem with the friendship between [GEH.GetLeader] and us? Surprisingly and shockingly, the [GEH.GetLeader] side refused to expand the Eden Treaty beyond the sharing of police security organizations. Given that this treaty was built on the friendship and goodwill of the two academy leaders, now that that goodwill has collapsed, there is no way to restart the negotiations."

 trinity_events_nagisa_diplomacy.38.desc: "Today is the greatest day for both the [GEH.GetName] and [TRM.GetName] sides. As the Eden Treaty left behind by the General Student Council President bore fruit and was officially signed by the two leaders, the two academies have decided on permanent peace with each other and to remain silent in our conflict with the [GEM.GetName] side. Despite the long-standing rivalry between Gehenna and Trinity, it seems the rational leaders of both academies have found the best way to flexibly maintain current stability.\n\nOf course, this news will be negative for the [GEM.GetLeader] side. The [GEM.GetName] government has now lost its greatest ally in its anti-Trinity defense plan, and [GEM.GetLeader]'s dream of 'Unifying Gehenna' seems likely to be sidelined for a considerable period."

 trinity_events_nagisa_election.1.t: "Conclave of the Year [GetYear]"
 trinity_events_nagisa_election.1.desc.phase_1: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nAn election was held to elect a new Host to lead Trinity. According to long-standing tradition, this election was not a general election but was conducted strictly by closed-door Tea Party executives. Through long-term voting, [ROOT.GetLeader] was comfortably re-elected to the position of Host and will serve a three-year term. Opposition factions claim this election was rigged, but it is merely a hollow cry."
 trinity_events_nagisa_election.1.desc.phase_2: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nAn election was held to elect a new Host to lead Trinity. According to long-standing tradition, this election was not a general election but was conducted strictly by closed-door Tea Party executives. Following [ROOT.GetNameDef]'s integration of Gehenna, the Filius faction gained more internal support due to that achievement. Through long-term voting, [ROOT.GetLeader] was comfortably re-elected to the position of Host and will serve a three-year term."
 trinity_events_nagisa_election.1.a: "The winner is [ROOT.GetLeader]!"
 trinity_events_nagisa_election.2.t: "Conclave of the Year [GetYear]"
 trinity_events_nagisa_election.2.desc: "\n\n\n                                                   £GFX_report_event_TRM_trinity_general_school\n\n\n\n\n\n\nTrinity is not a representative democracy, and the Host election is decided through an election among a small number of oligarchical executives. This election, held after the promulgation of the Nagisa Constitution, consisted of a one-on-one confrontation between a representative of the Filius faction and Misono Mika, the representative of the Pater faction. Kirifuji Nagisa instructed all Filius executives and coalition factions cooperating with Filius to support a specific candidate. Due to Nagisa's strong grip within the Filius faction, it is judged most likely that the candidate supported by Nagisa will be elected in this Host election.\n\nMisono Mika does not seem very motivated to win this Host election. Perhaps recent events, including Seia's return, have stripped away her desire for power. Either way, the secretary has checked all the ballots, and now the secretary will announce the name of the winner who received a majority of the votes."
 trinity_events_nagisa_election.2.nagisa: "Kirifuji Nagisa always wins."
 trinity_events_nagisa_election_nagisa_tt: "§g\"Nagisa. Really, even after going through all this?\"§!"
 trinity_events_nagisa_election.2.hifumi: "Ajitani Hifumi succeeds Nagisa."
 trinity_events_nagisa_election.2.seia: "Yurizono Seia will reclaim her place."
 trinity_events_nagisa_election.2.mine: "Aomori Mine has succeeded in changing the regime."
 trinity_events_nagisa_election.2.ako: "Amau Ako will take charge of Trinity's future."
 trinity_events_nagisa_election.2.atsuko: "Hakari Atsuko was chosen by Nagisa."
 trinity_events_nagisa_election.2.takane: "Grand Duchess Miyoshi Takane will lead the Tea Party."

 trinity_events_nagisa_misono_mission.00.a: "\"[GetNameMisonoMissionDemandOptions]\""
 trinity_events_nagisa_misono_mission_demand_event_option_1: "Filius must respond."
 trinity_events_nagisa_misono_mission_demand_event_option_2: "We must counter that Pater conspiracy."
 trinity_events_nagisa_misono_mission_demand_event_option_3: "The Lord will lead us to the right path."
 trinity_events_nagisa_misono_mission_demand_event_option_4: "Is this Mika-san's new plan? That's fine."
 trinity_events_nagisa_misono_mission_demand_event_option_5: "Good, let's use this crisis as an opportunity to innovate our alma mater."
 trinity_events_nagisa_misono_mission_demand_event_option_6: "Filius is... no. I am prepared."
 trinity_events_nagisa_misono_mission_demand_event_option_7: "I must respond personally."
 trinity_events_nagisa_misono_mission_demand_event_option_8: "I only respond with results, not words."
 trinity_events_nagisa_misono_mission_demand_event_option_9: "Mika-san is just throwing a tantrum."
 trinity_events_nagisa_misono_mission_demand_event_option_10: "Pater's childishness, honestly, it's getting annoying by now."
 trinity_events_nagisa_misono_mission_events.00.b: "\"[GetNameMisonoMissionFailureOptions]\""
 trinity_events_nagisa_misono_mission_failure_event_option_1: "This result was my miscalculation."
 trinity_events_nagisa_misono_mission_failure_event_option_2: "It's embarrassing. ...Truly."
 trinity_events_nagisa_misono_mission_failure_event_option_3: "Mika-san has caught my weakness."
 trinity_events_nagisa_misono_mission_failure_event_option_4: "To think I opened a path for Pater..."
 trinity_events_nagisa_misono_mission_failure_event_option_5: "Even if we fall today, we must rise again tomorrow."
 trinity_events_nagisa_misono_mission_failure_event_option_6: "This does not mean the ultimate defeat of Filius."
 trinity_events_nagisa_misono_mission_failure_event_option_7: "Mistakes can happen. It just shouldn't be repeated."
 trinity_events_nagisa_misono_mission_failure_event_option_8: "It was a blunder that a Host should never have made."
 trinity_events_nagisa_misono_mission_failure_event_option_9: "It's already happened, so it can't be helped."
 trinity_events_nagisa_misono_mission_failure_event_option_10: "Mika-san is dragging me down by the ankles..."

 trinity_events_nagisa_misono_mission.1.t: "Pater Faction Pushing for Arms Production Expansion"
 trinity_events_nagisa_misono_mission.1.desc: "The Pater faction, led by $TRN_Misono_Mika$, is criticizing [ROOT.GetLeader]'s lack of effort in expanding military factories during Tea Party meetings. The militaristic Pater executives denounce the 'weak' appearance of the Filius faction, claiming it will lead Trinity to ruin. The internal factions of Trinity are waiting for our response. They will exercise some patience, but they will not wait forever."
 trinity_events_nagisa_misono_mission.2.t: "Pater Faction Wishing for Conscription Law Revision"
 trinity_events_nagisa_misono_mission.2.desc: "The Pater faction, led by $TRN_Misono_Mika$, mocks the Filius faction for failing to prepare for war at all. $TRN_Misono_Mika$ criticized the reason Trinity is not expanding conscription to secure more troops through public speeches. Internal factions are waiting; their patience is limited."
 trinity_events_nagisa_misono_mission.3.t: "Pater Faction Demanding Support Trucks"
 trinity_events_nagisa_misono_mission.3.desc: "The Pater faction claims our military warehouses need more trucks. More vehicles will guarantee faster mobility for the Trinity Army, starting with logistics. Internal factions are waiting."
 trinity_events_nagisa_misono_mission.4.t: "Pater Faction Demanding Tank Production"
 trinity_events_nagisa_misono_mission.4.desc: "The Pater faction demands more tanks in our warehouses. Even Gehenna has iconic tanks like the 'Toramaru,' so what does Trinity have? Roll cakes? $TRN_Misono_Mika$ warns in a stern tone that if Trinity doesn't have enough spare tanks, a day will come when even those roll cakes cannot be eaten. Internal factions await our response."
 trinity_events_nagisa_misono_mission.5.t: "Pater Faction Demanding Artillery Production"
 trinity_events_nagisa_misono_mission.5.desc: "The Pater faction claims our warehouses need more field guns. Artillery divisions are necessary to strengthen Trinity's national defense, and they warn we lack them. Internal factions await our response."
 trinity_events_nagisa_misono_mission.6.t: "Pater Faction Pushing for Shipyard Production Increase"
 trinity_events_nagisa_misono_mission.6.desc: "The Pater faction criticizes [ROOT.GetLeader]'s lack of shipyard expansion. Militaristic Pater executives blame Filius's 'fragile' nature for bringing Trinity closer to destruction. Internal factions await our response."
 trinity_events_nagisa_misono_mission.7.t: "Pater Faction Demanding Fuel Stockpile Plan"
 trinity_events_nagisa_misono_mission.7.desc: "The Pater faction pointed out that Trinity's war machines are not properly prepared due to a lack of fuel. They demand that 'sufficient fuel' be secured soon. Internal factions await our response."
 trinity_events_nagisa_misono_mission.8.t: "Pater Faction Pushing for Domestic Industrial Base Expansion"
 trinity_events_nagisa_misono_mission.8.desc: "The Pater faction criticizes that the expansion of civilian factories is not being carried out properly, causing Trinity's economy to stagnate. Internal factions await our response."
 trinity_events_nagisa_misono_mission.9.t: "Pater Faction Demanding Air Force Production"
 trinity_events_nagisa_misono_mission.9.desc: "The Pater faction claims more aircraft are needed. According to them, the air force is the most important weapon in modern warfare, and Trinity lacks sufficient reserves. Internal factions await our response."
 trinity_events_nagisa_misono_mission.10.t: "Pater Faction Demanding Mystic Loom Production"
 trinity_events_nagisa_misono_mission.10.desc: "The Pater faction demands more Mystic Looms in our warehouses. They argue that to avoid appearing weak in military confrontations with human nations after the Great War, a sufficient stock of Mystic Looms must be prepared. Internal factions await our response."
 trinity_events_nagisa_misono_mission.11.t: "Pater Faction Demanding Appointment of Chief of Staff"
 trinity_events_nagisa_misono_mission.11.desc: "The Pater faction criticizes that the position of Chief of Staff of the Trinity Army is vacant. While it's true Trinity didn't have one before the Great War, $TRN_Misono_Mika$ blames [ROOT.GetLeader] for neglecting national defense compared to neighboring countries. Internal factions await our response."
 trinity_events_nagisa_misono_mission.12.t: "Pater Faction Demanding Appointment of Chief of Naval Operations"
 trinity_events_nagisa_misono_mission.12.desc: "The Pater faction criticizes that the position of Chief of Naval Operations is vacant. They claim [ROOT.GetLeader] is neglecting defense. Internal factions await our response."
 trinity_events_nagisa_misono_mission.13.t: "Pater Faction Demanding Appointment of Chief of Staff of the Air Force"
 trinity_events_nagisa_misono_mission.13.desc: "The Pater faction criticizes that the position of Chief of Staff of the Air Force is vacant. They claim [ROOT.GetLeader] is neglecting defense. Internal factions await our response."
 trinity_events_nagisa_misono_mission.14.t: "Pater Faction Demanding Nothing"
 trinity_events_nagisa_misono_mission.14.desc: "The Pater faction, led by $TRN_Misono_Mika$, is experiencing internal chaos due to $TRN_Misono_Mika$'s impulsive and emotional personality. They are too severely divided to unite and attack the Filius faction and Host [ROOT.GetLeader]. Thanks to this, it seems difficult for the Pater faction to launch political attacks against us for the time being."
 trinity_events_nagisa_misono_mission.14.a: "At least nothing will happen this month."
 trinity_events_nagisa_misono_mission_14_a_tt: "§gThe Pater faction does nothing this month.§!"

 trinity_events_nagisa_misono_mission.100.t: "[ROOT.GetLeader] Loses Political Influence"
 trinity_events_nagisa_misono_mission.100.desc: "We strove to respond to the Pater faction's rude demands, but ultimately failed to achieve our goals. Various factions now harbor doubts about Filius's leadership, which is a major blunder for our government."

 trinity_events_nagisa_misono_mission.110.t: "Pater Attempting to Recruit $TRN_Urawa_Hanako$"
 trinity_events_nagisa_misono_mission.110.desc: "The Pater faction is continuously trying to recruit new talent. Their approach to $TRN_Urawa_Hanako$ is a typical political maneuver revealing Pater's ambition. They are contacting Hanako individually to pull her into their faction and make her hostile to Filius.\n\nIf we do not act, they will act first."
 trinity_events_nagisa_misono_mission.111.t: "$TRN_Urawa_Hanako$ Joins the Pater Faction"
 trinity_events_nagisa_misono_mission.111.desc: "Our plan to recruit Hanako into the Filius faction yielded the worst result. Mocking all of Trinity as a 'snake pit,' Hanako stated that our political maneuver to incorporate her into Filius was hideous. $TRN_Urawa_Hanako$ declared that our efforts helped her realize how much hypocrisy currently surrounds Trinity, and she announced she would join the Pater faction instead."
 trinity_events_nagisa_misono_mission.111.a: "This is absurd."
 trinity_events_nagisa_misono_mission.112.t: "$TRN_Urawa_Hanako$ Joins the Sisterhood"
 trinity_events_nagisa_misono_mission.112.desc: "The Pater faction's plan to recruit Hanako yielded the worst result. Hanako mocked all of Trinity as a 'snake pit' and called $TRN_Misono_Mika$'s political maneuvering hideous. $TRN_Urawa_Hanako$ declared she would not get caught in Trinity's 'snake pit' nature and decided to belong to the Sisterhood."
 trinity_events_nagisa_misono_mission.112.a: "So, doing nothing was the answer?"

 trinity_events_nagisa_misono_mission.120.t: "Pater Attempting to Recruit [GetMisonoMissionRandomCharacter]"
 trinity_events_nagisa_misono_mission.120.desc: "The Pater faction is trying to recruit [GetMisonoMissionRandomCharacter]. They are offering various conditions to make her a member. Should we also approach [GetMisonoMissionRandomCharacter]?"
 trinity_events_nagisa_misono_mission.121.t: "[GetMisonoMissionRandomCharacter] Joins the Pater Faction"
 trinity_events_nagisa_misono_mission.121.desc: "[GetMisonoMissionRandomCharacter] has succumbed to the temptation of the Pater faction and their leader $TRN_Misono_Mika$. Now she will oppose us as an enemy of the Filius faction."
 trinity_events_nagisa_misono_mission.122.t: "[GetMisonoMissionRandomCharacter] Joins the Filius Faction"
 trinity_events_nagisa_misono_mission.122.desc: "Thanks to our contact with [GetMisonoMissionRandomCharacter] with better conditions than the Pater faction, she has sworn loyalty to the Filius faction and Nagisa."

 trinity_news_events.1.t: "Seia Yurizono Assassination Attempt"
 trinity_news_events.1.desc: "Seia Yurizono, the head of the Sanctus faction, fell into a coma after being shot by an assailant during her inauguration speech. The assailant was immediately suppressed on-site, and Seia is being transported to the hospital under heavy guard.\n\nImmediately after the incident, the Tea Party was urgently convened to discuss the selection of the next Host, with observations that Mika Misono of the Pater faction is highly likely to be designated. Recent events have made Trinity's internal situation extremely unstable, and this incident seems to be the explosion of that instability. As conflict within the Sanctus faction intensifies, Trinity's political chaos is expected to deepen."
 trinity_news_events.1.a: "Oh my goodness!"
 trinity_news_events.1.b: "How barbaric!"
 trinity_news_events.1.c: "They seem confused."
 trinity_news_events.2.t: "Mika Misono Takes Control of Trinity"
 trinity_news_events.2.desc: "The political chaos of Trinity General Academy, sparked by the barbaric Seia Yurizono assassination attempt, was settled with Mika Misono taking the position of Host. As soon as she secured the Host authority, she carried out a series of radical reforms, eventually passing legislation to justify her rule and guarantee permanent power, signaling the end of the Tea Party's triumvirate system.\n\nHowever, it is hard to find a celebratory atmosphere in other academies in Kivotos. In particular, due to Mika Misono's incessant anti-Gehenna remarks, Gehenna is showing an extremely restrained response."
 trinity_news_events.2.a: "A new Trinity arises!"
 trinity_news_events.2.b: "The order of Kivotos will be shaken..."
 trinity_news_events.2.c: "What does this mean for us?"
 trinity_news_events.2.d: "What a surprising development."
 TRN_trinity_order_state_threat_name: "Mika Misono's Coup"
 trinity_news_events.3.t: "Idol Live Performance Held at Trinity"
 trinity_news_events.3.desc: "The annual Trinity Carnival, and particularly the highly anticipated 'Idol Live Performance,' was successfully held today. However, this year's stage was more special than ever. Today, what appeared before the audience was a new group called 'Antique Seraphim.' They consist of Aomori Mine (Captain of the Remedial Knights), Utazumi Sakurako (Sister Superior of the Sisterhood), and Iochi Mari of the Sisterhood.\n\nAt the beginning of their formation, they faced several problems and political crises, but Iochi Mari took the lead in resolving them, and the stage was concluded successfully. Trinity students met their performance with passionate cheers, and the idol event ended on a grand note with a brilliant stage."
 trinity_news_events.3.a: "Share a photo with me too!"
 trinity_news_events.4.t: "Formation of the Eden Treaty"
 trinity_news_events.4.desc: "After Mika Misono seized power, she declared the 'Eden Treaty' to bring Trinity back to the center of the world stage and reclaim hegemony. This treaty is a military alliance countering the Kivotos Union, signifying that Trinity has settled its political chaos and begun to reveal its expansionist ambitions.\n\nTrinity diplomats introduce the Eden Treaty merely as a pact for mutual cooperation, but in reality, it is interpreted as a strategic move to restore and expand the sphere of influence that withered after the Great War. Given Trinity's recent expansionist movements, the intent to restore broad dominance through force is becoming increasingly clear."
 trinity_news_events.4.a: "We grow even stronger!"
 trinity_news_events.4.b: "A new threat."
 trinity_news_events.4.c: "We will crush them!"
 trinity_news_events.4.d: "The rise of a new hegemony?"
 trinity_news_events.5.t: "Trinity Invades Gehenna"
 trinity_news_events.5.desc: "For hundreds of years, Trinity and Gehenna maintained a superficial peace, but there was never true reconciliation. Trinity never forgot Gehenna's past actions, and that hatred and desire for revenge deepened with time. With Mika Misono seizing power after the Great War, the concerns of skeptics have become reality.\n\nAfter years of spreading revanchism and arms build-up, Mika Misono finally officially declared a state of war and sent Trinity's army to the front. Gehenna's armored units launched a counterattack, but advance is difficult due to Trinity's bombardment."
 trinity_news_events.5.a: "Subdue the demons!"
 trinity_news_events.5.b: "This war has cast a shadow over Kivotos..."
 trinity_news_events.5.c: "All Gehenna, unite!"
 trinity_news_events.5.d: "Let them fight..."
 trinity_news_events.6.t: "German Uprising Occurs in Trinity"
 trinity_news_events.6.desc: "This afternoon, a German uprising that began with about 10,000 protesters pouring into the streets in the Trinity Central District is spreading throughout Trinity. Many Germans are marching through the streets shouting 'Deutschland, Deutschland über alles,' and NSDAP slogans and swastikas are being left as graffiti on walls and bridges.\n\nDespite the widespread protests and instability, the Tea Party has issued direct suppression orders to the Justice Task Force, and the uprising itself is expected to be suppressed quickly."
 trinity_news_events.6.a: "Suppress them all!"
 trinity_news_events.6.b: "Is this the end of the Trinity?"
 trinity_news_events.6.c: "If they divide..."
 trinity_news_events.6.d: "Is this their end?"
 trinity_news_events.7.t: "Kirifuji Nagisa Takes Control of Trinity"
 trinity_news_events.7.desc: "The political chaos of Trinity General Academy, sparked by the barbaric Seia Yurizono assassination attempt, was settled with Kirifuji Nagisa taking the position of Host. Nagisa expressed her will to preserve harmony between the Filius faction and various other factions.\n\nHowever, the Nagisa government is not completely stable. The Pater faction led by Mika Misono continues to oppose the government, and Filius's grip on the political situation is not absolute. After seizing power, Nagisa is expected to focus on domestic stability while externally continuing to promote the Eden Treaty with Gehenna."
 trinity_news_events.7.a: "There is no 'Second Trinity.'"
 trinity_news_events.7.b: "Trinity has found a rational alternative."
 trinity_news_events.7.c: "A decent opponent."
 trinity_news_events.7.d: "They certainly have many factions!"
 trinity_news_events.8.t: "Success of the Eden Treaty"
 trinity_news_events.8.desc: "The Eden Treaty, symbolizing friendship and peace between Trinity and Gehenna, has been promoted since before the Great War under the mediation of the General Student Council President. Although it was briefly interrupted, the treaty proceeded thanks to the efforts of [TRM.Getleader] and [GEH.GetLeader]. This version of the treaty is a military alliance. The two academies have promised to jointly respond to external enemies under the defense alliance 'ETO.' Following the joint statement, the [GEM.GetName] side declared the treaty 'completely illegal,' claiming [GEH.GetName] has no right to represent Gehenna."
 trinity_news_events.8.desc.alt: "The Eden Treaty proceeded thanks to [TRM.Getleader] and [GEH.GetLeader]. Originally intended as a military alliance called 'ETO,' due to internal opposition in Trinity, the actual treaty concluded as a non-aggression and economic exchange pact. The [GEM.GetName] side has declared this 'completely illegal.'"
 trinity_news_events.8.a: "One arrow is easily broken, but a bundle of arrows is not."
 trinity_news_events.8.b: "Disgusting."
 trinity_news_events.8.c: "Startling news for Kivotos!"
 trinity_news_events.8.d: "So, the invaders from another world have allied?"
 trinity_news_events.9.t: "Trinity Invades Gehenna"
 trinity_news_events.9.desc: "Kirifuji Nagisa was the most conciliatory pacifist among many Hosts, but military confrontation has finally driven the two forces into a state of war. [TRM.GetName] stated that Gehenna was building up arms to invade Trinity, and they are conducting a preventive war in response. Trinity's army has crossed the border, and all of Kivotos is watching to see who will be the victor."
 trinity_news_events.9.a: "Trinity will prevail."
 trinity_news_events.9.b: "All Gehenna, unite!"
 trinity_news_events.9.c: "Pandemonium Society is in for some trouble."
 trinity_news_events.9.d: "Who will be the victor?"
 trinity_news_events.10.t: "Failure of the Eden Treaty"
 trinity_news_events.10.desc: "The Eden Treaty was shaken by continuous protests from opposition factions in both academies and ultimately collapsed after a bomb exploded at the meeting site. While the leaders left a hopeful message, it remains mere political rhetoric given the public opinion."
 trinity_news_events.10.a: "A tragedy."
 trinity_news_events.10.b: "Truly delightful."
 trinity_news_events.10.c: "It was a futile meeting."
 trinity_news_events.10.d: "The otherworld invaders are fighting among themselves."
 trinity_news_events.11.t: "Establishment of the Eden System"
 trinity_news_events.11.desc: "Following the successful Trinity-led integration of Gehenna, a new power structure called the 'Eden System' has been created. Kirifuji Nagisa promised that Gehenna will be incorporated as a new member of Trinity, just like Filius, Pater, and Sanctus, and will not be treated as a colony. Despite this 'merciful' declaration, the situation remains uncertain. Guerrillas loyal to Pandemonium Society remain, and the news that some Prefect Team executives will join Filius is making Pater uncomfortable. Regardless, today Trinity stands as the victor."
 trinity_news_events.11.desc.alt: "Following the successful Trinity-led invasion of the Pandemonium Society, the 'Eden System' has been established. Nagisa promised that the occupied territories will be incorporated as members of Trinity. While guerrillas remain and peaceful unification discussions with [GEH.GetName] are ongoing, Trinity stands as the victor today."
 trinity_news_events.11.a: "May our victory last forever."
 trinity_news_events.11.b: "We must keep an eye on Eden."
 trinity_news_events.11.c: "A troublesome power has been born..."
 trinity_news_events.12.t: "Trinity Host Election"
 trinity_news_events.12.desc.nagisa: "The [TRM.GetName] government promulgated the 'Nagisa Constitution' to transform Trinity from an academy-state to a general state, and subsequently held the first Host election under the new constitution. Although many expected Nagisa to step down and pass the position to a successor, she did not. Nagisa was elected by an overwhelming majority to lead Trinity for the next three years. She stated she would do her best \"for the glory and prosperity of Trinity.\""
 trinity_news_events.12.desc.alt: "The first election under the 'Nagisa Constitution' was held. Surprisingly, instead of Nagisa, [TRM.GetLeader] was elected. She is a candidate directly designated by Nagisa, who plans to retire from politics. While the leader has changed, the policies of the Nagisa government are expected to be maintained."
 trinity_news_events.12.a: "Trinity, prosper forever!"
 trinity_news_events.12.b: "Watch Trinity's movements closely."
 trinity_news_events.12.c: "I have no interest in their political squabbles."
 trinity_news_events.13.t: "Trinity Coup"
 trinity_news_events.13.desc: "Kirifuji Nagisa's efforts to centralize power and plans for a dictatorship were thwarted by a coup. The Sisterhood occupied the Tea Party today and detained key executives, declaring that their intervention was necessary to save Trinity. Utazumi Sakurako promised to return Trinity to a stable period of harmony and reinstated former Host Seia Yurizono. While Seia is back, practical power seems to have shifted to the Sisterhood."
 trinity_news_events.13.a: "Back under the banner of tradition."
 trinity_news_events.13.b: "A pity for the former Host."
 trinity_news_events.13.c: "I have no interest in their political squabbles."
 trinity_news_events.14.t: "Trinity Commonwealth Declaration"
 trinity_news_events.14.desc: "Trinity, formerly a union of academies, officially announced today its change to a 'Commonwealth' following the decision of [TRM.GetLeader]. This reflects Trinity's transition to a regular state as it includes Germans in its ethnic composition after the Great War. A Tea Party spokesperson said this is not an abandonment of the 'First Trinity' ideology but a step toward its further development."
 trinity_news_events.14.a: "A firm and unbreakable grand Commonwealth"
 trinity_news_events.14.b: "Didn't they just take 'Academy' out of the name?"
 trinity_news_events.14.c: "Adapting to the post-Great War geopolitical situation."

