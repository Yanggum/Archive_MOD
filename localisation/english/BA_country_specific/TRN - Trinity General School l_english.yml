 TRN_romania_give_the_oil: "루마니아 유전지대 확보"
 TRN_romania_give_the_oil_desc: "트리니티의 산업, 차량, 그리고 전쟁기계들이 원활하게 가동되기 위해서는 석유가 필요합니다. 루마니아의 유전 지대는 우리의 수요를 충족시킬 수 있는 충분한 공급량을 보유하고 있습니다. 그러나 루마니아 정부는 우리에게 비협조적인 태도를 보이고 있으며, 이러한 상황을 타개하기 위해서는 무력의 사용이 요구됩니다."
