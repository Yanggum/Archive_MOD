 TRM_appeasement_germany_modifier: "German Appeasement"
 TRM_appeasement_germany_modifier_desc: "Trinity General School is using various measures to suppress contact between Germans and German terrorist groups. One such measure is an appeasement policy toward Germans who do not support terrorist groups."
 TRM_appeasement_germany_modifier_tt: "§Y$TRM_appeasement_germany_modifier$§! Modifier:"
 TRM_pro_german_propaganda_modifier: "Pro-German Propaganda"
 TRM_pro_german_propaganda_modifier_desc: "Unlike previous Trinity rulers, Host Misono Mika is showing a tendency to actively recruit and utilize Germans to win their favor. Trinity, having removed German interference, appears to be leading a transformation by eliminating political opponents, but this will gradually be revealed as nothing more than an illusory propaganda."
