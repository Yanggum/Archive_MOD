 TRN_Mika_desc_social_problem_cat: "Whether the newly born second Trinity will fail in the second test of history to come, or lead the academy to a stage of unprecedented greatness, only time will tell."
 TRN_Nagisa_desc_social_problem_cat: "Another ordeal awaits Trinity after overcoming the crisis. Whether it fails or succeeds in the second test of history to come depends only on her."
 TRN_general_desc_social_problem_cat: "To resolve the threat to Trinity, cooperation with them will be inevitable. Only by achieving a balance on the scales of the relationship between Trinity and Germany will true integration become possible."

