 trinity_divine_mandate_events.1.t: "폴란드 신성통치령의 운명"
 trinity_divine_mandate_events.1.desc: ""
 trinity_divine_mandate_events.1.a: "우리는 신뢰할 수 있는 트리니티 학생이 필요하다."
 trinity_divine_mandate_events.1.b: "어쩌면 현지인이 좀 더 잘할지도 모른다."
 trinity_divine_mandate_events.2.t: "동남 신성통치령의 운명"
 trinity_divine_mandate_events.3.t: "동북 신성통치령의 운명"
 trinity_divine_mandate_events.4.t: "동방 신성통치령의 운명"
 trinity_divine_mandate_events.4.c: "...아니면 좋은 생각이 있는데 말이야."
 TRN_trndivine_4_tt: "$TRN_Kirifuji_Nagisa$는 동방 신성통치령의 집행관이 될 것입니다."
 trinity_divine_mandate_events.6.t: "남방 신성통치령의 운명"
 trinity_divine_mandate_events.7.t: "트리니티 과학기술부 수립"
 trinity_divine_mandate_events.7.desc: "트리니티가 밀레니엄을 정복하면서 밀레니엄의 첨단 기술들을 손에 넣을수 있게 되었습니다. 트리니티는 이 첨단 기술들을 활용하기 위해 '과학기술부' 라는 동아리를 만들어 이들에게 영토를 양도했습니다. 그러나 지도자에 대한 논의는 끊이지 않고 계속 되고 있습니다."
 trinity_divine_mandate_events.8.t: "프랑스 군민행정부의 운명"
 trinity_divine_mandate_events.9.t: "총학생회장 임명"
 trinity_divine_mandate_events.10.t: "벨라루스 중앙 라다의 운명"
 trinity_divine_mandate_events.10.desc: "벨라루스 중앙라다는 트리니티 정보기관에 벨라루스로부터 전쟁 협력을 확보하기 위해 괴뢰 정부 수립을 건의했고, 이 제안은 받아들여졌습니다. 라다슬라우 아스트로우스키를 대통령으로 내세워 벨라루스 중앙라다라는 괴뢰국을 설립했습니다.\n\n그러나 이 괴뢰국은 명목상 존재에 불과했고 실권은 동북 국가판무관부가 장악하고 있었습니다. 현지 협력이 다소 원활해진 것 외에 전쟁 수행에 큰 도움을 얻지는 못했습니다. 다만 여러 학생들의 잔혹 행위를 저지했고, 트리니티가 전쟁에서 승리하면서 역사적 의미를 지니게 되었습니다."
 trinity_divine_mandate_events.10.a: "흥미로운데? 중앙 라다를 확장하자."
 trinity_divine_mandate_events.10.b: "고맙지만 특별한 지위를 가질 이유는 되지 않는다."


 trinity_flavor_events.9999.t: "이 이벤트가 보인다면 디스코드에 신고 해주세요."
 trinity_flavor_events.9999.desc: "이 이벤트가 보였다면 디스코드에 신고 해주세요 링크는 다음과 같습니다.\nhttps://discord.gg/kddrRNS6dt\n\n만약 치트와 같은 상황에서 이 이벤트를 보았다면 딱히 신고하지 않아도 괜찮습니다. 그러나 다시 한번 말씀드리자면, 일반적으로 진행하던 와중 이 이벤트를 보았다면 디스코드에 신고해 주시길 바랍니다."
 trinity_flavor_events.9999.a: "꼭 링크로 들어와 신고 해주세요."

# 에덴 조약
 eden_treaty_negotiation_cat: "에덴 조약 재협상"
 eden_treaty_negotiation_cat_desc: "\n\n\n\n\n\n\n게헨나와 트리니티 두 학원의 오랜 분쟁과 갈등을 중단하고자 한 시도가 없었던 것은 아닙니다. 그 중에서도 가장 최근에 있었던 평화 조약 시도는, §Y총학생회장§!의 개입으로 대전이 이전부터 추진되어 왔던 §Y에덴 조약§!입니다. 두 학원의 평화 조약은 한 번 흔들렸으나, [GEH.GetLeader] 측과 [TRM.GetLeader] 측의 굳건한 의지가 모여 다시 한 번 실무자 협상을 시작했습니다.\n\n하지만 §Y대중들의 불만§!으로 인해 협상은 단기간에 이루어지기 어렵습니다. 두 학원은 단순히 지도자들의 우정만으로 평화를 이루어내는 것이 아니라, 트리니티와 게헨나 두 곳의 시민들이 모두 납득할 수 있는 대중적 지지를 이끌어내야만 합니다.\n\n§Y파테르 분파§!와 §Y[GEM.GetNameDef]§! 역시 에덴 조약의 변수입니다. 파테르 분파는 대중 선동을 통하여 트리니티에서 반대 여론을 이끌어 내려 노력할 것이며, [GEM.GetLeader] 측은 게헨나 대중을 선동하려고 할 것입니다. 에덴 조약의 재협상이 성공할 것인지 여부는 매우 복잡한 역학 구도 아래에 있으며, 누구도 감히 결과를 확신할 수 없습니다.\n\n§G특수 룰§!: 협상 점수가 §G75점§! 이상이면서, 상대편보다 §Y15점§! 이상 높으면 승리합니다.\n\n£GFX_BA_game_rule_flag_GEH £GFX_BA_game_rule_flag_TRM 에덴 조약 체결파: [?global.eden_point_array^0]\n£GFX_BA_game_rule_flag_GEM £GFX_BA_game_rule_flag_TRM 에덴 조약 반대파: [?global.eden_point_array^1]"
