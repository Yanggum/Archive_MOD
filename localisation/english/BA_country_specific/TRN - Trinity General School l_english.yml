 trinity_divine_mandate_events.1.t: "Fate of the Southeast Trinity Divine Mandate"
 trinity_divine_mandate_events.1.desc: "The dust of war has settled in the southeast. How shall we govern this new addition to our fold? A strict hand may be needed, but a gentle touch might yield more in the long run."
 trinity_divine_mandate_events.1.a: "We need a reliable Trinity student."
 trinity_divine_mandate_events.1.b: "Perhaps a local would do better."
 trinity_divine_mandate_events.2.t: "Fate of the Southeast Divine Mandate"
 trinity_divine_mandate_events.3.t: "Fate of the Northeast Divine Mandate"
 trinity_divine_mandate_events.4.t: "Fate of the Eastern Divine Mandate"
 trinity_divine_mandate_events.4.c: "...Actually, I have a good idea."
 TRN_trndivine_4_tt: "$TRN_Kirifuji_Nagisa$ will become the Executive Officer of the Eastern Divine Mandate."
 trinity_divine_mandate_events.6.t: "Fate of the Southern Divine Mandate"
 trinity_divine_mandate_events.7.t: "Establish Trinity Ministry of Science and Technology"
 trinity_divine_mandate_events.7.desc: "As Trinity conquered Millennium, it came into possession of Millennium's advanced technologies. To utilize these advanced technologies, Trinity created a club called the 'Ministry of Science and Technology' and transferred territory to them. However, discussions regarding the leader continue unceasingly."
 trinity_divine_mandate_events.8.t: "Fate of the French Military-Civilian Administration"
 trinity_divine_mandate_events.9.t: "Appointment of General Student Council President"
 trinity_divine_mandate_events.10.t: "Fate of the Belarusian Central Rada"
 trinity_divine_mandate_events.10.desc: "The Belarusian Central Rada suggested the establishment of a puppet government to Trinity's intelligence agency to secure war cooperation from Belarus, and this proposal was accepted. Radaslaw Astrouski was put forward as president to establish a puppet state called the Belarusian Central Rada.\n\nHowever, this puppet state existed only in name, and real power was held by the Northeast Divine Mandate. Other than local cooperation becoming somewhat smoother, it did not provide much help in conducting the war. However, it prevented atrocities by several students and gained historical significance as Trinity won the war."
 trinity_divine_mandate_events.10.a: "Interesting. Let's accept their demands."
 trinity_divine_mandate_events.10.b: "Thanks, but it's no reason to have a special status."


 trinity_flavor_events.9999.t: "If you see this event, please report it on Discord."
 trinity_flavor_events.9999.desc: "If you saw this event, please report it on Discord. The link is as follows:\nhttps://discord.gg/kddrRNS6dt\n\nIf you saw this event in a situation like a cheat, you don't really have to report it. However, to say it once more, if you saw this event while progressing normally, please report it on Discord."
 trinity_flavor_events.9999.a: "Please make sure to enter the link and report it."

# Eden Treaty
 eden_treaty_negotiation_ALT_cat: "Eden Treaty Renegotiation"
 eden_treaty_negotiation_ALT_cat_desc: "\n\n\n\n\n\n\nAttempts to stop the long-standing disputes and conflicts between the two academies, Gehenna and Trinity, have not been non-existent. Among them, the most recent peace treaty attempt is the §YEden Treaty§!, which had been pursued since before the Great War with the intervention of the §YGeneral Student Council President§!. The peace treaty between the two academies was once shaken, but the firm will of the [GEH.GetLeader] side and the [TRM.GetLeader] side came together to start negotiator-level talks once again.\n\nHowever, due to the §Ypublic's dissatisfaction§! and the intervention of the §YPater Faction§!, negotiations are difficult to achieve in a short period. The two academies must draw broad support that both the citizens and interest groups of Trinity and Gehenna can be convinced of, rather than achieving peace simply through the friendship of the leaders.\n\n§Y[GEM.GetNameDef]§! is also a variable of the Eden Treaty. The [GEM.GetLeader] side will try to incite the Gehenna public by emphasizing the unreasonableness of this treaty. Whether the renegotiation of the Eden Treaty will succeed is under a very complex dynamic structure, and no one can dare to be sure of the result.\n\n§GSpecial Rule§!: Victory is achieved if the negotiation score is §G75 points§! or higher and §Y15 points§! or more higher than the opponent's.\n\n£GFX_BA_game_rule_flag_TRM £GFX_BA_game_rule_flag_GEH Eden Treaty Proponents: [?global.eden_point_array^0]\n£GFX_BA_game_rule_flag_GEM £GFX_BA_game_rule_flag_GEH Eden Treaty Opponents: [?global.eden_point_array^1]"
 eden_point_array_tt: "§G[ROOT.GetNameWithFlag]§! Influence Score: $RIGHT|+=%%0$"
 eden_point_array_pater_tt: "Opponents' Influence Score: $RIGHT|-=%%0$"

## Pandemonium Society Decisions
 eden_treaty_negotiation_imperial_metrology_ALT: "Trinity-style Imperial Weights and Measures"
 eden_treaty_negotiation_imperial_metrology_ALT_desc: "We advertise to Gehenna students that if the Eden Treaty with Trinity is signed, the metric system will be abolished and the imperial system will be used. No, maybe it's not just simple propaganda. Wouldn't the witches of Trinity really bring the yard-pound system? I heard that in Trinity, a 'ton' is 1,016.047 kilograms (2,240 pounds)! It makes me 16.047 kilograms angry!"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT: "Prefect Team Lead Hasumi Conspiracy Theory"
 eden_treaty_negotiation_prefect_team_leader_hasumi_ALT_desc: "What changes will come to Gehenna after the Eden Treaty is signed? Already Trinity is talking about so-called 'joint policing' and trying to conduct security activities in Gehenna as well. They are laying the first stone for a joint military organization called the 'ETO.'\n\nYes. Maintaining security jointly! That means Hasumi, who eats six cups of parfaits in one meal, will settle down in Gehenna land, oppress Gehenna's freedom, and even steal Ibuki's pudding. How terrible and frightening is this story? Weekly Pandemonium will spread this news far and wide."
 eden_treaty_negotiation_weekly_pandemonium_ALT: "Media Play in Weekly Pandemonium"
 eden_treaty_negotiation_weekly_pandemonium_ALT_desc: "Even if the popular popularity of Weekly Pandemonium is not that high, the media is the propaganda tool we can use best. Slanderous articles against both the Prefect Team and Trinity are expected to somewhat shake the public's opinion."
 eden_treaty_negotiation_talk_makoto_ALT: "[ROOT.GetLeader]'s Public Incitement"
 eden_treaty_negotiation_talk_makoto_ALT_desc: "Our leader directly criticizes the unreasonableness of the Eden Treaty and the backroom agreement between [GEH.GetLeader] and [TRM.GetLeader] in front of the public. It's not important whether there is evidence or not, but whether we can instill anxiety in the public."

## Trinity General School Decisions
 eden_treaty_negotiation_trinity_propaganda_ALT: "Concessions to Gehenna"
 eden_treaty_negotiation_trinity_propaganda_ALT_desc: "Even if there are said to be large concessions for many political interests and the Pater Faction, we cannot let even the current treaty fly away beyond those interests. What's important is to get the signature on the treaty first."
 eden_treaty_negotiation_pro_gehenna_ALT: "Pro-Gehenna Cultural Propaganda"
 eden_treaty_negotiation_pro_gehenna_ALT_desc: "We use marketing that makes Gehenna's culture seem not bad to Trinity students, or even elegant. The best propaganda target will be Kurodate Haruna. Although she is a somewhat foolish woman, she has dignified speech and gestures, so if broadcasted through appropriate editing, it can instill an awareness in the public that Gehenna and Trinity are not that different."
 eden_treaty_negotiation_pro_prefect_team_ALT: "Joint Security Activities with the Prefect Team"
 eden_treaty_negotiation_pro_prefect_team_ALT_desc: "The non-JTF organizations protecting Trinity's security are no longer just the Vigilante Crew. From the streets of Eden to cottages in the countryside, execution members of the Gehenna Prefect Team are cooperating in maintaining security, and the heroes of Gehenna who destroy the Helmet Gang and fascists can leave a great impression on the public."
 eden_treaty_negotiation_talk_nagisa_ALT: "[ROOT.GetLeader] Stepping Forward"
 eden_treaty_negotiation_talk_nagisa_ALT_desc: "[ROOT.GetLeader] directly persuades the wealthy of Trinity by holding events such as social parties and book launches. A meeting with the Host has an amazing power of persuasion."
 eden_treaty_negotiation_remove_angry_JTF_ALT: "Dealing with Internal Backlash in the JTF"
 eden_treaty_negotiation_remove_angry_JTF_ALT_desc: "We will visit the Justice Task Force directly, where the [ROOT.GetLeader] side will persuade them of the peace benefits that the alliance between Trinity and Gehenna brings, and barely calm Hasumi with gifts and various benefits."

## Various Blunder Decisions (AI Selected, Mission Style)
 eden_treaty_negotiation_host_ALT: "Pressure to Secure Superiority"
 eden_treaty_negotiation_host_ALT_desc: "Various anti-Gehenna factions, including the Pater Faction, want Trinity to hold a firm advantage over Gehenna in this negotiation. Therefore, we apply various pressures to the Gehenna academy to take various economic benefits in the treaty, and the negotiation may become unstable, but there should be no big problem... probably."
 eden_treaty_negotiation_sardine_pie_ALT: "Backlash from Hardliners in Gehenna"
 eden_treaty_negotiation_sardine_pie_ALT_desc: "Some Gehenna students and citizens who belong to neither Pandemonium nor the Prefect Team are firmly opposing this negotiation. In particular, Trinity-imperialism slogans from groups combined with local German labor organizations can be found at more sites than expected, and their nationalistic and anti-capitalistic backlash seems to be the biggest enemy in our negotiation."
 eden_treaty_negotiation_angry_JTF_ALT: "Internal Backlash in the Justice Task Force"
 eden_treaty_negotiation_angry_JTF_ALT_desc: "Since Hasumi of the Justice Task Force shows a significant anti-Gehenna tendency, she is passively expressing her personal opposition despite the participation of various anti-Gehenna opposition parties, including Misono Mika, in the negotiation. Opinions of hardliners opposing the negotiation itself are gathering, and a larger backlash than expected is spreading here and there...."

## Gehenna Prefect Team Decisions
 eden_treaty_negotiation_gehenna_propaganda_ALT: "Gehenna Propaganda"
 eden_treaty_negotiation_gehenna_propaganda_ALT_desc: "No matter how much the Pandemonium Society barks like dogs with rabies, we have no choice but to move forward. We will create media buyouts and pro-treaty articles to persuade people that Trinity is not such a threatening external force."
 eden_treaty_negotiation_pro_trinity_ALT: "Pro-Trinity Cultural Propaganda"
 eden_treaty_negotiation_pro_trinity_ALT_desc: "Our reliable Execution Captain Shiromi Iori also loves Trinity's beautiful uniforms. Trinity is a good academy that creates wonderful culture and high-end clothing, and has various cultures (except for sardine pie and old weights and measures) that can fascinate Gehenna students. How can the girls of Gehenna not love Trinity?"
 eden_treaty_negotiation_pro_JTF_ALT: "Joint Security Activities with the JTF"
 eden_treaty_negotiation_pro_JTF_ALT_desc: "Joint security activities with the Justice Task Force may make Gehenna's delinquent students angrier, but it can give Gehenna citizens an awareness that 'it's thanks to the joint front of the two academies that our security is protected.'"
 eden_treaty_negotiation_talk_hina_ALT: "[ROOT.GetLeader] Stepping Forward"
 eden_treaty_negotiation_talk_hina_ALT_desc: "[ROOT.GetLeader] preaches her pro-treaty thoughts, focusing on the general members of the Prefect Team. Trust in the leader will arouse support for the Eden Treaty within the Prefect Team."

