 TRN_tea_party_name: "Tea Party"
 TEA_PARTY_DESC: "When Trinity was caught in a mysterious phenomenon and disaster struck the academy, the Host convened an emergency meeting. Accordingly, representatives of each sect gathered to lead Trinity under a triumvirate system.\n\nNow that the crisis has been somewhat managed, the emergency meeting is scheduled to dissolve after a new Host is elected."
 TRN_Kirifuji_Nagisa: "Kirifuji Nagisa"
 TRN_Kirifuji_Nagisa_desc: "The head of the Filius branch and leader of Trinity, Nagisa Kirifuji, was born into a wealthy family. Growing up with her childhood friend Mika Misono, she displayed her brilliance from the time of her admission and joined the Filius branch at the invitation of the Tea Party. Representing realism, she has served as a mediator within the sect and is evaluated as a key figure who resolved issues between various branches since taking office as head.\n\nHowever, her current position is under serious threat. Her long-time childhood friend and confidant, Mika Misono, is moving behind the scenes to usurp power. The Sisterhood, the Remedial Knights, and the Justice Task Force are all under suspicion due to their actions following the incident. Additionally, there is constant noise within the Filius branch. Following the tragic assassination of Seia Yurizono, the Sanctus branch collapsed rapidly, and moderate to progressive officials joined Filius in large numbers, further intensifying internal conflicts.\n\nNagisa Kirifuji is now in a situation like walking on the edge of a blade. A single misstep, and countless sword points will be aimed at her."
 TRN_Yurizono_Seia: "Yurizono Seia"
 TRN_Yurizono_Seia_leader_desc: "The Host of Trinity and head of the Sanctus branch, Seia Yurizono, is undoubtedly one of the wisest individuals in the academy. However, her wisdom is never kind. Her speech, which goes beyond cryptic to subtly offend the listener, makes it difficult to tell if it's a wicked hobby aimed at others or a natural behavior born of deep pessimism. Nevertheless, the fact that she reigns at the pinnacle of the Sanctus branch proves the effectiveness of her leadership.\n\nSince the Great Transfer, her pessimistic attitude has crossed the threshold. Now, even a hint of leisure has vanished from Seia's words, replaced by a chilling edge that borders on rudeness at times. She may believe herself to be Noah facing a massive tsunami. But the time granted to her as Host to complete the ark is a mere moment of one year. That time is too short to build a ship to escape the destined destruction. Therefore, she will readily use any means necessary to extend that brief reprieve.\n\nGlimpsing the future through the uncertain medium of dreams, Seia always wanders alone through a time that has not yet arrived. Whether that prophecy is a blessing from God or a curse named an eternally repeating nightmare is something only she herself will know."
 TRN_Misono_Mika: "Misono Mika"
 TRN_Misono_Mika_leader_desc: "How should one describe Mika Misono, the leader of Trinity? The epithets that describe her are numerous: Head of the Pater branch, the manifestation of an Archangel, a woman both clever and cynical yet impulsive. A dual personality who hides a meticulous and calculating nature behind an innocent smile. A hypocritical opportunist who believes the mission given to her is a conviction. According to her own writings: an unforgivable villain, a self-loathing witch, a sinner beyond redemption. She is a figure who remains unshaken even amidst self-hatred.\n\nThe titles and infamy surrounding Mika Misono all stem from her branch and fanatical supporters. Born into a wealthy family, she displayed brilliance from a young age and grew up under her parents' strict education. She was a childhood friend of Nagisa Kirifuji, and the two grew up carrying the expectations of Trinity, eventually achieving the feat of becoming heads of their respective branches, with Mika leading Pater.\n\nTo her followers, Mika Misono is a presence that inspires inspiration and worship. She promised the vision of a 'Strong Trinity,' more powerful and hegemonic, which no one else dared to speak of. To reclaim the glory of the old-fashioned but brilliant Trinity hegemony. To bring forth a new light at the end of a fading dawn."
