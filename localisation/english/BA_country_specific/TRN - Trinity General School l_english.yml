 TRN_poland_trinity_border_dispute_modifier_tt: "(§Y@TRM[TRM.GetName]§!) §Y@POL[POL.GetName]§!에 대한 의견 §t-30§!\n(§Y@POL[POL.GetName]§!) §Y@TRM[TRM.GetName]§!에 대한 의견 §t-30§!"
