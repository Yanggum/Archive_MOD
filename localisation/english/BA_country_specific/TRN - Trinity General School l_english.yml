 TRM_bop_soc_100: "더 나은 세상, 새로운 이념"
 TRN_trinity_militarism: "이념주의자"
 TRN_bop_militarism_50: "떠오르는 이념주의자"
 TRN_bop_militarism_75: "파테르-이념주의자"
 TRN_bop_militarism_100: "트리니티 반동주의"
 
 TRN_economic_evelopment_department: "학원경제개발부"
 TRN_economic_evelopment_department_desc: "[TRN_eed_cat_desc]"
 TRN_eed_cat_desc_Mika: "미소노 미카의 명령으로 설립된 학원경제개발부는 트리니티의 군수 산업 발전을 위해 산업 구조를 재편하고 있습니다. 이 부서는 미소노 미카의 재가 없이도 경제와 산업 부문에 한해서는 호스트와 유사한 역할을 수행하고 있습니다. 앞으로 학원경제개발부는 트리니티를 그 어느 때보다 강하게 만들 경제 계획을 수립하는 임무를 맡게 됩니다."
 TRN_eed_cat_desc_general: "학원경제개발부는 호스트의 명령에 따라 설립된, 학원의 경제를 전문적으로 관리-운영하는 조직입니다. 부장은 학원의 중장기 발전 전략을 수립하고, 다양한 경제 분야를 총괄하는 역할을 맡고 있습니다. 트리니티 종합학원이 넓은 부지를 상실한 상태에서, 학원경제개발부에는 그 어느 때보다 정밀하고 체계적인 계획이 요구되고 있습니다."
 TRN_Industrial_Regions: "[FROM.GetName] 산업지구 조성"
 TRN_industrial_region_state_trigger: "최대 3개의 주만 지정할 수 있음. 현재 [?TRN_industrial_region_state]개의 주를 지정함."
 TRN_air_factory_decision: "트리니티 항공 엔진 및 무기 사업"
 TRN_garden_city_movement: "정원 도시 운동"
 TRN_garden_city_movement_desc: "에덴은 재건을 통해서 어느정도 이전의 모습을 갖췄습니다. 그럼에도 아직 도시는 온전히 치유되지 않았습니다. 이전보다 생활 환경을 개선하고 산업 역량 개발을 지원해야 할 것입니다. 가족 주택, 중밀도 주택, 공유 서비스와 편의 시설, 넓은 녹지 공간이 갖춰질 예정입니다."
 TRN_embrace_chain_production: "대량 생산 수용"
 TRN_trade_controls: "무역 통제"
 
 TRN_economic_plan_cat: "트리니티 산업 계획"
 TRN_economic_plan_cat_desc: "사태 발생 이후 이어진 경제 위기, 축소된 학원 부지, 무너진 사회 질서, 그리고 하락세를 보이는 각종 경제 지표는 티파티 호스트의 보다 적극적인 경제 개입을 요구하고 있습니다. 다가올 위기에 대비하기 위해서는 방대하고 체계적인 산업 개발이 반드시 추진되어야 하며, 이는 모교의 안정과 회복을 위한 핵심 과제가 될 것입니다."
 TRN_industry_deicision_active: "다른 곳에서 산업 계획이 진행되고 있습니다."
 TRN_Infrastructure_development_fake: "트리니티 기반시설 재건설"
 TRN_Infrastructure_Development: "[FROM.GetName] 기반시설 재건설"
 TRN_Infrastructure_Development_desc: "대전이 사태로 기반시설이 붕괴한 가운데, 구시대 독일국이 남긴 낡은 아스팔트 도로는 트리니티의 주요 차량 운용에 적합하지 않습니다. 이에 따라, 노후된 인프라를 전면적으로 교체하는 대규모 토목 사업의 필요성이 제기되었습니다. 새롭게 구축될 고속도로망은 평시에는 민간의 편의를 높이고, 전시에는 군용 차량의 신속한 전국 이동을 가능하게 해 줄 것입니다."
 TRN_Infrastructure_Development_active_flag: "기반시설이 다른 주에서 건설되고 있습니다."
 TRN_Abydos_clearing_sand: "[FROM.GetName] 생태계 복원"
 TRN_Peat_Extraction: "북부 황야 지역 토탄 채굴"
 TRN_Peat_Extraction_desc: "북부 지역에는 수많은 습지, 늪지, 황무지가 있습니다. 이 곳은 원래 사람이 살지 않았지만 개척이 되면서 사람들이 살기 시작했고 이러한 개척을 통해 우리는 이 지역의 경제적 잠재력에 대해 알 수 있습니다.  황무지는 땅에서 파내 지역 산업과 개인 가정에 보조 연료로 사용할 수 있는 석탄이나 목재의 저품질 대체 연료인 토탄의 훌륭한 공급원입니다."
 TRN_Opelwerk_Brandenburg: "오펠부르크 브란덴부르크 인수"
 TRN_Opelwerk_Brandenburg_desc: "독일의 주요 자동차 제조업체였던 오펠부르크 브란덴부르크는 1920~1930년대에 걸쳐 꾸준히 성장했으나, 대전이 사태의 직격탄을 맞으며 심각한 타격을 입었습니다. 그러나 이들이 보유한 자동차 제조 기술은 여전히 혁신적이며, 만약 이를 인수하여 국영 기업으로 전환한다면, 수천 대의 트럭을 생산할 수 있는 기업을 확보할 수 있을 것입니다."
 TRN_Lehnmuhle_Dam: "작센 댐 재건"
 TRN_Lehnmuhle_Dam_desc: "대전이 사태 당시 주요 격전지 중 하나였던 작센에서는 치열한 전투 끝에 댐이 붕괴되어 대규모 침수 사태가 발생했습니다. 트리니티의 티파티 호스트와 각 분파 임원들은 이 지역의 댐 재건을 최우선 과제로 삼았으며, 특히 동부 에르츠산맥 일대에서 끊임없이 발생하는 홍수와 현지 전력 공급원에 대한 수요가 급증하고 있음을 강조했습니다."
 TRN_Basis_Scholar_development: "바시스 스콜라 개발"
 TRN_Basis_Scholar_development_desc: "바시스 스콜라는 구호기사단의 빠른 대응 덕분에 독일군의 공격으로부터 큰 피해를 면할 수 있었습니다. 이들의 집요한 노력은 주민들로 하여금 현 정부에 깊은 신뢰와 우호감을 갖게 만들었고, 이는 지역 안정에 크게 기여하고 있습니다. 이제 이 지역과 연계한 산업 계획을 추진한다면, 보다 빠른 공업화를 실현할 수 있을 것입니다. 특히 오데르 강과의 인접성은 물류와 자원 수송 측면에서 큰 이점으로 작용할 것입니다."
 TRN_Kimigayama_shipbuilding_plant: "키미가야마 조선소"
 TRN_Kimigayama_shipbuilding_plant_desc: "새로운 해양은 트리니티의 조선 산업에 신선한 활력을 불어넣기에 충분하며, 이는 조선소에 대한 대규모 투자를 요구합니다. 그러나 이러한 투자는 결코 헛되지 않을 것입니다. 충분한 자본과 자원이 투입된다면, 이들이 가져올 경제적-전략적 보상은 가늠하기 어려울 만큼 클 것입니다."
 TRN_Stettin_heavy_industry: "[63.GetName] 항공 사업"
 TRN_Stettin_heavy_industry_desc: "[63.GetName] 지역은 북해와 인접해 있어, 북동유럽을 향한 공중 작전과 해상 통제에 탁월한 지리적 이점을 갖고 있습니다. 이에 따라 지역 당국과 협력해 대규모 공항을 건설하고, 본격적인 항공 산업 기반을 다질 계획입니다."
 TRN_dessert_shop_expansion: "디저트 가게 확충"
 TRN_dessert_shop_expansion_desc: "지도자는 늘 끊임없이 사고해야 하고, 사고에는 고열량의 에너지가 필요합니다. 자연스럽게, 인간은 이 모든 조건을 만족시키면서도 달콤하고 잠시나마 근심을 잊게 해주는 무언가를 찾게 됩니다. 바로 디저트입니다."
 TRN_agricultural_support: "[FROM.GetName] 농업 지원"
 TRN_katowice_mining: "[FROM.GetName] 광업 확대"
 TRN_stettin_oil_mining: "슈테틴 석유 매장지 개발"
 TRN_stettin_oil_mining_desc: "슈테틴 북서쪽의 항구 도시인 슈비네뮌데에서 약 6km 떨어진 지점에서 유전이 존재한다는 보고서가 있습니다. 이 발견은 특히 연료가 부족한 트리니티에게 부족분을 보충할 수 있는 기회를 제공하며, 동시에 수입 화석 연료에 대한 의존도를 획기적으로 줄일 수 있는 잠재력을 지니고 있습니다."
 TRN_rebuilding_Landwehrkanal: "란트베어 운하 복구"
 TRN_rebuilding_Landwehrkanal_desc: "대전이 사태로 인해 란트베어 운하가 심각한 피해를 입어 곳곳이 파괴되었고, 그 결과 사용이 불가능해졌습니다. 특히 이 운하는 마그데부르크에서 바시스 스콜라까지 한 번에 화물을 운송할 수 있는 큰 장점을 지니고 있어, 그 가치가 높게 평가됩니다."

 TRN_trinity_world_cat: "트리니티와 세계"
 TRN_trinity_world_cat_desc: "트리니티는 현재 세계로부터 고립되어 있으며, 이는 충분히 외교적 노력으로 극복 가능한 문제입니다. 그러나 지정학적 요인은 여전히 우리를 옥죄고 있으며, 이 복합적인 위기는 외교를 시작으로 하나씩 해결해 나가야 합니다. 우리는 결코 좌절하지 않습니다."
 TRN_lend_our_support: "우리의 지원 빌려주기"
 TRN_international_propaganda: "국제 선전"
 TRN_international_propaganda_tt: "획득한 정치력의 양은 공장 수에 따라 결정됩니다."
 TRN_border_fortifications: "국경 요새화"
 TRN_anti_pandemonium_society: "[GEM.GetNameDef] 권위 폄하"
 TRN_create_pro_trinity_group: "[GEM.GetAdjective] 지역 독일인 동요"
 TRN_pandemonium_society_approach_club_Hot_Springs_Department: "온천개발부에 접근"
 TRN_pandemonium_society_approach_club_Gourmet_Research_Society: "미식연구회에 접근"
 TRN_prefect_team_discipline_decline: "[GEH.GetNameDef] 규율 훼손"
 TRN_romania_give_the_oil: "루마니아 유전지대 확보"
 TRN_romania_give_the_oil_desc: "트리니티의 산업, 차량, 그리고 전쟁기계들이 원활하게 가동되기 위해서는 석유가 필요합니다. 루마니아의 유전 지대는 우리의 수요를 충족시킬 수 있는 충분한 공급량을 보유하고 있습니다. 그러나 루마니아 정부는 우리에게 비협조적인 태도를 보이고 있으며, 이러한 상황을 타개하기 위해서는 무력의 사용이 요구됩니다."
 TRN_support_HYA_decision: "[HYA.GetNameDef] 측과 협력"
 TRN_support_HYA_var_tt: "§Y[HYA.GetNameWithFlag]§! 측에게 §Y[TRM.GetNameWithFlag]§! 측과 협력하는 §Y사건이 발생§!합니다. 최대 횟수는 §Y3회§!이며 현재 §Y[?TRN_support_HYA_var]회§! 협력했습니다.\n\n만약 §Y3회§! 이상 협력했다면, §Y결정이 제거§!됩니다."
 TRN_support_HYA_decision_remove_tt: "현재 §Y[?TRN_support_HYA_var]회 협력§!했습니다. 조건을 만족하였기에 다음의 효과가 나타납니다:"
 TRN_influence_baltics_decision: "[FROM.GetName] 측에게 영향력 행사"
 TRN_influence_the_baltics_unlock_tt: "만약 §Y발트 국가§!가 독립국으로 존재한다면:\n£decision_icon_small §Y결정 해금§!: 발트 국가에게 영향력 행사"
 TRN_german_influence: "트리니티의 영향력"

 # 발칸 외교 
 TRM_diplomacy_balkan_decision_category: "$ITA_diplomacy_balkan_decision_category$"
 TRM_diplomacy_balkan_decision_category_desc: "발칸은 \"유럽의 화약고\"로 불릴 만큼 충돌이 잦은 지역입니다. 이는 국가 간 갈등을 조장하고 이간질하기에 적합한 환경임을 의미합니다. 따라서 우리는 신중하고 전략적으로 접근해야 합니다. \n\n발칸 국가들 간의 관계를 적절히 조율해 우리의 이익에 부합하는 방향으로 그들의 정책을 유도해야 합니다. 궁극적으로, 모든 발칸 국가를 우리에게 종속시키거나 동맹국으로 만들 수 있도록 장기적인 계획을 수립해야 할 것입니다."
 TRM_send_ultimatum_to_country_balkan: "$SOV_send_ultimatum_to_country_balkan$"
 TRM_pressure_country_government_balkan: "$SOV_pressure_country_government_balkan$"
 TRM_promote_ideology_rallies_balkan: "$SOV_promote_ideology_rallies_balkan$"
 TRM_pressure_government_cd_tt: "\n우리는 §Y[?TRM_pressure_government_cd]§!일에 한 번만 압박할 수 있습니다."
 TRM_pressure_government_active_flag: "$SOV_pressure_government_active_flag$"
 
# 문화투쟁
 TRN_Kulturkampf_cat: "교회 투쟁"
 TRN_Kulturkampf_cat_description: "대전이 사태는 트리니티의 신앙과 독일의 신앙을 정면으로 맞부딪치게 만들었습니다. 전투에서 우리는 승리했지만, 여전히 독일인들은 트리니티의 신앙을 '이계에서 온 불쾌한 이교도'라 부르며 멸시하고 있습니다. $GER_dietrich_bonhoeffer$를 앞세운 그들의 저항은 집요하지만, 트리니티는 흔들리지 않습니다. 우리는 격동의 시기를 넘어 신앙을 지켜내야 하며, 마침내 독일인들을 트리니티의 진정한 신앙으로 이끌어야 합니다."
 TRN_Kulturkampf_info_tt: "§g디트리히 본회퍼§!는 끊임없이 행동을 취하며 §M미소노 미카§!를 강하게 압박할 것입니다. 어떤 사소한 결정 하나가 §g그§!의 압박을 더욱 §t거세게§! 만들 수도, 반대로 §C완화§!시킬 수도 있을 것입니다."
 TRN_Kulturkampf_bar_tooltip: "[TRN_Kulturkampf_bar_tooltip_script_loc]"
 TRN_Kulturkampf_tooltip_mika_dominant: "트리니티 신앙이 우세입니다."
 TRN_Kulturkampf_bar_tooltip_bonhoeffer_dominant: "현지 신앙이 우세입니다."
 TRN_Kulturkampf_tooltip_balanced: "서로 균형을 유지하는 중입니다"
