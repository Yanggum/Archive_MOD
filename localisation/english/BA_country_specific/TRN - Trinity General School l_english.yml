 TRN_TrinityMikaDiplomacySpainAttack_desc: "지브롤터가 섬이 아닌건 저도 알아요"
 TRN_Kyrie_eleison: "Kýrie, eléison (자비송)"
 TRN_Kyrie_eleison_desc: "주님 우리에게 자비를 베푸소서. "
 TRN_breaking_concept_of_incomprehensibility: "불가해의 관념 혁파"
 TRN_breaking_concept_of_incomprehensibility_desc: "과거 우리가 관측했던 ‘불가해의 관념’이 다시 한 번 이곳에 출현했습니다. 그 경위는 여전히 불명확하지만, 과거 시스터후드의 자료에 따르면 이 존재는 다차원적 해석 능력을 기반으로 한 공격 양상을 보이며, 이는 모교는 물론 전 키보토스를 넘어 전 지구적 위협이 될 수 있습니다."
 TRN_war_with_GEI_tt: "§Y[ROOT.GetNameDef]§!(이)가 $GEI_The_Colour_party$ 측과 전쟁 중일때"

 # 군사 중점
 TRM_develop_the_heer_modifier: "트리니티 지상군" 
 TRM_develop_the_heer_modifier_desc: "수백 년 전, 트리니티의 지상 병력은 서로 간의 '내전'을 통해 군사적 역량을 가속적으로 발전시켜 왔고, 이러한 실전 경험은 교리의 이론적-전술적 성장으로 이어졌습니다. 이후 트리니티가 하나의 신념과 가치 아래 통합되면서, 비록 그 격동의 시기를 잊었을지언정, 그로부터 얻은 교훈만은 끝내 잊지 않았습니다."
 TRM_heer_modifier_change: "§Y$TRM_develop_the_heer_modifier$§! 변동치"
 TRM_VVS: "트리니티 공군"
 TRM_VVS_desc: "트리니티 공군의 시초, 항공의 어머니가 하늘에 새로운 지평을 열었을 때, 우리는 단순한 비행을 넘어선 군사적 패러다임의 전환을 맞이했습니다. 오늘날까지도 트리니티 공군은 하늘에서의 승리가 지상에서의 승리를 이끈다는 신념 아래 날아오르고 있습니다."
 TRM_navy: "트리니티 해군"
 TRM_navy_desc: "트리니티에게 '해군'이라는 개념은 다소 낯설 수 있지만, 결코 타 학원에 뒤처지지 않습니다. 우리는 많은 이들에게 바다의 중요성을 일깨웠고, 오늘도 승리에 대한 굳은 믿음 아래 당당히 출항합니다."

 TRN_research_rifle: "독일군 교리 분석"
 TRN_research_rifle_desc: "독일군의 전투 방식은 트리니티에게 낯설면서도 인상 깊은 것이었습니다. 기동력을 바탕으로 한 전격적인 돌파 전술은 트리니티 지휘부에 강한 충격과 함께 깊은 영감을 안겨주었고, 이는 곧 우리의 방식으로 재해석되어, 트리니티만의 독자적인 교리로 다시 태어날 것입니다."
 TRM_add_to_heer_ideas: "다음을 부여하는 §Y트리니티 지상군§! 추가:\n"
 TRM_Centralised_Command: "중앙화된 사령부"
 TRM_Centralised_Command_desc: "중앙화된 사령부는 군의 전투에 있어서 필수적입니다. 대참사를 불러오게 되는 모든 다른 방법은 우리가 무슨 수를 써서라도 피해야 할 필요가 있습니다. 장군들이 자신감 있고도 빠르게 승리로 이끌 수 있는, 잘 돌아가는 기계가 되어야만 군은 성공할 수 있습니다. 그러므로, 우리는 결합된 군사 지휘 체계를 만드는 것을 목표로 해야만 합니다."
 TRM_encourage_radio_use: "통신기 사용 장려"
 TRM_encourage_radio_use_desc: "과거의 전쟁에서 주요 혁신 기술로 무전기가 도입되었고, 이로 인해 군사 통신의 범위가 크게 확장되면서 전장에서의 지휘 및 통제 능력도 크게 향상되었습니다. 트리니티에서는 무전기의 사용이 아직 초기 단계에 머물러 있지만, 조금만 노력하면 이 새로운 기술을 우리 병력에 빠르게 적용시켜 적의 취약 지점을 대상으로 조직적이고 집중적인 타격을 가할 수 있습니다."
 TRM_Streamline_Intelligence_Gathering: "신속한 정보 수집"
 TRM_Streamline_Intelligence_Gathering_desc: "이해하지 못하는 적과 싸우는 것은 어렵습니다. 군대의 중앙집권화는 참모진에게 아군에 대한 지식을 제공했지만, 반대편에 있는 적군을 이해하는 것도 그에 못지않게 중요합니다. 이러한 정보를 수집하는 모든 수단은 군 구조에 통합되어야 합니다."
 TRM_Empower_the_Generals: "장군들에게 권한 부여"
 TRM_Empower_the_Generals_desc: "수백 년부터 내전을 겪으며 트리니티의 장군들은 모든 상황을 유연하게 대처할 수 있는 풍부한 경험을 쌓았습니다. 그들에게 필요한 것은 군대를 제대로 지휘할 수 있는 권한을 부여하고, 그 밑에 있는 사람들이 주의를 기울일 줄 아는 것뿐입니다."
 TRM_Protectors_of_the_Motherland: "모교의 수호자들"
 TRM_Protectors_of_the_Motherland_desc: "다른 군대는 황금, 명예, 신이 없는 이념을 위해 싸우지만 트리니티군은 학원과 십자가를 위해 싸웁니다. 트리니티는 많은 외국인에게 비밀이 많고 고고한 아가씨들의 학원이지만 트리니티 학생에게는 비밀이 없는 고향과도 같은 곳입니다. 트리니티 학생은 이 땅에서 위대하고 아름다운 일을 해왔고 앞으로도 할 것이며, 이 땅을 정복할 수 있다고 생각하는 학원은 큰 충격을 받을 것입니다."
 TRM_Asymmetric_Tactics: "임무형 전술"
 TRM_Asymmetric_Tactics_desc: "예로부터 불투명하고 느린 지휘 체계는 어려움을 불러왔고 전술적 패배를 앞당기는 체계입니다. 수백 년 전의 내전 당시에는, 의사결정권을 하급 부대에 분산시켜 현장 상황에 따라 하급 장교들이 상관의 명령을 수동적으로 기다리지 않고 전술적 판단을 스스로 내리도록 장려하는 문화를 조성하여 문제를 해결했습니다."
 TRM_Decentralised_Structure: "분권화된 구조"
 TRM_Decentralised_Structure_desc: "정통 군사 사상은 체스판의 말처럼 군대를 지휘하는 최고 장군의 우월성을 숭배하는 경향이 있습니다. 하지만 전쟁의 현실은 지저분하고 복잡합니다. 지나치게 중앙집권적인 지휘 구조는 현대 전쟁의 빠른 속도 속에서 경직되고 유연하지 못할 위험이 있습니다. 보다 분권된 구조는 이러한 함정을 피할 수 있습니다."
 TRM_Trinity_Field_Artillery: "트리니티 야전 포"
 TRM_Trinity_Field_Artillery_desc: "트리니티의 야포는 다른 학원에서도 명성이 자자합니다. 높은 정확도와 엄청난 파괴력으로 인해 폭격 지점은 말 그대로 평탄화됩니다. 이제 에덴 설계국과의 협업을 통해 트리니티만의 야포 성능을 더욱 향상시키고, 더 강력한 파괴력을 확보해야 합니다."
 TRM_Officer_Initiative: "장군 자율성"
 TRM_Officer_Initiative_desc: "현대 전쟁은 혼돈 그 자체입니다. 최고 사령부의 시각과 실제 전장 상황은 크게 다를 수 있으며, 상황은 순식간에 변할 수 있습니다. 따라서 현장 장교들에게 목표 설정과 중요 결정의 권한을 부여하는 것이 필요합니다. 이를 통해 우리 군은 압박 상황에서도 빠르게 적응하고 효과적으로 대응할 수 있습니다. 이는 분권화된 지휘 체계의 중요성을 강조하는 것으로, 현대 전장의 불확실성에 대처하는 효과적인 전략입니다."
 TRM_unity_of_doctrine: "교리 통일"
 TRM_unity_of_doctrine_desc: "트리니티 장교단은 경험이 풍부하고 뛰어난 실력을 갖추고 있으나, 군사 교리에 대한 접근은 천차만별입니다. 지상군 개혁은 주로 조직 문제에만 치중했고, 장군들은 각자 원하는 방식대로 전쟁을 수행할 수 있었습니다. 그러나 장교들마다 작전 수행 방식은 판이하며, 이는 일관된 군사적 성공을 거두는 데 걸림돌이 될 수밖에 없습니다."
 TRM_Reorganise_Armament_Production: "군수 생산 재편성"
 TRM_Reorganise_Armament_Production_desc: "현재의 무기 생산 현황은 한마디로 재앙과도 같습니다. 대전이의 여파가 아직도 남아있습니다. 생산 체인은 종종 단절되거나 구식이거나 둘 다인 경우가 많으며, 현대 군대가 싸울 수 있는 조건이 아닙니다. 이 시스템을 철저히 재편해야만 병사들이 트리니티의 적과 싸울 수 있는 총을 확보할 수 있습니다."
 TRM_Expand_the_Logistics_Corps: "보급부대 확장"
 TRM_Expand_the_Logistics_Corps_desc: "트리니티 내전 당시의 가장 큰 교훈 중 하나는 현대 군대에게 물류가 무엇보다도 중요하다는 것입니다. 군사 장비, 연료와 같은 특수 자원, 간단한 생활 필수품이 모두 적시에 제공되지 않으면 군대는 존재할 수 없습니다. 따라서 군대의 확장은 반드시 군수단의 확장과 함께 이루어져야 합니다."
 TRM_Local_Workshops: "지방 작업장"
 TRM_Local_Workshops_desc: "산업 전쟁 시대에는 군사 생산을 늘리기 위해 모든 수단을 강구해야 합니다. 전국의 지역 작업장 시스템을 통해 지역 상황을 고려한 방식으로 생산을 조직하고, 산업이 가능한 가장 작은 정착지까지 생산을 확대할 수 있습니다."
 TRM_Terrestrial_Dreadnoughts: "에덴 전차 설계부 확대"
 TRM_Terrestrial_Dreadnoughts_desc: "에덴 전차 설계부는 트리니티 내에서도 손꼽히는 기술력을 자랑하는 조직으로, 고품질 전차의 연구·설계·양산을 전문적으로 담당하고 있습니다. 이들은 전차 기술에 대한 깊은 이해와 수년간 축적된 노하우를 바탕으로, 키보토스 전체에서도 그 우수성을 인정받고 있습니다. 만약 이러한 시설과 인력을 더욱 확충하고, 설계부에 대한 지원을 강화한다면 트리니티는 향후 전차전에서 뚜렷한 전략적 우위를 점할 수 있을 것입니다."
 TRM_superb_training: "최고의 훈련"
 TRM_superb_training_desc: "군대의 강함은 병사 개개인의 전투력에 달려있습니다. 전쟁에서 새로운 기술과 혁명에 대한 모든 소음이 들리더라도 이를 활용하려면 필연적으로 군인이 있어야 하며, 무기 사용법을 훈련받지 않은 군인은 총을 든 농부에 불과합니다. 트리니티 군대는 세계 최고가 되어야 하며, 따라서 우리 군인들도 세계 최고가 되도록 훈련받아야 합니다."
 TRM_Expand_The_High_Command: "최고사령부 확장"
 TRM_Expand_The_High_Command_desc: "군의 최고 지휘부는 과거의 트리니티 내전 때처럼 높으신 분들의 사교 클럽이 될 수 없습니다. 군의 효율성을 저해하는 배타성과 파벌은 용납될 수 없으며 용납되지도 않을 것입니다. 대신 최고로 뛰어난 지휘관들이 모두 포함되도록 참모진을 확대할 것입니다. 최고 중의 최고만이 세계 최강의 군대를 이끌 수 있습니다."
 TRM_Officer_Training_Academies: "육군사관학교"
 TRM_Officer_Training_Academies_desc: "내전 당시의 기록으로 수많은 인재가 양성이 될 교본이 되었지만, 낡은 사관학교 구조는 이러한 지혜를 군대에 전파하는 데 적합하지 않은 경우가 많았습니다. 장군뿐만 아니라 하급 장교들에게도 현대 전쟁 기술을 제대로 가르칠 수 있도록 사관학교를 개편해야 합니다."
 TRM_Combined_Arms: "제병합동"
 TRM_Combined_Arms_desc: "복합 무기 이론은 군사 기술 발전의 논리적 결론으로 제시됩니다. 보병, 기갑, 공군, 해군의 조합을 동시에 활용하여 방어가 불가능한 공격을 만들어내는 전투 무기의 완벽한 조화를 구상합니다. 매력적인 비전입니다." 
 TRM_Mass_Breakthroughs: "대규모 돌파"
 TRM_Mass_Breakthroughs_desc: "기갑은 미래입니다. 기술의 발전으로 요새는 전차로만 움직이는 보병의 지원을 받아 불가능하다고 여겨졌던 속도로 움직일 수 있게 되었습니다. 기록적인 속도로 적 사단을 포위하고 파괴할 수 있는 진정한 현대식 기갑 부대를 만들려면 새로운 전차 개발을 지원해야 합니다."
 TRM_Land_Air_Integration: "육-공군 통합 전술"
 TRM_Land_Air_Integration_desc: "항공 전력에 대한 모든 잡음에도 불구하고 항공 전력은 궁극적으로 상호 보완적인 힘입니다. 그 구조와 용도에 관계없이 군 항공에 관한 논의는 필연적으로 지상군을 어떻게 지원할 것인가로 돌아갈 수밖에 없습니다. 이 철학에 충실할 때 필요한 곳에 필요한 시기에 지원을 제공함으로써 군의 효율성을 배가하는 공군을 고안할 수 있습니다."
 
 TRN_Luftwaffe: "트리니티 공군 재편성"
 TRN_Luftwaffe_desc: "사태 당시, 트리니티 공군은 기대만큼의 활약을 보이지 못했고, 그 한계는 여실히 드러났습니다. 그러나 우리는 그 전장에서 마주했던 독일 공군의 용맹함과 전투 방식을 높이 평가하며, 그들의 정신과 전술을 트리니티 공군에 이식할 것입니다."
 TRN_Standardise_Pilot_Training: "조종사 훈련 표준화"
 TRN_Standardise_Pilot_Training_desc: "군사 항공은 여전히 신흥 기술의 많은 특징을 지니고 있으며, 그 중 하나는 지식이 공유되는 매우 즉흥적인 방식입니다. 통일된 훈련 체계가 없어, 대신 경험 많은 조종사들이 자신만의 방식으로 기술을 가르쳐야 한다고 여겨집니다. 이로 인해 우리 조종사들 사이에 놀랍도록 일관성 없는 지식 체계가 형성되었습니다. 이제 우리는 이 과정을 표준화할 때가 되었습니다."
 TRN_Promote_Amateur_Flying: "아마추어 비행 장려"
 TRN_Promote_Amateur_Flying_desc: "아마추어 조종사는 성장하는 현상이 되었습니다 - 최근 몇 년간 많은 민간인들이 비행을 취미로 삼기 시작했으며, 일부는 대서양 횡단과 같은 인상적인 업적을 달성하여 큰 명성을 얻었습니다. 우리가 이러한 대중적 이미지를 육성하고 방향을 설정한다면, 우리 공군을 위한 경험 많은 인력 풀을 키울 수 있을 것입니다."
 TRN_Night_Witches: "밤의 마녀들"
 TRN_Night_Witches_desc: "유명한 여성 비행가가 트리니티 공군에 충격적인 아이디어를 제안했습니다: 여성으로만 구성된 항공 연대입니다. 모든 통념과는 달리, 실제로 그녀의 계획을 지지하는 일부 장교들이 있습니다. 그들은 이 계획이 엄청난 선전 가치가 있으며, 다른 조종사들에게 트리니티를 위해 대담한 새로운 높이에 도달하도록 영감을 줄 수 있다고 주장합니다."
 TRN_Aviation_Bureaus: "항공국"
 TRN_Aviation_Bureaus_desc: " 항공은 섬세한 기술입니다. 겉보기에 작은 결함도 하늘에서는 재앙을 초래할 수 있으며, 전투의 혹독한 환경을 견딜 수 있는 항공기를 설계하려면 완벽함이 요구됩니다. 많은 공중전은 실제로 비행기가 이륙하기도 전에 이미 결정되었습니다. 전국에 항공국을 설립함으로써, 우리는 선제적으로 더 효과적인 항공기를 설계하고 시험할 수 있습니다."
 TRN_Long_Range_Bombing: "장거리 폭격"
 TRN_Long_Range_Bombing_desc: "항공 기술의 한계가 확장됨에 따라, 군사 이론가들은 이 기술의 급진적인 사용법을 구상해냈습니다: 적국의 산업 지역에서 운용되며, 공장들을 평지로 만들 수 있는 충분한 화력을 갖춘 거대한 장거리 폭격기입니다. 이 '전략적 파괴' 교리는 지상군 한 명의 발자국도 없이 적의 전쟁 수행 능력을 완전히 파괴할 것을 약속합니다."
 TRN_Transpolar_Flights: "트리니티 횡단 비행"
 TRN_Transpolar_Flights_desc: "북극과의 근접성은 우리 항공 산업에 예상치 못한 이점을 제공합니다: 항공기를 철저히 시험해볼 수 있는 곳으로는 세계에서 이보다 더 좋은 곳이 몇 없습니다. 시험 목적으로 장거리 극지 횡단 비행을 적극적으로 조직함으로써, 우리는 다른 어떤 비행기보다 더 멀리, 더 높이, 더 빠르게 날 수 있는 비행기를 설계할 수 있습니다."
 TRN_Expand_The_Aircraft_Industry: "항공 산업 확대"
 TRN_Expand_The_Aircraft_Industry_desc: "우리는 매우 현대적인 항공기 산업을 가지고 있지만, 대부분은 여전히 민간 소유입니다. 현대적이고 강력한 공군을 건설하려면 이 항공기 산업을 국유화하고, 국가 기관에 통합시키며, 상당히 확장해야 할 것입니다."
 TRN_Airspace_Defence: "영공 방어"
 TRN_Airspace_Defence_desc: "적들이 우리의 하늘을 정복하고 지상군을 공포에 빠뜨리기 위해 항공기를 모든 가능한 방법으로 활용하려 할 것이기 때문에, 영공 방어보다 더 중요한 것은 없습니다. 더 이상 육지를 방어하는 것만으로는 충분하지 않습니다. 우리가 승리하려면 조국의 하늘이 지상만큼이나 난공불락이어야 합니다."
 TRN_Specialise_in_Ground_Support: "지상 지원 전문화"
 TRN_Specialise_in_Ground_Support_desc: "새로운 기술들은 새로운 폭격기 개발에 매혹적인 가능성을 열어주고 있습니다. 이제 항공기는 고도로 기동성 있는 포병으로 기능할 수 있게 되어, 적 진지를 정확하고 파괴적인 공격으로 타격할 수 있으며, 기존의 지원보다 훨씬 빠르게 전선 어디에나 배치될 수 있습니다. 이는 분명 군사 항공의 미래를 대표합니다."
 TRN_Maintain_Tactical_Flexibility: "전술적 유연성 유지"
 TRN_Maintain_Tactical_Flexibility_desc: "항공 기술의 발전은 더 민첩한 항공기뿐만 아니라 더 견고한 항공기를 위한 길도 열어줍니다. 일부 이론 학파들은 새로운 '전술' 폭격기를 옹호하기 시작했습니다 - 이는 '근접' 지원기보다 더 넓은 작전 반경과 생존성을 가진 지상 지원 항공기입니다. 이러한 종류의 폭격기는 기지에서 더 멀리, 더 불리한 조건에서도 임무를 수행할 수 있으며, 적의 구조물도 파괴할 수 있습니다."
 TRN_Jet_Engine_Experiments: "제트 엔진 실험"
 TRN_Jet_Engine_Experiments_desc: "항공 역사상 지금까지 프로펠러를 통해서만 공기보다 무거운 물체의 비행이 가능했습니다. 그러나 최첨단 비행 기술은 새로운 동력 비행 방식이 가능할 수 있음을 시사합니다. 이론상으로는, 엔진이 공기를 압축하고 연료와 결합한 다음 이 혼합물을 사용하여 추진력을 생성할 수 있습니다 이는 프로펠러에 내재된 문제들을 우회하는 방식입니다. 명백히 미친 아이디어로 보이지만, 상식적인 아이디어로는 좀처럼 획기적인 돌파구를 만들어내지 못합니다."
 TRN_Death_From_Above: "하늘에서 죽음이"
 TRN_Death_From_Above_desc: "우리가 아는 바와 같이, 전쟁의 3차원은 군사 기술을 혁명적으로 변화시킬 준비가 되어 있습니다 그것의 거대한 전술적, 전략적 응용 사이에서, 하늘의 통제권은 다음 대전쟁뿐만 아니라 이후의 모든 전쟁에서 결정적인 역할을 할 것이 확실합니다. 트리니티 군대는 미래를 받아들일 것입니다 조국의 아들들은 더 이상 지상에서 비참하게 시들어가지 않고, 구름 속에서 영광을 얻을 것입니다."
 TRN_Create_The_Airborne_Force: "공수부대 창설"
 TRN_Create_The_Airborne_Force_desc: "우리 최고 사령부의 일부 실험적인 구성원들은 군대의 기계화가 단지 첫 번째 단계일 뿐이라고 제안합니다. 다음 단계는 보병을 배나 트럭이 아닌 비행기로 이동시키는 것입니다! 이른바 낙하산 부대를 적진 후방에 투하함으로써 우리는 적 부대를 고립시키고 보급 지점을 타격할 수 있습니다. 이 새로운 공수부대 는 창의 첨병이 될 것입니다."
 TRN_We_Need_Helicopter: "헬리콥터 개발"
 TRN_We_Need_Helicopter_desc: "회전익을 사용하는 항공기로서 특히 주 로터를 통해 양력과 추력을 모두 얻는 항공기다. 일반적인 비행기는 주익이 고정되어 있거나(고정익기) 약간의 움직임만 가능하고(가변익기) 별도의 프로펠러나 엔진의 힘으로 추진되는 반면, 헬리콥터(흔히 헬기라고도 함)는 엔진의 힘으로 날개 자체를 회전시켜 비행을 한다. 때문에 이 날개는 로터 블레이드, 또는 로터리 윙이라고 불린다."
 TRN_Naval_Bomber_Development: "뇌격기 개발"
 TRN_Naval_Bomber_Development_desc: ""
 TRN_Carrier_Development: "항공모함 개발"
 TRN_Carrier_Development_desc: ""

 TRN_Take_To_The_Seas: "바다를 향해"
 TRN_Take_To_The_Seas_desc: "우리가 다시 키보토스의 위대한 학원들 사이에서 당당히 서려면, 유럽과 세계의 강대국들에 도전할 수 있는 새롭고 현대적인 해군을 건설해야 한다. 이제 러시아가 다시 한번 해군 강국이 될 때이다."
 TRN_Floating_Fortresses: "떠다니는 요새"
 TRN_Floating_Fortresses_desc: "구시대 학파의 많은 장교들은 트리니티 내전에서의 경험을 바탕으로 규율의 힘과 위엄 있는 드레드노트급 전함의 힘을 믿습니다. 그들은 이러한 거대한 군함들이 다른 강대국들의 함대와 마찬가지로 우리 해군의 중추로 남아야 한다고 주장합니다."
 TRN_Naval_Air_Coordination: "해군-공군 협력"
 TRN_Naval_Air_Coordination_desc: "우리 해군 참모들 중 일부가 트리니티 항공의 어머니에게 찾아뵙고, 이는 그들로 하여금 해전의 미래가 항공모함에 있다고 믿게 만들었습니다. 이러한 함선들은 비싸지만, 이 장교들은 전쟁이 발발 한다면 해전이 드레드노트급 전함에 의해 지배되었지만, 곧 거대한 항공모함과 해군 폭격기의 강력한 화력에 의해 그늘에 가려질 것이라고 주장합니다."
 TRN_War_Under_The_Sea: "수중 전투"
 TRN_War_Under_The_Sea_desc: "항공모함과 전함이 미래일 수 있지만, [TRM.GetNameDef]에는 이러한 거대한 함선들에 집중하는 것은 현실적이지 않을 수 있습니다. 대규모 해군을 건설하는 것은 비용이 많이 들고, [TRM.GetNameDef]은 그러한 규모의 함대를 생산할 조선소나 자원이 없습니다. 대신, 우리는 적의 해상 보급로를 괴롭힐 수 있는 더 저렴하지만 똑같이 치명적인 잠수함에 집중해야 합니다."
 TRN_The_Invisible_Navy: "보이지 않는 해군"
 TRN_A_Destroyer_Armada: "구축함 대함대"
 TRN_Fleet_Protectors: "함대의 수호자"
 TRN_Fleet_Vanguards: "선봉 함대"
 TRN_Naval_Infantry: "해군 보병"
 TRN_New_Tactics_For_New_Ships: "새로운 함선을 위한 새로운 전술"
