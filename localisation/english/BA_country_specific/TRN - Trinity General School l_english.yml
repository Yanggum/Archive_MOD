 TRN_Mika_honor_decision_cat: "Misono Mika's Honor"
 TRN_Mika_honor_decision_cat_desc: "To §MMisono Mika§!, §H'Honor'§! is not merely the evaluation or reputation from others. It is §Hher conviction§!, the center of her inner self, and a §Hmission§! assigned to herself. And according to that honor, Misono Mika's fate is decided.\n\nWhile the §MMisono Mika regime§! is maintained, she will evaluate her own honor in the process of executing numerous choices and policies. Mika may consider her honor to be high or, conversely, judge it to be low, and this self-perception becomes an important criterion for determining the direction of the regime. As specific tendencies become clearer, more extreme options will gradually reveal themselves before her.\n\n"
