 TRN_SPD_parteitag_state: "Social Democratic Party"
 TRN_SPD_parteitag_state_desc: "\n\n\n£GFX_TRN_banner_SPD_parteitag\n\n\n\n\nThrough a deal between Trinity and the SPD, the SPD has guaranteed free political activity and special status in this region. The Prime Minister handles most administration, and central interference is limited."
 TRN_gehenna_resistance_movement: "Gehenna Resistance Movement"
 TRN_gehenna_resistance_movement_desc: "The Eden Treaty means the integration of both academies, but in reality, it's a merger where Gehenna yielded. Gehenna students resist Trinity's rule, but their resistance will soon break under the treaty."
 TRM_industrial_region_state: "Trinity Development District"
 TRM_industrial_region_state_desc: "The industry here is managed by the Academy Economic Development Department, and administration is centralized under an Eden-appointed governor."
