 landmark_TRM_trinity_chruch: "Cathedral of Communion"
 landmark_TRM_trinity_chruch_desc: "The 'Old Cathedral of Communion,' the site of Trinity's First Council centuries ago, has preserved its history through the ages. Today, it stands as a famous landmark loved by many tourists throughout Kivotos. However, beyond its magnificent exterior, the interior remains a sacred space and the spiritual pillar of the Sisterhood, fulfilling its role as the center that sustains their faith and tradition."

 TRM_GATHERING_STORM_DESC: "Originally, this region was a site of constant conflict, with numerous branch schools—the predecessors of official clubs like Pater, Filius, Sanctus, and the Justina Council—hostile toward one another. Long ago, the Ancient Council reached a consensus to end the strife by integrating all branches into a single academy. With all but one branch consenting, Trinity earned its honor as one of the three major academies of Kivotos.\n\nHowever, the current situation for Trinity is bleak. A massive incident known as the 'Great Transfer' completely shook Trinity, leaving it currently isolated within otherworldly territory."

 TRM_guide: "Misono Mika\n\n£white_dot Exploit critical issues to become the Host of the Tea Party.\n£white_dot Seize absolute power through the purge of political rivals.\n£white_dot Achieve victory in the war against the demons of Gehenna.\n£white_dot Rule over Kivotos.\n\n\nNagisa Kirifuji, the Iron Lady | §YIncomplete§!\n\n£white_dot Exploit critical issues to become the Host of the Tea Party.\n£white_dot Thwart Misono Mika's coup attempt.\n£white_dot Appeal to the students to foster a sense of unity.\n£white_dot Sign the Eden Treaty to establish peace with a centuries-old enemy.\n\n§RLet justice be done, though the world perish.§!\n\n\n\n§YDeveloper: Kangseul2702§!"
 TRN_country_intro_header: "Trinity General School"
 TRN_country_intro_content: "Trinity has endured suffering for a long time. A cycle of hatred spanning centuries led to endless slaughter, forcing students to turn their blades against each other without even remembering the justification for war. The unstable central government collapsed helplessly, repeating a cycle of reconstruction and ruin.\n\nHowever, prophets emerged from the darkness. They convened the First Council under the concept of the Trinity, and the fractured sects finally joined hands. The council concluded successfully, and Trinity united under a single cross. However, during the council, the Arius branch was expelled due to differences in scripture interpretation.\n\nFollowing the council, Trinity established an official leadership system. The most influential branches—Sanctus, Filius, and Pater—stepped forward to form the 'Tea Party' and enacted the first charter. Thus, Year 0 of the Trinity Calendar was proclaimed, and the community of 'Trinity General School' was born.\n\nCenturies of peace followed. The 'Tea Party' and 'Host' systems balanced ideals with reality, and Trinity's students enjoyed stable lives amidst dazzling architecture and culture. This period is remembered as the freest and most hopeful era in Trinity's history."
 TRM_country_intro_header_1: "Centuries of Peace"
 TRM_country_intro_content_1: "During the centuries of peace, Trinity General School achieved remarkable development. The wounds of war slowly faded from memory over time, and the chains of division and hatred began to break. Each sect no longer dwelt on past conflicts but accepted one another under a single belief and value, finally approaching true integration under the name of the 'Trinity.'\n\nThat faith became the spirit of the Trinity community, and people were certain that the light of the Trinity would never go out. This ideal moved beyond a simple idealistic slogan to become the pillar sustaining the community, deeply rooted in countless principles of life, systems, education, and faith.\n\nDuring this peace, Trinity secured its largest territory, and the central thousand-year capital, 'Eden,' grew at a miraculous pace. Eden was no longer just a city but a symbol yearned for by all of Kivotos. Pure white spires pierced the sky, and brilliant fruits of academia, culture, and faith flowed through every elaborately designed street, where countless people laughed, cried, loved, and lived.\n\nEden was regarded as a living sanctuary proving Trinity's glory and the most perfect utopia Kivotos could achieve. The academy welcomed a renaissance of culture and art, and students constantly pondered the meanings of God and man, community and individual, as they prepared for the future.\n\nCountless people lived each day with gratitude, saying: Today like yesterday, and tomorrow like today—may this peace continue. However, no one could guarantee that such brilliant light would remain forever."
 TRM_country_intro_header_2: "The Host Crisis"
 TRM_country_intro_content_2: "However, this era of peace came to an end with the emergence of Gehenna Academy. Pushed out by other schools in the West, Gehenna appeared and posed a sufficient threat to Trinity in the East, sparking internal expansionist desires toward the East. Ultimately, concerns of an invasion became reality as Gehenna marched eastward like a great host.\n\nIn response, the angels resisted fiercely and eventually succeeded in thwarting Gehenna's eastward advance. However, the battles left behind unimaginable devastation. The acts Gehenna students committed as if they were mere pranks were horrific acts of terror to the Trinity students who had known only peace, leading to a strong anti-Gehenna sentiment spreading within Trinity.\n\nAfter the war ended, both sides signed a non-aggression pact, but voices of opposition remained within Trinity. In particular, the 'Host Crisis,' centered around the Pater branch, nearly destroyed Trinity's unified values. At the time, a radical head of the Pater branch took office as Host according to Trinity law, and there were few issues early in the term.\n\nHowever, in the middle of the term, as provocations from Gehenna continued at the Trinity-Gehenna border, Trinity attempted to manage the situation with a restrained response. Yet, the Host regarded this as a declaration of war and advocated for conflict, triggering the 'Host Crisis.' Ultimately, the Tea Party passed a vote of no confidence against the Host, who accepted it and stepped down. This incident left a deep scar on the pride of the Pater branch, the repercussions of which continue to this day."
 TRM_country_intro_header_3: "The Road to the Second Trinity"
 TRM_country_intro_content_3: "\"We run across the plains. Even if our horseshoes are shattered and broken, even if our gaunt horse manes are buried beneath the legends of the white bones and the meadows, even if our feet swell and burst, our knees dislocate, and our shins crumble until we can no longer run, let alone walk.\"\n\nAfter the war with Gehenna Academy and the subsequent Host Crisis, the peace of Trinity General School was greatly shaken. Taking this as a turning point, Trinity embarked on military expansion, and the waves of change began in earnest. As time passed, talents representing each sect emerged in Trinity: Seia Yurizono of Sanctus, Nagisa Kirifuji of Filius, and Mika Misono of Pater. They entered the political arena with much expectation and praise as figures who combined intelligence and leadership to lead the next golden age. Thus, Trinity entered a new phase.\n\nThen, at approximately 1 PM on an ordinary day, an event occurred that shocked not only Trinity but all of Kivotos. For a few seconds, a dazzling light covered the world, and when vision returned, what lay before Trinity was a strange world. It was a space reminiscent of Kivotos decades ago, but instead of a welcoming greeting, bullets and bombardment met Trinity.\n\nTrinity immediately declared a state of emergency and mobilized the Guard Division, the Justice Task Force, and the Vigilante Crew for defense. The enemy eventually retreated, but the battle left deep wounds on Trinity. Notably, combatants from the Pater branch were caught attacking non-resisting civilians and mistreating prisoners; they were court-martialed and sentenced to prison. Mika Misono stepped forward to defend them, but the court did not accept it.\n\nSubsequently, the Pater branch and Mika Misono began to earnestly advocate for a new national ideology, the 'Second Trinity,' which they had steadily claimed. They emphasized that the past 'Era of Peace' was actually a period of wasted time where countless heroes vanished without seeing the light. Despite allegations of militarism, nationalism, and the worship of violence among some senior officials, the Pater branch remains convinced that they are the ones who truly love Trinity and possess the will to ultimately change the course of world history."
 TRM_country_intro_header_4: "The Eden Treaty?"
 TRM_country_intro_content_4: "The Eden Treaty is a peace agreement between Trinity and Gehenna, supported by a majority of the Filius branch led by Nagisa Kirifuji. Nagisa Kirifuji and the Filius branch argue that they can break the chain of hatred and welcome an era of peace and prosperity once again, just as Trinity did in the past. The treaty includes a clause to create a peacekeeping force composed of students from both academies to maintain common security.\n\nWhile on the surface both sides evaluate it positively, the internal atmosphere is different. Gehenna's student council, Pandemonium Society, shows suspicious undertones regarding this treaty, while Mika Misono and the Pater branch criticize it as overly idealistic and impossible to realize. In fact, in the talks between the two academies mediated by the General Student Council, the rude attitude of the Gehenna side provoked strong resentment from the Tea Party.\n\nNevertheless, Nagisa Kirifuji and the Filius branch regarded this as a tolerable issue and focused on calming the enraged Tea Party. The chance of the Eden Treaty succeeding remains low, but if realized, Trinity might be able to restore the brilliant era of peace it once knew."
