 TRN_after_war_event.20.t: "군민정청 수립"
 TRN_after_war_event.20.desc: "군민정청은 트리니티가 게헨나 학원들을 완벽히 자신들의 통제 하에 두기 위해 설립한 행정 체제로, 사법부터 행정까지 막대한 권한을 가지고 있습니다. 이러한 체제는 게헨나 지역의 질서를 유지하고 트리니티의 영향력을 강화하는 데 기여하고 있지만, 동시에 학생들의 자유와 자율성을 억압하는 부작용을 낳고 있습니다. 이는 게헨나 학생들 사이에서 강한 반발과 불만을 불러일으키고 있습니다.\n\n게헨나 학생들은 트리니티의 지배에 대한 저항을 자신들만의 다양한 방식으로 표현하고 있습니다. 그 중에는 관료들을 대상으로 한 협박이나 행정 기관을 겨냥한 테러와 같은 극단적인 수단도 포함되어 있습니다. 이러한 저항 행위들은 게헨나 학생들 사이에 널리 퍼져 있으며, 체제에 대한 반감을 직접적으로 드러내는 결과로 나타나고 있습니다.\n\n트리니티의 정의실현부는 이러한 상황을 진압하기 위해 지속적으로 노력하고 있습니다. 테러 행위의 적발부터 즉각적인 체포, 구금까지의 과정이 신속하게 진행되고 있지만, 저항은 좀처럼 사그라들지 않고 오히려 점차 조직화되고 있는 양상을 보이고 있습니다.\n\n현재 군민정청 체제는 안정과 통제를 지향하고 있으나, 게헨나 학생들과의 갈등을 해소하지 못한다면 지속적인 충돌이 불가피할 것으로 보입니다."
 TRN_after_war_event.20.a: "빠른 시일내로 해결 해보자."
 TRN_after_war_event.21.t: "군정장관 임명"
 TRN_after_war_event.21.desc: "게헨나의 군민정청이 수립되었습니다. 그러나 예상치 못한 저항에 직면하면서, 특별히 유능한 관료가 아니면 이 저항 운동을 극복하기 어렵다고 판단했습니다. 이에 따라 총 2명의 인물이 선별되었습니다.\n\n첫 번째 인물은 정의실현부의 하네카와 하스미입니다. 그녀는 게헨나에 대한 적대적인 태도와 뛰어난 행정 처리 능력으로 주요 관직을 맡고 있으며, 특별한 권력욕을 드러내지 않는 실무형 인물로 평가받고 있습니다. 비록 게헨나에 적대적이지만, 공적인 자리에서는 상대를 존중하는 태도를 보여 균형 잡힌 행정가로 인정받고 있습니다.\n\n두 번째 인물은 자경단 소속의 모리즈키 스즈미입니다. 그녀는 행정 업무와는 거리가 멀지만, 평소 트리니티의 치안 유지를 위해 순찰을 도는 등 실질적인 활동으로 주목받아 게헨나 학생들의 저항 활동을 억제할 적임자로 추천되었습니다. 스즈미 역시 특별한 권력욕을 보이지 않는 것으로 확인되었습니다."
 TRN_after_war_event.21.a: "하네카와 하스미. 그녀의 행정 능력은 믿을만 하다."
 TRN_after_war_event.21.b: "모리즈키 스즈미. 그녀의 자경 활동이 도움이 될 것이다."
 TRN_after_war_event.22.t: "만족하는 하스미"
 TRN_after_war_event.22.desc: "하네카와 하스미는 자신이 게헨나 군민정청의 군정장관으로 임명된 것에 큰 만족감을 느끼는 듯합니다. 그녀는 트리니티 신문 기자의 면담 요청에 매우 흡족한 표정으로 응했으며, 이는 신문 기사 맨 앞면에 실렸습니다. 정부 관계자들은 그녀의 군정장관 발탁을 축하했지만, 켄자키 츠루기는 이에 대해 침묵을 지켰습니다. 평소 정치적 중립을 표방하던 그녀의 태도를 생각하면 크게 놀랄 일은 아닙니다.\n\n하지만 이와 관련해 정의실현부의 영향력이 지나치게 확대된 것 아니냐는 우려의 목소리도 나오고 있습니다."
 TRN_after_war_event.22.a: "어쨌든, 그녀가 일을 잘하길 빌자."
 TRN_after_war_event.23.t: "불만족스런 스즈미"
 TRN_after_war_event.23.desc: "모리즈키 스즈미는 자신이 게헨나 군민정청의 군정장관으로 발탁된 것에 대해 깊은 거부감과 불쾌함을 느꼈다고 밝혔습니다. 이는 트리니티 신문 기자와의 면담에서 직접 전한 내용입니다.\n\n스즈미는 면담 요청을 두 차례 거부했으나, 세 번째 요청에 응하며 자신의 속마음을 솔직히 털어놓았습니다.\n\n정의실현부의 켄자키 츠루기는 언론을 통해 유감의 메시지를 전했습니다. 평소 모든 사건에 대해 침묵을 지키던 그녀가 이례적으로 입장을 밝힌 점은 주목할 만한 변화로 여겨지고 있습니다."
 TRN_after_war_event.24.t: "평화와 질서를 위한 구국위원회"
 TRN_after_war_event.24.desc: "게헨나 점령지 관리를 계속하던 중, 트리니티 중앙 정부와 특별한 단체가 접촉하였습니다. 평화와 질서를 위한 구국위원회는 트리니티와 게헨나 간의 전쟁이 끝난 뒤, 게헨나 학생회인 만마전이 사실상 해체된 상황에서 치안과 법치를 유지하기 위해 설립된 조직입니다. 위원장은 히무로 세나이며, 위원회의 구성원 대부분이 응급의학부 출신인 점을 감안하면, 이는 응급의학부가 트리니티와 협력하기로 사실상 결정을 내린 것으로 생각 됩니다."
 TRN_after_war_event.24.a: "이들과 협업하자"
 TRN_after_war_event.25.t: "게헨나에서 발생한 폭탄 테러!"
 TRN_after_war_event.25.desc: "트리니티 소속 한 학생이 게헨나의 불특정 다수를 대상으로 폭탄을 투척하며 테러를 벌이는 사건이 발생했습니다. 정의실현부가 신속히 출동하여 해당 학생을 제압하는 데 성공했지만, 테러로 피해를 입은 게헨나 학생들은 강하게 반발하며 보상을 요구하고 있습니다."
 TRN_after_war_event.25.a: "피해는 최소한으로 보상해라."
 TRN_after_war_event.25.b: "모든 피해를 보상하라"
 TRN_after_war_event.26.t: "게헨나 지역에서 발생한 전투"
 TRN_after_war_event.26.desc: "게헨나에서 또다시 총격전이 벌어졌습니다. 이번 사건은 학생저항연합 소속 게릴라 전투원들이 트리니티 군사 호송대를 기습하며 시작되었습니다.\n\n분리주의 세력은 대부분 이전 게헨나 군 출신으로, 비교적 정교한 전술을 통해 호송대를 공격했습니다. 이들은 트럭과 장갑차로 이루어진 호송대의 경로를 차단하고, 상당수의 무기를 탈취하는 데 성공했습니다. 그러나 트리니티 측은 경계 태세를 강화하고 있어, 다음 번에는 같은 일이 반복되지 않을 것입니다."
 TRN_after_war_event.26.a: "저주 받았군"
 TRN_after_war_event.27.t: "게헨나에서 발생한 대규모 시위"
 TRN_after_war_event.27.desc: "모든 게헨나 학생들이 시위에 동참하는 것은 아니지만, 상당수는 에덴에 대해 강한 적대감을 가지고 있습니다. 이러한 감정은 트리니티 정의실현부와 지상군의 행동으로 인해 더욱 격화되며, 시위와 파업으로 산발적으로 폭발하고 있습니다.\n\n최근 부당한 체포 사건이 발생하면서 게헨나에서는 새로운 시위 물결이 일어나고 있습니다. 시위대는 경찰의 폭력적인 행위를 중단하고, 정치적 권리를 존중할 것을 요구하며 거리로 나섰습니다."
 TRN_after_war_event.27.a: "갈등이 커지는 걸 피해보자"
 TRN_after_war_event.27.b: "체포하라!"
 TRN_after_war_event.28.t: "게헨나 전역에서의 비폭력 저항 운동"
 TRN_after_war_event.28.desc: "다수의 게헨나 반체제 인사들이 거리로 나와 시위 표지판을 들고 도로를 막으며 목소리를 높이고 있습니다. 이들은 느슨한 법률 개정, 게헨나의 자치권 확대, 심지어 학원의 독립까지 요구하고 있습니다."
 TRN_after_war_event.28.a: "일부 요구를 들어줘라"
 TRN_after_war_event.28.b: "무력으로 해산 시켜라"
 TRN_after_war_event.28.c: "무시해라"
 TRN_after_war_event.29.t: "사회주의 선동"
 TRN_after_war_event.29.desc: "코민테른이 존재하는 상황에서, 게헨나 저항 운동에 사회주의적 수사가 퍼지는 것은 놀라운 일이 아닙니다.\n\n현재 코민테른은 게헨나에서 사회주의 혁명을 촉진하기 위해 '트리니티 점령군'에 맞선 저항을 적극적으로 촉구하고 있습니다. 사회주의 국가들로부터 밀수된 무기가 게헨나 학생들에게 제공되고 있으며, 사회주의 단체들도 점차적으로 모습을 드러내고 있습니다. 이는 단순한 가능성이 아닌 현실로 다가오고 있습니다."
 TRN_after_war_event.29.a: "저주받을 공산주의자들."
 TRN_after_war_event.30.t: "공격받은 군정장관!"
 TRN_after_war_event.30.desc: "오늘, 하노버에서 시찰을 돌던 군정장관이 피습 당하여 다쳤다는 소식이 전해졌습니다. 이러한 사태의 범인은 게헨나 학생저항연합에 가입한 학생 중 한 명이 단독적으로 벌인 짓이였다는 것으로 판명 되었습니다."
 TRN_after_war_event.30.a: "이는 중대한 사건이다."
 TRN_after_war_event.40.t: "영토 반환을 요구하는 [FROM.GetAdjective]"
 TRN_after_war_event.40.desc: "[FROM.GetName]의 지도자인 [FROM.GetLeader]이(가) 게헨나 영토 반환을 요구하며 공식적인 통보를 보냈습니다. 최근 [FROM.GetAdjective]이(가) 게헨나 영토에 대한 영토적 무결성을 주장한 바 있어, 이번 요구 역시 그와 관련이 있을 가능성이 높아 보입니다."
 TRN_after_war_event.40.a: "그들의 요구를 들어줘라."
 TRN_after_war_event.40.b: "이 지역은 [ROOT.GetAdjective]의 것이다!"
 TRN_after_war_event.41.t: "게헨나 영토를 반환한 [FROM.GetAdjective]"
 TRN_after_war_event.41.desc: "[FROM.GetAdjective] 측은 우리의 요구를 받아들여 게헨나 영토를 반환하기로 결정했습니다. 이는 외교적 긴장을 완화하고 양측의 관계를 개선하려는 의도로 보입니다."
 TRN_after_war_event.41.a: "외교의 승리로군!"
 TRN_after_war_event.42.t: "우리의 요구를 거부한 [FROM.GetAdjective]!"
 TRN_after_war_event.42.desc: "[FROM.GetAdjective] 측은 우리의 요구를 정중히 거부하며, 게헨나 영토에 대한 영유권을 근거로 [ROOT.GetAdjective] 측의 주장을 받아들일 수 없다고 밝혔습니다."
 TRN_after_war_event.42.a: "그렇다면 전쟁 뿐이다."
