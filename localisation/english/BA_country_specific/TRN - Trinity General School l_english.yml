 TRN_strike_season_ns: "만연한 파업"
 TRN_general_school_Intelligence_service_ns: "학원정보국"
 TRN_denazification_ns: "탈나치화 운동"
 TRN_Hungarian_trade_sanctions_ns: "트리니티의 무역 제재"
 TRN_Hungarian_trade_sanctions_ns_desc: "독일국이 [TRM.GetAdjective]에게 패배하면서 우리는 중요한 무역 파트너를 잃게 되었습니다. 그럼에도 불구하고 [TRM.GetAdjective] 측에는 여전히 독일 무역회사가 남아 있어 일정 부분 무역이 원활히 이어졌습니다. 그러나 1935년 산해경 침공을 명분으로 [TRM.GetAdjective] 측이 무역 제재를 시행하면서 상황이 악화되었습니다"
 TRN_Trinity_New_Culture_modifier: "트리니티 신 문화"
 TRN_Trinity_New_Culture_modifier_desc: "트리니티에는 새로운 활력이 필요합니다. 과거 독일국과 트리니티의 구 문화는 퇴폐적 성향을 띠어 국가적 활력에 기여하지 못했습니다. 트리니티의 학생들은 전위적과 현대주의를 바탕으로, 트리니티에 신선하고 진취적인 에너지를 불어넣을 것입니다."
 TRN_Trinity_New_Culture_modifier_change: "§Y$TRN_Trinity_New_Culture_modifier$§! 변동치"
 TRN_city_of_heaven: "천상의 도시"
 TRN_academy_defense_force_ns: "학원방위대"
 TRN_social_problem_ns: "트리니티 사회 문제"
 TRN_industry_ns: "트리니티 산업"
 TRN_industry_ns_industry_research_bonus: "산업 연구 속도: §G+10%§!"
 TRN_purged_nazi_elite_ns: "숙청된 나치 엘리트"
