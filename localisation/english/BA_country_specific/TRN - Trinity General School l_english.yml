#신성통치령 관리 사건과 결정
 TRN_Trinity_divine_mandate_cat: "신성통치령 설립"
 TRN_Trinity_divine_mandate_cat_desc: "\n\n£GFX_decision_header_TRN_trinity_buliding \n\n\n\n신성통치령은 과거 트리니티의 점령지를 관리하던 총독부 명칭에서 유래했습니다. 그러나 지금은 거대한 동방과 키보토스 영토를 효과적으로 관리하기 위해 신성통치령이라는 명칭을 역사 속에서 다시 불러왔습니다.\n\n신성통치령의 최종 목표는 영토를 관리하고, 현지인들을 트리니티에 동화시키며, 해당 지역을 트리니티와 비슷한 수준으로 발전시키는 것입니다. 언제가 될지는 알 수 없지만, 언젠가 트리니티는 이 광활한 영토를 완벽하게 통제하게 될 것입니다."
 TRN_Divine_Mandate_Trigger_tt: "§Y[ROOT.GetNameWithFlag]§! 또는 괴뢰국이 모든 §Y강조된 주§!를 지배함"
