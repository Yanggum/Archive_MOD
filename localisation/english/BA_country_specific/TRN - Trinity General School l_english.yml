 TRN_united_gehenna_decisions_remove_resistance: "Eliminate Resistance in [FROM.GetName]"
 TRN_united_gehenna_decisions_remove_resistance_desc: "As our integrationist policies in the Gehenna region achieve success, resistance forces in [FROM.GetName] appear to be losing popular support."
 
 TRN_united_gehenna_decisions_integration_complete: "Integration Procedures for [FROM.GetName]"
 TRN_united_gehenna_decisions_integration_complete_desc: "[FROM.GetName] has been incorporated into Trinity's order and has accepted our system and faith."
 
 TRN_united_gehenna_decisions_remove_nsdap: "Remove National Socialist Influence in [FROM.GetName]"
 TRN_united_gehenna_decisions_remove_nsdap_desc: "Disturbingly, the former Gehenna government had left the National Socialist German Workers' Party (Nazi) forces in this region completely untouched and unpurged. It seems the Justice Task Force has no choice but to take action."

 # Mika Decisions
 TRM_mika_misono_problem_cat: "Misono Mika's Activities"
 TRM_mika_misono_problem_cat_desc: "The daily life and various requests of Misono Mika."
 TRM_mika_misono_self_introduction_text: "[TRM_mika_misono_self_introduction_loc]"
 
 # Mika SNS Account Main Screen
 TRM_mika_misono_self_introduction_loc_0: "I'm Misono Mika, leader of the Pater Faction☆ Sorry, but Gehenna accounts will be blocked (_ _)\n #Trinity_TeaParty #Pater"
 TRM_mika_misono_self_introduction_loc_1: "Absolutely opposed to the Eden Treaty! Supporters, please launch a MomoTalk offensive against Filius executives!!! I'm counting on you!\n #Eden_Treaty #Pater"
 TRM_mika_misono_self_introduction_loc_2: "Pater will be with Trinity until the final moment of the war against Gehenna.\nPlease refer to the Ministry of Land, Infrastructure, Transport and Tourism and the Cabinet Office 'Disaster Prevention Information' sites for wartime info."
 TRM_mika_misono_self_introduction_loc_3: "Absolutely opposed to war with Arius!! Promoting pacifism for Trinity\n #PeaceforArius #PrayforArius"
 TRM_mika_misono_self_introduction_loc_4: "I love Samuella perfume. Please send me lots of presents\nJust kidding lol I only accept everyone's feelings as gifts!"
 TRM_mika_misono_self_introduction_loc_5: "Everyone's idol (hope), the official account of Pater Faction leader Misono Mika☆ Sharing Pater info here too!\n #Trinity_TeaParty #Pater #ThingsIWantToSayToNagi-chan"
 TRM_mika_misono_self_introduction_loc_6: "Good job to the Trinity delegation who visited the Millennium Expo!\n#Millennium_Expo #Trinity_Millennium_Friendship"
 TRM_mika_misono_self_introduction_loc_7: "I know Nagi-chan ego-searches my account every day... ㅇㅁㅇ\nNagi-chan!!! If you're seeing this, shake a carrot!!"
 TRM_mika_misono_self_introduction_loc_8: "Searching for my own prince... (loading...) a bit lonely\nAlways looking for someone to talk to"
 TRM_mika_misono_self_introduction_loc_9: "I'm trying my best to be happy.\nNo matter how difficult that may be."
 TRM_mika_misono_self_introduction_loc_10: "Is this 'Great War' thing really real? Maybe all of this is just one long dream?\nThe official account of the philosophical girl Misono Mika, who lives with such thoughts"
 TRM_mika_misono_self_introduction_loc_11: "Seia-chan. Thank you for being alive."
 TRM_mika_misono_self_introduction_loc_12: "I'm Mika, head of the Tea Party Pater Faction. I'm always grateful to everyone.\nWith love to everyone who visits my account."
 
