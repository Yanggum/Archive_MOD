l_english:

 landmark_TRM_trinity_chruch: "통공의 대성당"
 landmark_TRM_trinity_chruch_desc: "수백 년 전, 트리니티의 제1차 공의회가 열렸던 장소인 '통공의 고성당'은 오랜 세월 동안 역사를 간직해 왔습니다. 오늘날 이곳은 키보토스 전역에서 손꼽히는 유명 관광지로 많은 이들의 사랑을 받고 있습니다. 그러나 그 화려한 외관 너머로, 성당 내부는 여전히 시스터후드의 정신적 지주이자 신성한 공간으로 남아 있으며, 이들의 신앙과 전통을 지탱하는 중심지로서 역할을 다하고 있습니다."

 TRM_GATHERING_STORM_DESC: "본래 파테르, 필리우스, 상투스 세 학원과 요한, 유스티나 등 공인 동아리의 전신인 수많은 분교들이 서로 적대하며 끊임없는 분쟁을 벌이던 지역이었습니다. 오래전 태고의 공의회에서 모든 분교를 하나의 학원으로 통합해 분쟁을 종식시키자는 총의가 내려졌고, 단 하나의 분교를 제외한 모든 분교가 이에 찬성하면서 트리니티는 키보토스 3대 학원 중 하나라는 명예를 얻었습니다.\n\n그러나 현재 트리니티의 상황은 암울하기만 합니다. '대전이'로 불리는 대규모 사건은 트리니티를 완전히 뒤흔들었고, 지금은 이계의 영토에 고립된 상태입니다."

 TRM_guide: "미소노 미카\n\n£white_dot 중대한 문제를 이용하여 티파티의 호스트가 되십시오.\n£white_dot 정적 숙청을 통하여 절대 권력을 쥐어내십시오.\n£white_dot 게헨나의 악마들과 전쟁에서 승리하십시오\n£white_dot 키보토스를 지배하십시오.\n\n\n철의 여인 키리후지 나기사 | §Y미완성§!\n\n£white_dot 중대한 문제를 이용하여 티파티의 호스트가 되십시오.\n£white_dot 미소노 미카의 쿠데타 계획을 저지하십시오\n£white_dot 학생들에게 호소하여 단결심을 이끌어내십시오.\n£white_dot 에덴조약을 체결해 수백년의 적과 평화를 맺으십시오\n\n§R세상이 망할지라도 정의를 행하십시오§!\n\n\n\n§Y개발 : Kangseul2702§!"
 TRM_country_intro_header: "트리니티 종합학원"
 TRM_country_intro_content: "트리니티는 오랜 시간 고통을 감내해왔습니다. 수백 년에 걸친 증오의 연쇄는 끝없는 살육으로 이어졌고, 전쟁의 당위조차 잊은 채 서로에게 칼을 겨눠야 했습니다. 불안정한 중앙정부는 무기력하게 무너지고 재건과 붕괴를 반복할 뿐이었습니다.\n\n그러나 어둠 속에서 선지자들이 등장했습니다. 이들은 삼위일체라는 개념 아래 제1차 공의회를 소집했고, 분열되어 있던 여러 분파들은 마침내 손을 맞잡았습니다. 공의회는 성공적으로 마무리되었고 트리니티는 하나의 십자가 아래 단결했습니다. 그러나 공의회 도중 경전 해석 차이로 인해 아리우스 분파를 축출했습니다.\n\n공의회가 끝난 후 트리니티는 공식적인 지도체제를 수립했습니다. 가장 큰 영향력을 가진 상투스, 필리우스, 파테르 분파가 대표로 나섰고, 이들은 '티파티'를 구성하며 초대 헌법을 제정했습니다. 이로써 트리니티력 0년을 선포했고, 동시에 '트리니티 종합학원'이라는 이름 아래 하나의 공동체를 탄생시켰습니다.\n\n그 후 수세기에 걸쳐 평화가 이어졌습니다. '티파티'와 '호스트' 제도는 이상과 현실의 균형을 이루었고, 트리니티의 학생들은 눈부신 건축과 문화의 혜택 속에서 안정적인 삶을 누렸습니다. 이 시기는 트리니티 역사상 가장 자유롭고 희망에 가득 찬 시절로 기억되고 있습니다."
 TRM_country_intro_header_1: "수백 년의 평화"
 TRM_country_intro_content_1: "수백 년에 걸친 평화의 시기 동안 트리니티 종합학원은 눈부신 발전을 이뤄냈습니다. 전쟁의 상처는 시간이 지나며 천천히 기억 속에서 희미해졌고, 분열과 증오의 고리는 점차 끊어지기 시작했습니다. 각 분파들은 더 이상 과거의 갈등에 머무르지 않고 하나의 신념과 가치 아래 서로를 받아들이며 마침내 '삼위일체'의 이름 아래 진정한 통합에 가까워졌습니다.\n\n그 믿음은 곧 트리니티 공동체의 정신이 되었고, 사람들은 삼위일체의 빛이 영원히 꺼지지 않으리라 확신했습니다. 이 이상은 단순한 이상주의적 슬로건을 넘어서 수많은 삶의 원칙과 제도, 교육, 신앙 속에 깊이 뿌리내리며 공동체를 지탱하는 기둥이 되었습니다.\n\n이 평화 속에서 트리니티는 가장 넓은 부지를 확정했고, 중심지인 천년수도 '에덴'은 기적과도 같은 속도로 성장했습니다. 에덴은 이제 단순한 도시가 아니라 키보토스 전체가 동경하는 상징이 되었습니다. 순백의 첨탑들이 하늘을 찌르고 정교하게 설계된 거리마다 찬란한 학문과 문화, 신앙의 열매가 흐르며 수많은 이들이 이곳에서 웃고, 울고, 사랑하고, 살아갔습니다.\n\n에덴은 트리니티의 영광을 증명하는 살아있는 성소이자 키보토스가 이룩할 수 있는 가장 완전한 이상향으로 여겨졌습니다. 학원은 눈부신 문화와 예술의 르네상스를 맞이했고, 학생들은 신과 인간, 공동체와 개개인의 의미를 끊임없이 고민하며 미래를 준비했습니다.\n\n수많은 이들이 매일을 감사하며 살아갔고, 사람들은 이렇게 말했습니다. 오늘도 어제처럼 그리고 내일도 오늘처럼—이 평화가 계속되리라고. 그러나 그 찬란한 빛이 오래 머물 수 있으리라 장담한 자는 아무도 없었습니다."
 TRM_country_intro_header_2: "호스트 위기"
 TRM_country_intro_content_2: "그러나 이러한 평화의 시대는 게헨나 학원의 등장으로 막을 내리고 말았습니다. 서부에서 다른 학원들에게 밀려나 등장한 게헨나 학원은 동부의 트리니티를 위협하기에 충분했고, 내부에서는 동부를 향한 팽창적 열망이 일었습니다. 결국 트리니티에 대한 침략 우려는 현실이 되었고, 게헨나는 하나의 군세처럼 동부를 향해 진군해왔습니다.\n\n이에 맞서 천사들은 치열하게 저항했고 끝내 게헨나의 동부 진출을 저지하는 데 성공했습니다. 그러나 그 과정에서 벌어진 전투는 상상 이상의 참상을 남겼습니다. 게헨나 학생들이 장난처럼 벌인 행위들은 오직 평화만을 알던 트리니티 학생들에게는 끔찍한 테러였고, 이로 인해 트리니티 내에는 강한 반게헨나 정서가 퍼졌습니다.\n\n전쟁이 끝난 뒤 양측은 불가침 조약을 체결했으나 트리니티 내부에서는 여전히 반발의 목소리가 나왔습니다. 특히 파테르 분파를 중심으로 벌어진 '호스트 위기'는 트리니티의 통합 가치를 무너뜨릴 뻔했습니다. 당시 과격한 성향의 파테르 수장이 트리니티 법에 따라 호스트직에 취임했고, 임기 초반까지는 큰 문제가 없었습니다.\n\n그러나 임기 중반 트리니티-게헨나 국경에서 게헨나 측의 도발이 이어지자 트리니티는 절제된 대응으로 사태를 관리하려 했습니다. 하지만 호스트는 이를 선전포고로 간주하고 전쟁을 주장했고, 이로 인해 '호스트 위기'가 촉발되었습니다. 결국 티파티는 호스트에 대한 불신임 결의를 가결했고, 호스트는 이를 수용하며 자리에서 물러났습니다. 이 사건은 파테르 분파에게 깊은 자존심의 상처를 남겼고, 그 여파는 지금까지도 이어지고 있습니다."
 TRM_country_intro_header_3: "두 번째 트리니티로 가는 길"
 TRM_country_intro_content_3: "\"우리는 초원을 넘어 달린다. 설령 편자가 산산이 조각나 부서지더라도, 수척한 말갈기가 백골과 초원의 전설 아래 잠기더라도, 발이 불어 터지고 무릎이 탈골되고 정강이는 바스라져 더 이상 달리기는커녕 걷지도 못 하게 되더라도\"\n\n게헨나 학원과의 전쟁 그리고 이어진 호스트 위기 이후 트리니티 종합학원의 평화는 크게 흔들렸습니다. 이를 계기로 트리니티는 군대 확장에 나섰고, 이 시기를 전환점 삼아 변화의 물결이 본격화되었습니다. 시간이 흐르며 트리니티에는 각 분파를 대표할 인재들이 등장했습니다. 상투스의 유리조노 세이아, 필리우스의 키리후지 나기사 그리고 파테르의 미소노 미카입니다. 이들은 총명함과 리더십을 겸비한 인물들로 평가받으며 다음 세대의 전성기를 이끌 인물로 많은 기대와 찬사를 받으며 정계에 발을 들였습니다. 그렇게 트리니티는 새로운 국면에 접어들게 됩니다.\n\n그러던 어느 평범한 날 오후 1시경 발생한 한 사건이 트리니티는 물론 키보토스 전역을 충격으로 몰아넣었습니다. 몇 초간 눈부신 빛이 세상을 뒤덮었고, 시야가 다시 열렸을 때 트리니티 앞에 펼쳐진 것은 낯선 세계였습니다. 그곳은 마치 수십 년 전 키보토스를 연상케 하는 공간이었으나 환영의 인사는커녕 총탄과 폭격이 트리니티를 맞이했습니다.\n\n트리니티는 즉시 비상사태를 선포하고 근위사단, 정의실현부, 자경단까지 총동원하여 방어에 나섰습니다. 적은 결국 물러났지만 그 전투는 트리니티에 깊은 상처를 남겼습니다. 특히 파테르 분파 소속 전투원들이 무저항 민간인을 공격하고 포로를 학대하는 행위가 포착되어 군법에 회부되었고, 이들은 징역형을 선고받았습니다. 미소노 미카가 이들의 변호에 나섰으나 법원은 이를 받아들이지 않았습니다.\n\n이후 파테르 분파와 미소노 미카는 그동안 꾸준히 주장해오던 새로운 국가 이념인 '두 번째 트리니티'를 본격적으로 내세우기 시작했습니다. 이들은 과거 '평화의 시대'가 오히려 귀중한 시간을 낭비한 시기였으며 수많은 영웅들이 빛을 보지 못한 채 사라졌다고 오래전부터 강조해왔습니다. 일부 고참 임원들이 군국주의, 민족주의, 폭력 숭배 등의 의혹을 받고 있음에도 파테르 분파는 자신들이야말로 트리니티를 진정으로 사랑하고 있으며, 궁극적으로는 세계사의 흐름을 바꿀 의지를 지닌 특별한 존재들이라는 확신을 갖고 있습니다."
 TRM_country_intro_header_4: "에덴 조약?"
 TRM_country_intro_content_4: "에덴 조약은 키리후지 나기사를 중심으로 한 필리우스 분파의 과반이 지지하는 트리니티와 게헨나 간의 평화 협정입니다. 키리후지 나기사와 필리우스 분파는 과거 트리니티가 그랬던 것처럼 증오의 사슬을 끊고 다시 한 번 평화와 번영의 시대를 맞이할 수 있다고 주장합니다. 조약에는 양 학원의 학생들로 구성된 평화유지군을 창설해 공동의 치안을 유지한다는 조항도 포함되어 있습니다.\n\n겉으로 보기에는 양측 모두 긍정적으로 평가하고 있지만 내면의 기류는 그렇지 않습니다. 게헨나의 학생회인 만마전은 이 조약에 무언가 의심스러운 기류를 보이고 있으며, 미소노 미카와 파테르 분파는 이를 지나치게 이상주의적이고 실현 불가능한 조약이라고 비판합니다. 실제로 총학생회의 중재로 열린 양 학원 간 회담에서는 게헨나 측의 무례한 태도가 티파티의 강한 반감을 일으키기도 했습니다.\n\n그럼에도 불구하고 키리후지 나기사와 필리우스 분파는 이를 어느 정도 감내할 수 있는 문제로 여기며 분노한 티파티를 진정시키는 데 주력했습니다. 에덴 조약의 성공 가능성은 여전히 낮지만 만약 실현된다면 트리니티는 과거 찬란했던 평화의 시대를 다시금 복원할 수 있을지도 모릅니다."
 TRM_security_service_of_the_trinity: "트리니티 종합보안국"

 
#캐릭터 #인물
 TRN_tea_party_name: "티파티"
 TEA_PARTY_DESC: "트리니티가 정체불명의 현상에 휘말려 학원에 재앙이 닥치자, 호스트는 비상회의를 소집하였습니다. 이에 따라 각 분파의 대표들이 모여 삼두정 체제로 트리니티를 이끌고 있습니다.\n\n위기가 어느 정도 수습된 지금, 비상회의는 곧 호스트를 새롭게 선출한 뒤 해체될 예정입니다."
 TRN_Kirifuji_Nagisa: "키리후지 나기사"
 TRN_Kirifuji_Nagisa_desc: "필리우스 분파의 수장이자 트리니티의 지도자인 키리후지 나기사는 부유한 집안에서 태어났습니다. 소꿉친구인 미소노 미카와 함께 성장한 그녀는 입학 당시부터 총명함을 드러냈고, 티파티의 권유로 필리우스 분파에 소속되었습니다. 현실주의를 표방한 그녀는 분파 내에서 중재자 역할을 맡아왔으며, 수장 취임 이후 여러 분파 간의 문제를 해결한 주역으로 평가받고 있습니다.\n\n그러나 현재 그녀의 지위는 심각한 위협을 받고 있습니다. 오랜 소꿉친구이자 이해자였던 미소노 미카가 정권을 찬탈하기 위해 물밑에서 한 마리 야수처럼 움직이고 있으며, 시스터후드·구호기사단·티파티 산하 정의실현부까지 사태 이후의 모든 행동이 의심을 사고 있습니다. 여기에 필리우스 분파 내부의 잡음도 끊이지 않고 있습니다. 특히 비극적인 유리조노 세이아 암살 사건 이후 상투스 분파가 급격히 붕괴하면서, 중도·진보 성향의 임원들이 대규모로 필리우스에 합류하였고, 그로 인해 내부 갈등이 더욱 심화되었습니다.\n\n지금 키리후지 나기사는 마치 칼날 위를 걷는 듯한 상황에 놓여 있습니다. 단 한 발자국이라도 잘못 내디딘다면, 무수한 칼끝이 그녀를 향해 겨눌 것입니다."
 TRN_Yurizono_Seia: "유리조노 세이아"
 TRN_Misono_Mika: "미소노 미카"
 TRN_Misono_Mika_leader_desc: "트리니티의 지도자, 미소노 미카를 과연 어떻게 묘사해야 할까요? 그녀를 수식하는 이명은 수없이 많습니다. 파테르 분파의 수장, 대천사의 현현, 영리하면서도 냉소적이며 충동적인 여자. 천진난만한 미소 뒤에 치밀하고도 계산적인 본성을 감춘 이중적 인물. 자신에게 부여된 사명을 신념이라 믿으며, 위선에 찬 기회주의자. 그녀 스스로의 저술에 따르면, 용서받지 못할 악인, 자기혐오적인 마녀, 구원받을 수 없는 죄인. 자기혐오 속에서도 흔들림 없는 인물입니다.\n\n미소노 미카를 둘러싼 이명과 오명은 모두 그녀의 분파와 광신적인 지지자들로부터 비롯되었습니다. 그녀는 유복한 가정에서 태어나 어려서부터 총명함을 드러내며 부모의 엄격한 교육을 받으며 성장하였습니다. 키리후지 나기사와는 어린 시절부터 함께한 소꿉친구였으며, 둘은 트리니티의 기대를 한 몸에 받으며 자라났고, 결국 3대 분파 중 파테르 분파의 수장의 되는 쾌거를 이뤄냈습니다. \n\n추종자들에게 있어 미소노 미카는 영감과 숭배를 불러일으키는 존재입니다. 누구도 감히 말하지 못했던, 더욱 강하고 패권주의적인 '강한 트리니티'의 비전을 그녀는 약속하였습니다. 구시대적이지만 찬란했던 트리니티 패권주의의 영광을 되찾기 위해. 스러져가는 여명의 끝에서, 새로운 빛을 불러오기 위해."
 TRN_Misono_Mika_DESC_2: "미소노 미카는 천진난만하며 밝은 미소를 가진 티파티의 일원이였습니다. 하지만 그러한 모습들이 전부 전부 그녀의 치밀한 연기라는 사실을 그 누가 알 수 있었겠습니까?\n\n미소노 미카는 오래전부터 게헨나를 증오했습니다. 뿔달린 놈들을 어떻게 믿는다는 건지 이해 할 수 없었으며 특히 게헨나와 평화를 맺겠다는 키리후지 나기사와 많은 대립이 있었습니다.\n그러나, 많은 대립이 있었다고 하여도 그녀는 무력으로 정권을 탈취하거나 그런 일은 벌이지 않았습니다. 왜냐하면 키리후지 나기사는 미소노 미카에게 소중한 소꿉친구이자 유일한 친구였기 때문이죠.\n\n그런 그녀에게 '대전이' 사태는 인생을 송두리채 바꾸는 일이었습니다. 키보토스 전역이 유럽 이라 불리는 대륙으로 떨어진 것은, 어쩌면 그녀에게는 기회였죠. 티파티의 권한을 전부 얻어내고 게헨나의 악마들을 몰아낼 기회.\n\n하지만 그녀가 아무리 교활해도 결국 그녀의 심정은 어린 여자아이 였습니다. 국가사회주의자들과 손을 잡았다고 하더라도, 그녀는 국가사회주의자들의 행동들과 방식이 너무 과격하다고 생각했고 그들을 통제 하고 싶어도 여린 마음 때문에 하지 못하였습니다.\n\n키리후지 나기사가 미소노 미카의 쿠데타 때문에 미카가 방에 감금된지 며칠 지나지 않아 '유폐' 명령서가 떨어졌을때, 그제서야 미카는 자신이 하고 있는 일이 무엇인지 깨달았습니다.\n\n그녀의 족적은 붉게 물들었고, 그녀의 목소리는 공허합니다.\n수많은 사람들이 그녀의 이름 아래에서 사라졌고, 사람들의 공포와 분노는 그녀를 향했습니다.\n수많은 기회가 있었음에도 그녀는 멈추지 않았고, 이제 광기는 그녀의 손을 벗어나 스스로 모든 것을 물들이기 시작했습니다.\n\n국가사회주의의 이름 아래, 트리니티는 멈추지 않았습니다.\n가장 먼저 사라진 건 유대인과 소수민족이었습니다.\n신성한 트리니티에 더러운 피는 용납될 수 없으니까요.\n그다음은 그녀에게 저항한 사람들이었습니다.\n트리니티의 영광스러운 앞날에 나약함은 필요하지 않았습니다.\n마지막은 트리니티가 점령한 땅에 남은 잔여물들이었습니다.\n그들은 전부 그녀의 명령으로 만들어진 장벽의 안에서 어둠 속으로 아래 사라져갔습니다.\n\n결국 그녀가 초래한 묵시록의 4기사는 키보토스의 모든 것들을 휩쓸어버렸습니다.\n그녀의 치세 아래에서 밤은 영원히 계속될 것입니다.\n오지 않을 새벽을 기다리며, 살아남은 사람들은 그저 이 멈출 수 없는 불길이 모든 것을 불태우지만은 않기를 간절히 바라고 있습니다.\n\n주님, 자비를 베푸소서.(Kyrie, eleison)"
