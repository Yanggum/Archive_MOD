 TRN_after_war_decisions: "게헨나 저항운동"
 TRN_after_war_decisions_desc: "게헨나 학생들의 저항은 점차 조직화되고 있으며, 온천개발부, 미식연구회, 선도부의 잔존 세력을 중심으로 결집한 '게헨나 학생저항연합'은 트리니티에 실질적인 위협을 가하고 있습니다.\n문제는 내부에도 있습니다. 일부 트리니티 학생들이 정부에 협조하기는커녕, 게헨나 학생들을 향한 차별과 폭력, 심지어 테러 행위까지 자행하고 있으며 이는 명백한 범죄입니다. 이와 같은 적대감은 저항을 더욱 심화시킬 뿐이며, 자원 확보는커녕 내부 갈등만 증폭시킬 위험이 있습니다. 트리니티가 게헨나의 자원을 안정적으로 통제하고 통합을 이루기 위해서는 특단의 조치가 요구될 것입니다."
