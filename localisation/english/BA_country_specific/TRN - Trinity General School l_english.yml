 # 사건
 trinity_events.1.t: "티파티"
 trinity_events.1.desc: "티파티는 상투스, 필리우스, 파테르 분파들의 연합체로, 트리니티 삼두정 체제에서 핵심적인 역할을 담당하는 최고 통치 기관입니다. 각 분파는 서로의 단점을 보완하면서도 견제를 통해 균형을 유지하는 구조를 이루고 있습니다. 이 중 한 분파의 수장은 티파티의 \"호스트\" 직책을 맡으며, 막강한 권한을 행사할 수 있습니다. 그러나 티파티 내의 견제와 상호 보완 구조는 호스트의 권력 남용을 방지하고, 정치적 급진주의를 억제하며 안정적인 통치를 가능하게 합니다.\n\n수년 전, 급진적이고, 전쟁광 성향의 파테르 분파 수장이 티파티 호스트 직책에 오른 일이 있었습니다. 이로 인해 게헨나 학원과의 긴장이 고조되었고, 호스트 위기가 발생하였습니다.\n\n상황은 결국 필리우스와 상투스 분파가 연합해 호스트에 대한 불신임 결의를 통과시키는 사태로 이어졌습니다. 해당 결의는 받아들여졌지만, 이는 파테르 분파의 자존심에 큰 상처를 남겼습니다. 이러한 갈등은 1935년 대전이 당시 포로를 향한 전쟁범죄로 감옥에 수감된 파테르 분파 전투병들의 사면을 추진하려던 미소노 미카의 시도가 무산된 이후에도 여전히 완전히 회복되지 않고 있습니다.\n\n이제 운명조차 파테르 분파의 손을 들어주었습니다. 파테르 분파는 키리후지 나기사에 대한 뇌물 의혹을 제기하며 사법당국에 조사를 촉구했고, 수사 기관은 '신뢰할 수 있는 정보원'들의 증언과 자료를 토대로 키리후지 나기사를 업무상배임 혐의로 기소하였습니다. 뇌물 수수가 아닌 점이 아쉽지만, 키리후지 나기사는 분파에 영향이 가는 걸 막기 위해 공식적으로 사임을 발표하였으며, 필리우스 분파의 주요 인사들 또한 이 사법 수사의 흐름 속에서 대거 교체되었습니다. 잔존한 소수의 인물조차 파테르 분파의 영향력 아래 사실상 무력화될 운명에 처해 있습니다."
 trinity_events.1.a: "전부 헌법에 입각한 행동이다."
 trinity_events.2.t: "바시스 스콜라 시위"
 trinity_events.2.desc: "파테르 분파가 티파티와 대법원을 사실상 장악함에 따라, 미소노 미카의 독재를 견제할 수 있는 마지막 장벽마저 무너지고 있습니다. 필리우스 분파와 상투스 분파는 미소노 미카의 급진주의를 막아내지 못하는 상황에 분노를 표출하고 있으며, 특히 키리후지 나기사에 대한 기소는 대규모 시위를 촉발시키는 계기가 되었습니다.\n\n바시스 스콜라에서는 또 다른 시위가 발생하였고, 다수의 필리우스 지지자는 미소노 미카를 \"트리니티의 본질을 파괴하는 데에 몰두한 폭군\"이라며 강도 높은 비판을 쏟아냈습니다."
 trinity_events.2.a: "그래야겠다면 시위하게 내버려둬라."
 trinity_events.2.b: "정의실현부를 보내 해산시켜라."
 trinity_events.3.t: "749년 트리니티 종합학원 헌법"
 trinity_events.3.desc: "엄밀히 말하자면, 트리니티 헌법을 개정하기 위해서는 티파티 2/3의 동의가 필요하며, 개정안은 대법원에 제출되어야 합니다. 이 헌법은 고귀한 의도를 바탕으로 만들어졌고, 시대를 초월한 권위를 지니고 있다는 점에서 의심의 여지가 없지만, 가장 사소한 헌법 개혁조차도 지나치게 복잡하고 지루하게 만드는 문제를 안고 있습니다. 헌법이 완벽하게 설계되었다면 이러한 문제가 덜했겠지만, 현실은 그렇지 않습니다.\n\n이미 티파티와 대법원을 장악한 파테르 분파 앞에서 다른 기구들이 할 수 있는 일은 많지 않습니다. 그러나 파테르 분파는 자신들의 지배력에 정당성을 부여하기 위해 공식적으로 '트리니티 종합학원 헌법 개정안'을 공표했습니다. 이는 파테르 분파가 장악한 티파티의 권한으로 통과되었으며, 749년 트리니티 종합학원 헌법을 사실상 무효로 하는 결과를 낳았습니다. 이 개정안은 티파티를 통해 통과된 마지막 법으로 기록될 것입니다."
 trinity_events.3.a: "아무도 우릴 막을 수 없다!"
 trinity_events.4.t: "미소노 미카 법"
 trinity_events.4.desc: "미소노 미카 법은 '트리니티 종합학원 헌법 제5차 개정안'이라는 명칭에도 불구하고 기존의 제왕적인 호스트 권한과 함께 트리니티를 새로운 준 헌법 국가로 만들기 위한 방대한 법률 포장물입니다. 많은 조항이 모호하게 작성되어 실제 판결은 공무원과 판사의 자의적 해석에 맡길 수 있을 정도로 조항이 모호합니다. 트리니티 삼두정의 거의 모든 보호 장치가 제거되었고, 재산 규정도 마찬가지로 '반국가 활동'과 관련된 모든 재산을 국가가 간단히 국유화할 수 있게 되었습니다.\n\n비준 소식에 티파티에서 파테르 분파 대표들은 우레와 같은 찬성을 보냈고, 곧이어  트리니티 전역의 파테르 분파 간부들이 주최한 공개 행진에서 축하 행사가 이어졌습니다. 타 분파의 반응은 훨씬 더 냉담했고, 미소노 미카의 파테르 분파의 일부 온건주의 인사들조차 미소노 미카의 야망이 어디까지인지 지켜보며 숙고할 수밖에 없었습니다."
 trinity_events.4.a: "트리니티는 홀로선다!"
 trinity_events.5.t: "마지막 자유 연설"
 trinity_events.5.desc: "파테르 분파의 독주 속에서 다른 분파들도 점차 진행 중인 법적 변화의 심각성을 깨닫기 시작했습니다. 이들은 트리니티가 사실상 일당 국가로 전락할 위험이 있다는 위기감을 공유하며, 연합하여 파테르 분파의 독주를 견제하려는 움직임을 보였습니다. 그러나 파테르 분파는 이러한 연합 세력과 적대하며 상황은 점점 악화했습니다.\n\n그 와중에, 필리우스 분파의 수장인 아라하타 와카나는 마이크를 잡고 연설을 시작했습니다.\n\n\"이 운명의 시간에 우리 필리우스 분파는 인류애, 자유, 정의의 원칙에 엄숙히 서약합니다. 미소노 미카는 역사상 단 한 번, 트리니티를 통합하고 더 나은 미래와 세상을 열었던 제1차 공의회의 위대한 업적을 무너뜨렸습니다. 수십만 명의 용감한 트리니티 학생들이 자유를 지키기 위해 목숨을 바쳤습니다. 미소노 미카와 파테르 분파는 이 희생과 대의를 누구보다 잘 알고 있을 것입니다. 그런데 그들이 바로 그 대의를 배신하고 있습니다.\n\n어떠한 법도 영원하고 불멸한 신념을 파괴할 권한을 부여하지 않습니다. 지금 그들의 행동은 신념 없는 테러리스트와 다름없습니다. 하지만 우리는 제1차 공의회에서 선조들이 시작한 길을 절대 잊지 않을 것이며, 그 길에 충실할 것입니다. 폭군은 결코 오래가지 못합니다. 그러니 지금, 이 절망 앞에 굴복해서는 안 됩니다. 영원불멸한 자유 트리니티를 위하여, 함께 박수를 보냅시다!\"\n\n아라하타 와카나의 연설 이후, 타 분파들은 티파티 건물에서 항의 시위를 벌이며 저항의 뜻을 표명했습니다. 그러나 이는 그들이 할 수 있는 전부라는 현실을 절감하게 했습니다. 티파티 건물 밖에서는 학생의 권리를 존중해 달라는 시위가 이어졌지만, 이마저도 현실에 대한 갈 곳 없는 분노로 표출된 것에 불과했습니다."
 trinity_events.5.a: "속이 다 시원하군."
 trinity_events.6.t: "2달 전"
 trinity_events.6.desc: "대전이 사태가 발발하며 트리니티는 근본적인 기반이 붕괴되고, 새로운 땅 위에 가차 없이 내던져졌습니다. 이 충격은 단순한 혼란을 넘어 트리니티의 존립 자체를 위협하는 전례 없는 위기로 이어졌습니다. 사태 직후, 트리니티 종합학원은 독일국과의 치열한 전투에 돌입했습니다. 사투 끝에 승리를 거두었으나, 이 과정에서 발생한 수많은 비극과 사건은 트리니티 학생들에게 깊은 상처를 남겼고, 그들의 성향을 급진화시키기에 충분했습니다. 전쟁은 트리니티의 이상과 질서를 붕괴시키고, 학생들 사이에 분노와 불신을 퍼뜨렸으며, 모든 지표는 최악의 상황을 향해 치닫고 있습니다. 독일국과의 전투에서 승리는 거두었으나, 여전히 남동쪽과 북쪽에서는 저항 세력이 활동하며 긴장을 이어가고 있습니다.\n\n파테르 분파는 상처 입은 사람들 사이에 남아 있던 불신과 긴장감을 이용하여 선전 매체에 집중하기 시작하였습니다. 그들은 말뿐인 평화를 주장하는 필리우스 분파와 상투스 분파를 비난하는 내용을 담은 선전물을 제작하였으며, 이를 일반 학생들에게 집중적으로 노출하였습니다. 그 결과, 다수의 학생이 파테르 분파의 열렬한 추종자가 되었고, 이를 시작으로 파테르 분파는 티파티에까지 강한 영향력을 행사할 수 있게 되었습니다.\n\n필리우스 분파와 상투스 분파 또한 왜곡되고 거짓된 정보가 유포되는 것을 막기 위해 힘썼지만, 이미 파테르 분파의 책략은 예상을 뛰어넘어 트리니티 전역에 깊은 영향을 미치고 있습니다.\n\n그렇게, 1936년 새해는 체념과 두려움 속에서 맞이하게 되었습니다."
 trinity_events.6.a: "그리고 그렇게 시작한다."
 trinity_events.7.t: "호스트 선출"
 trinity_events.7.desc: "트리니티를 휩쓴 위기의 여파는 아직 완전히 사라지지 않았지만, 사태는 서서히 진정 국면에 접어들고 있습니다. 남아 있는 상처와 혼란이 여전히 우리를 괴롭히고 있으나, 악화되던 지표는 다행히 하락세를 멈췄습니다. 이제 트리니티의 미래는 다음 호스트의 판단과 리더십에 달려 있습니다.\n\n트리니티를 이끄는 티파티는 상투스, 필리우스, 파테르라는 3개의 거대 분파로 구성되어 있습니다. 이 외에도 여러 분파들이 존재하지만, 현재 그들은 각자만의 이유로 정계 개입을 거부하고 있습니다. 현재 비상회의는 해산 수순을 밟고 있으며, 상투스 분파의 유리조노 세이아가 다음 호스트로 임명되었습니다.\n\n유리조노 세이아는 본래 중도적이고 보수적인 입장을 고수하며, 실리외교를 통해 트리니티의 점진적인 변화를 지향하는 인물로 평가받아 왔습니다. 그러나 대전이 사태와 그로 인한 참상을 겪으며, 그녀에게는 심리적 변화가 찾아온 듯 보입니다. 최근 상투스 분파 대회에서 그녀는 과거보다 훨씬 급진적인 행동을 촉구하며, 때로는 다소 무례하게 들릴 수 있는 발언도 서슴지 않았습니다. 그럼에도 불구하고, 그녀의 주장은 탄탄한 논리와 근거를 바탕으로 한 교과서적인 정론으로 평가받았으며, 이는 상투스 분파의 주요 정책 방향으로 자리 잡고 있습니다.\n\n그러나 일부 상투스 분파 임원들은 유리조노 세이아가 타락했다며 강하게 비난했습니다. 그럼에도 불구하고, 이러한 반발이 상투스 분파의 주요 정책 방향을 바꾸는 데까지는 이르지 않았습니다."
 trinity_events.7.a: "그래도 아직 시간이 있다."
 trinity_events.8.t: "다락방의 공주님"
 trinity_events.8.desc: "미소노 미카는 늦은 밤까지 사무실에서 일하고 있었다. 그녀의 사무실은 전직 파테르 분파 수장들의 초상화가 벽을 장식하고 있었으며, 고급스럽고 고전적인 장식품들로 채워져 있었다. 비서가 현재 상황에 대해 보고를 올렸지만 미카는 별다른 반응을 보이지 않았다. 시스터후드의 동향, 다른 분파들의 정치적 노선 등 그녀가 고려해야 할 사안이 너무 많았기 때문이다.\n\n잠시 일을 멈춘 미카는 창가로 다가가 먼 하늘을 바라보았다. 키보토스처럼 밤이 밝지는 않았지만 수많은 별들이 어두운 밤하늘을 수놓고 있었다. 그녀는 한동안 생각에 잠긴 채 자신의 계획들을 되짚어 보았다. 비록 일부 계획이 어긋난 부분이 있었지만, 지금의 흐름대로라면 실패할 가능성은 없다. 그녀는 스스로에게 그렇게 말했다.\n\n파테르 분파의 수장으로서 미카는 시간이 얼마 남지 않았다는 본능적인 위기감을 느끼고 있었다. 행동이 지체될수록 계획이 흔들리고, 그 틈을 타 불충한 자들이 음모를 꾸밀 위험이 커진다는 사실을 그녀는 너무나 잘 알고 있었다. 게다가 학생들은 행동에 나서지 않는 파테르 분파를 기회를 잡을 줄 모르는 무능하고 불결한 존재로 경멸하고 있었다. 그 시선들이 그녀를 조여왔다.\n\n그러나 미카는 확신하고 있었다. 언젠가는 파테르 분파의 시간이 올 것이라는 것을. 지금은 절대 권력을 향한 길목에서 모든 위협을 제거하고 그 뿌리를 근절하는 것이 최우선 과제였다. 그녀의 결심은 단단했고, 계획은 흔들리지 않았다. 아니, 흔들려서는 안 되었다."
 trinity_events.8.a: "그리고 운명은 우리 편이었다."
 trinity_events.9.t: "총성 세 발"
 trinity_events.9.desc: "어제 오전 11시 20분, 발터 권총에서 울려 퍼진 세 발의 총성이 트리니티 전역, 나아가 키보토스 전역에 충격을 안겼습니다. 상투스 분파의 수장이자 티파티의 호스트인 유리조노 세이아가 독일 저항 조직원에게 급습을 당해 의식을 잃은 것입니다.\n\n독일 저항 조직인 슈바르체 카펠레 소속의 토마스 서머는 트리니티 중앙광장에서 호스트 취임 연설을 진행 중이던 유리조노 세이아를 향해 돌진했습니다. 경호원들이 이를 저지하려 했지만, 서머는 이를 뚫고 자신의 품에서 권총을 꺼내 유리조노 세이아의 흉부에 두 발, 복부에 한 발을 명중시켰습니다. 네 번째 총알이 발사되기 직전, 그는 경호원들에게 제압당했고 부상 입은 채 삼엄한 경호 속에서 병원으로 이송되었습니다.\n\n이 사건으로 상투스 분파는 큰 혼란에 빠졌습니다. 다음 날, 상투스 분파의 아마베 치카가 수장직을 이어받았지만, 그녀는 즉시 공격받았습니다. 유리조노 세이아의 최측근이자 그녀를 추종하던 인물이 수장이 된다는 것은 많은 이들이 예상하지 못한 결과였기 때문입니다.\n\n이번 사건은 유리조노 세이아가 상투스 분파의 중심 인물이라는 사실을 다시 한번 부각시켰습니다. 그녀는 비록 '자신의 이익을 위해 지나치게 좌파적으로 행동한다'는 비판을 자주 받았지만, 상투스 분파의 기둥 같은 존재였습니다. 현재까지 유리조노 세이아의 상태에 대한 확실한 발표는 없는 상황이며, 상투스 분파 일부에서는 이번 사건이 허술한 보안 체계로 인해 방조된 것이라며 정의실현부를 비난하는 공개 성명을 발표하기에 이르렀습니다."
 trinity_events.9.a: "내가 한게 아니야!"
 trinity_events.10.t: "유리조노 세이아 사망"
 trinity_events.10.desc: "오늘은 트리니티에 있어 가장 비통한 날입니다. 유리조노 세이아가 끝내 사망했습니다. 구호기사단의 온갖 노력에도 불구하고, 총상으로 인한 충격은 그녀의 연약한 몸이 감당할 수 없었고, 며칠 간의 사투 끝에 그녀는 결국 눈을 감았습니다.\n\n이 충격적인 소식을 가장 먼저 접한 것은 상투스 분파였습니다. 유리조노 세이아의 죽음은 상투스 분파의 균열을 더욱 가속화했습니다. 결국, 누구도 만족하지 못하는 타협의 산물로 카토 나츠키가 새로운 수장으로 선출되었습니다. 카토 나츠키는 유리조노 세이아의 사상을 계승하겠다고 주장했으나, 세이아를 지지하던 파벌은 그녀를 신뢰하지 않고 있습니다.\n\n수장 선출 이후, 보수적인 상투스 분파와 유리조노 세이아를 따르던 진보 성향의 파벌은 완전히 분열되었습니다. 진보 성향의 쿠노 미사키는 보수파를 향해 \"수백 년 전의 이상주의적인 체제에만 집착하는 반동\"이라며 강하게 비판했습니다. 전임 수장인 유리조노 세이아가 좌우를 아우르기 위해 애써 놓았던 가교는 그녀의 죽음과 함께 크게 무너졌고, 진보 성향의 인물들은 쿠노 미사키를 중심으로 적극적인 저항에 나서고 있습니다.\n\n현실을 직시한 일부 상투스 분파의 임원들은 이제 다른 분파와의 타협 가능성을 모색하고 있습니다. 그러나 불과 며칠 만에 상투스 분파는 혼란과 공포, 억압의 도가니에 빠져들었습니다."
 trinity_events.10.a: "도미노가 쓰러졌다."
 trinity_events.11.t: "미소노 미카의 호스트 취임"
 trinity_events.11.desc: "호스트가 취임 직후 사망하는 초유의 사건이 발생하며, 트리니티 종합학원은 전례 없는 충격에 휩싸였습니다.\n\n종합학원 헌법에 따라, 다음 호스트는 티파티 투표에서 과반을 차지한 미소노 미카가 맡게 되었습니다. 그러나 그녀의 취임과 동시에 필리우스 분파와 파테르 분파 간의 권력 투쟁이 불가피하게 발생하였고, 이 갈등은 미소노 미카가 호스트로서 직접 정리하기 전까지 계속될 것으로 보입니다.\n\n그럼에도 필리우스 분파 내에서는 반대와 저항의 목소리가 커지고 있습니다. 필리우스 분파는 미소노 미카뿐 아니라 파테르 분파 전체를 유리조노 세이아 암살 사건과 연관지으며, 그 배후로 의심하고 있습니다. 이에 대해 파테르 분파는 자신들과 무관하다고 강력히 부인했으나, 이러한 오해는 쉽게 해소되지 않을 전망입니다.\n\n미소노 미카의 호스트 취임식은 유리조노 세이아 암살 사건의 여파로 인해 소규모로 진행되었습니다. 다른 분파 내의 분위기는 침울하며, 미소노 미카에 대한 경계심과 불안감이 팽배합니다. 그녀는 누구도 예상할 수 없는 인물로, 앞으로 어떤 행보를 보일지에 대한 불확실성이 분파 간 긴장을 더욱 고조시키고 있습니다."
 trinity_events.11.a: "필연적이었다."
 trinity_events.12.t: "토마스 서머 수사"
 trinity_events.12.desc: "에덴의 구호기사단이 혼신의 힘을 다했음에도 불구하고, 유리조노 세이아의 암살자는 심문을 받기 전 치명적인 총격으로 인한 과다출혈로 사망하고 말았습니다.\n\n수사 결과 암살자인 포츠담 출신의 31세 토마스 서머는 1931년 친위대에 가입해 활동하다가 1935년 대전이 사태 이후 슈바르체 카펠레 소속 저항 조직원으로 전향한 인물로 밝혀졌습니다. 그는 결혼한 상태였으나 현재 아내는 행방불명입니다. 주목할 만한 점은 토마스 서머가 유리조노 세이아를 살해하기 며칠 전 한 친위대 대장과 만났다는 사실입니다. 그런데 이상하게도 그 대장은 유리조노 세이아가 암살된 다음 날 홀연히 자취를 감췄습니다.\n\n암살자가 심문도 받기 전에 사망한 점, 아내의 실종, 그리고 친위대 대장과의 접촉 후 대장마저 사라진 점 등 석연치 않은 정황들이 계속 드러나고 있습니다. 이 모든 것이 단순한 우연일까요? 사건의 전말은 여전히 불투명하며, 진실을 밝히라는 목소리는 점점 커지고 있습니다."
 trinity_events.12.a: "불쌍한 멍청이."
 trinity_events.13.t: "시스터후드의 음모?"
 trinity_events.13.desc: "대전이 사태 이후 유리조노 세이아 암살 사건이 발생하고, 트리니티의 정치적 상황이 급격히 요동치면서 시스터후드 내부의 기류 또한 심상치 않게 흐르고 있습니다. 물론, 그들은 과거 정치적 중립과 불간섭을 선언한 바 있습니다. 그러나 이러한 급변하는 정세 속에서 그 선언이 여전히 유효할지는 누구도 장담할 수 없습니다. 지금으로서는 그들이 끝까지 불간섭과 중립의 기조를 유지해주기를 바랄 수밖에 없습니다."
 trinity_events.13.a: "시스터후드가 개입할 이유가 있을까?"
 trinity_events.15.t: "정의실현부 정치의원"
 trinity_events.15.desc: "정치의원 제도는 표면적으로는 정의실현부 부원들의 기강과 투지를 유지하기 위해 도입되었지만, 실제로는 정의실현부를 감시하고 감독하며 자율권을 제한하고, 현 호스트에 충성하도록 만들려는 미소노 미카의 의도가 담긴 제도입니다. 이에 대해 정의실현부 부원들은 강한 반발을 보였으나, 미소노 미카는 기강 해이를 이유로 이를 폐지하지 않고 강행했습니다. 특히, 부장 켄자키 츠루기와 부부장 하네카와 하스미는 이 제도에 대해 상당한 불쾌감을 드러냈으며, 정치의원을 통해 그들의 반대 의사가 알려졌습니다.\n\n그럼에도 불구하고 정의실현부 부장은 제도의 도입 목적을 받아들이기로 결정했습니다. 부부장은 끝까지 거부감을 표했지만, 부장의 설득 끝에 마지못해 정치의원 제도를 수용하게 되었습니다.\n\n이에 미소노 미카는 만족스럽게 보고서를 넘겼습니다. 정치의원이 존재하는 한, 정의실현부는 더 이상 미소노 미카에게 위협이 될 수 없습니다. 설령 그들이 음모를 꾸민다 해도, 조기에 발견하여 제거할 수 있을 것입니다."
 trinity_events.15.a: "정치위원은 상당한 수준의 재량권을 갖게 될 것이다."
 trinity_events.14.t: "유리조노 세이아의 마지막 여로"
 trinity_events.14.desc: "유리조노 세이아는 상투스 분파의 수장이며, 그동안의 행적과 호스트 임기 동안의 업적을 고려할 때 국장을 치를 자격이 충분합니다.\n\n자작나무로 제작된 관은 상투스 분파의 상징색인 진한 노랑과 하얀색 제복을 입은 상투스 분파 임원들, 그리고 트리니티 정의실현부의 호위 속에 엄숙히 운구되었습니다. 그 뒤를 이어 퍼레이드 유니폼을 갖춰 입은 행렬이 따랐고, 상투스 분파의 원로들과 유리조노 세이아의 수많은 자매들이 그 뒤를 이었습니다. 또한, 파테르와 필리우스 분파의 자체 행진 부대가 함께하며, 평소 그녀를 지지하던 일반 학생들의 행렬이 마지막까지 길을 이었습니다.\n\n트리니티 종합학원의 상투스 분파 수장이자 전 호스트였던 유리조노 세이아는 이제 모교의 품에 영원히 안겼습니다."
 trinity_events.14.a: "세이아에게 조의를."
 trinity_events.16.t: "상투스 분파의 운명"
 trinity_events.16.desc: "상투스 분파의 중도적이거나 급진적인 인물들은 모두 탈주하고, 이제 남은 것은 원로들뿐입니다. 그러나 미소노 미카 법이 통과되면서, 그들의 운명도 머지않아 결정될 것입니다.\n\n친 파테르 분파 인물들로 채워진 대법원은 대대적인 심판을 열었습니다.\n\n-아마베 치카, 권한 남용 혐의로 수감.\n\n-카토 나츠키, 정부에 대한 다양한 범죄 혐의로 수감\n\n-미하라 리에, 뇌물 수수 및 근무 태만 등의 혐의로 수감.\n\n-시라키 마유코, 중대한 권한 남용 혐의로 수감.\n\n원로들은 권한 남용과 유리조노 세이아 암살 사건과의 연루 혐의로 재판을 받았으며, 정부에 대한 다양한 혐의가 추가되었습니다. 결국 많은 이들이 수감되며 상투스 분파는 해체 수순을 밟게 되었습니다."
 trinity_events.16.a: "이들은 모두 감옥에서 사라질 것이다."
 trinity_events.17.t: "필리우스 분파의 운명"
 trinity_events.17.desc: "미소노 미카와 키리후지 나기사는 오랜 소꿉친구였지만, 각기 다른 분파에 몸담으면서 그들의 운명도 변하기 시작했습니다. 아무리 깊은 인연이라도 정치가 개입하면 갈라서게 되는 것이 숙명일까요? 티파티는 각 분파가 자신들의 이익을 위해 정책과 법안을 두고 치열하게 싸우는 곳이었으며, 미카와 나기사 또한 여러 차례 대립을 거듭하며 양보 없는 싸움을 벌였습니다. 그리고 결국, 두 사람은 각자의 분파를 대표하는 정치적 인물로 자리 잡았습니다.\n\n그러나 지금의 상황은 어떨까요? 미소노 미카의 폭주를 저지하지 못한 키리후지 나기사는 현재 그녀의 명령에 따라 가택연금된 상태입니다. 과거 파테르 분파 출신 호스트 불신임 결의가 이루어졌던 시기와는 완전히 다른 양상이며, 이번 사태를 통해 파테르 분파의 자존심은 완전히 회복되었습니다.\n\n이제 파테르 분파의 임원들은 보다 강력한 처벌을 요구하고 있습니다. 그러나 미소노 미카는 이에 동조하지 않고 있습니다. 그것이 옛 우정 때문인지, 혹은 다른 정치적 고려 때문인지는 알 수 없으나, 그녀는 보다 온건한 처벌을 주장하고 있습니다."
 trinity_events.17.a: "그녀를 티파티 감옥에 투옥시켜라."
 trinity_events.17.b: "가택연금을 지속해라."
 trinity_events.18.t: "파테르 분파내 불충"
 trinity_events.18.desc: "수많은 이들이 지나가고, 수많은 법이 가결되거나 부결되던 삼두 정치의 근본이자 근원인 티파티에는 이제 파테르 분파와 그들의 수장, 미소노 미카만이 남아 있습니다. 미소노 미카와 파테르 분파는 일사천리로 자신들에게 유리한 법안을 통과시키며, 트리니티에 대한 장악력을 빠르게 강화하고 있습니다.\n\n어쩌면 당연하게도, 일부 온건적이거나 반 미카적 성향을 가진 분파 임원들은 이러한 계획을 반대하며, 티파티라는 연극의 장막 뒤에서 미소노 미카를 비롯한 일부 파테르 분파 임원들을 끌어내릴 계획을 세우고 있었습니다.\n\n그러나 그것이 운명이었는지, 혹은 신의 장난이었는지는 알 수 없지만, 쿠데타 계획은 실행되기도 전에 발각되었습니다.\n\n\"반역!\" 모든 트리니티의 뉴스가 이렇게 외치고 있습니다. 파테르 분파 내 반 미카적 성향을 가진 일부 임원들은 미소노 미카를 끌어내리려는 구체적인 음모를 세운 혐의로 현재 재판을 받고 있습니다. \"익명이지만 신뢰할 수 있는\" 다양한 소식통이 제공한 자료에 따르면, 이 음모는 경우에 따라 최대 1년 전으로 거슬러 올라가며, 타 분파의 임원들과 내통하거나 파테르 분파 임원들의 정보를 노골적으로 제공하는 등의 행위가 포함되어 있다고 합니다.\n\n미소노 미카 호스트는 이번 사건에 대한 언급을 자제하고 있지만, 일부 파테르 분파의 임원들이 트리니티의 이익을 최우선으로 고려하지 않는다는 사실이 명확해지면서 내부의 불충을 제거하기 위한 대규모 숙청이 단행될 것으로 예상됩니다."
 trinity_events.18.a: "하나, 하나 베어가며 내전을 끝낸다."
 trinity_events.19.t: "대법원"
 trinity_events.19.desc: "트리니티 대법원장의 임명은 티파티의 동의를 얻어 호스트가 지명하는 방식으로 이루어집니다. 그러나 지금의 정세는 마치 운명이라도 된 듯, 파테르 분파에게 유리하게 흐르고 있습니다. 상투스 분파는 유리조노 세이아 암살 사건을 계기로 급속히 분열했고, 그 결과 파테르 분파가 티파티 내 의석 과반을 차지하고, 미소노 미카가 호스트직을 차지하면서, 미소노 미카와 파테르 분파는 누구도 부정할 수 없는 절대적 권력을 손에 넣었습니다.\n\n미소노 미카는 자신의 지배를 영구적으로 만들기 위해 대법원장 임명을 추진하며 티파티에 이를 요청했습니다. 과반을 차지한 파테르 분파는 당연히 이를 승인했습니다. 필리우스 분파의 격렬한 정치적 견제와 저항이 있었지만, 티파티에서 절대적 우위를 점한 파테르 분파 앞에서는 그저 무의미한 발버둥에 불과했습니다.\n\n이제 마지막 사법적 절차마저 미소노 미카와 파테르 분파의 손아귀에 들어왔습니다. 미소노 미카의 추천으로 임명된 대법원장과 대법관들은 기존 대법관들을 축출했고, 이에 필리우스 분파는 강하게 반발하며 격렬한 비판을 쏟아냈습니다. 그러나 미소노 미카는 이를 아랑곳하지 않은 채 자신의 뜻을 계속해서 밀어붙였습니다."
 trinity_events.19.a: "이건 시작에 불과하다."
 trinity_events.20.t: "두 번째 트리니티의 태동"
 trinity_events.20.desc: "'대전이 사태'에서 시작된 일련의 중대한 사건들은 유리조노 세이아의 불행한 죽음과 티파티 붕괴를 거치며 새로운 국면을 맞이하였습니다. 이제 더 이상의 혼란은 없을 것입니다. 호스트 미소노 미카의 지도력 아래, 트리니티는 크나큰 진전을 이루고 있습니다.\n\n새롭게 제정된 트리니티 법률은 대중의 의지를 반영하며, 신앙 또한 법률에 명시되었습니다. 모든 군대는 새로운 지도자에게 충성을 맹세하였으며, 대중들은 마침내 안정된 삶을 되찾게 될 것입니다. 개혁이 하나씩 시행될 때마다 파테르 분파는 트리니티의 중심에 더욱 깊이 자리 잡았고, 반면 다른 분파들은 점점 더 깊은 어둠 속으로 가라앉고 있습니다. 이제, 트리니티의 변화에 대한 공식적인 선언이 이루어질 때가 되었습니다.\n\n트리니티 종합학원은 하나의 유기체와도 같습니다. 모든 이들이 하나로 모여, 공통된 목표를 향해 나아갑니다. 수많은 깃발이 펄럭이는 에덴 광장에서, 미소노 미카가 모습을 드러냅니다. 소란스럽던 광장은 그녀의 등장과 함께 차츰 조용해졌고, 이내 모든 이들이 단상 위에 선 그녀의 목소리에 귀를 기울였습니다. 미소노 미카는 팔꿈치에 자신의 모자를 얹은 채, 파테르 분파의 승리를 되풀이하며 연설을 이어갔습니다. 그리고 마침내, 그녀의 뒤로 펼쳐진 새로운 트리니티의 국기와 함께 구체제의 종말을 선언하였습니다. 시대의 격동 속에서 트리니티가 새롭게 태어났음을 천명한 것입니다. 파테르 분파의 임원들은 일제히 환호하며 함성을 질렀고, 잠시 후 광장을 가득 메운 대중들 또한 그 뒤를 따랐습니다."
 trinity_events.20.a: "모교 만세!"
 trinity_events.21.t: "트리니티 의용군단"
 trinity_events.21.desc: "트리니티의 반정부적 저항이 아예 없었다고 하면 거짓일 것입니다. 그러나 지속적인 탄압 속에서도 놀랍게도 살아남았습니다. 정의실현부의 감시망이 좁혀오던 중 대전이 사태가 발생하면서 이들은 극단적인 방향으로 치닫고 있었습니다. 오늘, 이른 아침 출근을 위해 대중교통을 이용하던 전 상투스 분파 임원을 향해 폭탄이 던져졌고 폭탄이 터져 전 상투스 분파 임원은 큰 피해를 입었고 대중교통을 이용하던 시민 대다수가 중상을 입었습니다. 이는 그녀가 파테르 분파와의 밀착 관계가 있었다는 의혹에 대한 사적제재로 추측 되고 있습니다.\n\n본래 소수의 반정부적 성향을 가진 민병대였지만 대전이 사태가 터지고 나서 이들은 급격하게 단체에 민병대원들을 받아들이기 시작하였고 현재 어느 지역에서는 알아주는 테러리스트들로 변하였습니다. 또한 미소노 미카가 정권을 잡으며 좌파적인 성향을 가진 분파 임원들 중 일부 또한 이 단체에 가담하는 등 여러 문제가 들려오고 있습니다.\n\n호스트에 대한 공통된 증오심을 매개로 더 온건한 성향의 세력들까지 끌어들이고 있다는 정황이 포착되었습니다. 극좌적 성향을 가진 전 상투스 분파 임원이였던 야마지 로미가 조직의 배후 인물로 지목되어, 국외 작전도 불사하며 그를 찾기 위한 대대적인 수색이 진행 중입니다."
 trinity_events.21.a: "그들을 발견한다면 그 즉시 파괴하라."
 trinity_events.22.t: "충성 조항"
 trinity_events.22.desc: "공직자의 도덕성과 이념을 검증하지 않았다는 사실이 믿어지십니까? 지금까지 공직자들의 도덕성과 정치적 성향을 면밀히 검증하지 않은 결과, 비애국적 성향을 지닌 이들이 쉽게 미디어를 장악하고 정부의 고위직을 차지하는 일이 빈번하게 발생했습니다. 실제로 상투스 분파의 수장이자 호스트인 유리조노 세이아 암살 사건으로 증명된 사실입니다.\n\n이제 더는 좌시할 수 없습니다! 트리니티가 위기에 처한 현 상황에서, 새로운 공무원법의 충성 조항을 도입하여 모든 공공기관의 인사들이 친 파테르 적 교육을 받고, 그 규율을 따름으로써 트리니티에 대한 충성심을 증명해야 합니다.\n\n모든 공직자를 트리니티에 충성하게 만들기 위해 가장 효과적인 방법은 '파테르 분파' 가입을 의무화하는 것입니다. 더 이상 다른 분파도 존재하지 않으며, 학생 의지를 대변하고, 안정을 유지하는 가장 좋은 방법이 될 것입니다. 예상대로 신규 구성원이 대거 증가하였으며, 반발하는 일부는 항의의 뜻으로 사직서를 제출하였습니다.\n\n물론 반 트리니티 조직과 연계된 비애국적 공직자들은 파테르 분파 가입이 금지되었으며, 이는 사실상 해고 조치와 다름없습니다. 더욱이, 이들 중 소수는 공공의 안전을 위협할 가능성이 높다고 판단되어, 정의실현부가 즉각적인 수사에 착수하였습니다."
 trinity_events.22.a: "최고를 위해 몇몇 예외사항을 두자."
 trinity_events.22.b: "트리니티에 대한 사랑이 가장 중요한 자격 요건이다."
 trinity_events.23.t: "하얀제복단"
 trinity_events.23.desc: "학원방위대는 하얀 제복을 착용하고 활동하는 것이 어느 정도 의무화되어 있습니다. 특히 고위층으로 갈수록 하얀 제복은 일상에서도 어느 정도 착용을 권고하고 있습니다.\n\n미소노 미카가 정권을 잡기 전부터 티파티 임원들 중 일부 호전적인 인물들은 자신들만의 '민병대'를 활용하였습니다. 주로 불량배 출신이거나 사태 이후 불량배가 되었거나 성적 미달로 트리니티에서 퇴학당한 이들로 구성된 사병들은 정치적인 활동에 동원되기도 했습니다. 아니면 자경단처럼 치안 유지를 목적으로 순찰을 돌거나 범죄자 체포를 위해 정의실현부를 돕는 등 여러 가지 일에 동원되고 있었습니다.\n\n미소노 미카는 개인들이 사병을 보유하고 있는 것을 흥미롭게 여기고 있습니다. 어느 정도 무력을 가진 것은 위협적이나 그 수준이 정의실현부 부원보다는 못하기에 미소노 미카는 정권을 찬탈한 이후에도 어느 정도 '양보'를 하고 있었을 뿐이었습니다. 특히 키보토스 출신의 불량배와 퇴학생을 트리니티의 전력으로 써먹을 수 있다는 것은 이점이 있기 때문입니다.\n\n물론 무조건 정치적인 활동에 동원되는 것만은 아닙니다. 자원봉사를 목적으로 순찰을 돌고 나눔을 베풀고 신앙을 실현하며 지급되는 소량의 활동비로 삶이 무너진 이들에게 기부하고 소수의 독일 현지인들에게 자신들의 끼니를 나누고 갈 곳 없는 고아들을 지원하는 등 여러 스펙트럼을 가진 이들 또한 존재합니다.\n\n미소노 미카는 이러한 사병들을 하나의 단체로 구성하였고 '학원방위대'라는 이름으로 이들을 소집했습니다."
 trinity_events.23.a: "끝없이 행진하리라."
 trinity_events.24.t: "파테르 분파의 부상"
 trinity_events.24.desc: "수많은 이들이 파테르 분파에 가입하면서 파테르 분파는 기존의 고지식한 엘리트주의 집단이 아닌 일반 학생들을 위한 대중적인 분파로 변모해가고 있습니다. 그럼에도 아직 대중적인 분파라는 것에 미숙한 파테르 분파는 여러가지 사건사고가 발생하고 있습니다. 특히 최근의 발생한 사태 때문에 일반 대중들이 겪고 있는 어려운 시기에 배가 고프다면 빵 대신 케이크를 먹으라는 발언은 절대 일반 학생들을 위한 발언이 아닙니다.\n\n파테르 분파는 그럼에도 대중적인 분파로 변모하고 있습니다. 파테르 분파의 임원들은 사비를 이용해 사람들에게 간단한 '복지'를 뿌리고 있습니다. 물론 사비를 이용하는 것이기에 티파티 임원들의 월권 행위라고 비판 받고 있지만 신헌법이 보장하는 한 이들은 아무런 처벌 없이 피해갈 수 있습니다."
 trinity_events.24.a: "대천사의 추종자들이 마침내 형태를 갖추게 되었다."
 trinity_events.25.t: "파테르 분파의 경향"
 trinity_events.25.desc: ""
 trinity_events.25.a: "좀 더 '학생과 대중'을 위한 분파로 변모해야 한다. "
 trinity_events.25.b: "'티파티'라는 틀을 벗어나지 말자."
 trinity_events.26.t: "대회의 끝"
 trinity_events.26.desc: "파테르 분파의 방향에 대한 가장 중요한 질문이 해결되었으며, 참석자 대부분이 이를 인정하여 강령의 하나로 채택되었습니다. 이어서 또 다른 사회 문제에 대한 논의가 진행되었고, 대회는 마무리를 향해 나아가고 있습니다. 특히, 트리니티의 인물들과 독일 정치인들이 서로를 향해 연설을 주고받으며 치열한 공방을 벌인 장면은 신문에 실릴 정도로 뜨거운 관심을 불러일으켰습니다.\n\n대회의 마지막, 호스트는 파테르 분파 임원들에게 연설하며 \"모교을 쇄신하는 막중한 의무\"를 지닌 이들을 치하했습니다. 그녀는 \"오늘 이 자리에 모인 임원들은 분명 그 임무를 수행할 준비가 되어 있으며, 나 역시 이들과 함께 의미 있는 성과를 이루기를 기대한다\"고 말하며 대회를 마무리했습니다."
 trinity_events.26.a: "두 번째 트리니티를 위해, 만세를 외치자!"
 trinity_events.27.t: "미소노 미카의 인상"
 trinity_events.27.desc: "미소노 미카는 대중 앞에 나서는 것을 좋아하며 확고한 이미지를 구축해나가고 있습니다. 그녀는 전 트리니티 학생들에게 희망이 되고 있고, 독일 대중들에게는 새로운 대안으로 자리잡고 있습니다. 부드럽지만 강렬한 카리스마로 정권을 장악한 그녀는 대중들에게 영감을 불러일으키는 매개체 역할을 하고 있습니다. 키보토스 억양이 남아있지만 독일어도 구사할 수 있으며, 이전 나치 정권의 치부를 대중들에게 공개하여 독일인들에게서도 지지를 얻고 있습니다.\n\n확고한 이미지를 남기기 위해 그녀의 이명에 새로운 색채가 더해지고 있습니다. 이미 '대천사'라는 이명이 널리 퍼져있지만 이것만으로는 충분하지 않습니다. 종교적인 색채가 담긴 이명은 모든 사람에게 통하지 않기 때문입니다. 트리니티 학생들은 그녀를 '트리니티의 구원자', '자상한 어머니', '운명의 사자', '선택받은 자' 등으로 부르고 있습니다. 이 외에도 여러 이명들이 존재합니다. 심지어 긍정적으로 받아들여야 할지 모호하지만, 독일인들 사이에서는 '영도자'라고 지칭하고 있습니다.\n\n확고한 이미지를 구축하기 위해서는 하나의 단어를 선택할 필요가 있습니다. 그럼에도 불구하고 미소노 미카는 트리니티의 구원자이자 자상한 어머니이며, 운명의 사자이자 선택받은 자이고, 영도자이며, 동시에 티파티의 호스트이자 전 트리니티의 학생회장입니다."
 trinity_events.27.a: "호스트는 트리니티의 구원자시다."
 trinity_events.27.b: "호스트는 자상하신 어머니다."
 trinity_events.27.c: "호스트는 모든 이들의 영도자시다."
 trinity_culture_events.1.t: "'트리니티 신 문화'"
 trinity_culture_events.1.desc: "문화라는 것은 사회 전반의 생활 양식이라고 단순화하여 설명할 수 있습니다. 그러나 그 문화가 퇴폐적이라면, 우리는 어떻게 해야 할까요? 그것 역시 하나의 문화로 받아들이고 퇴폐적인 문화 활동을 이어가야만 할까요? 이에 대해 미소노 미카와 파테르 분파는 분명히 \"아니오\"라고 답했습니다.\n\n트리니티가 예술적-사상적으로 일정 부분 진보해 왔음은 사실이지만, 타 학원과 비교했을 때 크나큰 도약을 이루지는 못했습니다. 평화의 시기 동안 우리는 지체되었습니다. 타 학원들은 우리를 따라잡거나 뛰어넘었으며, 심지어 트리니티와 앙숙인 게헨나 학원조차도 트리니티에서는 느낄 수 없는 고유한 문화적 방식을 확립해 살아가고 있습니다.\n\n이에 파테르 분파는 이러한 퇴폐 문화를 뿌리 뽑고자 미소노 미카에게 한 가지 정책을 건의했습니다. 기존 문화청의 권한을 확장하여, 퇴폐적 문화를 반대하고 트리니티만의 고유한 신 문화를 창출-진흥해야 한다는 것이었습니다. 미소노 미카는 이 건의를 진지하게 검토했고, 곧 승인하였습니다.\n\n사실 미소노 미카는 이전부터 신 문화에 깊은 고민을 하고 있었습니다. 그녀는 기존의 방식들을 지나치게 '귀찮고 짜증나는 것' 정도로 여겨 왔습니다. 그렇기에 파테르 분파 측에서 먼저 이와 같은 제안을 한 것은, 미소노 미카에게도 뜻밖의 행운이었을 것입니다."
 trinity_culture_events.1.a: "새로운 문화, 새로운 트리니티!"
 trinity_events.28.t: "트리니티 교육과정"
 trinity_events.28.desc: "트리니티의 기존 교육 방식은 가톨릭적 색채를 바탕으로 하면서도 문화와 예술에 중점을 두었으며, 문무겸비를 중요시 여기는 미션스쿨의 기반 위에서 발전해 왔습니다. 최근 변화에 따라 대부분의 교사들은 의무적으로 파테르 분파에 가입해야 하며, 정기적인 이념 교육을 받으며 학생들에게 트리니티 사회주의를 전파하는 역할을 맡게 되었습니다.\n\n그러나 파테르 분파 내에서는 교육의 방향성을 두고 갈등이 나타났습니다. 기존 분파의 주요 인물들은 학원을 보다 군사화하는 데 초점을 맞춰야 한다고 주장하며, 신체 단련을 강화하여 더욱 완벽한 군인을 양성하는 것을 목표로 해야 한다고 강조하고 있습니다. 이들은 이러한 방식이 과거 트리니티 고유의 정신을 되살릴 수 있으며, 트리니티를 보다 ‘트리니티답게’ 변화시킬 수 있다고 주장합니다.\n\n반면, 이에 반대하는 입장은 주로 '온건파'에서 나오고 있습니다. 온건파는 기술 교육을 포함하면서도 기존의 문화, 예술, 역사, 전통을 최대한 유지하는 방향으로 교육 체계를 개편할 것을 호스트에게 기대하고 있습니다. 또한, 트리니티가 기술적 우위를 차지하기 위해서는 문화적 정체성을 유지하면서도 기술 분야의 인재 양성에 집중하는 것이 가장 적절하다는 견해를 내세우고 있습니다."
 TRN_honor_spread_of_militarism_upgrade_tt: "§Y$TRN_honor_spread_of_militarism$§! 효과가 강화됩니다."
 trinity_events.28.a: "고참 파테르 임원들의 주장을 수용하자."
 trinity_events.28.b: "온건 파테르 임원들의 주장을 수용하자."
 trinity_culture_events.2.t: "건축 양식"
 trinity_culture_events.2.desc: "트리니티 종합학원의 예술에는 다양한 요소가 존재하며, 특히 건축 양식이 잘 알려져 있습니다. 그 주요 특징으로는 대칭과 비례, 고전적인 요소, 중앙집중형 구조, 그리고 장식과 절제가 있습니다. 그러나 이러한 건축 양식에는 치명적인 단점도 있습니다. 실생활에 불필요한 장식이 많아 불편을 초래하고, 안정성과 실용성을 확보하지 못한다면 건축의 의미가 퇴색됩니다. 이제 아름다움은 더 이상 최우선이 아닙니다. 사태 이후에는 기존 건축 양식이 비효율적이며 자재 소모가 지나치게 많아, 건물 재건에 막대한 비용과 시간이 소요된다고 판단되었습니다.\n\n이에 파테르 임원들은 ‘현대주의(Modernism)’에 주목하기 시작했습니다. 그들은 불필요한 아름다움을 덜어내고, 안정성과 유용성, 그리고 현대적인 재료와 기법 그리고 구하기 쉬운 자제를 중심으로 새로운 건축 양식을 정해야 한다며 주장했습니다. 그러나 이러한 주장에서도 고참 임원들과 온건파들이 서로 다른 주장을 내세우고 있습니다.\n\n특히 온건파를 중심으로, 구 트리니티 건축가들의 '친환경적' 방식을 받아들여야 한다는 주장이 제기되고 있습니다. 그들은 이렇게 말했습니다.\n\n\"과거 트리니티의 위대한 건축가들은 환경을 중시했습니다. 우리의 수도 에덴이 있는 중앙구를 바라봅시다. 지금은 다소 본래의 모습을 잃었지만, 여전히 자연과 어울려 조화를 이루고 있습니다. 길은 이미 과거에 제시되었고, 우리는 그 길을 따라가면 될 뿐입니다.\" 연설이 끝나자 온건파들의 환호가 이어졌습니다.\n\n그러나 곧이어 고참 임원들의 연설이 있었습니다.\n\"에덴이 친환경적이고 조화로우며 관광지로도 유명한 것은 사실이나, 우리는 본래의 목적을 잃고 있습니다. 우리는 새로운 세계에서 새로운 건축 양식으로 트리니티를 다시 일으켜야 할 의무를 지니고 있습니다. 친환경은 중요한 요소이지만, 현재의 상황에서는 우선순위에서 밀릴 수밖에 없습니다. 우리는 이미 광활한 토지를 상실했고, 공백을 메우는 것만으로도 벅찬 상황입니다.\"\n\n고참 임원의 발언은 이념주의자들의 환호를 불러왔고, 이제 두 파벌은 미소노 미카의 결정을 기다리고 있습니다."
 trinity_culture_events.2.a: "친환경적인 모더니즘은 분명 트리니티의 고유한 문화로 발전시킬 수 있을 것이다."
 trinity_culture_events.2.b: "친환경은 중요하지만 우선순위에서는 뒤로 밀린다."
 trinity_culture_events.3.t: "대중문화 통제"
 trinity_culture_events.3.desc: "대중문화는 말 그대로 대중들이 쉽게 접할 수 있는 문화입니다. 그러나 다르게 말하자면, 대중을 손쉽게 통제하고 선전할 수 있는 도구로 전락할 수도 있다는 뜻이기도 합니다. 그렇기에 파테르 분파는 이 영역에서 하나의 '패권'을 쥐기 위해 꾸준히 노력해 왔습니다. 미소노 미카 집권 이전까지는 그 전략이 어느 정도 효과를 발휘하는 듯했으나, 결국 한계에 부딪혀 더 이상 의미 있는 성과를 내지 못하게 되었습니다.\n\n이에 파테르 분파는 대중문화를 확실히 통제하기 위해 티파티의 권한을 활용하자고 제안했습니다. 언론, 출판, 교육, 영화 등 모든 매체에서 미소노 미카를 옹호하고, 트리니티의 고유한 이념을 교묘히 스며들게 하는 것, 혹은 예술과 음악을 동원해 트리니티에 대한 충성을 강요하는 오페라나 교향곡을 제작하는 방안까지도 논의되었습니다."
 trinity_culture_events.3.a: "과도한 통제 오히려 불만을 일으킬 수 있다. 이에 반대한다."
 trinity_culture_events.3.b: "대중문화 통제는 트리니티를 지키는 또 다른 방패가 될 것이다."
 trinity_events.29.t: "'교회 투쟁'"
 trinity_events.29.desc: "문화 투쟁이라는 말은 트리니티 학생들에게는 다소 낯설지 모르지만, 독일인들에게는 익숙한 개념입니다. 과거 독일에 황제가 존재하던 시절, 비스마르크가 이끄는 독일 정부와 교황청 사이의 갈등이 바로 그 시작이었습니다. 교황청의 도전으로 불붙은 투쟁은 결국 비스마르크와 교황 간의 극적인 화해로 막을 내렸지만, 그 과정에서 오히려 가톨릭 정당이 더 강해지는 역효과를 낳았습니다.\n\n그러나 지금의 상황은 그때와는 다릅니다. 독일은 이미 트리니티와 게헨나로 갈라졌고, 종교인들은 점차 극단적인 모습을 드러내고 있습니다. 그들은 트리니티 학생을 도덕과 규율, 윤리를 따르지 않는 공동체의 예외적인 존재로 낙인찍고 배척하고 있습니다. 심지어 티파티의 권위에 도전하며, 넘지 말아야 할 선조차 넘어섰습니다.\n\n이에 미소노 미카는 이들을 억제하고 트리니티의 권위에 굴복시키기 위해, 물밑에서 조용히 움직이기 시작했습니다. 현재 교회는 청년 단체, 학교, 자선 단체 등 대부분 사적인 조직 형태로만 남아 있습니다. 이들부터 하나씩 통제해 나가는 것을 시작으로, 우리는 독일의 신앙과 본격적인 투쟁에 나서야 할 것입니다."
 trinity_events.29.a: "\"트리니티가 그들을 덮쳤을 때...\""
 trinity_events.30.t: "여성 인권"
 trinity_events.30.desc: "나치의 여러 정책들과 Kinder(아이), Kuche(부엌), Kirche(교회) 정책으로 인해 여성 인권은 급격하기 후퇴되고 통제 되었습니다. 트리니티가 독일국과의 전투에서 승리하며 독일 정부가 역사의 쓰레기통으로 사라지자 정책들은 자연스럽게 폐지 되었고 그 효력을 잃었습니다. 또한 탈나치화를 진행하면서 여성 인권이 자연스럽게 성장하고 있습니다. 하지만 아직도 수많은 여성들은 스스로를 이념 아래에 예속하며 나치 정부의 정책적 기조를 이어 나가고 있습니다..\n\n이러한 여성 인권 문제에 대해서는 수많은 의논들이 이뤄지고 있으나 가부장적인 독일의 문화를 하루 아침에 바꾸리란 어려운 과제 입니다. 그러나 대안이 아예 없는 것은 아닙니다. 트리니티 중앙구에서 개최 된 파테르 분파 대회에서 미소노 미카와 그의 신도들이 모여있는 곳에서 차례대로 연설을 시작하였습니다. 여성 인권을 주제로 열띈 토의가 이뤄졌으며 이 과정 중에서도 꽤나 좋은 아이디어들이 오고 갔습니다.\n\n특히 여성들의 기회 확대 부터 시작하자는 의견들이 주 의견을 이루고 있습니다. 특히 나치 정부 아래에서 후퇴한 부분 부터 수정하자는 내용은 많은 임원들에게 공감을 샀습니다. 물론 트리니티의 정부 기조에 따라서 이 여성들의 목적을 조금 비틀 수는 있습니다. "
 trinity_events.30.a: "여성들이여, 힘내라! 우리가 함께한다!"
 trinity_events.30.b: "목적을 약간 비틀어보자"
 trinity_events.31.t: "독일의 운명"
 trinity_events.31.desc: "미소노 미카와 파테르 분파는 트리니티의 독일인들에 대해 의논을 나누고 있습니다. 현실적으로 추방이 좋은 선택지처럼 보입니다. 그러나 수천만에 달하는 독일인을 전부 추방할 수는 없습니다. 그렇기에 독일인들을 트리니티에 종속시키거나, 아니면 독일이라는 개념을 철저히 파괴해 더 이상 저항할 의지를 온전히 꺾어버려야 합니다.\n\n파테르 분파 대부분은 독일의 정체성라는 개념을 철저하게 '말살'시키고 그들을 '노예'처럼 부리는 방안을 지지하고 있습니다. 이들은 독일인의 근본이 되는 것들을 파괴하고 그 자리에 트리니티를 심을 계획입니다.\n\n당연히 이러한 계획은 미소노 미카의 지지를 받지 못하고 있습니다. 미소노 미카에게는 생각보다 여린 마음이 남아있습니다. 정적들을 제거하더라도 그들에게 죽음을 부여하지 않았습니다. 그저 중앙에서 멀리 떨어진 곳으로 보내 정치 활동을 할 수 없도록 감시하는 선에서 마무리했습니다. 이러한 연민을 독일인들을 향해서도 느끼고 있습니다. 그러나 너무 강한 연민은 보이지 않습니다. 미소노 미카는 불쌍하지만 어쩔 수 없는 일로 치부하며 독일인들의 운명을 결정하고 있습니다."
 trinity_events.31.a: "독일인은 살아남을 것이다. 2급 시민으로서 말이다."
 trinity_events.31.b: "독일의 정체성이라는 건 말살될 것이다. 영원히."
 trinity_events.32.t: "학원의 목자"
 trinity_events.32.desc: "트리니티의 지도자이자 티파티의 호스트인 미소노 미카는 수많은 이명으로 불리며, 그중에서도 특히 '학원의 목자'라는 칭호를 마음에 들어합니다. 트리니티의 보호자이자 구원자, 그리고 학원을 이끄는 존재라는 의미를 담은 '목자'라는 단어는 그녀에게 새로운 영감을 불어넣고 있습니다.\n\n사회적 갈등은 여전히 완전히 해결되지 않았지만, 이전보다 더 많은 독일인들이 미소노 미카를 지지하고 그녀의 지도를 받아들이고 있습니다. 트리니티 학생들 사이에서도 독일인을 향한 증오 범죄나 쾌락을 위한 범죄들이 점차 줄어들고 있습니다. 이는 정의실현부와 트리니티 자경단의 활약 덕분입니다. 많은 학생들이 독일인들에게 연민을 품고 다가가고 있으며, 지금은 어렵더라도 시간이 충분히 주어진다면 트리니티 학생들과 독일인들이 진정으로 융화하는 날이 머지않아 보입니다.\n\n여담으로, 트리니티 내 일부 소규모 독일인 커뮤니티에서는 미소노 미카를 일종의 '아이돌'처럼 여기는 분위기가 조성되며, 팬덤 문화가 조심스럽게 자리잡아가고 있습니다."
 trinity_events.32.a: "준비하라!"
 trinity_events.33.t: "티파티의 호스트 지명"
 trinity_events.33.desc: "유리조노 세이아 암살 사건의 여파는 가라앉을 기미가 보이지 않았고, 다음 호스트는 과연 누가 될 것인지에 대한 의문이 떠오르기 시작하였습니다.\n\n티파티의 많은 임원들은 미소노 미카가 차기 호스트로 지명될 것이라 예상했고, 이는 거의 기정사실로 받아들여졌습니다. 유리조노 세이아 암살 이후 상투스 분파는 사실상 영향력을 상실했으며, 키리후지 나기사가 이끄는 필리우스 분파 또한 파테르 분파의 거센 정치적 공세 앞에서 제대로 된 반격조차 어려운 상황이었습니다.\n\n그러나 미소노 미카가 절대적인 차기 호스트라는 보장은 없었습니다. 그녀의 선전 전략은 파테르 분파의 세력을 급격히 확장시키는 데 성공했지만, 내부적으로도 반대 목소리가 나오기 시작했습니다. 특히, '온건파' 세력은 이러한 흐름에 반기를 들었습니다.\n\n그럼에도 불구하고, 희망은 보이지 않았고 결국 호스트 투표가 시작되었습니다. 후보로 나선 미소노 미카와 키리후지 나기사는 티파티의 선서 아래 자신들의 정책을 차례로 연설했습니다. 미소노 미카가 연설을 할 때, 파테르 분파는 열광적인 호응을 보였지만, 반대로 키리후지 나기사가 연설할 때는 무관심하거나 야유가 쏟아지는 등 여러 문제가 발생했습니다. 다행히도, 투표 과정 자체는 비교적 큰 문제 없이 진행되었습니다.\n\n그리고 마침내, 개표가 시작되었습니다. 개표 방송이 빠르게 진행되었고, 이제 남은 것은 오직 하나입니다.\n\n결과는 과연...?"
 trinity_events.33.a: "미소노 미카가 과반을 차지하며 선출 되었다."
 trinity_events.33.b: "모두의 예상을 뒤엎고, 키리후지 나기사가 선출 되었다."
 TRN_sorry_Nagisa_branch_is_NOT_work: "§L정말 죄송합니다!!!! 키리후지 나기사 컨텐츠는 현재 미완성입니다 ㅜㅜㅜ 가능한 빨리 제작하겠습니다!!§!"
 trinity_events.34.t: "학원경제개발부 부장 임명"
 trinity_events.34.desc: "학원의 총채적인 경제 문제를 해결하기 위해 경제와 산업 전문가들이 소집되어 학원경제개발부가 창설되었습니다. 이 조직은 공식적인 대표 없이 느슨한 협동조합주의적 성향을 띄우고 있습니다. 각자 자신만의 방식이 옳다고 주장하며 열띤 토론과 연구를 이어가는 모습은 바람직하지만, 지나치게 과열되지 않도록 조정하는 역할이 절실합니다. 이 조율자의 역할을 맡는 것이 학원경제개발부의 부장이 될 것입니다.\n\n현재 개발부 내부에서 마땅히 맡을 자가 없어 보이지만, 이미 외부에서 그 해답을 찾았습니다. 도서부장 우이와 도서부원 시미코입니다.\n\n코제키 우이는 현재 도서부장으로, 책을 사랑하는 인물로 잘 알려져 있으며 이는 경제학 서적 역시 자주 읽어보고 이해하고 실현할 지도 모릅니다. 그녀의 내성적인 성격과, 부족한 인간관계를 예시로 부적합 하다는 내용도 있지만, 이정도는 충분히 고칠수 있습니다.\n\n다음은 엔도우 시미코입니다. 그녀 또한 도서부의 일원입니다. 트리니티에 존재하는 모든 서적을 읽어봤다고 자처합니다. 또한 거대한 도서를 관리하는 모습과 꽤나 다른 학생들과 교류하는 등 여러 부분을 "
 trinity_events.34.a: "코제키 우이, 내성적인 성격은 별로 문제가 되지 않는다."
 trinity_events.34.b: "엔도우 시미코, 중재하는 모습이 큰 귀감이 되었다."
 trinity_events.34.c: "알아서들 해라"
 trinity_events.35.t: "학원정보국 재편"
 trinity_events.35.desc: "끔찍했던 유리조노 세이아 암살 사건 이후, 트리니티 학원정보국은 사실상 기능을 상실했음이 명백히 드러났습니다. 대외 정보 수집 능력은 타 학원과 비교해 부족한 수준이며, 내부 방첩 체계는 말 그대로 처참합니다. 트리니티의 안보를 책임지는 이들이 이래서야 과연 괜찮다고 할 수 있겠습니까? 현 학원 정보국장인 이타노 요리코는 이러한 문제들을 자신이 해결할 수 있다며 시간을 요청하고 있으나, 이 사안은 시간에 맡겨 둘 수 있을 만큼 느긋한 문제가 아닙니다.\n\n학원 정보원은 더 이상 독립 기관이 아닌, 티파티 산하 내무 부서로 재편될 예정입니다. 이타노 요리코 학원 정보국장은 즉시 해임되며, 이후의 정보국장 임명은 호스트가 직접 결정하는 방식으로 이루어질 것입니다. 또한 사상 검증이 시행되어, 정부에 불충한 인물들은 전원 퇴직하거나 정의실현부의 수사를 피할 수 없게 될 것입니다.\n\n끔찍했던 유리조노 세이아 암살 사건과 같은 비극을 사전에 방지하기 위해, 그동안 부족하다는 지적을 받아온 정보 수집 능력이 보완되며, 정보 수집 및 감시 범위 역시 대폭 확대될 예정입니다. 이에 따라 많은 학생이 사생활 침해를 겪을 수 있겠지만, 대의를 위해서라면 트리니티의 학생들도 이를 감수할 것입니다.\n\n트리니티 종합학원 헌법 제5차 개정안이 이를 명시하고 있는 만큼, 학원 정보원의 재편은 신속히 진행될 것으로 보입니다."
 trinity_events.35.a: "이는 반드시 감수해야 할 일이다."
 trinity_events.36.t: "안보 상황"
 trinity_events.36.desc: "트리니티 종합학원의 안보는 여전히 위태롭습니다. 동쪽에는 거대한 [SOV.GetAdjective] 측이 도사리고 있고, 서쪽에는 [GEM.GetAdjective]와 [GEH.GetAdjective]가, 북쪽에는 [RED.GetAdjective] 측이 위협을 가하고 있습니다. 남쪽으로는 수많은 군소 학원들이 산재해 있으나, 이들 역시 '남키보토스'라는 이름 아래 단일 정부를 세울 가능성을 배제할 수 없습니다.\n\n이 거대한 위협은 미소노 미카, 파테르 분파가 반드시 마주하고 해결해야 할 숙명이 되었습니다. 게다가 학생들은 날이 갈수록 게헨나와의 전쟁을 촉구하며 학원 간 긴장을 악화시키고 있습니다. 미소노 미카가 정권을 잡으며 내세운 약속이 바로 이 숙원을 해결하는 것이었지만, 준비되지 않은 전쟁은 트리니티를 파멸로 이끌고, 제1차 공의회가 남긴 유산마저 허물어뜨릴 것입니다.\n\n파테르 분파, 미소노 미카는 이 위태로운 안보 상황을 두고 밤낮없이 토론을 이어가고 있지만, 결론은 쉽게 나오지 않습니다."
 trinity_events.36.a: "이는 지정학적 재앙이다."
 trinity_events.37.t: "소규모 동아리의 운명"
 trinity_events.37.desc: "트리니티에는 수많은 소규모 동아리들이 존재하며, 이들 모두가 일정 수준의 부비 예산을 지원받아 활동하고 있습니다. 이는 과거 트리니티가 여러 분파로 나뉘어 운영되던 시절부터 이어져온, 일종의 구시대적 유산입니다. 하지만 이러한 구조는 필연적으로 예산 유출이라는 출혈을 동반하며, 냉정히 말해 많은 동아리들이 '필요 이상의' 자금을 지원받고 있는 것이 현실입니다.\n\n방과후 디저트부, 손문학부, 다도부, 심지어 영화감상부나 만화창작부처럼, 취미 수준의 활동에 머무는 동아리들 역시 큰 비용을 요구합니다. 이들은 운영 효율성과는 거리가 멀며, 예산 집행의 부담만을 가중시키고 있습니다.\n\n가장 단순하고 효과적인 대처 방법은 동아리 자체를 해산시키는 것이지만, 언급된 동아리들 대부분은 충성도 높은 부원들을 보유하고 있어, 이 경우 상당한 반발이 예상됩니다. 그러나 반드시 극단적인 조치만이 해답은 아닙니다.\n\n호스트의 재량을 통해 점진적으로 예산을 삭감한다면, 통제 가능한 범위 내에서 반발을 최소화할 수 있을 것입니다. 물론 예산을 전면적으로 끊는 것은 오히려 정치적으로도, 행정적으로도 바람직하지 않을 수 있습니다."
 trinity_events.37.a: "예산을 점진적으로 삭감해나가자."
 trinity_events.37.b: "파테르 분파가 모든 예산안을 감시하도록 해라."
 trinity_events.38.t: "국유화 논쟁"
 trinity_events.38.desc_ui: "대전이 사태 이후 수많은 사업체들이 파산하거나 심각한 피해를 입으면서, 우리는 이 빈틈을 파고들어 이들을 국유화하며 학원 경제의 근간을 다져왔습니다. 그럼에도 여전히 다수의 중공업과 일부 경공업 사업체가 살아남아 있으며, 이들은 주로 학원 내부의 백만장자들이 소유하고 있습니다. 특히 오데르 강 너머, 우리의 통제가 완전히 미치지 않는 지역에는 여전히 개인 소유의 '국가 이익 사업체'들이 버티고 있습니다.\n\n파테르 분파 내 일부 경제학자들은 이들에 대한 과격한 개입을 경계하고 있습니다. 이른바 경제 중도파라 불리는 이들은, 일부 중공업이 민간 소유로 남아 있더라도 학원 계획에 심대한 위협이 되지 않으며, 오히려 사업가들이 정치적 동맹을 맺어줄 것이라고 주장합니다.\n\n그러나 학원경제개발부 부장인 코제키 우이는 단호합니다. 그녀는 이렇게 말합니다.\n\"......모두가 머리의 뜻을 따르지 않으면, 학원 경제를 제대로 계획할 수 있을 리가 없잖아요.\"\n\n그녀와 개발부의 전문가들은 보상이 있든 없든, 전면적이고 철저한 국유화를 강력히 요구하고 있습니다."
 trinity_events.38.desc_Sch: "대전이 사태 이후 수많은 사업체들이 파산하거나 심각한 피해를 입으면서, 우리는 이 빈틈을 파고들어 이들을 국유화하며 학원 경제의 근간을 다져왔습니다. 그럼에도 여전히 다수의 중공업과 일부 경공업 사업체가 살아남아 있으며, 이들은 주로 학원 내부의 백만장자들이 소유하고 있습니다. 특히 오데르 강 너머, 우리의 통제가 완전히 미치지 않는 지역에는 여전히 개인 소유의 '국가 이익 사업체'들이 버티고 있습니다.\n\n학원경제개발부의 부장인 엔도우 시미코는 \"일부 중공업이 민간 소유로 남아 있어도 계획에 차질은 없어요!\"라고 말하며 과도한 개입을 견제하고 일부 사업체들과의 '동맹'을 주장하고 있습니다. 경영자들과 대화하기 위해 경영자 단체와 상공회의소를 창설할 것을 강력하게 주장하고 있습니다."
 trinity_events.38.a: "국유화하되 소유주들이 경영하게 해라."
 trinity_events.38.b: "일단은 내버려둬라. 나중에 공정하게 구매하겠다."
 trinity_events.38.c: "그녀의 말이 옳다. 그냥 뺏어와라. 허락받을 필요가 어디있나." # 우이 선택지
 trinity_events.38.d: "이들에게 '특혜'를 부여해 긴밀한 협력을 주도해보자." # 샤흐트 선택지
 trinity_events.39.t: "한스 프리체"
 trinity_events.39.desc: "오늘 호스트 앞으로 한 통의 편지가 도착했습니다. 발신자는 '한스 프리체'라는 인물로, 서한에는 고풍스러운 필기체로 본인의 능력과 경력을 강조하는 내용이 담겨 있었습니다. 특히 그는 자신의 목소리에 '울림이 있다'고 표현하며, 대중 설득력에 대한 강한 자신감을 드러냈습니다.\n\n트리니티 정보국이 조사한 결과, 그는 대전이 사태 이전 독일의 국가사회주의 독일 노동자당 소속으로 관료직을 수행했으며, 요제프 괴벨스의 연설 성우로 활동한 이력을 확인했습니다. 사태 이후의 행적은 불분명하지만, 현재 트리니티에 대한 반감을 드러내지 않고 있어, 충돌 없이 생존하거나 피신에 성공한 것으로 추정됩니다.\n\n요제프 괴벨스는 한때 독일국의 선전기구를 이끌며 지도자의 이미지 형성에 크게 기여한 인물입니다. 우리에게 그와 같은 인물은 존재하지 않지만, 그의 목소리를 흉내낼 수 있는 한스 프리체는 대중 설득과 선전 활동에서 일정 부분 유용하게 활용될 가능성이 있습니다."
 trinity_events.39.a: "등용하는 것도 나쁘지 않아 보인다."
 trinity_events.39.b: "...엘베강의 식인 피라냐는 기회주의자의 살점을 좋아한다더군."
 trinity_events.40.t: "트리니티 재산업화"
 trinity_events.40.desc: "대전이 사태 이후 트리니티는 급격히 줄어든 부지로 인해 산업 시설과 농장 지대 그리고 여러 소도시들을 잃었고, 수많은 이들이 돌아갈 곳을 잃은 난민으로 전락했습니다. 트리니티는 수백 년 동안 경험하지 못한 최악의 위기에 직면한 것입니다.\n\n호스트는 긴급히 경제 전문가들을 소집해 회의를 열었고, 그 결론은 명확했습니다. 제한된 부지를 최대한 활용하기 위해 대규모 재개발 사업이 필요하다는 것이었습니다. 줄어든 산업 기반을 보완하기 위해 과거의 기술을 재활용하는 방안도 함께 채택했습니다.\n\n이제 학원의 경제 및 토목 전문가들이 한자리에 모여 '재산업화'에 적합한 산업 계획과 경제 개혁 방안을 마련하고 있습니다. 특히 경제개발부는 방황하는 난민들을 재산업화 계획에 동원할 것을 강력히 주장하고 있습니다. 그들은 학원에 봉사하고 국가 발전에 기여하며 정당한 보수를 받고 삶을 재건하게 될 것입니다."
 trinity_events.40.a: "우리는 그들의 노력의 결실을 기대한다."
 trinity_events.41.t: "게헨나 학생들의 저항 운동"
 trinity_events.41.desc: "트리니티와의 전쟁에서 패배한 지 며칠도 지나지 않아, 게헨나의 학생들 사이에서는 자발적인 연합 움직임이 포착되고 있습니다. 특히 온천개발부, 미식연구부, 귀가부, 만마전 친위대, 그리고 선도부 등 저항 활동은 단순한 불복종을 넘어 전 학원적인 문제로 번지고 있으며, 트리니티 종합학원 부지 내에서도 각종 소요와 치안 불안을 초래하고 있습니다.\n\n이러한 사태는 단순한 불만 표출을 넘어서 조직적인 저항의 양상을 띠고 있어, 더 이상의 방치는 학원의 질서를 위협할 수 있습니다. 상황의 심각성을 감안할 때, 호스트의 신속한 재가와 결단이 절실히 요구됩니다."
 trinity_events.41.a: "골치 아프군"
 trinity_events.43.t: "게헨나 동아리 문제"
 trinity_events.43.desc: "\"와핫핫핫!!\"\n\"후우! 개운하구만!\"\n\n게헨나의 골칫거리이자 키보토스 전역에서 지명수배 중인 온천개발부의 키누가와 카스미는 현재 트리니티와 게헨나를 넘나들며 '온천 개발'이라는 명목 아래 무차별적인 테러를 벌이고 있습니다. 특히 이번 온천 개발은 트리니티에 대한 저항의 상징으로 보이며, 단순한 개발이 아닌 정치적 메시지를 담고 있는 것으로 판단됩니다.\n\n이들을 체포하기 위해서는 보다 강력한 지원이 필요합니다. 선도부의 소라사키 히나조차 그녀를 무력화하지 못했을 정도이니, 단순한 전술로는 부족할 것입니다. 현재 정의실현부와 학원정보국이 연합하여 키누가와 카스미를 비롯한 과거 게헨나 동아리 부장들을 추적 중이나, 그중에서도 가장 큰 위협은 역시 키누가와 카스미입니다."
 trinity_events.43.a: "이는 가장 큰 위협이다.."
 trinity_events.44.t: "아리우스 분교의 운명"
 trinity_events.44.desc: "미소노 미카는 본래 티파티의 수면 아래에서 아리우스 분교와 접촉하며, 분교에 재학 중이던 '시라스 아즈사'를 트리니티 본교에 입학시켰습니다. 그러나 대전이 사태 이후 이어진 정치적 혼란과 독일국과의 전쟁은 그녀로 하여금 계획을 조기 실행하도록 만들었고, 비록 준비는 미흡했지만 결과적으로 아리우스의 도움 없이 정권 찬탈에 성공하게 됩니다.\n\n하지만 정권을 손에 넣은 지금, 과거 그녀의 계획에 따라 움직였던 아리우스 분교는 존재의 의미를 잃고 표류하게 되었습니다. 정권을 쟁취하기 위한 '말'이었던 그들은, 이제 정권이 안정된 뒤엔 걸림돌이 될 가능성도 있습니다. \n\n미소노 미카는 이제 그들의 운명을 결정해야 합니다. 대전이 사태 이후 아리우스 분교의 정확한 위치는 파악되지 않았지만, 단치히 인근, 특히 그디니아 지역을 근처의 트리니티 학생들의 피해 사례가 잇따른 것을 감안하면, 그들이 그 근방에 은거하고 있을 가능성이 높습니다. 그들이 실제로 아리우스 학생이 아닐지라도, 우리의 적이 그 근처에 숨어 있다는 사실은 분명합니다.\n\n미소노 미카는 지금, 그들을 철저히 박멸해 정권의 걸림돌을 제거할 수도 있고, 혹은 아직 남은 이용 가치나 정치적 고려로 인해 계획을 보류할 수도 있습니다."
 trinity_events.44.a: "\"아리우스 학원과 화해.. 응. 그것도 괜찮지 않아?\""
 trinity_events.44.b: "\"이제 아리우스 같은 건 아무래도 상관없지 않아?\""
 TRN_trinity_44_b_tt: "§Y$TRN_Shirasu_Azusa$§!는 §Y[ARI.GetNameWithFlag]§!로 돌아갈 것입니다."
 trinity_events.45.t: "[64.GetName]에서의 대규모 시위"
 trinity_events.45.desc: "오후, [64.GetName] 외곽 지역에서 약 수만 명에 달하는 독일 현지인들이 대규모 시위를 벌였습니다. 이들은 '[TRM.GetNameDef] 타도'를 외치며 행진했고, 구호로는 \"도이칠란트, 도이칠란트 위버 알레스(독일, 독일 그 무엇보다도)\"를 외치며 독일 국가를 부르기도 했습니다. 일부 시위대는 거리의 시설물을 파손하며 소요 사태로 번지기도 했습니다.\n\n이번 시위를 주도한 단체의 정체는 아직 명확히 밝혀지지 않았으나, 트리니티 내부 소셜미디어망에서는 반트리니티적 게시글을 올리고 시위를 선동한 것으로 지목되는 계정 하나가 주목받고 있습니다. 학원정보국는 해당 계정의 배후와 연계 여부를 조사 중입니다.\n\n사실 그간 이런 갈등은 소규모 충돌의 형태로 여러 차례 발생해왔지만, 이번처럼 수만 명 규모의 조직적인 시위는 전례 없는 일입니다. 시위 현장을 담은 영상과 사진들은 트리니티 내부 SNS를 중심으로 빠르게 확산되었고, 그 과정에서 일부 시위대는 무고한 키보토스 학생들과 시민들을 대상으로 폭력과 기물 파괴, 심지어 증오범죄에 가까운 행위를 저지르고 있습니다.\n\n도심 일대 교통은 이미 통제되었으며, 일부 비참여 독일 현지인들 역시 이들의 폭력적 행동을 묵인하거나 방관하는 모습을 보이고 있습니다. 이러한 침묵과 무관심은 키보토스 학생들 사이에 깊은 불안과 분노를 불러일으키고 있습니다.\n\n특히 [TRM.GetLeader] 측의 지나치게 온건하고 소극적인 대응은 학생들의 불만을 더욱 증폭시키고 있습니다. 교내에서는 언제까지 참고만 있을 것인가라는 불만이 터져 나오고 있으며, 이 불만은 점차 사회적 긴장과 불안정으로 이어지고 있습니다.\n\n독일 현지인들에 대한 보복성 폭력과 증오범죄 사례 역시 곳곳에서 포착되고 있으며, 그 강도는 시간이 지날수록 점점 심화되고 있습니다. 대전이 사태 이후 가라앉지 않은 사회적 불신과 적대감이, 이제는 언제 폭발할지 모르는 또 다른 위기의 불씨로 번지고 있습니다."
 trinity_events.45.a: "\"으음. 어떻게 대처해야 하지, 이런 상황....\""
 trinity_events.45.b: "\"뭔가 자꾸 사건이 터지는 것 같은데  단순히 제 착각이겠죠..?\""
 trinity_events.45.c: "\"곤란하군요.\""
 trinity_events.46.t: "트리니티 학원정보국의 보고"
 trinity_events.46.desc: "\n\n\n                                    £GFX_report_event_TRN_IA\n\n\n\n\n\n\n티파티의 호스트 [TRM.GetLeader]님께\n\n트리니티 내부의 방첩 업무를 맡아 정보를 수집한 결과, 학원정보국은 최근 연이어 발생한 실종 사건들과 관련하여 중대한 단서를 확보하였으며, 이에 호스트님께 보고드릴 준비가 완료되었음을 알려드립니다.\n\n최근 키미기야마에서 발생한 대규모 실종 사건들은 과거 공의회에서 축출된 아리우스 분교와 깊은 연관이 있는 것으로 추정됩니다. 확인된 바에 따르면, 그들은 현재 독일계 주민들과 협력하여 트리니티 내부에 심각한 혼란을 야기하고 있으며, 이는 아리우스 측의 영향력을 점차 확대하려는 시도의 일환으로 해석됩니다. 본 보고서에는 해당 정황을 뒷받침하는 구체적 증거도 함께 첨부하였습니다.\n\n아울러, 실종자 유족들의 진술서를 바탕으로 분석한 결과, 아리우스 분교의 대략적인 위치는 키미기야마로부터 약 150km 이내인 것으로 파악되고 있습니다.\n\n존경을 담아,"
 trinity_events.46.a: "\"조마에 사오리를 이대로 둬선 안 돼.\""
 trinity_events.46.b: "\"이게 정말 사실이라면 골치 아프군요...\""
 TRN_after_this_operation_against_arius_tt: "곧 §Y[ARI.GetNameWithFlag]§!의 계획을 분쇄하기 위한 §Y'철검 작전'§!이 개시됩니다."
 trinity_events.47.t: "새로운 거래"
 trinity_events.47.desc: "\n\n\n                                                   £GFX_report_event_TRN_Mika\n\n\n\n\n\n\n미소노 미카는 오래전부터 시스터후드와 구호기사단이 티파티에 간섭할 수 있는 권리를 못마땅하게 여겨왔다. 특히 시스터후드에 대한 불만은 더욱 깊었다.\n\n그들은 '비밀 유지'라는 명목 아래 모든 행동의 근거를 기밀로 감췄다. 대전이 사태 이후, 그 폐쇄성은 더욱 강화되었다. 모든 것을 기밀의 장막 뒤에 숨긴 채, 무엇을 꾸미고 있는지 알 길이 없었다.\n\n하지만 그들의 움직임을 막는 방법이 반드시 폭력일 필요는 없었다.\n\n시스터후드에게는 약점이 있었다. 유스티나 성도회의 기억. 그 어두운 과거가 그들의 발목을 잡고 있었다. 시스터후드가 먼저 움직이는 순간, 유스티나 성도회의 악몽이 되살아나 트리니티 학생들의 공포를 자극할 것이다. 민심을 잃는 것은 한순간이다.\n\n미카는 그 점을 정확히 꿰뚫고 있었다.\n\n그렇기에 그녀는 거래를 선택했다. '혼란 수습'이라는 그럴듯한 명분 아래, 양측은 회담 테이블에 마주 앉게 될 것이다. 협력이라는 이름의, 또 다른 게임이 시작되려 하고 있었다."
 trinity_events.47.a: "\"...생각 할 게 좀 많겠다.\""
 trinity_events.48.t: "응수"
 trinity_events.48.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n우타즈미 사쿠라코는 선택의 기로에 서 있었다.\n\n미소노 미카로부터 초청장이 도착했다. '트리니티 종합학원의 안보 상황과 정치적 갈등 봉합을 위한 회담'이라는 그럴듯한 명분이었다. 회담은 비밀리에 진행될 예정이었지만, 사쿠라코는 왠지 모를 꺼림칙함을 떨칠 수 없었다.\n\n미소노 미카.\n\n그 이름만으로도 사쿠라코의 가슴속에는 불편한 감정이 일렁였다. 자신의 친구가 암살당했을 때, 그녀는 일말의 슬픔도 보이지 않았다. 오히려 그 혼란을 발판 삼아 소꿉친구를 가두면서까지 권력을 손에 넣었다. 찬탈로 얻은 그 권력의 총구는 이제 사쿠라코를 향하고 있었다.\n\n그녀가 이 회담에서 무엇을 요구할지 알 수 없었다. 협력? 굴복? 아니면 더 교묘한 무언가?\n\n회담까지 시간이 얼마 남지 않았다."
 trinity_events.48.a: "\"이것도 하나의 시련이군요.\""
 trinity_events.49.t: "비밀 회담"
 trinity_events.49.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n\"...미카 씨, 그 사태 이후로 처음 보는 것 같군요.\"\n\"응. 많이 바빴거든. 여러 가지 일로.\"\n\n\"...그러시겠죠.\"\n\n어색한 침묵이 흘렀다. 분위기는 마치 살얼음판을 걷는 것 같았다. 양측은 서로에게 형식적인 안부를 건넸지만, 대화는 좀처럼 진전되지 않았다.\n\n\"그래서, 저를 왜 여기에 부르신 건가요? 시스터후드와 티파티는 규율상 서로 간섭하지 않는 것으로 알고 있는데요.\"\n\n\"왜 불렀냐고? 그, 그야! ...아니지, 왜 부른 건지 너도 잘 알고 있잖아?\"\n\n\"저로서는 현재 이 자리가 불편하기만 합니다. 용건만 빠르게 말씀해주실 수는 없습니까?\"\n\n\"흐음... 그렇구나... 그럼, 단도직입적으로 물어볼게~!\" \n그녀가 몸을 앞으로 기울이며 말했다.\n\"나랑 협력할 생각 없어? 어때? 나쁘지 않잖아?\"\n\n\"...무슨 말인지 좀 더 구체적으로 설명해주시겠어요?\"\n\n\"아, 그러니까 말 그대로!\" \n미카가 손을 휘저으며 말했다.\n\"시스터후드와 티파티가 협력하는 거야. 응, 멋지지 않아?\""
 trinity_events.49.a: "(우, 우와 소문대로 무서운 얼굴...)"
 trinity_events.50.t: "비밀 회담"
 trinity_events.50.desc: "\n\n\n                                      £GFX_report_event_TRN_Mika £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n"
 trinity_events.50.a: ""
 trinity_events.51.t: "탈나치화 운동"
 trinity_events.51.desc: "나치는 국민의 지지를 등에 업고 빠르게 성장했지만, 독일인들에게 명확한 목적의 선전물을 유포하며 선동한 결과, 많은 이들이 왜곡된 이념을 진심으로 숭배하게 되었고, 독일인들은 결국 트리니티의 적이 되었습니다. 이들이 신봉한 사상이 미소노 미카의 사상에 일정 부분 영향을 미친 것은 사실이나, 더 이상 이러한 트리니티의 적들이 활개 치는 모습을 좌시할 수는 없습니다.\n\n그런데도, 거리 곳곳에는 나치 문양이 내걸려 있고, 도로명 역시 히틀러나 나치즘 관련 인물의 이름을 따르고 있으며, 남성우월주의를 바탕으로 한 독일인 남성들의 트리니티 여학생 대상 범죄까지 발생하는 등, 독일 사회 전반에 걸쳐 나치즘이 족쇄처럼 작용하고 있습니다.\n\n이에 따라 탈나치화를 전담할 부서가 새롭게 창설되었으며, 나치즘을 기반으로 한 모든 활동은 전면 금지되었습니다. 특히, 최대 규모의 나치 조직 중 하나였던 구 히틀러 유겐트 단원은 즉시 체포되어, 탈나치화 재교육을 받게 될 것입니다."
 trinity_events.51.a: "나치즘 없는 세상을 위하여"
 trinity_events.52.t: "사민당과 접촉"
 trinity_events.52.desc: "사회민주당, 통칭 사민당은 나치의 가장 큰 적대 세력이었습니다. 나치가 정권을 잡은 뒤 사민당을 탄압하면서 지도부는 망명길에 오를 수밖에 없었습니다. 그러나 나치가 몰락하자 사민당은 다시 구 독일 지역으로 복귀하였고, 그들은 잃어버린 기반을 되찾기 위해 움직이고 있습니다.\n\n사민당의 주요 지지 기반은 작센과 트리니티 중앙구, 즉 구 베를린 지역입니다. 이 두 지역은 역사적으로 노동운동과 진보 정치가 강하게 뿌리내린 곳으로, 사민당에게는 여전히 가장 든든한 토대라 할 수 있습니다. 탈나치화가 진행되는 가운데 트리니티는 사민당과 물밑 접촉을 이어가며 협력 관계를 공고히 하려 하고 있습니다.\n\n트리니티는 확실한 동맹을 맺기 위해 작센에 일종의 '자치구'를 마련할 계획을 세우고 있습니다. 이 자치구에서는 사민당이 자유롭게 활동할 수 있는 권한을 보장받게 되며, 정치적 탄압의 위험도 최소화됩니다. 그 대가로 사민당은 트리니티에 무조건적인 협력을 제공해야 합니다. 이는 사민당에게 기회이자 동시에 부담이 될 수 있는 제안이었습니다.\n\n사민당이 이 제안을 받아들일지는 아직 알 수 없습니다. 그러나 내부에서는 적어도 시도해보는 것이 낫다는 의견이 힘을 얻고 있습니다."
 trinity_events.52.a: "우리가 먼저 나서자!"
 TRN_trinity_contact_SPD_tooltip: "트리니티는 사민당과의 협력을 위해 당수 오토 벨스에게 먼저 접촉할 예정입니다. 그러나 그가 우리의 제안을 받아들일지는 미지수입니다."
 trinity_events.53.t: "사민당과 협상"
 trinity_events.53.desc: "사민당은 나치의 탄압을 피해 여러 곳으로 흩어져야 했습니다. 오토 벨스, 슈마이허, 율리우스 레버 역시 그 탄압을 피하지 못했습니다. 그러나 나치 정부가 무너진 뒤, 각지에 흩어져 있던 사민당원들은 독일, 이제는 트리니티로 돌아오기 시작했습니다. 여러 민병대 문제는 상대적으로 사소한 것이었습니다. 하지만 사민당에게는 훨씬 더 큰 제안이 날아들었습니다. 트리니티의 국가 원수, 곧 호스트 미소노 미카가 직접 회담을 제안한 것이었습니다. 사민당원들에게 이계의 존재와 회담을 가진다는 일은 꽤나 낯설게 다가왔습니다.\n\n회담장에는 이미 미소노 미카가 도착해 오토 벨스를 기다리고 있었습니다. 고풍스러운 트리니티 전용 차량을 타고 나타난 오토 벨스는 차에서 내리며 미카에게 독일어로 간단한 인사를 건넸습니다.\n\"존경하는 미소노 미카님, 좋은 아침입니다.\"\n그의 인사에 미카도 독일어로 답했습니다.\n\"오늘 에덴에서 귀하를 모시게 되어 기쁩니다.\"\n\n벨스는 그녀가 독일어 회화를 익히려 했다는 점에서 은근한 호감을 느꼈습니다. 회담장에서 사민당과 미카는 짧은 독일어로 서로 반가움을 전하며 분위기를 풀었습니다. 벨스는 고풍스러운 펜으로 방명록에 서명한 뒤 자리에 앉았습니다. 이어지는 간단한 담소는 회담장의 공기를 한층 부드럽게 만들었습니다.\n\n잠시 뒤 벨스가 입을 열었습니다.\n\"이제 어느 정도 친밀해졌다고 생각합니다. 독일 사회민주당은 합법적 활동의 보장과, ‘티파티’라 불리는 기구에서 최소한의 의견 반영을 원합니다. 이것만 지켜진다면 평화를 위한 한 걸음을 내딛을 수 있습니다.\"\n\n그러자 미카가 웃으며 답했습니다.\n\"아~ 그런 요구라면 간단히 들어줄 수 있지. 그리고, 적게 일하면 능률이 올라간다는 연구 결과도 있잖아? 작센 지역에서 자유로운 활동까지 보장해 줄게. 대신 우리에게 전적으로 협력하는 조건이야, 어때? 나쁘지 않지?\"\n\n뜻밖의 제안에 오토 벨스는 놀란 듯 미카를 바라봤습니다. 미카는 무슨 문제냐는 듯한 눈빛으로 그를 응시했습니다.\n\"이거 참, 회담이 예상보다 빨리 끝나겠군요. 호스트께서 먼저 이렇게 파격적인 제안을 하실 줄은 몰랐습니다.\" 벨스는 미소를 지으며 말을 이었습니다. \"서로의 이해가 이렇게 일치한다니, 감사할 따름입니다.\"\n\n미소노 미카가 사민당에 호의적인 태도를 보이자, 벨스 역시 그녀의 제안을 받아들였습니다. 비록 정치 활동은 작센 주 이외에서는 제한적이었지만, 무너진 당으로서는 이보다 나은 조건은 없었습니다. 사민당은 대중의 의지를 민주적으로 실현하려는 곳이라면 관심을 두고 있었고, 미카와의 합의는 충분히 매력적이었습니다.\n\n꽤 길었던 회담이 마무리되자, 사회민주당은 대거 작센으로 유입되었고 트리니티와 협력하며 지역의 안정화에 나섰습니다."
 trinity_events.53.a: "\"평화 제일인가... 뭐어, 그럴지도!\""
 trinity_events.54.t: "정당 본부 폐쇄"
 trinity_events.54.desc: "정의실현부와 정보국의 철저한 조사 끝에 독일 정당들의 본부 위치를 파악했습니다. 정의실현부 부원들은 동시다발적으로 각 본부에 진입해 사민당을 포함한 여러 독일 정당들을 강제로 폐쇄했습니다. 일부 극단적인 성향을 가진 정당 본부에서 소규모 충돌이 발생했지만, 정의실현부 부원들이 단호하게 대응해 신속히 진압했습니다.\n\n본부 폐쇄 소식이 신문을 통해 알려지자 정당 지지자들이 거리로 쏟아져 나왔습니다. 시위대는 정의실현부의 조치에 강하게 반발하며 곳곳에서 집회를 열었고, 일부 지역에서는 격렬한 구호와 함께 긴장감이 높아졌습니다. 정의실현부와 시위대가 대치하는 상황이 이어졌지만, 자경단이 중재에 나서며 상황을 완화하는 데 힘을 보탰습니다. 결국 정의실현부와 자경단의 협력으로 시위대를 설득하고 진정시키는 데 성공했고, 시위는 점차 동력을 잃으며 자연스럽게 해산되었습니다.\n\n해외로 망명한 정당 인사들은 즉각 성명을 발표하며 트리니티의 조치를 강력히 비난했습니다. 그러나 이들의 목소리는 국제 사회의 큰 관심을 끌지 못했고, 실질적인 영향력도 미미했습니다. 독일 내에서도 망명 정당들의 반응은 크게 주목받지 못한 채 흘러갔습니다."
 trinity_events.54.a: "질서가 승리했다."
 trinity_events.55.t: "독일 정당들이 너희에게 무얼 해주었나?"
 trinity_events.55.desc: "정당 폐쇄 이후, 트리니티는 라디오를 비롯한 각종 매체를 통해 대대적인 선전 활동에 나섰습니다. 정의실현부와 선전국은 트리니티 전역에 걸쳐 정기적으로 연설을 방송하며 독일 정당들의 실상을 폭로하기 시작했습니다.\n\n연설의 핵심 메시지는 명확했습니다. 독일 정당들은 대전쟁 시기부터 지금까지 독일 국민의 이익을 위해 움직인 적이 단 한 번도 없었다는 것입니다. 오히려 이들은 권력과 부를 차지하기 위해 독일을 외세에 팔아넘기고, 국민들에게는 끝없는 고통만을 안겨주었다고 강조했습니다.\n\n방송은 구체적인 사례들을 나열했습니다. 대전쟁 당시 정당 지도부가 안전한 후방으로 도피하는 동안 일반 국민들은 전선에서 피를 흘렸고, 전쟁이 끝난 후에도 정당들은 복구 자금을 착복하며 자신들의 배만 불렸다는 주장이었습니다. 또한 정당들이 독일인들에게 희망을 약속했지만, 실제로는 혼란과 분열만을 조장하며 트리니티의 통합 노력을 방해해왔다고 비난했습니다.\n\n연설은 감정적인 호소와 함께 마무리되었습니다. 트리니티는 독일인들을 억압하려는 것이 아니라 진정으로 해방시키려 한다는 메시지를 반복했습니다. 정당들의 부패한 지배에서 벗어나 새로운 질서 아래에서 함께 번영을 이루자는 제안이었습니다.\n\n이러한 방송은 연일 계속되었고, 점차 일부 독일인들 사이에서 정당에 대한 회의감이 싹트기 시작했습니다. 특히 전쟁의 참상을 직접 겪었던 이들 사이에서 트리니티의 주장이 설득력을 얻어가고 있었습니다."
 trinity_events.55.a: "내가 사망의 음침한 골짜기로 다닐지라도.."
 trinity_events.56.t: "나치 엘리트 숙청"
 trinity_events.56.desc: "오늘, 정보국과 정의실현부는 합동 작전으로 독일의 대학과 연구소를 급습하여 대규모 체포를 시작했습니다. 약 천 명이 넘는 인원을 체포했고, 수사를 위해 문서도 대거 압수했습니다. 나치 엘리트를 숙청하기 위한 이 작전은 하루아침에 이뤄졌으며, 미소노 미카가 수면 아래에서 준비해온 것이었습니다. 이미 낌새를 눈치채고 망명길에 오른 몇몇 학자들도 있지만, 그들이 갈 곳은 마땅치 않아 보입니다.\n\n대학들은 오랫동안 트리니티의 자비 아래 있었지만, 나치즘과 트리니티 체제에 반하는 사상으로 독일인들에게 저항 의식을 심어주고 있었습니다. 오래전부터 정보국은 이러한 행동을 눈치챘고, 미소노 미카의 재가 아래 물밑에서 진행하던 작업이 오늘 최후의 일격을 가했습니다. 이제 다양한 반국가 범죄에 대한 재판이 끝나면, 총살을 면한 자들은 노동을 통해 모교를 사랑하는 법을 배우게 될 것입니다.\n\n현재 공석이 된 교수직과 대학 행정직에는 티파티의 최고 인재들을 임명하고 있습니다. 여기에 정치경제학, 독일 민속 문화 등 새로운 교수직도 신설했습니다."
 trinity_events.56.a: "나치즘의 또다른 요새가 무너졌다."
 
 trinity_social_ploblem_events.1.t: "키보토스인 금지"
 trinity_social_ploblem_events.1.desc: "평화로운 오후 시간에도, 트리니티 중앙구의 거리에서는 차별의 그림자가 여전히 사라지지 않고 있습니다. 많은 상점들은 하나같이 ‘키보토스인 금지’라는 독일어 팻말을 내걸고 있으며, 그 아래에는 삐뚤빼뚤하게 적힌 키보토스 언어도 함께 보입니다.\n\n트리니티 학생들이 이러한 상황을 달가워하지 않는 것은 당연한 일입니다. 특히 일부 호전적인 학생들은 차별적인 상점에 대해 사적인 제재를 가하기도 합니다. 정의실현부의 신속한 개입으로 피해는 일정 부분 억제되고 있습니다."
 trinity_social_ploblem_events.1.a: "곤란해"
 trinity_social_ploblem_events.2.t: "노동자 파업"
 trinity_social_ploblem_events.2.desc: "트리니티의 공장들은 자동화가 점차 진행되고 있지만, 아직 트리니티화가 이루어지지 않은 지역에는 여전히 노동자들이 근무하고 있습니다. 특히 여러 부문에서 독일인 노동자들은 유용한 인력으로 활용되고 있습니다.\n\n그럼에도 불구하고 문제가 존재하는데, 그것은 바로 노동조합의 존재입니다. 구 독일 지역의 NSDAP 산하 어용 노조였던 독일노동전선은 로베르트 라이를 중심으로 조직적인 결속을 유지하고 있으며, 트리니티의 공장에서 파업과 폭력 시위를 벌이며 저항하고 있습니다. 특히 이들의 주요 목표는 트리니티 정부의 타도에 있으며, 이러한 노골적인 정치적 파업은 일부 도시에서 지역 법 집행기관이 질서 유지에 어려움을 겪고 있다고 보고할 정도로 확산되고 있습니다."
 trinity_social_ploblem_events.2.a: "정의실현부를 더 동원하라."
 trinity_social_ploblem_events.2.b: "노동자들과 협상하자."
 trinity_social_ploblem_events.2.c: "그러든가."
 trinity_social_ploblem_events.3.t: "관공서에 대한 폭탄 테러"
 trinity_social_ploblem_events.3.desc: "놀라운 전개 속에, 누군가가 제작한 사제 폭탄이 관공서에서 폭발하는 사건이 발생했습니다. 이 폭탄 테러로 인해 수십 명이 중상을 입었으며, 부상자들은 구호기사단의 차량을 통해 인근 병원으로 긴급 이송되었습니다. 폭발의 위력은 상당하여 대형 유리창이 10장 넘게 산산조각이 나는 등 주변 건물에 큰 피해를 입혔습니다.\n\n다행히도, 해당 지역은 당시 보수 공사가 진행 중이었고 일반 학생이나 주민들의 출입이 제한되어 있어 직접적인 희생자는 발생하지 않았습니다. 그러나 이 사건은 트리니티 내부의 불안정성과 치안의 허점을 여실히 드러내는 계기가 되었으며, 현재 학원정보국과 정의실현부는 사건의 배후 세력을 추적 중입니다."
 trinity_social_ploblem_events.3.a: "\"테러리스트를 용서하는 것은 신에게 달렸지만 그들을 신에게 보내는 것은 내게 달렸다.\""
 trinity_social_ploblem_events.4.t: "\"폴크스앰펭거\""
 trinity_social_ploblem_events.4.desc: "폴크스엠펭거(Volksempfanger)는 나치 독일이 제작한 저가형 진공관 라디오로, 대중이 쉽게 구매할 수 있도록 설계되었습니다. 이는 나치 정부가 라디오의 중요성을 인식하고, 선전 도구로 활용하기 위해 전국적인 보급에 힘쓴 결과였습니다. 그 결과, 독일 국민 두 명 중 한 명이 라디오를 소유할 정도로 폭넓게 보급되었습니다.\n\n최근, 라디오 방송이 다시 등장하고 있습니다. 그 배경에는 트리니티에 저항하는 민병대가 방송국을 장악하고, 이를 통해 반트리니티적 메시지를 독일 대중에게 송출하고 있기 때문입니다. 이 방송은 일부 트리니티 학생들에게까지 퍼지고 있어, 그 영향력이 점차 확산되고 있는 상황입니다."
 trinity_social_ploblem_events.4.a: "이러한 라디오 방송을 당장 멈춰야 한다."
 trinity_social_ploblem_events.5.t: "베어울프(늑대인간) 저항군 문제"
 trinity_social_ploblem_events.5.desc: "나치 독일의 유산 중 하나인 민병대 문제가 빠르게 수면 위로 떠오르고 있습니다. 특히 나치의 청소년 단체인 히틀러 유겐트가 주축이 되어 독일 청소년들에게 반트리니티 사상을 주입하고 있습니다. 이들을 이끄는 인물은 한스-아돌프 프리츠만으로, 사망한 하인리히 힘러가 특수방위감찰관으로 임명하여 작전을 수행하고 있습니다. 더욱이 그는 잔존하는 소규모 주 정부와도 접촉하고 있다는 첩보가 있습니다. 이에 따라 신속한 개입이 요구됩니다."
 trinity_social_ploblem_events.5.a: "정의실현부를 보내 토벌해야 한다."
 trinity_social_ploblem_events.5.b: "그럴 여유가 없다."
 trinity_social_ploblem_events.6.t: "파괴된 트리니티 상징물"
 trinity_social_ploblem_events.6.desc: "어제 이른 아침, 트리니티 중앙구 외곽의 한 작은 광장에서 트리니티의 상징물이 훼손되는 사건이 발생했습니다. 비록 규모는 작은 광장이었지만 유동 인구가 많은 지역이었기에, 이번 사건은 티파티의 권위가 훼손되었다는 인상을 주고 있습니다. 사건 현장의 사진은 삽시간에 SNS 등을 통해 퍼져나가고 있으며, 이는 최근 들어 더욱 거세진 저항 활동의 일환으로 보입니다."
 trinity_social_ploblem_events.6.a: "좋지 않아.."
 trinity_social_ploblem_events.7.t: "사민당의 중재"
 trinity_social_ploblem_events.7.desc: "오늘 오후, 사민당의 활약상이 전해졌습니다. 사민당원들은 협력 관계를 이어가면서 트리니티 종합학원이 독일인을 위해 시행한 여러 정책들을 적극적으로 선전하고 있습니다. 물론 일부 사람들은 사민당이 타락하여 타천사들과 손을 잡았다며 비난하고 있지만, 일반 대중은 이러한 사민당의 선전에 감화되어 트리니티에 대한 적개심을 줄이고 있습니다. 이 협력 관계가 어디까지 이어질지는 알 수 없지만, 사민당원들의 노력으로 독일인들의 '트리니티화'가 가속화되고 있습니다."
 trinity_social_ploblem_events.7.a: "좋은 소식이네!"
 trinity_social_ploblem_events.8.t: "저항하는 지휘자들"
 trinity_social_ploblem_events.8.desc: "트리니티 중앙구, 에덴. 그 외각에서 독일의 잔재가 남아있는 베를린이라는 곳에서 음악이 흘러나오고 있습니다. 빌헬름 푸르트벵글러가 지휘하는 오케스트라의 연주입니다. 그리고 수명의 지휘자들이 서로 다른 저항 의식을 가진 채 오케스트라를 지휘하고 있습니다. 예술가를 존중하는 차원에서 정의실현부와 티파티는 예술가들에 대해 느슨하게 처리하고 있지만, 이러한 연주곡들은 독일인들에게 정체성을 유지하게 하고 마음의 안식처가 되어가고 있습니다."
 trinity_social_ploblem_events.8.a: "울림을 준다라.."
 trinity_social_ploblem_events.9.t: "암살 미수 사건"
 trinity_social_ploblem_events.9.desc: "오늘 트리니티 고위층을 노린 암살 미수 사건이 발생했습니다. 다행히 피해자는 총알을 피했고 즉각 대응 사격으로 암살자를 제압했습니다. 조사 결과 암살자는 독일 저항 조직 소속으로 드러났으며, 시신은 유가족에게 인도되었습니다."
 trinity_social_ploblem_events.9.a: "여고생 한 명의 전투력은 특수부대원 2명과 맞먹는다."
 trinity_social_ploblem_events.10.t: "붉은 관현악단"
 trinity_social_ploblem_events.10.desc: "엄밀히 말하자면 붉은 관현악단은 트리니티 정보국이 만든 이름입니다. 단일 조직이라기보다는 여러 독립적인 반트리니티 스파이 그룹과 연락망을 총칭하는 단어입니다. 이들 상당수는 트리니티의 심장인 에덴에서 활동하고 있습니다. 특히 이전 독일국에서 활동하던 좌익 인사와 정부 관계자들이 포함되어 있습니다. 이들은 주로 암호화된 무선 통신으로 정보를 주고받습니다.\n\n이들은 주로 반트리니티 전단물을 제작하고 시민들의 저항 의식을 일깨우고 있습니다. 트리니티 정보국은 특정 출판사에서 이러한 전단물을 제작한다고 추측하고 있으며, 조만간 붉은 관현악단의 실체를 밝혀낼 것으로 추측하고 있습니다."
 trinity_social_ploblem_events.10.a: "추적하라!"
 trinity_social_ploblem_events.11.t: "노동자 사보타지 문제"
 trinity_social_ploblem_events.11.desc: "작센과 슐레지엔 지역은 트리니티 산업의 중요한 거점이며, 학원 산업을 육성하기 위해 티파티의 관할을 받고 있습니다. 그러나 산업 도시에서 노동자들의 사보타주가 심각한 문제가 되고 있습니다. 특히 노동자들은 공장 내 기계나 군수품, 민수품을 파괴하거나 비현실적인 협상안을 제출하고 불법 인쇄물을 유포하는 등 저항을 이어가고 있습니다.\n\n조사 결과, 이러한 사보타주를 주도하는 단일 조직은 존재하지 않습니다. 대신 동료들과 함께 저항하는 소규모 애국주의 조직들이 개별적으로 활동하고 있습니다."
 trinity_social_ploblem_events.11.a: "알아서 하라지."
 trinity_social_ploblem_events.11.b: "그래 저들의 임금을 인상하라. 그러면 조용해지겠지."
 trinity_social_ploblem_events.12.t: "히틀러 청소년단"
 trinity_social_ploblem_events.12.desc: "히틀러 청소년단은 나치당이 운영하던 관영 조직입니다. 특히 나치 정부의 지도자 아돌프 히틀러를 우상화하기 위한 기관이었습니다. 청소년을 대상으로 한 세뇌는 성인이 된 후에도 풀리지 않는 경우가 많습니다. 이 조직에 가입한 청소년만 해도 300만 명이 넘습니다. 트리니티 학생 수의 최소 3배에 달하는 수치입니다. 히틀러의 광적인 정부가 트리니티에 의해 무너지자 청소년단 또한 자연스럽게 해체될 것으로 예상했습니다. 그러나 1920년대부터 활동해온 탓에 아직도 많은 청소년들이 집으로 돌아가지 않고 나치 잔당의 지도하에 트리니티에 저항하는 소규모 조직으로 남아 있습니다."
 trinity_social_ploblem_events.12.a: "불쾌하고 슬픈 이야기다."
 trinity_kulturkampf_events.1.t: "저항하는 교회"
 trinity_kulturkampf_events.1.desc: "블라블라블라 아무튼 교회가 저항 해요"
 trinity_kulturkampf_events.1.a: "기눌리네"
 trinity_kulturkampf_events.2.t: "판결문"
 trinity_kulturkampf_events.2.desc: "피고 디트리히 본회퍼,\n\n그대는 학원의 법과 명령에 반하여 행동하였고, 국가의 권위를 공개적으로 거부하였으며, 전시에 가장 중대한 범죄 중 하나인 반역에 가담하였음이 분명히 드러났습니다. 이 법정은 모교의 안녕과 질서를 지켜야 하기에, 그대의 행위를 용납할 수 없습니다. 따라서 본 법정은 그대에게 사형을 선고합니다.\n\n이 법정은 정의의 이름으로 판결을 내렸음을 기록에 남기되, 인간으로서 나는 그대의 담대함에 경의를 표합니다."
 trinity_kulturkampf_events.2.a: "사형을 집행하라."
 trinity_kulturkampf_events.3.t: "사랑하는 아버지, 어머니께,"
 trinity_kulturkampf_events.3.desc: "저는 저의 길을 후회하지 않습니다. 이 길은 제게 고통을 주었지만, 동시에 제 믿음과 양심이 허락한 유일한 길이었습니다. 하나님께서 저를 이 자리까지 이끄셨음을 압니다. 그리고 지금 저를 기다리는 운명 또한 그분의 손 안에 있음을 압니다.\n\n저의 생이 여기서 끝난다 해도 그것은 허망한 끝이 아니라 새로운 시작이라 믿습니다. 세상 권력이 아무리 강해 보여도, 궁극의 권세는 오직 하나님께 있습니다. 저는 그분의 정의와 사랑이 반드시 승리할 것임을 확신하며 그 확신 속에서 죽음을 맞이합니다.\n\n부모님께서 제 죽음을 헛되이 여기지 않으시길 바랍니다. 제가 오늘까지 살아온 삶은 제가 받은 교육과 사랑, 그리고 우리 가정이 함께 나눈 신앙의 열매였습니다. 저는 그것을 자랑스럽게 간직한 채 떠납니다.\n\n이 짧은 글이 마지막이 되겠지만 제 마음은 여전히 여러분과 함께 있습니다. 저를 기억하실 때, 절망이 아니라 소망으로, 눈물이 아니라 감사로 기억해 주십시오. 저는 이제 하나님께 맡겨진 제 마지막 걸음을 떼려 합니다.\n\n부디 평안하십시오."
 trinity_kulturkampf_events.3_2.desc: "하나님의 은혜로 저는 아직 살아 있습니다. 그들의 손에서 벗어날 수 있었던 것은 제 힘이 아니라 분명 하나님께서 열어주신 길이라 믿습니다. 물론 아직 위험은 지나가지 않았습니다. 그들의 추격은 여전히 거세고 제가 언제 다시 잡힐지는 알 수 없습니다. 그러나 제 안에 있는 평안은 빼앗기지 않았습니다.\n\n지금 당장은 여러분을 뵐 수 없지만 언젠가 하나님께서 허락하실 날이 있을 것이라 확신합니다. 그때 우리는 다시 만나 함께 식탁에 앉아 감사의 기도를 드리게 될 것입니다. 그날을 위해 저는 계속 기도하며 또 견뎌내고 있습니다.\n\n부디 제 안부를 염려하시되, 두려움보다는 소망으로 기억해 주십시오. 하나님께서 우리를 결코 버리지 않으신다는 사실이야말로 저의 힘이자 위로입니다. 그리고 저는 그 약속이 우리 가정에도 끝까지 지켜질 것을 믿습니다.\n\n다시 만날 날까지 서로를 위해 기도합시다. 저는 여기서도 매일 여러분을 위해 기도하고 있습니다.\n\n사랑과 감사 속에"
 trinity_kulturkampf_events.3.a: "여러분의 아들, 디트리히"
 trinity_kulturkampf_events.4.t: "디트리히의 연설"
 trinity_kulturkampf_events.4.desc: "\"사랑하는 형제자매 여러분!\"\n\n\"우리는 오늘 이 자리에 무거운 마음으로 서 있습니다. 왜냐하면 이 땅의 교회들이 더 이상 그리스도의 교회로서의 사명을 잊어버렸기 때문입니다. 많은 이들이 주님을 따르기보다 한 인간, 한 지도자를 그리스도처럼 떠받들고 있습니다. 그러나 그녀는 그리스도가 아닙니다. 국가 권력은 결코 구원의 주가 될 수 없습니다.\"\n\n디트리히 본회퍼는 자신이 가진 자산을 이용해 독일의 교회들에게 저항을 호소했습니다. 교회들은 자신들의 소신을 밝히며 본회퍼의 사상에 감화되고 있습니다. 특정 지역에서는 무력 충돌도 벌어진 것으로 전해졌습니다."
 trinity_kulturkampf_events.4.a: "그의 연설을 막아라."
 trinity_kulturkampf_events.5.t: "[TRN_church_in_resistance_state.GetName] 교회의 저항"
 trinity_kulturkampf_events.5.desc: "[TRN_church_in_resistance_state.GetName] 교회가 움직였습니다. 성당의 문 앞에 붙은 선언문은 트리니티의 통치를 정면으로 부정했습니다. 신의 이름으로 저항을 호소하고, 독일인의 자긍심을 일깨우며, 점령에 굴복하지 말라고 외쳤습니다. 선언문은 순식간에 퍼져나갔습니다. 사람들은 그것을 필사했고, 골목골목 담벼락에 붙였으며, 술집과 광장에서 나지막이 낭독했습니다.\n\n이대로 둘 수는 없습니다. 교회를 중심으로 독일인들이 결집한다면 통치의 근간이 흔들릴 것입니다. 우리는 그들의 단합을 막아야 했습니다."
 trinity_kulturkampf_events.5.a: "귀찮은 일이 늘어났다."
 
 TRMDIP.50.t: "국경 요새화를 시작한 [TRM.GetAdjective]"
 TRMDIP.50.d: "오늘 아침, 폴란드 국경 수비대는 국경 지역에서 수상한 움직임을 포착하였습니다. 날개를 지닌 이계인들이 대규모 자재를 들고 움직이는 모습이 확인되었으며, 이들 중 일부는 독일-폴란드 철도 연결 지점을 차단하려는 시도를 벌였습니다. 다행히도 이계인 무리 중 상급자로 보이는 인물이 이를 저지하면서 철도는 무사히 보호되었습니다.\n\n현재 국경 일대에서 진행 중인 요새화 작업은, 명백히 우리가 침략을 준비하고 있다는 피해망상에 기초한 조치로 보입니다. 외교부는 해당 사안에 대해 우려를 표하며, 가능한 외교 경로를 통해 강력히 항의할 방침입니다."
 TRMDIP.50.a: "외교적으로 항의하자."
 TRMDIP.50.b: "딱히 문제 삼지 말자."

 TRMDIP.51.t: "[POL.GetAdjective]의 외교적 항의"
 TRMDIP.51.d: "폴란드 외무부로부터 외교 서한이 도착하였습니다. 본 서한의 내용은 간결하며, 최근 폴란드-트리니티 국경 일대에서 진행 중인 방어 시설 확충과 관련하여 자국의 우려와 항의를 표명한 것이 핵심이었습니다. 이러한 반응은, 폴란드 측이 트리니티의 방어적 조치를 침공 준비로 오해했기 때문에 비롯된 것으로 판단됩니다. 그러나 본 서한에는 어떠한 형태의 최후통첩이나 위협적인 표현은 존재하지 않았습니다."
 TRMDIP.51.a: "이러한 위협은 우리에게 별 문제가 되지 않는다."
 
 TRMDIP.52.t: "유전지대를 요구한 [TRM.GetAdjective]!"
 TRMDIP.52.d: "오늘 오후, [TRM.GetName]은 우리에게 하나의 최후통첩을 보내왔습니다. 그 내용은 72시간 이내에 루마니아 내 유전 지대에 대한 채굴권을 [TRM.GetAdjective] 측에 양도하라는 것이었습니다. 더불어 [TRM.GetAdjective]의 세력권에 편입될 것과 여러 경제적 조건을 수용할 것도 요구하였습니다. 만약 이 기한을 넘기거나 요구를 거부할 경우, 전면전을 피할 수 없을 것이라는 경고도 담겨 있었습니다.\n\n우리는 그 유전 지대를 통해 상당한 경제적 이익을 얻고 있었으며, 이를 상실할 경우 심각한 경제적 타격은 불가피할 것입니다. 물론 [TRM.GetAdjective]는 최근 급부상한 신흥 강대국으로, 명백한 확장주의적 행보를 보이고 있습니다. 그러나 유전 지대를 넘기는 대가로 평화를 얻을 수 있다면, 그 거래는 마냥 나쁜 선택만은 아닐지도 모릅니다..."
 TRMDIP.52.a: "불쾌하지만 이들의 요구를 수용해야 한다.."
 TRMDIP.52.b: "우리는 소루마니아의 낙원보다 대루마니아의 늪지에서 죽겠다!"
 
 TRMDIP.53.t: "우리의 요구를 수용한 [ROM.GetNameDef]"
 TRMDIP.53.d: "좋은 소식입니다! [ROM.GetAdjective] 측이 우리의 요구를 수용하였으며, 루마니아 내 자원 채굴권을 우리에게 양도하였습니다. 또한, 우리의 기타 요구사항들에 대해서도 점진적으로 수용하겠다는 입장을 표명하였고, 즉시 [TRM.getFactionName]에 가입하였습니다. 이는 트리니티의 명백한 외교적 승리입니다."
 TRMDIP.53.a: "환영한다!"
 
 TRMDIP.54.t: "우리의 요구를 거부한 [ROM.GetNameDef]"
 TRMDIP.54.d: "모두의 예상대로, [ROM.GetAdjective]는 우리의 요구를 거부하고 동원령을 선포하였습니다. 이제 그들의 운명이 어떻게 될지 시험해볼 시간입니다."
 TRMDIP.54.a: "전면전이다!"
 
 TRMDIP.60.t: "트리니티와의 일시적 동맹?"
 TRMDIP.60.d: "[TRM.GetLeader]의 호스트인 미소노 미카는는 룩셈부르크의 흥신소 68이 반게헨나적 성격을 지니고 있으며, 게헨나 정부를 전복하고 그 위에 새로운 질서를 수립하려는 목표를 갖고 있다는 점을 인식하고 있습니다. 이들은 자신들의 목표 달성을 위해 트리니티와의 협력을 제안하며, '게헨나를 파괴할 때까지'라는 조건 아래 일시적인 군사 동맹을 제시하였습니다.\n\n분명히 적의 전선을 두 개로 분할할 수 있다는 것은 매력적인 제안입니다. 이 동맹이 일시적일 것이라는 것 역시 흥신소에게 만족스러운 이야기입니다. 하지만 결국 최종 결정을 내리는 것은 [HEU.GetLeader]의 권리입니다."
 TRMDIP.60.a: "좋아, 공동전선을 펼치자고"
 TRMDIP.60.b: "오래전부터 그녀가 마음에 들지 않았지."

 TRMDIP.61.t: "공동전선을 수락한 룩셈부르크."
 TRMDIP.61.d: "[FROM.GetAdjective] 측은 우리의 일시적 동맹 제안에 동의했습니다. 우리나 룩셈부르크가 게헨나를 공격했을 때, 우리는 일시적인 군사 동맹을 맺게 될 것입니다. 이것은 일시적인 동맹이지만 분명히 큰 도움이 될 것입니다."
 TRMDIP.61.a: "좋은 소식이군"

 TRMDIP.62.t: "공동전선을 거부한 룩셈부르크."
 TRMDIP.62.d: "당연한 제안이였겠지만 룩셈부르크는 우리의 제안을 거부하였습니다. 그녀들의 도움 없이도 게헨나를 이기는 건 가능하지만 비교적 어려울 것입니다."
 TRMDIP.62.a: "...왜?"

 TRMDIP.63.t: "[ROOT.GetName] 자유의 라디오"
 TRMDIP.63.d: "협력자들은 강력한 트리니티 라디오 방송국을 이용해 [TRM.GetNameDef] 측을 향해 선전과 거짓말을 퍼뜨리고 있습니다. 이러한 라디오 방송 청취는 명백히 금지되어 있으며 누구든 반역 혐의를 받게 됩니다. 하지만 실제로는, 특히 시골 지역에서는 금지령을 집행하기가 어렵습니다. 라디오 리버티에서 특히 영향력 있는 인물은 프란츠 랑고트입니다."
 TRMDIP.63.b: "트리니티 부역자는 누구도 용서받지 못할 것이다"

 TRMDIP.64.t: "[TRM.GetAdjective] 측과 경제 협력?"
 TRMDIP.64.d: "오늘, [ROOT.Capital.GetCapitalVictoryPointName]에 한 통의 외교 문서가 도착했습니다. 그것은 바로 [TRM.GetAdjective] 측이 제안한, 양 학원 간 경제 협력에 관한 간단한 협정이었습니다.\n\n양측의 우호 관계는 사태 이후에도 꾸준히 유지되어 왔으며, 이번 제안 역시 그 연장선에 있는 것으로 보입니다. 그러나 최근 트리니티에서 발생한 정권 교체와 연이은 정치적 사건들은 해당 학원을 급격히 급진화시키고 있어, 단순한 경제 협력으로 보기엔 조심스러운 부분이 존재합니다.\n\n단기적으로는 우리에게 이익이 될 수 있는 제안이지만, 장기적으로는 경제적 종속으로 이어질 수 있다는 우려가 음양부 내에서 제기되고 있습니다."
 TRMDIP.64.a: "오호라~ 괜찮은 제안 같은데요~?"
 TRMDIP.64.c: "그렇지만 뭐랄까~ 저희도 내부 사정이란 게 있어서~"
 TRM_eng_event_chain_tt: "더 이상 §Y[TRM.GetNameWithFlag]§! 측과 §Y사건 연계§!가 발생하지 않습니다."

 TRMDIP.65.t: "우리와 협력을 거부한 [HYA.GetNameDef]"
 TRMDIP.65.d: "최근 [HYA.GetNameDef] 측에서 하나의 외교 서한이 도착했습니다. 서한의 내용은, 트리니티의 급진화와 연이은 정치적 위기 및 외교 갈등을 이유로, 양 학원 간의 협력 관계를 재검토하겠다는 것이었습니다. 다만, 이는 정치적 협력에 한정된 것으로, 학생들 간의 교류는 이전과 동일하게 유지된다는 점은 명확히 전달되었습니다. 이와 같은 외교적 후퇴는 트리니티의 외교 역량이 과거에 비해 현저히 약화되었음을 여실히 보여주었습니다..."
 TRMDIP.65.a: "정말, 뭐냐구!?"
 TRN_no_longer_TRN_support_HYA_decision: "[HYA.GetNameDef] 측이 협력을 거부함."

 TRMDIP.66.t: "[HYA.GetNameDef]의 경제 협력 수락"
 TRMDIP.66.d: "좋은 소식입니다. [HYA.GetNameDef]의 [HYA.GetLeader] 측은 양 학원간의 경제 협력을 찬성하였습니다. 특히 양 학원과 신뢰와 우정을 바탕으로 맺어진 이 조약은 가능한 서로에게 이득이 되도록 작성 되었습니다. 특히 이 조약이 체결 된 이후 첫 물자가 백귀야행을 향해 운행하기 시작하였으며 이는 좋은 소식일 것입니다."
 TRMDIP.66.a: "얏호~ £GFX_BA_star"

 TRMDIP.67.t: "[TRM.GetNameDef] 측의 연합훈련 제안"
 TRMDIP.67.d: "트리니티의 호스트 [TRM.GetLeader] 측은 연합훈련을 제의하였습니다. 이 훈련은 최근 나날이 높아지는 위협을 대비하기 위해 백화요란과 정의실현부의 대처 능력을 더욱 향상 시키기 위함으로 기존의 훈련 보다는 더욱 더 큰 규모로 치뤄질 예정이며 최신 무기들을 시험 해보는 것입니다."
 TRMDIP.67.a: "아~ 괜찮은 제안이네요~"
 TRMDIP_67_NAME: "트리니티 - 백귀야행 연합훈련"

 TRMDIP.68.t: "[HYA.GetNameDef] 측의 수락"
 TRMDIP.68.d: "[HYA.GetNameDef] 측과의 협력 강화를 위해, [74.GetName]에서 연합 훈련을 개최하자는 제안이 이루어졌고, [HYA.GetNameDef] 측은 이를 기꺼이 수락하였습니다. 우리의 지휘관들은 이번 훈련을 통해 [74.GetName]의 지형과 특성에 대해 학습하고, 새로운 전술을 익힘으로써 전술적 역량을 한층 더 발전시킬 수 있을 것입니다."
 TRMDIP.68.a: "좋은 훈련이였어!"

 TRMDIP.69.t: "[TRM.GetNameDef] 측의 동맹 제안"
 TRMDIP.69.d: "[TRM.GetAdjective] 측과의 급속한 관계 발전을 바탕으로, 그들은 군사 동맹인 에덴 협정 가입을 제안해 왔습니다. 이를 수락한다면, [HYA.GetAdjective] 측은 동등한 회원국으로 대우받게 되며, 전례 없는 군사적 동맹이 탄생하는 역사적인 순간이 될 것입니다."

 TRMDIP.70.t: "동맹을 수락한 [HYA.GetNameDef]"
 TRMDIP.70.d: ""

 TRMDIP.71.t: "폄하된 [GEM.GetLeader]의 권위"
 TRMDIP.71.d: "늦은 오후, 독일인 몇 명이 [GEM.GetLeader]의 선전물을 훼손하고, 그 옆에 모욕적인 낙서와 트리니티를 찬양하는 낙서를 남기는 장면이 담긴 영상이 SNS를 통해 빠르게 확산하고 있습니다. 해당 영상은 시민들 사이에서 큰 반향을 일으키고 있습니다. 현재 용의자들을 신속히 체포 중이며, 조만간 모두 검거될 것으로 보입니다. 그러나 이미 온라인에 퍼진 영상들을 완전히 차단하는 것은 사실상 불가능에 가까워 보입니다.\n\n특히 이들 용의자가 트리니티를 찬양하는 발언을 했다는 점에서 일각에서는 트리니티가 이번 사건의 배후가 아니냐는 의혹이 제기되기도 했습니다. 하지만 아직은 그들이 단순히 트리니티를 동경하고 모방해 온 개인적 행동일 수도 있습니다."
 TRMDIP.71.a: "누가 이런 짓을!?"

 TRMDIP.72.t: "트리니티의 무역 제재!"
 TRMDIP.72.d: "1935년의 부르겐란트 진군은 재앙으로 막을 내렸습니다. 산해경의 공세는 단호했고, 우리 군은 끝내 패퇴했습니다. 이로써 대헝가리의 꿈은 좌절되었고, 루마니아와 유고슬라비아로부터 경제 제재를 받게 되었습니다. 그나마 위안이라면, [TRM.GetAdjective] 측과의 무역 개시로 독일이 남긴 공백을 어느 정도 메울 수 있었다는 점이었습니다. 그러나 최근 트리니티의 외교 기조가 변하며, 조국 헝가리에 경제 제재가 부과되었습니다. 경제 전문가들은 헝가리의 트리니티 무역 의존도가 상당히 높았기에, 이번 조치가 국가 경제에 심대한 타격을 가져올 것이라고 경고하고 있습니다."
 TRMDIP.72.a: "비극이로다"

 trinity_flavor_events.5.t: "트리니티의 새로운 사업계획"
 trinity_flavor_events.5.desc: "트리니티의 신규 사업설명회가 오늘 에덴에서 개최되었다. 이곳은 트리니티의 유명 사업가들이 한자리에 모인 귀중한 장소였다. 참석자들이 사교적으로 어울리는 와중에 사회자가 마이크를 가볍게 두드리며 입을 열었다.\n\"먼저, 오늘 당사의 사업설명회에 참석해 주신 사장님들께 감사드립니다. 이런 귀중한 기회를 얻으신 여러분은 선택받은 것이나 다름없습니다. 긴 설명은 생략하고, 곧바로 본론으로 들어가겠습니다. 제가 오늘 자신 있게 소개할 사업 아이템은 바로 '에코 프라이드 캐시미어 배터리'입니다! 이는 단순한 배터리가 아닙니다! 이 배터리로 말하자면..\"\n\n\n그러나 몇 분 후, 불법 사업설명회 신고를 받고 출동한 정의실현부에 의해 행사는 조기 종료되었으며, 관련자들은 체포되었다."
 trinity_flavor_events.5.a: "에코..뭐..?"
 trinity_flavor_events.6.t: "슈테틴 페리 사건"
 trinity_flavor_events.6.desc: "늦은 밤, 평화로워야 할 슈테틴에서 중대한 사건이 발생했습니다. 평소처럼 연회가 열리고, 합법적인 도박이 성행하며 수억이 오가는 슈테틴의 페리호는 사람들로 붐비고 있었습니다. 누군가는 잃고, 누군가는 얻으며 평화로운 혼잡 속에 있던 그 순간, 갑작스러운 총성이 페리호를 뒤흔들었습니다.\n\n그 총성과 함께 약 6명의 복면을 쓴 무장 강도들이 모습을 드러냈습니다. 그들은 총기로 승객들을 위협하며 차분하지만 단호한 목소리로 외쳤습니다.\n\"여러분, 강도질 좀 하겠습니다. 다들 얌전히 계시면 아무도 다치지 않을 것입니다.\"\n\n놀란 승객들은 공포에 휩싸인 채 몸을 움츠렸고, 강도들은 계획대로 금품과 귀중품을 수거하기 시작했습니다. 한편, 페리호 경비원들이 상황을 파악하고 무장 강도들과 대치에 나섰습니다. 그러나 강도들은 이미 치밀하게 준비된 탈출 경로를 가지고 있었고, 약탈한 물품을 챙기며 혼란 속에서 빠져나가려 했습니다.\n\n이때 정의실현부가 현장에 급습했습니다. 강도들과 짧은 교전이 벌어졌고, 이 과정에서 무장 강도 중 두 명이 총상을 입었으나 나머지 강도들과 함께 도주하는 데 성공했습니다. 정의실현부는 끝내 이들을 체포하는 데 실패하며 사건은 미제로 남게 되었습니다."
 trinity_flavor_events.6.a: "20세기에 무법자라니?"
 trinity_flavor_events.7.t: "어여쁜 마을에서의 산보"
 trinity_flavor_events.7.desc: "쾨니히스베르크, 현 트리니티에는 서로를 향해 깊은 악감정을 품고 있는 두 가문이 존재했습니다. 이 두 가문은 오랜 경쟁과 갈등 속에서 대립을 이어왔지만, 혜성처럼 등장한 무법자 집단이 이들 사이의 긴장감을 교묘히 이용하기 시작했습니다. 무법자들은 경찰관을 사칭하며 두 가문을 속이고, 그들의 대립을 자신들의 금전적 이익을 위한 도구로 삼으려 했습니다.\n\n그러나 두 가문 모두 이 무법자 집단의 존재를 꺼려했고, 결국 한쪽이 먼저 이들을 제거하기로 결심했습니다. 철저히 계획을 세운 가문은 무법자들을 함정으로 유인하기 위해 트리니티 시 중앙에 인력을 배치했습니다. 무법자들은 이들의 계획을 알지 못한 채 중앙으로 모습을 드러냈고, 긴장감이 감도는 순간, 가문의 경찰 중 한 명이 방아쇠를 당기며 전투가 시작되었습니다.\n\n격렬한 교전은 빠르게 진행되었습니다. 무법자들은 강력한 화력으로 저항하며 가문 측 경찰들을 모두 사살하는 데 성공했지만, 경찰들도 완전히 무력하게 당하지는 않았습니다. 경찰들은 전투 중 무법자 한 명을 사살하는 데 성공했고, 무법자 집단이 트리니티 시를 떠나도록 압박하며 작전을 마무리 지었습니다.\n\n정의실현부가 도착하였을 때는 이미 무법자들은 도시를 떠난지 오래였습니다."
 trinity_flavor_events.7.a: "그들의 사격 솜씨 하난 인정 해야겠군."
 trinity_flavor_events.8.t: "예나 지금이나 가문 싸움"
 trinity_flavor_events.8.desc: "브러진 시체들은 이미 오래전에 총격으로 생명을 잃은 상태였습니다. 그곳에 남겨진 것은 폐허와 충격적인 잔혹함뿐이었습니다.\n\n이 끔찍한 사건의 발단은 오직 무법자들만이 알고 있을 것입니다. 그들은 자신들이 트리니티 시에서 겪었던 사건에 대한 복수였는지, 혹은 전혀 다른 이유에서였는지는 알 수 없지만, 그 어떤 범죄보다 잔혹하게 이들을 살해하고 불태웠습니다. 문자 그대로 가문을 파괴하며 무자비한 복수극을 펼쳤습니다.\n\n가문 일원들 중 생존자는 현재까지 단 한 명도 확인되지 않았습니다. 만약 이 비극이 사실이라면, 무법자 집단은 복수심에 사로잡혀 하나의 가문을 멸족시킬 정도로 극단적인 행보를 보였다는 것을 의미합니다.\n\n상황은 사건 발생 후 한참이 지나서야 정의실현부가 출동하면서 정리되었습니다. 희생자들의 시신은 모두 수습되었습니다."
 trinity_flavor_events.8.a: "그렇게 교양 없이 나오시겠다."
 trinity_flavor_events.9.t: "가장 우리다운 우리"
 trinity_flavor_events.9.desc: "수많은 사람들을 충격에 빠뜨린 소식이 있습니다. 바로 트리니티 제2의 도시, 바시스 스콜라에서 발생한 대담한 강도 사건입니다. 트리니티 사회에 끊임없이 문제를 일으키던 악명 높은 무법자 갱단이 이번에는 군인들의 봉급을 실은 열차를 습격했습니다.\n\n열차는 바시스 스콜라를 지나던 중 갱단의 기습을 받았습니다. 이 소식을 듣고 바시스 스콜라 경찰과 정의실현부가 즉각 출동했으나, 결국 열차를 추격하는 데 실패했습니다. 열차에 타고 있던 보안관들은 갱단의 압도적인 화력에 전부 사망한 것으로 추정되며, 이들을 추격하던 과정에서 발생한 사상자들까지 포함하면 사상자 수는 두 배 이상으로 증가할 가능성이 높습니다.\n\n갱단은 열차가 정차한 틈을 타 재빠르게 올라타 열차를 가로챘습니다. 이후 기관총을 동원하여 추격하는 경찰과 정의실현부를 따돌리는 데 성공했습니다. 열차가 다시 정차했을 때, 갱단은 이미 도주한 상태였으며 열차에 실려 있던 군인들의 봉급은 온데간데없이 사라졌습니다.\n\n이 사건이 속보로 전해지자 시민들은 큰 충격에 빠졌습니다. 일부는 갱단의 대담함에 열광하기도 했지만, 대다수는 이 사건을 개탄하며 분노를 표출했습니다. 분명한 것은, 이들 무법자들의 대담한 범행이 아무리 주목을 받는다 해도, 그 끝은 결코 순탄하지 않을 것이라는 점입니다."
 trinity_flavor_events.9.a: "피,"
 trinity_flavor_events.10.t: "피, 죽음, 구원"
 trinity_flavor_events.10.desc: "정의실현부의 끈질긴 노력 끝에, 우리는 갱단의 은신처를 찾아내는 데 성공했습니다. 그러나 그곳에서 마주한 광경은 예상 밖이었습니다. 갱단 내부에 심각한 분열의 조짐이 보였고, 우리가 도착했을 때 그들은 이미 서로에게 총부리를 겨누며 대치하고 있었습니다.\n\n상황이 악화되자 정의실현부는 신속히 사살 작전을 개시했습니다. 갱단은 순식간에 와해되었고, 두 개의 세력으로 갈라져 혼란 속에서 도망치기 시작했습니다.\n\n추격전이 이어지는 가운데, 갱단의 주요 세력 중 하나였던 '집행자' 세력은 내부 분열로 종말을 맞이했습니다. 그들은 인근 돌산으로 도망쳐 마지막 저항을 시도했지만, 내부에서 배신이 발생했습니다. 한 갱단원이 집행자에게 반기를 들었고, 그들 간의 격렬한 몸싸움 끝에 배신자가 집행자를 무력화하고 결국 죽음으로 몰아넣었습니다. 남은 갱단원들은 더 이상 저항할 힘을 잃고 투항하여 정의실현부에 체포되었습니다.\n\n다른 한 세력은 여전히 도주 중이지만, 정의실현부의 포위망을 벗어날 가능성은 희박합니다. 이들 또한 머지않아 체포되거나, 저항 끝에 사살될 운명을 피하지 못할 것입니다."
 trinity_flavor_events.10.a: "죽음,"
 trinity_flavor_events.11.t: "인생의 굴레"
 trinity_flavor_events.11.desc: "정의실현부의 끈질긴 노력에도 불구하고, 일부 갱단원들은 포위망을 뚫고 도주하는 데 성공했습니다. 그러나 정의실현부의 자체적인 논의 결과, 이들의 잔여 세력이 더는 사회에 중대한 위협이 되지 않는다고 판단되었고, 그들은 공식적으로 수배 명단에 내리는 걸 끝으로 공식적인 추적을 중단 하였습니다.\n\n갱단의 최후를 돌아보면, 그들은 결국 자유를 갈망하던 이상주의자들의 집단에 불과했습니다. 자신들만의 이상을 쫓아 결성된 갱단은 현실과의 충돌 속에서 그 이상이 산산이 부서졌습니다. 현실과의 타협은 그들에게 분열과 타락을 가져왔고, 끝내 남은 것은 죽음과 무너진 꿈, 그리고 몇몇에게 주어진 구원의 기회뿐이었습니다.\n\n그들의 이름은 한때 수많은 사람들에게 알려졌고, 트리니티 전역에서도 회자되었습니다. 그러나 그러한 명성은 오래가지 못할 것이며, 역사의 한 페이지에도 불과한 기록으로 남을 뿐입니다.\n\n갱단원들의 이후 행적은 자세히 조사되거나 추적되지 않았습니다. 하지만 시간이 지나면서 그들 중 일부는 가족을 이루며 조용히 살아갈 것이고, 나머지는 결국 죽음을 통해 죗값을 치르게 될 것입니다."
 trinity_flavor_events.11.a: "구원."
 trinity_flavor_events.12.t: "유리조노 세이아 음모론"
 trinity_flavor_events.12.desc: "오늘 트리니티에서 큰 논란을 일으킨 음모론이 등장했습니다. 유리조노 세이아가 사실 사망하지 않았으며, 구호기사단과 공모해 사건을 은폐했다는 내용이 핵심입니다.\n\n1년 전, 미소노 미카가 트리니티의 정권을 잡는 데 결정적 계기가 된 사건 중 하나는 유리조노 세이아 암살 사건이었습니다. 당시 이 사건은 트리니티 사회에 엄청난 파장을 일으켰습니다. 이후 유리조노 세이아는 구호기사단에 의해 수습되었고, 구호기사단 측은 그녀가 치료를 받기 전 사망 하였다고 발표하며 공식적으로 죽음을 확인했습니다.\n\n그러나 이번 음모론에 따르면, 구호기사단장 아오모리 미네와 유리조노 세이아 사이에 어떤 거래가 있었으며, 이 거래의 일환으로 유리조노 세이아의 사망 소식이 거짓 발표되었다는 주장이 제기되었습니다. 거래의 실체와 발표의 배경은 아오모리 미네와 유리조노 세이아만이 알고 있을 것으로 보입니다.\n\n구호기사단 측은 이러한 음모론을 강력히 부정하며 내용을 전면 반박했지만, 논란은 쉽게 가라앉지 않을 조짐을 보이고 있습니다."
 trinity_flavor_events.12.a: "세이아 쨩..  지금이라도 괜찮으니까..."
 trinity_flavor_events.13.t: "'나치즘'"
 trinity_flavor_events.13.desc: "에덴의 지식인들 사이에서 나치즘과 국가사회주의독일노동자당(NSDAP)에 대한 연구가 활발히 진행되고 있습니다. 트리니티가 동부 독일을 지배하기 이전, 이들은 독일을 지배했던 이념과 정당으로, 1933년부터 1935년까지 독일의 정권을 장악한 바 있습니다.\n\n나치즘의 주요 이념은 무엇이었을까요? 이들은 권위주의적 전체주의 국가를 지향했으며, 1933년 통과된 '수권법'을 근거로 다른 정당들을 탄압하고 일당 독재 체제를 구축하였습니다. 또한, 반유대주의를 바탕으로 '유대인'을 비롯한 특정 집단을 차별하고 박해하였으며, 독일 민족주의를 내세워 독일 민족의 우월성을 강조하고 독일인의 생활권 확보라는 비정상적인 목표를 주장하였습니다.\n\n경제적으로는 대규모 공공사업을 통해 경제 회복을 추진하였으며, 독일 국방군의 재건에도 힘을 기울였습니다. 많은 연구자들은 \"대전이 사태가 존재하지 않았다면, 독일이라는 국가는 결국 전쟁을 벌였을 것\"이라 주장하고 있으며, 이는 학계에서도 폭넓은 동의를 받고 있는 견해입니다.\n\n이들의 집권 과정은 마치 야수가 먹잇감의 약점을 간파하여 공략하는 것과 같았습니다. 그 결과, 수권법을 통해 절대 권력을 거머쥐었으며, 경제 회복을 위한 공공사업을 통해 독일 국민들의 지지를 얻는 데 성공하였습니다. 어쩌면 우리는 이들에게서 무엇인가를 배울 수 있을지도 모릅니다."
 trinity_flavor_events.13.a: "영감이 하나 떠오르는 군"
 trinity_flavor_events.14.t: "총학생회장의 행방?"
 trinity_flavor_events.14.desc: "총학생회의 공식 발표를 통해, 총학생회장이 현재 실종 상태에 놓여 있다는 사실이 확인되었습니다. 그간 수면 아래에서 제기되어 왔던 각종 추측과 음모론이 현실이 된 순간이었으며, 총학생회가 이를 공식 인정한 것은 극히 이례적인 일입니다.\n\n실종 사실이 발표되자, 총학생회는 즉시 다수의 전문 요원들로 구성된 수사팀을 조직해 그녀의 행방을 추적하고 있으며, 키보토스 전역의 정보망을 총동원해 실종 당시의 정황을 분석 중입니다. 그러나 그녀의 행적은 철저히 베일에 가려져 있고, 외부 개입부터 내부 배신에 이르기까지 다양한 가능성이 조심스럽게 거론되고 있습니다.\n\n총학생회장은 키보토스의 질서와 균형을 상징하는 핵심 인물이자, 각 학원 간 갈등을 조율할 수 있는 유일한 정당성을 가진 존재입니다. 그녀의 부재는 단지 한 인물의 실종이 아닌, 키보토스 전체의 정치적 공백을 의미하며, 학원 간 힘의 균형마저 뒤흔들 수 있는 중대한 위기로 작용하고 있습니다.\n\n이미 일부 학원에서는 이 혼란을 기회 삼아 세력 확장이나 독자 노선을 모색하려는 움직임이 감지되고 있으며, 이러한 조짐은 자칫 키보토스 전역의 분열과 충돌로 번질 가능성도 내포하고 있습니다.\n\n트리니티를 비롯한 주요 학원들은 상황을 예의주시하고 있으며, 총학생회의 권위와 존속 자체가 흔들릴 수도 있는 중대한 기로에 놓여 있습니다. 지도자를 잃은 키보토스는 지금, 혼돈의 소용돌이 속에서 새로운 선택을 강요받고 있습니다."
 trinity_flavor_events.14.a: "충격적인 소식이다."
 trinity_flavor_events.15.t: "동행인"
 trinity_flavor_events.15.desc: "유리조노 세이아 암살 사건을 기점으로 시작된 미소노 미카와 파테르 분파의 정권 찬탈은 보수주의자들이 그들과 거리를 두게 만드는 계기가 되었습니다. 그러나 대중들은 오히려 파테르 분파와 미소노 미카에게 더욱 몰려들었으며, 미소노 미카는 자신의 지배를 헌법적으로 보장받기 위해 헌법 개정안을 통과시키는 등 정권의 정당성을 강화하는 데 힘썼습니다.\n\n트리니티의 중도 분파들은 암살 사건 이후 급격히 무너졌고, 이에 따라 보수적 성향이 강하거나 엘리트주의적 인사들이 승승장구하는 파테르 분파에 합류하기 시작했습니다. 이들은 파테르 분파 내에서 일종의 '온건파'를 형성하게 되었습니다.\n\n그러나 '온건파'라는 단어가 이들을 완벽하게 설명하는 것은 아닙니다. 그들은 대체로 정치적 폭력이나 절대적 독재 체제, 혹은 고참 파테르 분파 임원들의 극단적인 주장에 동조하지 않지만, 다른 선택지가 없을 때는 미소노 미카를 지지하는 쪽으로 기울어질 것입니다. 애초에 이러한 혼란 속에서 트리니티를 이끌 수 있는 인물은 그녀밖에 없습니다.\n\n다른 분파들, 특히 키리후지 나기사는 게헨나와의 평화 조약을 주장할 것입니다. 그러나 과연 지금, 이런 시국에서 평화 조약이 현실적인 해결책이 될 수 있을까요? 분명한 것은 기존의 티파티 삼두정 체제는 실패했다는 사실입니다. 지금 트리니티에 필요한 것은 혼란을 극복할 수 있는 강력한 지도력과, 국가를 위해 헌신할 애국자들입니다.\n\n현재 '온건파'의 주요 인사로는 타나카 미호, 사토 유카와 같은 전 상투스 분파 임원들, 그리고 나가요시 스바루, 야마모토 나나와 같은 전 필리우스 분파 임원들이 있습니다. 이들은 점차 파테르 분파의 현 체제에 순응해가며, 새로운 트리니티 질서에 적응하고 있습니다."
 trinity_flavor_events.15.a: "더 많은 이가 그녀의 뒤를 따르겠지!"
 trinity_flavor_events.16.t: "부작용"
 trinity_flavor_events.16.desc: "트리니티는 재산업화 정책을 통해 줄어든 부지를 최대한 효율적으로 활용하고자 다방면의 노력을 기울였습니다. 그 결과, 일부 영역에서는 실질적인 효과가 나타났고, 새로운 공업지대와 주거단지들이 빠르게 조성되기 시작했습니다. 그러나 문제는 전혀 없지 않았습니다. 확장된 개발 범위 안에서 트리니티가 일부 부지를 강제로 매입하면서, 원래 그 땅에 살던 주민들과의 분쟁이 발생한 것입니다.\n\n전문가들은 이러한 충돌 가능성을 사전에 예측했지만, 준비된 보상안은 실질적인 피해와 상실감을 해소하기에는 지나치게 부족했습니다. 일부 주민들은 당초 제시된 조건에 강하게 반발하며, 더 많은 보상과 권리를 요구하는 대규모 시위에 나섰습니다. 이들은 개발계획의 중단 또는 전면 재조정을 요구하며, 저항의 수위를 점점 높여가고 있습니다."
 trinity_flavor_events.16.a: "\"미, 미안! 최대한 빨리 도와줄게!\""
 trinity_flavor_events.16.b: "\"그렇지만.. 응. 재정의 안정성이 먼저라서..\""
 trinity_flavor_events.16.c: "\"원래 이들 땅이였으니 보상하는게 맞지 않아?\""
 trinity_flavor_events.16.d: "\"아하핫! 그래서 뭐? \""
 trinity_flavor_events.17.t: "침울한 하늘 아래에서"
 trinity_flavor_events.17.desc: "오늘따라 날이 어둡고 무거웠다. 회색 구름이 낮게 깔려 있었고, 바람은 묵묵히 폐허 같은 거리를 스쳐 지나갔다. 모리즈키 스즈미는 아직도 자신이 이곳으로 발령받았다는 사실이 믿기지 않았다. 트리니티 호스트의 명령은 가차 없었고, 그는 순리에 따라 움직일 수밖에 없었다.\n\n그녀는 평소처럼 순찰을 돌고 있었다. 정의실현부와 테러리스트들 사이의 산발적인 교전이 끊이지 않는 고위험 지역. 거리는 텅 비어 있었고, 창문은 굳게 닫혀 있었다. 시민들은 집 밖으로 나올 생각조차 하지 않았다. 아니, 어쩌면 이곳에는 애초부터 사람이 존재하지 않았던 것일지도 모른다.\n\n삭막한 거리의 끝자락, 그의 임시 거처가 있었다. 낡고 바랜 문을 밀고 들어가자 오래된 공기가 피부에 달라붙었다. 그는 무겁게 한숨을 내쉬고, 손에 묻은 먼지를 씻어내듯 간단히 씻은 뒤 책상에 앉았다. 보고서를 작성해야 했다. 순찰 지역의 동향, 보이지 않는 적들의 흔적, 그리고 그 모든 것 사이에서 어딘가로 흘러가고 있는 자신의 그림자.\n\n보고서를 정의실현부로 이관하는 순간, 머릿속을 수많은 생각들이 지나갔다. 의무감. 처음 이 일을 시작했을 때, 그것은 확고한 것이었다. 신념이었고, 명예였고, 모든 것을 지탱하는 기둥이었다. 그러나 지금, 그는 자신의 신념이 천천히 무너지고 있음을 느꼈다.\n\n무엇을 위해, 어디를 향해 이 길을 걷고 있는가."
 trinity_flavor_events.17.a: "그녀는 알지 못했다."
 trinity_flavor_events.18.t: "갑작스러운 제안"
 trinity_flavor_events.18.desc: "사다리 위에서 마지막 고서를 밀어 넣은 순간, 코제키 우이는 안도의 숨을 내쉬었다. 문제는 그게 끝이 아니었다. 사다리는 삐걱거렸고, 다리는 이미 떨리고 있었다.\n\n\"우, 우와아아...\"\n\n조심스럽게 발을 내딛으려는 찰나-\n\n\"우이쨩!\"\n\n\"꺄아아아악!!\"\n\n깜짝 놀란 우이는 중심을 잃고 사다리에서 떨어졌다. 바닥에 철퍼덕, 고통보다 더 먼저 찾아온 건 창피함이었다. 날개를 퍼덕이며 내려온 미카가 얼굴을 들이밀었다.\n\n\"아핫☆ 진짜 그렇게 놀랄 줄은 몰랐지? 미안~!\"\n\n\"미, 미카 님... 제 손가락만은...\"\n\n무언가 잘못 들킬 뻔했지만, 다행히 미카는 딴 얘기를 꺼냈다.\n\n\"우이쨩, 너 고서 정리 같은 거 잘하잖아? 경제도 좀 알지?\"\n\n\"...전 고문자 해독은 좀 하지만, 경제는...\"\n\n\"그럼 됐어! 사실 나, 새로운 동아리 하나 만들었거든~ 이름하여 '학원경제개발부'! 귀엽지 않아?\"\n\n\"...제 의견은...?\"\n\n\"응? 당연히 우이쨩이 도서부를 그만두고, 경제개발부 부장이 되는 거지. 재미있을 것 같지 않아~?\"\n\n\"저, 그건 좀... 저는 그다지 그런 쪽에 소질이...\"\n\n그 순간, 미카의 표정이 살짝 바뀌었다. 웃고는 있었지만, 그 눈빛은 조금도 웃고 있지 않았다.\n미카는 천천히 뭔가를 꺼냈고, 차가운 금속의 감촉이 우이의 이마에 닿았다.\n\n\"우이쨩, 지금 나랑 장난치는 거야? 진심이야?\"\n\n심장이 쿵, 하고 내려앉았다. 우이는 숨도 쉬지 못한 채, 고개를 위 아래로 흔들었다.\n그러자 미카는 다시 천진한 얼굴로 돌아왔다.\n\n\"좋아~ 이제 우이쨩은 경제개발부 소속이야! 앞으로 잘 부탁해, 부장님!\""
 trinity_flavor_events.18.a: "\"어, 어째서 이렇게...\""
 trinity_flavor_events.19.t: "얄마르 샤흐트"
 trinity_flavor_events.19.desc: "얄마르 샤흐트는 대전이 사태가 자신의 인생을 송두리째 뒤흔들 것이라곤 상상하지 못했다. 어느 날, 그는 조국이 두 동강 나고, 그 상처 입은 땅 위로 독수리가 내려앉아 찢긴 사체를 쪼아먹는 광경을 목도했다. 그리고 그 피멍든 자리에, 국가인지, 아니면 그 흉내를 낸 무언가가 세워졌다.\n\n그가 몸담았던 라이히스방크가 불타는 모습을 지켜보며, 샤흐트는 무언가가 내부에서 산산이 부서지는 감각을 느꼈다. 그리하여 그는 고향으로 물러나 근신하며 조용한 삶을 보내기로 결심했다. 다행히도 그의 고향만은 전란에서 비껴가 있었고, 그는 그곳에서 조용히 여생을 마무리하리라 믿었다.\n\n하지만 운명은 그런 평온을 허락하지 않았다. 트리니티의 지도부에 대대적인 변화가 일었고, 예상치 못한 곳에서 다시 그의 이름이 불렸다. 학원경제개발부의 부장직. 처음에는 완강히 거절할 생각이었다. 이제는 시대에 뒤처졌다고, 자신이 맡기에는 벅차다고 느꼈기 때문이다. 하지만 정부 요원들은 집요했고, 설득은 집안의 문턱을 넘고도 한참을 이어졌다.\n\n결국 그는 제안을 받아들였고, 재건된 라이히스방크의 문을 다시 열었다. 무너진 것들 위에서, 또 한 번 경제를 일으켜 세울 준비가 되어 있었다."
 trinity_flavor_events.19.a: " 인생은 오르막과 내리막으로 가득하다"
 trinity_flavor_events.20.t: "트리니티 수영장 차 사건"
 trinity_flavor_events.20.desc: "\"애들아 날려라!\"\n\"에라이!\"\n\n -풍덩-!\n\n참으로 충격적인 사건이 벌어졌습니다. 트리니티의 동아리 중 하나인 '다도부'가 오늘, 무력시위에 가까운 사건을 일으킨 것입니다. 사태의 발단은 단순했습니다. 동아리 예산이 삭감되자 이에 반발해 다도부는 자신들의 차 세트를 전부 수영장에 투척하는 극단적인 행동을 감행했습니다.\n\n특히 문제의 수영장이 에덴에서 멀지 않은 곳에 위치해 있었기에 사건은 빠르게 퍼졌고, 학원 내부에서 큰 파장을 일으켰습니다. 이들의 돌발 행동은 결국 정의실현부의 개입으로 진압되었으나, 수영장은 사실상 복구 불가능한 상태에 이르렀습니다. 해당 시설의 처리는 학원 예산을 통해 진행될 예정입니다"
 trinity_flavor_events.20.a: "그렇다고 해도, 저 수영장의 홍차를 마실 생각은 하지 마.."
 trinity_flavor_events.21.t: "디저트 약탈자"
 trinity_flavor_events.21.desc: "\"미치겠다.. 진짜 다 문 닫았대.\"\n이바라기 요시미는 책상에 턱을 괴고 어두운 표정을 짓고 있었다. 시간은 어느덧 정오를 넘기고 있었다.\n\n\"그러게, 어제 너희들도 봤을거 아니야? 가게들이 전부 엉망진창이었잖아.\"\n카즈사는 당연하다는 듯이 휴대폰을 보며 말했다.\n\n\"후훗... 달콤한 세상은 그렇게 한순간에 무너지는 것이다, 라...\"\n창가에 서서 창밖을 바라보며 툭 한 마디 던진 건 유토리 나츠였다. 오늘따라 말투는 더욱 이상했고 눈빛은 허공을 헤매고 있었다.\n\n책상 위에는 지금까지 리뷰했던 디저트 가게들의 정문을 찍은 사진들이 널브러져 있었고 그 위에는 빨간 싸인펜으로 X자가 쳐져 있었다.\n\n\"여기 있는 가게들이 전부 문을 닫았다니, 말이 돼? 세상이 갑자기 달라졌어... 우리한테 대체 무슨 일이 벌어진 건지 아직도 모르겠다고!\"\n요시미는 화를 내며 말했다.\n\n\"...요시미, 요시미, 요시미. 아직도 깨닫지 못했나? 바로.. <전설의 디저트가 있는 곳> 말이야.\"\n\n\"그만 좀 해, 나츠. 진지하게 말해봐. 너 또 뭔 이상한 데 알아봤지?\"\n카즈사는 나츠가 못미더운 듯이 말했다.\n\n\"당연히 있지...\"\n나츠는 천천히 고개를 돌리며 슬쩍 웃음을 지었다.\n\"중앙구 동쪽에.. 새로운 디저트 가게가..!!\"\n\n그러자 다들 나츠를 바라보았다. 나츠는 손을 내밀며 이들에게 말했다."
 trinity_flavor_events.21.a: "\"아아.. 함께 떠나겠나? '디저트'의 길로.\""
 trnfla_21_tt: "§g요시미는 말없이 그 손을 바라보다가 툴툴거리며 자리에서 일어났다.\n\"...진짜, 네가 또 이상한 데 데려가면... 아이스크림값 받아낼 거야.\"\n\n카즈사는 결국 한숨을 쉬며 말했다.\n\"말도 안 되지만, 일단 가보자.\"§!"
 trinity_flavor_events.22.t: "인터넷 개통"
 trinity_flavor_events.22.desc: "\"하아... 오늘도 이렇구나.\"\n미나미노 하나는 트리니티 중앙구에서 꽤나 멀리 떨어진 시골에 사는, 트리니티 종합학원 2학년이다. 동아리에는 들지 않았다. 아니, 들 수 없었다. 통학 시간이 꽤 길기 때문이다. 심지어 게다가 드물게 운행되는 노선이라, 밤 8시가 넘어서야 겨우 집에 도착한다. 그래서 하나는 집에서 인터넷을 통해 사람들과 교류하며 지내왔다.\n\n그러나 세상이 뒤바뀌고, 하나는 그 인터넷 마저 단절 되었다. 인터넷이 없는 동안, 하나는 자신이 할 수 있는걸 다해보았다. 인터넷을 연결해보겠다고 검색 엔진에 이것저것 쳐보기도 했다. (물론, 인터넷이 안 되니 아무 반응도 없었지만.) 자신의 몇 안되는 친구들과 전화 통화를 하며 지내거나 시간을 내어 중앙구로 가 카페에 들려 인터넷만 하루종일 하다가 귀가하는 등 온갖 귀찮음이 따라붙는 삶을 살았다.\n\n그러던 어느 날이었다.\n\n\"연결됐다...\"\n하나는 숨을 멈췄다. 모니터 오른쪽 아래, 그 익숙한 와이파이 아이콘에 드디어 하얀 선이 꽉 찼다. 장난처럼 깜빡이던 회색의 'X'표시가 사라진 것이다\n\n\"......하, 진짜네.\"\n믿을 수 없다는 듯 키보드를 몇 번 두드렸다. 검색창에 아무 단어나 입력했다. \"인터넷 복구됨\" \"살았다\" \"트리니티\" \"고독\" 손에 걸리는 대로. 그리고 화면이 움직이기 시작했다. 링크가 열리고, 이미지가 뜨고, 광고가 튀어나왔다. 그야말로 문이 열린 것이었다. 자신만 홀로 남겨졌던 세계에, 드디어 다시 길이 열린 것이다.\n\n\"됐다... 이거야...\"\n하나는 쿡쿡 웃었다. 거실에 울린 웃음소리는 작았지만, 정말 오랜만에 터져 나온 진짜 목소리였다."
 trinity_flavor_events.22.a: "좋은 이야기군"
 trinity_flavor_events.23.t: "트리니티 토지 문제"
 trinity_flavor_events.23.desc: "대전이 사태 이후, 새로운 땅에 대한 조사가 완료되었습니다. 그러나 조사 결과 확보된 약 27만 제곱킬로미터의 부지는 과거 트리니티가 보유했던 거대한 영토에 비하면 턱없이 부족한 수준입니다. 특히 농업에 종사하던 이들은 농경지의 부족으로 인해 파산 위기에 직면하고 있으며, 트리니티의 과거 위상을 떠올리기에는 현 상황이 너무나 초라합니다.\n\n설상가상으로 이 땅조차 100% 활용할 수 있는 상황이 아닙니다. 독일의 보수 귀족 집단인 '융커'가 토지 반환을 거부하며 무력 시위를 벌이고 있기 때문입니다. 일부 지역에서는 용병까지 고용하여 토지를 방어하려는 움직임도 포착되고 있으며, 특히 에덴의 동쪽 오데르 강을 넘는 지역에서는 이러한 저항이 빈번하게 발생하고 있습니다.\n\n대농장이 파괴되고 경작지가 줄어들면서 농산물 가격이 급등하기 시작했으며, 그 중에서도 쌀값은 폭등하고 품귀 현상까지 빚어지고 있습니다. 대규모 농지를 운영하던 농업 종사자들은 생산 불능 상태에 빠져 파산 상태에 있으며, 이로 인한 경제적 충격은 트리니티 전체에 점차 확산되고 있습니다.\n\n이 위기는 단순한 농업 문제를 넘어 트리니티의 생존과 안정을 위협하는 중대한 사안으로 커지고 있으며, 하루빨리 해결책을 마련하지 않으면 상황은 걷잡을 수 없이 악화될 것입니다."
 trinity_flavor_events.23.a: "위대한 트리니티의 대농장은 이제 과거의 유물이다..."
 trinity_flavor_events.24.t: "우주에서 온"
 trinity_flavor_events.24.desc: "\"비서쨩? 그래서 오늘 할 일이 뭐라고 했지?\"\n\n\"오늘은 없습니다. 게다가 어제 늦게까지 업무를 처리하셨잖습니까.\"\n\n\"...그럼 오늘만큼은 여유를 즐겨야겠네~!\"\n\n가벼운 농담처럼 던진 말에 잠깐의 웃음이 오갔다. 분위기는 한결 부드러워졌고, 미카는 다시 찻잔을 들어 올렸다. 천천히 향을 음미하며 차를 한 모금 마셨다. 익숙한 티파티 장소, 익숙한 풍경. 하지만 미소노 미카는 어딘가 허전함을 느꼈다. 차의 향이 어째서인지 평소보다 밋밋하게 느껴졌다.\n\n\"아악!\"\n\n갑작스러운 비명의 울림에 미카는 깜짝 놀라 찻잔을 내려놓고 자리에서 벌떡 일어났다.\n\n\"비서쨩?!\"\n\n놀란 표정으로 달려가자, 비서는 이마를 짚은 채 숨을 거칠게 몰아쉬고 있었다.\n\n\"허억... 허억... 괜찮습니다... 그냥, 순간적으로 머리가 깨질 듯이...\"\n\n얼굴은 창백했고, 고통의 여운은 아직 가시지 않은 듯했다. 미카는 그녀를 구호기사단에 다녀오도록 권했고, 비서는 고개를 끄덕이며 자리를 떴다. 미카는 그녀를 조용히 배웅한 뒤 다시 티 테이블로 돌아왔다.\n\n자리에 앉아 남은 차를 한 잔 더 따랐다. 오늘은 업무도 없고, 잠시 후 다시 집중하면 되겠지. 그렇게 생각하며 찻잔을 들어 올리는 순간 미카 역시 강렬한 통증을 느꼈다.\n\n쾅.\n\n머릿속이 마치 두개골 안에서 터지는 듯했다. 시야가 일그러지고, 중심을 잡기 어려웠다. 비서가 겪었던 증상과 정확히 같았다. 미카는 직감했다 이건 단순한 편두통이 아니라고.\n\n고통이 잠시 가라앉고, 미카는 책 속에 묻혀 살던 시절, 과거 역사 수업 중 배운 어떤 이야기를 떠올렸다."
 trinity_flavor_events.24.a: "그것은 우주에서 온 색채다."
 trinity_flavor_events.25.t: "신세계로부터"
 trinity_flavor_events.25.desc: "아츠코가 트리니티 중앙구를 걷고 있다."
 trinity_flavor_events.25.a: "\"이 길에도 꽃이 많이 피어 있으면 좋겠네.\""
 trinity_flavor_events.27.t: "백화요란 - 정의실현부 연합훈련 - 1일차"
 trinity_flavor_events.27.desc: "\"우, 우와아앗! 자, 자자자, 잠깐만! 옷이 너무 예쁜데?! 오늘 연합 훈련이라 맞춰 입은 거야?\"\n\n\"네...? 이 옷들은 전부 정의실현부 제복입니다.\"\n\n\"그, 그렇다고 해도 정말 멋지다구! 뭐랄까... 책에서만 보던 교복을 실제로 보는 느낌이랄까...\"\n\n\"후후, 그렇게 말씀해 주시니 기쁘네요. 원하신다면 맞춤 제작도 가능합니다.\"\n\n\"저, 정말로...? 아, 아냐! 이렇게 막 받아도 되는 거야...?\"\n\n...\n\n\"으아아-! 정말 모르겠어! 갑자기 급성 청추니움 알레르기 쇼크가 온 것 같아! 머리가... 생각이 안 나...!\"\n\n\"죄송하지만...! 다음 훈련은 잠시 미뤄도 괜찮을까? 갑자기 어지러워서...\"\n\n\"네. 그럼 훈련은 잠시 중단하고... 저희는 그동안 백귀야행을 둘러보고 와도 괜찮을까요?\"\n\n\"...?\"\n\n\"잠깐 눈 돌린 사이에... 어디론가 가버리셨네요.\"\n\n그렇게 하스미와 정의실현부 부원들은 백귀야행을 둘러보며 1일차를 조용히 마무리했다."
 trinity_flavor_events.27.a: "\"역시 받아야 할까..? 그렇지만 초면인데 덥석 받아도 되는걸까? 으으. 정말로 모르겠어~.\""
 trinity_flavor_events.29.t: "본연으로"
 trinity_flavor_events.29.desc: "\"오리. 오리. 응답 요망. 나는 펭귄이다.\"\n\n\"하아... 왜 아무런 답이 없는 거지? 무전기는 분명 정상인데...\"\n\n그날 이후, 모든 것이 변했다. 트리니티는 물론 키보토스 전체가 하루 종일 사태에 대한 보도로 들끓었다.\n\n계획도 산산이 흩어졌다. 그날 이후... 오리, 그러니까 미소노 미카는 단 한 번도 무전에 응답하지 않았다.\n\n돌아가야 한다. 오로지 그 생각만이 시라스 아즈사의 머릿속을 지배하고 있었다.\n\n\"...통신 종료. 이상. 펭귄이.\""
 trinity_flavor_events.29.a: "Et Omnia Vanitas(모든 것이 허무로다.)"
 trinity_flavor_events.30.t: "시라스 아즈사의 복귀"
 trinity_flavor_events.30.desc: ""
 trinity_flavor_events.30.a: "돌아온 걸 환영한다."
 trinity_flavor_events.31.t: "트리니티적 사회를 향해"
 trinity_flavor_events.31.desc: "중앙구에서 대규모 시위가 발생하고, 촉발된 트리니티 - 독일계 사회 문제가 해결 된지 약 두 달이 지났습니다. 당시 많은 해외 전문가들은 트리니티가 내부의 모순으로 인해 결국 붕괴할 것이라 예측했고, 자극적인 제목과 선정적인 사진들로 위기를 과장한 기사들이 쏟아졌습니다. 그러나 그러한 관측과는 달리, 트리니티는 서서히 내부 안정을 되찾고 있으며, 대전이 사태가 만든 사회적  모순들도 조금씩 해소되어가고 있습니다.\n\n미소노 미카의 정치 강령은 표면적으로는 사회 개혁, 계급 협조, 단방제를 내세우며 일견 우파적인 면모를 보이지만, 그녀의 사상적 색채는 단순히 이념의 좌우로 구분되기 어려울 만큼 복합적이고 다면적입니다. 특히 대전이 사태 이후 급격히 변화한 트리니티 학생들은 점차 미카에게 더 급진적이고 과격한 정책을 요구하고 있습니다.\n\n이러한 상황 속에서, 미소노 미카는 트리니티 고유의 강점을 지키기 위해 키보토스 총학생회와의 협력을 축소하고 있습니다. 총학생회가 추진했던 '에덴 조약'과 같은 접근 방식은 본질적인 문제 해결이 아닌, 일시적인 봉합에 불과하다는 것이 그녀의 판단입니다. 미카는 트리니티의 정체성과 이상을 외부에 의존해 타협하는 것이 아니라, 스스로의 방식으로 회복하고자 합니다. 그녀가 지키고자 하는 것은 단지 체제나 권위가 아닙니다. 그것은 트리니티 학생들의 영혼, 사랑, 그리고 청춘 그 자체입니다."
 trinity_flavor_events.31.a: "모교에 영광이 있으라!"
 trinity_flavor_events.32.t: "포스트모템"
 trinity_flavor_events.32.desc: "\"와아~! 나기쨩! 좀 어때? 불편한 건 없어?\"\n\n\"...불편하긴 합니다. 그래도, 지하 감옥보단 낫군요.\"\n\n잠시 정적이 흘렀다. 두 사람 사이엔 묘한 긴장감이 감돌고 있었다. 각자의 자리에서 서로 다른 불편함을 느끼고 있었다.\n\n\"직접 찾아오신 거라면... 뭔가 더 남은 이야기가 있으신 건가요?\"\n\n\"...이젠 다시 못 볼 줄 알았거든.\"\n\n\"...\"\n\n나기사는 더 이상 말을 잇지 못했다. 미카는 그런 나기사의 눈빛을 잘 알고 있었다. 오랜 소꿉친구였으니까.\n\n나기사는 눈을 지그시 감고, 마치 한숨 섞인 듯한 말투로 중얼거렸다.\n\n\"당신이 이렇게까지 할 줄은 몰랐는데요... 미카 씨라면 분명 이런 때일수록..\"\n\n\"왜? 어째서? 이번 사건 때문인가요? 원인불명의 대규모 사태... 혹시 그걸 기회 삼아 게헨나를 짓밟으려고? 그래서 10년 넘게 알고 지낸 소꿉친구인 저까지...?\"\n\n\"...설마 세이아 씨 일까지, 미카 씨가 관련되어 있었던 건가요?\"\n\n\"그만해, 나기쨩.\"\n\n\"이건 복잡한 얘기가 아니야. 난 게헨나를 증오해서, 사람들을 이용하고, 감금하고... 필요하면 없애버리기도 했어. 그뿐이야.\"\n\n\"...뭔가, 착오나 오해가 있었던 건 아닐까요? 사실은 전혀 다른 진실이 있는 거라든가.\"\n\n\"아하하하. 다른 진실?\"\n\"그래서 내가 나기쨩을 좋아하는 거야. 순진해서. 정말로.\"\n\"나기쨩은 내가 어떤 사람인지, 전혀 몰랐던 거야.\"\n\n\"어째서... 저는...\"\n\n나기사는 다리에 힘이 풀린 듯 그 자리에 주저앉았다.\n\n\"그렇게 오래 함께했는데도 몰랐냐고? 그 대답은, 나보다 나기쨩이 더 잘 알지 않아? 우리는 결국 타인이잖아. 서로를 완전히 알 수 있을 리가 없지.\"\n\n\"...난 이제 가볼게. 할 일이 많아서.\"\n\n\"...네. 조심히 돌아가세요, 미카 씨. 배웅은... 못 해드리지만.\""
 trinity_flavor_events.32.a: "나기사는 마음 속으로 마지막 인사를 남겼다."
 trinity_flavor_events.33.t: "(일반)  ' 미 소 노 미 카 ' 드디어 다 깟네요                         \n00 | [GetDate]                                                   "
 trinity_flavor_events.33.desc: "ㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡㅡ\n\n(고양이 사진)\n\n점심 추천 해줘\n\n                                                  3 추천 | 비추천 1013\n\n전체 댓글 §t1000§!개\n댓글 수가 1000개를 넘었습니다. 더 이상 댓글을 쓸 수 없습니다. \n\n01\n야 장난하냐?\n\n02\n아...\n\n03\n간절한 사람 놀리는게 재밌냐?\n\n04\n(페로로가 경멸하는 이모지)\n\n05\n야한건 안돼!!!!\n\n06\n(\"얼탱\" 글자가 적힌 이모지)\n\n07\n어디가서 미소노 미카님 좋아한다고 하지 마라\n빡대가리새끼야. 유명한 트리니티 해변에서\n몇개월만 기다리면 볼 수 있는건데 시도는 해보고 \n어그로 끌어라.\n\n08\n>>07\n자매님...\n\n....이후로도 작성자를 향한 공격적인 댓글만 계속 달렸다."
 trinity_flavor_events.33.a: "하아?"
 trinity_flavor_events.34.t: "우리들의 이야기"
 trinity_flavor_events.34.desc: "노을이 지는 저녁 시간, 미카는 혼자 해변에서 수영을 즐기고 있었다. 수영이 취미는 아니었지만, 그날따라 이상하게 해변에 가고 싶다는 생각이 들어 아무도 없는 바다에 도착해 한참을 물놀이하고 있었다.\n\n지금은 선베드에 앉아 노을을 바라보는 중이었다. 키보토스의 태양과 다를 바 없는 지구의 태양이지만, 오늘만큼은 유독 특별하게 느껴졌다.\n\n노을은 정말 아름다웠지만, 해가 점점 지평선 너머로 사라지는 모습을 바라보며 미카는 천천히 자리에서 일어섰다.\n\n\"이곳에서 보는 노을도, 키보토스와 다를 게 없이 평범하네요.\"\n져가는 태양을 바라보며 누군가가 조용히 말했다. 수영복 차림의 세이아였다.\n\n\"세, 세이아 쨩?!\"\n\"여, 여긴 어떻게…?\"\n\n\"당황하지 마세요, 미카. 저는 단지 대화를 하러 온 것뿐이에요.\"\n세이아는 미카를 안심시키듯 부드럽게 말했다.\n\n\"세이아 쨩… 그, 그렇지만!\"\n그날의 기억이 뚜렷하게 되살아났다. 미카는 말문이 막혀 아무 말도 하지 못했다.\n\n\"네, 그날 제가 피습당한 건 사실입니다. 이건 제 마지막 메시지라고 생각해 주세요.\"\n\"당신은 늑대처럼 기회를 틈타 독주 체제를 완성하겠지요. 아니, 이미 완성했으려나요?\"\n\"하지만, 그게 정말로 당신이 소꿉친구까지 가둬가며 얻고 싶었던 거였나요?\"\n\n\"…\"\n미카는 아무 말 없이 세이아를 바라보기만 했다.\n\n\"솔직히 말하자면, 지금의 당신은 당신답지 않아요.\"\n\"그렇게나 꽃밭에 빠져 아리우스와의 화평을 외치던 사람이…\"\n\"이제는 더 이상 그런 것들도 필요 없는 건가요?\"\n\n\"……\"\n\n\"미카, 미안하지만 시간이 다 된 것 같아요.\"\n\n\"자, 잠깐만! 세이아 쨩! 그렇게 혼자 말하고 가는 건 너무하잖아?!\"\n\n\"어쩔 수 없어요. 하지만 미카, 당신이라면 이해해 주겠죠.\"\n\n미카가 세이아를 붙잡으려 했지만, 그녀는 눈 깜짝할 사이에 사라져버렸다.\n\n\"난… 난 그저… 이렇게 해야 할 것 같아서…\"\n\"그래도… 나 잘할 테니까… 응. 꼭… 다시 만나자…\""
 trinity_flavor_events.34.a: "미카는 해변에 주저앉아 눈물을 흘리며 조용히 말했다."
 trinity_flavor_events.35.t: "협동주의자들"
 trinity_flavor_events.35.desc: ""
 trinity_flavor_events.35.a: "이들의 생각을 티파티의 이념으로 삼아야 한다."
 trinity_flavor_events.35.b: "이들의 생각은 너무 이상주의적이다."
 trinity_flavor_events.36.t: "어둠 속의 빛"
 trinity_flavor_events.36.desc: "나치 독일의 몰락과 진정한 그리스도 왕국의 승리를 기념하며\n로마, 성 베드로좌에서\n주후 1936년, 부활 시기\n\n사랑하는 아들들과 딸들에게, 전 세계의 가톨릭 신자들에게, 그리고 승리의 평화를 이룩한 귀한 형제 자매들에게,\n1.하느님의 섭리 속에서\n 주님께서는 시대마다 인간의 교만과 폭정을 꺾으시며, 겸손과 정의를 드러내십니다. 우리 시대에도, 그리스도와 그 복음의 진리에 대항하여 스스로를 절대화한 한 권력, 인종의 우월을 외치고 창조주를 부인하며, 인간을 단지 도구로 삼았던 그 체제가 무너진 것을, 우리는 깊은 감격과 감사로 바라봅니다.\n\n2.그릇된 신앙의 종말\n나치즘이라 불린 그 사상은, 피조물인 인간을 창조주의 자리에 앉히려 하였고, 민족을 우상으로 만들었으며, 약자를 억압하고 무고한 피를 흘리게 하였습니다. 그러나 \"빛이 어둠 속에 비치니 어둠이 그를 깨닫지 못하였다\"(요한 1,5)고 하신 주님의 말씀이, 마침내 역사의 현장에서 이루어졌습니다.\n\n3.정의와 신앙을 지킨 국가에게\n우리는 주님 안에서, 이번 승리의 도구가 된 기독교 국가에 깊은 찬미와 축복을 전합니다. 그대들은 전쟁의 불길 속에서도, 억압받는 형제들을 위해 싸웠고, 진리의 빛을 가리는 폭정을 꺾으셨습니다. 이는 단순한 군사적 승리가 아니라, 하느님께 대한 충성과 복음의 자유를 위한 승리입니다.\n\n4.평화의 과업\n그러나 승리는 종착점이 아니라 시작입니다. 이제 그대들의 사명은, 무너진 도시와 상처 입은 영혼 위에 그리스도의 사랑과 정의를 세우는 일입니다. 보복이 아니라 용서를, 증오가 아니라 화해를 심으십시오. 그리스도의 평화만이, 전쟁이 남긴 깊은 골을 메울 수 있습니다.\n\n5.모든 이에게 드리는 당부\n사랑하는 형제자매들이여, 우리는 이 역사적 순간을 하느님께 감사드리며, 다시는 어떠한 권력도 하느님 위에 서지 못하게 경계합시다. 가르멜 산의 예언자처럼, 우리는 거짓 신들을 물리치고, \"주님만이 하느님이시다\"라고 고백해야 합니다.\n\n6.일치에 대한 염려와 기도\n비록 오늘의 승리가 하느님의 도구를 통해 이루어졌으나, 우리는 승리한 이들이 가톨릭의 완전한 신앙 안에 있지 않음을 기억합니다. 그 신앙의 불완전함과 교리의 차이는, 장차 참된 일치를 향해 나아가야 할 과제로 남아 있습니다. 그러므로 우리는 이 승리를 감사함과 함께 경계로 받아들이며, 모든 그리스도인이 \"한 주님, 한 믿음, 한 세례\"(에페 4,5) 안에서 하나 되도록 기도합니다.\n\n성모 마리아, 평화의 모후시여, 저희를 위하여 빌어주소서.\n그리스도 왕이여, 저희를 다스리소서."
 trinity_flavor_events.36.a: "로마, 성 베드로좌에서\n교황 비오 11세"
 trinity_flavor_events.37.t: "도서관 방문"
 trinity_flavor_events.37.desc: "\"후후. 실제로 도서관에 오는 건 처음이네요.\"\n키리후지 나기사가 코제키 우이 앞에서 말했다. 그러나 코제키 우이는 자신의 작업에 집중하느라 제대로 듣지 못했다.\n\n\"어라? 제 말이 들리지 않으시나요?\"\n\n\"히엑-!\"\n\"노… 놀랐잖아요… 제 작업 공간에서… 뭐 하시는… 히, 히엑!\"\n코제키 우이는 눈앞에 있는 인물이 키리후지 나기사라는 사실을 깨닫는 데 몇 초 걸리지 않았다. 그녀는 머리를 감싸 쥔 채 작은 목소리로 중얼거렸다.\n\n\"후훗. 걱정하지 마세요, 해치지 않아요. 제가 여기에 온 이유는… 도움이 필요해서예요.\"\n키리후지 나기사는 코제키 우이를 안심시키려는 듯 부드럽게 말했다.\n\n그러나 코제키 우이는 경계를 풀지 않고 책으로 하관을 가렸다. 그녀의 눈에는 여전히 불신이 어려 있었다.\n\n\"어머나… 그렇게까지 경계하지 마세요. 책 하나를 찾고 있거든요. 입에 올리기에 조심스럽지만… 아리우스 분교와 관련된 책이에요.\"\n그 말에 코제키 우이는 조금씩 경계를 풀었지만, 여전히 일정 거리를 유지했다.\n\n\"아, 아리우스 분교라면… 아마 지, 지하에 있을 거예요…\"\n\n\"후훗. 협조 감사드립니다, 우이 씨.\""
 trinity_flavor_events.37.a: "나기사는 웃음을 보이며 자신의 경호원과 지하실로 향했다."
 trinity_flavor_events.38.t.Yoshimi: "폭발적인 클라이막스"
 trinity_flavor_events.38.d.Yoshimi: "\"해, 해냈다. 해냈다구!\"\n\"그보다 봤어? 내가 세운 전략이 통한거 말이야!\"\n\n이바라기 요시미는 원래 정의실현부가 아니라 디저트부 학생이었습니다. 하루 종일 마카롱이나 케이크 이야기를 하는 게 일상이었지요. 그러나 트리니티에서 장교 인력이 부족해 다른 동아리 학생들까지 차출하자 요시미 역시 예외가 될 수 없었습니다. 마카롱을 손에 쥔 채로 장교 임명장을 받았을 때, 요시미의 표정은 그야말로 얼떨떨했습니다. 제삼자가 보아도 당황스러움이 얼굴에 그대로 드러났을 정도였습니다.\n\n임명 이후 요시미는 장교 교육을 받으며 전술의 기초를 익혔습니다. 하지만 실제 전장은 절대 녹록지 않았습니다. 초급 장교용 전술은 곧바로 간파당했고, 전투는 예상보다 훨씬 험난했습니다. 그렇지만 요시미는 쉽게 포기하지 않았습니다. 수많은 시행착오 끝에 그녀만의 감각과 끈기가 전술에 녹아들기 시작했습니다.\n\n그리고 어느 순간, 그녀의 전술은 눈에 띄게 효과를 발휘했습니다. 연달아 적을 몰아내는 데 성공하자, 요시미는 말로 다할 수 없는 벅찬 기쁨을 느꼈습니다. 하지만 흥분을 억누르고, 차분하게 상부에 올릴 보고서를 작성해 내려갔습니다. 디저트부 출신이든 아니든 이제는 분명히 한 명의 장교로서 자신을 증명해 보이고 있었던 것입니다."
 trinity_flavor_events.38.Yoshimi: "\"기대해도 좋으니까. 아니 기대해!\""
 trinity_flavor_events.38.t.Airi: "더 크게 더 멀리"
 trinity_flavor_events.38.d.Airi: "쿠리무라 아이리는 언제나 소심한 성격 때문에 자신을 작게만 느끼고 있었습니다. 디저트부에는 개성이 뚜렷한 부원들이 많았지만, 아이리는 자신만 특별함이 없다고 생각했습니다. '나는 그냥 평범할 뿐이야'라는 마음은 점차 커져, 어느새 자기혐오로 이어지기도 했습니다.\n\n그러나 예상치 못한 변화가 찾아왔습니다. 트리니티에서 장교 부족을 이유로 아이리에게도 지휘관 임무가 주어진 것입니다. 처음엔 당연히 불안했습니다. 명령을 내리는 것조차 두려워 보였고, 자신도 잘 해낼 수 있을지 확신이 없었습니다.\n\n하지만 아이리는 물러서지 않았습니다. 작은 실수에도 얼굴이 빨개졌지만, 포기하지 않고 계속 도전했습니다. 그리고 마침내 그녀만의 방식을 찾아냈습니다. 누구도 주목하지 않았던 세밀한 관찰과 신중한 판단이, 오히려 전장에서 빛을 발한 것입니다. 그 결과 아이리는 직접 지휘한 전투에서 적을 격퇴하는 성과를 거두었습니다.\n\n아직 그녀가 지닌 진정한 가능성은 다 드러나지 않았습니다. 그러나 분명한 것은, 아이리는 더 이상 '그저 평범하다'라는 이유로 자신을 부정할 소녀가 아니라는 사실입니다. 전장은 그녀가 몰랐던 새로운 길을 열어주고 있었던 것입니다."
 trinity_flavor_events.38.Airi: "\"보여드릴게요. 달라질 수 있었던 제 모습!\""
 trinity_flavor_events.38.t.Natsu: "이 또한, 디저트에 담긴 철학"
 trinity_flavor_events.38.d.Natsu: "\"이야~ 곤란하게 됐네~\"\n\"영-차\"\n\"문제 없음~\"\n\n유토리 나츠는 장교라는 자리에 오르자마자 가슴이 뛰었습니다. 트리니티가 장교 부족으로 동아리 학생들까지 차출했을 때 다른 학생들이 당황할 동안 나츠는 오히려 '이것도 로망이다'라며 눈을 빛냈습니다. 지휘관이 되는 일조차 그녀에게는 동경의 한 장면이었기 때문입니다.\n\n물론 현실은 이상과 달랐습니다. 나츠가 세운 전술은 쉽게 무너졌고 승리를 거두더라도 희생이 뒤따랐습니다. 그러나 나츠는 주저앉지 않았습니다. '실패도 또 다른 로망이다'라며 웃어넘기며 매 전투마다 새로운 방법을 찾아 나섰습니다.\n\n그렇게 수개월 동안 전장을 누비며 얻은 경험은 나츠를 단단히 성장시켰습니다. 마침내 오늘 그녀의 전술은 완벽하게 맞아떨어졌습니다. 적을 무너뜨리고 당당히 승리를 거둔 순간 나츠는 확신했습니다. 지금 자신이 걷고 있는 길이야말로 진정한 로망이라는 것을 말입니다.\n\n앞으로도 나츠의 로망은 멈추지 않을 것입니다. 더 치열한 전장 속에서도, 더 큰 시련 앞에서도, 그녀는 언제나 환하게 웃으며 새로운 로망을 찾아 나설 것입니다."
 trinity_flavor_events.38.Natsu: "\"이 공간에 디저트를 더하고 싶은데, 도와줄 거지?\""
 trinity_flavor_events.39.t: "바뀌었지만 바뀌지 않았다."
 trinity_flavor_events.39.desc: "\"역시, 제 입맛에는 맞지 않군요... 불합격입니다.\"\n하루나가 차갑게 말하며 손에 쥔 버튼을 눌렀다. 순간, 굉음과 함께 폭발물이 터지며 식당 내부는 불길과 파편으로 뒤덮였다. 비명과 혼란이 뒤섞이는 사이, 미식연구회는 이미 차량에 몸을 실은 뒤였다. 타는 듯한 연기와 불빛을 뒤로하며, 그들은 속도를 높여 현장을 벗어났다.\n\n그러나 신고는 이미 접수되었다. 사이렌 소리를 가르며 정의실현부의 차량들이 빠르게 추격해왔다.\n\n\"우와앗! 뭐, 뭐야?! 벌써 쫓아온 거야?\"\n준코가 당황한 듯 창문 밖으로 몸을 기울였다. 하루나는 익숙하다는 듯 미소를 지으며 정의실현부를 향해 한 마디 거들었다.\n\n\"후훗, 정의실현부 여러분. 평안하셨는지요? 저는 오늘도 미식을 탐구하기 위해 여러 음식점들을...\"\n\n하루나의 도발적인 외침이 도로 위에 울려 퍼졌다. 하지만 대답은 곧 총탄이었다. 유리창이 산산조각 나며 금속이 찢기는 소리가 이어졌다.\n\n\"곤란하네요... 설마 여기서 난관을 마주하게 될 줄은...\"\n하루나가 여유로운 척 말하던 순간, 차량이 급정거했다. 핸들을 잡은 아카리의 시선은 앞으로 고정되어 있었다. 도로 위에는 정의실현부의 차량들이 촘촘히 늘어서 있어 길을 완벽히 차단하고 있었던 것이다.\n\n차량의 문이 열리며 정의실현부 부원들이 빠르게 흩어져 포위망을 좁혀 왔다. 총구가 일제히 미식연구회 차량을 겨눴다.\n\n\"쳇... 아무래도 여기까지인 것 같네요. 미식의 길이란 이렇게 험난하군요.\"\n하루나는 자신을 포위한 정의실현부를 천천히 둘러본 뒤, 항복의 의미로 두 손을 들어 올렸다. 차 안의 다른 부원들도 서로 눈빛을 주고받더니, 마지못해 손을 들어 올렸다. 긴장으로 가득한 정적이 감돌았다. 정의실현부는 이들을 체포했고, 곧바로 감옥으로 이송했다."
 trinity_flavor_events.39.a: "게헨나란 정말로.."
 trinity_flavor_events.40.t: "호랑이가 없는 굴에는.."
 trinity_flavor_events.40.desc: "호스트로서의 과중한 업무는 미소노 미카를 지치게 만들기에 충분했습니다. 그 무게는 본래 불안정한 그녀의 성격과 겹쳐, 마침내 그녀를 자신만의 별장으로 이끌었습니다. 미카는 스스로에게 휴가라는 이름의 선물을 내리고, 나흘간의 짧은 안식에 몸을 맡기기로 했습니다. 경호원 두 명과 함께 찾아간 곳은 티파티가 소유한 비밀스러운 해변이었습니다. 그곳에서 그녀는 경호원들과 소박한 티파티를 열고, 가벼운 담소를 나누며, 홀로 사색에 잠기곤 했습니다. 그렇게 그녀는 자신만의 세계 속에서 서서히 쌓였던 피로와 긴장을 풀어내고 있었습니다. 한편, 그녀의 부재 동안 국정은 파테르 분파의 대표 인물 세 명이 나서 분파의 뜻을 반영하며 이끌어가고 있었습니다."
 trinity_flavor_events.40.a: "여우가 왕인 법."
 trinity_flavor_events.41.t: "알프레트 후겐베르크의 평론"
 trinity_flavor_events.41.desc: "\n\n\n\n\n\n£GFX_report_event_TRN_Alfred_Hugenberg_01\n\n\n\n\n\n\n\n\n\n알프레트 후겐베르크는 과거 독일의 정치인이었습니다. 나치의 집권을 도운 전적이 있으나, 사태 이후에는 근신하며 간신히 몸을 보존한 것으로 알려졌습니다. 그러나 그에게 무슨 바람이 불었던 것일까요? 어느 날, 한 영상이 인터넷에서 화제가 되었습니다. 바로 후겐베르크의 영상이었습니다. 썸네일에는 특정 문장이 강조되어 있었고, 왼쪽에는 미소노 미카의 초상화가, 오른쪽에는 후겐베르크 자신의 얼굴이 담긴 사진이 자리하고 있었습니다. 이미지는 다소 구식이었으나 그의 주장을 간단히 요약한 것임을 알 수 있었습니다.\n\n영상 속에서 카메라를 응시한 후겐베르크는 자신의 주장을 또렷하게 열거했습니다. 그는 과거 독일 의회에서 연설을 하고 논쟁을 벌인 경험이 있었기에 말솜씨 또한 부족하지 않았습니다. 댓글란에는 그에게 동조하는 독일인으로 보이는 계정들이 몇 개 보였지만, 대다수는 트리니티 학생들의 비판과 조롱, 비난으로 가득 차 있었습니다."
 trinity_flavor_events.41.a: "...그에게서 휴대전화를 빼앗던가 해라."
 trinity_flavor_events.42.t: "크라이사우 서클"
 trinity_flavor_events.42.desc: "트리니티에게 저항하는 조직은 한둘이 아닙니다. 물론 체포되어 정의실현부에 넘겨져 수용소에 갇힌 이들도 적지 않습니다. 그러나 최근 잡힌 조직이 꽤나 흥미로웠습니다. 바로 크라이사우 서클입니다.\n\n이이들에게 어떤 특별한 점이 있을까요? 이름부터 특정 지명을 따온 조직이라 별로 흥미롭지 않습니다. 그러나 이들의 대범한 행동이 눈에 띄었는데, 바로 천년수도 에덴 지하에서 활동하던 작은 사교 모임이었습니다. 정확히는 중앙구와 서구의 경계 지하에서 활동하던 이들이었는데, 용감한 학생들이 이들을 발견해 신고한 덕분에 체포할 수 있었습니다. 여담으로 이 조직은 꽤나 흥미로운 조합으로 구성되어 있었는데, 귀족 집안 출신과 종교인, 그리고 사회주의자들로 이루어져 있었습니다."
 trinity_flavor_events.42.a: "유대계 폴란드인은 없었나? 다행이군."
 trinity_flavor_events.43.t: "원초적인 공포"
 trinity_flavor_events.43.desc: "\"아얏! 얌마 새끼야!\"\n\n\"...제가 무서우신가요?\"\n\n\"미친년이네..\"\n\"..이봐 자경단 부를까?\"\n\n\"아니.. 그건 조금..\"\"아앗!\"\n\n\"아프죠? 지금 이 순간! 고통의 구렁텅이에 빠졌다는 느낌이시죠? 그게 바로 저의 사명이에요! 당신들에게 공포를 심어주어 구하는 겁니다!\"\n\n\"구제! 펀치!!!\""
 trinity_flavor_events.43.a: "이건 공포가 아니라 분노잖아."
 trinity_flavor_events.44.t: "첫 번째 업무"
 trinity_flavor_events.44.desc: "미소노 미카에게 티파티 호스트직은 그리 생소한 자리가 아닙니다. 과거 그녀는 이미 한 차례 호스트직을 수행한 경험이 있었고, 깔끔하게 임기를 마무리한 뒤 관례에 따라 다음 분파에게 직책을 넘겼습니다. 그러나 지금은 상황이 다릅니다. 과거에는 1년으로 엄격히 제한되어 있던 호스트 임기가 이제는 사실상 무한정으로 연장될 수 있게 되었기 때문입니다. 트리니티의 새로운 헌법이 보장하는 한 그녀의 임기는 지속될 것입니다.\n\n업무 자체는 그녀에게 그리 낯설지 않습니다. 분파 수장으로서 이미 막중한 책임을 지고 있던 그녀에게, 호스트직의 업무는 기존 업무량에서 약간의 행정적 절차와 의전이 추가된 정도에 불과합니다. 서류 작업은 분명 번거롭고 지루한 면이 있지만, 대부분을 신속하게 처리할 수 있습니다. 회의록 검토, 예산안 승인, 분파와의 협의 사항 정리 등 반복되는 업무들은 이제 거의 기계적으로 처리할 수 있을 만큼 익숙해졌습니다.\n\n업무를 마친 후 남아있는 시간을 효율적으로 활용하기 위해, 미카는 나름의 개인적인 일과를 만들어가고 있습니다. 그녀는 집무실에서 홀로 차분하게 차를 우려 마시며 하루를 정리하는 시간을 가지기도 하고, 때로는 집무실 한편에 마련된 공간에서 가벼운 체조나 요가를 하며 긴장된 몸을 이완시키기도 합니다. 미카는 이 조용한 순간들이 자신에게 필요하다는 것을 잘 알고 있고, 그래서 의도적으로 업무 이외의 시간을 확보하려 노력하고 있습니다."
 trinity_flavor_events.44.a: "그러니까 이거, 스토리인척 하는 튜토리얼이지?"
 trinity_flavor_events.45.t: "이념주의자들"
 trinity_flavor_events.45.desc: ""
 trinity_flavor_events.45.a: "이들의 생각을 티파티의 이념으로 삼아야 한다."
 trinity_flavor_events.45.b: "이들의 생각은 너무 과격하다"

 trinity_flavor_events.1000.t: "내면의 고뇌"
 trinity_flavor_events.1000.desc: "오늘은 이오치 마리에게 누구보다도 특별한 날이었다. 아이돌 무대라는 낯선 무대 위에서, 몇 가지 사소한 문제가 있었지만 그녀는 끝내 빛나는 퍼포먼스로 공연을 마무리해냈다. 화려한 조명 아래에서 반짝이던 그녀의 모습은 트리니티의 학생들에게 깊은 인상을 남겼고, 이젠 모두가 '아이돌 이오치 마리'를 기대하고 있었다. 언젠가 다시 무대에 설 그녀를 기다리며, 팬들은 열렬한 환호와 함께 공연장을 떠나갔다.\n\n그러나 무대가 끝난 그 순간부터, 마리는 혼자만의 조용한 싸움을 시작하고 있었다. 수녀로서의 삶은 그녀에게 있어 신념이자, 존재의 이유와도 같았다. 엄격한 규율 속에서 살아온 지난 시간들은 결코 가볍지 않았고, 마리 역시 그 길이 자신에게 주어진 운명이라 믿고 있었다. 하지만 무대 위에서의 짧은 순간-- 조명, 환호, 그리고 무대 아래에서 자신을 향해 손을 뻗는 수많은 시선 속에서--\n\n\"이건... 정말 괜찮은 건가요...?\"\n무대 뒤, 조용한 대기실에서 마리는 거울 속 자신의 모습을 바라보며 중얼거렸다. 반짝이는 의상과 아직 식지 않은 숨결, 손끝에 남은 박수 소리의 여운. 분명히 이건 신께서 원하신 길과는 다를지도 모른다. 하지만 그럼에도 불구하고, 마음 어딘가 깊숙한 곳에서는 계속해서 그 무대를 그리워하고 있었다.\n\n며칠간의 고민은 결코 쉽지 않았다. 기도 중에도, 고요한 성당에서도, 마리는 스스로에게 질문을 던지고 또 던졌다. 수녀로서 살아온 삶과, 무대 위에서의 '자유로운 나'. 둘 중 어느 쪽이 진짜 ‘이오치 마리’일까?\n\n그리고 마침내, 그녀는 조용히 결심을 내렸다."
 trinity_flavor_events.1000.a: "나, 아이돌 선언!"
 trinity_flavor_events.1000.b: "수녀로서의 각오를 다시 한 번 마음속에 새겨야겠어요!"
 trn_idol_portrait_tt: "§L이오치 마리의 초상화가 아이돌 옷으로 교체 됩니다.§!"
 trinity_flavor_events.1001.t: "수도복을 벗어던지고"
 trinity_flavor_events.1001.desc: "조용한 성당의 안뜰, 은은한 햇살이 스테인드글라스를 타고 떨어지는 오후였다.\n이오치 마리는 떨리는 손으로 수도복의 단추를 하나하나 풀기 시작했다. 묵주가 살짝 흔들리며 소리를 냈다. 마주 선 우타즈미 사쿠라코는 그 모습을 말없이 지켜보고 있었다.\n\n\"사쿠라코 님... 전, 더 이상 이 복장을 입고 설 수 없을 것 같아요.\"\n마리는 시선을 피하지 않은 채 말을 이었다. \"전... 아이돌의 길을 가겠습니다. 그것이 저에게 주어진 또 다른 사명이라고 믿어요.\"\n\n순간, 사쿠라코의 눈이 약간 흔들렸다. 그녀의 차분한 얼굴에 짧은 침묵이 드리웠다. 하지만 곧, 그녀는 두 손을 모으고 깊이 숨을 들이쉰 뒤, 부드럽게 고개를 끄덕였다.\n\n\"...그래요, 자매님. 당신의 결심이 신의 뜻에서 벗어나지 않기를, 저는 그저 기도할 뿐입니다.\"\n그녀는 미소 지으며 한 발 다가왔다. \"그리고 무엇보다... 당신이 자신답게 빛나는 길이라면, 저는 언제든 지지할 겁니다.\""
 trinity_flavor_events.1001.a: "좋아해 줘! 좀 더! 나를 봐 줘! 좀 더!"
 trnfla_1001_tt: "§L\"...마리 자매님에게도 저런 면이 있었군요. 그나저나... 아이돌이라 하면 저나 미네 단장님 정도밖에 없었을 텐데 ...도대체 누구와 아이돌을 하시겠다는 건지, 그게 조금 걱정이네요.\"§!"

 trinity_flavor_events.1002.t: "자신이 바라는 것"
 trinity_flavor_events.1002.desc: "이오치 마리는 고요한 성당의 의자에 앉아, 오랫동안 흔들리는 마음을 붙잡고 있었다. 무대의 찬란함과 박수갈채, 그 속에서 피어난 감정은 너무나 강렬했고, 때로는 수도복보다 더 자신답게 느껴지기도 했다. 그러나 마리는 결국 한 가지 결론에 이르렀다.\n\n-나는, 수녀로서의 길을 계속 걷겠습니다.\n\n결심했음에도, 마음은 여전히 완전히 맑아지지 않았다. 무언가가 가슴 어딘가에 걸린 듯한 느낌. 그 답을 찾기 위해, 그녀는 늘 자신이 찾던 조용한 장소, 사격장으로 향했다. 평소와 다름없이 정돈된 공간, 고요한 바람. 그곳은 세상의 소음과도, 마음의 소란과도 거리를 둔 곳이었다.\n\n마리는 무릎을 꿇고, 조용히 기도했다. 기도는 속삭임이 되어 공기 속으로 퍼졌고, 마리는 그 속에서 자신의 깊은 속마음을 조용히 토로했다. 그리고 잠시 후- 갑작스럽게, 머릿속이 환하게 밝아지는 듯한 느낌이 들었다. 마치 아주 오랫동안 묵혀둔 생각이 스르륵 열리는 듯한 감각. 누군가가 말없이 등을 가볍게 밀어준 듯한 따스한 울림.\n\n그녀는 문득 깨달았다. 무대에서 생긴 고뇌, 자신에 대한 의심과 혼란은 결코 잘못된 것이 아니었다. 그것은 신앙을 벗어난 것이 아니라, 오히려 신앙 속에서 자신을 돌아보게 해준 기회였다. 타인의 고민을 들어주고 위로하는 삶을 살아온 자신도- 가끔은 자신의 마음을 돌보고, 하고 싶은 것을 향해 걸어갈 필요가 있다는 것을."
 trinity_flavor_events.1002.a: "그 깨달음은 고요했고, 그러나 분명했다."
 trnfla_1002_tt: "§L요즘 들어, 이오치 마리를 바라보는 사쿠라코의 눈빛에는 어딘가 안도와 기쁨이 담겨 있었다. 조용히 묵주를 감싸쥔 그녀는, 창가에 앉은 마리의 활기찬 모습을 멀리서 바라보다가 부드럽게 중얼거렸다.\n\n\"최근의 마리 자매님... 참, 활기차셨어요. 보기 좋아요.\"§!"

 trinity_events_nagisa.1.t: "키리후지 나기사의 호스트 취임"
 trinity_events_nagisa.1.desc: "호스트 세이아가 저격당하는 유례 없는 사건에 뒤이어, 소꿉친구인 미소노 미카와의 권력 투쟁이 이어졌습니다. 키리후지 나기사는 결국 승리하였으나, 그 승리의 모든 과정이 나기사에게는 상처였습니다.\n\n트리니티 종합학원 헌법에 따라 다음 호스트는 티파티 투표에서 과반을 차지한 키리후지 나기사가 맡게 되었습니다. 승리한 필리우스 분파는 미소노 미카와 파테르 분파를 '유리조노 세이아 암살범'으로 비난하며 그녀들의 정치적 영향력을 꺾어 놓으려 하고 있습니다. 키리후지 나기사 본인도 점점 파테르의 수장인 미카에 대한 우정을 잃어가고 있기에, 파테르 분파가 다음 호스트 선거까지 필리우스 분파의 공격을 견뎌낼 수 있을 것인지는 의심스럽습니다.\n\n세이아 암살 사건이 일어난 지 얼마 되지 않은 시점이기에, 키리후지 나기사의 호스트 취임식은 소규모의 인원이 모여 비공개로 진행되었습니다. 나기사는 '두 번째 트리니티는 없다'는 그녀의 사상을 명백히 하며, 파테르 분파가 주장하는 급진적 변화는 결코 일어나지 않을 것임을 밝혔습니다. 나기사의 승리는 다소 아슬아슬한 표차로 이루어졌으며, 그녀는 필리우스만이 아니라 다른 분파들을 끌어들여 정국을 안정화할 것으로 예상됩니다."
 trinity_events_nagisa.1.a: "정의를 위하여."
 trinity_events_nagisa.2.t: "상투스 분파와의 회담"
 trinity_events_nagisa.2.desc: "필리우스 분파는 압도적으로 파테르 분파를 상대로 승리한 것이 아니었습니다. 필리우스는 다른 분파들의 협력이 있었기에 권력을 얻어낼 수 있었습니다. 상투스는 비록 유리조노 세이아라는 위대한 지도자를 잃어버리고 많은 지지자들이 이탈하였으나, 여전히 의미 있는 규모의 세력을 가지고 있습니다.\n\n\"...저는 상투스라는 이름을 지우고자 하는 것은 아닙니다. 상투스는 여전히 그 자리에 남아, 여러분의 이상을 펼치실 수 있습니다. 다만 저는 여러분들이 저와 우정을 유지해 주기를 바랄 뿐입니다.\"\n\n나기사는 상투스의 지도자인 $TRN_Natsuki_Kato$에게, 필리우스와의 '연합'을 제안했습니다. 상투스는 나기사의 정책에 반드시 지지하는 신임 공급 정당으로서 티파티에 잔류하는 것입니다. 그 대신, 상투스는 필리우스의 우당으로서 나기사의 일부 정책에 영향을 줄 수 있습니다.\n\n한 때 티파티의 3대 세력 중 하나로 불렸던 상투스가 필리우스에 종속되는 형태로 살아남는 것은 $TRN_Natsuki_Kato$가 바라던 바는 아니었습니다. 그러나 호스트가 상투스의 지지만을 바랄 뿐, 상투스를 완전히 흡수하려고 하는 것이 아니라는 것이 분명해지자, 그녀는 나기사의 제안을 받아들이기로 결정했습니다."
 trinity_events_nagisa.2.a: "함께, 미래로."
 trinity_events_nagisa.3.t: "위기의 공주님"
 trinity_events_nagisa.3.desc: "\"아니야! 도대체 왜 아무도 믿지 않는 거야? 적어도 나기 쨩이라면, 내가 그럴 사람이 아니라는 건 알아 줘야 하는 거 아니야?\"\n\n필리우스 분파가 공식적으로 미소노 미카를 '유리조노 세이아 암살 사주' 혐의로 고발하기로 결정했을 때, 경호를 뚫고 나기사 앞까지 쫓아온 미카는 호스트의 옷자락까지 움켜쥔 채 소리를 질렀습니다.\n\n미카는 '파테르'가 전임 호스트 암살범이라는 의혹을 받고 있다는 것은 알고 있었습니다. 그리고 파테르의 수장인 자신에게도 그 칼끝이 닿으리라는 것도 예상했습니다. 그러나 자신의 친구인 나기사가 기소 소식에 아무런 반응도 하지 않은 채 침묵하리나는 것은 예상하지 못했습니다. '미카는 그럴 사람이 아니예요.' 나기사는 그런 말을 해야 할 사람이 아니었던가요? 미카는 자신의 가장 친했던, 소중한 소꿉친구의 눈을 바라보았습니다.\n\n나기사는 확신을 가지지 못한 것처럼 미카의 시선을 그저 피하기만 할 뿐입니다. 미카가 세이아를 죽일 것이라고 믿고 싶지 않습니다. 하지만 그녀는 필리우스 분파의 수많은 이들이 말하는 '세이아의 죽음으로 얻은 미카의 이득'에 반박할 근거를 찾지 못했습니다.\n\n\"...나기 쨩. 이건, 실수야. 네 가장 크고 끔찍한 실수.\"\n\n미카는 자신을 붙잡으려는 티파티의 경호원들을 뿌리치고 도망쳤습니다. 나기사는 그녀를 쫓지 않았습니다."
 trinity_events_nagisa.3.a: "\"제가 쫓을 자격이 있을까요?\""
 trinity_events_nagisa.4.t: "공주의 마지막"
 trinity_events_nagisa.4.desc: "파테르 분파는 최근 점점 깊은 혼란 속에 빠져들고 있습니다. 미소노 미카는 공식적으로 '전임 호스트, 유리조노 세이아 암살 미수범'으로 기소되었습니다. 파테르 분파에 대한 비난의 목소리가 커지고 있으며, 잔존 상투스 분파를 중심으로 미카를 구속 수사해야 한다는 청원이 반복되고 있습니다.\n\n\"응! 그러네. 지금부터 나는 순교자가 되는 거야. 믿었던 가장 소중한 사람에게 버림 받고, 비극의 히로인으로서 독사과를 먹고 스러지는 거지. 정말 슬프지 않아?\"\n\n도발적이기까지 한 티파티에서의 마지막 연설을 끝으로 미소노 미카는 모든 직위에서 사임했습니다. 미카의 사임은 파테르 분파의 지도력에 큰 상처를 입혔지만, 증거 부족으로 인해 파테르 분파 전체가 세이아의 죽음을 의도했다는 결론을 내지 못한 것은 문제였습니다. 파테르 분파는 여전히 가장 큰 야당으로 남아 있으며, 필리우스의 끈질긴 적이 될 것입니다."
 trinity_events_nagisa.4.a: "\"죄송하지만, 비극의 히로인은 저예요, 미카 씨.\""
 trinity_events_nagisa.5.t: "남아 있는 분파들"
 trinity_events_nagisa.5.desc: "파테르 분파는 분명한 필리우스의 적으로 남게 되었습니다. 하지만 파테르만이 유일한 대립 세력인 것은 아닙니다. 상투스는 세이아 사후 지도자가 된 카토 나츠키를 여전히 따르는 중립적인 세력과, '사실 세이아 암살 사주를 한 것은 필리우스' 라고 주장하는 음모론적인 소수파 세력으로 분열되어 있는 상태입니다. 이 소수파 세력은 파테르에 충성할 것입니다.\n\n티파티에 참여할 권한이 있으나 구호에 집중하고 있는 요한 분파 역시 의심스러운 상대입니다. 구호기사단을 이끄는 요한 분파는 대전이 이후 키리후지 나기사가 어떻게 정국을 이끌어 갈 것인지 관망하고만 있으며, 적극적인 지지 의사를 보이지 않고 있습니다.\n\n구 유스티나, 현 시스터후드는 그 폐쇄성으로 인해 필리우스를 어떻게 바라보는지 전혀 알 수 없는 상황입니다. 나기사는 자신의 예리한 시선이 계속해서 시스터후드에 집중되는 것을 느낍니다.\n\n마지막으로, 나기사가 일일히 이름을 기억하지 못하는 아주 작은 분파들이 있습니다. 보통 이런 소규모 세력은 가장 강한 자에게 붙기 마련입니다. 파테르가 강성해진다면 미카의 초상화를 누구보다 빨리 거실에 걸어 놓을 자들이죠. 큰 영향을 끼치지는 못할 것이나, 나기사는 그녀들도 마음 속 경고장에 기록합니다."
 trinity_events_nagisa.5.a: "\"제 편은 정말 어디에도 없는 건가요?\""
 trinity_events_nagisa.6.t: "증명 불가능한 문제"
 trinity_events_nagisa.6.desc: "\"자, 키리후지 나기사 씨. 네. 거울에 비친 바보같은 저요. 어디 한 번 자신과의 대화를 나눠 보죠. 미친 사람처럼 말이예요.\"\n\n\"오늘은 다과도, 홍차도 없습니다. 그저 자정의 불 꺼진 티파티 호스트실, 거울 앞에 선 지친 여자 하나만 있을 뿐이죠.\"\n\n혼잣말을 반복하던 나기사는 천천히 의자 하나를 거울로 끌고 와 다리를 꼬고 앉았다. 거울 앞에 앉은 나기사는 희미한 미소를 지은 채, 자기 자신의 지친 눈을 바라보았다. 티파티 호스트가 되고 난 뒤 자신과의 대화를 나누는 시간은 훨씬 늘어났다. 이제 이곳에는 재잘거리며 떠드는 미카도, 길고 현학적인 말을 늘어놓는 세이아도 존재하지 않았으니까.\n\n나기사는 이렇게 물을 뿐이다. \"정말로, 미카 씨가 세이아 씨를 살해하도록 사주했나요?\"\n\n대답은 없다. 그저 나기사 본인의 의심증, 그리고 끝없는 불안만이 존재할 뿐이다. 나기사는 호스트가 된 자신이 마치 새장에 갇힌 것처럼 느껴졌다. 호스트가 되기 전, 그저 평범한 학생이었을 때의 나기사는 이런 빌어먹을 의심병 따위는 필요하지 않았다. 그저 호기심 많고, 작은 것 하나에도 감사하는 다정한 소녀였을 뿐이었으니까.\n\n그 소녀는 어디로 갔는가? 그리고, 이곳에는 왜 자신의 소꿉친구까지 숙청한 정치인만이 남아 있는 건가? 나기사는 정말로 미카를 살인범이라고 생각한 것일까, 아니면 필리우스 분파의 즐거운 멍석말이에 참여해 자신의 권력을 유지하기 위해 수많은 구둣발 행진에 동참했을 뿐인 건가?"
 trinity_events_nagisa.6.a: "거울은 대답하지 않았다."
 trinity_events_nagisa_6a_tt: "§g키리후지 나기사는 자신의 의심증을 치료해야겠다고 생각합니다. 적어도, 타인을 믿는 연습을 해 볼 필요는 있습니다.§!"
 trinity_events_nagisa.7.t: "시스터후드와의 만남"
 trinity_events_nagisa.7.desc: "\n\n\n                                                   £GFX_report_event_TRN_Sakurako\n\n\n\n\n\n\n대전이 이전, 나기사가 공적인 이유로 몇 번 사쿠라코를 방문한 적은 있었지만, 그 때에도 홀로 사쿠라코를 티파티 건물의 휴게실로 초대한 적은 없었다. 수행원들과 함께 여럿이서 고성당을 방문한다면 또 모를까. 그렇기에 사쿠라코는 어째서 나기사가 자신과의 독대를 원했는지 알 수 없었다.\n\n\"방문하는 것이 좋을까요?\"\n밀랍을 뜯어 확인한 옛스러운 초대장을 손에 든 채로, 사쿠라코는 히나타를 돌아보았다. 히나타는 잠시 손가락을 꼼지락거리며 그 편지를 가만히 내려다보고만 있었다. 마치 그 편지가 무슨 메시지를 담고 있는 것인지 해석해보기라도 하는 것처럼. 침묵은 그리 오래 가지 않았다. 히나타는 천천히 고개를 들었다.\n\n\"가시는 게 좋다고 생각해요. 저는, 나기사 씨가 뭔가 그... 나쁜 목적으로 부른 건 아닐 거라고 생각해요. 그래도, 티파티고, 호스트시고...\"\n\"...후후. 네. 티파티고, 그 티파티의 호스트니까요. 일단 만나지 않으면 저를 만나고자 하는 연유도 알 수 없겠지요.\"\n\n사쿠라코는 편지를 다시 봉투에 담았다."
 trinity_events_nagisa.7.a: "리버시 게임의 시작."
 trinity_events_nagisa.8.t: "말을 뒤집으며"
 trinity_events_nagisa.8.desc: "트리니티의 수백 년 된 전통 게임. '리버시'에는 흑과 백, 두 개의 말만이 존재한다. 다른 색의 말을 포위하면 자신의 색으로 물들일 수 있다. 그렇게 더 많은 색으로 게임판을 물들이는 참가자가 승리하게 된다. 작은 다과회에 어울리지 않는 리버시 게임판. 사쿠라코는 마치 나기사의 의도를 추측해 보기라도 하려는 듯, 팔짱을 낀 채 잠시 게임판을 내려다보았다. 그리고, 그녀는 흑말을 d3에 놓았다.\n\n\"다과회에서 게임 하는 걸 좋아하시는 편인가요?\"\n\n사쿠라코의 섬뜩한 미소. 백돌을 쥐는 나기사의 손이 멈췄다. '사쿠라코는 원래 표정이 무섭다'는 정보부의 전달에도 불구하고, 나기사는 자신의 날갯죽지를 따라 땀이 흐르는 것을 느꼈다.\n\n\"글쎄요. 오늘 우리들의 만남에 잘 어울리는 게임이라고 생각했습니다.\"\n\nc5. 사쿠라코의 e6. 차례대로 말이 오가는 동안, 나기사는 게임판이 아닌 그녀의 눈을 바라보고 있었다. 유치할 정도로 단순한 은유법이었다. 시스터후드의 검은 제복과 티파티의 백색 제복이, 서로의 색을 물들이려 하고 있지 않은가? 그녀 역시 몇 번 말이 오기가도 전에 나기사의 의중을 이해한 표정을 지었다.\n\n\"먼저 말씀드리자면, 시스터후드에 대해 나기사 씨가 무엇을 상상하셨든, 그건 정답과는 다를 겁니다.\"\n\"다르다고요?\"\n\na1. 몇 번의 말이 오갔을까. 사쿠라코의 흑말이 가장 중요한 지점을 장악했다. 시스터후드의 수녀원장은, 트리니티의 호스트를 향해 말했다.\n\n\"정치에 대한 불간섭. 시스터후드는 그 규율을 바꾼 적이 없습니다. 그것은 대전이 이전이든 이후든 달라지지 않았습니다. ...이 난리통의 트리니티를 장악해서, 저희가 얻을 이익이 뭔가요?\"\n\n그리고, 사쿠라코가 나기사에게 말했다.\n\n\"또, 저는 이렇게 소중한 사람과 만나 최신 게임을 하는 걸 더 좋아하거든요.\"\n\n그렇게 말하는 사쿠라코의 표정은 너무도 평안해 보여, 나기사는 흑색으로 채워진 게임판을 내려다보며 미소가 떠오르는 것을 느낄 수 있었다."
 trinity_events_nagisa.8.a: "다만, 이 게임은 '최신 게임'은 아닙니다."
 trinity_events_nagisa.9.t: "회담의 끝"
 trinity_events_nagisa.9.desc: "\"...그러니까, 시스터후드가 필리우스에 협력하기를 바란다는 말씀이신지요?\"\n\n나기사는 흑백의 리버시 말들을 다시 통에 담아 넣으며, 차분하게 고개를 끄덕였다. 사쿠라코를 만나기로 한 이유는 한 가지. 시스터후드가 음모를 꾸미고 있는지 여부였다. 하지만 그녀들이 그럴 의지가 없다면, 나기사의 생각은 달라진다. 시스터후드. 그녀들과 협력하는 것은 불가능할까.\n\n사쿠라코는 테이블을 손가락으로 톡, 톡, 몇 번이고 두드렸다.\n\n\"저희들의 가장 중요한 덕목은 신앙이며 정치가 아닙니다. 그건 방금 전에도 말씀을... 드렸었죠. 그렇기에 무조건적인 필리우스와의 공조를 약조할 수는 없습니다. 허나.\"\n\n사쿠라코는 나기사를 바라보며 다정한 미소를 지었다.\n\n\"나기사 씨가 올바른 길을 가고자 하실 때, 저희 시스터후드는 '정치 외'에서 도움을 드릴 수는 있습니다. 그리고, 나기사 씨가 우려하는 것. 파테르와의 공조 역시 없을 것입니다.\"\n\"파테르와의 공조도 불간섭 원칙에 어긋나기 때문...이군요?\"\n\"예. 트리니티의 중심이 무너지기라도 하지 않는 한, 저희들은 지금 이 자리에 계속 머물러 있고자 합니다.\"\n\n트리니티의 중심이 무너질 경우. 그런 뒷맛이 남는 단서를 남기기는 했지만, 나기사는 자신의 편집증을 눌러두기로 했다. 적어도 사쿠라코는 지금 당장 정치에 개입하지 않을 것이다. 필리우스를 직접적으로 돕지는 않을 것이지만, 파테르의 손을 쥐어 주지도 않을 것이다. 그 정도면 충분했다. '티파티를 엎으려 하냐'는 의중을 담아 리버시를 가지고 온 의미는 있는 셈이었다.\n\n\"좋습니다. 그렇다면... 앞으로 시스터후드의 많은 도움을 기대하겠습니다. 물론, 정치 이외에서요.\""
 trinity_events_nagisa.9.a: "사쿠라코는 우아하게 자리에서 일어났다."
 trinity_events_nagisa.10.t: "[GetYear]년 트리니티 공의회"
 trinity_events_nagisa.10.desc: "트리니티의 호스트에게 주어지는 명문화된 권한 행사 중 하나는, 트리니티의 공의회를 선언할 수 있는 것이다. 나기사는 대전이라는 미증유의 사건 속에서 트리니티를 보호하기 위하여 모든 분파들이 참여하는 새로운 공의회의 개회를 선언했다. 그것은 대전이 이후 트리니티가 어떤 방향으로 나아가야 할지, 그리고 혼란 속에서 키리후지 나기사라는 호스트가 어떤 식으로 모교를 지켜나가야 할 것인지를 공표하는 행사였다.\n\n\"이 자리에 모여주신 모두에게 감사드립니다. 이번 공의회를 통하여, 저희는 트리니티가 나아가야 할 길을...\"\n\n나기사의 개회식 행사는 트리니티의 각 분파들의 대표들이 모인 티파티 회의실에서 소규모로 이루어졌다. 심지어 필리우스에게 가장 격렬하게 반대하는 파테르조차도 이번 공의회는 보이콧하지 않았다. 이번 회의는 대전이 이후 트리니티의 새로운 헌법을 만드는 정치적으로 중대한 회의였으며, 이 회의에 참석하지 않는 것은 정치적 자살 행위나 다름이 없었으니까."
 trinity_events_nagisa.10.a: "트리니티를 바꿀 것이다."
 trinity_events_nagisa_10sakurako_tt: "§g나기사는 시스터후드의 의중을 의심하고 있었기에, 시스터후드에게 공의회 참석 초대장을 보내지 않았습니다. 개회식에 참석하지 못한 사쿠라코 수녀원장이 공개적으로 불만을 드러냈고, 한 발 늦게 시스터후드의 공의회에 초대받았습니다. 그러나, 그녀들의 마음의 상처는 사라지지 않을 것입니다.§!"
 trinity_events_nagisa.11.t: "호스트의 권한"
 trinity_events_nagisa.11.desc: "제일 먼저 논의된 것은 현재 1년으로 규정된 호스트의 권한을 3년으로 연장하는 것이었다. 파테르 분파의 대표들은 \"1년이면 세상을 바꿀 수 있는 시간\"이라며 노골적인 불만을 드러냈으나, 대전이라는 이전에 없던 사건 속에서 키리후지 나기사가 고작 1년 사이에 국가를 안정시키는 것은 불가능하다는 반대 의견도 같이 나왔다. 결국 파테르가 물러나면서 무제한의 연임이 가능한 호스트의 3년 임기가 공식적으로 보장되었다.\n\n다음 문제는 호스트의 권한이었다. 티파티의 호스트는 분명 가장 강력한 권력을 가지고 있지만, 다양한 법률에 의해 그 권한 행사는 제한된다. 필리우스는 대전이 이후 키보토스가 사실상 '상시 전시' 상태나 마찬가지라고 주장하면서, 대전이로 인한 혼란이 잦아들 때까지는 티파티 내에서 과반에 미달한 동의를 얻은 법률도 나기사가 '강행 처리' 하는 것이 가능하도록 하는 것을 제안했다.\n\n요한 분파와 같은 '티파티 외부' 분파들은 이러한 티파티 내부 권력 문제에 대해 중립적인 입장을 취하고 있으며, 오직 파테르 분파와의 대립이 호스트의 권한 확대의 걸림돌이다. 물론 키리후지 나기사의 권력을 지나치게 확대하는 것은 그녀가 '각 분파들 사이의 조화'라는 이상을 포기하는 것처럼 보일 수도 있다."
 trinity_events_nagisa.11.a: "더 강력한 호스트 권한을 지지한다."
 trinity_events_nagisa.11.b: "한 발 물러선다."
 trinity_events_nagisa.12.t: "게헨나 문제"
 trinity_events_nagisa.12.desc: "파테르 분파가 아무리 시끄럽게 목소리를 높이든간에, 키리후지 나기사와 필리우스 분파는 에덴 조약의 추진을 중단할 생각이 없다. 문제는 대전이 이후 게헨나의 정치적 변화다. 에덴 조약은 기존처럼 소라사키 히나 선도부장과 키리후지 나기사 두 사람간에만 이루어져야 할까? 아니면, 판데모니움 소사이어티, 그리고 룩셈부르크 의회와도 논의가 확장되어야만 할까?\n\n물론 키리후지 나기사는 선도부 외의 다른 두 세력에게 에덴 조약을 확장 제안하는 것이 아무 의미가 없다는 것을 알고 있다. 게헨나 정체성이 전혀 없는 룩셈부르크는 에덴 조약에 '무관심'에 가까운 반응을 보일 것이며, 판데모니움 소사이어티는 트리니티의 평화 제안 자체를 우리가 '나약한' 모습을 보이는 것이라 오판할 것이다.\n\n그렇기 때문에 나기사가 에덴 조약을 확장하겠다고 말하는 것은 사실상 국내 정치용일 뿐이다. 파테르 분파에게는 나기사가 결코 이 외교 문제에서 물러날 생각이 없다는 메시지를 주고, 평화주의적인 성향을 가진 시스터후드에게 호감을 얻고자 하는 정치공작.\n\n그러나 평화의 확대 주장은 우리의 군사조직인 정의실현부를 분노하게 할 우려가 있다. 이성적인 소라사키 히나는 그녀들이 용납할 수 있는 한계선이며, '하누마 마코토'와 평화를 논한다는 생각은 우리 군의 사기를 떨어뜨릴 것이다."
 trinity_events_nagisa.12.a: "\"언제나 선도부가 가장 중요한 상대입니다.\""
 trinity_events_nagisa.12.b: "\"허나, 판데모니움에도 손을 내밀 필요는 있습니다.\""
 trinity_events_nagisa.13.t: "신앙"
 trinity_events_nagisa.13.desc: "\"저는 이 땅이 믿고 있는 신앙이 우리 트리니티의 것과 닮았다고 주장하는 것 자체가, 일종의 모욕이라고 생각합니다. 그들의 신앙은 분명히 잘못된 길을...\"\n\n상투스 분파의 대표 임원 한 명의 공개적인 발언 이후, 시스터후드 역시 이에 동조하는 반응을 보였다. 중요 문제는 이 땅의 신앙입니다. 어떤 이들은 현지 신앙이 우리 트리니티의 것과 '호환이 가능한', 경전의 형제자매들이라고 주장한다. 그러나 강경한 이들은 이 땅의 신앙을 이단으로 규정지으며 전부 트리니티의 것으로 개종시켜야 한다고 말한다. 특히 현지 독일인들이 트리니티 신앙을 '불쾌한 이교도'로 간주하는 것은 큰 문제가 되었다.\n\n공의회의 공은 나기사에게로 넘어갔다. 여러 분파들은 키리후지 나기사에게 '트리니티 신앙의 국교화'를 명시하고, 현지 신앙을 강경하게 탄압할 준비를 해야 한다고 의견을 표했다."
 trinity_events_nagisa.13.a: "\"현지 신앙을 탄압할 준비를 합시다.\""
 trinity_events_nagisa.13.b: "\"아직은, 그들도 경전의 형제자매들입니다.\""
 trinity_events_nagisa.14.t: "공의회를 마무리하며"
 trinity_events_nagisa.14.desc: "긴 [GetYear]년 공의회도 어느덧 막바지에 접어들었다. 공의회에서는 국내 정치와 대외 외교, 그리고 트리니티의 중심을 이루는 신앙에 대한 논의가 차례대로 이루어졌다. 성공적으로 마무리 된 이번 공의회는 트리니티의 미래를 결정할 것이다.\n\n물론 모든 것이 결정된 것은 아니었다. 공의회에서 결정되지 못한 사항들, 특히 현지인과의 공존 문제, 구체적인 에덴 조약의 실행 방안 등은 키리후지 나기사가 스스로 정해 나가야만 한다.\n\n나기사는 공의회에서 결정된 사항들을 호스트의 권한으로서 반포했다. 파테르 분파는 아무런 말 없이 회의실을 전부 빠져나갔으며, 남은 분파들은 공의회의 결정 사항을 지지하든, 그렇지 않든, 박수를 보냈다."
 trinity_events_nagisa.14.a: "이 박수가 해피엔딩을 의미한다고 생각하지는 않아."
 trinity_events_nagisa.15.t: "미소노 미카 재판"
 trinity_events_nagisa.15.desc: "\"...알겠습니다. 이게 이번 재판에 대한 판사들의 결정이로군요.\"\n\n티파티 임원으로부터 넘겨받은 서류를 책상에 내려놓으며, 나기사는 한숨을 내뱉었다. 미소노 미카는 유리조노 세이아 암살을 직접적으로 사주하고 내란을 주도했다는 혐의로 인해 기소된 상태다. 단 한 번도 일어난 적 없었던 미증유의 살인 교사 및 내란 음모 사건에 대해 재판관들은 사형을 선고하려 했다. 하지만 이것이 옳은 선택인지 나기사는 알 수 없었다.\n\n\"정황증거는 미카 씨가 진범이라고 말하고 있습니다. 하지만, 정황밖에 없어요. 그 외의 증거는 오직 필리우스 분파의 혀에서만 나왔을 뿐.\"\n\n나기사는 혼잣말을 중얼거리며 의자 등받이에 몸을 깊이 기댔다. 세이아의 죽음으로 인해 상투스 분파가 입은 피해. 그리고 선거에 출마한 미카에게 몰렸던 지지. 미카는 이 모든 사건들로부터 가장 큰 이익을 얻었다. 필리우스 분파의 '미카 내란수괴' 주장이 단순한 정치공작이 아니라는 증거였다. 그것은 냉철하고 의심 많은 나기사조차 납득하게 만들 근거를 가지고 있었다.\n\n허나, 인간 '키리후지 나기사'는 미소노 미카와 지낸 10년의 삶을 되짚어보고 있었다. 미카는 충동적이고, 장난스러우며, 타인의 관심을 바라는 사람이자, 다른 친구의 암살을 사주할 만한 냉혹함을 가지지 못한 인간이었다. 만약 파테르 분파가 정권을 잡았다고 하더라도 미카는 나기사를 죽이지 못했을 것이다. 그런데 세이아는 죽였다고?\n\n유죄는 변하지 않을 것이다. 하지만 적어도 나기사는 판결이 내려지기 전 판사들에게 압력을 가할 수 있는 위치에 있었다. 만약 미카가 정말로 세이아를 죽이지 않았다면, 그녀의 하얀 목덜미에 내란수괴라는 이름의 밧줄을 매다는 것이 터무니 없는 잘못이라면, 지금. 바꿀 기회가 있다."
 trinity_events_nagisa.15.a: "이 판결문이 곧 진실입니다."
 trinity_events_nagisa_15a_tt: "§g정말 그렇게 생각하나요? 다른 선택이 더 낫지 않을까요?§!"
 trinity_events_nagisa.15.b: "무기징역. 진실이 따로 있다면, 언젠가 밝혀질 겁니다."
 trinity_events_nagisa.15.c: "가택연금. 저는 그녀를 믿고 있습니다." 
 trinity_events_nagisa.15.d: "국외 추방. 미카 씨는 갇혀 있어야 하는 죄인이 아닙니다." 
 trinity_events_nagisa_15d_tt: "§g미소노 미카는 게헨나 선도부에 인계되어 뮌헨 시로 추방되며, 재입국은 금지됩니다. 이것은 형식적으로는 처벌이지만, 사실상 그녀에게 자유를 주는 선택입니다. 나기사는 미카를 믿고 있으니까요.§!"
 trinity_events_nagisa.16.t: "미소노 미카의 추방"
 trinity_events_nagisa.16.desc: "얼마 전 일어난 유리조노 세이아 암살 사건 이후, [FROM.GetName] 측은 진범을 찾기 위한 수사를 벌였다. 물론 세이아의 저격범은 체포되었으나, 필리우스 분파는 저격을 사주한 '모략가'가 있다고 확신했다. 모든 정황증거는 미카를 가리키고 있었다. 세이아의 죽음은 그녀의 파벌인 파테르를 크게 성장시켰으니까.\n\n그리고 재판 끝에 미카는 '국외 추방'이라는 형태로 사실상의 무죄를 받게 되었다. 나기사가 개입한 것이 분명한 결과였다. 그녀가 추방된 곳은 [ROOT.GetName]의 뮌헨 시였다.\n\n\"응, 이건 말이야. 나기 쨩이 나를 '믿고' 있다는 거야. 미소노 미카는 살인 사주 따위를 할 사람이 아니다. 그렇게.\"\n\n미카는 여행가방을 시로미 이오리에게 떠넘긴 채, 마치 뮌헨 관광객이라도 되는 것처럼 선글라스를 썼다. 트리니티를 떠나야 했다는 것보다도 나기사가 '미카는 세이아를 죽이지 않았다'고 믿어 준 것이 더욱 기쁘다는 표정이었다.\n\n물론, 여행가방을 질질 끌고 다니는 이오리의 표정은 굳어갔지만. \"그래서 '공주님'? 나는 짐꾼이 아닌데?\" \"...게헨나 사람이 그거 말고 다른 직업을 가질 수가 있던가? 아하하☆ 농담. 농담. 그냥, 나기 쨩에게 잘 도착했다고 사진 찍어서 보내줄까 했거든. 나 셀카 찍어야 하는데 셀카봉 있어?\""
 trinity_events_nagisa.16.a: "트리니티의 공주는 정말로 호스트에게 신뢰받고 있군."
 trinity_events_nagisa.17.t: "정의로운 전쟁을 위하여"
 trinity_events_nagisa.17.desc: "[FROM.GetNameDef] 측은 우리와 [GEM.GetNameDef] 측 사이의 전쟁을 지원하기 위하여, 군사자문단을 보냈습니다. 이들은 [ROOT.GetLeader] 선도부장을 돕기 위하여 도착하였다고 말하며, [FROM.GetName] 측과 [ROOT.GetName] 측의 우정을 유지하기 위하여 최선을 다하겠다고 밝혔습니다. 자문단은 소규모의 무기들을 함께 가지고 도착했으며, 우리는 트리니티와 협력해 [GEM.GetLeader]의 사악한 전쟁 기계들을 파괴할 것입니다."
 trinity_events_nagisa.17.a: "나쁘지 않아."
 trinity_events_nagisa.18.t: "나기사-아코 회담의 준비"
 trinity_events_nagisa.18.desc: "수행원은 꾸벅 고개를 숙이고 비단 퍼프를 손에 쥐었다. 원래부터 눈송이처럼 창백하던 나기사의 피부에 수행원이 파우더를 바르기 시작했다. 수행원의 손끝이 움직이며 키리후지 나기사라는 이름의 석고상을 빚어내는 사이, 호스트는 다른 생각을 하고 있었다.\n\n트리니티의 많은 이들은 여전히 에덴 조약에 대한 냉소적인 시선을 가지고 있었다. 하지만 역으로 '게헨나'이기에, 오히려 가장 믿을 수 있는 것이 아닌가. 나기사는 대전이 이전 총학생회장의 주선으로 게헨나의 대표를 만났을 때를 떠올렸다.\n\n범죄자들을 때려 잡는 삶만을 살아온 소라사키 히나가, 처음으로 국제 외교라는 것을 위해 현장에 나오느라 잘 하지 않는 화장을 하다 알코올 중독자처럼 두 볼이 발갛게 달아오르도록 블러셔를 발라온 모습, 자신은 여유롭게 넘겼지만, 총학생회장은 그 모습을 보며 얼마나 웃어서 분위기를 망가뜨렸던가.\n\n게헨나는 '정치'라면 몰라도 '정치질'은 알지 못하는 이들이었다. 거짓으로 자신들을 꾸미기보다는 온천을 터트리는 한이 있어도 자신이 하고 싶은 메시지를 직설적으로 던지고, 자신을 초콜릿 상자처럼 꾸미는 법조차 모르는 사람들의 땅. 그래서, 대전이 이후 키리후지 나기사는 점점 게헨나가 마음에 들어 가고 있었다. 적어도 세이아에게 총을 겨누도록 사주했을 파테르, 그리고 세이아의 죽음까지도 이용하던 그 자들과, 선도부장은 달랐으니까.\n\n모든 외출 준비가 끝난 뒤, 나기사는 자리에서 일어났다. 타인을 믿는다. 적어도 그러려고 노력은 한다. 대전이 이후 점점 어려워져가는 이 신념을 지키기 위해, 어쩌면 트리니티 안이 아닌 바깥을 돌아보아야 할 필요가 있을지도."
 trinity_events_nagisa.18.a: "협상이 다가온다."
 trinity_events_nagisa.19.t: "나기사-아코 회담"
 trinity_events_nagisa.19.desc: "대전이 이전처럼 소라사키 히나와 직접 마주 앉을 수 있었다면 더 기뻤겠지만, 아마우 아코가 직접 에덴까지 찾아온 것만으로도 큰 외교적 성과였다. 소라사키 히나와 아마우 아코는 분명 다른 성격의 관료였지만, 아코 쪽이 인간적으로는 더욱 '재미있었다'.\n\n\"그러니까, 히나 부장님이 개머리판으로 딱! 하니까, 헬멧단 조무래기 놈의 머리가 깡-! 하고...\"\n\n미카가 여기 있었다면 '아이스브레이킹' 이라고 했겠지. 아코는 아이스브레이킹에는 굉장한 재능을 가지고 있었다. 정말, 케이크를 앞에 늘어놓고 떠드는 미카를 떠올리게 하는 소녀였다. 파테르 분파만이 아니라, 필리우스나 상투스 분파의 어느 임원들도 나기사 앞에서 이렇게 떠들 수는 없었다.\n\n'미카 씨...와 닮았다. 그렇게 말한다면 화내시겠지.'\n\n나기사가 직접 이야기 주제를 본론으로 돌리지 않으면, 언제까지라도 아이스브레이킹에서 벗어나지 못할 것 같다. 그런 점까지도 아코는 미카와 닮아 있었다. 나기사는 홍차를 한 모금 마시며, 추억이 깃든 미소를 지었다. \"히나 씨에 대한 이야기도 감사했습니다만, 오늘은 두 학원간의 공동 치안 관리에 대한 논의를 시작하고 싶군요.\"\n\"아앗, 그렇죠. 공동 치안... 후후. 저는 전혀 잊어버리지 않고 있었답니다. 그저 복잡한 회담 전에 목을 좀 푸느라고...\"\n\n그 아무렇지 않아 하는 태도까지도 재미있어서, 나기사는 웃음을 터트리고 말았다."
 trinity_events_nagisa.19.a: "회담은 잘 풀렸다."
 trinity_events_nagisa.20.t: "아코-나기사 회담"
 trinity_events_nagisa.20.desc: "대전이 이전처럼 키리후지 나기사와 함께 마주 앉을 수 있었다면 더 좋았겠지만, 대전이 이후 위험해진 치안 문제, 그리고 판데모니움 소사이어티에 대한 견제 등의 문제로 히나는 에덴을 직접 방문할 수 없었다. 키리후지 나기사는 선도부에 '에덴 조약 재추진을 위해, 우선 두 학원의 공동 치안 조직을 만들자'는 제안을 보냈다. 그 제안에 대한 전권을 지고 떠난 것이 아마우 아코였다.\n\n'회담은 잘 풀렸습니다. 두 학원 공동의 이익을 보장하는 협상이 완료되었습니다.'\n\n아코는 그렇게 답장했다. 실제로 나쁘지 않은 내용이었다. 동시에, 소라사키 히나는 아마우 아코가 보낸 외교 문서를 통해 키리후지 나기사의 의도를 읽어낼 수 있었다. '판데모니움 소사이어티를 철저히 배제한 채, 선도부와 트리니티 두 조직만이 공동으로 연합전선을 펼친다.'\n\n나기사의 문서에서, 판데모니움 소사이어티는 정의실현부가 치안을 지켜주는 구역에 포함되지 않았다. 선도부가 판데모니움 소사이어티 지역에서도 치안을 유지하는 것과는 달랐다. 마치, 게헨나의 영역은 히나의 직할령만 해당된다는 것처럼.\n\n어쩌면 키리후지 나기사는 게헨나를 둘로 분할해, 차례대로 침공해 점령하려는 것은 아닐까? 대전이 이전부터 보여 왔던 나기사의 선의를 믿고 싶다는 마음, 그리고 대전이 이후 늘어난 소라사키 히나의 불안이 섞여... 히나는 그 날 밤이 끝날 때까지 잠들지 못했다."
 trinity_events_nagisa.20.a: "우리는 정말 에덴 조약을 맺어야 하는 걸까?"
 trinity_events_nagisa.21.t: "오후의 티타임"
 trinity_events_nagisa.21.desc: "나기사는 이러한 상황을 썩 반기지 않았다. 사태 이후 발생한 트리니티의 위기는 좀처럼 진정될 기미가 보이지 않았다. 트리니티의 학생들은 사태의 영향을 직접적으로 받았다. 대부분의 성향이 급진적으로 변화했고, 티파티를 아무 일도 하지 않는 자들로 경멸하며 극단으로 치닫는 이들이 나타났다. 그들은 파테르 분파처럼 폭력적인 사상을 숭배하며 그 대의에 참여하려 했다.\n\n특히 파테르 분파와 그 소수 분파들이 문제였다. 파테르 분파는 이전부터 주장해온 폭력적인 사상을 더욱 노골적으로 내세우기 시작했다. 미카는 딱히 그들을 제지하지 않았다. 오히려 그들의 사상에 동참하고 있는지도 모른다. 이대로 간다면 추후에 파테르 분파가 상투스 분파의 호스트 자리를 위협하고 정권을 차지해 트리니티의 모든 것을 무너뜨릴 것이다. 그리고 그 중앙에는... 아니. 아니야. 그렇게 둬서는 안 돼.\n\n오후에 마시는 차 한 잔은 특별했다. 여유 있게 마시는 차는 쌓인 피로를 풀어주었다. 나기사는 찻잔을 들고 창밖을 바라보며 생각에 잠겼다. 다음 호스트는 당연하게도 상투스 분파의 세이아다. 이는 불변이다. 유리조노 세이아는 꽤나 믿을 만하다. 어느 정도 예지 능력을 가진 그녀라면 트리니티의 모든 문제를 해결할 수 있을 것이다. 그녀의 호스트 임기 내에 해결하지 못한다면 다음 호스트는 필리우스 분파에서 맡게 되니, 길더라도 이 위기는 반드시 해결할 수 있다. 나기사는 그렇게 믿고 싶었다. 아니, 그렇게 되어야만 했다."
 trinity_events_nagisa.21.a: "그리고 사건은 예상하지 못한 곳에서 터지기 마련이다."

 # 나기사 외교 이벤트
 trinity_events_nagisa_diplomacy.1.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.1.desc: "공동 치안 조직 협상은 그저 시작일 뿐이었습니다. [TRM.GetLeader] 측은 [GEH.GetLeader] 측에게 본격적으로 '에덴 조약의 재협상'을 제안했습니다. 이는 [TRM.GetNameDef] 정부와 [GEH.GetNameDef] 정부 사이의 불가침조약 및 상호 독립 보장을 의미하는 협상입니다. 우리가 여기에 동의한다면, 협상의 세부적인 내용을 검토하기 위하여 실무자 회의가 이어질 예정입니다."
 trinity_events_nagisa_diplomacy.1.a: "협상을 시작하자"
 trinity_events_nagisa_diplomacy.1.b: "아니, 나는 나기사의 의도를 짐작할 수가 없어..."
 trinity_events_nagisa_diplomacy.2.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.2.desc: "우리의 협상 제안을 [GEH.GetLeader] 측이 받아들임에 따라, 에덴 조약을 맺기 위한 실무자 협상이 시작되었습니다. 판데모니움 소사이어티, 그리고 파테르 분파는 이 협상을 방해하기 위하여 모든 노력을 다할 것입니다. 결코, 물러나서는 안 됩니다. 트리니티와 게헨나 두 학원의 평화를 지킬 수 있는 것은 이제는 [ROOT.GetLeader] 밖에 없습니다."
 trinity_events_nagisa_diplomacy.2.a: "협상을 시작하자"
 trinity_events_nagisa_diplomacy.3.t: "[TRM.GetAdjective]-[GEH.GetAdjective] 협상"
 trinity_events_nagisa_diplomacy.3.desc: "[ROOT.GetName] 정보부는 트리니티와 게헨나 선도부 사이에서 에덴 조약을 다시 추진하기 위한 움직임을 감지했습니다. 이미 실무자들이 협상을 시작했으며, 두 학원 사이의 상호 독립 보장 및 불가침 조약을 위한 세부 조항들을 정리하고 있습니다.\n\n만약 에덴 조약이 정말로 맺어진다면, 우리는 트리니티와 선도부 두 세력의 연합된 힘과 맞서 싸워야만 합니다. 그것은 우리 안보에 있어서는 재앙이나 다름 없는 상황입니다. 공작원들을 이용해 어떠한 대가를 치러서라도 이 협상을 막아내야만 합니다. 반드시!"
 trinity_events_nagisa_diplomacy.3.a: "에덴 동산의 결말이 어떻게 끝났는지 알려주마"
 trinity_events_nagisa_diplomacy.4.t: "에덴 조약 실패"
 trinity_events_nagisa_diplomacy.4.desc: "누가 범인이었을까요? 파테르 분파의 소행일 수도 있습니다. 어쩌면 판데모니움 소사이어티의 공작원들이 벌인 소동일 수도 있겠죠. 우리들의 협상은 이상할 정도로 지지부진했습니다. 두 학원 사이를 오가는 동안 서로를 비방하는 가짜 뉴스들이 계속해서 퍼졌고, 게헨나와 트리니티의 일반 대중들은 두 학원의 평화 조약을 방해하는 시위를 계속해서 벌였습니다.\n\n결국 협상 장소에서 사제 폭탄이 폭발하는 기록적인 사건을 통해 에덴 조약은 공식적으로 중단되었습니다. 트리니티와 게헨나 선도부의 상층부는 테러의 주범이 서로가 아니라는 것을 알고 있었기에, 테러 이후 서로를 위로했습니다. 그러나 이 테러로 인해 중단된 협상을 다시 재개할 수는 없었습니다.\n\n언젠가 두 학원이 다시 평화를 위해 손을 잡을 날이 올 수 있을 수도 있습니다. 하지만, 그게 오늘은 아닌 것 같습니다."
 trinity_events_nagisa_diplomacy.4.a: "절망적이다..." # 4~5 트리니티/선도부
 trinity_events_nagisa_diplomacy.6.a: "아주 멋진 날이야, 그렇지 않나?" # 6 판데모니움 소사이어티
 trinity_events_nagisa_diplomacy.7.t: "[GEH.GetName]의 협상 거부"
 trinity_events_nagisa_diplomacy.7.desc: "[GEH.GetLeader]와 우리 사이의 우정에 어떤 문제가 있었던 것일까요? 놀랍고도 충격적이게도, [GEH.GetLeader] 측은 경찰 치안 조직의 공유 이상으로 에덴 조약을 확장하는 것을 거부했습니다. 이 조약이 두 학원 지도자들의 우정과 선의로 이루어졌다는 점에서, 그 선의가 무너진 지금 협상을 다시 시작할 수 있는 방법은 존재하지 않습니다."
 trinity_events_nagisa_diplomacy.7.a: "이거, 멀티플레이 맞죠? AI 히나는 절대 이 선택지를 누르지 않는데."
 trinity_events_nagisa_diplomacy.8.t: "에덴 조약 성공"
 trinity_events_nagisa_diplomacy.8.desc: "오늘은 [GEH.GetName] 측과 [TRM.GetName] 측 양쪽에 최고의 날입니다. 총학생회장이 남긴 에덴 조약이 결실을 맺고, 공식적으로 두 지도자들에 의하여 서명되면서 두 학원은 서로의 항구적 평화, 그리고 [GEM.GetName] 측과의 공동 전선을 꾸리기로 결정했습니다. 게헨나와 트리니티 두 학원의 오랜 라이벌 관계에도 불구하고 두 학원의 이성적인 지도자들은 서로의 차이점을 줄여 나갈 수 있는 가장 좋은 방법을 찾아낸 것 같습니다.\n\n물론 이 소식은 [GEM.GetLeader] 측에게는 절망적인 이야기일 것입니다. [GEM.GetName] 정부는 이제 고립되었으며, [GEM.GetLeader]의 '게헨나 통일'이라는 꿈은 실현에서 아주 멀어진 것으로 보입니다."
 trinity_events_nagisa_diplomacy.8.a: "우리의 우정에 건배." # 8~9 트리니티/선도부
 trinity_events_nagisa_diplomacy.10.a: "게헨나의 배신자 놈들!" # 10 판데모니움 소사이어티
 trinity_events_nagisa_diplomacy.11.t: "하누마 라인"
 trinity_events_nagisa_diplomacy.11.desc: "명백하게 대전이 직전 판데모니엄 소사이어티의 의장이었던 하누마 마코토의 이름을 따서 지어진 이 요새망 계획은, 트리니티의 [TRM.GetLeader] 측으로부터 전달되었습니다. 트리니티는 [GEM.GetName]의 전쟁 기계들이 동방으로 침공해 올 날이 가까워지고 있다는 것을 우려합니다. 그녀의 방어 계획인 하누마 라인은 우리의 중요 거점 지역에 요새망을 설치해, [GEM.GetLeader]의 침공이 시작되었을 때, 그들의 공격이 거점 지역에서 돈좌되도록 고안되었습니다. 비록 이 요새망 프로젝트는 상당한 예산과 시간이 소모될 것으로 보이며, 실전성이 있는지 여부도 다소 논쟁거리일 것으로 보입니다. 하지만 논의할 가치는 있습니다."
 trinity_events_nagisa_diplomacy.11.a: "이해했어."
 trinity_events_nagisa_diplomacy.12.t: "연방제 통일 가능성?"
 trinity_events_nagisa_diplomacy.12.desc: "[GEM.GetName] 측이 멸망한 이후, 남은 것은 에덴 조약의 성공으로 인해 깊은 우정을 쌓게 된 [GEH.GetName] 측과 [TRM.GetName] 측 두 개의 세력 뿐입니다. 우리는 지금의 에덴 조약을 더욱 확장시켜 트리니티와 게헨나 사이의 연방제 통일을 이루어 낼 수도 있지 않을까요?"
 trinity_events_nagisa_diplomacy.12.a: "협상을 시작한다."
 trinity_events_nagisa_diplomacy.12.b: "아니, 분열된 채 분리하는 게 낫다."


 trinity_news_events.1.t: "유리조노 세이아 피습 사건"
 trinity_news_events.1.desc: "상투스 분파의 수장 유리조노 세이아가 취임식 연설 도중 괴한의 총격을 받아 의식불명 상태에 빠졌습니다. 괴한은 현장에서 즉시 제압되었으며, 삼엄한 경호 속에 병원으로 이송되고 있습니다.\n\n사건 직후 티파티가 긴급히 소집되어 차기 호스트 선정을 논의하고 있으며, 현재 파테르 분파의 미소노 미카가 차기 호스트로 지명될 가능성이 높다는 관측이 나오고 있습니다.\n\n최근 두 달간 이어진 사건들은 트리니티 내부의 정세를 극도로 불안정하게 만들었고, 이번 사건은 그러한 불안정성이 폭발한 결과로 보입니다. 상투스 분파 내부의 갈등이 본격화되면서, 트리니티의 정치적 혼란은 더욱 심화될 전망입니다."
 trinity_news_events.1.a: "이런 맙소사!"
 trinity_news_events.1.b: "야만적이군!"
 trinity_news_events.1.c: "저들은 혼란스러워 보인다."
 trinity_news_events.2.t: "미소노 미카의 트리니티 장악"
 trinity_news_events.2.desc: "야만적인 유리조노 세이아 암살 사건을 기점으로 불이 붙은 트리니티 종합학원의 정치적 혼란은 미소노 미카가 호스트직을 맡으며 일단락되었습니다. 그녀는 호스트 권한을 확보하자마자 일련의 급진적인 개혁을 단행하였고, 결국 자신의 통치를 정당화하고 영구적인 집권을 보장하는 법안을 통과시키며 티파티 삼두정 체제의 종말을 고하였습니다.\n\n그러나 키보토스의 다른 학원들에서는 이를 축하하는 분위기를 찾아보기 어렵습니다. 특히 미소노 미카의 끊임없는 반게헨나적 발언으로 인해 게헨나는 극도로 절제된 반응을 보이고 있습니다."
 trinity_news_events.2.a: "새로운 트리니티가 부상한다!"
 trinity_news_events.2.b: "키보토스 질서가 뒤흔들리겠군..."
 trinity_news_events.2.c: "이게 우리에게 뜻하는 바가 무엇이지?"
 trinity_news_events.2.d: "놀라운 전개군."
 TRN_trinity_order_state_threat_name: "미소노 미카의 쿠데타"
 trinity_news_events.3.t: "트리니티에서 진행된 아이돌 라이브 공연"
 trinity_news_events.3.desc: "매년 개최되는 트리니티 사육제, 그중에서도 많은 이들의 기대를 모으는 '아이돌 라이브 공연'이 오늘 성황리에 열렸습니다. 그러나 올해의 무대는 그 어느 때보다도 특별했습니다. 오늘, 관객들 앞에 나타난 것은 '앤틱 세라핌'이라는 새로운 그룹이었습니다. 이들은 구호기사단장 아오모리 미네, 시스터후드 수녀원장 우타즈미 사쿠라코, 그리고 시스터후드 소속 이오치 마리로 구성되어 있습니다.\n\n결성 초기, 이들은 여러 문제와 정치적 위기에 직면했으나, 이오치 마리가 이를 해결하는 데 앞장섰고, 결국 무대는 성공적으로 마무리되었습니다. 트리니티의 학생들은 뜨거운 환호로 이들의 공연을 맞이했고, 화려한 무대와 함께 아이돌 이벤트는 성대한 막을 내렸습니다."
 trinity_news_events.3.a: "나도 사진 한 장 나눠줘!"
 trinity_news_events.4.t: "에덴 협정의 형성"
 trinity_news_events.4.desc: "미소노 미카가 정권을 장악한 이후, 그녀는 트리니티를 다시 한 번 세계 무대의 중심으로 끌어올리고 패권을 되찾고자 ‘에덴 협정’을 선언했습니다. 이 협정은 키보토스 연합에 대응하는 군사적 동맹으로, 트리니티가 정치적 혼란을 수습하고 다시금 패권주의적 야망을 드러내기 시작했음을 의미합니다.\n\n트리니티의 외교관들은 에덴 협정을 단지 상호 협력을 위한 조약이라고 소개하고 있지만, 실상은 대전이 사태 이후 위축된 영향권을 회복하고 확장하려는 전략적 조치로 해석됩니다. 트리니티의 최근 팽창주의적 움직임을 감안하면, 사태 이전의 광범위한 지배권을 무력으로 복원하려는 의도가 점점 더 분명해지고 있습니다."
 trinity_news_events.4.a: "우리는 더욱더 강해진다!"
 trinity_news_events.4.b: "새로운 위협이다."
 trinity_news_events.4.c: "우리는 놈들을 꺾을 것이다!"
 trinity_news_events.4.d: "새로운 패권의 부상인가?"
 trinity_news_events.5.t: "트리니티의 게헨나 침공"
 trinity_news_events.5.desc: "수백 년간 트리니티와 게헨나는 표면적인 평화를 유지해왔지만, 진정한 화해는 없었습니다. 트리니티는 과거 게헨나가 저질렀던 행위를 결코 잊지 않았고, 그에 대한 증오와 복수심은 세월과 함께 더욱 깊어졌습니다.대전이 사태 이후 미소노 미카가 정권을 장악하면서, 회의론자들의 우려는 현실이 되었습니다.\n\n수년간 이어진 보복주의의 확산과 군비 증강 끝에, 마침내 미소노 미카는 전시 상태를 공식 선언하며 트리니티의 군대를 전선으로 내보냈습니다. 이에 맞서 게헨나의 기갑부대가 반격에 나섰지만, 트리니티의 포격으로 인해 진격은 쉽지 않은 상황입니다."
 trinity_news_events.5.a: "악마들을 정벌하라!"
 trinity_news_events.5.b: "이 전쟁으로 키보토스에 그림자가 드리웠다..."
 trinity_news_events.5.c: "전게헨나여 단결하라!"
 trinity_news_events.5.d: "싸우게 내버려 둬라..."
 trinity_news_events.6.t: "트리니티에서 발생한 독일인 봉기"
 trinity_news_events.6.desc: "오늘 오후, 트리니티 중앙구에서 약 1만 명의 시위자들이 거리로 쏟아져 나오며 시작된 독일인 봉기가 트리니티 전역으로 확산되고 있습니다. 많은 독일인들이 '도이칠란트, 도이칠란트 위버 알레스'를 외치며 거리를 행진하고 있으며, 벽과 다리에는 NSDAP의 슬로건과 만자 문양이 낙서로 남겨지고 있습니다. 트리니티의 지배에 반발하는 이들은 파업과 시위로 저항을 이어가고 있습니다.\n\n광범위하게 벌어지는 시위와 시국 불안 속에서도, 티파티는 정의실현부에 직접 진압 명령을 하달했고, 이에 따라 봉기 자체는 조속히 진압될 것으로 보입니다."
 trinity_news_events.6.a: "전부 진압하라!"
 trinity_news_events.6.b: "삼위일체의 끝인가?"
 trinity_news_events.6.c: "저들이 분열 한다면..."
 trinity_news_events.6.d: "이게 그들의 최후일까?"
 trinity_news_events.7.t: "키리후지 나기사의 트리니티 장악"
 trinity_news_events.7.desc: "야만적인 유리조노 세이아 암살 사건을 기점으로 불이 붙은 트리니티 종합학원의 정치적 혼란은 키리후지 나기사가 호스트직을 맡으며 일단락되었습니다. 나기사는 필리우스 분파와 여러 분파들 사이의 조화를 지켜나가겠다는 의지를 밝혔습니다.\n\n하지만 나기사 정부는 완전히 안정되지 않은 상태입니다. 경쟁자인 미소노 미카가 세이아 암살 사주 혐의로 기소된 이후에도 그녀의 파테르 분파는 계속 정부에 반대하고 있으며, 필리우스 분파의 정국 장악은 완전하지 않습니다.\n\n나기사는 정권 장악 이후 국내 안정에 집중하면서, 대외적으로는 게헨나와의 에덴 조약을 계속 추진해 나갈 것으로 보입니다."
 trinity_news_events.7.a: "'두 번째 트리니티'는 없다."
 trinity_news_events.7.b: "트리니티는 합리적인 대안을 찾았다."
 trinity_news_events.7.c: "나쁘지 않은 상대야."
 trinity_news_events.7.d: "분파가 참 많이도 있군!"

