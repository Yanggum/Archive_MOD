 TRN_poland_trinity_border_dispute_ns_desc: "This conflict stemmed from a misunderstanding. A captured German officer claimed Danzig was German territory. Trinity leadership took this as fact and invaded Poland, which was at war with the Soviets, to occupy [807.GetName] and [86.GetName]. Trinity continues to refuse diplomatic solutions."
