# Nagisa Constitution
 TRM_nagisa_constitution_cat: "Nagisa Constitution"
 TRM_nagisa_constitution_cat_desc: "Order has been restored to Trinity, and §GKirifuji Nagisa§! has become a more powerful Host than ever before. But beyond the small victories achieved so far, Nagisa seeks to create a new framework for Trinity that will endure for the next 100 years. Filius knows that Trinity cannot survive solely as a school-state like those in Kivotos after the Great War. However, just as we reject radical claims like the §YSecond Trinity§!, it is difficult for us to achieve an overly adventurous constitutional revision.\n\nFilius will keep its right foot on reality while stepping forward with its left foot toward the ideal. We are preparing the promulgation of the §YNagisa Constitution§!, which accommodates both the idealistic future of our alma mater and the realistic demands of the factions. This new constitution will surely determine the next 100 years of Trinity.\n\n£white_dot Special Rule: Some radical constitutional provisions that deviate from Trinity's conservative social traditions can only be selected if §Crequirements§! are met.\n"
 TRM_nagisa_constitution_datasite: "Expected Effects of the §GNagisa Constitution§!\n-$political_power_factor_tt$ [?TRM_nagisa_constitution_political_power_factor|=+%2]\n-$training_time_factor_tt$ [?TRM_nagisa_constitution_training_time_factor|=-%2]\n-$production_factory_max_efficiency_factor_tt$ [?TRM_nagisa_constitution_production_factory_max_efficiency_factor|=+%2]\n-$army_org_factor_tt$ [?TRM_nagisa_constitution_army_org_factor|=+%2]\n-$army_morale_factor_tt$ [?TRM_nagisa_constitution_army_morale_factor|=+%2]\n-$production_lack_of_resource_penalty_factor_tt$ [?TRM_nagisa_constitution_production_lack_of_resource_penalty_factor|=+%2]\n"
 ## Constitution Structure = Kaiserreich Germany SPD Constitution focuses moved to decisions
