 TRM_host_mine: "The Green Host\n§gHer conviction to provide relief rather than join the Tea Party was broken by external factors. Mine is gradually succumbing to reality and introduces herself as 'Head of the Johannine Faction' instead of 'Captain of the Remedial Knights.'§!"
 TRM_host_ako: "The Blue Host\n§gWhile interested in expanding intelligence and bureaucracy, Ako respects Trinity's noble oligarchy and supports the status quo where the new bureaucratic class cannot interfere in politics.§!"
