 TRN_army_ns: "Trinity Ground Forces"
 TRN_army_ns_desc: "Hundreds of years ago, Trinity's ground forces developed rapidly through 'internal wars,' leading to the growth of doctrine and tactics. Though that turbulent era is forgotten, the lessons remain."
 TRN_navy_ns: "Trinity Navy"
 TRN_navy_ns_desc: "The concept of a 'navy' may be unfamiliar, but we are not behind other academies. We have awakened many to the importance of the sea."
 TRN_airforce_ns: "Trinity Air Force"
 TRN_airforce_ns_desc: "When the Mother of Aviation opened a new horizon, we faced a paradigm shift. We fly with the belief that victory in the sky leads to victory on the ground."

 TRN_joint_security_organization_ns: "[GEH.GetAdjective]-[TRM.GetAdjective] International Security Commission"
 TRN_joint_security_organization_ns_desc: "Created for judicial and security cooperation between Trinity and the Gehenna Prefect Team. It directs joint investigations when suspects cross academy borders."
 TRN_military_mission_generic_ns: "[TRM.GetAdjective] Military Advisory Group"
 TRM_JTF_intelligence_ns: "Justice Task Force"
 TRM_JTF_intelligence_ns_desc: "Assigned counter-intelligence roles to the JTF and expanded its scale. As a unit following Tea Party orders, they will be our strongest sword."
 TRN_german_new_culture_order_modifier: "Germany's New Cultural Order"
 TRN_german_new_culture_order_modifier_desc: "A new cultural order is rising. German society ruled by Trinity will change under our influence, for better or worse."
 TRN_german_new_culture_order_modifier_change: "§Y$TRN_german_new_culture_order_modifier$§! modifier"
 TRN_german_new_religion_ns: "Sisterhood-led Conversion Plan"
 TRN_german_new_religion_ns_desc: "Budgets are being invested to convert locals to the Trinity faith."
 TRN_german_harmony_religion_ns: "Religious Propaganda Plan"
 TRN_german_harmony_religion_ns_desc: "Propaganda claiming the Trinity faith and local faiths serve the same God in different ways is being implemented."
 TRN_trinity_crusade_ns: "Trinity Crusade"
 TRN_trinity_crusade_ns_desc: "To spread the faith, the Crusaders have sworn to fight atheists and pagans to protect Trinity's order."
 TRM_nagisa_constitution_modifier: "Nagisa Constitution"
 TRM_nagisa_constitution_modifier_desc: "Created under Nagisa Kirifuji's leadership, this constitution will determine Trinity's direction for the next 100 years."
 TRN_first_but_reworked_ns: "Liberal Oligarchy Ideal"
 TRN_first_but_reworked_ns_desc: "Cultural freedom permitted under an authoritarian oligarchy. This is the result of a long compromise by the Filius faction to lead national reform while preserving the 'First Trinity' tradition."
 TRN_new_and_free_trininy_culture_ns: "New Era Trinity Culture"
 TRN_new_and_free_trininy_culture_ns_desc: "Trinity's culture developed through exchange and became an object of envy for many academies."
 TRN_bureau_of_railways_ns: "Trinity Bureau of Railways"
 TRN_bureau_of_railways_ns_desc: "A special project by the railway bureau to transport more troops to the front."
 TRN_pater_hate_naginagi_ns: "Filius-Pater Conflict"
 TRN_pater_hate_naginagi_ns_desc: "The conflict has intensified. Pater incites German workers to strike and encourages Trinity students to refuse military service. They strongly reject Nagisa's pacifist and pro-Gehenna ideas, hindering the government under Mika Misono's leadership.\n\nFilius executives will not forget this, even after the Gehenna conflict is over."
 TRN_pater_hate_naginagi_ns_tt: "\nWorsens upon signing the Eden Treaty: National Spirit effect worsens if the §YEden Treaty§! is §Ysuccessful§!."
 TRN_pater_hate_naginagi_remove_ns_tt: "\nRemoved during war with Gehenna: During war with §Y[GEM.GetName]§! or §Y[GEH.GetName]§!."
 TRN_pater_hate_naginagi_trigger_tt: "Possesses the §Y$TRN_pater_hate_naginagi_ns$§! National Spirit."
 TRN_sending_missionaries_ns: "Influence of the Trinity Faith"
 TRN_sending_missionaries_ns_desc: "Sisterhood missionaries spread faith that encourages submission to tradition and order. Believers will view obedience to [ROOT.GetLeader] and labor as the highest virtues."
 TRN_attack_pater_ns: "Prosecution of Pater"
 TRN_attack_pater_ns_desc: "Indiscriminate prosecution of Pater executives weakens their sabotage but also brings political chaos."
 TRN_connection_to_vigilante_ns: "Vigilante Support"
 TRN_connection_to_vigilante_ns_desc: "Vigilantes are apprehending German workers participating in strikes."
 TRN_seia_host_ns: "Seia Yurizono"
 TRN_seia_host_ns_desc: "After the Sisterhood coup, Sakurako reinstated Seia as a symbol of Trinity. However, Seia is merely a symbolic leader who cannot make any political decisions."
 
