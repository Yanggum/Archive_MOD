 TRN_poland_trinity_border_dispute_ns: "트리니티-폴란드 갈등"
 TRN_poland_trinity_border_dispute_ns_desc: "트리니티와 폴란드의 갈등은 사소한 오해에서 비롯되었습니다. 트리니티가 독일군 소탕 작전을 벌이는 과정에서 포로로 잡힌 독일군 장교가 \"단치히도 독일의 영토다\"라고 말했습니다. 그러나 트리니티 지도부는 이를 사실로 오해했고, 소련과 전쟁 중이던 폴란드를 침공해 [807.GetName]와 [86.GetName]을 점령했습니다. 이에 폴란드는 지속적으로 외교적 항의를 하고 있지만, 트리니티는 외교적 해결을 완강히 거부하고 있습니다."
