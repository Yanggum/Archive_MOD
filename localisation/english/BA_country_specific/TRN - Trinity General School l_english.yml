 # Military Focus
 TRN_increase_military_budget: "Pass [GetYear] Defense Budget"
 TRN_increase_military_budget_desc: "Modernizing the military rapidly requires immense funding. While the defense budget has previously been set only to maintain current levels, the persistent threats following the war necessitate a significant increase to prepare for what is to come."
 TRN_advanced_armor: "Advanced Armor"
 TRN_advanced_armor_desc: "Steel and grace, combined into a single wall of defense. Our tea will remain undisturbed even amidst the roar of engines."
 TRN_army_review: "Ground Forces Improvement"
 TRN_army_review_desc: "The experience of war against the German army has clearly shown that the nature of warfare has changed from long ago. To wage modern war in its true sense, the old ways no longer suffice. We must reform the previous command that followed only offensive doctrines. In the face of rising global tensions, there is no room for hesitation in modernizing our military."
 TRN_small_attack_groups: "Utilization of Small Attack Groups"
 TRN_small_attack_groups_desc: "The battlefield is vast, but the personnel to be deployed are precious. However, by flattening the battlefield with relatively inexpensive shells and forcing attrition upon the enemy, small attack groups can then be deployed to force the enemy into a grueling defensive struggle."
 TRN_sophisticated_artillery_equipment: "Development of Sophisticated Artillery Equipment"
 TRN_sophisticated_artillery_equipment_desc: "Technologies essential for artillery, such as geodetic equipment, have regressed significantly in recent years. To ensure our precious troops are not sacrificed in vain, progress in artillery technology is required."
 TRN_research_armor_doctrine: "Research New Armor Doctrine"
 TRN_research_armor_doctrine_desc: "As times change, the aging Trinity armor doctrine can no longer adapt to new environments. To maneuver these armored divisions quickly and efficiently, research into a new armor doctrine is essential."
 TRN_general_staff_reform: "General Staff Reform"
 TRN_general_staff_reform_desc: "A cluttered desk leads to a cluttered mind. Let us reorganize our command structure with the same precision we use to plan a garden party."
 tooltip_TRN_general_staff_reform: "In 1 year, we will receive the following:"
 TRN_hammer_of_gideon: "Hammer of Gideon"
 TRN_hammer_of_gideon_desc: "Break the enemy's spirit with a single, crushing blow. May the sound of our advance be as thunder to the unrighteous."
 TRN_tactical_operational_strategic_training: "Tactical, Operational, and Strategic Training"
 TRN_tactical_operational_strategic_training_desc: "Knowing how to fire a gun is one thing; knowing where to stand to make it matter is quite another."
 TRN_mission_command: "Mission Command"
 TRN_mission_command_desc: "Trust in the initiative of our field officers. A true Trinity student knows her duty even when the tea grows cold and the orders are distant."
 TRN_doctrine_established: "Doctrine Established"
 TRN_doctrine_established_desc: "Our path is clear, our methods refined. Chaos shall find no purchase in our ranks."
 TRN_escort_force_expansion: "Expansion of Escort Forces"
 TRN_escort_force_expansion_desc: "No supply line shall be left unguarded. Protecting our logistics is as vital as protecting our honor."
 TRN_mechanized_division: "Mechanized Infantry"
 TRN_mechanized_division_desc: "Why march through the mud when steel can carry us? Speed and protection, delivered with Trinity efficiency."
 TRN_armored_corps_training_center: "Armored Corps Training Center"
 TRN_armored_corps_training_center_desc: "The smell of grease and the roar of engines... and perhaps a small spot for afternoon tea in the barracks."
 TRN_customized_production_method: "Customized Production Method"
 TRN_customized_production_method_desc: "Every piece of equipment should be as meticulously crafted as a custom-tailored uniform."
 TRN_mass_production_line: "Mass Production Line"
 TRN_mass_production_line_desc: "Quantity has a quality of its own, provided we do not compromise on the standards of Trinity."
 TRN_vanguard_armed: "Vanguard Armored Units"
 TRN_vanguard_armed_desc: "Let them be the spearhead that pierces the darkness. Untouchable, unstoppable, and impeccably maintained."
 TRN_deceive_your_enemy: "Deceive Your Enemy"
 TRN_deceive_your_enemy_desc: "The greatest victory is that which is won before the first shot is even fired. Appear weak when you are strong, and strong when you are weak."
 TRN_thousand_blades: "Thousand Blades Tactic"
 TRN_thousand_blades_desc: "The Thousand Blades Tactic is Trinity's unique approach. Much like a thousand blades inflicting wounds upon an enemy, it involves repeated small attacks to wear down the foe rather than a direct large-scale offensive, followed by the deployment of minimal divisions to annihilate them. The enemy will repeatedly retreat and see their comrades fall without even knowing why."
 TRN_kivotos_drone: "Military Use of Drones"
 TRN_kivotos_drone_desc: "Drones, which have been used only for civilian purposes until now, have recently been proven to be useful militarily as well. Their strength, particularly in being mass-produced with inexpensive materials, has been highlighted, leading to experiments for military utilization. Using drones may provide significant advantages in scouting and reconnaissance of the front lines and information delivery at a low cost."
 TRN_military_chaplain: "Military Chaplains"
 TRN_military_chaplain_desc: "We have gained great benefits through recent political links with the Sisterhood. If we expand the Sisterhood's role into the military sector, our soldiers can expect a significant morale boost through the Sisterhood's blessings and pre-battle worship."
 TRN_wages_of_sin_is_death: "The Wages of Sin is Death"
 TRN_wages_of_sin_is_death_desc: "A grim reminder for those who oppose us. Let our firepower be the final judgment upon the unrepentant."
 TRN_kivotos_automaton: "Kivotos Automaton"
 TRN_kivotos_automaton_desc: "Cold steel and tireless circuits. When the students need rest, the machines shall keep the watch."

 TRN_military_factory_maintenance: "Reorganization of Munitions Production Lines"
 TRN_military_factory_maintenance_desc: "The current status of weapon production is nothing short of a disaster. The aftermath of the Great War still lingers. Production systems are often disconnected, obsolete, or both, which is not a condition under which a modern army can fight. This system must be thoroughly reorganized so that soldiers can secure weapons to face Trinity's enemies."
 TRN_igfarben: "Confiscation of IG Farben Assets"
 TRN_igfarben_desc: "In the regions of [1104.GetName] and [65.GetName], the legacy of the German conglomerate IG Farben remains. Regardless of what they say, these assets are crucial. They are core facilities capable of producing and supplying key items in wartime. By utilizing Kivotos' unique technology and integrating it with IG Farben's assets, high levels of energy efficiency can be achieved."
 TRN_industrial_chain: "Construction of Industrial Chains"
 TRN_industrial_chain_desc: "Simply declaring that existing factories must work for the ground forces is not enough. To expand the existing military-industrial complexes, we must begin the construction of an industrial chain—a network of state-run ammunition and weapon factories."
 TRN_assembly_line: "Assembly Line Production Method"
 TRN_assembly_line_desc: "Uniformity and speed. Each bolt tightened, each plate welded, all in perfect, rhythmic harmony."
 TRN_optimize_production_line: "Optimize Production Line"
 TRN_optimize_production_line_desc: "Waste is a sin. Let us trim the excess and ensure every scrap of material serves the Host's will."
 TRN_arsenal_support: "Support for Eden Arsenal"
 TRN_arsenal_support_desc: "Eden Arsenal is an academy-operated enterprise that produces Trinity's firearms. Most Trinity firearms are designed, assembled, and sold here. However, in line with the recently increased defense budget and production demand, we must support Eden Arsenal to expand its facilities."
 TRN_design_bureau_support: "Expand Eden Tank Design Bureau"
 TRN_design_bureau_support_desc: "German tank production facilities are quite interesting. For some reason, they disguised their tank production facilities as agricultural equipment plants. Securing these hidden production facilities and transferring them to the Trinity Tank Design Bureau will strengthen our armored forces."
 TRN_anti_tank_development: "Anti-Tank Guns"
 TRN_anti_tank_development_desc: "We are not the only ones focused on utilizing armor. Enemy nations will deploy their own armored units, and we must find ways to counter them. The development of anti-tank guns capable of penetrating and destroying tanks is the best solution, and we must pursue it."
 TRN_motors_support: "Acquisition of BMW Automobile Factory"
 TRN_motors_support_desc: "Fortunately, the automobile factory in the Thuringia region possessed facilities large enough to bring significant vitality to Trinity Motors. Furthermore, since the BMW company is currently undergoing a major crisis, we will be able to acquire it at a low price."
 TRN_rocket_technology: "Multiple Rocket Launchers"
 TRN_rocket_technology_desc: "While rockets are expensive and less accurate, vehicle-mounted rocket launchers have almost no recoil and allow vehicles to leave the battlefield immediately, making them an interesting alternative to field artillery due to their superior range and mobility. We should focus on research into multiple rocket launchers and deploy our first rocket artillery brigade."
 TRN_establish_army_research_center: "Establish [62.GetName] Research Center"
 TRN_establish_army_research_center_desc: "The development of modern aircraft and rockets requires a center dedicated solely to the research and development of both fields. As soon as the necessary infrastructure is built in Pomerania, it will fulfill this role appropriately."
 TRN_railway_guns: "'Railway Gun' Project"
 TRN_railway_guns_desc: "Railway guns are giant cannons capable of shattering fortresses, proposed and developed by the design bureau. By applying their railway gun technology and deploying guns capable of blowing up enemy fortresses, mobile units will be able to break through easily."

 TRN_control_of_baltic_sea: "Control of the Baltic Sea"
 TRN_control_of_baltic_sea_desc: "The Baltic Sea is vast, and total control over this expansive body of water is impossible. However, the Trinity Navy is intentionally setting impossible goals and striving to reach them. Frequent maritime patrols and securing control over the coastal areas alone will significantly enhance the safety of the coastline."
 TRN_expand_naval_facilities: "Large-scale Shipyard Expansion"
 TRN_expand_naval_facilities_desc: "Trinity has not invested sufficiently in shipyards. The military sector is notably underdeveloped. The few shipyards remaining in Trinity only know how to build luxury liners designed for opulence and entertainment. To solve this problem, we must focus our efforts on shipyard expansion, even if it takes time."
 TRN_creation_of_marine_corps: "Creation of the Marine Corps"
 TRN_creation_of_marine_corps_desc: "Fight to win, if you lose then die! Hei-ppa-ppa-ri-ppa! Hei-ppa-ppa-ri-ppa!"
 TRN_establish_the_naval_command: "Establish Naval Command"
 TRN_establish_the_naval_command_desc: "The sea is a fickle mistress, but with proper command, she shall carry our banners to every shore."
 TRN_improve_ship_industry: "Improve Shipbuilding Industry"
 TRN_improve_ship_industry_desc: "From the keel to the mast, every ship must be a masterpiece of engineering and Trinity pride."
 TRN_giant_ship_plan: "Giant Ship Plan"
 TRN_giant_ship_plan_desc: "Bigger is often better. Let us build vessels that cast shadows over the very waves themselves."
 TRN_high_seas_fleet: "High Seas Fleet"
 TRN_high_seas_fleet_desc: "Our ambitions are not limited by the horizon. The High Seas Fleet will ensure Trinity's influence reaches across the oceans."
 TRN_construct_aircraft_carriers: "Construct Aircraft Carriers"
 TRN_construct_aircraft_carriers_desc: "Constructing carriers... well, they say carriers are dry land on the water. Except they're mostly on the water. Hahaha!"
 TRN_battleship_construction: "Battleship Construction"
 TRN_battleship_construction_desc: "Constructing battleships... well, they say battleships are dry land on the water. Except they're mostly on the water. Hahaha!"
 TRN_trade_interdiction: "Trade Interdiction"
 TRN_trade_interdiction_desc: "Choke the enemy's lifelines. Let nothing reach their ports but the sound of our sirens."
 TRN_cruiser_warfare: "Cruiser Warfare"
 TRN_cruiser_warfare_desc: "Swift, elegant, and deadly. Our cruisers will haunt the trade routes like ghosts of the sea."
 TRN_armored_assault_fleet: "Armored Assault Fleet"
 TRN_armored_assault_fleet_desc: "A fleet designed to strike hard and fast. No armor can withstand the concentrated fury of our naval guns."
 TRN_submarine_warfare: "Submarine Warfare"
 TRN_submarine_warfare_desc: "The silent hunters beneath the waves. Let the enemy fear what they cannot see."
 TRN_air_force_reinforcement: "Air Force Reinforcement"
 TRN_air_force_reinforcement_desc: "Modern battlefields cannot be won without dominating the skies. This is a lesson of war passed down from long ago. We must do our best to supplement the academy's lacking air power!"
 tooltip_has_completed_focus_TRN_ministry_of_industrial_development: "\nEffect activates upon completion of §Y$TRN_ministry_of_industrial_development$§! focus:"
 TRN_academy_aircraft_construction: "Establish Academy Aircraft Corporation"
 TRN_academy_aircraft_construction_desc: "Wings for the students, fire for the enemies. Our aircraft shall be as graceful as they are lethal."
 TRN_aviation_torpedoes: "Develop Aviation Torpedoes"
 TRN_aviation_torpedoes_desc: "A gift from the skies to the ships below. Precision and power, delivered from the clouds."
 TRN_prop_plane_recommission: "Recommission Propeller Planes"
 TRN_prop_plane_recommission_desc: "Our aeronautical technology has regressed significantly since the incident. It will take a long time to restore jet technology, so we must recommission propeller planes to fill the gap immediately."
 TRN_jet_technolgy: "Re-research Jet Technology"
 TRN_jet_technolgy_desc: "Breaking the sound barrier is only the beginning. Trinity's future lies in the speed of the jet engine."
 TRN_establish_of_training_system: "Re-establish Pilot Training System"
 TRN_establish_of_training_system_desc: "A plane is only as good as the student behind the stick. Let us refine their skills until they are one with the sky."
 TRN_flying_club: "Creation of the Flying Club"
 TRN_flying_club_desc: "The Flying Club is a club supported by the Tea Party to train pilots. It is a massive club equipped with a large number of trainers optimized for pilot training.\n\nAs a side note, since it's the 'Flying' club, jokes about 'delinquent' youth (flying youth) are circulating around Trinity Academy..."
 TRN_helicopter: "Rotary-wing Aircraft"
 TRN_helicopter_desc: "The vertical takeoff and landing of rotary-wing aircraft ensure excellent flexibility even in unpredictable terrain. In particular, the fact that no runway is needed and non-linear movement is possible provides a great tactical advantage."
 TRN_rule_the_sky: "Rule the Sky"
 TRN_rule_the_sky_desc: "The clouds are our territory. Let no uninvited guest linger in our heavens."
 TRN_ensure_mobility: "Ensure Mobility"
 TRN_ensure_mobility_desc: "The ability to strike anywhere at any time. Our air force shall be the wind that carries our will."
 TRN_cooperation_with_the_army: "Cooperation with the Army"
 TRN_cooperation_with_the_army_desc: "The eyes in the sky and the boots on the ground must move as one. Seamless coordination for total victory."
 TRN_long_range_bomber: "Long-range Bombers"
 TRN_long_range_bomber_desc: "Reach out and touch the enemy's heartland. Distance is no protection against Trinity's resolve."
 TRN_air_defense_net: "Air Defense is Our Duty"
 TRN_air_defense_net_desc: "Our homes shall be safe from the threat from above. A shield of fire for our students."
 TRN_intercept_mission: "Develop Radar for Interception Missions"
 TRN_intercept_mission_desc: "Seeing through the dark and the clouds. Radar will be our watchman in the skies."
 TRN_ground_crew_efficiency: "Increase Ground Crew Efficiency"
 TRN_ground_crew_efficiency_desc: "A fast turnaround means more sorties. Our ground crews shall be as precise as a clockmaker."
 TRN_dive_bomber: "Dive Bombers"
 TRN_dive_bomber_desc: "Precision strikes from the heavens. The shriek of the dive is the last thing the enemy shall hear."
 TRN_modern_air_combat: "Modern Air Combat"
 TRN_modern_air_combat_desc: "The pinnacle of aerial warfare. High speeds, high stakes, and the absolute dominance of Trinity."
 



 # Decisions

