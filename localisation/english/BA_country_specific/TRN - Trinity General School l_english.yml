 trinitynews.6.t: "트리니티에서 발생한 독일인 봉기"
 trinitynews.6.desc: "오늘 오후, 트리니티 중앙구에서 약 1만 명의 시위자들이 거리로 쏟아져 나오며 시작된 독일인 봉기가 트리니티 전역으로 확산되고 있습니다. 많은 독일인들이 '도이칠란트, 도이칠란트 위버 알레스'를 외치며 거리를 행진하고 있으며, 벽과 다리에는 NSDAP의 슬로건과 만자 문양이 낙서로 남겨지고 있습니다. 트리니티의 지배에 반발하는 이들은 파업과 시위로 저항을 이어가고 있습니다.\n\n광범위하게 벌어지는 시위와 시국 불안 속에서도, 티파티는 정의실현부에 직접 진압 명령을 하달했고, 이에 따라 봉기 자체는 조속히 진압될 것으로 보입니다."
 trinitynews.6.a: "전부 진압하라!"
 trinitynews.6.b: "삼위일체의 끝인가?"
 trinitynews.6.c: "저들이 분열 한다면..."
 trinitynews.6.d: "이게 그들의 최후일까?"

