 TRN_trinity_nagisa_policy: "Nagisa Policy Tree"
 TRN_trinity_army_focus: "Military"
 TRN_destroy_partisans: "Destroy the Partisans"
 TRN_destroy_partisans_desc: "Despite the constant efforts of the Justice Task Force, the organized resistance in [61.GetName] and [66.GetName] shows no signs of fading. Terrorists are threatening Trinity's stability. Accordingly, the Host's command has been issued. The Justice Task Force will act more aggressively to thoroughly suppress the terrorists and protect the order of Trinity."
 TRN_destroy_partisans_effect_tt: "Upon success, influence of §Y[KPD.GetNameWithFlag]§! and §Y[NSD.GetNameWithFlag]§! is further reduced by §Y2%§!."
 TRN_reconstruction_of_collapsed_industry: "Restore Collapsed Industry"
 TRN_reconstruction_of_collapsed_industry_desc: "After the resistance ended, [61.GetName] and [66.GetName] were left destroyed and scarred. We must restore collapsed industries through subsidies and plant the image of being 'saviors' in the minds of the local residents."
 TRN_Reconnect_network_and_power: "Expanding the Communications Network"
 TRN_Reconnect_network_and_power_desc: "In the aftermath of the Great Transfer, Trinity's communication networks saw a significant drop in accessibility the further one moved from major hubs. However, by expanding the network, we can resolve these issues and ensure rapid, accurate information delivery across more regions."
 TRN_railway_improvement: "Railway Network Improvement"
 TRN_railway_improvement_desc: "The gauge of the local railways does not match the standards used in Kivotos, leading to the inefficient reality of having to transport supplies by vehicle. To solve this, we must improve the railway network and establish a more efficient transport system."
 TRN_KWG_open: "Reopening of the Kaiser Wilhelm Society"
 TRN_KWG_open_desc: "During the Great Transfer, the Kaiser Wilhelm Society building was lost to fire. While research materials were barely preserved, some losses were unavoidable. Many Trinity scholars mourn this loss and are strongly demanding the restoration and reopening of the Society."
 TRN_improving_academy_industry: "Trinity Re-industrialization"
 TRN_improving_academy_industry_desc: "To solve Trinity's systemic issues, a Host-led redevelopment is necessary. Furthermore, to prepare for upcoming external threats, military production plants must be expanded on a large scale. Many will oppose this policy, but when our Alma Mater is under threat, they will thank us."
 TRN_ministry_of_industrial_development: "Establishment of the Academy Economic Development Department"
 TRN_ministry_of_industrial_development_desc: "Trinity's economy is an orchestra, and the Academy Economic Development Department is its conductor. Economic experts formerly belonging to the Tea Party will now act as an independent body, balancing the interests of the academy and the students, ensuring both sides flourish through rational investment and deregulation."
 TRN_expanded_corporatism: "Christian Corporatism"
 TRN_expanded_corporatism_desc: "An economic system based on Christian social doctrine flourishes in solidarity. We must organize and strengthen 'guilds' to promote class harmony, the principle of subsidiarity, and the common good. We shall prioritize cooperation over struggle, strengthening harmony and social solidarity."
 TRN_planned_economy: "Taming the Market Economy"
 TRN_planned_economy_desc: "The free market system is like human nature. However, leaving the market unattended is barbarism. We will tame and manage the market economy according to religious social doctrine. Of course, this does not imply unconditional control or disorderly chaos."
 TRN_confiscation_distribution_collectivization: "Confiscation, Distribution, Collectivization"
 TRN_confiscation_distribution_collectivization_desc: "The lands of the Junkers will be confiscated without compensation and reorganized into state-run farms managed by the Academy after distribution. Conflict is inevitable in this process, but such is reality. The Junkers will resist to protect their vested interests, and we are simply moving to confiscate them."
 TRN_cooperation_with_junker: "Cooperation with the Junkers"
 TRN_cooperation_with_junker_desc: "The Junkers are 'understanders' who know this region best, and we desperately need their cooperation. Cooperation and negotiation with the Junkers will be necessary to return numerous farmlands to Academy ownership."
 TRN_revitalization_of_heavy_industry: "Western Industrialization"
 TRN_revitalization_of_heavy_industry_desc: "With the land issue partially resolved, we can now fully utilize the vast plains of the West. This allows us to push forward with industrialization plans to fill the shortage of factories. If we add the transport capacity of the Oder River, our industrialization will accelerate even further."
 
 # Mika Route
 TRN_Kyrie_for_the_forgotten_ones: "Kyrie for the Forgotten"
 TRN_Kyrie_for_the_forgotten_ones_desc: "Regarding the problems surfacing in Trinity alongside the recent supernatural events, the weak solutions shown by the Sanctus and Filius factions no longer appear to be actions taken for Trinity's sake. On the other hand, Misono Mika and the Pater faction possess a 'Messianic Mission' to save Trinity from crisis."
 TRN_Kyrie_for_the_forgotten_ones_tt: "This §Ychoice§! guarantees that Misono Mika will §Ywin§! the upcoming §YHost Election§!."
 TRN_control_tea_party: "Control the Tea Party"
 TRN_control_tea_party_desc: "With the Sanctus faction collapsed, the Filius faction under Kirifuji Nagisa remains one of the few institutional pillars opposing Misono Mika. Fortunately, Misono Mika of the Pater faction has been elected as Host. It is now possible to weave political conspiracies against Kirifuji Nagisa. With the authority of the Pater faction and the Host, Kirifuji Nagisa will have no choice but to submit."
 TRN_Mika_basic_law: "Misono Mika Charter"
 TRN_Mika_basic_law_desc: "The current Trinity constitution is based on an idealistic system from centuries ago, designed to check the power of a monarchical Host through mutual checks between the Tea Party and the Host. However, under the blessing of fate, the Trinity Supreme Court must go beyond maintaining the legal framework and rationalize that the rule of the Pater faction and Misono Mika is a legitimate system recognized by the constitution."
 TRN_secret_meeting_with_Sisterhood: "Secret Meeting with the Sisterhood"
 TRN_secret_meeting_with_Sisterhood_desc: "The Sisterhood has long maintained a tradition of not interfering in Tea Party politics, but this was a voluntary relinquishment of rights rather than a legal binding. However, with the political landscape shifting rapidly, there is no guarantee they will continue to stay out of politics."
 TRN_necessary_revenge: "Breaking the Angel's Wings"
 TRN_necessary_revenge_desc: "As the new constitution firmly secures Misono Mika's dominance, we must no longer leave other factions to their own devices. While the Sanctus and Filius factions have been neutralized, they may recover their strength over time. Therefore, we must take definitive measures to ensure their wings never move again."
 TRN_necessary_revenge_tt: "This focus will trigger a series of §Yevents§! that will decrease the popularity of §YNon-Aligned§! ideologies."
 TRN_solving_social_problems: "Solutions for Social Problems"
 TRN_solving_social_problems_desc: "To solve social problems, the basic needs of the German locals must be appropriately managed. Fully satisfying their demands may actually increase their capacity for resistance. We must maintain a suitable level of deficiency to induce internal conflict, causing them to exhaust the strength they would use against us."
 TRN_denazification: "De-Germanization"
 TRN_denazification_desc: "The nation of Germany cloaked itself in barbarism and regressed its own society. We must break away from this German barbarism and establish more advanced institutions."
 TRN_dismantled_Nazi_organization: "Dismantling Nazi Organizations"
 TRN_dismantled_Nazi_organization_desc: "It goes without saying that organizations professing Nazism must no longer be allowed to operate freely. They began as clumsy organizations claiming to represent the masses and eventually became mass parties. We must uproot them thoroughly so they never take hold again."
 TRN_dismantled_Nazi_organization_tt: "The following §Yevents§! will no longer occur in $DECISION_NAME$.\n$EVENT_0$\n$EVENT_1$\n$EVENT_2$\n$EVENT_3$\n$EVENT_4$\n$EVENT_5$"
 TRN_take_over_the_church: "Evangelizing the Trinity Faith"
 TRN_take_over_the_church_desc: "Christianity has deeply influenced the spiritual life of Germans for a long time. However, to spread the Trinity faith, we must gradually reduce the influence of traditional beliefs and replace them with Trinity's new doctrines. Trinity must lead even the souls and minds of the German people."
 TRN_limit_german_party: "Restricting German Political Parties"
 TRN_limit_german_party_desc: "The German political parties active in Trinity territories may one day become a great threat to us. In particular, the Social Democratic Party, the Center Party, and the minor parties cooperating with them are growing in power and possess the ability to mobilize the masses for political ends. Restricting them is removing future trouble in advance."
 TRN_expanding_censorship: "Expanding the Censorship System"
 TRN_expanding_censorship_desc: "To prevent the resurgence of German political parties, we will introduce an identification system. All locals must be issued an ID card to operate within Trinity. During the issuance process, personal identities and histories will be verified, allowing us to screen for individuals with past Nazi collaboration or suspicious activity records."
 TRN_new_law_for_germany_party: "New Legislation for German Parties"
 TRN_new_law_for_germany_party_desc: "Rather than completely criminalizing and banning German political parties, we will allow them to exist legally under the supervision of Tea Party inspectors. While their actual influence will be greatly reduced, it can be an effective way to mitigate the grievances of the German locals."
 TRN_new_political_order: "The New Political Order"
 TRN_new_political_order_desc: "We will guarantee the right to vote for German locals. Of course, this is not a full form like universal suffrage. It is a method of conducting local and mayoral elections using controlled German parties. The locals may notice these limitations and grievances may arise. Regardless, it will serve as a measure to show that we allow a certain level of autonomy."
 TRN_absorb_the_reichsbanner_schwarz_rot_gold: "Dissolution of the Reichsbanner Schwarz-Rot-Gold"
 TRN_absorb_the_reichsbanner_schwarz_rot_gold_desc: "The Nazi SA has been dissolved following the collapse of the SS in the east, and the Rotfrontkämpferbund followed suit when the Communist Party in the north went into exile. However, the Reichsbanner Schwarz-Rot-Gold still survives. We must now decide the fate of the Reichsbanner, which survived even Nazi persecution."
 TRN_Kulturkampf_display_value_60_over_tt: "§YTrinity Faith§! achieves dominance."
 TRN_fate_of_german_culture: "Revolution in the Spirit"
 TRN_fate_of_german_culture_desc: "The cultures of Trinity and Germany are fundamentally different. To fuse these two, the overwhelming dominance of one side is required. Fortunately, Trinity's authority is currently overwhelmingly strong."
 TRN_fate_of_german_culture_trigger_tooltip: "§Y$MODIFIER_CONSCRIPTION_TOTAL_FACTOR$§! in §Y$TRM_appeasement_germany_modifier$§! is at least [?TRM_propaganda_monthly_conscription_factor_trigger|R]."
 TRN_second_trinity: "The Second Trinity"
 TRN_second_trinity_desc: "Trinity once inherited the legacy of the Great First Council, but it damaged that legacy through internal strife and betrayal, eventually collapsing due to the Great Transfer. It is becoming clear that only the Pater faction can unify and revive Trinity. To bind the students together and break any threat with an invincible will and destructive power—that is our goal, our conspiracy, and the mission we must complete."
 TRN_intelligence_agency: "Reorganization of the Academy Intelligence Department"
 TRN_intelligence_agency_desc: "The terrible assassination attempt on Yurizono Seia clearly revealed that the Academy Intelligence Department failed to do its job. The incompetence and lack of responsiveness of the Intelligence Director have already been clearly proven. In this world where a new order is forming, falling behind in information means death."
 TRN_lend_eyes_and_ears: "Borrowing Eyes and Ears"
 TRN_lend_eyes_and_ears_desc: "Intelligence warfare is not fought with guns or missiles, but is a 3D battle fought with information, technology, and psychological warfare. We will borrow the eyes and ears of 'lower beings' to gain an advantage in information."
 TRN_cause_of_trinity: "The Cause of Trinity"
 TRN_cause_of_trinity_desc: "Many harbored resentment toward Misono Mika's dictatorial system and watched with skeptical eyes. However, as visible achievements appeared and it became clear that Trinity was indeed under threat—combined with the conspiracies of other academies and the final death throes of the old regime—public opinion toward 'Trinity Socialism' began to turn favorable. Trinity will now pass through the pitch-black darkness and head toward a new course."
 TRN_The_nature_of_the_united_front: "Rise of the Pater Faction"
 TRN_The_nature_of_the_united_front_desc: "The Tea Party's rivals have disappeared, and the Pater faction has taken most of the seats. Now, the Pater faction must move beyond the framework of a simple faction and be reborn as a faction for the broader public and students."
 TRN_academy_defense_force: "Creation of the Academy Defense Force"
 TRN_academy_defense_force_desc: "The Academy Defense Force is a paramilitary organization created to mobilize the masses. Those who wear the white uniforms and serve with absolute loyalty to Misono Mika have been recruited. They will fight against internal enemies of Trinity and can be deployed anywhere at Misono Mika's command."
 TRN_cooperation_with_suzumi: "Cooperation Proposal to the Vigilante Corps"
 TRN_cooperation_with_suzumi_desc: "The Trinity Vigilante Corps, an unofficial club run by Morizuki Suzumi, has a loose organizational structure, but its reality is certain. Even the Remedial Knights and the Justice Task Force have acknowledged their existence and are cooperating. Why not officially elevate them to a position similar to the Academy Defense Force?"
 TRN_cult_of_Mika: "Cult of the Archangel"
 TRN_cult_of_Mika_desc: "Trinity has wandered through an unstable democracy for years. Many philosophers appeared to lead Trinity, but the unstable system eventually revealed its limits and met collapse. The aftermath brought disaster to Trinity, but the only person with the power to overcome the bitter wounds and bring about Trinity's revival is Misono Mika."
 TRN_cult_of_Mika_tt: "§MEvents will provide opportunities for Misono Mika to choose how to portray herself to the public and the bonuses that follow.§!"
 TRN_those_who_lead_those_who_follow: "The Leaders and the Followers"
 TRN_those_who_lead_those_who_follow_desc: "\"My dear students, do not fear the path ahead. For I am with you, and my strength shall be your shield. In unity, we find our salvation.\""
 TRN_new_trinity_culture: "New Trinity Culture"
 TRN_new_trinity_culture_desc: "Trinity's culture is excessively luxurious and decadent. The root cause of Trinity's failure to achieve substantial development despite centuries of peace lies in this cultural regression. We must resolutely reject corrupt culture and nurture avant-garde, ideologically clear culture and arts. A culture befitting the new era is the driving force that will raise Trinity once again."
 TRN_new_trinity_culture_tt: "§YResults will vary based on events that occur during the focus.§!"
 TRN_support_justice_task_force: "Expanding the Justice Task Force"
 TRN_support_justice_task_force_desc: "The Justice Task Force is one of the shields protecting Trinity. While they are responsible for the security of all Trinity, the resources given to them are not many. We will cooperate with them and, under sufficient support, fully tame the Justice Task Force."
 TRN_alliance_of_faith: "Alliance and Faith"
 TRN_alliance_of_faith_desc: "It cannot be denied that Trinity Catholicism is a core part of Trinity civilization. While the Pater faction seeks to embrace believers of all religions, a convenient alliance with Catholicism will become a powerful bond deep in the hearts of ordinary Trinity students and Germans alike."
 TRN_new_order_movement: "New Order Movement"
 TRN_new_order_movement_desc: "To end the overheated ideological struggle within the Pater faction, direct intervention by the Host is necessary. Both ideologues and corporatists will recoil at this choice. However, before their ideological conflict, they all share a common identity as followers of the Archangel. Therefore, substantial resistance to the Host's decision is expected to be limited."
 TRN_Fourth_Reich: "Proclamation of the Ordensstaat"
 TRN_Fourth_Reich_desc: "The proclamation of the Ordensstaat might be a contradiction in itself. However, Trinity does not look away from or fear that contradiction. The Ordensstaat, born from the intersection of Trinity's unique nature and rapidly changing external affairs, is willingly accepting Trinity's inherent roots as a powerful ally and spiritual foundation."
 TRN_student_solidarity: "Strengthening Student Solidarity"
 TRN_student_solidarity_desc: "The 'Student Solidarity,' the foundation and root of Trinity, has gradually expanded based on Christian doctrines and values. This society prospers not through blind obedience to an almighty tyrant, but through the autonomous organization of students through justice, solidarity, freedom, and the rule of law. Trinity students have always dreamed of such a society. It is a community built on the principle of Christian love, not a specific class or faction."
 TRN_jewel_of_the_trinity_faith: "Jewel of the Trinity Faith"
 TRN_jewel_of_the_trinity_faith_desc: "The Sisterhood plays a central role in the faith of Trinity. We must recognize the importance of the role the Sisterhood plays in Trinity society and allow them to exert a positive influence in more places."
 TRN_improving_JTF: "Removing JTF Inefficiencies"
 TRN_improving_JTF_desc: "Along with the massive academy grounds, the Justice Task Force has expanded greatly under the full support of Misono Mika. However, inefficiency and rigidity have grown just as much. Hanekawa Hasumi will lead the effort to improve these issues."
 TRN_Integrity_of_Trinity: "Integrity of Trinity"
 TRN_Integrity_of_Trinity_desc: "Misono Mika's 'Second Trinity,' born after defeating the enemies of centuries past, is an entity like an organism achieved by all ordinary students uniting as one. This new Trinity will not be bound by past glory, but will face current needs and move toward a great and messianic future. To lead the world into a new era of spiritual enlightenment—that is Trinity's mission."
 TRN_codification_of_regime: "Codification of the Regime"
 TRN_codification_of_regime_desc: "The Pater faction is the horse pulling the academy wagon, and Misono Mika is the rider of that wagon. There will be no more unstable decision-making or directionless wandering. Cooperation with the community has become unprecedentedly firm, and based on this, we have a mission to provide a more stable and prosperous life for both students and citizens. This is not a choice, but a mission of the times given to us all."
 TRN_supreme_leader: "Supreme Leader"
 TRN_supreme_leader_desc: "The ideologues were right. The corporatists were traitors united under the purpose of collapsing Trinity from within. Misono Mika will finally shed the guise of a 'Leader' and be reborn as a being of a new dimension—a tyrant who has arrived like destiny."
 TRN_horseman_of_the_apocalypse: "Horseman of the Apocalypse"
 TRN_horseman_of_the_apocalypse_desc: "Trinity is no longer a simple academy. It is a living, breathing organism, an entity like the horse that brings the end. And the rider upon it, the Archangel Misono Mika, is a conqueror, an emperor, and a symbol of war. Trinity is death, and Mika is the glorious rider who leads that death."
 TRN_project_trinity: "Project Trinity"
 TRN_project_trinity_desc: "Project Trinity is the most secret and powerful project being pursued at Trinity General School. The core of this plan lies in newly developed medium-range ballistic missiles, reverse-engineered from existing missile technology. This missile carries a total of six warheads, designed so that each warhead independently strikes its target upon descent."
 TRN_destiny_of_trinity: "Destiny of Trinity"
 TRN_destiny_of_trinity_desc: "Trinity's mission does not end with saving itself. It is for the salvation of all Kivotos. Leaving aside the hateful Earth locals and the various ideologies spread like a plague, we have a moral mission to uproot all this hatred. Now, preparations for the next, and final, war will begin. At the end where heroes fall and darkness lifts, in the fading light of dawn, we must build another beautiful new world."
 TRN_sheep_and_shepherd: "The Sheep and the Shepherd"
 TRN_sheep_and_shepherd_desc: "The sheep and the shepherd are indispensable to each other. The path of nomadism always requires sheep, and the sheep always require the protection of the shepherd. Archangel Misono Mika is ready to give her life for her sheep and does not spare love and devotion in caring for them. The sheep will gain rest and peace under the guidance of the shepherd and lead happy lives. This is a holy bond forged through faith and responsibility."

 TRN_eden_accord: "Formation of the Eden Accord"
 TRN_eden_accord_desc: "The Great Transfer thoroughly shattered Trinity's idealistic worldview, and in its aftermath, Trinity gradually took a more radical path. However, Misono Mika, who emerged amidst the chaos, promised a 'Trinity-like world' once again upon the ruins of broken beliefs. A unique worldview belonging only to Trinity, distinct from the General Student Council's Kivotos Union."
 TRN_collaboration_with_hyakkiyako: "Collaboration with [HYA.GetAdjective]"
 TRN_collaboration_with_hyakkiyako_desc: "Trinity has long maintained a close cooperative relationship with Hyakkiyako. However, it is necessary to reconfirm whether this cooperative relationship is still maintained despite the incident and recent political changes."
 tooltip_TRN_collaboration_with_hyakkiyako_trigger: "The §Y[HYA.GetNameWithFlag] system§! is maintained."
 TRN_establish_a_customs_union: "Establishment of an Economic Union"
 TRN_establish_a_customs_union_desc: "The faction led by Trinity is not just a simple friendly relationship between academies and nations, but forms a much closer alliance. By establishing an economic union within the sphere of influence, we will lead even closer economic cooperation."
 TRN_divine_mandate: "Divine Mandate Plan"
 TRN_divine_mandate_desc: "The concept of 'Divine Mandate' originally stems from the governor system established by Trinity General School to efficiently manage sites in various locations. This concept will be implemented with some modifications to efficiently manage the territories Trinity has conquered."
 
 TRN_impossible_to_coexist: "Those Who Cannot Coexist"
 TRN_impossible_to_coexist_desc: "War with Gehenna is an unavoidable fate for Trinity. It is a revenge for the wounds suffered by our ancestors and constitutes a holy war for all Trinity. However, even such a fateful war cannot succeed without thorough preparation. The large-scale offensive toward the West, currently being pursued under the code name 'Saint Michael,' is being planned as an operation of unprecedented scale in the history of Kivotos, requiring more precise strategy and operational planning than ever before."
 TRN_Fifth_Column: "Destabilizing the Gehenna Region"
 TRN_Fifth_Column_desc: "How disgusting... those demons shouldn't even be allowed to breathe the same air as us. We'll send in some 'specialists' to make sure their backyard is as chaotic as their fashion sense."
 TRN_spiritual_warfare: "Spiritual Warfare"
 TRN_spiritual_warfare_desc: "Finally, the time has come to repay Trinity's humiliation. Gehenna's Pandemonium Society and Prefect Team will fall in this otherworld, and we will not rest until our flag flies over the entirety of Gehenna's territory. Rise, great [TRM.GetName], for the final struggle!"
 TRN_alliance_with_devil: "...Alliance with the Devil?"
 TRN_alliance_with_devil_desc: "Handyman 68 has recently defined the Pandemonium Society as an illegal government and claimed sovereignty over not only Gehenna but even our Alma Mater, Trinity, calling themselves the 'Last Germanic State.' On the surface, they certainly look like our enemies, but the reality is a bit more complex. Until they overcome the obstacle known as the Pandemonium Society, our interests may temporarily align. In that sense, a temporary alliance with them is well worth considering."
 # Red Winter Diplomacy
 TRN_northern_kivotos_diplomacy: "Northern Diplomacy"
 TRN_northern_kivotos_diplomacy_desc: "\"It's so cold up there... but I suppose even the snow-covered north needs to hear the gospel. Or at least, they need to know who's in charge now.\""
 TRN_denmark_or_war: "Demand Denmark"
 TRN_denmark_or_war_desc: "\"A strategic point that simply must be under Trinity's 'protection.' If they won't give it up for tea and cookies, we'll have to use something a bit heavier.\""
 TRN_use_of_nordic_association: "Use of the Nordic Association"
 TRN_use_of_nordic_association_desc: "\"Local organizations can be so useful when you know which strings to pull. Let's make sure they understand the benefits of following Trinity's lead.\""
 # Arius
 TRN_catch_tail: "Catching the Tail"
 TRN_catch_tail_desc: "Through the efforts of the Academy Intelligence Department, the rebellious elements hidden within Trinity General School have been revealed. They were quietly eating away at our academy, ready to stab us in the back at any opportunity. However, their plans end here. The Justice Task Force and the Intelligence Department will uproot them with decisive action."
 TRN_religious_conversion: "'Conversion'"
 TRN_religious_conversion_desc: "Among the figures from Arius, Hakari Atsuko in particular has been an individual actively advocating for peace with Trinity, which was also revealed through conflicts within the squad she belongs to. Trinity positively evaluates her 'conversion' and is ready to finally wash away the centuries-old grudge with Arius through this occasion."
 TRN_chasing_the_bandit: "Chasing the Bandits"
 TRN_chasing_the_bandit_desc: "The Arius Squad continues to persist in resistance even after the war ended. In particular, cases of Trinity students suffering damage around Danzig are being reported. These groups are an issue that must be resolved by dispatching the Justice Task Force and the Vigilante Corps."
 TRN_annex_the_bandit_states: "Legacy of the First Council"
 TRN_annex_the_bandit_states_desc: "At the First Council, the Arius faction rejected unity. However, that is no reason to treat them coldly. What is the true legacy left by the First Council? It is integration and unity. We will inherit this spirit, accept the Arius students, and declare the 'true' unification of all Trinity by reopening the council that had been left in an unfinished state for hundreds of years."
 TRN_arius_tactic: "CQB Research Department"
 TRN_arius_tactic_desc: "The CQB (Close Quarters Battle) system shown by Arius students fascinated Trinity students, and a CQB Research Department was established. Arius students have taken on the roles of department heads. This research department is essential to utilize the practical experience of Arius students and strengthen special forces capabilities."

 # Diplomacy after the War
 TRN_union_with_gehenna: "Our Eden Treaty"
 TRN_union_with_gehenna_desc: "The peace agreement between Trinity and Gehenna pursued by the GSC President, the so-called 'Eden Treaty,' lost its meaning long ago. However, the situation is now completely different. With Trinity having occupied Gehenna, the moment to bring the name 'Eden Treaty' back from history is approaching. This time, it is no longer a hollow peace. An Eden Treaty in the 'Trinity Way'—it will mean submission, integration, and total dominance."
 TRINITY_WON_THE_GEHENNA: "§Y[TRM.GetNameWithFlag]§! wins the §YEden Decisive Battle§!"
 TRN_magdeburg_trials: "Magdeburg Military Trials"
 TRN_magdeburg_trials_desc: "The military trials to be held in Magdeburg are not a place for punishing war crimes. They are more akin to a political circus to showcase Trinity's military victory and humiliate the enemies. The tribunal will specifically target the Prefect Team members and certain Gehenna clubs whose resistance is particularly strong."
 TRN_forcibly_disband_HSD: "Hot Springs Development Department Peacekeeping Deployment"
 TRN_forcibly_disband_HSD_desc: "\"Explosions aren't exactly part of the curriculum here. It's time to retire those drills for good.\""
 TRN_forcibly_disband_GRS: "Forced Dissolution of the Gourmet Research Society"
 TRN_forcibly_disband_GRS_desc: "\"Food should be enjoyed, not fought over like a battlefield. We're closing the kitchen on this particular brand of chaos.\""
 TRN_reduce_authority_of_pandemonium_society: "Replacing the Pandemonium Society"
 TRN_reduce_authority_of_pandemonium_society_desc: "The Pandemonium Society was the group that ruled Gehenna. If the governing body of such a massive academy disappears overnight, serious confusion will occur. We will take over the Pandemonium Society and reorganize it as Trinity's governing body for Gehenna territories."
 TRN_incorporate_EMC_into_RC: "Emergency Medicine Channel Organizational Integration"
 TRN_incorporate_EMC_into_RC_desc: "The Emergency Medicine Channel is an emergency rescue organization gathered around Gehenna's Himuro Sena. The EMC has maintained a fairly close relationship with the Trinity Remedial Knights since before the incident. Since we have annexed Gehenna through war, the EMC will officially be incorporated as a subordinate organization of the Remedial Knights."
 TRN_inclusion_SLC: "Co-opting the School Lunch Club"
 TRN_inclusion_SLC_desc: "The help of the School Lunch Club is needed for post-war processing."
 TRN_defiance_of_COU: "Defying the Authority of the GSC"
 TRN_defiance_of_COU_desc: "The General Student Council has clearly revealed its incompetence in the new world, and the disappearance of the GSC President followed by a series of subsequent events has shaken the trust in the student council to its core. This authority can no longer reign over Trinity. We will resist this by launching a revolution of heavenly mandate."
 TRN_extinguish_the_flame: "Extinguishing the Flame"
 TRN_extinguish_the_flame_desc: "Millennium remains a significant threat to our Alma Mater, and their technological prowess is like holding a blade to our throats. Such technological hegemony can no longer be overlooked and must be controlled."
 TRN_divine_mandate_west_kivotos: "West Kivotos Reorganization"
 TRN_divine_mandate_west_kivotos_desc: "\"The western regions need a firm hand to guide them. Trinity's light will reach every corner of this land.\""
 TRN_invasion_kaiser: "Dismantling [KAI.GetNameDef]"
 TRN_invasion_kaiser_desc: "\"The reign of corporate greed ends today. Kaiser's assets will be put to much better use under Trinity's management.\""
 TRN_TrinityMikaDiplomacySpainAttack: "Securing Gibraltar"
 TRN_TrinityMikaDiplomacySpainAttack_desc: "\"A gateway to the world that cannot be left in the hands of others. We shall secure it for the glory of Trinity.\""
 TRN_ultimatum_to_wild_hunt_academy: "Demand for Wild Hunt Submission"
 TRN_ultimatum_to_wild_hunt_academy_desc: "\"Submit and be protected, or resist and be forgotten. The choice is yours, Wild Hunt.\""
 TRN_TrinityMikaDiplomacyItalyAttack_4: "Extra-Kivotos Divine Mandate"
 TRN_TrinityMikaDiplomacyItalyAttack_4_desc: "\"Our reach extends beyond the borders of Kivotos. The mandate of heaven knows no bounds.\""
 TRN_threat_from_the_east: "Threat from the East"
 TRN_threat_from_the_east_desc: "The [SOV.GetAdjective] forces of the East are becoming a major threat to our Alma Mater. In particular, the [SOV.GetAdjective] forces are a massive evil that has long supported our enemies and plotted the division of our Alma Mater through propaganda and agitation."
 TRN_balkan_dip: "Balkan Diplomacy"
 TRN_balkan_dip_desc: "To oppose the massive enemy of the East, the cooperation of the Balkan nations is necessary. They mostly possess anti-[SOV.GetAdjective] tendencies, and if we approach them by utilizing this, we can form a dependable alliance."
 TRN_winter_warfare: "Winter Preparation"
 TRN_winter_warfare_desc: "The territory of the [SOV.GetAdjective] forces is dominated by harsh cold. In particular, as a result of several investigations, we have confirmed that combat is impossible with basic-level winter clothing. We will provide our army with specially manufactured winter clothing and various equipment to adapt to the new battlefield."
 TRN_conscription_of_polish_nationalists: "Recruiting Polish Nationalists"
 TRN_conscription_of_polish_nationalists_desc: "Poland was a new republic that had only been independent from Russia for a few decades. However, we must recruit Polish nationalists who are once again being suppressed by the massive threat of Russia to sap the [SOV.GetAdjective] side's war-making capability and create an alliance to overthrow the massive evil."
 TRN_polish_autonomous_state: "Polish Autonomous State"
 TRN_polish_autonomous_state_desc: "The exploits of the Polish people were brilliant, and they seemed fully deserving of establishing their own nation. Under Trinity's support, the Polish people will establish an autonomous state so they can restore the ruins of collapsed Poland and rebuild their homes under our support."
 TRN_poland_divine_mandate_focus: "Southeast Trinity Divine Mandate"
 TRN_poland_divine_mandate_focus_desc: "The Polish people were deceived. Who could have expected they would so easily trust someone from another world? Poland will be entrusted to Trinity experts and remodeled in all aspects, including society and politics. After the remodeling is finished, it will be reborn as a new shield that blocks and takes responsibility for Trinity's East."
 TRN_destruction_of_soviet_hegemony: "Crushing Soviet Hegemony"
 TRN_destruction_of_soviet_hegemony_desc: "Preparations to respond to the Red Threat from the East are finally complete. The [SOV.GetAdjective] side has long supported our enemies, agitated for internal division, and threatened our Alma Mater. Now is the time to pay the price."
 TRN_baltic_unrest: "Forest Brothers"
 TRN_baltic_unrest_desc: "The Baltic nations knelt before [SOV.GetAdjective] violence. But that ends now. We will support the Baltic peoples and encourage them to rise up. They are not fighting alone. They will fight alongside us and achieve independence."
 TRN_anti_soviet_resistance: "Recruiting Anti-Soviet Volunteers"
 TRN_anti_soviet_resistance_desc: "According to the Intelligence Department, we have confirmed that some resistance groups with anti-government tendencies still exist within [SOV.GetAdjective]. We can co-opt them and provide appropriate rewards for them to cooperate with our army."
 TRN_ukrainian_unrest: "Ukrainian Unrest"
 TRN_ukrainian_unrest_desc: "A nationalist organization has existed in Ukraine since 1930. They did not hesitate to engage in terrorism and assassination under the name of independence, and even innocent civilians were sacrificed in the process. While they are a cruel and barbaric group that we absolutely cannot tolerate by our values, ironically, they are now facing the same enemy as us. As the saying goes, 'the enemy of my enemy is my friend,' so shouldn't we turn a blind eye to their dirty past for a while?"
 TRN_belarusian_volunteer_corps: "Recruiting Belarusian Collaborators"
 TRN_belarusian_volunteer_corps_desc: "Belarusian collaborators are mainly those who have decided to cooperate with Trinity. For them, faith does not exist; they are merely vulgar opportunists who move according to power and profit. But if their servility is useful to us, is there any reason to refuse? We are not so foolish as to drive away those who say they will cooperate."
 TRN_eastern_divine_mandate: "Eastern Divine Mandate"
 TRN_eastern_divine_mandate_desc: "The vast Eastern territories of the [SOV.GetAdjective] side are difficult for Trinity administration to handle alone. Therefore, a new government will be established in this region, centered on a military-civilian administration office established by Tea Party experts, locals, and soldiers."
 TRN_TrinityMikaDiplomacyAttackSwiss: "Invasion of [SWI.GetNameDef]"
 TRN_TrinityMikaDiplomacyAttackSwiss_desc: "\"Even the mountains cannot hide those who would stand in our way. Switzerland will learn the true meaning of neutrality... Trinity's neutrality.\""
 TRN_TrinityMikaDiplomacyItalyAttack: "Watching the Southern Threat"
 TRN_TrinityMikaDiplomacyItalyAttack_desc: "\"The south is stirring. We must keep a close watch and be ready to act before the embers turn into a wildfire.\""
 TRN_TrinityMikaDiplomacyItalyAttack_2: "Crushing the [ITA.GetAdjective] Danger"
 TRN_TrinityMikaDiplomacyItalyAttack_2_desc: "\"Danger is best dealt with before it arrives. We'll dismantle their threats piece by piece until nothing remains.\""
 TRN_TrinityMikaDiplomacyItalyAttack_3: "Mountain Warfare"
 TRN_TrinityMikaDiplomacyItalyAttack_3_desc: "\"Fighting in the peaks requires a different kind of strength. Our students will master the heights and strike from where they least expect.\""
 TRN_TrinityMikaDiplomacyItalyAttack_6: "Declaration of Victory over Otherworld Faiths"
 TRN_TrinityMikaDiplomacyItalyAttack_6_desc: "\"Our faith has proven supreme. The false idols of this world have fallen before the truth of Trinity.\""
 TRN_divine_mandate_italy: "Italian Divine Mandate"
 TRN_divine_mandate_italy_desc: "\"The cradle of ancient civilization shall now be the cradle of Trinity's new order. We will bring peace and prosperity to the peninsula.\""


 # Nagisa Route
 TRN_unprovable_problem: "An Unprovable Problem"
 TRN_unprovable_problem_desc: "An unprovable problem. If one were to compress Trinity's current situation into a single sentence, this would be the most appropriate. Is it possible for us to reach a conclusion when the variables themselves are in flux?"
 TRN_unprovable_problem_tt: "This §Ychoice§! guarantees that Kirifuji Nagisa will §Ywin§! the upcoming §YHost Election§!."
 TRN_victory_of_intra_party_democracy: "Victory of Factional Democracy"
 TRN_victory_of_intra_party_democracy_desc: "Kirifuji Nagisa has seized the hegemony of Trinity. However, rather than complete one-man rule, she seeks to manage state affairs through the harmony of her faction, Filius, and other factions. With one foot on the ground of suspicion, she takes a step toward a future of cooperation."
 TRN_victory_of_intra_party_democracy_tt: "The §YBalance of Power§! system, representing the social influence of the Filius faction, is now open."
 TRN_absorb_sanctus_faction: "Absorbing the Sanctus Faction"
 TRN_absorb_sanctus_faction_desc: "The Sanctus faction, having lost its charisma after Seia, is in a state of confusion. We will meet with the leader of the Sanctus faction, $TRN_Natsuki_Kato$, and propose integration into Filius. Of course, there is little possibility they will refuse."
 TRN_support_various_factions: "Reaching Out to Neutral Factions"
 TRN_support_various_factions_desc: "We request cooperation even from factions maintaining a neutral stance. In particular, we can propose some cooperation to the Johannine faction in exchange for promising the expansion of medical facilities."
 TRN_prioritize_filius: "Prioritizing Filius Unity"
 TRN_prioritize_filius_desc: "Amidst the chaos and political schemes after the Great Transfer, some Filius faction executives even moved their affiliation to Pater. Let's instruct them to return to the Filius faction, promising to forget the past."
 TRN_repromote_eden_treaty: "Nagisa-Ako Meeting"
 TRN_repromote_eden_treaty_desc: "[TRN_repromote_eden_treaty_desc]"
 TRN_repromote_eden_treaty_desc_generic: "The torch of the Eden Treaty dreamed of by the GSC President has not been extinguished even before the wind of the Great Transfer. We will invite Ako, the Senior Executive of [GEH.GetName], to Trinity in the near future to discuss the establishment of a joint security organization for the common security maintenance of both academies. Of course, pushback from [GEM.GetName] is expected, but it is a manageable issue."
 TRN_repromote_eden_treaty_desc_alt: "The torch of the Eden Treaty dreamed of by the GSC President has not been extinguished even before the wind of the Great Transfer. We will invite Ako, the Prefect Team Vice-Captain of [GEH.GetName], to Trinity in the near future to discuss the establishment of a joint security organization for the common security maintenance of both academies. Of course, pushback from [GEM.GetName] is expected, but it is a manageable issue."
 TRN_repromote_eden_treaty_tt: "The £decision_icon_small §Y$TRN_prefect_team_discipline_decline$§! decision is permanently locked." 
 TRN_capriccioso_ruling_the_sora: "Capriccioso Ruling the Sky"
 TRN_capriccioso_ruling_the_sora_desc: "The most threatening enemy to the re-establishment of the Eden Treaty is the permanent crushing of [GEM.GetNameDef], which is hostile to Trinity. We must investigate them and protect the Eden Treaty from the threat of [GEM.GetLeader]."
 TRN_hanuma_line: "Hanuma Line"
 TRN_hanuma_line_desc: "We are jointly discussing a plan with [GEH.GetName] to fortify the border regions to prevent [GEM.GetName]'s war machines from entering our territory. Since the bordering territory is too long, we cannot install grand fortifications like the Maginot Line in all regions. However, a fortress network installed at key strongpoints will be sufficiently effective."
 TRN_affettuoso_looking_up_to_the_sora: "Affettuoso Looking up to the Sky"
 TRN_affettuoso_looking_up_to_the_sora_desc: "The most reliable partner for the re-establishment of the Eden Treaty is [GEH.GetNameDef]. While we continue contact with [GEH.GetLeader], we will continue support for the Prefect Team at a reasonable level for the success of the Eden Treaty."
 TRN_start_of_the_eden_treaty_negotiations: "Start of Eden Treaty Renegotiations"
 TRN_start_of_the_eden_treaty_negotiations_desc: "New Eden Treaty renegotiations have begun. The most significant point of these renegotiations is that an exclusive peace negotiation between Trinity and [GEM.GetName] will take place, designating the Pandemonium Society as a common enemy. If the negotiations are successful, we can compress Gehenna's enemies down to just the Pandemonium Society."
 TRN_start_of_the_eden_treaty_negotiations_tt: "The £decision_icon_small §YEden Treaty§! begins for the establishment of the Eden Treaty Organization, a mutual supra-national organization between [TRM.GetName] and [GEH.GetName]. [GEM.GetName] and the Pater faction may interfere with this."
 TRN_union_of_two_academies: "Inter-Academy Federation Unification Plan"
 TRN_union_of_two_academies_desc: "As the Pandemonium Society collapsed, peace has come between the two academies. As the relationship between the two academies becomes extremely close, we seek to pursue integration with the Prefect Team."
 TRN_union_of_two_academies_tt: "If they approve, we will unify peacefully with [GEH.GetNameDef]."
 TRN_war_of_good_and_evil: "War of Good and Evil"
 TRN_war_of_good_and_evil_desc: "It is obvious which side we should support in the civil war occurring in Gehenna."
 TRN_technology_exchange_agreement: "Trinity-Gehenna Tank Technology Sharing"
 TRN_technology_exchange_agreement_desc: "As peaceful steps between the Prefect Team and us proceed, we have become able to share more things with them."
 TRN_technology_exchange_agreement_tt_1: "If the §Y[TRM.GetAdjective]§! side researches §YMedium Tank§! technology, the §Y[GEH.GetAdjective]§! side gains a license for it."
 TRN_technology_exchange_agreement_tt_2: "If the §Y[GEH.GetAdjective]§! side researches §YMedium Tank§! technology, the §Y[TRM.GetAdjective]§! side gains a license for it."
 TRN_nagisa_constitution_discussion: "The First Trinity"
 TRN_nagisa_constitution_discussion_desc: "There is no 'Second Trinity' as claimed by the Pater faction. Nagisa, having quelled the internal confusion of Filius, seeks to hold a new council to codify the upright order she wishes to establish. Nagisa will extend the Host's unstable 1-year term to 3 years and amend it to allow unlimited re-election. Further discussions may also take place."
 TRN_nagisa_constitution_discussion_tt: "This focus triggers a series of events related to the §YCouncil§!, in which each Trinity faction participates. Nagisa can choose between moderate or radical measures regarding Trinity's religious issues."
 TRN_nagisa_constitution_discussion_warning_tt: "§RWarning§!: Completing this focus without completing the $TRN_nagisa_meeting_with_sisterhood$ focus will §Ydraw backlash from the Sisterhood§!."
 TRN_nagisa_meeting_with_sisterhood: "Contact with the Sisterhood"
 TRN_nagisa_meeting_with_sisterhood_desc: "Since the assassination attempt on Yurizono Seia, conspiracy theories that the Sisterhood will involve itself in the political situation have been spreading. While Nagisa does not particularly like her own tendency to easily suspect others, she must suspect the Sisterhood in order to trust them. Let's proactively contact them to grasp their intentions."
 TRN_successor_to_the_first_trinity: "Successor to the First Trinity"
 TRN_successor_to_the_first_trinity_desc: "We have defended our noble traditions and ideals. But is that the end? Is merely maintaining Trinity as it was before the Great Transfer our only path? Kirifuji Nagisa will inherit the 'First Trinity' and 'reform' it in her own way. The direction of that reform is known only to the Host."
 TRN_coexistence_with_germans: "Coexistence in Germany"
 TRN_coexistence_with_germans_desc: "After the Great Transfer, we have come to have no choice but to live with the German locals. Their culture is heterogeneous to Trinity, and their patriarchy that denies the authority of the Tea Party is nothing but uncomfortable. However, to coexist in the same land, it is necessary to allow local autonomy."
 TRN_idealistic_approach: "The Milk Tea Solution"
 TRN_idealistic_approach_desc: "Just as milk and black tea achieve harmony through an appropriate blend, Trinity and the German locals can achieve appropriate harmony. We plan to create a joint school district and teach the Trinity faith alongside the local faith so that the locals can naturally learn Trinity culture and gradually assimilate with us."
 TRN_new_education_for_all: "New Education for All"
 TRN_new_education_for_all_desc: "Given the very different cultures of Germany and Trinity, all Germans must mandatorily complete a new education program designed to understand Trinity culture and prevent them from harboring hostility."
 TRN_civil_rights_act: "Civil Rights Act"
 TRN_civil_rights_act_desc: "Legally, Kivotos-born and locals are completely equal. While we cannot do much about social discrimination, at least institutional discrimination is prohibited. Through this, the locals will come to accept rule by Kivotos-born as something natural. At least, the Tea Party expects so."
 TRN_realistic_approach: "The Earl Grey Solution"
 TRN_realistic_approach_desc: "To make good Earl Grey tea, it is important to add a very small amount of bergamot oil so as not to spoil the deep taste of the black tea. The value of the locals is about that much. They have meaning if a very little remains, but if they cross the line, they erase Trinity's scent. While we cannot forcibly eradicate German culture, we need to make them voluntarily 'Trinity-ize' through tangible and intangible discrimination."
 TRN_dual_identity_card: "Dual Identification"
 TRN_dual_identity_card_desc: "We assign different tiers to Germans and Trinity citizens starting from their ID cards, applying discriminatory treatment from tax rates to qualifications for civil service appointments. This is an appropriately graduated second-class citizen tier. Second-class citizens can be granted new ID cards by completing Trinity culture education and various types of conversion statements to prove they have been influenced by Trinity culture. This is a matter of choice, not coercion."
 TRN_discriminate_but_equal: "Separate but Equal"
 TRN_discriminate_but_equal_desc: "While citizens who have not been Trinity-ized legally receive differential treatment in all services, we will clearly advertise that this is not a permanent status but a state that can be escaped through Trinity-ization. Let's provide benefits to 'New Trinity people' while creating laws prohibiting Trinity people from discriminating against locals who have obtained new status."
 TRN_german_cultural_revolution: "German Cultural Revolution"
 TRN_german_cultural_revolution_desc: "Whether it's Milk Tea or Earl Grey, the important thing is that a nice table is needed to place the teacup. For the female-centric Trinity society and the male-centric German society to fuse, the Germans must first set aside some of their traditions. Re-education programs, female employment systems, and sanctions against socially conservative politicians will be central."
 TRN_denazification_nagisa: "De-Nazification"
 TRN_denazification_nagisa_desc: "One thing is for sure: National Socialism cannot go with us. If those arrogant people who try to send women back to the kitchen prevail in this land, how can the authority of the Tea Party stand upright?"
 TRN_trinity_religious_issue: "Local Religious Issues"
 TRN_trinity_religious_issue_desc: "According to the decisions made at the last council, we will interfere in the religious issues of the locals."
 trn_nagisa_religion_hardline_tt: "We have decided to implement §YHardline Measures§! at the council, focusing on destroying local faiths:\n"
 trn_nagisa_religion_moderate_tt: "We have decided to implement §YModerate Measures§! at the council, focusing on spreading propaganda that local faiths are identical to the Trinity faith:\n"
 trn_nagisa_religion_null_tt: "We have not yet held the council. §YHardline Measures§! will expand the influence of the Trinity Sisterhood, while §YModerate Measures§! will be advantageous to German local parties.\n"
 TRN_nagisa_justice_task_force: "Intelligence-JTF Linkage"
 TRN_nagisa_justice_task_force_desc: "We will appoint Justice Task Force members to positions within the Tea Party's direct intelligence organization and expand its scale more than before. With the emergence of a larger and more militarized intelligence department loyal to the Tea Party, our security will become more solid."
 TRN_nagisa_support_for_the_JTF: "Expanding the Justice Task Force"
 TRN_nagisa_support_for_the_JTF_desc: "Meeting with Hanekawa Hasumi to further increase the size of the Justice Task Force and encourage them to play a major role in counter-intelligence as well as public security."
 TRN_nagisa_support_for_the_prefect_team_intelligence: "Integrating Prefect Team Intelligence"
 TRN_nagisa_support_for_the_prefect_team_intelligence_desc: "The capable intelligence organization of the Gehenna Prefect Team can be integrated due to our peaceful relationship with them. Of course, it must be noted that despite the friendly relationship, there is dissatisfaction within the Justice Task Force (especially centered around Hasumi)."
 TRN_mediator_among_factions: "Mediator Among Factions"
 TRN_mediator_among_factions_desc: "As Kirifuji Nagisa's term progresses, she is showing remarkable political achievements in coordinating and balancing opinions among various factions. Nagisa's political influence is naturally increasing, and those who initially looked upon Nagisa's leadership with suspicion now trust her."
 TRN_safeguarding_the_ideal_of_factional_democracy: "Guardian of Tradition"
 TRN_safeguarding_the_ideal_of_factional_democracy_desc: "Nagisa will not change Trinity's long-standing traditions. She will coordinate opinions among the various factions of the Tea Party and remain simply as the faction leader of Filius."
 TRN_eventually_happen: "Looking Toward Pater"
 TRN_eventually_happen_desc: "A complete renegotiation of the Eden Treaty is impossible. Since actions that provoke the Pater faction could bring greater risks than making the Prefect Team an ally, we must perform a renegotiation of a more 'Trinity-like' Eden Treaty to better manage state affairs in negotiations with the Pater faction."
 TRN_eventually_happen_tt: "The £decision_icon_small §YEden Treaty§! begins for mutual non-aggression and a Trinity industrial preference treaty between [TRM.GetName] and [GEH.GetName]. [GEM.GetName], Prefect Team hardliners, and the self-interested involvement of the Trinity political world may interfere with this."
 TRN_eventually_happen_effect_tt: "If Trinity completes the §Y$TRN_eventually_happen$§! focus, this focus will be replaced by another focus to resolve §Yinternal conflict§! with Pater."
 TRN_nagi_preventive_war: "Preventive War"
 TRN_nagi_preventive_war_desc: "The relationship between Gehenna and Trinity could lead to war at any time. The problem is that they are thinking the same thing as us. The winner of this war will be determined by which side stabs the other first."
 TRN_eden_system_establishment: "Establishment of the Eden System"
 TRN_eden_system_establishment_desc: "Whatever the result, we have already decided the era, opened a massive new era spanning Gehenna and Trinity, and Trinity is greeting a new dawn under the leadership of [ROOT.GetLeader]."
 TRN_start_of_new_constitution_discussion: "Preparing a New Constitution"
 TRN_start_of_new_constitution_discussion_desc: "The victory in the Eden Decisive Battle and the Gehenna-Trinity integration were events that signaled the start of a deep discussion on what direction we should take in the future."
 TRN_start_of_new_constitution_discussion_tt: "Until the §YNagisa Constitution§! focus is completed, you can add constitutional clauses through £decision_icon_small §Gdecisions§!. The constitutional clause effects added at the point the Nagisa Constitution focus is completed will all be integrated and added as a §YNational Spirit§!."
 TRN_end_of_new_constitution_discussion: "Nagisa Constitution"
 TRN_end_of_new_constitution_discussion_desc: "Now that all preparations are finished, the completed draft constitution is promulgated as the new constitution through the resolution of the Council."
 TRN_end_of_new_constitution_discussion_trigger: "Completed §Y6§! political focuses."
 TRN_end_of_new_constitution_discussion_tt: "The moment this focus is completed, §Yconstitutional clauses§! can no longer be added."
 TRN_unknown_future: "An Unknown Future"
 TRN_unknown_future_desc: "Host Kirifuji Nagisa will strive to find the best future for Trinity. What that future is, is not yet known."
 TRN_unknown_future_tt: "The political focuses of the Nagisa route will be revealed upon completing the $TRN_safeguarding_the_ideal_of_factional_democracy$ or $TRN_iron_woman$ focus."
 TRN_JTF_solidarity: "Internal Control of the JTF"
 TRN_JTF_solidarity_desc: "As we significantly retreated from our hardline stance in foreign policy due to Pater's interference, Host Nagisa's political standing was damaged. Nagisa intends to award a non-voting honorary Tea Party executive position to Tsurugi, the Justice Task Force Director, for factional cohesion and to declare that the JTF still remains loyal to the Host."
 TRN_attack_pater: "Focus on Prosecuting Pater"
 TRN_attack_pater_desc: "Everyone knows that the masterminds of the ongoing sabotage and strikes happening in Germany right now are not the Social Democrats, but the Pater faction. We will instruct the Justice Task Force to track down the sabotage leaders and focus on prosecuting them to attack Pater."
 TRN_connection_to_vigilante: "Vigilante Cooperation"
 TRN_connection_to_vigilante_desc: "Link up with the Vigilante Corps, Trinity's internal paramilitary organization, to arrest and detain locals sympathizing with the Pater faction's sabotage."
 TRN_attack_mika_misono: "Holding Back Mika"
 TRN_attack_mika_misono_desc: "The right to prosecute is like a sword. Even if it is a prosecution that cannot actually punish the opponent, it can tie the opponent to the court through all three trials, apply mental pressure, and make them consume time. If we tie Mika down like that, Pater's sabotage plans will suffer a major blow."
 TRN_we_need_to_be_prepared: "Lessons from the Gehenna Civil War"
 TRN_we_need_to_be_prepared_desc: "According to the Prefect Team-Trinity joint security organization agreement, we have the right to dispatch police forces to the Prefect Team. We were able to gain information on Pandemonium military operations and build tactical knowledge through JTF members. While there is information leaking from our side as well, the information we gain is greater."

 # Nagisa after Unifying Gehenna (Common)
 TRN_rich_man_and_the_eye_of_a_needle: "The Eye of a Needle"
 TRN_rich_man_and_the_eye_of_a_needle_desc: "The National Health Service, abbreviated as 'NHS', is a universal national health insurance system where the state pays all medical expenses for the citizens. While there are criticisms that this will bring about 'Trinity Sickness' due to the welfare budget in the future, the NHS will bring greater benefits than that."
 TRN_rich_man_and_the_eye_of_a_needle_open: "NHS"
 TRN_rich_man_and_the_eye_of_a_needle_default: "NHS: Unenactable"
 TRN_rich_man_and_the_eye_of_a_needle_default_tt: "Until the conditions for designating five social evils in the Nagisa Constitution are prepared, this focus is §Yprohibited§!."
 TRN_minimum_wage_law: "Minimum Wage Law"
 TRN_minimum_wage_law_desc: "Guarantee a reasonable level of minimum wage for workers under the protection of the Host to build a social safety net for the poor within Trinity who engage in low-wage labor."
 TRN_working_hours_limit: "Working Hours Limit"
 TRN_working_hours_limit_desc: "Re-introduce the strict legal limit of '8 hours of labor per day, maximum 48 hours per week including overtime' enacted by the German Reichstag in 1918."
 TRN_affirmative_action: "Affirmative Action"
 TRN_affirmative_action_desc: "Affirmative Action is a quota policy that mandates the employment of various types of social minorities, such as ethnic minorities and the disabled, in the workplace. This system will be a pillar for many weak people to hold on to."
 TRN_affirmative_action_tt: "One §YAndroid General§! who never falls ill, appointed due to the §YMinority Quota§!, is added."

 # Nagisa after Unifying Gehenna (Democratic)
 TRN_expansion_of_the_tea_party_scale: "Expanding the Scale of the Tea Party"
 TRN_expansion_of_the_tea_party_scale_desc: "Our government will not tolerate radical Marxist agitation, including the local Social Democratic Party that dares to claim cabinet formation based on direct elections. However, to collect diverse opinions, doubling the number of Tea Party executives and expanding its scale will be carefully considered."
 TRN_guarantee_of_freedom_of_the_press: "Guarantee Freedom of the Press"
 TRN_guarantee_of_freedom_of_the_press_desc: "Allow the re-publication of local newspapers that were closed after the Great Transfer for engaging in anti-government activities, and the Host will orally promise that no form of press censorship will take place."
 TRN_trinity_carnival: "Trinity Carnival"
 TRN_trinity_carnival_desc: "How about holding a wonderful festival at Trinity that all academies can enjoy? Let the streets be filled with laughter and the scent of fine tea!"
 TRN_trinity_carnival_open: "Trinity Carnival"
 TRN_trinity_carnival_default: "Trinity Carnival: Unenactable"
 TRN_trinity_carnival_default_tt: "Until the conditions are prepared by inserting $TRM_nagisa_constitution_strengthening_federalism$ as a constitutional clause in the Nagisa Constitution, this focus is §Yprohibited§!."
 TRN_birth_of_trinity_pan_nationalism: "Birth of Trinity Pan-Nationalism"
 TRN_birth_of_trinity_pan_nationalism_desc: "Trinity was a 'Federated Academy' from its very beginning. Trinity nationalism does not advertise the excellence of Trinity as a single academy, but declares the unity of all Kivotos in contrast to local nations."
 TRN_faith_for_all: "Faith for All"
 TRN_faith_for_all_desc: "Trinity's faith must provide universal help for all people of Kivotos beyond Trinity itself. As we have provided support for them, we request the Sisterhood also play a role for Kivotos unity."
 TRN_faith_for_all_open: "Sweet Fruit of Unfalsified Faith"
 # Note: Sakura's Pickup Title (伪りなき信仰の甘果, 无伪信仰，甘甜果实)
 TRN_faith_for_all_default: "Sweet Fruit of Unfalsified Faith: Unenactable"
 TRN_faith_for_all_default_tt: "Until the conditions are prepared by making the Trinity faith the state religion in the Nagisa Constitution, this focus is §Yprohibited§!."
 TRN_meeting_with_mika: "Short Night's Starry Dream"
 # Note: Summer Mika Pickup Title (短き夜の星の梦)
 TRN_meeting_with_mika_desc: "The conflict between Filius and Pater has been ongoing for a long time, and considering the personal relationship between Nagisa and Mika, the clash is serious. However, now that the possibility of Pater seizing power has completely vanished, is there no chance for the two of them to join forces again?"
 TRN_meeting_with_mika_tt: "The success probability of this focus depends on how much §Gunchanging trust in others§! Kirifuji Nagisa has shown so far.\n\nThese choices increase success probability:\n  £white_dot §GForgiving§! the §YArius Branch§! by choosing the §Y$TRN_five_clan_republic$§! focus\n  £white_dot §Y$GEH_dkzh$§! or §Y$GEM_perfect_team$§! is currently appointed as an §Gadvisor§!\n  £white_dot §GAccepting§! and learning Millennium science by choosing the §Y$TRN_peaceful_exchange_with_mil$§! focus\n  £white_dot Abandoning §Yhostile attitudes§! toward Germans by choosing the §Y$TRN_idealistic_approach$§! focus\n\nThese choices increase failure probability:\n  £white_dot The §YEden Treaty§! §Rfailed§! due to Pater's interference\n  £white_dot Nagisa has §Rnever§! asked Hifumi for help because the §Y$TRN_german_cultural_revolution$§! focus was not completed\n  £white_dot Nagisa's psychology is unstable because Trinity is currently §Rat war§!"
 TRN_infinite_trust_and_faith: "Infinite Faith and Trust for All"
 TRN_infinite_trust_and_faith_desc: "There were those who called Nagisa 'a demon of suspicion.' However, through many experiences, Nagisa has now decided by her own will to trust her people, her academy, and the goodwill of Kivotos. No matter how strong the darkness of the world, that darkness has not overcome the light."
 TRN_opening_the_old_library: "Opening the Old Library"
 TRN_opening_the_old_library_desc: "Very carefully unseal some of the forbidden books in the Old Library and disclose Trinity's past materials to the public. Since we have already decided to distinguish between Trinity's past sins and the New Trinity, the forbidden books of centuries ago will not be a problem for us now."
 TRN_opening_the_old_library_open: "Unsealing Forbidden Books"
 TRN_opening_the_old_library_default: "Unsealing Forbidden Books: Unenactable"
 TRN_opening_the_old_library_default_tt: "Until the conditions are prepared by inserting Trinity's reflection on past history as a constitutional clause in the Nagisa Constitution, this focus is §Yprohibited§!."
 TRN_new_and_free_trininy_culture: "New and Free Trinity Culture"
 TRN_new_and_free_trininy_culture_desc: "Trinity's new popular culture is being born and spread through exchange with surrounding cultures."
 TRN_new_and_free_trininy_culture_tt: "If §g§Y$TRN_Kyoyama_Kazusa$§! is an advisor, this focus gives an even stronger effect.\n---§!"
 TRN_meeting_with_mine: "Meeting with Mine"
 TRN_meeting_with_mine_desc: "A few years ago that day, actually then... there's a somewhat embarrassing rumor spreading that Seia didn't actually die, but it surely isn't true, is it?"
 TRN_nagisa_democratic_ending: "Where there's a tea party, there's hope."
 TRN_nagisa_democratic_ending_desc: "After ascending to the Host, Nagisa did everything she could for Trinity. Will Nagisa now hand over that burden to her excellent colleagues, or will she continue her duties amidst glorious applause?"
 TRN_nagisa_democratic_ending_tt: "You can see the §Cending§! of Kirifuji Nagisa.\nThere is an opportunity to change the Host, and the Host candidates vary based on the focus choices made so far."
 TRN_nagisa_democratic_ending_after: "The Future After the Tea Party"
 TRN_nagisa_democratic_ending_after_desc: "The sun sets on one chapter of Trinity, only to rise on another. The choices made today will echo in the hallways of the academy for generations to come."
 TRN_nagisa_democratic_ending_after_nagisa: "Kirifuji Always Wins"
 TRN_nagisa_democratic_ending_after_nagisa_desc: "Nagisa decided not to step down from her position. Trinity needs a leader who can carry the burden of Noblesse Oblige. Perhaps several decades later she could seek a successor. The Tea Party will unite even more around Nagisa herself."
 TRN_nagisa_democratic_ending_after_hifumi: "Stepping Half a Foot Out the Door"
 TRN_nagisa_democratic_ending_after_hifumi_desc: "Hifumi is a person with no desire for power, but she rose to the Host position as if being pushed, unable to refuse Kirifuji Nagisa's personal wish. Hifumi is still under Nagisa's shadow, but she is learning politics little by little. Will her personality change to resemble Nagisa in a few years? Surely not..."
 TRN_nagisa_democratic_ending_after_seia: "A Future Never Prophesied"
 TRN_nagisa_democratic_ending_after_seia_desc: "A future where Seia becomes Host again was something even she didn't predict. Seia intends to no longer rely on uncertain future prophecies. If she does what she wants to do, prophecies can always miss the mark."
 TRN_nagisa_democratic_ending_after_atsuko: "Not Just Turnip Root Tea"
 TRN_nagisa_democratic_ending_after_atsuko_desc: "Though she has been respected as Arius's 'Royal Blood' in Trinity, Atsuko remembers the impoverished life in Arius. Trinity must never become like that. She will support Trinity to always maintain 100% food self-sufficiency."
 TRN_nagisa_democratic_ending_after_ako: "Agents in the Night"
 TRN_nagisa_democratic_ending_after_ako_desc: "The future will be an era of information warfare. They said so in spy movies. No? Movies are reality! While the new Host greatly expands the budget for the intelligence department, she strives to recruit informants widely, from beastfolk to local humans."
 TRN_nagisa_democratic_ending_after_mine: "Remedial Knights or Johannine Faction?"
 TRN_nagisa_democratic_ending_after_mine_desc: "Mine had refused to participate in the Tea Party despite being the head of the Johannine faction until now. But after becoming Host through Seia's persuasion and Nagisa's support, she has begun to consider officially incorporating the Remedial Knights as a Tea Party organization."
 TRN_nagisa_democratic_ending_after_hidden_takane: "A Schwibbzick for You"
 TRN_nagisa_democratic_ending_after_hidden_takane_desc: "The Winter Kingdom, the Grand Ducal House of Miyoshi, the meaningful stories about the Winter Kingdom... they're all actually lies. But the whole of Trinity believed those lies and elected 'Grand Duchess Takane' as Host! Argh! Now we absolutely have to make this lie the truth. No compromise. No matter what!" # Hidden
 TRN_nagisa_democratic_ending_after_bug_tt: "If this tooltip appears, it means a critical bug has occurred. Please report the bug."
 
 # Nagisa after Unifying Gehenna (Non-Aligned)
 TRN_iron_woman: "The Iron Woman"
 TRN_iron_woman_desc: "To protect the Alma Mater from anti-government forces, including the Pater faction, a stronger Host is needed. Trinity needs firmer unity centered around Filius, and the idealism of inter-factional democracy can be compromised for the sake of the noble Alma Mater's future."
 TRN_illusion_of_equality: "The Illusion of Equality"
 TRN_illusion_of_equality_desc: "For the elites who have strived for Trinity's success, we officially introduce an investiture system where the Host can grant peerages to suitable individuals."
 TRN_removing_local_parties: "Completely Eradicating Local Parties"
 TRN_removing_local_parties_desc: "Completely outlaw the Social Democratic Party, an ultra-leftist adventurist party, and arrest them all. The venomous nature of local parties will no longer be able to threaten Trinity's ideals."
 TRN_removing_local_parties_tt: "§YStability§! decreases by the amount of §Y$faction_G_name$§! influence, and all influence moves toward §Y$faction_A_name$§!."
 TRN_hope_light_distant_sky: "O Hope, O Light, O Distant Sky"
 TRN_hope_light_distant_sky_desc: "Like the Knights of the Round Table who assisted King Arthur of old, the Tea Party must be reborn as a more closed roundtable conference only for the upper classes, equal within but thoroughly distinguished from the outside."
 TRN_pater_dissolution: "Dissolution of Pater"
 TRN_pater_dissolution_desc: "All legal grounds have been prepared to permanently purge all major executives of the Pater faction, including crimes such as prisoner abuse immediately after the Great Transfer, internal sabotage during the Eden Treaty period, and collusion with anti-regime figures in Germany for that purpose."
 TRN_pater_dissolution_tt: "Half of the Pater faction influence §g(rounded up)§! is §Gadded§! to Filius faction influence."
 TRN_ding_dong_the_witch_is_dead: "Witch Hunt"
 TRN_ding_dong_the_witch_is_dead_desc: "Nagisa is taking a very lenient attitude toward Mika despite all these incidents. But the party line is different. Mika is Nagisa's friend, not Filius's friend, right? A faction-level play where 'Mika, pushed into a corner, tries to remove Nagisa by launching a coup' might be necessary."
 TRN_ding_dong_the_witch_is_dead_trigger_tt: "Failed the §Y$TRM_mika_misono_problem_cat$§! mission §Y2§! or more times."
 TRN_ding_dong_the_witch_is_dead_tt: "The success probability of this focus depends on how much Kirifuji Nagisa has given up on her §Yunchanging trust in others§!.\n\nThese choices increase success probability:\n  £white_dot §YAntagonizing§! §YMisono Mika§! by choosing §Y$TRN_attack_pater$§! and §Y$TRN_attack_mika_misono$§! focuses\n  £white_dot §RDid not complete§! the §Y$TRN_the_route_of_the_sun$§! focus\n  £white_dot Antagonizing Millennium by choosing the §Y$TRN_crusade_against_mil$§! focus\n  £white_dot Maintaining §Yhostile attitudes§! toward Germans by choosing the §Y$TRN_realistic_approach$§! focus\n\nThese choices increase failure probability:\n  £white_dot §GForgiving§! the §YArius Branch§! by choosing the §Y$TRN_five_clan_republic$§! focus\n  £white_dot §Y$GEH_dkzh$§! or §Y$GEM_perfect_team$§! is currently appointed as an §Gadvisor§!\n  £white_dot §GCompleted§! the §Y$TRN_german_cultural_revolution$§! focus!"
 TRN_ding_dong_the_witch_is_dead_effect_tt: "Regardless of success or failure, this focus §Rpermanently severs§! the Nagisa-Mika friendship. Misono Mika can no longer be used as a general."
 TRN_make_up_work_club: "Make-Up Work Club"
 TRN_make_up_work_club_desc: "For the Filius she loves, Nagisa intends to create a 'basket of rotten eggs' gathering Trinity-born who advocate for the expansion of voting rights or liberal ideals. It's not because she doesn't trust them, but because she 'believes' she can temper them with fire to be reborn."
 TRN_make_up_work_club_tt: "A §YPenal Battalion§! template consisting of §Y6 brigades§! is added."
 TRN_birth_of_trinity_pan_nationalism_alt: "$TRN_birth_of_trinity_pan_nationalism$"
 TRN_birth_of_trinity_pan_nationalism_alt_desc: "$TRN_birth_of_trinity_pan_nationalism_desc$"
 TRN_lord_protector_appointment: "Appointment of Lord Protector"
 TRN_lord_protector_appointment_desc: "Only Nagisa can protect those she loves. Who else would sacrifice themselves for those precious to them? The Lord Protector is a new position held concurrently by the Tea Party Host, providing extra-legal powers to enact laws without going through the Council or postpone elections indefinitely."
 TRN_bill_of_attainder: "Bill of Attainder"
 TRN_bill_of_attainder_open: "Bill of Attainder"
 TRN_bill_of_attainder_default: "Bill of Attainder: Unenactable"
 TRN_bill_of_attainder_desc: "A Bill of Attainder is an English common law practice where the legislature (here, the Tea Party) rather than the court designates a specific person as a 'criminal' by a majority vote, allowing that person to be detained and punished without trial. Introducing the English-style Bill of Attainder provides even greater power to Filius, which has seized the majority of the Tea Party."
 TRN_bill_of_attainder_default_tt: "Until the conditions are prepared by inserting $TRM_nagisa_constitution_anti_democracy_holy_war$ as a constitutional clause in the Nagisa Constitution, this focus is §Yprohibited§!."
 TRN_nagisa_neutrality_ending: "Where there's a tea party, there's hope."
 TRN_nagisa_neutrality_ending_desc: "After ascending to the Host, Nagisa did everything she could for Trinity. Following the plan to trust others and cast away suspicion, she trusted everything to Filius and strove for Filius. Nothing is wrong. Right?"
 TRN_nagisa_neutrality_ending_tt: "You can see the §Yending§! of Kirifuji Nagisa."

 

 # Nagisa Diplomacy
 TRN_right_of_the_victor: "Right of the Victor"
 TRN_right_of_the_victor_desc: "Demand ransom for Gehenna officials and politicians captured in the Gehenna Central District. The victor taking a price instead of releasing the defeated is a tradition and a right that has existed since before the Middle Ages a thousand years ago."
 TRN_right_of_the_victor_tt: "The effect of this focus varies depending on who was the §Yleader upon the fall§! of the Pandemonium Society."
 TRN_right_of_the_victor_makoto_tt: "£white_dot Chairman §Y$GEH_akzhxh$§!:"
 TRN_right_of_the_victor_satsuki_tt: "£white_dot Chairman §Y$GEH_satsuki$§!:"
 TRN_right_of_the_victor_iroha_tt: "£white_dot Chairman §Y$GEH_dlfhgk$§!:"
 TRN_right_of_the_victor_chiaki_tt: "£white_dot Chairman §Y$GEH_motomiya_chiaki$§!:"
 TRN_right_of_the_victor_ibuki_tt: "£white_dot Chairman §Y$GEH_dlqnzl$§!:"
 TRN_right_of_the_victor_generic_tt: "£white_dot §YOthers§!:"
 TRN_declaration_of_crusade_towards_the_west: "Formation of the First European Crusade"
 TRN_declaration_of_crusade_towards_the_west_desc: "After the glorious victory of the Filius faction, which loves Trinity's traditions and history, voices are rising among the hardliners of Filius and the Sisterhood to send a 'Spiritual Crusade' toward surrounding countries that haven't been spiritually fulfilled since the Great Transfer. Spreading the teachings of the scriptures more widely and enlightening the forces of unbelievers with upright teachings may indeed be Filius's mission."
 TRN_war_against_cou: "Invasion of Benelux"
 TRN_war_against_cou_desc: "Trinity is not an expansionist nation that desires expansion policies. However, there are claims that the survival of General Student Council-related forces in Benelux is a threat to our national security."
 TRN_recognition_of_cou: "Peace with Benelux"
 TRN_recognition_of_cou_desc: "There is no need to deliberately spark conflict with the General Student Council. Weren't they the balancers who maintained the existing order since before the Great Transfer? The enemies we must fight against are elsewhere."
 TRN_recognition_of_bry_as_cou: "Supporting Aru as GSC President"
 TRN_recognition_of_bry_as_cou_desc: "Trinity is not an expansionist nation that desires expansion policies. However, there are claims that the survival of GSC-related forces in Benelux is a threat to our national security. Fortunately, the GSC is divided over the issue of the rival GSC President, and we have reached the conclusion that the idealist of the 68 Revolution is a better partner in terms of security than the existing GSC."
 TRN_stopping_kaisers_hegemony: "British Crusade"
 TRN_stopping_kaisers_hegemony_desc: "Kaiser's hegemony must now end. It's not because they are a corporate state. It's also because, as a corporate state, they are selling things that are not beneficial to our Trinity citizens. As the weapons sold by Kaiser PMC flow into the black market and continue to worsen Trinity's security, declaring a crusade against them will make Trinity even greater."
 TRN_crusade_against_mil: "Crusade Toward [MIL.GetAdjective]"
 TRN_crusade_against_mil_desc: "While Millennium's excellent science and technology are worth emulating, their atheistic values are like pouring poison into Trinity's ears. We send a crusade not because we hate Millennium, but because we wish for them to go on the right path."
 TRN_peaceful_exchange_with_mil: "Code: BOX"
 TRN_peaceful_exchange_with_mil_desc: "Claims that we should invade Millennium because it is an atheistic nation might please the radicals of the Sisterhood, but it's too fanatical a claim. Of course, it's due to the Sisterhood becoming 'spiritually somewhat full' as they are encouraged by Trinity's successive victories. Instead, we will dispatch an embassy to the Millennium Expo and learn science from Millennium."
 TRN_wild_hunt_protection_proposal: "Protection Proposal Toward [WHY.GetAdjective]"
 TRN_wild_hunt_protection_proposal_desc: "Trinity's Western Crusade now passes Millennium and enters Iberia. We understand the conflict [WHY.GetName] is experiencing with human nations and will strive to accept them into our side."
 TRN_iberian_reconquista: "Iberian Crusade"
 TRN_iberian_reconquista_desc: "The end of the Crusade has finally reached the edge of the European continent! The teachings about the scriptures and the Lord purify the human unbelievers. If they can be enlightened under the true teachings, the damage from the Crusade will be at a manageable level."
 TRN_preparation_for_the_eastern_crusade: "Preparation for the Eastern Crusade"
 TRN_preparation_for_the_eastern_crusade_desc: "The East, the land of atheists, is a frontier that must be marched into for enlightenment."
 TRN_eastern_crusade_for_russia: "Crusade for Great Enlightenment"
 TRN_eastern_crusade_for_russia_desc: "\"...The gatekeeper opens the gate for him, and the sheep listen to his voice. He calls his own sheep by name and leads them out. When he has brought out all his own, he goes on ahead of them, and his sheep follow him because they know his voice.\"\n(John 10:3-4)"
 TRN_belarusian_volunteer_corps_nagisa: "$TRN_belarusian_volunteer_corps$"
 TRN_belarusian_volunteer_corps_nagisa_desc: "It's not that Belarusian history or tradition is important. What's important is that they are ready to join hands with us for de-communization."
 TRN_anti_soviet_resistance_nagisa: "$TRN_anti_soviet_resistance$"
 TRN_anti_soviet_resistance_nagisa_desc: "\"Finally, be strong in the Lord and in his mighty power. Put on the full armor of God, so that you can take your stand against the devil’s schemes. For our struggle is not against flesh and blood, but against the rulers, against the authorities, against the powers of this dark world and against the spiritual forces of evil in the heavenly realms.\" (Ephesians 6:10-12). Therefore, those with will shall resolutely rise to fight against the authorities, those Stalinists, and the devils."
 TRN_ukrainian_unrest_nagisa: "$TRN_ukrainian_unrest$"
 TRN_ukrainian_unrest_nagisa_desc: "We don't trust Ukraine because we know or support the long Ukrainian tradition descending from Kievan Rus' and the heroic struggle of Bohdan Khmelnytsky. We trust them because they have the will to fight against Moscow."
 TRN_preparation_for_the_poland_crusade: "Polish Holy War"
 TRN_preparation_for_the_poland_crusade_desc: "Poland has been experiencing territorial disputes with Trinity since immediately after the Great Transfer. Well, it's more like Trinity launched a preemptive strike. We must first crush the Polish threat that could be a danger in the process of preparing for the Eastern Crusade."
 TRN_preparation_for_the_switzerland_crusade: "Removing the Servants of the Vatican"
 TRN_preparation_for_the_switzerland_crusade_desc: "Switzerland can be seen as a pro-Vatican force that has historically sent mercenaries to Vatican City. To spread Trinity's faith in Europe, removing those who do not align due to differing religious doctrines is a rational 'risk removal'."
 TRN_march_to_the_vatican: "March to the Vatican"
 TRN_march_to_the_vatican_desc: "If they regard Trinity's faith as heresy, we have no choice but to let them know our doctrine is correct. By riding tanks directly to the Vatican."
 TRN_march_to_the_true_rome: "Great Victory of the Trinity Faith"
 TRN_march_to_the_true_rome_desc: "Our faith has been firmly recognized, and the Vatican will be permanently dissolved. May the light and teachings of Trinity be eternal!"
 TRN_crusade_proposal_plana: "Chroma Threat"
 TRN_crusade_proposal_plana_desc: "We have confirmed an invasion by an extra-Kivotos force called 'Chroma.' While it seems their target is the locals rather than us, couldn't that just be a difference in priority?"
 TRN_chroma_navy: "Maritime Crusade"
 TRN_chroma_navy_desc: "To advance into Chroma territory, we must cross the sea or the air. Naturally, preparation for this is necessary."
 TRN_crusade_proposal_malkuth: "Threat of the Absolute Being"
 TRN_crusade_proposal_malkuth_desc: "A 'Machine God' calling itself Decagrammaton is threatening all of Kivotos. We will strike them before they destroy us."
 TRN_decagrammaton_army: "Anti-Machine Combat Research"
 TRN_decagrammaton_army_desc: "To fight against Decagrammaton, an appropriate 'anti-machine' manual is needed. There isn't much time to prepare, but we must succeed to prevent a soulless tin can from standing atop Trinity's spiritual pillars."
 TRN_becoming_the_goddess: "The Final Crusade"
 TRN_becoming_the_goddess_desc: "The giant eagle worships Mammon under the name of money, placing capitalism, not God, at the summit of its temple. As the Lord said, 'Stop turning my Father’s house into a market!' (John 2:16), we shall rightly do so."
 TRN_controlling_madness: "Controlling the Madness"
 TRN_controlling_madness_desc: "The Gourmet Research Society, the Hot Springs Development Department... these madness-stricken psychotics are the issues that give the Host the biggest headache after the Gehenna integration. While the easiest way would be to fire white phosphorus at their heads on the spot (why didn't Hina-部长 do that?), let's first try an compromise. If it fails? We'll worry about that then."
 TRN_five_clan_republic: "Five Clan Republic"
 TRN_five_clan_republic_desc: "Trinity, formed by the alliance of the three major factions Filius, Pater, and Sanctus, has now gained five pillars by integrating Arius following Gehenna. Trinity will promise Arius equal status even under occupation and commit unlimited support for Arius's reconstruction and Trinity's integration."
 TRN_five_clan_republic_arius_tt: "§RWarning§!: Every time Arius completes §Y$ARI_chemical_warfare_preparation$§!, §Y$ARI_holding_arius_council$§!, or §Y$ARI_eden_treaty_interference$§!, the stability penalty from this focus §Rincreases cumulatively§!."
 TRN_five_clan_republic_arius_1_tt: "£white_dot Arius completed the $ARI_chemical_warfare_preparation$ focus:"
 TRN_five_clan_republic_arius_2_tt: "£white_dot Arius completed the $ARI_holding_arius_council$ focus:"
 TRN_five_clan_republic_arius_3_tt: "£white_dot Arius completed the $ARI_eden_treaty_interference$ focus:"
 TRN_five_clan_republic_tt: "The §YGerman National People's Party§! faction changes to the §YArius Faction§!. The Arius Faction will §Gcoalition§! with the government."
 TRN_arius_inquisition: "Arius Inquisition"
 TRN_arius_inquisition_desc: "Arius is an evil incomparable even to Gehenna. While a pagan can wash away sins by being taken as a disciple because they simply did not know the right faith (Matthew 28:19), a heretic can never enter the Kingdom of God because they followed a wicked path despite knowing the right faith (Galatians 5:19-21). We will conduct an inquisition until their heretical ideas are thoroughly destroyed."
 TRN_arius_inquisition_tt: "The §YGerman National People's Party§! faction changes to the §YArius Faction§!. Half of the Arius faction influence §g(rounded up)§! is §Gadded§! to Filius faction influence."
 TRN_arius_diplomacy_tt: "The effect of this focus varies depending on whether the Arius Branch chose §YArius Squad§! or the §YNicomeidia Troop§! as their leader."
 TRN_arius_diplomacy_squad_tt: "To be added after the Arius rework!"
 TRN_arius_diplomacy_nicomedia_troop_tt: "To be added after the Arius rework!!!"
 TRN_two_church_unity: "Unifier of the Two Churches"
 TRN_two_church_unity_desc: "Moscow, which became the heart of the Orthodox Church after the fall of Constantinople, has fallen into our hands. Through the efforts of [ROOT.GetLeader], both Catholicism and Orthodoxy are placed under Trinity's flag, and the Trinity Church has become the center of all true faith."
 TRN_the_route_of_the_sun: "The Route of the Sun"
 TRN_the_route_of_the_sun_desc: "Even if you bump into someone and fight as if you're going to kill them, in the end, after that fight, you come to love the person you disliked. That itself is like a youth romance novel. Our relationship with them was like that."
 TRN_the_route_of_the_sun_tt: "The effect of this focus varies depending on what decision the Gehenna Prefect Team made at the §YSecond Prefect Team General Meeting§!."
 TRN_the_route_of_the_sun_ako_tt: "The Prefect Team completes §Y$GEH_ako_route_focus$§!:\n£white_dot Amau Ako's name is changed to Sorasaki Ako\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_iori_tt: "The Prefect Team completes §Y$GEH_iori_route_focus$§!:\n£white_dot §YWar Support§! +0.05%\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_hina_tt: "The Prefect Team completes §Y$GEH_hina_route_focus$§!:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_the_route_of_the_sun_generic_tt: "The Prefect Team completes §Y$GEH_main_route_focus$§!:\n£white_dot $TRN_german_new_culture_order_modifier_change$:"
 TRN_red_winter_takane_hidden_focus: "Archduchess of the Frozen Kingdom"
 TRN_red_winter_takane_hidden_focus_desc: "Since our recent occupation of Red Winter, we have obtained information regarding the Miyoshi Ducal House, an ancient noble family suppressed by the oppressors of Red Winter. After deliberation, the Host has decided to recognize the title of Archduchess Miyoshi Takane and accept her as a new officer of Philius."
 TRN_union_of_faith: "United Sisters of Faith"
 TRN_union_of_faith_desc: "Trinity no longer stands alone. Under a firm bond with our sisters of faith, we shall march forward together toward victory."
 TRN_disobedience_of_the_subjects: "Home Guard"
 TRN_disobedience_of_the_subjects_desc: "The war is not going well. Now that the Trinity mainland is being ravaged by the invaders' attacks, those of red blood must take to the battlefield for the sake of the blue bloods."
 TRN_disobedience_of_the_subjects_tt: "A militia division template consisting of §Y6 brigades§! will be added."
 TRN_sending_missionaries_to_allies: "Send Missionaries to Allies"
 TRN_sending_missionaries_to_allies_desc: "The Trinity faith has not yet spread widely to other schools within Kivotos, but with the Sisterhood's role expanding after the Great War, it has begun to be actively preached abroad. Perhaps faith can connect us and them as one."
 TRN_sending_missionaries_to_allies_tt: "Countries that become allies of §Y[ROOT.GetName]§! after completing this focus can subsequently accept missionaries through decisions costing Political Power."
 TRN_trinity_loop_rail_line: "Trinity Railway Bureau"
 TRN_trinity_loop_rail_line_desc: "What could be more important for war and expansion than rapid troop transport via rail? Trinity's own Railway Bureau, not owned by Highlander, will connect rail lines even to the most underdeveloped regions."

