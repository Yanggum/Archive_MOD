 TRM_arius_reclaim: "Operation Arius Reclamation"
 TRM_arius_reclaim_desc: "The Arius Reclamation Operation means more than mere territorial recovery. It will secure physical control while completing the previously unstable union system, increasing the legitimacy of the [ROOT.GetLeader] regime."
 TRM_anti_gehenna_idea: "Anti-Gehenna Sentiment"
 TRM_anti_gehenna_idea_desc: "Due to the long-ago war, most Trinity students harbor strong anti-Gehenna feelings. This hatred helps combat effectiveness during war, but will be a major obstacle during the reconstruction phase."
 TRM_anti_gehenna_idea_tt: "Negative effects occur upon occupying @GEM§YGehenna Academy§!'s core states at the start.\n"
