 trnsocial.1.t: "키보토스인 금지"
 trnsocial.1.desc: "평화로운 오후 시간에도, 트리니티 중앙구의 거리에서는 차별의 그림자가 여전히 사라지지 않고 있습니다. 많은 상점들은 하나같이 ‘키보토스인 금지’라는 독일어 팻말을 내걸고 있으며, 그 아래에는 삐뚤빼뚤하게 적힌 키보토스 언어도 함께 보입니다.\n\n트리니티 학생들이 이러한 상황을 달가워하지 않는 것은 당연한 일입니다. 특히 일부 호전적인 학생들은 차별적인 상점에 대해 사적인 제재를 가하기도 합니다. 정의실현부의 신속한 개입으로 피해는 일정 부분 억제되고 있습니다."
 trnsocial.1.a: "곤란해"

 trnsocial.2.t: "노동자 파업"
 trnsocial.2.desc: "트리니티의 공장들은 자동화가 점차 진행되고 있지만, 아직 트리니티화가 이루어지지 않은 지역에는 여전히 노동자들이 근무하고 있습니다. 특히 여러 부문에서 독일인 노동자들은 유용한 인력으로 활용되고 있습니다.\n\n그럼에도 불구하고 문제가 존재하는데, 그것은 바로 노동조합의 존재입니다. 구 독일 지역의 NSDAP 산하 어용 노조였던 독일노동전선은 로베르트 라이를 중심으로 조직적인 결속을 유지하고 있으며, 트리니티의 공장에서 파업과 폭력 시위를 벌이며 저항하고 있습니다. 특히 이들의 주요 목표는 트리니티 정부의 타도에 있으며, 이러한 노골적인 정치적 파업은 일부 도시에서 지역 법 집행기관이 질서 유지에 어려움을 겪고 있다고 보고할 정도로 확산되고 있습니다."
 trnsocial.2.a: "정의실현부를 더 동원하라."
 trnsocial.2.b: "노동자들과 협상하자."
 trnsocial.2.c: "그러든가."
 trnsocial.3.t: "관공서에 대한 폭탄 테러"
 trnsocial.3.desc: "놀라운 전개 속에, 누군가가 제작한 사제 폭탄이 관공서에서 폭발하는 사건이 발생했습니다. 이 폭탄 테러로 인해 수십 명이 중상을 입었으며, 부상자들은 구호기사단의 차량을 통해 인근 병원으로 긴급 이송되었습니다. 폭발의 위력은 상당하여 대형 유리창이 10장 넘게 산산조각이 나는 등 주변 건물에 큰 피해를 입혔습니다.\n\n다행히도, 해당 지역은 당시 보수 공사가 진행 중이었고 일반 학생이나 주민들의 출입이 제한되어 있어 직접적인 희생자는 발생하지 않았습니다. 그러나 이 사건은 트리니티 내부의 불안정성과 치안의 허점을 여실히 드러내는 계기가 되었으며, 현재 학원정보원과 정의실현부는 사건의 배후 세력을 추적 중입니다."
 trnsocial.3.a: "\"테러리스트를 용서하는 것은 신에게 달렸지만 그들을 신에게 보내는 것은 내게 달렸다\""
 trnsocial.4.t: "\"폴크스앰펭거\""
 trnsocial.4.desc: "폴크스엠펭거(Volksempfanger)는 나치 독일이 제작한 저가형 진공관 라디오로, 대중이 쉽게 구매할 수 있도록 설계되었습니다. 이는 나치 정부가 라디오의 중요성을 인식하고, 선전 도구로 활용하기 위해 전국적인 보급에 힘쓴 결과였습니다. 그 결과, 독일 국민 두 명 중 한 명이 라디오를 소유할 정도로 폭넓게 보급되었습니다.\n\n최근, 라디오 방송이 다시 등장하고 있습니다. 그 배경에는 트리니티에 저항하는 민병대가 방송국을 장악하고, 이를 통해 반트리니티적 메시지를 독일 대중에게 송출하고 있기 때문입니다. 이 방송은 일부 트리니티 학생들에게까지 퍼지고 있어, 그 영향력이 점차 확산되고 있는 상황입니다."
 trnsocial.4.a: "이러한 라디오 방송을 당장 멈춰야 한다."
 
 TRN_Mika_honor_decision_cat: "미소노 미카의 명예"
 TRN_Mika_honor_decision_cat_desc: "§P미소노 미카§!에게 있어 §H'명예'§!란 단순히 타인의 평가나 평판에 그치지 않습니다. 그것은 §H그녀의 신념§!이자 내면의 중심이며, 스스로에게 부여된 하나의 §H사명§!이기도 합니다. 그리고 그 명예에 따라, 미소노 미카의 운명이 결정됩니다.\n\n§P미소노 미카 정권§!이 유지되는 동안, 그녀는 수많은 선택과 정책을 실행하는 과정에서 스스로의 명예를 평가하게 됩니다. 미카는 자신의 명예를 높다고 여기거나, 반대로 낮게 판단할 수도 있으며, 이러한 자기 인식은 정권의 방향성을 결정짓는 중요한 기준이 됩니다. 특정 성향이 뚜렷해질수록, 점차 더 극단적인 선택지들이 그녀 앞에 모습을 드러내게 될 것입니다.\n\n"
 Trinity_Mika_Honor_TT: "§P미소노 미카의 명예§!는 현재 [TRN_Mika_Honor_Script_loc]입니다."
