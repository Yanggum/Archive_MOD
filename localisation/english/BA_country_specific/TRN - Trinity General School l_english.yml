 TRN_Mika_honor_loop_decision: "미소노 미카의 개인 일정"
 TRN_Mika_honor_loop_decision_desc: "당연한 말이지만, 미소노 미카 호스트의 임기는 과거처럼 1년으로 제한되지 않습니다. 신헌법이 보장하는 한도 내에서, 그 기간은 얼마든지 연장될 수 있습니다. 그렇기에 미소노 미카는 앞으로 수많은 사건들을 발생 시킬 것입니다."
 TRN_Mika_honor_loop_decision_tt: "§Y미소노 미카§!의 일상적인 사건들이 §Y발생§!합니다."
 TRN_honor_populist_policies: "대중주의 정책 통과"
 TRN_honor_populist_policies_desc: "이상적인 언변만으로는 사람들의 신뢰와 지지를 얻을 수 없습니다. 말보다 행동이 필요합니다. 우리는 가장 도움이 절실한 이들을 위해 실질적인 조치를 취할 것입니다. 가난한 이들에게는 기본 식료품 보조금을, 실업자와 대전이 당시 부상입은 전투병들, 복지 수급자들에게는 겨울철 연료와 식량을 구입할 수 있도록 공공 지원을 제공할 것입니다."
 TRN_honor_social_change: "사회 변혁"
 TRN_honor_social_change_desc: "'트리니티 사회주의'는 노동자와 자본가가 협력하는 계급협조와 협동조합주의를 기반으로 하며, 기독교적 교리에 따라 사회적 연대를 실현하려는 이념입니다. 그러나 이상과는 달리, 현실 속에는 여전히 독일국과 구체제의 잔재들이 곳곳에 남아 우리 앞길을 가로막고 있습니다. 이제 우리는 그 뿌리 깊은 유산들을 철저히 청산해야 할 때입니다."
 TRN_honor_spread_of_militarism: "군국주의 확산"
 TRN_honor_spread_of_militarism_desc: "트리니티의 대의를 실현하기 위해서는 게헨나에 대한 복수를 반드시 완수하고, 나아가 키보토스에서 가장 강력한 군대를 구축해야 합니다. 이를 위해 조기 군사 교육을 통해 차세대 구성원들에게 국가 방위의 중요성과 책임감을 심어주는 체계를 정립할 필요가 있습니다. 트리니티 사회 전반에 걸쳐 안보 의식을 강화하고, 단결된 힘으로 미래의 위협에 대응할 준비를 갖춰야 합니다."
 TRN_honor_technocrat: "기술관료 강화"
 TRN_honor_technocrat_desc: "근본적으로 일반 학생들이 국가를 경영하기란 매우 어렵습니다. 행정과 통치에는 단순한 열정만으로는 부족하며, 체계적인 사고와 검증된 충성이 필수적입니다. 그렇기에 우리는 이념적으로 검증된 충성심 높은 엘리트들을 정부 전반에 등용하여 행정의 전문성과 효율성을 끌어올려야 합니다."

 TRN_honor_new_curriculum_support: "교육과정 확대 지원"
 TRN_honor_new_curriculum_support_desc: "기존의 미션스쿨 중심 교육 방식에서 문화적 소양과 사회적 연대를 강조하는 새로운 교육과정은 많은 학생들에게 여전히 낯설게 다가옵니다. 익숙했던 체계가 바뀌자 일부는 혼란을 느끼기도 합니다. 그러나 이 변화는 단지 낯섦의 문제가 아닙니다. 적절한 교육이 시행된다면, 이러한 새로운 개념들도 학생들에게 자연스럽게 받아들여질 것이며, 결국에는 모교 트리니티의 정체성과 조화를 이루는 데 큰 역할을 하게 될 것입니다"
 TRN_honor_protection_of_the_Jewish_community: "유대인 공동체 보호"
 TRN_honor_protection_of_the_Jewish_community_desc: "유대인들은 독일국의 광기 속에서 오랜 세월 박해받아 온 민족입니다. '배후 증상설'과 같은 조작된 음모론은 유대인 공동체를 붕괴시키는 도구로 사용되었고, 사람들은 유대인이라는 이유만으로 폭력을 저지르고도 제대로 된 처벌조차 받지 않는 일이 비일비재했습니다. 이제는 이들에 대한 보호가야말로 진정한 '정의의 실현'이 될 것입니다."
 TRN_honor_utilize_the_church_authority: "시스터후드 권위 이용"
 TRN_honor_utilize_the_church_authority_desc: "시스터후드는 트리니티의 신앙적 정통성을 자처하며, [TRM.GetNameDef] 지역에서 구빈 활동과 사회봉사를 지속해오고 있습니다. 이들의 헌신적인 모습은 많은 학생들과 시민들의 존경을 받고 있습니다. 그러나 미소노 미카는 이러한 시스터후드의 도덕적 권위를 활용해 학생들 사이에 '트리니티 사회주의'라는 새로운 이념을 은밀히 퍼뜨릴 계획입니다. 물론 이는 정치적 중립을 지키겠다는 시스터후드 내부 규율을 정면으로 위반하는 일이 될 것입니다."

 
 
 trinity_honor_events.1.t: "무인 병동에서의 도난 사건"
 trinity_honor_events.1.desc: "\"흐아앙, 선배! 또 놓치고 말았어요.\"\n하나에가 울먹이며 말했다. \n\n\"괜, 괜찮아요 하나에 쨩 그래도 다친 사람은 없어서 다행인거 같네요….\"\n하나에의 등을 토닥이며 세리나가 위로하고 있다.\n\n\n\"으응, 그러니까 도난 사건과 관련해서 정의실현부의 도움이 필요하다는 거네?\"\n미카는 천천히 보고서를 읽어가며 혼잣말을 하고 있었다. 최근 사이 정의실현부가 "
 trinity_honor_events.1.a: "\"정의실현부가 조금 고생하면 되지..않을까..?\""
 trinity_honor_events.1.b: "\"정의실현부도... 각자의 일로 바쁠 텐데.. 미안해!\""

 trinity_honor_events.2.t: "정의실현부의 과잉진압 문제"
 trinity_honor_events.2.desc: "\"꺄아악!\"\n\n\"소란 피우지 마! 계속 반항하면 험한 꼴을 보게 될 줄 알아!\"\n\n\"넌 그냥 학원에서 인질 협상금을 지불할 때까지 얌전히 여기 붙잡혀 있으면 되는 거야. 괜히 엉뚱한 생각하지 마!\"\n\n\"네? 트리니티 학원이랑 협상을 했다고요?\"\n\n\"앙? 당연하지! 벌써 연락은 끝났다고.\"\n\n\"아.. 안 돼!! 피해요!! 구석으로!!\"\n\n-콰아앙-!!\n\n\"키힛- 키헤헤헤헤헤-!\"\n\n\"히.. 히익! 다.. 다가오지 마! 크아악-!\"\n\n\"그래서 사람이 그렇게 찌그러졌다고..? 와.. 와오... 응. 진짜 무서운 여자네, 츠루기 쨩...\"\n\n사건 이후에도 트리니티 학생들을 노린 납치 범죄는 좀처럼 줄어들 기세를 보이지 않고 있습니다.\n평소처럼 티파티는 정의실현부의 츠루기를 협상가로 파견했지만, 그녀에겐 항상 과잉진압이라는 언론의 꼬리표가 따라붙고 있습니다. 특히 이번 사건에서 구겨진 캔 콜라처럼 처참한 모습인 납치범들의 상태가 언론을 통해 공개되자, 정의실현부는 강도 높은 비난에 직면했습니다.\n\n그나마 다행인 것은 인질 전원이 심각한 부상 없이 구조되었다는 점입니다. 하지만 그 중 몇몇은 극심한 스트레스로 인해 PTSD를 호소하고 있습니다. 구호기사단의 진단에 따르면, 최소 3주 이상의 안정이 필요하다고 합니다."
 trinity_honor_events.2.a: "\"츠루기 쨩의 방식도 마음에 들지만, 문제가 발생 한다면 고쳐야 해.\""
 trinity_honor_events.2.b: "\"그래도 범죄자를 상대로 소란을 피우는 건... 딱히 신경 쓰지 않아도 될거 같은데?\""

 trinity_honor_events.3.t: "롤케이크 하나"
 trinity_honor_events.3.desc: "\"응! 그래, 바로 이거야!\"\n\n미카는 들뜬 표정으로 롤케이크를 든 손을 살짝 흔들었다.\n\n\"이 폭신폭신한 시트! 그냥 빵이 아니라, 폭신하고 부드러워서 입에 넣으면 사르르 녹아내리는 이 느낌! 그리고 이 안에 가득 들어있는 생크림! 너무 달지도 않고, 그렇다고 밍밍하지도 않고, 딱 좋다고! 시트랑 생크림이 딱 어우러져서... 입안에 넣으면... 으으음~ 완전 행복해지는 맛이야!\"\n\n\"가끔은 롤케이크처럼 겉과 속이 전부 부드러웠으면 좋겠어... 그치? 겉은 폭신하고, 속은 달콤한 크림으로 가득 차서... 세상이 아무리 딱딱하고 차가워도 나만 행복하면 되는 거잖아? 히히...!\"\n\n미카는 남은 롤케이크를 한 입에 쏙 넣어버렸다. 더 이상 말할 필요도 없이, 미카의 얼굴에는 더없는 만족감이 가득했다. 이 작은 행복이 그녀를 지탱하는 힘이 될 것이 분명했다."
 trinity_honor_events.3.a: "\"하아~ 역시... 롤케이크는 진리라니까~!\""

 trinity_honor_events.4.t: "티 파티"
 trinity_honor_events.4.desc: "미카는 텅 빈 맞은편 의자를 씁쓸한 눈으로 바라보았다. 화려한 케이크와 쿠키들, 완벽하게 우려진 홍차도 지금은 그저 씁쓸하게만 느껴졌다.\n\n\"이 예쁜 케이크도, 맛있는 홍차도... 혼자 먹으니까 하나도 안 맛있잖아...!\"\n\n손에 든 포크로 케이크 시트를 쿡쿡 찌르며 괜한 화풀이를 했다.\n\n\"혼자서 뭘 하라는 거야... 외롭잖아...!\"\n\n울적한 목소리가 정원에 흩어졌다. 미카는 애써 밝은 척해 보려 했지만, 결국 홀로 남겨진 외로움을 감출 수는 없었다. 따뜻한 햇살 아래, 미카는 외톨이 공주님처럼 티 테이블에 앉아 있었다."
 trinity_honor_events.4.a: "\"혼자 마시는 티타임... 이젠 익숙해질 법도 한데.\""

 trinity_honor_events.5.t: "공주님 이야기"
 trinity_honor_events.5.desc: "정말 오랜만에 가져보는 혼자만의 시간이었다. 끝없이 이어진 회의와 지루한 문서 작업. 쌓여만 가는 공문들을 겨우 다 처리하고 나니, 시계는 벌써 자정을 훌쩍 넘긴 시간이었다. 창밖으로는 칠흑 같은 어둠이 내려앉아 있었고, 멀리서 들려오는 순찰대 아이들의 발소리만이 고요한 밤을 깨울 뿐이었다.\n\n피곤함이 몰려왔지만, 이 시간을 놓치고 싶지 않았다. 침대에 몸을 기댄 채, 머리맡에 놓아두었던 책 한 권을 꺼내 들었다. 표지를 넘기자, 오래된 종이 냄새와 함께 익숙한 활자들이 눈에 들어왔다.\n\n\"...다시 왕국의 왕녀로 돌아온 그녀는, 이제 더 이상 과거의 철부지 아가씨가 아니었다. 그녀의 눈빛은 무수한 고난과 시련을 겪으며 더욱 단단해졌고...\"\n\n아, 맞아. 이 책, 예전에 한창 읽다가 바쁜 일이 터져서 중간에 멈췄었지. 내용이 어디까지였더라? 기억을 더듬으며 한참을 읽어 내려갔다. 주인공인 왕녀가 자신의 운명을 깨닫고, 잃어버린 왕국을 되찾기 위해 모험을 떠나는 이야기... 후후, 왠지 모르게 남 일 같지 않아서 더 집중되는 걸. 바깥은 이렇게 조용하고 평화로운데, 책 속의 왕녀는 끊임없이 고난을 겪고 있었다. 몬스터가 튀어나오기도 하고, 위선적인 기사가 그녀의 앞을 막아서기도 했다. 그런데도 왕녀는 포기하지 않았다. 오히려 더 강해지는 모습이... 왠지 모르게 멋있네.\n\n나도 왕녀처럼 될 수 있을까? 뭐, 지금도 충분히 왕녀님이라고 불리긴 하지만! 그래도... 왠지 모르게, 나도 이 왕녀처럼, 나 혼자만의 힘으로 이 난관들을 헤쳐나갈 수 있을 것만 같은 기분이 들었다.\n\n조용히 책장을 넘기는 소리만이 방 안을 채웠다. 밖은 아직 어두웠지만, 내 마음속은 어느새 환한 빛으로 채워지고 있었다. 그래, 내일은 또 내일의 해가 뜰 테니까. "
 trinity_honor_events.5.a: "\"힘내자, 나!\""

 trinity_honor_events.6.t: "카페 거리에서의 총격전"
 trinity_honor_events.6.desc: "티파티 정규 회의에서 한 안건이 올라왔다. 바로 카페 거리에서의 총격전이었다.\n\n한정 디저트 위에 딸기가 있었다. 방과후 디저트부와 여러 학생들이 그 딸기를 노렸다. 쟁탈전이 벌어졌다. 정의실현부의 츠루기가 진압 했다. 부상자가 발생 했다. 구호기사단의 상당한 약품과 붕대가 소비 됐다."
 trinity_honor_events.6.a: "예산안을 찬성하는 미카 말투"
 trinity_honor_events.6.b: "예산안을 거부하는 미카 말투"

 trinity_honor_events.7.t: "신경증"
 trinity_honor_events.7.desc: "그날, 미소노 미카는 아침부터 신경이 곤두서 있었다. 커피 맛이 평소보다 밍밍하다는 이유로 잔을 내려치고, 비서가 건넨 서류의 내용이 마음에 안 든다고 날카롭게 쏘아붙였다. 비서의 얼굴이 굳어가는 걸 알면서도, 멈출 수가 없었다.\n\n결국 그녀는 사무실 문을 쾅 닫고 나와, 도심에서 벗어난 별장으로 몸을 옮겼다. 차창 너머로 스치는 풍경조차 짜증스러웠다. 나무가 너무 많고, 바람은 시끄럽게 불며, 풀 냄새가 코끝을 괴롭혔다. 별장 안에 들어서자, 더 이상 갈굴 사람도 없었다. 대신 고요한 공간이 그녀를 마주했다."
 trinity_honor_events.7.a: "미카는 소파에 주저앉아 무릎을 끌어안고 있었다."

 trinity_honor_events.8.t: "외로움"
 trinity_honor_events.8.desc: "\"그날은 유독 조용했어. 창밖은 핑크빛 노을로 물들고, 나는 혼자 티파티 궁전의 옥상에 있었지. 나기 쨩도, 세이아 쨩도... 다들 없어. 문득 주변을 둘러보니, 아무도 없는 게 너무나도 크게 느껴졌어. 이 넓은 곳에 나 혼자만 덩그러니 남겨진 기분. 왠지 모르게... 가슴 한구석이 텅 빈 것 같더라.\"\n\n\"미카 님, 죄송하지만 저는 비서입니다. 고민을 들어줘도 해결할 수는 없습니다.\""
 trinity_honor_events.8.a: "\"응? 아, 미안 비서 쨩.\""

 trinity_honor_events.9.t: "시스터후드의 선교 활동"
 trinity_honor_events.9.desc: "블라블라블라 시스터후드와 접촉한 이후 시스터가 활동한다. 근데 선교 내용이 이상하다 어쨌거나 저째꺼나 우리는 이들을 제지해야한다. 근데 그러면 사쿠라코의 특성을 더 좋게 못바꿔준다. 슬프지만"
 trinity_honor_events.9.a: "막진 않겠다고 하는 미카 말투"
 trinity_honor_events.9.b: "막으라고 하는 미카 말투"
 
 TRM_power_balance: "파테르 분파의 경향"
 TRM_bop_balanced: "파테르 분파"
 TRM_tirinty_socialism: "협동주의자"
 TRM_bop_soc_50: "떠오르는 트리니티 사회주의"
