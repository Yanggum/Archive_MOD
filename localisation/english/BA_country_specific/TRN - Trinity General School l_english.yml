## 판데모니움 소사이어티 디시전
 eden_treaty_negotiation_imperial_metrology: "트리니티 특색 황실도량형"
 eden_treaty_negotiation_imperial_metrology_desc: "게헨나 학생들에게 트리니티와의 에덴 조약이 맺어지면, 미터법이 폐지되고 야드파운드법을 쓰게 된다고 선전합니다. 아니, 어쩌면 단순한 선전이 아닐지도 모릅니다. 트리니티의 마녀들이라면 진짜로 야드파운드를 가져올지도 모르는 법 아니겠어요? 트리니티에서는 '톤'이 1,016.047 킬로그램(2,240 파운드)라고 하던데요! 16.047 킬로그램만큼 화나네요!"
 eden_treaty_negotiation_prefect_team_leader_hasumi: "선도부장 하스미 음모론"
 eden_treaty_negotiation_prefect_team_leader_hasumi_desc: "에덴 조약이 맺어지고 난 뒤 게헨나에는 어떤 변화가 찾아올까요? 이미 트리니티는 소위 '공동 경찰' 운운하며 게헨나에서도 치안 활동을 하려고 하고 있습니다. 소위 'ETO'라는 공동군사조직의 첫 삽을 뜨고 있는 셈이죠.\n\n네. 공동으로 치안을 유지한다! 그것은 곧 파르페를 한 끼에 여섯 컵씩 집어먹는 하스미가 게헨나 땅에 눌러앉아, 게헨나의 자유를 억압하고 이부키의 푸딩까지 뺏어 먹을 것이라는 뜻이기도 합니다. 얼마나 끔찍하고 무시무시한 이야기입니까? 주간 만마전이 이 소식을 널리 알릴 겁니다."
 eden_treaty_negotiation_weekly_pandemonium: "주간 만마전에서 언론 플레이"
 eden_treaty_negotiation_weekly_pandemonium_desc: "주간 만마전의 대중적인 인기가 그렇게 높지 않다는 것은 그렇다고 치더라도, 언론은 우리가 가장 잘 사용할 수 있는 선전 도구입니다. 선도부와 트리니티 양측에 대한 비방 기사는 대중들의 여론을 다소 뒤흔들 수 있을 것으로 예상됩니다."
 eden_treaty_negotiation_talk_makoto: "[ROOT.GetLeader]의 여론 선동"
 eden_treaty_negotiation_talk_makoto_desc: "우리의 지도자가 직접 대중들 앞에서, 에덴 조약의 불합리함과 [GEH.GetLeader], [TRM.GetLeader] 두 사람의 밀실 합의를 비난합니다. 근거가 있는지 여부가 중요한 것이 아니라, 대중들에게 불안감을 심어놓을 수 있는가가 중요합니다."

## 트리니티 종합학원 디시전
 eden_treaty_negotiation_trinity_propaganda: "트리니티 프로파간다"
 eden_treaty_negotiation_trinity_propaganda_desc: "파테르 분파가 아무리 광견병에 걸린 개처럼 짖는다고 하더라도, 집권 세력은 우리입니다. 중요한 것은 우리가 장악하고 있는 트리니티의 여러 언론 기관들이 에덴 조약의 중요성과 게헨나에 대한 적개심 약화를 위한 선전을 이어갈 것이라는 것입니다."
 eden_treaty_negotiation_pro_gehenna: "친게헨나적 문화 선동"
 eden_treaty_negotiation_pro_gehenna_desc: "게헨나의 문화가 트리니티 학생들에게 나쁘지 않거나, 심지어는 우아해보이도록 하는 마케팅을 사용합니다. 가장 좋은 프로파간다 대상은 쿠로다테 하루나가 될 것입니다. 다소 머저리 같은 여자이기는 하나 귀품 있는 언행과 몸짓을 가지고 있기에, 적절한 편집을 통해 내보낸다면 게헨나와 트리니티가 그다지 다르지 않다는 인식을 대중들에게 심어줄 수 있습니다."
 eden_treaty_negotiation_pro_prefect_team: "선도부와의 공동 치안 활동"
 eden_treaty_negotiation_pro_prefect_team_desc: "트리니티의 치안을 지키는 비-정의실현부 조직은 이제 자경단만이 아닙니다. 에덴의 거리에서부터 시골의 오두막까지 게헨나 선도부의 실행부원들이 치안 유지에 협조하고 있으며, 헬멧단과 파시스트들을 파괴하는 게헨나의 영웅들은 대중들에게 큰 인상을 남길 수 있습니다."
 eden_treaty_negotiation_talk_nagisa: "[ROOT.GetLeader]가 전면에 나서기"
 eden_treaty_negotiation_talk_nagisa_desc: "[ROOT.GetLeader]가 사교 파티, 도서 출간회 등의 행사를 열며 트리니티의 부유층들을 직접 설득합니다. 호스트와의 만남은 놀라운 설득의 힘을 가지고 있습니다."
 eden_treaty_negotiation_remove_host: "트리니티 침공설에 대처"
 eden_treaty_negotiation_remove_host_desc: "[GEH.GetLeader] 측이 필리우스 분파와 손잡고 트리니티를 침공할 것이라는 소문에 대처하기 위해, [ROOT.GetLeader] 측이 당당하게 트리니티의 현 방어 정책을 공개합니다."
 eden_treaty_negotiation_remove_sardine_pie: "정어리 파이 음모론에 대처"
 eden_treaty_negotiation_remove_sardine_pie_desc: "아주 터무니 없는 음모론입니다. 게헨나 거리에서 촬영한 인터뷰 영상 하나면 사그러들 음모론이기도 합니다."
 eden_treaty_negotiation_remove_angry_JTF: "정의실현부 내부 반발에 대처"
 eden_treaty_negotiation_remove_angry_JTF_desc: "정의실현부를 직접 찾아가, [ROOT.GetLeader] 측이 트리니티와 게헨나의 연합이 가지는 평화의 이점에 대해 설득하고, 선동을 이어가는 파테르 분파야 말로 트리니티의 안보를 해치는 가장 큰 위협이라고 설득할 것입니다."

## 파테르 디시전 (AI가 선택, 미션 형태)
 eden_treaty_negotiation_host: "[eden_treaty_negotiation_host_loc]"
 eden_treaty_negotiation_host_desc: "[eden_treaty_negotiation_host_desc_loc]"
 eden_treaty_negotiation_host_hina: "소라사키 히나 트리니티 침공설" # 선도부장 히나
 eden_treaty_negotiation_host_hina_desc: "파테르 분파는 필리우스 분파가 지속적으로 에덴 조약을 추진하는 이유가, 게헨나 선도부와의 공조를 통한 쿠데타를 준비하고 있다고 주장합니다. 파테르 분파의 나팔수에 따르면, 필리우스의 새로운 수장이 된 소라사키 히나가 전차를 몰고 에덴에 들어와 호스트직을 승계받을 것이라고 말하고 있습니다.\n\n논리적으로 볼 때, 정말로 그런 음모가 이루어지고 있다면, 호스트가 이미 알아차렸을 겁니다. 적어도 트리니티 호스트실에 그와 같은 썩은 찻잎 같은 음모가 들려온 적은 없었습니다. 문제는 다소 멍청한 대중들이 부화뇌동할 것이라는 점입니다."
 eden_treaty_negotiation_host_ako: "아마우 아코 트리니티 침공설" # 선도부에서 히나가 탈주했을 경우
 eden_treaty_negotiation_host_ako_desc: "파테르 분파는 필리우스 분파가 지속적으로 에덴 조약을 추진하는 이유가, 게헨나 선도부와의 공조를 통한 쿠데타를 준비하고 있다고 주장합니다. 파테르 분파의 나팔수에 따르면, 필리우스의 새로운 수장이 된 아마우 아코가 전차를 몰고 에덴에 들어와 호스트직을 승계받을 것이라고 말하고 있습니다.\n\n논리적으로 볼 때, 정말로 그런 음모가 이루어지고 있다면, 호스트가 이미 알아차렸을 겁니다. 적어도 트리니티 호스트실에 그와 같은 썩은 찻잎 같은 음모가 들려온 적은 없었습니다. 문제는 다소 멍청한 대중들이 부화뇌동할 것이라는 점입니다."
 eden_treaty_negotiation_sardine_pie: "트리니티의 자랑 정어리 파이"
 eden_treaty_negotiation_sardine_pie_desc: "파테르 분파의 주장에 따르면, 게헨나의 학생들은 우리가 매일 정어리 파이를 먹고 살며, 아침에는 빵과 빵 사이에 빵을 끼운 토스트 샌드위치를 나누어 먹는다고 믿는다고 말합니다. 비록 트리니티의 음식 문화에 대한 다양한 의견이 있을 수 있으나, 이것은 터무니 없는 음해일뿐더러, 게헨나 학생들이 트리니티 요리를 매우 질 낮은 무언가로 생각한다는 말도 안 되는 갈라치기기입니다. 하지만 일부의 트리니티인들이라도 파테르의 거짓말을 믿게 될 지 모릅니다..."
 eden_treaty_negotiation_angry_JTF: "정의실현부 내부 반발"
 eden_treaty_negotiation_angry_JTF_desc: "파테르 분파는 반게헨나적 성향을 짙게 가지고 있는 정의실현부 일부 세력과 접촉을 시작한 것으로 보입니다. 우리의 군 조직이 에덴 조약에 대한 반발을 떠들어대는 것은 상당히 위험한 신호이기도 합니다. 자신들의 이익을 위해서라면 국가 안보를 해치는 행동이라도 허용된다는 그 사고방식을, 에덴 조약의 성공으로 무릎 꿇릴 필요가 있습니다."

## 게헨나 선도부 디시전
 eden_treaty_negotiation_gehenna_propaganda: "게헨나 프로파간다"
 eden_treaty_negotiation_gehenna_propaganda_desc: "판데모니움 소사이어티가 아무리 광견병에 걸린 개처럼 짖는다고 하더라도, 우리는 앞으로 나아갈 수밖에 없습니다. 우리는 트리니티가 그렇게 위협적인 외부 세력이 아니라는 것을 설득하기 위한 언론 매수 및 친-트리니티 기사들을 만들어 낼 것입니다."
 eden_treaty_negotiation_pro_trinity: "친트리니티적 문화 선동"
 eden_treaty_negotiation_pro_trinity_desc: "우리의 믿음직한 실행부장인 시로미 이오리도 트리니티의 아름다운 제복을 사랑합니다. 트리니티는 멋진 문화, 그리고 고급스러운 의상을 만드는 좋은 학원이며 게헨나 학생들을 매료시킬 수 있는 다양한 (정어리 파이와 옛 도량형을 제외하면) 문화들을 가지고 있습니다. 어찌 게헨나의 소녀들이 트리니티를 사랑하지 않을 수 있단 말인가요?"
 eden_treaty_negotiation_pro_JTF: "정의실현부와의 공동 치안 활동"
 eden_treaty_negotiation_pro_JTF_desc: "정의실현부와의 공동 치안 활동은 게헨나의 불량학생들은 더 화나게 만들 수 있으나, 게헨나 시민들이 '우리의 치안을 지키는 것은 두 학원의 공동전선 덕분'이라는 인식을 품게 할 수 있습니다. 더 나아가서 에덴 조약 ETO의 수립이 이루어진다면, 두 학원의 공동안보까지도 기대할 수 있지 않을까요? 아주 멋지네요!"
 eden_treaty_negotiation_talk_hina: "[ROOT.GetLeader]가 전면에 나서기"
 eden_treaty_negotiation_talk_hina_desc: "[ROOT.GetLeader]가 선도부 일반 부원들을 중심으로, 자신의 친트리니티적 사상을 설파합니다. 지도자에 대한 신뢰가 선도부 내부에 에덴 조약에 대한 지지를 불러 일으킬 것입니다."

