 ### Common
 TRM_nagisa_constitution_kivotos_pan_human_rights: "Guarantee Basic Rights for All Kivotos Citizens"
 TRM_nagisa_constitution_kivotos_pan_human_rights_desc: "Add a human rights clause to the constitution that guarantees equal rights for all Kivotos inhabitants with a halo, regardless of their academy of origin."
 TRM_nagisa_constitution_guarantee_of_beastmen_rights: "Special Rights for Beastmen and Androids"
 TRM_nagisa_constitution_guarantee_of_beastmen_rights_desc: "Add provisions to the constitution to guarantee the rights of the men of Kivotos, as well as beastmen and androids."
 TRM_nagisa_constitution_militia_rights: "Constitutional Basis for Vigilante Corps"
 TRM_nagisa_constitution_militia_rights_desc: "The vigilante organizations operating in Trinity are thoroughly gray-zone entities. It is important to legally guarantee the activities of various Trinity militias by providing a constitutional basis for the establishment of militias that 'recognize the Trinity system,' bringing them within the legal framework."
 TRM_nagisa_constitution_freedom_of_religion: "Guarantee Freedom of Religion"
 TRM_nagisa_constitution_freedom_of_religion_desc: "The Trinity Faith is our most important belief system, but we will guarantee the right to maintain religions other than Trinity's. Of course, this will lead to accusations of sympathizing with 'Second Trinity' ideology, or even attempting to secularize the nation.\n\nTo guarantee freedom of religion in the constitution, we need a way to prove to the Sisterhood that they are not our enemies. Otherwise, we must at least show them that there are 'Sisters of Faith' who can persuade them of the necessity of religious liberty."
 TRM_nagisa_constitution_freedom_of_religions_trigger_tt: "Meet one of the following conditions:\nProof of the Host's Devotion:§g\n£white_dot Complete §Y$TRN_two_church_unity$§! focus\n\n§!Obtain Arius's Cooperation:§g\n£white_dot Complete §Y$TRN_five_clan_republic$§! focus§!\n"
 TRM_nagisa_constitution_designation_of_state_religion: "Establishment of the Trinity Faith as State Religion"
 TRM_nagisa_constitution_designation_of_state_religion_desc: "The Trinity Faith is our most vital belief system; we will strongly state in the new constitution that our national order is based on our faith and that the Trinity Faith is the state religion."
 TRM_nagisa_constitution_establishment_of_consultative_council: "Creation of a Consultative Council"
 TRM_nagisa_constitution_establishment_of_consultative_council_desc: "Inserting a clause into the constitution about expanding voting rights to the general public and creating a parliament will provoke intense backlash. Trinity has long held cultural and social traditions that are fundamentally incompatible with democracy.\n\nThe powers of the council to be guaranteed in the Nagisa Constitution consist only of 'consultation' and 'recommendation,' with no power to create laws or determine the national budget. Nevertheless, many factions in Trinity will view this as equivalent to boarding a train to hell that turns Trinity into a democratic state.\n\nHowever, there are also arguments that 'under Trinity's aristocratic oligarchy, the opinions of ordinary citizens have been completely excluded, and we must create a consultative council to listen to the people's thoughts.'"
 TRM_nagisa_constitution_establishment_of_consultative_council_trigger_tt: "Meet one of the following conditions:\nInternal Reform Will in Trinity:§g\n£white_dot [TRM.GetNameWithFlag] is a §YDemocratic§! nation\n£white_dot Faith issues in the Council resolved with §YModerate measures§!\n£white_dot Complete §Y$TRN_idealistic_approach$§! focus\n£white_dot §Y$TRN_Ajitani_Hifumi$§! appointed as an advisor to Trinity\n\n§!Inflow of Gehenna's Liberalism:§g\n£white_dot [GEH.GetNameWithFlag] completed §Y$GEH_ako_route_focus$§! or §Y$GEH_main_route_focus$§! focus\n£white_dot §Y$GEH_dkzh$§! appointed as an advisor to Trinity\n£white_dot Complete §Y$TRN_start_of_the_eden_treaty_negotiations$§! focus\n£white_dot Complete §Y$TRN_the_route_of_the_sun$§! focus\n\n§!Inflow of Representative Traditions from Local Nations:§g\n£white_dot A §GDemocratic Ally§! exists among §YGreat Powers§! that are not Kivotos nations§!\n\n"
 TRM_nagisa_constitution_anti_democracy_holy_war: "Constitutionalize Anti-Democratic Spirit"
 TRM_nagisa_constitution_anti_democracy_holy_war_desc: "Expanding the Tea Party's oligarchy, composed of Trinity's educated elites, to the uneducated general public would mean destroying Trinity. Even if you give the masses the right to vote, wouldn't they just elect a leader like Cherino or Makoto anyway? We will enshrine in the constitution that democracy is the enemy and an object to be overthrown."
 TRM_nagisa_constitution_establishment_of_consultative_council_OR_anti_democracy_holy_war_tt: "Only one of §Y$TRM_nagisa_constitution_establishment_of_consultative_council$§! or §Y$TRM_nagisa_constitution_anti_democracy_holy_war$§! can be selected."
 TRM_nagisa_constitution_strengthening_federalism: "Strengthening State Autonomy"
 TRM_nagisa_constitution_strengthening_federalism_desc: "Strengthen the autonomy of each state and allow academies integrated into Trinity to engage in independent activities on the international stage, albeit limited."
 TRM_nagisa_constitution_strengthening_federalism_trigger_tt: "Meet one of the following conditions:\nInternal Reform Will in Trinity:§g\n£white_dot [TRM.GetNameWithFlag] is a §YDemocratic§! nation\n\n§!Need for State Autonomy due to Expanded Territory:§g\n£white_dot Own §Gthree or more Capitals§! among the Grand Duchy of Luxembourg, Shanhaijing Senior Allied Academy, Red Winter Federal Academy, Hyakkiyako Allied Academy, Millennium Science School, Kivotos General Student Council, Abydos High School, and Wildhunt Academy of the Arts§!"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty: "Abolition of the Death Penalty"
 TRM_nagisa_constitution_prohibition_of_the_death_penalty_desc: "Trinity's history has been shaped by the torture and oppression of dissidents by the Justina Council. But now things have changed. There will be no more ruthless oppression, and this will be declared by specifying in the constitution that 'the state has no right to kill its citizens.'"
 TRM_nagisa_constitution_guarantee_of_social_basic_rights: "Defining the Fight Against the Five Giants"
 TRM_nagisa_constitution_guarantee_of_social_basic_rights_desc: "The Five Giants refer to the five evils that keep commoners in poverty, as identified by William Beveridge, Director of the London School of Economics, who advocated for the expansion of welfare. We will add a constitutional clause stating that the state has an obligation to resolve Want, Disease, Ignorance, Squalor, and Idleness.\n\nThis is an explicit declaration that Trinity will transition into a 'welfare state' in the long run. It will be a somewhat shocking provision for those who advocate for the free market."
 TRM_nagisa_constitution_reflection_on_past_history: "Reflection on Past History"
 TRM_nagisa_constitution_reflection_on_past_history_desc: "Enshrine a message of reflection in the constitution regarding the crimes committed under the name of Trinity General School, including past acts of torture by the Justina Council.\n\nWhile this is noble and future-oriented, there is a risk that the Sisterhood will perceive it as an insult to their history. To specify 'reflection on the past' in the constitution, we must prepare sufficient evidence to persuade the Sisterhood."
 TRM_nagisa_constitution_reflection_on_past_history_trigger_tt: "Meet one of the following conditions:\nProof of the Host's Devotion:§g\n£white_dot Complete §Y$TRN_two_church_unity$§! focus\n\n§!Sisterhood's Reflection due to Eschatology:§g\n£white_dot At §Rwar§! with [GEI.GetNameWithFlag]§!"

 # Nagisa Gehenna Coring
 TRN_united_gehenna_decisions_cat: "Trinity's Integration of Gehenna"
 TRN_united_gehenna_decisions_cat_desc: "§GTrinity General School§! was born through the §YArchaic Council§!, where Filius, Sanctus, Pater, and numerous other minor academies allied together. Trinity has never stood alone in its history; it has existed through the equal alliance of multiple schools and branch schools. If Trinity is already a confederation of many schools, then a new member joining that confederation is nothing out of the ordinary. Gehenna is neither a colony nor a loser; it will stand in the same place as a full member of the Trinity alliance and a new sister.\n\n...That is the official stance posted on the Trinity government website. Of course, the Host, the Justice Task Force, the factions, and even the former Gehenna know that this noble official document does not contain the absolute truth. §YGehenna Academy§! is completely different from other constituent schools of Trinity. They do not share our faith, the cultural differences are vast, and their liberal spirit does not harmonize with Trinity's noble traditions.\n\nNevertheless, as a good shepherd lays down his life for the sheep (John 10:11), the Tea Party will patiently lead them so they can stand as the §GFourth Pillar§! of Trinity. Even if a lamb cries loudly, would a shepherd abandon it? Just as the benevolent Lord makes the flock lie down in green pastures and leads them beside quiet waters, guiding them along right paths (Psalm 23:2-3), so too shall we do.\n\nCurrent Student Council President of §GGehenna Academy§!: [TRN_gehenna_puppet_leader_loc]"
 
 ## Gehenna Student Council President Decisions
 ### Nagisa -> Resistance decr + Compliance incr simultaneously, Iori -> Resistance decr, Sena -> Compliance incr
 TRN_gehenna_puppet_leader_host: "Kirifuji Nagisa holds concurrent post as Gehenna President"
 TRN_gehenna_puppet_leader_host_desc: "Kirifuji Nagisa concurrently holds the position of Student Council President of Gehenna."
 TRN_gehenna_puppet_leader_host_tt: "§gIf Kirifuji Nagisa concurrently holds the Gehenna presidency, the $TRN_gehenna_puppet_leader_integration_target$ decision will show low resistance reduction and low compliance increase effects.§!"
 TRN_gehenna_puppet_leader_iori: "Appointment of Shiromi Iori as Gehenna President"
 TRN_gehenna_puppet_leader_iori_desc: "Let the Gehenna Prefect Team control the Gehenna Student Council. This will be perceived by Gehenna students as effectively military rule. While helpful for crushing resistance forces, it is not a good choice for winning civilian support."
 TRN_gehenna_puppet_leader_iori_tt: "§gIf Shiromi Iori is appointed as the Gehenna President, the $TRN_gehenna_puppet_leader_integration_target$ decision will show a resistance reduction effect.§!"
 TRN_gehenna_puppet_leader_sena: "Appointment of Himuro Sena as Gehenna President"
 TRN_gehenna_puppet_leader_sena_desc: "Let the Gehenna Emergency Medicine Department control the Gehenna Student Council. This will be perceived by Gehenna students as effectively civilian rule. Given the tradition similar to the Remedial Knights, it is a choice of autonomy that Trinity can easily accept and local residents will be satisfied with. The concern is whether resistance forces can be crushed under Sena's presidency."
 TRN_gehenna_puppet_leader_sena_tt: "§gIf Himuro Sena is appointed as the Gehenna President, the $TRN_gehenna_puppet_leader_integration_target$ decision will show a compliance increase effect.§!"
 
 TRN_gehenna_puppet_leader_integration_target: "Gehenna Student Council Internal Policy in [FROM.GetName]"
 TRN_gehenna_puppet_leader_integration_target_desc: "The Gehenna Student Council President implements management policies for the integration of Trinity and Gehenna."
 
