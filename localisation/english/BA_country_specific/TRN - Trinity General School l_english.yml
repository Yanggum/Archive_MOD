# Eden Treaty
 eden_treaty_negotiation_cat: "Eden Treaty Renegotiation"
 eden_treaty_negotiation_cat_desc: "\n\n\n\n\n\n\nAttempts to end the long-standing conflict and disputes between Gehenna and Trinity have not been entirely absent. The most recent attempt at a peace treaty is the §YEden Treaty§!, which had been pursued since before the Great War through the intervention of the §YGeneral Student Council President§!. Though the peace treaty once faltered, the steadfast determination of both the [GEH.GetLeader] and [TRM.GetLeader] sides has brought working-level negotiators back to the table once more.\n\nHowever, due to §Ypublic dissatisfaction§!, it is difficult for negotiations to be concluded in the short term. The two schools must move beyond mere friendship between their leaders and secure popular support that the citizens of both Trinity and Gehenna can accept.\n\nFurthermore, the §YPater Faction§! and the §Y[GEM.GetNameDef]§! are significant variables in the Eden Treaty. The Pater Faction will attempt to stir up opposition in Trinity through public demagoguery, while the [GEM.GetLeader] side will try to incite the Gehenna public. Whether the renegotiation of the Eden Treaty succeeds lies within a very complex dynamic, and no one dares to be certain of the outcome.\n\n§GSpecial Rules§!: Victory is achieved if the negotiation score is §G75 points§! or higher and at least §Y15 points§! higher than the opposing side.\n\n£GFX_BA_game_rule_flag_GEH £GFX_BA_game_rule_flag_TRM Pro-Eden Treaty Faction: [?global.eden_point_array^0]\n£GFX_BA_game_rule_flag_GEM £GFX_BA_game_rule_flag_TRM Anti-Eden Treaty Faction: [?global.eden_point_array^1]"

 eden_treaty_negotiation_debug_1: "Debug: Pro-Treaty +10 points"
 eden_treaty_negotiation_debug_1_desc: "Nagisa OST - Hifumi Daisuki"
 eden_treaty_negotiation_debug_2: "Debug: Anti-Treaty +10 points"
 eden_treaty_negotiation_debug_2_desc: "The Witch OST - Kyrie Eleison"
 eden_treaty_negotiation_debug_3: "Debug: Pro-Treaty +100 points"
 eden_treaty_negotiation_debug_3_desc: "Nagisa is so lucky to have so much money"
 eden_treaty_negotiation_debug_4: "Debug: Anti-Treaty +100 points"
 eden_treaty_negotiation_debug_4_desc: "I want to achieve financial freedom and never go to work while using Nagisa's credit card"

## Pandemonium Society Decisions
 eden_treaty_negotiation_imperial_metrology: "Trinity-style Imperial Metrology"
 eden_treaty_negotiation_imperial_metrology_desc: "Propagandize to Gehenna students that if the Eden Treaty with Trinity is signed, the metric system will be abolished in favor of the Imperial system. No, maybe it's not just propaganda. If it's those witches from Trinity, they might actually bring the yard-pound system with them! I heard that in Trinity, a 'ton' is 1,016.047 kilograms (2,240 pounds)! That makes me 16.047 kilograms worth of angry!"
 eden_treaty_negotiation_prefect_team_leader_hasumi: "Prefect Team Leader Hasumi Conspiracy Theory"
 eden_treaty_negotiation_prefect_team_leader_hasumi_desc: "What changes will come to Gehenna after the Eden Treaty is signed? Already, Trinity is talking about so-called 'Joint Policing' and trying to conduct security activities in Gehenna. They are essentially breaking ground on a joint military organization called 'ETO.'\n\nYes. Jointly maintaining public order! That means Hasumi, who eats six cups of parfait in one sitting, will settle down in Gehenna, suppress Gehenna's freedom, and even steal Ibuki's pudding. What a terrible and terrifying story! Weekly Pandemonium will spread this news far and wide."
 eden_treaty_negotiation_weekly_pandemonium: "Media Play in Weekly Pandemonium"
 eden_treaty_negotiation_weekly_pandemonium_desc: "Even if the popular appeal of Weekly Pandemonium isn't that high, the media is the best propaganda tool we have. Slanderous articles against both the Prefect Team and Trinity are expected to sway public opinion somewhat."
 eden_treaty_negotiation_talk_makoto: "[ROOT.GetLeader]'s Public Incitement"
 eden_treaty_negotiation_talk_makoto_desc: "Our leader directly denounces the absurdity of the Eden Treaty and the backroom dealings between [GEH.GetLeader] and [TRM.GetLeader] before the masses. It doesn't matter if there's any evidence; what matters is whether we can plant seeds of anxiety in the public's mind."

## Trinity General School Decisions
 eden_treaty_negotiation_trinity_propaganda: "Trinity Propaganda"
 eden_treaty_negotiation_trinity_propaganda_desc: "No matter how much the Pater Faction barks like rabid dogs, we are the ones in power. The important thing is that the various media outlets under our control in Trinity will continue to propagandize the importance of the Eden Treaty and work to weaken hostility towards Gehenna."
 eden_treaty_negotiation_pro_gehenna: "Pro-Gehenna Cultural Incitement"
 eden_treaty_negotiation_pro_gehenna_desc: "Use marketing to make Gehenna's culture appear acceptable, or even elegant, to Trinity students. The best target for this propaganda would be Kurodate Haruna. Although she is a somewhat eccentric woman, she possesses refined speech and manners; through proper editing, we can instill the perception in the public that Gehenna and Trinity are not so different."
 eden_treaty_negotiation_pro_prefect_team: "Joint Policing with the Prefect Team"
 eden_treaty_negotiation_pro_prefect_team_desc: "The Vigilante Crew is no longer the only non-Justice Task Force organization protecting Trinity's peace. From the streets of Eden to rural cottages, executive members of the Gehenna Prefect Team are cooperating in maintaining order. These Gehenna heroes, crushing the Helmet Gang and fascists, will leave a great impression on the public."
 eden_treaty_negotiation_talk_nagisa: "[ROOT.GetLeader] Taking the Lead"
 eden_treaty_negotiation_talk_nagisa_desc: "[ROOT.GetLeader] hosts social parties and book launches to directly persuade the wealthy elite of Trinity. A meeting with the Host carries a surprising power of persuasion."
 eden_treaty_negotiation_remove_host: "Counter Trinity Invasion Rumors"
 eden_treaty_negotiation_remove_host_desc: "To counter rumors that the [GEH.GetLeader] side will join hands with the Filius Faction to invade Trinity, the [ROOT.GetLeader] side proudly goes public with Trinity's current defense policy."
 eden_treaty_negotiation_remove_sardine_pie: "Counter Sardine Pie Conspiracy"
 eden_treaty_negotiation_remove_sardine_pie_desc: "This is a completely absurd conspiracy theory. It's a rumor that will dissipate with just one interview video filmed on the streets of Gehenna."
 eden_treaty_negotiation_remove_angry_JTF: "Address Justice Task Force Internal Backlash"
 eden_treaty_negotiation_remove_angry_JTF_desc: "We will visit the Justice Task Force directly to persuade them of the peace benefits of a Trinity-Gehenna alliance, and convince them that the Pater Faction, which continues its incitement, is the greatest threat to Trinity's security."

## Pater Decisions (AI Selected, Mission Format)
 eden_treaty_negotiation_host: "[eden_treaty_negotiation_host_loc]"
 eden_treaty_negotiation_host_desc: "[eden_treaty_negotiation_host_desc_loc]"
 eden_treaty_negotiation_host_hina: "Sorasaki Hina Trinity Invasion Theory" # Prefect Team Leader Hina
 eden_treaty_negotiation_host_hina_desc: "The Pater Faction claims that the reason the Filius Faction continues to push for the Eden Treaty is to prepare for a coup through cooperation with the Gehenna Prefect Team. According to Pater mouthpieces, Sorasaki Hina, the new leader of Filius, will drive a tank into Eden to succeed the position of Host.\n\nLogically, if such a conspiracy were truly underway, the Host would have already noticed. At the very least, no such conspiracy as foul as rotten tea leaves has reached the Trinity Host's office. The problem is that the somewhat foolish public will be easily agitated."
 eden_treaty_negotiation_host_ako: "Amau Ako Trinity Invasion Theory" # If Hina has defected from the Prefect Team
 eden_treaty_negotiation_host_ako_desc: "The Pater Faction claims that the reason the Filius Faction continues to push for the Eden Treaty is to prepare for a coup through cooperation with the Gehenna Prefect Team. According to Pater mouthpieces, Amau Ako, the new leader of Filius, will drive a tank into Eden to succeed the position of Host.\n\nLogically, if such a conspiracy were truly underway, the Host would have already noticed. At the very least, no such conspiracy as foul as rotten tea leaves has reached the Trinity Host's office. The problem is that the somewhat foolish public will be easily agitated."
 eden_treaty_negotiation_sardine_pie: "Trinity's Pride: Stargazy Pie"
 eden_treaty_negotiation_sardine_pie_desc: "According to the Pater Faction's claims, Gehenna students believe we eat sardine pie every day and share toast sandwiches—bread sandwiched between bread—for breakfast. While there may be various opinions on Trinity's food culture, this is not only an absurd slander but also a ridiculous attempt to divide us by saying Gehenna students think Trinity's cuisine is something of very low quality. However, some Trinitians might actually believe Pater's lies..."
 eden_treaty_negotiation_angry_JTF: "Internal Backlash in the Justice Task Force"
 eden_treaty_negotiation_angry_JTF_desc: "It appears the Pater Faction has begun contacting certain elements within the Justice Task Force who hold strong anti-Gehenna sentiments. It is a very dangerous sign when our military organization starts clamoring against the Eden Treaty. That mindset—which allows for actions that harm national security just for their own interests—must be brought to its knees by the success of the Eden Treaty."

## Gehenna Prefect Team Decisions
 eden_treaty_negotiation_gehenna_propaganda: "Gehenna Propaganda"
 eden_treaty_negotiation_gehenna_propaganda_desc: "No matter how much the Pandemonium Society barks like rabid dogs, we have no choice but to move forward. We will bribe the media and create pro-Trinity articles to convince the public that Trinity is not such a threatening external force."
 eden_treaty_negotiation_pro_trinity: "Pro-Trinity Cultural Incitement"
 eden_treaty_negotiation_pro_trinity_desc: "Even our reliable Executive Officer, Shiromi Iori, loves Trinity's beautiful uniforms. Trinity is a fine academy that creates a wonderful culture and high-quality clothing, and it possesses various cultures (excluding sardine pie and the old metrology) that can fascinate Gehenna students. How could the girls of Gehenna not love Trinity?"
 eden_treaty_negotiation_pro_JTF: "Joint Policing with the Justice Task Force"
 eden_treaty_negotiation_pro_JTF_desc: "Joint policing activities with the Justice Task Force might make Gehenna's delinquent students angrier, but they can instill a perception in Gehenna citizens that 'our security is maintained thanks to the joint front of the two schools.' Furthermore, if the Eden Treaty's ETO is established, couldn't we expect joint security for both academies? That would be quite wonderful!"
 eden_treaty_negotiation_talk_hina: "[ROOT.GetLeader] Taking the Lead"
 eden_treaty_negotiation_talk_hina_desc: "[ROOT.GetLeader] preaches her pro-Trinity ideology, centered around the general members of the Prefect Team. Trust in the leader will inspire support for the Eden Treaty within the Prefect Team."

