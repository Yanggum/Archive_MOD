l_english:
 BEL_GATHERING_STORM_DESC_1: "The sudden invasion by otherworldly forces has plunged the Belgian people into unending suffering of war. The government has collapsed and King Leopold III has gone into exile in the Congo, striving to reclaim the Belgian homeland. Yet Belgium's future remains uncertain. Can Belgium reclaim its land and restore peace in the face of this otherworldly assault?"
 
 BEL_country_intro_header: "§Ythe withered poppy§!"
 BEL_country_intro_content: "Belgium’s recorded history begins in 1790. First established as a republic and later declared a kingdom, Belgium grew into a colonial power—most notably ruling the Congo in Africa—and lived as a low-lying state among the Low Countries. After the devastation of World War I and the desecration of its territory by Germany, it seemed impossible that Belgium would ever be laid waste again.\n\nYet the thread of Belgium was cut without hesitation by the hand of fate.\n\nWhen the ringed girls invaded Europe and destroyed Belgium, King Leopold III and many Belgians fled into exile to the Congo colony in Africa. Unlike the French colonies, which retained many loyal subjects, Belgium’s situation was precarious. Resistance among the local populace in the colony is unceasing and the king’s popularity has plummeted. \n\nThough plagued by disease and hardship in exile, the Belgians there retain a single goal: return to the homeland. Achieving that goal will, however, demand severe sacrifices. They may have to pay dearly to the Congo colony—or perhaps even lose the colony entirely.\n\nThe blood-stained lifeline of finance has become Belgium’s national artery. The heart of this pitiful, forsaken small state—left in the African jungle—may stop in the very colonies it once exploited.\n\n§YDevelopment - Mako§!\n§YAssistant Developer - Pencildude§!"
 BEL_guide: "Objectives\n\n£white_dot. Restore stability within the colonies.\n£white_dot. Industrialize the colonies and hasten preparations to resist the otherworldly invaders.\n£white_dot. Restore the authority of the King and prove yourself a rightful sovereign.\n£white_dot. Whatever the cost, as King reclaim Belgian soil from the invaders."
 
 BEL_Leopold_III_desc: "Leopold III carries a tremendous burden of responsibility. Shortly after ascending to the throne following his father’s sudden death, otherworldly invaders struck Belgium, and he fled to the Congo colony with the Belgian government-in-exile—vowing one day to return to the homeland.\n\nYet the young monarch has failed to serve as a rallying point for the nation. In the Congo, the Belgian king is far from welcomed. Unlike historically powerful France, Belgium has been a minor state in the Low Countries with few colonial subjects loyal to the metropole. In a grim and opaque situation, King Leopold III’s popularity has steadily eroded.\n\nThe Belgian king still struggles to adapt amid a storm of crises. His homeland was seized, and exile in Africa subjects him to the scourge of native resistance movements. Even his armed forces have not yet recovered their strength and remain weak and inefficient.\n\nCan this inexperienced king overcome all of this and emerge as Belgium’s hero?"
 
 # Decisions
 BEL_industrialize: "Industrialize Belgium"
 BEL_industrialize_desc: "In the wake of the otherworldly invasion, Belgium must accelerate industrialization. To overcome the present crisis, Belgium will draft new industrial plans and implement policies to hasten industrial development."
 BEL_industrialize_leopoldvile: "Industrialization of Léopoldville"
 BEL_colony_coreing: "Restoration of Belgium’s colonies"
 BEL_colony_coreing_desc: "The invasion and a subsequent civil war have devastated Belgium’s colonies. To resolve this, Belgium must restore colonial stability and create plans to harness the colonies’ resources."
 BEL_colony_coring: "[FROM.GetName] colony restoration"
 BEL_colony_civil_war: "Colonial civil war in Belgium"
 BEL_colony_civil_war_desc: "The otherworldly invasion has plunged Belgium’s colonies into civil war. To resolve this, Belgium must restore colonial stability and set new plans to utilize colonial resources."
 BEL_powerful_suppress: "Firm repression"
 BEL_powerful_suppress_desc: "The invasion has forced Belgium to strengthen repression within its colonies."
 BEL_occupation_stabilization: "Occupied area stabilization"
 BEL_occupation_stabilization_desc: "Due to the invasion and colonial civil war, Belgium must restore stability in its occupied territories."
 BEL_imperialism: "Foster imperialism"
 BEL_imperialism_desc: "Colonial civil war after the invasion has thrown Belgium into chaos. To remind people of past glories and exploit colonial resources, Belgium must foster imperial sentiment."
 BEL_using_civil_war_decision: "Colonial civil war policy in effect"
 BEL_recov_events.1.t: "Belgian State Emergency Mobilization"
 BEL_recov_events.1.desc: "The invasion has forced Belgium into a state of emergency mobilization. King Leopold III urges the colony’s people to unite and defeat the otherworldly invaders to reclaim the homeland. Yet under the current circumstances, victory still seems a distant prospect."
 BEL_recov_events.1.a: "No other choice"
 BEL_recov_events.2.t: "Speech by Leopold III"
 BEL_recov_events.2.desc: "Having steeled himself, Leopold III ascended the podium. Though he became a leader unexpectedly, there was no alternative. As leader and monarch he had duties to fulfill. In Léopoldville he dressed neatly, combed his hair, and prepared to project regal dignity.\n\nThe people looked up at him. The young king in his thirties felt his heart tremble with nerves. Yet there was no escape, and above all he would not flee. Taking a deep breath, Leopold III spoke slowly and loudly.\n\n“People of the Kingdom of Belgium gathered here, citizens of Flanders and Wallonia. I speak to you now as King of Belgium and as one of you.\n\nYou will remember our homeland—vast meadows, clouds drifting across the sky, and the cities where we once lived in peace. Look at our present. The otherworldly women who appeared without warning not only stole our homeland but wrecked our cities.\n\nBrussels, Antwerp, Liège, Charleroi—beloved homes we left behind, places we lived our lives, we have fled and taken refuge here.\n\nAs your king I must say this: we were defeated by enemies stronger than us. The crisis before us is greater even than that of 1914.\n\nYou have fought for freedom. When we stood against the Netherlands to secure independence, when we fought the German Empire, we joined hands in unity. The enemies on our home soil may now mock us, unaware of the hardships we have endured.\n\nFight for liberty, for the law, and for Belgium. Take up arms, tools, and farming implements. This is both a plea from one Belgian to another and the command of your king. Unity will forge strength, and our red poppies will bloom upon Belgian soil once more.\n\nFor the king, for the law, and for freedom.”"
 BEL_recov_events.2.a: "Long live Belgium! Long live His Majesty the King!"
 BEL_recov_events.3.t: "Colonial Restoration!"
 BEL_recov_events.3.desc: "After long struggles in the colonies, we have at last succeeded in restoring them. Our people, triumphant after hard-fought battles, cheer in the streets. Belgian flags fly proudly and the plazas overflow with people celebrating victory. The government-in-exile returns and the people pledge to open a new era for Belgium. We will devote ourselves to healing the wounds of war and rebuilding the nation. Long live Belgium!"
 BEL_recov_events.3.a: "At last!"
 BEL_recov_events.4.t: "Restoration of Honor"
 BEL_recov_events.4.desc: "At last we have successfully reclaimed Belgian soil from the otherworldly invaders. Under the leadership of the Belgian king, we fought bravely and defended our homeland. This glorious victory demonstrates the resolve and patriotism of the Belgian people. We have cleansed the humiliation and sorrow of exile, restoring Belgium’s pride. Our sacrifices were not in vain. Belgium now stands proudly as a sovereign state in the international community. Together with our allies, we will confront the otherworldly threat and defend liberty and peace. To pass down the homeland to our children with pride, we will accelerate postwar recovery and national development. Belgium’s glory shall endure!"
 BEL_recov_events.4.a: "Long live Belgium!"
 BEL_recov_events.5.t: "Relocation of the Capital"
 BEL_recov_events.5.desc: "Having reclaimed the homeland, we will relocate the capital. Yet Brussels and its residents have vanished, replaced by a Chronos School—an institution of the invaders. Therefore we will move the capital to a city other than Brussels. At present, we may choose a suitable capital among the provinces of Flanders or Wallonia. The choice will determine Belgium’s future."
 BEL_recov_events.5.a: "Ghent"
 BEL_recov_events.5.b: "Charleroi"
 
 # Priorities
 BEL_start_the_state_of_emergency: "Declare National State of Emergency"
 BEL_start_the_state_of_emergency_desc: "Local resistance groups run rampant. You must lead the army to secure control of Léopoldville before it is too late, or Belgium will face annihilation."
 BEL_enhance_the_national_security_law: "Strengthen National Security Law"
 BEL_enhance_the_national_security_law_desc: "No matter how you dress it up, the Congo is in chaos. Until we return to the homeland, control over colonials and metropolitans alike is necessary."
 BEL_greater_federalism: "Develop Africa"
 BEL_greater_federalism_desc: "The Congo is our base for reclaiming the homeland. In this jungle backwater we must achieve industrialization."
 BEL_continue_centralization: "Attract Homeland Investors"
 BEL_continue_centralization_desc: "We have managed contact with those on the mainland resisting the invaders. Homeland businessmen have pledged to invest their fortunes to restore Belgium."
 BEL_recolonize: "Recolonize"
 BEL_recolonize_desc: "The locals yearn for 'freedom' and resist us. We must teach those insolent natives who truly owns the Congo."
 BEL_vassouras_line: "Expand Munitions Factories"
 BEL_vassouras_line_desc: "Without weapons, soldiers cannot fight. Build armament factories to equip our forces."
 BEL_petropolis_line: "Expand Civilian Industry"
 BEL_petropolis_line_desc: "Clear the jungle around Léopoldville and build factories there to prepare for the homeland reclamation."
 BEL_restore_the_coffee_barons: "Revive the Coffee Barons"
 BEL_restore_the_coffee_barons_desc: "Numerous resources—especially coffee and rubber from the Congo—have kept exile-Belgium alive. By expanding this strength we can secure the royal household’s welfare and expand the military."
 BEL_constitutional_monarchy: "Restore the Monarchy"
 BEL_constitutional_monarchy_desc: "Inept though he may be, Leopold III is the King of Belgium. From the nation’s founding onward the king has stood with us. He is a symbol and spiritual anchor for the Belgians."
 BEL_depose_vargas: "Warlord"
 BEL_depose_vargas_desc: "“Weave me into the story of the sea.”"
 BEL_tech_slot_1: "Belgian National University"
 BEL_tech_slot_1_desc: "“Among the ruins, a new academy rises.”"
 BEL_reject_cosmopolitanism: "Belgium First"
 BEL_reject_cosmopolitanism_desc: "“Close ranks—our identity matters.”"
 BEL_ban_political_parties: "Belgian State Department"
 BEL_ban_political_parties_desc: "“Order through centralized governance.”"
 BEL_decree_no_37: "Emergency Decree No. 12"
 BEL_decree_no_37_desc: "“When law is the line between survival and chaos.”"
 BEL_establish_psad: "Belgian Defense Acquisition Directorate"
 BEL_establish_psad_desc: "“Forge the arms for our return.”"
 BEL_federal_employment_plan: "Royal Employment Program"
 BEL_federal_employment_plan_desc: "“Jobs to rebuild, purpose to the people.”"
 BEL_secure_our_borders: "Defend Our Borders"
 BEL_secure_our_borders_desc: "“Fortify our lines against external threats.”"
 BEL_in_vargas_we_trust: "In Vargas We Trust"
 BEL_in_vargas_we_trust_desc: "“For the stability of command in wartime.”"
 BEL_tribunal_de_seguranca_nacional: "National Security Court"
 BEL_tribunal_de_seguranca_nacional_desc: "As the state falters, those with impure intent take up arms and terrorize our citizens. They are a malignant tumor on the nation that must be removed at once. Establishing courts during exile will allow us to try criminals and hand down appropriate sentences."
 BEL_ensure_continued_military_support: "Ensure Continued Military Support"
 BEL_ensure_continued_military_support_desc: "The exile government’s armed forces are among the most critical elements for returning to the homeland. Generous support will strengthen our forces—better equipment and sharper officers being essential."
 BEL_work_with_the_integralists: "Work with the Integralists"
 BEL_work_with_the_integralists_desc: "In a nation in crisis the army is not the only necessity. Belgium has many problems, but some can wait until we are back on the mainland. At least no one wishes for us all to die here in the African jungles."
 BEL_estado_moderno: "Suppress Colonial Civil War"
 BEL_estado_moderno_desc: "“Bring order to the colony by decisive means.”"
 BEL_estado_novo: "Preparations for Reclamation"
 BEL_estado_novo_desc: "“Forge the pillars of return.”"
 BEL_cohen_plan: "The Cohen Plan"
 BEL_cohen_plan_desc: "The immediate crisis has been somewhat resolved. At least our army is not the ragged remnant it was when fleeing Kibotos. The Belgian forces will once more take up arms and look toward the homeland beyond Africa, awaiting the day to return."
 BEL_the_polaca: "Expand Wartime Industry"
 BEL_the_polaca_desc: "“Munitions and steel—the backbone of revival.”"
 BEL_no_matter_the_cost: "Whatever the Cost!"
 BEL_no_matter_the_cost_desc: "“For the homeland, no price is too high.”"
 BEL_invest_in_the_armed_forces: "Buy Off the Military"
 BEL_invest_in_the_armed_forces_desc: "The military is shattered and not especially friendly toward us. Bribing the armed forces will lighten our coffers, but will secure the military firmly on our side."
 BEL_royal_colleges: "[ROOT.Capital.GetCapitalVictoryPointName] Royal College Establishment"
 BEL_royal_colleges_desc: "Education is the highest welfare for all, and doubly important in exile. Scraping and saving scarce funds has finally raised enough money to found a university here in Léopoldville."
 BEL_issue_lordships: "Grant Peerages"
 BEL_issue_lordships_desc: "The military must be strong, but it is also a corruptible body. If we demand service from them they may require 'small' rewards. Presenting noble titles may satisfy them and secure their service."
 BEL_promote_agriculture: "Revival of the Coffee Barons"
 BEL_promote_agriculture_desc: "Belgium’s coffee industry has developed sufficiently. Those who sustained and revived our economy through coffee are dubbed the 'Coffee Barons'."
 BEL_undermine_democracy: "Weaken Parliament"
 BEL_undermine_democracy_desc: "“Concentrate authority for wartime efficiency.”"
 BEL_autarky: "Colonial Economy"
 BEL_autarky_desc: "“Make the colony self-sufficient to sustain the war effort.”"
 BEL_corporatism: "Industrial Consolidation"
 BEL_corporatism_desc: "“Focus industry under centralized direction.”"
 BEL_departamendo_de_propaganda: "Department of Propaganda"
 BEL_departamendo_de_propaganda_desc: "“Shape public sentiment for national recovery.”"
 BEL_departamento_de_ordem_politica_e_social: "Department of Political and Social Order"
 BEL_departamento_de_ordem_politica_e_social_desc: "“Maintain social order during reconstruction.”"
 BEL_uruguay_ultimatum: "Belgian Civil Liberation Army"
 BEL_uruguay_ultimatum_desc: "“An organized force for civil liberation.”"
 BEL_brazil_integral: "National Unification"
 BEL_brazil_integral_desc: "“Rally the populace under a single banner.”"
 BEL_departamento_feminino: "Anti-Kibotos Policy"
 BEL_departamento_feminino_desc: "“Address threats peculiar to the invader.”"
 BEL_integrity_of_the_fatherland: "For the Fatherland"
 BEL_integrity_of_the_fatherland_desc: "“Honor and unity above all.”"
 BEL_end_military_interference: "Bicycle Infantry"
 BEL_end_military_interference_desc: "“Light, mobile forces for internal security.”"
 BEL_develop_transporter: "Develop Transports"
 BEL_develop_transporter_desc: "“Improve logistics for the return.”"
 BEL_endless_landing_army: "Endless Landing Army"
 BEL_endless_landing_army_desc: "“Prepare vast amphibious forces for reclamation.”"
 BEL_establish_the_brazilian_investment_bank: "Establish Investment Bank"
 BEL_establish_the_brazilian_investment_bank_desc: "“Provide capital for reconstruction and industry.”"
 BEL_congo_army_factory: "Congo Army Factory"
 BEL_congo_army_factory_desc: "“Local production to sustain our forces.”"
 BEL_implement_article_138: "Enact Article 138"
 BEL_implement_article_138_desc: "“Legal foundations to restore colonial governance.”"
 BEL_tech_slot_2: "Infrastructure Expansion"
 BEL_tech_slot_2_desc: "Focus capabilities on rebuilding and expanding Congo's war-damaged infrastructure. This will form the foundation for economic development."
 BEL_posts_for_generals: "Increase Rubber Production"
 BEL_posts_for_generals_desc: "Raise rubber output in the Congo to help sustain military expansion. This will aid maintaining Belgian military presence in the Congo."
 BEL_united_states_of_br: "Increase Congolese Autonomy"
 BEL_united_states_of_br_desc: "Grant more autonomy to Congolese people and reflect their voices in policy. This will contribute to improved Belgium–Congo relations."
 BEL_third_republic: "Expand Tungsten Imports"
 BEL_third_republic_desc: "Increase tungsten imports from the Congo to bolster military expansion. This will help sustain Belgian military power in the region."
 BEL_combat_separatism: "Weaken Separatism"
 BEL_combat_separatism_desc: "Eliminate remaining Congolese separatist threats to achieve national integration. Reinforce Belgian sovereignty in the Congo."
 BEL_war_bonds: "Raise War Recovery Funds"
 BEL_war_bonds_desc: "Issue war bonds to raise funds for prewar damage recovery. This will accelerate reconstruction in the Congo."
 BEL_the_international_c: "Counter Syndicalist Threat"
 BEL_the_international_c_desc: "Counter syndicalist forces in the Congo and curtail their influence. Prevent their spread and promote stability in the Congo."
 BEL_invite_foreign_com: "Invite Foreign Companies"
 BEL_invite_foreign_com_desc: "Invite foreign firms to the Congo to stimulate economic development. This will help revitalize the Congolese economy."
 BEL_address_labor_disp: "Resolve Labor Disputes"
 BEL_address_labor_disp_desc: "Resolve labor disputes in the Congo and protect workers’ rights. This will stabilize the labor force."
 BEL_impement_article_17: "Implement Article 17"
 BEL_impement_article_17_desc: "Enforce the treaty provisions regarding Congo governance to strengthen Belgium’s control. This will promote Belgium–Congo integration."
 BEL_land_1st_2: "Land Reform Bill, Phase 2"
 BEL_land_1st_2_desc: "Implement the second land reform bill to develop Congolese agriculture. Focus on readjusting land ownership and building agricultural infrastructure."
 BEL_shipyard: "Congo Shipyard"
 BEL_shipyard_desc: "Establish a Belgian warship construction yard in the Congo to bolster military capacity. This will assist maintaining Belgian naval power in the region."
 BEL_implement_a_national_guard: "Establish a National Guard"
 BEL_implement_a_national_guard_desc: "Create a National Guard in the Congo to strengthen Belgian rule. This will help sustain military presence."
 BEL_import_oil: "Increase Oil Imports"
 BEL_import_oil_desc: "Expand oil imports to the Congo to stabilize energy supplies. This will contribute to industrial development."
 BEL_massive_recruit_plan: "Mass Recruitment Plan"
 BEL_massive_recruit_plan_desc: "Implement mass recruitment in the Congo to reinforce Belgian rule. This will assist in maintaining Belgian military strength in the colony."
 
 BEL_reward_army_loyalty: "Found an Air Force"
 BEL_reward_army_loyalty_desc: "Establish a Belgian air force in the Congo to strengthen military capacity. This will aid in sustaining Belgian military presence there."
  
 BEL_reinvigorate_the_navy: "Found a Navy"
 BEL_reinvigorate_the_navy_desc: "Establish a Belgian navy in the Congo to expand military capability. This will help maintain Belgian maritime power in the region."
 
 BEL_united_industrial_states_of_belgium: "Belgian Industrial State"
 BEL_industrial_states_of_belgium_modifier: "Belgian Industrial State"
 BEL_united_industrial_states_of_belgium_desc: "Establish an industrial state to accelerate Belgium’s industrialization. This will contribute to economic development."
 
 BEL_empire_of_brazil: "...to the homeland"
 BEL_reclaim_territory_in_south_america: "Strip Jurisdiction"
 BEL_reclaim_territory_in_south_america_desc: "“Adjust overseas claims to suit national strategy.”"
 BEL_restoration_of_honor: "Restoration of Honor"
 BEL_restoration_of_honor_desc: "Under the leadership of the Belgian king we have defeated the otherworldly invaders and reclaimed the homeland in a great victory. Cleansing the pain of exile and restoring the nation’s honor, we will devote ourselves to postwar recovery and national development to leave a proud Belgium to future generations. Long live Belgium!"
 
 BEL_use_the_national_security_law: "Fury of Battle"
 BEL_use_the_national_security_law_desc: "“Invoke emergency statutes to secure the realm.”"
 
