 BEL_nationalized_banks_desc:0 "Nationalize banks in the Congo to strengthen government control and promote economic development. This may, however, burden consumer goods production."
 BEL_tax_haven:0 "Tax Haven"
 BEL_tax_haven_desc:0 "Utilize the Belgian Congo as a tax haven to attract foreign capital. This aids political power and reduces consumer goods ratios."
 BEL_article_138:0 "Enact Article 138"
 BEL_article_138_desc:0 "Enact constitutional Article 138 on colonial governance to legally underpin Belgium’s rule in the Congo. This will improve national stability and war support."
 BEL_new_congo_governance:0 "New Congo Governance"
 BEL_new_congo_governance_desc:0 "Reform and modernize the Congolese governance system. This secures legitimacy for Belgian rule and raises stability."
 BEL_congo_separatism:0 "Congo Separatism"
 BEL_congo_separatism_desc:0 "Separatist activities continue in the Congo. Their threat negatively impacts national stability and troop recruitment."
 
 BEL_fight_for_liberation: "Fight for Liberation"
 BEL_fight_for_liberation_desc: "“Stand firm and reclaim what is ours.”"
 
 
