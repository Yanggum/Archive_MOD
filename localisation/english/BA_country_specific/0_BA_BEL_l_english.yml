 # Belgian Story Archive
 BEL_story_archive: "Story Archive"
 BEL_show_story_archive_gui: "Show Belgian Story Archive"
 BEL_show_story_archive_gui_desc: "Browse side stories connected to Valkyrie and Belgium. These are unrelated to game systems and exist solely for narrative enjoyment about in-game nations. New stories may be added over time as events pass. Please enjoy."
 
 # Story Events
 BEL_story_event.1.t: "When the Snow Fell"
 BEL_story_event.1.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nIt was probably last Christmas. A boy grinned brightly as church bells rang down the streets of a small Walloon village. Although the Belgium he had known had long since vanished, the boy felt happy. At fifteen years old the notion of a homeland was unfamiliar—something that might or might not exist in his life. Apart from Valkyrie Police Academy students patrolling the streets, the Christmas night was peaceful.\n\nA knock sounded at the door. With his only family—his father—at work, the boy opened it to find a short-haired blonde girl of striking beauty standing before him. Bowing slightly with a smile, she handed him a document written in French. Entranced by her, the boy signed his father’s name on the form and let the girl go.\n\nThe boy’s face flushed like Santa’s coat. The way she smiled, a scattering of snow in her hair, and the distinctive uniform—it was enough to set the heart of a boy just awakening to love racing.\n\nHe drew a ragged breath and curled inward to calm himself. He longed to know her name. Bursting from the door, he searched the neighborhood for her, pacing until his shoes nearly came off. But the girl he sought had long gone. He wandered for hours until his father scolded him, worried, for being out so late.\n\nThe snow fell through the night, whitening the village lanes. That night the boy could not sleep, replaying the image of the girl—more beautiful than any bouquet—over and over.\n\n“If only I could see her face again...”"
 BEL_story_event.2.t: "Face to Face"
 BEL_story_event.2.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThe boy lifted heavy eyelids and opened his eyes to find his father’s Christmas present and a note saying he would be late again because of work. He sighed and ate the breakfast his father had prepared. After the damp bread and lukewarm milk he set off for school as usual.\n\nEven on the way the boy could think of nothing but the girl he had seen the day before. Her image both pained and thrilled his heart; he could not forget her dazzling presence. He sighed the whole way, unable to hide his agitation.\n\nValkyrie Academy guards patrolled the route, and he assumed she would not be among them. Though he had seen many girls in the same uniform yesterday, the one he sought was nowhere to be seen. Just as he considered passing by, a face caught his eye.\n\nThere she was: short blonde hair, porcelain skin, and violet eyes that contrasted with everything else.\n\nThe boy was speechless. The one he had walked until his shoes were worn to find was here. He held his breath, unsure how to speak. Something lodged in his throat. His face flushed crimson.\n\nThen the girl walked closer, curiosity bright on her face—unaware that she was the cause of his racing heart.\n\nShe put her hand in her pocket and looked at him."
 BEL_story_event.3.t: "Opening Her Lips"
 BEL_story_event.3.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n“You’re the one, aren’t you? The kid who signed his dad’s name on the form yesterday?”\n\nShe smiled as she asked. The boy, stunned, nodded like a broken automaton. She laughed, told him her name, and brushed his shoulder playfully.\n\n“I’m Sakumi. I’ll be on guard duty here from now on. We’re watching this place, so you’ve nothing to fear. I promise.”\n\nShe continued, smiling, but the boy heard nothing further; it felt like a dream, like a goddess had descended. He was utterly smitten by her beauty—and the innocent, lovable side she showed drew him deeper still.\n\n“Hey?”\n“...Ah!”\n\nSnapping back to himself, he apologized and attempted to dash for school. Something caught his ankle and held him back. He steadied himself, turned, and returned to stand before her.\n\n“Uh? What’s wrong?”\n“...Well... Sakumi—senpai...! I... I want to—!”\n“...be friends with you...!”\n\nHis face burned. Sakumi, perceptive and amused, seemed to understand his heart and nodded. He smiled and thanked her.\n\nThe snow continued to fall gently, an emblem of that decision."
 BEL_story_event.4.t: "Growing Friendship"
 BEL_story_event.4.desc: "\n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nA week had passed since the snow. Most of it had melted and only occasional ice patches remained—enough to send passersby slipping now and then. After school one day the boy prepared to return home when a familiar voice called.\n\n“Hey~”\n\nIt was Sakumi. He greeted her with the brightest smile. Bringing her into an empty classroom, he chatted about his day—the trivialities from a friend choking on bread to teachers’ petty demands. For Sakumi, such talk was sparse; her days were repetitive guard duties and training. The boy’s stories were fresh and entertaining to her, even if predictable.\n\n“...So Mr. Jang was really something. He piles on homework—my head’s about to burst...”\n“Ufufu, isn’t that proof he cares? You’re lucky to have a teacher like that.”\n“Senpai! You’re supposed to sympathize with me here...!”\n\nThough flustered by having the one he liked right before him, the boy stammered on and Sakumi listened earnestly, smiling until her mouth nearly touched her ears. That day Sakumi stayed at school to hear him out, and their youthful days began to blossom."
 BEL_story_event.5.t: "A Small Conversation"
 BEL_story_event.5.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nSakumi was an ordinary student at the Valkyrie Police Academy—never special, only dutiful. She carried a rifle on her back, monitored locals, and spent ordinary days on patrol. Then she met the boy who became her new friend; she could tell he liked her.\n\n“Mr. Jang wasn’t pestering you today?”\n“He’s useless to argue with... He overloaded us with homework again. You know French, right? Don’t students like you need to learn our language instead?”\n“He learned French because he’s from the nation—our elders want the language we use taught to the locals.”\n\nThe boy sighed; learning a foreign tongue was a headache. Sakumi pondered for a moment and then led him to a place she knew. He followed, full of curiosity; she merely smiled and said he’d see.\n\nThey arrived at a broad lake, thawed puddles, and a bird-filled promenade—places he had never known existed near his neighborhood. He remarked on the surprise as they walked.\n\n“Staying out here wandering? Come sit with me.”\n“Uh...? Okay...”\n\nSitting together on a rock large enough for two, Sakumi patted the space beside her. The boy shyly sat. Sakumi looked at him with a smile and then opened her mouth.\n\n“Hey, you like me, don’t you? Right?”"
 BEL_story_event.6.t: "Beneath the Birds’ Singing Sky"
 BEL_story_event.6.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n“W-what...? Why all of a sudden...!”\n“It’s written all over your face, Bangsang. Just answer me: do you like me?”\n\nHe could not speak. He had indeed fallen at first sight; in a week he had learned her kindness and how she’d never been a burden to him or his father. Still he could not form the words; it felt as if a bomb of emotion was about to explode in his head.\n\n“Th-that is...”\n\nSakumi smiled and his name escaped—her expression seemed struck by the truth. Though only a week had passed, Sakumi too appeared to be falling for him. She placed her hand on his, and he startled, trying to pull away.\n\n“Eh...? Bangsang...?”\n“Se-senpai...! Wait, I’m not ready—! Aaah...!”\n“Bangsang!”\n\nHe managed to free his hand but tumbled over the rock. She tried to steady him and lost balance herself.\n\nWhen consciousness returned, both were covered in dirt and leaves, tangled in an awkward embrace. Bangsang opened his eyes slowly. The girl’s face hovered before him. Embarrassed, both sat speechless, cheeks aflame.\n\nOnly the birds chattered in that silence.\n\nThen the boy broke the quiet with his voice."
 BEL_story_event.7.t: "Hearts Close"
 BEL_story_event.7.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThe boy produced something he had wanted to give all along—a single flower, battered by his weight but still intact: a lovely lisianthus of a striking color. Sakumi smiled and stroked his leaf-mussed hair.\n\n“It’s a lisianthus—such a pretty hue. Did you search for this all winter for me?”\n“...Yes...”\n\nHe nodded, eyes glassy. She tucked the flower behind her ear, the pale blonde hair and the violet petals forming a soft contrast. He looked at her, amazed; she blushed and smiled shyly.\n\n“I’ll keep it safe—because you gave it to me.”\n\nShe hugged him tightly, and he, overwhelmed with happiness, cried as he returned the embrace.\n\nTwo hearts beat against one another—his as rapid as a drum, and hers matching the same pace."
 BEL_story_event.8.t: "Rumors" # Condition: Wakamo escape
 BEL_story_event.8.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nBad rumors had recently spread among Valkyrie students: that the calamity-fox Kosaka Wakamo had broken out of prison and was terrorizing the Walloon region once patrolled by Valkyrie Police. Sakumi hoped it wasn’t true—she prayed that the fox would not attack this town. Sitting in an empty classroom of the boy’s middle school, Sakumi collected her thoughts.\n\n“Senpai! Where have you been?”\n\nBangsang, unaware of her troubled thoughts, ran up and hugged Sakumi. As she had for the past month, she patted his head. But behind the bright smile she displayed while hugging him lay a secret darkness.\n\n“Senpai!”\n“U-umph...?”\n“Are you okay, senpai? You weren’t answering when I called...”\n\nThe boy grew anxious, fearing she had grown tired of him. In truth she had not; she had spent every day for a month with his father and Bangsang, becoming practically family. Yet Bangsang’s expression clouded as if he did not know her burden.\n\n“Bangsang... it’s that—”\n\nShe opened her mouth to tell him but could not bring herself to reveal the truth. How could the boy understand the calamity-fox? Still, there was no hiding it forever from the locals. Sakumi swallowed and, cold as she was, began to explain slowly the events unfolding around them.\n\n“I’ll explain—actually...”"
 BEL_story_event.9.t: "I Will Not Run, Never"
 BEL_story_event.9.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n“That’s how it is.”\n\n“...I see...?”\n\nAfter hearing everything, the boy looked at her as if struck dumb—he understood nothing. He believed Wakamo to be some terrifying being in her world. Sakumi trembled with fear, seeming afraid of losing someone. The expression on her face was one he had once seen on his father. The boy steadied himself and met her with resolve.\n\n“You’re a Valkyrie Academy student—you’ve endured hardship. You’ve faced pain and seen injured comrades.”\n\n“But... if you get hurt...? One bullet could kill you. It’s that simple.”\n\n“Will you keep living in fear because I might die? If you’re worried about losing me, isn’t your duty as my protector to shield me and my father however you can?”\n\n“...!”\n\nSakumi’s eyes trembled. He was right. If she stood at the front and protected Bangsang and his father, there would be less to fear. Better than sobbing at her own helplessness was action. Tears fell from Sakumi’s cheeks and she repeatedly apologized while hugging Bangsang. He comforted her, patting her back.\n\nAfter his mother’s death, he had promised himself never to cry again."
 BEL_story_event.10.t: "Preparations"
 BEL_story_event.10.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nValkyrie students began preparing to defend their small town. Though the possibility of Wakamo attacking was remote, they braced for the unlikely. Sakumi hefted her weapon—a Valkyrie Police Academy shotgun.\n\nIn truth, Valkyrie wasn’t the glorious institution some boasted of; having missed Wakamo several times and watched Kibotos suffer, it felt ineffectual. Nevertheless, Sakumi readied herself, recalling Bangsang’s words to steady her heart.\n\n“Are you scared...? Sakumi?”\n“...I’m fine, Io. Really.”\n\nHer friend Io worried for her, but Sakumi steeled herself with thoughts of Bangsang’s encouragement.\n\n“I’ll protect them... no matter what...”\n\nHer determination was stronger than ever—the will to throw herself into danger to protect the one she loved. The sun began to set and her resolve burned bright."
 BEL_story_event.11.t: "Battle"
 BEL_story_event.11.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nGunfire continued and flames painted the sky red. An undefeatable foe and wounded comrades surrounded Sakumi. Wiping blood from her brow, she stared at the woman before her—the calamity-fox Kosaka Wakamo.\n\n“Ugh... sob...”\n\n“Typical Valkyrie Academy—so easy to break,” Wakamo taunted.\n\nThat reaction was expected. Ten minutes into the fight, most Valkyrie students were incapacitated; only Sakumi remained, dragging a broken left arm and glaring at Wakamo.\n\n“Why resist so fiercely? Do you have someone precious to protect? Heh... If I’m right, you’d do well to fold those feelings away. People betray one another in time. Even those you trust will toy with you. Aren’t you like that?”\n\n“...Shut your mouth...”\n\nSakumi leveled her shotgun at Wakamo. The fight was lost—if Wakamo passed this barricade, catastrophe was certain.\n\n“You will not pass... you... will never...!”\n\n“...Hah... What a nuisance. You’re insufferable, you know that?”\n\nWakamo drew a rifle with blinding speed, shot Sakumi’s right hand and sent her shotgun spinning. As the bullet lodged in her hand, Wakamo stepped past.\n\n“...I can’t fall... I mustn’t...”"
 BEL_story_event.12.t: "Plea"
 BEL_story_event.12.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nWakamo walked toward the town, executing a meticulously planned terror—not only against local towns and villages but even Valkyrie facilities. One final strike on this town would have finished everything.\n\nBut something held her back.\n\n“...You can’t go... not here...”\n\nSakumi’s body was riddled with wounds—left arm broken, right hand shot, bleeding from every place that could bleed. Yet she flung herself at Wakamo’s leg and begged with tears and blood.\n\n“Please... don’t touch this place... It may be tiny to you, but it means everything to me. Please—just turn away and let people like Bangsang live on... let him have a life...”\n\n“....”\n\nShe cried blood-tinged tears as she implored. Wakamo stood still, staring. She could easily ignore the dying meat before her and proceed with her plan.\n\n“...Ugh...?”\n\nSensing an absence at her feet, the girl looked up. Wakamo had already disappeared. Whether the plea changed her mind, or she judged the town worthless, Sakumi could not know. She could only weep and offer thanks that, for now, the town was spared.\n\n“It’s safe—at least for now...”"
 BEL_story_event.13.t: "Return"
 BEL_story_event.13.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThe flames no longer consumed anything. Snow fell as when the boy first found the girl. He searched the town tirelessly for her, fearing she might have died protecting them.\n\n“Senpai!! Sakumi!!”\n\nHis cries met only silence and his tears flowed freely. He feared she had perished protecting him. He wandered the battlefield, convinced she was dead.\n\n“...Bangsang...”\n“...!”\n\nHe turned and found her—wounded and ragged, but alive. The boy burst into hot tears and wrapped her tightly. She, with her functioning right arm, hugged him back.\n\n“I thought you were dead... I thought you died protecting us!”"
 BEL_story_event.14.t: "In the Snowy Ruins"
 BEL_story_event.14.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\n“Did you think I’d die, Bangsang? I won’t. How could I leave you? We still have so much to do—we’re not finished yet. I won’t go to heaven before that.”\n\nTo calm the boy on the brink of collapse, she reassured him repeatedly that she would not leave. He cried for her sacrifices; she wiped his tears and then pressed her lips to his. It lasted only ten seconds but felt eternal. Bangsang blushed in astonishment.\n\n“Everything will be fine now. Even if the calamity-fox returns, my friends and I will do everything to protect you. Don’t worry about me—I won’t die from most bullets.”\n\nShe wiped tears away and smiled gently at him as when they first met. He held her tightly and felt no pain.\n\n“Let’s not be sad anymore.”"
 BEL_story_event.15.t: "That Sunny Day"
 BEL_story_event.15.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nThe snow ceased and sunlight bathed faces and houses. The boy and girl enjoyed a weekend date hand in hand. He wore the happiest smile and she too seemed content. They sampled street food, bought clothes, and visited a small café.\n\n“Bangsang, does this outfit suit me?”\n“You look good in anything, senpai. Hehe, but this one looks even better!”\n\nHe held up a pale-lilac blouse and she tried it on. They strolled through a bakery, tasted coffee together for the first time, and revisited the spot of their first kiss. He found complete happiness—could die content in that moment.\n\nHer lisianthus remained tucked behind her ear, battered but cherished. Even shopkeepers asked why she wore such a ruined flower; she would only say it was a precious gift from the one she loved.\n\n“Senpai... the flower’s almost falling apart. Should I find a new one?”\n“No way! Throw away my first present? Even if it fades I’ll keep it in my ear forever, Bangsang.”\n\n“Ah... senpai...!”"
 BEL_story_event.16.t: "A Love Unchanged"
 BEL_story_event.16.desc: "n\n\n\n\n£GFX_texticon_BA_story_archive_test \n\n\n\n\n\nSakumi smiled with the lisianthus behind her ear, and they continued their happy days together. As sunset colored the streets orange, she stroked his head.\n\n“Shall we call it a day? It’s sad to part, but there’s always tomorrow.”\n\n“...Let’s. No matter how many times we part, it always hurts...”\n\nShe brushed his hair and smiled. For at least a year they would be safe, she thought, and laughed. As she tenderly touched his head, a man leapt from between buildings holding an object and screamed at Sakumi.\n\n“You worthless bitch... die!!”\n“...! Senpai...!”\n“This is...!”\n\nA small, grim man with dark circles brandished a Halo-breaking bomb—if it detonated, both Bangsang and Sakumi would surely die. The boy froze in shock; Sakumi had not fully recovered from her injuries and could not run as she might have before.\n\nShe cursed the sky. Why now? Why after everything seemed to be ending? Why—"
